<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№91 · Rotorelief Loop</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#FF5A1F; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(13,13,13,0.6); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to spin the field</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.91 Rotorelief Loop: seeded PRNG "Rotorelief Loop", 48 bars, rigid plate, 1 rev per 24s
const BARS=48;
let extraSpin=0, spinVel=0, dragging=false, lastAng=null, lastMs=null;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(!dragging && Math.abs(spinVel)>0.0001){ extraSpin+=spinVel*dt; spinVel*=Math.exp(-dt*1.8); }
  const t=nowMs/1000;
  ctx.fillStyle='#FF5A1F'; ctx.fillRect(0,0,w,h);
  const S=Math.min(w,h);
  const cx=w/2, cy=h/2, R=S/2;
  const rot=(t/24)*Math.PI*2+extraSpin;
  const taperDir=0.7;
  ctx.fillStyle='#0D0D0D'; ctx.strokeStyle='#0D0D0D'; ctx.lineCap='round';
  for(let i=0;i<BARS;i++){
    const baseA=(i/BARS)*Math.PI*2;
    const a=baseA+rot;
    const taper=1-0.45*(0.5+0.5*Math.cos(baseA-taperDir));
    const r0=R*0.30, r1=R*0.30+(R*0.92-R*0.30)*taper;
    ctx.lineWidth=S*(0.020+0.014*taper);
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0); ctx.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1); ctx.stroke();
  }
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(cx,cy,R*0.22,0,Math.PI*2); ctx.fill();
  if(BARS!==48) console.assert(false,'bars',BARS);
  return {};
}
function angAt(e){ const [w,h]=viewportWH(); return Math.atan2(e.clientY-h/2, e.clientX-w/2); }
canvas.addEventListener('pointerdown',e=>{ dragging=true; spinVel=0; lastAng=angAt(e); });
canvas.addEventListener('pointermove',e=>{ if(!dragging||lastAng===null) return; const a=angAt(e); let d=a-lastAng; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; extraSpin+=d; spinVel=d*8; lastAng=a; });
function endP(){ dragging=false; lastAng=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(3000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
