<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Particles</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0C0E; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Water Particles: a dark river of particles flows across the frame.
   Four language-colors ride the current, slate blue, olive green,
   terracotta and steel grey. They never mix into brown: each particle
   keeps its own color and follows the one ahead in its lane, like
   water particles following each other, forming braided currents that
   split around a crumbling rock slightly right of center and rejoin
   downstream. Each color leaves a faint pale gold harmonic trail.
   The flow never stops and never repeats exactly. Watch only. */
var TAU = Math.PI * 2;
var BG = '#0A0C0E';
var BLUE = '#4A6B8A';
var OLIVE = '#6B7A3A';
var TERRA = '#C06B4A';
var STEEL = '#8A8F94';
var GOLD = '#D9C08A';
var ROCK = '#20242A';
var ROCK_EDGE = '#3E444D';
var ROCK_DARK = '#14171A';
var PLATE = '#101315';
var PLATE_LINE = 'rgba(217,192,138,0.45)';
var TITLE_INK = '#EDE6D2';
var HINT_INK = '#D9C08A';
var COHORTS = [BLUE, OLIVE, TERRA, STEEL];
var SEED0 = 1887;
var FRAME_T = 40.0;      /* fixed phase: mid-flow, split already visible */
var ROCK_X = 0.58, ROCK_Y = 0.50, ROCK_RX = 0.105, ROCK_RY = 0.16;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- deterministic geometry: rock, crumbs, glints, particles ---- */
var rockPts = [];    /* normalized polygon points around ROCK_X, ROCK_Y */
var cracks = [];     /* {x1,y1,x2,y2} normalized crack segments on the rock */
var crumbs = [];     /* {x,y,r,ph,drift} small rock fragments downstream */
var glints = [];     /* {x,y,r,ph} pale gold shimmer points on the current */
var particles = [];  /* {c, lane, x, y, vx, vy, sp, r, ph, trail:[]} */
var LANES = [0.16, 0.30, 0.44, 0.58, 0.72, 0.86];
(function buildGeometry() {
  var rng = mulberry32(SEED0);
  var i, k, a;
  /* crumbling rock: jagged 13-point polygon, wider at the base */
  for (i = 0; i < 13; i++) {
    a = (i / 13) * TAU - Math.PI / 2;
    var rr = 0.70 + rng() * 0.48;
    var px = ROCK_X + Math.cos(a) * ROCK_RX * rr;
    var py = ROCK_Y + Math.sin(a) * ROCK_RY * rr * (Math.sin(a) > 0 ? 1.10 : 0.90);
    rockPts.push({ x: px, y: py });
  }
  /* cracks radiating from the rock's upper face */
  for (k = 0; k < 5; k++) {
    var cx = ROCK_X + (rng() * 2 - 1) * 0.05;
    var cy = ROCK_Y - 0.06 - rng() * 0.08;
    cracks.push({ x1: cx, y1: cy, x2: cx + (rng() * 2 - 1) * 0.05, y2: cy + 0.05 + rng() * 0.06 });
  }
  /* crumbs: small fragments breaking off the downstream face only */
  for (i = 0; i < 12; i++) {
    crumbs.push({
      x: ROCK_X + 0.07 + rng() * 0.15,
      y: ROCK_Y + (rng() * 2 - 1) * 0.15,
      r: 0.003 + rng() * 0.005,
      ph: rng() * TAU,
      drift: 0.004 + rng() * 0.010
    });
  }
  /* glints: pale gold shimmer points riding the current */
  for (i = 0; i < 26; i++) {
    glints.push({ x: rng(), y: 0.08 + rng() * 0.84, r: 0.8 + rng() * 1.8, ph: rng() * TAU });
  }
  /* particles: 4 cohorts, 60 each, held close to six lanes so the
     colors braid rather than scattering into a starfield */
  for (k = 0; k < 4; k++) {
    for (i = 0; i < 60; i++) {
      var lane = LANES[Math.floor(rng() * LANES.length)];
      particles.push({
        c: k,
        lane: lane + (rng() * 2 - 1) * 0.02,
        x: rng(),
        y: lane + (rng() * 2 - 1) * 0.03,
        vx: 0, vy: 0,
        sp: 0.024 + rng() * 0.020,
        r: 1.8 + rng() * 1.8,
        ph: rng() * TAU,
        trail: []
      });
    }
  }
})();
/* ---- flow field: downstream drift, meander, split around the rock ---- */
function flowAt(p, t) {
  var meander = 0.028 * Math.sin(p.x * 7.0 + p.c * 1.7 + t * 0.10);
  var vx = p.sp;
  var vy = meander + 0.012 * Math.sin(p.x * 11.0 + p.ph + t * 0.07);
  /* spring back toward the particle's home lane */
  vy += (p.lane - p.y) * 0.22;
  /* split around the rock: push out along the ellipse normal and
     sweep past on the side the particle is already on */
  var dx = (p.x - ROCK_X) / ROCK_RX;
  var dy = (p.y - ROCK_Y) / ROCK_RY;
  var d2 = dx * dx + dy * dy;
  if (d2 < 2.1 && d2 > 0.0001) {
    var d = Math.sqrt(d2);
    var push = (1.0 - d / 1.45) * 0.055;
    if (push > 0) {
      vx += (dx / d) * push * 0.35;
      vy += (dy / d) * push;
    }
  }
  return { vx: vx, vy: vy };
}
/* One fixed simulation step. Follow-the-leader: within each cohort,
   a particle steers a little toward the particle ahead of it (the
   next one downstream), so each color travels as a following chain. */
function stepSim(dt, t) {
  var i, j, k, p, f, lead, dx, dy, dl;
  /* leaders: per cohort, indices sorted by x, descending */
  for (k = 0; k < 4; k++) {
    var idx = [];
    for (i = 0; i < particles.length; i++) if (particles[i].c === k) idx.push(i);
    idx.sort(function (a, b) { return particles[b].x - particles[a].x; });
    for (j = 0; j < idx.length; j++) {
      p = particles[idx[j]];
      lead = particles[idx[(j + 1) % idx.length]];
      if (j === idx.length - 1) lead = null;
      f = flowAt(p, t);
      p.vx = f.vx; p.vy = f.vy;
      if (lead && lead !== p) {
        dx = lead.x - p.x; dy = lead.y - p.y;
        dl = Math.hypot(dx, dy);
        if (dl > 0.02 && dl < 0.30) {
          p.vx += (dx / dl) * 0.006;
          p.vy += (dy / dl) * 0.006;
        }
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.y = clamp(p.y, 0.04, 0.96);
      if (p.x > 1.03) {
        p.x = -0.03;
        p.y = p.lane + (Math.sin(p.ph * 3.1 + t) * 0.5) * 0.04;
        p.trail.length = 0;   /* never draw a trail across the wrap */
      }
      /* keep particles out of the rock's core */
      var rx = (p.x - ROCK_X) / ROCK_RX, ry = (p.y - ROCK_Y) / ROCK_RY;
      if (rx * rx + ry * ry < 0.85) {
        var side = (p.y >= ROCK_Y) ? 1 : -1;
        p.y = ROCK_Y + side * ROCK_RY * 0.95;
        p.trail.length = 0;   /* never draw a trail through the rock */
      }
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 12) p.trail.shift();
    }
  }
}
/* Warm the river before frame one: 360 fixed steps so the split
   around the rock is already formed and the braids are mid-flow. */
(function warmup() {
  var t = FRAME_T - 18;
  var s;
  for (s = 0; s < 360; s++) { stepSim(0.05, t); t += 0.05; }
})();
/* ---- WebAudio: lazy, only inside a user gesture, default silent ---- */
var audioCtx = null;
var audioReady = false;
var soundOn = false;
var droneGains = [null, null, null, null];
function ensureAudio() {
  if (audioCtx) return;
  try {
    var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    audioCtx = new AC();
    var freqs = [110.0, 130.81, 98.0, 123.47];
    var i, o, g, flt;
    for (i = 0; i < 4; i++) {
      o = audioCtx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = freqs[i];
      flt = audioCtx.createBiquadFilter();
      flt.type = 'bandpass';
      flt.frequency.value = freqs[i] * 3.0;
      flt.Q.value = 2.5;
      g = audioCtx.createGain();
      g.gain.value = 0.0;
      o.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
      o.start();
      droneGains[i] = g;
    }
    audioReady = true;
  } catch (e) { audioCtx = null; audioReady = false; }
}
function updateDrones(t) {
  if (!audioCtx || !audioReady) return;
  var i;
  for (i = 0; i < 4; i++) {
    var mass = 0.5 + 0.5 * Math.sin(t * 0.05 + i * 1.9);
    var target = soundOn ? 0.018 + 0.022 * mass : 0.0;
    try { droneGains[i].gain.setTargetAtTime(target, audioCtx.currentTime, 0.4); } catch (e) { /* ignore */ }
  }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The river rect: full-bleed on phones, a centered square on desktop.
   The page ground is the same river black, so the square reads as the
   river filling the frame. Returns {ox, oy, s}. */
function riverRect() {
  if (isPhone) return { ox: 0, oy: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { ox: (VW - s) / 2, oy: (VH - s) / 2, s: s, w: s, h: s };
}
function drawRock(R) {
  var i, p;
  ctx.fillStyle = ROCK;
  ctx.beginPath();
  ctx.moveTo(R.ox + rockPts[0].x * R.w, R.oy + rockPts[0].y * R.h);
  for (i = 1; i < rockPts.length; i++) ctx.lineTo(R.ox + rockPts[i].x * R.w, R.oy + rockPts[i].y * R.h);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = ROCK_EDGE;
  ctx.lineWidth = Math.max(1, R.s * 0.003);
  ctx.stroke();
  /* two subtle darker facets so the face reads as weathered stone */
  ctx.fillStyle = rgba(ROCK_DARK, 0.55);
  ctx.beginPath();
  ctx.moveTo(R.ox + (ROCK_X + 0.03) * R.w, R.oy + (ROCK_Y - 0.08) * R.h);
  ctx.lineTo(R.ox + (ROCK_X + 0.09) * R.w, R.oy + (ROCK_Y - 0.01) * R.h);
  ctx.lineTo(R.ox + (ROCK_X + 0.06) * R.w, R.oy + (ROCK_Y + 0.12) * R.h);
  ctx.lineTo(R.ox + (ROCK_X + 0.01) * R.w, R.oy + (ROCK_Y + 0.09) * R.h);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = rgba(ROCK_DARK, 0.35);
  ctx.beginPath();
  ctx.moveTo(R.ox + (ROCK_X - 0.08) * R.w, R.oy + (ROCK_Y + 0.02) * R.h);
  ctx.lineTo(R.ox + (ROCK_X - 0.02) * R.w, R.oy + (ROCK_Y + 0.05) * R.h);
  ctx.lineTo(R.ox + (ROCK_X - 0.05) * R.w, R.oy + (ROCK_Y + 0.14) * R.h);
  ctx.lineTo(R.ox + (ROCK_X - 0.09) * R.w, R.oy + (ROCK_Y + 0.10) * R.h);
  ctx.closePath();
  ctx.fill();
  /* cracks across the upper face */
  ctx.strokeStyle = rgba(ROCK_DARK, 0.9);
  ctx.lineWidth = Math.max(1, R.s * 0.002);
  for (i = 0; i < cracks.length; i++) {
    var cr = cracks[i];
    ctx.beginPath();
    ctx.moveTo(R.ox + cr.x1 * R.w, R.oy + cr.y1 * R.h);
    ctx.lineTo(R.ox + cr.x2 * R.w, R.oy + cr.y2 * R.h);
    ctx.stroke();
  }
  /* crumbs breaking off downstream, drifting slowly right */
  for (i = 0; i < crumbs.length; i++) {
    var cb = crumbs[i];
    var cx = R.ox + (cb.x + Math.sin(phaseT * 0.05 + cb.ph) * 0.004) * R.w;
    var cy = R.oy + cb.y * R.h;
    ctx.fillStyle = rgba(ROCK_EDGE, 0.7);
    ctx.beginPath();
    ctx.moveTo(cx, cy - cb.r * R.s);
    ctx.arc(cx, cy, cb.r * R.s, 0, TAU);
    ctx.fill();
  }
}
function drawRiver(R) {
  var i, j, p, tr;
  /* faint braided current ribbons, one smooth wave per cohort.
     Near the rock each ribbon is deflected smoothly away from the
     rock's center line, with the push falling to zero at the edge
     of the deflection zone, so no hard corners appear. */
  var k;
  for (k = 0; k < 4; k++) {
    ctx.strokeStyle = rgba(COHORTS[k], 0.05);
    ctx.lineWidth = Math.max(1.5, R.s * 0.010);
    ctx.beginPath();
    for (i = 0; i <= 60; i++) {
      var fx = i / 60;
      var fy = 0.14 + k * 0.20 + 0.035 * Math.sin(fx * 9.0 + k * 1.7 + phaseT * 0.05);
      var ddx = (fx - ROCK_X) / (ROCK_RX * 1.7);
      var ddy = (fy - ROCK_Y) / (ROCK_RY * 1.7);
      var dd = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dd < 1) {
        fy += ((fy >= ROCK_Y) ? 1 : -1) * (1 - dd) * ROCK_RY * 0.85;
      }
      var px = R.ox + fx * R.w, py = R.oy + fy * R.h;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  /* pale gold harmonic trails, then the colored particle heads */
  for (i = 0; i < particles.length; i++) {
    p = particles[i];
    if (p.trail.length > 2) {
      ctx.strokeStyle = rgba(GOLD, 0.20);
      ctx.lineWidth = Math.max(1, R.s * 0.0016);
      ctx.beginPath();
      ctx.moveTo(R.ox + p.trail[0].x * R.w, R.oy + p.trail[0].y * R.h);
      for (j = 1; j < p.trail.length; j++) ctx.lineTo(R.ox + p.trail[j].x * R.w, R.oy + p.trail[j].y * R.h);
      ctx.stroke();
    }
  }
  for (i = 0; i < particles.length; i++) {
    p = particles[i];
    var hx = R.ox + p.x * R.w, hy = R.oy + p.y * R.h;
    var rr = p.r * (R.s / 720);
    ctx.fillStyle = COHORTS[p.c];
    ctx.beginPath();
    ctx.moveTo(hx + rr, hy);
    ctx.arc(hx, hy, Math.max(1.2, rr), 0, TAU);
    ctx.fill();
  }
  /* gold shimmer glints riding the current */
  for (i = 0; i < glints.length; i++) {
    var g = glints[i];
    var ga = 0.10 + 0.22 * (0.5 + 0.5 * Math.sin(phaseT * 0.35 + g.ph));
    ctx.fillStyle = rgba(GOLD, ga);
    var gx = R.ox + g.x * R.w, gy = R.oy + g.y * R.h;
    var gr = g.r * (R.s / 720);
    ctx.beginPath();
    ctx.moveTo(gx + gr, gy);
    ctx.arc(gx, gy, gr, 0, TAU);
    ctx.fill();
  }
}
var soundRect = { x: 0, y: 0, w: 0, h: 0 };
function drawPlates(R) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Water Particles').width > R.w - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Water Particles').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 13').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = R.ox + 12, plateY = R.oy + 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Water Particles', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 03 · 13', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the currents flow.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = R.ox + 12;
  var hintPlateY = R.oy + R.h - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  var sndPlateW = sndW + 24;
  var sndPlateH = smallPx + 14;
  var sndPlateX = R.ox + R.w - sndPlateW - 12;
  var sndPlateY = R.oy + R.h - sndPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(sndPlateX, sndPlateY, sndPlateW, sndPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(sndPlateX + 0.5, sndPlateY + 0.5, sndPlateW - 1, sndPlateH - 1);
  ctx.fillStyle = soundOn ? GOLD : HINT_INK;
  ctx.fillText(snd, sndPlateX + 12, sndPlateY + 7);
  soundRect = { x: sndPlateX, y: sndPlateY, w: sndPlateW, h: sndPlateH };
}
function draw() {
  size();
  var R = riverRect();
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, VW, VH);
  /* faint horizontal current streaks across the river */
  var i;
  ctx.strokeStyle = rgba(STEEL, 0.05);
  ctx.lineWidth = 1;
  for (i = 0; i < 10; i++) {
    var sy = R.oy + (i + 0.5) / 10 * R.h;
    ctx.beginPath();
    ctx.moveTo(R.ox, sy);
    ctx.lineTo(R.ox + R.w, sy);
    ctx.stroke();
  }
  drawRiver(R);
  /* the rock is drawn after the river, so particles and trails pass
     behind it and the split reads as flow going around the rock */
  drawRock(R);
  drawPlates(R);
}
/* ---- frame one: fixed phase t = 40 s, warmed 360 steps, seed 1887 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (canvas && typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', function (ev) {
    if (!ev) return;
    var r = null;
    try { r = canvas.getBoundingClientRect(); } catch (e) { r = null; }
    var px = ev.clientX, py = ev.clientY;
    if (r && typeof ev.clientX === 'number') { px = ev.clientX - r.left; py = ev.clientY - r.top; }
    else if (typeof ev.offsetX === 'number') { px = ev.offsetX; py = ev.offsetY; }
    else return;
    if (px >= soundRect.x && px <= soundRect.x + soundRect.w &&
        py >= soundRect.y && py <= soundRect.y + soundRect.h) {
      soundOn = !soundOn;
      if (soundOn) {
        ensureAudio();
        if (audioCtx && audioReady) {
          try { if (audioCtx.resume) audioCtx.resume(); } catch (e) { /* ignore */ }
        }
      }
      updateDrones(phaseT);
      draw();
    }
    /* watch only: taps elsewhere do nothing, the river is never dammed */
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      stepSim(dt, phaseT);
      updateDrones(phaseT);
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
