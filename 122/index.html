<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№122 · Rule Weather</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0C0B09; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,226,210,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to gust the field</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

// No.122 Rule Weather: two systems only - dots orbiting home points, one diagonal wave field
const GROUND='#0C0B09';
const PAL=[];
for(let i=0;i<16;i++){ const f=i/15, g=f*f;
  const r=Math.round(232+(232-232)*g), gg=Math.round(226+(163-226)*g), b=Math.round(210+(61-210)*g);
  PAL.push('rgb('+r+','+gg+','+b+')');
}
let gust=null; // {x,y,t0,rel} rel=-1 while held
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const t=nowMs/1000;
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,w,h);
  // ~55 rows; column count follows the frame so cells stay near-square
  const ROWS=55, COLS=Math.max(18, Math.round(ROWS*w/h));
  const sx=w/COLS, sy=h/ROWS;
  const dot=Math.max(1.3, Math.min(sx,sy)*0.34);
  let gStr=0, gx=0, gy=0, gt=0;
  if(gust){ gx=gust.x; gy=gust.y; gt=gust.t0; gStr=gust.rel<0? clamp((t-gt)*3,0,1) : Math.max(0,1-(t-gust.rel)/2.4); }
  const gReach=Math.min(w,h)*0.40;
  for(let gyI=0; gyI<ROWS; gyI++){
    for(let gxI=0; gxI<COLS; gxI++){
      const hx=(gxI+0.5)*sx, hy=(gyI+0.5)*sy;
      const ph=gxI*0.37+gyI*0.61;
      // system A: orbit home point
      let px=hx+Math.cos(t*0.50+ph)*sx*0.22;
      let py=hy+Math.sin(t*0.42+ph*1.7)*sy*0.22;
      // system B: diagonal traveling wave field pushes dots off orbit
      // (phase lives in grid-index space, so the weather scales to any frame)
      const s1=Math.sin((gxI+gyI)*0.16-t*0.70);
      const s2=Math.sin((gxI-gyI)*0.105-t*0.43+1.7);
      const amp=(s1+0.7*s2)/1.7;
      let wx=amp*sx*1.55, wy=amp*sy*1.55;
      // fingertip gust: a local radial wave source
      if(gStr>0.003){
        const dx=hx-gx, dy=hy-gy, d=Math.sqrt(dx*dx+dy*dy);
        if(d<gReach&&d>0.5){
          const gv=gStr*Math.sin(d*0.045-(t-gt)*5.2)*Math.exp(-d/gReach)*2.3;
          wx+=dx/d*gv*sx; wy+=dy/d*gv*sy;
        }
      }
      px+=wx; py+=wy;
      const m=clamp(Math.sqrt(wx*wx+wy*wy)/(Math.sqrt(sx*sx+sy*sy)*1.3),0,1);
      ctx.fillStyle=PAL[Math.round(m*15)];
      ctx.fillRect(px-dot/2,py-dot/2,dot,dot);
    }
  }
}
canvas.addEventListener('pointerdown',e=>{ gust={x:e.clientX,y:e.clientY,t0:e.timeStamp/1000,rel:-1}; });
canvas.addEventListener('pointermove',e=>{ if(gust&&gust.rel<0){ gust.x=e.clientX; gust.y=e.clientY; } });
function endP(e){ if(gust&&gust.rel<0) gust.rel=e.timeStamp/1000; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(6000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
