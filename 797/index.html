<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Column Study</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F4F4F2; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  // Strict palette: five tones, nothing else. The rule is the work.
  var CANVAS_TONE = "#EFEDE6";
  var GREEN = "#2E7D4F";
  var ORANGE_RED = "#C73E1D";
  var FLOOR = "#B09A7A";
  var WALL = "#F4F4F2";

  var LOOP = 36; // seconds, seamless: the view drifts down and back

  // mulberry32: the only randomness in the piece, consumed once at setup.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Imprint texture: one No. 50 brush, pressed and lifted, the same dab
  // construction as the rest of the Toroni set. Each imprint is a DAB
  // first: a solid body of paint, near-opaque through its upper
  // two-thirds where the brush first pressed, easing only toward the dry
  // bottom edge where it lifted. The bristle texture lives INSIDE that
  // body: paint ridges add density, and thin canvas-coloured gaps score
  // the fine separations between bristle bundles, both drawn in three
  // stacked segments whose alpha falls away toward the bottom. A short
  // cluster of dense load strokes sits at the very top edge. Placement is
  // never jittered: the rhythm below is exact. The hand lives only here,
  // in the texture. (Gap strokes take the canvas tone: the dab sits on
  // canvas, so the ground showing through a dab is canvas, not wall.)
  function makeImprint(rng) {
    var streaks = [];
    var n = 26 + Math.floor(rng() * 13); // 26..38 density ridges
    for (var i = 0; i < n; i++) {
      streaks.push({
        x: (rng() * 2 - 1) * 0.46,
        top: -0.5 + rng() * 0.1,
        len: 0.58 + rng() * 0.44,
        w: 0.028 + rng() * 0.03,
        a: 0.45 + rng() * 0.4
      });
    }
    var gaps = [];
    var g = 18 + Math.floor(rng() * 10); // 18..27 bristle-gap scores
    for (var h = 0; h < g; h++) {
      gaps.push({
        x: (rng() * 2 - 1) * 0.46,
        top: -0.5 + rng() * 0.08,
        len: 0.5 + rng() * 0.48,
        w: 0.012 + rng() * 0.014,
        a: 0.16 + rng() * 0.2
      });
    }
    var load = [];
    var m = 8 + Math.floor(rng() * 5); // dense top-edge load strokes
    for (var j = 0; j < m; j++) {
      load.push({
        x: (rng() * 2 - 1) * 0.44,
        len: 0.1 + rng() * 0.12,
        w: 0.03 + rng() * 0.03,
        a: 0.65 + rng() * 0.3
      });
    }
    return {
      rot: (rng() * 2 - 1) * 0.035,       // rotation jitter, +-2 degrees
      scl: 0.95 + rng() * 0.1,            // scale jitter, +-5 percent
      alp: 0.9 + rng() * 0.1,             // alpha jitter, +-10 percent
      body: 0.9 + rng() * 0.1,            // dab body alpha: solid paint
      streaks: streaks,
      gaps: gaps,
      load: load
    };
  }

  // The three supports. Outer canvases green, the center one orange-red,
  // the late Locarno hang. Each canvas carries ROWS imprints down its
  // center; the rows form a closed ring (positions repeat every ROWS
  // intervals), so the drifting view can wrap seamlessly: a dab that
  // slides off the bottom of the ring re-enters at the top unchanged.
  var ROWS = 7;
  var COLUMNS = [];
  (function () {
    var seeds = [797101, 797202, 797303];
    var colors = [GREEN, ORANGE_RED, GREEN];
    for (var c = 0; c < 3; c++) {
      var rng = mulberry32(seeds[c]);
      var set = [];
      for (var i = 0; i < ROWS; i++) set.push(makeImprint(rng));
      COLUMNS.push({ color: colors[c], imprints: set });
    }
  })();

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    DPR = window.devicePixelRatio || 1;
    W = Math.round(w);
    H = Math.round(h);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  var currentT = 0;

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () { resize(); draw(currentT); });
  }
  window.addEventListener("resize", function () { resize(); draw(currentT); });

  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }

  // Draw one fully-stamped imprint centered at (cx, cy), dab size s, in
  // the column's one colour. The paint does not move; only the view does.
  function drawImprint(cx, cy, s, imp, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(imp.rot);
    ctx.scale(imp.scl, imp.scl);
    ctx.fillStyle = color;
    // Dab body: the squarish block of paint, drawn as horizontal bands
    // (no gradients in this house). Full density through the upper
    // two-thirds, where the brush pressed; the bottom third dries off,
    // easing to just over half density at the lift-off edge.
    var BANDS = 12, b, bf;
    for (b = 0; b < BANDS; b++) {
      bf = b / BANDS;
      ctx.globalAlpha = imp.alp * imp.body *
        (bf < 0.62 ? 1 : 1 - 0.45 * smooth((bf - 0.62) / 0.38));
      ctx.fillRect(-s / 2, -s / 2 + bf * s, s, s / BANDS + 1);
    }
    // Bristle texture inside the body, each stroke in three segments
    // drying toward the bottom: ridges of the same paint deepen the
    // load, then canvas-coloured gaps score the separations between
    // bristle bundles, the fine light lines a flat brush leaves in
    // solid paint.
    ctx.lineCap = "butt";
    var k, st, seg, segLen, y0, y1;
    ctx.strokeStyle = color;
    for (k = 0; k < imp.streaks.length; k++) {
      st = imp.streaks[k];
      ctx.lineWidth = Math.max(1, st.w * s);
      y0 = st.top * s;
      segLen = (st.len * s) / 3;
      for (seg = 0; seg < 3; seg++) {
        ctx.globalAlpha = imp.alp * st.a * (seg === 0 ? 1 : (seg === 1 ? 0.62 : 0.35));
        y1 = y0 + segLen;
        ctx.beginPath();
        ctx.moveTo(st.x * s, y0);
        ctx.lineTo(st.x * s, y1);
        ctx.stroke();
        y0 = y1;
      }
    }
    ctx.strokeStyle = CANVAS_TONE;
    for (k = 0; k < imp.gaps.length; k++) {
      st = imp.gaps[k];
      ctx.lineWidth = Math.max(1, st.w * s);
      y0 = st.top * s;
      segLen = (st.len * s) / 3;
      for (seg = 0; seg < 3; seg++) {
        ctx.globalAlpha = st.a * (seg === 0 ? 1 : (seg === 1 ? 0.6 : 0.3));
        y1 = y0 + segLen;
        ctx.beginPath();
        ctx.moveTo(st.x * s, y0);
        ctx.lineTo(st.x * s, y1);
        ctx.stroke();
        y0 = y1;
      }
    }
    ctx.strokeStyle = color;
    // Top-edge load: where the brush first pressed, the paint is densest.
    for (k = 0; k < imp.load.length; k++) {
      st = imp.load[k];
      ctx.lineWidth = Math.max(1, st.w * s);
      ctx.globalAlpha = imp.alp * st.a;
      ctx.beginPath();
      ctx.moveTo(st.x * s, -s / 2);
      ctx.lineTo(st.x * s, -s / 2 + st.len * s);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    currentT = t;
    if (W === 0) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    var phone = isPhone();

    // Room: wall everywhere, floor below the line. The line sits low;
    // the canvases stand on it, floor to ceiling.
    ctx.globalAlpha = 1;
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);
    var floorY = H * 0.88;
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, floorY, W, H - floorY);

    // Triptych geometry. Generous margins; the three verticals dominate
    // at every frame size. On the tall phone frame the group takes a
    // little more of the width, since the piece is portrait in spirit
    // and the phone is its native hang.
    var top = H * 0.035;
    var canH = floorY - top;
    var sideM = W * (phone ? 0.07 : 0.11);
    var gap = W * (phone ? 0.035 : 0.045);
    var canW = (W - 2 * sideM - 2 * gap) / 3;

    // The view drift: down the columns and back over one loop, a
    // half-cosine so the view leaves rest with no velocity, reaches its
    // lowest point at the loop's middle, and returns to rest exactly as
    // the loop closes. Amplitude is three quarters of one interval.
    var phase = ((t % LOOP) + LOOP) % LOOP;
    var P = canH / 5;                    // the interval, in frame units
    var fieldH = ROWS * P;               // the closed ring of imprints
    var drift = (P * 0.75) * (0.5 - 0.5 * Math.cos(2 * Math.PI * phase / LOOP));
    var S = canW * 0.34;                 // dab size against the canvas

    for (var c = 0; c < 3; c++) {
      var col = COLUMNS[c];
      var x0 = sideM + c * (canW + gap);
      var ccx = x0 + canW / 2;

      // The canvas's soft hold on the wall: a floor-tone shadow slipped
      // down and right, the only depth cue in the room.
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = FLOOR;
      ctx.fillRect(x0 + canW * 0.03, top + canH * 0.012, canW, canH);
      ctx.globalAlpha = 1;
      ctx.fillStyle = CANVAS_TONE;
      ctx.fillRect(x0, top, canW, canH);

      // Imprints, clipped to the support: paint exists only on canvas.
      // Row k sits at ring position k*P; the drift slides every row
      // down by the same amount and the ring wraps, so rows leave at
      // the canvas foot and re-enter at its head, meter-steady.
      ctx.save();
      ctx.beginPath();
      ctx.rect(x0, top, canW, canH);
      ctx.clip();
      for (var k = 0; k < ROWS; k++) {
        // Ring position of row k, wrapped into [0, fieldH). Mapped so
        // that at rest one row sits half-clipped at the canvas head
        // (the column runs on upward, out of frame) and five full rows
        // stand down the canvas; the ring's remaining length waits
        // below the foot, ready to wrap in as the view drifts.
        var cy = top + P * 0.5 + ((k * P + drift) % fieldH) - P;
        drawImprint(ccx, cy, S, col.imprints[k], col.color);
      }
      ctx.restore();
    }

    // Vignettes: layered flat bands of wall tone at the frame's head
    // and at the foot of the canvases, strongest at the edges and
    // stepping away. No gradients; the steps are the softness. They say
    // the columns run on past what the frame can hold.
    var steps = [0.5, 0.32, 0.18, 0.08];
    var i, a;
    ctx.fillStyle = WALL;
    for (i = 0; i < steps.length; i++) {
      a = steps[i];
      ctx.globalAlpha = a;
      ctx.fillRect(0, 0, W, H * 0.028 * (i + 1));
      ctx.fillRect(0, floorY - H * 0.028 * (i + 1), W, H * 0.028 * (i + 1));
    }
    ctx.globalAlpha = 1;
  }

  resize();
  draw(0);

  // Watch-only. The loop is anchored at load: frame one is the
  // synchronous draw above at drift phase 0, and the animation is phase
  // 0 plus elapsed-since-load, never a wall clock.
  if (typeof requestAnimationFrame === "function") {
    var start = null;
    var tick = function (now) {
      if (start === null) start = now;
      draw((now - start) / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
