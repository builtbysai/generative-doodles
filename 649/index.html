<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apacheta</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0B; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* Apacheta: a living trail cairn. Stones fall one by one and settle;
   the topmost stone turns condor-gold. Too tall, and it topples into a
   base ring, then begins again. Deterministic: mulberry32 seed stream,
   fixed-step solver on an anchored clock, events recorded with anchored
   timestamps. Frame one is the synchronous draw at t = 0. */

var COL = {
  ground: '#0A0A0B',
  granite: '#8A8A8C',
  fracture: '#3A3A3D',
  gold: '#D9A441'
};

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- viewport (Visual Viewport API, house rule) ---------- */
var VW = 800, VH = 600;
function viewportSize() {
  var vv = window.visualViewport;
  if (vv && vv.width) return { w: vv.width, h: vv.height };
  return { w: window.innerWidth || 800, h: window.innerHeight || 600 };
}
function isPhone() {
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0 && mn < 700) return true;
  return VH > VW * 1.15;
}
function resize() {
  var s = viewportSize();
  VW = s.w; VH = s.h;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(VW * dpr);
  canvas.height = Math.round(VH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout();
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
window.addEventListener('resize', resize);

/* ---------- layout: unit u in px, derived from the frame ---------- */
var U = 10, CX = 0, GY = 0; // CX = cairn centre x, GY = ground (ridge) line y
function layout() {
  var phone = isPhone();
  U = Math.max(6, Math.min(VW, VH) * (phone ? 0.032 : 0.026));
  CX = VW / 2;
  GY = VH * (phone ? 0.80 : 0.82);
}

/* ---------- stone shapes (unit space, centroid at origin) ---------- */
function makeShape(rng, wu, hu) {
  var n = 6 + Math.floor(rng() * 4); // 6..9 vertices
  var hw = wu / 2, hh = hu / 2;
  var jit = function () { return (rng() - 0.5) * 0.16; };
  var top = [], i, t;
  var nTop = Math.max(2, Math.round(n * 0.45));
  for (i = 0; i <= nTop; i++) {
    t = i / nTop;
    top.push({ x: -hw + wu * t, y: -hh + jit() * hu });
  }
  var right = { x: hw + jit() * wu * 0.5, y: (rng() - 0.5) * hu * 0.3 };
  var bot = [];
  var nBot = Math.max(2, n - nTop - 1);
  for (i = 0; i <= nBot; i++) {
    t = i / nBot;
    bot.push({ x: hw - wu * t, y: hh + jit() * hu });
  }
  var left = { x: -hw + jit() * wu * 0.5, y: (rng() - 0.5) * hu * 0.3 };
  var pts = top.concat([right], bot, [left]);
  // recenter on centroid so rotation is about the middle
  var cx = 0, cy = 0;
  for (i = 0; i < pts.length; i++) { cx += pts[i].x; cy += pts[i].y; }
  cx /= pts.length; cy /= pts.length;
  for (i = 0; i < pts.length; i++) { pts[i].x -= cx; pts[i].y -= cy; }
  // fracture facet: wedge from centroid to two adjacent rim vertices
  var fi = Math.floor(rng() * pts.length);
  return { pts: pts, fi: fi, hw: hw, hh: hh };
}

/* ---------- stones ---------- */
var ST = { REST: 0, FALL: 1, SETTLE: 2, TOPPLE: 3 };
var stones = [];        // all stones, draw order = creation order
var placements = 0;     // stones ever placed this epoch (drives height risk)
var nextSpawnAt = 4;    // anchored seconds
var epochRng = mulberry32(649079);
var events = [];        // {type:'tap'|'drag', t, ...} recorded with anchored times
var falling = null;

function topSurfaceY(x) {
  // highest support under unit-space x: min over resting stones whose span
  // covers x of their top edge; ground line is y = 0 in unit space.
  var best = 0;
  for (var i = 0; i < stones.length; i++) {
    var s = stones[i];
    if (s.state !== ST.REST && s.state !== ST.SETTLE) continue;
    if (Math.abs(x - s.x) > s.hw * 0.98) continue;
    var ty = s.y - s.hh * Math.cos(s.ang) - Math.abs((x - s.x) * Math.sin(s.ang));
    if (ty < best) best = ty;
  }
  return best;
}
function stackHeightU() {
  var top = 0;
  for (var i = 0; i < stones.length; i++) {
    var s = stones[i];
    if (s.state !== ST.REST) continue;
    if (s.y - s.hh < top) top = s.y - s.hh;
  }
  return -top;
}
function stackCount() {
  var n = 0;
  for (var i = 0; i < stones.length; i++) {
    if (stones[i].state === ST.REST && !stones[i].ring) n++;
  }
  return n;
}

var MAXH = 30; // unit-space stack cap so a 24-stone cairn stays in frame
function spawnStone(tNow) {
  var depth = placements; // 0-based within the epoch
  var frac = Math.min(1, depth / 23);
  var wu = 5.8 * (1 - 0.42 * frac) * (0.9 + epochRng() * 0.25);
  var hu = Math.min(2.3 * (1 - 0.5 * frac) + epochRng() * 0.5, MAXH / 24 + 0.6);
  var shape = makeShape(epochRng, wu, hu);
  var s = {
    shape: shape, hw: shape.hw, hh: shape.hh,
    x: (epochRng() - 0.5) * 1.6, y: 0, ang: (epochRng() - 0.5) * 0.14,
    vx: 0, vy: 0, va: 0,
    state: ST.FALL, gold: false,
    settleT: 0, settleFrom: 0, settleTo: 0, restY: 0, restAng: 0,
    topT: 0, topDur: 0, sx: 0, sy: 0, sa: 0, tx: 0, ty: 0, ta: 0
  };
  s.y = topSurfaceY(s.x) - s.hh - 5.5 - epochRng() * 1.5;
  stones.push(s);
  falling = s;
  return s;
}

function landStone(s) {
  // rest on the highest support under the stone's span
  var supL = topSurfaceY(s.x - s.hw * 0.55);
  var supR = topSurfaceY(s.x + s.hw * 0.55);
  var sup = Math.min(supL, supR);
  s.restY = sup - s.hh * 0.94;
  var tilt = Math.atan2(supR - supL, s.hw * 1.1);
  s.restAng = tilt * 0.75 + (epochRng() - 0.5) * 0.05;
  s.settleFrom = s.y; s.settleTo = s.restY;
  s.state = ST.SETTLE; s.settleT = 0;
  if (falling === s) falling = null;
  placements++;
  // mark gold: exactly the topmost resting/settling stone
  for (var i = 0; i < stones.length; i++) stones[i].gold = false;
  s.gold = true;
}

function startTopple(tNow) {
  var rest = [];
  for (var i = 0; i < stones.length; i++) {
    if (stones[i].state === ST.REST && !stones[i].ring) rest.push(stones[i]);
  }
  rest.sort(function (a, b) { return b.y - a.y; }); // bottom first
  var k = Math.min(rest.length - 2, 3 + Math.floor(epochRng() * 4)); // keep bottom 2
  if (k < 1) return false;
  for (var j = 0; j < k; j++) {
    var s = rest[rest.length - 1 - j];
    var dir = epochRng() < 0.5 ? -1 : 1;
    s.state = ST.TOPPLE;
    s.topT = 0;
    s.topDur = 1.1 + epochRng() * 0.7;
    s.sx = s.x; s.sy = s.y; s.sa = s.ang;
    s.tx = dir * (4.5 + epochRng() * 6.5);
    s.ty = -s.hh * 0.9;
    s.ta = dir * (0.8 + epochRng() * 1.6);
    s.gold = false;
  }
  // new top of the surviving stack turns gold
  var surv = [];
  for (var i2 = 0; i2 < stones.length; i2++) {
    if (stones[i2].state === ST.REST && !stones[i2].ring) surv.push(stones[i2]);
  }
  surv.sort(function (a, b) { return a.y - b.y; });
  if (surv.length) surv[0].gold = true;
  return true;
}

function maybeTopple(s) {
  var n = stackCount();
  var p = 0;
  if (n > 16) p = 1;
  else if (n >= 7) p = (n - 6) / 11 * 0.55;
  if (p > 0 && epochRng() < p) startTopple(0);
}

/* ---------- fixed-step solver (dt = 1/240 s) ---------- */
var DT = 1 / 240, simT = 0;
var GRAV = 26; // units / s^2
function step() {
  simT += DT;
  // spawn schedule
  if (!falling && simT >= nextSpawnAt) {
    if (stackCount() >= 24) { startTopple(simT); nextSpawnAt = simT + 3; }
    else { spawnStone(simT); nextSpawnAt = simT + 4; }
  }
  // replay recorded events whose anchored time has arrived
  for (var e = 0; e < events.length; e++) {
    var ev = events[e];
    if (ev.done || ev.t > simT) continue;
    ev.done = true;
    if (ev.type === 'tap') {
      if (!falling && stackCount() < 24) { spawnStone(simT); nextSpawnAt = simT + 4; }
    } else if (ev.type === 'drag' && falling) {
      falling.va += ev.dAng * 2.4;
      falling.vx += ev.dx * 0.6;
    }
  }
  for (var i = 0; i < stones.length; i++) {
    var s = stones[i];
    if (s.state === ST.FALL) {
      s.vy += GRAV * DT;
      s.y += s.vy * DT;
      s.x += s.vx * DT;
      s.ang += s.va * DT;
      s.va *= 0.995;
      var sup = Math.min(topSurfaceY(s.x - s.hw * 0.55), topSurfaceY(s.x + s.hw * 0.55));
      if (s.y + s.hh * 0.94 >= sup) { s.y = sup - s.hh * 0.94; landStone(s); maybeTopple(s); }
    } else if (s.state === ST.SETTLE) {
      s.settleT += DT;
      var q = Math.min(1, s.settleT / 0.45);
      var bounce = Math.sin(q * Math.PI) * -0.05 * (1 - q);
      s.y = s.settleFrom + (s.settleTo - s.settleFrom) * q + bounce;
      s.ang += (s.restAng - s.ang) * Math.min(1, DT * 10);
      if (q >= 1) { s.y = s.restY; s.ang = s.restAng; s.state = ST.REST; }
    } else if (s.state === ST.TOPPLE) {
      s.topT += DT;
      var u = Math.min(1, s.topT / s.topDur);
      var ease = u * u;
      s.x = s.sx + (s.tx - s.sx) * ease;
      // arc up slightly then down to the ground ring
      s.y = s.sy + (s.ty - s.sy) * ease - Math.sin(u * Math.PI) * 0.4;
      s.ang = s.sa + (s.ta - s.sa) * ease;
      if (u >= 1) {
        s.y = s.ty; s.ang = s.ta;
        s.state = ST.REST; // ring stone: rests on the ground, off-stack
        s.ring = true;
      }
    }
  }
  // ring stones rest on the ground: mark them out of the stack support test
}

/* support test must ignore ring stones and the falling stone itself */
var _topSurfaceY = topSurfaceY;
topSurfaceY = function (x) {
  var best = 0;
  for (var i = 0; i < stones.length; i++) {
    var s = stones[i];
    if (s.ring) continue;
    if (s.state !== ST.REST && s.state !== ST.SETTLE) continue;
    if (s === falling) continue;
    if (Math.abs(x - s.x) > s.hw * 0.98) continue;
    var ty = s.y - s.hh * Math.cos(s.ang) - Math.abs((x - s.x) * Math.sin(s.ang));
    if (ty < best) best = ty;
  }
  return best;
};

/* ---------- seed the frame-one cairn: five stones at rest ---------- */
function buildInitial() {
  stones = []; placements = 0; events = []; falling = null; simT = 0;
  epochRng = mulberry32(649079);
  var y = 0;
  for (var i = 0; i < 5; i++) {
    var frac = i / 23;
    var wu = 5.8 * (1 - 0.42 * frac) * (0.92 + epochRng() * 0.2);
    var hu = Math.min(2.3 * (1 - 0.5 * frac) + epochRng() * 0.45, MAXH / 24 + 0.6);
    var shape = makeShape(epochRng, wu, hu);
    var s = {
      shape: shape, hw: shape.hw, hh: shape.hh,
      x: (epochRng() - 0.5) * 1.1, y: y - hu * 0.47, ang: (epochRng() - 0.5) * 0.1,
      vx: 0, vy: 0, va: 0, state: ST.REST, gold: i === 4,
      settleT: 0, settleFrom: 0, settleTo: 0, restY: 0, restAng: 0,
      topT: 0, topDur: 0, sx: 0, sy: 0, sa: 0, tx: 0, ty: 0, ta: 0
    };
    s.restY = s.y; s.restAng = s.ang;
    stones.push(s);
    y = s.y - hu * 0.47;
    placements++;
  }
  nextSpawnAt = 4;
}

/* QA hook: ?seed=tall12 pre-places a 12-stone cairn (throwaway renders). */
function applySeedHook() {
  var qs = '';
  if (typeof location !== 'undefined' && location.search) qs = location.search;
  else if (window.location && window.location.search) qs = window.location.search;
  var m = /seed=([a-z0-9]+)/.exec(qs);
  if (!m) return;
  if (m[1] === 'tall12') {
    var extra = 7;
    for (var i = 0; i < extra; i++) {
      var top = null;
      for (var j = 0; j < stones.length; j++) {
        var sj = stones[j];
        if (sj.state === ST.REST && !sj.ring && (!top || sj.y < top.y)) top = sj;
      }
      if (!top) break;
      var frac = placements / 23;
      var wu = 5.8 * (1 - 0.42 * Math.min(1, frac)) * (0.9 + epochRng() * 0.25);
      var hu = Math.min(2.3 * (1 - 0.5 * Math.min(1, frac)) + epochRng() * 0.5, MAXH / 24 + 0.6);
      var shape = makeShape(epochRng, wu, hu);
      for (var k = 0; k < stones.length; k++) stones[k].gold = false;
      var s = {
        shape: shape, hw: shape.hw, hh: shape.hh,
        x: top.x + (epochRng() - 0.5) * 1.2,
        y: top.y - top.hh * 0.94 - hu * 0.47,
        ang: (epochRng() - 0.5) * 0.1,
        vx: 0, vy: 0, va: 0, state: ST.REST, gold: true,
        settleT: 0, settleFrom: 0, settleTo: 0, restY: 0, restAng: 0,
        topT: 0, topDur: 0, sx: 0, sy: 0, sa: 0, tx: 0, ty: 0, ta: 0
      };
      s.restY = s.y; s.restAng = s.ang;
      stones.push(s);
      placements++;
    }
  }
}

/* ---------- draw ---------- */
function drawStone(s, swayX) {
  ctx.save();
  ctx.translate(CX + (s.x + swayX) * U, GY + s.y * U);
  ctx.rotate(s.ang);
  var pts = s.shape.pts;
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    var px = pts[i].x * U, py = pts[i].y * U;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = s.gold ? COL.gold : COL.granite;
  ctx.fill();
  // fracture facet: wedge from centroid to two adjacent rim vertices
  var a = pts[s.shape.fi], b = pts[(s.shape.fi + 1) % pts.length];
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(a.x * U, a.y * U);
  ctx.lineTo(b.x * U, b.y * U);
  ctx.closePath();
  ctx.fillStyle = COL.fracture;
  ctx.fill();
  ctx.restore();
}

function draw(tSec) {
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, 0, VW, VH);
  // ridge / horizon line, low in the frame
  ctx.strokeStyle = COL.fracture;
  ctx.lineWidth = Math.max(1, U * 0.09);
  ctx.beginPath();
  ctx.moveTo(0, GY + 0.5);
  ctx.lineTo(VW, GY + 0.5);
  ctx.stroke();
  // teeter: sway grows with stack height, still at t = 0
  var hgt = stackHeightU();
  var swayAmp = Math.min(0.22, hgt * 0.012);
  for (var i = 0; i < stones.length; i++) {
    var s = stones[i];
    var depthFrac = hgt > 0 ? Math.max(0, -s.y) / hgt : 0;
    var swayX = s.state === ST.REST && !s.ring
      ? Math.sin(tSec * 0.7) * swayAmp * depthFrac : 0;
    drawStone(s, swayX);
  }
}

/* ---------- anchored clock + main loop ---------- */
var T0 = null;
function frame(nowMs) {
  if (T0 === null) T0 = nowMs;
  var target = (nowMs - T0) / 1000;
  var guard = 0;
  while (simT < target && guard < 4800) { step(); guard++; }
  draw(simT);
}
function animate(nowMs) {
  frame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(animate);
}

/* ---------- interaction: tap drops, drag nudges a falling stone ---------- */
var dragStart = null;
canvas.addEventListener('pointerdown', function (e) {
  dragStart = { x: e.clientX, y: e.clientY, t: simT };
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragStart || !falling) return;
  var dx = (e.clientX - dragStart.x) / (U * 8);
  if (Math.abs(dx) > 0.02) {
    events.push({ type: 'drag', t: simT, dx: dx, dAng: dx * 0.5, done: false });
    dragStart.x = e.clientX;
  }
});
canvas.addEventListener('pointerup', function (e) {
  if (!dragStart) return;
  var moved = Math.abs(e.clientX - dragStart.x) + Math.abs(e.clientY - dragStart.y);
  if (moved < 6) events.push({ type: 'tap', t: simT, done: false });
  dragStart = null;
});
canvas.addEventListener('click', function () { /* taps handled on pointerup */ });

/* ---------- boot: frame one is this synchronous draw at t = 0 ---------- */
resize();
buildInitial();
applySeedHook();
draw(0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(animate);
</script>
</body>
</html>
