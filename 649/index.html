<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№649 The Column, Pt. 2</title>
<style>
  html, body { margin: 0; padding: 0; background: #8b9298; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1990 The Column, Pt. 2, MC7 / PP1237, study #259 mateo-villanueva-brandt.
  // A body-painted figure crouched on shoreline rock, sea spray exploding
  // around it, a backlit mist halo around the head. The figure is painted
  // the colour of the rock so it half-vanishes; only the halo separates it.
  // Grey spray, wet rock brown, pale halo gold. Figure small, center, spray
  // filling the frame, horizon gone. Spray bursts in slow waves, the halo
  // pulsing with each burst. Watch-only: the waves have their own rhythm
  // and the viewer is the weather's witness, not its cause.
  var GROUND = '#8b9298'; // page ground, grey spray mist

  // Fixed-phase first frame: FIRST_T = 24 s. Bursts run on a 20 s period:
  // each burst rises over 2.5 s, peaks near 4 s, decays to a hush by 14 s.
  // At t = 24 the burst is at its peak (tau = 4), so the first frame shows
  // spray at full height and the halo at full gold.
  var FIRST_T = 24;
  var CYCLE = 120;
  var BURST_PERIOD = 20;
  var SEED = 1990;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x) {
    var i = Math.floor(x), f = x - i;
    var u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }
  function fbm(x) {
    return vnoise(x) * 0.55 + vnoise(x * 2.13 + 7.7) * 0.30 + vnoise(x * 4.31 + 3.1) * 0.15;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function mix(a, b, f) {
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palettes: grey spray, wet rock brown, pale halo gold.
  var MIST_TOP = [178, 184, 190];
  var MIST_MID = [150, 156, 162];
  var MIST_LOW = [120, 126, 132];
  var SPRAY_LIGHT = [216, 221, 225];
  var SPRAY = [192, 198, 203];
  var SPRAY_DARK = [158, 165, 171];
  var ROCK_DARK = [46, 35, 24];
  var ROCK = [74, 57, 40];
  var ROCK_MID = [96, 75, 53];
  var ROCK_LIGHT = [126, 101, 70];
  var ROCK_SHEEN = [156, 134, 100];
  var FIGURE = [84, 66, 47];       // rock colour, a shade lighter than the rock it sits on
  var FIGURE_DARK = [66, 51, 36];
  var HALO = [238, 206, 128];
  var HALO_PALE = [246, 226, 168];
  var INK = [40, 30, 20];

  // Rock crest profile: fixed fbm ridge across the frame, pure function of x.
  function rockTopY(xf) {
    // Crest around 0.56H at center, rising toward the edges' lower shoulders.
    var base = 0.585 + 0.045 * Math.cos((xf - 0.5) * Math.PI * 1.6);
    var rough = (fbm(xf * 5.3 + 2.2) - 0.5) * 0.055;
    return (base + rough) * H;
  }

  // Figure anchor: crouched on the crest at center. The base is
  // computed from the crest profile so the figure sits on the rock,
  // never floating above it.
  var FIG_X = 0.5;      // fraction of W
  var FIG_BASE_Y = 0.585; // fraction of H, replaced by the crest in layout()

  // Spray droplets: seeded once, pure functions of t.
  // Each droplet launches from the rock crest once per burst, with a
  // delay inside the burst, a ballistic arc, and a fade over its life.
  var NDROP = 320;
  var drops = [];
  (function () {
    var rng = mulberry32(SEED * 13 + 5);
    var i;
    for (i = 0; i < NDROP; i++) {
      // Launch origin: mostly the crest near center, some from the
      // rock shoulders, a few from the figure itself.
      var src = rng();
      var ox, oy;
      if (src < 0.55) {
        ox = 0.5 + (rng() - 0.5) * 0.30;
        oy = rockTopYFrac(ox);
      } else if (src < 0.85) {
        ox = 0.5 + (rng() - 0.5) * 0.75;
        oy = rockTopYFrac(ox);
      } else {
        ox = 0.5 + (rng() - 0.5) * 0.05;
        oy = rockTopYFrac(0.5) - 0.05 - rng() * 0.05;
      }
      // Launch angle: upward fan, wider for shoulder droplets.
      var spread = src < 0.55 ? 0.85 : 1.25;
      var ang = -Math.PI / 2 + (rng() - 0.5) * 2 * spread;
      var speed = 0.045 + rng() * 0.115; // fraction of H per second
      drops.push({
        ox: ox, oy: oy,
        vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
        delay: rng() * 5.0,
        life: 3.5 + rng() * 5.5,
        r: 0.0009 + rng() * 0.0021, // fraction of W
        shade: rng(),
        streak: rng() < 0.35
      });
    }
  })();
  function rockTopYFrac(xf) {
    var base = 0.585 + 0.045 * Math.cos((xf - 0.5) * Math.PI * 1.6);
    var rough = (fbm(xf * 5.3 + 2.2) - 0.5) * 0.055;
    return base + rough;
  }

  // Ambient mist motes: slow drifters that never leave the frame,
  // so the air stays alive even between bursts.
  var NMOTE = 90;
  var motes = [];
  (function () {
    var rng = mulberry32(SEED * 29 + 11);
    var i;
    for (i = 0; i < NMOTE; i++) {
      motes.push({
        x: rng(), y: rng() * 0.85,
        r: 0.0012 + rng() * 0.0028,
        drift: 0.004 + rng() * 0.010,
        tw: rng() * Math.PI * 2,
        shade: rng()
      });
    }
  })();

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 10, 13));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.figX = FIG_X * W;
    L.figH = H * 0.145; // crouched figure height
    // On the crest, sunk a hair into the rock so it never floats.
    L.figBaseY = rockTopYFrac(FIG_X) * H + L.figH * 0.04;
    L.headR = L.figH * 0.15;
    L.headY = L.figBaseY - L.figH * 0.80;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Cycle -----------------------------------------------------
  // Burst envelope over one 20 s period: rises 0 to 1 over 2.5 s,
  // holds near peak to 4 s, decays to a hush (0.08) by 14 s, then
  // stays hushed until the next burst. Per-burst amplitude varies
  // 0.75 to 1.00 by a hash of the burst index, so no two waves are
  // quite alike. The halo answers the same envelope.
  function burstEnv(t) {
    var tau = ((t % BURST_PERIOD) + BURST_PERIOD) % BURST_PERIOD;
    var env;
    if (tau < 2.5) { env = smooth(tau / 2.5); }
    else if (tau < 4) { env = 1; }
    else if (tau < 14) { env = 1 - smooth((tau - 4) / 10) * 0.92; }
    else { env = 0.08; }
    var burstIdx = Math.floor(t / BURST_PERIOD);
    var amp = 0.75 + 0.25 * hash1(burstIdx * 3.7 + 0.5);
    return env * amp;
  }
  function cycleState(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    var env = burstEnv(t);
    // Halo: never fully out, 0.35 at the hush, full gold at the peak.
    var halo = 0.35 + 0.65 * env;
    return { burst: env, halo: halo, phase: p };
  }

  // ---- Mist background -------------------------------------------
  // No horizon: a grey gradient with slow horizontal mist bands
  // drifting on fbm, so the frame is all spray air.
  function drawMist(t, env) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(MIST_TOP));
    g.addColorStop(0.55, rgb(MIST_MID));
    g.addColorStop(1, rgb(MIST_LOW));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Mist bands: soft horizontal veils with feathered top and
    // bottom edges, alpha breathing slowly. No hard edges, no horizon.
    var b;
    for (b = 0; b < 6; b++) {
      var by = H * (0.10 + b * 0.13) + (fbm(b * 3.1 + t * 0.02) - 0.5) * H * 0.05;
      var bh = H * (0.05 + 0.03 * fbm(b * 7.7 + 1.0));
      var ba = 0.05 + 0.05 * fbm(b * 2.3 + t * 0.03) + 0.04 * env;
      var col = b % 2 === 0 ? SPRAY_LIGHT : MIST_TOP;
      var bg = ctx.createLinearGradient(0, by, 0, by + bh);
      bg.addColorStop(0, rgba(col, 0));
      bg.addColorStop(0.35, rgba(col, a4(ba)));
      bg.addColorStop(0.65, rgba(col, a4(ba)));
      bg.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = bg;
      ctx.fillRect(0, by, W, bh);
    }

    // Ambient motes drifting across the frame.
    var i;
    for (i = 0; i < NMOTE; i++) {
      var m = motes[i];
      var driftX = (fbm(m.x * 4.0 + t * m.drift) - 0.5) * W * 0.06;
      var mx = m.x * W + driftX;
      var my = m.y * H + Math.sin(t * 0.05 + m.tw) * H * 0.008;
      var mr = Math.max(0.7, m.r * W);
      var ma = 0.10 + 0.16 * (0.5 + 0.5 * Math.sin(t * 0.25 + m.tw));
      var mc = m.shade < 0.5 ? SPRAY_LIGHT : SPRAY;
      ctx.fillStyle = rgba(mc, a4(ma));
      ctx.beginPath();
      ctx.moveTo(mx + mr, my);
      ctx.arc(mx, my, mr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Rock ------------------------------------------------------
  // One wet rock mass filling the bottom of the frame, crest
  // irregular, sheen streaks catching what light the mist allows.
  function drawRock(t, env) {
    // Main mass: crest profile down to the bottom edge.
    ctx.fillStyle = rgb(ROCK);
    ctx.beginPath();
    ctx.moveTo(0, rockTopY(0));
    var x;
    for (x = 0; x <= 40; x++) {
      var xf = x / 40;
      ctx.lineTo(xf * W, rockTopY(xf));
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();

    // Darker undercut along the crest, the rock's shadowed lip.
    ctx.fillStyle = rgba(ROCK_DARK, a4(0.55));
    ctx.beginPath();
    ctx.moveTo(0, rockTopY(0));
    for (x = 0; x <= 40; x++) {
      var xf2 = x / 40;
      ctx.lineTo(xf2 * W, rockTopY(xf2));
    }
    for (x = 40; x >= 0; x--) {
      var xf3 = x / 40;
      ctx.lineTo(xf3 * W, rockTopY(xf3) + H * 0.035);
    }
    ctx.closePath();
    ctx.fill();

    // Wet sheen: short pale streaks running down the rock face.
    var s;
    for (s = 0; s < 18; s++) {
      var sx = hash1(s * 3.3 + 1.0) * W;
      var topY = rockTopY(sx / W) + H * 0.02;
      var len = H * (0.04 + hash1(s * 7.9) * 0.10);
      var sw = Math.max(1, W * (0.0015 + hash1(s * 5.1) * 0.003));
      var sa = 0.04 + 0.07 * hash1(s * 11.3) + 0.04 * env;
      ctx.strokeStyle = rgba(ROCK_SHEEN, a4(sa));
      ctx.lineWidth = sw;
      ctx.beginPath();
      ctx.moveTo(sx, topY);
      ctx.lineTo(sx + (hash1(s * 2.7) - 0.5) * W * 0.02, topY + len);
      ctx.stroke();
    }

    // Pale foam flecks where spray meets the rock, pulsing with the burst.
    var f;
    for (f = 0; f < 70; f++) {
      var fx = hash1(f * 4.7 + 4.0) * W;
      var fy = rockTopY(fx / W) + hash1(f * 9.1) * H * 0.06;
      var fr = Math.max(0.6, W * (0.0008 + hash1(f * 6.3) * 0.0016));
      var fa = (0.12 + 0.30 * hash1(f * 8.5)) * (0.35 + 0.65 * env);
      ctx.fillStyle = rgba(SPRAY_LIGHT, a4(fa));
      ctx.beginPath();
      ctx.moveTo(fx + fr, fy);
      ctx.arc(fx, fy, fr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Figure ----------------------------------------------------
  // Crouched, body-painted the colour of the rock: a hunched back,
  // a round head bowed low, knees drawn up. No face, no detail.
  // It half-vanishes into the rock; only the halo marks it.
  function drawFigure(t, halo) {
    var fx = L.figX, fy = L.figBaseY, h = L.figH;
    var hw = h * 0.30; // half width of the crouch
    var headR = L.headR;
    var headX = fx - h * 0.06;
    var headY = L.headY;

    // Faint contact shadow: a thin dark ellipse hugging the crest
    // under the crouch, mostly hidden behind the figure itself.
    ctx.fillStyle = rgba(ROCK_DARK, a4(0.45));
    ctx.beginPath();
    ctx.moveTo(fx + hw * 1.2, fy - h * 0.01);
    ctx.ellipse(fx, fy - h * 0.01, hw * 1.2, h * 0.035, 0, 0, Math.PI * 2);
    ctx.fill();

    // Crouch: one hunched shape, back arched, knees up.
    ctx.fillStyle = rgb(FIGURE);
    ctx.beginPath();
    ctx.moveTo(fx - hw, fy);                                        // back foot
    ctx.quadraticCurveTo(fx - hw * 1.05, fy - h * 0.45, fx - hw * 0.72, fy - h * 0.72); // back rising
    ctx.quadraticCurveTo(fx - hw * 0.35, fy - h * 0.92, fx + hw * 0.15, fy - h * 0.88); // shoulders
    ctx.quadraticCurveTo(fx + hw * 0.62, fy - h * 0.80, fx + hw * 0.85, fy - h * 0.45); // front of knees
    ctx.quadraticCurveTo(fx + hw * 0.95, fy - h * 0.18, fx + hw * 0.55, fy);           // knee down
    ctx.closePath();
    ctx.fill();

    // Head: bowed low, tucked toward the knees.
    ctx.fillStyle = rgb(FIGURE_DARK);
    ctx.beginPath();
    ctx.moveTo(headX + headR, headY);
    ctx.arc(headX, headY, headR, 0, Math.PI * 2);
    ctx.fill();

    // Gold rim where the halo light catches the bowed head and back.
    ctx.strokeStyle = rgba(HALO, a4(0.35 * halo));
    ctx.lineWidth = Math.max(1, W * 0.0016);
    ctx.beginPath();
    ctx.moveTo(headX - headR * 0.9, headY - headR * 0.3);
    ctx.arc(headX, headY, headR, Math.PI * 0.9, Math.PI * 1.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(fx - hw * 0.72, fy - h * 0.72);
    ctx.quadraticCurveTo(fx - hw * 0.35, fy - h * 0.92, fx + hw * 0.15, fy - h * 0.88);
    ctx.stroke();
  }

  // ---- Halo ------------------------------------------------------
  // Backlit mist halo around the head: a radial glow in pale gold,
  // radius and alpha tied to the burst envelope. Drawn after the
  // figure so the gold sits over the mist but behind nothing else.
  function drawHalo(t, halo) {
    var hx = L.figX - L.figH * 0.06;
    var hy = L.headY;
    var hr = L.figH * (0.55 + 0.45 * halo);
    var g = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr);
    g.addColorStop(0, rgba(HALO_PALE, a4(0.55 * halo)));
    g.addColorStop(0.45, rgba(HALO, a4(0.28 * halo)));
    g.addColorStop(1, rgba(HALO, 0));
    ctx.fillStyle = g;
    ctx.fillRect(hx - hr, hy - hr, hr * 2, hr * 2);

    // A thin bright ring at the halo's heart, the backlit edge.
    ctx.strokeStyle = rgba(HALO_PALE, a4(0.5 * halo));
    ctx.lineWidth = Math.max(1, W * 0.0012);
    ctx.beginPath();
    ctx.moveTo(hx + L.headR * 1.5, hy);
    ctx.arc(hx, hy, L.headR * 1.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  // ---- Spray -----------------------------------------------------
  // Burst particle system on a slow timer: each droplet launches
  // once per 20 s burst, arcs ballistically, fades over its life.
  // Streak droplets draw as short lines along their velocity.
  function drawSpray(t, env) {
    var tau = ((t % BURST_PERIOD) + BURST_PERIOD) % BURST_PERIOD;
    var grav = 0.012; // fraction of H per second squared, downward
    var i;
    for (i = 0; i < NDROP; i++) {
      var d = drops[i];
      var age = tau - d.delay;
      if (age < 0 || age > d.life) { continue; }
      var ox = d.ox * W, oy = d.oy * H;
      var px = ox + d.vx * W * age;
      var py = oy + d.vy * H * age + 0.5 * grav * H * age * age;
      if (px < -20 || px > W + 20 || py < -20 || py > H + 20) { continue; }
      var fade = 1 - age / d.life;
      var ma = 0.85 * fade * (0.4 + 0.6 * env);
      var col = d.shade < 0.45 ? SPRAY_LIGHT : (d.shade < 0.8 ? SPRAY : SPRAY_DARK);
      var mr = Math.max(0.7, d.r * W);
      if (d.streak) {
        // Short line along the velocity direction.
        var vx = d.vx * W, vy = d.vy * H + grav * H * age;
        var vl = Math.sqrt(vx * vx + vy * vy) || 1;
        var sl = mr * 4;
        ctx.strokeStyle = rgba(col, a4(ma));
        ctx.lineWidth = Math.max(0.8, mr * 0.7);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px - (vx / vl) * sl, py - (vy / vl) * sl);
        ctx.stroke();
      } else {
        ctx.fillStyle = rgba(col, a4(ma));
        ctx.beginPath();
        ctx.moveTo(px + mr, py);
        ctx.arc(px, py, mr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---- Captions --------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var cs = cycleState(t);
    var env = cs.burst, halo = cs.halo;

    // Ground is grey spray mist; the stage is the whole image.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawMist(t, env);
    drawRock(t, env);
    drawFigure(t, halo);
    drawHalo(t, halo);
    drawSpray(t, env);

    // Caption top left: title, then the gallery date. Hint bottom
    // center. Dark ink stays readable over the pale mist.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(INK, a4(0.85));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№649 · The Column, Pt. 2', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(INK, a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2007 · 06 · 24', W * 0.04, H * 0.055 + L.fsDate * 1.6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(INK, a4(0.88));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the spray burst and the halo answer.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer listeners. The waves have their own
  // rhythm; the viewer is the weather's witness, not its cause.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1990 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1990 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return cycleState(t); },
      burst: function (t) { return burstEnv(t); },
      halo: function (t) { return cycleState(t).halo; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: spray bursts in slow 20 s waves, the halo pulsing
  // with each burst, mist drifting between. Guarded so node-canvas
  // QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
