<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Unread Characters</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG / helpers ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // ---------- constants ----------
  var BASE_SEED = 11420777;
  var GLYPH_SEED = 90210;
  var T0 = 6;                    // fixed first-frame phase
  var COLS = 20, ROWS = 15;      // 300 lens cells
  var OPT0 = 18;                 // initial readable tilt, degrees (x axis)
  var SIGMA = 4.2;               // legibility falloff, degrees
  var SPRING_K = 3.4;            // tilt spring rate (critically damped)
  var LINE = "the crow's eye counts the unlit windows";

  var PANEL = '#05060A';
  var RIM = '42,53,66';          // #2A3542
  var GLASS = '14,20,28';        // #0E141C
  var SPOT = '245,237,220';      // #F5EDDC
  var INK = '255,248,232';       // #FFF8E8

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, PHONE = false;
  var pieceTime = T0;

  // panel geometry (recomputed in fit)
  var PX = 0, PY = 0, PW = 0, PH = 0;      // panel rect
  var GX = 0, GY = 0, GW = 0, GH = 0;      // lens grid rect
  var CW = 0, CH = 0;                      // cell size

  function isPhone(w, h) {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var minScreen = Math.min(sw, sh);
    if (minScreen > 0) return minScreen < 700;
    return h > w * 1.15;
  }

  function fit() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    W = Math.max(50, Math.floor(w));
    H = Math.max(50, Math.floor(h));
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    PHONE = isPhone(W, H);
    PW = Math.min(W * 0.88, H * 1.55);
    PH = Math.min(H * 0.66, PW * 0.62);
    PX = (W - PW) / 2;
    PY = (H - PH) / 2;
    var m = Math.min(PW / COLS, PH / ROWS) * 0.55;
    GX = PX + m; GY = PY + m;
    GW = PW - 2 * m; GH = PH - 2 * m;
    CW = GW / COLS; CH = GH / ROWS;
    buildLayout();
  }

  // ---------- hand-drawn glyph strokes ----------
  // Glyph space: x in [0,1], y in [0,1.12], y down. X-height band ~[0.36,0.95],
  // ascenders reach ~0.05, descenders to ~1.08. Deliberately irregular.
  var GLYPHS = {
    't': { w: 0.82, s: [
      [[0.44,0.08],[0.47,0.34],[0.44,0.64],[0.46,0.87],[0.60,0.95]],
      [[0.14,0.42],[0.44,0.39],[0.78,0.37]] ] },
    'h': { w: 0.88, s: [
      [[0.25,0.05],[0.27,0.48],[0.24,0.95]],
      [[0.26,0.56],[0.36,0.38],[0.56,0.35],[0.71,0.46],[0.73,0.95]] ] },
    'e': { w: 0.84, s: [
      [[0.30,0.60],[0.70,0.58]],
      [[0.70,0.58],[0.68,0.44],[0.50,0.35],[0.33,0.43],[0.28,0.62],[0.34,0.85],[0.54,0.94],[0.71,0.84]] ] },
    'c': { w: 0.82, s: [
      [[0.73,0.45],[0.56,0.33],[0.36,0.38],[0.26,0.60],[0.33,0.85],[0.55,0.95],[0.74,0.85]] ] },
    'r': { w: 0.80, s: [
      [[0.28,0.36],[0.30,0.66],[0.27,0.95]],
      [[0.29,0.52],[0.42,0.37],[0.62,0.35],[0.76,0.44]] ] },
    'o': { w: 0.88, s: [
      [[0.50,0.34],[0.69,0.40],[0.76,0.62],[0.67,0.86],[0.48,0.95],[0.30,0.87],[0.24,0.62],[0.31,0.40],[0.50,0.34]] ] },
    'w': { w: 1.0, s: [
      [[0.10,0.36],[0.20,0.79],[0.29,0.93],[0.41,0.56],[0.50,0.37],[0.59,0.61],[0.69,0.93],[0.79,0.77],[0.90,0.36]] ] },
    "'": { w: 0.34, s: [
      [[0.52,0.16],[0.45,0.33]] ] },
    's': { w: 0.80, s: [
      [[0.70,0.42],[0.50,0.33],[0.31,0.42],[0.33,0.58],[0.67,0.71],[0.70,0.85],[0.50,0.95],[0.30,0.87]] ] },
    'y': { w: 0.84, s: [
      [[0.24,0.36],[0.38,0.58],[0.50,0.76]],
      [[0.76,0.36],[0.62,0.57],[0.50,0.76],[0.40,0.95],[0.30,1.06]] ] },
    'u': { w: 0.88, s: [
      [[0.26,0.36],[0.27,0.79],[0.44,0.93],[0.64,0.90],[0.74,0.68]],
      [[0.74,0.36],[0.73,0.70],[0.74,0.95]] ] },
    'n': { w: 0.88, s: [
      [[0.27,0.95],[0.28,0.55],[0.28,0.38]],
      [[0.28,0.56],[0.39,0.37],[0.58,0.35],[0.72,0.47],[0.73,0.95]] ] },
    'i': { w: 0.36, s: [
      [[0.50,0.40],[0.47,0.95]],
      [[0.50,0.15],[0.53,0.20]] ] },
    'd': { w: 0.90, s: [
      [[0.72,0.52],[0.55,0.36],[0.35,0.40],[0.26,0.62],[0.33,0.87],[0.55,0.94],[0.72,0.80]],
      [[0.74,0.05],[0.72,0.50],[0.74,0.95]] ] },
    'a': { w: 0.86, s: [
      [[0.68,0.46],[0.50,0.34],[0.32,0.42],[0.27,0.65],[0.35,0.88],[0.55,0.94],[0.70,0.82]],
      [[0.70,0.40],[0.71,0.68],[0.72,0.95]] ] },
    'l': { w: 0.38, s: [
      [[0.48,0.05],[0.45,0.50],[0.47,0.91],[0.61,0.96]] ] },
    ' ': { w: 0.52, s: [] }
  };

  // Layout in "line space": x in glyph-width units, y in glyph units.
  // Each stroke is subdivided so consecutive points are <= ~0.2 units apart.
  var layout = null;   // { segs: [[x1,y1,x2,y2], ...], lineW, cx, cy }
  function buildLayout() {
    var rng = mulberry32(GLYPH_SEED);
    var segs = [];
    var x = 0;
    var chars = LINE.split('');
    var i, j, k;
    for (i = 0; i < chars.length; i++) {
      var g = GLYPHS[chars[i]] || GLYPHS[' '];
      var dy = (rng() - 0.5) * 0.055;          // uneven baseline
      var sc = 0.94 + rng() * 0.12;            // per-char scale wobble
      for (j = 0; j < g.s.length; j++) {
        var pts = g.s[j];
        // jitter every authored point once (fixed per seed)
        var jp = [];
        for (k = 0; k < pts.length; k++) {
          jp.push([pts[k][0] + (rng() - 0.5) * 0.05, pts[k][1] + (rng() - 0.5) * 0.05]);
        }
        // place + subdivide
        var placed = [];
        for (k = 0; k < jp.length; k++) {
          placed.push([x + jp[k][0] * sc, jp[k][1] * sc + dy]);
        }
        for (k = 0; k + 1 < placed.length; k++) {
          var ax = placed[k][0], ay = placed[k][1], bx = placed[k + 1][0], by = placed[k + 1][1];
          var d = Math.sqrt((bx - ax) * (bx - ax) + (by - ay) * (by - ay));
          var n = Math.max(1, Math.ceil(d / 0.2));
          for (var sIdx = 0; sIdx < n; sIdx++) {
            segs.push([
              lerp(ax, bx, sIdx / n), lerp(ay, by, sIdx / n),
              lerp(ax, bx, (sIdx + 1) / n), lerp(ay, by, (sIdx + 1) / n)
            ]);
          }
        }
      }
      x += g.w + 0.16;
    }
    layout = { segs: segs, lineW: x - 0.16 };
  }

  // ---------- lens cells (per encoding seed) ----------
  function cellParams(seed) {
    var rng = mulberry32(seed);
    var cells = [];
    for (var i = 0; i < COLS * ROWS; i++) {
      cells.push({
        jx: (rng() - 0.5) * 0.56,        // dot offset within cell
        jy: (rng() - 0.5) * 0.56,
        rad: 0.15 + rng() * 0.15,        // dot radius, fraction of cell
        depth: rng() * 2 - 1,            // parallax depth -1..1
        optOff: (rng() - 0.5) * 4.8,     // per-cell sweet-angle offset, degrees
        bright: 0.30 + rng() * 0.40,     // base dot alpha 0.30..0.70
        phase: rng() * Math.PI * 2       // shimmer phase
      });
    }
    return cells;
  }

  // ---------- interaction state: recorded events only ----------
  var encEvents = [{ t: 0, seed: BASE_SEED, opt: OPT0 }];   // re-encodings
  var springEvents = [{ t: 0, x: 0, y: 0 }];                // tilt targets (degrees)
  var encCount = 0;

  function encAt(t) {
    var e = encEvents[0];
    for (var i = 0; i < encEvents.length; i++) if (encEvents[i].t <= t) e = encEvents[i];
    return e;
  }

  // critically damped spring, folded analytically over target events
  function springAdvance(st, T, dt) {
    if (dt <= 0) return;
    var e = Math.exp(-SPRING_K * dt);
    var A = st.px - T.x, B = st.vx + SPRING_K * A;
    st.px = T.x + (A + B * dt) * e;
    st.vx = (B - SPRING_K * (A + B * dt)) * e;
    A = st.py - T.y; B = st.vy + SPRING_K * A;
    st.py = T.y + (A + B * dt) * e;
    st.vy = (B - SPRING_K * (A + B * dt)) * e;
  }
  function springAt(t) {
    var st = { px: 0, py: 0, vx: 0, vy: 0 };
    var T = { x: 0, y: 0 }, last = 0;
    for (var i = 0; i < springEvents.length; i++) {
      var ev = springEvents[i];
      if (ev.t > t) break;
      springAdvance(st, T, ev.t - last);
      T = { x: ev.x, y: ev.y };
      last = ev.t;
    }
    springAdvance(st, T, t - last);
    return { x: st.px, y: st.py };
  }
  function pushSpring(t, x, y) {
    var lastEv = springEvents[springEvents.length - 1];
    if (Math.abs(lastEv.x - x) < 0.4 && Math.abs(lastEv.y - y) < 0.4 && t - lastEv.t < 0.05) return;
    springEvents.push({ t: t, x: x, y: y });
    if (springEvents.length > 400) springEvents.splice(1, springEvents.length - 200);
  }

  var PROBE = (typeof location !== 'undefined' && /probe/.test(location.search || ''));

  function tiltAt(t) {
    if (PROBE) return { x: encAt(t).opt, y: 0 };
    var s = springAt(t);
    // idle sway: slow, tiny, never near the sweet angle
    s.x += 2.1 * Math.sin(t * 0.11);
    s.y += 1.5 * Math.sin(t * 0.073 + 1.0);
    return s;
  }

  function legib(tiltDeg, optDeg) {
    var d = (tiltDeg - optDeg) / SIGMA;
    return Math.exp(-d * d);
  }

  // ---------- drawing ----------
  function draw(t) {
    var tilt = tiltAt(t);
    var enc = encAt(t);
    var cells = cellParams(enc.seed);
    // re-encode scramble: extra dot jitter decaying after an encoding event
    var scr = 1 + 2.2 * Math.exp(-Math.max(0, t - enc.t) / 0.28);

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    // panel
    ctx.fillStyle = PANEL;
    ctx.fillRect(PX, PY, PW, PH);
    ctx.strokeStyle = 'rgba(' + RIM + ',0.55)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(PX + 0.5, PY + 0.5, PW - 1, PH - 1);
    ctx.strokeStyle = 'rgba(' + RIM + ',0.16)';
    ctx.lineWidth = 5;
    ctx.strokeRect(PX + 4, PY + 4, PW - 8, PH - 8);

    var tiltRadX = tilt.x * Math.PI / 180;
    var tiltRadY = tilt.y * Math.PI / 180;

    // light stays inside the panel: clip dots + strokes to the panel rect
    ctx.save();
    ctx.beginPath();
    ctx.rect(PX, PY, PW, PH);
    ctx.clip();

    // cells: frosted glass + rims, then bokeh dots
    var ci, cx, cy, cell;
    for (ci = 0; ci < cells.length; ci++) {
      cell = cells[ci];
      cx = GX + (ci % COLS) * CW;
      cy = GY + Math.floor(ci / COLS) * CH;
      ctx.fillStyle = 'rgba(' + GLASS + ',0.55)';
      ctx.fillRect(cx + 1, cy + 1, CW - 2, CH - 2);
      ctx.strokeStyle = 'rgba(' + RIM + ',0.30)';
      ctx.lineWidth = 1;
      ctx.strokeRect(cx + 1.5, cy + 1.5, CW - 3, CH - 3);
    }
    var lSum = 0, lN = 0;
    for (ci = 0; ci < cells.length; ci++) {
      cell = cells[ci];
      var col = ci % COLS, row = Math.floor(ci / COLS);
      var L = legib(tilt.x, enc.opt + cell.optOff);
      var shimmer = 0.88 + 0.12 * Math.sin(t * 0.6 + cell.phase) + tilt.y * 0.004;
      var a = cell.bright * (1 - L * 0.87) * shimmer;
      if (a < 0.004) { if (ci % 7 === 0) { lSum += L; lN++; } continue; }
      var dx = GX + (col + 0.5) * CW + cell.jx * CW * scr + tiltRadX * cell.depth * CW * 1.5;
      var dy2 = GY + (row + 0.5) * CH + cell.jy * CH * scr + tiltRadY * cell.depth * CH * 0.9;
      var r = cell.rad * Math.min(CW, CH) * (PHONE ? 1.15 : 1);
      ctx.fillStyle = 'rgba(' + SPOT + ',' + (a * 0.09).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(dx, dy2, r * 2.1, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(' + SPOT + ',' + (a * 0.20).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(dx, dy2, r * 1.45, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(' + SPOT + ',' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(dx, dy2, r, 0, 6.2832); ctx.fill();
      if (ci % 7 === 0) { lSum += L; lN++; }
    }

    // hidden hand-drawn line: alpha per segment from the cell beneath its midpoint
    if (layout) {
      var S = (PW * 0.90) / layout.lineW;            // px per glyph unit
      var tx0 = PX + (PW - layout.lineW * S) / 2;
      var ty0 = PY + PH / 2 - 0.56 * S * 0.94;       // glyph band [0,1.12] centered
      var lw = Math.max(1.1, S * 0.15) * (PHONE ? 1.3 : 1);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      var si, seg, mx, my, mc, mrow, mcol, sL, alpha;
      // soft under-glow pass
      ctx.lineWidth = lw * 2.3;
      for (si = 0; si < layout.segs.length; si++) {
        seg = layout.segs[si];
        mx = tx0 + (seg[0] + seg[2]) * 0.5 * S;
        my = ty0 + (seg[1] + seg[3]) * 0.5 * S * 0.94;
        mcol = clamp(Math.floor((mx - GX) / CW), 0, COLS - 1);
        mrow = clamp(Math.floor((my - GY) / CH), 0, ROWS - 1);
        mc = cells[mrow * COLS + mcol];
        sL = legib(tilt.x, enc.opt + mc.optOff);
        alpha = Math.pow(sL, 1.4) * 0.20;
        if (alpha < 0.004) continue;
        ctx.strokeStyle = 'rgba(' + INK + ',' + alpha.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(tx0 + seg[0] * S, ty0 + seg[1] * S * 0.94);
        ctx.lineTo(tx0 + seg[2] * S, ty0 + seg[3] * S * 0.94);
        ctx.stroke();
      }
      // core stroke pass
      ctx.lineWidth = lw;
      for (si = 0; si < layout.segs.length; si++) {
        seg = layout.segs[si];
        mx = tx0 + (seg[0] + seg[2]) * 0.5 * S;
        my = ty0 + (seg[1] + seg[3]) * 0.5 * S * 0.94;
        mcol = clamp(Math.floor((mx - GX) / CW), 0, COLS - 1);
        mrow = clamp(Math.floor((my - GY) / CH), 0, ROWS - 1);
        mc = cells[mrow * COLS + mcol];
        sL = legib(tilt.x, enc.opt + mc.optOff);
        alpha = Math.pow(sL, 1.4) * 0.96;
        if (alpha < 0.004) continue;
        ctx.strokeStyle = 'rgba(' + INK + ',' + alpha.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(tx0 + seg[0] * S, ty0 + seg[1] * S * 0.94);
        ctx.lineTo(tx0 + seg[2] * S, ty0 + seg[3] * S * 0.94);
        ctx.stroke();
      }
    }

    ctx.restore();

    return lN ? lSum / lN : 0;   // mean legibility (audio + tone trigger)
  }

  // ---------- audio (Franke rule: lazy, gesture-gated, typeof-guarded) ----------
  var AC = null, shimGain = null, prevL = 0;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    try {
      var Ctor = (typeof window !== 'undefined') ? (window.AudioContext || window.webkitAudioContext) : null;
      if (!Ctor) return;
      AC = new Ctor();
      var master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
      // granular shimmer: looped noise through a narrow bandpass
      var len = 2 * AC.sampleRate;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      var rngA = mulberry32(4242);
      for (var i = 0; i < len; i++) d[i] = rngA() * 2 - 1;
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 7;
      shimGain = AC.createGain(); shimGain.gain.value = 0;
      src.connect(bp); bp.connect(shimGain); shimGain.connect(master);
      src.start();
      AC._master = master;
    } catch (err) { AC = null; }
  }
  function strikeTone() {
    if (!AC) return;
    try {
      var now = AC.currentTime;
      var o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = 587.33;
      var g = AC.createGain();
      g.gain.setValueAtTime(0.0, now);
      g.gain.linearRampToValueAtTime(0.045, now + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 1.9);
      o.connect(g); g.connect(AC._master);
      o.start(now); o.stop(now + 2.0);
    } catch (err) { /* silent */ }
  }
  function audioTick(L) {
    if (!AC || !shimGain) return;
    try {
      shimGain.gain.setTargetAtTime(L * 0.02, AC.currentTime, 0.25);
      if (prevL < 0.8 && L >= 0.8) strikeTone();
    } catch (err) { /* silent */ }
    prevL = L;
  }

  // ---------- pointer interaction ----------
  var pDown = false, dragMoved = 0, downX = 0, downY = 0, lastPX = 0, lastPY = 0, downTilt = { x: 0, y: 0 };
  var lastTapT = -10, lastTapX = 0, lastTapY = 0;

  function pointerPos(e) {
    if (e.clientX !== undefined) return { x: e.clientX, y: e.clientY };
    return { x: e.offsetX || 0, y: e.offsetY || 0 };
  }

  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    pDown = true; dragMoved = 0;
    var p = pointerPos(e); downX = p.x; downY = p.y; lastPX = p.x; lastPY = p.y;
    downTilt = springAt(pieceTime);
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!pDown) return;
    var p = pointerPos(e);
    dragMoved += Math.abs(p.x - lastPX) + Math.abs(p.y - lastPY);
    lastPX = p.x; lastPY = p.y;
    if (dragMoved > 8) {
      var tx = clamp(downTilt.x + (p.x - downX) / (PW * 0.5) * 35, -35, 35);
      var ty = clamp(downTilt.y + (p.y - downY) / (PH * 0.5) * 22, -22, 22);
      pushSpring(pieceTime, tx, ty);
    }
  });

  function endPointer(e) {
    if (!pDown) return;
    pDown = false;
    var p = pointerPos(e);
    if (dragMoved <= 10) {
      var dt = pieceTime - lastTapT;
      var ddx = p.x - lastTapX, ddy = p.y - lastTapY;
      if (dt > 0 && dt < 0.35 && ddx * ddx + ddy * ddy < 1600) {
        // double-tap: re-encode — new scramble, new readable angle
        encCount++;
        var seed = BASE_SEED + encCount * 7919;
        var rngE = mulberry32(seed);
        var opt = (rngE() < 0.5 ? -1 : 1) * (13 + rngE() * 16);
        encEvents.push({ t: pieceTime, seed: seed, opt: opt });
        pushSpring(pieceTime, 0, 0);
        lastTapT = -10;
      } else {
        // single tap: hold the current viewpoint for 6 seconds
        var cur = tiltAt(pieceTime);
        springEvents.push({ t: pieceTime, x: cur.x, y: cur.y });
        springEvents.push({ t: pieceTime + 6, x: 0, y: 0 });
        lastTapT = pieceTime; lastTapX = p.x; lastTapY = p.y;
      }
    } else {
      // drag released: relax back to head-on rest
      pushSpring(pieceTime, 0, 0);
      lastTapT = -10;
    }
    draw(pieceTime);
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- run ----------
  fit();
  draw(T0);
  pieceTime = T0;

  if (typeof window !== 'undefined') {
    if (window.visualViewport) {
