<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.439 The Fox Wears the Lights</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2B8C6; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.439 The Fox Wears the Lights (angelina_bambina_dsgn,
// EXPANSION #47, prompt ANG7). Her animal-accessory
// merge: a woman with long white hair, in a green and
// orange knitted beanie with a mustard pom-pom, cradles
// a stylised white fox whose TAIL IS a spiral ribbon
// wrapped in multicoloured festive lights - the garland
// is the tail's anatomy, not a decoration on it. Soft
// pink ground, drifting snow, a crescent moon. Serene:
// no other animals, no text anywhere.
// WATCH-ONLY 120s master loop = LCM(3, 8, 10): the
// tail-lights chase on 40 whole 3s cycles, brightness
// stepped flat per bulb, phase-shifted along the tail;
// the fox's ear twitches in 15 fixed 8s slots; the
// woman's breath fogs in 12 fixed 10s slots as a
// stepped flat-alpha cloud at her mouth that grows,
// thins in steps and is gone before the next event;
// the snow is a fixed dot table, each dot completing
// one whole-field fall every 10s. DOUBLE-TAP advances
// a FIXED AUTHORED TABLE of exactly 3 entries (light
// colour order + moon position change together).
// Frame one is drawn synchronously at the constant
// phase T = 21.35s: mid-chase with several bulbs lit,
// breath fog at its middle step, snow mid-fall, moon
// top-left. The clock anchors there and advances in
// fixed 1/60 ticks, never from a wall clock. Flat
// colour only, one canvas, no offscreen canvas, no
// gradients, no shadowBlur; the only translucency is
// the stepped flat-alpha breath fog (and flat-alpha
// bulb glow steps, blush and grounding shadow).
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette (closed) -----------------------------------
// The eleven specced hexes and nothing else. Her skin
// resolves inside the palette to the moon cream (the
// No.433 resolution in this set); the fox's nose, eyes
// and bulb sockets take the hair blue shadow; her coat
// and scarf take the beanie's green and orange, her
// mittens the beanie orange. Documented in process.md.
var GROUND = '#F2B8C6';    // soft pink ground, page ground
var FOX = '#FBF7F0';       // fox white, snow
var BEANIE_G = '#5C8A4A';  // beanie green, her coat
var BEANIE_O = '#E8823C';  // beanie orange, scarf, mittens
var POM = '#D9A441';       // pom-pom mustard
var L_PINK = '#F06A8A';    // light 1, blush
var L_GOLD = '#F5A623';    // light 2
var L_TEAL = '#4FB0A5';    // light 3
var L_BLUE = '#4A7AB5';    // light 4
var MOON = '#F6E7B4';      // moon cream, her skin
var HAIR = '#F5F2EA';      // hair white
var HAIRSH = '#B8C4D8';    // hair blue shadow, fox details

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 120;
if (LOOP !== 120) throw new Error('Fox loop must be 120s');
if (LOOP / 3 !== 40) throw new Error('chase must hold 40 whole 3s cycles');
if (LOOP / 8 !== 15) throw new Error('ear must hold 15 whole 8s slots');
if (LOOP / 10 !== 12) throw new Error('fog and snow must hold 12 whole 10s cycles');
var TICK = 1 / 60;
var T0 = 21.35;
var T = T0;

// ---- the authored table -----------------------------------
// Exactly 3 entries (asserted): the light colour order
// and the moon position change together per entry.
// Double-tap advances the table by one.
var TABLE = [
  { order: [L_PINK, L_GOLD, L_TEAL, L_BLUE], moon: { x: 175,  y: 150 } },
  { order: [L_TEAL, L_BLUE, L_PINK, L_GOLD], moon: { x: 1105, y: 150 } },
  { order: [L_GOLD, L_PINK, L_BLUE, L_TEAL], moon: { x: 640,  y: 108 } }
];
if (TABLE.length !== 3) throw new Error('table must hold exactly 3 entries');
for (var ti = 0; ti < 3; ti++)
  if (TABLE[ti].order.length !== 4) throw new Error('each entry must order all 4 light colours');
var tabIdx = 0;

// ---- the snow ------------------------------------------------
// A fixed dot table from a fixed-seed LCG: 110 dots,
// each completing one whole-field fall every 10s (12
// falls per loop), with a sideways drift on the same
// 10s period so the seam is exact.
var SNOW = [];
(function () {
  var seed = 43907;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  for (var i = 0; i < 110; i++) {
    SNOW.push({
      x: rnd() * DW,
      y: rnd(),
      r: 1.8 + rnd() * 2.8,
      a: 0.45 + rnd() * 0.5,
      amp: 8 + rnd() * 10,
      ph: rnd() * Math.PI * 2
    });
  }
})();
if (SNOW.length !== 110) throw new Error('snow table must hold exactly 110 dots');

// ---- the tail spiral -------------------------------------------
// The tail is a tapering spiral ribbon: an Archimedean
// curl starting at the fox's rear (795, 705) and winding
// inward across the right half to its tip near the
// spiral centre (1010, 590). Radius 244 -> 36 over 1.9
// turns. The 14 bulbs sit ON this curve.
var TC = { x: 1010, y: 590 };
var TA0 = 2.65, TSPIN = 11.94, TR0 = 244, TR1 = 36;
function tailPoint(u) {
  var a = TA0 - TSPIN * u;
  var r = TR0 + (TR1 - TR0) * u;
  return { x: TC.x + r * Math.cos(a), y: TC.y + r * Math.sin(a) };
}
var NB = 14;
if (NB !== 14) throw new Error('tail must carry exactly 14 bulbs');

// ---- state -------------------------------------------------------
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
var lastNow = -1, acc = 0;

// QA hook via the renderer's query string (?seed=N):
// seed=N starts the piece on table entry N. Default
// play is unaffected.
var QS = (typeof location !== 'undefined' && location.search) || '';
var sm = QS.match(/seed=(\d)/);
if (sm) tabIdx = clampInt(parseInt(sm[1], 10), 0, 2);
function clampInt(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---- small helpers --------------------------------------------------
function frac(v) { return v - Math.floor(v); }
function ell(x, y, rx, ry, rot, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function circ(x, y, r, col) { ell(x, y, r, r, 0, col); }
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function rr(x, y, w, h, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath(); ctx.fill();
}
function seg(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function arcStroke(x, y, r, a0, a1, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke();
}

// ---- the moon ---------------------------------------------------------
// A crescent carved from the cream disc by the ground
// colour; the ground is flat pink everywhere, so the
// carve holds wherever the table places the moon.
function drawMoon(m) {
  circ(m.x, m.y, 46, MOON);
  circ(m.x + 19, m.y - 9, 41, GROUND);
}

// ---- the woman -----------------------------------------------------------
// Long white hair behind and beside the face, a green
// coat, an orange scarf, the green-and-orange beanie
// with stitch data and the mustard pom-pom on top.
function hairMass(dx, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(472 + dx, 198);
  ctx.quadraticCurveTo(586 + dx, 210, 600 + dx, 420);
  ctx.quadraticCurveTo(606 + dx, 580, 548 + dx, 706);
  ctx.lineTo(398 + dx, 706);
  ctx.quadraticCurveTo(342 + dx, 580, 348 + dx, 420);
  ctx.quadraticCurveTo(358 + dx, 210, 472 + dx, 198);
  ctx.closePath(); ctx.fill();
}
function drawWoman() {
  // Back hair: a shadow mass, then the white mass inside
  // it - wide at the crown, tapering to the hem.
  hairMass(9, HAIRSH);
  hairMass(0, HAIR);
  // Coat.
  ctx.fillStyle = BEANIE_G;
  ctx.beginPath();
  ctx.moveTo(398, 596);
  ctx.quadraticCurveTo(392, 730, 384, 862);
  ctx.lineTo(560, 862);
  ctx.quadraticCurveTo(556, 720, 548, 596);
  ctx.quadraticCurveTo(472, 566, 398, 596);
  ctx.closePath(); ctx.fill();
  // Scarf: a band at the neck and a hanging tail on the
  // side away from the fox's head.
  rr(420, 542, 106, 30, 14, BEANIE_O);
  rr(430, 564, 30, 78, 12, BEANIE_O);
  // Face.
  circ(472, 388, 78, MOON);
  // Front hair: side locks framing the face.
  rr(384, 344, 34, 218, 16, HAIR);
  rr(526, 344, 34, 218, 16, HAIR);
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.moveTo(392, 392);
  ctx.quadraticCurveTo(400, 306, 472, 302);
  ctx.quadraticCurveTo(544, 306, 552, 392);
  ctx.quadraticCurveTo(472, 366, 392, 392);
  ctx.closePath(); ctx.fill();
  // Closed eyes, nose, mouth, blush. Calm, minimal.
  arcStroke(445, 388, 11, Math.PI * 1.12, Math.PI * 1.88, 4, HAIRSH);
  arcStroke(499, 388, 11, Math.PI * 1.12, Math.PI * 1.88, 4, HAIRSH);
  circ(472, 406, 2.6, HAIRSH);
  arcStroke(472, 416, 8, Math.PI * 0.15, Math.PI * 0.85, 3.6, HAIRSH);
  ctx.save(); ctx.globalAlpha = 0.38;
  ell(416, 412, 13, 8, 0, L_PINK);
  ell(528, 412, 13, 8, 0, L_PINK);
  ctx.restore();
  drawBeanie();
}
function drawBeanie() {
  // Dome + brim as one clipped shape: green dome with
  // two orange stripes, an orange brim; stitch rows are
  // data clipped inside it, never a pattern canvas.
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(378, 342);
  ctx.quadraticCurveTo(382, 238, 472, 232);
  ctx.quadraticCurveTo(562, 238, 566, 342);
  ctx.closePath();
  ctx.clip();
  rect(370, 220, 204, 130, BEANIE_G);
  rect(370, 262, 204, 17, BEANIE_O);
  rect(370, 296, 204, 17, BEANIE_O);
  rect(370, 322, 204, 28, BEANIE_O);
  // Stitch dashes: short verticals in rows, alternating
  // the two beanie colours at flat alpha.
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = 3; ctx.lineCap = 'round';
  var rows = [246, 282, 312, 334], cols, r, c;
  for (r = 0; r < rows.length; r++) {
    ctx.strokeStyle = (r % 2 === 0) ? BEANIE_O : HAIR;
    if (r === 3) ctx.strokeStyle = BEANIE_G;
    ctx.beginPath();
    for (c = 0; c < 9; c++) {
      var sx = 396 + c * 19 + (r % 2) * 9;
      ctx.moveTo(sx, rows[r] - 5); ctx.lineTo(sx, rows[r] + 5);
    }
  }
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
  // Pom-pom: a cluster of mustard circles on top.
  var pom = [[472, 214, 21], [454, 224, 15], [490, 224, 15], [463, 202, 14], [482, 203, 13], [472, 226, 15]];
  for (var i = 0; i < pom.length; i++) circ(pom[i][0], pom[i][1], pom[i][2], POM);
}

// ---- her arms and mittens --------------------------------------------------
// Sleeves reach out of the coat and run under the fox;
// the orange mittens peek out below its belly where her
// hands hold it.
function drawArms() {
  seg(424, 692, 566, 756, 36, BEANIE_G);
  seg(436, 712, 742, 762, 36, BEANIE_G);
}
// The mittens are drawn before the fox, so the body
// overlaps their tops and only their lower halves peek
// out below the belly: hands cupping it from underneath.
function drawMittens() {
  circ(600, 766, 19, BEANIE_O);
  circ(742, 770, 19, BEANIE_O);
}

// ---- the fox ------------------------------------------------------------------
// Body, tucked paws, head with a pointed snout, two
// ears (the far ear twitches in its 8s slots), a closed
// eye and a small nose. The tail is drawn separately:
// it is the spiral the lights live on.
function drawFox(lt) {
  // Body.
  ell(665, 672, 136, 88, -0.06, FOX);
  ell(600, 716, 62, 40, 0.2, FOX);            // haunch
  // Paws tucked at the bottom.
  ell(596, 752, 26, 12, 0.1, FOX);
  ell(706, 756, 26, 12, -0.1, FOX);
  seg(588, 752, 602, 752, 3, HAIRSH);
  seg(698, 756, 712, 756, 3, HAIRSH);
  // Head.
  circ(548, 592, 63, FOX);
  ctx.fillStyle = FOX;                        // snout
  ctx.beginPath();
  ctx.moveTo(500, 566);
  ctx.quadraticCurveTo(452, 592, 492, 622);
  ctx.quadraticCurveTo(524, 638, 548, 624);
  ctx.quadraticCurveTo(530, 592, 500, 566);
  ctx.closePath(); ctx.fill();
  circ(478, 600, 6.5, HAIRSH);                // nose
  arcStroke(540, 588, 12, Math.PI * 1.1, Math.PI * 1.9, 4, HAIRSH); // closed eye
  ctx.save(); ctx.globalAlpha = 0.35;
  ell(528, 616, 12, 7, 0, L_PINK);            // cheek
  ctx.restore();
  // Ears: the near ear still, the far ear twitching.
  drawEar(516, 540, -0.18, 0);
  var slot = Math.floor(lt / 8), local = lt - slot * 8;
  var tw = 0;
  if (local < 0.7) tw = -0.38 * Math.sin(Math.PI * local / 0.7);
  drawEar(578, 532, 0.22, tw);
}
function drawEar(x, y, rot, twitch) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot + twitch);
  ctx.fillStyle = FOX;
  ctx.beginPath();
  ctx.moveTo(-19, 12);
  ctx.quadraticCurveTo(-14, -30, 0, -42);
  ctx.quadraticCurveTo(15, -28, 19, 12);
  ctx.quadraticCurveTo(0, 2, -19, 12);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = GROUND;
  ctx.beginPath();
  ctx.moveTo(-9, 6);
  ctx.quadraticCurveTo(-6, -18, 0, -26);
  ctx.quadraticCurveTo(7, -16, 9, 6);
  ctx.quadraticCurveTo(0, 0, -9, 6);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---- the tail and its lights -----------------------------------------------------
// The ribbon is stroked along the spiral in segments of
// shrinking width, base 56 to tip 15. The bulbs sit ON
// the curve; each bulb's colour comes from the table
// order and its brightness from the chase: one wave
// travels the tail per 3s cycle, stepped flat in three
// levels (dim, lit, full with a flat halo).
var CHASE_ALPHA = [0.30, 0.62, 1.0];
function drawTail(lt, entry) {
  var i, p, q;
  ctx.lineCap = 'round';
  for (i = 0; i < 48; i++) {
    var u0 = i / 48, u1 = (i + 1) / 48;
    p = tailPoint(u0); q = tailPoint(u1);
    ctx.strokeStyle = FOX;
    ctx.lineWidth = 56 + (15 - 56) * u0;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }
  // Tip tuft.
  var tip = tailPoint(1);
  circ(tip.x, tip.y, 10, FOX);
  for (i = 0; i < NB; i++) {
    var u = (i + 0.5) / NB;
    var bp = tailPoint(u);
    var ph = frac(lt / 3 - i / NB);
    var lvl = ph < 0.25 ? 2 : (ph < 0.55 ? 1 : 0);
    var col = entry.order[i % 4];
    if (lvl === 2) {
      ctx.save(); ctx.globalAlpha = 0.16;
      circ(bp.x, bp.y, 22, col);
      ctx.restore();
    }
    circ(bp.x, bp.y, 2.6, HAIRSH);            // socket
    ctx.save(); ctx.globalAlpha = CHASE_ALPHA[lvl];
    circ(bp.x, bp.y, 11.5, col);
    ctx.restore();
    if (lvl === 2) {
      ctx.save(); ctx.globalAlpha = 0.5;
      circ(bp.x - 4, bp.y - 4, 3.4, HAIR);
      ctx.restore();
    }
  }
}

// ---- the breath fog ---------------------------------------------------------------
// One event per 10s slot, 3s long: a small cloud at her
// mouth in three stepped flat-alpha stages - it grows,
// holds its fullest step, then thins and is gone well
// before the next slot.
function drawFog(lt) {
  var local = lt - Math.floor(lt / 10) * 10;
  if (local >= 3) return;
  var u = local / 3;
  var stage = u < 0.34 ? 0 : (u < 0.67 ? 1 : 2);
  var alphas = [0.16, 0.30, 0.13];
  var grow = [0.7, 1.0, 1.25][stage];
  var cxp = 492 + u * 52, cyp = 428 + u * 12;
  ctx.save(); ctx.globalAlpha = alphas[stage];
  ell(cxp, cyp, 17 * grow, 11 * grow, 0, HAIR);
  ell(cxp + 15 * grow, cyp - 5 * grow, 13 * grow, 9 * grow, 0, HAIR);
  ell(cxp + 28 * grow, cyp + 2 * grow, 10 * grow, 7 * grow, 0, HAIR);
  ell(cxp + 8 * grow, cyp + 7 * grow, 11 * grow, 7 * grow, 0, HAIR);
  ctx.restore();
}

// ---- the snow ------------------------------------------------------------------------
function drawSnow(lt) {
  var fall = lt / 10;
  for (var i = 0; i < SNOW.length; i++) {
    var d = SNOW[i];
    var y = frac(d.y + fall) * (DH + 40) - 20;
    var x = d.x + d.amp * Math.sin(Math.PI * 2 * fall + d.ph);
    ctx.save(); ctx.globalAlpha = d.a;
    circ(x, y, d.r, FOX);
    ctx.restore();
  }
}

// ---- draw ------------------------------------------------------------------------------
function draw() {
  var lt = T % LOOP;
  var entry = TABLE[tabIdx];
  rect(-2400, -2400, DW + 4800, DH + 4800, GROUND);
  // Grounding shadow under the pair and the tail.
  ctx.save(); ctx.globalAlpha = 0.16;
  ell(700, 852, 400, 26, 0, HAIRSH);
  ctx.restore();
  drawWoman();
  drawArms();
  drawMittens();
  drawFox(lt);
  drawTail(lt, entry);
  drawMoon(entry.moon);
  drawSnow(lt);
  drawFog(lt);
}

// ---- step ---------------------------------------------------------------------------------
// The piece is watch-only: all motion reads from the
// loop clock, so there is no per-tick state to advance.
function step() {}

// ---- pointer: double-tap advances the authored table ---------------------------------------
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  var dxT = p.x - lastTapX, dyT = p.y - lastTapY;
  if (T - lastTapT < 0.34 && Math.sqrt(dxT * dxT + dyT * dyT) < 60) {
    tabIdx = (tabIdx + 1) % 3;
    lastTapT = -10;
  } else {
    lastTapT = T; lastTapX = p.x; lastTapY = p.y;
  }
});

// ---- sizing: CENTRED fit ----------------------------------------------------------------------
// The pair keeps its shape at any size; the page ground
// is the ground pink, so the letterbox bands read as
// more of the same pink field.
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Page ground: the ground pink across the whole canvas.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
