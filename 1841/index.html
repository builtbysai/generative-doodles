<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Inventors</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0B0D; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: three lineages of invented sound play themselves on a dark stage,
   and a slow band of color paraphrases changes in the sound too small to
   notice at first. The viewer only watches. */
var TAU = Math.PI * 2;
var GROUND = '#0B0B0D';
var STEEL = '#9AA3AD';
var STEEL_HI = '#D5DAE0';
var WOOD = '#C9A876';
var WOOD_DK = '#8A6F47';
var BRASS = '#B08D3C';
var BRASS_HI = '#D9B45C';
var PLATE = '#101013';
var PLATE_LINE = 'rgba(237,237,232,0.30)';
var TITLE_INK = '#EDEDE8';
var HINT_INK = '#9AA3AD';
var HORIZON = 240;         /* strike/pluck schedule horizon, seconds */
var FRAME_T = 63.0;        /* fixed phase: deep blue band, bar 3 mid-strike, leaf 2 ringing */
var BAND_PERIOD = 240;     /* band hue cycle, seconds: deep blue to amber and back */
var DISC_PERIOD = 24;      /* one disc revolution, seconds */
var JI = [1, 9 / 8, 5 / 4, 4 / 3, 3 / 2, 5 / 3, 15 / 8, 2]; /* just-intonation bar ratios */
var BASE_F = 196;          /* lowest bar, Hz */
var LEAF_F = [880, 932, 988, 1046, 1108, 1174, 1244];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hash2(x, y) {
  var s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1841);
var phaseT = FRAME_T;
var soundOn = false;
var audioCtx = null;
var siren = null;
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
var lastT = null;
/* ---- seeded schedules: bar strikes and leaf plucks, fixed at load ---- */
var STRIKES = [];
var PLUCKS = [];
(function () {
  var t = 0.6;
  while (t < HORIZON) {
    t += -Math.log(1 - rng()) / 0.35;
    if (t >= HORIZON) break;
    STRIKES.push({ t0: t, bar: Math.floor(rng() * 8) });
  }
  t = 1.1;
  while (t < HORIZON) {
    t += -Math.log(1 - rng()) / 0.22;
    if (t >= HORIZON) break;
    PLUCKS.push({ t0: t, leaf: Math.floor(rng() * 7), amp: 0.5 + rng() * 0.5 });
  }
  /* frame-one guarantees: a strike and a pluck already ringing at t = 63 */
  STRIKES.push({ t0: 62.85, bar: 3 });
  PLUCKS.push({ t0: 62.70, leaf: 2, amp: 0.9 });
  STRIKES.sort(function (a, b) { return a.t0 - b.t0; });
  PLUCKS.sort(function (a, b) { return a.t0 - b.t0; });
})();
var LEAVES = [];
(function () {
  var i;
  for (i = 0; i < 7; i++) {
    LEAVES.push({
      fx: 0.09 + i * 0.035,
      len: 0.16 + 0.05 * hash2(i + 3, 11),
      per: 5.5 + 3.5 * hash2(i, 7),
      ph: hash2(i + 9, 2) * TAU,
      per2: 2.3 + 1.4 * hash2(i + 5, 13),
      ph2: hash2(i, 17) * TAU
    });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function sceneRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- the color band: closed-form slow hue, soft horizontal wash ---- */
function bandHue(t) {
  return 130 + 90 * Math.sin(TAU * t / BAND_PERIOD);
}
function bandY(sc, t) {
  return sc.y + sc.h * (0.42 + 0.10 * Math.sin(TAU * t / 180 + 1.2));
}
function drawBand(sc, t) {
  var hue = bandHue(t);
  var cy = bandY(sc, t);
  var half = sc.h * 0.16;
  var g = ctx.createLinearGradient(0, cy - half, 0, cy + half);
  g.addColorStop(0, 'hsla(' + hue.toFixed(1) + ',55%,55%,0)');
  g.addColorStop(0.5, 'hsla(' + hue.toFixed(1) + ',55%,55%,0.14)');
  g.addColorStop(1, 'hsla(' + hue.toFixed(1) + ',55%,55%,0)');
  ctx.fillStyle = g;
  ctx.fillRect(sc.x, cy - half, sc.w, half * 2);
  /* slow left-to-right sweep inside the wash */
  var sx = sc.x + sc.w * ((t % 90) / 90);
  var rg = ctx.createRadialGradient(sx, cy, 0, sx, cy, sc.w * 0.18);
  rg.addColorStop(0, 'hsla(' + hue.toFixed(1) + ',60%,65%,0.06)');
  rg.addColorStop(1, 'hsla(' + hue.toFixed(1) + ',60%,65%,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(sx - sc.w * 0.18, cy - sc.w * 0.18, sc.w * 0.36, sc.w * 0.36);
}
function leafBoost(leafIdx, te) {
  var b = 0, i, p, dt;
  for (i = 0; i < PLUCKS.length; i++) {
    p = PLUCKS[i];
    if (p.leaf !== leafIdx) continue;
    dt = te - p.t0;
    if (dt < 0 || dt > 2.5) continue;
    b += p.amp * Math.exp(-dt / 0.7) * Math.sin(TAU * dt * 2.2 + LEAVES[leafIdx].ph);
  }
  return b;
}
function drawBertoia(sc, t, te) {
  var x0 = sc.x + sc.w * 0.06, x1 = sc.x + sc.w * 0.33;
  var topY = sc.y + sc.h * 0.20, floorY = sc.y + sc.h * 0.80;
  var i, L, px, sway, tipX, tipY;
  /* frame: top bar and two posts */
  ctx.strokeStyle = rgba(STEEL, 0.55);
  ctx.lineWidth = Math.max(1.5, sc.w * 0.004);
  ctx.beginPath();
  ctx.moveTo(x0, topY); ctx.lineTo(x1, topY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x0, topY); ctx.lineTo(x0, floorY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x1, topY); ctx.lineTo(x1, floorY);
  ctx.stroke();
  for (i = 0; i < LEAVES.length; i++) {
    L = LEAVES[i];
    px = sc.x + sc.w * L.fx;
    sway = 0.018 * Math.sin(TAU * t / L.per + L.ph)
         + 0.010 * Math.sin(TAU * t / L.per2 + L.ph2)
         + 0.05 * leafBoost(i, te);
    tipX = px + Math.sin(sway) * sc.h * L.len;
    tipY = topY + Math.cos(sway) * sc.h * L.len;
    ctx.strokeStyle = rgba(STEEL, 0.85);
    ctx.lineWidth = Math.max(1, sc.w * 0.0022);
    ctx.beginPath();
    ctx.moveTo(px, topY);
    ctx.lineTo(tipX, tipY);
    ctx.stroke();
    ctx.strokeStyle = rgba(STEEL_HI, 0.5);
    ctx.lineWidth = Math.max(0.75, sc.w * 0.0011);
    ctx.beginPath();
    ctx.moveTo(px + 1.5, topY);
    ctx.lineTo(tipX + 1.5, tipY);
    ctx.stroke();
  }
}
function barGeom(sc, i) {
  var cx = sc.x + sc.w * 0.50;
  var len = sc.w * (0.13 + 0.024 * i);
  var y = sc.y + sc.h * (0.30 + i * 0.062);
  return { x: cx - len / 2, y: y, w: len, h: Math.max(3, sc.h * 0.016), cx: cx };
}
function strikeState(barIdx, te) {
  var dt = -1, i, s;
  for (i = 0; i < STRIKES.length; i++) {
    s = STRIKES[i];
    if (s.bar !== barIdx) continue;
    if (te >= s.t0 && te < s.t0 + 0.6) { dt = te - s.t0; break; }
  }
  return dt;
}
function drawPartch(sc, t, te) {
  var i, b, dt, dip, vib, my, hx, hy;
  for (i = 0; i < 8; i++) {
    b = barGeom(sc, i);
    dt = strikeState(i, te);
    vib = 0;
    if (dt >= 0) vib = 1.6 * Math.exp(-dt / 0.25) * Math.sin(TAU * dt * 8);
    ctx.fillStyle = WOOD;
    ctx.fillRect(b.x, b.y + vib, b.w, b.h);
    ctx.fillStyle = rgba(WOOD_DK, 0.55);
    ctx.fillRect(b.x, b.y + vib + b.h * 0.62, b.w, b.h * 0.38);
    /* mallet above the bar, dipping on a strike, no hands on it */
    dip = 0;
    if (dt >= 0) dip = sc.h * 0.028 * Math.sin(Math.PI * Math.min(dt, 0.5) / 0.5);
    hx = b.cx - b.w * 0.18;
    hy = b.y - sc.h * 0.030 + dip;
    ctx.strokeStyle = rgba(WOOD_DK, 0.9);
    ctx.lineWidth = Math.max(1, sc.w * 0.002);
    ctx.beginPath();
    ctx.moveTo(hx + sc.w * 0.016, hy - sc.h * 0.030);
    ctx.lineTo(hx, hy);
    ctx.stroke();
    ctx.fillStyle = WOOD_DK;
    ctx.beginPath();
    ctx.arc(hx, hy, Math.max(2.5, sc.w * 0.006), 0, TAU);
    ctx.fill();
  }
}
function drawHelmholtz(sc, t) {
  var cx = sc.x + sc.w * 0.79, cy = sc.y + sc.h * 0.47;
  var R = Math.min(sc.w, sc.h) * 0.115;
  var ang = TAU * t / DISC_PERIOD;
  var i, hx, hy;
  /* nozzle: a small steel tube from the right, aimed at the disc rim */
  ctx.fillStyle = STEEL;
  ctx.fillRect(cx + R + sc.w * 0.008, cy - sc.h * 0.006, sc.w * 0.045, sc.h * 0.012);
  ctx.beginPath();
  ctx.moveTo(cx + R + sc.w * 0.010, cy - sc.h * 0.011);
  ctx.lineTo(cx + R + sc.w * 0.001, cy);
  ctx.lineTo(cx + R + sc.w * 0.010, cy + sc.h * 0.011);
  ctx.closePath();
  ctx.fill();
  /* faint air wedge from nozzle to disc */
  ctx.fillStyle = 'rgba(213,218,224,0.05)';
  ctx.beginPath();
  ctx.moveTo(cx + R + sc.w * 0.004, cy - sc.h * 0.006);
  ctx.lineTo(cx + R + sc.w * 0.004, cy + sc.h * 0.006);
  ctx.lineTo(cx + R, cy + sc.h * 0.020);
  ctx.lineTo(cx + R, cy - sc.h * 0.020);
  ctx.closePath();
  ctx.fill();
  /* perforated brass disc */
  ctx.fillStyle = BRASS;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(BRASS_HI, 0.8);
  ctx.lineWidth = Math.max(1, sc.w * 0.002);
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.92, 0, TAU);
  ctx.stroke();
  for (i = 0; i < 12; i++) {
    hx = cx + Math.cos(ang + i * TAU / 12) * R * 0.68;
    hy = cy + Math.sin(ang + i * TAU / 12) * R * 0.68;
    ctx.fillStyle = GROUND;
    ctx.beginPath();
    ctx.arc(hx, hy, R * 0.085, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = BRASS_HI;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.16, 0, TAU);
  ctx.fill();
  ctx.fillStyle = GROUND;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.05, 0, TAU);
  ctx.fill();
  /* axle stand */
  ctx.strokeStyle = rgba(STEEL, 0.55);
  ctx.lineWidth = Math.max(1.5, sc.w * 0.004);
  ctx.beginPath();
  ctx.moveTo(cx, cy + R);
  ctx.lineTo(cx, sc.y + sc.h * 0.80);
  ctx.stroke();
}
function drawFloor(sc) {
  var y = sc.y + sc.h * 0.80;
  ctx.strokeStyle = 'rgba(237,237,232,0.14)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sc.x + sc.w * 0.04, y);
  ctx.lineTo(sc.x + sc.w * 0.96, y);
  ctx.stroke();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Three Inventors').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Three Inventors').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 26').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Three Inventors', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 26', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, soundPlate.x + 12, soundPlate.y + 7);
}
/* ---- sound: closed-form model, real WebAudio only after a tap ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try { audioCtx = new AudioContext(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function startVoices(ac) {
  if (siren) return;
  try {
    var g = ac.createGain();
    g.gain.value = 0.006;
    g.connect(ac.destination);
    var o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.value = sirenFreq(phaseT);
    o.connect(g);
    o.start();
    siren = { osc: o, g: g };
  } catch (e) { siren = null; }
}
function stopVoices() {
  if (!siren) return;
  try { siren.osc.stop(); siren.g.disconnect(); } catch (e) {}
  siren = null;
}
function sirenFreq(t) {
  return 520 + 260 * Math.sin(TAU * t / 47);
}
function tone(ac, freqs, gains, dur) {
  var now = ac.currentTime, i, o, g;
  for (i = 0; i < freqs.length; i++) {
    try {
      o = ac.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(freqs[i], now);
      g = ac.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(gains[i], now + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g);
      g.connect(ac.destination);
      o.start(now);
      o.stop(now + dur + 0.05);
    } catch (e) {}
  }
}
function playStrike(bar) {
  var ac = ensureAudio();
  if (!ac || !soundOn) return;
  var f = BASE_F * JI[bar % 8];
  tone(ac, [f, f * 4.2], [0.10, 0.03], 0.5);
}
function playPluck(leaf) {
  var ac = ensureAudio();
  if (!ac || !soundOn) return;
  var f = LEAF_F[leaf % 7];
  tone(ac, [f, f * 2.76, f * 5.40], [0.05, 0.025, 0.012], 1.2);
}
function maybeSounds(t) {
  if (!soundOn || lastT === null) return;
  var cyc = Math.floor(t / HORIZON);
  var prevCyc = Math.floor(lastT / HORIZON);
  if (cyc !== prevCyc) return;
  var te = t - cyc * HORIZON;
  var prevTe = lastT - prevCyc * HORIZON;
  var i, s, p;
  for (i = 0; i < STRIKES.length; i++) {
    s = STRIKES[i];
    if (s.t0 > prevTe && s.t0 <= te) playStrike(s.bar);
  }
  for (i = 0; i < PLUCKS.length; i++) {
    p = PLUCKS[i];
    if (p.t0 > prevTe && p.t0 <= te) playPluck(p.leaf);
  }
  if (siren) {
    try { siren.osc.frequency.setValueAtTime(sirenFreq(t), audioCtx.currentTime); } catch (e) {}
  }
}
function draw() {
  size();
  var sc = sceneRect();
  var t = phaseT;
  var te = t - Math.floor(t / HORIZON) * HORIZON;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawBand(sc, t);
  drawFloor(sc);
  drawBertoia(sc, t, te);
  drawPartch(sc, t, te);
  drawHelmholtz(sc, t);
  drawPlates();
  maybeSounds(t);
  lastT = t;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    activeAt: function (t) {
      var te = t - Math.floor(t / HORIZON) * HORIZON;
      var n = 0, i;
      for (i = 0; i < STRIKES.length; i++) if (te >= STRIKES[i].t0 && te < STRIKES[i].t0 + 0.6) n++;
      for (i = 0; i < PLUCKS.length; i++) if (te >= PLUCKS[i].t0 && te < PLUCKS[i].t0 + 2.5) n++;
      return n;
    },
    strikeCount: STRIKES.length,
    pluckCount: PLUCKS.length
  };
}
/* ---- frame one: fixed phase t = 63.0 s, deep blue band, bar 3 mid-strike ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('click', function (ev) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    var x = ev.clientX - rect.left;
    var y = ev.clientY - rect.top;
    if (x >= soundPlate.x && x <= soundPlate.x + soundPlate.w && y >= soundPlate.y && y <= soundPlate.y + soundPlate.h) {
      soundOn = !soundOn;
      if (soundOn) {
        var ac = ensureAudio();
        if (ac) startVoices(ac);
      } else {
        stopVoices();
      }
      draw();
    }
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
