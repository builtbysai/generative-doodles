<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Is the Frame</title>
<style>
html, body { margin: 0; padding: 0; background: #0D0D12; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// No.1567 "Code Is the Frame" (TW8, PP814, completing #206 shunsuke-takawo)
// The piece shows its own making: a flat-segment torus beside a code pane
// that types the real seed/config source driving the torus, live.
// Palette: black #0D0D12 ground; teal #35B6AC, coral #E0654F, gold #E4B93C,
// cream #F2E8D5; code pane dim green-grey monospace #9AB0A5.
// Watch-only motion; tap advances to the next "day" (new seed, code retypes).
// Canvas 2D adaptation of the prompt's 3D torus: a parametric tube projected
// in 2D with flat-shaded segments and painter's algorithm (near last).
var TAU = Math.PI * 2;
var GROUND = '#0D0D12';
var PANE = '#101016';
var TEAL = '#35B6AC';
var CORAL = '#E0654F';
var GOLD = '#E4B93C';
var CREAM = '#F2E8D5';
var CODE = '#9AB0A5';
var CODE_DIM = '#5A6A60';
// --- The real seed/config source. These are the actual values driving the
// torus below, and the code pane types them back, line by line. The pane
// text is built from these variables, so it can never drift from the run.
var SEED = 814;
var RING = 0.68;
var TUBE = 0.32;
var SEG_U = 16;
var SEG_V = 8;
var TILT = 0.55;
var SPIN = 0.05;
var PALETTE = [TEAL, CORAL, GOLD, CREAM];
function rotY(t) {
  return 0.35 + t * SPIN;
}
// Day loop: 30 s per day. Typing takes 22 s, then an 8 s hold, then the
// next day (new seed, code retypes). Frame one is phase-shifted 9 s into
// the first day, so the pane is mid-typing and the torus mid-turn.
var DAY_LEN = 30;
var TYPE_LEN = 22;
var PHASE = 9;
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var taps = [];
var downX = 0, downY = 0, downT = 0;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen) {
    var m = Math.min(window.screen.width, window.screen.height);
    if (m < 700) return true;
  }
  return VH > VW * 1.15;
}
function isPortrait() {
  return VH > VW * 1.15;
}
// Day state at piece time t: closed form over t plus recorded taps.
function dayState(t) {
  var d = t + PHASE;
  var baseDay = Math.floor(d / DAY_LEN);
  var boundary = baseDay * DAY_LEN - PHASE;
  var tapCount = 0, lastTap = -Infinity;
  var i;
  for (i = 0; i < taps.length; i++) {
    if (taps[i] <= t) { tapCount++; if (taps[i] > lastTap) lastTap = taps[i]; }
  }
  var start = boundary;
  if (lastTap > start) start = lastTap;
  var phase = t - start;
  if (phase < 0) phase = 0;
  if (phase > DAY_LEN) phase = DAY_LEN;
  return { day: baseDay + tapCount, seed: SEED + baseDay + tapCount, phase: phase };
}
// The code pane text, built from the live config values above.
function codeLines(day) {
  return [
    '// day ' + day,
    'var SEED = ' + (SEED + day) + ';',
    'var RING = ' + RING + ';',
    'var TUBE = ' + TUBE + ';',
    'var SEG_U = ' + SEG_U + ';',
    'var SEG_V = ' + SEG_V + ';',
    'var TILT = ' + TILT + ';',
    'var SPIN = ' + SPIN + ';',
    "var PALETTE = ['#35B6AC',",
    "  '#E0654F', '#E4B93C',",
    "  '#F2E8D5'];",
    'function rotY(t) {',
    '  return 0.35 + t * SPIN;',
    '}',
    '// the torus turns,',
    '// the code types itself.'
  ];
}
function drawTorus(cx, cy, outer, t, seed) {
  var R = outer * RING;
  var tube = outer * TUBE;
  var th = rotY(t + PHASE);
  var tilt = TILT;
  var cosT = Math.cos(th), sinT = Math.sin(th);
  var cosP = Math.cos(tilt), sinP = Math.sin(tilt);
  // Projected grid points: (x, y, depth) per (iu, iv).
  var pts = [];
  var iu, iv;
  for (iu = 0; iu <= SEG_U; iu++) {
    pts[iu] = [];
    var u = iu * TAU / SEG_U;
    var cosU = Math.cos(u), sinU = Math.sin(u);
    for (iv = 0; iv <= SEG_V; iv++) {
      var v = iv * TAU / SEG_V;
      var cosV = Math.cos(v), sinV = Math.sin(v);
      var px = (R + tube * cosV) * cosU;
      var py = (R + tube * cosV) * sinU;
      var pz = tube * sinV;
      var x1 = px * cosT + pz * sinT;
      var z1 = -px * sinT + pz * cosT;
      var y2 = py * cosP - z1 * sinP;
      var z2 = py * sinP + z1 * cosP;
      pts[iu][iv] = { x: cx + x1, y: cy - y2, z: z2 };
    }
  }
  // Quads with painter's sort: far (small z) first, near last.
  var quads = [];
  for (iu = 0; iu < SEG_U; iu++) {
    for (iv = 0; iv < SEG_V; iv++) {
      var a = pts[iu][iv], b = pts[iu + 1][iv], c = pts[iu + 1][iv + 1], d = pts[iu][iv + 1];
      var z = (a.z + b.z + c.z + d.z) / 4;
      var ci = (Math.floor(iu / 2) + Math.floor(iv / 2) + seed) % 4;
      quads.push({ a: a, b: b, c: c, d: d, z: z, color: PALETTE[ci] });
    }
  }
  quads.sort(function (p, q) { return p.z - q.z; });
  ctx.lineWidth = Math.max(1, Math.round(outer * 0.008));
  ctx.strokeStyle = GROUND;
  var qi;
  for (qi = 0; qi < quads.length; qi++) {
    var q = quads[qi];
    ctx.beginPath();
    ctx.moveTo(q.a.x, q.a.y);
    ctx.lineTo(q.b.x, q.b.y);
    ctx.lineTo(q.c.x, q.c.y);
    ctx.lineTo(q.d.x, q.d.y);
    ctx.closePath();
    ctx.fillStyle = q.color;
    ctx.fill();
    ctx.stroke();
  }
}
function drawCodePane(x, y, w, h, t, ds) {
  ctx.fillStyle = PANE;
  ctx.fillRect(x, y, w, h);
  var lines = codeLines(ds.day);
  var total = 0, li;
  for (li = 0; li < lines.length; li++) total += lines[li].length + 1;
  var cps = total / TYPE_LEN;
  var typed = ds.phase < TYPE_LEN ? Math.floor(ds.phase * cps) : total;
  var pad = Math.round(Math.min(w, h) * 0.06) + 6;
  var maxLen = 0;
  for (li = 0; li < lines.length; li++) if (lines[li].length > maxLen) maxLen = lines[li].length;
  var fsW = (w - 2 * pad) / (maxLen * 0.6);
  var fsH = (h - 2 * pad) / (lines.length * 1.5);
  var fs = Math.max(8, Math.floor(Math.min(fsW, fsH)));
  var lh = Math.round(fs * 1.5);
  ctx.font = fs + 'px monospace';
  ctx.textBaseline = 'top';
  var remaining = typed;
  var cy = y + pad;
  var caret = null;
  for (li = 0; li < lines.length; li++) {
    var line = lines[li];
    var show = Math.min(line.length, remaining);
    var num = (li + 1 < 10 ? '0' : '') + (li + 1);
    ctx.fillStyle = CODE_DIM;
    ctx.fillText(num, x + pad * 0.5, cy);
    if (show > 0) {
      ctx.fillStyle = CODE;
      ctx.fillText(line.slice(0, show), x + pad + fs * 1.8, cy);
    }
    if (show < line.length && remaining >= 0 && caret === null) {
      caret = { x: x + pad + fs * 1.8 + ctx.measureText(line.slice(0, show)).width, y: cy };
    }
    remaining -= line.length + 1;
    cy += lh;
    if (remaining < 0 && caret !== null) break;
  }
  if (caret === null && ds.phase < TYPE_LEN) {
    caret = { x: x + pad + fs * 1.8, y: y + pad + lines.length * lh };
  }
  // Blinking caret while typing; steady during the hold.
  if (caret !== null && ds.phase < TYPE_LEN) {
    if (Math.floor((t + PHASE) * 2) % 2 === 0) {
      ctx.fillStyle = CODE;
      ctx.fillRect(caret.x, caret.y + 1, Math.max(2, Math.round(fs * 0.14)), fs);
    }
  }
}
function draw(t) {
  lastT = t;
  size();
  var portrait = isPortrait();
  var phone = isPhone();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var ds = dayState(t);
  var tx, ty, tw, th, px, py, pw, ph;
  if (portrait) {
    // Stacked: torus on top (55%), code pane below (45%).
    tw = VW; th = Math.round(VH * 0.55);
    tx = 0; ty = 0;
    px = 0; py = th; pw = VW; ph = VH - th;
  } else {
    // Split frame: left 60% the 3D form, right 40% the code pane.
    var split = Math.round(VW * 0.6);
    tx = 0; ty = 0; tw = split; th = VH;
    px = split; py = 0; pw = VW - split; ph = VH;
  }
  var outer = Math.min(tw, th) * 0.42;
  drawTorus(tx + tw / 2, ty + th / 2, outer, t, ds.seed);
  drawCodePane(px, py, pw, ph, t, ds);
  // Divider line between the two halves, drawn after the pane so its fill
  // cannot cover it.
  ctx.fillStyle = CREAM;
  if (portrait) ctx.fillRect(0, py, VW, 1);
  else ctx.fillRect(px, 0, 1, VH);
  // Caption: title, formula date, tap cue. Cream on black.
  var minDim = Math.min(VW, VH);
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'Code Is the Frame  ·  2006 · 04 · 27  ·  Tap for a new day.';
  ctx.font = fs + 'px sans-serif';
  var twd = ctx.measureText(label).width;
  var pad = Math.round(fs * 0.7);
  var bx = Math.round(fs * 0.8), by;
  if (portrait) by = Math.round(th - fs * 0.8 - (fs + 2 * pad));
  else by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  // Keep the caption inside the torus region; shrink it if it would cross
  // the divider on narrow frames.
  var avail = portrait ? tw - 2 * fs : tx + tw - 2 * fs;
  if (twd + 2 * pad > avail) {
    fs = Math.max(8, Math.floor(fs * avail / (twd + 2 * pad)));
    ctx.font = fs + 'px sans-serif';
    twd = ctx.measureText(label).width;
    pad = Math.round(fs * 0.7);
    if (portrait) by = Math.round(th - fs * 0.8 - (fs + 2 * pad));
    else by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  }
  ctx.fillStyle = GROUND;
  ctx.fillRect(bx - pad, by, Math.ceil(twd) + 2 * pad, fs + 2 * pad);
  ctx.fillStyle = CREAM;
  ctx.textBaseline = 'top';
  ctx.fillText(label, bx, by + pad);
  if (typeof window !== 'undefined') {
    window.__p1567 = {
      t: t, day: ds.day, seed: ds.seed, phase: ds.phase,
      portrait: portrait, phone: phone, split: portrait ? null : Math.round(VW * 0.6),
      outer: outer, taps: taps.length
    };
  }
}
function onDown(e) {
  downX = e.clientX || 0; downY = e.clientY || 0; downT = lastT;
}
function onUp(e) {
  var x = e.clientX || 0, y = e.clientY || 0;
  var dx = x - downX, dy = y - downY;
  if (dx * dx + dy * dy < 144) taps.push(lastT);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointerup', onUp);
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
