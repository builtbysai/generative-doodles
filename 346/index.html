<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.346 Harlequin Haunt</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1A0E06; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.346 Harlequin Haunt (emibeebuzz).
// After Emi Bee's harlequin diamond Halloween grid: a full-bleed
// lattice of exactly 54 diamonds (9 columns x 6 rows, asserted),
// each diamond holding exactly ONE motif from a closed set of
// five: a cream ghost with an ember bow, a black cat with yellow
// eyes, an 8-pointed yellow star with an ember centre, a dark
// swirl, a small cream bat. No sixth motif exists. Assignment is
// a fixed seeded table written out as data below, never runtime
// random, so every cell's motif is reproducible. A slow wave
// pulse ripples across the grid: per-cell scale follows the
// prompt formula 1 + 0.06 * sin(dist(cell, wavefront) - t), the
// wavefront a point sweeping the diagonal on a 12s seamless loop
// (frame 12s is pixel-identical to frame 0 at rest). Dragging
// pushes the wave: it adds an impulse to the wavefront phase that
// decays fully back to zero, so leftover drag energy never
// breaks the loop seam. Flat colour only, no text, no chrome.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#1A0E06';
var DIA_A = '#2A1408', DIA_B = '#331B0A';
var CREAM = '#F5E6C8', EMBER = '#E4572E', YELLOW = '#F2B134', CAT = '#0B0805';
var DW = 1280, DH = 900;
var COLS = 9, ROWS = 6, LOOP = 12;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 4.2, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var push = 0;

// ---- the closed five-motif set -------------------------------
// 0 ghost, 1 cat, 2 star, 3 swirl, 4 bat. Nothing else can be
// drawn in a cell.
var MOTIFS = ['ghost', 'cat', 'star', 'swirl', 'bat'];
if (MOTIFS.length !== 5) throw new Error('Harlequin Haunt needs exactly 5 motifs');

// ---- fixed seeded assignment table (54 entries, as data) -----
var TABLE = [
  0, 2, 1, 4, 3, 2, 0, 1, 4,
  3, 1, 4, 0, 2, 1, 3, 4, 0,
  2, 4, 0, 3, 1, 4, 2, 0, 3,
  1, 0, 3, 2, 4, 0, 1, 3, 2,
  4, 3, 2, 1, 0, 3, 4, 2, 1,
  0, 1, 4, 3, 2, 4, 0, 1, 3
];
(function () {
  var i, seen = [0, 0, 0, 0, 0];
  if (TABLE.length !== COLS * ROWS) throw new Error('table must hold exactly 54 cells');
  for (i = 0; i < TABLE.length; i++) {
    if (TABLE[i] < 0 || TABLE[i] > 4) throw new Error('table entry outside the motif set');
    seen[TABLE[i]]++;
  }
  for (i = 0; i < 5; i++) if (seen[i] === 0) throw new Error('every motif must appear');
})();

// ---- the five motif painters ---------------------------------
// Each draws centred on the origin inside radius R, flat fills
// and strokes only, no gradients, no shadow.

function drawGhost(R) {
  ctx.fillStyle = CREAM;
  ctx.beginPath();
  ctx.moveTo(-0.62 * R, 0.78 * R);
  ctx.lineTo(-0.62 * R, -0.22 * R);
  ctx.arc(0, -0.22 * R, 0.62 * R, Math.PI, 0);
  ctx.lineTo(0.62 * R, 0.78 * R);
  ctx.quadraticCurveTo(0.42 * R, 0.58 * R, 0.21 * R, 0.78 * R);
  ctx.quadraticCurveTo(0, 0.58 * R, -0.21 * R, 0.78 * R);
  ctx.quadraticCurveTo(-0.42 * R, 0.58 * R, -0.62 * R, 0.78 * R);
  ctx.closePath();
  ctx.fill();
  // ember bow at the top right of the head
  ctx.fillStyle = EMBER;
  ctx.beginPath();
  ctx.moveTo(0.38 * R, -0.74 * R);
  ctx.lineTo(0.10 * R, -0.92 * R);
  ctx.lineTo(0.12 * R, -0.52 * R);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0.44 * R, -0.72 * R);
  ctx.lineTo(0.74 * R, -0.88 * R);
  ctx.lineTo(0.70 * R, -0.48 * R);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0.41 * R, -0.71 * R, 0.10 * R, 0, Math.PI * 2);
  ctx.fill();
  // eyes and mouth in cat black
  ctx.fillStyle = CAT;
  ctx.beginPath();
  ctx.ellipse(-0.23 * R, -0.26 * R, 0.085 * R, 0.13 * R, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0.23 * R, -0.26 * R, 0.085 * R, 0.13 * R, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, 0.04 * R, 0.09 * R, 0.12 * R, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawCat(R) {
  ctx.fillStyle = CAT;
  // ears
  ctx.beginPath();
  ctx.moveTo(-0.54 * R, -0.18 * R);
  ctx.lineTo(-0.50 * R, -0.88 * R);
  ctx.lineTo(-0.08 * R, -0.44 * R);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0.54 * R, -0.18 * R);
  ctx.lineTo(0.50 * R, -0.88 * R);
  ctx.lineTo(0.08 * R, -0.44 * R);
  ctx.closePath();
  ctx.fill();
  // head
  ctx.beginPath();
  ctx.arc(0, 0.10 * R, 0.60 * R, 0, Math.PI * 2);
  ctx.fill();
  // glowing yellow almond eyes
  ctx.fillStyle = YELLOW;
  ctx.beginPath();
  ctx.ellipse(-0.24 * R, 0.02 * R, 0.10 * R, 0.17 * R, 0.25, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0.24 * R, 0.02 * R, 0.10 * R, 0.17 * R, -0.25, 0, Math.PI * 2);
  ctx.fill();
}

function drawStar(R) {
  var i, ang, rad;
  ctx.fillStyle = YELLOW;
  ctx.beginPath();
  for (i = 0; i < 16; i++) {
    ang = -Math.PI / 2 + i * Math.PI / 8;
    rad = (i % 2 === 0) ? R : 0.44 * R;
    if (i === 0) ctx.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
    else ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = EMBER;
  ctx.beginPath();
  ctx.arc(0, 0, 0.21 * R, 0, Math.PI * 2);
  ctx.fill();
}

function drawSwirl(R) {
  var a, r, turns = 2.75, steps = 90, maxA = turns * Math.PI * 2;
  ctx.strokeStyle = CAT;
  ctx.lineWidth = 0.14 * R;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (a = 0; a <= steps; a++) {
    var t = a / steps;
    r = 0.74 * R * t;
    var x = Math.cos(t * maxA) * r, y = Math.sin(t * maxA) * r;
    if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawBat(R) {
  ctx.fillStyle = CREAM;
  // left wing with two scallops
  ctx.beginPath();
  ctx.moveTo(-0.06 * R, -0.10 * R);
  ctx.quadraticCurveTo(-0.55 * R, -0.52 * R, -0.98 * R, -0.34 * R);
  ctx.quadraticCurveTo(-0.80 * R, -0.02 * R, -0.62 * R, -0.06 * R);
  ctx.quadraticCurveTo(-0.48 * R, 0.20 * R, -0.34 * R, 0.10 * R);
  ctx.quadraticCurveTo(-0.20 * R, 0.34 * R, -0.06 * R, 0.26 * R);
  ctx.closePath();
  ctx.fill();
  // right wing, mirrored
  ctx.beginPath();
  ctx.moveTo(0.06 * R, -0.10 * R);
  ctx.quadraticCurveTo(0.55 * R, -0.52 * R, 0.98 * R, -0.34 * R);
  ctx.quadraticCurveTo(0.80 * R, -0.02 * R, 0.62 * R, -0.06 * R);
  ctx.quadraticCurveTo(0.48 * R, 0.20 * R, 0.34 * R, 0.10 * R);
  ctx.quadraticCurveTo(0.20 * R, 0.34 * R, 0.06 * R, 0.26 * R);
  ctx.closePath();
  ctx.fill();
  // ears
  ctx.beginPath();
  ctx.moveTo(-0.16 * R, -0.30 * R);
  ctx.lineTo(-0.12 * R, -0.52 * R);
  ctx.lineTo(-0.02 * R, -0.34 * R);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0.16 * R, -0.30 * R);
  ctx.lineTo(0.12 * R, -0.52 * R);
  ctx.lineTo(0.02 * R, -0.34 * R);
  ctx.closePath();
  ctx.fill();
  // body
  ctx.beginPath();
  ctx.ellipse(0, 0.02 * R, 0.19 * R, 0.32 * R, 0, 0, Math.PI * 2);
  ctx.fill();
  // eyes
  ctx.fillStyle = CAT;
  ctx.beginPath();
  ctx.arc(-0.07 * R, -0.08 * R, 0.045 * R, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0.07 * R, -0.08 * R, 0.045 * R, 0, Math.PI * 2);
  ctx.fill();
}

var PAINTERS = [drawGhost, drawCat, drawStar, drawSwirl, drawBat];

// ---- drawing --------------------------------------------------
function draw() {
  var cw = DW / COLS, ch = DH / ROWS;
  var hx = cw * 0.48, hy = ch * 0.48, R = 46;
  var cyc = ((T % LOOP) + LOOP) % LOOP;
  var ph = cyc / LOOP, th = ph * Math.PI * 2;
  // wavefront sweeps the diagonal, off-frame at both ends
  var wfx = -260 + ph * (DW + 520);
  var wfy = -180 + ph * (DH + 360);
  var col, row, i, cx, cy, d, sc;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  for (row = 0; row < ROWS; row++) {
    for (col = 0; col < COLS; col++) {
      i = row * COLS + col;
      cx = (col + 0.5) * cw;
      cy = (row + 0.5) * ch;
      d = Math.sqrt((cx - wfx) * (cx - wfx) + (cy - wfy) * (cy - wfy));
      sc = 1 + 0.06 * Math.sin(d * 0.02 - th * 2 + push);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(sc, sc);
      ctx.fillStyle = ((col + row) % 2 === 0) ? DIA_A : DIA_B;
      ctx.beginPath();
      ctx.moveTo(0, -hy);
      ctx.lineTo(hx, 0);
      ctx.lineTo(0, hy);
      ctx.lineTo(-hx, 0);
      ctx.closePath();
      ctx.fill();
      PAINTERS[TABLE[i]](R);
      ctx.restore();
    }
  }
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag pushes the wave -------------------------------------
var dragging = false, lastDX = 0, lastDY = 0;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true; lastDX = p.x; lastDY = p.y;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var delta = (p.x - lastDX) + (p.y - lastDY);
  lastDX = p.x; lastDY = p.y;
  push += delta * 0.004;
  if (push > 3) push = 3;
  if (push < -3) push = -3;
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK;
    push *= 0.972;
    if (Math.abs(push) < 0.002) push = 0;
    acc -= TICK; guard++;
  }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
