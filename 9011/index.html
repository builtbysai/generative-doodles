<script>
"use strict";
/* ============================================================
   №9011 CONGREGATION
   A living voronoi web of typed agents, after Raven Kwok's
   Skyline #1 SYSTEM (typed seeds inside one voronoi primitive).
   Drifters seek dark regions of a driver field. Orbiters circle
   the darkest mass. A synthesized slow-techno sequencer drives
   them: the kick is an EVENT (converge, flash, disperse), never
   a brightness pulse. Click calls a congregation; drag stirs.
   ============================================================ */

// ---------- utils ----------
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash01(n){
  let h = Math.imul(n | 0, 0x9E3779B1) ^ 0x85EBCA6B;
  h = Math.imul(h ^ h >>> 13, 0xC2B2AE35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ---------- url params ----------
const params = new URLSearchParams(location.search);
let pieceSeed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(pieceSeed)) pieceSeed = 90110;
const frozenT = parseFloat(params.get("t") || "");
const freeze = Number.isFinite(frozenT);
const perfMode = params.get("perf") === "1";
const bare = params.get("bare") === "1";
if (bare) document.body.classList.add("bare");
const reducedMotion = window.matchMedia &&
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- music model (shared by audio + visuals; pure functions of songT) ----------
const BPM = 104;
const SPB = 60 / BPM / 4;      // seconds per 16th
const BAR = 16 * SPB;
const CYCLE = 2 * BAR;         // 32-step pattern loop
const STAGE = 16 * BAR;        // field morph + progression period
const SWING = 0.14;
const PROG = [55, 43.654, 65.406, 49]; // A1 F1 C2 G1, 8-bar progression
const PENTA = [220, 261.626, 293.665, 329.628, 392.0, 440.0];

const patCache = new Map();
function cyclePattern(c){
  let p = patCache.get(c);
  if (p) return p;
  const h = (n) => hash01((pieceSeed | 0) + Math.imul(c | 0, 97) + Math.imul(n | 0, 131071));
  const kick = new Uint8Array(32), big = new Uint8Array(32);
  const qs = [0, 4, 8, 12, 16, 20, 24, 28];
  for (const q of qs){ if (q === 12 && h(1) < 0.18) continue; kick[q] = 1; }
  if (h(2) < 0.35) kick[30] = 1;
  if ((c & 1) === 0) big[0] = 1; // staged congregation every 4th bar
  const snare = new Uint8Array(32);
  for (const s of [4, 12, 20, 28]) snare[s] = 1;
  const hat = new Uint8Array(32), hatO = new Uint8Array(32);
  for (let s = 0; s < 32; s++){
    if (s % 4 === 2){ hat[s] = 1; if (h(100 + s) < 0.25) hatO[s] = 1; }
    else if (s % 2 === 1 && h(100 + s) < 0.30){ hat[s] = 1; }
  }
  const bassF = new Float32Array(32);
  const root = PROG[Math.floor(c / 4) % 4];
  const ivs = [0, 0, 0, 7, 12];
  for (const s of [0, 3, 6, 11, 14, 19, 22, 27]){
    if (h(200 + s) < 0.82) bassF[s] = root * Math.pow(2, ivs[Math.floor(h(300 + s) * 5)] / 12);
  }
  const leadF = new Float32Array(32);
  if (h(400) < 0.45){
    let deg = Math.floor(h(401) * 6);
    const steps = [2, 6, 10, 14, 18, 22, 26, 30];
    for (let k = 0; k < 3; k++){
      const s = steps[Math.floor(h(402 + k) * 8)];
      deg = (deg + [-2, -1, 1, 2][Math.floor(h(406 + k) * 4)] + 6) % 6;
      leadF[s] = PENTA[deg];
    }
  }
  p = { kick, big, snare, hat, hatO, bassF, leadF };
  if (patCache.size > 24) patCache.clear();
  patCache.set(c, p);
  return p;
}
function stepTime(c, s){ return c * CYCLE + s * SPB + ((s & 1) ? SWING * SPB : 0); }

// manual congregations (clicks); not present in freeze/perf modes
const manualKicks = [];

// analytic band envelopes at songT (the "synthetic audio spectrum")
function bandEnvelopes(t){
  let kick = 0, big = 0, bass = 0, hat = 0;
  const c1 = Math.floor(t / CYCLE), c0 = Math.floor((t - 1.6) / CYCLE);
  for (let c = c0; c <= c1; c++){
    const p = cyclePattern(c);
    for (let s = 0; s < 32; s++){
      const kt = stepTime(c, s), dt = t - kt;
      if (dt < 0 || dt > 1.6) continue;
      if (p.kick[s]) kick += Math.exp(-dt * 5.5);
      if (p.big[s]) big += Math.exp(-dt * 2.0);
      if (p.bassF[s]) bass += 0.9 * Math.exp(-dt * 6.0);
      if (p.hat[s]) hat += 0.7 * Math.exp(-dt * 9.0);
    }
  }
  let manual = 0;
  for (let i = manualKicks.length - 1; i >= 0; i--){
    const dt = t - manualKicks[i].t;
    if (dt < 0) continue;
    if (dt > 2.0){ manualKicks.splice(0, i + 1); break; }
    manual += Math.exp(-dt * 2.2);
  }
  return { kick, big, bass, hat, manual };
}

// ---------- driver field: 4 dark masses drifting on slow lissajous paths ----------
const stageParamCache = new Map();
function stageParams(s){
  let p = stageParamCache.get(s);
  if (p) return p;
  const rnd = mulberry32(((pieceSeed | 0) ^ Math.imul(s | 0, 0x9E3779B9)) | 0);
  p = [];
  // one dark mass per quadrant so the field never collapses to a single blob
  const quads = [[0, 0], [1, 0], [0, 1], [1, 1]];
  // shuffle quadrants
  for (let i = quads.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    const tmp = quads[i]; quads[i] = quads[j]; quads[j] = tmp;
  }
  for (let i = 0; i < 4; i++){
    const qx = quads[i][0], qy = quads[i][1];
    p.push({
      bx: 110 + qx * 280 + rnd() * 220, by: 110 + qy * 280 + rnd() * 220,
      ax: 40 + rnd() * 100, ay: 40 + rnd() * 100,
      w1: 2 * Math.PI / (40 + rnd() * 50), w2: 2 * Math.PI / (40 + rnd() * 50),
      p1: rnd() * 2 * Math.PI, p2: rnd() * 2 * Math.PI,
      r: 95 + rnd() * 105, a: 0.8 + rnd() * 0.2
    });
  }
  if (stageParamCache.size > 8) stageParamCache.clear();
  stageParamCache.set(s, p);
  return p;
}
function smooth01(x){ x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); }
// pure blob state at time t (morphs across a 2-bar window every STAGE)
function blobStateAt(t){
  const st = Math.floor(t / STAGE), lt = t - st * STAGE;
  const m = smooth01(lt / (2 * BAR));
  const P0 = stageParams(st), P1 = stageParams(st + 1);
  const out = [];
  for (let i = 0; i < 4; i++){
    const b0 = P0[i], b1 = P1[i];
    const x0 = b0.bx + b0.ax * Math.sin(b0.w1 * t + b0.p1);
    const y0 = b0.by + b0.ay * Math.sin(b0.w2 * t + b0.p2);
    const x1 = b1.bx + b1.ax * Math.sin(b1.w1 * t + b1.p1);
    const y1 = b1.by + b1.ay * Math.sin(b1.w2 * t + b1.p2);
    const r = b0.r + (b1.r - b0.r) * m, a = b0.a + (b1.a - b0.a) * m;
    out.push({ x: x0 + (x1 - x0) * m, y: y0 + (y1 - y0) * m, r, a, ir2: 1 / (2 * r * r) });
  }
  return out;
}
let blobs = [];
function fieldAt(x, y){
  let d = 0;
  for (let i = 0; i < 4; i++){
    const b = blobs[i], dx = x - b.x, dy = y - b.y;
    d += b.a * Math.exp(-(dx * dx + dy * dy) * b.ir2);
  }
  return d > 1 ? 1 : d;
}

// ---------- agents ----------
const W = 720, H = 720, N = 340;
const seeds = [];
let rndStream = null;

function buildAgents(){
  rndStream = mulberry32(pieceSeed);
  const rnd = rndStream;
  seeds.length = 0;
  blobs = blobStateAt(0);
  let guard = 0;
  while (seeds.length < N && guard++ < N * 60){
    const x = 4 + rnd() * (W - 8), y = 4 + rnd() * (H - 8);
    const d = fieldAt(x, y);
    if (rnd() < Math.pow(d, 0.6) * 0.9 + 0.03){
      const orb = rnd() < 0.24;
      // home blob: nearest dark mass at birth (drifters keep a home, orbiters re-pick)
      let bd = 1e18, bi = 0;
      for (let b = 0; b < 4; b++){
        const dx = x - blobs[b].x, dy = y - blobs[b].y, d2 = dx * dx + dy * dy;
        if (d2 < bd){ bd = d2; bi = b; }
      }
      seeds.push({
        x, y, vx: 0, vy: 0, dark: d, orb,
        th: rnd() * Math.PI * 2,                    // orbiter angle
        rb: 20 + rnd() * 140,                       // orbiter base radius
        dir: rnd() < 0.5 ? -1 : 1,
        ph: rnd() * Math.PI * 2,
        bi,                                         // home blob
        hx: (rnd() - 0.5) * 300, hy: (rnd() - 0.5) * 300, // personal anchor near home
        tjx: (rnd() - 0.5) * 320, tjy: (rnd() - 0.5) * 320, // congregation target offset
        aff: 0.7 + rnd() * 0.6                       // kick affinity
      });
    }
  }
  // warm-up: settle orbiters onto their paths (part of the deterministic sequence)
  for (let k = 0; k < 24; k++) stepAgents(1 / 60, k / 60);
}

function currentOrigin(t){
  const cyc = Math.floor(t / CYCLE);
  const bc = cyc - (cyc & 1); // last even cycle: staged big kick
  const bt = bc * CYCLE;
  const m = manualKicks.length ? manualKicks[manualKicks.length - 1] : null;
  if (m && m.t <= t && m.t > bt) return { x: m.x, y: m.y };
  const bs = blobStateAt(bt);
  let di = 0;
  for (let i = 1; i < 4; i++) if (bs[i].a > bs[di].a) di = i;
  return { x: bs[di].x, y: bs[di].y };
}

let frameNo = 0;
function stepAgents(dt, t){
  const env = bandEnvelopes(t);
  const kickE = env.kick, bigE = Math.min(1.5, env.big + env.manual);
  const low = Math.min(1.3, kickE + 0.25);
  const bassB = Math.min(1.2, env.bass + 0.3);
  const origin = currentOrigin(t);
  blobs = blobStateAt(t);

  // orbiters re-pick their blob once a second; drifters occasionally wander to a new home
  const reassign = (frameNo % 60 === 0);
  const rehome = (frameNo % 1200 === 0);
  for (let i = 0; i < seeds.length; i++){
    const s = seeds[i];
    if (s.orb){
      if (reassign){
        let bd = 1e18, bi = 0;
        for (let b = 0; b < 4; b++){
          const dx = s.x - blobs[b].x, dy = s.y - blobs[b].y, d2 = dx * dx + dy * dy;
          if (d2 < bd){ bd = d2; bi = b; }
        }
        s.bi = bi;
      }
    } else if (rehome && rndStream() < 0.3){
      s.bi = (rndStream() * 4) | 0;
    }
    // CONGREGATION: bounded-speed streaming toward the beat origin.
    // The kick is an event in behavior, not a pulse: seeds gather, flash, disperse.
    const gather = Math.min(1, kickE * 0.9 + bigE * 1.2);
    if (gather > 0.01){
      const gspd = (140 + 260 * Math.min(1, bigE)) * s.aff;
      const dxo = (origin.x + s.tjx) - s.x, dyo = (origin.y + s.tjy) - s.y;
      const d = Math.hypot(dxo, dyo);
      if (d > 1){
        const sp = Math.min(d * 4, gspd) * gather;
        s.vx += (dxo / d) * sp * dt * 4;
        s.vy += (dyo / d) * sp * dt * 4;
      }
    }

    if (!s.orb){
      // DRIFTER: gradient ascent toward dark + jitter, speed scaled by the kick band,
      // tethered loosely to its home blob so the field keeps four lobes
      const e = 6;
      const gx = (fieldAt(s.x + e, s.y) - fieldAt(s.x - e, s.y)) / (2 * e);
      const gy = (fieldAt(s.x, s.y + e) - fieldAt(s.x, s.y - e)) / (2 * e);
      const asp = 0.55 + 1.7 * low;
      const jx = (rndStream() - 0.5) * (80 + 190 * low);
      const jy = (rndStream() - 0.5) * (80 + 190 * low);
      const hb = blobs[s.bi];
      s.vx += (hb.x + s.hx - s.x) * 0.9 * dt;
      s.vy += (hb.y + s.hy - s.y) * 0.9 * dt;
      s.x += (gx * 380 * asp + jx + s.vx) * dt;
      s.y += (gy * 380 * asp + jy + s.vy) * dt;
    } else {
      // ORBITER: circles its dark mass; radius breathes with the bass band
      const b = blobs[s.bi];
      s.th += s.dir * (0.35 + 1.1 * Math.min(1.2, env.bass + env.hat * 0.5)) * (140 / (s.rb + 60)) * dt;
      const r = s.rb * (0.72 + 0.38 * bassB + 0.10 * Math.sin(t * 0.7 + s.ph)) * (1 - 0.28 * Math.min(1, bigE));
      const tx = b.x + Math.cos(s.th) * r, ty = b.y + Math.sin(s.th) * r * 0.82;
      const k = Math.min(1, 7 * dt);
      s.x += (tx - s.x) * k + s.vx * dt;
      s.y += (ty - s.y) * k + s.vy * dt;
    }
    const damp = Math.exp(-2.8 * dt);
    s.vx *= damp; s.vy *= damp;
    if (s.x < 2) s.x = 2; else if (s.x > W - 2) s.x = W - 2;
    if (s.y < 2) s.y = 2; else if (s.y > H - 2) s.y = H - 2;
    s.dark = fieldAt(s.x, s.y);
  }
  frameNo++;
  return env;
}

// ---------- voronoi: half-plane clipping vs K nearest (grid), flat buffers ----------
// Chosen over Bowyer-Watson after timing both: ~3x faster here, no supertriangle
// failure mode, visually identical (see process.md).
const VK = 16, VCS = 90;
const VGX = Math.ceil(W / VCS) + 2, VGY = Math.ceil(H / VCS) + 2;
const vflat = new Float64Array(N * 2);
const vbuckets = new Array(VGX * VGY);
const vcIdx = new Int32Array(240), vcD = new Float64Array(240);
const vuseI = new Int32Array(VK), vuseD = new Float64Array(VK);
const vpoly = new Float64Array(256), vtmp = new Float64Array(256);
const vcells = new Array(N), vclen = new Int32Array(N);
for (let i = 0; i < N; i++) vcells[i] = new Float64Array(72);

function voronoi(){
  for (let i = 0; i < vbuckets.length; i++) vbuckets[i] = null;
  for (let i = 0; i < N; i++){
    const s = seeds[i];
    vflat[i * 2] = s.x; vflat[i * 2 + 1] = s.y;
    let bx = ((s.x / VCS) | 0) + 1, by = ((s.y / VCS) | 0) + 1;
    if (bx < 0) bx = 0; else if (bx >= VGX) bx = VGX - 1;
    if (by < 0) by = 0; else if (by >= VGY) by = VGY - 1;
    const k = by * VGX + bx;
    let b = vbuckets[k];
    if (!b){ b = []; vbuckets[k] = b; }
    b.push(i);
  }
  for (let i = 0; i < N; i++){
    const px = vflat[i * 2], py = vflat[i * 2 + 1];
    const cbx = ((px / VCS) | 0) + 1, cby = ((py / VCS) | 0) + 1;
    let nc = 0;
    for (let ring = 0; ring <= 2; ring++){
      for (let dy = -ring; dy <= ring; dy++) for (let dx = -ring; dx <= ring; dx++){
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;
        const bx = cbx + dx, by = cby + dy;
        if (bx < 0 || by < 0 || bx >= VGX || by >= VGY) continue;
        const b = vbuckets[by * VGX + bx];
        if (!b) continue;
        for (let q = 0; q < b.length; q++){
          const j = b[q];
          if (j === i || nc >= 240) continue;
          const ddx = vflat[j * 2] - px, ddy = vflat[j * 2 + 1] - py;
          const d2 = ddx * ddx + ddy * ddy;
          if (d2 < 1e-9) continue;
          vcIdx[nc] = j; vcD[nc] = d2; nc++;
        }
      }
    }
    let nu = 0;
    for (let q = 0; q < nc; q++){
      const d2 = vcD[q];
      if (nu < VK){
        let k = nu;
        while (k > 0 && vuseD[k - 1] > d2){ vuseI[k] = vuseI[k - 1]; vuseD[k] = vuseD[k - 1]; k--; }
        vuseI[k] = vcIdx[q]; vuseD[k] = d2; nu++;
      } else if (d2 < vuseD[VK - 1]){
        let k = VK - 1;
        while (k > 0 && vuseD[k - 1] > d2){ vuseI[k] = vuseI[k - 1]; vuseD[k] = vuseD[k - 1]; k--; }
        vuseI[k] = vcIdx[q]; vuseD[k] = d2;
      }
    }
    let pn = 4;
    vpoly[0] = 0; vpoly[1] = 0; vpoly[2] = W; vpoly[3] = 0;
    vpoly[4] = W; vpoly[5] = H; vpoly[6] = 0; vpoly[7] = H;
    for (let k = 0; k < nu; k++){
      const j = vuseI[k], jx = vflat[j * 2], jy = vflat[j * 2 + 1];
      const dx = jx - px, dy = jy - py, mx = (px + jx) * 0.5, my = (py + jy) * 0.5;
      let tn = 0;
      let qx = vpoly[(pn - 1) * 2], qy = vpoly[(pn - 1) * 2 + 1];
      let pi = (qx - mx) * dx + (qy - my) * dy <= 0;
      for (let e = 0; e < pn; e++){
        const cx = vpoly[e * 2], cy = vpoly[e * 2 + 1];
        const ci = (cx - mx) * dx + (cy - my) * dy <= 0;
        if (ci !== pi){
          const ex = cx - qx, ey = cy - qy, den = ex * dx + ey * dy;
          if (Math.abs(den) > 1e-12){
            const tt = ((mx - qx) * dx + (my - qy) * dy) / den;
            vtmp[tn * 2] = qx + ex * tt; vtmp[tn * 2 + 1] = qy + ey * tt; tn++;
          }
        }
        if (ci){ vtmp[tn * 2] = cx; vtmp[tn * 2 + 1] = cy; tn++; }
        qx = cx; qy = cy; pi = ci;
      }
      for (let q = 0; q < tn * 2; q++) vpoly[q] = vtmp[q];
      pn = tn;
      if (!pn) break;
    }
    const cp = vcells[i];
    for (let q = 0; q < pn * 2; q++) cp[q] = vpoly[q];
    vclen[i] = pn;
  }
}

// ---------- render ----------
const cvs = document.getElementById("c");
cvs.width = W; cvs.height = H;
const g = cvs.getContext("2d");

const vig = document.createElement("canvas");
vig.width = W; vig.height = H;
{
  const vg = vig.getContext("2d");
  const grd = vg.createRadialGradient(W/2, H/2, W*0.28, W/2, H/2, W*0.72);
  grd.addColorStop(0, "rgba(0,0,0,0)");
  grd.addColorStop(1, "rgba(0,0,0,0.42)");
  vg.fillStyle = grd;
  vg.fillRect(0, 0, W, H);
}

function draw(env, t){
  g.fillStyle = "#020203";
  g.fillRect(0, 0, W, H);
  const kickE = env.kick, bigE = Math.min(1.5, env.big + env.manual);
  const origin = currentOrigin(t);
  const ox = origin.x, oy = origin.y;
  const inv2s2 = 1 / (2 * 260 * 260);

  for (let i = 0; i < N; i++){
    const s = seeds[i], n = vclen[i];
    if (n < 3) continue;
    const cp = vcells[i];
    const dx = s.x - ox, dy = s.y - oy;
    const flash = (kickE * 0.6 + bigE * 1.1) * Math.exp(-(dx * dx + dy * dy) * inv2s2);
    const d = s.dark;
    g.beginPath();
    g.moveTo(cp[0], cp[1]);
    for (let k = 1; k < n; k++) g.lineTo(cp[k * 2], cp[k * 2 + 1]);
    g.closePath();
    g.fillStyle = "rgba(255,255,255," + (0.012 + 0.05 * d).toFixed(3) + ")";
    g.fill();
    if (s.orb){
      g.strokeStyle = "rgba(70,255,150," + (0.20 + 0.45 * Math.min(1, flash)).toFixed(3) + ")";
    } else {
      g.strokeStyle = "rgba(232,238,248," + (0.24 + 0.58 * Math.min(1, flash)).toFixed(3) + ")";
    }
    g.lineWidth = 1 + flash * 1.1;
    g.stroke();
    // nucleus: glowing dot sized by local tone
    const r = 1 + 2.6 * d, fl = Math.min(1, flash);
    g.beginPath();
    g.arc(s.x, s.y, r * 2.7, 0, 6.2832);
    g.fillStyle = s.orb
      ? "rgba(70,255,150," + (0.10 + 0.22 * fl).toFixed(3) + ")"
      : "rgba(255,255,255," + (0.09 + 0.22 * fl).toFixed(3) + ")";
    g.fill();
    g.beginPath();
    g.arc(s.x, s.y, r, 0, 6.2832);
    g.fillStyle = s.orb ? "rgba(170,255,200,0.95)" : "rgba(255,255,255,0.92)";
    g.fill();
  }
  g.drawImage(vig, 0, 0);
}

// ---------- synthesized slow techno (WebAudio, no files) ----------
let actx = null, master = null, noiseBuf = null, audioReady = false;
let schedTimer = null, nextStepIdx = 0, nextStepSongT = 0;
let epochSongT = 0, epochCtxT = 0;
const songT0 = performance.now() / 1000;
function songT(){ return performance.now() / 1000 - songT0; }

function ensureAudio(){
  if (actx) return true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0;
    const comp = actx.createDynamicsCompressor();
    master.connect(comp);
    comp.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    // dubby feedback delay for the lead
    const dly = actx.createDelay(1);
    dly.delayTime.value = SPB * 6;
    const fb = actx.createGain(); fb.gain.value = 0.38;
    const wet = actx.createGain(); wet.gain.value = 0.3;
    dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(master);
    actx._delay = dly;
    audioReady = true;
    return true;
  } catch (err){ return false; }
}
function songTtoCtx(t){ return epochCtxT + (t - epochSongT); }

function kickSound(t){
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
  gn.gain.setValueAtTime(0.95, t);
  gn.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
  o.connect(gn); gn.connect(master);
  o.start(t); o.stop(t + 0.3);
  const n = actx.createBufferSource(); n.buffer = noiseBuf;
  const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1200;
  const ng = actx.createGain();
  ng.gain.setValueAtTime(0.25, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
  n.connect(hp); hp.connect(ng); ng.connect(master);
  n.start(t); n.stop(t + 0.03);
}
function hatSound(t, open){
  const n = actx.createBufferSource(); n.buffer = noiseBuf;
  n.playbackRate.value = 1.3;
  const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 7500;
  const gn = actx.createGain(), dur = open ? 0.22 : 0.045;
  gn.gain.setValueAtTime(open ? 0.20 : 0.16, t);
  gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  n.connect(hp); hp.connect(gn); gn.connect(master);
  n.start(t); n.stop(t + dur + 0.02);
}
function snareSound(t){
  const n = actx.createBufferSource(); n.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1900; bp.Q.value = 0.9;
  const gn = actx.createGain();
  gn.gain.setValueAtTime(0.30, t);
  gn.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
  n.connect(bp); bp.connect(gn); gn.connect(master);
  n.start(t); n.stop(t + 0.18);
}
function bassSound(t, f){
  const o = actx.createOscillator(), gn = actx.createGain(), lp = actx.createBiquadFilter();
  o.type = "sawtooth"; o.frequency.value = f;
  lp.type = "lowpass"; lp.frequency.setValueAtTime(320, t);
  lp.frequency.exponentialRampToValueAtTime(120, t + 0.3);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(0.34, t + 0.015);
  gn.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
  o.connect(lp); lp.connect(gn); gn.connect(master);
  o.start(t); o.stop(t + 0.4);
}
function leadSound(t, f){
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = "triangle"; o.frequency.value = f;
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(0.15, t + 0.03);
  gn.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  o.connect(gn); gn.connect(master); gn.connect(actx._delay);
  o.start(t); o.stop(t + 0.55);
}
function scheduleStep(idx){
  const c = Math.floor(idx / 32), s = idx % 32;
  const p = cyclePattern(c);
  const t = songTtoCtx(stepTime(c, s));
  if (t < actx.currentTime - 0.05) return;
  if (p.kick[s]) kickSound(t);
  if (p.snare[s]) snareSound(t);
  if (p.hat[s]) hatSound(t, p.hatO[s]);
  if (p.bassF[s]) bassSound(t, p.bassF[s]);
  if (p.leadF[s]) leadSound(t, p.leadF[s]);
}
function scheduleAhead(){
  if (!actx) return;
  const ahead = songT() + 0.20;
  let guard = 0;
  while (nextStepSongT < ahead && guard++ < 64){
    scheduleStep(nextStepIdx);
    nextStepIdx++;
    nextStepSongT += SPB;
  }
}
let soundOn = false;
const soundBtn = document.getElementById("soundBtn");
function setSound(on){
  soundOn = on;
  soundBtn.textContent = on ? "sound on" : "sound off";
  if (on){
    if (!ensureAudio()){ soundOn = false; soundBtn.textContent = "sound off"; return; }
    actx.resume();
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setTargetAtTime(0.85, actx.currentTime, 0.4);
    if (!schedTimer){
      epochSongT = songT(); epochCtxT = actx.currentTime;
      nextStepSongT = epochSongT + 0.08;
      nextStepIdx = Math.ceil(nextStepSongT / SPB);
      nextStepSongT = nextStepIdx * SPB;
      schedTimer = setInterval(scheduleAhead, 40);
    }
  } else if (actx){
    master.gain.setTargetAtTime(0.0, actx.currentTime, 0.15);
  }
  document.getElementById("hint").classList.add("gone");
}
soundBtn.addEventListener("click", (ev) => { ev.stopPropagation(); setSound(!soundOn); });

// ---------- interaction: click = congregation, drag = stir ----------
const stage = document.getElementById("stage");
let pDown = null, stirring = false, lastP = null;

function canvasPos(ev){
  const r = cvs.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
}
stage.addEventListener("pointerdown", (ev) => {
  try { stage.setPointerCapture(ev.pointerId); } catch (err) {}
  pDown = canvasPos(ev); lastP = pDown; stirring = false;
  document.getElementById("hint").classList.add("gone");
});
stage.addEventListener("pointermove", (ev) => {
  if (!pDown) return;
  const p = canvasPos(ev);
  const moved = Math.hypot(p.x - pDown.x, p.y - pDown.y);
  if (moved > 10) stirring = true;
  if (stirring && lastP){
    const dx = p.x - lastP.x, dy = p.y - lastP.y;
    const spd = Math.hypot(dx, dy);
    if (spd > 0.5){
      for (let i = 0; i < seeds.length; i++){
        const s = seeds[i];
        const rx = s.x - p.x, ry = s.y - p.y;
        const d = Math.hypot(rx, ry);
        if (d < 150 && d > 1){
          const fall = 1 - d / 150;
          s.vx += (-ry / d) * spd * 3.2 * fall;
          s.vy += (rx / d) * spd * 3.2 * fall;
        }
      }
    }
  }
  lastP = p;
});
stage.addEventListener("pointerup", (ev) => {
  if (!pDown) return;
  const p = canvasPos(ev);
  if (!stirring){
    // click: congregation on demand at the click point (+ first click starts sound)
    if (!freeze && !perfMode) manualKicks.push({ t: songT(), x: p.x, y: p.y });
    if (!soundOn && !freeze && !perfMode) setSound(true);
  }
  pDown = null; stirring = false;
});
document.getElementById("seedBtn").addEventListener("click", (ev) => {
  ev.stopPropagation();
  pieceSeed = (Math.random() * 2147483647) | 0;
  patCache.clear(); stageParamCache.clear();
  buildAgents();
  try {
    const u = new URL(location.href);
    u.searchParams.set("seed", String(pieceSeed));
    history.replaceState(null, "", u);
  } catch (err){}
  document.getElementById("hint").classList.add("gone");
});

// ---------- main loop ----------
const SIM_DT = 1 / 60;
let simT = 0, acc = 0, lastNow = performance.now();
let perfFrames = 0, perfT0 = 0, perfVor = 0;

function frame(){
  const now = performance.now();
  let dt = (now - lastNow) / 1000;
  lastNow = now;
  if (dt > 0.25) dt = 0.25;

  if (perfMode){
    if (perfFrames === 0) perfT0 = performance.now();
    const v0 = performance.now();
    stepAgents(SIM_DT, simT); simT += SIM_DT;
    voronoi();
    perfVor += performance.now() - v0;
    perfFrames++;
    if (perfFrames >= 240){
      const total = performance.now() - perfT0;
      document.title = "perf frames=240 total=" + total.toFixed(0) + "ms avg=" +
        (total / 240).toFixed(2) + "ms voronoi=" + (perfVor / 240).toFixed(2) + "ms";
      return;
    }
    requestAnimationFrame(frame);
    return;
  }

  if (freeze){
    const target = frozenT;
    const steps = Math.max(1, Math.round(target * 60));
    for (let k = 0; k < steps; k++){ stepAgents(SIM_DT, simT); simT += SIM_DT; }
    voronoi();
    draw(bandEnvelopes(simT), simT);
    document.title = "frozen t=" + simT.toFixed(2);
    return;
  }

  acc += dt;
  let env = null, n = 0;
  while (acc >= SIM_DT && n < 4){
    env = stepAgents(SIM_DT, simT);
    simT += SIM_DT; acc -= SIM_DT; n++;
  }
  if (n === 4) acc = 0;
  voronoi();
  draw(env || bandEnvelopes(simT), simT);
  requestAnimationFrame(frame);
}

buildAgents();
if (reducedMotion && !freeze && !perfMode){
  const steps = Math.round(8 * 60);
  for (let k = 0; k < steps; k++){ stepAgents(SIM_DT, simT); simT += SIM_DT; }
  voronoi();
  draw(bandEnvelopes(simT), simT);
} else {
  requestAnimationFrame(frame);
}
</script>
