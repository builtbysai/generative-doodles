<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Sound Installations (a cover that keeps score)</title>
<style>
html, body { margin: 0; padding: 0; background: #fdfcf8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#fdfcf8';
var INK = '#1a1a18';
var BLUE_INK = '#1f4c9c';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, set 2 mid-typing, two annotations in */
var SET_DUR = 40.0; /* seconds per installation data set */
var SETS_N = 6;
var CYCLE = SET_DUR * SETS_N; /* 240 s */
var TITLE = 'Six Sound Installations (a cover that keeps score)';
var DATE_STR = '2006 · 12 · 05';
var HINT = 'Watch only.';
var PLATE_FILL = '#ffffff';
var PLATE_LINE = 'rgba(0,0,0,0.28)';
var PLATE_INK = '#2b2b28';
var HINT_INK = '#2b2b28';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }

/* ---- six fixed installation data sets (PP1036) ----
   Each set is a fixed authored table built once from seed 1789: a header
   line, data rows typed row-major across the set's columns, and a footer
   line. Typing order is line order; per-character type times are closed
   form (index * charDt plus a small seeded jitter), so frame one is
   byte-comparable. Column layouts differ per set. */
var SET_NAMES = ['HALL', 'STAIRWELL', 'COURTYARD', 'BASEMENT', 'ROOF', 'PASSAGE'];
var SET_COLS = [
  [0.06, 0.38, 0.70],
  [0.06, 0.37, 0.68],
  [0.05, 0.29, 0.53, 0.77],
  [0.08, 0.55],
  [0.06, 0.40, 0.72],
  [0.07, 0.50, 0.80]
];
var SET_ROWS = [9, 12, 9, 9, 9, 10];
var SET_FMT = [0, 1, 2, 3, 0, 2];
function rowText(s, letter, r, rng) {
  var val = (rng() * 12).toFixed(1);
  if (val.length < 4) val = '0' + val;
  var hh = pad2(Math.floor(rng() * 24));
  var mm = pad2(Math.floor(rng() * 60));
  var label = letter + (r + 1);
  var fmt = SET_FMT[s];
  if (fmt === 0) return label + ' ' + val + ' ' + hh + ':' + mm;
  if (fmt === 1) return label + ' ' + val + ' ' + hh + ':' + mm + ' ' + (rng() * 0.9 + 0.1).toFixed(2);
  if (fmt === 2) return label + ' ' + val;
  return label + ' ' + (rng() * 40 + 5).toFixed(2) + ' ' + hh + ':' + mm + ' ' + (rng() * 9 + 1).toFixed(1);
}
var SETS = [];
(function buildSets() {
  var rng = mulberry32(1789);
  var s, r, c, i, j;
  for (s = 0; s < SETS_N; s++) {
    var letter = 'ABCDEF'[s];
    var cols = SET_COLS[s];
    var nrows = SET_ROWS[s];
    var lines = [];
    lines.push({ x: 0.06, row: -1, text: 'INSTALLATION 0' + (s + 1) + ' - ' + SET_NAMES[s] });
    for (r = 0; r < nrows; r++) {
      for (c = 0; c < cols.length; c++) {
        lines.push({ x: cols[c], row: r, text: rowText(s, letter, r, rng) });
      }
    }
    lines.push({ x: 0.06, row: nrows, text: 'SET 0' + (s + 1) + ' OF 06 - SIX INSTALLATIONS - RETYPE CYCLE 40 S' });
    var total = 0;
    for (i = 0; i < lines.length; i++) total += lines[i].text.length;
    var charDt = (SET_DUR * 0.92) / total;
    var k = 0;
    for (i = 0; i < lines.length; i++) {
      var tt = [], jx = [], jy = [];
      for (j = 0; j < lines[i].text.length; j++) {
        tt.push(Math.max(0, k * charDt + (rng() * 0.08 - 0.04)));
        jx.push(rng() * 2 - 1);
        jy.push(rng() * 2 - 1);
        k++;
      }
      lines[i].typeTimes = tt;
      lines[i].jx = jx;
      lines[i].jy = jy;
    }
    SETS.push({ lines: lines, total: total, charDt: charDt });
  }
})();
/* Handwritten ballpoint-blue annotations, one schedule per set.
   start is seconds into the set; fade takes 3 s. At t = 60 s (set 2,
   20 s in) the first two are fully in and the third has not started. */
var ANNOTS = [
  [{ x: 0.24, row: 1, text: 'faint, keep', start: 5 }, { x: 0.58, row: 4, text: 'door slam?', start: 16 }, { x: 0.24, row: 7, text: 'repeat', start: 29 }],
  [{ x: 0.28, row: 2, text: 'louder here', start: 6 }, { x: 0.585, row: 5, text: 'check the hum', start: 14 }, { x: 0.28, row: 9, text: 'too quiet', start: 27 }],
  [{ x: 0.15, row: 2, text: 'soft', start: 7 }, { x: 0.63, row: 5, text: 'wind?', start: 18 }, { x: 0.39, row: 7, text: 'again', start: 30 }],
  [{ x: 0.33, row: 2, text: 'holds', start: 8 }, { x: 0.33, row: 6, text: 'fades out', start: 17 }, { x: 0.80, row: 8, text: 'low', start: 31 }],
  [{ x: 0.24, row: 1, text: 'bright', start: 5 }, { x: 0.58, row: 4, text: 'echo', start: 15 }, { x: 0.24, row: 7, text: 'hold it', start: 28 }],
  [{ x: 0.20, row: 2, text: 'last one', start: 6 }, { x: 0.62, row: 5, text: 'listen', start: 16 }, { x: 0.20, row: 8, text: 'done', start: 29 }]
];
/* Three translucent discs on independent slow orbits (closed form of t).
   At t = 60 s the blue and orange discs overlap over the middle columns. */
var DISCS = [
  { color: '#2f6fd0', alpha: 0.30, r: 0.30, cx0: 0.40, ax: 0.11, px: 97, phx: 0.4, cosX: false, cy0: 0.44, ay: 0.09, py: 113, phy: 1.3, cosY: false },
  { color: '#e8762b', alpha: 0.30, r: 0.30, cx0: 0.58, ax: 0.10, px: 89, phx: 2.1, cosX: false, cy0: 0.44, ay: 0.10, py: 101, phy: 0.5, cosY: true },
  { color: '#7fc4b5', alpha: 0.28, r: 0.30, cx0: 0.52, ax: 0.09, px: 127, phx: 0.7, cosX: true, cy0: 0.62, ay: 0.08, py: 83, phy: 2.9, cosY: false }
];
function discCenter(d, t) {
  var cx = d.cx0 + d.ax * (d.cosX ? Math.cos(TAU * t / d.px + d.phx) : Math.sin(TAU * t / d.px + d.phx));
  var cy = d.cy0 + d.ay * (d.cosY ? Math.cos(TAU * t / d.py + d.phy) : Math.sin(TAU * t / d.py + d.phy));
  return { x: cx, y: cy };
}
/* Photo scraps at the four corners: leaves, clouds, striped paper, leaves. */
var SCRAPS = [
  { x: 0.04, y: 0.11, w: 0.17, h: 0.13, rot: -4, kind: 'leaves' },
  { x: 0.79, y: 0.07, w: 0.17, h: 0.12, rot: 3, kind: 'clouds' },
  { x: 0.04, y: 0.80, w: 0.16, h: 0.12, rot: 2, kind: 'stripes' },
  { x: 0.80, y: 0.81, w: 0.16, h: 0.12, rot: -3, kind: 'leaves' }
];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
function rowY(row) {
  if (row < 0) return 0.095; /* clears the title plate at every size */
  return 0.14 + row * 0.052;
}
function setIndex(t) { return Math.floor((t % CYCLE) / SET_DUR); }
function setTime(t) { return t % SET_DUR; }
function typedCount(set, tIn) {
  var n = 0, i, j;
  for (i = 0; i < set.lines.length; i++) {
    for (j = 0; j < set.lines[i].text.length; j++) {
      if (set.lines[i].typeTimes[j] <= tIn) n++;
    }
  }
  return n;
}
function drawSet(t) {
  var idx = setIndex(t);
  var tIn = setTime(t);
  var set = SETS[idx];
  var fs = Math.max(10, Math.min(16, 0.019 * F.w));
  var adv = 0.6 * fs;
  ctx.font = fs + 'px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = INK;
  var caret = null;
  var i, j, line, y, x;
  for (i = 0; i < set.lines.length; i++) {
    line = set.lines[i];
    y = F.y + rowY(line.row) * F.h;
    for (j = 0; j < line.text.length; j++) {
      if (line.typeTimes[j] > tIn) {
        if (!caret) caret = { x: F.x + line.x * F.w + j * adv, y: y, fs: fs };
        break;
      }
      x = F.x + line.x * F.w + j * adv + line.jx[j] * 0.8;
      ctx.fillText(line.text[j], x, y + line.jy[j] * 0.9);
    }
  }
  if (caret) {
    ctx.fillStyle = 'rgba(26,26,24,0.75)';
    ctx.fillRect(caret.x - 1, caret.y - caret.fs, Math.max(2, caret.fs * 0.16), caret.fs * 1.15);
    ctx.fillStyle = INK;
  }
  /* ballpoint-blue annotations fading in between rows, beside the row
     they annotate, so they never cover typed text at any size */
  var anns = ANNOTS[idx];
  ctx.font = 'italic ' + Math.max(10, Math.min(14, 0.016 * F.w)) + 'px Georgia, "Times New Roman", serif';
  for (i = 0; i < anns.length; i++) {
    var a = anns[i];
    var alpha = clamp((tIn - a.start) / 3, 0, 1);
    if (alpha <= 0) continue;
    ctx.save();
    ctx.translate(F.x + a.x * F.w, F.y + (rowY(a.row) - 0.026) * F.h);
    ctx.rotate(-0.03);
    ctx.fillStyle = rgba(BLUE_INK, alpha);
    ctx.fillText(a.text, 0, 0);
    var tw = ctx.measureText(a.text).width;
    ctx.strokeStyle = rgba(BLUE_INK, alpha * 0.7);
    ctx.lineWidth = 1;
    ctx.beginPath();
    var wx;
    for (wx = 0; wx <= tw; wx += 4) {
      var wy = 4 + Math.sin(wx * 0.35) * 1.2;
      if (wx === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
    }
    ctx.stroke();
    ctx.restore();
  }
}
function drawScrap(s) {
  var w = s.w * F.w, h = s.h * F.h;
  var cx = F.x + (s.x + s.w / 2) * F.w, cy = F.y + (s.y + s.h / 2) * F.h;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(s.rot * Math.PI / 180);
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.fillRect(-w / 2 + 3, -h / 2 + 4, w, h);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-w / 2 - 4, -h / 2 - 4, w + 8, h + 8);
  ctx.save();
  ctx.beginPath();
  ctx.rect(-w / 2, -h / 2, w, h);
  ctx.clip();
  if (s.kind === 'leaves') {
    ctx.fillStyle = '#9aa078';
    ctx.fillRect(-w / 2, -h / 2, w, h);
    var leafCols = ['#5f7046', '#7a8a5a', '#4c5c38', '#8a9a68'];
    var k;
    for (k = 0; k < 14; k++) {
      var lx = -w / 2 + (k % 5) * (w / 4.2) + ((k * 7) % 13) - 6;
      var ly = -h / 2 + Math.floor(k / 5) * (h / 2.6) + ((k * 11) % 9) - 4;
      ctx.fillStyle = leafCols[k % 4];
      ctx.beginPath();
      ctx.ellipse(lx, ly, w * 0.09, h * 0.16, (k % 3 - 1) * 0.7, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(60,70,40,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lx - w * 0.08, ly);
      ctx.lineTo(lx + w * 0.08, ly + h * 0.05);
      ctx.stroke();
    }
  } else if (s.kind === 'clouds') {
    ctx.fillStyle = '#c3cdd4';
    ctx.fillRect(-w / 2, -h / 2, w, h);
    var cc;
    for (cc = 0; cc < 5; cc++) {
      var cx2 = -w / 2 + w * (0.12 + cc * 0.19);
      var cy2 = -h / 2 + h * (0.35 + (cc % 2) * 0.3);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.ellipse(cx2, cy2, w * 0.16, h * 0.24, 0, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx2 + w * 0.1, cy2 + h * 0.08, w * 0.11, h * 0.18, 0, 0, TAU);
      ctx.fill();
    }
  } else { /* stripes */
    var stripes = ['#c9a86a', '#efe6d2', '#b98a5a', '#d8c49a', '#a87f4e'];
    var si, sw = w / 5;
    for (si = 0; si < 5; si++) {
      ctx.fillStyle = stripes[si];
      ctx.fillRect(-w / 2 + si * sw, -h / 2, sw + 1, h);
    }
    ctx.strokeStyle = 'rgba(60,50,30,0.35)';
    ctx.lineWidth = 1;
    for (si = 1; si < 5; si++) {
      ctx.beginPath();
      ctx.moveTo(-w / 2 + si * sw, -h / 2);
      ctx.lineTo(-w / 2 + si * sw, h / 2);
      ctx.stroke();
    }
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(-w / 2 - 4.5, -h / 2 - 4.5, w + 9, h + 9);
  ctx.restore();
}
function drawDiscs(t) {
  var m = Math.min(F.w, F.h);
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  var d, c, r;
  for (d = 0; d < DISCS.length; d++) {
    c = discCenter(DISCS[d], t);
    r = DISCS[d].r * m;
    ctx.fillStyle = rgba(DISCS[d].color, DISCS[d].alpha);
    ctx.beginPath();
    ctx.arc(F.x + c.x * F.w, F.y + c.y * F.h, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = rgba(DISCS[d].color, 0.22);
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(TITLE).width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(TITLE).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText(DATE_STR).width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(TITLE, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText(DATE_STR, plateX + 14, plateY + 7 + titlePx + 3);
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(HINT).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(HINT, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* Photo scraps sit beneath the typed field, like photos pasted on the
     sheet before it was typed over: the typewriter keeps every row legible
     and the scraps anchor the corners around it. Discs float above. */
  var i;
  for (i = 0; i < SCRAPS.length; i++) drawScrap(SCRAPS[i]);
  drawSet(phaseT);
  drawDiscs(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    setIndex: function () { return setIndex(phaseT); },
    setTime: function () { return setTime(phaseT); },
    typedCount: function () { return typedCount(SETS[setIndex(phaseT)], setTime(phaseT)); },
    setTotal: function () { return SETS[setIndex(phaseT)].total; },
    discCenters: function () {
      var out = [], d;
      for (d = 0; d < DISCS.length; d++) out.push(discCenter(DISCS[d], phaseT));
      return out;
    }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
