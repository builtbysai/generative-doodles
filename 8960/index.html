<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Face Walk · №8960</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #141210;
    overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 62vw;
    font: 400 13px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(232, 222, 200, 0.66); letter-spacing: 0.01em;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 ui-rounded, system-ui, sans-serif;
    color: rgba(232, 222, 200, 0.35);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #snd {
    position: fixed; right: 14px; top: 12px;
    font: 400 12px/1.4 ui-rounded, system-ui, sans-serif;
    color: rgba(232, 222, 200, 0.75);
    background: rgba(232, 222, 200, 0.08);
    border: 1px solid rgba(232, 222, 200, 0.25);
    border-radius: 999px; padding: 6px 14px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="cap">A chord with no tonic. Drag to turn the solid. Tap a vertex to make it 1/1. Tap a face to hear its triad.</div>
<div id="seedtag"></div>
<button id="snd">sound: off</button>
<script>
"use strict";
/* ============================================================
   Face Walk - No.8960 (2026-07-23)
   Seed 259 (Face-Walk the Solid): Erv Wilson's hexany as an
   octahedron. Six vertices are the six pitches 3 5 7 15 21 35
   (opposite pairs multiply to 105); eight faces are the eight
   triads, four otonal, four utonal. A walker crosses the faces
   one by one, each face lighting as its triad is named, and the
   opposite face flashing its inversion across the middle.
   Tapping a vertex re-centers the world: every label is redrawn
   as a ratio to the new 1/1. Navigable, never centered.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 896001;
document.getElementById("seedtag").textContent = "seed " + seed;
const rand = mulberry32(seed);

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

// vertices: [x,y,z,label]; opposite pairs multiply to 105
const V = [
  [1, 0, 0, 3], [-1, 0, 0, 35],
  [0, 1, 0, 5], [0, -1, 0, 21],
  [0, 0, 1, 7], [0, 0, -1, 15]
];
// faces: vertex triples; opposite face index = 7 - i
const FACES = [
  { v: [0, 2, 4], kind: "otonal", root: "1" },    // 3 5 7
  { v: [0, 2, 5], kind: "utonal", root: "105" },  // 3 5 15
  { v: [0, 3, 4], kind: "utonal", root: "105" },  // 3 7 21
  { v: [0, 3, 5], kind: "otonal", root: "3" },    // 3 15 21
  { v: [1, 2, 4], kind: "utonal", root: "105" },  // 5 7 35
  { v: [1, 2, 5], kind: "otonal", root: "5" },    // 5 15 35
  { v: [1, 3, 4], kind: "otonal", root: "7" },    // 7 21 35
  { v: [1, 3, 5], kind: "utonal", root: "105" }   // 15 21 35
];
const PATH = [0, 1, 5, 4, 6, 7, 3, 2]; // edge-adjacent walk of all 8 faces

let W = 0, H = 0, DPR = 1;
let yaw = 0.6, pitch = 0.45, autoSpin = true, lastDrag = 0;
let oneOne = 5;             // which vertex label is 1/1
let walkStep = 0, walkT = 0; // index into PATH, 0..1 progress
let flash = -1, flashT = 0;  // inversion flash face + timer
let soundOn = false, actx = null;

function gcd(a, b) { return b ? gcd(b, a % b) : a; }
function ratioStr(L) {
  if (L === oneOne) return "1/1";
  const g = gcd(L, oneOne);
  const n = L / g, d = oneOne / g;
  return d === 1 ? n + "/1" : n + "/" + d;
}

function project(p, R, cx, cy) {
  // rotate yaw around Y, pitch around X
  let [x, y, z] = p;
  let x1 = x * Math.cos(yaw) + z * Math.sin(yaw);
  let z1 = -x * Math.sin(yaw) + z * Math.cos(yaw);
  let y1 = y * Math.cos(pitch) - z1 * Math.sin(pitch);
  let z2 = y * Math.sin(pitch) + z1 * Math.cos(pitch);
  const s = R / (2.6 + z2 * 0.9);
  return [cx + x1 * s, cy + y1 * s, z2, s];
}

function facePoints(fi, R, cx, cy) {
  return FACES[fi].v.map(vi => project(V[vi], R, cx, cy));
}

function draw(now) {
  ctx.fillStyle = "#141210";
  ctx.fillRect(0, 0, W, H);
  const R = Math.min(W, H) * 0.72;
  const cx = W / 2, cy = H / 2 - H * 0.02;

  // project all vertices
  const P = V.map(v => project(v, R, cx, cy));

  // faces sorted back to front
  const order = FACES.map((f, i) => {
    const pts = f.v.map(vi => P[vi]);
    const z = (pts[0][2] + pts[1][2] + pts[2][2]) / 3;
    return { i, pts, z };
  }).sort((a, b) => a.z - b.z);

  const cur = PATH[walkStep % PATH.length];
  const lit = { face: cur, k: walkT < 0.55 ? 1 : Math.max(0, 1 - (walkT - 0.55) / 0.45) };

  for (const o of order) {
    const f = FACES[o.i];
    const [a, b, c] = o.pts;
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]);
    ctx.closePath();
    let fill;
    if (o.i === lit.face) {
      const k = lit.k;
      fill = f.kind === "otonal"
        ? "rgba(214,150,74," + (0.10 + 0.30 * k) + ")"
        : "rgba(122,150,190," + (0.10 + 0.30 * k) + ")";
    } else if (o.i === flash && flashT > 0) {
      fill = "rgba(210,200,180," + (0.28 * flashT) + ")";
    } else {
      fill = f.kind === "otonal" ? "rgba(214,150,74,0.055)" : "rgba(122,150,190,0.055)";
    }
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = "rgba(232,222,200,0.34)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // edges
  ctx.strokeStyle = "rgba(232,222,200,0.5)";
  ctx.lineWidth = Math.max(1, Math.min(W, H) / 600);
  const seen = new Set();
  for (const f of FACES) for (let e = 0; e < 3; e++) {
    const k = [f.v[e], f.v[(e + 1) % 3]].sort().join("-");
    if (seen.has(k)) continue; seen.add(k);
    const a = P[f.v[e]], b = P[f.v[(e + 1) % 3]];
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }

  // vertex labels
  const fs = Math.max(13, Math.min(W, H) / 30);
  ctx.font = "600 " + fs + "px ui-rounded, system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const vScreen = [];
  for (let vi = 0; vi < 6; vi++) {
    const p = P[vi];
    const label = ratioStr(V[vi][3]);
    vScreen.push({ x: p[0], y: p[1], vi });
    const isOne = V[vi][3] === oneOne;
    ctx.fillStyle = isOne ? "#e8dec8" : "rgba(232,222,200,0.55)";
    // halo behind text
    ctx.fillStyle = "rgba(20,18,16,0.72)";
    const tw = ctx.measureText(label).width;
    ctx.fillRect(p[0] - tw / 2 - 5, p[1] - fs / 2 - 4, tw + 10, fs + 8);
    ctx.fillStyle = isOne ? "#f5eeda" : "rgba(232,222,200,0.62)";
    if (isOne) { ctx.font = "700 " + (fs + 2) + "px ui-rounded, system-ui, sans-serif"; }
    ctx.fillText(label, p[0], p[1] + 1);
    ctx.font = "600 " + fs + "px ui-rounded, system-ui, sans-serif";
    if (isOne) {
      ctx.strokeStyle = "rgba(245,238,218,0.8)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p[0], p[1], fs * 0.95, 0, 6.2832); ctx.stroke();
    }
  }

  // walker dot traveling between face centroids
  const fi0 = PATH[walkStep % PATH.length];
  const fi1 = PATH[(walkStep + 1) % PATH.length];
  const c0 = centroid(facePoints(fi0, R, cx, cy));
  const c1 = centroid(facePoints(fi1, R, cx, cy));
  const t = walkT < 0.55 ? 0 : (walkT - 0.55) / 0.45; // moves in second half
  const e2 = t * t * (3 - 2 * t);
  const mx = (c0[0] + c1[0]) / 2, my = (c0[1] + c1[1]) / 2;
  const lift = Math.min(W, H) * 0.09 * Math.sin(e2 * Math.PI);
  const wx = c0[0] + (c1[0] - c0[0]) * e2, wy = c0[1] + (c1[1] - c0[1]) * e2 - lift;
  const g = ctx.createRadialGradient(wx, wy, 0, wx, wy, 14);
  g.addColorStop(0, "rgba(255,244,220,0.95)");
  g.addColorStop(1, "rgba(255,244,220,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(wx, wy, 14, 0, 6.2832); ctx.fill();

  // triad readout
  const f = FACES[cur];
  const names = f.v.map(vi => ratioStr(V[vi][3])).join(" · ");
  ctx.textAlign = "left";
  const rs = Math.max(15, Math.min(W, H) / 26);
  ctx.font = "700 " + rs + "px ui-rounded, system-ui, sans-serif";
  ctx.fillStyle = f.kind === "otonal" ? "#d6964a" : "#7a96be";
  ctx.fillText(names, 16, H * 0.10);
  ctx.font = "400 " + rs * 0.62 + "px ui-rounded, system-ui, sans-serif";
  ctx.fillStyle = "rgba(232,222,200,0.55)";
  ctx.fillText(f.kind + " on " + f.root, 16, H * 0.10 + rs * 0.85);

  // title
  ctx.font = "700 " + Math.max(18, Math.min(W, H) / 24) + "px ui-rounded, system-ui, sans-serif";
  ctx.fillStyle = "rgba(232,222,200,0.9)";
  ctx.fillText("FACE WALK", 16, 34);

  return vScreen;
}

function centroid(pts) {
  return [(pts[0][0] + pts[1][0] + pts[2][0]) / 3, (pts[0][1] + pts[1][1]) / 3];
}

let vScreen = [];
let last = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  if (autoSpin && performance.now() - lastDrag > 3000) yaw += dt * 0.12;
  walkT += dt / 2.3;
  if (walkT >= 1) {
    walkT = 0;
    walkStep++;
    flash = 7 - PATH[walkStep % PATH.length];
    flashT = 1;
  }
  if (flashT > 0) flashT = Math.max(0, flashT - dt * 1.4);
  vScreen = draw(t);
}

function pointInTri(px, py, a, b, c) {
  const d = (b[1] - c[1]) * (a[0] - c[0]) + (c[0] - b[0]) * (a[1] - c[1]);
  const u = ((b[1] - c[1]) * (px - c[0]) + (c[0] - b[0]) * (py - c[1])) / d;
  const v = ((c[1] - a[1]) * (px - c[0]) + (a[0] - c[0]) * (py - c[1])) / d;
  return u >= 0 && v >= 0 && u + v <= 1;
}

function playTriad(fi) {
  if (!soundOn) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t0 = actx.currentTime;
    FACES[fi].v.forEach((vi, k) => {
      const L = V[vi][3];
      const freq = 196 * (L / oneOne);
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.22, t0 + 0.03 + k * 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + 1.7);
    });
  } catch (e) { /* audio is a garnish, never break the piece */ }
}

let dragId = null, dragX = 0, dragY = 0, moved = 0;
canvas.addEventListener("pointerdown", function (e) {
  dragId = e.pointerId; dragX = e.clientX; dragY = e.clientY; moved = 0;
  autoSpin = false; lastDrag = performance.now();
});
canvas.addEventListener("pointermove", function (e) {
  if (e.pointerId !== dragId) return;
  const dx = e.clientX - dragX, dy = e.clientY - dragY;
  moved += Math.abs(dx) + Math.abs(dy);
  yaw += dx * 0.008; pitch = Math.max(-1.2, Math.min(1.2, pitch + dy * 0.006));
  dragX = e.clientX; dragY = e.clientY;
  lastDrag = performance.now();
});
canvas.addEventListener("pointerup", function (e) {
  const wasDrag = moved > 12;
  dragId = null;
  lastDrag = performance.now();
  if (wasDrag) return;
  const R = Math.min(W, H) * 0.72;
  const cx = W / 2, cy = H / 2 - H * 0.02;
  // vertex tap?
  for (const vs of vScreen) {
    if (Math.hypot(e.clientX - vs.x, e.clientY - vs.y) < 30) {
      oneOne = V[vs.vi][3];
      return;
    }
  }
  // face tap?
  for (let fi = 0; fi < 8; fi++) {
    const pts = facePoints(fi, R, cx, cy);
    if (pointInTri(e.clientX, e.clientY, pts[0], pts[1], pts[2])) {
      playTriad(fi);
      return;
    }
  }
});
canvas.addEventListener("pointercancel", function () { dragId = null; });

document.getElementById("snd").addEventListener("click", function () {
  soundOn = !soundOn;
  this.textContent = soundOn ? "sound: on" : "sound: off";
});

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
