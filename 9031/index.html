<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9031 · Halved</title>
<style>
  :root{
    --paper:#f5f2ea;
    --ink:#2c2b27;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--paper)}
  body{font-family:Georgia,'Times New Roman',serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;touch-action:none;cursor:crosshair}
  canvas{display:block;width:100%;height:100%}
  .label{position:fixed;z-index:2;pointer-events:none;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink);opacity:.55}
  #title{top:22px;left:24px}
  #count{bottom:22px;left:24px}
  #hint{bottom:22px;left:50%;transform:translateX(-50%);white-space:nowrap;
    transition:opacity .8s ease}
  #hint.gone{opacity:0}
  #actions{position:fixed;z-index:2;bottom:20px;right:22px;display:flex;gap:18px}
  #actions button{background:none;border:0;cursor:pointer;padding:4px 2px;
    font:inherit;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink);opacity:.55;border-bottom:1px solid transparent}
  #actions button:hover{opacity:1;border-bottom-color:var(--ink)}
  #actions button:disabled{opacity:.22;cursor:default;border-bottom-color:transparent}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="label" id="title">№9031 · Halved</div>
<div class="label" id="count"></div>
<div class="label" id="hint">drag a line through the shape to cut it</div>
<div id="actions">
  <button id="undo" type="button" disabled>undo</button>
  <button id="fresh" type="button">new shape</button>
</div>
<script>
'use strict';
/* Halved: one random polygon. Draw a line and the shape splits along it.
   Cut the pieces again, as far as you like. Nothing else to learn. */

const PAPER = [245, 242, 234];
const INK = [44, 43, 39];
const EPS = 1e-9;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function parseQuery(){
  const q = {};
  for(const kv of location.search.replace(/^\?/,'').split('&')){
    const [k,v] = kv.split('=');
    if(k) q[decodeURIComponent(k)] = decodeURIComponent(v || '');
  }
  return q;
}
const query = parseQuery();
let seed = query.seed ? (parseInt(query.seed,10) >>> 0) : ((Math.random()*4294967296) >>> 0);
let rand = mulberry32(seed);

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}

/* ---------- geometry ---------- */
function signedArea(p){
  let s = 0;
  for(let i=0;i<p.length;i++){
    const a = p[i], b = p[(i+1)%p.length];
    s += a.x*b.y - b.x*a.y;
  }
  return s/2;
}
function area(p){ return Math.abs(signedArea(p)); }

/* Intersect infinite line through a,b with segment p,q. Returns point or null. */
function lineSegHit(a,b,p,q){
  const dx = b.x-a.x, dy = b.y-a.y;
  const ex = q.x-p.x, ey = q.y-p.y;
  const den = dx*ey - dy*ex;
  if(Math.abs(den) < EPS) return null;
  const t = ((p.x-a.x)*ey - (p.y-a.y)*ex) / den;
  const u = ((p.x-a.x)*dy - (p.y-a.y)*dx) / den;
  if(u < -1e-7 || u > 1+1e-7) return null;
  return { x: a.x + t*dx, y: a.y + t*dy, t };
}

function splitOne(poly, a, b, nudge){
  const hits = [];
  for(let i=0;i<poly.length;i++){
    const p = poly[i], q = poly[(i+1)%poly.length];
    const h = lineSegHit(a,b,p,q);
    if(h){
      const du = Math.hypot(h.x-p.x, h.y-p.y), dv = Math.hypot(h.x-q.x, h.y-q.y);
      if(du < 1e-6 || dv < 1e-6) return null; /* vertex graze: caller nudges */
      hits.push({ edge:i, x:h.x, y:h.y });
    }
  }
  const pts = [];
  for(const h of hits){
    if(!pts.some(o => Math.hypot(o.x-h.x,o.y-h.y) < 1e-6)) pts.push(h);
  }
  if(pts.length !== 2) return null;
  pts.sort((m,n) => m.edge - n.edge);
  const [h1,h2] = pts;
  const P1 = {x:h1.x, y:h1.y}, P2 = {x:h2.x, y:h2.y};
  const A = [P1];
  for(let i=h1.edge+1;i<=h2.edge;i++) A.push(poly[i % poly.length]);
  A.push(P2);
  const B = [P2];
  for(let i=h2.edge+1;i<poly.length;i++) B.push(poly[i]);
  for(let i=0;i<=h1.edge;i++) B.push(poly[i]);
  B.push(P1);
  if(A.length < 3 || B.length < 3) return null;
  if(area(A) < 1e-6 || area(B) < 1e-6) return null;
  return [A, B];
}

/* Split every polygon the line crosses. Nudges the line angle on vertex grazes. */
function cutAll(polys, a, b){
  for(let k=0;k<10;k++){
    const ang = k * 2.3e-4;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const rot = p => ({ x: mx + (p.x-mx)*ca - (p.y-my)*sa,
                        y: my + (p.x-mx)*sa + (p.y-my)*ca });
    const ra = rot(a), rb = rot(b);
    let ok = true;
    const out = [];
    for(const poly of polys){
      const r = splitOne(poly.pts, ra, rb);
      if(r === null){
        /* check whether this polygon is even crossed; if not, keep it */
        const hs = [];
        for(let i=0;i<poly.pts.length;i++){
          const h = lineSegHit(ra,rb,poly.pts[i],poly.pts[(i+1)%poly.pts.length]);
          if(h) hs.push(h);
        }
        const uniq = hs.filter((h,i) => !hs.slice(0,i).some(o =>
          Math.hypot(o.x-h.x,o.y-h.y) < 1e-6));
        if(uniq.length === 2){ ok = false; break; } /* true crossing, vertex graze */
        out.push(poly); /* untouched */
      } else {
        out.push({pts:r[0], tone:poly.tone, gen:poly.gen},
                 {pts:r[1], tone:Math.min(poly.tone+1, TONES-1), gen:poly.gen+1});
      }
    }
    if(ok) return out;
  }
  return polys; /* give up: line left as drawn, shape unchanged */
}

/* ---------- tones: paper, then steps toward ink ---------- */
const TONES = 6;
function toneColor(t){
  const f = [0, .10, .20, .32, .46, .62][t] || 0;
  const r = Math.round(PAPER[0] + (INK[0]-PAPER[0])*f);
  const g = Math.round(PAPER[1] + (INK[1]-PAPER[1])*f);
  const bl = Math.round(PAPER[2] + (INK[2]-PAPER[2])*f);
  return `rgb(${r},${g},${bl})`;
}

/* ---------- shapes ---------- */
function regular(n, R, rot){
  const p = [];
  for(let i=0;i<n;i++){
    const a = rot + i/n*Math.PI*2;
    p.push({x: Math.cos(a)*R, y: Math.sin(a)*R});
  }
  return p;
}
function newShape(){
  const cx = W/2, cy = H/2;
  const R = Math.min(W,H) * (0.30 + rand()*0.08);
  const rot = rand()*Math.PI*2;
  const kind = Math.floor(rand()*7);
  let pts;
  if(kind === 0) pts = regular(4, R, rot + Math.PI/4);            /* square */
  else if(kind === 1){                                            /* rectangle */
    const w = R*(1.15+rand()*0.7), h = R*(0.85+rand()*0.4);
    pts = regular(4, 1, 0).map(q => ({x:q.x*w, y:q.y*h}));
    const c = Math.cos(rot), s = Math.sin(rot);
    pts = pts.map(q => ({x:q.x*c-q.y*s, y:q.x*s+q.y*c}));
  }
  else if(kind === 2) pts = regular(48, R, 0);                    /* circle */
  else if(kind === 3) pts = regular(3, R, rot);                    /* triangle */
  else if(kind === 4) pts = regular(5, R, rot);                    /* pentagon */
  else if(kind === 5) pts = regular(6, R, rot);                    /* hexagon */
  else {                                                          /* ellipse */
    const w = R*(1.1+rand()*0.5), h = R*(0.75+rand()*0.35);
    pts = regular(48, 1, 0).map(q => ({x:q.x*w, y:q.y*h}));
    const c = Math.cos(rot), s = Math.sin(rot);
    pts = pts.map(q => ({x:q.x*c-q.y*s, y:q.x*s+q.y*c}));
  }
  pts = pts.map(q => ({x:q.x+cx, y:q.y+cy}));
  return [{pts, tone:0, gen:0}];
}

/* ---------- state ---------- */
let polys = [];
let history = [];
let drag = null;

function layout(){
  if(!polys.length) reset();
  draw();
}
function reset(){
  history = [];
  polys = newShape();
  applyDemoCuts();
  updateUI();
  draw();
}
function pushHistory(){
  history.push(polys.map(p => ({pts:p.pts.map(q=>({...q})), tone:p.tone, gen:p.gen})));
  if(history.length > 60) history.shift();
}
function undo(){
  if(!history.length) return;
  polys = history.pop();
  updateUI(); draw();
}
function doCut(a, b){
  if(Math.hypot(b.x-a.x, b.y-a.y) < 24) return;
  const before = polys.length;
  const next = cutAll(polys, a, b);
  if(next.length !== before){
    pushHistory();
    polys = next;
    document.getElementById('hint').classList.add('gone');
    updateUI(); draw();
  }
}

/* fixed cuts for deterministic thumbnails: ?cuts=x1,y1,x2,y2;... in 0..1 space */
function applyDemoCuts(){
  if(!query.cuts) return;
  for(const c of query.cuts.split(';')){
    const v = c.split(',').map(Number);
    if(v.length !== 4 || v.some(isNaN)) continue;
    const a = {x:v[0]*W, y:v[1]*H}, b = {x:v[2]*W, y:v[3]*H};
    const next = cutAll(polys, a, b);
    if(next.length !== polys.length) polys = next;
  }
}

function updateUI(){
  const n = polys.length;
  document.getElementById('count').textContent = n + (n === 1 ? ' piece' : ' pieces');
  document.getElementById('undo').disabled = !history.length;
}

/* ---------- drawing ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = `rgb(${PAPER[0]},${PAPER[1]},${PAPER[2]})`;
  ctx.fillRect(0,0,W,H);
  for(const poly of polys){
    ctx.beginPath();
    poly.pts.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
    ctx.closePath();
    ctx.fillStyle = toneColor(poly.tone);
    ctx.fill();
  }
  ctx.strokeStyle = `rgb(${INK[0]},${INK[1]},${INK[2]})`;
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  for(const poly of polys){
    ctx.beginPath();
    poly.pts.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
    ctx.closePath();
    ctx.stroke();
  }
  if(drag){
    const dx = drag.b.x-drag.a.x, dy = drag.b.y-drag.a.y;
    const L = Math.hypot(dx,dy) || 1;
    const ex = dx/L*Math.max(W,H)*2, ey = dy/L*Math.max(W,H)*2;
    ctx.save();
    ctx.strokeStyle = `rgba(${INK[0]},${INK[1]},${INK[2]},0.55)`;
    ctx.lineWidth = 1;
    ctx.setLineDash([7,7]);
    ctx.beginPath();
    ctx.moveTo(drag.a.x-ex, drag.a.y-ey);
    ctx.lineTo(drag.a.x+ex, drag.a.y+ey);
    ctx.stroke();
    ctx.restore();
  }
}

/* ---------- input ---------- */
const stage = document.getElementById('stage');
function pos(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  const p = pos(e);
  drag = { a:p, b:p };
});
stage.addEventListener('pointermove', e => {
  if(!drag) return;
  drag.b = pos(e);
  draw();
});
function endDrag(e){
  if(!drag) return;
  const d = drag; drag = null;
  doCut(d.a, pos(e));
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', () => { drag = null; draw(); });

document.getElementById('fresh').addEventListener('click', () => {
  seed = (Math.random()*4294967296) >>> 0;
  rand = mulberry32(seed);
  reset();
});
document.getElementById('undo').addEventListener('click', undo);
window.addEventListener('resize', resize);

/* test hook */
window.__halved = {
  get polys(){ return polys; },
  cut(a,b){ doCut(a,b); return polys.length; },
  reset(){ reset(); }
};

resize();
</script>
</body>
</html>
