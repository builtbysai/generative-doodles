<body>
<canvas id="stage"></canvas>
<div id="vig"></div>
<div class="hud" id="title"><span class="num">№9002</span> · Kindling</div>
<div class="hud" id="note">Two fractal flames built from pure density, drifting into each other and back. Click anywhere for a new burn.</div>
<div class="hud" id="phase"></div>
<script>
'use strict';
/* №9002 · Kindling — fractal flames from the chaos game.
   Two seeded iterated-function systems accumulate point density into a
   histogram; brightness comes from log-density tone mapping and color from a
   restrained single-ramp palette. The finished piece drifts slowly between
   the two function sets. Click for a new seeded burn. */

/* ---------------- seeded rng ---------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
/* strong default seed: ember bloom that drifts into a bright knot (314159) */
const DEFAULT_SEED = 314159;
let seed = (params.get('seed') !== null) ? (parseInt(params.get('seed'),10) >>> 0) : DEFAULT_SEED;
const frozenT = params.get('t') !== null ? parseFloat(params.get('t')) : null;
if (params.get('clean') === '1') document.body.classList.add('clean');
const reducedMotion = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- variations ----------------
   Each: f(x, y, P, out, rng). Params made by g(rng). w = selection weight. */
const VARS = [
  {n:'linear',     f:(x,y,P,o)=>{o[0]=x;o[1]=y;}, w:3, g:r=>[]},
  {n:'sinusoidal', f:(x,y,P,o)=>{o[0]=Math.sin(x);o[1]=Math.sin(y);}, w:6, g:r=>[]},
  {n:'spherical',  f:(x,y,P,o)=>{const q=x*x+y*y+1e-12;o[0]=x/q;o[1]=y/q;}, w:5, g:r=>[]},
  {n:'swirl',      f:(x,y,P,o)=>{const q=x*x+y*y,s=Math.sin(q),c=Math.cos(q);o[0]=x*s-y*c;o[1]=x*c+y*s;}, w:5, g:r=>[]},
  {n:'horseshoe',  f:(x,y,P,o)=>{const r=Math.sqrt(x*x+y*y)+1e-12;o[0]=(x-y)*(x+y)/r;o[1]=2*x*y/r;}, w:4, g:r=>[]},
  {n:'polar',      f:(x,y,P,o)=>{o[0]=Math.atan2(y,x)/Math.PI;o[1]=Math.sqrt(x*x+y*y)-1;}, w:3, g:r=>[]},
  {n:'handkerchief',f:(x,y,P,o)=>{const r=Math.hypot(x,y),t=Math.atan2(y,x);o[0]=r*Math.sin(t+r);o[1]=r*Math.cos(t-r);}, w:4, g:r=>[]},
  {n:'heart',      f:(x,y,P,o)=>{const r=Math.hypot(x,y),t=Math.atan2(y,x);o[0]=r*Math.sin(t*r);o[1]=-r*Math.cos(t*r);}, w:3, g:r=>[]},
  {n:'disc',       f:(x,y,P,o)=>{const r=Math.hypot(x,y),t=Math.atan2(y,x)/Math.PI;o[0]=t*Math.sin(Math.PI*r);o[1]=t*Math.cos(Math.PI*r);}, w:3, g:r=>[]},
  {n:'spiral',     f:(x,y,P,o)=>{const r=Math.hypot(x,y)+1e-12,t=Math.atan2(y,x);o[0]=(Math.cos(t)+Math.sin(r))/r;o[1]=(Math.sin(t)-Math.cos(r))/r;}, w:4, g:r=>[]},
  {n:'hyperbolic', f:(x,y,P,o)=>{const r=Math.hypot(x,y)+1e-12,t=Math.atan2(y,x);o[0]=Math.sin(t)/r;o[1]=r*Math.cos(t);}, w:3, g:r=>[]},
  {n:'diamond',    f:(x,y,P,o)=>{const r=Math.hypot(x,y),t=Math.atan2(y,x);o[0]=Math.sin(t)*Math.cos(r);o[1]=Math.cos(t)*Math.sin(r);}, w:4, g:r=>[]},
  {n:'ex',         f:(x,y,P,o)=>{const r=Math.hypot(x,y),t=Math.atan2(y,x),p0=Math.sin(t+r),p1=Math.cos(t-r);o[0]=r*(p0*p0*p0+p1*p1*p1);o[1]=r*(p0*p0*p0-p1*p1*p1);}, w:3, g:r=>[]},
  {n:'julia',      f:(x,y,P,o)=>{const r=Math.sqrt(Math.hypot(x,y)),t=Math.atan2(y,x)/2+P[0];o[0]=r*Math.cos(t);o[1]=r*Math.sin(t);}, w:4, g:r=>[r()*Math.PI]},
  {n:'bent',       f:(x,y,P,o)=>{if(x<0)x*=2;if(y<0)y/=2;o[0]=x;o[1]=y;}, w:2, g:r=>[]},
  {n:'waves',      f:(x,y,P,o)=>{o[0]=x+P[0]*Math.sin(y/(P[1]*P[1]));o[1]=y+P[2]*Math.sin(x/(P[3]*P[3]));}, w:3, g:r=>[(r()*1.6-0.8),(r()*0.8+0.4),(r()*1.6-0.8),(r()*0.8+0.4)]},
  {n:'fisheye',    f:(x,y,P,o)=>{const r=2/(Math.hypot(x,y)+1);o[0]=r*y;o[1]=r*x;}, w:4, g:r=>[]},
  {n:'popcorn',    f:(x,y,P,o)=>{o[0]=x+P[0]*Math.sin(Math.tan(3*y));o[1]=y+P[1]*Math.sin(Math.tan(3*x));}, w:3, g:r=>[(r()*0.06-0.03),(r()*0.06-0.03)]},
  {n:'exponential',f:(x,y,P,o)=>{const e=Math.exp(x-1);o[0]=e*Math.cos(Math.PI*y);o[1]=e*Math.sin(Math.PI*y);}, w:2, g:r=>[]},
  {n:'power',      f:(x,y,P,o)=>{const r=Math.hypot(x,y),t=Math.atan2(y,x);o[0]=Math.pow(r,Math.sin(t))*Math.cos(t);o[1]=Math.pow(r,Math.sin(t))*Math.sin(t);}, w:2, g:r=>[]},
  {n:'cosine',     f:(x,y,P,o)=>{o[0]=Math.cos(Math.PI*x)*Math.cosh(y);o[1]=-Math.sin(Math.PI*x)*Math.sinh(y);}, w:2, g:r=>[]},
  {n:'rings',      f:(x,y,P,o)=>{const r=Math.hypot(x,y),t=Math.atan2(y,x),c=P[0]*P[0],m=2*c;let rr=(r+c)%m;rr=rr-c+r*(1-c);o[0]=rr*Math.cos(t);o[1]=rr*Math.sin(t);}, w:3, g:r=>[r()*0.8+0.1]},
  {n:'fan',        f:(x,y,P,o)=>{const r=Math.hypot(x,y);let t=Math.atan2(y,x);const s=Math.PI*P[0]*P[0];t=t>s?t-s:t+s;o[0]=r*Math.cos(t);o[1]=r*Math.sin(t);}, w:3, g:r=>[r()*0.9+0.1]},
  {n:'eyefish',    f:(x,y,P,o)=>{const r=2/(Math.hypot(x,y)+1);o[0]=r*x;o[1]=r*y;}, w:3, g:r=>[]},
  {n:'bubble',     f:(x,y,P,o)=>{const r=4/(x*x+y*y+4);o[0]=r*x;o[1]=r*y;}, w:2, g:r=>[]},
  {n:'cylinder',   f:(x,y,P,o)=>{o[0]=Math.sin(x);o[1]=y;}, w:2, g:r=>[]},
  {n:'julian',     f:(x,y,P,o,rg)=>{const r=Math.hypot(x,y),t=Math.atan2(y,x),pw=P[0],ds=P[1],ph=t/pw+2*Math.PI*Math.floor(ds*rg())/pw;o[0]=Math.pow(r,ds/pw)*Math.cos(ph);o[1]=Math.pow(r,ds/pw)*Math.sin(ph);}, w:3, g:r=>[r()*1.5+0.5,r()*1.5+0.5]},
  {n:'juliascope', f:(x,y,P,o,rg)=>{const r=Math.hypot(x,y),t=Math.atan2(y,x),pw=P[0],ds=P[1],l=Math.floor(ds*rg()),ph=(l%2?-1:1)*t/pw+2*Math.PI*Math.floor(l/2)/pw;o[0]=Math.pow(r,ds/pw)*Math.cos(ph);o[1]=Math.pow(r,ds/pw)*Math.sin(ph);}, w:3, g:r=>[r()*1.5+0.5,r()*1.5+0.5]},
  {n:'curl',       f:(x,y,P,o)=>{const t1=1+P[0]*x+P[1]*(x*x-y*y),t2=P[1]*2*x*y+P[1]*y,d=t1*t1+t2*t2+1e-12;o[0]=(x*t1+y*t2)/d;o[1]=(y*t1-x*t2)/d;}, w:3, g:r=>[(r()*0.8-0.4),(r()*0.8-0.4)]},
  {n:'rects',      f:(x,y,P,o)=>{const px=P[0],py=P[1];o[0]=(2*Math.floor(x/px)+1)*px-x;o[1]=(2*Math.floor(y/py)+1)*py-y;}, w:2, g:r=>[r()*0.8+0.2,r()*0.8+0.2]},
  {n:'tangent',    f:(x,y,P,o)=>{o[0]=Math.sin(x)/Math.cos(y);o[1]=Math.tan(y);}, w:2, g:r=>[]},
  {n:'rays',       f:(x,y,P,o)=>{const p=P[0],r=1/(p*p*Math.hypot(x,y)+1e-10),t=p*r;o[0]=t*Math.cos(x);o[1]=t*Math.sin(y);}, w:2, g:r=>[r()*0.7+0.2]},
  {n:'blade',      f:(x,y,P,o,rg)=>{const r=Math.hypot(x,y),t=x+P[0]*rg();o[0]=t*(Math.sin(r)+Math.cos(r));o[1]=t*(Math.sin(r)-Math.cos(r));}, w:2, g:r=>[r()*1.2+0.4]},
  {n:'secant',     f:(x,y,P,o)=>{o[0]=x;o[1]=1/(P[0]+Math.cos(Math.hypot(x,y)));}, w:2, g:r=>[r()*0.8+0.3]},
  {n:'cross',      f:(x,y,P,o)=>{const s=x*x-y*y,t=1/Math.sqrt(s*s+1e-12);o[0]=t*x;o[1]=t*y;}, w:2, g:r=>[]},
];
const WTOT = VARS.reduce((s,v)=>s+v.w,0);
function pickVar(rng){
  let u = rng()*WTOT;
  for (let k=0;k<VARS.length;k++){ u -= VARS[k].w; if (u<=0) return VARS[k]; }
  return VARS[VARS.length-1];
}

/* ---------------- palettes: restrained 2-3 hue ramps on dark ---------------- */
const PALETTES = [
  { bg:[10,6,3],   stops:[[0,[26,10,4]],[0.35,[166,61,18]],[0.7,[224,139,45]],[1,[255,233,176]]] },  // ember
  { bg:[5,9,12],   stops:[[0,[8,32,40]],[0.4,[31,122,140]],[0.75,[120,190,180]],[1,[235,250,240]]] }, // tidepool
  { bg:[6,10,7],   stops:[[0,[12,40,26]],[0.4,[46,110,70]],[0.75,[150,200,150]],[1,[240,250,235]]] }, // verdigris
  { bg:[7,11,20],  stops:[[0,[14,30,70]],[0.4,[43,76,155]],[0.7,[150,160,225]],[1,[255,214,150]]] },  // ink and saffron
  { bg:[12,6,10],  stops:[[0,[46,12,26]],[0.4,[130,50,80]],[0.75,[210,140,150]],[1,[250,235,225]]] }, // wine
  { bg:[8,8,10],   stops:[[0,[30,30,44]],[0.4,[90,110,150]],[0.7,[170,190,220]],[1,[245,245,250]]] }, // moonlit slate
];

function pickNonLinear(rng){
  for (;;){
    const V = pickVar(rng);
    if (V.n !== 'linear') return V;
  }
}

/* ---------------- flame construction ---------------- */
function makeFlame(rng){
  const nf = 4 + Math.floor(rng()*3); // 4..6 functions
  const funcs = [];
  let pureLinear = 0, wildCount = 0;
  for (let i=0;i<nf;i++){
    const s = 0.7 + rng()*0.5;
    const nv = 1 + (rng()<0.45?1:0) + (rng()<0.12?1:0);
    let wsum = 0;
    const vars = [];
    for (let k=0;k<nv;k++){
      let V = pickVar(rng);
      if (nv===1 && V.n==='linear' && pureLinear>=1) V = pickNonLinear(rng);
      const wt = 0.3 + rng()*0.7;
      wsum += wt;
      vars.push({ v:V, P:V.g(rng), wt });
    }
    vars.forEach(v=>{ v.wt/=wsum; });
    const isPureLinear = nv===1 && vars[0].v.n==='linear';
    if (isPureLinear) pureLinear++; else wildCount++;
    funcs.push({
      a:(rng()*2-1)*s, b:(rng()*2-1)*s, c:(rng()*2-1)*0.6,
      d:(rng()*2-1)*s, e:(rng()*2-1)*s, f:(rng()*2-1)*0.6,
      vars, weight:0, cum:0, color:rng()
    });
  }
  /* guarantee filament texture: at least two functions carry nonlinear variation */
  if (wildCount < 2){
    for (let i=0;i<funcs.length && wildCount<2;i++){
      const fn = funcs[i];
      if (fn.vars.length===1 && fn.vars[0].v.n==='linear'){
        const V = pickNonLinear(rng);
        fn.vars = [{ v:V, P:V.g(rng), wt:1 }];
        wildCount++; pureLinear--;
      }
    }
  }
  let wsum=0;
  funcs.forEach(fn=>{ fn.weight = 0.3+rng(); wsum += fn.weight; });
  let acc=0;
  funcs.forEach(fn=>{ fn.weight/=wsum; acc+=fn.weight; fn.cum=acc; });
  funcs[funcs.length-1].cum = 1.0000001;
  let fin = null;
  if (rng()<0.35){
    const V = pickVar(rng);
    fin = {
      a:rng()*2-1, b:rng()*2-1, c:(rng()*2-1)*0.5,
      d:rng()*2-1, e:rng()*2-1, f:(rng()*2-1)*0.5,
      vars:[{ v:V, P:V.g(rng), wt:1 }]
    };
  }
  const sr = rng();
  const sym = sr<0.55 ? 0 : sr<0.65 ? 2 : sr<0.8 ? 3 : 4;
  return { funcs, fin, sym };
}

/* one chaos-game step; returns into T (tmp) */
const _o = [0,0], _T = [0,0];
function stepFlame(fl, x, y, col, rng, out){
  const fs = fl.funcs;
  const u = rng();
  let fi = 0;
  while (u > fs[fi].cum) fi++;
  const fn = fs[fi];
  const x1 = fn.a*x + fn.b*y + fn.c;
  const y1 = fn.d*x + fn.e*y + fn.f;
  let vx=0, vy=0;
  const vs = fn.vars;
  for (let i=0;i<vs.length;i++){
    const V = vs[i];
    V.v.f(x1, y1, V.P, _o, rng);
    vx += V.wt*_o[0]; vy += V.wt*_o[1];
  }
  out[0]=vx; out[1]=vy; out[2]=(col+fn.color)*0.5;
  return out;
}
function finalPoint(fl, x, y, rng, out){
  const fn = fl.fin;
  if (!fn){ out[0]=x; out[1]=y; return out; }
  const x1 = fn.a*x + fn.b*y + fn.c;
  const y1 = fn.d*x + fn.e*y + fn.f;
  const V = fn.vars[0];
  V.v.f(x1, y1, V.P, _o, rng);
  out[0]=_o[0]; out[1]=_o[1];
  return out;
}

/* scout: bounding box of plotted points + quick quality metrics */
function scout(fl, rng){
  let x=rng()*2-1, y=rng()*2-1, col=rng();
  for (let i=0;i<40;i++){ stepFlame(fl,x,y,col,rng,_T); x=_T[0]; y=_T[1]; col=_T[2]; }
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  const N=60000;
  for (let i=0;i<N;i++){
    stepFlame(fl,x,y,col,rng,_T); x=_T[0]; y=_T[1]; col=_T[2];
    finalPoint(fl,x,y,rng,_T);
    let px=_T[0], py=_T[1];
    if (!isFinite(px+py) || Math.abs(px)>1e4 || Math.abs(py)>1e4){
      x=rng()*2-1; y=rng()*2-1; col=rng(); continue;
    }
    if (px<x0)x0=px; if (px>x1)x1=px; if (py<y0)y0=py; if (py>y1)y1=py;
  }
  return {x0,y0,x1,y1};
}
/* contrast/coverage on a coarse grid; rejects muddy blobs and empty dust */
function quality(fl, rng, cam){
  const G=96, dens=new Float32Array(G*G);
  let x=rng()*2-1, y=rng()*2-1, col=rng();
  for (let i=0;i<40;i++){ stepFlame(fl,x,y,col,rng,_T); x=_T[0]; y=_T[1]; col=_T[2]; }
  const N=120000;
  for (let i=0;i<N;i++){
    stepFlame(fl,x,y,col,rng,_T); x=_T[0]; y=_T[1]; col=_T[2];
    finalPoint(fl,x,y,rng,_T);
    const px=_T[0], py=_T[1];
    if (!isFinite(px+py) || Math.abs(px)>1e4 || Math.abs(py)>1e4){
      x=rng()*2-1; y=rng()*2-1; col=rng(); continue;
    }
    const ix=((px-cam.x0)/cam.w*G)|0, iy=((cam.y1-py)/cam.h*G)|0;
    if (ix<0||iy<0||ix>=G||iy>=G) continue;
    dens[iy*G+ix]++;
  }
  let hit=0, sum=0, mx=0;
  for (let i=0;i<G*G;i++){ const d=dens[i]; if(d>0){hit++; sum+=d; if(d>mx)mx=d;} }
  const coverage = hit/(G*G);
  const contrast = mx/(sum/Math.max(hit,1));
  return { coverage, contrast };
}
function camFrom(box){
  const cx=(box.x0+box.x1)/2, cy=(box.y0+box.y1)/2;
  const side=Math.max(box.x1-box.x0, box.y1-box.y0)*1.06;
  return { x0:cx-side/2, y0:cy-side/2, x1:cx+side/2, y1:cy+side/2, w:side, h:side };
}
/* build one set; retry until the quality gates pass (best of attempts kept) */
function buildSet(baseSeed, attemptSalt){
  let best=null;
  for (let a=0;a<40;a++){
    const rng = mulberry32((baseSeed + attemptSalt*7919 + a*104729) >>> 0);
    const fl = makeFlame(rng);
    const box = scout(fl, rng);
    if (!(box.x1>box.x0 && box.y1>box.y0)) continue;
    if (Math.max(box.x1-box.x0, box.y1-box.y0) > 40) continue; // runaway
    const cam = { x0:box.x0, y0:box.y0, x1:box.x1, y1:box.y1,
                  w:box.x1-box.x0, h:box.y1-box.y0 };
    const q = quality(fl, rng, cam);
    const covOK = q.coverage>0.06 && q.coverage<0.6;
    const score = Math.min(q.contrast,800)/800 * Math.min(q.coverage,0.45);
    const cand = { fl, box, q, score };
    if (!best || score>best.score) best = cand;
    if (covOK && q.contrast>15) return cand;
  }
  return best;
}

/* ---------------- device-dependent render config ---------------- */
const smallScreen = Math.max(screen.width, screen.height) < 760 || Math.min(innerWidth, innerHeight) < 500;
const RES = smallScreen ? 640 : 1024;
const SAMPLES = smallScreen ? 3500000 : 10000000;
const BATCH = smallScreen ? 60000 : 160000;

/* ---------------- buffers ---------------- */
let densA, colsA, densB, colsB, dmaxA=0, dmaxB=0, dmaxGlobal=1;
let camA=null, camB=null, palette=null, lut=null, flA=null, flB=null;
let state='genA', doneA=0, doneB=0, frameNo=0;
let liveT0=0;

const stage = document.getElementById('stage');
const sctx = stage.getContext('2d');
const buf = document.createElement('canvas');
buf.width = RES; buf.height = RES;
const bctx = buf.getContext('2d');
const img = bctx.createImageData(RES, RES);
const phaseEl = document.getElementById('phase');

function buildLUT(pal){
  const L = new Float32Array(1024*3);
  const stops = pal.stops;
  for (let i=0;i<1024;i++){
    const t=i/1023;
    let s=0;
    while (s<stops.length-2 && t>stops[s+1][0]) s++;
    const t0=stops[s][0], c0=stops[s][1], t1=stops[s+1][0], c1=stops[s+1][1];
    const u=Math.min(1,Math.max(0,(t-t0)/Math.max(t1-t0,1e-9)));
    L[i*3]=c0[0]+(c1[0]-c0[0])*u;
    L[i*3+1]=c0[1]+(c1[1]-c0[1])*u;
    L[i*3+2]=c0[2]+(c1[2]-c0[2])*u;
  }
  return L;
}

function sizeCanvas(){
  stage.width = innerWidth; stage.height = innerHeight;
}
sizeCanvas();
addEventListener('resize', ()=>{ sizeCanvas(); blit(); });

function blit(){
  const cw=stage.width, ch=stage.height;
  const s=Math.max(cw/RES, ch/RES), dw=RES*s, dh=RES*s;
  sctx.fillStyle='#000'; sctx.fillRect(0,0,cw,ch);
  sctx.drawImage(buf,(cw-dw)/2,(ch-dh)/2,dw,dh);
}

/* one accumulation batch into the active set (with its own camera) */
function plotInto(fl, cam, dens, cols, x, y, col){
  const sym=fl.sym;
  if (sym===0){
    plotOne(cam,dens,cols,x,y,col);
  } else {
    for (let j=0;j<sym;j++){
      const a=2*Math.PI*j/sym, c=Math.cos(a), s=Math.sin(a);
      plotOne(cam,dens,cols,x*c-y*s,x*s+y*c,col);
    }
  }
}
function plotOne(cam, dens, cols, px, py, col){
  const ix=((px-cam.x0)/cam.w*RES)|0;
  const iy=((cam.y1-py)/cam.h*RES)|0;
  if (ix<0||iy<0||ix>=RES||iy>=RES) return;
  const idx=iy*RES+ix;
  dens[idx]+=1; cols[idx]+=col;
}
function runBatch(fl, cam, dens, cols, done, total, rng){
  let x=rng()*2-1, y=rng()*2-1, col=rng();
  for (let i=0;i<40;i++){ stepFlame(fl,x,y,col,rng,_T); x=_T[0]; y=_T[1]; col=_T[2]; }
  const end=Math.min(done+BATCH, total);
  for (;done<end;done++){
    stepFlame(fl,x,y,col,rng,_T); x=_T[0]; y=_T[1]; col=_T[2];
    finalPoint(fl,x,y,rng,_T);
    const px=_T[0], py=_T[1];
    if (!isFinite(px+py) || Math.abs(px)>1e4 || Math.abs(py)>1e4){
      x=rng()*2-1; y=rng()*2-1; col=rng(); continue;
    }
    plotInto(fl,cam,dens,cols,px,py,col);
  }
  return done;
}

/* log-density tone map with crossfade weight w between the two sets */
function render(w, dmax){
  const N=RES*RES;
  const iw=1-w;
  /* white point set below the raw max so single-bin hotspots do not
     swallow the filaments; cores still clip to the top of the ramp */
  const deff=Math.max(dmax/6,1), K=5/deff, LD=Math.log1p(5), GM=0.55;
  const bg0=palette.bg[0], bg1=palette.bg[1], bg2=palette.bg[2];
  const data=img.data;
  for (let i=0,p=0;i<N;i++,p+=4){
    const d=densA[i]*iw+densB[i]*w;
    if (d<=0){ data[p]=bg0; data[p+1]=bg1; data[p+2]=bg2; data[p+3]=255; continue; }
    const cs=(colsA[i]*iw+colsB[i]*w)/d;
    let a=Math.pow(Math.log1p(d*K)/LD, GM);
    if (a>1) a=1;
    let li=(cs*1023)|0; if (li<0)li=0; else if (li>1023)li=1023;
    const lr=lut[li*3], lg=lut[li*3+1], lb=lut[li*3+2];
    data[p]  =bg0+(lr-bg0)*a;
    data[p+1]=bg1+(lg-bg1)*a;
    data[p+2]=bg2+(lb-bg2)*a;
    data[p+3]=255;
  }
  bctx.putImageData(img,0,0);
  blit();
}

function setPhase(t){ phaseEl.textContent = t; }

/* ---------------- build + animate ---------------- */
const CYCLE=44; // seconds per full A->B->A drift
let rngA=null, rngB=null;

function buildAll(){
  const grng = mulberry32(seed);
  const palIdx = Math.floor(grng()*PALETTES.length);
  palette = PALETTES[palIdx];
  lut = buildLUT(palette);
  document.getElementById('vig').style.background =
    'radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%)';
  const setA = buildSet(seed, 1);
  const setB = buildSet(seed, 2);
  flA=setA.fl; flB=setB.fl;
  camA = camFrom(setA.box); camB = camFrom(setB.box);
  densA=new Float32Array(RES*RES); colsA=new Float32Array(RES*RES);
  densB=new Float32Array(RES*RES); colsB=new Float32Array(RES*RES);
  dmaxA=0; dmaxB=0; dmaxGlobal=1;
  rngA = mulberry32((seed^0x9e3779b9)>>>0);
  rngB = mulberry32((seed^0x85ebca6b)>>>0);
  doneA=0; doneB=0; state='genA'; frameNo=0;
  setPhase('developing the first flame…');
}

function morphW(tSec){
  if (frozenT!==null) tSec=frozenT;
  const ph=(tSec%CYCLE)/CYCLE;
  return 0.5-0.5*Math.cos(2*Math.PI*ph);
}

function frame(){
  frameNo++;
  if (state==='genA'){
    doneA = runBatch(flA, camA, densA, colsA, doneA, SAMPLES, rngA);
    if (frameNo%2===0){ scanMax(); render(0, Math.max(dmaxA,1)); }
    if (doneA>=SAMPLES){ state='genB'; setPhase('developing the second flame…'); }
  } else if (state==='genB'){
    doneB = runBatch(flB, camB, densB, colsB, doneB, SAMPLES, rngB);
    if (frameNo%2===0){ scanMax(); render(1, Math.max(dmaxB,1)); }
    if (doneB>=SAMPLES){
      state='live'; liveT0=performance.now()/1000;
      dmaxGlobal=Math.max(dmaxA,dmaxB,1);
      setPhase('drifting · click for a new burn');
    }
  } else {
    const t = frozenT!==null ? frozenT : (performance.now()/1000 - liveT0);
    render(morphW(t), dmaxGlobal);
  }
  if (!reducedMotion) requestAnimationFrame(frame);
}
function scanMax(){
  let mA=0, mB=0;
  for (let i=0;i<densA.length;i+=7){ if(densA[i]>mA)mA=densA[i]; if(densB[i]>mB)mB=densB[i]; }
  dmaxA=Math.max(dmaxA,mA); dmaxB=Math.max(dmaxB,mB);
}

stage.addEventListener('click', ()=>{
  seed = (Math.random()*0xFFFFFFFF)>>>0;
  try { history.replaceState(null,'','?seed='+seed); } catch(e){}
  buildAll();
});

buildAll();
if (reducedMotion){
  while (doneA<SAMPLES) doneA=runBatch(flA,camA,densA,colsA,doneA,SAMPLES,rngA);
  while (doneB<SAMPLES) doneB=runBatch(flB,camB,densB,colsB,doneB,SAMPLES,rngB);
  scanMax(); dmaxGlobal=Math.max(dmaxA,dmaxB,1);
  state='live';
  render(morphW(frozenT!==null?frozenT:11), dmaxGlobal);
  setPhase('');
} else {
  requestAnimationFrame(frame);
}
</script>
