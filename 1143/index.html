<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reworld</title>
<style>
  html, body { margin: 0; padding: 0; background: #060708; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var seed = 1143;
  try {
    var sm = /[?&]seed=(\d+)/.exec(location.search || '');
    if (sm) seed = parseInt(sm[1], 10);
  } catch (e) {}

  function hash01(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  var TAU = Math.PI * 2;
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function frac(x) { return x - Math.floor(x); }
  function smooth(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }
  function mix(a, b, f) { return a + (b - a) * f; }
  function mixc(a, b, f) {
    return [Math.round(mix(a[0], b[0], f)), Math.round(mix(a[1], b[1], f)), Math.round(mix(a[2], b[2], f))];
  }
  function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

  // ---------- palette (the city's own) ----------
  var GROUT = [6, 7, 8];            // #060708
  var NIGHTSKY = [11, 18, 32];      // #0B1220
  var DAYSKY = [191, 212, 230];     // #BFD4E6
  var DAWNGREY = [138, 143, 152];   // #8A8F98
  var DUSKAMBER = [232, 163, 78];   // #E8A34E
  var SUNDISC = [255, 243, 200];
  var FARDAY = [96, 112, 130], FARNIGHT = [10, 15, 24];
  var NEARDAY = [38, 50, 66], NEARNIGHT = [4, 7, 13];
  var WINLIT = [255, 233, 184];     // #FFE9B8
  var GROUND = [5, 7, 10];

  // ---------- phone detection ----------
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var minScreen = Math.min(sw || 9999, sh || 9999);
  var isPhone = minScreen < 700 || (sh > sw * 1.15 && minScreen < 900);

  // ---------- the hidden city: a pure function ----------
  var DAYLEN = 120;                 // full day/night cycle, seconds
  function keyLerp(ph, keys) {
    for (var i = 0; i < keys.length - 1; i++) {
      var a = keys[i], b = keys[i + 1];
      if (ph >= a[0] && ph <= b[0]) {
        var f = (ph - a[0]) / Math.max(1e-6, b[0] - a[0]);
        return mix(a[1], b[1], f);
      }
    }
    return keys[keys.length - 1][1];
  }
  var DAYKEYS = [[0, 0.15], [0.15, 0.85], [0.45, 1.0], [0.7, 0.8], [0.82, 0.25], [0.95, 0.03], [1, 0.15]];

  function skyline(u, layer) {
    var idx = Math.floor(u / 0.045);
    var hBase = layer === 0 ? 0.16 : 0.24;
    var hVar = layer === 0 ? 0.22 : 0.30;
    return hBase + hVar * hash01(idx * 17.31 + layer * 101.7 + seed * 0.13);
  }

  function cityAt(u, v, t) {
    var ph = frac(t / DAYLEN);
    var dayness = keyLerp(ph, DAYKEYS);
    var nightF = clamp((0.35 - dayness) / 0.35, 0, 1);
    var duskF = clamp(1 - Math.abs(ph - 0.8) / 0.12, 0, 1);
    var dawnF = clamp(1 - Math.abs(ph - 0.04) / 0.08, 0, 1);

    // sky
    var c = mixc(NIGHTSKY, DAYSKY, dayness);
    c = mixc(c, DAWNGREY, dawnF * 0.45 * (0.4 + 0.6 * v));
    c = mixc(c, DUSKAMBER, duskF * 0.55 * v);           // amber lives at the horizon
    var shade = 0.88 + 0.22 * v;                        // horizon a breath lighter
    var weather = 0.94 + 0.10 * (0.5 + 0.5 * Math.sin(u * 9.0 + v * 14.0 - t * 0.05));
    c = [clamp(Math.round(c[0] * shade * weather), 0, 255),
         clamp(Math.round(c[1] * shade * weather), 0, 255),
         clamp(Math.round(c[2] * shade * weather), 0, 255)];

    // sun: an arc across the sky
    var sunU = 0.15 + 0.7 * ph;
    var sunV = 0.62 - 0.45 * Math.sin(Math.PI * clamp(ph, 0, 1));
    var du = (u - sunU) * 1.4, dv = v - sunV;
    var sd = Math.sqrt(du * du + dv * dv);
    if (sd < 0.115) {
      var glow = (1 - sd / 0.115) * (0.25 + 0.45 * dayness + 0.3 * duskF);
      c = mixc(c, SUNDISC, clamp(glow, 0, 0.8));
    }
    if (sd < 0.05) c = mixc(SUNDISC, DUSKAMBER, duskF * 0.5);

    // buildings: two silhouette layers over the sky
    var layers = [0, 1];
    for (var li = 0; li < 2; li++) {
      var layer = layers[li];
      var h = skyline(u, layer);
      if (v > 1 - h) {
        var bc = layer === 0 ? mixc(FARNIGHT, FARDAY, dayness) : mixc(NEARNIGHT, NEARDAY, dayness);
        // windows: a hash grid over the facade
        var wx = Math.floor(u / 0.011), wy = Math.floor(v / 0.019);
        var wh = hash01(wx * 3.7 + wy * 91.3 + layer * 57.1 + seed * 0.71);
        if (wh > 0.62) {
          var lit = nightF * smooth((wh - 0.62) / 0.38);
          if (lit > 0.03) bc = mixc(bc, WINLIT, lit * (layer === 0 ? 0.55 : 0.9));
          else bc = mixc(bc, [10, 16, 24], 0.25 * dayness);   // daytime glass
        }
        c = bc;
      }
    }

    // street band along the very bottom
    if (v > 0.972) c = GROUND;

    // traffic: seeded specks running two lanes
    for (var k = 0; k < 14; k++) {
      var lane = k % 2;
      var laneV = lane === 0 ? 0.978 : 0.989;
      var dir = lane === 0 ? 1 : -1;
      var spd = 0.008 + 0.011 * hash01(k * 7.77 + seed);
      var sx = frac(k * 0.379 + dir * t * spd + hash01(k * 3.3));
      var tdu = (u - sx) * 1.4, tdv = v - laneV;
      if (tdu * tdu + tdv * tdv < 0.000045) {
        c = mixc(c, WINLIT, 0.35 + 0.6 * nightF);
      }
    }
    return c;
  }

  // ---------- the prism wall ----------
  var COLS = 20, ROWS = 20, NT = COLS * ROWS;
  var SUB = isPhone ? 3 : 4;                    // sub-samples per tile axis
  var RETUNE = 40;                              // seconds between re-tunes
  var tileOffX = new Float32Array(NT), tileOffY = new Float32Array(NT);
  var tileZoom = new Float32Array(NT);
  var tileRate = new Float32Array(NT);
  (function buildTiles() {
    var rng = mulberry32(seed * 7919 + 17);
    for (var i = 0; i < NT; i++) {
      tileOffX[i] = (rng() - 0.5) * 0.7;
      tileOffY[i] = (rng() - 0.5) * 0.7;
      tileZoom[i] = 0.55 + rng() * 0.95;
      tileRate[i] = (0.02 + rng() * 0.07) * (rng() < 0.5 ? -1 : 1);
    }
  })();

  function tuneTarget(i, k) {
    // k-th tuning step's rest angle for tile i (deterministic hash stream)
    return (hash01(seed * 3.1 + i * 131.7 + k * 7919.3) - 0.5) * 2.4;
  }

  // recorded events: manual re-tunes and drag vortices
  var retuneEvents = [];   // {t}
  var vortex = [];         // {x, y, t} in normalized coords

  function tuneSteps(t) {
    // chronological list of tuning-step start times up to t (grid + manual)
    var steps = [0];
    for (var g = RETUNE; g <= t; g += RETUNE) steps.push(g);
    for (var e = 0; e < retuneEvents.length; e++) {
      if (retuneEvents[e].t <= t) steps.push(retuneEvents[e].t);
    }
    steps.sort(function (a, b) { return a - b; });
    return steps;
  }

  function tileAngle(i, t) {
    var steps = tuneSteps(t);
    var k = 0;
    while (k + 1 < steps.length && steps[k + 1] <= t) k++;
    var from = tuneTarget(i, k), to = tuneTarget(i, k + 1);
    var f = smooth((t - steps[k]) / 3);         // 3 s eased sweep into each tuning
    var ang = mix(from, to, f) + tileRate[i] * t;
    // drag vortices: spin waves propagating outward from each recorded point
    for (var e = 0; e < vortex.length; e++) {
      var p = vortex[e];
      var cx = (i % COLS + 0.5) / COLS, cy = (Math.floor(i / COLS) + 0.5) / ROWS;
      var dx = cx - p.x, dy = cy - p.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var lt = t - p.t - d * 1.1;               // propagation delay
      if (lt > 0 && lt < 6) {
        ang += 1.9 * Math.exp(-d * 3.2) * Math.sin(lt * 3.1) * Math.exp(-lt / 1.3);
      }
    }
    return ang;
  }

  // ---------- audio: lazy, gesture-gated, very quiet (Franke rule) ----------
  var AC = null, audioOn = false;
  function initAudio() {
    if (audioOn) return;
    try {
      var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext :
                 (typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null;
      if (!Ctor) return;
      AC = new Ctor();
      var master = AC.createGain(); master.gain.value = 0.03; master.connect(AC.destination);
      var o1 = AC.createOscillator(); o1.frequency.value = 55;
      var o2 = AC.createOscillator(); o2.frequency.value = 55.7;
      var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
      var og = AC.createGain(); og.gain.value = 0.5;
      o1.connect(lp); o2.connect(lp); lp.connect(og); og.connect(master);
      o1.start(); o2.start();
      var len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate);
      var dd = buf.getChannelData(0);
      for (var i = 0; i < len; i++) dd[i] = Math.random() * 2 - 1;
      var ns = AC.createBufferSource(); ns.buffer = buf; ns.loop = true;
      var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 320; bp.Q.value = 0.6;
      var ng = AC.createGain(); ng.gain.value = 0.06;
      ns.connect(bp); bp.connect(ng); ng.connect(master);
      ns.start();
      audioOn = true;
    } catch (e) { AC = null; }
  }
  function shimmer() {
    if (!audioOn || !AC) return;
    try {
      var o = AC.createOscillator(); o.type = 'sine';
      o.frequency.value = 1300 + Math.random() * 1100;
      var g = AC.createGain();
      var now = AC.currentTime;
      g.gain.setValueAtTime(0.16, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      o.connect(g); g.connect(AC.destination);
      o.start(now); o.stop(now + 0.55);
    } catch (e) {}
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;
  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }
  function fit() {
    W = viewW(); H = viewH();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  var T0 = 137;   // fixed phase: morning light

  function draw(t) {
    fit();
    ctx.fillStyle = rgb(GROUT);
    ctx.fillRect(0, 0, W, H);
    var cellW = W / COLS, cellH = H / ROWS;
    var subW = cellW / SUB, subH = cellH / SUB;
    for (var j = 0; j < ROWS; j++) {
      for (var i = 0; i < COLS; i++) {
        var idx = j * COLS + i;
        var x0 = i * cellW + 1, y0 = j * cellH + 1;      // 1 px grout inset
        var tw = cellW - 2, th = cellH - 2;
        var ang = tileAngle(idx, t);
        var cosA = Math.cos(ang), sinA = Math.sin(ang);
        var cnx = (i + 0.5) / COLS + tileOffX[idx];
        var cny = (j + 0.5) / ROWS + tileOffY[idx];
        var zoom = tileZoom[idx];
        for (var b = 0; b < SUB; b++) {
          for (var a = 0; a < SUB; a++) {
            var lx = ((a + 0.5) / SUB - 0.5) * tw;
            var ly = ((b + 0.5) / SUB - 0.5) * th;
            var rx = cosA * lx - sinA * ly;
            var ry = sinA * lx + cosA * ly;
            var su = frac(cnx + (rx / W) * zoom);
            var sv = frac(cny + (ry / H) * zoom);
            ctx.fillStyle = rgb(cityAt(su, sv, t));
            ctx.fillRect(x0 + a * subW - 0.3, y0 + b * subH - 0.3, subW + 0.6, subH + 0.6);
          }
        }
        // edge glint as the prism turns through the light
        var g = Math.pow(0.5 + 0.5 * Math.cos(2 * (ang - 0.7)), 16);
        if (g > 0.25) {
          ctx.strokeStyle = 'rgba(255,255,255,' + (0.4 * g).toFixed(3) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x0, y0 + th);
          ctx.lineTo(x0, y0);
          ctx.lineTo(x0 + tw, y0);
          ctx.stroke();
        }
      }
    }
  }

  // ---------- interaction ----------
  var lastT = T0, dragging = false, lastVortexStamp = 0;
  function normPos(ev) {
    var r = { x: 0, y: 0 };
    if (ev.clientX !== undefined) { r.x = ev.clientX / Math.max(1, W); r.y = ev.clientY / Math.max(1, H); }
    return r;
  }
  function onDown(ev) {
    initAudio();
    dragging = true;
    var p = normPos(ev);
    vortex.push({ x: p.x, y: p.y, t: lastT });
    lastVortexStamp = performanceNow();
  }
  function onMove(ev) {
    if (!dragging) return;
    var now = performanceNow();
    if (now - lastVortexStamp < 34) return;
    lastVortexStamp = now;
    var p = normPos(ev);
    vortex.push({ x: p.x, y: p.y, t: lastT });
    if (vortex.length > 48) vortex.splice(0, vortex.length - 48);
  }
  function onUp() { dragging = false; }
  function onDbl() {
    initAudio();
    retuneEvents.push({ t: lastT });
    shimmer();
  }
  function performanceNow() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('dblclick', onDbl);
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  draw(T0);

  var startStamp = null, lastStep = Math.floor(T0 / RETUNE);
  function frame(stamp) {
    if (startStamp === null) startStamp = stamp;
    var t = T0 + (stamp - startStamp) / 1000;
    lastT = t;
    draw(t);
    var step = Math.floor(t / RETUNE);
    if (step !== lastStep) { lastStep = step; shimmer(); }   // the prisms, re-tuning
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
