<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Last Clock</title>
<style>
  html, body { margin: 0; padding: 0; background: #060708; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG / hashing ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(ix, iy, seed) {
    var h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 974634211);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function smootherstep(t) { return t * t * t * (t * (t * 6 - 15) + 10); }

  // ---------- constants ----------
  var BASE_SEED = 11281117;
  var T0 = 26.0;                    // fixed first-frame phase (piece seconds)
  var ACCEL = 60;                   // archive seconds per real second (12 h -> 12 min)
  var A0 = 43200 + 17343;           // archive clock at piece t=0: archive already full + offset
  var DAY = 43200;                  // 12 archive hours

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, U = 1;
  var PHONE = false;
  var pieceTime = T0;

  function isPhone(w, h) {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var minScreen = Math.min(sw, sh);
    if (minScreen > 0) return minScreen < 700;
    return h > w * 1.15;
  }

  function fit() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    W = Math.max(50, Math.floor(w));
    H = Math.max(50, Math.floor(h));
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    U = Math.min(W, H) / 800;
    if (U < 0.35) U = 0.35;
    PHONE = isPhone(W, H);
  }

  // ---------- procedural "video" scene ----------
  // Pure function: brightness(y, T) of the 1px slit column at archive time T.
  // The slit sits at a fixed column of a virtual frame; the frame itself flows
  // (two fbm layers scrolling at different rates) and carries three soft
  // drifting shapes, so the column profile changes as archive time advances.
  var seed = BASE_SEED;
  var blobs = [];
  function buildBlobs() {
    var rng = mulberry32(seed ^ 0x5EED);
    blobs = [];
    for (var i = 0; i < 3; i++) {
      blobs.push({
        yBase: 0.15 + rng() * 0.7,
        yAmp: 0.10 + rng() * 0.22,
        period: 260 + rng() * 640,          // archive seconds
        phase: rng() * Math.PI * 2,
        radius: 0.13 + rng() * 0.16,
        strength: 0.5 + rng() * 0.55
      });
    }
  }
  buildBlobs();

  function vnoise(x, y, s) {
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x - ix, fy = y - iy;
    var a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s);
    var c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s);
    var ux = smootherstep(fx), uy = smootherstep(fy);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  function fbm(x, y, s) {
    return 0.55 * vnoise(x, y, s) + 0.30 * vnoise(x * 2.13 + 7.3, y * 2.13 + 2.9, s + 11) +
           0.15 * vnoise(x * 4.31 + 3.1, y * 4.31 + 9.4, s + 23);
  }

  function sceneColumn(y, T) {
    // two flowing layers, sampled at the slit column (virtual x fixed at 0.5)
    var l1 = fbm(1.7 + T * 0.0016, y * 3.1 + T * 0.0007, seed);
    var l2 = fbm(6.2 - T * 0.0011, y * 5.3 - T * 0.0019, seed + 101);
    var b = 0.62 * l1 + 0.48 * l2 - 0.18;
    for (var i = 0; i < blobs.length; i++) {
      var bl = blobs[i];
      var cy = bl.yBase + bl.yAmp * Math.sin(T * 2 * Math.PI / bl.period + bl.phase);
      var d = (y - cy) / bl.radius;
      if (d > -1 && d < 1) {
        var g = 1 - d * d;
        b += bl.strength * g * g * 0.55;
      }
    }
    if (b < 0) b = 0; else if (b > 1) b = 1;
    return b * b * (3 - 2 * b); // gentle contrast curve
  }

  // ---------- palette ----------
  // ageNorm 0 (newest) -> near-white; 0.55 -> cool gray; 1 -> faint blue.
  function ageColor(ageNorm, bright) {
    var r, g, bl;
    if (ageNorm < 0.55) {
      var k = ageNorm / 0.55;
      r = 244 + (106 - 244) * k; g = 246 + (118 - 246) * k; bl = 248 + (132 - 248) * k;
    } else {
      var k2 = (ageNorm - 0.55) / 0.45;
      r = 106 + (44 - 106) * k2; g = 118 + (58 - 118) * k2; bl = 132 + (72 - 132) * k2;
    }
    var v = 0.10 + 0.90 * bright;
    return 'rgb(' + Math.round(r * v) + ',' + Math.round(g * v) + ',' + Math.round(bl * v) + ')';
  }

  // ---------- interaction state ----------
  var dragging = false;
  var dragStartX = 0, dragStartY = 0;
  var scrubAtGrab = 0;        // archive seconds of offset when the drag began
  var scrubLive = 0;          // archive seconds of offset while dragging
  var releaseT = -1;          // piece time of last release
  var releaseScrub = 0;       // offset at release (decays back to 0)
  var lastTapT = -10, lastTapX = 0, lastTapY = 0;
  var reseeds = 0;

  function scrubOffset(t) {
    if (dragging) return scrubLive;
    if (releaseT >= 0) {
      var dt = t - releaseT;
      if (dt < 6) return releaseScrub * Math.exp(-dt / 1.0);
    }
    return 0;
  }

  // ---------- drawing ----------
  function annularSector(cx, cy, r0, r1, a0, a1) {
    ctx.beginPath();
    ctx.arc(cx, cy, r1, a0, a1, false);
    ctx.arc(cx, cy, r0, a1, a0, true);
    ctx.closePath();
  }

  function drawRing(cx, cy, rIn, rOut, period, A, samples, wedges) {
    var da = Math.PI * 2 / wedges;
    var start = -Math.PI / 2;
    for (var j = 0; j < wedges; j++) {
      var age = (j + 0.5) / wedges * period;         // archive seconds old
      var ageNorm = age / period;
      var T = A - age;                               // capture time of this slice
      var a0 = start + j * da, a1 = a0 + da + 0.002; // hairline overlap
      for (var m = 0; m < samples; m++) {
        var f0 = m / samples, f1 = (m + 1) / samples;
        var y = f0 + 0.5 / samples;
        var b = sceneColumn(y, T);
        ctx.fillStyle = ageColor(ageNorm, b);
        annularSector(cx, cy, rIn + (rOut - rIn) * f0, rIn + (rOut - rIn) * f1 + 0.4, a0, a1);
        ctx.fill();
      }
    }
  }

  function draw(t) {
    ctx.fillStyle = '#060708';
    ctx.fillRect(0, 0, W, H);

    var cx = W / 2, cy = H / 2;
    var R = Math.min(W, H) * 0.425;
    var A = A0 + ACCEL * t + scrubOffset(t);

    // face disc
    ctx.fillStyle = '#0B0D10';
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();

    // rings: outer = last minute, middle = last hour, inner = last 12 hours
    var wedges = PHONE ? 240 : 360;
    drawRing(cx, cy, R * 0.815, R * 0.975, 60, A, 4, wedges);
    drawRing(cx, cy, R * 0.545, R * 0.765, 3600, A, 5, wedges);
    drawRing(cx, cy, R * 0.175, R * 0.495, DAY, A, 6, wedges);

    // center cap
    ctx.fillStyle = '#0B0D10';
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3A2E1E';
    ctx.lineWidth = Math.max(1, 1.6 * U);
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.15, 0, Math.PI * 2);
    ctx.stroke();

    // subtle vertical grain (the slit direction), clipped to the face
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.clip();
    ctx.strokeStyle = 'rgba(244,246,248,0.028)';
    ctx.lineWidth = 1;
    var step = Math.max(4, 6 * U);
    ctx.beginPath();
    for (var x = cx - R; x <= cx + R; x += step) {
      ctx.moveTo(x, cy - R);
      ctx.lineTo(x, cy + R);
    }
    ctx.stroke();
    ctx.restore();

    // amber current-time pointer: bright wedge + triangle at the top
    ctx.fillStyle = '#D8A24A';
    annularSector(cx, cy, R * 0.815, R * 0.975, -Math.PI / 2 - 0.006, -Math.PI / 2 + 0.006);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - R * 0.028, cy - R * 1.035);
    ctx.lineTo(cx + R * 0.028, cy - R * 1.035);
    ctx.lineTo(cx, cy - R * 0.985);
    ctx.closePath();
    ctx.fill();

    // bezel
    ctx.strokeStyle = '#3A2E1E';
    ctx.lineWidth = Math.max(1.5, R * 0.016);
    ctx.beginPath();
    ctx.arc(cx, cy, R + ctx.lineWidth * 0.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  // ---------- events ----------
  function pointerPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = pointerPos(e);
    dragging = true;
    dragStartX = p.x; dragStartY = p.y;
    scrubAtGrab = scrubOffset(pieceTime);
    scrubLive = scrubAtGrab;
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = pointerPos(e);
    var scale = DAY / Math.max(1, Math.min(W, H));   // full-width drag ~ full archive
    scrubLive = scrubAtGrab + (p.x - dragStartX) * scale * 0.6 + (p.y - dragStartY) * scale * 0.25;
    draw(pieceTime);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    releaseT = pieceTime;
    releaseScrub = scrubLive;
    // double-tap -> reseed the feed
    var p = pointerPos(e);
    var dt = pieceTime - lastTapT;
    var dx = p.x - lastTapX, dy = p.y - lastTapY;
    if (dt > 0 && dt < 0.35 && dx * dx + dy * dy < 1600) {
      reseeds++;
      seed = BASE_SEED + reseeds * 7919;
      buildBlobs();
      lastTapT = -10;
    } else {
      lastTapT = pieceTime; lastTapX = p.x; lastTapY = p.y;
    }
    draw(pieceTime);
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- run ----------
  fit();
  draw(T0);
  pieceTime = T0;

  if (typeof window !== 'undefined') {
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(pieceTime); });
    }
    window.addEventListener('resize', function () { fit(); draw(pieceTime); });
  }

  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    pieceTime = T0 + (now - startStamp) / 1000;
    draw(pieceTime);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(frame);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
