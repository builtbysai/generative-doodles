<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.343 Trinket Drape</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101314; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.343 Trinket Drape (myclayco).
// After their breakout trinket-dish cutters (2022-07-05) and
// the Tiered Ginkgo Leaf cutter (2023-04-23): a radial
// 12-petal profile draped into a shallow dish, seen top-down
// only, shaded in flat bands like a topographic map. The
// petal count is fixed at exactly 12, asserted. Shading is
// a heightfield h(r, theta) held as data: a shallow bowl
// drape, a petal sculpt that raises each fan and dips the
// grooves between them, and a ripple that lifts one petal
// after another in fixed index order. The field is
// thresholded into exactly 4 flat teal bands, asserted; no
// smooth shading, no gradients, no shadowBlur, no filters,
// no offscreen canvas. Everything is drawn directly each
// frame on one canvas as annular cells. The loop is 28s
// and seamless: the rotation is a theta offset completing
// exactly one whole turn per cycle, and the ripple phase
// advances exactly 2*pi per cycle, so the lift visits all
// 12 petals in order and returns to petal 1 at the seam.
// Watch-only: no interaction, no text, no chrome.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#101314', CREAM = '#F2EBD8';
// The 4 flat bands, low (basin) to high (rim).
var BANDS = ['#163E3D', '#1D5250', '#256664', '#2E7D7B'];
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;

// ---- the dish -------------------------------------------------
var CX = 640, CY = 450;          // centre in design space
var R0 = 372;                    // petal-tip radius
var PETALS = 12;                 // FIXED petal count, asserted
var SECTOR = Math.PI * 2 / PETALS;
var CYCLE = 28;                  // seconds, seamless
var TURNS = 1;                   // whole turns per cycle, asserted integer
if (PETALS !== 12) throw new Error('Trinket Drape needs exactly 12 petals');
if (BANDS.length !== 4) throw new Error('Trinket Drape needs exactly 4 bands');
if (TURNS !== Math.floor(TURNS)) throw new Error('rotation must complete whole turns per cycle');

// Height normalisation: h spans roughly 0..1.30; four equal
// thresholds across that range give the four bands.
var HMAX = 1.30;

// Petal shape helpers, in material angle tm (theta minus the
// rotation offset). lobe is 1 at a petal centre, 0 in the
// groove between petals; phi is the position 0..1 within
// one petal sector.
function lobe(tm) { return 0.5 + 0.5 * Math.cos(PETALS * tm); }
function petalPhi(tm) {
  var u = (tm / SECTOR) % 1;
  return u < 0 ? u + 1 : u;
}
// Outer radius of the petal profile at material angle tm:
// full radius at petal tips, pinched in the grooves, with a
// small ginkgo notch cut at the centre of each tip.
function rimRadius(tm) {
  var l = lobe(tm);
  var r = R0 * (0.905 + 0.095 * Math.pow(l, 1.3));
  var phi = petalPhi(tm);
  var d = (phi - 0.5) / 0.075;
  r -= R0 * 0.038 * Math.exp(-d * d);
  return r;
}
// The drape heightfield. u is r normalised by the local rim
// radius, so u = 1 is the petal edge everywhere.
function height(u, tm, wave) {
  var l = lobe(tm);
  var h = 0.12 + 0.88 * Math.pow(u, 2.1);              // shallow bowl drape
  h += 0.30 * (l - 0.5) * Math.pow(u, 1.4);             // petal sculpt: fans up, grooves down
  var lift = 0.5 + 0.5 * Math.cos(PETALS * tm - wave);  // travelling ripple wave
  h += 0.24 * Math.pow(u, 1.5) * lift;                  // one petal lifts after another
  return h;
}
function bandOf(h) {
  var b = Math.floor(h / HMAX * 4);
  return b < 0 ? 0 : (b > 3 ? 3 : b);
}

// Polar raster: annular cells, each filled with its band's
// flat colour. Cells overlap by a hair so no ground-colour
// seams open between neighbours. (Per-ring angular counts
// were tried and rejected: mismatched wedge grids between
// neighbouring rings opened hairline gaps across the whole
// field. The grid stays uniform.)
var NR = 92, NA = 264;           // radial x angular cells (22 per petal)
function drawDish(rot, wave) {
  var i, j;
  for (i = 0; i < NR; i++) {
    var u0 = i / NR, u1 = (i + 1) / NR;
    var umid = (u0 + u1) / 2;
    for (j = 0; j < NA; j++) {
      var a0 = (j / NA) * Math.PI * 2, a1 = ((j + 1) / NA) * Math.PI * 2;
      var am = (a0 + a1) / 2;
      var tm = am - rot;         // material angle of this screen cell
      var rr = rimRadius(tm);
      var r0 = u0 * rr, r1 = u1 * rr + 0.7;
      var b = bandOf(height(umid, tm, wave));
      ctx.fillStyle = BANDS[b];
      ctx.beginPath();
      ctx.arc(CX, CY, r1, a0, a1 + 0.004);
      ctx.arc(CX, CY, r0, a1 + 0.004, a0, true);
      ctx.closePath();
      ctx.fill();
    }
  }
  // Centre cap: one flat disc over the pole. The field is
  // uniformly the lowest band out to u = 0.4 or so, so a
  // flat disc at the centre band colour is true to the
  // data and keeps the converging polar cells from
  // shimmering at the pole.
  ctx.fillStyle = BANDS[bandOf(height(0, 0, wave))];
  ctx.beginPath();
  ctx.arc(CX, CY, R0 * 0.05, 0, Math.PI * 2);
  ctx.fill();
  // The petal edge line: the 12-petal profile stroked in cream.
  ctx.strokeStyle = CREAM;
  ctx.lineWidth = 2.6;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  var steps = 720, k, th, tm2, r2;
  for (k = 0; k <= steps; k++) {
    th = (k / steps) * Math.PI * 2;
    tm2 = th - rot;
    r2 = rimRadius(tm2);
    if (k === 0) ctx.moveTo(CX + r2 * Math.cos(th), CY + r2 * Math.sin(th));
    else ctx.lineTo(CX + r2 * Math.cos(th), CY + r2 * Math.sin(th));
  }
  ctx.stroke();
}

// ---- state -----------------------------------------------------
// Frame one starts developed: exactly 11s into the 28s
// cycle, dish mid-rotation with the ripple mid-travel.
// The first frame is drawn at this fixed phase, never from
// a wall clock, so a render of the script always lands on
// the same frame; the live loop then advances from the
// same anchor by elapsed time since load.
var T_OFFSET = 11;

function draw(t) {
  var ph = (t % CYCLE) / CYCLE;
  var rot = Math.PI * 2 * TURNS * ph;   // theta offset, whole turns per cycle
  var wave = Math.PI * 2 * ph;          // ripple phase, returns to petal 1 at the seam
  drawDish(rot, wave);
}

// ---- frame ------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Centred fit: the whole canvas takes the piece's own
  // near-black ground, then the design space is centred in it.
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  draw(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(T_OFFSET);
if (typeof requestAnimationFrame === 'function') {
  var loadMs = Date.now();
  var loop = function () {
    frame(T_OFFSET + (Date.now() - loadMs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
