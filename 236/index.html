<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.236 Cocktail Party</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101010; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.236 Cocktail Party (James Woodfill). After What If?, 1995,
// his junk electronics assemblage: five bare mechanisms sharing one
// dark room, drawn schematic, side view, with every mount, bolt,
// bracket and cord left exposed, because the rig is the composition.
// A pendulum bar swings on a seven second clock, a bulb bounces on
// its cord on eleven, a wheel rolls a rust circular track on
// thirteen, a fan vane whirls on seventeen, a metronome arm ticks
// on twenty three. The periods are incommensurate, so the five
// almost never agree; every few minutes they near align, everything
// swinging together for one beat, acknowledge one another, and
// drift apart again. A cocktail party for electronic nerds.
// Watch only, no interaction.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var BULB = '#FFF2CC', STEEL = '#8A8A8A', RUST = '#9A5B3C';
var GROUND = '#101010', SHADOW = '#050505';
var W = 0, H = 0, phone = false;
var T = 3.7, lastNow = -1; // frame one: every rig at its own scattered phase

function bolt(x, y, r) {
  ctx.fillStyle = STEEL;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = GROUND;
  ctx.beginPath(); ctx.arc(x, y, r * 0.45, 0, Math.PI * 2); ctx.fill();
}
function line(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var railY = H * 0.13, floorY = H * 0.87;
  var zw = W / 5;
  var u = Math.min(zw, floorY - railY);
  var zx = function (i) { return W * (i + 0.5) / 5; };
  var i;

  // floor and the flat shadow pools under each rig
  ctx.fillStyle = SHADOW;
  ctx.fillRect(0, floorY, W, H - floorY);
  for (i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.ellipse(zx(i), floorY + (H - floorY) * 0.34, zw * 0.32, (H - floorY) * 0.20, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // the mounting rail, with a bolt over each zone
  ctx.fillStyle = STEEL;
  ctx.fillRect(W * 0.03, railY, W * 0.94, Math.max(3, H * 0.006));
  for (i = 0; i < 5; i++) bolt(zx(i), railY + Math.max(3, H * 0.006) / 2, Math.max(2, u * 0.012));

  // ---- rig 1: pendulum bar, period 7 --------------------------------------
  (function () {
    var x = zx(0);
    var py = railY + u * 0.05;
    ctx.fillStyle = STEEL;
    ctx.fillRect(x - u * 0.03, railY, u * 0.06, u * 0.05); // bracket
    var L = Math.min((floorY - railY) * 0.36, x * 1.55); // swing never leaves the room
    var th = 0.62 * Math.sin(2 * Math.PI * T / 7 + 0.6);
    var bx = x + L * Math.sin(th), by = py + L * Math.cos(th);
    line(x, py, bx, by, Math.max(2.5, u * 0.014), STEEL);
    ctx.fillStyle = STEEL;
    ctx.beginPath(); ctx.arc(bx, by, u * 0.048, 0, Math.PI * 2); ctx.fill();
    bolt(x, py, Math.max(2, u * 0.014));
  })();

  // ---- rig 2: bulb bouncing on its cord, period 11 -------------------------
  (function () {
    var x = zx(1);
    var my = railY + Math.max(3, H * 0.006);
    ctx.fillStyle = STEEL;
    ctx.fillRect(x - u * 0.025, railY - u * 0.02, u * 0.05, u * 0.03); // ceiling mount
    var L = (floorY - railY) * 0.33 * (1 + 0.15 * Math.sin(2 * Math.PI * T / 11 + 2.0));
    var sway = 0.10 * Math.sin(2 * Math.PI * T / 11 + 2.7);
    var bx = x + Math.sin(sway) * L, by = my + Math.cos(sway) * L;
    var cxp = (x + bx) / 2 + u * 0.035 * Math.sin(2 * Math.PI * T / 11 + 2.0);
    var cyp = (my + by) / 2;
    ctx.strokeStyle = STEEL; ctx.lineWidth = Math.max(1.4, u * 0.006);
    ctx.beginPath(); ctx.moveTo(x, my); ctx.quadraticCurveTo(cxp, cyp, bx, by); ctx.stroke();
    var r = u * 0.052;
    ctx.fillStyle = STEEL;
    ctx.fillRect(bx - r * 0.42, by - r * 1.5, r * 0.84, r * 0.6); // socket
    ctx.fillStyle = BULB;
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
  })();

  // ---- rig 3: wheel rolling a circular track, period 13 --------------------
  (function () {
    var x = zx(2);
    var R = Math.min(zw * 0.33, u * 0.30);
    var cx = x, cy = floorY - R - u * 0.02;
    line(cx - R * 0.45, cy + R * 0.85, cx - R * 0.62, floorY, Math.max(1.6, u * 0.007), STEEL);
    line(cx + R * 0.45, cy + R * 0.85, cx + R * 0.62, floorY, Math.max(1.6, u * 0.007), STEEL);
    ctx.fillStyle = STEEL;
    ctx.fillRect(cx - R * 0.62 - u * 0.03, floorY - u * 0.012, u * 0.06, u * 0.012);
    ctx.fillRect(cx + R * 0.62 - u * 0.03, floorY - u * 0.012, u * 0.06, u * 0.012);
    ctx.strokeStyle = RUST; ctx.lineWidth = Math.max(3, u * 0.016);
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    for (var k = 0; k < 4; k++) {
      var a = k * Math.PI / 2 + 0.4;
      bolt(cx + R * Math.cos(a), cy + R * Math.sin(a), Math.max(1.6, u * 0.010));
    }
    var r = R * 0.30;
    var beta = 2 * Math.PI * T / 13;
    var wx = cx + (R - r) * Math.cos(beta), wy = cy + (R - r) * Math.sin(beta);
    var spin = -beta * (R - r) / r;
    ctx.fillStyle = GROUND;
    ctx.beginPath(); ctx.arc(wx, wy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = STEEL; ctx.lineWidth = Math.max(2, u * 0.009);
    ctx.beginPath(); ctx.arc(wx, wy, r, 0, Math.PI * 2); ctx.stroke();
    for (var s = 0; s < 3; s++) {
      var sa = spin + s * Math.PI * 2 / 3;
      line(wx, wy, wx + r * Math.cos(sa), wy + r * Math.sin(sa), Math.max(1.4, u * 0.006), STEEL);
    }
    bolt(wx, wy, Math.max(1.6, u * 0.010));
  })();

  // ---- rig 4: whirling fan vane, period 17 ----------------------------------
  (function () {
    var x = zx(3);
    var hubY = floorY - u * 0.58;
    var fr = u * 0.24;
    ctx.fillStyle = GROUND;
    ctx.strokeStyle = STEEL; ctx.lineWidth = Math.max(1.6, u * 0.007);
    ctx.beginPath();
    ctx.moveTo(x - u * 0.09, floorY); ctx.lineTo(x + u * 0.09, floorY);
    ctx.lineTo(x + u * 0.035, floorY - u * 0.05); ctx.lineTo(x - u * 0.035, floorY - u * 0.05);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    line(x, floorY - u * 0.05, x, hubY, Math.max(2.5, u * 0.012), STEEL);
    ctx.strokeStyle = STEEL; ctx.lineWidth = Math.max(1.2, u * 0.005);
    ctx.beginPath(); ctx.arc(x, hubY, fr, 0, Math.PI * 2); ctx.stroke(); // guard ring
    var alpha = 2 * Math.PI * T / 17;
    ctx.fillStyle = STEEL;
    for (var k = 0; k < 4; k++) {
      var a = alpha + k * Math.PI / 2;
      var dx = Math.cos(a), dy = Math.sin(a);
      var px = -dy, py = dx;
      ctx.beginPath();
      ctx.moveTo(x, hubY);
      ctx.quadraticCurveTo(x + dx * fr * 0.55 + px * fr * 0.20, hubY + dy * fr * 0.55 + py * fr * 0.20,
                           x + dx * fr * 0.92, hubY + dy * fr * 0.92);
      ctx.quadraticCurveTo(x + dx * fr * 0.55 - px * fr * 0.20, hubY + dy * fr * 0.55 - py * fr * 0.20,
                           x, hubY);
      ctx.fill();
    }
    bolt(x, hubY, Math.max(2, u * 0.014));
  })();

  // ---- rig 5: metronome arm, period 23 --------------------------------------
  (function () {
    var x = zx(4);
    var baseTop = floorY - u * 0.16;
    ctx.fillStyle = GROUND;
    ctx.strokeStyle = STEEL; ctx.lineWidth = Math.max(1.6, u * 0.007);
    ctx.beginPath();
    ctx.moveTo(x - u * 0.10, floorY); ctx.lineTo(x + u * 0.10, floorY);
    ctx.lineTo(x + u * 0.035, baseTop); ctx.lineTo(x - u * 0.035, baseTop);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    var pxv = x, pyv = baseTop + u * 0.01;
    var L = u * 0.56;
    var th = 0.50 * Math.sin(2 * Math.PI * T / 23 + 1.3);
    var tx = pxv + L * Math.sin(th), ty = pyv - L * Math.cos(th);
    line(pxv, pyv, pxv - (u * 0.07) * Math.sin(th), pyv + (u * 0.07) * Math.cos(th), Math.max(2, u * 0.009), STEEL);
    line(pxv, pyv, tx, ty, Math.max(2.5, u * 0.011), STEEL);
    // the sliding weight, a small block riding the arm
    var wx = pxv + L * 0.62 * Math.sin(th), wy = pyv - L * 0.62 * Math.cos(th);
    ctx.save();
    ctx.translate(wx, wy); ctx.rotate(th);
    ctx.fillStyle = STEEL;
    ctx.fillRect(-u * 0.030, -u * 0.016, u * 0.060, u * 0.032);
    ctx.restore();
    bolt(pxv, pyv, Math.max(2, u * 0.013));
  })();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
