<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volumes Artificiels II</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#000000';
var PLATE = '#f4fbff';
var INK = '#14141c';
var PHASE = 6;
/* A strange faceted volume turns slowly in blackness while three
   drifting lights crawl caustics across its faces. Frame one is at
   t = 6 s: the mesh is mid-turn, the lights are off their start
   positions, the caustics are already crawling. Watch-only: no
   pointer listeners anywhere in this piece. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function rgb(c) {
  return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
}
function rgba(c, a) {
  return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(4) + ')';
}
function mulberry32(seed) {

    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(1654);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;

    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }

  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {

}
/* ---- geometry: icosahedron, one subdivision, seeded radial
   displacement. The displacement is a smooth low-frequency field
   plus per-vertex jitter, so the mesh is irregular and strange,
   never a clean primitive. ---- */
function norm3(v) {
  var l = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
  return [v[0] / l, v[1] / l, v[2] / l];
}
function dispDir(d) {
  var th = Math.atan2(d[1], d[0]);
  var ph = Math.acos(clamp(d[2], -1, 1));
  return 0.17 * Math.sin(3 * th + 1.1) * Math.sin(2 * ph + 0.4)

       + 0.09 * Math.sin(4 * th - 3 * ph + 0.7);
}
var SQ5 = Math.sqrt(5);
var TG = (1 + SQ5) / 2;
var ICO_V = [
  [-1, TG, 0], [1, TG, 0], [-1, -TG, 0], [1, -TG, 0],
  [0, -1, TG], [0, 1, TG], [0, -1, -TG], [0, 1, -TG],
  [TG, 0, -1], [TG, 0, 1], [-TG, 0, -1], [-TG, 0, 1]
];
var ICO_F = [
  [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
  [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
  [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
  [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]

/* Vertices hold the displaced position (pre-scale) and the base
   radius used by the probe to prove irregularity. */
var verts = [];
var baseR = [];
var SCALE = [1.14, 0.88, 1.03];
function addVert(dir, jitterAmp, dispAmp) {
  var d = norm3(dir);
  var r = 1 + dispDir(d) * dispAmp + (rng() * 2 - 1) * jitterAmp;
  r = clamp(r, 0.68, 1.36);
  baseR.push(r);
  verts.push([d[0] * r * SCALE[0], d[1] * r * SCALE[1], d[2] * r * SCALE[2]]);
  return verts.length - 1;
}
var i;
for (i = 0; i < ICO_V.length; i++) addVert(ICO_V[i], 0.06, 1.0);
var midCache = {};
function midpoint(a, b) {
  var key = a < b ? a + '_' + b : b + '_' + a;
  if (midCache[key] !== undefined) return midCache[key];
  var va = verts[a], vb = verts[b];
  /* Midpoint direction from the unscaled unit sphere, so the
     displacement field stays coherent across the shared edge. */
  var ua = norm3([va[0] / SCALE[0], va[1] / SCALE[1], va[2] / SCALE[2]]);

}
var facets = [];
function sub3(a, b, c) {

  return [[a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]];
}
for (i = 0; i < ICO_F.length; i++) {
  var quads = sub3(ICO_F[i][0], ICO_F[i][1], ICO_F[i][2]);
  for (var q = 0; q < 4; q++) facets.push(quads[q]);

/* Static per-facet data: centroid, outward normal, caustic phase. */
var facetData = [];
function cross(u, v) {
  return [
    u[1] * v[2] - u[2] * v[1],
    u[2] * v[0] - u[0] * v[2],
    u[0] * v[1] - u[1] * v[0]

}
function dot(u, v) { return u[0] * v[0] + u[1] * v[1] + u[2] * v[2]; }
for (i = 0; i < facets.length; i++) {
  var f = facets[i];
  var va = verts[f[0]], vb = verts[f[1]], vc = verts[f[2]];
  var e1 = [vb[0] - va[0], vb[1] - va[1], vb[2] - va[2]];
  var e2 = [vc[0] - va[0], vc[1] - va[1], vc[2] - va[2]];
  var n = norm3(cross(e1, e2));
  var cen = [(va[0] + vb[0] + vc[0]) / 3, (va[1] + vb[1] + vc[1]) / 3, (va[2] + vb[2] + vc[2]) / 3];

  if (dot(n, cen) < 0) n = [-n[0], -n[1], -n[2]];

/* ---- lights: three point sources drifting on closed-form paths.
   Warm white, pale cyan, cool white. ---- */
var LIGHTS = [
  { col: [1.00, 0.93, 0.85], w: 0.55 },
  { col: [0.55, 0.85, 1.00], w: 1.00 },
  { col: [0.92, 0.95, 1.00], w: 0.90 }

function lightPos(li, t) {
  if (li === 0) return [2.6 * Math.cos(0.11 * t + 0.5), 1.5 * Math.sin(0.13 * t + 1.2), 2.0 + 0.9 * Math.sin(0.07 * t + 0.2)];
  if (li === 1) return [2.4 * Math.cos(0.09 * t + 2.6), 1.9 * Math.sin(0.075 * t + 0.3), -1.4 + 1.1 * Math.cos(0.10 * t + 2.0)];
  return [3.0 * Math.sin(0.05 * t + 4.0), 2.1 * Math.cos(0.06 * t + 0.8), 1.6 * Math.sin(0.08 * t + 1.9)];
}
/* ---- rotation: slow turn about Y with slight precession. ---- */
var ROT_RATE = 0.05;
var ROT0 = 0.35;
function angleAt(t) { return ROT0 + ROT_RATE * t; }
function tiltAt(t) { return 0.30 + 0.05 * Math.sin(0.021 * t + 1.0); }
function rotate(p, ang, tilt) {
  var ct = Math.cos(tilt), st = Math.sin(tilt);
  var y1 = p[1] * ct - p[2] * st, z1 = p[1] * st + p[2] * ct;
  var ca = Math.cos(ang), sa = Math.sin(ang);
  return [p[0] * ca + z1 * sa, y1, -p[0] * sa + z1 * ca];
}
var CAMZ = 4.6;
var lastStats = null;
function computeFrame(t) {
  var ang = angleAt(t), tilt = tiltAt(t);
  var S = isPhone ? VW * 0.68 : Math.min(VW, VH) * 0.52;
  var cx = VW / 2, cy = VH / 2;
  var rv = [], k;
  for (k = 0; k < verts.length; k++) rv.push(rotate(verts[k], ang, tilt));
  var lp = [lightPos(0, t), lightPos(1, t), lightPos(2, t)];
  var drawn = [];
  var sumB = 0, maxB = 0, glints = 0, sumCa = 0, bright = 0;
  for (k = 0; k < facetData.length; k++) {
    var fd = facetData[k];
    var n = rotate(fd.n, ang, tilt);
    var c = rotate(fd.cen, ang, tilt);
    var front = n[2] > 0;
    var ln = front ? n : [-n[0], -n[1], -n[2]];
    var br = 0.10, bg = 0.10, bb = 0.10, spec = 0;
    var V = norm3([0 - c[0], 0 - c[1], CAMZ - c[2]]);
    var li, L, d, fall, diff, R, s;
    for (li = 0; li < 3; li++) {
      L = [lp[li][0] - c[0], lp[li][1] - c[1], lp[li][2] - c[2]];
      d = Math.sqrt(L[0] * L[0] + L[1] * L[1] + L[2] * L[2]);
      L = [L[0] / d, L[1] / d, L[2] / d];
      fall = 1 / (1 + 0.10 * d * d);
      diff = Math.max(0, dot(ln, L));
      br += diff * fall * LIGHTS[li].col[0] * LIGHTS[li].w;
      bg += diff * fall * LIGHTS[li].col[1] * LIGHTS[li].w;
      bb += diff * fall * LIGHTS[li].col[2] * LIGHTS[li].w;
      var nd = dot(ln, L);
      R = [2 * nd * ln[0] - L[0], 2 * nd * ln[1] - L[1], 2 * nd * ln[2] - L[2]];

      spec += s * fall;

    /* Caustic band: a closed-form function of facet direction,
       light direction and time, so the bands crawl as the lights
       drift. It is computed from the light positions, not painted. */
    var cd = norm3(c);
    var ca = 0;
    for (li = 0; li < 3; li++) {
      var ld = norm3(lp[li]);
      ca += Math.pow(Math.max(0, Math.sin(4.0 * dot(cd, ld) + 0.30 * t + fd.phase)), 10) * 0.8;
    }
    ca = clamp(ca, 0, 1);
    var sb = (br + bg + bb) / 3;
    sumB += sb;
    if (sb > maxB) maxB = sb;
    sumCa += ca;
    if (ca > 0.60 || spec > 0.5) glints++;
    if (sb > 0.55) bright++;

    for (var v = 0; v < 3; v++) {
      var p = rv[fd.idx[v]];
      var f = CAMZ / (CAMZ - p[2]);
      pts.push([cx + p[0] * S * f, cy + p[1] * S * f]);
    }
    var zAvg = (rv[fd.idx[0]][2] + rv[fd.idx[1]][2] + rv[fd.idx[2]][2]) / 3;
    drawn.push({
      pts: pts, z: zAvg, front: front, k: k,
      r: clamp(6 + 205 * clamp(br, 0, 1) + 170 * spec, 0, 255),
      g: clamp(8 + 225 * clamp(bg, 0, 1) + 170 * spec, 0, 255),
      b: clamp(15 + 245 * clamp(bb, 0, 1) + 170 * spec, 0, 255),
      sb: sb, spec: spec, ca: ca

  }
  drawn.sort(function (a, b) { return a.z - b.z; });
  lastStats = {
    facets: drawn.length,
    meanB: sumB / drawn.length,
    maxB: maxB,
    meanCa: sumCa / drawn.length,
    glints: glints,
    brightFacets: bright,
    b0: drawn[0] ? drawn[0].sb : 0,
    facet0sb: (function () {
      for (var q = 0; q < drawn.length; q++) if (drawn[q].k === 0) return drawn[q].sb;
      return 0;
    })()
  };
  return { S: S, drawn: drawn };
}
function drawDisc(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
}
function traceFacet(pts, dx, dy) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0] + dx, pts[0][1] + dy);
  ctx.lineTo(pts[1][0] + dx, pts[1][1] + dy);
  ctx.lineTo(pts[2][0] + dx, pts[2][1] + dy);
  ctx.closePath();
}
function drawGlow(S) {
  var cx = VW / 2, cy = VH / 2;
  try {
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, S * 1.15);
    g.addColorStop(0, 'rgba(28,52,88,0.20)');
    g.addColorStop(0.6, 'rgba(16,30,54,0.08)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
  } catch (e) {
    /* Glow is atmosphere only; the piece stands without it. */
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Volumes Artificiels II').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Volumes Artificiels II').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 23').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba([20, 20, 28], 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Volumes Artificiels II', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba([20, 20, 28], 0.8);
  ctx.fillText('2006 · 07 · 23', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba([20, 20, 28], 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);

    ctx.lineWidth = 1;

    var cy = (d.pts[0][1] + d.pts[1][1] + d.pts[2][1]) / 3;

      var col = (d.k % 2 === 0) ? [165, 232, 255] : [255, 238, 214];

</script>
</body>
