<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remake This</title>
<style>
  html, body { margin: 0; padding: 0; background: #020203; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var TAU = Math.PI * 2;
  var COL = {
    black: "#020203",
    a: "#1E4D5C",
    b: "#E8DCC8",
    c: "#B8B2A6",
    d: "#4D7A99"
  };
  var SCRUB_SECONDS = 16;   // seconds of phase across one full-width scrub drag
  var RATE_MIN = -2, RATE_MAX = 2;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, PHONE = false;

  function detectPhone(w, h) {
    var sw = 0, sh = 0;
    if (typeof window !== "undefined" && window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
    return h > w * 1.15; // aspect fallback only when screen size is unavailable
  }

  function resize() {
    var w = 0, h = 0;
    if (typeof window !== "undefined" && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    }
    if (!w || !h) {
      w = (typeof window !== "undefined" && window.innerWidth) || 300;
      h = (typeof window !== "undefined" && window.innerHeight) || 300;
    }
    W = w; H = h;
    PHONE = detectPhone(w, h);
    var dpr = 1;
    if (typeof window !== "undefined" && window.devicePixelRatio) {
      dpr = clamp(window.devicePixelRatio, 1, 2);
    }
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(nowSec());
  }

  // ---------- clock (elapsed seconds; frame one is t = 0, drawn synchronously) ----------
  var startStamp = null;
  function nowSec() {
    if (typeof performance !== "undefined" && performance && typeof performance.now === "function") {
      var n = performance.now() / 1000;
      if (startStamp === null) startStamp = n;
      return n - startStamp;
    }
    return 0;
  }

  // ---------- stems ----------
  // Each stem owns a list of rate segments {t, rate, phase}. Its playhead at
  // time t is the closed-form integral of those segments: no accumulation,
  // no frame stepping, so any frame is a pure function of recorded events.
  function makeStem() {
    return {
      segs: [{ t: 0, rate: 1, phase: 0 }],
      muted: false,
      frozen: false,
      dragPhase: null
    };
  }
  var stems = { a: makeStem(), b: makeStem(), c: makeStem(), d: makeStem() };
  var ORDER = ["a", "b", "c", "d"];

  function phaseAt(stem, t) {
    var s = stem.segs[0];
    for (var i = stem.segs.length - 1; i >= 0; i--) {
      if (stem.segs[i].t <= t) { s = stem.segs[i]; break; }
    }
    return s.phase + s.rate * (t - s.t);
  }
  function currentRate(stem, t) {
    var s = stem.segs[0];
    for (var i = stem.segs.length - 1; i >= 0; i--) {
      if (stem.segs[i].t <= t) { s = stem.segs[i]; break; }
    }
    return s.rate;
  }
  function pushSeg(stem, t, rate) {
    stem.segs.push({ t: t, rate: rate, phase: phaseAt(stem, t) });
  }
  function stemPhase(key, t) {
    var st = stems[key];
    if (st.dragPhase !== null) return st.dragPhase;
    return phaseAt(st, t);
  }

  // ---------- seeded grain field (stem C data) ----------
  var grain = [];
  (function buildGrain() {
    var rnd = mulberry32(86829);
    var n = 240;
    for (var i = 0; i < n; i++) {
      grain.push({
        x: rnd(), y: rnd(),
        drift: 0.004 + rnd() * 0.014,      // fraction of width per second of phase
        len: 1 + rnd() * 3,
        tw: rnd() * TAU,
        dash: rnd() < 0.4
      });
    }
  })();

  // ---------- stem painters (each a pure function of its own playhead) ----------
  function drawTerrain(p) {
    ctx.strokeStyle = COL.a;
    ctx.lineWidth = 1.4;
    var k, x, y;
    for (k = 0; k < 6; k++) {
      var baseY = H * (0.46 + k * 0.082);
      ctx.globalAlpha = 0.30 + k * 0.11;
      ctx.beginPath();
      for (x = 0; x <= W; x += 7) {
        y = baseY
          + Math.sin(x * 0.008 + p * 0.35 + k * 1.7) * 10
          + Math.sin(x * 0.021 - p * 0.22 + k * 0.9) * 6
          + Math.sin(x * 0.0035 + p * 0.10 + k * 0.5) * 13;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // soft body under the front ridge
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = COL.a;
    ctx.beginPath();
    var baseF = H * (0.46 + 5 * 0.082);
    for (x = 0; x <= W; x += 7) {
      y = baseF
        + Math.sin(x * 0.008 + p * 0.35 + 5 * 1.7) * 10
        + Math.sin(x * 0.021 - p * 0.22 + 5 * 0.9) * 6
        + Math.sin(x * 0.0035 + p * 0.10 + 5 * 0.5) * 13;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawMurmur(p) {
    ctx.strokeStyle = COL.b;
    ctx.lineCap = "round";
    var s, x, y;
    // faint companion strand
    ctx.globalAlpha = 0.22;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (s = 0; s <= 1.0001; s += 0.01) {
      x = s * W;
      y = H * 0.44
        + Math.sin(s * 5.1 + p * 0.60 + 0.9) * H * 0.10
        + Math.sin(s * 11.3 - p * 0.43 + 0.4) * H * 0.045
        + Math.sin(s * 2.2 + p * 0.21) * H * 0.06 + 14;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // main thread
    ctx.globalAlpha = 0.88;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (s = 0; s <= 1.0001; s += 0.01) {
      x = s * W;
      y = H * 0.42
        + Math.sin(s * 5.1 + p * 0.60) * H * 0.10
        + Math.sin(s * 11.3 - p * 0.43) * H * 0.045
        + Math.sin(s * 2.2 + p * 0.21) * H * 0.06;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // breathing head travelling along the thread
    var hs = ((p * 0.03) % 1 + 1) % 1;
    var hx = hs * W;
    var hy = H * 0.42
      + Math.sin(hs * 5.1 + p * 0.60) * H * 0.10
      + Math.sin(hs * 11.3 - p * 0.43) * H * 0.045
      + Math.sin(hs * 2.2 + p * 0.21) * H * 0.06;
    var hr = 3 + 1.6 * Math.sin(p * 1.7);
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = COL.b;
    ctx.beginPath(); ctx.arc(hx, hy, hr + 4, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.arc(hx, hy, Math.max(1.4, hr), 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawGrain(p) {
    ctx.fillStyle = COL.c;
    ctx.strokeStyle = COL.c;
    var i, g, x, y;
    for (i = 0; i < grain.length; i++) {
      g = grain[i];
      x = (((g.x + p * g.drift) % 1) + 1) % 1 * W;
      y = g.y * H + Math.sin(p * 0.35 + g.tw) * 3;
      ctx.globalAlpha = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(p * 0.8 + g.tw * 3));
      if (g.dash) {
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + g.len + 2, y); ctx.stroke();
      } else {
        ctx.fillRect(x, y, g.len, g.len * 0.7);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawPulse(p) {
    var gap = PHONE ? 54 : 64;
    var cols = Math.max(2, Math.floor(W / gap));
    var rows = Math.max(2, Math.floor(H / gap));
    var ox = (W - (cols - 1) * gap) / 2;
    var oy = (H - (rows - 1) * gap) / 2;
    ctx.fillStyle = COL.d;
    var cx, cy, wave, r;
    for (cy = 0; cy < rows; cy++) {
      for (cx = 0; cx < cols; cx++) {
        wave = 0.5 + 0.5 * Math.sin(p * 2.2 - (cx + cy) * 0.55);
        r = 1.1 + 3.1 * wave * wave;
        ctx.globalAlpha = 0.10 + 0.42 * wave;
        ctx.beginPath();
        ctx.arc(ox + cx * gap, oy + cy * gap, r, 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  var PAINTERS = { a: drawTerrain, b: drawMurmur, c: drawGrain, d: drawPulse };
  var STRIP_OF = { a: "left", b: "top", c: "right", d: "bottom" };

  function drawStrips() {
    var sw = 10;
    var i, key, st, side;
    for (i = 0; i < ORDER.length; i++) {
      key = ORDER[i]; st = stems[key]; side = STRIP_OF[key];
      ctx.globalAlpha = st.muted ? 0.22 : 0.95;
      ctx.fillStyle = COL[key];
      if (side === "left") ctx.fillRect(0, 0, sw, H);
      else if (side === "right") ctx.fillRect(W - sw, 0, sw, H);
      else if (side === "top") ctx.fillRect(0, 0, W, sw);
      else ctx.fillRect(0, H - sw, W, sw);
      if (st.frozen) {
        // notch: a black cut across the middle of the strip, with a thin
        // stem-coloured tick at its centre
        ctx.globalAlpha = 1;
        ctx.fillStyle = COL.black;
        if (side === "left") ctx.fillRect(0, H / 2 - 14, sw, 28);
        else if (side === "right") ctx.fillRect(W - sw, H / 2 - 14, sw, 28);
        else if (side === "top") ctx.fillRect(W / 2 - 14, 0, 28, sw);
        else ctx.fillRect(W / 2 - 14, H - sw, 28, sw);
        ctx.fillStyle = COL[key];
        if (side === "left" || side === "right") {
          var nx = side === "left" ? 0 : W - sw;
          ctx.fillRect(nx, H / 2 - 1.5, sw, 3);
        } else {
          var ny = side === "top" ? 0 : H - sw;
          ctx.fillRect(W / 2 - 1.5, ny, 3, sw);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    if (!W || !H) return;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.fillStyle = COL.black;
    ctx.fillRect(0, 0, W, H);
    var i, key;
    for (i = 0; i < ORDER.length; i++) {
      key = ORDER[i];
      if (stems[key].muted) continue;
      PAINTERS[key](stemPhase(key, t));
    }
    drawStrips();
    audioSync(t);
  }

  // ---------- audio (lazy, guarded, silent where unavailable) ----------
  var AC = null, aNodes = null, audioFrame = 0;
  function ensureAudio() {
    if (AC || aNodes === false) return;
    var Ctor = null;
    if (typeof AudioContext !== "undefined") Ctor = AudioContext;
    else if (typeof window !== "undefined" && window.webkitAudioContext) Ctor = window.webkitAudioContext;
    if (!Ctor) { aNodes = false; return; }
    try {
      AC = new Ctor();
      var master = AC.createGain();
      master.gain.value = 0.9;
      master.connect(AC.destination);
      var out = {};

      // A: low drone
      var oA = AC.createOscillator(); oA.type = "sawtooth"; oA.frequency.value = 48;
      var fA = AC.createBiquadFilter(); fA.type = "lowpass"; fA.frequency.value = 220;
      var gA = AC.createGain(); gA.gain.value = 0;
      oA.connect(fA); fA.connect(gA); gA.connect(master); oA.start();
      out.a = { osc: oA, gain: gA, base: 0.045 };

      // B: soft breath tone with a slow LFO swell
      var oB = AC.createOscillator(); oB.type = "sine"; oB.frequency.value = 196;
      var gB = AC.createGain(); gB.gain.value = 0;
      var lfoB = AC.createOscillator(); lfoB.type = "sine"; lfoB.frequency.value = 0.13;
      var lfoBGain = AC.createGain(); lfoBGain.gain.value = 0.012;
      lfoB.connect(lfoBGain); lfoBGain.connect(gB.gain);
      oB.connect(gB); gB.connect(master); oB.start(); lfoB.start();
      out.b = { osc: oB, gain: gB, base: 0.020 };

      // C: filtered noise bed
      var len = 2 * AC.sampleRate;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var data = buf.getChannelData(0);
      var rnd = mulberry32(46802);
      for (var i = 0; i < len; i++) data[i] = rnd() * 2 - 1;
      var srcC = AC.createBufferSource(); srcC.buffer = buf; srcC.loop = true;
      var fC = AC.createBiquadFilter(); fC.type = "bandpass"; fC.frequency.value = 900; fC.Q.value = 0.6;
      var gC = AC.createGain(); gC.gain.value = 0;
      srcC.connect(fC); fC.connect(gC); gC.connect(master); srcC.start();
      out.c = { src: srcC, gain: gC, base: 0.016 };

      // D: soft pulses (sine gated by a slow LFO)
      var oD = AC.createOscillator(); oD.type = "sine"; oD.frequency.value = 98;
      var gD = AC.createGain(); gD.gain.value = 0;
      var lfoD = AC.createOscillator(); lfoD.type = "sine"; lfoD.frequency.value = 1.6;
      var lfoDGain = AC.createGain(); lfoDGain.gain.value = 0.010;
      lfoD.connect(lfoDGain); lfoDGain.connect(gD.gain);
      oD.connect(gD); gD.connect(master); oD.start(); lfoD.start();
      out.d = { osc: oD, gain: gD, base: 0.010, lfo: lfoD };

      aNodes = out;
    } catch (e) {
      AC = null; aNodes = false;
    }
  }

  function audioSync(t) {
    if (!AC || !aNodes) return;
    audioFrame++;
    if (audioFrame % 20 !== 0) return;
    try {
      if (AC.state === "suspended" && typeof AC.resume === "function") AC.resume();
      var ct = AC.currentTime;
      for (var i = 0; i < ORDER.length; i++) {
        var key = ORDER[i], st = stems[key], node = aNodes[key];
        if (!node) continue;
        var target = (st.muted || st.frozen) ? 0 : node.base;
        node.gain.gain.setTargetAtTime(target, ct, 0.15);
        var rate = st.dragPhase !== null ? dragRate : currentRate(st, t);
        var mag = clamp(Math.abs(rate), 0.25, 2);
        if (key === "a" && node.osc) node.osc.frequency.setTargetAtTime(48 * mag, ct, 0.2);
        if (key === "b" && node.osc) node.osc.frequency.setTargetAtTime(196 * (0.75 + 0.25 * mag), ct, 0.2);
        if (key === "c" && node.src) node.src.playbackRate.setTargetAtTime(mag, ct, 0.2);
        if (key === "d" && node.lfo) node.lfo.frequency.setTargetAtTime(1.6 * mag, ct, 0.2);
      }
    } catch (e) { /* audio is decoration here; never break the picture */ }
  }

  // ---------- interaction: the edge-strip mixing desk ----------
  function hitStrip(x, y) {
    var hit = PHONE ? 28 : 24;
    var best = null, bestD = Infinity;
    var cand = [
      { key: "a", d: x },
      { key: "b", d: y },
      { key: "c", d: W - x },
      { key: "d", d: H - y }
    ];
    for (var i = 0; i < cand.length; i++) {
      if (cand[i].d <= hit && cand[i].d < bestD) { best = cand[i].key; bestD = cand[i].d; }
    }
    return best;
  }

  var drag = null;      // active strip drag state
  var dragRate = 1;     // last estimated scrub rate (for audio while dragging)
  var downInfo = null;  // pointerdown record for tap detection
  var lastTap = { key: null, t: -10 };

  function pointerPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (typeof e.clientX === "number" ? e.clientX : 0) - r.left;
    var y = (typeof e.clientY === "number" ? e.clientY : 0) - r.top;
    return { x: x, y: y };
  }

  function onDown(e) {
    ensureAudio();
    var t = nowSec();
    var pos = pointerPos(e);
    var key = hitStrip(pos.x, pos.y);
    downInfo = { key: key, x: pos.x, y: pos.y, t: t, moved: false };
    if (!key) return;
    var st = stems[key];
    drag = {
      key: key,
      startX: pos.x,
      startPhase: phaseAt(st, t),
      samples: [{ t: t, phase: phaseAt(st, t) }],
      active: false
    };
    dragRate = currentRate(st, t);
    if (e.preventDefault) e.preventDefault();
  }

  function onMove(e) {
    if (!downInfo) return;
    var pos = pointerPos(e);
    if (Math.abs(pos.x - downInfo.x) + Math.abs(pos.y - downInfo.y) > 8) downInfo.moved = true;
    if (!drag) return;
    var t = nowSec();
    var st = stems[drag.key];
    var newPhase = drag.startPhase + (pos.x - drag.startX) / Math.max(1, W) * SCRUB_SECONDS;
    if (!drag.active && Math.abs(pos.x - drag.startX) > 8) {
      drag.active = true;
      if (st.frozen) { st.frozen = false; } // taking hold of a frozen stem releases it
    }
    if (drag.active) {
      st.dragPhase = newPhase;
      drag.samples.push({ t: t, phase: newPhase });
      if (drag.samples.length > 40) drag.samples.shift();
      var n = drag.samples.length;
      if (n >= 2) {
        var a = drag.samples[0], b = drag.samples[n - 1];
        // instantaneous estimate from the most recent pair
        var p1 = drag.samples[n - 2], p2 = drag.samples[n - 1];
        if (p2.t - p1.t > 0.005) {
          dragRate = clamp((p2.phase - p1.phase) / (p2.t - p1.t), RATE_MIN, RATE_MAX);
        }
        void a; void b;
      }
    }
  }

  function releaseRate(samples) {
    // slope across the last 0.3 s of scrub samples
    if (!samples || samples.length < 2) return 0;
    var last = samples[samples.length - 1];
    var first = samples[0];
    for (var i = samples.length - 1; i >= 0; i--) {
      if (last.t - samples[i].t <= 0.3) first = samples[i]; else break;
    }
    var dt = last.t - first.t;
    if (dt < 0.03) return 0;
    return clamp((last.phase - first.phase) / dt, RATE_MIN, RATE_MAX);
  }

  function handleTap(key, t) {
    var st = stems[key];
    if (lastTap.key === key && t - lastTap.t <= 0.35) {
      // double tap: undo the mute toggle from the first tap, toggle freeze
      st.muted = !st.muted;
      if (st.frozen) {
        st.frozen = false;
        pushSeg(st, t, 1);
      } else {
        st.frozen = true;
        pushSeg(st, t, 0);
      }
      lastTap = { key: null, t: -10 };
    } else {
      st.muted = !st.muted;
      lastTap = { key: key, t: t };
    }
  }

  function onUp(e) {
    var t = nowSec();
    if (drag && drag.active) {
      var st = stems[drag.key];
      var rate = releaseRate(drag.samples);
      var finalPhase = st.dragPhase;
      st.dragPhase = null;
      st.segs.push({ t: t, rate: rate, phase: finalPhase });
      drag = null;
      downInfo = null;
      draw(t);
      return;
    }
    var wasTap = false, tapKey = null;
    if (downInfo && downInfo.key && !downInfo.moved && t - downInfo.t <= 0.45) {
      wasTap = true; tapKey = downInfo.key;
    }
    drag = null;
    downInfo = null;
    if (wasTap) handleTap(tapKey, t);
    draw(t);
  }

  if (canvas.addEventListener) {
    canvas.addEventListener("pointerdown", onDown);
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
  }
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("resize", resize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener("resize", resize);
    }
  }

  // ---------- run ----------
  resize();
  draw(0); // frame one: the default arrangement, synchronously at t = 0
  function loop() {
    draw(nowSec());
    if (typeof requestAnimationFrame === "function") requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(loop);
})();
</script>
</body>
</html>
