<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№10 · Bloom</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0c10; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(238,240,244,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.85); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another bloom</div>
<script>
'use strict';
// No10 Bloom.
// Four hundred nodes scattered in three gaussian clusters, and one
// rule: any two nodes closer than a threshold are joined by a
// hairline. Nothing is drawn between clusters unless the rule reaches
// there, so the web is dense inside each bloom and nearly empty
// between them. Nodes near a cluster center take a slight tint from
// that cluster (pale gold, pale cyan, pale rose); the rest are white.
// Drawn once, static: a system that looks organic but is pure rule
// (brief concept 10, bloom network).

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '10', 10) || 10;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0a0c10';
const TINTS = ['#ffd9a0', '#a8e2e8', '#f2b8c6'];

function gauss(rnd) {
  return (rnd() + rnd() + rnd() + rnd() - 2) / 2;   // approx normal, -1..1
}

function compose(s) {
  const rnd = mulberry32(s);
  const centers = [];
  for (let c = 0; c < 3; c++) {
    centers.push({ x: 0.22 + rnd() * 0.56, y: 0.22 + rnd() * 0.56, spread: 0.085 + rnd() * 0.05 });
  }
  const nodes = [];
  for (let i = 0; i < 400; i++) {
    const c = centers[i % 3];
    nodes.push({
      x: Math.max(0.015, Math.min(0.985, c.x + gauss(rnd) * c.spread * 1.7)),
      y: Math.max(0.015, Math.min(0.985, c.y + gauss(rnd) * c.spread * 1.7)),
      cluster: i % 3
    });
  }
  const TH = 0.088;
  let edges = 0;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      if (Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y) < TH) edges++;
    }
  }
  return { centers, nodes, TH, edges, ok: edges > 500 && edges < 2800 };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best || Math.abs(p.edges - 1400) < Math.abs(best.edges - 1400)) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;
  const THpx = p.TH * Math.min(RX, RY) * (Math.max(RX, RY) / Math.min(RX, RY) > 1.6 ? 1.3 : 1);

  ctx.strokeStyle = 'rgba(238,240,244,0.16)';
  ctx.lineWidth = Math.max(0.6, Math.min(RX, RY) / 1100);
  ctx.beginPath();
  for (let i = 0; i < p.nodes.length; i++) {
    const a = p.nodes[i];
    for (let j = i + 1; j < p.nodes.length; j++) {
      const b = p.nodes[j];
      const dx = (a.x - b.x) * RX, dy = (a.y - b.y) * RY;
      if (Math.hypot(dx, dy) < THpx) {
        ctx.moveTo(ox + a.x * RX, oy + a.y * RY);
        ctx.lineTo(ox + b.x * RX, oy + b.y * RY);
      }
    }
  }
  ctx.stroke();

  for (const nd of p.nodes) {
    const c = p.centers[nd.cluster];
    const near = Math.hypot(nd.x - c.x, nd.y - c.y) < c.spread * 0.9;
    ctx.fillStyle = near ? TINTS[nd.cluster] : '#eef0f4';
    ctx.globalAlpha = near ? 0.95 : 0.8;
    ctx.beginPath();
    ctx.arc(ox + nd.x * RX, oy + nd.y * RY, Math.max(0.8, Math.min(RX, RY) / 480), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
