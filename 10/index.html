<!DOCTYPE html>
<html lang="utf-8">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No10 · Drift</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0d0b14; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(242,234,216,0.38); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for a new current</div>
<script>
'use strict';
// No10 Drift.
// A living flow field: 350 capsules ride three slow-orbiting vortex
// attractors, laying stitched trails in neon on near-black. The vortices
// breathe on Lissajous paths, so the current never repeats exactly.
// Click for a new current.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '10', 10) || 10;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0d0b14';
const PALETTE = ['#ff2e88', '#ffb020', '#38e1ff', '#f2ead8'];

let W = 0, H = 0, S = 0;
let vortices = [];
let parts = [];
let t = 0;

function compose(s) {
  const rnd = mulberry32(s);
  vortices = [];
  const nv = 3;
  for (let i = 0; i < nv; i++) {
    vortices.push({
      // base position as share of S, orbit radii, speeds, phase
      bx: 0.28 + rnd() * 0.44,
      by: 0.28 + rnd() * 0.44,
      ox: 0.10 + rnd() * 0.14,
      oy: 0.10 + rnd() * 0.14,
      sx: 0.11 + rnd() * 0.13,
      sy: 0.11 + rnd() * 0.13,
      px: rnd() * Math.PI * 2,
      py: rnd() * Math.PI * 2,
      str: (0.9 + rnd() * 1.1) * (rnd() < 0.5 ? -1 : 1),
      reach: 0.55 + rnd() * 0.45,
    });
  }
  parts = [];
  const n = 350;
  for (let i = 0; i < n; i++) {
    parts.push({
      x: rnd(), y: rnd(),
      sp: 0.0016 + rnd() * 0.0032,
      col: PALETTE[(rnd() * PALETTE.length) | 0],
      len: 0.010 + rnd() * 0.022,
      w: 1 + (rnd() < 0.18 ? 1 : 0),
    });
  }
}

function fieldAngle(x, y, tt) {
  // x,y in 0..1 shares. Sum of vortex swirls + a slow global curl.
  let ax = 0, ay = 0;
  for (const v of vortices) {
    const vx = v.bx + Math.cos(tt * v.sx + v.px) * v.ox;
    const vy = v.by + Math.sin(tt * v.sy + v.py) * v.oy;
    const dx = x - vx, dy = y - vy;
    const d2 = dx * dx + dy * dy + 1e-4;
    const fall = Math.exp(-d2 / (v.reach * v.reach));
    // perpendicular swirl, strength by falloff and sign
    const inv = v.str * fall / Math.sqrt(d2);
    ax += -dy * inv;
    ay += dx * inv;
  }
  // gentle background drift so nothing ever stalls
  ax += 0.35 + 0.25 * Math.sin(y * 5.1 + tt * 0.23);
  ay += 0.25 * Math.cos(x * 4.3 - tt * 0.19);
  return Math.atan2(ay, ax);
}

function step(dt) {
  t += dt;
  for (const p of parts) {
    const a = fieldAngle(p.x, p.y, t);
    p.x += Math.cos(a) * p.sp * dt * 60;
    p.y += Math.sin(a) * p.sp * dt * 60;
    // wrap
    if (p.x < -0.05) p.x += 1.1; else if (p.x > 1.05) p.x -= 1.1;
    if (p.y < -0.05) p.y += 1.1; else if (p.y > 1.05) p.y -= 1.1;
    p.a = a;
  }
}

function drawFrame() {
  // fade instead of clear: trails
  ctx.fillStyle = 'rgba(13,11,20,0.055)';
  ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round';
  for (const p of parts) {
    const px = p.x * W, py = p.y * H;
    const dx = Math.cos(p.a) * p.len * S;
    const dy = Math.sin(p.a) * p.len * S;
    ctx.strokeStyle = p.col;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = p.w;
    ctx.beginPath();
    ctx.moveTo(px - dx / 2, py - dy / 2);
    ctx.lineTo(px + dx / 2, py + dy / 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function sizeCanvas() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = w; H = h; S = Math.min(w, h);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  // solid ground on resize
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
}

let last = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
  last = now;
  step(dt);
  drawFrame();
  requestAnimationFrame(frame);
}

function start() {
  sizeCanvas();
  compose(seed);
  // pre-roll so the first visible frame already has trails
  for (let i = 0; i < 90; i++) step(1 / 60);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 90; i++) { step(1 / 60); drawFrame(); }
  last = performance.now();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', () => { sizeCanvas(); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { sizeCanvas(); });
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  t = 0;
  compose(seed);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 90; i++) { step(1 / 60); drawFrame(); }
});
start();
</script>
</body>
</html>
