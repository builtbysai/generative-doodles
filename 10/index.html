<!DOCTYPE html>
<html lang="utf-8">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No10 · Impression</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f5f1e4; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(43,58,103,0.38); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for a new impression</div>
<script>
'use strict';
// No10 Impression.
// A halftone dot field on cream: each dot's radius follows a radial cosine
// falloff from a seeded off-center origin, so the field reads as a single
// pressed weight in the paper. A second, weaker lobe interferes with the
// first, carving a shallow valley between them. One indigo ink; the dots
// carry a whisper of seeded jitter so the field feels plotted, not stamped.
// The seed chooses both lobe positions, the ellipse tilt, and the jitter;
// click for another.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '10', 10) || 10;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f5f1e4';
const INK = '#2b3a67';

function compose(s) {
  const rnd = mulberry32(s);
  // Primary lobe: off-center, never dead middle.
  const ox = 0.30 + rnd() * 0.40;
  const oy = 0.30 + rnd() * 0.40;
  // Elliptical falloff: seeded squash and tilt keep it from reading as a bullseye.
  const squash = 0.62 + rnd() * 0.30;
  const tilt = rnd() * Math.PI;
  // Second lobe: weaker, placed to carve an interference valley.
  const ang = rnd() * Math.PI * 2;
  const dist = 0.28 + rnd() * 0.22;
  const ox2 = Math.min(0.88, Math.max(0.12, ox + Math.cos(ang) * dist));
  const oy2 = Math.min(0.88, Math.max(0.12, oy + Math.sin(ang) * dist));
  const strength2 = 0.28 + rnd() * 0.22;
  // Per-dot jitter for a plotted feel.
  const jitter = 0.10 + rnd() * 0.12;
  return { ox, oy, squash, tilt, ox2, oy2, strength2, jitter, rndState: s };
}

function renderPiece(c, W, H, p) {
  c.fillStyle = GROUND;
  c.fillRect(0, 0, W, H);

  const rnd = mulberry32(p.rndState ^ 0x9e3779b9);
  // Field piece: the dot field runs full-bleed edge to edge on every screen.
  const gap = Math.max(11, Math.min(W, H) / 46);
  const maxR = gap * 0.46;
  const cosT = Math.cos(p.tilt), sinT = Math.sin(p.tilt);
  // Falloff radius in normalized units; dots beyond read as paper.
  const R = 0.62;

  c.fillStyle = INK;
  for (let gy = gap / 2; gy < H + gap / 2; gy += gap) {
    for (let gx = gap / 2; gx < W + gap / 2; gx += gap) {
      const nx = gx / W, ny = gy / H;
      // Primary lobe, elliptical.
      let dx = nx - p.ox, dy = ny - p.oy;
      const ex = dx * cosT + dy * sinT;
      const ey = (-dx * sinT + dy * cosT) / p.squash;
      const d1 = Math.sqrt(ex * ex + ey * ey) / R;
      // Second lobe, circular.
      const d2 = Math.sqrt((nx - p.ox2) * (nx - p.ox2) + (ny - p.oy2) * (ny - p.oy2)) / R;
      let v = 0;
      if (d1 < 1) v += 0.5 + 0.5 * Math.cos(d1 * Math.PI);
      if (d2 < 1) v += p.strength2 * (0.5 + 0.5 * Math.cos(d2 * Math.PI));
      v = Math.min(1, v);
      if (v <= 0.02) continue;
      const r = maxR * (0.12 + 0.88 * v);
      const jx = (rnd() - 0.5) * gap * p.jitter;
      const jy = (rnd() - 0.5) * gap * p.jitter;
      c.beginPath();
      c.arc(gx + jx, gy + jy, r, 0, Math.PI * 2);
      c.fill();
    }
  }
}

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  const p = compose(seed);
  renderPiece(ctx, w, h, p);
}

window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  draw();
});
draw();
</script>
</body>
</html>
