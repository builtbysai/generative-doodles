<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№617 Sche-ima Pressing</title>
<style>
  html, body { margin: 0; padding: 0; background: #f8f6ef; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Sche-ima Pressing, TC7 / PP1205, study #255 tom-challenger.
  // A small print shop: hand-drawn tape sleeves on grid paper,
  // a red pen circling a gig on a listings sheet, the Scratches
  // dog cover being inked. The press bench sits at center, a
  // stack of finished sleeves rests to one side, and each new
  // print hangs to dry on a line above the bench. Tap the press
  // to pull a print: each tap inks a new sleeve variant from the
  // generative drawing set. A tap is a printing pull, never a
  // reseed; the press never reloads, it just keeps printing.
  // The documentation is the artwork.
  var PAPER = '#f8f6ef';   // grid-paper white
  var GRID = '#ddd6c2';    // grid lines
  var INK = '#1c1a17';     // ink black
  var RED = '#d9261c';     // red pen
  var MAGENTA = '#d63384'; // magenta, the dog cover
  var TAPE_OR = '#e8702a'; // tape orange
  var TAPE_BL = '#2b6fd8'; // tape blue
  var TAPE_RD = '#d9261c'; // tape red
  var BENCH = '#c9b48f';   // bench wood, pale
  var BENCH_DK = '#a98f66';// bench wood, dark
  var STEEL = '#5c5648';   // press metal
  var STEEL_LT = '#8a8270';// press metal, light

  // Fixed-phase first frame: FIRST_T = 4 s. At t = 4 the press
  // has already printed before: two sleeves sit in the finished
  // stack, one sleeve hangs drying on the line, the roller rests
  // on the platen, and the line sways gently.
  var FIRST_T = 4;
  var SEED = 1958;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load,
  // ?pull=<n> applies n settled pulls at load (press center tap),
  // ?tap=x,y applies one settled pull at that tap position,
  // ?seed= varies the texture seed. Read at load only.
  var seedParam = 0, probeT = null, probePulls = 0, probeTap = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m;
    m = qs.match(/[?&]seed=(-?\d+)/); if (m) { seedParam = parseInt(m[1], 10) || 0; }
    var mt = qs.match(/[?&]t=([0-9.]+)/); if (mt) { probeT = parseFloat(mt[1]); }
    var mp = qs.match(/[?&]pull=(\d+)/); if (mp) { probePulls = parseInt(mp[1], 10) || 0; }
    var mk = qs.match(/[?&]tap=([0-9.]+),([0-9.]+)/);
    if (mk) { probeTap = { x: parseFloat(mk[1]), y: parseFloat(mk[2]) }; }
  } catch (e) {}
  var FIELD_SEED = seedParam ? (SEED + seedParam * 101) : SEED;

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and a fixed salt, so every frame is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Sleeve variants: 6 line-network designs x 4 accent palettes
  // = 24 distinct sleeve variants. The title word follows the
  // design; the tape color follows the variant id.
  var ACCENTS = [MAGENTA, RED, TAPE_BL, TAPE_OR];
  var TAPES = [TAPE_OR, TAPE_RD, TAPE_BL];
  var WORDS = ['SCRATCHES', 'DOG', 'SCHEMA', 'PRESS', 'GIG', 'INK'];
  function variantFor(id) {
    return { design: id % 6, accent: ACCENTS[Math.floor(id / 6) % 4], id: id };
  }
  // The opening hanging sleeve and the two stack sleeves are
  // fixed variants, so frame one already reads as a shop mid-run.
  var OPEN_HANG = variantFor(4);   // zigzag bands, magenta
  var OPEN_STACK = [variantFor(11), variantFor(18)];

  // State. pulls is the list of pulls, each { variant, t0, x, y }.
  // Nothing else changes except through a pull, so frame one is a
  // pure function of FIRST_T and the fixed opening state.
  var pulls = [];
  var PULL_LEN = 1.4; // seconds: ink roll, pull, hang
  var lastT = FIRST_T;

  // A pull: the tap position picks the variant. The press face is
  // split into zones, so different tap positions print different
  // variants; the pull count advances the sequence too, so the
  // same spot twice still prints a fresh variant.
  function pullPrint(nx, ny) {
    var zoneX = Math.min(2, Math.max(0, Math.floor(nx * 3)));
    var zoneY = Math.min(1, Math.max(0, Math.floor(ny * 2)));
    var id = (pulls.length * 5 + zoneX + zoneY * 3 + 7) % 24;
    pulls.push({ variant: variantFor(id), t0: lastT, x: nx, y: ny });
    return pulls[pulls.length - 1];
  }
  function completedPulls(t) {
    var n = 0, i;
    for (i = 0; i < pulls.length; i++) {
      if (t - pulls[i].t0 >= PULL_LEN) { n++; }
    }
    return n;
  }
  function activePull(t) {
    var i;
    for (i = pulls.length - 1; i >= 0; i--) {
      if (t - pulls[i].t0 < PULL_LEN) { return pulls[i]; }
    }
    return null;
  }
  function stackCount(t) { return 2 + completedPulls(t); }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    // Bench: table top across the middle, legs below.
    L.benchY0 = H * 0.56; L.benchY1 = H * 0.60;
    L.benchX0 = W * 0.06; L.benchX1 = W * 0.94;
    // Press: centered a little left of center, standing on the bench.
    L.pressCX = W * 0.46;
    L.pressBaseY = L.benchY0;
    L.pressW = 0.34 * u; L.pressH = 0.30 * u;
    L.pressX0 = L.pressCX - L.pressW / 2; L.pressX1 = L.pressCX + L.pressW / 2;
    L.pressY0 = L.pressBaseY - L.pressH; L.pressY1 = L.pressBaseY;
    // Platen: the flat plate under the beam where the sleeve is inked.
    L.platenW = L.pressW * 0.62; L.platenH = L.pressH * 0.16;
    L.platenX = L.pressCX - L.platenW / 2; L.platenY = L.pressY1 - L.platenH - L.pressH * 0.10;
    // Drying line: a string across the upper right, with a slight sag.
    // The pegs sit clear of the press (right edge 0.63W) and of the
    // lever, which angles up to the left.
    L.lineY = H * 0.13;
    L.lineX0 = W * 0.60; L.lineX1 = W * 0.97;
    // Hanging pegs along the line: the opening sleeve at peg 1,
    // the newest completed pull at peg 2.
    L.peg1 = { x: W * 0.74, y: L.lineY };
    L.peg2 = { x: W * 0.92, y: L.lineY };
    // Finished stack: left side, leaning sleeves.
    L.stackX = W * 0.08; L.stackY = H * 0.42;
    L.stackW = 0.20 * u; L.stackH = 0.20 * u;
    // Listings sheet: small paper on the bench, right of the press.
    L.listX = W * 0.68; L.listY = L.benchY0 - 0.085 * u;
    L.listW = 0.13 * u; L.listH = 0.085 * u;
    // Sleeve size for the press and the line.
    L.slW = 0.15 * u; L.slH = 0.15 * u;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function lerp(a, b, f) { return a + (b - a) * f; }
  function ease(f) { return f * f * (3 - 2 * f); }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Grid paper: pale ground with a light square grid and a
  // faint red margin line down the left, all fixed and seeded.
  function drawPaper() {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    var step = Math.max(18, L.u * 0.045);
    ctx.strokeStyle = hexA(GRID, a4(0.8));
    ctx.lineWidth = 1;
    var x, y;
    for (x = step; x < W; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (y = step; y < H; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.strokeStyle = hexA(RED, a4(0.35));
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(W * 0.045, 0); ctx.lineTo(W * 0.045, H); ctx.stroke();
  }

  // A hand-drawn wobbly line between two points, seeded by salt.
  function wobblyLine(x0, y0, x1, y1, salt, steps) {
    var rng = mulberry32(FIELD_SEED * 101 + salt);
    var i, f, x, y;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    for (i = 1; i < steps; i++) {
      f = i / steps;
      x = lerp(x0, x1, f) + (rng() - 0.5) * 3;
      y = lerp(y0, y1, f) + (rng() - 0.5) * 3;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  // One sleeve: a white square with a wobbly ink border, a tape
  // strip across the top, a bold title word, and one of six
  // hand-wobbled line-network designs in ink and the accent.
  // Drawn with its top-left at (x, y), side s, tilt in radians.
  function drawSleeve(x, y, s, variant, tilt) {
    var cx = x + s / 2, cy = y + s / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt || 0);
    ctx.translate(-cx, -cy);
    // Soft shadow.
    ctx.fillStyle = hexA(INK, a4(0.18));
    ctx.fillRect(x + 4, y + 5, s, s);
    // Sleeve paper.
    ctx.fillStyle = '#fdfcf6';
    ctx.fillRect(x, y, s, s);
    // Tape strip across the top, torn ends.
    var tape = TAPES[variant.id % 3];
    ctx.fillStyle = hexA(tape, a4(0.85));
    ctx.beginPath();
    ctx.moveTo(x + s * 0.08, y - 2);
    ctx.lineTo(x + s * 0.92, y - 2);
    ctx.lineTo(x + s * 0.88, y + s * 0.09);
    ctx.lineTo(x + s * 0.12, y + s * 0.09);
    ctx.closePath();
    ctx.fill();
    // Wobbly ink border, drawn twice with a slight offset.
    ctx.strokeStyle = hexA(INK, a4(0.9));
    ctx.lineWidth = 2;
    wobblyLine(x, y, x + s, y, 400 + variant.id, 8);
    wobblyLine(x + s, y, x + s, y + s, 401 + variant.id, 8);
    wobblyLine(x + s, y + s, x, y + s, 402 + variant.id, 8);
    wobblyLine(x, y + s, x, y, 403 + variant.id, 8);
    drawNetwork(x, y, s, variant);
    // Bold title word along the bottom.
    var fs = Math.round(s * 0.13);
    ctx.fillStyle = variant.accent;
    ctx.font = '700 ' + fs + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(WORDS[variant.design], x + s / 2, y + s * 0.94);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  // The six line-network designs, all hand-wobbled, never clean
  // vector. The drawing area is the sleeve minus the tape and
  // title bands.
  function drawNetwork(x, y, s, variant) {
    var ax = x + s * 0.10, ay = y + s * 0.14;
    var aw = s * 0.80, ah = s * 0.66;
    var rng = mulberry32(FIELD_SEED * 37 + variant.id * 97 + 5);
    var i, j;
    var ac = variant.accent;
    if (variant.design === 0) {
      // Radial fan from the bottom-left corner.
      for (i = 0; i < 9; i++) {
        var ang = (i / 8) * Math.PI / 2;
        ctx.strokeStyle = hexA(i % 3 === 0 ? ac : INK, a4(0.85));
        ctx.lineWidth = i % 3 === 0 ? 2.5 : 1.5;
        wobblyLine(ax, ay + ah, ax + Math.cos(ang) * aw, ay + ah - Math.sin(ang) * ah, 500 + variant.id * 10 + i, 5);
      }
    } else if (variant.design === 1) {
      // Grid scribble: a wobbly 4x4 lattice.
      ctx.strokeStyle = hexA(INK, a4(0.8));
      ctx.lineWidth = 1.5;
      for (i = 0; i <= 4; i++) {
        wobblyLine(ax + (aw / 4) * i, ay, ax + (aw / 4) * i, ay + ah, 510 + variant.id * 10 + i, 6);
        wobblyLine(ax, ay + (ah / 4) * i, ax + aw, ay + (ah / 4) * i, 520 + variant.id * 10 + i, 6);
      }
      ctx.fillStyle = hexA(ac, a4(0.9));
      for (i = 0; i < 5; i++) {
        var dx = ax + rng() * aw, dy = ay + rng() * ah;
        ctx.beginPath(); ctx.moveTo(dx + 3, dy); ctx.arc(dx, dy, 3, 0, Math.PI * 2); ctx.fill();
      }
    } else if (variant.design === 2) {
      // Concentric arcs around a corner.
      for (i = 1; i <= 6; i++) {
        var r = (aw / 6) * i;
        ctx.strokeStyle = hexA(i % 2 === 0 ? ac : INK, a4(0.85));
        ctx.lineWidth = i % 2 === 0 ? 2.5 : 1.5;
        ctx.beginPath();
        ctx.moveTo(ax + r, ay + ah);
        ctx.arc(ax, ay + ah, r, -Math.PI / 2, 0);
        ctx.stroke();
      }
    } else if (variant.design === 3) {
      // Zigzag bands.
      for (j = 0; j < 4; j++) {
        var by = ay + (ah / 4) * j;
        ctx.strokeStyle = hexA(j % 2 === 0 ? ac : INK, a4(0.85));
        ctx.lineWidth = j % 2 === 0 ? 3 : 1.5;
        ctx.beginPath();
        ctx.moveTo(ax, by + ah / 8);
        for (i = 1; i <= 8; i++) {
          var zx = ax + (aw / 8) * i;
          var zy = by + ((i % 2 === 0) ? ah / 8 : -ah / 8) + (rng() - 0.5) * 2;
          ctx.lineTo(zx, zy);
        }
        ctx.stroke();
      }
    } else if (variant.design === 4) {
      // Dot field joined by lines, a constellation.
      var pts = [];
      for (i = 0; i < 12; i++) {
        pts.push([ax + rng() * aw, ay + rng() * ah]);
      }
      ctx.strokeStyle = hexA(INK, a4(0.6));
      ctx.lineWidth = 1.2;
      for (i = 0; i < 11; i++) {
        wobblyLine(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], 530 + variant.id * 10 + i, 3);
      }
      for (i = 0; i < 12; i++) {
        ctx.fillStyle = hexA(i % 4 === 0 ? ac : INK, a4(0.9));
        ctx.beginPath(); ctx.moveTo(pts[i][0] + 3.5, pts[i][1]); ctx.arc(pts[i][0], pts[i][1], 3.5, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      // Bold bars: alternating ink and accent stripes.
      for (i = 0; i < 5; i++) {
        ctx.fillStyle = hexA(i % 2 === 0 ? INK : ac, a4(0.85));
        var bx = ax + (aw / 5) * i;
        var bw = (aw / 5) * (0.55 + rng() * 0.2);
        ctx.fillRect(bx, ay + (rng() - 0.5) * 2, bw, ah);
      }
    }
  }

  // The bench: a pale wood table top with legs, drawn under the
  // press and the listings sheet.
  function drawBench() {
    ctx.fillStyle = BENCH;
    ctx.fillRect(L.benchX0, L.benchY0, L.benchX1 - L.benchX0, L.benchY1 - L.benchY0);
    ctx.fillStyle = hexA(BENCH_DK, a4(0.7));
    ctx.fillRect(L.benchX0, L.benchY1 - 3, L.benchX1 - L.benchX0, 3);
    ctx.fillStyle = BENCH_DK;
    var legBot = isPhone ? L.benchY1 + H * 0.16 : H;
    ctx.fillRect(L.benchX0 + 8, L.benchY1, 10, legBot - L.benchY1);
    ctx.fillRect(L.benchX1 - 18, L.benchY1, 10, legBot - L.benchY1);
    // Grain strokes on the bench top.
    var rng = mulberry32(FIELD_SEED * 3 + 11);
    ctx.strokeStyle = hexA(BENCH_DK, a4(0.35));
    ctx.lineWidth = 1;
    var i;
    for (i = 0; i < 5; i++) {
      var gy = L.benchY0 + 3 + rng() * (L.benchY1 - L.benchY0 - 6);
      ctx.beginPath(); ctx.moveTo(L.benchX0 + 4, gy); ctx.lineTo(L.benchX1 - 4, gy + (rng() - 0.5) * 3); ctx.stroke();
    }
  }

  // The press: a hand press on the bench, base plate, two posts,
  // a top beam, a platen, and a long lever arm with a handle
  // knob. The ink roller rests on the platen and sweeps across
  // it while a pull is in its ink-roll phase.
  function drawPress(t, active) {
    var u = L.u;
    // Base plate.
    ctx.fillStyle = STEEL;
    ctx.fillRect(L.pressX0, L.pressY1 - u * 0.02, L.pressW, u * 0.02);
    // Posts.
    ctx.fillRect(L.pressX0 + u * 0.015, L.pressY0 + u * 0.03, u * 0.018, L.pressH - u * 0.05);
    ctx.fillRect(L.pressX1 - u * 0.033, L.pressY0 + u * 0.03, u * 0.018, L.pressH - u * 0.05);
    // Top beam.
    ctx.fillStyle = STEEL_LT;
    ctx.fillRect(L.pressX0, L.pressY0, L.pressW, u * 0.035);
    // Platen.
    ctx.fillStyle = '#3a352c';
    ctx.fillRect(L.platenX, L.platenY, L.platenW, L.platenH);
    ctx.strokeStyle = hexA(INK, a4(0.6));
    ctx.lineWidth = 1.5;
    ctx.strokeRect(L.platenX, L.platenY, L.platenW, L.platenH);
    // Screw column from beam to platen.
    ctx.fillStyle = STEEL;
    ctx.fillRect(L.pressCX - u * 0.012, L.pressY0 + u * 0.035, u * 0.024, L.platenY - L.pressY0 - u * 0.035);
    // Lever arm, angled up to the left; it dips while a pull runs.
    var dip = 0;
    if (active) {
      var p = clamp((t - active.t0) / PULL_LEN, 0, 1);
      dip = Math.sin(p * Math.PI) * 0.10;
    }
    var lx0 = L.pressCX - u * 0.02, ly0 = L.pressY0 + u * 0.05;
    var lx1 = L.pressCX - u * 0.24, ly1 = L.pressY0 - u * 0.06 + dip * u;
    ctx.strokeStyle = STEEL;
    ctx.lineWidth = u * 0.016;
    ctx.beginPath(); ctx.moveTo(lx0, ly0); ctx.lineTo(lx1, ly1); ctx.stroke();
    // Handle knob.
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.moveTo(lx1 + 7, ly1); ctx.arc(lx1, ly1, 7, 0, Math.PI * 2); ctx.fill();
    // Ink roller: a cylinder that rests on the platen and sweeps
    // across it during the ink-roll phase of a pull.
    var rollX = L.platenX + L.platenW * 0.5;
    if (active) {
      var rp = clamp((t - active.t0) / (PULL_LEN * 0.35), 0, 1);
      rollX = lerp(L.platenX + 6, L.platenX + L.platenW - 6, ease(rp));
    }
    var ry = L.platenY - u * 0.012;
    ctx.fillStyle = INK;
    ctx.fillRect(rollX - u * 0.035, ry - u * 0.010, u * 0.07, u * 0.020);
    ctx.fillStyle = hexA(MAGENTA, a4(0.8));
    ctx.fillRect(rollX - u * 0.035, ry - u * 0.010, u * 0.07, u * 0.006);
  }

  // The listings sheet: a small paper on the bench with scribbled
  // gig lines, one of them circled in red pen.
  function drawListings() {
    var x = L.listX, y = L.listY, w = L.listW, h = L.listH;
    ctx.fillStyle = '#fdfcf6';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = hexA(INK, a4(0.5));
    ctx.lineWidth = 1;
    var rng = mulberry32(FIELD_SEED * 41 + 7);
    var i;
    for (i = 0; i < 4; i++) {
      var ly = y + h * (0.2 + i * 0.2);
      wobblyLine(x + w * 0.08, ly, x + w * (0.55 + rng() * 0.35), ly, 600 + i, 3);
    }
    // Red pen circle around the third gig.
    var cy = y + h * 0.6;
    ctx.strokeStyle = RED;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(x + w * 0.5, cy, w * 0.42, h * 0.17, -0.08, 0, Math.PI * 2);
    ctx.stroke();
    // A small red arrow pointing at the circle.
    ctx.beginPath();
    ctx.moveTo(x + w * 0.95, cy - h * 0.1);
    ctx.lineTo(x + w * 1.12, cy - h * 0.28);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + w * 1.12, cy - h * 0.28);
    ctx.lineTo(x + w * 1.05, cy - h * 0.22);
    ctx.moveTo(x + w * 1.12, cy - h * 0.28);
    ctx.lineTo(x + w * 1.06, cy - h * 0.34);
    ctx.stroke();
  }

  // The finished stack: the two opening sleeves plus one sleeve
  // per completed pull beyond the line, leaning against each
  // other on the left of the bench.
  function drawStack(t) {
    var n = Math.min(2 + completedPulls(t), 5);
    var i;
    for (i = 0; i < n; i++) {
      var v = (i < 2) ? OPEN_STACK[i] : pulls[i - 2].variant;
      var tilt = (i % 2 === 0 ? -0.07 : 0.06) + (i - 1) * 0.015;
      drawSleeve(L.stackX + (i % 2) * 8, L.stackY - i * 10, L.stackW, v, tilt);
    }
  }

  // The drying line: a string with a slight sag, pegs, and the
  // sleeves hanging from it. The opening sleeve always hangs at
  // peg 1; the newest completed pull hangs at peg 2, and older
  // pulls join the finished stack, so the line never overflows.
  function drawLine(t) {
    ctx.strokeStyle = hexA(INK, a4(0.7));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(L.lineX0, L.lineY);
    ctx.quadraticCurveTo((L.lineX0 + L.lineX1) / 2, L.lineY + 6, L.lineX1, L.lineY);
    ctx.stroke();
    // Opening sleeve at peg 1.
    drawHanging(L.peg1, OPEN_HANG, t, 0);
    // Newest completed pull hangs at peg 2.
    var done = [];
    var i;
    for (i = 0; i < pulls.length; i++) {
      if (t - pulls[i].t0 >= PULL_LEN) { done.push(pulls[i]); }
    }
    if (done.length > 0) {
      drawHanging(L.peg2, done[done.length - 1].variant, t, 1);
    }
  }
  function drawHanging(peg, variant, t, slot) {
    var s = L.slW;
    var sway = Math.sin(t * 0.6 + slot * 1.3) * 0.02;
    var x = peg.x - s / 2, y = peg.y + 2;
    // Peg: a small tape tab over the sleeve top.
    drawSleeve(x, y, s, variant, sway);
    ctx.fillStyle = hexA(TAPE_BL, a4(0.9));
    ctx.fillRect(peg.x - 6, peg.y - 2, 12, 10);
  }

  // The sleeve being printed: it rides the pull animation.
  // Phase 1, ink roll: the sleeve sits under the platen, just a
  // corner peeking out. Phase 2, pull: it slides out to the right
  // and down onto the bench. Phase 3, hang: it rises to the
  // drying line and settles onto the next peg.
  function drawActivePull(t, active) {
    var p = clamp((t - active.t0) / PULL_LEN, 0, 1);
    var s = L.slW;
    var x, y, tilt = 0;
    if (p < 0.35) {
      var f1 = ease(p / 0.35);
      x = L.platenX + L.platenW / 2 - s / 2 - s * 0.08 * f1;
      y = L.platenY - s * 0.55;
      tilt = 0.02 * f1;
    } else if (p < 0.7) {
      var f2 = ease((p - 0.35) / 0.35);
      x = lerp(L.platenX + L.platenW / 2 - s / 2, L.pressCX + L.pressW * 0.28, f2);
      y = lerp(L.platenY - s * 0.55, L.benchY0 - s * 0.28, f2);
      tilt = lerp(0.02, -0.06, f2);
    } else {
      var f3 = ease((p - 0.7) / 0.3);
      var peg = L.peg2;
      x = lerp(L.pressCX + L.pressW * 0.28, peg.x - s / 2, f3);
      y = lerp(L.benchY0 - s * 0.28, peg.y + 2, f3);
      tilt = lerp(-0.06, Math.sin(t * 0.6 + 1.3) * 0.02, f3);
    }
    drawSleeve(x, y, s, active.variant, tilt);
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    var active = activePull(t);

    drawPaper();
    drawLine(t);
    drawBench();
    drawListings();
    drawStack(t);
    drawPress(t, active);
    if (active) { drawActivePull(t, active); }

    // ---- Plates: title top-left, number and date below it, the
    // stack counter and a short descriptor top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Sche-ima Pressing', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.8);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№617 · 2007 · 05 · 23', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(INK, 0.65);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('the documentation is the artwork', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.fillStyle = hexA(INK, 0.8);
    ctx.font = fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Prints pulled: ' + stackCount(t), W - 18, 18 + fsTitle * 0.8 + fsSmall + 8 + fsSmall + 6);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom on a white pill so it
    // stays legible over the grid paper.
    var hint = 'Tap the press to pull a print.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA('#ffffff', a4(0.92));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(INK, a4(0.5));
    ctx.lineWidth = 1;
    ctx.strokeRect(px, py, pw, ph);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  function perfT() { return lastT; }

  function onPress(nx, ny) {
    var px = nx * W, py = ny * H;
    return px >= L.pressX0 - 10 && px <= L.pressX1 + 10 &&
           py >= L.pressY0 - 30 && py <= L.pressY1 + 10;
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      var rect = { left: 0, top: 0 };
      try { rect = canvas.getBoundingClientRect(); } catch (err) {}
      var nx = (e.clientX - rect.left) / W;
      var ny = (e.clientY - rect.top) / H;
      if (!onPress(nx, ny)) { return; }
      if (activePull(perfT())) { return; } // the press is busy mid-pull
      pullPrint(nx, ny);
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      draw(reduced ? FIRST_T : perfT());
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1958 exposes the pull, the stack count, the
  // completed pulls, and the last pulled variant.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1958 = {
      pull: pullPrint,
      stackCount: stackCount,
      completedPulls: completedPulls,
      lastVariant: function () { return pulls.length ? pulls[pulls.length - 1].variant.id : null; },
      pullCount: function () { return pulls.length; },
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  // Apply the ?pull= and ?tap= hooks after resize(), before the
  // first frame. Load-time pulls are settled: their t0 sits 2 s
  // before FIRST_T, so the sleeves already hang and the counter
  // already counts them.
  var i;
  for (i = 0; i < probePulls; i++) {
    var pv = pullPrint(0.56, 0.45);
    pv.t0 = FIRST_T - 2 - i * 0.01;
  }
  if (probeTap) {
    var tv = pullPrint(probeTap.x, probeTap.y);
    tv.t0 = FIRST_T - 2;
  }
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the drying line sways at about 0.1 Hz and the
  // hanging sleeves sway with it, all well under the 14 Hz
  // ceiling. Guarded so node-canvas QA (no requestAnimationFrame)
  // still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
