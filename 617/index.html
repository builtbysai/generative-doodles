<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Body, Many Materials</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #14100C; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (strict) ----------
  var GROUND   = '#14100C';
  var SNAKE    = '#1C1A16';
  var SNAKE_HI = '#2E2A23'; // scale edge, snakeskin tone family
  var SNAKE_MD = '#26231E';
  var DARK_BASE= '#100E0B'; // tail snakeskin, darker register
  var DARK_HI  = '#221F1A';
  var SUN      = '#E8B93B'; // sunflower gold
  var FEATHER  = '#C98A2E'; // feather gold
  var FEATHER_D= '#A87424'; // gold scale shadow, feather-gold tone family
  var CORAL    = '#E2725B';
  var CORAL_D  = '#C85A45'; // coral dot shadow, coral tone family
  var CREAM    = '#F0E6D2';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vw = W, vh = H;
    if (typeof window !== 'undefined') {
      if (window.visualViewport) {
        vw = window.visualViewport.width;
        vh = window.visualViewport.height;
      } else {
        vw = window.innerWidth;
        vh = window.innerHeight;
      }
    }
    W = Math.max(50, Math.floor(vw));
    H = Math.max(50, Math.floor(vh));
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
  }

  if (typeof window !== 'undefined') {
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  }
  resize();

  // ---------- serpent definition ----------
  // Control points in unit space (x right, y down). Tail lower-left, head upper-right.
  var CTRL = [
    [0.060, 0.860],
    [0.260, 0.660],
    [0.480, 0.740],
    [0.680, 0.520],
    [0.550, 0.280],
    [0.700, 0.150],
    [0.880, 0.100]
  ];

  var BASE_SEED = 617075;
  var segCounter = 1;              // segmentation seed 1 at frame one
  var bandTexSeed = [1, 1, 1, 1, 1, 1]; // per-band texture seeds
  var bandBounds = [];             // arc-length fractions, length 7

  function computeBounds(counter) {
    var rng = mulberry32(BASE_SEED * 31 + counter * 977);
    var raw = [], i, sum = 0;
    for (i = 0; i < 6; i++) {
      raw.push(0.45 + rng() * 1.15); // uneven, never regular
      sum += raw[i];
    }
    var b = [0], acc = 0;
    for (i = 0; i < 6; i++) { acc += raw[i] / sum; b.push(acc); }
    b[6] = 1;
    return b;
  }
  bandBounds = computeBounds(segCounter);

  // Centerline sampling: Chaikin corner-cutting over the control polyline.
  // (Uniform Catmull-Rom overshoots wildly on a zigzag S; Chaikin cannot.)
  function sampleCenterline() {
    var pts = [], i;
    for (i = 0; i < CTRL.length; i++) pts.push([CTRL[i][0], CTRL[i][1]]);
    for (var iter = 0; iter < 6; iter++) {
      var next = [pts[0]];
      for (i = 0; i < pts.length - 1; i++) {
        var a = pts[i], b = pts[i + 1];
        next.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
        next.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
      }
      next.push(pts[pts.length - 1]);
      pts = next;
    }
    return pts;
  }

  // Build the animated centerline for a given undulation phase.
  function buildSpine(phase) {
    var pts = sampleCenterline(), i;
    // to pixels + undulation offset perpendicular to local direction
    var px = [], cum = [0], total = 0;
    for (i = 0; i < pts.length; i++) px.push([pts[i][0] * W, pts[i][1] * H]);
    for (i = 1; i < px.length; i++) {
      var dx = px[i][0] - px[i - 1][0], dy = px[i][1] - px[i - 1][1];
      total += Math.sqrt(dx * dx + dy * dy);
      cum.push(total);
    }
    var unit = Math.min(W, H);
    var amp = unit * 0.016;
    var out = [];
    for (i = 0; i < px.length; i++) {
      var s = total > 0 ? cum[i] / total : 0;
      var a = Math.min(i + 1, px.length - 1), b = Math.max(i - 1, 0);
      var tx = px[a][0] - px[b][0], ty = px[a][1] - px[b][1];
      var tl = Math.sqrt(tx * tx + ty * ty) || 1;
      var nx = -ty / tl, ny = tx / tl;
      var off = Math.sin(phase + s * 5.2) * amp * Math.sin(Math.PI * Math.min(1, s * 1.06));
      out.push({ x: px[i][0] + nx * off, y: px[i][1] + ny * off, s: s, nx: nx, ny: ny, tx: tx / tl, ty: ty / tl });
    }
    return { pts: out, total: total };
  }

  function halfWidth(s) {
    var unit = Math.min(W, H);
    var base = unit * (isPhone() ? 0.047 : 0.040);
    // thin tail, full body, gentle taper into the neck
    var grow = Math.min(1, s / 0.16);
    grow = grow * grow * (3 - 2 * grow);
    var neck = s > 0.93 ? 1 - (s - 0.93) / 0.07 * 0.38 : 1;
    return base * (0.22 + 0.78 * grow) * neck;
  }

  function bandIndexAt(s) {
    for (var i = 0; i < 6; i++) if (s < bandBounds[i + 1]) return i;
    return 5;
  }

  function ribbonPath(spine, s0, s1) {
    var pts = spine.pts, i;
    ctx.beginPath();
    var started = false;
    for (i = 0; i < pts.length; i++) {
      if (pts[i].s < s0 || pts[i].s > s1) continue;
      var hw = halfWidth(pts[i].s);
      var x = pts[i].x + pts[i].nx * hw, y = pts[i].y + pts[i].ny * hw;
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    }
    for (i = pts.length - 1; i >= 0; i--) {
      if (pts[i].s < s0 || pts[i].s > s1) continue;
      var hw2 = halfWidth(pts[i].s);
      ctx.lineTo(pts[i].x - pts[i].nx * hw2, pts[i].y - pts[i].ny * hw2);
    }
    ctx.closePath();
  }

  function spinePoint(spine, s) {
    var pts = spine.pts;
    for (var i = 1; i < pts.length; i++) {
      if (pts[i].s >= s) {
        var p0 = pts[i - 1], p1 = pts[i];
        var f = (s - p0.s) / Math.max(1e-6, p1.s - p0.s);
        return {
          x: p0.x + (p1.x - p0.x) * f, y: p0.y + (p1.y - p0.y) * f,
          nx: p0.nx + (p1.nx - p0.nx) * f, ny: p0.ny + (p1.ny - p0.ny) * f,
          tx: p0.tx + (p1.tx - p0.tx) * f, ty: p0.ty + (p1.ty - p0.ty) * f
        };
      }
    }
    var last = pts[pts.length - 1];
    return { x: last.x, y: last.y, nx: last.nx, ny: last.ny, tx: last.tx, ty: last.ty };
  }

  // ---------- band texture engines ----------
  // Each engine draws inside the current clip (the band ribbon).
  // Grid walk: along arc steps, across width steps, in the local frame.

  function gridWalk(spine, s0, s1, stepS, fn) {
    var n = Math.max(2, Math.ceil((s1 - s0) / stepS));
    for (var i = 0; i <= n; i++) {
      var s = s0 + (s1 - s0) * (i / n);
      var p = spinePoint(spine, s);
      fn(p, s, i, n);
    }
  }

  // snakeskin: overlapping scale arcs in rows
  function texSnakeskin(spine, s0, s1, seed, base, hi, md, shim) {
    ctx.fillStyle = base; ctx.fill();
    var rng = mulberry32(seed);
    var unit = Math.min(W, H);
    var rowStep = 0.011 + unit * 0.000012;
    var jitter = [];
    for (var k = 0; k < 512; k++) jitter.push(rng());
    var ji = 0;
    gridWalk(spine, s0, s1, rowStep, function (p, s, i) {
      var hw = halfWidth(s);
      var cols = 4;
      for (var j = 0; j < cols; j++) {
        var v = -0.78 + (1.56) * ((j + (i % 2) * 0.5) / cols);
        var cx = p.x + p.nx * hw * v, cy = p.y + p.ny * hw * v;
        var r = hw * 0.52;
        var a = 0.75 + 0.25 * Math.sin(shim + i * 0.7 + j * 1.9);
        ctx.beginPath();
        ctx.arc(cx, cy, r, Math.PI * 0.08, Math.PI * 0.92);
        ctx.strokeStyle = hi;
        ctx.globalAlpha = 0.55 + 0.3 * a;
        ctx.lineWidth = Math.max(1, hw * 0.075);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.62, Math.PI * 0.15, Math.PI * 0.85);
        ctx.strokeStyle = md;
        ctx.globalAlpha = 0.5;
        ctx.stroke();
        ji++;
      }
    });
    ctx.globalAlpha = 1;
  }

  // feather fan: fine strokes fanning from the spine outward
  function texFeatherFan(spine, s0, s1, seed, shim) {
    ctx.fillStyle = SUN; ctx.fill();
    var rng = mulberry32(seed);
    var offs = [];
    for (var k = 0; k < 1024; k++) offs.push(rng());
    var oi = 0;
    gridWalk(spine, s0, s1, 0.006, function (p, s, i) {
      var hw = halfWidth(s);
      for (var side = -1; side <= 1; side += 2) {
        var r1 = offs[oi++ % offs.length], r2 = offs[oi++ % offs.length];
        var bx = p.x + p.tx * (r1 - 0.5) * hw * 0.24;
        var by = p.y + p.ty * (r1 - 0.5) * hw * 0.24;
        var ex = p.x + p.nx * side * hw * (0.82 + r2 * 0.14) + p.tx * hw * 0.46;
        var ey = p.y + p.ny * side * hw * (0.82 + r2 * 0.14) + p.ty * hw * 0.46;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(
          p.x + p.nx * side * hw * 0.45 + p.tx * hw * 0.10,
          p.y + p.ny * side * hw * 0.45 + p.ty * hw * 0.10, ex, ey);
        ctx.strokeStyle = FEATHER;
        ctx.globalAlpha = 0.5 + 0.22 * Math.sin(shim + i * 0.55 + side);
        ctx.lineWidth = Math.max(0.7, hw * 0.045);
        ctx.stroke();
      }
    });
    // central shaft line
    ctx.beginPath();
    var started = false;
    var pts = spine.pts;
    for (var i = 0; i < pts.length; i++) {
      if (pts[i].s < s0 || pts[i].s > s1) continue;
      if (!started) { ctx.moveTo(pts[i].x, pts[i].y); started = true; } else ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.strokeStyle = FEATHER;
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = Math.max(0.8, halfWidth((s0 + s1) / 2) * 0.06);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // coral dots: regular small dots
  function texCoralDots(spine, s0, s1, seed) {
    ctx.fillStyle = CORAL; ctx.fill();
    var rng = mulberry32(seed);
    var phaseOff = rng() * 0.5;
    gridWalk(spine, s0, s1, 0.0095, function (p, s, i) {
      var hw = halfWidth(s);
      var rows = [-0.55, 0, 0.55];
      for (var j = 0; j < 3; j++) {
        var v = rows[j] + ((i % 2) ? 0.10 : -0.02) + phaseOff * 0.04;
        var cx = p.x + p.nx * hw * v, cy = p.y + p.ny * hw * v;
        ctx.beginPath();
        ctx.arc(cx, cy, hw * 0.16, 0, Math.PI * 2);
        ctx.fillStyle = CORAL_D;
        ctx.globalAlpha = 0.55;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx - hw * 0.03, cy - hw * 0.03, hw * 0.105, 0, Math.PI * 2);
        ctx.fillStyle = CREAM;
        ctx.globalAlpha = 0.92;
        ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
  }

  // feather cream: plain with fine hatch
  function texCreamHatch(spine, s0, s1, seed, shim) {
    ctx.fillStyle = CREAM; ctx.fill();
    var rng = mulberry32(seed);
    var tilt = (rng() - 0.5) * 0.5;
    gridWalk(spine, s0, s1, 0.0075, function (p, s, i) {
      var hw = halfWidth(s);
      var dx = p.nx + p.tx * tilt, dy = p.ny + p.ty * tilt;
      ctx.beginPath();
      ctx.moveTo(p.x - dx * hw * 0.86, p.y - dy * hw * 0.86);
      ctx.lineTo(p.x + dx * hw * 0.86, p.y + dy * hw * 0.86);
      ctx.strokeStyle = FEATHER;
      ctx.globalAlpha = 0.16 + 0.06 * Math.sin(shim + i * 0.8);
      ctx.lineWidth = Math.max(0.6, hw * 0.035);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  // feather-gold scales
  function texGoldScales(spine, s0, s1, seed, shim) {
    ctx.fillStyle = FEATHER; ctx.fill();
    gridWalk(spine, s0, s1, 0.011, function (p, s, i) {
      var hw = halfWidth(s);
      var cols = 4;
      for (var j = 0; j < cols; j++) {
        var v = -0.78 + 1.56 * ((j + (i % 2) * 0.5) / cols);
        var cx = p.x + p.nx * hw * v, cy = p.y + p.ny * hw * v;
        var r = hw * 0.52;
        ctx.beginPath();
        ctx.arc(cx, cy, r, Math.PI * 0.08, Math.PI * 0.92);
        ctx.strokeStyle = SUN;
        ctx.globalAlpha = 0.6 + 0.25 * Math.sin(shim + i * 0.6 + j * 1.7);
        ctx.lineWidth = Math.max(1, hw * 0.08);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.6, Math.PI * 0.15, Math.PI * 0.85);
        ctx.strokeStyle = FEATHER_D;
        ctx.globalAlpha = 0.55;
        ctx.stroke();
      }
    });
    ctx.globalAlpha = 1;
  }

  var ENGINES = [
    function (sp, a, b, seed, sh) { texSnakeskin(sp, a, b, seed, SNAKE, SNAKE_HI, SNAKE_MD, sh); },
    function (sp, a, b, seed, sh) { texFeatherFan(sp, a, b, seed, sh); },
    function (sp, a, b, seed, sh) { texCoralDots(sp, a, b, seed); },
    function (sp, a, b, seed, sh) { texCreamHatch(sp, a, b, seed, sh); },
    function (sp, a, b, seed, sh) { texGoldScales(sp, a, b, seed, sh); },
    function (sp, a, b, seed, sh) { texSnakeskin(sp, a, b, seed, DARK_BASE, DARK_HI, SNAKE, sh); }
  ];

  // ---------- head ----------
  var blinkStart = -10; // elapsed seconds when blink began; -10 = open
  function drawHead(spine, elapsed) {
    var end = spine.pts[spine.pts.length - 1];
    var unit = Math.min(W, H);
    var hw = halfWidth(0.995);
    var hx = end.x + end.tx * hw * 0.85, hy = end.y + end.ty * hw * 0.85;
    var ang = Math.atan2(end.ty, end.tx);
    var hl = hw * 1.55, hh = hw * 0.92;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(ang);
    // head body
    ctx.beginPath();
    ctx.ellipse(0, 0, hl, hh, 0, 0, Math.PI * 2);
    ctx.fillStyle = SNAKE;
    ctx.fill();
    // a few scale arcs on the head
    ctx.beginPath();
    ctx.ellipse(0, 0, hl * 0.99, hh * 0.99, 0, 0, Math.PI * 2);
    ctx.clip();
    var rng = mulberry32(BASE_SEED + 55);
    for (var i = 0; i < 7; i++) {
      var cx = (rng() - 0.5) * hl * 1.5, cy = (rng() - 0.5) * hh * 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, hh * 0.42, Math.PI * 0.1, Math.PI * 0.9);
      ctx.strokeStyle = SNAKE_HI;
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = Math.max(0.8, hh * 0.07);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // calm eye: cream, on the upper side; blink closes it
    var bt = (elapsed - blinkStart) / 0.22; // 0..1 across blink
    var open = 1;
    if (bt >= 0 && bt <= 1) open = Math.abs(bt - 0.5) * 2; // 1 -> 0 -> 1
    if (open < 0.06) open = 0.06;
    var ex = hl * 0.34, ey = -hh * 0.34, er = hh * 0.30;
    ctx.beginPath();
    ctx.ellipse(ex, ey, er, er * open, 0, 0, Math.PI * 2);
    ctx.fillStyle = CREAM;
    ctx.fill();
    if (open > 0.35) {
      ctx.beginPath();
      ctx.arc(ex + er * 0.12, ey, er * 0.46, 0, Math.PI * 2);
      ctx.fillStyle = SNAKE;
      ctx.fill();
    }
    ctx.restore();
    return { x: hx, y: hy, r: hl * 1.25 };
  }

  // ---------- draw ----------
  var PHASE0 = 0;
  function draw(elapsed) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var phase = PHASE0 + elapsed * 0.55;
    var spine = buildSpine(phase);
    var shim = elapsed * 1.4;

    var i;
    for (i = 0; i < 6; i++) {
      var s0 = bandBounds[i], s1 = bandBounds[i + 1];
      ctx.save();
      ribbonPath(spine, Math.max(0, s0 - 0.0015), Math.min(1, s1 + 0.0015));
      ctx.clip();
      ENGINES[i](spine, s0, s1, BASE_SEED + i * 131 + bandTexSeed[i] * 7919, shim + i * 2.3);
      ctx.restore();
    }

    // crisp cream separators at band borders
    ctx.strokeStyle = CREAM;
    ctx.lineCap = 'round';
    for (i = 1; i < 6; i++) {
      var p = spinePoint(spine, bandBounds[i]);
      var hw = halfWidth(bandBounds[i]);
      ctx.beginPath();
      ctx.moveTo(p.x - p.nx * hw * 1.0, p.y - p.ny * hw * 1.0);
      ctx.lineTo(p.x + p.nx * hw * 1.0, p.y + p.ny * hw * 1.0);
      ctx.globalAlpha = 0.92;
      ctx.lineWidth = Math.max(1.1, hw * 0.075);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // soft tail tip
    var tail = spine.pts[0];
    ctx.beginPath();
    ctx.arc(tail.x, tail.y, halfWidth(0.005), 0, Math.PI * 2);
    ctx.fillStyle = DARK_BASE;
    ctx.fill();

    headInfo = drawHead(spine, elapsed);
  }

  var headInfo = { x: 0, y: 0, r: 10 };

  // ---------- interaction ----------
  var startT = null; // rAF timestamp of first frame
  function nowElapsed(ts) {
    if (startT === null) startT = ts;
    return (ts - startT) / 1000;
  }

  var dragging = false, dragMoved = 0, downX = 0, downY = 0, downTime = 0;
  var lastReseedBand = -1, lastReseedX = 0, lastReseedY = 0;

  function pointerPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function bandAt(x, y) {
    // nearest spine sample by brute force on last spine geometry
    var spine = buildSpine(PHASE0 + lastElapsed * 0.55);
    var best = 1e18, bs = 0;
    for (var i = 0; i < spine.pts.length; i++) {
      var dx = spine.pts[i].x - x, dy = spine.pts[i].y - y;
      var d = dx * dx + dy * dy;
      if (d < best) { best = d; bs = spine.pts[i].s; }
    }
    if (Math.sqrt(best) > halfWidth(bs) * 2.4) return -1;
    return bandIndexAt(bs);
  }

  var lastElapsed = 0;

  function onDown(e) {
    var p = pointerPos(e);
    dragging = true; dragMoved = 0;
    downX = p.x; downY = p.y; downTime = lastElapsed;
    lastReseedBand = -1;
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    e.preventDefault();
  }

  function onMove(e) {
    if (!dragging) return;
    var p = pointerPos(e);
    dragMoved += Math.abs(p.x - downX) + Math.abs(p.y - downY);
    downX = p.x; downY = p.y;
    if (dragMoved > 8) {
      var b = bandAt(p.x, p.y);
      if (b >= 0) {
        var dx = p.x - lastReseedX, dy = p.y - lastReseedY;
        if (b !== lastReseedBand || dx * dx + dy * dy > 900) {
          bandTexSeed[b] += 1; // band re-grows its texture, same material
          lastReseedBand = b; lastReseedX = p.x; lastReseedY = p.y;
        }
      }
    }
  }

  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var p = pointerPos(e);
    var dx = p.x - headInfo.x, dy = p.y - headInfo.y;
    var quick = (lastElapsed - downTime) < 0.45;
    if (dragMoved <= 8 && quick && dx * dx + dy * dy < headInfo.r * headInfo.r * 2.6) {
      // tap on head: blink + re-segment (widths change, materials keep order)
      blinkStart = lastElapsed;
      segCounter += 1;
      bandBounds = computeBounds(segCounter);
    }
  }

  if (typeof window !== 'undefined' && canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { dragging = false; });
  }

  // ---------- main loop ----------
  draw(0); // synchronous first frame: segmentation seed 1, phase 0, eye open

  if (typeof requestAnimationFrame === 'function') {
    var loop = function (ts) {
      lastElapsed = nowElapsed(ts);
      draw(lastElapsed);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
