<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No9091 · Ember Knot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #060405; }
  body { position: fixed; inset: 0; width: 100%; touch-action: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
<script>
(function() {
  'use strict';
  var cv = document.getElementById('scene');
  var W = 0, H = 0, DPR = 1;

  // Seeded RNG (mulberry32)
  var _s = 9091;
  function rnd() {
    _s |= 0; _s = _s + 0x6D2B79F5 | 0;
    var z = Math.imul(_s ^ _s >>> 15, 1 | _s);
    z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z;
    return ((z ^ z >>> 14) >>> 0) / 4294967296;
  }

  var TAU = Math.PI * 2;

  // (2,3) torus knot parametric point at t in [0, TAU)
  function knotPoint(t, R, r, out) {
    var p = 2, q = 3;
    var cx = R + r * Math.cos(q * t);
    out.x = cx * Math.cos(p * t);
    out.y = cx * Math.sin(p * t);
    out.z = r * Math.sin(q * t);
    return out;
  }

  function resize2d(ctx2d) {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var vw = window.innerWidth, vh = window.innerHeight;
    if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
    W = vw; H = vh;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx2d.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // ---------- 2D fallback (no three.js or no WebGL) ----------
  function runFallback() {
    var ctx = cv.getContext('2d');
    function build() { resize2d(ctx); }
    window.addEventListener('resize', build);
    build();

    var N = 260, pts = [];
    var tmp = { x: 0, y: 0, z: 0 };
    for (var i = 0; i < N; i++) {
      knotPoint((i / N) * TAU, 1, 0.42, tmp);
      pts.push({ x: tmp.x, y: tmp.y, z: tmp.z });
    }
    var rot = 0, tRotX = 0.5, rotX = 0.5, dragging = false, lx = 0, ly = 0;
    var last = performance.now();

    cv.addEventListener('pointerdown', function(e) { dragging = true; lx = e.clientX; ly = e.clientY; });
    window.addEventListener('pointermove', function(e) {
      if (!dragging) return;
      rot += (e.clientX - lx) * 0.008; tRotX += (e.clientY - ly) * 0.005;
      tRotX = Math.max(-1.2, Math.min(1.2, tRotX));
      lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener('pointerup', function() { dragging = false; });
    cv.addEventListener('dblclick', function() { rot = 0; tRotX = 0.5; });

    function frame(now) {
      var dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (!dragging) rot += dt * 0.15;
      rotX += (tRotX - rotX) * 0.06;
      var S = Math.min(W, H) * 0.36;
      var cxp = Math.cos(rot), sxp = Math.sin(rot), cxr = Math.cos(rotX), sxr = Math.sin(rotX);

      ctx.fillStyle = 'rgba(6,4,5,0.10)';
      ctx.fillRect(0, 0, W, H);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (var i = 0; i <= N; i++) {
        var p = pts[i % N];
        var x1 = p.x * cxp - p.z * sxp, z1 = p.x * sxp + p.z * cxp;
        var y1 = p.y * cxr - z1 * sxr;
        var sx = W / 2 + x1 * S, sy = H / 2 - y1 * S * 0.8;
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.strokeStyle = 'rgba(255,140,40,0.85)';
      ctx.shadowColor = 'rgba(255,110,20,0.9)'; ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;
      requestAnimationFrame(frame);
    }
    ctx.fillStyle = '#060405'; ctx.fillRect(0, 0, W, H);
    requestAnimationFrame(frame);
  }

  // ---------- WebGL path ----------
  function runWebGL() {
    var renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, alpha: false, preserveDrawingBuffer: true });
    } catch (e) { runFallback(); return; }
    if (!renderer.getContext()) { runFallback(); return; }

    var COUNT = (Math.min(window.innerWidth, window.innerHeight) < 600) ? 3800 : 6500;
    var R = 1.0, RK = 0.42;

    var pos = new Float32Array(COUNT * 3);
    var aU = new Float32Array(COUNT);
    var speed = new Float32Array(COUNT);
    var ph = new Float32Array(COUNT);
    var tmp = { x: 0, y: 0, z: 0 };

    _s = 9091;
    for (var i = 0; i < COUNT; i++) {
      aU[i] = rnd();
      speed[i] = 0.014 + rnd() * 0.05;      // knot-param units per second
      ph[i] = rnd() * TAU;
      knotPoint(aU[i] * TAU, R, RK, tmp);
      pos[i * 3] = tmp.x; pos[i * 3 + 1] = tmp.y; pos[i * 3 + 2] = tmp.z;
    }

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aU', new THREE.BufferAttribute(aU, 1));

    var mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uSize: { value: 1 } },
      vertexShader: [
        'attribute float aU;',
        'varying float vHeat;',
        'uniform float uTime;',
        'uniform float uSize;',
        'void main() {',
        '  vHeat = fract(aU - uTime * 0.035);',
        '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
        '  gl_PointSize = uSize * (0.55 + 0.9 * vHeat) * (170.0 / -mv.z);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'varying float vHeat;',
        'void main() {',
        '  vec2 c = gl_PointCoord - 0.5;',
        '  float d = length(c);',
        '  float a = smoothstep(0.5, 0.04, d);',
        '  vec3 col = mix(vec3(0.42, 0.07, 0.015), vec3(1.0, 0.42, 0.07), smoothstep(0.0, 0.55, vHeat));',
        '  col = mix(col, vec3(1.0, 0.86, 0.58), smoothstep(0.55, 1.0, vHeat));',
        '  gl_FragColor = vec4(col * a, a);',
        '}'
      ].join('\n'),
      transparent: true,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending
    });

    var scene = new THREE.Scene();
    var knot = new THREE.Points(geo, mat);
    scene.add(knot);

    var camera = new THREE.PerspectiveCamera(46, 1, 0.1, 50);
    camera.position.set(0, 0, 4.6);

    // trail fade: translucent black quad each frame, no auto clear
    var fadeScene = new THREE.Scene();
    var fadeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    var fadeQuad = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.MeshBasicMaterial({ color: 0x060405, transparent: true, opacity: 0.14, depthWrite: false, depthTest: false })
    );
    fadeScene.add(fadeQuad);
    renderer.autoClear = false;

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      var vw = window.innerWidth, vh = window.innerHeight;
      if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
      W = vw; H = vh;
      renderer.setPixelRatio(DPR);
      renderer.setSize(W, H, false);
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      mat.uniforms.uSize.value = DPR * Math.min(W, H) / 700;
      renderer.clear();
    }
    window.addEventListener('resize', resize);
    resize();

    // interaction: drag orbits the knot, double-tap resets
    var rotX = 0.42, rotY = 0, tRotX = 0.42, tRotY = 0;
    var dragging = false, lx = 0, ly = 0, lastTap = 0;
    cv.addEventListener('pointerdown', function(e) {
      var now = performance.now();
      if (now - lastTap < 320) { tRotX = 0.42; tRotY = 0; }
      lastTap = now;
      dragging = true; lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener('pointermove', function(e) {
      if (!dragging) return;
      tRotY += (e.clientX - lx) * 0.006;
      tRotX += (e.clientY - ly) * 0.005;
      tRotX = Math.max(-1.3, Math.min(1.3, tRotX));
      lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener('pointerup', function() { dragging = false; });

    var last = performance.now();
    var time = 0;

    function frame(now) {
      var dt = Math.min((now - last) / 1000, 0.05); last = now;
      time += dt;
      if (!dragging) tRotY += dt * 0.10;

      rotX += (tRotX - rotX) * 0.07;
      rotY += (tRotY - rotY) * 0.07;
      knot.rotation.set(rotX, rotY, 0);

      // flow particles along the knot with organic jitter
      var arr = geo.attributes.position.array;
      for (var i = 0; i < COUNT; i++) {
        var u = aU[i] + speed[i] * dt;
        if (u >= 1) u -= 1;
        aU[i] = u;
        knotPoint(u * TAU, R, RK, tmp);
        var j = 0.028;
        var jx = Math.sin(time * 1.7 + ph[i]) * j;
        var jy = Math.sin(time * 2.3 + ph[i] * 1.7) * j;
        var jz = Math.cos(time * 1.3 + ph[i] * 2.3) * j;
        arr[i * 3] = tmp.x + jx;
        arr[i * 3 + 1] = tmp.y + jy;
        arr[i * 3 + 2] = tmp.z + jz;
      }
      geo.attributes.position.needsUpdate = true;
      mat.uniforms.uTime.value = time;

      renderer.render(fadeScene, fadeCam);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (window.THREE) { runWebGL(); } else { runFallback(); }
})();
</script>
</body>
</html>
