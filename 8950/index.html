<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№ 8950 — Tritave Rose</title>
<!-- phantom-fill-8950 -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0e0d0b;
    color: #e8e0d0;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    overflow: hidden;
  }
  canvas { position: fixed; inset: 0; display: block; }
  header {
    position: fixed; top: 28px; left: 32px; z-index: 2;
    pointer-events: none;
  }
  header .no {
    font-size: 11px; letter-spacing: .35em; text-transform: uppercase;
    color: #b08d4f; margin-bottom: 8px;
  }
  header h1 {
    font-size: 30px; font-weight: normal; letter-spacing: .02em;
    color: #f2ead8;
  }
  header .sub {
    margin-top: 8px; font-size: 13px; font-style: italic; color: #9a9081;
    max-width: 340px; line-height: 1.5;
  }
  footer {
    position: fixed; right: 32px; bottom: 24px; z-index: 2;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: #6f675a; pointer-events: none; text-align: right; line-height: 1.9;
  }
  footer b { color: #b08d4f; font-weight: normal; }
  @media (max-width: 640px) {
    header { top: 18px; left: 20px; }
    header h1 { font-size: 23px; }
    header .sub { font-size: 12px; max-width: 250px; }
    footer { right: 20px; bottom: 16px; }
  }
</style>
</head>
<body>
<canvas id="rose"></canvas>
<header>
  <div class="no">№ 8950</div>
  <h1>Tritave Rose</h1>
  <div class="sub">Structure repeating at 3&times; instead of 2&times; — thirteen
  rings, one for each step of the Bohlen–Pierce tritave. Mark size is
  consonance; the whole rose revolves.</div>
</header>
<footer>
  <div><b>3 : 1</b> &nbsp;the tritave</div>
  <div>13 steps &middot; watch only</div>
</footer>
<script>
(function () {
  'use strict';
  // DRIVER: Thirteen concentric rings — one per Bohlen–Pierce step of the
  // tritave (3:1) — each carrying 13 marks whose size is the consonance of
  // the combined ratio, revolving at speeds set by the step itself.
  //
  // Just ratios of the 13 Bohlen–Pierce steps (1/1 .. 25/9); 3/1 is the
  // outer boundary, drawn in gold.
  var RATIOS = [
    [1, 1], [27, 25], [25, 21], [9, 7], [7, 5], [75, 49], [5, 3],
    [9, 5], [49, 25], [15, 7], [7, 3], [63, 25], [25, 9]
  ];
  var N = 13;

  var canvas = document.getElementById('rose');
  var ctx = canvas.getContext('2d');
  var W, H, CX, CY, RMAX, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2; CY = H / 2 + 12;
    RMAX = Math.min(W, H) * 0.40;
  }
  window.addEventListener('resize', resize);
  resize();

  function gcd(a, b) { return b ? gcd(b, a % b) : a; }

  // Consonance of a ratio p/q: high when both numbers are small.
  // Euler-style: 1 / (1 + log2(p*q)).
  function consonance(p, q) {
    var g = gcd(p, q); p /= g; q /= g;
    return 1 / (1 + Math.log2(p * q));
  }

  // Fold a ratio into [1, 3) by tritave equivalence, then measure consonance.
  function foldedConsonance(p, q) {
    var v = p / q;
    while (v >= 3) { v /= 3; p /= 3; }
    while (v < 1) { v *= 3; p *= 3; }
    return consonance(Math.round(p * 1e6), Math.round(q * 1e6));
  }

  // Precompute mark sizes: ring i x step s -> combined ratio consonance.
  var SIZE = [];
  for (var i = 0; i < N; i++) {
    SIZE[i] = [];
    for (var s = 0; s < N; s++) {
      var a = RATIOS[i], b = RATIOS[s];
      SIZE[i][s] = foldedConsonance(a[0] * b[0], a[1] * b[1]);
    }
  }
  // Ring speeds: slower for low steps, each ring its own rate.
  function ringSpeed(i) {
    return 0.00012 * (1 + Math.log(RATIOS[i][0] / RATIOS[i][1]) / Math.log(3) * 2.2);
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);

    // Faint outer boundary: the tritave itself, 3:1.
    ctx.beginPath();
    ctx.arc(CX, CY, RMAX + 16, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(176,141,79,0.55)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(CX, CY, RMAX + 22, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(176,141,79,0.18)';
    ctx.stroke();

    for (var i = 0; i < N; i++) {
      var r = (RMAX * (i + 1)) / (N + 1);
      // Ring guide, barely there.
      ctx.beginPath();
      ctx.arc(CX, CY, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(232,224,208,0.05)';
      ctx.lineWidth = 1;
      ctx.stroke();

      var rot = now * ringSpeed(i) + i * 0.11;
      for (var s = 0; s < N; s++) {
        var ang = rot + (s / N) * Math.PI * 2;
        var c = SIZE[i][s]; // 0..1, most combined ratios sit low
        // Remap: compress the long tail so ordinary marks stay visible
        // while the truly consonant few still stand out.
        var t = Math.pow(Math.min(c / 0.35, 1), 0.55);
        var len = 4 + t * 22;
        var wid = 1.5 + t * 8.5;
        var x = CX + Math.cos(ang) * r;
        var y = CY + Math.sin(ang) * r;
        var gold = c > 0.22;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);
        ctx.beginPath();
        ctx.ellipse(0, 0, len / 2, wid / 2, 0, 0, Math.PI * 2);
        if (gold) {
          ctx.fillStyle = 'rgba(214,178,106,' + (0.75 + t * 0.25).toFixed(2) + ')';
        } else {
          ctx.fillStyle = 'rgba(232,224,208,' + (0.30 + t * 0.55).toFixed(2) + ')';
        }
        ctx.fill();
        ctx.restore();
      }
    }

    // Centre medallion: the unison all rings are measured from.
    ctx.beginPath();
    ctx.arc(CX, CY, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#d6b26a';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(CX, CY, 9, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(214,178,106,0.4)';
    ctx.stroke();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
