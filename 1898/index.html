<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No-Rule</title>
<style>
html, body { margin: 0; padding: 0; background: #F7F0E3; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* No-Rule: two voice agents trade atonal phrases across a bright
   empty room. Each phrase draws itself as a loose ink ribbon; the
   other answers with a ribbon that contradicts rather than imitates:
   wrong register, wrong length, wrong direction. After eight
   exchanges both ribbons curl into a shared embrace and the game
   reseeds under a new hidden no-rule. A tap starts a fresh game
   with the same two players and a new hidden rule. The room stays
   warm and bright throughout; the afterglow is the punctuation.
   Audio is lazy: two contrasting generated timbres sound only
   inside the first tap gesture, never on load. */
var TAU = Math.PI * 2;
var ROOM = '#F7F0E3';
var INK = '#1A1712';
var RUST = '#B3402A';
var AMBER = '#F2A93B';
var FLOOR = '#E4D7BE';
var SHADOW = '#D8CBB2';
var SEED0 = 1898;
var FRAME_T = 12.0;      /* fixed phase: exchange 7 of 8, 67 percent drawn */
var EX_DUR = 1.8;        /* seconds per exchange */
var N_EX = 8;            /* exchanges per game */
var EMBRACE_START = N_EX * EX_DUR;   /* 14.4 s */
var EMBRACE_DUR = 3.0;   /* seconds the embrace takes */
var GAME_LEN = 18.0;     /* exchanges, embrace, afterglow, then reseed */
var RULE_NAMES = ['contradict', 'shadow', 'interrupt', 'lag'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var tapCount = 0;
var audioCtx = null;
/* QA hooks only: ?t=N sets the clock in seconds, ?game=N or ?seed=N
   reseeds the game as a tap would. No link in the piece uses these. */
try {
  var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
  var mt = qs.match(/[?&]t=([0-9.]+)/);
  var mg = qs.match(/[?&]game=([0-9]+)/);
  var ms = qs.match(/[?&]seed=([0-9]+)/);
  if (mt) phaseT = parseFloat(mt[1]);
  if (mg) tapCount = parseInt(mg[1], 10);
  else if (ms) tapCount = parseInt(ms[1], 10) - SEED0;
} catch (e) { /* keep defaults */ }
FRAME_T = phaseT;
/* ---- the game: two players, one hidden rule per game ---- */
var game = null;
function buildGame(seed) {
  var rng = mulberry32(seed);
  var rule = Math.floor(rng() * 4);
  var phrases = [];
  var i, prev = null;
  for (i = 0; i < N_EX; i++) {
    var speaker = i % 2;   /* 0: ink, left. 1: rust, right. */
    var fromLeft = speaker === 0;
    /* each statement takes its own lane down the room, so the
       ribbons stack as separate lines instead of one knot */
    var register = 0.24 + ((i / 2) % 4) * 0.13 + (rng() * 2 - 1) * 0.02;
    var len = 0.34 + rng() * 0.26;              /* phrase length, field fraction */
    var amp = 0.015 + rng() * 0.017;            /* ribbon wobble */
    var wob = 2 + Math.floor(rng() * 2);        /* wobble cycles, kept low so the ribbon stays loose, not spiky */
    var w0 = 0.006 + rng() * 0.009;             /* ribbon width, fraction of S */
    if (prev && i % 2 === 1) {
      /* the answer contradicts the phrase it answers: wrong
         register, wrong length, wrong direction. */
      register = prev.register < 0.45
        ? prev.register + 0.26 + (rng() * 2 - 1) * 0.02
        : prev.register - 0.26 + (rng() * 2 - 1) * 0.02;
      len = clamp(prev.len + (rng() < 0.5 ? -1 : 1) * (0.12 + rng() * 0.14), 0.26, 0.62);
      fromLeft = !prev.fromLeft;
    }
    var sx = fromLeft ? 0.16 : 0.84;
    var sy = register + (rng() * 2 - 1) * 0.03;
    var ey = register + (rng() * 2 - 1) * 0.05;
    if (rule === 1) ey = sy + (rng() * 2 - 1) * 0.02;   /* shadow: near level */
    if (rule === 3) len = len * 0.8;                    /* lag: shorter reach */
    var ex = fromLeft ? sx + len : sx - len;
    var ph = { speaker: speaker, fromLeft: fromLeft, sx: sx, sy: sy,
               ex: ex, ey: ey, amp: amp, wob: wob, w0: w0,
               len: len, register: register,
               seed: rng() * TAU, rule: rule };
    phrases.push(ph);
    prev = ph;
  }
  game = { rule: rule, phrases: phrases,
           embraceSeed: rng() * TAU };
}
function gameSeedFor(t) {
  var gi = Math.floor(t / GAME_LEN);
  return SEED0 + tapCount * 1013 + gi * 7919;
}
var curSeed = -1;
function ensureGame(t) {
  var s = gameSeedFor(t);
  if (s !== curSeed) { curSeed = s; buildGame(s); }
}
ensureGame(phaseT);
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on
   desktop. Returns {ox, oy, s, w, h}. */
function pieceRect() {
  if (isPhone) return { ox: 0, oy: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { ox: (VW - s) / 2, oy: (VH - s) / 2, s: s, w: s, h: s };
}
/* Points along one phrase ribbon, in rect fractions. */
function ribbonPts(ph, n) {
  var pts = [];
  var i, f;
  for (i = 0; i <= n; i++) {
    f = i / n;
    var x = lerp(ph.sx, ph.ex, f);
    var y = lerp(ph.sy, ph.ey, f) + Math.sin(f * ph.wob * TAU + ph.seed) * ph.amp * Math.sin(f * Math.PI);
    pts.push({ x: x, y: y });
  }
  return pts;
}
function drawRibbon(R, ph, frac) {
  var n = 26;
  var pts = ribbonPts(ph, n);
  var shown = Math.max(2, Math.floor(n * clamp(frac, 0, 1)) + 1);
  var col = ph.speaker === 0 ? INK : RUST;
  var i;
  /* ribbon body: a filled tapering band along the path */
  var top = [], bot = [];
  for (i = 0; i < shown; i++) {
    var p = pts[i];
    var q = pts[Math.min(i + 1, pts.length - 1)];
    var dx = q.x - p.x, dy = q.y - p.y;
    var L = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / L, ny = dx / L;
    var w = ph.w0 * (0.55 + 0.45 * Math.sin(i / Math.max(1, shown - 1) * Math.PI));
    top.push({ x: p.x + nx * w, y: p.y + ny * w });
    bot.push({ x: p.x - nx * w, y: p.y - ny * w });
  }
  ctx.fillStyle = rgba(col, 0.92);
  ctx.beginPath();
  ctx.moveTo(R.ox + top[0].x * R.w, R.oy + top[0].y * R.h);
  for (i = 1; i < top.length; i++) ctx.lineTo(R.ox + top[i].x * R.w, R.oy + top[i].y * R.h);
  for (i = bot.length - 1; i >= 0; i--) ctx.lineTo(R.ox + bot[i].x * R.w, R.oy + bot[i].y * R.h);
  ctx.closePath();
  ctx.fill();
  /* ink edge: a thin darker stroke along the ribbon spine */
  ctx.strokeStyle = rgba(col, 0.55);
  ctx.lineWidth = Math.max(1, R.s * 0.0012);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(R.ox + pts[0].x * R.w, R.oy + pts[0].y * R.h);
  for (i = 1; i < shown; i++) ctx.lineTo(R.ox + pts[i].x * R.w, R.oy + pts[i].y * R.h);
  ctx.stroke();
  /* the speaking tip: a small round head at the ribbon front */
  var tip = pts[shown - 1];
  ctx.fillStyle = rgba(col, 0.95);
  ctx.beginPath();
  ctx.moveTo(R.ox + tip.x * R.w + Math.max(1, R.s * 0.006), R.oy + tip.y * R.h);
  ctx.arc(R.ox + tip.x * R.w, R.oy + tip.y * R.h, Math.max(1, R.s * 0.006), 0, TAU);
  ctx.fill();
}
function drawPlayer(R, side, t, speaking) {
  /* side 0: ink, left. side 1: rust, right. A small standing
     figure: head, body, feet, breathing slowly. */
  var col = side === 0 ? INK : RUST;
  var bx = side === 0 ? 0.10 : 0.90;
  var by = 0.52 + Math.sin(t * 0.45 + side * 2.1) * 0.004;
  var px = R.ox + bx * R.w, py = R.oy + by * R.h;
  var hr = R.s * 0.028;
  ctx.fillStyle = rgba(col, 0.16);
  ctx.beginPath();
  ctx.moveTo(px + R.s * 0.055, py + R.s * 0.115);
  ctx.ellipse(px, py + R.s * 0.115, R.s * 0.055, R.s * 0.010, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1.5, R.s * 0.004);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px, py + hr + R.s * 0.004);
  ctx.lineTo(px, py + R.s * 0.105);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px, py + R.s * 0.105);
  ctx.lineTo(px - R.s * 0.016, py + R.s * 0.125);
  ctx.moveTo(px, py + R.s * 0.105);
  ctx.lineTo(px + R.s * 0.016, py + R.s * 0.125);
  ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(px + hr, py);
  ctx.arc(px, py, hr, 0, TAU);
  ctx.fill();
  if (speaking) {
    /* an open mouth arc while the player is speaking */
    var mx = side === 0 ? px + hr * 0.55 : px - hr * 0.55;
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1, R.s * 0.002);
    ctx.beginPath();
    ctx.moveTo(mx, py + hr * 0.15);
    ctx.arc(mx, py + hr * 0.15, hr * 0.45, side === 0 ? -0.9 : Math.PI - 0.9, side === 0 ? 0.9 : Math.PI + 0.9);
    ctx.stroke();
  }
}
function drawEmbrace(R, t) {
  /* both ribbons curl into one shared embrace: two spirals winding
     into a single loop, with a soft amber glow rising behind them */
  var gt = t % GAME_LEN;
  var ef = smooth((gt - EMBRACE_START) / EMBRACE_DUR);
  var cx = R.ox + 0.5 * R.w, cy = R.oy + 0.48 * R.h;
  var glowA = 0;
  if (gt >= EMBRACE_START) glowA = 0.55 * smooth((gt - EMBRACE_START) / 1.2);
  if (gt > EMBRACE_START + EMBRACE_DUR) glowA = 0.55 * (1 - smooth((gt - EMBRACE_START - EMBRACE_DUR) / 0.6));
  if (glowA > 0.01) {
    var gr = R.s * 0.42;
    var grad = ctx.createRadialGradient(cx, cy, R.s * 0.02, cx, cy, gr);
    grad.addColorStop(0, rgba(AMBER, glowA));
    grad.addColorStop(1, rgba(AMBER, 0));
    ctx.fillStyle = grad;
    ctx.fillRect(R.ox, R.oy, R.w, R.h);
  }
  if (gt < EMBRACE_START) return;
  var turns = 1.6 * ef;
  var rr = R.s * 0.20;
  var i, side;
  for (side = 0; side < 2; side++) {
    var col = side === 0 ? INK : RUST;
    var off = side === 0 ? 0 : Math.PI;
    var n = Math.max(8, Math.floor(90 * ef));
    ctx.strokeStyle = rgba(col, 0.92);
    ctx.lineWidth = Math.max(1.5, R.s * 0.008 * (1 - ef * 0.3));
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (i = 0; i <= n; i++) {
      var f = i / n;
      var a = game.embraceSeed + off + f * turns * TAU;
      var rad = rr * (1 - f * 0.72);
      var x = cx + Math.cos(a) * rad;
      var y = cy + Math.sin(a) * rad * 0.92;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  /* the shared loop closes: a single ring where the two meet */
  if (ef > 0.85) {
    ctx.strokeStyle = rgba(AMBER, (ef - 0.85) * 4);
    ctx.lineWidth = Math.max(1, R.s * 0.003);
    ctx.beginPath();
    ctx.moveTo(cx + rr * 0.28, cy);
    ctx.arc(cx, cy, rr * 0.28, 0, TAU);
    ctx.stroke();
  }
}
function drawPlates(R) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('No-Rule').width > R.w - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('No-Rule').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 24').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = R.ox + 12, plateY = R.oy + 12;
  ctx.fillStyle = INK;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.fillStyle = RUST;
  ctx.fillRect(plateX, plateY + plateH - 3, plateW, 3);
  ctx.fillStyle = ROOM;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('No-Rule', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2007 · 03 · 24', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap to start a fresh game.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = R.ox + 12;
  var hintPlateY = R.oy + R.h - hintPlateH - 12;
  ctx.fillStyle = INK;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.fillStyle = ROOM;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var R = pieceRect();
  ensureGame(phaseT);
  var t = phaseT;
  var gt = t % GAME_LEN;
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, VW, VH);
  /* the empty room: a floor line and soft shadows under the players */
  ctx.fillStyle = FLOOR;
  ctx.fillRect(R.ox, R.oy + R.h * 0.78, R.w, R.h * 0.22);
  ctx.strokeStyle = rgba(SHADOW, 0.9);
  ctx.lineWidth = Math.max(1, R.s * 0.0015);
  ctx.beginPath();
  ctx.moveTo(R.ox, R.oy + R.h * 0.78);
  ctx.lineTo(R.ox + R.w, R.oy + R.h * 0.78);
  ctx.stroke();
  var embracing = gt >= EMBRACE_START;
  var i;
  if (!embracing) {
    var cur = Math.floor(gt / EX_DUR);
    for (i = 0; i < N_EX; i++) {
      if (i > cur) break;
      var frac = i < cur ? 1 : (gt - i * EX_DUR) / EX_DUR;
      if (i === cur && frac <= 0) continue;
      var fade = i < cur ? 1 - 0.03 * (cur - i) : 1;
      ctx.globalAlpha = clamp(fade, 0.8, 1);
      drawRibbon(R, game.phrases[i], frac);
      ctx.globalAlpha = 1;
    }
    var curPh = game.phrases[Math.min(cur, N_EX - 1)];
    drawPlayer(R, 0, t, curPh.speaker === 0);
    drawPlayer(R, 1, t, curPh.speaker === 1);
  } else {
    /* during the embrace the old ribbons are gone, the two players
       watch the shared curl fill the frame */
    drawPlayer(R, 0, t, false);
    drawPlayer(R, 1, t, false);
  }
  drawEmbrace(R, t);
  drawPlates(R);
}
/* Two contrasting generated timbres, created lazily inside the tap
   gesture only. Ink speaks low on a sine, rust answers higher on a
   triangle; the notes follow the current hidden rule. */
function playPhrase() {
  try {
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
    if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var base = [196, 233, 262, 311];
    var i, ph;
    for (i = 0; i < 4; i++) {
      ph = game.phrases[i];
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = ph.speaker === 0 ? 'sine' : 'triangle';
      var f = base[(i + game.rule) % 4] * (ph.speaker === 0 ? 1 : 1.5);
      osc.frequency.value = f;
      var start = audioCtx.currentTime + i * 0.28;
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.08, start + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, start + 0.26);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(start); osc.stop(start + 0.3);
    }
  } catch (e) { /* audio is optional; the visual game stands alone */ }
}
/* Tap reseeds the game: same two players, a new hidden no-rule, a
   fresh set of ribbons. The tap never reloads. */
function onTap() {
  tapCount += 1;
  playPhrase();
  draw();
}
try { canvas.addEventListener('pointerdown', onTap); } catch (e) { /* no pointer events */ }
/* ---- frame one: fixed phase t = 12 s, game 0, exchange 7 of 8
   67 percent drawn, six ribbons already on the wall ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
