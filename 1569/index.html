<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk Between Raindrops</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EDE4; overflow: hidden; }
canvas { display: block; }
#cap {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 10px 14px 12px; pointer-events: none;
  font-family: Georgia, 'Times New Roman', serif;
  color: #3E5E4E; text-align: center;
  text-shadow: 0 1px 3px rgba(242,237,228,0.9), 0 0 8px rgba(242,237,228,0.7);
}
#cap .t { font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; }
#cap .d { font-size: 11px; letter-spacing: 0.22em; margin-top: 3px; opacity: 0.85; }
#cap .h { font-size: 12px; font-style: italic; margin-top: 3px; opacity: 0.9; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">
  <div class="t">Walk Between Raindrops</div>
  <div class="d">2006 &middot; 04 &middot; 29</div>
  <div class="h">Watch the weather change.</div>
</div>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F2EDE4';
// Palette: warm paper ground; sage, teal, deep green only, all at low alpha.
var SAGE = [157, 184, 154];
var TEAL = [94, 143, 139];
var DEEP = [62, 94, 78];
var COLORS = [SAGE, SAGE, SAGE, SAGE, SAGE, TEAL, TEAL, TEAL, TEAL, DEEP, DEEP];
var SEED = 1569;
var NWASH = 700;        // wash particles
var TRAIL = 20;         // samples per particle over the trailing window
var TRAIL_STEP = 0.35;   // seconds between trail samples (7 s window)
var NNODE = 80;         // node-garden particles
var RESEED = 25;        // seconds per field epoch
var HOLE_U = 0.38, HOLE_V = 0.44;  // pale breathing hole, center-left
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smoothstep(a, b, x) {
  var u = clamp((x - a) / (b - a), 0, 1);
  return u * u * (3 - 2 * u);
}
// Field direction for epoch e: a slow global weather direction, pure function of e.
function epochAngle(e) {
  return 1.25 * Math.sin(e * 1.7 + 0.4) + 0.6 * Math.sin(e * 0.9 + 2.1);
}
// Blended field direction at time t: over the first 4 s of each epoch the
// direction eases from the previous epoch's angle to the new one, so the
// weather changes without a cut. Pure function of t.
function fieldAngle(t) {
  var e = Math.floor(t / RESEED);
  var b = smoothstep(0, 4, t - e * RESEED);
  var a0 = epochAngle(e - 1), a1 = epochAngle(e);
  return a0 + (a1 - a0) * b;
}
// Seeded particle tables. Built once from the fixed seed; draw(t) is then a
// pure function of t, so every re-render at the same t is byte-identical.
var rng = mulberry32(SEED * 2654435761 >>> 0);
var wash = [];
(function buildWash() {
  var guard = 0;
  while (wash.length < NWASH && guard++ < 20000) {
    var u = rng(), v = rng();
    // Denser at the edges: acceptance rises toward the frame border.
    var edge = Math.max(Math.abs(u - 0.5), Math.abs(v - 0.5)) * 2;
    var pEdge = 0.45 + 0.55 * edge;
    // Pale hole near center-left: acceptance falls to near zero inside it.
    var du = u - HOLE_U, dv = v - HOLE_V;
    var dHole = Math.sqrt(du * du + dv * dv);
    var pHole = clamp((dHole - 0.05) / 0.10, 0.10, 1);
    if (rng() > pEdge * pHole) continue;
    var ci = Math.floor(rng() * COLORS.length);
    wash.push({
      u: u, v: v, c: COLORS[ci],
      r: 9 + rng() * 17,
      a: 0.030 + rng() * 0.025,
      amp1: 10 + rng() * 16, amp2: 6 + rng() * 10,
      w1: 0.05 + rng() * 0.10, w2: 0.04 + rng() * 0.09,
      p1: rng() * TAU, p2: rng() * TAU,
      drift: 8 + rng() * 12,
      dp: rng() * TAU
    });
  }
})();
var nodes = [];
for (var ni = 0; ni < NNODE; ni++) {
  nodes.push({
    u: 0.06 + rng() * 0.88, v: 0.06 + rng() * 0.88,
    amp1: 10 + rng() * 20, amp2: 6 + rng() * 14,
    w1: 0.06 + rng() * 0.09, w2: 0.05 + rng() * 0.08,
    p1: rng() * TAU, p2: rng() * TAU,
    drift: 8 + rng() * 16,
    dp: rng() * TAU
  });
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, startT = null;
function isPhone() {
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width; sh = window.screen.height; }
  if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
  return VH > VW * 1.15;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
// Frame geometry: field-like full-bleed rect on phones, square centered on desktop.
function frame() {
  if (isPhone()) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
// Closed-form particle position at time tau. The particle breathes on two
// slow sinusoids and drifts along the current field direction; the drift
// term is bounded (a sine of tau), so positions never run away and no
// frame-integrated state exists anywhere.
function posAt(p, f, tau, ang) {
  var dx = Math.cos(ang), dy = Math.sin(ang);
  var along = p.drift * Math.sin(0.05 * tau + p.dp);
  var x = f.x + p.u * f.w
    + p.amp1 * Math.sin(p.w1 * tau + p.p1) * dx
    - p.amp2 * Math.sin(p.w2 * tau + p.p2) * dy
    + along * dx;
  var y = f.y + p.v * f.h
    + p.amp1 * Math.sin(p.w1 * tau + p.p1) * dy
    + p.amp2 * Math.sin(p.w2 * tau + p.p2) * dx
    + along * dy;
  return [x, y];
}
function draw(t) {
  size();
  var f = frame();
  var S = Math.min(f.w, f.h);
  var sc = S / 720;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  var hx = f.x + HOLE_U * f.w, hy = f.y + HOLE_V * f.h;
  var holeR = S * (0.10 + 0.02 * Math.sin(0.13 * t + 1.2));
  var ang = fieldAngle(t);
  // Wash: each particle is drawn as the deterministic union of its positions
  // over a fixed trailing window ending at t. Alpha accumulation does the
  // watercoloring; edges never sharpen because every mark is a soft
  // low-alpha circle. Frame one is already pre-warmed: the window reaches
  // back before t=0, so washes are present from the first frame.
  for (var i = 0; i < wash.length; i++) {
    var p = wash[i];
    var rad = p.r * sc;
    for (var k = 0; k < TRAIL; k++) {
      var tau = t - k * TRAIL_STEP;
      var xy = posAt(p, f, tau, fieldAngle(tau));
      var dh = Math.sqrt((xy[0] - hx) * (xy[0] - hx) + (xy[1] - hy) * (xy[1] - hy));
      if (dh < holeR) continue;
      var fade = 1 - (k / TRAIL) * 0.55;
      var holeFade = smoothstep(holeR, holeR * 1.4, dh);
      var a = p.a * fade * holeFade;
      if (a < 0.002) continue;
      ctx.fillStyle = rgba(p.c, a);
      ctx.beginPath();
      ctx.moveTo(xy[0] + rad, xy[1]);
      ctx.arc(xy[0], xy[1], rad, 0, TAU);
      ctx.fill();
    }
  }
  // Node garden: sparse particles drawn as dots, connected to near neighbors
  // with thin deep-green lines, like veins through the washes.
  var npos = [];
  for (var j = 0; j < nodes.length; j++) {
    var np = posAt(nodes[j], f, t, ang);
    npos.push(np);
  }
  var linkR = 72 * sc;
  ctx.lineWidth = Math.max(0.6, 0.7 * sc);
  for (var a2 = 0; a2 < nodes.length; a2++) {
    for (var b2 = a2 + 1; b2 < nodes.length; b2++) {
      var ddx = npos[a2][0] - npos[b2][0], ddy = npos[a2][1] - npos[b2][1];
      var dd = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dd > linkR) continue;
      var la = 0.13 * (1 - dd / linkR);
      ctx.strokeStyle = rgba(DEEP, la);
      ctx.beginPath();
      ctx.moveTo(npos[a2][0], npos[a2][1]);
      ctx.lineTo(npos[b2][0], npos[b2][1]);
      ctx.stroke();
    }
  }
  for (var j2 = 0; j2 < nodes.length; j2++) {
    var dh2 = Math.sqrt((npos[j2][0] - hx) * (npos[j2][0] - hx) + (npos[j2][1] - hy) * (npos[j2][1] - hy));
    if (dh2 < holeR) continue;
    ctx.fillStyle = rgba(DEEP, 0.45);
    ctx.beginPath();
    ctx.moveTo(npos[j2][0] + 1.3 * sc, npos[j2][1]);
    ctx.arc(npos[j2][0], npos[j2][1], Math.max(1, 1.3 * sc), 0, TAU);
    ctx.fill();
  }
  if (typeof window !== 'undefined') {
    window.__p1569 = { t: t, epoch: Math.floor(t / RESEED), angle: ang, wash: wash.length, nodes: nodes.length };
  }
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
