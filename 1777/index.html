<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winds After the Storm</title>
<style>
html, body { margin: 0; padding: 0; background: #C9CFD4; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#C9CFD4'; /* pale daylight grey-blue; page ground is the piece ground */
var PANE_COLS = ['#B4BBC1', '#C0C6CB', '#ADB4BA']; /* cold greys, left to right */
var FRAME_COL = '#33383D';
var WIRE_COL = '#1C1F22';
var BOX_COL = '#2E3236';
var BOX_EDGE = '#4A5056';
var AMBER = '217,138,43'; /* warm amber pulse, one only */
var FRAME_T = 60.0; /* fixed phase: main light band centred on the middle pane,
   brightness at the photocell high, one ring 64 percent expanded */
var CYCLE = 720.0; /* seconds; light field repeats every 12 minutes */
var RING_LIFE = 60.0; /* seconds; a ring lives one minute from birth */
var RING_MAX = 0.42; /* of the field side */
var THRESHOLD = 0.70; /* brightness at a contact mic that seeds a ring */
/* Light bands: closed-form vertical bands crossing the glass.
   period/offset in seconds, peak alpha, sigma in field-width units. */
var BANDS = [
  { period: 240, offset: 60, peak: 0.55, sigma: 0.10, tint: '255,255,255' },
  { period: 360, offset: 210, peak: 0.30, sigma: 0.16, tint: '186,212,230' },
  { period: 90, offset: 15, peak: 0.18, sigma: 0.08, tint: '255,255,255' }
];
/* Contact mics, one per pane, at fixed relative positions. */
var MICS = [
  { x: 0.17, y: 0.30 },
  { x: 0.50, y: 0.44 },
  { x: 0.83, y: 0.36 }
];
/* Ring births: rising crossings of THRESHOLD by the brightness at any mic,
   computed numerically from the closed-form brightness function over one
   720 s cycle. Gaps 79.3, 78.9, 91.4, 86.0, 82.8, 84.1, 69.7, 87.8 s:
   irregular, weather-like, never metronomic. The table repeats each cycle. */
var BIRTHS = [21.9, 101.2, 180.1, 271.5, 357.5, 440.3, 524.4, 594.1, 681.9];
var BOX = { x: 0.43, y: 0.80, w: 0.14, h: 0.075 }; /* homemade box, relative to field */
var PLATE_FILL = '#141618';
var PLATE_INK = '#ffffff';
var PLATE_LINE = 'rgba(255,255,255,0.45)';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* band centre position across the field, 0..1, closed-form function of time */
function bandU(t, band) {
  var tt = (((t + band.offset) % band.period) + band.period) % band.period;
  return tt / band.period;
}
/* brightness at relative field position px, 0.25 base plus the bands.
   Same closed-form function the light field is drawn from. */
function brightnessAt(t, px) {
  var b = 0.25, i, bd, u, d;
  for (i = 0; i < BANDS.length; i++) {
    bd = BANDS[i];
    u = bandU(t, bd);
    d = u - px;
    b += bd.peak * Math.exp(-(d * d) / (2 * bd.sigma * bd.sigma));
  }
  return b;
}
/* rings alive at time t: { birth, age, frac } with age in seconds.
   Births repeat every CYCLE; a ring born late in a cycle lives into the next. */
function ringsAt(t) {
  var tt = (((t % CYCLE) + CYCLE) % CYCLE);
  var out = [], i, b, age;
  for (i = 0; i < BIRTHS.length; i++) {
    b = BIRTHS[i];
    age = (((tt - b) % CYCLE) + CYCLE) % CYCLE;
    if (age < RING_LIFE) out.push({ birth: b, age: age, frac: age / RING_LIFE });
  }
  return out;
}
function photocell() {
  return {
    x: F.x + (BOX.x + BOX.w / 2) * F.w,
    y: F.y + (BOX.y + BOX.h / 2) * F.h
  };
}
function drawPanes() {
  var i, x0;
  for (i = 0; i < 3; i++) {
    x0 = F.x + (i * F.w) / 3;
    ctx.fillStyle = PANE_COLS[i];
    ctx.fillRect(x0, F.y, F.w / 3 + 1, F.h);
  }
  /* faint edge highlight down the left side of each pane */
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  for (i = 0; i < 3; i++) {
    x0 = F.x + (i * F.w) / 3;
    ctx.fillRect(x0, F.y, 1, F.h);
  }
}
/* light field: low-alpha vertical bands, drawn as strips, no gradient objects */
function drawLight() {
  var S = Math.min(F.w, F.h);
  var strips = 200;
  var step = F.w / strips;
  var i, j, sx, d, a, bd, u;
  ctx.save();
  ctx.beginPath();
  ctx.rect(F.x, F.y, F.w, F.h);
  ctx.clip();
  for (i = 0; i < strips; i++) {
    sx = F.x + (i + 0.5) * step;
    for (j = 0; j < BANDS.length; j++) {
      bd = BANDS[j];
      u = bandU(phaseT, bd);
      d = (sx - (F.x + u * F.w)) / F.w;
      a = bd.peak * Math.exp(-(d * d) / (2 * bd.sigma * bd.sigma));
      if (a > 0.004) {
        ctx.fillStyle = 'rgba(' + bd.tint + ',' + a.toFixed(4) + ')';
        ctx.fillRect(sx - step / 2, F.y, step + 1, F.h);
      }
    }
  }
  /* broad daylight wash that follows the photocell brightness */
  var glow = clamp((brightnessAt(phaseT, 0.5) - 0.25) / 0.75, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.04 + 0.04 * glow).toFixed(4) + ')';
  ctx.fillRect(F.x, F.y, F.w, F.h);
  ctx.restore();
}
function drawFrame() {
  var lw = Math.max(3, 0.005 * Math.min(F.w, F.h));
  var i, mx;
  ctx.fillStyle = FRAME_COL;
  ctx.fillRect(F.x, F.y, F.w, lw);
  ctx.fillRect(F.x, F.y + F.h - lw, F.w, lw);
  ctx.fillRect(F.x, F.y, lw, F.h);
  ctx.fillRect(F.x + F.w - lw, F.y, lw, F.h);
  for (i = 1; i < 3; i++) {
    mx = F.x + (i * F.w) / 3;
    ctx.fillRect(mx - lw / 2, F.y, lw, F.h);
  }
}
function drawWires() {
  var pc = photocell();
  var i, m, mx, my, ex, cx, cy;
  ctx.lineWidth = Math.max(1.5, 0.002 * Math.min(F.w, F.h));
  ctx.strokeStyle = WIRE_COL;
  for (i = 0; i < MICS.length; i++) {
    m = MICS[i];
    mx = F.x + m.x * F.w;
    my = F.y + m.y * F.h;
    ex = F.x + (BOX.x + (0.25 + 0.25 * i) * BOX.w) * F.w;
    cx = (mx + ex) / 2;
    cy = Math.max(my, pc.y) + 0.02 * F.h;
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.quadraticCurveTo(cx, cy, ex, F.y + BOX.y * F.h);
    ctx.stroke();
  }
}
function drawMics() {
  var S = Math.min(F.w, F.h);
  var r = Math.max(4, 0.008 * S);
  var i, m, mx, my;
  for (i = 0; i < MICS.length; i++) {
    m = MICS[i];
    mx = F.x + m.x * F.w;
    my = F.y + m.y * F.h;
    ctx.fillStyle = WIRE_COL;
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#8A9299';
    ctx.beginPath();
    ctx.arc(mx, my, Math.max(1.5, r * 0.35), 0, TAU);
    ctx.fill();
  }
}
function drawBox() {
  var S = Math.min(F.w, F.h);
  var bx = F.x + BOX.x * F.w;
  var by = F.y + BOX.y * F.h;
  var bw = BOX.w * F.w;
  var bh = BOX.h * F.h;
  ctx.fillStyle = BOX_COL;
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = BOX_EDGE;
  ctx.fillRect(bx, by, bw, Math.max(2, 0.006 * S));
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  /* two small screws on the box face */
  ctx.fillStyle = '#6A7278';
  ctx.beginPath();
  ctx.arc(bx + 0.12 * bw, by + bh / 2, Math.max(1.5, 0.004 * S), 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(bx + 0.88 * bw, by + bh / 2, Math.max(1.5, 0.004 * S), 0, TAU);
  ctx.fill();
}
function drawRings() {
  var S = Math.min(F.w, F.h);
  var pc = photocell();
  var rings = ringsAt(phaseT);
  var i, r, a;
  ctx.save();
  ctx.beginPath();
  ctx.rect(F.x, F.y, F.w, F.h);
  ctx.clip();
  for (i = 0; i < rings.length; i++) {
    r = RING_MAX * S * rings[i].frac;
    a = 0.85 * (1 - rings[i].frac);
    if (r < 1 || a <= 0.01) continue;
    ctx.lineWidth = Math.max(2, 0.004 * S);
    ctx.strokeStyle = 'rgba(' + AMBER + ',' + a.toFixed(4) + ')';
    ctx.beginPath();
    ctx.arc(pc.x, pc.y, r, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}
function drawPhotocell() {
  var S = Math.min(F.w, F.h);
  var pc = photocell();
  var glow = clamp((brightnessAt(phaseT, 0.5) - 0.25) / 0.75, 0, 1);
  /* warm halo that follows the brightness at the photocell */
  ctx.fillStyle = 'rgba(' + AMBER + ',' + (0.10 + 0.25 * glow).toFixed(4) + ')';
  ctx.beginPath();
  ctx.arc(pc.x, pc.y, 0.045 * S * (0.6 + 0.4 * glow), 0, TAU);
  ctx.fill();
  /* the amber photocell dot itself */
  ctx.fillStyle = 'rgba(' + AMBER + ',' + (0.55 + 0.45 * glow).toFixed(4) + ')';
  ctx.beginPath();
  ctx.arc(pc.x, pc.y, Math.max(3, 0.012 * S), 0, TAU);
  ctx.fill();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Winds After the Storm').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Winds After the Storm').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 23').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Winds After the Storm', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = PLATE_INK;
  ctx.fillText('2006 · 11 · 23', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawPanes();
  drawLight();
  drawFrame();
  drawWires();
  drawMics();
  drawBox();
  drawRings();
  drawPhotocell();
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    brightnessAt: function (t, px) { return brightnessAt(t, px); },
    ringsAt: function (t) { return ringsAt(t); }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
