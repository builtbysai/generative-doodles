<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.390 F is for Fox</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FBF6EC; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.390 F is for Fox (maryna-lagereva).
// After Maryna Lagereva's ABC book (#the100dayproject
// pages): one picture-book card fills the page, a huge
// coral serif letter with the animal bursting across
// it and her funny-fact line lettered beneath. The
// deck is a FIXED AUTHORED TABLE of eight cards,
// letters A to H: axolotl, beaver, caterpillar,
// dolphin, echidna, fox, gazelle, hamster, never a
// runtime pick. The piece opens on the fox card, its
// title card, fact line fully typed. DOUBLE-TAP turns
// the page: a page-turn wipe sweeps on fixed ticks,
// never an instant swap, and the new card's fact line
// types itself in character by character. Under each
// card an ambient 12s loop runs on whole cycles: the
// animal breathes 0.98-1.02 and the letter wobbles
// one degree. The letter and the fact line are the
// artwork (the batch's designed-text exception),
// drawn on this ONE canvas in a serif face; they are
// the only text in the piece. Palette is closed at
// the seven specced hexes, each used flat or at flat
// alpha steps. All jitter is fixed seeded data baked
// at load; no offscreen canvas, no gradients, no
// filters, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#FBF6EC', CORAL = '#E8836B', ORANGE = '#D98E32';
var CREAM = '#F7F1E3', INK = '#3A2E2A', MUSTARD = '#F2C14E', TEAL = '#4FA3A3';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 12;
if (LOOP !== 12) throw new Error('F is for Fox ambient loop must be 12s');
var TICK = 1 / 60;
var SERIF = 'Georgia, "Times New Roman", serif';

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-
// looking value is baked from this at load and never
// changes between frames or renders.
var seed = 390;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function circ(x, y, r, color) { ell(x, y, r, r, 0, color); }
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function curve(x1, y1, cx, cy, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
}
function blob(color, pts) {
  // pts: [moveX, moveY, then c1x,c1y,c2x,c2y,x,y per bezier segment]
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i + 5 < pts.length; i += 6) {
    ctx.bezierCurveTo(pts[i], pts[i + 1], pts[i + 2], pts[i + 3], pts[i + 4], pts[i + 5]);
  }
  ctx.closePath();
  ctx.fill();
}

// ---- the animal library ---------------------------------
// Each animal is 3-5 flat bezier blobs plus ink detail,
// drawn in a local box about 600x460, origin at the
// animal's centre, y down. Palette-closed: only the
// seven specced hexes appear, per card.

function drawAxolotl() {
  // Tail fin sweeping right.
  blob(CORAL, [120, -28, 220, -60, 292, -6, 296, 34, 292, 66, 224, 84, 128, 52, 150, 10, 120, -28]);
  // Body.
  ell(-10, 6, 196, 84, 0, CORAL);
  // Cream belly.
  ell(-16, 46, 152, 42, 0, CREAM);
  // Feathery gills fanning off the head end.
  curve(-168, -34, -212, -66, -238, -58, 15, CORAL);
  curve(-178, -6, -224, -16, -246, 2, 15, CORAL);
  curve(-168, 24, -208, 44, -232, 38, 15, CORAL);
  curve(-238, -58, -252, -76, -244, -88, 7, CORAL);
  curve(-246, 2, -262, -6, -256, -20, 7, CORAL);
  // Little legs.
  seg(-96, 78, -104, 104, 13, CORAL);
  seg(66, 80, 60, 106, 13, CORAL);
  // Face: dot eye, smile, cream cheek.
  circ(-96, 34, 21, CREAM);
  circ(-128, -8, 7, INK);
  ctx.strokeStyle = INK; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-112, 12, 15, Math.PI * 0.15, Math.PI * 0.8); ctx.stroke();
}

function drawBeaver() {
  // Big flat tail behind, crosshatched in pale lines.
  ell(158, 62, 112, 56, 0.5, INK);
  ctx.save();
  ctx.beginPath(); ctx.ellipse(158, 62, 112, 56, 0.5, 0, Math.PI * 2); ctx.clip();
  ctx.globalAlpha = 0.45; ctx.strokeStyle = CREAM; ctx.lineWidth = 4;
  var i;
  for (i = -4; i < 5; i++) {
    ctx.beginPath(); ctx.moveTo(158 + i * 26 - 40, 130); ctx.lineTo(158 + i * 26 + 40, -6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(158 + i * 26 - 40, -6); ctx.lineTo(158 + i * 26 + 40, 130); ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha = 1;
  // Body and cream belly.
  ell(-26, 16, 152, 122, 0, ORANGE);
  ell(-26, 62, 96, 70, 0, CREAM);
  // Head with round ears.
  circ(-92, -158, 23, ORANGE); circ(28, -162, 23, ORANGE);
  circ(-92, -158, 11, CORAL); circ(28, -162, 11, CORAL);
  circ(-32, -102, 80, ORANGE);
  // Muzzle, nose, eyes, and the two famous teeth.
  ell(-32, -66, 44, 30, 0, CREAM);
  ell(-32, -88, 15, 10, 0, INK);
  circ(-58, -116, 6.5, INK); circ(-6, -116, 6.5, INK);
  ctx.fillStyle = CREAM;
  ctx.fillRect(-44, -44, 11, 24); ctx.fillRect(-29, -44, 11, 24);
  ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
  ctx.strokeRect(-44, -44, 11, 24); ctx.strokeRect(-29, -44, 11, 24);
  // Feet.
  ell(-96, 132, 26, 11, 0, INK); ell(36, 132, 26, 11, 0, INK);
}

function drawCaterpillar() {
  var segs = [ [-168, 62, 52], [-88, 26, 59], [-2, 4, 63], [84, 10, 59], [162, 34, 56] ];
  var i, s;
  for (i = 0; i < segs.length; i++) { s = segs[i]; circ(s[0], s[1], s[2], TEAL); }
  // Mustard spots on the middle segments.
  circ(-96, 6, 11, MUSTARD); circ(-70, 44, 8, MUSTARD);
  circ(2, -22, 10, MUSTARD); circ(26, 22, 8, MUSTARD);
  circ(84, -14, 9, MUSTARD);
  // Tiny ink legs under each segment.
  for (i = 0; i < segs.length; i++) { s = segs[i]; seg(s[0] - 12, s[1] + s[2] - 6, s[0] - 16, s[1] + s[2] + 12, 6, INK); seg(s[0] + 14, s[1] + s[2] - 6, s[0] + 18, s[1] + s[2] + 12, 6, INK); }
  // Face on the head segment, coral cheeks.
  circ(148, 22, 6.5, INK); circ(178, 22, 6.5, INK);
  ctx.strokeStyle = INK; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(163, 36, 13, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  circ(132, 44, 9, CORAL); circ(196, 44, 9, CORAL);
  // Antennae with mustard tips.
  curve(146, -14, 132, -52, 112, -62, 6, INK);
  curve(178, -16, 182, -54, 200, -66, 6, INK);
  circ(110, -64, 9, MUSTARD); circ(202, -68, 9, MUSTARD);
}

function drawDolphin() {
  // Tail flukes.
  blob(TEAL, [-218, 38, -262, 6, -292, 2, -288, 22, -284, 44, -254, 52, -224, 60, -214, 52, -218, 38]);
  blob(TEAL, [-216, 52, -258, 74, -282, 100, -262, 106, -236, 108, -206, 76, -200, 60, -208, 52, -216, 52]);
  // Arched body.
  blob(TEAL, [-226, 42, -140, -84, 40, -128, 168, -66, 214, -40, 248, -12, 254, 4, 250, 20, 214, 26, 150, 44, 40, 66, -90, 72, -190, 62, -226, 42]);
  // Cream belly along the underside.
  blob(CREAM, [-180, 58, -80, 74, 60, 62, 168, 34, 120, 62, 20, 84, -90, 84, -170, 70, -180, 58]);
  // Dorsal and pectoral fins.
  blob(TEAL, [-6, -104, 8, -146, 34, -158, 44, -150, 40, -118, 30, -100, -6, -104]);
  blob(TEAL, [36, 52, 52, 84, 84, 96, 82, 78, 76, 54, 56, 44, 36, 52]);
  // Eye and smile.
  circ(206, -8, 6.5, INK);
  ctx.strokeStyle = INK; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(196, 8, 20, Math.PI * 0.1, Math.PI * 0.6); ctx.stroke();
}

// Echidna spines are baked at load from the fixed
// seed (never drawn from rnd at frame time, so they
// sit still while the animal breathes).
var SPINES = [];
(function () {
  var i, a, px, py;
  for (i = 0; i < 30; i++) {
    a = Math.PI * (0.08 + 0.84 * rnd());
    px = -16 + Math.cos(a) * 168 * (0.55 + rnd() * 0.4);
    py = 32 - Math.abs(Math.sin(a)) * 118 * (0.55 + rnd() * 0.4);
    SPINES.push([px, py, px + Math.cos(a) * 30, py - Math.abs(Math.sin(a)) * 30 - 8]);
  }
  if (SPINES.length !== 30) throw new Error('echidna needs exactly 30 spines');
})();

function drawEchidna() {
  // Domed body.
  ell(-16, 32, 186, 132, 0, ORANGE);
  // Cream belly patch low on the dome.
  ell(-30, 108, 120, 46, 0, CREAM);
  // Spines: short ink strokes over the dome.
  for (var i = 0; i < SPINES.length; i++) {
    var s = SPINES[i];
    seg(s[0], s[1], s[2], s[3], 7, INK);
  }
  // Long cream snout tapering right.
  blob(CREAM, [128, -18, 200, -6, 252, 12, 268, 26, 252, 38, 196, 52, 132, 52, 122, 16, 128, -18]);
  circ(112, -2, 6.5, INK);
  // Feet.
  ell(-96, 158, 26, 11, 0, INK); ell(52, 158, 26, 11, 0, INK);
}

function drawFox() {
  // Back leg trailing, front leg reaching down-forward.
  seg(-104, 52, -168, 148, 25, ORANGE); circ(-176, 158, 14, INK);
  seg(112, 78, 178, 178, 25, ORANGE); circ(186, 188, 14, INK);
  // Great tail streaming back behind, cream tip.
  blob(ORANGE, [-118, -34, -186, -84, -256, -88, -284, -44, -268, 2, -198, 26, -126, 34, -116, 8, -114, -10, -118, -34]);
  blob(CREAM, [-284, -44, -266, -78, -238, -84, -208, -66, -224, -38, -252, -20, -284, -44]);
  // Body, pouncing diagonal.
  ell(-6, -4, 152, 80, -0.3, ORANGE);
  // Cream chest.
  ell(64, 34, 82, 54, -0.3, CREAM);
  // Head low at the front.
  circ(148, 52, 59, ORANGE);
  // Pointed ears with ink tips.
  blob(ORANGE, [100, 10, 106, -52, 124, -66, 136, -54, 140, -4, 120, 6, 100, 10]);
  blob(INK, [110, -36, 116, -58, 126, -64, 134, -50, 130, -30, 118, -28, 110, -36]);
  blob(ORANGE, [156, -4, 180, -54, 198, -58, 204, -42, 190, 6, 166, 8, 156, -4]);
  blob(INK, [174, -32, 186, -52, 198, -58, 202, -44, 192, -24, 180, -22, 174, -32]);
  // Cream muzzle, ink nose, one closed happy eye.
  ell(186, 78, 38, 25, 0, CREAM);
  circ(220, 70, 9.5, INK);
  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(146, 46, 11, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
}

function drawGazelle() {
  // Leaping legs tucked out of the body's underside,
  // ink hooves.
  seg(64, -6, 116, 66, 15, MUSTARD); circ(122, 70, 8, INK);
  seg(84, -2, 146, 44, 13, MUSTARD); circ(152, 46, 7, INK);
  seg(-70, -6, -124, 68, 15, MUSTARD); circ(-130, 72, 8, INK);
  seg(-90, -2, -146, 42, 13, MUSTARD); circ(-152, 44, 7, INK);
  // Body, rounder than a disc, with the cream
  // underside breaking its lower outline.
  ell(-2, -30, 118, 64, 0, MUSTARD);
  ell(-2, 18, 76, 26, 0, CREAM);
  // Long neck and head.
  seg(78, -62, 136, -140, 46, MUSTARD);
  ell(160, -154, 48, 25, -0.3, MUSTARD);
  ell(198, -140, 16, 10, -0.3, CREAM);
  circ(203, -139, 5.5, INK);
  // Ear and the two curved ink horns sweeping back.
  ell(128, -160, 15, 7, -0.6, MUSTARD);
  curve(142, -166, 118, -208, 84, -214, 7, INK);
  curve(156, -170, 140, -214, 108, -226, 7, INK);
  circ(154, -154, 6, INK);
  // Tail flick.
  curve(-126, -56, -152, -42, -156, -14, 9, INK);
}

function drawHamster() {
  // Round golden body.
  circ(0, 8, 132, MUSTARD);
  // Ears with coral inners.
  circ(-82, -94, 31, MUSTARD); circ(82, -94, 31, MUSTARD);
  circ(-82, -94, 16, CORAL); circ(82, -94, 16, CORAL);
  // Cream cheek pouches, famously full.
  circ(-72, 46, 53, CREAM); circ(72, 46, 53, CREAM);
  // Face: dot eyes, coral nose, small mouth, whiskers.
  circ(-36, -28, 7.5, INK); circ(36, -28, 7.5, INK);
  ell(0, 4, 10, 7, 0, CORAL);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 10, 12, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
  seg(-52, 8, -108, -2, 2.6, INK); seg(-52, 18, -106, 22, 2.6, INK);
  seg(52, 8, 108, -2, 2.6, INK); seg(52, 18, 106, 22, 2.6, INK);
  // Paws and feet in cream.
  circ(-98, 66, 17, CREAM); circ(98, 66, 17, CREAM);
  ell(-54, 132, 27, 12, 0, CREAM); ell(54, 132, 27, 12, 0, CREAM);
}

// ---- the card table --------------------------------------
// Fixed authored deck, letters A-H in the prompt's
// observed order. Frame one is the FOX card (index 5),
// the piece's title card. Fact lines: the fox line is
// the prompt's verbatim; the other seven follow her
// exact pattern.
var CARDS = [
  { letter: 'A', name: 'axolotl', draw: drawAxolotl, fact: 'A is for axolotl - and for adorable, aquatic, and ancient!' },
  { letter: 'B', name: 'beaver', draw: drawBeaver, fact: 'B is for beaver - and for busy, buck-toothed, and building!' },
  { letter: 'C', name: 'caterpillar', draw: drawCaterpillar, fact: 'C is for caterpillar - and for creeping, chewing, and changing!' },
  { letter: 'D', name: 'dolphin', draw: drawDolphin, fact: 'D is for dolphin - and for diving, dancing, and daydreaming!' },
  { letter: 'E', name: 'echidna', draw: drawEchidna, fact: 'E is for echidna - and for spiky, shy, and surprising!' },
  { letter: 'F', name: 'fox', draw: drawFox, fact: 'F is for fox - and for fascinating, furry, and fast!' },
  { letter: 'G', name: 'gazelle', draw: drawGazelle, fact: 'G is for gazelle - and for graceful, gliding, and gone in a flash!' },
  { letter: 'H', name: 'hamster', draw: drawHamster, fact: 'H is for hamster - and for hoarding, hurrying, and hungry!' }
];
if (CARDS.length !== 8) throw new Error('F is for Fox needs exactly 8 cards');
(function () {
  var letters = '';
  for (var i = 0; i < CARDS.length; i++) letters += CARDS[i].letter;
  if (letters !== 'ABCDEFGH') throw new Error('card letters must run A to H');
})();

// ---- the deckle-edged page -------------------------------
// The card is a big page inset in the design space.
// Its edge is a rounded rect sampled into points and
// jittered from the fixed seed, stroked in ink at low
// alpha, with a fainter inner twin: a deckle edge.
var CARD = { x0: 58, y0: 48, x1: 1222, y1: 852 };
var deckle = [], deckleIn = [];
(function () {
  var x0 = CARD.x0, y0 = CARD.y0, x1 = CARD.x1, y1 = CARD.y1, r = 26, i, t;
  function corner(cx, cy, a0) {
    for (var k = 1; k <= 3; k++) { var a = a0 + k * Math.PI / 6; deckle.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  }
  deckle.push([x0 + r, y0]);
  for (i = 1; i <= 14; i++) { t = i / 14; deckle.push([x0 + r + (x1 - x0 - 2 * r) * t, y0]); }
  corner(x1 - r, y0 + r, -Math.PI / 2);
  for (i = 1; i <= 11; i++) { t = i / 11; deckle.push([x1, y0 + r + (y1 - y0 - 2 * r) * t]); }
  corner(x1 - r, y1 - r, 0);
  for (i = 1; i <= 14; i++) { t = i / 14; deckle.push([x1 - r - (x1 - x0 - 2 * r) * t, y1]); }
  corner(x0 + r, y1 - r, Math.PI / 2);
  for (i = 1; i <= 11; i++) { t = i / 11; deckle.push([x0, y1 - r - (y1 - y0 - 2 * r) * t]); }
  corner(x0 + r, y0 + r, Math.PI);
  for (i = 0; i < deckle.length; i++) {
    deckle[i][0] += (rnd() * 2 - 1) * 2.2;
    deckle[i][1] += (rnd() * 2 - 1) * 2.2;
    deckleIn.push([640 + (deckle[i][0] - 640) * 0.978, 450 + (deckle[i][1] - 450) * 0.972]);
  }
})();

function strokePath(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.stroke();
}

function drawPage() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);
  ctx.strokeStyle = INK; ctx.lineWidth = 2.2; ctx.globalAlpha = 0.16;
  strokePath(deckle);
  ctx.lineWidth = 1.4; ctx.globalAlpha = 0.08;
  strokePath(deckleIn);
  ctx.globalAlpha = 1;
}

// ---- one card's content ----------------------------------
// Letter huge at left-centre (about 60 percent of the
// canvas height), wobbling one degree on the 12s loop;
// animal overlapping it, breathing 0.98-1.02 on the
// same whole cycle; fact line lettered beneath.
var LETTER_C = { x: 336, y: 402 };
var ANIMAL_A = { x: 782, y: 462 };

function drawContent(idx, typed, lt) {
  var card = CARDS[idx];
  var ph = Math.PI * 2 * lt / LOOP;
  // The letter, coral fill with a darker ink edge.
  ctx.save();
  ctx.translate(LETTER_C.x, LETTER_C.y);
  ctx.rotate(Math.sin(ph) * Math.PI / 180);
  ctx.font = '700 740px ' + SERIF;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = CORAL;
  ctx.fillText(card.letter, 0, 26);
  ctx.globalAlpha = 0.3;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.6;
  ctx.strokeText(card.letter, 0, 26);
  ctx.globalAlpha = 1;
  ctx.restore();
  // A soft ground shadow under the animal (ink, flat alpha).
  ctx.globalAlpha = 0.07;
  ell(ANIMAL_A.x, ANIMAL_A.y + 218, 252, 24, 0, INK);
  ctx.globalAlpha = 1;
  // The animal, breathing about its anchor.
  var br = 1 + 0.02 * Math.sin(ph);
  ctx.save();
  ctx.translate(ANIMAL_A.x, ANIMAL_A.y);
  ctx.scale(br, br);
  card.draw();
  ctx.restore();
  // The fact line, typed in character by character.
  var shown = card.fact.substring(0, Math.floor(typed));
  if (shown.length > 0) {
    var size = 37;
    ctx.font = size + 'px ' + SERIF;
    var wdt = ctx.measureText(card.fact).width;
    if (wdt > 1050) {
      size = Math.floor(size * 1050 / wdt);
      ctx.font = size + 'px ' + SERIF;
    }
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(shown, DW / 2, 796);
  }
}

// ---- deck state ------------------------------------------
// Constant first-frame phase: T = 4.7s into the 12s
// loop (breathing and wobble mid-swing), fox card up,
// fact line fully typed, no wipe running. Frame one is
// drawn synchronously at this constant; the rAF loop
// advances T from the same anchor in fixed ticks.
// Frame one never reads a wall clock.
var T = 4.7;
var cardIdx = 5; // fox
var prevIdx = 5, prevTyped = CARDS[5].fact.length;
var typedF = CARDS[5].fact.length;
var wipeT = 1; // 1 = idle
var WIPE_LEN = 0.7, TYPE_RATE = 26; // chars per second
var lastNow = -1, acc = 0;

function step() {
  if (wipeT < 1) {
    wipeT = Math.min(1, wipeT + TICK / WIPE_LEN);
  } else if (typedF < CARDS[cardIdx].fact.length) {
    typedF = Math.min(CARDS[cardIdx].fact.length, typedF + TICK * TYPE_RATE);
  }
}

function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

function draw() {
  var lt = T % LOOP;
  drawPage();
  if (wipeT >= 1) {
    drawContent(cardIdx, typedF, lt);
    return;
  }
  // Page-turn wipe: the old card holds, the new card
  // is revealed behind a travelling page edge that
  // sweeps right to left across the card.
  drawContent(prevIdx, prevTyped, lt);
  var p = easeInOut(wipeT);
  var bx = (CARD.x1 + 40) + ((CARD.x0 - 40) - (CARD.x1 + 40)) * p;
  ctx.save();
  ctx.beginPath();
  ctx.rect(bx, 0, DW - bx + 2400, DH);
  ctx.clip();
  drawContent(cardIdx, 0, lt);
  ctx.restore();
  // The turning page's edge: a pale band and a fine line.
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = INK;
  ctx.fillRect(bx - 17, CARD.y0, 34, CARD.y1 - CARD.y0);
  ctx.globalAlpha = 0.3;
  ctx.fillRect(bx - 1, CARD.y0, 2, CARD.y1 - CARD.y0);
  ctx.globalAlpha = 1;
}

// ---- double-tap: turn the page ---------------------------
// A tap is a press and release close together in
// design space. Two taps within 0.4s of the piece
// clock turn the page to the next card in the table,
// wrapping after H back to A. A single tap does
// nothing; the card never reloads.
var downX = -1, downY = -1, downT = 0, lastTapT = -10;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
});
canvas.addEventListener('pointerup', function (e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved >= 28 || held >= 0.8) return;
  if (T - lastTapT < 0.4) {
    lastTapT = -10;
    if (wipeT >= 1) {
      prevIdx = cardIdx;
      prevTyped = typedF;
      cardIdx = (cardIdx + 1) % CARDS.length;
      wipeT = 0;
      typedF = 0;
    }
  } else {
    lastTapT = T;
  }
});

// ---- sizing: centred fit, page ground = paper tone -------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
