<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J Walks Like a Collie</title>
<style>
html, body { margin: 0; padding: 0; background: #F4F4F6; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = [244, 244, 246];
var INK = [43, 43, 46];
var LABEL = [142, 142, 147];
var STRIDE = [216, 216, 220];
var ORANGE = [224, 122, 63];
var NEARBLACK = [26, 26, 26];
var PHASE = 2.5;
var SEED = 1607007;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}

/* ---- four breed presets: one parametric quadruped rig, four walks ---- */
/* leg phases: walk gait, quarter-cycle apart: FL 0, BR .25, FR .5, BL .75 */
var BREEDS = [
  { code: 'J', cjk: '邊牧', name: 'COLLIE', bodyLen: 1.55, bodyH: 0.40, legLen: 0.62,
    stride: 0.42, cadence: 0.75, bob: 0.030, lift: 0.16, headLen: 0.44, headH: 0.17,
    muzzle: 0.30, tail: 'plume', ears: 'flop', color: NEARBLACK, phase: 0.0,
    accent: 'blaze' },
  { code: 'K', cjk: '柴犬', name: 'SHIBA', bodyLen: 1.25, bodyH: 0.42, legLen: 0.48,
    stride: 0.24, cadence: 1.50, bob: 0.050, lift: 0.20, headLen: 0.34, headH: 0.20,
    muzzle: 0.20, tail: 'curled', ears: 'point', color: INK, phase: 1.9,
    accent: 'collar' },
  { code: 'M', cjk: '灰狗', name: 'SIGHTHOUND', bodyLen: 1.45, bodyH: 0.34, legLen: 0.72,
    stride: 0.50, cadence: 0.65, bob: 0.040, lift: 0.14, headLen: 0.48, headH: 0.15,
    muzzle: 0.34, tail: 'long', ears: 'fold', color: INK, phase: 3.4,
    accent: 'none' },
  { code: 'L', cjk: '柯基', name: 'CORGI', bodyLen: 1.50, bodyH: 0.44, legLen: 0.36,
    stride: 0.30, cadence: 1.70, bob: 0.060, lift: 0.22, headLen: 0.36, headH: 0.22,
    muzzle: 0.22, tail: 'nub', ears: 'crop', color: INK, phase: 4.8,
    accent: 'none' }
];
/* seeded per-creature wobble phases: fixed authored values, never Math.random */
var WOBBLE = (function () {
  var rng = mulberry32(SEED);
  var out = [], i;
  for (i = 0; i < 4; i++) out.push(rng() * TAU);
  return out;
})();
var LEG_PHASE = [0, 0.5, 0.75, 0.25]; /* FL, FR, BL, BR in cycle fractions */
var LEG_FAR = [false, true, false, true]; /* FR and BR are the far side */
var LEG_FRONT = [true, true, false, false];

function dot(x, y, r) {
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, TAU);
}

/* one leg: two-segment stroke from attach to foot, knee bent per front/hind */
function drawLeg(b, h, ax, ay, fx, fy, front, alpha) {
  var bend = front ? -0.05 : 0.05;
  var kx = (ax + fx) / 2 + bend * b.legLen * h;
  var ky = (ay + fy) / 2 - 0.02 * b.legLen * h;
  ctx.strokeStyle = rgba(b.color, alpha);
  ctx.lineWidth = Math.max(1.2, 0.085 * h);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.quadraticCurveTo(kx, ky, fx, fy);
  ctx.stroke();
  /* paw */
  ctx.fillStyle = rgba(b.color, alpha);
  ctx.beginPath();
  dot(fx, fy - Math.max(1, 0.012 * h), Math.max(1.2, 0.028 * h));
  ctx.fill();
}

function drawEars(b, h, hx, hy) {
  var e = b.ears, s = h;
  ctx.fillStyle = rgba(b.color, 1);
  ctx.beginPath();
  if (e === 'point') {
    /* two upright triangles */
    ctx.moveTo(hx - 0.10 * s, hy - 0.05 * s);
    ctx.lineTo(hx - 0.07 * s, hy - 0.24 * s);
    ctx.lineTo(hx - 0.01 * s, hy - 0.06 * s);
    ctx.closePath();
    ctx.moveTo(hx + 0.02 * s, hy - 0.06 * s);
    ctx.lineTo(hx + 0.06 * s, hy - 0.24 * s);
    ctx.lineTo(hx + 0.11 * s, hy - 0.05 * s);
    ctx.closePath();
  } else if (e === 'crop') {
    /* short cropped upright triangles */
    ctx.moveTo(hx - 0.09 * s, hy - 0.05 * s);
    ctx.lineTo(hx - 0.06 * s, hy - 0.15 * s);
    ctx.lineTo(hx - 0.01 * s, hy - 0.06 * s);
    ctx.closePath();
    ctx.moveTo(hx + 0.02 * s, hy - 0.06 * s);
    ctx.lineTo(hx + 0.05 * s, hy - 0.15 * s);
    ctx.lineTo(hx + 0.10 * s, hy - 0.05 * s);
    ctx.closePath();
  } else if (e === 'fold') {
    /* small folded ears lying back */
    ctx.moveTo(hx - 0.09 * s, hy - 0.06 * s);
    ctx.lineTo(hx - 0.16 * s, hy - 0.10 * s);
    ctx.lineTo(hx - 0.08 * s, hy - 0.01 * s);
    ctx.closePath();
    ctx.moveTo(hx + 0.01 * s, hy - 0.06 * s);
    ctx.lineTo(hx - 0.05 * s, hy - 0.11 * s);
    ctx.lineTo(hx + 0.03 * s, hy - 0.01 * s);
    ctx.closePath();
  } else {
    /* flop: long semi-flop ears, one pricked, one folded over */
    ctx.moveTo(hx - 0.10 * s, hy - 0.05 * s);
    ctx.lineTo(hx - 0.08 * s, hy - 0.22 * s);
    ctx.lineTo(hx - 0.02 * s, hy - 0.05 * s);
    ctx.closePath();
    ctx.moveTo(hx + 0.02 * s, hy - 0.05 * s);
    ctx.lineTo(hx + 0.10 * s, hy - 0.13 * s);
    ctx.lineTo(hx + 0.13 * s, hy - 0.02 * s);
    ctx.closePath();
  }
  ctx.fill();
}

function drawTail(b, h, tx, ty) {
  var t = b.tail, s = h;
  if (t === 'nub') {
    ctx.fillStyle = rgba(b.color, 1);
    ctx.beginPath();
    dot(tx - 0.04 * s, ty, Math.max(1.5, 0.032 * s));
    ctx.fill();
    return;
  }
  ctx.strokeStyle = rgba(b.color, 1);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  if (t === 'plume') {
    /* long bushy tail, sweeping up then down behind */
    ctx.lineWidth = Math.max(2, 0.075 * s);
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx - 0.22 * s, ty - 0.10 * s, tx - 0.34 * s, ty + 0.06 * s);
  } else if (t === 'curled') {
    /* curled tail: spiral over the back */
    ctx.lineWidth = Math.max(1.5, 0.05 * s);
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx - 0.16 * s, ty - 0.02 * s, tx - 0.20 * s, ty - 0.16 * s);
    ctx.quadraticCurveTo(tx - 0.22 * s, ty - 0.28 * s, tx - 0.10 * s, ty - 0.27 * s);
    ctx.quadraticCurveTo(tx - 0.02 * s, ty - 0.26 * s, tx - 0.05 * s, ty - 0.18 * s);
  } else {
    /* long: thin tail hanging in a low curve */
    ctx.lineWidth = Math.max(1.2, 0.035 * s);
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx - 0.20 * s, ty + 0.02 * s, tx - 0.30 * s, ty + 0.16 * s);
  }
  ctx.stroke();
}

function drawCreature(b, idx, cx, gy, h, t) {
  var ph = TAU * b.cadence * t + b.phase;
  var bobY = -b.bob * h * Math.sin(2 * ph + 0.5);
  var wob = 0.012 * Math.sin(t * 0.9 + WOBBLE[idx]);
  ctx.save();
  ctx.translate(cx, gy);
  ctx.rotate(wob);
  var hipY = (b.legLen + b.bodyH * 0.35) * h;
  var bodyCY = -hipY + bobY;
  var bodyRX = b.bodyLen * h / 2, bodyRY = b.bodyH * h / 2;
  var frontX = 0.36 * b.bodyLen * h, backX = -0.36 * b.bodyLen * h;
  var attachY = bodyCY + 0.12 * b.bodyH * h;
  var i, lp, sw, lift, fx, fy;
  /* far-side legs first */
  for (i = 0; i < 4; i++) {
    if (!LEG_FAR[i]) continue;
    lp = ph + LEG_PHASE[i] * TAU;
    sw = Math.sin(lp);
    lift = b.lift * h * Math.max(0, Math.sin(lp));
    fx = (LEG_FRONT[i] ? frontX : backX) + b.stride * h * sw;
    fy = -lift;
    drawLeg(b, h, LEG_FRONT[i] ? frontX : backX, attachY, fx, fy, LEG_FRONT[i], 0.38);
  }
  /* tail behind the body */
  drawTail(b, h, -bodyRX + 0.02 * h, bodyCY - 0.05 * b.bodyH * h);
  /* body: flat ink ellipse */
  ctx.fillStyle = rgba(b.color, 1);
  ctx.beginPath();
  ctx.ellipse(0, bodyCY, bodyRX, bodyRY, 0, 0, TAU);
  ctx.fill();
  /* neck and head */
  var headCX = 0.52 * b.bodyLen * h;
  var headCY = bodyCY - (0.30 * h + 0.10 * b.bodyH * h);
  var headRX = b.headLen * h / 2, headRY = b.headH * h / 2;
  ctx.fillStyle = rgba(b.color, 1);
  ctx.beginPath();
  ctx.moveTo(0.30 * b.bodyLen * h, bodyCY - 0.05 * h);
  ctx.lineTo(headCX - headRX * 0.4, headCY + headRY * 0.6);
  ctx.lineTo(headCX + headRX * 0.3, headCY + headRY * 0.7);
  ctx.lineTo(0.42 * b.bodyLen * h, bodyCY + 0.02 * h);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(headCX, headCY, headRX, headRY, -0.12, 0, TAU);
  ctx.fill();
  /* muzzle */
  ctx.beginPath();
  ctx.ellipse(headCX + headRX * 0.85, headCY + headRY * 0.25, b.muzzle * h / 2, headRY * 0.55, 0, 0, TAU);
  ctx.fill();
  /* nose */
  ctx.fillStyle = rgba(NEARBLACK, 1);
  ctx.beginPath();
  dot(headCX + headRX * 0.85 + b.muzzle * h / 2, headCY + headRY * 0.25, Math.max(1.2, 0.022 * h));
  ctx.fill();
  /* eye: a ground-coloured dot on the ink head */
  ctx.fillStyle = rgba(GROUND, 1);
  ctx.beginPath();
  dot(headCX + headRX * 0.25, headCY - headRY * 0.15, Math.max(1, 0.014 * h));
  ctx.fill();
  drawEars(b, h, headCX, headCY - headRY * 0.7);
  /* breed accents */
  if (b.accent === 'blaze') {
    ctx.fillStyle = rgba(GROUND, 1);
    ctx.beginPath();
    ctx.ellipse(0.46 * b.bodyLen * h, bodyCY + 0.02 * h, 0.06 * h, 0.11 * h, 0.3, 0, TAU);
    ctx.fill();
  } else if (b.accent === 'collar') {
    ctx.strokeStyle = rgba(ORANGE, 1);
    ctx.lineWidth = Math.max(1.5, 0.035 * h);
    ctx.beginPath();
    ctx.arc(0.34 * b.bodyLen * h, bodyCY - 0.02 * h, 0.16 * h, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
  }
  /* near-side legs over the body edge */
  for (i = 0; i < 4; i++) {
    if (LEG_FAR[i]) continue;
    lp = ph + LEG_PHASE[i] * TAU;
    sw = Math.sin(lp);
    lift = b.lift * h * Math.max(0, Math.sin(lp));
    fx = (LEG_FRONT[i] ? frontX : backX) + b.stride * h * sw;
    fy = -lift;
    drawLeg(b, h, LEG_FRONT[i] ? frontX : backX, attachY, fx, fy, LEG_FRONT[i], 1);
  }
  ctx.restore();
}

function drawStrideLine(b, cx, gy, h, t) {
  var ph = TAU * b.cadence * t + b.phase;
  var half = b.stride * h;
  var pulse = 0.65 + 0.30 * Math.sin(2 * ph);
  var a = clamp(pulse, 0.35, 0.95);
  ctx.strokeStyle = rgba(STRIDE, a);
  ctx.lineWidth = Math.max(1, 0.016 * h);
  ctx.setLineDash([Math.max(3, 0.05 * h), Math.max(3, 0.04 * h)]);
  ctx.beginPath();
  ctx.moveTo(cx - half, gy + 0.06 * h);
  ctx.lineTo(cx + half, gy + 0.06 * h);
  ctx.stroke();
  ctx.setLineDash([]);
  /* end ticks */
  ctx.beginPath();
  ctx.moveTo(cx - half, gy + 0.02 * h);
  ctx.lineTo(cx - half, gy + 0.10 * h);
  ctx.moveTo(cx + half, gy + 0.02 * h);
  ctx.lineTo(cx + half, gy + 0.10 * h);
  ctx.stroke();
}

function draw(t) {
  size();
  ctx.fillStyle = 'rgb(' + GROUND[0] + ',' + GROUND[1] + ',' + GROUND[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var rect = compRect();
  var h = Math.min(0.19 * rect.h, 0.16 * rect.w);
  var labelPx = Math.max(11, Math.min(15, 0.016 * Math.min(VW, VH)));
  var paramPx = Math.max(9, labelPx - 2);
  var i, qx, qy, cx, gy;
  for (i = 0; i < 4; i++) {
    qx = i % 2; qy = Math.floor(i / 2);
    cx = rect.x + rect.w * (0.25 + 0.5 * qx);
    qy = rect.y + rect.h * (0.25 + 0.5 * qy);
    gy = qy + 0.07 * rect.h;
    drawStrideLine(BREEDS[i], cx, gy, h, t);
    drawCreature(BREEDS[i], i, cx, gy, h, t);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = labelPx + 'px monospace';
    ctx.fillStyle = rgba(LABEL, 1);
    ctx.fillText(BREEDS[i].code + ' ' + BREEDS[i].cjk + ' ' + BREEDS[i].name,
      cx, gy + 0.16 * h + 4);
    ctx.font = paramPx + 'px monospace';
    ctx.fillStyle = rgba(LABEL, 0.85);
    ctx.fillText('stride ' + (2 * BREEDS[i].stride).toFixed(2) + ' · ' +
      BREEDS[i].cadence.toFixed(2) + ' Hz',
      cx, gy + 0.16 * h + 4 + labelPx + 4);
  }
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof window !== 'undefined') {
  window.__collie1607 = { draw: draw, BREEDS: BREEDS };
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
