<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forty-Two</title>
<style>
  html, body { margin: 0; padding: 0; background: #0D0F0C; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG only. No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var BG = '#0D0F0C';
  var PHOSPHOR = '#D8E2D0';
  var GRAY = '#8A8F86';
  var AMBER = '#C8871E';
  var CURSOR = '#F2F2F2';

  // Closed vocabulary: names, places, book titles, street nouns only.
  // Never slogans, never sentences. Words are DATA, not message.
  var VOCAB = [
    "MAMA'S", 'BOOKSTORE', 'HARLEM', 'SHELF', 'DUST', 'EBONY',
    'CORNER', 'WINDOW', 'LEDGER', 'ARCHIVE', 'PAPER', 'INK',
    'STOOP', 'AVENUE', 'READING', 'BINDING', 'ATLAS', 'MARKET',
    'LETTER', 'PHOTO', 'RECORD', 'COUNTER', 'STACKS', 'AISLE',
    'COVER', 'SPINE', 'LAMP', 'CHAIR', 'DOORWAY', 'STREET',
    'BRONX', 'QUEENS', 'STATION', 'KITCHEN', 'MIRROR', 'CLOCK',
    'TABLE', 'BENCH', 'CURTAIN', 'STAIR', 'BASEMENT', 'ROOFTOP'
  ];

  var W = 0, H = 0, S = 1, isPhone = false;
  var lastT = 0;
  var reseedCount = 0;
  var lastTapMs = -1000;
  var layoutCache = null;

  function poolRng() {
    return mulberry32(4242 + reseedCount * 104729);
  }

  // A shuffled pool order derived from the seeded pool. Double-tap
  // advances reseedCount, so the pool order changes for every later
  // assembly and for the dataset stream.
  function poolOrder() {
    var rng = poolRng();
    var arr = VOCAB.slice();
    var i, j, tmp;
    for (i = arr.length - 1; i > 0; i--) {
      j = Math.floor(rng() * (i + 1));
      tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function size() {
    var vw, vh;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      vw = visualViewport.width; vh = visualViewport.height;
    } else if (typeof window !== 'undefined' && window.visualViewport) {
      vw = window.visualViewport.width; vh = window.visualViewport.height;
    } else {
      vw = window.innerWidth; vh = window.innerHeight;
    }
    W = Math.round(vw); H = Math.round(vh);
    var sw = 0, sh = 0;
    try {
      if (window.screen) { sw = window.screen.width; sh = window.screen.height; }
    } catch (e) { sw = 0; sh = 0; }
    var minScreen = (sw && sh) ? Math.min(sw, sh) : 9999;
    isPhone = (minScreen < 700) || (H > W * 1.15);
    // Field-like composition: full-bleed on every screen.
    // Page ground is the monitor black either way.
    S = Math.min(W, H) / 720;
    canvas.width = W; canvas.height = H;
    if (canvas.style) {
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
    }
    layoutCache = null;
  }

  function font(px, weight) {
    return (weight || '500') + ' ' + Math.round(px) + 'px "Courier New", Courier, monospace';
  }

  function buildLayout() {
    if (layoutCache && layoutCache.w === W && layoutCache.h === H &&
        layoutCache.reseed === reseedCount) {
      return layoutCache;
    }
    var pool = poolOrder();
    var lay = { w: W, h: H, reseed: reseedCount, pool: pool };
    // Dataset stream lanes: three rows of small type in the bottom third.
    lay.lanes = [];
    var laneDefs = [
      { y: 0.70, size: 0.024, speed: 14, take: 22 },
      { y: 0.79, size: 0.020, speed: 23, take: 26 },
      { y: 0.88, size: 0.027, speed: 31, take: 20 }
    ];
    var li, wi;
    for (li = 0; li < laneDefs.length; li++) {
      var def = laneDefs[li];
      var rng = mulberry32(9100 + li * 7919 + reseedCount * 104729);
      var words = [];
      for (wi = 0; wi < def.take; wi++) {
        words.push(pool[Math.floor(rng() * pool.length)]);
      }
      ctx.font = font(H * def.size, '400');
      var items = [];
      var total = 0;
      for (wi = 0; wi < words.length; wi++) {
        var wd = ctx.measureText(words[wi]).width;
        items.push({ word: words[wi], width: wd });
        total += wd + 30 * S;
      }
      lay.lanes.push({
        y: def.y, size: def.size, speed: def.speed,
        items: items, total: total
      });
    }
    layoutCache = lay;
    return lay;
  }

  // Assembly for a given cycle index: seeded word choice and flow layout.
  // Cached per (cycle, reseed, size) so a double-tap reseeds visibly.
  var asmCache = null;
  function assembly(cycle) {
    if (asmCache && asmCache.cycle === cycle && asmCache.w === W &&
        asmCache.h === H && asmCache.reseed === reseedCount) {
      return asmCache;
    }
    var rng = mulberry32(1314000 + cycle * 7919 + reseedCount * 104729);
    var pool = poolOrder();
    var n = 8 + Math.floor(rng() * 4);
    var picked = [];
    var i;
    for (i = 0; i < n; i++) {
      picked.push(pool[Math.floor(rng() * pool.length)]);
    }
    // Flow layout inside the poetry field, staggered like concrete poetry.
    var x0 = W * 0.08, x1 = W * 0.92;
    var y0 = H * 0.15, y1 = H * 0.62;
    var base = H * 0.052;
    var scale = 1.0;
    var placed = null;
    var attempt;
    for (attempt = 0; attempt < 3 && !placed; attempt++) {
      var rows = [];
      var row = { words: [], y: y0, maxFs: 0 };
      var x = x0 + rng() * 60 * S;
      var ok = true;
      for (i = 0; i < picked.length; i++) {
        var fs = base * scale * (0.85 + rng() * 0.9);
        ctx.font = font(fs, '600');
        var wwd = ctx.measureText(picked[i]).width;
        if (x + wwd > x1 && row.words.length > 0) {
          rows.push(row);
          row = { words: [], y: 0, maxFs: 0 };
          x = x0 + rng() * 80 * S;
        }
        row.words.push({
          word: picked[i], fs: fs, width: wwd, x: x,
          rot: (rng() - 0.5) * 0.08
        });
        if (fs > row.maxFs) { row.maxFs = fs; }
        x += wwd + (18 + rng() * 30) * S;
      }
      rows.push(row);
      var yy = y0;
      var k;
      for (k = 0; k < rows.length; k++) {
        rows[k].y = yy;
        yy += rows[k].maxFs * 1.55;
      }
      if (yy <= y1 + base * 0.5 || attempt === 2) {
        placed = rows;
      } else {
        scale *= 0.82;
      }
    }
    asmCache = { cycle: cycle, w: W, h: H, reseed: reseedCount, rows: placed };
    return asmCache;
  }

  function clamp01(v) {
    return v < 0 ? 0 : (v > 1 ? 1 : v);
  }

  function smooth(v) {
    v = clamp01(v);
    return v * v * (3 - 2 * v);
  }

  function draw(t) {
    lastT = t;
    var lay = buildLayout();
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var mx = W * 0.06, my = H * 0.07;

    // Timestamp, top-right: real local time quantized to whole minutes,
    // so renders inside the same minute byte-match.
    var now = new Date();
    var hh = now.getHours();
    var mm = now.getMinutes();
    var stamp = (hh < 10 ? '0' + hh : '' + hh) + ':' +
                (mm < 10 ? '0' + mm : '' + mm);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.font = font(Math.max(14, H * 0.030), '600');
    ctx.fillStyle = AMBER;
    ctx.fillText(stamp, W - mx, my + H * 0.030);

    // Cursor line beneath the timestamp: blinking block plus an
    // occasionally typed-then-deleted fragment (the quotidian gesture).
    var fragCycle = 42;
    var fragPhase = t % fragCycle;
    var fragIdx = Math.floor(t / fragCycle);
    var frng = mulberry32(77000 + fragIdx * 7919 + reseedCount * 104729);
    var fragWord = lay.pool[Math.floor(frng() * lay.pool.length)];
    var shown = 0;
    if (fragPhase >= 8 && fragPhase < 20) {
      shown = Math.floor((fragPhase - 8) / 0.45);
    } else if (fragPhase >= 20 && fragPhase < 26) {
      shown = fragWord.length;
    } else if (fragPhase >= 26 && fragPhase < 34) {
      shown = fragWord.length - Math.floor((fragPhase - 26) / 0.35);
    }
    if (shown < 0) { shown = 0; }
    if (shown > fragWord.length) { shown = fragWord.length; }
    var fragText = fragWord.slice(0, shown);
    var cy = my + H * 0.030 + H * 0.052;
    ctx.font = font(Math.max(13, H * 0.024), '500');
    ctx.fillStyle = PHOSPHOR;
    ctx.fillText(fragText, W - mx - 16 * S, cy);
    // Blink: closed-form function of piece time.
    if (Math.floor(t * 1.6) % 2 === 0) {
      ctx.fillStyle = CURSOR;
      ctx.fillRect(W - mx - 10 * S, cy - H * 0.024, 9 * S, H * 0.026);
    }

    // Poetry field: 16 s cycle, phase-shifted so frame one (t = 0)
    // opens in the hold phase with the assembly fully visible.
    var cycLen = 16;
    var phase = (t + 4) % cycLen;
    var cycle = Math.floor((t + 4) / cycLen);
    var asm = assembly(cycle);
    var ri, wi2;
    for (ri = 0; ri < asm.rows.length; ri++) {
      var rrow = asm.rows[ri];
      for (wi2 = 0; wi2 < rrow.words.length; wi2++) {
        var wd = rrow.words[wi2];
        var idx = 0;
        var rr;
        for (rr = 0; rr < ri; rr++) { idx += asm.rows[rr].words.length; }
        idx += wi2;
        var alpha = 0, dy = 0;
        if (phase < 3) {
          // Assemble, staggered.
          var st = idx * (2.2 / 10);
          var p = smooth((phase - st) / 0.8);
          alpha = p; dy = (1 - p) * 14 * S;
        } else if (phase < 8) {
          alpha = 1;
        } else if (phase < 11) {
          // Dissolve, reverse stagger.
          var total = 0;
          for (rr = 0; rr < asm.rows.length; rr++) { total += asm.rows[rr].words.length; }
          var st2 = (total - 1 - idx) * (2.2 / 10);
          alpha = 1 - smooth((phase - 8 - st2) / 0.8);
        } else {
          alpha = 0;
        }
        if (alpha <= 0) { continue; }
        ctx.save();
        ctx.translate(wd.x + wd.width / 2, rrow.y + dy);
        ctx.rotate(wd.rot);
        ctx.font = font(wd.fs, '600');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = PHOSPHOR;
        ctx.globalAlpha = alpha;
        ctx.fillText(wd.word, 0, 0);
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }

    // Hairline above the dataset stream.
    ctx.fillStyle = GRAY;
    ctx.globalAlpha = 0.25;
    ctx.fillRect(mx, H * 0.66, W - 2 * mx, Math.max(1, 1 * S));
    ctx.globalAlpha = 1;

    // Dataset stream: three lanes flowing leftward, closed-form
    // positions from piece time so every frame is reproducible.
    var li2;
    for (li2 = 0; li2 < lay.lanes.length; li2++) {
      var lane = lay.lanes[li2];
      ctx.font = font(H * lane.size, '400');
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      var off = (lane.speed * S * t) % lane.total;
      var xx = -off;
      var guard = 0;
      while (xx < W && guard < 200) {
        var ii;
        for (ii = 0; ii < lane.items.length && xx < W; ii++) {
          var it = lane.items[ii];
          if (xx + it.width > 0) {
            ctx.fillStyle = (ii % 7 === 3) ? PHOSPHOR : GRAY;
            ctx.globalAlpha = (ii % 7 === 3) ? 0.75 : 0.55;
            ctx.fillText(it.word, xx, H * lane.y);
          }
          xx += it.width + 30 * S;
        }
        guard++;
      }
      ctx.globalAlpha = 1;
    }
  }

  function onTap(ev) {
    var ms = Date.now();
    if (ms - lastTapMs < 400) {
      // Double-tap reseeds the vocabulary pool. Never a reload.
      reseedCount++;
      layoutCache = null;
      asmCache = null;
      lastTapMs = -1000;
    } else {
      lastTapMs = ms;
    }
    if (ev && ev.preventDefault) { ev.preventDefault(); }
  }

  size();
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onTap);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { size(); draw(lastT); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(lastT); });
    }
  }

  // Boot flag: frame one is exactly t = 0. The clock starts with the
  // rAF loop; nothing in frame one derives from elapsed time.
  draw(0);

  var startTime = -1;
  function loop(now) {
    if (startTime < 0) { startTime = now; }
    draw((now - startTime) / 1000);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
