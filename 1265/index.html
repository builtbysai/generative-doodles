<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proper Table Setting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #201C16; overflow: hidden; }
  canvas { display: block; background: #201C16; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- palette (SF2, verbatim) ----
  var HANJI = '#EDE6D2', CELADON = '#A8B89A', SUMI = '#26241F',
      TEA = '#C9A86A', GOLD = '#D9A441', TABLE = '#201C16';

  // ---- viewport (Visual Viewport API, never window.innerWidth alone) ----
  var W = 0, H = 0, SCALE = 1, OX = 0, OY = 0;
  var SW = 1000, SH = 1000; // square scene space
  function resize() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
    SCALE = Math.min(W / SW, H / SH);
    OX = (W - SW * SCALE) / 2;
    OY = (H - SH * SCALE) / 2;
  }
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  function pin() {
    canvas.style.width = Math.round(W) + 'px';
    canvas.style.height = Math.round(H) + 'px';
  }

  // ---- phone detection (window.screen physical size, aspect fallback) ----
  function isPhone() {
    var s = window.screen;
    var minDim = Math.min(s.width, s.height);
    if (minDim < 700) return true;
    return H > W * 1.15;
  }

  // ---- deterministic time: constant phase at load, loop anchored to load ----
  var T0 = Date.now();
  function now() { return (Date.now() - T0) / 1000; }

  // ---- seeded RNG (mulberry32, integer hash only) ----
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- helpers (node-canvas safe: moveTo before every batched arc) ----
  function dot(x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function ellipse(x, y, rx, ry, color) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function ring(x, y, r, color, w) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.stroke();
  }
  function poly(pts, color) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
  function line(x1, y1, x2, y2, color, w) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.stroke();
  }
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  // ---- story bank: plain and specific, never sentimental ----
  var STORIES = [
    'set for the sister who never visits',
    'set for the uncle who salts everything twice',
    'set for the neighbour who brought soup in 2019',
    'set for the daughter home from Seoul',
    'set for the friend who always takes the corner seat',
    'set for the grandfather who eats standing up',
    'set for the cousin who only drinks barley tea',
    'set for the aunt who counts the spoons',
    'set for the brother who arrives after dessert',
    'set for the mother who sets the table before anyone asks',
    'set for the student who stayed for kimchi jjigae',
    'set for the stranger from the parking lot supper'
  ];

  // ---- settings: seeded, procedurally unique ----
  var MAX_SETTINGS = 9;
  var RING_R = 280, TABLE_R = 430, CX = 500, CY = 500;
  var settings = []; // {seed, ware, angle, story, addedAt}
  function makeSetting(i, addedAt) {
    var r = rng(1000 + i * 977);
    var ware = Math.floor(r() * 3); // 0 Korean, 1 American, 2 mixed
    return {
      seed: 1000 + i * 977, ware: ware,
      tilt: (r() - 0.5) * 0.9,
      scale: 0.88 + r() * 0.28,
      story: STORIES[i % STORIES.length],
      addedAt: addedAt
    };
  }
  settings.push(makeSetting(0, -100)); // the piece opens with one setting

  // ---- interaction state: closed-form over recorded events and t ----
  var dragRot = 0;            // accumulated rotation from finished drags
  var drag = null;            // active drag {startAngle, lastAngle}
  var taps = [];              // {setting, at} story-reveal taps
  var adds = [];              // {at} guest-book taps (cast-in starts)
  var ROT_RATE = Math.PI * 2 / 300; // one lazy-susan turn per 300 s

  function groupAngle(t) { return ROT_RATE * t + dragRot; }

  function settingAngle(i, t) {
    var n = settings.length;
    var slot = -Math.PI / 2 + (i * Math.PI * 2) / Math.max(n, 1);
    return slot + groupAngle(t);
  }
  function settingPos(i, t) {
    var a = settingAngle(i, t);
    return [CX + RING_R * Math.cos(a), CY + RING_R * Math.sin(a)];
  }

  // cast-in: 10 s from the guest-book tap that added the setting
  function castAlpha(s, t) {
    if (s.addedAt < 0) return 1;
    return Math.max(0, Math.min(1, (t - s.addedAt) / 10));
  }

  // ---- drawing one setting (ware drawn in its own local frame) ----
  function drawSetting(i, t) {
    var s = settings[i];
    var p = settingPos(i, t);
    var a = castAlpha(s, t);
    if (a <= 0) return;
    // tap reveal: lift + turn, closed-form over the tap list
    var lift = 0, turn = 0, storyA = 0;
    for (var k = 0; k < taps.length; k++) {
      if (taps[k].setting !== i) continue;
      var dt = t - taps[k].at;
      if (dt < 0) continue;
      lift = Math.max(lift, Math.min(1, dt / 0.6));
      turn = Math.max(turn, Math.min(0.6, dt * 0.6));
      if (dt < 5) storyA = 1;
      else if (dt < 6) storyA = Math.max(storyA, 1 - (dt - 5));
    }
    var sc = s.scale * (1 + 0.25 * lift);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p[0], p[1]);
    ctx.rotate(s.tilt + turn);
    ctx.scale(sc, sc);
    // soft contact shadow while lifted (flat alpha, no blur)
    if (lift > 0) ellipse(0, 10, 78, 16, 'rgba(0,0,0,0.35)');
    // hanji cast disc with seeded paper grain
    ctx.beginPath();
    ctx.moveTo(88, 0);
    ctx.arc(0, 0, 88, 0, Math.PI * 2);
    ctx.fillStyle = HANJI;
    ctx.fill();
    var gr = rng(s.seed + 5);
    var grainN = Math.floor(26 * a);
    for (var g = 0; g < grainN; g++) {
      var ga = gr() * Math.PI * 2, gd = gr() * 80;
      dot(Math.cos(ga) * gd, Math.sin(ga) * gd, 1.2 + gr() * 1.6, 'rgba(201,168,106,0.5)');
    }
    ring(0, 0, 84, TEA, 1.5);
    // ware, procedurally placed per seed
    var wr = rng(s.seed + 11);
    if (s.ware === 0) {
      // Korean: bowl + spoon + chopsticks
      ellipse(-8, -6, 42, 30, CELADON);
      ellipse(-8, -6, 30, 20, HANJI);
      ellipse(-8, -6, 18, 11, CELADON);
      var sx = 38 + wr() * 8, sy = 18 + wr() * 10;
      ellipse(sx, sy, 9, 13, SUMI);
      line(sx - 4, sy + 12, sx - 10, sy + 34, SUMI, 3);
      line(-52, 44, 52, 30, SUMI, 2.5);
      line(-52, 52, 52, 38, SUMI, 2.5);
    } else if (s.ware === 1) {
      // American: plate + fork + knife
      ring(0, 0, 52, CELADON, 3);
      ring(0, 0, 34, TEA, 1.5);
      dot(0, 0, 6, TEA);
      line(-64, -30, -64, 30, SUMI, 3);
      line(-70, -30, -70, -14, SUMI, 2);
      line(-58, -30, -58, -14, SUMI, 2);
      line(64, -28, 64, 34, SUMI, 3);
      poly([[64, -28], [72, -12], [64, 2]], SUMI);
    } else {
      // mixed: small bowl on a plate
      ring(0, 4, 54, CELADON, 3);
      ellipse(-6, -2, 34, 24, HANJI);
      ellipse(-6, -2, 22, 15, TEA);
      line(48, 30, 62, 52, SUMI, 2.5);
      line(56, 26, 68, 48, SUMI, 2.5);
      dot(-58, 40, 5, TEA);
    }
    ctx.restore();
    // story text, radially outward from the setting, clamped to the scene
    if (storyA > 0) {
      var sa = settingAngle(i, t);
      var tx = p[0] + Math.cos(sa) * 118;
      var ty = p[1] + Math.sin(sa) * 118;
      tx = Math.max(120, Math.min(SW - 120, tx));
      ty = Math.max(60, Math.min(SH - 40, ty));
      ctx.save();
      ctx.globalAlpha = storyA * a;
      ctx.font = 'italic 26px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = HANJI;
      ctx.fillText(s.story, tx, ty);
      ctx.restore();
    }
  }

  // ---- guest book at the center ----
  function drawGuestBook(t) {
    var bw = 116, bh = 78;
    ctx.save();
    ctx.translate(CX, CY);
    rect(-bw / 2, -bh / 2, bw, bh, HANJI);
    rect(-bw / 2, -bh / 2, bw, 6, GOLD);
    line(-bw / 2 + 10, -6, bw / 2 - 10, -6, SUMI, 2);
    line(-bw / 2 + 10, 12, bw / 2 - 22, 12, SUMI, 2);
    ctx.font = 'italic 20px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = HANJI;
    ctx.fillText('guest book', 0, -bh / 2 - 12);
    ctx.restore();
  }

  // ---- main draw: one synchronous developed frame ----
  function draw() {
    pin();
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    ctx.translate(OX, OY);
    ctx.scale(SCALE, SCALE);
    // ground = table dark; table circle with chandelier-gold rim
    rect(0, 0, SW, SH, TABLE);
    ctx.beginPath();
    ctx.moveTo(CX + TABLE_R, CY);
    ctx.arc(CX, CY, TABLE_R, 0, Math.PI * 2);
    ctx.fillStyle = '#262019';
    ctx.fill();
    ring(CX, CY, TABLE_R, GOLD, 3);
    ring(CX, CY, TABLE_R - 14, 'rgba(217,164,65,0.35)', 1.5);
    var t = now();
    for (var i = 0; i < settings.length; i++) drawSetting(i, t);
    drawGuestBook(t);
    // hint, in hanji on the dark ground
    ctx.font = '16px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(237,230,210,0.75)';
    ctx.fillText('tap a setting to read its story  ·  tap the book to add a guest', CX, SH - 28);
    ctx.restore();
  }

  // ---- pointer input (scene coords, tap vs drag) ----
  function toScene(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var px = (e.clientX !== undefined ? e.clientX : 0) - r.left;
    var py = (e.clientY !== undefined ? e.clientY : 0) - r.top;
    return [(px - OX) / SCALE, (py - OY) / SCALE];
  }
  function angleAround(x, y) { return Math.atan2(y - CY, x - CX); }

  function onPointerDown(e) {
    var p = toScene(e);
    drag = { startAngle: angleAround(p[0], p[1]), lastAngle: angleAround(p[0], p[1]),
             x: p[0], y: p[1], sx: p[0], sy: p[1], at: now() };
  }
  function onPointerMove(e) {
    if (!drag) return;
    var p = toScene(e);
    var a = angleAround(p[0], p[1]);
    var d = a - drag.lastAngle;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    dragRot += d;
    drag.lastAngle = a;
    drag.x = p[0]; drag.y = p[1];
  }
  function onPointerUp(e) {
    if (!drag) return;
    var p = toScene(e);
    var moved = Math.hypot(p[0] - drag.sx, p[1] - drag.sy);
    var wasDrag = drag;
    drag = null;
    if (moved > 12) return; // it was a drag, rotation already applied
    var t = now();
    // tap: setting first, then guest book
    for (var i = 0; i < settings.length; i++) {
      var sp = settingPos(i, t);
      if (Math.hypot(p[0] - sp[0], p[1] - sp[1]) < 95) {
        taps.push({ setting: i, at: t });
        return;
      }
    }
    if (Math.abs(p[0] - CX) < 70 && Math.abs(p[1] - CY) < 55) {
      if (settings.length < MAX_SETTINGS) {
        var idx = settings.length;
        settings.push(makeSetting(idx, t));
        adds.push({ at: t });
      }
    }
  }
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);

  // QA hook: lets a harness drive the piece's own handlers and redraw.
  if (typeof window !== 'undefined' && window) {
    window.__piece = { draw: draw, down: onPointerDown, move: onPointerMove, up: onPointerUp,
                       settings: settings, groupAngle: groupAngle };
  }

  draw();
  if (typeof requestAnimationFrame !== 'undefined') {
    (function loop() {
      draw();
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
