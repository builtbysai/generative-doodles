<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suminagashi</title>
<style>
html, body { margin: 0; padding: 0; background: #04070A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a shallow black tray of water, seen straight from above. Drops of
   ink fall at irregular intervals, black, indigo, a rare gold. Each drop
   spreads into concentric rings that collide with older rings and deform
   into marbled veins. A breath of air occasionally crosses the surface and
   the whole pattern shears sideways. When the pattern reaches a certain
   density, a sheet of paper descends, touches the surface once, and lifts
   the marbling away, and the tray is dark water again. Then the drops begin
   again. Drag is the breath of air: it shears the floating pattern sideways
   while pressed. */
var TAU = Math.PI * 2;
var WATER = '#04070A';
var WATER_HI = '#0A1118';
var INK = '#0B0B0C';
var INK_SOFT = '#15181C';
var INDIGO = '#2E3A67';
var INDIGO_HI = '#7C8CC4';
var RING_INDIGO = '#5C6FAE';
var RING_INK = '#565D66';
var RING_INK_HI = '#7A828C';
var GOLD = '#C9A227';
var GOLD_HI = '#E3C766';
var PAPER = '#EDE6D6';
var PAPER_EDGE = '#D8CFB8';
var PLATE = '#070B0E';
var PLATE_LINE = 'rgba(237,230,214,0.28)';
var TITLE_INK = '#EDE6D6';
var HINT_INK = '#9AA3AD';
var FRAME_T = 60.0;        /* fixed phase for frame one */
var CYCLE = 90.0;          /* one full drop, paper, reset cycle, seconds */
var PAPER_IN = 76.0;       /* paper starts descending */
var PAPER_REST = 82.0;     /* paper rests on the surface */
var PAPER_OUT = 85.0;      /* paper starts lifting */
var PAPER_GONE = 89.0;     /* paper is off, tray is dark water again */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function easeInOut(v) {
  v = clamp(v, 0, 1);
  return v * v * (3 - 2 * v);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* drag is the breath of air: a shear velocity the pointer feeds, decaying */
var shearX = 0, shearY = 0;
var dragging = false;
var lastPointer = null;
/* ---- closed-form drop schedule: one seeded batch per cycle ---- */
function dropsForCycle(cyc) {
  var rng = mulberry32(1854 + cyc * 7919);
  var drops = [], t = 0.6;
  while (t < PAPER_IN - 1.0) {
    var roll = rng();
    var col = INK;
    if (roll < 0.10) col = GOLD;
    else if (roll < 0.45) col = INDIGO;
    var gold = col === GOLD;
    drops.push({
      b: t,                                   /* birth time within cycle */
      x: 0.06 + rng() * 0.88,                 /* field fraction */
      y: 0.06 + rng() * 0.88,
      col: col,
      ring: gold ? GOLD : (col === INDIGO ? RING_INDIGO : RING_INK),
      hi: gold ? GOLD_HI : (col === INDIGO ? INDIGO_HI : RING_INK_HI),
      gold: gold,
      grow: 0.0035 + rng() * 0.0035,          /* radius fraction per second */
      maxR: 0.42 + rng() * 0.33,              /* radius fraction of min side */
      wob: rng() * TAU,                       /* vein wobble phase */
      wobAmp: 0.02 + rng() * 0.05,            /* vein wobble amplitude */
      segs: 5 + Math.floor(rng() * 4)         /* vein arc segments */
    });
    t += 2.2 + rng() * 2.4;
  }
  return drops;
}
function cycleAt(t) {
  var cyc = Math.floor(t / CYCLE);
  var ph = t - cyc * CYCLE;
  return { cyc: cyc, ph: ph, drops: dropsForCycle(cyc) };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The tray is the whole world: full-bleed on phones, a square tray on a
   darker ground on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function drawWater(sc, t) {
  var g = ctx.createLinearGradient(sc.x, sc.y, sc.x + sc.w, sc.y + sc.h);
  g.addColorStop(0, WATER_HI);
  g.addColorStop(0.5, WATER);
  g.addColorStop(1, '#020406');
  ctx.fillStyle = g;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  /* faint tray rim on desktop */
  if (!isPhone) {
    ctx.strokeStyle = 'rgba(237,230,214,0.10)';
    ctx.lineWidth = 1;
    ctx.strokeRect(sc.x + 0.5, sc.y + 0.5, sc.w - 1, sc.h - 1);
  }
}
/* ambient breath: a slow sideways shear, closed form in t */
function ambientShear(t) {
  return Math.sin(TAU * t / 47 + 0.8) * 0.012 + Math.sin(TAU * t / 23 + 2.1) * 0.006;
}
function drawRing(dr, sc, t, m, shx, shy, paperClip) {
  var age = t - dr.b;
  if (age <= 0) return;
  var r = age * dr.grow * m;
  var maxR = dr.maxR * m;
  if (r > maxR * 2.0) return;
  var cx = sc.x + dr.x * sc.w + shx * (0.4 + 0.6 * clamp(age / 20, 0, 1));
  var cy = sc.y + dr.y * sc.h + shy * (0.4 + 0.6 * clamp(age / 20, 0, 1));
  var fade = 1;
  /* rings never fully vanish: the spread ink settles into faint veins */
  if (r > maxR) fade = Math.max(0.22, 1 - (r - maxR) / (maxR * 1.2));
  var base = dr.gold ? 0.9 : 0.8;
  var i, a0, a1, rr, seg;
  /* main ring, three close strokes so it reads as a spreading ink edge */
  ctx.lineCap = 'round';
  for (i = 0; i < 3; i++) {
    rr = r * (1 - i * 0.045);
    if (rr <= 0.5) continue;
    ctx.strokeStyle = rgba(dr.ring, base * (1 - i * 0.28) * fade);
    ctx.lineWidth = Math.max(1, m * (dr.gold ? 0.0045 : 0.006) * (1 - i * 0.25));
    ctx.beginPath();
    ctx.moveTo(cx + rr, cy);
    ctx.arc(cx, cy, rr, 0, TAU);
    ctx.stroke();
  }
  /* marbled veins: arcs along the ring, wobbled outward where they meet
     older rings, so collisions read as deformation, not perfect circles */
  for (i = 0; i < dr.segs; i++) {
    seg = TAU / dr.segs;
    a0 = i * seg + dr.wob * 0.13;
    a1 = a0 + seg * (0.45 + 0.35 * Math.sin(dr.wob + i * 1.7));
    rr = r * (1 + dr.wobAmp * Math.sin(dr.wob + i * 2.3 + age * 0.05));
    if (rr <= 0.5) continue;
    ctx.strokeStyle = rgba(dr.hi, 0.65 * fade);
    ctx.lineWidth = Math.max(1, m * 0.003);
    ctx.beginPath();
    ctx.moveTo(cx + rr * Math.cos(a0), cy + rr * Math.sin(a0));
    ctx.arc(cx, cy, rr, a0, a1);
    ctx.stroke();
  }
  /* ghost of the dissipated ring: a faint vein left behind at full spread */
  if (r > maxR * 0.9) {
    var ga = clamp(1 - (r - maxR * 0.9) / (maxR * 0.7), 0, 1) * 0.16;
    if (ga > 0.005) {
      ctx.strokeStyle = rgba(dr.hi, ga);
      ctx.lineWidth = Math.max(1, m * 0.0018);
      ctx.beginPath();
      ctx.moveTo(cx + maxR, cy);
      ctx.arc(cx, cy, maxR, 0, TAU);
      ctx.stroke();
    }
  }
}
function drawPattern(sc, cy, t, paperMode) {
  var m = Math.min(sc.w, sc.h);
  var shx = (ambientShear(t) + shearX) * m;
  var shy = shearY * m;
  var i, dr;
  for (i = 0; i < cy.drops.length; i++) {
    dr = cy.drops[i];
    if (cy.ph < dr.b) continue;
    drawRing(dr, sc, cy.ph, m, shx, shy, paperMode);
  }
}
function drawDensity(sc, cy) {
  /* thin density meter along the tray's right edge: fills as drops land,
     gold when full, the moment the paper is due */
  var seen = 0, i;
  for (i = 0; i < cy.drops.length; i++) if (cy.ph >= cy.drops[i].b) seen++;
  var d = cy.drops.length ? seen / cy.drops.length : 0;
  var bx = sc.x + sc.w - 8, bw = 3;
  var by = sc.y + 10, bh = sc.h - 20;
  ctx.fillStyle = 'rgba(237,230,214,0.14)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = d >= 1 ? GOLD : 'rgba(237,230,214,0.55)';
  ctx.fillRect(bx, by + bh * (1 - d), bw, bh * d);
}
function drawPaper(sc, cy) {
  var ph = cy.ph;
  if (ph < PAPER_IN) return;
  var cover = 0;
  if (ph < PAPER_REST) cover = easeInOut((ph - PAPER_IN) / (PAPER_REST - PAPER_IN));
  else if (ph < PAPER_OUT) cover = 1;
  else if (ph < PAPER_GONE) cover = 1 - easeInOut((ph - PAPER_OUT) / (PAPER_GONE - PAPER_OUT));
  else return;
  var h = sc.h * cover;
  var top = sc.y + sc.h - h;
  /* the sheet, descending from the top edge of the tray */
  ctx.fillStyle = PAPER;
  ctx.fillRect(sc.x, top, sc.w, h);
  ctx.strokeStyle = PAPER_EDGE;
  ctx.lineWidth = 1;
  ctx.strokeRect(sc.x + 0.5, top + 0.5, sc.w - 1, h - 1);
  /* while it rests, the lifted marbling shows faintly on the sheet */
  if (cover > 0.6 && h > 4) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(sc.x, top, sc.w, h);
    ctx.clip();
    ctx.globalAlpha = 0.35 * cover;
    var m = Math.min(sc.w, sc.h);
    var i, dr;
    for (i = 0; i < cy.drops.length; i++) {
      dr = cy.drops[i];
      if (cy.ph < dr.b) continue;
      var age = cy.ph - dr.b;
      var r = age * dr.grow * m;
      var maxR = dr.maxR * m;
      if (r <= 0.5 || r > maxR * 1.6) continue;
      var cx = sc.x + dr.x * sc.w;
      var cy2 = sc.y + dr.y * sc.h;
      ctx.strokeStyle = rgba(dr.col, 0.5);
      ctx.lineWidth = Math.max(1, m * 0.003);
      ctx.beginPath();
      ctx.moveTo(cx + r, cy2);
      ctx.arc(cx, cy2, r, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Suminagashi').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Suminagashi').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 08').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Suminagashi', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 08', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to breathe across the water.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  ctx.fillStyle = WATER;
  ctx.fillRect(0, 0, VW, VH);
  var cy = cycleAt(t);
  drawWater(sc, t);
  drawPattern(sc, cy, t, false);
  drawDensity(sc, cy);
  drawPaper(sc, cy);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    ringCount: function () {
      var cy = cycleAt(phaseT), n = 0, i;
      for (i = 0; i < cy.drops.length; i++) if (cy.ph >= cy.drops[i].b) n++;
      return n;
    },
    dropCount: function () { return cycleAt(phaseT).drops.length; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, about two dozen drops spread ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
function pointerPos(ev) {
  var rect = { left: 0, top: 0 };
  try { rect = canvas.getBoundingClientRect(); } catch (e) {}
  return { x: (ev.clientX - rect.left) / Math.max(VW, 1), y: (ev.clientY - rect.top) / Math.max(VH, 1) };
}
function onDown(ev) {
  dragging = true;
  lastPointer = pointerPos(ev);
  try { ev.preventDefault(); } catch (e) {}
}
function onMove(ev) {
  if (!dragging || !lastPointer) return;
  var p = pointerPos(ev);
  var dx = p.x - lastPointer.x, dy = p.y - lastPointer.y;
  lastPointer = p;
  /* drag is the breath: feed the shear, never a reset */
  shearX = clamp(shearX + dx * 2.2, -0.35, 0.35);
  shearY = clamp(shearY + dy * 2.2, -0.35, 0.35);
  try { ev.preventDefault(); } catch (e) {}
}
function onUp() { dragging = false; lastPointer = null; }
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('pointerleave', onUp);
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      /* shear decays back to still water once the breath passes */
      shearX *= Math.max(0, 1 - dt * 1.4);
      shearY *= Math.max(0, 1 - dt * 1.4);
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
