<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mucha Siren</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#D8B89A; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  function RNG(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var TAN = '#D8B89A', VIOLET = '#7A6FD0', CREAM = '#F2EAD8';
  var COBALT = '#2A3FA0', CRIMSON = '#A03040', GOWN = '#F0C8A0';
  var ROSE = '#E07840', TITLE = '#E8C84A', INK = '#4A3020';
  var PHASE0 = 1.5;

  // Fixed authored tables, index 0 at load: hair cobalt, fold layout 0, STAGE.
  var HAIRS = [COBALT, CRIMSON];
  var WORDS = ['STAGE', 'AMPLIFY', 'ENCORE', 'RESONANCE'];
  var FOLDS = [
    [0.20, 0.50, 0.80],
    [0.30, 0.45, 0.60, 0.75],
    [0.15, 0.40, 0.65, 0.90]
  ];
  var tapIndex = 0;

  // Hair ribbons: fixed per-ribbon sine triples (freq, amp, phase) and side.
  var ribbons = [];
  (function () {
    var r = RNG(452001);
    for (var i = 0; i < 10; i++) {
      ribbons.push({
        side: (i % 2 === 0) ? -1 : 1,
        base: 0.30 + (i % 5) * 0.10,
        thick: 0.022 + r() * 0.014,
        s1: [2.0 + r() * 1.0, 0.030 + r() * 0.020, r() * Math.PI * 2],
        s2: [4.0 + r() * 2.0, 0.015 + r() * 0.012, r() * Math.PI * 2],
        s3: [7.0 + r() * 2.0, 0.008 + r() * 0.006, r() * Math.PI * 2]
      });
    }
  })();

  function posterRect() {
    var pw = Math.min(W * 0.92, H * 0.75 * 0.92);
    var ph = pw / 0.75;
    if (ph > H * 0.96) { ph = H * 0.96; pw = ph * 0.75; }
    return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph };
  }

  function drawRose(x, y, s) {
    ctx.fillStyle = ROSE;
    for (var i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(x, y, s * (1 - i * 0.28), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = (i === 2) ? '#C85A30' : ROSE;
    }
    ctx.fillStyle = '#E8C84A';
    ctx.beginPath(); ctx.arc(x, y, s * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3E7C3F';
    ctx.beginPath(); ctx.ellipse(x - s, y + s * 0.6, s * 0.5, s * 0.22, -0.5, 0, Math.PI * 2); ctx.fill();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // page ground takes the arch ground tan; the poster keeps its 3:4 shape
    ctx.fillStyle = TAN;
    ctx.fillRect(0, 0, W, H);
    var P = posterRect();
    var px = P.x, py = P.y, pw = P.w, ph = P.h;

    // arched frame, filled tan, double ink rule
    ctx.fillStyle = TAN;
    ctx.beginPath();
    ctx.moveTo(px, py + ph);
    ctx.lineTo(px, py + pw * 0.30);
    ctx.arc(px + pw / 2, py + pw * 0.30, pw / 2, Math.PI, 0);
    ctx.lineTo(px + pw, py + ph);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, pw * 0.012);
    ctx.stroke();
    var inset = pw * 0.03;
    ctx.beginPath();
    ctx.moveTo(px + inset, py + ph - inset);
    ctx.lineTo(px + inset, py + pw * 0.30);
    ctx.arc(px + pw / 2, py + pw * 0.30, pw / 2 - inset, Math.PI, 0);
    ctx.lineTo(px + pw - inset, py + ph - inset);
    ctx.closePath(); ctx.stroke();

    var hair = HAIRS[tapIndex % 2];
    var word = WORDS[tapIndex % 4];
    var folds = FOLDS[tapIndex % 3];

    // sunburst medallion, slowly rotating, behind the figure
    var mcx = px + pw / 2, mcy = py + ph * 0.34, mr = pw * 0.36;
    var rot = (t / 120) * Math.PI * 2;
    for (var ri = 0; ri < 24; ri++) {
      var a0 = rot + ri * Math.PI / 12, a1 = rot + (ri + 1) * Math.PI / 12;
      ctx.fillStyle = (ri % 2 === 0) ? VIOLET : CREAM;
      ctx.beginPath();
      ctx.moveTo(mcx, mcy);
      ctx.lineTo(mcx + Math.cos(a0) * mr, mcy + Math.sin(a0) * mr);
      ctx.lineTo(mcx + Math.cos(a1) * mr, mcy + Math.sin(a1) * mr);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.arc(mcx, mcy, mr * 0.28, 0, Math.PI * 2); ctx.fill();

    // hair ribbons: the motion system, flowing across the full poster width.
    // Each ribbon is a filled path displaced by three summed sines.
    var hx = mcx, hy = mcy - mr * 0.30;
    ctx.fillStyle = hair;
    for (var rb = 0; rb < ribbons.length; rb++) {
      var R = ribbons[rb];
      var dir = R.side;
      var yBase = py + ph * R.base;
      var pts = [];
      for (var s0 = 0; s0 <= 20; s0++) {
        var fx = s0 / 20;
        var xx = hx + dir * fx * pw * 0.46;
        var yy = yBase + Math.sin(fx * R.s1[0] * Math.PI + R.s1[2] + t * 0.9) * R.s1[1] * ph
          + Math.sin(fx * R.s2[0] * Math.PI + R.s2[2] + t * 1.4) * R.s2[1] * ph
          + Math.sin(fx * R.s3[0] * Math.PI + R.s3[2] + t * 2.1) * R.s3[1] * ph;
        pts.push([xx, yy]);
      }
      ctx.globalAlpha = 0.88;
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      for (var q = 0; q < pts.length; q++) ctx.lineTo(pts[q][0], pts[q][1]);
      for (var q2 = pts.length - 1; q2 >= 0; q2--) ctx.lineTo(pts[q2][0], pts[q2][1] + R.thick * ph);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // the siren: head, draped gown with the current fold layout, guitar
    ctx.fillStyle = GOWN;
    ctx.beginPath(); ctx.arc(mcx, mcy - mr * 0.42, pw * 0.055, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(mcx - pw * 0.02, mcy - mr * 0.44, pw * 0.006, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mcx + pw * 0.02, mcy - mr * 0.44, pw * 0.006, 0, Math.PI * 2); ctx.fill();
    // gown: draped trapezoid flaring to the poster bottom
    ctx.fillStyle = GOWN;
    ctx.beginPath();
    ctx.moveTo(mcx - pw * 0.07, mcy - mr * 0.30);
    ctx.quadraticCurveTo(mcx - pw * 0.10, mcy + ph * 0.18, mcx - pw * 0.17, py + ph * 0.82);
    ctx.quadraticCurveTo(mcx, py + ph * 0.86, mcx + pw * 0.17, py + ph * 0.82);
    ctx.quadraticCurveTo(mcx + pw * 0.10, mcy + ph * 0.18, mcx + pw * 0.07, mcy - mr * 0.30);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, pw * 0.004);
    for (var f0 = 0; f0 < folds.length; f0++) {
      var ffx = mcx - pw * 0.12 + folds[f0] * pw * 0.24;
      ctx.beginPath();
      ctx.moveTo(ffx, mcy - mr * 0.28);
      ctx.quadraticCurveTo(ffx + pw * 0.02, mcy + ph * 0.18, ffx + (ffx - mcx) * 0.5, py + ph * 0.82);
      ctx.stroke();
    }
    // electric guitar, stylized, held diagonally (never a product shot)
    ctx.save();
    ctx.translate(mcx + pw * 0.10, mcy + ph * 0.05);
    ctx.rotate(0.6);
    ctx.fillStyle = VIOLET;
    ctx.beginPath(); ctx.ellipse(0, 0, pw * 0.055, pw * 0.075, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(pw * 0.02, -pw * 0.05, pw * 0.035, pw * 0.045, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK;
    ctx.fillRect(-pw * 0.008, -pw * 0.22, pw * 0.016, pw * 0.18);
    ctx.strokeStyle = CREAM; ctx.lineWidth = 1;
    for (var st = -1; st <= 1; st++) {
      ctx.beginPath(); ctx.moveTo(st * pw * 0.008, -pw * 0.20); ctx.lineTo(st * pw * 0.008, pw * 0.06); ctx.stroke();
    }
    ctx.restore();

    // corner florals
    drawRose(px + pw * 0.12, py + ph * 0.86, pw * 0.045);
    drawRose(px + pw * 0.20, py + ph * 0.90, pw * 0.032);
    drawRose(px + pw * 0.88, py + ph * 0.86, pw * 0.045);
    drawRose(px + pw * 0.80, py + ph * 0.90, pw * 0.032);

    // petals occasionally detaching and drifting
    for (var pd = 0; pd < 4; pd++) {
      var pc = (t / 12 + pd * 0.25) % 1;
      var pdx = px + pw * (0.15 + pd * 0.2) + pc * pw * 0.25;
      var pdy = py + ph * 0.80 + pc * ph * 0.12;
      ctx.fillStyle = ROSE;
      ctx.beginPath(); ctx.ellipse(pdx, pdy, pw * 0.014, pw * 0.008, pc * 3, 0, Math.PI * 2); ctx.fill();
    }

    // title: tall condensed lettering, manually spaced along the arch
    var fs = pw * 0.115;
    var adv = fs * 0.72;
    var total = word.length * adv;
    if (total > pw * 0.86) { fs = fs * (pw * 0.86 / total); adv = fs * 0.72; total = word.length * adv; }
    ctx.fillStyle = TITLE;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + fs + 'px "Arial Narrow", Arial, sans-serif';
    var ty = py + ph * 0.115;
    for (var ci = 0; ci < word.length; ci++) {
      var dx = (ci - (word.length - 1) / 2) * adv;
      var chy = ty + Math.abs(dx) * 0.10;
      ctx.save();
      ctx.translate(mcx + dx, chy);
      ctx.rotate(dx / pw * 0.35);
      ctx.fillText(word.charAt(ci), 0, 0);
      ctx.restore();
    }
  }

  var downX = 0, downY = 0, moved = false;
  canvas.addEventListener('pointerdown', function (e) {
    downX = e.clientX; downY = e.clientY; moved = false;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 6) moved = true;
  });
  canvas.addEventListener('pointerup', function () {
    if (!moved) tapIndex = (tapIndex + 1) % 12;
  });
  canvas.addEventListener('pointercancel', function () { moved = false; });

  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    var loop = function (now) {
      draw(PHASE0 + (now - start) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
