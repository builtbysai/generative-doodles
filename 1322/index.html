<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle Creek, Thursday Night</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #14101A; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). No Math.random anywhere.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, S = 0;

  function viewportSize() {
    var vw, vh;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      vw = visualViewport.width; vh = visualViewport.height;
    } else {
      vw = window.innerWidth; vh = window.innerHeight;
    }
    return [vw, vh];
  }

  function isPhone() {
    var minDim = 99999;
    if (typeof window !== 'undefined' && window.screen) {
      minDim = Math.min(window.screen.width, window.screen.height);
    }
    if (minDim < 700) return true;
    return H > W * 1.15;
  }

  function sizeCanvas() {
    var v = viewportSize();
    W = Math.round(v[0]); H = Math.round(v[1]);
    S = Math.min(W, H);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // Dot helper: one subpath per dot, moveTo before every arc (node-canvas quirk).
  function dot(x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function ellipse(x, y, rx, ry, color) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function poly(points, color) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function strokeLine(x1, y1, x2, y2, color, width) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  var DARK = '#14101A', NEON = '#FF4DA6', HOLO = '#D9B8D0', MINT = '#A8D8C8',
      GLITTER = '#F5D76E', CAN = '#9AA0A6', COUCH = '#B8328F';

  // Seeded scene data.
  var rng = mulberry32(1322000);
  var photoRects = [];
  var photoScales = [0.16, 0.11, 0.13, 0.09, 0.14, 0.10];
  for (var i = 0; i < 6; i++) {
    photoRects.push({
      x: 0.04 + rng() * 0.88, y: 0.34 + rng() * 0.22,
      w: photoScales[i], h: photoScales[i] * 0.72,
      rot: (rng() - 0.5) * 0.16, seed: rng() * 100
    });
  }
  var glitterField = [];
  for (var g = 0; g < 170; g++) {
    glitterField.push({
      x: rng(), y: 0.05 + rng() * 0.85, r: 0.8 + rng() * 1.8,
      ph: rng() * Math.PI * 2, sp: 0.5 + rng() * 1.5
    });
  }
  var cans = [];
  for (var k = 0; k < 7; k++) {
    cans.push({ x: 0.08 + rng() * 0.84, y: 0.70 + rng() * 0.20, s: 0.012 + rng() * 0.012, rot: rng() * Math.PI });
  }
  var storm = [];
  for (var q = 0; q < 90; q++) {
    storm.push({ x: rng(), off: rng() * 30, r: 0.8 + rng() * 1.6, ph: rng() * Math.PI * 2 });
  }

  // Interaction state: closed-form over recorded events and t.
  var dragEvents = []; // {t, dx}
  var tapTimes = [];   // tap timestamps (Thursday-night sets)
  var dragStartX = null, dragLastX = null;

  function dragOffset(t) {
    var off = 0;
    for (var i = 0; i < dragEvents.length; i++) {
      var age = t - dragEvents[i].t;
      if (age >= 0) off += dragEvents[i].dx * Math.exp(-age / 2.5);
    }
    return Math.max(-30, Math.min(30, off));
  }

  function setActive(t) {
    // A tap starts a 30 s Thursday-night set.
    for (var i = tapTimes.length - 1; i >= 0; i--) {
      var age = t - tapTimes[i];
      if (age >= 0 && age < 30) return age;
    }
    return -1;
  }

  function beatEnvelope(t, period) {
    var phase = t % period;
    return Math.exp(-phase / 0.35);
  }

  function draw(t) {
    var phone = isPhone();
    var px = dragOffset(t);
    var setAge = setActive(t);
    var inSet = setAge >= 0;
    var period = inSet ? 0.6 : 1.2;
    var env = beatEnvelope(t, period);
    var flare = inSet ? 0.55 + 0.45 * env : 0.25 + 0.55 * env;

    // Room: dim bar-dark field.
    rect(0, 0, W, H, DARK);
    // Back wall paneling: faint vertical bands.
    var bandW = W / 14;
    for (var b = 0; b < 14; b++) {
      if (b % 2 === 0) rect(b * bandW + px * 0.3, 0, bandW, H * 0.68, 'rgba(255,255,255,0.012)');
    }
    // Floor line.
    rect(0, H * 0.66, W, H * 0.34, '#0E0B14');

    // Archival photo rects on the back wall: blurred-blob abstractions, never faces.
    // Sized from S so portrait phones keep photographic proportions.
    for (var i = 0; i < photoRects.length; i++) {
      var pr = photoRects[i];
      var cx = pr.x * W + px * 0.3, cy = pr.y * H;
      var pw = pr.w * S * 1.4, ph = pw * 0.72;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(pr.rot);
      rect(-pw / 2, -ph / 2, pw, ph, '#241E33');
      // Soft blobs inside: layered flat-alpha ellipses.
      ellipse(0, -ph * 0.1, pw * 0.30, ph * 0.34, rgba('#8A7A96', 0.55));
      ellipse(pw * 0.18, ph * 0.16, pw * 0.22, ph * 0.26, rgba('#C9B8A8', 0.45));
      ellipse(-pw * 0.2, ph * 0.2, pw * 0.16, ph * 0.20, rgba('#5A4A6A', 0.5));
      ctx.strokeStyle = 'rgba(255,255,255,0.10)';
      ctx.lineWidth = Math.max(1, S * 0.002);
      ctx.strokeRect(-pw / 2, -ph / 2, pw, ph);
      ctx.restore();
    }

    // Holographic couches: backrest rising behind a low seat, magenta masses with flat-alpha sheen.
    var couchY = H * 0.60;
    ellipse(W * 0.16 + px * 0.5, couchY - H * 0.055, W * 0.11, H * 0.05, '#7A2360');
    ellipse(W * 0.84 + px * 0.5, couchY - H * 0.055, W * 0.11, H * 0.05, '#7A2360');
    ellipse(W * 0.16 + px * 0.5, couchY, W * 0.13, H * 0.055, COUCH);
    ellipse(W * 0.84 + px * 0.5, couchY, W * 0.13, H * 0.055, COUCH);
    ellipse(W * 0.16 + px * 0.5, couchY - H * 0.03, W * 0.10, H * 0.03, rgba(HOLO, 0.35));
    ellipse(W * 0.84 + px * 0.5, couchY - H * 0.03, W * 0.10, H * 0.03, rgba(MINT, 0.30));

    // Slow-turning disco shimmer: rotating faint streaks from upper center.
    var shimmerCx = W * 0.5 + px * 0.5, shimmerCy = H * 0.10;
    var shimmerAng = t * 0.12;
    for (var s = 0; s < 8; s++) {
      var a = shimmerAng + s * (Math.PI / 4);
      var len = S * 0.12;
      strokeLine(shimmerCx, shimmerCy, shimmerCx + Math.cos(a) * len, shimmerCy + Math.sin(a) * len,
        rgba(GLITTER, 0.05 + 0.04 * Math.sin(t * 0.8 + s)), Math.max(1, S * 0.002));
    }

    // Speakers flanking the sign, sized from S so portrait phones keep proportions.
    function speaker(cx) {
      var sw = S * 0.09, sh = S * 0.22, sy = H * 0.30;
      rect(cx - sw / 2, sy, sw, sh, '#1E1828');
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = Math.max(1, S * 0.002);
      ctx.strokeRect(cx - sw / 2, sy, sw, sh);
      dot(cx, sy + sh * 0.28, sw * 0.22, '#2E2438');
      dot(cx, sy + sh * 0.62, sw * 0.30, '#241C30');
      // Glitter on the speaker faces, beat-synced.
      for (var gi = 0; gi < 6; gi++) {
        var gx = cx - sw / 2 + ((gi * 37) % 10) / 10 * sw;
        var gy = sy + ((gi * 53) % 10) / 10 * sh;
        dot(gx, gy, Math.max(1, S * 0.0015), rgba(GLITTER, 0.25 + 0.55 * env));
      }
    }
    speaker(W * 0.24 + px * 0.5);
    speaker(W * 0.76 + px * 0.5);

    // Neon sign "EAGLE CREEK": layered flat-alpha glow, no shadowBlur.
    var signSize = Math.round(S * (phone ? 0.075 : 0.062));
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + signSize + 'px Arial, Helvetica, sans-serif';
    var signX = W * 0.5 + px * 0.5, signY = H * 0.22;
    var glowPasses = [
      { dx: 0, dy: 0, a: 0.10 }, { dx: 2, dy: 0, a: 0.08 }, { dx: -2, dy: 0, a: 0.08 },
      { dx: 0, dy: 2, a: 0.08 }, { dx: 0, dy: -2, a: 0.08 }
    ];
    for (var gp = 0; gp < glowPasses.length; gp++) {
      ctx.fillStyle = rgba(NEON, glowPasses[gp].a * (0.6 + flare));
      ctx.fillText('EAGLE CREEK', signX + glowPasses[gp].dx, signY + glowPasses[gp].dy);
    }
    ctx.fillStyle = rgba(NEON, 0.75 + 0.25 * flare);
    ctx.fillText('EAGLE CREEK', signX, signY);
    // Neon halo band behind the sign.
    ellipse(signX, signY, W * 0.20, H * 0.035, rgba(NEON, 0.04 + 0.04 * flare));

    // Glitter field across the room, beat-synced.
    for (var gi2 = 0; gi2 < glitterField.length; gi2++) {
      var gf = glitterField[gi2];
      var ga = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(t * gf.sp + gf.ph)) + 0.30 * env;
      dot(gf.x * W + px * 0.4, gf.y * H, gf.r * (phone ? 1.4 : 1), rgba(GLITTER, Math.min(0.95, ga)));
    }

    // Thursday-night glitter storm: rising sprites during a set.
    if (inSet) {
      var stormStrength = setAge < 2 ? setAge / 2 : (setAge > 26 ? (30 - setAge) / 4 : 1);
      for (var si = 0; si < storm.length; si++) {
        var st = storm[si];
        var rise = ((t * 0.06 + st.off) % 1);
        var sy2 = H * 0.95 - rise * H * 0.85;
        dot(st.x * W + px * 0.4, sy2, st.r, rgba(GLITTER, 0.55 * stormStrength * (0.5 + 0.5 * Math.sin(t * 3 + st.ph))));
      }
    }

    // Bartop: perspective quad sweeping the lower third, holographic flat-alpha bands.
    var topY = H * 0.68, botY = H;
    var topL = W * 0.06 + px, topR = W * 0.94 + px;
    var botL = -W * 0.06 + px, botR = W * 1.06 + px;
    poly([[topL, topY], [topR, topY], [botR, botY], [botL, botY]], '#C98AB0');
    // Hue-cycling bands across the bartop: alternating silver-pink and mint, alpha breathing.
    var bandCount = 10;
    for (var bi = 0; bi < bandCount; bi++) {
      var f0 = bi / bandCount, f1 = (bi + 1) / bandCount;
      var x0t = topL + (topR - topL) * f0, x1t = topL + (topR - topL) * f1;
      var x0b = botL + (botR - botL) * f0, x1b = botL + (botR - botL) * f1;
      var bandColor = (bi % 2 === 0) ? HOLO : MINT;
      var bandA = 0.12 + 0.10 * Math.sin(t * 0.5 + bi * 1.1);
      poly([[x0t, topY], [x1t, topY], [x1b, botY], [x0b, botY]], rgba(bandColor, Math.max(0.05, bandA)));
    }
    // Bartop front edge line.
    strokeLine(topL, topY, topR, topY, rgba('#FFFFFF', 0.35), Math.max(1, S * 0.003));
    // Crushed-can glyphs embedded in the bartop: jagged aluminum polygons.
    for (var ci = 0; ci < cans.length; ci++) {
      var cn = cans[ci];
      var ccx = cn.x * W + px, ccy = cn.y * H, cs = cn.s * W;
      var pts = [];
      for (var vi = 0; vi < 7; vi++) {
        var va = cn.rot + vi * (Math.PI * 2 / 7);
        var vr = cs * (0.7 + 0.3 * Math.sin(vi * 2.3 + ci));
        pts.push([ccx + Math.cos(va) * vr, ccy + Math.sin(va) * vr * 0.7]);
      }
      poly(pts, rgba(CAN, 0.85));
      dot(ccx, ccy, Math.max(1, cs * 0.25), rgba('#FFFFFF', 0.7));
    }
    // Glitter-coated telephone on the bartop: handset shape with gold glitter dots.
    var telX = W * 0.78 + px, telY = H * 0.78, telW = W * 0.09, telH = H * 0.05;
    poly([[telX - telW / 2, telY], [telX + telW / 2, telY], [telX + telW * 0.4, telY + telH], [telX - telW * 0.4, telY + telH]], '#2A2038');
    dot(telX - telW * 0.32, telY + telH * 0.4, Math.max(1, S * 0.008), COUCH);
    dot(telX + telW * 0.32, telY + telH * 0.4, Math.max(1, S * 0.008), COUCH);
    for (var ti = 0; ti < 10; ti++) {
      var tx = telX - telW / 2 + (ti % 5) * (telW / 5) + telW * 0.08;
      var ty = telY + Math.floor(ti / 5) * telH * 0.6 + telH * 0.2;
      dot(tx, ty, Math.max(1, S * 0.002), rgba(GLITTER, 0.5 + 0.4 * env));
    }

    // Vignette: dim corners via flat-alpha bands, keeping the room dim.
    rect(0, 0, W, H * 0.04, 'rgba(0,0,0,0.25)');
    rect(0, H * 0.96, W, H * 0.04, 'rgba(0,0,0,0.25)');
  }

  // Interaction: tap = Thursday-night set (never reload); drag = pan.
  function onPointerDown(e) {
    dragStartX = e.clientX;
    dragLastX = e.clientX;
  }
  function onPointerMove(e) {
    if (dragStartX === null) return;
    var dx = e.clientX - dragLastX;
    dragLastX = e.clientX;
    if (Math.abs(dx) > 0) dragEvents.push({ t: pieceTime, dx: dx * 0.4 });
  }
  function onPointerUp(e) {
    if (dragStartX === null) return;
    var total = Math.abs(e.clientX - dragStartX);
    dragStartX = null;
    dragLastX = null;
    if (total < 6) tapTimes.push(pieceTime);
  }
  if (typeof document !== 'undefined' && canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
  }

  // Boot: frame one is drawn at exactly t = 0; the clock starts with the rAF loop.
  var pieceTime = 0;
  var startStamp = null;
  sizeCanvas();
  draw(0);
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', function () {
      sizeCanvas();
      draw(pieceTime);
    });
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', function () {
        sizeCanvas();
        draw(pieceTime);
      });
    }
  }
  function loop(stamp) {
    if (startStamp === null) startStamp = stamp;
    pieceTime = (stamp - startStamp) / 1000;
    draw(pieceTime);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
