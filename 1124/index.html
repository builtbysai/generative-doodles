<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petalclouds</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0F16; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var seed = 1124;
  try {
    var m = /[?&]seed=(\d+)/.exec(location.search || '');
    if (m) seed = parseInt(m[1], 10);
  } catch (e) {}

  // ---------- palette ----------
  var GROUND = '#0B0F16';        // terminal dusk
  var LIT = '#C9CED6';           // aluminum, lit face
  var SHADE = '#4A5058';         // aluminum, shadow side
  var TOPLIGHT = '#FFE3B3';      // warm top light
  var POOL = '#2A2118';          // warm floor pools

  var TAU = Math.PI * 2;
  var MORPH = 60;                // the clouds re-sculpt on a 60 s cycle
  var T0 = 18;                   // fixed first-frame phase

  // ---------- phone detection ----------
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var minScreen = Math.min(sw || 9999, sh || 9999);
  var isPhone = minScreen < 700;

  // ---------- the six clouds ----------
  // layer: 0 far, 1 mid, 2 near. 1 far, 3 mid, 2 near.
  var LAYER = [
    { scale: 0.55, alpha: 0.34, par: 0.25 },
    { scale: 0.82, alpha: 0.58, par: 0.55 },
    { scale: 1.28, alpha: 0.88, par: 1.00 }
  ];
  // base centres in unit space (x across the width, y down the height)
  var BASES = [
    { x: 0.44, y: 0.13, layer: 0 },
    { x: 0.13, y: 0.31, layer: 1 },
    { x: 0.55, y: 0.25, layer: 1 },
    { x: 0.90, y: 0.37, layer: 1 },
    { x: 0.28, y: 0.07, layer: 2 },
    { x: 0.79, y: 0.13, layer: 2 }
  ];

  var clouds = [];
  function buildClouds(sd) {
    var rnd = mulberry32(sd * 7919 + 13);
    clouds = [];
    for (var ci = 0; ci < BASES.length; ci++) {
      var b = BASES[ci];
      var n = 12 + Math.floor(rnd() * 9);        // 12-20 petals
      var petals = [];
      for (var i = 0; i < n; i++) {
        petals.push({
          ang: (i / n) * TAU + (rnd() - 0.5) * 0.55,
          rad: 0.18 + rnd() * 0.82,              // 0 = heart, 1 = rim
          len: 0.75 + rnd() * 0.55,              // relative petal length
          wid: 0.30 + rnd() * 0.16,              // width as a fraction of length
          curl: (rnd() - 0.5) * 0.35,            // tip lift
          tilt: (rnd() - 0.5) * 0.9,             // rest angle off the radial
          phR: rnd() * TAU,                      // morph phases
          phA: rnd() * TAU,
          ampR: 0.10 + rnd() * 0.16,
          ampA: 0.05 + rnd() * 0.10
        });
      }
      clouds.push({
        bx: b.x, by: b.y, layer: b.layer,
        driftAx: 0.012 + rnd() * 0.016,
        driftAy: 0.006 + rnd() * 0.010,
        driftTx: 120 + rnd() * 60,
        driftTy: 140 + rnd() * 70,
        driftPx: rnd() * TAU,
        driftPy: rnd() * TAU,
        phS: rnd() * TAU,                        // stretch phase
        phRot: rnd() * TAU,
        poolY: 0.30 + rnd() * 0.45,              // pool depth in the floor band
        petals: petals
      });
    }
  }
  buildClouds(seed);

  // ---------- geometry (all closed-form in t) ----------
  function cloudCenter(c, t) {
    return {
      x: c.bx + c.driftAx * Math.sin(TAU * t / c.driftTx + c.driftPx),
      y: c.by + c.driftAy * Math.sin(TAU * t / c.driftTy + c.driftPy)
    };
  }

  // petal base position in unit space; unit = min(W, H) pixels
  function petalPos(c, p, t, unit, W, H) {
    var ctr = cloudCenter(c, t);
    var L = LAYER[c.layer];
    var open = 1 + p.ampR * Math.sin(TAU * t / MORPH + p.phR);
    var swirl = p.ampA * Math.sin(TAU * t / MORPH + p.phA);
    var stretch = Math.sin(TAU * t / MORPH + c.phS);
    var sx = 1 + 0.20 * stretch;
    var sy = 1 - 0.13 * stretch;
    var rot = 0.10 * Math.sin(TAU * t / 90 + c.phRot);
    var a = p.ang + swirl + rot;
    var r = p.rad * 0.16 * L.scale * open;
    var ox = Math.cos(a) * r * sx;
    var oy = Math.sin(a) * r * sy * 0.72;        // clouds are wider than tall
    return { x: ctr.x * W + ox * unit, y: ctr.y * H + oy * unit, a: a };
  }

  function petalAngle(c, p, t, unit, W, H) {
    var p0 = petalPos(c, p, t, unit, W, H);
    var p1 = petalPos(c, p, t + 0.7, unit, W, H);
    var vx = p1.x - p0.x, vy = p1.y - p0.y;
    if (vx * vx + vy * vy > 0.0004) return Math.atan2(vy, vx);
    return p0.a + p.tilt;
  }

  // ---------- interaction state ----------
  var panCur = 0, panTarget = 0;                 // in unit-space x
  var dragging = false, dragStartX = 0, panStart = 0;
  var petalDrag = null;                          // {ci, pi, dx, dy} while held
  var nudges = [];                               // released springs {ci, pi, dx, dy, t0}
  var lastHits = [];                             // petal anchors from the last draw

  function nudgeOffset(ci, pi, t) {
    var x = 0, y = 0;
    if (petalDrag && petalDrag.ci === ci) {
      var w = petalDrag.pi === pi ? 1 : 0.35;
      x += petalDrag.dx * w; y += petalDrag.dy * w;
    }
    for (var i = 0; i < nudges.length; i++) {
      var nd = nudges[i];
      if (nd.ci !== ci) continue;
      var dt = t - nd.t0;
      if (dt < 0 || dt > 9) continue;
      var env = Math.exp(-dt * 0.55) * Math.cos(dt * 3.4);
      var w2 = nd.pi === pi ? 1 : 0.35;
      x += nd.dx * env * w2; y += nd.dy * env * w2;
    }
    return { x: x, y: y };
  }

  // ---------- view / canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }

  function fit() {
    W = viewW(); H = viewH();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function draw(t) {
    fit();
    var unit = Math.min(W, H);
    var horizon = H * 0.75;

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // faint warm wash of top light, three flat bands
    ctx.fillStyle = TOPLIGHT;
    ctx.globalAlpha = 0.030; ctx.fillRect(0, 0, W, H * 0.10);
    ctx.globalAlpha = 0.018; ctx.fillRect(0, H * 0.10, W, H * 0.10);
    ctx.globalAlpha = 0.008; ctx.fillRect(0, H * 0.20, W, H * 0.12);
    ctx.globalAlpha = 1;

    // floor pools, counter-drifting under their clouds
    var ci, c, L, ctr;
    for (ci = clouds.length - 1; ci >= 0; ci--) {
      c = clouds[ci]; L = LAYER[c.layer]; ctr = cloudCenter(c, t);
      var px = (ctr.x - (ctr.x - c.bx) * 1.6) * W + panCur * L.par * unit;
      var py = horizon + (H - horizon) * c.poolY;
      var rx = 0.20 * L.scale * unit, ry = rx * 0.15;
      ctx.fillStyle = POOL;
      ctx.globalAlpha = 0.16 * L.alpha + 0.05;
      ctx.beginPath(); ctx.ellipse(px, py, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.22 * L.alpha + 0.06;
      ctx.beginPath(); ctx.ellipse(px, py, rx * 0.70, ry * 0.70, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.30 * L.alpha + 0.07;
      ctx.beginPath(); ctx.ellipse(px, py, rx * 0.42, ry * 0.42, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // clouds, far to near
    lastHits = [];
    var order = [0, 1, 2, 3, 4, 5];
    order.sort(function (a, b) { return clouds[a].layer - clouds[b].layer; });
    for (var oi = 0; oi < order.length; oi++) {
      ci = order[oi]; c = clouds[ci]; L = LAYER[c.layer];
      var panX = panCur * L.par * unit;
      for (var pi = 0; pi < c.petals.length; pi++) {
        var p = c.petals[pi];
        var pos = petalPos(c, p, t, unit, W, H);
        var no = nudgeOffset(ci, pi, t);
        var x = pos.x + panX + no.x, y = pos.y + no.y;
        var ang = petalAngle(c, p, t, unit, W, H);
        var len = 0.105 * L.scale * p.len * unit;
        var wid = len * p.wid;
        lastHits.push({ ci: ci, pi: pi, x: x, y: y, r: len * 0.62 });

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);

        // shadow side: a sliver along the lower edge
        ctx.globalAlpha = L.alpha * 0.85;
        ctx.fillStyle = SHADE;
        ctx.beginPath();
        ctx.moveTo(len * 0.06, wid * 0.10);
        ctx.quadraticCurveTo(len * 0.52, wid * 1.02, len * 0.97, len * p.curl * 0.4);
        ctx.quadraticCurveTo(len * 0.50, wid * 0.30, len * 0.06, wid * 0.10);
        ctx.fill();

        // lit face: the leaf itself, two quadratic curves, hard-edged
        ctx.globalAlpha = L.alpha;
        ctx.fillStyle = LIT;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(len * 0.48, -wid, len, len * p.curl * 0.4);
        ctx.quadraticCurveTo(len * 0.52, wid * 0.82, 0, 0);
        ctx.fill();

        // top light caught on the upper edge
        ctx.globalAlpha = L.alpha * 0.20;
        ctx.strokeStyle = TOPLIGHT;
        ctx.lineWidth = Math.max(1, len * 0.022);
        ctx.beginPath();
        ctx.moveTo(len * 0.04, -wid * 0.08);
        ctx.quadraticCurveTo(len * 0.48, -wid * 0.96, len * 0.96, len * p.curl * 0.4);
        ctx.stroke();

        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- interaction: drag pans; a petal grabbed is nudged; double-tap reseeds ----------
  function nowSec() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : lastT;
  }
  function evX(e) { return (e && e.clientX != null) ? e.clientX : null; }
  function evY(e) { return (e && e.clientY != null) ? e.clientY : null; }

  var downX = 0, downY = 0, lastTap = -10;
  function onDown(e) {
    var x = evX(e), y = evY(e);
    if (x == null) return;
    var t = nowSec();
    if (t - lastTap < 0.32) {
      seed += 1;
      buildClouds(seed);
      nudges = [];
      petalDrag = null;
      dragging = false;
      lastTap = -10;
      draw(lastT);
      return;
    }
    lastTap = t;
    dragging = true;
    downX = x; downY = y;
    dragStartX = x; panStart = panTarget;
    // a press on a petal grabs the petal, not the view
    petalDrag = null;
    for (var i = lastHits.length - 1; i >= 0; i--) {
      var h = lastHits[i];
      var dx = x - h.x, dy = y - h.y;
      if (dx * dx + dy * dy < h.r * h.r) { petalDrag = { ci: h.ci, pi: h.pi, dx: 0, dy: 0 }; break; }
    }
  }
  function onMove(e) {
    if (!dragging) return;
    var x = evX(e), y = evY(e);
    if (x == null) return;
    var unit = Math.min(W, H) || 1;
    if (petalDrag) {
      petalDrag.dx = Math.max(-0.09 * unit, Math.min(0.09 * unit, x - downX));
      petalDrag.dy = Math.max(-0.09 * unit, Math.min(0.09 * unit, y - downY));
    } else {
      panTarget = panStart + (x - dragStartX) / unit * 0.35;
      panTarget = Math.max(-0.22, Math.min(0.22, panTarget));
    }
  }
  function onUp() {
    if (petalDrag && (petalDrag.dx !== 0 || petalDrag.dy !== 0)) {
      nudges.push({ ci: petalDrag.ci, pi: petalDrag.pi, dx: petalDrag.dx, dy: petalDrag.dy, t0: lastT });
      if (nudges.length > 12) nudges.shift();
    }
    petalDrag = null;
    dragging = false;
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('dblclick', function () {
      seed += 1; buildClouds(seed); nudges = []; draw(lastT);
    });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  var lastT = T0;
  draw(T0);

  var startStamp = null;
  function frame(stamp) {
    if (startStamp === null) startStamp = stamp;
    var t = T0 + (stamp - startStamp) / 1000;
    lastT = t;
    panCur += (panTarget - panCur) * 0.06;
    if (!dragging && !petalDrag) panTarget += (0 - panTarget) * 0.012;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
