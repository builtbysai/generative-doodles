<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Plegaria Muda</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0B0A09; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): slab, soil band, sage grass, dark ground. Nothing else.
  var GROUND = '#0B0A09';
  var SLAB = '#14120F';
  var SOIL = '#2A2018';
  var GRASS = '#7FA653';

  var BASE_SEED = 697001;
  var ROWS = 12;              // slab pairs stacked across the field
  var CYCLE_S = 65;           // per-blade cycle: grow 20 + full 30 + die 15
  var GROW_S = 20, FULL_S = 30;
  var TARGET_DESKTOP = 1150;  // blade count, inside the specced 800..1500
  var TARGET_PHONE = 820;
  var FORCE_T = -1;           // QA hook: -1 = live clock, else fixed elapsed

  // QA seed hook: ?seed=tNN pins the elapsed time (headless phase checks).
  try {
    if (typeof location !== 'undefined' && location.search) {
      var qm = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(location.search);
      if (qm) FORCE_T = parseFloat(qm[1]);
    }
  } catch (e) { /* live mode */ }

  // Seeded RNG (mulberry32). Every field is generated from one stream
  // per epoch and never changes inside that epoch.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ------------------------------------------------------------------
  // Layout. The stack is a pure function of canvas height: ROWS equal
  // units. Each unit, top to bottom: slab A, a thin ground seam (the
  // two tables of the pair lying surface to surface), slab B, then the
  // soil band. Grass roots at the soil band's top edge and grows up
  // over slab B. soilFrac per row is seeded per epoch (band 8..16 px
  // at the 720 reference scale).
  // ------------------------------------------------------------------
  var rowSoilFrac = [];

  function rowGeom(i, h) {
    var unit = h / ROWS;
    var top = i * unit;
    var soilH = rowSoilFrac[i] * unit;
    var soilTop = top + unit - soilH;
    return { unit: unit, top: top, soilH: soilH, soilTop: soilTop };
  }

  // ------------------------------------------------------------------
  // The field. Per blade, all precomputed at generation:
  //   row     : which soil band it grows from
  //   u       : horizontal position (triangular, centre-weighted, so
  //             the field thins toward the left/right edges too)
  //   maxH    : full height in reference px (10..40 at 720)
  //   lean    : tip offset as a fraction of height
  //   phase   : offset inside the 65 s growth cycle, so at any moment
  //             the field holds sprouts, full blades and dying blades
  //   swayPh/swayAmp : wind response
  //   alpha   : per-blade depth variation of the one grass tone
  // Row density: a centre-weighted weight per row, denser toward the
  // middle rows, sparser at the top and bottom edges of the stack.
  // ------------------------------------------------------------------
  var blades = [];
  var epoch = 0;
  var epochStart = 0;

  function buildField(ep) {
    var rng = mulberry32(BASE_SEED + ep * 7919);
    var i, j;
    rowSoilFrac = [];
    for (i = 0; i < ROWS; i++) rowSoilFrac.push(0.17 + 0.17 * rng());

    var weights = [], wsum = 0;
    for (i = 0; i < ROWS; i++) {
      var c = (i + 0.5) / ROWS - 0.5;
      var wgt = 0.30 + 0.70 * Math.exp(-(c * c) / (2 * 0.30 * 0.30));
      weights.push(wgt); wsum += wgt;
    }
    var target = isPhone() ? TARGET_PHONE : TARGET_DESKTOP;
    blades = [];
    for (i = 0; i < ROWS; i++) {
      var n = Math.round(target * weights[i] / wsum);
      for (j = 0; j < n; j++) {
        var u = 0.5 + (rng() + rng() - 1) * 0.56;
        blades.push({
          row: i,
          u: clamp(u, 0.004, 0.996),
          maxH: 10 + 30 * Math.pow(rng(), 1.25),
          lean: (rng() * 2 - 1) * 0.22,
          phase: rng() * CYCLE_S,
          swayPh: rng() * Math.PI * 2,
          swayAmp: 1.5 + 2.6 * rng(),
          alpha: 0.45 + 0.55 * rng()
        });
      }
    }
  }

  // Growth envelope over one cycle: grow, hold full, die back.
  function envelope(p) {
    if (p < GROW_S) return smooth(p / GROW_S);
    if (p < GROW_S + FULL_S) return 1;
    return 1 - smooth((p - GROW_S - FULL_S) / (CYCLE_S - GROW_S - FULL_S));
  }

  // ------------------------------------------------------------------
  // Sizing: Visual Viewport API first, window fallback. Listeners on
  // both visualViewport and window. Phone detection via window.screen
  // physical size (min dimension < 700), aspect only as fallback.
  // ------------------------------------------------------------------
  var W = 0, H = 0;
  function isPhone() {
    try {
      if (typeof window !== 'undefined' && window.screen) {
        var mn = Math.min(window.screen.width, window.screen.height);
        if (mn > 0 && mn < 700) return true;
        if (mn >= 700) return false;
      }
    } catch (e) { /* fall through to aspect */ }
    return H > W * 1.15;
  }
  function measure() {
    var w = 0, h = 0;
    try {
      if (typeof window !== 'undefined' && window.visualViewport) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      }
    } catch (e) { /* fallback below */ }
    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
    var dpr = 1;
    try { dpr = window.devicePixelRatio || 1; } catch (e) { /* 1 */ }
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ------------------------------------------------------------------
  // Pointer. Passing over the field bends blades aside: recent pointer
  // samples are kept with their anchored times and the bend is a pure
  // function of (samples, now) that springs back as samples age out.
  // A tap (short, near-still press) reseeds the field: new epoch.
  // ------------------------------------------------------------------
  var samples = [];        // {x, y, t} in CSS px / anchored seconds
  var downAt = null;       // {x, y, t}
  function pushSample(x, y, t) {
    samples.push({ x: x, y: y, t: t });
    while (samples.length > 24) samples.shift();
    while (samples.length && t - samples[0].t > 1.4) samples.shift();
  }
  function evtPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    if (e && e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e && e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return null;
  }
  function onDown(e) {
    var p = evtPos(e); if (!p) return;
    var t = nowS();
    downAt = { x: p.x, y: p.y, t: t };
    pushSample(p.x, p.y, t);
  }
  function onMove(e) {
    var p = evtPos(e); if (!p) return;
    pushSample(p.x, p.y, nowS());
  }
  function onUp(e) {
    var p = evtPos(e);
    if (downAt && p) {
      var t = nowS();
      var dx = p.x - downAt.x, dy = p.y - downAt.y;
      if (Math.sqrt(dx * dx + dy * dy) < 8 && t - downAt.t < 0.35) {
        epoch++;
        epochStart = t;
        buildField(epoch);
      }
    }
    downAt = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    canvas.addEventListener('touchmove', onMove, { passive: true });
    canvas.addEventListener('touchend', onUp);
  }

  // ------------------------------------------------------------------
  // Anchored clock. Frame one is drawn synchronously at t = 0; the
  // rAF loop (guarded) only ever reads elapsed time since load.
  // ------------------------------------------------------------------
  var T0 = 0;
  try { T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0; } catch (e) { T0 = 0; }
  function nowS() {
    if (FORCE_T >= 0) return FORCE_T;
    try { return ((performance.now() - T0) / 1000); } catch (e) { return 0; }
  }

  function draw(t) {
    // Pin the canvas CSS size every frame (house rule: high-DPR
    // phones otherwise render doubled from the backing store).
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var sUnit = clamp(Math.min(W, H) / 720, 0.55, 1.7);
    var lt = t - epochStart; // local field time

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // The stack: slab pairs with a ground seam, soil band beneath.
    var i, g;
    for (i = 0; i < ROWS; i++) {
      g = rowGeom(i, H);
      ctx.fillStyle = SLAB;
      ctx.fillRect(0, g.top, W, g.unit - g.soilH);
      // seam between the two tables of the pair
      var seamY = g.top + (g.unit - g.soilH) * (0.46 + 0.08 * Math.sin(i * 12.9898));
      ctx.fillStyle = GROUND;
      ctx.fillRect(0, seamY, W, Math.max(1.5, 2 * sUnit));
      ctx.fillStyle = SOIL;
      ctx.fillRect(0, g.soilTop, W, g.soilH);
    }

    // Grass. Each blade: root on its soil band's top edge, a single
    // tapered quadratic rising over the slab above.
    ctx.strokeStyle = GRASS;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1, 1.4 * sUnit);
    var R = 84 * sUnit; // pointer repulsion radius
    for (i = 0; i < blades.length; i++) {
      var b = blades[i];
      var p = (lt + b.phase) % CYCLE_S;
      var env = envelope(p);
      if (env <= 0.004) continue;
      g = rowGeom(b.row, H);
      var rootX = b.u * W;
      var rootY = g.soilTop + g.soilH * 0.35;
      var hgt = b.maxH * sUnit * env;
      if (hgt < 1) continue;

      // Wind: two slow sines, one per-blade, one travelling field.
      var wind = (Math.sin(t * 0.6 + b.swayPh) * 0.62 +
                  Math.sin(t * 0.21 + b.u * 5.0 + b.row * 0.9) * 0.38) * b.swayAmp * sUnit;

      // Pointer repulsion: bend away from recent samples, fading as
      // they age, so the parting closes behind a passing hand.
      var push = 0;
      for (var k = 0; k < samples.length; k++) {
        var sm = samples[k];
        var age = t - sm.t;
        if (age < 0 || age > 1.4) continue;
        var midY = rootY - hgt * 0.6;
        var dx = rootX - sm.x, dy = midY - sm.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < R * R) {
          var d = Math.sqrt(d2) || 1;
          var f = (1 - d / R) * (1 - age / 1.4);
          push += (dx / d) * f * 34 * sUnit;
        }
      }

      var tipX = rootX + b.lean * hgt + wind + push;
      var tipY = rootY - hgt;
      var ctlX = rootX + (b.lean * hgt) * 0.35 + wind * 0.35 + push * 0.4;
      var ctlY = rootY - hgt * 0.55;

      ctx.globalAlpha = b.alpha * (0.35 + 0.65 * env);
      ctx.beginPath();
      ctx.moveTo(rootX, rootY);
      ctx.quadraticCurveTo(ctlX, ctlY, tipX, tipY);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function frame() { draw(nowS()); }

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { measure(); frame(); });
  }
  try {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { measure(); frame(); });
    }
  } catch (e) { /* window resize covers it */ }

  measure();
  buildField(0);
  draw(FORCE_T >= 0 ? FORCE_T : 0); // frame one: synchronous, t = 0

  if (FORCE_T < 0 && typeof requestAnimationFrame === 'function') {
    var loop = function () { frame(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
