<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Monster Factory</title>
<style>
  html, body { margin: 0; padding: 0; background: #17171A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG only. No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var CHARCOAL = '#17171A';
  var PAPER = '#D9D2C2';
  var INK = '#0E0D0B';
  var TOXIC = '#8FA31F';
  var RUST = '#9A4A22';

  var W = 0, H = 0, S = 1, BELT = 0, isPhone = false;
  var booted = false;
  var startTime = 0;

  function size() {
    var vw, vh;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      vw = visualViewport.width; vh = visualViewport.height;
    } else {
      vw = window.innerWidth; vh = window.innerHeight;
    }
    W = Math.round(vw); H = Math.round(vh);
    var sw = 0, sh = 0;
    try {
      if (window.screen) { sw = window.screen.width; sh = window.screen.height; }
    } catch (e) { sw = 0; sh = 0; }
    var minScreen = (sw && sh) ? Math.min(sw, sh) : 9999;
    isPhone = (minScreen < 700) || (H > W * 1.15);
    // Field-like composition: full-bleed on every screen. Page ground is the charcoal.
    S = Math.min(W, H) / 720;
    BELT = Math.round(H * 0.60);
    canvas.width = W; canvas.height = H;
    if (canvas.style) {
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
    }
  }

  // One monster's generated anatomy, from a per-monster seeded stream.
  // Layers: distorted ellipse/arc copies stacked over a blank base.
  function monsterSpec(index) {
    var rng = mulberry32(1311000 + index * 7919);
    var layers = 3 + Math.floor(rng() * 4); // 3..6
    var spec = { layers: layers, parts: [], spikes: 0, eyes: 0, rust: rng() < 0.6 };
    var i;
    for (i = 0; i < layers; i++) {
      spec.parts.push({
        dx: (rng() - 0.5) * 44,
        dy: (rng() - 0.5) * 30 - i * 4,
        rx: 26 + rng() * 30,
        ry: 18 + rng() * 22,
        rot: (rng() - 0.5) * 1.1,
        squ: 0.75 + rng() * 0.5,
        shade: i % 2 === 0 ? PAPER : INK
      });
    }
    spec.spikes = 2 + Math.floor(rng() * 4);
    spec.eyes = 1 + Math.floor(rng() * 3);
    spec.eyeSeed = Math.floor(rng() * 10000);
    spec.spikeSeed = Math.floor(rng() * 10000);
    return spec;
  }

  function ellipseAt(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
    ctx.fill();
  }

  function dotAt(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw one monster at (x, beltY) with accretion progress p in [0,1]
  // and stamped=true once it has passed the stamping station.
  function drawMonster(spec, x, beltY, p, stamped) {
    var base = 34 * S;
    var i, part, full, frac, alpha;
    ctx.save();
    ctx.translate(x, beltY - base * 0.55);
    // Shadow pool on the belt.
    ctx.fillStyle = INK;
    ctx.globalAlpha = 0.55;
    ellipseAt(0, base * 0.95, base * 1.15, base * 0.22, 0);
    ctx.globalAlpha = 1;
    // The blank: a single paper disc, the zero state.
    ctx.fillStyle = PAPER;
    ellipseAt(0, 0, base, base * 0.82, 0);
    // Distortion accretion: layers appear in order as p grows.
    var total = spec.layers;
    var shown = p * total;
    for (i = 0; i < total; i++) {
      if (shown <= i) break;
      full = shown >= i + 1;
      frac = full ? 1 : shown - i;
      part = spec.parts[i];
      alpha = 0.35 + 0.65 * frac;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = part.shade;
      ellipseAt(part.dx * S, part.dy * S, part.rx * S * part.squ, part.ry * S, part.rot);
      // Streak marks on the later layers.
      if (i >= 2) {
        ctx.strokeStyle = part.shade === PAPER ? INK : PAPER;
        ctx.lineWidth = Math.max(1, 1.6 * S);
        ctx.beginPath();
        ctx.moveTo(part.dx * S - part.rx * S * 0.6, part.dy * S);
        ctx.lineTo(part.dx * S + part.rx * S * 0.6, part.dy * S + part.ry * S * 0.4);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    // Spikes and eyes appear with the last layers.
    if (p > 0.55) {
      var srng = mulberry32(spec.spikeSeed);
      ctx.fillStyle = INK;
      for (i = 0; i < spec.spikes; i++) {
        var a = -Math.PI * 0.85 + srng() * Math.PI * 0.7;
        var sx = Math.cos(a) * base * 0.95, sy = Math.sin(a) * base * 0.75;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + Math.cos(a) * base * 0.45, sy + Math.sin(a) * base * 0.45);
        ctx.lineTo(sx + Math.cos(a + 0.5) * base * 0.25, sy + Math.sin(a + 0.5) * base * 0.25);
        ctx.closePath();
        ctx.fill();
      }
      var erng = mulberry32(spec.eyeSeed);
      for (i = 0; i < spec.eyes; i++) {
        var ex = (erng() - 0.5) * base * 1.1;
        var ey = (erng() - 0.5) * base * 0.7 - base * 0.1;
        ctx.fillStyle = PAPER;
        dotAt(ex, ey, Math.max(2, 4.5 * S));
        ctx.fillStyle = TOXIC;
        dotAt(ex, ey, Math.max(1, 2.2 * S));
      }
    }
    // Rust patch: a material tone, never a second accent.
    if (spec.rust && p > 0.4) {
      ctx.fillStyle = RUST;
      ctx.globalAlpha = 0.85;
      ellipseAt(-base * 0.45, base * 0.45, base * 0.32, base * 0.2, 0.4);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    // Arrival stamp: abstract punch-card glyph, never readable text.
    if (stamped) {
      ctx.save();
      ctx.translate(x + base * 1.35, beltY - base * 1.15);
      ctx.strokeStyle = TOXIC;
      ctx.lineWidth = Math.max(1, 1.8 * S);
      ctx.strokeRect(-base * 0.28, -base * 0.22, base * 0.56, base * 0.44);
      ctx.fillStyle = TOXIC;
      var j;
      for (j = 0; j < 4; j++) {
        ctx.fillRect(-base * 0.2 + j * base * 0.12, -base * 0.12, base * 0.05, base * 0.24);
      }
      ctx.restore();
    }
  }

  function drawZoneGlyph(kind, x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = PAPER;
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = Math.max(1, 1.4 * S);
    if (kind === 'circle') {
      ctx.beginPath();
      ctx.moveTo(s, 0);
      ctx.arc(0, 0, s, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 'triangle') {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s, s * 0.8);
      ctx.lineTo(-s, s * 0.8);
      ctx.closePath();
      ctx.stroke();
    } else {
      ctx.strokeRect(-s, -s, s * 2, s * 2);
    }
    ctx.restore();
  }

  function draw(t) {
    size();
    ctx.fillStyle = CHARCOAL;
    ctx.fillRect(0, 0, W, H);

    // Station zones: intake, layering, stamping.
    var zones = [
      { x0: 0.04, x1: 0.30, glyph: 'circle' },
      { x0: 0.32, x1: 0.64, glyph: 'triangle' },
      { x0: 0.66, x1: 0.97, glyph: 'square' }
    ];
    var zi;
    ctx.strokeStyle = PAPER;
    ctx.globalAlpha = 0.18;
    ctx.lineWidth = Math.max(1, 1.2 * S);
    ctx.setLineDash([6 * S, 6 * S]);
    for (zi = 0; zi < zones.length; zi++) {
      var zx0 = zones[zi].x0 * W, zx1 = zones[zi].x1 * W;
      ctx.strokeRect(zx0, BELT - 150 * S, zx1 - zx0, 190 * S);
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    for (zi = 0; zi < zones.length; zi++) {
      drawZoneGlyph(zones[zi].glyph, (zones[zi].x0 + zones[zi].x1) / 2 * W, BELT + 52 * S, 10 * S);
    }

    // Conveyor: belt line plus roller ticks that travel with the belt.
    var speed = 26 * S; // px per second
    var spacing = 46 * S;
    var off = (t * speed) % spacing;
    ctx.strokeStyle = PAPER;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(1.5, 2.5 * S);
    ctx.beginPath();
    ctx.moveTo(0, BELT);
    ctx.lineTo(W, BELT);
    ctx.stroke();
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = Math.max(1, 1.5 * S);
    var rx;
    for (rx = -spacing + off; rx < W + spacing; rx += spacing) {
      ctx.beginPath();
      ctx.moveTo(rx, BELT - 7 * S);
      ctx.lineTo(rx, BELT + 7 * S);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Monsters on a seamless belt loop. Spacing fixed; positions are a
    // closed-form function of t, so the belt loops without a seam.
    var count = 4;
    var D = (W + 260 * S) / count;
    var span = D * count;
    var k, pos, mx, p, stamped;
    for (k = 0; k < count; k++) {
      pos = k * D - t * speed;
      pos = ((pos % span) + span) % span;
      mx = pos - 130 * S;
      if (mx < -140 * S || mx > W + 140 * S) continue;
      var fx = mx / W;
      if (fx < 0.30) { p = 0; stamped = false; }
      else if (fx < 0.64) { p = (fx - 0.30) / 0.34; stamped = false; }
      else { p = 1; stamped = true; }
      drawMonster(monsterSpec(k), mx, BELT, p, stamped);
    }
  }

  // Frame one: exactly t = 0, via the boot flag. The clock starts only
  // with the rAF loop.
  draw(0);
  booted = true;

  function loop(ts) {
    if (!booted) { draw(0); booted = true; return; }
    if (!startTime) startTime = ts;
    var t = (ts - startTime) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
