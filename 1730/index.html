<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Primes</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0F1A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0B0F1A';
var PLATE = '#131A2A';
var PLATE_LINE = 'rgba(217,192,138,0.45)';
var TITLE_INK = '#E8EDF2';
var HINT_INK = '#D9C08A';
var GOLD = '#D9C08A';
var WHITE = '#E8EDF2';
var PERIOD = 30;
var FRAME_T = 7.5;
var PRIMES = [2, 3, 5, 7, 11, 13, 17, 19, 23];
var COUNT = 9;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1730);
var phaseT = FRAME_T;
/* ---- nine discs, one per prime, per-disc alpha seeded ---- */
var DISCS = [];
(function () {
  var i;
  for (i = 0; i < COUNT; i++) {
    DISCS.push({
      prime: PRIMES[i],
      alpha: 0.14 + rng() * 0.12,
      upperAlpha: 0.12 + rng() * 0.10
    });
  }
})();
/* ---- tuning: drag retunes the base radius, release eases back ---- */
var base0 = 10;
var base = 10;
var baseTarget = 10;
var dragging = false;
var dragStartX = 0;
var dragStartBase = 10;
var releaseT = -1;
function driftBase(t) {
  return base0 * (1 + 0.05 * Math.sin(TAU * t / PERIOD + 0.6));
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  /* largest disc (23 * base) must fit the stage both ways, so base is capped by stage size */
  var stageW = isPhone ? VW : Math.min(VW, VH);
  var stageH = isPhone ? VH : Math.min(VW, VH);
  base0 = Math.min(stageH * 0.25, stageW * 0.28) / 23;
  if (!dragging && releaseT < 0) { base = driftBase(phaseT); baseTarget = base; }
}
/* ---- stage: single centered row, full-bleed on phones, square-ish on desktop ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function tideWeights(t) {
  /* 30 s tide: lower octave fades out as the upper fades in, equal at mid-tide */
  var w = 0.5 + 0.5 * Math.cos(TAU * t / PERIOD);
  return { lower: w, upper: 1 - w };
}
function drawDisc(x, y, r, color, a) {
  if (r <= 0.5 || a <= 0.004) return;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = rgba(color, a);
  ctx.fill();
  ctx.strokeStyle = rgba(WHITE, a * 0.35);
  ctx.lineWidth = 1;
  ctx.stroke();
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var cy = st.y + st.h / 2;
  /* centers run from just inside the left edge to (stage right - largest radius),
     so the biggest disc never clips the viewport edge */
  var maxR = 23 * base;
  var c0 = st.x + 10 + 2 * base;
  var c8 = st.x + st.w - maxR - 10;
  var step = (c8 - c0) / (COUNT - 1);
  var w = tideWeights(phaseT);
  var i, d, cx, r;
  /* lower octave: gold, radii base * prime */
  for (i = 0; i < COUNT; i++) {
    d = DISCS[i];
    cx = c0 + i * step;
    r = base * d.prime;
    drawDisc(cx, cy, r, GOLD, d.alpha * w.lower);
  }
  /* upper octave: cool white, radii base * prime / 2, offset half a step */
  for (i = 0; i < COUNT; i++) {
    d = DISCS[i];
    cx = c0 + (i + 0.5) * step;
    r = base * d.prime * 0.5;
    drawDisc(cx, cy, r, WHITE, d.upperAlpha * w.upper);
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('New Primes').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('New Primes').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 07').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('New Primes', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 07', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to retune the fundamental.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function pointerX(e) {
  if (e.touches && e.touches.length) return e.touches[0].clientX;
  return e.clientX;
}
function onDown(e) {
  dragging = true;
  releaseT = -1;
  dragStartX = pointerX(e);
  dragStartBase = baseTarget;
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (!dragging) return;
  var dx = pointerX(e) - dragStartX;
  var f = clamp(1 + dx / Math.max(VW, 1) * 2.2, 0.45, 2.2);
  baseTarget = clamp(dragStartBase * f, base0 * 0.45, base0 * 1.6);
  if (e.preventDefault) e.preventDefault();
}
function onUp() {
  if (!dragging) return;
  dragging = false;
  releaseT = phaseT;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; if (!dragging && releaseT < 0) { base = driftBase(t); baseTarget = base; } draw(); },
    primeCount: function () { return COUNT; },
    primes: function () { return PRIMES.slice(); },
    baseRadius: function () { return base; },
    baseTarget: function () { return baseTarget; },
    tideWeights: function () { return tideWeights(phaseT); },
    phaseT: function () { return phaseT; },
    discRadii: function () { var out = [], i; for (i = 0; i < COUNT; i++) out.push(base * PRIMES[i]); return out; }
  };
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
  }
}
/* ---- frame one: fixed phase t = 7.5 s of a 30 s tide, bands at equal mix ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      if (dragging) {
        base += (baseTarget - base) * Math.min(1, dt * 10);
      } else if (releaseT >= 0) {
        /* ease back to the drift value over about 4 s */
        var drift = driftBase(phaseT);
        var k = 1 - Math.exp(-dt / 1.3);
        baseTarget += (drift - baseTarget) * k;
        base += (baseTarget - base) * Math.min(1, dt * 10);
        if (Math.abs(baseTarget - drift) < 0.01 && Math.abs(base - drift) < 0.05) releaseT = -1;
      } else {
        base = driftBase(phaseT);
        baseTarget = base;
      }
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
