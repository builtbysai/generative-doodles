<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cuatro Elementos</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0F0C0A; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.677 "Cuatro Elementos" (EXPANSION #82 clemente-mckay, block 5).
  // His doctrine as a living cycle: clay is earth and fire, because
  // the clay needs fire to take form; water circulates inside it and
  // activates the air that makes the instrument work. Four stations
  // on a thin ring (tierra, fuego, agua, aire) around one center
  // form that morphs through the four states in step: matte mound,
  // mound glowing from within, vessel with circulating water, vessel
  // exhaling breath lines. A 48 s watch-only loop; dragging spins the
  // cycle by hand, silently. One breathy tone may sound in the aire
  // phase, once per cycle, and only after a visitor gesture has
  // unlocked audio (browser autoplay policy); see process.md.

  var CLAY = '#8A4A2B';
  var KILN = '#E2722B';
  var EMBER = '#C22E1E';
  var WATER = '#2E5F6B';
  var AIR = '#CFE4E4';
  var GROUND = '#0F0C0A';

  // Composition space: a square field. Ring center and radius below;
  // stations sit on the ring at top, right, bottom, left.
  var FW = 1.0, FH = 1.0;
  var CX = 0.5, CY = 0.50;
  var RING_R = 0.335;
  var BASE_SEED = 677001;
  var LOOP = 48; // seconds for the full four-element cycle
  var HOLD = 10; // seconds each element holds before the 2 s morph

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(a, b, v) { var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // ------------------------------------------------------------------
  // THE CENTER FORM. Two closed outlines with the same point count
  // and the same winding (start at the bottom-left corner, up the
  // left side, over the top, down the right side, back along the
  // base), so the form can morph between them point by point.
  //   MOUND:  a wide matte dome of raw clay.
  //   VESSEL: a globular body with a neck and a flared rim.
  // Tierra and fuego share the mound; agua and aire share the vessel.
  // ------------------------------------------------------------------
  function moundOutline() {
    var pts = [];
    var i, t, x;
    for (i = 0; i <= 14; i++) {           // over the dome, left to right
      t = i / 14;
      x = -0.155 + 0.31 * t;
      pts.push([x, 0.105 - 0.215 * Math.pow(Math.sin(Math.PI * t), 0.8)]);
    }
    for (i = 1; i <= 13; i++) {           // back along the base
      x = 0.155 - 0.31 * (i / 14);
      pts.push([x, 0.105]);
    }
    return pts;
  }
  function vesselOutline() {
    return [
      [-0.100, 0.105], [-0.128, 0.070], [-0.136, 0.025], [-0.122, -0.025],
      [-0.088, -0.058], [-0.054, -0.072], [-0.052, -0.095], [-0.080, -0.112],
      [-0.052, -0.119], [0.000, -0.121], [0.052, -0.119],
      [0.080, -0.112], [0.052, -0.095], [0.054, -0.072], [0.088, -0.058],
      [0.122, -0.025], [0.136, 0.025], [0.128, 0.070], [0.100, 0.105],
      [0.078, 0.105], [0.056, 0.105], [0.033, 0.105], [0.011, 0.105],
      [-0.011, 0.105], [-0.033, 0.105], [-0.056, 0.105], [-0.078, 0.105],
      [-0.089, 0.105]
    ];
  }
  var MOUND = moundOutline();
  var VESSEL = vesselOutline();

  // Ember specks for the fuego state: seeded once, pure functions of t.
  var EMBERS = [];
  (function () {
    var rnd = mulberry32(BASE_SEED);
    for (var i = 0; i < 16; i++) {
      EMBERS.push({
        x0: -0.115 + rnd() * 0.23,
        speed: 0.045 + rnd() * 0.075,
        off: rnd(),
        drift: 2.5 + rnd() * 4.0,
        kiln: rnd() < 0.45
      });
    }
  })();

  // ------------------------------------------------------------------
  // Cycle state. e runs 0..4 over the loop; element k holds for HOLD
  // seconds of its 12 s span, then morphs to element k+1 over 2 s.
  // Each visual parameter has one value per element; the live value
  // interpolates between the active element and the next by the
  // eased transition amount. Presence of a station follows the same
  // weights, so the ring and the center form stay locked together.
  // ------------------------------------------------------------------
  var PARAMS = {
    vessel: [0, 0, 1, 1],
    glow:   [0, 1, 0, 0],
    water:  [0, 0, 1, 0],
    breath: [0, 0, 0, 1]
  };
  function cycleState(t) {
    var e = ((t % LOOP) + LOOP) % LOOP / (LOOP / 4); // 0..4
    var idx = Math.floor(e) % 4;
    var local = e - Math.floor(e);                    // 0..1 in the span
    var span = LOOP / 4;
    var trans = smooth(HOLD / span, 1, local);
    var st = { idx: idx, trans: trans, presence: [0, 0, 0, 0] };
    st.presence[idx] = 1 - trans;
    st.presence[(idx + 1) % 4] = trans;
    for (var k in PARAMS) {
      st[k] = lerp(PARAMS[k][idx], PARAMS[k][(idx + 1) % 4], trans);
    }
    return st;
  }

  // ------------------------------------------------------------------
  // Audio. Created lazily on the first pointer gesture (autoplay
  // policy); the aire tone then sounds once per cycle when the aire
  // phase arrives on its own, never while or shortly after the
  // visitor drags the cycle by hand. If audio was never unlocked the
  // aire phase is visual only. All access is typeof-guarded and
  // wrapped so a headless renderer without AudioContext runs clean.
  // ------------------------------------------------------------------
  var audioCtx = null;
  var audioTried = false;
  function unlockAudio() {
    if (audioTried) return;
    audioTried = true;
    try {
      var AC = (typeof window !== 'undefined') &&
        (window.AudioContext || window.webkitAudioContext);
      if (AC) audioCtx = new AC();
    } catch (err) { audioCtx = null; }
  }
  function playAireTone() {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
      var dur = 4.0;
      var t = audioCtx.currentTime;
      var len = Math.floor(audioCtx.sampleRate * dur);
      var buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      var src = audioCtx.createBufferSource();
      src.buffer = buffer;
      var filt = audioCtx.createBiquadFilter();
      filt.type = 'bandpass';
      filt.Q.value = 0.9;
      filt.frequency.setValueAtTime(480, t);
      filt.frequency.linearRampToValueAtTime(880, t + dur * 0.5);
      filt.frequency.linearRampToValueAtTime(420, t + dur);
      var gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.11, t + dur * 0.35);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
      src.start(t); src.stop(t + dur);
    } catch (err) { /* audio is an ornament; never break the piece */ }
  }

  // ------------------------------------------------------------------
  // Canvas, sizing, house rules.
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var scale = 1, orgX = 0, orgY = 0;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr) isPhone = Math.min(scr.width, scr.height) < 700;
    else isPhone = h > w * 1.15;
    scale = Math.min(W / FW, H / FH) * 0.97;
    orgX = (W - FW * scale) / 2;
    orgY = (H - FH * scale) / 2;
  }
  function px(x) { return orgX + x * scale; }
  function py(y) { return orgY + y * scale; }

  // ------------------------------------------------------------------
  // Drawing helpers, all in composition units relative to a point.
  // ------------------------------------------------------------------
  function pathFrom(pts, cx, cy, s) {
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var X = px(cx + pts[i][0] * s), Y = py(cy + pts[i][1] * s);
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.closePath();
  }
  function fillPath(pts, cx, cy, s, color, alpha) {
    if (alpha <= 0.004) return;
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    pathFrom(pts, cx, cy, s);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  function strokePath(pts, cx, cy, s, color, alpha, wComp, close) {
    if (alpha <= 0.004) return;
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(0.7, wComp * scale);
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var X = px(cx + pts[i][0] * s), Y = py(cy + pts[i][1] * s);
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    if (close) ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function dot(x, y, r, color, alpha) {
    if (alpha <= 0.004) return;
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(px(x), py(y), Math.max(0.6, r * scale), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  function ellipse(x, y, rx, ry, color, alpha) {
    if (alpha <= 0.004 || rx <= 0 || ry <= 0) return;
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.ellipse(px(x), py(y), rx * scale, ry * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  function smoothLine(pts, color, alpha, wComp) {
    // Polyline through pts, smoothed with quadratic midpoints.
    if (alpha <= 0.004 || pts.length < 2) return;
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(0.7, wComp * scale);
    ctx.beginPath();
    ctx.moveTo(px(pts[0][0]), py(pts[0][1]));
    for (var i = 1; i < pts.length - 1; i++) {
      var mx = (pts[i][0] + pts[i + 1][0]) / 2;
      var my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(px(pts[i][0]), py(pts[i][1]), px(mx), py(my));
    }
    var last = pts[pts.length - 1];
    ctx.lineTo(px(last[0]), py(last[1]));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // Station icons. Drawn in a local frame: u across, v up-positive,
  // s = half-size of the icon. Presence scales and brightens.
  // ------------------------------------------------------------------
  var STATIONS = [
    { name: 'tierra', ang: -Math.PI / 2 },
    { name: 'fuego',  ang: 0 },
    { name: 'agua',   ang: Math.PI / 2 },
    { name: 'aire',   ang: Math.PI }
  ];
  function moundIconPts() {
    var pts = [];
    for (var i = 0; i <= 12; i++) {
      var t = i / 12;
      pts.push([(t - 0.5) * 2, 0.38 - 0.95 * Math.pow(Math.sin(Math.PI * t), 0.8)]);
    }
    pts.push([1, 0.38]);
    return pts;
  }
  var MOUND_ICON = moundIconPts();
  var VESSEL_ICON = null;
  (function () {
    // Mini vessel: reuse the center outline, normalized to unit size.
    VESSEL_ICON = VESSEL.map(function (p) { return [p[0] / 0.155, p[1] / 0.155]; });
  })();

  function drawStation(st, pres, t) {
    var cx = CX + Math.cos(st.ang) * RING_R;
    var cy = CY + Math.sin(st.ang) * RING_R;
    var s = 0.052 * (0.78 + 0.5 * pres);
    var a = 0.42 + 0.58 * pres;
    // Node on the ring.
    dot(cx, cy, 0.0055, CLAY, 0.35 + 0.65 * pres);
    ctx.save();
    ctx.translate(px(cx), py(cy));
    ctx.scale(s * scale, s * scale);
    // Icons in local units, y down (canvas), base line at v=+0.38.
    function L(pts, close) {
      ctx.beginPath();
      for (var i = 0; i < pts.length; i++) {
        if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);
      }
      if (close) ctx.closePath();
    }
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (st.name === 'tierra') {
      ctx.fillStyle = CLAY; ctx.globalAlpha = a;
      L(MOUND_ICON, true); ctx.fill();
    } else if (st.name === 'fuego') {
      ctx.fillStyle = CLAY; ctx.globalAlpha = a;
      L(MOUND_ICON, true); ctx.fill();
      ctx.fillStyle = KILN; ctx.globalAlpha = a * (0.65 + 0.25 * Math.sin(t * 2.0));
      ctx.beginPath(); ctx.ellipse(0, 0.10, 0.34, 0.20, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = EMBER; ctx.globalAlpha = a;
      ctx.lineWidth = 0.09;
      var ticks = [[-0.45, -0.62, -0.55, -0.85], [0, -0.72, 0, -0.98], [0.45, -0.62, 0.55, -0.85]];
      for (var i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(ticks[i][0], ticks[i][1]);
        ctx.lineTo(ticks[i][2], ticks[i][3]);
        ctx.stroke();
      }
    } else if (st.name === 'agua') {
      ctx.strokeStyle = CLAY; ctx.globalAlpha = a; ctx.lineWidth = 0.10;
      L(VESSEL_ICON, true); ctx.stroke();
      ctx.strokeStyle = WATER; ctx.globalAlpha = a; ctx.lineWidth = 0.09;
      ctx.beginPath();
      ctx.moveTo(-0.62, 0.05);
      ctx.quadraticCurveTo(-0.3, -0.06 + 0.05 * Math.sin(t * 2.4), 0, 0.05);
      ctx.quadraticCurveTo(0.3, 0.16 + 0.05 * Math.sin(t * 2.4 + 1.5), 0.62, 0.05);
      ctx.stroke();
    } else { // aire
      ctx.strokeStyle = CLAY; ctx.globalAlpha = a; ctx.lineWidth = 0.10;
      L(VESSEL_ICON, true); ctx.stroke();
      ctx.strokeStyle = AIR; ctx.globalAlpha = a * 0.9; ctx.lineWidth = 0.08;
      for (var b = -1; b <= 1; b++) {
        ctx.beginPath();
        ctx.moveTo(b * 0.16, -0.78);
        ctx.quadraticCurveTo(b * 0.30, -1.02, b * 0.22 + (b === 0 ? 0.05 : b * 0.12), -1.28);
        ctx.stroke();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    // Label, radially outward from the ring. The piece's only words.
    var lx = CX + Math.cos(st.ang) * (RING_R + 0.082);
    var ly = CY + Math.sin(st.ang) * (RING_R + 0.082);
    ctx.fillStyle = AIR;
    ctx.globalAlpha = 0.45 + 0.55 * pres;
    ctx.font = '500 ' + Math.max(10, Math.round(0.0235 * scale)) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(st.name, px(lx), py(ly));
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // The center form and its four lives.
  // ------------------------------------------------------------------
  function drawCenterForm(st, t) {
    // Morphed outline.
    var pts = [];
    for (var i = 0; i < MOUND.length; i++) {
      pts.push([
        lerp(MOUND[i][0], VESSEL[i][0], st.vessel),
        lerp(MOUND[i][1], VESSEL[i][1], st.vessel)
      ]);
    }
    // FUEGO: glow core first, under the rim of the silhouette edge.
    if (st.glow > 0.004) {
      var pulse = 1 + 0.055 * Math.sin(t * (Math.PI * 2 / 3.2));
      ellipse(CX, CY + 0.028, 0.104 * pulse, 0.072 * pulse, KILN, 0.50 * st.glow);
      ellipse(CX, CY + 0.034, 0.058 * pulse, 0.042 * pulse, EMBER, 0.75 * st.glow);
    }
    // Clay body.
    fillPath(pts, CX, CY, 1, CLAY, 1);
    // In fuego the glow must read as coming from within: redraw the
    // core over the body, clipped by nothing but sized to sit inside.
    if (st.glow > 0.004) {
      var p2 = 1 + 0.055 * Math.sin(t * (Math.PI * 2 / 3.2));
      ellipse(CX, CY + 0.028, 0.088 * p2, 0.060 * p2, KILN, 0.55 * st.glow);
      ellipse(CX, CY + 0.034, 0.046 * p2, 0.033 * p2, EMBER, 0.8 * st.glow);
    }
    strokePath(pts, CX, CY, 1, GROUND, 0.35, 0.0016, true);
    // Kiln baseline.
    ctx.strokeStyle = CLAY;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = Math.max(0.7, 0.0016 * scale);
    ctx.beginPath();
    ctx.moveTo(px(CX - 0.175), py(CY + 0.112));
    ctx.lineTo(px(CX + 0.175), py(CY + 0.112));
    ctx.stroke();
    ctx.globalAlpha = 1;

    // FUEGO: ember specks rising off the mound.
    if (st.glow > 0.004) {
      for (var e = 0; e < EMBERS.length; e++) {
        var em = EMBERS[e];
        var ph = (t * em.speed + em.off) % 1;
        var ex = CX + em.x0 + Math.sin(ph * em.drift + em.off * 7) * 0.010;
        var ey = CY + 0.0 - ph * 0.20;
        dot(ex, ey, 0.0024 * (1 - ph * 0.45), em.kiln ? KILN : EMBER,
          st.glow * (1 - ph) * 0.9);
      }
    }
    // AGUA: water resting in the vessel and circulating inside it.
    if (st.water > 0.004) {
      ellipse(CX, CY + 0.052, 0.094, 0.044, WATER, 0.35 * st.water);
      ctx.strokeStyle = WATER;
      ctx.globalAlpha = 0.9 * st.water;
      ctx.lineWidth = Math.max(0.7, 0.0038 * scale);
      ctx.setLineDash([0.016 * scale, 0.011 * scale]);
      ctx.lineDashOffset = -t * 0.028 * scale;
      ctx.beginPath();
      ctx.ellipse(px(CX), py(CY + 0.005), 0.082 * scale, 0.070 * scale, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
    // AIRE: resonance rings at the mouth, then breath lines curling out.
    if (st.breath > 0.004) {
      for (var r = 0; r < 2; r++) {
        var frac = (t / 2.4 + r * 0.5) % 1;
        var rr = 0.018 + frac * 0.085;
        ctx.strokeStyle = AIR;
        ctx.globalAlpha = (1 - frac) * 0.40 * st.breath;
        ctx.lineWidth = Math.max(0.7, 0.0014 * scale);
        ctx.beginPath();
        ctx.arc(px(CX), py(CY - 0.128), rr * scale, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      var grow = 1 + 0.08 * Math.sin(t * (Math.PI * 2 / 5));
      var curves = [
        [[0, -0.118], [-0.012, -0.172], [0.016, -0.224], [0.0, -0.272]],
        [[0, -0.118], [-0.052, -0.162], [-0.088, -0.204], [-0.102, -0.262]],
        [[0, -0.118], [0.052, -0.162], [0.088, -0.204], [0.102, -0.262]]
      ];
      for (var c = 0; c < 3; c++) {
        var cp = curves[c].map(function (p) {
          return [CX + p[0] * grow, CY + p[1] * grow];
        });
        smoothLine(cp, AIR, st.breath * (0.5 + 0.32 * Math.sin(t * 2.2 - c * 0.9)), 0.0026);
      }
    }
  }

  // ------------------------------------------------------------------
  // Interaction. Dragging spins the cycle (a phase offset in
  // seconds) and unlocks audio; it never makes a sound itself.
  // ------------------------------------------------------------------
  var phaseOffset = 0;
  var dragging = false;
  var lastPX = 0;
  var lastDragEnd = -1e9;
  function pointerX(ev) {
    if (ev.clientX !== undefined) return ev.clientX;
    if (ev.touches && ev.touches.length) return ev.touches[0].clientX;
    if (ev.changedTouches && ev.changedTouches.length) return ev.changedTouches[0].clientX;
    return 0;
  }
  function onDown(ev) {
    unlockAudio();
    dragging = true;
    lastPX = pointerX(ev);
    if (canvas.style) canvas.style.cursor = 'grabbing';
  }
  function onMove(ev) {
    if (!dragging) return;
    var x = pointerX(ev);
    var dx = x - lastPX;
    lastPX = x;
    phaseOffset += dx * 0.02; // seconds of cycle per pixel dragged
  }
  function onUp() {
    if (dragging) { lastDragEnd = elapsed(); }
    dragging = false;
    if (canvas.style) canvas.style.cursor = 'grab';
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('touchstart', onDown);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onUp);
    window.addEventListener('resize', function () { resize(); draw(); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
    }
  }

  // ------------------------------------------------------------------
  // Clock and main draw. Frame one is an explicit draw at t = 0; the
  // loop, when available, runs on an anchored performance clock plus
  // the visitor's drag offset. Nothing reads Date.now().
  // ------------------------------------------------------------------
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - t0) / 1000;
    }
    return 0;
  }
  var prevBreath = 0;
  var lastToneCycle = -1;
  function maybeTone(st, t) {
    var cyc = Math.floor(t / LOOP);
    if (st.breath > 0.9 && prevBreath <= 0.9 && cyc !== lastToneCycle &&
        !dragging && (elapsed() - lastDragEnd) > 12 && audioCtx) {
      lastToneCycle = cyc;
      playAireTone();
    }
    prevBreath = st.breath;
  }
  function draw(tOverride) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var t = (typeof tOverride === 'number') ? tOverride : elapsed() + phaseOffset;
    var st = cycleState(t);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    // The ring.
    ctx.strokeStyle = AIR;
    ctx.globalAlpha = 0.26;
    ctx.lineWidth = Math.max(0.7, 0.0015 * scale);
    ctx.beginPath();
    ctx.arc(px(CX), py(CY), RING_R * scale, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    drawCenterForm(st, t);
    for (var i = 0; i < STATIONS.length; i++) {
      drawStation(STATIONS[i], st.presence[i], t);
    }
    maybeTone(st, t);
  }

  // QA hook: ?seed=t<seconds> forces a fixed cycle time, still with
  // no drag offset, so states can be rendered headlessly.
  var forcedT = -1;
  try {
    var m = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(
      (typeof location !== 'undefined' && location.search) || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (err) { forcedT = -1; }

  resize();
  draw(forcedT >= 0 ? forcedT : 0);
  if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
