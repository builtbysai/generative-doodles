<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1974 Infinite Strangers</title>
<style>
  html, body { margin: 0; padding: 0; background: #f2ead8; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Infinite Strangers, TL7 / PP1221, study #257 theodora-laird.
  // A 3x4 grid of parallel-universe panels. Each panel holds a
  // tiny city and a tiny crowd of strangers. Small dark objects
  // fall from the top of each panel: umbrellas, pianos,
  // briefcases, teacups, flat silhouettes in muted red. When one
  // lands, the crowd scatters and reforms, and the narration
  // strip along the bottom advances one clause. Watch-only.
  // The tone is wry and deadpan, never violent: the objects
  // are theatrical props, the strangers are pictograms.
  var PAPER = '#f2ead8';  // warm paper ground
  var PANEL = '#e9dec6';  // panel ground, a shade deeper
  var INK = '#211d18';    // ink black silhouettes and type
  var RED = '#a34a3a';    // falling objects, muted red
  var REDD = '#7e362b';   // darker red detail
  var GRAY = '#8a8072';   // distant buildings

  // Fixed-phase first frame: FIRST_T = 12 s. By then every
  // panel has seen at least one landing, several crowds are
  // mid-scatter or reforming, and the narration has advanced
  // past the first clause.
  var FIRST_T = 12;
  var SEED = 1974;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // The sentence, split into clauses. One clause is added per
  // landing event, anywhere in the grid, and the strip cycles.
  var CLAUSES = [
    'Awful things happen every day.',
    'Pianos fall on the heads of infinite strangers,',
    'in infinite cities,',
    'in infinite parallel universes.'
  ];

  // Per-panel schedule, seeded once. Period 5.5 to 8 s, offset
  // spread across the first period, fall takes 1.6 s.
  var FALL_DUR = 1.6;
  var PANELS = [];
  (function () {
    var p, rng;
    for (p = 0; p < 12; p++) {
      rng = mulberry32(SEED * 17 + p * 131 + 5);
      PANELS.push({
        period: 5.5 + rng() * 2.5,
        offset: rng() * 5.5,
        seed: Math.floor(rng() * 100000)
      });
    }
  })();

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function spaced(s) { return s.split('').join(' '); }

  // Landing times for panel p: offset + k * period, k >= 0.
  function landTime(p, k) { return PANELS[p].offset + k * PANELS[p].period; }
  // Landing x within the panel, seeded by panel and landing index.
  function landX(p, k) {
    var rng = mulberry32(PANELS[p].seed + k * 7919 + 11);
    return 0.18 + rng() * 0.64; // fraction of panel width
  }
  // Object kind for a landing: cycles umbrella, piano, briefcase, teacup.
  function landKind(p, k) { return (p + k) % 4; }
  // How many landings have happened anywhere by time t.
  function totalLandings(t) {
    var n = 0, p, k;
    for (p = 0; p < 12; p++) {
      for (k = 0; landTime(p, k) <= t; k++) { n++; }
    }
    return n;
  }
  // Most recent landing in panel p at or before t, or null.
  function lastLanding(p, t) {
    var k = Math.floor((t - PANELS[p].offset) / PANELS[p].period);
    if (k < 0) { return null; }
    return { k: k, time: landTime(p, k) };
  }
  // Next landing in panel p after t, or null.
  function nextLanding(p, t) {
    var k = Math.floor((t - PANELS[p].offset) / PANELS[p].period) + 1;
    if (k < 0) { k = 0; }
    return { k: k, time: landTime(p, k) };
  }

  var L = {};
  function layout() {
    L.gap = Math.max(4, W * 0.012);
    L.headH = isPhone ? H * 0.095 : H * 0.075;
    L.stripH = isPhone ? H * 0.115 : H * 0.115;
    L.gridX = isPhone ? W * 0.03 : W * 0.035;
    L.gridY = L.headH;
    L.gridW = W - L.gridX * 2;
    L.gridH = H - L.headH - L.stripH;
    L.pw = (L.gridW - L.gap * 2) / 3;
    L.ph = (L.gridH - L.gap * 3) / 4;
    L.fsTitle = Math.round(clamp(W * 0.042, 20, 34));
    L.fsSmall = Math.round(clamp(W * 0.018, 10, 14));
    L.fsNarr = Math.round(clamp(W * 0.030, 15, 24));
    L.lhNarr = L.fsNarr * 1.45;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function panelRect(p) {
    var col = p % 3, row = Math.floor(p / 3);
    return {
      x: L.gridX + col * (L.pw + L.gap),
      y: L.gridY + row * (L.ph + L.gap),
      w: L.pw, h: L.ph
    };
  }

  // ---- Falling objects, flat silhouettes in muted red --------
  // Drawn centred on (cx, cy) at scale s (half-width of the
  // object in px). All four kinds read at panel size.
  function drawObject(kind, cx, cy, s) {
    ctx.fillStyle = RED;
    ctx.strokeStyle = RED;
    if (kind === 0) {
      // Umbrella: canopy arc, tip, straight shaft, hook.
      ctx.beginPath();
      ctx.moveTo(cx - s, cy);
      ctx.arc(cx, cy, s, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      ctx.lineWidth = Math.max(1, s * 0.10);
      ctx.beginPath();
      ctx.moveTo(cx, cy - s * 1.15);
      ctx.lineTo(cx, cy + s * 1.05);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx, cy + s * 1.05);
      ctx.quadraticCurveTo(cx - s * 0.28, cy + s * 1.25, cx - s * 0.34, cy + s * 1.05);
      ctx.stroke();
      ctx.fillStyle = REDD;
      ctx.beginPath();
      ctx.moveTo(cx + s * 0.10, cy - s * 1.15);
      ctx.arc(cx, cy - s * 1.15, s * 0.10, 0, Math.PI * 2);
      ctx.fill();
    } else if (kind === 1) {
      // Piano: grand body with a curved wing, an open lid
      // propped above it, three legs, and a strip of keys.
      // Lid: a tilted slab above the body.
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.95, cy - s * 0.95);
      ctx.lineTo(cx + s * 0.55, cy - s * 1.15);
      ctx.lineTo(cx + s * 0.95, cy - s * 0.85);
      ctx.lineTo(cx - s * 0.55, cy - s * 0.62);
      ctx.closePath();
      ctx.fill();
      // Prop stick holding the lid open.
      ctx.fillStyle = REDD;
      ctx.fillRect(cx + s * 0.55, cy - s * 0.90, s * 0.08, s * 0.62);
      // Body with a curved right wing.
      ctx.fillStyle = RED;
      ctx.beginPath();
      ctx.moveTo(cx - s, cy - s * 0.28);
      ctx.lineTo(cx + s * 0.55, cy - s * 0.28);
      ctx.quadraticCurveTo(cx + s, cy - s * 0.05, cx + s * 0.72, cy + s * 0.28);
      ctx.lineTo(cx - s, cy + s * 0.28);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = REDD;
      ctx.fillRect(cx - s, cy + s * 0.28, s * 0.10, s * 0.55);
      ctx.fillRect(cx + s * 0.45, cy + s * 0.28, s * 0.10, s * 0.55);
      // Keys: a pale strip along the front edge.
      ctx.fillStyle = PAPER;
      ctx.fillRect(cx - s * 0.92, cy + s * 0.02, s * 0.85, s * 0.12);
      ctx.fillStyle = REDD;
      var ki;
      for (ki = 0; ki < 5; ki++) {
        ctx.fillRect(cx - s * 0.85 + ki * s * 0.17, cy + s * 0.02, s * 0.05, s * 0.12);
      }
    } else if (kind === 2) {
      // Briefcase: body, clasp, handle.
      ctx.fillRect(cx - s, cy - s * 0.45, s * 2, s * 0.95);
      ctx.fillStyle = REDD;
      ctx.fillRect(cx - s * 0.12, cy - s * 0.12, s * 0.24, s * 0.18);
      ctx.strokeStyle = REDD;
      ctx.lineWidth = Math.max(1.2, s * 0.12);
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.45, cy - s * 0.45);
      ctx.lineTo(cx - s * 0.45, cy - s * 0.85);
      ctx.lineTo(cx + s * 0.45, cy - s * 0.85);
      ctx.lineTo(cx + s * 0.45, cy - s * 0.45);
      ctx.stroke();
    } else {
      // Teacup: cup, handle, saucer, a wisp of steam.
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.62, cy - s * 0.42);
      ctx.lineTo(cx + s * 0.62, cy - s * 0.42);
      ctx.lineTo(cx + s * 0.42, cy + s * 0.42);
      ctx.lineTo(cx - s * 0.42, cy + s * 0.42);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = RED;
      ctx.lineWidth = Math.max(1.2, s * 0.14);
      ctx.beginPath();
      ctx.moveTo(cx + s * 0.62, cy - s * 0.25);
      ctx.quadraticCurveTo(cx + s * 1.05, cy - s * 0.10, cx + s * 0.62, cy + s * 0.22);
      ctx.stroke();
      ctx.fillStyle = REDD;
      ctx.fillRect(cx - s * 0.85, cy + s * 0.55, s * 1.7, s * 0.10);
      ctx.strokeStyle = hexA(REDD, a4(0.55));
      ctx.lineWidth = Math.max(1, s * 0.08);
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.15, cy - s * 0.55);
      ctx.quadraticCurveTo(cx + s * 0.05, cy - s * 0.85, cx - s * 0.15, cy - s * 1.05);
      ctx.stroke();
    }
  }

  // ---- One panel ----------------------------------------------
  function drawPanel(p, t) {
    var r = panelRect(p);
    var rng = mulberry32(SEED * 41 + p * 977 + 3);
    var i, j;

    // Panel ground and thin ink frame.
    ctx.fillStyle = PANEL;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = hexA(INK, a4(0.55));
    ctx.lineWidth = 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);

    ctx.save();
    ctx.beginPath();
    ctx.rect(r.x, r.y, r.w, r.h);
    ctx.clip();

    // Tiny city: a row of flat buildings along the ground line.
    var groundY = r.y + r.h * 0.80;
    var bx = r.x + r.w * 0.04;
    var bld = [];
    while (bx < r.x + r.w * 0.94) {
      var bw = r.w * (0.10 + rng() * 0.10);
      var bh = r.h * (0.16 + rng() * 0.30);
      bld.push({ x: bx, w: bw, h: bh });
      bx += bw + r.w * 0.015;
    }
    for (i = 0; i < bld.length; i++) {
      ctx.fillStyle = (i % 3 === 0) ? hexA(GRAY, a4(0.55)) : hexA(INK, a4(0.72));
      ctx.fillRect(bld[i].x, groundY - bld[i].h, bld[i].w, bld[i].h);
      // Lit windows: tiny paper dots.
      var wrng = mulberry32(SEED + p * 31 + i * 17);
      for (j = 0; j < 3; j++) {
        if (wrng() < 0.5) {
          ctx.fillStyle = hexA(PAPER, a4(0.85));
          ctx.fillRect(bld[i].x + bld[i].w * (0.2 + wrng() * 0.55),
            groundY - bld[i].h + bld[i].h * (0.2 + wrng() * 0.55),
            Math.max(1, r.w * 0.012), Math.max(1, r.w * 0.012));
        }
      }
    }
    // Ground line.
    ctx.strokeStyle = hexA(INK, a4(0.8));
    ctx.lineWidth = Math.max(1, r.w * 0.008);
    ctx.beginPath();
    ctx.moveTo(r.x, groundY);
    ctx.lineTo(r.x + r.w, groundY);
    ctx.stroke();

    // The falling object: either mid-fall, resting just after
    // a landing, or not yet in view.
    var last = lastLanding(p, t);
    var next = nextLanding(p, t);
    var objS = r.w * 0.14;
    var lx = 0, kind = 0, oy = 0, showObj = false, resting = false, restA = 1;
    if (next && (next.time - t) <= FALL_DUR) {
      // Mid-fall: eases down from the panel top to the ground.
      var prog = 1 - (next.time - t) / FALL_DUR;
      var ease = prog * prog * (3 - 2 * prog);
      kind = landKind(p, next.k);
      lx = r.x + landX(p, next.k) * r.w;
      oy = r.y - objS + ease * (groundY - objS * 0.6 - (r.y - objS));
      showObj = true;
    } else if (last && (t - last.time) < 0.9) {
      // Resting on the ground just after landing, fading out.
      kind = landKind(p, last.k);
      lx = r.x + landX(p, last.k) * r.w;
      oy = groundY - objS * 0.6;
      restA = 1 - (t - last.time) / 0.9;
      showObj = true;
      resting = true;
    }
    if (showObj) {
      ctx.save();
      if (resting) { ctx.globalAlpha = a4(clamp(restA, 0, 1)); }
      drawObject(kind, lx, oy, objS);
      ctx.restore();
    }

    // Dust puff at the most recent landing, expanding and fading.
    if (last && (t - last.time) < 1.2) {
      var dt = t - last.time;
      var prng = mulberry32(PANELS[p].seed + last.k * 7919 + 11);
      var px = r.x + (0.18 + prng() * 0.64) * r.w;
      var pr = r.w * (0.04 + dt * 0.07);
      ctx.strokeStyle = hexA(INK, a4(clamp(0.35 * (1 - dt / 1.2), 0, 1)));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px + pr, groundY - 1);
      ctx.arc(px, groundY - 1, pr, 0, Math.PI * 2);
      ctx.stroke();
    }

    // The crowd: seven pictogram strangers. Each has a home
    // spot on the ground; after a landing they scatter away
    // from the landing point and drift back over about 2.5 s.
    var scatter = 0, scatX = 0;
    if (last && (t - last.time) < 2.5) {
      var st = t - last.time;
      scatter = Math.exp(-st / 0.85);
      var srng = mulberry32(PANELS[p].seed + last.k * 7919 + 11);
      scatX = r.x + (0.18 + srng() * 0.64) * r.w;
    }
    var crng = mulberry32(SEED * 7 + p * 53 + 9);
    var nFig = 7;
    for (i = 0; i < nFig; i++) {
      var hx = r.x + r.w * (0.10 + (i / (nFig - 1)) * 0.80) + (crng() - 0.5) * r.w * 0.03;
      var fh = r.h * (0.085 + crng() * 0.02);
      var fx = hx;
      var fy = groundY;
      var hop = 0;
      if (scatter > 0.02) {
        var dir = (hx < scatX) ? -1 : 1;
        var dist = Math.abs(hx - scatX);
        var fall = clamp(1 - dist / (r.w * 0.55), 0.25, 1);
        fx = hx + dir * scatter * fall * r.w * 0.22;
        hop = scatter * fall * r.h * 0.05 * Math.abs(Math.sin(i * 2.3 + st * 6));
        fx = clamp(fx, r.x + r.w * 0.05, r.x + r.w * 0.95);
      }
      var headR = fh * 0.18;
      var bodyTop = fy - hop - fh + headR * 2;
      ctx.fillStyle = INK;
      // Head.
      ctx.beginPath();
      ctx.moveTo(fx + headR, fy - hop - fh + headR);
      ctx.arc(fx, fy - hop - fh + headR, headR, 0, Math.PI * 2);
      ctx.fill();
      // Body and legs: simple pictogram strokes.
      ctx.strokeStyle = INK;
      ctx.lineWidth = Math.max(1.2, r.w * 0.010);
      ctx.beginPath();
      ctx.moveTo(fx, bodyTop);
      ctx.lineTo(fx, fy - hop - fh * 0.28);
      ctx.moveTo(fx, fy - hop - fh * 0.28);
      ctx.lineTo(fx - fh * 0.22, fy - hop);
      ctx.moveTo(fx, fy - hop - fh * 0.28);
      ctx.lineTo(fx + fh * 0.22, fy - hop);
      ctx.moveTo(fx, bodyTop + fh * 0.18);
      ctx.lineTo(fx - fh * 0.28, bodyTop + fh * 0.34);
      ctx.moveTo(fx, bodyTop + fh * 0.18);
      ctx.lineTo(fx + fh * 0.28, bodyTop + fh * 0.34);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- Narration strip ----------------------------------------
  function wrapText(text, maxW) {
    var words = text.split(' ');
    var lines = [], cur = '', i;
    for (i = 0; i < words.length; i++) {
      var trial = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(trial).width > maxW && cur) {
        lines.push(cur);
        cur = words[i];
      } else {
        cur = trial;
      }
    }
    if (cur) { lines.push(cur); }
    return lines;
  }

  function drawStrip(t) {
    var sy = H - L.stripH;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, sy, W, L.stripH);
    ctx.strokeStyle = hexA(INK, a4(0.55));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, sy + 0.5);
    ctx.lineTo(W, sy + 0.5);
    ctx.stroke();

    var landed = totalLandings(t);
    var k = landed % CLAUSES.length;
    var shown = '';
    var ci;
    for (ci = 0; ci <= k; ci++) {
      shown += (ci ? ' ' : '') + CLAUSES[ci];
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = INK;
    ctx.font = 'italic ' + L.fsNarr + 'px Georgia, "Times New Roman", serif';
    var maxW = W * (isPhone ? 0.90 : 0.88);
    var lines = wrapText(shown, maxW);
    var totalH = lines.length * L.lhNarr;
    var y0 = sy + (L.stripH - totalH) / 2 + L.fsNarr * 0.8;
    var li;
    for (li = 0; li < lines.length; li++) {
      ctx.fillText(lines[li], W / 2, y0 + li * L.lhNarr);
    }
    // Clause dots: one per clause, filled up to the current one.
    var dotY = sy + L.stripH - Math.max(8, L.fsSmall * 0.9);
    var dotR = Math.max(2, L.fsSmall * 0.16);
    var dotGap = dotR * 2 + 8;
    var dotX0 = W / 2 - ((CLAUSES.length - 1) * dotGap) / 2;
    for (ci = 0; ci < CLAUSES.length; ci++) {
      ctx.beginPath();
      ctx.moveTo(dotX0 + ci * dotGap + dotR, dotY);
      ctx.arc(dotX0 + ci * dotGap, dotY, dotR, 0, Math.PI * 2);
      if (ci <= k) {
        ctx.fillStyle = RED;
        ctx.fill();
      } else {
        ctx.strokeStyle = hexA(INK, a4(0.5));
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // Header: title, number, and the watch-only cue.
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + L.fsTitle + 'px Georgia, "Times New Roman", serif';
    if (isPhone) {
      // Narrow sheet: the number line sits under the title
      // instead of crowding it on the same row.
      ctx.fillText(spaced('INFINITE STRANGERS'), W / 2, L.headH * 0.38 + L.fsTitle * 0.35);
      ctx.fillStyle = hexA(INK, a4(0.65));
      ctx.font = L.fsSmall + 'px Georgia, "Times New Roman", serif';
      ctx.fillText('№ 1974 · Watch only', W / 2, L.headH * 0.82 + L.fsSmall * 0.4);
    } else {
      ctx.fillText(spaced('INFINITE STRANGERS'), W / 2, L.headH * 0.52 + L.fsTitle * 0.35);
      ctx.textAlign = 'right';
      ctx.fillStyle = hexA(INK, a4(0.65));
      ctx.font = L.fsSmall + 'px Georgia, "Times New Roman", serif';
      ctx.fillText('№ 1974 · Watch only', W - L.gridX, L.headH * 0.52 + L.fsSmall * 0.4);
    }
    ctx.textAlign = 'left';

    var p;
    for (p = 0; p < 12; p++) { drawPanel(p, t); }
    drawStrip(t);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1974 = {
      firstT: FIRST_T,
      landings: function (t) { return totalLandings(t); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
