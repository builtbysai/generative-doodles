<!DOCTYPE html>
<html lang="utf-8">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No8924 · Contour Drift</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f7f4ec; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(38,34,28,0.38); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for a new drift</div>
<script>
'use strict';
// No8924 Contour Drift.
// Sixty horizontal lines, each displaced by layered 1D value noise whose
// phase slides line to line, so the whole field reads as slow topographic
// drift. One warm-charcoal ink on paper white; negative space does the work.
// The seed chooses noise offsets, amplitude profile and phase rate;
// click for another.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '8924', 10) || 8924;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f7f4ec';
const INK = '#26221c';
const N_LINES = 60;

function compose(s) {
  const rnd = mulberry32(s);
  // Two octaves of 1D value noise, seeded lattice offsets.
  const lat1 = [], lat2 = [];
  const n1 = 9, n2 = 25;
  for (let i = 0; i < n1; i++) lat1.push(rnd());
  for (let i = 0; i < n2; i++) lat2.push(rnd());
  const phaseRate = 0.10 + rnd() * 0.22;   // how fast phase slides per line
  const basePhase = rnd() * Math.PI * 2;
  const ampMid = 0.10 + rnd() * 0.10;      // peak amplitude as share of height
  const wobble = 0.6 + rnd() * 0.8;        // second-octave weight
  return { lat1, lat2, n1, n2, phaseRate, basePhase, ampMid, wobble };
}

function smooth(t){ return t * t * (3 - 2 * t); }
function noise1(lat, n, x){
  const xi = Math.floor(x), xf = x - xi;
  const a = lat[((xi % n) + n) % n], b = lat[(((xi + 1) % n) + n) % n];
  return a + (b - a) * smooth(xf);
}

function renderPiece(c, W, H, p) {
  c.fillStyle = GROUND;
  c.fillRect(0, 0, W, H);

  // Field piece: lines run full-bleed edge to edge on every screen.
  const pad = H * 0.06;
  const span = H - pad * 2;
  const stepX = Math.max(2, W / 320);

  c.strokeStyle = INK;
  c.lineWidth = 1;

  for (let li = 0; li < N_LINES; li++) {
    const t = N_LINES === 1 ? 0.5 : li / (N_LINES - 1);
    const baseY = pad + t * span;
    // Amplitude swells toward the middle band and eases at the edges.
    const env = Math.sin(t * Math.PI);
    const amp = (H * 0.02 + H * p.ampMid * env);
    const ph = p.basePhase + li * p.phaseRate * Math.PI * 2 / N_LINES * 4;

    c.globalAlpha = 0.55 + 0.30 * env;
    c.beginPath();
    for (let x = -4; x <= W + 4; x += stepX) {
      const u = x / W;
      const n =
        noise1(p.lat1, p.n1, u * (p.n1 - 1) + ph) - 0.5 +
        (noise1(p.lat2, p.n2, u * (p.n2 - 1) + ph * 1.7) - 0.5) * p.wobble;
      const y = baseY + n * amp;
      if (x <= -4 + stepX) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
  }
  c.globalAlpha = 1;
}

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  const p = compose(seed);
  renderPiece(ctx, w, h, p);
}

window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  draw();
});
draw();
</script>
</body>
</html>
