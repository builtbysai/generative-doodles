<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Embrace</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0E2A24; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  // Palette: exactly the five colors of the brief, plus two darker
  // green tones from the same family for the foliage depth.
  var DEEP   = '#0E2A24';  // near-black green, page ground and dark foliage
  var DEEP2  = '#12362C';  // foliage shadow tone, same family
  var MIDGRN = '#1E4D3E';  // foliage mid tone, same family
  var RUST   = '#C8431F';  // rust red figure
  var LAV    = '#B9A8E0';  // lavender sky wedge and polka-dot skirt
  var SAGE   = '#9DC49A';  // sage leaves and scallop band
  var CREAM  = '#F4EBD3';  // cream figure, moon, frame

  // Seeded RNG (mulberry32). All scene jitter (leaves, stars, skirt
  // dots, hat heights) is precomputed once from the seed alone, so any
  // loop time renders the same scene on any load.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Timing. The loop is 24 seconds; every motion period divides
  // it exactly: the pair breathes on a 6s cycle, the hat figures sway
  // on an 8s cycle, the moon glow runs on a 12s cycle.
  var LOOP = 24;
  var BREATH = 6;
  var SWAY = 8;
  var GLOW = 12;
  var FIXED_T = 8;   // constant first-frame loop phase

  // ---- Precomputed seeded scene data (normalized, layout-free).
  var leaves = [];   // foliage behind the pair
  var stars = [];    // small cream points inside the sky wedge
  var skirtDots = [];// polka dots on the lavender skirt
  var hatJit = [];   // per hat-figure height and robe variation

  function buildScene() {
    var rng = mulberry32(484 * 1000 + 17);
    var i;
    // Leaves ring the pair: angles fan upward and outward from behind
    // the couple, sizes and tones alternate sage / mid / deep green.
    leaves = [];
    // Leaf centers are explicit, in pair units: dx from the pair
    // center, dy up from the pair base. The fan forms a canopy over
    // and behind the couple's heads, with two leaves at the sides.
    var leafSpec = [
      { dx: -0.42, dy: 0.99, a: -0.90, s: 0.62 }, { dx: -0.17, dy: 1.13, a: -0.35, s: 0.72 },
      { dx:  0.11, dy: 1.11, a:  0.25, s: 0.68 }, { dx:  0.37, dy: 0.96, a:  0.85, s: 0.58 },
      { dx: -0.53, dy: 0.72, a: -1.35, s: 0.55 }, { dx:  0.40, dy: 0.84, a:  1.20, s: 0.50 },
      { dx: -0.31, dy: 1.24, a: -0.60, s: 0.50 }, { dx:  0.29, dy: 1.25, a:  0.55, s: 0.48 }
    ];
    var tones = [SAGE, MIDGRN, SAGE, DEEP2, MIDGRN, SAGE, DEEP2, SAGE];
    for (i = 0; i < leafSpec.length; i++) {
      leaves.push({
        dx: leafSpec[i].dx + (rng() * 2 - 1) * 0.02,
        dy: leafSpec[i].dy + (rng() * 2 - 1) * 0.02,
        ang: leafSpec[i].a + (rng() * 2 - 1) * 0.10,
        size: leafSpec[i].s * (0.9 + rng() * 0.2),
        tone: tones[i % tones.length],
        holes: 1 + Math.floor(rng() * 2),
        holeOff: rng() * 2 - 1
      });
    }
    // Stars: sparse cream points in the lavender wedge.
    stars = [];
    for (i = 0; i < 9; i++) {
      stars.push({ x: 0.66 + rng() * 0.30, y: 0.03 + rng() * 0.30, r: 0.6 + rng() * 0.9 });
    }
    // Skirt polka dots: offset rows in skirt-local coordinates.
    skirtDots = [];
    var rows = [0.18, 0.42, 0.66, 0.88];
    for (i = 0; i < rows.length; i++) {
      var cols = i % 2 ? [-0.22, 0.02, 0.26] : [-0.34, -0.10, 0.14, 0.36];
      for (var j = 0; j < cols.length; j++) {
        skirtDots.push({
          x: cols[j] + (rng() * 2 - 1) * 0.015,
          y: rows[i] + (rng() * 2 - 1) * 0.02,
          r: 0.045 + rng() * 0.012
        });
      }
    }
    // Hat figures: three standing figures, seeded height variation.
    hatJit = [];
    for (i = 0; i < 3; i++) {
      hatJit.push({ h: 0.94 + rng() * 0.12, w: 0.92 + rng() * 0.16 });
    }
  }

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }

  function circle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // One monstera-ish leaf in local coordinates: a pointed oval blade
  // along -y, a center vein, and one or two deep-green holes punched
  // into the blade. len is the full blade length.
  function leaf(len, tone, holes, holeOff) {
    var wid = len * 0.52;
    ctx.fillStyle = tone;
    ctx.beginPath();
    ctx.moveTo(0, -len * 0.52);
    ctx.bezierCurveTo(wid * 0.62, -len * 0.30, wid * 0.55, len * 0.18, 0, len * 0.52);
    ctx.bezierCurveTo(-wid * 0.55, len * 0.18, -wid * 0.62, -len * 0.30, 0, -len * 0.52);
    ctx.fill();
    ctx.strokeStyle = DEEP;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = Math.max(1.2, len * 0.016);
    ctx.beginPath();
    ctx.moveTo(0, -len * 0.44);
    ctx.lineTo(0, len * 0.44);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = DEEP;
    for (var i = 0; i < holes; i++) {
      var hx = (i === 0 ? -1 : 1) * wid * 0.20 + holeOff * wid * 0.08;
      var hy = -len * 0.08 + i * len * 0.22;
      ctx.beginPath();
      ctx.ellipse(hx, hy, wid * 0.085, len * 0.055, 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // A simple robe mass: a bell-shaped body with a domed shoulder
  // line, from the shoulders (y = -h) down to the base (y = 0),
  // centered on x = 0.
  function robe(h, wHalf, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-wHalf * 0.58, -h);
    ctx.quadraticCurveTo(0, -h * 1.07, wHalf * 0.58, -h);
    ctx.bezierCurveTo(wHalf * 0.80, -h * 0.62, wHalf * 0.97, -h * 0.25, wHalf * 1.0, 0);
    ctx.lineTo(-wHalf * 1.0, 0);
    ctx.bezierCurveTo(-wHalf * 0.97, -h * 0.25, -wHalf * 0.80, -h * 0.62, -wHalf * 0.58, -h);
    ctx.closePath();
    ctx.fill();
  }

  // A nearly blank face on a head circle already filled: one heavy
  // brow line and, at most, a minimal nose mark. Ink is the deep green.
  function face(hr, browTilt) {
    ctx.strokeStyle = DEEP;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1.6, hr * 0.16);
    ctx.beginPath();
    ctx.moveTo(-hr * 0.52, -hr * 0.18 + browTilt);
    ctx.quadraticCurveTo(0, -hr * 0.34, hr * 0.52, -hr * 0.18 - browTilt);
    ctx.stroke();
    ctx.lineWidth = Math.max(1.2, hr * 0.10);
    ctx.beginPath();
    ctx.moveTo(hr * 0.04, hr * 0.02);
    ctx.lineTo(-hr * 0.05, hr * 0.30);
    ctx.stroke();
  }

  // Hair cap: a filled arc over the top of the head.
  function hairCap(hr, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, -hr * 0.10, hr * 1.0, Math.PI * 1.02, Math.PI * 1.98);
    ctx.quadraticCurveTo(0, -hr * 0.52, -hr * 0.98, -hr * 0.10);
    ctx.closePath();
    ctx.fill();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var U = Math.min(W, H);
    var bandH = Math.max(26, U * 0.06);
    var groundY = H - bandH;                 // top of the scallop band
    // Pair height. On phones the pair scales to the width instead,
    // so the hat row still has room along the right edge.
    var P = PHONE ? Math.min(H * 0.55, W * 0.82)
                  : Math.min(H * 0.64, W * 0.92);
    var baseY = groundY;                     // pair stands on the band line
    // Pair center sits in the left 45 percent; on narrow screens it
    // shifts right just enough that the rust robe never clips.
    var pairCX = Math.max(W * 0.235, P * 0.375);
    var pairBaseX = pairCX, pairBaseY = baseY;

    // Ground.
    ctx.fillStyle = DEEP;
    ctx.fillRect(0, 0, W, H);

    // Lavender sky wedge, top-right: a flat diagonal field holding
    // the moon and a few seeded cream stars.
    ctx.fillStyle = LAV;
    ctx.beginPath();
    ctx.moveTo(W * 0.575, 0);
    ctx.lineTo(W, 0);
    ctx.lineTo(W, H * 0.44);
    ctx.lineTo(W * 0.755, H * 0.205);
    ctx.lineTo(W * 0.615, H * 0.075);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = CREAM;
    for (var si = 0; si < stars.length; si++) {
      var sx = stars[si].x * W, sy = stars[si].y * H;
      // keep stars inside the wedge: skip any that fall below its
      // diagonal edge for their x
      var edgeY = H * (0.075 + (stars[si].x - 0.615) * 0.62);
      if (stars[si].x > 0.755) edgeY = H * (0.205 + (stars[si].x - 0.755) * 0.96);
      if (sy < edgeY - 6) circle(sx, sy, stars[si].r * U * 0.004 + 1);
    }

    // Crescent moon in the wedge, top-right. The glow alpha breathes
    // on the 12s cycle and the cutout drifts slightly with it, so the
    // crescent faintly waxes and wanes.
    var glowP = 0.5 + 0.5 * Math.sin((t / GLOW) * Math.PI * 2 - Math.PI / 2);
    var moonX = W * 0.885, moonY = H * 0.125, moonR = U * 0.056;
    ctx.save();
    ctx.globalAlpha = 0.10 + 0.16 * glowP;
    ctx.fillStyle = CREAM;
    circle(moonX, moonY, moonR * (1.55 + 0.25 * glowP));
    ctx.restore();
    ctx.fillStyle = CREAM;
    circle(moonX, moonY, moonR);
    ctx.fillStyle = LAV;
    circle(moonX + moonR * (0.34 + 0.14 * glowP), moonY - moonR * 0.18, moonR * 0.86);

    // Foliage behind the pair: large leaves forming a canopy over
    // and behind the couple, in sage and darker greens.
    for (var li = 0; li < leaves.length; li++) {
      var lf = leaves[li];
      ctx.save();
      ctx.translate(pairCX + lf.dx * P, baseY - lf.dy * P);
      ctx.rotate(lf.ang);
      leaf(P * 0.62 * lf.size, lf.tone, lf.holes, lf.holeOff);
      ctx.restore();
    }

    // Scallop band along the bottom edge: a sage strip whose top edge
    // is a row of scallop bumps, each holding a small cream dot. Drawn
    // before the figures so they stand in front of it.
    var scR = Math.max(15, U * 0.032);
    var scN = Math.max(6, Math.ceil(W / (scR * 2)));
    var scStep = W / scN;
    scR = scStep / 2;
    ctx.fillStyle = SAGE;
    ctx.fillRect(0, groundY, W, bandH + 2);
    for (var ci = 0; ci < scN; ci++) {
      circle(ci * scStep + scStep / 2, groundY, scR);
    }
    ctx.fillStyle = CREAM;
    for (var cj = 0; cj < scN; cj++) {
      circle(cj * scStep + scStep / 2, groundY + bandH * 0.42, Math.max(1.6, scR * 0.16));
    }

    // ---- The embracing pair. The whole group breathes: a subtle
    // scale oscillation on the 6s cycle about the pair's base.
    var breath = 1 + 0.016 * Math.sin((t / BREATH) * Math.PI * 2);
    ctx.save();
    ctx.translate(pairBaseX, pairBaseY);
    ctx.scale(breath, breath);
    ctx.translate(-pairBaseX, -pairBaseY);

    var hr = P * 0.088;   // head radius
    // Rust figure (left, slightly behind).
    var rustX = pairCX - P * 0.145;
    ctx.save();
    ctx.translate(rustX, baseY);
    robe(P * 0.83, P * 0.205, RUST);
    ctx.restore();
    // Rust head, leaning right toward the partner, sage hair cap.
    ctx.save();
    ctx.translate(rustX + P * 0.055, baseY - P * 0.885);
    ctx.fillStyle = CREAM;
    circle(0, 0, hr);
    hairCap(hr, SAGE);
    face(hr, hr * 0.05);
    ctx.restore();

    // Cream figure (right, in front), cream robe over a lavender
    // polka-dot skirt.
    var creamX = pairCX + P * 0.135;
    ctx.save();
    ctx.translate(creamX, baseY);
    robe(P * 0.815, P * 0.20, CREAM);
    ctx.restore();
    // Skirt: a lavender bell from the waist to the base, clipped
    // polka dots in cream.
    ctx.save();
    ctx.beginPath();
    var skTop = baseY - P * 0.40, skHalfTop = P * 0.105, skHalfBot = P * 0.235;
    ctx.moveTo(creamX - skHalfTop, skTop);
    ctx.bezierCurveTo(creamX - skHalfBot * 0.9, baseY - P * 0.18, creamX - skHalfBot, baseY - P * 0.02, creamX - skHalfBot, baseY);
    ctx.lineTo(creamX + skHalfBot, baseY);
    ctx.bezierCurveTo(creamX + skHalfBot, baseY - P * 0.02, creamX + skHalfBot * 0.9, baseY - P * 0.18, creamX + skHalfTop, skTop);
    ctx.quadraticCurveTo(creamX, skTop + P * 0.035, creamX - skHalfTop, skTop);
    ctx.closePath();
    ctx.fillStyle = LAV;
    ctx.fill();
    ctx.clip();
    ctx.fillStyle = CREAM;
    for (var di = 0; di < skirtDots.length; di++) {
      var d = skirtDots[di];
      var dx = creamX + d.x * P * (0.45 + d.y * 0.85);
      var dy = skTop + d.y * (baseY - skTop);
      circle(dx, dy, d.r * P);
    }
    ctx.restore();
    // Cream head, leaning left toward the partner; rust hair cap
    // with a matching bun that merges into the cap's silhouette.
    ctx.save();
    ctx.translate(creamX - P * 0.045, baseY - P * 0.865);
    ctx.fillStyle = CREAM;
    circle(0, 0, hr);
    hairCap(hr, RUST);
    ctx.fillStyle = RUST;
    circle(hr * 0.70, -hr * 0.72, hr * 0.36);
    face(hr, -hr * 0.05);
    ctx.restore();

    // Interlocking arms: the rust arm wraps across the cream figure,
    // the cream arm wraps back across the rust figure. Thick flat
    // arcs with round caps, crossing at the pair's center.
    ctx.lineCap = 'round';
    ctx.strokeStyle = RUST;
    ctx.lineWidth = P * 0.068;
    ctx.beginPath();
    ctx.moveTo(pairCX - P * 0.10, baseY - P * 0.665);
    ctx.quadraticCurveTo(pairCX + P * 0.16, baseY - P * 0.60, pairCX + P * 0.295, baseY - P * 0.44);
    ctx.stroke();
    ctx.strokeStyle = CREAM;
    ctx.lineWidth = P * 0.062;
    ctx.beginPath();
    ctx.moveTo(pairCX + P * 0.10, baseY - P * 0.635);
    ctx.quadraticCurveTo(pairCX - P * 0.14, baseY - P * 0.575, pairCX - P * 0.315, baseY - P * 0.47);
    ctx.stroke();
    ctx.restore();

    // ---- Framed face icon, floating upper-left of the pair: a small
    // cream-framed square with a lavender field and a minimal face.
    var icS = U * 0.105;
    var icX = W * 0.048, icY = H * 0.065;
    ctx.save();
    ctx.translate(icX + icS / 2, icY + icS / 2);
    ctx.rotate(-0.05);
    ctx.fillStyle = CREAM;
    ctx.fillRect(-icS / 2, -icS / 2, icS, icS);
    ctx.fillStyle = LAV;
    ctx.fillRect(-icS * 0.38, -icS * 0.38, icS * 0.76, icS * 0.76);
    ctx.fillStyle = CREAM;
    circle(0, icS * 0.02, icS * 0.21);
    ctx.save();
    ctx.translate(0, icS * 0.02);
    face(icS * 0.21, 0);
    ctx.restore();
    ctx.restore();

    // ---- Hat figures: a row of three standing figures along the
    // right edge, smaller than the pair. Each sways about its base on
    // the 8s cycle, phase-stepped so the sway travels down the row
    // like a slow wave.
    var robeCols = [SAGE, CREAM, RUST];
    var hatCols = [RUST, DEEP2, LAV];
    var hatX = PHONE ? [0.685, 0.815, 0.915] : [0.675, 0.79, 0.905];
    for (var hi = 0; hi < 3; hi++) {
      var hx = W * hatX[hi];
      var hH = P * 0.54 * hatJit[hi].h;
      var sway = 0.05 * Math.sin((t / SWAY) * Math.PI * 2 - hi * (Math.PI * 2 / 3));
      ctx.save();
      ctx.translate(hx, baseY);
      ctx.rotate(sway);
      robe(hH, P * 0.090 * hatJit[hi].w, robeCols[hi]);
      // Head and wide-brim hat.
      ctx.fillStyle = CREAM;
      circle(0, -hH - P * 0.028, P * 0.046);
      ctx.save();
      ctx.translate(0, -hH - P * 0.028);
      face(P * 0.046, 0);
      ctx.restore();
      ctx.fillStyle = hatCols[hi];
      ctx.beginPath();
      ctx.ellipse(0, -hH - P * 0.062, P * 0.098, P * 0.020, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, -hH - P * 0.058, P * 0.046, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // One synchronous, constant first frame: loop phase 8s, the pair at
  // mid-breath on its 6s cycle, the hat figures spread across their
  // sway wave, the moon glow developed. Never derived from the clock.
  resize();
  buildScene();
  draw(FIXED_T);

  // ---- Motion: watch-only. No interaction of any kind, no hint.
  // rAF is typeof-guarded and anchored as the fixed offset plus
  // elapsed time, wrapped by the 24s loop.
  var startStamp = (typeof performance !== "undefined" && performance.now)
    ? performance.now() : 0;
  function step() {
    var elapsed = ((typeof performance !== "undefined" && performance.now)
      ? performance.now() - startStamp : 0) / 1000;
    draw((FIXED_T + elapsed) % LOOP);
  }
  if (typeof requestAnimationFrame === 'function') {
    var loopFn = function () { step(); requestAnimationFrame(loopFn); };
    requestAnimationFrame(loopFn);
  }

  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  if (typeof window !== "undefined" && window.visualViewport &&
      window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
})();
</script>
</body>
</html>
