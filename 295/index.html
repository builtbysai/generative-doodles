<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.295 Wave Ground</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EDE6D6; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.295 Wave Ground (Ruby Waters).
// An onna-musha in flat folk-tattoo colour blocks rides a
// still white folk horse left to right while the banded
// cobalt wave ground scrolls beneath her, near rows faster
// than far, parallax-style. The horse never moves; the world
// moves. DATA-ONLY adaptation: wave rows are a repeated arc
// motif function tiled each frame with per-row offsets,
// seamless wrap by motif period, no offscreen strip canvases;
// paper grain is a fixed seeded set of low-alpha grain marks
// drawn each frame, not a pre-rendered overlay. The rider's
// robe hem flutters on two sine offsets. Watch-only, 20
// second seamless loop. No text, no gradient sky.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#EDE6D6', COBALT = '#2B5EA7', PALE = '#9DC3E8',
    ROBE = '#C23A2E', WHITE = '#F5F0E6', MINT = '#8FD6BE',
    INK = '#1A1A1A', MUSTARD = '#E0A437';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 20;
var T = 6.4, lastNow = -1, acc = 0; // frame one: rows already offset, scroll reads at once
var TICK = 1 / 60;

function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function stepSim() { T += TICK; }

// ---- paper grain (data only) ----------------------------------------------
// A fixed seeded set of low-alpha grain marks, redrawn each
// frame over the whole field. Not a pre-rendered overlay.
var grain = [];
(function () {
  var r = rng(295117);
  for (var i = 0; i < 1100; i++) {
    grain.push({
      x: -80 + r() * (DW + 160), y: r() * DH,
      len: 1.5 + r() * 5, ang: r() * Math.PI,
      a: 0.03 + r() * 0.05, w: 0.8 + r() * 1.1,
      blue: r() < 0.22
    });
  }
})();
function drawGrain() {
  ctx.lineCap = 'round';
  for (var i = 0; i < grain.length; i++) {
    var g = grain[i];
    ctx.strokeStyle = g.blue ? COBALT : INK;
    ctx.globalAlpha = g.a;
    ctx.lineWidth = g.w;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y);
    ctx.lineTo(g.x + Math.cos(g.ang) * g.len, g.y + Math.sin(g.ang) * g.len);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ---- wave ground (data only) ----------------------------------------------
// One motif: concentric semicircular arcs, a seigaiha scale.
// Rows tile the motif with per-row speed; every speed is an
// integer number of motif periods per 20s loop, so the wrap
// is seamless. Far rows are smaller and slower, near rows
// larger and faster.
var ROWS = [
  { y: 636, R: 40, k: 2 },
  { y: 684, R: 46, k: 3 },
  { y: 738, R: 53, k: 4 },
  { y: 800, R: 60, k: 5 },
  { y: 872, R: 68, k: 7 }
];
function waveMotif(cx, cy, R) {
  var bands = [
    { f: 1.00, col: COBALT },
    { f: 0.72, col: PALE },
    { f: 0.45, col: COBALT },
    { f: 0.20, col: PALE }
  ];
  for (var i = 0; i < bands.length; i++) {
    var r = R * bands[i].f;
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI, 0);
    ctx.closePath();
    ctx.fillStyle = bands[i].col;
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(cx, cy, R, Math.PI, 0);
  ctx.strokeStyle = COBALT;
  ctx.lineWidth = 2.5;
  ctx.stroke();
}
function drawWaves(phase) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(-720, 596, DW + 1440, DH - 596 + 40);
  ctx.clip();
  ctx.fillStyle = PALE;
  ctx.fillRect(-720, 596, DW + 1440, DH - 596 + 40);
  for (var ri = 0; ri < ROWS.length; ri++) {
    var row = ROWS[ri];
    var period = row.R * 2;
    var speed = period * row.k / LOOP;
    var off = (phase * speed) % period;
    var stagger = (ri % 2) ? period / 2 : 0;
    var startX = -720 - period + stagger - off;
    for (var x = startX; x < DW + 720 + period; x += period) {
      waveMotif(x, row.y, row.R);
    }
  }
  ctx.restore();
  ctx.fillStyle = COBALT;
  ctx.fillRect(-720, 592, DW + 1440, 5);
}

// ---- horse ------------------------------------------------------------------
// Layered flat paths, static pose, facing right. White-grey
// body in crane white, vermilion bridle, mint saddle panel
// with mustard trim.
function drawHorse() {
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  // tail: flowing black folk strands at the rear
  ctx.strokeStyle = INK;
  ctx.lineWidth = 13;
  var tailCurves = [
    [352, 372, 268, 400, 252, 500],
    [356, 396, 282, 448, 282, 548],
    [360, 420, 306, 470, 322, 556]
  ];
  for (var ti = 0; ti < tailCurves.length; ti++) {
    var tc = tailCurves[ti];
    ctx.beginPath();
    ctx.moveTo(tc[0], tc[1]);
    ctx.quadraticCurveTo(tc[2], tc[3], tc[4], tc[5]);
    ctx.stroke();
  }
  // far legs
  ctx.fillStyle = WHITE;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 5;
  function leg(x, top, lean) {
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x + 34, top);
    ctx.lineTo(x + 34 + lean, 606);
    ctx.lineTo(x + lean, 606);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + lean - 3, 606);
    ctx.lineTo(x + 34 + lean + 3, 606);
    ctx.lineTo(x + 34 + lean + 3, 622);
    ctx.lineTo(x + lean - 3, 622);
    ctx.closePath();
    ctx.fillStyle = INK;
    ctx.fill();
    ctx.fillStyle = WHITE;
  }
  leg(428, 470, -8);
  leg(764, 470, 8);
  // body
  ctx.beginPath();
  ctx.moveTo(356, 396);
  ctx.quadraticCurveTo(360, 338, 452, 330);
  ctx.lineTo(742, 330);
  ctx.quadraticCurveTo(838, 332, 856, 388);
  ctx.quadraticCurveTo(868, 452, 812, 492);
  ctx.quadraticCurveTo(760, 520, 620, 522);
  ctx.lineTo(470, 522);
  ctx.quadraticCurveTo(368, 518, 356, 458);
  ctx.closePath();
  ctx.fillStyle = WHITE;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 6;
  ctx.stroke();
  // near legs
  leg(472, 486, -4);
  leg(724, 486, 5);
  // neck and head, reaching right
  ctx.beginPath();
  ctx.moveTo(782, 352);
  ctx.quadraticCurveTo(848, 300, 896, 262);
  ctx.lineTo(972, 268);
  ctx.quadraticCurveTo(1032, 276, 1044, 312);
  ctx.quadraticCurveTo(1050, 338, 1020, 352);
  ctx.lineTo(952, 366);
  ctx.quadraticCurveTo(906, 402, 880, 452);
  ctx.lineTo(806, 452);
  ctx.quadraticCurveTo(796, 392, 782, 352);
  ctx.closePath();
  ctx.fillStyle = WHITE;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 6;
  ctx.stroke();
  // mane: black tuft band along the neck crest
  ctx.beginPath();
  ctx.moveTo(792, 348);
  ctx.quadraticCurveTo(850, 294, 894, 258);
  ctx.lineTo(908, 272);
  ctx.quadraticCurveTo(866, 310, 828, 358);
  ctx.closePath();
  ctx.fillStyle = INK;
  ctx.fill();
  // ear
  ctx.beginPath();
  ctx.moveTo(898, 264);
  ctx.lineTo(890, 224);
  ctx.lineTo(922, 252);
  ctx.closePath();
  ctx.fillStyle = WHITE;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4.5;
  ctx.stroke();
  // eye and nostril
  ctx.beginPath();
  ctx.arc(972, 306, 7, 0, Math.PI * 2);
  ctx.fillStyle = INK;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(1018, 336, 5, 0, Math.PI * 2);
  ctx.fill();
  // bridle: vermilion straps with mustard studs
  ctx.strokeStyle = ROBE;
  ctx.lineWidth = 11;
  ctx.beginPath();
  ctx.moveTo(934, 272);
  ctx.lineTo(962, 366);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(966, 356);
  ctx.quadraticCurveTo(1006, 348, 1040, 330);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(930, 316);
  ctx.quadraticCurveTo(986, 306, 1042, 310);
  ctx.stroke();
  ctx.fillStyle = MUSTARD;
  var studs = [[946, 292], [954, 322], [958, 348], [994, 312]];
  for (var si = 0; si < studs.length; si++) {
    ctx.beginPath();
    ctx.arc(studs[si][0], studs[si][1], 5.5, 0, Math.PI * 2);
    ctx.fill();
  }
  // saddle: mint panel, mustard trim, vermilion blanket edge
  ctx.beginPath();
  ctx.moveTo(548, 336);
  ctx.lineTo(726, 336);
  ctx.lineTo(714, 442);
  ctx.quadraticCurveTo(637, 458, 560, 442);
  ctx.closePath();
  ctx.fillStyle = ROBE;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 5;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(566, 352);
  ctx.lineTo(708, 352);
  ctx.lineTo(700, 428);
  ctx.quadraticCurveTo(637, 442, 574, 428);
  ctx.closePath();
  ctx.fillStyle = MINT;
  ctx.fill();
  ctx.strokeStyle = MUSTARD;
  ctx.lineWidth = 5;
  ctx.stroke();
  // saddle cranes in white
  drawCrane(606, 396, 0.9);
  drawCrane(668, 388, -0.7);
}

// ---- crane motif --------------------------------------------------------------
// A small flat white crane: body, neck, wing slash. Used on
// the saddle and repeated on the rider's robe.
function drawCrane(x, y, flip) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip < 0 ? -1 : 1, 1);
  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.ellipse(0, 0, 17, 8, -0.25, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = WHITE;
  ctx.lineWidth = 4.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(12, -4);
  ctx.quadraticCurveTo(22, -14, 20, -24);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(20, -24);
  ctx.lineTo(28, -22);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-14, 2);
  ctx.lineTo(-27, 9);
  ctx.moveTo(-14, -2);
  ctx.lineTo(-28, -4);
  ctx.lineWidth = 3.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-2, -6);
  ctx.lineTo(6, -16);
  ctx.lineTo(10, -5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ---- rider ----------------------------------------------------------------------
// Vermilion robe with white cranes and mint panels, black
// hair and sash. Two robe hem panels flutter on sine offsets
// whose frequencies are whole cycles per loop, so the loop
// seam stays exact.
function drawRider(phase) {
  var f1 = Math.sin(phase / LOOP * Math.PI * 2 * 6) * 6;
  var f2 = Math.sin(phase / LOOP * Math.PI * 2 * 9 + 1.3) * 5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  // rear hem panel (mint lining), flutters on f2
  ctx.beginPath();
  ctx.moveTo(560, 330);
  ctx.lineTo(618, 330);
  ctx.lineTo(606 + f2, 452);
  ctx.lineTo(552 + f2 * 0.5, 446);
  ctx.closePath();
  ctx.fillStyle = MINT;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 5;
  ctx.stroke();
  // front hem panel (vermilion over mint edge), flutters on f1
  ctx.beginPath();
  ctx.moveTo(636, 330);
  ctx.lineTo(706, 330);
  ctx.lineTo(716 + f1, 462);
  ctx.lineTo(652 + f1 * 0.5, 452);
  ctx.closePath();
  ctx.fillStyle = ROBE;
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(652 + f1 * 0.5, 452);
  ctx.lineTo(716 + f1, 462);
  ctx.lineTo(714 + f1, 442);
  ctx.lineTo(654 + f1 * 0.5, 434);
  ctx.closePath();
  ctx.fillStyle = MINT;
  ctx.fill();
  // torso robe
  ctx.beginPath();
  ctx.moveTo(576, 214);
  ctx.quadraticCurveTo(574, 150, 626, 138);
  ctx.quadraticCurveTo(688, 140, 700, 196);
  ctx.lineTo(712, 336);
  ctx.lineTo(556, 336);
  ctx.quadraticCurveTo(566, 268, 576, 214);
  ctx.closePath();
  ctx.fillStyle = ROBE;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 6;
  ctx.stroke();
  // mint chest panel, diagonal folk cut
  ctx.beginPath();
  ctx.moveTo(592, 158);
  ctx.lineTo(664, 226);
  ctx.lineTo(628, 262);
  ctx.lineTo(570, 196);
  ctx.quadraticCurveTo(578, 168, 592, 158);
  ctx.closePath();
  ctx.fillStyle = MINT;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4;
  ctx.stroke();
  // mustard sash
  ctx.beginPath();
  ctx.moveTo(560, 300);
  ctx.lineTo(710, 300);
  ctx.lineTo(712, 324);
  ctx.lineTo(558, 324);
  ctx.closePath();
  ctx.fillStyle = MUSTARD;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4;
  ctx.stroke();
  // robe cranes
  drawCrane(596, 356, 0.8);
  drawCrane(676, 268, -0.75);
  drawCrane(612, 238, 0.65);
  // arm reaching forward to the reins
  ctx.strokeStyle = ROBE;
  ctx.lineWidth = 26;
  ctx.beginPath();
  ctx.moveTo(688, 196);
  ctx.quadraticCurveTo(748, 226, 792, 268);
  ctx.stroke();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(688, 183);
  ctx.quadraticCurveTo(750, 212, 796, 256);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(688, 209);
  ctx.quadraticCurveTo(746, 240, 788, 280);
  ctx.stroke();
  // hand
  ctx.beginPath();
  ctx.arc(796, 272, 11, 0, Math.PI * 2);
  ctx.fillStyle = PAPER;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4;
  ctx.stroke();
  // reins: two black lines from hand to bridle
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(800, 266);
  ctx.quadraticCurveTo(880, 292, 956, 330);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(800, 280);
  ctx.quadraticCurveTo(884, 316, 962, 352);
  ctx.stroke();
  // head: paper face, black bob with topknot, vermilion lips
  ctx.beginPath();
  ctx.arc(634, 96, 40, 0, Math.PI * 2);
  ctx.fillStyle = PAPER;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(634, 88, 41, Math.PI * 1.02, Math.PI * 1.98);
  ctx.quadraticCurveTo(634, 52, 596, 84);
  ctx.closePath();
  ctx.fillStyle = INK;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(634, 44, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(634, 56);
  ctx.lineTo(634, 76);
  ctx.stroke();
  ctx.strokeStyle = MUSTARD;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(622, 62);
  ctx.lineTo(646, 62);
  ctx.stroke();
  // closed eye, blush, lips
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(646, 98);
  ctx.quadraticCurveTo(656, 103, 665, 98);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(618, 112, 7, 0, Math.PI * 2);
  ctx.fillStyle = ROBE;
  ctx.globalAlpha = 0.55;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.ellipse(654, 122, 7, 4, 0, 0, Math.PI * 2);
  ctx.fillStyle = ROBE;
  ctx.fill();
}

// ---- draw -----------------------------------------------------------------------
function draw() {
  var phase = T % LOOP;
  ctx.fillStyle = PAPER;
  ctx.fillRect(-720, -320, DW + 1440, DH + 640);
  drawWaves(phase);
  drawHorse();
  drawRider(phase);
  drawGrain();
}

// ---- resize -----------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame ---------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the rider keeps her proportions centred,
  // while the ground and wave field are drawn wide in design
  // coords so the sides bleed full on wide screens
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
