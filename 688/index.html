<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trescientos Sesenta</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0E0C0A; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): figure dark, ring warm, interference bloom,
  // ground, accent ember. Nothing else.
  var FIGURE = '#2A211D';
  var RING = '#E8B96A';
  var BLOOM = '#F5D9A8';
  var GROUND = '#0E0C0A';
  var EMBER = '#B0532A';

  var BASE_SEED = 688001;
  var N_FIG = 24;           // figures around the ring
  var WAVE_S = 24;          // idle activation wave: one full revolution, seconds
  var TRAVEL_IDLE = 5.0;    // ring journey from figure radius to center, seconds
  var TRAVEL_CUE = 3.4;     // tapped figure: brighter, faster ring
  var TRAVEL_CONDUCT = 4.2; // conducted figure ring
  var FORCE_T = -1;         // QA hook: -1 = live clock, else fixed elapsed seconds

  // QA seed hook: ?seed=tNN pins the elapsed time (used by the headless
  // renderer to inspect later phases).
  try {
    if (typeof location !== 'undefined' && location.search) {
      var qm = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(location.search);
      if (qm) FORCE_T = parseFloat(qm[1]);
    }
  } catch (e) { /* live mode */ }

  // Seeded RNG (mulberry32). Glyph variation and emission strength
  // jitter come from this one stream, consumed once at init.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, u) { return a + (b - a) * u; }

  // Hex to [r,g,b] once, so ring color can shade toward the bloom tone
  // as a ring nears the center without leaving the palette.
  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  var RING_RGB = hexRgb(RING), BLOOM_RGB = hexRgb(BLOOM);
  function ringColor(u, alpha) {
    // u: 0 at the figure radius, 1 at the center.
    var m = clamp((u - 0.55) / 0.45, 0, 1);
    var r = Math.round(lerp(RING_RGB[0], BLOOM_RGB[0], m));
    var g = Math.round(lerp(RING_RGB[1], BLOOM_RGB[1], m));
    var b = Math.round(lerp(RING_RGB[2], BLOOM_RGB[2], m));
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha.toFixed(4) + ')';
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ------------------------------------------------------------------
  // Figures. 24 glyphs on a circle, seeded variation only: glyph kind
  // (notch, bar, dot cluster, ring-dot), a small rotation jitter, a
  // small size jitter, and a fixed emission-strength jitter that
  // repeats identically every revolution. No figure is special.
  // ------------------------------------------------------------------
  var figures = [];
  (function buildFigures() {
    var rng = mulberry32(BASE_SEED);
    for (var i = 0; i < N_FIG; i++) {
      figures.push({
        idx: i,
        ang: -Math.PI / 2 + (i / N_FIG) * Math.PI * 2,
        kind: Math.floor(rng() * 4),
        rot: (rng() - 0.5) * 0.5,
        size: 0.85 + rng() * 0.35,
        strength: 0.85 + rng() * 0.3,
        phase: i * (WAVE_S / N_FIG) // idle emission offset within the wave period
      });
    }
  })();

  // Visitor-caused emissions: { fig, t, kind } with kind 0 = tap cue,
  // 1 = conduct. Times are on the same anchored clock as the loop.
  var events = [];
  var lastConduct = [];
  for (var ci = 0; ci < N_FIG; ci++) lastConduct.push(-10);

  // ------------------------------------------------------------------
  // Audio: created lazily inside the first pointer gesture only,
  // typeof-guarded, never autoplayed. A soft low sine with a quiet
  // octave, pitch stepping around the ring (two octaves over 24
  // figures). Silent and throw-free where no AudioContext exists.
  // ------------------------------------------------------------------
  var actx = null, audioTried = false;
  function ensureAudio() {
    if (audioTried) return;
    audioTried = true;
    try {
      var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
      if (typeof AC === 'function') actx = new AC();
    } catch (e) { actx = null; }
    if (actx && actx.state === 'suspended' && actx.resume) {
      try { actx.resume(); } catch (e) { /* stays silent */ }
    }
  }
  function playTone(figIdx, peak) {
    if (!actx) return;
    try {
      var f = 98 * Math.pow(2, (figIdx / N_FIG) * 2); // 98 Hz up to 392 Hz around the circle
      var t = actx.currentTime;
      var g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
      var o1 = actx.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
      var o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
      var g2 = actx.createGain(); g2.gain.value = 0.25;
      o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(actx.destination);
      o1.start(t); o2.start(t); o1.stop(t + 1.9); o2.stop(t + 1.9);
    } catch (e) { /* silent */ }
  }

  // ------------------------------------------------------------------
  // Geometry, recomputed on resize. The field is a circle centered in
  // the viewport with diameter = the smaller viewport dimension;
  // figures sit at 0.8 of the field radius.
  // ------------------------------------------------------------------
  var W = 0, H = 0, S = 0, isPhone = false;
  var CX = 0, CY = 0, FR = 0, FIGR = 0;
  var lastElapsed = 0;

  function layout() {
    CX = W / 2; CY = H / 2;
    FR = S * 0.47;
    FIGR = FR * 0.8;
  }
  function figPos(f) {
    return [CX + Math.cos(f.ang) * FIGR, CY + Math.sin(f.ang) * FIGR];
  }

  // All rings alive at time t: idle-wave rings (pure schedule) plus
  // visitor events. Each entry: { age, travel, strength }.
  function collectRings(t, out) {
    out.length = 0;
    var i, k, te, age;
    for (i = 0; i < N_FIG; i++) {
      var p = figures[i].phase;
      var kMin = Math.ceil((t - TRAVEL_IDLE - p) / WAVE_S);
      var kMax = Math.floor((t - p) / WAVE_S);
      for (k = kMin; k <= kMax; k++) {
        te = p + k * WAVE_S;
        age = t - te;
        if (age >= 0 && age <= TRAVEL_IDLE) {
          out.push({ age: age, travel: TRAVEL_IDLE, strength: figures[i].strength });
        }
      }
    }
    for (i = 0; i < events.length; i++) {
      var ev = events[i];
      var tr = ev.kind === 0 ? TRAVEL_CUE : TRAVEL_CONDUCT;
      age = t - ev.t;
      if (age >= 0 && age <= tr) {
        out.push({ age: age, travel: tr, strength: ev.kind === 0 ? 1.55 : 1.15 });
      }
    }
    return out;
  }

  // Most recent emission time (schedule or event) for a figure, for
  // the brief ember flash when it speaks.
  function lastEmission(f, t) {
    var p = f.phase;
    var te = p + Math.floor((t - p) / WAVE_S) * WAVE_S;
    var best = te <= t ? te : te - WAVE_S;
    for (var i = 0; i < events.length; i++) {
      if (events[i].fig === f.idx && events[i].t <= t && events[i].t > best) best = events[i].t;
    }
    return best;
  }

  function drawGlyph(f, x, y) {
    var g = S * 0.016 * f.size;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(f.ang + Math.PI / 2 + f.rot);
    ctx.fillStyle = FIGURE;
    ctx.strokeStyle = RING;
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = Math.max(1, S * 0.0016);
    if (f.kind === 0) {
      // notch: a near-closed ring with a gap at the top
      ctx.beginPath();
      ctx.arc(0, 0, g, 0.5, Math.PI * 2 - 0.5);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, g * 0.32, 0, Math.PI * 2); ctx.fill();
    } else if (f.kind === 1) {
      // bar: a short thick tangential bar
      ctx.fillRect(-g, -g * 0.3, g * 2, g * 0.6);
      ctx.beginPath(); ctx.arc(0, 0, g * 0.3, 0, Math.PI * 2); ctx.fill();
    } else if (f.kind === 2) {
      // dot cluster: three dots in a small triangle
      ctx.beginPath(); ctx.arc(0, -g * 0.62, g * 0.34, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-g * 0.6, g * 0.48, g * 0.34, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(g * 0.6, g * 0.48, g * 0.34, 0, Math.PI * 2); ctx.fill();
    } else {
      // ring-dot: open circle with a center point
      ctx.beginPath(); ctx.arc(0, 0, g * 0.92, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, g * 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  var ringBuf = [];
  function draw(elapsed) {
    lastElapsed = elapsed;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Field boundary and the emitter circle: faint warm scaffolding.
    ctx.strokeStyle = RING;
    ctx.globalAlpha = 0.09;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(CX, CY, FR, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.14;
    ctx.beginPath(); ctx.arc(CX, CY, FIGR, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;

    // Rings travel inward: a concentric circle whose radius shrinks
    // from the figure radius to the center. Drawn additively so that
    // where rings converge near the middle their light accumulates
    // into the interference bloom. The center itself is never drawn
    // on: rings fade out before they arrive.
    collectRings(elapsed, ringBuf);
    ctx.globalCompositeOperation = 'lighter';
    var i, r0;
    // Soft convergence discs first (under the strokes): while a ring
    // is inside the inner third, it lays down a faint filled disc of
    // its current radius, so successive rings pile warmth at center.
    for (i = 0; i < ringBuf.length; i++) {
      r0 = ringBuf[i];
      var u0 = r0.age / r0.travel;
      if (u0 > 0.62) {
        var rr0 = FIGR * Math.pow(1 - u0, 1.12);
        if (rr0 > 1) {
          ctx.fillStyle = ringColor(u0, 0.05 * r0.strength * (u0 - 0.62) / 0.38);
          ctx.beginPath(); ctx.arc(CX, CY, rr0, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    for (i = 0; i < ringBuf.length; i++) {
      var r = ringBuf[i];
      var u = r.age / r.travel;
      var rad = FIGR * Math.pow(1 - u, 1.12);
      if (rad < 1.5) continue;
      var env = Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), 0.75);
      var a = 0.36 * r.strength * env;
      if (a <= 0.004) continue;
      ctx.strokeStyle = ringColor(u, a);
      ctx.lineWidth = Math.max(1.1, S * 0.0021) * (r.strength > 1.3 ? 1.35 : 1);
      ctx.beginPath(); ctx.arc(CX, CY, rad, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';

    // Figures: dark glyphs, each flashing a small ember point for a
    // moment after it emits. No figure is lit for longer than another.
    for (i = 0; i < N_FIG; i++) {
      var f = figures[i];
      var p = figPos(f);
      drawGlyph(f, p[0], p[1]);
      var since = elapsed - lastEmission(f, elapsed);
      if (since >= 0 && since < 0.9) {
        ctx.globalAlpha = 0.75 * (1 - since / 0.9);
        ctx.fillStyle = EMBER;
        ctx.beginPath(); ctx.arc(p[0], p[1], Math.max(1.4, S * 0.0035), 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  // ------------------------------------------------------------------
  // Interaction. Tap a figure: cue it (bright fast ring + soft tone).
  // Drag in a circle: figures near the drag angle emit in sequence, a
  // round. Pointer events are timestamped on the loop's clock.
  // ------------------------------------------------------------------
  function evtPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return [e.clientX - r.left, e.clientY - r.top];
  }
  var dragging = false;

  function nearestFigure(x, y, maxDist) {
    var best = -1, bd = maxDist;
    for (var i = 0; i < N_FIG; i++) {
      var p = figPos(figures[i]);
      var d = Math.hypot(x - p[0], y - p[1]);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  function emit(figIdx, t, kind, peak) {
    events.push({ fig: figIdx, t: t, kind: kind });
    if (events.length > 240) events.splice(0, events.length - 240);
    playTone(figIdx, peak);
  }
  function conductAt(x, y, t) {
    var dx = x - CX, dy = y - CY;
    if (Math.hypot(dx, dy) < FR * 0.25) return; // too close to the listening point
    var phi = Math.atan2(dy, dx);
    for (var i = 0; i < N_FIG; i++) {
      var d = Math.abs(((phi - figures[i].ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
      if (d < 0.1 && t - lastConduct[i] > 0.3) {
        lastConduct[i] = t;
        emit(i, t, 1, 0.045);
      }
    }
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      ensureAudio();
      var t = FORCE_T >= 0 ? FORCE_T : lastElapsed;
      var p = evtPos(e);
      dragging = true;
      var fi = nearestFigure(p[0], p[1], Math.max(26, S * 0.05));
      if (fi >= 0) {
        emit(fi, t, 0, 0.08);
      } else {
        conductAt(p[0], p[1], t);
      }
      if (canvas.setPointerCapture && e.pointerId !== undefined) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
      }
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var t = FORCE_T >= 0 ? FORCE_T : lastElapsed;
      var p = evtPos(e);
      conductAt(p[0], p[1], t);
    });
    var endDrag = function () { dragging = false; };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', endDrag);
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    S = Math.min(W, H);
    if (window.screen) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = H > W * 1.15;
    }
    layout();
    draw(lastElapsed);
  }

  resize();
  draw(FORCE_T >= 0 ? FORCE_T : 0);

  if (typeof window.requestAnimationFrame === 'function') {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var raf = function () {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : t0;
      draw(FORCE_T >= 0 ? FORCE_T : (now - t0) / 1000);
      window.requestAnimationFrame(raf);
    };
    window.requestAnimationFrame(raf);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener) window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
