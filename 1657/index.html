<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex 2101967766, Study</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#000000';
var PLATE = '#f4fbff';
var INK = '#14141c';
var PHASE = 6;
var RAYS = 220;
var SPREAD = 1.22;
/* Hundreds of glyph-studded rays fan from a glowing core and breathe.
   Frame one is at t = 6 s: the fan is mid-drift, the density gradient
   from glowing core to isolated rim marks is readable. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function rgb(c) {
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var WARM = [255, 240, 214];
var COOL = [148, 158, 172];
var WHITE_RGB = [255, 255, 255];
var INK_RGB = hexRgb(INK);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function corePos() {
  return { x: 0.5 * VW, y: (isPhone ? 0.86 : 0.84) * VH };
}
function fanRadius() {
  if (isPhone) return 0.80 * VH;
  return Math.min(0.78 * VH, 0.47 * VW / Math.sin(SPREAD));
}
/* ---- seeded layout: ray angles, drift, and the glyph density field.
   Glyphs live in normalized radius (fraction of R), so the layout is
   viewport-independent and frame one is reproducible. ---- */
var rays = [];
var glyphs = [];
var bandGlyphs = [];
function buildLayout() {
  var rng = mulberry32(2101967766);
  var i, b;
  rays = [];
  glyphs = [];
  bandGlyphs = [];
  for (b = 0; b < 16; b++) bandGlyphs.push([]);
  var spacing = (2 * SPREAD) / RAYS;
  for (i = 0; i < RAYS; i++) {
    var base = -Math.PI / 2 - SPREAD + spacing * (i + 0.5) + (rng() - 0.5) * spacing * 0.8;
    rays.push({
      base: base,
      amp: 0.014 + rng() * 0.012,
      freq: 0.05 + rng() * 0.07,
      ph: rng() * TAU
    });
    /* 1D density field: step grows with radius squared, so glyphs pack
       near the core and thin to isolated marks at the rim. */
    var r = 0.03;
    while (r < 1.0) {
      var g = {
        ray: i,
        r: r,
        type: Math.floor(rng() * 5),
        ph: rng() * TAU,
        jit: 0.85 + rng() * 0.3
      };
      var gi = glyphs.length;
      glyphs.push(g);
      bandGlyphs[Math.min(15, Math.floor(r * 16))].push(gi);
      r += (0.009 + 0.10 * r * r) * (0.8 + 0.4 * rng());
    }
  }
}
buildLayout();
function rayAngle(i, t) {
  var ry = rays[i];
  return ry.base + ry.amp * Math.sin(ry.freq * t + ry.ph);
}
/* Glyph primitives: loops, kinks, crossings, hooks, dash-dots.
   Local (u, v): u along the ray, v across it. Circles are rotation
   invariant, so arcs are placed at the transformed centre directly. */
function glyphPaths(g, px, py, ca, sa, s) {
  var x, y;
  if (g.type === 0) {
    /* loop */
    ctx.moveTo(px + s * 0.5, py);
    ctx.arc(px, py, s * 0.5, 0, TAU);
  } else if (g.type === 1) {
    /* kink */
    x = px - s * 0.5 * ca + s * 0.4 * sa; y = py - s * 0.5 * sa - s * 0.4 * ca;
    ctx.moveTo(x, y);
    x = px - s * 0.3 * sa; y = py + s * 0.3 * ca;
    ctx.lineTo(x, y);
    x = px + s * 0.5 * ca + s * 0.4 * sa; y = py + s * 0.5 * sa - s * 0.4 * ca;
    ctx.lineTo(x, y);
  } else if (g.type === 2) {
    /* crossing */
    x = px - s * 0.45 * ca + s * 0.45 * sa; y = py - s * 0.45 * sa - s * 0.45 * ca;
    ctx.moveTo(x, y);
    x = px + s * 0.45 * ca - s * 0.45 * sa; y = py + s * 0.45 * sa + s * 0.45 * ca;
    ctx.lineTo(x, y);
    x = px - s * 0.45 * ca - s * 0.45 * sa; y = py - s * 0.45 * sa + s * 0.45 * ca;
    ctx.moveTo(x, y);
    x = px + s * 0.45 * ca + s * 0.45 * sa; y = py + s * 0.45 * sa - s * 0.45 * ca;
    ctx.lineTo(x, y);
  } else if (g.type === 3) {
    /* hook: half loop plus a tail */
    ctx.moveTo(px + s * 0.45, py);
    ctx.arc(px, py, s * 0.45, -1.2, 1.2);
    x = px + s * 0.45 * ca - s * 0.45 * sa; y = py + s * 0.45 * sa + s * 0.45 * ca;
    ctx.moveTo(x, y);
    x = px + s * 0.9 * ca; y = py + s * 0.9 * sa;
    ctx.lineTo(x, y);
  } else {
    /* dash-dot */
    x = px - s * 0.5 * ca; y = py - s * 0.5 * sa;
    ctx.moveTo(x, y);
    x = px + s * 0.3 * ca; y = py + s * 0.3 * sa;
    ctx.lineTo(x, y);
    x = px + s * 0.48 * ca; y = py + s * 0.48 * sa;
    ctx.moveTo(x + s * 0.16, y);
    ctx.arc(x, y, s * 0.16, 0, TAU);
  }
}
function drawDisc(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
}
function drawFan(t) {
  var core = corePos();
  var R = fanRadius();
  var i, g, b, gi, a, ca, sa, px, py, s, rr, col, alpha;
  /* Core glow: warm radial gradient, additive. */
  var glow = ctx.createRadialGradient(core.x, core.y, 0, core.x, core.y, 0.24 * R);
  glow.addColorStop(0, rgba([255, 238, 205], 0.85));
  glow.addColorStop(0.4, rgba([255, 226, 180], 0.35));
  glow.addColorStop(1, rgba([255, 226, 180], 0));
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = glow;
  ctx.fillRect(core.x - 0.24 * R, core.y - 0.24 * R, 0.48 * R, 0.48 * R);
  /* Faint ray hairlines, one batched stroke. */
  ctx.beginPath();
  for (i = 0; i < RAYS; i++) {
    a = rayAngle(i, t);
    ca = Math.cos(a); sa = Math.sin(a);
    ctx.moveTo(core.x + 0.02 * R * ca, core.y + 0.02 * R * sa);
    ctx.lineTo(core.x + R * ca, core.y + R * sa);
  }
  ctx.strokeStyle = rgba(WHITE_RGB, 0.045);
  ctx.lineWidth = 1;
  ctx.stroke();
  /* Glyphs, batched into 16 radial bands by color and alpha. */
  ctx.lineWidth = isPhone ? 1.1 : 1.2;
  for (b = 0; b < 16; b++) {
    var f = (b + 0.5) / 16;
    col = [
      Math.round(lerp(WARM[0], COOL[0], f)),
      Math.round(lerp(WARM[1], COOL[1], f)),
      Math.round(lerp(WARM[2], COOL[2], f))
    ];
    alpha = lerp(0.6, 0.3, f);
    ctx.beginPath();
    var list = bandGlyphs[b];
    for (gi = 0; gi < list.length; gi++) {
      g = glyphs[list[gi]];
      a = rayAngle(g.ray, t);
      ca = Math.cos(a); sa = Math.sin(a);
      rr = g.r * R;
      px = core.x + rr * ca; py = core.y + rr * sa;
      s = R * (0.0045 + 0.004 * g.r) * g.jit * (1 + 0.16 * Math.sin(0.45 * t + g.ph));
      glyphPaths(g, px, py, ca, sa, s);
    }
    ctx.strokeStyle = rgba(col, alpha);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  /* Bounding arcs: the halo that bounds the fan. */
  ctx.beginPath();
  ctx.arc(core.x, core.y, R * 1.01, -Math.PI / 2 - SPREAD - 0.02, -Math.PI / 2 + SPREAD + 0.02);
  ctx.strokeStyle = rgba(WHITE_RGB, 0.55);
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(core.x, core.y, R * 1.055, -Math.PI / 2 - SPREAD - 0.02, -Math.PI / 2 + SPREAD + 0.02);
  ctx.strokeStyle = rgba(WHITE_RGB, 0.15);
  ctx.lineWidth = 1;
  ctx.stroke();
  /* Core disc: warm white heart. */
  ctx.fillStyle = rgba([255, 242, 220], 0.95);
  drawDisc(core.x, core.y, Math.max(3, 0.012 * R));
  ctx.fill();
  ctx.strokeStyle = rgba([255, 242, 220], 0.5);
  ctx.lineWidth = 1.2;
  drawDisc(core.x, core.y, Math.max(6, 0.03 * R));
  ctx.stroke();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Codex 2101967766, Study').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Codex 2101967766, Study').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 26').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Codex 2101967766, Study', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.8);
  ctx.fillText('2006 · 07 · 26', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(INK_RGB, 0.9);
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawFan(t);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    rayCount: function () { return RAYS; },
    glyphCount: function () { return glyphs.length; },
    rayAngles: function (t) {
      var out = [], i;
      for (i = 0; i < RAYS; i++) out.push(rayAngle(i, t));
      return out;
    },
    densityStats: function () {
      var R = fanRadius();
      var core = 0, rim = 0, i, g;
      for (i = 0; i < glyphs.length; i++) {
        g = glyphs[i];
        if (g.r >= 0.05 && g.r < 0.15) core++;
        if (g.r >= 0.85 && g.r < 0.95) rim++;
      }
      var bandLen = 0.10 * R;
      return {
        R: R, coreCount: core, rimCount: rim,
        corePerPx: core / bandLen, rimPerPx: rim / bandLen,
        ratio: (core / bandLen) / (rim / bandLen)
      };
    }
  };
}
/* ---- frame one: fixed phase, fixed seeds, no wall clock ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
