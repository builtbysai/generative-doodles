<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Still Point</title>
<style>
  html, body { margin: 0; padding: 0; background: #08090c; overflow: hidden; height: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .caption {
    position: fixed; bottom: 18px; left: 22px; color: rgba(220,215,200,0.42);
    font: 11px/1.5 -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.14em;
    text-transform: uppercase; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption">The Still Point &middot; after Gadamer</div>
<script>
/*
 * THE STILL POINT
 * Pure abstraction. A field in turmoil — every mishearing, every
 * assumption, all talking at once. At the center, a region of
 * perfect stillness. The question does not argue with the noise.
 * It simply holds still, and the noise organizes around it.
 */
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let seed = 9140;
  function rnd() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const P = [];
  const NP = 1100;
  function buildP() {
    P.length = 0; seed = 9140;
    for (let i = 0; i < NP; i++) {
      const a = rnd() * Math.PI * 2;
      const r = Math.sqrt(rnd());  // uniform disc
      P.push({
        nx: 0.5 + Math.cos(a) * r * 0.52,
        ny: 0.5 + Math.sin(a) * r * 0.52,
        ang: rnd() * Math.PI * 2,
        turn: (rnd() - 0.5) * 0.3,
        sp: 0.0012 + rnd() * 0.0028,
        len: 2 + rnd() * 9,
        w: 0.5 + rnd() * 1.1,
        ph: rnd() * Math.PI * 2
      });
    }
  }
  let grain = null;
  function makeGrain() {
    grain = document.createElement('canvas');
    grain.width = 128; grain.height = 128;
    const g = grain.getContext('2d');
    const d = g.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      d.data[i] = d.data[i+1] = d.data[i+2] = v;
      d.data[i+3] = 11;
    }
    g.putImageData(d, 0, 0);
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildP();
    ctx.fillStyle = '#08090c';
    ctx.fillRect(0, 0, W, H);
  }
  let T = 0;
  function frame() {
    T += 0.016;
    ctx.fillStyle = 'rgba(8,9,12,0.14)';
    ctx.fillRect(0, 0, W, H);
    // still point breathes slowly
    const stillR = 0.10 + Math.sin(T * 0.35) * 0.018;
    const cx = 0.5, cy = 0.5;
    ctx.lineCap = 'round';
    for (const p of P) {
      const dx = p.nx - cx, dy = p.ny - cy;
      const d = Math.hypot(dx, dy);
      // stillness: 1 at center, 0 outside stillR*2.2
      const still = Math.max(0, 1 - d / (stillR * 2.4));
      const turb = 1 - still;
      // motion: chaotic orbit far, near-frozen near center
      p.ang += p.turn * (0.06 + turb * 1.6) + Math.sin(T * 0.7 + p.ph) * 0.02 * turb;
      const step = p.sp * (0.05 + turb * 2.2);
      p.nx += Math.cos(p.ang) * step;
      p.ny += Math.sin(p.ang) * step * 0.9;
      // soft containment: drift back toward disc
      const dd = Math.hypot(p.nx - 0.5, p.ny - 0.5);
      if (dd > 0.55) {
        p.nx += (0.5 - p.nx) * 0.01;
        p.ny += (0.5 - p.ny) * 0.01;
      }
      const px = p.nx * W, py = p.ny * H;
      // color: cold gray noise -> warm gold stillness
      const r = 125 + 120 * still;
      const g = 115 + 95 * still;
      const b = 125 + 25 * still;
      const a = 0.14 + still * 0.55 + turb * 0.10;
      ctx.strokeStyle = 'rgba(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ',' + a.toFixed(2) + ')';
      ctx.lineWidth = p.w * (0.7 + still * 0.9);
      // stroke direction: tangential swirl far, radial calm near
      const tang = Math.atan2(dy, dx) + Math.PI / 2;
      const dir = tang * turb + Math.atan2(dy, dx) * still + Math.sin(T * 0.5 + p.ph) * 0.3 * turb;
      const L = p.len * (0.4 + turb * 1.3);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(dir) * L, py + Math.sin(dir) * L);
      ctx.stroke();
    }
    // faint ring marking the still boundary
    ctx.strokeStyle = 'rgba(240,200,140,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx * W, cy * H, stillR * 2.4 * Math.min(W, H), 0, Math.PI * 2);
    ctx.stroke();
    // warm breath at the very center
    const bg = ctx.createRadialGradient(cx*W, cy*H, 0, cx*W, cy*H, stillR * 1.4 * Math.min(W,H));
    bg.addColorStop(0, 'rgba(255,215,150,0.07)');
    bg.addColorStop(1, 'rgba(255,215,150,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    if (grain) {
      ctx.save(); ctx.globalAlpha = 0.5;
      ctx.fillStyle = ctx.createPattern(grain, 'repeat');
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  let running = true;
  function setRunning(v) {
    if (v === running) return;
    running = v;
    if (v) requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => setRunning(!document.hidden));
  window.addEventListener('blur', () => setRunning(false));
  window.addEventListener('focus', () => setRunning(true));
  window.addEventListener('resize', resize);
  makeGrain();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
