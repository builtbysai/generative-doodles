<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Question</title>
<style>
  html, body { margin: 0; padding: 0; background: #08090c; overflow: hidden; height: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .caption {
    position: fixed; bottom: 18px; left: 22px; color: rgba(220,215,200,0.42);
    font: 11px/1.5 -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.14em;
    text-transform: uppercase; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption">The Question &middot; after Gadamer</div>
<script>
/*
 * THE QUESTION
 * "One question that can save a conversation." A dark field of
 * murmuring marks — every mishearing, every assumption, talking
 * past each other. At the center, a single question forms in light.
 * Where its glow reaches, the noise settles.
 */
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let seed = 9139;
  function rnd() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  // murmuring marks
  const MURMUR = [];
  const NM = 700;
  function buildMurmur() {
    MURMUR.length = 0; seed = 9139;
    for (let i = 0; i < NM; i++) {
      MURMUR.push({
        x: rnd() * W, y: rnd() * H,
        vx: (rnd() - 0.5) * 1.4, vy: (rnd() - 0.5) * 1.4,
        len: 3 + rnd() * 10, w: 0.5 + rnd() * 1.2,
        ph: rnd() * Math.PI * 2,
        tone: rnd()  // 0 cool, 1 warm noise
      });
    }
  }
  let grain = null;
  function makeGrain() {
    grain = document.createElement('canvas');
    grain.width = 128; grain.height = 128;
    const g = grain.getContext('2d');
    const d = g.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      d.data[i] = d.data[i+1] = d.data[i+2] = v;
      d.data[i+3] = 11;
    }
    g.putImageData(d, 0, 0);
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildMurmur();
    ctx.fillStyle = '#08090c';
    ctx.fillRect(0, 0, W, H);
  }
  // question mark path, drawn as a glowing stroke
  // classic ? shape: arc over, down curve, dot below
  // draw the ? directly with beziers (called with glow styling set by caller)
  function strokeQuestion(cx, cy, s) {
    const top = cy - s * 0.52;      // top of hook
    const midY = cy - s * 0.05;     // where hook meets stem
    const stemBot = cy + s * 0.16;  // stem bottom
    ctx.beginPath();
    // hook: start lower-left, sweep up over the top, curl down to center
    ctx.moveTo(cx - s * 0.30, cy - s * 0.18);
    ctx.bezierCurveTo(
      cx - s * 0.30, top,            // control 1: up the left side
      cx + s * 0.34, top,            // control 2: over the top right
      cx + s * 0.30, cy - s * 0.22   // end: right side coming down
    );
    ctx.bezierCurveTo(
      cx + s * 0.27, cy - s * 0.02,  // control 1: continue down
      cx + s * 0.10, midY - s * 0.04,// control 2: hook left toward center
      cx + s * 0.02, midY            // end: center stem top
    );
    // stem: short vertical drop
    ctx.lineTo(cx + s * 0.02, stemBot);
    ctx.stroke();
  }
  let T = 0;
  function frame() {
    T += 0.016;
    ctx.fillStyle = 'rgba(8,9,12,0.20)';
    ctx.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    const s = Math.min(W, H) * 0.30;
    // breathing glow radius
    const glowR = s * (1.6 + Math.sin(T * 0.5) * 0.25);
    // 1. murmur field: agitated far from center, calm near it
    ctx.lineCap = 'round';
    for (const m of MURMUR) {
      const dx = m.x - cx, dy = m.y - cy;
      const d = Math.hypot(dx, dy);
      const calm = Math.max(0, 1 - d / glowR);  // 1 at center
      // velocity damped by calm
      const damp = 1 - calm * 0.92;
      m.x += (m.vx + Math.sin(T * 1.1 + m.ph) * 0.5) * damp;
      m.y += (m.vy + Math.cos(T * 0.9 + m.ph) * 0.5) * damp;
      // gentle pull toward calm orbit near center
      if (calm > 0.15 && d > 4) {
        m.x -= (dx / d) * calm * 0.35;
        m.y -= (dy / d) * calm * 0.35;
      }
      if (m.x < -20) m.x = W + 20; if (m.x > W + 20) m.x = -20;
      if (m.y < -20) m.y = H + 20; if (m.y > H + 20) m.y = -20;
      // color: agitated = dim red-gray, calm = soft gold
      const r = 130 + 110 * calm, g = 110 + 90 * calm, b = 120 + 20 * calm;
      const a = 0.16 + calm * 0.5 + (1 - calm) * 0.12;
      ctx.strokeStyle = 'rgba(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ',' + a.toFixed(2) + ')';
      ctx.lineWidth = m.w;
      const ang = Math.atan2(m.vy, m.vx) + Math.sin(T + m.ph) * (1 - calm) * 1.2;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x + Math.cos(ang) * m.len, m.y + Math.sin(ang) * m.len);
      ctx.stroke();
    }
    // 2. central glow
    const gg = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    gg.addColorStop(0, 'rgba(255,220,150,0.10)');
    gg.addColorStop(0.6, 'rgba(255,210,140,0.04)');
    gg.addColorStop(1, 'rgba(255,210,140,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);
    // 3. the question mark in light
    const pulse = 0.75 + Math.sin(T * 0.8) * 0.25;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    // outer glow pass
    ctx.strokeStyle = 'rgba(255,215,150,' + (0.16 * pulse).toFixed(2) + ')';
    ctx.lineWidth = 14;
    strokeQuestion(cx, cy, s);
    // core pass
    ctx.strokeStyle = 'rgba(255,232,190,' + (0.85 * pulse + 0.15).toFixed(2) + ')';
    ctx.lineWidth = 3.2;
    strokeQuestion(cx, cy, s);
    // the dot
    const dotY = cy + s * 0.34;
    ctx.fillStyle = 'rgba(255,232,190,' + (0.85 * pulse + 0.15).toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(cx, dotY, 7 * pulse + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,215,150,' + (0.18 * pulse).toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(cx, dotY, 20, 0, Math.PI * 2);
    ctx.fill();
    if (grain) {
      ctx.save(); ctx.globalAlpha = 0.5;
      ctx.fillStyle = ctx.createPattern(grain, 'repeat');
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  let running = true;
  function setRunning(v) {
    if (v === running) return;
    running = v;
    if (v) requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => setRunning(!document.hidden));
  window.addEventListener('blur', () => setRunning(false));
  window.addEventListener('focus', () => setRunning(true));
  window.addEventListener('resize', resize);
  makeGrain();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
