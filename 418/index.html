<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.418 Daydreamers</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFFFFF; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.418 Daydreamers (kittyo.illustration, EXPANSION #45).
// After Kitty O'Rourke's "Daydreamers" jigsaw mechanism
// for Piece & Quiet: four character portraits in a strict
// 2x2 grid with thin white gutters, each a woman whose
// sunglasses reflect a tiny dream scene. Top-left the
// Boho Beach Babe (striped top, ice-cream-cone earrings,
// beach in the lenses), top-right the Intrepid Safari
// Explorer (leopard-print hat, tigers and giraffes),
// bottom-left the Serene Spa Goddess (towel turban,
// meditating figure), bottom-right the Snow Season
// Queen (blue beanie, winter sweater, ski slopes). A
// hand-lettered caption sits under each portrait: BEACH,
// SAFARI, SPA, SKI, drawn as STROKE PATHS (no font
// text). Kitty O does not sign these pieces, so there
// is no signature. BLACK OUTLINES on every shape are
// her grammar in this set.
//
// TAP a quadrant: that portrait's lens scene re-dreams
// to the next scene in a FIXED AUTHORED CYCLE of eight
// (beach, safari, spa, ski, city, desert, aurora,
// underwater), cross-fading behind a 300ms sparkle wipe
// on fixed ticks - never a runtime reseed. Each lens
// scene is a CLIPPED DRAW REGION on the one canvas; the
// prompt's offscreen mini-canvases are not used. Ambient
// 30s loop: every visible lens scene carries tiny motion
// on whole cycles of the loop (waves lap, the giraffe's
// head bobs, the meditator breathes, snow falls), so the
// loop wraps seamlessly. Frame one is drawn at the
// constant phase T = 7.5s with beach, safari, spa and
// ski in the four lenses in grid order; the clock is
// anchored there and advances in fixed 1/60 ticks,
// never from a wall clock. Flat colour only, one
// canvas, no offscreen canvas, no gradients, no
// shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Grounds: coral, teal, lavender, mustard. Skins: four
// tones. Hair: black, blonde, brown, red. Lens scenes in
// miniature sky blue, sand, palm green, snow white.
// Black outlines on every shape. Nothing else.
var CORAL = '#FF6B6B', TEAL = '#2A9D8F', LAV = '#B388EB', MUST = '#D9A419';
var SKIN1 = '#F1C9A5', SKIN2 = '#C68A4A', SKIN3 = '#8A5A3B', SKIN4 = '#FCE8D5';
var INK = '#1A1A1A', BLONDE = '#F5C13B', BROWN = '#6B3A1F', RED = '#C0392B';
var SKY = '#87CEEB', SAND = '#F4E4BC', PALM = '#2E7D4F', SNOW = '#FFFFFF';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 30;
if (LOOP !== 30) throw new Error('Daydreamers ambient loop must be 30s');
var TICK = 1 / 60;
var T_OFF = 7.5;

// ---- the grid ------------------------------------------
// Strict 2x2, thin white gutters, full-bleed cover-fit.
// Cell 622x432, gutter 12, outer margin 12.
var MARG = 12, GUT = 12;
var CW = (DW - 2 * MARG - GUT) / 2, CH = (DH - 2 * MARG - GUT) / 2;
var CELLS = [
  { x: MARG, y: MARG },
  { x: MARG + CW + GUT, y: MARG },
  { x: MARG, y: MARG + CH + GUT },
  { x: MARG + CW + GUT, y: MARG + CH + GUT }
];

// ---- the scene pool ------------------------------------
// The FIXED AUTHORED CYCLE of eight lens scenes. A tap
// advances one step through this list, wrapping after
// underwater back to beach. Never reseeded at runtime.
var SCENES = ['beach', 'safari', 'spa', 'ski', 'city', 'desert', 'aurora', 'underwater'];
if (SCENES.length !== 8) throw new Error('lens scene pool must be exactly 8');

// ---- the four portraits ---------------------------------
// Per-quadrant character recipe. scene = index into
// SCENES; frame one shows beach, safari, spa, ski in
// grid order.
var QUADS = [
  { ground: CORAL, skin: SKIN1, hair: INK,    style: 'beach',  caption: 'BEACH'  },
  { ground: TEAL,  skin: SKIN2, hair: BLONDE, style: 'safari', caption: 'SAFARI' },
  { ground: LAV,   skin: SKIN3, hair: INK,    style: 'spa',    caption: 'SPA'    },
  { ground: MUST,  skin: SKIN4, hair: RED,    style: 'ski',    caption: 'SKI'    }
];
if (QUADS.length !== 4) throw new Error('Daydreamers must have exactly 4 portraits');
var sceneIdx = [0, 1, 2, 3];

// QA probes via the house seed pattern: ?seed=scenes2
// shows the back half of the cycle (city, desert,
// aurora, underwater); ?seed=wipe freezes quadrant 0
// mid-wipe. Neither affects the shipped default.
var seedStr = (typeof location !== 'undefined' && location.search) ? location.search : '';
if (seedStr.indexOf('scenes2') >= 0) sceneIdx = [4, 5, 6, 7];

// ---- wipe state -----------------------------------------
// wipeStart[qi] is the loop-clock time the current wipe
// began; WIPE_LEN is exactly 0.3s (the prompt's 300ms),
// 18 fixed ticks. wipeFrom[qi] is the scene cross-fading
// out; sceneIdx[qi] is the scene cross-fading in.
var WIPE_LEN = 0.3;
var wipeStart = [-10, -10, -10, -10];
var wipeFrom = [0, 1, 2, 3];
if (seedStr.indexOf('wipe') >= 0) { wipeFrom[0] = 0; sceneIdx[0] = 1; wipeStart[0] = T_OFF - 0.15; }

// ---- hand-lettered stroke font --------------------------
// Each letter is a list of strokes; each stroke is a
// list of [x, y] points in a unit box (x 0..0.72,
// y 0..1, y down). Drawn twice: a thick black pass
// under a thinner white pass, so the captions read as
// outlined hand lettering. No font text anywhere.
function arcPts(cx, cy, rx, ry, a0, a1, n) {
  var pts = [];
  for (var i = 0; i <= n; i++) {
    var a = (a0 + (a1 - a0) * (i / n)) * Math.PI / 180;
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return pts;
}
var LETTERS = {
  A: [ [[0, 1], [0.36, 0], [0.72, 1]], [[0.15, 0.64], [0.57, 0.64]] ],
  B: [ [[0.07, 0], [0.07, 1]],
       [[0.07, 0], [0.42, 0.01], [0.56, 0.13], [0.56, 0.3], [0.43, 0.43], [0.07, 0.47]],
       [[0.07, 0.47], [0.48, 0.49], [0.62, 0.63], [0.62, 0.83], [0.49, 0.97], [0.07, 1]] ],
  C: [ arcPts(0.4, 0.5, 0.33, 0.48, -52, -308, 14) ],
  E: [ [[0.1, 0], [0.1, 1]], [[0.1, 0], [0.64, 0]], [[0.1, 0.5], [0.52, 0.5]], [[0.1, 1], [0.66, 1]] ],
  F: [ [[0.1, 0], [0.1, 1]], [[0.1, 0], [0.64, 0]], [[0.1, 0.5], [0.5, 0.5]] ],
  H: [ [[0.08, 0], [0.08, 1]], [[0.64, 0], [0.64, 1]], [[0.08, 0.5], [0.64, 0.5]] ],
  I: [ [[0.36, 0], [0.36, 1]], [[0.14, 0], [0.58, 0]], [[0.14, 1], [0.58, 1]] ],
  K: [ [[0.08, 0], [0.08, 1]], [[0.62, 0], [0.13, 0.52]], [[0.25, 0.38], [0.66, 1]] ],
  L: [ [[0.1, 0], [0.1, 1], [0.62, 1]] ],
  P: [ [[0.08, 0], [0.08, 1]],
       [[0.08, 0], [0.45, 0.01], [0.6, 0.13], [0.6, 0.33], [0.45, 0.47], [0.08, 0.5]] ],
  R: [ [[0.08, 0], [0.08, 1]],
       [[0.08, 0], [0.45, 0.01], [0.6, 0.13], [0.6, 0.33], [0.45, 0.47], [0.08, 0.5]],
       [[0.34, 0.5], [0.64, 1]] ],
  S: [ [[0.6, 0.15], [0.45, 0.02], [0.21, 0.03], [0.1, 0.18], [0.15, 0.35], [0.33, 0.47], [0.53, 0.57], [0.62, 0.73], [0.53, 0.91], [0.31, 1], [0.13, 0.9]] ],
  X: [ [[0.06, 0], [0.66, 1]], [[0.66, 0], [0.06, 1]] ]
};
function drawWord(word, cx, topY, h, inkW, faceW, inkCol, faceCol) {
  var adv = 0.94 * h, total = adv * word.length - (adv - 0.72 * h);
  var x = cx - total / 2;
  for (var pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = pass === 0 ? inkCol : faceCol;
    ctx.lineWidth = pass === 0 ? inkW : faceW;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (var li = 0; li < word.length; li++) {
      var strokes = LETTERS[word.charAt(li)];
      if (!strokes) continue;
      for (var si = 0; si < strokes.length; si++) {
        var pts = strokes[si];
        ctx.beginPath();
        for (var pi = 0; pi < pts.length; pi++) {
          var px = x + li * adv + pts[pi][0] * h, py = topY + pts[pi][1] * h;
          if (pi === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    }
  }
}

// ---- small draw helpers ---------------------------------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function circ(x, y, r, fill, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, lw) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke(); }
}
function star4(cx, cy, r, fill) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.quadraticCurveTo(cx, cy, cx + r, cy);
  ctx.quadraticCurveTo(cx, cy, cx, cy + r);
  ctx.quadraticCurveTo(cx, cy, cx - r, cy);
  ctx.quadraticCurveTo(cx, cy, cx, cy - r);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
}
function waveLine(yBase, amp, phase, col, lw) {
  ctx.beginPath();
  for (var x = -54; x <= 54; x += 6) {
    var y = yBase + Math.sin(x * 0.16 + phase) * amp;
    if (x === -54) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}

// ---- lens scenes ----------------------------------------
// Each scene is drawn in lens-local coordinates: the
// lens interior is x -50..50, y -36..36, horizon near
// y = 6. p is the loop phase in whole cycles (t / 30),
// and every motion uses an integer cycle count k so
// the 30s loop wraps seamlessly. The caller clips to
// the lens shape before calling.
function sceneBeach(p) {
  ctx.fillStyle = SKY; ctx.fillRect(-52, -38, 104, 48);
  circ(31, -21, 9, SNOW, 2.5);
  ctx.fillStyle = SAND; ctx.fillRect(-52, 10, 104, 28);
  ctx.fillStyle = SKY; ctx.fillRect(-52, -2, 104, 13);
  var ph = Math.PI * 2 * 3 * p;
  waveLine(2, 2.2, ph, SNOW, 3);
  waveLine(8, 2.2, ph + 1.4, SNOW, 3);
  // palm: curved trunk and fronds
  ctx.strokeStyle = BROWN; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-33, 34); ctx.quadraticCurveTo(-31, 16, -26, 2); ctx.stroke();
  ctx.strokeStyle = PALM; ctx.lineWidth = 3.5;
  var fr = [[-44, -6], [-36, -10], [-26, -11], [-16, -8], [-14, -1]];
  for (var i = 0; i < fr.length; i++) {
    ctx.beginPath(); ctx.moveTo(-26, 2);
    ctx.quadraticCurveTo((-26 + fr[i][0]) / 2, fr[i][1] - 4, fr[i][0], fr[i][1] + 4); ctx.stroke();
  }
}
function sceneSafari(p) {
  ctx.fillStyle = SKY; ctx.fillRect(-52, -38, 104, 46);
  ctx.fillStyle = SAND; ctx.fillRect(-52, 8, 104, 30);
  // acacia tree
  ctx.strokeStyle = BROWN; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(32, 36); ctx.lineTo(29, 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(29, 12); ctx.lineTo(19, 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(29, 10); ctx.lineTo(39, 0); ctx.stroke();
  ell(29, -4, 21, 7, PALM, 2.5);
  // giraffe: body, legs, neck, bobbing head
  var bob = Math.sin(Math.PI * 2 * 2 * p) * 2;
  ctx.strokeStyle = BLONDE; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-22, 22); ctx.lineTo(-22, 35); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6, 22); ctx.lineTo(-6, 35); ctx.stroke();
  ell(-14, 16, 17, 10, BLONDE, 2.5);
  ctx.beginPath();
  ctx.moveTo(-24, 10); ctx.lineTo(-31, -13 + bob); ctx.lineTo(-24, -16 + bob); ctx.lineTo(-16, 8);
  ctx.closePath(); ctx.fillStyle = BLONDE; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
  ell(-28, -17 + bob, 8.5, 6, BLONDE, 2.5);
  circ(-33, -24 + bob, 1.8, BROWN, 0);
  circ(-14, 13, 3, BROWN, 0); circ(-6, 19, 2.4, BROWN, 0); circ(-21, 20, 2.2, BROWN, 0);
  circ(-25, -8 + bob, 2.2, BROWN, 0);
}
function sceneSpa(p) {
  ctx.fillStyle = LAV; ctx.fillRect(-52, -38, 104, 76);
  ctx.fillStyle = SNOW; ctx.fillRect(-52, 24, 104, 14);
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-52, 24); ctx.lineTo(52, 24); ctx.stroke();
  // steam curls, rising on 3 whole cycles
  ctx.strokeStyle = SNOW; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (var s = 0; s < 2; s++) {
    var sx = s === 0 ? -27 : 27, off = s === 0 ? 0 : 0.5;
    var al = 0.45 + 0.3 * Math.sin(Math.PI * 2 * 3 * (p + off));
    ctx.globalAlpha = Math.max(0.12, al);
    ctx.beginPath(); ctx.arc(sx, -8, 6, Math.PI * 0.9, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx + 2, -19, 4.5, Math.PI * 1.1, Math.PI * 2.1); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // meditator on a palm-leaf mat, breathing on 2 cycles
  ell(0, 27, 21, 5, PALM, 2.5);
  var br = 1 + 0.045 * Math.sin(Math.PI * 2 * 2 * p);
  ctx.save(); ctx.translate(0, 26); ctx.scale(1, br); ctx.translate(0, -26);
  ctx.beginPath();
  ctx.moveTo(-17, 26); ctx.lineTo(17, 26); ctx.lineTo(8, 12); ctx.lineTo(-8, 12);
  ctx.closePath(); ctx.fillStyle = SNOW; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
  rr(-8.5, -6, 17, 19, 6); ctx.fillStyle = SNOW; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-8, 2); ctx.lineTo(-15, 20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, 2); ctx.lineTo(15, 20); ctx.stroke();
  circ(0, -13, 7, SKIN1, 2.5);
  ctx.restore();
  // the word RELAX held small in the scene's upper space,
  // hand-lettered stroke paths like the captions
  drawWord('RELAX', 0, -33, 9, 2.6, 1.5, INK, SNOW);
}
function sceneSki(p) {
  ctx.fillStyle = SKY; ctx.fillRect(-52, -38, 104, 76);
  circ(-33, -24, 8, SNOW, 2.5);
  ctx.beginPath();
  ctx.moveTo(-52, 2); ctx.lineTo(52, 20); ctx.lineTo(52, 38); ctx.lineTo(-52, 38);
  ctx.closePath(); ctx.fillStyle = SNOW; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
  // pines on the slope
  var pines = [[-28, 12, 15], [16, 20, 12], [36, 26, 10]];
  for (var i = 0; i < pines.length; i++) {
    var px = pines[i][0], py = pines[i][1], ps = pines[i][2];
    ctx.fillStyle = BROWN; ctx.fillRect(px - 1.5, py - 2, 3, 5);
    ctx.beginPath();
    ctx.moveTo(px, py - ps - 4); ctx.lineTo(px - ps * 0.55, py); ctx.lineTo(px + ps * 0.55, py);
    ctx.closePath(); ctx.fillStyle = PALM; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  }
  // falling snow, 4 whole cycles per loop
  ctx.fillStyle = SNOW;
  for (var d = 0; d < 10; d++) {
    var dx = -46 + d * 10 + (d % 3) * 3;
    var dy = -38 + ((d * 23 + p * 4 * 76) % 76);
    ctx.beginPath(); ctx.arc(dx, dy, 1.9, 0, Math.PI * 2); ctx.fill();
  }
}
function sceneCity(p) {
  ctx.fillStyle = LAV; ctx.fillRect(-52, -38, 104, 76);
  circ(34, -24, 7.5, SNOW, 2.5);
  var blds = [
    { x: -52, w: 24, h: 44, c: INK }, { x: -26, w: 20, h: 58, c: BROWN },
    { x: -4, w: 22, h: 38, c: INK }, { x: 20, w: 18, h: 52, c: BROWN },
    { x: 40, w: 14, h: 42, c: INK }
  ];
  for (var i = 0; i < blds.length; i++) {
    var b = blds[i];
    ctx.fillStyle = b.c; ctx.fillRect(b.x, 38 - b.h, b.w, b.h);
    ctx.fillStyle = SNOW;
    for (var wy = 38 - b.h + 7; wy < 32; wy += 10) {
      for (var wx = b.x + 4; wx < b.x + b.w - 3; wx += 8) ctx.fillRect(wx, wy, 3.4, 4.4);
    }
  }
  // one window twinkles on 5 whole cycles
  ctx.globalAlpha = 0.25 + 0.75 * Math.abs(Math.sin(Math.PI * 2 * 5 * p));
  ctx.fillStyle = SNOW; ctx.fillRect(-17, -2, 4.4, 5.4);
  ctx.globalAlpha = 1;
}
function sceneDesert(p) {
  ctx.fillStyle = SKY; ctx.fillRect(-52, -38, 104, 76);
  circ(-31, -21, 9, SNOW, 2.5);
  ctx.beginPath();
  ctx.moveTo(-52, 14); ctx.quadraticCurveTo(-14, 2, 16, 12);
  ctx.quadraticCurveTo(36, 18, 52, 12); ctx.lineTo(52, 38); ctx.lineTo(-52, 38);
  ctx.closePath(); ctx.fillStyle = SAND; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
  // cactus
  rr(17, -2, 12, 34, 6); ctx.fillStyle = PALM; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
  rr(6, 6, 8, 16, 4); ctx.fillStyle = PALM; ctx.fill(); ctx.stroke();
  rr(32, 2, 8, 19, 4); ctx.fillStyle = PALM; ctx.fill(); ctx.stroke();
  ctx.fillStyle = SAND; ctx.fillRect(10, 12, 26, 6);
  circ(-18, 28, 2.6, BROWN, 0); circ(-10, 31, 2, BROWN, 0); circ(42, 30, 2.3, BROWN, 0);
}
function sceneAurora(p) {
  ctx.fillStyle = INK; ctx.fillRect(-52, -38, 104, 76);
  // stars twinkle on 6 whole cycles
  var stars = [[-40, -30], [-18, -22], [4, -31], [24, -25], [42, -32], [-30, -12], [14, -14]];
  for (var i = 0; i < stars.length; i++) {
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(Math.PI * 2 * 6 * p + i * 1.3));
    circ(stars[i][0], stars[i][1], 1.7, SNOW, 0);
  }
  ctx.globalAlpha = 1;
  // two aurora bands swaying on 2 whole cycles
  var sway = Math.sin(Math.PI * 2 * 2 * p) * 3;
  var bands = [[-24, PALM, 0.8], [-10, SKY, 0.6]];
  for (var b = 0; b < bands.length; b++) {
    ctx.globalAlpha = bands[b][2];
    ctx.beginPath();
    for (var x = -52; x <= 52; x += 8) {
      var yt = bands[b][0] + Math.sin(x * 0.07 + sway) * 4;
      if (x === -52) ctx.moveTo(x, yt); else ctx.lineTo(x, yt);
    }
    for (var x2 = 52; x2 >= -52; x2 -= 8) {
      ctx.lineTo(x2, bands[b][0] + 13 + Math.sin(x2 * 0.07 + sway) * 4);
    }
    ctx.closePath(); ctx.fillStyle = bands[b][1]; ctx.fill();
  }
  ctx.globalAlpha = 1;
  // snowy ground with pine silhouettes
  ctx.fillStyle = SNOW; ctx.fillRect(-52, 24, 104, 14);
  ctx.fillStyle = INK;
  var pp = [[-38, 24, 13], [-6, 24, 10], [28, 24, 12]];
  for (var j = 0; j < pp.length; j++) {
    ctx.beginPath();
    ctx.moveTo(pp[j][0], pp[j][1] - pp[j][2]); ctx.lineTo(pp[j][0] - 6, pp[j][1]); ctx.lineTo(pp[j][0] + 6, pp[j][1]);
    ctx.closePath(); ctx.fill();
  }
}
function sceneUnderwater(p) {
  ctx.fillStyle = SKY; ctx.fillRect(-52, -38, 104, 76);
  ctx.fillStyle = SAND; ctx.fillRect(-52, 28, 104, 10);
  // seaweed swaying on 2 whole cycles
  ctx.strokeStyle = PALM; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  var weeds = [-36, -24, 38];
  for (var i = 0; i < weeds.length; i++) {
    ctx.beginPath(); ctx.moveTo(weeds[i], 30);
    ctx.quadraticCurveTo(weeds[i] + Math.sin(Math.PI * 2 * 2 * p + i) * 4, 14, weeds[i] + Math.sin(Math.PI * 2 * 2 * p + i * 2) * 5, 2);
    ctx.stroke();
  }
  // a coral fish swimming on 2 whole cycles
  var fx = Math.sin(Math.PI * 2 * 2 * p) * 17, fy = -4 + Math.sin(Math.PI * 2 * 4 * p) * 2;
  ctx.save(); ctx.translate(fx, fy); if (Math.cos(Math.PI * 2 * 2 * p) < 0) ctx.scale(-1, 1);
  ctx.beginPath();
  ctx.moveTo(9, 0); ctx.lineTo(19, -6); ctx.lineTo(19, 6); ctx.closePath();
  ctx.fillStyle = CORAL; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.2; ctx.stroke();
  ell(0, 0, 11, 6, CORAL, 2.2);
  circ(-5, -1, 1.8, SNOW, 0); circ(-5, -1, 0.9, INK, 0);
  ctx.restore();
  // bubbles rising on 3 whole cycles
  ctx.strokeStyle = SNOW; ctx.lineWidth = 1.8;
  for (var d = 0; d < 4; d++) {
    var bx = 18 + d * 7, by = 30 - ((d * 19 + p * 3 * 62) % 62);
    ctx.beginPath(); ctx.arc(bx, by, 2 + (d % 2), 0, Math.PI * 2); ctx.stroke();
  }
}
var SCENE_FN = [sceneBeach, sceneSafari, sceneSpa, sceneSki, sceneCity, sceneDesert, sceneAurora, sceneUnderwater];
if (SCENE_FN.length !== 8) throw new Error('scene draw functions must be exactly 8');

// ---- one lens -------------------------------------------
// The scene is drawn as a CLIPPED DRAW REGION on the one
// canvas: clip to the lens rounded rect, paint the scene
// (or the cross-fading pair during a wipe), unclip, add
// the highlight slash, then stroke the frame.
var LENS_W = 100, LENS_H = 72, LENS_R = 20;
function drawLens(cx, cy, qi, p, t) {
  ctx.save();
  ctx.translate(cx, cy);
  rr(-LENS_W / 2, -LENS_H / 2, LENS_W, LENS_H, LENS_R);
  ctx.clip();
  var wiping = (t - wipeStart[qi]) < WIPE_LEN && wipeStart[qi] > 0;
  if (wiping) {
    var pr = Math.max(0, Math.min(1, (t - wipeStart[qi]) / WIPE_LEN));
    ctx.globalAlpha = 1 - pr; SCENE_FN[wipeFrom[qi]](p);
    ctx.globalAlpha = pr; SCENE_FN[sceneIdx[qi]](p);
    ctx.globalAlpha = 1;
  } else {
    SCENE_FN[sceneIdx[qi]](p);
  }
  // highlight slash across the upper left
  ctx.strokeStyle = SNOW; ctx.globalAlpha = 0.4; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-34, 14); ctx.lineTo(-14, -22); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
  // frame
  rr(cx - LENS_W / 2, cy - LENS_H / 2, LENS_W, LENS_H, LENS_R);
  ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
  if (wiping) {
    // the sparkle wipe: authored sparkles swelling over
    // the lens on the wipe's fixed ticks
    var sc = Math.sin(Math.PI * pr);
    star4(cx - 20, cy - 8, 13 * sc + 2, SNOW);
    star4(cx + 22, cy + 10, 9 * sc + 2, SNOW);
    star4(cx + 4, cy - 20, 7 * sc + 2, SNOW);
  }
}
function drawGlasses(hx, hy, qi, p, t) {
  var gy = hy - 4;
  // temple arms to the sides of the head
  ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx - 106, gy); ctx.lineTo(hx - 84, gy - 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx + 106, gy); ctx.lineTo(hx + 84, gy - 4); ctx.stroke();
  // bridge
  ctx.beginPath(); ctx.moveTo(hx - 8, gy - 8); ctx.lineTo(hx + 8, gy - 8); ctx.stroke();
  drawLens(hx - 57, gy, qi, p, t);
  drawLens(hx + 57, gy, qi, p, t);
}

// ---- the portraits --------------------------------------
// Bust recipe shared by all four: torso, hair mass, head,
// face, then the quadrant's own hat or hair treatment,
// then the sunglasses as the visual centre.
function drawPortrait(qi, p, t) {
  var q = QUADS[qi], cell = CELLS[qi];
  var cx = cell.x + CW / 2, hx = cx, hy = cell.y + 168;
  ctx.save();
  ctx.beginPath(); ctx.rect(cell.x, cell.y, CW, CH); ctx.clip();
  // ground and a soft halo disc behind the bust
  ctx.fillStyle = q.ground; ctx.fillRect(cell.x, cell.y, CW, CH);
  ctx.globalAlpha = 0.16; circ(cx, hy + 62, 218, SNOW, 0); ctx.globalAlpha = 1;
  star4(cell.x + 44, cell.y + 42, 11, SNOW);
  star4(cell.x + CW - 44, cell.y + 42, 9, SNOW);

  // torso
  ctx.beginPath();
  ctx.moveTo(hx - 116, cell.y + 372);
  ctx.lineTo(hx - 104, cell.y + 254);
  ctx.quadraticCurveTo(hx - 100, cell.y + 238, hx - 40, cell.y + 232);
  ctx.lineTo(hx + 40, cell.y + 232);
  ctx.quadraticCurveTo(hx + 100, cell.y + 238, hx + 104, cell.y + 254);
  ctx.lineTo(hx + 116, cell.y + 372);
  ctx.quadraticCurveTo(hx, cell.y + 386, hx - 116, cell.y + 372);
  ctx.closePath();
  var topCol = q.style === 'beach' ? TEAL : q.style === 'safari' ? SAND : q.style === 'spa' ? SNOW : RED;
  ctx.fillStyle = topCol; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
  // garment patterns, clipped to the torso
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(hx - 116, cell.y + 372);
  ctx.lineTo(hx - 104, cell.y + 254);
  ctx.quadraticCurveTo(hx - 100, cell.y + 238, hx - 40, cell.y + 232);
  ctx.lineTo(hx + 40, cell.y + 232);
  ctx.quadraticCurveTo(hx + 100, cell.y + 238, hx + 104, cell.y + 254);
  ctx.lineTo(hx + 116, cell.y + 372);
  ctx.quadraticCurveTo(hx, cell.y + 386, hx - 116, cell.y + 372);
  ctx.closePath(); ctx.clip();
  if (q.style === 'beach') {
    ctx.fillStyle = SNOW;
    for (var sy = cell.y + 258; sy < cell.y + 380; sy += 26) ctx.fillRect(hx - 120, sy, 240, 10);
  } else if (q.style === 'safari') {
    ctx.fillStyle = BROWN;
    var spots = [[-70, 262], [-20, 282], [38, 264], [76, 292], [-44, 316], [8, 330], [62, 338], [-84, 344]];
    for (var sp = 0; sp < spots.length; sp++) circ(hx + spots[sp][0], cell.y + spots[sp][1], 7, BROWN, 0);
  } else if (q.style === 'spa') {
    ctx.strokeStyle = LAV; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(hx - 118, cell.y + 306); ctx.lineTo(hx + 118, cell.y + 282); ctx.stroke();
  } else {
    ctx.strokeStyle = SNOW; ctx.lineWidth = 6; ctx.lineJoin = 'round';
    for (var zy = cell.y + 272; zy < cell.y + 366; zy += 30) {
      ctx.beginPath();
      for (var zx = -112; zx <= 112; zx += 28) {
        var zp = hx + zx, zpy = zy + (((zx / 28) % 2 === 0) ? 0 : 9);
        if (zx === -112) ctx.moveTo(zp, zpy); else ctx.lineTo(zp, zpy);
      }
      ctx.stroke();
    }
  }
  ctx.restore();

  // hair mass behind the head
  if (q.style === 'beach') {
    rr(hx - 108, hy - 92, 216, 252, 92); ctx.fillStyle = q.hair; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
  } else if (q.style === 'safari' || q.style === 'ski') {
    ell(hx - 88, hy + 36, 26, 62, q.hair, 5);
    ell(hx + 88, hy + 36, 26, 62, q.hair, 5);
  }

  // head and face
  circ(hx, hy, 84, q.skin, 5);
  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx, hy + 22); ctx.lineTo(hx - 3, hy + 36); ctx.stroke();
  ctx.beginPath(); ctx.arc(hx, hy + 38, 17, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
  ctx.globalAlpha = 0.5;
  circ(hx - 52, hy + 40, 9, CORAL, 0); circ(hx + 52, hy + 40, 9, CORAL, 0);
  ctx.globalAlpha = 1;

  // the quadrant's own crown: hat, turban, beanie, or fringe
  if (q.style === 'beach') {
    ctx.beginPath(); ctx.arc(hx, hy - 18, 84, Math.PI * 1.08, Math.PI * 1.92);
    ctx.quadraticCurveTo(hx, hy - 108, hx - 84 * Math.cos(Math.PI * 0.08), hy - 18);
    ctx.closePath(); ctx.fillStyle = q.hair; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
  } else if (q.style === 'safari') {
    // leopard-print hat: wide brim and dome, sand with brown spots
    ell(hx, hy - 56, 112, 24, SAND, 5);
    ctx.beginPath(); ctx.arc(hx, hy - 52, 62, Math.PI, Math.PI * 2);
    ctx.closePath(); ctx.fillStyle = SAND; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    var hs = [[-34, -88], [4, -102], [36, -84], [-8, -70], [22, -64]];
    for (var hi = 0; hi < hs.length; hi++) ell(hx + hs[hi][0], hy + hs[hi][1], 8, 5.5, BROWN, 0);
    ell(hx, hy - 56, 112, 24, null, 5);
  } else if (q.style === 'spa') {
    // towel turban: wrapped white mass with a knot
    ell(hx, hy - 62, 76, 42, SNOW, 5);
    ctx.beginPath(); ctx.arc(hx, hy - 40, 84, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ell(hx + 30, hy - 92, 20, 15, SNOW, 5);
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(hx - 58, hy - 74); ctx.quadraticCurveTo(hx, hy - 56, hx + 58, hy - 76); ctx.stroke();
  } else {
    // blue beanie with a white brim band and pompom
    ctx.beginPath(); ctx.arc(hx, hy - 14, 85, Math.PI * 1.02, Math.PI * 1.98);
    ctx.lineTo(hx + 85, hy - 34); ctx.lineTo(hx - 85, hy - 34);
    ctx.closePath(); ctx.fillStyle = SKY; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    rr(hx - 87, hy - 46, 174, 24, 10); ctx.fillStyle = SNOW; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    circ(hx, hy - 108, 17, SNOW, 5);
  }

  // the sunglasses, the visual centre of each face
  drawGlasses(hx, hy, qi, p, t);

  // ice-cream-cone earrings for the beach babe, drawn
  // after the glasses so they hang clear of the frames:
  // a coral scoop on a sand cone at each side of the face
  if (q.style === 'beach') {
    var ex = [-100, 100];
    for (var ei = 0; ei < 2; ei++) {
      var exx = hx + ex[ei];
      ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(exx, hy + 28); ctx.lineTo(exx, hy + 38); ctx.stroke();
      circ(exx, hy + 47, 10.5, CORAL, 3.5);
      ctx.beginPath();
      ctx.moveTo(exx - 9, hy + 55); ctx.lineTo(exx + 9, hy + 55); ctx.lineTo(exx, hy + 80);
      ctx.closePath(); ctx.fillStyle = SAND; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
    }
  }

  // caption strip under the portrait, hand-lettered paths
  drawWord(q.caption, cx, cell.y + 388, 30, 7.5, 4.2, INK, SNOW);
  ctx.restore();
}

// ---- clock ------------------------------------------------
// T starts at the constant phase T_OFF and advances in
// fixed 1/60 ticks; frame one is drawn synchronously at
// T_OFF exactly, so the thumbnail reproduces
// byte-identically from the shipped script.
var T = T_OFF, acc = 0, lastNow = -1;
function step() { /* state is a pure function of T and the tap table */ }

function draw() {
  ctx.fillStyle = SNOW; ctx.fillRect(0, 0, DW, DH);
  var p = (T % LOOP) / LOOP;
  for (var qi = 0; qi < 4; qi++) drawPortrait(qi, p, T);
}

// ---- pointer: tap a quadrant ------------------------------
// A tap is a press and release close together in design
// space. It advances that quadrant's lens scene one step
// through the authored cycle, starting the 300ms sparkle
// wipe on fixed ticks. The piece never reloads.
var downX = -1, downY = -1, downT = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var pt = toDesign(e);
  downX = pt.x; downY = pt.y; downT = T;
});
function endPointer(e) {
  if (downX < 0) return;
  var pt = toDesign(e);
  var dx = pt.x - downX, dy = pt.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved >= 28 || held >= 0.6) return;
  var qi = (pt.x > DW / 2 ? 1 : 0) + (pt.y > DH / 2 ? 2 : 0);
  if ((T - wipeStart[qi]) < WIPE_LEN && wipeStart[qi] > 0) return;
  wipeFrom[qi] = sceneIdx[qi];
  sceneIdx[qi] = (sceneIdx[qi] + 1) % SCENES.length;
  wipeStart[qi] = T;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; });

// ---- sizing: full-bleed cover-fit -------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
