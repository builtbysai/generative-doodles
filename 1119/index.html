<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Story</title>
<style>
  html, body { margin: 0; padding: 0; background: #F7F4EC; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var seed = 1119;
  try {
    var m = /[?&]seed=(\d+)/.exec(location.search || '');
    if (m) seed = parseInt(m[1], 10);
  } catch (e) {}
  var rnd = mulberry32(seed * 7919 + 13);

  // ---------- palette ----------
  var PAPER = '#F7F4EC';
  var INK = [30, 30, 36];        // #1E1E24
  var BLUE = [43, 92, 230];      // #2B5CE6
  var RED = [200, 64, 42];       // #C8402A
  var CAPTION = '#6B675C';

  var CAPTIONS = [
    'first, the water finds its way downhill.',
    'then we stand the days upright, side by side.',
    'for a while, everything is everywhere at once.',
    'and at last the years close round us like rings.'
  ];

  // ---------- phone detection ----------
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var minScreen = Math.min(sw || 9999, sh || 9999);
  var isPhone = minScreen < 700;

  // ---------- particles ----------
  var N = isPhone ? 420 : 800;
  var BANDS = 7, COLS = 14, RINGS = 6;
  var colHeights = [];
  for (var c = 0; c < COLS; c++) colHeights.push(0.35 + rnd() * 0.6);
  var ringR = [];
  for (var r = 0; r < RINGS; r++) ringR.push(0.09 + r * 0.075 + rnd() * 0.012);

  function pickColor(layout, redOk) {
    var u = rnd();
    if (layout === 0) return u < 0.65 ? BLUE : INK;          // stream
    if (layout === 1) return u < 0.70 ? INK : BLUE;          // bars
    if (layout === 2) {                                       // scatter
      if (redOk) return RED;
      return u < 0.5 ? INK : BLUE;
    }
    return u < 0.5 ? INK : BLUE;                              // rings
  }

  var P = [];
  for (var i = 0; i < N; i++) {
    var pos = [], col = [];

    // STREAM: flowing horizontal sine bands
    var band = i % BANDS;
    var sx = rnd();
    var bandY = 0.14 + (band / (BANDS - 1)) * 0.72;
    var sy = bandY + 0.030 * Math.sin(sx * Math.PI * 2 * 1.35 + band * 1.7) + (rnd() - 0.5) * 0.016;
    pos.push([sx * 0.94 + 0.03, sy]);

    // BARS: vertical columns of seeded heights, stacked from the bottom
    var bc = Math.floor(rnd() * COLS);
    var bf = rnd();
    var bx = (bc + 0.5) / COLS + (rnd() - 0.5) * (0.55 / COLS);
    var by = 0.95 - bf * colHeights[bc] * 0.82;
    pos.push([bx, by]);

    // SCATTER: seeded field; ~15% carry the red here and only here
    var isRed = rnd() < 0.15;
    pos.push([0.03 + rnd() * 0.94, 0.05 + rnd() * 0.90]);

    // RINGS: concentric rings around the centre
    var rk = Math.floor(rnd() * RINGS);
    var th = rnd() * Math.PI * 2;
    var rr = ringR[rk] + (rnd() - 0.5) * 0.014;
    pos.push([0.5 + Math.cos(th) * rr, 0.5 + Math.sin(th) * rr]);

    for (var L = 0; L < 4; L++) col.push(pickColor(L, isRed));

    P.push({
      pos: pos,
      col: col,
      rad: 1.5 + rnd() * 1.6,
      phase: rnd() * Math.PI * 2,
      wob: 0.6 + rnd() * 0.8
    });
  }

  // ---------- scroll state ----------
  var userMode = false;
  var targetS = 0;
  var curS = 0;

  function idleS(t) {
    // cycle: drift 0->3 over 75 s, hold 8 s, return over 27 s; period 110 s
    var T = 110, u = t % T;
    if (u < 75) return 3 * (u / 75);
    if (u < 83) return 3;
    return 3 * (1 - (u - 83) / 27);
  }

  function smooth(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }

  // ---------- view / canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }

  function fit() {
    W = viewW(); H = viewH();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function draw(t) {
    fit();
    var s = userMode ? curS : idleS(t);
    var lo = Math.min(2, Math.floor(s));
    var fr = smooth(s - lo);
    var hi = lo + 1;

    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // stage: a centred square-ish field above the caption margin
    var side = Math.min(W * 0.92, H * 0.80);
    var ox = (W - side) / 2;
    var oy = (H * 0.86 - side) / 2;
    if (oy < H * 0.03) oy = H * 0.03;
    var scale = side / 720;

    for (var i = 0; i < N; i++) {
      var p = P[i];
      var ax = p.pos[lo][0], ay = p.pos[lo][1];
      var bx = p.pos[hi][0], by = p.pos[hi][1];
      var x = ax + (bx - ax) * fr;
      var y = ay + (by - ay) * fr;
      // gentle breathing, a pure function of t; the layout itself is a pure function of s
      x += Math.sin(t * 0.55 + p.phase) * 0.0016 * p.wob;
      y += Math.cos(t * 0.47 + p.phase * 1.3) * 0.0016 * p.wob;

      var ca = p.col[lo], cb = p.col[hi];
      var cr = Math.round(ca[0] + (cb[0] - ca[0]) * fr);
      var cg = Math.round(ca[1] + (cb[1] - ca[1]) * fr);
      var cbl = Math.round(ca[2] + (cb[2] - ca[2]) * fr);
      ctx.fillStyle = 'rgb(' + cr + ',' + cg + ',' + cbl + ')';
      ctx.beginPath();
      ctx.arc(ox + x * side, oy + y * side, p.rad * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // captions, crossfading with s
    var fs = Math.max(13, Math.min(19, side * 0.026));
    ctx.font = 'italic ' + fs + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = CAPTION;
    for (var k = 0; k < 4; k++) {
      var a = 1 - Math.abs(s - k);
      if (a <= 0) continue;
      ctx.globalAlpha = Math.min(1, a * 1.6);
      ctx.fillText(CAPTIONS[k], W / 2, H * 0.945);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- interaction: wheel / drag = scroll; double-tap = back to start ----------
  function clampS(v) { return v < 0 ? 0 : v > 3 ? 3 : v; }

  function onWheel(e) {
    userMode = true;
    var d = (e && e.deltaY) || 0;
    targetS = clampS(targetS + d * 0.0016);
    if (e && e.preventDefault) e.preventDefault();
  }

  var dragY = null, lastTap = 0;
  function onDown(e) {
    var y = (e && e.clientY != null) ? e.clientY : null;
    dragY = y;
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (now && now - lastTap < 320) { userMode = true; targetS = 0; }
    lastTap = now;
  }
  function onMove(e) {
    if (dragY == null) return;
    var y = (e && e.clientY != null) ? e.clientY : null;
    if (y == null) return;
    userMode = true;
    targetS = clampS(targetS + (dragY - y) / Math.max(120, H * 0.8) * 3);
    dragY = y;
  }
  function onUp() { dragY = null; }

  if (canvas.addEventListener) {
    canvas.addEventListener('wheel', onWheel);
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('dblclick', function () { userMode = true; targetS = 0; });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  var lastT = 0;
  draw(0);

  var startStamp = null;
  function frame(stamp) {
    if (startStamp === null) startStamp = stamp;
    var t = (stamp - startStamp) / 1000;
    lastT = t;
    if (userMode) {
      curS += (targetS - curS) * 0.12;
      if (Math.abs(targetS - curS) < 0.0005) curS = targetS;
    }
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
