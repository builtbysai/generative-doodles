<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№49 · Generation 65</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b0e; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,228,216,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to nudge them</div>
<script>
'use strict';
// No49 Generation 65 (after darien.brito, prompt 14 via Bug).
// Six blob creatures, each with a tiny genome: three limb phase
// offsets, a pulse rate, a body squish. They twitch, pulse and hop
// crawl. Every 10 seconds the generation ends: fitness is distance
// crawled, the champion (flat amber) reproduces with mutation, the
// rest re-seed. No faces, no eyes, no counter. Drag pushes a soft
// impulse through the cluster.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '49', 10) || 49;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ctx = canvas.getContext('2d');
const GROUND = '#0b0b0e', BONE = '#e8e4d8', CHAMP = '#e8a33d', GEN_LEN = 10;
let gen = 0, genStart = null, creatures = [];
function makeGenome(rng){ return { p: [rng() * 6.28, rng() * 6.28, rng() * 6.28], rate: 1.6 + rng() * 2.2, squish: 0.12 + rng() * 0.22, dir: rng() * 6.28, size: 0.8 + rng() * 0.5 }; }
function spawn(parent, rng, slot, w, h){
  const g = parent ? { p: parent.p.map(v => v + (rng() - 0.5) * 0.7), rate: Math.max(0.8, parent.rate + (rng() - 0.5) * 0.8), squish: Math.max(0.05, Math.min(0.4, parent.squish + (rng() - 0.5) * 0.1)), dir: parent.dir + (rng() - 0.5) * 1.2, size: Math.max(0.6, Math.min(1.4, parent.size + (rng() - 0.5) * 0.2)) } : makeGenome(rng);
  const ang = (slot / 6) * Math.PI * 2 + rng() * 0.6;
  return { g, x: 0.5 + Math.cos(ang) * 0.26, y: 0.5 + Math.sin(ang) * 0.26, vx: 0, vy: 0, dist: 0, phase: rng() * 6.28, lastSin: 0, champ: false };
}
function newGeneration(nowMs, w, h){
  const rng = mulberry32(seed * 104729 + gen * 1299709);
  let parent = null;
  if (creatures.length){
    creatures.sort((a, b) => b.dist - a.dist);
    parent = creatures[0].g;
  }
  creatures = [];
  for (let i = 0; i < 6; i++) creatures.push(spawn(i < 4 ? parent : null, rng, i, w, h));
  if (parent) creatures[0].champ = true;
  genStart = nowMs;
}
function drawFrame(nowMs){
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.fillStyle = GROUND; ctx.fillRect(0, 0, w, h);
  if (genStart === null || nowMs - genStart > GEN_LEN * 1000){ if (genStart !== null) gen++; newGeneration(nowMs, w, h); }
  const S = Math.min(w, h);
  const ox = isPhone() ? 0 : (w - S) / 2, oy = isPhone() ? (h - S) / 2 : (h - S) / 2;
  const fw = isPhone() ? w : S, fh = isPhone() ? h : S;
  const dt = 1 / 30;
  for (const c of creatures){
    c.phase += dt * c.g.rate * 2.2;
    const s = Math.sin(c.phase);
    if (c.lastSin <= 0 && s > 0){ // limb cycle zero crossing: hop
      c.vx += Math.cos(c.g.dir) * 0.010 * c.g.rate;
      c.vy += Math.sin(c.g.dir) * 0.010 * c.g.rate;
    }
    c.lastSin = s;
    c.g.dir += Math.sin(c.phase * 0.37 + c.g.p[0]) * 0.004;
    c.x += c.vx; c.y += c.vy;
    c.vx *= 0.90; c.vy *= 0.90;
    c.dist += Math.hypot(c.vx, c.vy);
    if (c.x < 0.08){ c.x = 0.08; c.g.dir = Math.PI - c.g.dir; }
    if (c.x > 0.92){ c.x = 0.92; c.g.dir = Math.PI - c.g.dir; }
    if (c.y < 0.08){ c.y = 0.08; c.g.dir = -c.g.dir; }
    if (c.y > 0.92){ c.y = 0.92; c.g.dir = -c.g.dir; }
    for (const o of creatures){ if (o !== c){ const dx = c.x - o.x, dy = c.y - o.y, d = Math.hypot(dx, dy); if (d > 0.001 && d < 0.13){ c.x += dx / d * 0.0012; c.y += dy / d * 0.0012; } } }
    const px = (isPhone() ? c.x * fw : ox + c.x * fw), py = (isPhone() ? c.y * fh : oy + c.y * fh);
    const R = (isPhone() ? h : S) * 0.040 * c.g.size;
    const sq = 1 + Math.sin(c.phase) * c.g.squish;
    ctx.strokeStyle = c.champ ? CHAMP : BONE;
    ctx.fillStyle = c.champ ? CHAMP : BONE;
    ctx.lineWidth = Math.max(2, R * 0.16); ctx.lineCap = 'round';
    for (let l = 0; l < 3; l++){
      const la = c.g.dir + (l / 3) * Math.PI * 2 + Math.sin(c.phase + c.g.p[l]) * 0.5;
      const lx = px + Math.cos(la) * R * 0.45, ly = py + Math.sin(la) * R * 0.45;
      const ex = px + Math.cos(la) * R * 1.5, ey = py + Math.sin(la) * R * 1.5;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(ex, ey); ctx.stroke();
    }
    ctx.beginPath();
    for (let k = 0; k <= 22; k++){
      const a = (k / 22) * Math.PI * 2;
      const rr = R * (1 + 0.16 * Math.sin(a * 3 + c.phase * 1.3)) ;
      const X = px + Math.cos(a) * rr * sq, Y = py + Math.sin(a) * rr / sq;
      if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.closePath(); ctx.fill();
  }
  return { gen };
}
function loop(nowMs){ drawFrame(nowMs); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); }
drawFrame(4500);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown', ev => {
  const [w, h] = viewportWH(); const S = Math.min(w, h);
  const fw = isPhone() ? w : S, fh = isPhone() ? h : S;
  const gx = ev.clientX / fw, gy = ev.clientY / fh;
  for (const c of creatures){ const dx = c.x - gx, dy = c.y - gy, d = Math.hypot(dx, dy); if (d < 0.45){ c.vx += (dx / (d + 0.05)) * 0.02; c.vy += (dy / (d + 0.05)) * 0.02; } }
});
canvas.addEventListener('pointermove', ev => {});
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
