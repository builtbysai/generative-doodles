<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distilled Moment</title>
<style>
  html, body { margin: 0; padding: 0; background: #0E0C09; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function size() {
    var vw = (typeof visualViewport !== 'undefined' && visualViewport)
      ? visualViewport.width : window.innerWidth;
    var vh = (typeof visualViewport !== 'undefined' && visualViewport)
      ? visualViewport.height : window.innerHeight;
    W = Math.max(1, Math.round(vw));
    H = Math.max(1, Math.round(vh));
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function ellipse(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function arcStroke(x, y, r, a0, a1, lw, color) {
    ctx.beginPath();
    ctx.moveTo(x + r * Math.cos(a0), y + r * Math.sin(a0));
    ctx.arc(x, y, r, a0, a1);
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.stroke();
  }

  /* One archival fragment: the back of a shoulder, a curve of hair
     dissolving into static blur. Abstract geometry only: never a face,
     never a body, always at the edge of recognition. The shoulder reads
     as one smooth hill curve; the hair as a dark swirl mass riding its
     crest. At low focus both dissolve into faint wide bands. */
  function shoulderPath(cx, cy, R) {
    ctx.beginPath();
    ctx.moveTo(cx - R, cy + R * 0.55);
    ctx.quadraticCurveTo(cx, cy - R * 0.95, cx + R, cy + R * 0.55);
  }
  function fragment(cx, cy, R, focus) {
    var i, a, x, y;
    /* Soft body wash beneath the curve. */
    ctx.fillStyle = 'rgba(138,132,120,' + (0.10 + 0.06 * (1 - focus)).toFixed(3) + ')';
    ellipse(cx, cy + R * 0.35, R * 0.88, R * 0.52, 0);
    /* Blur band: the same curve stroked wide and faint. */
    shoulderPath(cx, cy, R);
    ctx.strokeStyle = 'rgba(138,132,120,' + (0.05 + 0.10 * (1 - focus)).toFixed(3) + ')';
    ctx.lineWidth = R * 0.30;
    ctx.stroke();
    /* Hair mass: dark ellipses clustered along the crest. */
    ctx.fillStyle = 'rgba(62,58,51,' + (0.42 + 0.18 * (1 - focus)).toFixed(3) + ')';
    for (i = 0; i < 6; i++) {
      a = -0.5 + i * 0.34;
      x = cx + Math.cos(a) * R * 0.42;
      y = cy - R * 0.28 + Math.sin(a) * R * 0.30;
      ellipse(x, y, R * 0.26, R * 0.17, a * 0.4);
    }
    /* Hair strands: short arcs fanning off the crest, visible only as
       focus sharpens, never resolving into anything legible. */
    if (focus > 0.15) {
      for (i = 0; i < 7; i++) {
        a = Math.PI * 1.15 + i * 0.16;
        arcStroke(cx + R * 0.1, cy - R * 0.30, R * (0.30 + i * 0.045),
          a, a + 0.7, Math.max(1, R * 0.012),
          'rgba(216,212,200,' + (0.45 * focus).toFixed(3) + ')');
      }
    }
    /* Shoulder curve: the one line that almost resolves. */
    shoulderPath(cx, cy, R);
    ctx.strokeStyle = 'rgba(216,212,200,' + (0.08 + 0.62 * focus).toFixed(3) + ')';
    ctx.lineWidth = Math.max(2, R * 0.05);
    ctx.stroke();
    shoulderPath(cx, cy + R * 0.18, R * 0.82);
    ctx.strokeStyle = 'rgba(138,132,120,' + (0.12 + 0.40 * focus).toFixed(3) + ')';
    ctx.lineWidth = Math.max(1.5, R * 0.025);
    ctx.stroke();
  }

  /* Film grain: a closed-form seeded function of the quantized time
     index, never per-frame Math.random, so every frame is reproducible. */
  function grain(t, x0, x1, fieldH) {
    var step = Math.floor(t * 12);
    var rnd = mulberry32(1318000 + step * 7919 + Math.round(x0));
    var n = Math.round((x1 - x0) * fieldH / 2600);
    var i, gx, gy;
    ctx.fillStyle = 'rgba(216,212,200,0.055)';
    for (i = 0; i < n; i++) {
      gx = x0 + rnd() * (x1 - x0);
      gy = rnd() * fieldH;
      ctx.fillRect(gx, gy, 1.5, 1.5);
    }
  }

  function pad2(v) { return (v < 10 ? '0' : '') + v; }

  function draw(t) {
    size();
    var stripH = Math.max(18, Math.round(H * 0.08));
    var fieldH = H - stripH;
    var mid = Math.floor(W / 2);
    var base = Math.min(W, fieldH);

    /* Ground. */
    ctx.fillStyle = '#0E0C09';
    ctx.fillRect(0, 0, W, H);

    /* LEFT channel: still, wider fragment, faint grain crawl. */
    fragment(mid * 0.5, fieldH * 0.5, Math.min(base * 0.44, mid * 0.42), 0.12);
    grain(t, 0, mid - 1, fieldH);

    /* Divider, 2px. */
    ctx.fillStyle = 'rgba(216,212,200,0.35)';
    ctx.fillRect(mid - 1, 0, 2, fieldH);

    /* RIGHT channel: tighter fragment, 20 s focus breath.
       focus 0 at t=0 (blur), 1 at t=10 (near-sharp), 0 at t=20. */
    var phase = (t % 20) / 20;
    var focus = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
    fragment(mid + mid * 0.5, fieldH * 0.5, Math.min(base * 0.30, mid * 0.34), focus);
    grain(t, mid + 1, W, fieldH);

    /* Caption strip: archive viewing log, verbatim from the prompt.
       The timer starts at 72:00:00 at load and advances with piece
       time, so frame one is always the zero state. */
    ctx.fillStyle = '#1A1712';
    ctx.fillRect(0, fieldH, W, stripH);
    var total = 72 * 3600 + Math.floor(t);
    var hh = Math.floor(total / 3600);
    var mm = Math.floor((total % 3600) / 60);
    var ss = total % 60;
    var label = hh + ':' + pad2(mm) + ':' + pad2(ss) +
      ' \u2014 viewing the civil rights era archive.';
    ctx.fillStyle = '#B9B2A4';
    ctx.textBaseline = 'middle';
    /* Shrink the log line until it fits the strip on any width, so the
       verbatim caption is never clipped on phones. */
    var fs = Math.max(11, Math.round(stripH * 0.34));
    var margin = Math.max(10, W * 0.02);
    ctx.font = fs + 'px monospace';
    while (fs > 8 && ctx.measureText(label).width > W - margin * 2) {
      fs -= 1;
      ctx.font = fs + 'px monospace';
    }
    ctx.fillText(label, margin, fieldH + stripH / 2);
  }

  /* Boot flag: frame one is exactly t=0; the clock starts with the
     rAF loop. Plain function declaration so no ReferenceError. */
  draw(0);
  var start = null;
  function loop(ts) {
    if (start === null) { start = ts; }
    draw((ts - start) / 1000);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
