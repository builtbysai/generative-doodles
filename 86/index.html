<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№86 · Ten Print Field</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFFFFF; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(17,17,17,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to clear a path</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.86 Ten Print Field: seeded PRNG "Ten Print Field", grid 24 cols, loop sweep 45s
const COLS=24;
let cells=[], healUntil=[], rowsNow=24, dragPt=null, dragging=false;
function cellVal(c,r,cyc){ const rnd=mulberry(hashStr('TenPrint'+cyc+':'+c+','+r)); return rnd()<0.5?0:1; }
function buildGrid(rows,cyc){ rowsNow=rows; cells=[]; healUntil=[]; for(let r=0;r<rows;r++){ for(let c=0;c<COLS;c++){ cells.push(cellVal(c,r,cyc)); healUntil.push(-1); } } }
buildGrid(24,0);
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h); const t=nowMs/1000;
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,w,h);
  const phone=isPhone();
  let ox=0, oy=0, dw=w, dh=h;
  if(!phone){ const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; dw=S; dh=S; }
  const rows=phone? Math.max(24, Math.round(COLS*dh/dw)) : 24;
  const cyc=Math.floor(t/45);
  if(rows!==rowsNow||cells.length!==COLS*rows) buildGrid(rows,cyc);
  // sweep reseeds: recompute values for current cycle blend
  const sweepP=((t%45)/45)*(COLS+rows);
  const cell=dw/COLS, cellH=dh/rows;
  ctx.strokeStyle='#111111'; ctx.lineWidth=Math.min(cell,cellH)/6; ctx.lineCap='round';
  for(let r=0;r<rows;r++){
    for(let c=0;c<COLS;c++){
      const idx=r*COLS+c;
      let v=cells[idx];
      // sweep: cells behind sweep line take next cycle value
      if((c+r) < sweepP) v=cellVal(c,r,cyc+ (sweepP>0?0:0) + Math.floor(t/45));
      if((c+r) < sweepP && ((t%45)>0.2)) v=cellVal(c,r,Math.floor(t/45)+1);
      let healed = healUntil[idx]>t;
      const x0=ox+c*cell, y0=oy+r*cellH, x1=x0+cell, y1=y0+cellH, pad=Math.min(cell,cellH)*0.08;
      ctx.beginPath();
      if(healed){ ctx.moveTo(x0+pad,y0+cellH/2); ctx.lineTo(x1-pad,y0+cellH/2); }
      else if(v===0){ ctx.moveTo(x0+pad,y0+pad); ctx.lineTo(x1-pad,y1-pad); }
      else { ctx.moveTo(x1-pad,y0+pad); ctx.lineTo(x0+pad,y1-pad); }
      ctx.stroke();
    }
  }
  if(dragging&&dragPt){
    const cc=Math.floor((dragPt[0]-ox)/cell), rr=Math.floor((dragPt[1]-oy)/cellH);
    for(let r=rr-2;r<=rr+2;r++) for(let c=cc-2;c<=cc+2;c++){ if(r>=0&&r<rows&&c>=0&&c<COLS){ const d=Math.hypot(c-cc,r-rr); if(d<2.2) healUntil[r*COLS+c]=t+2.5; } }
  }
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; dragPt=[e.clientX,e.clientY]; });
canvas.addEventListener('pointermove',e=>{ if(dragging) dragPt=[e.clientX,e.clientY]; });
function endP(){ dragging=false; dragPt=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(7000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
