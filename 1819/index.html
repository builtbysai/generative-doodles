<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive Carousel</title>
<style>
html, body { margin: 0; padding: 0; background: #14100C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#14100C';
var SHELF = '#1E1710';
var SHELF_LINE = '#3A2E1E';
var SEPIA = '#8A6D3B';
var SEPIA_LIGHT = '#B99B62';
var SEPIA_DARK = '#5C4622';
var CREAM = '#F2E8D5';
var CREAM_DIM = '#D8C9A8';
var RED = '#A93226';
var RED_DEEP = '#7E241B';
var INK = '#14100C';
var HINT_INK = '#E8D9B8';
var FRAME_T = 60;          /* fixed phase: 60 s into the cycle, first frame reproducible */
var ROT0 = 0.42;           /* fixed starting rotation for the first frame */
var AUTO_TURN = 0.03;      /* slow carousel turn, radians per second */
var N_OBJECTS = 77;
var N_VARIATIONS = 28;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var rotAngle = ROT0;
var dragVel = 0;           /* radians per second, from the last drag */
var dragging = false;
var turns = 0;             /* completed full rotations plus settled drags */
var variation = 0;         /* turns mod 28: the current catalogued arrangement */
var lastTurnMark = Math.floor(rotAngle / TAU);
var settledPending = false;
/* ---- the catalogue: 77 objects, numbers 1 to 77, kind fixed per number ----
   kind cycle: book, letter, photograph, pamphlet. Texture shade is a fixed
   function of the catalog number, never of the clock. ---- */
var KINDS = ['book', 'letter', 'photo', 'pamphlet'];
var OBJECTS = [];
(function () {
  var i, r;
  for (i = 0; i < N_OBJECTS; i++) {
    r = mulberry32(1819 * 1000 + i + 1);
    OBJECTS.push({
      num: i + 1,
      kind: KINDS[i % 4],
      shade: 0.75 + r() * 0.5,
      tilt: (r() - 0.5) * 0.10,
      band: r()
    });
  }
})();
/* slotOrder[slot] = index into OBJECTS. A variation is one deterministic
   shuffle of the 77 objects around the 77 ring slots, seeded by the
   rotation count, so every arrangement is catalogued, never random. */
var slotOrder = [];
function reseed(v) {
  var r = mulberry32(1819 * 7919 + v * 104729);
  var idx = [], i, j, tmp;
  for (i = 0; i < N_OBJECTS; i++) idx.push(i);
  for (i = idx.length - 1; i > 0; i--) {
    j = Math.floor(r() * (i + 1));
    tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
  }
  slotOrder = idx;
}
reseed(0);
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function ring() {
  var rx = VW * 0.42;
  var ry = rx * 0.30;
  return { rx: rx, ry: ry, cx: VW / 2, cy: VH * 0.52 };
}
function ringPerimeter(rx, ry) {
  return Math.PI * (3 * (rx + ry) - Math.sqrt((3 * rx + ry) * (rx + 3 * ry)));
}
function applyTurn(dTheta) {
  rotAngle += dTheta;
  var mark = Math.floor(rotAngle / TAU);
  if (mark !== lastTurnMark) {
    /* a full rotation completed: the next arrangement is catalogued in */
    turns += (mark - lastTurnMark);
    lastTurnMark = mark;
    variation = ((turns % N_VARIATIONS) + N_VARIATIONS) % N_VARIATIONS;
    reseed(variation);
  }
}
function settle() {
  /* rotation has come to rest: the arrangement re-seeds into the next
     of the twenty-eight catalogued variations */
  turns += 1;
  variation = turns % N_VARIATIONS;
  reseed(variation);
  settledPending = false;
  dragVel = 0;
}
function dragBy(dx) {
  var r = ring();
  var dTheta = dx / Math.max(r.rx, 1);
  applyTurn(dTheta);
  dragVel = dTheta * 60;
  settledPending = true;
}
function drawShelf() {
  var i, x, y, w, h;
  /* dark archive shelving fading out at the left and right edges */
  ctx.fillStyle = SHELF;
  ctx.fillRect(0, 0, VW * 0.10, VH);
  ctx.fillRect(VW * 0.90, 0, VW * 0.10, VH);
  var fadeL = ctx.createLinearGradient(0, 0, VW * 0.16, 0);
  fadeL.addColorStop(0, rgba(GROUND, 0.9));
  fadeL.addColorStop(1, rgba(GROUND, 0));
  ctx.fillStyle = fadeL;
  ctx.fillRect(VW * 0.10, 0, VW * 0.06, VH);
  var fadeR = ctx.createLinearGradient(VW, 0, VW * 0.84, 0);
  fadeR.addColorStop(0, rgba(GROUND, 0.9));
  fadeR.addColorStop(1, rgba(GROUND, 0));
  ctx.fillStyle = fadeR;
  ctx.fillRect(VW * 0.84, 0, VW * 0.06, VH);
  /* shelf boards and dim spine silhouettes, low alpha, no readable text */
  ctx.strokeStyle = rgba(SHELF_LINE, 0.8);
  ctx.lineWidth = 1;
  var rows = 5;
  for (i = 0; i <= rows; i++) {
    y = VH * (0.08 + i * 0.18);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(VW * 0.10, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(VW * 0.90, y);
    ctx.lineTo(VW, y);
    ctx.stroke();
  }
  var r2 = mulberry32(77);
  for (i = 0; i < 26; i++) {
    var side = i % 2 === 0 ? 0 : 1;
    x = side === 0 ? r2() * VW * 0.085 : VW * 0.915 + r2() * VW * 0.085;
    w = 3 + r2() * 5;
    h = VH * (0.05 + r2() * 0.09);
    y = VH * (0.10 + Math.floor(r2() * 5) * 0.18) - h;
    ctx.fillStyle = rgba(r2() > 0.5 ? SEPIA_DARK : SHELF_LINE, 0.55);
    ctx.fillRect(x, y, w, h);
  }
  /* warm museum light pooled over the carousel */
  var rg = ring();
  var wash = ctx.createRadialGradient(rg.cx, rg.cy, 0, rg.cx, rg.cy, Math.max(rg.rx, rg.ry) * 1.7);
  wash.addColorStop(0, rgba(SEPIA_LIGHT, 0.14));
  wash.addColorStop(0.6, rgba(SEPIA_LIGHT, 0.04));
  wash.addColorStop(1, rgba(SEPIA_LIGHT, 0));
  ctx.fillStyle = wash;
  ctx.fillRect(0, 0, VW, VH);
}
function drawObject(obj, x, y, w, h, depth, rot) {
  var shade = obj.shade;
  var body = shade > 1.0 ? SEPIA_LIGHT : (shade > 0.85 ? SEPIA : SEPIA_DARK);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot + obj.tilt);
  /* soft shadow pool on the ring */
  ctx.fillStyle = rgba(INK, 0.35 + 0.25 * depth);
  ctx.beginPath();
  ctx.ellipse(0, h * 0.55, w * 0.62, h * 0.10, 0, 0, TAU);
  ctx.fill();
  ctx.lineWidth = Math.max(w * 0.06, 0.7);
  if (obj.kind === 'book') {
    ctx.fillStyle = body;
    ctx.strokeStyle = rgba(CREAM_DIM, 0.7);
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.fillStyle = rgba(CREAM, 0.85);
    ctx.fillRect(w / 2 - w * 0.16, -h / 2 + 1, w * 0.16, h - 2);
    ctx.strokeStyle = rgba(RED, 0.85);
    ctx.lineWidth = Math.max(w * 0.07, 0.7);
    ctx.beginPath();
    ctx.moveTo(-w * 0.28, -h * 0.18);
    ctx.lineTo(w * 0.28, -h * 0.18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-w * 0.28, h * 0.12);
    ctx.lineTo(w * 0.28, h * 0.12);
    ctx.stroke();
  } else if (obj.kind === 'letter') {
    ctx.fillStyle = CREAM_DIM;
    ctx.strokeStyle = rgba(SEPIA_DARK, 0.9);
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.beginPath();
    ctx.moveTo(-w / 2, -h / 2);
    ctx.lineTo(0, h * 0.10);
    ctx.lineTo(w / 2, -h / 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-w / 2, h / 2);
    ctx.lineTo(0, -h * 0.05);
    ctx.lineTo(w / 2, h / 2);
    ctx.stroke();
    ctx.fillStyle = RED;
    ctx.beginPath();
    ctx.arc(w * 0.18, -h * 0.02, Math.max(w * 0.09, 1), 0, TAU);
    ctx.fill();
  } else if (obj.kind === 'photo') {
    ctx.fillStyle = CREAM;
    ctx.strokeStyle = rgba(SEPIA_DARK, 0.9);
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.fillStyle = rgba(SEPIA, 0.55 + 0.25 * (shade - 0.75));
    ctx.fillRect(-w * 0.32, -h * 0.32, w * 0.64, h * 0.64);
    ctx.fillStyle = rgba(SEPIA_DARK, 0.8);
    ctx.beginPath();
    ctx.arc(-w * 0.08, -h * 0.05, Math.max(w * 0.10, 1), 0, TAU);
    ctx.fill();
    ctx.fillRect(-w * 0.28, h * 0.18, w * 0.56, h * 0.06);
  } else {
    ctx.fillStyle = body;
    ctx.strokeStyle = rgba(CREAM_DIM, 0.7);
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.strokeStyle = rgba(CREAM, 0.75);
    ctx.lineWidth = Math.max(w * 0.05, 0.6);
    var k;
    for (k = 0; k < 3; k++) {
      ctx.beginPath();
      ctx.moveTo(-w * 0.30, -h * 0.22 + k * h * 0.22);
      ctx.lineTo(w * 0.30, -h * 0.22 + k * h * 0.22);
      ctx.stroke();
    }
    ctx.fillStyle = RED;
    ctx.fillRect(-w * 0.30, -h * 0.38, w * 0.22, h * 0.10);
  }
  /* the numbered catalog card: small, cream, red number, 1 to 77 */
  var cw = Math.max(w * 0.62, 8);
  var ch = Math.max(h * 0.30, 6);
  var cardY = h / 2 + ch / 2 + 1;
  ctx.fillStyle = CREAM;
  ctx.fillRect(-cw / 2, cardY - ch / 2, cw, ch);
  ctx.strokeStyle = rgba(SEPIA_DARK, 0.9);
  ctx.lineWidth = 0.6;
  ctx.strokeRect(-cw / 2, cardY - ch / 2, cw, ch);
  ctx.fillStyle = RED;
  ctx.font = 'bold ' + Math.max(Math.floor(ch * 0.72), 5) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(obj.num), 0, cardY + 0.5);
  ctx.restore();
}
function drawCarousel() {
  var r = ring();
  var per = ringPerimeter(r.rx, r.ry);
  var spacing = per / N_OBJECTS;
  var i, a, depth, x, y, sc, w, h;
  var items = [];
  for (i = 0; i < N_OBJECTS; i++) {
    a = rotAngle + i * TAU / N_OBJECTS;
    depth = Math.sin(a); /* -1 back of the ring, +1 front */
    x = r.cx + Math.cos(a) * r.rx;
    y = r.cy + depth * r.ry;
    sc = 0.62 + 0.38 * (depth * 0.5 + 0.5);
    w = spacing * 0.92 * sc;
    h = w * 1.35;
    items.push({ obj: OBJECTS[slotOrder[i]], x: x, y: y, w: w, h: h, depth: depth, rot: Math.cos(a) * 0.12 });
  }
  /* the ring track itself */
  ctx.strokeStyle = rgba(SEPIA, 0.55);
  ctx.lineWidth = Math.max(VW * 0.004, 1.5);
  ctx.beginPath();
  ctx.ellipse(r.cx, r.cy, r.rx, r.ry, 0, 0, TAU);
  ctx.stroke();
  ctx.strokeStyle = rgba(SEPIA_DARK, 0.8);
  ctx.lineWidth = Math.max(VW * 0.002, 1);
  ctx.beginPath();
  ctx.ellipse(r.cx, r.cy + Math.max(VW * 0.006, 3), r.rx * 0.98, r.ry * 0.98, 0, 0, TAU);
  ctx.stroke();
  /* back half first, then front half, so near objects overlap far ones */
  items.sort(function (p, q) { return p.depth - q.depth; });
  for (i = 0; i < items.length; i++) {
    var it = items[i];
    drawObject(it.obj, it.x, it.y, it.w, it.h, it.depth * 0.5 + 0.5, it.rot);
  }
  /* hub: the catalogued center post */
  ctx.fillStyle = SEPIA_DARK;
  ctx.beginPath();
  ctx.arc(r.cx, r.cy, Math.max(VW * 0.012, 4), 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(SEPIA_LIGHT, 0.9);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(r.cx, r.cy, Math.max(VW * 0.012, 4), 0, TAU);
  ctx.stroke();
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.arc(r.cx, r.cy, Math.max(VW * 0.005, 2), 0, TAU);
  ctx.fill();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Archive Carousel').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Archive Carousel').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 04').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = SHELF;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(SEPIA, 0.8);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = CREAM;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Archive Carousel', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 04', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to turn the carousel.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = SHELF;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(SEPIA, 0.8);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawShelf();
  drawCarousel();
  drawPlates();
}
/* ---- drag: rotation by hand; settling re-seeds the arrangement ---- */
var lastX = 0;
function onDown(e) {
  dragging = true;
  dragVel = 0;
  lastX = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
}
function onMove(e) {
  if (!dragging) return;
  var x = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  var dx = x - lastX;
  lastX = x;
  dragBy(dx);
}
function onUp() {
  if (!dragging) return;
  dragging = false;
}
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown);
  canvas.addEventListener('touchmove', onMove);
  canvas.addEventListener('touchend', onUp);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    rotation: function () { return rotAngle; },
    variation: function () { return variation; },
    turns: function () { return turns; },
    objects: function () { return N_OBJECTS; },
    variations: function () { return N_VARIATIONS; },
    slotOrder: function () { return slotOrder.slice(); },
    drag: function (dx) { dragBy(dx); draw(); },
    settle: function () { settle(); draw(); }
  };
}
/* ---- frame one: fixed phase t = 60 s, rotation 0.42 rad, variation 0 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      if (!dragging) {
        if (Math.abs(dragVel) > 0.001) {
          applyTurn(dragVel * dt);
          dragVel *= Math.pow(0.12, dt);
          if (Math.abs(dragVel) <= 0.001 && settledPending) settle();
        } else {
          if (settledPending) settle();
          applyTurn(AUTO_TURN * dt);
        }
      }
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
