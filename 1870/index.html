<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Left-Handed Mirror</title>
<style>
html, body { margin: 0; padding: 0; background: #1B140E; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: one melodic line with two handednesses; the felt phenomenon is
   a reflection that has its own ideas, and the seam is a balance you hold
   in your hand. A guitar figure walks its fingers along a fretboard; its
   mirror twin does the same in reverse, but the mirror side's notes bend
   differently. Dragging the gold seam grows or shrinks the mirrored
   territory and rebalances the music between the two handednesses. */
var TAU = Math.PI * 2;
var GROUND_WARM = '#241A12';
var FIELD_WARM = '#2E2115';
var GROUND_COOL = '#12181F';
var FIELD_COOL = '#18222C';
var BOARD_WARM = '#7A5233';
var BOARD_COOL = '#3C4E63';
var FRET_WARM = '#C9A06A';
var FRET_COOL = '#8FA8C0';
var STRING_WARM = '#E8DCC8';
var STRING_COOL = '#C8D6E2';
var SKIN_WARM = '#C89B7B';
var SKIN_COOL = '#A9BCCB';
var LAMP_WARM = '#E8B96A';
var LAMP_COOL = '#8FB4D4';
var SEAM = '#D4A94E';
var PLATE = '#161310';
var PLATE_LINE = 'rgba(237,227,210,0.22)';
var TITLE_INK = '#EDE3D2';
var HINT_INK = '#B0A693';
var LABEL_WARM = '#D9B98A';
var LABEL_COOL = '#9DB8CC';
var FRAME_T = 10.0;       /* fixed phase: note 3 of 8 sounding, finger mid walk */
var NOTE_LEN = 4.0;       /* seconds per note */
var MELODY = [0, 3, 5, 7, 10, 7, 5, 3];   /* semitones above A3, one line */
var FRETS = [3, 5, 7, 8, 10, 8, 7, 5];    /* fret walked for each note */
var LOOP_LEN = NOTE_LEN * 8;              /* 32 s loop */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;

}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var seamFrac = 0.5;       /* 0.12 to 0.88, drag earned */
var dragging = false;
/* seeded dust: faint room dust on both halves */
var DUST = (function () {
  var rng = mulberry32(1870), out = [], i;
  for (i = 0; i < 60; i++) {
    out.push({ x: rng(), y: rng(), r: 0.5 + rng() * 1.1, a: 0.03 + rng() * 0.06 });
  }
  return out;
})();
/* ---- audio: lazy, created only inside the first drag gesture ---- */
var AC = null, masterGain = null, normalGain = null, mirrorGain = null;
var normalPan = null, mirrorPan = null, lastNoteIdx = -1;
function initAudio() {

  try {

    if (!Ctor) return;
    AC = new Ctor();
    masterGain = AC.createGain(); masterGain.gain.value = 0.5;
    masterGain.connect(AC.destination);
    normalPan = AC.createStereoPanner ? AC.createStereoPanner() : null;
    mirrorPan = AC.createStereoPanner ? AC.createStereoPanner() : null;
    normalGain = AC.createGain(); mirrorGain = AC.createGain();
    if (normalPan) { normalPan.pan.value = -0.6; normalGain.connect(normalPan); normalPan.connect(masterGain); }

    if (mirrorPan) { mirrorPan.pan.value = 0.6; mirrorGain.connect(mirrorPan); mirrorPan.connect(masterGain); }

    mirrorGain.gain.setTargetAtTime(m, AC.currentTime, 0.1);

    o.type = 'sine';
    o.frequency.setValueAtTime(mirrorFreq * 0.97, now);
    o.frequency.linearRampToValueAtTime(mirrorFreq * 1.06, now + 1.4);
    o.frequency.linearRampToValueAtTime(mirrorFreq, now + 3.0);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.4, now + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 3.4);

function size() {
  var vw = 0, vh = 0;

    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {

}
/* Field-like composition: full-bleed on phones, a centered square on desktop. */
function fieldRect() {

}
function seamX(sc) { return sc.x + seamFrac * sc.w; }
/* fret n position along the board, nut at 0, bridge at 1 (geometric spacing) */
function fretPos(n) { return 1 - Math.pow(2, -n / 12); }
/* melodic state at time t: note index, phase within the note, finger fret */
function melodic(t) {
  var idx = Math.floor(t / NOTE_LEN) % 8;
  var p = (t % NOTE_LEN) / NOTE_LEN;
  var prev = FRETS[(idx + 7) % 8], cur = FRETS[idx];
  var walk = smooth(clamp(p / 0.45, 0, 1));   /* finger walks in the first half of the note */

function drawBoardHalf(sc, cy, bh, warm, clipL, clipR) {
  var bx = sc.x + sc.w * 0.06, bw = sc.w * 0.88;
  var top = cy - bh / 2, bot = cy + bh / 2;
  ctx.save();
  ctx.beginPath(); ctx.rect(clipL, sc.y, clipR - clipL, sc.h); ctx.clip();
  ctx.fillStyle = warm ? BOARD_WARM : BOARD_COOL;
  ctx.fillRect(bx, top, bw, bh);
  /* lamp glow from the upper corner of this half */
  var gx = warm ? bx + bw * 0.12 : bx + bw * 0.88;
  var g = ctx.createRadialGradient(gx, top - bh * 0.2, 4, gx, top - bh * 0.2, bw * 0.55);
  g.addColorStop(0, rgba(warm ? LAMP_WARM : LAMP_COOL, 0.28));
  g.addColorStop(1, rgba(warm ? LAMP_WARM : LAMP_COOL, 0));
  ctx.fillStyle = g;
  ctx.fillRect(bx, top, bw, bh);

  var i, fx;
  ctx.lineWidth = Math.max(1, bh * 0.012);
  for (i = 1; i <= 12; i++) {
    var f = warm ? fretPos(i) : 1 - fretPos(i);
    fx = bx + f * bw;
    ctx.strokeStyle = rgba(warm ? FRET_WARM : FRET_COOL, 0.75);
    ctx.beginPath(); ctx.moveTo(fx, top); ctx.lineTo(fx, bot); ctx.stroke();
  }
  /* nut and bridge */
  ctx.lineWidth = Math.max(2, bh * 0.02);
  ctx.strokeStyle = warm ? STRING_WARM : STRING_COOL;
  ctx.beginPath(); ctx.moveTo(bx + (warm ? 0 : bw), top); ctx.lineTo(bx + (warm ? 0 : bw), bot); ctx.stroke();
  ctx.restore();
}
function drawStrings(sc, cy, bh, m, warm, clipL, clipR, bendAmt) {
  var bx = sc.x + sc.w * 0.06, bw = sc.w * 0.88;
  var top = cy - bh / 2, bot = cy + bh / 2;
  var s, y, x0, x1;
  ctx.save();
  ctx.beginPath(); ctx.rect(clipL, sc.y, clipR - clipL, sc.h); ctx.clip();
  for (s = 0; s < 6; s++) {
    /* string order reversed on the mirror side */
    var order = warm ? s : 5 - s;
    y = top + bh * (0.12 + order * 0.152);
    x0 = bx; x1 = bx + bw;
    var vib = 0;
    if (s === m.idx % 6) vib = 1.6 * Math.sin(m.p * TAU * 2) * (1 - m.p);

      ctx.strokeStyle = rgba(STRING_WARM, 0.85);
      ctx.lineWidth = Math.max(1, bh * 0.008);
      ctx.beginPath(); ctx.moveTo(x0, y);
      ctx.lineTo(x1, y + vib);
      ctx.stroke();
    } else {
      /* mirrored string bends at the sounding note instead of vibrating */
      var noteX = bx + fretPos(m.cur) * bw;
      var bend = bendAmt * Math.sin(Math.PI * clamp(m.p, 0, 1));
      ctx.strokeStyle = rgba(STRING_COOL, 0.85);
      ctx.lineWidth = Math.max(1, bh * 0.008);

function drawNoteDots(sc, cy, bh, m, warm, clipL, clipR) {
  var bx = sc.x + sc.w * 0.06, bw = sc.w * 0.88;
  var top = cy - bh / 2;
  ctx.save();
  ctx.beginPath(); ctx.rect(clipL, sc.y, clipR - clipL, sc.h); ctx.clip();
  var s = m.idx % 6;
  var order = warm ? s : 5 - s;
  var y = top + bh * (0.12 + order * 0.152);
  var fx = bx + (warm ? fretPos(m.fret) : 1 - fretPos(m.fret)) * bw;

  var r = Math.max(3, bh * 0.045);

  g.addColorStop(0, rgba(warm ? LAMP_WARM : LAMP_COOL, glow));
  g.addColorStop(1, rgba(warm ? LAMP_WARM : LAMP_COOL, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(fx + r * 3, y); ctx.arc(fx, y, r * 3, 0, TAU); ctx.fill();

function drawHand(sc, cy, bh, m, warm, clipL, clipR) {

  while (titlePx > 9 && ctx.measureText('Left-Handed Mirror').width > VW - 60) {

    ctx.font = 'bold ' + titlePx + 'px monospace';

  ctx.font = smallPx + 'px monospace';

  var plateH = titlePx + smallPx + 20;

  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);

/* ---- drag the seam: pointer events, audio only inside this gesture ---- */

      phaseT = (FRAME_T + clockT) % LOOP_LEN;

      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
