<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Assembly Before the Solo</title>
<style>
  html, body { margin: 0; padding: 0; background: #221e20; overflow: hidden; }
  canvas { display: block; position: fixed; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: only these five colors.
  var FIELD = '#221e20';
  var SEATED = '#8a7a6a';
  var CENTER = '#c98f3d';
  var RIPPLE = '#e0d6c0';
  var GROUND = '#3a3238';

  var LOOP = 120;
  var EXCHANGE_AT = 100;
  var N_SEATS = 24;
  var SEED = 1526000;
  var GESTURES = [5, 15, 25, 35, 45, 55, 65, 75, 85, 95];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function seededNextSeat(loopIndex) {
    var r = mulberry32(SEED + loopIndex * 1000003);
    return Math.floor(r() * N_SEATS);
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smoothstep(a, b, x) {
    var t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function wrapPi(a) {
    while (a > Math.PI) a -= 2 * Math.PI;
    while (a < -Math.PI) a += 2 * Math.PI;
    return a;
  }
  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  var SEATED_RGB = hexRgb(SEATED);
  var CENTER_RGB = hexRgb(CENTER);
  function mixColor(u) {
    // u = 1 is the soloist color, u = 0 the seated color. Blend of the two specced colors only.
    var r = Math.round(SEATED_RGB[0] + (CENTER_RGB[0] - SEATED_RGB[0]) * u);
    var g = Math.round(SEATED_RGB[1] + (CENTER_RGB[1] - SEATED_RGB[1]) * u);
    var b = Math.round(SEATED_RGB[2] + (CENTER_RGB[2] - SEATED_RGB[2]) * u);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function roundAlpha(a) {
    return Math.round(a * 10000) / 10000;
  }

  var W = 720, H = 720;
  var isPhone = false;
  function size() {
    var w = 720, h = 720;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth) {
      w = window.innerWidth; h = window.innerHeight;
    }
    if (typeof window !== 'undefined' && window.screen) {
      var minScreen = Math.min(window.screen.width, window.screen.height);
      isPhone = minScreen < 700;
      if (!isPhone && h > w * 1.15) isPhone = true;
    }
    W = w; H = h;
    canvas.width = Math.round(w);
    canvas.height = Math.round(h);
    canvas.style.width = Math.round(w) + 'px';
    canvas.style.height = Math.round(h) + 'px';
  }
  size();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', size);
    }
    if (window.addEventListener) {
      window.addEventListener('resize', size);
    }
  }

  // Drag state: closed-form functions of recorded sessions, never frame-integrated.
  var centerSessions = []; // {start, end} in absolute seconds; end null while held
  var centerActive = null;
  var override = null; // {loop, seat}
  var lastSoloPos = { x: 0, y: 0 };
  var lastSeatPos = [];

  function exchangeStartForLoop(loopIndex, sessions) {
    var lo = loopIndex * LOOP, hi = (loopIndex + 1) * LOOP;
    var E = EXCHANGE_AT;
    var clipped = [];
    for (var i = 0; i < sessions.length; i++) {
      var s = sessions[i].start, e = sessions[i].end;
      if (e === null) e = lo + LOOP; // a hold still open counts to the loop end for capping
      var cs = Math.max(s, lo), ce = Math.min(e, hi);
      if (ce > cs) clipped.push({ s: cs - lo, e: ce - lo });
    }
    clipped.sort(function (a, b) { return a.s - b.s; });
    for (var j = 0; j < clipped.length; j++) {
      var s2 = clipped[j].s, e2 = clipped[j].e;
      if (s2 < E) {
        if (e2 <= E) E = E + (e2 - s2);
        else E = e2 + (E - s2);
      }
    }
    if (E > 116) E = 116;
    return E;
  }
  function risingSeatForLoop(loopIndex, sessions, ovr) {
    if (ovr && ovr.loop === loopIndex) return ovr.seat;
    return seededNextSeat(loopIndex);
  }

  function seatAngle(i) { return (i / N_SEATS) * Math.PI * 2 - Math.PI / 2; }
  function sway(tau) {
    return {
      x: 6 * Math.sin(2 * Math.PI * tau / 60),
      y: 4 * Math.sin(2 * Math.PI * tau / 40 + 1)
    };
  }

  // Tilt of seated mark i at loop-local time tau: ambient ripple plus gesture ripples.
  function tiltAt(i, tau) {
    var th = seatAngle(i);
    var tilt = 0.05 * Math.sin(th - 2 * Math.PI * tau / 60);
    for (var k = 0; k < GESTURES.length; k++) {
      var g = GESTURES[k];
      if (tau < g) continue;
      var origin = (k * 2.399963) % (2 * Math.PI);
      var wavefront = origin + (2 * Math.PI / 8) * (tau - g);
      var d = wrapPi(th - wavefront);
      var gauss = Math.exp(-((d / 0.45) * (d / 0.45)));
      var decay = Math.exp(-(tau - g) / 14);
      tilt += 0.34 * gauss * decay;
    }
    return clamp(tilt, -0.6, 0.6);
  }
  // Soloist arm raise envelope for gesture k at loop-local time tau.
  function gestureEnvelope(k, tau) {
    var g = GESTURES[k];
    if (tau < g || tau > g + 3) return 0;
    var t = tau - g;
    if (t < 0.5) return t / 0.5;
    if (t < 2.5) return 1;
    return (3 - t) / 0.5;
  }

  function drawGlyph(x, y, u, tilt, scale, color) {
    // Unified glyph: torso line + dot always; arms/legs scale with u.
    // u = 1 full soloist, u = 0 seated mark (line + dot).
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1.5, 2.2 * scale);
    ctx.lineCap = 'round';
    var torso = (22 + 18 * u) * scale;
    // Torso: vertical line, dot at the top end (toward the ring center for seats).
    ctx.beginPath();
    ctx.moveTo(0, torso * 0.5);
    ctx.lineTo(0, -torso * 0.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -torso * 0.5);
    ctx.arc(0, -torso * 0.5, 3.2 * scale, 0, Math.PI * 2);
    ctx.fill();
    if (u > 0.001) {
      var armLen = 17 * scale * u;
      var legLen = 15 * scale * u;
      ctx.beginPath();
      ctx.moveTo(0, -torso * 0.2);
      ctx.lineTo(-armLen, -torso * 0.2 - armLen * 0.3);
      ctx.moveTo(0, -torso * 0.2);
      ctx.lineTo(armLen, -torso * 0.2 - armLen * 0.3);
      ctx.moveTo(0, torso * 0.5);
      ctx.lineTo(-legLen * 0.6, torso * 0.5 + legLen);
      ctx.moveTo(0, torso * 0.5);
      ctx.lineTo(legLen * 0.6, torso * 0.5 + legLen);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawSoloist(x, y, tau, scale) {
    // Soloist with gesture arms: arms drawn separately so they can raise.
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = CENTER;
    ctx.fillStyle = CENTER;
    ctx.lineWidth = Math.max(1.5, 2.2 * scale);
    ctx.lineCap = 'round';
    var torso = 40 * scale;
    ctx.beginPath();
    ctx.moveTo(0, torso * 0.5);
    ctx.lineTo(0, -torso * 0.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -torso * 0.5);
    ctx.arc(0, -torso * 0.5, 3.4 * scale, 0, Math.PI * 2);
    ctx.fill();
    var raiseL = 0, raiseR = 0;
    for (var k = 0; k < GESTURES.length; k++) {
      var e = gestureEnvelope(k, tau);
      if (e <= 0) continue;
      var type = k % 3;
      if (type === 0) raiseL = Math.max(raiseL, e);
      else if (type === 1) raiseR = Math.max(raiseR, e);
      else { raiseL = Math.max(raiseL, e); raiseR = Math.max(raiseR, e); }
    }
    var armLen = 19 * scale;
    var aL = -0.55 - 0.6 * raiseL;
    var aR = 0.55 + 0.6 * raiseR;
    ctx.beginPath();
    ctx.moveTo(0, -torso * 0.2);
    ctx.lineTo(Math.sin(aL) * armLen, -torso * 0.2 - Math.cos(aL) * armLen);
    ctx.moveTo(0, -torso * 0.2);
    ctx.lineTo(Math.sin(aR) * armLen, -torso * 0.2 - Math.cos(aR) * armLen);
    ctx.moveTo(0, torso * 0.5);
    ctx.lineTo(-10 * scale, torso * 0.5 + 16 * scale);
    ctx.moveTo(0, torso * 0.5);
    ctx.lineTo(10 * scale, torso * 0.5 + 16 * scale);
    ctx.stroke();
    ctx.restore();
  }

  function draw(tAbs) {
    size();
    var loopIndex = Math.floor(tAbs / LOOP);
    var tau = tAbs - loopIndex * LOOP;
    var minDim = Math.min(W, H);
    var scale = minDim / 720;
    var cx = W / 2, cy = H / 2;
    var R = minDim * (isPhone ? 0.42 : 0.38);
    var E = exchangeStartForLoop(loopIndex, centerSessions);
    var nextSeat = risingSeatForLoop(loopIndex, centerSessions, override);
    var inExchange = tau >= E;
    var p = inExchange ? smoothstep(E, LOOP, tau) : 0;

    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);
    // Faint ground line.
    ctx.strokeStyle = GROUND;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W * 0.08, H * 0.93);
    ctx.lineTo(W * 0.92, H * 0.93);
    ctx.stroke();

    // Seat positions.
    var seatPos = [];
    for (var i = 0; i < N_SEATS; i++) {
      var a = seatAngle(i);
      seatPos.push({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R, a: a });
    }
    lastSeatPos = seatPos;

    var sw = sway(tau);
    var soloPos = { x: cx + sw.x, y: cy + sw.y };
    var seatedCount = 0, travelingCount = 0, maxTilt = 0, peakSeat = -1;

    if (!inExchange) {
      // Solo phase: 24 seated marks + 1 soloist.
      for (var s = 0; s < N_SEATS; s++) {
        var tilt = tiltAt(s, tau);
        if (Math.abs(tilt) > Math.abs(maxTilt)) { maxTilt = tilt; peakSeat = s; }
        var col = Math.abs(tilt) > 0.18 ? RIPPLE : SEATED;
        // Seated glyph faces inward: its up direction points at the center.
        ctx.save();
        ctx.translate(seatPos[s].x, seatPos[s].y);
        ctx.rotate(seatPos[s].a - Math.PI / 2 + tilt);
        ctx.strokeStyle = col;
        ctx.fillStyle = col;
        ctx.lineWidth = Math.max(1.5, 2.2 * scale);
        ctx.lineCap = 'round';
        var len = 22 * scale;
        ctx.beginPath();
        ctx.moveTo(0, len * 0.5);
        ctx.lineTo(0, -len * 0.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -len * 0.5);
        ctx.arc(0, -len * 0.5, 3.2 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        seatedCount++;
      }
      drawSoloist(soloPos.x, soloPos.y, tau, scale);
      lastSoloPos = soloPos;
    } else {
      // Exchange phase: old soloist travels to the rising seat, that seat's mark rises.
      var swE = sway(E);
      var startA = { x: cx + swE.x, y: cy + swE.y };
      var endA = seatPos[nextSeat];
      var startB = seatPos[nextSeat];
      var endB = { x: cx + sw.x, y: cy + sw.y };
      var posA = {
        x: startA.x + (endA.x - startA.x) * p,
        y: startA.y + (endA.y - startA.y) * p
      };
      var posB = {
        x: startB.x + (endB.x - startB.x) * p,
        y: startB.y + (endB.y - startB.y) * p
      };
      for (var s2 = 0; s2 < N_SEATS; s2++) {
        if (s2 === nextSeat) continue;
        var tilt2 = tiltAt(s2, tau);
        if (Math.abs(tilt2) > Math.abs(maxTilt)) { maxTilt = tilt2; peakSeat = s2; }
        var col2 = Math.abs(tilt2) > 0.18 ? RIPPLE : SEATED;
        ctx.save();
        ctx.translate(seatPos[s2].x, seatPos[s2].y);
        ctx.rotate(seatPos[s2].a - Math.PI / 2 + tilt2);
        ctx.strokeStyle = col2;
        ctx.fillStyle = col2;
        ctx.lineWidth = Math.max(1.5, 2.2 * scale);
        ctx.lineCap = 'round';
        var len2 = 22 * scale;
        ctx.beginPath();
        ctx.moveTo(0, len2 * 0.5);
        ctx.lineTo(0, -len2 * 0.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -len2 * 0.5);
        ctx.arc(0, -len2 * 0.5, 3.2 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        seatedCount++;
      }
      // Traveling marks use the unified glyph so the shape morphs smoothly.
      drawGlyph(posA.x, posA.y, 1 - p, 0, scale, mixColor(1 - p));
      drawGlyph(posB.x, posB.y, p, 0, scale, mixColor(p));
      travelingCount = 2;
      lastSoloPos = posB;
    }

    if (typeof window !== 'undefined') {
      window.__t26 = {
        loop: loopIndex, tau: Math.round(tau * 1000) / 1000,
        exchangeStart: E, phase: inExchange ? 'exchange' : 'solo',
        nextSeat: nextSeat, seatedCount: seatedCount, travelingCount: travelingCount,
        totalMarks: seatedCount + travelingCount + (inExchange ? 0 : 1),
        maxTilt: Math.round(maxTilt * 1000) / 1000, peakSeat: peakSeat,
        soloPos: lastSoloPos, seatPos: seatPos
      };
    }
  }

  function pointerPos(e) {
    var x = 0, y = 0;
    if (typeof e.clientX !== 'undefined') { x = e.clientX; y = e.clientY; }
    else if (typeof e.offsetX !== 'undefined') { x = e.offsetX; y = e.offsetY; }
    return { x: x, y: y };
  }
  function nowAbs() {
    // Absolute seconds derived only from the rAF clock anchor (see loop below).
    return startAbs;
  }
  var startTime = null;
  var startAbs = 0;
  function onDown(e) {
    var pos = pointerPos(e);
    var tAbs = nowAbs();
    var minDim = Math.min(W, H);
    var scale = minDim / 720;
    var dSolo = Math.sqrt(Math.pow(pos.x - lastSoloPos.x, 2) + Math.pow(pos.y - lastSoloPos.y, 2));
    if (dSolo <= 70 * scale) {
      centerActive = { start: tAbs };
      return;
    }
    var best = -1, bestD = 1e9;
    for (var i = 0; i < lastSeatPos.length; i++) {
      var d = Math.sqrt(Math.pow(pos.x - lastSeatPos[i].x, 2) + Math.pow(pos.y - lastSeatPos[i].y, 2));
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0 && bestD <= 34 * scale) {
      var loopIndex = Math.floor(tAbs / LOOP);
      var tau = tAbs - loopIndex * LOOP;
      var E = exchangeStartForLoop(loopIndex, centerSessions);
      var targetLoop = tau < E ? loopIndex : loopIndex + 1;
      override = { loop: targetLoop, seat: best };
    }
  }
  function onUp(e) {
    if (centerActive) {
      centerSessions.push({ start: centerActive.start, end: nowAbs() });
      centerActive = null;
    }
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  draw(0);
  function loop(ts) {
    if (startTime === null) startTime = ts;
    startAbs = (ts - startTime) / 1000;
    draw(startAbs);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
