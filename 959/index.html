<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>An Empty Room</title>
<style>
  html, body { margin: 0; padding: 0; background: #07080D; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette ----------
  var VOID = '#07080D';
  var ROOM = '#0E1119';
  var EDGE = '#1A2130';
  var MOTE_RGB = [200, 210, 224];   // #C8D2E0
  var BEAM_RGB = [232, 238, 247];   // #E8EEF7
  var GHOST = '#D8DCE4';

  // ---------- seeded rng (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashSeed(a, b) {
    var h = (a ^ Math.imul(b + 1, 2654435761)) | 0;
    h = Math.imul(h ^ (h >>> 13), 2246822519);
    return (h ^ (h >>> 16)) >>> 0;
  }

  var T0 = 205;              // frame one: piece time offset (ghost ~40% across)
  var BASE_SEED = 959120;
  var CYCLE = 240;           // ghost cycle length (s)
  var GHOST_IN = 180;        // ghost crossing occupies [180, 240) of each cycle

  // ---------- generation state (reseeded by double-tap) ----------
  var gen = 0;
  var G = null;              // generation parameters
  var breaths = [];          // {t0} tap-breath events (current generation)
  var stirs = [];            // {t0, pts:[{x,y,dx,dy}]} drag events (current generation)

  function buildGeneration(g) {
    var rng = mulberry32(BASE_SEED + g * 7919);
    var p = {};
    p.roomWFrac = 0.66 + rng() * 0.10;        // 0.66 - 0.76 of frame width
    p.roomHFrac = 0.60 + rng() * 0.14;        // 0.60 - 0.74 of frame height
    p.breathPhase = rng() * Math.PI * 2;
    p.beamAngle = (-38 + rng() * 16) * Math.PI / 180;  // diagonal beam
    // ghost vocabulary order (seeded permutation)
    var vocab = ['circle', 'bar', 'arc', 'ring'];
    for (var i = vocab.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = vocab[i]; vocab[i] = vocab[j]; vocab[j] = tmp;
    }
    p.vocab = vocab;
    // 40 motes
    p.motes = [];
    for (var k = 0; k < 40; k++) {
      p.motes.push({
        ax: -0.46 + rng() * 0.92,
        ay: -0.44 + rng() * 0.88,
        a1x: 0.006 + rng() * 0.024, p1x: 60 + rng() * 120, f1x: rng() * Math.PI * 2,
        a2x: 0.004 + rng() * 0.018, p2x: 60 + rng() * 120, f2x: rng() * Math.PI * 2,
        a1y: 0.006 + rng() * 0.024, p1y: 60 + rng() * 120, f1y: rng() * Math.PI * 2,
        a2y: 0.004 + rng() * 0.018, p2y: 60 + rng() * 120, f2y: rng() * Math.PI * 2,
        alpha: 0.15 + rng() * 0.35,
        big: rng() < 0.45
      });
    }
    return p;
  }

  function ghostForCycle(g, cycleIdx) {
    var rng = mulberry32(hashSeed(BASE_SEED + g * 7919, cycleIdx * 131 + 7));
    return {
      shape: G.vocab[cycleIdx % 4],
      yOff: -0.22 + rng() * 0.44,
      sizeMul: 0.85 + rng() * 0.35,
      angle: rng() * Math.PI,
      arcStart: rng() * Math.PI * 2,
      arcSweep: (150 + rng() * 130) * Math.PI / 180
    };
  }

  // ---------- canvas / sizing ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = window.visualViewport;
    W = (vv && vv.width) || window.innerWidth || 720;
    H = (vv && vv.height) || window.innerHeight || 720;
    DPR = window.devicePixelRatio || 1;
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    PHONE = Math.min(sw, sh) < 700;
    if (!window.screen && H > W * 1.15) PHONE = true;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(curT); });
  }
  window.addEventListener('resize', function () { resize(); draw(curT); });

  // ---------- geometry helpers ----------
  function roomRect(t) {
    var wFrac = PHONE ? 0.78 : G.roomWFrac;
    var swell = 0;
    for (var i = 0; i < breaths.length; i++) {
      var age = t - breaths[i].t0;
      if (age >= 0 && age < 6) { var u = 1 - age / 6; swell += 0.04 * u * u; }
    }
    var s = 1 + 0.02 * Math.sin(2 * Math.PI * (t / 90) + G.breathPhase) + swell;
    var w = W * wFrac * s, h = H * G.roomHFrac * s;
    return { x: (W - w) / 2, y: (H - h) / 2, w: w, h: h, cx: W / 2, cy: H / 2 };
  }

  function motePos(m, t, room) {
    var nx = m.ax
      + m.a1x * Math.sin(2 * Math.PI * t / m.p1x + m.f1x)
      + m.a2x * Math.sin(2 * Math.PI * t / m.p2x + m.f2x);
    var ny = m.ay
      + m.a1y * Math.sin(2 * Math.PI * t / m.p1y + m.f1y)
      + m.a2y * Math.sin(2 * Math.PI * t / m.p2y + m.f2y);
    var x = room.cx + nx * room.w;
    var y = room.cy + ny * room.h;
    // drag stirs: closed-form decaying swirl offsets
    for (var i = 0; i < stirs.length; i++) {
      var ev = stirs[i], age = t - ev.t0;
      if (age < 0 || age >= 30) continue;
      var decay = Math.exp(-age / 9);
      for (var j = 0; j < ev.pts.length; j++) {
        var pt = ev.pts[j];
        var dx = x - pt.x, dy = y - pt.y;
        var d2 = dx * dx + dy * dy;
        var R = room.w * 0.11;
        var wgt = Math.exp(-d2 / (R * R));
        if (wgt < 0.01) continue;
        // perpendicular swirl around drag direction
        x += (-pt.dy) * wgt * decay * 0.9;
        y += (pt.dx) * wgt * decay * 0.9;
      }
    }
    return { x: x, y: y };
  }

  // ---------- draw ----------
  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = VOID;
    ctx.fillRect(0, 0, W, H);

    var room = roomRect(t);

    // room body + edge
    ctx.fillStyle = ROOM;
    ctx.fillRect(room.x, room.y, room.w, room.h);
    ctx.strokeStyle = EDGE;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(room.x, room.y, room.w, room.h);

    // ghost (one per 240 s cycle, crossing during [180,240))
    var cyc = Math.floor(t / CYCLE);
    var lt = t - cyc * CYCLE;
    var ghostAlpha = 0;
    if (lt >= GHOST_IN && lt < CYCLE) {
      var u = (lt - GHOST_IN) / (CYCLE - GHOST_IN);
      var gh = ghostForCycle(gen, cyc);
      ghostAlpha = 0.05 * Math.pow(Math.sin(Math.PI * u), 0.8);
      var gx = room.cx + (-0.78 + 1.56 * u) * room.w;
      var gy = room.cy + gh.yOff * room.h;
      var R = 0.34 * Math.min(room.w, room.h) * gh.sizeMul;
      ctx.save();
      ctx.globalAlpha = ghostAlpha;
      ctx.fillStyle = GHOST;
      ctx.strokeStyle = GHOST;
      if (gh.shape === 'circle') {
        ctx.beginPath(); ctx.arc(gx, gy, R, 0, Math.PI * 2); ctx.fill();
      } else if (gh.shape === 'ring') {
        ctx.lineWidth = 0.05 * room.h;
        ctx.beginPath(); ctx.arc(gx, gy, R, 0, Math.PI * 2); ctx.stroke();
      } else if (gh.shape === 'bar') {
        ctx.translate(gx, gy); ctx.rotate(gh.angle);
        ctx.fillRect(-0.42 * room.w * gh.sizeMul, -0.05 * room.h, 0.84 * room.w * gh.sizeMul, 0.10 * room.h);
      } else { // arc
        ctx.lineWidth = 0.055 * room.h;
        ctx.beginPath(); ctx.arc(gx, gy, R, gh.arcStart, gh.arcStart + gh.arcSweep); ctx.stroke();
      }
      ctx.restore();
    }

    // motes + beam
    var ca = Math.cos(G.beamAngle), sa = Math.sin(G.beamAngle);
    var nxv = -sa, nyv = ca; // beam normal
    var hw = 0.085 * room.w;
    var U = Math.min(W, H) / 720;
    for (var i = 0; i < G.motes.length; i++) {
      var m = G.motes[i];
      var pos = motePos(m, t, room);
      var d = (pos.x - room.cx) * nxv + (pos.y - room.cy) * nyv;
      var boost = Math.exp(-(d * d) / (hw * hw));
      var a = m.alpha * (0.45 + 1.1 * boost);
      if (a > 0.95) a = 0.95;
      var kk = boost * 0.8;
      var r = Math.round(MOTE_RGB[0] + (BEAM_RGB[0] - MOTE_RGB[0]) * kk);
      var g2 = Math.round(MOTE_RGB[1] + (BEAM_RGB[1] - MOTE_RGB[1]) * kk);
      var b = Math.round(MOTE_RGB[2] + (BEAM_RGB[2] - MOTE_RGB[2]) * kk);
      ctx.fillStyle = 'rgba(' + r + ',' + g2 + ',' + b + ',' + a.toFixed(3) + ')';
      var rad = (m.big ? 1.5 : 0.9) * Math.max(0.8, U);
      ctx.beginPath(); ctx.arc(pos.x, pos.y, rad, 0, Math.PI * 2); ctx.fill();
    }
    return ghostAlpha;
  }

  // ---------- audio (lazy, guarded, honestly tiny) ----------
  var AC = null, swellGain = null, lastPing = -10;
  function initAudio() {
    if (AC) return;
    try {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (typeof Ctor !== 'function') return;
      AC = new Ctor();
      // room tone: looped noise through a lowpass, gain 0.015
      var len = AC.sampleRate * 2;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var data = buf.getChannelData(0);
      var lr = mulberry32(4242);
      for (var i = 0; i < len; i++) data[i] = lr() * 2 - 1;
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
      var g = AC.createGain(); g.gain.value = 0.015;
      src.connect(lp); lp.connect(g); g.connect(AC.destination); src.start();
      // ghost swell voice
      var osc = AC.createOscillator(); osc.type = 'sine'; osc.frequency.value = 55;
      swellGain = AC.createGain(); swellGain.gain.value = 0;
      osc.connect(swellGain); swellGain.connect(AC.destination); osc.start();
    } catch (e) { AC = null; }
  }
  function ping(tSec) {
    if (!AC || tSec - lastPing < 2.5) return;
    lastPing = tSec;
    try {
      var o = AC.createOscillator(); o.type = 'sine';
      o.frequency.value = 2600 + Math.random() * 800;
      var g = AC.createGain();
      g.gain.setValueAtTime(0.006, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.4);
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + 0.45);
    } catch (e) { /* silent */ }
  }

  // ---------- interaction ----------
  var curT = T0;
  var downInfo = null, lastTapT = -10, pendingBreath = null;

  function evtPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    initAudio();
    if (AC && AC.resume) AC.resume();
    var p = evtPos(e);
    downInfo = { x: p.x, y: p.y, t: curT, pts: [{ x: p.x, y: p.y, dx: 0, dy: 0 }], moved: false };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!downInfo) return;
    var p = evtPos(e);
    var last = downInfo.pts[downInfo.pts.length - 1];
    var dx = p.x - last.x, dy = p.y - last.y;
    if (dx * dx + dy * dy > 64) {
      downInfo.pts.push({ x: p.x, y: p.y, dx: dx, dy: dy });
      if (Math.abs(p.x - downInfo.x) + Math.abs(p.y - downInfo.y) > 8) downInfo.moved = true;
    }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!downInfo) return;
    var info = downInfo; downInfo = null;
    if (info.moved || info.pts.length > 2) {
      // drag: stir the dust
      stirs.push({ t0: curT, pts: info.pts.slice(1) });
      if (stirs.length > 12) stirs.shift();
      return;
    }
    // tap
    if (curT - lastTapT < 0.35) {
      // double-tap: a new room
      if (pendingBreath) {
        var idx = breaths.indexOf(pendingBreath);
        if (idx >= 0) breaths.splice(idx, 1);
        pendingBreath = null;
      }
      gen++;
      G = buildGeneration(gen);
      breaths = []; stirs = [];
      lastTapT = -10;
    } else {
      pendingBreath = { t0: curT + 0.35 };
      breaths.push(pendingBreath);
      lastTapT = curT;
    }
  });

  // ---------- main ----------
  G = buildGeneration(0);
  resize();
  draw(curT);

  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    curT = T0 + (ts - startStamp) / 1000;
    var ga = draw(curT);
    if (AC && swellGain) {
      try { swellGain.gain.value = 0.018 * (ga / 0.05 || 0); } catch (e) { /* silent */ }
    }
    // mote beam-center pings: cheap check on a rotating subset
    if (AC) {
      var room = roomRect(curT);
      var ca = Math.cos(G.beamAngle), sa = Math.sin(G.beamAngle);
      var hw = 0.085 * room.w;
      for (var i = 0; i < G.motes.length; i += 7) {
        var pos = motePos(G.motes[i], curT, room);
        var d = (pos.x - room.cx) * (-sa) + (pos.y - room.cy) * ca;
        if (Math.abs(d) < hw * 0.25) { ping(curT); break; }
      }
    }
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
