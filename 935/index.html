<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Inks, One Poster</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAF7F0; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var PAPER = '#FAF7F0';
  var INKS = ['#00AEEF', '#EC008C', '#FFF200', '#1A1A1A']; // C M Y K
  var HEADLINE = 'DATA IS A HUMAN MATERIAL';
  var LINE1 = 'DATA IS A HUMAN';
  var LINE2 = 'MATERIAL';
  var LEGEND = 'C = temperature · M = visitors · Y = words · K = time';
  var BASE_SEED = 935000;
  var LOOP = 85;          // 60 print + 15 hold + 10 lift
  var PASS = 15;          // seconds per plate pass
  var PHASE0 = 38.5;      // frame one: C and M printed, Y mid-pass
  var BASE_OFF = [        // per-plate misregistration, 2-4 px, all different
    { x: 3, y: -2 }, { x: -3, y: 2 }, { x: 2, y: 3 }, { x: -2, y: -3 }
  ];

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function clampOff(v) { return v < -14 ? -14 : (v > 14 ? 14 : v); }

  // ---------- canvas / view ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  // layout geometry
  var MX = 0, AVAIL = 0, FX = 0, FY = 0, FW = 0, FH = 0, CELL = 0, COLS = 0, ROWS = 0;
  var HEAD_LINES = [HEADLINE], HEAD_SIZE = 40, HEAD_TOP = 0;
  var LEGEND_Y = 0, LEGEND_SIZE = 12;

  // per-letter headline jitter, fixed seed: hand-set feel, same at every size
  var JIT = (function () {
    var r = mulberry32(93511), out = [], i;
    for (i = 0; i < HEADLINE.length; i++) {
      out.push({ rot: (r() * 2 - 1) * 0.045, dy: (r() * 2 - 1) * 0.055, dx: (r() * 2 - 1) * 0.02 });
    }
    return out;
  })();

  // ---------- data streams ----------
  var VALS = null;        // [plate][cellIndex] -> 0..1
  var GEN_USED = -1;

  function buildValues(gen) {
    var rng = mulberry32(BASE_SEED + gen * 7919);
    var phC = gen * 1.93, phK = gen * 2.41;
    var n = COLS * ROWS, i, c, r, u, v;
    var arr = [[], [], [], []];
    for (i = 0; i < n; i++) {
      c = i % COLS; r = (i / COLS) | 0;
      u = (c + 0.5) / COLS; v = (r + 0.5) / ROWS;
      var jC = (rng() - 0.5) * 0.08;
      var y1 = rng(), y2 = rng();
      var mN = (rng() - 0.5) * 0.12;
      // C: temperature, a smooth gradient wave
      var temp = 0.44 + 0.38 * Math.sin(2.7 * u + 1.2 + phC) * Math.cos(2.1 * v - 0.5)
               + 0.15 * Math.sin(4.6 * u + 2.8 * v + phC * 1.7) + jC;
      arr[0].push(clamp01(temp));
      // M: visitor counts, peaks clustered near the centre
      var d1 = (u - 0.48) * (u - 0.48) + (v - 0.44) * (v - 0.44) * 1.15;
      var d2 = (u - 0.74) * (u - 0.74) + (v - 0.66) * (v - 0.66);
      var d3 = (u - 0.20) * (u - 0.20) + (v - 0.70) * (v - 0.70);
      var vis = 0.92 * (Math.exp(-d1 / 0.055) + 0.72 * Math.exp(-d2 / 0.016) + 0.5 * Math.exp(-d3 / 0.03)) + mN;
      arr[1].push(clamp01(vis));
      // Y: word frequencies, sparse with a few big dots
      var word = (y1 < 0.80) ? y1 * 0.16 : 0.5 + 0.5 * y2;
      arr[2].push(clamp01(word));
      // K: time-of-day, a diagonal rhythm
      var diag = 0.5 + 0.5 * Math.sin((u + v * 1.35) * 10.5 + phK);
      var tod = 0.12 + 0.88 * diag * (0.6 + 0.4 * Math.sin(2.2 * u - 0.8 + phK));
      arr[3].push(clamp01(tod));
    }
    VALS = arr;
    GEN_USED = gen;
  }

  // ---------- layout ----------
  function fontFor(size, weight) {
    return weight + ' ' + size.toFixed(1) + 'px "Helvetica Neue", Arial, "DejaVu Sans", sans-serif';
  }
  function layout() {
    var sw = 100000;
    if (typeof window !== 'undefined' && window.screen && window.screen.width) {
      sw = Math.min(window.screen.width, window.screen.height);
    }
    if (sw !== 100000) { PHONE = sw < 700; }
    else { PHONE = H > W * 1.15; }

    MX = W * 0.055;
    AVAIL = W - MX * 2;
    FX = MX; FW = AVAIL;
    FY = H * 0.335;
    var fieldH = H * 0.545;
    COLS = PHONE ? 15 : 26;
    CELL = FW / COLS;
    ROWS = Math.max(4, Math.round(fieldH / CELL));
    FH = ROWS * CELL;
    FY = H * 0.335 + (fieldH - FH) / 2;
    LEGEND_Y = H * 0.945;
    LEGEND_SIZE = Math.max(10, Math.min(15, W * 0.016));

    // headline: one line if it fits at a decent size, else two lines
    var s = H * 0.092;
    ctx.font = fontFor(s, '900');
    var wFull = ctx.measureText(HEADLINE).width;
    HEAD_LINES = [HEADLINE];
    if (!PHONE && wFull <= AVAIL) {
      HEAD_SIZE = s;
    } else if (!PHONE && wFull * (H * 0.04) / s <= AVAIL) {
      HEAD_SIZE = s * AVAIL / wFull;
      if (HEAD_SIZE < H * 0.04) { HEAD_LINES = [LINE1, LINE2]; }
    } else {
      HEAD_LINES = [LINE1, LINE2];
    }
    if (HEAD_LINES.length === 2) {
      var s2 = PHONE ? W * 0.105 : H * 0.082;
      ctx.font = fontFor(s2, '900');
      var w1 = ctx.measureText(LINE1).width;
      if (w1 > AVAIL) { s2 = s2 * AVAIL / w1; }
      HEAD_SIZE = s2;
    }
    HEAD_TOP = H * 0.055;

    if (VALS) { var g = GEN_USED; VALS = null; buildValues(g < 0 ? 0 : g); }
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : (window.innerWidth || 300);
    H = vv ? vv.height : (window.innerHeight || 300);
    DPR = Math.min((typeof window !== 'undefined' && window.devicePixelRatio) || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    layout();
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }

  // ---------- interaction state (recorded events only) ----------
  var taps = [];   // elapsed times of pointer-up taps
  var drags = [];  // {t0, t1(null while open), dx, dy}
  var downInfo = null;

  function nowSec() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - T0MS) / 1000;
    }
    return 0;
  }

  // classify the recorded events at time t: generation, matured single taps, last reseed time
  function classify(t) {
    var gen = 0, singles = 0, lastReset = 0, i = 0;
    while (i < taps.length) {
      if (i + 1 < taps.length && taps[i + 1] - taps[i] <= 0.32) {
        gen++; lastReset = taps[i + 1]; i += 2;
      } else {
        if (taps[i] + 0.32 <= t) { singles++; }
        i += 1;
      }
    }
    return { gen: gen, singles: singles, lastReset: lastReset };
  }

  function dragExtra(t) {
    var i, d, open = null, last = null;
    for (i = 0; i < drags.length; i++) {
      d = drags[i];
      if (d.t1 === null) { open = d; } else { last = d; }
    }
    if (open) { return { x: clampOff(open.dx), y: clampOff(open.dy) }; }
    if (last) {
      var dt = t - last.t1;
      if (dt >= 0 && dt < 3) {
        var k = Math.exp(-dt / 0.55); // closed-form ease back to base registration
        return { x: clampOff(last.dx * k), y: clampOff(last.dy * k) };
      }
    }
    return { x: 0, y: 0 };
  }

  // ---------- audio (lazy, gesture-only, fully guarded) ----------
  var AC = null, rumbleGain = null;
  function ensureAudio() {
    if (AC) { try { if (AC.resume) { AC.resume(); } } catch (e) {} return; }
    try {
      var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext :
                 ((typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null);
      if (!Ctor) { return; }
      AC = new Ctor();
      var len = 2 * AC.sampleRate;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var ch = buf.getChannelData(0);
      var r = mulberry32(93577), last = 0, i, white;
      for (i = 0; i < len; i++) {           // brownish noise for the press rumble
        white = r() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;
        ch[i] = last * 3.2;
      }
      var src = AC.createBufferSource();
      src.buffer = buf; src.loop = true;
      var f = AC.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 220;
      rumbleGain = AC.createGain();
      rumbleGain.gain.value = 0;
      src.connect(f); f.connect(rumbleGain); rumbleGain.connect(AC.destination);
      src.start();
    } catch (e) { AC = null; rumbleGain = null; }
  }
  function clunk() {
    if (!AC) { return; }
    try {
      var t0 = AC.currentTime;
      var o = AC.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(72, t0);
      o.frequency.exponentialRampToValueAtTime(38, t0 + 0.14);
      var g = AC.createGain();
      g.gain.setValueAtTime(0.16, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
      o.connect(g); g.connect(AC.destination);
      o.start(t0); o.stop(t0 + 0.18);
    } catch (e) {}
  }
  var prevLt = -1;
  function audioTick(lt) {
    if (!AC || !rumbleGain) { return; }
    try {
      var printing = (lt < 60) ? Math.min(3, Math.floor(lt / PASS)) : -1;
      var target = (printing >= 0) ? 0.05 : 0;
      rumbleGain.gain.setTargetAtTime(target, AC.currentTime, 0.2);
      if (prevLt >= 0 && prevLt < 60) {     // a plate landed: clunk on pass boundaries
        var b;
        for (b = PASS; b <= 60; b += PASS) {
          if (prevLt < b && lt >= b) { clunk(); }
        }
      }
      prevLt = lt;
    } catch (e) {}
  }

  // ---------- pointer handling ----------
  function ptrPos(e) {
    if (e && typeof e.clientX === 'number') { return { x: e.clientX, y: e.clientY }; }
    if (e && e.touches && e.touches.length) { return { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
    return { x: 0, y: 0 };
  }
  function onDown(e) {
    ensureAudio();
    var p = ptrPos(e), t = nowSec();
    downInfo = { x: p.x, y: p.y, drag: null };
  }
  function onMove(e) {
    if (!downInfo) { return; }
    var p = ptrPos(e);
    var dx = p.x - downInfo.x, dy = p.y - downInfo.y;
    if (!downInfo.drag && Math.sqrt(dx * dx + dy * dy) > 7) {
      downInfo.drag = { t0: nowSec(), t1: null, dx: dx, dy: dy };
      drags.push(downInfo.drag);
    } else if (downInfo.drag) {
      downInfo.drag.dx = dx; downInfo.drag.dy = dy;
    }
  }
  function onUp(e) {
    if (!downInfo) { return; }
    var t = nowSec();
    if (downInfo.drag) { downInfo.drag.t1 = t; }
    else { taps.push(t); }
    downInfo = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---------- plate state ----------
  // returns {alpha, bandY (or -1 when fully printed), rise}
  function plateState(p, lt) {
    var start = p * PASS, end = start + PASS;
    if (lt < start) { return { alpha: 0, bandY: -2, rise: 0 }; }
    if (lt < end) {
      var prog = (lt - start) / PASS;
      return { alpha: 1, bandY: FY - CELL + (FH + 2 * CELL) * prog, rise: 0 };
    }
    if (lt < 75) { return { alpha: 1, bandY: -1, rise: 0 }; }
    var liftStart = 75 + (3 - p) * 2.5;   // lift in reverse: K first, C last
    if (lt < liftStart) { return { alpha: 1, bandY: -1, rise: 0 }; }
    if (lt < liftStart + 2.5) {
      var q = (lt - liftStart) / 2.5;
      return { alpha: 1 - q, bandY: -1, rise: -q * CELL * 1.8 };
    }
    return { alpha: 0, bandY: -2, rise: 0 };
  }

  // ---------- drawing ----------
  function drawHeadline() {
    ctx.fillStyle = INKS[3];
    ctx.textBaseline = 'alphabetic';
    var lineH = HEAD_SIZE * 1.04;
    var totalH = HEAD_LINES.length * lineH;
    var y0 = HEAD_TOP + (H * 0.30 - HEAD_TOP - totalH) / 2 + HEAD_SIZE * 0.82;
    var li, ci;
    for (li = 0; li < HEAD_LINES.length; li++) {
      var line = HEAD_LINES[li];
      ctx.font = fontFor(HEAD_SIZE, '900');
      var widths = [], total = 0;
      for (ci = 0; ci < line.length; ci++) {
        var wch = ctx.measureText(line.charAt(ci)).width;
        widths.push(wch); total += wch;
      }
      var x = (W - total) / 2;
      var baseY = y0 + li * lineH;
      var gidx = (li === 0) ? 0 : HEADLINE.indexOf(LINE2);
      for (ci = 0; ci < line.length; ci++) {
        var ch = line.charAt(ci);
        var j = JIT[(gidx + ci) % JIT.length];
        if (ch !== ' ') {
          ctx.save();
          ctx.translate(x + widths[ci] / 2 + j.dx * HEAD_SIZE, baseY + j.dy * HEAD_SIZE);
          ctx.rotate(j.rot);
          ctx.textAlign = 'center';
          ctx.fillText(ch, 0, 0);
          ctx.restore();
        }
        x += widths[ci];
      }
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var cls = classify(t);
    if (cls.gen !== GEN_USED) { buildValues(cls.gen); }
    var lt = (t - cls.lastReset + (cls.gen === 0 ? PHASE0 : 0)) % LOOP;
    if (lt < 0) { lt += LOOP; }
    var iso = (cls.singles % 5); // 0 all, 1 C, 2 M, 3 Y, 4 K
    var extra = dragExtra(t);

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    drawHeadline();

    // halftone field: four plates, multiply so the inks mix optically
    var maxR = CELL * 0.46;
    var p, i, c, r;
    ctx.globalCompositeOperation = 'multiply';
    for (p = 0; p < 4; p++) {
      var st = plateState(p, lt);
      if (st.alpha <= 0) { continue; }
      var isoMult = (iso === 0 || iso === p + 1) ? 1 : 0.08;
      ctx.globalAlpha = st.alpha * isoMult;
      ctx.fillStyle = INKS[p];
      var ox = BASE_OFF[p].x + extra.x, oy = BASE_OFF[p].y + extra.y;
      var vals = VALS[p];
      for (i = 0; i < vals.length; i++) {
        var v = vals[i];
        if (v <= 0.01) { continue; }
        c = i % COLS; r = (i / COLS) | 0;
        var cx = FX + (c + 0.5) * CELL + ox;
        var cy = FY + (r + 0.5) * CELL + oy + st.rise;
        var scale = 1;
        if (st.bandY >= -1 && st.bandY !== -1) {
          scale = clamp01((st.bandY - (cy - CELL * 0.5)) / CELL);
          if (scale <= 0) { continue; }
        }
        var rad = v * maxR * scale;
        if (rad < 0.35) { continue; }
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, 6.283185307179586);
        ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // printer's legend
    ctx.fillStyle = INKS[3];
    ctx.font = fontFor(LEGEND_SIZE, '400');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(LEGEND, W / 2, LEGEND_Y);

    audioTick(lt);
  }

  // ---------- run ----------
  var T0MS = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  resize();
  buildValues(0);
  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    var tick = function () {
      draw(nowSec());
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
