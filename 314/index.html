<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.314 Gum Blossom Engine</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#141210; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.314 Gum Blossom Engine (Coral Cockatoo).
// Exactly six eucalyptus blossoms, each a cup-like operculum cap
// over a radial burst of stamens. No petal flowers. Caps lift and
// fall, filaments unfurl and refurl on a 24s seamless loop. Tap a
// blossom to scatter its stamens; it regrows from bud over 6s and
// rejoins the loop. One canvas, no gradients, no text.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CREAM = '#F5EFE0', GOLD = '#D9A441', ROSE = '#C98A7D';
var BROWN = '#6B4A35', SAGE = '#8A9B7E', GROUND = '#141210';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 7, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var LOOP = 24;

function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function smooth(u) { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); }

// ---- blossoms: exactly 6, asserted ----------------------------------
var DEFS = [
  { x: 330, y: 270, r: 72, phase: 0.00 },
  { x: 645, y: 205, r: 52, phase: 0.34 },
  { x: 945, y: 285, r: 80, phase: 0.58 },
  { x: 430, y: 590, r: 60, phase: 0.76 },
  { x: 755, y: 545, r: 74, phase: 0.16 },
  { x: 1005, y: 630, r: 50, phase: 0.88 }
];
var BLOSSOMS = [];
(function () {
  var bi, di, r, count, j;
  for (bi = 0; bi < DEFS.length; bi++) {
    di = DEFS[bi];
    r = rng(31400 + bi * 771);
    count = 40 + Math.floor(r() * 31); // 40..70 inclusive
    if (count < 40 || count > 70) throw new Error('stamen count out of range');
    var fils = [];
    for (j = 0; j < count; j++) {
      var ang = (j / count) * Math.PI * 2 + (r() - 0.5) * 0.22;
      fils.push({
        ang: ang,
        len: di.r * (0.95 + r() * 0.75),
        bend: (r() - 0.5) * 0.9,
        drift: 30 + r() * 90,
        driftAng: ang + (r() - 0.5) * 0.7,
        wob: r() * Math.PI * 2
      });
    }
    // leaves on the stem: 2 or 3 lanceolate leaves, seeded side/length
    var leaves = [], nl = 2 + Math.floor(r() * 2), k;
    for (k = 0; k < nl; k++) {
      leaves.push({
        t: 0.35 + 0.55 * (k / Math.max(1, nl - 1)) + (r() - 0.5) * 0.08,
        side: k % 2 === 0 ? 1 : -1,
        len: 62 + r() * 48,
        wid: 11 + r() * 6,
        droop: 0.35 + r() * 0.45
      });
    }
    BLOSSOMS.push({
      x: di.x, y: di.y, r: di.r, phase: di.phase,
      count: count, fils: fils, leaves: leaves,
      stemBend: (r() - 0.5) * 50,
      tapT: -99
    });
  }
})();
if (BLOSSOMS.length !== 6) throw new Error('Gum Blossom Engine needs exactly 6 blossoms');
for (var ci = 0; ci < BLOSSOMS.length; ci++) {
  if (BLOSSOMS[ci].count < 40 || BLOSSOMS[ci].count > 70) throw new Error('stamen count out of asserted range');
}

// ---- loop openness ----------------------------------------------------
// u in [0,1): openness rises 0->1 in first half, falls 1->0 in second,
// so frame 24s is identical to frame 0.
function loopOpen(b) {
  var u = (((T / LOOP) + b.phase) % 1 + 1) % 1;
  return 0.5 - 0.5 * Math.cos(u * Math.PI * 2);
}

// Effective openness and scatter state for a blossom at time T.
function blossomState(b) {
  var age = T - b.tapT;
  if (age >= 0 && age < 6) {
    if (age < 1.4) {
      // scatter: filaments fly out on drift vectors, fading
      return { open: loopOpen(b), scatter: age / 1.4, mode: 'scatter' };
    }
    var p = (age - 1.4) / 4.6; // regrow from bud over remaining time to 6s total
    var ro = smooth(p);
    // blend back to the loop in the final fifth so rejoin is soft
    if (p > 0.8) {
      var k = (p - 0.8) / 0.2;
      ro = ro * (1 - k) + loopOpen(b) * k;
    }
    return { open: ro, scatter: 0, mode: 'regrow' };
  }
  return { open: loopOpen(b), scatter: 0, mode: 'idle' };
}

// ---- drawing helpers --------------------------------------------------
function leafPath(x, y, len, wid, ang) {
  var dx = Math.cos(ang), dy = Math.sin(ang);
  var px = -dy, py = dx;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + dx * len * 0.45 + px * wid, y + dy * len * 0.45 + py * wid, x + dx * len, y + dy * len);
  ctx.quadraticCurveTo(x + dx * len * 0.45 - px * wid, y + dy * len * 0.45 - py * wid, x, y);
  ctx.closePath();
}

function drawStemAndLeaves(b) {
  var baseX = b.x + b.stemBend, baseY = b.y + b.r * 2.35;
  var midX = b.x + b.stemBend * 0.4, midY = b.y + b.r * 1.25;
  st(BROWN, Math.max(4, b.r * 0.11));
  ctx.beginPath(); ctx.moveTo(baseX, baseY);
  ctx.quadraticCurveTo(midX, midY, b.x, b.y + b.r * 0.55); ctx.stroke();
  // woody gum-nut bud on a side twig (half-open bud companion)
  var nx = midX + b.stemBend * 0.25 + 26, ny = midY + 14;
  st(BROWN, 3.5);
  ctx.beginPath(); ctx.moveTo(midX, midY); ctx.quadraticCurveTo(midX + 18, midY + 4, nx, ny); ctx.stroke();
  ctx.fillStyle = BROWN;
  ctx.beginPath();
  ctx.moveTo(nx - 10, ny); ctx.lineTo(nx + 10, ny); ctx.lineTo(nx + 7, ny + 20); ctx.lineTo(nx - 7, ny + 20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = ROSE;
  ctx.beginPath(); ctx.ellipse(nx, ny - 1, 10.5, 6, 0, Math.PI, Math.PI * 2); ctx.fill();
  // leaves along stem
  var i, lf, t, lx, ly, ang;
  for (i = 0; i < b.leaves.length; i++) {
    lf = b.leaves[i]; t = lf.t;
    // point on the quadratic stem
    var mt = 1 - t;
    lx = mt * mt * baseX + 2 * mt * t * midX + t * t * b.x;
    ly = mt * mt * baseY + 2 * mt * t * midY + t * t * (b.y + b.r * 0.55);
    ang = (lf.side > 0 ? -0.25 : Math.PI + 0.25) + lf.droop * (lf.side > 0 ? 1 : -1) * 0.55;
    // leaves angle outward and droop downward
    ang = lf.side > 0 ? (0.15 + lf.droop * 0.55) : (Math.PI - 0.15 - lf.droop * 0.55);
    ctx.fillStyle = SAGE;
    leafPath(lx, ly, lf.len, lf.wid, ang); ctx.fill();
    st(BROWN, 1.4); ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + Math.cos(ang) * lf.len * 0.92, ly + Math.sin(ang) * lf.len * 0.92); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawBlossom(b) {
  var state = blossomState(b);
  var open = state.open, R = b.r;
  var cx = b.x, cy = b.y;
  // cup (gum-nut): woody truncated cup below the mouth
  ctx.fillStyle = BROWN;
  ctx.beginPath();
  ctx.moveTo(cx - R * 0.62, cy + R * 0.08);
  ctx.lineTo(cx + R * 0.62, cy + R * 0.08);
  ctx.lineTo(cx + R * 0.38, cy + R * 0.78);
  ctx.quadraticCurveTo(cx, cy + R * 0.92, cx - R * 0.38, cy + R * 0.78);
  ctx.closePath(); ctx.fill();
  // cup ribs
  ctx.globalAlpha = 0.35; st(GROUND, 2);
  var ri;
  for (ri = -1; ri <= 1; ri++) {
    ctx.beginPath(); ctx.moveTo(cx + ri * R * 0.32, cy + R * 0.12); ctx.lineTo(cx + ri * R * 0.20, cy + R * 0.72); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // mouth disc (cream receptacle)
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(cx, cy + R * 0.06, R * 0.62, R * 0.20, 0, 0, Math.PI * 2); ctx.fill();

  // stamens
  var i, f, spread, ex, ey, mx, my;
  if (state.mode === 'scatter') {
    // scattered short drifting filaments, fading with scatter progress
    var sc = state.scatter;
    ctx.globalAlpha = 1 - sc * 0.85;
    for (i = 0; i < b.fils.length; i++) {
      f = b.fils[i];
      spread = f.len * (0.35 + 0.65 * open);
      var bx = cx + Math.cos(f.ang) * spread * 0.55, by = cy + Math.sin(f.ang) * spread * 0.42;
      var d = f.drift * (sc * sc * 0.6 + sc * 0.4);
      var sx = bx + Math.cos(f.driftAng) * d, sy = by + Math.sin(f.driftAng) * d + sc * 22;
      st(GOLD, 2);
      ctx.beginPath(); ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(f.ang) * 13, sy + Math.sin(f.ang) * 13); ctx.stroke();
      ctx.fillStyle = CREAM; circ(sx + Math.cos(f.ang) * 15, sy + Math.sin(f.ang) * 15, 2.1, true);
    }
    ctx.globalAlpha = 1;
  } else {
    // normal burst: quadratic filaments radiating from the cup mouth.
    // curl parameter: at open=0 filaments stay short and curled in;
    // at open=1 they reach full length and straighten outward.
    var reach = 0.28 + 0.72 * open;
    for (i = 0; i < b.fils.length; i++) {
      f = b.fils[i];
      var L = f.len * reach;
      var bendA = f.ang + f.bend * (1 - open);
      ex = cx + Math.cos(f.ang) * L;
      ey = cy + Math.sin(f.ang) * L * 0.92 - open * R * 0.10;
      mx = cx + Math.cos(bendA) * L * 0.52;
      my = cy + Math.sin(bendA) * L * 0.52;
      st(GOLD, Math.max(1.6, R * 0.028));
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
      ctx.fillStyle = CREAM;
      circ(ex, ey, Math.max(1.8, R * 0.045), true);
    }
    // centre tuft
    ctx.fillStyle = GOLD; circ(cx, cy, R * 0.10 * (0.5 + open * 0.5), true);
    ctx.fillStyle = CREAM; circ(cx, cy, R * 0.045, true);
  }

  // operculum cap: squashed dome. At open=0 it sits on the mouth;
  // as it opens it lifts, slides up-left and tips, still in frame.
  var lift = open;
  var capX = cx - lift * R * 0.95;
  var capY = cy - R * 0.18 - lift * R * 0.95;
  var capTilt = -lift * 0.55;
  ctx.save();
  ctx.translate(capX, capY); ctx.rotate(capTilt);
  ctx.fillStyle = ROSE;
  ctx.beginPath();
  ctx.moveTo(-R * 0.64, 0);
  ctx.quadraticCurveTo(-R * 0.60, -R * 0.52, -R * 0.10, -R * 0.60);
  ctx.quadraticCurveTo(0, -R * 0.70, R * 0.10, -R * 0.60);
  ctx.quadraticCurveTo(R * 0.60, -R * 0.52, R * 0.64, 0);
  ctx.quadraticCurveTo(0, R * 0.14, -R * 0.64, 0);
  ctx.closePath(); ctx.fill();
  // cap point
  ctx.beginPath(); ctx.moveTo(-R * 0.09, -R * 0.58); ctx.lineTo(0, -R * 0.80); ctx.lineTo(R * 0.09, -R * 0.58); ctx.closePath(); ctx.fill();
  // cap rim line
  ctx.globalAlpha = 0.45; st(BROWN, 2);
  ctx.beginPath(); ctx.moveTo(-R * 0.64, 0); ctx.quadraticCurveTo(0, R * 0.14, R * 0.64, 0); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
  // during scatter the cap has fallen: draw it dropped beside the cup
  if (state.mode === 'scatter') {
    // cap tint overlay is skipped; the lifted cap above already reads
  }
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var i;
  for (i = 0; i < BLOSSOMS.length; i++) drawStemAndLeaves(BLOSSOMS[i]);
  for (i = 0; i < BLOSSOMS.length; i++) drawBlossom(BLOSSOMS[i]);
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e), i, b, dx, dy;
  for (i = 0; i < BLOSSOMS.length; i++) {
    b = BLOSSOMS[i];
    dx = p[0] - b.x; dy = p[1] - b.y;
    if (dx * dx + dy * dy <= (b.r * 1.75) * (b.r * 1.75)) { b.tapT = T; return; }
  }
});

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
