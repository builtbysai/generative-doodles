<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thirty-Five Years, Woven</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0A0C; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0A0A0C';
var RED = '#D94A3A';      // energy
var GREEN = '#4E9A51';    // forest
var BLUE = '#2E7DC4';     // ocean
var CHAR = '#3A3A40';     // coal
var WHITE = '#F5F5F2';    // swatches and index cards
var GOLD = '#D9A441';     // shuttle thread
var PHASE0 = 26.7;        // fixed loop-phase offset: frame one is already weaving
var CYCLE = 70;           // seconds to weave all 35 rows (2 s per row)
var ROW_S = 2;            // seconds per row
// Fixed authored data: global CO2 emissions, gigatonnes, 1990-2024.
// Ordered and cumulative-looking, with the 2009 and 2020 dips. Never noise.
var YEARS = [];
var VALS = [22.7, 23.1, 22.9, 23.2, 23.6, 24.1, 24.8, 25.4, 25.5, 25.7,
            26.2, 26.8, 27.3, 28.1, 29.0, 29.8, 30.6, 31.4, 32.0, 31.5,
            32.8, 33.5, 34.1, 34.7, 35.0, 35.1, 35.2, 35.8, 36.4, 36.8,
            34.9, 36.3, 36.9, 37.3, 37.8];
var i;
for (i = 0; i < 35; i++) YEARS.push(1990 + i);
var VMAX = 38;
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0;
var dragging = false;
var selectedYear = -1;    // row index chosen by drag, -1 = none
var dragStartT = 0;
var placedW = 0, placedH = 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
// Sector mix for row i: energy share grows, forest and ocean shrink,
// coal takes the remainder. All four threads appear in every row.
function mix(i) {
  var f = i / 34;
  var e = 0.52 + 0.08 * f;
  var g = 0.14 - 0.05 * f;
  var b = 0.07 - 0.02 * f;
  return [e, g, b, 1 - e - g - b];
}
function pickColor(rnd, m) {
  var r = rnd();
  if (r < m[0]) return RED;
  if (r < m[0] + m[1]) return GREEN;
  if (r < m[0] + m[1] + m[2]) return BLUE;
  return CHAR;
}
function layout() {
  var phone = isPhone();
  var cardW = phone ? 92 : 150;
  var clothLeft = phone ? 12 : 24;
  var clothTop = phone ? 58 : 72;
  var clothW = VW - cardW - clothLeft - (phone ? 10 : 20);
  var clothH = VH - clothTop - (phone ? 12 : 24);
  return { phone: phone, cardW: cardW, clothLeft: clothLeft, clothTop: clothTop,
           clothW: clothW, clothH: clothH, rowH: clothH / 35 };
}
// Draw one row of woven thread, laid from the left up to laidFrac of its
// full length. Thread strokes are short horizontal dashes with a fixed
// per-row seed, so the same row always weaves the same way.
function drawRow(i, y, rowH, L, laidFrac, u, lx) {
  if (laidFrac <= 0 || L <= 0) return;
  var rnd = mulberry32(1587 * 1000 + i * 97 + 13);
  var m = mix(i);
  var laidLen = L * laidFrac;
  var step = Math.max(4, 7 * u);
  var x = lx;
  while (x < lx + laidLen) {
    var len = step * (0.7 + rnd() * 0.6);
    if (x + len > lx + laidLen) len = lx + laidLen - x;
    var jy = y + (rnd() - 0.5) * rowH * 0.42;
    var al = 0.82 + rnd() * 0.18;
    ctx.globalAlpha = Number(al.toFixed(4));
    ctx.fillStyle = pickColor(rnd, m);
    ctx.fillRect(x, jy - rowH * 0.20, len, rowH * 0.40);
    x += len + Math.max(1, 1.5 * u);
  }
  ctx.globalAlpha = 1;
}
// Gold shuttle bob at (x, y): a small diamond with a thread tail.
function drawShuttle(x, y, u) {
  var r = Math.max(4, 7 * u);
  ctx.fillStyle = GOLD;
  ctx.beginPath();
  ctx.moveTo(x, y - r * 1.6);
  ctx.lineTo(x + r, y);
  ctx.lineTo(x, y + r * 1.6);
  ctx.lineTo(x - r, y);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.moveTo(x + r * 0.45, y);
  ctx.arc(x, y, r * 0.45, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;
}
function draw(t) {
  lastT = t;
  size();
  var minDim = Math.min(VW, VH);
  var u = minDim / 900;
  var L = layout();
  var tt = t + PHASE0;                    // fixed-phase loop clock
  var cycleT = tt % CYCLE;
  var rowsDone = Math.floor(cycleT / ROW_S);
  var rowFrac = (cycleT % ROW_S) / ROW_S;
  var curRow = rowsDone;                  // row the shuttle is weaving now
  var curFrac = rowFrac;
  if (dragging && selectedYear >= 0) {
    curRow = selectedYear;
    curFrac = ((t - dragStartT) % ROW_S) / ROW_S;
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  // Palette swatches in the top margin: thread colours with white labels.
  var sw = [
    { c: RED, label: 'ENERGY' }, { c: GREEN, label: 'FOREST' },
    { c: BLUE, label: 'OCEAN' }, { c: CHAR, label: 'COAL' },
    { c: GOLD, label: 'SHUTTLE' }
  ];
  var fs = Math.max(9, Math.round(minDim * 0.016));
  ctx.font = fs + 'px sans-serif';
  ctx.textBaseline = 'middle';
  var sx = L.clothLeft, sy = L.clothTop / 2;
  var sq = Math.max(10, Math.round(13 * u));
  var k;
  for (k = 0; k < sw.length; k++) {
    ctx.fillStyle = sw[k].c;
    ctx.fillRect(sx, sy - sq / 2, sq, sq);
    ctx.strokeStyle = WHITE;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1;
    ctx.strokeRect(sx + 0.5, sy - sq / 2 + 0.5, sq - 1, sq - 1);
    ctx.globalAlpha = 1;
    ctx.fillStyle = WHITE;
    ctx.fillText(sw[k].label, sx + sq + 6, sy + 1);
    sx += sq + 6 + ctx.measureText(sw[k].label).width + (L.phone ? 12 : 22);
    if (sx > VW - L.cardW - 40) break;
  }
  // Cloth frame: faint side rails.
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = CHAR;
  ctx.fillRect(L.clothLeft - 1, L.clothTop, 1, L.clothH);
  ctx.fillRect(L.clothLeft + L.clothW + 1, L.clothTop, 1, L.clothH);
  ctx.globalAlpha = 1;
  // Warp: faint vertical threads across the whole cloth.
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = WHITE;
  var wx;
  for (wx = L.clothLeft; wx < L.clothLeft + L.clothW; wx += Math.max(6, 9 * u)) {
    ctx.fillRect(wx, L.clothTop, 1, L.clothH);
  }
  ctx.globalAlpha = 1;
  // Woven rows, top-down, year after year.
  var r;
  for (r = 0; r < 35; r++) {
    var y = L.clothTop + r * L.rowH + L.rowH / 2;
    var len = (VALS[r] / VMAX) * L.clothW;
    var laid = 0;
    if (r < rowsDone) laid = 1;
    if (r === curRow) {
      // Shuttle sweeps out laying thread, then sweeps back; the laid
      // extent trails the shuttle's furthest reach by a small delay.
      var sxF = curFrac < 0.5 ? curFrac * 2 : 2 - curFrac * 2;
      var maxSx = curFrac < 0.5 ? sxF : 1;
      laid = Math.max(0, maxSx - 0.06);
    }
    drawRow(r, y, L.rowH, len, laid, u, L.clothLeft);
    // Selected row: gold underline so the chosen year reads.
    if (selectedYear === r) {
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = GOLD;
      ctx.fillRect(L.clothLeft, y + L.rowH * 0.42, len, Math.max(1, 1.5 * u));
      ctx.globalAlpha = 1;
    }
  }
  // The shuttle, laying the current row.
  if (curRow < 35) {
    var cy = L.clothTop + curRow * L.rowH + L.rowH / 2;
    var clen = (VALS[curRow] / VMAX) * L.clothW;
    var cSx = curFrac < 0.5 ? curFrac * 2 : 2 - curFrac * 2;
    var shx = L.clothLeft + cSx * clen;
    // Gold pointer thread from the row start to the shuttle.
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = GOLD;
    ctx.fillRect(L.clothLeft, cy - Math.max(0.75, 0.8 * u), Math.max(0, shx - L.clothLeft), Math.max(1.5, 1.6 * u));
    ctx.globalAlpha = 1;
    drawShuttle(shx, cy, u);
  }
  // Index cards along the right edge: slow vertical scroll of white
  // cards carrying year and value. FillText labels, not HTML.
  var cardX = VW - L.cardW - (L.phone ? 6 : 12);
  var cardWpx = L.cardW - (L.phone ? 4 : 8);
  var cardH = Math.max(34, Math.round(44 * u));
  var gap = Math.max(8, Math.round(10 * u));
  var stepY = cardH + gap;
  var total = 35 * stepY;
  var scroll = (t * 14) % total;
  var cfs = Math.max(9, Math.round(minDim * 0.017));
  var cfs2 = Math.max(8, Math.round(minDim * 0.014));
  ctx.textBaseline = 'alphabetic';
  for (k = 0; k < 35; k++) {
    var cyy = L.clothTop + k * stepY - scroll;
    cyy = ((cyy - L.clothTop) % total + total) % total + L.clothTop;
    if (cyy > VH - 6 || cyy + cardH < L.clothTop) continue;
    var isSel = (selectedYear === k);
    ctx.fillStyle = WHITE;
    ctx.fillRect(cardX, cyy, cardWpx, cardH);
    if (isSel) {
      ctx.strokeStyle = GOLD;
      ctx.lineWidth = Math.max(2, 2.5 * u);
      ctx.strokeRect(cardX + 1, cyy + 1, cardWpx - 2, cardH - 2);
    }
    ctx.fillStyle = GROUND;
    ctx.font = 'bold ' + cfs + 'px sans-serif';
    ctx.fillText(String(YEARS[k]), cardX + 8, cyy + cfs + 7);
    ctx.font = cfs2 + 'px sans-serif';
    ctx.fillText(VALS[k].toFixed(1) + ' Gt', cardX + 8, cyy + cfs + 7 + cfs2 + 5);
  }
  if (typeof window !== 'undefined') {
    window.__p1587 = {
      t: t, cycleT: cycleT, rowsDone: rowsDone, curRow: curRow,
      selectedYear: selectedYear, dragging: dragging, phone: isPhone()
    };
  }
}
function yearFromX(x) {
  var L = layout();
  var fx = (x - L.clothLeft) / L.clothW;
  if (fx < 0) fx = 0;
  if (fx > 0.999) fx = 0.999;
  return Math.floor(fx * 35);
}
function onDown(e) {
  var x = (e.clientX !== undefined) ? e.clientX : e.touches[0].clientX;
  dragging = true;
  selectedYear = yearFromX(x);
  dragStartT = lastT;
  draw(lastT);
}
function onMove(e) {
  if (!dragging) return;
  var x = (e.clientX !== undefined) ? e.clientX : e.touches[0].clientX;
  selectedYear = yearFromX(x);
  draw(lastT);
}
function onUp() {
  dragging = false;
  draw(lastT);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof document !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}
draw(0);
var startT = null;
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
