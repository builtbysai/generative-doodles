<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№30 · Maze</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2ecdc; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(60,54,44,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(242,236,220,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another maze</div>
<script>
'use strict';
// No30 Maze.
// A perfect maze from a recursive backtracker: every cell visited,
// every wall either standing or knocked down by the carving rule, no
// loops, exactly one path between any two cells. It is drawn as
// walls, one charcoal line weight on cream, with the single solution
// path from corner to corner traced in vermilion. The maze is the
// rule made visible; the solution is a fact about it, not a hint.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '30', 10) || 30;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f2ecdc';
const COLS = 22, ROWS = 22;

function compose(s) {
  const rnd = mulberry32(s);
  // walls[i][j] = {n,e,s,w} true = wall stands
  const walls = [];
  const visited = [];
  for (let j = 0; j < ROWS; j++) {
    walls.push([]); visited.push([]);
    for (let i = 0; i < COLS; i++) { walls[j].push({ n: 1, e: 1, s: 1, w: 1 }); visited[j].push(false); }
  }
  const stack = [[0, 0]];
  visited[0][0] = true;
  const dirs = [[0, -1, 'n', 's'], [1, 0, 'e', 'w'], [0, 1, 's', 'n'], [-1, 0, 'w', 'e']];
  const parent = new Map();
  while (stack.length) {
    const [ci, cj] = stack[stack.length - 1];
    const options = [];
    for (const [di, dj, wall, opp] of dirs) {
      const ni = ci + di, nj = cj + dj;
      if (ni >= 0 && ni < COLS && nj >= 0 && nj < ROWS && !visited[nj][ni]) options.push([ni, nj, wall, opp]);
    }
    if (!options.length) { stack.pop(); continue; }
    const [ni, nj, wall, opp] = options[(rnd() * options.length) | 0];
    walls[cj][ci][wall] = 0;
    walls[nj][ni][opp] = 0;
    visited[nj][ni] = true;
    parent.set(ni + ',' + nj, ci + ',' + cj);
    stack.push([ni, nj]);
  }
  // solution: walk parents from far corner back to origin
  const path = [];
  let key = (COLS - 1) + ',' + (ROWS - 1);
  while (key) {
    const [pi, pj] = key.split(',').map(Number);
    path.push([pi, pj]);
    key = parent.get(key);
  }
  path.reverse();
  return { walls, path };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h) * 0.92;
  const ox = (w - S) / 2, oy = (h - S) / 2;
  const cell = S / COLS, cellY = S / ROWS;

  // solution path first, underneath the walls
  ctx.strokeStyle = 'rgba(179,64,42,0.75)';
  ctx.lineWidth = Math.max(1.2, cell * 0.16);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  p.path.forEach(([i, j], idx) => {
    const x = ox + (i + 0.5) * cell, y = oy + (j + 0.5) * cellY;
    if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  ctx.strokeStyle = 'rgba(43,40,34,0.9)';
  ctx.lineWidth = Math.max(0.9, S / 800);
  ctx.beginPath();
  for (let j = 0; j < ROWS; j++) {
    for (let i = 0; i < COLS; i++) {
      const wl = p.walls[j][i];
      const x = ox + i * cell, y = oy + j * cellY;
      if (wl.n) { ctx.moveTo(x, y); ctx.lineTo(x + cell, y); }
      if (wl.w) { ctx.moveTo(x, y); ctx.lineTo(x, y + cellY); }
      if (j === ROWS - 1 && wl.s) { ctx.moveTo(x, y + cellY); ctx.lineTo(x + cell, y + cellY); }
      if (i === COLS - 1 && wl.e) { ctx.moveTo(x + cell, y); ctx.lineTo(x + cell, y + cellY); }
    }
  }
  ctx.stroke();
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
