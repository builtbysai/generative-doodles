<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plotted, Not Printed</title>
<style>
html, body { margin: 0; padding: 0; background: #F4F1E8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F4F1E8';
var INK = '#1A1A1A';
var POOL = '#0E0E0E';
var PLATE = '#1A1A1A';
var PLATE_LINE = 'rgba(244,241,232,0.45)';
var TITLE_INK = '#F4F1E8';
var HINT_INK = '#F4F1E8';
var FIRST_T = 100;
var PARK_SECS = 10;
var BREATH_SECS = 8;
/* A plotter pen draws charcoal bars on a sheet, slowly and
   imperfectly: the program is precise, the pen wobbles, pools ink
   at stroke starts, and sometimes lifts a fraction early, leaving
   a hairline gap. The arm parks, the paper rests, a fresh sheet
   feeds, and the next variation begins. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* Deterministic hash noise in [0, 1), from an integer key. */
function hash01(n) {
  var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
/* Four fixed variations. Draw time is the pen time; park and breath
   are the same for every sheet. Total period is 1062 seconds. */
var VARIATIONS = [
  { seed: 167701, draw: 252 },
  { seed: 167702, draw: 228 },
  { seed: 167703, draw: 270 },
  { seed: 167704, draw: 240 }
];
var PERIOD = 0;
(function () {
  var i;
  for (i = 0; i < VARIATIONS.length; i++) PERIOD += VARIATIONS[i].draw + PARK_SECS + BREATH_SECS;
})();
function cycleAt(t) {
  var mod = ((t % PERIOD) + PERIOD) % PERIOD;
  var i, start = 0;
  for (i = 0; i < VARIATIONS.length; i++) {
    var total = VARIATIONS[i].draw + PARK_SECS + BREATH_SECS;
    if (mod < start + total) {
      var local = mod - start;
      var phase = local < VARIATIONS[i].draw ? 'draw'
        : (local < VARIATIONS[i].draw + PARK_SECS ? 'park' : 'breath');
      return { vi: i, local: local, phase: phase, draw: VARIATIONS[i].draw };
    }
    start += total;
  }
  return { vi: 0, local: 0, phase: 'draw', draw: VARIATIONS[0].draw };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Landscape sheet, centered, with room above for the arm mount. */
function sheetRect() {
  var sw = Math.min(VW * 0.82, VH * 1.28);
  var sh = sw * 0.68;
  var cx = VW / 2, cy = VH * 0.54;
  return { x: cx - sw / 2, y: cy - sh / 2, w: sw, h: sh, cx: cx, cy: cy };
}
function sheetScale(sh) { return clamp(sh.w / 880, 0.35, 1.25); }
function parkPoint(sh) {
  return { x: sh.x + sh.w - sh.w * 0.06, y: sh.y - 26 * sheetScale(sh) };
}
/* Bar layout for one variation, from its fixed seed only. Widths
   come from weighted probabilities: hairline, narrow, medium, wide.
   One column dissolves into crosshatch; two bars lift early. */
function buildLayout(vi) {
  var v = VARIATIONS[vi];
  var rng = mulberry32(v.seed);
  var count = 26 + Math.floor(rng() * 7);
  var raw = [], i, r;
  for (i = 0; i < count; i++) {
    r = rng();
    var wf = r < 0.18 ? 0.005 : (r < 0.52 ? 0.013 : (r < 0.84 ? 0.028 : 0.052));
    var gf = 0.006 + rng() * 0.014;
    var hf = rng() < 0.7 ? 0.88 + rng() * 0.12 : 0.55 + rng() * 0.30;
    raw.push({ wf: wf, gf: gf, hf: hf });
  }
  var totalW = 0;
  for (i = 0; i < count; i++) totalW += raw[i].wf + raw[i].gf;
  var cross = Math.floor(rng() * count);
  var liftA = Math.floor(rng() * count);
  var liftB = Math.floor(rng() * count);
  if (liftB === liftA) liftB = (liftB + 5) % count;
  var bars = [], xFrac = 0;
  for (i = 0; i < count; i++) {
    bars.push({
      xFrac: xFrac / totalW,
      wFrac: raw[i].wf / totalW,
      hFrac: raw[i].hf,
      cross: i === cross,
      lift: i === liftA || i === liftB,
      idx: i
    });
    xFrac += raw[i].wf + raw[i].gf;
  }
  /* Draw time per bar is proportional to its height; the crosshatch
     column takes longer because it is drawn twice over. */
  var wSum = 0;
  for (i = 0; i < count; i++) wSum += bars[i].hFrac * (bars[i].cross ? 1.7 : 1);
  var travelEach = 0.8;
  var drawAvail = v.draw - count * travelEach - 1.2;
  var cursor = 0;
  var segs = [];
  for (i = 0; i < count; i++) {
    var dur = drawAvail * bars[i].hFrac * (bars[i].cross ? 1.7 : 1) / wSum;
    segs.push({ type: 'travel', dur: i === 0 ? 1.2 : travelEach, bar: i, t0: cursor });
    cursor += segs[segs.length - 1].dur;
    segs.push({ type: 'draw', dur: dur, bar: i, t0: cursor });
    cursor += dur;
    bars[i].t0 = segs[segs.length - 1].t0;
    bars[i].dur = dur;
  }
  return { bars: bars, segs: segs, count: count, cross: cross };
}
function barGeom(sh, bar) {
  var mx = sh.w * 0.07, my = sh.h * 0.09;
  var ix = sh.x + mx, iy = sh.y + my;
  var iw = sh.w - 2 * mx, ih = sh.h - 2 * my;
  return {
    x: ix + bar.xFrac * iw,
    w: Math.max(1.5, bar.wFrac * iw),
    y: iy,
    h: bar.hFrac * ih
  };
}
/* Wobble is a closed-form function of bar index and height, so the
   same stroke always wobbles the same way. Amplitude grows with
   pen speed, which is steady here, so it stays small and constant. */
function wobble(barIdx, y, s) {
  return (Math.sin(y * 0.045 + barIdx * 2.39) * 0.9
    + Math.sin(y * 0.013 + barIdx * 5.17) * 0.7) * 1.1 * s;
}
function drawBar(sh, layout, bar, frac) {
  var g = barGeom(sh, bar);
  var s = sheetScale(sh);
  var drawnH = frac * g.h;
  if (drawnH <= 0) return;
  var step = Math.max(4, g.h / 90);
  var y, yEnd = g.y + drawnH;
  if (bar.cross) {
    /* Crosshatch column: diagonal lines both ways, clipped to the
       column, denser toward the bottom where the bar dissolves. */
    ctx.save();
    ctx.beginPath();
    ctx.rect(g.x, g.y, g.w, drawnH);
    ctx.clip();
    var spacing = Math.max(5, 8 * s);
    var k, x0;
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1, 1.2 * s);
    for (k = -Math.ceil(g.h / spacing); k < Math.ceil((g.w + g.h) / spacing); k++) {
      x0 = g.x + k * spacing;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(x0, g.y);
      ctx.lineTo(x0 + drawnH, yEnd);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x0 + drawnH, g.y);
      ctx.lineTo(x0, yEnd);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    /* A solid dark cap at the stroke start, where the ink pooled. */
    ctx.fillStyle = POOL;
    ctx.fillRect(g.x, g.y, g.w, Math.min(6 * s, drawnH));
    return;
  }
  for (y = g.y; y < yEnd; y += step) {
    var segH = Math.min(step, yEnd - y);
    var f = (y - g.y) / g.h;
    /* Early lift: a hairline gap of bare paper near the foot. */
    if (bar.lift && f > 0.82 && f < 0.865) continue;
    var dens = 0.94 + 0.06 * hash01(bar.idx * 131 + Math.floor(y / 7));
    var segW = g.w * (0.95 + 0.10 * hash01(bar.idx * 57 + Math.floor(y / 11)));
    var cx = g.x + g.w / 2 + wobble(bar.idx, y - g.y, s);
    var pooled = (y - g.y) < 12 * s;
    ctx.globalAlpha = pooled ? 1 : dens;
    ctx.fillStyle = pooled ? POOL : INK;
    ctx.fillRect(cx - segW / 2, y, segW, segH + 0.5);
  }
  ctx.globalAlpha = 1;
  /* Ink pool blob where the pen first landed, just wider than the bar. */
  var br = Math.max(1.5, Math.min(g.w * 0.5 + 1.5 * s, 6.5 * s));
  ctx.fillStyle = POOL;
  ctx.beginPath();
  ctx.moveTo(g.x + g.w / 2 + br, g.y + 1);
  ctx.arc(g.x + g.w / 2, g.y + 1, br, 0, TAU);
  ctx.fill();
}
function penTarget(sh, layout, cyc) {
  var park = parkPoint(sh);
  if (cyc.phase === 'breath') return { x: park.x, y: park.y, down: false };
  if (cyc.phase === 'park') {
    var last = layout.bars[layout.count - 1];
    var lg = barGeom(sh, last);
    var from = { x: lg.x + lg.w / 2, y: lg.y + lg.h };
    var f = smooth(clamp((cyc.local - cyc.draw) / PARK_SECS, 0, 1));
    return { x: from.x + (park.x - from.x) * f, y: from.y + (park.y - from.y) * f, down: false };
  }
  var local = cyc.local;
  var i, seg;
  for (i = 0; i < layout.segs.length; i++) {
    seg = layout.segs[i];
    if (local >= seg.t0 && local < seg.t0 + seg.dur) {
      var bar = layout.bars[seg.bar];
      var bg = barGeom(sh, bar);
      if (seg.type === 'draw') {
        var bf = clamp((local - seg.t0) / seg.dur, 0, 1);
        var py = bg.y + bf * bg.h;
        return { x: bg.x + bg.w / 2 + wobble(bar.idx, bf * bg.h, sheetScale(sh)), y: py, down: true, bar: bar, frac: bf };
      }
      /* Travel: pen lifted, moving to the next bar top. */
      var tf = smooth(clamp((local - seg.t0) / seg.dur, 0, 1));
      var prev = seg.bar === 0 ? park : (function () {
        var pb = barGeom(sh, layout.bars[seg.bar - 1]);
        return { x: pb.x + pb.w / 2, y: pb.y + pb.h };
      })();
      var tx = bg.x + bg.w / 2, ty = bg.y;
      return { x: prev.x + (tx - prev.x) * tf, y: prev.y + (ty - prev.y) * tf - Math.sin(tf * Math.PI) * 8 * sheetScale(sh), down: false };
    }
  }
  var lb = layout.bars[layout.count - 1];
  var lgb = barGeom(sh, lb);
  return { x: lgb.x + lgb.w / 2, y: lgb.y + lgb.h, down: false };
}
/* Two-segment IK arm from a mount just above the sheet to the pen.
   Mount and segment lengths are sheet-scaled, so the arm stays
   compact and minimal and the paper stays the hero on every size;
   viewport-scaled segments made the arm dominate tall phones. */
function drawArm(sh, target) {
  var s = sheetScale(sh);
  var bx = sh.cx + sh.w * 0.30, by = sh.y - 20 * s;
  var dx = target.x - bx, dy = target.y - by;
  var d0 = Math.sqrt(dx * dx + dy * dy);
  /* Segment length follows the pen distance, so the elbow never
     swings outside the viewport on narrow screens. */
  var L1 = clamp(d0 * 0.58, sh.w * 0.22, sh.w * 0.42);
  var L2 = L1;
  var d = Math.sqrt(dx * dx + dy * dy);
  d = clamp(d, Math.abs(L1 - L2) + 4, L1 + L2 - 4);
  var ang = Math.atan2(dy, dx);
  var cosA = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
  var a = Math.acos(cosA);
  /* Pick the elbow that stays inside the viewport; prefer the
     right-hand fold when both fit. */
  var e1x = bx + L1 * Math.cos(ang - a), e1y = by + L1 * Math.sin(ang - a);
  var e2x = bx + L1 * Math.cos(ang + a), e2y = by + L1 * Math.sin(ang + a);
  var ex = e1x, ey = e1y;
  if ((e1x < 10 || e1x > VW - 10 || e1y < 0 || e1y > VH) &&
      e2x >= 10 && e2x <= VW - 10 && e2y >= 0 && e2y <= VH) {
    ex = e2x; ey = e2y;
  }
  /* Mount block on the top edge. */
  ctx.fillStyle = INK;
  ctx.fillRect(bx - 16 * s, by, 32 * s, 10 * s);
  ctx.strokeStyle = INK;
  ctx.lineCap = 'round';
  ctx.lineWidth = 10 * s;
  ctx.beginPath();
  ctx.moveTo(bx, by + 6 * s);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.lineWidth = 7 * s;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(target.x, target.y);
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(bx + 8 * s, by + 6 * s);
  ctx.arc(bx, by + 6 * s, 8 * s, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(ex + 6 * s, ey);
  ctx.arc(ex, ey, 6 * s, 0, TAU);
  ctx.fill();
  /* Pen holder and nib at the target. */
  ctx.lineWidth = 5 * s;
  ctx.beginPath();
  ctx.moveTo(target.x, target.y - 14 * s);
  ctx.lineTo(target.x, target.y);
  ctx.stroke();
  ctx.fillStyle = POOL;
  ctx.beginPath();
  ctx.moveTo(target.x + 2.5 * s, target.y);
  ctx.arc(target.x, target.y, 2.5 * s, 0, TAU);
  ctx.fill();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Plotted, Not Printed').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Plotted, Not Printed').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 15').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Plotted, Not Printed', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 15', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var cyc = cycleAt(t);
  var layout = buildLayout(cyc.vi);
  var sh = sheetRect();
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  /* The sheet: same paper, edged in ink, with corner ticks. */
  ctx.fillStyle = PAPER;
  ctx.fillRect(sh.x, sh.y, sh.w, sh.h);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(sh.x + 0.5, sh.y + 0.5, sh.w - 1, sh.h - 1);
  var tick = 10 * sheetScale(sh);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sh.x - tick, sh.y); ctx.lineTo(sh.x + tick, sh.y);
  ctx.moveTo(sh.x, sh.y - tick); ctx.lineTo(sh.x, sh.y + tick);
  ctx.moveTo(sh.x + sh.w - tick, sh.y); ctx.lineTo(sh.x + sh.w + tick, sh.y);
  ctx.moveTo(sh.x + sh.w, sh.y - tick); ctx.lineTo(sh.x + sh.w, sh.y + tick);
  ctx.stroke();
  var target = penTarget(sh, layout, cyc);
  var i, bar;
  for (i = 0; i < layout.count; i++) {
    bar = layout.bars[i];
    var frac = 0;
    if (cyc.phase !== 'draw') frac = 1;
    else if (cyc.local >= bar.t0 + bar.dur) frac = 1;
    else if (cyc.local >= bar.t0) frac = (cyc.local - bar.t0) / bar.dur;
    drawBar(sh, layout, bar, frac);
  }
  drawArm(sh, target);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    cycleAt: function (t) { return cycleAt(t); },
    barCount: function () { return buildLayout(cycleAt(FIRST_T).vi).count; }
  };
}
/* ---- frame one: t = FIRST_T, about 40 percent through the first
   sheet, pen mid-stroke, pooling visible ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
