<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoke Word</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0B0B0B; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var BLACK = '#0B0B0B';
  var SMOKE = '#EDEDE8';

  var WORD_SECONDS = 40.0;   // one word per 40s block, morph in the last 4.5s
  var MORPH = 4.5;
  var PHASE = 14.0;          // fixed pre-roll: word 0 fully formed, wobble mid-phase
  var STROKE = 1.5;          // tube thickness in letter units (letter height = 7)

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ------------- chunky letter skeletons, y-down, cap height 7 -------------
  // paths: polylines in letter-local units. counters: black blobs drawn over
  // the tube so the letter reads through its negative space.
  function ellipsePts(cx, cy, rx, ry, n) {
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var a = (i / n) * Math.PI * 2;
      pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
    }
    return pts;
  }

  var LETTERS = {
    A: { w: 4.6, paths: [
        [[0, 7], [2.3, 0], [4.6, 7]],
        [[1.0, 4.9], [3.6, 4.9]]
      ],
      counters: [{ tri: [[2.3, 2.75], [1.82, 4.05], [2.78, 4.05]] }] },
    B: { w: 4.0, paths: [
        [[0, 0], [0, 7]],
        [[0, 0.2], [1.8, 0.1], [2.85, 0.95], [2.85, 2.25], [1.8, 3.3], [0, 3.3]],
        [[0, 3.3], [2.0, 3.3], [3.1, 4.3], [3.1, 5.8], [2.0, 6.9], [0, 7]]
      ],
      counters: [{ x: 1.42, y: 1.68, rx: 0.56, ry: 0.68 }, { x: 1.5, y: 5.12, rx: 0.6, ry: 0.78 }] },
    D: { w: 4.2, paths: [
        [[0, 0], [0, 7]],
        [[0, 0.15], [1.95, 0.05], [3.5, 1.5], [3.6, 3.5], [3.5, 5.5], [1.95, 6.95], [0, 7]]
      ],
      counters: [{ x: 1.7, y: 3.5, rx: 0.74, ry: 1.65 }] },
    E: { w: 3.6, paths: [
        [[3.5, 0.1], [0, 0], [0, 7], [3.6, 6.9]],
        [[0, 3.5], [2.8, 3.5]]
      ],
      counters: [] },
    G: { w: 4.2, paths: [
        [[3.95, 1.55], [2.95, 0.5], [1.65, 0.08], [0.6, 0.95], [0.18, 3.5], [0.6, 6.0], [1.7, 6.92], [3.2, 6.7], [3.95, 5.6], [3.95, 4.25], [2.6, 4.25]]
      ],
      counters: [{ x: 1.82, y: 3.45, rx: 0.6, ry: 1.25 }] },
    K: { w: 3.8, paths: [
        [[0, 0], [0, 7]],
        [[3.6, 0], [0.25, 3.35]],
        [[1.25, 2.65], [3.8, 7]]
      ],
      counters: [] },
    L: { w: 3.4, paths: [
        [[0, 0], [0, 7], [3.4, 7]]
      ],
      counters: [] },
    M: { w: 4.6, paths: [
        [[0, 7], [0, 0], [2.3, 3.6], [4.6, 0], [4.6, 7]]
      ],
      counters: [] },
    N: { w: 4.2, paths: [
        [[0, 7], [0, 0], [4.2, 7], [4.2, 0]]
      ],
      counters: [] },
    O: { w: 4.4, paths: [ ellipsePts(2.2, 3.5, 1.92, 3.08, 28) ],
      counters: [{ x: 2.2, y: 3.5, rx: 0.82, ry: 1.78 }] },
    P: { w: 3.8, paths: [
        [[0, 0], [0, 7]],
        [[0, 0.15], [1.95, 0.05], [3.15, 0.95], [3.15, 2.4], [1.95, 3.5], [0, 3.5]]
      ],
      counters: [{ x: 1.48, y: 1.78, rx: 0.56, ry: 0.68 }] },
    R: { w: 3.8, paths: [
        [[0, 0], [0, 7]],
        [[0, 0.15], [1.95, 0.05], [3.15, 0.95], [3.15, 2.4], [1.95, 3.5], [0, 3.5]],
        [[1.35, 3.3], [3.6, 7]]
      ],
      counters: [{ x: 1.48, y: 1.78, rx: 0.56, ry: 0.68 }] },
    S: { w: 3.8, paths: [
        [[3.5, 1.25], [2.6, 0.2], [1.4, 0.08], [0.42, 0.9], [0.3, 2.2], [1.0, 3.2], [2.75, 4.2], [3.5, 5.15], [3.32, 6.3], [2.2, 7.0], [0.9, 6.82], [0.22, 5.9]]
      ],
      counters: [] },
    T: { w: 4.0, paths: [
        [[0, 0], [4, 0]],
        [[2, 0], [2, 7]]
      ],
      counters: [] },
    U: { w: 4.2, paths: [
        [[0, 0], [0, 4.55], [0.5, 6.3], [1.5, 6.98], [2.7, 6.98], [3.7, 6.3], [4.2, 4.55], [4.2, 0]]
      ],
      counters: [] },
    V: { w: 4.2, paths: [
        [[0, 0], [2.1, 7], [4.2, 0]]
      ],
      counters: [] }
  };

  var WORDS = ['PLOVA', 'KORVA', 'TUMLO', 'SENKA', 'VELDO', 'MORVA',
               'TOLPA', 'BRUMO', 'SOLKA', 'VUNDA', 'PERLO', 'GAVRO',
               'KUVARA', 'TOLVAN', 'MEROKA', 'SOLVEN'];

  // seeded word sequence (seed 491 puts PLOVA first)
  var SEQ = (function () {
    var rng = mulberry32(491);
    var arr = WORDS.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  })();

  // Smooth a polyline with quadratic midpoints and sample it densely.
  function samplePath(raw, step) {
    var sm = [raw[0]];
    var i, s;
    for (i = 1; i < raw.length - 1; i++) {
      var mx = (raw[i][0] + raw[i + 1][0]) / 2;
      var my = (raw[i][1] + raw[i + 1][1]) / 2;
      var px = sm[sm.length - 1][0], py = sm[sm.length - 1][1];
      var cx = raw[i][0], cy = raw[i][1];
      var approx = Math.abs(cx - px) + Math.abs(cy - py) + Math.abs(mx - cx) + Math.abs(my - cy);
      var steps = Math.max(3, Math.round(approx / step));
      for (s = 1; s <= steps; s++) {
        var u = s / steps;
        sm.push([(1 - u) * (1 - u) * px + 2 * (1 - u) * u * cx + u * u * mx,
                 (1 - u) * (1 - u) * py + 2 * (1 - u) * u * cy + u * u * my]);
      }
    }
    sm.push(raw[raw.length - 1]);
    return sm;
  }

  function buildWord(idx) {
    var word = SEQ[idx % SEQ.length];
    var rng = mulberry32(491100 + idx * 131);
    var spacing = 1.12;
    var letters = [];
    var ox = 0, i, k;
    for (i = 0; i < word.length; i++) {
      var L = LETTERS[word[i]];
      var paths = [];
      for (k = 0; k < L.paths.length; k++) paths.push(samplePath(L.paths[k], 0.22));
      var puffs = [];
      for (k = 0; k < paths.length; k++) {
        var pts = paths[k];
        var acc = 0;
        for (var s2 = 1; s2 < pts.length; s2++) {
          var dx = pts[s2][0] - pts[s2 - 1][0], dy = pts[s2][1] - pts[s2 - 1][1];
          acc += Math.sqrt(dx * dx + dy * dy);
          if (acc >= 0.55) {
            acc = 0;
            puffs.push({ x: pts[s2][0], y: pts[s2][1], r: 0.78 + rng() * 0.22, ph: rng() * Math.PI * 2 });
          }
        }
      }
      letters.push({ ch: word[i], ox: ox, paths: paths, puffs: puffs, counters: L.counters, ph: rng() * Math.PI * 2 });
      ox += L.w + spacing;
    }
    return { word: word, letters: letters, totalAdv: ox - spacing };
  }

  var cache = {};
  function wordFor(idx) {
    if (!cache[idx]) cache[idx] = buildWord(idx);
    return cache[idx];
  }

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE + tapJump);
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  var tapJump = 0;
  function reseed() {
    var t = PHASE + tapJump + elapsed();
    var boundary = (Math.floor(t / WORD_SECONDS) + 1) * WORD_SECONDS;
    tapJump += (boundary - 2.0) - t; // land inside the morph window: new word blobs in
  }
  var startStamp = null;
  function elapsed() { return startStamp === null ? 0 : startStamp; }
  if (canvas.addEventListener) canvas.addEventListener('pointerdown', reseed);
  if (canvas.addEventListener) canvas.addEventListener('touchstart', reseed);

  function drawMonoLine(text, y, size, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = SMOKE;
    ctx.font = '600 ' + size + 'px ui-monospace, Menlo, Consolas, monospace';
    ctx.textBaseline = 'middle';
    var spacingPx = size * 0.35;
    var widths = [], total = 0, i;
    for (i = 0; i < text.length; i++) {
      var w = ctx.measureText(text[i]).width;
      widths.push(w);
      total += w + spacingPx;
    }
    total -= spacingPx;
    var x = (W - total) / 2;
    for (i = 0; i < text.length; i++) {
      ctx.fillText(text[i], x, y);
      x += widths[i] + spacingPx;
    }
    ctx.restore();
  }

  function smooth(u) { return u * u * (3 - 2 * u); }

  function drawWord(data, cx, cy, scale, alpha, t, wobAmp, grow) {
    if (alpha <= 0.004) return;
    var wt = t * (Math.PI * 2 / 8); // 8s wobble period
    var li, k, s;
    for (li = 0; li < data.letters.length; li++) {
      var L = data.letters[li];
      var lox = Math.sin(wt + L.ph) * 0.055 * wobAmp;
      var loy = Math.cos(wt * 0.9 + L.ph * 1.7) * 0.045 * wobAmp;
      var bx = cx + (L.ox + lox) * scale;
      var by = cy + loy * scale;

      ctx.save();
      // halo
      ctx.globalAlpha = alpha * 0.10;
      ctx.strokeStyle = SMOKE;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = STROKE * 1.6 * scale * grow;
      for (k = 0; k < L.paths.length; k++) {
        var pts = L.paths[k];
        ctx.beginPath();
        ctx.moveTo(bx + pts[0][0] * scale, by + pts[0][1] * scale);
        for (s = 1; s < pts.length; s++) ctx.lineTo(bx + pts[s][0] * scale, by + pts[s][1] * scale);
        ctx.stroke();
      }
      // cloud puffs scalloping the tube edge
      ctx.fillStyle = SMOKE;
      for (k = 0; k < L.puffs.length; k++) {
        var pf = L.puffs[k];
        var rr = pf.r * scale * grow * (1 + 0.10 * Math.sin(wt * 2 + pf.ph) * wobAmp);
        ctx.globalAlpha = alpha * 0.5;
        ctx.beginPath();
        ctx.arc(bx + pf.x * scale, by + pf.y * scale, rr, 0, Math.PI * 2);
        ctx.fill();
      }
      // main tube
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = SMOKE;
      ctx.lineWidth = STROKE * scale * grow;
      for (k = 0; k < L.paths.length; k++) {
        var p2 = L.paths[k];
        ctx.beginPath();
        ctx.moveTo(bx + p2[0][0] * scale, by + p2[0][1] * scale);
        for (s = 1; s < p2.length; s++) ctx.lineTo(bx + p2[s][0] * scale, by + p2[s][1] * scale);
        ctx.stroke();
      }
      // counters: black negative space trapped inside the smoke
      ctx.fillStyle = BLACK;
      for (k = 0; k < L.counters.length; k++) {
        var cn = L.counters[k];
        if (cn.tri) {
          ctx.globalAlpha = alpha * 0.28;
          ctx.beginPath();
          var cxm = (cn.tri[0][0] + cn.tri[1][0] + cn.tri[2][0]) / 3;
          var cym = (cn.tri[0][1] + cn.tri[1][1] + cn.tri[2][1]) / 3;
          for (s = 0; s < 3; s++) {
            var vx = bx + (cxm + (cn.tri[s][0] - cxm) * 1.22) * scale;
            var vy = by + (cym + (cn.tri[s][1] - cym) * 1.22) * scale;
            if (s === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
          }
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.moveTo(bx + cn.tri[0][0] * scale, by + cn.tri[0][1] * scale);
          ctx.lineTo(bx + cn.tri[1][0] * scale, by + cn.tri[1][1] * scale);
          ctx.lineTo(bx + cn.tri[2][0] * scale, by + cn.tri[2][1] * scale);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.globalAlpha = alpha * 0.28;
          ctx.beginPath();
          ctx.ellipse(bx + cn.x * scale, by + cn.y * scale, cn.rx * 1.22 * scale, cn.ry * 1.22 * scale, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.ellipse(bx + cn.x * scale, by + cn.y * scale, cn.rx * scale, cn.ry * scale, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);

    var phone = isPhone();
    var block = Math.floor(t / WORD_SECONDS);
    var local = t - block * WORD_SECONDS;
    var cy = H * 0.5;
    var bob = Math.sin(t * (Math.PI * 2 / 8)) * H * 0.006;

    function layout(idx) {
      var data = wordFor(idx);
      var targetW = W * (phone ? 0.86 : 0.70);
      var scale = targetW / data.totalAdv;
      var breathe = 1 + 0.01 * Math.sin(t * (Math.PI * 2 / 8) + 1.3);
      return { data: data, scale: scale * breathe, x0: W / 2 - (data.totalAdv / 2) * scale * breathe, y0: cy - 3.5 * scale * breathe + bob };
    }

    if (local < WORD_SECONDS - MORPH) {
      var a = layout(block);
      drawWord(a.data, a.x0, a.y0, a.scale, 1, t, 1, 1);
    } else {
      var m = smooth((local - (WORD_SECONDS - MORPH)) / MORPH);
      var o = layout(block);
      drawWord(o.data, o.x0, o.y0, o.scale, 1 - m, t, 1 + 1.6 * m, 1 + 0.13 * m);
      var n = layout(block + 1);
      drawWord(n.data, n.x0, n.y0, n.scale, m, t, 1 + 1.6 * (1 - m), 1 + 0.13 * (1 - m));
    }

    var monoSize = Math.max(9, Math.min(W, H) * 0.02);
    drawMonoLine('SMOKE CASTING / MADE IN ITALY', H * 0.065, monoSize, 0.78);
    drawMonoLine('SHIPPED WORLDWIDE', H * 0.935, monoSize, 0.78);
  }

  resize();
  draw(PHASE + tapJump);

  if (typeof requestAnimationFrame === 'function') {
    var start = null;
    var loop = function (now) {
      if (start === null) start = now;
      startStamp = (now - start) / 1000;
      draw(PHASE + tapJump + startStamp);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
