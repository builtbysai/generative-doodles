<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1980 Night Shelter</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0f; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1980 Night Shelter, CR5 / PP1227, study #258 ciara-reddy.
  // Night, rain-wet street. A group crowds under a bus shelter
  // beside a giant backlit ad panel while an on-camera flash
  // fires. Bottles, laughter, motion blur, the frame tilted.
  // The ad glows behind them, huge and indifferent. People
  // shift, someone raises a drink, blur trails follow every
  // movement. The camera is a participant, not a witness.
  var ASPHALT = '#0a0a0f';
  var FLASHWHITE = '#f5f2e8';
  var MAGENTA = '#ff2e7e';
  var CYAN = '#19d3e6';
  var YELLOW = '#ffd23e';
  var BENCH = '#c81e2b';
  var GROUND = '#0a0a0f'; // page ground, wet black asphalt

  // Fixed-phase first frame: FIRST_T = 6.4 s. The cycle is
  // 18 s, the flash fires every 6 s with its peak at 0.5 s
  // into each 6 s beat, so at t = 6.4 the flash is at its
  // peak and the first frame is a sharp candid, faces
  // flash-white, blur killed. Bursts that re-arrange the
  // group start at t = 3, 9, 15, each settling over 1.4 s.
  var FIRST_T = 6.4;
  var CYCLE = 18;
  var SEED = 1980;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.groundY = H * 0.66;
    L.adX = W * 0.64; L.adW = W * 0.33; L.adY = H * 0.07; L.adH = H * 0.53;
    L.roofY = H * 0.13;
    L.benchY = H * 0.585;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Cycle ---------------------------------------------------
  // Flash envelope over each 6 s beat: fast rise to a peak at
  // 0.5 s, hold to 0.7 s, decay to zero by 1.5 s. Between
  // flashes the scene sits in dim streetlight with full blur.
  function flashAt(t) {
    var f = ((t % 6) + 6) % 6;
    if (f < 0.15) { return f / 0.15; }
    if (f < 0.7) { return 1; }
    if (f < 1.5) { return 1 - (f - 0.7) / 0.8; }
    return 0;
  }
  // Group bursts start at t = 3, 9, 15, ... (6k + 3).
  function burstIndex(t) { return Math.floor((t - 3) / 6); }
  function burstPhase(t) {
    var k = burstIndex(t);
    var start = 6 * k + 3;
    return smooth((t - start) / 1.4);
  }
  function cycleState(t) {
    var flash = flashAt(t);
    var blur = (1 - flash) * 0.85;
    return { flash: flash, blur: blur, burst: burstIndex(t), bphase: burstPhase(t) };
  }

  // ---- Figures -------------------------------------------------
  // Six agents. Anchor positions are fixed per burst index,
  // drawn from a seeded PRNG, so each burst re-arranges the
  // group and the group then holds still until the next one.
  // Position at time t interpolates from the previous anchor
  // to the current one over the 1.4 s burst settle.
  var AGENTS = 6;
  function anchor(i, k) {
    var rng = mulberry32(SEED * 31 + k * 13 + i * 7 + 5);
    var spread = [0.07, 0.17, 0.27, 0.37, 0.47, 0.56][i];
    var jx = (rng() - 0.5) * 0.07;
    var jy = (rng() - 0.5) * 0.03;
    var s = 0.86 + rng() * 0.28;
    return { x: W * (spread + jx), y: H * (0.655 + jy), s: s, tilt: (rng() - 0.5) * 0.22 };
  }
  function agentPos(i, t) {
    var k = burstIndex(t);
    var a = anchor(i, k - 1);
    var b = anchor(i, k);
    var u = burstPhase(t);
    return {
      x: lerp(a.x, b.x, u),
      y: lerp(a.y, b.y, u),
      s: lerp(a.s, b.s, u),
      tilt: lerp(a.tilt, b.tilt, u)
    };
  }
  // Agent 2 raises a drink during the settle of every burst,
  // arm up for about 2 s, then lowers it.
  function raiseAt(t) {
    var k = burstIndex(t);
    var start = 6 * k + 3;
    var dt = t - start;
    if (dt < 0) { return 0; }
    if (dt < 0.5) { return smooth(dt / 0.5); }
    if (dt < 2.0) { return 1; }
    if (dt < 3.0) { return 1 - smooth((dt - 2.0) / 1.0); }
    return 0;
  }

  function drawFigure(p, flash, alpha, raise, ghost) {
    var u = Math.min(W, H);
    var hgt = Math.min(H * 0.30, W * 0.40) * p.s;
    var wid = hgt * 0.28;
    var headR = hgt * 0.115;
    var hipY = p.y - hgt * 0.55;
    var headY = p.y - hgt * 0.92;
    ctx.save();
    ctx.globalAlpha = a4(alpha);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.tilt * (ghost ? 1.6 : 1));
    ctx.translate(-p.x, -p.y);
    // Body: dark coat, rim-lit on the ad side, lifted just
    // enough to read against the night sky.
    ctx.fillStyle = '#1b1b2a';
    ctx.beginPath();
    ctx.moveTo(p.x - wid * 0.5, p.y);
    ctx.lineTo(p.x - wid * 0.42, hipY);
    ctx.lineTo(p.x + wid * 0.42, hipY);
    ctx.lineTo(p.x + wid * 0.5, p.y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba(MAGENTA, 0.35 + 0.45 * flash);
    ctx.lineWidth = Math.max(1, u * 0.002);
    ctx.beginPath();
    ctx.moveTo(p.x + wid * 0.42, hipY);
    ctx.lineTo(p.x + wid * 0.5, p.y);
    ctx.stroke();
    // Shoulders rise to meet the head, no neck gap.
    ctx.fillStyle = '#20202f';
    ctx.beginPath();
    ctx.moveTo(p.x - wid * 0.42, hipY);
    ctx.lineTo(p.x, headY + headR * 0.6);
    ctx.lineTo(p.x + wid * 0.42, hipY);
    ctx.closePath();
    ctx.fill();
    // Face: flash-white when the flash fires, dim warm grey
    // between flashes. The harsh light is the point.
    var face = flash > 0.5 ? FLASHWHITE : '#8a8378';
    ctx.fillStyle = face;
    ctx.beginPath();
    ctx.moveTo(p.x + headR, headY);
    ctx.arc(p.x, headY, headR, 0, Math.PI * 2);
    ctx.fill();
    // Eyes: two dark dots, only readable in the flash.
    if (flash > 0.4) {
      ctx.fillStyle = '#111118';
      ctx.beginPath();
      ctx.moveTo(p.x - headR * 0.38 + headR * 0.12, headY - headR * 0.1);
      ctx.arc(p.x - headR * 0.38, headY - headR * 0.1, headR * 0.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(p.x + headR * 0.38 + headR * 0.12, headY - headR * 0.1);
      ctx.arc(p.x + headR * 0.38, headY - headR * 0.1, headR * 0.12, 0, Math.PI * 2);
      ctx.fill();
    }
    // Raised drink: arm up, bottle glinting.
    if (raise > 0.02) {
      var ax = p.x + wid * 0.42, ay = hipY - hgt * 0.05;
      var hx = p.x + wid * 0.55, hy = headY - headR * 0.4 - raise * hgt * 0.16;
      ctx.strokeStyle = '#171722';
      ctx.lineWidth = Math.max(2, u * 0.008);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(lerp(ax, hx, raise), lerp(ay, hy, raise));
      ctx.stroke();
      if (raise > 0.6) {
        ctx.fillStyle = '#1d3a24';
        ctx.fillRect(hx - u * 0.006, hy - hgt * 0.09, u * 0.012, hgt * 0.09);
        ctx.fillStyle = rgba(YELLOW, 0.4 + 0.6 * flash);
        ctx.beginPath();
        ctx.moveTo(hx + u * 0.012, hy - hgt * 0.09);
        ctx.arc(hx, hy - hgt * 0.09, u * 0.012, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // ---- Scene ---------------------------------------------------
  function drawAd(t, flash) {
    var u = Math.min(W, H);
    var glow = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * 0.7));
    // Halo.
    ctx.fillStyle = rgba(MAGENTA, 0.10 * glow);
    ctx.fillRect(L.adX - u * 0.03, L.adY - u * 0.03, L.adW + u * 0.06, L.adH + u * 0.06);
    // Panel: saturated commercial gradient, magenta to orange.
    var g = ctx.createLinearGradient(L.adX, L.adY, L.adX + L.adW, L.adY + L.adH);
    g.addColorStop(0, '#ff2e7e');
    g.addColorStop(0.55, '#ff5e3a');
    g.addColorStop(1, '#ff9e2e');
    ctx.fillStyle = g;
    ctx.fillRect(L.adX, L.adY, L.adW, L.adH);
    // Big cyan disc, the ad's hero shape.
    var cx = L.adX + L.adW * 0.62, cy = L.adY + L.adH * 0.34;
    var cr = L.adW * 0.34;
    ctx.fillStyle = CYAN;
    ctx.beginPath();
    ctx.moveTo(cx + cr, cy);
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.fill();
    // Yellow price bar and white copy bars.
    ctx.fillStyle = YELLOW;
    ctx.fillRect(L.adX + L.adW * 0.08, L.adY + L.adH * 0.66, L.adW * 0.55, H * 0.045);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillRect(L.adX + L.adW * 0.08, L.adY + L.adH * 0.76, L.adW * 0.72, H * 0.018);
    ctx.fillRect(L.adX + L.adW * 0.08, L.adY + L.adH * 0.82, L.adW * 0.5, H * 0.018);
    // Frame.
    ctx.strokeStyle = '#e8e8e8';
    ctx.lineWidth = Math.max(2, u * 0.004);
    ctx.strokeRect(L.adX, L.adY, L.adW, L.adH);
    // Light spill from the panel onto the street.
    ctx.fillStyle = rgba(MAGENTA, 0.08 + 0.06 * flash);
    ctx.fillRect(L.adX - W * 0.06, L.adY, W * 0.06, L.adH);
  }

  function drawShelter(t, flash) {
    var u = Math.min(W, H);
    // Roof slab.
    ctx.fillStyle = '#1b1b26';
    ctx.fillRect(W * 0.02, L.roofY, W * 0.60, H * 0.022);
    ctx.fillStyle = rgba(CYAN, 0.25);
    ctx.fillRect(W * 0.02, L.roofY + H * 0.022, W * 0.60, H * 0.004);
    // Posts.
    ctx.fillStyle = '#232330';
    ctx.fillRect(W * 0.035, L.roofY, u * 0.006, L.groundY - L.roofY);
    ctx.fillRect(W * 0.585, L.roofY, u * 0.006, L.groundY - L.roofY);
    // Glass back panel, faint, with a rain-run streak. Lit
    // enough by the ad spill that dark coats read against it.
    ctx.fillStyle = 'rgba(150,168,205,0.16)';
    ctx.fillRect(W * 0.05, L.roofY + H * 0.03, W * 0.52, L.groundY - L.roofY - H * 0.03);
    ctx.strokeStyle = 'rgba(200,220,255,0.25)';
    ctx.lineWidth = Math.max(1, u * 0.0015);
    ctx.beginPath();
    var sx = W * 0.30;
    ctx.moveTo(sx, L.roofY + H * 0.05);
    ctx.lineTo(sx + W * 0.01, L.groundY - H * 0.02);
    ctx.stroke();
    // Red bench: a backrest bar that shows between the
    // figures, then the seat and legs.
    ctx.fillStyle = BENCH;
    ctx.fillRect(W * 0.09, H * 0.50, W * 0.36, H * 0.018);
    ctx.fillRect(W * 0.09, L.benchY, W * 0.36, H * 0.022);
    ctx.fillStyle = '#8f1420';
    ctx.fillRect(W * 0.10, L.benchY + H * 0.022, u * 0.008, L.groundY - L.benchY);
    ctx.fillRect(W * 0.42, L.benchY + H * 0.022, u * 0.008, L.groundY - L.benchY);
    // Bottles on the bench, glinting when the flash fires.
    var bx;
    for (bx = 0; bx < 3; bx++) {
      var bxx = W * (0.14 + bx * 0.05);
      ctx.fillStyle = '#1d3a24';
      ctx.fillRect(bxx, L.benchY - H * 0.035, u * 0.010, H * 0.035);
      ctx.fillStyle = rgba(YELLOW, 0.25 + 0.65 * flash);
      ctx.beginPath();
      ctx.moveTo(bxx + u * 0.014, L.benchY - H * 0.035);
      ctx.arc(bxx + u * 0.005, L.benchY - H * 0.035, u * 0.009, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGround(t, flash) {
    var u = Math.min(W, H);
    // Wet asphalt, near black with a faint sheen gradient.
    var g = ctx.createLinearGradient(0, L.groundY, 0, H);
    g.addColorStop(0, '#101018');
    g.addColorStop(1, '#06060a');
    ctx.fillStyle = g;
    ctx.fillRect(0, L.groundY, W, H - L.groundY);
    // The ad mirrored in the wet ground: smeared vertical bars.
    var bars = [
      { x: 0.70, w: 0.05, c: MAGENTA, a: 0.34 },
      { x: 0.78, w: 0.03, c: CYAN, a: 0.30 },
      { x: 0.84, w: 0.04, c: YELLOW, a: 0.26 },
      { x: 0.90, w: 0.03, c: MAGENTA, a: 0.30 }
    ];
    var i;
    for (i = 0; i < bars.length; i++) {
      var b = bars[i];
      var wob = Math.sin(t * 0.9 + i * 2.1) * W * 0.004;
      ctx.fillStyle = rgba(b.c, b.a * (0.7 + 0.3 * flash));
      ctx.fillRect(W * b.x + wob, L.groundY + H * 0.01, W * b.w, H * 0.30);
    }
    // Figure smears under the group.
    for (i = 0; i < AGENTS; i++) {
      var p = agentPos(i, t);
      ctx.fillStyle = rgba('#3a3a4a', 0.20);
      ctx.fillRect(p.x - W * 0.015, L.groundY + H * 0.01, W * 0.03, H * 0.16);
    }
    // Puddle rims catching neon.
    ctx.strokeStyle = rgba(CYAN, 0.35);
    ctx.lineWidth = Math.max(1, u * 0.002);
    ctx.beginPath();
    ctx.ellipse(W * 0.70, H * 0.86, W * 0.09, H * 0.02, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = rgba(MAGENTA, 0.30);
    ctx.beginPath();
    ctx.ellipse(W * 0.30, H * 0.93, W * 0.07, H * 0.015, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawRain(t) {
    var u = Math.min(W, H);
    var rng = mulberry32(SEED * 3 + 11);
    var i;
    ctx.strokeStyle = 'rgba(190,205,230,0.28)';
    ctx.lineWidth = Math.max(1, u * 0.0012);
    ctx.beginPath();
    for (i = 0; i < 90; i++) {
      var rx = rng() * W * 1.2;
      var ry = rng() * H;
      var fall = (t * H * 0.55) % (H * 1.2);
      var y = (ry + fall) % H;
      var x = (rx - fall * 0.18) % W;
      if (x < 0) { x += W; }
      ctx.moveTo(x, y);
      ctx.lineTo(x - W * 0.004, y + H * 0.022);
    }
    ctx.stroke();
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var cs = cycleState(t);
    var flash = cs.flash;
    var blur = cs.blur;
    var raise = raiseAt(t);

    // Ground is wet black asphalt; the stage is the whole image.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // The whole frame is tilted, the camera is a participant.
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-0.04);
    ctx.translate(-W / 2, -H / 2);

    // Night sky: near black.
    var sky = ctx.createLinearGradient(0, 0, 0, L.groundY);
    sky.addColorStop(0, '#040408');
    sky.addColorStop(1, '#0a0a13');
    ctx.fillStyle = sky;
    ctx.fillRect(-W * 0.05, -H * 0.05, W * 1.1, L.groundY + H * 0.06);
    // Distant rooftops, barely lighter than the sky.
    ctx.fillStyle = '#0d0d17';
    ctx.fillRect(W * 0.02, H * 0.30, W * 0.16, H * 0.10);
    ctx.fillRect(W * 0.20, H * 0.26, W * 0.12, H * 0.14);
    ctx.fillStyle = rgba(YELLOW, 0.35);
    ctx.fillRect(W * 0.06, H * 0.33, W * 0.012, H * 0.014);
    ctx.fillRect(W * 0.24, H * 0.29, W * 0.012, H * 0.014);

    drawAd(t, flash);
    drawShelter(t, flash);
    drawGround(t, flash);

    // Blur trails: ghost copies of each figure at earlier
    // positions, strongest between flashes, killed by the flash.
    if (blur > 0.05) {
      var gi;
      for (gi = 0; gi < AGENTS; gi++) {
        var gp1 = agentPos(gi, t - 0.28);
        var gp2 = agentPos(gi, t - 0.55);
        drawFigure(gp2, flash, 0.06 * blur, 0, true);
        drawFigure(gp1, flash, 0.12 * blur, 0, true);
      }
    }
    // The group, massed left and center.
    var i;
    for (i = 0; i < AGENTS; i++) {
      var p = agentPos(i, t);
      // Idle sway, a small social bob, pure function of time.
      p.y += Math.sin(t * 1.3 + i * 1.7) * H * 0.003;
      drawFigure(p, flash, 1, i === 2 ? raise : 0, false);
    }

    drawRain(t);

    // The flash wash: a harsh white veil over everything at
    // the peak, gone a second later. Kept thin so the night
    // stays night and the coats stay readable.
    if (flash > 0.02) {
      ctx.fillStyle = rgba('#ffffff', 0.14 * flash);
      ctx.fillRect(-W * 0.05, -H * 0.05, W * 1.1, H * 1.1);
    }
    ctx.restore();

    // Caption, top left, and the hint, bottom center.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(245,242,232,0.88)';
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1980 · Night Shelter', W * 0.04, H * 0.055);
    ctx.fillStyle = 'rgba(245,242,232,0.60)';
    ctx.fillText('2007 · 06 · 14', W * 0.04, H * 0.055 + L.fsCap * 1.5);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(245,242,232,0.85)';
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch only. The flash fires on its own.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1980 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1980 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return cycleState(t); },
      flash: function (t) { return flashAt(t); },
      raise: function (t) { return raiseAt(t); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the flash fires every 6 s, the group
  // re-arranges in bursts every 6 s, the ad breathes on an
  // 18 s cycle. Watch only. Guarded so node-canvas QA (no
  // requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
