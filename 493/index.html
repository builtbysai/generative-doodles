<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrupt Lines</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #080808; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var BLACK = '#080808';
  var WHITE = '#FFFFFF';

  var PHASE = 9.0;   // fixed pre-roll: exactly two letters already melted
  var CYCLE = 34.0;  // full spread + heal cycle, seconds

  var SERIF = 'Didot, "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif';
  var MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';

  var LINES = [
    'GRAPHIC DESIGN',
    'ILLUSTRAZIONE',
    'ANIMAZIONE',
    'EDITORIALE',
    'LEGATORIA',
    'TIPOGRAFIA',
    'SERIGRAFIA'
  ];
  var MONO_LINE = 'WORKFIELDS · STUDIO GRAFICO';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- corruption plan (seeded, fixed for the piece) ----
  // Candidate letters are addressed by (line, charIndex). The spread order is
  // a seeded shuffle; the heal order is strictly left to right, line by line.
  var N_CORRUPT = 5;
  var MELT_STARTS = [2, 6, 10, 14, 18];
  var MELT_DUR = 2.0;
  var HEAL_START0 = 26.0;
  var HEAL_STAGGER = 0.5;
  var HEAL_DUR = 1.0;

  var corrupt = []; // {line, idx, meltStart, healStart, seed}
  (function planCorruption() {
    var total = 0, li, ci;
    var counts = [];
    for (li = 0; li < LINES.length; li++) {
      var c = 0;
      for (ci = 0; ci < LINES[li].length; ci++) if (LINES[li][ci] !== ' ') c++;
      counts.push(c); total += c;
    }
    var rng = mulberry32(493005);
    var picks = [];
    var guard = 0;
    while (picks.length < N_CORRUPT && guard < 500) {
      guard++;
      var k = Math.floor(rng() * total);
      var dup = false;
      for (var j = 0; j < picks.length; j++) if (picks[j] === k) dup = true;
      if (!dup) picks.push(k);
    }
    // map flat letter index -> (line, charIndex)
    function locate(k) {
      for (var l = 0; l < LINES.length; l++) {
        for (var c2 = 0; c2 < LINES[l].length; c2++) {
          if (LINES[l][c2] === ' ') continue;
          if (k === 0) return { line: l, idx: c2 };
          k--;
        }
      }
      return { line: 0, idx: 0 };
    }
    var events = [];
    for (var p = 0; p < picks.length; p++) {
      var loc = locate(picks[p]);
      events.push({ line: loc.line, idx: loc.idx, meltStart: MELT_STARTS[p], seed: rng() });
    }
    // heal order: left to right, line by line
    var byPos = events.slice().sort(function (a, b) {
      return (a.line - b.line) || (a.idx - b.idx);
    });
    for (var h = 0; h < byPos.length; h++) byPos[h].healStart = HEAL_START0 + h * HEAL_STAGGER;
    corrupt = events;
  })();

  function corruptAt(line, idx) {
    for (var i = 0; i < corrupt.length; i++) {
      if (corrupt[i].line === line && corrupt[i].idx === idx) return corrupt[i];
    }
    return null;
  }

  function meltAmount(ev, t) {
    var m = 0;
    if (t >= ev.meltStart) m = Math.min(1, (t - ev.meltStart) / MELT_DUR);
    if (t >= ev.healStart) {
      var hp = Math.min(1, (t - ev.healStart) / HEAL_DUR);
      m = m * (1 - hp);
    }
    return m;
  }

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE); // deterministic frame after any resize
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // ---- the swirl glyph: a letter caught mid-dissolve ----
  // Concentric broken arcs plus an inward spiral, drawn in the letter's cell.
  function drawSwirl(cx, cy, R, m, seed, t) {
    var rot = seed * Math.PI * 2 + t * 0.22;
    ctx.save();
    ctx.strokeStyle = WHITE;
    ctx.fillStyle = WHITE;
    ctx.globalAlpha = Math.min(1, m * 1.25);
    ctx.lineCap = 'round';

    // spiral, drawing in with the melt progress
    var turns = 2.6;
    var steps = 96;
    var upto = Math.floor(steps * m);
    ctx.lineWidth = Math.max(1.1, R * 0.13);
    ctx.beginPath();
    var started = false;
    for (var i = 0; i <= upto; i++) {
      // seeded breaks: some segments of the spiral are missing
      var hsh = Math.sin(seed * 977.0 + i * 127.1) * 43758.5453;
      if ((hsh - Math.floor(hsh)) < 0.16 && i > 2 && i < steps - 2) { started = false; continue; }
      var f = i / steps;
      var th = rot + f * turns * Math.PI * 2;
      var r = R * Math.pow(f, 0.8);
      var x = cx + Math.cos(th) * r;
      var y = cy + Math.sin(th) * r * 0.92;
      if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
    }
    ctx.stroke();

    // concentric broken arcs, alternating spin
    var rings = [0.48, 0.74, 0.98];
    ctx.lineWidth = Math.max(0.9, R * 0.10);
    for (var k = 0; k < rings.length; k++) {
      var rr = R * rings[k];
      var dir = (k % 2 === 0) ? 1 : -1;
      var a0 = rot * dir * (0.6 + 0.25 * k) + seed * 31.0 * (k + 1);
      var sweep = m * (Math.PI * (0.75 + 0.35 * ((seed * (k + 3) * 7.0) % 1)));
      ctx.beginPath();
      ctx.arc(cx, cy, rr, a0, a0 + dir * sweep);
      ctx.stroke();
      // a second, shorter fragment on the same ring
      ctx.beginPath();
      ctx.arc(cx, cy, rr, a0 + dir * (sweep + 0.7), a0 + dir * (sweep + 0.7 + m * 0.6));
      ctx.stroke();
    }

    // core dot
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(0.8, R * 0.09), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw(t) {
    if (!W || !H) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var tt = ((t % CYCLE) + CYCLE) % CYCLE;
    var phone = isPhone();

    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);

    // ---- poster block geometry ----
    var fsBase = Math.min(H * 0.098, W * (phone ? 0.30 : 0.17));
    var slotH = fsBase * 1.16; // tight leading, with room for scaled-up lines
    var blockH = slotH * LINES.length;
    var blockTop = (H - blockH) * 0.44;
    var trackF = 0.045; // letterspacing, as a fraction of the font size

    ctx.fillStyle = WHITE;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    var rng = mulberry32(493011); // per-line bleed + shift, stable every frame

    for (var li = 0; li < LINES.length; li++) {
      var text = LINES[li];
      var bleed = 1.08 + rng() * 0.24;         // line width as a multiple of W
      var shift = (rng() - 0.5) * 0.04 * W;    // slight per-line offset
      var trackJit = (rng() - 0.5) * 0.02;     // tiny tracking variation

      // measure the natural width at the base size
      ctx.font = '700 ' + fsBase + 'px ' + SERIF;
      var natW = 0, ci;
      for (ci = 0; ci < text.length; ci++) {
        natW += (text[ci] === ' ') ? fsBase * 0.30 : ctx.measureText(text[ci]).width;
        natW += fsBase * (trackF + trackJit);
      }
      var scale = (W * bleed) / natW;
      if (scale < 0.5) scale = 0.5;
      if (scale > 1.34) scale = 1.34;
      var fs = fsBase * scale;
      var track = fs * (trackF + trackJit);

      ctx.font = '700 ' + fs + 'px ' + SERIF;
      // recompute advances at the line's own size
      var advs = [];
      var totalW = 0;
      for (ci = 0; ci < text.length; ci++) {
        var a = (text[ci] === ' ') ? fs * 0.30 : ctx.measureText(text[ci]).width;
        advs.push(a);
        totalW += a + track;
      }
      var x = (W - totalW) / 2 + shift;
      var baseline = blockTop + slotH * (li + 1) - fsBase * 0.20;

      for (ci = 0; ci < text.length; ci++) {
        var ch = text[ci];
        var adv = advs[ci];
        if (ch !== ' ') {
          var ev = corruptAt(li, ci);
          var m = ev ? meltAmount(ev, tt) : 0;
          if (m <= 0) {
            ctx.globalAlpha = 1;
            ctx.fillText(ch, x, baseline);
          } else {
            if (m < 1) {
              ctx.globalAlpha = 1 - m;
              ctx.fillText(ch, x, baseline);
              ctx.globalAlpha = 1;
            }
            var R = Math.min(adv * 0.62, fs * 0.40);
            drawSwirl(x + adv / 2, baseline - fs * 0.35, R, m, ev.seed, tt);
          }
        }
        x += adv + track;
      }
    }
    ctx.globalAlpha = 1;

    // ---- one small mono line at the bottom ----
    var mfs = Math.max(9, Math.min(W, H) * 0.021);
    ctx.font = '400 ' + mfs + 'px ' + MONO;
    ctx.globalAlpha = 0.85;
    var mTrack = mfs * 0.34;
    var mw = 0, mi;
    for (mi = 0; mi < MONO_LINE.length; mi++) mw += ctx.measureText(MONO_LINE[mi]).width + mTrack;
    var mx = (W - mw) / 2;
    var my = H * 0.945;
    for (mi = 0; mi < MONO_LINE.length; mi++) {
      ctx.fillText(MONO_LINE[mi], mx, my);
      mx += ctx.measureText(MONO_LINE[mi]).width + mTrack;
    }
    ctx.globalAlpha = 1;
  }

  // ---- run: watch-only, no interaction ----
  resize();
  draw(PHASE);

  var startStamp = null;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (stamp) {
      if (startStamp === null) startStamp = stamp;
      var elapsed = (stamp - startStamp) / 1000;
      draw(PHASE + elapsed);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
