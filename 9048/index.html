<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9048 · Eternal Bloom</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#060608; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}

// Eternal Bloom v5: order.
// One square spawns in the center, grows and rotates.
// Another spawns exactly on beat, and another, and another.
// At a set size each square dissolves. The cycle never breaks.

const BEAT = 2.0;          // seconds between spawns, exact
const LIFETIME = 10.0;     // 5 squares alive at once, evenly spaced
const ROT_SPEED = 0.26;    // radians per second, all squares, same direction
const MAX_FRAC = 0.80;     // deleted at 80% of half the shortest side

const squares = [];
let clock = 0, nextSpawn = 0;

function spawn(){
  squares.push({ born: clock });
}

function draw(){
  const [w, h] = viewportWH(); prep(w, h);
  ctx.fillStyle = '#060608'; ctx.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const maxHalf = Math.min(w, h) / 2 * MAX_FRAC;

  // metronome: spawn on exact beats
  while (nextSpawn <= clock){ spawn(); nextSpawn += BEAT; }

  for (let i = squares.length - 1; i >= 0; i--){
    const age = clock - squares[i].born;
    const life = age / LIFETIME;
    if (life >= 1){ squares.splice(i, 1); continue; }

    // linear growth, constant rotation: pure order
    const half = 2 + life * (maxHalf - 2);
    const rot = age * ROT_SPEED;

    // opacity: quick fade in, long hold, clean fade out
    let a;
    if (life < 0.05) a = life / 0.05;
    else if (life > 0.92) a = (1 - life) / 0.08;
    else a = 1;

    // single warm-white line, slightly brighter when young
    const bright = Math.round(200 + 55 * (1 - life));
    ctx.strokeStyle = 'rgba(' + bright + ',' + bright + ',' + (bright - 12) + ',' + a.toFixed(3) + ')';
    ctx.lineWidth = 1.4;

    const c = Math.cos(rot), s = Math.sin(rot);
    ctx.beginPath();
    const corners = [[-1,-1],[1,-1],[1,1],[-1,1]];
    for (let k = 0; k <= 4; k++){
      const p = corners[k % 4];
      const x = cx + (p[0]*c - p[1]*s) * half;
      const y = cy + (p[0]*s + p[1]*c) * half;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

let lastT = -1;
function loop(nowMs){
  const t = nowMs / 1000;
  if (lastT < 0) lastT = t;
  clock += Math.min(t - lastT, 0.1); lastT = t;
  draw();
  requestAnimationFrame(loop);
}
// pre-roll: full ordered cycle on load
(function(){
  for (let k = 0; k < 5; k++){ squares.push({ born: -k * BEAT }); }
  nextSpawn = BEAT;
  clock = 0;
})();
requestAnimationFrame(loop);
window.addEventListener('resize', () => draw());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => draw());
</script>
</body>
</html>
