<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9048 · Eternal Bloom</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#07070d; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
// seeded prng
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// Eternal Bloom: infinite dive through evolving luminous forms.
// Based on No.85's phi-zoom, but every level breathes: shapes morph,
// hues drift, and fine inner filaments shimmer. Always expanding, seamless loop.
const LEVELS = 30;
const PHI = (1 + Math.sqrt(5)) / 2;
const LOOP = 40; // seconds per full zoom cycle

// per-level seeded character: sides morph 4->6->8->4 across depth, jitter, filament count
const levelSeed = [];
{
  const rng = mulberry(9048 * 2654435761 % 2147483647);
  for (let k = 0; k < LEVELS + 8; k++){
    levelSeed.push({
      jitter: (rng() - 0.5) * 0.35,
      fil: 3 + Math.floor(rng() * 5),
      spin: (rng() - 0.5) * 0.9,
      glow: 0.5 + rng() * 0.5
    });
  }
}

// palette: deep-space luminous cycle (indigo -> cyan -> magenta -> amber -> indigo)
const PAL = [
  [56, 89, 199],   // indigo
  [45, 212, 191],  // teal
  [232, 121, 249], // magenta
  [251, 191, 36],  // amber
  [56, 89, 199]    // indigo (wrap)
];
function palAt(v){
  v = ((v % 1) + 1) % 1;
  const seg = v * (PAL.length - 1);
  const i = Math.min(PAL.length - 2, Math.floor(seg));
  const t = seg - i;
  const a = PAL[i], b = PAL[i+1];
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}
function css(c, a){
  return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(3) + ')';
}

let dragPhase = null, dragging = false, sy0 = 0, holdUntil = -1, diveVel = 0;
function getPhase(t){
  if (dragging && dragPhase !== null) return dragPhase;
  if (dragPhase !== null && t < holdUntil) return dragPhase;
  return (t / LOOP) % 1;
}

function polyPath(cx, cy, r, sides, rot, jr){
  ctx.beginPath();
  for (let i = 0; i <= sides; i++){
    const a = rot + (i / sides) * Math.PI * 2;
    const rr = r * (1 + jr * Math.sin(i * 2.7 + r * 0.01));
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawFrame(nowMs){
  const [w, h] = viewportWH(); prep(w, h);
  const t = nowMs / 1000;
  // deep space with faint vignette fade
  ctx.fillStyle = '#07070d'; ctx.fillRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2;
  const S = Math.min(w, h) * 0.72;
  let phase = getPhase(t);
  // gentle dive velocity from flicks decays
  if (!dragging && Math.abs(diveVel) > 0.00001){
    phase = (phase + diveVel) % 1; if (phase < 0) phase += 1;
    dragPhase = phase; holdUntil = t + 2;
    diveVel *= 0.96;
  }
  const s = Math.pow(PHI, phase);
  // slow global hue drift so the loop never repeats identically
  const hueDrift = (t / (LOOP * 8)) % 1;

  for (let k = 0; k < LEVELS; k++){
    const half = (S / 2) * s * Math.pow(1 / PHI, k);
    if (half < 1.2) continue;
    if (half > S * 0.85) continue;
    const sd = levelSeed[k % levelSeed.length];
    // alpha: fade in at center birth, fade out at edge
    let alpha = 1;
    if (k === 0) alpha = 1 - phase * 0.85;
    if (half < 6) alpha = Math.min(alpha, half / 6);
    alpha = clamp(alpha, 0.05, 1);

    // sides morph with depth: 4 -> 5 -> 6 -> 8 -> 4 cycle
    const cyc = (k + phase * 4) / 6;
    const sidesSeq = [4, 5, 6, 8];
    const si = Math.floor(cyc) % 4;
    const sides = sidesSeq[(si + 4) % 4];

    const rot = k * 0.32 + phase * 1.1 + sd.spin * 0.6 + t * 0.02 * sd.spin;
    const col = palAt(k / LEVELS * 1.2 + hueDrift + phase * 0.15);

    // outer luminous form
    ctx.strokeStyle = css(col, 0.28 * alpha + 0.5 * alpha * sd.glow);
    ctx.lineWidth = 1.4;
    polyPath(cx, cy, half, sides, rot, sd.jitter);
    ctx.stroke();

    // inner filaments: fine lines from center to vertices, shimmering
    if (half > 14){
      ctx.strokeStyle = css(col, 0.16 * alpha);
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      for (let f = 0; f < sd.fil; f++){
        const a = rot + (f / sd.fil) * Math.PI * 2 + Math.sin(t * 0.7 + k + f) * 0.08;
        ctx.moveTo(cx + Math.cos(a) * half * 0.18, cy + Math.sin(a) * half * 0.18);
        ctx.lineTo(cx + Math.cos(a) * half * 0.96, cy + Math.sin(a) * half * 0.96);
      }
      ctx.stroke();
    }

    // core glow dot at deep center
    if (half < 26 && half > 1.2){
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, half);
      g.addColorStop(0, css(col, 0.5 * alpha));
      g.addColorStop(1, css(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, half, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// drag to dive; flick adds velocity
let lastY = 0, lastT = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; sy0 = e.clientY; lastY = e.clientY; lastT = performance.now();
  if (dragPhase === null) dragPhase = ((performance.now()/1000)/LOOP) % 1;
  diveVel = 0;
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = performance.now();
  const dy = e.clientY - lastY, dt = Math.max(1, now - lastT);
  diveVel = (dy / 900) * 0.06;
  dragPhase = (((dragPhase + dy / 900) % 1) + 1) % 1;
  lastY = e.clientY; lastT = now; sy0 = e.clientY;
});
function endP(){
  if (dragging){ dragging = false; holdUntil = performance.now()/1000 + 3; }
}
canvas.addEventListener('pointerup', endP);
canvas.addEventListener('pointercancel', endP);

function loop(nowMs){ drawFrame(nowMs); requestAnimationFrame(loop); }
drawFrame(3000);
requestAnimationFrame(loop);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
