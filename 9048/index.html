<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9048 · Eternal Bloom</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#060608; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}

// Eternal Bloom v6: one square.
// Spawns in the middle, rotates slowly, expands.
// At max size it dissolves and a new one begins.

const CYCLE = 14;        // seconds per loop
const ROT_SPEED = 0.2;   // radians per second
const MAX_FRAC = 0.8;    // max half-size as fraction of shortest side / 2

function draw(){
  const [w, h] = viewportWH(); prep(w, h);
  ctx.fillStyle = '#060608'; ctx.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const maxHalf = Math.min(w, h) / 2 * MAX_FRAC;

  const phase = (clock / CYCLE) % 1;      // 0..1
  const half = 3 + phase * (maxHalf - 3); // linear expansion
  const rot = clock * ROT_SPEED;          // slow constant rotation

  // fade in at birth, fade out at the end
  let a;
  if (phase < 0.04) a = phase / 0.04;
  else if (phase > 0.94) a = (1 - phase) / 0.06;
  else a = 1;

  ctx.strokeStyle = 'rgba(232,230,224,' + a.toFixed(3) + ')';
  ctx.lineWidth = 1.5;

  const c = Math.cos(rot), s = Math.sin(rot);
  ctx.beginPath();
  const corners = [[-1,-1],[1,-1],[1,1],[-1,1]];
  for (let k = 0; k <= 4; k++){
    const p = corners[k % 4];
    const x = cx + (p[0]*c - p[1]*s) * half;
    const y = cy + (p[0]*s + p[1]*c) * half;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

let clock = 0, lastT = -1;
function loop(nowMs){
  const t = nowMs / 1000;
  if (lastT < 0) lastT = t;
  clock += Math.min(t - lastT, 0.1); lastT = t;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('resize', () => draw());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => draw());
</script>
</body>
</html>
