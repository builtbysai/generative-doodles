<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9048 · Eternal Bloom</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#060608; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}

// Eternal Bloom v8: continuous spawn.
// A new square spawns in the center every 2 seconds.
// Every square shares the same expansion rate and rotation rate;
// direction alternates clockwise / counter-clockwise.
// Each dissolves at max size and the cycle never breaks.

const SPAWN_EVERY = 2;    // seconds between spawns
const LIFETIME = 14;      // seconds per square: 7 alive at once
const ROT_SPEED = 0.2;    // radians per second, same for all
const MAX_FRAC = 0.8;     // max half-size as fraction of shortest side / 2

const squares = [];
let clock = 0, nextSpawn = 0, spawnCount = 0;

function spawn(){
  squares.push({ born: clock, dir: (spawnCount % 2 === 0) ? 1 : -1 });
  spawnCount++;
}

function draw(){
  const [w, h] = viewportWH(); prep(w, h);
  ctx.fillStyle = '#060608'; ctx.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const maxHalf = Math.min(w, h) / 2 * MAX_FRAC;

  while (nextSpawn <= clock){ spawn(); nextSpawn += SPAWN_EVERY; }

  for (let i = squares.length - 1; i >= 0; i--){
    const sq = squares[i];
    const age = clock - sq.born;
    const life = age / LIFETIME;
    if (life >= 1){ squares.splice(i, 1); continue; }

    const half = 3 + life * (maxHalf - 3);  // same expansion rate
    const rot = sq.dir * age * ROT_SPEED;   // same rotation rate

    let a;
    if (life < 0.04) a = life / 0.04;
    else if (life > 0.94) a = (1 - life) / 0.06;
    else a = 1;

    ctx.strokeStyle = 'rgba(232,230,224,' + a.toFixed(3) + ')';
    ctx.lineWidth = 1.5;

    const c = Math.cos(rot), s = Math.sin(rot);
    ctx.beginPath();
    const corners = [[-1,-1],[1,-1],[1,1],[-1,1]];
    for (let k = 0; k <= 4; k++){
      const p = corners[k % 4];
      const x = cx + (p[0]*c - p[1]*s) * half;
      const y = cy + (p[0]*s + p[1]*c) * half;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

let lastT = -1;
function loop(nowMs){
  const t = nowMs / 1000;
  if (lastT < 0) lastT = t;
  clock += Math.min(t - lastT, 0.1); lastT = t;
  draw();
  requestAnimationFrame(loop);
}
// pre-roll: full steady state on load
(function(){
  for (let k = 0; k < 7; k++){
    squares.push({ born: -k * SPAWN_EVERY, dir: (k % 2 === 0) ? 1 : -1 });
  }
  spawnCount = 7;
  nextSpawn = SPAWN_EVERY;
})();
requestAnimationFrame(loop);
window.addEventListener('resize', () => draw());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => draw());
</script>
</body>
</html>
