<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9048 · Eternal Bloom</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#07070d; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// Eternal Bloom: self-running infinite luminous dive. No interaction needed.
// Shapes breathe and morph as the camera plunges; hues flow endlessly.
const LEVELS = 34;
const PHI = (1 + Math.sqrt(5)) / 2;
const LOOP = 10; // seconds per zoom cycle: brisk but hypnotic

const levelSeed = [];
{
  const rng = mulberry(90481);
  for (let k = 0; k < LEVELS + 8; k++){
    levelSeed.push({
      jitter: (rng() - 0.5) * 0.4,
      fil: 4 + Math.floor(rng() * 6),
      spin: (rng() - 0.5) * 1.4,
      glow: 0.55 + rng() * 0.45,
      pulse: rng() * Math.PI * 2
    });
  }
}

// luminous cycle: violet -> cyan -> magenta -> gold -> violet
const PAL = [
  [99, 102, 241],
  [34, 211, 238],
  [244, 114, 182],
  [251, 191, 36],
  [99, 102, 241]
];
function palAt(v){
  v = ((v % 1) + 1) % 1;
  const seg = v * (PAL.length - 1);
  const i = Math.min(PAL.length - 2, Math.floor(seg));
  const t = seg - i, a = PAL[i], b = PAL[i+1];
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}
function css(c, a){
  return 'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+a.toFixed(3)+')';
}

function polyPath(cx, cy, r, sides, rot, jr){
  ctx.beginPath();
  for (let i = 0; i <= sides; i++){
    const a = rot + (i / sides) * Math.PI * 2;
    const rr = r * (1 + jr * Math.sin(i * 2.7 + r * 0.013));
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawFrame(nowMs){
  const [w, h] = viewportWH(); prep(w, h);
  const t = nowMs / 1000;
  ctx.fillStyle = '#07070d'; ctx.fillRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2;
  const S = Math.min(w, h) * 0.74;
  const phase = (t / LOOP) % 1;
  const s = Math.pow(PHI, phase);
  const hueDrift = (t / (LOOP * 6)) % 1;
  // breathing: whole field gently swells
  const breathe = 1 + 0.035 * Math.sin(t * 1.4);

  for (let k = 0; k < LEVELS; k++){
    const half = (S / 2) * s * Math.pow(1 / PHI, k) * breathe;
    if (half < 1.4) continue;
    if (half > S * 0.9) continue;
    const sd = levelSeed[k % levelSeed.length];

    let alpha = 1;
    if (k === 0) alpha = 1 - phase * 0.85;
    if (half < 7) alpha = Math.min(alpha, half / 7);
    alpha = clamp(alpha, 0.06, 1);

    // morphing sides with depth
    const cyc = (k + phase * 5) / 7;
    const sidesSeq = [4, 5, 6, 8, 5];
    const sides = sidesSeq[Math.floor(cyc) % sidesSeq.length];

    const rot = k * 0.42 + phase * 1.6 + sd.spin * (0.5 + 0.5 * Math.sin(t * 0.5 + sd.pulse));
    const col = palAt(k / LEVELS * 1.3 + hueDrift + phase * 0.2);
    const pulse = 0.75 + 0.25 * Math.sin(t * 2.2 + sd.pulse + k * 0.5);

    // main luminous ring
    ctx.strokeStyle = css(col, alpha * sd.glow * pulse);
    ctx.lineWidth = 1.6;
    polyPath(cx, cy, half, sides, rot, sd.jitter);
    ctx.stroke();

    // echo ring: slightly smaller, counter-rotating, fainter
    if (half > 20){
      ctx.strokeStyle = css(col, alpha * 0.22 * pulse);
      ctx.lineWidth = 0.8;
      polyPath(cx, cy, half * 0.82, sides, -rot * 0.7, -sd.jitter);
      ctx.stroke();
    }

    // filaments
    if (half > 16){
      ctx.strokeStyle = css(col, 0.18 * alpha * pulse);
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      for (let f = 0; f < sd.fil; f++){
        const a = rot + (f / sd.fil) * Math.PI * 2 + Math.sin(t * 1.1 + k * 1.3 + f) * 0.1;
        ctx.moveTo(cx + Math.cos(a) * half * 0.16, cy + Math.sin(a) * half * 0.16);
        ctx.lineTo(cx + Math.cos(a) * half * 0.97, cy + Math.sin(a) * half * 0.97);
      }
      ctx.stroke();
    }

    // core bloom
    if (half < 30){
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, half);
      g.addColorStop(0, css(col, 0.55 * alpha * pulse));
      g.addColorStop(1, css(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, half, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function loop(nowMs){ drawFrame(nowMs); requestAnimationFrame(loop); }
drawFrame(2000);
requestAnimationFrame(loop);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
