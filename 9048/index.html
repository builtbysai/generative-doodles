<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9048 · Log Argument</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #04070a; position: fixed; inset: 0; width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  #front { pointer-events: none; }
  #back { cursor: grab; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  #topbar {

  #src {

    .chip { padding: 6px 8px 7px 8px; border-radius: 8px; }
    .chip .sub { font-size: 10px; }

    #hint { font-size: 11px; bottom: 10px; }
    #newriver { padding: 7px 11px; font-size: 11px; }

</style>

<body>
<canvas id="back"></canvas>
<canvas id="front"></canvas>
<div id="hud">
  <div id="topbar">
    <div id="titleblock">
      <h1>№9048 · Log Argument</h1>
      <p>Three pools, one river, a fixed flow. Drag the logs and the argument starts itself. Keep every pool above the white tick or its swimmers leave.</p>
    </div>
    <button id="newriver" type="button">new river</button>
  </div>
  <div id="chips"></div>
  <div id="src"></div>
  <div id="hint">Drag a log to move it &middot; drag the amber dot to turn it &middot; tap open water for a new river</div>
</div>
<script>
'use strict';
/*
  Log Argument: an interactive shared-resource toy.
  A waterfall feeds a glowing river with a fixed water budget. Three habitat
  pools compete for the flow. The viewer drags fallen logs to divert the
  current; feeding one pool starves another. Creatures swim to the healthiest
  pool, and every arrival sets off a small chain reaction.
  Tap (not drag) on open water reseeds the whole watershed.
*/

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '', 10);
if (!Number.isFinite(seed)) seed = 904811;
let rand = mulberry32(seed);

const back = document.getElementById('back');
const front = document.getElementById('front');
const bctx = back.getContext('2d');
const fctx = front.getContext('2d');
let W = 0, H = 0, DPR = 1, ASP = 1;

const ground = document.createElement('canvas');
const gctx = ground.getContext('2d');

// value noise, seeded per world
let noiseGrid = null, NG = 48;
function makeNoise(r) {
  noiseGrid = new Float32Array((NG + 1) * (NG + 1));
  for (let i = 0; i < noiseGrid.length; i++) noiseGrid[i] = r();
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let xf = x - xi, yf = y - yi;
  xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf);
  const x0 = ((xi % NG) + NG) % NG, y0 = ((yi % NG) + NG) % NG;
  const x1 = (x0 + 1) % NG, y1 = (y0 + 1) % NG;
  const a = noiseGrid[y0 * (NG + 1) + x0], b = noiseGrid[y0 * (NG + 1) + x1];
  const c = noiseGrid[y1 * (NG + 1) + x0], d = noiseGrid[y1 * (NG + 1) + x1];
  return lerp(lerp(a, b, xf), lerp(c, d, xf), yf);
}

// world state (all positions normalized: x in [0,1], y in [0,1];
// u = x*ASP, v = y is the isotropic sim space)
let pools = [], logs = [], creatures = [], parts = [], foams = [], sparks = [], rings = [];
let notchX = 0.5, budget = 240, spawnAcc = 0, simT = 0;
let lostFlow = 0, cliffH = 48, notchW = 0.11;
let selectedLog = -1;

const POOL_NAMES = ['reed', 'moss', 'stone'];

function buildWorld(s) {
  seed = s; rand = mulberry32(seed);
  makeNoise(rand);
  pools = []; logs = []; creatures = []; parts = []; foams = []; sparks = []; rings = [];
  spawnAcc = 0; lostFlow = 0; selectedLog = -1;

  notchX = 0.34 + rand() * 0.32;
  notchW = 0.09 + rand() * 0.05;
  budget = 210 + Math.floor(rand() * 90);

  const px = [0.16, 0.5, 0.84];
  for (let i = 0; i < 3; i++) {
    pools.push({
      name: POOL_NAMES[i],
      x: clamp(px[i] + (rand() - 0.5) * 0.1, 0.08, 0.92),
      y: 0.74 + rand() * 0.11,
      rV: 0.062 + rand() * 0.02,
      flow: 0, excited: 0, ripple: rand() * TAU, thirstyT: 0
    });
  }
  // three logs across the distributary zone, where they can cut channels
  for (let i = 0; i < 3; i++) {
    logs.push({
      x: 0.2 + rand() * 0.6,
      y: 0.5 + rand() * 0.2,
      len: 0.16 + rand() * 0.1,
      ang: rand() * Math.PI,
      half: 0.011 + rand() * 0.004,
      grain: rand() * 1000
    });
  }
  // creatures start spread across pools
  for (let i = 0; i < 12; i++) {
    const p = pools[i % 3];
    const a = rand() * TAU, rr = rand() * p.rV * 0.55;
    creatures.push({
      home: i % 3, x: p.x + Math.cos(a) * rr / ASP, y: p.y + Math.sin(a) * rr,
      vx: 0, vy: 0, state: 'swim', t: 0,
      fx: 0, fy: 0, tx: 0, ty: 0, cx: 0, cy: 0, to: -1,
      wanderA: rand() * TAU, wanderR: 0.2 + rand() * 0.5,
      decideT: 1 + rand() * 3, dart: 0, hue: rand()
    });
  }
  renderGround();
  buildChips();
  buildChannels();
}

function renderGround() {
  const gw = Math.max(2, Math.floor(W / 2)), gh = Math.max(2, Math.floor(H / 2));
  ground.width = gw; ground.height = gh;
  const c = gctx;
  c.fillStyle = '#060a0d'; c.fillRect(0, 0, gw, gh);
  for (let i = 0; i < 8; i++) {
    const x = rand() * gw, y = rand() * gh, r = (0.15 + rand() * 0.3) * gw;
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    const dark = rand() < 0.5;
    g.addColorStop(0, dark ? 'rgba(2,5,7,0.55)' : 'rgba(14,24,29,0.5)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 2400; i++) {
    const x = rand() * gw, y = rand() * gh, r = 0.4 + rand() * 1.6;
    const l = 8 + rand() * 14;
    c.fillStyle = 'rgba(' + l + ',' + (l + 6) + ',' + (l + 8) + ',' + (0.03 + rand() * 0.05).toFixed(3) + ')';
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }
  // faint mineral veins
  c.strokeStyle = 'rgba(30,52,60,0.10)'; c.lineWidth = 1;
  for (let i = 0; i < 7; i++) {
    c.beginPath();
    let x = rand() * gw, y = rand() * gh;
    c.moveTo(x, y);
    for (let k = 0; k < 24; k++) {
      x += (rand() - 0.5) * gw * 0.06; y += (rand() - 0.5) * gh * 0.06;
      c.lineTo(x, y);
    }
    c.stroke();
  }
  // vignette
  const vg = c.createRadialGradient(gw / 2, gh / 2, Math.min(gw, gh) * 0.35, gw / 2, gh / 2, Math.max(gw, gh) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  c.fillStyle = vg; c.fillRect(0, 0, gw, gh);
}

// distributary channels: three fixed curves from the fork to the pools.
// Stored in screen-fraction space so the fork geometry is identical on
// every aspect ratio; tangents are visual directions.
let channels = [];
function buildChannels() {
  channels = [];
  // mouths spread evenly across the fork; pools are built left to right,
  // so mouth i always feeds pool i and every mouth stays inside the spread
  const mouths = [-0.10, 0, 0.10];
  for (let k = 0; k < 3; k++) {
    const p = pools[k];
    const P0 = { x: notchX + mouths[k], y: 0.48 };
    const P2 = { x: p.x, y: p.y };
    const P1 = { x: (P0.x + P2.x) / 2 + (P2.x - P0.x) * 0.25, y: (P0.y + P2.y) / 2 - 0.04 };
    const N = 16, pts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N, mt = 1 - t;
      const x = mt * mt * P0.x + 2 * mt * t * P1.x + t * t * P2.x;
      const y = mt * mt * P0.y + 2 * mt * t * P1.y + t * t * P2.y;
      const dx = 2 * mt * (P1.x - P0.x) + 2 * t * (P2.x - P1.x);
      const dy = 2 * mt * (P1.y - P0.y) + 2 * t * (P2.y - P1.y);
      const dl = Math.hypot(dx, dy) || 1;
      pts.push({ x: x, y: y, tx: dx / dl, ty: dy / dl });
    }
    channels.push(pts);
  }
}

// ---- flow field ----
function flowAt(x, y, out) {
  let vx = (0.5 - x) * 0.06;
  let vy = 0.20 + 0.10 * clamp(y / 0.4, 0, 1);
  // waterfall jet just below the notch
  const jdx = Math.abs(x - notchX);
  if (y < 0.16 && jdx < notchW * 0.45) vy += 0.35 * (1 - jdx / (notchW * 0.45));
  // widening sheet above the fork: logistic spread saturating at
  // half-width 0.17, so the sheet always covers the channel mouths
  if (y > 0.18 && y < 0.48) {
    const off = x - notchX, ao = Math.abs(off);
    const env = Math.sin((y - 0.18) / 0.30 * Math.PI);
    if (ao < 0.17) {
      vx += Math.sign(off) * Math.min(ao * 4.5, 0.55) * (1 - ao / 0.17) * env;
    } else {
      vx -= Math.sign(off) * 0.15 * env;
    }
  }
  // small wiggle
  const a = vnoise(x * 3.1 + (seed % 97), y * 3.1 + simT * 0.15) * TAU * 2;
  vx += Math.cos(a) * 0.04; vy += Math.sin(a) * 0.03;
  // distributary channels: steer along the nearest channel tangent.
  // The sheet partitions by lateral position across the three mouths.
  if (y > 0.44 && channels.length === 3) {
    let swx = 0, swy = 0, sw = 0;
    for (const ch of channels) {
      let bd = 1e9, bi = 0;
      for (let i = 0; i < ch.length; i++) {
        const dx = ch[i].x - x, dy = ch[i].y - y;
        const d = dx * dx + dy * dy;
        if (d < bd) { bd = d; bi = i; }
      }
      const w = Math.exp(-bd / 0.0081);
      swx += ch[bi].tx * w; swy += ch[bi].ty * w; sw += w;
    }
    if (sw > 1e-6) {
      const sp = 0.32;
      const k = clamp(((y - 0.44) / 0.10) * 1.4, 0, 1);
      vx = lerp(vx, swx / sw * sp, k);
      vy = lerp(vy, swy / sw * sp, k);
    }
  }
  // capture funnel at the pools: short range finish, wide enough that
  // water spilling around a log still finds its basin
  if (y > 0.5) {
    let bi = 0, bd = 1e9;
    for (let i = 0; i < 3; i++) {
      const dx = pools[i].x - x, dy = pools[i].y - y;
      const d = Math.hypot(dx, dy);
      if (d < bd) { bd = d; bi = i; }
    }
    if (bd < 0.20 && bd > 1e-4) {
      const p = pools[bi];
      const q = 1 - bd / 0.20, w = clamp(q * q * 1.7, 0, 1);
      const des = 0.32;
      const ax = ((p.x - x) / bd) * des;
      const ay = ((p.y - y) / bd) * des;
      vx = lerp(vx, ax, w); vy = lerp(vy, ay, w);
    }
  }
  // soft walls
  if (x < 0.04) vx += (0.04 - x) * 6;
  if (x > 0.96) vx -= (x - 0.96) * 6;
  out.x = vx; out.y = vy;
  return out;
}

const _f = { x: 0, y: 0 };
// position-projection log collision: no tunneling, water slides along the log
function collideLogs(p) {
  for (let li = 0; li < logs.length; li++) {
    const L = logs[li];
    const ux = L.x * ASP, uy = L.y;
    const dxs = Math.cos(L.ang), dys = Math.sin(L.ang);
    const pxu = p.x * ASP - ux, pyu = p.y - uy;
    const hl = L.len * ASP / 2;
    const t = clamp(pxu * dxs + pyu * dys, -hl, hl);
    let nx = pxu - dxs * t, ny = pyu - dys * t;
    const d = Math.hypot(nx, ny);
    const R = L.half + 0.024;
    if (d < R) {
      if (d < 1e-6) { nx = -dys; ny = dxs; } else { nx /= d; ny /= d; }
      p.x = (ux + dxs * t + nx * R) / ASP;
      p.y = uy + dys * t + ny * R;
      // kill only the inward velocity; the surviving tangential component
      // makes the water slide along the log with no added energy
      const vxu = p.vx * ASP, vyu = p.vy;
      const vn = vxu * nx + vyu * ny;
      if (vn < 0) { p.vx = (vxu - nx * vn) / ASP; p.vy = vyu - ny * vn; }
    }
  }
}
function spawnDrop() {
  parts.push({
    x: notchX + (rand() - 0.5) * notchW * 0.7,
    y: 0.015,
    vx: (rand() - 0.5) * 0.03, vy: 0.4 + rand() * 0.15,
    life: 0, max: 5 + rand() * 3,
    sz: 0.7 + rand() * 0.9, a: 0.5 + rand() * 0.5
  });
  if (parts.length > 1400) parts.splice(0, parts.length - 1400);
}
function spawnFoam() {
  foams.push({
    x: notchX + (rand() - 0.5) * notchW * 0.9,
    y: 0.1 + rand() * 0.05,
    vx: (rand() - 0.5) * 0.12, vy: 0.05 + rand() * 0.1,
    life: 0, max: 0.5 + rand() * 0.5, sz: 0.5 + rand() * 0.8
  });
  if (foams.length > 220) foams.splice(0, foams.length - 220);
}

// pre-rendered glow sprites
function makeSprite(stops, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  return c;
}
const dropSprite = makeSprite([[0, 'rgba(190,245,255,0.95)'], [0.25, 'rgba(90,220,250,0.55)'], [0.6, 'rgba(40,150,200,0.18)'], [1, 'rgba(0,80,120,0)']], 48);
const foamSprite = makeSprite([[0, 'rgba(235,250,255,0.9)'], [0.5, 'rgba(180,230,245,0.35)'], [1, 'rgba(120,200,230,0)']], 32);
const goldSprite = makeSprite([[0, 'rgba(255,225,160,0.95)'], [0.3, 'rgba(255,190,110,0.5)'], [1, 'rgba(200,120,40,0)']], 48);
const sparkSprite = makeSprite([[0, 'rgba(255,255,255,1)'], [0.4, 'rgba(160,240,220,0.5)'], [1, 'rgba(80,200,180,0)']], 24);

// ---- update ----
function update(dt) {
  simT += dt;
  // spawn river
  spawnAcc += budget * dt;
  while (spawnAcc >= 1) { spawnAcc -= 1; spawnDrop(); }
  if (rand() < dt * 22) spawnFoam();

  // decay flows (slow: the meters show the river's recent average, not flicker)
  const dec = Math.exp(-dt * 0.35);
  let sum = 0;
  for (const p of pools) { p.flow *= dec; p.excited *= Math.exp(-dt * 0.8); p.ripple += dt * 0.5; sum += p.flow; }
  lostFlow *= dec; sum += lostFlow;

  // drops
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    flowAt(p.x, p.y, _f);
    const tr = clamp(dt * 7, 0, 1);
    p.vx = lerp(p.vx, _f.x, tr);
    p.vy = lerp(p.vy, _f.y, tr);
    const sp = Math.hypot(p.vx * ASP, p.vy);
    if (sp > 0.85) { p.vx *= 0.85 / sp; p.vy *= 0.85 / sp; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    collideLogs(p);
    // side walls bounce diverted water back into play; the bottom edge
    // absorbs: groundwater, counted as soak-away
    if (p.x < 0.012) { p.x = 0.012; p.vx = Math.abs(p.vx) * 0.6; }
    else if (p.x > 0.988) { p.x = 0.988; p.vx = -Math.abs(p.vx) * 0.6; }
    let dead = false;
    for (let k = 0; k < 3; k++) {
      const pl = pools[k];
      const du = (p.x - pl.x) * ASP, dv = p.y - pl.y;
      // elliptical watershed: taller than wide, catches streams
      // falling just past the basin
      const rx = pl.rV * 1.15, ry = pl.rV * 1.9;
      if ((du * du) / (rx * rx) + (dv * dv) / (ry * ry) < 1) { pl.flow += 1; dead = true; break; }
    }
    if (!dead && (p.y > 0.985 || p.life > p.max)) { lostFlow += 1; dead = true; }
    if (dead) { parts[i] = parts[parts.length - 1]; parts.pop(); }
  }
  // foam
  for (let i = foams.length - 1; i >= 0; i--) {
    const f = foams[i]; f.life += dt;
    f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= (1 - dt * 2);
    if (f.life > f.max) { foams[i] = foams[foams.length - 1]; foams.pop(); }
  }
  // sparks
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life += dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vx *= (1 - dt * 1.5); s.vy *= (1 - dt * 1.5);
    if (s.life > s.max) { sparks[i] = sparks[sparks.length - 1]; sparks.pop(); }
  }
  // rings
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += dt * 0.16; r.a -= dt * 0.9;
    if (r.a <= 0) { rings[i] = rings[rings.length - 1]; rings.pop(); }
  }

  // shares for creature logic
  const tot = sum + 1e-6;
  const shares = pools.map(p => p.flow / tot);
  for (let i = 0; i < 3; i++) {
    const p = pools[i];
    if (shares[i] < 0.07) p.thirstyT += dt; else p.thirstyT = Math.max(0, p.thirstyT - dt * 2);
  }

  // creatures
  for (const c of creatures) {
    c.dart *= Math.exp(-dt * 3);
    if (c.state === 'swim') {
      const p = pools[c.home];
      c.wanderA += dt * (0.5 + c.dart * 2) * (c.hue > 0.5 ? 1 : -1);
      c.wanderR = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(simT * 0.9 + c.hue * 9));
      let tx = p.x + Math.cos(c.wanderA) * p.rV * c.wanderR / ASP;
      let ty = p.y + Math.sin(c.wanderA) * p.rV * c.wanderR;
      // schooling: keep a little personal space so a full pool does not
      // collapse into one overexposed blob
      for (const o of creatures) {
        if (o === c || o.state !== 'swim' || o.home !== c.home) continue;
        const dx = (c.x - o.x) * ASP, dy = c.y - o.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 0.0016 && d2 > 1e-8) {
          const d = Math.sqrt(d2);
          tx += dx / d * 0.02 / ASP; ty += dy / d * 0.02;
        }
      }
      const k = clamp(dt * 2.2, 0, 1);
      c.vx = (tx - c.x) * k / Math.max(dt, 1e-3); c.vy = (ty - c.y) * k / Math.max(dt, 1e-3);
      c.x = lerp(c.x, tx, k); c.y = lerp(c.y, ty, k);
      c.decideT -= dt;
      if (c.decideT <= 0) {
        c.decideT = 1.6 + rand() * 2.4;
        const my = shares[c.home];
        let best = c.home, bs = my;
        for (let i = 0; i < 3; i++) if (shares[i] > bs) { bs = shares[i]; best = i; }
        if ((best !== c.home && bs > my + 0.05 && rand() < 0.8) || (my < 0.045 && rand() < 0.9)) {
          const tp = pools[best];
          const ang = Math.atan2((c.y - tp.y), (c.x - tp.x) * ASP);
          c.state = 'travel'; c.t = 0; c.to = best;
          c.fx = c.x; c.fy = c.y;
          c.tx = tp.x + Math.cos(ang) * tp.rV * 0.6 / ASP;
          c.ty = tp.y + Math.sin(ang) * tp.rV * 0.6;
          c.cx = (c.fx + c.tx) / 2; c.cy = Math.min(c.fy, c.ty) - 0.14 - rand() * 0.08;
        }
      }
    } else {
      c.t += dt / 2.4;
      if (c.t >= 1) {
        const tp = pools[c.to];
        c.home = c.to; c.state = 'swim';
        c.x = c.tx; c.y = c.ty;
        tp.excited = 1;
        rings.push({ x: tp.x, y: tp.y, r: tp.rV * 0.4, a: 0.9 });
        for (let s = 0; s < 5; s++) {
          const a = rand() * TAU;
          sparks.push({ x: tp.x, y: tp.y, vx: Math.cos(a) * 0.12 / ASP, vy: Math.sin(a) * 0.12, life: 0, max: 0.5 + rand() * 0.4 });
        }
        for (const o of creatures) {
          if (o !== c && o.state === 'swim' && o.home === c.home) o.dart = 1;
        }
      } else {
        const t = c.t, mt = 1 - t;
        const nx = mt * mt * c.fx + 2 * mt * t * c.cx + t * t * c.tx;
        const ny = mt * mt * c.fy + 2 * mt * t * c.cy + t * t * c.ty;
        c.vx = (nx - c.x) / Math.max(dt, 1e-3); c.vy = (ny - c.y) / Math.max(dt, 1e-3);
        c.x = nx; c.y = ny;
      }
    }
  }
}

// ---- render: back (crisp scene) ----
function drawBack() {
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bctx.drawImage(ground, 0, 0, W, H);
  const t = simT;
  const nx = notchX * W, nw = notchW * W;

  // cliff face
  bctx.fillStyle = '#0a0d10';
  bctx.fillRect(0, 0, W, cliffH);
  // rocky lip, jumping over the notch where water pours
  bctx.fillStyle = '#0e1418';
  bctx.beginPath();
  let pen = false;
  for (let x = 0; x <= W; x += 12) {
    if (Math.abs(x - nx) < nw / 2 + 6) { pen = false; continue; }
    const y = cliffH - 5 + vnoise(x * 0.015, 3.7) * 12;
    if (!pen) { bctx.moveTo(x, y); pen = true; } else bctx.lineTo(x, y);
  }
  bctx.lineTo(W, 0); bctx.lineTo(0, 0); bctx.closePath(); bctx.fill();
  bctx.strokeStyle = 'rgba(130,190,205,0.12)'; bctx.lineWidth = 1;
  bctx.beginPath(); bctx.moveTo(0, cliffH - 4); bctx.lineTo(Math.max(0, nx - nw / 2 - 6), cliffH - 4);
  bctx.moveTo(nx + nw / 2 + 6, cliffH - 4); bctx.lineTo(W, cliffH - 4); bctx.stroke();

  // waterfall sheet: soft-edged, flickering; drawn in slices so the
  // horizontal profile fades instead of cutting
  const flick = 0.30 + 0.06 * Math.sin(t * 13) + 0.035 * Math.sin(t * 31);
  const sheetH = H * 0.13;
  const slices = 14;
  for (let s = 0; s < slices; s++) {
    const fx = (s + 0.5) / slices - 0.5;           // -0.5..0.5
    const prof = Math.cos(fx * Math.PI);           // 0 at edges, 1 center
    if (prof <= 0.01) continue;
    const sw = nw / slices;
    const wg = bctx.createLinearGradient(0, 0, 0, sheetH);
    wg.addColorStop(0, 'rgba(150,235,255,' + (flick * prof).toFixed(3) + ')');
    wg.addColorStop(1, 'rgba(90,200,240,0.03)');
    bctx.fillStyle = wg;
    bctx.fillRect(nx + fx * nw - sw / 2, 0, sw, sheetH);
  }

  // pools
  for (let i = 0; i < 3; i++) {
    const p = pools[i];
    const px = p.x * W, py = p.y * H;
    const rr = p.rV * H;
    const tot = pools[0].flow + pools[1].flow + pools[2].flow + lostFlow + 1e-6;
    const share = p.flow / tot;
    const thirsty = p.thirstyT > 1.2;
    // basin
    bctx.fillStyle = '#05090c';
    bctx.beginPath(); bctx.arc(px, py, rr, 0, TAU); bctx.fill();
    // inner glow by share
    const glow = clamp(share * 3.4, 0.07, 1) * (0.6 + p.excited * 0.4);
    const col = thirsty ? '232,150,50' : '45,225,195';
    const gg = bctx.createRadialGradient(px, py, 0, px, py, rr);
    gg.addColorStop(0, 'rgba(' + col + ',' + (glow * 0.55).toFixed(3) + ')');
    gg.addColorStop(0.7, 'rgba(' + col + ',' + (glow * 0.18).toFixed(3) + ')');
    gg.addColorStop(1, 'rgba(' + col + ',0)');
    bctx.fillStyle = gg;
    bctx.beginPath(); bctx.arc(px, py, rr, 0, TAU); bctx.fill();
    // rim
    bctx.strokeStyle = 'rgba(' + col + ',' + (0.3 + glow * 0.6).toFixed(3) + ')';
    bctx.lineWidth = 1.8;
    bctx.beginPath(); bctx.arc(px, py, rr, 0, TAU); bctx.stroke();
    bctx.strokeStyle = 'rgba(' + col + ',' + (glow * 0.2).toFixed(3) + ')';
    bctx.lineWidth = 5;
    bctx.beginPath(); bctx.arc(px, py, rr + 5, 0, TAU); bctx.stroke();
    // one slow breathing ripple
    const ph = p.ripple % 1;
    bctx.globalAlpha = (1 - ph) * 0.35 * (0.3 + glow);
    bctx.strokeStyle = 'rgba(' + col + ',1)';
    bctx.lineWidth = 1;
    bctx.beginPath(); bctx.arc(px, py, rr * (0.3 + ph * 0.6), 0, TAU); bctx.stroke();
    bctx.globalAlpha = 1;
    // label
    bctx.fillStyle = thirsty ? 'rgba(216,162,74,0.8)' : 'rgba(140,175,182,0.65)';
    bctx.font = '10px -apple-system, sans-serif';
    bctx.textAlign = 'center';
    bctx.fillText(p.name, px, py + rr + 16);
  }

  // logs
  for (let i = 0; i < logs.length; i++) {
    const L = logs[i];
    const cx = L.x * W, cy = L.y * H;
    const len = L.len * W, th = Math.max(9, L.half * H * 2);
    bctx.save();
    bctx.translate(cx, cy); bctx.rotate(L.ang);
    if (i === selectedLog) {
      bctx.strokeStyle = 'rgba(120,225,245,0.65)'; bctx.lineWidth = 1.5;
      bctx.beginPath();
      if (bctx.roundRect) bctx.roundRect(-len / 2 - 7, -th / 2 - 7, len + 14, th + 14, 10);
      else bctx.rect(-len / 2 - 7, -th / 2 - 7, len + 14, th + 14);
      bctx.stroke();
    }
    // body
    const lg = bctx.createLinearGradient(0, -th / 2, 0, th / 2);
    lg.addColorStop(0, '#3a2c1c'); lg.addColorStop(0.45, '#241a10'); lg.addColorStop(1, '#120c06');
    bctx.fillStyle = lg;
    bctx.beginPath();
    if (bctx.roundRect) bctx.roundRect(-len / 2, -th / 2, len, th, th / 2);
    else bctx.rect(-len / 2, -th / 2, len, th);
    bctx.fill();
    // grain
    bctx.strokeStyle = 'rgba(12,8,4,0.5)'; bctx.lineWidth = 1;
    const gr = mulberry32((L.grain | 0) + 7);
    for (let k = 0; k < 4; k++) {
      const gy = -th / 2 + (k + 0.7) * th / 4.7;
      bctx.beginPath(); bctx.moveTo(-len / 2 + 4, gy);
      for (let x = -len / 2 + 4; x < len / 2 - 4; x += 12) {
        bctx.lineTo(x, gy + Math.sin(x * 0.05 + gr() * 9) * 1.6);
      }
      bctx.stroke();
    }
    // amber rim light from the water
    bctx.strokeStyle = 'rgba(220,160,80,0.5)'; bctx.lineWidth = 1.4;
    bctx.beginPath(); bctx.moveTo(-len / 2 + 3, th / 2 - 1); bctx.lineTo(len / 2 - 3, th / 2 - 1); bctx.stroke();
    // end caps
    bctx.fillStyle = '#4a3823';
    bctx.beginPath(); bctx.arc(-len / 2, 0, th / 2 - 1, 0, TAU); bctx.fill();
    bctx.beginPath(); bctx.arc(len / 2, 0, th / 2 - 1, 0, TAU); bctx.fill();
    bctx.restore();
    // rotate handle at the +cos end of the log (stable while rotating)
    const hx = cx + Math.cos(L.ang) * len / 2, hy = cy + Math.sin(L.ang) * len / 2;
    L.hx = hx / W; L.hy = hy / H;
    if (i === selectedLog) {
      bctx.fillStyle = 'rgba(232,168,63,0.95)';
      bctx.beginPath(); bctx.arc(hx, hy, 7, 0, TAU); bctx.fill();
      bctx.strokeStyle = 'rgba(255,220,150,0.8)'; bctx.lineWidth = 1.5;
      bctx.beginPath(); bctx.arc(hx, hy, 11, 0, TAU); bctx.stroke();
    }
  }
}

// ---- render: front (additive water layer with trails) ----
function drawFront(dt) {
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fctx.globalCompositeOperation = 'destination-out';
  fctx.fillStyle = 'rgba(0,0,0,' + clamp(dt * 9, 0.1, 0.5).toFixed(3) + ')';
  fctx.fillRect(0, 0, W, H);
  fctx.globalCompositeOperation = 'lighter';
  const ds = 15;
  for (const p of parts) {
    const fade = clamp(1 - p.life / p.max, 0, 1);
    const edge = clamp((0.99 - p.y) / 0.06, 0, 1);
    fctx.globalAlpha = p.a * (0.35 + 0.65 * fade) * edge;
    const s = ds * p.sz;
    fctx.drawImage(dropSprite, p.x * W - s / 2, p.y * H - s / 2, s, s);
  }
  for (const f of foams) {
    const fade = 1 - f.life / f.max;
    fctx.globalAlpha = 0.7 * fade;
    const s = 16 * f.sz;
    fctx.drawImage(foamSprite, f.x * W - s / 2, f.y * H - s / 2, s, s);
  }
  for (const s of sparks) {
    const fade = 1 - s.life / s.max;
    fctx.globalAlpha = fade;
    fctx.drawImage(sparkSprite, s.x * W - 9, s.y * H - 9, 18, 18);
  }
  fctx.globalAlpha = 1;
  // rings
  for (const r of rings) {
    fctx.strokeStyle = 'rgba(140,240,220,' + (r.a * 0.8).toFixed(3) + ')';
    fctx.lineWidth = 2;
    fctx.beginPath(); fctx.arc(r.x * W, r.y * H, r.r * H, 0, TAU); fctx.stroke();
  }
  // creatures
  for (const c of creatures) {
    const px = c.x * W, py = c.y * H;
    const thirsty = pools[c.home].thirstyT > 1.2 && c.state === 'swim';
    const bright = c.state === 'travel' ? 1.3 : (thirsty ? 0.45 : 0.95);
    const s = 22 * bright;
    fctx.globalAlpha = 0.55 * Math.min(1, bright);
    fctx.drawImage(goldSprite, px - s / 2, py - s / 2, s, s);
    // body
    const ang = Math.atan2(c.vy, c.vx * ASP);
    fctx.save();
    fctx.translate(px, py); fctx.rotate(ang);
    fctx.globalAlpha = Math.min(1, bright);
    fctx.fillStyle = thirsty ? '#8a7a5a' : '#ffe2a8';
    fctx.beginPath(); fctx.ellipse(0, 0, 5.2, 2.6, 0, 0, TAU); fctx.fill();
    fctx.beginPath(); fctx.moveTo(-4.5, 0); fctx.lineTo(-9.5, -3.4); fctx.lineTo(-9.5, 3.4); fctx.closePath(); fctx.fill();
    fctx.restore();
  }
  fctx.globalAlpha = 1;
  fctx.globalCompositeOperation = 'source-over';
}

// ---- HUD ----
const chipsEl = document.getElementById('chips');
const srcEl = document.getElementById('src');
let chipRefs = [];
function buildChips() {
  chipsEl.innerHTML = '';
  chipRefs = [];
  for (let i = 0; i < 3; i++) {
    const d = document.createElement('div');
    d.className = 'chip';
    d.innerHTML = '<div class="nm"><span>' + pools[i].name + '</span><span class="fish"></span></div>' +
      '<div class="bar"><i></i></div><div class="sub"></div>';
    chipsEl.appendChild(d);
    chipRefs.push({ bar: d.querySelector('.bar i'), sub: d.querySelector('.sub'), fish: d.querySelector('.fish'), el: d });
  }
}
let hudT = 0;
function updateHUD(dt) {
  hudT += dt;
  if (hudT < 0.25) return;
  hudT = 0;
  const tot = pools[0].flow + pools[1].flow + pools[2].flow + lostFlow + 1e-6;
  const counts = [0, 0, 0];
  for (const c of creatures) counts[c.state === 'travel' ? c.to : c.home]++;
  for (let i = 0; i < 3; i++) {
    const share = pools[i].flow / tot;
    const pct = Math.round(share * 100);
    chipRefs[i].bar.style.width = pct + '%';
    chipRefs[i].sub.textContent = pct + '% of the flow';
    chipRefs[i].fish.textContent = counts[i] + (counts[i] === 1 ? ' fish' : ' fish');
    chipRefs[i].el.classList.toggle('thirsty', pools[i].thirstyT > 1.2);
  }
  const lost = Math.round(lostFlow / tot * 100);
  srcEl.textContent = 'the source gives ' + budget + ' drops a second, fixed \u00B7 ' + lost + '% soaks away unused';
}

// ---- interaction ----
function toNorm(e) {
  const r = back.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}
function distToLog(nx, ny, L) {
  const ux = L.x * ASP, uy = L.y;
  const dxs = Math.cos(L.ang), dys = Math.sin(L.ang);
  const pxu = nx * ASP - ux, pyu = ny - uy;
  const hl = L.len * ASP / 2;
  const t = clamp(pxu * dxs + pyu * dys, -hl, hl);
  const d = Math.hypot(pxu - dxs * t, pyu - dys * t);
  return d;
}
let dragMode = null, downPos = null, downTime = 0, moved = false;

back.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const n = toNorm(e);
  downPos = n; downTime = performance.now(); moved = false;
  // handle first
  if (selectedLog >= 0) {
    const L = logs[selectedLog];
    const dh = Math.hypot((n.x - L.hx) * ASP, n.y - L.hy);
    if (dh < 30 / Math.min(W, H)) { dragMode = 'rotate'; back.setPointerCapture(e.pointerId); return; }
  }
  // then log bodies
  let best = -1, bd = 1e9;
  for (let i = 0; i < logs.length; i++) {
    const d = distToLog(n.x, n.y, logs[i]);
    if (d < bd) { bd = d; best = i; }
  }
  if (best >= 0 && bd < 34 / Math.min(W, H)) {
    selectedLog = best; dragMode = 'move';
    back.setPointerCapture(e.pointerId);
  } else {
    dragMode = null;
  }
});
back.addEventListener('pointermove', (e) => {
  if (!dragMode || !downPos) return;
  const n = toNorm(e);
  if (Math.hypot((n.x - downPos.x) * W, (n.y - downPos.y) * H) > 8) moved = true;
  const L = logs[selectedLog];
  if (dragMode === 'move') {
    L.x = clamp(n.x, 0.05, 0.95);
    L.y = clamp(n.y, 0.1, 0.95);
  } else if (dragMode === 'rotate') {
    L.ang = Math.atan2((n.y - L.y), (n.x - L.x) * ASP);
    if (L.ang < 0) L.ang += Math.PI;
    if (L.ang >= Math.PI) L.ang -= Math.PI;
  }
});
function endPointer(e) {
  if (dragMode === null && downPos && !moved && performance.now() - downTime < 600) {
    const n = toNorm(e);
    // tap on open water: reseed, unless it landed on a pool
    let onPool = false;
    for (const p of pools) {
      if (Math.hypot((n.x - p.x) * ASP, n.y - p.y) < p.rV * 1.3) { onPool = true; break; }
    }
    if (!onPool) reseed();
  }
  dragMode = null; downPos = null;
}
back.addEventListener('pointerup', endPointer);
back.addEventListener('pointercancel', () => { dragMode = null; downPos = null; });
document.getElementById('newriver').addEventListener('click', () => reseed());

function reseed(newSeed) {
  const s = (newSeed === undefined) ? ((Math.random() * 1e9) | 0) : newSeed;
  try { history.replaceState(null, '', '?seed=' + s); } catch (err) { /* file:// */ }
  buildWorld(s);
}

// ---- sizing ----
function fit() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  ASP = W / H;
  back.width = front.width = Math.round(W * DPR);
  back.height = front.height = Math.round(H * DPR);
  back.style.width = front.style.width = W + 'px';
  back.style.height = front.style.height = H + 'px';
  cliffH = Math.max(34, H * 0.052);
  renderGround();
  if (pools.length === 3) buildChannels();
}
let rsT = null;
window.addEventListener('resize', () => {
  clearTimeout(rsT);
  rsT = setTimeout(fit, 120);
});

// ---- main loop ----
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = clamp(dt, 0.001, 0.05);
  update(dt);
  drawBack();
  drawFront(dt);
  updateHUD(dt);
  requestAnimationFrame(frame);
}

// test hook for headless QA
window.__logArg = {
  get seed() { return seed; },
  shares() {
    const tot = pools[0].flow + pools[1].flow + pools[2].flow + lostFlow + 1e-6;
    return pools.map(p => +(p.flow / tot).toFixed(3));
  },
  moveLog(i, nx, ny, deg) {
    const L = logs[i];
    L.x = clamp(nx, 0.05, 0.95); L.y = clamp(ny, 0.1, 0.95);
    L.ang = (deg * Math.PI / 180) % Math.PI;
    selectedLog = i;
  },
  reseed(s) { reseed(s); },
  counts() {
    const c = [0, 0, 0];
    for (const cr of creatures) c[cr.state === 'travel' ? cr.to : cr.home]++;
    return c;
  }
};

fit();
buildWorld(seed);
requestAnimationFrame(frame);
</script>
</body>
</html>
