<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No.166 Parquet Drift</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FAFAF7; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// No.166 Parquet Drift. A horizontal strip where a square
// grid melts into a rhomb tiling and back, over one glacial
// minute. The melt is computed per vertex: each grid point
// has a square position and a rhomb position (its row sheared
// by 0.6 of a cell per step from the middle), and a front
// sweeping the strip sets each vertex's blend by its own x,
// so every intermediate column is a legal tiling, trapezoids
// leaning a little more or a little less. Nothing else is in
// the piece: ink on paper, and time. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var INK = '#111111', PAPER = '#FAFAF7';
var W = 0, H = 0, start = 0;
var OFFSET = 15000;        // frame one: front mid-strip

function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }

function draw(now) {
  if (!W || !H) return;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  var t = ((now - start + OFFSET) % 60000) / 1000;   // 0..60s
  // front: sweeps left to right over 30s, returns over 30s
  var ph = t < 30 ? smooth(t / 30) : 1 - smooth((t - 30) / 30);
  var F = -0.1 * W + 1.2 * W * ph;
  var stripH = H * 0.55;
  var cell = Math.min(stripH / 6, W / 9);
  var rows = Math.max(4, Math.round(stripH / cell));
  var yTop = (H - rows * cell) / 2;
  var nx = Math.ceil(W / cell) + 2;
  var midRow = rows / 2;
  // blended vertex positions
  var vx = [], vy = [], i, j;
  for (j = 0; j <= rows; j++) {
    vx[j] = []; vy[j] = [];
    var shear = (j - midRow) * cell * 0.6;
    for (i = 0; i <= nx; i++) {
      var xSq = -cell + i * cell;
      var mu = clamp01((F - xSq) / (0.25 * W) + 0.5);
      vx[j][i] = xSq + shear * mu;
      vy[j][i] = yTop + j * cell;
    }
  }
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  function seg(x1, y1, x2, y2) {
    var mx = (x1 + x2) / 2;
    var a = clamp01(Math.min(mx / (0.06 * W), (W - mx) / (0.06 * W)));
    if (a <= 0) return;
    ctx.globalAlpha = a * a * (3 - 2 * a);
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  for (j = 0; j <= rows; j++) for (i = 0; i < nx; i++) seg(vx[j][i], vy[j][i], vx[j][i + 1], vy[j][i + 1]);
  for (i = 0; i <= nx; i++) for (j = 0; j < rows; j++) seg(vx[j][i], vy[j][i], vx[j + 1][i], vy[j + 1][i]);
  ctx.globalAlpha = 1;
}

var rafStarted = false;
function startLoop() {
  if (!rafStarted && typeof requestAnimationFrame === 'function') {
    rafStarted = true;
    requestAnimationFrame(function tick(now) {
      draw(now);
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
    });
  }
}
function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : (window.innerWidth || 1280);
  H = vv ? vv.height : (window.innerHeight || 900);
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(performance.now());
  startLoop();
}
start = performance.now();
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
