<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shibuya, Accumulated</title>
<style>
html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#050505';
var AMBER = '#D9A441';
var RED = '#C93A3A';
var WHITE = '#EDEDE4';
var TEAL = '#2E7D74';
var BAND = 0.11;                    // live "now" band: top 11% of the field
var SCAN = 0.05;                    // slit-scan sink rate, fraction of VH per second
var DT = 0.18;                      // seconds between accreted trail samples
var LOOP = 60;                      // agent wrap cycle, seconds (keeps x(t) bounded)
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var seed = 1580;
var tapCount = 0;
var agents = [];                    // {lane, x0, v, wob, wobPh, color, r, lenF, startF}
var placedW = 0, placedH = 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
// Agents live on horizontal lanes inside the now band. Each agent is a
// pure function of time: x(t) wraps across the field on a 60 s cycle with
// a slow sinusoidal wobble, so the whole field at any t is reproducible
// from t alone. No accumulation buffer, no frame history.
function buildAgents() {
  var rnd = mulberry32(seed);
  var colors = [AMBER, AMBER, AMBER, AMBER, WHITE, WHITE, WHITE, RED, RED, TEAL];
  agents = [];
  var i;
  var n = 60;
  for (i = 0; i < n; i++) {
    var dir = rnd() < 0.5 ? -1 : 1;
    agents.push({
      lane: 0.18 + rnd() * 0.64,              // fraction of band height
      x0: rnd(),
      // Slow net drift: over the ~18 s accretion window an agent crosses
      // at most ~8% of the field, so its sunken trail reads as a near-
      // vertical streak-building, not a diagonal. The wobble is what
      // visibly moves in the live band.
      v: dir * (0.0015 + rnd() * 0.003),
      wob: 0.002 + rnd() * 0.006,
      wobPh: rnd() * TAU,
      color: colors[Math.floor(rnd() * colors.length)],
      r: 0.0022 + rnd() * 0.0048,            // fraction of minDim
      lenF: 0.55 + rnd() * 0.45,             // trail length fraction
      startF: rnd() * 0.30                   // trail starts this far below band
    });
  }
  placedW = VW; placedH = VH;
}
// Agent x position (pixels) at time t, wrapped across the field.
function agentX(a, t) {
  var fx = a.x0 + a.v * t + a.wob * Math.sin(TAU * t / 23 + a.wobPh);
  fx = fx - Math.floor(fx);
  return fx * VW;
}
// One soft blob: faint wide halo plus a brighter core. moveTo before
// every arc so batched subpaths never connect into polygons.
function blob(cx, cy, r, color, a) {
  var a2 = Number((a * 0.35).toFixed(4));
  ctx.globalAlpha = a2;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx + r * 2.2, cy);
  ctx.arc(cx, cy, r * 2.2, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = Number(a.toFixed(4));
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;
}
function draw(t) {
  lastT = t;
  size();
  if (agents.length === 0 || placedW !== VW || placedH !== VH) buildAgents();
  var minDim = Math.min(VW, VH);
  var u = minDim / 900;
  var bandH = VH * BAND;
  var scanV = VH * SCAN;             // px per second the accreted field sinks
  // Trail depth: reach ~88% of the field below the band.
  var maxK = Math.max(24, Math.round((VH * 0.88) / (DT * scanV)));
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  // The now band: a shade lighter than the ground, with a faint divider
  // where live traffic is frozen into streaks.
  ctx.fillStyle = '#080808';
  ctx.fillRect(0, 0, VW, bandH);
  ctx.globalAlpha = 0.14;
  ctx.fillStyle = WHITE;
  ctx.fillRect(0, bandH - 1, VW, 1);
  ctx.globalAlpha = 1;
  var i, k;
  // Accreted streaks: for each agent, its past positions along its lane,
  // each past sample sunk downward by the scan. Older samples sit lower
  // and fade; longer trails and overlapping smears make the bottom denser.
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < agents.length; i++) {
    var a = agents[i];
    var r = a.r * minDim;
    var kMax = Math.floor(maxK * a.lenF);
    var kStart = Math.floor(maxK * a.startF);
    for (k = kStart; k < kMax; k++) {
      var age = k / maxK;                       // 0 at the band, 1 at the floor
      var tau = t - k * DT;
      var x = agentX(a, tau);
      var y = bandH + k * DT * scanV;
      // Alpha swells just below the band, then decays with age.
      var env = age < 0.12 ? (0.35 + 0.65 * age / 0.12) : 1;
      var fade = 1 - age * age;
      var al = 0.5 * env * fade;
      if (al < 0.01) continue;
      // Smears widen slightly as they age.
      blob(x, y, r * (1 + age * 0.9), a.color, al);
    }
  }
  // Live traffic in the now band: bright blobs at their current positions.
  for (i = 0; i < agents.length; i++) {
    var b = agents[i];
    var bx = agentX(b, t);
    var by = b.lane * bandH;
    blob(bx, by, b.r * minDim * 1.15, b.color, 0.9);
  }
  ctx.globalCompositeOperation = 'source-over';
  // Caption: title, formula date, tap cue.
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'Shibuya, Accumulated  ·  2006 · 05 · 10  ·  Tap for a new rush hour.';
  ctx.font = fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  var pad = Math.round(fs * 0.7);
  var bx2 = Math.round(fs * 0.8), by2 = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  ctx.fillStyle = WHITE;
  ctx.fillRect(bx2 - pad, by2, Math.ceil(tw) + 2 * pad, fs + 2 * pad);
  ctx.fillStyle = GROUND;
  ctx.textBaseline = 'top';
  ctx.fillText(label, bx2, by2 + pad);
  if (typeof window !== 'undefined') {
    window.__p1580 = {
      t: t, seed: seed, agents: agents.length, maxK: maxK,
      tapCount: tapCount, phone: isPhone()
    };
  }
}
function onTap() {
  // Reseed from a fixed tap counter: a new rush hour, still deterministic
  // per session state. Never reloads the page.
  tapCount++;
  seed = 1580 + tapCount * 7919;
  buildAgents();
  draw(lastT);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof document !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onTap);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
