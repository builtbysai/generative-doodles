<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Carlisle Letter</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #241a10; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- seeded PRNG (mulberry32), never Math.random ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var SEED = 1383000;
  function hash2(a, b) {
    var h = (a * 374761393 + b * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (((h ^ (h >>> 16)) >>> 0) / 4294967296);
  }

  // ---- palette ----
  var PARCHMENT = '#d9c9a3';
  var PARCHMENT_DARK = '#c4b28a';
  var INK = '#4a2f1a';
  var SEAL = '#8f1f1f';
  var HUNTER = '#a81414';
  var GROUND = '#241a10';

  // ---- viewport / sizing ----
  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.round(w); H = Math.round(h);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    if (typeof document !== 'undefined' && document.body) {
      document.body.style.background = GROUND;
    }
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : W;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : H;
    var minDim = Math.min(sw, sh);
    phone = minDim < 700 || H > W * 1.15;
  }
  size();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(clockT); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { size(); draw(clockT); });
    }
  }

  // ---- fragments ----
  var COLS = 3, ROWS = 6, NF = COLS * ROWS; // 18 fragments
  var frags = [];
  (function initFrags() {
    for (var i = 0; i < NF; i++) {
      var r = mulberry32(SEED + i * 7919);
      var glyphs = [];
      var ng = 2 + Math.floor(r() * 3); // 2-4 glyphs
      for (var g = 0; g < ng; g++) {
        glyphs.push({
          kind: Math.floor(r() * 7),
          gx: 0.18 + r() * 0.64,
          gy: 0.22 + r() * 0.56,
          s: 0.10 + r() * 0.14,
          rot: (r() - 0.5) * 1.2
        });
      }
      frags.push({
        i: i,
        col: i % COLS, row: Math.floor(i / COLS),
        glyphs: glyphs,
        targetRot: (hash2(SEED + 77, i) - 0.5) * 0.10,
        driftPhase: hash2(SEED + 31, i) * Math.PI * 2,
        driftAmp: 4 + hash2(SEED + 55, i) * 8
      });
    }
  })();

  function sheetGeom() {
    var margin = phone ? 18 : 40;
    var availW = W - margin * 2;
    var availH = H - margin * 2;
    var gap = phone ? 3 : 5;
    // sheet aspect: 3 cols x 6 rows, fragment aspect ~ 1.15 (w/h)
    var fw = Math.min(availW / COLS, (availH / ROWS) * 1.15);
    var fh = fw / 1.15;
    var sw = fw * COLS + gap * (COLS - 1);
    var sh = fh * ROWS + gap * (ROWS - 1);
    if (sh > availH) { // shrink to fit height
      fh = (availH - gap * (ROWS - 1)) / ROWS;
      fw = fh * 1.15;
      sw = fw * COLS + gap * (COLS - 1);
      sh = fh * ROWS + gap * (ROWS - 1);
    }
    return { fw: fw, fh: fh, gap: gap, ox: (W - sw) / 2, oy: (H - sh) / 2 };
  }

  function scatterPos(cycle, fi) {
    var rx = hash2(SEED + 1000 + cycle * 131, fi);
    var ry = hash2(SEED + 2000 + cycle * 131, fi);
    var rr = hash2(SEED + 3000 + cycle * 131, fi);
    var m = phone ? 30 : 60;
    return {
      x: m + rx * (W - m * 2),
      y: m + ry * (H - m * 2),
      rot: (rr - 0.5) * 1.4
    };
  }

  function easeInOut(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  var CYCLE = 36;
  // phases: drift 0-8, gather 8-18, hold 18-24, scatter 24-32, drift 32-36
  function phaseAt(ct) {
    if (ct < 8) return { name: 'drift', p: ct / 8 };
    if (ct < 18) return { name: 'gather', p: (ct - 8) / 10 };
    if (ct < 24) return { name: 'hold', p: (ct - 18) / 6 };
    if (ct < 32) return { name: 'scatter', p: (ct - 24) / 8 };
    return { name: 'drift2', p: (ct - 32) / 4 };
  }

  function fragState(f, t) {
    var cycle = Math.floor(t / CYCLE);
    var ct = t - cycle * CYCLE;
    var ph = phaseAt(ct);
    var g = sheetGeom();
    var tx = g.ox + f.col * (g.fw + g.gap) + g.fw / 2;
    var ty = g.oy + f.row * (g.fh + g.gap) + g.fh / 2;
    var sA = scatterPos(cycle, f.i);
    var sB = scatterPos(cycle + 1, f.i);
    var x, y, rot, assembly = 0, wash = 0;
    var driftX = Math.sin(t * 0.35 + f.driftPhase) * f.driftAmp;
    var driftY = Math.cos(t * 0.28 + f.driftPhase) * f.driftAmp;
    if (ph.name === 'drift') {
      x = sA.x + driftX; y = sA.y + driftY; rot = sA.rot;
    } else if (ph.name === 'gather') {
      var e = easeInOut(ph.p);
      x = sA.x + (tx - sA.x) * e + driftX * (1 - e);
      y = sA.y + (ty - sA.y) * e + driftY * (1 - e);
      rot = sA.rot + (f.targetRot - sA.rot) * e;
      assembly = e;
    } else if (ph.name === 'hold') {
      x = tx + Math.sin(t * 0.5 + f.driftPhase) * 1.5;
      y = ty + Math.cos(t * 0.4 + f.driftPhase) * 1.5;
      rot = f.targetRot; assembly = 1;
    } else if (ph.name === 'scatter') {
      var e2 = easeInOut(ph.p);
      x = tx + (sB.x - tx) * e2;
      y = ty + (sB.y - ty) * e2;
      rot = f.targetRot + (sB.rot - f.targetRot) * e2;
      assembly = 1 - e2;
      wash = ph.p < 0.5 ? (ph.p / 0.5) * 0.35 : 0.35;
    } else { // drift2
      x = sB.x + driftX; y = sB.y + driftY; rot = sB.rot;
      wash = 0.35 * (1 - ph.p);
    }
    return { x: x, y: y, rot: rot, assembly: assembly, wash: wash, g: g };
  }

  // ---- drag: recorded events, closed-form decaying pull ----
  var drags = []; // {x, y, t}
  var clockT = 0; // piece time in seconds; 0 at first frame
  function onPointer(x, y) {
    drags.push({ x: x, y: y, t: clockT });
    if (drags.length > 400) drags.splice(0, drags.length - 400);
  }
  var dragging = false;
  function evPos(ev) {
    var r = { x: 0, y: 0 };
    if (ev.touches && ev.touches.length) { r.x = ev.touches[0].clientX; r.y = ev.touches[0].clientY; }
    else if (typeof ev.clientX === 'number') { r.x = ev.clientX; r.y = ev.clientY; }
    return r;
  }
  canvas.addEventListener('pointerdown', function (ev) { dragging = true; var p = evPos(ev); onPointer(p.x, p.y); });
  canvas.addEventListener('pointermove', function (ev) { if (dragging) { var p = evPos(ev); onPointer(p.x, p.y); } });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });
  canvas.addEventListener('touchstart', function (ev) { var p = evPos(ev); onPointer(p.x, p.y); }, { passive: true });
  canvas.addEventListener('touchmove', function (ev) { var p = evPos(ev); onPointer(p.x, p.y); }, { passive: true });

  function dragPull(fx, fy, t) {
    var px = 0, py = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      var age = t - d.t;
      if (age < 0 || age > 6) continue;
      var dx = d.x - fx, dy = d.y - fy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 260 || dist < 1) continue;
      var w = (1 - dist / 260) * 90 * Math.exp(-age / 2.5);
      px += (dx / dist) * w; py += (dy / dist) * w;
    }
    return { x: px, y: py };
  }

  // ---- cipher glyph drawing (shapes only, never text) ----
  function drawGlyph(kind, s, lw) {
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    var u = s;
    if (kind === 0) { // chevron
      ctx.moveTo(-u, -u * 0.4); ctx.lineTo(0, u * 0.5); ctx.lineTo(u, -u * 0.4);
    } else if (kind === 1) { // dot pair + tick
      ctx.moveTo(-u * 0.8, 0); ctx.lineTo(u * 0.8, 0);
      ctx.moveTo(0, -u); ctx.lineTo(0, u);
    } else if (kind === 2) { // open arc
      ctx.arc(0, 0, u * 0.8, -0.4, Math.PI * 1.1);
    } else if (kind === 3) { // cross
      ctx.moveTo(-u, -u); ctx.lineTo(u, u);
      ctx.moveTo(u, -u); ctx.lineTo(-u, u);
    } else if (kind === 4) { // hook / spiral tail
      ctx.arc(0, 0, u * 0.7, Math.PI * 0.9, Math.PI * 2.6);
      ctx.moveTo(u * 0.7 * Math.cos(Math.PI * 2.6), u * 0.7 * Math.sin(Math.PI * 2.6));
      ctx.lineTo(u * 1.2, u * 0.9);
    } else if (kind === 5) { // zigzag
      ctx.moveTo(-u, u * 0.5);
      ctx.lineTo(-u * 0.33, -u * 0.5);
      ctx.lineTo(u * 0.33, u * 0.5);
      ctx.lineTo(u, -u * 0.5);
    } else { // dot trail arc
      ctx.arc(-u * 0.6, 0, u * 0.14, 0, Math.PI * 2);
      ctx.moveTo(u * 0.6, 0);
      ctx.arc(u * 0.6, 0, u * 0.14, 0, Math.PI * 2);
      ctx.moveTo(-u, u * 0.6);
      ctx.arc(-u, u * 0.6, u * 0.12, 0, Math.PI * 2);
    }
    ctx.stroke();
    // dots for kinds 1/6 need fills
    if (kind === 1 || kind === 6) {
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(-u * 0.8, 0, lw * 1.1, 0, Math.PI * 2);
      ctx.arc(u * 0.8, 0, lw * 1.1, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- main draw ----
  function draw(t) {
    clockT = t;
    var g0 = sheetGeom();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var maxWash = 0, maxAssembly = 0;
    var states = [];
    for (var i = 0; i < NF; i++) {
      var st = fragState(frags[i], t);
      if (st.wash > maxWash) maxWash = st.wash;
      if (st.assembly > maxAssembly) maxAssembly = st.assembly;
      states.push(st);
    }

    for (var j = 0; j < NF; j++) {
      var f = frags[j], st = states[j];
      var pull = dragPull(st.x, st.y, t);
      var x = st.x + pull.x, y = st.y + pull.y;
      var fw = g0.fw, fh = g0.fh;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(st.rot);
      // parchment fragment
      ctx.fillStyle = PARCHMENT;
      ctx.fillRect(-fw / 2, -fh / 2, fw, fh);
      // torn edge shading: darker strip on two edges (flat alpha, no gradient)
      ctx.fillStyle = PARCHMENT_DARK;
      ctx.fillRect(-fw / 2, fh / 2 - Math.max(2, fh * 0.06), fw, Math.max(2, fh * 0.06));
      ctx.fillRect(fw / 2 - Math.max(2, fw * 0.05), -fh / 2, Math.max(2, fw * 0.05), fh);
      ctx.strokeStyle = INK;
      ctx.lineWidth = Math.max(1, fw * 0.012);
      ctx.strokeRect(-fw / 2, -fh / 2, fw, fh);
      // cipher glyphs
      ctx.strokeStyle = INK;
      ctx.fillStyle = INK;
      for (var k = 0; k < f.glyphs.length; k++) {
        var gl = f.glyphs[k];
        var gx = (gl.gx - 0.5) * fw * 0.82;
        var gy = (gl.gy - 0.5) * fh * 0.82;
        ctx.save();
        ctx.translate(gx, gy);
        ctx.rotate(gl.rot);
        drawGlyph(gl.kind, gl.s * fw, Math.max(1, fw * 0.016));
        ctx.restore();
      }
      ctx.restore();
    }

    // red seal dot at the letter sheet's bottom corner, once assembled
    if (maxAssembly > 0.5) {
      var g = g0;
      var sx = g.ox + (COLS * g.fw + (COLS - 1) * g.gap) - g.fw * 0.18;
      var sy = g.oy + (ROWS * g.fh + (ROWS - 1) * g.gap) - g.fh * 0.18;
      ctx.save();
      ctx.globalAlpha = Math.min(1, (maxAssembly - 0.5) * 2);
      ctx.fillStyle = SEAL;
      ctx.beginPath();
      ctx.arc(sx, sy, Math.max(4, g.fw * 0.09), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // hunter's-moon red wash, flat alpha, tied to the scatter phase
    if (maxWash > 0) {
      ctx.save();
      ctx.globalAlpha = maxWash;
      ctx.fillStyle = HUNTER;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  // frame one: synchronous constant-phase draw
  draw(0);

  // rAF loop, guarded (the QA renderer defines no rAF)
  var startTime = 0, started = false;
  function loop(ts) {
    if (!started) { started = true; startTime = ts; }
    var t = (ts - startTime) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
