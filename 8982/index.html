<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№8982 · Glow Only - Generative Doodles</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: #ffffff;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; width: 100%; height: 100dvh; }
  canvas#stage {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; cursor: pointer; touch-action: manipulation;
  }
  .ui {
    position: absolute; z-index: 2; pointer-events: none;
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #8a8378; user-select: none; -webkit-user-select: none;
  }
  .title {
    top: max(14px, env(safe-area-inset-top)); left: 18px;
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    opacity: 0.85;
  }
  .hint {
    bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; font-size: 12px; letter-spacing: 0.08em;
    opacity: 0.55; transition: opacity 2.5s ease;
  }
  .hint.dim { opacity: 0.22; }
  @media (max-width: 480px) {
    .title { font-size: 11px; left: 14px; }
    .hint { font-size: 11px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="ui title">№8982 · Glow Only</div>
<div class="ui hint" id="hint">click anywhere for a new palette</div>
<script>
"use strict";
/* №8982 · Glow Only
   A slow color field: the huge soft radial wash of a generated Hue-Bingo
   style palette on white, drifting and crossfading over long timescales.
   No bands, no swatches, no hard edges. */

/* ---------- seeded PRNG ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const qs = new URLSearchParams(location.search);
const SEED = (parseInt(qs.get("seed"), 10) >>> 0) || 898202;
const rng = mulberry32(SEED);

/* ---------- OKLCH <-> sRGB ---------- */
function oklchToRgb(L, C, Hdeg) {
  const H = Hdeg * Math.PI / 180;
  const a = C * Math.cos(H), b = C * Math.sin(H);
  const l = L + 0.3963377774 * a + 0.2158037573 * b;
  const m = L - 0.1055613458 * a - 0.0638541728 * b;
  const s = L - 0.0894841775 * a - 1.2914855480 * b;
  const l3 = l * l * l, m3 = m * m * m, s3 = s * s * s;
  let r =  4.0767416621 * l3 - 3.3077115913 * m3 + 0.2309699292 * s3;
  let g = -1.2684380046 * l3 + 2.6097574011 * m3 - 0.3413193965 * s3;
  let bl = -0.0041960863 * l3 - 0.7034186147 * m3 + 1.7076147010 * s3;
  const gam = (x) => {
    x = Math.min(1, Math.max(0, x));
    return x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055;
  };
  return [gam(r), gam(g), gam(bl)];
}

/* ---------- Hue Bingo palette roll (FarbVelo recipe, OKLCH) ----------
   Sandwich: dark anchor, saturated mids climbing in lightness,
   quiet desaturated bright end. Calmed for a white field. */
const STOPS = 7;
function rollPalette(r) {
  const baseHue = r() * 360;
  const slotStep = 60;                       // min hue separation
  const nSlots = 6;
  const slots = [];
  for (let k = 0; k < nSlots; k++) slots.push((baseHue + k * slotStep) % 360);
  // shuffle the mid slots so rolls vary
  const mid = slots.slice(1);
  for (let i = mid.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [mid[i], mid[j]] = [mid[j], mid[i]];
  }
  const stops = [];
  // stop 0: dark anchor
  stops.push({
    h: slots[0],
    c: 0.02 + r() * 0.045,
    l: 0.10 + r() * 0.10
  });
  // stops 1..5: mids, lightness climbing with index
  for (let i = 1; i <= 5; i++) {
    const t = (i - 1) / 4;
    stops.push({
      h: mid[(i - 1) % mid.length],
      c: 0.07 + r() * 0.08,                   // calm, never neon
      l: Math.min(0.86, 0.52 + t * 0.30 + (r() - 0.5) * 0.07)
    });
  }
  // stop 6: quiet bright end, reuses a slot at low chroma
  stops.push({
    h: mid[0],
    c: 0.015 + r() * 0.03,
    l: 0.90 + r() * 0.05
  });
  return stops;
}

/* ---------- bloom field ----------
   One soft elliptical bloom per stop, stacked like a Rothko:
   anchor low, bright end high and wide, mids in between. */
function rollBlooms(r, stops) {
  const blooms = [];
  for (let i = 0; i < STOPS; i++) {
    const s = stops[i];
    let zoneY, inten, rad, ell, bx;
    if (i === 0) {
      // dark anchor: low grounding, mostly below the frame
      zoneY = 0.88 + r() * 0.08; inten = 0.10 + r() * 0.05;
      rad = 0.62 + r() * 0.2; ell = 1.8 + r() * 0.6; bx = 0.5 + (r() - 0.5) * 0.5;
    } else if (i === 6) {
      // quiet bright end: wide airy wash across the top
      zoneY = 0.22 + r() * 0.08; inten = 0.18 + r() * 0.08;
      rad = 0.75 + r() * 0.25; ell = 1.8 + r() * 0.6; bx = 0.5 + (r() - 0.5) * 0.4;
    } else {
      // mids: distinct stacked bands, darker lower
      zoneY = 0.32 + (i - 1) * 0.125 + (r() - 0.5) * 0.07;
      inten = 0.20 + r() * 0.10;
      rad = 0.58 + r() * 0.24; ell = 1.6 + r() * 0.8; bx = 0.5 + (r() - 0.5) * 0.55;
    }
    blooms.push({
      stop: s,
      bx: bx,
      by: zoneY,
      ax: 0.03 + r() * 0.04,                 // drift amplitude
      ay: 0.015 + r() * 0.025,
      p1: 70 + r() * 90, p2: 130 + r() * 120, // drift periods (seconds)
      ph1: r() * 6.283, ph2: r() * 6.283,
      radius: rad,
      rAmp: 0.05 + r() * 0.06, rPer: 90 + r() * 110, rPh: r() * 6.283,
      ell: ell,
      inten: inten,
      iAmp: 0.18 + r() * 0.14, iPer: 55 + r() * 80, iPh: r() * 6.283
    });
  }
  return blooms;
}

function bloomCenter(b, t) {
  const TAU = Math.PI * 2;
  const dx = b.ax * (Math.sin(TAU * t / b.p1 + b.ph1) + 0.5 * Math.sin(TAU * t / b.p2 + b.ph2));
  const dy = b.ay * (Math.sin(TAU * t / b.p1 * 0.83 + b.ph2) + 0.5 * Math.sin(TAU * t / b.p2 * 1.13 + b.ph1));
  return [b.bx + dx, b.by + dy];
}
function bloomRadius(b, t) {
  return b.radius * (1 + b.rAmp * Math.sin(Math.PI * 2 * t / b.rPer + b.rPh));
}
function bloomInten(b, t) {
  return b.inten * (1 + b.iAmp * Math.sin(Math.PI * 2 * t / b.iPer + b.iPh));
}

/* ---------- palettes A (shown) and B (incoming) ---------- */
let palA = { stops: rollPalette(rng), blooms: null };
palA.blooms = rollBlooms(rng, palA.stops);
let palB = null;
let fadeStart = -1, fadeDur = 20, mixV = 0;
let pendingRoll = false;
let nextAuto = 0;

function startRoll(nowT) {
  const rr = mulberry32((Math.random() * 0xFFFFFFFF) >>> 0);
  const stops = rollPalette(rr);
  palB = { stops, blooms: rollBlooms(rr, stops) };
  fadeStart = nowT;
  fadeDur = 16 + rr() * 8;
}

function requestRoll(nowT) {
  startRoll(nowT);
}

function currentColors(t) {
  const hueDrift = 6 * Math.sin(Math.PI * 2 * t / 210 + 1.7); // degrees, very slow
  const out = [];
  for (const s of palA.stops) {
    const c = oklchToRgb(s.l, s.c, s.h + hueDrift);
    out.push(c[0], c[1], c[2]);
  }
  return out;
}

function currentGeos(t, aspect) {
  // returns {a: [...vec4], b: [...vec4]} in aspect-corrected coords
  const geo = (pal) => {
    const g = [];
    for (const b of pal.blooms) {
      const [cx, cy] = bloomCenter(b, t);
      g.push(cx * aspect, cy, bloomRadius(b, t), bloomInten(b, t));
    }
    return g;
  };
  const a = geo(palA);
  let b;
  if (palB) {
    b = [];
    for (const bl of palB.blooms) {
      const [cx, cy] = bloomCenter(bl, t);
      b.push(cx * aspect, cy, bloomRadius(bl, t), bloomInten(bl, t));
    }
  } else b = a.slice();
  return { a, b };
}

function currentElls() {
  const e = (pal) => pal.blooms.map((b) => b.ell);
  const a = e(palA);
  const b = palB ? e(palB) : a.slice();
  return { a, b };
}

/* ---------- WebGL setup ---------- */
const canvas = document.getElementById("stage");
const gl = canvas.getContext("webgl", { antialias: false, alpha: false,
  powerPreference: "low-power" });

const FRAG = `
precision highp float;
varying vec2 v_uv;
uniform vec2 u_res;
uniform float u_time;
uniform vec3 u_colA[7];
uniform vec3 u_colB[7];
uniform vec4 u_geoA[7];
uniform vec4 u_geoB[7];
uniform float u_ellA[7];
uniform float u_ellB[7];
uniform float u_mix;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for(int i = 0; i < 4; i++){ v += a * vnoise(p); p = p * 2.03 + vec2(17.3, 9.1); a *= 0.5; }
  return v;
}
void main(){
  float aspect = u_res.x / u_res.y;
  vec2 p = vec2(v_uv.x * aspect, v_uv.y);
  float t = u_time;
  // slow domain warp: painterly, non-repeating boundaries
  vec2 w = vec2(fbm(p * 1.4 + vec2(0.0, t * 0.010)),
                fbm(p * 1.4 + vec2(4.7, -t * 0.008)));
  vec2 q = p + 0.30 * (w - 0.5);
  float mottle = fbm(q * 2.6 + w + vec2(t * 0.006, 0.0));

  vec3 col = vec3(1.0);
  // arrays are uploaded bright-end-first so the anchor composites last
  for(int k = 0; k < 7; k++){
    vec2 c = mix(u_geoA[k].xy, u_geoB[k].xy, u_mix);
    float r = mix(u_geoA[k].z, u_geoB[k].z, u_mix);
    float inten = mix(u_geoA[k].w, u_geoB[k].w, u_mix);
    float ell = mix(u_ellA[k], u_ellB[k], u_mix);
    vec2 d = (q - c) * vec2(1.0, ell);
    // halo plus a tighter luminous core: the glow read
    float g1 = exp(-dot(d, d) / (r * r));
    float g2 = exp(-dot(d, d) / (r * r * 0.30));
    g1 = smoothstep(0.015, 1.0, g1);
    g2 = smoothstep(0.02, 1.0, g2);
    float m = clamp(inten * (0.60 * g1 + 0.62 * g2) * (0.72 + 0.55 * mottle), 0.0, 0.92);
    vec3 bc = mix(u_colA[k], u_colB[k], u_mix);
    col = mix(col, bc, m);
  }
  // whisper of vignette so the white edges do not glare
  float vig = smoothstep(1.30, 0.35, length((v_uv - 0.5) * vec2(aspect, 1.0)));
  col *= mix(0.965, 1.0, vig);
  // airier toward the top
  col = mix(col, vec3(1.0), 0.22 * smoothstep(0.45, 1.0, v_uv.y));
  // fine grain kills banding, adds a paper feel
  float gr = hash(v_uv * u_res * 0.5 + fract(t * 0.11) * 913.0);
  col += (gr - 0.5) * 0.028;
  gl_FragColor = vec4(col, 1.0);
}
`;
const VERT = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

let render = null;
if (gl) {
  try {
    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
      throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "a_pos");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const U = (n) => gl.getUniformLocation(prog, n);
    const uRes = U("u_res"), uTime = U("u_time"), uMix = U("u_mix");
    const uColA = U("u_colA[0]"), uColB = U("u_colB[0]");
    const uGeoA = U("u_geoA[0]"), uGeoB = U("u_geoB[0]");
    const uEllA = U("u_ellA[0]"), uEllB = U("u_ellB[0]");

    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const resize = () => {
      const w = Math.round(canvas.clientWidth * dpr);
      const h = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w; canvas.height = h;
        gl.viewport(0, 0, w, h);
      }
    };

    const reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const speed = reduceMotion ? 0 : 1;

    // reverse helpers: shader composites bright end first, anchor last
    const revN = (arr, n) => {
      const o = [];
      for (let i = STOPS - 1; i >= 0; i--)
        for (let j = 0; j < n; j++) o.push(arr[i * n + j]);
      return o;
    };
    const rev3 = (a) => revN(a, 3), rev4 = (a) => revN(a, 4);

    render = (t) => {
      resize();
      const aspect = canvas.width / Math.max(1, canvas.height);
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, t * speed);
      gl.uniform1f(uMix, mixV);
      gl.uniform3fv(uColA, rev3(currentColors(t * speed)));
      const geos = currentGeos(t * speed, aspect);
      gl.uniform4fv(uGeoA, rev4(geos.a));
      gl.uniform4fv(uGeoB, rev4(geos.b));
      const ells = currentElls();
      gl.uniform1fv(uEllA, ells.a.slice().reverse());
      gl.uniform1fv(uEllB, ells.b.slice().reverse());
      if (palB) {
        const cb = [];
        const hueDrift = 6 * Math.sin(Math.PI * 2 * (t * speed) / 210 + 1.7);
        for (const s of palB.stops) {
          const c = oklchToRgb(s.l, s.c, s.h + hueDrift);
          cb.push(c[0], c[1], c[2]);
        }
        gl.uniform3fv(uColB, rev3(cb));
      } else {
        gl.uniform3fv(uColB, rev3(currentColors(t * speed)));
      }
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
  } catch (err) {
    console.error("shader init failed", err);
    render = null;
  }
}

if (!render) {
  // graceful fallback: a static soft wash via CSS
  const c = oklchToRgb(palA.stops[3].l, palA.stops[3].c, palA.stops[3].h);
  const css = `rgb(${c.map((v) => Math.round(v * 255)).join(",")})`;
  document.body.style.background =
    `radial-gradient(120% 90% at 30% 20%, ${css}55, transparent 70%), #ffffff`;
  document.getElementById("hint").textContent = "WebGL unavailable, showing a still wash";
}

/* ---------- main loop ---------- */
const t0 = performance.now();
function frame(nowMs) {
  const t = (nowMs - t0) / 1000;
  if (nextAuto === 0) nextAuto = t + 55 + rng() * 35;
  if (palB && fadeStart >= 0) {
    const e = Math.min(1, Math.max(0, (t - fadeStart) / fadeDur));
    mixV = e * e * (3 - 2 * e);
    if (e >= 1) {
      palA = palB; palB = null; mixV = 0;
      if (pendingRoll) { pendingRoll = false; startRoll(t); }
      else nextAuto = t + 55 + Math.random() * 35;
    }
  } else if (t >= nextAuto) {
    startRoll(t);
  }
  if (render) render(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- interaction ---------- */
function roll(nowMs) {
  const t = (nowMs - t0) / 1000;
  if (palB) pendingRoll = true;   // finish the current fade, then roll
  else requestRoll(t);
}
canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); roll(performance.now()); });
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); roll(performance.now()); }
});
window.addEventListener("resize", () => { /* handled per-frame */ });
setTimeout(() => document.getElementById("hint").classList.add("dim"), 6000);
</script>
</body>
</html>
