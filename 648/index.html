<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Las Dos Orejas</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0C0F14; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var GROUND = '#0C0F14';
  var MASS = '#2E3A4A';
  var SHADOW = '#1E2836';
  var SNOW = '#E8EDF2';
  var AMBER = '#E8A33D';

  var LOOP = 30; // seconds per breath cycle, one crater pulse per cycle
  var BASE_SEED = 648001;

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, isPhone = false;

  // Arrangement: one volcano. Normalized profile points [u, v],
  // u in [-1, 1] across the base, v = height above the base line.
  var arr = null;
  var arrIndex = 0;

  function buildArrangement(idx) {
    var rng = mulberry32(BASE_SEED + idx * 7919);

    // Asymmetry draws, in fixed order (recorded in process.md).
    var tallSide = rng() < 0.5 ? -1 : 1;              // -1 left, +1 right
    var deltaH = 0.045 + rng() * 0.055;              // taller tower's extra height
    var leanTall = (rng() < 0.5 ? -1 : 1) * (0.020 + rng() * 0.030);
    var leanShort = (rng() - 0.5) * 0.030;
    var notchHalfW = 0.050 + rng() * 0.025;
    var notchDepth = 0.300 + rng() * 0.090;          // notch drop below the shorter peak
    var shoulderY = 0.300 + rng() * 0.050;
    var capShort = 0.150 + rng() * 0.050;            // snow cap depth, shorter tower
    var capExtra = 0.035 + rng() * 0.030;            // taller tower: snow line sits lower

    var peakTall = 1.0;
    var peakShort = 1.0 - deltaH;
    var peakL = tallSide < 0 ? peakTall : peakShort;
    var peakR = tallSide > 0 ? peakTall : peakShort;
    var leanL = tallSide < 0 ? leanTall : leanShort;
    var leanR = tallSide > 0 ? leanTall : leanShort;
    var peakXL = -0.34 + leanL;
    var peakXR = 0.34 + leanR;
    var notchY = peakShort - notchDepth;
    var snowL = peakL - (tallSide < 0 ? capShort + capExtra : capShort);
    var snowR = peakR - (tallSide > 0 ? capShort + capExtra : capShort);

    // Key outline points, left foot to right foot.
    var keys = [
      [-1.00, 0],
      [-0.78, shoulderY],
      [peakXL, peakL],
      [-notchHalfW, notchY],
      [0, notchY - 0.018],
      [notchHalfW, notchY],
      [peakXR, peakR],
      [0.78, shoulderY],
      [1.00, 0]
    ];
    var subdiv = [6, 9, 7, 2, 2, 7, 9, 6];

    var pts = [];
    for (var s = 0; s < keys.length - 1; s++) {
      var a = keys[s], b = keys[s + 1], n = subdiv[s];
      for (var i = 0; i < n; i++) {
        var f = i / n;
        var u = lerp(a[0], b[0], f);
        var v = lerp(a[1], b[1], f);
        if (i > 0) {
          var taper = Math.sin(f * Math.PI);
          u += (rng() - 0.5) * 0.008 * taper;
          v += (rng() - 0.5) * 0.012 * taper;
        }
        pts.push([u, v]);
      }
    }
    pts.push([1.00, 0]);

    // Snow edge jaggedness per tower, drawn after the profile noise.
    var jagL = [], jagR = [], j;
    for (j = 0; j < 5; j++) jagL.push(rng() * 0.020);
    for (j = 0; j < 5; j++) jagR.push(rng() * 0.020);

    // Peak indices (max v on each side of the notch).
    var pkL = 0, pkR = 0, k;
    for (k = 0; k < pts.length; k++) {
      if (pts[k][0] < 0 && pts[k][1] > pts[pkL][1]) pkL = k;
      if (pts[k][0] > 0 && pts[k][1] > pts[pkR][1]) pkR = k;
    }

    arr = {
      pts: pts, pkL: pkL, pkR: pkR,
      notchY: notchY, snowL: snowL, snowR: snowR,
      jagL: jagL, jagR: jagR,
      tallSide: tallSide, deltaH: deltaH,
      leanL: leanL, leanR: leanR, capShort: capShort, capExtra: capExtra
    };
  }

  // Snow cap polygon for one tower: the profile run above the snow line,
  // closed by a jagged lower edge that follows the tower's width.
  function capPath(pkIdx, pkU, snowV, jag) {
    var pts = arr.pts;
    var i0 = pkIdx, i1 = pkIdx;
    while (i0 > 0 && pts[i0 - 1][1] >= snowV) i0--;
    while (i1 < pts.length - 1 && pts[i1 + 1][1] >= snowV) i1++;
    function cross(iA, iB) {
      var A = pts[iA], B = pts[iB];
      var t = (snowV - A[1]) / (B[1] - A[1]);
      return [lerp(A[0], B[0], t), snowV];
    }
    var out = [];
    if (i0 > 0) out.push(cross(i0, i0 - 1));
    for (var k = i0; k <= i1; k++) out.push(pts[k]);
    if (i1 < pts.length - 1) out.push(cross(i1, i1 + 1));
    // Jagged lower edge back from the inner crossing to the outer one.
    // Endpoints are tucked toward the peak so the edge stays inside the
    // silhouette where the flanks widen below the snow line.
    var first = out[0], last = out[out.length - 1];
    var e0 = lerp(last[0], pkU, 0.07), e1 = lerp(first[0], pkU, 0.07);
    for (var j = 1; j <= 5; j++) {
      var f = j / 6;
      out.push([lerp(e0, e1, f), snowV - jag[j - 1]]);
    }
    return out;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || H > W * 1.15;
  }

  function draw(tSec) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var halfW = W * (isPhone ? 0.44 : 0.36);
    var hv = H * (isPhone ? 0.36 : 0.50);
    var cap = halfW * 2 * 0.75;
    if (hv > cap) hv = cap;
    var cx = W / 2;
    var baseY = H * 0.51 + hv / 2;

    // Breath: global scale about the base anchor, exactly 1.0 at t = 0.
    var phase = (((tSec % LOOP) + LOOP) % LOOP) / LOOP;
    var scale = 1 + 0.015 * Math.sin(phase * Math.PI * 2);

    ctx.save();
    ctx.translate(cx, baseY);
    ctx.scale(scale, scale);

    function X(u) { return u * halfW; }
    function Y(v) { return -v * hv; }

    // Silhouette: base cone and both towers as one filled path.
    var pts = arr.pts;
    ctx.beginPath();
    ctx.moveTo(X(pts[0][0]), Y(pts[0][1]));
    for (var k = 1; k < pts.length; k++) ctx.lineTo(X(pts[k][0]), Y(pts[k][1]));
    ctx.closePath();
    ctx.fillStyle = MASS;
    ctx.fill();

    // Shadow: a diagonal facet from the crater notch down across the
    // right base half, clipped to the silhouette.
    ctx.save();
    ctx.clip();
    ctx.beginPath();
    ctx.moveTo(X(0), Y(arr.notchY + 0.02));
    ctx.lineTo(X(1.05), Y(0.42));
    ctx.lineTo(X(1.05), Y(-0.05));
    ctx.lineTo(X(-0.02), Y(-0.05));
    ctx.closePath();
    ctx.fillStyle = SHADOW;
    ctx.fill();
    ctx.restore();

    // Snow caps, clipped to each tower by construction.
    var caps = [capPath(arr.pkL, pts[arr.pkL][0], arr.snowL, arr.jagL), capPath(arr.pkR, pts[arr.pkR][0], arr.snowR, arr.jagR)];
    ctx.fillStyle = SNOW;
    for (var c = 0; c < 2; c++) {
      var cp = caps[c];
      ctx.beginPath();
      ctx.moveTo(X(cp[0][0]), Y(cp[0][1]));
      for (var m = 1; m < cp.length; m++) ctx.lineTo(X(cp[m][0]), Y(cp[m][1]));
      ctx.closePath();
      ctx.fill();
    }

    // Crater pulse: once per cycle, a faint amber glow in the notch
    // over about four seconds (t in [13, 17]), then dark again.
    var ct = ((tSec % LOOP) + LOOP) % LOOP;
    if (ct >= 13 && ct <= 17) {
      var env = Math.sin((ct - 13) / 4 * Math.PI);
      var nx = X(0), ny = Y(arr.notchY);
      var rx = halfW * 0.13, ry = hv * 0.045;
      var layers = [[1.00, 0.16], [0.62, 0.22], [0.34, 0.30]];
      ctx.fillStyle = AMBER;
      for (var L = 0; L < layers.length; L++) {
        ctx.globalAlpha = env * layers[L][1];
        ctx.beginPath();
        ctx.ellipse(nx, ny, rx * layers[L][0], ry * layers[L][0], 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  // Anchored elapsed clock from rAF timestamps.
  // Frame one is drawn synchronously at t = 0 (breath scale exactly 1.0).
  var t0 = null;
  var lastTs = null;

  function elapsed(tsMs) { return (tsMs - t0) / 1000; }

  // QA hook: ?t=<seconds> freezes the synchronous frame at that loop time.
  var qaT = null;
  if (typeof location !== 'undefined' && location.search) {
    var mm = /t=([0-9.]+)/.exec(location.search);
    if (mm) qaT = parseFloat(mm[1]);
  }

  function redraw() {
    if (qaT !== null) draw(qaT);
    else if (lastTs !== null && t0 !== null) draw(elapsed(lastTs));
    else draw(0);
  }

  function frame(ts) {
    if (t0 === null) t0 = ts;
    lastTs = ts;
    draw(elapsed(ts));
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  // Double-tap reseeds a new pair of towers. Single taps and drags do nothing.
  var lastTapTs = -1e9;
  canvas.addEventListener('pointerdown', function (ev) {
    if (ev.timeStamp - lastTapTs < 350) {
      arrIndex++;
      buildArrangement(arrIndex);
      lastTapTs = -1e9;
      redraw();
    } else {
      lastTapTs = ev.timeStamp;
    }
  });

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); redraw(); });
  }
  window.addEventListener('resize', function () { resize(); redraw(); });

  buildArrangement(0);
  resize();

  if (qaT !== null) {
    draw(qaT);
  } else {
    draw(0); // frame one: breath neutral, crater dark, synchronous
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
