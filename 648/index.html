<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1989 Two Passes, Same Hand</title>
<style>
  html, body { margin: 0; padding: 0; background: #050506; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1989 Two Passes, Same Hand, MC6 / PP1236, study #259 mateo-villanueva-brandt.
  // A simple night shore: dark figure, water, sky. Over ninety seconds the
  // grade pulls from near-black monochrome through deep blue to a hot ember
  // finish, then back. The scene itself barely moves; the grade moves like
  // weather. Drag scrubs the grade between its two poles; release resumes
  // the slow cycle. The scene is defined once in neutral luminance and the
  // grade is a pure function of (luminance, grade), so scrubbing the grade
  // never changes the scene content and only one colour is ever on screen.
  var GROUND = '#050506'; // page ground, near black

  // Fixed-phase first frame: FIRST_T = 18 s. The cycle is 90 s: the grade
  // rises 0 to 1 over the first 45 s and falls back over the next 45 s, so
  // at t = 18 the grade is 0.40, a deep blue night with the ember still
  // to come. The first frame shows the shore already graded, the figure
  // already standing at the waterline.
  var FIRST_T = 18;
  var CYCLE = 90;
  var SEED = 1989;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // ?g=<0..1> forces the grade at load, simulating a drag-held
  // grade, so the drag state can be probe-rendered too.
  // All read at load only.
  var probeT = null, probeG = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
    var mg = qs.match(/[?&]g=([0-9.]+)/);
    if (mg) { probeG = parseFloat(mg[1]); }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x) {
    var i = Math.floor(x), f = x - i;
    var u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function mix(a, b, f) {
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // ---- Grade -----------------------------------------------------
  // Three grade stops, each a shadow / mid / highlight triple in
  // neutral luminance terms. g = 0 near-black monochrome, g = 0.5
  // deep blue, g = 1 hot ember. The whole journey is the palette:
  // at any grade the frame carries one colour only.
  var GRADE = [
    { s: [5, 5, 6],    m: [18, 18, 19],   h: [46, 46, 48] },     // near-black
    { s: [6, 12, 26],  m: [20, 44, 84],   h: [96, 138, 196] },   // deep blue
    { s: [38, 12, 5],  m: [150, 60, 16],  h: [255, 168, 76] }    // hot ember
  ];
  function gradeColor(lum, g) {
    g = clamp(g, 0, 1);
    var lo, hi, f;
    if (g < 0.5) { lo = GRADE[0]; hi = GRADE[1]; f = g / 0.5; }
    else { lo = GRADE[1]; hi = GRADE[2]; f = (g - 0.5) / 0.5; }
    var s = mix(lo.s, hi.s, f), m = mix(lo.m, hi.m, f), h = mix(lo.h, hi.h, f);
    lum = clamp(lum, 0, 1);
    if (lum < 0.5) { return mix(s, m, smooth(lum / 0.5)); }
    return mix(m, h, smooth((lum - 0.5) / 0.5));
  }
  function gc(lum, g) { return rgb(gradeColor(lum, g)); }
  function gca(lum, g, a) { return rgba(gradeColor(lum, g), a); }

  // Triangle wave over CYCLE: grade 0 to 1 in the first half, back
  // to 0 in the second half.
  function cycleGrade(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    if (p < CYCLE / 2) { return p / (CYCLE / 2); }
    return (CYCLE - p) / (CYCLE / 2);
  }
  function cycleDir(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    return p < CYCLE / 2 ? 1 : -1;
  }

  // Drag state. While dragging, the grade is held at the scrubbed
  // value. On release, a phase offset is chosen so the cycle
  // continues from exactly that grade, in the same direction the
  // cycle was travelling before the drag, with no jump.
  var dragging = false;
  var heldGrade = null;
  var phaseOffset = 0;
  function effectiveGrade(t) {
    if (heldGrade !== null) { return heldGrade; }
    return cycleGrade(t + phaseOffset);
  }
  function releaseGrade(t) {
    var dir = cycleDir(t + phaseOffset);
    var p;
    if (dir > 0) { p = heldGrade * (CYCLE / 2); }
    else { p = CYCLE - heldGrade * (CYCLE / 2); }
    phaseOffset = ((p - t) % CYCLE + CYCLE) % CYCLE;
    heldGrade = null;
  }

  // ---- Scene (neutral luminance) ---------------------------------
  // Stars, seeded once: x fraction, y fraction of sky, luminance, radius.
  var starRng = mulberry32(SEED * 13 + 5);
  var STARS = [];
  (function () {
    var i;
    for (i = 0; i < 90; i++) {
      STARS.push({
        x: starRng(),
        y: starRng() * 0.78,
        lum: 0.45 + starRng() * 0.5,
        r: 0.5 + starRng() * 1.1
      });
    }
  })();

  // Water shimmer lines: y fraction, phase, luminance.
  var lineRng = mulberry32(SEED * 29 + 7);
  var LINES = [];
  (function () {
    var i;
    for (i = 0; i < 26; i++) {
      LINES.push({
        y: 0.655 + (i / 25) * 0.335,
        ph: lineRng() * Math.PI * 2,
        lum: 0.20 + lineRng() * 0.14
      });
    }
  })();

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.horizonY = H * 0.64;      // horizon line, low
    L.moonX = W * 0.72;
    L.moonY = H * 0.155;
    L.moonR = Math.max(6, W * 0.022);
    L.figX = W * 0.42;          // figure small at the waterline
    L.figFeetY = H * 0.665;
    L.figH = H * 0.088;
    L.markerY = H - L.fsHint * 2.6;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Sky -------------------------------------------------------
  function drawSky(t, g) {
    var grad = ctx.createLinearGradient(0, 0, 0, L.horizonY);
    grad.addColorStop(0, gc(0.08, g));
    grad.addColorStop(0.7, gc(0.16, g));
    grad.addColorStop(1, gc(0.27, g));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, L.horizonY + 1);

    // Stars, tiny and steady, twinkling only in alpha at a slow
    // 0.3 Hz so nothing flickers.
    var i, sx, sy, sr, tw;
    for (i = 0; i < STARS.length; i++) {
      var st = STARS[i];
      sx = st.x * W; sy = st.y * L.horizonY;
      sr = st.r * (W / 720 + 0.5);
      tw = 0.55 + 0.45 * Math.sin(t * 0.3 * 2 * Math.PI * 0.5 + i * 1.7);
      ctx.fillStyle = gca(st.lum, g, a4(0.35 + 0.45 * tw));
      ctx.beginPath();
      ctx.moveTo(sx + sr, sy);
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fill();
    }

    // Moon: a pale disc with a soft halo, the one bright thing
    // in the sky. Its reflection column falls in the water below.
    var hr = L.moonR * 3.2;
    var hg = ctx.createRadialGradient(L.moonX, L.moonY, 0, L.moonX, L.moonY, hr);
    hg.addColorStop(0, gca(0.55, g, a4(0.28)));
    hg.addColorStop(1, gca(0.55, g, 0));
    ctx.fillStyle = hg;
    ctx.fillRect(L.moonX - hr, L.moonY - hr, hr * 2, hr * 2);
    ctx.fillStyle = gc(0.92, g);
    ctx.beginPath();
    ctx.moveTo(L.moonX + L.moonR, L.moonY);
    ctx.arc(L.moonX, L.moonY, L.moonR, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- Water -----------------------------------------------------
  function drawWater(t, g) {
    var grad = ctx.createLinearGradient(0, L.horizonY, 0, H);
    grad.addColorStop(0, gc(0.30, g));
    grad.addColorStop(0.45, gc(0.20, g));
    grad.addColorStop(1, gc(0.10, g));
    ctx.fillStyle = grad;
    ctx.fillRect(0, L.horizonY, W, H - L.horizonY);

    // The horizon seam: a thin bright line where sky meets water.
    ctx.fillStyle = gca(0.42, g, a4(0.5));
    ctx.fillRect(0, L.horizonY - 1, W, 2);

    // Moon reflection: a broken column of bright dashes under
    // the moon, widening and wobbling as it nears the viewer.
    var i, ry, rw, rx, wob;
    for (i = 0; i < 14; i++) {
      var f = i / 13;
      ry = L.horizonY + 4 + f * (H - L.horizonY - 8);
      rw = W * (0.012 + f * 0.030);
      wob = Math.sin(t * 0.25 + i * 1.3) * W * 0.008 * (0.3 + f);
      rx = L.moonX + wob;
      ctx.fillStyle = gca(0.55 - f * 0.15, g, a4(0.42 - f * 0.22));
      ctx.fillRect(rx - rw, ry, rw * 2, Math.max(1, H * 0.0035));
    }

    // Shimmer lines: long faint horizontals that drift a few
    // pixels on slow sines. The water barely moves.
    var li;
    for (li = 0; li < LINES.length; li++) {
      var ln = LINES[li];
      var ly = ln.y * H;
      var drift = Math.sin(t * 0.22 + ln.ph) * W * 0.006;
      var len = W * (0.10 + 0.25 * vnoise(li * 1.31 + t * 0.02));
      var lx = W * (0.08 + 0.75 * hash1(li * 3.7)) + drift;
      ctx.fillStyle = gca(ln.lum, g, a4(0.28));
      ctx.fillRect(lx, ly, len, Math.max(1, H * 0.0016));
    }
  }

  // ---- Figure ----------------------------------------------------
  // A small dark figure at the waterline, back to the viewer:
  // round head, long coat widening to the feet. It stands almost
  // still, swaying a fraction of a degree. Its reflection reaches
  // down into the water, broken by the shimmer.
  function drawFigure(t, g) {
    var fx = L.figX, fy = L.figFeetY, h = L.figH;
    var lean = 0.006 * Math.sin(2 * Math.PI * t / 17 + 1.2);
    var hw = h * 0.16;
    var headR = h * 0.085;

    // Reflection first, so the figure paints over its top.
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(-lean);
    ctx.fillStyle = gca(0.06, g, a4(0.5));
    ctx.beginPath();
    ctx.moveTo(-hw * 0.5, 2);
    ctx.lineTo(hw * 0.5, 2);
    ctx.lineTo(hw * 0.34, h * 0.55);
    ctx.lineTo(-hw * 0.34, h * 0.55);
    ctx.closePath();
    ctx.fill();
    // A couple of wobble dashes break the reflection up.
    ctx.fillStyle = gca(0.10, g, a4(0.35));
    ctx.fillRect(-hw * 0.30, h * 0.22, hw * 0.60, Math.max(1, H * 0.0016));
    ctx.fillRect(-hw * 0.22, h * 0.40, hw * 0.44, Math.max(1, H * 0.0016));
    ctx.restore();

    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(lean);

    // Soft ground shadow at the feet.
    ctx.fillStyle = gca(0.02, g, a4(0.6));
    ctx.beginPath();
    ctx.moveTo(hw * 1.2, -1);
    ctx.ellipse(0, -1, hw * 1.2, h * 0.018, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body: one filled path, shoulders to feet.
    ctx.fillStyle = gc(0.03, g);
    ctx.beginPath();
    ctx.moveTo(-hw * 0.55, 0);
    ctx.quadraticCurveTo(-hw * 0.85, -h * 0.42, -hw * 0.92, -h * 0.62);
    ctx.quadraticCurveTo(-hw * 0.95, -h * 0.80, -hw * 0.5, -h * 0.84);
    ctx.quadraticCurveTo(0, -h * 0.88, hw * 0.5, -h * 0.84);
    ctx.quadraticCurveTo(hw * 0.95, -h * 0.80, hw * 0.92, -h * 0.62);
    ctx.quadraticCurveTo(hw * 0.85, -h * 0.42, hw * 0.55, 0);
    ctx.closePath();
    ctx.fill();

    // Head: a soft dark circle, no face.
    ctx.fillStyle = gc(0.045, g);
    ctx.beginPath();
    ctx.moveTo(headR, -h * 0.88);
    ctx.arc(0, -h * 0.88, headR, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // ---- Grade marker ----------------------------------------------
  // A hairline track near the bottom, graded black to ember along
  // its length, with a pale tick marking the current grade.
  function drawMarker(g) {
    var x0 = W * 0.30, x1 = W * 0.70;
    var y = L.markerY;
    var seg = 48, i;
    for (i = 0; i < seg; i++) {
      var f0 = i / seg, f1 = (i + 1) / seg;
      ctx.fillStyle = gc(0.35 + 0.35 * f0, f0);
      ctx.fillRect(x0 + f0 * (x1 - x0), y, (f1 - f0) * (x1 - x0) + 1, 2);
    }
    var tx = x0 + clamp(g, 0, 1) * (x1 - x0);
    ctx.fillStyle = gca(0.95, g, a4(0.95));
    ctx.fillRect(tx - 1, y - 4, 2, 10);
  }

  // ---- Captions --------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var g = effectiveGrade(t);

    // Ground is near black; the stage is the whole image.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawSky(t, g);
    drawWater(t, g);
    drawFigure(t, g);
    drawMarker(g);

    // Caption top left with the date under it, and the hint bottom
    // center. Both take their light tone from the current grade so
    // they stay readable from black to ember.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = gca(0.88, g, a4(0.88));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1989 · Two Passes, Same Hand', W * 0.04, H * 0.055);
    ctx.fillStyle = gca(0.70, g, a4(0.75));
    ctx.font = Math.round(L.fsCap * 0.85) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2007 · 06 · 23', W * 0.04, H * 0.055 + L.fsCap * 1.35);
    ctx.textAlign = 'center';
    ctx.fillStyle = gca(0.88, g, a4(0.92));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to pull the grade from black to ember.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // ---- Interaction: drag scrubs the grade ------------------------
  // Horizontal drag maps to grade 0 to 1 across the stage. Release
  // resumes the slow cycle from the scrubbed grade, no jump.
  function pointerGrade(e) {
    var x;
    if (typeof e.offsetX === 'number') { x = e.offsetX; }
    else if (typeof e.clientX === 'number') { x = e.clientX - stageX; }
    else { return null; }
    return clamp(x / stageW, 0, 1);
  }
  function onDown(e) {
    var g = pointerGrade(e);
    if (g === null) { return; }
    dragging = true;
    heldGrade = g;
    draw(lastT);
    if (typeof e.preventDefault === 'function') { e.preventDefault(); }
  }
  function onMove(e) {
    if (!dragging) { return; }
    var g = pointerGrade(e);
    if (g === null) { return; }
    heldGrade = g;
    draw(lastT);
    if (typeof e.preventDefault === 'function') { e.preventDefault(); }
  }
  function onUp() {
    if (!dragging) { return; }
    dragging = false;
    releaseGrade(lastT);
    draw(lastT);
  }
  try {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1989 exposes the cycle state and the drag state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1989 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      grade: function (t) { return cycleGrade(t + phaseOffset); },
      effectiveGrade: function (t) { return effectiveGrade(t); },
      dragTo: function (g) { heldGrade = clamp(g, 0, 1); draw(lastT); },
      release: function () { releaseGrade(lastT); draw(lastT); },
      isDragging: function () { return dragging; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  // A ?g= probe holds the drag grade at load, like a drag that
  // has not been released yet.
  if (probeG !== null) { heldGrade = clamp(probeG, 0, 1); }

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the grade travels its ninety second cycle and the
  // water barely moves. No flicker anywhere near 14 Hz by
  // construction: the fastest motion is the star twinkle at
  // 0.15 Hz and the water drift at 0.22 rad/s. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
