<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Scale / Room Scale</title>
<style>
html, body { margin: 0; padding: 0; background: #D5E2E8; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PHASE = 2.0;
var SEED = 1611007;
var PUSH_S = 3.0;
/* print scale palette */
var P_GROUND = [213, 226, 232];
var P_BLADE = [110, 138, 158];
var P_DEEP = [35, 48, 56];
/* room scale palette */
var R_GROUND = [11, 14, 18];
var R_BLADE = [62, 85, 102];
var R_HIGH = [168, 196, 216];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function lerp(a, b, k) { return a + (b - a) * k; }
function lerpC(c0, c1, k) {
  return [Math.round(lerp(c0[0], c1[0], k)), Math.round(lerp(c0[1], c1[1], k)), Math.round(lerp(c0[2], c1[2], k))];
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}

/* ---- one fixed fan field, built once from a seeded RNG ----
   Field is 1.0 wide x 1.5 tall so a tall phone frame stays full-bleed.
   A denser cluster near (0.55, 0.75) is where the room-scale camera settles. */
var FIELD_H = 1.5;
var COLS = 7, ROWS = 9;
var ROOM_CX = 0.55, ROOM_CY = 0.75;
function makeFan(rng, x, y, sizeScale) {
  var blades = 9 + Math.floor(rng() * 5);
  var deep = [], i;
  for (i = 0; i < blades; i++) deep.push(rng() < 0.35);
  return {
    x: x, y: y,
    base: -Math.PI / 2 + (rng() - 0.5) * 1.0,
    spread: 1.5 + rng() * 0.4,
    blades: blades,
    len: (0.10 + rng() * 0.04) * (sizeScale || 1),
    phase: rng() * TAU,
    period: 9 + rng() * 5,
    deep: deep,
    tilt: (rng() - 0.5) * 0.3
  };
}
var FANS = (function () {
  var rng = mulberry32(SEED);
  var fans = [], r, c, i;
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS; c++) {
      fans.push(makeFan(rng,
        (c + 0.5) / COLS + (rng() - 0.5) * 0.07,
        ((r + 0.5) / ROWS) * FIELD_H + (rng() - 0.5) * 0.07));
    }
  }
  /* neighbour phase coupling: sway phase drifts smoothly across the grid */
  for (i = 0; i < fans.length; i++) {
    var f = fans[i];
    f.phase = (f.x * 4.4 + f.y * 2.9) + (rng() - 0.5) * 0.8;
  }
  /* denser cluster at the room-scale focus, spread wide so it stays a
     loose thicket in print scale instead of one dark knot */
  for (i = 0; i < 6; i++) {
    var a = rng() * TAU, d = 0.06 + rng() * 0.12;
    fans.push(makeFan(rng, ROOM_CX + Math.cos(a) * d, ROOM_CY + Math.sin(a) * d * 1.2, 0.85));
  }
  return fans;
})();

/* ---- scale state: closed form over piece time and recorded taps ---- */
var taps = [];
function scaleState(t) {
  var target = 0, lastTap = -1e9, i;
  for (i = 0; i < taps.length; i++) {
    if (taps[i] <= t) { target = 1 - target; lastTap = taps[i]; }
  }
  var dt = t - lastTap;
  if (dt >= PUSH_S) return target;
  var k = smooth(dt / PUSH_S);
  var from = 1 - target;
  return from + (target - from) * k;
}
function onTap() {
  taps.push(lastT);
  draw(lastT);
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onTap);
  canvas.addEventListener('touchstart', onTap);
}

/* ---- one fan: overlapping tapered blades radiating from a node, crease in each ---- */
function drawFan(f, t, s, camX, camY, scale, blade, deep, crease) {
  var px = (f.x - camX) * scale + VW / 2;
  var py = (f.y - camY) * scale + VH / 2;
  var L = f.len * scale;
  if (px < -L || px > VW + L || py < -L || py > VH + L) return;
  var sway = 0.05 * Math.sin(TAU * t / f.period + f.phase);
  var a0 = f.base + f.tilt + sway;
  var i, a, bl, tipX, tipY, w0, w1, mx, my, nx, ny;
  var isRoom = s > 0.5;
  for (i = 0; i < f.blades; i++) {
    var frac = f.blades === 1 ? 0.5 : i / (f.blades - 1);
    a = a0 - f.spread / 2 + frac * f.spread;
    /* middle blades longest, edge blades shorter: the fan silhouette */
    bl = L * (0.62 + 0.38 * Math.sin(Math.PI * frac));
    var flex = 0.02 * Math.sin(TAU * t / (f.period * 1.7) + f.phase + i * 0.9);
    a += flex;
    var dx = Math.cos(a), dy = Math.sin(a);
    nx = -dy; ny = dx;
    tipX = px + dx * bl; tipY = py + dy * bl;
    w0 = Math.max(1, bl * 0.04);
    w1 = Math.max(1.5, bl * 0.13);
    mx = px + dx * bl * 0.55; my = py + dy * bl * 0.55;
    var col = f.deep[i] ? deep : blade;
    ctx.beginPath();
    ctx.moveTo(px + nx * w0, py + ny * w0);
    ctx.lineTo(mx + nx * w1, my + ny * w1);
    ctx.lineTo(tipX, tipY);
    ctx.lineTo(mx - nx * w1, my - ny * w1);
    ctx.lineTo(px - nx * w0, py - ny * w0);
    ctx.closePath();
    ctx.fillStyle = rgb(col);
    ctx.fill();
    /* centre crease: the paper fold of the blade */
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(tipX, tipY);
    ctx.strokeStyle = rgba(crease, isRoom ? 0.55 : 0.45);
    ctx.lineWidth = Math.max(0.6, VW * 0.0009);
    ctx.stroke();
  }
  /* pivot node */
  ctx.beginPath();
  ctx.arc(px, py, Math.max(1.2, VW * 0.0022), 0, TAU);
  ctx.fillStyle = rgb(deep);
  ctx.fill();
}

function label(text, cx, y, font, px, color, ground, baseline) {
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = baseline;
  var w = ctx.measureText(text).width;
  var padX = 12, padY = 5;
  var top = baseline === 'top' ? y - padY : y - px - padY;
  ctx.fillStyle = rgb(ground);
  ctx.fillRect(cx - w / 2 - padX, top, w + padX * 2, px + padY * 2);
  ctx.fillStyle = color;
  ctx.fillText(text, cx, y);
}

function draw(t) {
  lastT = t;
  size();
  var aspect = VW / VH;
  var s = scaleState(t);
  /* camera: print shows the whole field width; room shows a fixed
     visible area around the cluster, so fan count stays right on any screen */
  var printW = 1.0;
  var printH = printW / aspect;
  if (printH > FIELD_H) { printH = FIELD_H; printW = printH * aspect; }
  var roomArea = 0.124;
  var roomW = Math.sqrt(roomArea * aspect);
  var roomH = roomW / aspect;
  var camW = lerp(printW, roomW, s);
  var camH = lerp(printH, roomH, s);
  var camX = lerp(0.5, ROOM_CX, s);
  var camY = lerp(FIELD_H / 2, ROOM_CY, s);
  camX = clamp(camX, camW / 2, 1 - camW / 2);
  camY = clamp(camY, camH / 2, FIELD_H - camH / 2);
  var scale = VW / camW;
  var ground = lerpC(P_GROUND, R_GROUND, s);
  var blade = lerpC(P_BLADE, R_BLADE, s);
  /* deep blades become the pale highlight blades at room scale, so the
     fans keep separating instead of merging into one flat mass */
  var deep = lerpC(P_DEEP, R_HIGH, s);
  var crease = lerpC(P_DEEP, R_GROUND, s);
  var ink = lerpC(P_DEEP, R_HIGH, s);
  ctx.fillStyle = rgb(ground);
  ctx.fillRect(0, 0, VW, VH);
  var i;
  for (i = 0; i < FANS.length; i++) drawFan(FANS[i], t, s, camX, camY, scale, blade, deep, crease);
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  label('Print Scale / Room Scale', VW / 2, Math.max(6, 0.012 * VH),
    'bold ' + titlePx + 'px monospace', titlePx, rgba(ink, 0.85), ground, 'top');
  label('2006 · 06 · 10', VW / 2, Math.max(6, 0.012 * VH) + titlePx + 5,
    smallPx + 'px monospace', smallPx, rgba(ink, 0.65), ground, 'top');
  label('Tap to change scale.', VW / 2, VH - 10,
    smallPx + 'px monospace', smallPx, rgba(ink, 0.7), ground, 'bottom');
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
