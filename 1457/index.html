<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pirate Junk Orlando</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #d8e2dc; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (prompt only, no other colour):
  var SKY = '#d8e2dc', SEA = '#14555a', WOOD = '#6b4a2f', SAIL = '#efe6d0',
      NAVY = '#1e2a3a', WHITE = '#f2f2f2', GOLD = '#d9a441';

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1457000);
  // Fixed decorative star/foam offsets, seeded once (deterministic).
  var foamDots = [];
  for (var i = 0; i < 14; i++) {
    foamDots.push({ x: rng(), y: rng(), r: 1 + rng() * 2 });
  }

  var W = 0, H = 0;
  function size() {
    var vw = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport.width : window.innerWidth;
    var vh = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = Math.round(W); canvas.height = Math.round(H);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  size();
  if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
    visualViewport.addEventListener('resize', size);
  }
  if (window.addEventListener) {
    window.addEventListener('resize', size);
  }

  // ---- Wind state: closed-form over recorded events, never frame-integrated ----
  // A session: { startT, w } while dragging; on release it becomes
  // { releaseT, w } and decays exponentially (tau 3 s). phaseBase folds the
  // integral of all finished sessions so windIntegral(t) stays closed-form.
  var TAU = 3;
  var session = null;      // current drag session or released session
  var phaseBase = 0;       // folded integral of wind over finished sessions
  var phaseBaseT = 0;      // time up to which phaseBase is folded

  function foldSession(now) {
    if (!session) return;
    if (session.released) {
      phaseBase += session.w * TAU * (1 - Math.exp(-(now - session.releaseT) / TAU));
    } else {
      phaseBase += session.w * (now - session.startT);
    }
    phaseBaseT = now;
    session = null;
  }
  function windAt(t) {
    if (!session) return 0;
    if (session.released) return session.w * Math.exp(-(t - session.releaseT) / TAU);
    return session.w;
  }
  function windIntegral(t) {
    var v = phaseBase;
    if (session) {
      if (session.released) v += session.w * TAU * (1 - Math.exp(-(t - session.releaseT) / TAU));
      else v += session.w * (t - session.startT);
    }
    return v;
  }

  // Pointer: drag shifts the wind. Drag x maps to wind in [-1, 1].
  var dragging = false, dragStartX = 0, dragStartT = 0;
  function windFromX(x) {
    var w = (x - dragStartX) / Math.max(W, 1) * 2;
    if (w > 1) w = 1;
    if (w < -1) w = -1;
    return w;
  }
  function onDown(e) {
    dragging = true;
    dragStartX = e.clientX; dragStartT = lastT;
    foldSession(lastT);
    session = { startT: lastT, w: 0 };
  }
  function onMove(e) {
    if (!dragging) return;
    session.w = windFromX(e.clientX);
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var w = session ? session.w : 0;
    foldSession(lastT); // fold the drag segment's integral before releasing
    session = { releaseT: lastT, w: w, released: true };
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  var lastT = 0;
  var TAU2PI = Math.PI * 2;

  function r4(x) { return Math.round(x * 10000) / 10000; }

  function draw(t) {
    lastT = t;
    var w = W, h = H;
    var u = Math.min(w, h) / 100; // unit
    var seaTop = h * 2 / 3;
    var deckY = seaTop - h * 0.02;
    var hullTop = deckY, hullBot = deckY + h * 0.13;
    var cx = w / 2;
    var hullW = Math.min(w * 0.62, 620 * (u / 9));
    if (hullW < w * 0.5) hullW = w * 0.62;
    if (w < 700) hullW = w * 0.92; // phones: full-bleed field, wider hull so the crew row breathes

    // Sky
    ctx.fillStyle = SKY;
    ctx.fillRect(0, 0, w, seaTop + 1);
    // Sea
    ctx.fillStyle = SEA;
    ctx.fillRect(0, seaTop, w, h - seaTop);

    // Sea sine bands (flat-alpha strokes of a palette colour, never gradients)
    ctx.lineWidth = Math.max(1, u * 0.35);
    ctx.strokeStyle = 'rgba(239,230,208,' + r4(0.22) + ')';
    ctx.beginPath();
    for (var x = 0; x <= w; x += 8) {
      var y1 = seaTop + h * 0.05 + Math.sin(x / w * TAU2PI * 2 + t * 0.7) * h * 0.012;
      if (x === 0) ctx.moveTo(x, y1); else ctx.lineTo(x, y1);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(239,230,208,' + r4(0.14) + ')';
    ctx.beginPath();
    for (var x2 = 0; x2 <= w; x2 += 8) {
      var y2 = seaTop + h * 0.16 + Math.sin(x2 / w * TAU2PI * 3 - t * 0.5) * h * 0.014;
      if (x2 === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
    }
    ctx.stroke();

    // Gentle hull bob
    var bob = Math.sin(t * TAU2PI / 7) * h * 0.006;
    var wind = windAt(t);
    var bellyBase = Math.sin(t * TAU2PI / 8) * 0.5 + 0.5; // 0..1 slow billow

    // Masts
    var mastH = h * 0.42;
    var mast1X = cx - hullW * 0.18, mast2X = cx + hullW * 0.22;
    ctx.fillStyle = WOOD;
    ctx.fillRect(mast1X - u * 0.5, deckY - mastH + bob, u, mastH);
    ctx.fillRect(mast2X - u * 0.5, deckY - mastH * 0.82 + bob, u, mastH * 0.82);

    // Sails: flat filled shapes whose belly follows wind + slow billow.
    function sail(x, topY, sw, sh, belly) {
      ctx.fillStyle = SAIL;
      ctx.beginPath();
      ctx.moveTo(x - sw / 2, topY + sh);
      ctx.lineTo(x - sw / 2, topY);
      ctx.quadraticCurveTo(x + belly, topY + sh * 0.3, x + sw / 2, topY);
      ctx.lineTo(x + sw / 2, topY + sh);
      ctx.quadraticCurveTo(x + belly * 0.4, topY + sh * 0.9, x - sw / 2, topY + sh);
      ctx.closePath();
      ctx.fill();
      // Sail battens (thin wood lines)
      ctx.strokeStyle = WOOD;
      ctx.lineWidth = Math.max(1, u * 0.25);
      ctx.beginPath();
      ctx.moveTo(x - sw / 2, topY + sh * 0.33);
      ctx.lineTo(x + sw / 2, topY + sh * 0.33);
      ctx.moveTo(x - sw / 2, topY + sh * 0.66);
      ctx.lineTo(x + sw / 2, topY + sh * 0.66);
      ctx.stroke();
    }
    var belly1 = (bellyBase * 0.5 + 0.25) * hullW * 0.10 + wind * hullW * 0.08;
    var belly2 = (bellyBase * 0.4 + 0.2) * hullW * 0.08 + wind * hullW * 0.06;
    sail(mast1X, deckY - mastH + bob, hullW * 0.34, mastH * 0.86, belly1);
    sail(mast2X, deckY - mastH * 0.82 + bob, hullW * 0.26, mastH * 0.68, belly2);

    // Hull (junk: high stern, raked bow)
    ctx.fillStyle = WOOD;
    ctx.beginPath();
    ctx.moveTo(cx - hullW / 2, hullTop + bob);
    ctx.lineTo(cx + hullW / 2, hullTop - h * 0.03 + bob);
    ctx.lineTo(cx + hullW * 0.42, hullBot + bob);
    ctx.lineTo(cx - hullW * 0.42, hullBot + bob);
    ctx.closePath();
    ctx.fill();
    // Deck line
    ctx.fillStyle = SAIL;
    ctx.fillRect(cx - hullW / 2, hullTop + bob, hullW, Math.max(2, u * 0.4));

    // Crew: row of small figures on deck, captain raised on a crate at right.
    // Gesture wave: effective time advances with wind integral, so the wave
    // speeds or slows with the wind without ever restarting.
    var tEff = t + 0.5 * windIntegral(t);
    var nCrew = 6;
    var crewY = hullTop + bob;
    var crewH = h * 0.085;
    var crewW = Math.min(w * 0.045, crewH * 0.55);
    var rowX0 = cx - hullW * 0.44, rowX1 = cx + hullW * 0.18;
    function figure(x, y, fh, armAngle, coat, trim) {
      // head (off-white, a palette colour)
      ctx.fillStyle = SAIL;
      ctx.beginPath();
      ctx.arc(x, y - fh * 0.84, fh * 0.16, 0, TAU2PI);
      ctx.fill();
      // body: striped uniform (navy with white stripes) or captain coat
      if (coat === 'captain') {
        ctx.fillStyle = GOLD;
        ctx.beginPath();
        ctx.moveTo(x - fh * 0.34, y);
        ctx.lineTo(x - fh * 0.22, y - fh * 0.72);
        ctx.lineTo(x + fh * 0.22, y - fh * 0.72);
        ctx.lineTo(x + fh * 0.34, y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = GOLD;
        ctx.lineWidth = Math.max(1, u * 0.3);
        ctx.beginPath();
        ctx.moveTo(x - fh * 0.28, y - fh * 0.1);
        ctx.lineTo(x + fh * 0.28, y - fh * 0.1);
        ctx.stroke();
      } else {
        ctx.fillStyle = NAVY;
        ctx.fillRect(x - fh * 0.2, y - fh * 0.72, fh * 0.4, fh * 0.72);
        ctx.fillStyle = WHITE;
        ctx.fillRect(x - fh * 0.2, y - fh * 0.52, fh * 0.4, fh * 0.07);
        ctx.fillRect(x - fh * 0.2, y - fh * 0.3, fh * 0.4, fh * 0.07);
      }
      // raised arm: angle from shoulder, drawn as a line with a hand dot
      var sx = x + fh * 0.2, sy = y - fh * 0.62;
      var ax = sx + Math.cos(-armAngle) * fh * 0.34;
      var ay = sy + Math.sin(-armAngle) * fh * 0.34;
      ctx.strokeStyle = coat === 'captain' ? GOLD : NAVY;
      ctx.lineWidth = Math.max(1.5, u * 0.45);
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ax, ay);
      ctx.stroke();
      ctx.fillStyle = SAIL;
      ctx.beginPath();
      ctx.moveTo(ax + fh * 0.05, ay);
      ctx.arc(ax, ay, fh * 0.06, 0, TAU2PI);
      ctx.fill();
    }
    for (var i = 0; i < nCrew; i++) {
      var fx = rowX0 + (rowX1 - rowX0) * (i / (nCrew - 1));
      // Captain leads at phase 0; each sailor repeats on a delay down the row.
      var ph = (tEff / 6 - i * 0.0833) % 1;
      if (ph < 0) ph += 1;
      var raise = Math.max(0, Math.sin(ph * Math.PI));
      figure(fx, crewY, crewH, raise * 1.2, 'sailor');
    }
    // Captain: raised on a crate at right, absurdly oversized gold-trimmed coat.
    var capX = cx + hullW * 0.36;
    ctx.fillStyle = WOOD;
    ctx.fillRect(capX - crewH * 0.28, crewY - crewH * 0.22, crewH * 0.56, crewH * 0.22);
    var capPh = (tEff / 6) % 1;
    var capRaise = Math.max(0, Math.sin(capPh * Math.PI));
    figure(capX, crewY - crewH * 0.22, crewH * 1.9, capRaise * 1.2, 'captain');

    // Foam dots (seeded, static positions, gentle bob with the sea)
    ctx.fillStyle = 'rgba(239,230,208,' + r4(0.35) + ')';
    for (var d = 0; d < foamDots.length; d++) {
      var fd = foamDots[d];
      ctx.fillRect(fd.x * w, seaTop + h * 0.08 + fd.y * (h - seaTop - h * 0.1), fd.r * u * 0.5, fd.r * u * 0.5);
    }
  }

  // Determinism: frame one is draw(0) at load; the clock starts with rAF.
  var startTime = null;
  function loop(ts) {
    if (startTime === null) startTime = ts;
    draw((ts - startTime) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  // Probe hook (used only by the QA harness, not by the piece itself).
  if (typeof window !== 'undefined') {
    window.__piece = { draw: draw, windAt: windAt, windIntegral: windIntegral, onDown: onDown, onMove: onMove, onUp: onUp };
  }
})();
</script>
</body>
</html>
