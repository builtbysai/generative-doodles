<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.410 Coffee Cats</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FCE8D5; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.410 Coffee Cats (yeti-iglesias, EXPANSION #44).
// After Yeti Iglesias's animal-in-vessel mechanism
// (her Black coffee cat composition): a giant coffee
// cup on a cream ground, exactly four black cats with
// yellow eyes emerging from the black coffee surface,
// steam wisps curling up, two-tone orbs and sparkles
// filling the negative space. Her signature
// hue-shifted 2-stop gradients take the set's house
// treatment: TWO FLAT TONES WITH A HARD DIAGONAL EDGE
// inside each shape - the cup is orange over hot
// pink, the steam runs purple below and white above,
// the orbs and leaves are half one tone, half the
// other. No smooth gradients anywhere. TAP the cup:
// the cats dip with a splash wobble on fixed ticks,
// three ripple ellipses spread across the coffee from
// the blinking cat, and the cats bob back up at new
// heights. The prompt's "one random cat blinks" and
// "reseed the cat heights" resolve to FIXED AUTHORED
// TABLES indexed by tap count (HEIGHT_SETS and
// BLINK_ORDER below), so every tap sequence is
// deterministic and the piece never reloads. Ambient
// 36s loop: the 3 steam strokes rise on whole cycles,
// sparkles twinkle on whole cycles, one orb drifts a
// full small circle per loop, each cat bobs on its
// own whole-cycle period and blinks at fixed slots.
// Grain is fixed dot DATA: exactly 500 speckle dots
// drawn in table order every frame, never a texture
// or filter. The only lettering is her hand-lettered
// "Yeti" signature bottom-right, drawn as STROKE
// PATHS (no font text), the set's designed-text
// exception. Frame one is drawn at the constant phase
// T = 14.0s (cats at their first authored heights,
// steam mid-rise); the clock is anchored there and
// advances in fixed 1/60 ticks, never from a wall
// clock. Flat colour only, one canvas, no offscreen
// canvas, no gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Cup tones orange / hot pink; coffee and cats near
// black; eyes yellow; steam purple / white; orbs and
// leaves pink / purple and orange / pink; ground
// cream. Nothing else.
var ORANGE = '#FF9500', PINK = '#FF4FA3';
var COFFEE = '#1A0E0A', CAT = '#111111', YELLOW = '#FFD832';
var PURPLE = '#9B30FF', WHITE = '#FFFFFF', CREAM = '#FCE8D5';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 36;
if (LOOP !== 36) throw new Error('Coffee Cats ambient loop must be 36s');
var TICK = 1 / 60;

// ---- cup geometry ---------------------------------------
// The cup fills the lower two thirds, centred. The
// coffee surface is a dark ellipse across its rim.
var CX = 640, RIM_Y = 318, TOP_HW = 395, BOT_Y = 832, BOT_HW = 285;
var COF_Y = 322, COF_RX = 372, COF_RY = 44;
function cupHalfW(y) {
  var t = (y - RIM_Y) / (BOT_Y - RIM_Y);
  if (t < 0) t = 0; if (t > 1) t = 1;
  return TOP_HW + (BOT_HW - TOP_HW) * t;
}

// ---- seeded data ----------------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
function makeRng(seedStart) {
  var s = seedStart;
  return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// ---- the cats -------------------------------------------
// Exactly four cats, a fixed recipe, emerging from the
// coffee at four fixed stations along the rim.
var CATS = [
  { x: 425, bobK: 3, bobPh: 0.4 },
  { x: 560, bobK: 4, bobPh: 1.7 },
  { x: 715, bobK: 2, bobPh: 2.9 },
  { x: 865, bobK: 6, bobPh: 4.4 }
];
if (CATS.length !== 4) throw new Error('Coffee Cats must hold exactly 4 cats');

// The authored height table: four sets of emergence
// heights in design px (how far each cat rises above
// the coffee surface). Frame one uses set 0; each tap
// on the cup advances to the next set, wrapping. The
// dip animation masks the change.
var HEIGHT_SETS = [
  [150, 105, 175, 125],
  [120, 170, 110, 160],
  [180, 130, 150, 100],
  [105, 150, 190, 140]
];
for (var hs = 0; hs < HEIGHT_SETS.length; hs++) {
  if (HEIGHT_SETS[hs].length !== 4) throw new Error('height set ' + hs + ' must hold 4 heights');
}
// The authored blink table: which cat blinks on the
// tap that lands on each height set (index = tap
// count mod 4). Set 0 is the frame-one set; its entry
// is used when the table wraps back to it.
var BLINK_ORDER = [1, 3, 0, 2];
// Ambient blink slots inside the 36s loop: fixed cat,
// fixed loop time, 0.22s each.
var BLINK_SLOTS = [
  { c: 0, t: 5.0 }, { c: 1, t: 11.0 }, { c: 2, t: 17.0 },
  { c: 3, t: 23.0 }, { c: 0, t: 29.0 }, { c: 2, t: 33.5 }
];

// ---- steam, orbs, leaves, sparkles ----------------------
// Exactly 3 steam strokes rising from the coffee.
// k = whole rise cycles per 36s loop.
var STEAMS = [
  { x: 505, k: 2, ph: 0.0 },
  { x: 640, k: 3, ph: 2.1 },
  { x: 775, k: 2, ph: 4.2 }
];
if (STEAMS.length !== 3) throw new Error('steam strokes must be exactly 3');
var STEAM_TOP = 86, STEAM_BASE = 306;

// Floating two-tone orbs in the negative space. One of
// them drifts a full small circle per 36s loop.
var ORBS = [
  { x: 172, y: 205, r: 34, drift: false },
  { x: 1108, y: 170, r: 44, drift: true },
  { x: 140, y: 520, r: 25, drift: false },
  { x: 1158, y: 398, r: 29, drift: false },
  { x: 255, y: 120, r: 19, drift: false },
  { x: 1025, y: 95, r: 16, drift: false }
];
// Floating two-tone leaves among the orbs.
var FLOAT_LEAVES = [
  { x: 215, y: 330, r: 17, rot: 0.6 },
  { x: 1075, y: 320, r: 21, rot: -0.4 },
  { x: 985, y: 610, r: 15, rot: 0.9 },
  { x: 300, y: 645, r: 18, rot: -0.8 }
];
// Sparkles: 4-point stars twinkling on whole cycles.
var SPARKLE_COLS = [WHITE, YELLOW, PURPLE];
var SPARKS = [];
(function () {
  var rng = makeRng(4107);
  var spots = [
    [90, 90], [370, 70], [880, 60], [1200, 90], [60, 380], [1215, 360],
    [330, 200], [950, 230], [180, 760], [1100, 720], [90, 640], [1190, 620],
    [450, 130], [790, 110]
  ];
  for (var i = 0; i < spots.length; i++) {
    SPARKS.push({
      x: spots[i][0], y: spots[i][1], r: 9 + rng() * 13,
      k: 2 + Math.floor(rng() * 5), ph: rng() * 6.28,
      col: SPARKLE_COLS[i % 3]
    });
  }
})();
if (SPARKS.length !== 14) throw new Error('sparkle count');

// The cup's bold floral pattern, as data: flower and
// leaf stations across the cup face, clipped to the
// trapezoid when drawn.
var PATTERN = [];
(function () {
  var rows = [425, 545, 665, 775];
  var idx = 0;
  for (var r = 0; r < rows.length; r++) {
    var y = rows[r];
    var hw = cupHalfW(y) - 62;
    var n = r % 2 === 0 ? 5 : 4;
    for (var j = 0; j < n; j++) {
      var x = CX + (n === 1 ? 0 : (j / (n - 1) - 0.5) * 2 * hw);
      PATTERN.push({ kind: idx % 3 === 2 ? 'leaf' : 'flower', x: x, y: y, s: 27 + (idx % 3) * 4, rot: (idx % 5 - 2) * 0.35, flip: idx % 2 });
      idx++;
    }
  }
})();

// Paper grain: exactly 500 fixed speckle dots over the
// whole design field, drawn in this order every frame.
var rngGrain = makeRng(410);
var GRAIN = [];
for (var gi = 0; gi < 500; gi++) {
  GRAIN.push({ x: rngGrain() * DW, y: rngGrain() * DH, r: 0.8 + rngGrain() * 1.3, pale: rngGrain() < 0.5 });
}
if (GRAIN.length !== 500) throw new Error('grain count');

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function ellA(x, y, rx, ry, rot, color, alpha) {
  ctx.globalAlpha = alpha;
  ell(x, y, rx, ry, rot, color);
  ctx.globalAlpha = 1;
}
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function segA(x1, y1, x2, y2, w, color, alpha) {
  ctx.globalAlpha = alpha;
  seg(x1, y1, x2, y2, w, color);
  ctx.globalAlpha = 1;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function poly(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}
function sparkPath(cx, cy, r, rot) {
  ctx.beginPath();
  for (var i = 0; i < 8; i++) {
    var rad = i % 2 === 0 ? r : r * 0.22;
    var a = rot + i * Math.PI / 4 - Math.PI / 2;
    var X = cx + Math.cos(a) * rad, Y = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
}

// ---- motif recipes --------------------------------------
// A two-tone leaf: pointed leaf path, pink filled,
// then the same path clipped and its left half filled
// orange - one hard edge along the leaf's axis.
function drawLeaf(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.quadraticCurveTo(r * 0.66, -r * 0.2, 0, r);
  ctx.quadraticCurveTo(-r * 0.66, -r * 0.2, 0, -r);
  ctx.closePath();
  ctx.fillStyle = PINK;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.save();
  ctx.rotate(0.55);
  ctx.fillStyle = ORANGE;
  ctx.fillRect(-r, -r * 1.2, r, r * 2.4);
  ctx.restore();
  ctx.restore();
  seg(0, -r * 0.8, 0, r * 0.85, 2, CREAM);
  ctx.restore();
}
// A pattern flower: five cream petals, alternating
// purple / orange centres.
function drawFlower(x, y, s, flip) {
  for (var p = 0; p < 5; p++) {
    var a = p * Math.PI * 2 / 5 - Math.PI / 2;
    ell(x + Math.cos(a) * s * 0.55, y + Math.sin(a) * s * 0.55, s * 0.42, s * 0.30, a, CREAM);
  }
  ell(x, y, s * 0.27, s * 0.27, 0, flip ? ORANGE : PURPLE);
}
// A two-tone orb: purple disc, pink half under a
// rotated clip, one hard diagonal edge.
function drawOrb(o, lt) {
  var x = o.x, y = o.y;
  if (o.drift) {
    var da = Math.PI * 2 * lt / LOOP;
    x += Math.cos(da) * 24;
    y += Math.sin(da) * 18;
  }
  ell(x, y, o.r, o.r, 0, PURPLE);
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(x, y, o.r, o.r, 0, 0, Math.PI * 2);
  ctx.clip();
  ctx.translate(x, y);
  ctx.rotate(-0.5);
  ctx.fillStyle = PINK;
  ctx.fillRect(-o.r, -o.r, o.r, o.r * 2);
  ctx.restore();
  ellA(x - o.r * 0.34, y - o.r * 0.38, o.r * 0.16, o.r * 0.16, 0, WHITE, 0.85);
}

// One cat, drawn with its coffee-surface station at
// (x, COF_Y) and rising h px above it. eyeS is the eye
// height scale (1 open, ~0.12 mid-blink); wob is a
// small tilt in radians from the tap splash.
function drawCat(cat, h, eyeS, wob) {
  var x = cat.x;
  ctx.save();
  ctx.translate(x, COF_Y + 26);
  ctx.rotate(wob);
  ctx.translate(-x, -(COF_Y + 26));
  // Body capsule, its foot tucked below the coffee
  // line (the coffee ellipse is drawn over it next).
  ctx.fillStyle = CAT;
  ctx.beginPath();
  var bw = 52, topY = COF_Y - h + 42, botY = COF_Y + 26;
  ctx.moveTo(x - bw, botY);
  ctx.lineTo(x - bw, topY + 30);
  ctx.quadraticCurveTo(x - bw, topY, x, topY);
  ctx.quadraticCurveTo(x + bw, topY, x + bw, topY + 30);
  ctx.lineTo(x + bw, botY);
  ctx.closePath();
  ctx.fill();
  // Ears.
  var hy = COF_Y - h + 44, hr = 46;
  poly(CAT, [x - 40, hy - 26, x - 34, hy - 62, x - 8, hy - 38]);
  poly(CAT, [x + 40, hy - 26, x + 34, hy - 62, x + 8, hy - 38]);
  // Head.
  ell(x, hy, hr, hr * 0.94, 0, CAT);
  // Eyes: yellow with a black slit pupil, scaled by
  // the blink envelope.
  var ey = hy + 2;
  ell(x - 17, ey, 9.5, 12 * eyeS, 0, YELLOW);
  ell(x + 17, ey, 9.5, 12 * eyeS, 0, YELLOW);
  if (eyeS > 0.4) {
    ell(x - 17, ey, 3.4, 6.5 * eyeS, 0, CAT);
    ell(x + 17, ey, 3.4, 6.5 * eyeS, 0, CAT);
  }
  // Nose and whiskers.
  poly(PINK, [x - 6, hy + 13, x + 6, hy + 13, x, hy + 20]);
  segA(x - 26, hy + 10, x - 52, hy + 4, 3, CREAM, 0.85);
  segA(x - 26, hy + 16, x - 53, hy + 17, 3, CREAM, 0.85);
  segA(x + 26, hy + 10, x + 52, hy + 4, 3, CREAM, 0.85);
  segA(x + 26, hy + 16, x + 53, hy + 17, 3, CREAM, 0.85);
  ctx.restore();
}

// One steam stroke: a rising sine curve drawn in 26
// segments, purple below the midpoint and white above
// (the two-tone treatment), its wave phase travelling
// upward on whole cycles of the loop and its alpha
// enveloped so it fades in at the coffee and out at
// the top.
function drawSteam(st, lt) {
  var N = 26;
  var travel = (lt * st.k / LOOP) % 1;
  var flick = 0.78 + 0.22 * Math.sin(Math.PI * 2 * st.k * lt / LOOP + st.ph);
  var px = 0, py = 0;
  for (var j = 0; j < N; j++) {
    var u0 = j / N, u1 = (j + 1) / N;
    var y0 = STEAM_BASE - u0 * (STEAM_BASE - STEAM_TOP);
    var y1 = STEAM_BASE - u1 * (STEAM_BASE - STEAM_TOP);
    var x0 = st.x + Math.sin(u0 * 4.4 - travel * Math.PI * 2 + st.ph) * 17 * (0.25 + u0);
    var x1 = st.x + Math.sin(u1 * 4.4 - travel * Math.PI * 2 + st.ph) * 17 * (0.25 + u1);
    var env = Math.pow(Math.sin(Math.PI * clamp(u0 * 1.04, 0, 1)), 0.7);
    ctx.globalAlpha = 0.85 * env * flick;
    ctx.strokeStyle = u0 < 0.52 ? PURPLE : WHITE;
    ctx.lineWidth = 11;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(j === 0 ? x0 : px, j === 0 ? y0 : py);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    px = x1; py = y1;
  }
  ctx.globalAlpha = 1;
}

// Her hand-lettered signature, stroke paths only, in
// coffee ink at the bottom right. No font text.
function drawSignature() {
  ctx.strokeStyle = COFFEE;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // Y
  ctx.beginPath();
  ctx.moveTo(1082, 826); ctx.lineTo(1101, 849); ctx.lineTo(1120, 826);
  ctx.moveTo(1101, 849); ctx.lineTo(1101, 871);
  ctx.stroke();
  // e: a small loop with its crossbar through it
  ctx.beginPath();
  ctx.ellipse(1142, 858, 10.5, 12.5, 0, 0, Math.PI * 2);
  ctx.stroke();
  seg(1131.5, 855, 1152.5, 855, 4.4, COFFEE);
  // t
  ctx.beginPath();
  ctx.moveTo(1173, 828); ctx.lineTo(1173, 866);
  ctx.quadraticCurveTo(1173, 873, 1182, 872);
  ctx.stroke();
  seg(1161, 843, 1185, 843, 4.4, COFFEE);
  // i
  seg(1204, 841, 1204, 871, 5, COFFEE);
  ell(1204, 829, 3.4, 3.4, 0, COFFEE);
  // flourish
  ctx.beginPath();
  ctx.moveTo(1078, 884);
  ctx.quadraticCurveTo(1150, 892, 1226, 879);
  ctx.stroke();
}

// ---- piece state ----------------------------------------
// Constant first-frame phase: T = 14.0s into the 36s
// loop (cats at their first authored heights, steam
// mid-rise, no blink slot active).
var T = 14.0;
var lastNow = -1, acc = 0;
var tapCount = 0;
var fromHeights = HEIGHT_SETS[0].slice();
var tapT = -1; // -1 idle; otherwise seconds into the 1.2s dip
var TAP_LEN = 1.2;

// Optional QA probe via the query string the house
// renderer passes as ?seed=... : taps=N applies N taps
// at load (heights on set N mod 4) and, for N > 0,
// pins the dip at 0.55s so the splash state renders.
// Deterministic; default play is unaffected.
var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
var tm = /taps=(\d)/.exec(qs);
if (tm) {
  tapCount = parseInt(tm[1], 10);
  if (tapCount > 0) {
    fromHeights = HEIGHT_SETS[(tapCount - 1) % 4].slice();
    tapT = 0.55;
  }
}

function smooth(p) { return p * p * (3 - 2 * p); }

function step() {
  if (tapT >= 0) {
    tapT += TICK;
    if (tapT >= TAP_LEN) tapT = -1;
  }
}

// Current emergence heights and wobble for this frame.
function catPose(i, lt) {
  var target = HEIGHT_SETS[tapCount % 4][i];
  var h = target;
  var wob = 0, dip = 0;
  if (tapT >= 0) {
    var p = clamp(tapT / TAP_LEN, 0, 1);
    h = fromHeights[i] + (target - fromHeights[i]) * smooth(p);
    dip = 58 * Math.sin(Math.PI * clamp(p * 1.12, 0, 1));
    wob = 0.055 * Math.sin(p * Math.PI * 4.5 + i * 0.7) * (1 - p);
  }
  var bob = 6 * Math.sin(Math.PI * 2 * CATS[i].bobK * lt / LOOP + CATS[i].bobPh);
  return { h: h + bob - dip, wob: wob };
}

// Eye height scale for cat i: the tap blink (the
// authored BLINK_ORDER cat, early in the dip) wins;
// otherwise the fixed ambient slots rule.
function eyeScale(i, lt) {
  if (tapT >= 0 && BLINK_ORDER[tapCount % 4] === i && tapT < 0.55) {
    return 1 - 0.88 * Math.sin(Math.PI * clamp(tapT / 0.55, 0, 1));
  }
  for (var s = 0; s < BLINK_SLOTS.length; s++) {
    var sl = BLINK_SLOTS[s];
    if (sl.c === i && lt >= sl.t && lt <= sl.t + 0.22) {
      return 1 - 0.88 * Math.sin(Math.PI * (lt - sl.t) / 0.22);
    }
  }
  return 1;
}

function drawScene(lt) {
  // Page ground: cream, everywhere.
  ctx.fillStyle = CREAM;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);

  // Orbs and floating leaves in the negative space.
  for (var o = 0; o < ORBS.length; o++) drawOrb(ORBS[o], lt);
  for (var f = 0; f < FLOAT_LEAVES.length; f++) {
    var fl = FLOAT_LEAVES[f];
    drawLeaf(fl.x, fl.y + 5 * Math.sin(Math.PI * 2 * 3 * lt / LOOP + fl.x), fl.r, fl.rot);
  }

  // Saucer: two flat tones, pink under, orange over.
  ell(CX, 848, 335, 27, 0, PINK);
  ell(CX, 844, 252, 19, 0, ORANGE);

  // Handle behind the cup: an orange ring arc, its
  // lower half overpainted pink (two flat tones).
  ctx.lineCap = 'round';
  ctx.strokeStyle = ORANGE; ctx.lineWidth = 34;
  ctx.beginPath(); ctx.arc(1058, 500, 96, -1.15, 1.15); ctx.stroke();
  ctx.strokeStyle = PINK;
  ctx.beginPath(); ctx.arc(1058, 500, 96, 0.05, 1.15); ctx.stroke();

  // Cup body: hot pink trapezoid, then the orange tone
  // across a hard diagonal edge, clipped to the cup.
  ctx.beginPath();
  ctx.moveTo(CX - TOP_HW, RIM_Y);
  ctx.lineTo(CX + TOP_HW, RIM_Y);
  ctx.lineTo(CX + BOT_HW, BOT_Y);
  ctx.lineTo(CX - BOT_HW, BOT_Y);
  ctx.closePath();
  ctx.fillStyle = PINK;
  ctx.fill();
  ctx.save();
  ctx.clip();
  poly(ORANGE, [180, 288, 762, 288, 522, 862, 180, 862]);
  // The bold floral pattern pass, clipped to the cup.
  for (var p = 0; p < PATTERN.length; p++) {
    var mp = PATTERN[p];
    if (mp.kind === 'flower') drawFlower(mp.x, mp.y, mp.s, mp.flip);
    else drawLeaf(mp.x, mp.y, mp.s * 0.8, mp.rot);
  }
  ctx.restore();

  // The cats, rising from the coffee line.
  for (var ci = 0; ci < CATS.length; ci++) {
    var pose = catPose(ci, lt);
    drawCat(CATS[ci], pose.h, eyeScale(ci, lt), pose.wob);
  }

  // The coffee surface over the cats' tucked feet.
  ell(CX, COF_Y, COF_RX, COF_RY, 0, COFFEE);
  // The rim's front lip: an orange arc along the front
  // edge of the coffee, so the cats read as emerging
  // from behind it.
  ctx.strokeStyle = ORANGE; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.ellipse(CX, COF_Y, COF_RX, COF_RY, 0, Math.PI * 0.08, Math.PI * 0.92);
  ctx.stroke();

  // Tap ripples: three cream ellipses spreading from
  // the blinking cat's station, staggered on fixed
  // ticks across the dip.
  if (tapT >= 0) {
    var bc = CATS[BLINK_ORDER[tapCount % 4]];
    for (var rj = 0; rj < 3; rj++) {
      var rp = clamp((tapT - rj * 0.18) / 0.9, 0, 1);
      if (rp <= 0 || rp >= 1) continue;
      ctx.globalAlpha = 0.55 * Math.pow(1 - rp, 1.5);
      ctx.strokeStyle = CREAM; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(bc.x, COF_Y + 8, 18 + rp * 165, (18 + rp * 165) * 0.16, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // Two cats drape a tail over the cup's front.
  ctx.strokeStyle = CAT; ctx.lineCap = 'round';
  ctx.lineWidth = 21;
  ctx.beginPath();
  ctx.moveTo(CATS[0].x - 34, COF_Y + 16);
  ctx.quadraticCurveTo(CATS[0].x - 74, COF_Y + 78, CATS[0].x - 58, COF_Y + 138);
  ctx.stroke();
  ctx.lineWidth = 19;
  ctx.beginPath();
  ctx.moveTo(CATS[3].x + 36, COF_Y + 16);
  ctx.quadraticCurveTo(CATS[3].x + 78, COF_Y + 70, CATS[3].x + 60, COF_Y + 122);
  ctx.stroke();

  // Steam, rising in the upper third.
  for (var s2 = 0; s2 < STEAMS.length; s2++) drawSteam(STEAMS[s2], lt);

  // Sparkles, twinkling on whole cycles.
  for (var k = 0; k < SPARKS.length; k++) {
    var sp = SPARKS[k];
    var tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(Math.PI * 2 * sp.k * lt / LOOP + sp.ph));
    ctx.globalAlpha = tw;
    sparkPath(sp.x, sp.y, sp.r, 0);
    ctx.fillStyle = sp.col;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Paper grain over all, fixed table order.
  for (var g2 = 0; g2 < GRAIN.length; g2++) {
    var gd = GRAIN[g2];
    if (gd.pale) ellA(gd.x, gd.y, gd.r, gd.r, 0, WHITE, 0.06);
    else ellA(gd.x, gd.y, gd.r, gd.r, 0, COFFEE, 0.05);
  }

  drawSignature();
}

function draw() { drawScene(T % LOOP); }

// ---- pointer: tap the cup --------------------------------
// A tap is a press and release close together in design
// space, landing on the cup (trapezoid, rim and cat
// zone). It advances the authored height and blink
// tables and starts the dip on fixed ticks. The piece
// never reloads.
var downX = -1, downY = -1, downT = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
function inCup(p) {
  if (p.y < 130 || p.y > 862) return false;
  var hw = p.y < RIM_Y ? TOP_HW + 34 : cupHalfW(p.y) + 40;
  return Math.abs(p.x - CX) < hw;
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved >= 28 || held >= 0.6) return;
  if (!inCup(p)) return;
  // Snapshot the heights being left (the pure set lerp,
  // without bob or dip) so a tap mid-dip still starts
  // the next dip from the true current heights.
  var cur = HEIGHT_SETS[tapCount % 4];
  var snap = [];
  for (var i = 0; i < CATS.length; i++) {
    snap.push(tapT >= 0
      ? fromHeights[i] + (cur[i] - fromHeights[i]) * smooth(clamp(tapT / TAP_LEN, 0, 1))
      : cur[i]);
  }
  fromHeights = snap;
  tapCount++;
  tapT = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; });

// ---- sizing: centred fit, page ground = cream -----------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
