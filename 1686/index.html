<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monaco Colorway, Running</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EAD8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var FIRST_T = 0;
/* DRIVER: the 2024 curve invasion as a living machine. Rounded arches,
   stacked cylinders, rollers and gear teeth assemble in a layered
   section view, like a cutaway of a machine that does something
   unknowable. The layers shift against each other slowly: arches slide
   along tracks, cylinders rotate in place, gear teeth mesh and turn.
   Every part is still placed by the same rectilinear logic, only the
   shapes are round. Colorways swap as named palettes on a slow timer:
   Monaco, then Casino, then Block Work, then back to Monaco. The
   machine idles; nothing hurries. */
var COLORWAYS = [
  { name: 'Monaco', ground: '#F2EAD8', band: '#E9DFC8', c1: '#1F6E64', c2: '#7BA889', c3: '#4A2A3A', accent: '#D9481F', ink: '#4A2A3A', rail: '#4A2A3A' },
  { name: 'Casino', ground: '#17181C', band: '#20222A', c1: '#C1272D', c2: '#2456A6', c3: '#F2B705', accent: '#1E7A34', ink: '#F2EAD8', rail: '#F2EAD8' },
  { name: 'Block Work', ground: '#F2EAD8', band: '#E4DCC8', c1: '#23201C', c2: '#6E6A63', c3: '#3A362F', accent: '#23201C', ink: '#23201C', rail: '#23201C' }
];
var WAY_HOLD = 12, WAY_BLEND = 1, CYCLE = 36;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function lerp(a, b, f) { return a + (b - a) * f; }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixHex(a, b, f) {
  var ca = hexRgb(a), cb = hexRgb(b);
  var r = Math.round(lerp(ca[0], cb[0], f));
  var g = Math.round(lerp(ca[1], cb[1], f));
  var bl = Math.round(lerp(ca[2], cb[2], f));
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
function paletteAt(t) {
  var mod = ((t % CYCLE) + CYCLE) % CYCLE;
  var wi = Math.floor(mod / WAY_HOLD) % 3;
  var within = mod - wi * WAY_HOLD;
  var out = {}, k;
  var a = COLORWAYS[wi], b = COLORWAYS[(wi + 1) % 3];
  var f = 0;
  if (within > WAY_HOLD - WAY_BLEND) f = smooth((within - (WAY_HOLD - WAY_BLEND)) / WAY_BLEND);
  for (k in a) {
    if (k === 'name') { out[k] = a[k]; continue; }
    out[k] = f === 0 ? a[k] : mixHex(a[k], b[k], f);
  }
  return out;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Square machine on desktop, full-bleed on phones. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, s: s, w: s, h: s };
}
/* ---- parts: every part is a measured mechanical shape on a grid ---- */
function drawArch(cx, baseY, R, thick, fill, t, phase, amp) {
  var x = cx + amp * Math.sin(TAU * t / 12 + phase);
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(x - R, baseY);
  ctx.arc(x, baseY, R, Math.PI, 0, false);
  ctx.lineTo(x + R - thick, baseY);
  ctx.arc(x, baseY, R - thick, 0, Math.PI, true);
  ctx.closePath();
  ctx.fill();
  /* Feet: small blocks the arch stands on. */
  ctx.fillRect(x - R - 2, baseY - 2, thick + 4, 6);
  ctx.fillRect(x + R - thick - 2, baseY - 2, thick + 4, 6);
}
function drawCylinder(cx, topY, h, rx, pal, t, phase) {
  var ry = rx * 0.32;
  var phi = TAU * t / 9 + phase;
  /* Body. */
  ctx.fillStyle = pal.c2;
  ctx.fillRect(cx - rx, topY, rx * 2, h);
  /* Side shading bands, fixed to the body. */
  ctx.fillStyle = pal.c1;
  ctx.fillRect(cx - rx, topY + h * 0.30, rx * 2, 3);
  ctx.fillRect(cx - rx, topY + h * 0.62, rx * 2, 3);
  /* Bottom ellipse. */
  ctx.fillStyle = pal.c1;
  ctx.beginPath();
  ctx.ellipse(cx, topY + h, rx, ry, 0, 0, TAU);
  ctx.fill();
  /* Top ellipse, rotating in place: a marker dot orbits its rim. */
  ctx.fillStyle = pal.c3;
  ctx.beginPath();
  ctx.ellipse(cx, topY, rx, ry, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = pal.accent;
  ctx.beginPath();
  ctx.arc(cx + Math.cos(phi) * rx * 0.62, topY + Math.sin(phi) * ry * 0.62, Math.max(3, rx * 0.09), 0, TAU);
  ctx.fill();
  /* Hub dot at the center of the top face. */
  ctx.fillStyle = pal.ground;
  ctx.beginPath();
  ctx.arc(cx, topY, Math.max(2, rx * 0.07), 0, TAU);
  ctx.fill();
}
function drawGear(cx, cy, R, teeth, angle, fill, hubFill, spokeFill) {
  var i, a, r;
  ctx.fillStyle = fill;
  ctx.beginPath();
  for (i = 0; i < teeth * 4; i++) {
    a = angle + i * TAU / (teeth * 4);
    r = (i % 4 === 1 || i % 4 === 2) ? R : R * 0.80;
    var px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  /* Disc face. */
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.80, 0, TAU);
  ctx.fill();
  /* Spokes, so the turn reads. */
  ctx.strokeStyle = spokeFill;
  ctx.lineWidth = Math.max(2, R * 0.07);
  for (i = 0; i < 4; i++) {
    a = angle + i * Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * R * 0.16, cy + Math.sin(a) * R * 0.16);
    ctx.lineTo(cx + Math.cos(a) * R * 0.72, cy + Math.sin(a) * R * 0.72);
    ctx.stroke();
  }
  /* Hub. */
  ctx.fillStyle = hubFill;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.18, 0, TAU);
  ctx.fill();
}
function drawRoller(cx, cy, r, angle, fill, spokeFill) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = spokeFill;
  ctx.lineWidth = Math.max(2, r * 0.14);
  ctx.beginPath();
  ctx.moveTo(cx - Math.cos(angle) * r * 0.7, cy - Math.sin(angle) * r * 0.7);
  ctx.lineTo(cx + Math.cos(angle) * r * 0.7, cy + Math.sin(angle) * r * 0.7);
  ctx.stroke();
  ctx.fillStyle = spokeFill;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.18, 0, TAU);
  ctx.fill();
}
function drawPlates(pal) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  var title = 'Monaco Colorway, Running';
  var date = '2006 · 08 · 24';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(title).width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(title).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText(date).width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = pal.c3;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = pal.ground;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = pal.ground;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(title, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText(date, plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the machine idle.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = pal.c3;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = pal.ground;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = pal.ground;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var pal = paletteAt(t);
  var fr = fieldRect();
  var S = fr.s;
  var u = S / 100;
  /* On phones the machine is sized to the width, so parts grow to fill
     the tall frame; desktop keeps the square proportions. */
  var k = isPhone ? 1.45 : 1;
  ctx.fillStyle = pal.ground;
  ctx.fillRect(0, 0, VW, VH);
  /* Layer bands: shallow diagonal section, each band shifted right. */
  var bandY = [fr.y + fr.h * 0.24, fr.y + fr.h * 0.50, fr.y + fr.h * 0.74];
  var bandX = [fr.x - u * 2, fr.x + u * 1, fr.x + u * 4];
  var bandH = fr.h * 0.20;
  var b;
  for (b = 0; b < 3; b++) {
    ctx.fillStyle = pal.band;
    ctx.fillRect(bandX[b], bandY[b] - bandH / 2, fr.w + u * 4, bandH);
  }
  /* Guide rails. */
  ctx.strokeStyle = pal.rail;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(bandX[0], bandY[0] + bandH * 0.42);
  ctx.lineTo(bandX[0] + fr.w + u * 4, bandY[0] + bandH * 0.42);
  ctx.moveTo(bandX[2], bandY[2] + bandH * 0.46);
  ctx.lineTo(bandX[2] + fr.w + u * 4, bandY[2] + bandH * 0.46);
  ctx.stroke();
  /* Back layer: three arches sliding on their track. */
  var archX = [fr.x + fr.w * 0.22, fr.x + fr.w * 0.50, fr.x + fr.w * 0.78];
  var archR = u * 7.5 * k, archT = u * 2.6 * k;
  var archFill = [pal.c1, pal.c3, pal.c1];
  var i;
  for (i = 0; i < 3; i++) {
    drawArch(archX[i], bandY[0] + bandH * 0.42, archR, archT, archFill[i], t, i * 2.1, u * 2.2 * k);
  }
  /* Middle layer: three cylinders rotating in place. */
  var cylX = [fr.x + fr.w * 0.22, fr.x + fr.w * 0.50, fr.x + fr.w * 0.78];
  var cylRx = u * 5.2 * k, cylH = bandH * 0.72;
  for (i = 0; i < 3; i++) {
    drawCylinder(cylX[i], bandY[1] - cylH / 2 + u * 1.5, cylH, cylRx, pal, t, i * 2.4);
  }
  /* Front layer: three meshed gears, teeth 12 / 18 / 12. Centers are
     spaced by the sum of the tip radii, so the teeth just interleave. */
  var gearR = u * 7.0 * k;
  var midR = gearR * 1.35;
  var gcx = fr.x + fr.w * 0.50;
  var gx = [gcx - (gearR + midR), gcx, gcx + (gearR + midR)];
  var gy = bandY[2];
  var th1 = TAU * t / 12;
  var th2 = -th1 * 12 / 18 + Math.PI / 18;
  var th3 = th1 + Math.PI / 12;
  drawGear(gx[0], gy, gearR, 12, th1, pal.c3, pal.accent, pal.ground);
  drawGear(gx[1], gy, gearR * 1.35, 18, th2, pal.c1, pal.accent, pal.ground);
  drawGear(gx[2], gy, gearR, 12, th3, pal.c3, pal.accent, pal.ground);
  /* Roller strip along the bottom: small discs turning together. */
  var rollY = fr.y + fr.h * 0.92;
  var rollR = u * 2.2 * k;
  var rollA = TAU * t / 6;
  for (i = 0; i < 7; i++) {
    var rxp = fr.x + fr.w * (0.10 + i * 0.133);
    drawRoller(rxp, rollY, rollR, rollA + i * 0.5, pal.c2, pal.ground);
  }
  /* Rivets at the grid intersections, fixed. */
  ctx.fillStyle = pal.ink;
  var rivX = [0.10, 0.30, 0.50, 0.70, 0.90];
  var rivY = [0.10, 0.36, 0.62, 0.88];
  var ri, rj;
  for (rj = 0; rj < rivY.length; rj++) {
    for (ri = 0; ri < rivX.length; ri++) {
      ctx.beginPath();
      ctx.arc(fr.x + fr.w * rivX[ri], fr.y + fr.h * rivY[rj], Math.max(1.5, u * 0.45), 0, TAU);
      ctx.fill();
    }
  }
  drawPlates(pal);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    colorwayAt: function (t) { return paletteAt(t).name; },
    partCounts: function () { return { arches: 3, cylinders: 3, gears: 3, rollers: 7 }; }
  };
}
/* ---- frame one: t = 0, Monaco colorway, parts at rest phase ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
