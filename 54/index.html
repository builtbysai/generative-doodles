<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№54 · Chromatic Scale</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1ea; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(23,23,28,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to scrub</div>
<script>
'use strict';

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '54', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function artRect(w,h,full){
  if (full || isPhone()) return [0,0,w,h];
  const s=Math.min(w,h); return [(w-s)/2,(h-s)/2,s,s];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}

const NOTE=['#d42b1e','#b030a0','#ef6c00','#f28ab2','#f5c518','#2f9e44','#0fa3a3','#1c9fd6','#2456c8','#b39ddb','#d8c8c0','#17171c'];
const rng=mulberry(seed*17+3);
const tiles=[];
for(let i=0;i<12;i++){ tiles.push({split:Math.floor(rng()*3), sec:NOTE[(i+7)%12]}); }
let scrub=null, dragging=false;
function drawTile(x,y,tw,th,ti,active){
  const p=NOTE[ti], s=tiles[ti].sec;
  const a=active? s:p, b=active? p:s;
  ctx.fillStyle=a; ctx.fillRect(x,y,tw,th);
  ctx.fillStyle=b;
  const sp=tiles[ti].split;
  if(sp===0){ ctx.fillRect(x+tw/2,y,tw/2,th); }
  else if(sp===1){ ctx.fillRect(x,y+th/2,tw,th/2); }
  else { ctx.beginPath(); ctx.arc(x+tw/2,y+th/2,Math.min(tw,th)*0.36,Math.PI,Math.PI*2); ctx.closePath(); ctx.fill(); }
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#f4f1ea'; ctx.fillRect(0,0,w,h);
  const t= scrub!==null? scrub*18 : (nowMs/1000)%18;
  const active=Math.floor(t/1.5)%12;
  if(isPhone()){
    const tw=w/12;
    for(let i=0;i<12;i++) drawTile(i*tw,0,tw,h,i,i===active);
    const px=(t/18)*w;
    ctx.fillStyle='#17171c'; ctx.fillRect(px-1.5,0,3,h);
  } else {
    const s=Math.min(w,h), rx=(w-s)/2, ry=(h-s)/2, cols=4, rows=3, tw=s/cols, th=s/rows;
    for(let i=0;i<12;i++){ const c=i%cols, r=Math.floor(i/cols); drawTile(rx+c*tw,ry+r*th,tw,th,i,i===active); }
    const idx=active, c=idx%cols, r=Math.floor(idx/cols);
    ctx.fillStyle='#17171c'; ctx.fillRect(rx+c*tw-1.5,ry+r*th,3,th);
  }
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(5000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',ev=>{dragging=true; const [w]=viewportWH(); scrub=Math.max(0,Math.min(0.999,ev.clientX/w));});
canvas.addEventListener('pointermove',ev=>{ if(!dragging) return; const [w]=viewportWH(); scrub=Math.max(0,Math.min(0.999,ev.clientX/w)); });
function endDrag(){ dragging=false; setTimeout(()=>{scrub=null;},4000); }
canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));

</script>
</body>
</html>
