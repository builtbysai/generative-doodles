<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roots</title>
<style>
html, body { margin: 0; padding: 0; background: #DCE9D6; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#DCE9D6';
var PLATE = '#22301F';
var PLATE_LINE = 'rgba(232,74,59,0.55)';
var TITLE_INK = '#F2F7EE';
var HINT_INK = '#F0A297';
var CORAL = '#E84A3B';
var CORAL_DEEP = '#C73A2E';
var PERIOD = 14;
var FRAME_T = 3.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* ---- authored source table: tap deals the next entry, never Math.random() ---- */
/* sx, sy in stage fractions; sy < 0 puts the source off-frame above the stage. */
var SOURCE_TABLE = [
  { sx: 0.42, sy: -0.10 },
  { sx: 0.64, sy: -0.14 },
  { sx: 0.46, sy: -0.07 },
  { sx: 0.80, sy: -0.12 },
  { sx: 0.16, sy: -0.09 },
  { sx: 0.55, sy: -0.16 }
];
var sourceIndex = 0;
/* ---- root fan: seeded per source index, so every replant is deterministic ---- */
var NROOTS = 58;
var SEGMENTS = 42;
var roots = [];
function growFan(idx) {
  var rng = mulberry32(1714 + idx * 97);
  roots = [];
  var i;
  for (i = 0; i < NROOTS; i++) {
    var side = rng() < 0.5 ? -1 : 1;
    roots.push({
      /* fan spreads downward, biased to one side so it is never symmetrical */
      spread: (0.12 + Math.pow(rng(), 1.4) * 0.85) * side,
      len: 0.55 + Math.pow(rng(), 1.2) * 0.50,   /* fraction of stage height */
      curlAmp: 0.25 + rng() * 0.85,              /* radians of low-frequency curl */
      curlFreq: 0.6 + rng() * 1.1,
      curlPh: rng() * TAU,
      swayPh: rng() * TAU,
      swayAmp: 0.010 + rng() * 0.022,            /* fraction of stage width */
      w0: 0.0032 + rng() * 0.0034,               /* base width, fraction of stage height */
      a: 0.55 + rng() * 0.40,
      deep: rng() < 0.22
    });
  }
}
growFan(0);
var phaseT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var sw = st.w, sh = st.h;
  var src = SOURCE_TABLE[sourceIndex];
  var ox = st.x + src.sx * sw, oy = st.y + src.sy * sh;
  var t = phaseT;
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, sw, sh);
  ctx.clip();
  ctx.lineCap = 'round';
  var k, s, x, y, px, py, ang, stepLen, w;
  for (k = 0; k < roots.length; k++) {
    var r = roots[k];
    var totalLen = r.len * sh;
    stepLen = totalLen / SEGMENTS;
    /* sway grows along the root: a closed-form function of piece time */
    var sway = r.swayAmp * sw * Math.sin(TAU * t / 9 + r.swayPh);
    x = ox; y = oy;
    px = x; py = y;
    for (s = 1; s <= SEGMENTS; s++) {
      var f = s / SEGMENTS;
      /* direction curls with a seeded low-frequency phase, eased in along the root */
      ang = Math.PI / 2 + r.spread * f + r.curlAmp * Math.sin(r.curlFreq * TAU * f + r.curlPh) * f;
      x += Math.cos(ang) * stepLen;
      y += Math.sin(ang) * stepLen;
      /* lateral sway, strongest at the tip */
      x += sway * (f * f) / SEGMENTS * 2;
      w = Math.max(0.35, r.w0 * sh * (1 - f * 0.94));
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(x, y);
      ctx.lineWidth = w;
      ctx.strokeStyle = rgba(r.deep ? CORAL_DEEP : CORAL, r.a);
      ctx.stroke();
      px = x; py = y;
    }
  }
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Roots').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Roots').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 21').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Roots', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 21', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap to replant the fan.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function replant() {
  sourceIndex = (sourceIndex + 1) % SOURCE_TABLE.length;
  growFan(sourceIndex);
  draw();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    rootCount: function () { return NROOTS; },
    source: function () { return SOURCE_TABLE[sourceIndex]; },
    replant: function () { replant(); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 3.0s, source index 0 (sx 0.42, sy -0.10) ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (canvas.addEventListener) {
  /* pointerdown only: a tap also fires click, which would replant twice */
  canvas.addEventListener('pointerdown', replant);
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
