<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galleria Dolly</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Galleria Dolly: a slow, endless forward dolly down a black and white
   galleria. Repeating arch bays flow past toward a bright vanishing
   point that never arrives. Arches regenerate procedurally with slight
   variation: keystones, shopfronts, pigeons. High contrast light shafts
   rake across the stone. The bright exit breathes slightly, but the
   camera never reaches it. Watch only. */
var TAU = Math.PI * 2;
var GROUND = '#0A0A0A';
var GROUND_HI = '#101010';
var STONE = '#BFBFBF';
var STONE_DIM = '#8A8A8A';
var STONE_DARK = '#4A4A4A';
var PIER_FACE = '#2E2E2E';
var PIER_EDGE = '#6E6E6E';
var FLOOR_A = '#1A1A1A';
var FLOOR_B = '#232323';
var SKY = '#F5F5F5';
var PAPER = '#E5E5E5';
var INK = '#111111';
var PLATE = '#0E0E0E';
var PLATE_LINE = 'rgba(229,229,229,0.25)';
var TITLE_INK = '#F5F5F5';
var HINT_INK = '#BFBFBF';
var FRAME_T = 9.0;        /* fixed phase: dolly mid bay, full arch, shafts visible */
var SPEED = 0.22;         /* bays per second, constant, never changes */
var SPACING = 1.0;        /* world depth of one arch bay */
var N_BAYS = 7;
var WALK_HALF = 0.62;     /* half width of the walkway opening, world units */
var SPRING = 0.10;        /* springline height below vanishing point, world units */
var FLOOR_Y = 1.00;       /* floor level below vanishing point, world units */
var VAULT_Y = -0.95;      /* vault crown above vanishing point, world units */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* Seeded per bay variation: keystone size, shopfront side and pane,
   pigeon count and perch, skylight brightness. Absolute bay index keeps
   a bay's character stable as it recycles past the camera. */
function bayVar(absIndex) {
  var rng = mulberry32(1876 + absIndex * 7919);
  return {
    key: 0.7 + rng() * 0.6,
    shopSide: rng() < 0.5 ? -1 : 1,
    shopLit: 0.25 + rng() * 0.55,
    pigeons: Math.floor(rng() * 3),
    pigeonX: 0.15 + rng() * 0.55,
    pigeonSide: rng() < 0.5 ? -1 : 1,
    sky: 0.55 + rng() * 0.45,
    pierTone: 0.75 + rng() * 0.25
  };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* Project a world point (x right, y down from the vanishing point) at
   depth z into screen space. FOCAL is set per frame from the field size. */
var FOCAL = 100;
function proj(x, y, z, cx, vy) {
  var s = FOCAL / z;
  return { x: cx + x * s, y: vy + y * s, s: s };
}
function drawPigeon(x, y, r, flip) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip, 1);
  ctx.fillStyle = '#0A0A0A';
  ctx.beginPath();
  ctx.moveTo(-r * 1.4, 0);
  ctx.ellipse(0, -r * 0.4, r * 1.3, r * 0.75, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(r * 0.9, -r * 0.9);
  ctx.arc(r * 1.1, -r * 1.0, r * 0.45, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-r * 1.2, -r * 0.2);
  ctx.lineTo(-r * 2.2, r * 0.5);
  ctx.lineTo(-r * 1.0, r * 0.3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawBay(absIndex, z, t, cx, vy, U) {
  var v = bayVar(absIndex);
  var fade = clamp(1.55 - z * 0.20, 0.12, 1);
  var pL = proj(-WALK_HALF, SPRING, z, cx, vy);
  var pR = proj(WALK_HALF, SPRING, z, cx, vy);
  var fL = proj(-WALK_HALF, FLOOR_Y, z, cx, vy);
  var fR = proj(WALK_HALF, FLOOR_Y, z, cx, vy);
  var apex = proj(0, SPRING - WALK_HALF, z, cx, vy);
  var vault = proj(0, VAULT_Y, z, cx, vy);
  var pierW = pL.s * 0.34;
  var pierTone = lerp(0.35, 1, v.pierTone);
  ctx.save();
  ctx.globalAlpha = fade;
  /* piers: stone faces from floor to springline, both sides */
  ctx.fillStyle = rgba(PIER_FACE, 1);
  ctx.fillRect(pL.x - pierW, pL.y, pierW, fL.y - pL.y);
  ctx.fillRect(pR.x, pR.y, pierW, fR.y - pR.y);
  ctx.strokeStyle = rgba(PIER_EDGE, 0.9 * pierTone);
  ctx.lineWidth = Math.max(1, pL.s * 0.012);
  ctx.strokeRect(pL.x - pierW + 0.5, pL.y + 0.5, pierW - 1, fL.y - pL.y - 1);
  ctx.strokeRect(pR.x + 0.5, pR.y + 0.5, pierW - 1, fR.y - pR.y - 1);
  /* pier capitals: a pale band at the springline */
  ctx.fillStyle = rgba(STONE, 0.85 * pierTone);
  ctx.fillRect(pL.x - pierW - pL.s * 0.02, pL.y - pL.s * 0.03, pierW + pL.s * 0.02, pL.s * 0.03);
  ctx.fillRect(pR.x, pR.y - pR.s * 0.03, pierW + pR.s * 0.02, pR.s * 0.03);
  /* shopfront: inset dark opening with mullions and one lit pane, on one pier */
  var shopX = v.shopSide < 0 ? pL.x - pierW * 0.86 : pR.x + pierW * 0.14;
  var shopW = pierW * 0.72;
  var shopTop = pL.y + (fL.y - pL.y) * 0.18;
  var shopH = (fL.y - pL.y) * 0.62;
  ctx.fillStyle = '#050505';
  ctx.fillRect(shopX, shopTop, shopW, shopH);
  ctx.strokeStyle = rgba(STONE_DIM, 0.8);
  ctx.lineWidth = Math.max(0.75, pL.s * 0.008);
  var m, mx;
  for (m = 1; m < 4; m++) {
    mx = shopX + shopW * m / 4;
    ctx.beginPath(); ctx.moveTo(mx, shopTop); ctx.lineTo(mx, shopTop + shopH); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(shopX, shopTop + shopH * 0.55); ctx.lineTo(shopX + shopW, shopTop + shopH * 0.55); ctx.stroke();
  ctx.fillStyle = rgba(SKY, v.shopLit * 0.5);
  ctx.fillRect(shopX + shopW * 0.05, shopTop + shopH * 0.05, shopW * 0.20, shopH * 0.42);
  /* the arch itself: a pale stone ring over the opening */
  ctx.strokeStyle = rgba(STONE, 0.95);
  ctx.lineWidth = Math.max(1.5, pL.s * 0.055);
  ctx.beginPath();
  ctx.moveTo(pL.x, fL.y);
  ctx.lineTo(pL.x, pL.y);
  ctx.arc(cx, pL.y, WALK_HALF * pL.s, Math.PI, 0, false);
  ctx.lineTo(pR.x, fR.y);
  ctx.stroke();
  /* keystone: a small wedge at the arch apex */
  var kw = pL.s * 0.09 * v.key;
  var kh = pL.s * 0.16 * v.key;
  ctx.fillStyle = rgba(PAPER, 0.95);
  ctx.beginPath();
  ctx.moveTo(apex.x - kw, apex.y - kh * 0.4);
  ctx.lineTo(apex.x + kw, apex.y - kh * 0.4);
  ctx.lineTo(apex.x + kw * 0.6, apex.y + kh * 0.6);
  ctx.lineTo(apex.x - kw * 0.6, apex.y + kh * 0.6);
  ctx.closePath();
  ctx.fill();
  /* skylight: a bright slot in the vault above the arch */
  var skyW = WALK_HALF * pL.s * 0.55;
  var skyTop = vault.y + (apex.y - vault.y) * 0.15;
  var skyH = Math.max(2, (apex.y - vault.y) * 0.5);
  ctx.fillStyle = rgba(SKY, 0.75 * v.sky);
  ctx.fillRect(cx - skyW / 2, skyTop, skyW, skyH);
  ctx.strokeStyle = rgba(STONE_DARK, 0.7);
  ctx.lineWidth = Math.max(0.75, pL.s * 0.008);
  ctx.beginPath();
  ctx.moveTo(cx, skyTop); ctx.lineTo(cx, skyTop + skyH);
  ctx.moveTo(cx - skyW / 2, skyTop + skyH / 2); ctx.lineTo(cx + skyW / 2, skyTop + skyH / 2);
  ctx.stroke();
  /* vault ribs: thin lines from the arch apex toward the vault crown */
  ctx.strokeStyle = rgba(STONE_DIM, 0.45);
  ctx.lineWidth = Math.max(0.75, pL.s * 0.01);
  ctx.beginPath();
  ctx.moveTo(apex.x - WALK_HALF * pL.s * 0.55, apex.y - pL.s * 0.06);
  ctx.lineTo(vault.x - WALK_HALF * pL.s * 0.28, vault.y);
  ctx.moveTo(apex.x + WALK_HALF * pL.s * 0.55, apex.y - pL.s * 0.06);
  ctx.lineTo(vault.x + WALK_HALF * pL.s * 0.28, vault.y);
  ctx.stroke();
  /* pigeons on the floor at the pier base */
  var pg, px, py, pr;
  for (pg = 0; pg < v.pigeons; pg++) {
    px = cx + v.pigeonSide * (WALK_HALF * 0.55 + pg * 0.16) * pL.s * v.pigeonX;
    py = fL.y - pL.s * 0.02;
    pr = Math.max(1.2, pL.s * 0.028);
    drawPigeon(px, py, pr, pg % 2 === 0 ? 1 : -1);
  }
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Galleria Dolly').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Galleria Dolly').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 02').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Galleria Dolly', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 03 · 02', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. The walk never arrives.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  var cx = sc.x + sc.w / 2;
  var vy = sc.y + sc.h * 0.44; /* vanishing point dead center, slightly above middle */
  var U = Math.min(sc.w, sc.h);
  FOCAL = 0.42 * U;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* the scene is clipped to the field: on desktop the square holds the
     galleria and the ground stays clean outside it */
  ctx.save();
  ctx.beginPath();
  ctx.rect(sc.x, sc.y, sc.w, sc.h);
  ctx.clip();
  /* the tube: dark walls and ceiling inside the field, floor below */
  if (!isPhone) {
    ctx.fillStyle = GROUND_HI;
    ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
    ctx.strokeStyle = rgba(PAPER, 0.08);
    ctx.lineWidth = 1;
    ctx.strokeRect(sc.x + 0.5, sc.y + 0.5, sc.w - 1, sc.h - 1);
  }
  var total = t * SPEED;
  var frac = total - Math.floor(total);
  var base = Math.floor(total);
  var i, z, absIndex;
  /* floor: a trapezoid from the bottom edge to the vanishing point,
     with tile joints converging on the point and cross joints per bay */
  var nearZ = (1 - frac) * SPACING;
  var farZ = (N_BAYS - frac) * SPACING;
  var nFloor = proj(-WALK_HALF * 2.2, FLOOR_Y, nearZ, cx, vy);
  var nFloorR = proj(WALK_HALF * 2.2, FLOOR_Y, nearZ, cx, vy);
  var fFloor = proj(-WALK_HALF * 2.2, FLOOR_Y, farZ, cx, vy);
  var fFloorR = proj(WALK_HALF * 2.2, FLOOR_Y, farZ, cx, vy);
  ctx.fillStyle = FLOOR_A;
  ctx.beginPath();
  ctx.moveTo(nFloor.x, nFloor.y);
  ctx.lineTo(nFloorR.x, nFloorR.y);
  ctx.lineTo(fFloorR.x, fFloorR.y);
  ctx.lineTo(fFloor.x, fFloor.y);
  ctx.closePath();
  ctx.fill();
  /* converging floor joints */
  var j, jx;
  ctx.strokeStyle = rgba(PAPER, 0.10);
  ctx.lineWidth = 1;
  for (j = -4; j <= 4; j++) {
    if (j === 0) continue;
    jx = cx + j * 0.34 * FOCAL / nearZ;
    ctx.beginPath();
    ctx.moveTo(jx, nFloor.y);
    ctx.lineTo(cx + j * 0.34 * FOCAL / farZ * 0.4, vy + (FLOOR_Y * FOCAL / farZ));
    ctx.stroke();
  }
  /* cross joints, one per passing bay */
  for (i = 0; i < N_BAYS; i++) {
    z = (i + 1 - frac) * SPACING;
    var cL = proj(-WALK_HALF * 2.2, FLOOR_Y, z, cx, vy);
    var cR = proj(WALK_HALF * 2.2, FLOOR_Y, z, cx, vy);
    ctx.strokeStyle = rgba(PAPER, 0.13);
    ctx.beginPath();
    ctx.moveTo(cL.x, cL.y);
    ctx.lineTo(cR.x, cR.y);
    ctx.stroke();
  }
  /* the bright exit at the vanishing point: it breathes, never arrives */
  var breathe = 1 + 0.06 * Math.sin(t * 0.4);
  var exitR = U * 0.055 * breathe;
  var eg = ctx.createRadialGradient(cx, vy, 0, cx, vy, exitR * 3.2);
  eg.addColorStop(0, rgba(SKY, 0.95));
  eg.addColorStop(0.35, rgba(SKY, 0.45));
  eg.addColorStop(1, rgba(SKY, 0));
  ctx.fillStyle = eg;
  ctx.beginPath();
  ctx.moveTo(cx + exitR * 3.2, vy);
  ctx.arc(cx, vy, exitR * 3.2, 0, TAU);
  ctx.fill();
  ctx.fillStyle = SKY;
  ctx.beginPath();
  ctx.moveTo(cx - exitR * 0.55, vy + exitR * 0.9);
  ctx.lineTo(cx - exitR * 0.55, vy - exitR * 0.1);
  ctx.arc(cx, vy - exitR * 0.1, exitR * 0.55, Math.PI, 0, false);
  ctx.lineTo(cx + exitR * 0.55, vy + exitR * 0.9);
  ctx.closePath();
  ctx.fill();
  /* arch bays, far to near so near piers occlude far ones */
  for (i = N_BAYS - 1; i >= 0; i--) {
    z = (i + 1 - frac) * SPACING;
    absIndex = base + i + 1;
    drawBay(absIndex, z, t, cx, vy, U);
  }
  /* light shafts: additive bands on a slow independent clock, drifting
     across the stone while the dolly holds its constant speed */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var k, shaftA, shaftTop, shaftBot, shaftW;
  for (k = 0; k < 3; k++) {
    shaftA = 0.05 + 0.035 * (0.5 + 0.5 * Math.sin(t * 0.07 + k * 2.1));
    shaftTop = cx + (0.10 + k * 0.16) * U * (1 + 0.12 * Math.sin(t * 0.05 + k * 1.3));
    shaftW = U * (0.05 + k * 0.02);
    shaftBot = shaftTop + U * 0.22 * (1 + 0.1 * Math.sin(t * 0.06 + k));
    var sg = ctx.createLinearGradient(shaftTop, vy - U * 0.35, shaftBot, vy + U * 0.42);
    sg.addColorStop(0, rgba(SKY, shaftA));
    sg.addColorStop(1, rgba(SKY, 0));
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(shaftTop - shaftW / 2, vy - U * 0.35);
    ctx.lineTo(shaftTop + shaftW / 2, vy - U * 0.35);
    ctx.lineTo(shaftBot + shaftW * 0.7, vy + U * 0.42);
    ctx.lineTo(shaftBot - shaftW * 0.7, vy + U * 0.42);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  /* crawling pier shadows on the floor, drifting with the shafts */
  ctx.save();
  var shOff = U * 0.03 * Math.sin(t * 0.05 + 0.8);
  ctx.fillStyle = rgba('#000000', 0.28);
  ctx.beginPath();
  ctx.moveTo(cx - U * 0.30 + shOff, vy + U * 0.42);
  ctx.lineTo(cx - U * 0.06 + shOff, vy + U * 0.10);
  ctx.lineTo(cx - U * 0.02 + shOff, vy + U * 0.10);
  ctx.lineTo(cx - U * 0.18 + shOff, vy + U * 0.42);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.restore();
  drawPlates();
}
/* ---- frame one: fixed phase t = 9.0 s, dolly mid bay, shafts visible ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
