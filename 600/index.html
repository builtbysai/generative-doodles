<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosas de Todos los Días</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#FAF7F0; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var INK='#1A1A1A', PAPER='#FAF7F0', BLUE='#3E6FA8';
var SW=1000, SH=700;
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var vw=SW, vh=SH, dpr=1;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rng=mulberry32(600072);

/* ---------- wobbly line helpers (precomputed jitter, never in draw) ---------- */
function jit(amt){ return (rng()*2-1)*amt; }
function wobLine(x1,y1,x2,y2,amt){
  var mx=(x1+x2)/2+jit(amt), my=(y1+y2)/2+jit(amt);
  return [x1,y1,mx,my,x2,y2];
}
function drawWob(w,lw){
  ctx.lineWidth=lw||2.2; ctx.beginPath();
  ctx.moveTo(w[0],w[1]); ctx.quadraticCurveTo(w[2],w[3],w[4],w[5]); ctx.stroke();
}
function wobRect(x,y,w,h,amt){
  return [ wobLine(x,y,x+w,y,amt), wobLine(x+w,y,x+w,y+h,amt),
           wobLine(x+w,y+h,x,y+h,amt), wobLine(x,y+h,x,y,amt) ];
}
function drawWobRect(r,lw){ for(var i=0;i<4;i++) drawWob(r[i],lw); }
function wobEllipse(cx,cy,rx,ry,amt,n){
  var pts=[], i, a;
  n=n||14;
  for(i=0;i<n;i++){ a=i/n*Math.PI*2; pts.push([cx+Math.cos(a)*rx+jit(amt), cy+Math.sin(a)*ry+jit(amt)]); }
  return pts;
}
function drawPts(pts,close,lw){
  ctx.lineWidth=lw||2.2; ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  if(close) ctx.closePath();
  ctx.stroke();
}

/* ---------- paper grain ---------- */
var grain=[];
for(var g=0;g<260;g++) grain.push([rng()*SW, rng()*SH, 0.5+rng()*1.1]);

/* ---------- the table ---------- */
var TABLE={ cx:500, cy:392, rx:330, ry:96 };
var tableTop=wobEllipse(TABLE.cx,TABLE.cy,TABLE.rx,TABLE.ry,1.6,26);
var tableEdge=wobEllipse(TABLE.cx,TABLE.cy+13,TABLE.rx-4,TABLE.ry-6,1.6,26);
var legL=wobLine(TABLE.cx-262,TABLE.cy+52,TABLE.cx-246,TABLE.cy+150,1.4);
var legR=wobLine(TABLE.cx+262,TABLE.cy+52,TABLE.cx+246,TABLE.cy+150,1.4);

/* ---------- the six objects ---------- */
/* each draw fn works in local coords centred on (0,0); blue spent exactly once */
function drawGlasses(){
  var r1=wobRect(-46,-26,40,54,1.1), r2=wobRect(6,-26,40,54,1.1);
  ctx.strokeStyle=INK; drawWobRect(r1); drawWobRect(r2);
  ctx.strokeStyle=BLUE; ctx.lineWidth=3.4; ctx.beginPath(); /* blue: rim of the left glass */
  ctx.moveTo(r1[0][0],r1[0][1]); ctx.quadraticCurveTo(r1[0][2],r1[0][3],r1[0][4],r1[0][5]); ctx.stroke();
  ctx.strokeStyle=INK;
}
function drawFeathers(){
  var i, fx=[-26,-9,9,26], tilt=[-0.32,-0.1,0.12,0.34];
  for(i=0;i<4;i++){
    ctx.save(); ctx.translate(fx[i]*0.6,26); ctx.rotate(tilt[i]);
    var pts=wobEllipse(0,-24,9,27,0.9,10);
    ctx.strokeStyle=INK; drawPts(pts,true,2);
    drawWob(wobLine(0,2,0,-46,0.8),1.4);
    if(i===2){ ctx.strokeStyle=BLUE; ctx.beginPath(); /* blue: one feather's tip */
      ctx.moveTo(-5,-44); ctx.quadraticCurveTo(0,-52,5,-44); ctx.stroke(); ctx.strokeStyle=INK; }
    ctx.restore();
  }
  drawWob(wobLine(-15,28,15,22,0.8),2); /* the tie */
}
function drawJar(){
  var body=wobRect(-27,-8,54,42,1.1);
  ctx.strokeStyle=INK; drawWobRect(body);
  drawWob(wobLine(-20,-8,20,-8,0.7),2);           /* soil line */
  ctx.fillStyle=INK;
  var seeds=[[-13,12],[-2,18],[9,11],[15,20],[-7,26]];
  for(var i=0;i<seeds.length;i++){ ctx.beginPath(); ctx.arc(seeds[i][0],seeds[i][1],2.1,0,7); ctx.fill(); }
  drawWob(wobLine(0,-8,1,-26,0.8),2);              /* sprout stem */
  var l1=wobEllipse(-8,-29,8,4.2,0.6,9), l2=wobEllipse(9,-31,8,4.2,0.6,9);
  drawPts(l1,true,1.8); drawPts(l2,true,1.8);
  ctx.strokeStyle=BLUE; ctx.lineWidth=5; ctx.beginPath(); /* blue: the label band */
  ctx.moveTo(-27,-1); ctx.lineTo(27,-1); ctx.stroke(); ctx.strokeStyle=INK;
}
function drawCrayon(){
  ctx.save(); ctx.rotate(-0.5);
  var body=wobRect(-38,-9,64,18,0.9);
  ctx.strokeStyle=INK; drawWobRect(body);
  var tip=[ [26,-9],[44,0],[26,9] ];
  drawPts(tip,true,2);
  ctx.strokeStyle=BLUE; ctx.lineWidth=6; ctx.beginPath(); /* blue: the wrapper band */
  ctx.moveTo(-6,-9); ctx.lineTo(-6,9); ctx.stroke(); ctx.strokeStyle=INK;
  ctx.restore();
}
function drawLeaf(){
  var pts=wobEllipse(0,0,20,34,1,12);
  ctx.strokeStyle=INK; drawPts(pts,true,2.1);
  drawWob(wobLine(-11,-14,0,4,0.7),1.3); drawWob(wobLine(11,-14,0,4,0.7),1.3);
  drawWob(wobLine(-12,12,0,4,0.7),1.3);  drawWob(wobLine(12,12,0,4,0.7),1.3);
  ctx.strokeStyle=BLUE; drawWob(wobLine(0,32,0,-30,0.8),2.4); /* blue: the central vein */
  ctx.strokeStyle=INK;
  drawWob(wobLine(0,32,2,40,0.6),2); /* stem */
}
function drawStone(){
  var pts=wobEllipse(0,4,30,17,1.6,12);
  ctx.strokeStyle=INK; drawPts(pts,true,2.2);
  ctx.fillStyle=BLUE; ctx.beginPath(); ctx.arc(-9,0,3.4,0,7); ctx.fill(); /* blue: one small spot */
}

var OBJECTS=[
  { draw:drawGlasses, caption:'los vasos de Noah',        r:56 },
  { draw:drawFeathers,caption:'las plumas de Emi',        r:52 },
  { draw:drawJar,     caption:'las semillas en el frasco',r:50 },
  { draw:drawCrayon,  caption:'el crayón buscado',        r:52 },
  { draw:drawLeaf,    caption:'la hoja',                  r:48 },
  { draw:drawStone,   caption:'la piedra',                r:46 }
];

/* ---------- constellations: seeded layouts on the table ---------- */
function makeLayout(){
  var pos=[], tries, x, y, ok, i, j, dx, dy;
  for(i=0;i<6;i++){
    ok=false; tries=0;
    while(!ok && tries<300){
      tries++;
      x=TABLE.cx+(rng()*2-1)*232;
      y=TABLE.cy+(rng()*2-1)*38;
      ok=true;
      for(j=0;j<pos.length;j++){ dx=pos[j][0]-x; dy=(pos[j][1]-y)*1.7; if(dx*dx+dy*dy<118*118) ok=false; }
    }
    pos.push([x,y]);
  }
  return pos;
}
var LAYOUTS=[]; for(var L=0;L<6;L++) LAYOUTS.push(makeLayout());
var CYCLE=20, HOLD=13; /* settle 13s, drift 7s: a new constellation every ~20s */
function smooth(t){ return t*t*(3-2*t); }
function targetAt(i,t){
  var k=Math.floor(t/CYCLE)%LAYOUTS.length;
  var k2=(k+1)%LAYOUTS.length;
  var ph=t%CYCLE;
  var f=ph<HOLD?0:smooth((ph-HOLD)/(CYCLE-HOLD));
  var a=LAYOUTS[k][i], b=LAYOUTS[k2][i];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];
}

/* ---------- state ---------- */
var nudge=OBJECTS.map(function(){return [0,0];});
var dragIdx=-1, dragPos=null, downAt=0, downXY=null, moved=false;
var capIdx=-1, capStart=-10;
var PHASE0=0;

function stageXY(e){
  var r=canvas.getBoundingClientRect();
  var px=(e.clientX-r.left), py=(e.clientY-r.top);
  var s=Math.min(vw/SW, vh/SH);
  return [ (px-(vw-SW*s)/2)/s, (py-(vh-SH*s)/2)/s ];
}
function currentPos(i,t){
  if(i===dragIdx && dragPos) return dragPos;
  var tg=targetAt(i,t);
  return [tg[0]+nudge[i][0], tg[1]+nudge[i][1]];
}
function hitIdx(p,t){
  var best=-1, bd=1e9;
  for(var i=0;i<6;i++){
    var c=currentPos(i,t), dx=c[0]-p[0], dy=c[1]-p[1], d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best=i; }
  }
  return bd<OBJECTS[best].r*OBJECTS[best].r*1.35 ? best : -1;
}
var nowT=0;
canvas.addEventListener('pointerdown',function(e){
  var p=stageXY(e); downXY=p; downAt=performance.now(); moved=false;
  var i=hitIdx(p,nowT);
  if(i>=0){ dragIdx=i; dragPos=currentPos(i,nowT); canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener('pointermove',function(e){
  if(dragIdx<0 || !downXY) return;
  var p=stageXY(e);
  if(Math.abs(p[0]-downXY[0])+Math.abs(p[1]-downXY[1])>7) moved=true;
  dragPos=[ Math.max(60,Math.min(SW-60,p[0])), Math.max(120,Math.min(SH-90,p[1])) ];
});
function endPointer(e){
  if(dragIdx>=0){
    var tg=targetAt(dragIdx,nowT);
    if(moved){ nudge[dragIdx]=[dragPos[0]-tg[0], dragPos[1]-tg[1]]; }
    else if(performance.now()-downAt<400){ capIdx=dragIdx; capStart=nowT; }
  }
  dragIdx=-1; dragPos=null; downXY=null;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);

/* ---------- sizing: Visual Viewport API ---------- */
function isPhone(){
  var sw=window.screen?Math.min(window.screen.width,window.screen.height):9999;
  return sw<700 || vh>vw*1.15;
}
function resize(){
  var w=window.innerWidth, h=window.innerHeight;
  if(window.visualViewport){ w=window.visualViewport.width; h=window.visualViewport.height; }
  vw=w; vh=h; dpr=Math.min(window.devicePixelRatio||1,2.5);
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
}
if(window.visualViewport){ window.visualViewport.addEventListener('resize',resize); }
window.addEventListener('resize',resize);
resize();

/* ---------- draw ---------- */
function draw(t){
  canvas.style.width=vw+'px'; canvas.style.height=vh+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,vw,vh);
  var s=Math.min(vw/SW, vh/SH);
  ctx.translate((vw-SW*s)/2,(vh-SH*s)/2); ctx.scale(s,s);
  void(isPhone);

  /* grain */
  ctx.fillStyle=INK; ctx.globalAlpha=0.05;
  for(var gi=0;gi<grain.length;gi++) ctx.fillRect(grain[gi][0],grain[gi][1],grain[gi][2],grain[gi][2]);
  ctx.globalAlpha=1;

  /* table */
  ctx.strokeStyle=INK;
  drawWob(legL,2.4); drawWob(legR,2.4);
  drawPts(tableEdge,false,2);
  drawPts(tableTop,true,2.4);

  /* objects */
  var order=[0,1,2,3,4,5].sort(function(a,b){ return currentPos(a,t)[1]-currentPos(b,t)[1]; });
  for(var oi=0;oi<6;oi++){
    var i=order[oi], p=currentPos(i,t);
    ctx.save(); ctx.translate(p[0],p[1]);
    ctx.globalAlpha= i===dragIdx?0.92:1;
    OBJECTS[i].draw();
    ctx.restore();
  }
  ctx.globalAlpha=1;

  /* caption */
  if(capIdx>=0){
    var age=t-capStart;
    if(age<3.2){
      var a= age<0.35? age/0.35 : (age>2.4? Math.max(0,(3.2-age)/0.8):1);
      var cp=currentPos(capIdx,t);
      ctx.save(); ctx.translate(cp[0],cp[1]+66); ctx.rotate(-0.02);
      ctx.globalAlpha=a*0.9; ctx.fillStyle=INK;
      ctx.font='21px "Segoe Print","Bradley Hand","Comic Sans MS",cursive';
      ctx.textAlign='center'; ctx.fillText(OBJECTS[capIdx].caption,0,0);
      ctx.restore();
    } else capIdx=-1;
  }

  /* hint */
  ctx.globalAlpha=0.42; ctx.fillStyle=INK;
  ctx.font='15px "Segoe Print","Bradley Hand","Comic Sans MS",cursive';
  ctx.textAlign='right'; ctx.fillText('tap · drag',SW-26,SH-20);
  ctx.globalAlpha=1;
}

var t0=null;
function frame(ts){
  if(t0===null) t0=ts;
  nowT=PHASE0+(ts-t0)/1000;
  draw(nowT);
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}
draw(PHASE0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
