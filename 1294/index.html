<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabari Embroidery</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1E3A5F; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  /* Seeded PRNG only. No Math.random anywhere, so every load draws the same cloth. */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Palette: indigo field, ghost pale, dyed-wool thread colors, mirror centers. */
  var INDIGO = '#1E3A5F', SHADOW = '#0E1C30', GHOST = '#A9BACD';
  var THREADS = ['#D97A2B', '#C24E6E', '#7FA653'];
  var MIRROR = '#E8EEF4';

  var W = 0, H = 0, S = 1; /* css pixels, and min(W,H) scale */
  var phone = false;

  function viewport() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    if (vv) return { w: vv.width, h: vv.height };
    return { w: window.innerWidth, h: window.innerHeight };
  }
  function isPhone() {
    if (typeof window !== 'undefined' && window.screen) {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m > 0) return m < 700;
    }
    return H > W * 1.15;
  }

  /* Seeded layout, in normalized (0..1) coordinates so resize keeps it identical. */
  var ghosts = [];   /* pale ghost-print blobs + faint motifs the embroidery avoids */
  var bands = [];    /* diagonal zigzag chain-stitch bands */
  var rosettes = []; /* seeded mirror rosettes: {x,y,r,color} in normalized coords */
  var patches = [];  /* buttonhole-edged patches */
  var mirrors = [];  /* every mirror center, for pointer-pass glints */

  function buildLayout() {
    var rnd = mulberry32(1294);
    ghosts = [];
    bands = [];
    rosettes = [];
    patches = [];
    mirrors = [];

    /* Three palest ghost areas: broad soft washes the embroidery must not cover. */
    var blobDefs = [
      { x: 0.22, y: 0.28, rx: 0.15, ry: 0.18 },
      { x: 0.68, y: 0.64, rx: 0.17, ry: 0.20 },
      { x: 0.84, y: 0.20, rx: 0.11, ry: 0.14 }
    ];
    var i, j;
    for (i = 0; i < blobDefs.length; i++) ghosts.push(blobDefs[i]);

    /* Faint ghost block motifs scattered over the field. */
    for (i = 0; i < 26; i++) {
      ghosts.push({
        mx: 0.04 + rnd() * 0.92, my: 0.06 + rnd() * 0.88,
        kind: (rnd() * 3) | 0, rot: rnd() * 3.14159, a: 0.10 + rnd() * 0.10
      });
    }

    /* Three diagonal bands crossing the field on gentle slopes. */
    var bandDefs = [
      { x0: -0.05, y0: 0.18, x1: 1.05, y1: 0.42, amp: 0.030 },
      { x0: -0.05, y0: 0.58, x1: 1.05, y1: 0.78, amp: 0.024 },
      { x0: 0.10, y0: 1.02, x1: 0.95, y1: 0.05, amp: 0.035 }
    ];
    for (i = 0; i < bandDefs.length; i++) {
      var b = bandDefs[i], pts = [];
      var n = 26;
      for (j = 0; j <= n; j++) {
        var t = j / n;
        pts.push({
          x: b.x0 + (b.x1 - b.x0) * t,
          y: b.y0 + (b.y1 - b.y0) * t + Math.sin(t * 5.2 + i * 1.7) * b.amp
        });
      }
      /* Detour: embroidery deliberately avoids the palest ghost areas. */
      var pass, p, bl, ddx, ddy, dd;
      for (pass = 0; pass < 2; pass++) {
        for (j = 0; j < pts.length; j++) {
          p = pts[j];
          for (var bi = 0; bi < blobDefs.length; bi++) {
            bl = blobDefs[bi];
            ddx = (p.x - bl.x) / (bl.rx * 1.15);
            ddy = (p.y - bl.y) / (bl.ry * 1.15);
            dd = ddx * ddx + ddy * ddy;
            if (dd < 1 && dd > 0.0001) {
              var s = 1 / Math.sqrt(dd);
              p.x = bl.x + ddx * s * bl.rx * 1.15;
              p.y = bl.y + ddy * s * bl.ry * 1.15;
            }
          }
        }
      }
      bands.push({ pts: pts, color: THREADS[i % 3] });
    }

    function insidePale(x, y) {
      for (var k = 0; k < blobDefs.length; k++) {
        var dx = (x - blobDefs[k].x) / blobDefs[k].rx;
        var dy = (y - blobDefs[k].y) / blobDefs[k].ry;
        if (dx * dx + dy * dy < 1.35) return true;
      }
      return false;
    }

    /* Seeded rosettes along the bands, nudged off the palest ghost areas. */
    var want = [0.16, 0.38, 0.55, 0.74, 0.88];
    for (i = 0; i < want.length; i++) {
      var band = bands[i % bands.length];
      var idx = Math.round(want[i] * (band.pts.length - 1));
      var p = band.pts[idx];
      var px = p.x, py = p.y, tries = 0;
      while (insidePale(px, py) && tries < 8) { px += 0.03; py -= 0.02; tries++; }
      /* Keep the whole rosette, spokes included, inside the frame. */
      px = Math.max(0.09, Math.min(0.91, px));
      py = Math.max(0.12, Math.min(0.88, py));
      var ros = { x: px, y: py, r: 0.030 + rnd() * 0.012, color: THREADS[(i + 1) % 3], seeded: true };
      rosettes.push(ros);
      mirrors.push({ x: px, y: py, r: 0.016 });
    }

    /* Two buttonhole-edged patches, also kept off the palest ghosts. */
    var patchDefs = [
      { x: 0.36, y: 0.44, w: 0.13, h: 0.10, color: THREADS[1] },
      { x: 0.78, y: 0.86, w: 0.11, h: 0.09, color: THREADS[0] }
    ];
    for (i = 0; i < patchDefs.length; i++) patches.push(patchDefs[i]);
  }

  /* Visitor state: recorded events only, drawn as closed-form functions of them. */
  var visitorStitches = []; /* {x,y,a,color} normalized */
  var visitorRosettes = []; /* {x,y,r,color} normalized */
  var threadIdx = 0;        /* thread color cycles per completed rosette */
  var drag = null;          /* {ax,ay,px,py} normalized anchor + last pointer */
  var lastTap = null;       /* {t,x,y} for double-tap rosette placement */
  var glints = [];          /* {mirror, t} recorded glint events, piece time */

  function px(v, horiz) { return horiz ? v * W : v * H; }

  /* One dot: its own path, so node-canvas never joins dots into polygons. */
  function dot(x, y, rx, ry, rot, fill) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, rot, 0, 6.283185307179586);
    ctx.fillStyle = fill;
    ctx.fill();
  }
  function dash(x1, y1, x2, y2, color, wdt) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = wdt;
    ctx.stroke();
  }

  /* Chain stitches along a segment: small ellipses alternating either side. */
  function chain(x1, y1, x2, y2, color, step) {
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1) return;
    var ang = Math.atan2(dy, dx);
    var nx = -dy / len, ny = dx / len;
    var n = Math.max(1, Math.floor(len / step));
    var k;
    for (k = 0; k <= n; k++) {
      var t = k / n;
      var off = (k % 2 === 0 ? 1 : -1) * step * 0.22;
      dot(x1 + dx * t + nx * off, y1 + dy * t + ny * off,
          step * 0.42, step * 0.26, ang, color);
    }
  }

  function drawRosette(cx, cy, r, color) {
    /* Mirror center: small irregular pentagon, never a circle or square. */
    var i, ang0 = -0.6;
    ctx.beginPath();
    for (i = 0; i < 5; i++) {
      var a = ang0 + i * 1.2566;
      var rr = r * (0.82 + (i % 2) * 0.30);
      var vx = cx + Math.cos(a) * rr, vy = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
    }
    ctx.closePath();
    ctx.fillStyle = MIRROR;
    ctx.fill();
    ctx.strokeStyle = '#8FA0B5';
    ctx.lineWidth = Math.max(1, r * 0.08);
    ctx.stroke();
    /* 10 radiating chain stitches. */
    for (i = 0; i < 10; i++) {
      var sa = i * 0.6283 + 0.31;
      var x1 = cx + Math.cos(sa) * r * 1.15, y1 = cy + Math.sin(sa) * r * 1.15;
      var x2 = cx + Math.cos(sa) * r * 2.6, y2 = cy + Math.sin(sa) * r * 2.6;
      chain(x1, y1, x2, y2, color, Math.max(2.5, r * 0.45));
    }
  }

  function drawGhostMotif(g) {
    var x = px(g.mx, true), y = px(g.my, false);
    var r = 0.022 * S;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(g.rot);
    ctx.globalAlpha = g.a;
    ctx.strokeStyle = GHOST;
    ctx.lineWidth = Math.max(1, 0.0022 * S);
    if (g.kind === 0) {
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0);
      ctx.closePath(); ctx.stroke();
    } else if (g.kind === 1) {
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r * 0.7, -r * 0.7); ctx.lineTo(r, 0);
      ctx.lineTo(r * 0.7, r * 0.7); ctx.lineTo(0, r); ctx.lineTo(-r * 0.7, r * 0.7);
      ctx.lineTo(-r, 0); ctx.lineTo(-r * 0.7, -r * 0.7);
      ctx.closePath(); ctx.stroke();
    } else {
      ctx.strokeRect(-r * 0.7, -r * 0.7, r * 1.4, r * 1.4);
      dot(0, 0, r * 0.18, r * 0.18, 0, GHOST);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    var i, j;
    ctx.fillStyle = INDIGO;
    ctx.fillRect(0, 0, W, H);

    /* Pale ghost washes: the cloth beneath, kept visible. */
    for (i = 0; i < 3; i++) {
      var g = ghosts[i];
      dot(px(g.x, true), px(g.y, false), px(g.rx, true), px(g.ry, false), 0, 'rgba(169,186,205,0.10)');
      dot(px(g.x, true), px(g.y, false), px(g.rx, true) * 0.6, px(g.ry, false) * 0.6, 0, 'rgba(169,186,205,0.08)');
    }
    for (i = 3; i < ghosts.length; i++) drawGhostMotif(ghosts[i]);

    /* Seeded zigzag bands: chain stitches along a zigzag of each band path. */
    for (i = 0; i < bands.length; i++) {
      var band = bands[i];
      var step = Math.max(3, 0.011 * S);
      for (j = 0; j < band.pts.length - 1; j++) {
        var p0 = band.pts[j], p1 = band.pts[j + 1];
        var mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
        var zig = (j % 2 === 0 ? 1 : -1) * 0.012;
        chain(px(p0.x, true), px(p0.y, false), px(mx, true), px(my + zig, false), band.color, step);
        chain(px(mx, true), px(my + zig, false), px(p1.x, true), px(p1.y, false), band.color, step);
      }
    }

    /* Buttonhole-edged patches: dashed border plus short perpendicular ticks. */
    for (i = 0; i < patches.length; i++) {
      var pt = patches[i];
      var x = px(pt.x, true), y = px(pt.y, false);
      var w = px(pt.w, true), h = px(pt.h, false);
      ctx.fillStyle = 'rgba(30,58,95,0.55)';
      ctx.fillRect(x, y, w, h);
      ctx.setLineDash([Math.max(3, 0.006 * S), Math.max(3, 0.006 * S)]);
      ctx.beginPath();
      ctx.strokeStyle = pt.color;
      ctx.lineWidth = Math.max(1, 0.0025 * S);
      ctx.strokeRect(x, y, w, h);
      ctx.setLineDash([]);
      var bx, by;
      for (bx = x + 4; bx < x + w - 2; bx += Math.max(6, 0.012 * S)) {
        dash(bx, y, bx, y + Math.max(3, 0.008 * S), pt.color, Math.max(1, 0.002 * S));
        dash(bx, y + h, bx, y + h - Math.max(3, 0.008 * S), pt.color, Math.max(1, 0.002 * S));
      }
      for (by = y + 4; by < y + h - 2; by += Math.max(6, 0.012 * S)) {
        dash(x, by, x + Math.max(3, 0.008 * S), by, pt.color, Math.max(1, 0.002 * S));
        dash(x + w, by, x + w - Math.max(3, 0.008 * S), by, pt.color, Math.max(1, 0.002 * S));
      }
    }

    /* Seeded rosettes, then visitor rosettes. */
    for (i = 0; i < rosettes.length; i++) {
      var r0 = rosettes[i];
      drawRosette(px(r0.x, true), px(r0.y, false), r0.r * S, r0.color);
    }
    for (i = 0; i < visitorRosettes.length; i++) {
      var vr = visitorRosettes[i];
      drawRosette(px(vr.x, true), px(vr.y, false), vr.r * S, vr.color);
    }

    /* Visitor chain stitches. */
    for (i = 0; i < visitorStitches.length; i++) {
      var vs = visitorStitches[i];
      dot(px(vs.x, true), px(vs.y, false), Math.max(2, 0.005 * S), Math.max(1.5, 0.0032 * S), vs.a, vs.color);
    }

    /* Needle line while dragging: a short thread from the last stitch to the pointer. */
    if (drag) {
      dash(px(drag.ax, true), px(drag.ay, false), px(drag.px, true), px(drag.py, false),
           THREADS[threadIdx], Math.max(1, 0.002 * S));
      dot(px(drag.px, true), px(drag.py, false), Math.max(2.5, 0.006 * S), Math.max(2.5, 0.006 * S), 0, THREADS[threadIdx]);
    }

    /* Mirror glints on pointer pass: brief flash + expanding ring, closed-form decay. */
    for (i = 0; i < glints.length; i++) {
      var gl = glints[i];
      var dt = t - gl.t;
      if (dt < 0 || dt > 0.6) continue;
      var al = 1 - dt / 0.6;
      var gx = px(gl.mirror.x, true), gy = px(gl.mirror.y, false);
      var gr = gl.mirror.r * S;
      ctx.beginPath();
      ctx.moveTo(gx + gr * (1 + dt * 3), gy);
      ctx.arc(gx, gy, gr * (1 + dt * 3), 0, 6.283185307179586);
      ctx.strokeStyle = 'rgba(232,238,244,' + (al * 0.8).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, 0.002 * S);
      ctx.stroke();
      dot(gx, gy, gr * 0.9, gr * 0.9, 0, 'rgba(255,255,255,' + (al * 0.9).toFixed(3) + ')');
    }
  }

  function size() {
    var v = viewport();
    W = v.w; H = v.h;
    S = Math.min(W, H);
    phone = isPhone();
    canvas.width = Math.max(1, Math.round(W));
    canvas.height = Math.max(1, Math.round(H));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (typeof document !== 'undefined' && document.body) document.body.style.background = INDIGO;
  }

  function build() { size(); buildLayout(); }

  function pos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) / W, y: (e.clientY - rect.top) / H };
  }

  function lastAnchor() {
    if (visitorRosettes.length) {
      var r = visitorRosettes[visitorRosettes.length - 1];
      return { x: r.x, y: r.y };
    }
    if (visitorStitches.length) {
      var s = visitorStitches[visitorStitches.length - 1];
      return { x: s.x, y: s.y };
    }
    var r0 = rosettes[rosettes.length - 1];
    return { x: r0.x, y: r0.y };
  }

  function placeRosette(p) {
    var color = THREADS[threadIdx];
    visitorRosettes.push({ x: p.x, y: p.y, r: 0.032, color: color });
    mirrors.push({ x: p.x, y: p.y, r: 0.016 });
    threadIdx = (threadIdx + 1) % THREADS.length;
  }

  function pieceNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return 0;
  }

  var downPos = null, downMoved = 0;
  canvas.addEventListener('pointerdown', function (e) {
    var p = pos(e);
    downPos = p; downMoved = 0;
    var a = lastAnchor();
    drag = { ax: a.x, ay: a.y, px: p.x, py: p.y };
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = pos(e);
    /* Mirror glint on pointer pass. */
    var i;
    for (i = 0; i < mirrors.length; i++) {
      var m = mirrors[i];
      var dx = (p.x - m.x) * W, dy = (p.y - m.y) * H;
      if (dx * dx + dy * dy < Math.pow((m.r * S) + 24, 2)) {
        glints.push({ mirror: m, t: pieceNow() - T0 });
      }
    }
    if (!drag) return;
    var dist = Math.sqrt(Math.pow((p.x - drag.px) * W, 2) + Math.pow((p.y - drag.py) * H, 2));
    downMoved += dist;
    if (dist < 4) { drag.px = p.x; drag.py = p.y; return; }
    /* Lay chain stitches from the anchor toward the current pointer. */
    var seg = Math.sqrt(Math.pow((p.x - drag.ax) * W, 2) + Math.pow((p.y - drag.ay) * H, 2));
    var steps = Math.floor(seg / 9);
    var k;
    var color = THREADS[threadIdx];
    for (k = 1; k <= steps; k++) {
      var t = k / steps;
      var sx = drag.ax + (p.x - drag.ax) * t;
      var sy = drag.ay + (p.y - drag.ay) * t;
      var off = (k % 2 === 0 ? 1 : -1) * 0.002;
      visitorStitches.push({ x: sx, y: sy + off, a: Math.atan2((p.y - drag.ay) * H, (p.x - drag.ax) * W), color: color });
    }
    drag.ax = p.x; drag.ay = p.y;
    drag.px = p.x; drag.py = p.y;
  });
  function endDrag(e) {
    if (!drag) return;
    var p = pos(e);
    var wasTap = downMoved < 12;
    drag = null;
    if (wasTap) {
      var now = pieceNow() - T0;
      if (lastTap && now - lastTap.t < 0.4 &&
          Math.abs(p.x - lastTap.x) * W < 30 && Math.abs(p.y - lastTap.y) * H < 30) {
        placeRosette(p);
        lastTap = null;
      } else {
        lastTap = { t: now, x: p.x, y: p.y };
      }
    }
    downPos = null;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', function () { drag = null; downPos = null; });

  if (typeof window !== 'undefined') {
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () { build(); draw(0); });
    }
    window.addEventListener('resize', function () { build(); draw(0); });
  }

  /* Boot: first frame at exactly t = 0. The clock starts with the rAF loop. */
  var T0 = 0, armed = false;
  function loop(ts) {
    if (!armed) { armed = true; T0 = ts / 1000; }
    draw(ts / 1000 - T0);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }

  build();
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
