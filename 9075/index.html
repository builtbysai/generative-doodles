<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9075 · Warp</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#1d1a16; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(236,227,204,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.75); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another warp</div>
<script>
'use strict';
// No9075 Warp.
// A plain checkerboard, black and bone, put through two sine fields:
// every corner of every square is pushed sideways by one wave and up or
// down by another, so the board bulges and pinches like cloth over
// something round. Nothing else is drawn. The op-art motion comes from
// the grid itself, which is why the build measures displacement: under
// a quarter-cell of push the board reads as a printing error, so seeds
// are kept only when their strongest corner moves at least that far
// while their weakest still moves a little, keeping the whole board in
// play.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9075', 10) || 9075;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const DARK = '#1d1a16';
const LIGHT = '#ece3cc';

function compose(s) {
  const rnd = mulberry32(s);
  return {
    ax: 0.010 + rnd() * 0.016, kx: 2.0 + rnd() * 2.4, px: rnd() * Math.PI * 2,
    ay: 0.010 + rnd() * 0.016, ky: 2.0 + rnd() * 2.4, py: rnd() * Math.PI * 2,
    cross: 0.5 + rnd() * 0.9,
  };
}

function displace(p, u, v) {
  const dx = p.ax * Math.sin(v * p.kx * Math.PI * 2 + p.px) + p.ax * p.cross * Math.sin((u + v) * p.ky * Math.PI + p.py);
  const dy = p.ay * Math.sin(u * p.ky * Math.PI * 2 + p.py) + p.ay * p.cross * Math.sin((u - v) * p.kx * Math.PI + p.px);
  return [dx, dy];
}

function measure(p) {
  let mx = 0;
  for (let i = 0; i <= 12; i++) for (let j = 0; j <= 12; j++) {
    const [dx, dy] = displace(p, i / 12, j / 12);
    mx = Math.max(mx, Math.hypot(dx, dy));
  }
  return mx;
}

function buildPiece(baseSeed) {
  let best = null, bestScore = -1;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    const m = measure(p);
    if (m > bestScore) { bestScore = m; best = p; }
    if (m > 0.022) return p;    // > about a quarter cell at 26 cols
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = DARK;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  const COLS = 26;
  const cellW = RX / COLS;
  const rows = Math.max(8, Math.round(RY / cellW));
  const cellH = RY / rows;

  const corner = (i, j) => {
    const u = i / COLS, v = j / rows;
    const [dx, dy] = displace(p, u, v);
    return [ox + (u + dx) * RX, oy + (v + dy) * RY];
  };

  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < COLS; i++) {
      ctx.fillStyle = (i + j) % 2 === 0 ? LIGHT : DARK;
      const a = corner(i, j), b = corner(i + 1, j), c = corner(i + 1, j + 1), d = corner(i, j + 1);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]);
      ctx.closePath();
      ctx.fill();
    }
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
