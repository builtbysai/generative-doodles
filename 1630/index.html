<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maze No. 129</title>
<style>
html, body { margin: 0; padding: 0; background: #F4F0E6; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F4F0E6';
var INK = '#2B2B28';
var SEED = 1630007;
var GRID = 21;            /* fixed 21x21 grid, 441 cells, asserted below */
var CELL_MS = 15;         /* one cell carved every 15 ms */
var SOL_S = 2.5;          /* solution traces in over two and a half seconds */
var N_CELLS = GRID * GRID;
var COMPLETE_T = N_CELLS * CELL_MS / 1000;
var STORE_KEY = 'doodle-1630';
/* Twelve fixed editions, one palette per edition, never mixed. Edition 1
   is the spec palette: rust walls on cream, dark teal solution. Each entry
   is [wall, solution]. */
var PALETTES = [
  ['#B4502A', '#1E5A52'],
  ['#3E8E84', '#7A3418'],
  ['#D89A3C', '#274060'],
  ['#2B2B28', '#B4502A'],
  ['#9C4A32', '#33544C'],
  ['#5E938A', '#5C3A22'],
  ['#C08A2E', '#2E4057'],
  ['#6B4A2F', '#1F4A44'],
  ['#A85A4E', '#3F5233'],
  ['#4A5A5E', '#A84A28'],
  ['#7A7A3E', '#5A3A4A'],
  ['#6E4A5A', '#4A4A22']
];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
var PAPER_RGB = hexRgb(PAPER);
var INK_RGB = hexRgb(INK);
var PAL_RGB = [];
var pi;
for (pi = 0; pi < PALETTES.length; pi++) {
  PAL_RGB.push([hexRgb(PALETTES[pi][0]), hexRgb(PALETTES[pi][1])]);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Square composition, centred, page ground the piece's own paper. On
   phones the square spans the full width; on desktop it is 96% of the
   smaller viewport dimension. */
function compRect() {
  var s = isPhone ? VW : Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- maze: recursive backtracker, seeded, fixed grid ---- */
var maze = null;   /* { walls: Uint8Array per cell bitmask N=1 E=2 S=4 W=8,
                      visit: Int16Array visit order index per cell,
                      order: [[r,c] ...] in carve order,
                      path: [[r,c] ...] entrance to exit } */
function buildMaze(edition) {
  var rng = mulberry32(SEED + edition * 1013);
  var walls = new Uint8Array(N_CELLS);
  var i;
  for (i = 0; i < N_CELLS; i++) walls[i] = 15; /* all four walls up */
  var visited = new Uint8Array(N_CELLS);
  var visit = new Int16Array(N_CELLS);
  var order = [];
  var stack = [];
  /* The carver starts at the entrance cell, bottom-left. */
  var sr = GRID - 1, sc = 0;
  var start = sr * GRID + sc;
  visited[start] = 1;
  visit[start] = 0;
  order.push([sr, sc]);
  stack.push([sr, sc]);
  var DIRS = [[-1, 0, 1, 4], [0, 1, 2, 8], [1, 0, 4, 1], [0, -1, 8, 2]];
  while (stack.length) {
    var top = stack[stack.length - 1];
    var r = top[0], c = top[1];
    var opts = [];
    var d;
    for (d = 0; d < 4; d++) {
      var nr = r + DIRS[d][0], nc = c + DIRS[d][1];
      if (nr < 0 || nr >= GRID || nc < 0 || nc >= GRID) continue;
      if (visited[nr * GRID + nc]) continue;
      opts.push(d);
    }
    if (!opts.length) { stack.pop(); continue; }
    var pick = opts[Math.floor(rng() * opts.length)];
    var dr = DIRS[pick];
    var tr = r + dr[0], tc = c + dr[1];
    walls[r * GRID + c] &= ~dr[2];
    walls[tr * GRID + tc] &= ~dr[3];
    visited[tr * GRID + tc] = 1;
    visit[tr * GRID + tc] = order.length;
    order.push([tr, tc]);
    stack.push([tr, tc]);
  }
  /* Entrance gap: bottom wall of the bottom-left cell. Exit gap: top
     wall of the top-right cell. */
  walls[(GRID - 1) * GRID + 0] &= ~4;
  walls[0 * GRID + (GRID - 1)] &= ~1;
  maze = { walls: walls, visit: visit, order: order, path: solveMaze(walls) };
}
/* A* from the entrance cell to the exit cell, Manhattan heuristic,
   through open passages only. Returns the cell list, entrance first. */
function solveMaze(walls) {
  var start = (GRID - 1) * GRID + 0;
  var goal = 0 * GRID + (GRID - 1);
  var gScore = new Float64Array(N_CELLS);
  var came = new Int16Array(N_CELLS);
  var closed = new Uint8Array(N_CELLS);
  var i;
  for (i = 0; i < N_CELLS; i++) { gScore[i] = Infinity; came[i] = -1; }
  gScore[start] = 0;
  var open = [start];
  function h(idx) {
    var r = Math.floor(idx / GRID), c = idx % GRID;
    return Math.abs(r - 0) + Math.abs(c - (GRID - 1));
  }
  while (open.length) {
    var best = 0, bi;
    for (bi = 1; bi < open.length; bi++) {
      if (gScore[open[bi]] + h(open[bi]) < gScore[open[best]] + h(open[best])) best = bi;
    }
    var cur = open.splice(best, 1)[0];
    if (cur === goal) break;
    if (closed[cur]) continue;
    closed[cur] = 1;
    var r = Math.floor(cur / GRID), c = cur % GRID;
    var w = walls[cur];
    var nb = [];
    if (!(w & 1) && r > 0) nb.push(cur - GRID);
    if (!(w & 2) && c < GRID - 1) nb.push(cur + 1);
    if (!(w & 4) && r < GRID - 1) nb.push(cur + GRID);
    if (!(w & 8) && c > 0) nb.push(cur - 1);
    var k;
    for (k = 0; k < nb.length; k++) {
      var nidx = nb[k];
      if (closed[nidx]) continue;
      var tentative = gScore[cur] + 1;
      if (tentative < gScore[nidx]) {
        gScore[nidx] = tentative;
        came[nidx] = cur;
        if (open.indexOf(nidx) < 0) open.push(nidx);
      }
    }
  }
  var path = [];
  var node = goal;
  while (node >= 0) {
    path.push([Math.floor(node / GRID), node % GRID]);
    node = came[node];
  }
  path.reverse();
  return path;
}
/* ---- edition state, persisted across visits ---- */
var edition = 0;
function loadEdition() {
  if (typeof localStorage === 'undefined') return;
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    var st = JSON.parse(raw);
    if (typeof st.edition === 'number') {
      edition = clamp(Math.floor(st.edition), 0, PALETTES.length - 1);
    }
  } catch (e) { /* corrupted state: start at edition 1 */ }
}
function saveEdition() {
  if (typeof localStorage === 'undefined') return;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ edition: edition }));
  } catch (e) { /* storage unavailable: the edition still advances */ }
}
/* QA hook: ?edition=K (or ?seed=K from the render harness) previews that
   edition without touching storage. */
function queryEdition() {
  if (typeof location === 'undefined' || !location.search) return -1;
  var m = location.search.match(/(?:edition|seed)=(\d+)/);
  if (!m) return -1;
  return clamp(parseInt(m[1], 10), 0, PALETTES.length - 1);
}
/* ---- drawing ---- */
function gridGeom(rect) {
  var m = rect.w * 0.045;
  var g = rect.w - 2 * m;
  return { x: rect.x + m, y: rect.y + m, cell: g / GRID, size: g };
}
function cellCenter(g, r, c) {
  return [g.x + (c + 0.5) * g.cell, g.y + (r + 0.5) * g.cell];
}
function drawWalls(g, carved) {
  var cell = g.cell;
  var lw = Math.max(2, cell * 0.30);
  ctx.strokeStyle = 'rgb(' + PAL_RGB[edition][0][0] + ',' + PAL_RGB[edition][0][1] + ',' + PAL_RGB[edition][0][2] + ')';
  ctx.lineWidth = lw;
  ctx.lineCap = 'square';
  ctx.lineJoin = 'miter';
  ctx.beginPath();
  var r, c;
  for (r = 0; r < GRID; r++) {
    for (c = 0; c < GRID; c++) {
      var idx = r * GRID + c;
      var w = maze.walls[idx];
      var x0 = g.x + c * cell, y0 = g.y + r * cell;
      var x1 = x0 + cell, y1 = y0 + cell;
      /* An interior wall is drawn once either neighbour has been
         visited; the outer border is drawn from the start, except the
         entrance and exit gaps, which are never drawn. */
      if (w & 1) {
        var drawN = (r === 0) || (maze.visit[idx] < carved) || (maze.visit[idx - GRID] < carved);
        if (drawN) { ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); }
      }
      if (w & 2) {
        var drawE = (c === GRID - 1) || (maze.visit[idx] < carved) || (maze.visit[idx + 1] < carved);
        if (drawE) { ctx.moveTo(x1, y0); ctx.lineTo(x1, y1); }
      }
      if (w & 4) {
        var drawS = (r === GRID - 1) || (maze.visit[idx] < carved) || (maze.visit[idx + GRID] < carved);
        if (drawS) { ctx.moveTo(x0, y1); ctx.lineTo(x1, y1); }
      }
      if (w & 8) {
        var drawW = (c === 0) || (maze.visit[idx] < carved) || (maze.visit[idx - 1] < carved);
        if (drawW) { ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); }
      }
    }
  }
  ctx.stroke();
}
function drawSolution(g, t) {
  if (t <= COMPLETE_T) return;
  var path = maze.path;
  var k = clamp((t - COMPLETE_T) / SOL_S, 0, 1);
  var nShow = Math.max(2, Math.floor(k * path.length) + 1);
  if (nShow > path.length) nShow = path.length;
  var sol = PAL_RGB[edition][1];
  ctx.strokeStyle = 'rgb(' + sol[0] + ',' + sol[1] + ',' + sol[2] + ')';
  ctx.lineWidth = Math.max(1.5, g.cell * 0.16);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  var i, pt;
  for (i = 0; i < nShow; i++) {
    pt = cellCenter(g, path[i][0], path[i][1]);
    if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
  }
  ctx.stroke();
}
function drawCarver(g, carved) {
  if (carved >= N_CELLS) return;
  var cell = maze.order[carved];
  var pt = cellCenter(g, cell[0], cell[1]);
  var wall = PAL_RGB[edition][0];
  ctx.fillStyle = 'rgb(' + wall[0] + ',' + wall[1] + ',' + wall[2] + ')';
  ctx.beginPath();
  ctx.arc(pt[0], pt[1], Math.max(2, g.cell * 0.26), 0, TAU);
  ctx.fill();
}
function drawText(rect) {
  var titlePx = isPhone ? 18 : 20;
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var titleW = ctx.measureText('Maze No. 129').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 06 · 29').width;
  var edLabel = 'EDITION ' + pad2(edition + 1) + ' / 12';
  var edW = ctx.measureText(edLabel).width;
  var plateW = Math.max(titleW, dateW, edW) + 28;
  var plateH = titlePx + smallPx * 2 + 24;
  var plateX = cxm - plateW / 2, plateY = rect.y + 10;
  /* Solid paper plates, so the copy reads over the maze at every size. */
  ctx.fillStyle = PAPER;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Maze No. 129', cxm, plateY + 8);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.75);
  ctx.fillText('2006 · 06 · 29', cxm, plateY + 8 + titlePx + 4);
  ctx.fillStyle = rgba(INK_RGB, 0.6);
  ctx.fillText(edLabel, cxm, plateY + 8 + titlePx + smallPx + 7);
  var hint = 'Tap to carve a new edition.';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cxm - hintPlateW / 2;
  var hintPlateY = rect.y + rect.h - hintPlateH - 10;
  ctx.fillStyle = PAPER;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.fillStyle = rgba(INK_RGB, 0.85);
  ctx.fillText(hint, cxm, hintPlateY + 7);
}
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  var g = gridGeom(rect);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  var carved = clamp(Math.floor(t / (CELL_MS / 1000)), 0, N_CELLS);
  drawWalls(g, carved);
  drawSolution(g, t);
  drawCarver(g, carved);
  drawText(rect);
}
var animT0 = 0, startTs = null;
function beginEdition(t0) {
  animT0 = t0;
  startTs = null;
  buildMaze(edition);
  draw(t0);
}
function onTap() {
  edition = (edition + 1) % PALETTES.length;
  saveEdition();
  if (reduced) {
    beginEdition(COMPLETE_T + SOL_S);
  } else {
    beginEdition(0);
  }
}
if (typeof canvas.addEventListener === 'function') canvas.addEventListener('pointerdown', onTap);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
/* ---- frame one: fixed phase, half the maze carved ---- */
var PHASE = Math.floor(N_CELLS * 0.5) * CELL_MS / 1000;
size();
loadEdition();
var qe = queryEdition();
if (qe >= 0) edition = qe;
if (reduced) {
  beginEdition(COMPLETE_T + SOL_S);
} else {
  beginEdition(PHASE);
  function loop(ts) {
    if (startTs === null) startTs = ts;
    var t = animT0 + (ts - startTs) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
