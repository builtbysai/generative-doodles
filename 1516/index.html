<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morgestraich at Four</title>
<style>
html, body { margin: 0; padding: 0; background: #0a0a0c; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');

  /* Palette — prompt only, no other color. */
  var FIELD = '#0a0a0c';
  var AMBER = [232, 168, 58];
  var CANDLE = [217, 192, 106];
  var PLUM = [58, 42, 58];
  var TEAL = [30, 58, 58];
  var GROUND = [51, 51, 58];

  var LOOP = 60;    /* lights out, procession, darkness, exactly */
  var PHASE = 18;   /* frame-one phase shift: opens mid-procession, not on black */
  var SEED = 1516000;
  var NLANT = 6;    /* one lantern every 6 s, from 4 s to 34 s */
  var SPAWN0 = 4, SPAWN_GAP = 6, TRAVEL = 24;

  var W = 0, H = 0, CX = 0, CY = 0, U = 0;
  var curT = 0;
  var startTime = null;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function sstep(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function a4(x) { return Math.round(x * 10000) / 10000; }
  function rgba(rgb, a) {
    return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a4(a) + ')';
  }
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function loopLocal(t) {
    var lt = (t + PHASE) % LOOP;
    return lt < 0 ? lt + LOOP : lt;
  }

  /* ---- lanterns: seeded once, size-independent fractions ---- */
  var LANTERNS = [];
  (function buildLanterns() {
    var rng = mulberry32(SEED);
    var i;
    for (i = 0; i < NLANT; i++) {
      LANTERNS.push({
        idx: i,
        spawn: SPAWN0 + i * SPAWN_GAP,
        col: rng() < 0.5 ? PLUM : TEAL,
        yOff: (rng() - 0.5) * 0.10,   /* fraction of H within the middle band */
        bobP: [12, 15, 20, 30, 60, 12][i],
        bobPh: rng() * Math.PI * 2,
        flickP: [3, 4, 5, 6, 3, 4][i],
        flickPh: rng() * Math.PI * 2
      });
    }
  })();

  /* Envelope: fade in 2 s, full, fade out last 2 s; 0 outside travel. */
  function envAt(lt, L) {
    var age = lt - L.spawn;
    if (age < 0 || age > TRAVEL) return 0;
    if (age < 2) return sstep(age / 2);
    if (age > TRAVEL - 2) return sstep((TRAVEL - age) / 2);
    return 1;
  }
  function basePos(L, lt) {
    var age = lt - L.spawn;
    var f = clamp(age / TRAVEL, 0, 1);
    return { x: lerp(-0.08 * W, 1.08 * W, f) };
  }

  /* ---- drag state: closed-form over recorded events, never integrated ---- */
  var pullDrags = [];   /* {lantern, downT, moves:[{t,dx}], upT, relDX} */
  var brightDrags = []; /* {downT, moves:[{t,dy}], upT, relDy} */
  var active = null;    /* current drag in progress */
  var ptrX = 0, ptrY = 0;

  function pullOffset(idx, t) {
    var i, d, last;
    for (i = pullDrags.length - 1; i >= 0; i--) {
      d = pullDrags[i];
      if (d.lantern !== idx || d.downT > t) continue;
      if (d.upT === null || t <= d.upT) {
        last = d.moves[d.moves.length - 1];
        return last ? last.dx : 0;
      }
      return d.relDX * Math.exp(-(t - d.upT) / 1.5);
    }
    return 0;
  }
  function brightnessAt(t) {
    var i, d, last, f;
    for (i = brightDrags.length - 1; i >= 0; i--) {
      d = brightDrags[i];
      if (d.downT > t) continue;
      if (d.upT === null || t <= d.upT) {
        last = d.moves[d.moves.length - 1];
        f = last ? clamp(1 - last.dy / 600, 0.75, 1.25) : 1;
        return f;
      }
      f = clamp(1 - d.relDy / 600, 0.75, 1.25);
      return 1 + (f - 1) * Math.exp(-(t - d.upT) / 2);
    }
    return 1;
  }
  function lanternState(L, t) {
    var lt = loopLocal(t);
    var env = envAt(lt, L);
    if (env <= 0) return null;
    var bp = basePos(L, lt);
    var bob = 0.008 * U * Math.sin(2 * Math.PI * lt / L.bobP + L.bobPh);
    var flick = 1 + 0.08 * Math.sin(2 * Math.PI * lt / L.flickP + L.flickPh);
    var bright = brightnessAt(t);
    var x = bp.x + pullOffset(L.idx, t);
    var y = CY + L.yOff * H + bob;
    return { x: x, y: y, env: env, flick: flick, bright: bright, alpha: env * flick * bright };
  }
  function activeCount(t) {
    var lt = loopLocal(t), i, n = 0;
    for (i = 0; i < NLANT; i++) if (envAt(lt, LANTERNS[i]) > 0) n++;
    return n;
  }
  function nearestLantern(x, y, t) {
    var i, s, best = -1, bestD = 1e9, d;
    for (i = 0; i < NLANT; i++) {
      s = lanternState(LANTERNS[i], t);
      if (!s) continue;
      d = Math.sqrt((s.x - x) * (s.x - x) + (s.y - y) * (s.y - y));
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function pointerPos(e) {
    if (e.clientX !== undefined) return { x: e.clientX, y: e.clientY };
    if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: 0, y: 0 };
  }
  function onDown(e) {
    var p = pointerPos(e);
    ptrX = p.x; ptrY = p.y;
    /* Only the procession band takes a drag; elsewhere ignored. */
    if (p.y < 0.30 * H || p.y > 0.70 * H) { active = null; return; }
    active = { downT: curT, downX: p.x, downY: p.y, mode: null, lantern: -1, moves: [] };
  }
  function onMove(e) {
    var p = pointerPos(e);
    ptrX = p.x; ptrY = p.y;
    if (!active) return;
    var dx = p.x - active.downX, dy = p.y - active.downY;
    if (active.mode === null) {
      if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      if (Math.abs(dy) > Math.abs(dx)) {
        active.mode = 'bright';
        brightDrags.push({ downT: active.downT, moves: [], upT: null, relDy: 0 });
        active.rec = brightDrags[brightDrags.length - 1];
      } else {
        active.mode = 'pull';
        active.lantern = nearestLantern(active.downX, active.downY, curT);
        if (active.lantern < 0) { active = null; return; }
        pullDrags.push({ lantern: active.lantern, downT: active.downT, moves: [], upT: null, relDX: 0 });
        active.rec = pullDrags[pullDrags.length - 1];
      }
    }
    if (active.mode === 'pull') active.rec.moves.push({ t: curT, dx: dx });
    else if (active.mode === 'bright') active.rec.moves.push({ t: curT, dy: dy });
  }
  function onUp(e) {
    var p = pointerPos(e);
    ptrX = p.x; ptrY = p.y;
    if (!active || !active.rec) { active = null; return; }
    active.rec.upT = curT;
    if (active.mode === 'pull') {
      var lm = active.rec.moves[active.rec.moves.length - 1];
      active.rec.relDX = lm ? lm.dx : 0;
    } else if (active.mode === 'bright') {
      var bm = active.rec.moves[active.rec.moves.length - 1];
      active.rec.relDy = bm ? bm.dy : 0;
    }
    active = null;
  }
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);

  function disc(x, y, r, rgb, a) {
    if (a <= 0 || r <= 0) return;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = rgba(rgb, a);
    ctx.fill();
  }
  function size() {
    var vw, vh;
    if (typeof window !== 'undefined' && window.visualViewport) {
      vw = window.visualViewport.width; vh = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && typeof window.innerWidth !== 'undefined') {
      vw = window.innerWidth; vh = window.innerHeight;
    } else {
      vw = 720; vh = 720;
    }
    W = vw; H = vh; CX = W / 2; CY = H / 2; U = Math.min(W, H);
    cv.width = W; cv.height = H;
  }
  function draw(t) {
    curT = t;
    size();
    /* pin canvas in draw() */
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);
    /* faint ground line, constant: the only unlit mark in the field */
    ctx.fillStyle = rgba(GROUND, 0.8);
    ctx.fillRect(0, CY + 0.14 * H, W, Math.max(1, 0.002 * U));
    var i, L, s;
    for (i = 0; i < NLANT; i++) {
      L = LANTERNS[i];
      s = lanternState(L, t);
      if (!s) continue;
      var a = s.alpha;
      /* lantern light: layered flat-alpha discs, never a gradient */
      disc(s.x, s.y, 0.14 * U, AMBER, 0.06 * a);
      disc(s.x, s.y, 0.09 * U, AMBER, 0.12 * a);
      disc(s.x, s.y, 0.05 * U, CANDLE, 0.25 * a);
      disc(s.x, s.y, 0.014 * U, CANDLE, 0.95 * a);
      /* carrier: cloaked glyph, alpha by its own lantern only */
      var ca = 0.9 * a;
      var cw = 0.05 * U, ch = 0.10 * U;
      var top = s.y + 0.03 * U, bot = top + ch;
      ctx.beginPath();
      ctx.moveTo(s.x - cw * 0.32, top);
      ctx.lineTo(s.x + cw * 0.32, top);
      ctx.lineTo(s.x + cw * 0.5, bot);
      ctx.lineTo(s.x - cw * 0.5, bot);
      ctx.closePath();
      ctx.fillStyle = rgba(L.col, ca);
      ctx.fill();
      /* stem from cloak to lantern, hood disc: plain, no features */
      ctx.fillStyle = rgba(L.col, ca);
      ctx.fillRect(s.x - Math.max(1, 0.002 * U), top - 0.02 * U, Math.max(2, 0.004 * U), 0.02 * U);
      disc(s.x, s.y + 0.015 * U, 0.011 * U, L.col, ca);
    }
  }

  function onResize() { draw(curT); }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', onResize);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  if (typeof window !== 'undefined') {
    window.__piece = {
      LOOP: LOOP, PHASE: PHASE,
      draw: draw,
      setTime: function (t) { curT = t; },
      loopLocal: loopLocal,
      lanternState: function (i, t) { return lanternState(LANTERNS[i], t); },
      activeCount: activeCount,
      brightnessAt: brightnessAt,
      pullOffset: function (i, t) { return pullOffset(i, t); },
      pointerDown: function (x, y) { onDown({ clientX: x, clientY: y }); },
      pointerMove: function (x, y) { onMove({ clientX: x, clientY: y }); },
      pointerUp: function (x, y) { onUp({ clientX: x, clientY: y }); },
      centre: function () { return { x: CX, y: CY }; }
    };
  }
  draw(0);
  function loop(ts) {
    if (startTime === null) startTime = ts;
    var t = (ts - startTime) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
