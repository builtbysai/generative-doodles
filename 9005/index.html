<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9005 · Strata — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0a0c11;
    color: #e3e7ee;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 620px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #7c8698; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #d99a4e; }
  header p { color: #7c8698; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c6cdd8; font-weight: normal; }
  #stage {
    position: relative;
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #0a0c11;
    box-shadow: 0 18px 60px rgba(0,0,0,0.6);
    cursor: pointer;
    overflow: hidden;
    touch-action: none;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.42) 100%);
  }
  footer { margin-top: 4vmin; color: #5b6373; font-size: 13px; font-style: italic; }
  footer a { color: #d99a4e; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9005</span> · Strata</h1>
  <p>An imaginary terrain sliced like a museum model: translucent elevation
  layers floating in a dark studio, one warm layer among the ink blues.
  <b>Drag to look around, scroll to zoom, click for a new landscape.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas><div id="vignette"></div></div>
<footer><a href="../">← all doodles</a> · drawn with code, three.js</footer>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

"use strict";
// ---------- seeded prng ----------
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 20260906;

const smoothstep = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- seeded gradient noise ----------
function makeNoise2D(rnd){
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--){
    const j = (rnd() * (i + 1)) | 0;
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y) => {
    switch (h & 3){
      case 0: return  x + y;
      case 1: return -x + y;
      case 2: return  x - y;
      default: return -x - y;
    }
  };
  return function(x, y){
    const X = Math.floor(x), Y = Math.floor(y);
    const xi = X & 255, yi = Y & 255;
    x -= X; y -= Y;
    const u = fade(x), v = fade(y);
    const aa = perm[perm[xi] + yi],     ab = perm[perm[xi] + yi + 1];
    const ba = perm[perm[xi + 1] + yi], bb = perm[perm[xi + 1] + yi + 1];
    return lerp(
      lerp(grad(aa, x, y),     grad(ba, x - 1, y), u),
      lerp(grad(ab, x, y - 1), grad(bb, x - 1, y - 1), u), v);
  };
}
function makeFbm(noise){
  return function(x, y, oct){
    let amp = 0.5, f = 1, sum = 0, norm = 0;
    for (let i = 0; i < oct; i++){
      sum += amp * noise(x * f, y * f);
      norm += amp; amp *= 0.5; f *= 2.03;
    }
    return sum / norm;
  };
}

// ---------- elevation field ----------
// One terrain recipe, widely parameterized: smooth island fbm with a seeded
// dash of ridged character, domain warp, and a radial fade. Normalization
// happens BEFORE the fade so low slices keep an organic footprint.
const GRID = 168, WORLD = 10;
function buildElevation(rnd){
  const noise = makeNoise2D(mulberry32((seed ^ 0x9e3779b9) >>> 0));
  const fbm = makeFbm(noise);
  const ox = rnd() * 90, oy = rnd() * 90;
  const rot = rnd() * Math.PI * 2, cr = Math.cos(rot), sr = Math.sin(rot);
  const freq = 0.45 + rnd() * 0.25;
  const oct = 4 + ((rnd() * 3) | 0);
  const ridgeMix = rnd() * 0.45;
  const warp = 0.5 + rnd() * 0.7;
  const f0 = 0.50 + rnd() * 0.15, f1 = 0.90 + rnd() * 0.10;
  const raw = new Float32Array(GRID * GRID);
  let mn = Infinity, mx = -Infinity;
  for (let j = 0; j < GRID; j++){
    for (let i = 0; i < GRID; i++){
      const x = -5 + 10 * i / (GRID - 1);
      const z = -5 + 10 * j / (GRID - 1);
      const wx = x + warp * fbm(x * 0.35 + ox, z * 0.35 + oy, 3);
      const wz = z + warp * fbm(x * 0.35 + ox + 7.3, z * 0.35 + oy + 3.1, 3);
      const rx = wx * cr - wz * sr, rz = wx * sr + wz * cr;
      const base = fbm(rx * freq + ox, rz * freq + oy, oct);
      const n2 = fbm(rx * freq * 1.3 + oy, rz * freq * 1.3 + ox + 4.7, oct);
      const rg = 1 - Math.abs(n2 * 1.7);
      const ridge = Math.pow(Math.max(rg, 0), 1.5) * 1.35 - 0.3;
      raw[j * GRID + i] = base + (ridge - base) * ridgeMix;
      const e = raw[j * GRID + i];
      if (e < mn) mn = e;
      if (e > mx) mx = e;
    }
  }
  const u8 = new Uint8Array(GRID * GRID);
  for (let k = 0; k < GRID * GRID; k++){
    const e = (raw[k] - mn) / (mx - mn);          // normalize first
    const i = k % GRID, j = (k / GRID) | 0;
    const x = -5 + 10 * i / (GRID - 1), z = -5 + 10 * j / (GRID - 1);
    const r = Math.hypot(x, z) / 5;
    const mask = 1 - smoothstep(f0, f1, r);       // then fade the edges
    u8[k] = Math.round(255 * Math.max(0, e * mask - (1 - mask) * 0.12));
  }
  // two box-blur passes: clean contour lines, no high-frequency jitter
  for (let pass = 0; pass < 2; pass++){
    const src = Float32Array.from(u8, v => v / 255);
    for (let j = 1; j < GRID - 1; j++){
      for (let i = 1; i < GRID - 1; i++){
        let s = 0;
        for (let dj = -1; dj <= 1; dj++)
          for (let di = -1; di <= 1; di++) s += src[(j + dj) * GRID + i + di];
        u8[j * GRID + i] = Math.round(255 * s / 9);
      }
    }
  }
  return { bytes: u8 };
}

// ---------- palette ----------
const STOPS = [
  [0.00, [0x1e, 0x2f, 0x52]],
  [0.35, [0x2a, 0x4d, 0x82]],
  [0.70, [0x5d, 0x8f, 0xc4]],
  [1.00, [0xb9, 0xd2, 0xec]]
];
function gradColor(t){
  for (let s = 0; s < STOPS.length - 1; s++){
    const [t0, c0] = STOPS[s], [t1, c1] = STOPS[s + 1];
    if (t <= t1){
      const k = (t - t0) / (t1 - t0);
      return new THREE.Color(
        lerp(c0[0], c1[0], k) / 255,
        lerp(c0[1], c1[1], k) / 255,
        lerp(c0[2], c1[2], k) / 255);
    }
  }
  const c = STOPS[STOPS.length - 1][1];
  return new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255);
}
const ACCENT_FILL = new THREE.Color(0xe09543);
const ACCENT_EDGE = new THREE.Color(0xffcf8f);

// ---------- three.js setup ----------
const stage = document.getElementById("stage");
const canvas = document.getElementById("c");
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (err) {
  renderer = null; // handled below: flat 2D strata map instead
}

function startGL(){
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c11);
scene.fog = new THREE.FogExp2(0x0a0c11, 0.026);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);

// pool of studio light under the floating stack
function makeGlowTexture(){
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(128, 128, 8, 128, 128, 128);
  grd.addColorStop(0, "rgba(96,128,190,0.30)");
  grd.addColorStop(0.55, "rgba(70,95,150,0.10)");
  grd.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = grd;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Mesh(
  new THREE.PlaneGeometry(13.5, 13.5),
  new THREE.MeshBasicMaterial({
    map: makeGlowTexture(), transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending
  })
);
glow.rotation.x = -Math.PI / 2;
glow.position.y = -2.85;
glow.renderOrder = -1;
scene.add(glow);

// drifting dust motes for studio air
const DUST = 240;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST * 3);
const dustRnd = mulberry32(1234);
for (let i = 0; i < DUST; i++){
  dustPos[i * 3] = (dustRnd() - 0.5) * 16;
  dustPos[i * 3 + 1] = dustRnd() * 6 - 2.5;
  dustPos[i * 3 + 2] = (dustRnd() - 0.5) * 16;
}
dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0x8fa3c8, size: 0.035, transparent: true, opacity: 0.32,
  depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
}));
scene.add(dust);

// ---------- the strata ----------
const sliceGeo = new THREE.PlaneGeometry(WORLD, WORLD);
sliceGeo.rotateX(-Math.PI / 2);
const sliceVert = `
  varying vec2 vUv;
  void main(){
    vUv = position.xz / ${WORLD.toFixed(1)} + 0.5;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }`;
const sliceFrag = `
  varying vec2 vUv;
  uniform sampler2D elevTex;
  uniform float h;
  uniform vec3 fillColor;
  uniform vec3 edgeColor;
  uniform float opacity;
  void main(){
    float e = texture2D(elevTex, vUv).r;
    float above = smoothstep(h - 0.0025, h + 0.0025, e);
    if (above < 0.004) discard;
    float d = abs(e - h);
    float edge = pow(1.0 - smoothstep(0.0, 0.008, d), 1.4);
    vec3 col = mix(fillColor, edgeColor, edge) * 1.18; // polish: lift the ink-blue layers off the black ground
    float rise = smoothstep(h, h + 0.10, e);   // fake occlusion toward the peaks
    col *= (1.0 - 0.28 * rise);
    float a = above * opacity + edge * 0.6;
    gl_FragColor = vec4(col, clamp(a, 0.0, 1.0));
  }`;

let strata = null;
const ELEV_H = 4.8; // world height of the full elevation range

function buildStrata(){
  if (strata){
    scene.remove(strata);
    strata.traverse(o => { if (o.material) o.material.dispose(); });
  }
  strata = new THREE.Group();
  const rnd = mulberry32(seed >>> 0);
  const { bytes } = buildElevation(rnd);
  const elevTex = new THREE.DataTexture(bytes, GRID, GRID, THREE.RedFormat);
  elevTex.magFilter = THREE.LinearFilter;
  elevTex.minFilter = THREE.LinearFilter;
  elevTex.needsUpdate = true;

  const n = 9 + ((rnd() * 4) | 0);             // 9..12 layers, each one readable
  const accentH = 0.44 + rnd() * 0.14;          // one warm layer, mid-stack
  let accentIdx = 0, best = 1e9;
  for (let i = 0; i < n; i++){
    const h = lerp(0.05, 0.90, i / (n - 1));
    const d = Math.abs(h - accentH);
    if (d < best){ best = d; accentIdx = i; }
  }
  for (let i = 0; i < n; i++){
    const h = lerp(0.05, 0.90, i / (n - 1));
    const isAccent = i === accentIdx;
    const fill = isAccent ? ACCENT_FILL.clone() : gradColor(h);
    const edge = isAccent ? ACCENT_EDGE.clone() : gradColor(h).lerp(new THREE.Color(1, 1, 1), 0.5);
    const mat = new THREE.ShaderMaterial({
      vertexShader: sliceVert,
      fragmentShader: sliceFrag,
      uniforms: {
        elevTex: { value: elevTex },
        h: { value: h },
        fillColor: { value: fill },
        edgeColor: { value: edge },
        opacity: { value: isAccent ? 0.40 : 0.18 }
      },
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const m = new THREE.Mesh(sliceGeo, mat);
    m.position.y = (h - 0.5) * ELEV_H;
    m.userData.baseY = m.position.y;
    m.userData.phase = rnd() * Math.PI * 2;
    m.renderOrder = i; // camera stays above: paint bottom slices first
    strata.add(m);
  }
  scene.add(strata);
}

// ---------- camera orbit (custom, damped) ----------
let theta = 0.8, phi = 0.84, radius = 13.0;   // phi 0.84 ≈ 42° above horizon: 3/4 view, stacking reads on load
// deterministic opening angle per seed so the default view is composed
theta = mulberry32((seed ^ 0x51f3a9) >>> 0)() * Math.PI * 2;
let vTheta = 0, vPhi = 0, autoSpeed = 0.07;
let dragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0, downT = 0, moved = false;
const target = new THREE.Vector3(0, 0.25, 0);

function applyCamera(){
  const sp = Math.sin(phi), y = Math.cos(phi);
  camera.position.set(
    target.x + radius * sp * Math.cos(theta),
    target.y + radius * y,
    target.z + radius * sp * Math.sin(theta));
  camera.lookAt(target);
}
stage.addEventListener("pointerdown", e => {
  dragging = true; moved = false;
  lastX = downX = e.clientX; lastY = downY = e.clientY; downT = performance.now();
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) moved = true;
  vTheta = -dx * 0.0042;
  vPhi = -dy * 0.0032;
  theta += vTheta; phi += vPhi;
  phi = Math.min(1.36, Math.max(0.60, phi));
});
stage.addEventListener("pointerup", e => {
  dragging = false;
  if (!moved && performance.now() - downT < 500) regenerate();
});
stage.addEventListener("wheel", e => {
  e.preventDefault();
  radius = Math.min(19, Math.max(9.5, radius * (1 + Math.sign(e.deltaY) * 0.08)));
}, { passive: false });

function regenerate(){
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  theta = Math.random() * Math.PI * 2;
  buildStrata();
}

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

// ---------- main loop ----------
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  if (!dragging){
    theta += autoSpeed * dt;      // slow studio turntable
    theta += vTheta; phi += vPhi; // settle drag velocity
    vTheta *= 0.94; vPhi *= 0.94;
  }
  applyCamera();
  if (strata){
    for (const m of strata.children){
      m.position.y = m.userData.baseY + Math.sin(t * 0.25 + m.userData.phase) * 0.022;
    }
  }
  const dp = dust.geometry.attributes.position;
  for (let i = 0; i < DUST; i++){
    let y = dp.array[i * 3 + 1] + dt * 0.05;
    if (y > 3.5) y = -2.5;
    dp.array[i * 3 + 1] = y;
  }
  dp.needsUpdate = true;
  renderer.render(scene, camera);
}

buildStrata();
resize();
tick();
} // end startGL

if (renderer) startGL();
else fallback2D();

// ---------- no-WebGL fallback: a flat 2D strata map, still pretty ----------
function fallback2D(){
  const c = document.getElementById("c");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = 720;
  c.width = S * dpr; c.height = S * dpr;
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const rnd = mulberry32(seed >>> 0);
  const { bytes } = buildElevation(rnd);
  const img = ctx.createImageData(GRID, GRID);
  for (let k = 0; k < GRID * GRID; k++){
    const e = bytes[k] / 255;
    const col = gradColor(e);
    img.data[k * 4] = col.r * 255;
    img.data[k * 4 + 1] = col.g * 255;
    img.data[k * 4 + 2] = col.b * 255;
    img.data[k * 4 + 3] = 255;
  }
  const off = document.createElement("canvas");
  off.width = GRID; off.height = GRID;
  off.getContext("2d").putImageData(img, 0, 0);
  ctx.fillStyle = "#0a0c11";
  ctx.fillRect(0, 0, S, S);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, 40, 40, S - 80, S - 80);
}
</script>
