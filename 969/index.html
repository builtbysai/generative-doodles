<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyes Shut</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0C10; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
/* No.969 "Eyes Shut" — Blind Self Portrait mechanism (kyle-mcdonald, PP130).
   A hand draws a single-line portrait only while the eye stays closed.
   Open eye = frozen hand. The wall of past portraits is a record, not a score. */

// ---------- palette ----------
var GROUND = '#0B0C10';
var PAPER  = '#EDE8DA';
var LINE   = '#1A1B1F';
var RING   = '#FFD88A';
var MINT   = '#7DF9C6';
var LASH   = '#F5F2EA';
var TABLE_A = '#14161D';
var TABLE_B = '#1D2029';

// ---------- seeded rng ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var DT = 1 / 120;            // fixed sim step (seconds)
var PREROLL = 4200;          // 35 s
var PLANNED_SECONDS = 90;    // compressed 3-6 minute sitting
var PEEL_STEPS = 240;        // 2 s
var ENTER_STEPS = 72;        // 0.6 s
var PEEK_STEPS = 240;        // exactly 2 s
var WALL_MAX = 12;
var BASE_SEED = 969130;

// ---------- sim state ----------
var sitterCounter = 0;

function makeWaypoints(rng) {
  // Face landmark clusters in paper-local space (u,v in 0..1).
  var wps = [];
  function add(x, y) {
    wps.push({ x: x, y: y, mx: (rng() - 0.5) * 0.10, my: (rng() - 0.5) * 0.10 });
  }
  var i, a, cx, cy;
  // jaw oval
  for (i = 0; i < 10; i++) {
    a = (i / 10) * Math.PI * 2;
    add(0.5 + Math.cos(a) * 0.30, 0.52 + Math.sin(a) * 0.36);
  }
  // brow arc
  for (i = 0; i <= 3; i++) {
    var u = 0.32 + (i / 3) * 0.36;
    add(u, 0.295 - Math.sin((i / 3) * Math.PI) * 0.02);
  }
  // left eye loop
  cx = 0.40; cy = 0.42;
  for (i = 0; i < 6; i++) {
    a = (i / 6) * Math.PI * 2;
    add(cx + Math.cos(a) * 0.055, cy + Math.sin(a) * 0.034);
  }
  // right eye loop
  cx = 0.60;
  for (i = 0; i < 6; i++) {
    a = (i / 6) * Math.PI * 2;
    add(cx + Math.cos(a) * 0.055, cy + Math.sin(a) * 0.034);
  }
  // nose line with hook
  add(0.50, 0.45); add(0.505, 0.52); add(0.50, 0.585); add(0.475, 0.60); add(0.52, 0.60);
  // mouth arc
  for (i = 0; i <= 3; i++) {
    var u2 = 0.42 + (i / 3) * 0.16;
    add(u2, 0.685 + Math.sin((i / 3) * Math.PI) * 0.022);
  }
  return wps;
}

function makePortrait(seed) {
  var rng = mulberry32(seed);
  var P = {
    seed: seed,
    rng: rng,
    wps: makeWaypoints(rng),
    wpi: 0,
    hx: 0.5, hy: 0.16,           // hand starts at top of jaw oval
    line: [{ x: 0.5, y: 0.16 }],
    t: rng() * 40,               // drift clock, seeded offset
    ph: [rng() * 6.283, rng() * 6.283, rng() * 6.283, rng() * 6.283],
    elapsed: 0,
    planned: PLANNED_SECONDS,
    tagSeconds: 180 + Math.floor(rng() * 181)  // 3:00 .. 6:00
  };
  return P;
}

function drift(P, t, axis) {
  // smooth seeded wander (sum of sines)
  if (axis === 0) return Math.sin(t * 0.90 + P.ph[0]) * 0.62 + Math.sin(t * 0.371 + P.ph[1]) * 0.38;
  return Math.sin(t * 0.83 + P.ph[2]) * 0.62 + Math.sin(t * 0.419 + P.ph[3]) * 0.38;
}

// guide: {active:boolean, x,y (paper-local), strength 0..1}
function stepPortrait(P, dt, frozen, guide, events) {
  if (frozen) return;
  P.elapsed += dt;
  P.t += dt;
  var wp = P.wps[P.wpi];
  var amp = 0.055 * (guide.active ? (1 - 0.65 * guide.strength) : 1);
  var tx = wp.x + wp.mx + drift(P, P.t, 0) * amp;
  var ty = wp.y + wp.my + drift(P, P.t, 1) * amp;
  if (guide.active) {
    tx = tx + (guide.x - tx) * 0.55 * guide.strength;
    ty = ty + (guide.y - ty) * 0.55 * guide.strength;
  }
  var dx = tx - P.hx, dy = ty - P.hy;
  var d = Math.sqrt(dx * dx + dy * dy);
  var speed = 0.52;
  var step = speed * dt;
  if (d > 0.0001) {
    var m = Math.min(step, d);
    P.hx += (dx / d) * m;
    P.hy += (dy / d) * m;
  }
  var last = P.line[P.line.length - 1];
  var lx = P.hx - last.x, ly = P.hy - last.y;
  if (lx * lx + ly * ly > 0.0035 * 0.0035) P.line.push({ x: P.hx, y: P.hy });
  if (d < 0.028) {
    P.wpi = (P.wpi + 1) % P.wps.length;
    events.tick = true; // landmark snap (sound cue)
  }
}

var S = {
  phase: 'draw',           // draw | peel | enter
  phaseStep: 0,
  cur: null,
  wall: [],                // {line, tag} most recent first
  eyeOpenSteps: 0,
  guide: { active: false, x: 0.5, y: 0.5, strength: 0 },
  guideDecay: 0,
  pendingPeek: false,
  pendingNewSitter: false,
  pendingPeelSound: false
};

function pushWall(P, finished) {
  var frac = finished ? 1 : Math.min(1, P.elapsed / P.planned);
  var tag = Math.max(1, Math.round(P.tagSeconds * frac));
  S.wall.unshift({ line: P.line, tag: tag });
  while (S.wall.length > WALL_MAX) S.wall.pop();
}

function startSitter() {
  sitterCounter += 1;
  S.cur = makePortrait(BASE_SEED + sitterCounter * 7919);
  S.phase = 'draw';
  S.phaseStep = 0;
}

// history: two finished portraits generated fast at init (same generator, coarse dt)
(function initHistory() {
  for (var k = 2; k >= 1; k--) {
    var P = makePortrait(BASE_SEED - k * 104729);
    var guideOff = { active: false, x: 0.5, y: 0.5, strength: 0 };
    var ev = { tick: false };
    var steps = Math.floor(P.planned / (1 / 30));
    for (var i = 0; i < steps; i++) stepPortrait(P, 1 / 30, false, guideOff, ev);
    S.wall.push({ line: P.line, tag: P.tagSeconds });
  }
})();

startSitter();

function stepSim() {
  var events = { tick: false };
  // consume queued events by sim step
  if (S.pendingPeek) {
    S.pendingPeek = false;
    if (S.phase === 'draw' && S.eyeOpenSteps === 0) {
      S.eyeOpenSteps = PEEK_STEPS;
      audioEyeOpen();
    }
  }
  if (S.pendingNewSitter) {
    S.pendingNewSitter = false;
    if (S.phase === 'draw') {
      pushWall(S.cur, false);
      S.phase = 'peel';
      S.phaseStep = 0;
      S.pendingPeelSound = true;
    }
  }
  var frozen = S.eyeOpenSteps > 0;
  if (S.eyeOpenSteps > 0) S.eyeOpenSteps -= 1;

  if (S.guide.active) {
    S.guide.strength = Math.min(1, S.guide.strength + DT / 0.3);
  } else if (S.guide.strength > 0) {
    // blindness returns over ~2 s after release
    S.guide.strength = Math.max(0, S.guide.strength - DT / 2);
    if (S.guide.strength > 0) S.guide.active = false; // keep target, fading strength
  }

  if (S.phase === 'draw') {
    var wasDrawing = !frozen;
    stepPortrait(S.cur, DT, frozen, S.guide, events);
    if (events.tick && wasDrawing) audioTick();
    if (S.cur.elapsed >= S.cur.planned) {
      pushWall(S.cur, true);
      S.phase = 'peel';
      S.phaseStep = 0;
      S.pendingPeelSound = true;
    }
  } else if (S.phase === 'peel') {
    if (S.pendingPeelSound) { S.pendingPeelSound = false; audioPeel(); }
    S.phaseStep += 1;
    if (S.phaseStep >= PEEL_STEPS) {
      sitterCounter += 1;
      S.cur = makePortrait(BASE_SEED + sitterCounter * 7919);
      S.phase = 'enter';
      S.phaseStep = 0;
    }
  } else if (S.phase === 'enter') {
    S.phaseStep += 1;
    if (S.phaseStep >= ENTER_STEPS) { S.phase = 'draw'; S.phaseStep = 0; }
  }
  audioSetScratch(S.phase === 'draw' && S.eyeOpenSteps === 0);
}

// ---------- audio (lazy, guarded; visual is silent without it) ----------
var AC = null, scratchGain = null, scratchFilter = null;
function ensureAudio() {
  if (AC) { if (AC.resume) { try { AC.resume(); } catch (e) {} } return; }
  var Ctx = null;
  try {
    if (typeof window !== 'undefined') Ctx = window.AudioContext || window.webkitAudioContext;
  } catch (e) { Ctx = null; }
  if (!Ctx) return;
  try {
    AC = new Ctx();
    var len = AC.sampleRate * 1.5;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var ch = buf.getChannelData(0);
    var r = mulberry32(4242);
    for (var i = 0; i < len; i++) ch[i] = r() * 2 - 1;
    var src = AC.createBufferSource();
    src.buffer = buf; src.loop = true;
    scratchFilter = AC.createBiquadFilter();
    scratchFilter.type = 'bandpass'; scratchFilter.frequency.value = 2100; scratchFilter.Q.value = 0.7;
    scratchGain = AC.createGain(); scratchGain.gain.value = 0;
    src.connect(scratchFilter); scratchFilter.connect(scratchGain); scratchGain.connect(AC.destination);
    src.start();
  } catch (e) { AC = null; scratchGain = null; }
}
function audioSetScratch(on) {
  if (!AC || !scratchGain) return;
  try {
    var t = AC.currentTime;
    scratchGain.gain.setTargetAtTime(on ? 0.045 : 0.0, t, 0.06);
  } catch (e) {}
}
function audioBlip(freq, dur, gain, type) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur + 0.02);
  } catch (e) {}
}
function audioTick() { audioBlip(1450, 0.05, 0.05, 'triangle'); }
function audioEyeOpen() { /* bed stops dead via audioSetScratch in stepSim */ }
function audioPeel() {
  if (!AC || !scratchFilter || !scratchGain) return;
  try {
    scratchFilter.frequency.setValueAtTime(3200, AC.currentTime);
    scratchFilter.frequency.exponentialRampToValueAtTime(300, AC.currentTime + 0.5);
    scratchGain.gain.setValueAtTime(0.12, AC.currentTime);
    scratchGain.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.55);
    scratchFilter.frequency.setValueAtTime(2100, AC.currentTime + 0.6);
  } catch (e) {}
}

// ---------- layout ----------
var canvas = document.getElementById('cv');
var ctx = canvas.getContext('2d');
var L = null; // last layout

function isPhoneLayout(w, h) {
  var sm = 0;
  try {
    if (typeof window !== 'undefined' && window.screen) sm = Math.min(window.screen.width || 0, window.screen.height || 0);
  } catch (e) { sm = 0; }
  if (sm > 0 && sm < 700) return true;
  return h > w * 1.15;
}

function computeLayout(w, h) {
  var phone = isPhoneLayout(w, h);
  var lay = { w: w, h: h, phone: phone };
  if (!phone) {
    var wallW = Math.max(56, Math.min(100, w * 0.105));
    lay.wallX = w - wallW - w * 0.018;
    lay.wallW = wallW;
    lay.paperX = w * 0.055;
    lay.paperW = lay.wallX - lay.paperX - w * 0.045;
    lay.paperH = Math.min(lay.paperW * 0.94, h * 0.60);
    lay.paperY = h * 0.315;
    lay.eyeCx = w * 0.44; lay.eyeCy = h * 0.115; lay.eyeR = Math.max(22, Math.min(36, h * 0.042));
    lay.ringCx = lay.paperX + lay.paperW / 2;
    lay.ringCy = lay.paperY - Math.max(30, h * 0.052);
    lay.ringR = Math.max(20, Math.min(32, h * 0.036));
    lay.slotW = wallW; lay.slotH = wallW * 1.12; lay.slotGap = 16; lay.wallTop = h * 0.315;
  } else {
    // wall becomes a bottom strip on narrow frames
    lay.paperX = w * 0.06;
    lay.paperW = w * 0.88;
    lay.paperH = Math.min(lay.paperW * 0.98, h * 0.46);
    lay.paperY = h * 0.235;
    lay.eyeCx = w * 0.5; lay.eyeCy = h * 0.085; lay.eyeR = Math.max(19, Math.min(28, h * 0.032));
    lay.ringCx = lay.paperX + lay.paperW / 2;
    lay.ringCy = lay.paperY - Math.max(26, h * 0.036);
    lay.ringR = Math.max(17, Math.min(26, h * 0.028));
    lay.stripY = h - Math.max(96, h * 0.135);
    lay.slotW = Math.max(44, Math.min(58, w * 0.145)); lay.slotH = lay.slotW * 1.12; lay.slotGap = 8;
  }
  return lay;
}

function wallSlotRect(lay, i) {
  if (!lay.phone) {
    return { x: lay.wallX, y: lay.wallTop + i * (lay.slotH + lay.slotGap), w: lay.slotW, h: lay.slotH };
  }
  return { x: 10 + i * (lay.slotW + lay.slotGap), y: lay.stripY + 6, w: lay.slotW, h: lay.slotH };
}

function fmtTag(sec) {
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function drawLineInRect(line, rect) {
  if (line.length < 2) return;
  // midpoint-quadratic smoothing: the stored polyline stays exact,
  // the stroke reads as one continuous hand-drawn line
  ctx.beginPath();
  var x0 = rect.x + line[0].x * rect.w, y0 = rect.y + line[0].y * rect.h;
  ctx.moveTo(x0, y0);
  for (var i = 1; i < line.length - 1; i++) {
    var px = rect.x + line[i].x * rect.w, py = rect.y + line[i].y * rect.h;
    var nx = rect.x + line[i + 1].x * rect.w, ny = rect.y + line[i + 1].y * rect.h;
    ctx.quadraticCurveTo(px, py, (px + nx) / 2, (py + ny) / 2);
  }
  var lx = rect.x + line[line.length - 1].x * rect.w, ly = rect.y + line[line.length - 1].y * rect.h;
  ctx.lineTo(lx, ly);
  ctx.stroke();
}

// ---------- draw ----------
function draw() {
  var vv = null;
  try { if (typeof window !== 'undefined') vv = window.visualViewport; } catch (e) { vv = null; }
  var w = vv ? vv.width : (typeof window !== 'undefined' ? window.innerWidth : 720);
  var h = vv ? vv.height : (typeof window !== 'undefined' ? window.innerHeight : 720);
  if (canvas.width !== w) canvas.width = w;
  if (canvas.height !== h) canvas.height = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  var lay = computeLayout(w, h);
  L = lay;

  // ground
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  var paper = { x: lay.paperX, y: lay.paperY, w: lay.paperW, h: lay.paperH };

  // table: two flat tones
  ctx.fillStyle = TABLE_A;
  ctx.fillRect(paper.x - 16, paper.y + paper.h - 4, paper.w + 34, 30);
  ctx.fillStyle = TABLE_B;
  ctx.fillRect(paper.x - 16, paper.y + paper.h - 4, paper.w + 34, 5);

  // warm glow pool of the ring light (layered flat alpha, no gradient)
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = RING;
  ctx.beginPath();
  ctx.ellipse(paper.x + paper.w / 2, paper.y + paper.h / 2, paper.w * 0.56, paper.h * 0.54, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 0.04;
  ctx.beginPath();
  ctx.ellipse(paper.x + paper.w / 2, paper.y + paper.h / 2, paper.w * 0.40, paper.h * 0.38, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // sheet rect (peel slides it toward the wall's newest slot; enter slides it in)
  var sheet = { x: paper.x, y: paper.y, w: paper.w, h: paper.h };
  var sheetAlpha = 1;
  if (S.phase === 'peel') {
    var p = S.phaseStep / PEEL_STEPS;
    var e = p * p * (3 - 2 * p);
    var slot = wallSlotRect(lay, 0);
    sheet.x = sheet.x + (slot.x - sheet.x) * e;
    sheet.y = sheet.y + (slot.y - sheet.y) * e;
    sheet.w = sheet.w + (slot.w - sheet.w) * e;
    sheet.h = sheet.h + (slot.h - sheet.h) * e;
  } else if (S.phase === 'enter') {
    var p2 = S.phaseStep / ENTER_STEPS;
    sheet.x = paper.x - 46 * (1 - p2);
    sheetAlpha = 0.25 + 0.75 * p2;
  }

  // current portrait that now lives on the wall (during peel, S.cur is already replaced)
  ctx.save();
  ctx.globalAlpha = 0.85 * sheetAlpha;
  ctx.fillStyle = PAPER;
  ctx.fillRect(sheet.x, sheet.y, sheet.w, sheet.h);
  ctx.restore();

  {
    // the line rides the sheet in every phase (during peel it travels to the wall)
    ctx.save();
    ctx.globalAlpha = sheetAlpha;
    ctx.strokeStyle = LINE;
    ctx.lineWidth = Math.max(1.1, sheet.w / 340);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    drawLineInRect(S.cur.line, sheet);
    ctx.restore();
    // hand dot (white line-end)
    if (S.phase === 'draw') {
      var hx = sheet.x + S.cur.hx * sheet.w;
      var hy = sheet.y + S.cur.hy * sheet.h;
      ctx.beginPath();
      ctx.fillStyle = LASH;
      ctx.arc(hx, hy, Math.max(2.6, sheet.w / 150), 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.strokeStyle = LINE;
      ctx.lineWidth = 1;
      ctx.arc(hx, hy, Math.max(2.6, sheet.w / 150), 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // wall of finished portraits (record, not a score)
  for (var i = 0; i < S.wall.length; i++) {
    var r = wallSlotRect(lay, i);
    if (!lay.phone && r.y + r.h > h - 8) break;
    if (lay.phone && r.x + r.w > w - 6) break;
    var entry = S.wall[i];
    // during peel the incoming sheet occupies slot 0
    if (S.phase === 'peel' && i === 0) continue;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = PAPER;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 0.8;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    drawLineInRect(entry.line, r);
    ctx.restore();
    ctx.fillStyle = PAPER;
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(fmtTag(entry.tag), r.x + r.w / 2, r.y + r.h + 12);
  }

  // ring light: halo ring + ring + stem
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = RING;
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.arc(lay.ringCx, lay.ringCy, lay.ringR + 5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = RING;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(lay.ringCx, lay.ringCy, lay.ringR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = TABLE_B;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(lay.ringCx, lay.ringCy + lay.ringR + 5);
  ctx.lineTo(lay.ringCx, paper.y + 2);
  ctx.stroke();

  // the eye: mint circle + lash line. No pupil, no iris, ever.
  var open = S.eyeOpenSteps > 0;
  ctx.save();
  if (open) {
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = MINT;
    ctx.beginPath();
    ctx.arc(lay.eyeCx, lay.eyeCy, lay.eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = MINT;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(lay.eyeCx, lay.eyeCy, lay.eyeR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = LASH;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  if (open) {
    // lash lifted: upper arc
    ctx.arc(lay.eyeCx, lay.eyeCy + lay.eyeR * 0.18, lay.eyeR * 0.78, Math.PI * 1.15, Math.PI * 1.85);
  } else {
    // closed: lash curves downward across the circle
    ctx.moveTo(lay.eyeCx - lay.eyeR * 0.82, lay.eyeCy - lay.eyeR * 0.05);
    ctx.quadraticCurveTo(lay.eyeCx, lay.eyeCy + lay.eyeR * 0.62, lay.eyeCx + lay.eyeR * 0.82, lay.eyeCy - lay.eyeR * 0.05);
  }
  ctx.stroke();
  ctx.restore();
}

// ---------- input ----------
var downInfo = null;
var lastTapStamp = -10000;

function evtPos(e) {
  var x = (e.clientX != null ? e.clientX : 0);
  var y = (e.clientY != null ? e.clientY : 0);
  return { x: x, y: y };
}
function toPaperLocal(px, py) {
  if (!L) return null;
  var u = (px - L.paperX) / L.paperW;
  var v = (py - L.paperY) / L.paperH;
  if (u < -0.2 || u > 1.2 || v < -0.2 || v > 1.2) return null;
  return { x: Math.max(0, Math.min(1, u)), y: Math.max(0, Math.min(1, v)) };
}
function nowStamp() {
  try { if (typeof performance !== 'undefined' && performance.now) return performance.now(); } catch (e) {}
  return 0;
}

function onDown(e) {
  ensureAudio();
  var p = evtPos(e);
  downInfo = { x: p.x, y: p.y, stamp: nowStamp(), moved: false };
  var pl = toPaperLocal(p.x, p.y);
  if (pl) { S.guide.x = pl.x; S.guide.y = pl.y; }
}
function onMove(e) {
  if (!downInfo) return;
  var p = evtPos(e);
  var dx = p.x - downInfo.x, dy = p.y - downInfo.y;
  if (dx * dx + dy * dy > 36) downInfo.moved = true;
  if (downInfo.moved) {
    var pl = toPaperLocal(p.x, p.y);
    if (pl) {
      S.guide.x = pl.x; S.guide.y = pl.y;
      S.guide.active = true; // guide only counts as a drag once it moves
    }
  }
}
function onUp(e) {
  if (!downInfo) return;
  var stamp = nowStamp();
  var wasDrag = downInfo.moved;
  downInfo = null;
  S.guide.active = false; // strength decays in sim (blindness returns over ~2 s)
  if (wasDrag) return;
  // a tap
  if (stamp - lastTapStamp < 320) {
    lastTapStamp = -10000;
    S.pendingNewSitter = true;   // double-tap: new sitter
    S.pendingPeek = false;
  } else {
    lastTapStamp = stamp;
    S.pendingPeek = true;        // tap: peek (eye opens 2 s, hand frozen)
  }
}

try {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  if (typeof window !== 'undefined') window.addEventListener('pointerup', onUp);
} catch (e) {}

// resize: redraw at the new size
try {
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { draw(); });
  }
} catch (e) {}

// ---------- run ----------
// pre-roll: exactly 4200 fixed steps, then the synchronous first frame
for (var s = 0; s < PREROLL; s++) stepSim();
draw();

if (typeof requestAnimationFrame !== 'undefined') {
  var lastTs = null, acc = 0;
  var loop = function (ts) {
    if (lastTs == null) lastTs = ts;
    var dtReal = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dtReal > 0.25) dtReal = 0.25;
    acc += dtReal;
    var n = Math.floor(acc / DT);
    if (n > 40) n = 40;
    acc -= n * DT;
    for (var i = 0; i < n; i++) stepSim();
    draw();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
