<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№605 Rintocchi</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0e1e; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var SKY = '#141a33';       // night indigo courtyard
  var SKY_DEEP = '#0b0e1e';  // deeper indigo at the top
  var STONE = '#8a6f4d';     // stone, amber-lit
  var STONE_DARK = '#5d4a33';
  var STONE_LINE = '#3f3325';
  var AMBER = '#e8a94e';     // amber light
  var AMBER_SOFT = '#f2c078';
  var BRONZE = '#6b4f2a';    // dark bronze bell
  var BRONZE_HI = '#a67c3d'; // bronze rim light
  var BRONZE_DARK = '#3d2c17';
  var CLOTH = '#e8e2d4';     // dancers in pale cloth
  var CLOTH_SHADE = '#b9b2a0';
  var POET = '#0a0a0c';      // the poet in black
  var POET_RIM = '#4a4238';
  var PLATE = '#e8e2d4';
  var PLATE_DIM = '#9a8f7a';

  // Fixed-phase first frame: t = 2.4 s. The opening strike sounded at
  // t = 0 and seeded the courtyard; by 2.4 s the bell swing has decayed
  // to near rest, the first resonance rings have grown wide and faint,
  // and the dancers are mid-bloom in their fixed seeded formation.
  // Frame one is byte-reproducible: every figure is a pure function of
  // t and the seed.
  var FIRST_T = 2.4;

  // Poet lines, seeded pick. Short, plain, no em dashes.
  var LINES = [
    'The bell keeps the hour.',
    'Stone remembers the ring.',
    'Night leans on the tower.',
    'One strike, and the court breathes.',
    'The city counts in bronze.'
  ];

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  // Seeded PRNG (mulberry32). No unseeded Math.random anywhere.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha

  // QA hook: ?sx=0.7&sy=0.3, or ?seed=0.7,0.3 as render-piece.js passes
  // it. A seeded render re-seeds the courtyard as if a strike had
  // sounded at that drag position, so the probe frame visibly differs.
  var probeSx = null, probeSy = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m;
    m = /[?&]sx=([^&]*)/.exec(qs); if (m) { probeSx = parseFloat(m[1]); }
    m = /[?&]sy=([^&]*)/.exec(qs); if (m) { probeSy = parseFloat(m[1]); }
    m = /[?&]seed=([^&]*)/.exec(qs);
    if (m) {
      var parts = decodeURIComponent(m[1]).split(',');
      if (parts.length >= 2) { probeSx = parseFloat(parts[0]); probeSy = parseFloat(parts[1]); }
    }
  } catch (e) {}

  var BASE_SEED = 1910;
  var seed = BASE_SEED;
  var strikeCount = 0;
  var lastStrikeT = 0;      // the opening strike at t = 0
  var strikeStrength = 0.6; // opening strike, middling
  if (probeSx !== null && !isNaN(probeSx) && probeSy !== null && !isNaN(probeSy)) {
    seed = BASE_SEED + Math.floor(probeSx * 997) * 7919 + Math.floor(probeSy * 991) * 104729;
    strikeCount = 1;
    strikeStrength = clamp(0.35 + 0.65 * Math.abs(probeSx - 0.5) * 2, 0.35, 1);
  }

  // Ensemble: pure function of the seed. Three dancers, two musicians,
  // one poet. Each carries base position, sway period and phase, and a
  // pose seed, so a strike re-seeds the whole field at once.
  function buildEnsemble(sd) {
    var rng = mulberry32(sd);
    var dancers = [];
    for (var d = 0; d < 3; d++) {
      dancers.push({
        x: 0.22 + d * 0.26 + (rng() - 0.5) * 0.08,
        y: 0.60 + rng() * 0.16,
        h: 0.115 + rng() * 0.03,
        period: 6.5 + rng() * 3,
        phase: rng() * Math.PI * 2,
        arm: rng() * Math.PI * 2,
        lean: (rng() - 0.5) * 0.35
      });
    }
    var musicians = [];
    for (var mu = 0; mu < 2; mu++) {
      musicians.push({
        x: mu === 0 ? 0.05 + rng() * 0.03 : 0.92 + rng() * 0.03,
        y: 0.74 + rng() * 0.06,
        period: 5 + rng() * 2.5,
        phase: rng() * Math.PI * 2,
        kind: mu // 0 drum, 1 long-neck lute
      });
    }
    var poet = {
      x: 0.585 + rng() * 0.03,
      y: 0.66 + rng() * 0.05,
      line: LINES[Math.floor(rng() * LINES.length)]
    };
    var stars = [];
    for (var s = 0; s < 26; s++) {
      stars.push({ x: rng(), y: rng() * 0.30, r: 0.6 + rng() * 1.1, a: 0.25 + rng() * 0.5 });
    }
    return { dancers: dancers, musicians: musicians, poet: poet, stars: stars };
  }
  var ensemble = buildEnsemble(seed);

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      stageH = vh * 0.94;
      stageW = Math.min(vw * 0.72, stageH * 0.92);
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Bell geometry: dominates the top third.
  function bellGeom() {
    var cx = W / 2;
    var top = H * 0.045;
    var bw = W * 0.34;
    var mouthY = H * 0.30;
    var pivotY = H * 0.075;
    return { cx: cx, top: top, bw: bw, mouthY: mouthY, pivotY: pivotY, beamY: H * 0.008 };
  }

  // Bell swing angle at time t: the last strike set it swinging; it
  // decays exponentially, so by FIRST_T it is near rest. Pure function
  // of t and the strike state. Drag sets swing directly while held.
  var dragAngle = 0, dragging = false;
  function bellAngle(t) {
    if (dragging) { return dragAngle; }
    var age = t - lastStrikeT;
    if (age < 0) { age = 0; }
    return 0.32 * strikeStrength * Math.exp(-age / 1.1) * Math.cos(age * 7.0);
  }

  function drawFigure(cx, baseY, hgt, lean, armPhase, t, period, phase) {
    // A dancer in pale cloth: head, dress triangle, two arms. Sway is a
    // slow sine, about 0.15 Hz, well under the flicker ceiling.
    var sway = Math.sin((t / period) * Math.PI * 2 + phase) * 0.10;
    var x = cx + sway * hgt;
    var headR = hgt * 0.16;
    var headY = baseY - hgt + headR * 0.4;
    var shoulderY = baseY - hgt * 0.72;
    ctx.fillStyle = CLOTH;
    ctx.beginPath(); ctx.moveTo(x - hgt * 0.30, baseY);
    ctx.lineTo(x + hgt * 0.30, baseY);
    ctx.lineTo(x + hgt * 0.10 + lean * hgt * 0.4, shoulderY);
    ctx.lineTo(x - hgt * 0.10 + lean * hgt * 0.4, shoulderY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = CLOTH_SHADE;
    ctx.beginPath(); ctx.moveTo(x - hgt * 0.10 + lean * hgt * 0.4, shoulderY);
    ctx.lineTo(x + hgt * 0.10 + lean * hgt * 0.4, shoulderY);
    ctx.lineTo(x + hgt * 0.05, baseY);
    ctx.lineTo(x - hgt * 0.05, baseY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = CLOTH;
    ctx.beginPath(); ctx.moveTo(x + headR, headY); ctx.arc(x, headY, headR, 0, Math.PI * 2); ctx.fill();
    // Arms: two thin lines raised at seeded angles, drifting slowly.
    var a1 = -0.9 + Math.sin((t / period) * Math.PI * 2 + armPhase) * 0.35;
    var a2 = -2.2 + Math.cos((t / period) * Math.PI * 2 + armPhase) * 0.35;
    ctx.strokeStyle = CLOTH;
    ctx.lineWidth = Math.max(1.5, hgt * 0.035);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, shoulderY);
    ctx.lineTo(x + Math.cos(a1) * hgt * 0.42, shoulderY + Math.sin(a1) * hgt * 0.42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, shoulderY);
    ctx.lineTo(x + Math.cos(a2) * hgt * 0.42, shoulderY + Math.sin(a2) * hgt * 0.42); ctx.stroke();
  }

  function drawMusician(m, t) {
    var x = m.x * W, baseY = m.y * H;
    var bob = Math.sin((t / m.period) * Math.PI * 2 + m.phase) * H * 0.006;
    var headR = H * 0.018;
    var headY = baseY - H * 0.075 + bob;
    ctx.fillStyle = CLOTH_SHADE;
    ctx.beginPath(); ctx.moveTo(x - H * 0.028, baseY);
    ctx.lineTo(x + H * 0.028, baseY);
    ctx.lineTo(x + H * 0.016, headY + headR * 0.6);
    ctx.lineTo(x - H * 0.016, headY + headR * 0.6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = CLOTH;
    ctx.beginPath(); ctx.moveTo(x + headR, headY); ctx.arc(x, headY, headR, 0, Math.PI * 2); ctx.fill();
    if (m.kind === 0) {
      // Drum: a small ringed circle held at the knee.
      var dx = x + H * 0.035, dy = baseY - H * 0.028;
      ctx.strokeStyle = BRONZE_HI;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(dx + H * 0.016, dy); ctx.arc(dx, dy, H * 0.016, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = CLOTH;
      ctx.beginPath(); ctx.moveTo(dx + H * 0.016, dy); ctx.arc(dx, dy, H * 0.016, 0, Math.PI * 2); ctx.fill();
    } else {
      // Lute: a long neck rising from the hands.
      ctx.strokeStyle = BRONZE_HI;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x + H * 0.01, baseY - H * 0.045);
      ctx.lineTo(x + H * 0.055, baseY - H * 0.105); ctx.stroke();
      ctx.fillStyle = BRONZE;
      ctx.beginPath(); ctx.moveTo(x + H * 0.062, baseY - H * 0.112);
      ctx.arc(x + H * 0.055, baseY - H * 0.105, H * 0.011, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Night indigo sky, deepening upward.
    var bg = ctx.createLinearGradient(0, 0, 0, H * 0.36);
    bg.addColorStop(0, SKY_DEEP);
    bg.addColorStop(1, SKY);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H * 0.36);

    // Stars, seeded, only in the sky band.
    for (var si = 0; si < ensemble.stars.length; si++) {
      var st = ensemble.stars[si];
      ctx.fillStyle = 'rgba(232,226,212,' + a4(st.a) + ')';
      ctx.beginPath(); ctx.moveTo(st.x * W + st.r, st.y * H); ctx.arc(st.x * W, st.y * H, st.r, 0, Math.PI * 2); ctx.fill();
    }

    // Courtyard stone, lower two-thirds.
    ctx.fillStyle = STONE_DARK;
    ctx.fillRect(0, H * 0.34, W, H * 0.66);
    // Amber light pool under the bell.
    var glow = ctx.createRadialGradient(W / 2, H * 0.52, 4, W / 2, H * 0.52, W * 0.42);
    glow.addColorStop(0, 'rgba(232,169,78,' + a4(0.28) + ')');
    glow.addColorStop(1, 'rgba(232,169,78,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, H * 0.34, W, H * 0.66);
    // Stone slab joints: three horizontals, a few verticals.
    ctx.strokeStyle = STONE_LINE;
    ctx.lineWidth = 1;
    var row;
    for (row = 0; row < 3; row++) {
      var ry = H * (0.47 + row * 0.15);
      ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(W, ry); ctx.stroke();
    }
    var col;
    for (col = 1; col < 6; col++) {
      var cxj = (W / 6) * col;
      ctx.beginPath(); ctx.moveTo(cxj, H * 0.47); ctx.lineTo(cxj + (col % 2 ? 14 : -14), H * 0.92); ctx.stroke();
    }

    var g = bellGeom();
    var ang = bellAngle(t);

    // Resonance rings from the last strike, born at the bell mouth and
    // widening across the courtyard, fading as they go.
    var age = t - lastStrikeT;
    if (age >= 0) {
      ctx.save();
      for (var ri = 1; ri <= 3; ri++) {
        var rAge = age - (ri - 1) * 0.55;
        if (rAge < 0) { continue; }
        var rr = rAge * H * 0.16;
        var ra = a4(0.5 * Math.pow(1 - Math.min(1, rAge / 5), 1.2) * strikeStrength);
        if (ra <= 0.01) { continue; }
        ctx.strokeStyle = 'rgba(242,192,120,' + ra + ')';
        ctx.lineWidth = Math.max(1, 3 - ri * 0.7);
        ctx.beginPath(); ctx.moveTo(g.cx + rr, g.mouthY + rr * 0.28);
        ctx.ellipse(g.cx, g.mouthY + rr * 0.28, rr, rr * 0.28, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }

    // Support beam across the top.
    ctx.fillStyle = BRONZE_DARK;
    ctx.fillRect(W * 0.06, g.beamY, W * 0.88, H * 0.014);
    // Bell hangers.
    ctx.strokeStyle = BRONZE_DARK;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(g.cx - g.bw * 0.18, g.beamY + H * 0.014); ctx.lineTo(g.cx - g.bw * 0.10, g.top); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(g.cx + g.bw * 0.18, g.beamY + H * 0.014); ctx.lineTo(g.cx + g.bw * 0.10, g.top); ctx.stroke();

    // The bell: dome, waist, flared skirt, bronze rim light on one side.
    var bw = g.bw, bh = g.mouthY - g.top;
    ctx.fillStyle = BRONZE;
    ctx.beginPath();
    ctx.moveTo(g.cx - bw * 0.30, g.top + bh * 0.18);
    ctx.quadraticCurveTo(g.cx - bw * 0.34, g.top + bh * 0.62, g.cx - bw * 0.50, g.mouthY - bh * 0.06);
    ctx.quadraticCurveTo(g.cx - bw * 0.52, g.mouthY, g.cx - bw * 0.44, g.mouthY);
    ctx.lineTo(g.cx + bw * 0.44, g.mouthY);
    ctx.quadraticCurveTo(g.cx + bw * 0.52, g.mouthY, g.cx + bw * 0.50, g.mouthY - bh * 0.06);
    ctx.quadraticCurveTo(g.cx + bw * 0.34, g.top + bh * 0.62, g.cx + bw * 0.30, g.top + bh * 0.18);
    ctx.quadraticCurveTo(g.cx, g.top - bh * 0.10, g.cx - bw * 0.30, g.top + bh * 0.18);
    ctx.closePath(); ctx.fill();
    // Rim light along the right shoulder.
    ctx.strokeStyle = BRONZE_HI;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(g.cx + bw * 0.28, g.top + bh * 0.22);
    ctx.quadraticCurveTo(g.cx + bw * 0.33, g.top + bh * 0.60, g.cx + bw * 0.47, g.mouthY - bh * 0.08); ctx.stroke();
    // Mouth shadow line.
    ctx.strokeStyle = BRONZE_DARK;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(g.cx - bw * 0.44, g.mouthY - 1); ctx.lineTo(g.cx + bw * 0.44, g.mouthY - 1); ctx.stroke();

    // Clapper: hangs from the pivot, swung by the drag or by the strike.
    var clLen = bh * 0.72;
    var clX = g.cx + Math.sin(ang) * clLen;
    var clY = g.pivotY + Math.cos(ang) * clLen;
    ctx.strokeStyle = BRONZE_DARK;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(g.cx, g.pivotY); ctx.lineTo(clX, clY); ctx.stroke();
    ctx.fillStyle = BRONZE_HI;
    ctx.beginPath(); ctx.moveTo(clX + H * 0.012, clY); ctx.arc(clX, clY, H * 0.012, 0, Math.PI * 2); ctx.fill();

    // The ensemble: dancers, musicians, poet.
    var di;
    for (di = 0; di < ensemble.dancers.length; di++) {
      var dn = ensemble.dancers[di];
      drawFigure(dn.x * W, dn.y * H, dn.h * H, dn.lean, dn.arm, t, dn.period, dn.phase);
    }
    for (var mi = 0; mi < ensemble.musicians.length; mi++) {
      drawMusician(ensemble.musicians[mi], t);
    }
    // Poet: a black figure standing still, rim-lit, facing the bell.
    var p = ensemble.poet;
    var px = p.x * W, py = p.y * H, ph = H * 0.13;
    ctx.fillStyle = POET;
    ctx.beginPath(); ctx.moveTo(px - ph * 0.20, py);
    ctx.lineTo(px + ph * 0.20, py);
    ctx.lineTo(px + ph * 0.10, py - ph * 0.72);
    ctx.lineTo(px - ph * 0.10, py - ph * 0.72);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = POET;
    ctx.beginPath(); ctx.moveTo(px + ph * 0.13, py - ph * 0.82); ctx.arc(px, py - ph * 0.82, ph * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = POET_RIM;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(px + ph * 0.13, py - ph * 0.82); ctx.arc(px, py - ph * 0.82, ph * 0.13, -Math.PI * 0.4, Math.PI * 0.4); ctx.stroke();

    // Poet's line, in amber, above the hint.
    var fsL = Math.round((isPhone ? 15 : 15) * clamp(W / 420, 0.85, 1.15));
    ctx.fillStyle = AMBER_SOFT;
    ctx.font = 'italic ' + fsL + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.line, W / 2, H - 46);
    ctx.textAlign = 'left';

    // Title plate, drawn on the canvas, top-left. The bell is centered,
    // so the plate clears it on desktop and phone alike.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = PLATE;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Rintocchi', 18, 34);
    ctx.fillStyle = PLATE_DIM;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№605 · 2003 · 09 · 08', 18, 34 + fs2 + 8);
    ctx.fillStyle = AMBER_SOFT;
    ctx.textAlign = 'center';
    ctx.fillText('Drag to ring the bell.', W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  // --- Drag-earned strikes (Franke audio rule) ---
  var audioCtx = null;
  var lastNow = 0;
  var startT = 0;
  function nowT() {
    if (typeof performance !== 'undefined' && performance.now) {
      return FIRST_T + (performance.now() - startT) / 1000;
    }
    return FIRST_T;
  }
  function ensureAudio() {
    // Bell sound only inside the drag gesture, never autoplay.
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { audioCtx = new AC(); }
      }
      if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); }
    } catch (e) {}
    return audioCtx;
  }
  function ringBell(strength) {
    var ac = ensureAudio();
    if (!ac) { return; }
    try {
      // Inharmonic bell partials, closed-form gains and decays.
      var partials = [[1, 1.0, 6.0], [2.76, 0.55, 4.0], [5.40, 0.30, 2.6], [8.90, 0.16, 1.6]];
      var base = 220;
      for (var i = 0; i < partials.length; i++) {
        var osc = ac.createOscillator();
        var gain = ac.createGain();
        osc.type = 'sine';
        osc.frequency.value = base * partials[i][0];
        var peak = 0.22 * strength * partials[i][1];
        gain.gain.setValueAtTime(0, ac.currentTime);
        gain.gain.linearRampToValueAtTime(peak, ac.currentTime + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + partials[i][2]);
        osc.connect(gain); gain.connect(ac.destination);
        osc.start(); osc.stop(ac.currentTime + partials[i][2] + 0.1);
      }
    } catch (e) {}
  }
  function strike(strength, t) {
    // A strike re-seeds the whole courtyard: new seed, new ensemble,
    // new poet line, bell swinging, rings reborn.
    strikeCount++;
    seed = BASE_SEED + strikeCount * 7919 + Math.floor(strength * 1000) * 131;
    ensemble = buildEnsemble(seed);
    lastStrikeT = t;
    strikeStrength = clamp(strength, 0.2, 1);
    ringBell(strikeStrength);
  }

  var dragStartX = 0, dragMax = 0, struckThisDrag = false;
  function pointerPos(e) {
    var r = { x: 0 };
    try {
      if (typeof canvas.getBoundingClientRect === 'function') {
        var b = canvas.getBoundingClientRect();
        r.x = (e.clientX || 0) - b.left;
      }
    } catch (err) {}
    return r;
  }
  function onDown(e) {
    dragging = true; struckThisDrag = false; dragMax = 0;
    dragStartX = pointerPos(e).x;
    dragAngle = 0;
    ensureAudio();
    if (typeof e.preventDefault === 'function') { e.preventDefault(); }
  }
  function onMove(e) {
    if (!dragging) { return; }
    var g = bellGeom();
    var dx = pointerPos(e).x - g.cx;
    dragAngle = clamp(dx / (W * 0.5), -0.55, 0.55);
    dragMax = Math.max(dragMax, Math.abs(pointerPos(e).x - dragStartX));
    // A hard swing past the rim strikes at once.
    if (!struckThisDrag && Math.abs(dragAngle) > 0.48) {
      struckThisDrag = true;
      dragging = false;
      strike(0.7 + Math.abs(dragAngle) * 0.5, nowT());
      draw(nowT());
    }
  }
  function onUp(e) {
    if (!dragging) { return; }
    dragging = false;
    dragAngle = 0;
    if (!struckThisDrag && dragMax > 40) {
      strike(clamp(dragMax / 220, 0.3, 1), nowT());
    }
    draw(nowT());
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // All motion runs near 0.15 Hz, well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    startT = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - startT) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
