<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Smudge</title>
<style>
  html, body { margin: 0; padding: 0; background: #E8DFD2; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- palette (strict) ----
  var BEIGE  = [232, 223, 210]; // #E8DFD2 paper + highlight
  var FIBER  = [214, 203, 184]; // #D6CBB8 mid tone
  var SHADOW = [138, 126, 110]; // #8A7E6E shade
  var RED    = [166, 58, 46];   // #A63A2E the smudge, only color

  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function lerpC(a, b, t) {
    return [Math.round(a[0] + (b[0] - a[0]) * t),
            Math.round(a[1] + (b[1] - a[1]) * t),
            Math.round(a[2] + (b[2] - a[2]) * t)];
  }

  // ---- seeded RNG (mulberry32) ----
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SEED_BASE = 605073; // fixed base; reseed n uses SEED_BASE + n, fully reproducible

  // ---- relief field generation (normalized coords, full-bleed) ----
  // Each form: center, radius, rotation, outline points, facet wedges with normals.
  function makeForm(rng, cx, cy) {
    var kind = rng(); // 0 teardrop, 1 circle/blob, 2 leaf
    var r = 0.016 + rng() * 0.030;
    var rot = rng() * Math.PI * 2;
    var n = 9 + Math.floor(rng() * 4); // outline points
    var pts = [];
    var i, a, rr;
    for (i = 0; i < n; i++) {
      a = (i / n) * Math.PI * 2;
      if (kind < 0.38) {           // teardrop: gently pinched at top
        rr = r * (0.80 + 0.22 * Math.sin(a)) * (0.94 + rng() * 0.10);
      } else if (kind < 0.72) {    // circle / soft blob
        rr = r * (0.90 + rng() * 0.16);
      } else {                     // leaf: pointed at both ends
        rr = r * (0.55 + 0.50 * Math.abs(Math.sin(a))) * (0.95 + rng() * 0.08);
      }
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    // rotate outline
    var cr = Math.cos(rot), sr = Math.sin(rot);
    var rp = pts.map(function (p) {
      return [cx + p[0] * cr - p[1] * sr, cy + p[0] * sr + p[1] * cr];
    });
    // facet wedges: centroid + consecutive outline pairs, with outward normals.
    // Many small facets, but adjacent wedges share near-identical normals, so the
    // shading steps blend into a soft relief read rather than a crystalline fan.
    var facets = [];
    for (i = 0; i < rp.length; i++) {
      var p1 = rp[i], p2 = rp[(i + 1) % rp.length];
      var mx = (p1[0] + p2[0]) / 2 - cx, my = (p1[1] + p2[1]) / 2 - cy;
      var ml = Math.sqrt(mx * mx + my * my) || 1;
      facets.push({ arc: [p1, p2], nx: mx / ml, ny: my / ml });
    }
    return { cx: cx, cy: cy, r: r, facets: facets, depth: 0.75 + rng() * 0.5 };
  }

  function buildField(seed) {
    var rng = mulberry32(seed);
    var forms = [];
    var tries = 0;
    // density falls off toward the edges: acceptance probability by radius
    while (forms.length < 120 && tries < 4000) {
      tries++;
      var x = rng(), y = rng();
      var dx = x - 0.5, dy = y - 0.5;
      var d = Math.sqrt(dx * dx + dy * dy) / 0.7071; // 0 center -> 1 corner
      var keep = 1.0 - 0.72 * d * d;
      if (rng() > keep) continue;
      // keep the heart clear for the smudge
      var sx = x - SMUDGE.x, sy = y - SMUDGE.y;
      if (Math.sqrt(sx * sx + sy * sy) < 0.085) continue;
      forms.push(makeForm(rng, x, y));
    }
    return forms;
  }

  // ---- the smudge: fixed anchor, never moves across reseeds ----
  var SMUDGE = { x: 0.5, y: 0.48 };
  var smudgeBlobs = (function () {
    var rng = mulberry32(605999); // fixed forever, independent of field seed
    var blobs = [];
    var layers = [
      { r: 0.052, a: 0.16 }, { r: 0.040, a: 0.20 }, { r: 0.028, a: 0.26 }, { r: 0.016, a: 0.32 }
    ];
    layers.forEach(function (L) {
      var n = 10, pts = [];
      for (var i = 0; i < n; i++) {
        var a = (i / n) * Math.PI * 2;
        var rr = L.r * (0.78 + rng() * 0.45);
        pts.push([SMUDGE.x + Math.cos(a) * rr * 1.25, SMUDGE.y + Math.sin(a) * rr * 0.82]);
      }
      blobs.push({ pts: pts, a: L.a });
    });
    // satellite flecks
    var flecks = [];
    for (var j = 0; j < 6; j++) {
      var fa = rng() * Math.PI * 2, fd = 0.055 + rng() * 0.05;
      flecks.push({
        x: SMUDGE.x + Math.cos(fa) * fd * 1.3,
        y: SMUDGE.y + Math.sin(fa) * fd * 0.85,
        r: 0.0035 + rng() * 0.005, a: 0.14 + rng() * 0.14
      });
    }
    return { blobs: blobs, flecks: flecks };
  })();

  // ---- paper fiber (fixed, precomputed) ----
  var fibers = (function () {
    var rng = mulberry32(605111);
    var out = [];
    for (var i = 0; i < 900; i++) {
      var x = rng(), y = rng(), a = rng() * Math.PI, l = 0.004 + rng() * 0.014;
      out.push({ x: x, y: y, dx: Math.cos(a) * l, dy: Math.sin(a) * l, a: 0.05 + rng() * 0.10, w: rng() });
    }
    return out;
  })();

  // ---- state ----
  var reseedCount = 0;
  var field = buildField(SEED_BASE);
  var settleStart = -10000; // elapsed ms when the current field began settling
  var SETTLE_MS = 1400;
  var lastTapAt = -10000;
  var lastTapX = 0, lastTapY = 0;

  var LIGHT_PERIOD = 40000;      // one orbit per ~40 s
  var LIGHT_A0 = -2.25;          // fixed raking angle for frame one (from upper left)
  var PHASE0 = 0;                // synchronous first frame is drawn at elapsed = 0

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(currentElapsed());
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function currentElapsed() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() - t0;
    return 0;
  }

  // facet color from light dot normal: -1 full shadow -> +1 full highlight
  var facetCache = {};
  function facetColor(dot) {
    var key = Math.round(dot * 40);
    if (facetCache[key]) return facetCache[key];
    var c;
    if (dot < 0) c = lerpC(FIBER, SHADOW, Math.min(1, -dot * 0.95));
    else c = lerpC(FIBER, BEIGE, Math.min(1, dot * 1.05));
    var s = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    facetCache[key] = s;
    return s;
  }

  function tracePts(pts, S, OX, OY) {
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var x = OX + pts[i][0] * S, y = OY + pts[i][1] * S;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function draw(elapsed) {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // snap time to 100 ms steps: frame one is reproducible regardless of
    // load-timing jitter, and the light drifts in fine stopmotion steps
    var t = PHASE0 + Math.round(elapsed / 100) * 100;
    var ang = LIGHT_A0 + (t / LIGHT_PERIOD) * Math.PI * 2;
    var lx = Math.cos(ang), ly = Math.sin(ang);

    // cover-fit: normalized field fills the viewport, cropping the overflow
    var S = Math.max(W, H);
    var OX = (W - S) / 2, OY = (H - S) / 2;

    // settle fade after a reseed: the new field presses in gently
    var settle = 1;
    var since = t - settleStart;
    if (since >= 0 && since < SETTLE_MS) settle = 0.55 + 0.45 * (since / SETTLE_MS);

    // paper ground
    ctx.fillStyle = rgba(BEIGE, 1);
    ctx.fillRect(0, 0, W, H);

    // fiber
    var i, f;
    ctx.lineWidth = 1;
    for (i = 0; i < fibers.length; i++) {
      f = fibers[i];
      ctx.strokeStyle = rgba(f.w < 0.6 ? FIBER : SHADOW, f.a);
      ctx.beginPath();
      ctx.moveTo(OX + f.x * S, OY + f.y * S);
      ctx.lineTo(OX + (f.x + f.dx) * S, OY + (f.y + f.dy) * S);
      ctx.stroke();
    }

    // contact shadow under each form, cast away from the light
    var shOff = 0.006;
    ctx.fillStyle = rgba(SHADOW, 0.16 * settle);
    for (i = 0; i < field.length; i++) {
      var fm = field[i];
      ctx.beginPath();
      ctx.ellipse(OX + (fm.cx - lx * shOff * fm.depth) * S, OY + (fm.cy - ly * shOff * fm.depth) * S,
                  fm.r * S * 0.82, fm.r * S * 0.62, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // relief facets: 3 broad facets per form, shaded from the light vector
    for (i = 0; i < field.length; i++) {
      var fo = field[i];
      for (var j = 0; j < fo.facets.length; j++) {
        var fc = fo.facets[j];
        var dot = (fc.nx * lx + fc.ny * ly) * fo.depth;
        ctx.fillStyle = facetColor(dot);
        ctx.globalAlpha = settle;
        ctx.beginPath();
        ctx.moveTo(OX + fo.cx * S, OY + fo.cy * S);
        for (var k = 0; k < fc.arc.length; k++) {
          ctx.lineTo(OX + fc.arc[k][0] * S, OY + fc.arc[k][1] * S);
        }
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // the smudge (drawn after relief; sits on the paper, never moves)
    for (i = 0; i < smudgeBlobs.flecks.length; i++) {
      f = smudgeBlobs.flecks[i];
      ctx.fillStyle = rgba(RED, f.a);
      ctx.beginPath();
      ctx.ellipse(OX + f.x * S, OY + f.y * S, f.r * S * 1.4, f.r * S * 0.8, 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    for (i = 0; i < smudgeBlobs.blobs.length; i++) {
      ctx.fillStyle = rgba(RED, smudgeBlobs.blobs[i].a);
      tracePts(smudgeBlobs.blobs[i].pts, S, OX, OY);
      ctx.fill();
    }

    // hint, very subtle
    ctx.fillStyle = rgba(SHADOW, 0.55);
    ctx.font = (isPhone() ? 11 : 12) + 'px Georgia, serif';
    ctx.textAlign = 'right';
    ctx.fillText('double-tap', W - 14, H - 12);
    ctx.textAlign = 'left';
  }

  function frame() {
    draw(currentElapsed());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  // ---- interaction: double-tap reseeds; single tap and drag do nothing ----
  canvas.addEventListener('pointerdown', function (e) {
    var now = currentElapsed();
    var dx = e.clientX - lastTapX, dy = e.clientY - lastTapY;
    if (now - lastTapAt <= 350 && Math.sqrt(dx * dx + dy * dy) < 60) {
      reseedCount++;
      field = buildField(SEED_BASE + reseedCount);
      settleStart = now;
      lastTapAt = -10000;
      draw(now);
    } else {
      lastTapAt = now;
      lastTapX = e.clientX;
      lastTapY = e.clientY;
    }
  });

  resize();
  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
