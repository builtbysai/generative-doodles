<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№101 · Flower Gradient</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#1E1428; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(247,201,160,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to warp the bloom</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mixc(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function css(c){ return 'rgb('+Math.round(clamp(c[0],0,255))+','+Math.round(clamp(c[1],0,255))+','+Math.round(clamp(c[2],0,255))+')'; }
function hashN(x,y){ const n=Math.sin(x*127.1+y*311.7)*43758.5453123; return n-Math.floor(n); }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi; const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf); const a=hashN(xi,yi), b=hashN(xi+1,yi), c=hashN(xi,yi+1), d=hashN(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }

// No.101 Flower Gradient (after teknosis_sis): software shader route,
// field sampled on a reduced grid (FIELD_CELL px) and drawn full-frame,
// the No.81-84 pattern. Seeded constants: 4 metaballs, radii
// 0.27/0.30/0.28/0.31 in unit space around four seeded centres
// in a loose diamond, so the fused mass reads as a blossom,
// Lissajous rates (1,2),(2,1),
// (1,3),(3,2) over the 10s loop, warp noise seed offset (3.7, 9.1).
const FIELD_CELL=8;
const LOOP=10, SUPER=20;
const GROUND=hexRGB('#1E1428'), PLUM=hexRGB('#4A2B5A'), LILAC=hexRGB('#C9B8E8'), PEACH=hexRGB('#F7C9A0'), ROSE=hexRGB('#F2A7C3');
const RAMPC=[PLUM, LILAC, PEACH, ROSE]; // cyclic chromatic ramp, ground stays ground
const BALLS=[
  { r:0.27, cx:0.02, cy:-0.34, ax:0.12, ay:0.10, fx:1, fy:2, px:0.0, py:1.3 },
  { r:0.30, cx:-0.36, cy:0.02, ax:0.11, ay:0.13, fx:2, fy:1, px:2.1, py:0.4 },
  { r:0.28, cx:0.37, cy:0.06, ax:0.13, ay:0.11, fx:1, fy:3, px:4.0, py:2.6 },
  { r:0.31, cx:-0.03, cy:0.36, ax:0.10, ay:0.12, fx:3, fy:2, px:1.2, py:4.4 }
];
let warpX=0, warpY=0, dragging=false, sx=0, sy=0;

function rampCyc(x){ // cyclic sample over the 4 chromatic stops
  x=((x%1)+1)%1; const seg=x*4; const i=Math.floor(seg)%4; return mixc(RAMPC[i], RAMPC[(i+1)%4], seg-Math.floor(seg));
}
function ballsAt(t){
  const ph=2*Math.PI*t/LOOP;
  return BALLS.map(b=>[b.cx+b.ax*Math.sin(ph*b.fx+b.px), b.cy+b.ay*Math.sin(ph*b.fy+b.py), b.r]);
}
function fieldAt(u,v,t,bs){
  // domain warp: gentle noise flow, plus the fingertip warp while pressed
  const wob=0.10;
  const wx=vnoise(u*1.4+3.7+0.3*Math.sin(2*Math.PI*t/LOOP), v*1.4+9.1)*2-1;
  const wy=vnoise(u*1.4+8.2, v*1.4+2.9+0.3*Math.cos(2*Math.PI*t/LOOP))*2-1;
  const x=u+wx*wob+warpX*0.30, y=v+wy*wob+warpY*0.30;
  let f=0;
  for(let i=0;i<bs.length;i++){ const dx=x-bs[i][0], dy=y-bs[i][1]; f+=bs[i][2]*bs[i][2]/(dx*dx+dy*dy+0.012); }
  return f;
}
function shade(u,v,t,bs){
  const f=fieldAt(u,v,t,bs);
  const body=smooth((f-0.85)/0.85);              // 0 outside, 1 deep inside
  if(body<=0) {
    // deep ground, breathing almost imperceptibly toward plum at the halo
    const halo=smooth((f-0.45)/0.40)*0.35;
    return mixc(GROUND, PLUM, halo);
  }
  const shift=((t%SUPER)+SUPER)%SUPER/SUPER*0.55;  // palette rotation over the 20s super-cycle
  const warpN=vnoise(u*2.2+13.1, v*2.2+4.7)*0.22;
  const bigN=vnoise(u*1.1+6.3, v*1.1+11.8)*0.40-0.20;
  let pos=body*0.34 + (0.5-v*0.5)*0.20 + warpN + bigN + shift; // field + vertical gradient + domain-warped noise
  let col=rampCyc(pos*0.62);
  const rim=Math.exp(-Math.pow(f-1.05,2)/0.05);   // fresnel-like rim near the iso surface
  col=mixc(col, PEACH, rim*0.30*body);
  return mixc(GROUND, col, body);
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h); const t=nowMs/1000;
  if(!dragging){ warpX*=0.94; warpY*=0.94; }
  const bs=ballsAt(t);
  const cell=isPhone()?FIELD_CELL+2:FIELD_CELL, cols=Math.ceil(w/cell), rows=Math.ceil(h/cell), m=Math.min(w,h)/2;
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    const u=((i+0.5)*cell-w/2)/m, v=((j+0.5)*cell-h/2)/m;
    ctx.fillStyle=css(shade(u,v,t,bs)); ctx.fillRect(i*cell,j*cell,cell+1,cell+1);
  }
  console.assert(BALLS.length===4,'metaballs',BALLS.length);
  return {};
}
function ptr(e){ const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{left:0,top:0}; return [e.clientX-r.left, e.clientY-r.top]; }
canvas.addEventListener('pointerdown',e=>{ dragging=true; const p=ptr(e); sx=p[0]; sy=p[1]; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; const [w,h]=viewportWH(); const p=ptr(e); warpX=clamp((p[0]-sx)/(w*0.35),-1,1); warpY=clamp((p[1]-sy)/(h*0.35),-1,1); });
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(4600);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
