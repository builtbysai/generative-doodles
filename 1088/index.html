<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Conductor</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #F4F4F2;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
(function () {
  'use strict';

  // Frame one is a fixed phase: t = 30s, mid ring-formation hold,
  // orbs just past a heartbeat attack. The loop runs from there.
  var T0 = 30;
  var LOOP = 60;
  var WORLD = 1000;
  var canvas = document.getElementById('piece');
  var ctx = canvas.getContext('2d');
  var currentT = T0;
  var view = { w: 0, h: 0, dpr: 1, scale: 1, ox: 0, oy: 0, phone: false };

  var COLORS = {
    void: '#F4F4F2',
    frame: '#141418',
    orb: '#BFE3FF',
    figure: '#0B0B0C',
    glint: '#FFFFFF'
  };

  // The flock's centre: upper two-thirds of the void. The figure stands
  // below it and never moves; only the flock does.
  var FLOCK = { x: 500, y: 322 };
  var FIGURE = { x: 500, y: 838 };

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function hash(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function smooth(u) { return u * u * (3 - 2 * u); }

  function resize() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    }
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(vw * dpr));
    canvas.height = Math.max(1, Math.round(vh * dpr));
    var screenMin = 0;
    if (window.screen) screenMin = Math.min(window.screen.width || 0, window.screen.height || 0);
    var phone = screenMin > 0 ? screenMin < 700 : vh > vw * 1.15;
    var scale = Math.min(vw / WORLD, vh / WORLD);
    view = {
      w: vw,
      h: vh,
      dpr: dpr,
      scale: scale,
      ox: (vw - WORLD * scale) / 2,
      oy: (vh - WORLD * scale) / 2,
      phone: phone
    };
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(currentT); });
  }
  window.addEventListener('resize', function () { resize(); draw(currentT); });
  resize();

  // 12 drones, indexed as 3 columns x 2 rows of stacked pairs x 2 abreast
  // for the stack; the same index drives ring and spiral membership.
  var drones = [];
  (function buildDrones() {
    var i = 0;
    for (var col = 0; col < 3; col++) {
      for (var row = 0; row < 2; row++) {
        for (var pair = 0; pair < 2; pair++) {
          for (var side = 0; side < 2; side++) {
            drones.push({
              i: i,
              col: col,
              row: row * 2 + pair,
              side: side,
              p1: hash(i * 3 + 1) * Math.PI * 2,
              p2: hash(i * 5 + 2) * Math.PI * 2,
              f1: 0.5 + hash(i * 7 + 3) * 0.45,
              f2: 0.85 + hash(i * 11 + 4) * 0.6,
              amp: 2.0 + hash(i * 13 + 5) * 1.5
            });
            i++;
          }
        }
      }
    }
  })();

  // Formation offsets relative to the flock centre, one set per formation.
  function stackOffset(d) {
    return {
      x: (d.col - 1) * 178 + (d.side === 0 ? -27 : 27),
      y: (d.row - 1.5) * 104
    };
  }

  function ringOffset(d) {
    var a = (d.i / 12) * Math.PI * 2 - Math.PI / 2;
    return { x: Math.cos(a) * 178, y: Math.sin(a) * 168 };
  }

  function spiralOffset(d) {
    var a = d.i * 1.9 + 0.6;
    var r = 16 + d.i * 13.2;
    return { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.92 };
  }

  var FORMATIONS = [stackOffset, ringOffset, spiralOffset];

  // 60s loop: each formation holds 16s, then a 4s eased move into the next.
  // Returns the blended offset for a drone and the transition activity
  // (0 during holds, a 0..1..0 bump during moves) for the figure's arms.
  function formationState(d, t) {
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var seg = Math.floor(lt / 20);          // 0 stack, 1 ring, 2 spiral
    var inSeg = lt - seg * 20;
    var from = FORMATIONS[seg];
    if (inSeg < 16) {
      return { off: from(d), activity: 0 };
    }
    var u = (inSeg - 16) / 4;
    var to = FORMATIONS[(seg + 1) % 3];
    var a = from(d);
    var b = to(d);
    var s = smooth(u);
    return {
      off: { x: a.x + (b.x - a.x) * s, y: a.y + (b.y - a.y) * s },
      activity: Math.sin(Math.PI * u)
    };
  }

  // Shared heartbeat: 4s period, sharp attack, slow decay, a softer
  // second thump — the pulse every orb breathes on together.
  function heartbeat(t) {
    var ph = (((t % 4) + 4) % 4) / 4;
    var main = Math.exp(-ph * 5.5);
    var second = 0.38 * Math.exp(-Math.pow((ph - 0.24) * 9, 2));
    return main + second;
  }

  function dronePos(d, t) {
    var st = formationState(d, t);
    var jx = Math.sin(t * d.f1 + d.p1) * d.amp + Math.sin(t * 0.21 + d.p2) * 1.0;
    var jy = Math.cos(t * d.f2 + d.p2) * d.amp * 0.7 + Math.sin(t * 0.29 + d.p1) * 0.8;
    return {
      x: FLOCK.x + st.off.x + jx,
      y: FLOCK.y + st.off.y + jy,
      activity: st.activity
    };
  }

  function circle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawOrbGlow(x, y, beat) {
    var s = 1 + 0.22 * beat;
    ctx.fillStyle = COLORS.orb;
    ctx.globalAlpha = 0.10 + 0.05 * beat;
    circle(x, y, 17 * s);
    ctx.globalAlpha = 0.20 + 0.07 * beat;
    circle(x, y, 11.5 * s);
    ctx.globalAlpha = 0.34 + 0.10 * beat;
    circle(x, y, 7.5 * s);
    ctx.globalAlpha = 1;
  }

  function drawDrone(x, y) {
    ctx.strokeStyle = COLORS.frame;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // mast up to the orb riding on top
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y + 2);
    ctx.lineTo(x, y - 11);
    ctx.stroke();
    // skeletal X frame
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(x - 12, y - 4);
    ctx.lineTo(x + 12, y + 4);
    ctx.moveTo(x + 12, y - 4);
    ctx.lineTo(x - 12, y + 4);
    ctx.stroke();
    // propeller guards: rings at the four corners
    ctx.lineWidth = 1.6;
    var corners = [[-12, -6], [12, -6], [-12, 6], [12, 6]];
    for (var k = 0; k < 4; k++) {
      ctx.beginPath();
      ctx.arc(x + corners[k][0], y + corners[k][1], 4.6, 0, Math.PI * 2);
      ctx.stroke();
    }
    // centre plate
    ctx.fillStyle = COLORS.frame;
    ctx.fillRect(x - 4, y - 3, 8, 6);
    // marker glint: one white pinpoint on the frame
    ctx.fillStyle = COLORS.glint;
    ctx.globalAlpha = 0.95;
    circle(x, y, 1.4);
    ctx.globalAlpha = 1;
  }

  function drawOrbCore(x, y, beat) {
    ctx.fillStyle = COLORS.orb;
    ctx.globalAlpha = 1;
    circle(x, y, 4.8 * (1 + 0.13 * beat));
    ctx.fillStyle = COLORS.glint;
    ctx.globalAlpha = 0.9;
    circle(x, y, 1.9);
    ctx.globalAlpha = 1;
  }

  // The conductor: a small black silhouette, feet planted, arms raised.
  // The pose never changes except the arms, which lift slightly higher
  // while a formation change is under way — theatrical sync, not control.
  function drawFigure(activity) {
    var x = FIGURE.x;
    var y = FIGURE.y;
    ctx.fillStyle = COLORS.figure;
    ctx.strokeStyle = COLORS.figure;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // legs
    ctx.beginPath();
    ctx.moveTo(x - 3, y - 52);
    ctx.lineTo(x - 13, y);
    ctx.lineTo(x - 5, y);
    ctx.lineTo(x, y - 44);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 3, y - 52);
    ctx.lineTo(x + 5, y);
    ctx.lineTo(x + 13, y);
    ctx.lineTo(x, y - 44);
    ctx.closePath();
    ctx.fill();
    // torso
    ctx.beginPath();
    ctx.moveTo(x - 9, y - 86);
    ctx.lineTo(x + 9, y - 86);
    ctx.lineTo(x + 6, y - 44);
    ctx.lineTo(x - 6, y - 44);
    ctx.closePath();
    ctx.fill();
    // arms raised: shoulder at (x±7, y-82); hands lift with activity
    var hx = 34 - 7 * activity;
    var hy = -118 - 15 * activity;
    ctx.lineWidth = 6.5;
    ctx.beginPath();
    ctx.moveTo(x - 7, y - 82);
    ctx.lineTo(x - hx, y + hy);
    ctx.moveTo(x + 7, y - 82);
    ctx.lineTo(x + hx, y + hy);
    ctx.stroke();
    // head
    circle(x, y - 96, 8.5);
  }

  function draw(t) {
    currentT = t;
    canvas.style.width = view.w + 'px';
    canvas.style.height = view.h + 'px';
    ctx.setTransform(view.dpr || 1, 0, 0, view.dpr || 1, 0, 0);
    ctx.fillStyle = COLORS.void;
    ctx.fillRect(0, 0, view.w, view.h);
    ctx.translate(view.ox, view.oy);
    ctx.scale(view.scale, view.scale);

    var beat = heartbeat(t);
    var positions = drones.map(function (d) { return dronePos(d, t); });
    var activity = positions.length ? positions[0].activity : 0;
    var i;
    // glow pass: the orb light spilling into the white void
    for (i = 0; i < positions.length; i++) drawOrbGlow(positions[i].x, positions[i].y - 15, beat);
    // frames
    for (i = 0; i < positions.length; i++) drawDrone(positions[i].x, positions[i].y);
    // orb cores on top, crisp
    for (i = 0; i < positions.length; i++) drawOrbCore(positions[i].x, positions[i].y - 15, beat);
    drawFigure(activity);
  }

  function frame(ms) {
    var t = T0 + (typeof ms === 'number' && isFinite(ms) ? ms / 1000 : 0);
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  frame(0);
})();
</script>
</body>
</html>
