<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetic Rain</title>
<style>
  html, body { margin: 0; padding: 0; background: #06080C; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var seed = 1129;
  try {
    var m = /[?&]seed=(\d+)/.exec(location.search || '');
    if (m) seed = parseInt(m[1], 10);
  } catch (e) {}

  // ---------- palette ----------
  var VOID = '#06080C';
  var FLOOR = '#0D1117';
  var SHADOW = [74, 46, 22];            // #4A2E16
  var COPPER = [184, 115, 51];          // #B87333
  var SPEC = [255, 217, 160];           // #FFD9A0
  var ECHO = 'rgb(122,82,40)';          // #7A5228
  var SPOT = 'rgb(255,224,176)';        // #FFE0B0

  var BUCKETS = 26;
  var bucketColor = [];
  (function () {
    for (var b = 0; b < BUCKETS; b++) {
      var f = b / (BUCKETS - 1);        // 0 = lowest/darkest, 1 = highest/brightest
      var c;
      if (f < 0.5) {
        var g = f * 2;
        c = [SHADOW[0] + (COPPER[0] - SHADOW[0]) * g,
             SHADOW[1] + (COPPER[1] - SHADOW[1]) * g,
             SHADOW[2] + (COPPER[2] - SHADOW[2]) * g];
      } else {
        var g2 = (f - 0.5) * 2;
        c = [COPPER[0] + (SPEC[0] - COPPER[0]) * g2,
             COPPER[1] + (SPEC[1] - COPPER[1]) * g2,
             COPPER[2] + (SPEC[2] - COPPER[2]) * g2];
      }
      bucketColor.push('rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')');
    }
  })();

  // ---------- phone detection ----------
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var minScreen = Math.min(sw || 9999, sh || 9999);
  var isPhone = minScreen < 700 || (sh > sw * 1.15 && minScreen < 900);

  // ---------- the two fields ----------
  var COLS = isPhone ? 16 : 20;
  var ROWS = isPhone ? 22 : 30;
  var N = COLS * ROWS * 2;

  var dU = new Float32Array(N);   // global x across both fields, 0..1
  var du = new Float32Array(N);   // local x within its field, 0..1
  var dv = new Float32Array(N);   // depth: 0 = back, 1 = front
  (function () {
    var i = 0;
    for (var a = 0; a < 2; a++) {
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var u = COLS === 1 ? 0.5 : c / (COLS - 1);
          var v = ROWS === 1 ? 0.5 : r / (ROWS - 1);
          dU[i] = (a + u) / 2;
          du[i] = u;
          dv[i] = v;
          i++;
        }
      }
    }
  })();

  // per-frame scratch
  var sxA = new Float32Array(N);
  var syA = new Float32Array(N);
  var srA = new Float32Array(N);
  var shA = new Float32Array(N);   // final height, for the floor echoes
  var bucketLists = [];
  for (var b0 = 0; b0 < BUCKETS; b0++) bucketLists.push([]);

  var TAU = Math.PI * 2;
  function clampH(h) { return h < -1 ? -1 : h > 1 ? 1 : h; }
  function smooth(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }
  function distSeg(px, py, ax, ay, bx, by) {
    var abx = bx - ax, aby = by - ay;
    var tt = ((px - ax) * abx + (py - ay) * aby) / (abx * abx + aby * aby);
    if (tt < 0) tt = 0; else if (tt > 1) tt = 1;
    var dx = px - (ax + abx * tt), dy = py - (ay + aby * tt);
    return Math.sqrt(dx * dx + dy * dy);
  }

  // ---------- the shape masks ----------
  // Each returns a mask m in 0..1 over one field's local (u, v) space.
  // v is depth (0 back, 1 front); on screen the rows are compressed, so
  // round forms take a v-radius about 1.35x their u-radius.
  var P = null;   // choreography parameters, built by buildChoreo

  function maskBalloon(u, v, t) {
    var cy = 0.38 + 0.018 * Math.sin(0.45 * t + P.bobPh);
    var qx = (u - 0.5) / 0.30, qy = (v - cy) / 0.40;
    var q = qx * qx + qy * qy;
    var mm = q < 1 ? Math.sqrt(1 - q) : 0;         // dome: highest at the heart
    // basket
    if (Math.abs(u - 0.5) < 0.055 && v > 0.845 && v < 0.92) mm = Math.max(mm, 0.78);
    // rigging lines from the envelope's lower sides down to the basket
    var d1 = distSeg(u, v, 0.365, 0.715, 0.462, 0.847);
    var d2 = distSeg(u, v, 0.635, 0.715, 0.538, 0.847);
    var dr = Math.min(d1, d2);
    if (dr < 0.016) mm = Math.max(mm, 0.55 * (1 - dr / 0.016) + 0.2);
    return mm;
  }

  function triMask(u, v, ax, ay, bx, by, cx, cy) {
    // barycentric; soft inside mask from the smallest barycentric coord
    var d = (by - cy) * (ax - cx) + (cx - bx) * (ay - cy);
    if (d === 0) return 0;
    var l1 = ((by - cy) * (u - cx) + (cx - bx) * (v - cy)) / d;
    var l2 = ((cy - ay) * (u - cx) + (ax - cx) * (v - cy)) / d;
    var l3 = 1 - l1 - l2;
    var mn = Math.min(l1, Math.min(l2, l3));
    return smooth(mn / 0.16);
  }
  function maskAirplane(u, v, t) {
    // paper dart: two wings sharing a spine, nose up-right, slight bank
    var bank = 0.03 * Math.sin(0.4 * t + P.bankPh);
    var x = u - 0.5, y = v - 0.48;
    var cu = 0.5 + x * Math.cos(bank) - y * Math.sin(bank);
    var cv = 0.48 + x * Math.sin(bank) + y * Math.cos(bank);
    var w1 = triMask(cu, cv, 0.82, 0.24, 0.20, 0.50, 0.28, 0.13);
    var w2 = triMask(cu, cv, 0.82, 0.24, 0.20, 0.50, 0.33, 0.80);
    var mm = Math.max(w1, w2) * 0.88;
    var ds = distSeg(cu, cv, 0.82, 0.24, 0.20, 0.50);   // the fold ridge
    var ridge = Math.exp(-(ds * ds) / (2 * 0.035 * 0.035));
    return Math.max(mm, ridge);
  }

  function maskKite(u, v, t) {
    var l1 = Math.abs(u - 0.5) / 0.225 + Math.abs(v - 0.40) / 0.315;
    var mm = smooth((1.06 - l1) / 0.24);
    // tail: a swaying curve dropping from the diamond's bottom point,
    // with small bows along it
    var sway = 0.035 * Math.sin(0.8 * t + P.swayPh);
    var dmin = 1e9, dbow = 1e9;
    var px = 0.5, py = 0.715;
    for (var k = 1; k <= 8; k++) {
      var s = k / 8;
      var qx = 0.5 - 0.10 * s + 0.05 * Math.sin(s * Math.PI * 2 + sway * 3);
      var qy = 0.715 + 0.27 * s;
      var dd = distSeg(u, v, px, py, qx, qy);
      if (dd < dmin) dmin = dd;
      if (k === 3 || k === 5 || k === 7) {
        var bx = u - qx, by = v - qy;
        var db = Math.sqrt(bx * bx + by * by);
        if (db < dbow) dbow = db;
      }
      px = qx; py = qy;
    }
    mm = Math.max(mm, Math.exp(-(dmin * dmin) / (2 * 0.026 * 0.026)) * 0.8);
    mm = Math.max(mm, Math.exp(-(dbow * dbow) / (2 * 0.042 * 0.042)) * 0.85);
    return mm;
  }

  function maskFlock(u, v, t) {
    // a V of seven birds, apex leading at the left, each bird two
    // elongated wing gaussians whose angle flaps slowly
    var mm = 0;
    for (var j = 0; j < 4; j++) {
      for (var side = 0; side < 2; side++) {
        if (j === 0 && side === 1) continue;
        var bx = 0.22 + 0.155 * j + P.flockDx;
        var by = 0.50 + (side === 0 ? -1 : 1) * 0.125 * j + 0.012 * Math.sin(0.6 * t + j);
        var bdx = u - bx, bdy = v - by;
        var body = Math.exp(-((bdx / 0.032) * (bdx / 0.032) + (bdy / 0.032) * (bdy / 0.032))) * 0.9;
        if (body > mm) mm = body;
        var flap = 0.42 + 0.30 * Math.sin(1.9 * t + j * 0.9 + side * 0.6 + P.flapPh);
        for (var wng = 0; wng < 2; wng++) {
          var ang = (wng === 0 ? -1 : 1) * flap + (side === 0 ? -0.25 : 0.25);
          var ca = Math.cos(ang), sa = Math.sin(ang);
          var dx = u - (bx + (wng === 0 ? -0.05 : 0.05) * ca);
          var dy = v - (by + (wng === 0 ? -0.05 : 0.05) * sa);
          var lx = dx * ca + dy * sa, ly = -dx * sa + dy * ca;
          var e = (lx / 0.115) * (lx / 0.115) + (ly / 0.034) * (ly / 0.034);
          var g = Math.exp(-e);
          if (g > mm) mm = g;
        }
      }
    }
    return mm;
  }

  function maskDragon(u, v, t) {
    // a sine spine travelling slowly, segmented body, head at the front
    var ph = P.dragPh - 0.55 * t;
    var sv = 0.50 + 0.17 * Math.sin(TAU * 1.15 * u + ph);
    var d = Math.abs(v - sv);
    var taper = smooth(u / 0.13) * (1 - 0.30 * smooth((u - 0.80) / 0.20));
    var seg = 0.85 + 0.15 * Math.sin(TAU * 6 * u - 2.2 * t);
    var mm = Math.exp(-(d * d) / (2 * 0.072 * 0.072)) * taper * seg;
    var hx = 0.865, hy = 0.50 + 0.17 * Math.sin(TAU * 1.15 * hx + ph);
    var hdx = (u - hx) * 1.35, hdy = v - hy;
    var hg = Math.exp(-(hdx * hdx + hdy * hdy) / (2 * 0.095 * 0.095));
    return Math.max(mm, hg);
  }

  var MASKS = [maskAirplane, maskBalloon, maskKite, maskFlock, maskDragon];
  var BALLOON = 1;

  function shapeH(mm) {
    // deep shade outside the shape, near-specular at its heart
    return clampH(-0.55 + 1.62 * Math.pow(mm, 0.7));
  }

  // ---------- the choreography (reseedable shape order) ----------
  var choreoSeed = seed;
  function buildChoreo(s, balloonFirst) {
    var rnd = mulberry32((s * 7919 + 31) | 0);
    var order = [0, 1, 2, 3, 4];
    for (var k = order.length - 1; k > 0; k--) {
      var j = Math.floor(rnd() * (k + 1));
      var tmp = order[k]; order[k] = order[j]; order[j] = tmp;
    }
    if (balloonFirst) {
      var bi = order.indexOf(BALLOON);
      var t0 = order[0]; order[0] = BALLOON; order[bi] = t0;
    }
    P = {
      order: order,
      bobPh: rnd() * TAU,
      bankPh: rnd() * TAU,
      swayPh: rnd() * TAU,
      flapPh: rnd() * TAU,
      dragPh: rnd() * TAU,
      flockDx: (rnd() - 0.5) * 0.05,
      ripW1: 1.7 + rnd() * 0.5,
      ripW2: 1.2 + rnd() * 0.5,
      ripPh: rnd() * TAU
    };
  }
  buildChoreo(choreoSeed, true);

  // phrases of ~36 s in a 3-minute cycle (the real cycle is 15 minutes),
  // crossfading over the last 6 s of each phrase; ripples run throughout
  var LOOP = 180, SEG = LOOP / 5, FADE = 6;
  function heightAt(i, t) {
    var cyc = t % LOOP;
    var seg = Math.floor(cyc / SEG);
    var ft = cyc - seg * SEG;
    var u = du[i], v = dv[i];
    var mm = MASKS[P.order[seg]](u, v, t);
    if (ft > SEG - FADE) {
      var w = smooth((ft - (SEG - FADE)) / FADE);
      mm = mm + (MASKS[P.order[(seg + 1) % 5]](u, v, t) - mm) * w;
    }
    var h = shapeH(mm);
    var ripAmp = 1 - 0.55 * mm;   // ripples run in the quiet field, not over the shape
    h += ripAmp * (0.09 * Math.sin(TAU * (1.4 * dU[i] + 0.9 * v) - P.ripW1 * t + P.ripPh)
                 + 0.06 * Math.sin(TAU * (2.2 * v - 1.3 * dU[i]) + P.ripW2 * t));
    return clampH(h);
  }

  // ---------- drag disturbance: recorded impulses, closed-form spring response ----------
  var impulses = [];   // {x, y, t, s} in pixels / piece-seconds
  function impulseResponse(i, t) {
    if (!impulses.length) return 0;
    var add = 0;
    var sig2 = 2 * Math.pow(Math.min(W, H) * 0.15, 2);
    for (var k = 0; k < impulses.length; k++) {
      var im = impulses[k];
      var tau = t - im.t;
      if (tau < 0 || tau > 3) continue;
      var dx = sxA[i] - im.x, dy = syA[i] - im.y;
      var fall = Math.exp(-(dx * dx + dy * dy) / sig2);
      if (fall < 0.01) continue;
      add += im.s * fall * Math.exp(-2.3 * tau) * Math.sin(TAU * tau / 0.85);
    }
    return add;
  }

  // ---------- view / canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }
  function fit() {
    W = viewW(); H = viewH();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  var T0 = 15.0;   // fixed first-frame phase: mid-hold of the balloon phrase

  function draw(t) {
    fit();
    ctx.fillStyle = VOID;
    ctx.fillRect(0, 0, W, H);

    var floorTop = H * 0.695;
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, floorTop, W, H - floorTop);

    var gap = W * 0.03;
    var aw = (W - gap) / 2;
    var px = Math.min(W, H) / 720;
    if (px < 0.8) px = 0.8; else if (px > 1.6) px = 1.6;

    var b, i;
    for (b = 0; b < BUCKETS; b++) bucketLists[b].length = 0;

    for (i = 0; i < N; i++) {
      var a = dU[i] < 0.5 ? 0 : 1;
      var x0 = a * (aw + gap);
      var x = x0 + du[i] * aw;
      var v = dv[i];
      var baseY = H * (0.10 + 0.56 * Math.pow(v, 1.25));
      sxA[i] = x;
      syA[i] = baseY;
      var h = heightAt(i, t) + impulseResponse(i, t);
      if (h > 1.15) h = 1.15; else if (h < -1.15) h = -1.15;
      shA[i] = h;
      syA[i] = baseY - h * H * (0.10 + 0.06 * v);
      srA[i] = (1.7 + 2.1 * v) * px;
      var bi = Math.round((0.5 + 0.5 * h) * (BUCKETS - 1));
      if (bi < 0) bi = 0; else if (bi >= BUCKETS) bi = bi >= BUCKETS ? BUCKETS - 1 : bi;
      bucketLists[bi].push(i);
    }

    // warm spotlight pools breathing on the floor (flat layered shapes)
    var breathe = 0.85 + 0.15 * Math.sin(0.35 * t);
    ctx.fillStyle = SPOT;
    var pools = [0.25, 0.75];
    for (var pI = 0; pI < 2; pI++) {
      ctx.globalAlpha = 0.026 * breathe;
      ctx.beginPath(); ctx.arc(W * pools[pI], H * 0.90, W * 0.19, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.018 * breathe;
      ctx.beginPath(); ctx.arc(W * pools[pI], H * 0.90, W * 0.125, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // the droplets' shadows on the floor, doubling the image:
    // batched by height tertile under 'lighter', two soft layers,
    // plus a warm core for the highest droplets
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = ECHO;
    var tert = [[-1.15, -0.1, 0.030, 0.85], [-0.1, 0.45, 0.050, 1.0], [0.45, 1.16, 0.075, 1.2]];
    for (var q = 0; q < 3; q++) {
      for (var layer = 0; layer < 2; layer++) {
        ctx.globalAlpha = tert[q][2] * (layer === 0 ? 1 : 0.7);
        var rr = tert[q][3] * (layer === 0 ? 1.5 : 0.85);
        ctx.beginPath();
        for (i = 0; i < N; i++) {
          var hh = shA[i];
          if (hh < tert[q][0] || hh >= tert[q][1]) continue;
          var ex = sxA[i];
          var ey = floorTop + H * 0.035 + (1 - dv[i]) * H * 0.20 + hh * H * 0.016;
          var er = srA[i] * rr;
          ctx.moveTo(ex + er, ey);
          ctx.arc(ex, ey, er, 0, TAU);
        }
        ctx.fill();
      }
    }
    ctx.fillStyle = SPOT;
    ctx.globalAlpha = 0.045;
    ctx.beginPath();
    for (i = 0; i < N; i++) {
      if (shA[i] < 0.45) continue;
      var ex2 = sxA[i];
      var ey2 = floorTop + H * 0.035 + (1 - dv[i]) * H * 0.20 + shA[i] * H * 0.016;
      var er2 = srA[i] * 0.6;
      ctx.moveTo(ex2 + er2, ey2);
      ctx.arc(ex2, ey2, er2, 0, TAU);
    }
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // droplets, batched by brightness bucket (paired arcs, moveTo first)
    for (b = 0; b < BUCKETS; b++) {
      var list = bucketLists[b];
      if (!list.length) continue;
      ctx.fillStyle = bucketColor[b];
      ctx.beginPath();
      for (var j = 0; j < list.length; j++) {
        i = list[j];
        ctx.moveTo(sxA[i] + srA[i] * 0.86, syA[i] - srA[i] * 0.28);
        ctx.arc(sxA[i], syA[i] - srA[i] * 0.28, srA[i] * 0.86, 0, TAU);
        ctx.moveTo(sxA[i] + srA[i] * 0.62, syA[i] + srA[i] * 0.55);
        ctx.arc(sxA[i], syA[i] + srA[i] * 0.55, srA[i] * 0.62, 0, TAU);
      }
      ctx.fill();
    }
  }

  // ---------- interaction: drag disturbs, double-tap reseeds the shape order ----------
  var lastT = T0;
  var dragging = false, lastX = 0, lastY = 0, lastTap = 0;

  function pushImpulse(x, y, dy) {
    var s = dy / 26;
    if (s > 1) s = 1; else if (s < -1) s = -1;
    if (Math.abs(s) < 0.25) s = dy === 0 ? 0.35 : 0.25 * Math.sign(dy);
    impulses.push({ x: x, y: y, t: lastT, s: s });
    if (impulses.length > 24) impulses.splice(0, impulses.length - 24);
    for (var k = impulses.length - 1; k >= 0; k--) {
      if (lastT - impulses[k].t > 3.2) impulses.splice(k, 1);
    }
  }
  function reseed() {
    choreoSeed += 1;
    buildChoreo(choreoSeed, false);
  }
  function onDown(e) {
    if (!e) return;
    dragging = true;
    lastX = e.clientX || 0; lastY = e.clientY || 0;
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (now && now - lastTap < 320) reseed();
    lastTap = now;
    pushImpulse(lastX, lastY, 10);
  }
  function onMove(e) {
    if (!dragging || !e) return;
    var x = e.clientX || 0, y = e.clientY || 0;
    var dx = x - lastX, dy = y - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 6) pushImpulse(x, y, dy);
    lastX = x; lastY = y;
  }
  function onUp() { dragging = false; }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('dblclick', reseed);
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  draw(T0);

  var startStamp = null;
  function frame(stamp) {
    if (startStamp === null) startStamp = stamp;
    var t = T0 + (stamp - startStamp) / 1000;
    lastT = t;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
