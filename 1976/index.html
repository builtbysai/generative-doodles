<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1976 The Zenith Body</title>
<style>
  html, body { margin: 0; padding: 0; background: #06110c; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1976 The Zenith Body, CR1 / PP1223, study #258 ciara-reddy.
  // A figure lies inside a living element: green algae water,
  // foam-ringed dark water, a textured field of seaweed. The
  // camera hangs at the zenith, perfectly vertical, and the
  // figure looks straight up into it. The element moves around
  // the body: foam swirls drift, water glitters, the green field
  // breathes. The figure does not pose; it holds. Once per cycle
  // the photographer's shadow crosses the lower frame, the
  // signature that the camera is inside the scene. Drag to tilt
  // the camera a few degrees off the zenith; the figure's gaze
  // follows the lens and the element's parallax shifts, and the
  // system always settles back to dead vertical on release.
  var GROUND = '#06110c'; // page ground, deep green-black water
  var FOAM = '#f2f5ee';   // milk-white foam
  var SKIN = '#d9a583';
  var SKIND = '#b57f5e';
  var HAIR = '#1c1712';
  var GLITTER = '#fff6d8';
  var GARMENT_EARLY = '#33473a'; // dark green-grey, before the late register
  var GARMENT_LATE = '#a42422';  // one red garment, the late register

  // Fixed-phase first frame: FIRST_T = 10 s. The cycle is 60 s:
  // the field breathes and foam drifts throughout; the red
  // register arrives late (p 40-48); the photographer's shadow
  // crosses the lower frame once per cycle (p 42-54). At t = 10
  // the garment is still dark, no shadow is present, and the
  // foam ring around the figure is mid breath.
  var FIRST_T = 10;
  var CYCLE = 60;
  var SEED = 1976;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x) {
    var i = Math.floor(x), f = x - i;
    var u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // Camera tilt in degrees. Drag sets the target (max about 4
  // degrees off the zenith); on release the target returns to
  // zero and the spring settles the camera back to dead
  // vertical. The figure's gaze and the element's parallax
  // both follow the current tilt.
  var tiltX = 0, tiltY = 0, tiltTX = 0, tiltTY = 0;
  var dragging = false;
  var downX = 0, downY = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgbA(r, g, b, a) {
    return 'rgba(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ',' + a4(a) + ')';
  }
  function mix3(c1, c2, k) {
    return [lerp(c1[0], c2[0], k), lerp(c1[1], c2[1], k), lerp(c1[2], c2[2], k)];
  }
  var GARMENT_EARLY_RGB = [51, 71, 58];
  var GARMENT_LATE_RGB = [164, 36, 34];

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.fsDate = Math.round(clamp(W * 0.016, 10, 13));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Precomputed field, all unit coordinates, seeded --------
  var rng = mulberry32(SEED);
  var BLOBS = [];   // slow water texture: soft green light and dark pools
  var i, j;
  for (i = 0; i < 64; i++) {
    BLOBS.push({
      u: rng(), v: rng(), r: 0.03 + rng() * 0.09,
      light: rng() < 0.5, ph: rng() * Math.PI * 2,
      drift: 0.004 + rng() * 0.010
    });
  }
  var WEEDS = [];   // seaweed strands, rooted, swaying
  for (i = 0; i < 46; i++) {
    var wu = rng(), wv = rng();
    // Keep the figure's clearing free of weed roots.
    var du = wu - 0.5, dv = wv - 0.52;
    if (du * du + dv * dv < 0.045) { wu = 0.06 + rng() * 0.88; wv = 0.05 + rng() * 0.9; }
    WEEDS.push({
      u: wu, v: wv, len: 0.05 + rng() * 0.11, segs: 5 + Math.floor(rng() * 4),
      ph: rng() * Math.PI * 2, sway: 0.006 + rng() * 0.014,
      wdt: 1.2 + rng() * 2.4, tone: rng()
    });
  }
  var FOAMS = [];   // drifting foam swirls, partial rings
  for (i = 0; i < 16; i++) {
    var fu = rng(), fv = rng();
    var fdu = fu - 0.5, fdv = fv - 0.52;
    if (fdu * fdu + fdv * fdv < 0.030) { fu = 0.08 + rng() * 0.84; fv = 0.06 + rng() * 0.88; }
    FOAMS.push({
      u: fu, v: fv, r: 0.012 + rng() * 0.030,
      a0: rng() * Math.PI * 2, span: 1.2 + rng() * 3.4,
      ph: rng() * Math.PI * 2, spin: (rng() - 0.5) * 0.05,
      drift: 0.003 + rng() * 0.008, al: 0.25 + rng() * 0.45
    });
  }
  var GLINTS = [];  // sun glitter on the water
  for (i = 0; i < 150; i++) {
    GLINTS.push({
      u: rng(), v: rng(), r: 0.8 + rng() * 1.8,
      ph: rng() * Math.PI * 2, rate: 0.5 + rng() * 1.1,
      al: 0.25 + rng() * 0.55
    });
  }
  var FDOTS = [];   // foam dots riding the figure's ring
  for (i = 0; i < 26; i++) {
    FDOTS.push({ ang: (i / 26) * Math.PI * 2 + rng() * 0.2, rr: 0.9 + rng() * 0.25, r: 1 + rng() * 2.2, al: 0.3 + rng() * 0.5 });
  }

  // ---- Cycle ---------------------------------------------------
  // p 0-60. Red register: garment turns red over p 40-48.
  // Photographer's shadow: crosses the lower frame p 42-54.
  // Breathing: the whole field swells on a slow sine.
  function cycleState(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    var red = smooth((p - 40) / 8);
    var sh = 0, shX = 0;
    if (p >= 42 && p <= 54) {
      var s = (p - 42) / 12;
      sh = Math.sin(Math.PI * s);
      shX = lerp(-0.35, 1.35, s);
    }
    var breathe = 0.5 + 0.5 * Math.sin(t * 0.21);
    return { p: p, red: red, shadow: sh, shadowX: shX, breathe: breathe };
  }

  // ---- Water ---------------------------------------------------
  function drawWater(t, cs) {
    var k;
    // Base: vertical bands of deep green-black.
    var bands = 18;
    for (k = 0; k < bands; k++) {
      var by0 = (H / bands) * k;
      var bh = H / bands + 1;
      var v = 0.5 + 0.5 * Math.sin(k * 0.7 + t * 0.03);
      var g = 13 + v * 9 + cs.breathe * 3;
      ctx.fillStyle = 'rgb(5,' + Math.round(g + 4) + ',' + Math.round(g * 0.8) + ')';
      ctx.fillRect(0, by0, W, bh);
    }
    // Soft pools of lighter and darker water, drifting slowly.
    for (k = 0; k < BLOBS.length; k++) {
      var b = BLOBS[k];
      var bx = (b.u + Math.sin(t * b.drift + b.ph) * 0.02) * W;
      var by = (b.v + Math.cos(t * b.drift * 0.8 + b.ph) * 0.02) * H;
      var br = b.r * W * (1 + 0.08 * Math.sin(t * 0.1 + b.ph));
      ctx.fillStyle = b.light
        ? rgbA(38, 84, 58, 0.10 + cs.breathe * 0.05)
        : rgbA(2, 8, 5, 0.16);
      ctx.beginPath();
      ctx.moveTo(bx + br, by);
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWeeds(t, cs) {
    var k, s;
    for (k = 0; k < WEEDS.length; k++) {
      var wd = WEEDS[k];
      var bx = wd.u * W, by = wd.v * H;
      var len = wd.len * H * (1 + 0.05 * cs.breathe);
      var tone = wd.tone;
      ctx.strokeStyle = tone < 0.5
        ? rgbA(16, 46, 28, 0.75)
        : rgbA(28, 66, 40, 0.7);
      ctx.lineWidth = Math.max(1, wd.wdt * W / 720);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bx, by);
      for (s = 1; s <= wd.segs; s++) {
        var f = s / wd.segs;
        var px = bx + Math.sin(t * 0.25 + wd.ph + s * 0.7) * wd.sway * W * f * 6;
        var py = by - len * f;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
      // A pale tip on some strands.
      if (tone > 0.8) {
        var tx = bx + Math.sin(t * 0.25 + wd.ph + wd.segs * 0.7) * wd.sway * W * 6;
        var ty = by - len;
        ctx.fillStyle = rgbA(120, 160, 110, 0.5);
        ctx.beginPath();
        ctx.moveTo(tx + 2, ty);
        ctx.arc(tx, ty, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawFoam(t, cs) {
    var k;
    for (k = 0; k < FOAMS.length; k++) {
      var f = FOAMS[k];
      var fx = (f.u + Math.sin(t * f.drift + f.ph) * 0.03) * W;
      var fy = (f.v + Math.cos(t * f.drift * 0.9 + f.ph) * 0.03) * H;
      var fr = f.r * W * (1 + 0.10 * Math.sin(t * 0.18 + f.ph));
      var a0 = f.a0 + t * f.spin;
      ctx.strokeStyle = rgbA(242, 245, 238, f.al * (0.7 + 0.3 * cs.breathe));
      ctx.lineWidth = Math.max(1, W * 0.0022);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(fx + Math.cos(a0) * fr, fy + Math.sin(a0) * fr);
      ctx.arc(fx, fy, fr, a0, a0 + f.span);
      ctx.stroke();
      // A few foam dots trailing the ring.
      var d;
      for (d = 0; d < 3; d++) {
        var da = a0 + f.span + 0.25 + d * 0.35;
        var dx = fx + Math.cos(da) * fr * 1.05;
        var dy = fy + Math.sin(da) * fr * 1.05;
        var dr = Math.max(0.8, W * 0.0018 + d * 0.4);
        ctx.fillStyle = rgbA(242, 245, 238, f.al * 0.6);
        ctx.beginPath();
        ctx.moveTo(dx + dr, dy);
        ctx.arc(dx, dy, dr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawGlints(t) {
    var k;
    for (k = 0; k < GLINTS.length; k++) {
      var g = GLINTS[k];
      var tw = Math.sin(t * g.rate + g.ph);
      var al = g.al * Math.pow(Math.max(0, tw), 3);
      if (al < 0.03) { continue; }
      var gx = g.u * W, gy = g.v * H;
      var gr = g.r * W / 720;
      ctx.fillStyle = rgbA(255, 246, 216, al);
      ctx.beginPath();
      ctx.moveTo(gx + gr, gy);
      ctx.arc(gx, gy, gr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Figure --------------------------------------------------
  // Lying flat, seen from directly above: head at the top,
  // torso in the garment, arms at the sides, legs together.
  // The figure is small against the element.
  function drawFigure(t, cs, px, py) {
    var u = W / 720; // scale unit
    var cx = W * 0.5 + px, cy = H * 0.52 + py;
    var headR = W * 0.042;
    var headY = cy - H * 0.115;
    var breathe = 1 + 0.015 * Math.sin(t * 0.21); // the chest rises, barely

    // Foam ring around the body, breathing with the field.
    var ringR = W * 0.155 * (1 + 0.05 * Math.sin(t * 0.21));
    ctx.strokeStyle = rgbA(242, 245, 238, 0.75);
    ctx.lineWidth = Math.max(1.2, W * 0.003);
    ctx.lineCap = 'round';
    ctx.beginPath();
    var ra0 = 0.4 + t * 0.02;
    ctx.moveTo(cx + Math.cos(ra0) * ringR, cy + Math.sin(ra0) * ringR);
    ctx.arc(cx, cy, ringR, ra0, ra0 + Math.PI * 1.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ra0 + Math.PI) * ringR, cy + Math.sin(ra0 + Math.PI) * ringR);
    ctx.arc(cx, cy, ringR, ra0 + Math.PI, ra0 + Math.PI * 1.42);
    ctx.stroke();
    var fd;
    for (fd = 0; fd < FDOTS.length; fd++) {
      var fdot = FDOTS[fd];
      var fa = fdot.ang + t * 0.02;
      var fx = cx + Math.cos(fa) * ringR * fdot.rr;
      var fy = cy + Math.sin(fa) * ringR * fdot.rr;
      var fr = fdot.r * u;
      ctx.fillStyle = rgbA(242, 245, 238, fdot.al);
      ctx.beginPath();
      ctx.moveTo(fx + fr, fy);
      ctx.arc(fx, fy, fr, 0, Math.PI * 2);
      ctx.fill();
    }

    // Hair fanning in the water around the head.
    var hs;
    ctx.strokeStyle = rgbA(28, 23, 18, 0.85);
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (hs = 0; hs < 9; hs++) {
      var ha = Math.PI * (0.08 + hs * 0.105);
      var hx0 = cx + Math.cos(ha) * headR * 0.9;
      var hy0 = headY + Math.sin(ha) * headR * 0.9;
      var hx1 = cx + Math.cos(ha) * headR * (1.7 + 0.3 * Math.sin(t * 0.3 + hs));
      var hy1 = headY + Math.sin(ha) * headR * (1.7 + 0.3 * Math.sin(t * 0.3 + hs)) - headR * 0.2;
      ctx.moveTo(hx0, hy0);
      ctx.lineTo(hx1, hy1);
    }
    ctx.stroke();

    // Legs, together, skin.
    ctx.fillStyle = SKIN;
    roundCapsule(cx, cy + H * 0.055, W * 0.030, H * 0.085);
    // Feet.
    ctx.fillStyle = SKIND;
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.026 + W * 0.008, cy + H * 0.140);
    ctx.arc(cx - W * 0.016, cy + H * 0.140, W * 0.008, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.026 + W * 0.008, cy + H * 0.140);
    ctx.arc(cx + W * 0.016, cy + H * 0.140, W * 0.008, 0, Math.PI * 2);
    ctx.fill();

    // Torso in the garment: dark green-grey early, red in the
    // late register. Slight breathing swell.
    var gc = mix3(GARMENT_EARLY_RGB, GARMENT_LATE_RGB, cs.red);
    ctx.fillStyle = rgbA(gc[0], gc[1], gc[2], 1);
    roundCapsule(cx, cy - H * 0.008, W * 0.041 * breathe, H * 0.072 * breathe);

    // Arms at the sides, skin, palms open.
    ctx.fillStyle = SKIN;
    roundCapsule(cx - W * 0.052, cy - H * 0.005, W * 0.014, H * 0.055);
    roundCapsule(cx + W * 0.052, cy - H * 0.005, W * 0.014, H * 0.055);

    // Neck and head, skin, looking straight up at the camera.
    ctx.fillStyle = SKIN;
    ctx.fillRect(cx - W * 0.012, headY + headR * 0.7, W * 0.024, H * 0.018);
    ctx.beginPath();
    ctx.moveTo(cx + headR, headY);
    ctx.arc(cx, headY, headR, 0, Math.PI * 2);
    ctx.fill();

    // Face: the gaze follows the lens. Pupils shift with the
    // current tilt, so the eyes track the camera as it moves
    // off the zenith and settle back with it.
    var gazeX = tiltX * 1.6, gazeY = tiltY * 1.6;
    var eyeDX = W * 0.016, eyeDY = -headR * 0.12;
    var e;
    for (e = -1; e <= 1; e += 2) {
      var ex = cx + e * eyeDX, ey = headY + eyeDY;
      ctx.fillStyle = 'rgba(245,240,230,0.95)';
      ctx.beginPath();
      ctx.moveTo(ex + W * 0.006, ey);
      ctx.arc(ex, ey, W * 0.006, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#241a12';
      ctx.beginPath();
      ctx.moveTo(ex + gazeX + W * 0.003, ey + gazeY);
      ctx.arc(ex + gazeX, ey + gazeY, W * 0.003, 0, Math.PI * 2);
      ctx.fill();
    }
    // Brows, nose, lips: small marks, never a pose.
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = Math.max(1, W * 0.0016);
    ctx.beginPath();
    ctx.moveTo(cx - eyeDX - W * 0.007, headY + eyeDY - headR * 0.28);
    ctx.lineTo(cx - eyeDX + W * 0.007, headY + eyeDY - headR * 0.28);
    ctx.moveTo(cx + eyeDX - W * 0.007, headY + eyeDY - headR * 0.28);
    ctx.lineTo(cx + eyeDX + W * 0.007, headY + eyeDY - headR * 0.28);
    ctx.moveTo(cx, headY + headR * 0.05);
    ctx.lineTo(cx, headY + headR * 0.28);
    ctx.stroke();
    ctx.strokeStyle = rgbA(150, 70, 60, 0.9);
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.008, headY + headR * 0.48);
    ctx.lineTo(cx + W * 0.008, headY + headR * 0.48);
    ctx.stroke();
  }

  // Vertical capsule centered at (cx, cy) with half-width hw
  // and half-height hh, drawn as a rounded rectangle.
  function roundCapsule(cx, cy, hw, hh) {
    var r = Math.min(hw, hh);
    ctx.beginPath();
    ctx.moveTo(cx - hw + r, cy - hh);
    ctx.lineTo(cx + hw - r, cy - hh);
    ctx.arc(cx + hw - r, cy - hh + r, r, -Math.PI / 2, 0);
    ctx.lineTo(cx + hw, cy + hh - r);
    ctx.arc(cx + hw - r, cy + hh - r, r, 0, Math.PI / 2);
    ctx.lineTo(cx - hw + r, cy + hh);
    ctx.arc(cx - hw + r, cy + hh - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(cx - hw, cy - hh + r);
    ctx.arc(cx - hw + r, cy - hh + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
    ctx.fill();
  }

  // ---- Photographer's shadow ----------------------------------
  // Once per cycle the shadow of the overhead rig crosses the
  // lower frame: a soft dark band with the camera body and
  // three tripod legs. It stays in the bottom fifth, so it
  // never covers the face.
  function drawShadow(cs) {
    if (cs.shadow <= 0) { return; }
    var al = cs.shadow * 0.36;
    var sx = cs.shadowX * W;
    var top = H * 0.80;
    // Soft-edged band: horizontal gradient so the shadow has no
    // hard vertical sides, fading in from the left and right.
    var hg = ctx.createLinearGradient(sx - W * 0.24, 0, sx + W * 0.24, 0);
    hg.addColorStop(0, rgbA(0, 0, 0, 0));
    hg.addColorStop(0.25, rgbA(0, 0, 0, al));
    hg.addColorStop(0.75, rgbA(0, 0, 0, al));
    hg.addColorStop(1, rgbA(0, 0, 0, 0));
    ctx.fillStyle = hg;
    ctx.fillRect(sx - W * 0.24, top, W * 0.48, H - top);
    // Feather the band's top edge back into the water.
    var vg = ctx.createLinearGradient(0, top - 2, 0, top + H * 0.045);
    vg.addColorStop(0, rgbA(6, 17, 12, 1));
    vg.addColorStop(1, rgbA(6, 17, 12, 0));
    ctx.fillStyle = vg;
    ctx.fillRect(sx - W * 0.24, top - 2, W * 0.48, H * 0.045 + 2);
    // Camera body silhouette riding the band.
    ctx.fillStyle = rgbA(0, 0, 0, al * 0.9);
    ctx.fillRect(sx - W * 0.055, top - H * 0.035, W * 0.11, H * 0.045);
    ctx.fillRect(sx - W * 0.012, top - H * 0.055, W * 0.024, H * 0.022);
    // Tripod legs reaching up out of the band.
    ctx.strokeStyle = rgbA(0, 0, 0, al * 0.8);
    ctx.lineWidth = Math.max(2, W * 0.004);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx - W * 0.04, top);
    ctx.lineTo(sx - W * 0.13, top - H * 0.14);
    ctx.moveTo(sx + W * 0.04, top);
    ctx.lineTo(sx + W * 0.13, top - H * 0.14);
    ctx.moveTo(sx, top);
    ctx.lineTo(sx, top - H * 0.15);
    ctx.stroke();
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var cs = cycleState(t);

    // Ground is the deep water itself.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Parallax: the element shifts against the tilt, the
    // figure shifts less, so the camera feels like a hand
    // adjusting a tripod rather than an orbit.
    var px = -tiltX * 2.2, py = -tiltY * 2.2;
    ctx.save();
    ctx.translate(px, py);
    drawWater(t, cs);
    drawWeeds(t, cs);
    ctx.restore();

    ctx.save();
    ctx.translate(-tiltX * 1.2, -tiltY * 1.2);
    drawFoam(t, cs);
    drawGlints(t);
    ctx.restore();

    drawFigure(t, cs, tiltX * 1.4, tiltY * 1.4);
    drawShadow(cs);

    // Caption, top left, with the gallery date; hint, bottom center.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgbA(242, 245, 238, 0.85);
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1976 · The Zenith Body', W * 0.04, H * 0.055);
    ctx.fillStyle = rgbA(242, 245, 238, 0.6);
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2007 · 06 · 10', W * 0.04, H * 0.055 + L.fsDate + 5);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgbA(242, 245, 238, 0.9);
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to tilt the camera.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Drag tilts the camera off the zenith; release lets the
  // spring settle it back to dead vertical. Pointer only,
  // never a click to reload.
  function tiltFromDrag(dx, dy) {
    tiltTX = clamp(dx / W * 9, -4, 4);
    tiltTY = clamp(dy / H * 9, -4, 4);
  }
  function onDown(e) {
    dragging = true;
    downX = (e && typeof e.clientX === 'number') ? e.clientX : 0;
    downY = (e && typeof e.clientY === 'number') ? e.clientY : 0;
    if (reduced) { draw(lastT); }
  }
  function onMove(e) {
    if (!dragging) { return; }
    var x = (e && typeof e.clientX === 'number') ? e.clientX : downX;
    var y = (e && typeof e.clientY === 'number') ? e.clientY : downY;
    tiltFromDrag(x - downX, y - downY);
    if (reduced) {
      tiltX = tiltTX; tiltY = tiltTY;
      draw(lastT);
    }
  }
  function onUp() {
    dragging = false;
    tiltTX = 0; tiltTY = 0;
    if (reduced) {
      tiltX = 0; tiltY = 0;
      draw(lastT);
    }
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('pointerleave', onUp);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1976 exposes the cycle state and the tilt.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1976 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return cycleState(t); },
      tilt: function () { return { x: tiltX, y: tiltY, tx: tiltTX, ty: tiltTY }; },
      setTilt: function (x, y) { tiltTX = x; tiltTY = y; tiltX = x; tiltY = y; draw(lastT); },
      release: function () { tiltTX = 0; tiltTY = 0; tiltX = 0; tiltY = 0; draw(lastT); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the field breathes, foam drifts, glitter
  // twinkles, the red register arrives late, and once per
  // cycle the photographer's shadow crosses the lower frame.
  // The tilt spring eases back to dead vertical on release.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var prevNow = start;
    var loop = function (now) {
      var dt = (now - prevNow) / 1000;
      prevNow = now;
      if (dt < 0) { dt = 0; }
      if (dt > 0.25) { dt = 0.25; }
      var k = Math.min(1, dt * 5);
      tiltX += (tiltTX - tiltX) * k;
      tiltY += (tiltTY - tiltY) * k;
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
