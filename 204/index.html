<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.204 Heat Gun</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#07090B; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.204 Heat Gun (Asia Ward). Sammy's smaller cousin: a creature
// built entirely of transparent recycled plastic sheet, heat
// welded along every edge, stretched over a darker inner body you
// can read through the skin, segmented tail, leg pairs, eyestalks.
// It drifts as if suspended in water on a twenty five second sway.
// Your drag is the heat gun: the membrane softens toward your
// finger, bulges and stretches, and cools back to shape over about
// eight seconds once you let go, while the inner body springs back
// faster, so the skin pulls tight over the anatomy again. Double
// tap deals another shape from the sheet: shrimp, a round
// tardigrade-ish blob, or a long leggy one.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#07090B';
var MEMB = 'rgba(159,184,196,0.45)', SEAM = 'rgba(228,241,246,0.8)';
var INNER = '#1E3A44', LEG = '#2E5A66', STALK = '#3E7A8C';
var W = 0, H = 0, phone = false;
var seed = 204204;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// ---- creature shapes: a spine, a width profile, legs -------------------------
// Local space: x along the body from -1 (tail) to 1 (head), y across.
var SHAPES = [
  { name: 'shrimp', curve: 0.30, widths: [0.05, 0.13, 0.185, 0.215, 0.225, 0.21, 0.185, 0.155, 0.14], legs: 6, stalks: true, fan: true },
  { name: 'round', curve: 0.06, widths: [0.16, 0.235, 0.275, 0.285, 0.275, 0.24, 0.20, 0.165, 0.15], legs: 8, stalks: false, fan: false },
  { name: 'leggy', curve: 0.14, widths: [0.07, 0.105, 0.125, 0.13, 0.125, 0.115, 0.10, 0.09, 0.085], legs: 11, stalks: true, fan: false }
];
var NSEG = 9;
var shapeIdx = 0;
function spinePt(sh, t) {
  // t in [0,1] tail to head; the body arcs like a shrimp curl
  var x = -1 + t * 2;
  var y = Math.sin(t * 2.2) * sh.curve * -1 + t * t * sh.curve * 0.4;
  return [x, y];
}
function outline(sh) {
  // closed outline: top edge tail->head, bottom edge head->tail
  var top = [], bot = [], i, p, q, dx, dy, len, nx, ny;
  for (i = 0; i < NSEG; i++) {
    var t = i / (NSEG - 1);
    p = spinePt(sh, t); q = spinePt(sh, Math.min(1, t + 0.02));
    dx = q[0] - p[0]; dy = q[1] - p[1]; len = Math.sqrt(dx * dx + dy * dy) || 1;
    nx = -dy / len; ny = dx / len;
    var wHalf = sh.widths[i];
    top.push([p[0] + nx * wHalf, p[1] + ny * wHalf, nx, ny, t]);
    bot.push([p[0] - nx * wHalf, p[1] - ny * wHalf, nx, ny, t]);
  }
  return top.concat(bot.reverse());
}

// ---- heat field ------------------------------------------------------------------
// Low-res grid over local space; drag lays heat, heat decays over ~8s.
var HG = 20, heat = new Float32Array(HG * HG);
function heatAt(x, y) {
  var gx = clamp((x + 1.25) / 2.5 * (HG - 1), 0, HG - 1.001);
  var gy = clamp((y + 1.0) / 2.0 * (HG - 1), 0, HG - 1.001);
  var ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy;
  var a = heat[iy * HG + ix], b = heat[iy * HG + ix + 1];
  var c = heat[(iy + 1) * HG + ix], d = heat[(iy + 1) * HG + ix + 1];
  return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
}
function addHeat(x, y, amt) {
  var cx = (x + 1.25) / 2.5 * (HG - 1), cy = (y + 1.0) / 2.0 * (HG - 1);
  for (var j = 0; j < HG; j++) for (var i = 0; i < HG; i++) {
    var dx = i - cx, dy = j - cy;
    var d2 = dx * dx + dy * dy;
    heat[j * HG + i] = Math.min(1.4, heat[j * HG + i] + amt * Math.exp(-d2 / 7));
  }
}
// per-vertex bulge state (the membrane remembers being soft, briefly)
var bulgeM = [], bulgeI = [];
function resetBulge(n) {
  bulgeM = []; bulgeI = [];
  for (var i = 0; i < n; i++) { bulgeM.push(0); bulgeI.push(0); }
}
resetBulge((NSEG * 2));

// ---- transform: local -> screen ------------------------------------------------------
var T = 9, lastNow = -1;
function frame() {
  var sc = Math.min(W * 0.40, H * 0.44);
  var ang = -0.35 + Math.sin(T * 0.2513) * 0.07;   // ~20 degrees, swaying
  var cx = W / 2 + Math.sin(T * 0.19) * W * 0.018;
  var cy = H * 0.5 + Math.sin(T * 0.2513 * 2 + 1) * H * 0.016;
  return { sc: sc, ang: ang, cx: cx, cy: cy, ca: Math.cos(ang), sa: Math.sin(ang) };
}
function toScr(f, x, y) {
  return [f.cx + (x * f.ca - y * f.sa) * f.sc, f.cy + (x * f.sa + y * f.ca) * f.sc];
}
function toLocal(f, px, py) {
  var dx = (px - f.cx) / f.sc, dy = (py - f.cy) / f.sc;
  return [dx * f.ca + dy * f.sa, -dx * f.sa + dy * f.ca];
}

// ---- input: the drag is the heat gun --------------------------------------------------
var dragging = false, lastTapT = -10, lastTapX = 0, lastTapY = 0;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true;
  var f = frame();
  var lp = toLocal(f, e.clientX, e.clientY);
  addHeat(lp[0], lp[1], 0.5);
  if (T - lastTapT < 0.34 && Math.abs(e.clientX - lastTapX) < 40 && Math.abs(e.clientY - lastTapY) < 40) {
    shapeIdx = (shapeIdx + 1) % SHAPES.length;
    heat = new Float32Array(HG * HG);
    resetBulge(NSEG * 2);
    lastTapT = -10;
  } else {
    lastTapT = T; lastTapX = e.clientX; lastTapY = e.clientY;
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var f = frame();
  var lp = toLocal(f, e.clientX, e.clientY);
  addHeat(lp[0], lp[1], 0.34);
});
canvas.addEventListener('pointerup', function () { dragging = false; });
canvas.addEventListener('pointercancel', function () { dragging = false; });

// ---- resize ----------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- draw ---------------------------------------------------------------------------------------
function drawPath(pts, close) {
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);
  }
  if (close) ctx.closePath();
}
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && now > 0) {
    dt = Math.min(0.05, (now - lastNow) / 1000);
    T += dt;
  }
  lastNow = now;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var sh = SHAPES[shapeIdx];
  var f = frame();
  // heat cools: most of it gone in about eight seconds
  if (dt > 0) {
    var decay = Math.exp(-dt / 2.6);
    for (var hi = 0; hi < heat.length; hi++) heat[hi] *= decay;
  }
  var out = outline(sh);
  // displaced membrane outline and tighter inner outline
  var mPts = [], iPts = [];
  for (var i = 0; i < out.length; i++) {
    var o = out[i];
    var h = heatAt(o[0], o[1]);
    var target = h * 0.24;
    bulgeM[i] += (target - bulgeM[i]) * Math.min(1, dt * 3.2 + (dt === 0 ? 0 : 0));
    bulgeI[i] += (target * 0.4 - bulgeI[i]) * Math.min(1, dt * 6.5);
    var sway = Math.sin(T * 0.9 + o[4] * 5.0) * 0.008;
    mPts.push(toScr(f, o[0] + o[2] * (bulgeM[i] + sway), o[1] + o[3] * (bulgeM[i] + sway)));
    // the inner body is the same outline pulled toward the spine,
    // a true inset, so it stays centred inside the skin
    var spI = spinePt(sh, o[4]);
    var ix = spI[0] + (o[0] - spI[0]) * 0.8 + o[2] * bulgeI[i];
    var iy = spI[1] + (o[1] - spI[1]) * 0.8 + o[3] * bulgeI[i];
    iPts.push(toScr(f, ix, iy));
  }
  // tail fan (shrimp): two flat lobes spreading off the tail base
  if (sh.fan) {
    var tp = spinePt(sh, 0), tq = spinePt(sh, 0.08);
    var dx = tp[0] - tq[0], dy = tp[1] - tq[1], dl = Math.sqrt(dx * dx + dy * dy) || 1;
    dx /= dl; dy /= dl;
    var nx = -dy, ny = dx;
    ctx.fillStyle = LEG;
    for (var sgn = -1; sgn <= 1; sgn += 2) {
      var fp = [
        toScr(f, tp[0] + nx * sgn * 0.015, tp[1] + ny * sgn * 0.015),
        toScr(f, tp[0] + dx * 0.16 + nx * sgn * 0.13, tp[1] + dy * 0.16 + ny * sgn * 0.13),
        toScr(f, tp[0] + dx * 0.36 + nx * sgn * 0.21, tp[1] + dy * 0.36 + ny * sgn * 0.21),
        toScr(f, tp[0] + dx * 0.3 - nx * sgn * 0.02, tp[1] + dy * 0.3 - ny * sgn * 0.02)
      ];
      ctx.beginPath();
      ctx.moveTo(fp[0][0], fp[0][1]);
      ctx.lineTo(fp[1][0], fp[1][1]);
      ctx.lineTo(fp[2][0], fp[2][1]);
      ctx.lineTo(fp[3][0], fp[3][1]);
      ctx.closePath();
      ctx.fill();
    }
  }
  // leg pairs along the underside, paddling with phase lag
  ctx.strokeStyle = LEG;
  ctx.lineCap = 'round';
  for (var li = 0; li < sh.legs; li++) {
    var lt = 0.16 + (li / sh.legs) * 0.62;
    var lp2 = spinePt(sh, lt), lq = spinePt(sh, Math.min(1, lt + 0.02));
    var ldx = lq[0] - lp2[0], ldy = lq[1] - lp2[1], ll = Math.sqrt(ldx * ldx + ldy * ldy) || 1;
    var lnx = -ldy / ll, lny = ldx / ll;
    if (lny < 0) { lnx = -lnx; lny = -lny; }
    var pad = Math.sin(T * 2.4 - li * 0.85) * 0.09;
    var hip = toScr(f, lp2[0] + lnx * sh.widths[Math.round(lt * (NSEG - 1))] * 0.8, lp2[1] + lny * sh.widths[Math.round(lt * (NSEG - 1))] * 0.8);
    var foot = toScr(f, lp2[0] + lnx * 0.3 + pad, lp2[1] + lny * 0.3);
    ctx.lineWidth = Math.max(1.4, f.sc * 0.016);
    ctx.beginPath();
    ctx.moveTo(hip[0], hip[1]);
    ctx.lineTo(foot[0], foot[1]);
    ctx.stroke();
  }
  // inner body, seen through the skin
  drawPath(iPts, true);
  ctx.fillStyle = INNER;
  ctx.fill();
  // segment bands across the inner body
  ctx.strokeStyle = 'rgba(7,9,11,0.5)';
  ctx.lineWidth = Math.max(1, f.sc * 0.008);
  for (var bi = 1; bi < NSEG - 1; bi++) {
    var bt = bi / (NSEG - 1);
    var bp = spinePt(sh, bt), bq = spinePt(sh, Math.min(1, bt + 0.02));
    var bdx = bq[0] - bp[0], bdy = bq[1] - bp[1], bl = Math.sqrt(bdx * bdx + bdy * bdy) || 1;
    var bnx = -bdy / bl, bny = bdx / bl;
    var bw = sh.widths[bi] * 0.82;
    var b1 = toScr(f, bp[0] + bnx * bw, bp[1] + bny * bw);
    var b2 = toScr(f, bp[0] - bnx * bw, bp[1] - bny * bw);
    ctx.beginPath(); ctx.moveTo(b1[0], b1[1]); ctx.lineTo(b2[0], b2[1]); ctx.stroke();
  }
  // eyestalks at the head
  if (sh.stalks) {
    var hp = spinePt(sh, 0.97), hq = spinePt(sh, 0.9);
    var hdx = hp[0] - hq[0], hdy = hp[1] - hq[1], hl = Math.sqrt(hdx * hdx + hdy * hdy) || 1;
    hdx /= hl; hdy /= hl;
    var hnx = -hdy, hny = hdx;
    ctx.strokeStyle = STALK;
    ctx.lineWidth = Math.max(1.4, f.sc * 0.014);
    for (var es = -1; es <= 1; es += 2) {
      var swayE = Math.sin(T * 1.3 + es) * 0.03;
      var eb = toScr(f, hp[0] + hnx * es * 0.07, hp[1] + hny * es * 0.07);
      var et = toScr(f, hp[0] + hdx * 0.22 + hnx * es * (0.16 + swayE), hp[1] + hdy * 0.22 + hny * es * (0.16 + swayE));
      ctx.beginPath(); ctx.moveTo(eb[0], eb[1]); ctx.lineTo(et[0], et[1]); ctx.stroke();
      ctx.fillStyle = STALK;
      ctx.beginPath(); ctx.arc(et[0], et[1], Math.max(2, f.sc * 0.02), 0, 6.2832); ctx.fill();
    }
  }
  // membrane skin over everything, and its bright weld seams
  drawPath(mPts, true);
  ctx.fillStyle = MEMB;
  ctx.fill();
  ctx.strokeStyle = SEAM;
  ctx.lineWidth = Math.max(1.2, f.sc * 0.011);
  ctx.stroke();
  // cross welds: seam arcs at each segment joint, riding the membrane
  for (var wi2 = 1; wi2 < NSEG - 1; wi2++) {
    var wt = wi2 / (NSEG - 1);
    var wp = spinePt(sh, wt), wq = spinePt(sh, Math.min(1, wt + 0.02));
    var wdx = wq[0] - wp[0], wdy = wq[1] - wp[1], wl = Math.sqrt(wdx * wdx + wdy * wdy) || 1;
    var wnx = -wdy / wl, wny = wdx / wl;
    var ww = sh.widths[wi2];
    var wh1 = heatAt(wp[0] + wnx * ww, wp[1] + wny * ww);
    var wh2 = heatAt(wp[0] - wnx * ww, wp[1] - wny * ww);
    var w1 = toScr(f, wp[0] + wnx * (ww + bulgeM[wi2] * 0 + wh1 * 0.24), wp[1] + wny * (ww + wh1 * 0.24));
    var w2 = toScr(f, wp[0] - wnx * (ww + wh2 * 0.24), wp[1] - wny * (ww + wh2 * 0.24));
    ctx.strokeStyle = 'rgba(228,241,246,0.55)';
    ctx.beginPath(); ctx.moveTo(w1[0], w1[1]); ctx.lineTo(w2[0], w2[1]); ctx.stroke();
    ctx.strokeStyle = SEAM;
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
