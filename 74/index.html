<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№74 · Grey as Difference</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#101010; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(240,240,240,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag a tile to change its ground</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }
const PANELGREYS=['#2a2a2a','#555555','#d5d5d5'];
const TILEGREY='#808080';
const LOOP=48, WINDOW=8;
let tileSlot=[0,1,2,3,4,5];
let dragTile=-1, dragPos=null;
function layout(w,h){
  const phone=isPhone();
  const panels=[], slots=[];
  if(phone){
    const ph=h/3;
    for(let i=0;i<3;i++) panels.push({x:0,y:i*ph,w:w,h:ph});
  } else {
    const pw=w/3;
    for(let i=0;i<3;i++) panels.push({x:i*pw,y:0,w:pw,h:h});
  }
  panels.forEach((p,pi)=>{
    const ts=Math.min(p.w,p.h)*(phone?0.30:0.34);
    const positions = phoneOrDesktopSlots(p, phone, ts);
    positions.forEach(pos=>slots.push({x:pos[0],y:pos[1],size:ts,panel:pi}));
  });
  const visitors=panels.map((p,pi)=>{
    const ts=Math.min(p.w,p.h)*(phone?0.30:0.34);
    if(phone) return {x:p.x+p.w/2-ts/2, y:p.y+p.h*0.84-ts/2, size:ts, panel:pi};
    return {x:p.x+p.w/2-ts/2, y:p.y+p.h/2-ts/2, size:ts, panel:pi};
  });
  return {panels,slots,visitors,phone};
}
function phoneOrDesktopSlots(p, phone, ts){
  if(phone) return [[p.x+p.w*0.30-ts/2, p.y+p.h/2-ts/2],[p.x+p.w*0.70-ts/2, p.y+p.h/2-ts/2]];
  return [[p.x+p.w/2-ts/2, p.y+p.h*0.30-ts/2],[p.x+p.w/2-ts/2, p.y+p.h*0.70-ts/2]];
}
function tilePos(ti,t,w,h){
  const L=layout(w,h);
  const home=L.slots[tileSlot[ti]];
  const win=Math.floor(t/WINDOW)%6;
  const ph=t%WINDOW;
  if(ti!==win||dragTile===ti) return home;
  const targetPanel=(home.panel+1)%3;
  const target=L.visitors[targetPanel];
  let k=0;
  if(ph<2) k=smooth(ph/2); else if(ph<6) k=1; else k=1-smooth((ph-6)/2);
  return {x:home.x+(target.x-home.x)*k, y:home.y+(target.y-home.y)*k, size:home.size, panel:home.panel};
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#101010'; ctx.fillRect(0,0,w,h);
  const t=nowMs/1000;
  const L=layout(w,h);
  L.panels.forEach((p,i)=>{ ctx.fillStyle=PANELGREYS[i]; ctx.fillRect(p.x,p.y,p.w,p.h); });
  ctx.fillStyle=TILEGREY;
  for(let ti=0;ti<6;ti++){
    if(ti===dragTile&&dragPos){ const s=L.slots[0].size; ctx.fillRect(dragPos.x-s/2,dragPos.y-s/2,s,s); continue; }
    const pos=tilePos(ti,t,w,h);
    ctx.fillRect(pos.x,pos.y,pos.size,pos.size);
  }
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(3000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',e=>{
  const [w,h]=viewportWH(); const t=performance.now()/1000;
  for(let ti=0;ti<6;ti++){ const pos=tilePos(ti,t,w,h); if(e.clientX>=pos.x&&e.clientX<=pos.x+pos.size&&e.clientY>=pos.y&&e.clientY<=pos.y+pos.size){ dragTile=ti; dragPos={x:e.clientX,y:e.clientY}; break; } }
});
canvas.addEventListener('pointermove',e=>{ if(dragTile>=0) dragPos={x:e.clientX,y:e.clientY}; });
function endP(){
  if(dragTile>=0&&dragPos){
    const [w,h]=viewportWH(); const L=layout(w,h);
    let best=-1, bd=1e18;
    L.slots.forEach((s,si)=>{ const cx=s.x+s.size/2, cy=s.y+s.size/2; const d=(cx-dragPos.x)*(cx-dragPos.x)+(cy-dragPos.y)*(cy-dragPos.y); if(d<bd){bd=d;best=si;} });
    if(best>=0&&best!==tileSlot[dragTile]){ const other=tileSlot.indexOf(best); const tmp=tileSlot[dragTile]; tileSlot[dragTile]=best; if(other>=0) tileSlot[other]=tmp; }
  }
  dragTile=-1; dragPos=null;
}
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
