<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№90 · Crater Study</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#1B4FE0; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,255,255,0.75); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to spin the field</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.90 Crater Study: seeded PRNG "Crater Study", 6 rings x 36 bars, static poster with drag-only spin
const RINGS=6, PER=36;
let spin=0, dragging=false, lastAng=null;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#1B4FE0'; ctx.fillRect(0,0,w,h);
  const phone=isPhone();
  const S=Math.min(w,h);
  const cx=w/2, cy=h/2, R=S/2;
  ctx.lineCap='round';
  for(let k=0;k<RINGS;k++){
    const rc=R*(0.21+k*0.118), len=R*0.072, bw=S*(0.024-k*0.0018);
    for(let i=0;i<PER;i++){
      const a=(i/PER)*Math.PI*2+spin;
      // colour by screen angle: upper white, lower black, 20deg transition half-width bars
      const deg=((a*180/Math.PI)%360+360)%360; // 0 = east, going clockwise in screen coords (y down): sin>0 is lower
      const s=Math.sin(a);
      let col, scale=1;
      const trans=Math.cos(a); // near +-1 at sides
      if(Math.abs(trans)>Math.cos(20*Math.PI/180) && Math.abs(s)<Math.sin(25*Math.PI/180)){ scale=0.55; col = s<0?'#FFFFFF':'#0D0D0D'; }
      else col = s<0?'#FFFFFF':'#0D0D0D';
      ctx.strokeStyle=col; ctx.lineWidth=bw*scale;
      const r0=rc-len/2*scale, r1=rc+len/2*scale;
      ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0); ctx.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1); ctx.stroke();
    }
  }
  ctx.fillStyle='#0D0D0D'; ctx.beginPath(); ctx.arc(cx,cy,R*0.12,0,Math.PI*2); ctx.fill();
  if(RINGS*PER!==216) console.assert(false,'bars',RINGS*PER);
  return {};
}
function angAt(e){ const [w,h]=viewportWH(); return Math.atan2(e.clientY-h/2, e.clientX-w/2); }
canvas.addEventListener('pointerdown',e=>{ dragging=true; lastAng=angAt(e); });
canvas.addEventListener('pointermove',e=>{ if(!dragging||lastAng===null) return; const a=angAt(e); let d=a-lastAng; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; spin+=d; lastAng=a; drawFrame(performance.now()); });
function endP(){ dragging=false; lastAng=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
