<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Permutation Grid</title>
<style>
html, body { margin: 0; padding: 0; background: #121212; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#121212';
var PLATE = '#1E1E1E';
var PLATE_LINE = 'rgba(217,167,160,0.55)';
var TITLE_INK = '#EFE9DD';
var HINT_INK = '#D9A7A0';
var PINK = '#D9A7A0';
var WHITE = '#EFE9DD';
var GREY = '#4A4A48';
var PERIOD = 52; /* 24 permutations x 2 s + 4 s rest */
var FRAME_T = 13.0;
var STEP = 2.0;
var REST = 4.0;
var TRANS = 0.7;
var COLS = 6, ROWS = 4, COUNT = 24;
/* bar color by rank, fixed rotation through the three palette colors */
var RANK_COLORS = [GREY, PINK, WHITE, GREY];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1728);
var phaseT = FRAME_T;
/* ---- all 24 permutations of {0,1,2,3} in lexicographic order, exhaustive ---- */
var PERMS = [];
(function () {
  var a = [0, 1, 2, 3], i, j, tmp;
  function pushCopy() { PERMS.push([a[0], a[1], a[2], a[3]]); }
  pushCopy();
  while (true) {
    i = 2;
    while (i >= 0 && a[i] >= a[i + 1]) i--;
    if (i < 0) break;
    j = 3;
    while (a[j] <= a[i]) j--;
    tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    var lo = i + 1, hi = 3;
    while (lo < hi) { tmp = a[lo]; a[lo] = a[hi]; a[hi] = tmp; lo++; hi--; }
    pushCopy();
  }
})();
function rankHeight(rank) { return 0.18 + rank * 0.24; } /* 0.18, 0.42, 0.66, 0.90 */
function cycleState(t) {
  var tc = t % PERIOD;
  if (tc >= PERIOD - REST) return { step: 23, inStep: STEP, resting: true };
  var step = Math.floor(tc / STEP);
  return { step: step, inStep: tc - step * STEP, resting: false };
}
function ease(u) { return u * u * (3 - 2 * u); }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- field-like grid: full-bleed, one shared left margin for the scale ---- */
function gridRect() {
  var lm = isPhone ? 46 : 68;
  var top = isPhone ? 62 : 74; /* clear of the title plate */
  var bot = isPhone ? 48 : 48; /* clear of the hint plate */
  var pad = isPhone ? 10 : 16;
  return { x: lm, y: top, w: VW - lm - pad, h: VH - top - bot, lm: lm };
}
function drawScale(gr, cellH) {
  /* small 0-3 scale in the shared left margin, ticks aligned to bar heights */
  var barAreaH = cellH * 0.94;
  var baseY = gr.y + gr.h - (gr.h - cellH * ROWS) / 2 - cellH * 0.03;
  var i, r;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.font = (isPhone ? 10 : 11) + 'px monospace';
  ctx.fillStyle = rgba(WHITE, 0.55);
  for (r = 0; r < 4; r++) {
    var y = baseY - rankHeight(r) * barAreaH;
    ctx.fillRect(gr.lm - 16, y - 0.5, 10, 1);
    ctx.fillText(String(r), gr.lm - 20, y);
  }
  ctx.fillStyle = rgba(WHITE, 0.35);
  ctx.fillRect(gr.lm - 6, baseY - rankHeight(3) * barAreaH, 1, rankHeight(3) * barAreaH);
}
function drawCell(idx, cellX, cellY, cellW, cellH, state, active) {
  var cur = PERMS[(state.step + idx) % COUNT];
  var prev = PERMS[(state.step + COUNT - 1 + idx) % COUNT];
  var k = state.resting ? 1 : ease(clamp(state.inStep / TRANS, 0, 1));
  var innerW = cellW * 0.86, innerH = cellH * 0.94;
  var ox = cellX + (cellW - innerW) / 2;
  var oy = cellY + (cellH - innerH) / 2;
  var barW = innerW / 4 * 0.78;
  var gap = innerW / 4 * 0.22;
  var baseY = oy + innerH;
  var b, rank, hFrac;
  ctx.save();
  if (!active) ctx.globalAlpha = 0.72;
  /* cell baseline */
  ctx.fillStyle = rgba(WHITE, 0.18);
  ctx.fillRect(ox, baseY, innerW, 1);
  for (b = 0; b < 4; b++) {
    hFrac = prev[b] === cur[b] ? rankHeight(cur[b])
      : rankHeight(prev[b]) + (rankHeight(cur[b]) - rankHeight(prev[b])) * k;
    rank = cur[b];
    var bx = ox + b * (innerW / 4) + gap / 2;
    var bh = hFrac * innerH;
    ctx.fillStyle = RANK_COLORS[rank];
    ctx.fillRect(bx, baseY - bh, barW, bh);
  }
  ctx.restore();
  if (active) {
    ctx.save();
    ctx.strokeStyle = WHITE;
    ctx.lineWidth = 2;
    ctx.strokeRect(cellX + 3.5, cellY + 3.5, cellW - 7, cellH - 7);
    ctx.strokeStyle = rgba(PINK, 0.45);
    ctx.lineWidth = 1;
    ctx.strokeRect(cellX + 7.5, cellY + 7.5, cellW - 15, cellH - 15);
    ctx.restore();
  }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var gr = gridRect();
  var cellW = gr.w / COLS, cellH = gr.h / ROWS;
  var state = cycleState(phaseT);
  var active = state.step;
  var i, col, row;
  for (i = 0; i < COUNT; i++) {
    col = i % COLS; row = Math.floor(i / COLS);
    drawCell(i, gr.x + col * cellW, gr.y + row * cellH, cellW, cellH, state, i === active);
  }
  drawScale(gr, cellH);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Permutation Grid').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Permutation Grid').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 05').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Permutation Grid', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 05', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the grid exhaust every ordering.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    pieceCount: function () { return COUNT; },
    cycleState: function () { return cycleState(phaseT); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 13.0 s of a 52 s cycle, step 6, active cell 6 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
