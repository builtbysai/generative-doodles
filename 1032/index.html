  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function fit() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    if (vv && vv.width) { W = vv.width; H = vv.height; }
    else if (typeof window !== 'undefined' && window.innerWidth) { W = window.innerWidth; H = window.innerHeight; }
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(simTime); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { fit(); draw(simTime); });
    }
  }

  function worldScale() { return Math.min(W, H) / WORLD_SPAN; }
  function screenToWorld(cx, cy) {
    var s = worldScale();
    return { x: (cx - (W / 2 - WORLD_CX * s)) / s, y: (cy - (H / 2 - WORLD_CY * s)) / s };
  }

  // ---------- spline ----------
  function crs(p0, p1, p2, p3, t) {
    var t2 = t * t, t3 = t2 * t;
    return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
  }
  function splinePos(pts, u) {
    var K = pts.length;
    var x = ((u % 1) + 1) % 1;
    var seg = Math.floor(x * K);
    var f = x * K - seg;
    var A = pts[(seg + K - 1) % K], B = pts[seg % K], C = pts[(seg + 1) % K], D = pts[(seg + 2) % K];
    return { x: crs(A[0], B[0], C[0], D[0], f), y: crs(A[1], B[1], C[1], D[1], f) };
  }

  // ---------- state ----------
  var simTime = T0;
  var fleetIdx = 0;
  var vehicles = [];   // {pts, dir, phase}
  var cubes = [];      // {x0,y0,vx,vy,a0,w,size}
  var diverts = [];    // {i, dx, dy, tBegin, tEnd} recorded drag segments
  var flashes = [];    // {i, t0} recorded marker flashes

  function buildFleet() {
    vehicles = [];
    var data = FLEETS[fleetIdx];
    for (var i = 0; i < data.length; i++) {
      vehicles.push({ pts: data[i][0], dir: data[i][1], phase: data[i][2] / 720 });
    }
    var rng = mulberry32(555001 + fleetIdx * 131);
    cubes = [];
    for (var j = 0; j < 5; j++) {
      cubes.push({
        x0: 350 + rng() * 300, y0: 350 + rng() * 280,
        vx: (5 + rng() * 4.5) * (rng() < 0.5 ? -1 : 1),
        vy: (4 + rng() * 4) * (rng() < 0.5 ? -1 : 1),
        a0: rng() * Math.PI * 2, w: (0.03 + rng() * 0.05) * (rng() < 0.5 ? -1 : 1),
        size: 27 + rng() * 7
      });
    }
    diverts = [];
    flashes = [];
  }

  function vehPathPos(v, t) {
    return splinePos(v.pts, v.phase + v.dir * (t / CYCLE));
  }
  function vehHeading(v, t) {
    var a = vehPathPos(v, t - 0.15), b = vehPathPos(v, t + 0.15);
    return Math.atan2(b.y - a.y, b.x - a.x);
  }

  // offset from recorded divert segments: closed form in (segments, t)
  function offsetAt(i, t) {
    var ox = 0, oy = 0;
    for (var k = 0; k < diverts.length; k++) {
      var d = diverts[k];
      if (d.i !== i || t < d.tBegin) continue;
      var attack = 1 - Math.exp(-(Math.min(t, d.tEnd) - d.tBegin) / 0.22);
      var env;
      if (t <= d.tEnd) env = attack;
      else env = attack * Math.exp(-(t - d.tEnd) / 1.5);
      if (env > 0.001) { ox += d.dx * env; oy += d.dy * env; }
    }
    return { x: ox, y: oy };
  }
  function vehPos(i, t) {
    var p = vehPathPos(vehicles[i], t);
    var o = offsetAt(i, t);
    return { x: p.x + o.x, y: p.y + o.y };
  }

  function flareAt(i, t) {
    var best = 0;
    for (var k = 0; k < flashes.length; k++) {
      var f = flashes[k];
      if (f.i !== i) continue;
      var age = t - f.t0;
      if (age < 0) continue;
      var env = age < 0.06 ? age / 0.06 : Math.exp(-(age - 0.06) / 0.35);
      if (env > best) best = env;
    }
    return best;
  }

  function reflect(p0, v, t, lo, hi) {
    var span = hi - lo;
    var raw = (p0 + v * t - lo) % (2 * span);
    if (raw < 0) raw += 2 * span;
    return lo + (raw <= span ? raw : 2 * span - raw);
  }
  function cubePos(c, t) {
    return { x: reflect(c.x0, c.vx, t, 320, 680), y: reflect(c.y0, c.vy, t, 320, 670) };
  }

  // ---------- drawing ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = STAGE;
    ctx.fillRect(0, 0, W, H);
    var s = worldScale();
    ctx.save();
    ctx.translate(W / 2 - WORLD_CX * s, H / 2 - WORLD_CY * s);
    ctx.scale(s, s);

    // closed-form path (never a canvas fade)

    ctx.globalAlpha = 0.08;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

      ctx.lineWidth = 1.6;

      ctx.globalAlpha = 1;

      ctx.rotate(hd);
      ctx.fillStyle = WHEEL;

      rr(-19, 15, 14, 6, 3); ctx.fill();
      rr(5, -21, 14, 6, 3); ctx.fill();

      ctx.strokeStyle = WHEEL;
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 1.4;
      rr(-SHELL_L / 2 + 3, -SHELL_W / 2 + 3, SHELL_L - 6, SHELL_W - 6, 7);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // Each dot sits on a faint dark seat (a physical disc on the shell)
      // so the white reads against the white shell.
      for (k = 0; k < MARKER_PTS.length; k++) {
        var mx = MARKER_PTS[k][0], my = MARKER_PTS[k][1];
        ctx.fillStyle = WHEEL;
        ctx.globalAlpha = 0.3;

        ctx.arc(mx, my, 3.7 + 1.8 * fl, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = MARKER;
        ctx.globalAlpha = 0.3 + 0.25 * fl;
        ctx.beginPath();
        ctx.arc(mx, my, 4.4 + 3.4 * fl, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(mx, my, 2.6 + 1.6 * fl, 0, Math.PI * 2);
        ctx.fill();
      }
      if (fl > 0.02) {
        ctx.globalAlpha = 0.35 * fl;
        ctx.strokeStyle = MARKER;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(0, 0, 30 + 10 * (1 - fl), 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    ctx.restore();
  }

  // ---------- audio (lazy, gesture-only, fully guarded) ----------
  var AC = null;
  if (typeof AudioContext !== 'undefined') AC = AudioContext;
  else if (typeof window !== 'undefined' && window.webkitAudioContext) AC = window.webkitAudioContext;
  var audio = null;
  var CHIME_SCALE = [523.25, 587.33, 659.25, 783.99, 880.0];

  function ensureAudio() {
    if (audio || !AC) return;
    try {
      var ac = new AC();
      var master = ac.createGain();
      master.gain.value = 0.9;
      master.connect(ac.destination);
      var lp = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 420;
      var gg = ac.createGain(); gg.gain.value = 0;
      var o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = 96;
      var o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 144;
      var g2 = ac.createGain(); g2.gain.value = 0.35;

        var a = vehPathPos(vehicles[i], t), b = vehPathPos(vehicles[i], t + 0.5);

  // ---------- interaction ----------
  var pointerDown = false;
  var downX = 0, downY = 0, downT = 0, moved = false;
  var lastTapT = -1e9;
  var activeSeg = {};   // vehicle index -> its live divert segment

  function evtWorld(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
  }
  function endAllSegs(t) {
    for (var key in activeSeg) {
      if (activeSeg.hasOwnProperty(key)) activeSeg[key].tEnd = t;
    }
    activeSeg = {};
  }
  function onDown(e) {
    ensureAudio();
    if (audio && audio.ac && audio.ac.resume) { try { audio.ac.resume(); } catch (err) {} }
    var w = evtWorld(e);
    pointerDown = true; moved = false;
    downX = w.x; downY = w.y; downT = simTime;
  }
  function onMove(e) {
    if (!pointerDown) return;
    var w = evtWorld(e);
    if (Math.abs(w.x - downX) > 9 || Math.abs(w.y - downY) > 9) moved = true;
    if (!moved) return;
    var t = simTime;
    for (var i = 0; i < vehicles.length; i++) {
      var p = vehPathPos(vehicles[i], t);
      var dx = p.x - w.x, dy = p.y - w.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var seg = activeSeg[i];
      if (d < 200 && d > 0.001) {
        var mag = 54 * (1 - d / 200);
        if (seg) { seg.dx = dx / d * mag; seg.dy = dy / d * mag; }
        else {
          seg = { i: i, dx: dx / d * mag, dy: dy / d * mag, tBegin: t, tEnd: Infinity };
          diverts.push(seg);
          activeSeg[i] = seg;
        }
      } else if (seg) {
        seg.tEnd = t;
        delete activeSeg[i];
      }
    }
  }

    if (!pointerDown) return;
    pointerDown = false;
    var t = simTime;
    endAllSegs(t);

        fleetIdx = (fleetIdx + 1) % FLEETS.length;
        buildFleet();
        lastTapT = -1e9;
      } else {
        var w = evtWorld(e);
        var best = -1, bestD = 75;
        for (var i = 0; i < vehicles.length; i++) {
          var p = vehPos(i, t);
          var dx = p.x - w.x, dy = p.y - w.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < bestD) { bestD = d; best = i; }
        }
        if (best >= 0) { flashes.push({ i: best, t0: t }); shutter(); }
        lastTapT = t;
      }
    }
    // prune dead records
    if (diverts.length > 60) diverts = diverts.filter(function (d) { return t - d.tEnd < 8; });
    if (flashes.length > 40) flashes = flashes.slice(-40);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---------- proximity chimes (checked in the animation loop) ----------
  var closePairs = {};
  function checkChimes(t) {
    var pos = [];
    var i, j;
    for (i = 0; i < vehicles.length; i++) pos.push(vehPos(i, t));
    for (i = 0; i < vehicles.length; i++) {
      for (j = i + 1; j < vehicles.length; j++) {
        var dx = pos[i].x - pos[j].x, dy = pos[i].y - pos[j].y;
        var key = i + ':' + j;
        if (dx * dx + dy * dy < 105 * 105) {
          if (!closePairs[key]) { closePairs[key] = true; chime(i * 3 + j, t); }
        } else if (closePairs[key]) {
          delete closePairs[key];
        }
      }
    }
  }

  // ---------- run ----------
  buildFleet();
  fit();
  draw(simTime);

  function performanceNow() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    var startStamp = performanceNow();
    var lastStamp = startStamp;
    var loop = function () {
      var now = performanceNow();
      var dt = (now - lastStamp) / 1000;
      lastStamp = now;
      if (dt > 0.05) dt = 0.05;
      if (dt < 0) dt = 0;
      simTime += dt;
      draw(simTime);
      updateGlide(simTime);
      checkChimes(simTime);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
