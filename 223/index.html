<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.223 Generator Fugue</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101020; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.223 Generator Fugue (Kathy McTavish). Her swarm made visible as a
// pipeline: a loosely-coupled web of generators, filters, transformers
// and renderers. A cyan particle stream flows left to right through
// four labelled stations. GENERATE emits; FILTER culls and leaves
// magenta residue; TRANSFORM turns and scales the survivors; RENDER
// stamps warm yellow marks that accumulate into a drawing on the right
// third, fading over ninety seconds. The rigging is the work: the
// stations stay visible. Drag across the stream to inject a burst.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#101020', CYAN = '#35E0FF', MAGENTA = '#FF3EC8', YELLOW = '#FFE14D';
var W = 0, H = 0, phone = false;
var seed = 223223;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
var rand = rng(seed);
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

var T = 0;
var SX = [0.10, 0.34, 0.58, 0.82]; // GENERATE FILTER TRANSFORM RENDER
var LABELS = ['GENERATE', 'FILTER', 'TRANSFORM', 'RENDER'];
var LCOL = [CYAN, MAGENTA, CYAN, YELLOW];
var BY = 0, BH = 0; // band centre / half-height, set on resize
var particles = [], residue = [], deposits = [];
var spawnTimer = 0;
var MAXP = 380, MAXRES = 320, MAXDEP = 950;

function spawn(x, y, stage) {
  if (particles.length >= MAXP) return;
  particles.push({
    x: x, y: y, vx: W * 0.105 + rand() * W * 0.02, vy: (rand() - 0.5) * 14,
    stage: stage, size: 1.6 + rand() * 1.5, phase: rand() * 6.28,
    scaleF: 1, stamp: 0
  });
}
function step(dt) {
  T += dt;
  // emission from GENERATE
  spawnTimer -= dt;
  while (spawnTimer <= 0) {
    spawnTimer += 0.045;
    spawn(SX[0] * W, BY + (rand() - 0.5) * 2 * BH * 0.82, 0);
  }
  var fx = SX[1] * W, tx = SX[2] * W, rx = SX[3] * W;
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    var px = p.x;
    p.x += p.vx * dt;
    if (p.stage >= 2) {
      // transformed: a visibly bent path, size breathing with its spin
      p.y += p.vy * dt + Math.sin(T * 2.6 + p.phase) * 30 * dt;
    } else {
      p.y += p.vy * dt + Math.sin(T * 1.3 + p.phase) * 5 * dt;
    }
    p.y = clamp(p.y, BY - BH * 1.25, BY + BH * 1.25);
    // station crossings
    if (p.stage === 0 && px < fx && p.x >= fx) {
      if (rand() < 0.45) { // culled: magenta residue at the filter
        residue.push({ x: fx + (rand() - 0.5) * 7, y: p.y, age: 0, r: 1.4 + rand() * 1.6 });
        if (residue.length > MAXRES) residue.shift();
        particles.splice(i, 1);
        continue;
      }
      p.stage = 1;
    }
    if (p.stage === 1 && px < tx && p.x >= tx) {
      p.stage = 2;
      p.vy = (rand() - 0.5) * 74;
      p.scaleF = rand() < 0.5 ? 0.65 : 1.5;
    }
    if (p.stage === 2 && p.x >= rx) p.stage = 3;
    if (p.stage === 3) {
      p.stamp -= dt;
      if (p.stamp <= 0) {
        p.stamp = 0.055;
        deposits.push({ x: p.x, y: p.y, age: 0, r: p.size * p.scaleF * 0.8 });
        if (deposits.length > MAXDEP) deposits.shift();
      }
    }
    if (p.x > W + 12 || p.y < -20 || p.y > H + 20) particles.splice(i, 1);
  }
  for (var r = residue.length - 1; r >= 0; r--) { residue[r].age += dt; if (residue[r].age > 50) residue.splice(r, 1); }
  for (var d = deposits.length - 1; d >= 0; d--) { deposits[d].age += dt; if (deposits[d].age > 90) deposits.splice(d, 1); }
}

function drawStation(i) {
  var x = SX[i] * W;
  var top = BY - BH - 16, bot = BY + BH + 16;
  ctx.strokeStyle = LCOL[i];
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, top); ctx.lineTo(x, bot);
  ctx.stroke();
  ctx.globalAlpha = 0.9;
  ctx.font = (phone ? 9 : 11) + 'px monospace';
  ctx.textAlign = 'center';
  // knock out whatever is behind the label so the rigging stays legible
  var lw = ctx.measureText(LABELS[i]).width;
  ctx.fillStyle = GROUND;
  ctx.fillRect(x - lw / 2 - 4, top - 10 - (phone ? 9 : 11), lw + 8, (phone ? 9 : 11) + 4);
  ctx.fillStyle = LCOL[i];
  ctx.fillText(LABELS[i], x, top - 10);
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
  if (i === 2) { // TRANSFORM: the slow-turning glyph
    ctx.save();
    ctx.translate(x, BY);
    ctx.rotate(T * 0.7);
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 1.6;
    var g = phone ? 9 : 13;
    ctx.strokeRect(-g / 1.4, -g / 1.4, g * 1.42, g * 1.42);
    ctx.restore();
    ctx.fillStyle = CYAN;
    ctx.fillRect(x - 1.5, BY - 1.5, 3, 3);
  }
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // filter residue
  for (var r = 0; r < residue.length; r++) {
    var rs = residue[r];
    ctx.globalAlpha = clamp(1 - rs.age / 50, 0, 1) * 0.85;
    ctx.fillStyle = MAGENTA;
    ctx.fillRect(rs.x - rs.r / 2, rs.y - rs.r / 2, rs.r, rs.r);
  }
  // render deposits: the accumulating drawing on the right
  for (var d = 0; d < deposits.length; d++) {
    var dp = deposits[d];
    ctx.globalAlpha = clamp(1 - dp.age / 90, 0, 1);
    ctx.fillStyle = YELLOW;
    ctx.fillRect(dp.x - dp.r / 2, dp.y - dp.r / 2, dp.r, dp.r);
  }
  ctx.globalAlpha = 1;
  // stations over the field, under the live stream
  for (var s = 0; s < 4; s++) drawStation(s);
  // the stream itself
  ctx.fillStyle = CYAN;
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var sz = p.size * (p.stage >= 2 ? p.scaleF * (0.85 + 0.3 * Math.sin(T * 4 + p.phase)) : 1);
    ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
}

// ---- interaction: drag injects a burst ------------------------------------------------
var dragging = false;
function burst(x, y) {
  for (var i = 0; i < 3; i++) {
    var st = 0;
    if (x > SX[3] * W) st = 3; else if (x > SX[2] * W) st = 2; else if (x > SX[1] * W) st = 1;
    var p = { x: x + (rand() - 0.5) * 10, y: y + (rand() - 0.5) * 10, vx: W * 0.105, vy: (rand() - 0.5) * 20, stage: st, size: 1.6 + rand() * 1.5, phase: rand() * 6.28, scaleF: st >= 2 ? (rand() < 0.5 ? 0.65 : 1.5) : 1, stamp: 0 };
    if (particles.length < MAXP) particles.push(p);
  }
}
canvas.addEventListener('pointerdown', function (e) { dragging = true; burst(e.clientX || 0, e.clientY || 0); });
canvas.addEventListener('pointermove', function (e) { if (dragging) burst(e.clientX || 0, e.clientY || 0); });
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  BY = Math.round(H * 0.52);
  BH = Math.round(H * 0.17);
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
var lastNow = -1;
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  if (dt > 0) step(dt);
  draw();
}
resize();
// pre-run: frame one opens with the stream in full flow, residue at
// the filter and a partial deposit drawing on the right
for (var pre = 0; pre < 360; pre++) step(1 / 30);
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
