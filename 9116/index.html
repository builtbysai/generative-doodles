<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Entrainment</title>
<!-- ENTRAINMENT-9116 -->
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0d17; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
'use strict';
// Entrainment (9116) core: synchronous fireflies, Mirollo-Strogatz pulse coupling.
// Pure logic, no DOM. Seeded RNG for deterministic harness runs.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class FireflyField {
  constructor(W, H, N, opts = {}) {
    const o = Object.assign({
      seed: 1, K: 0.15, R: 130, baseFreq: 0.45, freqSigma: 0.06,
      clusters: 6, clusterSpread: 150, wanderAmp: 14, decayTau: 0.55,
    }, opts);
    this.W = W; this.H = H; this.N = N; this.o = o;
    this.rand = mulberry32(o.seed);
    const rand = this.rand;
    this.centers = [];
    if (o.clusters === 6) {
      // jittered 3x2 grid: guaranteed coverage, no voids
      for (let c = 0; c < 6; c++) {
        const gx = c % 3, gy = (c / 3) | 0;
        this.centers.push([
          W * (0.22 + 0.28 * gx) + (rand() - 0.5) * W * 0.14,
          H * (0.28 + 0.44 * gy) + (rand() - 0.5) * H * 0.14,
        ]);
      }
    } else {
      for (let c = 0; c < o.clusters; c++) {
        this.centers.push([W * (0.12 + 0.76 * rand()), H * (0.18 + 0.64 * rand())]);
      }
    }
    const gauss = () => (rand() + rand() + rand() - 1.5) * 2;
    this.f = new Float64Array(N);
    this.freq = new Float64Array(N);
    this.x = new Float64Array(N);
    this.y = new Float64Array(N);
    this.hx = new Float64Array(N);
    this.hy = new Float64Array(N);
    this.b = new Float64Array(N);
    this.w1 = new Float64Array(N); this.w2 = new Float64Array(N);
    this.p1 = new Float64Array(N); this.p2 = new Float64Array(N);
    this.brightTime = new Float64Array(N);
    this.t = 0;
    for (let i = 0; i < N; i++) {
      let x, y;
      if (o.clusters === 0) {
        x = 8 + rand() * (W - 16);
        y = 8 + rand() * (H - 16);
      } else {
        const c = this.centers[(rand() * o.clusters) | 0];
        x = c[0] + gauss() * o.clusterSpread;
        y = c[1] + gauss() * o.clusterSpread * 0.8;
      }
      this.hx[i] = Math.min(W - 8, Math.max(8, x));
      this.hy[i] = Math.min(H - 8, Math.max(8, y));
      this.x[i] = this.hx[i]; this.y[i] = this.hy[i];
      this.f[i] = rand();
      this.freq[i] = o.baseFreq * (1 + o.freqSigma * gauss());
      this.w1[i] = 0.05 + rand() * 0.07;
      this.w2[i] = 0.05 + rand() * 0.07;
      this.p1[i] = rand() * 6.283; this.p2[i] = rand() * 6.283;
      this.b[i] = 0;
    }
    this._flashers = [];
  }

  step(dt, pointer) {
    const o = this.o, N = this.N;
    dt = Math.min(dt, 0.05);
    this.t += dt;
    const R = o.R, R2 = R * R, K = o.K;
    // spatial grid for neighbor lookup
    const cell = R;
    const gw = Math.max(1, Math.ceil(this.W / cell));
    const gh = Math.max(1, Math.ceil(this.H / cell));
    const grid = new Array(gw * gh);
    for (let i = 0; i < N; i++) {
      const cx = Math.min(gw - 1, (this.x[i] / cell) | 0);
      const cy = Math.min(gh - 1, (this.y[i] / cell) | 0);
      const k = cy * gw + cx;
      (grid[k] || (grid[k] = [])).push(i);
    }
    const TAU = 6.283185307;
    const np = this._np || (this._np = new Float64Array(N));
    for (let i = 0; i < N; i++) {
      const xi = this.x[i], yi = this.y[i], ti = this.f[i] * TAU;
      const si = Math.sin(ti), ci = Math.cos(ti);
      let ss = 0, n = 0;
      const cx = Math.min(gw - 1, (xi / cell) | 0);
      const cy = Math.min(gh - 1, (yi / cell) | 0);
      for (let gx = Math.max(0, cx - 1); gx <= Math.min(gw - 1, cx + 1); gx++) {
        for (let gy = Math.max(0, cy - 1); gy <= Math.min(gh - 1, cy + 1); gy++) {
          const lst = grid[gy * gw + gx];
          if (!lst) continue;
          for (let a = 0; a < lst.length; a++) {
            const j = lst[a];
            if (j === i) continue;
            const dx = this.x[j] - xi, dy = this.y[j] - yi;
            if (dx * dx + dy * dy > R2) continue;
            const tj = this.f[j] * TAU;
            // sin(tj - ti) = sin tj cos ti - cos tj sin ti
            ss += Math.sin(tj) * ci - Math.cos(tj) * si;
            n++;
          }
        }
      }
      np[i] = this.f[i] + (this.freq[i] + (n ? (K / n) * ss : 0)) * dt;
    }
    for (let i = 0; i < N; i++) {
      let p = np[i];
      if (p >= 1) { p -= 1; this.b[i] = 1; }
      else if (p < 0) { p += 1; }
      this.f[i] = p;
    }
    const dec = Math.exp(-dt / o.decayTau);
    for (let i = 0; i < N; i++) {
      this.b[i] *= dec;
      if (this.b[i] > 0.75) this.brightTime[i] += dt;
    }
    const A = o.wanderAmp, t = this.t;
    for (let i = 0; i < N; i++) {
      this.x[i] = this.hx[i] + A * Math.sin(t * this.w1[i] + this.p1[i]);
      this.y[i] = this.hy[i] + A * Math.sin(t * this.w2[i] + this.p2[i]);
    }
    if (pointer && pointer.active) {
      const rand = this.rand;
      for (let i = 0; i < N; i++) {
        const dx = this.x[i] - pointer.x, dy = this.y[i] - pointer.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 75 * 75) {
          const d = Math.sqrt(d2) || 1;
          const fall = 1 - d / 75;
          this.f[i] = rand(); // tear: full phase scatter under the pointer
          this.x[i] += (dx / d) * 60 * dt * fall;
          this.y[i] += (dy / d) * 60 * dt * fall;
        }
      }
    }
  }

  order() {
    let s = 0, c = 0;
    for (let i = 0; i < this.N; i++) {
      const a = this.f[i] * 6.283185307;
      s += Math.sin(a); c += Math.cos(a);
    }
    return Math.sqrt(s * s + c * c) / this.N;
  }

  localOrder(cx, cy, rad) {
    let s = 0, c = 0, n = 0;
    const r2 = rad * rad;
    for (let i = 0; i < this.N; i++) {
      const dx = this.x[i] - cx, dy = this.y[i] - cy;
      if (dx * dx + dy * dy > r2) continue;
      const a = this.f[i] * 6.283185307;
      s += Math.sin(a); c += Math.cos(a); n++;
    }
    return n ? Math.sqrt(s * s + c * c) / n : 0;
  }

  stripPhaseStd(nStrips) {
    const W = this.W;
    const ss = new Float64Array(nStrips), cs = new Float64Array(nStrips);
    const ns = new Float64Array(nStrips);
    for (let i = 0; i < this.N; i++) {
      const s = Math.min(nStrips - 1, (this.x[i] / W * nStrips) | 0);
      const a = this.f[i] * 6.283185307;
      ss[s] += Math.sin(a); cs[s] += Math.cos(a); ns[s]++;
    }
    let ms = 0, mc = 0, k = 0;
    for (let s = 0; s < nStrips; s++) {
      if (!ns[s]) continue;
      const m = Math.atan2(ss[s] / ns[s], cs[s] / ns[s]);
      ms += Math.sin(m); mc += Math.cos(m); k++;
    }
    if (!k) return 0;
    const R = Math.sqrt(ms * ms + mc * mc) / k;
    return Math.sqrt(Math.max(0, -2 * Math.log(Math.max(R, 1e-9))));
  }

  scatter() { for (let i = 0; i < this.N; i++) this.f[i] = this.rand(); }

  storm(cx, cy, rad) {
    const r2 = rad * rad;
    for (let i = 0; i < this.N; i++) {
      const dx = this.x[i] - cx, dy = this.y[i] - cy;
      if (dx * dx + dy * dy < r2) this.f[i] = this.rand();
    }
  }

  dutyRange(totalT) {
    let mn = 1, mx = 0;
    for (let i = 0; i < this.N; i++) {
      const d = this.brightTime[i] / totalT;
      if (d < mn) mn = d; if (d > mx) mx = d;
    }
    return [mn, mx];
  }

  allFinite() {
    for (let i = 0; i < this.N; i++) {
      if (!isFinite(this.x[i] + this.y[i] + this.f[i] + this.b[i])) return false;
      if (this.f[i] < 0 || this.f[i] >= 1) return false;
    }
    return true;
  }
}

if (typeof module !== 'undefined') module.exports = { FireflyField, mulberry32 };

const MARKER = 'ENTRAINMENT-9116';

(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // Logical field: fixed height, width follows aspect.
  const LH = 800;
  let LW = 1200, scale = 1, ox = 0, oy = 0, dpr = 1;

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const cw = window.innerWidth, ch = window.innerHeight;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    const aspect = cw / ch;
    LW = Math.max(500, Math.min(1600, Math.round(LH * aspect)));
    scale = Math.max(canvas.width / LW, canvas.height / LH);
    ox = (canvas.width - LW * scale) / 2;
    oy = (canvas.height - LH * scale) / 2;
    initField();
  }

  // Warm sprite variants, pre-rendered.
  const VARIANTS = 4;
  const sprites = [];
  function makeSprites() {
    const tints = ['255,196,107', '255,214,140', '230,255,158', '255,178,92'];
    for (let v = 0; v < VARIANTS; v++) {
      const s = document.createElement('canvas');
      s.width = s.height = 64;
      const g = s.getContext('2d');
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,246,225,1)');
      grad.addColorStop(0.18, 'rgba(' + tints[v] + ',0.85)');
      grad.addColorStop(0.45, 'rgba(' + tints[v] + ',0.28)');
      grad.addColorStop(1, 'rgba(' + tints[v] + ',0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      sprites.push(s);
    }
  }

  let field = null;
  let variantOf = null;
  function initField() {
    // Preserve nothing across resize; a fresh field keeps the piece honest.
    field = new FireflyField(LW, LH, 420, {
      seed: (Math.random() * 1e9) | 0,
      K: 0.15, R: 130, baseFreq: 0.45, freqSigma: 0.06,
      clusters: 6, clusterSpread: 150, wanderAmp: 14, decayTau: 0.55,
    });
    variantOf = new Uint8Array(420);
    for (let i = 0; i < 420; i++) variantOf[i] = (Math.random() * VARIANTS) | 0;
  }

  // Pointer: drag tears desync through the field; tap scatters all phases.
  const pointer = { x: 0, y: 0, active: false };
  let downAt = 0, downX = 0, downY = 0, moved = 0;
  let ring = null; // faint ring while dragging

  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    const px = (e.clientX - r.left) * dpr, py = (e.clientY - r.top) * dpr;
    return { x: (px - ox) / scale, y: (py - oy) / scale };
  }
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    const p = toLogical(e);
    pointer.x = p.x; pointer.y = p.y; pointer.active = true;
    downAt = performance.now(); downX = p.x; downY = p.y; moved = 0;
    ring = { x: p.x, y: p.y };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pointer.active) return;
    e.preventDefault();
    const p = toLogical(e);
    moved += Math.abs(p.x - pointer.x) + Math.abs(p.y - pointer.y);
    pointer.x = p.x; pointer.y = p.y;
    ring = { x: p.x, y: p.y };
  });
  function endPointer(e) {
    if (!pointer.active) return;
    const dt = performance.now() - downAt;
    if (moved < 14 && dt < 450) field.scatter(); // tap: scatter to chaos
    pointer.active = false;
    ring = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  function frame(now) {
    requestAnimationFrame(frame);
    if (!field) return;
    const dt = Math.min(0.05, (now - (frame._last || now)) / 1000);
    frame._last = now;
    field.step(dt, pointer);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0a0d17';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, ox, oy);

    const N = field.N;
    for (let i = 0; i < N; i++) {
      const b = field.b[i];
      if (b < 0.02) continue;
      const s = 5 + 30 * b;
      ctx.globalAlpha = Math.min(1, b * 1.25);
      ctx.drawImage(sprites[variantOf[i]], field.x[i] - s / 2, field.y[i] - s / 2, s, s);
    }
    ctx.globalAlpha = 1;

    if (ring) {
      ctx.strokeStyle = 'rgba(255,220,160,0.35)';
      ctx.lineWidth = 1.5 / scale * dpr;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, 26, 0, 6.2832);
      ctx.stroke();
    }
  }

  makeSprites();
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
