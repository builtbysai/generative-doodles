<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Walkable Exhibition</title>
<style>html,body{margin:0;padding:0;background:#1a1d22;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var TAU = 6.283185307179586;
var VW = 0, VH = 0, curT = 0, startTs = null;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(1547000);

var FIELD = '#1a1d22', PATHDOT = '#6a6258', WAND = '#e8e0d0';
var SCOL = ['#c98f3d', '#a34a2e', '#c9a86a', '#5a7a72'];
var SP = [0.18, 0.42, 0.64, 0.86];
var SPEED = 0.025;

/* Schedule: out and back along the path, pausing at each station both ways.
   Outbound pauses are seeded draws in [10,20]; each station's return pause is
   30 minus its outbound pause, so every station's two pauses sum to 30 s.
   Travel totals 80 s, pauses total 120 s, so LOOP is exactly 200 s.
   Weighted phase time per station per loop is then identical for all four:
   0.6*80 + 1.0*30 + 0.35*90 = 109.5, and the phase advances exactly 8 cycles
   per loop, so the loop closes exactly. */
var outP = [];
for (var i = 0; i < 4; i++) outP.push(10 + 10 * rand());
var PAUSES = [outP[0], outP[1], outP[2], outP[3],
              30 - outP[3], 30 - outP[2], 30 - outP[1], 30 - outP[0]];
var segs = [];
function addTravel(from, to) {
  segs.push({ kind: 'travel', from: from, to: to, station: -1,
              dur: Math.abs(to - from) / SPEED });
}
function addPause(st, dur) {
  segs.push({ kind: 'pause', from: SP[st], to: SP[st], station: st, dur: dur });
}
addTravel(0, SP[0]); addPause(0, PAUSES[0]);
addTravel(SP[0], SP[1]); addPause(1, PAUSES[1]);
addTravel(SP[1], SP[2]); addPause(2, PAUSES[2]);
addTravel(SP[2], SP[3]); addPause(3, PAUSES[3]);
addTravel(SP[3], 1);
addTravel(1, SP[3]); addPause(3, PAUSES[4]);
addTravel(SP[3], SP[2]); addPause(2, PAUSES[5]);
addTravel(SP[2], SP[1]); addPause(1, PAUSES[6]);
addTravel(SP[1], SP[0]); addPause(0, PAUSES[7]);
addTravel(SP[0], 0);
var LOOP = 0;
for (var i = 0; i < segs.length; i++) LOOP += segs[i].dur;
var segStart = [0];
for (var i = 0; i < segs.length; i++) segStart.push(segStart[i] + segs[i].dur);
var WPHASE = 109.5;

function pathPoint(p) {
  var x = VW * (0.08 + 0.84 * p);
  var y = VH * (0.82 - 0.60 * p + 0.07 * Math.sin(p * TAU * 2 + 1.3)
               + 0.04 * Math.sin(p * TAU * 3.7 + 0.5));
  return [x, y];
}
function schedAt(tau) {
  var lt = ((tau % LOOP) + LOOP) % LOOP;
  var idx = 0;
  while (idx < segs.length - 1 && lt >= segStart[idx + 1]) idx++;
  var sg = segs[idx], el = lt - segStart[idx], u;
  if (sg.kind === 'pause') u = sg.from;
  else u = sg.from + (sg.to - sg.from) * (el / sg.dur);
  return { u: u, kind: sg.kind, station: sg.station, segIdx: idx,
           segElapsed: el, loopT: lt };
}
function segRate(sg, i) {
  if (sg.kind === 'pause') return (sg.station === i ? 1.0 : 0.35);
  return 0.6;
}
function phaseAt(tau, i) {
  var lt = ((tau % LOOP) + LOOP) % LOOP;
  var w = 0;
  for (var s = 0; s < segs.length; s++) {
    var sg = segs[s], r = segRate(sg, i);
    if (segStart[s] + sg.dur <= lt) w += r * sg.dur;
    else { w += r * Math.max(0, lt - segStart[s]); break; }
  }
  return (TAU * 8 * (w / WPHASE)) % TAU;
}

/* Recorded drag sessions. Holds freeze the adjusted clock while active;
   path drags move the wanderer toward recorded pointer targets at a capped
   speed and ease back to the schedule over 3 s after release. All state is
   a deterministic function of piece time plus these recorded sessions. */
var holds = [];
var pathDrags = [];

function adjustedTime(t) {
  var ivs = [];
  for (var k = 0; k < holds.length; k++) {
    var s = holds[k];
    if (!s.active) continue;
    var e = (s.end === null ? t : s.end);
    if (e > s.start && s.start < t) ivs.push([s.start, Math.min(e, t)]);
  }
  ivs.sort(function (a, b) { return a[0] - b[0]; });
  var shift = 0, cs = -1, ce = -1;
  for (var k = 0; k < ivs.length; k++) {
    var a = ivs[k][0], b = ivs[k][1];
    if (a > ce) { shift += Math.max(0, ce - cs); cs = a; ce = b; }
    else if (b > ce) { ce = b; }
  }
  shift += Math.max(0, ce - cs);
  return t - shift;
}
function smooth(e) { return e * e * (3 - 2 * e); }
function walkDrag(s, t) {
  /* Position after walking session s from its start up to time t (t inside
     the drag or at its end). Samples are (time, targetU) pairs. */
  var u = s.uStart, prevT = s.start, target = s.samples[0].u;
  var sm = s.samples;
  for (var k = 0; k < sm.length; k++) {
    if (sm[k].t > t) break;
    var dt = sm[k].t - prevT;
    if (dt > 0) {
      var d = target - u, step = 0.06 * dt;
      if (d > step) u += step; else if (d < -step) u -= step; else u = target;
    }
    target = sm[k].u; prevT = sm[k].t;
  }
  var dt2 = t - prevT;
  if (dt2 > 0) {
    var d2 = target - u, step2 = 0.06 * dt2;
    if (d2 > step2) u += step2; else if (d2 < -step2) u -= step2; else u = target;
  }
  return u;
}
function dispU(t, m) {
  /* Displayed wanderer position at time t, applying the first m path drags
     (m defaults to all). Each drag transforms the running position; the
     recursion into earlier sessions always moves to strictly earlier starts. */
  if (m === undefined) m = pathDrags.length;
  var tau = adjustedTime(t);
  var u = schedAt(tau).u;
  for (var k = 0; k < m; k++) {
    var s = pathDrags[k];
    if (s.start >= t) continue;
    var uStart = dispU(s.start, k);
    var s2 = { uStart: uStart, start: s.start, samples: s.samples };
    if (s.end === null || t <= s.end) {
      u = walkDrag(s2, t);
    } else {
      var uRel = walkDrag(s2, s.end);
      var e = (t - s.end) / 3;
      if (e >= 1) { /* back on schedule: u stays as running value */ }
      else u = uRel + (u - uRel) * smooth(e);
    }
  }
  return u;
}
function nearestParam(x, y) {
  var best = 0, bd = 1e18;
  for (var k = 0; k <= 200; k++) {
    var p = k / 200, pt = pathPoint(p);
    var dx = pt[0] - x, dy = pt[1] - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}
function distToPath(x, y) {
  var best = 1e18;
  for (var k = 0; k <= 120; k++) {
    var pt = pathPoint(k / 120);
    var dx = pt[0] - x, dy = pt[1] - y, d = dx * dx + dy * dy;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}
function openSession() {
  for (var k = 0; k < holds.length; k++) if (holds[k].end === null) return true;
  for (var k = 0; k < pathDrags.length; k++) if (pathDrags[k].end === null) return true;
  return false;
}
var dragKind = null;
function syncHook() {
  if (hook && typeof window !== 'undefined') { hook.dragKind = dragKind; window.__p47 = hook; }
}
function onDown(e) {
  if (openSession()) return;
  var x = e.clientX, y = e.clientY, md = Math.min(VW, VH);
  var bestSt = -1, bestD = 1e18;
  for (var i = 0; i < 4; i++) {
    var pt = pathPoint(SP[i]);
    var dx = pt[0] - x, dy = pt[1] - y, d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; bestSt = i; }
  }
  if (Math.sqrt(bestD) < 0.07 * md) {
    var tau0 = adjustedTime(curT);
    var sc = schedAt(tau0);
    holds.push({ station: bestSt, start: curT, end: null,
                 active: (sc.kind === 'pause' && sc.station === bestSt) });
    dragKind = 'station';
    syncHook();
    return;
  }
  if (distToPath(x, y) < 0.05 * md) {
    var p = nearestParam(x, y);
    pathDrags.push({ start: curT, end: null, samples: [{ t: curT, u: p }] });
    dragKind = 'path';
    syncHook();
  }
}
function onMove(e) {
  for (var k = pathDrags.length - 1; k >= 0; k--) {
    if (pathDrags[k].end === null) {
      pathDrags[k].samples.push({ t: curT, u: nearestParam(e.clientX, e.clientY) });
      return;
    }
  }
}
function onUp() {
  for (var k = holds.length - 1; k >= 0; k--) {
    if (holds[k].end === null) { holds[k].end = curT; dragKind = null; syncHook(); return; }
  }
  for (var k = pathDrags.length - 1; k >= 0; k--) {
    if (pathDrags[k].end === null) { pathDrags[k].end = curT; dragKind = null; syncHook(); return; }
  }
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);

function size() {
  var vw, vh;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  } else { vw = 720; vh = 720; }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function a4(x) { return Math.round(x * 10000) / 10000; }
function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

var hook = null;
function draw(t) {
  curT = t;
  var tau = adjustedTime(t);
  var sc = schedAt(tau);
  var u = dispU(t);
  var md = Math.min(VW, VH);
  ctx.fillStyle = FIELD;
  ctx.fillRect(0, 0, VW, VH);
  /* Dotted winding path. */
  ctx.fillStyle = PATHDOT;
  for (var k = 0; k <= 84; k++) {
    var pt = pathPoint(k / 84);
    var ds = Math.max(2, 0.004 * md);
    ctx.fillRect(pt[0] - ds / 2, pt[1] - ds / 2, ds, ds);
  }
  /* Stations. Brightness follows displayed wanderer proximity; animation
     phase follows the schedule clock, so a visited station runs fast. */
  var bright = [], phases = [], stXY = [];
  for (var i = 0; i < 4; i++) {
    var ap = pathPoint(SP[i]);
    stXY.push(ap);
    var b = 0.35 + 0.65 * clamp01(1 - Math.abs(u - SP[i]) / 0.12);
    bright.push(b);
    var ph = phaseAt(tau, i);
    phases.push(ph);
    var R = 0.055 * md;
    ctx.globalAlpha = a4(b);
    ctx.fillStyle = SCOL[i];
    ctx.strokeStyle = SCOL[i];
    if (i === 0) {
      /* Circle of dots, rotating. */
      var dd = Math.max(2, 0.011 * md);
      for (var d = 0; d < 8; d++) {
        var a = ph + d * TAU / 8;
        ctx.fillRect(ap[0] + R * Math.cos(a) - dd / 2,
                     ap[1] + R * Math.sin(a) - dd / 2, dd, dd);
      }
    } else if (i === 1) {
      /* Bars, swaying. */
      var bw = 0.014 * md, gap = 0.010 * md;
      var tot = 5 * bw + 4 * gap, x0 = ap[0] - tot / 2, base = ap[1] + R * 0.8;
      for (var b2 = 0; b2 < 5; b2++) {
        var hh = (0.020 + 0.025 * (0.5 + 0.5 * Math.sin(ph + b2 * 0.9))) * md;
        ctx.fillRect(x0 + b2 * (bw + gap), base - hh, bw, hh);
      }
    } else if (i === 2) {
      /* Pulsing ring. */
      ctx.lineWidth = Math.max(1.5, 0.008 * md);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(ap[0] + R * (0.8 + 0.25 * Math.sin(ph)), ap[1]);
      ctx.arc(ap[0], ap[1], R * (0.8 + 0.25 * Math.sin(ph)), 0, TAU);
      ctx.stroke();
    } else {
      /* Drifting line field. */
      ctx.lineWidth = Math.max(1.5, 0.006 * md);
      ctx.lineCap = 'butt';
      for (var l = 0; l < 6; l++) {
        var la = l * 1.047 + l * 0.31;
        var lr = (0.030 + (l % 3) * 0.012) * md;
        var cx = ap[0] + lr * Math.cos(la) + 0.012 * md * Math.sin(ph * 0.5 + l * 1.7);
        var cy = ap[1] + lr * Math.sin(la) + 0.012 * md * Math.cos(ph * 0.4 + l * 2.3);
        var ll = 0.030 * md;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + ll * Math.cos(la), cy + ll * Math.sin(la));
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
  /* Wanderer: pale bone disc with a short direction tick. */
  var wp = pathPoint(u);
  var pAhead = pathPoint(Math.min(1, u + 0.005));
  var pBack = pathPoint(Math.max(0, u - 0.005));
  var tx = pAhead[0] - pBack[0], ty = pAhead[1] - pBack[1];
  var tl = Math.sqrt(tx * tx + ty * ty) || 1;
  ctx.fillStyle = WAND;
  ctx.strokeStyle = WAND;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(wp[0] + 0.014 * md, wp[1]);
  ctx.arc(wp[0], wp[1], 0.014 * md, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(wp[0], wp[1]);
  ctx.lineTo(wp[0] + tx / tl * 0.022 * md, wp[1] + ty / tl * 0.022 * md);
  ctx.stroke();
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  hook = { loop: LOOP, u: u, schedU: sc.u, kind: sc.kind, station: sc.station,
           segIdx: sc.segIdx, brightness: bright, phase: phases,
           wandererXY: wp, stationXY: stXY, pathPoint: pathPoint,
           pauses: PAUSES, dragKind: dragKind };
  if (typeof window !== 'undefined') window.__p47 = hook;
}
size();
draw(0);
function loop(ts) {
  if (startTs === null) startTs = ts;
  var t = (ts - startTs) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script></body></html>
