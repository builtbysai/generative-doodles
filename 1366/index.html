<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiguex Dawn-to-Dusk</title>
<style>
html,body{margin:0;padding:0;background:#C9A86A;overflow:hidden}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var cv=document.getElementById('c');
var ctx=cv.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var INK='#2B2118', SEPIA_D='#7A5A2E', RIVER='#4A6B8A';
var SITES=[];
(function(){
  var r=mulberry32(1366000);
  for(var i=0;i<20;i++){SITES.push({x:0.08+0.84*r(), y:0.08+0.84*r(), g:i%5, j:(r()-0.5)*0.03});}
})();
var RIVER_PTS=[];
(function(){
  var r=mulberry32(1366000+977);
  var x=0.34;
  for(var i=0;i<=12;i++){RIVER_PTS.push({x:x, y:i/12}); x+= (r()-0.5)*0.16; if(x<0.18)x=0.18; if(x>0.55)x=0.55;}
})();
function quantTime(){
  var d=new Date();
  return {h:d.getHours(), m:d.getMinutes()};
}
function hourState(h){
  if(h>=5&&h<9)return{tint:'#E8A87C', a:0.22, edge:'E', name:'dawn'};
  if(h>=9&&h<17)return{tint:'#F2E6C9', a:0.14, edge:'X', name:'noon'};
  if(h>=17&&h<21)return{tint:'#7A3B4F', a:0.28, edge:'W', name:'dusk'};
  return{tint:'#101820', a:0.42, edge:'N', name:'night'};
}
function smooth(a,b,x){var t=(x-a)/(b-a); if(t<0)t=0; if(t>1)t=1; return t*t*(3-2*t);}
var panX=0, panY=0, dragging=false, lx=0, ly=0;
function size(){
  var vw=window.visualViewport?window.visualViewport.width:window.innerWidth;
  var vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
  cv.width=vw; cv.height=vh;
  cv.style.width=vw+'px'; cv.style.height=vh+'px';
}
function onDown(e){dragging=true; lx=e.clientX; ly=e.clientY;}
function onMove(e){
  if(!dragging)return;
  panX+=e.clientX-lx; panY+=e.clientY-ly;
  lx=e.clientX; ly=e.clientY;
  if(panX>180)panX=180; if(panX<-180)panX=-180;
  if(panY>180)panY=180; if(panY<-180)panY=-180;
}
function onUp(){dragging=false;}
cv.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
function glyph(g,x,y,s,col){
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=Math.max(1,s*0.12); ctx.lineCap='round';
  if(g===0){
    ctx.beginPath(); ctx.moveTo(x+s,y); ctx.arc(x,y,s,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+1,y); ctx.arc(x,y,Math.max(1,s*0.25),0,Math.PI*2); ctx.fill();
  }else if(g===1){
    ctx.beginPath(); ctx.moveTo(x-s,y+s*0.4); ctx.lineTo(x,y-s*0.6); ctx.lineTo(x+s,y+s*0.4); ctx.stroke();
  }else if(g===2){
    ctx.beginPath(); ctx.moveTo(x-s,y+s*0.3); ctx.arc(x,y-s*0.2,s*0.9,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
  }else if(g===3){
    ctx.beginPath(); ctx.moveTo(x-s,y); ctx.lineTo(x+s,y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-s); ctx.lineTo(x,y+s); ctx.stroke();
  }else{
    ctx.beginPath(); ctx.moveTo(x,y-s); ctx.lineTo(x+s,y); ctx.lineTo(x,y+s); ctx.lineTo(x-s,y); ctx.closePath(); ctx.stroke();
  }
}
function draw(){
  var W=cv.width, H=cv.height;
  if(!W||!H)return;
  var t=quantTime();
  var st=hourState(t.h);
  var MW=W+360, MH=H+360, ox=panX-180, oy=panY-180;
  ctx.fillStyle='#C9A86A'; ctx.fillRect(0,0,W,H);
  // river (winding, flat-alpha)
  ctx.strokeStyle=RIVER; ctx.globalAlpha=0.85; ctx.lineWidth=Math.max(10,MW*0.045); ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  for(var i=0;i<RIVER_PTS.length;i++){
    var rx=ox+RIVER_PTS[i].x*MW, ry=oy+RIVER_PTS[i].y*MH;
    if(i===0)ctx.moveTo(rx,ry);
    else{
      var px=ox+RIVER_PTS[i-1].x*MW, py=oy+RIVER_PTS[i-1].y*MH;
      ctx.quadraticCurveTo(px,py,(px+rx)/2,(py+ry)/2);
    }
  }
  var last=RIVER_PTS[RIVER_PTS.length-1];
  ctx.lineTo(ox+last.x*MW,oy+last.y*MH);
  ctx.stroke(); ctx.globalAlpha=1;
  // contour waves
  ctx.strokeStyle=SEPIA_D; ctx.globalAlpha=0.22; ctx.lineWidth=1;
  for(var j=0;j<6;j++){
    var cy=oy+(0.12+j*0.15)*MH;
    var rr=mulberry32(1366000+300+j);
    var ph=rr()*6.28, amp=8+rr()*14;
    ctx.beginPath();
    for(var x=ox-20;x<=ox+MW+20;x+=24){
      var yy=cy+Math.sin((x-ox)/MW*6.28*(1+j*0.3)+ph)*amp;
      if(x===ox-20)ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  // faint road lines
  ctx.strokeStyle=SEPIA_D; ctx.globalAlpha=0.18; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(ox,oy+MH*0.30); ctx.lineTo(ox+MW,oy+MH*0.42); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox+MW*0.20,oy); ctx.lineTo(ox+MW*0.28,oy+MH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox,oy+MH*0.72); ctx.lineTo(ox+MW,oy+MH*0.66); ctx.stroke();
  ctx.globalAlpha=1;
  // movement sites
  var curSite=t.h%20;
  for(var s=0;s<20;s++){
    var sx=ox+SITES[s].x*MW, sy=oy+SITES[s].y*MH;
    var sc=Math.max(7,Math.min(W,H)*0.016);
    if(s===curSite){
      ctx.strokeStyle=st.tint; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(sx+sc*1.9,sy); ctx.arc(sx,sy,sc*1.9,0,Math.PI*2); ctx.stroke();
      glyph(SITES[s].g,sx,sy,sc,INK);
    }else{
      ctx.globalAlpha=0.75;
      glyph(SITES[s].g,sx,sy,sc*0.8,INK);
      ctx.globalAlpha=1;
    }
    // pseudo-script label marks beside each site (dashes and dot pairs, never letters)
    ctx.strokeStyle=INK; ctx.globalAlpha=0.55; ctx.lineWidth=1;
    var lx0=sx+sc*2.4, ly0=sy-sc*0.4;
    ctx.beginPath(); ctx.moveTo(lx0,ly0); ctx.lineTo(lx0+sc*0.9,ly0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx0+sc*1.2,ly0); ctx.arc(lx0+sc*1.2,ly0,1.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(lx0+sc*1.7,ly0); ctx.arc(lx0+sc*1.7,ly0,1.2,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  // current hour's voices drifting in from the specced edge
  var csx=ox+SITES[curSite].x*MW, csy=oy+SITES[curSite].y*MH;
  var env=smooth(0,10,t.m)*(1-smooth(50,60,t.m));
  var vr=mulberry32(1366000+t.h*7919);
  var jit=[];
  for(var k=0;k<12;k++){jit.push(vr());}
  for(var v=0;v<12;v++){
    var startMin=v*5;
    if(t.m<startMin)continue;
    var span=60-startMin;
    var prog=(t.m-startMin)/span;
    if(prog>1)prog=1;
    var fade=smooth(0,0.15,prog)*(1-smooth(0.8,1,prog))*env;
    if(fade<=0)continue;
    var vy, vx, ex, ey;
    var frac=0.12+0.76*(v/11);
    if(st.edge==='E'){ex=W+30; ey=H*frac; vx=ex+(csx-ex)*prog; vy=ey+(csy-ey)*prog;}
    else if(st.edge==='W'){ex=-30; ey=H*frac; vx=ex+(csx-ex)*prog; vy=ey+(csy-ey)*prog;}
    else if(st.edge==='N'){ex=W*frac; ey=-30; vx=ex+(csx-ex)*prog; vy=ey+(csy-ey)*prog;}
    else{ex=W+30; ey=H*frac; vx=ex+(-30-ex)*prog; vy=ey;}
    var vs=Math.max(4,Math.min(W,H)*0.010);
    ctx.globalAlpha=fade*0.9;
    ctx.fillStyle=INK;
    ctx.beginPath(); ctx.moveTo(vx+vs,vy); ctx.arc(vx,vy,vs*0.45,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(vx+vs*0.4,vy-vs*0.4); ctx.lineTo(vx+vs*0.4,vy-vs*1.6); ctx.stroke();
    ctx.globalAlpha=1;
  }
  // hour tint overlay (flat alpha, never a gradient)
  ctx.globalAlpha=st.a; ctx.fillStyle=st.tint; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;
}
size();
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', function(){size(); draw();});
}
window.addEventListener('resize', function(){size(); draw();});
draw();
function loop(){
  draw();
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(loop);
}
if(typeof requestAnimationFrame==='function')requestAnimationFrame(loop);
})();
</script>
</body>
</html>
