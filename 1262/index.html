<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghillie Suit Parade</title>
<style>
  html, body { margin: 0; padding: 0; background: #EFEAE0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, PHONE = false;

function size() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  VW = vv ? vv.width : window.innerWidth;
  VH = vv ? vv.height : window.innerHeight;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  var minDim = Math.min(window.screen.width, window.screen.height);
  PHONE = (minDim < 700) || (VH > VW * 1.15);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  window.addEventListener('resize', size);
}
size();

// Seeded PRNG (mulberry32, integer hash only)
function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var GREENS = ['#5E6B3F', '#7A8A4A', '#4A5A33'];
var BURLAP = '#A68B5B';
var WALL = '#EFEAE0';
var FLOOR = '#DDD6C6';
var RUNWAY_LINE = '#C9C2B0';

var CYCLE = 30;          // seconds per parade slot (crossing + gap)
var CROSS = 22;          // crossing portion of the slot
var PHASE = 0.45 * CYCLE; // frame one: figure mid-runway, deterministic

// Event lists (closed-form state only)
var taps = [];    // {t, fig}
var drags = [];   // {start, end|null, fig}
var pending = null;

function pausedTotal(t) {
  var s = 0;
  for (var i = 0; i < drags.length; i++) {
    var d = drags[i];
    var e = (d.end === null) ? t : Math.min(d.end, t);
    if (e > d.start) s += e - d.start;
  }
  return s;
}
function paradeTime(t) { return PHASE + t - pausedTotal(t); }

// Per-figure generated data
function figureData(idx) {
  var r = rng(1262 * 1000 + idx * 77 + 13);
  var leaves = [];
  var n = 62 + Math.floor(r() * 22);
  for (var i = 0; i < n; i++) {
    var zone = r();
    var zx, zy, spread;
    if (zone < 0.42) { zx = (r() - 0.5) * 0.30; zy = -0.62 - r() * 0.30; spread = 0.10; }       // torso
    else if (zone < 0.58) { zx = (r() - 0.5) * 0.22; zy = -0.98 - r() * 0.10; spread = 0.08; }  // head
    else if (zone < 0.79) { zx = (r() < 0.5 ? -1 : 1) * (0.16 + r() * 0.10); zy = -0.90 + r() * 0.35; spread = 0.09; } // arms
    else { zx = (r() < 0.5 ? -1 : 1) * (0.06 + r() * 0.08); zy = -0.42 + r() * 0.40; spread = 0.09; } // legs
    leaves.push({
      zx: zx, zy: zy, ang: r() * Math.PI * 2, len: 0.030 + r() * 0.035,
      col: GREENS[Math.floor(r() * 3)], ph: r() * Math.PI * 2,
      per: 18 + r() * 12, off: r()
    });
  }
  return { fh: 0.42 + r() * 0.08, gait: 0.85 + r() * 0.3, leaves: leaves, seed: idx };
}

function addedLeaves(fig, tapCount) {
  var out = [];
  for (var k = 0; k < tapCount; k++) {
    var r = rng(fig * 100000 + k * 31 + 7);
    for (var j = 0; j < 20; j++) {
      out.push({
        zx: (r() - 0.5) * 0.42, zy: -1.02 + r() * 0.98,
        ang: r() * Math.PI * 2, len: 0.030 + r() * 0.035,
        col: GREENS[Math.floor(r() * 3)], ph: r() * Math.PI * 2,
        tap: k, grow: 0.8
      });
    }
  }
  return out;
}

// Shed leaves: while a figure is posed (drag held), leaves shake loose at 2/s;
// they regrow 8 s after the drag ends. Closed-form from drag list.
function shedState(fig, t) {
  var shed = 0, regrown = 0;
  for (var i = 0; i < drags.length; i++) {
    var d = drags[i];
    if (d.fig !== fig) continue;
    var e = (d.end === null) ? t : d.end;
    var held = Math.max(0, e - d.start);
    shed += Math.floor(held * 2);
    if (d.end !== null) {
      var back = Math.max(0, t - d.end - 8);
      regrown += Math.floor(back * 4);
    }
  }
  var net = Math.max(0, shed - regrown);
  return net;
}

function drawLeaf(x, y, ang, len, col, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(0, 0, len, len * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function draw(t) {
  ctx.fillStyle = WALL;
  ctx.fillRect(0, 0, VW, VH);
  var yFloor = Math.floor(VH * 0.72);
  ctx.fillStyle = FLOOR;
  ctx.fillRect(0, yFloor, VW, VH - yFloor);
  ctx.fillStyle = RUNWAY_LINE;
  ctx.fillRect(0, yFloor, VW, 3);
  // runway side ticks
  ctx.fillStyle = '#CFC8B4';
  for (var tx = 0; tx < VW; tx += 90) ctx.fillRect(tx, yFloor + 26, 34, 2);

  var pt = paradeTime(t);
  var slot = Math.floor(pt / CYCLE);
  var local = pt - slot * CYCLE;
  if (local < CROSS) {
    var fd = figureData(((slot % 1000) + 1000) % 1000);
    var fh = Math.min(VH * fd.fh, PHONE ? VH * 0.40 : 380);
    var u = local / CROSS; // 0..1 across
    var fx = -120 + (VW + 240) * u;
    var walkPh = pt * 2.4 * fd.gait;
    var bob = Math.abs(Math.sin(walkPh)) * fh * 0.02;

    // pose blend from active drag on this figure
    var pose = 0, frozenPh = walkPh;
    for (var di = 0; di < drags.length; di++) {
      var d = drags[di];
      if (d.fig === slot && d.end === null) {
        pose = Math.min(1, (t - d.start) / 0.4);
        frozenPh = (typeof d.ph === 'number') ? d.ph : walkPh;
      }
    }
    var wp = pose > 0 ? frozenPh : walkPh;
    var legSwing = Math.sin(wp) * 0.5 * (1 - pose);
    var armSwing = Math.sin(wp + Math.PI) * 0.45 * (1 - pose);
    var lean = pose * 0.10;

    var hipY = yFloor - fh * 0.52 - bob;
    var shoY = yFloor - fh * 0.86 - bob;
    var headY = yFloor - fh * 0.97 - bob;
    var headR = fh * 0.085;

    // tap count on this figure -> added leaves
    var tapCount = 0;
    for (var ti = 0; ti < taps.length; ti++) if (taps[ti].fig === slot) tapCount++;
    var shed = shedState(slot, t);

    // body anchors for leaves
    function anchor(zx, zy) {
      return { x: fx + zx * fh + lean * fh * 0.4, y: yFloor + zy * fh - bob };
    }

    // visible leaf count (for naked-outline rule)
    var baseLeaves = fd.leaves;
    var add = addedLeaves(slot, tapCount);
    var visCount = 0;
    // count ambient-cycle visible leaves
    for (var li = 0; li < baseLeaves.length; li++) {
      if (li < shed) continue;
      var L = baseLeaves[li];
      var cyc = ((t + L.off * L.per) % L.per) / L.per;
      if (cyc < 0.60 || cyc >= 0.80) visCount++;
    }
    visCount += add.length;
    var naked = visCount === 0;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (naked) {
      // naked outline only
      ctx.strokeStyle = '#8A7A5E'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(fx, hipY); ctx.lineTo(fx - fh * 0.07, yFloor); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx, hipY); ctx.lineTo(fx + fh * 0.07, yFloor); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx, hipY); ctx.lineTo(fx, shoY); ctx.stroke();
      ctx.beginPath(); ctx.arc(fx, headY, headR, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx, shoY); ctx.lineTo(fx - fh * 0.16, shoY + fh * 0.22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx, shoY); ctx.lineTo(fx + fh * 0.16, shoY + fh * 0.22); ctx.stroke();
    } else {
      // burlap silhouette: thick strokes + head
      ctx.strokeStyle = BURLAP;
      ctx.lineWidth = Math.max(6, fh * 0.085);
      var legA = legSwing, legB = -legSwing;
      if (pose > 0) { legB = 0.55 * pose; legA = -0.10 * pose; }
      ctx.beginPath(); ctx.moveTo(fx, hipY); ctx.lineTo(fx + Math.sin(legA) * fh * 0.52, yFloor); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx, hipY); ctx.lineTo(fx + Math.sin(legB) * fh * 0.52, yFloor); ctx.stroke();
      ctx.lineWidth = Math.max(10, fh * 0.15);
      ctx.beginPath(); ctx.moveTo(fx, hipY); ctx.lineTo(fx + lean * fh * 0.4, shoY); ctx.stroke();
      ctx.lineWidth = Math.max(6, fh * 0.075);
      var armA = armSwing, armB = -armSwing;
      if (pose > 0) { armA = -1.15 * pose; armB = -1.15 * pose; }
      ctx.beginPath(); ctx.moveTo(fx + lean * fh * 0.4, shoY); ctx.lineTo(fx + lean * fh * 0.4 - fh * 0.18 + Math.sin(armA) * fh * 0.10, shoY + fh * 0.30); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx + lean * fh * 0.4, shoY); ctx.lineTo(fx + lean * fh * 0.4 + fh * 0.18 + Math.sin(armB) * fh * 0.10, shoY + fh * 0.30); ctx.stroke();
      ctx.fillStyle = BURLAP;
      ctx.beginPath(); ctx.arc(fx + lean * fh * 0.4, headY, headR, 0, Math.PI * 2); ctx.fill();

      // leaves: ambient cycle (rustle / drift / regrow)
      for (var k = 0; k < baseLeaves.length; k++) {
        if (k < shed) continue;
        var Lf = baseLeaves[k];
        var cy = ((t + Lf.off * Lf.per) % Lf.per) / Lf.per;
        var a = anchor(Lf.zx, Lf.zy);
        var rust = Math.sin(t * 2.2 + Lf.ph) * fh * 0.012;
        var rang = Lf.ang + Math.sin(t * 3 + Lf.ph) * 0.15 + (pose > 0 ? Math.sin(t * 9 + Lf.ph) * 0.25 * pose : 0);
        if (cy < 0.60) {
          drawLeaf(a.x + rust, a.y, rang, Lf.len * fh, Lf.col, 1);
        } else if (cy < 0.80) {
          var dp = (cy - 0.60) / 0.20;
          drawLeaf(a.x - dp * fh * 0.10 + rust, a.y + dp * fh * 0.22, rang + dp * 1.2, Lf.len * fh, Lf.col, 1 - dp);
        } else {
          var gp = (cy - 0.80) / 0.20;
          drawLeaf(a.x + rust, a.y, rang, Lf.len * fh * gp, Lf.col, 1);
        }
      }
      // tap-added leaves grow in over 0.8 s
      for (var aj = 0; aj < add.length; aj++) {
        var Al = add[aj];
        var tapT = null;
        var seen = -1;
        for (var tj = 0; tj < taps.length; tj++) {
          if (taps[tj].fig === slot) { seen++; if (seen === Al.tap) { tapT = taps[tj].t; break; } }
        }
        var g = tapT === null ? 1 : Math.min(1, (t - tapT) / 0.8);
        var aa = anchor(Al.zx, Al.zy);
        drawLeaf(aa.x + Math.sin(t * 2.2 + Al.ph) * fh * 0.012, aa.y, Al.ang, Al.len * fh * Math.max(0.05, g), Al.col, 1);
      }
    }
  }
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}

function toLocal(e) {
  var r = (canvas.getBoundingClientRect) ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function figureAt(x, y, t) {
  var pt = paradeTime(t);
  var slot = Math.floor(pt / CYCLE);
  var local = pt - slot * CYCLE;
  if (local >= CROSS) return -1;
  var fd = figureData(((slot % 1000) + 1000) % 1000);
  var fh = Math.min(VH * fd.fh, PHONE ? VH * 0.40 : 380);
  var u = local / CROSS;
  var fx = -120 + (VW + 240) * u;
  var yFloor = Math.floor(VH * 0.72);
  if (Math.abs(x - fx) < fh * 0.35 && y > yFloor - fh * 1.1 && y < yFloor + 10) return slot;
  return -1;
}
var T0 = 0;
function nowT() {
  if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
  return 0;
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toLocal(e);
  var t = nowT() - T0;
  var fig = figureAt(p.x, p.y, t);
  if (fig >= 0) pending = { x: p.x, y: p.y, t: t, fig: fig, moved: false };
});
canvas.addEventListener('pointermove', function (e) {
  if (!pending) return;
  var p = toLocal(e);
  var t = nowT() - T0;
  if (!pending.moved && (Math.abs(p.x - pending.x) > 12 || Math.abs(p.y - pending.y) > 12)) {
    pending.moved = true;
    var gfd = figureData(((pending.fig % 1000) + 1000) % 1000);
    drags.push({ start: pending.t, end: null, fig: pending.fig, ph: paradeTime(pending.t) * 2.4 * gfd.gait });
  }
});
function endPointer(e) {
  if (!pending) return;
  var t = nowT() - T0;
  if (pending.moved) {
    for (var i = drags.length - 1; i >= 0; i--) {
      if (drags[i].fig === pending.fig && drags[i].end === null) { drags[i].end = t; break; }
    }
  } else if (t - pending.t < 0.6) {
    taps.push({ t: t, fig: pending.fig });
  }
  pending = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
T0 = start / 1000;
function loop() {
  var t = ((typeof performance !== 'undefined' && performance.now) ? performance.now() : 0) / 1000 - T0;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
draw(0);
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
