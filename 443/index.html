<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Echo Chamber</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1E2A8A; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;
  var OFFSET = 4.0; // constant loop phase for the synchronous first frame

  var GROUND = '#1E2A8A';
  var HAND = '#2E3D6E';
  var GLOW = '#8FA3E8';
  var GLASS = '#0E1440';
  var GILT = '#C89B3C';
  var GILT_HI = '#F5D78E';
  var CREAM = '#FFE9C9';
  var WHITE = '#FFFFFF';

  var W = 720, H = 720, PHONE = false;

  function resize() {
    var w, h;
    if (window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
    else { w = window.innerWidth; h = window.innerHeight; }
    W = Math.max(50, Math.round(w)); H = Math.max(50, Math.round(h));
    canvas.width = W; canvas.height = H;
    var sw = window.screen ? window.screen.width : W;
    var sh = window.screen ? window.screen.height : H;
    PHONE = Math.min(sw, sh) < 700 || (H > W * 1.15 && Math.min(W, H) < 700);
  }

  function layout() {
    var u = Math.min(W, H);
    var tilt = -8 * Math.PI / 180;
    var mx = 0.21 * W, my = 0.50 * H;
    var rx = 0.185 * W, ry = 0.36 * u;
    var tx = mx + rx * Math.cos(tilt), ty = my + rx * Math.sin(tilt);
    return { u: u, tilt: tilt, mx: mx, my: my, rx: rx, ry: ry, tx: tx, ty: ty, s: 0.42 * u };
  }

  // ---- state -------------------------------------------------------------
  var handOff = { x: 0, y: 0 };       // eased drag offset, in u units
  var handTarget = { x: 0, y: 0 };    // drag target, in u units
  var history = [];                   // {t, x, y} hand offsets, for the 1.5 s lag
  var pointer = { x: -9999, y: -9999 };
  var drag = { active: false, ox: 0, oy: 0, sx: 0, sy: 0 };
  var caught = 0;                     // fixed authored table: 0 star, 1 key, 2 seed
  var lastTap = -1e9, lastTapX = 0, lastTapY = 0;
  var lastT = OFFSET;

  function idle(t) {
    return { x: 0.006 * Math.sin(TAU * t / 9), y: 0.008 * Math.sin(TAU * t / 7 + 1) };
  }

  function sampleHistory(tt) {
    if (!history.length) return { x: handOff.x, y: handOff.y };
    var s = history[0];
    for (var i = 0; i < history.length; i++) {
      if (history[i].t <= tt) s = history[i]; else break;
    }
    return s;
  }

  function rnd(i, k) {
    var x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  // ---- shapes ------------------------------------------------------------
  function sparklePath(cx, cy, r) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.quadraticCurveTo(cx, cy - r * 0.18, cx + r, cy);
    ctx.quadraticCurveTo(cx, cy + r * 0.18, cx, cy + r);
    ctx.quadraticCurveTo(cx, cy - r * 0.18, cx - r, cy);
    ctx.quadraticCurveTo(cx, cy + r * 0.18, cx, cy - r);
    ctx.closePath();
  }

  function palmPath() {
    ctx.beginPath();
    ctx.moveTo(0.92, -0.20);
    ctx.bezierCurveTo(0.55, -0.30, 0.25, -0.38, 0.02, -0.37);
    ctx.bezierCurveTo(-0.12, -0.36, -0.16, -0.20, -0.15, -0.02);
    ctx.bezierCurveTo(-0.14, 0.18, -0.08, 0.34, 0.06, 0.40);
    ctx.bezierCurveTo(0.30, 0.49, 0.65, 0.42, 0.92, 0.30);
    ctx.bezierCurveTo(1.02, 0.25, 1.02, -0.15, 0.92, -0.20);
    ctx.closePath();
  }

  var FINGERS = [
    { b: [-0.02, -0.30], tip: [-0.56, -0.35], w: 0.145 },  // index
    { b: [ 0.00, -0.10], tip: [-0.62, -0.12], w: 0.150 },  // middle
    { b: [ 0.00,  0.10], tip: [-0.54,  0.11], w: 0.140 },  // ring
    { b: [-0.02,  0.28], tip: [-0.42,  0.33], w: 0.115 }   // pinky
  ];
  var THUMB = { b: [0.18, 0.22], tip: [-0.30, 0.52], w: 0.140 };

  function fingerStroke(f, lenMul, t, idx, bend) {
    var bx = f.b[0], by = f.b[1];
    var txp = bx + (f.tip[0] - bx) * lenMul;
    var typ = by + (f.tip[1] - by) * lenMul;
    var mxp = bx + (txp - bx) * 0.55, myp = by + (typ - by) * 0.55 + bend;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(mxp, myp, txp, typ);
    ctx.stroke();
    return { mx: mxp, my: myp, tx: txp, ty: typ, bx: bx, by: by };
  }

  function drawCaught(kind, x, y, r) {
    if (kind === 0) { // star
      sparklePath(x, y, r * 1.9);
      ctx.fillStyle = 'rgba(255,255,255,0.30)';
      ctx.fill();
      sparklePath(x, y, r);
      ctx.fillStyle = WHITE;
      ctx.fill();
    } else if (kind === 1) { // key
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.4);
      ctx.strokeStyle = GILT;
      ctx.lineWidth = r * 0.24;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(-r * 0.55, 0, r * 0.52, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = GILT_HI;
      ctx.beginPath();
      ctx.moveTo(-r * 0.05, 0);
      ctx.lineTo(r * 1.25, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(r * 0.85, 0);
      ctx.lineTo(r * 0.85, r * 0.5);
      ctx.moveTo(r * 1.25, 0);
      ctx.lineTo(r * 1.25, r * 0.62);
      ctx.stroke();
      ctx.restore();
    } else { // seed
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.bezierCurveTo(x + r * 0.75, y - r * 0.25, x + r * 0.62, y + r * 0.55, x, y + r);
      ctx.bezierCurveTo(x - r * 0.62, y + r * 0.55, x - r * 0.75, y - r * 0.25, x, y - r);
      ctx.closePath();
      ctx.fillStyle = CREAM;
      ctx.fill();
      ctx.strokeStyle = GILT;
      ctx.lineWidth = r * 0.15;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y - r * 0.5);
      ctx.quadraticCurveTo(x + r * 0.22, y, x + r * 0.05, y + r * 0.45);
      ctx.stroke();
    }
  }

  // One articulated bezier hand. Local space: fingers point -x, wrist at +x.
  // flip=true draws the mirror twin (fingers +x, wrist toward the glass edge).
  function drawHand(cx, cy, s, flip, lenMul, t, caughtIdx) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(0.03 * Math.sin(TAU * t / 13) * (flip ? -1 : 1));
    ctx.scale(flip ? -s : s, s);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var i, f, bend, drawn = [];

    // glow pass
    ctx.strokeStyle = 'rgba(143,163,232,0.45)';
    for (i = 0; i < FINGERS.length; i++) {
      f = FINGERS[i];
      bend = 0.025 + 0.018 * Math.sin(TAU * t / 11 + i * 1.3);
      ctx.lineWidth = f.w + 0.05;
      drawn.push(fingerStroke(f, lenMul, t, i, bend));
    }
    ctx.lineWidth = THUMB.w + 0.05;
    fingerStroke(THUMB, lenMul, t, 4, 0.02);
    palmPath();
    ctx.lineWidth = 0.05;
    ctx.stroke();

    // main finger pass
    ctx.strokeStyle = HAND;
    drawn = [];
    for (i = 0; i < FINGERS.length; i++) {
      f = FINGERS[i];
      bend = 0.025 + 0.018 * Math.sin(TAU * t / 11 + i * 1.3);
      ctx.lineWidth = f.w;
      drawn.push(fingerStroke(f, lenMul, t, i, bend));
    }

    // palm
    palmPath();
    ctx.fillStyle = HAND;
    ctx.fill();
    ctx.strokeStyle = 'rgba(143,163,232,0.85)';
    ctx.lineWidth = 0.012;
    ctx.stroke();

    // thumb over the palm edge
    ctx.strokeStyle = 'rgba(143,163,232,0.45)';
    ctx.lineWidth = THUMB.w + 0.05;
    fingerStroke(THUMB, lenMul, t, 4, 0.02);
    ctx.strokeStyle = HAND;
    ctx.lineWidth = THUMB.w;
    fingerStroke(THUMB, lenMul, t, 4, 0.02);

    // finger sheen
    ctx.strokeStyle = 'rgba(200,214,255,0.32)';
    for (i = 0; i < drawn.length; i++) {
      var d = drawn[i];
      ctx.lineWidth = FINGERS[i].w * 0.38;
      ctx.beginPath();
      ctx.moveTo(d.bx, d.by - FINGERS[i].w * 0.22);
      ctx.quadraticCurveTo(d.mx, d.my - FINGERS[i].w * 0.22, d.tx, d.ty - FINGERS[i].w * 0.18);
      ctx.stroke();
    }

    // palm sheen
    ctx.save();
    palmPath();
    ctx.clip();
    var pg = ctx.createRadialGradient(-0.08, -0.16, 0.05, -0.08, -0.16, 0.8);
    pg.addColorStop(0, 'rgba(190,205,255,0.30)');
    pg.addColorStop(1, 'rgba(190,205,255,0)');
    ctx.fillStyle = pg;
    ctx.fillRect(-0.35, -0.65, 1.55, 1.35);
    ctx.restore();

    // knuckle creases
    ctx.strokeStyle = 'rgba(14,20,64,0.35)';
    ctx.lineWidth = 0.014;
    ctx.beginPath();
    ctx.arc(0.20, 0.03, 0.17, Math.PI * 0.35, Math.PI * 0.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0.33, -0.12, 0.12, Math.PI * 0.4, Math.PI * 0.95);
    ctx.stroke();

    if (caughtIdx >= 0) drawCaught(caughtIdx, 0.02, 0.07, 0.062);
    ctx.restore();
  }

  // ---- mirror --------------------------------------------------------------
  function drawMirrorFrame(L) {
    ctx.save();
    ctx.translate(L.mx, L.my);
    ctx.rotate(L.tilt);
    var g = ctx.createLinearGradient(-L.rx, -L.ry, L.rx, L.ry);
    g.addColorStop(0, GILT_HI);
    g.addColorStop(0.45, GILT);
    g.addColorStop(1, '#7D5A1E');
    ctx.beginPath();
    ctx.ellipse(0, 0, L.rx, L.ry, 0, 0, TAU);
    ctx.fillStyle = g;
    ctx.fill();
    // bevel ring
    ctx.beginPath();
    ctx.ellipse(0, 0, L.rx * 0.90, L.ry * 0.93, 0, 0, TAU);
    ctx.fillStyle = '#8A6420';
    ctx.fill();
    // beaded inner ring: zero-length dashes with round caps
    var a = L.rx * 0.945, b = L.ry * 0.96;
    var per = Math.PI * (3 * (a + b) - Math.sqrt((3 * a + b) * (a + 3 * b)));
    var beads = 72, sp = per / beads;
    ctx.beginPath();
    ctx.ellipse(0, 0, a, b, 0, 0, TAU);
    ctx.setLineDash([0.01, Math.max(0.02, sp - 0.01)]);
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(2, 0.011 * L.u);
    ctx.strokeStyle = GILT_HI;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineCap = 'butt';
    // rim highlight arc
    ctx.beginPath();
    ctx.ellipse(0, 0, L.rx * 0.985, L.ry * 0.985, 0, Math.PI * 1.05, Math.PI * 1.55);
    ctx.strokeStyle = 'rgba(245,215,142,0.85)';
    ctx.lineWidth = Math.max(2, 0.004 * L.u);
    ctx.stroke();
    ctx.restore();
  }

  function glassPath(L) {
    ctx.beginPath();
    ctx.ellipse(L.mx, L.my, L.rx * 0.865, L.ry * 0.905, L.tilt, 0, TAU);
  }

  function drawGlass(L) {
    glassPath(L);
    var gg = ctx.createRadialGradient(L.mx - L.rx * 0.3, L.my - L.ry * 0.35, 10, L.mx, L.my, L.ry * 1.05);
    gg.addColorStop(0, '#1B2560');
    gg.addColorStop(0.55, GLASS);
    gg.addColorStop(1, '#070B28');
    ctx.fillStyle = gg;
    ctx.fill();
  }

  function drawSheen(L) {
    ctx.save();
    glassPath(L);
    ctx.clip();
    var sg = ctx.createLinearGradient(L.mx - L.rx, L.my - L.ry, L.mx + L.rx * 0.4, L.my + L.ry);
    sg.addColorStop(0, 'rgba(220,230,255,0.10)');
    sg.addColorStop(0.4, 'rgba(220,230,255,0.02)');
    sg.addColorStop(0.65, 'rgba(220,230,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(L.mx - L.rx * 1.2, L.my - L.ry * 1.2, L.rx * 2.4, L.ry * 2.4);
    ctx.restore();
  }

  // ---- particles -----------------------------------------------------------
  function drawParticles(L, t) {
    var u = L.u;
    var spin = Math.max(0.6, u / 720);
    for (var i = 0; i < 120; i++) {
      var ang = rnd(i, 1) * TAU;
      var rad = (0.015 + 0.30 * Math.pow(rnd(i, 2), 1.6)) * u;
      var p = (t / 20 + rnd(i, 3)) % 1;
      var R = rad * (1 - 0.82 * p);
      var a = ang + 0.35 * p + 0.05 * Math.sin(TAU * t / 17 + i);
      var px = L.tx + Math.cos(a) * R * 1.15;
      var py = L.ty + Math.sin(a) * R * 0.92;
      // swirl around the pointer path
      var dxp = px - pointer.x, dyp = py - pointer.y;
      var dp = Math.sqrt(dxp * dxp + dyp * dyp);
      if (dp < 0.20 * u && dp > 0.001) {
        var infl = 1 - dp / (0.20 * u);
        var ca = Math.cos(infl * 0.9), sa = Math.sin(infl * 0.9);
        px = pointer.x + dxp * ca - dyp * sa;
        py = pointer.y + dxp * sa + dyp * ca;
      }
      var alpha = Math.sin(Math.PI * p) * 0.85;
      if (alpha <= 0.01) continue;
      var sz = (1.0 + 2.0 * rnd(i, 4)) * spin * (1 - 0.35 * p);
      ctx.fillStyle = 'rgba(255,233,201,' + alpha.toFixed(3) + ')';
      if (rnd(i, 5) > 0.45) {
        sparklePath(px, py, sz * 1.6);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(px, py, sz * 0.5, 0, TAU);
        ctx.fill();
      }
    }
  }

  // ---- main draw -------------------------------------------------------------
  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var L = layout();
    var u = L.u;

    // ground
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var halo = ctx.createRadialGradient(L.mx, L.my, 10, L.mx, L.my, L.ry * 1.6);
    halo.addColorStop(0, 'rgba(143,163,232,0.12)');
    halo.addColorStop(1, 'rgba(143,163,232,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);

    // hand positions: real hand eased, reflection from the 1.5 s-old sample
    var io = idle(t);
    var hx = (io.x + handOff.x) * u, hy = (io.y + handOff.y) * u;
    var lag = sampleHistory(t - 1.5);
    var lio = idle(t - 1.5);
    var rhx = (lio.x + lag.x) * u, rhy = (lio.y + lag.y) * u;

    var gap = 0.014 * u;
    var Px = L.tx + gap + 0.56 * L.s + hx;
    var Py = L.ty + 0.35 * L.s + hy;
    var s2 = L.s * 0.92;
    var RPx = L.tx - gap - 0.644 * s2 - rhx * 0.25;
    var RPy = L.ty + 0.35 * s2 + rhy;

    drawMirrorFrame(L);
    drawGlass(L);

    // reflection, clipped to the glass
    ctx.save();
    glassPath(L);
    ctx.clip();
    var rg = ctx.createRadialGradient(RPx, RPy, 5, RPx, RPy, s2 * 1.1);
    rg.addColorStop(0, 'rgba(143,163,232,0.16)');
    rg.addColorStop(1, 'rgba(143,163,232,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(L.mx - L.rx, L.my - L.ry, L.rx * 2, L.ry * 2);
    ctx.globalAlpha = 0.94;
    drawHand(RPx, RPy, s2, true, 1.16, t, caught);
    ctx.globalAlpha = 1;
    ctx.restore();
    drawSheen(L);

    if (pointer.x < -999) { pointer.x = L.tx; pointer.y = L.ty; }
    drawParticles(L, t);

    // the real hand
    drawHand(Px, Py, L.s, false, 1.0, t, -1);

    // glint where the fingertips nearly meet
    var tw = 0.012 * u + 0.003 * u * Math.sin(TAU * t / 6);
    sparklePath(L.tx, L.ty, tw);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
    sparklePath(L.tx, L.ty, tw * 0.45);
    ctx.fillStyle = CREAM;
    ctx.fill();

    // vignette
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
    vg.addColorStop(0, 'rgba(6,8,32,0)');
    vg.addColorStop(1, 'rgba(6,8,32,0.35)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- interaction -----------------------------------------------------------
  function evPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = evPos(e);
    pointer.x = p.x; pointer.y = p.y;
    drag.active = true; drag.ox = p.x; drag.oy = p.y;
    drag.sx = handTarget.x; drag.sy = handTarget.y;
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (now - lastTap < 380 && Math.abs(p.x - lastTapX) < 48 && Math.abs(p.y - lastTapY) < 48) {
      caught = (caught + 1) % 3;
      lastTap = -1e9;
    } else {
      lastTap = now; lastTapX = p.x; lastTapY = p.y;
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = evPos(e);
    pointer.x = p.x; pointer.y = p.y;
    if (drag.active) {
      var u = Math.min(W, H);
      var nx = drag.sx + (p.x - drag.ox) / u;
      var ny = drag.sy + (p.y - drag.oy) / u;
      handTarget.x = Math.max(-0.16, Math.min(0.16, nx));
      handTarget.y = Math.max(-0.16, Math.min(0.16, ny));
    }
  });
  function endDrag() { drag.active = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  if (window.addEventListener) window.addEventListener('pointerup', endDrag);

  function onResize() { resize(); draw(lastT); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  if (window.addEventListener) window.addEventListener('resize', onResize);

  // ---- loop --------------------------------------------------------------------
  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    var t = OFFSET + (now - startStamp) / 1000;
    handOff.x += (handTarget.x - handOff.x) * 0.12;
    handOff.y += (handTarget.y - handOff.y) * 0.12;
    history.push({ t: t, x: handOff.x, y: handOff.y });
    while (history.length > 300) history.shift();
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  resize();
  draw(OFFSET);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
