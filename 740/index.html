<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walden Rope</title>
<style>
  html, body { margin: 0; padding: 0; background: #0C1210; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var GROUND = '#0C1210';
  var HEMP   = '#8A6F4D';
  var PAPER  = '#EFE9D8';
  var INK    = '#2B2B28';
  // water-green ramp, light to dark
  var GREENS = ['#6B8A7D', '#587A6B', '#3E6B5E', '#2E4F48'];

  var REST_DEPTH = 11.3;   // metres at rest
  var MAX_DEPTH  = 30;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, PHONE = false;

  // ---- seeded RNG (mulberry32) ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Per-tag seeded attributes, a pure function of the tag index k.
  function tagSeed(k) {
    var r = mulberry32(0x9E3779B9 ^ (k * 2654435761));
    return {
      slotJitter: (r() - 0.5) * 0.55,      // position inside its slot
      swayPhase: r() * Math.PI * 2,
      swayAmp: 0.045 + r() * 0.035,        // radians
      swaySpeed: 0.75 + r() * 0.5,
      stringF: 0.8 + r() * 0.5,            // string length factor
      depthBase: 3 + r() * 22,             // this tag's own sounding, metres
      toneJitter: r(),                     // swatch jitter roll
      wob: [r(), r(), r(), r(), r(), r(), r(), r()] // swatch corner wobble
    };
  }

  // ---- interaction state (recorded control) ----
  var depth = REST_DEPTH;        // current eased depth
  var depthTarget = REST_DEPTH;  // drag target, or rest when released
  var dragging = false;
  var dragStartY = 0, dragStartDepth = REST_DEPTH;
  var windowOffset = 0;          // tag stream position, in tag units
  var lastDepthForWindow = REST_DEPTH;

  function visibleCount() {
    if (PHONE) return 24;
    if (W < 950) return 26;   // square-ish frames: fewer, larger tags
    return 40;
  }

  function fit() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    PHONE = sw < 700 || H > W * 1.15;
  }

  if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { fit(); draw(lastT); });
  window.addEventListener('resize', function () { fit(); draw(lastT); });

  // ---- rope geometry ----
  // Anchors at fixed height; midpoint sag grows with depth.
  function ropePoint(u, depthNow) {
    var ay = H * 0.24;
    var sag = H * (0.05 + (depthNow / MAX_DEPTH) * 0.17);
    // one smooth parabola across the whole span: zero slope at midspan,
    // so the rope sags like a catenary instead of kinking at the center
    var q = 2 * u - 1;
    return { x: W * u, y: ay + sag * (1 - q * q) };
  }

  function toneFor(d, jitter) {
    var idx = Math.floor((d / MAX_DEPTH) * 4);
    if (jitter > 0.78 && idx < 3) idx += 1;
    if (idx < 0) idx = 0; if (idx > 3) idx = 3;
    return GREENS[idx];
  }

  function fmt(n, dec) {
    return n.toFixed(dec);
  }

  var lastT = 0;

  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var minDim = Math.min(W, H);
    var n0 = visibleCount();
    var slot = W / n0;
    var tagW = Math.max(16, Math.min(40, slot * 0.84));
    var tagH = tagW * 1.32;
    var stringLen = minDim * 0.045;

    // advance the tag window with depth travel (new tags lead, old detach)
    var dDepth = depth - lastDepthForWindow;
    windowOffset += dDepth * 0.35;
    lastDepthForWindow = depth;

    // ---- readout (specced text) ----
    var drift = Math.sin(t * 0.05) * 0.02;
    ctx.fillStyle = PAPER;
    ctx.font = Math.max(11, minDim * 0.018) + 'px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('DEPTH ' + fmt(depth, 1) + ' M', W * 0.03, H * 0.03);
    ctx.fillText('N 42 26.3' + (18 + Math.round(drift * 100)) + '  W 71 20.5' + (12 + Math.round(Math.cos(t * 0.04) * 2)), W * 0.03, H * 0.03 + Math.max(15, minDim * 0.026));

    // ---- rope ----
    ctx.strokeStyle = HEMP;
    ctx.lineWidth = Math.max(2, minDim * 0.004);
    ctx.beginPath();
    for (var i = 0; i <= 72; i++) {
      var p = ropePoint(i / 72, depth);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    ctx.lineWidth = Math.max(1, minDim * 0.0016);
    ctx.beginPath();
    for (var j = 0; j <= 72; j++) {
      var p2 = ropePoint(j / 72, depth);
      if (j === 0) ctx.moveTo(p2.x, p2.y + Math.max(2, minDim * 0.004)); else ctx.lineTo(p2.x, p2.y + Math.max(2, minDim * 0.004));
    }
    ctx.stroke();

    // ---- tags ----
    var n = n0;
    var k0 = Math.floor(windowOffset);
    var frac = windowOffset - k0;
    for (var m = -1; m < n + 1; m++) {
      var k = k0 + m;
      if (k < 0) continue;
      var ts = tagSeed(k);
      var pos = m - frac;              // slot position; visible range is [0, n)
      var u = (pos + 0.5 + ts.slotJitter) / n;
      if (u < -0.04 || u > 1.04) continue;
      // the leaving slot (pos in [-1,0)) fades and drops away; the
      // entering slot (pos in (n-1, n]) fades in. At rest (frac = 0)
      // every visible tag is fully present.
      var alpha = 1, drop = 0;
      if (pos < 0) { alpha = Math.max(0, 1 + pos); drop = -pos * minDim * 0.06; }
      if (pos > n - 1) { alpha = Math.min(alpha, Math.max(0, n - pos)); }

      var anchor = ropePoint(u, depth);
      var ang = ts.swayAmp * Math.sin(t * ts.swaySpeed + ts.swayPhase)
              + 0.02 * Math.sin(t * 0.43 + ts.swayPhase * 1.7);
      var sl = stringLen * ts.stringF;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(anchor.x, anchor.y);
      ctx.rotate(ang);
      ctx.translate(0, drop);

      // string
      ctx.strokeStyle = HEMP;
      ctx.lineWidth = Math.max(1, minDim * 0.0016);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, sl);
      ctx.stroke();

      // tag body
      var tx = -tagW / 2, ty = sl;
      ctx.fillStyle = PAPER;
      ctx.fillRect(tx, ty, tagW, tagH);
      // hole
      ctx.fillStyle = GROUND;
      ctx.beginPath();
      ctx.arc(0, ty + tagH * 0.09, Math.max(1.6, tagW * 0.055), 0, Math.PI * 2);
      ctx.fill();

      // hand-wobbled swatch
      var sw = tagW * 0.58;
      var sx = -sw / 2, sy = ty + tagH * 0.2;
      var tagDepth = ts.depthBase + (depth - REST_DEPTH);
      if (tagDepth < 0) tagDepth = 0; if (tagDepth > MAX_DEPTH) tagDepth = MAX_DEPTH;
      ctx.fillStyle = toneFor(tagDepth, ts.toneJitter);
      ctx.beginPath();
      for (var c = 0; c < 4; c++) {
        var cx = sx + (c === 1 || c === 2 ? sw : 0) + (ts.wob[c * 2] - 0.5) * tagW * 0.09;
        var cy = sy + (c >= 2 ? sw : 0) + (ts.wob[c * 2 + 1] - 0.5) * tagW * 0.09;
        if (c === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
      }
      ctx.closePath();
      ctx.fill();

      // depth figure (specced text), one line
      ctx.fillStyle = INK;
      ctx.font = Math.max(7.5, tagW * 0.21) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(fmt(tagDepth, 1) + ' m', 0, ty + tagH * 0.74);

      ctx.restore();
    }
  }

  // ---- pointer: vertical drag works the sounding line ----
  function yOf(e) { return e.clientY; }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragStartY = yOf(e);
    dragStartDepth = depthTarget;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dy = yOf(e) - dragStartY;
    var d = dragStartDepth + (dy / H) * MAX_DEPTH;
    depthTarget = Math.max(0, Math.min(MAX_DEPTH, d));
  });
  function endDrag() {
    dragging = false;
    depthTarget = REST_DEPTH;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---- run ----
  fit();
  draw(0); // synchronous first frame, fixed phase

  if (typeof requestAnimationFrame === 'function') {
    var start = null, prev = null;
    var loop = function (ts) {
      if (start === null) { start = ts; prev = ts; }
      var t = (ts - start) / 1000;
      var dt = Math.min(0.05, (ts - prev) / 1000);
      prev = ts;
      // ease depth toward target (drag value, or rest after release)
      depth += (depthTarget - depth) * Math.min(1, dt * 3.2);
      if (Math.abs(depthTarget - depth) < 0.005) depth = depthTarget;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
