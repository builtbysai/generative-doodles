<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eye Threads</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #3D488A; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- palette (flat fills only, no gradients) ----
  var INDIGO = '#3D488A';
  var WHITE = '#FFFFFF';
  var NAVY = '#3D5577';
  var SKINS = ['#E8833A', '#F397BE', '#9DB4DD', '#F8F5F0'];
  var THREADS = ['#B93439', '#E9A63B', '#87CECA'];
  var SHIRTS = ['#47AE65', '#DF5435', '#2D2DB3', '#CC6CAC', '#E9A63B', '#87CECA', '#B2D243'];
  var PANTS = ['#3D5577', '#2D2DB3', '#007C58', '#B93439', '#5E79D0'];
  var HAIRS = ['#3D5577', '#B93439', '#E9A63B', '#232A5E'];

  var PHASE = 2.35;   // fixed pre-roll: constant first-frame loop phase
  var WALK_PERIOD = 1.2; // seconds per 2-frame walk cycle

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- seeded plan (fixed for the piece) ----
  var rng = mulberry32(499003);
  var TEXTURES = ['dots', 'dashes', 'squiggles'];

  // zebra band pattern: alternating band/gap widths as fractions of S
  var bandPattern = [];
  (function () {
    var x = -0.24; // start offset (fraction of S), bands laid from -diag
    while (x < 2.4) {
      var bw = 0.030 + rng() * 0.028;
      var gap = 0.052 + rng() * 0.045;
      bandPattern.push({ at: x, w: bw });
      x += bw + gap;
    }
  })();

  function blinkAmount(fig, t) {
    var local = (t + fig.blinkOff) % fig.blinkPeriod;
    if (local < 0.16) return Math.sin((local / 0.16) * Math.PI); // 0..1..0
    return 0;
  }

  var FIG_X = [0.085, 0.220, 0.355, 0.490, 0.625, 0.760, 0.895];
  var figures = [];
  (function () {
    for (var i = 0; i < 7; i++) {
      var fig = {
        fx: FIG_X[i] + (rng() - 0.5) * 0.018,      // fraction of S
        yJit: (rng() - 0.5) * 0.045,               // baseline offset, fraction of S
        scale: 0.93 + rng() * 0.15,
        skin: SKINS[Math.floor(rng() * SKINS.length)],
        hair: HAIRS[Math.floor(rng() * HAIRS.length)],
        hairStyle: Math.floor(rng() * 3),          // 0 cap, 1 cap+bun, 2 side panels
        beard: rng() < 0.30,
        shirt: SHIRTS[Math.floor(rng() * SHIRTS.length)],
        shirtTex: TEXTURES[Math.floor(rng() * 3)],
        pants: PANTS[Math.floor(rng() * PANTS.length)],
        pantsTex: TEXTURES[Math.floor(rng() * 3)],
        shoe: rng() < 0.5 ? '#B93439' : NAVY,
        walkPhase: rng() * 2,                      // 2-frame phase offset
        blinkPeriod: 6.0 + rng() * 3.0,            // 6-9 s
        blinkOff: rng() * 6.0,
        texSeed: rng() * 1000
      };
      // guarantee all eyes open in the deterministic first frame
      var guard = 0;
      while (blinkAmount(fig, PHASE) > 0 && guard < 60) { fig.blinkOff += 0.37; guard++; }
      figures.push(fig);
    }
  })();

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE); // deterministic frame after any resize
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // ---- low-density pattern texture, clipped to the current path ----
  function texture(kind, x0, y0, x1, y1, S, seed, alpha) {
    var sp = S * 0.021;
    ctx.save();
    ctx.clip();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = WHITE;
    ctx.fillStyle = WHITE;
    ctx.lineWidth = Math.max(1, S * 0.0028);
    ctx.lineCap = 'round';
    var row = 0;
    for (var y = y0 + sp * 0.5; y < y1; y += sp, row++) {
      var off = (row % 2) * sp * 0.5 + (Math.sin(seed + row * 3.7) * 0.5 + 0.5) * sp * 0.3;
      for (var x = x0 + off; x < x1; x += sp) {
        if (kind === 'dots') {
          ctx.beginPath();
          ctx.arc(x, y, Math.max(0.9, S * 0.0032), 0, Math.PI * 2);
          ctx.fill();
        } else if (kind === 'dashes') {
          ctx.beginPath();
          ctx.moveTo(x - S * 0.005, y);
          ctx.lineTo(x + S * 0.005, y - S * 0.002);
          ctx.stroke();
        } else { // squiggles
          ctx.beginPath();
          var amp = S * 0.0028, len = S * 0.006;
          ctx.moveTo(x - len, y);
          ctx.quadraticCurveTo(x - len * 0.5, y - amp * 2, x, y);
          ctx.quadraticCurveTo(x + len * 0.5, y + amp * 2, x + len, y);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function quad(x1, y1, x2, y2, x3, y3, x4, y4) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
  }

  // one walking figure; returns its eye anchor {x, y}
  function drawFigure(fig, t, S, ox, oy) {
    var frame = Math.floor(t / (WALK_PERIOD / 2) + fig.walkPhase) % 2;
    var sc = fig.scale;
    var cx = ox + fig.fx * S;
    var baseY = oy + (0.815 + fig.yJit) * S;
    var bob = (frame === 0 ? 0 : -0.006 * S) * sc;

    var legLen = 0.118 * S * sc;
    var torsoH = 0.128 * S * sc;
    var headR = 0.0345 * S * sc;
    var hipY = baseY - legLen * 0.93 + bob;
    var hipXL = cx - 0.020 * S * sc, hipXR = cx + 0.020 * S * sc;
    var torsoTopY = hipY - torsoH;
    var shW = 0.031 * S * sc;   // shoulder half width
    var hipHW = 0.026 * S * sc; // hip half width

    // ---- legs (tapered quads, alternating walk poses) ----
    var aF = frame === 0 ? 0.27 : -0.15;  // frame 0: wide stride; frame 1: legs passing
    var aB = frame === 0 ? -0.23 : 0.18;  // back leg angle
    function leg(hipX, ang, front) {
      var fx = hipX + Math.sin(ang) * legLen;
      var fy = hipY + Math.cos(ang) * legLen - (front ? 0 : 0.010 * S * sc); // trailing foot lifts
      var px = Math.cos(ang), py = -Math.sin(ang); // perpendicular
      var wT = 0.0115 * S * sc, wA = 0.0080 * S * sc;
      quad(hipX - px * wT, hipY - py * wT, hipX + px * wT, hipY + py * wT,
           fx + px * wA, fy + py * wA, fx - px * wA, fy - py * wA);
      ctx.fillStyle = fig.pants;
      ctx.fill();
      texture(fig.pantsTex, Math.min(hipX, fx) - wT * 2, hipY, Math.max(hipX, fx) + wT * 2, fy, S, fig.texSeed + (front ? 7 : 13), 0.40);
      // shoe
      ctx.fillStyle = fig.shoe;
      ctx.beginPath();
      ctx.ellipse(fx + 0.006 * S * sc, fy - 0.001 * S, 0.0115 * S * sc, 0.0050 * S * sc, 0, 0, Math.PI * 2);
      ctx.fill();
      return { x: fx, y: fy };
    }
    leg(hipXL, aB, false);
    leg(hipXR, aF, true);

    // ---- arms (swing against the legs) ----
    var swing = (frame === 0 ? 1 : -1) * 0.016 * S * sc;
    var armLen = 0.098 * S * sc;
    ctx.strokeStyle = fig.shirt;
    ctx.lineWidth = 0.0135 * S * sc;
    ctx.lineCap = 'round';
    function arm(shX, dir, sw) {
      var hx = shX + dir * 0.012 * S * sc + sw;
      var hy = torsoTopY + armLen;
      ctx.beginPath();
      ctx.moveTo(shX, torsoTopY + 0.008 * S * sc);
      ctx.lineTo(hx, hy);
      ctx.stroke();
      ctx.fillStyle = fig.skin;
      ctx.beginPath();
      ctx.arc(hx, hy, 0.0062 * S * sc, 0, Math.PI * 2);
      ctx.fill();
    }
    arm(cx - shW, -1, -swing);
    arm(cx + shW, 1, swing);

    // ---- torso (one texture per region) ----
    quad(cx - shW, torsoTopY, cx + shW, torsoTopY,
         cx + hipHW, hipY + 0.004 * S, cx - hipHW, hipY + 0.004 * S);
    ctx.fillStyle = fig.shirt;
    ctx.fill();
    texture(fig.shirtTex, cx - shW, torsoTopY, cx + shW, hipY, S, fig.texSeed, 0.45);

    // ---- head ----
    var headCx = cx + 0.002 * S * sc;
    var headCy = torsoTopY - headR * 0.88 + bob;
    ctx.fillStyle = fig.skin;
    ctx.beginPath();
    ctx.arc(headCx, headCy, headR, 0, Math.PI * 2);
    ctx.fill();

    // hair: flat block over the skull, drawn BEFORE the face so the
    // grammar always sits on top of the hairline
    ctx.fillStyle = fig.hair;
    if (fig.hairStyle === 2) {
      // shallow cap + side panels
      ctx.beginPath();
      ctx.arc(headCx, headCy - headR * 0.10, headR * 0.99, Math.PI * 1.04, Math.PI * 1.96);
      ctx.fill();
      ctx.fillRect(headCx - headR * 1.00, headCy - headR * 0.34, headR * 0.28, headR * 0.72);
      ctx.fillRect(headCx + headR * 0.72, headCy - headR * 0.34, headR * 0.28, headR * 0.72);
    } else {
      ctx.beginPath();
      ctx.arc(headCx, headCy - headR * 0.10, headR * 0.99, Math.PI * 1.04, Math.PI * 1.96);
      ctx.fill();
      if (fig.hairStyle === 1) { // bun
        ctx.beginPath();
        ctx.arc(headCx - headR * 0.25, headCy - headR * 1.10, headR * 0.34, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // beard: dot cluster along the jaw
    if (fig.beard) {
      ctx.fillStyle = fig.hair;
      for (var bi = 0; bi < 9; bi++) {
        var ba = Math.PI * (0.20 + 0.60 * (bi / 8));
        var bx = headCx + Math.cos(ba) * headR * 0.82;
        var by = headCy + Math.sin(ba) * headR * 0.82;
        ctx.beginPath();
        ctx.arc(bx, by, headR * 0.075, 0, Math.PI * 2);
        ctx.fill();
      }
      for (var bj = 0; bj < 3; bj++) {
        var ca = Math.PI * (0.42 + 0.16 * bj);
        ctx.beginPath();
        ctx.arc(headCx + Math.cos(ca) * headR * 0.62, headCy + Math.sin(ca) * headR * 0.62, headR * 0.065, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // face grammar: 2-arc eyes, L-line nose, short-curve smile (navy)
    var blink = blinkAmount(fig, t);
    var eyeY = headCy - headR * 0.06;
    var eyeDx = headR * 0.40;
    var flw = Math.max(1.1, S * 0.0032);
    ctx.strokeStyle = NAVY;
    ctx.lineWidth = flw;
    ctx.lineCap = 'round';
    for (var e = -1; e <= 1; e += 2) {
      var ex = headCx + e * eyeDx;
      ctx.save();
      ctx.translate(ex, eyeY);
      ctx.scale(1, 1 - blink * 0.85);
      ctx.beginPath();
      ctx.arc(0, 0, headR * 0.17, Math.PI * 1.08, Math.PI * 1.92);
      ctx.stroke();
      ctx.restore();
    }
    // nose: small L
    ctx.beginPath();
    ctx.moveTo(headCx + headR * 0.07, headCy + headR * 0.02);
    ctx.lineTo(headCx + headR * 0.07, headCy + headR * 0.24);
    ctx.lineTo(headCx - headR * 0.05, headCy + headR * 0.24);
    ctx.stroke();
    // smile: short curve
    ctx.beginPath();
    ctx.arc(headCx, headCy + headR * 0.22, headR * 0.30, Math.PI * 0.22, Math.PI * 0.78);
    ctx.stroke();

    return { x: headCx, y: eyeY };
  }

  function draw(t) {
    if (!W || !H) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // square stage, centered; ground and stripes bleed to the full canvas
    var S = Math.min(W, H);
    var ox = (W - S) / 2, oy = (H - S) / 2;

    // ---- ground ----
    ctx.fillStyle = INDIGO;
    ctx.fillRect(0, 0, W, H);

    // ---- zebra stripes at -30 degrees, full bleed ----
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-Math.PI / 6);
    ctx.fillStyle = WHITE;
    var diag = Math.sqrt(W * W + H * H);
    for (var bi = 0; bi < bandPattern.length; bi++) {
      var bx = -diag + bandPattern[bi].at * S;
      if (bx > diag) break;
      ctx.fillRect(bx, -diag, bandPattern[bi].w * S, diag * 2);
    }
    ctx.restore();

    // ---- figures ----
    var anchors = [];
    for (var i = 0; i < figures.length; i++) {
      anchors.push(drawFigure(figures[i], t, S, ox, oy));
    }

    // ---- eye threads, drawn OVER the figures, edge to edge ----
    var pts = [{ x: 0, y: anchors[0].y }];
    for (var p = 0; p < anchors.length; p++) pts.push(anchors[p]);
    pts.push({ x: W, y: anchors[anchors.length - 1].y });
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1.6, S * 0.0052);
    ctx.setLineDash([S * 0.020, S * 0.0135]);
    ctx.lineDashOffset = -t * S * 0.022; // pulse: dashes drift along the threads
    for (var sgm = 0; sgm < pts.length - 1; sgm++) {
      var p0 = pts[sgm], p1 = pts[sgm + 1];
      var mx = (p0.x + p1.x) / 2;
      var my = (p0.y + p1.y) / 2 + S * 0.011; // gentle thread sag
      ctx.strokeStyle = THREADS[sgm % THREADS.length];
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.quadraticCurveTo(mx, my, p1.x, p1.y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
    // thread knots at each eye anchor
    for (var k = 0; k < anchors.length; k++) {
      ctx.fillStyle = THREADS[k % THREADS.length];
      ctx.beginPath();
      ctx.arc(anchors[k].x, anchors[k].y, Math.max(1.6, S * 0.0058), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- run: watch-only, no interaction ----
  resize();
  draw(PHASE);

  var startStamp = null;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (stamp) {
      if (startStamp === null) startStamp = stamp;
      var elapsed = (stamp - startStamp) / 1000;
      draw(PHASE + elapsed);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
