<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.222 Telegraph</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0A0A0C; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.222 Telegraph (Kathy McTavish). A ghost typist works a telegraph:
// short strange phrases in phosphor amber are typed character by
// character with an irregular rhythm, held, then each letter jitters
// and crumbles into falling dots, dissolving like sand. Between
// phrases, Morse-like pulses blink dim green along the bottom edge.
// The phrase bank is part of the piece. Tap reseeds the phrase source.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0A0A0C', AMBER = '#FFB000', GREEN = '#2A5A3A';
var W = 0, H = 0, phone = false;
var seed = 222222;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

var PHRASES = [
  'the machine renders infinitely',
  'counts & probabilities',
  'the train arrives at no station',
  'a bird, a suitcase, the long way west',
  'field notes from the blue atlas',
  'the typist is not here. the typing continues',
  'rain on the wire, a signal in the static',
  'we counted the stars. the stars declined',
  'the river keeps its own ledger',
  'prophecy received, illegible, filed',
  'the choir hums at four centres',
  'what the machine dreams: more machine',
  'the archive breathes in counts of three',
  'a thread, a needle, a map of nowhere',
  'the desk is messy because the mind is',
  'hold the line. the line holds you'
];

// ---- layout (recomputed on resize) ------------------------------------------------
var FS = 26, CHARW = 16, LINEX = 60, LINEY0 = 200, LINEH = 52, PULSEY = 800;
function layout() {
  FS = phone ? Math.max(13, Math.round(W * 0.038)) : Math.round(clamp(W * 0.020, 18, 27));
  ctx.font = FS + 'px monospace';
  CHARW = ctx.measureText('M').width;
  // shrink until the longest phrase in the bank fits the line
  var longest = 0;
  PHRASES.forEach(function (p) { longest = Math.max(longest, p.length); });
  while (FS > 10 && Math.max(18, Math.round(W * 0.10)) + longest * CHARW > W - 6) {
    FS--;
    ctx.font = FS + 'px monospace';
    CHARW = ctx.measureText('M').width;
  }
  LINEX = Math.max(18, Math.round(W * 0.10));
  LINEY0 = Math.round(H * 0.30);
  LINEH = Math.round(FS * 2.05);
  PULSEY = H - Math.max(20, Math.round(H * 0.055));
}

// ---- phrase source: a shuffled order, reseeded on tap ------------------------------
var srcRand = rng(seed);
var order = [];
function reshuffle() {
  order = PHRASES.map(function (_, i) { return i; });
  for (var i = order.length - 1; i > 0; i--) {
    var j = Math.floor(srcRand() * (i + 1));
    var t = order[i]; order[i] = order[j]; order[j] = t;
  }
}
reshuffle();
var orderIx = 0;
function nextPhrase() {
  var p = PHRASES[order[orderIx % order.length]];
  orderIx++;
  if (orderIx % order.length === 0) reshuffle();
  return p;
}

// ---- line slots ---------------------------------------------------------------------
var T = 0;
var particles = [];
function makeSlot(delay) {
  return {
    phrase: '', phase: 'wait', startAt: T + delay, tPhase: 0,
    typed: 0, typeTimer: 0, intervals: [], holdDur: 2.4,
    crumbleOrder: [], crumbleIx: 0, crumbleTimer: 0, gapDur: 1
  };
}
var slots = [makeSlot(0), makeSlot(2.6), makeSlot(5.2), makeSlot(7.8)];
function beginPhrase(s) {
  s.phrase = nextPhrase();
  s.phase = 'type'; s.tPhase = 0; s.typed = 0; s.typeTimer = 0.15;
  s.intervals = [];
  for (var i = 0; i < s.phrase.length; i++) {
    var r = srcRand();
    s.intervals.push(r < 0.12 ? 0.28 + srcRand() * 0.15 : 0.035 + srcRand() * 0.11);
  }
  s.holdDur = 1.9 + srcRand() * 1.2;
  s.crumbleOrder = s.phrase.split('').map(function (_, i) { return i; });
  for (var k = s.crumbleOrder.length - 1; k > 0; k--) {
    var j = Math.floor(srcRand() * (k + 1));
    var t = s.crumbleOrder[k]; s.crumbleOrder[k] = s.crumbleOrder[j]; s.crumbleOrder[j] = t;
  }
  s.crumbleIx = 0; s.crumbleTimer = 0;
}
function slotY(si) { return LINEY0 + si * LINEH; }
function crumbleChar(s, si, ci) {
  var x = LINEX + ci * CHARW, y = slotY(si);
  var n = 6 + Math.floor(srcRand() * 5);
  for (var i = 0; i < n; i++) {
    particles.push({
      x: x + srcRand() * CHARW, y: y - FS * 0.7 + srcRand() * FS * 0.7,
      vx: (srcRand() - 0.5) * 26, vy: 8 + srcRand() * 30,
      age: 0, life: 1.1 + srcRand() * 0.7
    });
  }
}
function stepSlot(s, si, dt) {
  if (s.phase === 'wait') {
    if (T >= s.startAt) beginPhrase(s);
    return;
  }
  s.tPhase += dt;
  if (s.phase === 'type') {
    s.typeTimer -= dt;
    while (s.typeTimer <= 0 && s.typed < s.phrase.length) {
      s.typed++;
      s.typeTimer += s.intervals[s.typed - 1] || 0.08;
    }
    if (s.typed >= s.phrase.length) { s.phase = 'hold'; s.tPhase = 0; }
  } else if (s.phase === 'hold') {
    if (s.tPhase >= s.holdDur) { s.phase = 'jitter'; s.tPhase = 0; }
  } else if (s.phase === 'jitter') {
    if (s.tPhase >= 0.55) { s.phase = 'crumble'; s.tPhase = 0; s.crumbleTimer = 0; }
  } else if (s.phase === 'crumble') {
    s.crumbleTimer -= dt;
    while (s.crumbleTimer <= 0 && s.crumbleIx < s.phrase.length) {
      crumbleChar(s, si, s.crumbleOrder[s.crumbleIx]);
      s.crumbleIx++;
      s.crumbleTimer += 0.045;
    }
    if (s.crumbleIx >= s.phrase.length) {
      s.phase = 'wait';
      s.startAt = T + 0.9 + srcRand() * 1.4;
    }
  }
}
function step(dt) {
  T += dt;
  for (var i = 0; i < slots.length; i++) stepSlot(slots[i], i, dt);
  for (var p = particles.length - 1; p >= 0; p--) {
    var pt = particles[p];
    pt.age += dt;
    pt.vy += 620 * dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    if (pt.age > pt.life || pt.y > H - 6) particles.splice(p, 1);
  }
}

// ---- bottom pulses: a repeating dot/dash message -------------------------------------
var MARKS = [];
(function () {
  var pat = [1, 1, 1, 0, 3, 3, 3, 0, 1, 1, 1, 0, 1, 3, 1, 0, 3, 1, 3, 0, 1, 1, 3, 0, 3, 1, 1, 1, 0, 1, 3, 3, 0, 1, 1];
  // 1 = dot, 3 = dash, 0 = gap; cumulative timeline in units
  var acc = 0;
  for (var i = 0; i < pat.length; i++) {
    var len = pat[i] === 0 ? 1.4 : pat[i];
    MARKS.push({ at: acc, len: pat[i], dur: len });
    acc += len + 0.9;
  }
  MARKS.total = acc;
})();
var PULSE_CYCLE = 8.5;

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  ctx.font = FS + 'px monospace';
  ctx.textBaseline = 'alphabetic';
  // phrases
  for (var si = 0; si < slots.length; si++) {
    var s = slots[si];
    if (s.phase === 'wait') continue;
    var y = slotY(si);
    ctx.fillStyle = AMBER;
    var gone = {};
    if (s.phase === 'crumble') {
      for (var g = 0; g < s.crumbleIx; g++) gone[s.crumbleOrder[g]] = true;
    }
    var jittering = (s.phase === 'jitter' || s.phase === 'crumble');
    for (var ci = 0; ci < s.typed; ci++) {
      if (gone[ci]) continue;
      var jx = 0, jy = 0;
      if (jittering) { jx = (srcRand() - 0.5) * 3.2; jy = (srcRand() - 0.5) * 2.6; }
      ctx.fillText(s.phrase[ci], LINEX + ci * CHARW + jx, y + jy);
    }
  }
  // crumble particles
  ctx.fillStyle = AMBER;
  for (var p = 0; p < particles.length; p++) {
    var pt = particles[p];
    ctx.globalAlpha = clamp(1 - pt.age / pt.life, 0, 1);
    ctx.fillRect(pt.x, pt.y, 2.2, 2.2);
  }
  ctx.globalAlpha = 1;
  // telegraph pulses along the bottom edge
  var x0 = LINEX, x1 = W - Math.max(18, W * 0.06);
  var unit = (x1 - x0) / MARKS.total;
  var head = (T % PULSE_CYCLE) / PULSE_CYCLE * MARKS.total;
  ctx.fillStyle = GREEN;
  for (var mi = 0; mi < MARKS.length; mi++) {
    var mk = MARKS[mi];
    if (mk.len === 0) continue;
    var mx = x0 + mk.at * unit;
    var mw = mk.len * unit * 0.82;
    var lit = (head >= mk.at && head <= mk.at + mk.dur + 0.6);
    var recent = (head - (mk.at + mk.dur) > 0 && head - (mk.at + mk.dur) < 2.2);
    ctx.globalAlpha = lit ? 1 : recent ? 0.55 : 0.22;
    ctx.fillRect(mx, PULSEY, mw, 4);
  }
  ctx.globalAlpha = 1;
}

// ---- interaction: tap reseeds the phrase source ---------------------------------------
canvas.addEventListener('pointerdown', function () {
  srcRand = rng((seed + Math.floor(T * 1000) + 7919) >>> 0);
  reshuffle();
  orderIx = 0;
  particles.length = 0;
  slots = [makeSlot(0), makeSlot(0.7), makeSlot(1.5), makeSlot(2.4)];
});

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  layout();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
var lastNow = -1;
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  if (dt > 0) step(dt);
  draw();
}
resize();
layout();
// pre-run: frame one opens mid-cycle (a phrase holding, an earlier one
// just crumbled with its dots still falling, another being typed)
for (var pre = 0; pre < 288; pre++) step(1 / 30);
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
