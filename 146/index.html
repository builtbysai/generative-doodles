<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sinan Rings</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E0E12; }
  canvas { display:block; touch-action:none; }
  .hint { position:fixed; left:0; right:0; bottom:14px; text-align:center;
    font:12px/1.4 monospace; color:#8f929e; letter-spacing:0.08em; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">drag to make the cut</div>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

// Sinan's three period variants: ring count and perforation density
var VARIANTS = [
  { rings: 4, slotMul: 1 },  // apprentice
  { rings: 6, slotMul: 1 },  // journeyman: alternate rings carry double slots
  { rings: 8, slotMul: 2 }   // master
];
var varIdx = 1;
var cut = 0.45, restCut = 0.45; // opens part-cut: outer rings lifted, inner still scored flat

function ringGeom(R, n) {
  var out = [], ringW = R * 0.088, gap = R * 0.048;
  for (var i = 0; i < n; i++) {
    var rOut = R - i * (ringW + gap);
    out.push({ rOut: rOut, rIn: rOut - ringW, rm: rOut - ringW / 2, w: ringW });
  }
  return out;
}
function drawRing(cx, cy, ring, L, slots) {
  var squash = 1 - 0.10 * L;
  var cyL = cy - L * ring.rm * 0.05;
  var i, a;
  // perforation shadows first: the cut reads as depth
  ctx.fillStyle = 'rgba(58,63,82,0.7)';
  for (i = 0; i < slots; i++) {
    a = (i / slots) * Math.PI * 2 + ring.rm;
    var sx = cx + Math.cos(a) * ring.rm + 1.8, sy = cyL + Math.sin(a) * ring.rm * squash + 2.6;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(a + Math.PI / 2); ctx.scale(1, squash);
    ctx.beginPath(); ctx.rect(-ring.w * 0.30, -ring.w * 0.24, ring.w * 0.60, ring.w * 0.48); ctx.fill();
    ctx.restore();
  }
  // the paper annulus, far edge lifting toward the viewer
  ctx.fillStyle = '#F4F0E4';
  ctx.beginPath();
  ctx.ellipse(cx, cyL, ring.rOut, ring.rOut * squash, 0, 0, Math.PI * 2);
  ctx.ellipse(cx, cyL, ring.rIn, ring.rIn * squash, 0, 0, Math.PI * 2);
  ctx.fill('evenodd');
  // light through the cuts
  ctx.fillStyle = '#0E0E12';
  for (i = 0; i < slots; i++) {
    a = (i / slots) * Math.PI * 2 + ring.rm;
    var px = cx + Math.cos(a) * ring.rm, py = cyL + Math.sin(a) * ring.rm * squash;
    ctx.save(); ctx.translate(px, py); ctx.rotate(a + Math.PI / 2); ctx.scale(1, squash);
    ctx.beginPath(); ctx.rect(-ring.w * 0.30, -ring.w * 0.24, ring.w * 0.60, ring.w * 0.48); ctx.fill();
    ctx.restore();
  }
  // inner shadow grows with lift; highlight catches the upper-left rim
  if (L > 0.03) {
    ctx.strokeStyle = 'rgba(58,63,82,' + (0.55 * L).toFixed(3) + ')';
    ctx.lineWidth = 1 + 2.5 * L;
    ctx.beginPath(); ctx.ellipse(cx, cyL, ring.rIn - 1, (ring.rIn - 1) * squash, 0, Math.PI * 0.15, Math.PI * 1.05); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + 0.55 * L).toFixed(3) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(cx, cyL, ring.rOut - 0.75, (ring.rOut - 0.75) * squash, 0, Math.PI * 1.05, Math.PI * 1.75); ctx.stroke();
  }
}
function draw() {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#0E0E12'; ctx.fillRect(0, 0, W, H);
  var cx = W / 2, cy = H / 2;
  var R = 0.375 * Math.min(W, H);
  var v = VARIANTS[varIdx];
  var rings = ringGeom(R, v.rings);
  var i;
  var lifts = [];
  for (i = 0; i < v.rings; i++) lifts.push(smooth(cut * (v.rings + 0.5) - i * 0.9));
  // the well the rings lift out of
  ctx.fillStyle = '#0E0E12';
  ctx.beginPath(); ctx.ellipse(cx, cy, R + 2, R + 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(58,63,82,0.8)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(cx, cy + 3, R, R, 0, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
  // uncut centre medallion, still flat paper with its score star
  var innerR = rings[v.rings - 1].rIn - R * 0.048;
  ctx.fillStyle = '#F4F0E4';
  ctx.beginPath(); ctx.ellipse(cx, cy, innerR, innerR, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(58,63,82,' + (0.65 * (1 - cut) + 0.2).toFixed(3) + ')'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (i = 0; i < 12; i++) {
    var a = i * Math.PI / 6;
    ctx.moveTo(cx + Math.cos(a) * innerR * 0.25, cy + Math.sin(a) * innerR * 0.25);
    ctx.lineTo(cx + Math.cos(a) * innerR * 0.92, cy + Math.sin(a) * innerR * 0.92);
  }
  ctx.stroke();
  // score lines on whatever has not lifted yet
  if (cut < 0.97) {
    ctx.strokeStyle = 'rgba(58,63,82,' + (0.5 * (1 - cut)).toFixed(3) + ')'; ctx.lineWidth = 1;
    for (i = 0; i < v.rings; i++) {
      if (lifts[i] > 0.05) continue;
      ctx.beginPath(); ctx.ellipse(cx, cy, rings[i].rOut, rings[i].rOut, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy, rings[i].rIn, rings[i].rIn, 0, 0, Math.PI * 2); ctx.stroke();
    }
  }
  // rings, outer (most lifted) drawn last, on top
  for (i = v.rings - 1; i >= 0; i--) {
    var slots = 12 * v.slotMul * ((varIdx === 1 && i % 2 === 1) ? 2 : 1);
    // shadow copy of the whole ring beneath itself, offset growing with lift
    if (lifts[i] > 0.03) {
      var shx = cx + lifts[i] * 7, shy = cy + lifts[i] * 10 - lifts[i] * rings[i].rm * 0.05;
      var sq2 = 1 - 0.10 * lifts[i];
      ctx.fillStyle = 'rgba(58,63,82,' + (0.38 * lifts[i]).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(shx, shy, rings[i].rOut, rings[i].rOut * sq2, 0, 0, Math.PI * 2);
      ctx.ellipse(shx, shy, rings[i].rIn, rings[i].rIn * sq2, 0, 0, Math.PI * 2);
      ctx.fill('evenodd');
    }
    drawRing(cx, cy, rings[i], lifts[i], slots);
  }
}
var drag = null, lastTap = { t: 0, x: 0, y: 0 };
canvas.addEventListener('pointerdown', function (e) {
  var now = Date.now();
  if (now - lastTap.t < 320 && Math.abs(e.clientX - lastTap.x) < 44 && Math.abs(e.clientY - lastTap.y) < 44) {
    varIdx = (varIdx + 1) % VARIANTS.length;
    lastTap.t = 0; drag = null;
    return;
  }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
  drag = { y: e.clientY, c0: cut, start: cut };
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  cut = clamp01(drag.c0 + (e.clientY - drag.y) / (0.55 * H));
});
function endDrag() {
  if (drag) { restCut = drag.start + (cut - drag.start) * 0.5; drag = null; } // release eases halfway and holds
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

resize();
draw();
function frame() {
  if (!drag) cut += (restCut - cut) * 0.06;
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
