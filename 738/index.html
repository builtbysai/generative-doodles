<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>September Blues</title>
<style>
  html, body { margin: 0; padding: 0; background: #EDE8DC; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // Palette: six blues and the paper ground. Nothing else, ever.
  // Grain uses two shades of the same paper, no new hue.
  var PAPER = "#EDE8DC";
  var PAPER_DARK = "#E0D8C4";
  var PAPER_LIGHT = "#F5F1E5";
  var BLUES = ["#3A7BD5", "#7FB2E5", "#1E4E8F", "#BFD9F2", "#5B7A9D", "#2E86DE"];
  // Wet state: each blue lifts to the next deeper, more saturated blue.
  var WET = [5, 0, 2, 1, 5, 2]; // index into BLUES, per dry index

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : 0;
      var sh = window.screen ? window.screen.height : 0;
      var mn = Math.min(sw, sh);
      if (mn > 0 && mn < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  window.addEventListener("resize", resize);
  resize();

  // mulberry32: independent seeded streams, all fixed constants.
  function RNG(seed) {
    var s = seed | 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Precomputed field -------------------------------------------------
  // The grid is fixed for the run's seed, like his. Tiles are generated
  // once, in row-major order, up to the largest grid any layout needs.
  // Each tile: a base blue plus 4 to 5 jittered paint patches. Patches are
  // stored as fractions of the tile box so any cell size can draw them.
  // Tone jitter comes from alpha layering of palette tones only: a patch
  // is either the base tone or the tile's second palette tone, laid at
  // alpha 0.85 to 1.0 over the paper and over its neighbours. No new hues
  // are ever mixed; unevenness is layering, not color math.
  var MAXN = 1152;
  var tiles = [];
  (function buildTiles() {
    var r = RNG(73800911);
    for (var i = 0; i < MAXN; i++) {
      var base = Math.floor(r() * 6);
      var alt = Math.floor(r() * 6);
      if (alt === base) alt = (alt + 1 + Math.floor(r() * 5)) % 6;
      var patches = [];
      var np = 4 + (r() < 0.3 ? 1 : 0);
      for (var j = 0; j < np; j++) {
        patches.push({
          x0: -0.03 + r() * 0.12,         // edges land a few percent in or out
          y0: -0.03 + r() * 0.12,
          x1: 0.91 + r() * 0.12,          // each stroke spans most of the box
          y1: 0.91 + r() * 0.12,
          tone: (j === np - 1 && np > 1) ? alt : base,
          a: j === 0 ? 1.0 : 0.85 + r() * 0.15
        });
      }
      tiles.push({ base: base, alt: alt, patches: patches });
    }
  })();

  // Static paper grain: seeded speckle in paper shades only.
  var grain = [];
  (function buildGrain() {
    var r = RNG(73811240);
    for (var i = 0; i < 2400; i++) {
      grain.push({
        fx: r(), fy: r(),
        rad: 0.6 + r() * 1.1,
        dark: r() < 0.55,
        a: 0.05 + r() * 0.08
      });
    }
  })();

  // Tap holds: tile index -> time tapped. Recorded events only.
  var tapWet = {};

  function layout() {
    var phone = isPhone();
    var s0 = phone ? W / 16 : Math.sqrt((W * H) / 984);
    var cols = Math.max(8, Math.round(W / s0));
    var rows = Math.max(8, Math.round(H / s0));
    while (cols * rows > MAXN) { if (cols >= rows) cols--; else rows--; }
    return { phone: phone, cols: cols, rows: rows, cw: W / cols, ch: H / rows };
  }

  // ---- Wet wave ----------------------------------------------------------
  var SWEEP = 60; // one repaint sweep per 60 s
  function sweepWet(u, t) {
    var p = t % SWEEP;
    var front = -0.16 + (p / SWEEP) * 1.32; // crosses, then rests off-field
    var d = Math.abs(u - front);
    if (d >= 0.11) return 0;
    var w = 1 - d / 0.11;
    return w * w * (3 - 2 * w);
  }
  function tapWetAt(idx, t) {
    var t0 = tapWet[idx];
    if (t0 === undefined) return 0;
    var te = t - t0;
    if (te < 0 || te > 5) return 0;
    if (te < 0.4) return te / 0.4;
    if (te > 4.2) return (5 - te) / 0.8;
    return 1;
  }

  function drawTile(L, col, row, t) {
    var idx = row * L.cols + col;
    var tile = tiles[idx];
    var cw = L.cw, ch = L.ch;
    var g = Math.min(2, Math.min(cw, ch) * 0.09); // paper gutter
    var bx = col * cw + g / 2, by = row * ch + g / 2;
    var bw = cw - g, bh = ch - g;
    var u = ((col + 0.5) / L.cols + (row + 0.5) / L.rows) / 2;
    var wet = sweepWet(u, t);
    var tw = tapWetAt(idx, t);
    if (tw > wet) wet = tw;

    var ps = tile.patches, j, p;
    for (j = 0; j < ps.length; j++) {
      p = ps[j];
      ctx.globalAlpha = p.a;
      ctx.fillStyle = BLUES[p.tone];
      ctx.fillRect(bx + p.x0 * bw, by + p.y0 * bh, (p.x1 - p.x0) * bw, (p.y1 - p.y0) * bh);
    }
    if (wet > 0.003) {
      // Freshly wet: deeper saturated tone settles over the hand of the
      // tile, patch texture shows through, edges pool slightly darker.
      var wt = BLUES[WET[tile.base]];
      ctx.globalAlpha = 0.34 * wet;
      ctx.fillStyle = wt;
      ctx.fillRect(bx, by, bw, bh);
      ctx.globalAlpha = 0.5 * wet;
      for (j = 0; j < ps.length; j += 2) {
        p = ps[j];
        ctx.fillRect(bx + p.x0 * bw, by + p.y0 * bh, (p.x1 - p.x0) * bw, (p.y1 - p.y0) * bh);
      }
      ctx.globalAlpha = 0.45 * wet;
      ctx.strokeStyle = wt;
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    var L = layout();
    for (var row = 0; row < L.rows; row++) {
      for (var col = 0; col < L.cols; col++) {
        drawTile(L, col, row, t);
      }
    }

    for (var i = 0; i < grain.length; i++) {
      var gr = grain[i];
      ctx.globalAlpha = gr.a;
      ctx.fillStyle = gr.dark ? PAPER_DARK : PAPER_LIGHT;
      ctx.fillRect(gr.fx * W, gr.fy * H, gr.rad, gr.rad);
    }
    ctx.globalAlpha = 1;
  }

  // ---- Time --------------------------------------------------------------
  var startTime = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  function now() {
    return (((typeof performance !== "undefined" && performance.now) ? performance.now() : 0) - startTime) / 1000;
  }

  // ---- Pointer -----------------------------------------------------------
  function evtPos(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0)) - rect.left;
    var y = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0)) - rect.top;
    return { x: x, y: y };
  }
  canvas.addEventListener("pointerdown", function (e) {
    var p = evtPos(e);
    var L = layout();
    var col = Math.floor(p.x / L.cw), row = Math.floor(p.y / L.ch);
    if (col < 0 || row < 0 || col >= L.cols || row >= L.rows) return;
    var t = now();
    tapWet[row * L.cols + col] = t;
    draw(t);
  });

  // ---- Main loop ---------------------------------------------------------
  draw(0); // frame one: synchronous, t = 0, the quiet dry grid
  if (typeof requestAnimationFrame === "function") {
    var loop = function () {
      draw(now());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
