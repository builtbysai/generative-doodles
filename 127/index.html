<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№127 · Summit Circle</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D0C0A; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(230,226,212,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to join the session</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

// No.127 Summit Circle: twelve drawing agents share one canvas, each with a
// single signature behaviour and its own muted ink. They wander, turn away
// from freshly laid ink on a coarse occupancy grid, and every mark fades
// slowly, oldest first. The visitor's finger is a thirteenth hand in bone.
const GROUND='#0D0C0A', BONE='#E8E2D2';
const MAXMARKS=60000, FADE=0.9955;
const GCELL=14;
let W=0,H=0, occ=null, gw=0, gh=0;
let marks=[], recent=[];
const rnd=(function(){ let s=1234567; return function(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }; })();
function occAt(x,y){ const gx=(x/GCELL)|0, gy=(y/GCELL)|0; if(gx<0||gy<0||gx>=gw||gy>=gh) return 1; return occ[gy*gw+gx]; }
function occAdd(x,y){ const gx=(x/GCELL)|0, gy=(y/GCELL)|0; if(gx<0||gy<0||gx>=gw||gy>=gh) return; occ[gy*gw+gx]=Math.min(6,occ[gy*gw+gx]+1); recent.push(gy*gw+gx); if(recent.length>2600){ const old=recent.shift(); occ[old]=Math.max(0,occ[old]-1); } }
function pushMark(m){ m.a=1; marks.push(m); occAdd(m.x,m.y); if(marks.length>MAXMARKS) marks.splice(0,marks.length-MAXMARKS); }

const KINDS=['arcs','vegetation','ellipses','hatchblob','faintlines','stipple','rings','strings','columns','membrane','grid','glyphs'];
const INKS=['#C09A58','#7E8F5E','#6E86A3','#B8AE9C','#9A8A76','#C08552','#8B93A7','#B4654A','#A3A380','#5F7E78','#C74B36','#7A6FA0'];
const AGENTS=[];
function newAgent(kind,ink){
  const a={ kind, ink, x:0, y:0, dir:rnd()*6.283, turn:(rnd()-0.5)*0.02, speed:1.2+rnd()*1.1,
    ph:rnd()*6.283, cyc:20+rnd()*40, n:0, cx:0, cy:0, cr:30+rnd()*70, ca:0, bx:0, by:0, bt:0 };
  return a;
}
function placeAgents(){
  for(let i=0;i<12;i++){
    const a=AGENTS[i]||(AGENTS[i]=newAgent(KINDS[i],INKS[i]));
    a.x=W*(0.08+0.84*rnd());
    a.y=H*(0.08+0.84*rnd());
    a.cx=a.x; a.cy=a.y; a.bx=a.x; a.by=a.y; a.n=0;
  }
}
function agentStep(a,px,py){
  a.n++; a.ph+=0.03;
  // wander: a gentle random walk of the heading, so paths cruise long
  // distances and only curve slowly; politeness probes turn it from wet ink
  const sp=a.speed*(a.kind==='faintlines'?1.4:1);
  const probe=16;
  const f=occAt(a.x+Math.cos(a.dir)*probe, a.y+Math.sin(a.dir)*probe);
  const l=occAt(a.x+Math.cos(a.dir-0.6)*probe, a.y+Math.sin(a.dir-0.6)*probe);
  const r=occAt(a.x+Math.cos(a.dir+0.6)*probe, a.y+Math.sin(a.dir+0.6)*probe);
  if(f>=3){ a.dir += (l<=r? -1:1)*0.22; }
  if(px!==null){ const dx=a.x-px, dy=a.y-py, d2=dx*dx+dy*dy; if(d2<8100){ const d=Math.sqrt(d2)||1; a.dir=Math.atan2(dy/d,dx/d)+(rnd()-0.5)*0.4; } }
  a.turn+=(rnd()-0.5)*0.006; a.turn=clamp(a.turn,-0.02,0.02);
  a.dir+=a.turn+Math.sin(a.ph*0.5)*0.004;
  let nx=a.x+Math.cos(a.dir)*sp, ny=a.y+Math.sin(a.dir)*sp;
  const m=10;
  if(nx<m||nx>W-m||ny<m||ny>H-m){ a.dir+=2.6+(rnd()-0.5)*0.5; nx=a.x+Math.cos(a.dir)*sp; ny=a.y+Math.sin(a.dir)*sp; }
  const ox=a.x, oy=a.y; a.x=nx; a.y=ny;
  const K=a.kind;
  if(K==='arcs'){ if(a.n%26===0){ const rr=8+rnd()*26, st=rnd()*6.283; pushMark({k:'arc',x:a.x,y:a.y,r:rr,a0:st,a1:st+0.7+rnd()*1.6,c:a.ink,w:1.4}); } }
  else if(K==='vegetation'){ if(a.n%2===0){ pushMark({k:'seg',x:ox,y:oy,x2:nx,y2:ny,c:a.ink,w:1.1}); if(rnd()<0.05){ const la=a.dir+(rnd()<0.5?-0.7:0.7); pushMark({k:'seg',x:a.x,y:a.y,x2:a.x+Math.cos(la)*7,y2:a.y+Math.sin(la)*7,c:a.ink,w:1}); } } }
  else if(K==='ellipses'){ if(a.n%34===0){ const wt=[0.7,1.6,3][(rnd()*3)|0]; pushMark({k:'ell',x:a.x,y:a.y,rx:6+rnd()*20,ry:4+rnd()*12,rot:rnd()*3.14,c:a.ink,w:wt}); } }
  else if(K==='hatchblob'){ a.bt+=0.05; if(a.n%3===0){ const yy=a.y+(rnd()-0.5)*a.cr*0.6; pushMark({k:'seg',x:a.x-a.cr*0.32,y:yy,x2:a.x+a.cr*0.32,y2:yy+3,c:a.ink,w:1}); } if(a.n%240===0){ a.bx=a.x; a.by=a.y; } }
  else if(K==='faintlines'){ if(a.n%9===0){ pushMark({k:'seg',x:ox,y:oy,x2:nx,y2:ny,c:a.ink,w:1,base:0.34}); } }
  else if(K==='stipple'){ if(a.n%2===0){ pushMark({k:'dot',x:a.x+(rnd()-0.5)*10,y:a.y+(rnd()-0.5)*10,r:1.1+rnd()*0.9,c:a.ink,w:1}); } }
  else if(K==='rings'){ if(a.n%30===0){ pushMark({k:'arc',x:a.x,y:a.y,r:5+((a.n/30)%5)*4.5,a0:0,a1:6.283,c:a.ink,w:1}); } }
  else if(K==='strings'){ if(a.n%40===0){ a.sx=a.x; a.sy=a.y; } if(a.n%40===20 && a.sx!==undefined){ pushMark({k:'seg',x:a.sx,y:a.sy,x2:a.x,y2:a.y,c:a.ink,w:0.9}); pushMark({k:'seg',x:a.sx,y:a.sy,x2:a.x+(rnd()-0.5)*22,y2:a.y+(rnd()-0.5)*22,c:a.ink,w:0.9}); } }
  else if(K==='columns'){ if(a.n%3===0){ const off=Math.sin(a.x*0.05+a.ph)*7; pushMark({k:'seg',x:a.x,y:a.y+off,x2:a.x,y2:a.y+off+9,c:a.ink,w:1.6}); } }
  else if(K==='membrane'){ if(a.n%2===0){ const off=Math.sin(a.x*0.045+a.y*0.03+a.ph)*5; pushMark({k:'dot',x:a.x,y:a.y+off,r:1.5,c:a.ink,w:1}); } }
  else if(K==='grid'){ if(a.n%22===0){ const gx=Math.round(a.x/18)*18, gy=Math.round(a.y/18)*18; if(rnd()<0.55) pushMark({k:'seg',x:gx-7,y:gy,x2:gx+7,y2:gy,c:a.ink,w:1.2}); else pushMark({k:'seg',x:gx,y:gy-7,x2:gx,y2:gy+7,c:a.ink,w:1.2}); } }
  else if(K==='glyphs'){ if(a.n%30===0){ const g=(rnd()*4)|0, s=4+rnd()*3; if(g===0) pushMark({k:'seg',x:a.x-s,y:a.y,x2:a.x+s,y2:a.y,c:a.ink,w:1.5}); else if(g===1){ pushMark({k:'seg',x:a.x,y:a.y-s,x2:a.x,y2:a.y+s,c:a.ink,w:1.5}); } else if(g===2){ pushMark({k:'seg',x:a.x-s,y:a.y-s,x2:a.x+s,y2:a.y+s,c:a.ink,w:1.5}); } else { pushMark({k:'arc',x:a.x,y:a.y,r:s,a0:0,a1:6.283,c:a.ink,w:1.4}); } } }
}
function drawMark(m){
  ctx.strokeStyle=m.c; ctx.fillStyle=m.c; ctx.globalAlpha=(m.base||0.85)*m.a; ctx.lineWidth=m.w||1;
  ctx.beginPath();
  if(m.k==='seg'){ ctx.moveTo(m.x,m.y); ctx.lineTo(m.x2,m.y2); ctx.stroke(); }
  else if(m.k==='arc'){ ctx.arc(m.x,m.y,m.r,m.a0,m.a1); ctx.stroke(); }
  else if(m.k==='ell'){ ctx.ellipse(m.x,m.y,m.rx,m.ry,m.rot,0,6.283); ctx.stroke(); }
  else if(m.k==='dot'){ ctx.arc(m.x,m.y,m.r,0,6.283); ctx.fill(); }
  ctx.globalAlpha=1;
}
let finger=null, fingerTrail=[], lastTapMs=-9999, tapX=0, tapY=0, prerolled=false;
function stepWorld(px,py){
  for(const a of AGENTS) agentStep(a,px,py);
  if(finger){ fingerTrail.push({x:finger.x,y:finger.y}); if(fingerTrail.length>2){ const p0=fingerTrail[fingerTrail.length-2]; pushMark({k:'seg',x:p0.x,y:p0.y,x2:finger.x,y:finger.y,c:BONE,w:1.6}); } }
  for(let i=0;i<marks.length;i++){ marks[i].a*=FADE; }
  if(marks.length && marks[0].a<0.02) marks.splice(0,Math.min(400,marks.length));
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  if(w!==W||h!==H||!occ){
    W=w; H=h; gw=Math.ceil(w/GCELL); gh=Math.ceil(h/GCELL); occ=new Float32Array(gw*gh); placeAgents();
    if(!prerolled){ prerolled=true; for(let i=0;i<900;i++) stepWorld(null,null); }
  }
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,w,h);
  for(const m of marks) drawMark(m);
  if(finger){ ctx.fillStyle=BONE; ctx.beginPath(); ctx.arc(finger.x,finger.y,2.4,0,6.283); ctx.fill(); }
  return {};
}
function frame(nowMs){ stepWorld(finger?finger.x:null, finger?finger.y:null); return drawFrame(nowMs); }

canvas.addEventListener('pointerdown',e=>{
  const now=performance.now();
  if(now-lastTapMs<320 && Math.abs(e.clientX-tapX)<28 && Math.abs(e.clientY-tapY)<28){
    marks=[]; recent=[]; if(occ) occ.fill(0); lastTapMs=-9999; finger=null; frame(now); return; // double-tap clears
  }
  lastTapMs=now; tapX=e.clientX; tapY=e.clientY;
  finger={x:e.clientX,y:e.clientY}; fingerTrail=[{x:e.clientX,y:e.clientY}];
});
canvas.addEventListener('pointermove',e=>{ if(finger){ finger.x=e.clientX; finger.y=e.clientY; } });
function endP(){ finger=null; fingerTrail=[]; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ frame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
frame(2400);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
