<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№16 · Phyllotaxis</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0c; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(245,240,228,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.85); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another phyllotaxis</div>
<script>
'use strict';
// No16 Phyllotaxis.
// The sunflower rule, drawn plainly: point i sits at angle
// i x 137.508 degrees (the golden angle) and radius proportional to
// sqrt(i), so the dots pack evenly from center to rim with no spokes
// and no rings, only the spirals your eye invents. Dot size grows
// slowly with radius. Two inks alternate by radius band (warm white
// and gold) on near-black. A tiny seeded jitter on the angle, a
// fraction of a degree, decides whether the spirals read as 34/55 or
// dissolve into grain.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '16', 10) || 16;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0a0a0c';
const GOLDEN = 137.508 * Math.PI / 180;

function compose(s) {
  const rnd = mulberry32(s);
  return {
    jitter: (rnd() - 0.5) * 0.0035,          // radians on the golden angle
    count: 1400 + ((rnd() * 500) | 0),
    band: 0.16 + rnd() * 0.10,               // radius band width for ink alternation
    rot: rnd() * Math.PI * 2
  };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2;
  const R = S * 0.46;
  const maxR = Math.sqrt(p.count);

  for (let i = p.count; i >= 1; i--) {
    const f = Math.sqrt(i) / maxR;                       // 0..1
    const a = p.rot + i * (GOLDEN + p.jitter);
    const x = cx + Math.cos(a) * f * R;
    const y = cy + Math.sin(a) * f * R;
    const bandIdx = Math.floor(f / p.band);
    ctx.fillStyle = bandIdx % 2 === 0 ? '#f5f0e4' : '#d4af37';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0.6, (0.35 + f * 1.15) * S / 340), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
