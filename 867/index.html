<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№867 Posted Backward</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №867 Posted Backward, ZW5 / PP1267, study #263 zach-wolfe.
  // A diary of frames surfacing in reverse time order. Each frame
  // appears alone, fullscreen, with a one-word caption beneath
  // (coachella / cancun / glacier / portland / cheesesteak),
  // holds, and is replaced by an older one. The feed reads like
  // remembering, not releasing. Watch-only; the cadence is the
  // content, and skipping ahead would be a different piece.
  // Each frame carries its own memory-color; the captions sit in
  // quiet white on black. Film-grain dust gathers on the older
  // frames. Visual-only: no WebAudio, no autoplay audio, per the
  // Franke rule.
  var GROUND = '#0a0a0a'; // page ground, black

  // Fixed-phase first frame: FIRST_T = 0 s into a 40 s cycle.
  // Five frames, 8 s each: 6.5 s hold, 1.5 s slow crossfade into
  // the next, older frame. Grain breathing is 4 s, every period
  // divides 40, so the frame at FIRST_T + 40 equals the frame at
  // FIRST_T and the queue loops deterministically.
  var FIRST_T = 0;
  var CYCLE = 40;
  var SLOT = 8;
  var FADE = 1.5;
  var SEED = 867;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }

  // ---- The five memories, newest first ---------------------------
  // Each frame: its own memory-color, its own small scene, drawn
  // procedurally from a fixed seed. Age 0 is newest, age 4 oldest.
  var FRAMES = [
    { word: 'coachella',  age: 0 },
    { word: 'cancun',    age: 1 },
    { word: 'glacier',   age: 2 },
    { word: 'portland',  age: 3 },
    { word: 'cheesesteak', age: 4 }
  ];
  var WHITE = [240, 238, 232];

  // ---- Fixed dust tables: speckles per frame, heavier on older ---
  var dustRng = mulberry32(SEED * 13 + 5);
  var DUST = [];
  var di, dj;
  for (di = 0; di < 5; di++) {
    var n = 26 + di * 14; // older frames carry more dust
    var arr = [];
    for (dj = 0; dj < n; dj++) {
      arr.push({
        x: dustRng(), y: dustRng(),
        r: 0.001 + dustRng() * 0.0024,
        ph: dustRng() * Math.PI * 2,
        light: dustRng() > 0.45
      });
    }
    DUST.push(arr);
  }
  // ---- Fixed crowd / sparkle / rain tables ------------------------
  var dotRng = mulberry32(SEED * 29 + 11);
  var CROWD = [];
  for (di = 0; di < 90; di++) {
    CROWD.push({ x: dotRng(), y: 0.86 + dotRng() * 0.12, r: 0.004 + dotRng() * 0.008, ph: dotRng() * Math.PI * 2 });
  }
  var RAIN = [];
  for (di = 0; di < 46; di++) {
    RAIN.push({ x: dotRng(), y: dotRng(), len: 0.02 + dotRng() * 0.03, ph: dotRng() * Math.PI * 2 });
  }
  var SPARK = [];
  for (di = 0; di < 40; di++) {
    SPARK.push({ x: dotRng(), y: dotRng() * 0.55, r: 0.001 + dotRng() * 0.002, ph: dotRng() * Math.PI * 2 });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.fsWord = Math.round(clamp(W * 0.042, 22, 34));
    // Frame area: below the caption plate, above the word caption.
    L.frameTop = 0.115;
    L.frameH = 0.68;
    L.wordY = 0.115 + 0.68 + 0.055;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Queue position: which frame, how far into its crossfade ----
  function queueAt(t) {
    var p = (((t - FIRST_T) % CYCLE) + CYCLE) % CYCLE;
    var slot = Math.floor(p / SLOT);
    var local = p - slot * SLOT;
    var fade = (local > SLOT - FADE) ? smooth((local - (SLOT - FADE)) / FADE) : 0;
    return { cur: slot, next: (slot + 1) % 5, fade: fade };
  }

  // ---- Film-grain dust: heavier and slower on older frames --------
  function drawDust(fx, fy, fw, fh, t, age) {
    var arr = DUST[age];
    var base = 0.10 + age * 0.07;
    var i, g, ga;
    for (i = 0; i < arr.length; i++) {
      g = arr[i];
      ga = base * (0.45 + 0.55 * Math.sin(2 * Math.PI * (t - FIRST_T) / 4 + g.ph));
      if (ga < 0.02) { continue; }
      if (g.light) {
        ctx.fillStyle = rgba([245, 240, 225], a4(ga));
      } else {
        ctx.fillStyle = rgba([12, 10, 8], a4(ga * 0.85));
      }
      ctx.fillRect(fx + g.x * fw, fy + g.y * fh, Math.max(1, g.r * fw), Math.max(1, g.r * fw));
    }
    // Older frames also carry a faint warm-grey age wash.
    if (age > 0) {
      ctx.fillStyle = rgba([210, 200, 185], a4(0.04 * age));
      ctx.fillRect(fx, fy, fw, fh);
    }
    // Soft vignette, the remembered edge.
    var vg = ctx.createRadialGradient(fx + fw / 2, fy + fh / 2, Math.min(fw, fh) * 0.35,
      fx + fw / 2, fy + fh / 2, Math.max(fw, fh) * 0.72);
    vg.addColorStop(0, rgba([10, 8, 6], 0));
    vg.addColorStop(1, rgba([10, 8, 6], a4(0.22 + age * 0.03)));
    ctx.fillStyle = vg;
    ctx.fillRect(fx, fy, fw, fh);
  }

  // ---- Frame 0: coachella, desert sunset, ferris wheel ------------
  function drawCoachella(fx, fy, fw, fh, t) {
    var sky = ctx.createLinearGradient(0, fy, 0, fy + fh);
    sky.addColorStop(0, rgb([58, 24, 66]));
    sky.addColorStop(0.45, rgb([214, 84, 72]));
    sky.addColorStop(0.75, rgb([246, 150, 84]));
    sky.addColorStop(1, rgb([252, 206, 130]));
    ctx.fillStyle = sky;
    ctx.fillRect(fx, fy, fw, fh);
    // Low sun, a pale disc sinking.
    ctx.fillStyle = rgba([255, 236, 196], a4(0.95));
    circle(fx + fw * 0.68, fy + fh * 0.52, Math.min(fw, fh) * 0.075);
    ctx.fill();
    // Ferris wheel, dark silhouette against the sunset. Sized by
    // the smaller frame dimension so it never crops on phones.
    var wx = fx + fw * 0.30, wy = fy + fh * 0.52, wr = Math.min(fw, fh) * 0.30;
    ctx.strokeStyle = rgba([40, 14, 30], a4(0.92));
    ctx.lineWidth = Math.max(1.5, fh * 0.012);
    circle(wx, wy, wr);
    ctx.stroke();
    var a, k;
    for (k = 0; k < 8; k++) {
      a = k * Math.PI / 4 + 0.2;
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx + Math.cos(a) * wr, wy + Math.sin(a) * wr);
      ctx.stroke();
    }
    for (k = 0; k < 8; k++) {
      a = k * Math.PI / 4 + 0.2;
      circle(wx + Math.cos(a) * wr, wy + Math.sin(a) * wr, fh * 0.018);
      ctx.fillStyle = rgba([40, 14, 30], a4(0.92));
      ctx.fill();
    }
    // Wheel supports and ground.
    ctx.beginPath();
    ctx.moveTo(wx - wr * 0.55, fy + fh * 0.86);
    ctx.lineTo(wx, wy);
    ctx.lineTo(wx + wr * 0.55, fy + fh * 0.86);
    ctx.stroke();
    ctx.fillStyle = rgba([40, 14, 30], a4(0.95));
    ctx.fillRect(fx, fy + fh * 0.86, fw, fh * 0.14);
    // Palm silhouette at the right edge.
    ctx.strokeStyle = rgba([40, 14, 30], a4(0.9));
    ctx.lineWidth = Math.max(2, fh * 0.014);
    ctx.beginPath();
    ctx.moveTo(fx + fw * 0.93, fy + fh * 0.86);
    ctx.quadraticCurveTo(fx + fw * 0.90, fy + fh * 0.55, fx + fw * 0.86, fy + fh * 0.42);
    ctx.stroke();
    for (k = 0; k < 5; k++) {
      a = -0.3 - k * 0.45;
      ctx.beginPath();
      ctx.moveTo(fx + fw * 0.86, fy + fh * 0.42);
      ctx.quadraticCurveTo(
        fx + fw * 0.86 + Math.cos(a) * fw * 0.09, fy + fh * 0.42 - fh * 0.09,
        fx + fw * 0.86 + Math.cos(a) * fw * 0.13, fy + fh * 0.42 + Math.sin(a) * fh * 0.10 + fh * 0.07);
      ctx.stroke();
    }
    // Crowd dots along the ground, heads catching the light.
    var i, c;
    for (i = 0; i < CROWD.length; i++) {
      c = CROWD[i];
      var bob = 0.5 + 0.5 * Math.sin(2 * Math.PI * (t - FIRST_T) / 4 + c.ph);
      ctx.fillStyle = rgba([52, 20, 34], a4(0.55 + 0.35 * bob));
      circle(fx + c.x * fw, fy + c.y * fh, c.r * fw);
      ctx.fill();
    }
  }

  // ---- Frame 1: cancun, turquoise sea, white sand -----------------
  function drawCancun(fx, fy, fw, fh, t) {
    var sky = ctx.createLinearGradient(0, fy, 0, fy + fh * 0.42);
    sky.addColorStop(0, rgb([176, 224, 238]));
    sky.addColorStop(1, rgb([232, 246, 248]));
    ctx.fillStyle = sky;
    ctx.fillRect(fx, fy, fw, fh * 0.42);
    ctx.fillStyle = rgba([255, 250, 224], a4(0.95));
    circle(fx + fw * 0.78, fy + fh * 0.16, fh * 0.06);
    ctx.fill();
    // Sea in bands, turquoise deepening to the horizon.
    var sea = ctx.createLinearGradient(0, fy + fh * 0.42, 0, fy + fh * 0.78);
    sea.addColorStop(0, rgb([64, 190, 196]));
    sea.addColorStop(0.6, rgb([28, 160, 178]));
    sea.addColorStop(1, rgb([16, 120, 148]));
    ctx.fillStyle = sea;
    ctx.fillRect(fx, fy + fh * 0.42, fw, fh * 0.36);
    // Slow swell lines on the sea.
    ctx.strokeStyle = rgba([235, 250, 250], a4(0.5));
    ctx.lineWidth = Math.max(1, fh * 0.006);
    var i, sy;
    for (i = 0; i < 5; i++) {
      sy = fy + fh * (0.48 + i * 0.06);
      var drift = Math.sin(2 * Math.PI * (t - FIRST_T) / 4 + i * 1.7) * fw * 0.02;
      ctx.beginPath();
      ctx.moveTo(fx + fw * (0.06 + i * 0.05) + drift, sy);
      ctx.lineTo(fx + fw * (0.42 + i * 0.08) + drift, sy);
      ctx.stroke();
    }
    // White sand, a bright strip at the bottom.
    ctx.fillStyle = rgb([246, 238, 214]);
    ctx.fillRect(fx, fy + fh * 0.78, fw, fh * 0.22);
    ctx.fillStyle = rgba([220, 205, 175], a4(0.6));
    ctx.fillRect(fx, fy + fh * 0.78, fw, Math.max(1, fh * 0.008));
    // One palm leaning over the sand.
    ctx.strokeStyle = rgba([46, 84, 52], a4(0.9));
    ctx.lineWidth = Math.max(2, fh * 0.014);
    ctx.beginPath();
    ctx.moveTo(fx + fw * 0.12, fy + fh * 0.98);
    ctx.quadraticCurveTo(fx + fw * 0.14, fy + fh * 0.66, fx + fw * 0.20, fy + fh * 0.52);
    ctx.stroke();
    var k, a;
    for (k = 0; k < 5; k++) {
      a = Math.PI * (0.9 + k * 0.18);
      ctx.beginPath();
      ctx.moveTo(fx + fw * 0.20, fy + fh * 0.52);
      ctx.quadraticCurveTo(
        fx + fw * 0.20 + Math.cos(a) * fw * 0.08, fy + fh * 0.52 - fh * 0.08,
        fx + fw * 0.20 + Math.cos(a) * fw * 0.12, fy + fh * 0.52 + Math.sin(a) * fh * 0.09 + fh * 0.06);
      ctx.stroke();
    }
  }

  // ---- Frame 2: glacier, pale ice, layered peaks ------------------
  function drawGlacier(fx, fy, fw, fh, t) {
    var sky = ctx.createLinearGradient(0, fy, 0, fy + fh);
    sky.addColorStop(0, rgb([208, 226, 240]));
    sky.addColorStop(0.55, rgb([178, 206, 226]));
    sky.addColorStop(1, rgb([226, 236, 244]));
    ctx.fillStyle = sky;
    ctx.fillRect(fx, fy, fw, fh);
    // Far peaks, pale blue.
    ctx.fillStyle = rgb([158, 188, 212]);
    ctx.beginPath();
    ctx.moveTo(fx, fy + fh * 0.62);
    ctx.lineTo(fx + fw * 0.22, fy + fh * 0.30);
    ctx.lineTo(fx + fw * 0.42, fy + fh * 0.62);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(fx + fw * 0.34, fy + fh * 0.62);
    ctx.lineTo(fx + fw * 0.58, fy + fh * 0.22);
    ctx.lineTo(fx + fw * 0.82, fy + fh * 0.62);
    ctx.closePath();
    ctx.fill();
    // Near ice face, brighter, with crevasse lines.
    ctx.fillStyle = rgb([196, 220, 234]);
    ctx.beginPath();
    ctx.moveTo(fx, fy + fh * 0.78);
    ctx.lineTo(fx + fw * 0.18, fy + fh * 0.48);
    ctx.lineTo(fx + fw * 0.46, fy + fh * 0.66);
    ctx.lineTo(fx + fw * 0.72, fy + fh * 0.44);
    ctx.lineTo(fx + fw, fy + fh * 0.70);
    ctx.lineTo(fx + fw, fy + fh);
    ctx.lineTo(fx, fy + fh);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba([110, 150, 180], a4(0.65));
    ctx.lineWidth = Math.max(1, fh * 0.006);
    var i;
    for (i = 0; i < 6; i++) {
      var cx = fx + fw * (0.10 + i * 0.15);
      ctx.beginPath();
      ctx.moveTo(cx, fy + fh * (0.62 + (i % 3) * 0.05));
      ctx.lineTo(cx + fw * 0.03, fy + fh * (0.78 + (i % 2) * 0.06));
      ctx.stroke();
    }
    // Snowfield at the bottom.
    ctx.fillStyle = rgb([238, 244, 248]);
    ctx.fillRect(fx, fy + fh * 0.86, fw, fh * 0.14);
    // Ice sparkle, slow breathing.
    var s, tw;
    for (i = 0; i < SPARK.length; i++) {
      s = SPARK[i];
      tw = 0.5 + 0.5 * Math.sin(2 * Math.PI * (t - FIRST_T) / 4 + s.ph);
      ctx.fillStyle = rgba([255, 255, 255], a4(0.35 + 0.5 * tw));
      ctx.fillRect(fx + s.x * fw, fy + s.y * fh, Math.max(1, s.r * fw), Math.max(1, s.r * fw));
    }
  }

  // ---- Frame 3: portland, grey-green rain, bridge -----------------
  function drawPortland(fx, fy, fw, fh, t) {
    var sky = ctx.createLinearGradient(0, fy, 0, fy + fh);
    sky.addColorStop(0, rgb([126, 138, 128]));
    sky.addColorStop(0.6, rgb([104, 118, 106]));
    sky.addColorStop(1, rgb([88, 100, 92]));
    ctx.fillStyle = sky;
    ctx.fillRect(fx, fy, fw, fh);
    // Bridge arc across the frame, dark silhouette.
    ctx.strokeStyle = rgba([52, 58, 54], a4(0.95));
    ctx.lineWidth = Math.max(2, fh * 0.016);
    ctx.beginPath();
    ctx.moveTo(fx, fy + fh * 0.62);
    ctx.quadraticCurveTo(fx + fw * 0.5, fy + fh * 0.18, fx + fw, fy + fh * 0.62);
    ctx.stroke();
    // Deck line and suspension drops.
    ctx.lineWidth = Math.max(1.5, fh * 0.010);
    ctx.beginPath();
    ctx.moveTo(fx, fy + fh * 0.62);
    ctx.lineTo(fx + fw, fy + fh * 0.62);
    ctx.stroke();
    var i;
    for (i = 1; i < 9; i++) {
      var bx = fx + fw * i / 9;
      var arcY = fy + fh * 0.62 - Math.sin(Math.PI * i / 9) * fh * 0.22;
      ctx.beginPath();
      ctx.moveTo(bx, arcY);
      ctx.lineTo(bx, fy + fh * 0.62);
      ctx.stroke();
    }
    // River below the deck, darker and still.
    ctx.fillStyle = rgb([70, 82, 76]);
    ctx.fillRect(fx, fy + fh * 0.68, fw, fh * 0.32);
    ctx.strokeStyle = rgba([150, 164, 152], a4(0.35));
    ctx.lineWidth = Math.max(1, fh * 0.005);
    for (i = 0; i < 4; i++) {
      var ry = fy + fh * (0.74 + i * 0.06);
      ctx.beginPath();
      ctx.moveTo(fx + fw * 0.08, ry);
      ctx.lineTo(fx + fw * (0.5 + i * 0.08), ry);
      ctx.stroke();
    }
    // Rain streaks, drifting slowly down.
    ctx.strokeStyle = rgba([210, 220, 210], a4(0.4));
    ctx.lineWidth = Math.max(1, fh * 0.004);
    var r, drop;
    for (i = 0; i < RAIN.length; i++) {
      r = RAIN[i];
      drop = (((t - FIRST_T) / 4 + r.ph / (Math.PI * 2)) % 1);
      var rx = fx + r.x * fw;
      var ryy = fy + ((r.y + drop * 0.9) % 1) * fh;
      ctx.beginPath();
      ctx.moveTo(rx, ryy);
      ctx.lineTo(rx - fw * 0.004, ryy + r.len * fh);
      ctx.stroke();
    }
  }

  // ---- Frame 4: cheesesteak, warm diner neon ----------------------
  function drawCheesesteak(fx, fy, fw, fh, t) {
    var bg = ctx.createLinearGradient(0, fy, 0, fy + fh);
    bg.addColorStop(0, rgb([46, 26, 20]));
    bg.addColorStop(0.6, rgb([66, 34, 24]));
    bg.addColorStop(1, rgb([38, 20, 16]));
    ctx.fillStyle = bg;
    ctx.fillRect(fx, fy, fw, fh);
    // Neon sign glow, warm yellow-pink, breathing slowly.
    var glow = 0.75 + 0.25 * Math.sin(2 * Math.PI * (t - FIRST_T) / 4 + 0.8);
    var ng = ctx.createRadialGradient(fx + fw * 0.5, fy + fh * 0.30, 0,
      fx + fw * 0.5, fy + fh * 0.30, fw * 0.42);
    ng.addColorStop(0, rgba([255, 176, 84], a4(0.55 * glow)));
    ng.addColorStop(0.5, rgba([255, 120, 90], a4(0.22 * glow)));
    ng.addColorStop(1, rgba([255, 120, 90], 0));
    ctx.fillStyle = ng;
    ctx.fillRect(fx, fy, fw, fh);
    // Sign board and its tube lettering, a simple cheesesteak bar.
    ctx.fillStyle = rgb([24, 12, 10]);
    ctx.fillRect(fx + fw * 0.16, fy + fh * 0.16, fw * 0.68, fh * 0.26);
    ctx.strokeStyle = rgba([255, 190, 100], a4(0.9 * glow));
    ctx.lineWidth = Math.max(1.5, fh * 0.010);
    ctx.strokeRect(fx + fw * 0.16, fy + fh * 0.16, fw * 0.68, fh * 0.26);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = rgba([255, 214, 140], a4(0.95 * glow));
    ctx.font = '700 ' + Math.round(fh * 0.075) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('STEAKS', fx + fw * 0.5, fy + fh * 0.29);
    ctx.textAlign = 'left';
    // Hanging lamps, three warm dots in a row.
    var i;
    for (i = 0; i < 3; i++) {
      var lx = fx + fw * (0.30 + i * 0.20);
      ctx.strokeStyle = rgba([200, 170, 130], a4(0.7));
      ctx.lineWidth = Math.max(1, fh * 0.004);
      ctx.beginPath();
      ctx.moveTo(lx, fy + fh * 0.42);
      ctx.lineTo(lx, fy + fh * 0.52);
      ctx.stroke();
      ctx.fillStyle = rgba([255, 210, 130], a4(0.9));
      circle(lx, fy + fh * 0.55, fh * 0.022);
      ctx.fill();
      var lg = ctx.createRadialGradient(lx, fy + fh * 0.55, 0, lx, fy + fh * 0.55, fh * 0.10);
      lg.addColorStop(0, rgba([255, 200, 120], a4(0.35)));
      lg.addColorStop(1, rgba([255, 200, 120], 0));
      ctx.fillStyle = lg;
      ctx.fillRect(lx - fh * 0.10, fy + fh * 0.45, fh * 0.20, fh * 0.20);
    }
    // Counter band at the bottom, with a pale top edge.
    ctx.fillStyle = rgb([84, 52, 36]);
    ctx.fillRect(fx, fy + fh * 0.78, fw, fh * 0.22);
    ctx.fillStyle = rgba([240, 220, 190], a4(0.55));
    ctx.fillRect(fx, fy + fh * 0.78, fw, Math.max(1, fh * 0.010));
    // Two stools, simple silhouettes.
    ctx.fillStyle = rgba([30, 16, 12], a4(0.9));
    for (i = 0; i < 2; i++) {
      var sx = fx + fw * (0.28 + i * 0.44);
      ctx.fillRect(sx - fw * 0.05, fy + fh * 0.68, fw * 0.10, fh * 0.02);
      ctx.fillRect(sx - fw * 0.004, fy + fh * 0.70, fw * 0.008, fh * 0.08);
    }
  }

  function drawFrame(idx, fx, fy, fw, fh, t) {
    if (idx === 0) { drawCoachella(fx, fy, fw, fh, t); }
    else if (idx === 1) { drawCancun(fx, fy, fw, fh, t); }
    else if (idx === 2) { drawGlacier(fx, fy, fw, fh, t); }
    else if (idx === 3) { drawPortland(fx, fy, fw, fh, t); }
    else { drawCheesesteak(fx, fy, fw, fh, t); }
    drawDust(fx, fy, fw, fh, t, FRAMES[idx].age);
  }

  // ---- Caption plate and hint --------------------------------------
  function drawText(q) {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(WHITE, a4(0.9));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№867 · Posted Backward', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(WHITE, a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 27', W * 0.04, H * 0.055 + L.fsDate + 6);
    // The one-word memory caption beneath its frame, crossfading
    // with the frame it belongs to. Staggered: the old word fades
    // out over the first half of the crossfade, the new word fades
    // in over the second half, so the two never sit on top of each
    // other mid-fade.
    ctx.textAlign = 'center';
    ctx.font = 'italic 600 ' + L.fsWord + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = rgba(WHITE, a4(0.92 * (1 - smooth(clamp(q.fade * 2, 0, 1)))));
    ctx.fillText(FRAMES[q.cur].word, W / 2, H * L.wordY);
    if (q.fade > 0.5) {
      ctx.fillStyle = rgba(WHITE, a4(0.92 * smooth(clamp((q.fade - 0.5) * 2, 0, 1))));
      ctx.fillText(FRAMES[q.next].word, W / 2, H * L.wordY);
    }
    ctx.fillStyle = rgba(WHITE, a4(0.75));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('One memory at a time, newest first.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var q = queueAt(t);
    var fx = W * 0.04, fy = H * L.frameTop;
    var fw = W * 0.92, fh = H * L.frameH;
    drawFrame(q.cur, fx, fy, fw, fh, t);
    if (q.fade > 0) {
      ctx.save();
      ctx.globalAlpha = a4(q.fade);
      drawFrame(q.next, fx, fy, fw, fh, t);
      ctx.restore();
    }
    // Frame edge, quiet white.
    ctx.strokeStyle = rgba(WHITE, a4(0.35));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.strokeRect(fx, fy, fw, fh);
    drawText(q);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece867 exposes the queue and the frames.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece867 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      slot: SLOT,
      fade: FADE,
      queueAt: function (t) { return queueAt(t); },
      words: FRAMES.map(function (f) { return f.word; }),
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 40 s cycle, closed-form. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
