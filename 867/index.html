<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kind, Ordinary, Happy, Pure</title>
<style>
  html, body { margin: 0; padding: 0; background: #030304; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // Palette (strict)
  var BLACK = "#030304";
  var GRID = "#2A3B4A";
  var PULSE = "#4D7A99";
  var MURMUR = "#E8DCC8";
  var TRAIL = "#8A7A62";

  function hexRGB(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  function rgba(hex, a) {
    var c = hexRGB(hex);
    return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
  }
  function mix(h1, h2, k) {
    var a = hexRGB(h1), b = hexRGB(h2);
    return "rgb(" + Math.round(a[0] + (b[0] - a[0]) * k) + "," +
                     Math.round(a[1] + (b[1] - a[1]) * k) + "," +
                     Math.round(a[2] + (b[2] - a[2]) * k) + ")";
  }

  // Seeded RNG (mulberry32)
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : 0;
      var sh = window.screen ? window.screen.height : 0;
      var mn = Math.min(sw, sh);
      if (mn > 0 && mn < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv && vv.width ? vv.width : window.innerWidth;
    var h = vv && vv.height ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Grid: strict 120 BPM ----------
  var BEAT = 0.5; // seconds per beat

  // ---------- Murmur: autonomous wander, per-epoch seeded LFO sums ----------
  // Epochs: { start: seconds, seed: int }. Path inside an epoch is a closed-form
  // sum of sines whose periods are never multiples of the 0.5 s beat, so the
  // murmur can never land on the grid.
  var epochs = [{ start: 0, seed: 867106 }];
  var epochParams = {};

  function paramsFor(seed) {
    if (epochParams[seed]) return epochParams[seed];
    var rnd = mulberry32(seed);
    var p = {
      px1: rnd() * Math.PI * 2, px2: rnd() * Math.PI * 2,
      py1: rnd() * Math.PI * 2, py2: rnd() * Math.PI * 2,
      tx1: 19.7 + rnd() * 9.0,  tx2: 5.31 + rnd() * 2.2,
      ty1: 14.9 + rnd() * 7.0,  ty2: 4.13 + rnd() * 1.7,
      ax1: 0.24 + rnd() * 0.10, ax2: 0.07 + rnd() * 0.05,
      ay1: 0.13 + rnd() * 0.06, ay2: 0.045 + rnd() * 0.03,
      breath: 3.41 + rnd() * 1.3
    };
    epochParams[seed] = p;
    return p;
  }

  function epochAt(t) {
    var ep = epochs[0];
    for (var i = 0; i < epochs.length; i++) {
      if (epochs[i].start <= t) ep = epochs[i]; else break;
    }
    return ep;
  }

  function wander(t) {
    var ep = epochAt(t);
    var p = paramsFor(ep.seed);
    var lt = t - ep.start;
    var x = 0.5 + p.ax1 * Math.sin(2 * Math.PI * lt / p.tx1 + p.px1)
                  + p.ax2 * Math.sin(2 * Math.PI * lt / p.tx2 + p.px2);
    var y = 0.5 + p.ay1 * Math.sin(2 * Math.PI * lt / p.ty1 + p.py1)
                  + p.ay2 * Math.sin(2 * Math.PI * lt / p.ty2 + p.py2);
    return { x: x * W, y: y * H, breath: p.breath };
  }

  // ---------- Recorded interaction ----------
  // Drag segments: { t0, t1, samples: [{t, x, y}], releaseX, releaseY }
  var drags = [];
  var taps = []; // { t, x }
  var activeDrag = null;

  function dragPosAt(t) {
    // Returns {x, y, mode} if time t is governed by a drag or its release blend.
    for (var i = drags.length - 1; i >= 0; i--) {
      var d = drags[i];
      if (t >= d.t0 && t <= d.t1) {
        var s = d.samples;
        if (s.length === 1) return { x: s[0].x, y: s[0].y };
        for (var j = 1; j < s.length; j++) {
          if (t <= s[j].t) {
            var span = s[j].t - s[j - 1].t;
            var k = span > 0 ? (t - s[j - 1].t) / span : 0;
            return { x: s[j - 1].x + (s[j].x - s[j - 1].x) * k,
                     y: s[j - 1].y + (s[j].y - s[j - 1].y) * k };
          }
        }
        var last = s[s.length - 1];
        return { x: last.x, y: last.y };
      }
      if (t > d.t1 && t <= d.t1 + 1.2) {
        var bk = (t - d.t1) / 1.2;
        var bs = bk * bk * (3 - 2 * bk);
        var wpos = wander(t);
        return { x: d.releaseX + (wpos.x - d.releaseX) * bs,
                 y: d.releaseY + (wpos.y - d.releaseY) * bs };
      }
    }
    if (activeDrag && t >= activeDrag.t0) {
      var as = activeDrag.samples;
      var al = as[as.length - 1];
      return { x: al.x, y: al.y };
    }
    return null;
  }

  function murmurPos(t) {
    var dp = dragPosAt(t);
    var base = dp || wander(t);
    var x = base.x, y = base.y;
    // Shiver: brief tremor after each tap, a pure function of tap times.
    for (var i = 0; i < taps.length; i++) {
      var dt = t - taps[i].t;
      if (dt > 0 && dt < 0.55) {
        var amp = Math.min(W, H) * 0.006 * Math.exp(-dt / 0.14);
        x += amp * Math.sin(2 * Math.PI * 13.7 * dt);
        y += amp * 0.7 * Math.sin(2 * Math.PI * 11.3 * dt + 1.1);
      }
    }
    var p = paramsFor(epochAt(t).seed);
    return { x: x, y: y, breath: p.breath };
  }

  // ---------- Audio (lazy, gesture-gated, guarded) ----------
  var AC = null, masterGain = null, breathOsc = null, breathGain = null, audioBeatTimer = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (typeof Ctor !== "function") return;
    try {
      AC = new Ctor();
      masterGain = AC.createGain();
      masterGain.gain.value = 0.5;
      var comp = AC.createDynamicsCompressor();
      masterGain.connect(comp);
      comp.connect(AC.destination);
      // Breath tone: soft sine, follows murmur curvature (updated per frame).
      breathOsc = AC.createOscillator();
      breathOsc.type = "sine";
      breathOsc.frequency.value = 196;
      breathGain = AC.createGain();
      breathGain.gain.value = 0.0;
      breathOsc.connect(breathGain);
      breathGain.connect(masterGain);
      breathOsc.start();
      // Grid pulses: square blips locked to the piece clock's beat times.
      var startAt = AC.currentTime;
      var beatIndex = Math.ceil(nowSec() / BEAT);
      var schedule = function () {
        if (!AC) return;
        var target = startAt + 0.1;
        while (true) {
          var bt = beatIndex * BEAT;
          var when = target + (bt - nowSec());
          if (when > AC.currentTime + 0.35) break;
          if (when >= AC.currentTime - 0.05) {
            var o = AC.createOscillator();
            o.type = "square";
            o.frequency.value = (beatIndex % 4 === 0) ? 220 : 165;
            var g = AC.createGain();
            g.gain.setValueAtTime(0.0001, Math.max(when, AC.currentTime));
            g.gain.exponentialRampToValueAtTime(0.055, Math.max(when, AC.currentTime) + 0.008);
            g.gain.exponentialRampToValueAtTime(0.0001, Math.max(when, AC.currentTime) + 0.09);
            o.connect(g); g.connect(masterGain);
            o.start(Math.max(when, AC.currentTime));
            o.stop(Math.max(when, AC.currentTime) + 0.12);
          }
          beatIndex++;
        }
        audioBeatTimer = setTimeout(schedule, 120);
      };
      schedule();
    } catch (e) { AC = null; }
  }

  function updateAudio(t) {
    if (!AC || !breathOsc) return;
    // Curvature of the murmur path near t -> breath pitch; gain swells with speed.
    var p0 = murmurPos(Math.max(0, t - 0.12));
    var p1 = murmurPos(t);
    var p2 = murmurPos(t + 0.12);
    var vx = (p2.x - p0.x) / 0.24, vy = (p2.y - p0.y) / 0.24;
    var speed = Math.sqrt(vx * vx + vy * vy) / Math.max(1, Math.min(W, H));
    var curv = Math.abs((p2.x - 2 * p1.x + p0.x) + (p2.y - 2 * p1.y + p0.y)) / Math.max(1, Math.min(W, H));
    var freq = 150 + Math.min(1, curv * 6) * 130 + speed * 30;
    var g = 0.015 + Math.min(0.05, speed * 0.10);
    try {
      breathOsc.frequency.setTargetAtTime(freq, AC.currentTime, 0.08);
      breathGain.gain.setTargetAtTime(g, AC.currentTime, 0.12);
    } catch (e) {}
  }

  // ---------- Clock ----------
  var T0 = null;
  function nowSec() {
    if (typeof performance !== "undefined" && performance.now) {
      return performance.now() / 1000;
    }
    return 0;
  }
  var clockStart = nowSec();
  function pieceTime() {
    return Math.max(0, nowSec() - clockStart);
  }

  // ---------- Pointer ----------
  function pt(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  var downAt = 0, downPos = null, lastTapAt = -10, lastTapX = 0, moved = false;

  function onDown(e) {
    ensureAudio();
    var p = pt(e);
    downAt = pieceTime(); downPos = p; moved = false;
    activeDrag = { t0: downAt, t1: downAt, samples: [{ t: downAt, x: p.x, y: p.y }], releaseX: p.x, releaseY: p.y };
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!activeDrag) return;
    var p = pt(e);
    var t = pieceTime();
    if (downPos && Math.abs(p.x - downPos.x) + Math.abs(p.y - downPos.y) > 6) moved = true;
    activeDrag.samples.push({ t: t, x: p.x, y: p.y });
    activeDrag.t1 = t; activeDrag.releaseX = p.x; activeDrag.releaseY = p.y;
  }
  function onUp(e) {
    var t = pieceTime();
    if (activeDrag) {
      activeDrag.t1 = t;
      drags.push(activeDrag);
      activeDrag = null;
    }
    if (!moved && downPos && t - downAt < 0.35) {
      // Tap (or double-tap)
      if (t - lastTapAt < 0.32) {
        // Double-tap: reseed the wander from now.
        var last = epochs[epochs.length - 1];
        epochs.push({ start: t, seed: (last.seed * 1103515245 + 12345) % 2147483648 });
        lastTapAt = -10;
      } else {
        taps.push({ t: t, x: downPos.x });
        lastTapAt = t; lastTapX = downPos.x;
      }
    }
    downPos = null;
  }
  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);
  canvas.addEventListener("touchstart", function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });

  // ---------- Draw ----------
  function draw(t) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);

    var S = Math.min(W, H);
    var phone = isPhone();

    // Grid columns
    var spacing = S / (phone ? 11 : 15);
    var cols = Math.ceil(W / spacing) + 1;
    var beatPhase = (t / BEAT) % 1;
    var pulse = Math.exp(-beatPhase * 3.2); // 1 at the beat, decaying
    ctx.lineWidth = Math.max(1, S * 0.0016);
    for (var i = 0; i < cols; i++) {
      var x = i * spacing + spacing * 0.5;
      var b = 0.30 + 0.70 * pulse;
      // Tap flare: columns near a recent tap brighten briefly.
      for (var j = 0; j < taps.length; j++) {
        var dt = t - taps[j].t;
        if (dt > 0 && dt < 0.7) {
          var dx = Math.abs(x - taps[j].x) / (spacing * 2.2);
          if (dx < 1) b += (1 - dx) * Math.exp(-dt / 0.22) * 0.9;
        }
      }
      if (b > 1) b = 1;
      ctx.strokeStyle = mix(GRID, PULSE, b * 0.85);
      ctx.globalAlpha = 0.35 + 0.65 * b;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Murmur trail: past positions from the same closed-form/event function.
    var TRAIL_N = 30, TRAIL_SPAN = 2.8;
    var head = murmurPos(t);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (var k = TRAIL_N; k >= 1; k--) {
      var sAgo = (k / TRAIL_N) * TRAIL_SPAN;
      // Past times may be negative before the first seconds: the closed-form
      // wander is defined for them, so frame one opens with a full trail.
      var pa = murmurPos(t - sAgo);
      var pb = murmurPos(t - sAgo + TRAIL_SPAN / TRAIL_N);
      var frac = 1 - k / TRAIL_N;
      ctx.strokeStyle = rgba(TRAIL, 0.06 + 0.36 * frac * frac);
      ctx.lineWidth = (S * 0.004) + (S * 0.016) * frac;
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.stroke();
    }

    // Murmur head: breathing soft blob from layered flat-alpha discs.
    var breathe = 1 + 0.13 * Math.sin(2 * Math.PI * t / head.breath);
    var r = S * 0.020 * breathe;
    var layers = [
      [3.1, 0.045], [2.3, 0.07], [1.65, 0.11], [1.2, 0.20], [0.85, 0.42], [0.55, 0.85]
    ];
    for (var L = 0; L < layers.length; L++) {
      ctx.fillStyle = rgba(MURMUR, layers[L][1]);
      ctx.beginPath();
      ctx.arc(head.x, head.y, r * layers[L][0], 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Frame one: synchronous, t = 0, a beat.
  draw(0);

  // Live loop
  if (typeof requestAnimationFrame === "function") {
    var loop = function () {
      var t = pieceTime();
      draw(t);
      updateAudio(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
