<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>System, Not Picture</title>
<style>
  html, body { margin:0; padding:0; background:#07080C; height:100%; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.1007 "System, Not Picture" - study #123 yuya-hanai, PP168 "The Credit
  // Line": the system shown instead of the image. Left, four live input feeds
  // (CAMERA / TRACK / DATA / MIC). Center, the machine: four chunky blocks
  // (SENSE / DETECT / RENDER / OUTPUT) that pulse as data passes through.
  // Right, the image the system renders - a figure moving through light,
  // deliberately subordinate: the system column is taller than the picture.
  // Mint packets travel the flow lines constantly, so the plumbing is never
  // hidden: feeds enter at SENSE by default, packets walk the blocks in
  // order, and the figure's phrase advances only when packets arrive at
  // OUTPUT. Drag a feed onto another block to reroute it; the image changes
  // character because its feed now skips stages. Tap a block to open it.
  // Double-tap rebuilds. Everything is a closed-form function of piece time
  // plus recorded visitor events. Frame one is the synchronous draw at
  // T0 = 13 s. The MIC feed is simulated data; no microphone is ever used.

  var T0 = 13;
  var BASE_SEED = 1007168;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var ROOM = '#07080C', PANEL = '#14161C', IMG_BG = '#0E1118',
      EDGE = '#3A3D46', FLOW = '#2B3038', ACTIVE = '#4FD6FF',
      PULSE = '#7DF9C6', TAG = '#8A8D84', INK = '#F2F4F6',
      MAGENTA = '#FF4FD8', YELLOW = '#FFD93B', RED = '#FF2B2B',
      OVERLAY = '#0A0C10';
  var ACCENTS = ['#4FD6FF', '#FF4FD8', '#7DF9C6', '#FFD93B'];

  var FEED_TAGS = ['CAMERA', 'TRACK', 'DATA', 'MIC'];
  var BLOCK_TAGS = ['SENSE', 'DETECT', 'RENDER', 'OUTPUT'];
  // spawn schedules per feed (epoch-local seconds)
  var FEEDS = [
    { period: 3.63, phase: 0.83 },
    { period: 2.90, phase: 1.35 },
    { period: 4.10, phase: 0.20 },
    { period: 3.70, phase: 2.60 }
  ];

  // ---------- deterministic helpers ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function ihash(n) {
    var x = Math.imul((n | 0) ^ 0x9E3779B9, 0x85EBCA6B);
    x ^= x >>> 13; x = Math.imul(x, 0xC2B2AE35); x ^= x >>> 16;
    return (x >>> 0) / 4294967296;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, f) { return a + (b - a) * f; }
  function sstep01(x) { x = clamp(x, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); }
  var TAU = Math.PI * 2;

  // ---------- visitor event state (recorded, never integrated) ----------
  var resets = [];       // absolute piece times of double-tap rebuilds
  var reroutes = [];     // { t, feed, block } entry-block changes
  var opens = [];        // { t, block } block openings (10 s each)
  var pendingTap = null; // block tap waiting out the double-tap window
  var lastTap = null;
  var pDown = null;
  var dragState = { active: false, feed: -1, x: 0, y: 0 };
  var lastLayout = null;
  var viewW = 0, viewH = 0, startStamp = null;

  function epochIndexAt(t) {
    var n = 0;
    for (var i = 0; i < resets.length; i++) if (resets[i] <= t) n++;
    return n;
  }
  function epochStartAt(t) {
    var s = 0;
    for (var i = 0; i < resets.length; i++) if (resets[i] <= t) s = resets[i];
    return s;
  }
  function entryAtAbs(feed, absT) {
    var epS = epochStartAt(absT), e = 0;
    for (var i = 0; i < reroutes.length; i++) {
      var ev = reroutes[i];
      if (ev.feed === feed && ev.t >= epS && ev.t <= absT) e = ev.block;
    }
    return e;
  }
  function openAt(t) {
    var o = null;
    for (var i = 0; i < opens.length; i++) if (opens[i].t <= t) o = opens[i];
    if (o && t < o.t + 10) return o;
    return null;
  }
  function commitPending(t) {
    if (pendingTap && t > pendingTap.t + 0.35) {
      opens.push({ t: pendingTap.t, block: pendingTap.block });
      pendingTap = null;
    }
  }

  // ---------- layout ----------
  function computeLayout(w, h) {
    var phone = false, sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) {}
    var mind = Math.min(sw, sh);
    phone = mind > 0 ? (mind < 700) : (h > w * 1.15);
    var feeds = [], blocks = [], i;
    for (i = 0; i < 4; i++) {
      feeds.push({
        x: 0.028 * w, y: (0.035 + i * 0.172) * h,
        w: 0.234 * w, h: 0.148 * h
      });
      feeds[i].cx = feeds[i].x + feeds[i].w / 2;
      feeds[i].cy = feeds[i].y + feeds[i].h / 2;
      blocks.push({
        x: 0.322 * w, y: (0.035 + i * 0.224) * h,
        w: 0.230 * w, h: 0.192 * h
      });
      blocks[i].cx = blocks[i].x + blocks[i].w / 2;
      blocks[i].cy = blocks[i].y + blocks[i].h / 2;
    }
    var img = { x: 0.612 * w, y: 0.100 * h, w: 0.360 * w, h: 0.760 * h };
    img.cx = img.x + img.w / 2; img.cy = img.y + img.h / 2;
    return {
      w: w, h: h, phone: phone, U: Math.min(w, h),
      feeds: feeds, blocks: blocks, img: img,
      midX: 0.292 * w, imgMidX: 0.582 * w,
      fs: clamp(Math.round(Math.min(w, h) * 0.021), 8, 12)
    };
  }

  // ---------- the four feeds: seeded live generators ----------
  function camBlobs(lt, ep) {
    var out = [], i;
    for (i = 0; i < 5; i++) {
      var s1 = 0.11 + ihash(ep * 41 + i * 7 + 1) * 0.10;
      var s2 = 0.07 + ihash(ep * 43 + i * 7 + 2) * 0.09;
      out.push({
        nx: 0.5 + 0.30 * Math.sin(lt * TAU * s1 + ihash(ep * 3 + i * 11) * TAU),
        ny: 0.5 + 0.30 * Math.cos(lt * TAU * s2 + ihash(ep * 5 + i * 13) * TAU),
        r: 0.17 + 0.11 * Math.sin(lt * TAU * (0.05 + ihash(i * 3 + ep) * 0.06) + i * 1.7),
        col: ACCENTS[(i + ep) % 4]
      });
    }
    return out;
  }
  function camAccent(lt, ep) {
    var bs = camBlobs(lt, ep), best = bs[0];
    for (var i = 1; i < bs.length; i++) if (bs[i].r > best.r) best = bs[i];
    return best.col;
  }
  function trackDots(lt, ep) {
    var out = [], i;
    for (i = 0; i < 4; i++) {
      var a = 0.16 + ihash(ep * 17 + i * 5 + 1) * 0.14;
      var b = 0.13 + ihash(ep * 19 + i * 5 + 2) * 0.15;
      out.push({
        nx: Math.sin(lt * TAU * a + ihash(ep * 7 + i * 3) * TAU),
        ny: Math.sin(lt * TAU * b + ihash(ep * 9 + i * 3 + 1) * TAU)
      });
    }
    return out;
  }
  function trackPose(lt, ep) { return trackDots(lt, ep)[0]; }
  function micY(x01, lt, ep) {
    var env = 0.62 + 0.38 * Math.sin(lt * TAU / 6.3 + ep * 1.3);
    return env * (0.58 * Math.sin(x01 * 9 - lt * 3.1 + ep) +
                  0.30 * Math.sin(x01 * 23 - lt * 7.3 + 1.7 + ep * 2.0) +
                  0.12 * Math.sin(x01 * 41 + lt * 11.0));
  }

  // ---------- packet paths ----------
  // A packet's path is fixed at spawn by the feed's entry block at that
  // moment: feed edge -> entry block center -> down through the remaining
  // block centers -> out of OUTPUT -> into the image frame.
  function buildPath(L, feed, entry) {
    var f = L.feeds[feed], pts = [], centers = {}, cum = [0], i, j;
    function push(x, y) {
      var n = pts.length;
      if (n && Math.abs(pts[n - 1][0] - x) < 0.01 && Math.abs(pts[n - 1][1] - y) < 0.01) return;
      pts.push([x, y]);
      if (n) {
        var dx = x - pts[n - 1][0], dy = y - pts[n - 1][1];
        cum.push(cum[cum.length - 1] + Math.sqrt(dx * dx + dy * dy));
      }
    }
    push(f.x + f.w, f.cy);
    push(L.midX, f.cy);
    push(L.midX, L.blocks[entry].cy);
    push(L.blocks[entry].x, L.blocks[entry].cy);
    push(L.blocks[entry].cx, L.blocks[entry].cy);
    centers[entry] = cum[cum.length - 1];
    for (j = entry + 1; j < 4; j++) {
      push(L.blocks[j].cx, L.blocks[j].cy);
      centers[j] = cum[cum.length - 1];
    }
    push(L.blocks[3].x + L.blocks[3].w, L.blocks[3].cy);
    push(L.imgMidX, L.blocks[3].cy);
    push(L.imgMidX, L.img.cy);
    push(L.img.x, L.img.cy);
    return { pts: pts, cum: cum, total: cum[cum.length - 1], centers: centers };
  }
  function pathPos(path, d) {
    var pts = path.pts, cum = path.cum, i;
    if (d <= 0) return { x: pts[0][0], y: pts[0][1] };
    for (i = 1; i < cum.length; i++) {
      if (d <= cum[i]) {
        var f = (d - cum[i - 1]) / Math.max(0.001, cum[i] - cum[i - 1]);
        return { x: lerp(pts[i - 1][0], pts[i][0], f), y: lerp(pts[i - 1][1], pts[i][1], f) };
      }
    }
    return { x: pts[pts.length - 1][0], y: pts[pts.length - 1][1] };
  }
  var pathCache = {};
  function pathFor(L, feed, entry) {
    var key = feed + ':' + entry + ':' + L.w + 'x' + L.h;
    if (!pathCache[key]) pathCache[key] = buildPath(L, feed, entry);
    return pathCache[key];
  }

  // alive packets at epoch-local time lt (spawn abs = epStart + s)
  function alivePackets(L, lt, epStart) {
    var spd = 0.205 * L.U, out = [], f, k;
    for (f = 0; f < 4; f++) {
      var per = FEEDS[f].period, pha = FEEDS[f].phase;
      var kMin = Math.max(0, Math.floor((lt - 14 - pha) / per));
      var kMax = Math.floor((lt - pha) / per);
      for (k = kMin; k <= kMax; k++) {
        var s = pha + k * per;
        if (s > lt) continue;
        var entry = entryAtAbs(f, epStart + s);
        var path = pathFor(L, f, entry);
        var d = (lt - s) * spd;
        if (d > path.total) continue;
        out.push({ feed: f, k: k, entry: entry, path: path, d: d, spawn: s });
      }
    }
    return out;
  }
  function spawnsCount(lt) {
    var n = 0, f;
    for (f = 0; f < 4; f++) {
      if (lt >= FEEDS[f].phase) n += Math.floor((lt - FEEDS[f].phase) / FEEDS[f].period) + 1;
    }
    return n;
  }
  // OUTPUT arrivals: closed-form over spawn schedules grouped by entry
  // segments (reroutes within the epoch split a feed's spawns by entry).
  function arrivalsInfo(L, lt, ep, epStart) {
    var spd = 0.205 * L.U, count = 0, times = [], f, i;
    for (f = 0; f < 4; f++) {
      var cuts = [0];
      for (i = 0; i < reroutes.length; i++) {
        var ev = reroutes[i];
        if (ev.feed === f && ev.t > epStart && ev.t < epStart + lt) cuts.push(ev.t - epStart);
      }
      cuts.push(lt + 20);
      cuts.sort(function (a, b) { return a - b; });
      for (i = 0; i + 1 < cuts.length; i++) {
        var segA = cuts[i], segB = Math.min(cuts[i + 1], lt);
        var entry = entryAtAbs(f, epStart + segA + 0.001);
        var travel = pathFor(L, f, entry).total / spd;
        var per = FEEDS[f].period, pha = FEEDS[f].phase;
        var k0 = Math.max(0, Math.ceil((segA - pha) / per - 1e-9));
        var k1 = Math.floor((segB - pha) / per + 1e-9);
        for (var k = k0; k <= k1; k++) {
          var arr = pha + k * per + travel;
          if (arr <= lt) { count++; if (arr > lt - 16) times.push(arr); }
          else if (arr < lt + 16) times.push(arr);
        }
      }
    }
    times.sort(function (a, b) { return a - b; });
    var last = -1;
    for (i = 0; i < times.length; i++) if (times[i] <= lt) last = times[i];
    return { count: count, last: last };
  }

  // ---------- the image's figure: phrase fed by OUTPUT arrivals ----------
  function figurePhase(L, lt, ep, epStart) {
    var info = arrivalsInfo(L, lt, ep, epStart);
    if (info.count === 0 || info.last < 0) return { ph: 0.35 * Math.sin(lt * 0.5), arr: 0 };
    var u = lt - info.last;
    var ph = (info.count - 1) * 0.85 + 0.85 * (1 - Math.exp(-u * 2.0));
    return { ph: ph, arr: info.count };
  }
  function limb(x, y, ang, len) { return { x: x + Math.cos(ang) * len, y: y + Math.sin(ang) * len }; }
  // joints in px inside rect R (the image frame or an enlarged stage)
  function figureJoints(R, ph, tnx, tny) {
    var s = Math.min(R.h, R.w * 2.2), cx = R.x + R.w / 2, groundY = R.y + R.h * 0.86;
    var lean = tnx * 0.18 + 0.06 * Math.sin(ph * 0.5);
    var hip = { x: cx + tnx * R.w * 0.10 + Math.sin(ph * 0.5) * s * 0.02,
                y: groundY - s * 0.34 + Math.sin(ph * 2) * s * 0.012 };
    var chest = { x: hip.x + Math.sin(lean) * s * 0.27, y: hip.y - Math.cos(lean) * s * 0.27 };
    var head = { x: chest.x + Math.sin(lean * 1.4 + tnx * 0.12) * s * 0.105,
                 y: chest.y - Math.cos(lean * 1.2) * s * 0.105 };
    var aL = Math.PI / 2 + 1.12 + 0.45 * Math.sin(ph * 0.5 + 1.0);
    var aR = Math.PI / 2 - 1.12 + 0.45 * Math.sin(ph * 0.5 + 2.4) + tny * 0.45;
    var elL = limb(chest.x, chest.y, aL, s * 0.185);
    var haL = limb(elL.x, elL.y, aL - 0.55 - 0.2 * Math.sin(ph), s * 0.165);
    var elR = limb(chest.x, chest.y, aR, s * 0.185);
    var haR = limb(elR.x, elR.y, aR + 0.55 + 0.2 * Math.cos(ph * 0.8), s * 0.165);
    var gL = Math.PI / 2 + 0.34 * Math.sin(ph) + lean * 0.5;
    var gR = Math.PI / 2 + 0.34 * Math.sin(ph + Math.PI) + lean * 0.5;
    var knL = limb(hip.x, hip.y, gL, s * 0.175);
    var ftL = limb(knL.x, knL.y, gL - (0.28 + 0.32 * Math.max(0, Math.sin(ph + 0.7))), s * 0.165);
    var knR = limb(hip.x, hip.y, gR, s * 0.175);
    var ftR = limb(knR.x, knR.y, gR - (0.28 + 0.32 * Math.max(0, Math.sin(ph + Math.PI + 0.7))), s * 0.165);
    return { hip: hip, chest: chest, head: head, headR: s * 0.046,
             elL: elL, haL: haL, elR: elR, haR: haR,
             knL: knL, ftL: ftL, knR: knR, ftR: ftR };
  }
  function strokePts(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }
  function drawFigure(R, ph, tnx, tny, accent, colored, lwScale) {
    var J = figureJoints(R, ph, tnx, tny);
    var lw = Math.max(2, Math.min(R.h, R.w * 2.2) * 0.011) * (lwScale || 1);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.globalAlpha = 1;
    strokePts([J.hip, J.knL, J.ftL]);
    strokePts([J.hip, J.knR, J.ftR]);
    strokePts([J.hip, J.chest]);
    strokePts([J.chest, J.elL, J.haL]);
    if (colored) { ctx.strokeStyle = accent; }
    strokePts([J.chest, J.elR, J.haR]);
    ctx.strokeStyle = INK;
    ctx.beginPath(); ctx.arc(J.head.x, J.head.y, J.headR, 0, TAU); ctx.stroke();
    if (colored) {
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.arc(J.head.x, J.head.y, J.headR * 0.45, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    return J;
  }
  function drawPool(R, fx, accent, alphaMul) {
    var gy = R.y + R.h * 0.865;
    ctx.globalAlpha = 0.10 * alphaMul; ctx.fillStyle = accent;
    ctx.beginPath(); ctx.ellipse(fx, gy, R.w * 0.30, R.h * 0.045, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.10 * alphaMul; ctx.fillStyle = INK;
    ctx.beginPath(); ctx.ellipse(fx, gy, R.w * 0.17, R.h * 0.026, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.25 * alphaMul; ctx.strokeStyle = '#2BD8FF'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(fx, gy, R.w * 0.30, R.h * 0.045, 0, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---------- drawing: feeds, blocks, image ----------
  function panel(r) {
    ctx.fillStyle = PANEL; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = EDGE; ctx.lineWidth = 1; ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
  }
  function tag(txt, x, y, fs, col) {
    ctx.fillStyle = col || TAG;
    ctx.font = fs + 'px monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(txt, x, y);
  }
  function contentRect(r, L) { return { x: r.x + 5, y: r.y + L.fs + 10, w: r.w - 10, h: r.h - L.fs - 15 }; }

  function drawFeedContent(f, r, lt, ep, L) {
    var cr = contentRect(r, L), i;
    ctx.save();
    ctx.beginPath(); ctx.rect(cr.x, cr.y, cr.w, cr.h); ctx.clip();
    if (f === 0) { // CAMERA: drifting soft blobs, layered flat alpha
      var bs = camBlobs(lt, ep);
      for (i = 0; i < bs.length; i++) {
        var b = bs[i], bx = cr.x + b.nx * cr.w, by = cr.y + b.ny * cr.h, br = b.r * cr.h;
        ctx.fillStyle = b.col;
        ctx.globalAlpha = 0.10; ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.fill();
        ctx.globalAlpha = 0.16; ctx.beginPath(); ctx.arc(bx, by, br * 0.65, 0, TAU); ctx.fill();
        ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(bx, by, br * 0.35, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else if (f === 1) { // TRACK: dots on a faint grid, with short trails
      ctx.strokeStyle = FLOW; ctx.lineWidth = 1; ctx.globalAlpha = 0.7;
      ctx.beginPath();
      for (i = 1; i < 4; i++) { ctx.moveTo(cr.x + cr.w * i / 4, cr.y); ctx.lineTo(cr.x + cr.w * i / 4, cr.y + cr.h); }
      for (i = 1; i < 3; i++) { ctx.moveTo(cr.x, cr.y + cr.h * i / 3); ctx.lineTo(cr.x + cr.w, cr.y + cr.h * i / 3); }
      ctx.stroke(); ctx.globalAlpha = 1;
      var ds = trackDots(lt, ep), tr, k;
      for (i = 0; i < ds.length; i++) {
        for (k = 3; k >= 1; k--) {
          tr = trackDots(lt - k * 0.14, ep)[i];
          ctx.fillStyle = ACTIVE; ctx.globalAlpha = 0.10 * (4 - k);
          ctx.beginPath(); ctx.arc(cr.x + (tr.nx * 0.5 + 0.5) * cr.w, cr.y + (tr.ny * 0.5 + 0.5) * cr.h, 2, 0, TAU); ctx.fill();
        }
        ctx.fillStyle = ACTIVE; ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.arc(cr.x + (ds[i].nx * 0.5 + 0.5) * cr.w, cr.y + (ds[i].ny * 0.5 + 0.5) * cr.h, 2.6, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else if (f === 2) { // DATA: scrolling tick stream
      var bw = 3, gap = 6, off = (lt * 36) % gap, base = Math.floor(lt * 6);
      for (i = -1; i * gap < cr.w + gap; i++) {
        var wc = base + i;
        var hh = (0.18 + 0.78 * ihash(wc * 7 + ep * 131)) * cr.h;
        ctx.fillStyle = (wc % 9 === 0) ? PULSE : TAG;
        ctx.globalAlpha = (wc % 9 === 0) ? 0.9 : 0.55;
        ctx.fillRect(cr.x + i * gap - off, cr.y + cr.h - hh, bw, hh);
      }
      ctx.globalAlpha = 1;
    } else { // MIC: a live waveform (simulated, never a microphone)
      ctx.strokeStyle = TAG; ctx.lineWidth = 1.4; ctx.beginPath();
      var N = 40;
      for (i = 0; i <= N; i++) {
        var x01 = i / N;
        var px = cr.x + x01 * cr.w;
        var py = cr.y + cr.h / 2 + micY(x01, lt, ep) * cr.h * 0.34;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function blockGlyph(j, r, lt, ep) {
    var cx = r.x + r.w / 2, cy = r.y + r.h * 0.60, u = Math.min(r.w, r.h);
    ctx.lineWidth = 1.2;
    if (j === 0) {
      var cols = [ACCENTS[0], ACCENTS[1], ACCENTS[2]];
      for (var i = 0; i < 3; i++) {
        ctx.fillStyle = cols[i]; ctx.globalAlpha = 0.75;
        ctx.beginPath(); ctx.arc(cx + (i - 1) * u * 0.16, cy + Math.sin(lt * 1.3 + i * 2.1) * u * 0.03, u * 0.045, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else if (j === 1) {
      ctx.strokeStyle = ACTIVE; ctx.globalAlpha = 0.9;

    if (Math.sqrt((p.x - pDown.x) * (p.x - pDown.x) + (p.y - pDown.y) * (p.y - pDown.y)) > 10) {
      dragState.active = true; dragState.feed = pDown.feed;
      dragState.x = p.x; dragState.y = p.y;
    }
  }
  function onUp(ev) {
    if (!pDown) { dragState.active = false; return; }
    var p = evtPos(ev), t = pieceTime();
    if (dragState.active) {
      var tb = blockAt(p.x, p.y);
      if (tb >= 0 && tb !== entryAtAbs(pDown.feed, t)) {
        reroutes.push({ t: t, feed: pDown.feed, block: tb });
      }
      dragState.active = false;
    } else if (pDown.block >= 0 && !openAt(t)) {
      pendingTap = { t: t, block: pDown.block };
      lastTap = { t: t, x: p.x, y: p.y };
    } else {
      lastTap = { t: t, x: p.x, y: p.y };
    }
    pDown = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('mousedown', function (ev) { if (!window.PointerEvent) onDown(ev); });
    canvas.addEventListener('mousemove', function (ev) { if (!window.PointerEvent) onMove(ev); });
    canvas.addEventListener('mouseup', function (ev) { if (!window.PointerEvent) onUp(ev); });
  }

  // ---------- boot: one synchronous fixed-phase frame, then the loop ----------
  resize();
  draw(T0);
  if (rafFn) {
    startStamp = nowMs();
    rafFn(loop);
  }
})();
</script>
</body>
</html>
