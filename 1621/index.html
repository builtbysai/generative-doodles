<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Coded</title>
<style>
html, body { margin: 0; padding: 0; background: #F4F1EA; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F4F1EA';
var NAVY = '#22304A';
var SEED = 1621007;
var SEED_ARR = 1621009;
var PHASE = 1.0;
var V0 = 159; /* virtual age at load: the collage has been filling for ~2.5 min */
var SETTLE_S = 2.5; /* seconds a shape takes to drift from its edge to its spot */
var CAP = 120; /* active shapes; older ones sink beneath as new ones arrive */
var SINK_WINDOW = 5; /* arrivals over which the oldest shapes fade under */
var PALETTE = ['#E5484D', '#38D6D0', '#F2C230', '#3FA34D', '#22304A'];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
var NAVY_RGB = hexRgb(NAVY);
var PALETTE_RGB = [];
(function () { var i; for (i = 0; i < PALETTE.length; i++) PALETTE_RGB.push(hexRgb(PALETTE[i])); })();
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
function lerp(a, b, k) { return a + (b - a) * k; }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Centered square collage on both sizes; the page ground is the piece's
   own paper color, so the square reads as a sheet on the same paper. */
function compRect() {
  var s = Math.min(VW, VH) * (isPhone ? 0.94 : 0.86);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}

/* ---- shape stream: every shape is a pure function of its index ---- */
var arrRng = mulberry32(SEED_ARR);
var arrTimes = [];
var tNext = 2.0;
function arrivalTime(i) {
  while (arrTimes.length <= i) {
    arrTimes.push(tNext);
    tNext += 3.2 + arrRng() * 1.6; /* one shape every 3.2 to 4.8 seconds */
  }
  return arrTimes[i];
}
function genShape(i) {
  var rng = mulberry32((SEED + i * 7919) >>> 0);
  var kind = Math.floor(rng() * 3); /* 0 circle, 1 triangle, 2 diamond */
  var col = Math.floor(rng() * PALETTE_RGB.length);
  var alpha = 0.55 + rng() * 0.15;
  var u = rng();
  var r = 0.02 + Math.pow(u, 3.0) * 0.28; /* small chips to large discs; big ones rare */
  if (col === 4) r = Math.min(r, 0.14); /* deep navy goes muddy when large over many shapes */
  /* spawn near a random edge, drift inward to a centre-biased spot */
  var edge = Math.floor(rng() * 4);
  var along = 0.05 + rng() * 0.9;
  var sx, sy;
  if (edge === 0) { sx = along; sy = -0.06; }
  else if (edge === 1) { sx = 1.06; sy = along; }
  else if (edge === 2) { sx = along; sy = 1.06; }
  else { sx = -0.06; sy = along; }
  var tx = clamp(0.5 + (rng() - 0.5) * 1.3, 0.03, 0.97);
  var ty = clamp(0.5 + (rng() - 0.5) * 1.3, 0.03, 0.97);
  return {
    i: i, kind: kind, col: col, alpha: alpha, r: r,
    sx: sx, sy: sy, tx: tx, ty: ty,
    rot0: rng() * TAU, rotSpeed: (rng() - 0.5) * 0.24,
    tArrive: arrivalTime(i),
    drag: null /* { fx, fy, vx, vy, held, coasting } once thrown */
  };
}
var shapes = [];
function arrivedCount(T) {
  var n = 0;
  while (arrivalTime(n) <= T) n++;
  return n;
}
function ensureShapes(T) {
  var n = arrivedCount(T), i;
  for (i = shapes.length; i < n; i++) shapes.push(genShape(i));
  return n;
}
/* state of shape s at virtual time T: position (field fractions), rotation,
   and the sinking factor for turnover. Null when not yet arrived or sunk. */
function shapeState(s, T) {
  var age = T - s.tArrive;
  if (age < 0) return null;
  var fx, fy;
  if (s.drag) {
    fx = s.drag.fx; fy = s.drag.fy;
  } else {
    var k = smooth(age / SETTLE_S);
    fx = lerp(s.sx, s.tx, k);
    fy = lerp(s.sy, s.ty, k);
  }
  var rot = s.rot0 + s.rotSpeed * age;
  return { fx: fx, fy: fy, rot: rot };
}
function drawShape(s, st, f, alphaMul) {
  var cx = f.x + st.fx * f.w;
  var cy = f.y + st.fy * f.h;
  var r = s.r * f.w;
  ctx.fillStyle = rgba(PALETTE_RGB[s.col], s.alpha * alphaMul);
  ctx.beginPath();
  if (s.kind === 0) {
    ctx.moveTo(cx + r, cy);
    ctx.arc(cx, cy, r, 0, TAU);
  } else if (s.kind === 1) {
    var a0 = st.rot - Math.PI / 2, a1 = a0 + TAU / 3, a2 = a0 + 2 * TAU / 3;
    ctx.moveTo(cx + r * Math.cos(a0), cy + r * Math.sin(a0));
    ctx.lineTo(cx + r * Math.cos(a1), cy + r * Math.sin(a1));
    ctx.lineTo(cx + r * Math.cos(a2), cy + r * Math.sin(a2));
    ctx.closePath();
  } else {
    var c = Math.cos(st.rot), sn = Math.sin(st.rot);
    var px = [r, 0, -r, 0], py = [0, r * 0.72, 0, -r * 0.72], i;
    ctx.moveTo(cx + px[0] * c - py[0] * sn, cy + px[0] * sn + py[0] * c);
    for (i = 1; i < 4; i++) ctx.lineTo(cx + px[i] * c - py[i] * sn, cy + px[i] * sn + py[i] * c);
    ctx.closePath();
  }
  ctx.fill();
}
var clock = V0 + PHASE;
function draw(T) {
  clock = T;
  size();
  var rect = compRect();
  fieldCache = rect;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var titlePx = isPhone ? 16 : 18;
  var smallPx = isPhone ? 11 : 12;
  var titleY = rect.y - titlePx - smallPx - 10;
  var dateY = rect.y - smallPx - 6;
  var hintY = rect.y + rect.h + 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = NAVY;
  ctx.fillText('Live Coded', rect.x + rect.w / 2, titleY);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(NAVY_RGB, 0.65);
  ctx.fillText('2006 · 06 · 20', rect.x + rect.w / 2, dateY);
  /* the collage, clipped to the square so edge shapes are cropped */
  var n = ensureShapes(T);
  ctx.save();
  ctx.beginPath();
  ctx.rect(rect.x, rect.y, rect.w, rect.h);
  ctx.clip();
  ctx.globalCompositeOperation = 'multiply';
  var i, s, st, newer, sinkK, alphaMul;
  for (i = 0; i < n; i++) {
    s = shapes[i];
    newer = n - 1 - i; /* shapes that arrived after this one */
    if (newer >= CAP) continue; /* sunk beneath the cap */
    alphaMul = 1;
    if (newer >= CAP - SINK_WINDOW) {
      sinkK = (newer - (CAP - SINK_WINDOW)) / SINK_WINDOW;
      alphaMul = 1 - sinkK;
    }
    st = shapeState(s, T);
    if (st === null) continue;
    drawShape(s, st, rect, alphaMul);
  }
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center';
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(NAVY_RGB, 0.7);
  ctx.fillText('Drag to throw a shape.', rect.x + rect.w / 2, hintY);
}
/* ---- drag: throw a shape, fling it across the frame; it lands and stays ---- */
var dragShape = null, grabDX = 0, grabDY = 0, lastPX = 0, lastPY = 0, lastMoveT = 0;
var fieldCache = { x: 0, y: 0, w: 1, h: 1 };
function pointerPos(e) {
  var x = (typeof e.clientX === 'number') ? e.clientX : 0;
  var y = (typeof e.clientY === 'number') ? e.clientY : 0;
  if (canvas.getBoundingClientRect) {
    var r = canvas.getBoundingClientRect();
    x -= r.left; y -= r.top;
  }
  return { x: x, y: y };
}
function onDown(e) {
  var p = pointerPos(e);
  var n = ensureShapes(clock), i, s, st;
  var best = null, bestD = 1e9, bestUnsettled = false;
  for (i = 0; i < n; i++) {
    s = shapes[i];
    if (n - 1 - i >= CAP) continue;
    st = shapeState(s, clock);
    if (st === null) continue;
    var cx = fieldCache.x + st.fx * fieldCache.w;
    var cy = fieldCache.y + st.fy * fieldCache.h;
    var rr = s.r * fieldCache.w * 1.4;
    var d = Math.sqrt((p.x - cx) * (p.x - cx) + (p.y - cy) * (p.y - cy));
    var unsettled = (clock - s.tArrive) < SETTLE_S + 2;
    if (d < rr && (unsettled !== bestUnsettled ? unsettled : d < bestD)) {
      best = s; bestD = d; bestUnsettled = unsettled;
    }
  }
  if (best === null) return;
  st = shapeState(best, clock);
  var bx = fieldCache.x + st.fx * fieldCache.w;
  var by = fieldCache.y + st.fy * fieldCache.h;
  grabDX = p.x - bx; grabDY = p.y - by;
  best.drag = { fx: st.fx, fy: st.fy, vx: 0, vy: 0, held: true, coasting: false };
  dragShape = best;
  lastPX = p.x; lastPY = p.y; lastMoveT = Date.now();
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (dragShape === null || !dragShape.drag || !dragShape.drag.held) return;
  var p = pointerPos(e);
  var now = Date.now();
  var dt = Math.max(0.016, (now - lastMoveT) / 1000);
  var d = dragShape.drag;
  d.vx = 0.7 * d.vx + 0.3 * ((p.x - lastPX) / dt / fieldCache.w);
  d.vy = 0.7 * d.vy + 0.3 * ((p.y - lastPY) / dt / fieldCache.h);
  d.fx = clamp((p.x - grabDX - fieldCache.x) / fieldCache.w, -0.05, 1.05);
  d.fy = clamp((p.y - grabDY - fieldCache.y) / fieldCache.h, -0.05, 1.05);
  lastPX = p.x; lastPY = p.y; lastMoveT = now;
  draw(clock);
  if (e.preventDefault) e.preventDefault();
}
function onUp(e) {
  if (dragShape === null || !dragShape.drag) return;
  var d = dragShape.drag;
  d.held = false;
  if (Math.abs(d.vx) > 0.02 || Math.abs(d.vy) > 0.02) {
    d.coasting = true;
  } else {
    settleDrag(dragShape);
  }
  dragShape = null;
}
function settleDrag(s) {
  if (!s.drag) return;
  s.tx = clamp(s.drag.fx, 0.03, 0.97);
  s.ty = clamp(s.drag.fy, 0.03, 0.97);
  s.sx = s.tx; s.sy = s.ty; /* landed: no more drift from the old edge */
  s.drag = null;
}
function stepDrags(dt) {
  var i, s, d;
  for (i = 0; i < shapes.length; i++) {
    s = shapes[i];
    d = s.drag;
    if (!d || d.held || !d.coasting) continue;
    d.fx = clamp(d.fx + d.vx * dt, -0.05, 1.05);
    d.fy = clamp(d.fy + d.vy * dt, -0.05, 1.05);
    var fr = Math.exp(-dt * 1.8);
    d.vx *= fr; d.vy *= fr;
    if (Math.abs(d.vx) < 0.01 && Math.abs(d.vy) < 0.01) {
      d.coasting = false;
      settleDrag(s);
    }
  }
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
/* ---- frame one: fixed virtual age, byte-reproducible ---- */
draw(V0 + PHASE);
if (!reduced) {
  var lastNow = null;
  function loop() {
    var now = Date.now();
    if (lastNow === null) lastNow = now;
    var dt = Math.min(0.25, (now - lastNow) / 1000);
    lastNow = now;
    clock += dt;
    stepDrags(dt);
    draw(clock);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
