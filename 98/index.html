<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№98 · Simple Grid Study</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#A98B5F; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(26,21,18,0.6); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to press the sheet</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

// No.98 Simple Grid Study: static plotter study, seeded PRNG "Simple Grid Study".
// Grid exactly 24 rows by 32 columns (768 points). Each point is displaced by layered
// sine/cosine plus seeded value noise; displacement amplitude is masked by distance from
// the warp centre, zero at the edges, deepest at the centre, like a thumb pressed into a sheet.
// Hairlines only: horizontal and vertical polylines through the displaced points, no dots.
// STATIC decision (per spec default): no automatic motion. While pressed, the warp centre
// follows the fingertip; on release it eases back to the curated centre warp.
const ROWS=24, COLS=32;
const rng=mulberry(hashStr('Simple Grid Study'));
// coarse value-noise lattice, bilinearly sampled, two octaves
function makeLattice(gw, gh){ const a=[]; for(let i=0;i<gw*gh;i++) a.push(rng()*2-1); return { gw, gh, a }; }
const LAT1=makeLattice(9, 7), LAT2=makeLattice(17, 13);
function sampleLat(L, u, v){
  const x=u*(L.gw-1), y=v*(L.gh-1);
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const sx=xf*xf*(3-2*xf), sy=yf*yf*(3-2*yf);
  const i00=L.a[yi*L.gw+xi], i10=L.a[yi*L.gw+xi+1], i01=L.a[(yi+1)*L.gw+xi], i11=L.a[(yi+1)*L.gw+xi+1];
  return (i00*(1-sx)+i10*sx)*(1-sy)+(i01*(1-sx)+i11*sx)*sy;
}
let pressing=false, pressPt=null, warpC=null; // warpC in region-relative [0..1, 0..1]
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#A98B5F'; ctx.fillRect(0,0,w,h);
  const phone=isPhone();
  let ox=0, oy=0, dw=w, dh=h;
  if(!phone){ const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; dw=S; dh=S; }
  // small kraft margin inside the region
  const mx=dw*0.045, my=dh*0.045;
  const gx0=ox+mx, gy0=oy+my, gw=dw-2*mx, gh=dh-2*my;
  const cell=gw/(COLS-1);
  // warp centre easing: target is the fingertip while pressed, else the curated centre
  const target = pressing && pressPt ? pressPt : [0.5, 0.5];
  if(!warpC) warpC=[0.5,0.5];
  warpC[0]+=(target[0]-warpC[0])*0.12;
  warpC[1]+=(target[1]-warpC[1])*0.12;
  const amp=cell*1.35;
  const pts=[];
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++){
      const u=c/(COLS-1), v=r/(ROWS-1);
      const x=gx0+u*gw, y=gy0+v*gh;
      const du=u-warpC[0], dv=v-warpC[1];
      const dist=Math.sqrt(du*du*1.4 + dv*dv*1.4);
      const mask=Math.pow(Math.max(0, 1-dist/0.72), 1.3);
      // layered displacement field
      const n1=sampleLat(LAT1, u, v), n2=sampleLat(LAT2, u, v);
      const sx=Math.sin(u*9.1+1.7)*Math.cos(v*7.3+0.4);
      const sy=Math.cos(u*6.4+0.9)*Math.sin(v*10.2+2.1);
      // radial pinch toward the warp centre deepens the pressed look
      const pinch=0.5*mask;
      const dx=amp*mask*(0.55*n1 + 0.30*n2 + 0.45*sx) + (-du)*gw*pinch*0.16;
      const dy=amp*mask*(0.55*sampleLat(LAT2, v, u) + 0.30*n1 + 0.45*sy) + (-dv)*gh*pinch*0.16;
      row.push([x+dx, y+dy]);
    }
    pts.push(row);
  }
  ctx.strokeStyle='#1A1512';
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let r=0;r<ROWS;r++){ // horizontal polylines
    for(let c=0;c<COLS;c++){ const [x,y]=pts[r][c]; if(c===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  }
  for(let c=0;c<COLS;c++){ // vertical polylines
    for(let r=0;r<ROWS;r++){ const [x,y]=pts[r][c]; if(r===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  }
  ctx.stroke();
  if(ROWS*COLS!==768) console.assert(false,'points',ROWS*COLS);
  return {};
}
function regionOf(w,h){
  const phone=isPhone();
  if(phone) return [0,0,w,h];
  const S=Math.min(w,h); return [(w-S)/2,(h-S)/2,S,S];
}
canvas.addEventListener('pointerdown',e=>{
  const [w,h]=viewportWH(); const [ox,oy,dw,dh]=regionOf(w,h);
  pressing=true;
  pressPt=[clamp((e.clientX-ox)/dw,0,1), clamp((e.clientY-oy)/dh,0,1)];
});
canvas.addEventListener('pointermove',e=>{
  if(!pressing) return;
  const [w,h]=viewportWH(); const [ox,oy,dw,dh]=regionOf(w,h);
  pressPt=[clamp((e.clientX-ox)/dw,0,1), clamp((e.clientY-oy)/dh,0,1)];
});
function endP(){ pressing=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
