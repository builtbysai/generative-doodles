<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Xa Chegou</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F5EEDA; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (strict, from the prompt): tavern wood, influencer pink, apron
  // white, ink, paper cream, and the cold grey of the NADA panel.
  // Flat fills only, no gradients.
  var WOOD = '#7A5230', PINK = '#F2A7C3', WHITE = '#F5F5F5',
      INK = '#141414', CREAM = '#F5EEDA', GREY = '#9A9A9A';

  var PHASE0 = 1.8;        // constant first-frame phase
  var DW = 1080, DH = 1440; // portrait design space
  var FONT = 'Arial, Helvetica, sans-serif';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function mod(a, n) { return ((a % n) + n) % n; }

  // ---- geometry (design space) ----
  var BAN = { x: 48, y: 44, w: 984, h: 124 };       // title banner
  var PAN = { x: 48, y: 204, w: 984, h: 1060 };     // the one visible panel
  var FOOT_Y = 1362;                                 // footer baseline

  // Title letters with precomputed hand jitter (seeded once, stable forever).
  var TITLE = 'O XA CHEGOU! II';
  var titleJit = [];
  (function () {
    var r = mulberry32(561001);
    for (var i = 0; i < TITLE.length; i++) {
      titleJit.push({ dx: (r() - 0.5) * 5, dy: (r() - 0.5) * 7, rot: (r() - 0.5) * 0.05 });
    }
  })();

  // ---- small canvas helpers ----
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function fillStroke(fill, lw, strokeCol) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw) { ctx.strokeStyle = strokeCol || INK; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function line(x1, y1, x2, y2, w, color) {
    ctx.strokeStyle = color || INK; ctx.lineWidth = w || 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r); ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h); ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r); ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  // Wobbly hand-drawn rectangle: corner/midpoint jitter from a fixed seed,
  // so the path is identical on every frame.
  function wobblyRect(x, y, w, h, seed, amp) {
    var r = mulberry32(seed);
    function j() { return (r() - 0.5) * 2 * (amp || 5); }
    var pts = [
      [x + j(), y + j()], [x + w / 2 + j(), y + j()], [x + w + j(), y + j()],
      [x + w + j(), y + h / 2 + j()], [x + w + j(), y + h + j()],
      [x + w / 2 + j(), y + h + j()], [x + j(), y + h + j()],
      [x + j(), y + h / 2 + j()]
    ];
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
  function heart(x, y, s, fill) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.95);
    ctx.bezierCurveTo(x - s * 1.25, y + s * 0.1, x - s * 0.72, y - s * 0.85, x, y - s * 0.28);
    ctx.bezierCurveTo(x + s * 0.72, y - s * 0.85, x + s * 1.25, y + s * 0.1, x, y + s * 0.95);
    ctx.closePath();
    fillStroke(fill, 4);
  }
  function star(x, y, r, fill) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rad = (i % 2 === 0) ? r : r * 0.45;
      var px = x + Math.cos(ang) * rad, py = y + Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.stroke();
  }
  function text(str, x, y, size, weight, color, align) {
    ctx.font = weight + ' ' + size + 'px ' + FONT;
    ctx.fillStyle = color || INK;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }
  function lines(arr, x, y0, size, lh, weight, color) {
    for (var i = 0; i < arr.length; i++) text(arr[i], x, y0 + i * lh, size, weight || 700, color || INK);
  }
  // Speech bubble: wobbly white box + little tail.
  function bubble(x, y, w, h, seed, tailX, tailY) {
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(x + w * 0.42, y + h);
    ctx.lineTo(x + w * 0.60, y + h);
    ctx.closePath();
    fillStroke(WHITE, 5);
    wobblyRect(x, y, w, h, seed, 4);
    fillStroke(WHITE, 5);
  }

  // ---- shared scenery ----
  function planks(x, y, w, h, base) {
    ctx.fillStyle = base; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.globalAlpha = 0.55;
    for (var yy = y + 118; yy < y + h; yy += 118) {
      ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function clipPanel() {
    ctx.beginPath();
    ctx.rect(PAN.x, PAN.y, PAN.w, PAN.h);
    ctx.clip();
  }

  // ---- panels 1-4: the vlog ----
  var VLOG = [
    { color: true,  lines: ['¡Chicos! Un restaurante', 'tradicional, llenísimo', 'de gente de aquí...'] },
    { color: false, lines: ['Y totalmente fuera', 'de las guías, ¿eh?', 'Un secreto...'] },
    { color: true,  lines: ['Comida de la abuela,', 'auténtica de verdad,', 'como la de antes.'] },
    { color: false, lines: ['Mirad qué ambiente...', '¡Esto sí que es', 'lo real, lo real!'] }
  ];
  function drawVlog(idx, t) {
    var v = VLOG[idx];
    var cMain = v.color ? PINK : WHITE;    // vlog frame + phone screen + hearts
    var cTop = v.color ? PINK : GREY;      // her top
    var cFace = v.color ? CREAM : WHITE;
    var px = PAN.x, py = PAN.y;
    planks(px, py, PAN.w, PAN.h, v.color ? WOOD : GREY);
    // counter across the bottom
    ctx.fillStyle = INK; ctx.fillRect(px, py + 830, PAN.w, PAN.h - 830);
    line(px, py + 830, px + PAN.w, py + 830, 7, INK);
    // two locals from behind, seated at the counter corners:
    // heads above the counter line so the ink silhouettes read against the wall
    [[px + 118], [px + 866]].forEach(function (a) {
      var cx = a[0];
      ctx.beginPath();
      ctx.arc(cx, py + 884, 80, Math.PI, 0);
      ctx.closePath(); fillStroke(INK, 0);
      circ(cx, py + 776, 50); fillStroke(INK, 0);
    });
    // the front-camera frame
    var fx = px + 120, fy = py + 58, fw = 744, fh = 612;
    if (v.color) {
      ctx.save();
      ctx.globalAlpha = 0.28 + 0.07 * Math.sin(t * 2.4);
      rrect(fx - 16, fy - 16, fw + 32, fh + 32, 60);
      ctx.strokeStyle = PINK; ctx.lineWidth = 30; ctx.stroke();
      ctx.restore();
    }
    rrect(fx, fy, fw, fh, 48); fillStroke(cFace, 0);
    ctx.save();
    rrect(fx, fy, fw, fh, 48); ctx.clip();
    // her bust, centred
    var cx = fx + fw / 2, hy = fy + 262;
    ctx.beginPath(); // top / shoulders
    ctx.moveTo(cx - 168, fy + fh);
    ctx.quadraticCurveTo(cx - 160, fy + 408, cx - 92, fy + 396);
    ctx.lineTo(cx + 92, fy + 396);
    ctx.quadraticCurveTo(cx + 160, fy + 408, cx + 168, fy + fh);
    ctx.closePath(); fillStroke(cTop, 6);
    line(cx - 120, fy + 470, cx - 196, fy + 372, 34, cTop); // arm down to the phone
    circ(cx, hy, 108); fillStroke(cFace, 6);                 // face
    ctx.beginPath();                                          // hair cap
    ctx.arc(cx, hy - 6, 114, Math.PI * 1.03, Math.PI * 1.97);
    ctx.quadraticCurveTo(cx, hy - 44, cx - 114, hy - 6);
    ctx.closePath(); fillStroke(INK, 0);
    ctx.fillStyle = INK;                                      // side locks
    ctx.fillRect(cx - 122, hy - 30, 26, 128);
    ctx.fillRect(cx + 96, hy - 30, 26, 128);
    // cheerful shut eyes, big open smile
    ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx - 42, hy + 6, 17, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 42, hy + 6, 17, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, hy + 34, 34, Math.PI * 0.12, Math.PI * 0.88);
    ctx.closePath(); fillStroke(INK, 0);
    line(cx - 24, hy + 47, cx + 24, hy + 47, 5, WHITE);
    ell(cx - 74, hy + 42, 17, 11); fillStroke(v.color ? PINK : GREY, 0);
    ell(cx + 74, hy + 42, 17, 11); fillStroke(v.color ? PINK : GREY, 0);
    // the phone in her hand
    rrect(fx + 566, fy + 356, 96, 176, 16); fillStroke(INK, 0);
    rrect(fx + 578, fy + 372, 72, 128, 8); fillStroke(cMain, 0);
    circ(fx + 614, fy + 516, 7); fillStroke(WHITE, 0);
    // live dot + hearts bobbing on the shared phase
    circ(fx + 44, fy + 42, 11); fillStroke(cMain, 3);
    var bob = function (i) { return Math.sin(t * 2 + i * 1.7) * 8; };
    heart(fx + 92, fy + 128 + bob(0), 26, cMain);
    heart(fx + 664, fy + 96 + bob(1), 32, cMain);
    heart(fx + 84, fy + 300 + bob(2), 20, cMain);
    ctx.restore();
    rrect(fx, fy, fw, fh, 48);
    ctx.strokeStyle = cMain; ctx.lineWidth = 22; ctx.stroke();
    // her patter, in a bubble over the counter
    bubble(px + 192, py + 726, 600, 218, 561100 + idx, cx, fy + fh);
    lines(v.lines, px + 492, py + 786, 43, 56, 700);
  }

  // ---- panel 5: the owner ----
  function drawOwner(t) {
    var px = PAN.x, py = PAN.y;
    planks(px, py, PAN.w, PAN.h, WOOD);
    // a shelf of plain glasses on the right wall (glassware, never food)
    line(px + 580, py + 118, px + 916, py + 118, 8, INK);
    [636, 756, 856].forEach(function (gx) {
      ctx.strokeStyle = WHITE; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(px + gx, py + 42); ctx.lineTo(px + gx + 10, py + 114);
      ctx.lineTo(px + gx + 54, py + 114); ctx.lineTo(px + gx + 64, py + 42);
      ctx.stroke();
    });
    // the influencer, at the left edge, phone up
    var ix = px + 158, iy = py + 368;
    ctx.beginPath();
    ctx.moveTo(ix - 118, py + 700);
    ctx.quadraticCurveTo(ix - 108, py + 516, ix - 40, py + 502);
    ctx.lineTo(ix + 52, py + 502);
    ctx.quadraticCurveTo(ix + 112, py + 516, ix + 118, py + 700);
    ctx.closePath(); fillStroke(PINK, 6);
    line(ix + 66, py + 520, ix + 138, py + 420, 30, PINK);
    ctx.fillStyle = CREAM; ctx.fillRect(ix - 15, py + 428, 30, 84); // neck
    circ(ix, iy, 76); fillStroke(CREAM, 6);
    ctx.beginPath();
    ctx.arc(ix, iy - 4, 81, Math.PI * 1.03, Math.PI * 1.97);
    ctx.quadraticCurveTo(ix, iy - 30, ix - 81, iy - 4);
    ctx.closePath(); fillStroke(INK, 0);
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(ix - 28, iy + 8, 12, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
    ctx.beginPath(); ctx.arc(ix + 28, iy + 8, 12, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
    line(ix - 16, iy + 44, ix + 16, iy + 44, 6, INK);
    rrect(ix + 116, py + 330, 62, 116, 10); fillStroke(INK, 0);
    rrect(ix + 124, py + 342, 46, 80, 6); fillStroke(PINK, 0);
    // her two attempts, stacked over her head
    bubble(px + 52, py + 40, 320, 92, 561151, ix + 24, py + 252);
    text('Excuse me?', px + 212, py + 88, 41, 700);
    bubble(px + 52, py + 142, 396, 124, 561152, ix + 6, py + 282);
    lines(['Perdone... ¿tienen', 'menú del día?'], px + 250, py + 181, 37, 50, 700);
    // the owner behind his counter, centre-right
    var ox = px + 618, oy = py + 300;
    ctx.fillStyle = CREAM; ctx.fillRect(ox - 17, py + 372, 34, 52); // neck
    ctx.fillStyle = WOOD; // shirt body under the apron, ink-edged off the wall
    ctx.fillRect(ox - 162, py + 404, 324, 254);
    ctx.strokeStyle = INK; ctx.lineWidth = 6;
    ctx.strokeRect(ox - 162, py + 404, 324, 254);
    ctx.beginPath();    // apron
    ctx.moveTo(ox - 62, py + 392);
    ctx.lineTo(ox + 62, py + 392);
    ctx.lineTo(ox + 104, py + 664);
    ctx.lineTo(ox - 104, py + 664);
    ctx.closePath(); fillStroke(WHITE, 6);
    line(ox - 62, py + 392, ox - 84, py + 336, 10, INK); // apron straps
    line(ox + 62, py + 392, ox + 84, py + 336, 10, INK);
    line(ox - 88, py + 522, ox + 88, py + 522, 5, INK);  // apron waist seam
    line(ox - 152, py + 452, ox - 122, py + 646, 54, INK);  // arms, ink-edged so
    line(ox + 152, py + 452, ox + 122, py + 646, 54, INK);  // they read off the wall
    line(ox - 152, py + 452, ox - 122, py + 646, 40, WOOD);
    line(ox + 152, py + 452, ox + 122, py + 646, 40, WOOD);
    circ(ox, oy, 98); fillStroke(CREAM, 6);                 // head
    line(ox - 93, oy - 30, ox - 97, oy + 40, 15, INK);      // thinning hair, sides only
    line(ox + 93, oy - 30, ox + 97, oy + 40, 15, INK);
    // heavy lids: the squint breathes a little but never opens, never winks
    var lid = 0.72 + 0.10 * Math.sin(t * 0.7);
    [-44, 44].forEach(function (dx) {
      ell(ox + dx, oy + 6, 25, 13); fillStroke(WHITE, 4);
      circ(ox + dx, oy + 10, 6); fillStroke(INK, 0);
      var ly = oy + 6 - 13 * lid;
      line(ox + dx - 27, ly + 4, ox + dx + 27, ly + 4, 8, INK);
      ctx.strokeStyle = INK; ctx.lineWidth = 4;             // bags
      ctx.beginPath(); ctx.arc(ox + dx, oy + 22, 17, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    });
    line(ox - 70, oy - 44, ox - 18, oy - 40, 7, INK);       // flat brows
    line(ox + 18, oy - 40, ox + 70, oy - 44, 7, INK);
    line(ox, oy + 22, ox - 7, oy + 46, 5, INK);             // nose
    line(ox - 30, oy + 72, ox + 30, oy + 72, 7, INK);       // bored flat mouth
    // the counter he stands behind
    ctx.fillStyle = WOOD; ctx.fillRect(px + 40, py + 648, PAN.w - 80, 40);
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.strokeRect(px + 40, py + 648, PAN.w - 80, 40);
    circ(ox - 122, py + 644, 20); fillStroke(CREAM, 5);      // his hands, resting on the counter
    circ(ox + 122, py + 644, 20); fillStroke(CREAM, 5);
    ctx.fillStyle = INK; ctx.fillRect(px, py + 688, PAN.w, PAN.h - 688);
    line(px, py + 688, px + PAN.w, py + 688, 6, INK);
  }

  // ---- panel 6: NADA. ----
  function drawNada() {
    ctx.fillStyle = GREY; ctx.fillRect(PAN.x, PAN.y, PAN.w, PAN.h);
    text('NADA.', PAN.x + PAN.w / 2, PAN.y + PAN.h / 2 - 10, 296, 900);
    line(PAN.x + 250, PAN.y + PAN.h / 2 + 148, PAN.x + 734, PAN.y + PAN.h / 2 + 142, 10, INK);
  }

  // ---- panel 7: the review ----
  var filledStars = 5;
  function drawReview() {
    var px = PAN.x, py = PAN.y;
    planks(px, py, PAN.w, PAN.h, WOOD);
    var cx0 = px + 110, cy0 = py + 150, cw = 764, ch = 730;
    rrect(cx0, cy0, cw, ch, 26); fillStroke(WHITE, 6);
    circ(cx0 + 92, cy0 + 96, 42); fillStroke(GREY, 5);
    circ(cx0 + 92, cy0 + 82, 15); fillStroke(WHITE, 0);
    ctx.beginPath(); ctx.arc(cx0 + 92, cy0 + 126, 24, Math.PI, 0); ctx.closePath(); fillStroke(WHITE, 0);
    ctx.textAlign = 'left';
    text('La influencer', cx0 + 158, cy0 + 82, 45, 800, INK, 'left');
    text('Reseña verificada', cx0 + 158, cy0 + 128, 29, 400, INK, 'left');
    ctx.textAlign = 'center';
    for (var i = 0; i < 5; i++) {
      star(cx0 + cw / 2 + (i - 2) * 138, cy0 + 268, 56, i < filledStars ? INK : null);
    }
    text('«Nada.»', cx0 + cw / 2, cy0 + 448, 118, 900);
    lines(['Sin menú. Sin comida.', 'Solo eso: nada.'], cx0 + cw / 2, cy0 + 580, 38, 56, 400);
    line(cx0 + 70, cy0 + ch - 66, cx0 + cw - 70, cy0 + ch - 66, 3, GREY);
    text('1 de 1 reseñas', cx0 + cw / 2, cy0 + ch - 30, 26, 400, GREY);
  }

  // ---- state + chrome ----
  var panelIdx = 0;        // 0..6
  var shakeT0 = -10;       // simT when panel 6 was entered
  var dragDown = 0;        // accumulated downward drag on panel 7

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(SC, SC);
    // full-screen shake on arrival at the NADA panel
    if (panelIdx === 5) {
      var k = t - shakeT0;
      if (k >= 0 && k < 0.7) {
        var off = 26 * (1 - k / 0.7) * Math.sin(k * 55);
        ctx.translate(off, off * 0.35);
      }
    }
    var drained = (panelIdx === 5);
    // title banner (drains to grey on the NADA panel)
    wobblyRect(BAN.x, BAN.y, BAN.w, BAN.h, 561010, 4);
    fillStroke(drained ? GREY : INK, 0);
    ctx.save();
    ctx.beginPath(); ctx.rect(BAN.x, BAN.y, BAN.w, BAN.h); ctx.clip();
    ctx.font = '900 82px ' + FONT;
    ctx.textBaseline = 'middle';
    var totalW = 0, widths = [];
    for (var i = 0; i < TITLE.length; i++) {
      var wch = ctx.measureText(TITLE[i]).width;
      widths.push(wch); totalW += wch + 7;
    }
    totalW -= 7;
    var tx = BAN.x + (BAN.w - totalW) / 2;
    ctx.fillStyle = drained ? INK : CREAM;
    for (var j = 0; j < TITLE.length; j++) {
      ctx.save();
      ctx.translate(tx + widths[j] / 2 + titleJit[j].dx, BAN.y + BAN.h / 2 + titleJit[j].dy);
      ctx.rotate(titleJit[j].rot);
      ctx.textAlign = 'center';
      ctx.fillText(TITLE[j], 0, 4);
      ctx.restore();
      tx += widths[j] + 7;
    }
    ctx.restore();
    // the panel itself
    ctx.save();
    clipPanel();
    if (panelIdx <= 3) drawVlog(panelIdx, t);
    else if (panelIdx === 4) drawOwner(t);
    else if (panelIdx === 5) drawNada();
    else drawReview();
    ctx.restore();
    wobblyRect(PAN.x, PAN.y, PAN.w, PAN.h, 561020, 5);
    ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
    // footer: hint + panel counter (the only UI)
    text(panelIdx === 6 ? 'drag' : 'tap', PAN.x + 6, FOOT_Y, 30, 400, GREY, 'left');
    text((panelIdx + 1) + '/7', PAN.x + PAN.w - 6, FOOT_Y, 30, 700, drained ? GREY : INK, 'right');
    ctx.restore();
  }

  // ---- sizing (Visual Viewport API) ----
  var W = 0, H = 0, SC = 1, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      SC = W / DW;
      OX = 0; OY = (H - DH * SC) / 2;
    } else {
      SC = Math.min(W / DW, H / DH);
      OX = (W - DW * SC) / 2; OY = (H - DH * SC) / 2;
    }
    draw(simT);
  }

  // ---- interaction: tap advances the carousel; drag on panel 7 drops stars ----
  var downPos = null, lastY = 0, downStamp = -1e9, lastPtrStamp = -1e9;
  function evtPos(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: cx - rect.left, y: cy - rect.top };
  }
  function onDown(e) {
    if (e.timeStamp !== undefined) {
      if (e.timeStamp - downStamp < 350) return;
      downStamp = e.timeStamp;
    }
    var p = evtPos(e);
    downPos = p; lastY = p.y;
  }
  function onMove(e) {
    if (!downPos || panelIdx !== 6) return;
    var p = evtPos(e);
    var dy = (p.y - lastY) / (SC || 1);
    lastY = p.y;
    if (dy > 0) {
      dragDown += dy;
      filledStars = clamp(5 - Math.floor(dragDown / 90), 0, 5);
      draw(simT);
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!downPos) return;
    var p = evtPos(e);
    var moved = Math.abs(p.x - downPos.x) + Math.abs(p.y - downPos.y);
    downPos = null;
    if (moved < 16) {
      panelIdx = mod(panelIdx + 1, 7);
      if (panelIdx === 5) shakeT0 = simT;
      if (panelIdx === 6) { dragDown = 0; filledStars = 5; }
      draw(simT);
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { lastPtrStamp = e.timeStamp || 0; onDown(e); });
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { downPos = null; });
    canvas.addEventListener('touchstart', function (e) {
      if ((e.timeStamp || 0) - lastPtrStamp < 700) return;
      onDown(e);
    });
    canvas.addEventListener('touchmove', function (e) {
      if ((e.timeStamp || 0) - lastPtrStamp < 700) return;
      onMove(e);
    });
    canvas.addEventListener('touchend', function (e) {
      if ((e.timeStamp || 0) - lastPtrStamp < 700) return;
      onUp(e.changedTouches && e.changedTouches[0] ? { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY, timeStamp: e.timeStamp } : e);
    });
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
