<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixteen Mirrors</title>
<style>
html, body { margin: 0; padding: 0; background: #F7F4EC; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F7F4EC';
var INK = '#111111';
var PLATE = '#FFFFFF';
var PLATE_LINE = 'rgba(17,17,17,0.55)';
var TITLE_INK = '#111111';
var HINT_INK = '#111111';
var SECTORS = 16;
var HALF = TAU / (SECTORS * 2);
var T0 = 4.0;
var BANDS = 7;
var LINES = 14;
var RING_RADII = [0.30, 0.45, 0.62, 0.78, 0.92];
var RING_DOTS = [10, 14, 18, 22, 26];
var SPOKES = [0.25, 0.5, 0.75];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* seeded per-ring dot radius jitter, fixed at load */
var rng = mulberry32(1706);
var dotJit = [];
var ri, di;
for (ri = 0; ri < RING_RADII.length; ri++) {
  dotJit.push([]);
  for (di = 0; di < RING_DOTS[ri]; di++) dotJit[ri].push((rng() - 0.5) * 0.02);
}
/* periodic wiggle: integer harmonics in u, so wig(0) == wig(1) exactly and
   sector edges meet their mirrored neighbours with no seam drift */
function wig(u, r, t) {
  var amp = r * 0.045 + 1.5;
  var ph = r * 0.011 + t * 0.05;
  return amp * (0.5 * Math.sin(TAU * 2 * u + 2 * 1.7 + ph * 2)
    + 0.3 * Math.sin(TAU * 5 * u + 5 * 1.7 + ph * 5)
    + 0.2 * Math.sin(TAU * 9 * u + 9 * 1.7 + ph * 9));
}
function polar(r, a) { return [r * Math.cos(a), r * Math.sin(a)]; }
/* ---- one wedge, centred on the +x axis, spanning -HALF..+HALF ---- */
function drawSector(g, cx, cy, R, t) {
  var u, a, p, b, li, si, r0, r1, rr, i;
  /* warped black bands */
  for (b = 0; b < BANDS; b++) {
    r0 = R * (0.12 + b * 0.115);
    r1 = r0 + R * 0.052;
    g.beginPath();
    for (i = 0; i <= 48; i++) {
      u = i / 48; a = -HALF + u * 2 * HALF;
      p = polar(r1 + wig(u, r1, t), a);
      if (i === 0) g.moveTo(cx + p[0], cy + p[1]); else g.lineTo(cx + p[0], cy + p[1]);
    }
    for (i = 48; i >= 0; i--) {
      u = i / 48; a = -HALF + u * 2 * HALF;
      p = polar(r0 + wig(u, r0, t), a);
      g.lineTo(cx + p[0], cy + p[1]);
    }
    g.closePath();
    g.fillStyle = 'rgba(17,17,17,' + (b % 2 === 0 ? 0.88 : 0.55).toFixed(4) + ')';
    g.fill();
  }
  /* noise-perturbed concentric polylines */
  g.strokeStyle = INK;
  for (li = 0; li < LINES; li++) {
    rr = R * (0.10 + (li + 0.5) * (0.88 / LINES));
    g.beginPath();
    for (i = 0; i <= 48; i++) {
      u = i / 48; a = -HALF + u * 2 * HALF;
      p = polar(rr + wig(u, rr, t), a);
      if (i === 0) g.moveTo(cx + p[0], cy + p[1]); else g.lineTo(cx + p[0], cy + p[1]);
    }
    g.lineWidth = Math.max(0.8, R * 0.0016);
    g.stroke();
  }
  /* radial spokes with wiggle */
  for (si = 0; si < SPOKES.length; si++) {
    u = SPOKES[si]; a = -HALF + u * 2 * HALF;
    g.beginPath();
    for (i = 0; i <= 32; i++) {
      rr = R * (0.12 + (i / 32) * 0.85);
      p = polar(rr + wig(u, rr, t) * 0.6, a);
      if (i === 0) g.moveTo(cx + p[0], cy + p[1]); else g.lineTo(cx + p[0], cy + p[1]);
    }
    g.lineWidth = Math.max(0.7, R * 0.0012);
    g.strokeStyle = 'rgba(17,17,17,0.5)';
    g.stroke();
  }
  /* dotted rings, dots kept strictly inside the wedge so no dot doubles at a seam */
  g.fillStyle = INK;
  var dotR = Math.max(1.1, R * 0.0042);
  for (ri = 0; ri < RING_RADII.length; ri++) {
    for (di = 0; di < RING_DOTS[ri]; di++) {
      u = (di + 0.5) / RING_DOTS[ri];
      a = -HALF + u * 2 * HALF;
      rr = R * (RING_RADII[ri] + dotJit[ri][di]) + wig(u, R * RING_RADII[ri], t);
      p = polar(rr, a);
      g.beginPath();
      g.arc(cx + p[0], cy + p[1], dotR, 0, TAU);
      g.fill();
    }
  }
  /* wedge edge lines, shared exactly with the neighbouring sector */
  g.strokeStyle = INK;
  g.lineWidth = Math.max(0.8, R * 0.0016);
  var ea;
  for (ea = 0; ea < 2; ea++) {
    a = ea === 0 ? -HALF : HALF;
    u = ea === 0 ? 0 : 1;
    g.beginPath();
    for (i = 0; i <= 32; i++) {
      rr = R * (0.10 + (i / 32) * 0.87);
      p = polar(rr + wig(u, rr, t), a);
      if (i === 0) g.moveTo(cx + p[0], cy + p[1]); else g.lineTo(cx + p[0], cy + p[1]);
    }
    g.stroke();
  }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
var clockT = 0;
function makeBuffer(R, t) {
  var side = Math.ceil(R * 2) + 4;
  var b, g;
  try {
    b = document.createElement('canvas');
    b.width = side; b.height = side;
    g = b.getContext('2d');
  } catch (e) { return null; }
  drawSector(g, side / 2, side / 2, R, t);
  return { canvas: b, side: side };
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var cx = st.x + st.w / 2, cy = st.y + st.h / 2;
  var R = Math.min(st.w, st.h) * 0.46;
  var t = T0 + clockT;
  var buf = makeBuffer(R, t);
  var i;
  for (i = 0; i < SECTORS; i++) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(i * TAU / SECTORS);
    if (i % 2 === 1) ctx.scale(-1, 1);
    if (buf) {
      ctx.drawImage(buf.canvas, -buf.side / 2, -buf.side / 2);
    } else {
      drawSector(ctx, 0, 0, R, t);
    }
    ctx.restore();
  }
  /* central disc: black core, paper ring, black pin */
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.085, 0, TAU);
  ctx.fillStyle = INK;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.085, 0, TAU);
  ctx.lineWidth = Math.max(1, R * 0.004);
  ctx.strokeStyle = GROUND;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.028, 0, TAU);
  ctx.fillStyle = GROUND;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.012, 0, TAU);
  ctx.fillStyle = INK;
  ctx.fill();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Sixteen Mirrors').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Sixteen Mirrors').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 13').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Sixteen Mirrors', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 13', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the mandala bloom.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (tt) { clockT = tt - T0; draw(); },
    sectorCount: function () { return SECTORS; },
    seamGap: function () {
      var maxGap = 0, r, gap;
      for (r = 40; r <= 400; r += 10) {
        gap = Math.abs(wig(0, r, T0) - wig(1, r, T0));
        if (gap > maxGap) maxGap = gap;
      }
      return maxGap;
    },
    counts: function () {
      var dots = 0, k;
      for (k = 0; k < RING_DOTS.length; k++) dots += RING_DOTS[k];
      return { bands: BANDS, polylines: LINES, spokes: SPOKES.length, edgeLines: 2, dotsPerSector: dots, totalDots: dots * SECTORS };
    }
  };
}
/* ---- frame one: fixed pre-roll t = 4.0, no wall clock, no Math.random ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt * 0.15;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
