<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Into Wire</title>
<style>
html, body { margin: 0; padding: 0; background: #0C0C0E; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Voice Into Wire: a vocal signal trace spirals from a mouth-point
   into a live-electronics tangle. The clean trace is a warm copper
   line; as it passes through processing nodes it frays into delays,
   granulated sparks and feedback blooms. The loop is closed: voice
   feeds electronics, electronics feed back into the voice's timing.
   Dragging moves the listener node through the tangle; the mix and
   the feedback character change with position, like a hand on a
   mixer. The loop keeps running without input. Drag to listen. */
var TAU = Math.PI * 2;
var BG = '#0C0C0E';
var COPPER = '#B87333';
var BLUE = '#3A7BFF';
var MAGENTA = '#D63384';
var WHITE = '#FFFFFF';
var PLATE = '#101013';
var PLATE_LINE = 'rgba(184,115,51,0.45)';
var TITLE_INK = '#F2EDE4';
var HINT_INK = '#D8A05E';
var SEED0 = 1890;
var FRAME_T = 12.0;      /* fixed phase: trace mid-spiral, nodes fraying */
/* Content fit: the whole tangle is pulled inside the content square
   (scale 0.74, offset per axis) so every turn, strand and bloom ring
   fits with at least a 4% margin on all four sides; on phones the
   square is the viewport width, so anything past its edge is cut. */
var FIT_S = 0.74, FIT_AX = 0.224, FIT_AY = 0.166;
var MOUTH_X = FIT_AX + FIT_S * 0.30, MOUTH_Y = FIT_AY + FIT_S * 0.50;
var SPIRAL_TURNS = 3.4;
var SPIRAL_R = 0.44;     /* max spiral radius, fraction of rect size */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- deterministic geometry: nodes, fray strands, sparks, blooms ---- */
var NODES = [0.14, 0.27, 0.40, 0.52, 0.63, 0.74, 0.84, 0.93];
var nodes = [];    /* {s, x, y, ph, kind} normalized spiral positions */
var strands = [];  /* {node, pts:[{x,y}], col, w, ph} frayed traces */
var sparks = [];   /* {x, y, r, ph, col} granulated sparks near nodes */
var blooms = [];   /* {x, y, r, ph} feedback bloom centers */
var listener = { x: FIT_AX + FIT_S * 0.62, y: FIT_AY + FIT_S * 0.42 };   /* normalized listener position */
var dragging = false;
function spiralPoint(s, t) {
  var a = s * SPIRAL_TURNS * TAU - Math.PI / 2;
  var r = FIT_S * (0.03 + s * SPIRAL_R);
  var wob = FIT_S * 0.012 * Math.sin(s * 21.0 + t * 0.35);
  var x = MOUTH_X + Math.cos(a) * (r + wob);

}
(function buildGeometry() {
  var rng = mulberry32(SEED0);
  var i, j, k;
  for (i = 0; i < NODES.length; i++) {
    var p = spiralPoint(NODES[i], FRAME_T);
    nodes.push({ s: NODES[i], x: p.x, y: p.y, ph: rng() * TAU, kind: i % 2 });

       longer and wilder as the signal moves deeper into the tangle */
    var nStr = 3 + Math.floor(rng() * 3);
    for (j = 0; j < nStr; j++) {
      var ang = rng() * TAU;
      var len = FIT_S * (0.03 + NODES[i] * 0.10) * (0.6 + rng() * 0.8);
      var pts = [{ x: p.x, y: p.y }];
      var cx = p.x, cy = p.y, ca = ang;
      for (k = 0; k < 4; k++) {
        ca += (rng() * 2 - 1) * 0.9;
        var seg = len / 4;

        cy += Math.sin(ca) * seg;
        pts.push({ x: cx, y: cy });

      strands.push({
        node: i, pts: pts,
        col: (j % 2 === 0) ? BLUE : MAGENTA,
        w: 0.8 + rng() * 1.1, ph: rng() * TAU

    }
    /* granulated sparks clustered around each node */
    var nSp = 4 + Math.floor(rng() * 3);
    for (j = 0; j < nSp; j++) {
      var sa = rng() * TAU;
      var sr = FIT_S * (0.015 + rng() * 0.05);
      sparks.push({
        x: p.x + Math.cos(sa) * sr,
        y: p.y + Math.sin(sa) * sr,
        r: 0.8 + rng() * 1.6,
        ph: rng() * TAU,
        col: (rng() < 0.5) ? BLUE : MAGENTA

  /* feedback blooms: white-hot centers deep in the tangle */
  var bloomS = [0.63, 0.84, 0.97];
  for (i = 0; i < bloomS.length; i++) {
    var bp = spiralPoint(bloomS[i], FRAME_T);
    blooms.push({ x: bp.x + FIT_S * 0.03, y: bp.y - FIT_S * 0.02, r: FIT_S * (0.05 + i * 0.012), ph: rng() * TAU });
  }
  /* a few loose sparks drifting in the open field right of the tangle */
  for (i = 0; i < 10; i++) {
    sparks.push({
      x: FIT_AX + FIT_S * (0.72 + rng() * 0.24), y: FIT_AY + FIT_S * (0.10 + rng() * 0.80),

      col: (rng() < 0.5) ? BLUE : MAGENTA

  }
})();
/* Feedback depth: how deep the listener sits in the tangle, 0 to 1.
   Near the mouth the loop is clean; deep right it feeds back hard. */
function feedbackAt(lx, ly) {
  var d = Math.hypot(lx - MOUTH_X, (ly - MOUTH_Y) * 1.1);
  var f = clamp((d - 0.10) / 0.42, 0, 1);

function mixAt(lx) {
  return clamp((lx - MOUTH_X) / 0.55, 0, 1);
}
/* ---- WebAudio: breathy generated tone, granulated, lazy on drag ---- */
var audioCtx = null;
var audioReady = false;
var soundOn = false;
var voiceOsc = null, voiceGain = null, delayNode = null, fbGain = null, noiseGain = null;
function ensureAudio() {

  try {
    var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    audioCtx = new AC();
    /* breathy voice-like source: a low sawtooth through a bandpass

    voiceOsc = audioCtx.createOscillator();
    voiceOsc.type = 'sawtooth';
    voiceOsc.frequency.value = 174.0;
    var bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 620; bp.Q.value = 1.4;
    voiceGain = audioCtx.createGain(); voiceGain.gain.value = 0.0;
    var nbLen = audioCtx.sampleRate;
    var nb = audioCtx.createBuffer(1, nbLen, audioCtx.sampleRate);
    var ch = nb.getChannelData(0);
    var rng = mulberry32(SEED0 + 7);
    for (var i = 0; i < nbLen; i++) ch[i] = rng() * 2 - 1;
    var noise = audioCtx.createBufferSource();
    noise.buffer = nb; noise.loop = true;
    var nf = audioCtx.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = 2400; nf.Q.value = 0.8;
    noiseGain = audioCtx.createGain(); noiseGain.gain.value = 0.0;
    delayNode = audioCtx.createDelay(1.0);
    delayNode.delayTime.value = 0.31;
    fbGain = audioCtx.createGain(); fbGain.gain.value = 0.0;
    var wet = audioCtx.createGain(); wet.gain.value = 0.5;
    var master = audioCtx.createGain(); master.gain.value = 0.9;
    voiceOsc.connect(bp); bp.connect(voiceGain); voiceGain.connect(master);
    voiceGain.connect(delayNode);
    delayNode.connect(fbGain); fbGain.connect(delayNode);
    delayNode.connect(wet); wet.connect(master);
    noise.connect(nf); nf.connect(noiseGain); noiseGain.connect(master);
    master.connect(audioCtx.destination);
    voiceOsc.start(); noise.start();
    audioReady = true;
  } catch (e) { audioCtx = null; audioReady = false; }
}
function updateAudio(t) {
  if (!audioCtx || !audioReady) return;
  var fb = feedbackAt(listener.x, listener.y);
  var mx = mixAt(listener.x);
  var wob = 0.5 + 0.5 * Math.sin(t * 0.6);
  try {
    var now = audioCtx.currentTime;
    voiceGain.gain.setTargetAtTime(soundOn ? 0.05 + 0.03 * wob : 0.0, now, 0.3);
    noiseGain.gain.setTargetAtTime(soundOn ? 0.012 + 0.010 * mx : 0.0, now, 0.3);
    fbGain.gain.setTargetAtTime(soundOn ? 0.15 + 0.55 * fb : 0.0, now, 0.3);
    delayNode.delayTime.setTargetAtTime(0.18 + 0.22 * mx, now, 0.3);
  } catch (e) { /* ignore */ }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {

/* Field-like composition: full-bleed on phones, centered square

   reads as the tangle filling the frame. Returns {ox, oy, s, w, h}. */
function fieldRect() {
  if (isPhone) return { ox: 0, oy: 0, s: Math.min(VW, VH), w: VW, h: VH };

/* The spiral content lives in a square centered in the field rect,

var mixRect = { x: 0, y: 0, w: 0, h: 0 };

    var gx = F.ox + (i / 12) * F.w;
    ctx.beginPath(); ctx.moveTo(gx, F.oy); ctx.lineTo(gx, F.oy + F.h); ctx.stroke();
    var gy = F.oy + (i / 12) * F.h;

    var br = bl.r * R.s * (0.7 + 0.9 * fb) * (0.8 + 0.4 * pulse);
    var bx = R.ox + bl.x * R.w, by = R.oy + bl.y * R.h;
    var a0 = 0.10 + 0.35 * fb;

    ctx.beginPath(); ctx.moveTo(bx + br * 1.6, by); ctx.arc(bx, by, br * 1.6, 0, TAU); ctx.stroke();
    ctx.strokeStyle = rgba(BLUE, 0.20 + 0.30 * fb);
    ctx.beginPath(); ctx.moveTo(bx + br * 2.2, by); ctx.arc(bx, by, br * 2.2, 0, TAU); ctx.stroke();

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);

  /* a second copper echo of the trace, a breath behind, fainter */
  ctx.strokeStyle = rgba(COPPER, 0.35);
  ctx.lineWidth = Math.max(1, R.s * 0.002);
  ctx.beginPath();
  for (i = 0; i <= 160; i++) {
    var s2 = i / 160;
    var p2 = spiralPoint(s2, phaseT - 0.9);
    var qx = R.ox + p2.x * R.w, qy = R.oy + p2.y * R.h;
    if (i === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy);

  for (i = 0; i < strands.length; i++) {
    var st = strands[i];
    var fade = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(phaseT * 0.7 + st.ph));
    ctx.strokeStyle = rgba(st.col, fade);
    ctx.lineWidth = Math.max(1, st.w * (R.s / 720));
    ctx.beginPath();

      var sx = R.ox + st.pts[j].x * R.w, sy = R.oy + st.pts[j].y * R.h;

  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Voice Into Wire', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 03 · 16', plateX + 14, plateY + 7 + titlePx + 3);

  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;

  ctx.fillRect(mixPlateX, mixPlateY, mixPlateW, mixPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(mixPlateX + 0.5, mixPlateY + 0.5, mixPlateW - 1, mixPlateH - 1);

function pointerPos(ev) {

/* ---- frame one: fixed phase t = 12 s, seed 1890 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);

    if (!dragging) return;
    var p = pointerPos(ev);
    if (!p) return;
    moveListener(p.x, p.y);
    updateAudio(phaseT);
    draw();
    if (ev.preventDefault) ev.preventDefault();
  });
  function endDrag() { dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', endDrag);
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      updateAudio(phaseT);
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
