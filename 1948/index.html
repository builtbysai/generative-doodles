<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1948 Silence Obliterated by Noise</title>
<style>
  html, body { margin: 0; padding: 0; background: #cfccc2; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Silence Obliterated by Noise, LR5 / PP1195, study #254 lucy-railton.
  // A held silence bed, a thin bone-white line low across a chapel
  // grey field, the faintest machinery hum. Then, without warning,
  // a full-field noise wall: industrial rust and dark machinery
  // textures slam across the screen and recede, leaving the thin
  // line again. Drag upward to push the machinery closer: the drag
  // is a pressure control. Under pressure the bursts come more
  // often, last longer, arrive denser. Release and the silence
  // reasserts itself. Every burst decays fully back to the bed.
  var INK = '#1a1a18';      // plate ink, machine black
  var INK_DIM = '#4a4842';  // muted machine black
  var BONE = '#f2efe6';     // bone white, the silence line
  var GREY_TOP = '#cfccc2'; // chapel grey, top of the field
  var GREY_BOT = '#b0ab9d'; // chapel grey, bottom of the field
  var GREY_LINE = '#8a867c';// faint grey under the line
  var RUST = '#8a3b1e';     // industrial rust
  var RUST_LT = '#a34d24';  // lighter rust
  var RUST_DK = '#5e2a14';  // dark rust
  var STEEL = '#6e7a80';    // steel
  var STEEL_LT = '#9aa4a8'; // light steel
  var BLACK = '#1a1a18';    // machine black
  var PILL = '#f2efe6';     // hint pill, bone white

  // Fixed-phase first frame: FIRST_T = 6 s. At t = 6 the silence
  // bed is held, no burst is active: the first burst starts at
  // t = 14, the second rest burst at t = 28.1. The thin line sits
  // low, the hum is faint, the field is still.
  var FIRST_T = 6;
  var FIRST_BURST_T = 14;
  var BURST_STEP = 4.7;

  // QA probe hooks: ?p= sets pressure at load (0 to 1), ?seed=
  // varies the texture seed. Read at load only.
  var seedParam = 0, probeP = 0;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m;
    m = qs.match(/[?&]seed=(-?\d+)/); if (m) { seedParam = parseInt(m[1], 10) || 0; }
    var mp = qs.match(/[?&]p=([0-9.]+)/); if (mp) { probeP = parseFloat(mp[1]) || 0; }
  } catch (e) {}
  var FIELD_SEED = seedParam ? (1948 + seedParam * 101) : 1948;

  // Seeded PRNG, mulberry32. Fresh instances per draw from the piece
  // number and burst index, so every frame is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Interaction state: pressure, 0 at rest, 1 fully pushed. Drag
  // upward raises it; it decays back toward 0 when released. Empty
  // at load, so frame one is a pure function of t and the seed.
  var pressure = probeP;
  var dragging = false;
  var downX = 0, downY = 0, lastY = 0;
  var lastDragT = -1e9;

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  // Pressure at time t: the live pressure state, decayed toward 0
  // since the last drag. Tau 5 s, so release lets the silence
  // reassert itself within seconds. During a drag the decay is
  // suspended because lastDragT keeps updating.
  function pressureAt(t) {
    var dt = t - lastDragT;
    if (dt <= 0) { return pressure; }
    return pressure * Math.exp(-dt / 5);
  }

  // Burst schedule. Candidate bursts start every BURST_STEP seconds
  // from FIRST_BURST_T. Candidate k fires when its seeded hash is
  // under the fire probability, which rises with pressure: 0.22 at
  // rest, 0.90 fully pushed. The first candidate always fires, so
  // the piece is guaranteed to speak. Duration grows with pressure:
  // 1.2 s at rest to 4.5 s fully pushed, times a seeded factor.
  // Returns { k, start, dur, env } for the active burst, or null.
  function activeBurst(t, p) {
    if (t < FIRST_BURST_T) { return null; }
    var fireProb = 0.22 + 0.68 * p;
    var kMax = Math.floor((t - FIRST_BURST_T) / BURST_STEP);
    var k;
    for (k = kMax; k >= 0; k--) {
      var rng = mulberry32(FIELD_SEED * 1000 + k * 7919);
      var hFire = rng();
      var hDur = rng();
      var start = FIRST_BURST_T + k * BURST_STEP;
      var dur = (1.2 + 3.3 * p) * (0.8 + 0.4 * hDur);
      if (k === 0 || hFire < fireProb) {
        if (t >= start && t <= start + dur) {
          var f = (t - start) / dur;
          var env;
          if (f < 0.12) { env = f / 0.12; }
          else if (f < 0.55) { env = 1; }
          else { env = 1 - (f - 0.55) / 0.45; }
          return { k: k, start: start, dur: dur, env: clamp(env, 0, 1) };
        }
      }
    }
    return null;
  }

  // Burst count in a window, for the acceptance numbers in process.md.
  function burstCount(t0, t1, p) {
    var fireProb = 0.22 + 0.68 * p;
    var count = 0, k;
    var k0 = Math.max(0, Math.floor((t0 - FIRST_BURST_T) / BURST_STEP));
    var k1 = Math.floor((t1 - FIRST_BURST_T) / BURST_STEP);
    for (k = k0; k <= k1; k++) {
      var rng = mulberry32(FIELD_SEED * 1000 + k * 7919);
      var hFire = rng();
      if (k === 0 || hFire < fireProb) { count++; }
    }
    return count;
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The silence bed: chapel grey field, the thin bone-white line
  // low across the full width, a faint hum trace above it. The
  // line's wobble grows slightly with pressure, the hum getting
  // louder as the machinery is pushed closer.
  function drawBed(t, p) {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, GREY_TOP);
    grad.addColorStop(1, GREY_BOT);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    var lineY = H * 0.82;
    var amp = 1.5 + 3.5 * p;
    // Faint hum trace, a slow sine above the line.
    ctx.strokeStyle = hexA(BONE, a4(0.28 + 0.15 * p));
    ctx.lineWidth = 1;
    ctx.beginPath();
    var x;
    for (x = 0; x <= W; x += 8) {
      var hy = lineY - 14 - Math.sin(x * 0.012 + t * 0.9) * (2 + 4 * p);
      if (x === 0) { ctx.moveTo(x, hy); } else { ctx.lineTo(x, hy); }
    }
    ctx.stroke();
    // The line itself, bone white, barely any height.
    ctx.strokeStyle = hexA(BONE, a4(0.95));
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (x = 0; x <= W; x += 8) {
      var ly = lineY + Math.sin(x * 0.02 + t * 0.5) * amp;
      if (x === 0) { ctx.moveTo(x, ly); } else { ctx.lineTo(x, ly); }
    }
    ctx.stroke();
    // A faint grey shadow under the line, so it reads as a held
    // thread rather than a drawn rule.
    ctx.strokeStyle = hexA(GREY_LINE, a4(0.35));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, lineY + 5); ctx.lineTo(W, lineY + 5);
    ctx.stroke();
  }

  // The noise wall: full-field industrial texture. Texture churns
  // on a 6 Hz quantized clock, under the 14 Hz ceiling, so the wall
  // shudders like machinery rather than strobing. Density scales
  // with pressure: 40 elements at rest, 200 fully pushed.
  function drawNoise(t, p, b) {
    var env = b.env;
    var q = Math.floor(t * 6) / 6; // quantized time, 6 Hz churn
    var rng = mulberry32(FIELD_SEED * 31 + b.k * 104729 + Math.floor(q * 6) * 17);

    // Machine black ground, arriving edge to edge. During the
    // attack the wall sweeps down from the top; during the decay
    // it recedes upward, leaving the line again.
    var f = clamp((t - b.start) / b.dur, 0, 1);
    var cover;
    if (f < 0.12) { cover = f / 0.12; }
    else if (f < 0.55) { cover = 1; }
    else { cover = 1 - (f - 0.55) / 0.45; }
    var wallH = H * cover;
    ctx.fillStyle = hexA(BLACK, a4(0.88 * env));
    ctx.fillRect(0, 0, W, wallH);

    // Rust blotches, the industrial corrosion on the wall.
    var nRust = Math.round(14 + 26 * p);
    var i;
    for (i = 0; i < nRust; i++) {
      var rx = rng() * W, ry = rng() * wallH;
      var rr = (8 + rng() * 42) * (0.5 + 0.5 * env);
      var rc = (rng() < 0.5) ? RUST : ((rng() < 0.5) ? RUST_LT : RUST_DK);
      ctx.fillStyle = hexA(rc, a4((0.35 + rng() * 0.45) * env));
      ctx.beginPath(); ctx.moveTo(rx + rr, ry); ctx.arc(rx, ry, rr, 0, Math.PI * 2); ctx.fill();
    }

    // Steel streaks, horizontal machine bars.
    var nBar = Math.round(10 + 22 * p);
    for (i = 0; i < nBar; i++) {
      var by = rng() * wallH;
      var bh = 2 + rng() * 7;
      var bx = rng() * W * 0.4;
      var bw = W * (0.25 + rng() * 0.75);
      ctx.fillStyle = hexA((rng() < 0.5) ? STEEL : STEEL_LT, a4((0.30 + rng() * 0.4) * env));
      ctx.fillRect(bx, by, bw, bh);
    }

    // Vertical machine ribs.
    var nRib = Math.round(8 + 18 * p);
    for (i = 0; i < nRib; i++) {
      var vx = rng() * W;
      var vw = 3 + rng() * 10;
      ctx.fillStyle = hexA(BLACK, a4((0.35 + rng() * 0.4) * env));
      ctx.fillRect(vx, 0, vw, wallH);
    }

    // Rivet grid, small steel dots in rows.
    var nRiv = Math.round(30 + 90 * p);
    for (i = 0; i < nRiv; i++) {
      var px = rng() * W, py = rng() * wallH;
      ctx.fillStyle = hexA(STEEL_LT, a4((0.4 + rng() * 0.4) * env));
      ctx.beginPath(); ctx.moveTo(px + 2.5, py); ctx.arc(px, py, 2.5, 0, Math.PI * 2); ctx.fill();
    }

    // Diagonal hatch, the wall's scored metal.
    ctx.strokeStyle = hexA(STEEL, a4(0.25 * env));
    ctx.lineWidth = 1;
    ctx.beginPath();
    var d;
    for (d = -H; d < W; d += 46) {
      ctx.moveTo(d, 0);
      ctx.lineTo(d + wallH * 0.5, wallH);
    }
    ctx.stroke();

    // Leading edge: a bright rust band where the wall is arriving
    // or receding, so the collapse reads as a physical edge.
    if (cover > 0.02 && cover < 0.999) {
      ctx.fillStyle = hexA(RUST_LT, a4(0.85 * env));
      ctx.fillRect(0, wallH - 3, W, 3);
    }
  }

  // Pressure gauge: a thin steel track at the right edge, filled
  // in rust to the current pressure, so the drag has a visible
  // readout. Quiet at rest, a thin rust fill.
  function drawGauge(p) {
    var gx = W - 14, gy = H * 0.2, gh = H * 0.5, gw = 5;
    ctx.fillStyle = hexA(STEEL, a4(0.45));
    ctx.fillRect(gx, gy, gw, gh);
    var fillH = gh * p;
    ctx.fillStyle = hexA(RUST_LT, a4(0.9));
    ctx.fillRect(gx, gy + gh - fillH, gw, fillH);
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var p = pressureAt(t);
    drawBed(t, p);
    var b = activeBurst(t, p);
    if (b) { drawNoise(t, p, b); }
    drawGauge(p);

    // ---- Plates: title top-left, number and date below it, a short
    // descriptor top-right. During a burst the wall is near-black,
    // so the plate ink flips to bone white to stay legible.
    var plateInk = (b && b.env > 0.4) ? BONE : INK;
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = plateInk;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Silence Obliterated by Noise', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(plateInk, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1948 · 2007 · 05 · 13', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(plateInk, 0.6);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('a chapel, interrupted', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom on a bone-white pill so it
    // stays legible over the grey field and the noise wall.
    var hint = 'Drag upward to push the machinery closer.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(PILL, a4(0.7));
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  function perfT() { return lastT; }

  function canvasPos(e) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (err) {}
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      try { if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) { canvas.setPointerCapture(e.pointerId); } } catch (err) {}
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      var p = canvasPos(e);
      downX = p.x; downY = p.y;
      lastY = p.y;
      lastDragT = perfT();
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      var p = canvasPos(e);
      // Drag upward raises pressure: each pixel of upward travel
      // adds 0.004, so a 250 px upward drag reaches full pressure.
      var dy = p.y - lastY;
      if (dy < 0) {
        pressure = clamp(pressure + (-dy) * 0.004, 0, 1);
      }
      lastY = p.y;
      lastDragT = perfT();
      draw(reduced ? FIRST_T : perfT());
    });
    window.addEventListener('pointerup', function () {
      if (!dragging) { return; }
      dragging = false;
      lastDragT = perfT();
    });
    window.addEventListener('pointercancel', function () { dragging = false; });
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1948 exposes pressure and burst state for probes.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1948 = {
      pressure: function () { return pressureAt(lastT); },
      setPressure: function (v, t) { pressure = clamp(v, 0, 1); lastDragT = (t === undefined ? lastT : t); },
      burst: function (t) { return activeBurst(t, pressureAt(t)); },
      burstCount: burstCount,
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop: hum at 0.5 to 0.9 rad/s, texture churn quantized
  // to 6 Hz, all under the 14 Hz ceiling. Guarded so node-canvas
  // QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
