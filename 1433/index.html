<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Grid Glows</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1712; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1433000);
  function r4(x) { return Math.round(x * 10000) / 10000; }

  // Viewport sizing (Visual Viewport API first).
  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
    canvas.style.width = Math.round(W) + 'px';
    canvas.style.height = Math.round(H) + 'px';
    var minDim = 1e9;
    try {
      if (window.screen && window.screen.width && window.screen.height) {
        minDim = Math.min(window.screen.width, window.screen.height);
      }
    } catch (e) { /* ignore */ }
    phone = (minDim < 700) || (H > W * 1.15);
  }
  size();
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', size);
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', size);
    }
  }

  // ---- Palette ----
  var PARCH = '#e8e2d4', STEEL = '#8a8f94', ARMOUR = '#3a3f44', INK = '#141210';
  var GROUND = '#1a1712';
  var SEAMCOLS = ['#c8e83a', '#d4a24e', '#e85a7a']; // fluorescent green, gold, rose
  var WORDS = ['grief', 'love', 'happiness'];

  // ---- Grid: 4 cols x 3 rows, seams continuous full height / full width ----
  var COLS = 4, ROWS = 3;
  var GUTTER_BASE = 10;
  // Gutter width offsets per seam, folded from recorded drag events (closed-form).
  var gutterEvents = []; // {v: bool, i: int, delta: number}
  // Injected pulses from seam drags, folded from recorded events.
  var pulseEvents = []; // {v: bool, i: int, pos: number, dir: number, t: number}

  function gutterOffset(v, i) {
    var sum = 0;
    for (var k = 0; k < gutterEvents.length; k++) {
      if (gutterEvents[k].v === v && gutterEvents[k].i === i) sum += gutterEvents[k].delta;
    }
    if (sum < -5) sum = -5;
    if (sum > 16) sum = 16;
    return sum;
  }
  function geom() {
    var gw = [], gh = [];
    for (var i = 0; i < COLS - 1; i++) gw.push(GUTTER_BASE + gutterOffset(true, i));
    for (var j = 0; j < ROWS - 1; j++) gh.push(GUTTER_BASE + gutterOffset(false, j));
    // Seam center lines: distribute panels evenly, gutters centered on boundaries.
    var vx = [], hx = [];
    for (var i2 = 0; i2 < COLS - 1; i2++) vx.push(W * (i2 + 1) / COLS);
    for (var j2 = 0; j2 < ROWS - 1; j2++) hx.push(H * (j2 + 1) / ROWS);
    return { gw: gw, gh: gh, vx: vx, hx: hx };
  }
  // Panel rects: panel (c, r) fills between neighbouring gutter edges.
  function panelRect(g, c, r) {
    var x0 = (c === 0) ? 0 : g.vx[c - 1] + g.gw[c - 1] / 2;
    var x1 = (c === COLS - 1) ? W : g.vx[c] - g.gw[c] / 2;
    var y0 = (r === 0) ? 0 : g.hx[r - 1] + g.gh[r - 1] / 2;
    var y1 = (r === ROWS - 1) ? H : g.hx[r] - g.gh[r] / 2;
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }

  // ---- Seeded panel pictures (static) ----
  // type: 0 sword, 1 armour, 2 text fragment. One per panel, seeded once.
  var panels = [];
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var idx = r * COLS + c;
      var pr = mulberry32(1433000 + idx * 7919);
      panels.push({
        type: Math.floor(pr() * 3),
        word: WORDS[Math.floor(pr() * 3)],
        tone: pr(), seed: pr(), flip: pr() < 0.5
      });
    }
  }

  // ---- Drawing helpers (flat fills only; no gradients, no shadowBlur) ----
  function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + r4(a) + ')';
  }
  function dot(x, y, rad, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fill();
  }
  function stroke(x1, y1, x2, y2, w, col) {
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  function poly(points, w, col) {
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.stroke();
  }

  function drawSword(p, inset) {
    var cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    var s = Math.min(p.w, p.h) * 0.30;
    var dir = inset.flip ? -1 : 1;
    // Blade: diagonal steel bar.
    var bx1 = cx - dir * s, by1 = cy + s * 0.9, bx2 = cx + dir * s, by2 = cy - s * 0.9;
    stroke(bx1, by1, bx2, by2, Math.max(3, s * 0.10), STEEL);
    // Tip triangle (filled rect rotated approx: draw as small diamond at tip).
    dot(bx2, by2, Math.max(3, s * 0.10), STEEL);
    // Guard + pommel.
    stroke(bx1 - dir * s * 0.22, by1 + s * 0.18, bx1 + dir * s * 0.22, by1 - s * 0.18, Math.max(3, s * 0.10), ARMOUR);
    dot(bx1 - dir * s * 0.05, by1 + s * 0.22, Math.max(2, s * 0.07), ARMOUR);
  }
  function drawArmour(p, inset) {
    var cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    var s = Math.min(p.w, p.h) * 0.30;
    // Helmet dome.
    ctx.fillStyle = ARMOUR;
    ctx.beginPath();
    ctx.arc(cx, cy - s * 0.35, s * 0.55, Math.PI, 0);
    ctx.fill();
    rect(cx - s * 0.55, cy - s * 0.35, s * 1.10, s * 0.12, ARMOUR);
    // Breastplate.
    ctx.fillStyle = STEEL;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.6, cy + s * 0.15);
    ctx.lineTo(cx + s * 0.6, cy + s * 0.15);
    ctx.lineTo(cx + s * 0.45, cy + s * 0.95);
    ctx.lineTo(cx - s * 0.45, cy + s * 0.95);
    ctx.closePath();
    ctx.fill();
    // Plackart line.
    stroke(cx - s * 0.5, cy + s * 0.55, cx + s * 0.5, cy + s * 0.55, Math.max(2, s * 0.06), ARMOUR);
  }
  function drawWord(p, inset) {
    var cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var fs = Math.max(11, Math.round(Math.min(p.w, p.h) * 0.16));
    ctx.font = 'italic ' + fs + 'px Georgia, serif';
    ctx.fillText(inset.word, cx, cy);
  }
  function drawPanel(p, inset) {
    // Slight per-panel parchment tone (flat, seeded, static).
    var t = inset.tone;
    var col = (t < 0.33) ? '#e8e2d4' : (t < 0.66) ? '#e2dccb' : '#ede7d6';
    rect(p.x, p.y, p.w, p.h, col);
    var m = Math.min(p.w, p.h) * 0.14;
    var inner = { x: p.x + m, y: p.y + m, w: p.w - m * 2, h: p.h - m * 2 };
    if (inset.type === 0) drawSword(inner, inset);
    else if (inset.type === 1) drawArmour(inner, inset);
    else drawWord(inner, inset);
  }

  // ---- Seams ----
  function seamColor(v, i) {
    // Alternate fluorescent green / gold / rose by seam.
    if (v) return SEAMCOLS[i % 3];
    return SEAMCOLS[(i + 1) % 3];
  }
  function drawSeams(g, t) {
    // Layered flat-alpha strokes: wide faint halo, mid veil, bright core.
    var breathe = 0.85 + 0.15 * Math.sin((t / 24) * Math.PI * 2);
    for (var i = 0; i < COLS - 1; i++) {
      var col = seamColor(true, i), x = g.vx[i], w = g.gw[i];
      stroke(x, 0, x, H, w + 12, rgba(col, 0.10 * breathe));
      stroke(x, 0, x, H, w + 4, rgba(col, 0.22 * breathe));
      stroke(x, 0, x, H, w, rgba(col, 0.55 * breathe));
      stroke(x, 0, x, H, Math.max(2, w * 0.28), rgba(col, 0.95));
    }
    for (var j = 0; j < ROWS - 1; j++) {
      var col2 = seamColor(false, j), y = g.hx[j], h = g.gh[j];
      stroke(0, y, W, y, h + 12, rgba(col2, 0.10 * breathe));
      stroke(0, y, W, y, h + 4, rgba(col2, 0.22 * breathe));
      stroke(0, y, W, y, h, rgba(col2, 0.55 * breathe));
      stroke(0, y, W, y, Math.max(2, h * 0.28), rgba(col2, 0.95));
    }
    // Crossings are the brightest things: white-hot cores where seams meet.
    for (var i2 = 0; i2 < COLS - 1; i2++) {
      for (var j2 = 0; j2 < ROWS - 1; j2++) {
        var cx = g.vx[i2], cy = g.hx[j2];
        var cw = Math.max(g.gw[i2], g.gh[j2]);
        rect(cx - cw * 0.5, cy - cw * 0.5, cw, cw, rgba('#ffffff', 0.85 * breathe));
        dot(cx, cy, Math.max(2, cw * 0.22), '#ffffff');
      }
    }
  }

  // ---- Ambient travelling pulse ----
  // Route: down vertical seam 1 to horizontal seam 2, then right along it.
  // A new pulse spawns every 12 s and completes the route in 12 s.
  function routePoint(g, s) {
    var v1 = g.vx[1], h2 = g.hx[1], v3 = g.vx[COLS - 2];
    var lenA = h2;
    if (s <= lenA) return { x: v1, y: s, seg: 0 };
    return { x: v1 + (s - lenA), y: h2, seg: 1 };
  }
  function routeLength(g) {
    return g.hx[1] + (g.vx[COLS - 2] - g.vx[1]);
  }
  function drawPulseSegment(g, s0, s1, col, alpha) {
    // Draw the path stretch from distance s0 to s1 (s0 < s1) as a polyline.
    var pts = [];
    var a = routePoint(g, Math.max(0, s0)), b = routePoint(g, s1);
    pts.push([a.x, a.y]);
    if (a.seg === 0 && b.seg === 1) pts.push([g.vx[1], g.hx[1]]);
    pts.push([b.x, b.y]);
    if (pts.length > 1) {
      poly(pts, Math.max(3, g.gw[1] * 0.9), rgba(col, alpha));
      poly(pts, Math.max(1.5, g.gw[1] * 0.3), rgba('#ffffff', alpha));
    }
    dot(b.x, b.y, Math.max(3, g.gw[1] * 0.55), rgba('#ffffff', alpha));
  }
  function drawAmbientPulse(g, t) {
    var L = routeLength(g);
    var k = Math.floor(t / 12);
    for (var kk = k - 1; kk <= k; kk++) {
      if (kk < 0) continue;
      var age = t - kk * 12;
      if (age < 0 || age > 12) continue;
      var s = (age / 12) * L;
      var fadeIn = Math.min(1, age / 0.5);
      var fadeOut = Math.min(1, (12 - age) / 1.5);
      var a = fadeIn * fadeOut;
      if (a <= 0.01) continue;
      drawPulseSegment(g, s - 70, s, '#ffffff', r4(0.9 * a));
    }
  }
  function drawInjectedPulses(g, t) {
    for (var k = 0; k < pulseEvents.length; k++) {
      var e = pulseEvents[k];
      var age = t - e.t;
      if (age < 0 || age > 8) continue;
      var speed = 160; // px per second along the seam
      var pos = e.pos + e.dir * speed * age;
      var alpha = 1 - age / 8;
      var col = seamColor(e.v, e.i);
      if (e.v) {
        var x = g.vx[e.i];
        var y0 = Math.max(0, pos - 35), y1 = Math.min(H, pos + 35);
        if (y1 > y0) {
          stroke(x, y0, x, y1, Math.max(3, g.gw[e.i] * 0.9), rgba(col, r4(0.9 * alpha)));
          dot(x, pos, Math.max(3, g.gw[e.i] * 0.55), rgba('#ffffff', r4(alpha)));
        }
      } else {
        var y = g.hx[e.i];
        var x0 = Math.max(0, pos - 35), x1 = Math.min(W, pos + 35);
        if (x1 > x0) {
          stroke(x0, y, x1, y, Math.max(3, g.gh[e.i] * 0.9), rgba(col, r4(0.9 * alpha)));
          dot(pos, y, Math.max(3, g.gh[e.i] * 0.55), rgba('#ffffff', r4(alpha)));
        }
      }
    }
  }

  // ---- Interaction: closed-form over recorded events ----
  var nowT = 0;
  var drag = null; // {v, i, lastX, lastY, along}
  function canvasPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0].clientY);
    return { x: cx - r.left, y: cy - r.top };
  }
  function nearestSeam(p) {
    var g = geom();
    var best = null;
    for (var i = 0; i < COLS - 1; i++) {
      var d = Math.abs(p.x - g.vx[i]);
      if (!best || d < best.d) best = { v: true, i: i, d: d };
    }
    for (var j = 0; j < ROWS - 1; j++) {
      var d2 = Math.abs(p.y - g.hx[j]);
      if (d2 < best.d) best = { v: false, i: j, d: d2 };
    }
    return (best && best.d <= 16) ? best : null;
  }
  function onDown(e) {
    var p = canvasPos(e);
    var s = nearestSeam(p);
    if (!s) return;
    drag = { v: s.v, i: s.i, lastX: p.x, lastY: p.y };
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!drag) return;
    var p = canvasPos(e);
    var dx = p.x - drag.lastX, dy = p.y - drag.lastY;
    if (drag.v) {
      if (Math.abs(dy) >= Math.abs(dx)) {
        // Drag along the seam: inject a brighter pulse from the finger.
        pulseEvents.push({ v: true, i: drag.i, pos: p.y, dir: (dy >= 0) ? 1 : -1, t: nowT });
      } else {
        // Drag across the edge: widen / narrow the glowing gutter.
        gutterEvents.push({ v: true, i: drag.i, delta: dx * 0.5 });
      }
    } else {
      if (Math.abs(dx) >= Math.abs(dy)) {
        pulseEvents.push({ v: false, i: drag.i, pos: p.x, dir: (dx >= 0) ? 1 : -1, t: nowT });
      } else {
        gutterEvents.push({ v: false, i: drag.i, delta: dy * 0.5 });
      }
    }
    drag.lastX = p.x; drag.lastY = p.y;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() { drag = null; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---- Main draw (t = piece time in seconds) ----
  function draw(t) {
    nowT = t;
    var g = geom();
    rect(0, 0, W, H, GROUND);
    // Panels first; pictures sit inside the grid, never over the seams.
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        drawPanel(panelRect(g, c, r), panels[r * COLS + c]);
      }
    }
    // Seams over the wall: continuous, brightest at the crossings.
    drawSeams(g, t);
    // Travelling signals.
    drawAmbientPulse(g, t);
    drawInjectedPulses(g, t);
    // Pin canvas size (house rule).
    canvas.style.width = Math.round(W) + 'px';
    canvas.style.height = Math.round(H) + 'px';
  }

  // ---- Clock: frame one = draw(0) via boot flag ----
  var startTime = 0, started = false;
  draw(0);
  function loop(ts) {
    if (!started) { started = true; startTime = ts; }
    var t = ((ts - startTime) / 1000) % 120;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
