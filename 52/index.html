<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№52 · Rhythm and Colour</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b0e; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,228,216,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to turn</div>
<script>
'use strict';

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '52', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function artRect(w,h,full){
  if (full || isPhone()) return [0,0,w,h];
  const s=Math.min(w,h); return [(w-s)/2,(h-s)/2,s,s];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}

const PAL = ['#d42b1e','#f5c518','#1c9fd6','#f28ab2','#2f9e44','#ef6c00','#b030a0','#0fa3a3'];
const rng = mulberry(seed*104729+7);
const RINGS=9;
const ringW=[], segs=[];
for(let r=0;r<RINGS;r++){ ringW.push(0.7+rng()*0.6); segs.push(6+Math.floor(rng()*7)); }
const totalW=ringW.reduce((a,b)=>a+b,0);
let dragAng=0, dragging=false, lastA=0, cx0=0, cy0=0;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#0b0b0e'; ctx.fillRect(0,0,w,h);
  const t=(nowMs/1000)%32;
  const march=Math.floor(t/2)%8;
  const rot=(t/32)*Math.PI*2 + dragAng;
  const cx=w/2, cy=h/2;
  const Rmax=Math.min(w,h)*0.425;
  let rIn=Rmax*0.16;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
  for(let r=0;r<RINGS;r++){
    const rOut=rIn + (ringW[r]/totalW)*(Rmax*0.84);
    const ns=segs[r];
    for(let s=0;s<ns;s++){
      const a0=(s/ns)*Math.PI*2, a1=((s+1)/ns)*Math.PI*2;
      ctx.fillStyle=PAL[(r+s+march)%8];
      ctx.beginPath(); ctx.arc(0,0,rOut,a0,a1); ctx.arc(0,0,rIn,a1,a0,true); ctx.closePath(); ctx.fill();
    }
    rIn=rOut;
  }
  ctx.restore();
  // bone ring + center disk (unrotated overlay at same radii reference: draw center disk)
  ctx.fillStyle='#17171c'; ctx.beginPath(); ctx.arc(cx,cy,Rmax*0.16,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#e8e4d8'; ctx.lineWidth=Math.max(2,Rmax*0.012); ctx.beginPath(); ctx.arc(cx,cy,Rmax*0.145,0,Math.PI*2); ctx.stroke();
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(9000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',ev=>{dragging=true; const [w,h]=viewportWH(); cx0=w/2; cy0=h/2; lastA=Math.atan2(ev.clientY-cy0,ev.clientX-cx0);});
canvas.addEventListener('pointermove',ev=>{ if(!dragging) return; const a=Math.atan2(ev.clientY-cy0,ev.clientX-cx0); dragAng+=a-lastA; lastA=a; });
function endDrag(){ dragging=false; }
canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));

</script>
</body>
</html>
