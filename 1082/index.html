<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Monolith Flock</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F0EFEB; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- palette ----
  var GROUND = '#F0EFEB';
  var FACE = '#F7F6F2';
  var EDGE = '#D9D7D1';
  var EDGE_DARK = '#C9C7C1';
  var SHADOW = 'rgba(212,210,204,0.4)';
  var SCAN = 'rgba(53,224,255,0.15)';

  // ---- deterministic route: closed Catmull-Rom through seeded waypoints ----
  // Waypoints in unit stage space (square, 0..1). The route is precomputed
  // once, arc-length parameterized; motion is pure replay of this table.
  var WAYPOINTS = [
    [0.24, 0.64], [0.36, 0.44], [0.52, 0.60], [0.66, 0.40],
    [0.82, 0.52], [0.74, 0.72], [0.54, 0.66], [0.36, 0.78]
  ];
  var SAMPLES = [];      // {x, y, d} dense samples along the closed route
  var ROUTE_LEN = 0;

  function catmull(p0, p1, p2, p3, t) {
    var t2 = t * t, t3 = t2 * t;
    return 0.5 * ((2 * p1) + (-p0 + p2) * t +
      (2 * p0 - 5 * p1 + 4 * p2 - 3 * p3) * t2 +
      (-p0 + 3 * p1 - 3 * p2 + 2 * p3) * t3);
  }

  (function buildRoute() {
    var n = WAYPOINTS.length, per = 90, pts = [], i, j, t;
    for (i = 0; i < n; i++) {
      var p0 = WAYPOINTS[(i + n - 1) % n], p1 = WAYPOINTS[i];
      var p2 = WAYPOINTS[(i + 1) % n], p3 = WAYPOINTS[(i + 2) % n];
      for (j = 0; j < per; j++) {
        t = j / per;
        pts.push([catmull(p0[0], p1[0], p2[0], p3[0], t),
                  catmull(p0[1], p1[1], p2[1], p3[1], t)]);
      }
    }
    var d = 0;
    for (i = 0; i < pts.length; i++) {
      var a = pts[i], b = pts[(i + 1) % pts.length];
      if (i > 0) {
        var pa = pts[i - 1];
        d += Math.hypot(a[0] - pa[0], a[1] - pa[1]);
      }
      SAMPLES.push({ x: a[0], y: a[1], d: d });
    }
    var last = SAMPLES[SAMPLES.length - 1], first = SAMPLES[0];
    ROUTE_LEN = d + Math.hypot(first.x - last.x, first.y - last.y);
  })();

  // Position + heading at arc distance s (wraps).
  function routeAt(s) {
    s = ((s % ROUTE_LEN) + ROUTE_LEN) % ROUTE_LEN;
    var lo = 0, hi = SAMPLES.length - 1;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (SAMPLES[mid].d < s) lo = mid + 1; else hi = mid;
    }
    var i1 = lo, i0 = (lo + SAMPLES.length - 1) % SAMPLES.length;
    var a = SAMPLES[i0], b = SAMPLES[i1];
    var segLen = (b.d - a.d + ROUTE_LEN) % ROUTE_LEN || 1e-6;
    var f = (((s - a.d) % ROUTE_LEN) + ROUTE_LEN) % ROUTE_LEN / segLen;
    if (f > 1) f = 1;
    var x = a.x + (b.x - a.x) * f, y = a.y + (b.y - a.y) * f;
    var ahead = routePointRaw(s + 0.012), behind = routePointRaw(s - 0.012);
    return { x: x, y: y, ang: Math.atan2(ahead.y - behind.y, ahead.x - behind.x) };
  }
  function routePointRaw(s) {
    s = ((s % ROUTE_LEN) + ROUTE_LEN) % ROUTE_LEN;
    var lo = 0, hi = SAMPLES.length - 1;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (SAMPLES[mid].d < s) lo = mid + 1; else hi = mid;
    }
    var i1 = lo, i0 = (lo + SAMPLES.length - 1) % SAMPLES.length;
    var a = SAMPLES[i0], b = SAMPLES[i1];
    var segLen = (b.d - a.d + ROUTE_LEN) % ROUTE_LEN || 1e-6;
    var f = (((s - a.d) % ROUTE_LEN) + ROUTE_LEN) % ROUTE_LEN / segLen;
    if (f > 1) f = 1;
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
  }

  // ---- formations: per-monolith {trail (fraction of route length behind
  // leader), perp (unit-space offset along route normal), scale} ----
  var N = 8;
  var CONFIGS = [
    // 0: column — tight trail, near-zero perp, scale recedes with rank
    [
      { trail: 0.000, perp:  0.000, scale: 1.22 }, { trail: 0.034, perp: -0.010, scale: 1.13 },
      { trail: 0.068, perp:  0.010, scale: 1.04 }, { trail: 0.102, perp: -0.010, scale: 0.96 },
      { trail: 0.136, perp:  0.010, scale: 0.87 }, { trail: 0.170, perp: -0.008, scale: 0.79 },
      { trail: 0.204, perp:  0.008, scale: 0.70 }, { trail: 0.238, perp:  0.000, scale: 0.62 }
    ],
    // 1: arc — wide perpendicular fan, middle ranks lag, scale peaks at center
    [
      { trail: 0.000, perp: -0.165, scale: 0.80 }, { trail: 0.040, perp: -0.110, scale: 0.90 },
      { trail: 0.075, perp: -0.055, scale: 0.98 }, { trail: 0.105, perp: -0.018, scale: 1.03 },
      { trail: 0.105, perp:  0.018, scale: 1.03 }, { trail: 0.075, perp:  0.055, scale: 0.98 },
      { trail: 0.040, perp:  0.110, scale: 0.90 }, { trail: 0.000, perp:  0.165, scale: 0.80 }
    ],
    // 2: staggered — alternating sides, even spacing
    [
      { trail: 0.000, perp: -0.075, scale: 1.16 }, { trail: 0.026, perp:  0.075, scale: 1.09 },
      { trail: 0.052, perp: -0.075, scale: 1.02 }, { trail: 0.078, perp:  0.075, scale: 0.95 },
      { trail: 0.104, perp: -0.075, scale: 0.88 }, { trail: 0.130, perp:  0.075, scale: 0.81 },
      { trail: 0.156, perp: -0.075, scale: 0.74 }, { trail: 0.182, perp:  0.075, scale: 0.67 }
    ]
  ];
  var SCAN_INDEX = 3; // the one monolith carrying the IR scan-line

  function smooth(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }

  // Formation state at loop time t: config k holds, blending to k+1 during
  // the last 3 s of each 20 s block.
  function formationAt(t) {
    var block = Math.floor(t / 20) % 3;
    var p = t - Math.floor(t / 20) * 20;
    var blend = smooth((p - 17) / 3);
    var A = CONFIGS[block], B = CONFIGS[(block + 1) % 3], out = [], i;
    for (i = 0; i < N; i++) {
      out.push({
        trail: A[i].trail + (B[i].trail - A[i].trail) * blend,
        perp: A[i].perp + (B[i].perp - A[i].perp) * blend,
        scale: A[i].scale + (B[i].scale - A[i].scale) * blend
      });
    }
    return out;
  }

  // ---- canvas / viewport ----
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    if (sw && sh && Math.min(sw, sh) < 700) return true;
    return H > W * 1.15 && Math.min(W, H) < 700;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(currentT()); });
  }
  window.addEventListener('resize', function () { resize(); draw(currentT()); });

  // ---- drawing ----
  var FIRST_T = 45; // fixed phase for the synchronous first frame (staggered config, file reads clearly)

  function draw(t) {
    var loopT = ((t % 60) + 60) % 60;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var S = Math.min(W, H);
    var ox = (W - S) / 2, oy = (H - S) / 2;
    var phoneBoost = isPhone() ? 1.06 : 1.0;

    var form = formationAt(loopT);
    var leaderDist = (loopT / 60) * ROUTE_LEN;

    // Resolve each monolith's placement in unit space.
    var items = [], i;
    for (i = 0; i < N; i++) {
      var f = form[i];
      var rp = routeAt(leaderDist - f.trail * ROUTE_LEN);
      var nx = -Math.sin(rp.ang), ny = Math.cos(rp.ang);
      items.push({
        i: i,
        x: rp.x + nx * f.perp,
        y: rp.y + ny * f.perp,
        ang: rp.ang,
        scale: f.scale * phoneBoost
      });
    }
    // Painter order: small (far) first, large (near) last.
    items.sort(function (a, b) { return a.scale - b.scale; });

    for (i = 0; i < items.length; i++) drawMonolith(items[i], ox, oy, S);
  }

  function drawMonolith(m, ox, oy, S) {
    var cx = ox + m.x * S;
    var hM = 0.245 * m.scale * S;         // monolith height; width = h/2 (2:4)
    var baseY = oy + m.y * S + hM * 0.34; // ground contact line
    var topY = baseY - hM;
    var faceW = (hM / 2) * (0.62 + 0.38 * Math.abs(Math.sin(m.ang)));
    var sideW = (hM / 2) * 0.5 * Math.abs(Math.cos(m.ang));
    var sideRight = Math.cos(m.ang) >= 0;
    var lean = Math.sin(m.ang) * hM * 0.05;

    // floor shadow: skewed flat parallelogram under the base
    var skew = hM * 0.10, sLen = hM * 0.11;
    ctx.fillStyle = SHADOW;
    ctx.beginPath();
    ctx.moveTo(cx - faceW / 2 + (sideRight ? 0 : -sideW), baseY);
    ctx.lineTo(cx + faceW / 2 + (sideRight ? sideW : 0), baseY);
    ctx.lineTo(cx + faceW / 2 + (sideRight ? sideW : 0) + skew, baseY + sLen);
    ctx.lineTo(cx - faceW / 2 + (sideRight ? 0 : -sideW) + skew, baseY + sLen);
    ctx.closePath();
    ctx.fill();

    // side face (edge tone)
    ctx.fillStyle = EDGE;
    ctx.beginPath();
    if (sideRight) {
      ctx.moveTo(cx + faceW / 2, baseY);
      ctx.lineTo(cx + faceW / 2 + sideW, baseY - hM * 0.06);
      ctx.lineTo(cx + faceW / 2 + sideW + lean, topY - hM * 0.06);
      ctx.lineTo(cx + faceW / 2 + lean, topY);
    } else {
      ctx.moveTo(cx - faceW / 2, baseY);
      ctx.lineTo(cx - faceW / 2 - sideW, baseY - hM * 0.06);
      ctx.lineTo(cx - faceW / 2 - sideW + lean, topY - hM * 0.06);
      ctx.lineTo(cx - faceW / 2 + lean, topY);
    }
    ctx.closePath();
    ctx.fill();

    // front face
    ctx.fillStyle = FACE;
    ctx.beginPath();
    ctx.moveTo(cx - faceW / 2, baseY);
    ctx.lineTo(cx + faceW / 2, baseY);
    ctx.lineTo(cx + faceW / 2 + lean, topY);
    ctx.lineTo(cx - faceW / 2 + lean, topY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = EDGE_DARK;
    ctx.lineWidth = Math.max(1, S * 0.0016);
    ctx.stroke();

    // the one IR scan-line
    if (m.i === SCAN_INDEX) {
      var ly = baseY - hM * 0.38;
      ctx.strokeStyle = SCAN;
      ctx.lineWidth = Math.max(1.2, hM * 0.012);
      ctx.beginPath();
      ctx.moveTo(cx - faceW / 2 + lean * 0.38, ly);
      ctx.lineTo(cx + faceW / 2 + lean * 0.38, ly);
      ctx.stroke();
    }
  }

  // ---- run: synchronous fixed-phase first frame, then rAF if available ----
  var startStamp = null;
  function currentT() {
    if (startStamp === null || typeof performance === 'undefined') return FIRST_T;
    return FIRST_T + (performance.now() - startStamp) / 1000;
  }

  resize();
  draw(FIRST_T);

  if (typeof requestAnimationFrame === 'function') {
    startStamp = (typeof performance !== 'undefined') ? performance.now() : 0;
    var tick = function () {
      draw(currentT());
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
