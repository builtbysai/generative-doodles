<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dossier Wall</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #FF2D95; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  // Seeded PRNG only. No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var COLS = 10, ROWS = 6;
  var NOTES = ['HOW DO WE GET FREE?', 'HERE', 'NOW'];
  var reseedIndex = 0;
  var lastTap = 0;

  function buildLayout(seed) {
    var rnd = mulberry32(seed);
    var pages = [];
    for (var i = 0; i < COLS * ROWS; i++) {
      var col = i % COLS, row = (i / COLS) | 0;
      var lines = [];
      var nLines = 9 + ((rnd() * 4) | 0);
      for (var l = 0; l < nLines; l++) {
        var dashes = [];
        var nD = 2 + ((rnd() * 3) | 0);
        for (var d = 0; d < nD; d++) {
          dashes.push({ x: 0.10 + rnd() * 0.55, w: 0.08 + rnd() * 0.28 });
        }
        lines.push(dashes);
      }
      var red = [];
      var nRed = 1 + ((rnd() * 2) | 0);
      for (var r = 0; r < nRed; r++) red.push((rnd() * nLines) | 0);
      var sig = null;
      if (rnd() < 0.6) {
        sig = [];
        var sx = 0.15 + rnd() * 0.3, sy = 0.82;
        var px = sx, py = sy;
        for (var s = 0; s < 7; s++) {
          px += 0.03 + rnd() * 0.07;
          py += (rnd() - 0.5) * 0.07;
          sig.push({ x: px, y: py });
        }
      }
      var stones = [];
      var nSt = (rnd() * 3) | 0;
      for (var st = 0; st < nSt; st++) {
        var corner = (rnd() * 4) | 0;
        var bx = (corner % 2 === 0) ? 0.04 + rnd() * 0.08 : 0.88 + rnd() * 0.08;
        var by = (corner < 2) ? 0.04 + rnd() * 0.08 : 0.88 + rnd() * 0.08;
        stones.push({ x: bx, y: by, size: 0.012 + rnd() * 0.02, ph: rnd() * 6.283 });
      }
      pages.push({ col: col, row: row, rot: (rnd() - 0.5) * 0.05,
        shade: rnd() * 0.08, lines: lines, red: red, sig: sig, stones: stones });
    }
    var notePages = [];
    while (notePages.length < 3) {
      var p = (rnd() * pages.length) | 0;
      if (notePages.indexOf(p) < 0) notePages.push(p);
    }
    // Spray mist, biased to the left third.
    var mist = [];
    for (var m = 0; m < 90; m++) {
      var mx = Math.pow(rnd(), 1.8);
      mist.push({ x: mx, y: rnd(), r: 0.03 + rnd() * 0.09,
        a: 0.04 + rnd() * 0.08, ph: rnd() * 6.283, sp: 0.05 + rnd() * 0.12 });
    }
    return { pages: pages, notePages: notePages, mist: mist };
  }

  var layout = buildLayout(1320000);

  function size() {
    var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = Math.round(W); canvas.height = Math.round(H);
  }

  function draw(t) {
    size();
    ctx.clearRect(0, 0, W, H);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // Neon-pink plexiglas substrate, darkened at the edges (flat alpha layers).
    ctx.fillStyle = '#FF2D95';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(120, 10, 70, 0.28)';
    ctx.fillRect(0, 0, W, Math.round(H * 0.06));
    ctx.fillRect(0, Math.round(H * 0.94), W, Math.round(H * 0.06));
    ctx.fillRect(0, 0, Math.round(W * 0.04), H);
    ctx.fillRect(Math.round(W * 0.96), 0, Math.round(W * 0.04), H);
    ctx.fillStyle = 'rgba(90, 5, 50, 0.20)';
    ctx.fillRect(0, 0, Math.round(W * 0.10), Math.round(H * 0.10));
    ctx.fillRect(Math.round(W * 0.90), 0, Math.round(W * 0.10), Math.round(H * 0.10));
    ctx.fillRect(0, Math.round(H * 0.90), Math.round(W * 0.10), Math.round(H * 0.10));
    ctx.fillRect(Math.round(W * 0.90), Math.round(H * 0.90), Math.round(W * 0.10), Math.round(H * 0.10));

    // Slow 120 s lateral drift, ping-pong so the loop never jumps.
    var pageW = W / COLS, pageH = H / ROWS;
    var pan = Math.sin(t * 2 * Math.PI / 120) * pageW * 0.7;

    var gutter = Math.min(pageW, pageH) * 0.06;
    var pw = pageW - gutter * 2, ph = pageH - gutter * 2;

    // Page drop shadows first (flat alpha), then pages.
    ctx.fillStyle = 'rgba(40, 5, 25, 0.35)';
    for (var i = 0; i < layout.pages.length; i++) {
      var pg = layout.pages[i];
      var cx = pg.col * pageW + pageW / 2 - pan;
      var cy = pg.row * pageH + pageH / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(pg.rot);
      ctx.fillRect(-pw / 2 + 4, -ph / 2 + 5, pw, ph);
      ctx.restore();
    }

    for (var j = 0; j < layout.pages.length; j++) {
      var p = layout.pages[j];
      var x = p.col * pageW + pageW / 2 - pan;
      var y = p.row * pageH + pageH / 2;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(p.rot);
      ctx.fillStyle = '#E8E2D4';
      ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
      if (p.shade > 0) {
        ctx.fillStyle = 'rgba(120, 110, 90, ' + p.shade.toFixed(3) + ')';
        ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
      }
      // Pseudo-type lines: short gray dashes, never readable prose.
      var lineGap = ph * 0.075;
      for (var li = 0; li < p.lines.length; li++) {
        var ly = -ph / 2 + ph * 0.08 + li * lineGap;
        if (ly > ph / 2 - ph * 0.16) break;
        var dashes = p.lines[li];
        ctx.fillStyle = '#4A4A48';
        for (var di = 0; di < dashes.length; di++) {
          var dsh = dashes[di];
          ctx.fillRect(-pw / 2 + pw * dsh.x, ly, pw * dsh.w, Math.max(1, ph * 0.012));
        }
      }
      // Redaction bars: each one covers a text block drawn above.
      ctx.fillStyle = '#0E0D0B';
      for (var ri = 0; ri < p.red.length; ri++) {
        var rl = p.red[ri];
        var ry = -ph / 2 + ph * 0.08 + rl * lineGap;
        if (ry > ph / 2 - ph * 0.16) continue;
        ctx.fillRect(-pw / 2 + pw * 0.10, ry - ph * 0.006, pw * (0.45 + (ri % 3) * 0.12), Math.max(2, ph * 0.022));
      }
      // Stylized signature scrawl, never a real name.
      if (p.sig) {
        ctx.strokeStyle = '#2A241C';
        ctx.lineWidth = Math.max(1, pw * 0.008);
        ctx.beginPath();
        ctx.moveTo(-pw / 2 + pw * p.sig[0].x, -ph / 2 + ph * p.sig[0].y);
        for (var si = 1; si < p.sig.length; si++) {
          ctx.lineTo(-pw / 2 + pw * p.sig[si].x, -ph / 2 + ph * p.sig[si].y);
        }
        ctx.stroke();
      }
      // Handwritten margin notes: prompt-specced phrases only.
      var ni = layout.notePages.indexOf(j);
      if (ni >= 0) {
        ctx.save();
        ctx.translate(-pw / 2 + pw * 0.04, -ph * 0.30 + ni * ph * 0.10);
        ctx.rotate(-0.06 + ni * 0.05);
        ctx.fillStyle = '#3A3A38';
        var fs = Math.max(9, Math.round(pw * 0.085));
        ctx.font = 'italic 700 ' + fs + 'px Georgia, serif';
        var tw = ctx.measureText(NOTES[ni]).width;
        while (tw > pw * 0.92 && fs > 5) {
          fs -= 1;
          ctx.font = 'italic 700 ' + fs + 'px Georgia, serif';
          tw = ctx.measureText(NOTES[ni]).width;
        }
        ctx.fillText(NOTES[ni], 0, 0);
        ctx.restore();
      }
      ctx.restore();
    }

    // Hot-pink spray mist, concentrated on the left third, slowly re-settling.
    for (var mi = 0; mi < layout.mist.length; mi++) {
      var mb = layout.mist[mi];
      var mxp = mb.x * W + Math.sin(t * mb.sp + mb.ph) * 12 - pan * 0.3;
      var myp = mb.y * H + Math.cos(t * mb.sp * 0.7 + mb.ph) * 8;
      var mr = mb.r * Math.min(W, H);
      var ma = mb.a * (0.7 + 0.3 * Math.sin(t * 0.2 + mb.ph));
      ctx.fillStyle = 'rgba(233, 30, 99, ' + ma.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(mxp + mr, myp);
      ctx.arc(mxp, myp, mr, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = 'rgba(233, 30, 99, ' + (ma * 0.5).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(mxp + mr * 0.6, myp);
      ctx.arc(mxp, myp, mr * 0.6, 0, 6.2832);
      ctx.fill();
    }

    // Rhinestones: gold glints, denser near page corners, on a traveling light wave.
    var waveX = ((t / 14) % 1.3 - 0.15) * W;
    for (var k = 0; k < layout.pages.length; k++) {
      var pp = layout.pages[k];
      var pcx = pp.col * pageW + pageW / 2 - pan;
      var pcy = pp.row * pageH + pageH / 2;
      for (var s2 = 0; s2 < pp.stones.length; s2++) {
        var st = pp.stones[s2];
        var sxp = pcx - pw / 2 + pw * st.x;
        var syp = pcy - ph / 2 + ph * st.y;
        var wave = Math.exp(-Math.pow((sxp - waveX) / (W * 0.12), 2));
        var inten = 0.35 + 0.35 * Math.sin(t * 2 + st.ph) + wave * 0.6;
        if (inten < 0.15) inten = 0.15;
        if (inten > 1) inten = 1;
        var ss = st.size * Math.min(W, H);
        ctx.fillStyle = 'rgba(245, 215, 110, ' + inten.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(sxp, syp - ss);
        ctx.lineTo(sxp + ss * 0.6, syp);
        ctx.lineTo(sxp, syp + ss);
        ctx.lineTo(sxp - ss * 0.6, syp);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  // Double-tap reseeds the page layout and rhinestone positions.
  function onTap() {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (now - lastTap < 400) {
      reseedIndex++;
      layout = buildLayout(1320000 + reseedIndex * 7919);
    }
    lastTap = now;
  }
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('pointerdown', onTap);
  }

  // Boot: frame one is drawn synchronously at exactly t = 0.
  draw(0);

  // The clock starts only with the rAF loop.
  var start = 0;
  var currentT = 0;
  function loop(now) {
    if (!start) start = now;
    currentT = (now - start) / 1000;
    draw(currentT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

  function onResize() { draw(currentT); }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
