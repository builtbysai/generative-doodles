<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Watch Occupied</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;padding:0;background:#d8cfc0;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// Palette (prompt only)
var FLOOR='#d8cfc0', BENCH='#8a6a48', STEEL='#9a9a9a', GOLD='#d9a441',
    IVORY='#f2ead8', SKIN1='#f2ead8', SKIN2='#e0c4a0', APRON='#6b7686';

// Seeded PRNG (mulberry32), never Math.random
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rand = mulberry32(1478000);

// Viewport sizing (Visual Viewport API)
var W=0,H=0,isPhone=false;
function size(){
  var vw = (typeof window!=='undefined' && window.visualViewport) ? window.visualViewport.width : window.innerWidth;
  var vh = (typeof window!=='undefined' && window.visualViewport) ? window.visualViewport.height : window.innerHeight;
  W=vw; H=vh;
  var sw = (typeof window!=='undefined' && window.screen) ? window.screen.width : vw;
  var sh = (typeof window!=='undefined' && window.screen) ? window.screen.height : vh;
  var minDim = Math.min(sw,sh);
  isPhone = (minDim < 700) || (H > W*1.15);
  canvas.width=W; canvas.height=H;
  pin();
}
function pin(){ canvas.style.width=W+'px'; canvas.style.height=H+'px'; }
if (typeof window!=='undefined'){
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  window.addEventListener('resize', size);
}
size();

// Geometry (recomputed per draw from W/H)
function geom(){
  var nB=3;
  var top = H*0.08, bandH = Math.min(H*0.22, 220);
  var gap = (H - top*2 - nB*bandH) / Math.max(1,(nB-1));
  if (gap < 18) { bandH = (H - top*2 - 2*18)/nB; gap = 18; }
  var x0 = W*0.05, x1 = W*0.95;
  return {nB:nB, top:top, bandH:bandH, gap:gap, x0:x0, x1:x1, L:x1-x0};
}

// Benches: conveyor with station states, speed segments (closed-form integral)
var TAU = 1.5; // release ease-back time constant (s)
var benches = [];
for (var b=0;b<3;b++){
  var segs = [{t:0, mult:1, ease:false}];
  var mv = [];
  for (var i=0;i<4;i++){
    mv.push({off: i*0.25, sizeJ: 0.9 + rand()*0.2, skin: (rand()<0.5?SKIN1:SKIN2)});
  }
  benches.push({segs:segs, mv:mv, drag:null, dragStartX:0});
}
var STATIONS = [0.15, 0.38, 0.61, 0.84]; // fractions along bench
var TRAVERSE = 48; // seconds for one full pass at 1x

function benchMultAt(bi, t){
  var segs = benches[bi].segs, s = segs[segs.length-1];
  // find last segment starting at or before t
  for (var i=segs.length-1;i>=0;i--){ if (segs[i].t <= t){ s = segs[i]; break; } }
  if (s.ease){
    var dt = Math.max(0, t - s.t);
    return 1 + (s.mult-1)*Math.exp(-dt/TAU);
  }
  return s.mult;
}
// Distance travelled (in bench-length fractions) up to time t
function benchDist(bi, t){
  var segs = benches[bi].segs, dist = 0;
  for (var i=0;i<segs.length;i++){
    var s = segs[i];
    if (s.t >= t) break;
    var nextT = (i+1<segs.length) ? Math.min(segs[i+1].t, t) : t;
    var dur = nextT - s.t;
    if (dur <= 0) continue;
    if (s.ease){
      dist += dur + (s.mult-1)*TAU*(1-Math.exp(-dur/TAU));
    } else {
      dist += s.mult*dur;
    }
  }
  return dist / TRAVERSE;
}
function movementState(bi, mi, t){
  var g = geom();
  var d = benchDist(bi, t);
  var total = benches[bi].mv[mi].off + d;
  var frac = total - Math.floor(total);
  var completed = Math.floor(total);
  // inset travel so movements stay fully on the bench (never clipped at the ends)
  var mvR = Math.min(g.bandH*0.30, 34);
  var px = (g.x0 + mvR) + frac * (g.L - 2*mvR);
  var station = 0;
  for (var s=0;s<STATIONS.length;s++){ if (frac >= STATIONS[s]) station = s+1; }
  return {x:px, frac:frac, station:station, completed:completed};
}

// --- drawing helpers (own beginPath per arc; moveTo before batched arcs) ---
function disc(x,y,r,color){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
}
function ring(x,y,r,lw,color){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,Math.PI*2); ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.stroke();
}
function rect(x,y,w,h,color){ ctx.fillStyle=color; ctx.fillRect(x,y,w,h); }
function handShape(x,y,s,color,ang){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(s*0.45,0); ctx.arc(0,0,s*0.45,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
  ctx.fillStyle=color; ctx.fillRect(-s*0.12,-s*0.9,s*0.24,s*0.9);
  ctx.restore();
}
function drawGear(x,y,r,color){
  // toothed gear: circle + 8 teeth as rects
  disc(x,y,r,color);
  for (var k=0;k<8;k++){
    var a = k*Math.PI/4;
    ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    ctx.fillStyle=color; ctx.fillRect(-r*0.12,-r*1.25,r*0.24,r*0.3);
    ctx.restore();
  }
  disc(x,y,r*0.35,IVORY);
}
function drawMovement(x,y,s,station,skin){
  // s = radius. Station: 0 bare, 1 gear, 2 +spring, 3 +hands, 4 +case (finished)
  disc(x,y,s,STEEL);
  disc(x,y,s*0.82,IVORY);
  if (station>=1) drawGear(x,y,s*0.55,GOLD);
  if (station>=2){
    ring(x,y,s*0.38,Math.max(1,s*0.07),STEEL);
    ring(x,y,s*0.24,Math.max(1,s*0.06),GOLD);
  }
  if (station>=3){
    ctx.strokeStyle=STEEL; ctx.lineWidth=Math.max(1,s*0.08); ctx.beginPath();
    ctx.moveTo(x,y); ctx.lineTo(x,y-s*0.45); ctx.moveTo(x,y); ctx.lineTo(x+s*0.35,y-s*0.2); ctx.stroke();
  }
  if (station>=4) ring(x,y,s*0.95,Math.max(2,s*0.12),GOLD);
}

// Boot flag: frame one = draw(0); clock starts only with the rAF loop
var started=false, startMs=0;
function draw(t){
  var g = geom();
  pin();
  rect(0,0,W,H,FLOOR);
  for (var b=0;b<g.nB;b++){
    var by = g.top + b*(g.bandH+g.gap);
    // bench band
    rect(g.x0-8, by, g.L+16, g.bandH, BENCH);
    // station ticks
    for (var s=0;s<STATIONS.length;s++){
      var sx = g.x0 + STATIONS[s]*g.L;
      rect(sx-1, by, 2, g.bandH, STEEL);
    }
    var cy = by + g.bandH/2;
    var mvR = Math.min(g.bandH*0.30, 34);
    // aprons + hands at stations (hands enter from band edges)
    for (var st=0; st<STATIONS.length; st++){
      var ax = g.x0 + STATIONS[st]*g.L;
      var bob = Math.sin(t*2.2 + st*1.7 + b)*Math.min(3, g.bandH*0.03);
      var skin = (st%2===0)?SKIN1:SKIN2;
      // apron at top edge
      rect(ax-mvR*0.7, by-2, mvR*1.4, Math.min(14, g.bandH*0.12), APRON);
      // two hands from top edge
      handShape(ax-mvR*0.45, by+g.bandH*0.18+bob, mvR*0.32, skin, 0.3);
      handShape(ax+mvR*0.45, by+g.bandH*0.18-bob, mvR*0.32, skin, -0.3);
      // two hands from bottom edge
      handShape(ax-mvR*0.45, by+g.bandH*0.82-bob, mvR*0.32, skin, Math.PI-0.3);
      handShape(ax+mvR*0.45, by+g.bandH*0.82+bob, mvR*0.32, skin, Math.PI+0.3);
    }
    // movements travelling along the bench
    for (var m=0;m<4;m++){
      var ms = movementState(b, m, t);
      drawMovement(ms.x, cy, mvR*benches[b].mv[m].sizeJ, ms.station, benches[b].mv[m].skin);
    }
    // set-aside tray: finished watches at the right end (one per completed pass, capped 5)
    var totalDone = 0;
    for (var m2=0;m2<4;m2++) totalDone += movementState(b, m2, t).completed;
    var show = Math.min(5, totalDone);
    for (var k=0;k<show;k++){
      var tx = g.x1 - 14 - k*(mvR*1.1);
      var ty = by - mvR*0.9;
      if (ty < 6) ty = by + g.bandH + mvR*0.6;
      drawMovement(tx, ty, mvR*0.45, 4, SKIN1);
    }
  }
}

// --- interaction: drag along a bench speeds/slows that bench's line ---
function benchAt(y){
  var g = geom();
  for (var b=0;b<g.nB;b++){
    var by = g.top + b*(g.bandH+g.gap);
    if (y >= by-6 && y <= by+g.bandH+6) return b;
  }
  return -1;
}
function pushSeg(bi, t, mult, ease){
  var segs = benches[bi].segs;
  var last = segs[segs.length-1];
  if (t < last.t) t = last.t;
  if (t === last.t){ segs[segs.length-1] = {t:t, mult:mult, ease:ease}; }
  else segs.push({t:t, mult:mult, ease:ease});
}
function onDown(x,y,t){
  var bi = benchAt(y);
  if (bi<0) return;
  benches[bi].drag = true;
  benches[bi].dragStartX = x;
}
function onMove(x,y,t){
  var bi = benchAt(y);
  if (bi<0) return;
  var B = benches[bi];
  if (!B.drag) return;
  var dx = x - B.dragStartX;
  var mult = 1 + dx/200;
  if (mult < 0.25) mult = 0.25;
  if (mult > 3) mult = 3;
  pushSeg(bi, t, mult, false);
}
function onUp(x,y,t){
  for (var bi=0;bi<3;bi++){
    var B = benches[bi];
    if (B.drag){
      B.drag = false;
      var cur = benchMultAt(bi, t);
      pushSeg(bi, t, cur, true); // ease back to 1.0
    }
  }
}
function evPos(e){
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : {left:0,top:0};
  return {x: e.clientX - r.left, y: e.clientY - r.top};
}
function nowT(){
  if (!started) return 0;
  return (Date.now()-startMs)/1000;
}
if (canvas.addEventListener){
  canvas.addEventListener('pointerdown', function(e){ onDown(evPos(e).x, evPos(e).y, nowT()); });
  canvas.addEventListener('pointermove', function(e){ onMove(evPos(e).x, evPos(e).y, nowT()); });
  canvas.addEventListener('pointerup', function(e){ onUp(evPos(e).x, evPos(e).y, nowT()); });
  canvas.addEventListener('pointercancel', function(e){ onUp(evPos(e).x, evPos(e).y, nowT()); });
}

// Frame one at load, then the rAF loop (plain function declaration)
draw(0);
function loop(){
  if (!started){ started=true; startMs=Date.now(); }
  var t = (Date.now()-startMs)/1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

// Probe interface (used by QA harness only)
if (typeof window!=='undefined'){
  window.__piece = {
    draw: draw,
    down: onDown, move: onMove, up: onUp,
    benchMult: benchMultAt,
    movement: movementState,
    benchDist: benchDist,
    geom: geom
  };
}
})();
</script>
</body>
</html>
