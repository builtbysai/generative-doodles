<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xawiska Protocol</title>
<style>
  html, body { margin: 0; padding: 0; background: #050705; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1369000);

  // ---------- seeded static data (built once, never re-randomized) ----------
  var STARS = [];
  for (var i = 0; i < 110; i++) {
    STARS.push({ x: rnd(), y: rnd() * 0.74, r: 0.6 + rnd() * 1.3, a: 0.25 + rnd() * 0.6, p: rnd() * 6.283 });
  }
  var FLOOR_DOTS = [];
  for (var j = 0; j < 90; j++) {
    FLOOR_DOTS.push({ x: rnd(), y: rnd(), r: 1 + rnd() * 2.5, a: 0.04 + rnd() * 0.08 });
  }
  // Poem-band glyphs: two rows, each a seeded stream of invented marks.
  function makeBand(n, seedOff) {
    var r = mulberry32(1369000 + seedOff);
    var arr = [];
    for (var k = 0; k < n; k++) {
      arr.push({ type: Math.floor(r() * 10), dy: (r() - 0.5) * 14, s: 9 + r() * 7, a: 0.5 + r() * 0.4 });
    }
    return arr;
  }
  var BAND_A = makeBand(64, 101);
  var BAND_B = makeBand(64, 202);
  // Spore motes drifting near the plant.
  var MOTES = [];
  for (var m = 0; m < 26; m++) {
    MOTES.push({ dx: (rnd() - 0.5) * 220, dy: rnd() * 120, r: 1 + rnd() * 2, p: rnd() * 6.283, sp: 0.3 + rnd() * 0.5 });
  }
  // Ascent lights: seeded once; rise is a closed-form function of ascent time.
  var LIGHTS = [];
  for (var l = 0; l < 44; l++) {
    LIGHTS.push({
      x: 0.08 + rnd() * 0.84, delay: rnd() * 4, dur: 5 + rnd() * 5,
      r: 1.6 + rnd() * 2.4, c: l % 3, drift: (rnd() - 0.5) * 60, p: rnd() * 6.283
    });
  }
  // Cloaked-figure crossing opacities ("different states of consciousness").
  var CROSS_OP = [];
  for (var c = 0; c < 8; c++) { CROSS_OP.push(0.28 + rnd() * 0.6); }

  // ---------- palette ----------
  var NIGHT = '#050705', FLOOR = '#141A14', GHOST = '#E8E4D8',
      GOLD = '#C9A227', BLUE = '#4A6B8A';

  function easeInOut(x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  }
  function smooth(x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    return x * x * (3 - 2 * x);
  }

  // One invented glyph mark. Every shape gets its own beginPath (node-canvas
  // batches batched arcs into connected polygons otherwise). Never a letter.
  function drawGlyph(type, x, y, s, color, alpha) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = Math.max(1, s * 0.12);
    ctx.lineCap = 'round';
    if (type === 0) { // bar + dot
      ctx.beginPath(); ctx.moveTo(x - s * 0.5, y); ctx.lineTo(x + s * 0.5, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + s * 0.7, y); ctx.arc(x + s * 0.7, y, s * 0.12, 0, 6.283); ctx.fillStyle = color; ctx.fill();
    } else if (type === 1) { // chevron
      ctx.beginPath(); ctx.moveTo(x - s * 0.5, y + s * 0.3); ctx.lineTo(x, y - s * 0.3); ctx.lineTo(x + s * 0.5, y + s * 0.3); ctx.stroke();
    } else if (type === 2) { // open arc
      ctx.beginPath(); ctx.moveTo(x + s * 0.55, y); ctx.arc(x, y, s * 0.55, -0.6, 2.2); ctx.stroke();
    } else if (type === 3) { // zigzag
      ctx.beginPath(); ctx.moveTo(x - s * 0.6, y + s * 0.25);
      ctx.lineTo(x - s * 0.2, y - s * 0.25); ctx.lineTo(x + s * 0.2, y + s * 0.25); ctx.lineTo(x + s * 0.6, y - s * 0.25); ctx.stroke();
    } else if (type === 4) { // loop (paired arcs, own path)
      ctx.beginPath(); ctx.moveTo(x + s * 0.4, y); ctx.arc(x, y, s * 0.4, 0, 6.283); ctx.stroke();
    } else if (type === 5) { // dot pair + tick
      ctx.beginPath(); ctx.moveTo(x - s * 0.4, y); ctx.arc(x - s * 0.4, y, s * 0.13, 0, 6.283); ctx.fillStyle = color; ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + s * 0.3, y); ctx.arc(x + s * 0.3, y, s * 0.13, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - s * 0.1, y + s * 0.4); ctx.lineTo(x + s * 0.3, y + s * 0.4); ctx.stroke();
    } else if (type === 6) { // wave
      ctx.beginPath(); ctx.moveTo(x - s * 0.6, y);
      ctx.quadraticCurveTo(x - s * 0.3, y - s * 0.4, x, y);
      ctx.quadraticCurveTo(x + s * 0.3, y + s * 0.4, x + s * 0.6, y); ctx.stroke();
    } else if (type === 7) { // open triangle (one side missing)
      ctx.beginPath(); ctx.moveTo(x - s * 0.5, y + s * 0.4); ctx.lineTo(x, y - s * 0.5); ctx.lineTo(x + s * 0.5, y + s * 0.4); ctx.stroke();
    } else if (type === 8) { // arc + dot below
      ctx.beginPath(); ctx.moveTo(x - s * 0.5, y - s * 0.1); ctx.arc(x, y - s * 0.1, s * 0.5, 3.1416, 6.283); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y + s * 0.45); ctx.arc(x, y + s * 0.45, s * 0.12, 0, 6.283); ctx.fillStyle = color; ctx.fill();
    } else { // double tick
      ctx.beginPath(); ctx.moveTo(x - s * 0.5, y - s * 0.2); ctx.lineTo(x + s * 0.5, y - s * 0.2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - s * 0.35, y + s * 0.25); ctx.lineTo(x + s * 0.35, y + s * 0.25); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawCloak(x, baseY, h, alpha) {
    // Slightly lighter than the night sky, so the silhouette reads against it
    // (the same lesson as the Tremble Staves bird: sky-black on sky-black is
    // invisible). Still dark and ghostly, never bright.
    ctx.fillStyle = 'rgba(26, 32, 24, ' + alpha.toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(x - 0.30 * h, baseY);
    ctx.lineTo(x - 0.23 * h, baseY - 0.70 * h);
    ctx.quadraticCurveTo(x - 0.20 * h, baseY - 0.96 * h, x, baseY - h);
    ctx.quadraticCurveTo(x + 0.20 * h, baseY - 0.96 * h, x + 0.23 * h, baseY - 0.70 * h);
    ctx.lineTo(x + 0.30 * h, baseY);
    ctx.closePath();
    ctx.fill();
  }

  var lastT = 0;
  function draw(t) {
    lastT = t;
    // ---- sizing (Visual Viewport API; pinned canvas) ----
    var vw = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport.width : 0;
    var vh = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport.height : 0;
    if (!vw) vw = (typeof window !== 'undefined') ? window.innerWidth : 1280;
    if (!vh) vh = (typeof window !== 'undefined') ? window.innerHeight : 900;
    if (vw !== W || vh !== H) {
      W = vw; H = vh;
      canvas.width = W; canvas.height = H;
    }
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var floorY = H * 0.78;
    // Loop: 120 s. Growth 0-60, mature 60-100, ascent 100-115, fade 115-120.
    // Phase-shifted +24 s so frame one already shows a young plant.
    var lt = (t + 24) % 120;
    var growth, plantAlpha = 1;
    if (lt < 60) { growth = easeInOut(lt / 60); }
    else if (lt < 115) { growth = 1; }
    else { growth = 1; plantAlpha = 1 - (lt - 115) / 5; }

    // ---- sky + stars ----
    ctx.fillStyle = NIGHT;
    ctx.fillRect(0, 0, W, H);
    for (var si = 0; si < STARS.length; si++) {
      var st = STARS[si];
      var tw = 0.75 + 0.25 * Math.sin(t * 0.6 + st.p);
      ctx.fillStyle = GHOST;
      ctx.globalAlpha = st.a * tw;
      ctx.beginPath(); ctx.moveTo(st.x * W, st.y * H); ctx.arc(st.x * W, st.y * H, st.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- poem band (upper third, scrolling at camera speed) ----
    var spacing = 52;
    var totalA = BAND_A.length * spacing;
    for (var bi = 0; bi < BAND_A.length; bi++) {
      var g = BAND_A[bi];
      var bx = (((bi * spacing - 6 * t) % totalA) + totalA) % totalA - 40;
      if (bx > -50 && bx < W + 50) drawGlyph(g.type, bx, H * 0.22 + g.dy, g.s, GHOST, g.a * 0.85);
    }
    var totalB = BAND_B.length * spacing;
    for (var bj = 0; bj < BAND_B.length; bj++) {
      var gb = BAND_B[bj];
      var bx2 = (((bj * spacing - 4.2 * t) % totalB) + totalB) % totalB - 40;
      if (bx2 > -50 && bx2 < W + 50) drawGlyph(gb.type, bx2, H * 0.30 + gb.dy, gb.s * 0.85, BLUE, gb.a * 0.45);
    }

    // ---- forest floor ----
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, floorY, W, H - floorY);
    ctx.fillStyle = GHOST;
    for (var fi = 0; fi < FLOOR_DOTS.length; fi++) {
      var fd = FLOOR_DOTS[fi];
      ctx.globalAlpha = fd.a;
      ctx.beginPath(); ctx.moveTo(fd.x * W, floorY + fd.y * (H - floorY)); ctx.arc(fd.x * W, floorY + fd.y * (H - floorY), fd.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = GHOST;
    ctx.globalAlpha = 0.10;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();
    ctx.globalAlpha = 1;

    // ---- cloaked figure (crossing every ~25 s, alternating sides) ----
    var ct = (t + 6) % 25;
    var ck = Math.floor((t + 6) / 25);
    if (ct < 12) {
      var prog = smooth(ct / 12);
      var dir = (ck % 2 === 0) ? 1 : -1;
      var fx = (dir === 1) ? (-0.15 + prog * 1.30) * W : (1.15 - prog * 1.30) * W;
      drawCloak(fx, floorY, H * 0.28, CROSS_OP[ck % 8]);
    }

    // ---- ghost flower (center-low) ----
    var gx = W * 0.5;
    var stemH = 8 + growth * 0.30 * H;
    var sway = Math.sin(t * 0.4) * 5 * growth;
    var topX = gx + sway;
    var topY = floorY - stemH;
    // translucent stem
    ctx.strokeStyle = GHOST;
    ctx.globalAlpha = 0.5 * plantAlpha;
    ctx.lineWidth = 2 + growth * 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(gx, floorY);
    ctx.quadraticCurveTo(gx + sway * 0.5, floorY - stemH * 0.5, topX, topY);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // drooping bell head
    var br = 6 + growth * 16;
    ctx.save();
    ctx.translate(topX + 6 * growth, topY - 2);
    ctx.rotate(0.35);
    ctx.fillStyle = GHOST;
    ctx.globalAlpha = 0.92 * plantAlpha;
    ctx.beginPath();
    ctx.moveTo(-br, 0);
    ctx.quadraticCurveTo(-br * 0.9, -br * 1.2, 0, -br * 1.3);
    ctx.quadraticCurveTo(br * 0.9, -br * 1.2, br, 0);
    ctx.quadraticCurveTo(br * 0.7, br * 0.5, 0, br * 0.6);
    ctx.quadraticCurveTo(-br * 0.7, br * 0.5, -br, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    // spore motes around the plant
    for (var mi = 0; mi < MOTES.length; mi++) {
      var mo = MOTES[mi];
      var mx = gx + mo.dx * growth + Math.sin(t * mo.sp + mo.p) * 8;
      var my = floorY - 20 - mo.dy * growth + Math.cos(t * mo.sp * 0.7 + mo.p) * 6;
      ctx.fillStyle = GOLD;
      ctx.globalAlpha = (0.25 + 0.45 * (0.5 + 0.5 * Math.sin(t * 0.8 + mo.p))) * plantAlpha;
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.arc(mx, my, mo.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- ascent finale (loop time 100-115): lights rise from the ground ----
    if (lt >= 100 && lt < 115) {
      var asc = (lt - 100) * 1; // seconds into the finale
      for (var li = 0; li < LIGHTS.length; li++) {
        var L = LIGHTS[li];
        var local = asc - L.delay;
        if (local < 0) continue;
        var rise = Math.min(local / L.dur, 1);
        if (rise >= 1) continue;
        var ly = floorY - rise * 0.55 * H;
        var lx = L.x * W + Math.sin(t * 0.5 + L.p) * 10 + L.drift * rise * 0.3;
        var la = (rise < 0.15) ? rise / 0.15 : (rise > 0.75 ? (1 - rise) / 0.25 : 1);
        ctx.fillStyle = (L.c === 0) ? GOLD : (L.c === 1) ? BLUE : GHOST;
        ctx.globalAlpha = 0.10 * la;
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.arc(lx, ly, L.r * 3, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 0.9 * la;
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.arc(lx, ly, L.r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // Frame one is drawn synchronously at a constant phase; the clock starts
  // only with the rAF loop. No pointer listeners: this piece is watch-only.
  draw(0);
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    draw((ts - startT) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  function onResize() {
    // Sizing is re-read inside draw(); repaint at the current clock time.
    draw(lastT);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) window.addEventListener('resize', onResize);
  }
})();
</script>
</body>
</html>
