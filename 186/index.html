<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.186 Tooti Tooti</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#E8DCC8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.186 Tooti Tooti (Goodman-Strauss). Paper tiles cut from a
// folded envelope, creases and all, scattered on a warm desk.
// Drag a tile against the growing cluster and it settles edge to
// edge; because every tile came from the same envelope, the
// pattern they grow is forced into that envelope's symmetry
// group, triangle cut, square cut or hexagon cut. Ghost outlines
// at a whisper of alpha show where the symmetry wants the next
// tiles. Close a full ring and the symmetry axes flash indigo,
// once. Double-tap deals a new envelope. No text anywhere: the
// desk teaches the game.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DESK = '#E8DCC8', KRAFT = '#C8A97E', CREAM = '#EFE6D2', INK = '#8A7A5C', INDIGO = '#2E3A9B';
var W = 0, H = 0, TS = 80, CX = 0, CY = 0;
var seed = 186186;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// canonical tile templates (units of TS, centroid at origin) + fold lines
var TEMPLATES = {
  square: {
    pts: [[-0.50, -0.46], [0.47, -0.52], [0.52, 0.44], [-0.44, 0.51]],
    folds: [[[-0.50, -0.46], [0.52, 0.44]], [[0, 0], [0.47, -0.52]]],
    axes: [0, Math.PI / 4, Math.PI / 2, 3 * Math.PI / 4]
  },
  triangle: {
    pts: [[0.02, -0.58], [0.53, 0.30], [-0.51, 0.34]],
    folds: [[[0, 0], [0.02, -0.58]], [[0, 0], [0.53, 0.30]], [[0, 0], [-0.51, 0.34]]],
    axes: [0, Math.PI / 3, 2 * Math.PI / 3]
  },
  hexagon: {
    pts: [[0.55, 0.02], [0.28, 0.47], [-0.26, 0.50], [-0.55, -0.01], [-0.29, -0.46], [0.25, -0.50]],
    folds: [[[0, 0], [0.55, 0.02]], [[0, 0], [-0.55, -0.01]], [[0, 0], [0.28, 0.47]]],
    axes: [0, Math.PI / 6, Math.PI / 3, Math.PI / 2, 2 * Math.PI / 3, 5 * Math.PI / 6]
  }
};
var ORDER = ['square', 'triangle', 'hexagon'];
var envIdx = 0;
var slots = [], loose = [], spawnN = 0, flashAt = -1, flashedRings = {};
var anims = [];

function centroid(pts) {
  var x = 0, y = 0;
  pts.forEach(function (p) { x += p[0]; y += p[1]; });
  return [x / pts.length, y / pts.length];
}
function buildLayout() {
  var type = ORDER[envIdx];
  var r = rng(seed * 7 + envIdx * 131);
  slots = []; loose = []; flashedRings = {}; flashAt = -1; anims = [];
  var i, j;
  if (type === 'square') {
    var jit = {};
    function P(m, n) {
      var k = m + ',' + n;
      if (!jit[k]) jit[k] = [(r() - 0.5) * 0.07, (r() - 0.5) * 0.07];
      return [CX + (m + 0.5 + jit[k][0]) * TS, CY + (n + 0.5 + jit[k][1]) * TS];
    }
    for (i = -3; i < 2; i++) for (j = -3; j < 2; j++) {
      var pts = [P(i, j), P(i + 1, j), P(i + 1, j + 1), P(i, j + 1)];
      var c = centroid(pts);
      slots.push({ pts: pts, cx: c[0], cy: c[1], geo: 0, pat: (((i + j) % 4) + 4) % 4 * Math.PI / 2,
        ring: Math.max(Math.abs(i + 1), Math.abs(j + 1)),
        adj: [], filled: null });
    }
    slots.forEach(function (s, a) {
      slots.forEach(function (t, b) {
        if (a !== b && Math.abs(s.cx - t.cx) < TS * 1.1 && Math.abs(s.cy - t.cy) < TS * 1.1 &&
            Math.abs(Math.abs(s.cx - t.cx) + Math.abs(s.cy - t.cy) - TS) < TS * 0.25) s.adj.push(b);
      });
    });
  } else if (type === 'hexagon') {
    var R = TS * 0.56;
    for (i = -2; i <= 2; i++) for (j = -2; j <= 2; j++) {
      if (Math.abs(i + j) > 2) continue;
      var hx = CX + Math.sqrt(3) * R * (i + j / 2), hy = CY + 1.5 * R * j;
      var hp = [];
      for (var v = 0; v < 6; v++) {
        var ang = v * Math.PI / 3 + Math.PI / 6, jr = R * (1 + (r() - 0.5) * 0.05);
        hp.push([hx + jr * Math.cos(ang), hy + jr * Math.sin(ang)]);
      }
      slots.push({ pts: hp, cx: hx, cy: hy, geo: 0, pat: (((i - j) % 6) + 6) % 6 * Math.PI / 3,
        ring: (Math.abs(i) + Math.abs(j) + Math.abs(i + j)) / 2, adj: [], filled: null });
    }
    slots.forEach(function (s, a) {
      slots.forEach(function (t, b) {
        if (a !== b) {
          var d = Math.sqrt((s.cx - t.cx) * (s.cx - t.cx) + (s.cy - t.cy) * (s.cy - t.cy));
          if (d < Math.sqrt(3) * R * 1.15) s.adj.push(b);
        }
      });
    });
  } else { // triangle: polyiamond grown on a jittered point lattice
    var s = TS * 1.02, jp = {};
    function Q(m, n) {
      var k = m + ',' + n;
      if (!jp[k]) jp[k] = [(r() - 0.5) * 0.05, (r() - 0.5) * 0.05];
      return [CX + (m + jp[k][0]) * s + (n + jp[k][1]) * s * 0.5, CY + (n + jp[k][1]) * s * 0.866];
    }
    var cand = [];
    for (i = -3; i < 3; i++) for (j = -3; j < 3; j++) {
      cand.push([Q(i, j), Q(i + 1, j), Q(i, j + 1)]);
      cand.push([Q(i + 1, j + 1), Q(i + 1, j), Q(i, j + 1)]);
    }
    cand.forEach(function (pts) {
      var c = centroid(pts);
      var d = Math.sqrt((c[0] - CX) * (c[0] - CX) + (c[1] - CY) * (c[1] - CY));
      if (d < TS * 2.35) {
        // orientation by matching the canonical template
        var tpl = TEMPLATES.triangle.pts;
        var best = 0, bestErr = 1e9;
        [0, Math.PI].forEach(function (ang) {
          var co = Math.cos(ang), si = Math.sin(ang), err = 0;
          tpl.forEach(function (tp, vi) {
            var rx = (tp[0] * co - tp[1] * si) * TS, ry = (tp[0] * si + tp[1] * co) * TS;
            var dx = c[0] + rx - pts[vi][0], dy = c[1] + ry - pts[vi][1];
            err += dx * dx + dy * dy;
          });
          if (err < bestErr) { bestErr = err; best = ang; }
        });
        slots.push({ pts: pts, cx: c[0], cy: c[1], geo: best, pat: best, ring: -1, adj: [], filled: null });
      }
    });
    slots.forEach(function (a2, ai) {
      slots.forEach(function (b2, bi) {
        if (ai === bi) return;
        var shared = 0;
        a2.pts.forEach(function (p) {
          b2.pts.forEach(function (q) {
            if (Math.abs(p[0] - q[0]) < 1 && Math.abs(p[1] - q[1]) < 1) shared++;
          });
        });
        if (shared >= 2) a2.adj.push(bi);
      });
    });
    // rings by BFS from the slot nearest the centre
    var root = 0, rd = 1e9;
    slots.forEach(function (sl, si2) {
      var d = (sl.cx - CX) * (sl.cx - CX) + (sl.cy - CY) * (sl.cy - CY);
      if (d < rd) { rd = d; root = si2; }
    });
    slots[root].ring = 0;
    var queue = [root];
    while (queue.length) {
      var cur = queue.shift();
      slots[cur].adj.forEach(function (nb) {
        if (slots[nb].ring < 0) { slots[nb].ring = slots[cur].ring + 1; queue.push(nb); }
      });
    }
    slots.forEach(function (sl, si3) { sl._old = si3; });
    slots = slots.filter(function (sl) { return sl.ring >= 0 && sl.ring <= 3; });
    var remap = {};
    slots.forEach(function (sl, si4) { remap[sl._old] = si4; });
    slots.forEach(function (sl) {
      sl.adj = sl.adj.map(function (nb) { return remap[nb]; }).filter(function (nb) { return nb !== undefined; });
      delete sl._old;
    });
  }
  // starting cluster: centre slot plus two neighbours, already placed
  var rootIdx = 0, bestD = 1e18;
  slots.forEach(function (sl, si) {
    var d = (sl.cx - CX) * (sl.cx - CX) + (sl.cy - CY) * (sl.cy - CY);
    if (d < bestD) { bestD = d; rootIdx = si; }
  });
  var starters = [rootIdx].concat(slots[rootIdx].adj.slice(0, 2));
  starters.forEach(function (si, n) {
    slots[si].filled = (n % 2 === 0) ? KRAFT : CREAM;
  });
  for (var n2 = 0; n2 < 6; n2++) spawnLoose(r);
}
function spawnLoose(r) {
  var col = (spawnN++ % 2 === 0) ? KRAFT : CREAM;
  var x = CX, y = CY, ok = false, tries = 0;
  while (!ok && tries < 200) {
    tries++;
    x = W * (0.10 + r() * 0.80); y = H * (0.10 + r() * 0.80);
    ok = true;
    var dc = Math.sqrt((x - CX) * (x - CX) + (y - CY) * (y - CY));
    if (dc < TS * 2.9) ok = false;
    loose.forEach(function (t) {
      var d = Math.sqrt((x - t.x) * (x - t.x) + (y - t.y) * (y - t.y));
      if (d < TS * 1.25) ok = false;
    });
  }
  loose.push({ x: x, y: y, rot: r() * Math.PI * 2, col: col, anim: null });
}
function isGhost(s) {
  if (s.filled) return false;
  return s.adj.some(function (nb) { return slots[nb].filled; });
}

function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  CX = W / 2; CY = H / 2;
  var newTS = Math.min(W, H) / 6.4;
  if (!slots.length) { TS = newTS; buildLayout(); }
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing ---------------------------------------------------------
function poly(pts, close) {
  ctx.beginPath();
  pts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
  if (close !== false) ctx.closePath();
}
function drawTileShape(pts, col, foldAngle, cx, cy) {
  // soft paper shadow
  ctx.fillStyle = 'rgba(138,122,92,0.20)';
  poly(pts.map(function (p) { return [p[0] + 2, p[1] + 3]; }));
  ctx.fill();
  ctx.fillStyle = col;
  poly(pts);
  ctx.fill();
  ctx.strokeStyle = 'rgba(138,122,92,0.55)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  var tpl = TEMPLATES[ORDER[envIdx]];
  var co = Math.cos(foldAngle), si = Math.sin(foldAngle);
  ctx.strokeStyle = 'rgba(138,122,92,0.5)';
  ctx.lineWidth = 1.1;
  tpl.folds.forEach(function (f) {
    ctx.beginPath();
    f.forEach(function (p, i) {
      var x = cx + (p[0] * co - p[1] * si) * TS, y = cy + (p[0] * si + p[1] * co) * TS;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  });
}
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = DESK;
  ctx.fillRect(0, 0, W, H);
  // ghosts: symmetry's suggestions, never louder than a whisper
  slots.forEach(function (s) {
    if (!isGhost(s)) return;
    ctx.strokeStyle = 'rgba(138,122,92,0.14)';
    ctx.lineWidth = 1.2;
    poly(s.pts);
    ctx.stroke();
  });
  // placed tiles
  slots.forEach(function (s) {
    if (s.filled) drawTileShape(s.pts, s.filled, s.pat, s.cx, s.cy);
  });
  // loose tiles
  loose.forEach(function (t) {
    var x = t.x, y = t.y, rot = t.rot;
    anims.forEach(function (a) {
      if (a.tile === t) {
        var k = Math.min(1, (now - a.t0) / a.dur), e = 1 - Math.pow(1 - k, 3);
        x = a.fx + (a.tx - a.fx) * e;
        y = a.fy + (a.ty - a.fy) * e;
        rot = a.fr + (a.tr - a.fr) * e;
        if (k >= 1 && a.slot) { a.slot.filled = t.col; }
      }
    });
    var tpl = TEMPLATES[ORDER[envIdx]];
    var co = Math.cos(rot), si = Math.sin(rot);
    var pts = tpl.pts.map(function (p) {
      return [x + (p[0] * co - p[1] * si) * TS, y + (p[0] * si + p[1] * co) * TS];
    });
    drawTileShape(pts, t.col, rot, x, y);
  });
  // clean up settled snap animations: remove tiles that landed
  for (var ai = anims.length - 1; ai >= 0; ai--) {
    if (now - anims[ai].t0 >= anims[ai].dur && anims[ai].slot) {
      var li = loose.indexOf(anims[ai].tile);
      if (li >= 0) loose.splice(li, 1);
      anims.splice(ai, 1);
      afterPlacement(now);
    }
  }
  // symmetry axes flash when a ring closes
  if (flashAt >= 0 && now - flashAt < 1200) {
    var fk = 1 - (now - flashAt) / 1200;
    ctx.strokeStyle = INDIGO;
    ctx.globalAlpha = 0.65 * fk;
    ctx.lineWidth = 2;
    TEMPLATES[ORDER[envIdx]].axes.forEach(function (a) {
      ctx.beginPath();
      ctx.moveTo(CX - Math.cos(a) * TS * 3.4, CY - Math.sin(a) * TS * 3.4);
      ctx.lineTo(CX + Math.cos(a) * TS * 3.4, CY + Math.sin(a) * TS * 3.4);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }
}
function afterPlacement(now) {
  // if a ring just closed completely, flash the axes
  var rings = {};
  slots.forEach(function (s) {
    if (rings[s.ring] === undefined) rings[s.ring] = true;
    if (!s.filled) rings[s.ring] = false;
  });
  Object.keys(rings).forEach(function (r) {
    if (rings[r] && !flashedRings[r] && Number(r) > 0) { flashedRings[r] = 1; flashAt = now; }
  });
  var r2 = rng((seed * 31 + spawnN * 17 + envIdx) >>> 0);
  if (slots.filter(function (s) { return !!s.filled; }).length < 60) spawnLoose(r2);
}

// ---- interaction -------------------------------------------------------
var dragT = null, grabDX = 0, grabDY = 0, downAt = 0, downX = 0, downY = 0;
var lastTapAt = -1000, lastTapX = 0, lastTapY = 0;
canvas.addEventListener('pointerdown', function (e) {
  downAt = e.timeStamp; downX = e.clientX; downY = e.clientY;
  dragT = null;
  for (var i = loose.length - 1; i >= 0; i--) {
    var t = loose[i];
    var d = Math.sqrt((e.clientX - t.x) * (e.clientX - t.x) + (e.clientY - t.y) * (e.clientY - t.y));
    if (d < TS * 0.62) { dragT = t; grabDX = e.clientX - t.x; grabDY = e.clientY - t.y; break; }
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragT) return;
  dragT.x = e.clientX - grabDX;
  dragT.y = e.clientY - grabDY;
});
function nearestAngle(from, to) {
  while (to - from > Math.PI) to -= Math.PI * 2;
  while (from - to > Math.PI) to += Math.PI * 2;
  return to;
}
canvas.addEventListener('pointerup', function (e) {
  var now = e.timeStamp;
  if (dragT) {
    var best = null, bestD = Math.max(18, TS * 0.22);
    slots.forEach(function (s) {
      if (!isGhost(s)) return;
      var d = Math.sqrt((dragT.x - s.cx) * (dragT.x - s.cx) + (dragT.y - s.cy) * (dragT.y - s.cy));
      if (d < bestD) { bestD = d; best = s; }
    });
    if (best) {
      anims.push({ tile: dragT, fx: dragT.x, fy: dragT.y, fr: dragT.rot,
        tx: best.cx, ty: best.cy, tr: nearestAngle(dragT.rot, best.geo), t0: now, dur: 170, slot: best });
    }
    dragT = null;
  }
  var moved = Math.sqrt((e.clientX - downX) * (e.clientX - downX) + (e.clientY - downY) * (e.clientY - downY));
  if (now - downAt < 300 && moved < 8) {
    if (now - lastTapAt < 350 && Math.abs(e.clientX - lastTapX) < 44 && Math.abs(e.clientY - lastTapY) < 44) {
      envIdx = (envIdx + 1) % ORDER.length;
      buildLayout();
      lastTapAt = -1000;
    } else { lastTapAt = now; lastTapX = e.clientX; lastTapY = e.clientY; }
  }
});
canvas.addEventListener('pointercancel', function () { dragT = null; });

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
