<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom</title>
<style>
html, body { margin: 0; padding: 0; background: #07080B; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: an empty concert hall prepared for a performance with no
   performers yet. Dozens of long steel strings stretch wall to wall and
   recede to a vanishing point. Very slowly the strings begin to shimmer,
   each in its own color, and the shimmer spreads until the whole hall is
   one undulating field. The bloom completes over about four minutes and
   holds. Watch only: the room tunes itself. */
var TAU = Math.PI * 2;
var GROUND = '#07080B';
var WALL_TOP = '#0B0D12';
var WALL_BOT = '#05060A';
var FLOOR_TOP = '#0A0B0F';
var FLOOR_BOT = '#040507';
var STEEL = '#5A7FA8';
var STEEL_HI = '#8FB4D4';
var GOLD = '#E8B95C';
var GOLD_HI = '#F5D489';
var SILH = '#0E0F13';
var SILH_EDGE = '#1B2230';
var ROPE = '#6E1423';
var ROPE_HI = '#8E2438';
var POST = '#15161C';
var POST_HI = '#2A2C36';
var CHAIR = '#0B0C10';
var PLATE = '#0A0B0E';
var PLATE_LINE = 'rgba(200,210,225,0.28)';
var TITLE_INK = '#EDEDE8';
var HINT_INK = '#9AA3AD';
var FRAME_T = 60.0;        /* fixed phase for frame one: 60 s into the 240 s bloom */
var BLOOM_LEN = 240.0;     /* seconds for the bloom to complete */
var STRING_COUNT = 36;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function mixHex(a, b, f) {
  var ca = hexRgb(a), cb = hexRgb(b);
  var r = Math.round(lerp(ca[0], cb[0], f));
  var g = Math.round(lerp(ca[1], cb[1], f));
  var bl = Math.round(lerp(ca[2], cb[2], f));
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- seeded strings: wall to wall, receding toward the vanishing point ---- */
var VP = { x: 0.5, y: 0.40 };
var STRINGS = [];
(function () {
  var rng = mulberry32(1852);
  var i;
  for (i = 0; i < STRING_COUNT; i++) {
    var f = i / (STRING_COUNT - 1);
    /* left and right wall anchor heights, denser near the vanishing height */
    var yL = lerp(0.06, 0.78, Math.pow(f, 1.15));
    var yR = lerp(0.78, 0.06, Math.pow(f, 1.15));
    if (i % 2 === 1) { var tmp = yL; yL = yR; yR = tmp; }
    STRINGS.push({
      yL: yL + (rng() - 0.5) * 0.02,
      yR: yR + (rng() - 0.5) * 0.02,
      sag: (rng() - 0.5) * 0.05,
      ph: rng() * TAU,              /* hue oscillation phase */
      lfo: 0.018 + rng() * 0.05,    /* slow amplitude LFO, Hz, well under 14 Hz */
      entry: i / STRING_COUNT,      /* strings enter one by one */
      w: 0.8 + rng() * 1.1          /* line width, px at unit scale */
    });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The hall fills the frame to the edges on every screen, as in No.1851. */
function fieldRect() {
  return { x: 0, y: 0, w: VW, h: VH };
}
function bloomP(t) {
  return clamp(t / BLOOM_LEN, 0, 1);
}
function drawRoom(sc, t) {
  var g = ctx.createLinearGradient(0, sc.y, 0, sc.y + sc.h);
  g.addColorStop(0, WALL_TOP);
  g.addColorStop(0.60, WALL_BOT);
  g.addColorStop(0.601, FLOOR_TOP);
  g.addColorStop(1, FLOOR_BOT);
  ctx.fillStyle = g;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  /* faint horizon line where wall meets floor */
  ctx.strokeStyle = 'rgba(200,210,225,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sc.x, sc.y + sc.h * 0.60);
  ctx.lineTo(sc.x + sc.w, sc.y + sc.h * 0.60);
  ctx.stroke();
  /* back wall glow at the vanishing point, the far end of the hall */
  var m = Math.min(sc.w, sc.h);
  var vx = sc.x + VP.x * sc.w, vy = sc.y + VP.y * sc.h;
  var p = bloomP(t);
  var rg = ctx.createRadialGradient(vx, vy, 0, vx, vy, m * (0.30 + 0.45 * p));
  rg.addColorStop(0, rgba(GOLD, 0.05 + 0.10 * p));
  rg.addColorStop(0.6, rgba(STEEL, 0.04 + 0.05 * p));
  rg.addColorStop(1, rgba(STEEL, 0));
  ctx.fillStyle = rg;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
}
function stringColor(s, t, p) {
  /* each string enters one by one, then its hue oscillates steel to gold */
  var entered = clamp(p * 2.2 - s.entry * 0.7, 0, 1);
  var osc = 0.5 + 0.5 * Math.sin(TAU * s.lfo * t + s.ph);
  var goldF = clamp(entered * (0.5 + 0.5 * osc), 0, 1);
  var col = mixHex(STEEL, GOLD, goldF);
  var alpha = 0.28 + 0.62 * entered;
  return { col: col, hi: mixHex(STEEL_HI, GOLD_HI, goldF), alpha: alpha, entered: entered, osc: osc };
}
function drawStrings(sc, t) {
  var p = bloomP(t);
  var vx = sc.x + VP.x * sc.w, vy = sc.y + VP.y * sc.h;
  var i, s, c;
  /* glow pass first, then the bright core pass */
  for (i = 0; i < STRING_COUNT; i++) {
    s = STRINGS[i];
    c = stringColor(s, t, p);
    var x0 = sc.x, y0 = sc.y + s.yL * sc.h;
    var x1 = sc.x + sc.w, y1 = sc.y + s.yR * sc.h;
    var cx = vx + (x1 - x0) * 0.0, cy = vy + s.sag * sc.h;
    ctx.strokeStyle = c.col;
    ctx.globalAlpha = c.alpha * 0.25;
    ctx.lineWidth = Math.max(1, s.w * 3.2);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(cx, cy, x1, y1);
    ctx.stroke();
  }
  for (i = 0; i < STRING_COUNT; i++) {
    s = STRINGS[i];
    c = stringColor(s, t, p);
    var x0b = sc.x, y0b = sc.y + s.yL * sc.h;
    var x1b = sc.x + sc.w, y1b = sc.y + s.yR * sc.h;
    var cxb = vx, cyb = vy + s.sag * sc.h;
    ctx.globalAlpha = c.alpha;
    ctx.strokeStyle = c.hi;
    ctx.lineWidth = Math.max(0.7, s.w);
    ctx.beginPath();
    ctx.moveTo(x0b, y0b);
    ctx.quadraticCurveTo(cxb, cyb, x1b, y1b);
    ctx.stroke();
    /* shimmer bead travelling slowly along the string */
    var bead = 0.5 + 0.5 * Math.sin(TAU * s.lfo * 0.5 * t + s.ph * 2.0);
    var bx = x0b + (x1b - x0b) * bead;
    var by = y0b + (y1b - y0b) * bead + s.sag * sc.h * 4 * bead * (1 - bead) * 0.25;
    ctx.globalAlpha = (0.35 + 0.45 * c.osc) * c.entered;
    ctx.fillStyle = c.hi;
    ctx.beginPath();
    ctx.moveTo(bx + 2.2, by);
    ctx.arc(bx, by, 2.2, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawFloorSheen(sc, t) {
  /* faint reflections of the shimmer on the floor */
  var p = bloomP(t);
  var m = Math.min(sc.w, sc.h);
  var vx = sc.x + VP.x * sc.w;
  var fy = sc.y + sc.h * 0.60;
  var i;
  for (i = 0; i < 10; i++) {
    var f = i / 9;
    var x = sc.x + sc.w * (0.08 + 0.84 * f);
    var wob = Math.sin(TAU * 0.03 * t + i * 1.7) * m * 0.004;
    var goldF = clamp(p * 1.2 - f * 0.3, 0, 1);
    ctx.strokeStyle = mixHex(STEEL, GOLD, goldF);
    ctx.globalAlpha = 0.05 + 0.10 * p;
    ctx.lineWidth = Math.max(1, m * 0.0015);
    ctx.beginPath();
    ctx.moveTo(x + wob, fy + m * 0.01);
    ctx.lineTo(vx + (x - vx) * 0.35 + wob, sc.y + sc.h * 0.98);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawChair(sc, x, y, w, h) {
  ctx.fillStyle = CHAIR;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w * 0.92, y + h);
  ctx.lineTo(x + w * 0.08, y + h);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(200,210,225,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + w * 0.08, y + 1);
  ctx.lineTo(x + w * 0.92, y + 1);
  ctx.stroke();
}
function drawRopes(sc, t) {
  var m = Math.min(sc.w, sc.h);
  var y = sc.y + sc.h * 0.78;
  var posts = [0.10, 0.50, 0.90];
  var i;
  /* rope sags between posts */
  for (i = 0; i < posts.length - 1; i++) {
    var x0 = sc.x + posts[i] * sc.w, x1 = sc.x + posts[i + 1] * sc.w;
    var sag = m * 0.045;
    ctx.strokeStyle = ROPE;
    ctx.lineWidth = Math.max(2, m * 0.006);
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.quadraticCurveTo((x0 + x1) / 2, y + sag, x1, y);
    ctx.stroke();
    ctx.strokeStyle = ROPE_HI;
    ctx.lineWidth = Math.max(1, m * 0.002);
    ctx.beginPath();
    ctx.moveTo(x0, y - 1);
    ctx.quadraticCurveTo((x0 + x1) / 2, y + sag - 1, x1, y - 1);
    ctx.stroke();
  }
  /* posts with ball tops */
  for (i = 0; i < posts.length; i++) {
    var px = sc.x + posts[i] * sc.w;
    var ph = m * 0.10;
    ctx.fillStyle = POST;
    ctx.fillRect(px - m * 0.004, y - ph, m * 0.008, ph);
    ctx.fillStyle = POST_HI;
    ctx.beginPath();
    ctx.moveTo(px + m * 0.012, y - ph);
    ctx.arc(px, y - ph, m * 0.012, 0, TAU);
    ctx.fill();
    ctx.fillStyle = POST;
    ctx.beginPath();
    ctx.moveTo(px + m * 0.03, y);
    ctx.ellipse(px, y + m * 0.004, m * 0.03, m * 0.006, 0, 0, TAU);
    ctx.fill();
  }
}
function drawGuitar(sc, t) {
  var m = Math.min(sc.w, sc.h);
  var cx = sc.x + sc.w * 0.20, cy = sc.y + sc.h * 0.79;
  var s = m * 0.068;   /* body radius scale */
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.28);
  /* stand tripod */
  ctx.strokeStyle = SILH_EDGE;
  ctx.lineWidth = Math.max(1.5, m * 0.003);
  ctx.beginPath();
  ctx.moveTo(0, s * 0.9);
  ctx.lineTo(-s * 0.55, s * 1.75);
  ctx.moveTo(0, s * 0.9);
  ctx.lineTo(s * 0.55, s * 1.75);
  ctx.moveTo(0, s * 0.9);
  ctx.lineTo(0, s * 1.75);
  ctx.stroke();
  /* neck and headstock */
  ctx.fillStyle = SILH;
  ctx.fillRect(-s * 0.07, -s * 2.35, s * 0.14, s * 1.6);
  ctx.beginPath();
  ctx.moveTo(-s * 0.10, -s * 2.35);
  ctx.lineTo(s * 0.10, -s * 2.35);
  ctx.lineTo(s * 0.16, -s * 2.75);
  ctx.lineTo(-s * 0.16, -s * 2.75);
  ctx.closePath();
  ctx.fill();
  /* body: two lobes */
  ctx.beginPath();
  ctx.moveTo(s * 0.95, -s * 0.55);
  ctx.ellipse(0, -s * 0.35, s * 0.95, s * 0.72, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.78, s * 0.55);
  ctx.ellipse(0, s * 0.55, s * 0.78, s * 0.62, 0, 0, TAU);
  ctx.fill();
  /* faint steel rim light on the body edge */
  ctx.strokeStyle = rgba(STEEL_HI, 0.35);
  ctx.lineWidth = Math.max(1, m * 0.002);
  ctx.beginPath();
  ctx.moveTo(-s * 0.85, -s * 0.75);
  ctx.ellipse(0, -s * 0.35, s * 0.95, s * 0.72, 0, Math.PI * 0.85, Math.PI * 1.45);
  ctx.stroke();
  /* sound hole and strings hint */
  ctx.fillStyle = '#05060A';
  ctx.beginPath();
  ctx.moveTo(s * 0.22, -s * 0.30);
  ctx.arc(0, -s * 0.30, s * 0.22, 0, TAU);
  ctx.fill();
  ctx.restore();
}
function drawLaptop(sc, t) {
  var m = Math.min(sc.w, sc.h);
  var cx = sc.x + sc.w * 0.76, cy = sc.y + sc.h * 0.90;
  var w = m * 0.13, h = m * 0.085;
  /* screen, tilted slightly open, faint glow of a dark display */
  ctx.save();
  ctx.translate(cx, cy - h);
  ctx.rotate(-0.06);
  ctx.fillStyle = SILH;
  ctx.fillRect(-w / 2, -h, w, h);
  ctx.fillStyle = '#101623';
  ctx.fillRect(-w / 2 + 2, -h + 2, w - 4, h - 4);
  ctx.strokeStyle = rgba(STEEL_HI, 0.25);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-w / 2 + 3, -h + h * 0.35);
  ctx.lineTo(w / 2 - 3, -h + h * 0.35);
  ctx.moveTo(-w / 2 + 3, -h + h * 0.60);
  ctx.lineTo(w / 2 - 3, -h + h * 0.60);
  ctx.stroke();
  ctx.restore();
  /* base */
  ctx.fillStyle = SILH;
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.58, cy);
  ctx.lineTo(cx + w * 0.58, cy);
  ctx.lineTo(cx + w * 0.52, cy + m * 0.008);
  ctx.lineTo(cx - w * 0.52, cy + m * 0.008);
  ctx.closePath();
  ctx.fill();
}
function drawPA(sc, t) {
  var m = Math.min(sc.w, sc.h);
  var x = sc.x + sc.w * 0.93, y = sc.y + sc.h * 0.60;
  var w = m * 0.075, h = m * 0.30;
  ctx.fillStyle = SILH;
  ctx.fillRect(x - w / 2, y, w, h);
  ctx.strokeStyle = SILH_EDGE;
  ctx.lineWidth = 1;
  ctx.strokeRect(x - w / 2 + 0.5, y + 0.5, w - 1, h - 1);
  /* speaker cones */
  var i;
  for (i = 0; i < 3; i++) {
    var cy = y + h * (0.18 + i * 0.28);
    var r = w * (i === 2 ? 0.30 : 0.22);
    ctx.fillStyle = '#05060A';
    ctx.beginPath();
    ctx.moveTo(x + r, cy);
    ctx.arc(x, cy, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(200,210,225,0.14)';
    ctx.beginPath();
    ctx.moveTo(x + r, cy);
    ctx.arc(x, cy, r, 0, TAU);
    ctx.stroke();
  }
}
function drawBloomWash(sc, t) {
  /* as the bloom completes, background and foreground become one field */
  var p = bloomP(t);
  if (p <= 0.01) return;
  var m = Math.min(sc.w, sc.h);
  var vx = sc.x + VP.x * sc.w, vy = sc.y + VP.y * sc.h;
  var rg = ctx.createRadialGradient(vx, vy, 0, vx, vy, m * (0.55 + 0.55 * p));
  rg.addColorStop(0, rgba(GOLD, 0.16 * p));
  rg.addColorStop(0.7, rgba(STEEL, 0.04 * p));
  rg.addColorStop(1, rgba(GOLD, 0));
  ctx.fillStyle = rg;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Bloom').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Bloom').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 06').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Bloom', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 06', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawRoom(sc, t);
  drawStrings(sc, t);
  drawFloorSheen(sc, t);
  /* empty audience chairs, dim witnesses in the middle ground */
  var m = Math.min(sc.w, sc.h);
  drawChair(sc, sc.x + sc.w * 0.30, sc.y + sc.h * 0.665, m * 0.045, m * 0.030);
  drawChair(sc, sc.x + sc.w * 0.40, sc.y + sc.h * 0.665, m * 0.045, m * 0.030);
  drawChair(sc, sc.x + sc.w * 0.60, sc.y + sc.h * 0.665, m * 0.045, m * 0.030);
  drawChair(sc, sc.x + sc.w * 0.70, sc.y + sc.h * 0.665, m * 0.045, m * 0.030);
  drawRopes(sc, t);
  drawGuitar(sc, t);
  drawLaptop(sc, t);
  drawPA(sc, t);
  drawBloomWash(sc, t);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    stringCount: STRING_COUNT,
    bloomAt: function (t) { return bloomP(t); }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, bloom one quarter in, strings shimmering ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
