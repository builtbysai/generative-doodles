<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Why Make a Broken Thing</title>
<style>
  html, body { margin:0; padding:0; background:#FAFAFA; overflow:hidden; height:100%; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

// ---------- deterministic hash ----------
function hash(n){
  n = Math.imul(n ^ (n >>> 16), 2246822519);
  n = Math.imul(n ^ (n >>> 13), 3266489917);
  n = n ^ (n >>> 16);
  return (n >>> 0) / 4294967296;
}

// ---------- constants ----------
var FIELD = '#FAFAFA';
var GRIDLINE = '#E5E5EA';
var SQUARE = '#8E8E93';
var SMEAR = '#1B4FD8';    // shear smear blue
var MAGENTA = '#FF2B8D';  // fringe bloom
var CYAN = '#00E5FF';     // fray edge
var ROT = '#0B0B0D';      // rot black
var STRIP = '#101012';    // tally strip, near-black
var CHALK = '#EDEDED';
var T0 = 0;               // fixed first-frame phase: pristine, waiting
var SETTLE = 1.2;         // seconds for a break to settle
var MAXBREAKS = 12;       // breaks per lesson
var PAUSE = 4;            // seconds the congratulation holds before reset
var FLASH = 0.034;        // the one-frame white flash at the seam
var TYPES = ['shear', 'fringe', 'fray', 'rot']; // deterministic lesson order

// ---------- lesson state (event record: the drags are the piece) ----------
var lesson = 0;           // cycle counter
var breaks = [];          // current lesson: {cell, type, t, k}
var flashT = -Infinity;   // piece time of the last reset flash

// ---------- canvas / viewport ----------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

function viewportSize(){
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  var w = vv ? vv.width : (window.innerWidth || 1280);
  var h = vv ? vv.height : (window.innerHeight || 800);
  return { w: w, h: h };
}
function fit(){
  var s = viewportSize();
  W = s.w; H = s.h;
  DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
}
if (typeof window !== 'undefined'){
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', fit);
  if (window.addEventListener) window.addEventListener('resize', fit);
}
fit();

function isPhone(){
  var sw = 9999, sh = 9999;
  if (typeof window !== 'undefined' && window.screen){ sw = window.screen.width; sh = window.screen.height; }
  if (Math.min(sw, sh) < 700) return true;
  return H > W * 1.15;
}

// ---------- layout ----------
// Field occupies the top 92%; the tally strip takes the bottom 8%.
// The 6x6 grid sits inside 8% margins of the field region.
function layout(){
  var stripH = H * 0.08;
  var fieldH = H - stripH;
  var side = Math.min(W, fieldH) * 0.84;
  var gx = (W - side) / 2, gy = (fieldH - side) / 2;
  var cell = side / 6;
  var gap = cell * 0.18;
  return { gx: gx, gy: gy, side: side, cell: cell, gap: gap, sq: cell - gap,
           stripY: fieldH, stripH: stripH, phone: isPhone() };
}
function cellRect(L, idx){
  var cx = idx % 6, cy = (idx / 6) | 0;
  return { x: L.gx + cx * L.cell + L.gap / 2, y: L.gy + cy * L.cell + L.gap / 2, s: L.sq,
           cx: L.gx + cx * L.cell + L.cell / 2, cy: L.gy + cy * L.cell + L.cell / 2 };
}
function rr(x, y, s, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + s, y, x + s, y + s, r);
  ctx.arcTo(x + s, y + s, x, y + s, r);
  ctx.arcTo(x, y + s, x, y, r);
  ctx.arcTo(x, y, x + s, y, r);
  ctx.closePath();
}
function easeOut(p){ return 1 - Math.pow(1 - p, 3); }

// ---------- the four breaks: pure functions of (cell, break, age) ----------
function drawShear(R, b, p){
  var s = R.s, rad = s * 0.16;
  var sign = hash(b.cell * 31 + b.k * 7 + lesson * 101) < 0.5 ? -1 : 1;
  var full = Math.max(8, Math.min(18, 18 * (s / 76)));
  var dx = sign * full * easeOut(p);
  // blue smear trail: three ghost copies at descending alpha behind the square
  var alphas = [0.28, 0.18, 0.10];
  ctx.fillStyle = SMEAR;
  for (var g = 1; g <= 3; g++){
    ctx.globalAlpha = alphas[g - 1] * p;
    rr(R.x + dx * (1 - g * 0.28), R.y, s, rad); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = SQUARE;
  rr(R.x + dx, R.y, s, rad); ctx.fill();
}
function drawFringe(R, b, p){
  var s = R.s, rad = s * 0.16;
  ctx.fillStyle = SQUARE;
  rr(R.x, R.y, s, rad); ctx.fill();
  // magenta fringe doubles blooming off the left and right borders
  var off = 3 * p;
  ctx.strokeStyle = MAGENTA;
  ctx.lineWidth = Math.max(1.5, s * 0.035);
  ctx.globalAlpha = 0.85 * p;
  rr(R.x - off, R.y, s, rad); ctx.stroke();
  rr(R.x + off, R.y, s, rad); ctx.stroke();
  ctx.globalAlpha = 1;
  // cyan inner edge
  var inset = Math.max(3, s * 0.055);
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = Math.max(1, s * 0.022);
  ctx.globalAlpha = 0.9 * p;
  rr(R.x + inset, R.y + inset, s - inset * 2, Math.max(1, rad - inset)); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawFray(R, b, p){
  var s = R.s, rad = s * 0.16;
  ctx.fillStyle = SQUARE;
  rr(R.x, R.y, s, rad); ctx.fill();
  var corner = Math.floor(hash(b.cell * 57 + b.k * 13 + lesson * 211) * 4); // 0 TL, 1 TR, 2 BL, 3 BR
  var d = s * 0.45 * p; // scanlines spread ~40%+ across the cell from the corner
  if (d <= 0) return;
  var rx = (corner === 1 || corner === 3) ? R.x + s - d : R.x;
  var ry = (corner >= 2) ? R.y + s - d : R.y;
  ctx.save();
  rr(R.x, R.y, s, rad); ctx.clip();
  // alternating rot-black scanline bars eating the corner
  var bar = Math.max(2, s * 0.05);
  ctx.fillStyle = ROT;
  for (var yy = ry; yy < ry + d; yy += bar * 2) ctx.fillRect(rx - 1, yy, d + 2, bar);
  // cyan front edge where the fray is advancing
  ctx.fillStyle = CYAN;
  ctx.globalAlpha = 0.9;
  if (corner === 1 || corner === 3) ctx.fillRect(rx, ry - 1, Math.max(1.5, s * 0.03), d + 2);
  else ctx.fillRect(rx + d - Math.max(1.5, s * 0.03), ry - 1, Math.max(1.5, s * 0.03), d + 2);
  ctx.globalAlpha = 1;
  ctx.restore();
}
function drawRot(R, b, p){
  var s = R.s, rad = s * 0.16;
  ctx.fillStyle = SQUARE;
  rr(R.x, R.y, s, rad); ctx.fill();
  if (p <= 0) return;
  var corner = Math.floor(hash(b.cell * 91 + b.k * 17 + lesson * 307) * 4); // 0 TL, 1 TR, 2 BL, 3 BR
  var cov = Math.floor(p * 5) / 5; // staged coverage: the rot advances in five held steps
  if (p >= 1) cov = 1;
  var w = s * cov, h = s * cov;
  var rx = (corner === 1 || corner === 3) ? R.x + s - w : R.x;
  var ry = (corner >= 2) ? R.y + s - h : R.y;
  ctx.save();
  rr(R.x, R.y, s, rad); ctx.clip();
  ctx.fillStyle = ROT;
  ctx.fillRect(rx - 1, ry - 1, w + 2, h + 2);
  // a few static flecks stranded in the rot
  if (cov > 0){
    for (var f = 0; f < 6; f++){
      var u = hash(b.cell * 131 + f * 41 + b.k), v = hash(b.cell * 173 + f * 29 + b.k);
      var fx = (corner === 1 || corner === 3) ? R.x + s - u * w : R.x + u * w;
      var fy = (corner >= 2) ? R.y + s - v * h : R.y + v * h;
      ctx.fillStyle = (f % 3 === 0) ? MAGENTA : SQUARE;
      ctx.globalAlpha = 0.75;
      var fs = Math.max(1.5, s * 0.05);
      ctx.fillRect(fx - fs / 2, fy - fs / 2, fs, fs);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawBroken(R, b, t){
  var age = t - b.t;
  var p = age <= 0 ? 0 : Math.min(1, age / SETTLE);
  if (b.type === 'shear') drawShear(R, b, p);
  else if (b.type === 'fringe') drawFringe(R, b, p);
  else if (b.type === 'fray') drawFray(R, b, p);
  else drawRot(R, b, p);
}

// ---------- chalk text (deterministic per-character jitter) ----------
function drawChalk(text, x, baseY, size, alpha, seedKey){
  ctx.font = size + 'px "Courier New", monospace';
  ctx.fillStyle = CHALK;
  ctx.textBaseline = 'middle';
  var adv = ctx.measureText('M').width;
  for (var i = 0; i < text.length; i++){
    var jy = (hash(seedKey * 977 + i * 131) - 0.5) * size * 0.09;
    ctx.globalAlpha = alpha * (0.82 + 0.18 * hash(seedKey * 613 + i * 57));
    ctx.fillText(text.charAt(i), x + i * adv, baseY + jy);
  }
  ctx.globalAlpha = 1;
}

// ---------- main draw ----------
function draw(t){
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // lesson complete: hold the congratulation, then flash and reset to clean
  if (breaks.length >= MAXBREAKS && t - breaks[MAXBREAKS - 1].t >= PAUSE){
    lesson++;
    breaks = [];
    flashT = t;
  }

  // the one-frame white flash at the seam
  if (t - flashT >= 0 && t - flashT < FLASH){
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, W, H);
    return;
  }

  var L = layout();
  var i;

  ctx.fillStyle = FIELD;
  ctx.fillRect(0, 0, W, H);

  // precise grid lines
  ctx.strokeStyle = GRIDLINE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (i = 0; i <= 6; i++){
    var lx = L.gx + i * L.cell, ly = L.gy + i * L.cell;
    ctx.moveTo(lx, L.gy); ctx.lineTo(lx, L.gy + L.side);
    ctx.moveTo(L.gx, ly); ctx.lineTo(L.gx + L.side, ly);
  }
  ctx.stroke();

  // cells: clean or broken (breaks indexed by cell for lookup)
  var byCell = {};
  for (i = 0; i < breaks.length; i++) byCell[breaks[i].cell] = breaks[i];
  for (i = 0; i < 36; i++){
    var R = cellRect(L, i);
    if (byCell[i]) drawBroken(R, byCell[i], t);
    else { ctx.fillStyle = SQUARE; rr(R.x, R.y, R.s, R.s * 0.16); ctx.fill(); }
  }

  // tally strip: chalk on near-black, bottom 8%
  ctx.fillStyle = STRIP;
  ctx.fillRect(0, L.stripY, W, L.stripH);
  var size = Math.max(12, L.stripH * 0.36);
  var midY = L.stripY + L.stripH / 2;
  var msg, key;
  if (breaks.length === 0){ msg = 'why make a broken thing.'; key = 1; }
  else if (breaks.length < MAXBREAKS){ msg = 'things broken: ' + breaks.length + '.'; key = 2; }
  else { msg = 'good. again?'; key = 3; }
  // shrink the chalk line on narrow screens so it never reaches the lesson tag
  ctx.font = size + 'px "Courier New", monospace';
  var adv0 = ctx.measureText('M').width;
  size = Math.min(size, size * (W * 0.62) / (adv0 * msg.length));
  drawChalk(msg, W * 0.04, midY, size, 0.95, key + lesson * 10);
  // lesson marker, right end, dimmer
  var tag = 'lesson ' + (lesson + 1);
  ctx.font = (size * 0.72) + 'px "Courier New", monospace';
  var tw = ctx.measureText(tag).width;
  drawChalk(tag, W - W * 0.04 - tw, midY, size * 0.72, 0.5, 9 + lesson * 10);
}

// ---------- time: fixed-phase first frame, rAF anchored at T0 + elapsed ----------
var startStamp = null;
function frame(now){
  if (startStamp === null) startStamp = now;
  draw(T0 + (now - startStamp) / 1000);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
draw(T0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

function nowT(){
  return T0 + (performance.now() - (startStamp === null ? performance.now() : startStamp)) / 1000;
}

// ---------- pointer: drag to break (one deliberate break per drag) ----------
var downPos = null;
function pointerPos(e){
  var r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function attemptBreak(mx, my, t){
  if (breaks.length >= MAXBREAKS) return;       // lesson over; the reset is coming
  if (t - flashT >= 0 && t - flashT < FLASH) return;
  var L = layout();
  if (mx < L.gx || mx > L.gx + L.side || my < L.gy || my > L.gy + L.side) return; // missed the grid
  var taken = {};
  for (var i = 0; i < breaks.length; i++) taken[breaks[i].cell] = true;
  var best = -1, bestD = Infinity;
  for (i = 0; i < 36; i++){
    if (taken[i]) continue;                      // a cell never breaks twice in a lesson
    var R = cellRect(L, i);
    var dx = R.cx - mx, dy = R.cy - my, d = dx * dx + dy * dy;
    if (d < bestD){ bestD = d; best = i; }
  }
  if (best < 0) return;
  var k = breaks.length;
  breaks.push({ cell: best, type: TYPES[k % 4], t: t, k: k });
}
if (canvas.addEventListener){
  canvas.addEventListener('pointerdown', function(e){
    downPos = pointerPos(e);
    if (canvas.setPointerCapture && e.pointerId !== undefined){ try { canvas.setPointerCapture(e.pointerId); } catch (err){} }
  });
  canvas.addEventListener('pointerup', function(e){
    if (!downPos) return;
    var up = pointerPos(e);
    var dx = up.x - downPos.x, dy = up.y - downPos.y;
    var mx = (up.x + downPos.x) / 2, my = (up.y + downPos.y) / 2;
    downPos = null;
    if (dx * dx + dy * dy < 24 * 24) return;     // a press is not a drag; the lesson is deliberate
    attemptBreak(mx, my, nowT());
  });
  canvas.addEventListener('pointercancel', function(){ downPos = null; });
}
})();
</script>
</body>
</html>
