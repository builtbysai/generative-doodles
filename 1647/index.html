<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Caustics</title>
<style>
html, body { margin: 0; padding: 0; background: #b7dfe8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var WATER = '#b7dfe8';
var WATER_DEEP = '#8ec6d4';
var BELL = '#1d4e5e';
var BELL_DARK = '#123845';
var INK = '#14424f';
var PLATE = '#f4fbff';
var CYAN = '#00b7d4';
var MAGENTA = '#e83e8c';
var YELLOW = '#ffd400';
var BLACK = '#141414';
/* Light bends through moving forms under pale water, and the water
   itself computes the pattern. Frame one is at t = 6 s: the bells
   are spread, the caustic web is developed. */
var PHASE = 6;
var N_SOURCES = 4, N_BELLS = 6;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function lerp(a, b, f) { return a + (b - a) * f; }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var WATER_RGB = hexRgb(WATER);
var BELL_RGB = hexRgb(BELL);
var INK_RGB = hexRgb(INK);
var CYAN_RGB = hexRgb(CYAN);
var MAGENTA_RGB = hexRgb(MAGENTA);
var YELLOW_RGB = hexRgb(YELLOW);
var WHITE_RGB = [255, 255, 255];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* ---- seeded field actors: moving wave sources and drifting bells ---- */
var sources = [], bells = [];
(function buildActors() {
  var rng = mulberry32(1647001), i;
  for (i = 0; i < N_SOURCES; i++) {
    sources.push({
      bx: 0.2 + rng() * 0.6, by: 0.2 + rng() * 0.6,
      ox: 0.10 + rng() * 0.18, oy: 0.08 + rng() * 0.16,
      s1: 0.05 + rng() * 0.05, s2: 0.04 + rng() * 0.05,
      p1: rng() * TAU, p2: rng() * TAU,
      amp: 0.45 + rng() * 0.25, k: 0.030 + rng() * 0.020,
      w: 0.9 + rng() * 0.7, ph: rng() * TAU
    });
  }
  for (i = 0; i < N_BELLS; i++) {
    bells.push({
      bx: 0.12 + rng() * 0.76, by: 0.12 + rng() * 0.76,
      ox: 0.06 + rng() * 0.12, oy: 0.05 + rng() * 0.10,
      s1: 0.030 + rng() * 0.035, s2: 0.025 + rng() * 0.030,
      p1: rng() * TAU, p2: rng() * TAU,
      r: (i === 0 ? 0.10 : 0.045 + rng() * 0.045),
      amp: 0.9 + rng() * 0.5, ph: rng() * TAU
    });
  }
})();
function sourcePos(s, t) {
  return {
    x: (s.bx + s.ox * Math.sin(s.s1 * t + s.p1)) * VW,
    y: (s.by + s.oy * Math.cos(s.s2 * t + s.p2)) * VH
  };
}
function bellPos(b, t) {
  var r = b.r * Math.min(VW, VH) * (1 + 0.12 * Math.sin(t * 0.5 + b.ph));
  return {
    x: (b.bx + b.ox * Math.sin(b.s1 * t + b.p1)) * VW,
    y: (b.by + b.oy * Math.cos(b.s2 * t + b.p2)) * VH,
    r: r
  };
}
/* ---- closed-form wave field on a coarse grid ----
   h = sum of moving point-source waves minus bell occluder bumps.
   Caustic intensity is the gradient magnitude of h. */
var grid = { cs: 14, nx: 0, ny: 0, h: [], g: [] };
function computeField(t) {
  var cs = isPhone ? 16 : 14;
  grid.cs = cs;
  var nx = Math.ceil(VW / cs) + 2, ny = Math.ceil(VH / cs) + 2;
  grid.nx = nx; grid.ny = ny;
  var h = new Array(nx * ny), i, j, x, y, s, b, sp, bp, dx, dy, d, v;
  for (j = 0; j < ny; j++) {
    y = (j - 1) * cs + cs / 2;
    for (i = 0; i < nx; i++) {
      x = (i - 1) * cs + cs / 2;
      v = 0;
      for (s = 0; s < sources.length; s++) {
        sp = sourcePos(sources[s], t);
        dx = x - sp.x; dy = y - sp.y;
        d = Math.sqrt(dx * dx + dy * dy);
        v += sources[s].amp * Math.sin(sources[s].k * d - sources[s].w * t + sources[s].ph);
      }
      for (b = 0; b < bells.length; b++) {
        bp = bellPos(bells[b], t);
        dx = x - bp.x; dy = y - bp.y;
        d = dx * dx + dy * dy;
        v -= bells[b].amp * Math.exp(-d / (2 * bp.r * bp.r * 0.64));
      }
      h[j * nx + i] = v;
    }
  }
  grid.h = h;
  /* Gradient magnitude, normalized so the web threshold lands mid-range. */
  var g = new Array(nx * ny), gx, gy;
  for (j = 0; j < ny; j++) {
    for (i = 0; i < nx; i++) {
      gx = h[j * nx + Math.min(i + 1, nx - 1)] - h[j * nx + Math.max(i - 1, 0)];
      gy = h[Math.min(j + 1, ny - 1) * nx + i] - h[Math.max(j - 1, 0) * nx + i];
      g[j * nx + i] = Math.sqrt(gx * gx + gy * gy) / (2 * cs);
    }
  }
  grid.g = g;
}
function fieldAt(px, py) {
  var i = clamp(Math.floor(px / grid.cs) + 1, 0, grid.nx - 1);
  var j = clamp(Math.floor(py / grid.cs) + 1, 0, grid.ny - 1);
  return grid.g[j * grid.nx + i];
}
function drawDisc(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
}
function drawEllipse(cx, cy, rx, ry) {
  ctx.beginPath();
  ctx.moveTo(cx + rx, cy);
  ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU);
}
function drawWeb(t) {
  var cs = grid.cs, nx = grid.nx, ny = grid.ny;
  var i, j, idx, I, gx, gy, ang, px, py, L, a, nxp, nyp, ox, oy;
  ctx.lineWidth = 1.2;
  for (j = 0; j < ny; j++) {
    py = (j - 1) * cs + cs / 2;
    for (i = 0; i < nx; i++) {
      idx = j * nx + i;
      I = grid.g[idx];
      if (I < 0.030) continue;
      a = smooth((I - 0.030) / 0.055) * 0.85;
      if (a <= 0.02) continue;
      gx = grid.h[j * nx + Math.min(i + 1, nx - 1)] - grid.h[j * nx + Math.max(i - 1, 0)];
      gy = grid.h[Math.min(j + 1, ny - 1) * nx + i] - grid.h[Math.max(j - 1, 0) * nx + i];
      ang = Math.atan2(gy, gx) + Math.PI / 2;
      px = (i - 1) * cs + cs / 2;
      L = cs * 0.62;
      nxp = Math.cos(ang); nyp = Math.sin(ang);
      ox = -nyp; oy = nxp;
      /* Spectral fringing: cyan and magenta edges, white core. */
      ctx.strokeStyle = rgba(CYAN_RGB, 0.45 * a);
      ctx.beginPath();
      ctx.moveTo(px - nxp * L - ox * 1.6, py - nyp * L - oy * 1.6);
      ctx.lineTo(px + nxp * L - ox * 1.6, py + nyp * L - oy * 1.6);
      ctx.stroke();
      ctx.strokeStyle = rgba(MAGENTA_RGB, 0.45 * a);
      ctx.beginPath();
      ctx.moveTo(px - nxp * L + ox * 1.6, py - nyp * L + oy * 1.6);
      ctx.lineTo(px + nxp * L + ox * 1.6, py + nyp * L + oy * 1.6);
      ctx.stroke();
      ctx.strokeStyle = rgba(WHITE_RGB, a);
      ctx.beginPath();
      ctx.moveTo(px - nxp * L, py - nyp * L);
      ctx.lineTo(px + nxp * L, py + nyp * L);
      ctx.stroke();
    }
  }
}
function drawBells(t) {
  var b, bp, i, sx, sy, sway;
  for (b = 0; b < bells.length; b++) {
    bp = bellPos(bells[b], t);
    /* Bell dome: dark translucent, pulsing. */
    ctx.fillStyle = rgba(BELL_RGB, 0.34);
    drawEllipse(bp.x, bp.y, bp.r, bp.r * 0.82);
    ctx.fill();
    ctx.strokeStyle = rgba(BELL_RGB, 0.5);
    ctx.lineWidth = 1.2;
    drawEllipse(bp.x, bp.y, bp.r, bp.r * 0.82);
    ctx.stroke();
    ctx.fillStyle = rgba(BELL_RGB, 0.22);
    drawEllipse(bp.x, bp.y - bp.r * 0.18, bp.r * 0.55, bp.r * 0.42);
    ctx.fill();
    /* Skirt: five trailing threads swaying with the bell. */
    ctx.strokeStyle = rgba(BELL_RGB, 0.35);
    ctx.lineWidth = 1;
    for (i = 0; i < 5; i++) {
      sx = bp.x + (i - 2) * bp.r * 0.32;
      sy = bp.y + bp.r * 0.72;
      sway = Math.sin(t * 0.8 + bells[b].ph + i * 0.9) * bp.r * 0.22;
      ctx.beginPath();
      ctx.moveTo(sx, sy - bp.r * 0.1);
      ctx.quadraticCurveTo(sx + sway * 0.4, sy + bp.r * 0.28, sx + sway, sy + bp.r * 0.55);
      ctx.stroke();
    }
  }
}
function drawWater(t) {
  ctx.fillStyle = WATER;
  ctx.fillRect(0, 0, VW, VH);
  /* Soft light pools under each wave source. */
  var s, sp;
  for (s = 0; s < sources.length; s++) {
    sp = sourcePos(sources[s], t);
    ctx.fillStyle = rgba(WHITE_RGB, 0.10);
    drawDisc(sp.x, sp.y, Math.min(VW, VH) * 0.16);
    ctx.fill();
  }
  drawWeb(t);
  drawBells(t);
}
/* ---- collage mode: the SAME field, quantized into coarse blocks ---- */
function blockHash(i, j) {
  var v = Math.sin(i * 127.1 + j * 311.7) * 43758.5453;
  return v - Math.floor(v);
}
function drawCollage(t) {
  var bs = 24, i, j, px, py, I, dither, col, dotCol, dotR, b0, dx, dy;
  var cols = Math.ceil(VW / bs), rows = Math.ceil(VH / bs);
  b0 = bellPos(bells[0], t);
  ctx.fillStyle = PLATE;
  ctx.fillRect(0, 0, VW, VH);
  for (j = 0; j < rows; j++) {
    py = j * bs;
    for (i = 0; i < cols; i++) {
      px = i * bs;
      I = fieldAt(px + bs / 2, py + bs / 2);
      dither = (blockHash(i, j) - 0.5) * 0.06;
      I = clamp(I + dither, 0, 1);
      dx = px + bs / 2 - b0.x; dy = py + bs / 2 - b0.y;
      if (dx * dx + dy * dy < b0.r * b0.r * 1.35) {
        col = YELLOW_RGB; dotCol = BLACK; dotR = bs * 0.16;
      } else if (I >= 0.058) {
        col = YELLOW_RGB; dotCol = BLACK; dotR = bs * (0.10 + 0.30 * clamp((I - 0.058) / 0.05, 0, 1));
      } else if (I >= 0.042) {
        col = MAGENTA_RGB; dotCol = CYAN_RGB; dotR = bs * (0.12 + 0.28 * clamp((I - 0.042) / 0.016, 0, 1));
      } else if (I >= 0.028) {
        col = CYAN_RGB; dotCol = MAGENTA_RGB; dotR = bs * (0.12 + 0.28 * clamp((I - 0.028) / 0.014, 0, 1));
      } else if (I >= 0.016) {
        col = [235, 245, 248]; dotCol = [20, 20, 20]; dotR = bs * (0.08 + 0.22 * clamp((I - 0.016) / 0.012, 0, 1));
      } else {
        col = [20, 20, 20]; dotCol = WHITE_RGB; dotR = bs * 0.07;
      }
      ctx.fillStyle = 'rgb(' + col[0] + ',' + col[1] + ',' + col[2] + ')';
      ctx.fillRect(px, py, bs, bs);
      ctx.fillStyle = Array.isArray(dotCol) ? 'rgb(' + dotCol[0] + ',' + dotCol[1] + ',' + dotCol[2] + ')' : dotCol;
      drawDisc(px + bs / 2, py + bs / 2, dotR);
      ctx.fill();
    }
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Living Caustics').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Living Caustics').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 16').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Living Caustics', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.8);
  ctx.fillText('2006 · 07 · 16', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Hold to read the same water as collage.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(INK_RGB, 0.9);
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
/* ---- hold interaction: pointerdown pulls to collage, release returns ---- */
var holding = false, blend = 0, blendTarget = 0;
function onPointerDown(e) {
  holding = true; blendTarget = 1;
  if (e && e.preventDefault) e.preventDefault();
}
function onPointerUp(e) {
  holding = false; blendTarget = 0;
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('pointerleave', onPointerUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
var prevT = PHASE;
function draw(t) {
  size();
  var dt = clamp(t - prevT, 0, 0.1);
  prevT = t;
  if (blendTarget > blend) blend = Math.min(1, blend + dt / 0.5);
  else if (blendTarget < blend) blend = Math.max(0, blend - dt / 0.5);
  computeField(t);
  drawWater(t);
  if (blend > 0.001) {
    ctx.save();
    ctx.globalAlpha = blend;
    drawCollage(t);
    ctx.restore();
  }
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    setHold: function (h) { holding = h; blendTarget = h ? 1 : 0; },
    blend: function () { return blend; },
    fieldMax: function () {
      var m = 0, i; for (i = 0; i < grid.g.length; i++) if (grid.g[i] > m) m = grid.g[i];
      return m;
    }
  };
}
/* ---- frame one: fixed phase, fixed seeds, no wall clock ---- */
size();
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
