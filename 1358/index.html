<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Champion</title>
<style>
html,body{margin:0;padding:0;background:#cfc8b8;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#cfc8b8', BONE = '#d9d2c2', FELT = '#8f8b82', RUST = '#7a4a32', GRASS = '#5a6b3f';
var GRASS_SHADES = ['#5a6b3f','#4e5f36','#67794a'];
var W = 0, H = 0, U = 0, isPhone = false;

function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function viewportSize(){
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width){
    return [window.visualViewport.width, window.visualViewport.height];
  }
  if (typeof window !== 'undefined' && window.innerWidth){ return [window.innerWidth, window.innerHeight]; }
  return [1280, 900];
}
function detectPhone(){
  try {
    if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height){
      return Math.min(window.screen.width, window.screen.height) < 700;
    }
  } catch (e) {}
  return H > W * 1.15;
}

// ---- grass (seeded, regenerated per size) ----
var blades = [];
function buildGrass(){
  blades = [];
  var maxReach = 0.34 * U;
  var rng2 = mulberry32(1358000);
  function mk(x, y, dx, dy){
    return { x: x, y: y, dx: dx, dy: dy, dist: rng2() * maxReach,
      len: (10 + rng2() * 16) * Math.max(0.6, Math.min(1.3, U / 900)),
      lean: (rng2() - 0.5) * 9, shade: GRASS_SHADES[Math.floor(rng2() * 3)] };
  }
  for (var i = 0; i < 260; i++){ blades.push(mk(rng2() * W, H, 0, -1)); }
  for (var j = 0; j < 90; j++){ blades.push(mk(0, rng2() * H, 1, 0)); }
  for (var k = 0; k < 90; k++){ blades.push(mk(W, rng2() * H, -1, 0)); }
  for (var m = 0; m < 60; m++){ blades.push(mk(rng2() * W, 0, 0, 1)); }
}

// ---- accrual (guarded; QA renderer defines no localStorage) ----
var storedCycles = 0;
try {
  if (typeof localStorage !== 'undefined' && localStorage && localStorage.getItem){
    var v = localStorage.getItem('champion-cycles');
    if (v !== null && v !== undefined){ storedCycles = parseInt(v, 10) || 0; }
  }
} catch (e) { storedCycles = 0; }
if (storedCycles > 40){ storedCycles = 40; }
var lastCycleIndex = 0;
function saveCycles(){
  try {
    if (typeof localStorage !== 'undefined' && localStorage && localStorage.setItem){
      localStorage.setItem('champion-cycles', String(storedCycles));
    }
  } catch (e) {}
}

// ---- drag samples ----
var drags = []; // {x, y, t}
var dragging = false;
function onDown(e){
  dragging = true;
  drags.push({ x: e.clientX, y: e.clientY, t: pieceNow });
  if (e.preventDefault){ try { e.preventDefault(); } catch (err) {} }
}
function onMove(e){
  if (!dragging){ return; }
  drags.push({ x: e.clientX, y: e.clientY, t: pieceNow });
}
function onUp(){ dragging = false; }
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
try { canvas.style.touchAction = 'none'; } catch (e) {}

var pieceNow = 0;

function resize(){
  var s = viewportSize();
  W = s[0]; H = s[1]; U = Math.min(W, H);
  isPhone = detectPhone();
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  buildGrass();
}
if (typeof window !== 'undefined'){
  if (window.visualViewport && window.visualViewport.addEventListener){
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener){ window.addEventListener('resize', resize); }
}
resize();

// ---- deer ----
function ellipsePath(cx, cy, rx, ry){
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}
function quad(x1, y1, x2, y2, x3, y3, x4, y4){
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
  ctx.closePath(); ctx.fill();
}
function limb(x1, y1, x2, y2, w, color){
  var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
  var nx = -dy / len * w / 2, ny = dx / len * w / 2;
  ctx.fillStyle = color;
  quad(x1 + nx, y1 + ny, x1 - nx, y1 - ny, x2 - nx, y2 - ny, x2 + nx, y2 + ny);
}
function antler(x, y, dir, color){
  // Main beam toward the lock + two tines; mirrored by dir.
  ctx.strokeStyle = color; ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(2.5, U * 0.004);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + dir * U * 0.045, y - U * 0.055, x + dir * U * 0.075, y - U * 0.105);
  ctx.stroke();
  ctx.lineWidth = Math.max(2, U * 0.003);
  ctx.beginPath();
  ctx.moveTo(x + dir * U * 0.038, y - U * 0.048);
  ctx.lineTo(x + dir * U * 0.028, y - U * 0.085);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + dir * U * 0.058, y - U * 0.078);
  ctx.lineTo(x + dir * U * 0.088, y - U * 0.095);
  ctx.stroke();
}
function drawDeer(cx, cy, dir, tremor, bodyColor, patchColor){
  var u = U;
  var bodyRx = 0.155 * u, bodyRy = 0.082 * u;
  var groundY = 0.70 * H;
  var legW = Math.max(5, 0.014 * u);
  // legs (braced stance), back pair then front pair
  ctx.fillStyle = FELT;
  limb(cx - dir * 0.10 * u, cy + bodyRy * 0.5, cx - dir * 0.115 * u, groundY, legW, FELT);
  limb(cx + dir * 0.10 * u, cy + bodyRy * 0.5, cx + dir * 0.125 * u, groundY, legW, FELT);
  limb(cx - dir * 0.055 * u, cy + bodyRy * 0.6, cx - dir * 0.05 * u, groundY, legW, FELT);
  limb(cx + dir * 0.06 * u, cy + bodyRy * 0.6, cx + dir * 0.075 * u, groundY, legW, FELT);
  // hooves
  ctx.fillStyle = RUST;
  var hy = groundY;
  ctx.fillRect(cx - dir * 0.115 * u - legW / 2, hy - 3, legW, 4);
  ctx.fillRect(cx + dir * 0.125 * u - legW / 2, hy - 3, legW, 4);
  ctx.fillRect(cx - dir * 0.05 * u - legW / 2, hy - 3, legW, 4);
  ctx.fillRect(cx + dir * 0.075 * u - legW / 2, hy - 3, legW, 4);
  // body
  ctx.fillStyle = bodyColor;
  ellipsePath(cx, cy + tremor, bodyRx, bodyRy);
  // patch
  ctx.fillStyle = patchColor;
  ctx.globalAlpha = 0.85;
  ellipsePath(cx - dir * 0.03 * u, cy + tremor - 0.012 * u, bodyRx * 0.55, bodyRy * 0.62);
  ctx.globalAlpha = 1;
  // neck + head (lowered toward the lock)
  var neckX1 = cx + dir * 0.115 * u, neckY1 = cy + tremor - 0.03 * u;
  var headX = cx + dir * 0.16 * u, headY = cy + tremor - 0.115 * u;
  ctx.fillStyle = bodyColor;
  limb(neckX1, neckY1, headX, headY, bodyRy * 0.9, bodyColor);
  ellipsePath(headX, headY, 0.032 * u, 0.026 * u);
  // muzzle
  ctx.fillStyle = patchColor;
  ellipsePath(headX + dir * 0.028 * u, headY + 0.006 * u, 0.016 * u, 0.011 * u);
  // eye dot (dark, not a face detail — a material mark)
  ctx.fillStyle = '#2b2620';
  ellipsePath(headX + dir * 0.008 * u, headY - 0.006 * u, Math.max(1.5, 0.0035 * u), Math.max(1.5, 0.0035 * u));
  // antlers from head top
  antler(headX - dir * 0.005 * u, headY - 0.022 * u, dir, RUST);
}
function growthFront(t){
  var cyc = Math.floor(t / 60);
  if (cyc > lastCycleIndex){
    var gained = cyc - lastCycleIndex;
    lastCycleIndex = cyc;
    if (storedCycles < 40){ storedCycles += gained; if (storedCycles > 40){ storedCycles = 40; } saveCycles(); }
  }
  var prog = (t % 60) / 60;
  var front = 16 + storedCycles * 5 + prog * 10;
  var cap = 0.30 * U;
  return front > cap ? cap : front;
}
function drawGrass(t, front){
  for (var i = 0; i < blades.length; i++){
    var b = blades[i];
    var f = (front - b.dist) / 16;
    if (f <= 0){ continue; }
    if (f > 1){ f = 1; }
    // drag parting: deflection + height shrink near recent samples
    var ox = 0, oy = 0, shrink = 1;
    for (var s = 0; s < drags.length; s++){
      var d = drags[s];
      var age = t - d.t;
      if (age < 0 || age > 4){ continue; }
      var bx = b.x + b.dx * b.dist, by = b.y + b.dy * b.dist;
      var ddx = bx - d.x, ddy = by - d.y;
      var dist = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dist < 110 && dist > 0.01){
        var w = Math.exp(-age / 1.5) * (1 - dist / 110);
        ox += (ddx / dist) * w * 30;
        oy += (ddy / dist) * w * 30;
        var sh = w * 0.9;
        if (sh > 0.85){ sh = 0.85; }
        if (1 - sh < shrink){ shrink = 1 - sh; }
      }
    }
    var h = b.len * f * shrink;
    if (h < 0.5){ continue; }
    var bx0 = b.x + b.dx * b.dist, by0 = b.y + b.dy * b.dist;
    var tx = bx0 + b.dx * h + b.lean + ox;
    var ty = by0 + b.dy * h + oy;
    ctx.fillStyle = b.shade;
    ctx.beginPath();
    ctx.moveTo(bx0 - b.dy * 1.6, by0 + b.dx * 1.6);
    ctx.lineTo(bx0 + b.dy * 1.6, by0 - b.dx * 1.6);
    ctx.lineTo(tx, ty);
    ctx.closePath(); ctx.fill();
  }
}
function draw(t){
  pieceNow = t;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // faint ground speckle (seeded, flat alpha)
  var rng = mulberry32(1358000 + 77);
  ctx.fillStyle = '#b7ac93';
  for (var i = 0; i < 90; i++){
    var sx = rng() * W, sy = 0.30 * H + rng() * 0.65 * H;
    ctx.globalAlpha = 0.10 + rng() * 0.12;
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;
  // antler lock point: golden-section height
  var lockX = 0.5 * W, lockY = 0.33 * H;
  // breathing tremor (closed-form, almost imperceptible)
  var tremL = Math.sin(t * Math.PI * 2 / 4.7) * 1.1;
  var tremR = Math.sin(t * Math.PI * 2 / 5.3 + 1.7) * 1.1;
  // deer pair, centered; spacing scales with U so heads stay distinct at any aspect
  drawDeer(0.5 * W - 0.21 * U, 0.56 * H, 1, tremL, BONE, FELT);
  drawDeer(0.5 * W + 0.21 * U, 0.56 * H, -1, tremR, FELT, BONE);
  // antler X at the golden point (drawn over both heads, beams start at head tops)
  ctx.strokeStyle = RUST; ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(3, U * 0.005);
  ctx.beginPath();
  ctx.moveTo(0.5 * W - 0.05 * U, 0.56 * H - 0.137 * U);
  ctx.quadraticCurveTo(lockX, lockY, 0.545 * W, 0.26 * H);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0.5 * W + 0.05 * U, 0.56 * H - 0.137 * U);
  ctx.quadraticCurveTo(lockX, lockY, 0.455 * W, 0.26 * H);
  ctx.stroke();
  // grass creeps in from the edges, over the legs
  var front = growthFront(t);
  drawGrass(t, front);
}
// boot flag: frame one draws synchronously at exactly t = 0
draw(0);
var startT = null;
function loop(ts){
  if (startT === null){ startT = ts; }
  draw((ts - startT) / 1000);
  if (typeof requestAnimationFrame === 'function'){ requestAnimationFrame(loop); }
}
if (typeof requestAnimationFrame === 'function'){ requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
