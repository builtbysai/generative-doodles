<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bewitched Witch</title>
<style>
  html, body { margin: 0; padding: 0; background: #1F3A5F; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32, fixed seed) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(530064);

  // ---------- palette (flat fills only, no gradients anywhere) ----------
  var RED = '#C0392B', CREAM = '#F5E9C8', GREEN = '#2E6B34',
      NIGHT = '#1F3A5F', FIREFLY = '#FFD400', BLACK = '#1A1A1A';

  // ---------- precomputed scene data (all seeded, static) ----------
  // fireflies scattered in the top third
  var flies = [];
  for (var i = 0; i < 44; i++) {
    flies.push({
      x: 0.03 + rng() * 0.94, y: 0.03 + rng() * 0.33,
      r: 0.0016 + rng() * 0.0022, al: 0.35 + rng() * 0.55,
      ph: rng() * Math.PI * 2, ph2: rng() * Math.PI * 2,
      sp: 0.4 + rng() * 0.7, sp2: 0.3 + rng() * 0.6,
      halo: rng() < 0.3
    });
  }
  // far pine row along the horizon (seeded heights)
  var farTrees = [];
  for (var ft = 0; ft < 14; ft++) {
    farTrees.push({ x: ft / 14 + 0.012 + rng() * 0.03, h: 0.085 + rng() * 0.085, w: 0.026 + rng() * 0.016 });
  }
  // cream spots on the big cap (clipped to the cap path when drawn)
  var capSpots = [
    { x: 0.30, y: 0.435, rx: 0.026, ry: 0.016 },
    { x: 0.415, y: 0.385, rx: 0.020, ry: 0.012 },
    { x: 0.545, y: 0.375, rx: 0.030, ry: 0.018 },
    { x: 0.665, y: 0.42, rx: 0.022, ry: 0.013 },
    { x: 0.755, y: 0.485, rx: 0.018, ry: 0.011 },
    { x: 0.475, y: 0.475, rx: 0.017, ry: 0.010 },
    { x: 0.235, y: 0.50, rx: 0.015, ry: 0.009 }
  ];
  // friends: bob phases (bird, rabbit, hedgehog, fox)
  var friendPh = [rng() * 6.28, rng() * 6.28, rng() * 6.28, rng() * 6.28];
  // grain specks (short strokes over the whole stage)
  var grain = [];
  for (var g = 0; g < 700; g++) {
    grain.push({ x: rng(), y: rng(), a: rng() * Math.PI, l: 2 + rng() * 4, dark: rng() < 0.55, al: 0.02 + rng() * 0.05 });
  }

  // ---------- viewport / stage ----------
  var W = 0, H = 0, SX = 0, SY = 0, SS = 0; // stage origin + size (square)
  var isPhone = false;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SS = Math.min(w, h);
    SX = (w - SS) / 2; SY = (h - SS) / 2;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || h > w * 1.15;
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- drawing helpers (stage units: u = SS pixels) ----------
  function X(u) { return SX + u * SS; }
  function Y(u) { return SY + u * SS; }
  function circ(x, y, r, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(X(x), Y(y), r * SS, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function ell(x, y, rx, ry, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(X(x), Y(y), rx * SS, ry * SS, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function line(x1, y1, x2, y2, wdt, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function shadow(x, y, rx) { ell(x, y, rx, rx * 0.22, BLACK, 0.16); }

  // one flat pine silhouette: stacked triangles + trunk, base at gy
  function pine(cx, gy, h, w, col, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(X(cx - w * 0.14), Y(gy));
    ctx.lineTo(X(cx + w * 0.14), Y(gy));
    ctx.lineTo(X(cx + w * 0.10), Y(gy - h * 0.18));
    ctx.lineTo(X(cx + w * 0.34), Y(gy - h * 0.18));
    ctx.lineTo(X(cx + w * 0.13), Y(gy - h * 0.45));
    ctx.lineTo(X(cx + w * 0.26), Y(gy - h * 0.45));
    ctx.lineTo(X(cx), Y(gy - h));
    ctx.lineTo(X(cx - w * 0.26), Y(gy - h * 0.45));
    ctx.lineTo(X(cx - w * 0.13), Y(gy - h * 0.45));
    ctx.lineTo(X(cx - w * 0.34), Y(gy - h * 0.18));
    ctx.lineTo(X(cx - w * 0.10), Y(gy - h * 0.18));
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ---------- the giant mushroom ----------
  function capPath() {
    ctx.beginPath();
    ctx.moveTo(X(0.16), Y(0.565));
    ctx.bezierCurveTo(X(0.20), Y(0.40), X(0.33), Y(0.335), X(0.50), Y(0.335));
    ctx.bezierCurveTo(X(0.67), Y(0.335), X(0.80), Y(0.40), X(0.84), Y(0.565));
    ctx.bezierCurveTo(X(0.70), Y(0.60), X(0.30), Y(0.60), X(0.16), Y(0.565));
    ctx.closePath();
  }
  function drawMushroom() {
    // stem
    ctx.fillStyle = CREAM;
    ctx.beginPath();
    ctx.moveTo(X(0.445), Y(0.56));
    ctx.bezierCurveTo(X(0.44), Y(0.68), X(0.415), Y(0.78), X(0.405), Y(0.862));
    ctx.bezierCurveTo(X(0.46), Y(0.878), X(0.545), Y(0.878), X(0.595), Y(0.862));
    ctx.bezierCurveTo(X(0.585), Y(0.78), X(0.56), Y(0.68), X(0.555), Y(0.56));
    ctx.closePath(); ctx.fill();
    // skirt ring under the cap
    ell(0.5, 0.585, 0.062, 0.014, CREAM);
    // cap: red fill + cream spots, clipped to the cap path
    ctx.save();
    capPath(); ctx.clip();
    ctx.fillStyle = RED; ctx.fillRect(X(0.14), Y(0.32), 0.72 * SS, 0.30 * SS);
    for (var si = 0; si < capSpots.length; si++) {
      var sp = capSpots[si];
      ell(sp.x, sp.y, sp.rx, sp.ry, CREAM);
    }
    ctx.restore();
  }

  // ---------- the witch (folk shapes, no face) ----------
  function drawWitch(t) {
    var sway = Math.sin(t * 0.8) * 0.011;      // hat-tip sway offset
    // dress: green bell from shoulders to the seat on the cap
    ctx.fillStyle = GREEN;
    ctx.beginPath();
    ctx.moveTo(X(0.421), Y(0.243));
    ctx.bezierCurveTo(X(0.405), Y(0.30), X(0.385), Y(0.335), X(0.372), Y(0.354));
    ctx.bezierCurveTo(X(0.41), Y(0.366), X(0.45), Y(0.366), X(0.480), Y(0.354));
    ctx.bezierCurveTo(X(0.462), Y(0.325), X(0.448), Y(0.285), X(0.443), Y(0.246));
    ctx.closePath(); ctx.fill();
    // cream collar
    ctx.fillStyle = CREAM;
    ctx.beginPath();
    ctx.moveTo(X(0.424), Y(0.240)); ctx.lineTo(X(0.444), Y(0.240)); ctx.lineTo(X(0.434), Y(0.258));
    ctx.closePath(); ctx.fill();
    // arm resting forward
    line(0.444, 0.272, 0.472, 0.312, 0.0105, BLACK);
    // side-saddle legs dangling over the cap's front slope, black boots
    line(0.458, 0.350, 0.476, 0.408, 0.011, BLACK);
    line(0.446, 0.352, 0.452, 0.418, 0.011, BLACK);
    ell(0.481, 0.414, 0.0135, 0.0075, BLACK);
    ell(0.458, 0.424, 0.0135, 0.0075, BLACK);
    // head: plain cream circle, no features
    circ(0.435, 0.213, 0.027, CREAM);
    // hat: black cone with a bent, swaying tip + brim
    ctx.fillStyle = BLACK;
    ctx.beginPath();
    ctx.moveTo(X(0.384), Y(0.190));
    ctx.quadraticCurveTo(X(0.408 + sway * 0.45), Y(0.115), X(0.392 + sway), Y(0.058));
    ctx.quadraticCurveTo(X(0.420 + sway * 0.5), Y(0.052), X(0.428), Y(0.095));
    ctx.quadraticCurveTo(X(0.452), Y(0.145), X(0.486), Y(0.190));
    ctx.closePath(); ctx.fill();
    ell(0.435, 0.192, 0.057, 0.0125, BLACK);
  }

  // ---------- friends (minimal glyphs, hand-sized) ----------
  function drawBird(bob) {
    var cx = 0.715, gy = 0.388 + bob;      // perched on the cap rim
    line(cx - 0.004, gy, cx - 0.004, gy - 0.012, 0.0028, BLACK);
    line(cx + 0.006, gy, cx + 0.006, gy - 0.012, 0.0028, BLACK);
    ell(cx, gy - 0.024, 0.021, 0.0145, CREAM);
    circ(cx + 0.016, gy - 0.038, 0.0105, CREAM);
    ctx.fillStyle = FIREFLY;               // tiny beak
    ctx.beginPath();
    ctx.moveTo(X(cx + 0.025), Y(gy - 0.040)); ctx.lineTo(X(cx + 0.034), Y(gy - 0.036)); ctx.lineTo(X(cx + 0.025), Y(gy - 0.033));
    ctx.closePath(); ctx.fill();
    ell(cx - 0.004, gy - 0.024, 0.011, 0.008, RED);   // wing
    line(cx - 0.019, gy - 0.020, cx - 0.030, gy - 0.008, 0.0035, CREAM); // tail
    circ(cx + 0.018, gy - 0.039, 0.0018, BLACK);      // eye dot
  }
  function drawRabbit(bob) {
    var cx = 0.150, gy = 0.782 + bob;
    shadow(cx, 0.786, 0.034);
    ell(cx, gy - 0.020, 0.031, 0.020, CREAM);
    circ(cx - 0.030, gy - 0.016, 0.008, CREAM);       // tail puff
    circ(cx + 0.024, gy - 0.040, 0.0165, CREAM);      // head
    ell(cx + 0.018, gy - 0.070, 0.0055, 0.017, CREAM); // ears
    ell(cx + 0.029, gy - 0.068, 0.0055, 0.016, CREAM);
    circ(cx + 0.029, gy - 0.042, 0.0021, BLACK);      // eye
    ell(cx + 0.012, gy - 0.003, 0.013, 0.0045, CREAM); // foot
  }
  function drawHedgehog(bob) {
    var cx = 0.295, gy = 0.838 + bob;
    shadow(cx, 0.842, 0.032);
    ctx.fillStyle = BLACK;                 // spiky dome
    ctx.beginPath();
    ctx.arc(X(cx), Y(gy), 0.030 * SS, Math.PI, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = BLACK; ctx.lineWidth = Math.max(1, 0.0035 * SS); ctx.lineCap = 'round';
    for (var k = 0; k < 7; k++) {
      var a = Math.PI + (k / 6) * Math.PI;
      ctx.beginPath();
      ctx.moveTo(X(cx + Math.cos(a) * 0.026), Y(gy + Math.sin(a) * 0.026));
      ctx.lineTo(X(cx + Math.cos(a) * 0.036), Y(gy + Math.sin(a) * 0.036));
      ctx.stroke();
    }
    circ(cx + 0.027, gy - 0.006, 0.0105, CREAM);      // face
    circ(cx + 0.030, gy - 0.008, 0.0020, BLACK);      // eye
    circ(cx + 0.0365, gy - 0.004, 0.0026, BLACK);     // nose
  }
  function drawFox(bob) {
    var cx = 0.668, gy = 0.822 + bob;
    shadow(cx, 0.826, 0.036);
    // big tail behind, cream tip
    ctx.fillStyle = RED;
    ctx.beginPath();
    ctx.moveTo(X(cx - 0.026), Y(gy - 0.010));
    ctx.bezierCurveTo(X(cx - 0.062), Y(gy - 0.038), X(cx - 0.058), Y(gy + 0.002), X(cx - 0.038), Y(gy - 0.002));
    ctx.bezierCurveTo(X(cx - 0.030), Y(gy - 0.006), X(cx - 0.027), Y(gy - 0.006), X(cx - 0.026), Y(gy - 0.010));
    ctx.closePath(); ctx.fill();
    ell(cx - 0.048, gy - 0.020, 0.010, 0.0075, CREAM);
    ell(cx, gy - 0.020, 0.034, 0.0185, RED);          // body
    line(cx - 0.018, gy - 0.004, cx - 0.018, gy + 0.006, 0.004, RED); // legs
    line(cx + 0.018, gy - 0.004, cx + 0.018, gy + 0.006, 0.004, RED);
    circ(cx + 0.030, gy - 0.042, 0.0155, RED);        // head
    ctx.fillStyle = RED;                              // ears
    ctx.beginPath();
    ctx.moveTo(X(cx + 0.019), Y(gy - 0.052)); ctx.lineTo(X(cx + 0.023), Y(gy - 0.066)); ctx.lineTo(X(cx + 0.029), Y(gy - 0.054));
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(X(cx + 0.033), Y(gy - 0.055)); ctx.lineTo(X(cx + 0.040), Y(gy - 0.067)); ctx.lineTo(X(cx + 0.043), Y(gy - 0.052));
    ctx.closePath(); ctx.fill();
    ell(cx + 0.036, gy - 0.034, 0.008, 0.006, CREAM); // muzzle
    circ(cx + 0.027, gy - 0.044, 0.0020, BLACK);      // eye
  }

  // ---------- pumpkin house ----------
  function drawPumpkin(t) {
    var cx = 0.848, cy = 0.788;
    shadow(cx, 0.856, 0.088);
    ell(cx, cy, 0.086, 0.063, RED);
    ell(cx, cy, 0.058, 0.063, RED);
    ell(cx, cy, 0.028, 0.063, RED);
    ctx.strokeStyle = 'rgba(26,26,26,0.20)'; ctx.lineWidth = Math.max(1, 0.0028 * SS);
    ctx.beginPath(); ctx.ellipse(X(cx), Y(cy), 0.058 * SS, 0.063 * SS, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(X(cx), Y(cy), 0.028 * SS, 0.063 * SS, 0, 0, Math.PI * 2); ctx.stroke();
    // stem
    ctx.fillStyle = GREEN;
    ctx.beginPath();
    ctx.moveTo(X(cx - 0.010), Y(cy - 0.058));
    ctx.quadraticCurveTo(X(cx + 0.002), Y(cy - 0.080), X(cx + 0.016), Y(cy - 0.082));
    ctx.lineTo(X(cx + 0.013), Y(cy - 0.058));
    ctx.closePath(); ctx.fill();
    // door arch
    ctx.fillStyle = BLACK;
    ctx.beginPath();
    ctx.moveTo(X(0.872), Y(0.852));
    ctx.lineTo(X(0.872), Y(0.812));
    ctx.arc(X(0.886), Y(0.812), 0.014 * SS, Math.PI, 0);
    ctx.lineTo(X(0.900), Y(0.852));
    ctx.closePath(); ctx.fill();
    // round window with a breathing glow (layered flat translucent circles)
    var pulse = 0.5 + 0.5 * Math.sin(t * 0.9);
    circ(0.820, 0.782, 0.036 + 0.006 * pulse, FIREFLY, 0.10 + 0.07 * pulse);
    circ(0.820, 0.782, 0.027 + 0.004 * pulse, FIREFLY, 0.16 + 0.10 * pulse);
    circ(0.820, 0.782, 0.0195, FIREFLY, 0.95);
    circ(0.820, 0.782, 0.0135, CREAM);
    line(0.820, 0.7685, 0.820, 0.7955, 0.0028, RED);
    line(0.8065, 0.782, 0.8335, 0.782, 0.0028, RED);
  }

  // ---------- catalog strip: six mushroom variants ----------
  function miniShroom(cx, cy, s, capCol, opts) {
    // thin field-guide ink outline so cream parts read on the cream strip
    function ink() {
      ctx.strokeStyle = 'rgba(26,26,26,0.55)';
      ctx.lineWidth = Math.max(1, 0.0018 * SS);
      ctx.stroke();
    }
    // stem
    ctx.fillStyle = CREAM;
    var sw = (opts.tall ? 0.010 : 0.014) * s, sh = (opts.tall ? 0.052 : 0.036) * s;
    ctx.beginPath();
    ctx.moveTo(X(cx - sw), Y(cy));
    ctx.lineTo(X(cx - sw * 0.8), Y(cy - sh));
    ctx.lineTo(X(cx + sw * 0.8), Y(cy - sh));
    ctx.lineTo(X(cx + sw), Y(cy));
    ctx.quadraticCurveTo(X(cx), Y(cy + 0.004 * s), X(cx - sw), Y(cy));
    ctx.fill(); ink();
    if (opts.ring) ell(cx, cy - sh + 0.002, sw * 1.5, 0.0045 * s, CREAM);
    // cap
    var cw = (opts.wide ? 0.046 : 0.034) * s, chh = (opts.wide ? 0.016 : 0.024) * s;
    ctx.fillStyle = capCol;
    ctx.beginPath();
    ctx.moveTo(X(cx - cw), Y(cy - sh));
    ctx.quadraticCurveTo(X(cx), Y(cy - sh - chh * 2), X(cx + cw), Y(cy - sh));
    ctx.quadraticCurveTo(X(cx), Y(cy - sh + chh * 0.35), X(cx - cw), Y(cy - sh));
    ctx.closePath(); ctx.fill(); ink();
    if (opts.spots) {
      circ(cx - cw * 0.4, cy - sh - chh * 0.7, 0.0045 * s, opts.spotCol);
      circ(cx + cw * 0.25, cy - sh - chh * 1.0, 0.0038 * s, opts.spotCol);
      circ(cx + cw * 0.55, cy - sh - chh * 0.45, 0.0032 * s, opts.spotCol);
    }
  }
  function drawCatalog() {
    ctx.fillStyle = CREAM; ctx.fillRect(X(0), Y(0.875), SS, 0.125 * SS);
    line(0, 0.875, 1, 0.875, 0.0035, BLACK);
    var variants = [
      { col: RED, o: { spots: true, spotCol: CREAM } },
      { col: NIGHT, o: { tall: true } },
      { col: GREEN, o: { wide: true } },
      { col: RED, o: { ring: true } },
      { col: CREAM, o: { spots: true, spotCol: RED } },
      { col: GREEN, o: { tall: true, spots: true, spotCol: CREAM } }
    ];
    for (var ci = 0; ci < 6; ci++) {
      if (ci > 0) line(ci / 6, 0.875, ci / 6, 1, 0.0016, BLACK, 0.28);
      var v = variants[ci];
      miniShroom((ci + 0.5) / 6, 0.972, 1, v.col, v.o);
      ell((ci + 0.5) / 6, 0.978, 0.030, 0.004, BLACK, 0.10);
    }
  }

  // ---------- main draw ----------
  function draw(t) {
    // pin canvas css size every frame (house rule)
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // page ground = night blue
    ctx.fillStyle = NIGHT; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath(); ctx.rect(SX, SY, SS, SS); ctx.clip();
    ctx.fillStyle = NIGHT; ctx.fillRect(SX, SY, SS, SS);

    // far pine row (flat forest, gentle depth via alpha)
    for (var fi = 0; fi < farTrees.length; fi++) {
      pine(farTrees[fi].x, 0.728, farTrees[fi].h, farTrees[fi].w, GREEN, 0.45);
    }
    // ground hill above the catalog strip
    ctx.fillStyle = GREEN;
    ctx.beginPath();
    ctx.moveTo(X(0), Y(0.718));
    ctx.quadraticCurveTo(X(0.5), Y(0.688), X(1), Y(0.712));
    ctx.lineTo(X(1), Y(0.875)); ctx.lineTo(X(0), Y(0.875));
    ctx.closePath(); ctx.fill();
    // near pines framing the edges
    pine(0.035, 0.86, 0.46, 0.11, GREEN, 1);
    pine(0.972, 0.85, 0.40, 0.10, GREEN, 1);
    pine(0.115, 0.865, 0.30, 0.075, GREEN, 0.85);

    // soft ground shadows
    shadow(0.5, 0.868, 0.13);

    // pumpkin house at the mushroom's base, bottom-right
    drawPumpkin(t);

    // the giant mushroom + witch
    drawMushroom();
    drawWitch(t);

    // friends in a loose ring, bobbing gently
    drawBird(Math.sin(t * 1.4 + friendPh[0]) * 0.0032);
    drawRabbit(Math.sin(t * 1.25 + friendPh[1]) * 0.0035);
    drawHedgehog(Math.sin(t * 1.1 + friendPh[2]) * 0.003);
    drawFox(Math.sin(t * 1.3 + friendPh[3]) * 0.0035);

    // fireflies drifting in the top third (drawn last: they float in front)
    for (var di = 0; di < flies.length; di++) {
      var f = flies[di];
      var fx = f.x + 0.012 * Math.sin(t * f.sp + f.ph);
      var fy = f.y + 0.009 * Math.sin(t * f.sp2 + f.ph2);
      var tw = f.al * (0.62 + 0.38 * Math.sin(t * (0.9 + f.sp) + f.ph * 1.7));
      if (f.halo) circ(fx, fy, f.r * 2.6, FIREFLY, tw * 0.16);
      circ(fx, fy, f.r, FIREFLY, tw);
    }

    // catalog strip across the bottom eighth
    drawCatalog();

    // grain specks (precomputed, drawn directly)
    for (var gi = 0; gi < grain.length; gi++) {
      var gr = grain[gi];
      ctx.strokeStyle = gr.dark ? 'rgba(0,0,0,' + gr.al + ')' : 'rgba(255,255,255,' + gr.al + ')';
      ctx.lineWidth = Math.max(1, 0.0013 * SS);
      ctx.beginPath();
      ctx.moveTo(X(gr.x), Y(gr.y));
      ctx.lineTo(X(gr.x + Math.cos(gr.a) * gr.l / 1080), Y(gr.y + Math.sin(gr.a) * gr.l / 1080));
      ctx.stroke();
    }

    ctx.restore();
  }

  // ---------- deterministic first frame + loop ----------
  var PHASE0 = 2.2; // constant loop phase for frame one
  draw(PHASE0);
  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    draw(PHASE0 + (now - startStamp) / 1000);
    window.requestAnimationFrame(frame);
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
