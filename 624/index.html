<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>An Altar for Clarity</title>
<style>
  html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SEED = 624075;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette ----------
  var GROUND = '#141210';
  var BONE = '#F0E6D2';
  var GOLD = '#C9A227', PINK = '#E87B9C', GREEN = '#6A9A5B', EYEBLUE = '#1E4D8C';

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function rgba(h, a) {
    var c = hexRgb(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  // ---------- mandala geometry (built once, seeded) ----------
  var rng = mulberry32(SEED);
  var PETAL_JITTER = [];
  for (var i = 0; i < 64; i++) PETAL_JITTER.push(0.92 + rng() * 0.16);

  // rings ordered OUTER -> INNER; each has an ignition threshold
  var RINGS = [
    { kind: 'rim',    r: 1.00, color: GOLD },
    { kind: 'petals', n: 16, r0: 0.79, r1: 0.95, w: 0.105, color: PINK },
    { kind: 'dots',   n: 32, r: 0.735, color: GOLD },
    { kind: 'petals', n: 24, r0: 0.575, r1: 0.715, w: 0.062, color: GREEN },
    { kind: 'scallop', n: 24, r: 0.545, color: PINK },
    { kind: 'petals', n: 12, r0: 0.335, r1: 0.515, w: 0.13, color: GOLD },
    { kind: 'rim',    r: 0.30, color: GOLD }
  ];
  for (var ri = 0; ri < RINGS.length; ri++) {
    RINGS[ri].t = ri * 0.115;      // ignition threshold (outer first)
    RINGS[ri].span = 0.30;
  }

  // ---------- constellation chains (seeded, toward the four edges) ----------
  var CON = [];
  (function () {
    var crng = mulberry32(SEED + 11);
    var dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (var d = 0; d < 4; d++) {
      var pts = [];
      var steps = 3 + Math.floor(crng() * 2);
      for (var s = 0; s < steps; s++) {
        var along = 1.12 + (s + 1) * 0.34 + crng() * 0.12;   // in units of R from center
        var perp = (crng() - 0.5) * 0.55;
        pts.push({ dx: dirs[d][0], dy: dirs[d][1], along: along, perp: perp, r: 1.6 + crng() * 1.6 });
      }
      CON.push(pts);
    }
  })();

  // ---------- state ----------
  var mode = 'color';           // 'color' | 'ink'
  var charge = 0;               // 0..1
  var holding = false;
  var flash = 0;                // decays after an eye tap at full charge
  var starSeeds = [];           // session-only list of {fx, fy} edge points (fractions of w/h)
  var downX = 0, downY = 0, downT = 0;
  var lastTapT = -10, lastTapX = 0, lastTapY = 0;

  // QA hooks (inert in the shipped piece; used only by throwaway forced renders)
  var FORCED = (typeof window !== 'undefined' && typeof window.__forceCharge === 'number')
    ? window.__forceCharge : null;
  if (typeof window !== 'undefined' && typeof window.__forceSeeds === 'number') {
    for (var fs = 0; fs < window.__forceSeeds; fs++) addSeed();
  }
  if (FORCED !== null) charge = FORCED;

  function addSeed() {
    if (starSeeds.length >= 40) return;
    var r = mulberry32(SEED + 500 + starSeeds.length * 7);
    var edge = Math.floor(r() * 4);
    var t = 0.08 + r() * 0.84;
    var p;
    if (edge === 0) p = { fx: t, fy: 0.012 };
    else if (edge === 1) p = { fx: t, fy: 0.988 };
    else if (edge === 2) p = { fx: 0.012, fy: t };
    else p = { fx: 0.988, fy: t };
    starSeeds.push(p);
  }

  // ---------- sizing (Visual Viewport API) ----------
  var W = 0, H = 0;
  function resize() {
    var vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(lastElapsed);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  function isPhone(w, h) {
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  // ---------- helpers ----------
  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function pt(cx, cy, r, a) { return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }

  function drawPetal(cx, cy, R, r0, r1, halfW, ang, jit, color, alpha) {
    var base = r0 * R, tipR = r1 * R * jit;
    var p0 = pt(cx, cy, base, ang - halfW);
    var p1 = pt(cx, cy, base, ang + halfW);
    var tip = pt(cx, cy, tipR, ang);
    var m1 = pt(cx, cy, (base + tipR) / 2, ang - halfW * 1.25);
    var m2 = pt(cx, cy, (base + tipR) / 2, ang + halfW * 1.25);
    ctx.beginPath();
    ctx.moveTo(p0[0], p0[1]);
    ctx.quadraticCurveTo(m1[0], m1[1], tip[0], tip[1]);
    ctx.quadraticCurveTo(m2[0], m2[1], p1[0], p1[1]);
    ctx.closePath();
    ctx.fillStyle = rgba(color, alpha * 0.16);
    ctx.fill();
    ctx.strokeStyle = rgba(color, alpha);
    ctx.lineWidth = Math.max(1, R * 0.006);
    ctx.stroke();
    // center vein
    var vb = pt(cx, cy, base + (tipR - base) * 0.15, ang);
    var vt = pt(cx, cy, base + (tipR - base) * 0.8, ang);
    ctx.beginPath();
    ctx.moveTo(vb[0], vb[1]);
    ctx.lineTo(vt[0], vt[1]);
    ctx.strokeStyle = rgba(color, alpha * 0.55);
    ctx.lineWidth = Math.max(0.75, R * 0.0035);
    ctx.stroke();
  }

  function ringAlpha(ring) {
    var lit = clamp01((charge - ring.t) / ring.span);
    return 0.12 + 0.88 * lit;
  }

  // ---------- main draw ----------
  var lastElapsed = 0;
  function draw(t) {
    if (!W || !H) return;
    var w = W, h = H;
    var phone = isPhone(w, h);
    var R = Math.min(w, h) * (phone ? 0.415 : 0.40);
    var cx = w / 2, cy = h / 2;

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, w, h);

    var glowColor = (mode === 'ink') ? BONE : GOLD;

    // layered glow halos (shapes only, no shadowBlur / filters)
    if (charge > 0.01 || flash > 0.01) {
      var g = Math.min(1, charge + flash * 0.6);
      for (var gi = 5; gi >= 1; gi--) {
        ctx.beginPath();
        ctx.arc(cx, cy, R * (1 + gi * 0.16), 0, Math.PI * 2);
        ctx.fillStyle = rgba(glowColor, 0.016 * g * (6 - gi) * 0.5);
        ctx.fill();
      }
    }

    // constellation chains (revealed by charge / flash)
    var conA = clamp01((charge - 0.5) / 0.5) * 0.85 + flash * 0.9;
    if (conA > 0.02) {
      conA = Math.min(1, conA);
      for (var d = 0; d < 4; d++) {
        var pts = CON[d];
        var prev = null;
        ctx.beginPath();
        for (var s = 0; s < pts.length; s++) {
          var p = pts[s];
          var x = cx + (p.dx * p.along + (-p.dy) * p.perp) * R;
          var y = cy + (p.dy * p.along + (p.dx) * p.perp) * R;
          if (prev === null) {
            var ex = cx + p.dx * R * 1.02, ey = cy + p.dy * R * 1.02;
            ctx.moveTo(ex, ey);
          } else ctx.lineTo(x, y);
          prev = [x, y];
        }
        ctx.strokeStyle = rgba(glowColor, conA * 0.5);
        ctx.lineWidth = 1;
        ctx.stroke();
        for (var s2 = 0; s2 < pts.length; s2++) {
          var q = pts[s2];
          var qx = cx + (q.dx * q.along + (-q.dy) * q.perp) * R;
          var qy = cy + (q.dy * q.along + (q.dx) * q.perp) * R;
          drawStar(qx, qy, q.r * (1 + flash), glowColor, conA);
        }
      }
    }

    // star-seeds (session accumulations at the edges)
    for (var ss = 0; ss < starSeeds.length; ss++) {
      var tw = 0.65 + 0.35 * Math.sin(t * 2 + ss * 1.7);
      drawStar(starSeeds[ss].fx * w, starSeeds[ss].fy * h, 2.6, glowColor, 0.55 * tw + flash * 0.4);
    }

    // mandala rings
    for (var ri = 0; ri < RINGS.length; ri++) {
      var ring = RINGS[ri];
      var col = (mode === 'ink') ? BONE : ring.color;
      var a = ringAlpha(ring);
      var k, ang;
      if (ring.kind === 'rim') {
        ctx.beginPath();
        ctx.arc(cx, cy, ring.r * R, 0, Math.PI * 2);
        ctx.strokeStyle = rgba(col, a);
        ctx.lineWidth = Math.max(1, R * 0.007);
        ctx.stroke();
        // fine ray ticks just inside the outer rim
        if (ring.r > 0.99) {
          ctx.beginPath();
          for (k = 0; k < 48; k++) {
            ang = (k / 48) * Math.PI * 2;
            var t1 = pt(cx, cy, 0.955 * R, ang), t2 = pt(cx, cy, 0.995 * R, ang);
            ctx.moveTo(t1[0], t1[1]);
            ctx.lineTo(t2[0], t2[1]);
          }
          ctx.strokeStyle = rgba(col, a * 0.8);
          ctx.lineWidth = Math.max(0.75, R * 0.004);
          ctx.stroke();
        }
      } else if (ring.kind === 'dots') {
        for (k = 0; k < ring.n; k++) {
          ang = (k / ring.n) * Math.PI * 2;
          var dp = pt(cx, cy, ring.r * R, ang);
          ctx.beginPath();
          ctx.arc(dp[0], dp[1], Math.max(1.2, R * 0.011), 0, Math.PI * 2);
          ctx.fillStyle = rgba(col, a);
          ctx.fill();
        }
      } else if (ring.kind === 'scallop') {
        for (k = 0; k < ring.n; k++) {
          ang = (k / ring.n) * Math.PI * 2;
          var sp = pt(cx, cy, ring.r * R, ang);
          ctx.beginPath();
          ctx.arc(sp[0], sp[1], R * 0.032, Math.PI * 0.15, Math.PI * 1.15);
          ctx.strokeStyle = rgba(col, a * 0.85);
          ctx.lineWidth = Math.max(0.75, R * 0.004);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(cx, cy, ring.r * R, 0, Math.PI * 2);
        ctx.strokeStyle = rgba(col, a * 0.5);
        ctx.lineWidth = Math.max(0.75, R * 0.0035);
        ctx.stroke();
      } else if (ring.kind === 'petals') {
        for (k = 0; k < ring.n; k++) {
          ang = (k / ring.n) * Math.PI * 2 + (ring.n === 24 ? Math.PI / ring.n : 0);
          drawPetal(cx, cy, R, ring.r0, ring.r1, ring.w, ang, PETAL_JITTER[k % PETAL_JITTER.length], col, a);
        }
      }
    }

    // ---------- center eye ----------
    var eyeOpen = clamp01((charge - 0.82) / 0.18);
    eyeOpen = eyeOpen * eyeOpen * (3 - 2 * eyeOpen); // smoothstep
    var eyeCol = (mode === 'ink') ? BONE : GOLD;
    var eyeA = 0.12 + 0.88 * clamp01((charge - 0.7) / 0.3);
    var ew = R * 0.27;                       // eye half-width
    var eh = R * (0.035 + 0.125 * eyeOpen);  // eye half-height (nearly closed at rest)
    ctx.beginPath();
    ctx.moveTo(cx - ew, cy);
    ctx.quadraticCurveTo(cx, cy - eh * 2, cx + ew, cy);
    ctx.quadraticCurveTo(cx, cy + eh * 2, cx - ew, cy);
    ctx.closePath();
    ctx.strokeStyle = rgba(eyeCol, eyeA);
    ctx.lineWidth = Math.max(1, R * 0.008);
    ctx.stroke();
    // lashes on the upper lid
    if (eyeOpen > 0.25) {
      ctx.beginPath();
      for (var li = -2; li <= 2; li++) {
        var lx = cx + li * ew * 0.36;
        var ly = cy - eh * (1.55 - Math.abs(li) * 0.22);
        ctx.moveTo(lx, ly);
        ctx.lineTo(lx + li * R * 0.008, ly - R * 0.035 * eyeOpen);
      }
      ctx.strokeStyle = rgba(eyeCol, eyeA * 0.8);
      ctx.lineWidth = Math.max(0.75, R * 0.004);
      ctx.stroke();
    }
    // iris + pupil (revealed as the eye opens)
    if (eyeOpen > 0.03) {
      var irisR = R * 0.105 * eyeOpen;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx - ew, cy);
      ctx.quadraticCurveTo(cx, cy - eh * 2, cx + ew, cy);
      ctx.quadraticCurveTo(cx, cy + eh * 2, cx - ew, cy);
      ctx.closePath();
      ctx.clip();
      ctx.beginPath();
      ctx.arc(cx, cy, irisR, 0, Math.PI * 2);
      if (mode === 'ink') {
        ctx.strokeStyle = rgba(BONE, eyeA);
        ctx.lineWidth = Math.max(1, R * 0.007);
        ctx.stroke();
      } else {
        ctx.fillStyle = rgba(EYEBLUE, eyeA);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(cx, cy, irisR * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = (mode === 'ink') ? rgba(BONE, eyeA) : GROUND;
      if (mode === 'ink') ctx.fill(); else ctx.fill();
      ctx.restore();
    }

    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }

  function drawStar(x, y, r, color, alpha) {
    ctx.beginPath();
    ctx.arc(x, y, r * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = rgba(color, alpha);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
    ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
    ctx.strokeStyle = rgba(color, alpha * 0.7);
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // ---------- interaction ----------
  function eyeHit(x, y) {
    var R = Math.min(W, H) * (isPhone(W, H) ? 0.415 : 0.40);
    var dx = x - W / 2, dy = y - H / 2;
    return Math.sqrt(dx * dx + dy * dy) < R * 0.30;
  }

  canvas.addEventListener('pointerdown', function (e) {
    holding = true;
    downX = e.clientX; downY = e.clientY; downT = lastElapsed;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (holding) { /* dragging charges just like holding */ }
  });
  function release(e) {
    if (!holding) return;
    holding = false;
    var dt = lastElapsed - downT;
    var moved = Math.sqrt(Math.pow(e.clientX - downX, 2) + Math.pow(e.clientY - downY, 2));
    if (dt < 0.3 && moved < 12) {
      // a tap
      var onEye = eyeHit(e.clientX, e.clientY);
      if (onEye && charge >= 0.999) {
        flash = 1;
        addSeed();
        lastTapT = -10;
        return;
      }
      if (!onEye && (lastElapsed - lastTapT) < 0.35 &&
          Math.sqrt(Math.pow(e.clientX - lastTapX, 2) + Math.pow(e.clientY - lastTapY, 2)) < 40) {
        mode = (mode === 'color') ? 'ink' : 'color';
        lastTapT = -10;
      } else {
        lastTapT = lastElapsed; lastTapX = e.clientX; lastTapY = e.clientY;
      }
    }
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', function () { holding = false; });

  // ---------- clock / loop (anchored elapsed, rAF guarded) ----------
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var prevElapsed = 0;
  function frame() {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : t0;
    var elapsed = (now - t0) / 1000;
    var dt = Math.min(0.05, Math.max(0, elapsed - prevElapsed));
    prevElapsed = elapsed;
    lastElapsed = elapsed;
    if (FORCED === null) {
      if (holding) charge = Math.min(1, charge + dt / 4);        // ~4 s to full
      else charge = Math.max(0, charge - dt / 6);                // ~6 s to rest
    }
    if (flash > 0) flash = Math.max(0, flash - dt / 0.8);
    draw(elapsed);
  }

  resize();
  draw(0); // synchronous first frame: rest state, color mode, fixed phase
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () { frame(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
