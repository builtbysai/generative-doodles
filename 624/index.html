<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1965 The Underpass Plays</title>
<style>
  html, body { margin: 0; padding: 0; background: #2e2c2a; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // The Underpass Plays, CW6 / PP1212, study #256 caius-williams.
  // An urban underpass with corrugated walls, site-specific
  // objects on stands: small drums, resonant plates, a bass
  // leaning nearby. The room is played: resonant tones bloom
  // from the walls' modes, shifting as if the space is being
  // bowed. Long tones decay into the corrugation; the space
  // answers. Found, temporary, a little illegal: no concert
  // hall, no polish. Watch-only: every few minutes the venue
  // re-tunes and a new room mode set takes over.
  var CONCRETE = '#8a8680';  // wall concrete gray
  var CONCRETE_L = '#948f88'; // lighter wall
  var CONCRETE_D = '#7a766f'; // darker wall
  var FLOOR = '#4a4741';      // floor concrete
  var RUST = '#8a4a2e';       // corrugated rust
  var RUST_L = '#a85a34';     // lighter rust
  var RUST_D = '#5f3320';     // dark rust
  var AMBER = '#d9a441';      // tone bloom amber
  var AMBER_L = '#e8c88a';    // pale amber
  var BRONZE = '#b98a3e';     // resonant plate bronze
  var SKIN = '#d8cdb8';       // drum skin
  var NIGHT = '#16233c';      // night blue through the mouth
  var NIGHT_L = '#22345a';    // lighter night blue
  var INK = '#211f1d';        // bass silhouette, near black
  var PAPER = '#f2efe8';      // plate text

  // Fixed-phase first frame: FIRST_T = 12 s. At t = 12 the
  // first venue cycle is running (mode set 1 of 3), the drum
  // struck 2 s ago, the plate 7 s ago, the bass 4 s ago, so
  // frame one shows live tone blooms already decaying into
  // the corrugation. Every frame is a pure function of t.
  var FIRST_T = 12;
  var SEED = 1965;
  var CYCLE = 180;      // venue cycle: re-tune every 3 minutes
  var MODE_SETS = 3;    // three room mode sets, cycled
  var RETUNE = 8;       // seconds a re-tune crossfades over

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is accepted as an alias for the same clock,
  // so the node-canvas render tool (which passes its probe value
  // as ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per call from the
  // piece number and fixed salts, so every frame is a pure
  // function of t.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function lerp(a, b, s) { return a + (b - a) * s; }
  function lerpPt(p, q, s) { return [lerp(p[0], q[0], s), lerp(p[1], q[1], s)]; }

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    // Vanishing point at centre, slightly above middle.
    L.cx = W * 0.5;
    L.cy = H * 0.46;
    // Underpass mouth, night blue, receding to centre.
    L.mw = W * 0.30;
    L.mh = H * 0.34;
    L.mx0 = L.cx - L.mw / 2; L.mx1 = L.cx + L.mw / 2;
    L.my0 = L.cy - L.mh / 2; L.my1 = L.cy + L.mh / 2;
    L.sideX = Math.max(14, W * 0.045);
    // Object anchors, scaled from the stage.
    L.drumX = W * 0.17; L.drumY = H * 0.80;
    L.plateX = W * 0.31; L.plateY = H * 0.68;
    L.bassX = W * 0.83; L.bassY = H * 0.72;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Room modes ------------------------------------------------
  // One venue cycle lasts CYCLE seconds and carries one mode
  // set: five resonators, each anchored on a wall at a depth,
  // driven by one exciter (drum, plate, bass). Mode sets are
  // seeded per set index so a re-tune is a real change of room,
  // not a reshuffle of the same numbers.
  var setCache = {};
  function modeSet(setIndex) {
    if (setCache[setIndex]) { return setCache[setIndex]; }
    var rng = mulberry32(SEED * 131 + setIndex * 7919 + 7);
    var walls = ['L', 'R', 'L', 'C', 'R'];
    var res = [];
    var i;
    for (i = 0; i < 5; i++) {
      res.push({
        wall: walls[i],
        s: 0.15 + rng() * 0.7,
        base: 0.35 + rng() * 0.45,
        phase: rng() * Math.PI * 2,
        exc: i % 3
      });
    }
    setCache[setIndex] = res;
    return res;
  }
  // Exciter strike schedule: drum every 7 s from 3 s, plate
  // every 11 s from 5 s, bass every 23 s from 8 s. Each strike
  // blooms then decays exponentially; the envelope is a pure
  // function of t.
  var EXCITERS = [
    { period: 7, offset: 3, tau: 5, x: 'drum' },
    { period: 11, offset: 5, tau: 7, x: 'plate' },
    { period: 23, offset: 8, tau: 9, x: 'bass' }
  ];
  function exciterEnv(t, e) {
    if (t < e.offset) { return 0; }
    var k = Math.floor((t - e.offset) / e.period);
    var ts = e.offset + k * e.period;
    return Math.exp(-(t - ts) / e.tau);
  }
  function modeSetIndex(t) { return Math.floor(t / CYCLE) % MODE_SETS; }
  // Resonator amplitude: exciter envelope times a slow drift,
  // weighted by the re-tune crossfade. Returns the amplitude
  // for one resonator of one set at time t.
  function resonatorAmp(t, r, setWeight) {
    var e = EXCITERS[r.exc];
    var env = exciterEnv(t, e);
    var drift = 0.75 + 0.25 * Math.sin((Math.PI * 2 * t) / 47 + r.phase);
    return r.base * (0.4 + 0.6 * env) * drift * setWeight;
  }
  // Depth parameter with perspective bunching: ribs and anchors
  // crowd toward the mouth, as they would in a real underpass.
  function depthS(s) { return 1 - Math.pow(1 - s, 1.7); }

  // Anchor point of a resonator on its wall at depth s.
  function wallAnchor(wall, s) {
    var d = depthS(s);
    if (wall === 'L') {
      var top = lerpPt([0, 0], [L.mx0, L.my0], d);
      var bot = lerpPt([0, H], [L.mx0, L.my1], d);
      return [(top[0] + bot[0]) / 2, (top[1] + bot[1]) / 2];
    }
    if (wall === 'R') {
      var topR = lerpPt([W, 0], [L.mx1, L.my0], d);
      var botR = lerpPt([W, H], [L.mx1, L.my1], d);
      return [(topR[0] + botR[0]) / 2, (topR[1] + botR[1]) / 2];
    }
    // Ceiling.
    var left = lerpPt([0, 0], [L.mx0, L.my0], d);
    var right = lerpPt([W, 0], [L.mx1, L.my0], d);
    return [(left[0] + right[0]) / 2, (left[1] + right[1]) / 2];
  }

  // ---- Scene -----------------------------------------------------
  function poly(points, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    var i;
    for (i = 1; i < points.length; i++) { ctx.lineTo(points[i][0], points[i][1]); }
    ctx.closePath();
    ctx.fill();
  }

  function drawWalls() {
    // Left wall, right wall, ceiling, floor: trapezoids meeting
    // at the mouth. Left wall darker, right wall catching the
    // mouth light.
    poly([[0, 0], [L.mx0, L.my0], [L.mx0, L.my1], [0, H]], CONCRETE_D);
    poly([[W, 0], [L.mx1, L.my0], [L.mx1, L.my1], [W, H]], CONCRETE_L);
    poly([[0, 0], [W, 0], [L.mx1, L.my0], [L.mx0, L.my0]], CONCRETE);
    poly([[0, H], [W, H], [L.mx1, L.my1], [L.mx0, L.my1]], FLOOR);

    // Corrugation ribs: vertical ribs on the walls, ribs across
    // the ceiling, seams across the floor. Every fourth rib is
    // rust; the rest are shadowed concrete. Ribs crowd toward
    // the mouth by the depth mapping.
    var i, d, s;
    ctx.lineWidth = Math.max(1, L.u * 0.002);
    for (i = 0; i <= 15; i++) {
      s = i / 15; d = depthS(s);
      var topL = lerpPt([0, 0], [L.mx0, L.my0], d);
      var botL = lerpPt([0, H], [L.mx0, L.my1], d);
      var topR = lerpPt([W, 0], [L.mx1, L.my0], d);
      var botR = lerpPt([W, H], [L.mx1, L.my1], d);
      var rust = (i % 4 === 0);
      ctx.strokeStyle = hexA(rust ? RUST : '#5d5952', a4(rust ? 0.55 : 0.4));
      ctx.beginPath(); ctx.moveTo(topL[0], topL[1]); ctx.lineTo(botL[0], botL[1]); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(topR[0], topR[1]); ctx.lineTo(botR[0], botR[1]); ctx.stroke();
    }
    for (i = 0; i <= 11; i++) {
      s = i / 11; d = depthS(s);
      var cl = lerpPt([0, 0], [L.mx0, L.my0], d);
      var cr = lerpPt([W, 0], [L.mx1, L.my0], d);
      var fl = lerpPt([0, H], [L.mx0, L.my1], d);
      var fr = lerpPt([W, H], [L.mx1, L.my1], d);
      var rustC = (i % 4 === 2);
      ctx.strokeStyle = hexA(rustC ? RUST : '#5d5952', a4(rustC ? 0.5 : 0.35));
      ctx.beginPath(); ctx.moveTo(cl[0], cl[1]); ctx.lineTo(cr[0], cr[1]); ctx.stroke();
      ctx.strokeStyle = hexA('#3f3c37', a4(0.4));
      ctx.beginPath(); ctx.moveTo(fl[0], fl[1]); ctx.lineTo(fr[0], fr[1]); ctx.stroke();
    }

    // Mouth frame: a rust rim where the walls meet the night.
    ctx.strokeStyle = hexA(RUST_D, a4(0.8));
    ctx.lineWidth = Math.max(2, L.u * 0.006);
    ctx.strokeRect(L.mx0, L.my0, L.mw, L.mh);
  }

  function drawMouth(t) {
    // Night blue through the underpass mouth, with a faint
    // horizon glow and two distant streetlights.
    ctx.fillStyle = NIGHT;
    ctx.fillRect(L.mx0, L.my0, L.mw, L.mh);
    ctx.fillStyle = NIGHT_L;
    ctx.fillRect(L.mx0 + L.mw * 0.08, L.my0 + L.mh * 0.10, L.mw * 0.84, L.mh * 0.52);
    // Horizon glow line.
    ctx.fillStyle = hexA(AMBER_L, a4(0.35));
    ctx.fillRect(L.mx0, L.my0 + L.mh * 0.62, L.mw, Math.max(1, L.u * 0.003));
    // Distant lights, steady, faint.
    var lights = [[0.30, 0.58], [0.68, 0.55]];
    var i;
    for (i = 0; i < lights.length; i++) {
      var lx = L.mx0 + L.mw * lights[i][0];
      var ly = L.my0 + L.mh * lights[i][1];
      ctx.fillStyle = hexA(AMBER_L, a4(0.75));
      ctx.beginPath();
      ctx.moveTo(lx + 2.5, ly);
      ctx.arc(lx, ly, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = hexA(AMBER, a4(0.12));
      ctx.beginPath();
      ctx.moveTo(lx + 9, ly);
      ctx.arc(lx, ly, 9, 0, Math.PI * 2);
      ctx.fill();
    }
    // Dust motes drifting in the mouth light, slow and faint.
    var rng = mulberry32(SEED * 7 + 13);
    for (i = 0; i < 24; i++) {
      var mx = L.mx0 + rng() * L.mw;
      var my = L.my0 + rng() * L.mh * 0.9;
      var ph = rng() * Math.PI * 2;
      var dx = mx + Math.sin(t * 0.05 + ph) * L.u * 0.004;
      var dy = my + Math.cos(t * 0.04 + ph) * L.u * 0.003;
      ctx.fillStyle = hexA(AMBER_L, a4(0.14));
      ctx.beginPath();
      ctx.moveTo(dx + 1.4, dy);
      ctx.arc(dx, dy, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFloorGlow() {
    // Amber reflection streak from the mouth down the floor,
    // and a dark puddle catching the night blue.
    poly([[L.mx0, L.my1], [L.mx1, L.my1], [L.cx + W * 0.16, H], [L.cx - W * 0.16, H]],
      hexA(AMBER, a4(0.06)));
    ctx.fillStyle = hexA(NIGHT, a4(0.35));
    ctx.beginPath();
    ctx.moveTo(L.cx + W * 0.10, H * 0.86);
    ctx.ellipse(L.cx, H * 0.86, W * 0.10, H * 0.018, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = hexA(AMBER_L, a4(0.18));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(L.cx + W * 0.10, H * 0.86);
    ctx.ellipse(L.cx, H * 0.86, W * 0.10, H * 0.018, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // ---- Objects ---------------------------------------------------
  function drawDrum(t) {
    var s = L.u / 720;
    var x = L.drumX, y = L.drumY;
    var env = exciterEnv(t, EXCITERS[0]);
    // Tripod stand.
    ctx.strokeStyle = hexA(INK, a4(0.85));
    ctx.lineWidth = Math.max(1.5, 2.4 * s);
    var legs = [[-16, 0], [0, 4], [16, 0]];
    var i;
    for (i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(x, y - 34 * s);
      ctx.lineTo(x + legs[i][0] * s, y + legs[i][1] * s);
      ctx.stroke();
    }
    // Stand pole.
    ctx.beginPath();
    ctx.moveTo(x, y - 34 * s);
    ctx.lineTo(x, y - 6 * s);
    ctx.stroke();
    // Drum shell: rust cylinder with a skin top. The strike
    // flash is a bright amber bloom on the skin.
    ctx.fillStyle = RUST;
    ctx.fillRect(x - 27 * s, y - 34 * s, 54 * s, 28 * s);
    ctx.fillStyle = hexA(RUST_L, a4(0.6));
    ctx.fillRect(x - 27 * s, y - 34 * s, 54 * s, 5 * s);
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(x + 27 * s, y - 34 * s);
    ctx.ellipse(x, y - 34 * s, 27 * s, 7 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = hexA(AMBER_L, a4(0.7));
    ctx.lineWidth = Math.max(1, 1.6 * s);
    ctx.beginPath();
    ctx.moveTo(x + 27 * s, y - 34 * s);
    ctx.ellipse(x, y - 34 * s, 27 * s, 7 * s, 0, 0, Math.PI * 2);
    ctx.stroke();
    if (env > 0.05) {
      ctx.fillStyle = hexA(AMBER, a4(0.5 * env * env));
      ctx.beginPath();
      ctx.moveTo(x + 27 * s, y - 34 * s);
      ctx.ellipse(x, y - 34 * s, 27 * s, 7 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlate(t) {
    var s = L.u / 720;
    var x = L.plateX, y = L.plateY;
    var env = exciterEnv(t, EXCITERS[1]);
    // Thin stand pole.
    ctx.strokeStyle = hexA(INK, a4(0.85));
    ctx.lineWidth = Math.max(1.5, 2.2 * s);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 4 * s, y - 46 * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - 14 * s, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 14 * s, y);
    ctx.stroke();
    // Resonant plate: a tilted bronze rectangle, struck edge
    // catching amber when the exciter fires.
    var px = x + 4 * s, py = y - 52 * s;
    poly([[px - 26 * s, py + 6 * s], [px + 30 * s, py - 8 * s],
          [px + 30 * s, py + 16 * s], [px - 26 * s, py + 30 * s]], BRONZE);
    ctx.strokeStyle = hexA(AMBER_L, a4(0.35 + 0.55 * env));
    ctx.lineWidth = Math.max(1, 1.8 * s);
    ctx.beginPath();
    ctx.moveTo(px - 26 * s, py + 6 * s);
    ctx.lineTo(px + 30 * s, py - 8 * s);
    ctx.stroke();
    if (env > 0.05) {
      ctx.fillStyle = hexA(AMBER, a4(0.28 * env));
      ctx.beginPath();
      ctx.moveTo(px + 30 * s, py - 8 * s);
      ctx.ellipse(px + 30 * s, py - 8 * s, 16 * s, 10 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBass(t) {
    var s = L.u / 720;
    var env = exciterEnv(t, EXCITERS[2]);
    ctx.save();
    ctx.translate(L.bassX, L.bassY);
    ctx.rotate(-0.14); // leaning against the right wall
    // Body: two overlapping bouts, a dark silhouette.
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(34 * s, 18 * s);
    ctx.arc(0, 18 * s, 34 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(24 * s, -14 * s);
    ctx.arc(0, -14 * s, 24 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-24 * s, -14 * s, 48 * s, 32 * s);
    // Amber rim light on the lower bout, brighter just after
    // a bowed strike.
    ctx.strokeStyle = hexA(AMBER, a4(0.25 + 0.5 * env));
    ctx.lineWidth = Math.max(1, 1.8 * s);
    ctx.beginPath();
    ctx.moveTo(34 * s, 18 * s);
    ctx.arc(0, 18 * s, 34 * s, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    // Neck and scroll.
    ctx.strokeStyle = hexA(INK, a4(0.95));
    ctx.lineWidth = Math.max(2, 5 * s);
    ctx.beginPath();
    ctx.moveTo(0, -34 * s);
    ctx.lineTo(-10 * s, -108 * s);
    ctx.stroke();
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(-10 * s + 6 * s, -108 * s);
    ctx.arc(-10 * s, -108 * s, 6 * s, 0, Math.PI * 2);
    ctx.fill();
    // Strings, faint.
    ctx.strokeStyle = hexA(SKIN, a4(0.35));
    ctx.lineWidth = Math.max(0.8, 1 * s);
    ctx.beginPath();
    ctx.moveTo(-4 * s, -30 * s);
    ctx.lineTo(-12 * s, -104 * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(4 * s, -30 * s);
    ctx.lineTo(-8 * s, -104 * s);
    ctx.stroke();
    ctx.restore();
  }

  // ---- Resonances ------------------------------------------------
  // Soft amber ripples on the walls, one per resonator, their
  // strength tied to resonator amplitude. During a re-tune the
  // old set fades and the new set blooms in.
  function drawResonances(t) {
    var cyc = Math.floor(t / CYCLE);
    var ct = t - cyc * CYCLE;
    var wNew = clamp(ct / RETUNE, 0, 1);
    var sets = [];
    if (wNew > 0) { sets.push([modeSetIndex(t), wNew]); }
    if (wNew < 1 && cyc > 0) { sets.push([(cyc - 1 + MODE_SETS) % MODE_SETS, 1 - wNew]); }
    var si, ri, k;
    for (si = 0; si < sets.length; si++) {
      var res = modeSet(sets[si][0]);
      var weight = sets[si][1];
      for (ri = 0; ri < res.length; ri++) {
        var r = res[ri];
        var amp = resonatorAmp(t, r, weight);
        if (amp < 0.02) { continue; }
        var a = wallAnchor(r.wall, r.s);
        // Soft bloom first, then three ripple rings.
        ctx.fillStyle = hexA(AMBER, a4(0.10 * amp));
        ctx.beginPath();
        ctx.moveTo(a[0] + L.u * 0.075, a[1]);
        ctx.ellipse(a[0], a[1], L.u * 0.075, L.u * 0.042, 0, 0, Math.PI * 2);
        ctx.fill();
        for (k = 0; k < 3; k++) {
          var rx = L.u * (0.028 + k * 0.024) * (1 + 0.12 * Math.sin((Math.PI * 2 * t) / 31 + r.phase + k));
          var ry = rx * 0.56;
          ctx.strokeStyle = hexA(AMBER, a4((0.30 - 0.08 * k) * amp));
          ctx.lineWidth = Math.max(1, L.u * 0.0022);
          ctx.beginPath();
          ctx.moveTo(a[0] + rx, a[1]);
          ctx.ellipse(a[0], a[1], rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // The scene fills the stage: walls, mouth, floor.
    drawWalls();
    drawMouth(t);
    drawFloorGlow();
    drawResonances(t);
    drawDrum(t);
    drawPlate(t);
    drawBass(t);

    // ---- Vertical side text along the left, like the Zheng Hao
    // tape cover in the caius-williams study. Reads bottom to top.
    var fsSide = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.save();
    ctx.translate(L.sideX + 2, H * 0.78);
    ctx.rotate(-Math.PI / 2);
    ctx.font = '600 ' + fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = hexA(PAPER, a4(0.72));
    ctx.fillText('T H E   U N D E R P A S S   P L A Y S', 0, 0);
    ctx.font = fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = hexA(AMBER_L, a4(0.7));
    ctx.fillText('C W 6   ·   P P 1 2 1 2', 0, fsSide + 7);
    ctx.restore();

    // ---- Plates: title top-left, number and date below it.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = PAPER;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Underpass Plays', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(AMBER_L, a4(0.9));
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1965 · 2007 · 05 · 30', 18, 18 + fsTitle * 0.8 + fsSub + 8);

    // ---- Room mode plate, bottom-right: which mode set is live.
    var modeText = 'ROOM MODE ' + (modeSetIndex(t) + 1) + ' / ' + MODE_SETS;
    ctx.font = '600 ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = hexA(PAPER, a4(0.85));
    ctx.textAlign = 'right';
    ctx.fillText(modeText, W - 18, H - 18 - fsHint - 16);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom, light text on a dark
    // pill so it stays legible over the floor.
    var hint = 'Watch the room re-tune.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(INK, a4(0.45));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(PAPER, a4(0.25));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = hexA(PAPER, a4(0.9));
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer handlers. The room plays itself on
  // its exciter schedule and re-tunes every CYCLE seconds.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1965 exposes the mode set and resonator state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1965 = {
      modeSet: function (t) { return modeSetIndex(t); },
      exciterEnv: function (t, i) { return exciterEnv(t, EXCITERS[i]); },
      resonatorAmp: function (t, setIndex, i) { return resonatorAmp(t, modeSet(setIndex)[i], 1); },
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: exciter strikes every few seconds, slow drift,
  // a re-tune every three minutes. All motion is on multi
  // second timescales, well under the 14 Hz ceiling. Guarded
  // so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
