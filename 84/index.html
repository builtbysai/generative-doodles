<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№84 · Palette Breath</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0A0805; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,255,255,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to shift the weather</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mixc(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function css(c){ return 'rgb('+Math.round(clamp(c[0],0,255))+','+Math.round(clamp(c[1],0,255))+','+Math.round(clamp(c[2],0,255))+')'; }
function cosPal(v, cols){ const x=((v%1)+1)%1; const seg=x* (cols.length-1); const i=Math.min(cols.length-2, Math.floor(seg)); return mixc(cols[i], cols[i+1], seg-i); }

// No.84 Palette Breath: exactly 3 palette sets, fbm 4 octaves, loop 24s
const SETS=[[hexRGB('#0A0805'),hexRGB('#FF8A3D'),hexRGB('#E04060')],[hexRGB('#04100F'),hexRGB('#18E0C8'),hexRGB('#9DF2E4')],[hexRGB('#120A1E'),hexRGB('#E040FB'),hexRGB('#7A5CFF')]];
const OCT=4;
let scrub=0, dragging=false, sx=0;
function hash(ix,iy){ let x=Math.sin(ix*127.1+iy*311.7)*43758.5453; return x-Math.floor(x); }
function vnoise(x,y){ const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy, sx2=smooth(fx), sy2=smooth(fy); const a=hash(ix,iy), b=hash(ix+1,iy), c=hash(ix,iy+1), d=hash(ix+1,iy+1); return a+(b-a)*sx2+(c-a)*sy2+(a-b-c+d)*sx2*sy2; }
function fbm(x,y){ let v=0, amp=0.5, f=1; for(let o=0;o<OCT;o++){ v+=amp*vnoise(x*f,y*f); f*=2.03; amp*=0.5; } return v; }
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h); const t=nowMs/1000;
  ctx.fillStyle='#0A0805'; ctx.fillRect(0,0,w,h);
  const cell=isPhone()?10:12, cols=Math.ceil(w/cell), rows=Math.ceil(h/cell);
  const sched=((t/24)%1)*3 + scrub;
  const si=Math.floor(((sched%3)+3)%3), sf=((sched%1)+1)%1;
  const palA=SETS[si], palB=SETS[(si+1)%3];
  const pal=[mixc(palA[0],palB[0],sf), mixc(palA[1],palB[1],sf), mixc(palA[2],palB[2],sf)];
  const wx=Math.sin(2*Math.PI*t/24)*0.6, wy=Math.cos(2*Math.PI*t/24)*0.6;
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    const u=((i+0.5)*cell)/Math.min(w,h), v=((j+0.5)*cell)/Math.min(w,h);
    const warp=fbm(u*2.0+wx+5.2, v*2.0+wy+1.3);
    const val=fbm(u*2.2+warp*2.2+wx, v*2.2+warp*2.2+wy);
    const vv=clamp(val*1.9-0.42+warp*0.22,0,0.999); const col=cosPal(vv, pal);
    ctx.fillStyle=css(col); ctx.fillRect(i*cell,j*cell,cell+1,cell+1);
  }
  if(SETS.length!==3||OCT!==4) console.assert(false,'sets/oct',SETS.length,OCT);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; sx=e.clientX; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; scrub+=(e.clientX-sx)/300; sx=e.clientX; });
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(8000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
