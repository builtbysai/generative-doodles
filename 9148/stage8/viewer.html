<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Streetball | Generative Doodles</title>
<style>
  html, body { margin: 0; padding: 0; background: #f3e4ce; overflow: hidden; }
  /* The canvas is centred both ways: margin auto only centres
     horizontally, which left the whole paper band at the bottom on
     tall phones (real-device check 2026-11-13: 18% blank below). */
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; }
  canvas { display: block; }
  #progress { position: fixed; bottom: 16px; left: 16px; font: 600 16px/1.3 system-ui, sans-serif;
         color: #fff; background: rgba(0,0,0,0.65); padding: 10px 14px; border-radius: 8px;
         z-index: 10; display: none; }
  /* FPS meter (?fps=1 only): a minimal diagnostic readout, bottom-left.
     The move/street HUD is gone at Hans's order — no text on the frame. */
  #fps { position: fixed; bottom: 16px; left: 16px; font: 600 13px/1.3 system-ui, sans-serif;
         color: #fff; background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 6px;
         z-index: 10; pointer-events: none; display: none; }
</style>
<script type="importmap">
{"imports": {
  "three": "../stage1/vendor/three.module.js",
  "three/addons/": "../stage1/vendor/addons/"
}}
</script>
</head><body>
<div id="fps"></div>
<div id="progress"></div>
<script type="module">
import * as THREE from 'three';
import { createPlayer } from '../stage1/player-model.js';
import { createPoser } from '../stage2/pose.js';
import { createRoutine, BEAT } from '../stage2/routine.js';
import { createBallDrive, evalFree } from '../stage3/ball-drive.js';
import { makeBrushTexture, makeToonGradient, makeHull, makeHalftoneShadow, updateHullUniforms } from '../stage4/look.js';
import { createStrokeMesh, createBallStrokeMesh } from '../stage4/strokes.js';
import { createLensPass, fisheyeParams } from '../stage4/lens.js';
import { createSceneManager, BEATS_PER_STREET } from '../stage5/scene.js';
import { createBeatClock } from '../stage6/beat-clock.js';
import { createAudioEngine } from '../stage6/audio.js';
import { createDirector } from '../stage7/director.js';
import { createSettings, loopBeat, DEFAULT_SETTINGS } from './settings.js';
import { buildPanel } from './panel.js';
import { createExporter } from './export.js';
import { savePreset, loadPreset } from './presets.js';
import { installMeasure8 } from './measure-8.js';

const params = new URLSearchParams(location.search);
const autoSound = params.get('sound') === '1';
const showFps = params.get('fps') === '1';
const qualityParam = params.get('quality'); // high, low or auto (default)
const staticBeat = params.get('beat') !== null ? parseFloat(params.get('beat')) : null;
const streetParam = params.get('street');
const formatParam = params.get('format');

// Mobile fill rate is a major cost for the painted layers, outlines,
// post-pass and shadows. Cap at 1.5x on small touch devices; retain full
// desktop quality and the exporter's explicit full-resolution override.
const smallTouch = window.matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 700;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
const gl = renderer.getContext();
const debugRenderer = gl.getExtension('WEBGL_debug_renderer_info');
const rendererName = debugRenderer ? gl.getParameter(debugRenderer.UNMASKED_RENDERER_WEBGL) : '';
const softwareGL = /swiftshader|llvmpipe|software/i.test(rendererName);
const lowCost = qualityParam === 'low' || (qualityParam !== 'high' && (smallTouch || softwareGL));
const maxPixelRatio = qualityParam === 'low' ? 1 : Math.min(window.devicePixelRatio || 1, smallTouch ? 1.5 : 2);
renderer.setPixelRatio(maxPixelRatio);
renderer.shadowMap.enabled = !lowCost;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Stage 13d: the fisheye lens post pass. At strength 0 the viewer
// renders directly (the exact 13c path); above 0 the scene renders
// through the lens (see renderFrame).
const lensPass = createLensPass({ renderer, lowCost });

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 16 / 9, 0.1, 100);
const hemi = new THREE.HemisphereLight(0xffffff, 0x666666, 0.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(3, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(lowCost ? 1024 : 2048, lowCost ? 1024 : 2048);
sun.shadow.camera.left = -3; sun.shadow.camera.right = 3;
sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -1;
sun.shadow.camera.far = 20;
scene.add(sun);

const sceneManager = createSceneManager({ scene, camera, sun, hemi });

const brushTex = makeBrushTexture({
  size: DEFAULT_SETTINGS.strokeSize,
  density: DEFAULT_SETTINGS.density,
  disorder: DEFAULT_SETTINGS.disorder,
});
const toonGrad = makeToonGradient();
const player = createPlayer();
scene.add(player.group);
const poser = createPoser(player);
const routine = createRoutine(player, poser);
const ballDrive = createBallDrive(player, poser, routine);

const heroMesh = player.group.getObjectByName('playerMesh');
heroMesh.material = new THREE.MeshToonMaterial({
  vertexColors: true, map: brushTex, gradientMap: toonGrad,
});
player.ball.material = new THREE.MeshToonMaterial({
  map: player.ball.material.map, gradientMap: toonGrad,
});
const heroHull = makeHull(heroMesh, { erode: true });
const ballHull = makeHull(player.ball, { erode: true });
// Ensure the initial frame and the open-settings values match exactly.
heroHull.material.color.set('#263348');
ballHull.material.color.set('#263348');
const initialErode = 2 * 0.78 - DEFAULT_SETTINGS.disorder;
heroHull.material.userData.uErode.value = initialErode;
ballHull.material.userData.uErode.value = initialErode;
player.group.add(heroHull);
player.ball.add(ballHull);
// Stage 13c: brush strokes as geometry — a skinned stroke mesh sharing
// the player's skeleton, layered over the UV brush texture. Rebuilt
// when the kit changes (below): the strokes sample the vertex colours
// at build time, so a recolour without a rebuild leaves stale colours.
let strokeMesh = createStrokeMesh(player, { lightDir: sun.position.clone().normalize() });
player.group.add(strokeMesh);
// Stage 13d: the ball's brush strokes — a plain stroke mesh parented
// to the ball, so it rides the spin, the bounces, and every
// re-parenting exactly. Rebuilt when the ball colour changes (below).
let ballStrokeMesh = createBallStrokeMesh(player, { lightDir: sun.position.clone().normalize() });
player.ball.add(ballStrokeMesh);
updateHullUniforms(heroHull, camera, window.innerHeight * renderer.getPixelRatio());
updateHullUniforms(ballHull, camera, window.innerHeight * renderer.getPixelRatio());
const halftone = makeHalftoneShadow(sun, { dotScale: 200 });
halftone.material.uniforms.uInk.value.set('#263348');
halftone.visible = !lowCost;
scene.add(halftone);

// Small/software GPUs: painted contact shadows instead of a fullscreen
// shadow map and multi-tap PCF. The three shadows follow planted feet
// and the basketball's solved world position.
const contactShadows = [];
if (lowCost) {
  const sc = document.createElement('canvas');
  sc.width = sc.height = 128;
  const sg = sc.getContext('2d');
  const ink = sg.createRadialGradient(64,64,5,64,64,62);
  ink.addColorStop(0,'rgba(32,45,66,0.48)');
  ink.addColorStop(0.48,'rgba(32,45,66,0.25)');
  ink.addColorStop(1,'rgba(32,45,66,0)');
  sg.fillStyle=ink;sg.fillRect(0,0,128,128);
  const tex = new THREE.CanvasTexture(sc);
  const geometry = new THREE.PlaneGeometry(1,1);
  for (let i=0;i<3;i++) {
    const m=new THREE.Mesh(geometry,new THREE.MeshBasicMaterial({
      map:tex,transparent:true,depthWrite:false,opacity:0.8,
      side:THREE.DoubleSide,
    }));
    m.rotation.x=-Math.PI/2;
    m.position.y=0.015+i*0.001;
    m.renderOrder=1;
    scene.add(m);contactShadows.push(m);
  }
}
function updateContactShadows(beat) {
  if (!contactShadows.length) return;
  const p=routine.interpolate(beat);
  for (let i=0;i<2;i++) {
    const f=p.feet[i===0?'L':'R'],m=contactShadows[i];
    m.position.set(f[0],0.015+i*0.001,f[2]);
    const raised=Math.max(0,f[1]-0.105);
    m.scale.set(0.38+raised*0.7,0.30+raised*0.5,1);
    m.material.opacity=0.86*Math.max(.35,1-raised*7);
  }
  const b=player.ball.position,h=Math.max(0,b.y-0.12);
  const m=contactShadows[2];
  m.position.set(b.x,0.017,b.z);
  m.scale.set(0.40+0.20*h,0.32+0.17*h,1);
  m.material.opacity=0.92*Math.max(.12,1-h/1.45);
}

// One tiny animated chalk-ring at a real floor collision. The mark expands
// and vanishes; it is driven from the same solved bounce time as the ball.
const impactMat = new THREE.MeshBasicMaterial({
  color: 0xffe7c0, transparent: true, opacity: 0,
  depthWrite: false, side: THREE.DoubleSide,
});
const impactRing = new THREE.Mesh(new THREE.RingGeometry(0.15, 0.164, 48), impactMat);
impactRing.rotation.x = -Math.PI / 2;
impactRing.renderOrder = 3;
impactRing.visible = false;
scene.add(impactRing);
function updateImpact(beat) {
  const s = ballDrive.segAt(beat);
  impactRing.visible = false;
  if (s.kind !== 'bounce') return;
  const dt = (beat - s.t0) * BEAT - s.tB;
  if (dt < 0 || dt > 0.19) return;
  const u = dt / 0.19;
  const hit = evalFree(s, s.tB);
  impactRing.visible = true;
  impactRing.position.set(hit.x, 0.022, hit.z);
  impactRing.scale.setScalar(1 + 1.45 * u);
  impactMat.opacity = 0.48 * (1 - u) * (1 - u);
}

const clock = createBeatClock({ bpm: 144 });
const audio = createAudioEngine({ clock, ballDrive, routine });
const director = createDirector({ camera, player, routine, sceneManager });
const settings = createSettings({
  player, heroMesh, ballMesh: player.ball, heroHull, ballHull, halftone,
  clock, audio, director, sceneManager, camera, renderer, sun, hemi,
});
const exporter = createExporter({ renderer, clock, renderFrame, audio });

// Format: the largest rect of the format's aspect fitting the window.
// The canvas is centred (CSS margin auto); the paper colour shows
// around it. The camera aspect follows the format, so the stage
// reframes without stretching.
const FORMATS = { '16:9': 16 / 9, '9:16': 9 / 16, '1:1': 1, '4:5': 4 / 5 };
function applyFormat(format) {
  const aspect = FORMATS[format] || FORMATS['16:9'];
  const W = window.innerWidth, H = window.innerHeight;
  let w = W, h = Math.round(W / aspect);
  if (h > H) { h = H; w = Math.round(H * aspect); }
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  // The hull shader's viewport height is in DRAWING-BUFFER pixels
  // (CSS height x pixel ratio), or the outlines thicken with DPR.
  updateHullUniforms(heroHull, camera, h * renderer.getPixelRatio());
  updateHullUniforms(ballHull, camera, h * renderer.getPixelRatio());
  return { w, h };
}
let formatSize = applyFormat(settings.get().format);
// Auto-pick the format from the viewport (portrait -> 9:16, landscape
// -> 16:9), unless the user has chosen one in the panel or the URL
// names one. The default 16:9 on a portrait phone letterboxes the
// piece into the top quarter of the screen (Stage 9 Pixel 5 shot);
// 9:16 fills it. autoFormatting marks the viewer's own set() calls so
// they don't count as a user choice.
let formatUserChosen = false;
let autoFormatting = false;
settings.onChange((s, changed) => {
  if (changed.includes('format')) {
    if (!autoFormatting) formatUserChosen = true;
    formatSize = applyFormat(s.format);
  }
  // The ball strokes sample the seam texture at build time; a colour
  // change regenerates the texture, so the strokes are rebuilt to
  // match (the recolour already applied synchronously in set()).
  if (changed.includes('ball')) {
    player.ball.remove(ballStrokeMesh);
    ballStrokeMesh.geometry.dispose();
    ballStrokeMesh.material.dispose();
    ballStrokeMesh = createBallStrokeMesh(player, { lightDir: sun.position.clone().normalize() });
    player.ball.add(ballStrokeMesh);
  }
  // The character strokes sample the vertex colours at build time; a
  // kit change rewrites those colours, so the strokes are rebuilt to
  // match (the recolour already applied synchronously in set()).
  // Deterministic sampling, so the rebuild keeps the identical layout.
  if (changed.includes('kit')) {
    player.group.remove(strokeMesh);
    strokeMesh.material.uniforms.uMap.value.dispose();
    strokeMesh.geometry.dispose();
    strokeMesh.material.dispose();
    strokeMesh = createStrokeMesh(player, { lightDir: sun.position.clone().normalize() });
    player.group.add(strokeMesh);
  }
});
if (!formatParam && window.innerHeight > window.innerWidth) {
  autoFormatting = true;
  settings.set({ format: '9:16' });
  autoFormatting = false;
  formatSize = applyFormat(settings.get().format);
}
if (formatParam) {
  settings.set({ format: formatParam });
  formatSize = applyFormat(settings.get().format);
}
window.addEventListener('resize', () => {
  if (!formatUserChosen) {
    const want = window.innerHeight > window.innerWidth ? '9:16' : '16:9';
    if (settings.get().format !== want) {
      autoFormatting = true;
      settings.set({ format: want });
      autoFormatting = false;
    }
  }
  formatSize = applyFormat(settings.get().format);
});

// Camera modes: director (Stage 7), tracking (the Stage 5/6 orbit),
// fixed (static front). The scene manager gets the actual azimuth in
// every mode so the landmark stays behind the character.
function driveCamera(beat, routineBeat) {
  const mode = settings.get().cameraMode;
  if (mode === 'director') {
    director.update(beat, routineBeat);
  } else if (mode === 'tracking') {
    const az = sceneManager.cameraAzimuth(beat);
    camera.position.set(Math.sin(az) * 6, 2.1, Math.cos(az) * 6);
    camera.lookAt(0, 1.35, 0);
    camera.fov = 40;
    camera.updateProjectionMatrix();
    sceneManager.update(beat);
  } else { // fixed
    camera.position.set(0, 1.9, 6);
    camera.lookAt(0, 0.95, 0);
    camera.fov = 40;
    camera.updateProjectionMatrix();
    sceneManager.update(beat, 0);
  }
}

const _dbSize = new THREE.Vector2();
function renderFrame(beat, render = true) {
  const routineBeat = loopBeat(beat, settings.get().routine);
  // The ball drive poses the character itself. Calling routine.update()
  // first posed every bone twice and repeatedly re-parented the ball.
  ballDrive.update(routineBeat);
  updateImpact(routineBeat);
  updateContactShadows(routineBeat);
  driveCamera(beat, routineBeat);
  // The lighting override applies AFTER the scene manager's per-frame
  // lighting (otherwise the per-street lighting overwrites it).
  settings.applyLighting();
  // Stage 13d fisheye: the lens needs a wider source fov (the warp
  // pulls the edges inward, so the scene must render past the
  // original frame). The boost scales with strength, so strength 0
  // leaves the shot's fov untouched. The director resets camera.fov
  // to the shot's fov next frame (its `!== shot.fov` check), so the
  // boost is re-applied fresh every frame, never compounded.
  const s = settings.get();
  const fStrength = s.fisheye ? s.fisheyeStrength : 0;
  let fMag = 1;
  if (fStrength > 0) {
    const fp = fisheyeParams(fStrength);
    camera.fov *= fp.fovBoost;
    camera.updateProjectionMatrix();
    fMag = fp.mag;
  }
  // The hull width math reads uProj11 from the camera's projection
  // matrix: it must track the shot's fov (and the fisheye boost), so
  // it is refreshed every frame now, not just on resize. The height
  // comes from the live drawing buffer, which is also correct during
  // an export (1920x1080 at pixel ratio 1).
  renderer.getDrawingBufferSize(_dbSize);
  updateHullUniforms(heroHull, camera, _dbSize.y);
  updateHullUniforms(ballHull, camera, _dbSize.y);
  camera.updateMatrixWorld();
  if (ballHull.parent !== player.ball.parent) player.ball.parent.add(ballHull);
  ballHull.position.copy(player.ball.position);
  ballHull.quaternion.copy(player.ball.quaternion);
  ballHull.scale.copy(player.ball.scale);
  // Match the shadow material to this frame's light, not the previous one.
  halftone.userData.updateFromLight();
  if (render) {
    if (fStrength > 0) {
      lensPass.render(scene, camera, { strength: fStrength, fovDeg: camera.fov, mag: fMag });
    } else {
      renderer.render(scene, camera);
    }
  }
  return { routineBeat };
}

const fpsEl = document.getElementById('fps');
const progress = document.getElementById('progress');

function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}

let exporting = false;
async function onExport() {
  if (exporting) return;
  exporting = true;
  progress.style.display = 'block';
  progress.textContent = `Exporting clip (0.0 / 30 s, ${exporter.mimeType})...`;
  // The export is 1920x1080 (16:9): set the camera aspect for it, or
  // the frames stretch. Restored afterwards.
  const prevAspect = camera.aspect;
  camera.aspect = 16 / 9;
  camera.updateProjectionMatrix();
  // The export renders at 1920x1080 with pixel ratio 1: the hull
  // uniforms need the export buffer height (1080), or the outlines
  // come out at the live canvas's thickness. Restored afterwards.
  updateHullUniforms(heroHull, camera, 1080);
  updateHullUniforms(ballHull, camera, 1080);
  try {
    const { blob, mimeType, durationMs } = await exporter.exportClip({
      seconds: 30, width: 1920, height: 1080,
      onProgress: (s) => {
        // exporter.mimeType (the exporter's property), NOT the
        // destructured `mimeType` below — the callback fires during
        // exportClip, before the destructuring assignment runs, so
        // the local is in the temporal dead zone (116 ReferenceErrors
        // in the first shot-8 run).
        progress.textContent = `Exporting clip (${s.toFixed(1)} / 30 s, ${exporter.mimeType})...`;
      },
    });
    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
    downloadBlob(blob, `freestyle-basketball.${ext}`);
    progress.textContent = `Exported ${(blob.size / 1048576).toFixed(1)} MB ${ext.toUpperCase()} in ${(durationMs / 1000).toFixed(1)} s.`;
    setTimeout(() => { progress.style.display = 'none'; }, 6000);
    return { blob, mimeType, durationMs };
  } catch (e) {
    progress.textContent = `Export failed: ${e.message}`;
    setTimeout(() => { progress.style.display = 'none'; }, 6000);
    throw e;
  } finally {
    camera.aspect = prevAspect;
    camera.updateProjectionMatrix();
    updateHullUniforms(heroHull, camera, formatSize.h * renderer.getPixelRatio());
    updateHullUniforms(ballHull, camera, formatSize.h * renderer.getPixelRatio());
    exporting = false;
  }
}

function onSavePreset() {
  const json = savePreset(settings);
  downloadBlob(new Blob([json], { type: 'application/json' }), 'freestyle-preset.json');
}

async function onLoadPreset(file) {
  const text = await file.text();
  const res = loadPreset(text, settings);
  if (!res.ok) {
    progress.style.display = 'block';
    progress.textContent = `Preset failed: ${res.error}`;
    setTimeout(() => { progress.style.display = 'none'; }, 4000);
  }
  return res;
}

const panel = buildPanel(settings, document.body, { onExport, onSavePreset, onLoadPreset },
  // On a narrow viewport the open panel covers the whole portrait
  // stage — start collapsed there (the user taps Settings to open it).
  { startCollapsed: true });

let lastBeat = -1;
if (staticBeat !== null) {
  const beat = streetParam !== null
    ? parseInt(streetParam, 10) * BEATS_PER_STREET + staticBeat : staticBeat;
  renderFrame(beat);
  // No HUD: the frame carries no text (Hans's order).
} else {
  clock.start();
  if (autoSound) void audio.enable();
  // The first rAF frame computes the full pose deterministically.
  // FPS meter (?fps=1): the viewer's own rAF rate, a 60 s rolling
  // average, and the lowest 1 s bucket — readable off a screenshot,
  // so the real-device fps check needs no devtools.
  let fpsFrames = 0, fpsLast = performance.now(), fpsCur = 0;
  const fpsBuckets = [];
  let slowSeconds = 0, fastSeconds = 0, lastResolutionChange = 0;
  function frame(now) {
    // Stage 13e: the beat comes from the audio clock (beatNow), not
    // the rAF timestamp. While an export runs, the live loop skips
    // rendering entirely — the exporter steps the frames itself, and
    // the clock is stopped for the export's duration.
    if (!exporting) {
      const beat = clock.beatNow();
      const { routineBeat } = renderFrame(beat);
      fpsFrames++;
      const dt = now - fpsLast;
      if (dt >= 1000) {
        fpsCur = Math.round((fpsFrames * 1000) / dt);
        fpsBuckets.push(fpsCur);
        if (fpsBuckets.length > 60) fpsBuckets.shift();
        fpsFrames = 0;
        fpsLast = now;
        // Adapt only the framebuffer resolution after sustained load.
        // Keep all brush geometry, lighting and camera effects intact.
        // Never interfere with offline export or hidden-tab throttling.
        if (!exporting && qualityParam !== 'high' && document.visibilityState === 'visible') {
          slowSeconds = fpsCur < 33 ? slowSeconds + 1 : 0;
          fastSeconds = fpsCur > 56 ? fastSeconds + 1 : 0;
          const ratio = renderer.getPixelRatio();
          if (now - lastResolutionChange > 4000 && slowSeconds >= 3 && ratio > 1.01) {
            renderer.setPixelRatio(Math.max(1, Math.round((ratio - 0.25) * 100) / 100));
            formatSize = applyFormat(settings.get().format);
            slowSeconds = 0;
            lastResolutionChange = now;
          } else if (now - lastResolutionChange > 12000 && fastSeconds >= 12 && ratio + 0.01 < maxPixelRatio) {
            renderer.setPixelRatio(Math.min(maxPixelRatio, ratio + 0.25));
            formatSize = applyFormat(settings.get().format);
            fastSeconds = 0;
            lastResolutionChange = now;
          }
        }
      }
      if (Math.floor(beat) !== Math.floor(lastBeat)) {
        // No HUD: the frame carries no text (Hans's order). Only the
        // ?fps=1 diagnostic readout updates, bottom-left.
        if (showFps && fpsBuckets.length) {
          const avg = Math.round(fpsBuckets.reduce((a, b) => a + b, 0) / fpsBuckets.length);
          const low = Math.min(...fpsBuckets);
          fpsEl.style.display = 'block';
          fpsEl.textContent = `fps ${fpsCur} · avg ${avg} · low ${low} · ${fpsBuckets.length}s · ${renderer.getPixelRatio().toFixed(2)}x`;
        }
      }
      lastBeat = beat;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

window.__stage8 = { THREE, player, poser, routine, ballDrive, sceneManager, clock, audio, director, settings, panel, exporter, heroHull, ballHull, halftone, heroMesh, lensPass, renderer, scene, camera, sun, hemi, impactRing, renderFrame, applyFormat, onExport, onSavePreset, onLoadPreset, formatSize: () => formatSize, get strokeMesh() { return strokeMesh; }, get ballStrokeMesh() { return ballStrokeMesh; } };
window.__measure8 = installMeasure8({ THREE, player, poser, routine, ballDrive, sceneManager, clock, audio, director, settings, exporter, heroMesh, heroHull, ballHull, halftone, renderer, scene, camera, sun, hemi, renderFrame, applyFormat, onExport });
window.__ready = true;
</script>
</body></html>
