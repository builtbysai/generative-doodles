<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Correct Time</title>
<style>
  html, body { margin:0; padding:0; background:#1A1A24; height:100%; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

// ---------- The Correct Time — Jeff Kolar study JK6 ----------
// A minimal astronomical clock on a 60 s loop. A sun dot travels a thin
// ecliptic ring; a horizontal equator line crosses the ring's centre.
// The loop has three states: BEFORE (pale dawn, particles rising), the
// CROSSING (36 s <= lt < 39 s: the whole field inverts to white for one
// held 3 s beat while the sun sits exactly on the equator), and AFTER
// (deep blue dark, particles sinking). Kolar's work began on the
// autumnal equinox at 8:03 PM CST; the crossing this piece marks is the
// descending (autumnal) passage, and it is held, not flashed.
//
// Sun angle: theta(lt) = 2*pi*(tau(lt) - 36)/57, where tau is sun-time:
// tau advances with loop time outside the crossing window and is held
// at 36 inside it (tau = lt for lt < 36; 36 for 36 <= lt < 39; lt - 3
// after). At tau = 36, theta = 0, so the sun sits at (cx + R, cy) with
// sin(theta) = 0: its y equals the centre y exactly, on the equator
// line, for the full 3 s window. Just before theta = 0 the sun is above
// the line (sin < 0), just after below it: a north-to-south, descending
// passage. The sun's rate is 2*pi per 57 s of sun-time; the 3 held
// seconds are the piece's subject, not motion.
//
// Particles: one seeded field of 120. Each particle's height is a
// piecewise integral over absolute time: y = wrap(y0 - vr*Tb + vs*Ta),
// where Tb is total seconds spent in BEFORE and Ta total seconds in
// AFTER. Neither integral grows during the crossing, so the field
// freezes mid-inversion; positions are continuous at every switch and
// across the loop seam. Dragging tilts the ring group up to 8 degrees;
// on release the tilt springs back exponentially. The crossing still
// happens, just re-angled. Time itself is never user-controlled.
// Silent: the equinox is drawn, never heard.

var LOOP = 60;          // seconds per loop
var CROSS = 36;         // crossing begins (60% mark)
var CROSS_END = 39;     // crossing ends (3 s held beat)
var T0 = 37.5;          // fixed first-frame phase: mid-crossing

var BG    = { before:'#1A1A24', cross:'#FFFFFF', after:'#050507' };
var RINGC = { before:'#8A8A93', cross:'#000000', after:'#4D9FFF' };
var PARTC = { before:'#E8DCC8', cross:'#26262E', after:'#3A4A6B' };
var SUNC  = { before:'#E8DCC8', cross:'#000000', after:'#4D9FFF' };
var READC = { before:'#8A8A93', cross:'#26262E', after:'#8A8A93' };

var SEED = 1189036;

// ---------- seeded rng ----------
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- particle field ----------
var PARTICLES = (function(){
  var rng = mulberry32(SEED);
  var arr = [];
  for (var i = 0; i < 120; i++){
    arr.push({
      x0: 0.02 + 0.96 * rng(),        // fraction of W
      y0: rng(),                      // fraction of H
      vr: 0.0020 + 0.0035 * rng(),    // rising speed, u/s (BEFORE)
      vs: 0.0016 + 0.0030 * rng(),    // sinking speed, u/s (AFTER)
      swayAmp: 0.004 + 0.008 * rng(), // u
      swayW: 0.15 + 0.35 * rng(),     // rad per active second
      swayP: rng() * Math.PI * 2,
      r: 0.0016 + 0.0016 * rng()      // dot radius, u
    });
  }
  return arr;
})();

// ---------- time model ----------
// lt: loop time; state: 'before' | 'cross' | 'after';
// tb / ta: total seconds of BEFORE / AFTER elapsed at absolute time t;
// tau: sun-time within the loop (held at CROSS during the crossing).
function timeModel(t){
  var lt = t % LOOP;
  var loops = Math.floor(t / LOOP);
  var state = lt < CROSS ? 'before' : (lt < CROSS_END ? 'cross' : 'after');
  var tb = loops * CROSS + Math.min(lt, CROSS);
  var ta = loops * (LOOP - CROSS_END) + Math.max(0, lt - CROSS_END);
  var tau = lt < CROSS ? lt : (lt < CROSS_END ? CROSS : lt - (CROSS_END - CROSS));
  return { lt: lt, state: state, tb: tb, ta: ta, tau: tau };
}
function sunTheta(tau){
  return 2 * Math.PI * (tau - CROSS) / (LOOP - (CROSS_END - CROSS));
}

// ---------- tilt (recorded drag state; draw stays a function of it) ----------
var tiltDrag = null;  // {startX, startTilt, target}
var tiltRel = null;   // {t, tilt}
var MAXTILT = 8 * Math.PI / 180;
function tiltAt(t){
  if (tiltDrag) return tiltDrag.target;
  if (tiltRel){
    var v = tiltRel.tilt * Math.exp(-(t - tiltRel.t) / 1.2);
    return Math.abs(v) < 1e-5 ? 0 : v;
  }
  return 0;
}

// ---------- view / canvas ----------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, lastT = T0;

function viewW(){
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  if (vv && vv.width) return vv.width;
  return window.innerWidth || 800;
}
function viewH(){
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  if (vv && vv.height) return vv.height;
  return window.innerHeight || 800;
}
function isPhone(){
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw || 9999, sh || 9999);
  if (mn < 700) return true;
  return H > W * 1.15;
}
function fit(){
  W = viewW(); H = viewH();
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}
if (window.visualViewport && window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize', function(){ fit(); draw(lastT); });
}
if (window.addEventListener){
  window.addEventListener('resize', function(){ fit(); draw(lastT); });
}

function wrapY(y){
  var m = y % H;
  return m < 0 ? m + H : m;
}

// ---------- draw ----------
function draw(t){
  lastT = t;
  var u = Math.min(W, H);
  var tm = timeModel(t);
  var state = tm.state;

  ctx.fillStyle = BG[state];
  ctx.fillRect(0, 0, W, H);

  // particles: rise in BEFORE, frozen in CROSSING, sink in AFTER
  ctx.fillStyle = PARTC[state];
  var active = tm.tb + tm.ta;
  for (var i = 0; i < PARTICLES.length; i++){
    var p = PARTICLES[i];
    var y = wrapY(p.y0 * H - p.vr * u * tm.tb + p.vs * u * tm.ta);
    var x = p.x0 * W + Math.sin(active * p.swayW + p.swayP) * p.swayAmp * u;
    var r = Math.max(1, p.r * u);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // ring group (ring + equator + sun), tilted as one body around centre
  var cx = W / 2, cy = H / 2;
  var R = Math.min(0.35 * W, 0.44 * H);
  var tilt = tiltAt(t);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);

  ctx.strokeStyle = RINGC[state];
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-R, 0);
  ctx.lineTo(R, 0);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.lineWidth = Math.max(1, 0.0022 * u);
  ctx.beginPath();
  ctx.moveTo(R, 0);
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.stroke();

  // sun: theta = 0 during the whole crossing window (sun-time held)
  var th = sunTheta(tm.tau);
  var sx = R * Math.cos(th), sy = R * Math.sin(th);
  var sr = Math.max(3, 0.043 * R);   // = 1.5% of width when R = 0.35 W
  ctx.fillStyle = SUNC[state];
  ctx.beginPath();
  ctx.moveTo(sx + sr, sy);
  ctx.arc(sx, sy, sr, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // readout
  var label;
  if (state === 'before') label = 'T-minus ' + Math.ceil(CROSS - tm.lt) + 's';
  else if (state === 'cross') label = 'EQUINOX';
  else label = 'T-plus ' + Math.floor(tm.lt - CROSS_END) + 's';
  ctx.fillStyle = READC[state];
  ctx.font = Math.max(11, Math.round(0.019 * u)) + 'px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  var baseY = H - Math.max(14, 0.02 * u);   // below the ring at every aspect
  if (isPhone()) baseY = H - Math.max(16, 0.022 * u);
  ctx.fillText(label, cx, baseY);
}

// ---------- interaction: drag tilts the ecliptic (time is not touched) ----------
function ptrDown(x){
  tiltDrag = { startX: x, startTilt: tiltAt(lastT), target: tiltAt(lastT) };
  tiltRel = null;
  draw(lastT);
}
function ptrMove(x){
  if (!tiltDrag) return;
  var span = Math.max(1, W / 2);
  var v = tiltDrag.startTilt + (x - tiltDrag.startX) / span * MAXTILT;
  tiltDrag.target = Math.max(-MAXTILT, Math.min(MAXTILT, v));
  draw(lastT);
}
function ptrUp(){
  if (!tiltDrag) return;
  tiltRel = { t: lastT, tilt: tiltAt(lastT) };
  tiltDrag = null;
  draw(lastT);
}
if (canvas.addEventListener){
  canvas.addEventListener('pointerdown', function(e){ ptrDown(e.clientX || 0); });
  canvas.addEventListener('pointermove', function(e){ ptrMove(e.clientX || 0); });
  canvas.addEventListener('pointerup', ptrUp);
  canvas.addEventListener('mousedown', function(e){ ptrDown(e.clientX || 0); });
  canvas.addEventListener('mousemove', function(e){ ptrMove(e.clientX || 0); });
  canvas.addEventListener('mouseup', ptrUp);
  canvas.addEventListener('touchstart', function(e){
    if (e.touches && e.touches[0]) ptrDown(e.touches[0].clientX || 0);
  });
  canvas.addEventListener('touchmove', function(e){
    if (e.touches && e.touches[0]) ptrMove(e.touches[0].clientX || 0);
  });
  canvas.addEventListener('touchend', ptrUp);
}

// ---------- run ----------
function clockNow(){
  if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
  return Date.now() / 1000;
}
fit();
draw(T0);
var boot = clockNow();
function frame(){
  draw(T0 + (clockNow() - boot));
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
