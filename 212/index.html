<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.212 Station 46246</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#060809; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.212 Station 46246 (David Bowen). A suspended lattice of wooden
// rods on near invisible threads, driven by a simulated NOAA buoy:
// the buoy reports only wave height H and period T, and every rod
// answers the same wave a fraction later than its neighbour (0.35
// radians of phase delay per rod, the multi-motor trick). The
// lattice is the ocean. Every minute the sea state changes; about
// every three minutes the buoy goes missing for five seconds and
// the lattice settles, waiting. Tap to force the next sea state
// early; double tap to skip straight to storm.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#060809';
var ROD = '#D8B46A', THREAD = '#1A1C1E', STUB = '#4A4A4E', CREST = '#F0D488';
var W = 0, H = 0, phone = false;
var seed = 212212;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
var T = 14, lastNow = -1; // clock starts mid-wave, frame one developed

// ---- the buoy ------------------------------------------------------------------
// Sea states: the buoy reports height and period; the machine eases
// between reports over eight seconds. About every three minutes the
// report freezes for five seconds: the wave stalls and dies down.
var STATES = [
  { name: 'choppy', H: 0.45, T: 6.5 },
  { name: 'mirror', H: 0.13, T: 13.0 },
  { name: 'choppy', H: 0.55, T: 5.6 },
  { name: 'storm',  H: 1.00, T: 3.6 },
  { name: 'swell',  H: 0.62, T: 9.0 },
  { name: 'mirror', H: 0.16, T: 12.0 }
];
var SEA_LEN = 60, BLEND = 8;
var seaIx = 0, seaStart = -40; // frame one: deep in the choppy report
function seaParams() {
  var cur = STATES[seaIx % STATES.length];
  var prev = STATES[(seaIx + STATES.length - 1) % STATES.length];
  var k = clamp((T - seaStart) / BLEND, 0, 1); k = k * k * (3 - 2 * k);
  return {
    H: lerp(prev.H, cur.H, k),
    T: lerp(prev.T, cur.T, k),
    slack: lerp(prev.name === 'storm' ? 1 : 0, cur.name === 'storm' ? 1 : 0, k)
  };
}
function lostBuoy() {
  var cyc = (T - 150) % 190; if (cyc < 0) cyc += 190;
  return cyc < 5 ? cyc : -1; // seconds into the freeze, or -1
}
var COLS = 17, ROWS = 3, PHASE_D = 0.35;
var phase = 2.2; // wave phase, integrated so period changes stay smooth
var colLag = []; // per-column erratic lag, active only under slack threads
for (var ci = 0; ci < COLS; ci++) colLag.push({ a: rand() * 6.28, f: 0.7 + rand() * 1.3, m: 0.25 + rand() * 0.6 });

// ---- input ----------------------------------------------------------------------
var pendingTap = -1, lastDownT = -9;
function advanceSea() { seaIx++; seaStart = T; }
function skipToStorm() {
  var steps = (3 - (seaIx % STATES.length) + STATES.length) % STATES.length;
  seaIx += steps; seaStart = T;
}
canvas.addEventListener('pointerdown', function (e) {
  if (T - lastDownT < 0.35 && pendingTap >= 0) {
    pendingTap = -1;
    skipToStorm();
  } else {
    pendingTap = T; // commits as a single tap if no second lands
  }
  lastDownT = T;
});

// ---- resize ---------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing ----------------------------------------------------------------------
function draw(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  // automatic buoy reports
  while (T - seaStart >= SEA_LEN) { seaIx++; seaStart += SEA_LEN; }
  // a lone tap commits once the double-tap window has passed
  if (pendingTap >= 0 && T - pendingTap > 0.35) { advanceSea(); pendingTap = -1; }
  var SEA = seaParams();
  var lost = lostBuoy();
  var ampH = SEA.H;
  if (lost >= 0) ampH *= Math.exp(-lost * 0.9);   // the lattice settles
  if (lost < 0) phase += dt * 6.28318 / Math.max(1.2, SEA.T); // frozen while lost
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var x0 = W * 0.10, x1 = W * 0.90;
  var latTop = H * 0.30, latBot = H * 0.56;      // lattice band
  var amp = ampH * H * 0.085;                    // wave amplitude in px
  var rodLen = (x1 - x0) / COLS * 0.86;
  var lw = Math.max(1.4, H * 0.0042);
  ctx.lineCap = 'round';
  for (var r = 0; r < ROWS; r++) {
    var baseY = lerp(latTop, latBot, ROWS === 1 ? 0 : r / (ROWS - 1));
    for (var c = 0; c < COLS; c++) {
      var cx = lerp(x0 + rodLen * 0.55, x1 - rodLen * 0.55, COLS === 1 ? 0.5 : c / (COLS - 1));
      // one wave, per-column delay; rows share the wave, slightly scaled
      var ph = phase - c * PHASE_D - r * 0.55;
      var y = Math.sin(ph) * amp * (0.82 + r * 0.12);
      // slack threads: in storm a few columns lag erratically
      if (SEA.slack > 0.02) {
        var lag = Math.sin(T * colLag[c].f + colLag[c].a) * amp * 0.35 * colLag[c].m * SEA.slack;
        y += lag * (0.5 + 0.5 * Math.sin(ph * 0.5));
      }
      var ry = baseY + y;
      // motor stub above: bobs with the same wave, ahead of the rod
      var stubY = H * 0.135 + r * H * 0.028 + Math.sin(phase - c * PHASE_D + 0.9) * amp * 0.4;
      var stubH = H * 0.055;
      // threads: from stub down to both rod ends, nearly invisible
      ctx.strokeStyle = THREAD;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - rodLen / 2, stubY + stubH);
      ctx.lineTo(cx - rodLen / 2, ry);
      ctx.moveTo(cx + rodLen / 2, stubY + stubH);
      ctx.lineTo(cx + rodLen / 2, ry);
      ctx.stroke();
      // motor stub
      ctx.strokeStyle = STUB;
      ctx.lineWidth = Math.max(1.4, lw * 1.15);
      ctx.beginPath();
      ctx.moveTo(cx, stubY);
      ctx.lineTo(cx, stubY + stubH);
      ctx.stroke();
      // the rod
      ctx.strokeStyle = ROD;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(cx - rodLen / 2, ry);
      ctx.lineTo(cx + rodLen / 2, ry);
      ctx.stroke();
      // crest highlight: the upper edge catches light near the crest
      var crestK = clamp((Math.sin(ph) + 0.35) / 1.35, 0, 1);
      if (crestK > 0.25) {
        ctx.strokeStyle = CREST;
        ctx.globalAlpha = (crestK - 0.25) * 0.85;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - rodLen / 2, ry - lw * 0.62);
        ctx.lineTo(cx + rodLen / 2, ry - lw * 0.62);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
