<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9100 · Inkwell</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #050508; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // Ink dropped in dark water: slow blooms open, curl, and dissolve,
  // each on its own phase of one seamless loop. Watch only.
  var LOOP = 18000;
  var INKS = ['#4d7cff', '#37e0c8', '#b9c8ff', '#7a5cff'];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, S = 0;
  var seed = 20261022;
  var blooms = [], parts = [], sprites = {};

  function mulberry(s) {
    var a = s >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }

  function makeSprite(col) {
    var c = document.createElement('canvas');
    c.width = c.height = 64;
    var g = c.getContext('2d');
    var rgb = hexRgb(col);
    var rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',1)');
    rg.addColorStop(0.4, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.45)');
    rg.addColorStop(1, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, 64, 64);
    return c;
  }

  function build() {
    var R = mulberry(seed);
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W, H);
    for (var si = 0; si < INKS.length; si++) sprites[INKS[si]] = makeSprite(INKS[si]);

    blooms = [];
    var n = 5, i;
    for (i = 0; i < n; i++) {
      blooms.push({
        x: W * (0.2 + R() * 0.6),
        y: H * (0.2 + R() * 0.6),
        col: INKS[(R() * INKS.length) | 0],
        phase: R(),                 // position inside the loop
        dur: 0.55 + R() * 0.2,      // fraction of loop the bloom lives
        size: S * (0.16 + R() * 0.14),
        swirl: (R() < 0.5 ? -1 : 1) * (0.6 + R() * 0.9),
        seed: (R() * 1e9) | 0
      });
    }
    parts = [];
  }

  // pseudo-flow: curl-ish drift from layered sines, deterministic in (x, y, t)
  function flow(x, y, t, sd) {
    var s = 0.0016;
    var a = Math.sin(x * s * 3.1 + t * 1.7 + sd) + Math.sin(y * s * 2.3 - t * 1.2);
    var b = Math.cos(x * s * 2.7 - t * 1.4) + Math.cos(y * s * 3.3 + t * 1.9 + sd);
    return [a * 14, b * 14];
  }

  function draw(now) {
    var lt = (now % LOOP) / LOOP;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, W, H);

    // fade the canvas slightly for trails (kept subtle to protect the loop seam)
    ctx.globalCompositeOperation = 'lighter';

    var i, b, pr = mulberry(seed + 5);
    for (i = 0; i < blooms.length; i++) {
      b = blooms[i];
      // bloom-local time, wraps seamlessly: each bloom lives dur of the loop
      var bt = (lt - b.phase) / b.dur;
      if (bt < 0) bt += 1;
      if (bt > 1) continue;
      var br = mulberry(b.seed);
      // spawn a few particles per frame for this bloom
      var spawn = 12;
      for (var k = 0; k < spawn; k++) {
        var ang = br() * Math.PI * 2;
        var rad = br() * b.size * 0.12 * (0.3 + bt);
        parts.push({
          x: b.x + Math.cos(ang) * rad,
          y: b.y + Math.sin(ang) * rad,
          vx: Math.cos(ang) * (0.4 + br() * 0.8),
          vy: Math.sin(ang) * (0.4 + br() * 0.8),
          life: 0, maxLife: 90 + br() * 120,
          size: 6 + br() * 22 * (0.5 + bt),
          col: b.col, alpha: 0.14 + br() * 0.22,
          swirl: b.swirl, sd: b.seed % 100,
          bt: bt
        });
      }
    }

    // advect + draw
    var t = lt * Math.PI * 2;
    for (i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life++;
      if (p.life > p.maxLife) { parts.splice(i, 1); continue; }
      var fl = flow(p.x, p.y, t, p.sd);
      // curl around bloom center-ish: perpendicular nudge
      p.vx += fl[0] * 0.02 + -p.vy * 0.012 * p.swirl;
      p.vy += fl[1] * 0.02 + p.vx * 0.012 * p.swirl;
      p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx; p.y += p.vy;
      var fade = Math.sin((p.life / p.maxLife) * Math.PI);
      ctx.globalAlpha = p.alpha * fade;
      ctx.drawImage(sprites[p.col], p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    void pr;
  }

  window.addEventListener('resize', build);
  build();
  // warm up one full loop so the piece opens developed, not black
  for (var wq = 0; wq <= 240; wq++) draw(wq * (LOOP / 240));
  var clockBase = LOOP, realStart = performance.now();
  (function frame() {
    draw(clockBase + (performance.now() - realStart));
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
