<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stage Plot Is a Collage</title>
<style>
html, body { margin: 0; padding: 0; background: #E8E0D0; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a white sheet of paper, slightly crooked on the desk, is the whole
   stage plot: a hand-cut pink paper piano, four named paper performers, and
   yellow tape holding the plan together. The performers shuffle, bow, and
   change chairs while the music plays, and every so often a new tape strip
   slaps down and the arrangement changes. Drag a performer to a new seat
   and the ensemble re-seats itself around them, and the music re-mixes to
   match the new plot. The document is a system to touch. */
var TAU = Math.PI * 2;
var GROUND = '#E8E0D0';
var PAPER = '#FBF8F2';
var PAPER_EDGE = '#EFE8DA';
var PINK = '#F2A0C4';
var PINK_DEEP = '#D96A9B';
var PINK_SOFT = '#F7C6DA';
var YELLOW = '#F7D54D';
var YELLOW_DEEP = '#E3B93A';
var TAPE = '#F0E6C8';
var INK = '#23304F';
var INK_SOFT = 'rgba(35,48,79,0.55)';
var BLUE = '#2E4A7A';
var CREAM = '#F5ECD4';
var PLATE = '#FBFAF7';
var PLATE_LINE = 'rgba(35,48,79,0.30)';
var TITLE_INK = '#23304F';
var HINT_INK = '#5C5954';
var FRAME_T = 60.0;        /* fixed phase for frame one */
var SHEET_ROT = -0.026;    /* the sheet sits slightly crooked */
var TAPE_PERIOD = 45;      /* seconds between tape-strip events */
var TAPE_FIRST = 15;       /* first tape event at t = 15, then every 45 s */
var ARRANGEMENTS = [
  [0, 1, 2, 3],
  [3, 0, 1, 2],
  [2, 3, 0, 1],
  [1, 2, 3, 0]
];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var soundOn = true;
var audioCtx = null;
var master = null;
var noiseBuf = null;
var voices = null;   /* one voice per performer, built lazily inside a gesture */
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
/* ---- the sheet, in fractions of the sheet rect ---- */
/* Four seats around the pink piano. Chairs are paper cutouts too. */
var SEATS = [
  { x: 0.63, y: 0.30 },
  { x: 0.70, y: 0.50 },
  { x: 0.60, y: 0.70 },
  { x: 0.34, y: 0.76 }
];
/* Performers: name, voice kind, paper color, base frequency, phase. */
var PERFORMERS = [
  { name: 'MEL',   kind: 'pluck',  color: PINK,      deep: PINK_DEEP, freq: 330, ph: 0.0, x: 0, y: 0, seat: 0, dragging: false },
  { name: 'CARLA', kind: 'bow',    color: YELLOW,    deep: YELLOW_DEEP, freq: 196, ph: 1.7, x: 0, y: 0, seat: 1, dragging: false },
  { name: 'EDDY',  kind: 'breath', color: CREAM,     deep: '#D8C9A3', freq: 262, ph: 3.1, x: 0, y: 0, seat: 2, dragging: false },
  { name: 'GRACE', kind: 'pluck',  color: PINK_SOFT, deep: PINK, freq: 247, ph: 4.6, x: 0, y: 0, seat: 3, dragging: false }
];
/* Seeded jitter: grain specks, tape corners, letter wobble. */
var GRAIN = [];
var LETTER_JIT = [];
(function () {
  var rng = mulberry32(1857);
  var i;
  for (i = 0; i < 260; i++) {
    GRAIN.push({ x: rng(), y: rng(), r: 0.4 + rng() * 1.1, a: 0.03 + rng() * 0.06 });
  }
  for (i = 0; i < 40; i++) LETTER_JIT.push((rng() - 0.5) * 2.5);
})();
/* Tape strips pinned to the sheet, in sheet fractions. The last one is the
   strip that just slapped down at the fixed first frame (t = 60). */
var TAPES = [
  { x: 0.06, y: 0.028, w: 0.20, h: 0.045, rot: -0.35 },
  { x: 0.78, y: 0.030, w: 0.18, h: 0.045, rot: 0.30 },
  { x: 0.44, y: 0.90, w: 0.22, h: 0.045, rot: 0.12 },
  { x: 0.30, y: 0.44, w: 0.16, h: 0.040, rot: -0.18, fresh: true }
];
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: the sheet fills the frame on phones, a centered
   square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function sheetRect(sc) {
  var m = Math.min(sc.w, sc.h);
  var inset = isPhone ? m * 0.015 : m * 0.03;
  return { x: sc.x + inset, y: sc.y + inset, w: sc.w - inset * 2, h: sc.h - inset * 2 };
}
function toPx(fx, fy, rc) {
  return { x: rc.x + fx * rc.w, y: rc.y + fy * rc.h };
}
/* Which arrangement is current at time t, and how far into its change. */
function arrangementAt(t) {
  var since = t - TAPE_FIRST;
  var idx = Math.floor(since / TAPE_PERIOD);
  var prog = clamp((since - idx * TAPE_PERIOD) / 8, 0, 1);
  var n = ARRANGEMENTS.length;
  var cur = ((idx % n) + n) % n;
  var prev = ((idx - 1) % n + n) % n;
  return { cur: cur, prev: prev, prog: prog, idx: idx };
}
function easeInOut(f) { return f * f * (3 - 2 * f); }
/* Performer seat positions at time t, with shuffle and bow baked in. */
function performerPos(p, t, rc) {
  var arr = arrangementAt(t);
  var seatNow = ARRANGEMENTS[arr.cur][p.seat];
  var seatPrev = ARRANGEMENTS[arr.prev][p.seat];
  var e = easeInOut(arr.prog);
  var fx = lerp(SEATS[seatPrev].x, SEATS[seatNow].x, e);
  var fy = lerp(SEATS[seatPrev].y, SEATS[seatNow].y, e);
  /* shuffle: a small restless sidestep, different phase per performer */
  var sh = 0.012 * Math.sin(TAU * t / 7 + p.ph * 2.1);
  var shy = 0.008 * Math.sin(TAU * t / 9 + p.ph);
  return { x: fx + sh, y: fy + shy };
}
function bowLean(p, t) {
  /* a bow is a slow lean forward and back; at t = 60 the lean is mid-swing */
  return 0.22 * Math.sin(TAU * t / 5 + p.ph);
}
/* ---- audio: built lazily inside the first gesture, never autoplay ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try {
      audioCtx = new AudioContext();
      master = audioCtx.createGain();
      master.gain.value = 0.8;
      master.connect(audioCtx.destination);
      var len = Math.floor(audioCtx.sampleRate * 1.0);
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = noiseBuf.getChannelData(0), i;
      for (i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      voices = [];
      var j, v, o1, o2, f1, g, pan, dl;
      for (j = 0; j < PERFORMERS.length; j++) {
        v = { gainNode: null, panNode: null, delayNode: null, filt: null, base: 0 };
        pan = audioCtx.createStereoPanner();
        pan.pan.value = 0;
        dl = audioCtx.createDelay(0.5);
        dl.delayTime.value = 0.05;
        g = audioCtx.createGain();
        g.gain.value = 0.0001;
        dl.connect(pan); pan.connect(g); g.connect(master);
        v.gainNode = g; v.panNode = pan; v.delayNode = dl;
        if (PERFORMERS[j].kind === 'pluck') {
          /* plucked strings: bright triangle pair, fast tremolo */
          o1 = audioCtx.createOscillator();
          o1.type = 'triangle'; o1.frequency.value = PERFORMERS[j].freq;
          o2 = audioCtx.createOscillator();
          o2.type = 'triangle'; o2.frequency.value = PERFORMERS[j].freq * 2.01;
          var pg1 = audioCtx.createGain(); pg1.gain.value = 0.7;
          var pg2 = audioCtx.createGain(); pg2.gain.value = 0.3;
          o1.connect(pg1); pg1.connect(dl);
          o2.connect(pg2); pg2.connect(dl);
          var lfo = audioCtx.createOscillator();
          lfo.type = 'sine'; lfo.frequency.value = 6.0 + j;
          var lg = audioCtx.createGain(); lg.gain.value = 0.4;
          lfo.connect(lg); lg.connect(pg1.gain); lfo.start();
          o1.start(); o2.start();
          v.base = 0.15;
        } else if (PERFORMERS[j].kind === 'bow') {
          /* bowed pad: two detuned sawtooths through a soft lowpass */
          o1 = audioCtx.createOscillator();
          o1.type = 'sawtooth'; o1.frequency.value = PERFORMERS[j].freq;
          o2 = audioCtx.createOscillator();
          o2.type = 'sawtooth'; o2.frequency.value = PERFORMERS[j].freq * 1.005;
          f1 = audioCtx.createBiquadFilter();
          f1.type = 'lowpass'; f1.frequency.value = 900; f1.Q.value = 0.5;
          var bg1 = audioCtx.createGain(); bg1.gain.value = 0.6;
          var bg2 = audioCtx.createGain(); bg2.gain.value = 0.6;
          o1.connect(bg1); bg1.connect(f1);
          o2.connect(bg2); bg2.connect(f1);
          f1.connect(dl);
          var vib = audioCtx.createOscillator();
          vib.type = 'sine'; vib.frequency.value = 5.4;
          var vg = audioCtx.createGain(); vg.gain.value = 4.0;
          vib.connect(vg); vg.connect(o1.detune); vg.connect(o2.detune);
          vib.start();
          o1.start(); o2.start();
          v.base = 0.14;
          v.filt = f1;
        } else {
          /* breathy wind: looped noise through a soft bandpass, slow swell */
          var src = audioCtx.createBufferSource();
          src.buffer = noiseBuf; src.loop = true;
          f1 = audioCtx.createBiquadFilter();
          f1.type = 'bandpass'; f1.frequency.value = PERFORMERS[j].freq * 3.2; f1.Q.value = 1.2;
          var wg = audioCtx.createGain(); wg.gain.value = 0.55;
          var wlfo = audioCtx.createOscillator();
          wlfo.type = 'sine'; wlfo.frequency.value = 0.11;
          var wlg = audioCtx.createGain(); wlg.gain.value = 0.3;
          wlfo.connect(wlg); wlg.connect(wg.gain); wlfo.start();
          src.connect(f1); f1.connect(wg); wg.connect(dl);
          src.start();
          v.base = 0.17;
        }
        voices.push(v);
      }
    } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function updateAudio() {
  if (!audioCtx || !voices) return;
  var i, v, p;
  try {
    for (i = 0; i < PERFORMERS.length; i++) {
      p = PERFORMERS[i];
      v = voices[i];
      var g = soundOn ? v.base : 0.0001;
      v.gainNode.gain.setTargetAtTime(Math.max(g, 0.0001), audioCtx.currentTime, 0.25);
      /* seat position maps to pan and delay: re-seating re-mixes the piece */
      var pan = clamp(p.x * 2 - 1, -0.85, 0.85);
      var delay = 0.02 + clamp(p.y, 0, 1) * 0.16;
      v.panNode.pan.setTargetAtTime(pan, audioCtx.currentTime, 0.25);
      v.delayNode.delayTime.setTargetAtTime(delay, audioCtx.currentTime, 0.25);
    }
  } catch (e) {}
}
/* ---- drawing ---- */
function drawGrain(rc) {
  var i, g;
  for (i = 0; i < GRAIN.length; i++) {
    g = GRAIN[i];
    ctx.fillStyle = rgba(INK, g.a);
    ctx.fillRect(rc.x + g.x * rc.w, rc.y + g.y * rc.h, g.r, g.r);
  }
}
function drawTape(tp, rc, t, isFresh) {
  var m = Math.min(rc.w, rc.h);
  var c = toPx(tp.x, tp.y, rc);
  var w = tp.w * rc.w, h = tp.h * rc.h;
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(tp.rot);
  if (isFresh) {
    /* the strip that just landed still lifts a little off the paper */
    ctx.fillStyle = rgba(INK, 0.16);
    ctx.fillRect(-w / 2 + m * 0.006, -h / 2 + m * 0.008, w, h);
  }
  ctx.fillStyle = isFresh ? rgba(TAPE, 0.92) : rgba(TAPE, 0.78);
  ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.strokeStyle = rgba(INK, 0.12);
  ctx.lineWidth = 1;
  ctx.strokeRect(-w / 2 + 0.5, -h / 2 + 0.5, w - 1, h - 1);
  /* torn tape edge: a zigzag along the short sides */
  ctx.strokeStyle = rgba(INK, 0.18);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-w / 2, -h / 2);
  ctx.lineTo(-w / 2 + w * 0.03, -h / 2 + h * 0.5);
  ctx.lineTo(-w / 2, -h / 2 + h);
  ctx.moveTo(w / 2, -h / 2);
  ctx.lineTo(w / 2 - w * 0.03, -h / 2 + h * 0.5);
  ctx.lineTo(w / 2, -h / 2 + h);
  ctx.stroke();
  ctx.restore();
}
function drawTitle(rc) {
  /* hand-lettered title along the top of the sheet */
  var m = Math.min(rc.w, rc.h);
  var title = 'THE STAGE PLOT IS A COLLAGE';
  var px = Math.max(13, m * 0.038);
  ctx.font = 'bold ' + px + 'px monospace';
  var totalW = 0, i;
  for (i = 0; i < title.length; i++) totalW += ctx.measureText(title[i]).width;
  var x = rc.x + (rc.w - totalW) / 2;
  var y = rc.y + rc.h * 0.115;
  ctx.fillStyle = INK;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (i = 0; i < title.length; i++) {
    ctx.save();
    ctx.translate(x, y + LETTER_JIT[i % LETTER_JIT.length]);
    ctx.rotate((LETTER_JIT[(i + 7) % LETTER_JIT.length]) * 0.02);
    ctx.fillText(title[i], 0, 0);
    ctx.restore();
    x += ctx.measureText(title[i]).width;
  }
  /* a hand-ruled line under the title */
  ctx.strokeStyle = INK_SOFT;
  ctx.lineWidth = Math.max(1, m * 0.002);
  ctx.beginPath();
  ctx.moveTo(rc.x + rc.w * 0.10, y + px * 0.75);
  ctx.lineTo(rc.x + rc.w * 0.90, y + px * 0.72);
  ctx.stroke();
}
function drawPiano(rc, t) {
  var m = Math.min(rc.w, rc.h);
  var px = rc.x + rc.w * 0.075, py = rc.y + rc.h * 0.24;
  var pw = rc.w * 0.46, ph = rc.h * 0.34;
  /* soft paper shadow under the cutout */
  ctx.fillStyle = rgba(INK, 0.10);
  ctx.beginPath();
  ctx.moveTo(px + m * 0.012, py + ph * 0.42);
  ctx.bezierCurveTo(px + pw * 0.55, py - m * 0.01, px + pw * 0.98, py + ph * 0.28, px + pw * 0.94, py + ph * 0.62);
  ctx.lineTo(px + pw * 0.90, py + ph * 0.98);
  ctx.lineTo(px + m * 0.012, py + ph * 0.98);
  ctx.closePath();
  ctx.fill();
  /* hand-cut grand piano body in bubblegum pink */
  ctx.fillStyle = PINK;
  ctx.beginPath();
  ctx.moveTo(px, py + ph * 0.40);
  ctx.bezierCurveTo(px + pw * 0.52, py - m * 0.02, px + pw * 0.97, py + ph * 0.26, px + pw * 0.93, py + ph * 0.60);
  ctx.lineTo(px + pw * 0.89, py + ph * 0.96);
  ctx.lineTo(px, py + ph * 0.96);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = PINK_DEEP;
  ctx.lineWidth = Math.max(1.5, m * 0.004);
  ctx.stroke();
  /* inner lid line, hand-drawn and slightly wobbly */
  ctx.strokeStyle = rgba(PINK_DEEP, 0.65);
  ctx.lineWidth = Math.max(1, m * 0.003);
  ctx.beginPath();
  ctx.moveTo(px + pw * 0.06, py + ph * 0.42);
  ctx.bezierCurveTo(px + pw * 0.50, py + ph * 0.10, px + pw * 0.86, py + ph * 0.32, px + pw * 0.84, py + ph * 0.58);
  ctx.stroke();
  /* keyboard: white strip with black keys along the straight edge */
  var kx = px + pw * 0.02, ky = py + ph * 0.62, kw = pw * 0.82, kh = ph * 0.30;
  ctx.fillStyle = '#FDFBF6';
  ctx.fillRect(kx, ky, kw, kh);
  ctx.strokeStyle = INK_SOFT;
  ctx.lineWidth = 1;
  ctx.strokeRect(kx + 0.5, ky + 0.5, kw - 1, kh - 1);
  var i, bx;
  for (i = 0; i < 7; i++) {
    bx = kx + kw * (i + 1) / 8;
    ctx.fillStyle = INK;
    ctx.fillRect(bx - kw * 0.018, ky, kw * 0.036, kh * 0.62);
  }
  /* three spindly paper legs */
  ctx.fillStyle = PINK_DEEP;
  ctx.fillRect(px + pw * 0.06, py + ph * 0.96, m * 0.010, ph * 0.16);
  ctx.fillRect(px + pw * 0.86, py + ph * 0.96, m * 0.010, ph * 0.16);
  ctx.fillRect(px + pw * 0.42, py + ph * 0.60, m * 0.010, ph * 0.14);
  /* a small pink label on the piano: the piece's own name tag */
  ctx.save();
  ctx.translate(px + pw * 0.42, py + ph * 0.30);
  ctx.rotate(-0.06);
  ctx.fillStyle = YELLOW;
  ctx.fillRect(-m * 0.055, -m * 0.020, m * 0.11, m * 0.040);
  ctx.strokeStyle = rgba(INK, 0.25);
  ctx.lineWidth = 1;
  ctx.strokeRect(-m * 0.055 + 0.5, -m * 0.020 + 0.5, m * 0.11 - 1, m * 0.040 - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + Math.max(10, m * 0.022) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('PIANO', 0, 0);
  ctx.restore();
}
function drawChair(sx, sy, rc, t, p) {
  var m = Math.min(rc.w, rc.h);
  var c = toPx(sx, sy, rc);
  var w = m * 0.075, h = m * 0.085;
  /* paper chair: backrest, seat, legs, slightly askew */
  ctx.save();
  ctx.translate(c.x, c.y + h * 0.28);
  ctx.rotate(0.03 * Math.sin(p.ph + t / 11));
  ctx.fillStyle = rgba(INK, 0.10);
  ctx.fillRect(-w / 2 + m * 0.004, -h * 0.28 + m * 0.004, w, h * 0.30);
  ctx.fillStyle = CREAM;
  ctx.fillRect(-w / 2, -h * 0.30, w, h * 0.30);
  ctx.strokeStyle = rgba(INK, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(-w / 2 + 0.5, -h * 0.30 + 0.5, w - 1, h * 0.30 - 1);
  ctx.fillStyle = CREAM;
  ctx.fillRect(-w / 2, -h * 0.62, w, h * 0.34);
  ctx.strokeRect(-w / 2 + 0.5, -h * 0.62 + 0.5, w - 1, h * 0.34 - 1);
  ctx.fillStyle = INK;
  ctx.fillRect(-w / 2 + m * 0.004, -h * 0.02, m * 0.006, h * 0.30);
  ctx.fillRect(w / 2 - m * 0.010, -h * 0.02, m * 0.006, h * 0.30);
  ctx.restore();
}
function drawPerformer(p, t, rc) {
  var m = Math.min(rc.w, rc.h);
  var c = toPx(p.x, p.y, rc);
  var lean = bowLean(p, t);
  var bodyH = m * 0.085, bodyW = m * 0.052;
  var headR = m * 0.021;
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(lean * 0.5);
  /* soft paper shadow */
  ctx.fillStyle = rgba(INK, 0.12);
  ctx.beginPath();
  ctx.moveTo(m * 0.030, m * 0.010);
  ctx.ellipse(m * 0.004, m * 0.048, bodyW * 0.62, bodyH * 0.14, 0, 0, TAU);
  ctx.fill();
  /* cutout body: a rounded paper figure, no face, no features */
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.moveTo(-bodyW / 2, bodyH * 0.42);
  ctx.quadraticCurveTo(-bodyW / 2, -bodyH * 0.30, 0, -bodyH * 0.42);
  ctx.quadraticCurveTo(bodyW / 2, -bodyH * 0.30, bodyW / 2, bodyH * 0.42);
  ctx.quadraticCurveTo(0, bodyH * 0.52, -bodyW / 2, bodyH * 0.42);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = p.deep;
  ctx.lineWidth = Math.max(1.2, m * 0.003);
  ctx.stroke();
  /* head: a plain paper circle, deliberately blank */
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.moveTo(headR, -bodyH * 0.42);
  ctx.arc(0, -bodyH * 0.42 - headR * 0.85, headR, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = p.deep;
  ctx.stroke();
  /* arms: two short paper strokes that lift as the figure bows */
  var armLift = -0.4 + 0.5 * Math.sin(TAU * t / 5 + p.ph);
  ctx.strokeStyle = p.deep;
  ctx.lineWidth = Math.max(1.5, m * 0.004);
  ctx.beginPath();
  ctx.moveTo(-bodyW * 0.42, -bodyH * 0.05);
  ctx.lineTo(-bodyW * 0.85, bodyH * 0.10 + armLift * m * 0.008);
  ctx.moveTo(bodyW * 0.42, -bodyH * 0.05);
  ctx.lineTo(bodyW * 0.85, bodyH * 0.10 + armLift * m * 0.008);
  ctx.stroke();
  ctx.restore();
  /* pink sticky label with the performer's name, pinned beside them */
  var lx = c.x + bodyW * 1.15, ly = c.y - bodyH * 0.22;
  ctx.save();
  ctx.translate(lx, ly);
  ctx.rotate(0.08);
  ctx.fillStyle = PINK;
  var lw = m * 0.085, lh = m * 0.034;
  ctx.fillRect(-lw / 2, -lh / 2, lw, lh);
  ctx.strokeStyle = rgba(INK, 0.25);
  ctx.lineWidth = 1;
  ctx.strokeRect(-lw / 2 + 0.5, -lh / 2 + 0.5, lw - 1, lh - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + Math.max(10, m * 0.020) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(p.name, 0, 0);
  ctx.restore();
}
function drawSheet(rc, t) {
  var m = Math.min(rc.w, rc.h);
  var cx = rc.x + rc.w / 2, cy = rc.y + rc.h / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(SHEET_ROT);
  ctx.translate(-cx, -cy);
  /* the sheet itself, edge to edge */
  ctx.fillStyle = rgba(INK, 0.14);
  ctx.fillRect(rc.x + m * 0.008, rc.y + m * 0.010, rc.w, rc.h);
  ctx.fillStyle = PAPER;
  ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
  ctx.strokeStyle = PAPER_EDGE;
  ctx.lineWidth = 1;
  ctx.strokeRect(rc.x + 0.5, rc.y + 0.5, rc.w - 1, rc.h - 1);
  drawGrain(rc);
  drawTitle(rc);
  drawPiano(rc, t);
  /* chairs first, under the performers at their current seats */
  var i;
  for (i = 0; i < PERFORMERS.length; i++) {
    drawChair(PERFORMERS[i].x, PERFORMERS[i].y, rc, t, PERFORMERS[i]);
  }
  for (i = 0; i < PERFORMERS.length; i++) drawPerformer(PERFORMERS[i], t, rc);
  /* tape strips: the fresh one lands with the current arrangement */
  var arr = arrangementAt(t);
  var freshIdx = arr.idx % TAPES.length;
  for (i = 0; i < TAPES.length; i++) {
    drawTape(TAPES[i], rc, t, i === freshIdx && arr.prog < 0.35);
  }
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Stage Plot Is a Collage').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Stage Plot Is a Collage').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 11').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Stage Plot Is a Collage', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 11', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag a performer to a new seat.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, soundPlate.x + 12, soundPlate.y + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var rc = sheetRect(sc);
  var t = phaseT;
  var i, p, pos;
  for (i = 0; i < PERFORMERS.length; i++) {
    p = PERFORMERS[i];
    if (!p.dragging) {
      pos = performerPos(p, t, rc);
      p.x = pos.x;
      p.y = pos.y;
    }
  }
  updateAudio();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawSheet(rc, t);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    performerCount: PERFORMERS.length,
    performerAt: function (i) { return { x: PERFORMERS[i].x, y: PERFORMERS[i].y }; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, mid-shuffle, mid-bow, a tape
   strip just landed ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
function sheetPoint(ev) {
  var rect = { left: 0, top: 0 };
  try { rect = canvas.getBoundingClientRect(); } catch (e) {}
  var px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  var rc = sheetRect(fieldRect());
  var cx = rc.x + rc.w / 2, cy = rc.y + rc.h / 2;
  /* undo the sheet rotation, then read sheet fractions */
  var dx = px - cx, dy = py - cy;
  var cos = Math.cos(-SHEET_ROT), sin = Math.sin(-SHEET_ROT);
  var rx = dx * cos - dy * sin, ry = dx * sin + dy * cos;
  return {
    x: clamp((rx + rc.w / 2) / Math.max(rc.w, 1), 0.03, 0.97),
    y: clamp((ry + rc.h / 2) / Math.max(rc.h, 1), 0.03, 0.97)
  };
}
var dragTarget = null;
function onDown(ev) {
  var px = 0, py = 0;
  try { px = ev.clientX; py = ev.clientY; } catch (e) {}
  if (px >= soundPlate.x && px <= soundPlate.x + soundPlate.w && py >= soundPlate.y && py <= soundPlate.y + soundPlate.h) {
    soundOn = !soundOn;
    updateAudio();
    draw();
    return;
  }
  ensureAudio();
  var p = sheetPoint(ev);
  var rc = sheetRect(fieldRect());
  var m = Math.min(rc.w, rc.h);
  var i, perf, dx, dy, best = null, bestD = 1e9;
  for (i = 0; i < PERFORMERS.length; i++) {
    perf = PERFORMERS[i];
    dx = (p.x - perf.x) * rc.w / m;
    dy = (p.y - perf.y) * rc.h / m;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < bestD) { bestD = d; best = perf; }
  }
  if (best && bestD < 0.09) {
    dragTarget = best;
    best.dragging = true;
    best.x = p.x;
    best.y = p.y;
    try { ev.preventDefault(); } catch (e) {}
  }
}
function onMove(ev) {
  if (!dragTarget) return;
  var p = sheetPoint(ev);
  dragTarget.x = p.x;
  dragTarget.y = p.y;
  try { ev.preventDefault(); } catch (e) {}
}
function onUp() {
  if (!dragTarget) return;
  /* drop: the performer takes the nearest seat, the others re-seat around
     them by rotating the arrangement one step */
  var rc = sheetRect(fieldRect());
  var m = Math.min(rc.w, rc.h);
  var i, s, dx, dy, bestSeat = 0, bestD = 1e9;
  for (i = 0; i < SEATS.length; i++) {
    s = SEATS[i];
    dx = (dragTarget.x - s.x) * rc.w / m;
    dy = (dragTarget.y - s.y) * rc.h / m;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < bestD) { bestD = d; bestSeat = i; }
  }
  var arr = arrangementAt(phaseT);
  var cur = ARRANGEMENTS[arr.cur].slice();
  var oldSeat = cur[dragTarget.seat];
  var holder = -1;
  for (i = 0; i < PERFORMERS.length; i++) {
    if (cur[i] === bestSeat) holder = i;
  }
  if (holder >= 0 && holder !== dragTarget.seat) {
    cur[holder] = oldSeat;
  }
  cur[dragTarget.seat] = bestSeat;
  ARRANGEMENTS[arr.cur] = cur;
  dragTarget.dragging = false;
  dragTarget = null;
  draw();
}
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('pointerleave', onUp);
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
