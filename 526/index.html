<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Riders</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #C13B8E; overflow: hidden; }
  canvas { display: block; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (flat fills only, no gradients anywhere, ever)
  var SUN = '#FF3EB5', DAY = '#5FE0B0', NIGHT = '#0A0A0A', MOON = '#FFFFFF',
      HORSE_DAY = '#F5D020', HORSE_NIGHT = '#F27BB5', FRAME = '#C13B8E',
      PLANT_DARK = '#111111', PLANT_LIGHT = '#FFD400';

  var PHASE0 = 3.0; // constant first-frame loop phase (seconds)
  var CYCLE = 26;   // full day-night orbit cycle, seconds

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---- seeded static fields: marble swirls, night stars, grain ----
  var rng = mulberry32(526063);
  var swirls = [];
  for (var i = 0; i < 46; i++) {
    swirls.push({
      x: rng() * 1080, y: rng() * 1080,
      r: 60 + rng() * 190, a0: rng() * Math.PI * 2,
      sweep: 0.7 + rng() * 1.6, w: 5 + rng() * 15,
      light: rng() < 0.55, alpha: 0.05 + rng() * 0.09
    });
  }
  var stars = [];
  for (i = 0; i < 64; i++) {
    stars.push({
      x: 606 + rng() * 368, y: 150 + rng() * 620,
      r: 1.4 + rng() * 2.6, tw: rng() * Math.PI * 2,
      cross: rng() < 0.18
    });
  }
  var GRAIN_COLORS = [SUN, DAY, MOON, HORSE_DAY, HORSE_NIGHT, PLANT_LIGHT];
  var grain = [];
  for (i = 0; i < 560; i++) {
    grain.push({
      x: rng() * 1080, y: rng() * 1080,
      len: 3 + rng() * 7, ang: rng() * Math.PI,
      col: GRAIN_COLORS[Math.floor(rng() * GRAIN_COLORS.length)],
      a: 0.04 + rng() * 0.09
    });
  }

  // ---- sizing ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw(simT);
  }

  // ---- arch geometry: two panels, shared center mullion ----
  var ARCH = { top: 324, base: 934, floor: 838, r: 206 };
  var LEFT = { x0: 84, x1: 496, cx: 290 };
  var RIGHT = { x0: 584, x1: 996, cx: 790 };

  function archPath(A) {
    ctx.beginPath();
    ctx.moveTo(A.x0, ARCH.base);
    ctx.lineTo(A.x0, ARCH.top);
    ctx.arc(A.cx, ARCH.top, ARCH.r, Math.PI, 0);
    ctx.lineTo(A.x1, ARCH.base);
    ctx.closePath();
  }

  // ---- flat horse + rider glyph, drawn facing +x, ground at y=0 ----
  function drawHorseRider(horseCol, riderCol, t, phase) {
    ctx.fillStyle = horseCol;
    // legs
    var legX = [-54, -30, 32, 56];
    for (var i = 0; i < 4; i++) ctx.fillRect(legX[i] - 6, -54, 13, 54);
    // tail: swaying tapered stroke off the rear
    var sway = Math.sin(t * 1.25 + phase) * 13;
    ctx.strokeStyle = horseCol; ctx.lineCap = 'round'; ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(-72, -102);
    ctx.quadraticCurveTo(-98, -76, -94 + sway, -34);
    ctx.stroke();
    // body
    ctx.beginPath(); ctx.ellipse(0, -80, 80, 35, 0, 0, Math.PI * 2); ctx.fill();
    // neck
    ctx.beginPath();
    ctx.moveTo(46, -100); ctx.lineTo(84, -140); ctx.lineTo(104, -128); ctx.lineTo(72, -64);
    ctx.closePath(); ctx.fill();
    // head
    ctx.save();
    ctx.translate(100, -132); ctx.rotate(-0.42);
    ctx.beginPath(); ctx.ellipse(0, 0, 31, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // ear
    ctx.beginPath();
    ctx.moveTo(82, -146); ctx.lineTo(94, -164); ctx.lineTo(100, -144);
    ctx.closePath(); ctx.fill();

    // rider: flat glyph in the swapped colour, hat in the horse colour
    ctx.strokeStyle = riderCol; ctx.lineCap = 'round';
    ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(4, -106); ctx.lineTo(28, -70); ctx.stroke();   // leg over the flank
    ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(2, -142); ctx.lineTo(36, -120); ctx.stroke();  // arm toward the head
    ctx.fillStyle = riderCol;
    ctx.beginPath(); ctx.ellipse(-2, -134, 17, 31, 0.12, 0, Math.PI * 2); ctx.fill(); // torso
    ctx.beginPath(); ctx.arc(3, -176, 13, 0, Math.PI * 2); ctx.fill();                  // head
    ctx.fillStyle = horseCol;
    ctx.beginPath();
    ctx.moveTo(-11, -184); ctx.lineTo(17, -184); ctx.lineTo(3, -204);
    ctx.closePath(); ctx.fill();                                                          // pointed cap
  }

  // ---- spiky plant tuft ----
  function drawPlant(x, baseY, s, col) {
    ctx.fillStyle = col;
    var spikes = [-0.95, -0.62, -0.3, 0, 0.3, 0.62, 0.95];
    for (var i = 0; i < spikes.length; i++) {
      var a = spikes[i], h = (58 - Math.abs(a) * 22) * s, w = 7.5 * s;
      var tipX = x + Math.sin(a) * 34 * s, tipY = baseY - h;
      ctx.beginPath();
      ctx.moveTo(x - w, baseY);
      ctx.lineTo(tipX, tipY);
      ctx.lineTo(x + w, baseY);
      ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, baseY, 6 * s, 0, Math.PI * 2); ctx.fill();
  }

  function drawPanel(A, isDay, t, phi) {
    ctx.save();
    archPath(A);
    ctx.clip();
    // sky
    ctx.fillStyle = isDay ? DAY : NIGHT;
    ctx.fillRect(A.x0, 0, A.x1 - A.x0, ARCH.base);
    // floor band in the frame colour
    ctx.fillStyle = FRAME;
    ctx.fillRect(A.x0, ARCH.floor, A.x1 - A.x0, ARCH.base - ARCH.floor);

    var orbC = { x: A.cx, y: 400 }, orbR = 118;
    var a = phi - Math.PI / 2;
    if (isDay) {
      // pink sun on its circular orbit
      var sx = orbC.x + orbR * Math.cos(a), sy = orbC.y + orbR * Math.sin(a);
      ctx.fillStyle = SUN;
      ctx.beginPath(); ctx.arc(sx, sy, 62, 0, Math.PI * 2); ctx.fill();
      // horse + rider, facing the center mullion
      ctx.save();
      ctx.translate(A.cx + 6, ARCH.floor);
      drawHorseRider(HORSE_DAY, HORSE_NIGHT, t, 0);
      ctx.restore();
    } else {
      // stars behind everything in the night panel
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i];
        ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 1.6 + st.tw));
        ctx.fillStyle = MOON;
        if (st.cross) {
          ctx.save();
          ctx.translate(st.x, st.y);
          ctx.beginPath();
          ctx.moveTo(0, -st.r * 2.6); ctx.lineTo(st.r * 0.7, -st.r * 0.7);
          ctx.lineTo(st.r * 2.6, 0); ctx.lineTo(st.r * 0.7, st.r * 0.7);
          ctx.lineTo(0, st.r * 2.6); ctx.lineTo(-st.r * 0.7, st.r * 0.7);
          ctx.lineTo(-st.r * 2.6, 0); ctx.lineTo(-st.r * 0.7, -st.r * 0.7);
          ctx.closePath(); ctx.fill();
          ctx.restore();
        } else {
          ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      // crescent moon: mirrored orbit, opposite height to the sun
      var mx = orbC.x - orbR * Math.cos(a), my = orbC.y - orbR * Math.sin(a);
      ctx.fillStyle = MOON;
      ctx.beginPath(); ctx.arc(mx, my, 52, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = NIGHT;
      ctx.beginPath(); ctx.arc(mx + 21, my - 11, 45, 0, Math.PI * 2); ctx.fill();
      // horse + rider, mirrored so it faces the center mullion
      ctx.save();
      ctx.translate(A.cx - 6, ARCH.floor);
      ctx.scale(-1, 1);
      drawHorseRider(HORSE_NIGHT, HORSE_DAY, t, Math.PI);
      ctx.restore();
    }
    ctx.restore();
    // arch outline for poster crispness
    archPath(A);
    ctx.strokeStyle = 'rgba(10,10,10,0.28)';
    ctx.lineWidth = 6;
    ctx.stroke();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = FRAME;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    // marble frame: layered translucent swirl strokes over the pink ground;
    // the panels are painted on top, so the marble reads on the frame only
    for (var i = 0; i < swirls.length; i++) {
      var sw = swirls[i];
      ctx.globalAlpha = sw.alpha;
      ctx.strokeStyle = sw.light ? MOON : '#7E1D58';
      ctx.lineWidth = sw.w;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, sw.a0, sw.a0 + sw.sweep);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // one phase drives the whole day-night cycle
    var phi = t * Math.PI * 2 / CYCLE;
    drawPanel(LEFT, true, t, phi);
    drawPanel(RIGHT, false, t, phi);

    // spiky plants along the frame base
    drawPlant(128, 1018, 1.0, PLANT_DARK);
    drawPlant(252, 1024, 0.8, PLANT_LIGHT);
    drawPlant(452, 1020, 0.9, PLANT_DARK);
    drawPlant(540, 1026, 0.75, PLANT_LIGHT);
    drawPlant(628, 1020, 0.9, PLANT_DARK);
    drawPlant(838, 1024, 0.8, PLANT_LIGHT);
    drawPlant(958, 1018, 1.0, PLANT_DARK);

    // gouache grain: precomputed sparse short strokes over the fills
    ctx.lineCap = 'round';
    for (i = 0; i < grain.length; i++) {
      var g = grain[i];
      ctx.globalAlpha = g.a;
      ctx.strokeStyle = g.col;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(g.x, g.y);
      ctx.lineTo(g.x + Math.cos(g.ang) * g.len, g.y + Math.sin(g.ang) * g.len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
