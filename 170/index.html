<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No.170 Beyond the Great Star</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#10254E; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// A 96-pointed star, then rings of small eight-point stars stepping DOWN
// in size as their radius grows (size inversely proportional to radius),
// so the rim dissolves into tiny stars instead of coarsening. The whole
// disc turns a quarter turn per 50 s loop; because the centre star has
// 96 points, every ring count is a multiple of four and each motif has
// eight points, the quarter turn maps the disc exactly onto itself.
// Once per loop an 8 s brightness wave travels from centre to rim.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, panel = 0, px = 0, py = 0;
var BLUE = '#10254E', GOLD = '#C9A227', BONE = '#F2EDE3';
var LOOP = 50000, OFFSET = 4500;

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  panel = Math.min(W, H) * 0.92;
  px = (W - panel) / 2; py = (H - panel) / 2;
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// rings in disc units (disc radius = 1)
var RINGS = [];
(function () {
  var K = 12;
  for (var k = 0; k < K; k++) {
    var rad = 0.40 * Math.pow(1.085, k);
    var sz = 0.030 * (0.40 / rad); // step-down: size ~ 1 / radius
    var m = Math.round((2 * Math.PI * rad / (sz * 3.4)) / 4) * 4;
    RINGS.push({ rad: rad, sz: sz, m: m, bone: (k === 2), off: (k % 2) * 0.5 });
  }
})();

function star8(cx, cy, R, a) {
  for (var i = 0; i < 16; i++) {
    var ang = a + i * Math.PI / 8;
    var r = (i % 2 === 0) ? R : R * 0.48;
    var x = cx + r * Math.cos(ang), y = cy + r * Math.sin(ang);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var t = ((now + OFFSET) % LOOP) / LOOP; // 0..1 over 50 s
  var theta = t * Math.PI / 2; // quarter turn per loop
  var waveSec = t * 50; // wave active in the first 8 s of the loop
  var cx = px + panel / 2, cy = py + panel / 2, R = panel * 0.49;
  ctx.fillStyle = BLUE;
  ctx.fillRect(0, 0, W, H);
  ctx.lineJoin = 'round';

  // central 96-pointed star: the star polygon {96/47}, one continuous
  // path stepping 47 of 96 rim vertices, weaving a radiant medallion
  ctx.strokeStyle = GOLD;
  ctx.globalAlpha = 0.92;
  ctx.lineWidth = Math.max(1, R / 300);
  ctx.beginPath();
  var NS = 96, RO = 0.30 * R;
  for (var i = 0; i <= NS; i++) {
    var v = (i * 47) % NS;
    var a = theta + v * Math.PI * 2 / NS;
    var x = cx + RO * Math.cos(a), y = cy + RO * Math.sin(a);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
  // a fine circle seats the star
  ctx.globalAlpha = 0.7;
  ctx.lineWidth = Math.max(0.8, R / 340);
  ctx.beginPath();
  ctx.arc(cx, cy, RO * 1.05, 0, Math.PI * 2);
  ctx.stroke();

  // rings of motifs
  ctx.lineWidth = Math.max(0.8, R / 380);
  for (var k = 0; k < RINGS.length; k++) {
    var ring = RINGS[k];
    var wr = waveSec / 8; // wavefront radius in disc units, 0..1 over 8 s
    var boost = 0;
    if (waveSec < 9.5) {
      var dd = (ring.rad - wr) / 0.085;
      boost = 0.38 * Math.exp(-dd * dd);
    }
    ctx.strokeStyle = ring.bone ? BONE : GOLD;
    ctx.globalAlpha = Math.min(1, (ring.bone ? 0.9 : 0.82) + boost);
    ctx.beginPath();
    for (var j = 0; j < ring.m; j++) {
      var a2 = theta + (j + ring.off) / ring.m * Math.PI * 2;
      star8(cx + ring.rad * R * Math.cos(a2), cy + ring.rad * R * Math.sin(a2),
            ring.sz * R, a2);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
