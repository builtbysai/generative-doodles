<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>True/False Machines — №1100</title>
<style>
  html, body { margin: 0; padding: 0; background: #08090C; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
 * №1100 "True/False Machines" — onformative study block OF5 (true/false, 2017).
 *
 * A 4x3 grid of tall light columns in a dark room. Each column is a housing
 * with a warm tube behind a shutter panel that rotates about its vertical
 * centre axis (pseudo-3D: apparent width = cos of the panel angle, plus a
 * face-shading shift and a thickness sliver). The machine runs endless
 * procedures on a 40 s loop: hold dark, an expose-wave, hold lit (with one
 * solo cover, proving the unison is a choice), a cover-wave, hold dark,
 * then a second procedure whose waves sweep along the rows instead of the
 * columns. Every column's openness is a closed-form function of t — no
 * accumulated state, no flicker, no strobe. Watch-only, silent.
 */

var LOOP = 40;          // seconds, seamless
var PHASE = 6.4;        // fixed first-frame phase: mid expose-wave of procedure 1
var COLS = 4, ROWS = 3;

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- palette ---------- */
var GROUND = '#08090C';
var CAVITY = '#040507';
var HOUSING = '#101216';
var EDGE = '#4A5058';
var COVERED = '#2A2E36';
var LIT = '#FFE9C4';
var GLINT = '#FFFFFF';

function hexRGB(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
var COVERED_RGB = hexRGB(COVERED), LIT_RGB = hexRGB(LIT), EDGE_RGB = hexRGB(EDGE);
function mix(a, b, k) {
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * k) + ',' +
                  Math.round(a[1] + (b[1] - a[1]) * k) + ',' +
                  Math.round(a[2] + (b[2] - a[2]) * k) + ')';
}
function rgba(rgb, a) {
  return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')';
}

/* ---------- mechanical ease: ease-in-out with a small settle overshoot ---------- */
function mechEase(p) {
  if (p <= 0) return 0;
  if (p >= 1) return 1;
  var base = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  // settle: overshoot of ~0.02 (≈1.8 degrees of panel swing), back to 0 at p=1
  var settle = 0.02 * Math.sin(Math.PI * p * p) * p * p;
  return base + settle * (base >= 0.5 ? 1 : -0); // overshoot only past halfway travel
}

/* ---------- procedure timeline ----------
 * Events per column, generated from two procedures. A wave event is
 * [startBase, sweepDelay, dur, from, to]; openness is evaluated by walking
 * the column's events in order — analytic, nothing is integrated.
 *
 * Procedure 1 (0–20 s), waves sweep left→right / right→left by column:
 *   0.0–3.0   hold dark
 *   3.0–~9.7  expose wave   (delay by column x + slight row lag)
 *   9.7–14.0  hold lit; solo cover on column (2,1): 11.0 close, 13.4 reopen
 *   14.0–~20  cover wave    (delay by reversed column)
 * Procedure 2 (20–40 s), waves sweep top→bottom / bottom→top by row:
 *   20–23     hold dark (tail of cover wave settles by ~20.7, darkness held)
 *   21.0–~27  expose wave   (delay by row y + slight column lag)
 *   27–33     hold lit
 *   33–~39    cover wave    (delay by reversed row)
 *   39–40     hold dark, loop seam (state at 40 == state at 0: all covered)
 */
var ROT = 2.6; // seconds for one 90-degree panel swing
function eventsFor(cx, r) {
  var ev = [];
  var dLR = cx * 1.05 + r * 0.35;          // left→right sweep delay
  var dRL = (COLS - 1 - cx) * 1.05 + r * 0.35;
  var dTB = r * 1.5 + cx * 0.3;            // top→bottom sweep delay
  var dBT = (ROWS - 1 - r) * 1.5 + cx * 0.3;
  ev.push([3.0 + dLR, ROT, 0, 1]);                       // expose wave 1
  if (cx === 2 && r === 1) {                             // the solo cover
    ev.push([11.0, 1.3, 1, 0]);
    ev.push([13.0, 1.3, 0, 1]);
  }
  ev.push([14.6 + dRL, ROT, 1, 0]);                      // cover wave 1
  ev.push([23.0 + dTB, ROT, 0, 1]);                      // expose wave 2
  ev.push([33.0 + dBT, ROT, 1, 0]);                      // cover wave 2
  return ev;
}
var EVENTS = [];
for (var r0 = 0; r0 < ROWS; r0++) {
  EVENTS.push([]);
  for (var c0 = 0; c0 < COLS; c0++) EVENTS[r0].push(eventsFor(c0, r0));
}

function openness(cx, r, t) {
  var evs = EVENTS[r][cx], v = 0;
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i], lt = t - e[0];
    if (lt <= 0) break;
    if (lt >= e[1]) { v = e[3]; continue; }
    v = e[2] + (e[3] - e[2]) * mechEase(lt / e[1]);
    break;
  }
  return v < -0.03 ? -0.03 : (v > 1.03 ? 1.03 : v);
}

/* ---------- geometry helpers ---------- */
function rrect(x, y, w, h, rad) {
  if (w < 0) { x += w; w = -w; }
  if (rad > w / 2) rad = w / 2;
  if (rad > h / 2) rad = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.lineTo(x + w - rad, y);
  ctx.arcTo(x + w, y, x + w, y + rad, rad);
  ctx.lineTo(x + w, y + h - rad);
  ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
  ctx.lineTo(x + rad, y + h);
  ctx.arcTo(x, y + h, x, y + h - rad, rad);
  ctx.lineTo(x, y + rad);
  ctx.arcTo(x, y, x + rad, y, rad);
  ctx.closePath();
}

/* ---------- viewport ---------- */
function viewSize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  return [w, h];
}
function isPhone(w, h) {
  var sw = window.screen ? window.screen.width : w;
  var sh = window.screen ? window.screen.height : h;
  if (Math.min(sw, sh) < 700) return true;
  return h > w * 1.15;
}

/* ---------- one column ---------- */
function drawColumn(cx, cy, w, h, o) {
  var oc = o < 0 ? 0 : (o > 1 ? 1 : o);        // clamped light amount
  var phi = oc * Math.PI / 2;                  // panel angle: 0 covered-facing → 90° edge-on open
  var cosP = Math.cos(phi), sinP = Math.sin(phi);
  var ix = cx + w * 0.14, iw = w * 0.72;       // inner cavity
  var iy = cy + h * 0.035, ih = h * 0.93;

  // warm spill on the room around the column (layered flat alpha)
  if (oc > 0.01) {
    for (var s = 3; s >= 1; s--) {
      ctx.fillStyle = rgba(LIT_RGB, 0.016 * oc * s);
      rrect(cx - w * 0.09 * s, cy - h * 0.008 * s, w * (1 + 0.18 * s), h * (1 + 0.016 * s), w * 0.12);
      ctx.fill();
    }
  }

  // housing
  ctx.fillStyle = HOUSING;
  rrect(cx, cy, w, h, w * 0.07);
  ctx.fill();
  ctx.strokeStyle = rgba(EDGE_RGB, 0.85);
  ctx.lineWidth = Math.max(1, w * 0.016);
  rrect(cx, cy, w, h, w * 0.07);
  ctx.stroke();

  // cavity
  ctx.fillStyle = CAVITY;
  rrect(ix, iy, iw, ih, iw * 0.16);
  ctx.fill();

  // tube glow behind the panel (layered flat alpha, grows with openness)
  if (oc > 0.01) {
    for (var g = 3; g >= 1; g--) {
      ctx.fillStyle = rgba(LIT_RGB, 0.10 * oc * g);
      var gw = iw * (0.24 + 0.17 * g);
      rrect(cx + w / 2 - gw / 2, iy + ih * 0.02, gw, ih * 0.96, gw * 0.5);
      ctx.fill();
    }
  }
  // tube core: covered slate → warm lit
  var tubeW = iw * 0.32;
  ctx.fillStyle = mix(COVERED_RGB, LIT_RGB, Math.pow(oc, 0.65));
  rrect(cx + w / 2 - tubeW / 2, iy + ih * 0.015, tubeW, ih * 0.97, tubeW * 0.5);
  ctx.fill();

  // shutter panel: rotates about the vertical centre axis.
  // apparent width follows cos(phi); at full cover it fills the cavity.
  var pw = Math.max(w * 0.018, iw * cosP);
  var px = cx + w / 2 - pw / 2;
  var shade = 0.25 + 0.75 * cosP;              // face darkens as it turns away
  ctx.fillStyle = mix(COVERED_RGB, EDGE_RGB, (1 - shade) * 0.55 + 0.08);
  rrect(px, iy, pw, ih, Math.min(pw * 0.5, iw * 0.16));
  ctx.fill();
  // shading shift: one side of the face falls off as the panel turns
  if (sinP > 0.02 && pw > 3) {
    ctx.fillStyle = 'rgba(0,0,0,' + (0.30 * sinP) + ')';
    rrect(px + pw * 0.55, iy, pw * 0.45, ih, Math.min(pw * 0.22, iw * 0.10));
    ctx.fill();
  }
  // thickness sliver on the leading edge
  if (sinP > 0.02) {
    ctx.fillStyle = rgba(EDGE_RGB, 0.35 + 0.45 * sinP);
    var sw2 = Math.max(1, w * 0.05 * sinP);
    rrect(px + pw - sw2 / 2, iy, sw2, ih, sw2 * 0.5);
    ctx.fill();
  }
  // panel edge line
  ctx.strokeStyle = rgba(EDGE_RGB, 0.5);
  ctx.lineWidth = 1;
  rrect(px, iy, pw, ih, Math.min(pw * 0.5, iw * 0.16));
  ctx.stroke();

  // cue glints: white pinpoints on the housing's top corners
  ctx.fillStyle = rgba([255, 255, 255], 0.55);
  var gr = Math.max(0.8, w * 0.012);
  ctx.beginPath(); ctx.arc(cx + w * 0.10, cy + h * 0.018, gr, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + w * 0.90, cy + h * 0.018, gr, 0, Math.PI * 2); ctx.fill();
}

/* ---------- frame ---------- */
function draw(t) {
  var vs = viewSize(), w = vs[0], h = vs[1];
  var dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  // square stage, centred; the grid fills it, dark room around
  var S = Math.min(w, h);
  var ox = (w - S) / 2, oy = (h - S) / 2;
  var phone = isPhone(w, h);

  var gw = S * (phone ? 0.86 : 0.82), gh = S * 0.90;
  var gx = ox + (S - gw) / 2, gy = oy + (S - gh) / 2;
  var cellW = gw / COLS, cellH = gh / ROWS;
  var colW = cellW * 0.68, colH = cellH * 0.90;

  var tt = ((t % LOOP) + LOOP) % LOOP;
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var x = gx + c * cellW + (cellW - colW) / 2;
      var y = gy + r * cellH + (cellH - colH) / 2;
      drawColumn(x, y, colW, colH, openness(c, r, tt));
    }
  }
}

/* ---------- run: fixed-phase first frame, then the loop ---------- */
draw(PHASE);
var lastT = PHASE;
if (typeof requestAnimationFrame === 'function') {
  var t0 = null;
  var frame = function (now) {
    if (t0 === null) t0 = now;
    lastT = PHASE + (now - t0) / 1000;
    draw(lastT);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', function () { draw(lastT); });
}
window.addEventListener('resize', function () { draw(lastT); });
</script>
</body>
</html>
