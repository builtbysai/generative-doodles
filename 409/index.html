<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.409 Cat Window</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#3A3D12; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.409 Cat Window (yeti-iglesias, EXPANSION #44).
// After Yeti Iglesias's Golden Sun: an arched window
// on a deep olive ground, a huge stippled orange sun
// filling the arch, and on the checkered sill her
// orange striped cat (green eyes, tail flicking), a
// green planter with leaves and small flowers, and a
// red polka-dot mug breathing steam. WATCH-ONLY: no
// pointer handlers at all; the 30s loop is the piece.
// Her hue-shifted gradient on the sun takes the set
// gradient rule: TWO FLAT TONES WITH A HARD DIAGONAL
// EDGE - sun orange #FF9500 against the palette's
// deeper orange #F26A1B - never a smooth blend. The
// stipple is DATA: exactly 400 dots at 0.15 alpha
// from a fixed table, asserted at load, drawn in
// table order every frame; never a texture or filter.
// The sun's slow pulse is a flat cream overlay whose
// alpha breathes on a 7.5s cycle, four whole cycles
// per loop (the prompt's ~8s pulse resolved to the
// nearest period that keeps the 30s loop seamless).
// Steam from the mug is 2 curling strokes rising on
// 6s cycles; the tail flicks on a 6s cycle (5 per
// loop); one planter leaf sways on a 10s cycle; the
// dust motes drift on 10/15/30s cycles - every period
// divides the loop, so the loop is seamless. The
// hand-lettered "Yeti" signature bottom right is
// STROKE PATH DATA (the set's designed-text
// exception, No.302/401 precedent) - no font text
// anywhere. Frame one is drawn at the constant phase
// T = 7.5s (scene complete, tail at full flick, steam
// mid-rise); the clock is anchored there and advances
// in fixed 1/60 ticks, never from a wall clock. Flat
// colour only, one canvas, no offscreen canvas, no
// gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Deep olive ground; sun orange with darker orange
// stipple; cat orange, darker stripes, green eyes;
// planter green; mug red with cream dots; sill olive
// checkers. Nothing else.
var GROUND = '#3A3D12';
var SUN = '#FF9500', SUN2 = '#F26A1B', STIP = '#C94E0F';
var CAT = '#F26A1B', STRIPE = '#C94E0F', EYE = '#6BAE6B';
var PLANT = '#2E7D4F', LEAF2 = '#6BAE6B';
var MUG = '#E63329', CREAM = '#FCE8D5';
var SILL1 = '#55602A', SILL2 = '#6B7A2A';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 30;
if (LOOP !== 30) throw new Error('Cat Window loop must be 30s');
var TICK = 1 / 60;
var T0 = 7.5;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
function makeRng(seedStart) {
  var s = seedStart;
  return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// Sun geometry: centre and radius; the sun fills the
// arch of the window opening.
var SUNCX = 640, SUNCY = 378, SUNR = 258;

// Exactly 400 stipple dots at 0.15 alpha, rejection
// sampled inside the sun disc from the fixed seed.
var STIPPLE = [];
(function () {
  var rng = makeRng(40911);
  while (STIPPLE.length < 400) {
    var a = rng() * Math.PI * 2;
    var rr = Math.sqrt(rng()) * (SUNR - 10);
    STIPPLE.push({ x: SUNCX + Math.cos(a) * rr, y: SUNCY + Math.sin(a) * rr, r: 1.6 + rng() * 1.9 });
  }
})();
if (STIPPLE.length !== 400) throw new Error('stipple must be exactly 400 dots');

// Dust motes drifting in the sunbeams: fixed table,
// each with a period dividing the 30s loop.
var MOTES = [];
(function () {
  var rng = makeRng(40923);
  var pers = [10, 15, 30];
  for (var i = 0; i < 14; i++) {
    var a = rng() * Math.PI * 2;
    var rr = Math.sqrt(rng()) * 215;
    MOTES.push({
      x: SUNCX + Math.cos(a) * rr, y: SUNCY + Math.sin(a) * rr,
      r: 1.8 + rng() * 1.8, per: pers[i % 3], ph: rng() * Math.PI * 2,
      ax: 6 + rng() * 7, ay: 5 + rng() * 6
    });
  }
})();
if (MOTES.length !== 14) throw new Error('motes must be exactly 14');

// ---- drawing helpers -----------------------------------
function ell(cx, cy, rx, ry, rot, fill) {
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fillStyle = fill; ctx.fill();
}
function ellA(cx, cy, rx, ry, rot, fill, alpha) {
  ctx.globalAlpha = alpha; ell(cx, cy, rx, ry, rot, fill); ctx.globalAlpha = 1;
}
function circ(cx, cy, r, fill) { ell(cx, cy, r, r, 0, fill); }
function rect(x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
function poly(pts, fill) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function strokePts(pts, width, color, alpha) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = alpha; ctx.stroke(); ctx.globalAlpha = 1;
}
function leafAt(x, y, len, wid, ang, fill) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.5, -wid, len, 0);
  ctx.quadraticCurveTo(len * 0.5, wid, 0, 0);
  ctx.fillStyle = fill; ctx.fill();
  ctx.restore();
}

// ---- window geometry -----------------------------------
// Outer arch: centre (640,370), radius 310, sides down
// to y 790. Inner opening inset 28. Sill top y 618.
function archPath(cx, cy, r, bottom) {
  ctx.beginPath();
  ctx.moveTo(cx - r, bottom);
  ctx.lineTo(cx - r, cy);
  ctx.arc(cx, cy, r, Math.PI, 0);
  ctx.lineTo(cx + r, bottom);
  ctx.closePath();
}

// ---- the cat -------------------------------------------
// Fixed recipe: body ellipse, head circle, striped
// segmented tail. The tail is a chain of circles along
// a quadratic curve; the flick rotates the tip control
// point on a 6s cycle.
function drawCat(t) {
  var flick = Math.sin(Math.PI * 2 * (t / 6));
  // Tail first, behind the body. Base on the sill at
  // the body's left, tip curling up the cat's left
  // side against the sun, clear of the planter.
  var bx = 402, by = 598;
  var cxp = 318, cyp = 548;
  var tx = 342 + flick * 17, typ = 446;
  var segCols = [CAT, STRIPE, CAT, STRIPE, CAT, STRIPE, CAT, STRIPE, CAT];
  for (var i = 0; i < 9; i++) {
    var u = i / 8;
    var px = (1 - u) * (1 - u) * bx + 2 * (1 - u) * u * cxp + u * u * tx;
    var py = (1 - u) * (1 - u) * by + 2 * (1 - u) * u * cyp + u * u * typ;
    circ(px, py, 19 - i * 0.9, segCols[i]);
  }
  // Body, sitting on the sill line y 618.
  ell(468, 556, 82, 64, 0, CAT);
  // Body stripes, clipped to the body.
  ctx.save();
  ctx.beginPath(); ctx.ellipse(468, 556, 82, 64, 0, 0, Math.PI * 2); ctx.clip();
  ctx.strokeStyle = STRIPE; ctx.lineWidth = 9; ctx.lineCap = 'round';
  var stripes = [[408, 522, 452, 512], [404, 552, 450, 548], [410, 582, 452, 584]];
  for (var si = 0; si < stripes.length; si++) {
    ctx.beginPath();
    ctx.moveTo(stripes[si][0], stripes[si][1]);
    ctx.lineTo(stripes[si][2], stripes[si][3]);
    ctx.stroke();
  }
  ctx.restore();
  // Front paw hint on the sill.
  ell(500, 610, 26, 9, 0, CAT);
  // Head.
  circ(464, 446, 55, CAT);
  // Ears.
  poly([[420, 412], [428, 362], [456, 398]], CAT);
  poly([[478, 396], [508, 360], [514, 414]], CAT);
  poly([[428, 402], [432, 378], [446, 396]], STRIPE);
  poly([[486, 394], [502, 376], [504, 400]], STRIPE);
  // Forehead stripes.
  ctx.strokeStyle = STRIPE; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(448, 402); ctx.lineTo(450, 420); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(466, 398); ctx.lineTo(466, 418); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(484, 402); ctx.lineTo(482, 420); ctx.stroke();
  // Eyes: green with olive slit pupils (palette only).
  ell(444, 448, 8, 12, 0, EYE);
  ell(486, 448, 8, 12, 0, EYE);
  ell(444, 448, 2.6, 6.5, 0, GROUND);
  ell(486, 448, 2.6, 6.5, 0, GROUND);
  // Nose and mouth.
  poly([[458, 466], [472, 466], [465, 474]], STRIPE);
  ctx.strokeStyle = STRIPE; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(465, 474); ctx.quadraticCurveTo(465, 482, 456, 480); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(465, 474); ctx.quadraticCurveTo(465, 482, 474, 480); ctx.stroke();
}

// ---- the planter ---------------------------------------
// Green pot centre-sill, five leaves fanning up, three
// small flowers; leaf index 3 sways on a 10s cycle.
function drawPlanter(t) {
  // Stems and leaves from the pot mouth (640,532).
  var tilts = [-0.85, -0.45, 0, 0.45, 0.85];
  var lens = [76, 90, 98, 88, 74];
  var cols = [PLANT, LEAF2, PLANT, LEAF2, PLANT];
  var sway = Math.sin(Math.PI * 2 * (t / 10)) * 0.12;
  var fi;
  for (fi = 0; fi < 5; fi++) {
    var tilt = tilts[fi] + (fi === 3 ? sway : 0);
    var dx = Math.sin(tilt), dy = -Math.cos(tilt);
    var ex = 640 + dx * lens[fi], ey = 532 + dy * lens[fi];
    strokePts([[640, 534], [ex, ey]], 4, PLANT, 1);
    leafAt(640 + dx * lens[fi] * 0.45, 532 + dy * lens[fi] * 0.45,
      lens[fi] * 0.62, 15, Math.atan2(dy, dx), cols[fi]);
  }
  // Small flowers at three stem ends: red petals,
  // cream hearts (both palette colours).
  var ftilt = [-0.45, 0, 0.85];
  for (fi = 0; fi < 3; fi++) {
    var ft = tilts[[1, 2, 4][fi]];
    var fx = 640 + Math.sin(ft) * (lens[[1, 2, 4][fi]] + 8);
    var fy = 532 - Math.cos(ft) * (lens[[1, 2, 4][fi]] + 8);
    for (var p = 0; p < 5; p++) {
      var pa = p / 5 * Math.PI * 2;
      circ(fx + Math.cos(pa) * 8, fy + Math.sin(pa) * 8, 6, MUG);
    }
    circ(fx, fy, 4.2, CREAM);
  }
  // Pot: rim and trapezoid body.
  rect(566, 524, 148, 17, PLANT);
  poly([[576, 541], [704, 541], [690, 618], [590, 618]], PLANT);
  rect(566, 524, 148, 5, LEAF2);
}

// ---- the mug and its steam ------------------------------
// Red mug right on the sill, cream polka dots, coffee
// top in the darker orange. Steam: 2 curling strokes
// rising on 6s cycles, alpha swelling mid-rise so the
// wrap is invisible.
function drawMug(t) {
  // Handle behind the body.
  ctx.beginPath();
  ctx.arc(866, 578, 25, -Math.PI * 0.45, Math.PI * 0.5);
  ctx.strokeStyle = MUG; ctx.lineWidth = 12; ctx.stroke();
  // Body.
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(760, 534, 102, 84, 10); else ctx.rect(760, 534, 102, 84);
  ctx.fillStyle = MUG; ctx.fill();
  // Cream polka dots, clipped to the body.
  ctx.save();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(760, 534, 102, 84, 10); else ctx.rect(760, 534, 102, 84);
  ctx.clip();
  var dots = [[782, 560], [812, 574], [842, 558], [790, 596], [826, 600], [852, 590]];
  for (var i = 0; i < dots.length; i++) circ(dots[i][0], dots[i][1], 7, CREAM);
  ctx.restore();
  // Coffee surface.
  ell(811, 536, 51, 9, 0, STRIPE);
  // Steam wisps.
  for (var k = 0; k < 2; k++) {
    var p = ((t / 6) + k * 0.5) % 1;
    var alpha = Math.sin(Math.PI * p) * 0.55;
    if (alpha <= 0.01) continue;
    var cxp = 792 + k * 38;
    var topY = 522 - p * 118;
    var pts = [];
    for (var s2 = 0; s2 <= 8; s2++) {
      var u2 = s2 / 8;
      pts.push([cxp + Math.sin(u2 * Math.PI * 1.7 + p * 5 + k * 2.1) * 9, topY - u2 * 46]);
    }
    strokePts(pts, 5, CREAM, alpha);
  }
}

// ---- the signature --------------------------------------
// "Yeti" as hand-lettered stroke paths, bottom right,
// cream on the olive ground. No font text.
function drawSignature() {
  ctx.save();
  ctx.translate(1122, 820);
  ctx.scale(1.35, 1.35);
  var w = 2.6;
  // Y
  strokePts([[0, 0], [11, 15]], w, CREAM, 0.92);
  strokePts([[22, 0], [11, 15]], w, CREAM, 0.92);
  strokePts([[11, 15], [11, 34]], w, CREAM, 0.92);
  // e: a small loop with a crossbar, sampled as points
  var epts = [];
  for (var i = 0; i <= 10; i++) {
    var a = Math.PI * 0.95 - (i / 10) * Math.PI * 1.9;
    epts.push([42 + Math.cos(a) * 8.5, 21 + Math.sin(a) * 8.5]);
  }
  strokePts(epts, w, CREAM, 0.92);
  strokePts([[34, 19], [50, 17]], w, CREAM, 0.92);
  // t: stem with a hook, and its cross
  strokePts([[64, 2], [63, 24], [66, 30], [71, 29]], w, CREAM, 0.92);
  strokePts([[56, 12], [72, 12]], w, CREAM, 0.92);
  // i: stem and dot
  strokePts([[86, 13], [86, 30]], w, CREAM, 0.92);
  ctx.globalAlpha = 0.92; circ(86, 4, 2.1, CREAM); ctx.globalAlpha = 1;
  ctx.restore();
}

// ---- the scene ------------------------------------------
function drawScene(t) {
  // Interior of the window, clipped to the opening.
  ctx.save();
  archPath(640, 370, 282, 762);
  ctx.clip();
  rect(330, 60, 620, 720, GROUND);
  // Sun: two flat tones, hard diagonal edge.
  circ(SUNCX, SUNCY, SUNR, SUN);
  ctx.save();
  ctx.beginPath(); ctx.arc(SUNCX, SUNCY, SUNR, 0, Math.PI * 2); ctx.clip();
  ctx.translate(SUNCX, SUNCY); ctx.rotate(-0.55);
  rect(0, -SUNR - 4, SUNR * 2 + 8, SUNR * 2 + 8, SUN2);
  ctx.restore();
  // Stipple field, fixed table order, 0.15 alpha.
  ctx.fillStyle = STIP;
  ctx.globalAlpha = 0.15;
  for (var i = 0; i < STIPPLE.length; i++) {
    var d = STIPPLE[i];
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Pulse: flat cream overlay breathing on 7.5s.
  var pulse = 0.05 + 0.05 * Math.sin(Math.PI * 2 * (t / 7.5));
  ellA(SUNCX, SUNCY, SUNR, SUNR, 0, CREAM, pulse);
  // Dust motes in the sunbeams.
  for (var m = 0; m < MOTES.length; m++) {
    var mo = MOTES[m];
    var mx = mo.x + Math.sin(Math.PI * 2 * (t / mo.per) + mo.ph) * mo.ax;
    var my = mo.y + Math.cos(Math.PI * 2 * (t / mo.per) + mo.ph * 1.7) * mo.ay;
    ellA(mx, my, mo.r, mo.r, 0, CREAM, 0.28);
  }
  // Checkered sill across the lower third.
  var cw = 47, chh = 48;
  for (var row = 0; row < 3; row++) {
    for (var col = 0; col < 12; col++) {
      rect(358 + col * cw, 618 + row * chh, cw, chh, (col + row) % 2 === 0 ? SILL1 : SILL2);
    }
  }
  ctx.restore();

  // Frame: outer arch body is drawn as a rim - outer
  // arch stroked wide in sill olive, inner rim line.
  ctx.beginPath();
  ctx.moveTo(330, 790); ctx.lineTo(330, 370);
  ctx.arc(640, 370, 310, Math.PI, 0);
  ctx.lineTo(950, 790);
  ctx.strokeStyle = SILL1; ctx.lineWidth = 6; ctx.stroke();
  archPath(640, 370, 282, 762);
  ctx.strokeStyle = SILL2; ctx.lineWidth = 5; ctx.stroke();
  // Sill top rail and the ledge slab below the window.
  rect(358, 608, 564, 12, SILL1);
  rect(316, 762, 648, 30, SILL1);
  rect(316, 762, 648, 6, SILL2);

  // On the sill: cat left, planter centre, mug right.
  drawCat(t);
  drawPlanter(t);
  drawMug(t);

  drawSignature();
}

function draw() { drawScene(T % LOOP); }

// ---- sizing: centred fit, page ground = deep olive -----
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- clock: anchored at the constant phase T0 ----------
// Frame one is drawn synchronously at T = T0 exactly;
// the rAF loop advances T in fixed 1/60 ticks from
// there. Never Date.now, never a wall-clock phase.
var T = T0, lastNow = -1, acc = 0;
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  rect(0, 0, W, H, GROUND);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
