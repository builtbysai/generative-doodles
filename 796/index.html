<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toile Cirée</title>
<style>
  html, body { margin: 0; padding: 0; background: #14120E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var GROUND = '#14120E';
  var OCHRE  = '#D9A441';
  var SHEEN  = '#3A342A';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // mulberry32: deterministic seeded RNG
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function viewportSize() {
    var w, h;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
  }

  function isPhone(w, h) {
    var sw = 0, sh = 0;
    if (window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return h > w * 1.15;
  }

  // ---------- precomputed layout (function of size only, fixed seed) ----------
  var layout = null;

  function buildLayout(w, h) {
    var rng = mulberry32(79650);
    var minDim = Math.min(w, h);
    var phone = isPhone(w, h);

    // fine grain: specks of sheen tone at low alpha over the ground
    var grain = [];
    var grainCount = Math.floor(w * h / 260);
    for (var i = 0; i < grainCount; i++) {
      grain.push({
        x: rng() * w,
        y: rng() * h,
        s: 0.6 + rng() * 1.7,
        a: 0.03 + rng() * 0.10
      });
    }
    // a few warmer ochre micro-flecks, very sparse, like wax catching fibres
    var flecks = [];
    var fleckCount = Math.floor(w * h / 26000);
    for (var j = 0; j < fleckCount; j++) {
      flecks.push({
        x: rng() * w,
        y: rng() * h,
        s: 0.6 + rng() * 1.4,
        a: 0.04 + rng() * 0.07
      });
    }

    // dense brick-offset grid of imprints
    var stepX = minDim / (phone ? 6.4 : 8.2);
    var stepY = stepX * 0.86;
    var dabW = stepX * 0.52;
    var dabH = stepY * 0.58;
    var imprints = [];
    var row = 0;
    for (var y = stepY * 0.55; y < h + stepY * 0.4; y += stepY, row++) {
      var off = (row % 2 === 0) ? 0 : stepX * 0.5;
      for (var x = stepX * 0.5 + off - stepX; x < w + stepX * 0.6; x += stepX) {
        if (x < -dabW) continue;
        var streaks = [];
        var nStreak = 7 + Math.floor(rng() * 6);
        for (var k = 0; k < nStreak; k++) {
          streaks.push({
            fx: (rng() - 0.5) * 0.86,          // across the dab
            topBias: rng(),                     // denser near the top edge
            len: 0.35 + rng() * 0.6,
            a: 0.08 + rng() * 0.17
          });
        }
        imprints.push({
          x: x + (rng() - 0.5) * stepX * 0.05,
          y: y + (rng() - 0.5) * stepY * 0.05,
          rot: (rng() - 0.5) * 0.07,           // about +/-2 degrees
          sc: 0.95 + rng() * 0.10,
          a: 0.82 + rng() * 0.16,
          streaks: streaks,
          glossA: 0.5 + rng() * 0.4
        });
      }
    }

    return {
      w: w, h: h, grain: grain, flecks: flecks,
      imprints: imprints, dabW: dabW, dabH: dabH, minDim: minDim
    };
  }

  // ---------- drawing ----------

  function drawDab(d) {
    var w = layout.dabW * d.sc;
    var h = layout.dabH * d.sc;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);

    // body: squarish dab, slightly irregular corners via two stacked rects
    ctx.globalAlpha = d.a;
    ctx.fillStyle = OCHRE;
    var r = Math.min(w, h) * 0.16;
    roundRect(-w / 2, -h / 2, w, h, r);
    ctx.fill();
    // denser paint load along the top edge (brush first pressed there)
    ctx.globalAlpha = d.a * 0.35;
    roundRect(-w / 2, -h / 2, w, h * 0.34, r);
    ctx.fill();

    // bristle streaks: ground-colour hairlines cutting the dab,
    // denser and stronger toward the top, drier toward the bottom
    ctx.fillStyle = GROUND;
    for (var i = 0; i < d.streaks.length; i++) {
      var s = d.streaks[i];
      var sx = s.fx * w;
      var sy = -h / 2 + (1 - s.topBias * s.topBias) * h * 0.25;
      ctx.globalAlpha = s.a * (0.55 + 0.45 * s.topBias);
      ctx.fillRect(sx, sy, Math.max(0.7, w * 0.016), s.len * h * 0.62);
    }

    // thin gloss line along the top edge: wet paint catching light
    ctx.globalAlpha = d.glossA;
    ctx.fillStyle = OCHRE;
    ctx.fillRect(-w / 2 + r * 0.5, -h / 2 + h * 0.045, w - r, Math.max(0.8, h * 0.05));
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function drawSheen(t) {
    // Sheen wave: layered flat diagonal bands of sheen tone, low alpha.
    // Band centre travels along the diagonal coordinate s=(x+y)/(w+h),
    // oscillating on a 12 s sine sweep inside the 30 s loop.
    var w = layout.w, h = layout.h;
    var phase = Math.sin((t / 12) * Math.PI * 2);
    var centre = 0.34 + 0.30 * phase;         // in s units, 0..1 across the field
    var diag = w + h;
    var bands = [
      { half: 0.30, a: 0.06 },
      { half: 0.21, a: 0.09 },
      { half: 0.135, a: 0.13 },
      { half: 0.07, a: 0.17 }
    ];
    ctx.fillStyle = SHEEN;
    for (var i = 0; i < bands.length; i++) {
      var b = bands[i];
      var s0 = (centre - b.half) * diag;
      var s1 = (centre + b.half) * diag;
      ctx.globalAlpha = b.a;
      ctx.beginPath();
      // polygon of the strip x+y between s0 and s1, clipped to the frame
      var pts = stripPolygon(w, h, s0, s1);
      if (pts.length > 1) {
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (var p = 1; p < pts.length; p++) ctx.lineTo(pts[p][0], pts[p][1]);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // Intersection polygon of the frame rect with the diagonal strip s0 <= x+y <= s1
  function stripPolygon(w, h, s0, s1) {
    var corners = [[0, 0], [w, 0], [w, h], [0, h]];
    var poly = clipHalf(corners, s0, true);
    poly = clipHalf(poly, s1, false);
    return poly;
  }
  function clipHalf(poly, s, keepAbove) {
    var out = [];
    for (var i = 0; i < poly.length; i++) {
      var a = poly[i];
      var b = poly[(i + 1) % poly.length];
      var da = (a[0] + a[1]) - s;
      var db = (b[0] + b[1]) - s;
      var ina = keepAbove ? da >= 0 : da <= 0;
      var inb = keepAbove ? db >= 0 : db <= 0;
      if (ina) out.push(a);
      if (ina !== inb) {
        var f = da / (da - db);
        out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
      }
    }
    return out;
  }

  function drawHem() {
    // Folded hem at the bottom-right corner: the fabric corner turned back,
    // underside showing as a flat sheen-tone triangle, with a fold shadow.
    var w = layout.w, h = layout.h;
    var m = layout.minDim;
    var fx = w - m * 0.30;   // fold line start on the right edge
    var fy = h - m * 0.30;   // fold line start on the bottom edge

    // shadow cast by the flap onto the ground, just inside the fold line
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = GROUND;
    ctx.beginPath();
    ctx.moveTo(w, fy - m * 0.035);
    ctx.lineTo(fx - m * 0.035, h);
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fill();

    // the flap itself: triangle folded inward along the diagonal fold line
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = SHEEN;
    ctx.beginPath();
    ctx.moveTo(w, fy);
    ctx.lineTo(fx, h);
    ctx.lineTo(w - m * 0.155, h - m * 0.155);
    ctx.closePath();
    ctx.fill();

    // a dab that landed half on the flap before it was folded: ochre sliver
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = OCHRE;
    ctx.beginPath();
    ctx.moveTo(w - m * 0.045, h - m * 0.150);
    ctx.lineTo(w - m * 0.150, h - m * 0.045);
    ctx.lineTo(w - m * 0.150, h - m * 0.150);
    ctx.closePath();
    ctx.fill();

    // fold edge line
    ctx.globalAlpha = 0.65;
    ctx.fillStyle = GROUND;
    ctx.beginPath();
    ctx.moveTo(w, fy);
    ctx.lineTo(fx, h);
    ctx.lineTo(fx, h - Math.max(1, m * 0.004));
    ctx.lineTo(w, fy - Math.max(1, m * 0.004));
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    var size = viewportSize();
    if (!layout || layout.w !== size.w || layout.h !== size.h) {
      canvas.width = size.w;
      canvas.height = size.h;
      layout = buildLayout(size.w, size.h);
    }
    canvas.style.width = size.w + 'px';
    canvas.style.height = size.h + 'px';

    var w = layout.w, h = layout.h;

    // waxed ground
    ctx.globalAlpha = 1;
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, w, h);

    // grain
    var i, g;
    ctx.fillStyle = SHEEN;
    for (i = 0; i < layout.grain.length; i++) {
      g = layout.grain[i];
      ctx.globalAlpha = g.a;
      ctx.fillRect(g.x, g.y, g.s, g.s);
    }
    ctx.fillStyle = OCHRE;
    for (i = 0; i < layout.flecks.length; i++) {
      g = layout.flecks[i];
      ctx.globalAlpha = g.a;
      ctx.fillRect(g.x, g.y, g.s, g.s);
    }
    ctx.globalAlpha = 1;

    // the oily sheen passing over the fabric (under the imprints' gloss,
    // over the ground: the wax itself shines)
    drawSheen(t);

    // imprints: the system, unmoving
    for (i = 0; i < layout.imprints.length; i++) drawDab(layout.imprints[i]);
    ctx.globalAlpha = 1;

    drawHem();
  }

  // frame one: synchronous, fixed phase t = 0
  draw(0);

  var start = null;
  function frame(ts) {
    if (start === null) start = ts;
    draw(((ts - start) / 1000) % 30);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

  function onResize() { draw(0); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
