<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Unland</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0D0C0B; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): wood dark, wood edge, hair, background. Nothing else.
  var WOOD = '#4A3826';
  var EDGE = '#6B4F35';
  var HAIR = '#D8D2C4';
  var GROUND = '#0D0C0B';

  var BASE_SEED = 700001;
  var CYCLE = 60;              // one accumulation cycle, seconds
  var N_BASE = 120;            // strands already sewn at frame one
  var N_BORN = 34;             // new strands grown during a cycle
  var N_SNAPS = 5;             // strands that snap during a cycle
  var FORCE_T = -1;            // QA hook: -1 = live clock, else fixed elapsed

  // QA seed hook: ?seed=tNN pins the elapsed time (used by the headless
  // renderer to inspect later phases). Inert in normal viewing.
  try {
    if (typeof location !== 'undefined' && location.search) {
      var qm = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(location.search);
      if (qm) FORCE_T = parseFloat(qm[1]);
    }
  } catch (e) { /* live mode */ }

  // Seeded RNG (mulberry32). Tables come from the epoch stream, strands
  // from the epoch+cycle stream, so every frame is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(a, b, x) {
    var u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }
  function lerp(a, b, u) { return a + (b - a) * u; }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = 1, PHONE = false;
  var epoch = 0;

  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        window.visualViewport.width) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth) {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 800; h = 600; }
    return { w: w, h: h };
  }

  function resize() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = 1;
    if (typeof window !== 'undefined' && window.devicePixelRatio) {
      DPR = clamp(window.devicePixelRatio, 1, 2);
    }
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    // Phone detection: physical screen size first (min dimension < 700),
    // tall-aspect as the fallback signal only.
    var smin = 100000;
    if (typeof window !== 'undefined' && window.screen &&
        window.screen.width && window.screen.height) {
      smin = Math.min(window.screen.width, window.screen.height);
    }
    PHONE = (smin < 700) || (H > W * 1.15 && smin === 100000);
    buildScene();
  }

  // ---- The two half-tables --------------------------------------------
  // Each half: a flat dark silhouette (top board band over a body), a
  // jagged seeded cut profile on its inner edge, a few grain lines, two
  // legs. The halves are deliberately mismatched: tabletop heights, board
  // thickness, leg placement and cut profiles all differ.
  var SEG = 14;               // cut-profile segments per half
  var halves = [];            // built by buildScene
  var dangles = [];           // strands hanging from the undersides

  function buildScene() {
    var rng = mulberry32(BASE_SEED + epoch * 100003);
    var U = Math.min(W, H);
    var midY = H * 0.40;
    var gapHalf = (PHONE ? 0.040 : 0.058) * W;
    var mx = W * 0.045;
    halves = [];
    for (var s = 0; s < 2; s++) {
      var dir = s === 0 ? 1 : -1;            // left half juts right, etc.
      var yTop = midY + (rng() - 0.5) * 0.030 * U + (s === 0 ? -0.006 * U : 0.006 * U);
      var board = (0.040 + rng() * 0.012) * U;
      var faceH = (0.165 + rng() * 0.035) * U;
      var yBot = yTop + board + faceH;
      var xOuter = s === 0 ? mx : W - mx;
      var xInner = s === 0 ? W / 2 - gapHalf : W / 2 + gapHalf;
      var jag = [];
      for (var k = 0; k <= SEG; k++) jag.push(rng() * 2 - 1);
      var jagAmp = 0.013 * U;
      var grains = [];
      var nG = 9 + Math.floor(rng() * 4);
      for (var g = 0; g < nG; g++) {
        grains.push({
          y: yTop + board + 4 + rng() * (faceH - 8),
          x0: 0.04 + rng() * 0.25,           // fractions along the half
          x1: 0.62 + rng() * 0.34,
          a: 0.14 + rng() * 0.15
        });
      }
      var legs = [
        { fx: 0.05 + rng() * 0.05, w: (0.030 + rng() * 0.008) * U, len: (0.150 + rng() * 0.030) * U },
        { fx: 0.66 + rng() * 0.10, w: (0.024 + rng() * 0.008) * U, len: (0.128 + rng() * 0.030) * U }
      ];
      halves.push({
        dir: dir, yTop: yTop, board: board, faceH: faceH, yBot: yBot,
        xOuter: xOuter, xInner: xInner, jag: jag, jagAmp: jagAmp,
        grains: grains, legs: legs
      });
    }
    // Dangling strands under the tables (epoch stream, they belong to
    // the tables, not to a strand cycle).
    dangles = [];
    for (var d = 0; d < 7; d++) {
      var half = halves[d % 2];
      var fx = 0.12 + rng() * 0.76;
      dangles.push({
        half: d % 2,
        x: lerp(half.xOuter, half.xInner, half.dir > 0 ? fx : 1 - fx),
        len: (0.05 + rng() * 0.085) * U,
        phase: rng() * Math.PI * 2,
        a: 0.30 + rng() * 0.22
      });
    }
  }

  // X of a half's cut edge at height y (y between yTop and yBot).
  function edgeX(half, y) {
    var u = clamp((y - half.yTop) / (half.yTop === half.yBot ? 1 : (half.yBot - half.yTop)), 0, 1);
    var f = u * SEG;
    var k = Math.min(SEG - 1, Math.floor(f));
    var fr = f - k;
    var j = lerp(half.jag[k], half.jag[k + 1], fr);
    return half.xInner + half.dir * j * half.jagAmp;
  }

  function halfPath(half, yFrom, yTo) {
    // Silhouette strip of one half between two heights, cut edge included.
    ctx.beginPath();
    ctx.moveTo(half.xOuter, yFrom);
    ctx.lineTo(edgeX(half, yFrom), yFrom);
    var steps = 10;
    for (var i = 1; i <= steps; i++) {
      var y = lerp(yFrom, yTo, i / steps);
      ctx.lineTo(edgeX(half, y), y);
    }
    ctx.lineTo(half.xOuter, yTo);
    ctx.closePath();
  }

  function drawHalf(half) {
    var i, g, leg;
    // Legs first, the body overlaps their tops.
    ctx.fillStyle = WOOD;
    for (i = 0; i < half.legs.length; i++) {
      leg = half.legs[i];
      var lx = lerp(half.xOuter, half.xInner, half.dir > 0 ? leg.fx : 1 - leg.fx) - leg.w / 2;
      ctx.fillRect(lx, half.yBot - 2, leg.w, leg.len);
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = EDGE;
      ctx.fillRect(half.dir > 0 ? lx + leg.w - 1.5 : lx, half.yBot - 2, 1.5, leg.len);
      ctx.globalAlpha = 1;
      ctx.fillStyle = WOOD;
    }
    // Body (below the top board).
    halfPath(half, half.yTop + half.board, half.yBot);
    ctx.fillStyle = WOOD;
    ctx.fill();
    // Top board band.
    halfPath(half, half.yTop, half.yTop + half.board);
    ctx.fillStyle = EDGE;
    ctx.fill();
    // Board underside line.
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = GROUND;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(half.xOuter, half.yTop + half.board);
    ctx.lineTo(edgeX(half, half.yTop + half.board), half.yTop + half.board);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // Grain lines on the body.
    ctx.strokeStyle = EDGE;
    ctx.lineWidth = 1;
    for (i = 0; i < half.grains.length; i++) {
      g = half.grains[i];
      var gx0 = lerp(half.xOuter, half.xInner, half.dir > 0 ? g.x0 : 1 - g.x0);
      var gx1 = lerp(half.xOuter, half.xInner, half.dir > 0 ? g.x1 : 1 - g.x1);
      ctx.globalAlpha = g.a;
      ctx.beginPath();
      ctx.moveTo(gx0, g.y);
      ctx.lineTo(gx1, g.y + (g.x1 - g.x0) * 1.5);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // The cut edge catches the light.
    ctx.strokeStyle = EDGE;
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    var steps = 20;
    for (i = 0; i <= steps; i++) {
      var y = lerp(half.yTop, half.yBot, i / steps);
      var x = edgeX(half, y);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- The hair ---------------------------------------------------------
  // Strand schedule for one cycle, generated from the epoch+cycle stream:
  // a base set already sewn, births that grow across over 3 s, and a few
  // snaps. Everything is a pure function of cycle time.
  var strandCache = { key: '', list: [], snaps: [] };

  function buildStrands(cycle) {
    var key = epoch + ':' + cycle;
    if (strandCache.key === key) return strandCache;
    var rng = mulberry32(BASE_SEED + epoch * 100003 + cycle * 7919 + 17);
    var list = [];
    var i;
    for (i = 0; i < N_BASE + N_BORN; i++) {
      var born = i < N_BASE;
      list.push({
        yL: 0.02 + rng() * 0.96,
        yOff: (rng() - 0.5) * 0.05,
        sag: 0.5 + rng() * 0.9,
        a: 0.5 + rng() * 0.3,
        birth: born ? -3 : 2 + rng() * 48,
        fromLeft: rng() < 0.5,
        phase: rng() * Math.PI * 2,
        snapT: -1
      });
    }
    // Snap schedule: pick strands, give each a snap time and record the
    // neighbours (adjacent in yL order) that will recoil.
    var order = list.map(function (s, idx) { return idx; });
    order.sort(function (a, b) { return list[a].yL - list[b].yL; });
    var snaps = [];
    var picked = {};
    for (i = 0; i < N_SNAPS; i++) {
      var pos = Math.floor(rng() * order.length);
      var idx = order[pos];
      if (picked[idx]) continue;
      picked[idx] = true;
      var tSnap = 12 + rng() * 40;
      list[idx].snapT = tSnap;
      var nb = [];
      if (pos > 0) nb.push(order[pos - 1]);
      if (pos < order.length - 1) nb.push(order[pos + 1]);
      snaps.push({ idx: idx, t: tSnap, nb: nb });
    }
    strandCache = { key: key, list: list, snaps: snaps };
    return strandCache;
  }

  // Pointer state, recorded on the anchored clock.
  var ptr = { down: false, x: 0, y: 0, downT: 0, downX: 0, downY: 0, upT: -10, has: false };

  function strandPoint(half, yFrac) {
    var y = half.yTop + clamp(yFrac, 0, 1) * (half.yBot - half.yTop);
    return { x: edgeX(half, y), y: y };
  }

  function drawStrands(t) {
    var cycle = Math.floor(t / CYCLE);
    var ct = t - cycle * CYCLE;
    var data = buildStrands(cycle);
    var L = halves[0], R = halves[1];
    // Cycle envelope: soft reset at the end, soft arrival after it.
    var env = 1 - smooth(CYCLE - 5, CYCLE - 0.5, ct);
    if (cycle > 0 || epoch > 0) env *= smooth(0, 2, ct);
    if (env <= 0.001) return;
    // Recoil envelopes from snaps that have fired in this cycle.
    var recoil = {};
    var i, j;
    for (i = 0; i < data.snaps.length; i++) {
      var sn = data.snaps[i];
      var age = ct - sn.t;
      if (age >= 0 && age < 1) {
        for (j = 0; j < sn.nb.length; j++) recoil[sn.nb[j]] = age;
      }
    }
    // Drag tremble envelope: full while dragging in/near the gap,
    // decaying after release.
    var trembleAmp = 0;
    if (ptr.has) {
      if (ptr.down) trembleAmp = 1;
      else trembleAmp = Math.exp(-(t - ptr.upT) / 0.8);
    }
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = 0.8;
    for (i = 0; i < data.list.length; i++) {
      var s = data.list[i];
      if (s.snapT >= 0 && ct >= s.snapT) continue;          // snapped: gone
      var g = clamp((ct - s.birth) / 3, 0, 1);              // growth 0..1
      if (g <= 0) continue;
      var p0 = strandPoint(L, s.yL);
      var p1 = strandPoint(R, s.yL + s.yOff);
      var mx = (p0.x + p1.x) / 2;
      var my = (p0.y + p1.y) / 2 + Math.abs(p1.x - p0.x) * 0.055 * s.sag;
      // Tremble: strands near the recorded pointer shake, then settle.
      if (trembleAmp > 0.003) {
        var ddx = mx - ptr.x, ddy = my - ptr.y;
        var prox = Math.exp(-((ddx * ddx + ddy * ddy) / Math.pow(0.11 * Math.min(W, H), 2)));
        if (prox > 0.02) {
          var ta = trembleAmp * prox;
          mx += Math.cos(t * 39 + s.phase * 3) * 1.3 * ta;
          my += Math.sin(t * 47 + s.phase * 7) * 2.4 * ta;
        }
      }
      // Snap recoil on the neighbours.
      if (recoil[i] !== undefined) {
        var ra = recoil[i];
        my += Math.sin(ra * 40 + s.phase) * 2.2 * (1 - ra);
      }
      // Grow across: draw the sub-curve up to parameter g (de Casteljau),
      // from whichever edge the strand started on.
      var A = { x: lerp(p0.x, mx, g), y: lerp(p0.y, my, g) };
      var B = { x: lerp(mx, p1.x, g), y: lerp(my, p1.y, g) };
      var D = { x: lerp(A.x, B.x, g), y: lerp(A.y, B.y, g) };
      ctx.globalAlpha = s.a * env * Math.min(1, g * 1.6);
      ctx.beginPath();
      if (s.fromLeft) {
        ctx.moveTo(p0.x, p0.y);
        ctx.quadraticCurveTo(A.x, A.y, D.x, D.y);
      } else {
        ctx.moveTo(p1.x, p1.y);
        ctx.quadraticCurveTo(B.x, B.y, D.x, D.y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawDangles(t) {
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = 0.8;
    for (var i = 0; i < dangles.length; i++) {
      var d = dangles[i];
      var half = halves[d.half];
      var sway = Math.sin(t * 0.9 + d.phase) * 3;
      var sway2 = Math.sin(t * 0.9 + d.phase - 0.7) * 4.5;
      ctx.globalAlpha = d.a;
      ctx.beginPath();
      ctx.moveTo(d.x, half.yBot - 1);
      ctx.quadraticCurveTo(d.x + sway, half.yBot + d.len * 0.55,
                           d.x + sway2, half.yBot + d.len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    drawHalf(halves[0]);
    drawHalf(halves[1]);
    drawDangles(t);
    drawStrands(t);
  }

  // ---- Clock, pointer, boot ---------------------------------------------
  var startStamp = -1;
  function nowSec() {
    if (FORCE_T >= 0) return FORCE_T;
    if (typeof performance !== 'undefined' && performance.now) {
      if (startStamp < 0) startStamp = performance.now();
      return (performance.now() - startStamp) / 1000;
    }
    return 0;
  }

  function reseed() {
    epoch++;
    strandCache.key = '';
    buildScene();
    if (typeof performance !== 'undefined' && performance.now) {
      startStamp = performance.now();
    }
    draw(0);
  }

  function evtPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    return { x: W / 2, y: H / 2 };
  }
  function onDown(e) {
    var p = evtPos(e);
    ptr.down = true; ptr.has = true;
    ptr.x = p.x; ptr.y = p.y;
    ptr.downT = nowSec(); ptr.downX = p.x; ptr.downY = p.y;
  }
  function onMove(e) {
    if (!ptr.down) return;
    var p = evtPos(e);
    ptr.x = p.x; ptr.y = p.y;
  }
  function onUp(e) {
    if (!ptr.down) return;
    ptr.down = false;
    ptr.upT = nowSec();
    // A tap (short, nearly still) reseeds: new cut profiles, new base set.
    var p = evtPos(e);
    var dt = ptr.upT - ptr.downT;
    var moved = Math.abs(p.x - ptr.downX) + Math.abs(p.y - ptr.downY);
    if (dt < 0.3 && moved < 6) reseed();
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointerleave', function () {
      if (ptr.down) { ptr.down = false; ptr.upT = nowSec(); }
    });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(nowSec()); });
  }
  if (typeof window !== 'undefined' && window.visualViewport &&
      window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () {
      resize(); draw(nowSec());
    });
  }

  resize();
  draw(0); // frame one: the synchronous draw at t = 0

  if (FORCE_T >= 0) {
    draw(FORCE_T);
  } else if (typeof requestAnimationFrame === 'function') {
    var tick = function () {
      draw(nowSec());
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
