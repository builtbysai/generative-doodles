<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Right Here, Right Now</title>
<style>
  html, body { margin: 0; padding: 0; background: #F4F1EA; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). No Math.random anywhere in this piece.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var WALL = '#F4F1EA';
  var GRAPHITE = '#3F3D39';
  var GRAPHITE_DEEP = '#1C1B19';
  var GUIDE = '#D8D2C4';
  var GLINT = '#F5D76E';

  var LINES = ['RIGHT HERE,', 'RIGHT NOW,', 'EVERYTHING,', 'FOREVER'];
  var DRAW_PER_LINE = 45;   // seconds per line
  var HOLD = 60;             // seconds of full-wall hold
  var WIPE = 6;              // seconds of soft wipe
  var CYCLE = DRAW_PER_LINE * 4 + HOLD + WIPE; // 246 s
  var PHASE = DRAW_PER_LINE * 4; // frame one opens in the hold phase

  var W = 0, H = 0;
  var t0 = null;      // clock start, set when the rAF loop begins
  var booted = false; // boot flag: frame one is draw(0), never wall-clock time

  function viewportSize() {
    var w, h;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      w = visualViewport.width; h = visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
  }

  function sizeCanvas() {
    var s = viewportSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // Seeded shuffle of line order for a cycle index. Cycle 0 keeps the
  // canonical order; later cycles shuffle (the "next seeded word-order").
  function orderForCycle(cycleIndex) {
    var idx = [0, 1, 2, 3];
    if (cycleIndex === 0) return idx;
    var rng = mulberry32(1326000 + cycleIndex * 7919);
    for (var i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }
    return idx;
  }

  // The rhinestone letter: a seeded pick, per cycle, among letters with
  // counters (R, O, E, A, D, P) in the four lines.
  function glintPick(cycleIndex) {
    var rng = mulberry32(1326999 + cycleIndex * 7919);
    var candidates = [];
    for (var li = 0; li < LINES.length; li++) {
      var line = LINES[li];
      for (var ci = 0; ci < line.length; ci++) {
        var ch = line.charAt(ci);
        if ('ROEDAP'.indexOf(ch) >= 0) candidates.push([li, ci]);
      }
    }
    return candidates[Math.floor(rng() * candidates.length)];
  }

  function draw(t) {
    // Cycle time with the hold-phase shift: t = 0 lands at the hold.
    var cycleTime = (t + PHASE) % CYCLE;
    var cycleIndex = Math.floor((t + PHASE) / CYCLE);
    var order = orderForCycle(cycleIndex);
    var pick = glintPick(cycleIndex);
    var pickLine = pick[0], pickChar = pick[1];

    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);

    // Font size so the longest line spans ~60% of field width.
    var size = Math.max(16, Math.round(H * 0.085));
    ctx.font = '600 ' + size + 'px Georgia, "Times New Roman", serif';
    var longest = 0;
    for (var li = 0; li < LINES.length; li++) {
      var w = ctx.measureText(LINES[li]).width;
      if (w > longest) longest = w;
    }
    if (longest > 0) size = Math.max(14, Math.round(size * (W * 0.60) / longest));
    ctx.font = '600 ' + size + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';

    var lineHeight = size * 1.65;
    var blockH = lineHeight * 4;
    var top = (H - blockH) / 2 + size; // baseline of first line

    // Faint pencil guides, always present.
    ctx.strokeStyle = GUIDE;
    ctx.lineWidth = 1;
    for (var g = 0; g < 4; g++) {
      var gy = top + g * lineHeight + size * 0.18;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.moveTo(W * 0.16, gy);
      ctx.lineTo(W * 0.84, gy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Draw each line in seeded order, left to right, stroke by stroke.
    for (var oi = 0; oi < 4; oi++) {
      var lineIndex = order[oi];
      var line = LINES[lineIndex];
      var lineStart = oi * DRAW_PER_LINE;
      var lineElapsed = cycleTime - lineStart;
      var baseline = top + oi * lineHeight;
      var lineWidth = ctx.measureText(line).width;
      var x0 = (W - lineWidth) / 2;

      // Per-character seeded jitter, stable within a cycle.
      var jrng = mulberry32(1326000 + cycleIndex * 7919 + lineIndex * 131 + 7);

      var cx = x0;
      for (var ci = 0; ci < line.length; ci++) {
        var ch = line.charAt(ci);
        var cw = ctx.measureText(ch).width;
        var charCount = line.length;
        var charProg = 0;
        if (lineElapsed > 0) {
          charProg = Math.min(1, Math.max(0, (lineElapsed / DRAW_PER_LINE) * charCount - ci));
        }
        if (cycleTime >= DRAW_PER_LINE * 4) charProg = 1; // hold phase: complete

        if (charProg > 0) {
          // Hand-brush texture: several offset passes at varying alpha,
          // plus graphite speckle around the glyph.
          var jx = (jrng() - 0.5) * size * 0.03;
          var jy = (jrng() - 0.5) * size * 0.03;
          var passes = [[0, 0, GRAPHITE, 0.55], [jx, jy, GRAPHITE_DEEP, 0.45], [-jx * 0.6, -jy * 0.6, GRAPHITE, 0.35]];
          for (var p = 0; p < passes.length; p++) {
            ctx.globalAlpha = charProg * passes[p][3];
            ctx.fillStyle = passes[p][2];
            ctx.fillText(ch, cx + passes[p][0], baseline + passes[p][1]);
          }
          // Speckle: a few tiny graphite dots near the glyph.
          var nsp = 3;
          for (var s = 0; s < nsp; s++) {
            var sx = cx + jrng() * cw;
            var sy = baseline - size * (0.1 + jrng() * 0.7);
            ctx.globalAlpha = charProg * 0.30;
            ctx.fillStyle = GRAPHITE_DEEP;
            ctx.fillRect(sx, sy, 1.5, 1.5);
          }
          ctx.globalAlpha = 1;

          // The single rhinestone glint, in the counter of the picked letter.
          if (lineIndex === pickLine && ci === pickChar) {
            var gx = cx + cw / 2;
            var gy2 = baseline - size * 0.32;
            var pulse = 0.55 + 0.45 * Math.sin(t * 1.1);
            var r = Math.max(2, size * 0.055);
            ctx.globalAlpha = charProg * pulse;
            ctx.fillStyle = GLINT;
            ctx.beginPath();
            ctx.moveTo(gx, gy2 - r);
            ctx.lineTo(gx + r * 0.7, gy2);
            ctx.lineTo(gx, gy2 + r);
            ctx.lineTo(gx - r * 0.7, gy2);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = charProg * pulse * 0.8;
            ctx.strokeStyle = GLINT;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(gx - r * 1.6, gy2);
            ctx.lineTo(gx + r * 1.6, gy2);
            ctx.moveTo(gx, gy2 - r * 1.6);
            ctx.lineTo(gx, gy2 + r * 1.6);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
        }
        cx += cw;
      }
    }

    // Soft wipe: wall color fades the wall back to blank paper.
    if (cycleTime >= DRAW_PER_LINE * 4 + HOLD) {
      var wp = (cycleTime - (DRAW_PER_LINE * 4 + HOLD)) / WIPE;
      ctx.globalAlpha = Math.min(1, wp);
      ctx.fillStyle = WALL;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  sizeCanvas();
  // Frame one: synchronous, at exactly t = 0, via the boot flag.
  draw(0);
  booted = true;

  function loop(now) {
    if (t0 === null) t0 = now;
    var elapsed = (now - t0) / 1000;
    draw(elapsed);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }

  function onResize() {
    sizeCanvas();
    // Redraw at the current piece time, never restart the performance.
    if (booted && t0 !== null) {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
      draw((now - t0) / 1000);
    } else {
      draw(0);
    }
  }
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
