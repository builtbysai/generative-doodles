<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Flock, Wired</title>
<style>
  html, body { margin: 0; padding: 0; background: #F6F6F4; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- constants ----------
  var VOID = '#F6F6F4';        // paper white, flat, total
  var FRAME = '#23262B';       // drone frames / rotor discs
  var BALL = '#FFFFFF';        // the light, riding in a ball
  var GLOW = '#E4EEFF';        // ball halo
  var STEP = 1 / 120;          // fixed sim step, seconds
  var PREROLL = 2400;          // frame one = exactly 2400 steps (20 s)
  var WORLD = 240;             // virtual world is WORLD x WORLD units
  var CENTER = WORLD / 2;
  var MAXS = 30, MINS = 12;    // drone speed clamp, units/s

  // formation scheduler, in steps (integer phase math keeps frame one exact)
  var FREE_S = 300, GATHER_S = 300, HOLD_S = 480, RELEASE_S = 240;
  var CYCLE_S = FREE_S + GATHER_S + HOLD_S + RELEASE_S;   // 11 s per formation; step 2400 lands at a release start, w = 1
  var FORM_NAMES = ['ring', 'wave', 'column'];

  var BASE_SEED = 1030191;
  var seed = BASE_SEED;
  if (typeof location !== 'undefined' && location.search) {
    var m = /seed=(\d+)/.exec(location.search);
    if (m) seed = parseInt(m[1], 10) | 0;
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function fit() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    if (vv && vv.width) { W = vv.width; H = vv.height; }
    else if (typeof window !== 'undefined' && window.innerWidth) { W = window.innerWidth; H = window.innerHeight; }
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { fit(); draw(); });
    }
  }

  function viewScale() { return Math.min(W, H) * 0.96 / WORLD; }
  function toScreen(wx, wy) {
    var s = viewScale();
    return { x: (W - WORLD * s) / 2 + wx * s, y: (H - WORLD * s) / 2 + wy * s };
  }
  function toWorld(px, py) {
    var s = viewScale();
    return { x: (px - (W - WORLD * s) / 2) / s, y: (py - (H - WORLD * s) / 2) / s };
  }

  // ---------- flock state ----------
  var drones = [];      // {x,y,vx,vy,climb,phaseA,phaseB}
  var N = 24;
  var stepCount = 0;    // total fixed steps since (re)build
  var phaseStep = 0;    // steps inside the current formation cycle
  var formIdx = 0;      // 0 ring, 1 wave, 2 column
  var swirl = 0.5;      // wheeling strength, varies per flock
  var avgSpeed = 0;     // smoothed, for audio
  var alarm = 0;        // 0..1, ball-dim envelope while scattering

  // visitor state (never present at frame one)
  var pointerDown = false, dragging = false;
  var pointerWorld = { x: CENTER, y: CENTER };
  var downPos = { x: 0, y: 0 }, downStep = 0, lastTapStep = -100000, downTime = 0;

  function buildFlock(s) {
    var rng = mulberry32(s);
    drones = [];
    N = 24;
    swirl = 0.42 + rng() * 0.25;
    var i, a, r, sp;
    for (i = 0; i < N; i++) {
      a = rng() * Math.PI * 2;
      r = 18 + rng() * 52;
      sp = 15 + rng() * 9;
      drones.push({
        x: CENTER + Math.cos(a) * r,
        y: CENTER + Math.sin(a) * r * 0.8,
        vx: Math.cos(a + Math.PI / 2) * sp,
        vy: Math.sin(a + Math.PI / 2) * sp,
        climb: 0,
        phaseA: rng() * Math.PI * 2,
        phaseB: rng() * Math.PI * 2
      });
    }
    stepCount = 0; phaseStep = 0; formIdx = 0; alarm = 0; avgSpeed = 0;
  }

  function reseedFlock() {
    // double-tap: a genuinely new flock (size and style vary, still ~24)
    seed = (seed + 7919) | 0;
    var rng = mulberry32(seed ^ 0x5f3d);
    buildFlock(seed);
    N = 22 + Math.floor(rng() * 5);       // 22..26
    while (drones.length > N) drones.pop();
    while (drones.length < N) {
      var a = rng() * Math.PI * 2, r = 20 + rng() * 46, sp = 15 + rng() * 9;
      drones.push({
        x: CENTER + Math.cos(a) * r, y: CENTER + Math.sin(a) * r * 0.8,
        vx: Math.cos(a + Math.PI / 2) * sp, vy: Math.sin(a + Math.PI / 2) * sp,
        climb: 0, phaseA: rng() * Math.PI * 2, phaseB: rng() * Math.PI * 2
      });
    }
    var i;
    for (i = 0; i < PREROLL; i++) stepSim();
  }

  // ---------- formation slots ----------
  function slotPos(i, idx, t) {
    var f = i / (N - 1);
    if (idx === 0) {           // ring: complete circle, slow rotation, margin all round
      var ang = (i / N) * Math.PI * 2 + t * 0.25;
      return { x: CENTER + Math.cos(ang) * 58, y: CENTER + Math.sin(ang) * 58 };
    }
    if (idx === 1) {           // wave: a travelling sine line across the middle
      var sx = 30 + f * 180;
      return { x: sx, y: CENTER + 26 * Math.sin(sx * 0.05 + t * 0.5) };
    }
    // column: a vertical file, gently swaying
    var sy = 34 + f * 172;
    return { x: CENTER + 14 * Math.sin(sy * 0.05 - t * 0.45), y: sy };
  }

  function formWeight() {
    var p = phaseStep;
    if (p < FREE_S) return 0;
    if (p < FREE_S + GATHER_S) {
      var u = (p - FREE_S) / GATHER_S;
      return u * u * (3 - 2 * u);
    }
    if (p < FREE_S + GATHER_S + HOLD_S) return 1;
    var v = (p - FREE_S - GATHER_S - HOLD_S) / RELEASE_S;
    return 1 - v * v * (3 - 2 * v);
  }
  function inHold() {
    return phaseStep >= FREE_S + GATHER_S && phaseStep < FREE_S + GATHER_S + HOLD_S;
  }

  // ---------- simulation ----------
  function stepSim() {
    var t = stepCount * STEP;
    var w = formWeight();
    var i, j, d;
    // flock centroid
    var cx = 0, cy = 0;
    for (i = 0; i < N; i++) { cx += drones[i].x; cy += drones[i].y; }
    cx /= N; cy /= N;

    var speedSum = 0;
    for (i = 0; i < N; i++) {
      d = drones[i];
      var ax = 0, ay = 0;
      var nSep = 0, sepX = 0, sepY = 0;
      var nNear = 0, alX = 0, alY = 0, coX = 0, coY = 0;
      for (j = 0; j < N; j++) {
        if (j === i) continue;
        var o = drones[j];
        var dx = d.x - o.x, dy = d.y - o.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < 81 && d2 > 0.0001) {          // separation radius 9
          var inv = 1 / d2;
          sepX += dx * inv; sepY += dy * inv; nSep++;
        }
        if (d2 < 400) {                        // neighbourhood radius 20
          alX += o.vx; alY += o.vy; coX += o.x; coY += o.y; nNear++;
        }
      }
      var bw = 1 - 0.85 * w;                   // boids yield to the formation
      if (nSep > 0) { ax += sepX * 260 * bw; ay += sepY * 260 * bw; }
      if (nNear > 0) {
        ax += ((alX / nNear) - d.vx) * 1.1 * bw;         // alignment
        ay += ((alY / nNear) - d.vy) * 1.1 * bw;
        ax += ((coX / nNear) - d.x) * 0.55 * bw;         // cohesion
        ay += ((coY / nNear) - d.y) * 0.55 * bw;
      }
      // wheeling: a slow tangential drift around the flock centroid
      var rx = d.x - cx, ry = d.y - cy;
      ax += -ry * swirl * bw; ay += rx * swirl * bw;
      // wander, deterministic per drone
      ax += Math.sin(t * 0.7 + d.phaseA) * 5 * bw;
      ay += Math.cos(t * 0.6 + d.phaseB) * 5 * bw;
      // soft containment: keep the performance inside the void
      var dcx = d.x - CENTER, dcy = d.y - CENTER;
      var distC = Math.sqrt(dcx * dcx + dcy * dcy);
      if (distC > 96) {
        ax += (dcx / distC) * -(distC - 96) * 2.4;
        ay += (dcy / distC) * -(distC - 96) * 2.4;
      }
      // formation spring, with slot-velocity feed-forward
      if (w > 0) {
        var sp0 = slotPos(i, formIdx, t);
        var sp1 = slotPos(i, formIdx, t + STEP);
        var svx = (sp1.x - sp0.x) / STEP, svy = (sp1.y - sp0.y) / STEP;
        ax += ((sp0.x - d.x) * 6.0 + (svx - d.vx) * 2.4) * w;
        ay += ((sp0.y - d.y) * 6.0 + (svy - d.vy) * 2.4) * w;
      }
      // visitor scatter: veer around the finger, balls dim in alarm
      if (dragging) {
        var pdx = d.x - pointerWorld.x, pdy = d.y - pointerWorld.y;
        var pd2 = pdx * pdx + pdy * pdy;
        if (pd2 < 1156 && pd2 > 0.01) {        // radius 34
          var pd = Math.sqrt(pd2);
          var f = (1 - pd / 34) * 300;
          ax += (pdx / pd) * f; ay += (pdy / pd) * f;
        }
      }
      // clamp acceleration
      var am = Math.sqrt(ax * ax + ay * ay);
      var AMAX = 150;
      if (am > AMAX) { ax = ax / am * AMAX; ay = ay / am * AMAX; }
      d.vx += ax * STEP; d.vy += ay * STEP;
      // clamp speed
      var sm = Math.sqrt(d.vx * d.vx + d.vy * d.vy);
      var hi = w > 0.5 ? 34 : MAXS;
      var lo = MINS * (1 - w) + 2 * w;   // in formation, drones may slow to slot speed and settle
      if (sm > hi) { d.vx = d.vx / sm * hi; d.vy = d.vy / sm * hi; }
      else if (sm < lo && sm > 0.001) { d.vx = d.vx / sm * lo; d.vy = d.vy / sm * lo; }
      d.x += d.vx * STEP; d.y += d.vy * STEP;
      // hard safety clamp (should not trigger under containment)
      if (d.x < 6) { d.x = 6; d.vx = Math.abs(d.vx); }
      if (d.x > WORLD - 6) { d.x = WORLD - 6; d.vx = -Math.abs(d.vx); }
      if (d.y < 6) { d.y = 6; d.vy = Math.abs(d.vy); }
      if (d.y > WORLD - 6) { d.y = WORLD - 6; d.vy = -Math.abs(d.vy); }
      // climb: rising (up = negative vy) feeds the ball's glow
      var climbRaw = Math.max(-1, Math.min(1, -d.vy / MAXS));
      d.climb += (climbRaw - d.climb) * 0.03;
      speedSum += sm;
    }
    avgSpeed += ((speedSum / N) - avgSpeed) * 0.02;
    alarm += ((dragging ? 1 : 0) - alarm) * (dragging ? 0.08 : 0.012);

    phaseStep++;
    if (phaseStep >= CYCLE_S) {
      phaseStep -= CYCLE_S;
      formIdx = (formIdx + 1) % 3;
    }
    stepCount++;
    audioFrame();
  }

  function advanceFormation() {
    formIdx = (formIdx + 1) % 3;
    phaseStep = FREE_S;    // begin gathering the next shape now
  }

  // ---------- drawing ----------
  function drawDrone(d) {
    var s = viewScale();
    var p = toScreen(d.x, d.y);
    var ang = Math.atan2(d.vy, d.vx);
    var cos = Math.cos(ang), sin = Math.sin(ang);
    var i, lx, ly, px, py;
    var corners = [[-3.1, -3.1], [3.1, -3.1], [3.1, 3.1], [-3.1, 3.1]];
    // rotor discs: four faint circles at the frame corners
    ctx.fillStyle = FRAME;
    for (i = 0; i < 4; i++) {
      lx = corners[i][0]; ly = corners[i][1];
      px = p.x + (lx * cos - ly * sin) * s;
      py = p.y + (lx * sin + ly * cos) * s;
      ctx.globalAlpha = 0.25;
      ctx.beginPath();
      ctx.arc(px, py, Math.max(0.8, 2.0 * s), 0, Math.PI * 2);
      ctx.fill();
    }
    // frame: thin quad outline
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = FRAME;
    ctx.lineWidth = Math.max(0.7, 0.55 * s);
    ctx.beginPath();
    for (i = 0; i <= 4; i++) {
      lx = corners[i % 4][0]; ly = corners[i % 4][1];
      px = p.x + (lx * cos - ly * sin) * s;
      py = p.y + (lx * sin + ly * cos) * s;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    for (i = 0; i < 2; i++) {
      lx = corners[i * 2][0]; ly = corners[i * 2][1];
      px = p.x + (lx * cos - ly * sin) * s;
      py = p.y + (lx * sin + ly * cos) * s;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    // the ball: layered-alpha glow halo + white core, riding above the frame
    var bright = (0.45 + 0.55 * (0.5 + 0.5 * d.climb)) * (1 - 0.45 * alarm);
    var bx = p.x, by = p.y - 5.0 * s;
    var halo = [[6.2, 0.10], [4.6, 0.16], [3.4, 0.24]];
    ctx.fillStyle = GLOW;
    for (i = 0; i < 3; i++) {
      ctx.globalAlpha = halo[i][1] * bright;
      ctx.beginPath();
      ctx.arc(bx, by, Math.max(1, halo[i][0] * s), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 0.55 + 0.45 * bright;
    ctx.fillStyle = BALL;
    ctx.beginPath();
    ctx.arc(bx, by, Math.max(0.9, 2.2 * s), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = VOID;
    ctx.fillRect(0, 0, W, H);
    var i;
    for (i = 0; i < N; i++) drawDrone(drones[i]);
  }

  // ---------- audio (lazy, guarded, gesture-born only) ----------
  var AC = null, washGain = null, washFilter = null, chordNodes = null, wasHold = false;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
    try {
      var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext : webkitAudioContext;
      AC = new Ctor();
      var master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
      AC._master = master;
      var len = 2 * AC.sampleRate;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var data = buf.getChannelData(0);
      var r = mulberry32(4242);
      var i;
      for (i = 0; i < len; i++) data[i] = r() * 2 - 1;
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      washFilter = AC.createBiquadFilter(); washFilter.type = 'bandpass';
      washFilter.frequency.value = 600; washFilter.Q.value = 0.6;
      washGain = AC.createGain(); washGain.gain.value = 0.0;
      src.connect(washFilter); washFilter.connect(washGain); washGain.connect(master);
      src.start();
    } catch (e) { AC = null; }
  }
  function chordStart() {
    if (!AC || chordNodes) return;
    try {
      chordNodes = [];
      var freqs = [196, 261.63, 329.63];
      var i, o, g;
      for (i = 0; i < 3; i++) {
        o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = freqs[i];
        g = AC.createGain(); g.gain.value = 0;
        g.gain.setTargetAtTime(0.045, AC.currentTime, 0.8);
        o.connect(g); g.connect(AC._master); o.start();
        chordNodes.push({ o: o, g: g });
      }
    } catch (e) { chordNodes = null; }
  }
  function chordStop() {
    if (!AC || !chordNodes) return;
    try {
      var nodes = chordNodes; chordNodes = null;
      var i;
      for (i = 0; i < nodes.length; i++) {
        nodes[i].g.gain.setTargetAtTime(0, AC.currentTime, 0.5);
        nodes[i].o.stop(AC.currentTime + 2);
      }
    } catch (e) { /* silent */ }
  }
  function settleTone() {
    if (!AC) return;
    try {
      var o = AC.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(320, AC.currentTime);
      o.frequency.exponentialRampToValueAtTime(170, AC.currentTime + 0.7);
      var g = AC.createGain();
      g.gain.setValueAtTime(0.07, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.7);
      o.connect(g); g.connect(AC._master);
      o.start(); o.stop(AC.currentTime + 0.75);
    } catch (e) { /* silent */ }
  }
  function audioFrame() {
    if (!AC || !washGain) return;
    try {
      var spN = Math.max(0, Math.min(1, avgSpeed / MAXS));
      var flutter = dragging ? 0.035 * Math.abs(Math.sin(stepCount * 0.9)) : 0;
      washGain.gain.value = 0.025 + spN * 0.05 + flutter;
      washFilter.frequency.value = 400 + spN * 520;
      var hold = inHold();
      if (hold && !wasHold) chordStart();
      if (!hold && wasHold) chordStop();
      wasHold = hold;
    } catch (e) { /* silent */ }
  }

  // ---------- interaction ----------
  function evtPos(e) {
    var x = e.clientX || 0, y = e.clientY || 0;
    if (canvas.getBoundingClientRect) {
      var r = canvas.getBoundingClientRect();
      x -= r.left; y -= r.top;
    }
    return { x: x, y: y };
  }
  function onDown(e) {
    ensureAudio();
    var p = evtPos(e);
    downPos = p; downStep = stepCount; downTime = stepCount;
    pointerWorld = toWorld(p.x, p.y);
    pointerDown = true; dragging = false;
  }
  function onMove(e) {
    if (!pointerDown) return;
    var p = evtPos(e);
    pointerWorld = toWorld(p.x, p.y);
    var dx = p.x - downPos.x, dy = p.y - downPos.y;
    if (dx * dx + dy * dy > 64) dragging = true;
  }
  function onUp(e) {
    if (!pointerDown) return;
    var wasDrag = dragging;
    pointerDown = false; dragging = false;
    if (wasDrag) { settleTone(); return; }
    if (stepCount - downStep < 40) {           // a tap, not a press
      if (stepCount - lastTapStep < 42) {      // double-tap: new flock
        lastTapStep = -100000;
        reseedFlock();
      } else {
        lastTapStep = stepCount;
        advanceFormation();
      }
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---------- main loop ----------
  var lastTs = -1, acc = 0;
  function loop(ts) {
    if (lastTs < 0) lastTs = ts;
    var elapsed = (ts - lastTs) / 1000;
    lastTs = ts;
    if (elapsed > 0.25) elapsed = 0.25;
    acc += elapsed;
    var n = 0;
    while (acc >= STEP && n < 10) { stepSim(); acc -= STEP; n++; }
    if (n === 10) acc = 0;
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- init: frame one is the synchronous draw after the pre-roll ----------
  fit();
  buildFlock(seed);
  var k;
  for (k = 0; k < PREROLL; k++) stepSim();
  draw();
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
