<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cook's Palms, Glued Self-Portrait</title>
<style>
  html, body { margin: 0; padding: 0; background: #f2ead8; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var LOOP = 60; // seconds; every ambient period divides 60, so the loop closes exactly
  var W = 0, H = 0, isPhone = false, curT = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function round4(x) { return Math.round(x * 10000) / 10000; }
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + round4(a) + ')';
  }

  // Seeded per-element attributes (seed 1454000 + index*7919). Never Math.random.
  var PALMS = [];
  (function () {
    var i, r;
    for (i = 0; i < 2; i++) {
      r = mulberry32(1454000 + i * 7919);
      PALMS.push({
        swayPeriod: i === 0 ? 5 : 4,
        swayPhase: r() * Math.PI * 2,
        frondPhases: [r(), r(), r(), r(), r(), r(), r()].map(function (v) { return v * Math.PI * 2; }),
        lean: (r() - 0.5) * 0.06
      });
    }
  })();
  var MARKS = [];
  (function () {
    var i, r;
    for (i = 0; i < 24; i++) {
      r = mulberry32(1454000 + 100 + i * 7919);
      MARKS.push({
        len: 0.010 + r() * 0.014, // fraction of W
        ang: (r() - 0.5) * 0.9,
        dx: (r() - 0.5) * 0.012, // fraction of W
        dy: r() * 0.004 // fraction of H
      });
    }
  })();

  // Recorded interaction events (closed-form functions of event lists + t, never frame state).
  var rustles = []; // {t, x, y}
  var tileDrag = null; // {t0, lift} while a tile drag is active
  var tileReleases = []; // {t, lift}

  function isPhoneSize() {
    var sw = 0, sh = 0;
    try {
      if (typeof window !== 'undefined' && window.screen) {
        sw = window.screen.width; sh = window.screen.height;
      }
    } catch (e) {}
    if (sw > 0 && sh > 0) {
      if (Math.min(sw, sh) < 700) return true;
    }
    return H > W * 1.15;
  }

  function resize() {
    var w = 0, h = 0;
    try {
      if (typeof visualViewport !== 'undefined' && visualViewport) {
        w = visualViewport.width; h = visualViewport.height;
      }
    } catch (e) {}
    if (!w) {
      try { w = window.innerWidth; h = window.innerHeight; } catch (e) {}
    }
    if (w > 0 && h > 0) { W = w; H = h; }
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    isPhone = isPhoneSize();
  }

  function poly(points, fill, stroke) {
    var i;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.002); ctx.stroke(); }
  }

  function dot(x, y, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
  }

  function rustleAt(t, px, py) {
    var i, e, d, prox, sum = 0;
    for (i = 0; i < rustles.length; i++) {
      e = rustles[i];
      if (t < e.t) continue;
      d = Math.sqrt((px - e.x) * (px - e.x) + (py - e.y) * (py - e.y));
      prox = clamp(1 - d / (0.35 * W), 0, 1);
      sum += prox * Math.exp(-(t - e.t) / 3);
    }
    return clamp(sum, 0, 1);
  }

  function tileLiftAt(t) {
    var i, e, lift = 0;
    if (tileDrag) lift = tileDrag.lift;
    for (i = 0; i < tileReleases.length; i++) {
      e = tileReleases[i];
      if (t >= e.t) lift = Math.max(lift, e.lift * Math.exp(-(t - e.t) / 1.5));
    }
    return lift;
  }

  function tileRect(u) {
    var tw = W * (isPhone ? 0.30 : 0.17);
    var th = tw * 1.15;
    return { x: W * 0.80 - tw / 2, y: H * 0.80 - th / 2, w: tw, h: th, tilt: -0.07 };
  }

  function drawPalm(px, py, s, palm, t) {
    var sway = Math.sin(2 * Math.PI * t / palm.swayPeriod + palm.swayPhase) * 0.05;
    var rust = rustleAt(t, px, py - s * 0.5);
    var i, a, fx, fy, lx, ly, tx, ty;
    // Trunk: slightly curved polygon leaning with sway.
    ctx.fillStyle = '#7a5a2a';
    poly([
      [px - s * 0.035, py],
      [px + s * 0.035, py],
      [px + s * 0.02 + sway * s * 0.4 + palm.lean * s, py - s],
      [px - s * 0.02 + sway * s * 0.4 + palm.lean * s, py - s]
    ], '#7a5a2a', '#1a1a1a');
    // Trunk rings.
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = Math.max(1, s * 0.004);
    for (i = 1; i <= 4; i++) {
      ctx.beginPath();
      ctx.moveTo(px - s * 0.03, py - s * i / 5);
      ctx.lineTo(px + s * 0.03, py - s * i / 5);
      ctx.stroke();
    }
    // Fronds fanning from the crown.
    var topX = px + sway * s * 0.4 + palm.lean * s, topY = py - s;
    for (i = 0; i < 7; i++) {
      a = -Math.PI * 0.95 + i * (Math.PI * 0.9 / 6)
        + Math.sin(2 * Math.PI * t / palm.swayPeriod + palm.frondPhases[i]) * 0.06
        + rust * 0.35 * Math.sin(palm.frondPhases[i]);
      fx = topX + Math.cos(a) * s * 0.42;
      fy = topY + Math.sin(a) * s * 0.42 + s * 0.10;
      lx = topX + Math.cos(a - 0.25) * s * 0.22;
      ly = topY + Math.sin(a - 0.25) * s * 0.22 + s * 0.03;
      tx = topX + Math.cos(a + 0.25) * s * 0.22;
      ty = topY + Math.sin(a + 0.25) * s * 0.22 + s * 0.03;
      ctx.fillStyle = '#2a7a3a';
      ctx.beginPath();
      ctx.moveTo(topX, topY);
      ctx.quadraticCurveTo(lx, ly, fx, fy);
      ctx.quadraticCurveTo(tx, ty, topX, topY);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = Math.max(1, s * 0.003);
      ctx.stroke();
    }
    // Coconuts.
    dot(topX - s * 0.03, topY + s * 0.03, s * 0.035, '#7a5a2a');
    dot(topX + s * 0.03, topY + s * 0.03, s * 0.035, '#7a5a2a');
  }

  function draw(t) {
    curT = t;
    var u = Math.min(W, H);
    var ct = (t + 12) % LOOP; // story strip phase-shifted so frame one already holds marks
    var i, m, fade;
    // Ground: paper cream, sky, sea, sand.
    ctx.fillStyle = '#f2ead8';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#d8e8e8';
    ctx.fillRect(0, 0, W, H * 0.55);
    ctx.fillStyle = '#1a7a6a';
    ctx.fillRect(0, H * 0.55, W, H * 0.17);
    // Sea ripple ticks.
    ctx.strokeStyle = rgba('#f2ead8', 0.35);
    ctx.lineWidth = Math.max(1, u * 0.002);
    for (i = 0; i < 8; i++) {
      var ry = H * (0.57 + i * 0.018) + Math.sin(2 * Math.PI * t / 6 + i) * 2;
      var rx = W * (0.05 + i * 0.12);
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx + W * 0.07, ry);
      ctx.stroke();
    }
    ctx.fillStyle = '#f2ead8';
    ctx.fillRect(0, H * 0.72, W, H * 0.28);

    // Palms.
    drawPalm(W * 0.17, H * 0.74, u * 0.52, PALMS[0], t);
    drawPalm(W * 0.85, H * 0.74, u * 0.46, PALMS[1], t);

    // Pirate: shifting weight, navy coat, black hat.
    var px = W * 0.38 + Math.sin(2 * Math.PI * t / 6) * W * 0.008;
    var py = H * 0.74, ps = u * 0.30;
    var lean = Math.sin(2 * Math.PI * t / 6) * 0.02;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(lean);
    // Legs (peek below the coat hem so the figure stands, not floats).
    ctx.fillStyle = '#1a2a5a';
    ctx.fillRect(-ps * 0.09, -ps * 0.42, ps * 0.08, ps * 0.52);
    ctx.fillRect(ps * 0.01, -ps * 0.42, ps * 0.08, ps * 0.52);
    // Coat.
    poly([[-ps * 0.16, -ps * 0.42], [ps * 0.16, -ps * 0.42], [ps * 0.22, ps * 0.02], [-ps * 0.22, ps * 0.02]], '#1a2a5a', '#1a1a1a');
    // Gold sash.
    ctx.fillStyle = '#e8a81a';
    ctx.fillRect(-ps * 0.16, -ps * 0.18, ps * 0.32, ps * 0.045);
    // Head + hat.
    dot(0, -ps * 0.56, ps * 0.11, '#f2ead8');
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = Math.max(1, u * 0.002);
    ctx.beginPath(); ctx.moveTo(ps * 0.11, -ps * 0.56); ctx.arc(0, -ps * 0.56, ps * 0.11, 0, Math.PI * 2); ctx.stroke();
    dot(-ps * 0.04, -ps * 0.57, ps * 0.012, '#1a1a1a');
    dot(ps * 0.04, -ps * 0.57, ps * 0.012, '#1a1a1a');
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-ps * 0.20, -ps * 0.68, ps * 0.40, ps * 0.045);
    ctx.fillRect(-ps * 0.11, -ps * 0.82, ps * 0.22, ps * 0.16);
    ctx.restore();

    // Hawaiian girl: flat costume figure with bobbing flowers.
    var gx = W * 0.62, gy = H * 0.74, gs = u * 0.28;
    var bob = Math.sin(2 * Math.PI * t / 3) * gs * 0.02;
    ctx.save();
    ctx.translate(gx, gy);
    ctx.fillStyle = '#7a5a2a';
    ctx.fillRect(-gs * 0.07, -gs * 0.40, gs * 0.06, gs * 0.50);
    ctx.fillRect(gs * 0.01, -gs * 0.40, gs * 0.06, gs * 0.50);
    poly([[-gs * 0.15, -gs * 0.40], [gs * 0.15, -gs * 0.40], [gs * 0.24, gs * 0.02], [-gs * 0.24, gs * 0.02]], '#e85a8a', '#1a1a1a');
    dot(0, -gs * 0.55, gs * 0.11, '#f2ead8');
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = Math.max(1, u * 0.002);
    ctx.beginPath(); ctx.moveTo(gs * 0.11, -gs * 0.55); ctx.arc(0, -gs * 0.55, gs * 0.11, 0, Math.PI * 2); ctx.stroke();
    dot(-gs * 0.04, -gs * 0.56, gs * 0.012, '#1a1a1a');
    dot(gs * 0.04, -gs * 0.56, gs * 0.012, '#1a1a1a');
    // Hair + flowers (bobbing).
    ctx.fillStyle = '#7a5a2a';
    ctx.beginPath(); ctx.moveTo(-gs * 0.11, -gs * 0.55); ctx.arc(0, -gs * 0.55, gs * 0.11, Math.PI, 0); ctx.fill();
    dot(-gs * 0.08, -gs * 0.66 + bob, gs * 0.035, '#e85a8a');
    dot(gs * 0.09, -gs * 0.64 - bob, gs * 0.035, '#e8a81a');
    dot(gs * 0.02, -gs * 0.70 + bob * 0.5, gs * 0.03, '#e85a8a');
    // Flower garland.
    dot(-gs * 0.10, -gs * 0.42 + bob, gs * 0.03, '#e8a81a');
    dot(0, -gs * 0.40 - bob, gs * 0.03, '#e85a8a');
    dot(gs * 0.10, -gs * 0.42 + bob, gs * 0.03, '#e8a81a');
    ctx.restore();

    // Portrait tile, pasted slightly crooked at lower right, with pasted edge + shadow.
    var tr = tileRect(u);
    var lift = tileLiftAt(t);
    ctx.save();
    ctx.translate(tr.x + tr.w / 2, tr.y + tr.h / 2);
    ctx.rotate(tr.tilt);
    // Shadow (flat alpha, never shadowBlur).
    ctx.fillStyle = rgba('#1a1a1a', 0.25);
    ctx.fillRect(-tr.w / 2 + 4, -tr.h / 2 + 5, tr.w, tr.h);
    // Tile body; top-right corner lifts with the drag, tile never leaves.
    var l = lift;
    ctx.fillStyle = '#d8d8d8';
    ctx.beginPath();
    ctx.moveTo(-tr.w / 2, -tr.h / 2);
    ctx.lineTo(tr.w / 2, -tr.h / 2 - l);
    ctx.lineTo(tr.w / 2, tr.h / 2);
    ctx.lineTo(-tr.w / 2, tr.h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = Math.max(1, u * 0.002); ctx.stroke();
    // Gray-toned face.
    dot(0, -tr.h * 0.08, tr.w * 0.26, '#8a8a8a');
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath(); ctx.moveTo(-tr.w * 0.26, -tr.h * 0.08); ctx.arc(0, -tr.h * 0.08, tr.w * 0.26, Math.PI, 0); ctx.fill();
    dot(-tr.w * 0.10, -tr.h * 0.10, tr.w * 0.025, '#1a1a1a');
    dot(tr.w * 0.10, -tr.h * 0.10, tr.w * 0.025, '#1a1a1a');
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = Math.max(1, u * 0.002);
    ctx.beginPath(); ctx.moveTo(-tr.w * 0.08, tr.h * 0.10); ctx.lineTo(tr.w * 0.08, tr.h * 0.10); ctx.stroke();
    // Pasted edge: darker torn strip along the bottom.
    ctx.fillStyle = rgba('#3a3a3a', 0.35);
    ctx.fillRect(-tr.w / 2, tr.h / 2 - tr.h * 0.05, tr.w, tr.h * 0.05);
    ctx.restore();

    // Story strip: abstract dash marks down the left edge, never readable words.
    var sx = W * 0.035, sy0 = H * 0.10, sStep = H * 0.032;
    ctx.strokeStyle = '#2a2a2a';
    ctx.lineWidth = Math.max(1, u * 0.0025);
    ctx.lineCap = 'round';
    for (i = 0; i < MARKS.length; i++) {
      if (ct < i * 2) break;
      fade = 1;
      if (ct >= 48) fade = clamp((56 - ct) / 8, 0, 1);
      if (fade <= 0) continue;
      m = MARKS[i];
      var mx = sx + m.dx * W, my = sy0 + i * sStep + m.dy * H;
      var ml = m.len * W, ma = m.ang;
      ctx.strokeStyle = rgba('#2a2a2a', fade);
      ctx.beginPath();
      ctx.moveTo(mx - Math.cos(ma) * ml / 2, my - Math.sin(ma) * ml / 2);
      ctx.lineTo(mx + Math.cos(ma) * ml / 2, my + Math.sin(ma) * ml / 2);
      ctx.stroke();
    }
  }

  function pointFrom(e) {
    var x = 0, y = 0;
    if (typeof e.clientX === 'number') { x = e.clientX; y = e.clientY; }
    else if (typeof e.offsetX === 'number') { x = e.offsetX; y = e.offsetY; }
    return { x: x, y: y };
  }

  function inTile(p) {
    var tr = tileRect(Math.min(W, H));
    return p.x >= tr.x - 10 && p.x <= tr.x + tr.w + 10 && p.y >= tr.y - 10 && p.y <= tr.y + tr.h + 10;
  }

  function onDown(e) {
    var p = pointFrom(e);
    if (inTile(p)) {
      tileDrag = { t0: curT, lift: 0, startY: p.y };
    } else {
      rustles.push({ t: curT, x: p.x, y: p.y });
    }
  }
  function onMove(e) {
    var p = pointFrom(e);
    if (tileDrag) {
      tileDrag.lift = clamp(Math.abs(p.y - tileDrag.startY) * 0.25, 0, H * 0.03);
    } else if (e && e.buttons) {
      rustles.push({ t: curT, x: p.x, y: p.y });
    }
  }
  function onUp(e) {
    if (tileDrag) {
      tileReleases.push({ t: curT, lift: tileDrag.lift });
      tileDrag = null;
    }
  }

  resize();
  draw(0);
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  try {
    if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
      visualViewport.addEventListener('resize', function () { resize(); draw(0); });
    }
  } catch (e) {}
  try {
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('resize', function () { resize(); draw(0); });
    }
  } catch (e) {}

  // Test hook (invisible in production): lets the QA probe drive time and pointer events.
  try {
    if (typeof window !== 'undefined') window.__piece = { draw: draw, down: onDown, move: onMove, up: onUp };
  } catch (e) {}

  var t0 = null;
  function loop(ts) {
    if (t0 === null) t0 = ts;
    draw(((ts - t0) / 1000) % LOOP);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
