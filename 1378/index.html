<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Moving Along Image</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0906; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(a, b) {
    var h = (a * 374761393 + b * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // 24 seeded 5x7 dot-matrix glyphs: abstract cipher marks, never letters.
  var GLYPHS = (function () {
    var rnd = mulberry32(1378000);
    var set = [];
    for (var g = 0; g < 24; g++) {
      var bits = [];
      for (var i = 0; i < 35; i++) bits.push(rnd() < 0.42 ? 1 : 0);
      set.push(bits);
    }
    return set;
  })();

  var ORANGE = '#ff7a18';
  var AMBER = '#c25a08';
  var PANEL = '#0a0906';
  var PERIOD = 48; // glyphs per row stream before it repeats, so scroll wraps seamlessly
  var BEAT = 0.8; // seconds a tap-inverted burst lasts
  var TAU = 2.5; // seconds for a drag-scrub offset to decay

  var W = 0, H = 0, pitch = 8, cellW = 48, cellH = 64, rows = 0;
  var rowSeq = [];   // rowSeq[r][k] = glyph index for stream position k
  var rowSpeed = []; // px/s per row
  var rowMode = [];  // rowMode[r][block] = 0 normal, 1 mirrored, 2 inverted

  function isPhone() {
    var s = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (s && s.width && s.height) {
      return Math.min(s.width, s.height) < 700;
    }
    return H > W * 1.15;
  }

  function size() {
    var vp = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vp ? vp.width : window.innerWidth;
    H = vp ? vp.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    pitch = Math.max(6, Math.min(12, Math.round(W / 160)));
    cellW = 6 * pitch;
    cellH = 8 * pitch;
    rows = Math.ceil(H / cellH) + 1;
    rowSeq = [];
    rowSpeed = [];
    rowMode = [];
    for (var r = 0; r < rows; r++) {
      var seq = [];
      for (var k = 0; k < PERIOD; k++) {
        seq.push(Math.floor(hash2(r * 7919 + 13, k * 104729 + 7) * 24));
      }
      rowSeq.push(seq);
      rowSpeed.push(14 + ((r * 7) % 23)); // 14..36 px/s, different per row
      var modes = [];
      for (var b = 0; b < Math.ceil(PERIOD / 8); b++) {
        var h = hash2(r * 31 + 5, b * 17 + 3);
        modes.push(h < 0.12 ? 1 : (h < 0.22 ? 2 : 0));
      }
      rowMode.push(modes);
    }
  }

  // Recorded events, closed-form over piece time.
  var drags = []; // {t0, v0} scrub velocity samples, decay tau TAU
  var taps = [];  // {t0, x, y} tap bursts, one beat long
  var active = null; // {id, x, y, t, lastY}
  var lastT = 0;

  function scrubOffset(t) {
    var off = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      if (t >= d.t0) off += d.v0 * TAU * (1 - Math.exp(-(t - d.t0) / TAU));
    }
    return off;
  }

  function drawDot(x, y, color, halo) {
    if (halo) {
      ctx.globalAlpha = 0.13;
      ctx.fillStyle = color;
      ctx.fillRect(x - pitch * 0.28, y - pitch * 0.28, pitch * 1.56, pitch * 1.56);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = color;
    var s = pitch * 0.72;
    ctx.fillRect(x + (pitch - s) / 2, y + (pitch - s) / 2, s, s);
  }

  function draw(t) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = PANEL;
    ctx.fillRect(0, 0, W, H);
    var scrub = scrubOffset(t);
    var streamW = PERIOD * cellW;
    for (var r = 0; r < rows; r++) {
      var y0 = r * cellH;
      var scroll = rowSpeed[r] * t + scrub;
      var shift = ((scroll % streamW) + streamW) % streamW;
      // First visible stream column, starting one cell before the left edge.
      var first = Math.floor(shift / cellW);
      var xStart = -shift + first * cellW - cellW;
      for (var ci = -1; ci * cellW < W + cellW; ci++) {
        var k = (((first + ci) % PERIOD) + PERIOD) % PERIOD;
        var glyph = GLYPHS[rowSeq[r][k]];
        var block = Math.floor(k / 8);
        var mode = rowMode[r][block];
        var gx = xStart + (ci + 1) * cellW;
        var cx = gx + cellW / 2;
        var cy = y0 + cellH / 2;
        // Tap-burst inversion: cells near a recent tap flip for exactly one beat.
        var burst = false;
        for (var ti = 0; ti < taps.length; ti++) {
          var tp = taps[ti];
          if (t >= tp.t0 && t < tp.t0 + BEAT) {
            var dx = cx - tp.x, dy = cy - tp.y;
            if (dx * dx + dy * dy < 70 * 70) { burst = true; break; }
          }
        }
        var inverted = (mode === 2) !== burst;
        var mirrored = (mode === 1);
        for (var row = 0; row < 7; row++) {
          for (var col = 0; col < 5; col++) {
            var cc = mirrored ? 4 - col : col;
            var on = glyph[row * 5 + cc] === 1;
            if (inverted) on = !on;
            if (!on) continue;
            drawDot(gx + col * pitch, y0 + row * pitch, inverted ? AMBER : ORANGE, true);
          }
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function onDown(e) {
    var x = e.clientX, y = e.clientY;
    active = { id: e.pointerId, x: x, y: y, t: lastT, lastY: y };
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!active || e.pointerId !== active.id) return;
    var dy = e.clientY - active.lastY;
    active.lastY = e.clientY;
    if (dy !== 0) drags.push({ t0: lastT, v0: dy * 4 });
    if (drags.length > 200) drags.splice(0, drags.length - 200);
  }
  function onUp(e) {
    if (!active || e.pointerId !== active.id) return;
    var dx = e.clientX - active.x, dy = e.clientY - active.y;
    var dur = lastT - active.t;
    if (dx * dx + dy * dy < 144 && dur < 0.5) {
      taps.push({ t0: lastT, x: e.clientX, y: e.clientY });
      if (taps.length > 50) taps.splice(0, taps.length - 50);
    }
    active = null;
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', function () { size(); draw(lastT); });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(lastT); });
    }
  }

  size();
  draw(0); // frame one, constant phase (boot flag pattern)

  var started = false;
  var startTs = 0;
  function loop(ts) {
    if (!started) { started = true; startTs = ts; }
    lastT = (ts - startTs) / 1000;
    draw(lastT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
