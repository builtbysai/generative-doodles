<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Sprinkle</title>
<style>
  html, body { margin: 0; padding: 0; background: #CC6CAC; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG: mulberry32 ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(50060);

  // ---------- palette ----------
  var MAGENTA = '#CC6CAC';
  var HOT = '#D42F8D';
  var BIRCH = '#F8F5F0';
  var PURPLE = '#7B5EA7';
  var TEAL = '#87CECA';
  var DRESS = '#47AE65';
  var HAIRLINE = '#E8833A';
  var GROUND = '#A9C453';
  var SKIN = '#F8F5F0';
  var HAIR = '#4A3566';
  var INK = '#33302E';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight;
  }
  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return viewH() > viewW() * 1.15;
  }

  // ---------- scene construction (all seeded, size independent: fractions) ----------
  // Cliffs: jagged ridge polygons across the top third.
  var cliffLayers = [];
  (function buildCliffs() {
    var layers = [
      { base: 0.27, amp: 0.105, color: HOT },
      { base: 0.35, amp: 0.085, color: MAGENTA }
    ];
    for (var L = 0; L < layers.length; L++) {
      var pts = [];
      var n = 14;
      for (var i = 0; i <= n; i++) {
        pts.push({ x: i / n, y: layers[L].base - rng() * layers[L].amp });
      }
      cliffLayers.push({ pts: pts, color: layers[L].color });
    }
  })();

  // Birch trees: trunks + foliage blob clusters.
  var trees = [];
  (function buildTrees() {
    var count = 11; // within 9..13
    for (var i = 0; i < count; i++) {
      var fx = 0.05 + (i / (count - 1)) * 0.90 + (rng() - 0.5) * 0.045;
      var tw = 0.014 + rng() * 0.020;            // trunk width fraction of W
      var topY = 0.16 + rng() * 0.14;            // canopy top
      var botY = 0.60 + rng() * 0.05;            // root at shore
      var lean = (rng() - 0.5) * 0.03;
      var stripes = [];
      var sy = topY + 0.03;
      while (sy < botY - 0.03) {
        stripes.push({ y: sy, h: 0.010 + rng() * 0.014, off: (rng() - 0.5) * 0.4 });
        sy += 0.045 + rng() * 0.05;
      }
      var blobs = [];
      var nb = 3 + Math.floor(rng() * 3);
      for (var b = 0; b < nb; b++) {
        blobs.push({
          dx: (rng() - 0.5) * 0.10,
          dy: (rng() - 0.5) * 0.06,
          r: 0.038 + rng() * 0.040,
          color: rng() < 0.5 ? HOT : MAGENTA
        });
      }
      trees.push({ fx: fx, tw: tw, topY: topY, botY: botY, lean: lean, stripes: stripes, blobs: blobs });
    }
  })();

  // Letters: single uppercase glyphs, scrambled order, never words.
  var GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  function pickLetter() { return GLYPHS[Math.floor(rng() * 26)]; }

  // Foliage letters: anchored inside each tree's blob circles.
  var foliageLetters = [];
  (function buildFoliageLetters() {
    for (var t = 0; t < trees.length; t++) {
      var tr = trees[t];
      for (var b = 0; b < tr.blobs.length; b++) {
        var bl = tr.blobs[b];
        var n = 3 + Math.floor(rng() * 3);
        for (var i = 0; i < n; i++) {
          var ang = rng() * Math.PI * 2;
          var rad = Math.sqrt(rng()) * bl.r * 0.72;
          foliageLetters.push({
            tree: t,
            bx: tr.fx + bl.dx,
            by: (tr.topY + 0.05) + bl.dy,
            br: bl.r,
            x: tr.fx + bl.dx + Math.cos(ang) * rad,
            y: (tr.topY + 0.05) + bl.dy + Math.sin(ang) * rad * 0.8,
            ch: pickLetter(),
            rot: (rng() - 0.5) * 0.9,
            phase: rng() * Math.PI * 2,
            dark: rng() < 0.5
          });
        }
      }
    }
  })();

  // Water letters: drift with the waves, wrap horizontally.
  var waterLetters = [];
  (function buildWaterLetters() {
    var n = 46;
    for (var i = 0; i < n; i++) {
      waterLetters.push({
        x: rng(),
        y: 0.665 + rng() * 0.315,
        ch: pickLetter(),
        rot: (rng() - 0.5) * 0.7,
        phase: rng() * Math.PI * 2,
        dark: rng() < 0.55
      });
    }
  })();

  // Wave squiggle rows in the water.
  var waveRows = [];
  (function buildWaves() {
    for (var r = 0; r < 7; r++) {
      waveRows.push({
        y: 0.655 + r * 0.048 + rng() * 0.012,
        amp: 0.006 + rng() * 0.005,
        len: 0.10 + rng() * 0.08,
        off: rng()
      });
    }
  })();

  // Pink dash clusters on the green shore.
  var dashClusters = [];
  (function buildDashes() {
    for (var i = 0; i < 14; i++) {
      var cx = rng(), cy = 0.575 + rng() * 0.075, n = 3 + Math.floor(rng() * 3), ds = [];
      for (var j = 0; j < n; j++) ds.push({ dx: (rng() - 0.5) * 0.05, dy: (rng() - 0.5) * 0.03, a: rng() * Math.PI });
      dashClusters.push({ cx: cx, cy: cy, ds: ds });
    }
  })();

  // Figure: seeded x at the water edge.
  var FIG = { x: 0.30 + rng() * 0.38, h: 0.30, base: 0.665 };

  // ---------- drawing ----------
  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  function draw(t) {
    var w = viewW(), h = viewH();
    canvas.width = Math.round(w);
    canvas.height = Math.round(h);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var W = canvas.width, H = canvas.height;
    var phone = isPhone();
    var phase = t % 60; // 60s watch-only loop

    // backdrop: magenta sky
    ctx.fillStyle = MAGENTA;
    ctx.fillRect(0, 0, W, H);

    // cliffs
    for (var L = 0; L < cliffLayers.length; L++) {
      var cl = cliffLayers[L];
      var pts = [[0, 0], [W, 0]];
      for (var i = cl.pts.length - 1; i >= 0; i--) pts.push([cl.pts[i].x * W, cl.pts[i].y * H]);
      poly(pts);
      ctx.fillStyle = cl.color;
      ctx.fill();
      // hot ridge line so the front (magenta-on-magenta) cliff still reads
      ctx.beginPath();
      for (var j = 0; j < cl.pts.length; j++) {
        if (j === 0) ctx.moveTo(cl.pts[j].x * W, cl.pts[j].y * H);
        else ctx.lineTo(cl.pts[j].x * W, cl.pts[j].y * H);
      }
      ctx.strokeStyle = HOT;
      ctx.lineWidth = Math.max(2, H * 0.004);
      ctx.stroke();
    }

    // foliage blobs (behind trunks)
    var ti, tr, b, bl;
    for (ti = 0; ti < trees.length; ti++) {
      tr = trees[ti];
      for (b = 0; b < tr.blobs.length; b++) {
        bl = tr.blobs[b];
        ctx.beginPath();
        ctx.ellipse((tr.fx + bl.dx) * W, (tr.topY + 0.05 + bl.dy) * H, bl.r * W, bl.r * W * 0.78, 0, 0, Math.PI * 2);
        ctx.fillStyle = bl.color;
        ctx.fill();
      }
    }

    // foliage letters (rustle: tiny rotation jitter), clipped per blob
    var fs = H * 0.024;
    ctx.font = '700 ' + fs + 'px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var fi = 0; fi < foliageLetters.length; fi++) {
      var fl = foliageLetters[fi];
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(fl.bx * W, fl.by * H, fl.br * W, fl.br * W * 0.78, 0, 0, Math.PI * 2);
      ctx.clip();
      ctx.translate(fl.x * W, fl.y * H);
      ctx.rotate(fl.rot + Math.sin(phase * 1.4 + fl.phase) * 0.07);
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = fl.dark ? '#8E2A66' : BIRCH;
      ctx.fillText(fl.ch, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // birch trunks with purple stripes
    for (ti = 0; ti < trees.length; ti++) {
      tr = trees[ti];
      var topX = (tr.fx + tr.lean) * W, botX = tr.fx * W;
      var topY = tr.topY * H, botY = tr.botY * H, tw = tr.tw * W;
      poly([[topX - tw / 2, topY], [topX + tw / 2, topY], [botX + tw * 0.72, botY], [botX - tw * 0.72, botY]]);
      ctx.fillStyle = BIRCH;
      ctx.fill();
      ctx.save();
      poly([[topX - tw / 2, topY], [topX + tw / 2, topY], [botX + tw * 0.72, botY], [botX - tw * 0.72, botY]]);
      ctx.clip();
      ctx.fillStyle = PURPLE;
      for (var s = 0; s < tr.stripes.length; s++) {
        var st = tr.stripes[s];
        var cxAtY = topX + (botX - topX) * ((st.y - tr.topY) / (tr.botY - tr.topY));
        ctx.save();
        ctx.translate(cxAtY + st.off * tw, st.y * H);
        ctx.rotate(tr.lean * 1.4);
        ctx.fillRect(-tw * 0.75, -st.h * H / 2, tw * 1.5, st.h * H);
        ctx.restore();
      }
      ctx.restore();
    }

    // green shore (foreground ground) at the water edge
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0.565 * H, W, 0.10 * H);
    // pink dash clusters
    ctx.strokeStyle = HOT;
    ctx.lineWidth = Math.max(2, H * 0.004);
    ctx.lineCap = 'round';
    for (var d = 0; d < dashClusters.length; d++) {
      var dc = dashClusters[d];
      for (var dj = 0; dj < dc.ds.length; dj++) {
        var dd = dc.ds[dj];
        var dx = (dc.cx + dd.dx) * W, dy = (dc.cy + dd.dy) * H;
        var dl = H * 0.012;
        ctx.beginPath();
        ctx.moveTo(dx - Math.cos(dd.a) * dl, dy - Math.sin(dd.a) * dl);
        ctx.lineTo(dx + Math.cos(dd.a) * dl, dy + Math.sin(dd.a) * dl);
        ctx.stroke();
      }
    }

    // water: bottom 38%
    ctx.fillStyle = TEAL;
    ctx.fillRect(0, 0.62 * H, W, 0.38 * H);

    // drifting squiggle waves (wrap)
    var drift = (phase / 60) * 0.25; // fraction of W per loop
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = Math.max(2, H * 0.0045);
    ctx.lineCap = 'round';
    for (var r = 0; r < waveRows.length; r++) {
      var wr = waveRows[r];
      var segLen = wr.len * W, amp = wr.amp * H;
      var rowOff = ((wr.off - drift) % 1 + 1) % 1;
      for (var k = -1; k < 2; k++) {
        var startX = (rowOff + k) * W - segLen * 0.5;
        // tiles of squiggles across the row
        for (var x0 = startX; x0 < startX + W + segLen; x0 += segLen * 1.7) {
          ctx.beginPath();
          var steps = 14;
          for (var q = 0; q <= steps; q++) {
            var px = x0 + (q / steps) * segLen;
            var py = wr.y * H + Math.sin((q / steps) * Math.PI * 2) * amp;
            if (q === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }
      }
    }

    // water letters drift with the waves and wrap
    ctx.font = '700 ' + fs + 'px Arial, sans-serif';
    for (var wi = 0; wi < waterLetters.length; wi++) {
      var wl = waterLetters[wi];
      var wx = (((wl.x - drift) % 1) + 1) % 1;
      var wy = wl.y + Math.sin(phase * 0.9 + wl.phase) * 0.0022;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0.625 * H, W, 0.375 * H);
      ctx.clip();
      ctx.translate(wx * W, wy * H);
      ctx.rotate(wl.rot);
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = wl.dark ? '#2E7E7A' : '#FFFFFF';
      ctx.fillText(wl.ch, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // ---------- figure (her grammar) ----------
    var fh = FIG.h * H;
    var fx = FIG.x * W, fBase = FIG.base * H;
    var headR = fh * 0.115;
    var headCY = fBase - fh + headR * 1.15;
    var sway = Math.sin(phase * 1.1) * headR * 0.10;

    // legs
    ctx.strokeStyle = SKIN;
    ctx.lineWidth = fh * 0.045;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(fx - fh * 0.055, fBase - fh * 0.30);
    ctx.lineTo(fx - fh * 0.06, fBase - fh * 0.015);
    ctx.moveTo(fx + fh * 0.055, fBase - fh * 0.30);
    ctx.lineTo(fx + fh * 0.065, fBase - fh * 0.015);
    ctx.stroke();
    // feet
    ctx.strokeStyle = INK;
    ctx.lineWidth = fh * 0.03;
    ctx.beginPath();
    ctx.moveTo(fx - fh * 0.06, fBase - fh * 0.008);
    ctx.lineTo(fx - fh * 0.005, fBase - fh * 0.008);
    ctx.moveTo(fx + fh * 0.065, fBase - fh * 0.008);
    ctx.lineTo(fx + fh * 0.12, fBase - fh * 0.008);
    ctx.stroke();

    // dress: trapezoid with polka dots
    var dressTop = headCY + headR * 1.02;
    var dressBot = fBase - fh * 0.28;
    var dTopHW = fh * 0.085, dBotHW = fh * 0.17;
    poly([[fx - dTopHW, dressTop], [fx + dTopHW, dressTop], [fx + dBotHW, dressBot], [fx - dBotHW, dressBot]]);
    ctx.fillStyle = DRESS;
    ctx.fill();
    ctx.save();
    poly([[fx - dTopHW, dressTop], [fx + dTopHW, dressTop], [fx + dBotHW, dressBot], [fx - dBotHW, dressBot]]);
    ctx.clip();
    ctx.fillStyle = '#FFFFFF';
    var dotR = fh * 0.016, dotGap = fh * 0.075;
    for (var gy = dressTop + dotGap * 0.5, row = 0; gy < dressBot; gy += dotGap, row++) {
      for (var gx = fx - dBotHW + dotGap * 0.5 + (row % 2) * dotGap * 0.5; gx < fx + dBotHW; gx += dotGap) {
        ctx.beginPath();
        ctx.arc(gx, gy, dotR, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    // arms
    ctx.strokeStyle = SKIN;
    ctx.lineWidth = fh * 0.04;
    ctx.beginPath();
    ctx.moveTo(fx - dTopHW * 0.9, dressTop + fh * 0.02);
    ctx.lineTo(fx - dTopHW - fh * 0.055, dressTop + fh * 0.16);
    ctx.moveTo(fx + dTopHW * 0.9, dressTop + fh * 0.02);
    ctx.lineTo(fx + dTopHW + fh * 0.055, dressTop + fh * 0.16);
    ctx.stroke();

    // head: skin
    ctx.beginPath();
    ctx.arc(fx, headCY, headR, 0, Math.PI * 2);
    ctx.fillStyle = SKIN;
    ctx.fill();
    // hair block (flat cap on top of head)
    ctx.beginPath();
    ctx.arc(fx, headCY - headR * 0.10, headR * 1.02, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = HAIR;
    ctx.fill();
    // orange rim hairline along the hair edge, swaying
    ctx.beginPath();
    ctx.arc(fx + sway, headCY - headR * 0.10, headR * 1.05, Math.PI * 1.06, Math.PI * 1.72);
    ctx.strokeStyle = HAIRLINE;
    ctx.lineWidth = Math.max(2, fh * 0.016);
    ctx.stroke();
    // face: 2-arc eyes, L-line nose, short-curve smile
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.6, fh * 0.010);
    ctx.beginPath();
    ctx.arc(fx - headR * 0.36, headCY + headR * 0.08, headR * 0.13, Math.PI * 1.08, Math.PI * 1.92);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(fx + headR * 0.36, headCY + headR * 0.08, headR * 0.13, Math.PI * 1.08, Math.PI * 1.92);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(fx + headR * 0.02, headCY + headR * 0.10);
    ctx.lineTo(fx + headR * 0.02, headCY + headR * 0.34);
    ctx.lineTo(fx + headR * 0.16, headCY + headR * 0.36);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(fx, headCY + headR * 0.38, headR * 0.30, Math.PI * 0.18, Math.PI * 0.82);
    ctx.stroke();

    if (phone) { /* composition identical; portrait logic already phone-first */ }
  }

  // ---------- boot: deterministic first frame at constant phase 0 ----------
  draw(12); // fixed pre-roll phase so frame one is developed, never clock-derived

  var start = null;
  function frame(now) {
    if (start === null) start = now;
    draw(12 + (now - start) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

  function onResize() { draw(12); if (typeof requestAnimationFrame !== 'function') return; }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
