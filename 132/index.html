<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№132 · Shader Room</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B0D; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(214,222,235,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to scrub the rehearsal</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function sstep(x){ x=clamp(x,0,1); return x*x*(3-2*x); }

// No.132 Shader Room: three ghost collaborators type one GLSL shader in a dark
// editor (top 35%); below, a software-raymarched chrome torus knot (bottom 65%)
// whose uniforms are driven by the same scripted timeline, so every typed edit
// morphs the knot on the same frame. 24s seamless loop.
const ED='#1E1E2E', CODE='#D6DEEB', KW='#C792EA', NUM='#F78C6C', GROUND='#0B0B0D';
const CHROME=[200,204,212];
const GHOSTS=[
  {name:'char',    color:'#FF3EB5', line:3},
  {name:'ghost-1', color:'#5AF2FF', line:2},
  {name:'ghost-2', color:'#E8FF47', line:4}
];
const LINES=[
  '// shader room: one knot, three typists',
  'uniform float uTime;',
  'const int STEPS = {STEPS};',
  'const float TWIST = {TWIST};',
  'const float TINT = {TINT};',
  'float knot(vec3 p) {',
  '  float th = atan(p.z, p.x);',
  '  vec2 q = vec2(length(p.xz) - 0.92, p.y);',
  '  vec2 c = vec2(cos(TWIST * th),',
  '                sin(TWIST * th));',
  '  return length(q - 0.38 * c) - 0.24;',
  '}',
  'void main() { march(STEPS); shade(TINT); }'
];
const KEYLINE={STEPS:2, TWIST:3, TINT:4};
const KEYBASE={STEPS:'64', TWIST:'2.0', TINT:'0.35'};
// ghost: 0 char, 1 ghost-1, 2 ghost-2. Each edits its own constant, then reverts.
const EVENTS=[
  {t:2.0,  dur:2.4, key:'STEPS', from:'64',   to:'36',   ghost:1},
  {t:6.5,  dur:2.2, key:'TWIST', from:'2.0',  to:'3.0',  ghost:0},
  {t:11.0, dur:2.2, key:'TINT',  from:'0.35', to:'0.80', ghost:2},
  {t:15.5, dur:2.0, key:'STEPS', from:'36',   to:'64',   ghost:1},
  {t:18.5, dur:2.0, key:'TWIST', from:'3.0',  to:'2.0',  ghost:0},
  {t:21.0, dur:1.8, key:'TINT',  from:'0.80', to:'0.35', ghost:2}
];
const LOOP=24;
let timeVal=8.0, lastMs=null, dragging=false, dragLastX=0;

function keyState(key, pt){
  // returns {text, value} for an editable constant at performance time pt
  let text=KEYBASE[key], value=parseFloat(KEYBASE[key]), active=null;
  for(const ev of EVENTS){
    if(ev.key!==key) continue;
    if(pt>=ev.t+ev.dur){ text=ev.to; value=parseFloat(ev.to); }
    else if(pt>=ev.t){
      const p=(pt-ev.t)/ev.dur;
      if(p<0.45){ const k=Math.floor((p/0.45)*ev.from.length); text=ev.from.slice(0, ev.from.length-k); }
      else { const k=Math.floor(((p-0.45)/0.55)*ev.to.length); text=ev.to.slice(0,k); }
      value=parseFloat(ev.from)+(parseFloat(ev.to)-parseFloat(ev.from))*sstep(p);
      active=ev;
    }
  }
  return {text, value, active};
}
function buildLines(pt){
  const st={};
  for(const k in KEYLINE) st[k]=keyState(k, pt);
  const out=LINES.map(l=>l.replace('{STEPS}', st.STEPS.text).replace('{TWIST}', st.TWIST.text).replace('{TINT}', st.TINT.text));
  return {out, st};
}
const KEYWORDS=['uniform','const','int','float','vec2','vec3','void','return'];
function tokenize(line){
  const ci=line.indexOf('//');
  const codePart=ci>=0?line.slice(0,ci):line, comPart=ci>=0?line.slice(ci):'';
  const runs=[]; const re=/([A-Za-z_][A-Za-z0-9_]*)|(\d+\.?\d*)|(\s+)|(.)/g; let m;
  while((m=re.exec(codePart))!==null){
    if(m[1]!==undefined) runs.push({t:m[1], c:KEYWORDS.indexOf(m[1])>=0?KW:CODE});
    else if(m[2]!==undefined) runs.push({t:m[2], c:NUM});
    else runs.push({t:m[0], c:CODE});
  }
  if(comPart) runs.push({t:comPart, c:'rgba(214,222,235,0.42)'});
  return runs;
}

// --- torus knot SDF + chrome shading ---
function knotSDF(x,y,z,tw){
  const th=Math.atan2(z,x);
  const u=Math.hypot(x,z)-0.92;
  const du=u-0.38*Math.cos(tw*th), dv=y-0.38*Math.sin(tw*th);
  return Math.hypot(du,dv)-0.24;
}
function envB(rx,ry,rz){
  let b=0.22+0.50*Math.pow(Math.max(0, ry*0.5+0.5), 1.5);
  b+=0.55*Math.pow(Math.max(0, Math.sin(ry*7.0+1.2)), 6);
  b+=0.30*Math.pow(Math.max(0, Math.sin(rx*5.0-0.7)), 8);
  return Math.min(b,1.45);
}
function renderKnot(rx0, ry0, rw, rh, pt, stepsU, tw, tintU){
  ctx.fillStyle=GROUND; ctx.fillRect(rx0, ry0, rw, rh);
  const target=34000;
  const cell=clamp(Math.round(Math.sqrt(rw*rh/target)), 4, 7);
  const cw=Math.ceil(rw/cell), chh=Math.ceil(rh/cell);
  const rot=pt*(Math.PI*2/LOOP), tilt=0.55;
  const cr=Math.cos(rot), sr=Math.sin(rot), ct=Math.cos(tilt), st=Math.sin(tilt);
  const camX=0, camY=0.15, camZ=3.3;
  const aspect=rw/rh;
  const tanV=1.74/(camZ*Math.min(1, aspect)); // fit the knot's bounding sphere on the short axis
  const maxSteps=Math.max(16, Math.round(stepsU));
  const LX=0.55, LY=0.75, LZ=0.36; // one analytic light, normalised-ish
  for(let j=0;j<chh;j++){
    const ndcY=1-((j+0.5)/chh)*2;
    for(let i=0;i<cw;i++){
      const ndcX=((i+0.5)/cw*2-1)*aspect;
      let dx=ndcX*aspect*tanV, dy=ndcY*tanV, dz=-1;
      const dl=Math.hypot(dx,dy,dz); dx/=dl; dy/=dl; dz/=dl;
      // march in knot space: tilt (X) first, then orbit (Y), so the orbit
      // angle cannot turn the camera elevation into roll
      let ox=camX, oy=camY, oz=camZ;
      { const y=oy*ct-oz*st, z=oy*st+oz*ct; oy=y; oz=z;
        const x=ox*cr-oz*sr, z2=ox*sr+oz*cr; ox=x; oz=z2; }
      { const y=dy*ct-dz*st, z=dy*st+dz*ct; dy=y; dz=z;
        const x=dx*cr-dz*sr, z2=dx*sr+dz*cr; dx=x; dz=z2; }
      let t=0.6, d=0, hit=false, px=0, py=0, pz=0, used=0;
      for(let s=0;s<maxSteps;s++){
        px=ox+dx*t; py=oy+dy*t; pz=oz+dz*t;
        d=knotSDF(px,py,pz,tw); used=s;
        if(d<0.004){ hit=true; break; }
        t+=Math.max(d*0.85, 0.012);
        if(t>9) break;
      }
      if(!hit) continue;
      const e=0.006;
      let nx=knotSDF(px+e,py,pz,tw)-knotSDF(px-e,py,pz,tw);
      let ny=knotSDF(px,py+e,pz,tw)-knotSDF(px,py-e,pz,tw);
      let nz=knotSDF(px,py,pz+e,tw)-knotSDF(px,py,pz-e,tw);
      const nl=Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;
      const vx=-dx, vy=-dy, vz=-dz;
      const ndv=Math.max(0, nx*vx+ny*vy+nz*vz);
      let rx=2*ndv*nx-vx, ry=2*ndv*ny-vy, rz=2*ndv*nz-vz;
      const diff=Math.max(0, nx*LX+ny*LY+nz*LZ);
      const rim=Math.pow(1-ndv, 3);
      const ao=1-0.35*(used/maxSteps);
      let b=(0.16+0.80*envB(rx,ry,rz)+0.30*diff)*ao + rim*tintU*0.85;
      b=clamp(b, 0, 1.25);
      const r=Math.round(CHROME[0]*Math.min(b,1)), g=Math.round(CHROME[1]*Math.min(b,1)), bl=Math.round(CHROME[2]*Math.min(b,1));
      ctx.fillStyle='rgb('+r+','+g+','+bl+')';
      ctx.fillRect(rx0+i*cell, ry0+j*cell, cell, cell);
    }
  }
}

function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(!dragging) timeVal+=dt;
  const pt=((timeVal%LOOP)+LOOP)%LOOP;
  const edH=Math.round(h*0.35);
  // editor pane
  ctx.fillStyle=ED; ctx.fillRect(0,0,w,edH);
  const {out, st}=buildLines(pt);
  const lineH=clamp(Math.floor((edH-12)/out.length), 14, 25);
  const fs=clamp(lineH-7, 9, 15);
  const MONO='Menlo, Consolas, "DejaVu Sans Mono", monospace';
  ctx.font=fs+'px '+MONO; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  const charW=ctx.measureText('M').width||fs*0.6;
  const padX=Math.max(10, Math.round(w*0.018));
  const topY=Math.max(fs+6, Math.round((edH-out.length*lineH)/2)+fs);
  for(let li=0; li<out.length; li++){
    const y=topY+li*lineH; let x=padX;
    for(const run of tokenize(out[li])){
      ctx.fillStyle=run.c; ctx.fillText(run.t, x, y);
      x+=ctx.measureText(run.t).width;
    }
  }
  // ghost carets + name flags
  const blink=((pt*1.6)%1)<0.62;
  for(let gi=0; gi<3; gi++){
    const g=GHOSTS[gi];
    let line=g.line, col=out[line].length, active=false;
    for(const k in KEYLINE){
      const s=st[k];
      if(s.active && s.active.ghost===gi){
        line=KEYLINE[k];
        const li=LINES[line].indexOf('{'+k+'}');
        col=li+s.text.length; active=true;
      }
    }
    const cx=padX+col*charW, cy=topY+line*lineH;
    ctx.globalAlpha=active?1:(blink?0.95:0.45);
    ctx.fillStyle=g.color;
    ctx.fillRect(cx, cy-fs-1, 2, fs+4);
    // name flag above the caret
    ctx.font='bold 9px '+MONO;
    const fw=ctx.measureText(g.name).width+10;
    const fx=clamp(cx-4, 2, w-fw-2), fy=Math.max(2, cy-fs-16);
    ctx.fillRect(fx, fy, fw, 13);
    ctx.fillStyle='#14141B'; ctx.fillText(g.name, fx+5, fy+10);
    ctx.font=fs+'px '+MONO;
    ctx.globalAlpha=1;
  }
  // divider
  ctx.fillStyle='rgba(214,222,235,0.14)'; ctx.fillRect(0, edH, w, 1);
  // render pane
  renderKnot(0, edH+1, w, h-edH-1, pt, st.STEPS.value, st.TWIST.value, st.TINT.value);
}

function frame(nowMs){ drawFrame(nowMs); }
function ptr(e){ return [e.clientX, e.clientY]; }
canvas.addEventListener('pointerdown',e=>{ const [x]=ptr(e); dragging=true; dragLastX=x; });
canvas.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const [x]=ptr(e);
  timeVal += (x-dragLastX)*(LOOP/Math.max(1,viewportWH()[0]));
  dragLastX=x; frame(performance.now());
});
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);
function loop(nowMs){ frame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
frame(0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>frame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>frame(performance.now()));
</script>
</body>
</html>
