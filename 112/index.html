<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№112 · Palindrome</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E0C0A; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(244,203,137,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to move the center</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function qseed(){ const m=(window.location&&window.location.search||'').match(/seed=(\d+)/); return m?parseInt(m[1],10):null; }
function hexRgb(hx){ return [parseInt(hx.slice(1,3),16), parseInt(hx.slice(3,5),16), parseInt(hx.slice(5,7),16)]; }
function mixc(c1,c2,f){ return [Math.round(c1[0]+(c2[0]-c1[0])*f), Math.round(c1[1]+(c2[1]-c1[1])*f), Math.round(c1[2]+(c2[2]-c1[2])*f)]; }
function css(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

// No.112 Palindrome: 140 concentric stroked circles from an off-centre origin,
// coloured by angle from a mirrored (palindromic) palette; phase turns slowly.
let seed=qseed()||112112;
const BASE=['#6B0C22','#D9042B','#F4CB89','#588C8C'].map(hexRgb);
let order=[0,1,2,3];
const NC=140;
let LUT=[];
function buildLUT(){ const seq=[BASE[order[0]],BASE[order[1]],BASE[order[2]],BASE[order[3]],BASE[order[2]],BASE[order[1]]]; LUT=[]; for(let i=0;i<720;i++){ const pos=(i/720)*6; const k=Math.floor(pos)%6; const f=pos-Math.floor(pos); LUT.push(css(mixc(seq[k],seq[(k+1)%6],f),0.9)); } }
function reseed(){ seed=(seed*1664525+1013904223)>>>0; const rand=mulberry(seed^Date.now()); const o=[0,1,2,3]; for(let i=3;i>0;i--){ const j=(rand()*(i+1))|0; const t=o[i]; o[i]=o[j]; o[j]=t; } order=o; buildLUT(); }
buildLUT();
let orgX=null, orgY=null, dragging=false, dragX=0, dragY=0, lastDownMs=-1e9, lastDownX=0, lastDownY=0, lastMs=null;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0.016; if(lastMs!==null) dt=clamp((nowMs-lastMs)/1000,0.001,0.05); lastMs=nowMs;
  const hx=w*0.62, hy=h*0.42;
  if(orgX===null){ orgX=hx; orgY=hy; }
  const tx=dragging?dragX:hx, ty=dragging?dragY:hy;
  const ease=1-Math.exp(-dt*3.2); orgX+=(tx-orgX)*ease; orgY+=(ty-orgY)*ease;
  const t=nowMs/1000;
  const phase=(t*0.0045)%1;
  ctx.fillStyle='#0E0C0A'; ctx.fillRect(0,0,w,h);
  let Rmax=0; for(const [cx,cy] of [[0,0],[w,0],[0,h],[w,h]]){ const d=Math.hypot(cx-orgX,cy-orgY); if(d>Rmax)Rmax=d; }
  Rmax*=1.03;
  const SEG=isPhone()?96:120;
  const step=(Math.PI*2)/SEG;
  ctx.lineCap='butt';
  for(let i=0;i<NC;i++){
    const r=Rmax*(i+1)/NC;
    ctx.lineWidth=clamp(r*0.012,0.75,3);
    const rOff=r*0.0012+phase;
    // batch runs of near-equal colour into one path per run; consecutive arcs
    // on the same circle join along the chord, invisible at this segment size
    let runQ=-1;
    for(let sgm=0; sgm<SEG; sgm++){
      const u=((sgm+0.5)/SEG + rOff)%1;
      const li=((u*720)|0)%720; const q=li-(li%3);
      if(q!==runQ){ if(runQ>=0) ctx.stroke(); ctx.strokeStyle=LUT[q]; ctx.beginPath(); runQ=q; }
      ctx.arc(orgX,orgY,r,sgm*step,(sgm+1)*step*1.06);
    }
    if(runQ>=0) ctx.stroke();
  }
  if(NC!==140) console.assert(false,'circles',NC);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ if(nowMsDiff(e)<350 && Math.hypot(e.clientX-lastDownX,e.clientY-lastDownY)<44) reseed(); lastDownMs=performance.now(); lastDownX=e.clientX; lastDownY=e.clientY; dragging=true; dragX=e.clientX; dragY=e.clientY; });
function nowMsDiff(){ return performance.now()-lastDownMs; }
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; dragX=e.clientX; dragY=e.clientY; });
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(3000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
