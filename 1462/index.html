<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taiga Line</title>
<style>
  html, body { margin: 0; padding: 0; background: #d8cfae; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  /* ---- seeded PRNG (mulberry32), never Math.random ---- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1462000);

  /* ---- palette: parchment map, muted flat tones only ---- */
  var PARCH = '#d8cfae', ROUTE = '#a34a24';
  var GRASS = [138, 154, 91], RIVER = [91, 122, 138], SNOW = [242, 242, 242];
  var YURT = '#efe6d0', DARK = '#2a2a30';
  var LANDS = [GRASS, RIVER, SNOW, GRASS];

  /* ---- viewport ---- */
  var W = 0, H = 0, M = 0, phone = false;
  var pathPts = null, pathLen = null;
  function size() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.round(W); canvas.height = Math.round(H);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    M = Math.min(W, H);
    var minScreen = 99999;
    if (typeof window !== 'undefined' && window.screen) {
      minScreen = Math.min(window.screen.width, window.screen.height);
    }
    phone = minScreen < 700 || (H > W * 1.15 && minScreen >= 700 && W < 700);
    buildPath();
  }
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', size);
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', size);
    }
  }

  /* ---- helpers (node-canvas safe: no gradients, no shadowBlur, no Path2D) ---- */
  function a4(x) { return Math.round(x * 10000) / 10000; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function rgba(c, a) {
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a4(a) + ')';
  }
  function mix3(c1, c2, f) {
    return [Math.round(c1[0] + (c2[0] - c1[0]) * f),
            Math.round(c1[1] + (c2[1] - c1[1]) * f),
            Math.round(c1[2] + (c2[2] - c1[2]) * f)];
  }
  function shade(c, f) {
    return [Math.round(c[0] * f), Math.round(c[1] * f), Math.round(c[2] * f)];
  }
  function dot(x, y, r, fill) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
  }
  function ellipse(x, y, rx, ry, fill) {
    ctx.beginPath(); ctx.moveTo(x + rx, y); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
  }
  function rect(x, y, w, h, fill) {
    ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  }

  /* ---- route: fixed Catmull-Rom path, lower left to upper right, x monotonic ---- */
  var CTRL = [[0.10, 0.86], [0.20, 0.76], [0.33, 0.82], [0.48, 0.62],
              [0.58, 0.70], [0.72, 0.45], [0.86, 0.52], [0.94, 0.30]];
  function buildPath() {
    var pts = [];
    var n = CTRL.length;
    function cr(p0, p1, p2, p3, t) {
      var t2 = t * t, t3 = t2 * t;
      return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
    }
    for (var i = 0; i < n - 1; i++) {
      var p0 = CTRL[Math.max(0, i - 1)], p1 = CTRL[i], p2 = CTRL[i + 1], p3 = CTRL[Math.min(n - 1, i + 2)];
      for (var k = 0; k < 30; k++) {
        var t = k / 30;
        pts.push([cr(p0[0], p1[0], p2[0], p3[0], t) * W, cr(p0[1], p1[1], p2[1], p3[1], t) * H]);
      }
    }
    pts.push([CTRL[n - 1][0] * W, CTRL[n - 1][1] * H]);
    var cum = [0];
    for (var j = 1; j < pts.length; j++) {
      var dx = pts[j][0] - pts[j - 1][0], dy = pts[j][1] - pts[j - 1][1];
      cum.push(cum[j - 1] + Math.sqrt(dx * dx + dy * dy));
    }
    pathPts = pts; pathLen = cum;
  }
  function pointAt(s) {
    var total = pathLen[pathLen.length - 1];
    var d = s * total, lo = 0, hi = pathLen.length - 1;
    while (lo < hi - 1) {
      var mid = (lo + hi) >> 1;
      if (pathLen[mid] <= d) lo = mid; else hi = mid;
    }
    var seg = pathLen[hi] - pathLen[lo] || 1;
    var f = (d - pathLen[lo]) / seg;
    var x = pathPts[lo][0] + (pathPts[hi][0] - pathPts[lo][0]) * f;
    var y = pathPts[lo][1] + (pathPts[hi][1] - pathPts[lo][1]) * f;
    var ang = Math.atan2(pathPts[hi][1] - pathPts[lo][1], pathPts[hi][0] - pathPts[lo][0]);
    return { x: x, y: y, ang: ang };
  }

  /* ---- seeded decoration: grass tufts and pebbles, fractions of frame ---- */
  var tufts = [];
  for (var ti = 0; ti < 46; ti++) {
    tufts.push([rng(), 0.12 + rng() * 0.80, 0.5 + rng() * 0.5]);
  }

  /* ---- journey state: ping-pong triangle wave, 240 s one way (480 s cycle) ---- */
  var JOURNEY = 240;
  var phi0 = 0, tAnchor = 0, dir = 1; /* dir: travel direction at anchor */
  var dragging = false, dragStartX = 0, dragStartS = 0, dragLastX = 0, dragS = 0;
  function tri(phi) {
    var m = phi - Math.floor(phi / 2) * 2;
    return m <= 1 ? m : 2 - m;
  }
  function dirAt(phi) {
    var m = phi - Math.floor(phi / 2) * 2;
    return m <= 1 ? 1 : -1;
  }
  function journeyS(t) {
    if (dragging) return dragS;
    var phi = phi0 + (t - tAnchor) / JOURNEY;
    return tri(phi);
  }
  function releaseDrag(t) {
    var d = dragLastX - dragStartX;
    if (Math.abs(d) > 4) dir = d > 0 ? 1 : -1;
    /* anchor the triangle wave at the scrubbed position, travelling in dir */
    phi0 = (dir === 1) ? dragS : 2 - dragS;
    tAnchor = t;
    dragging = false;
  }

  /* ---- pointer: drag along the route scrubs the journey, never jumps ---- */
  function onDown(e) {
    dragging = true;
    dragStartX = e.clientX; dragLastX = e.clientX;
    dragStartS = journeyS(lastT); dragS = dragStartS;
  }
  function onMove(e) {
    if (!dragging) return;
    dragLastX = e.clientX;
    dragS = clamp(dragStartS + (e.clientX - dragStartX) / W * 1.2, 0, 1);
  }
  function onUp(e) {
    if (!dragging) return;
    releaseDrag(lastT);
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  /* ---- draw ---- */
  var lastT = 0;
  function draw(t) {
    lastT = t;
    if (!pathPts) buildPath();
    var s = journeyS(t);
    var p = s * 4;
    var k = Math.min(3, Math.floor(p));
    var f = p - k;
    var fe = (1 - Math.cos(Math.PI * f)) / 2; /* full-minute cosine crossfade */
    var cur = LANDS[k], nxt = (k < 3) ? LANDS[k + 1] : GRASS; /* last leg holds grass */
    var hill = mix3(cur, nxt, fe);
    var wRiver = (cur === RIVER ? 1 - fe : 0) + (nxt === RIVER ? fe : 0);
    var wSnow = (cur === SNOW ? 1 - fe : 0) + (nxt === SNOW ? fe : 0);
    var wGrass = (cur === GRASS ? 1 - fe : 0) + (nxt === GRASS ? fe : 0);

    /* parchment ground */
    rect(0, 0, W, H, PARCH);

    /* rolling land: three sine ridges in the blended landscape colour */
    var shades = [1.0, 0.92, 0.84];
    for (var r = 0; r < 3; r++) {
      var base = H * (0.52 + r * 0.17);
      var amp = M * (0.028 + r * 0.008);
      var ph = r * 1.7 + 0.6;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (var x = 0; x <= W; x += Math.max(4, W / 120)) {
        var y = base + Math.sin(x / W * Math.PI * 2 * (1 + r * 0.5) + ph) * amp;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fillStyle = rgba(shade(hill, shades[r]), 1);
      ctx.fill();
    }

    /* river ribbon, winding across the frame, fading with the river weight */
    if (wRiver > 0.001) {
      ctx.beginPath();
      ctx.moveTo(-10, H * 0.34);
      for (var rx = 0; rx <= W + 10; rx += Math.max(4, W / 120)) {
        ctx.lineTo(rx, H * 0.34 + Math.sin(rx / W * Math.PI * 3 + 1.1) * M * 0.05);
      }
      ctx.lineTo(W + 10, H * 0.34 + M * 0.06);
      for (var bx = W + 10; bx >= -10; bx -= Math.max(4, W / 120)) {
        ctx.lineTo(bx, H * 0.34 + Math.sin(bx / W * Math.PI * 3 + 1.1) * M * 0.05 + M * 0.055);
      }
      ctx.closePath();
      ctx.fillStyle = rgba(RIVER, wRiver);
      ctx.fill();
    }

    /* snow wash, fading with the snow weight */
    if (wSnow > 0.001) {
      rect(0, 0, W, H, rgba(SNOW, wSnow * 0.55));
    }

    /* grass tufts, fading with the grass weight */
    if (wGrass > 0.001) {
      for (var ui = 0; ui < tufts.length; ui++) {
        var tx = tufts[ui][0] * W, ty = tufts[ui][1] * H, ts = tufts[ui][2] * M * 0.006;
        rect(tx - ts * 0.5, ty - ts, ts, ts * 2, rgba(GRASS, wGrass * 0.85));
        rect(tx + ts * 0.8, ty - ts * 0.7, ts, ts * 1.4, rgba(GRASS, wGrass * 0.85));
      }
    }

    /* route line, rust, lower left to upper right */
    ctx.beginPath();
    ctx.moveTo(pathPts[0][0], pathPts[0][1]);
    for (var pi = 1; pi < pathPts.length; pi++) ctx.lineTo(pathPts[pi][0], pathPts[pi][1]);
    ctx.strokeStyle = ROUTE;
    ctx.lineWidth = Math.max(2, M * 0.005);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke();

    /* travelling group, sitting on the line */
    var P = pointAt(s);
    var ux = Math.cos(P.ang), uy = Math.sin(P.ang);
    var vx = -uy, vy = ux;
    function at(along, perp) {
      return [P.x + ux * along + vx * perp, P.y + uy * along + vy * perp];
    }
    /* yurt: ivory dome behind the group, tucked up-left so it never clips */
    var y0 = at(-M * 0.028, -M * 0.034);
    var yr = M * 0.032;
    ctx.beginPath(); ctx.moveTo(y0[0] - yr, y0[1]);
    ctx.arc(y0[0], y0[1], yr, Math.PI, 0);
    ctx.closePath(); ctx.fillStyle = YURT; ctx.fill();
    ctx.strokeStyle = ROUTE; ctx.lineWidth = Math.max(1, M * 0.002); ctx.stroke();
    rect(y0[0] - M * 0.005, y0[1] - M * 0.018, M * 0.010, M * 0.018, ROUTE);
    /* herd: five small dark shapes around the group */
    var herdOff = [[-0.020, 0.030], [-0.008, 0.042], [0.012, 0.036], [0.026, 0.024], [-0.030, -0.028]];
    for (var hi = 0; hi < herdOff.length; hi++) {
      var hp = at(herdOff[hi][0] * M, herdOff[hi][1] * M);
      ellipse(hp[0], hp[1], M * 0.011, M * 0.007, DARK);
      dot(hp[0] + M * 0.010, hp[1] - M * 0.004, M * 0.004, DARK);
    }
    /* travellers: three small dark figures ahead */
    var travOff = [[0.008, -0.012], [0.022, 0.004], [0.036, -0.010]];
    for (var ti2 = 0; ti2 < travOff.length; ti2++) {
      var tp = at(travOff[ti2][0] * M, travOff[ti2][1] * M);
      rect(tp[0] - M * 0.004, tp[1] - M * 0.012, M * 0.008, M * 0.016, DARK);
      dot(tp[0], tp[1] - M * 0.017, M * 0.005, DARK);
    }
  }

  /* ---- boot: frame one is draw(0); clock starts with the rAF loop ---- */
  size();
  draw(0);
  var started = false, t0 = 0;
  function loop(ts) {
    if (!started) { started = true; t0 = ts; }
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

  /* ---- probe hook (QA only; not visible) ---- */
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      journeyS: journeyS,
      pointAt: pointAt,
      get dragging() { return dragging; },
      get dir() { return dir; },
      pointerdown: onDown, pointermove: onMove, pointerup: onUp
    };
  }
})();
</script>
</body>
</html>
