<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence of Light</title>
<style>
  html, body { margin: 0; padding: 0; background: #0C0C0E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var ROOM = '#0C0C0E';
  var MESH = '#3E444C';
  var SHADOW = '#000000';
  var GLOW = '#FFF3D6';
  var POOL = '#2A2418';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded RNG (mulberry32). No Math.random anywhere.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var BASE_SEED = 70431;
  var epoch = 0;

  // Room model, in loose 3D units. x right, y down, z away from viewer.
  var FOCAL = 2.2;          // perspective focal length
  var PANEL_Z = 0.62;       // depth of the two mesh walls
  var BACK_Z = 1.35;        // depth of the back wall
  var FLOOR_Y = 0.5;        // floor plane height
  var PANEL_TOP = -0.60;
  var PANEL_BOT = 0.48;
  var PANEL_IN = 0.20;      // inner edge |x| of each panel
  var PANEL_OUT = 0.56;     // outer edge |x| of each panel
  var PIVOT = { x: 0, y: -1.02, z: 0.22 };
  var CORD = 0.86;
  var SWING_PERIOD = 18;
  var PRECESS_PERIOD = 160;

  // Mesh layout: 12 columns of near-square cells per wall, seeded jitter.
  // cols/rows are shared fractions; each wall maps them into its own span.
  var colFrac = [];   // 13 values, 0..1 across a panel
  var rowFrac = [];   // 37 values, 0..1 down a panel
  (function buildMesh() {
    var rng = mulberry32(BASE_SEED);
    var i;
    var NC = 12;
    for (i = 0; i <= NC; i++) {
      var f = i / NC;
      if (i > 0 && i < NC) f += (rng() - 0.5) * 0.22 / NC;
      colFrac.push(f);
    }
    // Cell height matched to cell width: panel is 0.36 wide, 1.08 tall,
    // so square cells need 36 rows.
    var NR = 36;
    for (i = 0; i <= NR; i++) {
      var g = i / NR;
      if (i > 0 && i < NR) g += (rng() - 0.5) * 0.22 / NR;
      rowFrac.push(g);
    }
  })();

  // Swing parameters per epoch: a tap reseeds the push.
  var swing = null;
  function buildSwing() {
    var rng = mulberry32(BASE_SEED + 1000 + epoch * 7919);
    swing = {
      amp: 0.26 + rng() * 0.10,          // radians, max swing angle
      // Azimuth starts near the lateral axis so each epoch's push reads
      // on screen; precession rotates the plane away from there.
      phi0: (rng() < 0.5 ? 0 : Math.PI) + (rng() - 0.5) * 0.7,
      precDir: rng() < 0.5 ? 1 : -1
    };
  }
  buildSwing();

  function isPhone(w, h) {
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  function viewSize() {
    var vv = window.visualViewport;
    var w = vv && vv.width ? vv.width : (window.innerWidth || 0);
    var h = vv && vv.height ? vv.height : (window.innerHeight || 0);
    return { w: Math.round(w), h: Math.round(h) };
  }

  function draw(t) {
    var size = viewSize();
    var w = size.w, h = size.h;
    if (w <= 0 || h <= 0) return;
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    var phone = isPhone(w, h);
    var S = Math.min(w, h);
    var u = S / 720;                       // unit scale for strokes/glow
    var cx = w / 2;
    var cy = h * 0.54;

    function proj(x, y, z) {
      var f = FOCAL / (FOCAL + z);
      return { x: cx + x * S * f, y: cy + y * S * f };
    }

    // Bulb position: pendulum with a slowly precessing swing plane.
    var theta = swing.amp * Math.cos((2 * Math.PI * t) / SWING_PERIOD);
    var phi = swing.phi0 + swing.precDir * (2 * Math.PI * t) / PRECESS_PERIOD;
    var st = Math.sin(theta);
    var bulb = {
      x: PIVOT.x + CORD * st * Math.cos(phi),
      y: PIVOT.y + CORD * Math.cos(theta),
      z: PIVOT.z + CORD * st * Math.sin(phi)
    };
    var bulbS = proj(bulb.x, bulb.y, bulb.z);
    var floorLineY = proj(0, FLOOR_Y, BACK_Z).y;

    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, w, h);

    // Panel point helper: side -1 left, +1 right; cf across, rf down.
    function panelPoint(side, cf, rf) {
      var x = side * (PANEL_IN + cf * (PANEL_OUT - PANEL_IN));
      var y = PANEL_TOP + rf * (PANEL_BOT - PANEL_TOP);
      return { x: x, y: y, z: PANEL_Z };
    }

    // Cast a ray from the bulb through point P onto the back wall plane.
    function castBack(P) {
      var dz = P.z - bulb.z;
      if (dz < 0.08) return null;
      var k = (BACK_Z - bulb.z) / dz;
      return proj(bulb.x + (P.x - bulb.x) * k, bulb.y + (P.y - bulb.y) * k, BACK_Z);
    }

    // Cast a ray from the bulb through point P onto the floor plane.
    function castFloor(P) {
      var dy = P.y - bulb.y;
      if (dy < 0.05) return null;
      var k = (FLOOR_Y - bulb.y) / dy;
      return proj(bulb.x + (P.x - bulb.x) * k, FLOOR_Y, bulb.z + (P.z - bulb.z) * k);
    }

    var sides = [-1, 1];
    var si, i, j;

    // --- Back wall: a dim warm wash where the bulb's light lands, then
    // both grids' shadows over it, clipped above the floor line. The
    // wash is flat layered alpha, the house substitute for falloff.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, w, floorLineY);
    ctx.clip();
    var wallTL = proj(-0.98, -0.92, BACK_Z), wallTR = proj(0.98, -0.92, BACK_Z);
    var wallBR = proj(0.98, FLOOR_Y, BACK_Z), wallBL = proj(-0.98, FLOOR_Y, BACK_Z);
    ctx.fillStyle = GLOW;
    ctx.globalAlpha = 0.045;
    ctx.beginPath();
    ctx.moveTo(wallTL.x, wallTL.y);
    ctx.lineTo(wallTR.x, wallTR.y);
    ctx.lineTo(wallBR.x, wallBR.y);
    ctx.lineTo(wallBL.x, wallBL.y);
    ctx.closePath();
    ctx.fill();
    var litC = proj(bulb.x * 2.2, bulb.y * 2.0, BACK_Z);
    var litLayers = [
      { r: 0.64, a: 0.020 },
      { r: 0.54, a: 0.020 },
      { r: 0.45, a: 0.021 },
      { r: 0.36, a: 0.021 },
      { r: 0.28, a: 0.022 },
      { r: 0.20, a: 0.022 }
    ];
    for (i = 0; i < litLayers.length; i++) {
      ctx.globalAlpha = litLayers[i].a;
      ctx.beginPath();
      ctx.arc(litC.x, litC.y, litLayers[i].r * S, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Shadows: softness from layered passes at small fixed offsets.
    var backPasses = [
      { lw: 6.0, a: 0.30, ox: 0, oy: 0 },
      { lw: 3.4, a: 0.34, ox: 1.3, oy: 0.7 },
      { lw: 1.8, a: 0.38, ox: -1.1, oy: 1.2 }
    ];
    ctx.strokeStyle = SHADOW;
    ctx.lineCap = 'round';
    for (var bp = 0; bp < backPasses.length; bp++) {
      var pass = backPasses[bp];
      ctx.lineWidth = Math.max(1, pass.lw * u);
      ctx.globalAlpha = pass.a;
      ctx.beginPath();
      for (si = 0; si < 2; si++) {
        // Vertical grid lines.
        for (i = 0; i < colFrac.length; i++) {
          var first = true;
          for (j = 0; j < rowFrac.length; j += 4) {
            var q = castBack(panelPoint(sides[si], colFrac[i], rowFrac[j]));
            if (!q) { first = true; continue; }
            if (first) { ctx.moveTo(q.x + pass.ox * u, q.y + pass.oy * u); first = false; }
            else ctx.lineTo(q.x + pass.ox * u, q.y + pass.oy * u);
          }
        }
        // Horizontal grid lines.
        for (j = 0; j < rowFrac.length; j++) {
          var firstH = true;
          for (i = 0; i < colFrac.length; i += 3) {
            var qh = castBack(panelPoint(sides[si], colFrac[i], rowFrac[j]));
            if (!qh) { firstH = true; continue; }
            if (firstH) { ctx.moveTo(qh.x + pass.ox * u, qh.y + pass.oy * u); firstH = false; }
            else ctx.lineTo(qh.x + pass.ox * u, qh.y + pass.oy * u);
          }
        }
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // --- Faint lit wash across the floor, then the warm pool beneath
    // the bulb: flat layered ellipses.
    var poolC = proj(bulb.x * 0.85, FLOOR_Y, bulb.z + 0.28);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, floorLineY, w, h - floorLineY);
    ctx.clip();
    ctx.fillStyle = GLOW;
    ctx.globalAlpha = 0.05;
    ctx.beginPath();
    ctx.ellipse(poolC.x, poolC.y, 0.55 * S * 0.85, 0.55 * S * 0.85 * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;

    var poolLayers = [
      { r: 0.32, a: 0.26 },
      { r: 0.22, a: 0.27 },
      { r: 0.14, a: 0.28 }
    ];
    ctx.fillStyle = POOL;
    for (i = 0; i < poolLayers.length; i++) {
      var pl = poolLayers[i];
      var rx = pl.r * S * 0.85;
      ctx.globalAlpha = pl.a;
      ctx.beginPath();
      ctx.ellipse(poolC.x, poolC.y, rx, rx * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // --- Floor shadows: lower mesh rows only, clipped below the floor line.
    var floorPasses = [
      { lw: 4.6, a: 0.30, ox: 0, oy: 0 },
      { lw: 2.0, a: 0.34, ox: 1.0, oy: 0.5 }
    ];
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, floorLineY, w, h - floorLineY);
    ctx.clip();
    ctx.strokeStyle = SHADOW;
    for (var fp = 0; fp < floorPasses.length; fp++) {
      var fpass = floorPasses[fp];
      ctx.lineWidth = Math.max(1, fpass.lw * u);
      ctx.globalAlpha = fpass.a;
      ctx.beginPath();
      for (si = 0; si < 2; si++) {
        for (i = 0; i < colFrac.length; i++) {
          var firstF = true;
          for (j = 0; j < rowFrac.length; j += 2) {
            var pf = panelPoint(sides[si], colFrac[i], rowFrac[j]);
            var qf = castFloor(pf);
            if (!qf) { firstF = true; continue; }
            if (firstF) { ctx.moveTo(qf.x + fpass.ox * u, qf.y + fpass.oy * u); firstF = false; }
            else ctx.lineTo(qf.x + fpass.ox * u, qf.y + fpass.oy * u);
          }
        }
        for (j = 0; j < rowFrac.length; j += 2) {
          var firstFH = true;
          for (i = 0; i < colFrac.length; i += 3) {
            var ph = panelPoint(sides[si], colFrac[i], rowFrac[j]);
            var qhh = castFloor(ph);
            if (!qhh) { firstFH = true; continue; }
            if (firstFH) { ctx.moveTo(qhh.x + fpass.ox * u, qhh.y + fpass.oy * u); firstFH = false; }
            else ctx.lineTo(qhh.x + fpass.ox * u, qhh.y + fpass.oy * u);
          }
        }
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // Floor meets back wall: one dim seam line.
    var seamA = proj(-0.95, FLOOR_Y, BACK_Z);
    var seamB = proj(0.95, FLOOR_Y, BACK_Z);
    ctx.strokeStyle = MESH;
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(seamA.x, seamA.y);
    ctx.lineTo(seamB.x, seamB.y);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // --- The mesh walls themselves.
    ctx.strokeStyle = MESH;
    ctx.lineCap = 'round';
    for (var mp = 0; mp < 2; mp++) {
      ctx.lineWidth = mp === 0 ? Math.max(1.4, 2.8 * u) : Math.max(0.8, (phone ? 1.3 : 1.1) * u);
      ctx.globalAlpha = mp === 0 ? 0.16 : 0.88;
      ctx.beginPath();
      for (si = 0; si < 2; si++) {
        for (i = 0; i < colFrac.length; i++) {
          var a = panelPoint(sides[si], colFrac[i], 0);
          var b = panelPoint(sides[si], colFrac[i], 1);
          var pa = proj(a.x, a.y, a.z), pb = proj(b.x, b.y, b.z);
          ctx.moveTo(pa.x, pa.y);
          ctx.lineTo(pb.x, pb.y);
        }
        for (j = 0; j < rowFrac.length; j++) {
          var c = panelPoint(sides[si], 0, rowFrac[j]);
          var d = panelPoint(sides[si], 1, rowFrac[j]);
          var pc = proj(c.x, c.y, c.z), pd = proj(d.x, d.y, d.z);
          ctx.moveTo(pc.x, pc.y);
          ctx.lineTo(pd.x, pd.y);
        }
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // --- Cord from its off-screen pivot down to the bulb.
    var pivotS = proj(PIVOT.x, PIVOT.y, PIVOT.z);
    ctx.strokeStyle = MESH;
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = Math.max(1, 1.5 * u);
    ctx.beginPath();
    ctx.moveTo(pivotS.x, pivotS.y);
    ctx.lineTo(bulbS.x, bulbS.y);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // --- Bulb: layered flat glow discs, small bright core. No gradients.
    var glowLayers = [
      { r: 56, a: 0.050 },
      { r: 38, a: 0.060 },
      { r: 25, a: 0.080 },
      { r: 15, a: 0.120 },
      { r: 8.5, a: 0.220 }
    ];
    ctx.fillStyle = GLOW;
    for (i = 0; i < glowLayers.length; i++) {
      var gl = glowLayers[i];
      ctx.globalAlpha = gl.a;
      ctx.beginPath();
      ctx.arc(bulbS.x, bulbS.y, gl.r * u, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 0.97;
    ctx.beginPath();
    ctx.arc(bulbS.x, bulbS.y, 4.6 * u, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(bulbS.x, bulbS.y, 2.1 * u, 0, Math.PI * 2);
    ctx.fill();
  }

  // Frame one: synchronous draw at pendulum phase 0. The bulb sits at
  // maximum displacement and every shadow is projected from it.
  draw(0);

  var start = null;
  var epochStart = 0;
  var lastT = 0;
  function frame(now) {
    if (start === null) start = now;
    var t = (now - start) / 1000;
    lastT = t;
    draw(t - epochStart);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

  function onResize() { draw(lastT - epochStart); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  // Tap reseeds: the swing gets a fresh push from a new angle, anchored
  // at the tap. Never a reload.
  canvas.addEventListener('pointerdown', function () {
    epoch++;
    buildSwing();
    epochStart = lastT;
    draw(0);
  });
})();
</script>
</body>
</html>
