<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.433 Hair That Becomes a World</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F3B7C4; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.433 Hair That Becomes a World (angelina_bambina_dsgn,
// EXPANSION #47, prompt ANG1). Her definitive mechanism:
// a calm woman in three-quarter view, eyes closed, whose
// long white hair rises and MORPHS into a miniature winter
// landscape. The hair mass itself is the terrain: its top
// edge is a run of hill crests, and inside it three ridge
// lines carry snow-roofed houses, pine stacks and a
// crossing deer, tier on tier, strand becoming slope. A
// smiling crescent moon nests in the strands. Below, she
// reads an open green book in a red sweater with a green
// zigzag. WATCH-ONLY 48s loop: snow falls ONLY inside the
// hair (a fixed dot table, each flake falling whole field
// heights per loop, clipped to the hair silhouette); the
// moon drifts 6px side to side on 8 whole 6s cycles; a
// deer crosses the middle ridge at two fixed slots per
// loop (the prompt's 24s cadence); the book's page edge
// lifts once per loop. DOUBLE-TAP advances a FIXED
// AUTHORED TABLE of exactly 3 landscape arrangements
// (houses, pines, deer line and moon re-laid, the grammar
// kept), never a runtime reseed. No text, no signature.
// Frame one is arrangement 1 at the constant phase
// T = 10s: snow mid-fall, the first deer mid-crossing,
// the moon drifted off centre. The clock is anchored
// there and advances in fixed 1/60 ticks, never from a
// wall clock. Flat colour only, one canvas, no offscreen
// canvas, no gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette (closed) -----------------------------------
var GROUND = '#F3B7C4';  // pink ground
var SNOW = '#FDFBF7';    // snow; also her white hair
var NAVY = '#2A3550';    // hair shadow, strand and ridge lines
var RED = '#C0392B';     // sweater; also the house roofs
var ZIG = '#2E7A4E';     // sweater zigzag green
var BOOK = '#3E6B3E';    // book green
var CREAM = '#F6E7B4';   // moon; also lit windows and her skin
var TAN = '#B98A5A';     // deer tan
var PINE = '#2E5B3E';    // pine deep green
if (CREAM === undefined) throw new Error('palette');

// Palette resolution (documented in process.md): the
// prompt names no skin tone; her face takes the moon
// cream, the warm pale tone already in the palette.

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 48;
if (LOOP !== 48) throw new Error('Hair That Becomes a World loop must be 48s');
var TICK = 1 / 60;
var T0 = 10;
var T = T0;

// ---- landscape arrangements: 3 authored -------------------
// houses: x = left edge, by = base y (sitting on a ridge),
// w/h body size. pines: x = centre, by = base, s = scale.
// deer: feetY = the ridge line the crossings run on.
// moon: crescent centre.
var LANDSCAPES = [
  { moon: [830, 182], deerY: 340,
    houses: [[445, 240, 58, 44], [585, 222, 46, 36], [745, 238, 64, 48],
             [520, 338, 50, 40], [700, 336, 54, 42], [430, 438, 46, 36]],
    pines: [[530, 246, 0.9], [680, 228, 1.15], [845, 244, 0.85],
            [620, 344, 1.0], [790, 342, 0.9], [520, 442, 0.8], [860, 436, 1.0]] },
  { moon: [452, 162], deerY: 336,
    houses: [[480, 232, 50, 40], [660, 246, 60, 46], [790, 220, 46, 36],
             [455, 344, 56, 42], [640, 330, 48, 38], [760, 440, 52, 40]],
    pines: [[570, 240, 1.0], [735, 228, 0.85], [420, 330, 0.9],
            [560, 348, 1.1], [830, 338, 0.95], [660, 444, 0.85], [880, 350, 0.8]] },
  { moon: [826, 158], deerY: 344,
    houses: [[520, 246, 64, 48], [700, 230, 50, 40], [420, 336, 52, 40],
             [600, 344, 58, 44], [800, 338, 48, 38], [545, 440, 50, 38]],
    pines: [[455, 238, 0.85], [640, 252, 1.05], [830, 236, 0.9],
            [520, 330, 0.95], [715, 350, 0.85], [455, 444, 1.0], [845, 442, 0.9]] }
];
if (LANDSCAPES.length !== 3) throw new Error('exactly 3 authored landscapes');
var lay = 0;

// ---- snow: fixed dot table --------------------------------
// Seeded once from a fixed constant (mulberry-style LCG),
// so the table is identical on every load. Each flake
// falls a whole number of hair-field heights per loop.
function lcg(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
var rnd = lcg(43317);
var FLAKES = [];
for (var fi = 0; fi < 110; fi++) {
  FLAKES.push({
    x: 352 + rnd() * 584,          // inside the hair span
    y0: rnd(),                     // start fraction of the field
    laps: rnd() < 0.5 ? 1 : 2,     // whole field heights per loop
    r: 2 + rnd() * 2.6,
    ph: rnd()                      // sway phase
  });
}
if (FLAKES.length !== 110) throw new Error('exactly 110 snowflakes');
var SNOW_TOP = 78, SNOW_H = 566;   // the hair field

// ---- ridge lines inside the hair ---------------------------
// Three terrain tiers; houses and pines sit on them, the
// deer crosses the middle one.
var RIDGES = [
  [[360, 255], [480, 225], [600, 250], [720, 220], [840, 248], [935, 230]],
  [[355, 350], [470, 325], [590, 352], [710, 322], [830, 350], [940, 330]],
  [[370, 448], [490, 425], [610, 450], [730, 422], [850, 446], [935, 428]]
];

// ---- small helpers -----------------------------------------
function ell(x, y, rx, ry, rot, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function circ(x, y, r, col) { ell(x, y, r, r, 0, col); }
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function seg(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function curve(x1, y1, cx, cy, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
}
function poly(pts, col, outlineW) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  if (outlineW) { ctx.strokeStyle = NAVY; ctx.lineWidth = outlineW; ctx.lineJoin = 'round'; ctx.stroke(); }
}
// smooth open path through points (quadratic midpoints)
function ridgePath(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length - 1; i++) {
    var mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
}

// ---- the hair silhouette -----------------------------------
// The mass IS the landscape: a scalloped run of hill
// crests along its top edge, sides falling to her
// shoulders. Traced identically for fill and for the
// snow clip, so the weather stays inside the hair.
function hairPath() {
  ctx.beginPath();
  ctx.moveTo(512, 752);
  ctx.bezierCurveTo(392, 700, 345, 560, 352, 430);
  ctx.bezierCurveTo(350, 330, 368, 240, 415, 168);
  ctx.quadraticCurveTo(470, 96, 545, 128);    // crest
  ctx.quadraticCurveTo(610, 88, 672, 124);    // crest
  ctx.quadraticCurveTo(742, 84, 806, 122);    // crest
  ctx.quadraticCurveTo(872, 96, 908, 168);
  ctx.bezierCurveTo(940, 250, 948, 360, 936, 470);
  ctx.bezierCurveTo(928, 600, 880, 700, 772, 752);
  ctx.closePath();
}

function drawHairBase() {
  hairPath();
  ctx.fillStyle = SNOW; ctx.fill();
  ctx.strokeStyle = NAVY; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();
  // strand ribbons: bezier strokes flowing from the
  // scalp up into the terrain, the hair's own grain.
  // Clipped to the silhouette so no strand ever leaks
  // past the hair's edge into the ground.
  ctx.save();
  hairPath();
  ctx.clip();
  var strands = [
    [636, 592, 566, 360, 470, 176], [648, 590, 646, 330, 612, 140],
    [660, 592, 726, 350, 772, 150], [606, 606, 496, 420, 420, 268],
    [676, 606, 786, 420, 884, 272], [618, 580, 552, 320, 528, 158],
    [664, 580, 738, 320, 736, 148]
  ];
  var i;
  for (i = 0; i < strands.length; i++) {
    var s = strands[i];
    curve(s[0], s[1], s[2], s[3], s[4], s[5], 4, NAVY);
  }
  ctx.restore();
}

// ---- landscape furniture ------------------------------------
function drawHouse(h) {
  var x = h[0], by = h[1], w = h[2], hh = h[3];
  rect(x, by - hh, w, hh, SNOW);
  ctx.strokeStyle = NAVY; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.strokeRect(x, by - hh, w, hh);
  // roof: red gable with a snow strip along the slopes
  poly([[x - 6, by - hh], [x + w / 2, by - hh - 24], [x + w + 6, by - hh]], RED, 0);
  ctx.strokeStyle = SNOW; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 2, by - hh - 3); ctx.lineTo(x + w / 2, by - hh - 22);
  ctx.lineTo(x + w + 2, by - hh - 3); ctx.stroke();
  ctx.strokeStyle = NAVY; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x - 6, by - hh); ctx.lineTo(x + w / 2, by - hh - 24);
  ctx.lineTo(x + w + 6, by - hh); ctx.stroke();
  // lit windows in moon cream, and a small door
  rect(x + w * 0.18, by - hh * 0.62, 10, 13, CREAM);
  ctx.strokeStyle = NAVY; ctx.lineWidth = 2; ctx.strokeRect(x + w * 0.18, by - hh * 0.62, 10, 13);
  if (w >= 54) {
    rect(x + w * 0.62, by - hh * 0.62, 10, 13, CREAM);
    ctx.strokeRect(x + w * 0.62, by - hh * 0.62, 10, 13);
  }
  rect(x + w / 2 - 6, by - 17, 12, 17, NAVY);
}

function drawPine(p) {
  var x = p[0], by = p[1], s = p[2];
  seg(x, by, x, by - 12 * s, 5, NAVY);
  var tiers = [[46, 30, 10], [36, 26, 32], [25, 22, 52]];
  var i, ty, tw, th;
  for (i = 0; i < 3; i++) {
    tw = tiers[i][0] * s; th = tiers[i][1] * s; ty = by - tiers[i][2] * s;
    poly([[x - tw / 2, ty], [x + tw / 2, ty], [x, ty - th]], PINE, 0);
  }
  // a cap of snow on the crown
  poly([[x - 8 * s, by - 66 * s], [x + 8 * s, by - 66 * s], [x, by - 74 * s]], SNOW, 0);
}

function drawMoon(lt, L) {
  var dx = 6 * Math.sin((lt / 6) * Math.PI * 2);   // 8 whole 6s cycles per loop
  var x = L.moon[0] + dx, y = L.moon[1];
  // crescent as one filled path: outer bow, inner bow
  ctx.beginPath();
  ctx.moveTo(x + 4, y - 37);
  ctx.quadraticCurveTo(x - 46, y, x + 4, y + 37);
  ctx.quadraticCurveTo(x - 6, y, x + 4, y - 37);
  ctx.closePath();
  ctx.fillStyle = CREAM; ctx.fill();
  ctx.strokeStyle = NAVY; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
  // the smile: a closed eye and a calm mouth, sleeping
  ctx.strokeStyle = NAVY; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x - 13, y - 7, 6, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  ctx.beginPath(); ctx.arc(x - 15, y + 9, 7, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
}

function drawDeer(x, feetY, dir, trot) {
  var by = feetY - 26 + Math.abs(Math.sin(trot)) * 2;
  // legs, trotting in pairs
  var sw = Math.sin(trot) * 7;
  seg(x - 16, by + 12, x - 16 + sw, feetY, 4.5, TAN);
  seg(x - 8, by + 13, x - 8 - sw, feetY, 4.5, TAN);
  seg(x + 14, by + 13, x + 14 - sw, feetY, 4.5, TAN);
  seg(x + 20, by + 12, x + 20 + sw, feetY, 4.5, TAN);
  // body
  ell(x, by, 28, 15, 0, TAN);
  // tail: a snow dot at the rear
  circ(x - dir * 27, by - 8, 5, SNOW);
  // neck and head, reaching forward
  seg(x + dir * 20, by - 8, x + dir * 32, by - 24, 9, TAN);
  ell(x + dir * 37, by - 28, 11, 7, dir * 0.35, TAN);
  circ(x + dir * 43, by - 30, 1.8, NAVY);   // eye
  // antlers: two small branching strokes
  seg(x + dir * 33, by - 34, x + dir * 29, by - 47, 2.5, NAVY);
  seg(x + dir * 29, by - 41, x + dir * 23, by - 44, 2.5, NAVY);
  seg(x + dir * 38, by - 35, x + dir * 36, by - 48, 2.5, NAVY);
}

function drawLandscape(lt, L) {
  var i;
  // ridge lines: the terrain tiers inside the hair,
  // clipped to the silhouette like the strands
  ctx.save();
  hairPath();
  ctx.clip();
  ctx.strokeStyle = NAVY; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  for (i = 0; i < RIDGES.length; i++) { ridgePath(RIDGES[i]); ctx.stroke(); }
  ctx.restore();
  for (i = 0; i < L.pines.length; i++) drawPine(L.pines[i]);
  for (i = 0; i < L.houses.length; i++) drawHouse(L.houses[i]);
  drawMoon(lt, L);
  // the deer: two fixed crossing slots per loop, the
  // prompt's 24s cadence. Slot A left to right, slot B
  // right to left, along the middle ridge line.
  if (lt >= 4 && lt <= 16) {
    var pa = (lt - 4) / 12;
    drawDeer(398 + pa * 484, L.deerY, 1, pa * Math.PI * 10);
  } else if (lt >= 28 && lt <= 40) {
    var pb = (lt - 28) / 12;
    drawDeer(882 - pb * 484, L.deerY, -1, pb * Math.PI * 10);
  }
}

function drawSnow(lt) {
  ctx.save();
  hairPath();
  ctx.clip();
  var i, f, y;
  for (i = 0; i < FLAKES.length; i++) {
    f = FLAKES[i];
    y = SNOW_TOP + ((f.y0 + f.laps * (lt / LOOP)) % 1) * SNOW_H;
    circ(f.x + 8 * Math.sin((lt / 12 + f.ph) * Math.PI * 2), y, f.r, SNOW);
  }
  ctx.restore();
}

// ---- the woman ----------------------------------------------
function drawWoman(lt) {
  // neck
  rect(617, 688, 46, 62, CREAM);
  // torso: the red sweater, shoulders to the hem
  ctx.beginPath();
  ctx.moveTo(508, 752);
  ctx.quadraticCurveTo(500, 735, 540, 730);
  ctx.lineTo(740, 730);
  ctx.quadraticCurveTo(782, 735, 774, 756);
  ctx.lineTo(790, 900);
  ctx.lineTo(490, 900);
  ctx.closePath();
  ctx.fillStyle = RED; ctx.fill();
  // the green zigzag, clipped to the sweater
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = ZIG; ctx.lineWidth = 11; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  var rows = [792, 830, 868], r, x;
  for (r = 0; r < rows.length; r++) {
    ctx.beginPath();
    ctx.moveTo(492, rows[r]);
    for (x = 492; x < 788; x += 30) {
      ctx.lineTo(x + 15, rows[r] - 12);
      ctx.lineTo(x + 30, rows[r]);
    }
    ctx.stroke();
  }
  ctx.restore();
  // face: three-quarter, calm. Closed eyes, small mouth.
  ell(640, 648, 76, 90, 0, CREAM);
  ctx.strokeStyle = NAVY; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(600, 652); ctx.quadraticCurveTo(613, 662, 626, 652); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(654, 652); ctx.quadraticCurveTo(667, 662, 680, 652); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(630, 700); ctx.quadraticCurveTo(640, 706, 650, 700); ctx.stroke();
  // fringe: a white sweep across the forehead, scalloped
  ctx.beginPath();
  ctx.moveTo(566, 606);
  ctx.quadraticCurveTo(580, 528, 646, 532);
  ctx.quadraticCurveTo(706, 536, 714, 600);
  ctx.quadraticCurveTo(688, 580, 664, 600);
  ctx.quadraticCurveTo(640, 618, 614, 596);
  ctx.quadraticCurveTo(590, 578, 566, 606);
  ctx.closePath();
  ctx.fillStyle = SNOW; ctx.fill();
  ctx.strokeStyle = NAVY; ctx.lineWidth = 3; ctx.stroke();
  // side locks falling past her cheeks to the shoulders
  poly([[560, 590], [596, 596], [590, 750], [544, 744]], SNOW, 3);
  poly([[716, 592], [748, 742], [708, 748], [688, 600]], SNOW, 3);
}

// ---- arms and the book ----------------------------------------
// The book sits lower-left, open, both hands relaxed on
// its edges. Once per loop its right page edge lifts.
function drawBook(lt) {
  // sleeves reaching from the sweater to the book
  seg(548, 772, 384, 796, 34, RED);
  seg(724, 786, 594, 848, 32, RED);
  ctx.save();
  ctx.translate(478, 812); ctx.rotate(-0.06);
  // cover, a hand wider than the pages
  poly([[-122, -66], [122, -66], [132, 62], [-132, 62]], BOOK, 4);
  // the two open pages
  poly([[-112, -56], [0, -42], [0, 52], [-118, 52]], SNOW, 3);
  poly([[112, -56], [0, -42], [0, 52], [118, 52]], SNOW, 3);
  // print lines, quiet strokes only
  ctx.strokeStyle = NAVY; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  var lines = [[-96, -30, -22, -20], [-98, -8, -20, 0], [-98, 14, -24, 22],
               [22, -20, 96, -30], [20, 0, 98, -8], [24, 22, 98, 14]];
  var i;
  for (i = 0; i < lines.length; i++) {
    ctx.beginPath(); ctx.moveTo(lines[i][0], lines[i][1]);
    ctx.lineTo(lines[i][2], lines[i][3]); ctx.stroke();
  }
  // the lifting page edge: once per loop, in the
  // [34s, 42s] window, the right page's outer corner
  // peels up and settles back
  var lift = 0;
  if (lt >= 34 && lt <= 42) lift = Math.sin(((lt - 34) / 8) * Math.PI);
  if (lift > 0.01) {
    var liftY = lift * 30;
    poly([[8, -40], [112, -56 - liftY], [118, 52], [8, 50]], SNOW, 3);
    seg(112, -56 - liftY, 60, -64 - liftY, 3, NAVY);
  }
  ctx.restore();
  // hands resting on the book's outer corners
  ell(356, 800, 17, 12, -0.4, CREAM);
  ell(600, 858, 17, 12, 0.3, CREAM);
}

function draw() {
  var lt = T % LOOP;
  var L = LANDSCAPES[lay];
  rect(-2400, -2400, DW + 4800, DH + 4800, GROUND);
  drawHairBase();
  drawLandscape(lt, L);
  drawSnow(lt);
  drawWoman(lt);
  drawBook(lt);
}

// ---- pointer: double-tap advances the landscape table --------
var lastTapT = -10, lastTapX = -999, lastTapY = -999;
var downX = -1, downY = -1;

function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y;
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  downX = -1;
  if (Math.sqrt(dx * dx + dy * dy) >= 28) { lastTapT = -10; return; }
  if (T - lastTapT < 0.38 && Math.abs(p.x - lastTapX) < 90 && Math.abs(p.y - lastTapY) < 90) {
    lay = (lay + 1) % LANDSCAPES.length;
    lastTapT = -10;
  } else {
    lastTapT = T; lastTapX = p.x; lastTapY = p.y;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; });

// QA hooks via the renderer's query string (?seed=...):
// seed=N starts on landscape N (settled); seed=tS starts
// the clock at S seconds. Default play is unaffected.
var QS = (typeof location !== 'undefined' && location.search) || '';
var sm = QS.match(/seed=t(\d+(?:\.\d+)?)/);
if (sm) { T0 = parseFloat(sm[1]) % LOOP; T = T0; }
var lm = QS.match(/seed=(\d+)$/);
if (lm) lay = ((parseInt(lm[1], 10) % 3) + 3) % 3;

// ---- sizing: full-bleed cover fit ------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  rect(0, 0, W, H, GROUND);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
var lastNow = -1, acc = 0;
resize();
