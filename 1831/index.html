<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streetwalker 1980</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0F1A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var NIGHT = '#0B0F1A';
var SKY = '#0D1322';
var BUILDING = '#0E1524';
var PAVEMENT = '#080C14';
var SODIUM = '#F59A2E';
var SODIUM_DEEP = '#E88A2A';
var SODIUM_PALE = '#F7B45C';
var METAL = '#9AA3AD';
var METAL_DARK = '#6E7680';
var METAL_LIGHT = '#C7CDD4';
var SILHOUETTE = '#141B29';
var SILHOUETTE_EDGE = '#1E2839';
var STRING_COL = '#C9A06A';
var PLATE = '#101623';
var PLATE_LINE = 'rgba(245,154,46,0.45)';
var TITLE_INK = '#F2EEE3';
var HINT_INK = '#D8C9A8';
/* Walk cycle, seconds. Walk right, pause, turn, walk left, pause. */
var CYCLE = 28;
var WALK_A_END = 10;
var PAUSE_A_END = 13;
var TURN_END = 15;
var WALK_B_END = 25;
var FRAME_T = 3.2;         /* fixed phase: mid-stride, walking right, inside the lamp pool */
var V0 = 0.020;            /* background scroll speed, fraction of scene width per second */
var STEP_LEN = 0.035;      /* scene-width fraction travelled per half stride */
var RAMP = 0.6;            /* ease-in/out at each walk start and end, seconds */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

function hexRgb(h) {

}
function rgba(h, a) {

}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1831);
var phaseT = FRAME_T;
var soundOn = false;
var audioCtx = null;
var noiseBuf = null;
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
/* seeded static details: stars, buildings with windows, pavement marks, skirt brushing */
var STARS = [];
var BUILDINGS = [];
var STREAKS = [];
(function () {
  var i, j;
  for (i = 0; i < 46; i++) STARS.push({ x: rng(), y: rng() * 0.42, r: 0.4 + rng() * 1.1, a: 0.18 + rng() * 0.45 });
  for (i = 0; i < 7; i++) {
    var wins = [];
    var nw = 1 + Math.floor(rng() * 3);
    for (j = 0; j < nw; j++) wins.push({ fx: 0.15 + rng() * 0.65, fy: 0.12 + rng() * 0.62, w: 0.10 + rng() * 0.14, h: 0.10 + rng() * 0.16, a: 0.25 + rng() * 0.5, lit: rng() < 0.6 });

})();
/* ---- walk state as closed-form functions of cycle time tc ---- */
function cycleT(t) { return ((t % CYCLE) + CYCLE) % CYCLE; }
/* velocity profile, 0..1, during a walk phase [a,b) */
function velProfile(a, b, tc) {
  if (tc < a || tc >= b) return 0;
  return ramp((tc - a) / RAMP) * ramp((b - tc) / RAMP);

/* integral of the velocity profile from a to tc, for background scroll */
function velIntegral(a, b, tc) {

  var span = b - a;
  var x = Math.min(tc - a, span);
  var total = 0;
  var rise = Math.min(x, RAMP);
  total += RAMP * rampF(rise / RAMP);
  var mid = Math.max(0, Math.min(x, span - RAMP) - RAMP);

function walkState(tc) {

    st.vel = velProfile(0, WALK_A_END, tc);

    st.vel = 0; st.dir = 1; st.facing = 1;

    st.vel = 0; st.dir = 1; st.facing = Math.cos(u * Math.PI);
  } else if (tc < WALK_B_END) {
    st.vel = velProfile(WALK_B_END - 10, WALK_B_END, tc);
    st.dir = -1; st.facing = -1;

}
function stridePhase(travel) { return (travel / STEP_LEN) * Math.PI; }
function stringTension(phase, i) {

}
function size() {

    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;

  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {

}
function sceneRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };

  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function drawSky(sc, t) {
  var i, sx, sy;
  ctx.fillStyle = SKY;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h * 0.62);
  for (i = 0; i < STARS.length; i++) {
    sx = sc.x + STARS[i].x * sc.w;
    sy = sc.y + STARS[i].y * sc.h;
    ctx.fillStyle = rgba(SODIUM_PALE, STARS[i].a * 0.5);
    ctx.fillRect(sx, sy, STARS[i].r, STARS[i].r);
  }
}
function drawBuildings(sc, dist) {
  var horizon = sc.y + sc.h * 0.62;
  var i, j, bw, bh, bx, by, win;
  for (i = 0; i < BUILDINGS.length; i++) {
    bw = BUILDINGS[i].w * sc.w;
    bh = BUILDINGS[i].h * sc.h;
    bx = sc.x + (((BUILDINGS[i].base - dist * 0.5) % 1.15) + 1.15) % 1.15 * sc.w - bw / 2;
    by = horizon - bh;
    ctx.fillStyle = BUILDING;
    ctx.fillRect(bx, by, bw, bh);
    for (j = 0; j < BUILDINGS[i].wins.length; j++) {
      win = BUILDINGS[i].wins[j];
      if (!win.lit) continue;
      ctx.fillStyle = rgba(SODIUM, win.a * 0.55);
      ctx.fillRect(bx + win.fx * bw, by + win.fy * bh, win.w * bw, win.h * bh);
    }

  ctx.fillStyle = PAVEMENT;
  ctx.fillRect(sc.x, horizon, sc.w, sc.h * 0.38);
}
function drawPavement(sc, dist) {
  var horizon = sc.y + sc.h * 0.62;
  var gy = sc.y + sc.h * 0.80;
  var i, jx;
  ctx.strokeStyle = rgba(SODIUM_PALE, 0.10);
  ctx.lineWidth = 1;
  for (i = -1; i < 14; i++) {
    jx = sc.x + (((i * 0.09 - dist) % 1.1) + 1.1) % 1.1 * sc.w;
    ctx.beginPath();
    ctx.moveTo(jx, horizon);
    ctx.lineTo(jx + sc.w * 0.012, gy + sc.h * 0.16);
    ctx.stroke();
  }
  ctx.fillStyle = rgba(SODIUM_PALE, 0.06);
  ctx.fillRect(sc.x, gy + sc.h * 0.02, sc.w, Math.max(2, sc.h * 0.004));
}
function drawLamp(sc, lampX, scale, alpha) {
  var gy = sc.y + sc.h * 0.80;
  var headY = sc.y + sc.h * 0.16 * scale + sc.h * 0.10 * (1 - scale);
  var headX = lampX;
  var poolRx = sc.w * 0.26 * scale;
  var poolRy = sc.h * 0.045 * scale;

  var cone = ctx.createLinearGradient(0, headY, 0, gy);
  cone.addColorStop(0, rgba(SODIUM, 0.10 * alpha));
  cone.addColorStop(1, rgba(SODIUM, 0.02 * alpha));
  ctx.fillStyle = cone;
  ctx.beginPath();
  ctx.moveTo(headX - sc.w * 0.008 * scale, headY);
  ctx.lineTo(headX + sc.w * 0.008 * scale, headY);
  ctx.lineTo(lampX + poolRx, gy + sc.h * 0.01);
  ctx.lineTo(lampX - poolRx, gy + sc.h * 0.01);
  ctx.closePath();
  ctx.fill();
  /* pool of light on the pavement */
  var pool = ctx.createRadialGradient(lampX, gy + sc.h * 0.01, 0, lampX, gy + sc.h * 0.01, poolRx);
  pool.addColorStop(0, rgba(SODIUM, 0.42 * alpha));
  pool.addColorStop(0.55, rgba(SODIUM, 0.16 * alpha));
  pool.addColorStop(1, rgba(SODIUM, 0));
  ctx.fillStyle = pool;
  ctx.beginPath();
  ctx.ellipse(lampX, gy + sc.h * 0.01, poolRx, poolRy, 0, 0, TAU);
  ctx.fill();
  /* post, arm, head */
  ctx.strokeStyle = rgba('#05070C', 0.9);
  ctx.lineWidth = Math.max(3, sc.w * 0.006 * scale);
  ctx.beginPath();
  ctx.moveTo(lampX, gy);
  ctx.lineTo(lampX, headY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(lampX, headY);
  ctx.quadraticCurveTo(lampX - sc.w * 0.02 * scale, headY - sc.h * 0.012 * scale, lampX - sc.w * 0.035 * scale, headY + sc.h * 0.006 * scale);
  ctx.stroke();
  var glow = ctx.createRadialGradient(headX - sc.w * 0.035 * scale, headY + sc.h * 0.006 * scale, 0, headX - sc.w * 0.035 * scale, headY + sc.h * 0.006 * scale, sc.w * 0.05 * scale);
  glow.addColorStop(0, rgba(SODIUM_PALE, 0.85 * alpha));
  glow.addColorStop(0.35, rgba(SODIUM, 0.28 * alpha));
  glow.addColorStop(1, rgba(SODIUM, 0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.ellipse(headX - sc.w * 0.035 * scale, headY + sc.h * 0.006 * scale, sc.w * 0.05 * scale, sc.w * 0.05 * scale, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = rgba(SODIUM_PALE, 0.95 * alpha);
  ctx.beginPath();
  ctx.ellipse(headX - sc.w * 0.035 * scale, headY + sc.h * 0.008 * scale, sc.w * 0.008 * scale, sc.h * 0.005 * scale, 0, 0, TAU);

function drawFigure(sc, st, t) {

  ctx.moveTo(-6 * u, -90 * u);

function drawPlates() {

  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 16').width;

  var plateH = titlePx + smallPx + 20;

  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Streetwalker 1980', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;

  ctx.font = smallPx + 'px monospace';

  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);

  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;

  soundPlate.h = smallPx + 14;

  soundPlate.y = VH - soundPlate.h - 12;

  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;

/* ---- sound: closed-form model, real WebAudio only after a tap ---- */
function ensureAudio() {
