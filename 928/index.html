<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Week of Checking the Time</title>
<style>
  html, body { margin: 0; padding: 0; background: #1A1A1A; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict). Sleeve #1A1A1A is the pencil ink's dark sibling, the postal sleeve.
  var STOCK = '#F4EFE3';
  var PENCIL = '#2B2B2B';
  var TABLET = '#C0392B';
  var LAPTOP = '#2471A3';
  var PHONE = '#7D3C98';
  var POSTMARK = '#8A8578';
  var STAMP = '#E4572E';
  var SLEEVE = '#1A1A1A';

  var DEVICE_COLORS = [TABLET, LAPTOP, PHONE];       // 0 tablet, 1 laptop, 2 phone
  var DEVICE_LABELS = ['tablet', 'laptop', 'phone'];
  var WHY_LABELS = ['appointment', 'boredom', 'running late'];
  var DAY_INITIALS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

  var LOOP = 69;        // 60 s draw-in + 8 s hold + 1 s gentle clear
  var DRAW_SPAN = 60;
  var TIME_OFFSET = 21; // frame one opens with ~2.5 days drawn (21 / (60/7) = 2.45)
  var FLIP_DUR = 0.6;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var viewW = 300, viewH = 300, dpr = 1, isPhone = false;

  function measure() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    }
    if (!w) { w = 300; h = 300; }
    viewW = w; viewH = h;
    dpr = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (dpr < 1) dpr = 1; if (dpr > 3) dpr = 3;
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    isPhone = (Math.min(sw, sh) > 0 && Math.min(sw, sh) < 700) || (viewH > viewW * 1.15);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
  }
  measure();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', measure);
    if (window.addEventListener) window.addEventListener('resize', measure);
  }

  // Seeded RNG (mulberry32).
  function mulberry(seed) {
    var s = seed | 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Clock: elapsed seconds since load. Frame one is the synchronous draw at t = 0.
  function rawNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return 0;
  }
  var startT = rawNow();
  function elapsed() { return Math.max(0, rawNow() - startT); }

  // ----- The week's log: synthesized, seeded, deterministic per generation -----
  // Hours weighted toward mornings and pre-meeting slots (9, 11, 13, 15, 17).
  var HOUR_W = [];
  (function () {
    for (var h = 0; h < 24; h++) {
      var w = 0.12;
      if (h >= 6 && h <= 10) w += 1.0 - Math.abs(h - 8.5) * 0.28;      // morning hump
      if (h === 9 || h === 11 || h === 13 || h === 15 || h === 17) w += 0.85; // pre-meeting
      if (h >= 19 && h <= 22) w += 0.35;                               // evening drift
      if (h < 5) w = 0.02;                                             // asleep
      HOUR_W.push(w);
    }
  })();
  function pickHour(r) {
    var tot = 0, i;
    for (i = 0; i < 24; i++) tot += HOUR_W[i];
    var x = r() * tot;
    for (i = 0; i < 24; i++) { x -= HOUR_W[i]; if (x <= 0) return i; }
    return 12;
  }
  function pickWeighted(r, ws) {
    var tot = 0, i;
    for (i = 0; i < ws.length; i++) tot += ws[i];
    var x = r() * tot;
    for (i = 0; i < ws.length; i++) { x -= ws[i]; if (x <= 0) return i; }
    return ws.length - 1;
  }

  function makeWeek(gen) {
    var r = mulberry(92889 + gen * 7919);
    // Two honest gaps per week: a (day, daypart) left empty on purpose.
    var gaps = [];
    var g1 = { day: Math.floor(r() * 7), part: Math.floor(r() * 3) };
    var g2 = { day: Math.floor(r() * 7), part: Math.floor(r() * 3) };
    if (g2.day === g1.day) g2.day = (g2.day + 3) % 7;
    gaps.push(g1, g2);
    function inGap(day, hour) {
      for (var k = 0; k < gaps.length; k++) {
        if (gaps[k].day !== day) continue;
        if (gaps[k].part === 0 && hour < 11) return true;
        if (gaps[k].part === 1 && hour >= 11 && hour < 16) return true;
        if (gaps[k].part === 2 && hour >= 16) return true;
      }
      return false;
    }
    var days = [];
    var total = 0;
    for (var d = 0; d < 7; d++) {
      var n = 5 + Math.floor(r() * 10); // 5..14 checks
      var checks = [];
      var guard = 0;
      while (checks.length < n && guard < 300) {
        guard++;
        var hour = pickHour(r);
        if (inGap(d, hour)) continue;
        var device = pickWeighted(r, [15, 25, 60]);   // tablet, laptop, phone
        var why = pickWeighted(r, [35, 45, 20]);      // appointment, boredom, anxiety
        var jit = [];
        for (var j = 0; j < 5; j++) jit.push(r() * 2 - 1);
        checks.push({ hour: hour, device: device, why: why, jit: jit, seed: r() });
      }
      checks.sort(function (a, b) { return a.hour - b.hour; });
      days.push(checks);
      total += checks.length;
    }
    return { days: days, total: total, gaps: gaps };
  }

  var weekCache = {};
  function week(gen) {
    if (!weekCache[gen]) weekCache[gen] = makeWeek(gen);
    return weekCache[gen];
  }

  // ----- Recorded state: everything drawn is a closed-form function of this + t -----
  var gen = 0;
  var side = 0;              // 0 front, 1 back
  var flipStart = -10;       // elapsed time the current flip began
  var flipFrom = 0;          // side shown at flip start
  var generationStart = 0;   // elapsed time the current week's draw clock (re)started
  var pendingTap = null;     // {t, x, y}
  var lastTapUp = -10;
  var dragSegs = [];         // card-local smudge segments {t, x, y, dx, dy}
  var activeDrag = null;     // {lx, ly, moved}

  // ----- Audio: lazy, guarded, gesture-born only -----
  var AC = null, audioOn = false;
  function ensureAudio() {
    if (audioOn) return;
    try {
      if (typeof window === 'undefined' || !window.AudioContext) return;
      AC = new window.AudioContext();
      audioOn = true;
    } catch (e) { AC = null; audioOn = false; }
  }
  function noiseBurst(dur, freq, gain, when) {
    if (!audioOn || !AC) return;
    try {
      var t0 = when || AC.currentTime;
      var len = Math.max(1, Math.floor(AC.sampleRate * dur));
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var ch = buf.getChannelData(0);
      var sr = mulberry(4200 + len);
      for (var i = 0; i < len; i++) ch[i] = (sr() * 2 - 1) * (1 - i / len);
      var src = AC.createBufferSource(); src.buffer = buf;
      var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.1;
      var g = AC.createGain(); g.gain.value = gain;
      src.connect(f); f.connect(g); g.connect(AC.destination);
      src.start(t0);
    } catch (e) { /* silence is fine */ }
  }
  function pencilTick() { noiseBurst(0.05, 2600 + Math.random() * 600, 0.05); }
  function flipSwish() { noiseBurst(0.28, 900, 0.10); }

  // ----- Layout -----
  function cardGeom() {
    var m = Math.max(10, Math.min(viewW, viewH) * 0.035);
    return { m: m, cw: viewW - 2 * m, ch: viewH - 2 * m, cx: viewW / 2, cy: viewH / 2 };
  }
  // Front columns in card-local coords (card centered on 0,0).
  function frontLayout(g) {
    var hh = g.ch * 0.105;                       // header band
    var labelH = g.ch * 0.052;
    var colTop = -g.ch / 2 + hh + labelH;
    var colBot = g.ch / 2 - g.ch * 0.045;
    return {
      hh: hh, labelH: labelH,
      colTop: colTop, colBot: colBot,
      colW: g.cw / 7, colH: colBot - colTop,
      headerY: -g.ch / 2 + hh * 0.62
    };
  }
  function arrowLen(hour, g) {
    var minL = g.cw * 0.018, maxL = Math.min(g.cw * 0.095, g.ch * 0.115);
    return minL + (hour / 23) * (maxL - minL);
  }
  function whyDir(why) {
    if (why === 0) return { x: 0.06, y: -1 };                    // up: appointment
    if (why === 1) return { x: 1, y: 0.05 };                     // right: boredom
    var s = Math.SQRT1_2; return { x: -s, y: s };                // down-left: anxiety
  }

  // Screen point -> card-local point (undo rotation; flip handled separately by parity).
  function toLocal(px, py) {
    var g = cardGeom();
    var dx = px - g.cx, dy = py - g.cy;
    var a = -1.5 * Math.PI / 180;
    var ca = Math.cos(a), sa = Math.sin(a);
    return { x: dx * ca - dy * sa, y: dx * sa + dy * ca };
  }

  // ----- Hand-lettered text: per-letter jitter from a stable hash -----
  function letterHash(s, i) {
    var hsh = 2166136261;
    var str = s + '#' + i;
    for (var k = 0; k < str.length; k++) { hsh ^= str.charCodeAt(k); hsh = Math.imul(hsh, 16777619); }
    return ((hsh >>> 0) % 1000) / 1000;
  }
  function handText(s, x, y, size, color, align) {
    ctx.fillStyle = color;
    ctx.font = '600 ' + size + 'px "Comic Sans MS", "Segoe Print", "Bradley Hand", cursive, sans-serif';
    ctx.textBaseline = 'middle';
    var widths = [], total = 0, i;
    for (i = 0; i < s.length; i++) { var w = ctx.measureText(s[i]).width; widths.push(w); total += w; }
    var cxp = (align === 'center') ? x - total / 2 : x;
    for (i = 0; i < s.length; i++) {
      var j1 = letterHash(s, i) - 0.5, j2 = letterHash(s, i + 57) - 0.5;
      ctx.save();
      ctx.translate(cxp + widths[i] / 2, y + j1 * size * 0.14);
      ctx.rotate(j2 * 0.09);
      ctx.textAlign = 'center';
      ctx.fillText(s[i], 0, 0);
      ctx.restore();
      cxp += widths[i];
    }
  }

  // Wobbly polyline through points, with optional partial reveal (frac of total length).
  function wobblePath(pts, frac) {
    var i, total = 0;
    var segs = [];
    for (i = 1; i < pts.length; i++) {
      var dx = pts[i].x - pts[i - 1].x, dy = pts[i].y - pts[i - 1].y;
      var L = Math.sqrt(dx * dx + dy * dy);
      segs.push(L); total += L;
    }
    var target = total * frac;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    var acc = 0;
    for (i = 1; i < pts.length; i++) {
      if (acc + segs[i - 1] <= target) {
        ctx.lineTo(pts[i].x, pts[i].y); acc += segs[i - 1];
      } else {
        var f = segs[i - 1] > 0 ? (target - acc) / segs[i - 1] : 0;
        ctx.lineTo(pts[i - 1].x + (pts[i].x - pts[i - 1].x) * f,
                   pts[i - 1].y + (pts[i].y - pts[i - 1].y) * f);
        return;
      }
    }
  }
  function strokeWobble(pts, frac, color, width, alpha) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    wobblePath(pts, frac);
    ctx.stroke();
    // graphite grain: a second, fainter pass slightly offset
    ctx.save();
    ctx.translate(0.6, 0.4);
    ctx.globalAlpha = alpha * 0.35;
    wobblePath(pts, frac);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // Build the wobbly point list for one check arrow (card-local), with smudge applied.
  // Length is clamped so the tip always stays on the card, below the header band.
  function arrowPoints(chk, ox, oy, g, tNow, topBound) {
    var dir = whyDir(chk.why);
    var len = arrowLen(chk.hour, g);
    var dl = Math.sqrt(dir.x * dir.x + dir.y * dir.y);
    var ux = dir.x / dl, uy = dir.y / dl;
    var left = -g.cw / 2 + 7, right = g.cw / 2 - 7, bot = g.ch / 2 - 7;
    // First try shifting the origin so the arrow keeps its encoded length;
    // clamp only as a backstop (a Monday down-left arrow slides right, not shorter).
    if (ux < -0.01 && ox + ux * len < left) ox += left - (ox + ux * len);
    if (ux > 0.01 && ox + ux * len > right) ox -= (ox + ux * len) - right;
    if (uy < -0.01 && oy + uy * len < topBound) oy += topBound - (oy + uy * len);
    if (uy > 0.01 && oy + uy * len > bot) oy -= (oy + uy * len) - bot;
    if (ux > 0.01) len = Math.min(len, (right - ox) / ux);
    if (ux < -0.01) len = Math.min(len, (ox - left) / (-ux));
    if (uy > 0.01) len = Math.min(len, (bot - oy) / uy);
    if (uy < -0.01) len = Math.min(len, (oy - topBound) / (-uy));
    if (len < 6) len = 6;
    var px = -uy, py = ux; // perpendicular
    var pts = [];
    var N = 4;
    for (var i = 0; i <= N; i++) {
      var f = i / N;
      var wob = chk.jit[i] * len * 0.055 + chk.jit[4] * 1.2 * Math.sin(f * 2.4);
      pts.push({ x: ox + ux * len * f + px * wob, y: oy + uy * len * f + py * wob });
    }
    // Smudge: recent drag segments push nearby graphite.
    for (var s = 0; s < dragSegs.length; s++) {
      var sg = dragSegs[s];
      var age = tNow - sg.t;
      if (age < 0 || age > 3) continue;
      var decay = Math.exp(-age / 1.1);
      for (var k = 0; k < pts.length; k++) {
        var ddx = pts[k].x - sg.x, ddy = pts[k].y - sg.y;
        var dist = Math.sqrt(ddx * ddx + ddy * ddy);
        var R = g.cw * 0.09;
        if (dist < R) {
          var fall = (1 - dist / R) * decay;
          pts[k].x += sg.dx * fall * 0.55;
          pts[k].y += sg.dy * fall * 0.55;
        }
      }
    }
    return { pts: pts, ux: ux, uy: uy };
  }
  function drawArrowHead(tip, ux, uy, color, width, alpha, scale) {
    var a1 = Math.atan2(uy, ux) + Math.PI * 0.82;
    var a2 = Math.atan2(uy, ux) - Math.PI * 0.82;
    var L = 6.5 * scale;
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(tip.x + Math.cos(a1) * L, tip.y + Math.sin(a1) * L);
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(tip.x + Math.cos(a2) * L, tip.y + Math.sin(a2) * L);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Draw progress (stroke-in fraction) for one check at cycle time ct.
  function checkFrac(day, idx, count, ct) {
    var dayWin = DRAW_SPAN / 7;
    var start = day * dayWin + (count > 1 ? (idx / count) * dayWin * 0.78 : 0);
    var f = (ct - start) / 0.4;
    if (f < 0) return 0;
    if (f > 1) return 1;
    return f;
  }

  // ----- FRONT -----
  function drawFront(g, tNow, cycleT) {
    var L = frontLayout(g);
    var wk = week(gen);
    // header
    handText('Week 01', -g.cw / 2 + g.cw * 0.035, L.headerY, Math.max(11, g.ch * 0.042), PENCIL, 'left');
    // faint header rule
    ctx.strokeStyle = PENCIL; ctx.globalAlpha = 0.3; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-g.cw / 2 + g.cw * 0.03, -g.ch / 2 + L.hh);
    ctx.lineTo(g.cw / 2 - g.cw * 0.03, -g.ch / 2 + L.hh + 1.5);
    ctx.stroke(); ctx.globalAlpha = 1;

    var clearFade = 1;
    if (cycleT > LOOP - 1) clearFade = Math.max(0, LOOP - cycleT);
    var slots = 14;
    var rowH = L.colH / slots;
    var headScale = Math.max(0.7, Math.min(1.3, g.cw / 620));

    for (var d = 0; d < 7; d++) {
      var colX = -g.cw / 2 + d * L.colW;
      // day initial
      handText(DAY_INITIALS[d], colX + L.colW / 2, L.colTop - L.labelH * 0.45,
               Math.max(10, g.ch * 0.034), PENCIL, 'center');
      // faint column guide
      if (d > 0) {
        ctx.strokeStyle = PENCIL; ctx.globalAlpha = 0.10; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(colX, L.colTop - L.labelH * 0.1);
        ctx.lineTo(colX + 1, L.colBot);
        ctx.stroke(); ctx.globalAlpha = 1;
      }
      var checks = wk.days[d];
      for (var i = 0; i < checks.length; i++) {
        var frac = checkFrac(d, i, checks.length, cycleT);
        if (frac <= 0) continue;
        var chk = checks[i];
        var ox = colX + L.colW * 0.16;
        var oy = L.colTop + (i + 0.5) * rowH;
        var ap = arrowPoints(chk, ox, oy, g, tNow, -g.ch / 2 + L.hh + 4);
        var col = DEVICE_COLORS[chk.device];
        var wdt = Math.max(1.1, g.cw * 0.0022);
        strokeWobble(ap.pts, frac, col, wdt, 0.92 * clearFade);
        if (frac > 0.85) {
          var tip = ap.pts[ap.pts.length - 1];
          drawArrowHead(tip, ap.ux, ap.uy, col, wdt, 0.92 * clearFade, headScale);
        }
      }
    }
    return wk;
  }

  // ----- BACK: the legend, same pencil -----
  function legendArrow(x, y, why, len, color, g) {
    var dir = whyDir(why);
    var dl = Math.sqrt(dir.x * dir.x + dir.y * dir.y);
    var ux = dir.x / dl, uy = dir.y / dl;
    var px = -uy, py = ux;
    var pts = [];
    var r = mulberry(1234 + why * 77 + len);
    for (var i = 0; i <= 4; i++) {
      var f = i / 4;
      var wob = (r() * 2 - 1) * len * 0.05;
      pts.push({ x: x + ux * len * f + px * wob, y: y + uy * len * f + py * wob });
    }
    var wdt = Math.max(1.1, g.cw * 0.0022);
    strokeWobble(pts, 1, color, wdt, 0.92);
    drawArrowHead(pts[pts.length - 1], ux, uy, color, wdt, 0.92, Math.max(0.7, Math.min(1.3, g.cw / 620)));
  }
  function drawBack(g, tNow) {
    var fs = Math.max(10.5, g.ch * 0.033);
    var x0 = -g.cw / 2 + g.cw * 0.055;
    var gy = -g.ch / 2 + g.ch * 0.16;
    var rowGap = g.ch * 0.105;
    var glyphLen = g.cw * 0.055;
    var i;
    // direction glyphs (pencil), labeled
    for (i = 0; i < 3; i++) {
      legendArrow(x0 + glyphLen * 0.5, gy + i * rowGap, i, glyphLen, PENCIL, g);
      handText(WHY_LABELS[i], x0 + glyphLen * 1.5, gy + i * rowGap, fs, PENCIL, 'left');
    }
    // device colors, labeled
    var dy = gy + 3 * rowGap + g.ch * 0.03;
    for (i = 0; i < 3; i++) {
      legendArrow(x0 + glyphLen * 0.5, dy + i * rowGap, 1, glyphLen, DEVICE_COLORS[i], g);
      handText(DEVICE_LABELS[i], x0 + glyphLen * 1.5, dy + i * rowGap, fs, PENCIL, 'left');
    }
    // length rule
    var ly = dy + 3 * rowGap + g.ch * 0.03;
    legendArrow(x0 + glyphLen * 0.9, ly, 1, glyphLen * 1.8, PENCIL, g);
    handText('length = the hour', x0 + glyphLen * 3.1, ly, fs, PENCIL, 'left');

    // Postal dressing: stamp, postmark, scuffs, coffee ring.
    var sx = g.cw / 2 - g.cw * 0.205, sy = -g.ch / 2 + g.ch * 0.055;
    var sw = g.cw * 0.155, sh = g.ch * 0.135;
    ctx.strokeStyle = STAMP; ctx.globalAlpha = 0.85; ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, sw, sh);
    ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
    ctx.strokeRect(sx + 4, sy + 4, sw - 8, sh - 8);
    ctx.globalAlpha = 0.65;
    // tiny wavy lines inside the stamp
    ctx.beginPath();
    for (i = 0; i < 3; i++) {
      var wy = sy + sh * (0.32 + i * 0.2);
      for (var wx = 0; wx <= 10; wx++) {
        var xx = sx + sw * 0.18 + (sw * 0.64) * (wx / 10);
        var yy = wy + Math.sin(wx * 1.4 + i) * 1.6;
        if (wx === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
    }
    ctx.stroke(); ctx.globalAlpha = 1;
    // postmark: gray ring overlapping the stamp's left edge + wavy tails
    var pmx = sx - g.cw * 0.012, pmy = sy + sh * 0.52, pmr = Math.min(g.cw * 0.052, g.ch * 0.075);
    ctx.strokeStyle = POSTMARK; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(pmx, pmy, pmr, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.55; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(pmx, pmy, pmr * 0.68, 0.4, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(pmx, pmy, pmr * 0.68, Math.PI * 1.1, Math.PI * 2.1); ctx.stroke();
    ctx.beginPath();
    for (i = 0; i < 3; i++) {
      var ty = pmy - pmr * 0.4 + i * pmr * 0.4;
      for (var tx = 0; tx <= 8; tx++) {
        var txx = pmx - pmr - tx * (g.cw * 0.012);
        var tyy = ty + Math.sin(tx * 1.3 + i * 2) * 1.8;
        if (tx === 0) ctx.moveTo(txx, tyy); else ctx.lineTo(txx, tyy);
      }
    }
    ctx.stroke(); ctx.globalAlpha = 1;
    // coffee ring
    var crx = g.cw / 2 - g.cw * 0.16, cry = g.ch / 2 - g.ch * 0.20, crr = Math.min(g.cw * 0.062, g.ch * 0.09);
    ctx.strokeStyle = POSTMARK; ctx.globalAlpha = 0.22; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(crx, cry, crr, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.13; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(crx + 2, cry + 1, crr * 1.1, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    // mail scuffs
    var rs = mulberry(777);
    ctx.strokeStyle = POSTMARK; ctx.lineWidth = 1.2;
    for (i = 0; i < 6; i++) {
      var scx = -g.cw / 2 + rs() * g.cw, scy = -g.ch / 2 + rs() * g.ch;
      var scl = 12 + rs() * 30, sca = rs() * Math.PI;
      ctx.globalAlpha = 0.10 + rs() * 0.08;
      ctx.beginPath();
      ctx.moveTo(scx, scy);
      ctx.lineTo(scx + Math.cos(sca) * scl, scy + Math.sin(sca) * scl);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ----- Card frame (stock, edge wear) drawn in local coords -----
  function drawCardBase(g) {
    ctx.fillStyle = STOCK;
    ctx.fillRect(-g.cw / 2, -g.ch / 2, g.cw, g.ch);
    // edge darkening, postal wear
    ctx.strokeStyle = PENCIL; ctx.globalAlpha = 0.16; ctx.lineWidth = 2;
    ctx.strokeRect(-g.cw / 2 + 1, -g.ch / 2 + 1, g.cw - 2, g.ch - 2);
    ctx.globalAlpha = 0.07; ctx.lineWidth = 5;
    ctx.strokeRect(-g.cw / 2 + 3, -g.ch / 2 + 3, g.cw - 6, g.ch - 6);
    ctx.globalAlpha = 1;
  }

  var drawnCountPrev = -1;
  function totalDrawn(cycleT) {
    var wk = week(gen);
    var n = 0;
    for (var d = 0; d < 7; d++) {
      for (var i = 0; i < wk.days[d].length; i++) {
        if (checkFrac(d, i, wk.days[d].length, cycleT) >= 1) n++;
      }
    }
    return n;
  }

  function draw(t) {
    // Pin the canvas CSS size every frame (house rule).
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = SLEEVE;
    ctx.fillRect(0, 0, viewW, viewH);

    var g = cardGeom();
    var cycleT = ((t - generationStart + TIME_OFFSET) % LOOP + LOOP) % LOOP;

    // Flip state: scaleX follows cos over FLIP_DUR; side swaps at the edge-on moment.
    var shownSide = side, sx = 1;
    if (t - flipStart < FLIP_DUR) {
      var p = (t - flipStart) / FLIP_DUR;
      sx = Math.cos(p * Math.PI);
      shownSide = (p < 0.5) ? flipFrom : side;
    }

    ctx.save();
    ctx.translate(g.cx, g.cy);
    ctx.rotate(1.5 * Math.PI / 180);
    ctx.transform(sx, 0, 0, 1, 0, 0);
    // slight skew during the turn, the paper bending
    if (t - flipStart < FLIP_DUR) ctx.transform(1, Math.sin((t - flipStart) / FLIP_DUR * Math.PI) * 0.03, 0, 1, 0, 0);
    drawCardBase(g);
    if (shownSide === 0) drawFront(g, t, cycleT);
    else drawBack(g, t);
    ctx.restore();

    // Pencil-scratch ticks as new arrows complete (audio only; visuals unaffected).
    if (audioOn && shownSide === 0) {
      var n = totalDrawn(cycleT);
      if (drawnCountPrev >= 0 && n > drawnCountPrev && n - drawnCountPrev <= 4) {
        for (var k = 0; k < n - drawnCountPrev; k++) pencilTick();
      }
      drawnCountPrev = n;
    } else {
      drawnCountPrev = -1;
    }
  }

  // ----- Interaction: tap flips, drag smudges, double-tap reseeds -----
  function matureTap(t) {
    if (pendingTap && t - pendingTap.t > 0.35) {
      flipFrom = side;
      side = 1 - side;
      flipStart = pendingTap.t;
      flipSwish();
      pendingTap = null;
    }
  }
  function onDown(x, y) {
    ensureAudio();
    if (AC && AC.resume) { try { AC.resume(); } catch (e) {} }
    var lp = toLocal(x, y);
    activeDrag = { lx: lp.x, ly: lp.y, moved: 0 };
  }
  function onMove(x, y) {
    if (!activeDrag) return;
    var lp = toLocal(x, y);
    var dx = lp.x - activeDrag.lx, dy = lp.y - activeDrag.ly;
    var dist = Math.sqrt(dx * dx + dy * dy);
    activeDrag.moved += dist;
    if (dist > 2) {
      dragSegs.push({ t: elapsed(), x: lp.x, y: lp.y, dx: dx, dy: dy });
      if (dragSegs.length > 240) dragSegs.shift();
    }
    activeDrag.lx = lp.x; activeDrag.ly = lp.y;
  }
  function onUp(x, y) {
    var t = elapsed();
    var wasDrag = activeDrag && activeDrag.moved > 14;
    activeDrag = null;
    if (wasDrag) return;
    // tap candidate
    if (t - lastTapUp < 0.35 && pendingTap) {
      // double-tap: a new week, drawn from scratch on the front
      pendingTap = null;
      gen++;
      side = 0;
      flipFrom = 0;
      flipStart = t - FLIP_DUR; // no flip animation; settle front-facing
      generationStart = t + TIME_OFFSET; // restart the draw clock: cycleT = 0 at the tap
      drawnCountPrev = -1;
      flipSwish();
      lastTapUp = -10;
      return;
    }
    lastTapUp = t;
    pendingTap = { t: t, x: x, y: y };
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY); });
    canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
    canvas.addEventListener('pointerup', function (e) { onUp(e.clientX, e.clientY); });
    canvas.addEventListener('pointercancel', function () { activeDrag = null; });
  }

  // Draw-clock origin: cycleT = (t - generationStart + TIME_OFFSET) % LOOP,
  // so at t = 0 the cycle sits at TIME_OFFSET (2.5 days drawn).

  // Frame one: synchronous draw at t = 0.
  draw(0);

  if (typeof requestAnimationFrame !== 'undefined') {
    var loop = function () {
      var t = elapsed();
      matureTap(t);
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
