<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twine</title>
<style>
html, body { margin: 0; padding: 0; background: #0E0B09; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0E0B09';
var TAPE = '#C9A06B';
var TAPE_MID = '#A97C4F';
var TAPE_DARK = '#8A6A45';
var OXIDE = '#8A857C';
var OXIDE_DARK = '#5E5A53';
var BLOOM = '#E8C88F';
var PLATE = '#171310';
var PLATE_LINE = 'rgba(201,160,107,0.45)';
var TITLE_INK = '#DCC7A4';
var HINT_INK = '#9A8871';
var FRAME_T = 60.0;
/* Period pair: left reel 24 s, right reel 24 * sqrt(2) s. The ratio is
   irrational, so the motif offset drifts forever and never aligns. */
var P_LEFT = 24.0;
var P_RIGHT = 24.0 * Math.SQRT2;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1752);
var phaseT = FRAME_T;
/* ---- layout: reels opposed left and right at mid height; the motif
   traces run between them across the full frame. ---- */
var BAND_Y = 0.5;
function reelR() { return isPhone ? clamp(0.12 * Math.min(VW, VH), 34, 64) : clamp(0.16 * Math.min(VW, VH), 42, 118); }
function reelLX() { return Math.max(0.10 * VW, reelR() + 12); }
function reelRX() { return VW - reelLX(); }
function bandY() { return BAND_Y * VH; }
function traceX0() { return reelLX() + reelR() * 0.92; }
function traceX1() { return reelRX() - reelR() * 0.92; }
/* ---- the looping motif: three harmonics, seeded phases, one loop per
   wavelength. Both traces carry the same motif; their phases drift
   apart at the irrational period ratio. ---- */
var MOTIF = [
  { a: 1.0, k: 1, p: rng() * TAU },
  { a: 0.42, k: 2, p: rng() * TAU },
  { a: 0.24, k: 3, p: rng() * TAU }
];
var WAVES = 3.25; /* motif loops across the span; fewer on phones so the short span stays legible */
function waves() { return isPhone ? 2.5 : WAVES; }
function motif(u) {
  var i, m, s = 0;
  for (i = 0; i < MOTIF.length; i++) {
    m = MOTIF[i];
    s += m.a * Math.sin(TAU * m.k * u + m.p);
  }
  return s / 1.66;
}
/* trace phases: the left trace turns with the left reel, the right
   trace with the right reel; their difference is the slow drift. */
function phaseA(t) { return TAU * (t / P_LEFT); }
function phaseB(t) { return TAU * (t / P_RIGHT); }
function traceAmp() { return reelR() * 0.62; }
function traceYA(x, t) {
  var u = (x - traceX0()) / (traceX1() - traceX0()) * waves() + phaseA(t) / TAU;
  return bandY() + traceAmp() * motif(u);
}
function traceYB(x, t) {
  var u = (x - traceX0()) / (traceX1() - traceX0()) * waves() + phaseB(t) / TAU;
  return bandY() + traceAmp() * motif(u);
}
/* ---- reel rim ticks: seeded angular offsets so each reel reads as a
   distinct spool turning. ---- */
var TICKS = [];
(function () {
  var i;
  for (i = 0; i < 12; i++) TICKS.push(rng() * TAU);
})();
/* ---- the room's two mics: fixed faint glow points, seeded positions
   low in the margins. ---- */
var MICS = [
  { fx: 0.16 + (rng() - 0.5) * 0.02, fy: 0.82 + (rng() - 0.5) * 0.02 },
  { fx: 0.84 + (rng() - 0.5) * 0.02, fy: 0.82 + (rng() - 0.5) * 0.02 }
];
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function drawReel(cx, t, period, flip) {
  var s = Math.min(VW, VH);
  var r = reelR();
  var cy = bandY();
  var ang = TAU * (t / period) * (flip ? -1 : 1);
  var i, a, x0, y0, x1, y1;
  /* outer disc */
  ctx.fillStyle = '#14100C';
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(TAPE_MID, 0.9);
  ctx.lineWidth = Math.max(s * 0.0025, 1.2);
  ctx.stroke();
  /* wound tape ring */
  ctx.strokeStyle = rgba(TAPE, 0.55);
  ctx.lineWidth = Math.max(s * 0.006, 2.5);
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.86, cy);
  ctx.arc(cx, cy, r * 0.86, 0, TAU);
  ctx.stroke();
  /* rim ticks, rotating with the reel so the turn is visible */
  ctx.fillStyle = rgba(TAPE, 0.85);
  for (i = 0; i < TICKS.length; i++) {
    a = ang + TICKS[i];
    x0 = cx + Math.cos(a) * r * 0.97;
    y0 = cy + Math.sin(a) * r * 0.97;
    ctx.beginPath();
    ctx.moveTo(x0 + 2, y0);
    ctx.arc(x0, y0, 2, 0, TAU);
    ctx.fill();
  }
  /* four spokes */
  ctx.strokeStyle = rgba(OXIDE, 0.7);
  ctx.lineWidth = Math.max(s * 0.003, 1.4);
  for (i = 0; i < 4; i++) {
    a = ang + i * Math.PI / 2;
    x0 = cx + Math.cos(a) * r * 0.18;
    y0 = cy + Math.sin(a) * r * 0.18;
    x1 = cx + Math.cos(a) * r * 0.82;
    y1 = cy + Math.sin(a) * r * 0.82;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }
  /* hub */
  ctx.fillStyle = OXIDE_DARK;
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.18, cy);
  ctx.arc(cx, cy, r * 0.18, 0, TAU);
  ctx.fill();
  ctx.fillStyle = rgba(TAPE, 0.9);
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.06, cy);
  ctx.arc(cx, cy, r * 0.06, 0, TAU);
  ctx.fill();
}
function drawTrace(t, which) {
  var s = Math.min(VW, VH);
  var x0 = traceX0(), x1 = traceX1();
  var step = Math.max(3, (x1 - x0) / 320);
  var x, y;
  ctx.strokeStyle = which === 0 ? rgba(TAPE, 0.92) : rgba(OXIDE, 0.92);
  ctx.lineWidth = Math.max(s * 0.0022, 1.1);
  ctx.beginPath();
  for (x = x0; x <= x1; x += step) {
    y = which === 0 ? traceYA(x, t) : traceYB(x, t);
    if (x === x0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}
function drawCrossings(t) {
  var s = Math.min(VW, VH);
  var x0 = traceX0(), x1 = traceX1();
  var step = Math.max(2, (x1 - x0) / 480);
  var x, dPrev, d, yA, yB, xc, yc, f, r, g;
  dPrev = traceYA(x0, t) - traceYB(x0, t);
  for (x = x0 + step; x <= x1; x += step) {
    yA = traceYA(x, t);
    yB = traceYB(x, t);
    d = yA - yB;
    if ((dPrev < 0 && d >= 0) || (dPrev > 0 && d <= 0)) {
      f = Math.abs(dPrev) / (Math.abs(dPrev) + Math.abs(d));
      xc = x - step + f * step;
      yc = (traceYA(xc, t) + traceYB(xc, t)) / 2;
      r = Math.max(s * 0.028, 12);
      g = ctx.createRadialGradient(xc, yc, 0, xc, yc, r);
      g.addColorStop(0, rgba(BLOOM, 0.5));
      g.addColorStop(0.45, rgba(BLOOM, 0.18));
      g.addColorStop(1, rgba(BLOOM, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(xc + r, yc);
      ctx.arc(xc, yc, r, 0, TAU);
      ctx.fill();
      ctx.fillStyle = rgba(BLOOM, 0.85);
      ctx.beginPath();
      ctx.moveTo(xc + 2.2, yc);
      ctx.arc(xc, yc, 2.2, 0, TAU);
      ctx.fill();
    }
    dPrev = d;
  }
}
function drawMics() {
  var s = Math.min(VW, VH);
  var i, mx, my, r, g;
  for (i = 0; i < MICS.length; i++) {
    mx = MICS[i].fx * VW;
    my = MICS[i].fy * VH;
    r = Math.max(s * 0.02, 9);
    g = ctx.createRadialGradient(mx, my, 0, mx, my, r * 3.2);
    g.addColorStop(0, rgba(TAPE, 0.16));
    g.addColorStop(0.5, rgba(TAPE, 0.05));
    g.addColorStop(1, rgba(TAPE, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(mx + r * 3.2, my);
    ctx.arc(mx, my, r * 3.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = rgba(TAPE, 0.5);
    ctx.beginPath();
    ctx.moveTo(mx + 2, my);
    ctx.arc(mx, my, 2, 0, TAU);
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Twine').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Twine').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 29').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Twine', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 29', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawTrace(phaseT, 0);
  drawTrace(phaseT, 1);
  drawCrossings(phaseT);
  drawReel(reelLX(), phaseT, P_LEFT, false);
  drawReel(reelRX(), phaseT, P_RIGHT, true);
  drawMics();
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    reelAngles: function (t) { return [TAU * (t / P_LEFT), TAU * (t / P_RIGHT)]; },
    drift: function (t) { return phaseA(t) - phaseB(t); },
    crossings: function (t) {
      var x0 = traceX0(), x1 = traceX1();
      var step = Math.max(2, (x1 - x0) / 480);
      var x, dPrev, d, out = [];
      dPrev = traceYA(x0, t) - traceYB(x0, t);
      for (x = x0 + step; x <= x1; x += step) {
        d = traceYA(x, t) - traceYB(x, t);
        if ((dPrev < 0 && d >= 0) || (dPrev > 0 && d <= 0)) out.push(x);
        dPrev = d;
      }
      return out;
    }
  };
}
/* ---- frame one: fixed phase t = 60.0 s. Drift at frame one:
   phaseA - phaseB = 2*pi*60*(1/24 - 1/(24*sqrt2)) = 4.601 rad,
   so the offset sits visibly mid-drift with several crossings. ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
