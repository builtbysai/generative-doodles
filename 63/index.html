<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№63 · Bar Weave</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#222222; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,255,255,0.65); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to re-pack a row</div>
<script>
'use strict';
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '63', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }

const PASTELS=['#d9b8c4','#b8d4d9','#d9cba8','#a8bfa8','#c9c9d9','#e8d0b8'];
const ACCENTS=['#d93b3b','#1e5fc4','#19a7c4','#f28c1e','#a8328a'];
function genBars(rng){
  const n=5+Math.floor(rng()*7);
  const raw=[]; let sum=0;
  for(let i=0;i<n;i++){ const v=0.4+rng(); raw.push(v); sum+=v; }
  return raw.map(v=>({frac:v/sum,color: rng()<0.7 ? PASTELS[Math.floor(rng()*PASTELS.length)] : ACCENTS[Math.floor(rng()*ACCENTS.length)]}));
}
let grid=null, gridN=0, phase63=0, lastRowIdx=-1, gen63=0;
function ensureGrid(N){
  if(grid && gridN===N) return;
  gridN=N; grid=[]; const rng=mulberry(seed*977+gen63);
  for(let r=0;r<N;r++){ const row=[]; for(let c=0;c<N;c++) row.push({bars:genBars(rng),old:null,fadeAt:-1e9}); grid.push(row); }
}
function regenRow(r,nowMs){
  const rng=mulberry(seed*131+gen63*1000+r*37+Math.floor(nowMs/1000));
  gen63++;
  for(let c=0;c<gridN;c++){ const cell=grid[r][c]; cell.old=cell.bars; cell.bars=genBars(rng); cell.fadeAt=nowMs; }
}
function drawCellBars(x,y,cw,ch,bars,horiz,alpha){
  ctx.save(); ctx.globalAlpha=alpha;
  let pos=0;
  for(const b of bars){
    ctx.fillStyle=b.color;
    if(horiz){ const bh=b.frac*ch; ctx.fillRect(x,y+pos*cw*0+pos, cw, bh+0.5); pos+=bh; }
    else { const bw=b.frac*cw; ctx.fillRect(x+pos,y,bw+0.5,ch); pos+=bw; }
  }
  ctx.restore();
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const phone=isPhone(); const N=phone?7:8;
  ensureGrid(N);
  let ox,oy,cw,ch;
  if(phone){ ox=0; oy=0; cw=w/N; ch=h/N; } else { const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; cw=S/N; ch=S/N; }
  ctx.fillStyle='#222222'; ctx.fillRect(0,0,w,h);
  const interval=30/N, idx=Math.floor((nowMs/1000)/interval);
  if(lastRowIdx>=0 && idx!==lastRowIdx) regenRow(idx%N, nowMs);
  if(lastRowIdx<0) lastRowIdx=idx; else lastRowIdx=idx;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const cell=grid[r][c];
    const horiz=((r+c+phase63)%2===0);
    const x=ox+c*cw, y=oy+r*ch;
    const fp=(nowMs-cell.fadeAt)/800;
    if(cell.old && fp<1){ drawCellBars(x,y,cw,ch,cell.old,horiz,1); drawCellBars(x,y,cw,ch,cell.bars,horiz,smooth(fp)); }
    else drawCellBars(x,y,cw,ch,cell.bars,horiz,1);
  }
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(2000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
let drag63=null;
canvas.addEventListener('pointerdown',ev=>{ drag63={sx:ev.clientX,sy:ev.clientY,lastX:ev.clientX,flipped:false}; });
canvas.addEventListener('pointermove',ev=>{
  if(!drag63) return;
  const [w,h]=viewportWH(); const phone=isPhone(); const N=phone?7:8;
  let oy,ch; if(phone){ oy=0; ch=h/N; } else { const S=Math.min(w,h); oy=(h-S)/2; ch=S/N; }
  const r=Math.max(0,Math.min(N-1,Math.floor((ev.clientY-oy)/ch)));
  if(Math.abs(ev.clientX-drag63.lastX)>34){ regenRow(r,performance.now()); drag63.lastX=ev.clientX; }
  if(!drag63.flipped && (ev.clientY-drag63.sy)>56){ phase63^=1; drag63.flipped=true; }
  if(!drag63.flipped && (ev.clientY-drag63.sy)<-56){ phase63^=1; drag63.flipped=true; }
});
function end63(){ drag63=null; }
canvas.addEventListener('pointerup',end63); canvas.addEventListener('pointercancel',end63);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
