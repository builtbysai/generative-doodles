<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twenty-Five Woodworms</title>
<style>
html, body { margin: 0; padding: 0; background: #EFE8D8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#EFE8D8';
var WOOD = '#3B2A1A';
var WOOD_DARK = '#241708';
var WOOD_LIGHT = '#5A4128';
var AGENT = '#1A120A';
var AMBER = '#B98A3E';
var PLATE = '#E6DCC6';
var PLATE_LINE = 'rgba(185,138,62,0.7)';
var TITLE_INK = '#2E2115';
var HINT_INK = '#6B4E22';
var FRAME_T = 60.0;
var PIT_INTERVAL = 2.0;
var PIT_CAP = 900;
var AGENT_N = 25;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1748);
var phaseT = FRAME_T;
/* ---- the wood form: a gnarled polar blob, off-center.
   Radius is a fixed seeded function of angle, so the mask is the same
   at every size and every time. ---- */
var WOOD_CX = 0.38, WOOD_CY = 0.55;
var WOOD_R = 0.30;
var WOOD_W1 = 0.18, WOOD_W2 = 0.10, WOOD_W3 = 0.06;
var WOOD_P1 = rng() * TAU, WOOD_P2 = rng() * TAU, WOOD_P3 = rng() * TAU;
function woodRadiusAt(theta) {
  return WOOD_R * (1 + WOOD_W1 * Math.sin(3 * theta + WOOD_P1)
    + WOOD_W2 * Math.sin(7 * theta + WOOD_P2)
    + WOOD_W3 * Math.sin(11 * theta + WOOD_P3));
}
function woodCenter() { return { x: WOOD_CX * VW, y: WOOD_CY * VH, r: WOOD_R * Math.min(VW, VH) }; }
/* ---- bark streaks: seeded curved marks inside the form ---- */
var STREAKS = [];
(function () {
  var i;
  for (i = 0; i < 46; i++) {
    STREAKS.push({
      a: rng() * TAU,
      r0: 0.15 + rng() * 0.55,
      len: 0.10 + rng() * 0.35,
      bend: (rng() - 0.5) * 0.9,
      w: 0.004 + rng() * 0.010,
      dark: rng() < 0.6
    });
  }
})();
var KNOTS = [];
(function () {
  var i;
  for (i = 0; i < 4; i++) {
    KNOTS.push({ a: rng() * TAU, r: 0.2 + rng() * 0.5, rad: 0.02 + rng() * 0.03 });
  }
})();
/* ---- the twenty-five agents.
   Each agent has a home point inset inside the wood mask, a wander
   amplitude small enough to stay inside, and an authored pause
   schedule: a cycle period with a pause window. Position is a
   closed-form function of piece time: the wander phase advances on
   effective time, the integral of the move indicator, so an agent
   sits still during its pauses and never needs frame-integrated
   steering. ---- */
var AGENTS = [];
(function () {
  var i;
  for (i = 0; i < AGENT_N; i++) {
    var a = rng() * TAU;
    var rr = 0.12 + rng() * 0.55;
    AGENTS.push({
      homeA: a,
      homeR: rr,
      amp: 0.020 + rng() * 0.022,
      w1: 0.35 + rng() * 0.45,
      w2: 0.30 + rng() * 0.40,
      p1: rng() * TAU,
      p2: rng() * TAU,
      period: 7 + rng() * 6,
      pauseStart: rng() * 0.6,
      pauseDur: 0.18 + rng() * 0.25,
      size: 0.0045 + rng() * 0.0035
    });
  }
})();
function agentMoveAt(ag, t) {
  var f = (t / ag.period) % 1;
  if (f < 0) f += 1;
  return (f >= ag.pauseStart && f < ag.pauseStart + ag.pauseDur) ? 0 : 1;
}
/* integral of the move indicator from 0 to t, closed form */
function agentEffTime(ag, t) {
  var cycles = Math.floor(t / ag.period);
  var rem = t - cycles * ag.period;
  var eff = cycles * ag.period * (1 - ag.pauseDur);
  var ps = ag.pauseStart * ag.period;
  var pe = (ag.pauseStart + ag.pauseDur) * ag.period;
  if (rem <= ps) eff += rem;
  else if (rem <= pe) eff += ps;
  else eff += rem - (pe - ps);
  return eff;
}
function agentPosAt(ag, t) {
  var et = agentEffTime(ag, t);
  var wc = woodCenter();
  var hx = wc.x + Math.cos(ag.homeA) * ag.homeR * woodRadiusAt(ag.homeA) * Math.min(VW, VH);
  var hy = wc.y + Math.sin(ag.homeA) * ag.homeR * woodRadiusAt(ag.homeA) * Math.min(VW, VH);
  var s = Math.min(VW, VH);
  var dx = Math.sin(et * ag.w1 + ag.p1) * ag.amp * s;
  var dy = Math.cos(et * ag.w2 + ag.p2) * ag.amp * s;
  return { x: hx + dx, y: hy + dy };
}
/* ---- pits: a fixed-capacity record list, re-rendered each frame.
   Agent i leaves a pit at its position at every PIT_INTERVAL sample
   time. The list for time t is the prefix of the full list, so pits
   accumulate and persist and never fade. ---- */
function pitCountAt(t) {
  var samples = Math.floor(t / PIT_INTERVAL) + 1;
  return Math.min(AGENT_N * samples, PIT_CAP);
}
function pitAt(idx, t) {
  var samples = Math.floor(t / PIT_INTERVAL) + 1;
  var k = Math.floor(idx / AGENT_N);
  var i = idx % AGENT_N;
  var st = k * PIT_INTERVAL;
  var p = agentPosAt(AGENTS[i], st);
  return { x: p.x, y: p.y, a: 0.35 + (k % 5) * 0.06 };
}
/* ---- the listening ring: brightness is the smoothed activity of
   the agents, sampled over a 4 second window, closed form. ---- */
var RING_CX = 0.84, RING_CY = 0.30, RING_R = 0.045;
function activityAt(t) {
  var i, sum = 0;
  for (i = 0; i < AGENT_N; i++) sum += agentMoveAt(AGENTS[i], t);
  return sum / AGENT_N;
}
function smoothedActivityAt(t) {
  var s = 0, k;
  for (k = 0; k < 9; k++) s += activityAt(Math.max(0, t - 4 + k * 0.5));
  return s / 9;
}
function ringAlphaAt(t) {
  return 0.28 + 0.62 * smoothedActivityAt(t);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function drawWood() {
  var wc = woodCenter();
  var s = Math.min(VW, VH);
  var i, th, r;
  ctx.beginPath();
  for (i = 0; i <= 96; i++) {
    th = (i / 96) * TAU;
    r = woodRadiusAt(th) * s;
    var px = wc.x + Math.cos(th) * r;
    var py = wc.y + Math.sin(th) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  var grad = ctx.createRadialGradient(wc.x - wc.r * 0.3, wc.y - wc.r * 0.3, wc.r * 0.1, wc.x, wc.y, wc.r * 1.05);
  grad.addColorStop(0, WOOD_LIGHT);
  grad.addColorStop(0.55, WOOD);
  grad.addColorStop(1, WOOD_DARK);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = rgba(WOOD_DARK, 0.5);
  ctx.lineWidth = Math.max(s * 0.004, 1);
  ctx.stroke();
  /* clip all interior marks to the form so no streak ever pokes past the edge */
  ctx.save();
  ctx.beginPath();
  for (i = 0; i <= 96; i++) {
    th = (i / 96) * TAU;
    r = woodRadiusAt(th) * s;
    px = wc.x + Math.cos(th) * r;
    py = wc.y + Math.sin(th) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.clip();
  /* bark streaks */
  var st, x0, y0, x1, y1, mx, my;
  for (i = 0; i < STREAKS.length; i++) {
    st = STREAKS[i];
    r = woodRadiusAt(st.a) * s;
    x0 = wc.x + Math.cos(st.a) * st.r0 * r;
    y0 = wc.y + Math.sin(st.a) * st.r0 * r;
    x1 = wc.x + Math.cos(st.a + st.len) * (st.r0 + 0.12) * r;
    y1 = wc.y + Math.sin(st.a + st.len) * (st.r0 + 0.12) * r;
    mx = (x0 + x1) / 2 + Math.cos(st.a + Math.PI / 2) * st.bend * s * 0.05;
    my = (y0 + y1) / 2 + Math.sin(st.a + Math.PI / 2) * st.bend * s * 0.05;
    ctx.strokeStyle = st.dark ? rgba(WOOD_DARK, 0.45) : rgba(WOOD_LIGHT, 0.5);
    ctx.lineWidth = Math.max(st.w * s, 0.8);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(mx, my, x1, y1);
    ctx.stroke();
  }
  /* knots */
  var kn;
  for (i = 0; i < KNOTS.length; i++) {
    kn = KNOTS[i];
    r = woodRadiusAt(kn.a) * s;
    var kx = wc.x + Math.cos(kn.a) * kn.r * r;
    var ky = wc.y + Math.sin(kn.a) * kn.r * r;
    ctx.strokeStyle = rgba(WOOD_DARK, 0.6);
    ctx.lineWidth = Math.max(s * 0.003, 0.8);
    ctx.beginPath();
    ctx.moveTo(kx + kn.rad * s, ky);
    ctx.arc(kx, ky, kn.rad * s, 0, TAU);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(kx + kn.rad * s * 0.45, ky);
    ctx.arc(kx, ky, kn.rad * s * 0.45, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}
function drawPits(t) {
  var n = pitCountAt(t);
  var s = Math.min(VW, VH);
  var i, p;
  for (i = 0; i < n; i++) {
    p = pitAt(i, t);
    ctx.fillStyle = rgba(AGENT, p.a);
    ctx.beginPath();
    ctx.moveTo(p.x + Math.max(s * 0.0022, 0.9), p.y);
    ctx.arc(p.x, p.y, Math.max(s * 0.0022, 0.9), 0, TAU);
    ctx.fill();
  }
}
function drawAgents(t) {
  var s = Math.min(VW, VH);
  var i, p;
  for (i = 0; i < AGENT_N; i++) {
    p = agentPosAt(AGENTS[i], t);
    ctx.fillStyle = AGENT;
    ctx.beginPath();
    ctx.moveTo(p.x + Math.max(AGENTS[i].size * s, 1.2), p.y);
    ctx.arc(p.x, p.y, Math.max(AGENTS[i].size * s, 1.2), 0, TAU);
    ctx.fill();
  }
}
function drawRing(t) {
  var s = Math.min(VW, VH);
  var cx = RING_CX * VW, cy = RING_CY * VH, r = RING_R * s;
  var alpha = ringAlphaAt(t);
  var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.4);
  glow.addColorStop(0, rgba(AMBER, alpha * 0.35));
  glow.addColorStop(1, rgba(AMBER, 0));
  ctx.fillStyle = glow;
  ctx.fillRect(cx - r * 2.4, cy - r * 2.4, r * 4.8, r * 4.8);
  ctx.strokeStyle = rgba(AMBER, alpha);
  ctx.lineWidth = Math.max(s * 0.006, 1.5);
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.stroke();
  ctx.fillStyle = rgba(AMBER, alpha * 0.8);
  ctx.beginPath();
  ctx.moveTo(cx + Math.max(s * 0.004, 1.2), cy);
  ctx.arc(cx, cy, Math.max(s * 0.004, 1.2), 0, TAU);
  ctx.fill();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Twenty-Five Woodworms').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Twenty-Five Woodworms').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 25').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Twenty-Five Woodworms', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 25', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawWood();
  drawPits(phaseT);
  drawAgents(phaseT);
  drawRing(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    agentCount: function () { return AGENTS.length; },
    pitCountAt: function (t) { return pitCountAt(t); },
    ringAlphaAt: function (t) { return ringAlphaAt(t); },
    activityAt: function (t) { return activityAt(t); },
    smoothedActivityAt: function (t) { return smoothedActivityAt(t); },
    agentsOnWood: function (t) {
      var s = Math.min(VW, VH);
      var wc = woodCenter();
      var i, p, dx, dy, th, ok = 0;
      for (i = 0; i < AGENT_N; i++) {
        p = agentPosAt(AGENTS[i], t);
        dx = p.x - wc.x; dy = p.y - wc.y;
        th = Math.atan2(dy, dx);
        if (Math.sqrt(dx * dx + dy * dy) <= woodRadiusAt(th) * s) ok++;
      }
      return ok;
    },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, 750 pits already accumulated ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
