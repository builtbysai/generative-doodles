<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vernacular Triptych</title>
<style>
  html, body { margin: 0; padding: 0; background: #111111; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // №1155 "Vernacular Triptych" — Antonio Roberts study block AR4
  // (What is your glitch?, 2011: his PCX/PPM/PIX vernacular, after
  // Menkman's Vernacular of File Formats). One procedural source —
  // diagonal bars + concentric circles, flat palette on near-black —
  // rendered through three neglected-format pipelines, side by side.
  // Left PCX-like: channels clamped to a coarse palette, then horizontal
  // runs merged RLE-style (short runs absorbed into their neighbour,
  // harder inside the error rectangle, where runs also stretch). Center
  // PPM-like: exact colors, fine cells, but scanlines inside the error
  // rectangle are drawn from displaced source rows — a planar shuffle.
  // Right PIX-like: shape structure sampled fine, chroma sampled in
  // coarse blocks with the R and B channels offset by whole strides, so
  // color fringes and blocks while edges stay put; the error rectangle
  // grows the blocks and the offsets. The error rectangle is one seeded
  // region shared by all three panels. Drag horizontally to scrub the
  // corruption depth 0..1; idle, the depth drifts on a 20 s loop;
  // double-tap reseeds the source geometry and the error region.
  // No offscreen canvas, no ImageData, no real encoders: the source is
  // a function and every pipeline is arithmetic over samples of it.
  // Mechanically distinct from №1147 (same title, Menkman RM4): source,
  // pipelines, and the drag parameter (depth, not band position) differ.

  var TAU = Math.PI * 2;
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

  // ---------- palette ----------
  var DRK = [16, 16, 16];           // #101010
  var MAG = [255, 45, 120];         // #FF2D78
  var CYA = [0, 208, 255];          // #00D0FF
  var YEL = [255, 196, 0];          // #FFC400
  var GROUND = '#111111';
  var GUTTER = '#000000';
  var CHIPS = ['#FF2D78', '#00D0FF', '#FFC400'];

  var cssCache = {};
  function css(c) {
    var k = (c[0] << 16) | (c[1] << 8) | c[2];
    var s = cssCache[k];
    if (!s) { s = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; cssCache[k] = s; }
    return s;
  }
  function keyOf(c) { return (c[0] << 16) | (c[1] << 8) | c[2]; }

  // PCX palette clamp: each channel snapped to a multiple of 85.
  function q85(x) { var q = Math.round(x / 85) * 85; return q > 255 ? 255 : q; }
  function clamped(c) { return [q85(c[0]), q85(c[1]), q85(c[2])]; }
  var CLAMP = {};
  [DRK, MAG, CYA, YEL].forEach(function (c) { CLAMP[keyOf(c)] = clamped(c); });

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash01(n) {
    var x = (n >>> 0) ^ 0x9E3779B9;
    x = Math.imul(x ^ (x >>> 16), 0x21F0AAAD);
    x = Math.imul(x ^ (x >>> 15), 0x735A2D97);
    x = x ^ (x >>> 15);
    return (x >>> 0) / 4294967296;
  }

  // ---------- source geometry, derived from the seed ----------
  var seed = 1155;
  var P = null;
  function regen() {
    var rnd = mulberry32(seed * 7919 + 29);
    var base = [MAG, CYA, YEL];
    var co = Math.floor(rnd() * 3);
    var ang = (38 + rnd() * 16) * Math.PI / 180;
    P = {
      rot: [base[co % 3], base[(co + 1) % 3], base[(co + 2) % 3]],
      cu: 0.32 + rnd() * 0.36,              // circle center, panel fractions
      cv: 0.30 + rnd() * 0.20,
      ang: ang, cosA: Math.cos(ang), sinA: Math.sin(ang),
      barFreq: 26 + rnd() * 10,
      ringW: 0.045 + rnd() * 0.02,
      maxR: 0.30 + rnd() * 0.08,
      ex: 0.08 + rnd() * 0.20,              // shared error rectangle
      ey: 0.24 + rnd() * 0.16,
      ew: 0.50 + rnd() * 0.25,
      eh: 0.34 + rnd() * 0.16
    };
  }
  regen();

  // The source: flat geometric composition. u,v are panel fractions,
  // A = panelW/panelH aspect used to keep the circles circular.
  var SRC = [0, 0, 0];
  function srcRGB(u, v, A) {
    var bx = u * A, by = v;
    var s = (bx * P.cosA + by * P.sinA) * P.barFreq;
    var bi = ((Math.floor(s) % 6) + 6) % 6;
    var col = (bi % 2 === 0) ? P.rot[(bi / 2) | 0] : DRK;
    var dx = bx - P.cu * A, dy = by - P.cv;
    var r = Math.sqrt(dx * dx + dy * dy);
    if (r < P.maxR) {
      var ri = Math.floor(r / P.ringW);
      if (ri === 0) col = P.rot[1];
      else if (ri % 2 === 1) col = P.rot[(((ri - 1) / 2) | 0) % 3];
    }
    SRC[0] = col[0]; SRC[1] = col[1]; SRC[2] = col[2];
    return SRC;
  }
  function inErr(u, v) {
    return u >= P.ex && u <= P.ex + P.ew && v >= P.ey && v <= P.ey + P.eh;
  }

  // ---------- phone detection ----------
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var minScreen = Math.min(sw || 9999, sh || 9999);
  var isPhone = minScreen < 700 || (sh > sw * 1.15 && minScreen < 900);

  // ---------- view / canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, GEO = null;

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }
  function fit() {
    W = viewW(); H = viewH();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var blockH = H * (isPhone ? 0.97 : 0.94);
    var blockW = blockH * 0.75;
    var maxW = W * (isPhone ? 0.97 : 0.94);
    if (blockW > maxW) { blockW = maxW; blockH = blockW / 0.75; }
    var gut = 2;
    var panelW = (blockW - gut * 2) / 3;
    var chipH = clamp(Math.round(blockH * 0.030), 10, 22);
    GEO = {
      blockX: (W - blockW) / 2, blockY: (H - blockH) / 2,
      blockW: blockW, blockH: blockH,
      panelW: panelW, gut: gut,
      chipH: chipH,
      imgY: chipH + 2,                       // image area offset inside a panel
      imgH: blockH - chipH - 2
    };
  }

  // ---------- corruption depth ----------
  // Idle drift: 0.5 + 0.35*sin, 20 s period, phase anchored so the
  // fixed first frame (t = 0) sits at depth 0.55.
  var LOOP = 20;
  var anchorT = 0;
  var anchorPh = Math.asin((0.55 - 0.5) / 0.35);
  function idleDepth(t) {
    return 0.5 + 0.35 * Math.sin(TAU * (t - anchorT) / LOOP + anchorPh);
  }
  var dragging = false;
  var dragDepth = 0.55;
  function depthAt(t) { return dragging ? dragDepth : idleDepth(t); }

  // ---------- shared run renderer ----------
  // colorAt(i, j) returns an [r,g,b] array for cell (i,j) of a cols x rows
  // grid; consecutive equal colors merge into one fillRect per run.
  function drawRuns(px, py, pw, ph, cols, rows, colorAt) {
    var cellW = pw / cols, cellH = ph / rows;
    var runStart = 0, runKey = -1, runCol = null;
    for (var j = 0; j < rows; j++) {
      runStart = 0; runKey = -1; runCol = null;
      for (var i = 0; i <= cols; i++) {
        var col = null, key = -2;
        if (i < cols) { col = colorAt(i, j); key = keyOf(col); }
        if (key !== runKey) {
          if (runCol) {
            ctx.fillStyle = css(runCol);
            ctx.fillRect(px + runStart * cellW, py + j * cellH,
              (i - runStart) * cellW, cellH);
          }
          runStart = i; runKey = key;
          runCol = col ? [col[0], col[1], col[2]] : null;
        }
      }
    }
  }

  // ---------- left panel: PCX-like ----------
  // Coarse cells, palette-clamped colors, RLE run merging: any run at or
  // below a threshold is absorbed into the previous run (which stretches
  // over it). Inside the error rectangle the threshold triples-plus and
  // surviving runs stretch further, stealing cells from the next run.
  function renderPCX(px, py, pw, ph, D) {
    var A = pw / ph;
    var cols = Math.max(10, Math.round(pw / 3));
    var rows = Math.max(10, Math.round(cols * ph / pw));
    var cellW = pw / cols, cellH = ph / rows;
    var tOut = Math.round(D * 3), tIn = Math.round(D * 18);
    var stretch = Math.round(D * 8);
    var runs = [], kept = [];
    for (var j = 0; j < rows; j++) {
      var v = (j + 0.5) / rows;
      runs.length = 0;
      for (var i = 0; i < cols; i++) {
        var c = CLAMP[keyOf(srcRGB((i + 0.5) / cols, v, A))];
        var k = keyOf(c);
        var last = runs[runs.length - 1];
        if (last && last.key === k) last.len++;
        else runs.push({ start: i, len: 1, key: k, col: c });
      }
      kept.length = 0;
      for (var a = 0; a < runs.length; a++) {
        var run = runs[a];
        var midU = (run.start + run.len / 2) / cols;
        var T = inErr(midU, v) ? tIn : tOut;
        var prev = kept[kept.length - 1];
        if (prev && run.len <= T) prev.len += run.len;
        else kept.push({ start: run.start, len: run.len, key: run.key, col: run.col });
      }
      if (stretch > 0) {
        for (var b = 0; b + 1 < kept.length; b++) {
          var kr = kept[b], nx = kept[b + 1];
          var mU = (kr.start + kr.len / 2) / cols;
          if (inErr(mU, v) && nx.len > stretch) {
            kr.len += stretch; nx.start += stretch; nx.len -= stretch;
          }
        }
      }
      for (var d = 0; d < kept.length; d++) {
        var r2 = kept[d];
        ctx.fillStyle = css(r2.col);
        ctx.fillRect(px + r2.start * cellW, py + j * cellH, r2.len * cellW, cellH);
      }
    }
  }

  // ---------- center panel: PPM-like ----------
  // Fine cells, exact palette colors; rows inside the error rectangle
  // sample from a displaced source row (per-row seeded displacement,
  // scope scaled by depth, clamped to the region) — a scanline shuffle.
  function renderPPM(px, py, pw, ph, D) {
    var A = pw / ph;
    var cols = Math.max(12, Math.round(pw / 2));
    var rows = Math.max(12, Math.round(cols * ph / pw));
    var rTop = Math.floor(P.ey * rows);
    var rBot = Math.ceil((P.ey + P.eh) * rows) - 1;
    var maxDisp = D * Math.max(1, rBot - rTop + 1);
    drawRuns(px, py, pw, ph, cols, rows, function (i, j) {
      var u = (i + 0.5) / cols, v = (j + 0.5) / rows;
      if (j >= rTop && j <= rBot && u >= P.ex && u <= P.ex + P.ew) {
        var disp = Math.round((hash01(seed * 1000003 + j) - 0.5) * 2 * maxDisp);
        var sj = clamp(j + disp, rTop, rBot);
        return srcRGB(u, (sj + 0.5) / rows, A);
      }
      return srcRGB(u, v, A);
    });
  }

  // ---------- right panel: PIX-like ----------
  // Structure sampled at full rate (a cell is lit only where the source
  // is lit), but its color comes from coarse chroma blocks: R from the
  // block a stride to the right, G from its own block, B from a stride
  // to the left. Depth grows block size and stride; inside the error
  // rectangle both grow further. Block samples are cached per render.
  function renderPIX(px, py, pw, ph, D) {
    var A = pw / ph;
    var cols = Math.max(12, Math.round(pw / 2));
    var rows = Math.max(12, Math.round(cols * ph / pw));
    var cbOut = 2 + Math.round(D * 3);
    var cbIn = cbOut + 2 + Math.round(D * 3);
    var offOut = Math.round(D * cbOut);
    var offIn = Math.round(D * cbIn * 1.5);
    var cache = {};
    function blockCol(bx, by, cb) {
      bx = clamp(bx, 0, Math.ceil(cols / cb) - 1);
      by = clamp(by, 0, Math.ceil(rows / cb) - 1);
      var k = cb + ':' + bx + ':' + by;
      var c = cache[k];
      if (!c) {
        var s = srcRGB(((bx + 0.5) * cb) / cols, ((by + 0.5) * cb) / rows, A);
        c = [s[0], s[1], s[2]];
        cache[k] = c;
      }
      return c;
    }
    drawRuns(px, py, pw, ph, cols, rows, function (i, j) {
      var u = (i + 0.5) / cols, v = (j + 0.5) / rows;
      var fine = srcRGB(u, v, A);
      if (fine[0] === DRK[0] && fine[1] === DRK[1] && fine[2] === DRK[2]) return DRK;
      var inE = inErr(u, v);
      var cb = inE ? cbIn : cbOut;
      var off = inE ? offIn : offOut;
      var by = Math.floor(j / cb);
      var rC = blockCol(Math.floor((i + off) / cb), by, cb);
      var gC = blockCol(Math.floor(i / cb), by, cb);
      var bC = blockCol(Math.floor((i - off) / cb), by, cb);
      var out = [rC[0], gC[1], bC[2]];
      if (out[0] === DRK[0] && out[1] === DRK[1] && out[2] === DRK[2]) return gC;
      return out;
    });
  }

  // ---------- draw ----------
  function draw(t) {
    fit();
    var g = GEO;
    var D = depthAt(t);

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = GUTTER;
    ctx.fillRect(g.blockX - g.gut, g.blockY - g.gut,
      g.blockW + g.gut * 2, g.blockH + g.gut * 2);

    var px = [g.blockX,
              g.blockX + g.panelW + g.gut,
              g.blockX + 2 * (g.panelW + g.gut)];
    var py = g.blockY + g.imgY;

    renderPCX(px[0], py, g.panelW, g.imgH, D);
    renderPPM(px[1], py, g.panelW, g.imgH, D);
    renderPIX(px[2], py, g.panelW, g.imgH, D);

    // identification chips — color strips at each panel top, no labels
    for (var i = 0; i < 3; i++) {
      ctx.fillStyle = CHIPS[i];
      ctx.fillRect(px[i], g.blockY, g.panelW, g.chipH);
    }
  }

  // ---------- interaction ----------
  var lastT = 0;
  var pDown = null;         // {x, y, ms}
  var lastDownMs = -1000, lastDownX = 0, lastDownY = 0;
  var suppressDrag = false; // second tap of a double-tap: do not scrub

  function nowMs() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  }
  function depthFromX(x) {
    return clamp((x - GEO.blockX) / GEO.blockW, 0, 1);
  }
  function onDown(e) {
    if (!e) return;
    var x = e.clientX || 0, y = e.clientY || 0;
    var ms = nowMs();
    suppressDrag = false;
    if (ms - lastDownMs < 350 &&
        Math.abs(x - lastDownX) < 24 && Math.abs(y - lastDownY) < 24) {
      // double-tap: reseed the source geometry and the error region
      seed++;
      regen();
      suppressDrag = true;
      dragging = false;
    }
    lastDownMs = ms; lastDownX = x; lastDownY = y;
    pDown = { x: x, y: y, ms: ms };
  }
  function onMove(e) {
    if (!pDown || !e) return;
    var x = e.clientX || 0;
    // scrubbing engages only once the press becomes a real drag
    if (!suppressDrag && (dragging || Math.abs(x - pDown.x) > 6)) {
      dragging = true;
      dragDepth = depthFromX(x);
      draw(lastT);
    }
  }
  function onUp(e) {
    if (!pDown) return;
    if (dragging) {
      // hand depth back to the idle drift, re-anchored so it cannot jump
      anchorT = lastT;
      anchorPh = Math.asin(clamp((dragDepth - 0.5) / 0.35, -1, 1));
      dragging = false;
    }
    pDown = null;
    suppressDrag = false;
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  draw(0);

  var startStamp = null;
  function frame(stamp) {
    if (startStamp === null) startStamp = stamp;
    var t = (stamp - startStamp) / 1000;
    lastT = t;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
