<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9000 · Interruptions — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14120d;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 600px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #a33b2e; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #f3edde;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #a33b2e; text-decoration: none; }
  /* thumbnail mode: exact 720x720 stage, no chrome */
  body.thumb-mode { padding: 0; justify-content: flex-start; }
  body.thumb-mode header, body.thumb-mode footer { display: none; }
  body.thumb-mode #stage { width: 720px; height: 720px; box-shadow: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9000</span> · Interruptions</h1>
  <p>A dense weave of short ink dashes, every one the same length, each turned
  at random. Then whole regions erased back to paper. The holes are the
  drawing. <b>Click the piece for a new variation.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 196819;
if (params.get("thumb")) document.body.classList.add("thumb-mode");

const PAPER = "#f3edde";
const INK = "#241e15";
const TAU = Math.PI * 2;
const VU = 1000;

// ---------- seeded composition ----------
const rnd = mulberry32(seed);
const step = 30 + rnd() * 8;                 // dash lattice spacing
const dashLen = step * (0.70 + rnd() * 0.22);// equal-length dashes
const lineW = 2.6 + rnd() * 0.9;             // constant pen weight per piece
const jitter = step * (0.10 + rnd() * 0.08);

// the hidden shape: circle, diagonal band, or crescent
const shapeKind = (rnd() * 3) | 0;
const shape = {};
if (shapeKind === 0){
  shape.kind = "circle";
  shape.cx = 380 + rnd() * 240;
  shape.cy = 380 + rnd() * 240;
  shape.r = 180 + rnd() * 80;
} else if (shapeKind === 1){
  shape.kind = "band";
  shape.cx = 500; shape.cy = 500;
  shape.ang = Math.PI / 4 + (rnd() - 0.5) * 0.5;
  shape.w = 130 + rnd() * 60;
  shape.off = (rnd() - 0.5) * 160;
} else {
  shape.kind = "crescent";
  shape.ax = 400 + rnd() * 200; shape.ay = 400 + rnd() * 200;
  shape.ar = 190 + rnd() * 70;
  const ba = rnd() * TAU, bd = 90 + rnd() * 60;
  shape.bx = shape.ax + Math.cos(ba) * bd;
  shape.by = shape.ay + Math.sin(ba) * bd;
  shape.br = shape.ar * (0.95 + rnd() * 0.25);
}
function inVoid(x, y){
  if (shape.kind === "circle"){
    const dx = x - shape.cx, dy = y - shape.cy;
    return dx * dx + dy * dy < shape.r * shape.r;
  }
  if (shape.kind === "band"){
    const dx = x - shape.cx, dy = y - shape.cy;
    const d = dx * Math.cos(shape.ang) + dy * Math.sin(shape.ang);
    return Math.abs(d - shape.off) < shape.w / 2;
  }
  const dax = x - shape.ax, day = y - shape.ay;
  const dbx = x - shape.bx, dby = y - shape.by;
  return (dax * dax + day * day < shape.ar * shape.ar) &&
         (dbx * dbx + dby * dby > shape.br * shape.br);
}

// ---------- render ----------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
function draw(){
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  const S = canvas.width / VU;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VU, VU);
  ctx.strokeStyle = INK;
  ctx.lineWidth = lineW;
  ctx.lineCap = "butt";

  const r2 = mulberry32(seed ^ 0x51ab);
  for (let gy = step / 2; gy < VU; gy += step){
    for (let gx = step / 2; gx < VU; gx += step){
      const x = gx + (r2() * 2 - 1) * jitter;
      const y = gy + (r2() * 2 - 1) * jitter;
      if (inVoid(x, y)) continue;            // erasure: the void is the figure
      const a = r2() * TAU;
      const dx = Math.cos(a) * dashLen / 2, dy = Math.sin(a) * dashLen / 2;
      ctx.beginPath();
      ctx.moveTo(x - dx, y - dy);
      ctx.lineTo(x + dx, y + dy);
      ctx.stroke();
    }
  }

  // plotter frame: double hairline
  ctx.strokeStyle = INK; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.4;
  ctx.strokeRect(40, 40, VU - 80, VU - 80);
  ctx.globalAlpha = 0.28; ctx.lineWidth = 1;
  ctx.strokeRect(52, 52, VU - 104, VU - 104);
  ctx.globalAlpha = 1;

  // paper grain + faint vignette
  const gr = mulberry32(seed ^ 0x9e3779b9);
  ctx.fillStyle = "rgba(60,50,36,0.05)";
  for (let i = 0; i < 900; i++){
    ctx.fillRect(gr() * VU, gr() * VU, 1.6, 1.6);
  }
  const vg = ctx.createRadialGradient(500, 500, 380, 500, 500, 780);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(74,64,46,0.10)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VU, VU);
}

draw();
window.addEventListener("resize", draw);

document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  location.reload();
});
</script>
</body>
</html>
