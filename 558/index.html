<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un Poco de Costumbrismo</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EAC97E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: the prompt's specced hexes first, then flat supporting domestic
  // tones (skin, hair, terracotta, leaf, mask, blanket). Flat fills, no gradients.
  var INK = '#1A1A1A', TAN = '#EAC97E', PAGE = '#F9F1DC',
      TEAL = '#4EA8A0', CHEESE = '#F2B230', HOODIE = '#F06AA8',
      GLOW = '#7AB8E0', SPINE_RED = '#D93A2B', FRY = '#E8A830',
      EGG = '#F2D230', WHITE = '#FFFFFF',
      SKIN = '#F2C09A', HAIR = '#6A4A3A', TERRA = '#C96F4A',
      LEAF = '#4EA85A', MASK = '#DDE8E4', ROSE = '#EFC9C0',
      CAKE = '#F6D9B8', CHECK = '#3E7A3E';

  var PHASE0 = 2.3;      // constant first-frame phase
  var LOOP = 8;          // shared loop clock, seconds
  var DW = 1080, DH = 1440; // portrait design space
  var MARGIN = 36, GUT = 28;
  var PW = 490, PH = 251;   // panel size (2 cols x 5 rows)
  var SCENE_H = 181, STRIP_H = PH - SCENE_H; // scene / caption split

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(558067);
  function mod(a, n) { return ((a % n) + n) % n; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, k) { return a + (b - a) * k; }

  // ---- small canvas helpers ----
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function fillStroke(fill, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function line(x1, y1, x2, y2, w, color) {
    ctx.strokeStyle = color || INK; ctx.lineWidth = w || 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  // jittered rectangle path (deterministic per seed), for hand-drawn boxes
  function wobblyRect(x, y, w, h, seed, jit) {
    var r = mulberry32(seed);
    var pts = [], i, n = 5;
    for (i = 0; i <= n; i++) pts.push([x + (w * i) / n, y + (r() - 0.5) * jit]);
    for (i = 1; i <= n; i++) pts.push([x + w + (r() - 0.5) * jit, y + (h * i) / n]);
    for (i = 1; i <= n; i++) pts.push([x + w - (w * i) / n, y + h + (r() - 0.5) * jit]);
    for (i = 1; i < n; i++) pts.push([x + (r() - 0.5) * jit, y + h - (h * i) / n]);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  // ---- wobbly hand-lettered text: layout precomputed once, deterministic ----
  var FONT_STACK = '"Comic Sans MS", "Chalkboard SE", "Arial Rounded MT Bold", "DejaVu Sans", sans-serif';
  function layoutText(text, size, maxW, seed) {
    var font = '700 ' + size + 'px ' + FONT_STACK;
    ctx.font = font;
    var words = text.split(' '), lines = [], cur = '', i, j;
    for (i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width <= maxW || !cur) cur = test;
      else { lines.push(cur); cur = words[i]; }
    }
    if (cur) lines.push(cur);
    var r = mulberry32(seed);
    var out = [];
    for (i = 0; i < lines.length; i++) {
      var letters = [], x = 0;
      for (j = 0; j < lines[i].length; j++) {
        var ch = lines[i][j], w = ctx.measureText(ch).width;
        letters.push({ ch: ch, cx: x + w / 2, w: w, rot: (r() - 0.5) * 0.10, dy: (r() - 0.5) * 3.0 });
        x += w + 0.4;
      }
      out.push({ letters: letters, width: x });
    }
    return { font: font, size: size, lines: out, lineHeight: size * 1.34 };
  }
  function drawLayout(lay, cx, cy, color) {
    ctx.font = lay.font;
    ctx.fillStyle = color || INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    var blockH = lay.lines.length * lay.lineHeight;
    var topY = cy - blockH / 2 + lay.size * 0.94;
    for (var i = 0; i < lay.lines.length; i++) {
      var ln = lay.lines[i], baseY = topY + i * lay.lineHeight, x0 = cx - ln.width / 2;
      for (var j = 0; j < ln.letters.length; j++) {
        var L = ln.letters[j];
        ctx.save();
        ctx.translate(x0 + L.cx, baseY + L.dy);
        ctx.rotate(L.rot);
        ctx.fillText(L.ch, 0, 0);
        ctx.restore();
      }
    }
  }
  function fitLayout(text, sizes, maxW, maxLines, seed) {
    for (var i = 0; i < sizes.length; i++) {
      var lay = layoutText(text, sizes[i], maxW, seed);
      if (lay.lines.length <= maxLines) return lay;
    }
    return lay;
  }

  // ---- panel geometry ----
  function panelRect(i) {
    var col = i % 2, row = Math.floor(i / 2);
    return { x: MARGIN + col * (PW + GUT), y: MARGIN + row * (PH + GUT), w: PW, h: PH };
  }
  var PANEL_BG = ['#F7EDD8', '#F9E7C9', '#F3DFC8', '#F7EDD8', '#EFDCD2',
                  '#F9E7C9', '#F3E3CF', '#EFE3D6', '#F7EDD8', '#E7EAD2'];

  var CAPTIONS = [
    'Khaleesi',
    'babe are you ok?',
    'fake scenario',
    'PLANAZO',
    '¿QUÉ ESTOY HACIENDO CON MI VIDA?',
    'combo tía frívola',
    'sin leer desde 2019',
    'llorando con Rosalía',
    'cena de campeones',
    'terapia de plantas'
  ];
  var CAP_LAYS = [];
  for (var ci = 0; ci < CAPTIONS.length; ci++) {
    CAP_LAYS.push(fitLayout(CAPTIONS[ci], [31, 27, 23, 20], PW - 36, 2, 558100 + ci * 7));
  }

  // ---- precomputed micro-loop data (seeded, drawn directly each frame) ----
  function makePuffs(n, seed) {
    var r = mulberry32(seed), out = [];
    for (var i = 0; i < n; i++) out.push({ off: r(), dx: (r() - 0.5) * 16, r: 6 + r() * 7 });
    return out;
  }
  var BATH_STEAM = makePuffs(6, 558201);
  var CAN_FIZZ = makePuffs(7, 558202);
  var FRY_STEAM = makePuffs(4, 558203);
  var WATER_DROPS = makePuffs(5, 558204);
  var TEAR_SEED = 0.35;
  var NOTES = [{ off: 0.0 }, { off: 0.5 }];

  // steam puffs rising in a column: x base, from y0 up range px over period sec
  function drawSteam(puffs, x, y0, range, period, t, color) {
    for (var i = 0; i < puffs.length; i++) {
      var p = puffs[i];
      var ph = mod(t / period + p.off, 1);
      var y = y0 - ph * range;
      var xx = x + p.dx + Math.sin(ph * 5 + p.off * 9) * 4;
      ctx.globalAlpha = 0.55 * (1 - ph) + 0.08;
      ctx.fillStyle = color;
      circ(xx, y, p.r * (0.7 + ph * 0.7)); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function sparkle(x, y, r, on) {
    if (!on) return;
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.28, y - r * 0.28); ctx.lineTo(x + r, y);
    ctx.lineTo(x + r * 0.28, y + r * 0.28); ctx.lineTo(x, y + r);
    ctx.lineTo(x - r * 0.28, y + r * 0.28); ctx.lineTo(x - r, y);
    ctx.lineTo(x - r * 0.28, y - r * 0.28);
    ctx.closePath(); ctx.fill();
  }

  // ================= SCENES (local space: 490 x 181) =================

  // 1. the 200-degree bath
  function sceneBath(t) {
    line(24, 44, 466, 44, 3, '#DCC7A0'); line(24, 130, 466, 130, 3, '#DCC7A0');
    drawSteam(BATH_STEAM, 245, 64, 50, 2.4, t, WHITE);
    // tub body
    ctx.beginPath();
    ctx.moveTo(72, 84); ctx.quadraticCurveTo(88, 148, 118, 152);
    ctx.lineTo(372, 152); ctx.quadraticCurveTo(402, 148, 418, 84);
    ctx.closePath(); fillStroke(WHITE, 5);
    line(120, 152, 120, 164, 6); line(370, 152, 370, 164, 6);
    ell(245, 84, 176, 24); fillStroke(WHITE, 5);
    ell(245, 82, 160, 17); ctx.fillStyle = TEAL; ctx.fill();
    // water shimmer, 2-frame
    var sh = (Math.floor(t * 2) % 2) * 7;
    ctx.strokeStyle = WHITE; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(150 + sh, 80); ctx.lineTo(205 + sh, 80); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(268 - sh, 88); ctx.lineTo(330 - sh, 88); ctx.stroke();
    // rubber duck on the rim
    ctx.save(); ctx.translate(392, 62);
    ell(0, 0, 17, 11); fillStroke(EGG, 3.5);
    circ(11, -10, 8.5); fillStroke(EGG, 3.5);
    ctx.beginPath(); ctx.moveTo(17, -10); ctx.lineTo(27, -7); ctx.lineTo(17, -4); ctx.closePath();
    ctx.fillStyle = FRY; ctx.fill();
    circ(12, -11, 1.8); ctx.fillStyle = INK; ctx.fill();
    ctx.restore();
    // 200°C tag
    wobblyRect(372, 10, 102, 42, 558301, 3); fillStroke(WHITE, 4);
    drawLayout(TAG_LAY, 423, 31, SPINE_RED);
  }

  // 2. the half-eaten Tanjiro cake
  function sceneCake(t) {
    line(28, 160, 462, 160, 4);
    ell(195, 150, 122, 14); fillStroke(WHITE, 4);
    // cake body + checker band
    ctx.beginPath(); ctx.rect(105, 92, 180, 54); ctx.fillStyle = CAKE; ctx.fill();
    var bx, sq = 18;
    for (bx = 105; bx < 285; bx += sq) {
      ctx.fillStyle = ((bx - 105) / sq) % 2 ? INK : CHECK;
      ctx.fillRect(bx, 118, Math.min(sq, 285 - bx), 28);
    }
    ctx.beginPath(); ctx.rect(105, 92, 180, 54); ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    ell(195, 92, 90, 15); fillStroke(WHITE, 4.5);
    circ(195, 90, 7); ctx.fillStyle = SPINE_RED; ctx.fill(); // forehead-mark dot
    // cut wedge showing the strata
    ctx.beginPath();
    ctx.moveTo(195, 92); ctx.lineTo(285, 100); ctx.lineTo(285, 146); ctx.lineTo(218, 146);
    ctx.closePath(); fillStroke(WHITE, 4.5);
    line(232, 112, 285, 106, 4, SPINE_RED); line(226, 128, 285, 124, 4, SPINE_RED);
    // icing drip, 2-frame growth
    var dl = (Math.floor(t / 0.8) % 2) ? 17 : 9;
    ctx.fillStyle = WHITE;
    ctx.fillRect(146, 100, 9, dl); circ(150.5, 100 + dl, 4.5); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(146, 100); ctx.lineTo(146, 100 + dl); ctx.stroke();
    // fork resting on the right
    ctx.save(); ctx.translate(356, 118); ctx.rotate(0.5);
    line(0, -26, 0, 26, 6.5);
    line(-8, -40, -8, -24, 3.5); line(0, -42, 0, -24, 3.5); line(8, -40, 8, -24, 3.5);
    ctx.restore();
    // crumbs
    circ(318, 156, 3.5); ctx.fillStyle = INK; ctx.fill();
    circ(332, 150, 2.6); ctx.fill();
    circ(88, 154, 3); ctx.fill();
    sparkle(392, 52, 11, Math.floor(t) % 2 === 0);
  }

  // 3. the fake-scenario soda can
  function sceneCan(t) {
    ell(245, 162, 86, 10); ctx.fillStyle = INK; ctx.globalAlpha = 0.14; ctx.fill(); ctx.globalAlpha = 1;
    // fizz bubbles on both sides
    for (var i = 0; i < CAN_FIZZ.length; i++) {
      var p = CAN_FIZZ[i], ph = mod(t / 1.6 + p.off, 1);
      var bx2 = (i % 2 ? 350 : 140) + p.dx;
      var by = 158 - ph * 126;
      ctx.globalAlpha = (1 - ph) * 0.75 + 0.1;
      circ(bx2, by, 3 + p.r * 0.45); fillStroke(WHITE, 2.5);
    }
    ctx.globalAlpha = 1;
    // can
    ctx.beginPath();
    ctx.moveTo(192, 36); ctx.lineTo(298, 36); ctx.lineTo(293, 154); ctx.lineTo(197, 154);
    ctx.closePath(); fillStroke(SPINE_RED, 5);
    ell(245, 36, 48, 9); fillStroke(WHITE, 4);
    ctx.fillStyle = INK; ctx.fillRect(238, 30, 14, 6);
    // label
    ctx.fillStyle = WHITE; ctx.fillRect(198, 74, 94, 50);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.strokeRect(198, 74, 94, 50);
    drawLayout(CAN_LAY, 245, 99, INK);
    line(202, 140, 288, 140, 3, WHITE);
  }

  // 4. nachos + cartoon
  function sceneNachos(t) {
    line(24, 160, 466, 160, 4);
    // TV
    line(330, 30, 300, 8, 4); line(382, 30, 412, 8, 4);
    wobblyRect(282, 28, 180, 114, 558304, 4); fillStroke(INK, 5);
    ctx.fillStyle = TAN; ctx.fillRect(295, 41, 154, 82);
    // cartoon cat face, 2-frame expression swap
    var fr = Math.floor(t) % 2;
    ctx.save(); ctx.translate(372, 82);
    ctx.beginPath(); ctx.moveTo(-24, -18); ctx.lineTo(-18, -36); ctx.lineTo(-4, -24); ctx.closePath();
    ctx.moveTo(24, -18); ctx.lineTo(18, -36); ctx.lineTo(4, -24); ctx.closePath();
    fillStroke(EGG, 3.5);
    circ(0, 0, 29); fillStroke(EGG, 4);
    if (fr === 0) {
      circ(-10, -3, 3); ctx.fillStyle = INK; ctx.fill();
      circ(10, -3, 3); ctx.fill();
      line(-6, 12, 6, 12, 3.5);
    } else {
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(-10, 0, 5, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
      ctx.beginPath(); ctx.arc(10, 0, 5, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
      ell(0, 11, 6, 7.5); ctx.fillStyle = INK; ctx.fill();
    }
    ctx.restore();
    line(330, 142, 330, 158, 5); line(414, 142, 414, 158, 5);
    // nacho plate
    ell(140, 146, 106, 15); fillStroke(WHITE, 4);
    var chips = [[92, 118, 0.3], [128, 104, -0.4], [164, 112, 0.7], [110, 130, 1.2], [150, 128, -1.0], [186, 124, 0.2]];
    for (var i = 0; i < chips.length; i++) {
      ctx.save(); ctx.translate(chips[i][0], chips[i][1]); ctx.rotate(chips[i][2]);
      ctx.beginPath(); ctx.moveTo(-19, 12); ctx.lineTo(0, -16); ctx.lineTo(19, 12); ctx.closePath();
      fillStroke(FRY, 3.5);
      ctx.restore();
    }
    ell(126, 114, 24, 9); ctx.fillStyle = CHEESE; ctx.fill();
    ell(164, 124, 19, 7); ctx.fill();
    var topChips = [[140, 118, 0.5], [102, 122, -0.6]];
    for (var ti2 = 0; ti2 < topChips.length; ti2++) {
      ctx.save(); ctx.translate(topChips[ti2][0], topChips[ti2][1]); ctx.rotate(topChips[ti2][2]);
      ctx.beginPath(); ctx.moveTo(-17, 11); ctx.lineTo(0, -14); ctx.lineTo(17, 11); ctx.closePath();
      fillStroke(FRY, 3.5);
      ctx.restore();
    }
    // cheese drip off the plate edge, 2-frame
    var cd = (Math.floor(t / 0.7) % 2) ? 19 : 11;
    ctx.fillStyle = CHEESE; ctx.fillRect(112, 140, 10, cd); circ(117, 140 + cd, 5); ctx.fill();
  }

  // 5. DOJA hoodie + face mask
  function sceneDoja(t) {
    wobblyRect(30, 18, 92, 118, 558305, 4); fillStroke(ROSE, 4);
    sparkle(76, 76, 15, true);
    wobblyRect(368, 26, 88, 66, 558306, 4); fillStroke(GLOW, 4);
    line(384, 74, 440, 44, 3.5, WHITE);
    // hood behind head
    circ(245, 92, 76); fillStroke(HOODIE, 5);
    // face
    circ(245, 96, 53); fillStroke(SKIN, 4.5);
    // tired eyes / blink
    var blink = mod(t, 3.2) < 0.14;
    if (blink) {
      line(214, 88, 232, 88, 4); line(258, 88, 276, 88, 4);
    } else {
      ell(223, 88, 10, 6); fillStroke(WHITE, 3);
      ell(267, 88, 10, 6); fillStroke(WHITE, 3);
      circ(223, 89, 3); ctx.fillStyle = INK; ctx.fill();
      circ(267, 89, 3); ctx.fill();
      line(212, 76, 234, 79, 4); line(256, 79, 278, 76, 4); // heavy lids
    }
    // mask
    wobblyRect(204, 106, 82, 42, 558307, 2.5); fillStroke(MASK, 4);
    line(204, 112, 196, 100, 3); line(286, 112, 294, 100, 3);
    line(214, 120, 276, 120, 2.5, WHITE); line(214, 132, 276, 132, 2.5, WHITE);
    // shoulders / chest over the hood's lower edge
    ctx.beginPath();
    ctx.moveTo(148, 181); ctx.quadraticCurveTo(170, 152, 245, 150);
    ctx.quadraticCurveTo(320, 152, 342, 181); ctx.closePath();
    fillStroke(HOODIE, 5);
    drawLayout(DOJA_LAY, 245, 163, WHITE);
    // hood strings
    line(226, 140, 224, 158, 3.5, WHITE); line(264, 140, 266, 158, 3.5, WHITE);
    circ(224, 160, 3.5); ctx.fillStyle = WHITE; ctx.fill();
    circ(266, 160, 3.5); ctx.fill();
  }

  // 6. the show + salad combo
  function drawLaptop(cx, topY, w, h) {
    wobblyRect(cx - w / 2, topY, w, h, 558310, 3.5); fillStroke(INK, 5);
    ctx.fillStyle = GLOW; ctx.fillRect(cx - w / 2 + 9, topY + 9, w - 18, h - 18);
  }
  function sceneCombo(t) {
    line(24, 160, 466, 160, 4);
    drawLaptop(215, 40, 190, 100);
    // little posters on the show screen
    ctx.fillStyle = WHITE;
    ctx.fillRect(140, 56, 34, 44); ctx.fillRect(184, 56, 34, 44);
    ctx.fillRect(228, 56, 34, 44); ctx.fillRect(272, 56, 20, 44);
    ctx.beginPath(); ctx.moveTo(196, 116); ctx.lineTo(196, 128); ctx.lineTo(208, 122); ctx.closePath();
    ctx.fillStyle = INK; ctx.fill();
    // glow flicker, 2-frame
    ctx.globalAlpha = (Math.floor(t * 2) % 2) ? 0.05 : 0.13;
    ctx.fillStyle = WHITE; ctx.fillRect(129, 49, 172, 82);
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.moveTo(120, 140); ctx.lineTo(310, 140); ctx.lineTo(326, 156); ctx.lineTo(104, 156);
    ctx.closePath(); fillStroke(INK, 4.5);
    // salad bowl
    ctx.beginPath(); ctx.arc(398, 132, 52, 0.15 * Math.PI, 0.85 * Math.PI); ctx.closePath();
    fillStroke(WHITE, 4.5);
    ell(398, 132, 52, 9); ctx.fillStyle = LEAF; ctx.fill();
    var leaves = [[368, 122], [392, 112], [420, 120], [382, 128], [408, 130]];
    for (var i = 0; i < leaves.length; i++) { circ(leaves[i][0], leaves[i][1], 11); fillStroke(LEAF, 3); }
    circ(398, 120, 9); fillStroke(SPINE_RED, 3);
    // fork bobbing in the salad, 2-frame
    var bob = (Math.floor(t / 0.9) % 2) ? 0 : -5;
    line(428, 84 + bob, 414, 118 + bob, 4.5);
    line(414, 118 + bob, 408, 108 + bob, 3); line(414, 118 + bob, 420, 108 + bob, 3);
  }

  // 7. the manga stack of shame
  function sceneManga(t) {
    line(24, 160, 466, 160, 4);
    // bottom book: white spine, red band
    ctx.fillStyle = WHITE; ctx.fillRect(108, 130, 274, 27);
    ctx.fillStyle = SPINE_RED; ctx.fillRect(108, 130, 30, 27);
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.strokeRect(108, 130, 274, 27);
    drawLayout(MANGA2_LAY, 262, 144, INK);
    // middle book: black spine
    ctx.fillStyle = INK; ctx.fillRect(120, 102, 250, 27);
    drawLayout(MANGA1_LAY, 245, 116, WHITE);
    // top book: red, plain but for a star
    ctx.fillStyle = SPINE_RED; ctx.fillRect(132, 74, 226, 27);
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.strokeRect(132, 74, 226, 27);
    sparkle(245, 87, 9, true);
    // bookmark ribbon swaying from the middle book
    ctx.save(); ctx.translate(370, 106); ctx.rotate(Math.sin(t * 1.5) * 0.09);
    ctx.fillStyle = CHEESE;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(13, 0); ctx.lineTo(13, 40); ctx.lineTo(6.5, 32); ctx.lineTo(0, 40);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();
    sparkle(404, 48, 11, Math.floor(t) % 2 === 0);
    sparkle(84, 66, 8, Math.floor(t) % 2 === 1);
  }

  // 8. crying to Rosalía in bed
  function sceneBed(t) {
    ctx.fillStyle = HAIR; ctx.fillRect(34, 58, 28, 104);
    ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.strokeRect(34, 58, 28, 104);
    ctx.fillStyle = WHITE; ctx.fillRect(34, 136, 422, 26);
    ctx.strokeStyle = INK; ctx.strokeRect(34, 136, 422, 26);
    // blanket mound
    ctx.beginPath();
    ctx.moveTo(176, 138); ctx.quadraticCurveTo(300, 82, 456, 118); ctx.lineTo(456, 138);
    ctx.closePath(); fillStroke(ROSE, 4.5);
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(250, 116); ctx.quadraticCurveTo(310, 100, 372, 112); ctx.stroke();
    // pillow + head
    wobblyRect(64, 92, 122, 46, 558308, 3); fillStroke(WHITE, 4);
    circ(142, 102, 31); fillStroke(SKIN, 4);
    ctx.beginPath(); ctx.arc(142, 102, 31, Math.PI * 0.92, Math.PI * 2.02); ctx.closePath();
    ctx.fillStyle = HAIR; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(150, 104, 6, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); // shut eye
    line(146, 120, 158, 120, 3.5); // flat sad mouth
    // tears, staggered drops
    for (var ti = 0; ti < 2; ti++) {
      var ph = mod(t / 1.1 + TEAR_SEED + ti * 0.45, 1);
      ctx.globalAlpha = (1 - ph) * 0.9;
      ell(156 + ti * 5, 110 + ph * 24, 3.4, 5); ctx.fillStyle = GLOW; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ell(168, 134, 12, 3.5); ctx.fillStyle = GLOW; ctx.globalAlpha = 0.35; ctx.fill(); ctx.globalAlpha = 1;
    // arm up holding the phone
    line(206, 122, 224, 92, 10, SKIN);
    ctx.save(); ctx.translate(232, 78); ctx.rotate(-0.28);
    ctx.fillStyle = INK; ctx.fillRect(-11, -21, 22, 42);
    ctx.fillStyle = GLOW; ctx.fillRect(-8, -17, 16, 30);
    ctx.restore();
    // music notes floating off the phone
    for (var ni = 0; ni < NOTES.length; ni++) {
      var np = mod(t / 2.2 + NOTES[ni].off, 1);
      var nx = 262 + np * 52, ny = 72 - np * 36;
      ctx.globalAlpha = (1 - np) * 0.95;
      ctx.fillStyle = INK;
      ell(nx, ny, 5.5, 4); ctx.fill();
      ctx.fillRect(nx + 4.5, ny - 17, 3, 17);
      ell(nx + 13, ny - 15, 4.5, 3.4); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // tissue box
    ctx.fillStyle = GLOW; ctx.fillRect(388, 126, 62, 30);
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.strokeRect(388, 126, 62, 30);
    ctx.beginPath();
    ctx.moveTo(406, 126); ctx.quadraticCurveTo(416, 104, 424, 124);
    ctx.quadraticCurveTo(430, 108, 434, 126); ctx.closePath();
    fillStroke(WHITE, 3);
  }

  // 9. Evangelion + fries + fried eggs
  function sceneEva(t) {
    line(24, 162, 466, 162, 4);
    drawLaptop(215, 34, 196, 102);
    // mecha head silhouette on the screen
    ctx.beginPath();
    ctx.moveTo(172, 122); ctx.lineTo(168, 70); ctx.lineTo(184, 52); ctx.lineTo(199, 28);
    ctx.lineTo(205, 52); ctx.lineTo(224, 58); ctx.lineTo(230, 122); ctx.closePath();
    ctx.fillStyle = INK; ctx.fill();
    line(182, 82, 196, 82, 4.5, FRY); line(204, 82, 218, 82, 4.5, FRY);
    drawLayout(EVA_LAY, 270, 122, WHITE);
    ctx.globalAlpha = (Math.floor(t * 2) % 2) ? 0.04 : 0.10;
    ctx.fillStyle = WHITE; ctx.fillRect(126, 43, 178, 84);
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.moveTo(120, 136); ctx.lineTo(310, 136); ctx.lineTo(326, 152); ctx.lineTo(104, 152);
    ctx.closePath(); fillStroke(INK, 4.5);
    // fries in front, steaming
    drawSteam(FRY_STEAM, 102, 86, 30, 1.8, t, WHITE);
    var fries = [[76, -0.14], [90, 0.06], [103, -0.05], [116, 0.12], [128, -0.1]];
    for (var i = 0; i < fries.length; i++) {
      ctx.save(); ctx.translate(fries[i][0], 104); ctx.rotate(fries[i][1]);
      ctx.fillStyle = FRY; ctx.fillRect(-5, -22, 10, 30);
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.strokeRect(-5, -22, 10, 30);
      ctx.restore();
    }
    ctx.beginPath();
    ctx.moveTo(66, 112); ctx.lineTo(140, 112); ctx.lineTo(132, 158); ctx.lineTo(74, 158);
    ctx.closePath(); fillStroke(SPINE_RED, 4.5);
    ell(103, 128, 13, 9); ctx.fillStyle = WHITE; ctx.fill();
    // fried eggs
    ell(376, 150, 98, 13); fillStroke(WHITE, 4);
    ell(350, 141, 35, 11); fillStroke(WHITE, 3);
    ell(404, 143, 29, 10); fillStroke(WHITE, 3);
    circ(350, 139, 10.5); fillStroke(EGG, 3);
    circ(404, 141, 9); fillStroke(EGG, 3);
  }

  // 10. plant therapy (fly's invention, in her spirit)
  function scenePlants(t) {
    line(24, 163, 466, 163, 4);
    // the person
    circ(118, 60, 25); fillStroke(SKIN, 4);
    ctx.beginPath(); ctx.arc(118, 60, 25, Math.PI * 0.95, Math.PI * 2.05); ctx.closePath();
    ctx.fillStyle = HAIR; ctx.fill();
    circ(110, 62, 2.4); ctx.fillStyle = INK; ctx.fill();
    circ(126, 62, 2.4); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(118, 68, 6, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(88, 163); ctx.lineTo(92, 94); ctx.quadraticCurveTo(118, 84, 144, 94);
    ctx.lineTo(148, 163); ctx.closePath(); fillStroke(TEAL, 4.5);
    line(144, 102, 198, 94, 11, TEAL); // sleeve arm reaching out
    circ(200, 93, 7.5); fillStroke(SKIN, 3);
    // watering can
    wobblyRect(206, 80, 58, 36, 558309, 3); fillStroke(TERRA, 4.5);
    ctx.beginPath(); ctx.arc(216, 80, 13, Math.PI, Math.PI * 2); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
    line(262, 90, 294, 106, 8, TERRA);
    ell(297, 108, 11, 6.5); fillStroke(TERRA, 3.5);
    // falling water
    for (var i = 0; i < WATER_DROPS.length; i++) {
      var p = WATER_DROPS[i], ph = mod(t / 0.9 + p.off, 1);
      var wx = 302 + p.dx * 0.35 + ph * 12, wy = 112 + ph * 42;
      ctx.globalAlpha = 1 - ph * 0.45;
      ell(wx, wy, 2.8, 4.4); ctx.fillStyle = GLOW; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // monstera
    line(352, 128, 352, 96, 5, LEAF);
    line(352, 128, 330, 100, 4.5, LEAF);
    line(352, 128, 376, 98, 4.5, LEAF);
    var leaf = function (x, y, r, rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ell(0, 0, r, r * 0.62); fillStroke(LEAF, 3.5);
      ctx.strokeStyle = WHITE; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(-r * 0.5, 0); ctx.lineTo(r * 0.5, 0); ctx.stroke();
      ctx.restore();
    };
    leaf(352, 70, 27, 0); leaf(318, 94, 22, -0.5); leaf(386, 90, 23, 0.45); leaf(350, 104, 19, 0.1);
    ctx.beginPath();
    ctx.moveTo(318, 128); ctx.lineTo(390, 128); ctx.lineTo(381, 163); ctx.lineTo(327, 163);
    ctx.closePath(); fillStroke(TERRA, 4.5);
    line(318, 128, 390, 128, 5);
    // the cat supervises
    ctx.save(); ctx.translate(434, 140);
    ell(0, 2, 17, 19); fillStroke(INK, 3);
    circ(0, -22, 13); fillStroke(INK, 3);
    ctx.beginPath(); ctx.moveTo(-11, -30); ctx.lineTo(-8, -42); ctx.lineTo(-2, -33); ctx.closePath();
    ctx.moveTo(11, -30); ctx.lineTo(8, -42); ctx.lineTo(2, -33); ctx.closePath();
    ctx.fillStyle = INK; ctx.fill();
    ctx.strokeStyle = CHEESE; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-5, -22, 2.6, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(5, -22, 2.6, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(15, 14); ctx.quadraticCurveTo(30, 8, 27, -6); ctx.stroke();
    ctx.restore();
  }

  // ---- in-scene lettering, precomputed ----
  var TAG_LAY = layoutText('200°C', 27, 96, 558401);
  var CAN_LAY = layoutText('fake scenario', 17, 90, 558402);
  var DOJA_LAY = layoutText('DOJA', 27, 120, 558403);
  var EVA_LAY = layoutText('EVA', 19, 56, 558404);
  var MANGA1_LAY = layoutText('Marmalade Boy', 19, 185, 558405);
  var MANGA2_LAY = layoutText('Tokyo Revengers', 19, 195, 558406);

  var SCENES = [sceneBath, sceneCake, sceneCan, sceneNachos, sceneDoja,
                sceneCombo, sceneManga, sceneBed, sceneEva, scenePlants];

  // ---- panel assembly ----
  function drawPanel(i, t) {
    wobblyRect(0, 0, PW, PH, 558500 + i * 13, 5);
    fillStroke(PANEL_BG[i], 5.5);
    ctx.save();
    ctx.beginPath(); ctx.rect(5, 5, PW - 10, SCENE_H - 3); ctx.clip();
    SCENES[i](t);
    ctx.restore();
    line(8, SCENE_H, PW - 8, SCENE_H, 3.5);
    ctx.fillStyle = TAN; ctx.fillRect(6, SCENE_H + 3, PW - 12, STRIP_H - 8);
    drawLayout(CAP_LAYS[i], PW / 2, SCENE_H + STRIP_H / 2 + 1);
  }

  // ---- expansion state (tap a panel to fill the page, tap again to return) ----
  var simT = PHASE0;
  var expIdx = -1, expT0 = 0, expFrom = 0, expMode = 'in';
  function expK(t) {
    if (expIdx < 0) return 0;
    var dur = expMode === 'in' ? 0.35 : 0.3;
    var raw = clamp((t - expT0) / dur, 0, 1);
    var e = 1 - (1 - raw) * (1 - raw);
    return expMode === 'in' ? lerp(expFrom, 1, e) : lerp(expFrom, 0, e);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = TAN;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(SC, SC);
    ctx.lineJoin = 'round';

    // the page sheet
    wobblyRect(10, 10, DW - 20, DH - 20, 558900, 6);
    fillStroke(PAGE, 5);

    var i, r;
    for (i = 0; i < 10; i++) {
      r = panelRect(i);
      ctx.save(); ctx.translate(r.x, r.y);
      drawPanel(i, t);
      ctx.restore();
    }

    // expanded panel over the page
    var k = expK(t);
    if (expIdx >= 0 && k > 0) {
      if (expMode === 'out' && k <= 0.001) { expIdx = -1; }
      else {
        ctx.globalAlpha = k;
        ctx.fillStyle = PAGE;
        ctx.fillRect(12, 12, DW - 24, DH - 24);
        var TW = DW - 2 * MARGIN, TH = TW * PH / PW;
        ctx.save();
        ctx.translate(MARGIN, (DH - TH) / 2);
        ctx.scale(TW / PW, TW / PW);
        drawPanel(expIdx, t);
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }

    // hint
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = INK;
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('tap', DW - 36, DH - 13);
    ctx.restore();

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; portrait page centred; page ground is the banner tan) ----
  var W = 0, H = 0, SC = 1, OX = 0, OY = 0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      // the portrait page spans the full phone width
      SC = W / DW;
      OX = 0; OY = (H - DH * SC) / 2;
    } else {
      SC = Math.min(W / DW, H / DH);
      OX = (W - DW * SC) / 2; OY = (H - DH * SC) / 2;
    }
    draw(simT);
  }

  // ---- tap: expand a panel / tap again to return ----
  var lastTapStamp = -1e9;
  function onTap(e) {
    if (e.timeStamp !== undefined && e.timeStamp - lastTapStamp < 350) return;
    lastTapStamp = e.timeStamp || 0;
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var px = (e.clientX - rect.left - OX) / SC;
    var py = (e.clientY - rect.top - OY) / SC;
    if (expIdx >= 0 && expMode === 'in') {
      expFrom = expK(simT); expMode = 'out'; expT0 = simT;
      draw(simT);
      return;
    }
    for (var i = 0; i < 10; i++) {
      var r = panelRect(i);
      if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) {
        expIdx = i; expFrom = 0; expMode = 'in'; expT0 = simT;
        draw(simT);
        return;
      }
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onTap);
    canvas.addEventListener('touchstart', onTap);
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
