<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singing Amongst the Weeds</title>
<style>
html, body { margin: 0; padding: 0; background: #14231a; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#14231a';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, opening cool blue chapter, sparse slow pulses mid-stem */
/* ---- stems: cubic beziers, coordinates as fractions of the field ---- */
var STEMS = [
  { p0: [-0.05, 0.88], c1: [0.18, 0.55], c2: [0.32, 0.30], p1: [0.55, -0.05] },
  { p0: [0.12, 1.05], c1: [0.30, 0.72], c2: [0.48, 0.40], p1: [0.72, 0.02] },
  { p0: [0.42, 1.04], c1: [0.60, 0.78], c2: [0.78, 0.58], p1: [1.05, 0.32] },
  { p0: [-0.05, 0.42], c1: [0.22, 0.55], c2: [0.40, 0.72], p1: [0.62, 0.98] },
  { p0: [0.28, -0.05], c1: [0.42, 0.22], c2: [0.60, 0.42], p1: [0.92, 0.58] },
  { p0: [0.06, 0.12], c1: [0.18, 0.42], c2: [0.30, 0.68], p1: [0.48, 1.05] }
];
/* ---- blossom clusters: [stem index, u along stem, radius fraction, softness] ---- */
var BLOSSOMS = [
  { s: 0, u: 1.00, r: 0.085, soft: 1.0 },
  { s: 1, u: 1.00, r: 0.075, soft: 1.0 },
  { s: 2, u: 1.00, r: 0.095, soft: 1.0 },
  { s: 4, u: 1.00, r: 0.080, soft: 1.0 },
  { s: 3, u: 1.00, r: 0.070, soft: 0.9 },
  { s: 1, u: 0.55, r: 0.055, soft: 0.8 },
  { s: 5, u: 0.62, r: 0.050, soft: 0.8 },
  { s: 0, u: 0.30, r: 0.042, soft: 0.7 }
];
/* ---- chapters: 240 s each, 960 s cycle. period = pulse birth spacing per stem,
   travel = seconds a pulse takes to run the stem, warmth 0 = cool blue, 1 = warm amber ---- */
var CHAPTERS = [
  { name: 'cool blue', roman: 'I',   temp: 14, period: 14, travel: 18, warmth: 0.00 },
  { name: 'warming',   roman: 'II',  temp: 19, period: 9,  travel: 14, warmth: 0.45 },
  { name: 'amber',      roman: 'III', temp: 26, period: 4,  travel: 11, warmth: 1.00 },
  { name: 'cooling',    roman: 'IV',  temp: 18, period: 11, travel: 16, warmth: 0.35 }
];
var CYCLE = 960.0;
var TRANSITION = 30.0; /* seconds over which the grade lerps at a chapter boundary */
/* ---- pulse birth offsets per stem, per chapter (seconds into the chapter).
   Chapter III pairs stems (0,1), (2,3), (4,5) for call-and-response bursts. ---- */
var OFFSETS = [
  [2, 6, 10, 4, 8, 12],
  [1, 4, 7, 2, 5, 8],
  [0, 0, 1.3, 1.3, 2.6, 2.6],
  [3, 7, 11, 5, 9, 1]
];
var PLATE_FILL = '#12200f';
var PLATE_LINE = 'rgba(255,255,255,0.28)';
var PLATE_INK = '#edebe6';
var HINT_INK = '#edebe6';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function cubic(p0, c1, c2, p1, u) {
  var v = 1 - u;
  return [
    v * v * v * p0[0] + 3 * v * v * u * c1[0] + 3 * v * u * u * c2[0] + u * u * u * p1[0],
    v * v * v * p0[1] + 3 * v * v * u * c1[1] + 3 * v * u * u * c2[1] + u * u * u * p1[1]
  ];
}
function stemPoint(si, u) {
  var s = STEMS[si];
  return cubic(s.p0, s.c1, s.c2, s.p1, u);
}
function chapterAt(t) {
  var tc = ((t % CYCLE) + CYCLE) % CYCLE;
  return Math.floor(tc / 240) % 4;
}
function chapterLocal(t) {
  var tc = ((t % CYCLE) + CYCLE) % CYCLE;
  return tc % 240;
}
/* Warmth 0..1, closed form of piece time, smoothstepped across the first
   30 s of each chapter from the previous chapter's warmth. */
function warmthAt(t) {
  var c = chapterAt(t);
  var local = chapterLocal(t);
  var prev = (c + 3) % 4;
  var w0 = CHAPTERS[prev].warmth, w1 = CHAPTERS[c].warmth;
  return w0 + (w1 - w0) * smooth(local / TRANSITION);
}
/* Temperature shown in the caption: the current chapter's temperature,
   lerped across the boundary transition like the grade. */
function tempAt(t) {
  var c = chapterAt(t);
  var local = chapterLocal(t);
  var prev = (c + 3) % 4;
  var a = CHAPTERS[prev].temp, b = CHAPTERS[c].temp;
  return Math.round(a + (b - a) * smooth(local / TRANSITION));
}
/* Pulses alive at time t: { si, u, frac } where frac is age/travel.
   Births are fixed authored events: chapter start + k * period + stem offset. */
function pulsesAt(t) {
  var out = [];
  var tc = ((t % CYCLE) + CYCLE) % CYCLE;
  var cycStart = t - tc;
  var ci, ch, start, k, birth, age, si;
  for (ci = 0; ci < 4; ci++) {
    ch = CHAPTERS[ci];
    start = cycStart + ci * 240;
    for (si = 0; si < STEMS.length; si++) {
      for (k = 0; k < 40; k++) {
        birth = start + OFFSETS[ci][si] + k * ch.period;
        if (birth >= start + 240) break; /* births stop at the chapter end */
        if (birth > t) break;
        age = t - birth;
        if (age <= ch.travel) {
          out.push({ si: si, u: age / ch.travel, frac: age / ch.travel });
        }
      }
    }
  }
  /* pulses born in the previous cycle's last chapter can still be travelling;
     that chapter spans [cycStart - 240, cycStart), so births stop at cycStart */
  var pc = 3, pch = CHAPTERS[pc];
  var pstart = cycStart - 240;
  for (si = 0; si < STEMS.length; si++) {
    for (k = 0; k < 40; k++) {
      birth = pstart + OFFSETS[pc][si] + k * pch.period;
      if (birth >= cycStart) break;
      if (birth > t) break;
      age = t - birth;
      if (age <= pch.travel && age >= 0) {
        out.push({ si: si, u: age / pch.travel, frac: age / pch.travel });
      }
    }
  }
  return out;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
function drawBackground() {
  var S = Math.min(F.w, F.h);
  var g = ctx.createLinearGradient(F.x, F.y, F.x, F.y + F.h);
  g.addColorStop(0, '#1c3020');
  g.addColorStop(0.55, '#16241a');
  g.addColorStop(1, '#0f1c10');
  ctx.fillStyle = g;
  ctx.fillRect(F.x, F.y, F.w, F.h);
  /* out-of-focus leaf masses, macro depth of field */
  var blobs = [
    [0.12, 0.18, 0.30, '#22402a', 0.55],
    [0.85, 0.12, 0.26, '#1e3823', 0.50],
    [0.78, 0.85, 0.32, '#203a24', 0.55],
    [0.08, 0.78, 0.24, '#1a301d', 0.50],
    [0.52, 0.50, 0.36, '#1b3320', 0.45]
  ];
  var i, b, bx, by, br, bg;
  for (i = 0; i < blobs.length; i++) {
    b = blobs[i];
    bx = F.x + b[0] * F.w; by = F.y + b[1] * F.h; br = b[2] * S;
    bg = ctx.createRadialGradient(bx, by, 0, bx, by, br);
    bg.addColorStop(0, b[3]);
    bg.addColorStop(1, 'rgba(20,35,26,0)');
    ctx.globalAlpha = b[4];
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  /* faint pale bokeh flecks */
  var flecks = [
    [0.30, 0.22, 0.012], [0.66, 0.30, 0.009], [0.18, 0.55, 0.010],
    [0.88, 0.62, 0.012], [0.45, 0.82, 0.009], [0.58, 0.10, 0.008]
  ];
  for (i = 0; i < flecks.length; i++) {
    ctx.fillStyle = 'rgba(214,232,200,0.07)';
    ctx.beginPath();
    ctx.arc(F.x + flecks[i][0] * F.w, F.y + flecks[i][1] * F.h, flecks[i][2] * S, 0, TAU);
    ctx.fill();
  }
}
function drawStem(si) {
  var s = STEMS[si];
  var S = Math.min(F.w, F.h);
  var p0 = [F.x + s.p0[0] * F.w, F.y + s.p0[1] * F.h];
  var c1 = [F.x + s.c1[0] * F.w, F.y + s.c1[1] * F.h];
  var c2 = [F.x + s.c2[0] * F.w, F.y + s.c2[1] * F.h];
  var p1 = [F.x + s.p1[0] * F.w, F.y + s.p1[1] * F.h];
  ctx.lineCap = 'round';
  /* dark under-stroke, then mid green, then a thin light edge */
  ctx.strokeStyle = '#24401f';
  ctx.lineWidth = Math.max(2, 0.011 * S);
  ctx.beginPath();
  ctx.moveTo(p0[0], p0[1]);
  ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], p1[0], p1[1]);
  ctx.stroke();
  ctx.strokeStyle = '#4a6b35';
  ctx.lineWidth = Math.max(1.5, 0.007 * S);
  ctx.beginPath();
  ctx.moveTo(p0[0], p0[1]);
  ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], p1[0], p1[1]);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(139,171,102,0.55)';
  ctx.lineWidth = Math.max(1, 0.002 * S);
  ctx.beginPath();
  ctx.moveTo(p0[0] - 0.002 * S, p0[1] - 0.002 * S);
  ctx.bezierCurveTo(c1[0] - 0.002 * S, c1[1] - 0.002 * S, c2[0] - 0.002 * S, c2[1] - 0.002 * S, p1[0] - 0.002 * S, p1[1] - 0.002 * S);
  ctx.stroke();
  /* small buds along the stem */
  var u, pt;
  var buds = [0.22, 0.45, 0.68, 0.86];
  var j;
  for (j = 0; j < buds.length; j++) {
    u = buds[j];
    pt = stemPoint(si, u);
    ctx.fillStyle = 'rgba(122,160,90,0.8)';
    ctx.beginPath();
    ctx.arc(F.x + pt[0] * F.w, F.y + pt[1] * F.h, Math.max(1.5, 0.004 * S), 0, TAU);
    ctx.fill();
  }
}
function drawBlossom(bl) {
  var S = Math.min(F.w, F.h);
  var pt = stemPoint(bl.s, bl.u);
  var cx = F.x + pt[0] * F.w, cy = F.y + pt[1] * F.h;
  var r = bl.r * S;
  var i, a, fr, fx, fy, fl;
  /* soft pink-white mass: layered radial washes, no hard edge */
  var washes = [
    [0, 0, 1.00, 'rgba(243,226,230,0.34)'],
    [0.28, -0.18, 0.62, 'rgba(240,214,222,0.30)'],
    [-0.24, 0.20, 0.58, 'rgba(246,232,234,0.28)'],
    [0.10, 0.30, 0.48, 'rgba(238,208,216,0.26)']
  ];
  for (i = 0; i < washes.length; i++) {
    var w = washes[i];
    var gx = cx + w[0] * r, gy = cy + w[1] * r, gr = w[2] * r;
    var gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    gg.addColorStop(0, w[3]);
    gg.addColorStop(1, 'rgba(243,226,230,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(gx, gy, gr, 0, TAU);
    ctx.fill();
  }
  /* tiny soft floret dots, no drawn petals: the blossom stays a soft mass */
  for (i = 0; i < 6; i++) {
    a = (i * 2.39996) % TAU; /* golden-angle spread, fixed, not random */
    fr = 0.55 * r * (0.35 + 0.45 * ((i * 37 % 10) / 10));
    fx = cx + Math.cos(a) * fr;
    fy = cy + Math.sin(a) * fr;
    ctx.fillStyle = 'rgba(250,238,240,0.55)';
    ctx.beginPath();
    ctx.arc(fx, fy, Math.max(1, 0.006 * S) * bl.soft, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(224,178,130,0.6)';
    ctx.beginPath();
    ctx.arc(fx, fy, Math.max(1, 0.0028 * S), 0, TAU);
    ctx.fill();
  }
}
function drawPulse(p, t) {
  var S = Math.min(F.w, F.h);
  var pt = stemPoint(p.si, p.u);
  var x = F.x + pt[0] * F.w, y = F.y + pt[1] * F.h;
  var frac = p.frac;
  /* expanding ripple ring, fading as it travels; kept small so the pulse
     reads as a travelling point, not a bubble */
  var rr = (0.012 + 0.024 * frac) * S;
  var ra = (0.35 * (1 - frac)).toFixed(4);
  ctx.strokeStyle = 'rgba(251,248,239,' + ra + ')';
  ctx.lineWidth = Math.max(1, 0.0025 * S);
  ctx.beginPath();
  ctx.arc(x, y, rr, 0, TAU);
  ctx.stroke();
  /* fading trail behind the pulse */
  var j, tu, tpt, tx, ty, ta;
  for (j = 1; j <= 3; j++) {
    tu = p.u - j * 0.02;
    if (tu < 0) break;
    tpt = stemPoint(p.si, tu);
    tx = F.x + tpt[0] * F.w; ty = F.y + tpt[1] * F.h;
    ta = (0.35 * (1 - frac) * (1 - j / 4)).toFixed(4);
    ctx.fillStyle = 'rgba(251,248,239,' + ta + ')';
    ctx.beginPath();
    ctx.arc(tx, ty, Math.max(1, 0.003 * S), 0, TAU);
    ctx.fill();
  }
  /* bright near-white core with a soft glow */
  var glow = ctx.createRadialGradient(x, y, 0, x, y, 0.018 * S);
  glow.addColorStop(0, 'rgba(251,248,239,0.9)');
  glow.addColorStop(1, 'rgba(251,248,239,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, 0.018 * S, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#fbf8ef';
  ctx.beginPath();
  ctx.arc(x, y, Math.max(1.5, 0.005 * S), 0, TAU);
  ctx.fill();
}
/* Temperature grade wash over the whole scene: cool blue at warmth 0,
   warm amber at warmth 1. Closed form of piece time. */
function drawGrade(t) {
  var w = warmthAt(t);
  var coolA = (0.10 * (1 - w)).toFixed(4);
  var warmA = (0.10 * w).toFixed(4);
  ctx.fillStyle = 'rgba(74,116,178,' + coolA + ')';
  ctx.fillRect(F.x, F.y, F.w, F.h);
  ctx.fillStyle = 'rgba(226,158,74,' + warmA + ')';
  ctx.fillRect(F.x, F.y, F.w, F.h);
}
function drawPlates(t) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Singing Amongst the Weeds').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Singing Amongst the Weeds').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 28').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Singing Amongst the Weeds', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 28', plateX + 14, plateY + 7 + titlePx + 3);
  /* hint plate, bottom left */
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  /* temperature caption plate, bottom right: announces the chapter */
  var ch = CHAPTERS[chapterAt(t)];
  var caption = 'chapter ' + ch.roman + ' · ' + ch.name + ' · ' + tempAt(t) + '°';
  ctx.font = smallPx + 'px monospace';
  var capW = ctx.measureText(caption).width;
  var capPlateW = capW + 24;
  var capPlateH = smallPx + 14;
  var capPlateX = VW - capPlateW - 12;
  var capPlateY = VH - capPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(capPlateX, capPlateY, capPlateW, capPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(capPlateX + 0.5, capPlateY + 0.5, capPlateW - 1, capPlateH - 1);

  ctx.fillText(caption, capPlateX + 12, capPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawBackground();
  var i;
  for (i = 0; i < STEMS.length; i++) drawStem(i);
  for (i = 0; i < BLOSSOMS.length; i++) drawBlossom(BLOSSOMS[i]);

  for (i = 0; i < pulses.length; i++) drawPulse(pulses[i], phaseT);
  drawGrade(phaseT);
  drawPlates(phaseT);

if (typeof window !== 'undefined') {

    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    chapterAt: function () { return chapterAt(phaseT); },
    warmthAt: function () { return warmthAt(phaseT); },
    pulsesAt: function () { return pulsesAt(phaseT); }

}
/* ---- frame one: fixed phase t = 60 s ---- */

if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);

    /* tiny high tick, lazy inside the gesture only, very quiet; the piece works fully muted */

        gain.connect(ac.destination);

if (!reduced && typeof requestAnimationFrame !== 'undefined') {

    var prevTs = null, clockT = 0;

}
</script>
