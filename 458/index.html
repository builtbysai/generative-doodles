<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quoted</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#E8B44B; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  /* mulberry32 seeded RNG: all load-time state comes from this stream. */
  function RNG(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var GROUND = '#E8B44B';
  var SHIRT = '#F7C6D9';
  var STRIPE = '#FFFFFF';
  var INK = '#14100E';
  /* Fixed authored tables, index 0 at load. */
  var SKINS = ['#E91E63', '#214FC6', '#0F8B8D']; /* magenta, cobalt, teal */
  var PAIRS = [
    ['\u201C', '\u201D'],   /* opening double quotes */
    ['!', '!'],
    ['?', '?'],
    [';', ';'],
    ['\u2026', '\u2026'],   /* ellipsis */
    ['\u2018', '\u2019']    /* single quotes */
  ];

  var skinIdx = 0;
  var pairBase = 0;

  /* Blink schedule from the seeded stream: one blink per cycle, cycle lengths
     jittered around 4s. Cumulative starts precomputed for 64 cycles, which is
     far beyond any single viewing stretch the table needs to name exactly;
     past the table the last duration repeats. */
  var CUM = [0];
  (function () {
    var r = RNG(458002);
    var i, d;
    for (i = 0; i < 64; i++) {
      d = 4 + (r() - 0.5) * 0.7;
      CUM.push(CUM[i] + d);
    }
  })();
  var stripePhase = RNG(458017)() * 0.032; /* deterministic pinstripe offset, in units of U */

  function cycleInfo(t) {
    var k = 0;
    while (k < CUM.length - 2 && t >= CUM[k + 1]) k++;
    var dur = CUM[k + 1] - CUM[k];
    var local = t - CUM[k];
    if (local < 0) local = 0;
    if (local > dur) { local = dur; }
    return { k: k, local: local, dur: dur };
  }

  var PHASE0 = 1.2;
  var T0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;

  /* Drag state: one eye is grabbed, the other is pulled along at 0.3 strength
     (the pair behaves like magnets). On release both ease back to the eyes. */
  var dragEye = -1, dragOff = { x: 0, y: 0 }, downX = 0, downY = 0, downT = 0, moved = 0;
  function eyeHomes() {
    var U = Math.min(W, H), cx = W / 2, cy = H / 2;
    return [
      { x: cx - 0.088 * U, y: cy - 0.14 * U },
      { x: cx + 0.088 * U, y: cy - 0.14 * U }
    ];
  }
  function onDown(x, y, ts) {
    var homes = eyeHomes(), U = Math.min(W, H), i, d, best = 1e9, bi = -1;
    for (i = 0; i < 2; i++) {
      d = Math.hypot(x - homes[i].x, y - homes[i].y);
      if (d < best) { best = d; bi = i; }
    }
    dragEye = bi; downX = x; downY = y; downT = ts || 0; moved = 0;
  }
  function onMove(x, y) {
    if (dragEye < 0) return;
    var homes = eyeHomes(), U = Math.min(W, H);
    var dx = (x - homes[dragEye].x) * 0.9, dy = (y - homes[dragEye].y) * 0.9;
    var m = Math.hypot(dx, dy), max = 0.24 * U;
    if (m > max) { dx *= max / m; dy *= max / m; }
    dragOff.x = dx; dragOff.y = dy;
    moved = Math.max(moved, Math.hypot(x - downX, y - downY));
  }
  function onUp(ts) {
    if (dragEye >= 0 && moved < 10 && ((ts || 0) - downT) < 350) {
      /* tap: reseed, new punctuation pair and the next skin hue */
      pairBase = (pairBase + 1) % PAIRS.length;
      skinIdx = (skinIdx + 1) % SKINS.length;
    }
    dragEye = -1;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY, e.timeStamp); });
    canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
    canvas.addEventListener('pointerup', function (e) { onUp(e.timeStamp); });
    canvas.addEventListener('pointercancel', function () { dragEye = -1; });
  }

  function shirtPath(U, cx, cy) {
    ctx.beginPath();
    ctx.moveTo(cx - 0.115 * U, cy + 0.105 * U);
    ctx.quadraticCurveTo(cx - 0.24 * U, cy + 0.115 * U, cx - 0.29 * U, cy + 0.175 * U);
    ctx.quadraticCurveTo(cx - 0.275 * U, cy + 0.24 * U, cx - 0.265 * U, cy + 0.31 * U);
    ctx.lineTo(cx + 0.265 * U, cy + 0.31 * U);
    ctx.quadraticCurveTo(cx + 0.275 * U, cy + 0.24 * U, cx + 0.29 * U, cy + 0.175 * U);
    ctx.quadraticCurveTo(cx + 0.24 * U, cy + 0.115 * U, cx + 0.115 * U, cy + 0.105 * U);
    ctx.quadraticCurveTo(cx, cy + 0.135 * U, cx - 0.115 * U, cy + 0.105 * U);
    ctx.closePath();
  }

  function draw(t) {
    var U = Math.min(W, H), cx = W / 2, cy = H / 2;
    var skin = SKINS[skinIdx];
    var ci = cycleInfo(t);

    /* blink: squash over the last 0.3s of each cycle; the punctuation pair
       swaps at the closed midpoint of the blink. */
    var squash = 1;
    var blinkDur = 0.3;
    var swap = 0;
    if (ci.local > ci.dur - blinkDur) {
      var p = (ci.local - (ci.dur - blinkDur)) / blinkDur;
      squash = 1 - 0.92 * Math.sin(p * Math.PI);
      if (p >= 0.5) swap = 1;
    }
    var pair = PAIRS[(pairBase + ci.k + swap) % PAIRS.length];

    /* released eyes snap back */
    if (dragEye < 0) { dragOff.x *= 0.80; dragOff.y *= 0.80; }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    /* flat mustard ground */
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var headCy = cy - 0.11 * U;
    var headW = 0.36 * U, headH = 0.40 * U;

    /* neck */
    ctx.fillStyle = skin;
    ctx.fillRect(cx - 0.055 * U, headCy + headH / 2 - 0.03 * U, 0.11 * U, 0.13 * U);

    /* shirt, with white pinstripes clipped inside */
    shirtPath(U, cx, cy);
    ctx.fillStyle = SHIRT;
    ctx.fill();
    ctx.save();
    shirtPath(U, cx, cy);
    ctx.clip();
    ctx.strokeStyle = STRIPE;
    ctx.lineWidth = Math.max(1, 0.006 * U);
    ctx.beginPath();
    var sx, startX = cx - 0.30 * U + stripePhase * U;
    for (sx = startX; sx < cx + 0.30 * U; sx += 0.032 * U) {
      ctx.moveTo(sx, cy + 0.09 * U);
      ctx.lineTo(sx, cy + 0.315 * U);
    }
    ctx.stroke();
    ctx.restore();

    /* collar: V opening in skin, edged by two shirt flaps with a stripe edge */
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.moveTo(cx - 0.062 * U, cy + 0.108 * U);
    ctx.lineTo(cx + 0.062 * U, cy + 0.108 * U);
    ctx.lineTo(cx, cy + 0.195 * U);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = STRIPE;
    ctx.lineWidth = Math.max(1, 0.007 * U);
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 0.062 * U, cy + 0.108 * U);
    ctx.lineTo(cx, cy + 0.195 * U);
    ctx.lineTo(cx + 0.062 * U, cy + 0.108 * U);
    ctx.stroke();

    /* ears */
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(cx - headW / 2, headCy + 0.02 * U, 0.034 * U, 0, Math.PI * 2);
    ctx.arc(cx + headW / 2, headCy + 0.02 * U, 0.034 * U, 0, Math.PI * 2);
    ctx.fill();

    /* head */
    ctx.beginPath();
    ctx.ellipse(cx, headCy, headW / 2, headH / 2, 0, 0, Math.PI * 2);
    ctx.fill();

    /* nose and mouth: minimal black line work, expression neutral */
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1, 0.006 * U);
    ctx.beginPath();
    ctx.moveTo(cx + 0.004 * U, headCy + 0.045 * U);
    ctx.lineTo(cx - 0.011 * U, headCy + 0.105 * U);
    ctx.stroke();
    ctx.lineWidth = Math.max(1, 0.008 * U);
    ctx.beginPath();
    ctx.moveTo(cx - 0.038 * U, headCy + 0.155 * U);
    ctx.lineTo(cx + 0.038 * U, headCy + 0.155 * U);
    ctx.stroke();

    /* the eyes: large black punctuation, one bold serif */
    var homes = [
      { x: cx - 0.088 * U, y: cy - 0.14 * U },
      { x: cx + 0.088 * U, y: cy - 0.14 * U }
    ];
    ctx.fillStyle = INK;
    ctx.font = '900 ' + Math.round(0.23 * U) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var i, ex, ey, f;
    for (i = 0; i < 2; i++) {
      if (dragEye < 0) f = 1;
      else f = (dragEye === i) ? 1 : 0.3;
      ex = homes[i].x + dragOff.x * f;
      ey = homes[i].y + dragOff.y * f;
      ctx.save();
      ctx.translate(ex, ey);
      ctx.scale(1, Math.max(0.08, squash));
      ctx.fillText(pair[i], 0, 0);
      ctx.restore();
    }
  }

  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    (function loop() {
      var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
      draw(PHASE0 + (now - T0) / 1000);
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
