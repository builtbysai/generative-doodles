<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Listening Circle</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0908; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a scored listening exercise. A text instruction arrives at the
   center of a dark hall, and the rings of seated listeners answer it in
   turn. The pattern of response IS the piece: one ring swells a tone,
   another answers a breath later, the outer ring stays silent longest,
   or a wave of sound crosses the rings, or all rings hold one note until
   it dissolves. Attention itself moves in waves across the room. Watch only. */
var TAU = Math.PI * 2;
var GROUND = '#0A0908';
var DISC = '#0E0C0A';
var GOLD = '#C9A86A';
var WARM = '#F2EAD8';
var BLUE = '#A8C4D8';
var PLATE = '#171310';
var PLATE_LINE = 'rgba(201,168,106,0.45)';
var TITLE_INK = '#F2EAD8';
var HINT_INK = '#C9A86A';
var FRAME_T = 40.0;        /* fixed phase: score 0, local 40 s, ring 1 full swell */
var SCORE_LEN = 75;        /* each text score holds 75 s */
var SCORE_N = 5;
var CYCLE = SCORE_LEN * SCORE_N;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(a, b, x) {
  var f = clamp((x - a) / (b - a), 0, 1);
  return f * f * (3 - 2 * f);
}
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var SCORES = [
  'listen for the lowest sound in the room',
  'let one note travel around the room',
  'hold one note until it dissolves',
  'answer only when you hear your neighbor',
  'listen for the silence between sounds'
];
/* call and answer delays per ring, in seconds, for score 0 */
var CALL_DELAY = [0, 6, 12, 24];
var RING_N = [8, 14, 20, 26];
var RING_R = [0.34, 0.55, 0.76, 0.97];
/* seeded per-listener jitter: angle offset, radius offset, flicker seed */
var LISTENERS = (function () {
  var rng = mulberry32(1867), out = [], r, i;
  for (r = 0; r < 4; r++) {
    var ring = [];
    for (i = 0; i < RING_N[r]; i++) {
      ring.push({
        a: (i / RING_N[r]) * TAU + (rng() - 0.5) * 0.10,
        dr: (rng() - 0.5) * 0.03,
        s: rng()
      });
    }
    out.push(ring);
  }
  return out;
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Centered geometric composition: a square kept whole, page ground is the
   piece's own hall black, so the square sits on black on every screen. */
function fieldRect() {
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function circ(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
  if (fill) ctx.fill(); else ctx.stroke();
}
function seg(x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
/* response amplitude of one listener: score index, ring, angle, local time */
function response(si, r, li, u) {
  var L = LISTENERS[r][li];
  if (si === 0) {
    /* call and answer: each ring swells in turn, outer ring latest */
    var ph = (u - CALL_DELAY[r]) % 30;
    if (ph < 0) ph += 30;
    var amp = smooth(0, 6, ph);
    if (ph > 10) amp *= Math.exp(-(ph - 10) / 8);
    return amp;
  }
  if (si === 1) {
    /* traveling wave: two laps per score, bloom just after the wave passes */
    var w = (u / SCORE_LEN) * TAU * 2;
    var d = w - L.a;
    d = d % TAU; if (d < 0) d += TAU;
    return Math.exp(-d / 0.9);
  }
  if (si === 2) {
    /* held unison: all rings rise together, hold, then dissolve */
    return smooth(0, 20, u) * (1 - smooth(55, 75, u));
  }
  if (si === 3) {
    /* neighbor chain: a ripple chases itself around each ring */
    var span = RING_N[r] * 1.2;
    var ph3 = (u - r * 3 - li * 1.2) % span;
    if (ph3 < 0) ph3 += span;
    return Math.exp(-ph3 / 2.5);
  }
  /* score 4, silence: only a few seeded listeners flicker faintly */
  if (L.s > 0.18) return 0;
  var fl = Math.sin(u * 0.4 + L.s * TAU);
  if (fl <= 0) return 0;
  return 0.3 * Math.pow(fl, 4);
}
function wrapLines(text, maxW) {
  var words = text.split(' ');
  var lines = [], cur = words[0], i;
  for (i = 1; i < words.length; i++) {
    var test = cur + ' ' + words[i];
    if (ctx.measureText(test).width <= maxW) cur = test;
    else { lines.push(cur); cur = words[i]; }
  }
  lines.push(cur);
  return lines;
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Deep Listening Circle').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Deep Listening Circle').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 21').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Deep Listening Circle', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 21', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. The circle listens on its own slow clock.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var cx = sc.x + sc.w / 2, cy = sc.y + sc.h / 2;
  var R = Math.min(sc.w, sc.h) * 0.46;
  var si = Math.floor(phaseT / SCORE_LEN) % SCORE_N;
  var u = phaseT % SCORE_LEN;
  var fade = smooth(0, 5, u) * (1 - smooth(SCORE_LEN - 5, SCORE_LEN, u));
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var r, i, li, amp;
  /* rings and listeners */
  for (r = 0; r < 4; r++) {
    var rr = R * RING_R[r];
    var ringAmp = 0;
    for (i = 0; i < RING_N[r]; i++) ringAmp += response(si, r, i, u);
    ringAmp /= RING_N[r];
    ctx.strokeStyle = rgba(GOLD, 0.28 + 0.30 * ringAmp);
    ctx.lineWidth = Math.max(1, R * 0.004);
    circ(cx, cy, rr, false);
    for (i = 0; i < RING_N[r]; i++) {
      li = LISTENERS[r][i];
      var lx = cx + Math.cos(li.a) * R * (RING_R[r] + li.dr);
      var ly = cy + Math.sin(li.a) * R * (RING_R[r] + li.dr);
      var dotR = Math.max(2, R * 0.016);
      amp = response(si, r, i, u);
      if (amp > 0.02) {
        /* sound bloom: pale blue halo around the sounding listener */
        ctx.fillStyle = rgba(BLUE, 0.45 * amp);
        circ(lx, ly, dotR * (1 + 2.6 * amp), true);
        ctx.strokeStyle = rgba(BLUE, 0.35 * amp);
        ctx.lineWidth = Math.max(1, R * 0.002);
        circ(lx, ly, dotR * (2 + 2.6 * amp), false);
      }
      ctx.fillStyle = rgba(WARM, 0.55 + 0.45 * amp);
      circ(lx, ly, dotR * (0.8 + 0.5 * amp), true);
    }
  }
  /* center disc holding the text score */
  var discR = R * 0.30;
  ctx.fillStyle = DISC;
  circ(cx, cy, discR, true);
  ctx.strokeStyle = rgba(GOLD, 0.40);
  ctx.lineWidth = Math.max(1, R * 0.003);
  circ(cx, cy, discR, false);
  /* the text score, fading in and out with its 75 s hold */
  var fs = clamp(R * 0.042, 11, 19);
  ctx.font = fs + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var lines = wrapLines(SCORES[si], discR * 1.55);
  var lh = fs * 1.55;
  var blockH = lines.length * lh;
  var ty = cy - blockH / 2 - fs * 0.9;
  ctx.fillStyle = rgba(WARM, fade);
  var k;
  for (k = 0; k < lines.length; k++) {
    ctx.fillText(lines[k], cx, ty + k * lh + lh / 2);
  }
  /* score index: five small dots under the text, current one filled */
  var dotsY = cy + blockH / 2 + fs * 0.35;
  var gap = Math.max(10, R * 0.055);
  var dx0 = cx - gap * 2;
  for (k = 0; k < SCORE_N; k++) {
    var dx = dx0 + k * gap;
    if (k === si) {
      ctx.fillStyle = rgba(GOLD, fade);
      circ(dx, dotsY, Math.max(2.5, R * 0.012), true);
    } else {
      ctx.strokeStyle = rgba(GOLD, 0.6 * fade);
      ctx.lineWidth = 1;
      circ(dx, dotsY, Math.max(2.5, R * 0.012), false);
    }
  }
  drawPlates();
}
/* ---- frame one: fixed phase t = 40.0 s, score 0 at local 40 s ----
   ring 1 at full swell, ring 2 rising, ring 3 nearly quiet, ring 4 in
   soft decay; the first text score fully faded in at the center. ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % CYCLE;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
