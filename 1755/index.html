<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Played at the Slowest Speed</title>
<style>
html, body { margin: 0; padding: 0; background: #0C0A08; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0C0A08';
var MOTIF = '#EDE6D6';
var AMBER = '#B97A2E';
var AMBER_LIGHT = '#D99A45';
var AMBER_DEEP = '#7A4E1C';
var AXIS = 'rgba(217,154,69,0.10)';
var PLATE = '#171310';
var PLATE_LINE = 'rgba(185,122,46,0.55)';
var TITLE_INK = '#EDE6D6';
var HINT_INK = '#B08D5A';
var FRAME_T = 60.0;
var STRETCH = 16;
var MARK_N = 14;
var GAP0 = 0.018;
var GAP_GROW = 1.16;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1755);
var phaseT = FRAME_T;
/* ---- layout: a single vertical column on the centre axis, wide
   empty margins on both sides. The fast motif is pinned near the
   top; the slow ribbon fills the column below it. ---- */
function axisX() { return VW * 0.5; }
function motifY() { return VH * 0.14; }
function ribbonTop() { return VH * 0.24; }
/* ---- ribbon marks: seeded per-mark drift depth and time constant.
   Each mark eases downward with its own time constant, so the
   leading marks decelerate first and the gaps between marks widen
   as the ribbon falls. Base gaps widen geometrically with depth. ---- */
var MARKS = [];
(function () {
  var i, y = 0, gap = GAP0;
  for (i = 0; i < MARK_N; i++) {
    MARKS.push({
      base: y,
      drift: (0.02 + rng() * 0.04) * 1,
      tau: 2.2 + rng() * 1.8,
      phase: rng() * TAU
    });
    y += gap;
    gap *= GAP_GROW;
  }
})();
function slowT(t) { return t / STRETCH; }
/* ---- fast motif flicker: closed-form product of two sines, so
   frame one is fixed. Brightness only; the motif never moves. ---- */
function flicker(t) {
  var f = 0.5 + 0.5 * Math.sin(TAU * (7.3 * t + 0.13)) * Math.sin(TAU * (2.9 * t + 0.61));
  return 0.45 + 0.55 * f;
}
function markY(mk, t) {
  var s = slowT(t);
  return ribbonTop() + mk.base * VH + mk.drift * VH * (1 - Math.exp(-s / mk.tau));
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function drawAxis(t) {
  var x = axisX();
  ctx.strokeStyle = AXIS;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, motifY() + VH * 0.02);
  ctx.lineTo(x, ribbonTop() + VH * 0.62);
  ctx.stroke();
}
function drawMotif(t) {
  var s = Math.min(VW, VH);
  var x = axisX(), y = motifY();
  var a = flicker(t);
  var r = Math.max(s * 0.012, 5);
  /* soft glow behind the motif */
  var g = ctx.createRadialGradient(x, y, 0, x, y, r * 4.5);
  g.addColorStop(0, rgba(MOTIF, 0.16 * a));
  g.addColorStop(1, rgba(MOTIF, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x + r * 4.5, y);
  ctx.arc(x, y, r * 4.5, 0, TAU);
  ctx.fill();
  /* the motif: a small burst of short ticks around a bright core */
  var i, ang, x1, y1, x2, y2, len;
  for (i = 0; i < 8; i++) {
    ang = (i / 8) * TAU + 0.19;
    len = r * (i % 2 === 0 ? 2.6 : 1.7);
    x1 = x + Math.cos(ang) * r * 0.9;
    y1 = y + Math.sin(ang) * r * 0.9;
    x2 = x + Math.cos(ang) * (r * 0.9 + len);
    y2 = y + Math.sin(ang) * (r * 0.9 + len);
    ctx.strokeStyle = rgba(MOTIF, 0.35 + 0.6 * a);
    ctx.lineWidth = Math.max(s * 0.002, 1);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  /* two short horizontal bars through the core, the tape-oxide blip */
  ctx.fillStyle = rgba(MOTIF, a);
  ctx.fillRect(x - r * 1.9, y - r * 0.22, r * 3.8, r * 0.44);
  ctx.fillStyle = rgba(MOTIF, 0.55 * a);
  ctx.fillRect(x - r * 1.2, y + r * 0.75, r * 2.4, r * 0.3);
  ctx.fillStyle = rgba(MOTIF, a);
  ctx.beginPath();
  ctx.moveTo(x + r * 0.55, y);
  ctx.arc(x, y, r * 0.55, 0, TAU);
  ctx.fill();
}
function drawRibbon(t) {
  var s = Math.min(VW, VH);
  var x = axisX();
  var slow = slowT(t);
  var i, mk, y, w, h, depth, alpha, pulse;
  for (i = 0; i < MARKS.length; i++) {
    mk = MARKS[i];
    y = markY(mk, t);
    depth = i / (MARKS.length - 1);
    /* marks stretch wider as they fall and fade toward the bottom */
    w = (10 + i * 7.5) * (s / 900);
    w = Math.max(w, 8);
    h = Math.max(s * 0.0035, 1.6);
    pulse = 0.75 + 0.25 * Math.sin(TAU * (slow * 0.35 + i * 0.618) + mk.phase);
    alpha = (0.85 * Math.pow(1 - depth, 1.2) + 0.06) * pulse;
    ctx.fillStyle = rgba(i < 4 ? AMBER_LIGHT : (i < 9 ? AMBER : AMBER_DEEP), alpha);
    ctx.fillRect(x - w / 2, y - h / 2, w, h);
    /* brighter core dash on the upper marks */
    if (i < 6) {
      ctx.fillStyle = rgba(AMBER_LIGHT, alpha * 0.5);
      ctx.fillRect(x - w * 0.22, y - h * 0.22, w * 0.44, h * 0.44);
    }
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Played at the Slowest Speed').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Played at the Slowest Speed').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 01').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Played at the Slowest Speed', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 01', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawAxis(phaseT);
  drawRibbon(phaseT);
  drawMotif(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    markCount: function () { return MARKS.length; },
    markY: function (i, t) { return markY(MARKS[i], t); },
    flicker: function (t) { return flicker(t); },
    stretch: function () { return STRETCH; },
    slowT: function (t) { return slowT(t); },
    axisX: function () { return axisX(); },
    motifY: function () { return motifY(); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, motif flickering at top,
   ribbon already partway down the column. Watch-only: no input. ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
