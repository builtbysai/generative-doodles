<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.259 Glacier's Retreat</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F1EDE2; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.259 Glacier's Retreat (Stanzin Tsepel). After his
// 2024 Disko Valley land work: a lime-white hillside scored
// with a branching maze of low blue scrap-wood walls and
// rust iron rods, marking where the Parkachik and Drang
// Drung glaciers used to be. Blue is former ice; white is
// exposed earth. Over 35 seconds the blue thins and retreats
// upslope, then the hillside restores itself. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var LIME = '#F1EDE2', BLUE = '#1668A8', DEEP = '#0C4C80', RUST = '#6E4A2E', ROCK = '#8B8B85';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var T = 8.6, lastNow = -1; // frame one: mid retreat, the maze partly thinned

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

// the slope: the surface falls away toward the lower left
function surfY(x) { return 700 - x * 0.30; }

// ---- the maze: branching corridors grown downslope in slope space ------------
// u runs along the slope (0 lower-left .. 1 upper-right), v across it.
// Each segment carries a depth d: the retreat takes the far,
// shallow branches first and the trunk last.
var segs = [], rods = [];
(function () {
  var r = rng(25911);
  function grow(u, v, ang, len, depth) {
    if (depth > 5 || len < 0.028) return;
    var u2 = u + Math.cos(ang) * len;
    var v2 = v + Math.sin(ang) * len * 0.6;
    if (u2 < 0.05 || u2 > 0.98 || v2 < -0.44 || v2 > 0.44) return;
    segs.push({ u: u, v: v, u2: u2, v2: v2, d: depth });
    if (r() < 0.66) rods.push({ u: u2, v: v2, h: 11 + r() * 13, d: depth });
    // walls turn like built rows: one branch carries on near-straight,
    // the other strikes off at a hard angle, tributary-fashion
    grow(u2, v2, ang + (r() - 0.5) * 0.34, len * (0.80 + r() * 0.10), depth + 1);
    if (r() < 0.78) {
      var side = r() < 0.5 ? -1 : 1;
      grow(u2, v2, ang + side * (0.95 + r() * 0.55), len * (0.72 + r() * 0.12), depth + 1);
    }
  }
  // two trunks: Parkachik and Drang Drung, clustered mid-frame
  grow(0.27, -0.15, -0.15, 0.085, 0);
  grow(0.24, 0.14, 0.30, 0.082, 0);
  // a few lone wall rows, stubs of the same building habit
  for (var i = 0; i < 7; i++) {
    var su = 0.2 + r() * 0.62, sv = (r() - 0.5) * 0.8, sa = (r() - 0.5) * 1.2, sl = 0.05 + r() * 0.05;
    segs.push({ u: su, v: sv, u2: su + Math.cos(sa) * sl, v2: sv + Math.sin(sa) * sl * 0.6, d: 2 });
    if (r() < 0.7) rods.push({ u: su + Math.cos(sa) * sl, v: sv + Math.sin(sa) * sl * 0.6, h: 11 + r() * 12, d: 2 });
  }
})();
// slope space to design space: walls run along the hillside's fall
function s2p(u, v) {
  var x = 90 + u * 1100;
  var y = surfY(x) + v * 560 - u * 60;
  return [x, y];
}
// ---- lime speckle and dust ------------------------------------------------------
var speck = [], motes = [];
(function () {
  var r = rng(25923);
  for (var i = 0; i < 2400; i++) speck.push({ x: r() * DW, y: r() * DH, s: 0.8 + r() * 1.9, a: 0.04 + r() * 0.08, rock: r() < 0.4 });
  var r2 = rng(25937);
  for (var j = 0; j < 42; j++) motes.push({ fx: r2(), fy: r2(), sz: 1.1 + r2() * 1.8, ph: r2() * Math.PI * 2, sp: 3 + r2() * 6 });
})();

function draw() {
  // lime hillside
  ctx.fillStyle = LIME;
  ctx.fillRect(0, 0, DW, DH);
  // broad slope bands following the fall of the hill, kept faint
  for (var b = 0; b < 9; b++) {
    var y0 = -100 + b * 104;
    ctx.fillStyle = b % 2 ? rgba(ROCK, 0.028) : rgba('#FFFFFF', 0.07);
    ctx.beginPath();
    ctx.moveTo(-20, y0 + 150);
    ctx.lineTo(DW + 20, y0 - 234);
    ctx.lineTo(DW + 20, y0 - 106);
    ctx.lineTo(-20, y0 + 278);
    ctx.closePath(); ctx.fill();
  }
  // rock vignette at the edges: bare stone creeping in
  ctx.fillStyle = rgba(ROCK, 0.10);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(210, 0); ctx.lineTo(0, 300); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(DW, DH); ctx.lineTo(DW - 250, DH); ctx.lineTo(DW, DH - 330); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(DW, 0); ctx.lineTo(DW, 120); ctx.lineTo(DW - 170, 0); ctx.closePath(); ctx.fill();
  // lime texture
  for (var i = 0; i < speck.length; i++) {
    var sp = speck[i];
    ctx.fillStyle = sp.rock ? rgba(ROCK, sp.a) : rgba(DEEP, sp.a * 0.5);
    ctx.fillRect(sp.x, sp.y, sp.s, sp.s);
  }

  // the retreat: 0 full ice .. 1 gone, eased over a 35 second loop
  var ph = (T % 35) / 35;
  var tri = ph < 0.5 ? ph * 2 : 2 - ph * 2;
  var retreat = smooth(tri);

  // ---- the blue maze walls -----------------------------------------------------
  // draw far branches first so the trunk overlaps them
  var ordered = segs.slice().sort(function (a, b2) { return b2.d - a.d; });
  for (var s = 0; s < ordered.length; s++) {
    var sg = ordered[s];
    // each segment's own retreat point: shallow branches go early
    var local = clamp01(retreat * 1.5 - sg.d * 0.13);
    var width = (13 - sg.d * 1.7) * (1 - local * 0.78);
    if (width < 0.6) continue;
    var A = s2p(sg.u, sg.v), B = s2p(sg.u2, sg.v2);
    // walls are built things: drawn straight, plank to plank.
    // The shadow side first: deep blue, offset downslope
    ctx.strokeStyle = rgba(DEEP, 0.85 * (1 - local * 0.4));
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(A[0], A[1] + 5); ctx.lineTo(B[0], B[1] + 5); ctx.stroke();
    // the wall top: organic blue
    ctx.strokeStyle = rgba(BLUE, 0.95 * (1 - local * 0.35));
    ctx.lineWidth = width * 0.62;
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
  }
  // ---- iron rods: they outlast the walls, then fade ------------------------------
  ctx.lineCap = 'round';
  for (var k = 0; k < rods.length; k++) {
    var rd = rods[k];
    var rl = clamp01(retreat * 1.35 - rd.d * 0.13);
    var ra = 0.9 * (1 - rl);
    if (ra < 0.04) continue;
    var P = s2p(rd.u, rd.v);
    ctx.strokeStyle = rgba(RUST, ra);
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(P[0], P[1] + 3); ctx.lineTo(P[0] + 1.5, P[1] - rd.h * (1 - rl * 0.5)); ctx.stroke();
    ctx.fillStyle = rgba(RUST, ra);
    ctx.beginPath(); ctx.arc(P[0] + 1.5, P[1] - rd.h * (1 - rl * 0.5), 1.8, 0, Math.PI * 2); ctx.fill();
  }
  // ---- dust drift ------------------------------------------------------------------
  for (var m = 0; m < motes.length; m++) {
    var mo = motes[m];
    var dx = ((mo.fx * DW + T * mo.sp) % (DW + 30)) - 15;
    var dy = mo.fy * DH + Math.sin(T * 0.24 + mo.ph) * 16;
    ctx.fillStyle = rgba(ROCK, 0.16 + 0.10 * Math.sin(T * 0.5 + mo.ph));
    ctx.beginPath(); ctx.arc(dx, dy, mo.sz, 0, Math.PI * 2); ctx.fill();
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = LIME;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: the hillside fills the frame, no sky anywhere
  var S = Math.max(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
