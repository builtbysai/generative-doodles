<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fire, Rain</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#7FA8B8; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  // Palette: the prompt colors and nothing else. Shadows and grain are
  // palette hues at low alpha, so no extra color ever appears.
  var GROUND = '#7FA8B8';  // dusty blue field
  var CREAM  = '#F2EDE0';  // rain figure's dress, the hint
  var SKIN   = '#EBC9A8';  // both faces and necks
  var DROP   = '#5B8CB0';  // raindrops
  var RED    = '#D61F26';  // flame outer tongues
  var ORANGE = '#E8912D';  // flame inner tongues
  var DARK   = '#3B2A24';  // hair, fire figure's upper dress

  // Seeded RNG (mulberry32). Every layout and pattern in the piece comes
  // from fixed seeds, so every load and every QA render agree byte for
  // byte. Tap reseed advances the seed and regenerates the patterns.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Figure geometry. Positions are fractions of the viewport width
  // so a resize keeps a figure in the same relative spot. One figure
  // height FH serves both figures; the dress is a slim A-line whose
  // half-width grows from shoulder to hem.
  var FH = 0;              // figure height in px, set by layout()
  var baseY = 0;           // hem line in px
  var seed = 477;
  var interacted = false;

  function dressHW(v) {    // half width at v (0 shoulder, 1 hem), in px
    return FH * (0.105 + 0.065 * Math.pow(v, 1.15));
  }
  function hemHW() { return dressHW(1); }
  function shoulderY() { return baseY - FH + FH * 0.155; }
  function touchDist() { return hemHW() * 2 * 0.94; }
  function bleedRange() { return FH * 0.30; }
  function minDist() { return touchDist() - bleedRange() * 0.18; }

  var rain = { cxF: 0.35, txF: 0.35, kind: 'rain' };
  var fire = { cxF: 0.65, txF: 0.65, kind: 'fire' };
  var contact = 0;         // 0 apart, 1 fully touching; eased

  function layout() {
    var U = Math.min(W, H);
    FH = PHONE ? U * 0.95 : H * 0.55;
    baseY = H * 0.86;
    if (!interacted) {
      // Home distance guarantees a clear gap at load on any aspect:
      // hems apart by the full bleed range plus a margin, centered.
      var homeDist = touchDist() + bleedRange() + FH * 0.06;
      rain.cxF = rain.txF = (W - homeDist) / 2 / W;
      fire.cxF = fire.txF = (W + homeDist) / 2 / W;
    }
  }

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
    layout();
    buildGrain();
  }

  // ---- Patterns, stored as figure-local data and redrawn every frame.
  // u is a fraction of the dress half-width at that height (-1..1),
  // v runs 0 at the shoulders to 1 at the hem.
  var dropsA = [], flamesB = [], flamesOnA = [], dropsOnB = [];

  function genPatterns() {
    var rng = mulberry32(seed * 1000 + 17);
    var density = 0.85 + rng() * 0.35;
    var i, n;
    dropsA = [];
    n = Math.round(46 * density);
    for (i = 0; i < n; i++) {
      dropsA.push({ u: (rng() * 2 - 1) * 0.86, v: 0.05 + rng() * 0.92,
                    s: 0.75 + rng() * 0.6 });
    }
    flamesB = [];
    n = Math.round(30 * density);
    for (i = 0; i < n; i++) {
      flamesB.push({ u: (rng() * 2 - 1) * 0.92, by: rng() * 0.12,
                     h: 0.19 + rng() * 0.21, w: 0.8 + rng() * 0.5,
                     ph: rng() * 6.283 });
    }
    flamesOnA = [];
    n = Math.round(15 * density);
    for (i = 0; i < n; i++) {
      flamesOnA.push({ u: 0.40 + rng() * 0.57, v: 0.30 + rng() * 0.68,
                       h: 0.09 + rng() * 0.09, ph: rng() * 6.283 });
    }
    dropsOnB = [];
    n = Math.round(15 * density);
    for (i = 0; i < n; i++) {
      dropsOnB.push({ u: -(0.40 + rng() * 0.57), v: 0.55 + rng() * 0.43,
                      s: 0.8 + rng() * 0.5 });
    }
  }

  // ---- Soft grain: a precomputed seeded dot array, identical every
  // frame, drawn over the whole picture at very low alpha.
  var grain = [];
  function buildGrain() {
    grain = [];
    if (!W || !H) return;
    var rng = mulberry32(9777);
    var n = Math.floor(W * H / 1500);
    for (var i = 0; i < n; i++) {
      grain.push({ x: rng(), y: rng(), r: 0.6 + rng() * 0.9,
                   a: 0.03 + rng() * 0.035, light: rng() < 0.5 });
    }
  }

  function circle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }

  // The dress outline for one figure centered at cx (px). Used to fill
  // the dress and to clip its pattern.
  function traceDress(cx) {
    var sy = shoulderY();
    var hl = cx - hemHW(), hr = cx + hemHW();
    var sl = cx - dressHW(0), sr = cx + dressHW(0);
    var midY = (sy + baseY) / 2;
    ctx.beginPath();
    ctx.moveTo(sl, sy);
    ctx.quadraticCurveTo(cx - FH * 0.155, midY, hl, baseY - FH * 0.012);
    ctx.quadraticCurveTo(cx, baseY + FH * 0.012, hr, baseY - FH * 0.012);
    ctx.quadraticCurveTo(cx + FH * 0.155, midY, sr, sy);
    ctx.quadraticCurveTo(cx, sy - FH * 0.018, sl, sy);
    ctx.closePath();
  }

  function dropPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y - s * 0.55);
    ctx.quadraticCurveTo(x + s * 0.48, y + s * 0.10, x + s * 0.20, y + s * 0.36);
    ctx.quadraticCurveTo(x + s * 0.08, y + s * 0.48, x, y + s * 0.48);
    ctx.quadraticCurveTo(x - s * 0.08, y + s * 0.48, x - s * 0.20, y + s * 0.36);
    ctx.quadraticCurveTo(x - s * 0.48, y + s * 0.10, x, y - s * 0.55);
    ctx.closePath();
  }

  // One flame tongue: a wavy teardrop rising from (x, yBase). The tip
  // leans by `lean` px; two layers make the red-to-orange gradient.
  function tongue(x, yBase, w, h, lean) {
    ctx.beginPath();
    ctx.moveTo(x - w / 2, yBase);
    ctx.quadraticCurveTo(x - w * 0.52, yBase - h * 0.50, x + lean, yBase - h);
    ctx.quadraticCurveTo(x + w * 0.30, yBase - h * 0.62, x + w / 2, yBase);
    ctx.closePath();
    ctx.fill();
  }
  function flame(x, yBase, w, h, lean) {
    ctx.fillStyle = RED;
    tongue(x, yBase, w, h, lean);
    ctx.fillStyle = ORANGE;
    tongue(x + lean * 0.25, yBase, w * 0.60, h * 0.62, lean * 0.7);
  }

  function drawFigure(fig, t) {
    var cx = fig.cxF * W;
    var sy = shoulderY();
    var i, p, x, y, v;

    // Ground shadow and feet.
    ctx.fillStyle = 'rgba(59,42,36,0.16)';
    ctx.beginPath();
    ctx.ellipse(cx, baseY + FH * 0.012, FH * 0.20, FH * 0.020, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = DARK;
    ctx.beginPath();
    ctx.ellipse(cx - FH * 0.062, baseY + FH * 0.004, FH * 0.042, FH * 0.013, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + FH * 0.062, baseY + FH * 0.004, FH * 0.042, FH * 0.013, 0, 0, Math.PI * 2);
    ctx.fill();

    // Neck.
    ctx.fillStyle = SKIN;
    ctx.fillRect(cx - FH * 0.028, sy - FH * 0.045, FH * 0.056, FH * 0.06);

    // Dress body.
    traceDress(cx);
    ctx.fillStyle = (fig.kind === 'rain') ? CREAM : DARK;
    ctx.fill();

    // Arms, resting along the dress sides.
    ctx.strokeStyle = (fig.kind === 'rain') ? CREAM : DARK;
    ctx.lineWidth = FH * 0.042;
    ctx.lineCap = 'round';
    for (var s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.moveTo(cx + s * dressHW(0) * 0.88, sy + FH * 0.03);
      ctx.lineTo(cx + s * (dressHW(0.72) - FH * 0.006), baseY - FH * 0.28);
      ctx.stroke();
    }

    // The figure's own pattern, clipped to the dress.
    ctx.save();
    traceDress(cx);
    ctx.clip();
    if (fig.kind === 'rain') {
      ctx.fillStyle = DROP;
      var ds = FH * 0.046;
      for (i = 0; i < dropsA.length; i++) {
        p = dropsA[i];
        y = sy + p.v * (baseY - sy);
        x = cx + p.u * dressHW(p.v);
        dropPath(x, y, ds * p.s);
        ctx.fill();
      }
    } else {
      for (i = 0; i < flamesB.length; i++) {
        p = flamesB[i];
        v = 0.97;
        x = cx + p.u * dressHW(v);
        y = baseY - p.by * FH;
        var lean = Math.sin(t * 2.8 + p.ph) * FH * 0.016;
        var hs = 1 + 0.07 * Math.sin(t * 3.7 + p.ph * 1.7);
        flame(x, y, FH * 0.055 * p.w, FH * p.h * hs, lean);
      }
    }
    ctx.restore();

    // The bleed: the other figure's pattern crossing over near the
    // shared edge, alpha scaled by contact and by depth into the strip.
    if (contact > 0.003) {
      ctx.save();
      traceDress(cx);
      ctx.clip();
      if (fig.kind === 'rain') {
        for (i = 0; i < flamesOnA.length; i++) {
          p = flamesOnA[i];
          y = sy + p.v * (baseY - sy);
          x = cx + p.u * dressHW(p.v);
          var depth = (p.u - 0.40) / 0.57;
          ctx.globalAlpha = contact * (0.15 + 0.85 * depth);
          var ln = -FH * 0.010 + Math.sin(t * 2.8 + p.ph) * FH * 0.008;
          flame(x, y + FH * p.h * 0.5, FH * 0.042, FH * p.h, ln);
        }
      } else {
        ctx.fillStyle = DROP;
        var ds2 = FH * 0.046;
        for (i = 0; i < dropsOnB.length; i++) {
          p = dropsOnB[i];
          y = sy + p.v * (baseY - sy);
          x = cx + p.u * dressHW(p.v);
          var depth2 = (Math.abs(p.u) - 0.40) / 0.57;
          ctx.globalAlpha = contact * (0.15 + 0.85 * depth2);
          dropPath(x, y, ds2 * p.s);
          ctx.fill();
        }
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // Head: dark bob, skin face turned a little toward the other
    // figure, a hair fringe, two closed eyes. The expression never
    // changes, whatever the patterns do.
    var hr = FH * 0.082;
    var hcy = baseY - FH + hr * 0.92;
    var faceDir = (fig.kind === 'rain') ? 1 : -1;
    ctx.fillStyle = DARK;
    ctx.beginPath();
    ctx.ellipse(cx, hcy + hr * 0.18, hr * 1.10, hr * 1.28, 0, 0, Math.PI * 2);
    ctx.fill();
    var fcx = cx + faceDir * hr * 0.16, fcy = hcy + hr * 0.16;
    ctx.fillStyle = SKIN;
    circle(fcx, fcy, hr * 0.82);
    ctx.fill();
    ctx.fillStyle = DARK;
    ctx.beginPath();
    ctx.arc(fcx, fcy - hr * 0.12, hr * 0.86, Math.PI * 1.06, Math.PI * 1.94);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = DARK;
    ctx.lineWidth = Math.max(1.1, hr * 0.075);
    ctx.lineCap = 'round';
    for (var e = -1; e <= 1; e += 2) {
      ctx.beginPath();
      ctx.arc(fcx + e * hr * 0.30, fcy + hr * 0.02, hr * 0.155,
              Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    drawFigure(rain, t);
    drawFigure(fire, t);
    // Grain over everything, quiet.
    for (var i = 0; i < grain.length; i++) {
      var g = grain[i];
      ctx.fillStyle = g.light ? CREAM : DARK;
      ctx.globalAlpha = g.a;
      circle(g.x * W, g.y * H, g.r);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // The one word of instruction, quiet in the corner.
    var U = Math.min(W, H);
    ctx.fillStyle = CREAM;
    ctx.globalAlpha = 0.5;
    ctx.font = '600 ' + Math.round(U * 0.030) + 'px system-ui, sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag', U * 0.035, H - U * 0.032);
    ctx.globalAlpha = 1;
  }

  // One synchronous, constant first frame: figures at home, apart,
  // patterns pure, flames at phase zero. Never derived from the clock.
  resize();
  genPatterns();
  draw(0);

  // ---- Motion: positions ease toward their targets; contact eases
  // toward the value the gap implies, in fast and out slowly, so the
  // patterns bleed on approach and only slowly revert when pulled
  // apart. Flame flicker runs on elapsed time since load.
  function contactTarget() {
    var dist = (fire.cxF - rain.cxF) * W;
    var c = (touchDist() + bleedRange() * 0.85 - dist) / bleedRange();
    return Math.max(0, Math.min(1, c));
  }

  var startStamp = (typeof performance !== "undefined" && performance.now)
    ? performance.now() : 0;
  function step() {
    var tg = contactTarget();
    var rate = tg > contact ? 0.07 : 0.03;
    contact += (tg - contact) * rate;
    rain.cxF += (rain.txF - rain.cxF) * 0.18;
    fire.cxF += (fire.txF - fire.cxF) * 0.18;
    var t = ((typeof performance !== "undefined" && performance.now)
      ? performance.now() - startStamp : 0) / 1000;
    draw(t);
  }

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () { step(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }

  // ---- Interaction: drag either figure horizontally toward or away
  // from the other. A double tap reseeds the pattern density. Nothing
  // ever reloads the page.
  var dragFig = null, downAt = 0, downX = 0, lastTapAt = 0, lastTapX = 0;
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function clampTarget(fig, fx) {
    var half = (hemHW() + 10) / W;
    fx = Math.max(half, Math.min(1 - half, fx));
    var other = (lig === rain) ? fire : rain;
    var minF = minDist() / W;
    if (lig === rain) fx = Math.min(fx, other.txF - minF);
    else fx = Math.max(fx, other.txF + minF);
    return fx;
  }
  function onDown(e) {
    var p = pos(e);
    downAt = Date.now(); downX = p.x;
    var top = baseY - FH - 12, bot = baseY + 16;
    if (p.y > top && p.y < bot) {
      var da = Math.abs(p.x - rain.cxF * W);
      var db = Math.abs(p.x - fire.cxF * W);
      var fig = da <= db ? rain : fire;
      if (Math.abs(p.x - fig.cxF * W) < FH * 0.26) {
        dragFig = fig;
        interacted = true;
        fig.txF = clampTarget(fig, p.x / W);
      }
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragFig) return;
    var p = pos(e);
    dragFig.txF = clampTarget(dragFig, p.x / W);
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    var now = Date.now();
    var p = pos(e);
    var quick = (now - downAt) < 300 && Math.abs(p.x - downX) < 9;
    if (quick && (now - lastTapAt) < 350 && Math.abs(p.x - lastTapX) < 24) {
      seed += 1;
      genPatterns();
      lastTapAt = 0;
      draw(0);
    } else if (quick) {
      lastTapAt = now; lastTapX = p.x;
    }
    dragFig = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { dragFig = null; });
    canvas.addEventListener('dblclick', function () {
      seed += 1;
      genPatterns();
      draw(0);
    });
  }
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  if (typeof window !== "undefined" && window.visualViewport &&
      window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
})();
</script>
</body>
</html>
