<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.257 David from Ladakh</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0A0A09; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.257 David from Ladakh (tanzinchospel.art). His joke,
// kept straight: a grey clay David bust with curly hair
// wearing a tall, slightly worn top hat, on black. Built
// flat in canvas 2D: the bust turns on a 24 second
// turntable, the silhouette squeezing and the face planes
// drifting as it goes, a warm rim light on the clay. Tap
// reseeds the hat tilt and the curl variation only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CLAY = '#8A8A86', SHADOW = '#2A2A28', HAT = '#1E1E1E', RIM = '#D8C8A8', GROUND = '#0A0A09';
var DW = 1000, DH = 1150;
var W = 0, H = 0, phone = false;
var T = 3.4, lastNow = -1; // frame one: three-quarter turn, hat tilted, rim lit
var seed = 25701;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// ---- seeded sculpture: curls, hat pose, clay speckle -------------------------
var curls = [], speck = [], hatTilt = 0, hatYaw = 0, hatPitch = 0;
function build(sd) {
  var r = rng(sd);
  hatTilt = (r() - 0.5) * 0.30;          // the worn lean of the hat
  hatYaw = (r() - 0.5) * 26;             // brim offset in design px
  hatPitch = 0.82 + r() * 0.36;          // brim ellipse squash
  curls = [];
  // curl masses: an arc band over the crown and down both sides of the head,
  // centred on the head itself so the locks spill out under the brim
  for (var i = 0; i < 62; i++) {
    var a = Math.PI * (0.04 + 0.92 * (i / 61));       // over the top
    var band = 0.88 + r() * 0.26;
    var cx = 500 + Math.cos(a) * 152 * band;
    var cy = 428 - Math.sin(a) * 148 * band + (r() - 0.5) * 18;
    if (i % 5 === 4) { cx += (cx < 500 ? -30 : 30); cy += 44 + r() * 42; } // side locks drop lower
    curls.push({
      x: cx, y: cy,
      rad: 18 + r() * 14,
      a0: r() * Math.PI * 2,
      sweep: Math.PI * (1.1 + r() * 0.9),
      tone: r()
    });
  }
  speck = [];
  var r2 = rng(sd + 777);
  for (var j = 0; j < 1100; j++) {
    speck.push({ x: r2() * DW, y: r2() * DH, s: 0.8 + r2() * 1.7, a: 0.03 + r2() * 0.07, dark: r2() < 0.6 });
  }
}
build(seed);

// tap / double-tap: reseed hat and curls only. Never a reload.
canvas.addEventListener('pointerdown', function () {
  seed = (seed * 9301 + 49297) % 233280 + 1;
  build(seed);
});

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);

  // turntable phase: one full turn over 24 seconds
  var ph = T * Math.PI * 2 / 24;
  var turn = Math.sin(ph);              // -1..1, which way the face swings
  var face = Math.cos(ph);              // 1 front, 0 profile, -1 back
  var aface = Math.abs(face);
  var squeeze = 0.74 + 0.26 * aface;    // silhouette narrows toward profile
  var drift = turn * 30;                // features slide toward the turn
  var rimSide = face >= 0 ? 1 : -1;     // the lit edge of the clay
  var rimAmt = 0.35 + 0.65 * (1 - aface * 0.55);

  var cx = 500;

  // ---- shoulders and chest: a broad clay trapezoid ---------------------------
  ctx.save();
  ctx.translate(cx, 0);
  ctx.scale(0.82 + 0.18 * squeeze, 1);
  ctx.translate(-cx, 0);
  ctx.fillStyle = mix(CLAY, SHADOW, 0.42);
  ctx.beginPath();
  ctx.moveTo(cx - 330, DH + 6);
  ctx.bezierCurveTo(cx - 322, 880, cx - 268, 782, cx - 148, 726);
  ctx.lineTo(cx + 148, 726);
  ctx.bezierCurveTo(cx + 268, 782, cx + 322, 880, cx + 330, DH + 6);
  ctx.closePath(); ctx.fill();
  // chest plane shading: the turning side falls into shadow,
  // clipped to the torso so it can never spill past the silhouette
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx - 330, DH + 6);
  ctx.bezierCurveTo(cx - 322, 880, cx - 268, 782, cx - 148, 726);
  ctx.lineTo(cx + 148, 726);
  ctx.bezierCurveTo(cx + 268, 782, cx + 322, 880, cx + 330, DH + 6);
  ctx.closePath(); ctx.clip();
  ctx.fillStyle = rgba(SHADOW, 0.32 + 0.26 * Math.abs(turn));
  ctx.beginPath();
  ctx.moveTo(cx + drift * 0.4, 720);
  ctx.lineTo(cx + 340, 720);
  ctx.lineTo(cx + 340, DH + 4);
  ctx.lineTo(cx + drift * 0.4 + 30, DH + 4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();

  // neck
  ctx.fillStyle = mix(CLAY, SHADOW, 0.5);
  ctx.fillRect(cx - 44 * squeeze + drift * 0.3, 600, 88 * squeeze, 150);

  // ---- head: squeezed about its own centre, features drifting -----------------
  ctx.save();
  ctx.translate(cx, 430);
  ctx.scale(squeeze, 1);
  ctx.translate(-cx, -430);
  // skull
  ctx.fillStyle = CLAY;
  ctx.beginPath();
  ctx.moveTo(cx - 128, 470);
  ctx.bezierCurveTo(cx - 138, 330, cx - 96, 268, cx, 262);
  ctx.bezierCurveTo(cx + 96, 268, cx + 138, 330, cx + 128, 470);
  ctx.bezierCurveTo(cx + 118, 596, cx + 62, 648, cx, 652);
  ctx.bezierCurveTo(cx - 62, 648, cx - 118, 596, cx - 128, 470);
  ctx.closePath(); ctx.fill();
  // shadow plane on the turning-away cheek: its inner edge is a
  // bowed curve, never a straight split down the face
  ctx.fillStyle = rgba(SHADOW, 0.24 + 0.24 * Math.abs(turn));
  ctx.beginPath();
  ctx.moveTo(cx + drift * 0.5 - 6, 292);
  ctx.bezierCurveTo(cx + 96, 320, cx + 130, 420, cx + 112, 528);
  ctx.bezierCurveTo(cx + 88, 606, cx + 44, 642, cx + drift * 0.5 - 2, 648);
  ctx.bezierCurveTo(cx + drift * 0.5 + 22, 540, cx + drift * 0.5 + 20, 400, cx + drift * 0.5 - 6, 292);
  ctx.closePath(); ctx.fill();
  // brows: two short strokes, no band across the face
  ctx.strokeStyle = rgba(SHADOW, 0.5);
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - 68 + drift, 458); ctx.quadraticCurveTo(cx - 46 + drift, 450, cx - 24 + drift, 457); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 24 + drift, 457); ctx.quadraticCurveTo(cx + 46 + drift, 450, cx + 68 + drift, 458); ctx.stroke();
  // eyes: classical blank gaze, two wide shallow shadow arcs
  ctx.strokeStyle = rgba(SHADOW, 0.5);
  ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.arc(cx - 46 + drift, 478, 26, Math.PI * 1.18, Math.PI * 1.82); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 46 + drift, 478, 26, Math.PI * 1.18, Math.PI * 1.82); ctx.stroke();
  // nose: a flat plane and its shadow side
  ctx.fillStyle = mix(CLAY, '#FFFFFF', 0.10);
  ctx.beginPath();
  ctx.moveTo(cx + drift - 7, 486);
  ctx.lineTo(cx + drift + 3, 548);
  ctx.lineTo(cx + drift - 14, 556);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(SHADOW, 0.35);
  ctx.beginPath();
  ctx.moveTo(cx + drift + 3, 548);
  ctx.lineTo(cx + drift + 16, 552);
  ctx.lineTo(cx + drift - 14, 556);
  ctx.closePath(); ctx.fill();
  // mouth: one quiet line
  ctx.strokeStyle = rgba(SHADOW, 0.5);
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx - 24 + drift, 596); ctx.quadraticCurveTo(cx + drift, 602, cx + 24 + drift, 596); ctx.stroke();
  // the far ear slips out at profile, the near ear tucks away
  if (turn > 0.25) {
    ctx.fillStyle = mix(CLAY, SHADOW, 0.18);
    ctx.beginPath(); ctx.ellipse(cx - 132, 486, 13, 26, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (turn < -0.25) {
    ctx.fillStyle = mix(CLAY, SHADOW, 0.18);
    ctx.beginPath(); ctx.ellipse(cx + 132, 486, 13, 26, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // ---- curls: seeded arc clusters riding the head's squeeze --------------------
  ctx.lineCap = 'round';
  for (var i = 0; i < curls.length; i++) {
    var cu = curls[i];
    var px = cx + (cu.x - cx) * squeeze + drift * 0.35;
    ctx.strokeStyle = cu.tone < 0.5 ? rgba(SHADOW, 0.75) : rgba(mix(CLAY, SHADOW, 0.35), 0.95);
    ctx.lineWidth = 6.5;
    ctx.beginPath(); ctx.arc(px, cu.y, cu.rad, cu.a0, cu.a0 + cu.sweep); ctx.stroke();
    ctx.strokeStyle = rgba(RIM, 0.20 * rimAmt);
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(px, cu.y, cu.rad + 4, cu.a0, cu.a0 + cu.sweep * 0.6); ctx.stroke();
  }

  // ---- the top hat: cylinder and brim, tilted, breaking the top ----------------
  ctx.save();
  ctx.translate(cx + hatYaw * 0.4 + drift * 0.4, 292);
  ctx.rotate(hatTilt + turn * 0.05);
  var hw = 118 * (0.8 + 0.2 * squeeze);       // crown half width follows the turn
  // crown: tall, slightly battered
  ctx.fillStyle = HAT;
  ctx.beginPath();
  ctx.moveTo(-hw, 6);
  ctx.bezierCurveTo(-hw - 4, -110, -hw + 6, -196, -hw + 16, -228);
  ctx.lineTo(hw - 14, -234);
  ctx.bezierCurveTo(hw - 2, -194, hw + 4, -108, hw, 6);
  ctx.closePath(); ctx.fill();
  // a worn dent and a scuff, kept in the charcoal family
  ctx.fillStyle = rgba(SHADOW, 0.85);
  ctx.beginPath(); ctx.ellipse(hw * 0.34, -214, 28, 8, -0.15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(CLAY, 0.20);
  ctx.beginPath(); ctx.ellipse(-hw * 0.45, -138, 15, 27, 0.2, 0, Math.PI * 2); ctx.fill();
  // band
  ctx.fillStyle = mix(HAT, SHADOW, 0.55);
  ctx.fillRect(-hw - 2, -34, hw * 2 + 4, 30);
  // brim: a wide ellipse, squashed by the seeded pitch and the turn
  var brimR = hw + 62, brimY = brimR * 0.20 * hatPitch * (0.7 + 0.3 * squeeze);
  ctx.fillStyle = HAT;
  ctx.beginPath();
  ctx.ellipse(hatYaw * 0.3, 4, brimR, brimY, 0, 0, Math.PI * 2);
  ctx.fill();
  // a warm rim kiss along the brim's lit edge
  ctx.strokeStyle = rgba(RIM, 0.35 * rimAmt);
  ctx.lineWidth = 3;
  ctx.beginPath();
  if (rimSide > 0) ctx.ellipse(hatYaw * 0.3, 4, brimR, brimY, 0, -0.55, 0.65);
  else ctx.ellipse(hatYaw * 0.3, 4, brimR, brimY, 0, Math.PI - 0.65, Math.PI + 0.55);
  ctx.stroke();
  ctx.restore();

  // ---- warm rim light down the lit edge of head and shoulder ---------------------
  ctx.strokeStyle = rgba(RIM, 0.5 * rimAmt);
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  var rx = cx + rimSide * 122 * squeeze;
  ctx.moveTo(rx, 352);
  ctx.bezierCurveTo(rx + rimSide * 4, 440, cx + rimSide * 112 * squeeze, 505, cx + rimSide * 100 * squeeze, 566);
  ctx.stroke();
  ctx.strokeStyle = rgba(RIM, 0.30 * rimAmt);
  ctx.beginPath();
  ctx.moveTo(cx + rimSide * 300, 830);
  ctx.bezierCurveTo(cx + rimSide * 322, 950, cx + rimSide * 326, 1040, cx + rimSide * 328, DH - 4);
  ctx.stroke();

  // ---- clay speckle ---------------------------------------------------------------
  for (var j = 0; j < speck.length; j++) {
    var sp = speck[j];
    // keep the speckle on the sculpture: inside a loose bust mask
    var inHead = (Math.pow((sp.x - cx) / 170, 2) + Math.pow((sp.y - 450) / 230, 2)) < 1;
    var inBody = sp.y > 700 && Math.abs(sp.x - cx) < 350 - (sp.y - 700) * 0.02;
    if (!inHead && !inBody) continue;
    ctx.fillStyle = sp.dark ? rgba(SHADOW, sp.a) : rgba(RIM, sp.a * 0.8);
    ctx.fillRect(sp.x, sp.y, sp.s, sp.s);
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // contain-fit: the bust keeps its shape, centred on the black
  var S = Math.min(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
