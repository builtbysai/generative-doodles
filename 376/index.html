<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.376 Hydrangea Bloom</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#3E6B46; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.376 Hydrangea Bloom (al_kovalyova_design).
// After Olena Kovalova's bold-contour hydrangea tile: one giant
// hydrangea head centred on deep green #3E6B46, built from
// exactly 25 four-lobed florets in a dome cluster. Every lobe of
// every floret is filled with a flat stepped tone and stroked
// with the dark-brown contour #4A2E1E in the same draw call, so
// by construction no contourless petal exists. Petal colour is a
// stepped ramp (five flat tones from blue #9BB8D3 to lavender
// #8E7AA8) quantised from a shared light angle, never a gradient;
// five authored florets are cream #F5EFE2 highlights. Each floret
// carries a radial dot-starburst centre of cream dots (lavender
// dots on the cream florets). An ochre #D9973B stem with contour
// edges drops from the head, flanked by two ochre veined leaves.
// The canvas reads as one giant motif tile.
// Loop: a seamless 16s master loop (LOOP). Each floret pulses
// between 0.97 and 1.03 on exactly 2 whole cycles per loop with
// an authored staggered phase, so frame 16s is pixel-identical
// to frame 0 at rest.
// Interaction: DRAG across the head drops damped radial ripples
// at the pointer path: florets are displaced outward from each
// ripple centre on a decaying sine, and once a ripple dies the
// displacement is exactly zero and the head settles back to its
// authored layout. DOUBLE-TAP advances the light direction
// through a fixed table of three: top-lit blue, bottom-lit
// lavender, all-cream; only the stepped-tone mapping changes.
// Taps are state changes only, never a reload. No text, no
// labels, no chrome.
// Flat colour only, one canvas, all marks drawn directly each
// frame from the authored tables below.
// Determinism: the first frame is drawn synchronously at the
// constant phase T = 5.7 (head developed, pulses mid-wave),
// never Date.now() minus an offset, and the animation advances
// from that anchor in fixed 1/60 ticks.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var LOOP = 16;
var TAU = Math.PI * 2;
var PAGE = '#3E6B46';
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 5.7, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- palette -----------------------------------------------------------
var GROUND = '#3E6B46';
var CONTOUR = '#4A2E1E';
var CREAM = '#F5EFE2';
var OCHRE = '#D9973B';
// The stepped petal ramp: five flat tones from blue to lavender.
var RAMP = ['#9BB8D3', '#9AABC9', '#959DBF', '#908FB4', '#8E7AA8'];
var LAV = '#8E7AA8';

// ---- the light-direction table ------------------------------------------
// DOUBLE-TAP advances through these three authored lightings.
// 'top': light vector points up, top florets take the blue steps.
// 'bottom': light vector points down, bottom florets take lavender.
// 'cream': every floret is cream regardless of position.
var LIGHTS = [
  { name: 'top-lit blue', lx: 0, ly: -1, all: false },
  { name: 'bottom-lit lavender', lx: 0, ly: 1, all: false },
  { name: 'all-cream', lx: 0, ly: 0, all: true }
];
var lightIdx = 0;

// ---- the floret table -----------------------------------------------------
// Exactly 25 florets in a dome around the head centre (640, 420):
// a centre floret, a ring of 6 at 120, 6 accents at 178, and an
// outer ring of 12 at 235. dx/dy are design px from the head
// centre, r is the floret radius, cream marks the authored cream
// highlight florets, ph is the pulse phase stagger.
var HEAD_X = 640, HEAD_Y = 420;
var FLORETS = [
  { dx: 0,    dy: 0,    r: 95, cream: false, ph: 0.0 },
  { dx: 0,    dy: -120, r: 88, cream: false, ph: 0.9 },
  { dx: 104,  dy: -60,  r: 88, cream: false, ph: 1.8 },
  { dx: 104,  dy: 60,   r: 88, cream: true,  ph: 2.7 },
  { dx: 0,    dy: 120,  r: 88, cream: false, ph: 3.6 },
  { dx: -104, dy: 60,   r: 88, cream: false, ph: 4.5 },
  { dx: -104, dy: -60,  r: 88, cream: false, ph: 5.4 },
  { dx: 89,   dy: -154, r: 66, cream: false, ph: 0.5 },
  { dx: 178,  dy: 0,    r: 66, cream: true,  ph: 1.4 },
  { dx: 89,   dy: 154,  r: 66, cream: false, ph: 2.3 },
  { dx: -89,  dy: 154,  r: 66, cream: false, ph: 3.2 },
  { dx: -178, dy: 0,    r: 66, cream: false, ph: 4.1 },
  { dx: -89,  dy: -154, r: 66, cream: false, ph: 5.0 },
  { dx: 0,    dy: -235, r: 78, cream: false, ph: 0.3 },
  { dx: 118,  dy: -204, r: 78, cream: false, ph: 1.2 },
  { dx: 204,  dy: -118, r: 78, cream: true,  ph: 2.1 },
  { dx: 235,  dy: 0,    r: 78, cream: false, ph: 3.0 },
  { dx: 204,  dy: 118,  r: 78, cream: false, ph: 3.9 },
  { dx: 118,  dy: 204,  r: 78, cream: false, ph: 4.8 },
  { dx: 0,    dy: 235,  r: 78, cream: true,  ph: 5.7 },
  { dx: -118, dy: 204,  r: 78, cream: false, ph: 0.6 },
  { dx: -204, dy: 118,  r: 78, cream: true,  ph: 1.5 },
  { dx: -235, dy: 0,    r: 78, cream: false, ph: 2.4 },
  { dx: -204, dy: -118, r: 78, cream: false, ph: 3.3 },
  { dx: -118, dy: -204, r: 78, cream: false, ph: 4.2 }
];
if (FLORETS.length !== 25) throw new Error('Hydrangea Bloom needs exactly 25 florets');
var DOME_R = 313; // outer reach of the dome, for tone normalising

function floretTone(f) {
  var L = LIGHTS[lightIdx];
  if (L.all || f.cream) return CREAM;
  var d = (f.dx * L.lx + f.dy * L.ly) / DOME_R; // -1..1 toward the light
  var step = Math.floor(((d + 1) / 2) * RAMP.length);
  if (step < 0) step = 0;
  if (step > RAMP.length - 1) step = RAMP.length - 1;
  // At the light side (step at its max) the tone is the named
  // end of the ramp: the light blue step for top-lit, the
  // lavender step for bottom-lit.
  return L.ly > 0 ? RAMP[step] : RAMP[RAMP.length - 1 - step];
}

// ---- ripples ---------------------------------------------------------------
// Each pointer-drag contact drops a ripple {x, y, t0} in design
// coords. A floret's displacement is the sum over live ripples of
// a damped radial sine; when a ripple's age passes RIPPLE_LIFE it
// is removed outright, so the settled displacement is exactly 0.
var ripples = [];
var RIPPLE_LIFE = 3.5;
function rippleOffset(x, y) {
  var ox = 0, oy = 0, i, rp, dx, dy, d, infl;
  for (i = 0; i < ripples.length; i++) {
    rp = ripples[i];
    dx = x - rp.x; dy = y - rp.y;
    d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1) continue;
    infl = 16 * Math.sin(d * 0.020 - (T - rp.t0) * 6.0)
      * Math.exp(-(T - rp.t0) * 1.8) * Math.exp(-d / 260);
    ox += (dx / d) * infl;
    oy += (dy / d) * infl;
  }
  return { x: ox, y: oy };
}

// ---- drawing -----------------------------------------------------------------

function drawLeaf(cx, cy, len, wid, ang) {
  // One ochre leaf: pointed-oval blade, contour edge, midrib and
  // veins in the contour colour.
  var i, s;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(wid, -len * 0.42, 0, -len);
  ctx.quadraticCurveTo(-wid, -len * 0.42, 0, 0);
  ctx.closePath();
  ctx.fillStyle = OCHRE;
  ctx.fill();
  ctx.strokeStyle = CONTOUR;
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -6);
  ctx.lineTo(0, -len + 10);
  ctx.stroke();
  ctx.lineWidth = 2.5;
  for (i = 1; i <= 4; i++) {
    var ly = -len * (0.2 + 0.17 * i);
    var spread = wid * (0.60 - 0.10 * i);
    for (s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.moveTo(0, ly);
      ctx.quadraticCurveTo(s * spread * 0.55, ly - len * 0.05, s * spread, ly - len * 0.13);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawStemAndLeaves() {
  // Ochre stem with contour edges, curving from under the head
  // down to the tile's bottom edge, leaves flanking its base.
  ctx.strokeStyle = CONTOUR;
  ctx.lineCap = 'round';
  ctx.lineWidth = 20;
  ctx.beginPath();
  ctx.moveTo(HEAD_X, HEAD_Y + 190);
  ctx.quadraticCurveTo(HEAD_X + 14, HEAD_Y + 330, HEAD_X, DH);
  ctx.stroke();
  ctx.strokeStyle = OCHRE;
  ctx.lineWidth = 13;
  ctx.beginPath();
  ctx.moveTo(HEAD_X, HEAD_Y + 190);
  ctx.quadraticCurveTo(HEAD_X + 14, HEAD_Y + 330, HEAD_X, DH);
  ctx.stroke();
  drawLeaf(HEAD_X - 18, HEAD_Y + 356, 250, 62, -2.05);
  drawLeaf(HEAD_X + 18, HEAD_Y + 356, 250, 62, 2.05);
}

function drawFloret(f, t) {
  var cx = HEAD_X + f.dx, cy = HEAD_Y + f.dy;
  var off = rippleOffset(cx, cy);
  cx += off.x; cy += off.y;
  var pulse = 1 + 0.03 * Math.sin(TAU * 2 * (t / LOOP) + f.ph);
  var R = f.r * pulse;
  var tone = floretTone(f);
  var lw = Math.max(3, Math.min(5, R * 0.05));
  var k, a, lx, ly;
  // Pass 1: fill all four lobes. Pass 2: stroke all four lobes.
  // The contour pass is part of the same construction, so every
  // petal edge carries the contour; none can be contourless.
  ctx.fillStyle = tone;
  for (k = 0; k < 4; k++) {
    a = -Math.PI / 2 + k * (TAU / 4) + 0.22;
    lx = cx + Math.cos(a) * R * 0.47;
    ly = cy + Math.sin(a) * R * 0.47;
    ctx.beginPath();
    ctx.arc(lx, ly, R * 0.55, 0, TAU);
    ctx.fill();
  }
  ctx.strokeStyle = CONTOUR;
  ctx.lineWidth = lw;
  for (k = 0; k < 4; k++) {
    a = -Math.PI / 2 + k * (TAU / 4) + 0.22;
    lx = cx + Math.cos(a) * R * 0.47;
    ly = cy + Math.sin(a) * R * 0.47;
    ctx.beginPath();
    ctx.arc(lx, ly, R * 0.55, 0, TAU);
    ctx.stroke();
  }
  // Radial dot-starburst centre: eight dots around a centre dot.
  ctx.fillStyle = (tone === CREAM) ? LAV : CREAM;
  for (k = 0; k < 8; k++) {
    a = k * (TAU / 8) + 0.2;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * R * 0.27, cy + Math.sin(a) * R * 0.27, R * 0.070, 0, TAU);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.085, 0, TAU);
  ctx.fill();
}

function draw(t) {
  var i;
  // Drop dead ripples so the head settles to exactly its layout.
  for (i = ripples.length - 1; i >= 0; i--) {
    if (T - ripples[i].t0 > RIPPLE_LIFE) ripples.splice(i, 1);
  }
  drawStemAndLeaves();
  // Dome order: outer ring first, centre last, so nearer florets
  // overlap farther ones like a real hydrangea head.
  for (i = 13; i < FLORETS.length; i++) drawFloret(FLORETS[i], t);
  for (i = 7; i < 13; i++) drawFloret(FLORETS[i], t);
  for (i = 1; i < 7; i++) drawFloret(FLORETS[i], t);
  drawFloret(FLORETS[0], t);
}

// ---- sizing -------------------------------------------------------------------

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- pointer: drag ripples, double-tap moves the light -------------------------
// A press that moves less than TAP_SLOP design px is a tap; two
// taps within DTAP_MS are a double-tap. Dragging drops a ripple
// every RIPPLE_STEP design px of travel.

var TAP_SLOP = 12, DTAP_MS = 350, RIPPLE_STEP = 26;
var downInfo = null, lastTapAt = -1e9, lastRippleAt = null;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downInfo = { x: p.x, y: p.y, dragged: false };
  lastRippleAt = { x: p.x, y: p.y };
});
canvas.addEventListener('pointermove', function (e) {
  if (!downInfo) return;
  var p = toDesign(e);
  var moved = Math.sqrt((p.x - downInfo.x) * (p.x - downInfo.x) + (p.y - downInfo.y) * (p.y - downInfo.y));
  if (moved >= TAP_SLOP) downInfo.dragged = true;
  if (downInfo.dragged && lastRippleAt) {
    var d = Math.sqrt((p.x - lastRippleAt.x) * (p.x - lastRippleAt.x) + (p.y - lastRippleAt.y) * (p.y - lastRippleAt.y));
    if (d >= RIPPLE_STEP) {
      ripples.push({ x: p.x, y: p.y, t0: T });
      lastRippleAt = { x: p.x, y: p.y };
    }
  }
});
function endPointer(e, cancelled) {
  if (!downInfo) return;
  var info = downInfo;
  downInfo = null; lastRippleAt = null;
  if (cancelled || info.dragged) return;
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  if (now - lastTapAt < DTAP_MS) {
    lightIdx = (lightIdx + 1) % LIGHTS.length;
    lastTapAt = -1e9;
  } else {
    lastTapAt = now;
  }
}
canvas.addEventListener('pointerup', function (e) { endPointer(e, false); });
canvas.addEventListener('pointercancel', function (e) { endPointer(e, true); });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Centred fit: the tile keeps its shape at any aspect and the
  // page ground stays the piece's deep green.
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAGE;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
})();
</script>
</body>
</html>
