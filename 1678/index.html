<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seed Library, Crowded Room</title>
<style>
html, body { margin: 0; padding: 0; background: #EFE2CB; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#EFE2CB';
var RING = '#D97B2B';
var FIELD_EDGE = '#B06A24';
var PLATE = '#3D2A18';
var PLATE_LINE = 'rgba(239,226,203,0.45)';
var PLATE_INK = '#EFE2CB';
var FIRST_T = 100;
var GROW_SECS = 20;
var IDLE_SECS = 120;
/* DRIVER: one algorithm, many seeds; the seed is the artwork.
   A single circle-packing algorithm grows concentric-ringed
   circles in one orange hue on warm beige. Twelve curated seeds
   sit in a strip along the bottom edge. Picking a seed regrows
   the main field from that seed, rings expanding outward from
   the field centre over about twenty seconds. Same rules,
   different dice. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* Twelve hand-picked seeds, chosen to show the range of the
   algorithm: sparse to crowded, large rings to fine ones. */
var SEEDS = [167801, 167813, 167827, 167839, 167851, 167863,
             167877, 167889, 167903, 167917, 167929, 167941];
var DEFAULT_SEED = 0;
var layouts = {};
/* One packing per seed, in unit field space (0..1). Centres,
   radii, ring counts and ring offsets all come from the seed. */
function buildLayout(si) {
  if (layouts[si]) return layouts[si];
  var rng = mulberry32(SEEDS[si]);
  var target = 34 + Math.floor(rng() * 14);
  var radii = [], i, r;
  for (i = 0; i < target; i++) {
    r = 0.018 + 0.050 * Math.pow(rng(), 1.6);
    radii.push(r);
  }
  radii.sort(function (a, b) { return b - a; });
  var circles = [], placed = 0, tries = 0;
  var gap = 0.008;
  while (placed < target && tries < target * 60) {
    tries++;
    r = radii[placed];
    var cx = 0.04 + r + rng() * (0.92 - 2 * r);
    var cy = 0.04 + r + rng() * (0.92 - 2 * r);
    if (cx - r < 0.04 || cx + r > 0.96 || cy - r < 0.04 || cy + r > 0.96) continue;
    var ok = true, j;
    for (j = 0; j < circles.length; j++) {
      var dx = cx - circles[j].x, dy = cy - circles[j].y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < r + circles[j].r + gap) { ok = false; break; }
    }
    if (!ok) continue;
    var rings = 2 + Math.floor(rng() * 4);
    var offs = [], k;
    for (k = 0; k < rings; k++) {
      offs.push({ x: (rng() - 0.5) * r * 0.22, y: (rng() - 0.5) * r * 0.22 });
    }
    var dist = Math.sqrt((cx - 0.5) * (cx - 0.5) + (cy - 0.5) * (cy - 0.5));
    circles.push({
      x: cx, y: cy, r: r, rings: rings, offs: offs,
      dist: dist, jit: rng() * 0.06,
      dot: rng() < 0.5
    });
    placed++;
  }
  var lay = { circles: circles };
  layouts[si] = lay;
  return lay;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Square main field between the plates above and the strip below,
   generous margins, centred in the free band. */
function fieldRect() {
  var stripH = isPhone ? 96 : 110;
  var topBand = isPhone ? 104 : 84;
  var regionTop = topBand, regionBottom = VH - stripH - 12;
  var s = Math.min(VW - (isPhone ? 32 : 80), regionBottom - regionTop);
  var cx = VW / 2;
  var cy = (regionTop + regionBottom) / 2;
  return { x: cx - s / 2, y: cy - s / 2, s: s, cx: cx, cy: cy, stripH: stripH };
}
function stripGeom(f) {
  var gap = isPhone ? 6 : 8;
  var availW = VW - 32;
  /* Fit all twelve when they stay legible; otherwise keep the
     strip at full height and let it scroll. */
  var fitTh = Math.floor((availW + gap) / SEEDS.length - gap);
  var th = fitTh >= 44 ? Math.min(f.stripH - 28, fitTh) : f.stripH - 28;
  var totalW = SEEDS.length * (th + gap) - gap;
  var x0 = totalW <= availW ? (VW - totalW) / 2 : 16;
  return {
    th: th, gap: gap, totalW: totalW, availW: availW, x0: x0,
    y: VH - f.stripH + 14
  };
}
var curSeed = DEFAULT_SEED;
var growStart = FIRST_T - GROW_SECS - 5;
var lastInteract = FIRST_T;
var clockT = FIRST_T;
var scrollX = 0;
var maxScroll = 0;
function growthAt(t) {
  if (reduced) return 1;
  return smooth(clamp((t - growStart) / GROW_SECS, 0, 1));
}
function selectSeed(si, t) {
  if (si === curSeed && growthAt(t) >= 1) return;
  curSeed = si;
  growStart = t;
  lastInteract = t;
}
/* Draw one packing into a rect of side s at (ox, oy). p is the
   growth fraction: circles reveal from the centre outward, and
   each circle's rings expand outward in turn. */
function drawPacking(si, ox, oy, s, p) {
  var lay = buildLayout(si);
  var i, j;
  for (i = 0; i < lay.circles.length; i++) {
    var c = lay.circles[i];
    var th = 0.08 + 0.82 * (c.dist / 0.72) + c.jit;
    var local = clamp((p * 1.25 - th) / 0.25, 0, 1);
    if (local <= 0) continue;
    var cx = ox + c.x * s, cy = oy + c.y * s;
    for (j = 0; j < c.rings; j++) {
      var jf = clamp(local * c.rings - j, 0, 1);
      if (jf <= 0) continue;
      var rr = c.r * (j + 1) / c.rings * s * smooth(jf);
      if (rr < 0.5) continue;
      ctx.strokeStyle = RING;
      ctx.lineWidth = Math.max(1, s * 0.004 * (1 + (c.rings - j) * 0.25));
      ctx.beginPath();
      ctx.moveTo(cx + c.offs[j].x * s + rr, cy + c.offs[j].y * s);
      ctx.arc(cx + c.offs[j].x * s, cy + c.offs[j].y * s, rr, 0, TAU);
      ctx.stroke();
    }
    if (c.dot && local >= 1) {
      var dr = c.r * 0.16 * s;
      if (dr >= 0.75) {
        ctx.fillStyle = RING;
        ctx.beginPath();
        ctx.moveTo(cx + dr, cy);
        ctx.arc(cx, cy, dr, 0, TAU);
        ctx.fill();
      }
    }
  }
}
function thumbRect(sg, i) {
  return {
    x: sg.x0 + i * (sg.th + sg.gap) - scrollX,
    y: sg.y, s: sg.th
  };
}
function drawStrip(f) {
  var sg = stripGeom(f);
  maxScroll = Math.max(0, sg.totalW - sg.availW);
  scrollX = clamp(scrollX, 0, maxScroll);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, VH - f.stripH, VW, f.stripH);
  ctx.clip();
  var i;
  for (i = 0; i < SEEDS.length; i++) {
    var tr = thumbRect(sg, i);
    if (tr.x + tr.s < 0 || tr.x > VW) continue;
    ctx.fillStyle = PAPER;
    ctx.fillRect(tr.x, tr.y, tr.s, tr.s);
    drawPacking(i, tr.x, tr.y, tr.s, 1);
    ctx.strokeStyle = i === curSeed ? '#7A3E12' : FIELD_EDGE;
    ctx.lineWidth = i === curSeed ? 3 : 1;
    ctx.strokeRect(tr.x + 0.5, tr.y + 0.5, tr.s - 1, tr.s - 1);
  }
  ctx.restore();
  /* Fade at the strip edges when the strip scrolls. */
  if (maxScroll > 0) {
    ctx.fillStyle = PAPER;
    if (scrollX > 0) ctx.fillRect(0, sg.y, 14, sg.th);
    if (scrollX < maxScroll) ctx.fillRect(VW - 14, sg.y, 14, sg.th);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Seed Library, Crowded Room').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Seed Library, Crowded Room').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 16').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Seed Library, Crowded Room', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2006 · 08 · 16', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap a seed to regrow the field.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  /* On a phone the two plates would collide side by side, so the
     hint stacks under the title at the left. */
  var hintPlateX = isPhone ? 12 : VW - hintPlateW - 12;
  var hintPlateY = isPhone ? plateY + plateH + 8 : 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  /* Idle two minutes: advance to the next seed on its own. */
  if (!reduced && t - lastInteract >= IDLE_SECS && growthAt(t) >= 1) {
    selectSeed((curSeed + 1) % SEEDS.length, t);
  }
  var f = fieldRect();
  var p = growthAt(t);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  drawPacking(curSeed, f.x, f.y, f.s, p);
  ctx.strokeStyle = FIELD_EDGE;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(f.x + 0.5, f.y + 0.5, f.s - 1, f.s - 1);
  drawStrip(f);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
/* Tap a thumbnail to regrow from that seed; drag the strip to
   scroll it when it overflows. A tap is a short press with
   almost no movement. */
var downX = 0, downY = 0, downT = 0, dragging = false, moved = false;
function evtPos(e) {
  var r = { x: 0, y: 0 };
  if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
  else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
  return r;
}
function onDown(e) {
  var pos = evtPos(e);
  downX = pos.x; downY = pos.y; downT = clockT; dragging = true; moved = false;
}
function onMove(e) {
  if (!dragging) return;
  var pos = evtPos(e);
  var dx = pos.x - downX;
  if (Math.abs(dx) > 6) moved = true;
  if (moved) {
    scrollX = clamp(scrollX - dx, 0, maxScroll);
    downX = pos.x;
    draw(clockT);
  }
}
function onUp(e) {
  if (!dragging) return;
  dragging = false;
  if (moved) return;
  var pos = evtPos(e);
  var f = fieldRect();
  var sg = stripGeom(f);
  var i;
  for (i = 0; i < SEEDS.length; i++) {
    var tr = thumbRect(sg, i);
    if (pos.x >= tr.x && pos.x <= tr.x + tr.s &&
        pos.y >= tr.y && pos.y <= tr.y + tr.s) {
      selectSeed(i, clockT);
      draw(clockT);
      return;
    }
  }
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    seedCount: function () { return SEEDS.length; },
    circleCount: function (si) { return buildLayout(si).circles.length; },
    selectSeed: function (si, t) { selectSeed(si, t); },
    growthAt: function (t) { return growthAt(t); }
  };
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('touchstart', onDown);
    canvas.addEventListener('touchmove', onMove);
    canvas.addEventListener('touchend', onUp);
  }
}
/* ---- frame one: t = FIRST_T, default seed fully grown ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
