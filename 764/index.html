<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vapor Drawing</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #2E2C29;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Strict palette. Nothing else is ever drawn.
  var SOOT  = [46, 44, 41];      // #2E2C29 ground
  var GRAY  = [122, 126, 131];   // #7A7E83 film gray
  var AMBER = [232, 163, 61];    // #E8A33D column base
  var PAPER = [245, 242, 234];   // #F5F2EA paper white
  var BLUE  = [95, 126, 148];    // #5F7E94 blue film shift
  var GOLD  = [216, 180, 106];   // #D8B46A interference tick
  var FRAME = [13, 13, 12];      // float frame, near-black
  var SHADE = [24, 23, 21];      // shard underlay / lift shadow tone

  var SHIMMER_PERIOD = 20;       // seconds, heat-haze cycle

  function cl(v) { return Math.max(0, Math.min(255, Math.round(v))); }
  function rgbString(c, a) {
    if (typeof a === 'number') {
      return 'rgba(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ',' + a + ')';
    }
    return 'rgb(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ')';
  }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function mix(c1, c2, u) {
    return [lerp(c1[0], c2[0], u), lerp(c1[1], c2[1], u), lerp(c1[2], c2[2], u)];
  }
  function smooth(u) {
    if (u <= 0) return 0;
    if (u >= 1) return 1;
    return u * u * (3 - 2 * u);
  }

  // Seeded RNG (mulberry32). All geometry and grain come from this stream,
  // precomputed once; nothing at draw time is random.
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var z = s;
      z = Math.imul(z ^ (z >>> 15), z | 1);
      z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
      return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Torn polygon -------------------------------------------------------
  // A shard outline in unit space: vertices around an elongated centre,
  // radius modulated by two low-frequency sine octaves (seeded phases) plus
  // fine jitter, with one or two vertices bitten inward. Low frequency is
  // what makes the edge read torn rather than geometric or merely wobbly.
  function tornShard(rng, cx, cy, rx, ry, rot, bites) {
    var n = 16 + Math.floor(rng() * 6);
    var p1 = rng() * Math.PI * 2, p2 = rng() * Math.PI * 2;
    var a1 = 0.16 + rng() * 0.16, a2 = 0.08 + rng() * 0.10;
    var biteAt = {};
    var nb = bites || 0;
    for (var b = 0; b < nb; b++) biteAt[Math.floor(rng() * n)] = 0.45 + rng() * 0.2;
    var pts = [];
    for (var i = 0; i < n; i++) {
      var th = (i / n) * Math.PI * 2;
      var m = 1 + a1 * Math.sin(2 * th + p1) + a2 * Math.sin(3 * th + p2)
              + (rng() - 0.5) * 0.10;
      if (biteAt[i]) m *= biteAt[i];
      var ex = Math.cos(th) * rx * m, ey = Math.sin(th) * ry * m;
      var cr = Math.cos(rot), sr = Math.sin(rot);
      pts.push([cx + ex * cr - ey * sr, cy + ex * sr + ey * cr]);
    }
    return pts;
  }

  function tracePath(pts, ox, oy, s) {
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var x = ox + pts[i][0] * s, y = oy + pts[i][1] * s;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function pointInPoly(pts, x, y) {
    var inside = false;
    for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
      if (((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  // ---- Precomputed composition (unit portrait space, 600 x 800) -----------
  var UW = 600, UH = 800;
  var rng = mulberry32(764246); // Vapor Drawing #246 nod, fixed forever

  // Film grain: seeded speckle, dark and light, very low alpha.
  var GRAIN = [];
  (function () {
    var r = mulberry32(9182);
    for (var i = 0; i < 2600; i++) {
      GRAIN.push([r(), r(), r()]);
    }
  })();

  // Amber column: horizontal flat bands stepping amber to paper white,
  // bottom (amber) to top (white), with slightly jittered side edges so the
  // column reads as a film strip laid on the ground, not a vector bar.
  var COLUMN = (function () {
    var bands = [];
    var r = mulberry32(5177);
    var NB = 9;
    var x0 = 262, x1 = 356, y0 = 66, y1 = 742;
    for (var i = 0; i < NB; i++) {
      var v0 = i / NB, v1 = (i + 1) / NB;
      // v measured from the top; colour step runs white at top to amber low.
      var u = 1 - (v0 + v1) / 2;
      bands.push({
        yT: y0 + (y1 - y0) * v0, yB: y0 + (y1 - y0) * v1,
        lxT: x0 + (r() - 0.5) * 7, lxB: x0 + (r() - 0.5) * 7,
        rxT: x1 + (r() - 0.5) * 7, rxB: x1 + (r() - 0.5) * 7,
        col: mix(AMBER, PAPER, Math.pow(u, 1.25))
      });
    }
    return bands;
  })();

  // Torn shards clustered centre-right. kind: 'blue' | 'gray' | 'pale'.
  // Gold ticks are stored as [shardIndex, edgeIndex, t0, t1] fractions
  // along an edge, resolved at draw time so they ride the shimmer and lift.
  var SHARDS = [];
  var TICKS = [];
  (function () {
    var defs = [
      { cx: 408, cy: 196, rx: 118, ry: 40, rot: -0.32, kind: 'blue',  bites: 2, alpha: 0.88 },
      { cx: 452, cy: 322, rx: 96,  ry: 54, rot: 0.22,  kind: 'gray',  bites: 1, alpha: 0.92 },
      { cx: 388, cy: 436, rx: 130, ry: 34, rot: 0.10,  kind: 'blue',  bites: 2, alpha: 0.85 },
      { cx: 470, cy: 520, rx: 82,  ry: 62, rot: -0.18, kind: 'pale',  bites: 1, alpha: 0.95 },
      { cx: 420, cy: 636, rx: 108, ry: 38, rot: 0.42,  kind: 'gray',  bites: 2, alpha: 0.90 },
      { cx: 356, cy: 268, rx: 62,  ry: 26, rot: 0.65,  kind: 'pale',  bites: 1, alpha: 0.9 },
      { cx: 492, cy: 428, rx: 58,  ry: 30, rot: -0.55, kind: 'blue',  bites: 1, alpha: 0.85 }
    ];
    var cols = { blue: BLUE, gray: GRAY, pale: mix(GRAY, PAPER, 0.45) };
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      SHARDS.push({
        pts: tornShard(rng, d.cx, d.cy, d.rx, d.ry, d.rot, d.bites),
        col: cols[d.kind], alpha: d.alpha, layer: 1 + (i % 3)
      });
    }
    // Gold interference ticks on a few shard edges.
    var tickDefs = [[0, 3], [0, 9], [2, 5], [3, 7], [4, 2], [5, 4]];
    for (var k = 0; k < tickDefs.length; k++) {
      TICKS.push({ shard: tickDefs[k][0], edge: tickDefs[k][1],
                   t0: 0.18 + rng() * 0.2, t1: 0.62 + rng() * 0.25 });
    }
  })();

  // The one large white paper shard, lower-left: a hole cut in the dark.
  var PAPER_SHARD = tornShard(rng, 194, 600, 118, 100, 0.28, 2);

  // ---- Lift state (tap-hold) ----------------------------------------------
  // Events are recorded with the piece clock; lift for a shard is a
  // closed-form function of its event list and t, so any frame is
  // reproducible from (events, t). Frame one has no events: lift 0.
  var liftEvents = {}; // shardIndex -> [{down:bool, t:seconds}]
  var clockT = 0;

  function liftAt(idx, t) {
    var evs = liftEvents[idx];
    if (!evs || !evs.length) return 0;
    var val = 0, since = null, target = 0;
    for (var i = 0; i < evs.length; i++) {
      var e = evs[i];
      if (e.t > t) break;
      if (since !== null) val = lerp(val, target, smooth((e.t - since) / 0.28));
      since = e.t;
      target = e.down ? 1 : 0;
    }
    if (since === null) return 0;
    return lerp(val, target, smooth((t - since) / 0.28));
  }

  // ---- Layout ---------------------------------------------------------------
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  // Composition rect: portrait column (3:4) centred in the frame inset;
  // on portrait viewports it fills the inset. Returns geometry + mapping.
  function layout() {
    var f = Math.max(9, Math.min(W, H) * (isPhone() ? 0.022 : 0.016));
    var ix = f, iy = f, iw = W - 2 * f, ih = H - 2 * f;
    var cw, ch;
    if (iw / ih > UW / UH) { ch = ih; cw = ih * UW / UH; }
    else { cw = iw; ch = iw * UH / UW; }
    var cx = ix + (iw - cw) / 2, cy = iy + (ih - ch) / 2;
    return { f: f, cx: cx, cy: cy, cw: cw, ch: ch, s: cw / UW };
  }

  // Heat-haze shimmer: whole-layer offsets, amplitude under 2 px, zero at
  // t = 0 (single shared sine gate, per-layer direction), 20 s cycle.
  function layerOffset(layer, t, s) {
    var g = Math.sin(2 * Math.PI * t / SHIMMER_PERIOD);
    var dirs = [[0, 0], [1.5, 0.6], [-1.1, 1.4], [0.7, -1.6]];
    var d = dirs[layer % dirs.length];
    return [d[0] * g * s / (UW / 600), d[1] * g * s / (UW / 600)];
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var L = layout();
    var s = L.s;

    // Page ground: soot everywhere (desktop side margins included).
    ctx.fillStyle = rgbString(SOOT);
    ctx.fillRect(0, 0, W, H);

    // Composition ground inside the column.
    ctx.fillStyle = rgbString(SOOT);
    ctx.fillRect(L.cx, L.cy, L.cw, L.ch);

    // Film grain over the ground (static layer; no shimmer).
    var i, g;
    for (i = 0; i < GRAIN.length; i++) {
      g = GRAIN[i];
      var gx = L.cx + g[0] * L.cw, gy = L.cy + g[1] * L.ch;
      ctx.fillStyle = g[2] > 0.5
        ? 'rgba(0,0,0,' + (0.05 + g[2] * 0.05).toFixed(3) + ')'
        : 'rgba(245,242,234,' + (0.02 + g[2] * 0.03).toFixed(3) + ')';
      ctx.fillRect(gx, gy, Math.max(1, s * 1.6), Math.max(1, s * 1.6));
    }

    // Amber column (layer 1).
    var off = layerOffset(1, t, s);
    var ox = L.cx + off[0], oy = L.cy + off[1];
    for (i = 0; i < COLUMN.length; i++) {
      var b = COLUMN[i];
      ctx.beginPath();
      ctx.moveTo(ox + b.lxT * s, oy + b.yT * s);
      ctx.lineTo(ox + b.rxT * s, oy + b.yT * s);
      ctx.lineTo(ox + b.rxB * s, oy + b.yB * s);
      ctx.lineTo(ox + b.lxB * s, oy + b.yB * s);
      ctx.closePath();
      ctx.fillStyle = rgbString(b.col);
      ctx.fill();
    }

    // White paper shard (layer 2): flat paper, faint darker underlay on
    // its lower edge so it sits ON the soot rather than glowing.
    off = layerOffset(2, t, s);
    ox = L.cx + off[0]; oy = L.cy + off[1];
    tracePath(PAPER_SHARD, ox + 2.5 * s / (UW / 600), oy + 3.5 * s / (UW / 600), s);
    ctx.fillStyle = rgbString(SHADE, 0.55);
    ctx.fill();
    tracePath(PAPER_SHARD, ox, oy, s);
    ctx.fillStyle = rgbString(PAPER);
    ctx.fill();

    // Torn film shards (layers 1..3), each with a 1 px underlay for depth,
    // plus its lift offset and soft layered shadow while held.
    for (i = 0; i < SHARDS.length; i++) {
      var sh = SHARDS[i];
      var lift = liftAt(i, t);
      off = layerOffset(sh.layer, t, s);
      var bx = L.cx + off[0], by = L.cy + off[1];
      var lx = -2.2 * lift * s / (UW / 600), ly = -3.2 * lift * s / (UW / 600);
      if (lift > 0.01) {
        var steps = [6, 4, 2], alphas = [0.05, 0.08, 0.12];
        for (var q = 0; q < 3; q++) {
          tracePath(sh.pts, bx + lx * 0.3, by + (ly * 0.3) + steps[q] * lift * s / (UW / 600), s);
          ctx.fillStyle = rgbString(SHADE, alphas[q]);
          ctx.fill();
        }
      }
      tracePath(sh.pts, bx + lx + 1 * s / (UW / 600), by + ly + 1.2 * s / (UW / 600), s);
      ctx.fillStyle = rgbString(SHADE, 0.4);
      ctx.fill();
      tracePath(sh.pts, bx + lx, by + ly, s);
      ctx.fillStyle = rgbString(sh.col, sh.alpha);
      ctx.fill();
      sh._bx = bx + lx; sh._by = by + ly; // resolved origin for ticks
    }

    // Gold interference ticks along chosen shard edges.
    ctx.lineCap = 'round';
    for (i = 0; i < TICKS.length; i++) {
      var tk = TICKS[i];
      var pts = SHARDS[tk.shard].pts;
      var n = pts.length;
      var a = pts[tk.edge % n], c = pts[(tk.edge + 1) % n];
      var bx2 = SHARDS[tk.shard]._bx || L.cx, by2 = SHARDS[tk.shard]._by || L.cy;
      var x1 = bx2 + lerp(a[0], c[0], tk.t0) * s, y1 = by2 + lerp(a[1], c[1], tk.t0) * s;
      var x2 = bx2 + lerp(a[0], c[0], tk.t1) * s, y2 = by2 + lerp(a[1], c[1], tk.t1) * s;
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.strokeStyle = rgbString(GOLD, 0.28);
      ctx.lineWidth = Math.max(2.5, 4.2 * s / (UW / 600));
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.strokeStyle = rgbString(GOLD, 0.9);
      ctx.lineWidth = Math.max(1.2, 2 * s / (UW / 600));
      ctx.stroke();
    }

    // Thin black float frame: a dark border inset around the whole canvas,
    // with a hairline inner lip. Drawn last so every layer sits inside it.
    ctx.fillStyle = rgbString(FRAME);
    var f = L.f;
    ctx.fillRect(0, 0, W, f); ctx.fillRect(0, H - f, W, f);
    ctx.fillRect(0, 0, f, H); ctx.fillRect(W - f, 0, f, H);
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 1;
    ctx.strokeRect(f + 0.5, f + 0.5, W - 2 * f - 1, H - 2 * f - 1);

    if (document.body && document.body.style) document.body.style.background = rgbString(SOOT);
  }

  // ---- Pointer: tap-hold lifts a shard ------------------------------------
  function toUnit(x, y) {
    var L = layout();
    return [(x - L.cx) / L.s, (y - L.cy) / L.s];
  }
  var heldShard = -1;
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      var u = toUnit(e.clientX, e.clientY);
      for (var i = SHARDS.length - 1; i >= 0; i--) {
        if (pointInPoly(SHARDS[i].pts, u[0], u[1])) {
          heldShard = i;
          (liftEvents[i] = liftEvents[i] || []).push({ down: true, t: clockT });
          break;
        }
      }
    });
    function release() {
      if (heldShard >= 0) {
        (liftEvents[heldShard] = liftEvents[heldShard] || []).push({ down: false, t: clockT });
        heldShard = -1;
      }
    }
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    canvas.addEventListener('pointerleave', release);
  }

  // Inert QA hook (house convention): ?seed=tNN draws frame one at loop
  // time NN seconds. Without the parameter the piece starts at t = 0.
  var startT = 0;
  var searchStr = (window.location && window.location.search) ||
    (typeof location !== 'undefined' ? location.search : '') || '';
  var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(searchStr);
  if (m) startT = parseFloat(m[1]);

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(startT); });
  }
  window.addEventListener('resize', function () { resize(); draw(startT); });

  // Frame one: the synchronous draw at t = 0 (shimmer phase 0, no lift).
  clockT = startT;
  draw(startT);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts;
      clockT = startT + (ts - t0) / 1000;
      draw(clockT);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
