<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.178 Fractal Reptile Garden</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0C0C0E; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.178 Fractal Reptile Garden (Fathauer). WATCH-ONLY. The X
// pentomino iterated by his recipe: scale 1/sqrt(5), rotate
// arctan(1/2), four copies translated one unit in each direction
// around the centre copy. Generation 1 is the X itself (5 squares);
// each further generation replaces every square's X with five
// smaller rotated X's, out to generation 4 (625 squares per
// reptile). Reptiles stamp the plane on the index-5 lattice the
// construction generates, in blue, bone and copper, seams in the
// ground colour. 48s loop:
// generations draw in one by one, seams fade in, hold, soft reset.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0;
var GROUND = '#0C0C0E';
var COLORS = ['#2E6BE6', '#D8CFAF', '#B87333'];
var T = 48000, OFFSET = 32000;
var ROT = Math.atan2(1, 2); // 26.565 degrees
var OFFS = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]];

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }
function rotR(x, y) { return [(2 * x + y) / 5, (-x + 2 * y) / 5]; }

// gens[g]: squares of one reptile at generation g+1:
// [cx, cy, side, chain] where chain is [base square, then the copy
// index chosen at each iteration step]. A generation-4 square's
// geometric chunk membership is read off the copy indices from the
// last step backwards: same last copy = same 125-square sub-reptile,
// same last two = same 25-square chunk, same last three = same
// 5-square X; the base square distinguishes squares inside one X.
var gens = [];
(function buildGens() {
  var cur = OFFS.map(function (o, i) { return [o[0], o[1], 1, [i]]; });
  gens.push(cur);
  for (var g = 1; g < 4; g++) {
    var nxt = [];
    for (var i = 0; i < OFFS.length; i++) {
      for (var j = 0; j < cur.length; j++) {
        var r = rotR(cur[j][0], cur[j][1]);
        nxt.push([OFFS[i][0] + r[0], OFFS[i][1] + r[1], cur[j][2] / Math.sqrt(5), cur[j][3].concat([i])]);
      }
    }
    gens.push(nxt);
    cur = nxt;
  }
})();
// per-generation rotation (all squares of a generation share it)
var genRot = [0, -ROT, -2 * ROT, -3 * ROT];

var reps = []; // {ux, uy, color, mirror, delay}
function buildReps() {
  reps = [];
  var S = Math.min(W, H) / 3.4;
  var need = 0.5 * Math.sqrt(W * W + H * H) / S + 2.0;
  for (var a = -6; a <= 6; a++) {
    for (var b = -6; b <= 6; b++) {
      var px = 2 * a - b, py = a + 2 * b;
      var d = Math.sqrt(px * px + py * py);
      if (d > need) continue;
      reps.push({
        ux: px, uy: py,
        color: COLORS[(((a + 2 * b) % 3) + 3) % 3],
        delay: d * 0.55
      });
    }
  }
}
// Hierarchical seams for the generation-4 field. Every shared edge
// between two leaf squares is classified once by the coarsest chunk
// boundary it lies on, comparing the squares' copy-index chains from
// the largest scale down:
//   0: different reptiles (or the field's outer margin) - strongest
//   1: different sub-reptiles (125 squares each)
//   2: different generation-2 chunks (25 squares each)
//   3: different generation-3 sub-copies (the 5-square X's)
//   4: sibling unit squares inside one X - hairline
// Segments are stored in construction units, grouped by level.
var edgeLevels = null;
function buildEdges() {
  edgeLevels = [[], [], [], [], []];
  var sq = gens[3];
  var rot = genRot[3];
  var cosR = Math.cos(rot), sinR = Math.sin(rot);
  var side = sq[0][2];
  var ux = cosR, uy = sinR, vx = -sinR, vy = cosR;
  var map = {};
  var leaves = [];
  var ri, qi, x, y, key;
  for (ri = 0; ri < reps.length; ri++) {
    for (qi = 0; qi < sq.length; qi++) {
      x = reps[ri].ux + sq[qi][0];
      y = reps[ri].uy + sq[qi][1];
      key = Math.round(x * 100000) + ',' + Math.round(y * 100000);
      map[key] = leaves.length;
      leaves.push({ x: x, y: y, rep: ri, chain: sq[qi][3] });
    }
  }
  function classify(a, bIdx) {
    if (bIdx < 0) return 0;
    var b = leaves[bIdx];
    if (b.rep !== a.rep) return 0;
    if (b.chain[3] !== a.chain[3]) return 1;
    if (b.chain[2] !== a.chain[2]) return 2;
    if (b.chain[1] !== a.chain[1]) return 3;
    return 4;
  }
  function edge(a, nx, ny, dx, dy, px, py) {
    key = Math.round(nx * 100000) + ',' + Math.round(ny * 100000);
    var bIdx = map[key] === undefined ? -1 : map[key];
    var lvl = classify(a, bIdx);
    var mx = a.x + 0.5 * side * dx, my = a.y + 0.5 * side * dy;
    var ex = 0.5 * side * px, ey = 0.5 * side * py;
    edgeLevels[lvl].push([mx - ex, my - ey, mx + ex, my + ey]);
  }
  for (var li = 0; li < leaves.length; li++) {
    var L = leaves[li];
    edge(L, L.x + side * ux, L.y + side * uy, ux, uy, vx, vy);
    edge(L, L.x + side * vx, L.y + side * vy, vx, vy, ux, uy);
  }
}
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  buildReps();
  buildEdges();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var ts = (((now + OFFSET) % T) + T) % T / 1000;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var stage = ts < 6 ? 0 : ts < 12 ? 1 : ts < 18 ? 2 : 3;
  var seamA = ts < 24 ? 0 : smooth((ts - 24) / 6);
  var fade = ts >= 40 ? 1 - smooth((ts - 40) / 8) : 1;
  if (fade <= 0) return;
  var S = Math.min(W, H) / 3.4;
  var cx = W / 2, cy = H / 2;
  var sq = gens[stage];
  var rot = genRot[stage];
  var cosR = Math.cos(rot), sinR = Math.sin(rot);
  var byColor = [[], [], []];
  var ri, qi;
  for (ri = 0; ri < reps.length; ri++) {
    var rep = reps[ri];
    var aIn = stage === 0 && ts < 6 ? clamp01((ts - rep.delay) / 1.6) : 1;
    if (aIn <= 0) continue;
    var ci = COLORS.indexOf(rep.color);
    for (qi = 0; qi < sq.length; qi++) {
      byColor[ci].push([cx + (rep.ux + sq[qi][0]) * S, cy + (rep.uy + sq[qi][1]) * S, sq[qi][2] * S, 1]);
    }
  }
  ctx.globalAlpha = fade;
  for (var c = 0; c < 3; c++) {
    var list = byColor[c];
    if (!list.length) continue;
    ctx.fillStyle = COLORS[c];
    ctx.beginPath();
    for (qi = 0; qi < list.length; qi++) {
      traceSquare(list[qi], cosR, sinR);
    }
    ctx.fill();
  }
  if (seamA > 0) {
    ctx.strokeStyle = GROUND;
    if (stage === 3 && edgeLevels) {
      // Hierarchical seams: hairline between sibling unit squares,
      // then heavier at each coarser subdivision boundary, heaviest
      // around each reptile, so the nesting reads at a glance.
      // Weakest level first, strongest on top.
      var leafPx = sq[0][2] * S;
      var widths = [
        Math.max(3.2, leafPx * 0.26),
        Math.max(2.5, leafPx * 0.19),
        Math.max(1.9, leafPx * 0.13),
        Math.max(1.4, leafPx * 0.085),
        Math.max(1.0, leafPx * 0.05)
      ];
      var alphas = [1, 1, 0.95, 0.9, 0.8];
      ctx.lineCap = 'round';
      for (var lv = 4; lv >= 0; lv--) {
        var segs = edgeLevels[lv];
        if (!segs.length) continue;
        ctx.globalAlpha = fade * seamA * alphas[lv];
        ctx.lineWidth = widths[lv];
        ctx.beginPath();
        for (var si = 0; si < segs.length; si++) {
          var sg = segs[si];
          ctx.moveTo(cx + sg[0] * S, cy + sg[1] * S);
          ctx.lineTo(cx + sg[2] * S, cy + sg[3] * S);
        }
        ctx.stroke();
      }
      ctx.lineCap = 'butt';
    } else {
      ctx.globalAlpha = fade * seamA;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (c = 0; c < 3; c++) {
        list = byColor[c];
        for (qi = 0; qi < list.length; qi++) {
          traceSquare(list[qi], cosR, sinR);
        }
      }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
function traceSquare(it, cosR, sinR) {
  var X = it[0], Y = it[1], hs = it[2] / 2, s = it[3] * sinR;
  var dx1 = hs * cosR, dy1 = hs * s, dx2 = -hs * s, dy2 = hs * cosR;
  ctx.moveTo(X + dx1 + dx2, Y + dy1 + dy2);
  ctx.lineTo(X - dx1 + dx2, Y - dy1 + dy2);
  ctx.lineTo(X - dx1 - dx2, Y - dy1 - dy2);
  ctx.lineTo(X + dx1 - dx2, Y + dy1 - dy2);
  ctx.closePath();
}

var lastSig = '';
function frame(now) {
  var ts = (((now + OFFSET) % T) + T) % T / 1000;
  var sig = Math.round(ts * 12) + '|' + W + 'x' + H;
  if (sig !== lastSig) { lastSig = sig; draw(now); }
}
resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
