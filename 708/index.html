<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Undefined Territory</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #141312; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): floor, sphere red, sphere highlight, deep shadow,
  // faint sphere shadow. Nothing else.
  var FLOOR = '#141312';
  var RED = '#C41E1A';
  var HI = '#FF7A6B';
  var DEEP = '#0A0908';
  var SHADE = '#000000';

  var BASE_SEED = 708001;
  var TARGET = 2500;           // sphere count aim (spec: 2,000-3,000)
  var FORCE_T = -1;            // QA hook: -1 = live clock, else fixed elapsed

  // QA seed hook: ?seed=tNN pins the elapsed time (used by the headless
  // renderer to inspect later phases). Inert in normal viewing.
  try {
    if (typeof location !== 'undefined' && location.search) {
      var qm = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(location.search);
      if (qm) FORCE_T = parseFloat(qm[1]);
    }
  } catch (e) { /* live mode */ }

  // Seeded RNG (mulberry32). All sphere homes and tremble phases derive
  // from one fixed stream, so frame one is reproducible byte for byte.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---- Continent outlines ---------------------------------------------
  // Simplified continent polygons in lon/lat degrees, authored coarse
  // (10-60 points each). No country borders, no labels: landmass only.
  // North America carries a real Hudson Bay notch; Eurasia is one
  // unbroken landmass, as it is on the floor of the original work.
  var LAND = [
    // North + Central America
    [[-168,66],[-158,71],[-141,70],[-128,70],[-115,69],[-102,69],[-95,69],
     [-94,60],[-88,56],[-82,55],[-78,57],[-77,62],[-73,61],[-65,60],[-60,55],
     [-64,52],[-65,49],[-70,46],[-69,44],[-71,41],[-74,39],[-75,36],[-79,33],
     [-80,31],[-81,28],[-81,25],[-84,26],[-86,29],[-90,29],[-94,29],[-97,27],
     [-97,23],[-94,18],[-90,20],[-87,21],[-86,19],[-88,16],[-85,12],[-82,9],
     [-79,9],[-83,9],[-86,11],[-90,13],[-94,14],[-97,16],[-102,18],[-105,20],
     [-108,22],[-111,25],[-114,29],[-117,33],[-121,34],[-123,39],[-124,45],
     [-127,50],[-132,54],[-138,58],[-148,60],[-155,59],[-161,59],[-166,60]],
    // Greenland
    [[-46,60],[-42,64],[-32,68],[-22,70],[-20,73],[-25,77],[-33,80],
     [-45,79],[-52,76],[-55,71],[-53,65],[-52,61]],
    // South America
    [[-77,7],[-74,10],[-68,11],[-62,10],[-56,7],[-51,4],[-50,0],[-44,-2],
     [-38,-5],[-35,-8],[-37,-12],[-39,-15],[-40,-20],[-45,-23],[-48,-26],
     [-52,-32],[-57,-35],[-58,-38],[-62,-39],[-63,-41],[-65,-44],[-65,-47],
     [-67,-50],[-68,-52],[-70,-54],[-72,-54],[-74,-51],[-73,-46],[-73,-41],
     [-73,-36],[-72,-31],[-70,-24],[-70,-18],[-72,-15],[-76,-14],[-77,-11],
     [-79,-7],[-80,-4],[-80,0],[-79,3],[-77,5]],
    // Africa
    [[-6,35],[0,36],[6,37],[10,37],[11,34],[15,32],[20,32],[25,32],[30,31],
     [33,30],[34,27],[35,23],[37,19],[39,15],[41,12],[43,11],[46,11],[50,12],
     [51,11],[48,7],[46,3],[42,-2],[40,-7],[40,-12],[39,-17],[37,-21],
     [35,-25],[33,-28],[29,-32],[24,-34],[20,-35],[18,-33],[17,-29],[15,-24],
     [13,-18],[12,-13],[13,-8],[12,-4],[9,0],[9,4],[6,4],[3,6],[-2,5],[-6,4],
     [-11,6],[-15,10],[-17,14],[-17,19],[-16,23],[-15,27],[-13,30],[-10,32],
     [-7,34]],
    // Madagascar
    [[44,-13],[47,-14],[50,-16],[49,-19],[47,-23],[45,-25],[44,-23],
     [43,-19],[43,-16]],
    // Eurasia (one landmass: Europe through Siberia to India and China)
    [[-9,37],[-9,43],[-4,44],[-2,44],[-1,46],[-4,48],[0,49],[1,51],[4,52],
     [7,54],[8,56],[8,58],[12,56],[16,56],[19,55],[21,58],[21,60],[24,61],
     [25,64],[22,66],[19,68],[14,69],[19,70],[26,71],[32,70],[40,68],[48,68],
     [57,69],[66,70],[73,72],[80,73],[88,74],[95,76],[103,77],[110,76],
     [115,74],[122,73],[130,72],[138,72],[145,72],[152,71],[158,70],[165,70],
     [172,69],[178,66],[179,64],[173,61],[170,60],[163,59],[160,56],[162,53],
     [159,51],[156,50],[151,46],[146,44],[142,41],[139,42],[135,44],[132,43],
     [129,40],[127,38],[129,35],[126,34],[122,37],[121,34],[120,30],[119,27],
     [116,24],[113,22],[109,19],[108,15],[108,11],[106,8],[104,6],[101,6],
     [99,9],[97,13],[95,16],[93,17],[91,19],[89,21],[87,21],[85,19],[82,16],
     [80,13],[78,9],[76,10],[74,13],[72,18],[72,21],[69,22],[66,25],[61,25],
     [57,26],[53,27],[50,29],[48,30],[50,26],[55,24],[58,23],[59,22],[56,18],
     [55,16],[52,15],[48,14],[45,12],[43,12],[41,14],[39,19],[37,23],[35,28],
     [34,31],[36,33],[36,36],[32,36],[28,36],[27,38],[27,41],[24,40],[23,37],
     [20,39],[18,40],[14,42],[12,44],[10,44],[8,44],[6,43],[3,42],[2,39],
     [0,38],[-1,37],[-3,36],[-6,36]],
    // Britain
    [[-5,50],[-3,51],[-1,52],[1,51],[1,53],[-1,55],[-2,57],[-4,58],[-6,57],
     [-5,54],[-6,52]],
    // Japan (one coarse island chain polygon)
    [[130,31],[132,33],[135,34],[137,35],[139,36],[140,38],[141,40],
     [141,42],[142,44],[143,45],[144,44],[142,42],[141,39],[140,36],
     [138,35],[135,33],[132,32]],
    // Sumatra
    [[95,5],[98,3],[100,0],[103,-3],[105,-5],[106,-6],[103,-5],[100,-2],
     [97,1],[95,4]],
    // Borneo
    [[109,1],[110,3],[113,4],[116,6],[118,3],[119,0],[117,-2],[114,-3],
     [111,-2],[109,-1]],
    // Java
    [[106,-6],[109,-7],[112,-7],[114,-8],[114,-9],[110,-8],[107,-8]],
    // New Guinea
    [[131,-1],[134,-2],[137,-3],[140,-3],[143,-4],[146,-6],[149,-8],
     [150,-10],[148,-10],[145,-8],[142,-7],[139,-6],[136,-5],[133,-3],
     [131,-2]],
    // Australia
    [[113,-22],[114,-26],[115,-31],[115,-34],[118,-35],[122,-34],[126,-32],
     [129,-32],[132,-32],[134,-33],[136,-35],[138,-35],[139,-37],[141,-38],
     [144,-38],[147,-38],[150,-37],[152,-34],[153,-30],[153,-26],[151,-23],
     [149,-20],[146,-18],[143,-15],[142,-11],[141,-14],[139,-17],[136,-16],
     [135,-14],[136,-12],[133,-11],[131,-12],[128,-13],[125,-15],[122,-17],
     [119,-19],[116,-21]],
    // Tasmania
    [[145,-41],[148,-41],[148,-43],[146,-43]]
  ];

  // ---- Gall-Peters / cylindrical equal-area projection -----------------
  // x = longitude (linear). y = sin(latitude), the equal-area coordinate,
  // with the standard parallel at 45 degrees: the full longitude range is
  // 2*pi*cos(45) units wide and the latitude range used here
  // (sin -60..sin 85) is (sin85 - sin(-60)) / cos(45) units tall, so the
  // map space is 1 wide and MAP_H tall. No Mercator anywhere.
  var SIN_MAX = Math.sin(85 * Math.PI / 180);
  var SIN_MIN = Math.sin(-60 * Math.PI / 180);
  var MAP_H = ((SIN_MAX - SIN_MIN) / Math.SQRT1_2) / (2 * Math.PI * Math.SQRT1_2);

  function project(lon, lat) {
    var s = Math.sin(lat * Math.PI / 180);
    return {
      x: (lon + 180) / 360,
      y: (SIN_MAX - s) / (SIN_MAX - SIN_MIN) * MAP_H
    };
  }

  // Projected polygons with bounding boxes and areas.
  var POLYS = LAND.map(function (pts) {
    var p = pts.map(function (q) { return project(q[0], q[1]); });
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, area = 0;
    for (var i = 0; i < p.length; i++) {
      var a = p[i], b = p[(i + 1) % p.length];
      area += a.x * b.y - b.x * a.y;
      if (a.x < minX) minX = a.x; if (a.x > maxX) maxX = a.x;
      if (a.y < minY) minY = a.y; if (a.y > maxY) maxY = a.y;
    }
    return { pts: p, minX: minX, maxX: maxX, minY: minY, maxY: maxY,
             area: Math.abs(area) / 2 };
  });
  var LAND_AREA = 0;
  for (var pi = 0; pi < POLYS.length; pi++) LAND_AREA += POLYS[pi].area;

  function inPoly(poly, x, y) {
    var inside = false, pts = poly.pts;
    for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
      if (((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  // ---- Sphere homes ----------------------------------------------------
  // Seeded rejection sampling: each polygon receives spheres in
  // proportion to its projected (equal-area) size; a candidate is kept
  // only if it falls inside the polygon and respects a minimum distance
  // to every sphere already placed (loose packing, small gaps). If a
  // polygon underfills, the minimum distance relaxes in small steps.
  var SPH_R = 0;               // sphere radius, map units (set below)
  var homes = [];              // {x, y, p1, p2, w, dirx, diry}
  (function buildHomes() {
    var rng = mulberry32(BASE_SEED);
    var spacing = Math.sqrt(LAND_AREA / TARGET);
    SPH_R = spacing * 0.44;
    var minDist = spacing * 0.94;
    var grid = {};
    function gkey(gx, gy) { return gx * 100000 + gy; }
    function farEnough(x, y, md) {
      var gx = Math.floor(x / md), gy = Math.floor(y / md);
      for (var a = gx - 1; a <= gx + 1; a++) {
        for (var b = gy - 1; b <= gy + 1; b++) {
          var cell = grid[gkey(a, b)];
          if (!cell) continue;
          for (var k = 0; k < cell.length; k++) {
            var dx = homes[cell[k]].x - x, dy = homes[cell[k]].y - y;
            if (dx * dx + dy * dy < md * md) return false;
          }
        }
      }
      return true;
    }
    function place(x, y, md) {
      var idx = homes.length;
      var ang = rng() * Math.PI * 2;
      homes.push({
        x: x, y: y,
        p1: rng() * Math.PI * 2, p2: rng() * Math.PI * 2,
        w: 0.45 + rng() * 0.5,
        dirx: Math.cos(ang), diry: Math.sin(ang)
      });
      var key = gkey(Math.floor(x / md), Math.floor(y / md));
      if (!grid[key]) grid[key] = [];
      grid[key].push(idx);
    }
    for (var i = 0; i < POLYS.length; i++) {
      var poly = POLYS[i];
      var want = Math.max(3, Math.round(TARGET * poly.area / LAND_AREA));
      var placed = 0, md = minDist, tries = 0, relax = 0;
      while (placed < want && relax <= 3) {
        tries = 0;
        while (placed < want && tries < want * 60) {
          tries++;
          var x = poly.minX + rng() * (poly.maxX - poly.minX);
          var y = poly.minY + rng() * (poly.maxY - poly.minY);
          if (!inPoly(poly, x, y)) continue;
          if (!farEnough(x, y, md)) continue;
          place(x, y, md);
          placed++;
        }
        relax++;
        md *= 0.86;            // relax and top up what is still missing
      }
    }
  })();

  // ---- View -------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        window.visualViewport.width) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth) {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 800; h = 600; }
    return { w: w, h: h };
  }

  function resize() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = 1;
    if (typeof window !== 'undefined' && window.devicePixelRatio) {
      DPR = clamp(window.devicePixelRatio, 1, 2);
    }
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    // Phone detection: physical screen size first (min dimension < 700),
    // tall-aspect as the fallback signal only.
    var smin = 100000;
    if (typeof window !== 'undefined' && window.screen &&
        window.screen.width && window.screen.height) {
      smin = Math.min(window.screen.width, window.screen.height);
    }
    PHONE = (smin < 700) || (H > W * 1.15 && smin === 100000);
  }

  // Map layout: the equal-area world fitted inside the frame with a
  // margin, proportions never distorted. Returns px transform.
  function layout() {
    var mx = (PHONE ? 0.03 : 0.035) * W;
    var my = (PHONE ? 0.05 : 0.06) * H;
    var scale = Math.min((W - 2 * mx) / 1, (H - 2 * my) / MAP_H);
    var mw = scale, mh = MAP_H * scale;
    return { x: (W - mw) / 2, y: (H - mh) / 2, scale: scale };
  }

  // ---- Interaction: recorded taps ---------------------------------------
  // A tap is the external force. Each tap is recorded with its map-space
  // position and its time on the anchored clock; every sphere's scatter
  // offset is a pure function of those records, so the disturbance and
  // the slow re-forming are fully deterministic.
  var taps = [];               // {x, y, t} in map units / seconds

  function tapOffset(h, t) {
    var ox = 0, oy = 0;
    for (var i = 0; i < taps.length; i++) {
      var tau = t - taps[i].t;
      if (tau < 0 || tau > 24) continue;
      var dx = h.x - taps[i].x, dy = h.y - taps[i].y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var infl = Math.exp(-Math.pow(d / 0.17, 2));
      if (infl < 0.004) continue;
      // Roll out fast, then creep home: envelope is effectively spent
      // by ~20 s (exp(-tau/5.2) is under 2.5% at tau = 19).
      var env = (1 - Math.exp(-tau / 0.22)) * Math.exp(-tau / 5.2);
      var amp = 0.055 * infl * env;
      var ux = d > 1e-6 ? dx / d : h.dirx;
      var uy = d > 1e-6 ? dy / d : h.diry;
      // Mostly radial, with a slight tangential roll.
      ox += (ux - uy * 0.3) * amp;
      oy += (uy + ux * 0.3) * amp;
    }
    return { x: ox, y: oy };
  }

  // ---- Draw --------------------------------------------------------------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // The dark floor, edge to edge.
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, 0, W, H);

    var L = layout();
    var rPx = Math.max(0.8, SPH_R * L.scale);
    var tremble = 0.00095;     // ~1 px at desktop scale

    // Deep shadow: the landmass silhouettes pooled under the spheres.
    ctx.fillStyle = DEEP;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    for (var i = 0; i < POLYS.length; i++) {
      var pts = POLYS[i].pts;
      for (var j = 0; j < pts.length; j++) {
        var sx = L.x + pts[j].x * L.scale + rPx * 0.3;
        var sy = L.y + pts[j].y * L.scale + rPx * 0.45;
        if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.closePath();
    }
    ctx.fill();
    ctx.globalAlpha = 1;

    var n = homes.length, k;

    // Pass 1: one faint offset shadow dot per sphere.
    ctx.fillStyle = SHADE;
    ctx.globalAlpha = 0.38;
    ctx.beginPath();
    var px = new Array(n), py = new Array(n);
    for (k = 0; k < n; k++) {
      var h = homes[k];
      var o = tapOffset(h, t);
      var cx = h.x + o.x + tremble * Math.sin(t * h.w + h.p1);
      var cy = h.y + o.y + tremble * Math.cos(t * h.w * 0.83 + h.p2);
      px[k] = L.x + cx * L.scale;
      py[k] = L.y + cy * L.scale;
      ctx.moveTo(px[k] + rPx * 0.38 + rPx * 1.02, py[k] + rPx * 0.5);
      ctx.arc(px[k] + rPx * 0.38, py[k] + rPx * 0.5, rPx * 1.02, 0, Math.PI * 2);
    }
    ctx.fill();

    // Pass 2: the red glass spheres (flat discs, stylised).
    ctx.fillStyle = RED;
    ctx.globalAlpha = 1;
    ctx.beginPath();
    for (k = 0; k < n; k++) {
      ctx.moveTo(px[k] + rPx, py[k]);
      ctx.arc(px[k], py[k], rPx, 0, Math.PI * 2);
    }
    ctx.fill();

    // Pass 3: one small pale highlight per sphere.
    ctx.fillStyle = HI;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    var hr = Math.max(0.4, rPx * 0.3);
    for (k = 0; k < n; k++) {
      ctx.moveTo(px[k] - rPx * 0.32 + hr, py[k] - rPx * 0.34);
      ctx.arc(px[k] - rPx * 0.32, py[k] - rPx * 0.34, hr, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ---- Clock, pointer, boot ----------------------------------------------
  var startStamp = -1;
  function nowSec() {
    if (FORCE_T >= 0) return FORCE_T;
    if (typeof performance !== 'undefined' && performance.now) {
      if (startStamp < 0) startStamp = performance.now();
      return (performance.now() - startStamp) / 1000;
    }
    return 0;
  }

  function evtPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    if (e && e.touches && e.touches.length) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: W / 2, y: H / 2 };
  }

  function onTap(e) {
    var p = evtPos(e);
    var L = layout();
    taps.push({ x: (p.x - L.x) / L.scale, y: (p.y - L.y) / L.scale, t: nowSec() });
    if (taps.length > 16) taps.shift();
    draw(nowSec());
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onTap);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(nowSec()); });
  }
  if (typeof window !== 'undefined' && window.visualViewport &&
      window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () {
      resize(); draw(nowSec());
    });
  }

  resize();
  draw(0); // frame one: the synchronous draw at t = 0, the map at rest

  if (FORCE_T >= 0) {
    draw(FORCE_T);
  } else if (typeof requestAnimationFrame === 'function') {
    var tick = function () {
      draw(nowSec());
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
