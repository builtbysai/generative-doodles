<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uncontrollable Misinterpretation</title>
<style>
  html, body { margin: 0; padding: 0; background: #E4DCC8; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var T0 = 26;                  // fixed first-frame phase (seconds of piece time)
  var PASS = 68;                // seconds for the speech to scroll through once
  var SALT_BASE = 1241;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- deterministic hash ----------
  function ihash(a, b) {
    var x = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ 0x9E3779B9;
    x = Math.imul(x ^ (x >>> 13), 1274126177);
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }

  // ---------- the speech ----------
  // token format "word:class"  class: p = proper noun, v = verb, o = other
  var RAW = [
    "i:o want:v to:o talk:v about:o the:o piece:o they:o took:v down:o",
    "it:o was:v a:o pinata,:o paper:o and:o candy:o and:o string:o",
    "Denver:p had:v asked:v for:o something:o cheerful:o for:o the:o hall:o",
    "Maria:p signed:v the:o letter:o on:o a:o Friday:p",
    "they:o said:v the:o meaning:o could:v not:o be:v controlled:v",
    "they:o used:v the:o word:o uncontrollable:o in:o the:o memo:o",
    "a:o work:o leaves:v the:o room:o and:o belongs:v to:o strangers:o",
    "i:o cannot:v follow:v it:o around:o explaining:v myself:o",
    "the:o children:o hit:v it:o until:o the:o sweets:o fell:v out:o",
    "nobody:o was:v hurt:v ,:o nobody:o was:v even:o offended:v in:o person:o",
    "the:o complaint:o came:v later:o ,:o by:o telephone:o ,:o in:o writing:o",
    "i:o keep:v the:o letter:o in:o a:o drawer:o with:o the:o photographs:o",
    "sometimes:o i:o read:v it:o aloud:o to:o the:o empty:o studio:o",
    "the:o sentence:o i:o remember:v is:v the:o one:o about:o risk:o",
    "risk:o is:v the:o material:o i:o actually:o work:v with:o",
    "if:o you:o remove:v the:o risk:o you:o remove:v the:o work:o",
    "they:o offered:v me:o another:o wall:o in:o another:o building:o",
    "a:o smaller:o wall:o ,:o near:o the:o offices:o ,:o near:o the:o guards:o",
    "i:o said:v thank:o you:o and:o i:o meant:v only:o half:o of:o it:o",
    "this:o talk:o is:v the:o piece:o now:o ,:o i:o suppose:v",
    "you:o are:v hearing:v the:o part:o they:o could:v not:o hang:v",
    "every:o room:o decides:v what:o it:o can:v hold:v",
    "the:o Flinching:p Eye:p printed:v the:o program:o that:o night:o",
    "the:o gallery:o held:v the:o ladder:o and:o the:o broom:o",
    "the:o candy:o is:v still:o in:o a:o bag:o in:o my:o kitchen:o",
    "i:o drove:v back:o to:o Arizona:p with:o the:o ladder:o in:o the:o truck:o",
    "i:o am:v still:o deciding:v what:o it:o meant:v myself:o",
    "perhaps:o a:o pinata:o is:v only:o ever:o a:o promise:o",
    "it:o breaks:v ,:o and:o everyone:o decides:v what:o fell:v out:o",
    "thank:o you:o for:o listening:v to:o the:o missing:o parts:o"
  ];

  var LINES = [];   // { words: [{id, text, cls}], }
  var WORDS = [];   // flat, by id
  (function buildSpeech() {
    var id = 0;
    for (var li = 0; li < RAW.length; li++) {
      var toks = RAW[li].split(' ');
      var line = { words: [] };
      for (var wi = 0; wi < toks.length; wi++) {
        var cut = toks[wi].lastIndexOf(':');
        var w = {
          id: id, line: li, idx: wi,
          text: toks[wi].substring(0, cut),
          cls: toks[wi].substring(cut + 1)
        };
        line.words.push(w); WORDS.push(w); id++;
      }
      LINES.push(line);
    }
  })();

  // ---------- interaction state (events only; frame one has none) ----------
  var salt = 0;              // reseed count
  var epochOffset = 0;       // piece time of last reseed
  var tapDeletes = [];       // {id, rt} visitor-forced deletions (this run)
  var lastTapT = -1e9, lastTapX = 0, lastTapY = 0;

  // ---------- layout ----------
  var LAY = null;
  function isPhone(W, H) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width, window.screen.height);
    }
    return sw < 700 || H > W * 1.15;
  }
  function layout(W, H) {
    var fs = isPhone(W, H) ? 16 : 21;
    ctx.font = '600 ' + fs + 'px "Courier New", Courier, monospace';
    var spaceW = ctx.measureText(' ').width;
    var li, wi, x, maxW = 0;
    var geom = [];
    for (li = 0; li < LINES.length; li++) {
      x = 0; var row = [];
      for (wi = 0; wi < LINES[li].words.length; wi++) {
        var w = LINES[li].words[wi];
        var ww = ctx.measureText(w.text).width;
        row.push({ id: w.id, x: x, w: ww });
        x += ww + spaceW;
      }
      geom.push(row);
      if (x - spaceW > maxW) maxW = x - spaceW;
    }
    while (maxW > W * 0.94 && fs > 10) {
      fs -= 1;
      ctx.font = '600 ' + fs + 'px "Courier New", Courier, monospace';
      spaceW = ctx.measureText(' ').width;
      maxW = 0; geom = [];
      for (li = 0; li < LINES.length; li++) {
        x = 0; var row2 = [];
        for (wi = 0; wi < LINES[li].words.length; wi++) {
          var w2 = LINES[li].words[wi];
          var ww2 = ctx.measureText(w2.text).width;
          row2.push({ id: w2.id, x: x, w: ww2 });
          x += ww2 + spaceW;
        }
        geom.push(row2);
        if (x - spaceW > maxW) maxW = x - spaceW;
      }
    }
    var LH = fs * 1.9;
    var contentH = LINES.length * LH;
    var speed = (contentH + H) / PASS;
    return {
      W: W, H: H, fs: fs, LH: LH, contentH: contentH, speed: speed,
      colW: maxW, x0: (W - maxW) / 2, geom: geom,
      stripH: Math.max(46, Math.round(H * 0.072))
    };
  }

  // ---------- deletion schedule ----------
  // entry time (run seconds) of line L in pass p
  function entryTime(p, L) { return p * PASS + (L * LAY.LH) / LAY.speed; }

  var delCache = null, delCacheKey = '';
  function schedule() {
    var key = salt + '|' + LAY.fs + '|' + LAY.H;
    if (delCache && delCacheKey === key) return delCache;
    var sKey = SALT_BASE + salt * 7919;
    var del = new Array(WORDS.length);
    var li, wi;
    // per-line first casualty (pass 1, class-blind): no line is ever fully intact
    var casualty = [];
    for (li = 0; li < LINES.length; li++) {
      casualty.push(Math.floor(ihash(sKey, li * 131 + 7) * LINES[li].words.length));
    }
    for (var i = 0; i < WORDS.length; i++) {
      var w = WORDS[i];
      var h1 = ihash(sKey, w.id * 3 + 11);
      var h2 = ihash(sKey, w.id * 5 + 23);
      var dt;
      if (w.cls === 'p') {
        dt = entryTime(0, w.line) + 0.25 + h1 * 1.6;                    // pass 1: proper nouns first
      } else if (casualty[w.line] === w.idx) {
        dt = entryTime(0, w.line) + 0.25 + h1 * 1.2;                    // pass 1: insurance casualty
      } else if (w.cls === 'v') {
        if (h2 < 0.15) dt = entryTime(0, w.line) + 0.3 + h1 * 1.8;       // early scatter
        else dt = entryTime(1, w.line) + 0.3 + h1 * 2.2;                // pass 2: verbs
      } else {
        if (h2 < 0.08) dt = entryTime(0, w.line) + 0.3 + h1 * 1.8;       // early scatter
        else if (h2 < 0.54) dt = entryTime(2, w.line) + h1 * 4.0;       // pass 3
        else dt = entryTime(3, w.line) + h1 * 3.0;                      // pass 4: everything else
      }
      del[i] = dt;
    }
    delCache = del; delCacheKey = key;
    return del;
  }
  function delTime(id, rt) {
    var d = schedule()[id];
    for (var i = 0; i < tapDeletes.length; i++) {
      if (tapDeletes[i].id === id && tapDeletes[i].rt < d) d = tapDeletes[i].rt;
    }
    return d;
  }
  function tally(rt) {
    var del = schedule(), n = 0, i;
    var tapped = {};
    for (i = 0; i < tapDeletes.length; i++) tapped[tapDeletes[i].id] = tapDeletes[i].rt;
    for (i = 0; i < WORDS.length; i++) {
      var d = del[i];
      if (tapped[i] !== undefined && tapped[i] < d) d = tapped[i];
      if (d <= rt) n++;
    }
    return n;
  }

  // ---------- drawing ----------
  var hitRects = [];   // visible surviving words from the latest draw (for tap-censor)

  function draw(t) {
    var W = LAY.W, H = LAY.H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var rt = t - epochOffset;
    if (rt < 0) rt = 0;
    var del = schedule();
    var stripTop = H - LAY.stripH;

    // paper
    ctx.fillStyle = '#E4DCC8';
    ctx.fillRect(0, 0, W, H);

    hitRects = [];
    var scroll = rt * LAY.speed;
    var firstPass = Math.max(0, Math.floor(rt / PASS));
    ctx.textBaseline = 'alphabetic';

    for (var p = firstPass; p <= firstPass + 1; p++) {
      for (var li = 0; li < LINES.length; li++) {
        var yTop = H + p * LAY.contentH + li * LAY.LH - scroll;
        if (yTop < -LAY.LH || yTop > H) continue;
        var base = yTop + LAY.LH * 0.68;
        var row = LAY.geom[li];
        for (var wi = 0; wi < row.length; wi++) {
          var g = row[wi];
          var w = WORDS[g.id];
          var wx = LAY.x0 + g.x;
          var d = del[g.id];
          for (var ti = 0; ti < tapDeletes.length; ti++) {
            if (tapDeletes[ti].id === g.id && tapDeletes[ti].rt < d) d = tapDeletes[ti].rt;
          }
          if (rt < d) {
            ctx.font = '600 ' + LAY.fs + 'px "Courier New", Courier, monospace';
            ctx.fillStyle = '#33302A';
            ctx.fillText(w.text, wx, base);
            if (yTop > -4 && yTop < stripTop) {
              hitRects.push({ id: g.id, x: wx - 3, y: yTop, w: g.w + 6, h: LAY.LH });
            }
          } else {
            var age = rt - d;
            var jx = (ihash(g.id, Math.floor(rt * 5)) - 0.5) * 2;
            var bw = g.w + 6, bh = LAY.fs * 1.08, by = base - LAY.fs * 0.88;
            if (age < 0.07) {
              // flicker frame: the bar lands pale for one frame
              ctx.fillStyle = '#F7F1DE';
              ctx.fillRect(wx - 3 + jx, by, bw, bh);
            } else {
              if (age < 0.16) bh += 2; // slam overshoot
              ctx.fillStyle = '#0C0C0C';
              ctx.fillRect(wx - 3 + jx, by, bw, bh);
            }
          }
        }
      }
    }

    // ----- gasp strip -----
    ctx.fillStyle = '#E9E0C9';
    ctx.fillRect(0, stripTop, W, LAY.stripH);
    ctx.fillStyle = '#B9AE94';
    ctx.fillRect(0, stripTop, W, 1.5);

    // counter (quiet tally) with pencil-red underline
    ctx.font = '13px "Courier New", Courier, monospace';
    var cText = 'words removed: ' + tally(rt);
    ctx.fillStyle = '#33302A';
    ctx.fillText(cText, 16, stripTop + LAY.stripH * 0.62);
    var cw = ctx.measureText(cText).width;
    ctx.strokeStyle = '#B04A3A';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(16, stripTop + LAY.stripH * 0.62 + 5);
    ctx.lineTo(16 + cw, stripTop + LAY.stripH * 0.62 + 5);
    ctx.stroke();

    // waveform: hashed room tone, notched by deletions in the last 5 s
    var gx0 = Math.min(W - 40, 16 + cw + 42);
    var gx1 = W - 14;
    var midY = stripTop + LAY.stripH * 0.52;
    ctx.strokeStyle = '#8A8D94';
    ctx.lineWidth = 2;
    ctx.beginPath();
    var stepI = Math.floor(rt * 4);
    for (var x = gx0; x <= gx1; x += 5) {
      var y = midY + (ihash(Math.floor(x / 5), stepI) - 0.5) * 9;
      // gasp notches: recent deletions pull the line down, newest at the right
      for (var i = 0; i < WORDS.length; i++) {
        var dd = del[i];
        if (dd > rt || dd < rt - 5) continue;
        var nx = gx1 - ((rt - dd) / 5) * (gx1 - gx0);
        var dist = Math.abs(x - nx);
        if (dist < 11) {
          var depth = (7 + 25 * (1 - (rt - dd) / 5)) * (1 - dist / 11);
          if (depth > 0) y += depth;
        }
      }
      for (var tj = 0; tj < tapDeletes.length; tj++) {
        var td = tapDeletes[tj].rt;
        if (td > rt || td < rt - 5) continue;
        var tx = gx1 - ((rt - td) / 5) * (gx1 - gx0);
        var tdist = Math.abs(x - tx);
        if (tdist < 11) {
          var tdepth = (7 + 25 * (1 - (rt - td) / 5)) * (1 - tdist / 11);
          if (tdepth > 0) y += tdepth;
        }
      }
      if (y > stripTop + LAY.stripH - 3) y = stripTop + LAY.stripH - 3;
      if (x === gx0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    if (typeof location !== 'undefined' && /debug/.test(location.search || '')) debugState(rt);
  }

  // QA-only state dump (active with ?debug in the URL; invisible in the piece)
  var debugDone = false;
  function debugState(rt) {
    if (debugDone) return; debugDone = true;
    var del = schedule();
    var out = ['rt=' + rt.toFixed(2) + ' tally=' + tally(rt)];
    var scroll = rt * LAY.speed;
    for (var li = 0; li < LINES.length; li++) {
      var yTop = LAY.H + li * LAY.LH - scroll;
      if (yTop < -LAY.LH || yTop > LAY.H) continue;
      var parts = [];
      for (var wi = 0; wi < LINES[li].words.length; wi++) {
        var w = LINES[li].words[wi];
        parts.push(del[w.id] <= rt ? '[###]' : w.text);
      }
      out.push('L' + li + ' y=' + Math.round(yTop) + ': ' + parts.join(' '));
    }
    console.log(out.join('\n'));
  }

  // ---------- sizing ----------
  var lastT = T0;
  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 720; h = 720; }
    canvas.width = Math.round(w);
    canvas.height = Math.round(h);
    LAY = layout(canvas.width, canvas.height);
    delCache = null;
    draw(lastT);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // ---------- interaction: tap a word to censor it; double-tap reseeds ----------
  function pieceNow() { return lastT; }
  function toLocal(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    return r;
  }
  var downPos = null;
  canvas.addEventListener('pointerdown', function (e) { downPos = toLocal(e); });
  canvas.addEventListener('pointerup', function (e) {
    if (!downPos) return;
    var up = toLocal(e);
    var moved = Math.sqrt((up.x - downPos.x) * (up.x - downPos.x) + (up.y - downPos.y) * (up.y - downPos.y));
    downPos = null;
    if (moved > 24) return;
    var now = pieceNow();
    if (now - lastTapT < 0.35 && Math.abs(up.x - lastTapX) < 36 && Math.abs(up.y - lastTapY) < 36) {
      // double-tap: reseed the deletion schedule; the run restarts
      salt++;
      epochOffset = now;
      tapDeletes = [];
      lastTapT = -1e9;
      draw(now);
      return;
    }
    lastTapT = now; lastTapX = up.x; lastTapY = up.y;
    var rt = now - epochOffset;
    for (var i = 0; i < hitRects.length; i++) {
      var r = hitRects[i];
      if (up.x >= r.x && up.x <= r.x + r.w && up.y >= r.y && up.y <= r.y + r.h) {
        tapDeletes.push({ id: r.id, rt: rt });
        draw(now);
        return;
      }
    }
  });

  // ---------- run ----------
  resize();
  draw(T0);
  var startStamp = null;
  function loop(now) {
    if (startStamp === null) startStamp = now;
    lastT = T0 + (now - startStamp) / 1000;
    draw(lastT);
    requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
