<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Tone — №1154</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // deterministic hash -> [0,1) from integer parts
  function hash01() {
    var h = 2166136261 >>> 0;
    for (var k = 0; k < arguments.length; k++) {
      h ^= (arguments[k] * 2654435761) >>> 0;
      h = Math.imul(h, 16777619);
      h ^= h >>> 13;
    }
    var r = mulberry32(h >>> 0);
    return r();
  }
  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

  // ---------- glyph data ----------
  // 12 invented geometric letterforms on a 4 x 6 unit grid (y down).
  // segs: [x1,y1,x2,y2]; counter: [x,y,w,h] interior region that fills with noise.
  var GLYPHS = [
    { segs: [[0,0,0,6],[0,0,3,0],[0,3,3,3],[3,0,3,3]],                 counter: [0.55,0.55,1.9,1.9] },
    { segs: [[0,6,0,0],[0,0,4,0],[4,0,4,6],[2,0,2,3]],                 counter: [2.55,0.55,0.9,1.9] },
    { segs: [[2,0,2,6],[2,0,4,2],[2,0,0,2],[0,6,4,6]],                 counter: [1.4,3.4,1.2,1.9] },
    { segs: [[0,0,4,0],[4,0,4,6],[4,6,0,6],[0,6,0,0],[1,2,3,2],[3,2,3,4],[3,4,1,4],[1,4,1,2]], counter: [1.35,2.35,1.3,1.3] },
    { segs: [[0,6,0,3],[0,3,2,3],[2,3,2,1],[2,1,4,1],[4,1,4,6],[0,6,4,6]], counter: [2.55,3.55,0.9,1.9] },
    { segs: [[0,0,2,2],[4,0,2,2],[2,2,2,6],[0,6,4,6]],                 counter: [1.4,3.2,1.2,2.2] },
    { segs: [[0,0,0,6],[4,0,4,6],[0,2,4,4]],                           counter: [0.6,0.5,2.8,1.3] },
    { segs: [[2,0,4,4],[2,0,0,4],[0,4,4,4],[2,4,2,6]],                 counter: [1.5,2.1,1.0,1.5] },
    { segs: [[4,0,1,0],[1,0,1,6],[1,6,4,6],[4,6,4,4]],                 counter: [1.7,2.2,1.6,1.6] },
    { segs: [[2,0,4,3],[4,3,2,6],[2,6,0,3],[0,3,2,0],[2,0,2,6]],       counter: [1.45,2.2,1.1,1.6] },
    { segs: [[0,0,0,6],[0,6,4,6],[4,6,4,4],[0,3,2,3],[2,3,2,6]],       counter: [0.55,3.55,0.95,1.9] },
    { segs: [[0,0,0,6],[0,0,3,0],[3,0,1,3],[1,3,4,3],[4,3,4,6],[0,6,4,6]], counter: [0.55,0.55,1.8,1.9] }
  ];
  var NGLYPH = GLYPHS.length;
  var LOOP = 12;          // seconds
  var T0 = 8.0;           // fixed first-frame phase
  var STEPS = 12;         // damage quantization steps
  var MAXJIT = 0.62;      // max point jitter, in glyph units

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function viewSize() {
    var vv = window.visualViewport;
    var w = (vv && vv.width) || window.innerWidth || 1280;
    var h = (vv && vv.height) || window.innerHeight || 800;
    return { w: w, h: h };
  }
  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }
  function resize() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(currentT()); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(currentT()); });
  }

  // ---------- damage model ----------
  // A(i,t): raw amplitude; grows with loop phase and glyph index (left -> right).
  function rawA(i, t) {
    var p = (t % LOOP) / LOOP;
    return clamp01(p * (0.15 + 0.85 * (i / (NGLYPH - 1))));
  }
  function stepOf(A) { return Math.min(STEPS, Math.floor(A * STEPS)); }

  // jittered point position for glyph i, grid point (gx,gy), at damage step
  function jpoint(i, gx, gy, step, ox, oy, u) {
    var Aq = step / STEPS;
    var jx = (hash01(i * 31 + 7, Math.round(gx * 4), Math.round(gy * 4), step, 101) * 2 - 1) * Aq * MAXJIT;
    var jy = (hash01(i * 31 + 7, Math.round(gx * 4), Math.round(gy * 4), step, 202) * 2 - 1) * Aq * MAXJIT;
    // at extreme damage a few points tear away entirely
    if (Aq > 0.8 && hash01(i, Math.round(gx * 4), Math.round(gy * 4), step, 303) < (Aq - 0.8) * 2.2) {
      jx += (hash01(i, Math.round(gx * 4), step, 404) * 2 - 1) * 0.9;
      jy += (hash01(i, Math.round(gy * 4), step, 505) * 2 - 1) * 0.9;
    }
    return [ox + (gx + jx) * u, oy + (gy + jy) * u];
  }

  function strokeSegs(list) {
    ctx.beginPath();
    for (var k = 0; k < list.length; k++) {
      ctx.moveTo(list[k][0], list[k][1]);
      ctx.lineTo(list[k][2], list[k][3]);
    }
    ctx.stroke();
  }

  function drawGlyph(i, ox, oy, u, t, damaged) {
    var g = GLYPHS[i];
    var lw = Math.max(1.4, u * 0.17);
    ctx.lineWidth = lw;
    ctx.lineCap = 'square';
    if (!damaged) {
      ctx.strokeStyle = '#00E5FF';
      ctx.lineWidth = Math.max(1.1, u * 0.16);
      var clean = [];
      for (var s = 0; s < g.segs.length; s++) {
        var sg = g.segs[s];
        clean.push([ox + sg[0] * u, oy + sg[1] * u, ox + sg[2] * u, oy + sg[3] * u]);
      }
      strokeSegs(clean);
      return;
    }
    var A = rawA(i, t);
    var step = stepOf(A);
    var Aq = step / STEPS;
    var mainLight = [], mainFrag = [], ghosts = [];
    for (var j = 0; j < g.segs.length; j++) {
      var seg = g.segs[j];
      var p1 = jpoint(i, seg[0], seg[1], step, ox, oy, u);
      var p2 = jpoint(i, seg[2], seg[3], step, ox, oy, u);
      var splitTh = 0.30 + 0.45 * hash01(i, j, 7);
      var fragTh = 0.55 + 0.40 * hash01(i, j, 13);
      // stem split: an orange-red duplicate tears off the stem
      if (step > 0 && Aq > splitTh) {
        var gox = (hash01(i, j, step, 61) * 2 - 1) * (0.10 + Aq * 0.30) * u;
        var goy = (hash01(i, j, step, 62) * 2 - 1) * (0.10 + Aq * 0.30) * u;
        ghosts.push([p1[0] + gox, p1[1] + goy, p2[0] + gox, p2[1] + goy]);
      }
      // at extreme damage some stems are simply gone, only fragments remain
      if (Aq > 0.9 && hash01(i, j, step, 21) < 0.30) continue;
      if (Aq > fragTh) {
        var fox = (hash01(i, j, step, 71) * 2 - 1) * 0.22 * u;
        var foy = (hash01(i, j, step, 72) * 2 - 1) * 0.22 * u;
        mainFrag.push([p1[0] + fox, p1[1] + foy, p2[0] + fox, p2[1] + foy]);
      } else {
        mainLight.push([p1[0], p1[1], p2[0], p2[1]]);
      }
    }
    ctx.strokeStyle = '#FF3B00';
    if (ghosts.length) strokeSegs(ghosts);
    if (mainFrag.length) strokeSegs(mainFrag);
    ctx.strokeStyle = '#E8E8E8';
    if (mainLight.length) strokeSegs(mainLight);

    // counter fill: noise colonises the counter as damage grows
    if (step > 0 && g.counter) {
      var c = g.counter;
      var cols = 4, rows = 5;
      var ds = u * 0.15;
      for (var cx = 0; cx < cols; cx++) {
        for (var cy = 0; cy < rows; cy++) {
          var hsh = hash01(i, cx * 17 + 3, cy * 29 + 5, step, 88);
          if (hsh < Aq * 1.05) {
            var px = ox + (c[0] + (cx + 0.5) * (c[2] / cols)) * u + (hash01(i, cx, cy, step, 89) - 0.5) * u * 0.2;
            var py = oy + (c[1] + (cy + 0.5) * (c[3] / rows)) * u + (hash01(i, cy, cx, step, 90) - 0.5) * u * 0.2;
            ctx.fillStyle = (Aq > 0.7 && hash01(i, cx, cy, step, 91) < 0.4) ? '#FF3B00' : '#333333';
            ctx.fillRect(px - ds / 2, py - ds / 2, ds, ds);
          }
        }
      }
    }
  }

  // ---------- noise particle field ----------
  var PARTICLES = [];
  (function () {
    var rng = mulberry32(1154001);
    for (var k = 0; k < 300; k++) {
      PARTICLES.push({ x: rng(), y: rng(), th: rng(), s: 0.6 + rng() * 0.9 });
    }
  })();

  // ---------- main draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    // 16:9 field, centred (page ground is the piece ground, so phones read full-bleed)
    var fw = Math.min(W, H * 16 / 9);
    var fh = fw * 9 / 16;
    var fx = (W - fw) / 2;
    var fy = (H - fh) / 2;
    void isPhone();

    // average damage drives ambient noise density
    var avgA = 0;
    for (var i = 0; i < NGLYPH; i++) avgA += stepOf(rawA(i, t)) / STEPS;
    avgA /= NGLYPH;

    // noise particles in a band around the glyph row
    if (avgA > 0.02) {
      ctx.fillStyle = '#333333';
      var bandY = fy + fh * 0.16, bandH = fh * 0.52;
      for (var k = 0; k < PARTICLES.length; k++) {
        var pt = PARTICLES[k];
        if (pt.th < avgA * 1.25) {
          var ps = Math.max(1.2, fw * 0.0022 * pt.s);
          ctx.fillRect(fx + pt.x * fw, bandY + pt.y * bandH, ps, ps);
        }
      }
    }

    // main glyph row
    var rowW = fw * 0.88;
    var cell = rowW / NGLYPH;
    var u = cell / 5.2;
    var rowY = fy + fh * 0.42 - 3 * u;
    for (var gi = 0; gi < NGLYPH; gi++) {
      var ox = fx + (fw - rowW) / 2 + gi * cell + (cell - 4 * u) / 2;
      drawGlyph(gi, ox, rowY, u, t, true);
    }

    // reference row: the same glyphs, small, un-jittered, always crisp
    var refW = fw * 0.58;
    var rcell = refW / NGLYPH;
    var ru = rcell / 5.2;
    var refY = fy + fh * 0.90 - 6 * ru;
    for (var ri = 0; ri < NGLYPH; ri++) {
      var rox = fx + (fw - refW) / 2 + ri * rcell + (rcell - 4 * ru) / 2;
      drawGlyph(ri, rox, refY, ru, t, false);
    }
  }

  // ---------- loop ----------
  var startStamp = null;
  function currentT() {
    if (startStamp === null) return T0;
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    return T0 + (now - startStamp) / 1000;
  }
  resize();
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var tick = function () {
      if (startStamp === null) {
        startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      }
      draw(currentT());
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
