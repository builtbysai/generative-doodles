<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No9080 · Concrete</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #E4DDCC; }
  body { position: fixed; inset: 0; width: 100%; touch-action: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function() {
  'use strict';
  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var vw = window.innerWidth, vh = window.innerHeight;
    if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
    W = vw; H = vh;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  // Seeded RNG (mulberry32)
  var _s = 9080;
  function rnd() {
    _s |= 0; _s = _s + 0x6D2B79F5 | 0;
    var z = Math.imul(_s ^ _s >>> 15, 1 | _s);
    z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z;
    return ((z ^ z >>> 14) >>> 0) / 4294967296;
  }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }

  // Restrained concrete-art palette: paper ground, muted earth + primary accents
  var PAPER = '#E4DDCC';
  var COLORS = ['#1F2A44', '#A63D2F', '#C9A227', '#4A5D3A', '#222222', '#7A8BA0', '#B4552D'];

  var shapes = [];
  var cols = 0, rows = 0, cell = 0, ox = 0, oy = 0;

  // Each shape: grid cell, type, color, current pos/size, target pos/size
  function build() {
    _s = 9080; // reset seed for stable composition per resize
    shapes = [];
    var margin = Math.min(W, H) * 0.08;
    var gw = W - margin * 2, gh = H - margin * 2;
    cols = 5; rows = 7;
    cell = Math.min(gw / cols, gh / rows);
    ox = (W - cell * cols) / 2; oy = (H - cell * rows) / 2;

    // Occupancy grid to avoid overlaps
    var occ = [];
    for (var i = 0; i < cols * rows; i++) occ.push(false);
    function claim(c, r, w, h) {
      for (var dc = 0; dc < w; dc++) for (var dr = 0; dr < h; dr++) {
        var cc = c + dc, rr = r + dr;
        if (cc >= cols || rr >= rows) return false;
        if (occ[rr * cols + cc]) return false;
      }
      for (var dc2 = 0; dc2 < w; dc2++) for (var dr2 = 0; dr2 < h; dr2++)
        occ[(r + dr2) * cols + (c + dc2)] = true;
      return true;
    }

    var n = 9 + Math.floor(rnd() * 4);
    var colorPool = COLORS.slice();
    // Shuffle
    for (var i = colorPool.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = colorPool[i]; colorPool[i] = colorPool[j]; colorPool[j] = tmp;
    }

    var attempts = 0;
    while (shapes.length < n && attempts < 200) {
      attempts++;
      var w = 1 + Math.floor(rnd() * 2);
      var h = 1 + Math.floor(rnd() * 2);
      var c = Math.floor(rnd() * cols), r = Math.floor(rnd() * rows);
      if (!claim(c, r, w, h)) continue;
      var typeRoll = rnd();
      var type = typeRoll < 0.55 ? 'rect' : (typeRoll < 0.75 ? 'circle' : (typeRoll < 0.9 ? 'tri' : 'bar'));
      shapes.push({
        c: c, r: r, w: w, h: h,
        type: type,
        color: colorPool[shapes.length % colorPool.length],
        // Current (animated) values in pixels, eased toward targets
        x: ox + c * cell, y: oy + r * cell,
        sw: w * cell, sh: h * cell,
        tx: ox + c * cell, ty: oy + r * cell,
        tsw: w * cell, tsh: h * cell,
        phase: rnd() * Math.PI * 2
      });
    }

    // One thin dividing line for structure
    shapes.push({
      line: true,
      horizontal: rnd() < 0.5,
      color: '#222222',
      x: 0, y: 0, sw: 0, sh: 0, tx: 0, ty: 0, tsw: 0, tsh: 0, phase: 0,
      c: 0, r: 0, w: 1, h: 1, type: 'rect'
    });
    var ln = shapes[shapes.length - 1];
    if (ln.horizontal) {
      var lr = 1 + Math.floor(rnd() * (rows - 2));
      ln.y = ln.ty = oy + lr * cell - 1;
      ln.x = ln.tx = ox; ln.sw = ln.tsw = cols * cell; ln.sh = ln.tsh = 2;
    } else {
      var lc = 1 + Math.floor(rnd() * (cols - 2));
      ln.x = ln.tx = ox + lc * cell - 1;
      ln.y = ln.ty = oy; ln.sw = ln.tsw = 2; ln.sh = ln.tsh = rows * cell;
    }
  }

  // Every ~9 seconds, pick one shape and give it a new target cell
  var retargetTimer = 0;
  function retarget(dt) {
    retargetTimer += dt;
    if (retargetTimer < 9) return;
    retargetTimer = 0;
    // Free occupancy of a random non-line shape, move it
    var movables = shapes.filter(function(s) { return !s.line; });
    if (!movables.length) return;
    var s = movables[Math.floor(rnd() * movables.length)];
    // Release old cells
    var occ = [];
    for (var i = 0; i < cols * rows; i++) occ.push(false);
    shapes.forEach(function(o) {
      if (o === s || o.line) return;
      for (var dc = 0; dc < o.w; dc++) for (var dr = 0; dr < o.h; dr++)
        occ[(o.r + dr) * cols + (o.c + dc)] = true;
    });
    for (var a = 0; a < 40; a++) {
      var nc = Math.floor(rnd() * cols), nr = Math.floor(rnd() * rows);
      var ok = true;
      for (var dc = 0; dc < s.w && ok; dc++) for (var dr = 0; dr < s.h && ok; dr++) {
        var cc = nc + dc, rr = nr + dr;
        if (cc >= cols || rr >= rows || occ[rr * cols + cc]) ok = false;
      }
      if (ok) {
        s.c = nc; s.r = nr;
        s.tx = ox + nc * cell; s.ty = oy + nr * cell;
        return;
      }
    }
  }

  function ease(cur, target, k) { return cur + (target - cur) * k; }

  var t = 0, last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now; t += dt;
    retarget(dt);

    // Paper ground
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    var k = 1 - Math.pow(0.0015, dt); // smooth easing

    for (var i = 0; i < shapes.length; i++) {
      var s = shapes[i];
      s.x = ease(s.x, s.tx, k); s.y = ease(s.y, s.ty, k);
      s.sw = ease(s.sw, s.tsw, k); s.sh = ease(s.sh, s.tsh, k);

      // Subtle breathing: 1.5% scale oscillation, phase-offset per shape
      var br = 1 + 0.015 * Math.sin(t * 0.6 + s.phase);
      var cx = s.x + s.sw / 2, cy = s.y + s.sh / 2;
      var w = s.sw * br, h = s.sh * br;

      ctx.fillStyle = s.color;
      if (s.line) {
        ctx.fillRect(s.x, s.y, s.sw, s.sh);
      } else if (s.type === 'rect') {
        ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
      } else if (s.type === 'bar') {
        // Thin bar: either horizontal or vertical strip within its cell block
        if (s.sw >= s.sh) ctx.fillRect(cx - w / 2, cy - h * 0.08, w, h * 0.16);
        else ctx.fillRect(cx - w * 0.08, cy - h / 2, w * 0.16, h);
      } else if (s.type === 'circle') {
        ctx.beginPath();
        ctx.arc(cx, cy, Math.min(w, h) / 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (s.type === 'tri') {
        ctx.beginPath();
        ctx.moveTo(cx, cy - h / 2);
        ctx.lineTo(cx + w / 2, cy + h / 2);
        ctx.lineTo(cx - w / 2, cy + h / 2);
        ctx.closePath();
        ctx.fill();
      }
    }

    requestAnimationFrame(frame);
  }

  // Tap: nudge one random shape to a new cell (interactive reconfiguration)
  cv.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    retargetTimer = 8.9; // trigger a retarget almost immediately
  }, { passive: false });
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  document.addEventListener('dblclick', function(e) { e.preventDefault(); });

  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
