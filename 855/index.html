<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№855 The Separated Reel</title>
<style>
  html, body { margin: 0; padding: 0; background: #cfa98a; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №855 The Separated Reel, CK1 / PP1255, study #262 colton-kempf.
  // A 1990s family home movie plays: a garden birthday, handheld
  // wobble, washed-out color. The image runs untouched while the
  // soundtrack visibly detaches from it, shown as a loose ribbon
  // of waveform drifting beneath the frame. TAP cycles three
  // soundtracks for the same footage: the original family audio,
  // a new composed score, the maker's own voice narrating the edit
  // process. The image never changes, the feeling does. Audio is
  // visual-only in this gallery: no real WebAudio, the ribbon and
  // the stem label ARE the sound.
  var GROUND = '#cfa98a'; // page ground, warm dusk matching the sky

  // Fixed-phase first frame: FIRST_T = 15 s into a 90 s cycle.
  // Wobble, bunting sway, candle flames, balloon bob and the ribbon
  // drift are all closed-form functions of t, so frame one is fully
  // deterministic. A tap records its virtual time; the ribbon
  // crossfade is a closed-form function of (t - tapT).
  var FIRST_T = 15;
  var CYCLE = 90;
  var SEED = 855;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // Stem state. stem is the current soundtrack, prevStem the one
  // fading out, tapT the virtual time of the last tap.
  var STEMS = ['Family audio', 'Composed score', 'Maker narrating'];
  var stem = 0, prevStem = 0, tapT = -1e9;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: faded home-video color, grey waveform ribbon, warm dusk.
  var SKY_TOP = [238, 195, 154];
  var SKY_LOW = [224, 163, 126];
  var SUN_CORE = [244, 214, 146];
  var SUN_GLOW = [240, 190, 120];
  var TREE_DARK = [74, 90, 60];
  var TREE_MID = [92, 106, 74];
  var TRUNK = [110, 88, 66];
  var LAWN = [147, 160, 110];
  var LAWN_DARK = [126, 140, 94];
  var CLOTH = [232, 224, 208];
  var CLOTH_SHADE = [206, 194, 172];
  var CAKE = [217, 180, 143];
  var CAKE_TOP = [238, 214, 182];
  var CANDLE = [240, 236, 220];
  var FLAME = [250, 196, 90];
  var FLAME_CORE = [252, 232, 160];
  var SKIN = [217, 181, 150];
  var HAIR_DARK = [74, 58, 44];
  var HAIR_FAIR = [196, 164, 120];
  var HAIR_GREY = [178, 172, 158];
  var SHIRT = [
    [122, 106, 138], [106, 122, 138], [138, 122, 90],
    [154, 106, 90], [90, 122, 106]
  ];
  var BUNTING = [
    [201, 138, 122], [138, 160, 176], [201, 176, 120], [154, 168, 138]
  ];
  var BALLOON = [[198, 130, 118], [130, 150, 168]];
  var VEIL = [244, 238, 228];
  var VIGNETTE = [90, 70, 52];
  var STRIP_BG = [69, 65, 60];
  var STRIP_LINE = [216, 212, 204];
  var RIBBON = [185, 185, 180];
  var RIBBON_FAINT = [140, 140, 136];
  var LABEL = [216, 212, 204];
  var CAPTION = [90, 70, 50];
  var HINT = [216, 212, 204];

  // ---- Fixed tables ---------------------------------------------------
  // Stem 0 (family audio): 48 jagged segment heights, lively and uneven.
  var segRng = mulberry32(SEED * 13 + 5);
  var SEG = [];
  var si;
  for (si = 0; si < 48; si++) { SEG.push(0.25 + segRng() * 0.75); }
  // Stem 2 (narration): four speech-burst clusters across the ribbon.
  var BURSTS = [
    { c: 0.12, w: 0.075, ph: 0.4 },
    { c: 0.38, w: 0.06, ph: 2.1 },
    { c: 0.62, w: 0.085, ph: 4.4 },
    { c: 0.88, w: 0.065, ph: 1.2 }
  ];
  // Film grain: 140 fixed dots over the footage, slow alpha breathing.
  var grainRng = mulberry32(SEED * 29 + 11);
  var GRAIN = [];
  var gi;
  for (gi = 0; gi < 140; gi++) {
    GRAIN.push({
      x: grainRng(), y: grainRng() * 0.80,
      r: 0.5 + grainRng() * 1.1,
      a: 0.03 + grainRng() * 0.05,
      ph: grainRng() * Math.PI * 2
    });
  }
  // Bunting: 12 flags strung across the top of the frame.
  var BUNT = [];
  var bi;
  for (bi = 0; bi < 12; bi++) {
    BUNT.push({ u: 0.06 + bi * (0.88 / 11), c: BUNTING[bi % BUNTING.length], ph: bi * 0.9 });
  }
  // Five abstract figures around the table. No faces, no detail.
  // x: stage fraction, hgt: height in stage fractions, lean: radians,
  // bob: bob phase, hair: 0 dark, 1 fair, 2 grey.
  var FIGURES = [
    { x: 0.20, hgt: 0.205, lean: 0.05, bob: 0.0, hair: 0 },
    { x: 0.33, hgt: 0.175, lean: -0.04, bob: 1.7, hair: 1 },
    { x: 0.50, hgt: 0.19, lean: 0.10, bob: 3.1, hair: 0 },
    { x: 0.67, hgt: 0.18, lean: -0.06, bob: 4.6, hair: 2 },
    { x: 0.80, hgt: 0.20, lean: 0.04, bob: 2.4, hair: 1 }
  ];
  // Two balloons drifting at the frame edges.
  var BALLOONS = [
    { x: 0.115, y: 0.27, ph: 0.5, c: BALLOON[0] },
    { x: 0.885, y: 0.22, ph: 2.6, c: BALLOON[1] }
  ];

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.fsLabel = Math.round(clamp(W * 0.018, 11, 14));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function X(f) { return f * W; }
  function Y(f) { return f * H; }
  // Horizon: lower on desktop, higher on tall phones so the table
  // and figures stay in the middle of the full-bleed frame.
  function horizon() { return isPhone ? 0.34 : 0.42; }

  // ---- Handheld wobble: slow closed-form sway, well under 1 Hz -----
  function wobble(t) {
    return {
      x: W * (0.004 * Math.sin(2 * Math.PI * t / 6.1) + 0.002 * Math.sin(2 * Math.PI * t / 2.7 + 1.3)),
      y: H * (0.0025 * Math.sin(2 * Math.PI * t / 7.7 + 0.6) + 0.0015 * Math.sin(2 * Math.PI * t / 3.4 + 2.2)),
      rot: 0.0035 * Math.sin(2 * Math.PI * t / 8.3 + 0.7)
    };
  }

  // ---- Waveform amplitude per stem, u in [0,1] across the ribbon ----
  // The ribbon drifts slowly left: u' advances with t.
  function ampFor(s, u, t) {
    var up = u + t * 0.008;
    var i, a, env, bump, sum;
    if (s === 0) {
      // Family audio: jagged, lively, uneven segment heights.
      var idx = Math.floor(((up % 1) + 1) % 1 * 48) % 48;
      var base = SEG[idx];
      env = 0.55 + 0.45 * Math.sin(2 * Math.PI * (u * 2) + 0.8);
      return clamp(base * env, 0.05, 1);
    }
    if (s === 1) {
      // Composed score: smooth, regular, gently swelling.
      a = 0.45 + 0.35 * Math.sin(2 * Math.PI * 5 * up + 0.5);
      env = 0.75 + 0.25 * Math.sin(2 * Math.PI * 1.2 * u + 1.9);
      return clamp(a * env, 0.05, 1);
    }
    // Maker narrating: speech-burst clusters with near silence between.
    sum = 0;
    for (i = 0; i < BURSTS.length; i++) {
      bump = BURSTS[i];
      var d = (u - bump.c) / bump.w;
      sum += Math.exp(-d * d);
    }
    a = 0.5 + 0.5 * Math.abs(Math.sin(2 * Math.PI * 9 * up + 1.0));
    return clamp(0.08 + 0.85 * sum * a, 0.05, 1);
  }
  // Crossfade progress at time t: 0 at the tap, 1 after 0.8 s.
  function morph(t) { return smooth((t - tapT) / 0.8); }
  function ribbonAmp(u, t) {
    var m = morph(t);
    if (m >= 1 || prevStem === stem) { return ampFor(stem, u, t); }
    return lerp(ampFor(prevStem, u, t), ampFor(stem, u, t), m);
  }

  // ---- Footage: the garden birthday ----------------------------------
  function drawSky(t) {
    var hz = horizon();
    var g = ctx.createLinearGradient(0, -Y(0.02), 0, Y(hz));
    g.addColorStop(0, rgb(SKY_TOP));
    g.addColorStop(1, rgb(SKY_LOW));
    ctx.fillStyle = g;
    ctx.fillRect(-X(0.02), -Y(0.02), W * 1.04, Y(hz) + Y(0.02));
    // Low sun, warm and hazy.
    var sx = X(0.74), sy = Y(hz - 0.09);
    var sr = W * 0.035;
    var glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 4);
    glow.addColorStop(0, rgba(SUN_GLOW, a4(0.55)));
    glow.addColorStop(0.5, rgba(SUN_GLOW, a4(0.18)));
    glow.addColorStop(1, rgba(SUN_GLOW, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(sx - sr * 4, sy - sr * 4, sr * 8, sr * 8);
    ctx.fillStyle = rgb(SUN_CORE);
    ctx.beginPath();
    ctx.moveTo(sx + sr, sy);
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawTree(x0, yBase, s, t, ph) {
    var sway = W * 0.003 * Math.sin(2 * Math.PI * t / 9 + ph);
    var tx = X(x0) + sway;
    var ty = Y(yBase);
    var th = H * 0.30 * s;
    var tw = W * 0.10 * s;
    ctx.fillStyle = rgb(TRUNK);
    ctx.fillRect(tx - W * 0.006 * s, ty - th * 0.55, W * 0.012 * s, th * 0.55);
    ctx.fillStyle = rgb(TREE_DARK);
    var blobs = [
      { dx: 0, dy: -0.62, r: 0.55 },
      { dx: -0.38, dy: -0.42, r: 0.42 },
      { dx: 0.38, dy: -0.42, r: 0.42 },
      { dx: 0, dy: -0.30, r: 0.48 }
    ];
    var i, b;
    for (i = 0; i < blobs.length; i++) {
      b = blobs[i];
      var bx = tx + b.dx * tw;
      var by = ty + b.dy * th;
      var br = b.r * tw;
      ctx.beginPath();
      ctx.moveTo(bx + br, by);
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = rgba(TREE_MID, a4(0.6));
    ctx.beginPath();
    ctx.moveTo(tx - tw * 0.30 + tw * 0.30, ty - th * 0.55);
    ctx.arc(tx - tw * 0.30, ty - th * 0.55, tw * 0.30, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBunting(t) {
    var i, f;
    // On tall phones the bunting sits lower so it never crosses
    // the caption plate at the top left.
    var baseY = isPhone ? 0.115 : 0.06;
    var sag = isPhone ? 0.035 : 0.05;
    ctx.strokeStyle = rgba([90, 70, 52], a4(0.7));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    var steps = 24;
    for (i = 0; i <= steps; i++) {
      var u = i / steps;
      var bx = X(0.05 + 0.90 * u);
      var by = Y(baseY + sag * 4 * u * (1 - u));
      if (i === 0) { ctx.moveTo(bx, by); } else { ctx.lineTo(bx, by); }
    }
    ctx.stroke();
    for (i = 0; i < BUNT.length; i++) {
      f = BUNT[i];
      var fx = X(0.05 + 0.90 * f.u);
      var fy = Y(baseY + sag * 4 * f.u * (1 - f.u));
      var sway = Math.sin(2 * Math.PI * t / 4.2 + f.ph) * 0.05;
      var fw = W * 0.022, fh = H * 0.028;
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(sway);
      ctx.fillStyle = rgb(f.c);
      ctx.beginPath();
      ctx.moveTo(-fw, 0);
      ctx.lineTo(fw, 0);
      ctx.lineTo(0, fh);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawLawn(t) {
    var hz = horizon();
    ctx.fillStyle = rgb(LAWN);
    ctx.fillRect(-X(0.02), Y(hz), W * 1.04, Y(0.80) - Y(hz));
    // Faint mowing bands.
    var i;
    for (i = 0; i < 4; i++) {
      if (i % 2 === 0) {
        ctx.fillStyle = rgba(LAWN_DARK, a4(0.18));
        var by0 = Y(hz + (0.80 - hz) * (i / 4));
        ctx.fillRect(-X(0.02), by0, W * 1.04, Y(0.80 - hz) / 4);
      }
    }
  }

  function drawFigure(f, t, idx) {
    var hz = horizon();
    var feetY = Y(hz + 0.32) + H * 0.004 * Math.sin(2 * Math.PI * t / 5 + f.bob);
    var cx = X(f.x);
    var hgt = H * f.hgt;
    var headR = W * 0.021;
    var shoulderY = feetY - hgt * 0.62;
    var headY = shoulderY - headR * 1.15;
    var lean = f.lean * W * 0.35;
    ctx.save();
    ctx.translate(cx, feetY);
    ctx.rotate(f.lean * 0.35);
    ctx.translate(-cx, -feetY);
    // Body: a soft trapezoid, shoulders to waist, slightly flared.
    ctx.fillStyle = rgb(SHIRT[idx % SHIRT.length]);
    var bwTop = W * 0.030, bwBot = W * 0.038;
    ctx.beginPath();
    ctx.moveTo(cx - bwTop + lean * 0.3, shoulderY);
    ctx.lineTo(cx + bwTop + lean * 0.3, shoulderY);
    ctx.lineTo(cx + bwBot, feetY - H * 0.01);
    ctx.lineTo(cx - bwBot, feetY - H * 0.01);
    ctx.closePath();
    ctx.fill();
    // Arms: two simple lines down the sides.
    ctx.strokeStyle = rgba(SHIRT[idx % SHIRT.length], a4(0.9));
    ctx.lineWidth = Math.max(2, W * 0.006);
    ctx.beginPath();
    ctx.moveTo(cx - bwTop + lean * 0.3, shoulderY + H * 0.01);
    ctx.lineTo(cx - bwBot - W * 0.006, feetY - H * 0.10);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + bwTop + lean * 0.3, shoulderY + H * 0.01);
    ctx.lineTo(cx + bwBot + W * 0.006, feetY - H * 0.10);
    ctx.stroke();
    // Head: skin circle with a hair cap, no face.
    ctx.fillStyle = rgb(SKIN);
    ctx.beginPath();
    ctx.moveTo(cx + lean * 0.5 + headR, headY);
    ctx.arc(cx + lean * 0.5, headY, headR, 0, Math.PI * 2);
    ctx.fill();
    var hairC = f.hair === 0 ? HAIR_DARK : (f.hair === 1 ? HAIR_FAIR : HAIR_GREY);
    ctx.fillStyle = rgb(hairC);
    ctx.beginPath();
    ctx.moveTo(cx + lean * 0.5 - headR, headY - headR * 0.1);
    ctx.arc(cx + lean * 0.5, headY - headR * 0.1, headR * 1.02, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawTable(t) {
    var hz = horizon();
    var topY = Y(hz + 0.14);
    var cx = X(0.50);
    var rx = W * 0.16, ry = H * 0.018;
    // Cloth draping to the lawn.
    ctx.fillStyle = rgb(CLOTH);
    ctx.beginPath();
    ctx.moveTo(cx - rx, topY);
    ctx.quadraticCurveTo(cx - rx * 0.9, topY + H * 0.09, cx - rx * 0.82, Y(hz + 0.30));
    ctx.lineTo(cx + rx * 0.82, Y(hz + 0.30));
    ctx.quadraticCurveTo(cx + rx * 0.9, topY + H * 0.09, cx + rx, topY);
    ctx.closePath();
    ctx.fill();
    // Cloth shade folds.
    ctx.fillStyle = rgba(CLOTH_SHADE, a4(0.5));
    var fi;
    for (fi = -1; fi <= 1; fi++) {
      var fx = cx + fi * rx * 0.45;
      ctx.beginPath();
      ctx.moveTo(fx - W * 0.006, topY + H * 0.01);
      ctx.lineTo(fx + W * 0.006, topY + H * 0.01);
      ctx.lineTo(fx + W * 0.010, Y(hz + 0.29));
      ctx.lineTo(fx - W * 0.010, Y(hz + 0.29));
      ctx.closePath();
      ctx.fill();
    }
    // Table top ellipse.
    ctx.fillStyle = rgb(CLOTH);
    ctx.beginPath();
    ctx.moveTo(cx + rx, topY);
    ctx.ellipse(cx, topY, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    // Cake with five candles.
    var cakeW = W * 0.075, cakeH = H * 0.032;
    var cakeY = topY - cakeH;
    ctx.fillStyle = rgb(CAKE);
    ctx.fillRect(cx - cakeW / 2, cakeY, cakeW, cakeH);
    ctx.fillStyle = rgb(CAKE_TOP);
    ctx.beginPath();
    ctx.moveTo(cx + cakeW / 2, cakeY);
    ctx.ellipse(cx, cakeY, cakeW / 2, H * 0.007, 0, 0, Math.PI * 2);
    ctx.fill();
    var ci;
    for (ci = 0; ci < 5; ci++) {
      var ccx = cx - cakeW * 0.32 + ci * cakeW * 0.16;
      var cTop = cakeY - H * 0.018;
      ctx.fillStyle = rgb(CANDLE);
      ctx.fillRect(ccx - W * 0.0018, cTop, W * 0.0036, H * 0.018);
      // Flame: slow flicker at 1.4 Hz, well under the 14 Hz limit.
      var fl = 1 + 0.15 * Math.sin(2 * Math.PI * 1.4 * t + ci * 1.3);
      var fr = W * 0.0035 * fl;
      ctx.fillStyle = rgb(FLAME);
      ctx.beginPath();
      ctx.moveTo(ccx + fr, cTop - H * 0.006);
      ctx.ellipse(ccx, cTop - H * 0.006, fr, fr * 1.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = rgb(FLAME_CORE);
      ctx.beginPath();
      ctx.moveTo(ccx + fr * 0.5, cTop - H * 0.006);
      ctx.ellipse(ccx, cTop - H * 0.006, fr * 0.5, fr * 0.9, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBalloons(t) {
    var i, b;
    for (i = 0; i < BALLOONS.length; i++) {
      b = BALLOONS[i];
      var bx = X(b.x) + W * 0.004 * Math.sin(2 * Math.PI * t / 6.5 + b.ph);
      var by = Y(b.y) + H * 0.008 * Math.sin(2 * Math.PI * t / 5.1 + b.ph * 2);
      var br = W * 0.026;
      ctx.strokeStyle = rgba([90, 70, 52], a4(0.55));
      ctx.lineWidth = Math.max(1, W * 0.001);
      ctx.beginPath();
      ctx.moveTo(bx, by + br);
      ctx.quadraticCurveTo(bx + W * 0.01, by + br + H * 0.06, bx - W * 0.005, by + br + H * 0.10);
      ctx.stroke();
      ctx.fillStyle = rgb(b.c);
      ctx.beginPath();
      ctx.moveTo(bx + br, by);
      ctx.ellipse(bx, by, br, br * 1.18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = rgba([255, 255, 255], a4(0.35));
      ctx.beginPath();
      ctx.moveTo(bx - br * 0.35 + br * 0.18, by - br * 0.45);
      ctx.arc(bx - br * 0.35, by - br * 0.45, br * 0.18, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGrain(t) {
    var i, g, a;
    for (i = 0; i < GRAIN.length; i++) {
      g = GRAIN[i];
      a = g.a * (0.7 + 0.3 * Math.sin(2 * Math.PI * t / 11 + g.ph));
      ctx.fillStyle = rgba([255, 250, 240], a4(a));
      ctx.fillRect(X(g.x), Y(g.y), g.r, g.r);
      ctx.fillStyle = rgba([40, 30, 22], a4(a * 0.7));
      ctx.fillRect(X(1 - g.x), Y(0.80 - g.y), g.r, g.r);
    }
  }

  function drawFootage(t) {
    var w = wobble(t);
    ctx.save();
    // Clip to the footage band so the wobble never leaks into the strip.
    ctx.beginPath();
    ctx.rect(-X(0.02), -Y(0.02), W * 1.04, Y(0.80) + Y(0.02));
    ctx.clip();
    ctx.translate(w.x, w.y);
    ctx.rotate(w.rot);
    drawSky(t);
    drawTree(0.09, horizon(), 1.0, t, 0.3);
    drawTree(0.92, horizon(), 0.9, t, 2.0);
    drawLawn(t);
    drawBalloons(t);
    // Figures behind the table first, then the table, then the front row.
    drawFigure(FIGURES[1], t, 1);
    drawFigure(FIGURES[3], t, 3);
    drawTable(t);
    drawFigure(FIGURES[0], t, 0);
    drawFigure(FIGURES[2], t, 2);
    drawFigure(FIGURES[4], t, 4);
    drawBunting(t);
    // Washed-out veil and soft vignette over the whole footage.
    ctx.fillStyle = rgba(VEIL, a4(0.10));
    ctx.fillRect(-X(0.02), -Y(0.02), W * 1.04, Y(0.82));
    drawGrain(t);
    var vg = ctx.createRadialGradient(W / 2, Y(0.40), Math.min(W, H) * 0.35,
      W / 2, Y(0.40), Math.max(W, H) * 0.72);
    vg.addColorStop(0, rgba(VIGNETTE, 0));
    vg.addColorStop(1, rgba(VIGNETTE, a4(0.14)));
    ctx.fillStyle = vg;
    ctx.fillRect(-X(0.02), -Y(0.02), W * 1.04, Y(0.82));
    ctx.restore();
  }

  // ---- The detached strip: ribbon plus stem label --------------------
  function drawStrip(t) {
    ctx.fillStyle = rgb(STRIP_BG);
    ctx.fillRect(0, Y(0.80), W, H - Y(0.80));
    // Divider: the line the sound slipped out through.
    ctx.fillStyle = rgba(STRIP_LINE, a4(0.35));
    ctx.fillRect(0, Y(0.80), W, Math.max(1, H * 0.002));
    var m = morph(t);
    // Stem label, crossfading between the old and new stems.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '600 ' + L.fsLabel + 'px Georgia, "Times New Roman", serif';
    if (m < 1 && prevStem !== stem) {
      ctx.fillStyle = rgba(LABEL, a4(0.85 * (1 - m)));
      ctx.fillText(STEMS[prevStem], W * 0.04, Y(0.852));
    }
    ctx.fillStyle = rgba(LABEL, a4(0.85 * (m < 1 && prevStem !== stem ? m : 1)));
    ctx.fillText(STEMS[stem], W * 0.04, Y(0.852));
    // Stem dots at the right: the active stem is filled.
    var di;
    for (di = 0; di < 3; di++) {
      var dx = W * (0.90 + di * 0.03);
      var dy = Y(0.845);
      var dr = Math.max(2, W * 0.004);
      if (di === stem) {
        ctx.fillStyle = rgb(RIBBON);
        ctx.beginPath();
        ctx.moveTo(dx + dr, dy);
        ctx.arc(dx, dy, dr, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeStyle = rgba(RIBBON, a4(0.7));
        ctx.lineWidth = Math.max(1, W * 0.0012);
        ctx.beginPath();
        ctx.moveTo(dx + dr, dy);
        ctx.arc(dx, dy, dr, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    // The ribbon itself: a loose grey waveform, drifting slowly.
    var cy = Y(0.905);
    var maxAmp = H * 0.04;
    ctx.fillStyle = rgba(RIBBON_FAINT, a4(0.5));
    ctx.fillRect(X(0.04), cy - Math.max(1, H * 0.0008), W * 0.92, Math.max(1, H * 0.0016));
    ctx.fillStyle = rgb(RIBBON);
    var x, u, a, half;
    for (x = X(0.04); x <= X(0.96); x += 3) {
      u = (x - X(0.04)) / (W * 0.92);
      a = ribbonAmp(u, t);
      half = Math.max(1, a * maxAmp);
      ctx.fillRect(x, cy - half, 2, half * 2);
    }
    ctx.textAlign = 'left';
  }

  // ---- Caption and hint, in the template's place ----------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.85));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№855 · The Separated Reel', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CAPTION, a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 15', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(HINT, a4(0.85));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Tap to change the soundtrack.', W / 2, H - L.fsHint * 0.7);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawFootage(t);
    drawStrip(t);
    drawText();
  }

  // ---- Tap: cycle the soundtrack 0-1-2-0 -----------------------------
  function tap(t) {
    prevStem = stem;
    stem = (stem + 1) % 3;
    tapT = (typeof t === 'number') ? t : lastT;
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      try { if (e && typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      tap(lastT);
      draw(lastT);
    });
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece855 exposes stem, ribbon and wobble state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece855 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      stems: STEMS.slice(),
      stem: function () { return stem; },
      label: function () { return STEMS[stem]; },
      tap: function (t) { tap(t); },
      morph: function (t) { return morph(t); },
      ribbonAmp: function (s, u, t) { return ampFor(s, u, t); },
      ribbon: function (u, t) { return ribbonAmp(u, t); },
      wobble: function (t) { return wobble(t); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 90 s cycle, closed-form. The ribbon crossfade is
  // driven by virtual time, so it stays deterministic under QA.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
