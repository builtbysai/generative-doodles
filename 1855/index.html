<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>As We Breathe</title>
<style>
html, body { margin: 0; padding: 0; background: #EFEDE8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a gallery room seen from above, sparsely furnished: a chair, two
   plinths, a doorway of daylight. One song lives here in fragments, one at
   each object: a breath at the chair, a hummed phrase at the tall plinth, a
   bowed note near the doorway. A small pool of amber light drifts through
   the room on its own; drag it and the song you hear is the song of the
   objects near you, crossfaded by distance. The installed song is heard by
   walking, and dragging is the walk. */
var TAU = Math.PI * 2;
var GROUND = '#EFEDE8';
var FLOOR = '#E7E4DD';
var WALL = '#8A8781';
var WALL_SOFT = 'rgba(138,135,129,0.45)';
var CONCRETE = '#B9B6AF';
var CONCRETE_LO = '#9C998F';
var WOOD = '#4A3220';
var WOOD_HI = '#6B4A2F';
var WOOD_LO = '#332412';
var STEEL = '#9AA3AD';
var STEEL_HI = '#C3CAD1';
var STEEL_LO = '#6E767E';
var DAYLIGHT = '#F2C879';
var DOOR_GLOW = '#E8A44A';
var AMBER = '#E8A44A';
var AMBER_HI = '#F2B45C';
var AMBER_DEEP = '#C77F22';
var PLATE = '#FBFAF7';
var PLATE_LINE = 'rgba(46,44,41,0.30)';
var TITLE_INK = '#2E2C29';
var HINT_INK = '#5C5954';
var FRAME_T = 60.0;        /* fixed phase for frame one */
var PROX = 0.42;           /* fragment crossfade radius, fraction of min(VW,VH) */
var POOL_R = 0.055;        /* listening pool radius, fraction of min(VW,VH) */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var soundOn = true;
var audioCtx = null;
var master = null;
var noiseBuf = null;
var voices = null;   /* one voice per fragment, built lazily inside a gesture */
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
/* ---- the room, in fractions of the room rect ---- */
var CHAIR = { x: 0.26, y: 0.60, w: 0.075, h: 0.075, kind: 'breath', gain: 0, ph: 0.0 };
var TALL_PLINTH = { x: 0.68, y: 0.32, w: 0.11, h: 0.16, kind: 'hum', gain: 0, ph: 1.9 };
var LOW_PLINTH = { x: 0.44, y: 0.74, w: 0.13, h: 0.09, kind: 'none', gain: 0, ph: 0.0 };
var DOORWAY = { x: 0.78, y: 0.10, w: 0.16, kind: 'bow', gain: 0, ph: 3.4 };
var FRAGMENTS = [CHAIR, TALL_PLINTH, DOORWAY];
/* seeded jitter so the objects sit with care, not on a grid */
(function () {
  var rng = mulberry32(1855);
  CHAIR.x += (rng() - 0.5) * 0.02;
  CHAIR.y += (rng() - 0.5) * 0.02;
  TALL_PLINTH.x += (rng() - 0.5) * 0.02;
  TALL_PLINTH.y += (rng() - 0.5) * 0.02;
  LOW_PLINTH.x += (rng() - 0.5) * 0.02;
  DOORWAY.x += (rng() - 0.5) * 0.02;
})();
/* The pool drifts on its own slow path. At the fixed first frame (t = 60)
   the path passes near the chair, so the breath fragment is the one heard. */
function driftPos(t) {
  return {
    x: 0.5 + 0.28 * Math.sin(TAU * t / 53 + 3.107),
    y: 0.5 + 0.22 * Math.sin(TAU * t / 37 - 1.237)
  };
}
var pool = {
  x: driftPos(FRAME_T).x, y: driftPos(FRAME_T).y,
  tx: driftPos(FRAME_T).x, ty: driftPos(FRAME_T).y,
  dragging: false, blend: 0
};
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Plan-view room: full-bleed on phones, a centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function roomRect(sc) {
  var m = Math.min(sc.w, sc.h);
  var inset = m * 0.07;
  return { x: sc.x + inset, y: sc.y + inset, w: sc.w - inset * 2, h: sc.h - inset * 2 };
}
function toPx(fx, fy, rc) {
  return { x: rc.x + fx * rc.w, y: rc.y + fy * rc.h };
}
/* ---- audio: built lazily inside the first gesture, never autoplay ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try {
      audioCtx = new AudioContext();
      master = audioCtx.createGain();
      master.gain.value = 0.8;
      master.connect(audioCtx.destination);
      var len = Math.floor(audioCtx.sampleRate * 1.0);
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = noiseBuf.getChannelData(0), i;
      for (i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      voices = [];
      var j, v, o1, o2, f1, f2, g, lp, lfo, lg;
      for (j = 0; j < FRAGMENTS.length; j++) {
        v = { gainNode: null, filt: null, lfoGain: null, base: 0 };
        lp = audioCtx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 600; lp.Q.value = 0.6;
        g = audioCtx.createGain();
        g.gain.value = 0.0001;
        lp.connect(g); g.connect(master);
        v.gainNode = g; v.filt = lp;
        if (FRAGMENTS[j].kind === 'breath') {
          /* breath: looped noise through a soft bandpass, slow swell */
          var src = audioCtx.createBufferSource();
          src.buffer = noiseBuf; src.loop = true;
          f1 = audioCtx.createBiquadFilter();
          f1.type = 'bandpass'; f1.frequency.value = 900; f1.Q.value = 1.1;
          lg = audioCtx.createGain(); lg.gain.value = 0.5;
          lfo = audioCtx.createOscillator();
          lfo.type = 'sine'; lfo.frequency.value = 0.11;
          var lfoG = audioCtx.createGain(); lfoG.gain.value = 0.35;
          lfo.connect(lfoG); lfoG.connect(lg.gain); lfo.start();
          src.connect(f1); f1.connect(lg); lg.connect(lp);
          src.start();
          v.base = 0.16;
        } else if (FRAGMENTS[j].kind === 'hum') {
          /* hummed phrase: two voice-like oscillators through formants */
          o1 = audioCtx.createOscillator();
          o1.type = 'sawtooth'; o1.frequency.value = 196;
          o2 = audioCtx.createOscillator();
          o2.type = 'sawtooth'; o2.frequency.value = 294;
          f1 = audioCtx.createBiquadFilter();
          f1.type = 'bandpass'; f1.frequency.value = 720; f1.Q.value = 2.0;
          f2 = audioCtx.createBiquadFilter();
          f2.type = 'bandpass'; f2.frequency.value = 1150; f2.Q.value = 2.5;
          var g1 = audioCtx.createGain(); g1.gain.value = 0.6;
          var g2 = audioCtx.createGain(); g2.gain.value = 0.4;
          o1.connect(f1); f1.connect(g1); g1.connect(lp);
          o2.connect(f2); f2.connect(g2); g2.connect(lp);
          lfo = audioCtx.createOscillator();
          lfo.type = 'sine'; lfo.frequency.value = 5.2;
          var vib = audioCtx.createGain(); vib.gain.value = 3.5;
          lfo.connect(vib); vib.connect(o1.detune); vib.connect(o2.detune);
          lfo.start();
          o1.start(); o2.start();
          v.base = 0.13;
        } else {
          /* bowed note: low sawtooths, slow vibrato, soft lowpass */
          o1 = audioCtx.createOscillator();
          o1.type = 'sawtooth'; o1.frequency.value = 65.4;
          o2 = audioCtx.createOscillator();
          o2.type = 'sawtooth'; o2.frequency.value = 98.0;
          var bg1 = audioCtx.createGain(); bg1.gain.value = 0.7;
          var bg2 = audioCtx.createGain(); bg2.gain.value = 0.5;
          o1.connect(bg1); bg1.connect(lp);
          o2.connect(bg2); bg2.connect(lp);
          lfo = audioCtx.createOscillator();
          lfo.type = 'sine'; lfo.frequency.value = 5.6;
          var vib2 = audioCtx.createGain(); vib2.gain.value = 5.0;
          lfo.connect(vib2); vib2.connect(o1.detune); vib2.connect(o2.detune);
          lfo.start();
          o1.start(); o2.start();
          v.base = 0.17;
        }
        voices.push(v);
      }
    } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function updateAudio() {
  if (!audioCtx || !voices) return;
  var i, v;
  try {
    for (i = 0; i < FRAGMENTS.length; i++) {
      v = voices[i];
      var g = soundOn ? FRAGMENTS[i].gain * v.base : 0;
      v.gainNode.gain.setTargetAtTime(Math.max(g, 0.0001), audioCtx.currentTime, 0.25);
      v.filt.frequency.setTargetAtTime(300 + 3200 * FRAGMENTS[i].gain, audioCtx.currentTime, 0.25);
    }
  } catch (e) {}
}
/* ---- interaction state: pool drift, drag override, distance gains ---- */
function stepLogic(dt, t, rc) {
  var d = driftPos(t);
  if (pool.dragging) {
    pool.blend = Math.min(1, pool.blend + dt * 5);
  } else {
    pool.blend = Math.max(0, pool.blend - dt / 4);
  }
  pool.x = lerp(d.x, pool.tx, pool.blend);
  pool.y = lerp(d.y, pool.ty, pool.blend);
}
function drawRoom(rc, t) {
  var m = Math.min(rc.w, rc.h);
  ctx.fillStyle = FLOOR;
  ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
  /* faint concrete floor seams */
  ctx.strokeStyle = 'rgba(156,153,143,0.35)';
  ctx.lineWidth = 1;
  var i;
  for (i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(rc.x + rc.w * i / 4, rc.y);
    ctx.lineTo(rc.x + rc.w * i / 4, rc.y + rc.h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rc.x, rc.y + rc.h * i / 4);
    ctx.lineTo(rc.x + rc.w, rc.y + rc.h * i / 4);
    ctx.stroke();
  }
  /* daylight spilling in from the doorway, before the walls are drawn */
  var dp = toPx(DOORWAY.x, 0, rc);
  var dw = DOORWAY.w * rc.w;
  var spill = ctx.createLinearGradient(dp.x, rc.y, dp.x, rc.y + m * 0.34);
  spill.addColorStop(0, rgba(DAYLIGHT, 0.55));
  spill.addColorStop(1, rgba(DAYLIGHT, 0));
  ctx.fillStyle = spill;
  ctx.beginPath();
  ctx.moveTo(dp.x - dw / 2, rc.y);
  ctx.lineTo(dp.x + dw / 2, rc.y);
  ctx.lineTo(dp.x + dw * 0.85, rc.y + m * 0.34);
  ctx.lineTo(dp.x - dw * 0.85, rc.y + m * 0.34);
  ctx.closePath();
  ctx.fill();
  /* walls as thin lines, with a gap at the doorway; each side is stroked
     explicitly so no closing segment cuts across the room */
  ctx.strokeStyle = WALL;
  ctx.lineWidth = Math.max(1.5, m * 0.004);
  ctx.beginPath();
  ctx.moveTo(rc.x, rc.y);
  ctx.lineTo(dp.x - dw / 2, rc.y);
  ctx.moveTo(dp.x + dw / 2, rc.y);
  ctx.lineTo(rc.x + rc.w, rc.y);
  ctx.lineTo(rc.x + rc.w, rc.y + rc.h);
  ctx.lineTo(rc.x, rc.y + rc.h);
  ctx.lineTo(rc.x, rc.y);
  ctx.stroke();
  /* doorway lintel: a warm bar where the wall opens */
  ctx.fillStyle = DOOR_GLOW;
  ctx.fillRect(dp.x - dw / 2, rc.y - m * 0.006, dw, m * 0.012);
}
function drawPlinth(p, rc, t, isTall) {
  var m = Math.min(rc.w, rc.h);
  var c = toPx(p.x, p.y, rc);
  var w = p.w * rc.w, h = p.h * rc.h;
  var left = c.x - w / 2, top = c.y - h / 2;
  /* soft shadow on the floor */
  ctx.fillStyle = 'rgba(46,44,41,0.14)';
  ctx.beginPath();
  ctx.moveTo(left + w + m * 0.008, top + h * 0.55);
  ctx.ellipse(left + w / 2 + m * 0.008, top + h * 0.55, w * 0.55, h * 0.22, 0, 0, TAU);
  ctx.fill();
  /* plinth body: brushed steel edge, pale stone top */
  var g = ctx.createLinearGradient(left, 0, left + w, 0);
  g.addColorStop(0, STEEL_LO);
  g.addColorStop(0.25, STEEL);
  g.addColorStop(0.6, STEEL_HI);
  g.addColorStop(1, STEEL_LO);
  ctx.fillStyle = g;
  ctx.fillRect(left, top, w, h);
  ctx.fillStyle = '#F4F2ED';
  ctx.fillRect(left + w * 0.06, top + h * 0.06, w * 0.88, h * 0.88);
  ctx.strokeStyle = 'rgba(46,44,41,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(left + 0.5, top + 0.5, w - 1, h - 1);
  if (isTall) {
    /* the tall plinth carries a small darkwood sculpture */
    var sw = w * 0.34, sh = h * 0.42;
    ctx.fillStyle = WOOD;
    ctx.beginPath();
    ctx.moveTo(left + w / 2 - sw / 2, top + h * 0.62);
    ctx.quadraticCurveTo(left + w / 2 - sw, top + h * 0.30, left + w / 2, top + h * 0.20);
    ctx.quadraticCurveTo(left + w / 2 + sw, top + h * 0.30, left + w / 2 + sw / 2, top + h * 0.62);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = WOOD_HI;
    ctx.beginPath();
    ctx.moveTo(left + w / 2 + sw * 0.28, top + h * 0.30);
    ctx.arc(left + w / 2, top + h * 0.30, sw * 0.28, 0, TAU);
    ctx.fill();
  } else {
    /* the low plinth carries a steel ring sculpture */
    ctx.strokeStyle = STEEL_LO;
    ctx.lineWidth = Math.max(1.5, m * 0.006);
    ctx.beginPath();
    ctx.moveTo(left + w * 0.72, top + h * 0.62);
    ctx.arc(left + w / 2, top + h * 0.62, w * 0.22, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = WOOD;
    ctx.lineWidth = Math.max(1.5, m * 0.005);
    ctx.beginPath();
    ctx.moveTo(left + w * 0.30, top + h * 0.72);
    ctx.lineTo(left + w * 0.70, top + h * 0.72);
    ctx.stroke();
  }
}
function drawChair(rc, t) {
  var m = Math.min(rc.w, rc.h);
  var c = toPx(CHAIR.x, CHAIR.y, rc);
  var w = CHAIR.w * rc.w, h = CHAIR.h * rc.h;
  var left = c.x - w / 2, top = c.y - h / 2;
  ctx.fillStyle = 'rgba(46,44,41,0.14)';
  ctx.beginPath();
  ctx.moveTo(left + w + m * 0.006, top + h * 0.6);
  ctx.ellipse(left + w / 2 + m * 0.006, top + h * 0.6, w * 0.55, h * 0.20, 0, 0, TAU);
  ctx.fill();
  /* seat in dark wood, backrest bar above it */
  ctx.fillStyle = WOOD;
  ctx.fillRect(left, top + h * 0.28, w, h * 0.62);
  ctx.fillStyle = WOOD_HI;
  ctx.fillRect(left + w * 0.08, top + h * 0.34, w * 0.84, h * 0.10);
  ctx.fillStyle = WOOD_LO;
  ctx.fillRect(left, top, w, h * 0.16);
  ctx.strokeStyle = 'rgba(46,44,41,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(left + 0.5, top + h * 0.28 + 0.5, w - 1, h * 0.62 - 1);
}
function drawFragment(f, rc, t) {
  var m = Math.min(rc.w, rc.h);
  var c = toPx(f.x, f.y, rc);
  var g = f.gain;
  var breathe = 0.5 + 0.5 * Math.sin(TAU * t / 5.5 + f.ph);
  var baseA = 0.10 + 0.30 * g;
  var i;
  /* three slow rings around the object, brighter as the pool nears */
  for (i = 1; i <= 3; i++) {
    var r = m * (0.035 + i * 0.028) * (1 + 0.06 * breathe);
    var a = baseA * (1 - i * 0.22) * (0.7 + 0.3 * breathe);
    ctx.strokeStyle = rgba(AMBER_DEEP, a);
    ctx.lineWidth = Math.max(1, m * 0.0035);
    ctx.beginPath();
    ctx.moveTo(c.x + r, c.y);
    ctx.arc(c.x, c.y, r, 0, TAU);
    ctx.stroke();
  }
  /* a small amber dot marking the fragment's home */
  ctx.fillStyle = rgba(AMBER_DEEP, 0.25 + 0.55 * g);
  ctx.beginPath();
  ctx.moveTo(c.x + m * 0.008, c.y);
  ctx.arc(c.x, c.y, m * 0.008, 0, TAU);
  ctx.fill();
}
function drawPool(rc, t) {
  var m = Math.min(rc.w, rc.h);
  var c = toPx(pool.x, pool.y, rc);
  var r = POOL_R * m;
  var breathe = 0.5 + 0.5 * Math.sin(TAU * t / 6 + 0.8);
  var rg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r * 1.9);
  rg.addColorStop(0, rgba(AMBER_HI, 0.55));
  rg.addColorStop(0.55, rgba(AMBER, 0.28));
  rg.addColorStop(1, rgba(AMBER, 0));
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.moveTo(c.x + r * 1.9, c.y);
  ctx.arc(c.x, c.y, r * 1.9, 0, TAU);
  ctx.fill();
  ctx.fillStyle = rgba(AMBER_HI, 0.75 + 0.15 * breathe);
  ctx.beginPath();
  ctx.moveTo(c.x + r, c.y);
  ctx.arc(c.x, c.y, r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(AMBER_DEEP, 0.55);
  ctx.lineWidth = Math.max(1, m * 0.003);
  ctx.beginPath();
  ctx.moveTo(c.x + r * 1.25, c.y);
  ctx.arc(c.x, c.y, r * 1.25, 0, TAU);
  ctx.stroke();
  ctx.fillStyle = rgba('#FBFAF7', 0.9);
  ctx.beginPath();
  ctx.moveTo(c.x + r * 0.22, c.y);
  ctx.arc(c.x, c.y, r * 0.22, 0, TAU);
  ctx.fill();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('As We Breathe').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('As We Breathe').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 09').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('As We Breathe', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 09', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag the listening pool through the room.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, soundPlate.x + 12, soundPlate.y + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var rc = roomRect(sc);
  var t = phaseT;
  if (reduced) {
    var d = driftPos(t);
    pool.x = lerp(d.x, pool.tx, pool.blend);
    pool.y = lerp(d.y, pool.ty, pool.blend);
  }
  /* distance gains are a pure function of the pool position, so they are
     recomputed on every draw and frame one is already correct */
  var i, f, dx, dy, dist, m0 = Math.min(rc.w, rc.h);
  for (i = 0; i < FRAGMENTS.length; i++) {
    f = FRAGMENTS[i];
    dx = (pool.x - f.x) * rc.w / m0;
    dy = (pool.y - f.y) * rc.h / m0;
    dist = Math.sqrt(dx * dx + dy * dy);
    f.gain = clamp(1 - dist / PROX, 0, 1);
  }
  updateAudio();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawRoom(rc, t);
  drawPlinth(TALL_PLINTH, rc, t, true);
  drawPlinth(LOW_PLINTH, rc, t, false);
  drawChair(rc, t);
  var j;
  for (j = 0; j < FRAGMENTS.length; j++) drawFragment(FRAGMENTS[j], rc, t);
  drawPool(rc, t);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    fragmentCount: FRAGMENTS.length,
    poolAt: function () { return { x: pool.x, y: pool.y }; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, pool mid-drift near the chair ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
function pointerRoomPos(ev) {
  var rect = { left: 0, top: 0 };
  try { rect = canvas.getBoundingClientRect(); } catch (e) {}
  var px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  var rc = roomRect(fieldRect());
  return {
    x: clamp((px - rc.x) / Math.max(rc.w, 1), 0.03, 0.97),
    y: clamp((py - rc.y) / Math.max(rc.h, 1), 0.03, 0.97)
  };
}
function onDown(ev) {
  var px = 0, py = 0;
  try { px = ev.clientX; py = ev.clientY; } catch (e) {}
  if (px >= soundPlate.x && px <= soundPlate.x + soundPlate.w && py >= soundPlate.y && py <= soundPlate.y + soundPlate.h) {
    soundOn = !soundOn;
    updateAudio();
    draw();
    return;
  }
  ensureAudio();
  var p = pointerRoomPos(ev);
  pool.dragging = true;
  pool.tx = p.x;
  pool.ty = p.y;
  try { ev.preventDefault(); } catch (e) {}
}
function onMove(ev) {
  if (!pool.dragging) return;
  var p = pointerRoomPos(ev);
  pool.tx = p.x;
  pool.ty = p.y;
  try { ev.preventDefault(); } catch (e) {}
}
function onUp() { pool.dragging = false; }
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('pointerleave', onUp);
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) {
        stepLogic(dt, phaseT, roomRect(fieldRect()));
        draw();
      }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
