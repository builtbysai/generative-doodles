<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&#8470;8969 &middot; Value Ramp Grid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #12100c;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 4vmin 20px 6vmin;
    overflow: hidden;
  }
  header { text-align: center; margin-bottom: 3vmin; max-width: 640px; }
  header .kicker {
    font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 12px;
  }
  header h1 { font-size: 25px; font-weight: normal; margin-bottom: 8px; }
  header h1 .num { color: #5b7bc0; }
  header p { color: #8f8875; font-size: 13.5px; line-height: 1.65; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(94vw, calc((100vh - 220px) * 1.6));
    max-width: 1100px;
    aspect-ratio: 16 / 10;
    background: #f3eee1;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
    position: relative;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 3vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #5b7bc0; text-decoration: none; }
  /* full-bleed render mode for thumbnail captures */
  body.thumbmode { padding: 0; display: block; }
  body.thumbmode header, body.thumbmode footer { display: none; }
  body.thumbmode #stage {
    width: 100vw; height: 100vh; max-width: none; aspect-ratio: auto;
    box-shadow: none; cursor: default;
  }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">&#8470;8969</span> &middot; Value Ramp Grid</h1>
  <p>A field of half-square triangles. Each cell flips a seeded coin for its
  diagonal; value follows a deliberate gradient that the randomness plays
  against. <b>Click for a new variation.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">&larr; all doodles</a> &middot; drawn with code, no libraries</footer>
<script>
"use strict";
/* Doodle 8969 - "Value Ramp Grid"
   Half-square triangle grid. Per cell, one seeded coin picks the diagonal,
   another picks which half goes darker. Lightness follows a positional value
   ramp (diagonal sweep) while the per-cell randomness plays against it:
   the eye averages each cell to its ramp value, so the large-scale flow
   reads first, the diagonal texture second. Paper grain and slightly
   imperfect edges keep it print-like. */

const q = new URLSearchParams(location.search);
let SEED = (parseInt(q.get("seed") || "130", 10) >>> 0);
if (q.get("thumb") === "1") document.body.classList.add("thumbmode");

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};}

const cvs = document.getElementById("c");
const ctx = cvs.getContext("2d");

/* internal resolution: 16:10 */
const VW = 1600, VH = 1000;

function hsl(h, s, l){ return "hsl(" + h.toFixed(1) + "," + s.toFixed(1) + "%," + (l*100).toFixed(1) + "%)"; }

function draw(seed){
  const rnd = mulberry32(seed);
  cvs.width = VW; cvs.height = VH;

  /* ---- paper ---- */
  ctx.fillStyle = "#f3eee1";
  ctx.fillRect(0, 0, VW, VH);

  /* ---- ramp geometry: diagonal sweep, direction varies by seed ---- */
  const dir = Math.floor(rnd() * 4); // 0: TL->BR dark, 1: TR->BL, 2: BR->TL, 3: BL->TR
  function ramp(nx, ny){
    let t;
    if (dir === 0) t = (nx + ny) / 2;
    else if (dir === 1) t = ((1 - nx) + ny) / 2;
    else if (dir === 2) t = 1 - (nx + ny) / 2;
    else t = 1 - (((1 - nx) + ny) / 2);
    return t;
  }

  /* ---- ink family: indigo ---- */
  const HUE = 222, SAT = 48;
  const L0 = 0.10, L1 = 0.90;       // ramp ends
  const DELTA = 0.30;               // value gap between the two halves

  const COLS = 32, ROWS = 20;
  const MX = 56, MY = 56;           // mat margins
  const gw = VW - MX*2, gh = VH - MY*2;
  const cw = gw / COLS, ch = gh / ROWS;

  for (let j = 0; j < ROWS; j++){
    for (let i = 0; i < COLS; i++){
      const x0 = MX + i*cw, y0 = MY + j*ch;
      const nx = (i + 0.5) / COLS, ny = (j + 0.5) / ROWS;
      const t = ramp(nx, ny);
      const L = L0 + (L1 - L0) * t;

      const diag = rnd() < 0.5 ? 0 : 1;      // which diagonal
      const darkFirst = rnd() < 0.5;         // which half goes darker

      const hJ = (rnd() - 0.5) * 6, sJ = (rnd() - 0.5) * 8;
      const lJ = (rnd() - 0.5) * 0.03;
      const d2 = DELTA * (0.92 + rnd() * 0.16);

      const La = Math.min(0.96, Math.max(0.04, L + lJ + (darkFirst ? -d2/2 : d2/2)));
      const Lb = Math.min(0.96, Math.max(0.04, L - lJ + (darkFirst ?  d2/2 : -d2/2)));

      let p1, p2, p3, q1, q2, q3;
      if (diag === 0){ // TL-BR diagonal
        p1=[x0,y0]; p2=[x0+cw,y0+ch]; p3=[x0,y0+ch];
        q1=[x0,y0]; q2=[x0+cw,y0];   q3=[x0+cw,y0+ch];
      } else {         // TR-BL diagonal
        p1=[x0,y0]; p2=[x0+cw,y0]; p3=[x0,y0+ch];
        q1=[x0+cw,y0]; q2=[x0+cw,y0+ch]; q3=[x0,y0+ch];
      }
      // slightly imperfect edges: jitter each triangle independently
      function jit(pt){ return [pt[0] + (rnd()-0.5)*2.4, pt[1] + (rnd()-0.5)*2.4]; }
      p1=jit(p1); p2=jit(p2); p3=jit(p3);
      q1=jit(q1); q2=jit(q2); q3=jit(q3);

      ctx.fillStyle = hsl(HUE + hJ, SAT + sJ, La);
      ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.lineTo(p3[0],p3[1]); ctx.closePath(); ctx.fill();
      ctx.fillStyle = hsl(HUE + hJ, SAT + sJ, Lb);
      ctx.beginPath(); ctx.moveTo(q1[0],q1[1]); ctx.lineTo(q2[0],q2[1]); ctx.lineTo(q3[0],q3[1]); ctx.closePath(); ctx.fill();
    }
  }

  /* ---- paper grain ---- */
  const gr = mulberry32(seed ^ 0x9e3779b9);
  ctx.save();
  ctx.globalAlpha = 0.055;
  for (let k = 0; k < 9000; k++){
    const gx = gr()*VW, gy = gr()*VH, gs = 1 + gr()*1.6;
    ctx.fillStyle = gr() < 0.5 ? "#3a332a" : "#ffffff";
    ctx.fillRect(gx, gy, gs, gs);
  }
  ctx.restore();

  /* ---- plate mark ---- */
  ctx.strokeStyle = "rgba(40,34,26,0.28)";
  ctx.lineWidth = 2;
  ctx.strokeRect(MX - 14, MY - 14, gw + 28, gh + 28);
}

draw(SEED);

cvs.addEventListener("click", () => {
  if (document.body.classList.contains("thumbmode")) return;
  const ns = (Math.random()*1e9) >>> 0;
  location.search = "?seed=" + ns;
});
</script>
</body>
</html>
