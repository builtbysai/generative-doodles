<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.300 Honeyeater Perch</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1B2A4A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.300 Honeyeater Perch (Ali Fisher).
// A New Holland Honeyeater in crisp white linework on deep navy,
// perched on a thin diagonal branch with a vermilion bottlebrush
// at the tip. A smaller silvereye study on Geraldton wax sits in
// the lower right, in the same language, separated by navy space.
// Watch-only, 20 second seamless loop: the honeyeater blinks
// slowly, its tail tips on a soft sine, the bottlebrush filaments
// sway on seeded phases, and exactly one petal detaches at 12s,
// falls and is fully faded by 19s. Flat linework only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var NAVY = '#1B2A4A', WHITE = '#F5F5F0', VERM = '#C73E1D', CREAM = '#F0E6D2', YELLOW = '#E8B93C';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 5.0, lastNow = -1, acc = 0; // frame one: tail off centre, filaments mid-sway
var TICK = 1 / 60;
var LOOP = 20;

function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function smooth(a, b, x) { var u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); }

// ---- faint navy texture: seeded pale specks, very low alpha -------
var specks = [];
(function () {
  var r = rng(300114);
  for (var i = 0; i < 420; i++) specks.push({ x: r() * DW, y: r() * DH, r: 0.7 + r() * 1.5, a: 0.025 + r() * 0.035 });
})();

// ---- bottlebrush filaments: seeded along the rachis ---------------
var filaments = [];
(function () {
  var r = rng(300271);
  for (var i = 0; i < 84; i++) {
    filaments.push({
      u: r(), side: r() < 0.5 ? -1 : 1, len: 26 + r() * 16,
      ph: r() * Math.PI * 2, tilt: (r() - 0.5) * 0.35
    });
  }
})();
// ---- Geraldton wax flowers: seeded petal counts and phases -------
var waxFlowers = [
  { x: 1158, y: 765, s: 26, ph: 0.4 },
  { x: 1122, y: 785, s: 19, ph: 2.1 },
  { x: 1186, y: 795, s: 17, ph: 4.0 },
  { x: 1092, y: 759, s: 13, ph: 1.2 }
];

function stepSim() { T += TICK; }

// ---- branch geometry ----------------------------------------------
function drawMainBranch() {
  ctx.beginPath();
  ctx.moveTo(262, 342);
  ctx.quadraticCurveTo(500, 430, 758, 542);
  ctx.strokeStyle = WHITE; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(262, 348);
  ctx.quadraticCurveTo(500, 436, 752, 546);
  ctx.strokeStyle = WHITE; ctx.lineWidth = 1.4; ctx.stroke();
  // a few small leaves as plain white outlines along the branch
  ctx.lineWidth = 1.8;
  var leafSpots = [[406, 398, -0.7], [530, 446, 0.5], [630, 487, -0.4]];
  for (var i = 0; i < leafSpots.length; i++) {
    var L = leafSpots[i];
    ctx.save(); ctx.translate(L[0], L[1]); ctx.rotate(L[2]);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -11, 32, -4); ctx.quadraticCurveTo(15, 5, 0, 0); ctx.stroke();
    ctx.restore();
  }
}
function drawSmallBranch() {
  ctx.beginPath();
  ctx.moveTo(872, 684);
  ctx.quadraticCurveTo(1018, 722, 1172, 778);
  ctx.strokeStyle = WHITE; ctx.lineWidth = 3.6; ctx.lineCap = 'round'; ctx.stroke();
}

// ---- bottlebrush at the main branch tip ---------------------------
// Rachis runs from the branch tip outward along the branch heading.
function drawBottlebrush(ph) {
  var rx0 = 742, ry0 = 532, rx1 = 838, ry1 = 592;
  var dx = rx1 - rx0, dy = ry1 - ry0;
  var len = Math.sqrt(dx * dx + dy * dy);
  var ux = dx / len, uy = dy / len;
  var px = -uy, py = ux; // perpendicular
  ctx.lineCap = 'round';
  for (var i = 0; i < filaments.length; i++) {
    var f = filaments[i];
    var bx = rx0 + dx * f.u, by = ry0 + dy * f.u;
    var sway = Math.sin(ph * 2 + f.ph) * 4.2 + Math.sin(ph * 4 + f.ph * 1.7) * 1.2;
    var tx = bx + px * f.side * f.len + ux * (f.tilt * 18 + sway * 0.4);
    var ty = by + py * f.side * f.len + uy * (f.tilt * 18) + sway * 0.55;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty);
    ctx.strokeStyle = VERM; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(tx, ty, 2.4, 0, Math.PI * 2); ctx.fillStyle = VERM; ctx.fill();
  }
  ctx.beginPath(); ctx.moveTo(rx0 - ux * 8, ry0 - uy * 8); ctx.lineTo(rx1, ry1);
  ctx.strokeStyle = VERM; ctx.lineWidth = 4; ctx.stroke();
}

// ---- the single falling petal --------------------------------------
// Attached at the bottlebrush edge until 12s, then falls in an arc,
// turning as it goes and fading to nothing by 19s. One petal only.
var PETAL_X = 822, PETAL_Y = 614;
function drawPetal(lt) {
  if (lt >= 19) return;
  var x = PETAL_X, y = PETAL_Y, rot = 0.5, alpha = 1;
  if (lt >= 12) {
    var p = (lt - 12) / 7;
    x = PETAL_X + p * 46 - p * p * 18;
    y = PETAL_Y + p * 34 + p * p * 196;
    rot = 0.5 + p * 5.2;
    alpha = 1 - smooth(0.55, 1, p);
  }
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.moveTo(-13, 0); ctx.quadraticCurveTo(0, -8, 13, 0); ctx.quadraticCurveTo(0, 7, -13, 0);
  ctx.fillStyle = VERM; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(13, 0); ctx.strokeStyle = VERM; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore(); ctx.globalAlpha = 1;
}

// ---- honeyeater -----------------------------------------------------
function blinkAmount(lt) {
  // two slow blinks per loop, smooth and periodic at the seam
  var b = 0;
  var centres = [4.2, 13.6];
  for (var i = 0; i < centres.length; i++) {
    var d = lt - centres[i];
    b = Math.max(b, Math.exp(-(d * d) / 0.018));
  }
  return clamp(b, 0, 1);
}
function drawHoneyeater(lt, ph) {
  var tailTip = Math.sin(ph * 3 + 0.6) * 13;
  var tailMid = Math.sin(ph * 3 + 0.6) * 6;
  ctx.save();
  ctx.translate(368, 292);
  ctx.rotate(-0.10);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  // tail: long, extending back and down, tip riding the sine
  ctx.beginPath();
  ctx.moveTo(-96, 6);
  ctx.quadraticCurveTo(-150, 30 + tailMid, -208, 58 + tailTip);
  ctx.lineTo(-198, 78 + tailTip);
  ctx.quadraticCurveTo(-140, 52 + tailMid, -88, 34);
  ctx.closePath();
  ctx.fillStyle = NAVY; ctx.fill(); ctx.strokeStyle = WHITE; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-100, 16); ctx.quadraticCurveTo(-148, 38 + tailMid, -200, 64 + tailTip);
  ctx.strokeStyle = WHITE; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-96, 26); ctx.quadraticCurveTo(-140, 46 + tailMid, -192, 72 + tailTip);
  ctx.stroke();

  // body silhouette
  ctx.beginPath();
  ctx.moveTo(-112, -8);
  ctx.quadraticCurveTo(-58, -64, 32, -56);
  ctx.quadraticCurveTo(96, -50, 116, -14);
  ctx.quadraticCurveTo(112, 34, 42, 52);
  ctx.quadraticCurveTo(-38, 66, -94, 38);
  ctx.quadraticCurveTo(-124, 22, -112, -8);
  ctx.closePath();
  ctx.fillStyle = NAVY; ctx.fill(); ctx.strokeStyle = WHITE; ctx.lineWidth = 3.2; ctx.stroke();

  // feather hatching: fine parallel strokes along the body curves
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-112, -8);
  ctx.quadraticCurveTo(-58, -64, 32, -56);
  ctx.quadraticCurveTo(96, -50, 116, -14);
  ctx.quadraticCurveTo(112, 34, 42, 52);
  ctx.quadraticCurveTo(-38, 66, -94, 38);
  ctx.quadraticCurveTo(-124, 22, -112, -8);
  ctx.closePath(); ctx.clip();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 1.2;
  for (var i = 0; i < 9; i++) {
    var yy = -38 + i * 11;
    ctx.beginPath();
    ctx.moveTo(-108 + i * 4, yy + 16);
    ctx.quadraticCurveTo(-30, yy - 8, 78, yy + 8);
    ctx.stroke();
  }
  // wing outline inside the hatching
  ctx.beginPath();
  ctx.moveTo(-66, -26);
  ctx.quadraticCurveTo(8, -34, 62, -6);
  ctx.quadraticCurveTo(20, 30, -42, 30);
  ctx.quadraticCurveTo(-70, 8, -66, -26);
  ctx.closePath(); ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-52, -12); ctx.quadraticCurveTo(2, -16, 44, 0); ctx.lineWidth = 1.2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-46, 4); ctx.quadraticCurveTo(0, 0, 36, 12); ctx.stroke();
  ctx.restore();

  // head
  ctx.beginPath(); ctx.arc(126, -34, 39, 0, Math.PI * 2);
  ctx.fillStyle = NAVY; ctx.fill(); ctx.strokeStyle = WHITE; ctx.lineWidth = 3.2; ctx.stroke();
  // fine strokes over the crown
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(126, -34, 31, Math.PI * 1.05, Math.PI * 1.75); ctx.stroke();
  ctx.beginPath(); ctx.arc(126, -34, 24, Math.PI * 1.1, Math.PI * 1.7); ctx.stroke();

  // yellow cheek tuft: a spiky filled patch under the eye, mandatory
  ctx.beginPath();
  ctx.moveTo(100, -26);
  ctx.quadraticCurveTo(118, -30, 138, -22);
  ctx.lineTo(136, -6); ctx.lineTo(126, -14); ctx.lineTo(122, 0);
  ctx.lineTo(112, -10); ctx.lineTo(104, -2); ctx.lineTo(100, -16);
  ctx.closePath();
  ctx.fillStyle = YELLOW; ctx.fill();

  // long curved beak: solid white, sweeping down to a fine point
  ctx.beginPath();
  ctx.moveTo(158, -46);
  ctx.quadraticCurveTo(214, -38, 240, 2);
  ctx.quadraticCurveTo(216, -14, 160, -24);
  ctx.closePath();
  ctx.fillStyle = WHITE; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(160, -36); ctx.quadraticCurveTo(208, -28, 234, -2);
  ctx.strokeStyle = NAVY; ctx.lineWidth = 1.4; ctx.stroke();

  // eye: open disc that flattens to a slit on the blink
  var ba = blinkAmount(lt);
  if (ba > 0.72) {
    ctx.beginPath(); ctx.moveTo(124, -40); ctx.lineTo(144, -40);
    ctx.strokeStyle = WHITE; ctx.lineWidth = 2.6; ctx.stroke();
  } else {
    var sy = 1 - ba * 0.85;
    ctx.save(); ctx.translate(134, -40); ctx.scale(1, sy);
    ctx.beginPath(); ctx.arc(0, 0, 6.4, 0, Math.PI * 2); ctx.fillStyle = WHITE; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, Math.PI * 2); ctx.fillStyle = NAVY; ctx.fill();
    ctx.restore();
  }

  // legs and feet gripping the branch below
  ctx.strokeStyle = WHITE; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(18, 54); ctx.lineTo(8, 102); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(52, 48); ctx.lineTo(52, 112); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(8, 102); ctx.quadraticCurveTo(-6, 108, -12, 100); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, 102); ctx.quadraticCurveTo(10, 112, 22, 110); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(52, 112); ctx.quadraticCurveTo(38, 120, 34, 112); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(52, 112); ctx.quadraticCurveTo(56, 122, 68, 118); ctx.stroke();
  ctx.restore();
}

// ---- silvereye study, lower right -----------------------------------
function drawWaxFlower(f, ph) {
  var sway = Math.sin(ph * 2 + f.ph) * 0.08;
  ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(sway);
  ctx.lineJoin = 'round';
  for (var k = 0; k < 5; k++) {
    var a = (k / 5) * Math.PI * 2 + f.ph;
    ctx.save(); ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(f.s * 0.42, -f.s * 0.40, f.s, 0);
    ctx.quadraticCurveTo(f.s * 0.42, f.s * 0.40, 0, 0);
    ctx.closePath(); ctx.fillStyle = CREAM; ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, f.s * 0.18, 0, Math.PI * 2); ctx.fillStyle = WHITE; ctx.fill();
  ctx.restore();
}
function drawSilvereye(ph) {
  var tailTip = Math.sin(ph * 3 + 2.2) * 5;
  // wax flowers first, behind the bird's branch end
  for (var i = 0; i < waxFlowers.length; i++) drawWaxFlower(waxFlowers[i], ph);
  ctx.save();
  ctx.translate(1008, 662);
  ctx.rotate(-0.08);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // tail
  ctx.beginPath();
  ctx.moveTo(-52, 4);
  ctx.quadraticCurveTo(-84, 18 + tailTip * 0.5, -112, 32 + tailTip);
  ctx.lineTo(-106, 44 + tailTip);
  ctx.quadraticCurveTo(-76, 30 + tailTip * 0.5, -48, 20);
  ctx.closePath();
  ctx.fillStyle = NAVY; ctx.fill(); ctx.strokeStyle = WHITE; ctx.lineWidth = 2.2; ctx.stroke();
  // body
  ctx.beginPath();
  ctx.moveTo(-58, -4);
  ctx.quadraticCurveTo(-28, -34, 20, -30);
  ctx.quadraticCurveTo(52, -26, 62, -6);
  ctx.quadraticCurveTo(58, 20, 22, 28);
  ctx.quadraticCurveTo(-20, 34, -50, 20);
  ctx.quadraticCurveTo(-64, 10, -58, -4);
  ctx.closePath();
  ctx.fillStyle = NAVY; ctx.fill(); ctx.strokeStyle = WHITE; ctx.lineWidth = 2.4; ctx.stroke();
  // feather strokes
  ctx.lineWidth = 1;
  for (var j = 0; j < 5; j++) {
    ctx.beginPath();
    ctx.moveTo(-50 + j * 3, -14 + j * 8);
    ctx.quadraticCurveTo(-12, -20 + j * 8, 38, -10 + j * 8);
    ctx.stroke();
  }
  // wing
  ctx.beginPath();
  ctx.moveTo(-34, -14); ctx.quadraticCurveTo(4, -18, 34, -2);
  ctx.quadraticCurveTo(10, 16, -24, 14); ctx.quadraticCurveTo(-38, 2, -34, -14);
  ctx.closePath(); ctx.lineWidth = 1.6; ctx.stroke();
  // head
  ctx.beginPath(); ctx.arc(66, -18, 21, 0, Math.PI * 2);
  ctx.fillStyle = NAVY; ctx.fill(); ctx.strokeStyle = WHITE; ctx.lineWidth = 2.4; ctx.stroke();
  // short fine beak
  ctx.beginPath();
  ctx.moveTo(84, -22); ctx.quadraticCurveTo(102, -18, 110, -8);
  ctx.quadraticCurveTo(100, -10, 84, -12); ctx.closePath();
  ctx.fillStyle = WHITE; ctx.fill();
  // the silvereye ring: a bold white ring around the eye
  ctx.beginPath(); ctx.arc(70, -20, 8.6, 0, Math.PI * 2); ctx.strokeStyle = WHITE; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(70, -20, 3, 0, Math.PI * 2); ctx.fillStyle = WHITE; ctx.fill();
  // legs to the small branch
  ctx.strokeStyle = WHITE; ctx.lineWidth = 1.9;
  ctx.beginPath(); ctx.moveTo(10, 28); ctx.lineTo(4, 63); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(30, 24); ctx.lineTo(32, 74); ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(4, 63); ctx.quadraticCurveTo(-4, 68, -8, 61); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4, 63); ctx.quadraticCurveTo(6, 71, 14, 70); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(32, 74); ctx.quadraticCurveTo(26, 81, 22, 75); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(32, 74); ctx.quadraticCurveTo(35, 82, 43, 79); ctx.stroke();
  ctx.restore();
}

// ---- drawing ---------------------------------------------------------
function draw() {
  var lt = ((T % LOOP) + LOOP) % LOOP;
  var ph = lt / LOOP * Math.PI * 2;
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, DW, DH);
  // faint texture specks
  for (var i = 0; i < specks.length; i++) {
    var sp = specks[i];
    ctx.globalAlpha = sp.a;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); ctx.fillStyle = WHITE; ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawMainBranch();
  drawBottlebrush(ph);
  drawPetal(lt);
  drawHoneyeater(lt, ph);
  drawSmallBranch();
  drawSilvereye(ph);
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the shaped composition keeps its proportions,
  // page ground is the piece's own navy
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
