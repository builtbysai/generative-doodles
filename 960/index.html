<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happiness Hat</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0C10; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="doodle"></canvas>
<script>
'use strict';
/* No.960 "Happiness Hat" - study #118 lauren-lee-mccarthy, PP121.
   A diagram of discipline: 48 wearers (circles with one arc each) slacken
   toward their resting smiles; a sensor sweep reads them one by one; when a
   smile deviates from the mint target line by more than the threshold, a red
   spike fires from behind the wearer and the arc springs back to the law.
   Fixed-timestep sim (120 Hz), 2400 pre-roll steps, deterministic per seed. */

var COLS = 6, ROWS = 8, COUNT = COLS * ROWS;
var DT = 1 / 120;            // fixed timestep
var PREROLL = 2400;          // 20 s of discipline before frame one
var SCAN_EVERY = 48;         // sensor visits one wearer every 0.4 s
var THRESH = 0.18;           // deviation that earns a spike
var FIRE_STEPS = 24;         // spike extends over 0.2 s
var RETRACT_STEPS = 180;     // spike retracts over 1.5 s, smile springs home
var SPRING_K = 200, SPRING_C = 20;
var TAP_WINDOW = 42;         // steps a tap waits to see if it is a double tap
var BASE_SEED = 960121;

/* ---------------- seeded rng ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------- canvas / viewport ---------------- */
var canvas = document.getElementById('doodle');
var ctx = canvas.getContext('2d');
var viewW = 800, viewH = 800, DPR = 1;

function isPhone() {
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen && window.screen.width) {
    sw = window.screen.width; sh = window.screen.height;
    return Math.min(sw, sh) < 700;
  }
  return viewH > viewW * 1.15; // aspect fallback only
}
function fit() {
  var w = 0, h = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    w = window.visualViewport.width; h = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    w = window.innerWidth; h = window.innerHeight;
  }
  if (!w || !h) { w = 800; h = 800; }
  viewW = w; viewH = h;
  DPR = 1;
  if (typeof window !== 'undefined' && window.devicePixelRatio) {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
  }
  canvas.width = Math.round(viewW * DPR);
  canvas.height = Math.round(viewH * DPR);
}
fit();
var PHONE = isPhone();

/* ---------------- layout ---------------- */
function layout() {
  var cell = Math.min(viewW * (PHONE ? 0.96 : 0.92) / COLS, viewH * 0.90 / ROWS);
  var gw = cell * COLS, gh = cell * ROWS;
  return { cell: cell, gx: (viewW - gw) / 2, gy: (viewH - gh) / 2, gw: gw, gh: gh };
}

/* ---------------- state ---------------- */
var stepCount = 0;
var generation = 0;
var target = 0.75;           // the law: required smile curvature
var wearers = [];
var scanOrder = [];          // seeded permutation of wearer indices
var scanPos = -1;            // position within scanOrder
var scanIdx = -1;            // wearer currently being read
var fireFlash = { idx: -1, step: -10000 };
var events = [];             // recorded interaction events {step, kind, ...}
var pendingTap = null;       // {step, x, y} waiting out the double-tap window

function seedWearers(rng, fresh) {
  for (var i = 0; i < COUNT; i++) {
    var w = wearers[i];
    if (!w) {
      w = { col: i % COLS, row: Math.floor(i / COLS), smile: 0, rest: 0, drift: 0,
            spikeLen: 1, side: 1, mode: 0, phase: 0, vel: 0 };
      wearers[i] = w;
    }
    w.rest = 0.05 + rng() * 0.38;          // resting smile, always below the law
    w.drift = 0.030 + rng() * 0.065;      // slackening rate (per second)
    w.spikeLen = 0.75 + rng() * 0.95;     // in units of body radius
    w.side = rng() < 0.5 ? -1 : 1;        // which way the spike leans back
    if (fresh) {
      w.smile = 0.10 + rng() * 0.85;
      w.mode = 0; w.phase = 0; w.vel = 0;
    }
  }
  // new seeded scanning order
  scanOrder = [];
  for (var j = 0; j < COUNT; j++) scanOrder.push(j);
  for (var k = COUNT - 1; k > 0; k--) {
    var m = Math.floor(rng() * (k + 1));
    var tmp = scanOrder[k]; scanOrder[k] = scanOrder[m]; scanOrder[m] = tmp;
  }
  scanPos = -1;
}

/* ---------------- audio (lazy, guarded) ---------------- */
var AC = null, lastBedStep = -10000, lastSlackStep = -10000;
function ensureAudio() {
  if (AC) { if (AC.resume) AC.resume(); return; }
  var Ctor = null;
  if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
  else if (typeof webkitAudioContext !== 'undefined') Ctor = webkitAudioContext;
  if (!Ctor) return;
  try { AC = new Ctor(); } catch (e) { AC = null; }
}
function tone(freq, freqEnd, dur, gain, type) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    var now = AC.currentTime;
    o.frequency.setValueAtTime(freq, now);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(gain, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(now); o.stop(now + dur + 0.02);
  } catch (e) { /* audio is decoration only */ }
}
function playTick() { tone(2300, 1500, 0.05, 0.045, 'square'); }        // spike fire: metallic tick
function playCorrect() { tone(1318, 0, 0.18, 0.032, 'sine'); }          // correction: the ping, higher
function playBed() { tone(784, 0, 0.22, 0.016, 'sine'); }               // sensor bed ping
function playSlack() {                                                   // a big slacken: descending tone
  if (stepCount - lastSlackStep < 30) return;
  lastSlackStep = stepCount;
  tone(520, 240, 0.25, 0.028, 'sine');
}

/* ---------------- the discipline ---------------- */
function fireSpike(w, idx) {
  w.mode = 1; w.phase = 0; w.vel = 0;
  fireFlash = { idx: idx, step: stepCount };
  playTick();
}
function sensorVisit() {
  scanPos = (scanPos + 1) % COUNT;
  scanIdx = scanOrder[scanPos];
  var w = wearers[scanIdx];
  if (w.mode === 0 && Math.abs(w.smile - target) > THRESH) {
    fireSpike(w, scanIdx);
  }
}

function doRecalibrate(y) {
  var L = layout();
  var t = 1 - (y - L.gy) / L.gh;
  if (t < 0.15) t = 0.15;
  if (t > 1) t = 1;
  target = t; // the law moves; every sensor re-aims at the new curvature
}
function doPoke(idx) {
  var w = wearers[idx];
  w.smile = Math.max(0, w.smile - 0.5); // the crime: a deliberately slackened smile
  playSlack();
}
function doReseed() {
  generation++;
  var rng = mulberry32(BASE_SEED + generation * 7919);
  seedWearers(rng, false); // new cohort: new drift rates, resting values, spike lengths
}
function consumeEvents() {
  for (var i = events.length - 1; i >= 0; i--) {
    if (events[i].step <= stepCount) {
      var ev = events[i];
      events.splice(i, 1);
      if (ev.kind === 'recalibrate') doRecalibrate(ev.y);
      else if (ev.kind === 'poke') doPoke(ev.idx);
      else if (ev.kind === 'reseed') doReseed();
    }
  }
  // a tap that survived the double-tap window becomes a recalibration
  if (pendingTap && stepCount >= pendingTap.step + TAP_WINDOW) {
    doRecalibrate(pendingTap.y);
    pendingTap = null;
  }
}

function step() {
  consumeEvents();
  if (stepCount % SCAN_EVERY === 0) sensorVisit();
  for (var i = 0; i < COUNT; i++) {
    var w = wearers[i];
    if (w.mode === 0) {
      // slackening: exponential drift toward the resting value
      w.smile += (w.rest - w.smile) * (1 - Math.exp(-w.drift * DT));
    } else if (w.mode === 1) {
      w.phase++;
      if (w.phase >= FIRE_STEPS) { w.mode = 2; w.phase = 0; playCorrect(); }
    } else {
      // punishment delivered: the smile springs to the law, damped, with a twitch
      var acc = SPRING_K * (target - w.smile) - SPRING_C * w.vel;
      w.vel += acc * DT;
      w.smile += w.vel * DT;
      w.phase++;
      if (w.phase >= RETRACT_STEPS) { w.mode = 0; w.phase = 0; w.vel = 0; }
    }
  }
  stepCount++;
}

/* ---------------- draw ---------------- */
function draw() {
  canvas.style.width = viewW + 'px';
  canvas.style.height = viewH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0B0C10';
  ctx.fillRect(0, 0, viewW, viewH);
  var L = layout();
  var R = L.cell * 0.30;
  var i, w, cx, cy;

  // faint cell lattice
  ctx.strokeStyle = '#1C1F28';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (i = 0; i <= COLS; i++) {
    ctx.moveTo(L.gx + i * L.cell, L.gy);
    ctx.lineTo(L.gx + i * L.cell, L.gy + L.gh);
  }
  for (i = 0; i <= ROWS; i++) {
    ctx.moveTo(L.gx, L.gy + i * L.cell);
    ctx.lineTo(L.gx + L.gw, L.gy + i * L.cell);
  }
  ctx.stroke();

  // the law: one target line per row, at the height the smile must reach
  var chordOff = 0.22 * R, sagMax = 0.50 * R;
  ctx.strokeStyle = 'rgba(125,249,198,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (i = 0; i < ROWS; i++) {
    var ly = L.gy + (i + 0.5) * L.cell + chordOff + target * sagMax;
    ctx.moveTo(L.gx, ly);
    ctx.lineTo(L.gx + L.gw, ly);
  }
  ctx.stroke();

  // spikes first: they extend from BEHIND the wearer
  for (i = 0; i < COUNT; i++) {
    w = wearers[i];
    if (w.mode === 0) continue;
    cx = L.gx + (w.col + 0.5) * L.cell;
    cy = L.gy + (w.row + 0.5) * L.cell;
    var ext, alpha;
    if (w.mode === 1) {
      var p = w.phase / FIRE_STEPS;
      ext = 1 - (1 - p) * (1 - p);
      alpha = 1;
    } else {
      var q = w.phase / RETRACT_STEPS;
      ext = 1 - q * q;
      alpha = 1 - q;
    }
    if (ext <= 0.01) continue;
    var len = w.spikeLen * R * ext;
    var tipX = cx + w.side * len * 0.55;
    var tipY = cy - R * 0.80 - len * 0.85;
    var baseY = cy - R * 0.78;
    var halfW = R * 0.17;
    ctx.fillStyle = 'rgba(255,59,59,' + alpha.toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(cx - halfW, baseY);
    ctx.lineTo(cx + halfW, baseY);
    ctx.lineTo(tipX, tipY);
    ctx.closePath();
    ctx.fill();
  }

  // wearers: bodies, then the smile arc across the lower half
  ctx.lineWidth = Math.max(1.5, L.cell * 0.032);
  ctx.lineCap = 'round';
  for (i = 0; i < COUNT; i++) {
    w = wearers[i];
    cx = L.gx + (w.col + 0.5) * L.cell;
    cy = L.gy + (w.row + 0.5) * L.cell;
    ctx.strokeStyle = '#C9CFDB';
    ctx.lineWidth = Math.max(1.5, L.cell * 0.032);
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.stroke();
    var s = w.smile;
    if (s < -0.15) s = -0.15;
    if (s > 1.25) s = 1.25;
    var y0 = cy + chordOff;
    ctx.strokeStyle = '#F5F2EA';
    ctx.beginPath();
    ctx.moveTo(cx - 0.62 * R, y0);
    ctx.quadraticCurveTo(cx, y0 + 2 * s * sagMax, cx + 0.62 * R, y0);
    ctx.stroke();
  }

  // the sensor: an amber dot at the wearer being read, a flash ring on a firing
  if (scanIdx >= 0) {
    w = wearers[scanIdx];
    cx = L.gx + (w.col + 0.5) * L.cell;
    cy = L.gy + (w.row + 0.5) * L.cell;
    var pulse = 3 + 1.1 * Math.sin(stepCount * 0.11);
    ctx.fillStyle = '#FFB020';
    ctx.beginPath();
    ctx.arc(cx + R + 5, cy - R - 3, Math.max(2, pulse), 0, Math.PI * 2);
    ctx.fill();
  }
  var fAge = stepCount - fireFlash.step;
  if (fireFlash.idx >= 0 && fAge < 36) {
    w = wearers[fireFlash.idx];
    cx = L.gx + (w.col + 0.5) * L.cell;
    cy = L.gy + (w.row + 0.5) * L.cell;
    ctx.strokeStyle = 'rgba(255,176,32,' + (1 - fAge / 36).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 1.3, 0, Math.PI * 2);
    ctx.stroke();
  }
}

/* ---------------- interaction ---------------- */
function toView(e) {
  var rx = 0, ry = 0;
  if (canvas.getBoundingClientRect) {
    var r = canvas.getBoundingClientRect();
    rx = r.left; ry = r.top;
  }
  return { x: e.clientX - rx, y: e.clientY - ry };
}
var pDown = null, dragging = false, poked = null;

function pokeAt(p) {
  var L = layout();
  var rad = L.cell * 1.1;
  for (var i = 0; i < COUNT; i++) {
    if (poked.has(i)) continue;
    var w = wearers[i];
    var cx = L.gx + (w.col + 0.5) * L.cell;
    var cy = L.gy + (w.row + 0.5) * L.cell;
    var dx = p.x - cx, dy = p.y - cy;
    if (dx * dx + dy * dy <= rad * rad) {
      poked.add(i);
      events.push({ step: stepCount, kind: 'poke', idx: i });
    }
  }
}
function onDown(e) {
  ensureAudio();
  var p = toView(e);
  pDown = p; dragging = false; poked = new Set();
}
function onMove(e) {
  if (!pDown) return;
  var p = toView(e);
  var dx = p.x - pDown.x, dy = p.y - pDown.y;
  if (!dragging && dx * dx + dy * dy > 100) dragging = true;
  if (dragging) pokeAt(p);
}
function onUp(e) {
  if (!pDown) return;
  var p = toView(e);
  if (!dragging) {
    // tap, unless it is the second half of a double tap
    if (pendingTap && stepCount - pendingTap.step < TAP_WINDOW) {
      pendingTap = null; // second tap cancels the pending recalibration
      events.push({ step: stepCount, kind: 'reseed' });
    } else {
      pendingTap = { step: stepCount, x: p.x, y: p.y };
    }
  }
  pDown = null; poked = null; dragging = false;
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { pDown = null; poked = null; dragging = false; });
}
function onResize() { fit(); draw(); }
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('resize', onResize);
}
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', onResize);
}

/* ---------------- run: pre-roll, frame one, live loop ---------------- */
seedWearers(mulberry32(BASE_SEED), true);
for (var s = 0; s < PREROLL; s++) step();
draw();

if (typeof requestAnimationFrame === 'function') {
  var lastTs = -1, acc = 0;
  var frame = function (ts) {
    if (lastTs < 0) lastTs = ts;
    var el = (ts - lastTs) / 1000;
    lastTs = ts;
    if (el > 0.1) el = 0.1; // cap: never spiral after a stall
    acc += el;
    var n = Math.floor(acc / DT);
    if (n > 30) n = 30;
    acc -= n * DT;
    for (var i = 0; i < n; i++) step();
    if (AC && stepCount - lastBedStep > 480) { // sensor bed: a soft ping every few seconds
      lastBedStep = stepCount;
      playBed();
    }
    draw();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
