<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No Extant Tools</title>
<style>
  html, body { margin: 0; padding: 0; background: #07080C; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- constants / palette ----------
  var CONSOLE = '#07080C', SIGNAL = '#4FD6FF', BLOCKFILL = '#14161C',
      BLOCKEDGE = '#3A3D46', CREATURE = '#FFD93B', ECHO = '#FF4FD8',
      TAG = '#8A8D84', FLASH = '#FFFFFF';
  var T0 = 9;                 // frame one is drawn at this fixed offset
  var N = 128;                // samples across every band

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // deterministic 1D lattice hash for value noise
  function hash1(n) {
    n = Math.floor(n);
    n = (n << 13) ^ n;
    return 1 - ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824;
  }
  function vnoise(u) {
    var i = Math.floor(u), f = u - i, s = f * f * (3 - 2 * f);
    return hash1(i) * (1 - s) + hash1(i + 1) * s;
  }

  // ---------- piece state ----------
  var seedBase = 997158;
  var P = null;               // seeded parameter set, rebuilt on reseed
  function buildParams(seed) {
    var r = mulberry32(seed);
    var p = {
      ph1: r() * 6.283, ph2: r() * 6.283, ph3: r() * 6.283,
      wob: 0.7 + r() * 0.6,
      qSteps: 4,              // quantize: levels = qSteps (drag rewrites)
      delay: 9,               // delay: samples (drag rewrites)
      fold: 0.62,             // fold: ceiling in [-1,1] space (drag rewrites)
      creatureSeed: r() * 100,
      glitches: []
    };
    var g = 19.3, k = 0;
    while (g < 400) { p.glitches.push(g); g += 17 + Math.abs(hash1(seed + k * 31)) * 12; k++; }
    return p;
  }
  P = buildParams(seedBase);

  var soloBand = -1, soloUntil = -1;
  var lastTapT = -10, lastTapBand = -1;
  var nowT = T0;

  // ---------- signal model (all pure functions of t) ----------
  function rawAt(i, t) {
    var u = i * 0.055 - t * 0.85;
    var v = 0.55 * vnoise(u * P.wob + P.ph1 * 10)
          + 0.30 * Math.sin(i * 0.21 + t * 2.3 + P.ph2)
          + 0.18 * vnoise(i * 0.31 - t * 2.6 + P.ph3 * 7);
    return v < -1 ? -1 : (v > 1 ? 1 : v);
  }
  function quantize(v) { var s = P.qSteps; return Math.round(v * s) / s; }
  function fold(v) {
    var c = P.fold;
    if (v > c) v = 2 * c - v;
    if (v < -c) v = -2 * c - v;
    if (v > c) v = 2 * c - v;
    if (v < -c) v = -2 * c - v;
    return v;
  }
  function ruledRawAt(i, t) {           // transforms of the raw input only
    var q = quantize(rawAt(i, t));
    var di = i - P.delay; if (di < 0) di = 0;
    var dv = quantize(rawAt(di, t));
    return fold(dv) + 0 * q;            // delay stage samples the quantized stream
  }
  function echoAt(i, t) {               // geometry history fed back: ruled past
    return 0.30 * ruledRawAt(i, t - 3.0);
  }
  function effAt(i, t) {                // effective input = raw + feedback echo
    var v = rawAt(i, t) + (t > 3.2 ? echoAt(i, t) : 0);
    return v < -1 ? -1 : (v > 1 ? 1 : v);
  }
  function stageAt(stage, i, t) {
    if (stage === 0) return effAt(i, t);
    if (stage === 1) return quantize(effAt(i, t));
    if (stage === 2) { var di = i - P.delay; if (di < 0) di = 0; return quantize(effAt(di, t)); }
    return fold(stageAt(2, i, t));
  }
  function glitchAt(t) {
    for (var k = 0; k < P.glitches.length; k++) {
      var g = P.glitches[k];
      if (t >= g && t <= g + 0.4) return g;
    }
    return -1;
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720;

  function viewportSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        window.visualViewport.width) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth) {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = W; h = H; }
    return [Math.round(w), Math.round(h)];
  }
  function isPhone() {
    if (typeof window !== 'undefined' && window.screen && window.screen.width) {
      return Math.min(window.screen.width, window.screen.height) < 700;
    }
    return H > W * 1.15;
  }
  function resize() {
    var s = viewportSize();
    W = s[0]; H = s[1];
    canvas.width = W; canvas.height = H;
    draw(nowT);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }

  // ---------- layout ----------
  function layout() {
    var phone = isPhone();
    var pad = phone ? 8 : 14, gap = phone ? 8 : 12;
    var tagW = phone ? 58 : 88;
    var x0 = tagW + pad, x1 = W - pad;
    var bandH = (H - pad * 2 - gap * 3) / 4;
    var bands = [];
    for (var b = 0; b < 4; b++) {
      bands.push({ x: x0, y: pad + b * (bandH + gap), w: x1 - x0, h: bandH });
    }
    return { phone: phone, pad: pad, gap: gap, tagW: tagW, bands: bands };
  }
  var TAGS = ['INPUT', 'RULES', 'GEOMETRY', 'FEEDBACK'];

  // ---------- drawing helpers ----------
  function wavePath(x0, x1, cy, amp, fn, t, tear) {
    ctx.beginPath();
    for (var i = 0; i < N; i++) {
      var x = x0 + (x1 - x0) * i / (N - 1);
      var yo = (tear >= 0 && i >= 40 && i < 64) ? 4 : 0;
      var y = cy - fn(i, t) * amp + yo;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  function drawWave(x0, x1, cy, amp, stage, t, color, alpha, lw, tear) {
    ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = lw;
    wavePath(x0, x1, cy, amp, function (i, tt) { return stageAt(stage, i, tt); }, t, tear);
    ctx.globalAlpha = 1;
  }

  // ---------- band painters ----------
  function drawInput(b, t, detail, gl) {
    var cy = b.y + b.h / 2, amp = b.h * (detail ? 0.36 : 0.34);
    // feedback undertow: the echo component alone, magenta, under the line
    if (t > 3.2) {
      ctx.strokeStyle = ECHO; ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
      wavePath(b.x, b.x + b.w, cy, amp, function (i, tt) { return echoAt(i, tt); }, t, -1);
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    drawWave(b.x, b.x + b.w, cy, amp, 0, t, SIGNAL, 1, detail ? 2 : 1.5, gl >= 0 ? 1 : -1);
  }

  function blockGlyph(kind, cx, cy, s, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.beginPath();
    if (kind === 0) {            // quantize: steps
      ctx.moveTo(cx - s, cy + s * 0.6); ctx.lineTo(cx - s * 0.3, cy + s * 0.6);
      ctx.lineTo(cx - s * 0.3, cy); ctx.lineTo(cx + s * 0.3, cy);
      ctx.lineTo(cx + s * 0.3, cy - s * 0.6); ctx.lineTo(cx + s, cy - s * 0.6);
    } else if (kind === 1) {     // delay: shifted echo
      ctx.moveTo(cx - s, cy - s * 0.3); ctx.lineTo(cx + s * 0.2, cy - s * 0.3);
      ctx.moveTo(cx - s * 0.2, cy + s * 0.45); ctx.lineTo(cx + s, cy + s * 0.45);
      ctx.moveTo(cx + s * 0.55, cy + s * 0.1); ctx.lineTo(cx + s, cy + s * 0.45);
      ctx.lineTo(cx + s * 0.55, cy + s * 0.8);
    } else {                     // fold: mirrored peak
      ctx.moveTo(cx - s, cy + s * 0.6); ctx.lineTo(cx - s * 0.25, cy - s * 0.6);
      ctx.lineTo(cx, cy + s * 0.1); ctx.lineTo(cx + s * 0.25, cy - s * 0.6);
      ctx.lineTo(cx + s, cy + s * 0.6);
    }
    ctx.stroke();
  }

  function drawRules(b, t, detail, gl) {
    var cy = b.y + b.h / 2, amp = b.h * 0.32;
    var blockW = isPhone() && !detail ? 40 : 58;
    var segW = (b.w - 3 * blockW) / 4;
    var flickerBlock = gl >= 0 ? Math.floor(gl) % 3 : -1;
    for (var s = 0; s < 4; s++) {
      var sx = b.x + s * (segW + blockW);
      drawWave(sx, sx + segW, cy, amp, s, t, SIGNAL, 1, 1.5, -1);
      if (s < 3) {
        var bx = sx + segW, by = b.y + b.h * 0.18, bh = b.h * 0.64;
        ctx.fillStyle = (s === flickerBlock && Math.floor(t * 30) % 2 === 0) ? FLASH : BLOCKFILL;
        ctx.strokeStyle = BLOCKEDGE; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.rect(bx, by, blockW, bh); ctx.fill(); ctx.stroke();
        blockGlyph(s, bx + blockW / 2, by + bh / 2, Math.min(blockW, bh) * 0.26,
                   s === flickerBlock ? BLOCKFILL : TAG);
        if (detail) {
          // the block's insides: its transfer curve
          ctx.strokeStyle = SIGNAL; ctx.globalAlpha = 0.75; ctx.beginPath();
          for (var k = 0; k <= 20; k++) {
            var vin = -1 + 2 * k / 20, vout;
            if (s === 0) vout = quantize(vin);
            else if (s === 1) vout = vin * 0.82;
            else vout = fold(vin);
            var gx = bx + 5 + (blockW - 10) * k / 20;
            var gy = by + bh - 5 - (bh - 10) * (vout + 1) / 2;
            if (k === 0) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
          }
          ctx.stroke(); ctx.globalAlpha = 1;
        }
      }
    }
  }

  function creaturePose(t) {
    // chain of joints driven by ruled-signal probes
    var probes = [8, 26, 44, 62, 80, 98, 116];
    var cxDrive = stageAt(3, 64, t), cyDrive = stageAt(3, 30, t);
    var pts = [], ang = -0.4 + stageAt(3, 50, t) * 0.8;
    var x = 0, y = 0;
    pts.push([x, y]);
    for (var k = 0; k < 6; k++) {
      ang += stageAt(3, probes[k], t) * 0.85 + Math.sin(t * 1.7 + k * 1.1 + P.creatureSeed) * 0.18;
      x += Math.cos(ang); y += Math.sin(ang) * 0.72;
      pts.push([x, y]);
    }
    return { pts: pts, cx: cxDrive, cy: cyDrive };
  }

  function drawGeometry(b, t, detail, gl) {
    var tC = gl >= 0 ? gl : t;                    // stutter: pose freezes at glitch start
    var pose = creaturePose(tC);
    var seg = b.h * (detail ? 0.30 : 0.17);
    var cx = b.x + b.w * 0.5 + pose.cx * b.w * 0.30;
    var cy = b.y + b.h / 2 + pose.cy * b.h * 0.26;
    // press against band edges: clamp the root inside the band
    if (cx < b.x + seg) cx = b.x + seg;
    if (cx > b.x + b.w - seg * 3) cx = b.x + b.w - seg * 3;
    if (cy < b.y + seg * 0.6) cy = b.y + seg * 0.6;
    if (cy > b.y + b.h - seg * 0.6) cy = b.y + b.h - seg * 0.6;
    var pts = pose.pts, px = [], py = [], i;
    for (i = 0; i < pts.length; i++) { px.push(cx + pts[i][0] * seg); py.push(cy + pts[i][1] * seg); }
    ctx.strokeStyle = CREATURE; ctx.lineWidth = detail ? 2.5 : 2;
    ctx.beginPath();
    ctx.moveTo(px[0], py[0]);
    for (i = 1; i < px.length; i++) ctx.lineTo(px[i], py[i]);
    ctx.stroke();
    // side limbs from joints 2 and 4, angled by other probes
    ctx.lineWidth = detail ? 2 : 1.5;
    var limbSrc = [2, 4];
    for (var L = 0; L < 2; L++) {
      var j = limbSrc[L];
      var a1 = stageAt(3, 20 + L * 60, tC) * 1.6 + (L ? 2.2 : -2.2);
      var mx = px[j] + Math.cos(a1) * seg * 0.8, my = py[j] + Math.sin(a1) * seg * 0.8;
      var a2 = a1 + stageAt(3, 100 - L * 60, tC) * 1.2;
      var ex = mx + Math.cos(a2) * seg * 0.7, ey = my + Math.sin(a2) * seg * 0.7;
      ctx.beginPath(); ctx.moveTo(px[j], py[j]); ctx.lineTo(mx, my); ctx.lineTo(ex, ey); ctx.stroke();
    }
    // joint dots + head
    ctx.fillStyle = CREATURE;
    for (i = 0; i < px.length; i++) {
      ctx.beginPath(); ctx.arc(px[i], py[i], i === 0 ? 3.4 : 2, 0, 6.2832); ctx.fill();
    }
  }

  function drawFeedback(b, t, detail, gl) {
    var cy = b.y + b.h / 2, amp = b.h * (detail ? 0.36 : 0.34);
    // older geometry echoes first (deepest ghost), then nearer, then current
    ctx.strokeStyle = ECHO; ctx.globalAlpha = 0.20; ctx.lineWidth = 1;
    wavePath(b.x, b.x + b.w, cy, amp, function (i, tt) { return stageAt(3, i, tt); }, t - 4.4, -1);
    ctx.stroke();
    ctx.globalAlpha = 0.40;
    wavePath(b.x, b.x + b.w, cy, amp, function (i, tt) { return stageAt(3, i, tt); }, t - 2.2, -1);
    ctx.stroke(); ctx.globalAlpha = 1;
    drawWave(b.x, b.x + b.w, cy, amp, 0, t, SIGNAL, 0.9, detail ? 2 : 1.5, -1);
  }

  var PAINTERS = [
    function (b, t, d, g) { drawInput(b, t, d, g); },
    function (b, t, d, g) { drawRules(b, t, d, g); },
    function (b, t, d, g) { drawGeometry(b, t, d, g); },
    function (b, t, d, g) { drawFeedback(b, t, d, g); }
  ];

  // ---------- main draw ----------
  function draw(t) {
    nowT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = CONSOLE;
    ctx.fillRect(0, 0, W, H);
    var L = layout();
    var gl = glitchAt(t);
    var solo = (soloBand >= 0 && t < soloUntil) ? soloBand : -1;
    ctx.font = (L.phone ? '9px' : '11px') + ' monospace';
    ctx.textBaseline = 'middle';

    if (solo >= 0) {
      var sb = { x: L.bands[0].x, y: L.pad, w: L.bands[0].w, h: H - L.pad * 2 };
      ctx.fillStyle = TAG;
      ctx.fillText(TAGS[solo], L.pad, L.pad + 8);
      PAINTERS[solo](sb, t, true, gl);
      return;
    }
    for (var b = 0; b < 4; b++) {
      var band = L.bands[b];
      ctx.fillStyle = TAG;
      ctx.fillText(TAGS[b], L.pad, band.y + band.h / 2);
      // faint band separator
      ctx.strokeStyle = BLOCKEDGE; ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(band.x, band.y + band.h + L.gap / 2);
      ctx.lineTo(band.x + band.w, band.y + band.h + L.gap / 2); ctx.stroke();
      ctx.globalAlpha = 1;
      // connector carrying the signal down
      if (b < 3) {
        ctx.strokeStyle = SIGNAL; ctx.globalAlpha = 0.5;
        ctx.beginPath();
        var cxL = band.x + 26;
        ctx.moveTo(cxL, band.y + band.h); ctx.lineTo(cxL, band.y + band.h + L.gap);
        ctx.moveTo(cxL - 3, band.y + band.h + L.gap - 4);
        ctx.lineTo(cxL, band.y + band.h + L.gap);
        ctx.lineTo(cxL + 3, band.y + band.h + L.gap - 4);
        ctx.stroke(); ctx.globalAlpha = 1;
      }
      PAINTERS[b](band, t, false, gl);
    }
  }

  // ---------- audio (lazy, guarded; simplified per spec) ----------
  var AC = null, melOsc = null, melGain = null;
  function ensureAudio() {
    try {
      if (AC || typeof window === 'undefined') return;
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      AC = new Ctor();
      // raw noise bed (INPUT / RULES voices, very quiet)
      var len = AC.sampleRate * 1;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      var r = mulberry32(42);
      for (var i = 0; i < len; i++) d[i] = r() * 2 - 1;
      var noise = AC.createBufferSource(); noise.buffer = buf; noise.loop = true;
      var nf = AC.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 900;
      var ng = AC.createGain(); ng.gain.value = 0.015;
      noise.connect(nf); nf.connect(ng); ng.connect(AC.destination); noise.start();
      // melodic line from the creature + delayed feedback echo of it
      melOsc = AC.createOscillator(); melOsc.type = 'triangle'; melOsc.frequency.value = 220;
      melGain = AC.createGain(); melGain.gain.value = 0.03;
      var delay = AC.createDelay(1); delay.delayTime.value = 0.34;
      var fb = AC.createGain(); fb.gain.value = 0.3;
      var wet = AC.createGain(); wet.gain.value = 0.4;
      melOsc.connect(melGain); melGain.connect(AC.destination);
      melGain.connect(delay); delay.connect(fb); fb.connect(delay);
      delay.connect(wet); wet.connect(AC.destination);
      melOsc.start();
    } catch (e) { AC = null; }
  }

  // ---------- interaction ----------
  var dragBlock = -1, dragStartX = 0, dragStartVal = 0, downX = 0, downY = 0, downT = 0;
  function piecePos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function bandAt(y) {
    var L = layout();
    for (var b = 0; b < 4; b++) {
      if (y >= L.bands[b].y && y <= L.bands[b].y + L.bands[b].h) return b;
    }
    return -1;
  }
  function blockAt(x, y) {
    var L = layout(), b = L.bands[1];
    if (y < b.y || y > b.y + b.h) return -1;
    var blockW = isPhone() ? 40 : 58;
    var segW = (b.w - 3 * blockW) / 4;
    for (var s = 0; s < 3; s++) {
      var bx = b.x + (s + 1) * segW + s * blockW;
      if (x >= bx && x <= bx + blockW) return s;
    }
    return -1;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      ensureAudio();
      var p = piecePos(e); downX = p[0]; downY = p[1]; downT = nowT;
      dragBlock = (bandAt(p[1]) === 1) ? blockAt(p[0], p[1]) : -1;
      dragStartX = p[0];
      dragStartVal = dragBlock === 0 ? P.qSteps : (dragBlock === 1 ? P.delay : P.fold);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (dragBlock < 0) return;
      var p = piecePos(e), dx = p[0] - dragStartX;
      if (dragBlock === 0) P.qSteps = Math.max(2, Math.min(10, Math.round(dragStartVal + dx / 18)));
      else if (dragBlock === 1) P.delay = Math.max(0, Math.min(24, Math.round(dragStartVal + dx / 6)));
      else P.fold = Math.max(0.25, Math.min(0.95, dragStartVal + dx / 220));
    });
    canvas.addEventListener('pointerup', function (e) {
      var p = piecePos(e);
      var moved = Math.abs(p[0] - downX) + Math.abs(p[1] - downY);
      var wasDrag = dragBlock >= 0 && Math.abs(p[0] - dragStartX) > 8;
      dragBlock = -1;
      if (wasDrag || moved > 10) return;
      // a tap
      if (nowT - lastTapT < 0.35) {           // double-tap: rebuild
        seedBase = (seedBase * 1103515245 + 12345) & 0x7fffffff;
        P = buildParams(seedBase);
        soloBand = -1;
        lastTapT = -10;
        return;
      }
      lastTapT = nowT;
      var b = bandAt(p[1]);
      if (b >= 0) { soloBand = b; soloUntil = nowT + 10; lastTapBand = b; }
    });
  }

  // ---------- run ----------
  var s0 = viewportSize(); W = s0[0]; H = s0[1];
  canvas.width = W; canvas.height = H;
  draw(T0);                                    // frame one: fixed phase, synchronous
  if (typeof requestAnimationFrame === 'function') {
    var startTs = null;
    var loop = function (ts) {
      if (startTs === null) startTs = ts;
      var t = T0 + (ts - startTs) / 1000;
      draw(t);
      if (AC && melOsc) {
        try {
          var f = 160 + (stageAt(3, 64, t) * 0.5 + 0.5) * 240;
          melOsc.frequency.setTargetAtTime(f, AC.currentTime, 0.08);
        } catch (e) {}
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
