<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№8998 · Abyssal — Generative Doodles</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#010507;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:Georgia,'Times New Roman',serif;color:#9fb4c4;min-height:100vh;min-height:100dvh}
  header{text-align:center;padding:14px 16px 6px;max-width:760px}
  h1{font-size:17px;font-weight:normal;letter-spacing:.14em;margin:0 0 4px;color:#d7e6f2}
  h1 .num{color:#7fd4e8}

  #wrap{position:relative;width:min(94vw,78vh,720px)}
  #stage{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;
    border:1px solid #0d2233;border-radius:6px;background:#010507}
  #cap{font-size:12.5px;font-style:italic;color:#63798c;text-align:center;
    padding:8px 20px 4px;max-width:720px;min-height:2.4em}

<body>
<header>
  <h1><span class="num">№8998</span> · ABYSSAL</h1>
  <p class="sub">a living creature in dark water</p>
</header>
<div id="wrap"><canvas id="stage"></canvas></div>
<p id="cap">It drifts on its own. Prod it and watch it settle.</p>
<footer><a href="../">Generative Doodles</a> · drawn live in your browser</footer>
<script>
"use strict";
/* Abyssal: a differential-growth creature with equilibrium-restoring behavior.
   Every membrane node carries a home position on a seeded harmonic rest
   shape; springs pull displaced nodes back, so a prod recoils and settles.
   Rendered as bioluminescence: additive glow sprites, a hand-built
   variable-width membrane ribbon, inner organelles, trailing filaments,
   marine snow. */
const TAU = Math.PI * 2;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const cap = document.getElementById('cap');

/* ---------- seeded prng ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let seed = 899804;
try {
  const m = /[?&]seed=(\d+)/.exec(location.search);
  if (m) seed = parseInt(m[1], 10) >>> 0;
} catch(e){}
let rnd = mulberry32(seed);

/* ---------- layout (1000-unit stage, fitted) ---------- */
const VU = 1000;
let stage = 760, dpr = 1, scale = 1;
function fit(){
  const r = cv.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  stage = Math.max(280, r.width);
  cv.width = Math.round(stage * dpr);
  cv.height = Math.round(stage * dpr);
  scale = cv.width / VU;
}
window.addEventListener('resize', fit);

/* ---------- glow sprites (pre-rendered, tinted) ---------- */
function glowSprite(rgb){
  const s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0, `rgba(${rgb},1)`);
  gr.addColorStop(0.25, `rgba(${rgb},0.55)`);
  gr.addColorStop(0.6, `rgba(${rgb},0.16)`);
  gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0,0,s,s);
  return c;
}
const SPR = {
  cyan: glowSprite('120,230,255'),
  teal: glowSprite('60,220,200'),
  violet: glowSprite('170,140,255'),
  amber: glowSprite('255,190,110'),
  white: glowSprite('235,250,255')
};
function stamp(spr, x, y, size, alpha){
  ctx.globalAlpha = alpha;
  ctx.drawImage(spr, x - size/2, y - size/2, size, size);
  ctx.globalAlpha = 1;
}

/* ---------- creature ---------- */
const C = {
  nodes: [],      // {x,y,hx,hy,vx,vy}
  organelles: [],
  filaments: [],
  snow: [],
  flash: -1e9,    // flash wavefront position (node index float)
  flashT: 0,
  t: 0,
  driftA: 0, driftB: 0,
  cx: VU/2, cy: VU/2
};
const MAXN = 420;

function harmonicR(a, terms, base){
  let r = base;
  for (const [amp, fr, ph] of terms) r += amp * Math.sin(fr * a + ph);
  return r;
}
function buildCreature(){
  const n0 = 56;
  const terms = [];
  for (let k = 0; k < 5; k++)
    terms.push([(0.14 + rnd()*0.22), 2 + Math.floor(rnd()*5), rnd()*TAU]);
  const base = 160 + rnd()*40;
  // per-seed body character: elongation + tilt, so no two creatures share a silhouette
  C.elong = 0.72 + rnd()*0.5;
  C.tilt = rnd()*TAU;
  C.terms = terms; C.base = base;
  C.nodes = [];
  for (let i = 0; i < n0; i++){
    const a = i/n0 * TAU;
    const r = harmonicR(a, terms, base);
    let x = Math.cos(a)*r, y = Math.sin(a)*r;
    const ca = Math.cos(C.tilt), sa = Math.sin(C.tilt);
    const xr = x*ca - y*sa, yr = (x*sa + y*ca) * C.elong;
    x = C.cx + xr; y = C.cy + yr;
    C.nodes.push({x, y, hx:x, hy:y, vx:0, vy:0});
  }
  // organelles: inner glowing bodies, own slow orbits
  C.organelles = [];
  const no = 3 + Math.floor(rnd()*3);
  const tints = ['violet','amber','teal','cyan','violet'];
  for (let i = 0; i < no; i++){
    const ot = [];
    for (let k = 0; k < 2; k++)
      ot.push([(0.12+rnd()*0.14), 2+Math.floor(rnd()*2), rnd()*TAU]);
    C.organelles.push({
      terms: ot, base: 22 + rnd()*30,
      orbR: 40 + rnd()*95, orbA: rnd()*TAU, orbS: (0.00012+rnd()*0.0002) * (rnd()<0.5?-1:1),
      tint: tints[i % tints.length], ph: rnd()*TAU, x: C.cx, y: C.cy
    });
  }
  // filaments: trailing tentacles rooted on the lower membrane, curling down
  C.filaments = [];
  const nf = 10 + Math.floor(rnd()*5);
  for (let i = 0; i < nf; i++){
    // root angle biased to the lower hemisphere (angle measured from center)
    const ra = (Math.PI*0.15) + rnd()*(Math.PI*0.7); // lower hemisphere (y down)
    let best = 0, bd = 1e18;
    for (let k = 0; k < n0; k++){
      const a = k/n0*TAU;
      let dd = Math.abs(a - ra); dd = Math.min(dd, TAU-dd);
      if (dd < bd){ bd = dd; best = k; }
    }
    C.filaments.push({
      root: (best + Math.floor((rnd()-0.5)*10) + n0) % n0, len: 110 + rnd()*150,
      segs: 9, ph: rnd()*TAU, sway: 0.5 + rnd()*0.8,
      w: 4 + rnd()*6, tint: rnd() < 0.75 ? 'teal' : 'cyan',
      curl: (rnd()-0.5)*1.6
    });
  }
  // marine snow
  C.snow = [];
  for (let i = 0; i < 90; i++)
    C.snow.push({x: rnd()*VU, y: rnd()*VU, s: 1+rnd()*2.6,
      vy: 3+rnd()*9, ph: rnd()*TAU, a: 0.05+rnd()*0.16});
  C.flash = -1e9; C.flashT = 0; C.t = 0;
  C.driftA = rnd()*TAU; C.driftB = rnd()*TAU;
}

/* per-frame physics: home springs restore equilibrium */
function physics(dt){
  const ns = C.nodes, n = ns.length;
  C.t += dt;
  // slow whole-creature drift: home positions ride a lissajous wander
  const dx = Math.cos(C.t*0.00021 + C.driftA) * 46 + Math.cos(C.t*0.000073 + C.driftB) * 26;
  const dy = Math.sin(C.t*0.00017 + C.driftA*1.7) * 40 + Math.sin(C.t*0.00009 + C.driftB) * 22;
  const breathe = 1 + 0.045 * Math.sin(C.t*0.0011);
  const kHome = 0.060, kSmooth = 0.16, damp = 0.90, maxSp = 6;
  for (let i = 0; i < n; i++){
    const p = ns[i];
    const hx = C.cx + dx + (p.hx - C.cx) * breathe;
    const hy = C.cy + dy + (p.hy - C.cy) * breathe;
    let ax = (hx - p.x) * kHome, ay = (hy - p.y) * kHome;
    const pr = ns[(i-1+n)%n], nx = ns[(i+1)%n];
    ax += ((pr.x + nx.x)/2 - p.x) * kSmooth;
    ay += ((pr.y + nx.y)/2 - p.y) * kSmooth;
    // wander: layered sines, small, keeps it alive
    ax += Math.sin(C.t*0.0016 + i*0.7) * 0.10 + Math.sin(C.t*0.00043 + i*2.3) * 0.08;
    ay += Math.cos(C.t*0.0013 + i*0.9) * 0.10 + Math.cos(C.t*0.00051 + i*1.7) * 0.08;
    let nvx = (p.vx + ax) * damp, nvy = (p.vy + ay) * damp;
    const sp = Math.hypot(nvx, nvy);
    if (sp > maxSp){ nvx = nvx/sp*maxSp; nvy = nvy/sp*maxSp; }
    p.vx = nvx; p.vy = nvy;
    p.x += p.vx * dt/16.7; p.y += p.vy * dt/16.7;
  }
  // subdivide stretched edges so the membrane keeps resolution
  const grown = [];
  for (let i = 0; i < n; i++){
    const p = ns[i], q = ns[(i+1)%n];
    grown.push(p);
    if (grown.length >= MAXN) continue;
    const ex = q.x-p.x, ey = q.y-p.y;
    if (ex*ex + ey*ey > 26*26){
      grown.push({x:(p.x+q.x)/2, y:(p.y+q.y)/2,
        hx:(p.hx+q.hx)/2, hy:(p.hy+q.hy)/2,
        vx:(p.vx+q.vx)/2, vy:(p.vy+q.vy)/2});
    }
  }
  C.nodes = grown;
  // organelles drift on slow orbits
  for (const o of C.organelles){
    o.orbA += o.orbS * dt;
    o.x = C.cx + dx + Math.cos(o.orbA) * o.orbR;
    o.y = C.cy + dy + Math.sin(o.orbA) * o.orbR * 0.8;
  }
  // flash wavefront advances around the loop
  if (C.flashT > 0){
    C.flash += dt * 0.045;
    C.flashT -= dt;
  }
}

/* prod: displace nearby nodes + fire the light wave */
function prod(px, py, strong){
  const ns = C.nodes, n = ns.length;
  const R = strong ? 190 : 130;
  let best = 0, bd = 1e18;
  for (let i = 0; i < n; i++){
    const p = ns[i];
    const dx = p.x - px, dy = p.y - py, d = Math.hypot(dx, dy) || 1;
    if (d < bd){ bd = d; best = i; }
    if (d < R){
      const f = (1 - d/R) * (strong ? 26 : 15);
      p.vx += dx/d * f; p.vy += dy/d * f;
    }
  }
  C.flash = best; C.flashT = 2600;
  cap.textContent = 'It flinches, then settles. Prod it again, or click empty water for a new creature.';
}

/* ---------- rendering ---------- */
/* hand-built variable-width membrane ribbon: per-vertex width shaped by
   curvature pressure + flash wave. No default strokes. */
function drawMembrane(){
  const ns = C.nodes, n = ns.length;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // 1) soft body fill: radial glow clipped to the membrane path
  ctx.beginPath();
  for (let i = 0; i <= n; i++){
    const p = ns[i % n];
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(10,60,70,0.20)';
  ctx.fill();
  // 2) glow sprites along the membrane, pressure-shaped
  const fw = C.flash;
  for (let i = 0; i < n; i += 2){
    const p = ns[i];
    // curvature pressure from neighbor angle
    const a = ns[(i-1+n)%n], b = ns[(i+1)%n];
    const v1x = p.x-a.x, v1y = p.y-a.y, v2x = b.x-p.x, v2y = b.y-p.y;
    const l1 = Math.hypot(v1x,v1y)+1e-6, l2 = Math.hypot(v2x,v2y)+1e-6;
    const turn = 1 - (v1x*v2x + v1y*v2y)/(l1*l2); // 0 straight, 2 folded
    let w = 26 + turn*46;
    // flash wave boosts width + brightness as it passes
    let fl = 0;
    if (C.flashT > 0){
      let dd = Math.abs(i - fw) % n; if (dd > n/2) dd = n - dd;
      fl = Math.exp(-(dd*dd)/(2*14*14));
      w += fl * 60;
    }
    stamp(SPR.teal, p.x, p.y, w*3.0, 0.14 + turn*0.12 + fl*0.30);
    if (fl > 0.25) stamp(SPR.white, p.x, p.y, w*1.1, fl*0.5);
  }
  // 3) the membrane ribbon itself: triangle strip, per-vertex width+alpha
  const verts = [];
  for (let i = 0; i <= n; i++){
    const p = ns[i % n];
    const q = ns[(i+1) % n], a = ns[(i-1+n) % n];
    let nx = (q.y - a.y), ny = -(q.x - a.x);
    const nl = Math.hypot(nx, ny) + 1e-6; nx/=nl; ny/=nl;
    const v1x = p.x-a.x, v1y = p.y-a.y, v2x = q.x-p.x, v2y = q.y-p.y;
    const l1 = Math.hypot(v1x,v1y)+1e-6, l2 = Math.hypot(v2x,v2y)+1e-6;
    const turn = 1 - (v1x*v2x + v1y*v2y)/(l1*l2);
    let w = 3.2 + turn*7;
    let bright = 0.55 + turn*0.3;
    if (C.flashT > 0){
      let dd = Math.abs((i%n) - fw) % n; if (dd > n/2) dd = n - dd;
      const fl = Math.exp(-(dd*dd)/(2*14*14));
      w += fl*10; bright += fl*0.45;
    }
    const disp = Math.hypot(p.x-p.hx, p.y-p.hy); // strain glows hotter
    bright += Math.min(0.35, disp*0.004);
    verts.push({lx:p.x+nx*w/2, ly:p.y+ny*w/2, rx:p.x-nx*w/2, ry:p.y-ny*w/2, b:Math.min(1,bright)});
  }
  for (let i = 0; i < n; i++){
    const A = verts[i], B = verts[i+1];
    const g = ctx.createLinearGradient(A.lx, A.ly, A.rx, A.ry);
    const edge = 'rgba(70,200,220,0.05)', mid = `rgba(190,245,255,${0.5*A.b+0.25})`;
    g.addColorStop(0, edge); g.addColorStop(0.5, mid); g.addColorStop(1, edge);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(A.lx, A.ly); ctx.lineTo(B.lx, B.ly);
    ctx.lineTo(B.rx, B.ry); ctx.lineTo(A.rx, A.ry);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawCurrents(){
  // faint internal flow lines between organelles: the body's inner weather
  const os = C.organelles;
  if (os.length < 2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (let i = 0; i < os.length; i++){
    const a = os[i], b = os[(i+1) % os.length];
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const off = Math.sin(C.t*0.0008 + i*2.1) * 40;
    const dx = b.x-a.x, dy = b.y-a.y, dl = Math.hypot(dx,dy)+1e-6;
    const cxp = mx + (-dy/dl)*off, cyp = my + (dx/dl)*off;
    const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
    g.addColorStop(0, 'rgba(90,190,220,0)');
    g.addColorStop(0.5, 'rgba(90,190,220,0.10)');
    g.addColorStop(1, 'rgba(90,190,220,0)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(cxp, cyp, b.x, b.y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawOrganelles(){
  const ns = C.nodes;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const o of C.organelles){
    const pulse = 0.75 + 0.25*Math.sin(C.t*0.002 + o.ph);
    const r = o.base * pulse;
    stamp(SPR[o.tint], o.x, o.y, r*5.2, 0.16);
    stamp(SPR[o.tint], o.x, o.y, r*2.2, 0.35);
    // nucleus: bright core
    stamp(SPR.white, o.x, o.y, r*0.9, 0.8);
    // faint outline of the organelle body
    ctx.strokeStyle = 'rgba(150,200,255,0.10)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i <= 40; i++){
      const a = i/40*TAU;
      const rr = harmonicR(a, o.terms, o.base*0.9);
      const x = o.x + Math.cos(a)*rr, y = o.y + Math.sin(a)*rr;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.closePath(); ctx.stroke();
  }
  ctx.restore();
}

function drawFilaments(){
  const ns = C.nodes, n = ns.length;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of C.filaments){
    const root = ns[f.root % n];
    // outward direction = away from centroid, blended with downward
    let ox = root.x - C.cx, oy = root.y - C.cy;
    const ol = Math.hypot(ox, oy) + 1e-6; ox/=ol; oy/=ol;
    ox = ox*0.55; oy = oy*0.55 + 0.75;
    const ol2 = Math.hypot(ox, oy); ox/=ol2; oy/=ol2;
    const px = -oy, py = ox; // perpendicular
    const pts = [];
    for (let s = 0; s <= f.segs; s++){
      const t = s/f.segs;
      const sway = Math.sin(C.t*0.0011*f.sway + f.ph + t*3.2) * 30 * t
                 + f.curl * 60 * t * t;
      pts.push({
        x: root.x + ox*f.len*t + px*sway,
        y: root.y + oy*f.len*t + py*sway*0.5 + t*t*24
      });
    }
    // tapering ribbon strip
    for (let s = 0; s < f.segs; s++){
      const A = pts[s], B = pts[s+1];
      let dx = B.x-A.x, dy = B.y-A.y;
      const dl = Math.hypot(dx,dy)+1e-6; dx/=dl; dy/=dl;
      const w0 = f.w*(1-s/f.segs)+0.8, w1 = f.w*(1-(s+1)/f.segs)+0.8;
      const a0 = 0.22*(1-s/f.segs), a1 = 0.22*(1-(s+1)/f.segs);
      const g = ctx.createLinearGradient(A.x-dy*w0/2, A.y+dx*w0/2, A.x+dy*w0/2, A.y-dx*w0/2);
      g.addColorStop(0, 'rgba(80,200,215,0)');
      g.addColorStop(0.5, `rgba(120,225,240,${a0.toFixed(3)})`);
      g.addColorStop(1, 'rgba(80,200,215,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(A.x-dy*w0/2, A.y+dx*w0/2);
      ctx.lineTo(B.x-dy*w1/2, B.y+dx*w1/2);
      ctx.lineTo(B.x+dy*w1/2, B.y-dx*w1/2);
      ctx.lineTo(A.x+dy*w0/2, A.y-dx*w0/2);
      ctx.closePath(); ctx.fill();
    }
    // glowing tip
    const tip = pts[f.segs];
    stamp(SPR[f.tint], tip.x, tip.y, 30, 0.4);
    stamp(SPR.white, tip.x, tip.y, 10, 0.5);
  }
  ctx.restore();
}

function drawSnow(){
  ctx.save();
  for (const s of C.snow){
    s.y += s.vy * 0.016; s.x += Math.sin(C.t*0.0004 + s.ph) * 0.25;
    if (s.y > VU){ s.y = -4; s.x = rnd()*VU; }
    const tw = 0.6 + 0.4*Math.sin(C.t*0.002 + s.ph);
    ctx.fillStyle = `rgba(160,200,225,${(s.a*tw).toFixed(3)})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.restore();
}

function drawGround(){
  const g = ctx.createRadialGradient(VU/2, VU/2, 60, VU/2, VU/2, VU*0.72);
  g.addColorStop(0, '#061522');
  g.addColorStop(0.55, '#020a13');
  g.addColorStop(1, '#010507');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VU, VU);
  // faint depth rays from above
  ctx.save();
  ctx.globalAlpha = 0.05;
  for (let i = 0; i < 5; i++){
    const x = VU*(0.2 + i*0.15);
    const lg = ctx.createLinearGradient(x, 0, x+40, VU);
    lg.addColorStop(0, 'rgba(120,200,240,0.5)');
    lg.addColorStop(1, 'rgba(120,200,240,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(x-14, 0); ctx.lineTo(x+14, 0);
    ctx.lineTo(x+70, VU); ctx.lineTo(x-42, VU);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function render(dt){
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawGround();
  drawSnow();
  drawFilaments();
  drawMembrane();
  drawCurrents();
  drawOrganelles();
  // vignette
  ctx.setTransform(1,0,0,1,0,0);
  const vg = ctx.createRadialGradient(cv.width/2, cv.height/2, cv.width*0.32,
    cv.width/2, cv.height/2, cv.width*0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, cv.width, cv.height);
}

/* ---------- main loop ---------- */
let last = 0;
function frame(ts){
  const dt = Math.min(50, ts - (last || ts));
  last = ts;
  physics(dt);
  render(dt);
  requestAnimationFrame(frame);
}

/* ---------- interaction ---------- */
function toVU(e){
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left)/r.width*VU, (e.clientY - r.top)/r.height*VU];
}
let downAt = null, moved = 0, stirring = false;
cv.addEventListener('pointerdown', e => {
  const [x, y] = toVU(e);
  downAt = [x, y]; moved = 0;
  // near the creature? prod. else wait to see if it is a click (new creature)
  const d = Math.hypot(x - C.cx, y - C.cy);
  stirring = d < 320;
  if (stirring) prod(x, y, true);
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!downAt) return;
  const [x, y] = toVU(e);
  moved += Math.hypot(x - downAt[0], y - downAt[1]);
  downAt = [x, y];
  if (stirring && moved > 2) prod(x, y, false); // drag = stir gently
});
cv.addEventListener('pointerup', e => {
  if (downAt && !stirring && moved < 8){
    const [x, y] = toVU(e);
    seed = (Math.random()*1e9) >>> 0;
    rnd = mulberry32(seed);
    buildCreature();
    cap.textContent = 'A new creature surfaces. Prod it and watch it settle.';
    try { history.replaceState(null, '', '?seed=' + seed); } catch(err){}
  }
  downAt = null; stirring = false;
});

fit();
buildCreature();
requestAnimationFrame(frame);
</script>
</body>
