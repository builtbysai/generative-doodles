<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№8998 · Tennis Ball — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14110c;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 620px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #d9a441; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #14110d;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #d9a441; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№8998</span> · Tennis Ball</h1>
  <p>One sphere, one box, three lights. The palette below is not chosen, it is
  read off the ball's skin: every color is the same light in the same room.
  <b>Click the piece to relight the room.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 899803;
const TAU = Math.PI * 2;
const VU = 1000;
const RW = 96, RH = 61; // raytrace resolution, matched to panel aspect

function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function sub(a, b){ return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function dot(a, b){ return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function norm(a){ const l = Math.hypot(a[0],a[1],a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; }
function hsl(h, s, l){ // -> [r,g,b] 0..1
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2*l - 1)) * s, x = c * (1 - Math.abs((h/60) % 2 - 1)), m = l - c/2;
  let r,g,b;
  if (h < 60){ r=c; g=x; b=0; } else if (h < 120){ r=x; g=c; b=0; }
  else if (h < 180){ r=0; g=c; b=x; } else if (h < 240){ r=0; g=x; b=c; }
  else if (h < 300){ r=x; g=0; b=c; } else { r=c; g=0; b=x; }
  return [r+m, g+m, b+m];
}

// 1D value noise for ring wobble
function makeNoise1D(rnd){
  const g = new Float32Array(64);
  for (let i = 0; i < 64; i++) g[i] = rnd() * 2 - 1;
  return function(t){
    const x = t * 8, i0 = Math.floor(x) % 64, i1 = (i0 + 1) % 64, f = x - Math.floor(x);
    const u = f * f * (3 - 2 * f);
    return g[(i0 + 64) % 64] * (1 - u) + g[i1] * u;
  };
}

function buildRoom(rnd){
  const sphere = {
    c: [-1.1 + rnd() * 2.2, 0, -2.6 + rnd() * 1.2],
    r: 0.85 + rnd() * 0.35
  };
  sphere.c[1] = sphere.r; // resting on the floor
  const baseHue = rnd() * 360;
  const lights = [
    { p: [-2.2 + rnd()*1.2, 3.4, -0.6], c: hsl(baseHue, 0.62, 0.62), i: 1.35 },
    { p: [2.3, 2.2 + rnd(), -2.8],      c: hsl(baseHue + 120, 0.58, 0.60), i: 1.05 },
    { p: [0.4, 3.6, -3.6],              c: hsl(baseHue + 235, 0.60, 0.64), i: 0.85 }
  ];
  return { sphere, lights };
}

// ray vs room: returns {t, n, albedo, spec} or null
function intersect(ro, rd, room){
  const { sphere } = room;
  let best = null;
  // sphere
  const oc = sub(ro, sphere.c);
  const b = dot(oc, rd), c = dot(oc, oc) - sphere.r * sphere.r;
  const disc = b * b - c;
  if (disc > 0){
    const t = -b - Math.sqrt(disc);
    if (t > 1e-4) best = { t, n: norm(sub([ro[0]+rd[0]*t, ro[1]+rd[1]*t, ro[2]+rd[2]*t], sphere.c)), albedo: [0.72, 0.68, 0.62], spec: 0.55 };
  }
  // box: floor y=0, back z=-4, left x=-3, right x=3, ceiling y=4
  const planes = [
    { n: [0,1,0],  d: 0,  albedo: [0.80, 0.78, 0.74], spec: 0.10, lim: p => Math.abs(p[0]) <= 3 && p[2] >= -4 && p[2] <= 2.0 },
    { n: [0,0,1],  d: -4, albedo: [0.78, 0.76, 0.72], spec: 0.10, lim: p => Math.abs(p[0]) <= 3 && p[1] >= 0 && p[1] <= 4 },
    { n: [1,0,0],  d: -3, albedo: [0.76, 0.74, 0.70], spec: 0.10, lim: p => p[1] >= 0 && p[1] <= 4 && p[2] >= -4 && p[2] <= 2.0 },
    { n: [-1,0,0], d: -3, albedo: [0.76, 0.74, 0.70], spec: 0.10, lim: p => p[1] >= 0 && p[1] <= 4 && p[2] >= -4 && p[2] <= 2.0 },
    { n: [0,-1,0], d: -4, albedo: [0.70, 0.68, 0.64], spec: 0.10, lim: p => Math.abs(p[0]) <= 3 && p[2] >= -4 && p[2] <= 2.0 }
  ];
  for (const pl of planes){
    const dn = dot(rd, pl.n);
    if (Math.abs(dn) < 1e-6) continue;
    const t = (pl.d - dot(ro, pl.n)) / dn;
    if (t < 1e-4 || (best && t >= best.t)) continue;
    const p = [ro[0]+rd[0]*t, ro[1]+rd[1]*t, ro[2]+rd[2]*t];
    if (pl.lim(p)) best = { t, n: pl.n, albedo: pl.albedo, spec: pl.spec };
  }
  return best;
}

function shade(p, n, mat, room, rnd){
  let r = 0.16 * mat.albedo[0], g = 0.16 * mat.albedo[1], b = 0.16 * mat.albedo[2]; // ambient
  const v = norm(sub([0, 2.0, 3.8], p));
  for (const L of room.lights){
    const toL = sub(L.p, p);
    const dist = Math.hypot(toL[0], toL[1], toL[2]);
    const ld = [toL[0]/dist, toL[1]/dist, toL[2]/dist];
    const sp = [p[0] + n[0]*1e-3, p[1] + n[1]*1e-3, p[2] + n[2]*1e-3];
    const sh = intersect(sp, ld, room);
    if (sh && sh.t < dist - 1e-3) continue; // in shadow
    const att = 1 / (1 + 0.10 * dist * dist);
    const dif = Math.max(0, dot(n, ld));
    const h = norm([ld[0]+v[0], ld[1]+v[1], ld[2]+v[2]]);
    const spc = Math.pow(Math.max(0, dot(n, h)), 42) * mat.spec;
    const k = L.i * att;
    r += mat.albedo[0] * L.c[0] * dif * k + L.c[0] * spc * k;
    g += mat.albedo[1] * L.c[1] * dif * k + L.c[1] * spc * k;
    b += mat.albedo[2] * L.c[2] * dif * k + L.c[2] * spc * k;
  }
  const tm = c => Math.pow(clamp(c, 0, 4) / (1 + clamp(c, 0, 4)), 1/2.2);
  return [tm(r), tm(g), tm(b)];
}

function renderRoom(room, rnd){
  const cv = document.createElement("canvas");
  cv.width = RW; cv.height = RH;
  const g = cv.getContext("2d");
  const img = g.createImageData(RW, RH);
  const eye = [0, 2.0, 3.8];
  const fwd = norm(sub([0, 1.05, -1.8], eye));
  const right = norm([fwd[2], 0, -fwd[0]]);
  const up = norm([-fwd[1]*fwd[2], fwd[0]*fwd[0]+fwd[2]*fwd[2], -fwd[1]*fwd[0]]);
  const fov = 0.50; // half-height scale at unit distance
  for (let y = 0; y < RH; y++){
    for (let x = 0; x < RW; x++){
      const sx = ((x + 0.5) / RW - 0.5) * 2 * fov * (RW / RH);
      const sy = (0.5 - (y + 0.5) / RH) * 2 * fov;
      const rd = norm([fwd[0] + right[0]*sx + up[0]*sy, fwd[1] + right[1]*sx + up[1]*sy, fwd[2] + right[2]*sx + up[2]*sy]);
      const hit = intersect(eye, rd, room);
      let col = [0.078, 0.067, 0.051]; // misses blend into the panel ground
      if (hit){
        const p = [eye[0]+rd[0]*hit.t, eye[1]+rd[1]*hit.t, eye[2]+rd[2]*hit.t];
        col = shade(p, hit.n, hit, room, rnd);
      }
      const i = (y * RW + x) * 4;
      img.data[i] = col[0] * 255; img.data[i+1] = col[1] * 255; img.data[i+2] = col[2] * 255; img.data[i+3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return cv;
}

// read the palette off the sphere's visible skin
function samplePalette(room, rnd){
  const cols = [];
  const { sphere } = room;
  for (let i = 0; i < 10; i++){
    const a = (i / 10) * TAU + rnd() * 0.4;
    const el = 0.15 + rnd() * 0.75; // elevation toward camera
    const n = norm([Math.cos(a) * Math.cos(el), Math.sin(el), Math.sin(a) * Math.cos(el) + 0.9]);
    const nn = norm(n);
    const p = [sphere.c[0] + nn[0]*sphere.r, sphere.c[1] + nn[1]*sphere.r, sphere.c[2] + nn[2]*sphere.r];
    cols.push(shade(p, nn, { albedo: [0.72,0.68,0.62], spec: 0.55 }, room, rnd));
  }
  // dedupe: keep colors far enough apart, cap at 7
  const pal = [];
  for (const c of cols){
    let ok = true;
    for (const k of pal){
      if (Math.hypot(c[0]-k[0], c[1]-k[1], c[2]-k[2]) < 0.16){ ok = false; break; }
    }
    if (ok && pal.length < 7) pal.push(c);
  }
  while (pal.length < 4) pal.push(cols[(rnd() * cols.length) | 0]);
  return pal.map(c => `rgb(${(c[0]*255)|0},${(c[1]*255)|0},${(c[2]*255)|0})`);
}

let ctx;
function setupCanvas(){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = stage.clientWidth;
  const K = S / VU;
  canvas.width = S * dpr; canvas.height = S * dpr;
  ctx = canvas.getContext("2d");
  ctx.setTransform(dpr * K, 0, 0, dpr * K, 0, 0);
}

function render(){
  const rnd = mulberry32(seed);
  const room = buildRoom(rnd);
  const roomCv = renderRoom(room, rnd);
  const palette = samplePalette(room, rnd);
  const noise = makeNoise1D(mulberry32(seed ^ 0xbeef));

  setupCanvas();
  // ground
  ctx.fillStyle = "#14110d";
  ctx.fillRect(0, 0, VU, VU);

  // the room, pixelated, top panel
  const roomY = 46, roomH = 520;
  const pad = 60;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(roomCv, pad, roomY, VU - 2*pad, roomH);
  ctx.imageSmoothingEnabled = true;
  ctx.strokeStyle = "rgba(232,226,210,0.22)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(pad, roomY, VU - 2*pad, roomH);
  ctx.fillStyle = "rgba(232,226,210,0.55)";
  ctx.font = "italic 20px Georgia, serif";
  ctx.textAlign = "left";
  ctx.fillText("the room · three lights", pad, roomY + roomH + 38);

  // divider
  ctx.strokeStyle = "rgba(232,226,210,0.14)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, 636); ctx.lineTo(VU - pad, 636); ctx.stroke();

  // the composition: concentric wobbling rings in the sampled palette
  const ccx = 500 + (rnd() - 0.5) * 120, ccy = 845;
  const nRings = 8 + ((rnd() * 4) | 0);
  ctx.lineCap = "round";
  for (let i = 0; i < nRings; i++){
    const rBase = 24 + i * (114 / nRings) + rnd() * 5;
    const ph = rnd() * TAU, k = 2 + ((rnd() * 3) | 0);
    ctx.strokeStyle = palette[i % palette.length];
    ctx.globalAlpha = 0.92;
    ctx.lineWidth = 5 + rnd() * 9;
    ctx.beginPath();
    const steps = 90;
    for (let s = 0; s <= steps; s++){
      const a = (s / steps) * TAU;
      const wob = 1 + 0.14 * noise(ph / TAU + (i * 0.37) + (a / TAU) * k);
      const rr = rBase * wob;
      const px = ccx + Math.cos(a) * rr, py = ccy + Math.sin(a) * rr * 0.92;
      if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // palette strip legend
  const sw = 44;
  const sx0 = 500 - (palette.length * sw) / 2;
  palette.forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.fillRect(sx0 + i * sw, 656, sw - 3, 10);
  });
  ctx.fillStyle = "rgba(232,226,210,0.45)";
  ctx.font = "italic 15px Georgia, serif";
  ctx.textAlign = "center";
  ctx.fillText(`palette read off the sphere · ${palette.length} colors`, 500, 686);

  const vg = ctx.createRadialGradient(500, 500, 360, 500, 500, 780);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.35)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VU, VU);
}

window.addEventListener("resize", render);
document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  render();
});
render();
</script>
</body>
</html>
