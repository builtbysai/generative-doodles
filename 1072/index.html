<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Well-Trained Birds</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #E8E8E6;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
(function () {
  'use strict';

  var T0 = 20;
  var LOOP = 60;
  var WORLD = 1000;
  var canvas = document.getElementById('piece');
  var ctx = canvas.getContext('2d');
  var currentT = T0;
  var view = { w: 0, h: 0, scale: 1, ox: 0, oy: 0, phone: false };
  var generation = 0;
  var drag = null;
  var lastTap = null;
  var scatter = null;
  var audio = null;

  var COLORS = {
    void: '#E8E8E6',
    frame: '#141417',
    orb: '#BFE3FF',
    led: '#FF4B4B',
    ledWhite: '#FFFFFF',
    performer: '#1A1A1C'
  };

  // The anchor (performer) the flock serves. Its motion is analytic:
  // an ease from anchorFrom to anchorTo over ANCHOR_EASE seconds since anchorT0.
  var ANCHOR_HOME = { x: 500, y: 812 };
  var ANCHOR_EASE = 2.6;
  var anchorFrom = { x: ANCHOR_HOME.x, y: ANCHOR_HOME.y };
  var anchorTo = { x: ANCHOR_HOME.x, y: ANCHOR_HOME.y };
  var anchorT0 = -100;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function hash(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function smooth(u) { return u * u * (3 - 2 * u); }

  function resize() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    }
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(vw * dpr));
    canvas.height = Math.max(1, Math.round(vh * dpr));
    var screenMin = 0;
    if (window.screen) screenMin = Math.min(window.screen.width || 0, window.screen.height || 0);
    var phone = screenMin > 0 ? screenMin < 700 : vh > vw * 1.15;
    var scale = Math.min(vw / WORLD, vh / WORLD);
    view = {
      w: vw,
      h: vh,
      dpr: dpr,
      scale: scale,
      ox: (vw - WORLD * scale) / 2,
      oy: (vh - WORLD * scale) / 2,
      phone: phone
    };
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(currentT); });
  }
  window.addEventListener('resize', function () { resize(); draw(currentT); });
  resize();

  function anchorPos(t) {
    var u = clamp((t - anchorT0) / ANCHOR_EASE, 0, 1);
    var s = smooth(u);
    return {
      x: anchorFrom.x + (anchorTo.x - anchorFrom.x) * s,
      y: anchorFrom.y + (anchorTo.y - anchorFrom.y) * s
    };
  }

  // 24 drones: 3 columns x 4 stacked pairs x 2 abreast.
  var drones = [];
  (function buildDrones() {
    var i = 0;
    for (var col = 0; col < 3; col++) {
      for (var row = 0; row < 4; row++) {
        for (var side = 0; side < 2; side++) {
          drones.push({
            i: i,
            col: col,
            row: row,
            side: side,
            p1: hash(i * 3 + 1) * Math.PI * 2,
            p2: hash(i * 5 + 2) * Math.PI * 2,
            f1: 0.55 + hash(i * 7 + 3) * 0.5,
            f2: 0.9 + hash(i * 11 + 4) * 0.7,
            amp: 2.2 + hash(i * 13 + 5) * 1.6
          });
          i++;
        }
      }
    }
  })();

  // Formation slot of a drone relative to the anchor, per generation.
  function slotFor(d) {
    var g = generation * 977;
    var colX = (d.col - 1) * 250 + (hash(g + d.col * 31) - 0.5) * 14;
    var rowY = -688 + d.row * 158 + (hash(g + d.row * 47 + d.col * 3) - 0.5) * 16;
    var sideX = d.side === 0 ? -22 : 22;
    return { x: colX + sideX, y: rowY };
  }

  function scatterAmount(t) {
    if (!scatter) return 0;
    var age = t - scatter.t;
    if (age < 0 || age > 3.4) return 0;
    var s = Math.sin(Math.PI * (age / 3.4));
    return s * s;
  }

  function dronePos(d, t, anchor) {
    var slot = slotFor(d);
    var bx = anchor.x + slot.x;
    var by = anchor.y + slot.y;
    // Micro-corrections: the well-trained part. Small, slow, seeded.
    var jx = Math.sin(t * d.f1 + d.p1) * d.amp + Math.sin(t * 0.23 + d.p2) * 1.1;
    var jy = Math.cos(t * d.f2 + d.p2) * d.amp * 0.7 + Math.sin(t * 0.31 + d.p1) * 0.9;
    var sa = scatterAmount(t);
    if (sa > 0) {
      var cx = anchor.x;
      var cy = anchor.y - 350;
      var dx = bx - cx;
      var dy = by - cy;
      var len = Math.hypot(dx, dy) || 1;
      var push = 118 * sa;
      bx += (dx / len) * push + (hash(d.i * 17 + 1) - 0.5) * 46 * sa;
      by += (dy / len) * push - 26 * sa;
    }
    return { x: bx + jx, y: by + jy };
  }

  function circle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawOrbGlow(x, y) {
    ctx.fillStyle = COLORS.orb;
    ctx.globalAlpha = 0.10;
    circle(x, y, 17);
    ctx.globalAlpha = 0.20;
    circle(x, y, 11.5);
    ctx.globalAlpha = 0.34;
    circle(x, y, 7.5);
    ctx.globalAlpha = 1;
  }

  function drawDrone(x, y) {
    // Orb glow spill first painted in the glow pass; here the mast and frame.
    ctx.strokeStyle = COLORS.frame;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // mast to the orb riding on top
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y + 2);
    ctx.lineTo(x, y - 11);
    ctx.stroke();
    // skeletal X frame
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(x - 11, y - 4);
    ctx.lineTo(x + 11, y + 4);
    ctx.moveTo(x + 11, y - 4);
    ctx.lineTo(x - 11, y + 4);
    ctx.stroke();
    // rotor rings at the four corners
    ctx.lineWidth = 1.6;
    var corners = [[-11, -6], [11, -6], [-11, 6], [11, 6]];
    for (var k = 0; k < 4; k++) {
      ctx.beginPath();
      ctx.arc(x + corners[k][0], y + corners[k][1], 4.2, 0, Math.PI * 2);
      ctx.stroke();
    }
    // center plate
    ctx.fillStyle = COLORS.frame;
    ctx.fillRect(x - 4, y - 3, 8, 6);
    // LED points: red port, white starboard
    ctx.fillStyle = COLORS.led;
    ctx.globalAlpha = 0.8;
    circle(x - 11, y - 6, 1.9);
    ctx.fillStyle = COLORS.ledWhite;
    circle(x + 11, y - 6, 1.7);
    ctx.globalAlpha = 1;
  }

  function drawOrbCore(x, y) {
    ctx.fillStyle = COLORS.orb;
    ctx.globalAlpha = 1;
    circle(x, y, 4.8);
    ctx.fillStyle = COLORS.ledWhite;
    ctx.globalAlpha = 0.9;
    circle(x, y, 1.9);
    ctx.globalAlpha = 1;
  }

  function drawPerformer(p, t) {
    var sway = Math.sin(t * 0.5) * 0.035;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(sway);
    ctx.strokeStyle = COLORS.performer;
    ctx.fillStyle = COLORS.performer;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 5;
    ctx.beginPath();
    // legs
    ctx.moveTo(0, -22);
    ctx.lineTo(-8, 2);
    ctx.moveTo(0, -22);
    ctx.lineTo(8, 2);
    // torso
    ctx.moveTo(0, -22);
    ctx.lineTo(0, -46);
    // arms raised: the signal the flock serves
    ctx.moveTo(0, -42);
    ctx.lineTo(-13, -60);
    ctx.moveTo(0, -42);
    ctx.lineTo(13, -60);
    ctx.stroke();
    // head
    circle(0, -53, 5.5);
    ctx.restore();
  }

  function draw(t) {
    currentT = t;
    canvas.style.width = view.w + 'px';
    canvas.style.height = view.h + 'px';
    ctx.setTransform(view.dpr || 1, 0, 0, view.dpr || 1, 0, 0);
    ctx.fillStyle = COLORS.void;
    ctx.fillRect(0, 0, view.w, view.h);
    ctx.translate(view.ox, view.oy);
    ctx.scale(view.scale, view.scale);

    var anchor = anchorPos(t);
    var positions = drones.map(function (d) { return dronePos(d, t, anchor); });
    // glow pass (flat-alpha layers: the orb light spilling into the void)
    var i;
    for (i = 0; i < positions.length; i++) drawOrbGlow(positions[i].x, positions[i].y - 15);
    // frames
    for (i = 0; i < positions.length; i++) drawDrone(positions[i].x, positions[i].y);
    // orb cores on top, crisp
    for (i = 0; i < positions.length; i++) drawOrbCore(positions[i].x, positions[i].y - 15);
    drawPerformer(anchor, t);
    updateAudio(t);
  }

  function ensureAudio() {
    if (audio) {
      if (audio.ctx.state === 'suspended' && audio.ctx.resume) audio.ctx.resume();
      return;
    }
    var AC = null;
    if (typeof AudioContext !== 'undefined') AC = AudioContext;
    else if (typeof webkitAudioContext !== 'undefined') AC = webkitAudioContext;
    if (!AC) return;
    try {
      var actx = new AC();
      var master = actx.createGain();
      master.gain.value = 0.05;
      master.connect(actx.destination);
      // rotor wash: looped noise through a bandpass, barely there
      var len = actx.sampleRate * 2;
      var buffer = actx.createBuffer(1, len, actx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      var noise = actx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;
      var band = actx.createBiquadFilter();
      band.type = 'bandpass';
      band.frequency.value = 900;
      band.Q.value = 0.6;
      var washGain = actx.createGain();
      washGain.gain.value = 0.16;
      noise.connect(band); band.connect(washGain); washGain.connect(master);
      noise.start();
      // the soft low tone under the performer that the flock harmonizes to
      var tone = actx.createOscillator();
      var toneGain = actx.createGain();
      tone.type = 'sine';
      tone.frequency.value = 82;
      toneGain.gain.value = 0.32;
      tone.connect(toneGain); toneGain.connect(master);
      tone.start();
      audio = { ctx: actx, master: master, washGain: washGain, band: band, tone: tone };
    } catch (e) {
      audio = null;
    }
  }

  function updateAudio(t) {
    if (!audio) return;
    try {
      var now = audio.ctx.currentTime;
      var effort = 0.16 + scatterAmount(t) * 0.22 + (drag && drag.moved ? 0.1 : 0);
      audio.washGain.gain.setTargetAtTime(effort, now, 0.12);
      audio.band.frequency.setTargetAtTime(880 + Math.sin(t * 0.4) * 60 + scatterAmount(t) * 240, now, 0.12);
      audio.tone.frequency.setTargetAtTime(82 + Math.sin(t * 0.25) * 1.5, now, 0.12);
    } catch (e) {}
  }

  function pointerWorld(ev) {
    var rect = canvas.getBoundingClientRect();
    var cx = (ev.clientX - rect.left - view.ox) / view.scale;
    var cy = (ev.clientY - rect.top - view.oy) / view.scale;
    return { x: cx, y: cy };
  }

  function clampAnchor(p) {
    return { x: clamp(p.x, 252, 748), y: clamp(p.y, 700, 884) };
  }

  function onDown(ev) {
    ensureAudio();
    var p = pointerWorld(ev);
    drag = { startX: p.x, startY: p.y, startT: currentT, moved: false, begun: false };
    if (canvas.setPointerCapture && ev.pointerId !== undefined) {
      try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    }
  }

  function onMove(ev) {
    if (!drag) return;
    var p = pointerWorld(ev);
    if (Math.hypot(p.x - drag.startX, p.y - drag.startY) > 7) drag.moved = true;
    if (drag.moved) {
      if (!drag.begun) {
        anchorFrom = anchorPos(currentT);
        drag.begun = true;
      }
      anchorTo = clampAnchor(p);
      anchorT0 = currentT;
    }
    draw(currentT);
  }

  function onUp(ev) {
    if (!drag) return;
    var p = pointerWorld(ev);
    var ended = drag;
    drag = null;
    var quick = currentT - ended.startT < 0.45;
    if (quick && !ended.moved) {
      if (lastTap && currentT - lastTap.t < 0.42 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 40) {
        // double-tap: a new flock — reseeded column targets
        generation++;
        scatter = null;
        lastTap = null;
        draw(currentT);
        return;
      }
      lastTap = { t: currentT, x: p.x, y: p.y };
      scatter = { t: currentT };
    }
    draw(currentT);
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { drag = null; });

  function frame(ms) {
    var t = T0 + (typeof ms === 'number' && isFinite(ms) ? ms / 1000 : 0);
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  frame(0);
})();
</script>
</body>
</html>
