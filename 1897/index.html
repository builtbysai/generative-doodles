<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smaller Than a Semitone</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Smaller Than a Semitone: one tone line, divided first into twelve
   semitone blocks. A practice cursor descends on the blocks, then
   keeps dividing: quarters, then ever finer hairlines, until the
   line is a dense shimmer of microtonal threads. A tap proposes a
   new target: the line marks it with a chalk tick, the cursor tries,
   wobbles, and either lands or drifts past. The miss is the
   interesting event: the line redraws itself and tries again,
   narrowing. Landed attempts are pale gold, misses are chalk, the
   target tick is signal red. Audio is a lazy sine on tap only. */
var TAU = Math.PI * 2;
var GROUND = '#0A0A0A';
var CHALK = '#F2EFE6';
var RED = '#E03131';
var GOLD = '#E8C86A';
var FRAME_T = 10.0;      /* fixed phase: hairline depth, third attempt
                            mid-wobble, two misses and one landing in
                            the history below the line */
var ATTEMPT_DUR = 2.6;   /* seconds per attempt */
var ATTEMPT_GAP = 0.8;   /* seconds before the first attempt starts */
var TOL = 0.01;          /* landing tolerance, fraction of line width */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* The target, as a fraction along the line, and the attempt origin
   in seconds. Both fixed at load for a reproducible frame one. */
var target = 0.618;
var attemptOrigin = 0;
/* QA hooks only: ?t=N sets the clock in seconds, ?tap=F proposes a
   target at fraction F of the line, ?seed=N derives a target from
   that seed. No link in the piece uses these. */
try {
  var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
  var mt = qs.match(/[?&]t=([0-9.]+)/);
  var mp = qs.match(/[?&]tap=([0-9.]+)/);
  var ms = qs.match(/[?&]seed=([0-9]+)/);
  if (mt) phaseT = parseFloat(mt[1]);
  if (mp) { target = clamp(parseFloat(mp[1]), 0.02, 0.98); attemptOrigin = 0; }
  else if (ms) {
    var srng = mulberry32(parseInt(ms[1], 10));
    target = 0.30 + srng() * 0.40;
    attemptOrigin = 0;
  }
} catch (e) { /* keep defaults */ }
FRAME_T = phaseT;
/* Attempt table: each attempt drifts by a fixed offset from the
   target and wobbles with a narrowing amplitude. The first two
   miss, the third lands, later ones refine. Deterministic. */
var DRIFTS = [0.042, -0.020, 0.003, -0.002, 0.001, -0.001];
var AMPS = [0.050, 0.030, 0.012, 0.006, 0.004, 0.003];
function attemptCount(relT) {
  if (relT < ATTEMPT_GAP) return -1;
  return Math.floor((relT - ATTEMPT_GAP) / ATTEMPT_DUR);
}
function attemptOf(k) {
  var d = DRIFTS[Math.min(k, DRIFTS.length - 1)];
  var a = AMPS[Math.min(k, AMPS.length - 1)];
  return { drift: d, amp: a, start: ATTEMPT_GAP + k * ATTEMPT_DUR,
           landed: Math.abs(d) <= TOL };
}
/* Cursor fraction along the line at relative time relT. Before the
   first attempt it waits at the left end, descending into place. */
function cursorAt(relT) {
  if (relT < ATTEMPT_GAP) {
    var w = clamp(relT / ATTEMPT_GAP, 0, 1);
    return 0.10 + (target + DRIFTS[0] * 0 - 0.10) * w * w;
  }
  var k = attemptCount(relT);
  var at = attemptOf(k);
  var u = clamp((relT - at.start) / ATTEMPT_DUR, 0, 1);
  var base = target + at.drift * u;
  var wob = at.amp * (1 - u) * Math.sin(TAU * 3 * u + k * 1.7);
  return base + wob;
}
/* Subdivision depth at time t: 12 blocks, then quarters (48), then
   192, then 768 hairlines. The line is a dense shimmer by t = 9. */
function depthAt(t) {
  if (t < 3) return 12;
  if (t < 6) return 48;
  if (t < 9) return 192;
  return 768;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square
   on desktop. The page ground is the piece ground. */
function pieceRect() {
  if (isPhone) return { ox: 0, oy: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { ox: (VW - s) / 2, oy: (VH - s) / 2, s: s, w: s, h: s };
}
function lineGeom(R) {
  var x0 = R.ox + 0.06 * R.w;
  var x1 = R.ox + 0.94 * R.w;
  var y = R.oy + 0.52 * R.h;
  return { x0: x0, x1: x1, y: y, w: x1 - x0 };
}
function drawDivisions(R, L, t) {
  var depth = depthAt(t);
  var i, x, a;
  /* Hairlines first, faintest, with a slow shimmer. No flicker
     faster than about 0.35 Hz by construction. */
  if (depth >= 192) {
    var n = depth;
    for (i = 0; i <= n; i++) {
      x = L.x0 + (i / n) * L.w;
      a = 0.30 + 0.20 * Math.sin(TAU * (i / n * 3 + t * 0.35));
      ctx.fillStyle = rgba(CHALK, a);
      ctx.fillRect(x, L.y - 4, 1, 8);
    }
  }
  /* Quarter divisions, medium ticks. */
  if (depth >= 48) {
    for (i = 0; i <= 48; i++) {
      x = L.x0 + (i / 48) * L.w;
      ctx.fillStyle = rgba(CHALK, 0.45);
      ctx.fillRect(x, L.y - 4.5, 1, 9);
    }
  }
  /* Semitone blocks, the tall chalk divisions. */
  for (i = 0; i <= 12; i++) {
    x = L.x0 + (i / 12) * L.w;
    ctx.fillStyle = rgba(CHALK, 0.92);
    ctx.fillRect(x - 0.5, L.y - 10, 1.5, 20);
  }
  /* The line itself, brightening briefly after each miss as it
     redraws and tries again. */
  var pulse = 0;
  var relT = t - attemptOrigin;
  var k, at;
  for (k = 0; k <= attemptCount(relT); k++) {
    at = attemptOf(k);
    var age = relT - (at.start + ATTEMPT_DUR);
    if (!at.landed && age >= 0 && age < 0.9) pulse += (1 - age / 0.9) * 0.25;
  }
  ctx.fillStyle = rgba(CHALK, 0.85 + Math.min(0.15, pulse));
  ctx.fillRect(L.x0, L.y - 1, L.w, 2);
}
function drawTarget(R, L) {
  var tx = L.x0 + target * L.w;
  ctx.fillStyle = RED;
  ctx.fillRect(tx - 1, L.y - 38, 2, 32);
  ctx.fillRect(tx - 6, L.y - 38, 12, 2);
}
function drawHistory(R, L, t) {
  var relT = t - attemptOrigin;
  var k, at, hx, age, a;
  for (k = 0; k <= attemptCount(relT); k++) {
    at = attemptOf(k);
    var endT = at.start + ATTEMPT_DUR;
    if (relT < endT) continue;
    hx = L.x0 + (target + at.drift) * L.w;
    age = relT - endT;
    a = clamp(1 - age / 14, 0.12, 0.9);
    ctx.fillStyle = at.landed ? rgba(GOLD, a) : rgba(CHALK, a * 0.7);
    if (at.landed) {
      ctx.fillRect(hx - 4, L.y + 12, 8, 8);
    } else {
      ctx.fillRect(hx - 0.5, L.y + 10, 1.5, 16);
    }
  }
}
function drawCursor(R, L, t) {
  var relT = t - attemptOrigin;
  var cx = L.x0 + cursorAt(relT) * L.w;
  var bob = 3 * Math.sin(TAU * 0.4 * t);
  var tipY = L.y - 12 + bob * 0.4;
  var topY = L.y - 44 + bob;
  /* Guide thread from the cursor down to the line. */
  ctx.strokeStyle = rgba(CHALK, 0.55);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, topY + 10);
  ctx.lineTo(cx, L.y - 4);
  ctx.stroke();
  /* The cursor itself: a small chalk triangle pointing down. */
  ctx.fillStyle = CHALK;
  ctx.beginPath();
  ctx.moveTo(cx - 7, topY);
  ctx.lineTo(cx + 7, topY);
  ctx.lineTo(cx, tipY);
  ctx.closePath();
  ctx.fill();
}
function drawDepth(R, L, t) {
  var depth = depthAt(t);
  var label = 'divisions ' + depth;
  ctx.font = '11px monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = rgba(CHALK, 0.55);
  ctx.fillText(label, R.ox + R.w - 14, R.oy + R.h - 14);
}
function drawPlates(R) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Smaller Than a Semitone').width > R.w - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Smaller Than a Semitone').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 23').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = R.ox + 12, plateY = R.oy + 12;
  ctx.fillStyle = GROUND;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(CHALK, 0.45);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = CHALK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Smaller Than a Semitone', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2007 · 03 · 23', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap to propose a target.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = R.ox + 12;
  var hintPlateY = R.oy + R.h - hintPlateH - 12;
  ctx.fillStyle = GROUND;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(CHALK, 0.45);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = CHALK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var R = pieceRect();
  var L = lineGeom(R);
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawDivisions(R, L, t);
  drawTarget(R, L);
  drawHistory(R, L, t);
  drawCursor(R, L, t);
  drawDepth(R, L, t);
  drawPlates(R);
}
/* Lazy audio: a sine attempt tone on tap only, never autoplay. The
   tone sits at a pitch mapped from the target, with a detuned
   second voice on a miss so the beating is audible. Guarded so a
   missing AudioContext is a silent no-op. */
var audioCtx = null;
function playTone(freq, detune) {
  try {
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
    if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var o1 = audioCtx.createOscillator();
    var o2 = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o1.type = 'sine'; o2.type = 'sine';
    o1.frequency.value = freq;
    o2.frequency.value = freq * (1 + detune);
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.4);
    o1.connect(g); o2.connect(g); g.connect(audioCtx.destination);
    o1.start(); o2.start();
    o1.stop(audioCtx.currentTime + 1.5);
    o2.stop(audioCtx.currentTime + 1.5);
  } catch (e) { /* audio is optional */ }
}
/* A tap proposes a new target: snap it to the nearest division at
   the current depth, mark it with a red chalk tick, and restart the
   attempts from the tap, narrowing from a fresh wide wobble. The
   tap never reloads. */
function onTap(ev) {
  var R = pieceRect();
  var L = lineGeom(R);
  var x = 0, y = 0;
  try {
    if (ev && typeof ev.clientX === 'number') { x = ev.clientX; y = ev.clientY; }
    else if (ev && ev.touches && ev.touches[0]) { x = ev.touches[0].clientX; y = ev.touches[0].clientY; }
  } catch (e) { x = L.x0 + target * L.w; }
  var fx = clamp((x - L.x0) / L.w, 0.02, 0.98);
  var depth = depthAt(phaseT);
  var snapped = Math.round(fx * depth) / depth;
  target = clamp(snapped, 0.02, 0.98);
  attemptOrigin = phaseT;
  var freq = 220 * Math.pow(2, target);
  playTone(freq, 0.008);
  draw();
}
try { canvas.addEventListener('pointerdown', onTap); } catch (e) { /* no pointer events */ }
/* ---- frame one: fixed phase t = 10 s, hairline depth, target
   0.618, third attempt mid-wobble, two misses and one landing
   in the history ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
