<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Object Icons</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: four colors, nothing else. Flat fills only, no gradients, no texture.
  var BLUE = '#A8C8CC', TERRA = '#D89A80', INK = '#111111', WHITE = '#FFFFFF';

  var LOOP = 24;        // seconds per seamless loop
  var PHASE0 = 0;       // constant first-frame phase: every bob at neutral, no night swap

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(541065);

  // ---- layout (1080 x 1080 design space) ----
  var BAND_Y = 350, BAND_H = 380;         // band 350..730, centred on the white page
  var PANEL_W = 1080 / 6;                 // 180 per panel, full-bleed
  var ICON_Y = 522;                       // icon centre line
  var POOL_Y = 614;                       // shadow-pool centre line

  // Per-icon bob: integer cycle counts over the 24s loop keep it seamless;
  // seeded staggers pick which multiples each icon rides.
  var BOBS = [];
  for (var i = 0; i < 6; i++) BOBS.push({ k: 1 + Math.floor(rng() * 3), amp: 3.6 + rng() * 1.2 });
  var DICE_TILT = (rng() - 0.5) * 0.2;

  // ---- icons: flat-shape functions, drawn around (0,0) ----
  // c = { ink, paper }: day call passes (INK, WHITE); night swaps them.

  function iconRecord(c) {
    ctx.fillStyle = c.ink;
    ctx.beginPath(); ctx.arc(0, 0, 55, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = c.paper;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 42, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 31, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = c.paper;
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.ink;
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
  }

  function die(cx, cy, rot, pips, c) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.fillStyle = c.paper;
    ctx.strokeStyle = c.ink;
    ctx.lineWidth = 4;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-27, -27, 54, 54, 9); else ctx.rect(-27, -27, 54, 54);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = c.ink;
    var spots = {
      2: [[-13, -13], [13, 13]],
      5: [[-13, -13], [13, -13], [0, 0], [-13, 13], [13, 13]]
    }[pips];
    for (var i = 0; i < spots.length; i++) {
      ctx.beginPath(); ctx.arc(spots[i][0], spots[i][1], 5.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  function iconDice(c) {
    die(-25, 12, -0.16 + DICE_TILT, 5, c);
    die(29, -16, 0.2 + DICE_TILT, 2, c);
  }

  function iconRadio(c) {
    // antenna
    ctx.strokeStyle = c.ink;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-38, -30); ctx.lineTo(-74, -76); ctx.stroke();
    ctx.fillStyle = c.ink;
    ctx.beginPath(); ctx.arc(-74, -76, 6.5, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-60, -34, 120, 72, 10); else ctx.rect(-60, -34, 120, 72);
    ctx.fill();
    // speaker lines
    ctx.strokeStyle = c.paper;
    ctx.lineWidth = 4;
    for (var i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(-46, -14 + i * 14); ctx.lineTo(-14, -14 + i * 14); ctx.stroke();
    }
    // dial
    ctx.fillStyle = c.paper;
    ctx.beginPath(); ctx.arc(33, -4, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.ink;
    ctx.beginPath(); ctx.arc(33, -4, 4.5, 0, Math.PI * 2); ctx.fill();
    // tuning slot
    ctx.fillStyle = c.paper;
    ctx.fillRect(16, 20, 34, 6);
  }

  function iconCup(c) {
    // saucer
    ctx.fillStyle = c.paper;
    ctx.strokeStyle = c.ink;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 42, 57, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // body: trapezoid
    ctx.beginPath();
    ctx.moveTo(-43, -30); ctx.lineTo(43, -30); ctx.lineTo(31, 32); ctx.lineTo(-31, 32);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // coffee surface, inset inside the rim
    ctx.fillStyle = c.ink;
    ctx.beginPath(); ctx.ellipse(0, -30, 35, 7, 0, 0, Math.PI * 2); ctx.fill();
    // handle
    ctx.strokeStyle = c.ink;
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(48, -2, 17, -1.1, 1.1); ctx.stroke();
  }

  function iconKey(c) {
    ctx.strokeStyle = c.ink;
    ctx.lineCap = 'round';
    // bow
    ctx.lineWidth = 11;
    ctx.beginPath(); ctx.arc(-32, -20, 20, 0, Math.PI * 2); ctx.stroke();
    // shaft
    ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(-16, -6); ctx.lineTo(50, 42); ctx.stroke();
    // teeth
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(38, 34); ctx.lineTo(52, 22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(50, 42); ctx.lineTo(66, 32); ctx.stroke();
    // bow glint
    ctx.fillStyle = c.paper;
    ctx.beginPath(); ctx.arc(-38, -26, 4, 0, Math.PI * 2); ctx.fill();
  }

  function leaf(x, y, rot, len, wid, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(len / 2, 0, len / 2, wid / 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function iconPlant(c) {
    // stems and leaves first (behind the pot rim)
    ctx.strokeStyle = c.ink;
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, -34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(-22, -24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(22, -24); ctx.stroke();
    leaf(0, -34, -Math.PI / 2, 34, 15, c.ink);
    leaf(-22, -24, Math.PI * 0.82, 30, 14, c.ink);
    leaf(22, -24, Math.PI * 0.18, 30, 14, c.ink);
    // pot body
    ctx.fillStyle = c.paper;
    ctx.strokeStyle = c.ink;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-33, 8); ctx.lineTo(33, 8); ctx.lineTo(24, 52); ctx.lineTo(-24, 52);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // rim
    ctx.beginPath(); ctx.rect(-38, -4, 76, 13); ctx.fill(); ctx.stroke();
  }

  var ICONS = [iconRecord, iconDice, iconRadio, iconCup, iconKey, iconPlant];

  // ---- scene ----
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = WHITE;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    var cycle = Math.floor(t / LOOP);
    var phase = t - cycle * LOOP;
    var nightIdx = ((cycle % 6) + 6) % 6;            // rotates one panel per loop
    var nightOn = phase >= 9 && phase < 13;          // brief swap, once per loop

    for (var i = 0; i < 6; i++) {
      var px = i * PANEL_W;
      var night = nightOn && i === nightIdx;
      // panel
      ctx.fillStyle = night ? INK : (i % 2 === 0 ? BLUE : TERRA);
      ctx.fillRect(px, BAND_Y, PANEL_W, BAND_H);
      // flat black shadow pool (merges invisibly into the night panel)
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.ellipse(px + PANEL_W / 2, POOL_Y, 58, 13, 0, 0, Math.PI * 2); ctx.fill();
      // icon, bobbing on its staggered integer-ratio sine
      var bob = BOBS[i].amp * Math.sin(2 * Math.PI * BOBS[i].k * t / LOOP);
      ctx.save();
      ctx.translate(px + PANEL_W / 2, ICON_Y + bob);
      ICONS[i](night ? { ink: WHITE, paper: INK } : { ink: INK, paper: WHITE });
      ctx.restore();
    }

    // thin black dividers and band edge
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (i = 1; i < 6; i++) { ctx.moveTo(i * PANEL_W, BAND_Y); ctx.lineTo(i * PANEL_W, BAND_Y + BAND_H); }
    ctx.stroke();
    ctx.strokeRect(0, BAND_Y, 1080, BAND_H);

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground is the white) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      // the band keeps its shape and spans the full phone width
      S = W;
      OX = 0; OY = (H - S) / 2;
    } else {
      S = Math.min(W, H);
      OX = (W - S) / 2; OY = (H - S) / 2;
    }
    draw(simT);
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
