<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six and Sixty-Four</title>
<style>
  html, body { margin: 0; padding: 0; background: #060608; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var VOID = '#060608';
  var SUBJECT = '#FFFFFF';
  var GHOST = '#9FC4E8';
  var HALO = '#DCE8FF';

  var TAU = Math.PI * 2;
  var LOOP = 60;              // seconds; every period below divides it, so the watch core loops seamlessly
  var BASE_GHOSTS = 6;        // the six real cameras
  var MAX_GHOSTS = 70;        // six real + sixty-four reconstructed viewpoints
  var BASE_SEED = 1075;
  var DECAY_TAU = 6.0;        // seconds; added cameras fade back toward six with this time constant
  var FLASH_SECONDS = 3;      // tap holds the full composite this long
  var TAP_WINDOW = 0.36;      // seconds a tap is held so a double tap can pre-empt it

  var W = 720;
  var H = 720;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : ((typeof window !== 'undefined' && window.innerWidth) || 720);
    H = vv ? vv.height : ((typeof window !== 'undefined' && window.innerHeight) || 720);
    canvas.width = W;
    canvas.height = H;
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  resize();

  function isPhone() {
    var smallest = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      smallest = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    return smallest < 700 || H > W * 1.15;
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // Piece clock. The first frame is drawn separately at a fixed phase and
  // does not consult this clock.
  var clockEpochMs = null;
  function nowMs() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  }
  function pieceTime() {
    var ms = nowMs();
    if (clockEpochMs === null) clockEpochMs = ms;
    return Math.max(0, (ms - clockEpochMs) / 1000);
  }
  function pieceTimeFromRaf(ms) {
    if (clockEpochMs === null) clockEpochMs = ms;
    return Math.max(0, (ms - clockEpochMs) / 1000);
  }

  // Deterministic seeded generator; the whole world derives from it.
  function makeRng(seed) {
    var s = (seed >>> 0) || 1;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  // The subject: a small orb-cluster with light-bars, stored once in local
  // units (overall radius about 1). Every viewpoint redraws this same data.
  // The seventy viewpoints are stored too: orbit, jitter, rotation, scale,
  // alpha, and an audio detune each.
  function buildWorld(seed) {
    var rng = makeRng(seed);
    var orbs = [{ x: 0, y: 0, r: 0.30 }];
    var ring = 5;
    var baseA = rng() * TAU;
    var i, a, rad;
    for (i = 0; i < ring; i++) {
      a = baseA + (i / ring) * TAU + (rng() - 0.5) * 0.35;
      rad = 0.60 + rng() * 0.20;
      orbs.push({
        x: Math.cos(a) * rad + (rng() - 0.5) * 0.06,
        y: Math.sin(a) * rad + (rng() - 0.5) * 0.06,
        r: 0.13 + rng() * 0.07
      });
    }
    for (i = 0; i < 2; i++) {
      a = rng() * TAU;
      rad = 0.92 + rng() * 0.10;
      orbs.push({ x: Math.cos(a) * rad, y: Math.sin(a) * rad, r: 0.085 + rng() * 0.02 });
    }
    var bars = [
      { x1: 0, y1: 0, x2: orbs[1].x, y2: orbs[1].y, w: 0.105 },
      { x1: 0, y1: 0, x2: orbs[3].x, y2: orbs[3].y, w: 0.09 },
      { x1: orbs[2].x, y1: orbs[2].y, x2: orbs[4].x, y2: orbs[4].y, w: 0.07 },
      { x1: orbs[5].x, y1: orbs[5].y, x2: orbs[1].x, y2: orbs[1].y, w: 0.055 },
      { x1: -0.95 + rng() * 0.2, y1: 0.55 + rng() * 0.15, x2: -0.35 + rng() * 0.2, y2: 0.85 + rng() * 0.15, w: 0.06 }
    ];
    var views = [];
    for (i = 0; i < MAX_GHOSTS; i++) {
      views.push({
        orbitR: 0.015 + Math.pow(rng(), 1.35) * 0.105,
        phase: rng() * TAU,
        orbitCycles: (1 + Math.floor(rng() * 2)) * (rng() < 0.5 ? 1 : -1),
        jitAmp: 0.0015 + rng() * 0.0035,
        jitCyclesX: 5 + Math.floor(rng() * 9),
        jitCyclesY: 5 + Math.floor(rng() * 9),
        jitPhaseX: rng() * TAU,
        jitPhaseY: rng() * TAU,
        rot: (rng() - 0.5) * 0.14,
        scale: 0.95 + rng() * 0.10,
        alpha: 0.06 + rng() * 0.06,
        detune: (rng() * 16 - 8)
      });
    }
    return { orbs: orbs, bars: bars, views: views };
  }

  var seedCycle = 0;
  var world = buildWorld(BASE_SEED);

  // Recorded interaction state. The visible ghost count is a closed-form
  // function of these records and t; nothing is integrated frame to frame.
  var boost = null;      // { t0, extra } from drag-added cameras, decaying after t0
  var flash = null;      // { t0 } tap flash: full composite for FLASH_SECONDS, then decays from 64
  var pendingTap = null; // { t, deadline }
  var drag = null;       // active pointer stroke

  function extraAt(t) {
    var best = 0;
    if (boost && t >= boost.t0) {
      best = Math.max(best, boost.extra * Math.exp(-(t - boost.t0) / DECAY_TAU));
    }
    if (flash) {
      var end = flash.t0 + FLASH_SECONDS;
      if (t >= end) {
        best = Math.max(best, (MAX_GHOSTS - BASE_GHOSTS) * Math.exp(-(t - end) / DECAY_TAU));
      }
    }
    return best;
  }

  function ghostCountAt(t) {
    if (flash && t >= flash.t0 && t < flash.t0 + FLASH_SECONDS) return MAX_GHOSTS;
    return clamp(BASE_GHOSTS + Math.round(extraAt(t)), BASE_GHOSTS, MAX_GHOSTS);
  }

  function subjectCenterAt(t) {
    var m = Math.min(W, H);
    return {
      x: W / 2 + m * 0.030 * Math.sin(TAU * t / LOOP),
      y: H / 2 + m * 0.024 * Math.sin(TAU * t / (LOOP / 2) + 1.3)
    };
  }

  function viewOffsetAt(v, t, m) {
    var ang = v.phase + TAU * v.orbitCycles * (t / LOOP);
    return {
      x: Math.cos(ang) * v.orbitR * m + Math.sin(TAU * v.jitCyclesX * (t / LOOP) + v.jitPhaseX) * v.jitAmp * m,
      y: Math.sin(ang) * v.orbitR * m + Math.cos(TAU * v.jitCyclesY * (t / LOOP) + v.jitPhaseY) * v.jitAmp * m
    };
  }

  function drawStructure(cx, cy, scale, rot, color, alpha) {
    var i, o, b;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    for (i = 0; i < world.bars.length; i++) {
      b = world.bars[i];
      ctx.lineWidth = b.w;
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      ctx.lineTo(b.x2, b.y2);
      ctx.stroke();
    }
    ctx.fillStyle = color;
    for (i = 0; i < world.orbs.length; i++) {
      o = world.orbs[i];
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // Audio: a cluster of detuned sines, one voice per ten ghosts. Created
  // lazily inside the first visitor gesture only; silent before that.
  var audio = null;
  var lastAudioCount = -1;
  var VOICE_FREQS = [174.61, 220.00, 261.63, 311.13, 369.99, 440.00, 523.25];

  function ensureAudio() {
    if (audio) {
      if (audio.ctx.state === 'suspended' && audio.ctx.resume) audio.ctx.resume();
      return;
    }
    var AC = null;
    if (typeof AudioContext !== 'undefined') AC = AudioContext;
    else if (typeof webkitAudioContext !== 'undefined') AC = webkitAudioContext;
    if (!AC) return;
    try {
      var ac = new AC();
      var master = ac.createGain();
      master.gain.value = 0.055;
      master.connect(ac.destination);
      var gains = [];
      for (var i = 0; i < VOICE_FREQS.length; i++) {
        var osc = ac.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = VOICE_FREQS[i];
        osc.detune.value = world.views[i * 10].detune;
        var g = ac.createGain();
        g.gain.value = 0;
        osc.connect(g);
        g.connect(master);
        osc.start();
        gains.push(g);
      }
      audio = { ctx: ac, gains: gains };
      lastAudioCount = -1;
    } catch (e) {
      audio = null;
    }
  }

  function updateAudio(count) {
    if (!audio || count === lastAudioCount) return;
    lastAudioCount = count;
    var voices = Math.ceil(count / 10);
    var t = audio.ctx.currentTime;
    for (var i = 0; i < audio.gains.length; i++) {
      var target = i < voices ? 0.30 / voices : 0;
      audio.gains[i].gain.setTargetAtTime(target, t, 0.45);
    }
  }

  var HALO_R = [2.30, 1.85, 1.45, 1.15];
  var HALO_A = [0.05, 0.07, 0.09, 0.09]; // layered flat alpha; composites to about 0.27 near the core

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = VOID;
    ctx.fillRect(0, 0, W, H);

    var m = Math.min(W, H);
    var c = subjectCenterAt(t);
    var count = ghostCountAt(t);
    var scale = m * (isPhone() ? 0.098 : 0.085);
    var i, v, o;

    // The composite halo, tight around the true subject. Drawn under the
    // witnesses so their edges stay sharp against it.
    ctx.fillStyle = HALO;
    for (i = 0; i < HALO_R.length; i++) {
      ctx.globalAlpha = HALO_A[i];
      ctx.beginPath();
      ctx.arc(c.x, c.y, scale * HALO_R[i], 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // The witnesses: sharp, distinct, faint copies. Each is the same stored
    // subject redrawn from its own jittered viewpoint, never a smear.
    for (i = 0; i < count; i++) {
      v = world.views[i];
      o = viewOffsetAt(v, t, m);
      ctx.globalAlpha = v.alpha * 0.30;
      ctx.fillStyle = HALO;
      ctx.beginPath();
      ctx.arc(c.x + o.x, c.y + o.y, scale * 1.5, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
      drawStructure(c.x + o.x, c.y + o.y, scale * v.scale, v.rot, GHOST, v.alpha);
    }

    // The one true subject.
    drawStructure(c.x, c.y, scale, 0, SUBJECT, 1);

    // The reconstruction, counted. Prompt-specced type; the only visible text.
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = GHOST;
    ctx.font = Math.max(10, Math.round(m * 0.017)) + 'px monospace';
    ctx.fillText('CAM ' + count + '/' + MAX_GHOSTS, Math.round(m * 0.03), H - Math.round(m * 0.03));
    ctx.globalAlpha = 1;

    updateAudio(count);
  }

  function addCamera(t) {
    if (flash && t >= flash.t0 && t < flash.t0 + FLASH_SECONDS) return; // already at seventy
    var extra = Math.min(MAX_GHOSTS - BASE_GHOSTS, extraAt(t) + 1);
    boost = { t0: t, extra: extra };
  }

  function reseed() {
    seedCycle += 1;
    world = buildWorld(BASE_SEED + seedCycle * 7919);
    boost = null;
    flash = null;
    pendingTap = null;
    lastAudioCount = -1;
  }

  function pointerPosition(e) {
    return { x: e.clientX || 0, y: e.clientY || 0 };
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      ensureAudio();
      var t = pieceTime();
      var p = pointerPosition(e);
      drag = { x: p.x, y: p.y, lastX: p.x, lastY: p.y, downT: t, moved: false, travel: 0 };
    });

    canvas.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var t = pieceTime();
      var p = pointerPosition(e);
      var dx = p.x - drag.lastX;
      var dy = p.y - drag.lastY;
      drag.lastX = p.x;
      drag.lastY = p.y;
      var step = Math.max(18, Math.min(W, H) * 0.05);
      drag.travel += Math.sqrt(dx * dx + dy * dy);
      if (Math.abs(p.x - drag.x) + Math.abs(p.y - drag.y) > 6) drag.moved = true;
      while (drag.travel >= step) {
        drag.travel -= step;
        if (drag.moved) addCamera(t);
      }
    });

    function endPointer(e) {
      if (!drag) return;
      var t = pieceTime();
      var wasTap = !drag.moved && t - drag.downT < 0.40;
      drag = null;
      if (!wasTap) return;
      if (pendingTap) {
        // Second tap inside the window: a double tap. New subject.
        reseed();
        return;
      }
      pendingTap = { t: t, deadline: t + TAP_WINDOW };
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
  }

  function maintain(t) {
    if (pendingTap && t >= pendingTap.deadline) {
      pendingTap = null;
      flash = { t0: t };
      lastAudioCount = -1;
    }
  }

  // Fixed synchronous first frame: the six real cameras and their subject,
  // before any visitor has added a viewpoint.
  draw(0);

  if (typeof requestAnimationFrame === 'function') {
    var rafLoop = function (now) {
      var t = pieceTimeFromRaf(now);
      maintain(t);
      draw(t);
      requestAnimationFrame(rafLoop);
    };
    requestAnimationFrame(rafLoop);
  }
})();
</script>
</body>
</html>
