<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.252 Day Five</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1E6B6B; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.252 Day Five (tanzinchospel.art). After his Day 5
// (Nov 2020), the first entry of his public learning diary:
// a lone figure on a rocky ridge, a huge dome looming
// behind, teal water glow everywhere, a hard red light
// raking the rocks from the left. Presented as he presents
// it, captioned like his own log: "Day 5". The atmosphere
// breathes on a twenty second loop, light shafts drifting,
// the glow pulsing. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var TEAL = '#1E6B6B', RED = '#E63946', ROCK = '#3A3A38', DOME = '#5A7A8C', INK = '#0A0A0A';
var DW = 1280, DH = 800;
var W = 0, H = 0, phone = false;
var visX0 = 0; // left edge of the visible design slice under cover-fit
var T = 6.0, lastNow = -1; // frame one: mid breath, shafts placed, red rake lit

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- ridge line: seeded crags, the left third rearing up --------------------
var ridgePts = [];
(function () {
  var r = rng(25211);
  var n = 17;
  for (var i = 0; i <= n; i++) {
    var x = (i / n) * DW;
    var leftness = Math.max(0, 1 - (i / n) * 2.6); // 1 at far left, 0 past the middle
    var base = 648 - leftness * 118;               // left mass rides higher
    var jag = (r() - 0.5) * 56 + (r() < 0.3 ? -34 * r() : 0);
    ridgePts.push({ x: x, y: base + jag });
  }
})();
function ridgeY(x) {
  for (var i = 0; i < ridgePts.length - 1; i++) {
    var a = ridgePts[i], b = ridgePts[i + 1];
    if (x >= a.x && x <= b.x) {
      var f = (x - a.x) / (b.x - a.x);
      return a.y + (b.y - a.y) * f;
    }
  }
  return ridgePts[ridgePts.length - 1].y;
}
function ridgePath(base) {
  ctx.beginPath();
  ctx.moveTo(-40, base);
  for (var i = 0; i < ridgePts.length; i++) ctx.lineTo(ridgePts[i].x, ridgePts[i].y);
  ctx.lineTo(DW + 40, base);
  ctx.closePath();
}

function drawFigure(x, y) {
  // a small near-black silhouette standing on the ridge
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(x, y - 46, 7.5, 0, Math.PI * 2); ctx.fill();      // head
  ctx.fillRect(x - 4.5, y - 40, 9, 24);                                        // torso
  ctx.fillRect(x - 4.5, y - 17, 3.6, 17);                                      // near leg
  ctx.fillRect(x + 1.2, y - 17, 3.6, 17);                                      // far leg
  ctx.fillRect(x + 3.5, y - 38, 3.2, 19);                                      // arm, hanging
}

function draw() {
  // water: the teal itself, deepened low with layered rock tone
  ctx.fillStyle = TEAL;
  ctx.fillRect(0, 0, DW, DH);
  ctx.fillStyle = rgba(ROCK, 0.20);
  ctx.fillRect(0, DH * 0.78, DW, DH * 0.22);
  ctx.fillStyle = rgba(DOME, 0.10);
  ctx.beginPath(); ctx.ellipse(DW * 0.30, DH * 0.16, DW * 0.42, DH * 0.20, 0, 0, Math.PI * 2); ctx.fill();

  var breath = 0.5 + 0.5 * Math.sin(T * Math.PI * 2 / 20); // the 20s breath

  // the dome: a huge grey-blue sphere looming upper right,
  // drifting a breath sideways against the nearer layers
  var domeX = 952 + Math.sin(T * 0.045) * 7, domeY = 268, domeR = 318;
  ctx.save();
  ctx.beginPath(); ctx.arc(domeX, domeY, domeR, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = DOME;
  ctx.fillRect(domeX - domeR, domeY - domeR, domeR * 2, domeR * 2);
  // flat facet bands across the sphere, no shading gradient
  ctx.fillStyle = rgba(TEAL, 0.16); ctx.fillRect(domeX - domeR, domeY - domeR * 0.42, domeR * 2, domeR * 0.30);
  ctx.fillStyle = rgba(ROCK, 0.20); ctx.fillRect(domeX - domeR, domeY + domeR * 0.28, domeR * 2, domeR * 0.36);
  ctx.fillStyle = rgba(TEAL, 0.22); ctx.fillRect(domeX - domeR, domeY + domeR * 0.60, domeR * 2, domeR * 0.40);
  ctx.fillStyle = rgba(INK, 0.10);  ctx.fillRect(domeX + domeR * 0.38, domeY - domeR, domeR * 0.62, domeR * 2);
  ctx.restore();
  ctx.strokeStyle = rgba(DOME, 0.9);
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(domeX, domeY, domeR - 2, Math.PI * 0.92, Math.PI * 1.38); ctx.stroke(); // lit limb

  // light shafts slanting down through the water, drifting
  for (var i = 0; i < 3; i++) {
    var sx = 210 + i * 215 + Math.sin(T * 0.10 + i * 1.7) * 34;
    ctx.fillStyle = rgba(DOME, 0.055 + 0.03 * breath);
    ctx.beginPath();
    ctx.moveTo(sx, -20);
    ctx.lineTo(sx + 88, -20);
    ctx.lineTo(sx - 60, DH * 0.86);
    ctx.lineTo(sx - 168, DH * 0.86);
    ctx.closePath(); ctx.fill();
  }

  // the water glow, pulsing low in the frame
  ctx.fillStyle = rgba(DOME, 0.05 + 0.045 * breath);
  ctx.beginPath(); ctx.ellipse(DW * 0.46, DH * 0.80, DW * 0.40, DH * 0.13, 0, 0, Math.PI * 2); ctx.fill();

  // far ridge, paler and slower (parallax against the main ridge)
  ctx.save();
  ctx.translate(Math.sin(T * 0.06) * 9, 26);
  ctx.fillStyle = rgba(ROCK, 0.5);
  ridgePath(DH + 60);
  ctx.fill();
  ctx.restore();

  // main ridge
  ctx.fillStyle = ROCK;
  ridgePath(DH + 40);
  ctx.fill();

  // the hard red rake from the left: every facet of the left
  // third catches it, up-slopes brightest, over a low red wash
  // on the left rock mass, breathing with the scene
  ctx.lineCap = 'round';
  for (var j = 0; j < ridgePts.length - 1; j++) {
    var a = ridgePts[j], b = ridgePts[j + 1];
    if (a.x > DW * 0.36) break;
    var up = b.y < a.y; // an up-slope facing the left light
    ctx.strokeStyle = rgba(RED, (up ? 0.62 : 0.30) + 0.18 * breath);
    ctx.lineWidth = up ? 4.5 : 3;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - 2); ctx.lineTo(b.x, b.y - 2);
    ctx.stroke();
    // short facet edges dropping from the crest vertices
    ctx.strokeStyle = rgba(RED, 0.28 + 0.12 * breath);
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + 2); ctx.lineTo(b.x - 10, b.y + 44);
    ctx.stroke();
  }
  ctx.fillStyle = rgba(RED, 0.16 + 0.06 * breath);
  ctx.beginPath();
  ctx.moveTo(0, ridgeY(0) - 6);
  for (var k = 0; k <= 6; k++) ctx.lineTo(k * 62, ridgeY(k * 62) - 6);
  ctx.lineTo(372, DH + 40); ctx.lineTo(0, DH + 40);
  ctx.closePath(); ctx.fill();

  // the figure, small at the lower third on the ridge
  drawFigure(806, ridgeY(806) + 2);

  // his caption, as his log presents the study, set inside
  // the visible slice so cover-fit cropping never eats it
  ctx.fillStyle = rgba(DOME, 0.88);
  ctx.font = '28px "Liberation Sans", "DejaVu Sans", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('Day 5', visX0 + 36, DH - 30);
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // cover-fit the design scene so the composition holds its
  // shape on any screen, the teal ground filling the rest
  ctx.fillStyle = TEAL;
  ctx.fillRect(0, 0, W, H);
  var S = Math.max(W / DW, H / DH);
  visX0 = (DW - W / S) / 2;
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
