<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosin Craft</title>
<style>
html, body { margin: 0; padding: 0; background: #2A1A0C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#2A1A0C';
var WOOD = '#5C3A1E';
var WOOD_LIGHT = '#7A5230';
var WOOD_DARK = '#3A2412';
var PLANK_LINE = 'rgba(26,14,5,0.55)';
var LAMP = '#FFC76A';
var LAMP_CORE = '#FFE3A1';
var ROSIN = '#D98E2B';
var ROSIN_DEEP = '#A86414';
var LIQUID = '#E8A83C';
var LIQUID_DEEP = '#C97A1A';
var POWDER = '#E8B95C';
var PALE_WOOD = '#E8D3A8';
var PALE_WOOD_DARK = '#C9A96E';
var BRIDGE = '#7A4A22';
var CLAMP_WOOD = '#4A2E16';
var GOBAR = '#6B4423';
var SKIN = '#C08A5E';
var SKIN_DARK = '#96683F';
var SKIN_LINE = '#6B4423';
var GLASS = 'rgba(240,222,190,0.30)';
var GLASS_EDGE = 'rgba(240,222,190,0.55)';
var PLATE = '#1A0F06';
var PLATE_LINE = 'rgba(232,211,168,0.45)';
var TITLE_INK = '#F2E3C2';
var HINT_INK = '#D9C49A';
/* ---- process cycle: one slow real-time pass over the bench, 300 s ----
   CRUSH 0-40, POUR 40-70, STIR 70-130, CLAMP 130-220, WAIT 220-300.
   Frame one is t = 100 s: mid-stir, the jar swirling, the hand on the
   stick, the bridge already under its go-bars. Nothing is timed by a
   wall clock; every motion is a closed-form function of phaseT. ---- */
var FRAME_T = 100;
var CYCLE = 300;
var PH_CRUSH_END = 40;
var PH_POUR_END = 70;
var PH_STIR_END = 130;
var PH_CLAMP_END = 220;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1830);
var phaseT = FRAME_T;
/* seeded scatter: rosin crumbs, wood grain flecks, bench dust */
var CRUMBS = [];
(function () {
  var i;
  for (i = 0; i < 46; i++) {
    CRUMBS.push({ x: rng(), y: rng(), r: 0.0015 + rng() * 0.0035, tone: rng() });
  }
})();
var GRAIN = [];
(function () {
  var i;
  for (i = 0; i < 26; i++) {
    GRAIN.push({ y: rng(), amp: 0.004 + rng() * 0.010, ph: rng() * TAU, len: 0.25 + rng() * 0.55, x0: rng() * 0.6 });
  }
})();
var POUR_DROPS = [];
(function () {
  var i;
  for (i = 0; i < 26; i++) {
    POUR_DROPS.push({ u: rng(), wob: (rng() - 0.5) * 0.02, r: 0.002 + rng() * 0.003 });
  }
})();
function phaseOf(t) {
  var tc = ((t % CYCLE) + CYCLE) % CYCLE;
  if (tc < PH_CRUSH_END) return { name: 'crush', u: tc / PH_CRUSH_END };
  if (tc < PH_POUR_END) return { name: 'pour', u: (tc - PH_CRUSH_END) / (PH_POUR_END - PH_CRUSH_END) };
  if (tc < PH_STIR_END) return { name: 'stir', u: (tc - PH_POUR_END) / (PH_STIR_END - PH_POUR_END) };
  if (tc < PH_CLAMP_END) return { name: 'clamp', u: (tc - PH_STIR_END) / (PH_CLAMP_END - PH_STIR_END) };
  return { name: 'wait', u: (tc - PH_CLAMP_END) / (CYCLE - PH_CLAMP_END) };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function S() { return Math.min(VW, VH); }
function ell(x, y, rx, ry, rot) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
  ctx.fill();
}
function ellStroke(x, y, rx, ry, rot) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
  ctx.stroke();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
/* ---- a workmanlike hand: forearm, palm, four curled fingers, thumb.
   grip: 0 open resting, 1 curled around a handle. ---- */
function drawHand(x, y, ang, sc, grip) {
  var s = S();
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(sc, sc);
  /* forearm coming in from below */
  ctx.fillStyle = SKIN_DARK;
  ctx.fillRect(-0.045 * s, 0.02 * s, 0.09 * s, 0.16 * s);
  ctx.fillStyle = SKIN;
  ctx.fillRect(-0.041 * s, 0.02 * s, 0.082 * s, 0.155 * s);
  /* shirt cuff at the wrist end, so the arm reads as an arm */
  ctx.fillStyle = '#3E2A18';
  ctx.fillRect(-0.048 * s, 0.115 * s, 0.096 * s, 0.045 * s);
  ctx.fillStyle = rgba(LAMP_CORE, 0.25);
  ctx.fillRect(-0.048 * s, 0.115 * s, 0.096 * s, 0.006 * s);
  /* palm */
  ctx.fillStyle = SKIN;
  ell(0, -0.01 * s, 0.052 * s, 0.062 * s, 0);
  /* four fingers, curled more as grip rises */
  var i, fx, flen, curl;
  for (i = 0; i < 4; i++) {
    fx = (-0.036 + i * 0.024) * s;
    flen = (0.055 - Math.abs(i - 1.5) * 0.007) * s;
    curl = 0.15 + grip * 0.55;
    ctx.save();
    ctx.translate(fx, -0.062 * s);
    ctx.rotate((i - 1.5) * 0.10);
    ctx.fillStyle = SKIN;
    ell(0, -flen / 2, 0.0115 * s, flen / 2 + 0.004 * s, curl * (i % 2 ? 1 : -1) * 0.12);
    ctx.fillStyle = rgba(SKIN_DARK, 0.55);
    ell(0, -flen + 0.006 * s, 0.005 * s, 0.004 * s, 0);
    ctx.restore();
  }
  /* thumb across the palm */
  ctx.save();
  ctx.translate(-0.045 * s, 0.005 * s);
  ctx.rotate(0.7 + grip * 0.35);
  ctx.fillStyle = SKIN;
  ell(0, -0.032 * s, 0.0125 * s, 0.040 * s, 0);
  ctx.restore();
  /* knuckle shading */
  ctx.fillStyle = rgba(SKIN_DARK, 0.35);
  ell(0, -0.045 * s, 0.042 * s, 0.008 * s, 0);
  ctx.restore();
}
function drawBench(t) {
  var s = S();
  var g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, WOOD_LIGHT);
  g.addColorStop(0.55, WOOD);
  g.addColorStop(1, WOOD_DARK);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
  /* plank seams */
  var i, y;
  ctx.strokeStyle = PLANK_LINE;
  ctx.lineWidth = Math.max(s * 0.002, 1);
  for (i = 1; i < 5; i++) {
    y = VH * i / 5;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(VW, y);
    ctx.stroke();
  }
  /* wood grain, seeded and still */
  var gi;
  ctx.strokeStyle = rgba(WOOD_DARK, 0.35);
  ctx.lineWidth = Math.max(s * 0.0012, 0.75);
  for (gi = 0; gi < GRAIN.length; gi++) {
    var gr = GRAIN[gi];
    var gy = gr.y * VH;
    ctx.beginPath();
    ctx.moveTo(gr.x0 * VW, gy);
    ctx.bezierCurveTo((gr.x0 + gr.len * 0.3) * VW, gy - gr.amp * s,
      (gr.x0 + gr.len * 0.7) * VW, gy + gr.amp * s,
      (gr.x0 + gr.len) * VW, gy + Math.sin(gr.ph) * gr.amp * s * 0.4);
    ctx.stroke();
  }
  /* scattered rosin crumbs and dust */
  var ci;
  for (ci = 0; ci < CRUMBS.length; ci++) {
    var cr = CRUMBS[ci];
    ctx.fillStyle = cr.tone > 0.5 ? rgba(POWDER, 0.7) : rgba(WOOD_DARK, 0.5);
    ell(cr.x * VW, cr.y * VH, cr.r * s, cr.r * s * 0.8, 0);
  }
  /* warm bench-lamp pool, top left, breathing very slowly */
  var breathe = 0.92 + 0.08 * Math.sin(t * 0.11);
  var lamp = ctx.createRadialGradient(VW * 0.16, VH * 0.10, 0, VW * 0.16, VH * 0.10, Math.max(VW, VH) * 0.55);
  lamp.addColorStop(0, rgba(LAMP, 0.34 * breathe));
  lamp.addColorStop(0.5, rgba(LAMP, 0.12 * breathe));
  lamp.addColorStop(1, rgba(LAMP, 0));
  ctx.fillStyle = lamp;
  ctx.fillRect(0, 0, VW, VH);
  /* lamp shade rim, top left corner */
  ctx.fillStyle = '#241608';
  ctx.beginPath();
  ctx.moveTo(VW * 0.06, 0);
  ctx.lineTo(VW * 0.26, 0);
  ctx.lineTo(VW * 0.22, VH * 0.045);
  ctx.lineTo(VW * 0.10, VH * 0.045);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = LAMP_CORE;
  ell(VW * 0.16, VH * 0.048, 0.04 * s, 0.011 * s, 0);
}
function drawMortar(t, ph) {
  var s = S();
  var mx = VW * 0.20, my = VH * 0.66;
  var mw = 0.115 * s, mh = 0.055 * s;
  /* shadow */
  ctx.fillStyle = rgba(WOOD_DARK, 0.5);
  ell(mx, my + mh * 0.75, mw * 0.95, mh * 0.28, 0);
  /* bowl */
  ctx.fillStyle = '#8A6A45';
  ell(mx, my, mw, mh, 0);
  ctx.fillStyle = '#6B4E30';
  ell(mx, my - mh * 0.12, mw * 0.86, mh * 0.78, 0);
  /* crushed rosin powder inside */
  ctx.fillStyle = POWDER;
  ell(mx, my - mh * 0.16, mw * 0.62, mh * 0.42, 0);
  ctx.fillStyle = ROSIN;
  ell(mx - mw * 0.2, my - mh * 0.22, mw * 0.18, mh * 0.14, 0);
  ell(mx + mw * 0.25, my - mh * 0.20, mw * 0.14, mh * 0.11, 0);
  /* pestle: bobs while crushing, rests across the bowl otherwise */
  var bob = 0;
  var pang = -0.5;
  if (ph.name === 'crush') {
    bob = Math.sin(ph.u * TAU * 4) * 0.012 * s;
    pang = -0.5 + Math.sin(ph.u * TAU * 4) * 0.10;
  } else if (ph.name === 'pour' || ph.name === 'stir') {
    pang = -0.15;
    bob = 0.004 * s;
  }
  ctx.save();
  ctx.translate(mx + mw * 0.42, my - mh * 0.35 + bob);
  ctx.rotate(pang);
  ctx.fillStyle = '#7A5A38';
  rrect(-0.008 * s, -0.075 * s, 0.016 * s, 0.15 * s, 0.008 * s);
  ctx.fill();
  ctx.fillStyle = '#8A6A45';
  ell(0, -0.075 * s, 0.011 * s, 0.011 * s, 0);
  ctx.restore();
  /* a few powder puffs kicked up while crushing */
  if (ph.name === 'crush') {
    var i, pu = Math.sin(ph.u * TAU * 4);
    for (i = 0; i < 5; i++) {
      var px = mx + (i - 2) * 0.012 * s;
      var py = my - mh * 0.5 - Math.abs(pu) * 0.02 * s - i * 0.002 * s;
      ctx.fillStyle = rgba(POWDER, 0.55 - i * 0.08);
      ell(px, py, 0.004 * s, 0.003 * s, 0);
    }
  }
}
function drawBottle(t, ph) {
  var s = S();
  var bx = VW * 0.84, by = VH * 0.30;
  var bw = 0.045 * s, bh = 0.115 * s;
  ctx.fillStyle = rgba(WOOD_DARK, 0.45);
  ell(bx, by + bh * 0.62, bw * 1.1, bh * 0.12, 0);
  ctx.save();
  ctx.translate(bx, by);
  /* tilts toward the jar while pouring */
  var tilt = 0;
  if (ph.name === 'pour') tilt = -0.55 * Math.sin(ph.u * Math.PI);
  ctx.rotate(tilt);
  /* bottle body, pale glass with clear liquid */
  ctx.fillStyle = 'rgba(226,204,160,0.85)';
  rrect(-bw / 2, -bh / 2, bw, bh, bw * 0.28);
  ctx.fill();
  ctx.fillStyle = 'rgba(240,230,200,0.9)';
  rrect(-bw * 0.34, -bh * 0.72, bw * 0.68, bh * 0.24, bw * 0.2);
  ctx.fill();
  /* liquid level inside */
  ctx.fillStyle = 'rgba(214,178,110,0.75)';
  ctx.fillRect(-bw * 0.42, -bh * 0.10, bw * 0.84, bh * 0.52);
  /* label */
  ctx.fillStyle = '#EFE6CC';
  ctx.fillRect(-bw * 0.40, -bh * 0.02, bw * 0.80, bh * 0.30);
  ctx.fillStyle = '#5A3A1E';
  ctx.font = Math.max(s * 0.011, 8) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('ISO', 0, bh * 0.10);
  ctx.restore();
}
function drawPourStream(t, ph) {
  if (ph.name !== 'pour') return;
  var s = S();
  var jx = VW * 0.52, jy = VH * 0.58;
  var bx = VW * 0.84 - 0.05 * s, by = VH * 0.30 - 0.06 * s;
  var i, d;
  for (i = 0; i < POUR_DROPS.length; i++) {
    d = POUR_DROPS[i];
    /* each drop travels mouth to jar, looping on the pour beat */
    var u = (d.u + ph.u * 2.2) % 1;
    var x = bx + (jx - bx) * u + d.wob * s * Math.sin(u * Math.PI * 2);
    var y = by + (jy - 0.10 * s - by) * u + u * u * 0.03 * s;
    ctx.fillStyle = rgba(LIQUID, 0.55 + 0.4 * (1 - u));
    ell(x, y, d.r * s, d.r * s * 1.6, 0);
  }
  /* thin stream line */
  ctx.strokeStyle = rgba(LIQUID, 0.7);
  ctx.lineWidth = Math.max(s * 0.002, 1);
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.quadraticCurveTo((bx + jx) / 2, (by + jy) / 2 - 0.02 * s, jx, jy - 0.10 * s);
  ctx.stroke();
}
function drawSoundboard(t, ph) {
  var s = S();
  var bx = VW * 0.76, by = VH * 0.80;
  var bw = 0.30 * s, bh = 0.115 * s;
  /* shadow */
  ctx.fillStyle = rgba(WOOD_DARK, 0.5);
  ell(bx, by + bh * 0.6, bw * 0.62, bh * 0.22, 0);
  /* pale soundboard */
  ctx.fillStyle = PALE_WOOD;
  rrect(bx - bw / 2, by - bh / 2, bw, bh, 0.008 * s);
  ctx.fill();
  /* grain lines on the board */
  var i;
  ctx.strokeStyle = rgba(PALE_WOOD_DARK, 0.5);
  ctx.lineWidth = Math.max(s * 0.001, 0.75);
  for (i = 0; i < 5; i++) {
    var gy = by - bh / 2 + bh * (0.15 + i * 0.17);
    ctx.beginPath();
    ctx.moveTo(bx - bw / 2 + 0.01 * s, gy);
    ctx.lineTo(bx + bw / 2 - 0.01 * s, gy + Math.sin(i * 2.1) * 0.002 * s);
    ctx.stroke();
  }
  /* the bridge, centered on the board */
  ctx.fillStyle = BRIDGE;
  rrect(bx - 0.045 * s, by - 0.022 * s, 0.09 * s, 0.044 * s, 0.006 * s);
  ctx.fill();
  ctx.fillStyle = rgba(WOOD_DARK, 0.6);
  ctx.fillRect(bx - 0.045 * s, by + 0.008 * s, 0.09 * s, 0.006 * s);
  /* glue bead glistening along the bridge foot */
  var glisten = 0.35 + 0.3 * Math.sin(t * 0.4);
  ctx.fillStyle = rgba(LIQUID, ph.name === 'clamp' ? glisten : 0.25);
  ctx.fillRect(bx - 0.042 * s, by + 0.022 * s, 0.084 * s, 0.0035 * s);
  /* three go-bars: bent wood rods pressing the bridge down */
  for (i = 0; i < 3; i++) {
    var gx = bx + (i - 1) * 0.055 * s;
    var flex = 0;
    if (ph.name === 'clamp') flex = Math.sin(t * 0.5 + i * 1.4) * 0.006 * s;
    var topY = by - bh / 2 - 0.105 * s;
    ctx.strokeStyle = GOBAR;
    ctx.lineWidth = Math.max(s * 0.008, 3);
    ctx.beginPath();
    ctx.moveTo(gx - 0.012 * s, topY);
    ctx.quadraticCurveTo(gx + flex, by - bh * 0.5 - 0.03 * s, gx, by - 0.022 * s);
    ctx.stroke();
    /* clamp foot pad */
    ctx.fillStyle = CLAMP_WOOD;
    ell(gx, by - 0.022 * s, 0.010 * s, 0.006 * s, 0);
    /* top bar the go-bars brace against */
    ctx.fillStyle = CLAMP_WOOD;
    ctx.fillRect(gx - 0.016 * s, topY - 0.004 * s, 0.032 * s, 0.008 * s);
  }
  /* brace bar spanning the three go-bars, held by two side posts */
  ctx.fillStyle = CLAMP_WOOD;
  ctx.fillRect(bx - 0.095 * s, by - bh / 2 - 0.113 * s, 0.19 * s, 0.010 * s);
  ctx.fillStyle = CLAMP_WOOD;
  ctx.fillRect(bx - 0.098 * s, by - bh / 2 - 0.108 * s, 0.008 * s, 0.108 * s + bh / 2);
  ctx.fillRect(bx + 0.090 * s, by - bh / 2 - 0.108 * s, 0.008 * s, 0.108 * s + bh / 2);
}
function drawJar(t, ph) {
  var s = S();
  var jx = VW * 0.52, jy = VH * 0.58;
  var jr = 0.135 * s;
  /* shadow */
  ctx.fillStyle = rgba(WOOD_DARK, 0.5);
  ell(jx, jy + jr * 0.85, jr * 1.05, jr * 0.22, 0);
  /* liquid level: rises through the pour, full while stirring */
  var level = 0.62;
  if (ph.name === 'crush') level = 0.45;
  if (ph.name === 'pour') level = 0.45 + ph.u * 0.17;
  if (ph.name === 'stir' || ph.name === 'clamp' || ph.name === 'wait') level = 0.62;
  var ly = jy + jr - level * jr * 2;
  /* glass body */
  ctx.fillStyle = GLASS;
  ell(jx, jy, jr, jr * 0.92, 0);
  /* liquid */
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(jx, jy, jr * 0.94, jr * 0.86, 0, 0, TAU);
  ctx.clip();
  var lg = ctx.createLinearGradient(jx, ly, jx, jy + jr);
  lg.addColorStop(0, LIQUID);
  lg.addColorStop(1, LIQUID_DEEP);
  ctx.fillStyle = lg;
  ctx.fillRect(jx - jr, ly, jr * 2, jr * 2);
  /* stirring swirls: concentric arcs turning with phase */
  if (ph.name === 'stir') {
    var k, sw = ph.u * TAU * 1.5;
    for (k = 0; k < 3; k++) {
      ctx.strokeStyle = rgba(ROSIN_DEEP, 0.55 - k * 0.12);
      ctx.lineWidth = Math.max(s * 0.003, 1.2);
      ctx.beginPath();
      ctx.arc(jx, jy + jr * 0.1, jr * (0.30 + k * 0.22), sw + k * 0.9, sw + k * 0.9 + Math.PI * 1.25);
      ctx.stroke();
    }
    /* ripple on the surface */
    ctx.strokeStyle = rgba(LAMP_CORE, 0.5);
    ctx.lineWidth = Math.max(s * 0.0015, 0.75);
    ctx.beginPath();
    ctx.ellipse(jx, ly + 0.004 * s, jr * 0.55, jr * 0.10, 0, sw * 0.5, sw * 0.5 + Math.PI);
    ctx.stroke();
  } else {
    /* settled liquid: one faint ring */
    ctx.strokeStyle = rgba(ROSIN_DEEP, 0.3);
    ctx.lineWidth = Math.max(s * 0.002, 1);
    ctx.beginPath();
    ctx.ellipse(jx, ly + 0.004 * s, jr * 0.55, jr * 0.10, 0, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
  /* glass rim and highlight */
  ctx.strokeStyle = GLASS_EDGE;
  ctx.lineWidth = Math.max(s * 0.0025, 1);
  ellStroke(jx, jy, jr, jr * 0.92, 0);
  ctx.strokeStyle = rgba(LAMP_CORE, 0.65);
  ctx.lineWidth = Math.max(s * 0.002, 1);
  ctx.beginPath();
  ctx.arc(jx, jy, jr * 0.88, -Math.PI * 0.75, -Math.PI * 0.25);
  ctx.stroke();
  /* jar mouth */
  ctx.strokeStyle = GLASS_EDGE;
  ctx.lineWidth = Math.max(s * 0.002, 1);
  ctx.beginPath();
  ctx.ellipse(jx, jy - jr * 0.92, jr * 0.55, jr * 0.10, 0, 0, TAU);
  ctx.stroke();
  /* stir stick: in the jar while stirring, leaning on the rim otherwise */
  var stickAng = -0.35;
