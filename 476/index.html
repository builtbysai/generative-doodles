<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moving Toward</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #C9D6CB; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var GROUND = '#C9D6CB';
  var GOLD = '#D9A03F';
  var GOLD_DARK = '#B07E2E';
  var BUG_RED = '#D61F26';
  var BUG_LINE = '#1A1A1A';

  var LOOP = 30.0;   // one full cycle: climb, one meeting, return
  var PHASE = 12.0;  // fixed pre-roll: bugs partway up, blades bent inward

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(476004);

  // ---- soft grain: a fixed seeded dot field, redrawn identically each frame ----
  var grain = [];
  for (var i = 0; i < 1200; i++) {
    grain.push({
      x: rng(), y: rng(),
      r: 0.5 + rng() * 1.1,
      dark: rng() < 0.5,
      a: 0.025 + rng() * 0.04
    });
  }

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE); // deterministic frame after any resize
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  function lerp(a, b, u) { return a + (b - a) * u; }

  function easeInOut(u) {
    return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  }

  // climb progress over the 30s loop: rise 0-22s, hold the meeting 22-24s,
  // settle back down 24-30s. p = 0 at both ends, so the loop is seamless.
  function climbP(t) {
    if (t < 22) return easeInOut(t / 22);
    if (t < 24) return 1;
    return 1 - easeInOut((t - 24) / 6);
  }

  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  var cA = hexRGB(GOLD_DARK), cB = hexRGB(GOLD);
  function bladeColor(u) {
    var r = Math.round(lerp(cA[0], cB[0], u));
    var g = Math.round(lerp(cA[1], cB[1], u));
    var b = Math.round(lerp(cA[2], cB[2], u));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // One blade as a quadratic bezier. side: -1 left, +1 right.
  // p bends the tips toward each other; sway is the 8s breathing bend.
  function bladeGeom(side, p, sway) {
    var baseX = W * (side < 0 ? 0.35 : 0.65);
    var restTipX = W * (side < 0 ? 0.425 : 0.575);
    var meetTipX = W * (side < 0 ? 0.4935 : 0.5065);
    var tipX = lerp(restTipX, meetTipX, p) + sway * W * 0.005;
    var tipY = H * lerp(0.415, 0.395, p);
    // control point bows outward, away from centre, so the blades belly out
    // and the empty space between them rounds into the implied heart
    var cx = baseX + side * W * 0.032 + (tipX - baseX) * 0.06 + sway * W * 0.004;
    var cy = H * 0.62;
    return { x0: baseX, y0: H + 2, x1: cx, y1: cy, x2: tipX, y2: tipY };
  }

  function qPoint(g, s) {
    var a = (1 - s) * (1 - s), b = 2 * (1 - s) * s, c = s * s;
    return { x: a * g.x0 + b * g.x1 + c * g.x2, y: a * g.y0 + b * g.y1 + c * g.y2 };
  }
  function qTangent(g, s) {
    var dx = 2 * (1 - s) * (g.x1 - g.x0) + 2 * s * (g.x2 - g.x1);
    var dy = 2 * (1 - s) * (g.y1 - g.y0) + 2 * s * (g.y2 - g.y1);
    var m = Math.sqrt(dx * dx + dy * dy) || 1;
    return { x: dx / m, y: dy / m };
  }

  function drawBlade(g) {
    var U = Math.min(W, H);
    var SEG = 30;
    var wBase = Math.max(2.6, U * 0.0135);
    ctx.lineCap = 'round';
    var prev = qPoint(g, 0);
    for (var i = 1; i <= SEG; i++) {
      var u = i / SEG;
      var pt = qPoint(g, u);
      ctx.strokeStyle = bladeColor(u);
      ctx.lineWidth = lerp(wBase, 0.9, Math.pow(u, 0.8));
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(pt.x, pt.y);
      ctx.stroke();
      prev = pt;
    }
  }

  function drawBug(g, s, r) {
    var pt = qPoint(g, s);
    var tg = qTangent(g, s);
    ctx.fillStyle = BUG_RED;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    ctx.fill();
    // the black centre line, aligned with the blade so the climb reads
    ctx.strokeStyle = BUG_LINE;
    ctx.lineWidth = Math.max(1.1, r * 0.30);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(pt.x - tg.x * r * 0.82, pt.y - tg.y * r * 0.82);
    ctx.lineTo(pt.x + tg.x * r * 0.82, pt.y + tg.y * r * 0.82);
    ctx.stroke();
  }

  function draw(t) {
    var lt = ((t % LOOP) + LOOP) % LOOP;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var p = climbP(lt);
    var swayA = Math.sin(lt * Math.PI * 2 / 8);
    var swayB = Math.sin(lt * Math.PI * 2 / 8 + 0.9);
    var gL = bladeGeom(-1, p, swayA);
    var gR = bladeGeom(1, p, swayB);

    drawBlade(gL);
    drawBlade(gR);

    // the one meeting: a faint pulse ring while the tips hold together
    if (lt >= 22 && lt < 24) {
      var q = (lt - 22) / 2;
      var mx = (gL.x2 + gR.x2) / 2, my = (gL.y2 + gR.y2) / 2;
      var U0 = Math.min(W, H);
      ctx.strokeStyle = 'rgba(217,160,63,' + (0.34 * (1 - q)).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(mx, my, lerp(U0 * 0.012, U0 * 0.052, q), 0, Math.PI * 2);
      ctx.stroke();
    }

    var U = Math.min(W, H);
    var bugR = Math.max(4.6, U * 0.0105) * (isPhone() ? 1.3 : 1);
    var s = 0.16 + 0.84 * p; // arc-length-ish param along each blade
    drawBug(gL, s, bugR);
    drawBug(gR, s, bugR);

    // grain over everything, very low alpha
    for (var i = 0; i < grain.length; i++) {
      var d = grain[i];
      ctx.fillStyle = d.dark ? 'rgba(46,58,48,' + d.a + ')' : 'rgba(255,255,255,' + d.a + ')';
      ctx.beginPath();
      ctx.arc(d.x * W, d.y * H, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  resize();
  draw(PHASE);

  if (typeof requestAnimationFrame === 'function') {
    var start = null;
    var loop = function (now) {
      if (start === null) start = now;
      draw(PHASE + (now - start) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
