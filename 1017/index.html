<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mask Law</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // ---------- integer hash for glitch blocks: pure function of (x, y, step) ----------
  function hash3(x, y, s) {
    var h = (x * 374761393 + y * 668265263 + s * 974711629) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // ---------- palette (strict) ----------
  var BLACK = [0, 0, 0];          // #000000 field, total
  var WHITE = [255, 255, 255];    // #FFFFFF the law (silhouette outline)
  var GRAY  = [138, 141, 132];    // #8A8D84 outline while the mask holds still
  var CYAN  = [0, 229, 255];      // #00E5FF glitch
  var RED   = [255, 46, 77];      // #FF2E4D glitch
  var MAG   = [255, 46, 166];     // #FF2EA6 glitch
  var GLITCH = [CYAN, RED, MAG];
  function css(c, a) {
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smoother(u) { return u * u * u * (u * (u * 6 - 15) + 10); }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300, DPR = 1, CX = 150, GROUND = 270, SCALE = 100, IS_PHONE = false;

  function detectPhone() {
    var sw = 0, sh = 0;
    try { sw = window.screen.width || 0; sh = window.screen.height || 0; } catch (e) { }
    if (sw && sh && Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }
  function resize() {
    var w = 0, h = 0;
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    if (vv && vv.width) { w = vv.width; h = vv.height; }
    if (!w) { w = window.innerWidth || 300; h = window.innerHeight || 300; }
    W = w; H = h;
    DPR = window.devicePixelRatio || 1;
    var pw = Math.round(W * DPR), ph = Math.round(H * DPR);
    if (canvas.width !== pw) canvas.width = pw;
    if (canvas.height !== ph) canvas.height = ph;
    IS_PHONE = detectPhone();
    SCALE = Math.min(H * 0.88 / 2.15, W * 0.60);
    CX = W / 2;
    GROUND = H * 0.895;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceT); });
  }
  window.addEventListener('resize', function () { resize(); draw(pieceT); });
  try { canvas.style.touchAction = 'none'; } catch (e) { }

  // ---------- pose library ----------
  // Components: [spine, neck, uaL, faL, uaR, faR, thL, shL, thR, shR, rootY, rootX]
  // Angles are absolute segment directions in radians (screen coords, y down):
  // down = 1.5708, up = -1.5708. rootY/rootX are pelvis offsets in figure units.
  var POSES = [
    [-1.57, -1.57,  2.45,  2.20,  0.69,  0.95,  1.85, 1.50,  1.29, 1.65,  0.02,  0.00], // stand wide
    [-1.72, -1.80, -2.55, -2.75,  1.10,  0.55,  1.70, 1.62,  1.40, 1.50, -0.03, -0.03], // reach up-left
    [-1.05, -1.30,  2.30,  1.90,  0.85,  1.25,  0.55, 2.40,  0.80, 2.55,  0.36,  0.02], // crouch
    [-1.35, -0.85, -0.40, -0.10,  2.70,  2.95,  1.30, 1.40,  1.90, 1.80,  0.05,  0.00], // twist right
    [-1.45, -1.50, -1.90, -2.30,  0.30,  0.10,  0.30, 0.55,  2.50, 1.70,  0.20, -0.10], // lunge left
    [-1.20, -1.05,  0.90, -0.60,  2.25,  2.90,  1.55, 1.45,  1.62, 1.52,  0.08,  0.00], // fold cross
    [-1.62, -1.60,  2.60,  2.85,  0.55,  0.30,  1.60, 1.58, -0.15, -0.05, 0.00,  0.03], // kick right
    [-0.55, -0.75,  1.95,  1.60,  1.15,  0.85,  0.35, 2.65,  0.65, 2.45,  0.42,  0.05], // roll low
    [-1.57, -1.57,  3.05,  3.14,  0.00,  0.00,  1.45, 1.52,  1.70, 1.55,  0.01,  0.00], // strut T
    [-2.05, -2.25, -2.70, -2.45, -0.45, -0.70,  1.75, 1.66,  1.38, 1.47, -0.02, -0.02]  // arch back
  ];
  var NCOMP = 12;
  var L_TORSO = 0.55, L_NECK = 0.16, HEAD_R = 0.125;
  var L_UA = 0.32, L_FA = 0.30, L_TH = 0.46, L_SH = 0.46;
  var SHO_OFF = 0.115, HIP_OFF = 0.095;

  // ---------- phrase timeline (closed form over pose time) ----------
  // Segments: sharp isolations (short), slow rolls (long), and holds, where
  // the pose freezes while the glitch keeps corrupting inside the mask.
  var BASE_SEED = 1017017;
  var timeline = null;   // {segs:[{from,to,start,dur,hold}], total}
  function buildTimeline(seed, fromT) {
    var rng = mulberry32(seed);
    var segs = [];
    var t = fromT;
    var cur = (rng() * POSES.length) | 0;
    while (t < fromT + 600) {
      var r = rng();
      if (segs.length > 2 && r < 0.20) {
        var hd = 1.6 + rng() * 1.2;
        segs.push({ from: cur, to: cur, start: t, dur: hd, hold: true });
        t += hd;
      } else {
        var nxt;
        do { nxt = (rng() * POSES.length) | 0; } while (nxt === cur);
        var sharp = rng() < 0.45;
        var dur = sharp ? 0.7 + rng() * 0.5 : 2.0 + rng() * 1.3;
        segs.push({ from: cur, to: nxt, start: t, dur: dur, hold: false });
        cur = nxt;
        t += dur;
      }
    }
    return { segs: segs, total: t - fromT, start: fromT };
  }
  timeline = buildTimeline(BASE_SEED, 0);

  function segAt(t) {
    var tl = timeline;
    var tt = tl.start + ((t - tl.start) % tl.total);
    var segs = tl.segs;
    for (var i = 0; i < segs.length; i++) {
      if (tt < segs[i].start + segs[i].dur) return segs[i];
    }
    return segs[segs.length - 1];
  }
  function lerpAngle(a, b, u) {
    var d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d * u;
  }
  function poseAt(t) {
    var seg = segAt(t);
    var u = seg.dur > 0 ? clamp((t - seg.start) / seg.dur, 0, 1) : 1;
    // note: t here is timeline-local; segAt already wrapped t, but callers pass
    // poseT which lives in the same wrapped space (see poseTime()).
    var e = smoother(u);
    var A = POSES[seg.from], B = POSES[seg.to];
    var out = new Array(NCOMP);
    for (var i = 0; i < NCOMP; i++) {
      if (i >= 10) out[i] = A[i] + (B[i] - A[i]) * e;       // root offsets: plain lerp
      else out[i] = lerpAngle(A[i], B[i], e);
    }
    return { comp: out, hold: seg.hold, seg: seg };
  }
  // pose time wrapped into the timeline's span, so segAt/poseAt agree
  function poseTime(rawT) {
    var tl = timeline;
    return tl.start + ((rawT - tl.start) % tl.total);
  }

  // ---------- forward kinematics ----------
  // Joints (figure units, origin at rest pelvis, y down):
  // 0 pelvis, 1 chest, 2 neckTop, 3 headC, 4 shL, 5 elL, 6 wrL, 7 shR, 8 elR,
  // 9 wrR, 10 hipL, 11 kneeL, 12 ankL, 13 hipR, 14 kneeR, 15 ankR
  function jointsFrom(comp) {
    var sp = comp[0], nk = comp[1];
    var dx = Math.cos(sp), dy = Math.sin(sp);
    var nx = -dy, ny = dx; // spine normal
    var pelvis = [comp[11], comp[10]];
    var chest = [pelvis[0] + dx * L_TORSO, pelvis[1] + dy * L_TORSO];
    var ndx = Math.cos(nk), ndy = Math.sin(nk);
    var neckTop = [chest[0] + ndx * L_NECK, chest[1] + ndy * L_NECK];
    var headC = [neckTop[0] + ndx * HEAD_R, neckTop[1] + ndy * HEAD_R];
    var shL = [chest[0] + nx * SHO_OFF, chest[1] + ny * SHO_OFF];
    var shR = [chest[0] - nx * SHO_OFF, chest[1] - ny * SHO_OFF];
    var elL = [shL[0] + Math.cos(comp[2]) * L_UA, shL[1] + Math.sin(comp[2]) * L_UA];
    var wrL = [elL[0] + Math.cos(comp[3]) * L_FA, elL[1] + Math.sin(comp[3]) * L_FA];
    var elR = [shR[0] + Math.cos(comp[4]) * L_UA, shR[1] + Math.sin(comp[4]) * L_UA];
    var wrR = [elR[0] + Math.cos(comp[5]) * L_FA, elR[1] + Math.sin(comp[5]) * L_FA];
    var hipL = [pelvis[0] + nx * HIP_OFF, pelvis[1] + ny * HIP_OFF];
    var hipR = [pelvis[0] - nx * HIP_OFF, pelvis[1] - ny * HIP_OFF];
    var kneeL = [hipL[0] + Math.cos(comp[6]) * L_TH, hipL[1] + Math.sin(comp[6]) * L_TH];
    var ankL = [kneeL[0] + Math.cos(comp[7]) * L_SH, kneeL[1] + Math.sin(comp[7]) * L_SH];
    var kneeR = [hipR[0] + Math.cos(comp[8]) * L_TH, hipR[1] + Math.sin(comp[8]) * L_TH];
    var ankR = [kneeR[0] + Math.cos(comp[9]) * L_SH, kneeR[1] + Math.sin(comp[9]) * L_SH];
    return [pelvis, chest, neckTop, headC, shL, elL, wrL, shR, elR, wrR,
            hipL, kneeL, ankL, hipR, kneeR, ankR];
  }
  // silhouette bones: [jointA, jointB, radius in figure units]
  var BONES = [
    [0, 1, 0.150], [1, 2, 0.105], [4, 7, 0.105], [10, 13, 0.130],
    [4, 5, 0.060], [5, 6, 0.050], [7, 8, 0.060], [8, 9, 0.050],
    [10, 11, 0.088], [11, 12, 0.070], [13, 14, 0.088], [14, 15, 0.070]
  ];
  var NJ = 16;

  // interaction state: drag spring on the rig root (figure units)
  var rootOff = { x: 0, y: 0, vx: 0, vy: 0 };
  var rootTarget = { x: 0, y: 0 };

  function toPx(J) {
    var out = new Array(NJ);
    var baseY = GROUND - (L_TH + L_SH) * SCALE;
    for (var i = 0; i < NJ; i++) {
      out[i] = [CX + (J[i][0] + rootOff.x) * SCALE, baseY + (J[i][1] + rootOff.y) * SCALE];
    }
    return out;
  }
  // joint energy: mean joint speed (units/sec) of the pose at time t
  function energyAt(t) {
    var a = jointsFrom(poseAt(poseTime(t)).comp);
    var b = jointsFrom(poseAt(poseTime(t + 0.06)).comp);
    var s = 0;
    for (var i = 0; i < NJ; i++) {
      var dx = b[i][0] - a[i][0], dy = b[i][1] - a[i][1];
      s += Math.sqrt(dx * dx + dy * dy);
    }
    return (s / NJ) / 0.06;
  }

  // ---------- silhouette path (clip): capsule subpaths, one winding ----------
  function capsulePath(x1, y1, x2, y2, r) {
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy) || 1e-4;
    var a = Math.atan2(dy, dx);
    var nx = -dy / len * r, ny = dx / len * r;
    ctx.moveTo(x1 + nx, y1 + ny);
    ctx.lineTo(x2 + nx, y2 + ny);
    ctx.arc(x2, y2, r, a + Math.PI / 2, a - Math.PI / 2, true);
    ctx.lineTo(x1 - nx, y1 - ny);
    ctx.arc(x1, y1, r, a - Math.PI / 2, a + Math.PI / 2, true);
    ctx.closePath();
  }
  function traceSilhouette(P) {
    ctx.beginPath();
    for (var i = 0; i < BONES.length; i++) {
      var b = BONES[i];
      capsulePath(P[b[0]][0], P[b[0]][1], P[b[1]][0], P[b[1]][1], b[2] * SCALE);
    }
    // head circle wound to match the capsules (anticlockwise)
    ctx.moveTo(P[3][0] + HEAD_R * SCALE, P[3][1]);
    ctx.arc(P[3][0], P[3][1], HEAD_R * SCALE, 0, Math.PI * 2, true);
    ctx.closePath();
  }

  // ---------- draw ----------
  var pieceT = 13.5;   // frame one: t offset 13.5s, mid-phrase (stand wide into strut T)
  var poseT = 13.5;    // pose clock (freezable by tap-hold); pieceT never freezes
  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = css(BLACK, 1);
    ctx.fillRect(0, 0, W, H);

    var pt = poseTime(poseT);
    var pose = poseAt(pt);
    var J = jointsFrom(pose.comp);
    var P = toPx(J);
    var energy = energyAt(poseT);
    var eN = clamp(energy / 1.1, 0, 1);
    var held = pose.hold || (loopClock < tapHoldUntil);
    var edge = held ? GRAY : WHITE;

    // pass 1: the law's edge. The skeleton stroked 4px wider than the clip
    // radius in a single color: a seamless 2px rim all round the silhouette.
    ctx.lineCap = 'round';
    ctx.strokeStyle = css(edge, 1);
    for (var i = 0; i < BONES.length; i++) {
      var b = BONES[i];
      ctx.lineWidth = 2 * b[2] * SCALE + 4;
      ctx.beginPath();
      ctx.moveTo(P[b[0]][0], P[b[0]][1]);
      ctx.lineTo(P[b[1]][0], P[b[1]][1]);
      ctx.stroke();
    }
    ctx.fillStyle = css(edge, 1);
    ctx.beginPath();
    ctx.arc(P[3][0], P[3][1], HEAD_R * SCALE + 2, 0, Math.PI * 2);
    ctx.fill();

    // figure bounds for the glitch field
    var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    for (var j = 0; j < NJ; j++) {
      if (P[j][0] < minX) minX = P[j][0];
      if (P[j][1] < minY) minY = P[j][1];
      if (P[j][0] > maxX) maxX = P[j][0];
      if (P[j][1] > maxY) maxY = P[j][1];
    }
    var pad = 0.17 * SCALE;
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;

    // pass 2: the corruption, clipped to the silhouette. THE LAW: every glitch
    // mark in this pass is drawn inside ctx.clip() of the silhouette path.
    ctx.save();
    traceSilhouette(P);
    ctx.clip();
    ctx.fillStyle = css(BLACK, 1);
    ctx.fillRect(minX, minY, maxX - minX, maxY - minY);

    // RGB channel splits: offset copies of an inner silhouette, one per channel
    var split = 2 + Math.round(3 * eN);
    for (var c = 0; c < 3; c++) {
      var ox = (c - 1) * split, oy = (c === 1) ? 1 : -1;
      ctx.strokeStyle = css(GLITCH[c], 0.16 + 0.08 * eN);
      ctx.lineCap = 'round';
      for (var g = 0; g < BONES.length; g++) {
        var gb = BONES[g];
        ctx.lineWidth = 2 * gb[2] * SCALE * 0.78;
        ctx.beginPath();
        ctx.moveTo(P[gb[0]][0] + ox, P[gb[0]][1] + oy);
        ctx.lineTo(P[gb[1]][0] + ox, P[gb[1]][1] + oy);
        ctx.stroke();
      }
      ctx.fillStyle = css(GLITCH[c], 0.16 + 0.08 * eN);
      ctx.beginPath();
      ctx.arc(P[3][0] + ox, P[3][1] + oy, HEAD_R * SCALE * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }

    // macroblocks on a hash clock: pure function of (cell, band, step)
    var step = Math.floor(t * (8 + 4 * eN));
    var S = clamp(SCALE * 0.042, 9, 16);
    var pAct = 0.30 + 0.34 * eN;
    var x0 = Math.floor(minX / S), x1 = Math.floor(maxX / S);
    var y0 = Math.floor(minY / S), y1 = Math.floor(maxY / S);
    for (var gy = y0; gy <= y1; gy++) {
      var band = Math.floor(gy / 3);
      var bandHash = hash3(band, 777, step >> 2);
      var snap = bandHash < 0.38;                 // quantization band: x snaps coarse
      if (bandHash > 0.86) {                      // a band-wide wash of corruption
        ctx.fillStyle = css(GLITCH[(bandHash * 91) % 3 | 0], 0.10);
        ctx.fillRect(minX, gy * S, maxX - minX, S);
      }
      for (var gx = x0; gx <= x1; gx++) {
        var h1 = hash3(gx, gy, step);
        if (h1 > pAct) continue;
        var col = GLITCH[(hash3(gx, gy, step + 5000) * 3) | 0];
        var alpha = 0.45 + 0.55 * hash3(gx, gy, step + 9000);
        var cxI = snap ? (gx - (gx & 1)) : gx;    // snap to a 2-cell grid in-band
        var dxp = cxI * S, dyp = gy * S;
        var h4 = hash3(gx, gy, step + 3000);
        if (h4 < 0.14) dxp += S;                  // block displacement
        else if (h4 < 0.22) dyp += S;
        var big = hash3(gx, gy, step + 7000) < 0.10;
        ctx.fillStyle = css(col, alpha);
        ctx.fillRect(dxp, dyp, big ? S * 2 : S, big ? S * 2 : S);
      }
    }
    ctx.restore();
    return energy;
  }

  // ---------- audio (lazy, gesture-gated, guarded) ----------
  var AC = null, tearGain = null, humGain = null, masterGain = null;
  function audioInit() {
    if (AC) return;
    var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext :
               ((typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null);
    if (!Ctor) return;
    try {
      AC = new Ctor();
      masterGain = AC.createGain(); masterGain.gain.value = 0.4;
      masterGain.connect(AC.destination);
      // tearing: looped noise through a bandpass, gain follows joint energy
      var len = AC.sampleRate;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      var nr = mulberry32(4242);
      for (var i = 0; i < len; i++) d[i] = nr() * 2 - 1;
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 0.8;
      tearGain = AC.createGain(); tearGain.gain.value = 0;
      src.connect(bp); bp.connect(tearGain); tearGain.connect(masterGain);
      src.start();
      // hum: the paused body
      var osc = AC.createOscillator(); osc.type = 'sine'; osc.frequency.value = 54;
      humGain = AC.createGain(); humGain.gain.value = 0;
      osc.connect(humGain); humGain.connect(masterGain);
      osc.start();
    } catch (e) { AC = null; }
  }
  function audioClick(freq) {
    if (!AC) return;
    try {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.05, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.045);
      o.connect(g); g.connect(masterGain);
      o.start(); o.stop(AC.currentTime + 0.05);
    } catch (e) { }
  }
  function audioFrame(energy, held) {
    if (!AC || !tearGain) return;
    try {
      var eN = clamp(energy / 1.1, 0, 1);
      var tear = held ? 0.004 : eN * 0.10;
      tearGain.gain.setTargetAtTime(tear, AC.currentTime, 0.06);
      humGain.gain.setTargetAtTime(held ? 0.05 : 0.012, AC.currentTime, 0.12);
    } catch (e) { }
  }

  // ---------- pointer interaction ----------
  var loopClock = 0;
  var tapHoldUntil = -10;
  var downAt = 0, downPos = null, dragging = false, lastTapAt = -10, tapCount = 0;
  function evPos(e) {
    var r = (canvas.getBoundingClientRect) ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return [(e.clientX - r.left - CX) / SCALE, (e.clientY - r.top - (GROUND - (L_TH + L_SH) * SCALE)) / SCALE];
  }
  canvas.addEventListener('pointerdown', function (e) {
    audioInit();
    if (AC && AC.resume) { try { AC.resume(); } catch (err) { } }
    downAt = loopClock;
    downPos = evPos(e);
    dragging = true;
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging || !downPos) return;
    var p = evPos(e);
    var dx = p[0] - downPos[0], dy = p[1] - downPos[1];
    var m = Math.sqrt(dx * dx + dy * dy);
    if (m > 0.55) { dx *= 0.55 / m; dy *= 0.55 / m; }
    rootTarget.x = dx; rootTarget.y = dy;
  });
  function endPointer(e) {
    if (!dragging) return;
    dragging = false;
    rootTarget.x = 0; rootTarget.y = 0;
    var p = evPos(e);
    var moved = Math.sqrt(Math.pow(p[0] - downPos[0], 2) + Math.pow(p[1] - downPos[1], 2));
    var quick = loopClock - downAt < 0.35;
    if (quick && moved < 0.06) {
      if (loopClock - lastTapAt < 0.32) {
        // double-tap: a new phrase, cut clean
        lastTapAt = -10;
        tapHoldUntil = -10;
        tapCount++;
        timeline = buildTimeline(BASE_SEED + tapCount * 7919, poseT);
        audioClick(140);
      } else {
        // tap: hold the mask still ~6s; the corruption lives on inside it
        lastTapAt = loopClock;
        tapHoldUntil = loopClock + 6;
        audioClick(320);
      }
    }
    downPos = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- main loop ----------
  resize();
  draw(pieceT);

  var lastTs = null, lastSegStart = segAt(poseTime(poseT)).start, lastTick = 0;
  function frame(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    loopClock += dt;
    pieceT += dt;
    if (loopClock >= tapHoldUntil) poseT += dt;   // pose clock freezes during a tap-hold
    // root spring: the mask follows the finger with lag, and settles back
    var k = 60, c = 11;
    rootOff.vx += ((rootTarget.x - rootOff.x) * k - rootOff.vx * c) * dt;
    rootOff.vy += ((rootTarget.y - rootOff.y) * k - rootOff.vy * c) * dt;
    rootOff.x += rootOff.vx * dt;
    rootOff.y += rootOff.vy * dt;
    var spd = draw(pieceT);
    var ss = segAt(poseTime(poseT)).start;
    if (ss !== lastSegStart) { lastSegStart = ss; audioClick(190); }  // phrase edits click
    if (AC) {
      var heldNow = segAt(poseTime(poseT)).hold || (loopClock < tapHoldUntil);
      audioFrame(spd || 0, heldNow);
      if (spd > 0.9 && loopClock - lastTick > 0.13) {  // joint ticks at speed
        lastTick = loopClock;
        audioClick(1200 + (Math.floor(pieceT * 10) % 5) * 130);
      }
    }
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
