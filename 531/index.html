<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabinet of Curiosities</title>
<style>
  html, body { margin: 0; padding: 0; background: #F7F1E3; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32, fixed seed) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(531064);

  // ---------- palette (flat fills only, no gradients, no shadows) ----------
  var CREAM = '#F7F1E3', WHITE = '#FFFFFF', PURPLE = '#8E44AD',
      GREEN = '#27AE60', PINK = '#F5A3C7', BLUE = '#2B4FE0',
      INK = '#1A1A1A', YELLOW = '#F2B705';

  // ---------- grid geometry (stage units, square stage 0..1) ----------
  var M = 0.055, GUT = 0.02;
  var CELL = (1 - 2 * M - 3 * GUT) / 4;          // 0.2075
  var OBJR = CELL * 0.7 / 2;                     // object box half-size
  function cellX(col) { return M + col * (CELL + GUT); }
  function cellY(row) { return M + row * (CELL + GUT); }

  // ---------- grain specks (precomputed, drawn directly; no offscreen canvas) ----------
  var grain = [];
  for (var g = 0; g < 650; g++) {
    grain.push({ x: rng(), y: rng(), a: rng() * Math.PI, l: 2 + rng() * 4, al: 0.025 + rng() * 0.05 });
  }

  // ---------- title letters: stroke glyphs, seeded jitter ----------
  var GLYPHS = {
    W: [[[0, 0], [0.22, 1], [0.5, 0.3], [0.78, 1], [1, 0]]],
    U: [[[0, 0], [0, 0.68], [0.14, 0.92], [0.5, 1], [0.86, 0.92], [1, 0.68], [1, 0]]],
    N: [[[0, 1], [0, 0], [1, 1], [1, 0]]],
    D: [[[0.02, 0], [0.02, 1]], [[0.02, 0], [0.5, 0.04], [0.82, 0.28], [0.82, 0.72], [0.5, 0.96], [0.02, 1]]],
    E: [[[0.95, 0], [0, 0], [0, 1], [0.95, 1]], [[0, 0.5], [0.68, 0.5]]],
    R: [[[0, 1], [0, 0], [0.52, 0], [0.8, 0.14], [0.8, 0.36], [0.52, 0.5], [0, 0.5]], [[0.48, 0.5], [0.85, 1]]],
    Z: [[[0.05, 0], [0.95, 0], [0.05, 1], [0.95, 1]]],
    I: [[[0.5, 0], [0.5, 1]], [[0.18, 0], [0.82, 0]], [[0.18, 1], [0.82, 1]]],
    S: [[[0.85, 0.15], [0.6, 0], [0.25, 0.08], [0.15, 0.3], [0.3, 0.48], [0.7, 0.55], [0.85, 0.75], [0.7, 0.95], [0.4, 1], [0.15, 0.88]]]
  };
  function titleLine(str, cols) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      out.push({ ch: str.charAt(i), col: cols[i], rot: (rng() - 0.5) * 0.09, dy: (rng() - 0.5) * 0.014 });
    }
    return out;
  }
  var TITLE1 = titleLine('WUNDER', [PURPLE, BLUE, PINK, GREEN, YELLOW, INK]);
  var TITLE2 = titleLine('ZINES', [PINK, YELLOW, BLUE, GREEN, PURPLE]);

  // ---------- viewport / stage ----------
  var W = 0, H = 0, SX = 0, SY = 0, SS = 0;
  var isPhone = false;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SS = Math.min(w, h);
    SX = (w - SS) / 2; SY = (h - SS) / 2;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || h > w * 1.15;
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  function X(u) { return SX + u * SS; }
  function Y(u) { return SY + u * SS; }

  // ---------- object-space helpers (local box -1..1, y down) ----------
  function poly(pts, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function circ(x, y, r, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function ell(x, y, rx, ry, rot, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function stroke(pts, w, col, alpha, close) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (close) ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function sparkle(x, y, r, col) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.quadraticCurveTo(x, y, x, y + r);
    ctx.quadraticCurveTo(x, y, x - r, y);
    ctx.quadraticCurveTo(x, y, x, y - r);
    ctx.fill();
  }
  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
  function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  // ---------- the twelve objects (each: draw(p), p = -1 idle, else 0..1) ----------

  function drawBoot(p) {
    if (p >= 0) {
      var hop = -0.10 * Math.sin(Math.PI * p);
      ctx.translate(0, hop);
      ctx.translate(0, 0.95); ctx.rotate(-0.55 * Math.sin(Math.PI * p)); ctx.translate(0, -0.95);
    }
    poly([[-0.62, -0.8], [-0.44, -0.8], [-0.44, -0.48], [-0.62, -0.48]], YELLOW); // pull tab
    poly([[-0.52, -0.88], [0.18, -0.88], [0.18, 0.02], [0.82, 0.28], [0.88, 0.5],
          [0.16, 0.55], [0.16, 0.92], [-0.22, 0.92], [-0.22, 0.55], [-0.52, 0.42]], PURPLE);
    poly([[-0.52, -0.88], [0.18, -0.88], [0.18, -0.62], [-0.52, -0.62]], YELLOW); // cuff band
    stroke([[0.14, 0.62], [0.86, 0.56]], 0.07, INK);                              // sole line
  }

  function drawTeapot(p) {
    if (p >= 0) { ctx.translate(0, 0.75); ctx.rotate(-0.38 * Math.sin(Math.PI * p)); ctx.translate(0, -0.75); }
    // handle
    ctx.globalAlpha = 1; ctx.strokeStyle = BLUE; ctx.lineWidth = 0.11; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0.6, 0.15, 0.27, -1.15, 1.15); ctx.stroke();
    // spout
    poly([[-0.48, 0.02], [-0.86, -0.3], [-0.68, 0.34], [-0.42, 0.3]], BLUE);
    // body
    ell(0, 0.18, 0.58, 0.46, 0, BLUE);
    // dot pattern clipped to the body
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0.18, 0.58, 0.46, 0, 0, Math.PI * 2); ctx.clip();
    var dots = [[-0.3, 0.02], [0.02, 0.26], [0.32, 0.0], [-0.12, -0.1], [0.2, 0.4], [-0.38, 0.32], [0.05, 0.05]];
    for (var i = 0; i < dots.length; i++) circ(dots[i][0], dots[i][1], 0.055, CREAM);
    ctx.restore();
    // lid + knob
    ell(0, -0.28, 0.32, 0.11, 0, BLUE);
    circ(0, -0.42, 0.07, YELLOW);
    stroke([[-0.4, 0.66], [0.4, 0.66]], 0.08, INK);
    // poured drop
    if (p > 0.25) {
      var q = (p - 0.25) / 0.6;
      if (q < 1) {
        var dy = -0.18 + q * 0.85;
        ctx.globalAlpha = q < 0.8 ? 1 : 1 - (q - 0.8) / 0.2;
        ctx.fillStyle = BLUE;
        ctx.beginPath(); ctx.arc(-0.84, dy, 0.07, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-0.84, dy - 0.14); ctx.lineTo(-0.91, dy + 0.02); ctx.lineTo(-0.77, dy + 0.02); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawShell(p) {
    if (p >= 0) { ctx.translate(0, 0.6); ctx.rotate(0.18 * Math.sin(2 * Math.PI * p) * (1 - p)); ctx.translate(0, -0.6); }
    ctx.globalAlpha = 1; ctx.fillStyle = PINK;
    ctx.beginPath();
    ctx.moveTo(-0.72, 0.5);
    ctx.bezierCurveTo(-0.75, -0.35, -0.4, -0.78, 0, -0.8);
    ctx.bezierCurveTo(0.4, -0.78, 0.75, -0.35, 0.72, 0.5);
    var n = 5, step = 1.44 / n;
    for (var i = 0; i < n; i++) {
      var x0 = 0.72 - i * step, x1 = x0 - step;
      ctx.quadraticCurveTo(x0 - step / 2, 0.7, x1, 0.5);
    }
    ctx.closePath(); ctx.fill();
    // radiating ridges
    for (var a = -60; a <= 60; a += 20) {
      var th = a * Math.PI / 180;
      stroke([[0, 0.52], [0.72 * Math.sin(th), 0.5 - 1.26 * Math.cos(th)]], 0.045, INK, 0.4);
    }
    circ(0, 0.52, 0.09, YELLOW);
  }

  function drawGem(p) {
    poly([[-0.48, -0.62], [0.48, -0.62], [0.78, -0.12], [-0.78, -0.12]], GREEN);
    poly([[-0.78, -0.12], [0.78, -0.12], [0, 0.85]], GREEN);
    poly([[-0.78, -0.12], [-0.3, -0.12], [0, 0.85]], WHITE, 0.18); // facet highlight
    stroke([[-0.48, -0.62], [0.48, -0.62], [0.78, -0.12], [0, 0.85], [-0.78, -0.12], [-0.48, -0.62]], 0.05, INK, 0.55, true);
    stroke([[-0.78, -0.12], [0.78, -0.12]], 0.04, INK, 0.4);
    stroke([[-0.48, -0.62], [-0.3, -0.12]], 0.04, INK, 0.35);
    stroke([[0.48, -0.62], [0.3, -0.12]], 0.04, INK, 0.35);
    stroke([[-0.3, -0.12], [0, 0.85]], 0.04, INK, 0.3);
    stroke([[0.3, -0.12], [0, 0.85]], 0.04, INK, 0.3);
    if (p >= 0) {
      var spots = [[-0.88, -0.72, 0], [0.85, -0.52, 0.25], [0.58, 0.6, 0.5]];
      for (var i = 0; i < spots.length; i++) {
        var s = Math.sin(Math.PI * clamp01((p - spots[i][2]) / 0.45));
        if (s > 0.02) sparkle(spots[i][0], spots[i][1], 0.2 * s, i === 1 ? WHITE : YELLOW);
      }
    }
  }

  function drawLamp(p) {
    if (p >= 0) { ctx.translate(0, 0.82); ctx.rotate(0.1 * Math.sin(2 * Math.PI * p)); ctx.translate(0, -0.82); }
    ell(0, 0.8, 0.46, 0.11, 0, PURPLE); // base
    // gooseneck
    ctx.globalAlpha = 1; ctx.strokeStyle = INK; ctx.lineWidth = 0.15; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-0.28, 0.78);
    ctx.bezierCurveTo(-0.34, 0.2, -0.2, -0.28, 0.12, -0.42);
    ctx.bezierCurveTo(0.3, -0.5, 0.42, -0.48, 0.5, -0.36);
    ctx.stroke();
    // glow while lit (layered flat circles, no gradient)
    if (p >= 0) {
      var gl = Math.sin(Math.PI * p);
      circ(0.56, -0.14, 0.36, YELLOW, 0.1 * gl);
      circ(0.56, -0.14, 0.24, YELLOW, 0.16 * gl);
    }
    // bell shade + bulb
    poly([[0.3, -0.54], [0.8, -0.3], [0.7, -0.06], [0.36, -0.22]], YELLOW);
    stroke([[0.3, -0.54], [0.8, -0.3], [0.7, -0.06], [0.36, -0.22]], 0.04, INK, 0.6, true);
    circ(0.56, -0.14, 0.085, CREAM);
  }

  function drawClock(p) {
    stroke([[0.62, 0.12], [0.88, 0.02], [0.86, -0.32]], 0.09, INK); // tail
    ell(-0.52, -0.38, 0.16, 0.34, 0.5, INK);                        // ears
    ell(0.52, -0.38, 0.16, 0.34, -0.5, INK);
    ctx.fillStyle = INK;                                            // legs
    ctx.fillRect(-0.42, 0.58, 0.2, 0.28);
    ctx.fillRect(0.22, 0.58, 0.2, 0.28);
    circ(0, 0, 0.66, CREAM);                                        // face
    ctx.globalAlpha = 1; ctx.strokeStyle = INK; ctx.lineWidth = 0.05;
    ctx.beginPath(); ctx.arc(0, 0, 0.66, 0, Math.PI * 2); ctx.stroke();
    // spots (pattern fill)
    circ(-0.35, -0.2, 0.09, PURPLE); circ(0.32, 0.3, 0.11, PURPLE);
    circ(-0.16, 0.46, 0.07, PURPLE); circ(0.44, -0.32, 0.06, PURPLE);
    // dog eyes + snout
    circ(-0.2, -0.3, 0.045, INK); circ(0.2, -0.3, 0.045, INK);
    ell(0, 0.34, 0.2, 0.13, 0, WHITE);
    ctx.globalAlpha = 1; ctx.strokeStyle = INK; ctx.lineWidth = 0.035;
    ctx.beginPath(); ctx.ellipse(0, 0.34, 0.2, 0.13, 0, 0, Math.PI * 2); ctx.stroke();
    circ(0, 0.28, 0.055, INK);
    // hands: base time 10:10; tap spins them twice
    var spin = p >= 0 ? Math.PI * 4 * easeOut(p) : 0;
    var hA = (10 / 12) * Math.PI * 2 + spin / 12, mA = (2 / 12) * Math.PI * 2 + spin;
    stroke([[0, 0.02], [0.3 * Math.sin(hA), 0.02 - 0.3 * Math.cos(hA)]], 0.07, INK);
    stroke([[0, 0.02], [0.44 * Math.sin(mA), 0.02 - 0.44 * Math.cos(mA)]], 0.055, INK);
    circ(0, 0.02, 0.06, INK);
  }

  function drawMushrooms(p) {
    stroke([[-0.9, 0.78], [0.9, 0.78]], 0.05, INK, 0.45);
    var shrooms = [[-0.52, 0.8], [0.05, 1.0], [0.56, 0.7]];
    for (var i = 0; i < shrooms.length; i++) {
      var mx = shrooms[i][0], ms = shrooms[i][1];
      ctx.save();
      ctx.translate(mx, 0.78);
      var sy = 1;
      if (p >= 0) sy = 1 - 0.16 * Math.sin(Math.PI * clamp01(p * 1.3 - i * 0.15));
      ctx.scale(ms, ms * sy);
      poly([[-0.11, 0], [0.11, 0], [0.08, -0.5], [-0.08, -0.5]], CREAM); // stem (base at 0)
      ctx.globalAlpha = 1; ctx.fillStyle = PURPLE;
      ctx.beginPath(); ctx.arc(0, -0.48, 0.36, Math.PI, 0); ctx.closePath(); ctx.fill();
      circ(-0.15, -0.62, 0.055, CREAM); circ(0.1, -0.7, 0.045, CREAM); circ(0.18, -0.55, 0.04, CREAM);
      ctx.restore();
    }
  }

  function drawSundae(p) {
    // wafer behind scoops
    ctx.save(); ctx.translate(0.42, -0.5); ctx.rotate(0.5); ctx.fillStyle = YELLOW; ctx.fillRect(-0.06, -0.26, 0.12, 0.52); ctx.restore();
    // glass goblet
    poly([[-0.5, -0.02], [0.5, -0.02], [0.18, 0.36], [-0.18, 0.36]], BLUE);
    ctx.fillStyle = BLUE; ctx.fillRect(-0.05, 0.36, 0.1, 0.26);
    ell(0, 0.66, 0.3, 0.07, 0, BLUE);
    // scoops
    circ(-0.22, -0.26, 0.27, PINK);
    circ(0.22, -0.26, 0.27, CREAM);
    circ(0, -0.5, 0.26, PINK);
    // sprinkles
    var spr = [[-0.3, -0.34, 0.4], [-0.12, -0.2, 1.2], [0.16, -0.32, 0.8], [0.3, -0.18, 1.7], [-0.06, -0.56, 0.3], [0.1, -0.46, 1.1]];
    for (var i = 0; i < spr.length; i++) {
      stroke([[spr[i][0], spr[i][1]], [spr[i][0] + 0.07 * Math.cos(spr[i][2]), spr[i][1] + 0.07 * Math.sin(spr[i][2])]], 0.035, i % 2 ? BLUE : INK);
    }
    // cherry (bounces on tap)
    var cy = -0.82;
    if (p >= 0) cy -= 0.3 * Math.sin(Math.PI * p);
    ctx.globalAlpha = 1; ctx.strokeStyle = INK; ctx.lineWidth = 0.035; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, cy + 0.02); ctx.quadraticCurveTo(0.1, cy - 0.16, 0.2, cy - 0.18); ctx.stroke();
    circ(0, cy, 0.09, PURPLE);
  }

  function drawFlower(p) {
    stroke([[0, 0.85], [0.02, 0.4], [-0.03, 0.1], [0, -0.12]], 0.09, GREEN);
    ell(-0.26, 0.45, 0.17, 0.08, 0.6, GREEN);
    ctx.save();
    ctx.translate(0, -0.15);
    if (p >= 0) ctx.rotate(Math.PI * 2 * easeInOut(p));
    for (var k = 0; k < 6; k++) {
      var a = k * Math.PI / 3;
      var px = 0.3 * Math.cos(a), py = 0.3 * Math.sin(a);
      ell(px, py, 0.19, 0.13, a, WHITE);
      ctx.globalAlpha = 1; ctx.strokeStyle = INK; ctx.lineWidth = 0.035;
      ctx.beginPath(); ctx.ellipse(px, py, 0.19, 0.13, a, 0, Math.PI * 2); ctx.stroke();
    }
    circ(0, 0, 0.16, YELLOW);
    circ(-0.05, -0.04, 0.022, INK); circ(0.06, 0.02, 0.022, INK); circ(-0.01, 0.07, 0.022, INK);
    ctx.restore();
  }

  function drawSock(p) {
    ctx.save();
    if (p >= 0) {
      ctx.translate(0, -0.85);
      ctx.rotate(0.22 * Math.sin(2 * Math.PI * p));
      ctx.scale(1, 1 + 0.12 * Math.sin(Math.PI * p));
      ctx.translate(0, 0.85);
    }
    var path = function () {
      ctx.beginPath();
      ctx.moveTo(-0.34, -0.85); ctx.lineTo(0.34, -0.85); ctx.lineTo(0.34, 0.05);
      ctx.bezierCurveTo(0.34, 0.3, 0.5, 0.35, 0.62, 0.5);
      ctx.bezierCurveTo(0.78, 0.68, 0.6, 0.88, 0.38, 0.86);
      ctx.lineTo(-0.05, 0.82);
      ctx.bezierCurveTo(-0.3, 0.8, -0.34, 0.6, -0.34, 0.35);
      ctx.closePath();
    };
    ctx.globalAlpha = 1; ctx.fillStyle = PINK; path(); ctx.fill();
    ctx.save(); path(); ctx.clip();
    ctx.fillStyle = BLUE; ctx.fillRect(-0.4, -0.85, 0.8, 0.17);            // cuff
    ctx.fillStyle = YELLOW; ctx.fillRect(-0.4, -0.55, 0.8, 0.15);          // stripes
    ctx.fillRect(-0.4, -0.18, 0.8, 0.15);
    ctx.fillStyle = BLUE; ctx.fillRect(-0.4, 0.19, 0.8, 0.15);
    ctx.fillStyle = YELLOW; ctx.fillRect(-0.4, 0.56, 1.3, 0.15);
    ctx.restore();
    ctx.globalAlpha = 1; ctx.strokeStyle = INK; ctx.lineWidth = 0.045; ctx.globalAlpha = 0.7;
    path(); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawBoat(p) {
    // waves (stay put while the boat bobs)
    var wob = p >= 0 ? 0.1 * Math.sin(2 * Math.PI * p) : 0;
    var wv = [[-0.85, 0.8], [-0.55, 0.72], [-0.25, 0.8], [0.05, 0.72], [0.35, 0.8], [0.65, 0.72], [0.9, 0.8]];
    var wv2 = [];
    for (var i = 0; i < wv.length; i++) wv2.push([wv[i][0] + wob, wv[i][1]]);
    stroke(wv2, 0.06, BLUE);
    ctx.save();
    if (p >= 0) { ctx.translate(0, -0.14 * Math.sin(Math.PI * p)); ctx.translate(0, 0.3); ctx.rotate(0.12 * Math.sin(2 * Math.PI * p)); ctx.translate(0, -0.3); }
    poly([[0, -0.75], [0.3, -0.65], [0, -0.55]], PINK);                       // flag
    stroke([[0, 0.3], [0, -0.75]], 0.06, INK);                               // mast
    poly([[0.06, -0.72], [0.06, 0.22], [0.62, 0.22]], CREAM);                // main sail
    ctx.save();
    ctx.beginPath(); ctx.moveTo(0.06, -0.72); ctx.lineTo(0.06, 0.22); ctx.lineTo(0.62, 0.22); ctx.closePath(); ctx.clip();
    ctx.fillStyle = BLUE;
    ctx.fillRect(0, -0.52, 0.66, 0.07); ctx.fillRect(0, -0.27, 0.66, 0.07); ctx.fillRect(0, -0.02, 0.66, 0.07);
    ctx.restore();
    poly([[-0.06, -0.6], [-0.06, 0.22], [-0.48, 0.22]], YELLOW);             // jib
    poly([[-0.75, 0.3], [0.75, 0.3], [0.5, 0.62], [-0.5, 0.62]], PURPLE);    // hull
    stroke([[-0.75, 0.3], [0.75, 0.3]], 0.05, INK);
    ctx.restore();
  }

  function drawKey(p) {
    ctx.save();
    if (p >= 0) { ctx.translate(-0.35, -0.3); ctx.rotate((Math.PI / 2) * Math.sin(Math.PI * p)); ctx.translate(0.35, 0.3); }
    // ink underlay for contrast, gold on top
    ctx.globalAlpha = 1; ctx.strokeStyle = INK; ctx.lineWidth = 0.21; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-0.35, -0.3, 0.3, 0, Math.PI * 2); ctx.stroke();
    stroke([[-0.12, -0.3], [0.75, 0.28]], 0.21, INK);
    ctx.strokeStyle = YELLOW; ctx.lineWidth = 0.13;
    ctx.beginPath(); ctx.arc(-0.35, -0.3, 0.3, 0, Math.PI * 2); ctx.stroke();
    stroke([[-0.12, -0.3], [0.75, 0.28]], 0.13, YELLOW);
    poly([[0.52, 0.1], [0.7, 0.22], [0.58, 0.38], [0.42, 0.26]], YELLOW);     // teeth
    poly([[0.68, 0.24], [0.84, 0.36], [0.73, 0.52], [0.58, 0.4]], YELLOW);
    ctx.restore();
    if (p >= 0) {
      var s = Math.sin(Math.PI * clamp01((p - 0.35) / 0.45));
      if (s > 0.02) sparkle(0.88, 0.5, 0.18 * s, YELLOW);
    }
  }

  // cell assignment: [col, row, drawFn, duration]
  var OBJECTS = [
    [0, 0, drawBoot, 1.0], [1, 0, drawTeapot, 1.1], [2, 0, drawShell, 1.0], [3, 0, drawGem, 1.0],
    [0, 1, drawLamp, 1.0], [3, 1, drawClock, 1.2],
    [0, 2, drawMushrooms, 1.0], [3, 2, drawSundae, 1.0],
    [0, 3, drawFlower, 1.1], [1, 3, drawSock, 1.0], [2, 3, drawBoat, 1.0], [3, 3, drawKey, 1.0]
  ];

  // ---------- tap interaction (tap-only; one tap animates one object) ----------
  var animStart = {};   // "col,row" -> loop-time when tapped
  var nowT = 0;
  var lastTapMs = -1e9;
  function onTap(cxPx, cyPx) {
    var u = (cxPx - SX) / SS, v = (cyPx - SY) / SS;
    for (var i = 0; i < OBJECTS.length; i++) {
      var o = OBJECTS[i];
      var x0 = cellX(o[0]), y0 = cellY(o[1]);
      if (u >= x0 && u <= x0 + CELL && v >= y0 && v <= y0 + CELL) {
        animStart[o[0] + ',' + o[1]] = nowT;
        return;
      }
    }
  }
  function handleEvent(e) {
    var ms = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (ms - lastTapMs < 350) return;   // dedupe pointerdown/mousedown pairs
    lastTapMs = ms;
    var rect = canvas.getBoundingClientRect();
    var cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    var cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
    if (cx === undefined) return;
    onTap(cx - rect.left, cy - rect.top);
  }
  canvas.addEventListener('pointerdown', handleEvent);
  canvas.addEventListener('mousedown', handleEvent);
  canvas.addEventListener('touchstart', handleEvent);

  // ---------- title ----------
  function drawTitleLine(line, cx, cyTop, tw, th) {
    var lw = tw * 0.125, gap = tw * 0.023, lh = th * 0.62;
    var total = line.length * lw + (line.length - 1) * gap;
    var x = cx - total / 2;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (var i = 0; i < line.length; i++) {
      var L = line[i];
      ctx.save();
      ctx.translate(X(x + lw / 2), Y(cyTop + lh / 2 + L.dy));
      ctx.rotate(L.rot);
      ctx.scale(lw * SS, lh * SS);
      ctx.strokeStyle = L.col; ctx.lineWidth = 0.17;
      var strokes = GLYPHS[L.ch];
      for (var s = 0; s < strokes.length; s++) {
        ctx.beginPath();
        var pts = strokes[s];
        ctx.moveTo(pts[0][0] - 0.5, pts[0][1] - 0.5);
        for (var q = 1; q < pts.length; q++) ctx.lineTo(pts[q][0] - 0.5, pts[q][1] - 0.5);
        ctx.stroke();
      }
      ctx.restore();
      x += lw + gap;
    }
  }

  // ---------- main draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = CREAM; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath(); ctx.rect(SX, SY, SS, SS); ctx.clip();

    // cabinet cells: white panels, ink hairlines, cream gutters
    var col, row;
    for (row = 0; row < 4; row++) {
      for (col = 0; col < 4; col++) {
        if (col >= 1 && col <= 2 && row >= 1 && row <= 2) continue; // merged center
        ctx.fillStyle = WHITE;
        ctx.fillRect(X(cellX(col)), Y(cellY(row)), CELL * SS, CELL * SS);
        ctx.globalAlpha = 0.4; ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, 0.0022 * SS);
        ctx.strokeRect(X(cellX(col)), Y(cellY(row)), CELL * SS, CELL * SS);
        ctx.globalAlpha = 1;
      }
    }
    // merged center cell + title
    var tx = cellX(1), ty = cellY(1), tw = 2 * CELL + GUT, th = 2 * CELL + GUT;
    ctx.fillStyle = WHITE;
    ctx.fillRect(X(tx), Y(ty), tw * SS, th * SS);
    ctx.globalAlpha = 0.75; ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, 0.0035 * SS);
    ctx.strokeRect(X(tx), Y(ty), tw * SS, th * SS);
    ctx.globalAlpha = 1;
    drawTitleLine(TITLE1, tx + tw / 2, ty + th * 0.14, tw, th * 0.34);
    drawTitleLine(TITLE2, tx + tw / 2, ty + th * 0.55, tw, th * 0.34);

    // objects
    for (var i = 0; i < OBJECTS.length; i++) {
      var o = OBJECTS[i];
      var key = o[0] + ',' + o[1];
      var p = -1;
      if (animStart[key] !== undefined) {
        p = (t - animStart[key]) / o[3];
        if (p >= 1) { p = -1; delete animStart[key]; }
      }
      ctx.save();
      ctx.translate(X(cellX(o[0]) + CELL / 2), Y(cellY(o[1]) + CELL / 2));
      ctx.scale(OBJR * SS, OBJR * SS);
      o[2](p);
      ctx.restore();
    }

    // grain specks over everything (precomputed, drawn directly)
    for (var gi = 0; gi < grain.length; gi++) {
      var gr = grain[gi];
      ctx.strokeStyle = 'rgba(26,26,26,' + gr.al + ')';
      ctx.lineWidth = Math.max(1, 0.0013 * SS);
      ctx.beginPath();
      ctx.moveTo(X(gr.x), Y(gr.y));
      ctx.lineTo(X(gr.x + Math.cos(gr.a) * gr.l / 1080), Y(gr.y + Math.sin(gr.a) * gr.l / 1080));
      ctx.stroke();
    }

    // hint
    ctx.fillStyle = INK; ctx.globalAlpha = 0.45;
    ctx.font = '600 ' + Math.round(0.02 * SS) + 'px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('tap', X(0.018), Y(0.985));
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  // ---------- deterministic first frame + guarded loop ----------
  draw(0);
  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    nowT = (now - startStamp) / 1000;
    draw(nowT);
    window.requestAnimationFrame(frame);
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
