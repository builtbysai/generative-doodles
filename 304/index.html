<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.304 Tile Trial Grid</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#2A241E; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.304 Tile Trial Grid (Ali Fisher).
// Twenty handmade crackle glazed tiles in a 4 by 5 grid on a
// dark timber ground. Each tile carries one sgraffito motif
// cut through to the clay body: a flower, a bird, a skull or
// a banksia pod. The carve is data only: one canvas, and the
// motif is a clay coloured stroke path drawn over the glaze
// ground each frame. A tap re-carves a tile with the next
// motif in the cycle, revealed along the stroke like a dash.
// One corner tile is cracked and re-glued with a gold seam.
// Idle, the crackle grows by one segment every twenty
// seconds, walking a fixed seeded rotation through the tiles.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CLAY = '#B4714B', WHITE = '#F0EDE6', CELADON = '#9DBEA3', AMBER = '#D9A441';
var DARK = '#2E2620', TIMBER = '#2A241E', GOLD = '#C9A227';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 2.0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function mulberry(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- motif vocabulary -------------------------------------------
// Each motif is a list of stroke polylines in local tile
// coords, centred on 0,0 and spanning roughly 110 px.
function arcPts(cx, cy, rx, ry, rot, a0, a1, n, closed) {
  var pts = [], i, a, x, y;
  for (i = 0; i <= n; i++) {
    a = a0 + (a1 - a0) * (i / n);
    x = Math.cos(a) * rx; y = Math.sin(a) * ry;
    pts.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]);
  }
  if (closed) pts.push(pts[0].slice());
  return pts;
}
function buildFlower() {
  var s = [], k, ang, pcx, pcy;
  s.push([[-2, 54], [2, 28], [-2, 4]]);
  s.push(arcPts(-19, 30, 16, 7, -0.5, 0, Math.PI * 2, 12, true));
  s.push(arcPts(18, 16, 15, 7, 0.5, 0, Math.PI * 2, 12, true));
  for (k = 0; k < 5; k++) {
    ang = -Math.PI / 2 + k * (Math.PI * 2 / 5);
    pcx = Math.cos(ang) * 25; pcy = -24 + Math.sin(ang) * 25;
    s.push(arcPts(pcx, pcy, 9, 17, ang + Math.PI / 2, 0, Math.PI * 2, 14, true));
  }
  s.push(arcPts(0, -24, 10, 10, 0, 0, Math.PI * 2, 14, true));
  return s;
}
function buildBird() {
  var s = [];
  s.push(arcPts(-6, 6, 38, 26, -0.15, Math.PI * 0.1, Math.PI * 1.95, 22, false));
  s.push(arcPts(28, -22, 16, 16, 0, 0, Math.PI * 2, 16, true));
  s.push([[42, -27], [59, -20], [42, -13], [42, -27]]);
  s.push(arcPts(32, -26, 2.6, 2.6, 0, 0, Math.PI * 2, 8, true));
  s.push(arcPts(-9, 3, 20, 12, -0.35, Math.PI * 0.15, Math.PI * 1.6, 14, false));
  s.push([[-40, -6], [-57, -18]]);
  s.push([[-41, 5], [-58, 1]]);
  s.push([[-57, -18], [-58, 1]]);
  s.push([[-4, 30], [-4, 49], [-12, 49]]);
  s.push([[12, 28], [12, 49], [4, 49]]);
  return s;
}
function buildSkull() {
  var s = [], top = arcPts(0, -10, 34, 30, 0, Math.PI, Math.PI * 2, 20, false), outline = [], i;
  for (i = 0; i < top.length; i++) outline.push(top[i]);
  outline.push([28, 14]); outline.push([20, 38]); outline.push([-20, 38]); outline.push([-28, 14]);
  outline.push(outline[0].slice());
  s.push(outline);
  s.push(arcPts(-15, -8, 9, 11, 0, 0, Math.PI * 2, 14, true));
  s.push(arcPts(15, -8, 9, 11, 0, 0, Math.PI * 2, 14, true));
  s.push([[0, 3], [-6, 16], [6, 16], [0, 3]]);
  s.push([[-20, 27], [20, 27]]);
  s.push([[-12, 27], [-12, 38]]);
  s.push([[0, 27], [0, 38]]);
  s.push([[12, 27], [12, 38]]);
  return s;
}
function buildPod() {
  var s = [], y, hw, row, j, pts;
  s.push(arcPts(0, -6, 24, 46, 0, 0, Math.PI * 2, 26, true));
  for (y = -38; y <= 26; y += 12) {
    hw = 24 * Math.sqrt(Math.max(0.05, 1 - Math.pow((y + 6) / 46, 2))) * 0.84;
    pts = [];
    for (j = 0; j <= 4; j++) pts.push([-hw + (2 * hw) * (j / 4), y + (j % 2 === 0 ? -3.4 : 3.4)]);
    s.push(pts);
  }
  s.push([[0, 40], [-2, 54]]);
  return s;
}
var VOCAB = ['flower', 'bird', 'skull', 'banksia pod'];
if (VOCAB.length !== 4) throw new Error('Tile Trial Grid needs exactly 4 motifs');
var MOTIFS = [buildFlower(), buildBird(), buildSkull(), buildPod()];
if (MOTIFS.length !== 4) throw new Error('Tile Trial Grid needs exactly 4 motif paths');

// ---- tiles ---------------------------------------------------------
var COLS = 5, ROWS = 4, TILE_W = 208, TILE_H = 168, GROUT = 9;
var GRID_W = COLS * TILE_W + (COLS - 1) * GROUT;
var GRID_H = ROWS * TILE_H + (ROWS - 1) * GROUT;
var GRID_X = (DW - GRID_W) / 2, GRID_Y = (DH - GRID_H) / 2;
var GROUNDS = [];
(function () {
  var i;
  for (i = 0; i < 20; i++) GROUNDS.push(WHITE);
  GROUNDS[2] = CELADON; GROUNDS[6] = CELADON; GROUNDS[11] = CELADON; GROUNDS[17] = CELADON;
  GROUNDS[4] = AMBER; GROUNDS[7] = AMBER; GROUNDS[13] = AMBER; GROUNDS[18] = AMBER;
})();
var START_MOTIFS = [0, 1, 2, 3, 1, 3, 0, 2, 2, 0, 3, 1, 3, 2, 1, 0, 1, 0, 3, 2];
var CRACKED_TILE = 0;
var TILES = [];
(function () {
  var idx, r, c, rng, j;
  for (idx = 0; idx < ROWS * COLS; idx++) {
    r = Math.floor(idx / COLS); c = idx % COLS;
    rng = mulberry(30400 + idx * 137);
    // handmade wobble: every corner and edge point is pushed
    // by 2 to 4 px on both axes, in a fixed seeded direction
    var pts = [], base = [
      [0, 0], [TILE_W / 2, 0], [TILE_W, 0], [TILE_W, TILE_H / 2],
      [TILE_W, TILE_H], [TILE_W / 2, TILE_H], [0, TILE_H], [0, TILE_H / 2]
    ];
    for (j = 0; j < base.length; j++) {
      var mx = 2 + rng() * 2, my = 2 + rng() * 2;
      pts.push([base[j][0] + (rng() < 0.5 ? -mx : mx), base[j][1] + (rng() < 0.5 ? -my : my)]);
    }
    // crackle: a jittered mesh inside the tile, voronoi style
    var crng = mulberry(77000 + idx * 311), mesh = [], gx, gy, grid = [];
    for (gy = 0; gy < 4; gy++) {
      grid.push([]);
      for (gx = 0; gx < 5; gx++) {
        grid[gy].push([18 + gx * (TILE_W - 36) / 4 + (crng() - 0.5) * 16,
                       16 + gy * (TILE_H - 32) / 3 + (crng() - 0.5) * 14]);
      }
    }
    for (gy = 0; gy < 4; gy++) for (gx = 0; gx < 4; gx++) mesh.push([grid[gy][gx], grid[gy][gx + 1]]);
    for (gy = 0; gy < 3; gy++) for (gx = 0; gx < 5; gx++) mesh.push([grid[gy][gx], grid[gy + 1][gx]]);
    // idle crack extensions: six pre authored segments per tile
    var erng = mulberry(55000 + idx * 719), extra = [], e, ex, ey, ea;
    for (e = 0; e < 6; e++) {
      ex = 24 + erng() * (TILE_W - 48); ey = 22 + erng() * (TILE_H - 44); ea = erng() * Math.PI * 2;
      extra.push([[ex, ey],
                  [ex + Math.cos(ea) * 20, ey + Math.sin(ea) * 15],
                  [ex + Math.cos(ea + 0.7) * 36, ey + Math.sin(ea + 0.7) * 27]]);
    }
    TILES.push({
      idx: idx,
      x: GRID_X + c * (TILE_W + GROUT), y: GRID_Y + r * (TILE_H + GROUT),
      pts: pts, ground: GROUNDS[idx], mesh: mesh, extraSegs: extra, extra: 0,
      motif: START_MOTIFS[idx], animStart: -10, cracked: idx === CRACKED_TILE
    });
  }
})();
if (TILES.length !== 20) throw new Error('Tile Trial Grid needs exactly 20 tiles');
var crackedCount = 0, ti;
for (ti = 0; ti < TILES.length; ti++) if (TILES[ti].cracked) crackedCount++;
if (crackedCount !== 1) throw new Error('Tile Trial Grid needs exactly one gold seamed tile');
if (!(CRACKED_TILE === 0 || CRACKED_TILE === 4 || CRACKED_TILE === 15 || CRACKED_TILE === 19)) {
  throw new Error('The gold seamed tile must sit at a corner');
}
// seeded rotation for idle crack growth: a fixed shuffle
var CRACK_ROTATION = (function () {
  var arr = [], i, rng = mulberry(20261111), tmp, j;
  for (i = 0; i < 20; i++) arr.push(i);
  for (i = arr.length - 1; i > 0; i--) {
    j = Math.floor(rng() * (i + 1)); tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
})();
if (CRACK_ROTATION.length !== 20) throw new Error('Crack rotation needs 20 tiles');
var lastBeat = 0;

// ---- pan ------------------------------------------------------------
var panX = 0, panY = 0, panTX = 0, panTY = 0;

function tilePath(t) {
  var p = t.pts, i;
  ctx.beginPath();
  ctx.moveTo(t.x + p[0][0], t.y + p[0][1]);
  for (i = 1; i < p.length; i++) ctx.lineTo(t.x + p[i][0], t.y + p[i][1]);
  ctx.closePath();
}
function strokeReveal(strokes, reveal, cx, cy, underW, topW) {
  // total stroke length first, then spend the reveal budget
  var total = 0, i, j, a, b, d;
  for (i = 0; i < strokes.length; i++) for (j = 1; j < strokes[i].length; j++) {
    a = strokes[i][j - 1]; b = strokes[i][j];
    total += Math.sqrt((b[0] - a[0]) * (b[0] - a[0]) + (b[1] - a[1]) * (b[1] - a[1]));
  }
  var passes = [[DARK, underW], [CLAY, topW]], pi;
  for (pi = 0; pi < passes.length; pi++) {
    var budget = total * reveal;
    ctx.strokeStyle = passes[pi][0]; ctx.lineWidth = passes[pi][1];
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (i = 0; i < strokes.length && budget > 0; i++) {
      ctx.beginPath();
      var started = false;
      for (j = 1; j < strokes[i].length && budget > 0; j++) {
        a = strokes[i][j - 1]; b = strokes[i][j];
        d = Math.sqrt((b[0] - a[0]) * (b[0] - a[0]) + (b[1] - a[1]) * (b[1] - a[1]));
        if (!started) { ctx.moveTo(cx + a[0], cy + a[1]); started = true; }
        if (d <= budget) { ctx.lineTo(cx + b[0], cy + b[1]); budget -= d; }
        else {
          var f = d > 0 ? budget / d : 0;
          ctx.lineTo(cx + a[0] + (b[0] - a[0]) * f, cy + a[1] + (b[1] - a[1]) * f);
          budget = 0;
        }
      }
      if (started) ctx.stroke();
    }
  }
  ctx.setLineDash([]);
}
function drawTile(t) {
  tilePath(t);
  ctx.fillStyle = t.ground; ctx.fill();
  ctx.save();
  tilePath(t); ctx.clip();
  // crackle mesh, fully drawn from frame one
  ctx.strokeStyle = DARK; ctx.globalAlpha = 0.30; ctx.lineWidth = 1.1; ctx.lineCap = 'round';
  var i;
  ctx.beginPath();
  for (i = 0; i < t.mesh.length; i++) {
    ctx.moveTo(t.x + t.mesh[i][0][0], t.y + t.mesh[i][0][1]);
    ctx.lineTo(t.x + t.mesh[i][1][0], t.y + t.mesh[i][1][1]);
  }
  ctx.stroke();
  // grown cracks, one segment per twenty second beat in rotation
  ctx.globalAlpha = 0.55; ctx.lineWidth = 1.4;
  for (i = 0; i < t.extra; i++) {
    var seg = t.extraSegs[i];
    ctx.beginPath();
    ctx.moveTo(t.x + seg[0][0], t.y + seg[0][1]);
    ctx.lineTo(t.x + seg[1][0], t.y + seg[1][1]);
    ctx.lineTo(t.x + seg[2][0], t.y + seg[2][1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // the carved motif, revealed along its stroke while re-carving
  var reveal = clamp((T - t.animStart) / 1.15, 0, 1);
  strokeReveal(MOTIFS[t.motif], reveal, t.x + TILE_W / 2, t.y + TILE_H / 2, 11, 7.5);
  ctx.restore();
  // hairline grout edge
  tilePath(t);
  ctx.strokeStyle = DARK; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  if (t.cracked) {
    // gold seam: a jagged mend running corner to corner,
    // with one short branch, in gold and nothing else
    var seam = [[6, 4], [48, 34], [76, 30], [104, 62], [132, 58], [164, 92], [202, 128]];
    ctx.strokeStyle = GOLD; ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (i = 0; i < seam.length; i++) {
      if (i === 0) ctx.moveTo(t.x + seam[i][0], t.y + seam[i][1]);
      else ctx.lineTo(t.x + seam[i][0], t.y + seam[i][1]);
    }
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(t.x + 104, t.y + 62); ctx.lineTo(t.x + 118, t.y + 96); ctx.lineTo(t.x + 108, t.y + 124);
    ctx.stroke();
  }
}
function draw() {
  ctx.fillStyle = TIMBER;
  ctx.fillRect(0, 0, DW, DH);
  // faint timber plank lines on the ground, in carved dark
  ctx.strokeStyle = DARK; ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
  var y;
  for (y = 150; y < DH; y += 150) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(DW, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.translate(panX, panY);
  var i;
  for (i = 0; i < TILES.length; i++) drawTile(TILES[i]);
  ctx.restore();
}
function step() {
  // idle crack growth: one tile per twenty second beat,
  // stepping through the fixed seeded rotation
  var beat = Math.floor(T / 20), b;
  if (beat > lastBeat) {
    for (b = lastBeat + 1; b <= beat; b++) {
      var t = TILES[CRACK_ROTATION[b % 20]];
      if (t.extra < t.extraSegs.length) t.extra++;
    }
    lastBeat = beat;
  }
  // pan eases toward its target, and home again on release
  panX += (panTX - panX) * 0.14;
  panY += (panTY - panY) * 0.14;
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
var dragging = false, downX = 0, downY = 0, startPanX = 0, startPanY = 0, moved = 0;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true; moved = 0;
  downX = p[0]; downY = p[1]; startPanX = panTX; startPanY = panTY;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dx = p[0] - downX, dy = p[1] - downY;
  moved = Math.max(moved, Math.sqrt(dx * dx + dy * dy));
  if (moved > 7) {
    panTX = clamp(startPanX + dx, -28, 28);
    panTY = clamp(startPanY + dy, -28, 28);
  }
});
canvas.addEventListener('pointerup', function (e) {
  if (!dragging) return;
  dragging = false;
  var wasTap = moved <= 7;
  panTX = 0; panTY = 0;
  if (!wasTap) return;
  var p = toDesign(e), hx = p[0] - panX, hy = p[1] - panY, i, t;
  for (i = 0; i < TILES.length; i++) {
    t = TILES[i];
    if (hx >= t.x && hx <= t.x + TILE_W && hy >= t.y && hy <= t.y + TILE_H) {
      // re-carve with the next motif in the cycle, never random
      t.motif = (t.motif + 1) % VOCAB.length;
      t.animStart = T;
      break;
    }
  }
});
canvas.addEventListener('pointercancel', function () {
  dragging = false; panTX = 0; panTY = 0;
});

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = TIMBER;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
