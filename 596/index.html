<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Inesperadamente</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #FAF7F0; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.596 "Inesperadamente" — EXPANSION #72 clara-lagos, block 4 "La Segunda Parte".
   Comic-to-reality bridge: two ink panels, then the strip walks into lived
   life — two still panels, procedurally drawn flat-color stand-ins for the
   photographs (the gallery renders stills in-canvas; no external images).
   The phase boundary is a hard cut, never a dissolve. In the still phase
   nothing moves and drag does nothing; only the butterfly may fly, on tap. */

var INK = '#1A1A1A', PAPER = '#FAF7F0', BLUE = '#3E6FA8';
var SLIP = '#F3EEE1', SLIP_EDGE = '#B9B3A4', SHADOW = '#DDD8CC', TAPE = '#EFE8D2';
var HINT = '#9A958A';
var STILL_BG = '#EAE7D9', STILL_EDGE = '#8B8578';
var GREEN = '#4A6741', GREEN_L = '#7A9A63', GREEN_XL = '#97B47E';
var BAG = '#F2F0EA', SOIL = '#6B4A2F', BOTTLE = 'rgba(150,170,180,0.45)';

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- seeded RNG ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- viewport ---------- */
var vw = 300, vh = 300, dpr = 1;
function isPhone(){
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0) return mn < 700;
  return vh > vw * 1.15;
}
function resize(){
  var vv = window.visualViewport;
  vw = vv ? vv.width : window.innerWidth;
  vh = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);
resize();

var HAND = '"Segoe Print","Bradley Hand","Comic Sans MS",cursive';

/* ---------- layout (stage coords 0..1000) ---------- */
var PW = 200, PH = 560, PY = 220;
var PANEL_X = [31, 245, 555, 769];      /* zone 445..555 carries the marker */
var MARK_X = 500;

/* ---------- state ---------- */
var PHASE0 = 0;
var revealed = 1;                       /* panel 1 open at load; slips over 2..4 */
var wob = [0, 0, 0, 0];                 /* per-panel vegetation wobble (drawn phase) */
var flyStart = -1e9;                    /* elapsed ms the butterfly took off; past = settled */
var FLY_MS = 1800;
var PERCH = [PANEL_X[3] + 168, PY + 118];   /* butterfly's stem-top, stage coords */

/* ---------- small helpers ---------- */
function wobblyRectPath(x, y, w, h, seed, amt){
  var rng = mulberry32(seed), pts = [], i, t;
  var seg = 6;
  for (i = 0; i <= seg; i++){ t = i / seg; pts.push([x + w * t, y + (rng() - 0.5) * amt]); }
  for (i = 1; i <= seg; i++){ t = i / seg; pts.push([x + w + (rng() - 0.5) * amt, y + h * t]); }
  for (i = 1; i <= seg; i++){ t = i / seg; pts.push([x + w - w * t, y + h + (rng() - 0.5) * amt]); }
  for (i = 1; i < seg; i++){ t = i / seg; pts.push([x + (rng() - 0.5) * amt, y + h - h * t]); }
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
function line(x1, y1, x2, y2, w, c){
  ctx.strokeStyle = c || INK; ctx.lineWidth = w || 3;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function circ(x, y, r, w, c, fill){
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill){ ctx.fillStyle = c || INK; ctx.fill(); }
  else { ctx.strokeStyle = c || INK; ctx.lineWidth = w || 3; ctx.stroke(); }
}
function handText(txt, x, y, size, color, align, rot){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.font = size + 'px ' + HAND;
  ctx.fillStyle = color || INK;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, 0, 0);
  ctx.restore();
}
function bubble(x, y, w, h, tailX, tailY, lines, size){
  ctx.save();
  ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
  wobblyRectPath(x, y, w, h, 596900 + x, 2.5); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(tailX - 9, tailY - 2); ctx.lineTo(tailX + 9, tailY - 2); ctx.lineTo(tailX + 16, tailY + 42);
  ctx.closePath(); ctx.fillStyle = PAPER; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(tailX - 9, tailY - 2); ctx.lineTo(tailX + 16, tailY + 42); ctx.lineTo(tailX + 9, tailY - 2); ctx.stroke();
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = size + 'px ' + HAND;
  var lh = size * 1.25, y0 = y + h / 2 - (lines.length - 1) * lh / 2;
  for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], x + w / 2, y0 + i * lh);
  ctx.restore();
}
function leaf(x, y, ang, len, wid, c){
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.ellipse(len / 2, 0, len / 2, wid, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function seedling(cx, baseY, topY, seed, big){
  var rng = mulberry32(seed);
  var lean = (rng() - 0.5) * 26;
  var tx = cx + lean;
  ctx.strokeStyle = GREEN; ctx.lineWidth = big ? 4 : 3.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, baseY);
  ctx.quadraticCurveTo(cx + lean * 0.3, (baseY + topY) / 2, tx, topY);
  ctx.stroke();
  var n = big ? 6 : 5, i, t, px, py, cols = [GREEN, GREEN_L, GREEN_XL];
  for (i = 0; i < n; i++){
    t = 0.3 + 0.68 * (i / Math.max(1, n - 1));
    px = cx + lean * t * t; py = baseY + (topY - baseY) * t;
    leaf(px, py, (i % 2 ? -0.7 : 0.7 + Math.PI) + (rng() - 0.5) * 0.3, (big ? 34 : 27) * (0.8 + rng() * 0.4), big ? 10 : 8, cols[i % 3]);
  }
  leaf(tx, topY, -Math.PI / 2 + (rng() - 0.5) * 0.4, big ? 30 : 24, big ? 9 : 7.5, GREEN_L);
}

/* ---------- drawn phase: panel 1 ---------- */
function drawPanel1(elapsed){
  /* door, right side */
  ctx.strokeStyle = INK; ctx.lineWidth = 3.4;
  wobblyRectPath(130, 96, 66, 376, 596101, 3); ctx.stroke();
  ctx.lineWidth = 2.2;
  wobblyRectPath(140, 116, 46, 150, 596102, 2.4); ctx.stroke();
  wobblyRectPath(140, 292, 46, 150, 596103, 2.4); ctx.stroke();
  circ(136, 284, 4.4, 0, INK, true);
  /* ground */
  line(6, 472, 194, 472, 2.4);
  /* the berry bush — wobbles when dragged */
  ctx.save();
  ctx.translate(46, 452); ctx.rotate(wob[0] * 0.07 * Math.sin(elapsed * 0.02));
  ctx.translate(-46, -452);
  var rng = mulberry32(596110), i, a;
  ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
  for (i = 0; i < 5; i++){
    a = -Math.PI * 0.85 + i * 0.42;
    ctx.beginPath(); ctx.moveTo(46, 458);
    ctx.quadraticCurveTo(46 + Math.cos(a) * 22, 452 + Math.sin(a) * 22, 46 + Math.cos(a) * 34, 446 + Math.sin(a) * 32);
    ctx.stroke();
  }
  for (i = 0; i < 7; i++) circ(24 + rng() * 46, 420 + rng() * 26, 4.6, 0, INK, true);
  for (i = 0; i < 4; i++) circ(28 + rng() * 40, 428 + rng() * 20, 9, 2, INK, false);
  ctx.restore();
  /* the woman, kneeling, reaching */
  ctx.strokeStyle = INK; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(74, 226); ctx.quadraticCurveTo(88, 300, 94, 378); ctx.stroke();   /* back */
  ctx.beginPath(); ctx.moveTo(56, 228); ctx.quadraticCurveTo(48, 300, 50, 372); ctx.stroke();  /* front */
  /* apron — the one blue thing */
  ctx.fillStyle = BLUE;
  ctx.beginPath(); ctx.moveTo(52, 292); ctx.lineTo(90, 292); ctx.lineTo(96, 384); ctx.lineTo(50, 384); ctx.closePath(); ctx.fill();
  line(58, 292, 60, 262, 2.2); line(84, 292, 82, 262, 2.2);                                     /* apron straps */
  /* kneeling skirt to the ground */
  ctx.beginPath(); ctx.moveTo(50, 380); ctx.quadraticCurveTo(34, 430, 26, 470); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(96, 380); ctx.quadraticCurveTo(112, 428, 122, 470); ctx.stroke();
  line(26, 470, 122, 470, 3);
  line(70, 442, 108, 442, 2.2);                                                                  /* folded leg hint */
  /* reaching arm, down to the bush */
  ctx.beginPath(); ctx.moveTo(58, 252); ctx.quadraticCurveTo(40, 330, 42, 408); ctx.stroke();
  circ(43, 414, 3.4, 0, INK, true);
  /* resting arm */
  ctx.beginPath(); ctx.moveTo(86, 254); ctx.quadraticCurveTo(106, 320, 100, 386); ctx.stroke();
  /* head + bun */
  circ(66, 205, 20, 3.2, INK, false);
  circ(83, 189, 7.5, 2.6, INK, false);
  circ(59, 202, 1.9, 0, INK, true); circ(71, 202, 1.9, 0, INK, true);
  ctx.beginPath(); ctx.arc(65, 208, 5.5, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();           /* little smile of discovery */
  /* bubble */
  bubble(6, 14, 152, 58, 58, 70, ['¡Un tesoro!'], 21);
}

/* ---------- drawn phase: panel 2 ---------- */
function jar(x, sillY, w, h, ribbon, seed){
  var top = sillY - h;
  ctx.strokeStyle = INK; ctx.lineWidth = 2.8;
  wobblyRectPath(x, top + 10, w, h - 10, seed, 2); ctx.stroke();
  ctx.fillStyle = PAPER; ctx.fillRect(x - 3, top, w + 6, 12);
  ctx.strokeStyle = INK; wobblyRectPath(x - 3, top, w + 6, 12, seed + 7, 1.6); ctx.stroke();
  /* soil, bottom of the jar, wavy top edge */
  var rng = mulberry32(seed + 31), sy = sillY - 30;
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.moveTo(x + 3, sillY - 2);
  ctx.lineTo(x + 3, sy + (rng() - 0.5) * 5);
  ctx.quadraticCurveTo(x + w * 0.35, sy - 6 + rng() * 5, x + w * 0.62, sy + (rng() - 0.5) * 5);
  ctx.quadraticCurveTo(x + w * 0.85, sy + 5, x + w - 3, sy - 3);
  ctx.lineTo(x + w - 3, sillY - 2); ctx.closePath(); ctx.fill();
  /* the seeds, pale against the soil */
  var i; ctx.fillStyle = PAPER;
  for (i = 0; i < 4; i++){ ctx.beginPath(); ctx.ellipse(x + 9 + rng() * (w - 18), sillY - 10 - rng() * 14, 3.4, 2.2, rng(), 0, Math.PI * 2); ctx.fill(); }
  if (ribbon){
    ctx.fillStyle = BLUE; ctx.fillRect(x + 1, top + h * 0.44, w - 2, 13);
    ctx.beginPath(); ctx.moveTo(x + w / 2, top + h * 0.44 + 6); ctx.lineTo(x + w / 2 - 9, top + h * 0.44 - 3); ctx.lineTo(x + w / 2 - 7, top + h * 0.44 + 15); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + w / 2, top + h * 0.44 + 6); ctx.lineTo(x + w / 2 + 9, top + h * 0.44 - 3); ctx.lineTo(x + w / 2 + 7, top + h * 0.44 + 15); ctx.closePath(); ctx.fill();
  }
}
function drawPanel2(){
  /* window */
  ctx.strokeStyle = INK; ctx.lineWidth = 3.2;
  wobblyRectPath(24, 84, 154, 246, 596201, 2.6); ctx.stroke();
  ctx.lineWidth = 2.2;
  line(101, 84, 101, 330, 2.2); line(24, 207, 178, 207, 2.2);
  line(30, 196, 62, 120, 1.6); line(48, 200, 76, 132, 1.6);        /* daylight strokes in one pane */
  /* sill */
  line(8, 340, 196, 340, 5); line(20, 340, 20, 356, 3); line(182, 340, 182, 356, 3);
  /* the jars — they wobble a touch when dragged */
  ctx.save();
  ctx.translate(101, 340); ctx.rotate(wob[1] * 0.02 * Math.sin(performance0() * 0.02));
  ctx.translate(-101, -340);
  jar(28, 340, 44, 96, false, 596210);
  jar(80, 340, 48, 108, true, 596220);
  jar(136, 340, 44, 92, false, 596230);
  ctx.restore();
  /* floor + a watering can, waiting */
  line(6, 500, 194, 500, 2.4);
  ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
  wobblyRectPath(70, 452, 56, 46, 596240, 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(70, 462); ctx.lineTo(46, 448); ctx.stroke();
  ctx.beginPath(); ctx.arc(98, 452, 14, Math.PI, Math.PI * 2); ctx.stroke();
  bubble(4, 8, 192, 62, 96, 68, ['Las pongo acá', 'a ver qué pasa.'], 18);
}
/* elapsed accessor that stays 0 in the headless renderer */
function performance0(){ return animT; }

/* ---------- still phase: panel 3 (milk bags) ---------- */
function milkBag(x, w, seed){
  var top = 336, bot = 480;
  var rng = mulberry32(seed);
  /* soil first, inside the opening */
  ctx.fillStyle = SOIL;
  ctx.beginPath(); ctx.ellipse(x + w / 2, top + 6, w / 2 - 5, 9, 0, 0, Math.PI * 2); ctx.fill();
  /* bag body */
  ctx.fillStyle = BAG;
  ctx.beginPath();
  ctx.moveTo(x + 4, top + 4);
  ctx.lineTo(x + w - 4, top + 4);
  ctx.lineTo(x + w - 9, bot - 8);
  ctx.quadraticCurveTo(x + w - 8, bot, x + w - 16, bot);
  ctx.lineTo(x + 14, bot);
  ctx.quadraticCurveTo(x + 5, bot, x + 6, bot - 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = STILL_EDGE; ctx.lineWidth = 1.8; ctx.stroke();
  /* folded-over top */
  ctx.beginPath();
  var fx = x + 2;
  ctx.moveTo(fx, top + 4);
  while (fx < x + w - 8){ fx += 9; ctx.lineTo(fx, top - 3 + rng() * 4); fx += 9; ctx.lineTo(fx, top + 4); }
  ctx.strokeStyle = STILL_EDGE; ctx.stroke();
  /* a crease or two */
  line(x + w * 0.3, top + 40, x + w * 0.26, bot - 30, 1.2, '#D8D4C8');
  line(x + w * 0.72, top + 30, x + w * 0.78, bot - 44, 1.2, '#D8D4C8');
}
function drawPanel3(){
  /* quiet daylight, flat: wall and table */
  ctx.fillStyle = STILL_BG; ctx.fillRect(0, 0, PW, PH);
  ctx.fillStyle = '#EFEAD8'; ctx.fillRect(0, 0, PW, 330);
  ctx.fillStyle = '#C9B99A'; ctx.fillRect(0, 330, PW, 8);
  ctx.fillStyle = '#B7A888'; ctx.fillRect(0, 338, PW, PH - 338);
  circ(168, 62, 24, 0, '#EFE3B0', true);                       /* pale sun, high and quiet */
  /* seedlings, grown — drawn from fixed seeds, identical every frame */
  seedling(42, 340, 190, 596310, true);
  seedling(101, 340, 158, 596320, true);
  seedling(162, 340, 205, 596330, false);
  milkBag(12, 58, 596340);
  milkBag(72, 58, 596350);
  milkBag(132, 58, 596360);
}

/* ---------- still phase: panel 4 (bottles + butterfly) ---------- */
function bottle(x, w, botY, seed){
  var top = botY - 128, rng = mulberry32(seed);
  /* soil inside */
  ctx.fillStyle = SOIL; ctx.fillRect(x + 5, botY - 42, w - 10, 38);
  /* body, translucent */
  ctx.fillStyle = BOTTLE;
  ctx.beginPath();
  ctx.moveTo(x + 3, top + 12);
  ctx.lineTo(x + w - 3, top + 12);
  ctx.lineTo(x + w - 2, botY - 10);
  ctx.quadraticCurveTo(x + w - 2, botY, x + w - 12, botY);
  ctx.lineTo(x + 12, botY);
  ctx.quadraticCurveTo(x + 2, botY, x + 2, botY - 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(110,125,132,0.8)'; ctx.lineWidth = 1.8; ctx.stroke();
  /* the cut edge, jagged */
  ctx.beginPath();
  var jx = x + 3; ctx.moveTo(jx, top + 12);
  while (jx < x + w - 10){ jx += 8; ctx.lineTo(jx, top + 4 + rng() * 6); jx += 8; ctx.lineTo(jx, top + 12); }
  ctx.stroke();
  /* label scar */
  ctx.fillStyle = 'rgba(242,240,234,0.5)'; ctx.fillRect(x + 8, botY - 96, w - 16, 34);
}
function butterflyAt(x, y, flap){
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = INK;
  /* wings: ink with the soft-blue band */
  var s = Math.sin(flap), i;
  for (i = -1; i <= 1; i += 2){
    ctx.save(); ctx.scale(i, 1); ctx.rotate(-0.25 - s * 0.45);
    ctx.beginPath(); ctx.ellipse(13, -2, 14, 7.5, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.ellipse(13, -2, 8.5, 4.6, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.ellipse(10, 6, 9, 5, 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.ellipse(0, 1, 3, 8.5, 0, 0, Math.PI * 2); ctx.fill();   /* body */
  ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-1, -6); ctx.quadraticCurveTo(-6, -13, -10, -14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1, -6); ctx.quadraticCurveTo(6, -13, 10, -14); ctx.stroke();
  ctx.restore();
}
function butterflyPos(elapsed){
  if (elapsed - flyStart < FLY_MS && flyStart > -1e8){
    var s = (elapsed - flyStart) / FLY_MS, th = s * Math.PI * 2;
    return [PERCH[0] + 42 * Math.sin(th), PERCH[1] - 42 * (1 - Math.cos(th)), Math.sin(elapsed * 0.09) * 0.9];
  }
  return [PERCH[0], PERCH[1], 0.6];
}
function drawPanel4(elapsed){
  ctx.fillStyle = STILL_BG; ctx.fillRect(0, 0, PW, PH);
  ctx.fillStyle = '#EFEAD8'; ctx.fillRect(0, 0, PW, 330);
  ctx.fillStyle = '#C9B99A'; ctx.fillRect(0, 330, PW, 8);
  ctx.fillStyle = '#B7A888'; ctx.fillRect(0, 338, PW, PH - 338);
  /* the tall stem the butterfly keeps */
  seedling(168, 478, 140, 596410, false);
  /* bottle seedlings */
  seedling(58, 436, 268, 596420, false);
  seedling(128, 452, 300, 596430, false);
  bottle(28, 62, 478, 596440);
  bottle(98, 62, 478, 596450);
  /* butterfly — settled, unless tapped into its one flight */
  var bp = butterflyPos(elapsed);
  ctx.save();
  ctx.translate(-PANEL_X[3], -PY);   /* butterflyPos works in stage coords */
  butterflyAt(bp[0], bp[1], bp[2]);
  ctx.restore();
}

/* ---------- slips & marker ---------- */
function slip(idx){
  var x = PANEL_X[idx] - 6, y = PY - 6, w = PW + 12, h = PH + 12;
  ctx.fillStyle = SHADOW; ctx.fillRect(x + 7, y + 9, w, h);
  ctx.fillStyle = SLIP; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = SLIP_EDGE; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  ctx.save();
  ctx.translate(x + w / 2, y + 4); ctx.rotate(-0.02);
  ctx.globalAlpha = 0.8; ctx.fillStyle = TAPE; ctx.fillRect(-36, -8, 72, 17);
  ctx.restore(); ctx.globalAlpha = 1;
  handText(String(idx + 1), x + w / 2, y + h / 2, 88, INK, 'center', (idx % 2 ? 0.03 : -0.03));
  ctx.globalAlpha = 0.55;
  handText('...', x + w / 2, y + h / 2 + 62, 30, INK, 'center', 0);
  ctx.globalAlpha = 1;
}
function marker(){
  ctx.save();
  ctx.translate(MARK_X, PY + PH / 2); ctx.rotate(-0.05);
  ctx.font = '19px ' + HAND; ctx.fillStyle = INK;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('segunda', 0, -13);
  ctx.fillText('parte...', 0, 13);
  ctx.restore();
}

/* ---------- panels ---------- */
function panelFrame(idx, still){
  var x = PANEL_X[idx];
  ctx.save();
  ctx.translate(x, PY);
  ctx.beginPath(); ctx.rect(0, 0, PW, PH); ctx.clip();
  if (idx === 0) drawPanel1(animT);
  else if (idx === 1) drawPanel2();
  else if (idx === 2) drawPanel3();
  else drawPanel4(animT);
  ctx.restore();
  if (still){ ctx.strokeStyle = STILL_EDGE; ctx.lineWidth = 2.4; ctx.strokeRect(x, PY, PW, PH); }
  else { ctx.strokeStyle = INK; ctx.lineWidth = 3.4; wobblyRectPath(x, PY, PW, PH, 596500 + idx * 13, 3); ctx.stroke(); }
}

/* ---------- main draw ---------- */
var animT = 0;
function draw(now){
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, vw, vh);
  var scale = Math.min(vw, vh) / 1000;
  var ox = (vw - 1000 * scale) / 2, oy = (vh - 1000 * scale) / 2;
  ctx.translate(ox, oy); ctx.scale(scale, scale);
  animT = now;
  var i;
  for (i = 0; i < 4; i++){
    if (i < revealed){
      if (i < 2){
        /* drawn phase breathes, faintly */
        ctx.save();
        var cx = PANEL_X[i] + PW / 2, cy = PY + PH / 2;
        var b = 1 + 0.004 * Math.sin(now * 0.0011 + i * 1.7);
        ctx.translate(cx, cy); ctx.scale(b, b); ctx.translate(-cx, -cy);
        panelFrame(i, false);
        ctx.restore();
      } else {
        panelFrame(i, true);   /* still phase: no transform, no motion */
      }
    } else {
      slip(i);
    }
  }
  marker();
  handText('tap', 968, 968, isPhone() ? 24 : 22, HINT, 'right', 0);
}

var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
function frame(){
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() - t0 : PHASE0;
  var i;
  for (i = 0; i < 4; i++) wob[i] *= 0.96;
  draw(PHASE0 + now);
}
draw(PHASE0);   /* synchronous first frame: panel 1 open, slips over 2..4 */
if (typeof requestAnimationFrame === 'function'){
  var loop = function(){ frame(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

/* ---------- interaction ---------- */
function toStage(px, py){
  var scale = Math.min(vw, vh) / 1000;
  return [ (px - (vw - 1000 * scale) / 2) / scale, (py - (vh - 1000 * scale) / 2) / scale ];
}
function nowMs(){ return (typeof performance !== 'undefined' && performance.now) ? performance.now() - t0 : 0; }
var dragging = false, dragMoved = 0, downX = 0, downY = 0, lastX = 0, lastY = 0, downT = 0;
canvas.addEventListener('pointerdown', function(e){
  dragging = true; dragMoved = 0;
  downX = lastX = e.clientX; downY = lastY = e.clientY; downT = nowMs();
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch(_){} }
});
canvas.addEventListener('pointermove', function(e){
  if (!dragging) return;
  var dx = e.clientX - lastX, dy = e.clientY - lastY;
  dragMoved += Math.abs(dx) + Math.abs(dy);
  lastX = e.clientX; lastY = e.clientY;
  var p = toStage(e.clientX, e.clientY);
  /* drag stirs only the drawn phase; the still panels ignore it entirely */
  for (var i = 0; i < 2; i++){
    if (i < revealed && p[0] >= PANEL_X[i] && p[0] <= PANEL_X[i] + PW && p[1] >= PY && p[1] <= PY + PH){
      wob[i] = Math.min(1, wob[i] + (Math.abs(dx) + Math.abs(dy)) * 0.004);
    }
  }
  if (typeof requestAnimationFrame !== 'function') frame();
});
function endPointer(e){
  if (!dragging) return;
  dragging = false;
  var quick = nowMs() - downT < 400;
  if (quick && dragMoved < 14){
    var p = toStage(e.clientX, e.clientY), i, hitButterfly = false;
    if (revealed === 4){
      var bp = butterflyPos(nowMs());
      var ddx = p[0] - bp[0], ddy = p[1] - bp[1];
      if (ddx * ddx + ddy * ddy < 48 * 48) hitButterfly = true;
    }
    if (hitButterfly){
      if (nowMs() - flyStart >= FLY_MS) flyStart = nowMs();   /* one flight, then it resettles */
    } else if (revealed < 4){
      revealed++;                                            /* hard cut to the next panel */
    }
    if (typeof requestAnimationFrame !== 'function') frame();
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ dragging = false; });
</script>
</body>
