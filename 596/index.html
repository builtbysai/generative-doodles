<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point Field Score</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0A0C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a hand-drawn star chart that plays itself. White dots drift across a
   faint indigo and umber wash, and each time one crosses a hairline playhead it
   sounds, a plucked pizzicato in just intonation around A=432Hz, while the few
   red blobs answer with long bowed harmonics. Dragging scatters the field, and
   the notes find their own new order. */
var TAU = Math.PI * 2;
var GROUND = '#0A0A0C';
var CHALK = '#EDEAE0';
var CHALK_HI = '#FFFFFF';
var OXIDE = '#A83C28';
var OXIDE_HI = '#D05A3C';
var INDIGO = '#3A4066';
var UMBER = '#6B5233';
var PLATE = '#101013';
var PLATE_LINE = 'rgba(237,234,224,0.28)';
var TITLE_INK = '#EDEAE0';
var HINT_INK = '#9AA3AD';
var FRAME_T = 60.0;        /* fixed phase: frame one is a pure function of t */
var DOT_COUNT = 220;
var BLOB_COUNT = 7;
var PLAYHEAD_X = 0.618;    /* hairline playhead, fraction of field width */
var BASE_A = 432;          /* just intonation around A=432Hz */
var JI = [1, 9 / 8, 5 / 4, 4 / 3, 3 / 2, 5 / 3, 15 / 8, 2];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var audioCtx = null;
/* ---- seeded field: 220 chalk dots, 7 oxide blobs, analytic drift ---- */
var DOTS = [];
var BLOBS = [];
(function () {
  var rng = mulberry32(1849);
  var i;
  for (i = 0; i < DOT_COUNT; i++) {
    DOTS.push({
      x0: 0.012 + rng() * 0.976,
      y0: 0.02 + rng() * 0.96,
      vx: (rng() - 0.5) * 0.004,   /* slow drift, fraction of width per second */
      vy: (rng() - 0.5) * 0.0016,
      r: 0.0011 + rng() * 0.0022,  /* core radius, fraction of min(VW,VH) */
      ji: Math.floor(rng() * JI.length),
      ph: rng() * TAU,
      per: 6 + rng() * 14,
      sounded: false
    });
  }
  for (i = 0; i < BLOB_COUNT; i++) {
    BLOBS.push({
      x0: 0.06 + rng() * 0.88,
      y0: 0.06 + rng() * 0.88,
      vx: (rng() - 0.5) * 0.0016,
      vy: (rng() - 0.5) * 0.0009,
      r: 0.008 + rng() * 0.009,
      ji: Math.floor(rng() * JI.length),
      ph: rng() * TAU,
      per: 10 + rng() * 16,
      sounded: false
    });
  }
})();
/* drag scatter: radial impulse applied to nearby agents, decays over time */
var scatter = { x: -1, y: -1, mag: 0, t: -100 };
var dragging = false;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The field fills the frame edge to edge on every screen. */
function fieldRect() {
  return { x: 0, y: 0, w: VW, h: VH };
}
/* agent position at time t: analytic drift, wraps at the edges, plus the
   decaying scatter impulse from the last drag */
function agentPos(a, t) {
  var x = a.x0 + a.vx * t;
  x = x - Math.floor(x);
  var y = a.y0 + a.vy * t;
  y = y - Math.floor(y);
  var dt = t - scatter.t;
  if (scatter.mag > 0.001 && dt >= 0 && dt < 6 && scatter.x >= 0) {
    var dx = x - scatter.x, dy = y - scatter.y;
    var d2 = dx * dx + dy * dy;
    var push = scatter.mag * Math.exp(-d2 / 0.02) * Math.exp(-dt / 2.5);
    var d = Math.sqrt(d2) + 0.0001;
    x += (dx / d) * push * 0.05;
    y += (dy / d) * push * 0.05;
  }
  return { x: x, y: y };
}
/* ---- wash and heat: drawn directly each frame so node-canvas QA sees them ----
   The wash is 26 seeded indigo/umber watercolor blobs; the heat is the music's
   memory, 14 seeded pale spots at load plus one spot per note as it sounds. */
var WASH = [];
var HEAT = [];
(function () {
  var rng = mulberry32(1849);
  var i;
  for (i = 0; i < 26; i++) {
    WASH.push({
      x: rng(), y: rng(), r: 0.10 + rng() * 0.22,
      indigo: rng() < 0.55
    });
  }
  for (i = 0; i < 14; i++) {
    HEAT.push({ x: rng(), y: rng(), r: 0.02 + rng() * 0.05, light: true });
  }
})();
function drawWash(sc) {
  var i, w, gx, gy, gr, g;
  var m = Math.min(sc.w, sc.h);
  for (i = 0; i < WASH.length; i++) {
    w = WASH[i];
    gx = sc.x + w.x * sc.w; gy = sc.y + w.y * sc.h; gr = w.r * m;
    g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, rgba(w.indigo ? INDIGO : UMBER, 0.10));
    g.addColorStop(1, rgba(w.indigo ? INDIGO : UMBER, 0));
    ctx.fillStyle = g;
    ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
  }
  for (i = 0; i < HEAT.length; i++) {
    var h = HEAT[i];
    gx = sc.x + h.x * sc.w; gy = sc.y + h.y * sc.h; gr = h.r * m;
    g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, h.light ? 'rgba(237,234,224,0.10)' : 'rgba(208,90,60,0.10)');
    g.addColorStop(1, 'rgba(237,234,224,0)');
    ctx.fillStyle = g;
    ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
  }
}
function addHeat(px, py, r, light) {
  HEAT.push({ x: px / VW, y: py / VH, r: r / Math.min(VW, VH), light: light });
  if (HEAT.length > 220) HEAT.shift();
}
function drawField(sc, t) {
  var i, a, p, px, py, pr, tw, b;
  var m = Math.min(sc.w, sc.h);
  var phx = sc.x + PLAYHEAD_X * sc.w;
  for (i = 0; i < DOTS.length; i++) {
    a = DOTS[i];
    p = agentPos(a, t);
    px = sc.x + p.x * sc.w;
    py = sc.y + p.y * sc.h;
    pr = a.r * m;
    tw = 0.5 + 0.5 * Math.sin(TAU * t / a.per + a.ph);
    b = 0.45 + 0.45 * tw;
    /* a dot near the playhead brightens as it approaches the line */
    var near = 1 - clamp(Math.abs(px - phx) / (m * 0.05), 0, 1);
    b = clamp(b + near * 0.45, 0, 1);
    ctx.fillStyle = rgba(CHALK, 0.10 * b);
    ctx.beginPath();
    ctx.moveTo(px + pr * 3.0, py);
    ctx.arc(px, py, pr * 3.0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = rgba(CHALK_HI, 0.30 + 0.60 * b);
    ctx.beginPath();
    ctx.moveTo(px + pr, py);
    ctx.arc(px, py, pr, 0, TAU);
    ctx.fill();
  }
  for (i = 0; i < BLOBS.length; i++) {
    a = BLOBS[i];
    p = agentPos(a, t);
    px = sc.x + p.x * sc.w;
    py = sc.y + p.y * sc.h;
    pr = a.r * m;
    tw = 0.5 + 0.5 * Math.sin(TAU * t / a.per + a.ph);
    b = 0.55 + 0.35 * tw;
    var nearB = 1 - clamp(Math.abs(px - phx) / (m * 0.08), 0, 1);
    b = clamp(b + nearB * 0.3, 0, 1);
    ctx.fillStyle = rgba(OXIDE, 0.16 * b);
    ctx.beginPath();
    ctx.moveTo(px + pr * 2.2, py);
    ctx.arc(px, py, pr * 2.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = rgba(OXIDE_HI, 0.45 + 0.45 * b);
    ctx.beginPath();
    ctx.moveTo(px + pr, py);
    ctx.arc(px, py, pr, 0, TAU);
    ctx.fill();
  }
  /* the playhead: a hairline the eye must find, never a glowing bar */
  ctx.strokeStyle = 'rgba(237,234,224,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(phx + 0.5, sc.y);
  ctx.lineTo(phx + 0.5, sc.y + sc.h);
  ctx.stroke();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Point Field Score').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Point Field Score').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 03').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Point Field Score', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 03', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to scatter the field.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
/* ---- sound: Karplus-Strong plucks and bowed strings, gesture only ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try { audioCtx = new AudioContext(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function pluck(ac, freq) {
  try {
    var sr = ac.sampleRate;
    var dur = 1.8;
    var len = Math.floor(sr * dur);
    var buf = ac.createBuffer(1, len, sr);
    var d = buf.getChannelData(0);
    var period = Math.max(2, Math.round(sr / freq));
    var i, j;
    for (i = 0; i < period; i++) d[i] = Math.random() * 2 - 1;
    for (i = period; i < len; i++) d[i] = 0.5 * (d[i - period] + d[i - period + 1 >= len ? i - period : i - period + 1]) * 0.996;
    var src = ac.createBufferSource();
    src.buffer = buf;
    var g = ac.createGain();
    g.gain.value = 0.16;
    src.connect(g);
    g.connect(ac.destination);
    src.start();
  } catch (e) {}
}
function bow(ac, freq) {
  try {
    var o = ac.createOscillator();
    o.type = 'sawtooth';
    o.frequency.value = freq;
    var f = ac.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = freq * 3;
    f.Q.value = 6;
    var g = ac.createGain();
    var now = ac.currentTime;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.07, now + 0.4);
    g.gain.setValueAtTime(0.07, now + 2.2);
    g.gain.linearRampToValueAtTime(0, now + 3.4);
    var vib = ac.createOscillator();
    vib.type = 'sine';
    vib.frequency.value = 5.5;
    var vg = ac.createGain();
    vg.gain.value = freq * 0.006;
    vib.connect(vg);
    vg.connect(o.frequency);
    o.connect(f);
    f.connect(g);
    g.connect(ac.destination);
    o.start(now);
    vib.start(now);
    o.stop(now + 3.5);
    vib.stop(now + 3.5);
  } catch (e) {}
}
/* crossing test: agent passed the playhead since the previous frame */
var prevT = null;
function checkCrossings(sc, t) {
  if (prevT === null || t <= prevT) { prevT = t; return; }
  var m = Math.min(sc.w, sc.h);
  var i, a, p0, p1;
  for (i = 0; i < DOTS.length; i++) {
    a = DOTS[i];
    p0 = agentPos(a, prevT); p1 = agentPos(a, t);
    if ((p0.x - PLAYHEAD_X) * (p1.x - PLAYHEAD_X) < 0) {
      addHeat(sc.x + p1.x * sc.w, sc.y + p1.y * sc.h, m * 0.03, true);
      if (audioCtx) pluck(audioCtx, BASE_A * JI[a.ji]);
    }
  }
  for (i = 0; i < BLOBS.length; i++) {
    a = BLOBS[i];
    p0 = agentPos(a, prevT); p1 = agentPos(a, t);
    if ((p0.x - PLAYHEAD_X) * (p1.x - PLAYHEAD_X) < 0) {
      addHeat(sc.x + p1.x * sc.w, sc.y + p1.y * sc.h, m * 0.07, false);
      if (audioCtx) bow(audioCtx, BASE_A * JI[a.ji] / 2);
    }
  }
  prevT = t;
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawWash(sc);
  drawField(sc, t);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    dotCount: DOTS.length,
    blobCount: BLOBS.length,
    playheadX: PLAYHEAD_X,
    dotPosAt: function (i, t) { return agentPos(DOTS[i], t); }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, playhead at x = 0.618 of width ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (ev) {
    dragging = true;
    ensureAudio();
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    scatter.x = (ev.clientX - rect.left) / VW;
    scatter.y = (ev.clientY - rect.top) / VH;
    scatter.mag = 1;
    scatter.t = phaseT;
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!dragging) return;
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    scatter.x = (ev.clientX - rect.left) / VW;
    scatter.y = (ev.clientY - rect.top) / VH;
    scatter.mag = 1;
    scatter.t = phaseT;
  });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) {
        checkCrossings(fieldRect(), phaseT);
        draw();
      }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
