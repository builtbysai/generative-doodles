<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.265 Factory Summit</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#E8ECED; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.265 Factory Summit (Stanzin Tsepel). After his 2023
// industrialization piece: a pale blue-grey craggy
// mountain with a dense little factory straddling its
// highest peak, tan blocks, towers, chimneys. Over 40
// seconds the smoke thickens and the factory creeps a
// little further across the ridge, then recedes and the
// peak is clean again. The mountain endures: the
// warning, not the catastrophe. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var ICE = '#9FB3C1', TAN = '#C2A878', GREY = '#77716A', SMOKE = '#D8D8D4', SKY = '#E8ECED';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var T = 11, lastNow = -1; // frame one: mid encroachment, smoke already up

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

// ---- the mountain: two layered craggy ridge lines --------------------------------
function ridgePoints(pts, seed, jag) {
  var r = rng(seed), out = [];
  for (var i = 0; i < pts.length; i++) {
    out.push(pts[i]);
    if (i < pts.length - 1) {
      var a = pts[i], b = pts[i + 1];
      out.push([(a[0] + b[0]) / 2 + (r() - 0.5) * 26, (a[1] + b[1]) / 2 + (r() - 0.5) * jag - 8]);
      out.push([a[0] + (b[0] - a[0]) * 0.78 + (r() - 0.5) * 18, a[1] + (b[1] - a[1]) * 0.78 + (r() - 0.5) * jag * 0.7]);
    }
  }
  return out;
}
var backRidge = ridgePoints([[0, 560], [170, 468], [320, 520], [450, 428], [580, 498], [712, 412], [845, 492], [975, 432], [1110, 502], [1280, 458]], 26511, 20);
var frontRidge = ridgePoints([[0, 648], [130, 556], [268, 604], [398, 502], [524, 428], [640, 344], [762, 424], [884, 482], [1014, 438], [1136, 542], [1280, 498]], 26523, 30);
// darker facet planes on the front slopes
var facets = [];
(function () {
  var r = rng(26537);
  for (var i = 0; i < 12; i++) {
    var x = 90 + r() * 1080, y = 520 + r() * 200;
    facets.push({ x: x, y: y, w: 46 + r() * 90, h: 26 + r() * 60, a: 0.10 + r() * 0.12 });
  }
})();
// snow lying in the high hollows
var snowLies = [];
(function () {
  var r = rng(26549);
  for (var i = 0; i < 9; i++) snowLies.push({ x: 330 + r() * 640, y: 386 + r() * 130, rx: 16 + r() * 34, ry: 3.5 + r() * 4, a: 0.3 + r() * 0.3 });
})();

// ---- smoke: one seeded system shared by the stacks ---------------------------------
var smokeP = [];
(function () {
  var r = rng(26561);
  for (var i = 0; i < 30; i++) smokeP.push({ off: r(), chim: i % 3, drift: (r() - 0.5) * 26, sz: 0.75 + r() * 0.6 });
})();
var chimneys = [{ x: 617, y: 216 }, { x: 694, y: 228 }, { x: 565, y: 250, gated: 0.42 }];

function poly(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}

function drawFactory(d) {
  // the platform the works stand on, straddling the summit
  ctx.fillStyle = GREY;
  ctx.fillRect(516, 338, 252, 12);
  // main hall and second hall
  ctx.fillStyle = TAN;
  ctx.fillRect(545, 288, 120, 52);
  ctx.fillStyle = GREY;
  ctx.fillRect(665, 300, 82, 40);
  // the horizontal beam tying the halls
  ctx.fillStyle = GREY;
  ctx.fillRect(538, 280, 218, 8);
  // towers
  ctx.fillStyle = GREY;
  ctx.fillRect(577, 238, 26, 50);
  ctx.fillStyle = TAN;
  ctx.fillRect(700, 252, 22, 48);
  // chimney stacks
  ctx.fillStyle = TAN;
  ctx.fillRect(610, 216, 14, 40);
  ctx.fillStyle = GREY;
  ctx.fillRect(688, 228, 12, 34);
  var g3 = smooth((d - 0.42) / 0.2);
  if (g3 > 0) { // a third stack rises off the main hall's roof
    ctx.fillStyle = GREY;
    ctx.fillRect(560, 288 - 36 * g3, 11, 36 * g3);
  }
  // lit slits in the halls
  ctx.fillStyle = rgba(SMOKE, 0.5);
  for (var i = 0; i < 5; i++) ctx.fillRect(556 + i * 22, 306, 9, 14);
  ctx.fillRect(676, 314, 9, 12); ctx.fillRect(700, 314, 9, 12); ctx.fillRect(724, 314, 9, 12);
  // encroachment: extra blocks creep out along the ridge as dominance grows
  var gL = smooth((d - 0.35) / 0.2);
  if (gL > 0) {
    ctx.fillStyle = TAN;
    ctx.fillRect(545 - 62 * gL, 306, 62 * gL, 34);
    ctx.fillStyle = GREY;
    ctx.fillRect(545 - 62 * gL, 296, 10 + 20 * gL, 10);
  }
  var gR = smooth((d - 0.52) / 0.2);
  if (gR > 0) {
    ctx.fillStyle = GREY;
    ctx.fillRect(747, 308, 66 * gR, 32);
    ctx.fillStyle = TAN;
    ctx.fillRect(747 + 66 * gR - 12, 292, 12, 16);
  }
  var gF = smooth((d - 0.72) / 0.2);
  if (gF > 0) {
    ctx.fillStyle = TAN;
    ctx.fillRect(813, 318, 44 * gF, 22);
  }
}

function drawSmoke(d) {
  for (var i = 0; i < smokeP.length; i++) {
    var p = smokeP[i];
    var ch = chimneys[p.chim];
    if (ch.gated !== undefined && d < ch.gated) continue;
    var cyc = (T * 0.055 + p.off) % 1;
    var x = ch.x + 6 + p.drift * cyc + Math.sin(cyc * 5 + p.off * 9) * 5;
    var y = ch.y - 6 - cyc * 138;
    var r = (5 + cyc * 24) * p.sz;
    var a = (0.08 + 0.22 * d) * (1 - cyc) * smooth(cyc / 0.12);
    if (a <= 0.004) continue;
    ctx.fillStyle = rgba(SMOKE, a);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.55, y + r * 0.3, r * 0.7, 0, Math.PI * 2); ctx.fill();
  }
}

function draw() {
  // stark studio backdrop
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, DW, DH);
  // dominance: swells and recedes over a 40 second loop
  var ph = (T % 40) / 40;
  var tri = ph < 0.5 ? ph * 2 : 2 - ph * 2;
  var d = 0.15 + 0.8 * smooth(tri);
  // far peaks
  ctx.fillStyle = mix(ICE, SKY, 0.45);
  poly(backRidge.concat([[DW + 10, DH + 10], [-10, DH + 10]]));
  // the great front mass
  ctx.fillStyle = ICE;
  poly(frontRidge.concat([[DW + 10, DH + 10], [-10, DH + 10]]));
  // facets and snow
  for (var i = 0; i < facets.length; i++) {
    var f = facets[i];
    ctx.fillStyle = rgba(GREY, f.a);
    ctx.beginPath();
    ctx.moveTo(f.x, f.y); ctx.lineTo(f.x + f.w, f.y + f.h * 0.4); ctx.lineTo(f.x + f.w * 0.4, f.y + f.h);
    ctx.closePath(); ctx.fill();
  }
  for (var s = 0; s < snowLies.length; s++) {
    var sn = snowLies[s];
    ctx.fillStyle = rgba(SMOKE, sn.a);
    ctx.beginPath(); ctx.ellipse(sn.x, sn.y, sn.rx, sn.ry, 0, 0, Math.PI * 2); ctx.fill();
  }
  drawFactory(d);
  drawSmoke(d);
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, H);
  // contain-fit: the massif keeps its shape, centred, on its own pale sky
  var S = Math.min(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
