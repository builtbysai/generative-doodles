<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№8995 · Hour Hands — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14110c;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 640px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #d9a441; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #101014;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .cap {
    margin-top: 2.5vmin; color: #6b6455; font-size: 13px; font-style: italic;
    letter-spacing: 0.06em; text-align: center; max-width: 640px;
  }
  footer { margin-top: 3vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #d9a441; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№8995</span> · Hour Hands</h1>
  <p>A clock that repaints itself every minute. Three rings for seconds,
  minutes and hours, each one a slow journey between two colors.
  <b>Click the piece to hold a still.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<div class="cap" id="cap"></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let urlSeed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(urlSeed)) urlSeed = null;
const TAU = Math.PI * 2;
const VU = 1000, CX = 500, CY = 500;
const reduceMotion = window.matchMedia &&
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function smooth(t){ return t * t * (3 - 2 * t); }
function hsl(h, s, l){
  h = ((h % 360) + 360) % 360; s = clamp(s, 0, 100) / 100; l = clamp(l, 0, 100) / 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60){ r = c; g = x; b = 0; }
  else if (h < 120){ r = x; g = c; b = 0; }
  else if (h < 180){ r = 0; g = c; b = x; }
  else if (h < 240){ r = 0; g = x; b = c; }
  else if (h < 300){ r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return [ (r + m) * 255, (g + m) * 255, (b + m) * 255 ];
}
const mixc = (a, b, t) => [ a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t ];
const css = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

// Curated earth pairs (anchor journeys that never churn)
const EARTH = [
  [[28, 52, 34], [18, 58, 55]],   // sienna to ochre
  [[210, 24, 32], [170, 22, 44]],  // slate to sea green
  [[95, 22, 32], [55, 40, 52]],    // moss to straw
  [[350, 30, 36], [15, 45, 55]],   // madder to ember
  [[265, 26, 40], [200, 30, 55]],  // indigo to steel
  [[150, 18, 30], [110, 28, 48]]   // pine to sage
];

// Mint one anchor pair for a ring, from a seed. Families:
// 0 analogous hues, 1 earth pair, 2 ink monochrome with one accent.
function mintAnchors(rnd){
  const fam = (rnd() * 3) | 0;
  if (fam === 0){
    const h = rnd() * 360, s = 20 + rnd() * 18;
    const l1 = 28 + rnd() * 8, dh = 18 + rnd() * 22;
    return { a: hsl(h, s, l1), b: hsl(h + dh, s + 6, l1 + 12 + rnd() * 6), fam };
  }
  if (fam === 1){
    const p = EARTH[(rnd() * EARTH.length) | 0];
    return { a: hsl(p[0][0], p[0][1], p[0][2]), b: hsl(p[1][0], p[1][1], p[1][2]), fam };
  }
  const h = rnd() * 360;
  return {
    a: hsl(h, 12 + rnd() * 8, 20 + rnd() * 6),
    b: hsl((rnd() * 3) | 0 ? h + 8 : h, 55 + rnd() * 15, 52 + rnd() * 10),
    fam
  };
}

// Rings from the center out: seconds (60), minutes (60), hours (12)
const RINGS = [
  { n: 60, r0: 132, r1: 196, salt: 0x5eED, label: "seconds" },
  { n: 60, r0: 232, r1: 300, salt: 0x11E5, label: "minutes" },
  { n: 12, r0: 336, r1: 404, salt: 0x9016, label: "hours" }
];

// piece state
let mode = urlSeed === null ? "live" : "still";
let stillSeed = urlSeed === null ? ((Math.random() * 1e9) | 0) : urlSeed;
// current anchors as live RGB floats, eased toward their minted targets
let cur = [null, null, null], tgt = [null, null, null];
let lastMinuteEpoch = -1;

function anchorsFor(ringIdx, seedInt){
  const rnd = mulberry32((seedInt ^ RINGS[ringIdx].salt) | 0);
  const p = mintAnchors(rnd);
  return [p.a, p.b];
}

function stillTime(){
  const r = mulberry32(stillSeed);
  return { h: (r() * 12) | 0, m: (r() * 60) | 0, s: (r() * 60) | 0, ms: 0 };
}

function updateTargets(){
  let seedInt;
  if (mode === "live") seedInt = Math.floor(Date.now() / 60000);
  else seedInt = stillSeed;
  if (seedInt === lastMinuteEpoch) return;
  lastMinuteEpoch = seedInt;
  for (let i = 0; i < 3; i++){
    tgt[i] = anchorsFor(i, seedInt);
    if (!cur[i] || reduceMotion) cur[i] = [tgt[i][0].slice(), tgt[i][1].slice()];
  }
}

function easeAnchors(dt){
  if (reduceMotion) return;
  const k = clamp(dt / 2.5, 0, 1);
  for (let i = 0; i < 3; i++)
    for (let e = 0; e < 2; e++)
      for (let c = 0; c < 3; c++)
        cur[i][e][c] += (tgt[i][e][c] - cur[i][e][c]) * k;
}

let ctx;
function setupCanvas(){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = stage.clientWidth;
  canvas.width = S * dpr; canvas.height = S * dpr;
  ctx = canvas.getContext("2d");
  ctx.setTransform(dpr * S / VU, 0, 0, dpr * S / VU, 0, 0);
}

function drawBackground(){
  const g = ctx.createRadialGradient(CX, CY, 60, CX, CY, 620);
  g.addColorStop(0, "#17171d");
  g.addColorStop(0.7, "#101014");
  g.addColorStop(1, "#0a0a0d");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VU, VU);
  ctx.strokeStyle = "rgba(255,255,255,0.045)";
  ctx.lineWidth = 1;
  for (const r of [404, 300, 196]){
    ctx.beginPath(); ctx.arc(CX, CY, r + 14, 0, TAU); ctx.stroke();
  }
}

function ringColor(ringIdx, seg){
  const ring = RINGS[ringIdx];
  const t = seg / ring.n;
  const e = smooth(Math.sin(Math.PI * t)); // A -> B -> A, seamless
  return css(mixc(cur[ringIdx][0], cur[ringIdx][1], e));
}

function drawRing(ringIdx, nowSeg){
  const ring = RINGS[ringIdx];
  const mid = (ring.r0 + ring.r1) / 2, w = ring.r1 - ring.r0;
  const gap = (TAU / ring.n) * 0.14;
  ctx.lineWidth = w;
  ctx.lineCap = "butt";
  for (let i = 0; i < ring.n; i++){
    const a0 = -Math.PI / 2 + (i / ring.n) * TAU + gap / 2;
    const a1 = -Math.PI / 2 + ((i + 1) / ring.n) * TAU - gap / 2;
    ctx.strokeStyle = ringColor(ringIdx, i);
    ctx.beginPath(); ctx.arc(CX, CY, mid, a0, a1); ctx.stroke();
  }
  // legibility: the present segment glows
  const a0 = -Math.PI / 2 + (nowSeg / ring.n) * TAU + gap / 2;
  const a1 = -Math.PI / 2 + ((nowSeg + 1) / ring.n) * TAU - gap / 2;
  ctx.strokeStyle = "rgba(244,238,222,0.82)";
  ctx.lineWidth = w * 0.30;
  ctx.beginPath(); ctx.arc(CX, CY, mid, a0, a1); ctx.stroke();
}

function drawNumerals(){
  ctx.fillStyle = "rgba(232,226,210,0.5)";
  ctx.font = "26px Georgia, serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const nums = ["12", "3", "6", "9"];
  for (let i = 0; i < 4; i++){
    const a = -Math.PI / 2 + i * Math.PI / 2;
    ctx.fillText(nums[i], CX + Math.cos(a) * 452, CY + Math.sin(a) * 452);
  }
}

function drawHands(h, m, s){
  const ang = (frac) => -Math.PI / 2 + frac * TAU;
  const hands = [
    { frac: ((h % 12) + m / 60) / 12, len: 420, w: 5 },
    { frac: (m + s / 60) / 60, len: 316, w: 3.5 },
    { frac: s / 60, len: 210, w: 2 }
  ];
  ctx.lineCap = "round";
  for (const hd of hands){
    const a = ang(hd.frac);
    ctx.strokeStyle = "rgba(244,238,222,0.92)";
    ctx.lineWidth = hd.w;
    ctx.beginPath();
    ctx.moveTo(CX - Math.cos(a) * 26, CY - Math.sin(a) * 26);
    ctx.lineTo(CX + Math.cos(a) * hd.len, CY + Math.sin(a) * hd.len);
    ctx.stroke();
  }
  ctx.fillStyle = "#f4eede";
  ctx.beginPath(); ctx.arc(CX, CY, 10, 0, TAU); ctx.fill();
  ctx.fillStyle = "#101014";
  ctx.beginPath(); ctx.arc(CX, CY, 4, 0, TAU); ctx.fill();
}

function drawCenterReadout(h, m, s){
  const p2 = v => String(v).padStart(2, "0");
  ctx.fillStyle = "rgba(232,226,210,0.62)";
  ctx.font = "30px Georgia, serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(`${p2(h)}:${p2(m)}:${p2(s)}`, CX, CY + 52);
  ctx.fillStyle = "rgba(143,136,117,0.7)";
  ctx.font = "italic 15px Georgia, serif";
  ctx.fillText(mode === "live" ? "live" : "held still · seed " + stillSeed, CX, CY + 84);
}

function render(now){
  setupCanvas();
  updateTargets();
  let t;
  if (mode === "live"){
    const d = new Date();
    if (reduceMotion) t = { h: d.getHours(), m: d.getMinutes(), s: d.getSeconds(), ms: 0 };
    else t = { h: d.getHours(), m: d.getMinutes(), s: d.getSeconds(), ms: d.getMilliseconds() };
  } else t = stillTime();
  const sFrac = t.s + t.ms / 1000;
  drawBackground();
  drawRing(0, Math.floor(sFrac) % 60);
  drawRing(1, t.m);
  drawRing(2, t.h % 12);
  drawNumerals();
  drawHands(t.h, t.m, sFrac);
  drawCenterReadout(t.h, t.m, Math.floor(sFrac));
}

const cap = document.getElementById("cap");
function updateCap(){
  cap.textContent = mode === "live"
    ? "Live time. New anchor pairs are minted every minute and eased in over a few seconds."
    : "A held still. Click again for live time, or reload with ?seed= for this exact frame.";
}

let lastFrame = performance.now();
function loop(now){
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  easeAnchors(dt);
  render(now);
  if (!reduceMotion) requestAnimationFrame(loop);
  else setTimeout(() => requestAnimationFrame(loop), 900);
}

document.getElementById("stage").addEventListener("click", () => {
  if (mode === "live"){
    mode = "still";
    stillSeed = (Math.random() * 1e9) | 0;
    lastMinuteEpoch = -1;
    history.replaceState(null, "", "?seed=" + stillSeed);
  } else {
    mode = "live";
    lastMinuteEpoch = -1;
    history.replaceState(null, "", location.pathname);
  }
  updateCap();
});

window.addEventListener("resize", () => render(performance.now()));
updateCap();
updateTargets();
requestAnimationFrame(loop);
</script>
</body>
</html>
