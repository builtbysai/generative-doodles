<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redaction Field</title>
<style>
html,body{margin:0;padding:0;background:#e8e2d4;overflow:hidden}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#e8e2d4', INK = '#4a4a48', RUST = '#8c3b2a', BLACK = '#111111';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function vw(){ return (window.visualViewport && window.visualViewport.width) || window.innerWidth; }
function vh(){ return (window.visualViewport && window.visualViewport.height) || window.innerHeight; }
var W = 0, H = 0, PHONE = false;
function size(){
  W = vw(); H = vh();
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  var minScreen = 99999;
  try{ minScreen = Math.min(window.screen.width, window.screen.height); }catch(e){}
  PHONE = (minScreen < 700) || (H > W * 1.15);
}
size();
if(window.visualViewport && window.visualViewport.addEventListener){ window.visualViewport.addEventListener('resize', function(){ size(); draw(lastT); }); }
if(window.addEventListener){ window.addEventListener('resize', function(){ size(); draw(lastT); }); }

// ---------- seeded field content (built once, in normalized space) ----------
var glyphRng = mulberry32(1356000 + 11 * 7919);
// Invented glyph shapes: abstract stroke marks only, never letterforms.
function drawGlyph(x, y, s, r){
  var k = Math.floor(r() * 20);
  ctx.lineWidth = Math.max(1, s * 0.09);
  ctx.lineCap = 'round';
  ctx.beginPath();
  if(k === 0){ ctx.moveTo(x - s*0.4, y); ctx.arc(x, y, s*0.32, 0, Math.PI*2); ctx.moveTo(x + s*0.5, y - s*0.5); ctx.arc(x + s*0.5, y - s*0.5, s*0.08, 0, Math.PI*2); }
  else if(k === 1){ ctx.arc(x, y, s*0.45, Math.PI*0.9, Math.PI*2.1); ctx.moveTo(x - s*0.1, y + s*0.5); ctx.lineTo(x + s*0.3, y + s*0.5); }
  else if(k === 2){ ctx.moveTo(x - s*0.5, y + s*0.35); ctx.lineTo(x, y - s*0.4); ctx.lineTo(x + s*0.5, y + s*0.35); }
  else if(k === 3){ ctx.moveTo(x - s*0.4, y - s*0.3); ctx.lineTo(x + s*0.4, y - s*0.3); ctx.moveTo(x - s*0.4, y + s*0.3); ctx.lineTo(x + s*0.4, y + s*0.3); ctx.moveTo(x, y - s*0.55); ctx.arc(x, y - s*0.55, s*0.07, 0, Math.PI*2); }
  else if(k === 4){ ctx.moveTo(x - s*0.4, y + s*0.4); ctx.lineTo(x, y - s*0.45); ctx.lineTo(x + s*0.4, y + s*0.4); ctx.closePath(); }
  else if(k === 5){ ctx.moveTo(x - s*0.4, y); ctx.lineTo(x + s*0.4, y); ctx.moveTo(x, y - s*0.45); ctx.lineTo(x + s*0.1, y + s*0.45); }
  else if(k === 6){ ctx.moveTo(x - s*0.5, y); var i; for(i = 0; i <= 8; i++){ var px = x - s*0.5 + i * s*0.125; var py = y + Math.sin(i / 8 * Math.PI * 2) * s*0.3; if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); } }
  else if(k === 7){ ctx.moveTo(x - s*0.4, y - s*0.4); ctx.lineTo(x - s*0.4, y + s*0.4); ctx.moveTo(x - s*0.4, y - s*0.4); ctx.lineTo(x - s*0.1, y - s*0.4); ctx.moveTo(x - s*0.4, y + s*0.4); ctx.lineTo(x - s*0.1, y + s*0.4); ctx.moveTo(x + s*0.45, y); ctx.arc(x + s*0.45, y, s*0.08, 0, Math.PI*2); }
  else if(k === 8){ ctx.moveTo(x - s*0.3, y); ctx.arc(x - s*0.3, y, s*0.08, 0, Math.PI*2); ctx.moveTo(x + s*0.3, y - s*0.3); ctx.arc(x + s*0.3, y - s*0.3, s*0.08, 0, Math.PI*2); ctx.moveTo(x + s*0.1, y + s*0.35); ctx.arc(x + s*0.1, y + s*0.35, s*0.08, 0, Math.PI*2); }
  else if(k === 9){ ctx.moveTo(x - s*0.4, y); ctx.arc(x - s*0.1, y, s*0.3, 0, Math.PI*2); ctx.moveTo(x + s*0.45, y + s*0.35); ctx.lineTo(x + s*0.55, y - s*0.25); }
  else if(k === 10){ ctx.arc(x, y - s*0.1, s*0.4, Math.PI*1.05, Math.PI*1.95); ctx.moveTo(x - s*0.45, y + s*0.35); ctx.arc(x, y + s*0.1, s*0.4, Math.PI*1.05, Math.PI*1.95); }
  else if(k === 11){ ctx.moveTo(x - s*0.4, y + s*0.4); ctx.lineTo(x + s*0.4, y - s*0.4); ctx.moveTo(x + s*0.1, y + s*0.5); ctx.arc(x + s*0.1, y + s*0.5, s*0.08, 0, Math.PI*2); }
  else if(k === 12){ ctx.moveTo(x, y - s*0.45); ctx.lineTo(x + s*0.4, y); ctx.lineTo(x, y + s*0.45); ctx.lineTo(x - s*0.4, y); ctx.closePath(); }
  else if(k === 13){ ctx.arc(x, y, s*0.4, Math.PI*0.2, Math.PI*1.7); ctx.moveTo(x + s*0.2, y + s*0.1); ctx.arc(x + s*0.05, y + s*0.05, s*0.18, Math.PI*0.2, Math.PI*1.7); }
  else if(k === 14){ ctx.moveTo(x - s*0.4, y); ctx.arc(x - s*0.4, y, s*0.09, 0, Math.PI*2); ctx.moveTo(x, y); ctx.arc(x, y, s*0.07, 0, Math.PI*2); ctx.moveTo(x + s*0.4, y); ctx.arc(x + s*0.4, y, s*0.05, 0, Math.PI*2); }
  else if(k === 15){ ctx.moveTo(x - s*0.45, y + s*0.35); ctx.lineTo(x + s*0.45, y - s*0.35); ctx.moveTo(x + s*0.2, y + s*0.45); ctx.arc(x + s*0.2, y + s*0.45, s*0.08, 0, Math.PI*2); }
  else if(k === 16){ ctx.moveTo(x - s*0.4, y); ctx.arc(x, y, s*0.35, 0, Math.PI*2); ctx.moveTo(x - s*0.15, y - s*0.15); ctx.lineTo(x + s*0.15, y + s*0.15); }
  else if(k === 17){ ctx.moveTo(x - s*0.5, y + s*0.4); ctx.lineTo(x - s*0.5, y); ctx.lineTo(x, y); ctx.lineTo(x, y - s*0.4); ctx.lineTo(x + s*0.5, y - s*0.4); }
  else if(k === 18){ ctx.arc(x, y, s*0.45, Math.PI*0.6, Math.PI*1.9); ctx.moveTo(x - s*0.1, y - s*0.1); ctx.arc(x + s*0.05, y, s*0.32, Math.PI*0.6, Math.PI*1.9); }
  else { ctx.moveTo(x - s*0.4, y); ctx.arc(x - s*0.4, y, s*0.09, 0, Math.PI*2); ctx.moveTo(x + s*0.4, y); ctx.arc(x + s*0.4, y, s*0.09, 0, Math.PI*2); ctx.arc(x, y, s*0.35, Math.PI*1.1, Math.PI*1.9); }
  ctx.stroke();
}

// Diagram ticks: small circles with tick, dimension lines, angle arcs (seeded, normalized).
var ticks = [];
(function(){
  var r = mulberry32(1356000 + 23 * 7919);
  var i;
  for(i = 0; i < 16; i++){
    ticks.push({ x: r(), y: r(), kind: Math.floor(r() * 3), a: r() * Math.PI * 2, s: 0.02 + r() * 0.03 });
  }
})();

// Rust stamp marks: irregular blobs (seeded, normalized).
var rustMarks = [];
(function(){
  var r = mulberry32(1356000 + 29 * 7919);
  var i, j;
  for(i = 0; i < 7; i++){
    var pts = [];
    var n = 7 + Math.floor(r() * 4);
    for(j = 0; j < n; j++){ var a = j / n * Math.PI * 2; var rad = 0.03 + r() * 0.05; pts.push([Math.cos(a) * rad, Math.sin(a) * rad * 0.7]); }
    rustMarks.push({ x: r(), y: r(), pts: pts, a: r() * 0.12 + 0.08 });
  }
})();

// ---------- bars (normalized params, fixed per bar index) ----------
var barDefs = [
  { angle: -14, yF: 0.18, lenF: 0.84, thF: 0.080 },
  { angle: -14, yF: 0.38, lenF: 0.80, thF: 0.075 },
  { angle: -14, yF: 0.58, lenF: 0.86, thF: 0.085 },
  { angle: -14, yF: 0.78, lenF: 0.80, thF: 0.070 }
];
var NSEG = 56;
// Per-bar, per-segment last-wipe time (seconds, piece time). Undefined = never wiped.
var wipeTimes = [];
(function(){ var b, s; for(b = 0; b < barDefs.length; b++){ wipeTimes.push([]); for(s = 0; s < NSEG; s++){ wipeTimes[b].push(undefined); } } })();

// ---------- under-bar drawings (seeded line systems, bar-local coords) ----------
// Local space: x in units of bar length, y in units of bar thickness.
function buildDrawing(bi){
  var r = mulberry32(1356000 + bi * 7919);
  var strokes = [];
  var i, j;
  if(bi === 0){
    // Branching system from a root at the left.
    var branches = [{ x: -0.62, y: 0, a: -0.15, len: 0.30, w: 2.2, d: 0 }];
    while(branches.length){
      var br = branches.pop();
      var x2 = br.x + Math.cos(br.a) * br.len;
      var y2 = br.y + Math.sin(br.a) * br.len * 0.9;
      strokes.push({ pts: [{ x: br.x, y: br.y }, { x: x2, y: y2 }], w: br.w });
      if(br.d < 3 && br.len > 0.06){
        var nk = 2 + Math.floor(r() * 2);
        for(j = 0; j < nk; j++){
          branches.push({ x: x2, y: y2, a: br.a + (r() - 0.5) * 1.5, len: br.len * (0.55 + r() * 0.25), w: br.w * 0.7, d: br.d + 1 });
        }
      }
    }
  } else if(bi === 1){
    // Spiral of arc segments.
    var pts = [];
    var turns = 2.6, steps = 90;
    for(i = 0; i <= steps; i++){
      var f = i / steps;
      var rad = 0.06 + f * 0.55;
      var ang = f * turns * Math.PI * 2;
      pts.push({ x: -0.05 + Math.cos(ang) * rad * 0.9, y: Math.sin(ang) * rad * 0.55 });
    }
    for(i = 0; i < pts.length - 1; i++){ strokes.push({ pts: [pts[i], pts[i + 1]], w: 1.8 }); }
  } else if(bi === 2){
    // Contour waves.
    for(j = 0; j < 5; j++){
      var line = [];
      var baseY = -0.8 + j * 0.4;
      var ph = r() * Math.PI * 2, amp = 0.15 + r() * 0.15;
      for(i = 0; i <= 40; i++){
        var fx = -0.68 + i / 40 * 1.36;
        line.push({ x: fx, y: baseY + Math.sin(fx * 5 + ph) * amp });
      }
      for(i = 0; i < line.length - 1; i++){ strokes.push({ pts: [line[i], line[i + 1]], w: 1.6 }); }
    }
  } else {
    // Lattice: jittered grid with diagonals.
    var gx, gy;
    for(gy = 0; gy < 4; gy++){
      for(gx = 0; gx < 8; gx++){
        var x0 = -0.64 + gx * 0.183, y0 = -0.85 + gy * 0.57;
        var x1 = x0 + 0.183 + (r() - 0.5) * 0.06, y1 = y0 + (r() - 0.5) * 0.3;
        strokes.push({ pts: [{ x: x0, y: y0 }, { x: x1, y: y1 }], w: 1.5 });
        if(r() < 0.6){ strokes.push({ pts: [{ x: x0, y: y0 }, { x: x0 + 0.1, y: y0 + 0.57 }], w: 1.2 }); }
      }
    }
  }
  return strokes;
}
var drawings = [buildDrawing(0), buildDrawing(1), buildDrawing(2), buildDrawing(3)];

// Bar geometry in pixels for current W,H.
function barGeo(bi){
  var d = barDefs[bi];
  return {
    cx: W * 0.5, cy: H * d.yF,
    len: W * d.lenF, th: H * d.thF,
    rad: d.angle * Math.PI / 180
  };
}
// Segment alpha at piece time t: 1 = fully black. Recovery starts ~60s after a
// wipe, creeping inward from both ends (ends first, center last, +15s).
function segAlpha(bi, seg, t){
  var wt = wipeTimes[bi][seg];
  if(wt === undefined) return 1;
  var edge = Math.min(seg, NSEG - 1 - seg) / (NSEG / 2); // 0 at ends, ~1 at center
  var delay = 60 + edge * 15;
  var dt = t - wt;
  if(dt < delay) return 0;
  var a = (dt - delay) / 8;
  return a > 1 ? 1 : a;
}

// ---------- interaction: drag wipes ----------
var dragging = false, lastPt = null, lastT = 0;
function wipeAt(x, y, t){
  var b, s;
  for(b = 0; b < barDefs.length; b++){
    var g = barGeo(b);
    var dx = x - g.cx, dy = y - g.cy;
    var cos = Math.cos(-g.rad), sin = Math.sin(-g.rad);
    var lx = dx * cos - dy * sin, ly = dx * sin + dy * cos;
    if(Math.abs(ly) > g.th * 0.75) continue;
    if(lx < -g.len * 0.55 || lx > g.len * 0.55) continue;
    var seg = Math.floor((lx + g.len / 2) / g.len * NSEG);
    if(seg < 0) seg = 0; if(seg >= NSEG) seg = NSEG - 1;
    var R = Math.max(20, Math.min(W, H) * 0.035);
    for(s = 0; s < NSEG; s++){
      var sx = -g.len / 2 + (s + 0.5) * g.len / NSEG;
      if(Math.abs(sx - lx) <= R){ wipeTimes[b][s] = t; }
    }
  }
}
function wipeLine(x0, y0, x1, y1, t){
  var d = Math.hypot(x1 - x0, y1 - y0);
  var steps = Math.max(1, Math.floor(d / 8));
  var i;
  for(i = 0; i <= steps; i++){ wipeAt(x0 + (x1 - x0) * i / steps, y0 + (y1 - y0) * i / steps, t); }
}
function evPos(e){
  var r = { x: 0, y: 0 };
  if(e.clientX !== undefined){ r.x = e.clientX; r.y = e.clientY; }
  else if(e.touches && e.touches[0]){ r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
  return r;
}
canvas.addEventListener('pointerdown', function(e){
  dragging = true;
  var p = evPos(e); lastPt = p;
  wipeAt(p.x, p.y, lastT);
  if(e.preventDefault) e.preventDefault();
});
canvas.addEventListener('pointermove', function(e){
  if(!dragging) return;
  var p = evPos(e);
  if(lastPt) wipeLine(lastPt.x, lastPt.y, p.x, p.y, lastT);
  lastPt = p;
  if(e.preventDefault) e.preventDefault();
});
function endDrag(){
  dragging = false; lastPt = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---------- draw ----------
function draw(t){
  lastT = t;
  var minWH = Math.min(W, H);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  // Faint paper tone patches (flat alpha, no gradients).
  var tr = mulberry32(1356000 + 41 * 7919);
  var i;
  ctx.fillStyle = '#c9bfa8';
  for(i = 0; i < 8; i++){
    ctx.globalAlpha = 0.05 + tr() * 0.04;
    var px = tr() * W, py = tr() * H, pr = minWH * (0.15 + tr() * 0.3);
    ctx.beginPath();
    ctx.moveTo(px + pr, py);
    ctx.arc(px, py, pr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Faint grid lines.
  ctx.strokeStyle = INK; ctx.globalAlpha = 0.10; ctx.lineWidth = 1;
  ctx.beginPath();
  var gx, gy;
  var step = Math.max(70, minWH * 0.12);
  for(gx = step; gx < W; gx += step){ ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
  for(gy = step; gy < H; gy += step){ ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Pseudo-manual text rows: invented glyphs only.
  var rowStep = Math.max(20, Math.min(38, H * 0.042));
  var gSize = Math.max(8, Math.min(15, minWH * 0.02));
  var rr = mulberry32(1356000 + 11 * 7919);
  ctx.strokeStyle = INK;
  for(gy = rowStep * 0.7; gy < H; gy += rowStep){
    var x = 8 + rr() * 14;
    while(x < W - 8){
      ctx.globalAlpha = 0.45 + rr() * 0.35;
      drawGlyph(x, gy, gSize * (0.85 + rr() * 0.4), rr);
      x += gSize * (1.1 + rr() * 0.9);
    }
  }
  ctx.globalAlpha = 1;
  // Diagram ticks.
  ctx.strokeStyle = INK;
  for(i = 0; i < ticks.length; i++){
    var tk = ticks[i];
    var tx = tk.x * W, ty = tk.y * H, ts = tk.s * minWH;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 1;
    ctx.beginPath();
    if(tk.kind === 0){
      ctx.moveTo(tx + ts, ty);
      ctx.arc(tx, ty, ts, 0, Math.PI * 2);
      ctx.moveTo(tx + ts, ty); ctx.lineTo(tx + ts * 1.8, ty);
    } else if(tk.kind === 1){
      ctx.moveTo(tx - ts, ty); ctx.lineTo(tx + ts, ty);
      ctx.moveTo(tx - ts, ty - ts * 0.5); ctx.lineTo(tx - ts, ty + ts * 0.5);
      ctx.moveTo(tx + ts, ty - ts * 0.5); ctx.lineTo(tx + ts, ty + ts * 0.5);
    } else {
      ctx.arc(tx, ty, ts, tk.a, tk.a + Math.PI * 0.8);
      ctx.moveTo(tx, ty); ctx.lineTo(tx + Math.cos(tk.a) * ts, ty + Math.sin(tk.a) * ts);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // Rust stamp marks.
  ctx.fillStyle = RUST;
  for(i = 0; i < rustMarks.length; i++){
    var rm = rustMarks[i];
    ctx.globalAlpha = rm.a;
    ctx.beginPath();
    var j;
    for(j = 0; j < rm.pts.length; j++){
      var vx = rm.x * W + rm.pts[j][0] * minWH, vy = rm.y * H + rm.pts[j][1] * minWH;
      if(j === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Under-bar drawings, then bars.
  var b, s;
  for(b = 0; b < barDefs.length; b++){
    var g = barGeo(b);
    var cos = Math.cos(g.rad), sin = Math.sin(g.rad);
    var strokes = drawings[b];
    for(i = 0; i < strokes.length; i++){
      var st = strokes[i];
      var mx = (st.pts[0].x + st.pts[st.pts.length - 1].x) / 2;
      var my = (st.pts[0].y + st.pts[st.pts.length - 1].y) / 2;
      var a = 1;
      if(Math.abs(mx) <= 0.5 && Math.abs(my) <= 0.55){
        var seg = Math.floor((mx + 0.5) * NSEG);
        if(seg < 0) seg = 0; if(seg >= NSEG) seg = NSEG - 1;
        a = 1 - segAlpha(b, seg, t);
      }
      if(a <= 0.01) continue;
      ctx.strokeStyle = (i % 7 === 3) ? RUST : INK;
      ctx.globalAlpha = 0.75 * a;
      ctx.lineWidth = Math.max(1, st.w * minWH / 700);
      ctx.beginPath();
      for(j = 0; j < st.pts.length; j++){
        var lx = st.pts[j].x * g.len, ly = st.pts[j].y * g.th;
        var wx = g.cx + lx * cos - ly * sin, wy = g.cy + lx * sin + ly * cos;
        if(j === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // Bar as segments, each with its own alpha.
    ctx.fillStyle = BLACK;
    var segW = g.len / NSEG + 1;
    for(s = 0; s < NSEG; s++){
      var sa = segAlpha(b, s, t);
      if(sa <= 0.01) continue;
      var sx = -g.len / 2 + s * g.len / NSEG;
      ctx.globalAlpha = sa;
      ctx.save();
      ctx.translate(g.cx, g.cy);
      ctx.rotate(g.rad);
      ctx.fillRect(sx, -g.th / 2, segW, g.th);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

// Frame one: synchronous, constant phase. Clock starts only with the rAF loop.
draw(0);
var t0 = null;
function loop(ts){
  if(t0 === null) t0 = ts;
  draw((ts - t0) / 1000);
  if(typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if(typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
