<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.266 What Melts Does Not Stay</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1B6FA8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.266 What Melts Does Not Stay (Stanzin Tsepel). His
// Fremantle thesis in one frame: a glacial blue field at
// the top, a band of nambu stripes across the middle,
// sand below. Luminous particles leave the glacier edge,
// travel the full height along a gentle curve, and
// settle into white salt rings on the sand that expand,
// fade and renew. A glacier carries history; what melts
// in the Himalayas doesn't stay there. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GLACIER = '#1B6FA8', ICEW = '#E8F1F5', WOOL = '#E9E3D4', STRIPE = '#141414', SAND = '#C7A15E', SALT = '#FFFFFF';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var T = 13, lastNow = -1; // frame one: the stream in flight, rings already open

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

// ---- the glacier's calving edge -----------------------------------------------------
var teeth = [];
(function () {
  var r = rng(26611);
  for (var x = 0; x <= DW; x += 40) teeth.push({ x: x, y: 282 + (r() - 0.5) * 26 });
})();
// pale streaks frozen in the ice, drifting almost imperceptibly
var streaks = [];
(function () {
  var r = rng(26623);
  for (var i = 0; i < 13; i++) streaks.push({ x: r() * DW, y: 18 + r() * 230, len: 90 + r() * 200, ph: r() * Math.PI * 2, a: 0.05 + r() * 0.08 });
})();
// sand grain
var grain = [], saltSpecks = [];
(function () {
  var r = rng(26637);
  for (var i = 0; i < 650; i++) grain.push({ x: r() * DW, y: 436 + r() * (DH - 436), s: 0.8 + r() * 1.8, a: 0.05 + r() * 0.09 });
  for (var j = 0; j < 110; j++) saltSpecks.push({ x: r() * DW, y: 700 + r() * 190, s: 0.8 + r() * 1.6, a: 0.15 + r() * 0.25 });
})();
// ---- the melt stream ------------------------------------------------------------------
var P0 = { x: 596, y: 292 }, P1 = { x: 540, y: 560 }, P2 = { x: 694, y: 874 };
function bez(s) {
  var u = 1 - s;
  return {
    x: u * u * P0.x + 2 * u * s * P1.x + s * s * P2.x,
    y: u * u * P0.y + 2 * u * s * P1.y + s * s * P2.y
  };
}
var parts = [];
(function () {
  var r = rng(26649);
  for (var i = 0; i < 90; i++) parts.push({ off: r(), jx: (r() - 0.5) * 15, jy: (r() - 0.5) * 9, sz: 0.7 + r() * 0.7 });
})();
// ---- the salt rings ---------------------------------------------------------------------
var ringSeeds = [];
(function () {
  var r = rng(26661);
  for (var j = 0; j < 12; j++) ringSeeds.push({ jx: (r() - 0.5) * 56, jy: (r() - 0.5) * 20, w: 0.8 + r() * 0.45 });
})();
// the pale crust where rings have been landing all along
var crust = [];
(function () {
  var r = rng(26673);
  for (var i = 0; i < 6; i++) crust.push({ x: P2.x + (r() - 0.5) * 90, y: P2.y + (r() - 0.5) * 26, rx: 16 + r() * 30, a: 0.10 + r() * 0.1 });
})();

function draw() {
  // ---- the glacier field (upper third) -------------------------------------------
  ctx.fillStyle = GLACIER;
  ctx.beginPath();
  ctx.moveTo(-10, -10);
  ctx.lineTo(DW + 10, -10);
  ctx.lineTo(DW + 10, 292);
  for (var i = teeth.length - 1; i >= 0; i--) ctx.lineTo(teeth[i].x, teeth[i].y);
  ctx.closePath(); ctx.fill();
  // its frozen history: drifting pale streaks
  for (var s = 0; s < streaks.length; s++) {
    var st = streaks[s];
    var dx = 8 * Math.sin(T * Math.PI * 2 / 35 + st.ph);
    ctx.fillStyle = rgba(ICEW, st.a);
    ctx.beginPath(); ctx.ellipse(st.x + dx, st.y, st.len / 2, 5.5, 0.06, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = rgba(ICEW, 0.10);
  ctx.beginPath(); ctx.ellipse(300, 70, 210, 26, 0.03, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(950, 150, 260, 30, -0.02, 0, Math.PI * 2); ctx.fill();
  // ---- the nambu band --------------------------------------------------------------
  ctx.fillStyle = WOOL;
  ctx.fillRect(0, 302, DW, 116);
  ctx.fillStyle = STRIPE;
  ctx.fillRect(0, 324, DW, 17);
  ctx.fillRect(0, 356, DW, 17);
  ctx.fillRect(0, 388, DW, 17);
  // the weave: faint vertical ticks across the wool
  ctx.fillStyle = rgba(STRIPE, 0.05);
  for (var wx = 6; wx < DW; wx += 13) ctx.fillRect(wx, 304, 2, 112);
  // ---- the sand floor ------------------------------------------------------------------
  ctx.fillStyle = SAND;
  ctx.fillRect(0, 418, DW, DH - 418);
  ctx.fillStyle = rgba(STRIPE, 0.05);
  ctx.fillRect(0, 418, DW, 10); // the band's shadow line on the sand
  for (var g = 0; g < grain.length; g++) {
    var gr = grain[g];
    ctx.fillStyle = rgba(mix(SAND, STRIPE, 0.25), gr.a);
    ctx.fillRect(gr.x, gr.y, gr.s, gr.s);
  }
  for (var q = 0; q < saltSpecks.length; q++) {
    var sq = saltSpecks[q];
    ctx.fillStyle = rgba(SALT, sq.a);
    ctx.fillRect(sq.x, sq.y, sq.s, sq.s);
  }
  // the landing crust
  for (var c = 0; c < crust.length; c++) {
    var cr = crust[c];
    ctx.strokeStyle = rgba(SALT, cr.a);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(cr.x, cr.y, cr.rx, cr.rx * 0.34, 0, 0, Math.PI * 2); ctx.stroke();
  }
  // ---- salt rings, born of arrivals ------------------------------------------------------
  var lt = T % 35;
  for (var j = 0; j < ringSeeds.length; j++) {
    var age = lt - j * 2.9;
    if (age < 0 || age > 5.5) continue;
    var rr = (4 + age * 9.5) * ringSeeds[j].w;
    var ra = 0.55 * (1 - age / 5.5) * smooth(age / 0.5);
    ctx.strokeStyle = rgba(SALT, ra);
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.ellipse(P2.x + ringSeeds[j].jx, P2.y + ringSeeds[j].jy, rr, rr * 0.36, 0, 0, Math.PI * 2); ctx.stroke();
  }
  // ---- the stream itself ---------------------------------------------------------------------
  for (var p = 0; p < parts.length; p++) {
    var pt = parts[p];
    var sp = (T / 16 + pt.off) % 1;
    var pos = bez(sp);
    var x = pos.x + pt.jx * Math.sin(sp * Math.PI);
    var y = pos.y + pt.jy * Math.sin(sp * Math.PI);
    var fade = Math.min(1, sp / 0.06) * (sp > 0.94 ? Math.max(0, (1 - sp) / 0.06) : 1);
    ctx.fillStyle = rgba(ICEW, 0.16 * fade);
    ctx.beginPath(); ctx.arc(x, y, 4.4 * pt.sz, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(ICEW, 0.9 * fade);
    ctx.beginPath(); ctx.arc(x, y, 1.9 * pt.sz, 0, Math.PI * 2); ctx.fill();
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GLACIER;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: the three fields fill the frame edge to edge
  var S = Math.max(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
