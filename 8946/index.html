<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mold and Chisel — No. 8946</title>
<!-- phantom-fill-8946 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0d100e;color:#dfe3d4;overflow:hidden;
    font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif}
  #c{position:fixed;inset:0;display:block;cursor:crosshair}
  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
    justify-content:space-between;padding:28px 32px 26px}
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(26px,4vw,44px);
    line-height:1.05;color:#f0eee2}
  h1 em{font-style:italic;color:#b9a86a}
  .no{font-size:11px;letter-spacing:.28em;color:#7d8471;text-transform:uppercase;text-align:right;line-height:1.9}
  .wind{display:flex;align-items:center;gap:14px}
  #arrow{width:44px;height:44px;transition:transform .8s ease}
  .wind b{display:block;font-size:22px;font-weight:600;color:#f0eee2;font-variant-numeric:tabular-nums}
  .wind span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#7d8471}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
  .hint{font-size:12px;color:#8a9078;line-height:1.7;max-width:380px}
  .hint b{color:#dfe3d4;font-weight:600}
  .ctl{pointer-events:auto;display:flex;gap:10px;align-items:center}
  button{font:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    background:transparent;color:#dfe3d4;border:1px solid rgba(223,227,212,.35);
    padding:11px 18px;cursor:pointer;transition:all .25s}
  button:hover{background:#dfe3d4;color:#0d100e}
  .count{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7d8471;
    font-variant-numeric:tabular-nums}
  @media(max-width:560px){.hud{padding:20px}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="top">
    <h1>Mold <em>&amp;</em> Chisel</h1>
    <div class="no">No. 8946<br>Fog-sculpture instrument</div>
  </div>
  <div class="wind">
    <svg id="arrow" viewBox="0 0 44 44" fill="none">
      <circle cx="22" cy="22" r="20" stroke="rgba(223,227,212,.25)"/>
      <path d="M22 10 L28 24 L22 20 L16 24 Z" fill="#b9a86a"/>
    </svg>
    <div><b id="windSpd">3.2 m/s</b><span id="windDir">wind · NW</span></div>
  </div>
  <div class="bottom">
    <p class="hint"><b>Click to place a fog emitter.</b> Drag one to move it.
    The wind carves what you pour. <b>Begin anew</b> ghosts the last
    sculpture and clears the air.</p>
    <div class="ctl">
      <span class="count" id="count">0 emitters</span>
      <button id="anew">Begin anew</button>
    </div>
  </div>
</div>
<script>
(function(){
  const cv=document.getElementById('c'), ctx=cv.getContext('2d');
  let W,H,dpr;
  function resize(){
    dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ghost.width=W*dpr; ghost.height=H*dpr;
  }
  const ghost=document.createElement('canvas'), gtx=ghost.getContext('2d');
  let ghostAlpha=0;
  addEventListener('resize',resize);
  const emitters=[], parts=[];
  const MAXP=900;
  // wind: slow turning direction + gusting strength
  function windAt(t){
    const ang=Math.sin(t*.05)*1.1+Math.sin(t*.013+2)*.7-0.6;
    const spd=2.2+1.6*Math.sin(t*.07+1)+.8*Math.sin(t*.23);
    return {ang:ang, spd:Math.max(.6,spd)};
  }
  function spawn(e){
    if(parts.length>=MAXP) parts.shift();
    const a=Math.random()*Math.PI*2, r=Math.random()*6;
    parts.push({x:e.x+Math.cos(a)*r, y:e.y+Math.sin(a)*r,
      vx:(Math.random()-.5)*4, vy:(Math.random()-.5)*4,
      life:0, max:5+Math.random()*6, r:14+Math.random()*26,
      ph:Math.random()*7});
  }
  const arrow=document.getElementById('arrow'), windSpd=document.getElementById('windSpd'),
    windDir=document.getElementById('windDir'), countEl=document.getElementById('count');
  const DIRS=['N','NE','E','SE','S','SW','W','NW'];
  function updateWindUI(t){
    const w=windAt(t);
    arrow.style.transform='rotate('+((w.ang*180/Math.PI)+90).toFixed(1)+'deg)';
    windSpd.textContent=w.spd.toFixed(1)+' m/s';
    const deg=(((w.ang*180/Math.PI)+90)%360+360)%360; // math angle -> compass bearing
    windDir.textContent='wind · '+DIRS[Math.round(deg/45)%8];
  }
  function updateCount(){ countEl.textContent=emitters.length+' emitter'+(emitters.length===1?'':'s'); }
  // interaction: click places, drag moves nearest emitter within 26px
  let drag=null;
  function pos(e){ const r=cv.getBoundingClientRect();
    return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  cv.addEventListener('pointerdown',e=>{
    const p=pos(e);
    drag=emitters.find(em=>Math.hypot(em.x-p.x,em.y-p.y)<26)||null;
    if(!drag){ emitters.push({x:p.x,y:p.y}); drag=emitters[emitters.length-1]; updateCount(); }
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove',e=>{ if(drag){ const p=pos(e); drag.x=p.x; drag.y=p.y; } });
  cv.addEventListener('pointerup',()=>{ drag=null; });
  document.getElementById('anew').addEventListener('click',()=>{
    // ghost the current sculpture, then clear the air
    gtx.setTransform(1,0,0,1,0,0); gtx.clearRect(0,0,ghost.width,ghost.height);
    gtx.drawImage(cv,0,0);
    ghostAlpha=.55; parts.length=0;
  });
  // seed two emitters so the piece is alive on load
  resize();
  emitters.push({x:W*.32,y:H*.62},{x:W*.68,y:H*.42}); updateCount();
  let last=performance.now(), t=0, windTick=0;
  function frame(nowMs){
    const dt=Math.min((nowMs-last)/1000,.05); last=nowMs; t+=dt;
    const w=windAt(t), wx=Math.cos(w.ang)*w.spd*14, wy=Math.sin(w.ang)*w.spd*14;
    for(const e of emitters) for(let i=0;i<3;i++) spawn(e);
    ctx.clearRect(0,0,W,H);
    // ghost of the last sculpture, slowly fading
    if(ghostAlpha>0.004){
      ctx.save(); ctx.globalAlpha=ghostAlpha;
      ctx.drawImage(ghost,0,0,W,H); ctx.restore();
      ghostAlpha*=Math.pow(.5,dt/45); // ~45s half-life
    }
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i]; p.life+=dt;
      if(p.life>p.max){ parts.splice(i,1); continue; }
      // wind + curl-ish wobble
      p.vx+=(wx-p.vx)*dt*.8+Math.sin(t*1.3+p.ph)*6*dt;
      p.vy+=(wy-p.vy)*dt*.8+Math.cos(t*1.1+p.ph)*6*dt;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      const fade=Math.sin(Math.PI*Math.min(p.life/p.max,1));
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      g.addColorStop(0,'rgba(216,222,204,'+(0.10*fade).toFixed(3)+')');
      g.addColorStop(1,'rgba(216,222,204,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    }
    // emitters: brass points
    for(const e of emitters){
      ctx.beginPath(); ctx.arc(e.x,e.y,4,0,7);
      ctx.fillStyle='#b9a86a'; ctx.fill();
      ctx.beginPath(); ctx.arc(e.x,e.y,9,0,7);
      ctx.strokeStyle='rgba(185,168,106,.5)'; ctx.lineWidth=1; ctx.stroke();
    }
    windTick+=dt;
    if(windTick>.5){ windTick=0; updateWindUI(t); }
    requestAnimationFrame(frame);
  }
  updateWindUI(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
