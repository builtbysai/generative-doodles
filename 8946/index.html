<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mold and Chisel · №8946</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0e1a; overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 70vw;
    font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(220, 226, 244, 0.62); letter-spacing: 0.01em;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 system-ui, sans-serif;
    color: rgba(220, 226, 244, 0.38);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #ui {
    position: fixed; right: 14px; top: 64px; z-index: 5;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    font: 400 13px/1.5 system-ui, sans-serif;
  }
  .btn {
    font: 500 13px/1.4 system-ui, sans-serif; color: #dfe4f2;
    background: rgba(70, 90, 150, 0.25); border: 1px solid rgba(160,180,230,0.5);
    border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  .btn.on { background: rgba(160,180,230,0.35); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui">
  <button class="btn" id="rerun">run the same script again</button>
  <button class="btn" id="newscript">write a new script</button>
  <button class="btn" id="wind">show the wind</button>
</div>
<div id="cap">The valves follow the script. The wind does not. Run the same script twice and compare the sculptures.</div>
<div id="seedtag"></div>
<script>
"use strict";
/* ============================================================
   Mold and Chisel — №8946 (2026-07-09), seed 247
   From Nakaya's doctrine: the atmosphere is the mold and the
   wind is the chisel. The only artist controls are emitter
   placement and a pressure schedule (the valve script, drawn as
   a timeline). A seeded wind field sculpts the fog live. The
   same script never performs twice: rerunning keeps the last
   sculpture as a ghost for comparison.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 247;
document.getElementById("seedtag").textContent = "seed " + seed;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
const acc = document.createElement("canvas");   // accumulation
const ghost = document.createElement("canvas"); // last run
const actx = acc.getContext("2d"), gtx = ghost.getContext("2d");
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  acc.width = canvas.width; acc.height = canvas.height;
  actx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ghost.width = canvas.width; ghost.height = canvas.height;
  gtx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize); resize();

/* ---------- seeded value noise ---------- */
function makeNoise(r) {
  const P = 256, g = new Float32Array(P * P);
  for (let i = 0; i < P * P; i++) g[i] = r();
  function n2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const s = (a, b) => g[((b % P + P) % P) * P + ((a % P + P) % P)];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return s(xi, yi) * (1 - u) * (1 - v) + s(xi + 1, yi) * u * (1 - v) +
           s(xi, yi + 1) * (1 - u) * v + s(xi + 1, yi + 1) * u * v;
  }
  return (x, y) => n2(x * 0.7, y * 0.7) * 0.6 + n2(x * 1.7 + 9, y * 1.7 + 3) * 0.4;
}

/* ---------- script: emitters + pressure schedule ---------- */
const CYCLE = 60;
let scriptSeed = seed, windSeed = seed + 1000, runNo = 1;
let emitters = [], schedule = [];
let noise = null, t0 = performance.now();

function buildScript() {
  const r = mulberry32(scriptSeed);
  const n = 5 + Math.floor(r() * 3);
  emitters = [];
  for (let i = 0; i < n; i++) emitters.push({ x: 0.08 + 0.84 * (i / (n - 1)) + (r() - 0.5) * 0.04 });
  schedule = [];
  for (let i = 0; i < n; i++) {
    const row = [], steps = 24;
    let v = 0.3 + r() * 0.5;
    for (let k = 0; k < steps; k++) {
      v += (r() - 0.5) * 0.35; v = Math.max(0.05, Math.min(1, v));
      row.push(v);
    }
    schedule.push(row);
  }
}
function pressure(i, t) {
  const row = schedule[i], k = (t / CYCLE * row.length) % row.length;
  const a = Math.floor(k), b = (a + 1) % row.length, f = k - a;
  return row[a] * (1 - f) + row[b] * f;
}
function windAt(x, y, t) {
  const n1 = noise(x * 3 + t * 0.11, y * 3);
  const n2 = noise(x * 3 + 40, y * 3 + t * 0.07);
  const gust = Math.pow(noise(t * 0.05, 3.7), 3) * 2.2;
  const turb = noise(x * 9 + t * 0.35, y * 9) - 0.5;
  return { x: (n1 - 0.5) * 1.6 + 0.5 + gust + turb * 0.9, y: (n2 - 0.5) * 1.1 - 0.25 + turb * 0.5 };
}

/* ---------- fog particles ---------- */
const sprite = document.createElement("canvas");
sprite.width = sprite.height = 64;
{
  const c = sprite.getContext("2d");
  const g = c.createRadialGradient(32, 32, 2, 32, 32, 32);
  g.addColorStop(0, "rgba(215,225,250,0.55)");
  g.addColorStop(0.5, "rgba(190,205,240,0.18)");
  g.addColorStop(1, "rgba(190,205,240,0)");
  c.fillStyle = g; c.fillRect(0, 0, 64, 64);
}
let parts = [];
let emitY = 0;
function spawn(t) {
  for (let i = 0; i < emitters.length; i++) {
    const p = pressure(i, t);
    if (Math.random() < p * 0.85) {
      parts.push({
        x: emitters[i].x * W + (Math.random() - 0.5) * 14,
        y: emitY,
        vx: (Math.random() - 0.5) * 24, vy: -40 - Math.random() * 45,
        life: 0, max: 5 + Math.random() * 7,
        sz: 26 + Math.random() * 60
      });
    }
  }
  if (parts.length > 700) parts.splice(0, parts.length - 700);
}
function step(t, dt) {
  spawn(t);
  const k = Math.min(1, 2.2 * dt);
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    const w = windAt(q.x / W, q.y / H, t);
    q.vx += (w.x * 60 - q.vx) * k;
    q.vy += (w.y * 60 - 18 - q.vy) * k;
    q.x += q.vx * dt; q.y += q.vy * dt; q.life += dt;
    if (q.life > q.max || q.y < -80) parts.splice(i, 1);
  }
}

/* ---------- ui ---------- */
let showWind = false;
document.getElementById("rerun").addEventListener("click", () => {
  gtx.clearRect(0, 0, W, H);
  gtx.drawImage(acc, 0, 0, W, H);
  actx.clearRect(0, 0, W, H);
  parts = [];
  windSeed += 1; noise = makeNoise(mulberry32(windSeed));
  runNo++; t0 = performance.now();
});
document.getElementById("newscript").addEventListener("click", () => {
  scriptSeed = (scriptSeed * 1664525 + 1013904223) >>> 0;
  gtx.clearRect(0, 0, W, H);
  gtx.drawImage(acc, 0, 0, W, H);
  actx.clearRect(0, 0, W, H);
  parts = [];
  buildScript(); windSeed += 1; noise = makeNoise(mulberry32(windSeed));
  runNo = 1; t0 = performance.now();
});
document.getElementById("wind").addEventListener("click", (e) => {
  showWind = !showWind;
  e.target.classList.toggle("on", showWind);
});

buildScript();
noise = makeNoise(mulberry32(windSeed));

function drawFrame(now) {
  const t = (now - t0) / 1000;
  const dt = Math.min(0.05, 1 / 60);
  const narrow = W <= 700;
  const pad = Math.min(W, H) * 0.06;
  const stripSh = pad * 1.2;
  const sy = narrow ? H - 168 : H - stripSh - 66;
  emitY = sy - 30;
  if (t >= CYCLE) {  // cycle end: auto rerun, same script, new wind
    document.getElementById("rerun").click();
    return requestAnimationFrame(drawFrame);
  }
  step(t, dt);

  ctx.clearRect(0, 0, W, H);
  // ghost of last run
  ctx.globalAlpha = 0.28;
  ctx.drawImage(ghost, 0, 0, W, H);
  ctx.globalAlpha = 1;
  // fade + accumulate
  actx.save();
  actx.globalCompositeOperation = "destination-out";
  actx.fillStyle = "rgba(0,0,0,0.006)";
  actx.fillRect(0, 0, W, H);
  actx.restore();
  for (const q of parts) {
    const a = Math.sin(Math.PI * Math.min(1, q.life / q.max)) * 0.5;
    actx.globalAlpha = a * 0.10;
    actx.drawImage(sprite, q.x - q.sz / 2, q.y - q.sz / 2, q.sz, q.sz);
  }
  actx.globalAlpha = 1;
  ctx.drawImage(acc, 0, 0, W, H);

  // emitters
  ctx.fillStyle = "rgba(160,180,230,0.8)";
  emitters.forEach((e, i) => {
    const p = pressure(i, t);
    ctx.beginPath();
    ctx.arc(e.x * W, emitY, 2 + p * 3, 0, Math.PI * 2);
    ctx.fill();
  });

  // wind overlay
  if (showWind) {
    ctx.strokeStyle = "rgba(150,190,255,0.28)";
    ctx.lineWidth = 1;
    for (let gx = 0; gx < 16; gx++) for (let gy = 0; gy < 10; gy++) {
      const x = (gx + 0.5) / 16 * W, y = (gy + 0.5) / 10 * H * 0.85;
      const w = windAt(x / W, y / H, t);
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.lineTo(x + w.x * 22, y + w.y * 22); ctx.stroke();
    }
  }

  // valve script strip
  const sh = stripSh;
  ctx.fillStyle = "rgba(10,12,24,0.72)";
  ctx.fillRect(pad, sy, W - pad * 2, sh + 26);
  const rows = schedule.length;
  schedule.forEach((row, i) => {
    const ry = sy + 4 + i * (sh / rows);
    for (let k = 0; k < row.length; k++) {
      const bw = (W - pad * 2) / row.length;
      const bh = row[k] * (sh / rows - 2);
      ctx.fillStyle = "rgba(150,180,240,0.55)";
      ctx.fillRect(pad + k * bw, ry + (sh / rows - 2) - bh, bw - 1, bh);
    }
  });
  const px = pad + (t / CYCLE) * (W - pad * 2);
  ctx.strokeStyle = "rgba(240,200,120,0.9)";
  ctx.beginPath(); ctx.moveTo(px, sy); ctx.lineTo(px, sy + sh + 4); ctx.stroke();

  // title + run tag
  ctx.fillStyle = "rgba(220,226,244,0.92)";
  ctx.font = "600 " + Math.round(Math.min(W, H) * 0.032) + "px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("№8946 · Mold and Chisel", pad, pad * 1.7);
  ctx.fillStyle = "rgba(220,226,244,0.6)";
  ctx.font = "400 " + Math.round(Math.min(W, H) * 0.022) + "px system-ui, sans-serif";
  ctx.fillText("valve script · run " + runNo + " · " + Math.floor(t) + "s / " + CYCLE + "s", pad, sy + sh + 20);

  requestAnimationFrame(drawFrame);
}
requestAnimationFrame(drawFrame);
</script>
</body>
</html>
