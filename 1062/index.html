<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixty-Seven Boards</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0B0C; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (strict) ----------
  var WALL = '#0A0B0C';
  var MASKS = ['#0E5B3C', '#123F2E', '#1A1A1A'];
  var COPPER = [184, 115, 51];    // #B87333
  var SILK = [237, 230, 218];     // #EDE6DA
  var LEDCOLS = [
    [255, 34, 17],                // #FF2211 red
    [61, 220, 132],               // #3DDC84 green
    [255, 184, 0]                 // #FFB800 amber
  ];
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  // ---------- wall geometry ----------
  var WALL_W = 1920, WALL_H = 1280;
  var COLS = 6, ROWS = 4, NBOARDS = 24;
  var T0 = 14;                    // frame one lives at t = 14 s, fixed phase
  var BASE_SEED = 1062231;

  var LABELS = [
    'OSC-01', 'ARTNET-REV-C', 'SYNC-TEST-7', 'DMX-REV-B', 'SYNC-02', 'OSC-04',
    'PWR-TEST-3', 'ARTNET-REV-A', 'MIDI-CLK-2', 'SYNC-TEST-9', 'DMX-REV-D', 'OSC-07',
    'CLK-DIV-5', 'PWR-REV-C', 'ARTNET-08', 'SYNC-11', 'DMX-TEST-4', 'OSC-12',
    'HUB-REV-B', 'CLK-TEST-6', 'PWR-09', 'MIDI-REV-A', 'SYNC-TEST-2', 'OSC-REV-C'
  ];
  var GRAMMARS = ['heartbeat', 'sweep', 'morse', 'breath', 'irregular'];

  // ---------- board generation ----------
  function genTrace(rng, bw, bh) {
    var m = 18, g = 14;
    var x = m + Math.floor(rng() * Math.max(1, ((bw - 2 * m) / g))) * g;
    var y = m + Math.floor(rng() * Math.max(1, ((bh - 2 * m) / g))) * g;
    var pts = [[x, y]];
    var horiz = rng() < 0.5;
    var segs = 2 + Math.floor(rng() * 3);
    for (var s = 0; s < segs; s++) {
      var len = g * (1 + Math.floor(rng() * 4));
      var dir = rng() < 0.5 ? -1 : 1;
      if (horiz) x += dir * len; else y += dir * len;
      if (x < m) x = m; if (x > bw - m) x = bw - m;
      if (y < m) y = m; if (y > bh - m) y = bh - m;
      pts.push([x, y]);
      horiz = !horiz;
    }
    return pts;
  }

  function genBoard(rng, idx, label, grammar) {
    var cellW = WALL_W / COLS, cellH = WALL_H / ROWS;
    var col = idx % COLS, row = Math.floor(idx / COLS);
    var bw = cellW * (0.70 + rng() * 0.10);
    var bh = cellH * (0.58 + rng() * 0.11);
    var bx = col * cellW + (cellW - bw) / 2 + (rng() - 0.5) * 26;
    var by = row * cellH + (cellH - bh) / 2 + (rng() - 0.5) * 22;

    var traces = [];
    var nTr = 3 + Math.floor(rng() * 6);          // 3-8 traces
    for (var i = 0; i < nTr; i++) traces.push(genTrace(rng, bw, bh));

    var vias = [];
    var nVia = 2 + Math.floor(rng() * 4);
    for (var v = 0; v < nVia; v++) {
      vias.push([16 + rng() * (bw - 32), 16 + rng() * (bh - 32)]);
    }

    var chips = [];
    var nChip = Math.floor(rng() * 3);            // 0-2 chips
    for (var ch = 0; ch < nChip; ch++) {
      chips.push({
        x: 20 + rng() * (bw - 90), y: 26 + rng() * (bh - 90),
        w: 34 + rng() * 28, h: 22 + rng() * 18
      });
    }

    var ledCount = 3 + Math.floor(rng() * 4);     // 3-6 LEDs
    var ledRowBottom = rng() < 0.62;
    var leds = [];
    for (var L = 0; L < ledCount; L++) {
      if (ledRowBottom) leds.push([18 + L * 16, bh - 15]);
      else leds.push([bw - 15, 18 + L * 16]);
    }

    var b = {
      x: bx, y: by, w: bw, h: bh,
      mask: MASKS[Math.floor(rng() * MASKS.length)],
      ledCol: LEDCOLS[Math.floor(rng() * LEDCOLS.length)],
      label: label,
      traces: traces, vias: vias, chips: chips, leds: leds,
      grammar: grammar,
      phase: 0, period: 1, blinks: null, morse: null
    };

    // per-grammar timing, all seeded, all closed-form in t
    if (grammar === 'heartbeat') {
      b.period = 1.5 + rng() * 0.5;
    } else if (grammar === 'sweep') {
      b.period = 2.2 + rng() * 1.3;
    } else if (grammar === 'breath') {
      b.period = 4.2 + rng() * 2.6;
    } else if (grammar === 'irregular') {
      b.period = 9 + rng() * 5;                   // long cycle, sparse blinks
      b.blinks = [];
      var nb = 3 + Math.floor(rng() * 3);         // 3-5 single blinks per cycle
      for (var k = 0; k < nb; k++) {
        b.blinks.push({ at: rng() * (b.period - 0.4), dur: 0.09 + rng() * 0.11 });
      }
    } else if (grammar === 'morse') {
      var syms = [], total = 0;
      var nSym = 5 + Math.floor(rng() * 5);
      for (var s2 = 0; s2 < nSym; s2++) {
        var dash = rng() < 0.38;
        var d = dash ? 0.36 : 0.12;
        syms.push({ at: total, dur: d });
        total += d + 0.13;
        if (rng() < 0.22) total += 0.3;           // letter gap
      }
      b.morse = syms;
      b.period = total + 1.4 + rng() * 1.4;       // long dark rest after the word
    }
    b.phase = rng() * b.period;
    return b;
  }

  var boards = [];
  function buildWall(seed) {
    var rng = mulberry32(seed);
    // shuffle labels so each board gets a distinct one
    var labs = LABELS.slice();
    for (var i = labs.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = labs[i]; labs[i] = labs[j]; labs[j] = tmp;
    }
    // grammar roster shuffled: the wall always holds a mix of all five
    var roster = [];
    for (var r = 0; r < NBOARDS; r++) roster.push(GRAMMARS[r % GRAMMARS.length]);
    for (var q = roster.length - 1; q > 0; q--) {
      var j2 = Math.floor(rng() * (q + 1));
      var tmp2 = roster[q]; roster[q] = roster[j2]; roster[j2] = tmp2;
    }
    boards = [];
    for (var n = 0; n < NBOARDS; n++) boards.push(genBoard(rng, n, labs[n], roster[n]));
  }
  var seedNow = BASE_SEED;
  buildWall(seedNow);

  // ---------- LED brightness: closed-form (board, t) ----------
  function pulse(u, c, w) {
    var d = Math.abs(u - c);
    if (d > 0.5) d = 1 - d;
    return Math.exp(-(d * d) / (w * w));
  }
  function ledBrightness(b, i, t) {
    var u = ((t + b.phase) % b.period) / b.period;
    var tt = (t + b.phase) % b.period;
    if (b.grammar === 'heartbeat') {
      return Math.min(1, pulse(u, 0.03, 0.055) + 0.8 * pulse(u, 0.20, 0.05));
    }
    if (b.grammar === 'sweep') {
      var n = b.leds.length;
      var p = u * (n + 1.6) - 0.8;
      var d = Math.abs(i - p);
      return Math.max(0, 1 - d * 0.9);
    }
    if (b.grammar === 'breath') {
      var s = 0.5 - 0.5 * Math.cos(2 * Math.PI * u);
      return 0.12 + 0.88 * Math.pow(s, 1.2);
    }
    if (b.grammar === 'irregular') {
      for (var k = 0; k < b.blinks.length; k++) {
        var bl = b.blinks[k];
        if (tt >= bl.at && tt <= bl.at + bl.dur) {
          var f = (tt - bl.at) / bl.dur;
          return Math.sin(f * Math.PI);
        }
      }
      return 0;
    }
    if (b.grammar === 'morse') {
      for (var s2 = 0; s2 < b.morse.length; s2++) {
        var sy = b.morse[s2];
        if (tt >= sy.at && tt <= sy.at + sy.dur) {
          var f2 = Math.min(1, Math.min(tt - sy.at, sy.at + sy.dur - tt) / 0.025);
          return Math.max(0, f2);
        }
      }
      return 0;
    }
    return 0;
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1;
  var phoneNow = false;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width || 0;
      h = window.visualViewport.height || 0;
    }
    if (!w && typeof window !== 'undefined') { w = window.innerWidth || 720; h = window.innerHeight || 720; }
    W = w; H = h;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    phoneNow = isPhone();
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  resize();

  // ---------- camera ----------
  function baseScale() {
    var tw = phoneNow ? 1080 : 1250;
    var th = phoneNow ? 1180 : 900;
    return Math.max(W / tw, H / th);
  }
  function panCenter(t) {
    var s = baseScale();
    var visW = W / s, visH = H / s;
    var ampX = Math.max(0, (WALL_W - visW) / 2 - 12);
    var ampY = Math.max(0, (WALL_H - visH) / 2 - 12);
    if (ampX > 300) ampX = 300;
    if (ampY > 170) ampY = 170;
    return {
      x: WALL_W / 2 + ampX * Math.sin(t * 2 * Math.PI / 90),
      y: WALL_H / 2 + ampY * Math.sin(t * 2 * Math.PI / 67 + 1.3)
    };
  }

  // inspect state: browser interaction only, defaults keep frame one clean
  var inspecting = false;
  var ptrX = 0, ptrY = 0, anchorWX = 0, anchorWY = 0;
  var zoomCur = 1, icx = WALL_W / 2, icy = WALL_H / 2;
  var lastTapMs = -1e9, lastTapX = 0, lastTapY = 0;

  function nowMs() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return 0;
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      ptrX = e.clientX; ptrY = e.clientY;
      var pc = panCenter(tNow);
      var s = baseScale() * zoomCur;
      anchorWX = icx + (ptrX - W / 2) / s;
      anchorWY = icy + (ptrY - H / 2) / s;
      inspecting = true;
      var ms = nowMs();
      if (ms - lastTapMs < 350 &&
          Math.abs(ptrX - lastTapX) < 30 && Math.abs(ptrY - lastTapY) < 30) {
        seedNow += 1;
        buildWall(seedNow);
        lastTapMs = -1e9;
      } else {
        lastTapMs = ms; lastTapX = ptrX; lastTapY = ptrY;
      }
    });
    canvas.addEventListener('pointermove', function (e) {
      if (inspecting) { ptrX = e.clientX; ptrY = e.clientY; }
    });
    var endDrag = function () { inspecting = false; };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
  }

  // ---------- drawing ----------
  function drawBoard(b, t) {
    // board body
    ctx.fillStyle = b.mask;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = rgba(SILK, 0.16);
    ctx.lineWidth = 1.2;
    ctx.strokeRect(b.x + 0.6, b.y + 0.6, b.w - 1.2, b.h - 1.2);

    // mounting holes: silkscreen ring, wall-dark centre
    var holes = [[10, 10], [b.w - 10, 10], [10, b.h - 10], [b.w - 10, b.h - 10]];
    for (var hi = 0; hi < 4; hi++) {
      ctx.beginPath();
      ctx.arc(b.x + holes[hi][0], b.y + holes[hi][1], 4.6, 0, 2 * Math.PI);
      ctx.fillStyle = WALL;
      ctx.fill();
      ctx.strokeStyle = rgba(SILK, 0.4);
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // copper traces with pads
    ctx.strokeStyle = rgba(COPPER, 0.85);
    ctx.fillStyle = rgba(COPPER, 0.9);
    ctx.lineWidth = 2.6;
    ctx.lineJoin = 'miter';
    for (var i = 0; i < b.traces.length; i++) {
      var pts = b.traces[i];
      ctx.beginPath();
      ctx.moveTo(b.x + pts[0][0], b.y + pts[0][1]);
      for (var p = 1; p < pts.length; p++) ctx.lineTo(b.x + pts[p][0], b.y + pts[p][1]);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.x + pts[0][0], b.y + pts[0][1], 4, 0, 2 * Math.PI);
      ctx.fill();
      var last = pts[pts.length - 1];
      ctx.beginPath();
      ctx.arc(b.x + last[0], b.y + last[1], 3.4, 0, 2 * Math.PI);
      ctx.strokeStyle = rgba(COPPER, 0.9);
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.strokeStyle = rgba(COPPER, 0.85);
      ctx.lineWidth = 2.6;
    }

    // vias
    ctx.fillStyle = rgba(COPPER, 0.65);
    for (var v = 0; v < b.vias.length; v++) {
      ctx.beginPath();
      ctx.arc(b.x + b.vias[v][0], b.y + b.vias[v][1], 1.8, 0, 2 * Math.PI);
      ctx.fill();
    }

    // chips: dark bodies with copper pin ticks
    for (var ch = 0; ch < b.chips.length; ch++) {
      var c = b.chips[ch];
      ctx.fillStyle = '#0C0D0F';
      ctx.fillRect(b.x + c.x, b.y + c.y, c.w, c.h);
      ctx.strokeStyle = rgba(SILK, 0.28);
      ctx.lineWidth = 1;
      ctx.strokeRect(b.x + c.x, b.y + c.y, c.w, c.h);
      ctx.strokeStyle = rgba(COPPER, 0.55);
      var pins = Math.max(3, Math.floor(c.w / 9));
      for (var pn = 0; pn < pins; pn++) {
        var px = b.x + c.x + 5 + pn * ((c.w - 10) / Math.max(1, pins - 1));
        ctx.beginPath();
        ctx.moveTo(px, b.y + c.y - 3); ctx.lineTo(px, b.y + c.y);
        ctx.moveTo(px, b.y + c.y + c.h); ctx.lineTo(px, b.y + c.y + c.h + 3);
        ctx.stroke();
      }
      ctx.fillStyle = rgba(SILK, 0.5);
      ctx.beginPath();
      ctx.arc(b.x + c.x + 6, b.y + c.y + 6, 1.6, 0, 2 * Math.PI);
      ctx.fill();
    }

    // silkscreen label: the only text in the piece
    ctx.fillStyle = rgba(SILK, 0.85);
    ctx.font = '600 10.5px ui-monospace, Menlo, Consolas, monospace';
    ctx.textBaseline = 'top';
    ctx.fillText(b.label, b.x + 16, b.y + 6);

    // LEDs
    for (var L = 0; L < b.leds.length; L++) {
      var lx = b.x + b.leds[L][0], ly = b.y + b.leds[L][1];
      var br = ledBrightness(b, L, t);
      // unlit body of the LED
      ctx.beginPath();
      ctx.arc(lx, ly, 3.1, 0, 2 * Math.PI);
      ctx.fillStyle = rgba(b.ledCol, 0.16);
      ctx.fill();
      if (br > 0.01) {
        ctx.beginPath();
        ctx.arc(lx, ly, 9.5, 0, 2 * Math.PI);
        ctx.fillStyle = rgba(b.ledCol, br * 0.26);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(lx, ly, 3.1, 0, 2 * Math.PI);
        ctx.fillStyle = rgba(b.ledCol, 0.25 + 0.75 * br);
        ctx.fill();
      }
    }
  }

  var tNow = T0;
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var pc = panCenter(t);
    var bs = baseScale();

    // ease inspect camera (identity at rest: frame one is pure pan)
    var zTarget = inspecting ? 1.85 : 1;
    zoomCur += (zTarget - zoomCur) * 0.07;
    if (Math.abs(zoomCur - 1) < 0.002 && !inspecting) zoomCur = 1;
    if (inspecting) {
      var sT = bs * 1.85;
      var dcx = anchorWX - (ptrX - W / 2) / sT;
      var dcy = anchorWY - (ptrY - H / 2) / sT;
      icx += (dcx - icx) * 0.10;
      icy += (dcy - icy) * 0.10;
    } else {
      icx += (pc.x - icx) * 0.06;
      icy += (pc.y - icy) * 0.06;
    }
    var useInspect = inspecting || zoomCur > 1.002;
    var cx = useInspect ? icx : pc.x;
    var cy = useInspect ? icy : pc.y;
    var s = bs * zoomCur;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);
    ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * (W / 2 - cx * s), DPR * (H / 2 - cy * s));

    for (var i = 0; i < boards.length; i++) drawBoard(boards[i], t);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // frame one: synchronous, fixed phase
  var p0 = panCenter(T0);
  icx = p0.x; icy = p0.y;
  draw(T0);

  // animation: anchored replay, elapsed time added to the fixed phase
  var startTs = null;
  function frame(ts) {
    if (startTs === null) startTs = ts;
    tNow = T0 + (ts - startTs) / 1000;
    draw(tNow);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
