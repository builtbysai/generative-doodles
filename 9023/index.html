<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9023 · Self-Planned Town — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14110c;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 620px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #d9a441; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #ece2c8;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #d9a441; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9023</span> · Self-Planned Town</h1>
  <p>Streets that grew themselves: surveyors walk outward from scattered
  starts until they run into another road, the way real towns accrete.
  <b>Click the piece for a new survey.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 902302;
const TAU = Math.PI * 2;
const VU = 1000;
const PAPER = "#ece2c8";
const INK = "67,51,31";
const MARGIN = 64;
const STEP = 4.2;
const STOP_DIST = 10;

function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

// ---- road growth: vectors walk, stop on contact ----
function growRoads(rnd){
  const cell = 14;
  const grid = new Map();
  const key = (x, y) => ((x / cell) | 0) + "," + ((y / cell) | 0);
  function stamp(x, y, id){
    const k = key(x, y);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push([x, y, id]);
  }
  function near(x, y, id){
    const cx = (x / cell) | 0, cy = (y / cell) | 0;
    for (let ix = cx - 1; ix <= cx + 1; ix++)
      for (let iy = cy - 1; iy <= cy + 1; iy++){
        const pts = grid.get(ix + "," + iy);
        if (!pts) continue;
        for (const p of pts){
          if (p[2] === id) continue; // a road never collides with itself
          const dx = p[0] - x, dy = p[1] - y;
          if (dx * dx + dy * dy < STOP_DIST * STOP_DIST) return true;
        }
      }
    return false;
  }

  let roadId = 0;
  function walk(sx, sy, heading, grace){
    let x = sx, y = sy;
    const id = roadId++;
    const curving = rnd() < 0.55;
    let turn = curving ? (rnd() < 0.5 ? -1 : 1) * (0.010 + rnd() * 0.020) : 0;
    const pts = [[x, y]];
    let steps = 0;
    while (steps++ < 320){
      if (curving){
        heading += turn;
        turn = clamp(turn * 0.985 + (rnd() - 0.5) * 0.008, -0.06, 0.06);
      } else {
        heading += (rnd() - 0.5) * 0.10;
        if (rnd() < 0.009) heading += (rnd() < 0.5 ? -1 : 1) * (0.7 + rnd() * 0.5);
      }
      x += Math.cos(heading) * STEP;
      y += Math.sin(heading) * STEP;
      if (x < MARGIN || x > VU - MARGIN || y < MARGIN || y > VU - MARGIN) break;
      if (steps > (grace || 0) && near(x, y, id)) break;
      pts.push([x, y]);
      stamp(x, y, id);
    }
    if (pts.length > 14) roads.push({ pts, len: pts.length * STEP });
    return roads[roads.length - 1] || null;
  }

  const roads = [];
  // scattered starts, kept apart
  const starts = [];
  let guard = 0;
  while (starts.length < 26 && guard++ < 1200){
    const x = MARGIN + 40 + rnd() * (VU - 2 * (MARGIN + 40));
    const y = MARGIN + 40 + rnd() * (VU - 2 * (MARGIN + 40));
    let ok = true;
    for (const s of starts){
      if (Math.hypot(s[0] - x, s[1] - y) < 85){ ok = false; break; }
    }
    if (ok) starts.push([x, y]);
  }
  const grown = [];
  for (const s of starts) grown.push(walk(s[0], s[1], rnd() * TAU));
  // branch sprouts off the long roads, roughly perpendicular
  for (const r of grown){
    if (!r || r.len < 420) continue;
    const nBranch = 1 + ((rnd() * 2) | 0);
    for (let b = 0; b < nBranch; b++){
      const i = (r.pts.length * (0.25 + rnd() * 0.5)) | 0;
      const p = r.pts[i], q = r.pts[Math.min(i + 1, r.pts.length - 1)];
      const tangent = Math.atan2(q[1] - p[1], q[0] - p[0]);
      const heading = tangent + (rnd() < 0.5 ? -1 : 1) * (0.9 + rnd() * 0.7);
      walk(p[0], p[1], heading, 10);
    }
  }
  return roads;
}

// ---- town name + surveyed date, recombined per seed ----
function townName(rnd){
  const a = ["Mill","Ash","Thorn","Oakh","Bramble","Cinder","Fen","Har","Lark",
             "Stone","Willow","Pember","Alder","Brook","Hazel","Rye","Moss","Quill"];
  const b = ["bury","ford","wick","ham","stead","holm","mere","field","ton",
             "haven","gate","croft","den","shaw","pool","bourne"];
  const name = a[(rnd() * a.length) | 0] + b[(rnd() * b.length) | 0];
  const year = 1837 + ((rnd() * 84) | 0);
  return { name, year };
}

function generate(){
  const rnd = mulberry32(seed);
  const roads = growRoads(rnd);
  const town = townName(rnd);
  return { roads, town };
}

let ctx;
function setupCanvas(){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = stage.clientWidth;
  const K = S / VU;
  canvas.width = S * dpr; canvas.height = S * dpr;
  ctx = canvas.getContext("2d");
  ctx.setTransform(dpr * K, 0, 0, dpr * K, 0, 0);
  return dpr;
}

function drawPaper(){
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VU, VU);
  // aged mottling
  const rnd = mulberry32(seed ^ 0x77aa);
  for (let i = 0; i < 2600; i++){
    const x = rnd() * VU, y = rnd() * VU, r = 2 + rnd() * 14;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const dark = rnd() < 0.5;
    g.addColorStop(0, dark ? "rgba(120,90,50,0.030)" : "rgba(255,252,240,0.035)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  // faint survey plot grid
  ctx.strokeStyle = "rgba(67,51,31,0.10)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = MARGIN; x <= VU - MARGIN; x += 46){ ctx.moveTo(x, MARGIN); ctx.lineTo(x, VU - MARGIN); }
  for (let y = MARGIN; y <= VU - MARGIN; y += 46){ ctx.moveTo(MARGIN, y); ctx.lineTo(VU - MARGIN, y); }
  ctx.stroke();
}

function drawRoads(roads){
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const maxLen = Math.max(...roads.map(r => r.len), 1);
  // paper halo under each road (lifted ink)
  for (const r of roads){
    const w = 1.6 + 6.4 * Math.sqrt(r.len / maxLen);
    ctx.strokeStyle = "rgba(236,226,200,0.55)";
    ctx.lineWidth = w + 2.4;
    ctx.beginPath();
    r.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.stroke();
  }
  for (const r of roads){
    const w = 1.6 + 6.4 * Math.sqrt(r.len / maxLen);
    ctx.strokeStyle = `rgba(${INK},0.88)`;
    ctx.lineWidth = w;
    ctx.beginPath();
    r.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.stroke();
    // centerline tick on arterials
    if (w > 4.5){
      ctx.strokeStyle = "rgba(236,226,200,0.5)";
      ctx.lineWidth = 1;
      ctx.setLineDash([7, 9]);
      ctx.beginPath();
      r.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function drawFurniture(town){
  // border frame
  ctx.strokeStyle = `rgba(${INK},0.65)`;
  ctx.lineWidth = 2.4;
  ctx.strokeRect(30, 30, VU - 60, VU - 60);
  ctx.lineWidth = 1;
  ctx.strokeRect(40, 40, VU - 80, VU - 80);

  // compass rose, top-right inside frame
  const cx = VU - 112, cy = 118, R = 34;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = `rgba(${INK},0.8)`;
  ctx.fillStyle = `rgba(${INK},0.8)`;
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, R * 0.55, 0, TAU); ctx.stroke();
  for (let i = 0; i < 8; i++){
    const a = i * TAU / 8;
    ctx.save(); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -R); ctx.lineTo(i === 0 ? 5 : 2.6, -R * 0.82); ctx.lineTo(0, 0); ctx.fill();
    ctx.restore();
  }
  ctx.font = "600 22px Georgia, serif";
  ctx.textAlign = "center";
  ctx.fillText("N", 0, -R - 12);
  ctx.restore();

  // cartouche, bottom-left
  const bx = 74, by = VU - 168, bw = 330, bh = 96;
  ctx.fillStyle = "rgba(236,226,200,0.88)";
  ctx.strokeStyle = `rgba(${INK},0.75)`;
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.fill(); ctx.stroke();
  ctx.fillStyle = `rgba(${INK},0.92)`;
  ctx.textAlign = "left";
  ctx.font = "600 27px Georgia, serif";
  ctx.fillText(town.name.toUpperCase(), bx + 18, by + 36);
  ctx.font = "italic 15px Georgia, serif";
  ctx.fillText(`surveyed ${town.year} · county plat`, bx + 18, by + 62);
  // scale bar
  const sy = by + 78;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(bx + 18, sy); ctx.lineTo(bx + 138, sy); ctx.stroke();
  for (let i = 0; i <= 4; i++){
    const x = bx + 18 + i * 30;
    ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x, sy - (i % 2 ? 6 : 10)); ctx.stroke();
  }
  ctx.font = "italic 12px Georgia, serif";
  ctx.fillText("400 rods", bx + 150, sy + 4);

  // vignette to seat the sheet
  const vg = ctx.createRadialGradient(500, 500, 330, 500, 500, 760);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(60,40,20,0.16)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VU, VU);
}

function render(){
  const { roads, town } = generate();
  setupCanvas();
  drawPaper();
  drawRoads(roads);
  drawFurniture(town);
}

window.addEventListener("resize", render);
document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  render();
});
render();
</script>
</body>
</html>
