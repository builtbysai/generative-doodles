<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Five Methods · №8961</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #f2ead8;
    overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 70vw;
    font: 400 13px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(74, 64, 48, 0.78); letter-spacing: 0.01em;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 ui-rounded, system-ui, sans-serif;
    color: rgba(74, 64, 48, 0.45);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="cap">One field, five constructions. Tap for a new field.</div>
<div id="seedtag"></div>
<script>
"use strict";
/* ============================================================
   Five Methods - No.8961 (2026-07-24)
   Seed 258 (Five Methods, One Frame): one seeded scalar field,
   built five ways. Each panel re-derives its construction from
   scratch under one shared constraint: the same field, the same
   paper, the same ink. Contour, stipple, hatch, cells, drift.
   The panels are portraits of their methods, not of each other.
   ============================================================ */

// ---------- seeded PRNG ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 896101;
document.getElementById("seedtag").textContent = "seed " + seed;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

const PAPER = "#f2ead8";
const INK2 = "#33291d";
const ACCENT = "#7a3b22";
const FAINT = "rgba(51,41,29,0.16)";

let W = 0, H = 0, DPR = 1;
let field = null;      // (x,y) in 0..1 -> 0..1
let panels = [];       // layout rects
let drifters = [];
let rand = null;

function makeField(r) {
  // value noise, 3 octaves, seeded lattice
  function lattice(n) {
    const g = [];
    for (let j = 0; j <= n; j++) { g[j] = []; for (let i = 0; i <= n; i++) g[j][i] = r(); }
    return function (x, y) {
      x = Math.min(Math.max(x, 0), 0.9999) * n;
      y = Math.min(Math.max(y, 0), 0.9999) * n;
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const a = g[iy][ix], b = g[iy][ix + 1], c = g[iy + 1][ix], d = g[iy + 1][ix + 1];
      return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
    };
  }
  const n1 = lattice(4), n2 = lattice(9), n3 = lattice(21);
  // normalize roughly to 0..1
  return function (x, y) {
    const v = 0.55 * n1(x, y) + 0.30 * n2(x, y) + 0.15 * n3(x, y);
    return Math.min(1, Math.max(0, (v - 0.18) / 0.64));
  };
}

function buildAll() {
  rand = mulberry32(seed);
  field = makeField(rand);
  layout();
  renderStatic();
  initDrift();
}

function layout() {
  const m = Math.min(W, H) * 0.045;       // outer margin
  const gut = Math.min(W, H) * 0.018;     // gutter
  const fx = m, fy = m * 1.6, fw = W - 2 * m, fh = H - fy - m;
  panels = [];
  const portrait = H > W * 1.05;
  for (let i = 0; i < 5; i++) {
    let x, y, w, h;
    if (portrait) {
      w = fw; h = (fh - 4 * gut) / 5;
      x = fx; y = fy + i * (h + gut);
    } else {
      w = (fw - 4 * gut) / 5; h = fh;
      x = fx + i * (w + gut); y = fy;
    }
    panels.push({ x, y, w, h });
  }
  panels.frame = { x: fx, y: fy, w: fw, h: fh };
}

// ---------- panel 1: contour (marching squares) ----------
function drawContour(p) {
  const nx = 46, ny = Math.max(20, Math.round(46 * p.h / p.w));
  const xs = [], ys = [];
  for (let j = 0; j <= ny; j++) { xs[j] = []; for (let i = 0; i <= nx; i++) xs[j][i] = field(i / nx, j / ny); }
  const levels = 11;
  ctx.strokeStyle = INK2; ctx.lineWidth = Math.max(1, p.w / 340);
  ctx.beginPath();
  for (let L = 1; L < levels; L++) {
    const t = L / levels;
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const a = xs[j][i], b = xs[j][i + 1], c = xs[j + 1][i + 1], d = xs[j + 1][i];
      let idx = 0;
      if (a > t) idx |= 8; if (b > t) idx |= 4; if (c > t) idx |= 2; if (d > t) idx |= 1;
      if (idx === 0 || idx === 15) continue;
      const x0 = p.x + (i / nx) * p.w, y0 = p.y + (j / ny) * p.h;
      const dx = p.w / nx, dy = p.h / ny;
      const T = [null, null, null, null]; // top right bottom left
      if ((a > t) !== (b > t)) { const f = (t - a) / (b - a); T[0] = [x0 + f * dx, y0]; }
      if ((b > t) !== (c > t)) { const f = (t - b) / (c - b); T[1] = [x0 + dx, y0 + f * dy]; }
      if ((d > t) !== (c > t)) { const f = (t - d) / (c - d); T[2] = [x0 + f * dx, y0 + dy]; }
      if ((a > t) !== (d > t)) { const f = (t - a) / (d - a); T[3] = [x0, y0 + f * dy]; }
      const pts = T.filter(Boolean);
      if (pts.length === 2) { ctx.moveTo(pts[0][0], pts[0][1]); ctx.lineTo(pts[1][0], pts[1][1]); }
      else if (pts.length === 4) {
        ctx.moveTo(pts[0][0], pts[0][1]); ctx.lineTo(pts[1][0], pts[1][1]);
        ctx.moveTo(pts[2][0], pts[2][1]); ctx.lineTo(pts[3][0], pts[3][1]);
      }
    }
  }
  ctx.stroke();
}

// ---------- panel 2: stipple ----------
function drawStipple(p) {
  const target = Math.round(p.w * p.h / 160);
  ctx.fillStyle = INK2;
  let placed = 0, guard = 0;
  while (placed < target && guard < target * 14) {
    guard++;
    const x = rand(), y = rand();
    if (rand() < field(x, y) * field(x, y)) {
      const r = Math.max(0.7, (p.w / 340) * (0.6 + rand() * 0.9));
      ctx.beginPath();
      ctx.arc(p.x + x * p.w, p.y + y * p.h, r, 0, 6.2832);
      ctx.fill();
      placed++;
    }
  }
}

// ---------- panel 3: hatch along gradient ----------
function drawHatch(p) {
  const stepX = p.w / 34, stepY = p.h / 34;
  ctx.strokeStyle = INK2;
  ctx.lineWidth = Math.max(1, p.w / 420);
  ctx.beginPath();
  const e = 0.01;
  for (let gy = stepY / 2; gy < p.h; gy += stepY) {
    for (let gx = stepX / 2; gx < p.w; gx += stepX) {
      const u = gx / p.w, v = gy / p.h;
      const gx1 = (field(Math.min(1, u + e), v) - field(Math.max(0, u - e), v)) / (2 * e);
      const gy1 = (field(u, Math.min(1, v + e)) - field(u, Math.max(0, v - e))) / (2 * e);
      const mag = Math.hypot(gx1, gy1);
      if (mag < 0.15) continue;
      const ang = Math.atan2(gy1, gx1) + Math.PI / 2; // along contour
      const len = Math.min(stepX, stepY) * (0.3 + Math.min(1, mag / 6) * 1.3);
      const cx = p.x + gx, cy = p.y + gy;
      ctx.moveTo(cx - Math.cos(ang) * len / 2, cy - Math.sin(ang) * len / 2);
      ctx.lineTo(cx + Math.cos(ang) * len / 2, cy + Math.sin(ang) * len / 2);
    }
  }
  ctx.stroke();
}

// ---------- panel 4: voronoi tone cells ----------
function drawCells(p) {
  const ns = 26;
  const sites = [];
  for (let i = 0; i < ns; i++) sites.push([rand(), rand()]);
  const cw = 7; // coarse cell px
  const bw = Math.ceil(p.w / cw), bh = Math.ceil(p.h / cw);
  for (let j = 0; j < bh; j++) {
    for (let i = 0; i < bw; i++) {
      const u = (i + 0.5) / bw, v = (j + 0.5) / bh;
      let bi = 0, bd = 1e9;
      for (let s = 0; s < ns; s++) {
        const dx = u - sites[s][0], dy = (v - sites[s][1]) * (p.h / p.w);
        const d = dx * dx + dy * dy;
        if (d < bd) { bd = d; bi = s; }
      }
      const f = field(sites[bi][0], sites[bi][1]);
      const t = Math.round(f * 9);
      ctx.fillStyle = t >= 7 ? INK2 : (t >= 4 ? "rgba(51,41,29,0.55)" : (t >= 2 ? "rgba(51,41,29,0.28)" : "rgba(51,41,29,0.0)"));
      if (t >= 2) ctx.fillRect(p.x + i * cw, p.y + j * cw, cw + 0.5, cw + 0.5);
    }
  }
  // nuclei
  ctx.fillStyle = ACCENT;
  for (const s of sites) {
    ctx.beginPath();
    ctx.arc(p.x + s[0] * p.w, p.y + s[1] * p.h, Math.max(1.6, p.w / 300), 0, 6.2832);
    ctx.fill();
  }
}

// ---------- panel 5: drift (animated) ----------
function initDrift() {
  const p = panels[4];
  drifters = [];
  const n = Math.round(p.w * p.h / 1500);
  for (let i = 0; i < n; i++) {
    drifters.push({ x: rand(), y: rand(), a: rand() * 6.2832, sp: 0.0022 + rand() * 0.0042 });
  }
  // seed the panel with a soft field wash so it never starts blank
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
  ctx.fillStyle = "rgba(51,41,29,0.07)";
  const nx = 44;
  for (let j = 0; j < nx; j++) for (let i = 0; i < nx; i++) {
    if (field(i / nx, j / nx) > 0.58) ctx.fillRect(p.x + i / nx * p.w, p.y + j / nx * p.h, p.w / nx + 1, p.h / nx + 1);
  }
  ctx.restore();
}

function stepDrift() {
  const p = panels[4];
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
  // gentle fade toward paper
  ctx.fillStyle = "rgba(242,234,216,0.028)";
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.strokeStyle = "rgba(51,41,29,0.66)";
  ctx.lineWidth = Math.max(1.2, p.w / 380);
  ctx.beginPath();
  const e = 0.008;
  for (const d of drifters) {
    const u = d.x, v = d.y;
    const gx = (field(Math.min(1, u + e), v) - field(Math.max(0, u - e), v));
    const gy = (field(u, Math.min(1, v + e)) - field(u, Math.max(0, v - e)));
    const want = Math.atan2(gy, gx) + Math.PI / 2;
    let da = want - d.a;
    while (da > Math.PI) da -= 6.2832;
    while (da < -Math.PI) da += 6.2832;
    d.a += da * 0.12;
    const px = p.x + d.x * p.w, py = p.y + d.y * p.h;
    d.x += Math.cos(d.a) * d.sp * (0.6 + field(u, v));
    d.y += Math.sin(d.a) * d.sp * (0.6 + field(u, v));
    if (d.x < 0 || d.x > 1 || d.y < 0 || d.y > 1) { d.x = rand(); d.y = rand(); continue; }
    ctx.moveTo(px, py);
    ctx.lineTo(p.x + d.x * p.w, p.y + d.y * p.h);
  }
  ctx.stroke();
  ctx.restore();
}

function renderStatic() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  // shared frame
  const f = panels.frame;
  ctx.strokeStyle = INK2; ctx.lineWidth = Math.max(1.5, Math.min(W, H) / 480);
  ctx.strokeRect(f.x, f.y, f.w, f.h);
  // title inside frame top
  ctx.fillStyle = INK2;
  const ts = Math.min(W, H) / 34;
  ctx.font = "600 " + ts + "px ui-rounded, system-ui, sans-serif";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("FIVE METHODS", f.x + ts * 0.7, f.y - ts * 0.45);
  const titleW = ctx.measureText("FIVE METHODS").width;
  ctx.font = "400 " + ts * 0.62 + "px ui-rounded, system-ui, sans-serif";
  ctx.fillStyle = "rgba(51,41,29,0.6)";
  ctx.fillText("one field, five constructions", f.x + ts * 0.7 + titleW + ts * 0.9, f.y - ts * 0.45);

  const names = ["contour", "stipple", "hatch", "cells", "drift"];
  const draws = [drawContour, drawStipple, drawHatch, drawCells, null];
  for (let i = 0; i < 5; i++) {
    const p = panels[i];
    ctx.save();
    ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
    ctx.fillStyle = PAPER; ctx.fillRect(p.x, p.y, p.w, p.h);
    if (draws[i]) draws[i](p);
    ctx.restore();
    // label
    ctx.fillStyle = "rgba(51,41,29,0.62)";
    ctx.font = "600 " + Math.min(p.w, p.h) / 16 + "px ui-rounded, system-ui, sans-serif";
    const label = (i + 1) + " · " + names[i];
    ctx.fillText(label, p.x + 8, p.y + Math.min(p.w, p.h) / 14 + 8);
  }
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildAll();
}

let lastT = 0, acc = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (!panels.length) return;
  if (t - lastT > 50) { stepDrift(); lastT = t; }
}

canvas.addEventListener("pointerdown", function () {
  seed = (seed + 1) >>> 0;
  document.getElementById("seedtag").textContent = "seed " + seed;
  buildAll();
});
window.addEventListener("resize", resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
