<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Voice That Travels Unchanged</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #e8e0d0; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (prompt only).
  var CREAM = '#e8e0d0', BRICK = '#a8674a', GOLD = '#d9a441',
      BLUE = '#4a5a7a', BROWN = '#6b4a3a', SKIN = '#f2ead8';

  // Seeded PRNG (mulberry32). Used only for figure colour assignment order.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1480000);

  // Fixed voice-line path, in normalized coordinates across the whole frame.
  // Rises and falls like a spoken sentence; NEVER changes shape.
  var LINE = [
    [0.060, 0.460], [0.110, 0.430], [0.150, 0.480], [0.190, 0.410],
    [0.235, 0.470], [0.275, 0.430], [0.320, 0.490], [0.360, 0.420],
    [0.405, 0.470], [0.445, 0.430], [0.490, 0.460], [0.520, 0.440],
    [0.560, 0.480], [0.600, 0.410], [0.645, 0.470], [0.685, 0.430],
    [0.730, 0.490], [0.770, 0.420], [0.815, 0.470], [0.855, 0.430],
    [0.900, 0.460], [0.940, 0.440]
  ];

  // Cycle: 24 s. Draw left half 0-10 s, pause at seam 10-12 s,
  // draw right half 12-22 s, hold full 22-24 s, then loop.
  var LOOP = 24, DRAW_L = 10, PAUSE = 2, DRAW_R = 10, HOLD = 2;

  var W = 0, H = 0, isPhone = false;

  function sizeCanvas() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : w;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : h;
    var minDim = Math.min(sw, sh);
    isPhone = (minDim < 700) || (h > w * 1.15);
  }

  // Drag state: closed-form rate segments over piece time.
  // events: [{t, rate}] — rate applies from t until the next event.
  var events = [{ t: 0, rate: 1 }];
  var dragging = false, dragStartX = 0, dragLastRate = 1;

  function effectiveElapsed(t) {
    var total = 0, i, segStart, segEnd;
    for (i = 0; i < events.length; i++) {
      if (events[i].t >= t) break;
      segStart = events[i].t;
      segEnd = (i + 1 < events.length && events[i + 1].t < t) ? events[i + 1].t : t;
      if (segEnd > segStart) total += events[i].rate * (segEnd - segStart);
    }
    return total;
  }

  function progressAt(t) {
    var ph = effectiveElapsed(t) % LOOP;
    if (ph < DRAW_L) return 0.5 * (ph / DRAW_L);
    if (ph < DRAW_L + PAUSE) return 0.5;
    if (ph < DRAW_L + PAUSE + DRAW_R) return 0.5 + 0.5 * ((ph - DRAW_L - PAUSE) / DRAW_R);
    return 1;
  }

  function drawFigure(x, y, s, clothes) {
    // Head-and-shoulder shape: torso rect + head disc. Still, never animated.
    ctx.fillStyle = clothes;
    ctx.fillRect(x - 0.42 * s, y, 0.84 * s, 0.62 * s);
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(x + 0.30 * s, y - 0.10 * s);
    ctx.arc(x, y - 0.10 * s, 0.30 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw(t) {
    sizeCanvas();
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var u = Math.min(W, H);

    // Panels: equal halves, visible seam.
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, W / 2, H);
    ctx.fillStyle = BRICK;
    ctx.fillRect(W / 2, 0, W / 2, H);
    ctx.fillStyle = BLUE;
    ctx.fillRect(W / 2 - 1.5, 0, 3, H);

    // Still figures in each panel, lower band, clear of the voice-line.
    var figS = u * 0.11;
    var fy = H * 0.70;
    var leftCols = [BLUE, BROWN, BLUE];
    var rightCols = [BROWN, BLUE, BROWN];
    var i, fx;
    for (i = 0; i < 3; i++) {
      fx = W * (0.14 + 0.12 * i);
      drawFigure(fx, fy, figS, leftCols[i]);
      fx = W * (0.64 + 0.12 * i);
      drawFigure(fx, fy, figS, rightCols[i]);
    }

    // Voice-line: fixed path, drawn up to the current progress.
    var p = progressAt(t);
    var n = LINE.length;
    var full = p * (n - 1);
    var whole = Math.floor(full);
    var frac = full - whole;
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = Math.max(2, u * 0.006);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(LINE[0][0] * W, LINE[0][1] * H);
    for (i = 1; i <= whole && i < n; i++) {
      ctx.lineTo(LINE[i][0] * W, LINE[i][1] * H);
    }
    if (whole < n - 1 && frac > 0) {
      var ax = LINE[whole][0] * W, ay = LINE[whole][1] * H;
      var bx = LINE[whole + 1][0] * W, by = LINE[whole + 1][1] * H;
      ctx.lineTo(ax + (bx - ax) * frac, ay + (by - ay) * frac);
    }
    ctx.stroke();

    // Leading tip dot at the drawn end (not at loop hold, where the line is whole).
    var tipX, tipY;
    if (whole < n - 1) {
      if (frac > 0) {
        tipX = LINE[whole][0] * W + (LINE[whole + 1][0] * W - LINE[whole][0] * W) * frac;
        tipY = LINE[whole][1] * H + (LINE[whole + 1][1] * H - LINE[whole][1] * H) * frac;
      } else {
        tipX = LINE[whole][0] * W; tipY = LINE[whole][1] * H;
      }
      ctx.fillStyle = GOLD;
      ctx.beginPath();
      ctx.moveTo(tipX + u * 0.012, tipY);
      ctx.arc(tipX, tipY, u * 0.012, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- interaction: drag sideways speeds/slows the crossing ----
  var startTime = null;
  function nowSeconds() {
    if (startTime === null) return 0;
    return (Date.now() - startTime) / 1000;
  }
  function onDown(x) {
    dragging = true;
    dragStartX = x;
    dragLastRate = 1;
  }
  function onMove(x, t) {
    if (!dragging) return;
    var dx = x - dragStartX;
    var rate = 1 + dx / 150;
    if (rate < 0.25) rate = 0.25;
    if (rate > 3) rate = 3;
    if (rate !== dragLastRate) {
      events.push({ t: t, rate: rate });
      dragLastRate = rate;
    }
  }
  function onUp(t) {
    if (!dragging) return;
    dragging = false;
    if (dragLastRate !== 1) {
      events.push({ t: t, rate: 1 });
      dragLastRate = 1;
    }
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX); });
    canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, nowSeconds()); });
    canvas.addEventListener('pointerup', function (e) { onUp(nowSeconds()); });
    canvas.addEventListener('pointercancel', function (e) { onUp(nowSeconds()); });
  }
  if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { draw(lastT); });
    if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { draw(lastT); });
    }
  }

  var lastT = 0;
  function drawAt(t) {
    lastT = t;
    draw(t);
  }

  // Probe interface: drive with explicit piece time, feed drag events with explicit time.
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: drawAt,
      progressAt: progressAt,
      effectiveElapsed: effectiveElapsed,
      pointerdown: function (t, x) { onDown(x); },
      pointermove: function (t, x) { onMove(x, t); },
      pointerup: function (t, x) { onUp(t); },
      linePointCount: LINE.length
    };
  }

  // Frame one: constant phase, draw(0). Clock starts only with the rAF loop.
  drawAt(0);

  function loop(ts) {
    if (startTime === null) startTime = Date.now();
    var t = (Date.now() - startTime) / 1000;
    drawAt(t);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
