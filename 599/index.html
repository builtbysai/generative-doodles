<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Acá Están</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#FAF7F0; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>

<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var INK = '#1A1A1A', PAPER = '#FAF7F0', BLUE = '#3E6FA8';

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rng = mulberry32(599072);

/* ---------- precomputed paper speckle + notebook ruled lines (seeded data, drawn directly) ---------- */
var speckles = [];
for (var si = 0; si < 220; si++){
  speckles.push({ x: rng()*1000, y: rng()*1000, r: 0.8 + rng()*1.5, a: 0.03 + rng()*0.05 });
}
var ruled = [];
for (var ry = 92; ry < 980; ry += 44) ruled.push(ry + (rng()*2 - 1)*1.5);

/* ---------- geometry helpers ---------- */
function seg(x1,y1,x2,y2,n){ var p=[],i; n = n || Math.max(2, Math.round(Math.hypot(x2-x1, y2-y1)/11)); for(i=0;i<=n;i++) p.push([x1+(x2-x1)*i/n, y1+(y2-y1)*i/n]); return p; }
function rectP(x,y,w,h){ return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]]; }
function circP(cx,cy,r,n){ var p=[],i,a; n=n||24; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function arcP(cx,cy,r,a0,a1,n){ var p=[],i,a; n=n||12; for(i=0;i<=n;i++){ a=a0+(a1-a0)*i/n; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function bez(p0,p1,p2,p3,n){ var p=[],i,t,u; n=n||16; for(i=0;i<=n;i++){ t=i/n; u=1-t; p.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0], u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]); } return p; }
function qbez(p0,p1,p2,n){ var p=[],i,t,u; n=n||14; for(i=0;i<=n;i++){ t=i/n; u=1-t; p.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0], u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]); } return p; }
function rrP(x,y,w,h,r){ var p=[],i,a,corners=[[x+w-r,y+r,-Math.PI/2,0],[x+w-r,y+h-r,0,Math.PI/2],[x+r,y+h-r,Math.PI/2,Math.PI],[x+r,y+r,Math.PI,Math.PI*1.5]]; for(var c=0;c<4;c++){ var cc=corners[c]; for(i=0;i<=4;i++){ a=cc[2]+(cc[3]-cc[2])*i/4; p.push([cc[0]+Math.cos(a)*r, cc[1]+Math.sin(a)*r]); } } return p; }
function jit(pts, amt){ var out=[],i; for(i=0;i<pts.length;i++) out.push([pts[i][0]+(rng()*2-1)*amt, pts[i][1]+(rng()*2-1)*amt]); return out; }
function S(pts, o){ o = o || {}; var p = jit(pts, o.j !== undefined ? o.j : 1.4); var len=0,i; var n=p.length, lim = o.close ? n : n-1; for(i=1;i<=lim;i++){ var a=p[i-1], b=p[i%n]; len += Math.hypot(b[0]-a[0], b[1]-a[1]); } return { pts:p, w:o.w||2.8, close:!!o.close, len:len }; }

/* ---------- strip geometry: 2x2 grid, panel 4 (lower right) slightly larger ---------- */
var PANELS = [
  { x: 30,  y: 150, w: 440, h: 350 },
  { x: 510, y: 150, w: 440, h: 350 },
  { x: 30,  y: 540, w: 440, h: 350 },
  { x: 495, y: 525, w: 475, h: 390 }
];

/* ---------- panel borders: hand-ruled, always fully inked ---------- */
var borders = [];
for (var bi2 = 0; bi2 < 4; bi2++) borders.push(S(rectP(0,0,PANELS[bi2].w,PANELS[bi2].h), { close:true, w:3.2, j:1.8 }));

/* ---------- speech bubbles (stroke + tail built once; text drawn per mode) ---------- */
function makeBubble(x,y,w,h,lines,size,tailPts){
  var strokes = [ S(rrP(x,y,w,h,13), { close:true, w:2.6, j:1 }) ];
  for (var i=0;i<tailPts.length;i++) strokes.push(S(seg(tailPts[i][0],tailPts[i][1],tailPts[i][2],tailPts[i][3]), { w:2.4, j:0.8 }));
  return { strokes:strokes, cx:x+w/2, cy:y+h/2, lines:lines, size:size };
}
var bubble1 = makeBubble(28, 14, 384, 96, ['Buscá: un crayón, una hoja,', 'una piedra y la hebilla', 'del cinturón.'], 18, [[112,110,124,142],[142,110,134,144]]);
var bubble3a = makeBubble(14, 10, 192, 58, ['¡Mirá lo que', 'encontré!'], 16.5, [[92,68,112,102],[110,68,118,104]]);
var bubble3b = makeBubble(240, 8, 186, 56, ['¡ACÁ ESTÁN!'], 20, [[316,64,326,100],[334,64,334,102]]);
/* the father's bubble is NOT part of panel 4's ink: it arrives after the beat */
var bubble4 = makeBubble(34, 26, 252, 76, ['Te las mando', 'desde el cielo.'], 19, [[212,102,224,126],[230,102,234,128]]);

/* ================= PANEL 1: the mother sends the child off ================= */
var p1 = [
  /* mother, left */
  S(circP(120,205,24), { close:true, w:2.8 }),                   /* head */
  S(circP(141,184,8.5), { close:true, w:2.2 }),                  /* bun */
  S(arcP(120,205,24, Math.PI*1.08, Math.PI*1.55), { w:2.2 }),   /* hair sweep */
  S(seg(108,232,132,232), { w:2.6 }),                            /* collar */
  S(seg(108,232,98,318), { w:2.8 }), S(seg(132,232,142,318), { w:2.8 }),
  S(seg(98,318,142,318), { w:2.8 }),                             /* dress + hem */
  S(bez([130,246],[158,240],[184,234],[206,230]), { w:2.6 }),   /* arm extended, sending */
  S(seg(206,230,216,226), { w:2.2 }),                            /* pointing finger */
  S(qbez([110,246],[100,272],[102,298]), { w:2.6 }),             /* other arm down */
  S(seg(108,318,107,338), { w:2.6 }), S(seg(132,318,133,338), { w:2.6 }),
  S(seg(99,338,115,338), { w:2.6 }), S(seg(125,338,141,338), { w:2.6 }),
  S(seg(112,214,128,214), { w:2 }),                             /* mouth: the list, recited */
  /* child, right, listening */
  S(circP(302,228,19), { close:true, w:2.8 }),                   /* head */
  S(arcP(302,228,19, Math.PI*1.05, Math.PI*1.95), { w:2.2 }),   /* hair */
  S(seg(290,250,284,312), { w:2.8 }), S(seg(314,250,320,312), { w:2.8 }),
  S(seg(284,312,320,312), { w:2.8 }),                            /* body + hem */
  S(qbez([292,258],[276,278],[272,296]), { w:2.6 }),             /* arm down */
  S(qbez([312,258],[326,276],[332,292]), { w:2.6 }),             /* arm down */
  S(seg(292,312,291,336), { w:2.6 }), S(seg(312,312,313,336), { w:2.6 }),
  S(seg(283,336,299,336), { w:2.6 }), S(seg(305,336,321,336), { w:2.6 }),
  S(seg(16,340,424,340), { w:2 })                               /* ground */
];
var p1dots = [ [113,200],[127,200],[296,222],[308,222] ];

/* ================= PANEL 2: the search (three vignettes, no sub-borders) ================= */
var p2 = [
  /* vignette A: under the table */
  S(seg(20,190,140,190), { w:3.2 }),                             /* table top */
  S(seg(32,190,32,302), { w:2.8 }), S(seg(128,190,128,302), { w:2.8 }),
  S(circP(80,266,14), { close:true, w:2.6 }),                    /* child's head under the table */
  S(bez([58,304],[52,272],[62,250],[80,250]), { w:2.6 }),       /* crouched back */
  S(bez([88,284],[102,296],[116,294],[126,286]), { w:2.4 }),    /* reaching arm */
  S(seg(62,304,56,324), { w:2.4 }),                             /* knee down */
  /* vignette B: behind the plant (face first, plant drawn over it) */
  S(circP(176,208,14), { close:true, w:2.6 }),                   /* peeking face */
  S(arcP(176,208,14, Math.PI*1.05, Math.PI*1.95), { w:2 }),     /* hair */
  S(bez([227,282],[204,240],[190,216],[196,186]), { w:2.6 }),   /* leaf stems */
  S(bez([227,282],[228,234],[222,200],[232,170]), { w:2.6 }),
  S(bez([227,282],[252,238],[268,214],[262,184]), { w:2.6 }),
  S(bez([210,232],[196,224],[188,206],[192,192]), { w:2.2 }),   /* small leaf */
  S(bez([246,230],[260,220],[264,202],[258,190]), { w:2.2 }),
  S(seg(198,282,256,282), { w:3 }),                             /* pot rim */
  S(seg(203,282,207,318), { w:2.6 }), S(seg(251,282,247,318), { w:2.6 }),
  S(seg(207,318,247,318), { w:2.6 }),                            /* pot */
  /* vignette C: the drawer */
  S(rectP(330,150,98,190), { close:true, w:2.8 }),               /* chest */
  S(seg(330,252,428,252), { w:2.2 }), S(seg(330,292,428,292), { w:2.2 }),  /* drawer seams */
  S(rectP(318,198,104,36), { close:true, w:2.6 }),               /* the open drawer, pulled out */
  S(seg(318,198,330,188), { w:2 }), S(seg(422,198,428,188), { w:2 }),      /* drawer sides */
  S(circP(300,166,13), { close:true, w:2.6 }),                   /* child on tiptoe */
  S(arcP(300,166,13, Math.PI*1.05, Math.PI*1.95), { w:2 }),
  S(seg(291,182,287,262), { w:2.6 }), S(seg(309,182,313,262), { w:2.6 }),
  S(seg(287,262,313,262), { w:2.6 }),
  S(bez([307,192],[318,186],[328,190],[336,198]), { w:2.4 }),   /* arm reaching into the drawer */
  S(seg(292,262,290,300), { w:2.6 }), S(seg(308,262,311,300), { w:2.6 }),
  S(seg(282,300,298,300), { w:2.6 }), S(seg(303,300,319,300), { w:2.6 }),
  S(seg(16,340,424,340), { w:2 })                               /* ground */
];
var p2dots = [ [171,205],[181,205],[295,163],[305,163] ];

/* ================= PANEL 3: the presentation ================= */
/* static strokes: child, mother, bubbles' owners */
var p3 = [
  /* child, center-left, holding the plant up */
  S(circP(120,128,20), { close:true, w:2.8 }),                   /* head */
  S(arcP(120,128,20, Math.PI*1.05, Math.PI*1.95), { w:2.2 }),   /* hair */
  S(seg(108,150,102,268), { w:2.8 }), S(seg(132,150,138,268), { w:2.8 }),
  S(seg(102,268,138,268), { w:2.8 }),                            /* body + hem */
  S(bez([110,162],[138,200],[166,238],[172,240]), { w:2.6 }),   /* arm up to the pot */
  S(bez([130,162],[156,192],[172,228],[178,234]), { w:2.6 }),   /* other arm up to the pot */
  S(seg(110,268,109,300), { w:2.6 }), S(seg(130,268,131,300), { w:2.6 }),
  S(seg(101,300,117,300), { w:2.6 }), S(seg(123,300,139,300), { w:2.6 }),
  S(arcP(120,132,8, Math.PI*0.1, Math.PI*0.9), { w:2 }),        /* proud smile */
  /* mother, right, crowing */
  S(circP(332,132,23), { close:true, w:2.8 }),                   /* head */
  S(circP(353,111,8.5), { close:true, w:2.2 }),                  /* bun */
  S(arcP(332,132,23, Math.PI*1.08, Math.PI*1.55), { w:2.2 }),
  S(seg(320,158,344,158), { w:2.6 }),
  S(seg(320,158,310,272), { w:2.8 }), S(seg(344,158,354,272), { w:2.8 }),
  S(seg(310,272,354,272), { w:2.8 }),                            /* dress + hem */
  S(qbez([318,168],[296,142],[288,114]), { w:2.6 }),             /* arm up */
  S(qbez([346,168],[368,142],[378,116]), { w:2.6 }),             /* arm up */
  S(circP(332,146,4.5), { close:true, w:2 }),                    /* open mouth: crowing */
  S(seg(318,272,317,300), { w:2.6 }), S(seg(346,272,347,300), { w:2.6 }),
  S(seg(309,300,325,300), { w:2.6 }), S(seg(339,300,355,300), { w:2.6 }),
  S(seg(16,340,424,340), { w:2 })                               /* ground */
];
var p3dots = [ [113,124],[125,124],[325,126],[339,126] ];
/* the plant: drawn dynamically (it breathes; one leaf can tremble) */
var plantStrokes = [
  S(seg(163,222,207,222), { w:3 }),                             /* pot rim */
  S(seg(167,222,171,252), { w:2.6 }), S(seg(203,222,199,252), { w:2.6 }),
  S(seg(171,252,199,252), { w:2.6 }),                            /* pot */
  S(seg(185,222,185,182), { w:2.6 }),                            /* stem */
  S(bez([185,196],[204,166],[222,154],[236,130]), { w:2.4 }),   /* leaf B stem-curve */
  S(bez([185,202],[168,172],[152,160],[142,138]), { w:2.4 })    /* leaf C stem-curve */
];
/* the trembling leaf: a closed loop relative to its attach point (185,182) */
var leafPts = (function(){
  var a = bez([0,0],[-26,-14],[-34,-34],[-16,-52]);
  var b = bez([-16,-52],[-4,-36],[2,-18],[0,0]);
  return jit(a.concat(b.slice(1)), 0.9);
})();
/* plant hitbox, panel-3 local coords */
var PLANT_BOX = { x: 128, y: 108, w: 118, h: 152 };

/* ================= PANEL 4: the father ================= */
var p4 = [
  S(circP(237,150,30), { close:true, w:2.8 }),                   /* head */
  S(arcP(237,150,30, Math.PI*1.12, Math.PI*1.88), { w:2.4 }),   /* hair */
  S(arcP(237,154,14, Math.PI*0.15, Math.PI*0.85), { w:2.2 }),   /* the simple smile */
  S(rectP(200,186,74,96), { close:true, w:2.8 }),                /* shirt outline */
  S(seg(222,186,237,200), { w:2 }), S(seg(252,186,237,200), { w:2 }),      /* collar V */
  S(qbez([202,196],[182,240],[186,284]), { w:2.8 }),              /* arm resting */
  S(qbez([272,196],[294,228],[298,258]), { w:2.8 }),              /* arm slightly raised */
  S(seg(206,282,204,342), { w:2.8 }), S(seg(268,282,270,342), { w:2.8 }),  /* legs */
  S(seg(194,342,212,342), { w:2.8 }), S(seg(260,342,278,342), { w:2.8 }),  /* feet */
  S(seg(20,352,455,352), { w:2 })                                /* ground */
];
var p4dots = [ [226,146],[248,146] ];
var shirt4Pts = jit(rectP(200,186,74,96), 1.1);

var panelStrokes = [p1, p2, p3, p4];
var panelDots = [p1dots, p2dots, p3dots, p4dots];
var panelBubbles = [ [bubble1], [], [bubble3a, bubble3b], [] ];

/* ---------- drawing primitives ---------- */
function handFont(size, weight){ return 'italic ' + (weight||600) + ' ' + size + 'px "Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive,sans-serif'; }
function pathOf(pts, close){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function strokePartial(pts, close, budget){
  var n = pts.length, lim = close ? n : n-1, b = budget, i, a, c, dx, dy, L;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(i=1;i<=lim;i++){
    a = pts[i-1]; c = pts[i%n]; dx = c[0]-a[0]; dy = c[1]-a[1]; L = Math.hypot(dx,dy);
    if (b >= L){ ctx.lineTo(c[0], c[1]); b -= L; }
    else { var f = L ? b/L : 0; ctx.lineTo(a[0]+dx*f, a[1]+dy*f); b = 0; break; }
  }
  ctx.stroke();
  return b;
}
function drawStrokes(strokes, p){
  var total = 0, i;
  for(i=0;i<strokes.length;i++) total += strokes[i].len;
  var budget = p * total, st;
  for(i=0;i<strokes.length;i++){
    st = strokes[i];
    if (budget <= 0) break;
    ctx.strokeStyle = INK; ctx.lineWidth = st.w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (budget >= st.len){ pathOf(st.pts, st.close); ctx.stroke(); budget -= st.len; }
    else { strokePartial(st.pts, st.close, budget); budget = 0; }
  }
}
function fillPath(pts, color){
  ctx.save(); ctx.fillStyle = color; pathOf(pts, true); ctx.fill(); ctx.restore();
}
function drawDots(dots){
  ctx.save(); ctx.fillStyle = INK;
  for (var i=0;i<dots.length;i++){ ctx.beginPath(); ctx.arc(dots[i][0], dots[i][1], 1.9, 0, Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function drawBubbleText(b){
  ctx.save(); ctx.fillStyle = INK; ctx.font = handFont(b.size, 600);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  var n = b.lines.length, i;
  for (i=0;i<n;i++) ctx.fillText(b.lines[i], b.cx, b.cy + (i - (n-1)/2) * b.size * 1.28 + b.size * 0.36);
  ctx.restore();
}

/* ---------- state ---------- */
var PHASE0 = 0;                 /* fixed phase anchor: frame one never comes from a clock */
var curT = PHASE0, prevT = PHASE0;
var inkP = [1, 0, 0, 0];        /* panel 1 arrives inked; 2-4 wait as pencil ghosts */
var inkAnim = null;             /* { idx, t0 } */
var INK_DUR = 1.2;              /* the panels ink slowly, at reading pace */
var fatherT0 = -100;            /* when panel 4 finished inking; his line lands 1.5s later */
var leafT0 = -100, leafDone = false;  /* the tremble happens once */

/* ---------- sizing ---------- */
var viewW = 300, viewH = 300, dpr = 1;
var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : { width:300, height:300 };
var isPhone = Math.min(scr.width, scr.height) < 700; // aspect fallback below only if screen lies
if (!isPhone && viewH > viewW * 1.15 && Math.min(viewW, viewH) < 700) isPhone = true;

function panelMode(i){
  if (inkAnim && inkAnim.idx === i) return 'anim';
  if (inkP[i] >= 1) return 'ink';
  return 'ghost';
}
function textAlpha(i){
  var m = panelMode(i);
  if (m === 'ghost') return 0.15;
  if (m === 'ink') return 1;
  return Math.max(0, Math.min(1, (inkP[i] - 0.55) / 0.45));
}
function fatherAlpha(){
  if (inkP[3] < 1) return 0;
  var a = (curT - (fatherT0 + 1.5)) / 0.7;   /* the beat, then his line */
  return Math.max(0, Math.min(1, a));
}

function drawPanel(i){
  var P = PANELS[i], mode = panelMode(i);
  var bob = Math.sin(curT * Math.PI * 2 / 4.6 + i * 1.3) * 0.7;   /* the figures breathe, waiting */
  ctx.save();
  ctx.translate(P.x, P.y);
  drawStrokes([borders[i]], 1);
  ctx.save();
  ctx.translate(0, bob);
  ctx.beginPath(); ctx.rect(3, 3, P.w - 6, P.h - 6); ctx.clip();

  if (mode === 'ghost') ctx.globalAlpha = 0.15;
  var prog = (mode === 'anim') ? inkP[i] : 1;
  drawStrokes(panelStrokes[i], prog);

  /* panel 3's plant: breathes very slightly; one leaf can tremble, once */
  if (i === 2){
    var sway = Math.sin(curT * Math.PI * 2 / 6.0) * 0.012;
    ctx.save();
    ctx.translate(185, 252); ctx.rotate(sway); ctx.translate(-185, -252);
    drawStrokes(plantStrokes, prog);
    if (prog > 0.65){
      var ta = 0;
      if (leafDone){
        var age = curT - leafT0;
        if (age >= 0 && age < 0.9) ta = Math.sin(age * 30) * 0.28 * (1 - age / 0.9);
      }
      ctx.save();
      ctx.translate(185, 182); ctx.rotate(ta);
      ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      pathOf(leafPts, false); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  /* fills + faces + words fade in behind the last strokes */
  ctx.save();
  ctx.globalAlpha = (mode === 'ghost') ? 0.15 : textAlpha(i);
  if (i === 3) fillPath(shirt4Pts, (mode === 'ghost') ? INK : BLUE);
  drawDots(panelDots[i]);
  var bs = panelBubbles[i], bi;
  for (bi = 0; bi < bs.length; bi++) drawBubbleText(bs[bi]);
  ctx.restore();

  for (bi = 0; bi < bs.length; bi++) drawStrokes(bs[bi].strokes, prog);

  /* the father's line: not ink, an arrival. It fades in after the beat, once. */
  if (i === 3 && inkP[3] >= 1){
    var fa = fatherAlpha();
    if (fa > 0){
      ctx.save(); ctx.globalAlpha = fa;
      drawStrokes(bubble4.strokes, 1);
      drawBubbleText(bubble4);
      ctx.restore();
    }
  }

  ctx.restore(); /* unclip */
  ctx.restore(); /* panel translate */
}

function draw(){
  canvas.style.width = viewW + 'px'; canvas.style.height = viewH + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);
  var s = Math.min(viewW/1000, viewH/1000);
  var ox = (viewW - 1000*s)/2, oy = (viewH - 1000*s)/2;
  ctx.setTransform(dpr*s, 0, 0, dpr*s, dpr*ox, dpr*oy);
  var i;
  for (i=0;i<speckles.length;i++){ var sp = speckles[i]; ctx.save(); ctx.globalAlpha = sp.a; ctx.fillStyle = INK; ctx.fillRect(sp.x, sp.y, sp.r, sp.r); ctx.restore(); }
  ctx.save(); ctx.globalAlpha = 0.05; ctx.strokeStyle = INK; ctx.lineWidth = 1.4;
  for (i=0;i<ruled.length;i++){ ctx.beginPath(); ctx.moveTo(0, ruled[i]); ctx.lineTo(1000, ruled[i]); ctx.stroke(); }
  ctx.restore();
  for (i=0;i<4;i++) drawPanel(i);
  ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = INK; ctx.font = handFont(21, 600);
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.fillText('tap', 972, 952); ctx.restore();
}

/* ---------- sizing listeners (Visual Viewport API + window) ---------- */
function resize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  viewW = vv ? vv.width : window.innerWidth;
  viewH = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw();
}
if (typeof window !== 'undefined' && window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (typeof window !== 'undefined') window.addEventListener('resize', resize);

/* ---------- interaction: tap advances the strip; after the turn, tap the plant ---------- */
function toStage(e){
  var r = { left:0, top:0 };
  if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
  var cx = (e.clientX - r.left), cy = (e.clientY - r.top);
  var s = Math.min(viewW/1000, viewH/1000);
  return { x: (cx - (viewW - 1000*s)/2)/s, y: (cy - (viewH - 1000*s)/2)/s };
}
function onPlant(p){
  var P = PANELS[2];
  var lx = p.x - P.x, ly = p.y - P.y;
  return lx >= PLANT_BOX.x && lx <= PLANT_BOX.x + PLANT_BOX.w && ly >= PLANT_BOX.y && ly <= PLANT_BOX.y + PLANT_BOX.h;
}
var pdown = null;
canvas.addEventListener('pointerdown', function(e){
  var p = toStage(e);
  pdown = { x:p.x, y:p.y, moved:false };
});
canvas.addEventListener('pointermove', function(e){
  if (!pdown) return;
  var p = toStage(e);
  if (Math.abs(p.x - pdown.x) > 8 || Math.abs(p.y - pdown.y) > 8) pdown.moved = true;
});
function endPointer(){
  if (!pdown) return;
  var wasTap = !pdown.moved, p = { x: pdown.x, y: pdown.y };
  pdown = null;
  if (!wasTap){ draw(); return; }
  if (inkAnim) return;
  for (var i=0;i<4;i++){
    if (inkP[i] < 1){ inkAnim = { idx:i, t0: curT }; return; }
  }
  /* the strip is read and the line has landed: one leaf trembles, once. Then stillness. */
  if (!leafDone && fatherAlpha() >= 1 && onPlant(p)){
    leafDone = true; leafT0 = curT;
  }
  draw();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ pdown = null; });
if (typeof window !== 'undefined') window.addEventListener('pointerup', function(){ pdown = null; });

/* ---------- tick ---------- */
function tick(t){
  prevT = curT; curT = t;
  if (inkAnim){
    inkP[inkAnim.idx] = Math.min(1, (t - inkAnim.t0) / INK_DUR);
    if (inkP[inkAnim.idx] >= 1){
      if (inkAnim.idx === 3) fatherT0 = t;   /* the beat starts when his panel lands */
      inkAnim = null;
    }
  }
}

/* ---------- go: synchronous first frame, then the loop ---------- */
resize();
var baseTs = null;
function loop(ts){
  if (baseTs === null){ baseTs = ts; curT = PHASE0; prevT = PHASE0; }
  tick(PHASE0 + (ts - baseTs)/1000);
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
</script>
</body>
</html>
