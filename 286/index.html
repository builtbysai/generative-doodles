<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.286 Belly Crack</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#141210; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.286 Belly Crack (Sophia Golovanevskaya).
// A pale slip-white vessel in side profile on a dark ground.
// Its belly slowly swells; as it swells, a geometric crackle
// network of straight fracture segments propagates across the
// skin, out from the belly. When the belly relaxes the cracks
// hold. Tapping re-seeds a new fracture constellation and
// replays the swelling; double-tapping holds the belly
// swollen. Nothing ever reloads.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var SLIP = '#EFE9DC', CRACK = '#4A463C', DEEP = '#2E2B24', GROUND = '#141210', RIM = '#C9A86A';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0; // stored centred-fit transform, used by the pointer handlers
var T = 3.4, lastNow = -1, acc = 0; // clock starts partway into the first swell
var TICK = 1 / 60;
var LOOP = 14; // seconds per swell cycle

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
function sstep(a, b, x) {
  var u = clamp01((x - a) / (b - a));
  return u * u * (3 - 2 * u);
}
function lerp(a, b, u) { return a + (b - a) * u; }

// ---- vessel profile ------------------------------------------------------------
// Side profile as control points of half width against height
// fraction t (0 at the rim, 1 at the foot). The vessel stands
// 70 percent of the frame height, centred in the design space.
// Catmull-Rom sampling keeps the lathe curve smooth.
var CX = DW / 2, VH = DH * 0.70, TOP = (DH - VH) / 2;
var PROF = [
  [0.00, 56], [0.05, 49], [0.12, 58], [0.22, 95],
  [0.34, 140], [0.44, 168], [0.54, 178], [0.64, 168],
  [0.76, 138], [0.86, 104], [0.94, 80], [1.00, 84]
];
function baseHalf(t) {
  var n = PROF.length;
  var x = clamp01(t) * (n - 1);
  var i = Math.min(n - 2, Math.floor(x));
  var u = x - i;
  var p0 = PROF[Math.max(0, i - 1)][1], p1 = PROF[i][1];
  var p2 = PROF[i + 1][1], p3 = PROF[Math.min(n - 1, i + 2)][1];
  return 0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);
}
// the swell lives at the belly: a broad gaussian weight around
// t = 0.52 widens the profile there and nowhere else
function halfAt(t, swell) {
  var d = (t - 0.52) / 0.17;
  var w = Math.exp(-d * d);
  return baseHalf(t) * (1 + swell * 0.20 * w);
}
function vesselPath(swell) {
  var N = 44, i, t;
  ctx.beginPath();
  for (i = 0; i <= N; i++) {
    t = i / N;
    var xr = CX + halfAt(t, swell), y = TOP + t * VH;
    if (i === 0) ctx.moveTo(xr, y); else ctx.lineTo(xr, y);
  }
  for (i = N; i >= 0; i--) {
    t = i / N;
    ctx.lineTo(CX - halfAt(t, swell), TOP + t * VH);
  }
  ctx.closePath();
}

// ---- crack network ---------------------------------------------------------------
// A polygonal fracture graph held purely as edge data. Nodes sit
// on a jittered grid in vessel coordinates: xn is the position
// across the local profile width (-1 to 1), t the height
// fraction, so the whole network stretches as the belly swells.
// Edges join grid neighbours, most cells left quadrilateral
// with a seeded diagonal in a few, so every segment is straight
// and the
// network reads geometric, like cracked dry mud, never like
// lightning. Each edge carries a threshold: cracks appear at
// the belly first and propagate outward as the swell grows.
var edges = [];
var seedCounter = 0;
function buildNetwork(seed) {
  var r = rng(seed);
  var COLS = 6, ROWS = 10;
  var nodes = [], ri, ci;
  for (ri = 0; ri < ROWS; ri++) {
    for (ci = 0; ci < COLS; ci++) {
      var t = 0.08 + (0.95 - 0.08) * (ri / (ROWS - 1));
      var xn = -0.86 + 1.72 * (ci / (COLS - 1));
      var jx = (ci === 0 || ci === COLS - 1) ? 0.05 : 0.30;
      var jy = (ri === 0 || ri === ROWS - 1) ? 0.10 : 0.30;
      xn += (r() - 0.5) * 2 * jx * (1.72 / (COLS - 1));
      t += (r() - 0.5) * 2 * jy * (0.87 / (ROWS - 1));
      nodes.push({ xn: Math.max(-0.92, Math.min(0.92, xn)), t: Math.max(0.06, Math.min(0.97, t)) });
    }
  }
  edges = [];
  function addEdge(a, b) {
    var mx = (a.xn + b.xn) / 2, mt = (a.t + b.t) / 2;
    var d = Math.sqrt(Math.pow(mx * 0.75, 2) + Math.pow((mt - 0.52) * 1.15, 2));
    var thr = 0.04 + 0.55 * (d / 0.85) + (r() - 0.5) * 0.08;
    edges.push({ a: a, b: b, thr: Math.max(0.02, Math.min(0.97, thr)) });
  }
  function nodeAt(rr, cc) { return nodes[rr * COLS + cc]; }
  for (ri = 0; ri < ROWS; ri++) {
    for (ci = 0; ci < COLS; ci++) {
      if (ci < COLS - 1) addEdge(nodeAt(ri, ci), nodeAt(ri, ci + 1));
      if (ri < ROWS - 1) addEdge(nodeAt(ri, ci), nodeAt(ri + 1, ci));
      if (ci < COLS - 1 && ri < ROWS - 1) {
        // most cells stay quadrilateral, like dried mud plates;
        // a seeded few take one diagonal to break the grid
        if (r() < 0.25) {
          if ((ri + ci) % 2 === 0) addEdge(nodeAt(ri, ci), nodeAt(ri + 1, ci + 1));
          else addEdge(nodeAt(ri, ci + 1), nodeAt(ri + 1, ci));
        }
      }
    }
  }
}
buildNetwork(286041);

// ---- swell state -------------------------------------------------------------------
// One cycle: the belly rises over the first stretch, holds at
// full swell, then relaxes partway and rests. The crack reveal
// tracks the highest swell reached in the first cycle and then
// holds for good, so relaxing never un-grows the network.
// Holding (double-tap) eases both swell and reveal to full.
var cycleStart = 0, holdTarget = 0, holdAmt = 0;
var curSwell = 0, curReveal = 0;
function updateState() {
  var ct = T - cycleStart;
  var k = Math.floor(ct / LOOP);
  var u = (ct - k * LOOP) / LOOP;
  var sRaw;
  if (u < 0.42) sRaw = sstep(0, 0.42, u);
  else if (u < 0.62) sRaw = 1;
  else if (u < 0.88) sRaw = 1 - 0.72 * sstep(0.62, 0.88, u);
  else sRaw = 0.28;
  var rRaw = k >= 1 ? 0.98 : (u < 0.42 ? sstep(0, 0.42, u) * 0.98 : 0.98);
  curSwell = Math.max(sRaw, holdAmt);
  curReveal = Math.max(rRaw, holdAmt * 0.98);
}
function stepSim() {
  T += TICK;
  holdAmt += (holdTarget - holdAmt) * Math.min(1, TICK * 3);
  if (Math.abs(holdTarget - holdAmt) < 0.001) holdAmt = holdTarget;
  updateState();
}
updateState();

// ---- drawing -------------------------------------------------------------------------
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-80, -80, DW + 160, DH + 160);
  var swell = curSwell, reveal = curReveal;
  // the vessel body: flat slip, nothing else on the surface
  vesselPath(swell);
  ctx.fillStyle = SLIP;
  ctx.fill();
  // cracks, clipped to the silhouette. Three batched passes:
  // a wide soft under-stroke in the crack line colour, a pale
  // slip line offset to one side so each crack keeps a light
  // edge, then the dark core in crack deep.
  ctx.save();
  vesselPath(swell);
  ctx.clip();
  var passes = [
    { dx: 0, dy: 0, wdt: 4.6, style: rgba(CRACK, 0.50) },
    { dx: 1.7, dy: 1.1, wdt: 1.4, style: rgba(SLIP, 0.85) },
    { dx: 0, dy: 0, wdt: 2.0, style: rgba(DEEP, 0.92) }
  ];
  var pi, ei;
  for (pi = 0; pi < passes.length; pi++) {
    var P = passes[pi];
    ctx.strokeStyle = P.style;
    ctx.lineWidth = P.wdt;
    ctx.lineCap = 'round';
    ctx.beginPath();
    var any = false;
    for (ei = 0; ei < edges.length; ei++) {
      var e = edges[ei];
      var f = clamp01((reveal - e.thr) / 0.07);
      if (f <= 0) continue;
      any = true;
      var hwA = halfAt(e.a.t, swell) * 0.94, hwB = halfAt(e.b.t, swell) * 0.94;
      var x1 = CX + e.a.xn * hwA + P.dx, y1 = TOP + e.a.t * VH + P.dy;
      var x2 = CX + e.b.xn * hwB + P.dx, y2 = TOP + e.b.t * VH + P.dy;
      ctx.moveTo(x1, y1);
      ctx.lineTo(lerp(x1, x2, f), lerp(y1, y2, f));
    }
    if (any) ctx.stroke();
  }
  // quiet construction rings at the neck and the foot, clipped in
  ctx.strokeStyle = rgba(CRACK, 0.30);
  ctx.lineWidth = 2;
  ctx.beginPath();
  var tN = 0.10, tF = 0.93, seg;
  for (seg = 0; seg <= 24; seg++) {
    var tt = seg / 24, yy = TOP + tN * VH + Math.sin(tt * Math.PI) * 3;
    var xx = CX - halfAt(tN, swell) + 2 * halfAt(tN, swell) * tt;
    if (seg === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
  }
  ctx.stroke();
  ctx.beginPath();
  for (seg = 0; seg <= 24; seg++) {
    var tt2 = seg / 24, yy2 = TOP + tF * VH + Math.sin(tt2 * Math.PI) * 3;
    var xx2 = CX - halfAt(tF, swell) + 2 * halfAt(tF, swell) * tt2;
    if (seg === 0) ctx.moveTo(xx2, yy2); else ctx.lineTo(xx2, yy2);
  }
  ctx.stroke();
  ctx.restore();
  // the mouth: a dark opening with a slip rim
  var hw0 = halfAt(0, swell);
  ctx.beginPath();
  ctx.ellipse(CX, TOP, hw0, hw0 * 0.24, 0, 0, Math.PI * 2);
  ctx.fillStyle = DEEP;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(CX, TOP, hw0, hw0 * 0.24, 0, 0, Math.PI * 2);
  ctx.strokeStyle = rgba(SLIP, 0.9);
  ctx.lineWidth = 2.5;
  ctx.stroke();
  // warm rim light: one subtle translucent stroke down the
  // right profile edge, laid twice for a soft falloff
  var N = 44, i, t;
  for (var rp = 0; rp < 2; rp++) {
    ctx.beginPath();
    for (i = 0; i <= N; i++) {
      t = i / N;
      var xr = CX + halfAt(t, swell), yr = TOP + t * VH;
      if (i === 0) ctx.moveTo(xr, yr); else ctx.lineTo(xr, yr);
    }
    ctx.strokeStyle = rp === 0 ? rgba(RIM, 0.16) : rgba(RIM, 0.50);
    ctx.lineWidth = rp === 0 ? 8 : 2.6;
    ctx.stroke();
  }
  // foot line where the vessel meets the ground
  var hwB = halfAt(1, swell);
  ctx.beginPath();
  ctx.moveTo(CX - hwB, TOP + VH);
  ctx.lineTo(CX + hwB, TOP + VH);
  ctx.strokeStyle = rgba(CRACK, 0.45);
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ---- resize ----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction: tap re-seeds, double-tap holds ------------------------------------------
// A tap re-seeds the fracture constellation and replays the
// swelling from the start. A double-tap toggles the hold: the
// belly eases to full swell and stays there until the next
// double-tap. The single tap waits out the double-tap window
// so the two gestures never fire together. Never a reload.
var downX = 0, downY = 0, downT = 0, lastTapT = -10000, pendingTap = null;
function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function reseed() {
  seedCounter++;
  buildNetwork(286041 + seedCounter * 7919);
  cycleStart = T;
  holdTarget = 0;
  updateState();
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p[0]; downY = p[1]; downT = Date.now();
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
canvas.addEventListener('pointerup', function (e) {
  var p = toDesign(e);
  var dx = p[0] - downX, dy = p[1] - downY;
  if (dx * dx + dy * dy > 144 || Date.now() - downT > 600) return;
  var now = Date.now();
  if (now - lastTapT < 380) {
    if (pendingTap !== null && typeof clearTimeout === 'function') clearTimeout(pendingTap);
    pendingTap = null;
    lastTapT = -10000;
    holdTarget = holdTarget > 0.5 ? 0 : 1;
    return;
  }
  lastTapT = now;
  if (typeof setTimeout === 'function') {
    pendingTap = setTimeout(function () { pendingTap = null; reseed(); }, 380);
  } else {
    reseed();
  }
});
canvas.addEventListener('pointercancel', function () {});

// ---- frame -----------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the shaped composition keeps its proportions,
  // centred, with the page ground in the piece ground colour
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
