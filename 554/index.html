<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mugre Debajo del Sofá</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EAC97E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict, nothing else. Flat fills only, no gradients.
  var INK = '#1A1A1A', TAN = '#EAC97E', GREY = '#9A9A9A', PURPLE = '#8A5AA8',
      BLUE = '#4E9AD6', GREEN = '#5AB85A', WHITE = '#F2F2F2',
      WOOD = '#7A5230', INDIGO = '#2E3A5A';

  var DW = 1200, DH = 800;      // design space (landscape page)
  var PHASE0 = 2.0;             // constant first-frame phase

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function easeOut(v) { return 1 - (1 - v) * (1 - v); }

  // ---------------- wobbly hand-drawn helpers ----------------
  // Wobbly closed path through jittered points sampled round a rounded rect.
  function wobRectPath(x, y, w, h, r, seed, jit) {
    var rng = mulberry32(seed);
    var pts = [];
    function edge(x0, y0, x1, y1) {
      var len = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
      var n = Math.max(1, Math.round(len / 46));
      for (var i = 0; i < n; i++) {
        var u = i / n;
        pts.push([x0 + (x1 - x0) * u + (rng() - 0.5) * 2 * jit,
                  y0 + (y1 - y0) * u + (rng() - 0.5) * 2 * jit]);
      }
    }
    edge(x + r, y, x + w - r, y);
    edge(x + w, y + r, x + w, y + h - r);
    edge(x + w - r, y + h, x + r, y + h);
    edge(x, y + h - r, x, y + r);
    ctx.beginPath();
    var n = pts.length;
    for (var i = 0; i < n; i++) {
      var p = pts[i], q = pts[(i + 1) % n];
      var mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      if (i === 0) ctx.moveTo(mx, my);
      else {
        var pp = pts[(i - 1 + n) % n];
        ctx.quadraticCurveTo(pp[0], pp[1], mx, my);
      }
    }
    ctx.closePath();
  }
  function panel(x, y, w, h, fill, seed) {
    wobRectPath(x, y, w, h, 10, seed, 2.2);
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
  }
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function line(x0, y0, x1, y1) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
  function fillStroke(fill, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
  }

  // Hand-lettered text: per-letter jitter from a seed fixed by the string,
  // so the lettering wobbles but never shimmers between frames.
  function textWob(str, cx, y, size, color, seedExtra) {
    ctx.save();
    ctx.font = '700 ' + size + 'px "Chalkboard SE", "Comic Sans MS", sans-serif';
    ctx.fillStyle = color; ctx.textBaseline = 'middle';
    var widths = [], total = 0, i, w;
    for (i = 0; i < str.length; i++) { w = ctx.measureText(str[i]).width; widths.push(w); total += w; }
    var rng = mulberry32(hashStr(str) + (seedExtra || 0));
    var x = cx - total / 2;
    for (i = 0; i < str.length; i++) {
      var dy = (rng() - 0.5) * size * 0.15, rot = (rng() - 0.5) * 0.15;
      ctx.save();
      ctx.translate(x + widths[i] / 2, y + dy); ctx.rotate(rot);
      ctx.fillText(str[i], -widths[i] / 2, 0);
      ctx.restore();
      x += widths[i];
    }
    ctx.restore();
  }
  function wrapLines(str, size, maxW) {
    ctx.save();
    ctx.font = '700 ' + size + 'px "Chalkboard SE", "Comic Sans MS", sans-serif';
    var words = str.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    ctx.restore();
    return lines;
  }
  // Speech bubble: wobbly white rounded rect + tail to (tx, ty).
  function bubble(x, y, w, h, tx, ty, seed) {
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(x + w * 0.38, y + h);
    ctx.lineTo(x + w * 0.60, y + h);
    ctx.closePath();
    ctx.fillStyle = WHITE; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    wobRectPath(x, y, w, h, 14, seed, 1.8);
    ctx.fillStyle = WHITE; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
  }
  function bubbleText(x, y, w, h, tx, ty, str, size, seed) {
    var lines = wrapLines(str, size, w - 26);
    var bh = Math.max(h, lines.length * (size + 7) + 18);
    bubble(x, y, w, bh, tx, ty, seed);
    for (var i = 0; i < lines.length; i++)
      textWob(lines[i], x + w / 2, y + bh / 2 + (i - (lines.length - 1) / 2) * (size + 7), size, INK, seed + i * 7);
    return bh;
  }

  // ---------------- the cast (fixed designs, origin at ground centre) ----------------
  function drawMouse(s, t, bit) {
    ctx.save(); ctx.scale(s, s);
    ctx.lineCap = 'round';
    // tail
    ctx.strokeStyle = GREY; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(-26, -18);
    ctx.quadraticCurveTo(-66, -6, -58, -34); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-26, -22);
    ctx.quadraticCurveTo(-62, -10, -55, -34); ctx.stroke();
    // feet
    ell(-16, -4, 13, 5); fillStroke(GREY, 3);
    ell(16, -4, 13, 5); fillStroke(GREY, 3);
    // body
    ell(0, -56, 34, 48); fillStroke(GREY, 3.5);
    // arm
    line(-30, -66, -44, -40); ctx.strokeStyle = INK;
    ctx.strokeStyle = INK; ctx.lineWidth = 4; line(-30, -66, -44, -40);
    // ear
    circ(-18, -152, 15); fillStroke(GREY, 3.5);
    circ(-18, -152, 7); ctx.fillStyle = WHITE; ctx.fill();
    // head
    circ(6, -126, 30); fillStroke(GREY, 3.5);
    // snout + nose
    ell(30, -118, 14, 9); fillStroke(GREY, 3);
    circ(43, -120, 4); ctx.fillStyle = INK; ctx.fill();
    // whiskers
    ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
    line(34, -114, 52, -108); line(34, -120, 53, -120); line(34, -126, 51, -132);
    // good eye
    circ(17, -133, 3.6); ctx.fillStyle = INK; ctx.fill();
    // stitched eye: a scar crossed by three stitches (twitches during the bit)
    var tw = bit * Math.sin(t * 42) * 0.22;
    ctx.save(); ctx.translate(-4, -135); ctx.rotate(tw);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
    line(-9, 0, 9, 0);
    for (var i = -1; i <= 1; i++) { line(i * 6 - 3, -5, i * 6 + 3, 5); }
    ctx.restore();
    ctx.restore();
  }

  function drawBug(s, t, bit) {
    ctx.save(); ctx.scale(s, s);
    ctx.lineCap = 'round';
    // legs, three per side
    ctx.strokeStyle = INK; ctx.lineWidth = 4.5;
    for (var i = 0; i < 3; i++) {
      line(-28, -34 - i * 16, -46, -22 - i * 16);
      line(28, -34 - i * 16, 46, -22 - i * 16);
    }
    // body + belly
    ell(0, -60, 36, 52); fillStroke(PURPLE, 3.5);
    ell(0, -48, 21, 31); ctx.fillStyle = TAN; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.ellipse(0, -48, 21, 31, 0, 0, Math.PI * 2); ctx.stroke();
    // shell line
    ctx.beginPath(); ctx.moveTo(0, -110); ctx.quadraticCurveTo(6, -60, 0, -12); ctx.stroke();
    // left arm down
    ctx.lineWidth = 5; line(-32, -78, -48, -52);
    // right arm raised, peace sign (flashes bigger during the bit)
    line(32, -82, 50, -110);
    ctx.save(); ctx.translate(52, -112); ctx.scale(1 + 0.65 * bit, 1 + 0.65 * bit);
    ctx.lineWidth = 5;
    line(0, 0, -6, -26); line(0, 0, 7, -26);
    circ(0, 2, 5); ctx.fillStyle = PURPLE; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
    // head
    circ(0, -128, 26); fillStroke(PURPLE, 3.5);
    // antennae
    ctx.strokeStyle = INK; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(-10, -148); ctx.quadraticCurveTo(-22, -168, -30, -164); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10, -148); ctx.quadraticCurveTo(22, -168, 30, -164); ctx.stroke();
    circ(-31, -164, 4); ctx.fillStyle = PURPLE; ctx.fill(); ctx.stroke();
    circ(31, -164, 4); ctx.fillStyle = PURPLE; ctx.fill(); ctx.stroke();
    // face
    circ(-9, -132, 3.4); ctx.fillStyle = INK; ctx.fill();
    circ(9, -132, 3.4); ctx.fillStyle = INK; ctx.fill();
    ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(0, -122, 8, 0.25, Math.PI - 0.25); ctx.stroke();
    ctx.restore();
  }

  function drawAlien(s, t, bit) {
    ctx.save(); ctx.scale(s, s);
    ctx.lineCap = 'round';
    // legs + feet
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    line(-10, -34, -12, -6); line(10, -34, 12, -6);
    ell(-14, -4, 10, 4.5); fillStroke(BLUE, 3);
    ell(14, -4, 10, 4.5); fillStroke(BLUE, 3);
    // body
    ell(0, -64, 24, 34); fillStroke(BLUE, 3.5);
    // left arm down
    ctx.strokeStyle = INK; ctx.lineWidth = 5; line(-22, -76, -34, -48);
    // right arm holding a Q-tip; during the bit the tip travels to the ear and scrubs
    var scrub = bit * Math.sin(t * 30) * 4;
    var tipX = 58 + (30 - 58) * bit, tipY = -128 + (-142 + 128) * bit + scrub * bit;
    ctx.lineWidth = 5; line(22, -78, 40, -102);
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    line(40, -102, tipX, tipY);
    circ(40, -102, 5); fillStroke(WHITE, 2.4);
    circ(tipX, tipY, 5.5); fillStroke(WHITE, 2.4);
    // head
    ell(0, -138, 30, 37); fillStroke(BLUE, 3.5);
    // big eyes
    ell(-12, -146, 6, 11); ctx.fillStyle = INK; ctx.fill();
    ell(12, -146, 6, 11); ctx.fillStyle = INK; ctx.fill();
    // small mouth
    ctx.strokeStyle = INK; ctx.lineWidth = 2.4; line(-5, -118, 5, -118);
    ctx.restore();
  }

  function drawInsect(s, t, bit) {
    ctx.save(); ctx.scale(s, s);
    ctx.lineCap = 'round';
    var hover = Math.sin(t * 2.2) * 4 - bit * 12;
    // ground shadow
    ctx.globalAlpha = 0.25; ell(0, -3, 26, 6); ctx.fillStyle = INK; ctx.fill(); ctx.globalAlpha = 1;
    ctx.translate(0, hover);
    // wings (flutter; faster and wider during the bit)
    var fl = Math.sin(t * (26 + bit * 26)) * (0.28 + bit * 0.25);
    ctx.globalAlpha = 0.8;
    ctx.save(); ctx.translate(6, -112); ctx.rotate(-0.7 + fl);
    ell(20, 0, 24, 9); fillStroke(WHITE, 2.6); ctx.restore();
    ctx.save(); ctx.translate(10, -104); ctx.rotate(-0.25 + fl * 0.8);
    ell(18, 0, 19, 7.5); fillStroke(WHITE, 2.6); ctx.restore();
    ctx.globalAlpha = 1;
    // body
    ell(0, -96, 24, 20); fillStroke(BLUE, 3.5);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(8, -114); ctx.quadraticCurveTo(14, -96, 8, -78); ctx.stroke();
    // dangling legs
    ctx.lineWidth = 3.4;
    line(-10, -80, -13, -64); line(2, -78, 2, -62); line(13, -80, 17, -65);
    // stinger
    ctx.beginPath(); ctx.moveTo(23, -92); ctx.lineTo(34, -88); ctx.lineTo(23, -84); ctx.closePath();
    fillStroke(BLUE, 2.6);
    // head
    circ(-24, -104, 13); fillStroke(BLUE, 3.5);
    circ(-28, -106, 3); ctx.fillStyle = INK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-30, -115); ctx.quadraticCurveTo(-38, -128, -44, -126); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-22, -116); ctx.quadraticCurveTo(-24, -130, -31, -131); ctx.stroke();
    ctx.restore();
  }

  function lizardArm(side, flex, shoulderY) {
    // thick muscular arm: ink under-stroke, green over-stroke
    var sx = side * 30, sy = shoulderY;
    var ex = side * (46 + flex * 6), ey = sy + 30 - flex * 26;
    var hx = side * (40 - flex * 16), hy = ey - 4 - flex * 30;
    ctx.lineCap = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = 17;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.strokeStyle = GREEN; ctx.lineWidth = 11.5;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
    if (flex > 0.4) { circ(ex, ey, 10); fillStroke(GREEN, 3); } // bicep bulge
  }
  function drawLizard(s, t, bit) {
    ctx.save(); ctx.scale(s, s);
    // tail
    ctx.strokeStyle = INK; ctx.lineWidth = 13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-24, -14); ctx.quadraticCurveTo(-58, -8, -62, -30); ctx.stroke();
    ctx.strokeStyle = GREEN; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(-24, -14); ctx.quadraticCurveTo(-58, -8, -62, -30); ctx.stroke();
    // legs + feet
    ctx.strokeStyle = INK; ctx.lineWidth = 6;
    line(-13, -40, -15, -6); line(13, -40, 15, -6);
    ell(-17, -4, 11, 5); fillStroke(GREEN, 3);
    ell(17, -4, 11, 5); fillStroke(GREEN, 3);
    // arms behind shirt edge
    lizardArm(-1, bit, -138);
    lizardArm(1, bit, -138);
    // torso: black shirt over a green belly base
    ell(0, -102, 33, 58); fillStroke(GREEN, 3.5);
    ctx.beginPath();
    ctx.moveTo(-33, -148); ctx.lineTo(33, -148); ctx.lineTo(27, -58); ctx.lineTo(-27, -58);
    ctx.closePath(); fillStroke(INK, 3.5);
    ctx.strokeStyle = WHITE; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-14, -146); ctx.lineTo(0, -128); ctx.lineTo(14, -146); ctx.stroke();
    // head + jaw
    ell(0, -168, 22, 18); fillStroke(GREEN, 3.5);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(-14, -158); ctx.quadraticCurveTo(0, -152, 15, -158); ctx.stroke();
    circ(-8, -172, 3.2); ctx.fillStyle = INK; ctx.fill();
    circ(8, -172, 3.2); ctx.fillStyle = INK; ctx.fill();
    ctx.lineWidth = 3; line(-14, -180, 14, -180); // brow
    ctx.restore();
  }

  function drawCat(s, t, bit) {
    ctx.save(); ctx.scale(s, s);
    ctx.lineCap = 'round';
    var tilt = bit * 0.1;
    // tail
    ctx.strokeStyle = INK; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(26, -20); ctx.quadraticCurveTo(56, -26, 50, -58); ctx.stroke();
    ctx.strokeStyle = WHITE; ctx.lineWidth = 6.5;
    ctx.beginPath(); ctx.moveTo(26, -20); ctx.quadraticCurveTo(56, -26, 50, -58); ctx.stroke();
    // feet
    ell(-15, -4, 11, 5); fillStroke(WHITE, 3);
    ell(15, -4, 11, 5); fillStroke(WHITE, 3);
    // body
    ell(0, -58, 30, 44); fillStroke(WHITE, 3.5);
    // ripped green pants over the lower body
    ctx.beginPath();
    ctx.moveTo(-29, -52); ctx.lineTo(29, -52); ctx.lineTo(24, -6); ctx.lineTo(8, -6);
    ctx.lineTo(6, -30); ctx.lineTo(-6, -30); ctx.lineTo(-8, -6); ctx.lineTo(-24, -6);
    ctx.closePath(); fillStroke(GREEN, 3.5);
    // rips: little white triangles
    ctx.fillStyle = WHITE;
    ctx.beginPath(); ctx.moveTo(-18, -34); ctx.lineTo(-10, -34); ctx.lineTo(-14, -25); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12, -42); ctx.lineTo(19, -42); ctx.lineTo(15, -34); ctx.closePath(); ctx.fill();
    // raised paw (waves during the bit)
    ctx.strokeStyle = INK; ctx.lineWidth = 10;
    var pawA = -0.5 + bit * Math.sin(t * 18) * 0.35;
    ctx.beginPath(); ctx.moveTo(26, -84);
    ctx.lineTo(26 + Math.cos(pawA) * 26, -84 + Math.sin(pawA) * 26); ctx.stroke();
    ctx.strokeStyle = WHITE; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(26, -84);
    ctx.lineTo(26 + Math.cos(pawA) * 26, -84 + Math.sin(pawA) * 26); ctx.stroke();
    // head (tilts during the bit)
    ctx.save(); ctx.translate(2, -118); ctx.rotate(tilt);
    ctx.beginPath(); ctx.moveTo(-24, -18); ctx.lineTo(-20, -40); ctx.lineTo(-6, -26); ctx.closePath(); fillStroke(WHITE, 3.2);
    ctx.beginPath(); ctx.moveTo(24, -18); ctx.lineTo(20, -40); ctx.lineTo(6, -26); ctx.closePath(); fillStroke(WHITE, 3.2);
    circ(0, 0, 27); fillStroke(WHITE, 3.5);
    // left eye: dot, winks shut during the bit
    if (bit > 0.5) { ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(-10, -3, 5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
    else { circ(-10, -3, 3.4); ctx.fillStyle = INK; ctx.fill(); }
    // right eye: the permanent wink
    ctx.strokeStyle = INK; ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.arc(11, -4, 5.5, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    // nose + mouth
    ctx.beginPath(); ctx.moveTo(-3, 4); ctx.lineTo(3, 4); ctx.lineTo(0, 8); ctx.closePath();
    ctx.fillStyle = INK; ctx.fill();
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(-4, 8, 4, 0, 0.8 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(4, 8, 4, 0.2 * Math.PI, Math.PI); ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  var CAST = [
    { draw: drawMouse,  gag: 'me cosieron un ojo, pero veo venir todo.' },
    { draw: drawBug,    gag: 'paz y amor... pero de lejos, eh.' },
    { draw: drawAlien,  gag: 'en mi planeta esto es higiene.' },
    { draw: drawInsect, gag: 'yo solo pasaba volando, ¿eh?' },
    { draw: drawLizard, gag: 'este cuerpo no se hace solo.' },
    { draw: drawCat,    gag: 'debajo del sofá se vive mejor.' }
  ];

  // ---------------- bar dressing, precomputed from the seed ----------------
  var dressRng = mulberry32(554066);
  var BOTTLES = [];
  (function () {
    var cols = [BLUE, GREEN, PURPLE, TAN, GREY];
    var rows = [{ y: 486, x0: 640, x1: 812 }, { y: 486, x0: 968, x1: 1140 },
                { y: 560, x0: 640, x1: 812 }, { y: 560, x0: 968, x1: 1140 }];
    for (var r = 0; r < rows.length; r++) {
      var x = rows[r].x0 + 8;
      while (x < rows[r].x1 - 26) {
        var w = 20 + dressRng() * 8, h = 42 + dressRng() * 16;
        BOTTLES.push({ x: x, base: rows[r].y, w: w, h: h, c: cols[Math.floor(dressRng() * cols.length)] });
        x += w + 10 + dressRng() * 10;
      }
    }
  })();
  // A proper bottle silhouette: body, shoulder, neck.
  function drawBottle(x, base, w, h, c) {
    var nx = x + w * 0.34, nw = w * 0.32, shY = base - h * 0.58;
    ctx.beginPath();
    ctx.moveTo(x, base);
    ctx.lineTo(x, shY);
    ctx.quadraticCurveTo(x, base - h * 0.8, nx, base - h * 0.8);
    ctx.lineTo(nx, base - h);
    ctx.lineTo(nx + nw, base - h);
    ctx.lineTo(nx + nw, base - h * 0.8);
    ctx.quadraticCurveTo(x + w, base - h * 0.8, x + w, shY);
    ctx.lineTo(x + w, base);
    ctx.closePath();
    fillStroke(c, 2.4);
  }
  var DRINK_X = [668, 726, 1012, 1082, 782, 948];   // counter slots, filled as chaos rises
  var SPILLS = [
    { x: 700, y: 700, rx: 30, ry: 7 }, { x: 1050, y: 724, rx: 38, ry: 8 },
    { x: 880, y: 748, rx: 44, ry: 8 }, { x: 760, y: 664, rx: 20, ry: 5 }
  ];
  var WISPS = [
    { x: 690, off: 0.0 }, { x: 880, off: 0.35 }, { x: 1040, off: 0.6 },
    { x: 790, off: 0.8 }, { x: 960, off: 0.2 }
  ];
  var STARS = [];
  (function () {
    for (var i = 0; i < 22; i++)
      STARS.push({ x: 48 + dressRng() * 528, y: 376 + dressRng() * 130, r: 1.4 + dressRng() * 1.8 });
  })();

  // ---------------- interaction state ----------------
  var bitWho = -1, bitStart = -10;       // lineup signature bit
  var chaos = 0;                          // bar chaos level 0..4
  var roundStart = -10;                   // last bartender round time
  var drinkBorn = [PHASE0, PHASE0, -1, -1, -1, -1]; // first two drinks are just there

  var P1 = { x: 36, y: 28, w: 1128, h: 308 };
  var SLOT_X = [130, 318, 506, 694, 882, 1070];
  var LINEUP_BASE = 322, LINEUP_S = 0.72;
  var BAR = { x: 612, y: 360, w: 552, h: 412 };

  function bitEnv(who, t) {
    if (who !== bitWho) return 0;
    var u = (t - bitStart) / 1.2;
    if (u < 0 || u > 1) return 0;
    return Math.sin(u * Math.PI);
  }
  function roundEnv(t) {
    var u = (t - roundStart) / 1.2;
    if (u < 0 || u > 1) return 0;
    return Math.sin(u * Math.PI);
  }

  // ---------------- scenes ----------------
  function drawLineup(t) {
    panel(P1.x, P1.y, P1.w, P1.h, TAN, 101);
    // title band
    wobRectPath(56, 44, 1088, 58, 8, 202, 1.6);
    ctx.fillStyle = INK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    textWob('MUGRE DEBAJO DEL SOFÁ', 600, 74, 40, TAN, 3);
    // ground line
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    line(60, LINEUP_BASE, 1140, LINEUP_BASE);
    // cast
    for (var i = 0; i < 6; i++) {
      var bob = (i === 3) ? 0 : Math.sin(t * 1.4 + i * 1.1) * 2;
      ctx.save(); ctx.translate(SLOT_X[i], LINEUP_BASE + bob);
      CAST[i].draw(LINEUP_S, t, bitEnv(i, t));
      ctx.restore();
    }
    // gag bubble for the tapped member
    if (bitWho >= 0 && t - bitStart < 2.8) {
      var gx = Math.max(52, Math.min(920, SLOT_X[bitWho] - 114));
      bubbleText(gx, 116, 228, 56, SLOT_X[bitWho], 196, CAST[bitWho].gag, 19, 700 + bitWho);
    }
  }

  function drawAlley(t) {
    var A = { x: 36, y: 360, w: 552, h: 412 };
    panel(A.x, A.y, A.w, A.h, INDIGO, 303);
    ctx.save();
    wobRectPath(A.x, A.y, A.w, A.h, 10, 303, 2.2); ctx.clip();
    // stars + moon
    ctx.fillStyle = TAN;
    for (var i = 0; i < STARS.length; i++) { circ(STARS[i].x, STARS[i].y, STARS[i].r); ctx.fill(); }
    circ(516, 414, 28); fillStroke(TAN, 3.5);
    circ(505, 406, 6); ctx.fillStyle = INDIGO; ctx.globalAlpha = 0.35; ctx.fill(); ctx.globalAlpha = 1;
    // wall bricks: quiet ink lines
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.globalAlpha = 0.4;
    for (var r2 = 0; r2 < 3; r2++) line(48, 560 + r2 * 44, 576, 560 + r2 * 44);
    ctx.globalAlpha = 1;
    // trash can: tapered body, slats, ink lid
    ctx.beginPath();
    ctx.moveTo(68, 618); ctx.lineTo(112, 618); ctx.lineTo(105, 696); ctx.lineTo(75, 696);
    ctx.closePath(); fillStroke(GREY, 3.2);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
    line(82, 622, 84, 692); line(90, 622, 90, 692); line(98, 622, 96, 692);
    wobRectPath(63, 605, 54, 14, 4, 405, 1.2); fillStroke(INK, 3);
    // puddle
    ctx.globalAlpha = 0.5; ell(300, 726, 66, 10); ctx.fillStyle = BLUE; ctx.fill(); ctx.globalAlpha = 1;
    // ground
    ctx.strokeStyle = INK; ctx.lineWidth = 3.4; line(44, 702, 580, 702);
    // the gang, hanging out
    ctx.save(); ctx.translate(168, 702); drawMouse(0.62, t, 0); ctx.restore();
    ctx.save(); ctx.translate(322, 702); drawBug(0.62, t, 0); ctx.restore();
    ctx.save(); ctx.translate(468, 702); drawCat(0.62, t, 0); ctx.restore();
    // the whole conversation
    bubbleText(52, 428, 210, 54, 300, 592, '¿qué plan hoy?', 21, 801);
    bubbleText(322, 486, 224, 54, 452, 592, '¡pues lo de siempre!', 21, 802);
    ctx.restore();
    panel(A.x, A.y, A.w, A.h, 'rgba(0,0,0,0)', 303); // re-stroke frame over the clip
  }

  function drawBartender(t) {
    var bx = 890, topY = 646; // origin at counter top
    var wave = roundEnv(t);
    ctx.save(); ctx.translate(bx, topY);
    // shell behind the body
    ell(0, -66, 47, 60); fillStroke(WOOD, 3.5);
    // arms: three per side, swaying; they flap on a new round
    ctx.lineCap = 'round';
    for (var side = -1; side <= 1; side += 2) {
      for (var k = 0; k < 3; k++) {
        var sway = Math.sin(t * (1.8 + wave * 7) + k * 1.3 + (side > 0 ? 2 : 0)) * (7 + wave * 13);
        var sx = side * 28, sy = -104 + k * 26;
        var ex = side * (58 + k * 7), ey = sy - 16 + sway;
        var hx = side * (84 + k * 9), hy = ey - 20 + sway * 0.6;
        ctx.strokeStyle = INK; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
        circ(hx, hy, 5); ctx.fillStyle = INK; ctx.fill();
      }
    }
    // bottle in the top left hand, cloth in the top right hand
    ctx.save(); ctx.translate(-102, -168 + Math.sin(t * 1.8) * 7); ctx.rotate(-0.2);
    drawBottle(-11, 14, 22, 52, PURPLE);
    ctx.restore();
    ctx.save(); ctx.translate(102, -160 + Math.sin(t * 1.8 + 2) * 7); ctx.rotate(0.25);
    wobRectPath(-13, -4, 26, 30, 3, 506, 1.4); fillStroke(WHITE, 2.6);
    ctx.restore();
    // body + head
    ell(0, -62, 34, 50); fillStroke(INK, 3.5);
    circ(0, -128, 20); fillStroke(INK, 3.5);
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-8, -144); ctx.quadraticCurveTo(-26, -168, -38, -164); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, -144); ctx.quadraticCurveTo(26, -168, 38, -164); ctx.stroke();
    circ(-7, -131, 3); ctx.fillStyle = WHITE; ctx.fill();
    circ(7, -131, 3); ctx.fillStyle = WHITE; ctx.fill();
    ctx.restore();
    // spoken on a new round
    if (t - roundStart < 2.2 && roundStart > 0)
      bubbleText(742, 470, 240, 62, 884, 508, 'ronda nueva. luego no lloréis.', 19, 909);
  }

  function drawBar(t) {
    panel(BAR.x, BAR.y, BAR.w, BAR.h, WOOD, 606);
    ctx.save();
    wobRectPath(BAR.x, BAR.y, BAR.w, BAR.h, 10, 606, 2.2); ctx.clip();
    // shelves
    ctx.fillStyle = INK;
    ctx.fillRect(632, 486, 188, 7); ctx.fillRect(960, 486, 188, 7);
    ctx.fillRect(632, 560, 188, 7); ctx.fillRect(960, 560, 188, 7);
    // bottles
    for (var i = 0; i < BOTTLES.length; i++) {
      var b = BOTTLES[i];
      drawBottle(b.x, b.base, b.w, b.h, b.c);
    }
    // the tequila ritual, quoted over the bar
    bubbleText(640, 382, 300, 64, 872, 500, 'la sal por la nariz, y el limón por los ojos', 20, 808);
    drawBartender(t);
    // counter: ink top band, wood front
    wobRectPath(612, 638, 552, 20, 4, 707, 1.4); fillStroke(INK, 3.2);
    ctx.fillStyle = WOOD; ctx.fillRect(612, 658, 552, 114);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.globalAlpha = 0.55;
    line(640, 690, 1140, 690); line(640, 726, 1140, 726);
    ctx.globalAlpha = 1;
    // spills on the counter front, more with chaos
    ctx.fillStyle = INK;
    for (var si = 0; si < chaos && si < SPILLS.length; si++) {
      var sp = SPILLS[si];
      ell(sp.x, sp.y, sp.rx, sp.ry); ctx.fill();
      ell(sp.x + sp.rx * 0.4, sp.y + sp.ry + 5, sp.rx * 0.3, 3.4); ctx.fill();
    }
    // drinks on the counter, sliding in as rounds land
    var nDrinks = 2 + chaos;
    for (var d = 0; d < nDrinks && d < DRINK_X.length; d++) {
      var born = drinkBorn[d];
      var slide = born < 0 ? 0 : (1 - easeOut(clamp01((t - born) / 0.7))) * 64;
      var gx = DRINK_X[d] + slide, gy = 640;
      ctx.beginPath();
      ctx.moveTo(gx - 11, gy - 30); ctx.lineTo(gx + 11, gy - 30);
      ctx.lineTo(gx + 8, gy); ctx.lineTo(gx - 8, gy); ctx.closePath();
      fillStroke(WHITE, 2.6);
      ctx.fillStyle = TAN; ctx.fillRect(gx - 9, gy - 24, 18, 7);
      line(gx + 4, gy - 30, gx + 12, gy - 44); ctx.strokeStyle = INK;
    }
    // smoke wisps, more with chaos
    var nW = 1 + chaos;
    for (var wi = 0; wi < nW && wi < WISPS.length; wi++) {
      var wp = WISPS[wi];
      var ph = ((t * 0.16 + wp.off) % 1);
      ctx.globalAlpha = 0.32 * (1 - ph);
      circ(wp.x + Math.sin(ph * 5 + wp.off * 9) * 7, 616 - ph * 74, 5 + ph * 10);
      ctx.fillStyle = GREY; ctx.fill();
      ctx.globalAlpha = 1;
    }
    // patrons on stools, in front of the counter
    ctx.strokeStyle = INK; ctx.lineWidth = 4.4;
    line(672, 716, 672, 762); line(1104, 716, 1104, 762);
    ell(672, 714, 24, 6); fillStroke(TAN, 3);
    ell(1104, 714, 24, 6); fillStroke(TAN, 3);
    ctx.save(); ctx.translate(676, 720); drawCat(0.55, t, 0); ctx.restore();
    ctx.save(); ctx.translate(1100, 722); drawLizard(0.58, t, 0); ctx.restore();
    ctx.restore();
    panel(BAR.x, BAR.y, BAR.w, BAR.h, 'rgba(0,0,0,0)', 606);
  }

  // ---------------- main draw ----------------
  var W = 0, H = 0, S = 1, OX = 0, OY = 0;
  var simT = PHASE0;

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = TAN;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S, S);
    ctx.lineJoin = 'round';
    drawLineup(t);
    drawAlley(t);
    drawBar(t);
    ctx.restore();
    // hint
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = INK;
    ctx.font = '15px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('tap', W - 12, H - 9);
    ctx.restore();
  }

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }
  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      S = W / DW; OX = 0; OY = (H - DH * S) / 2;
    } else {
      S = Math.min(W / DW, H / DH);
      OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
    }
    draw(simT);
  }

  // ---------------- pointer: taps only, never a reload ----------------
  var lastStamp = -1;
  function onTap(e) {
    if (e.timeStamp !== undefined && e.timeStamp - lastStamp < 350) return;
    lastStamp = e.timeStamp || 0;
    var px = ((e.clientX || 0) - OX) / S, py = ((e.clientY || 0) - OY) / S;
    // lineup cast member?
    if (py > 140 && py < 336) {
      for (var i = 0; i < 6; i++) {
        if (Math.abs(px - SLOT_X[i]) < 84) {
          bitWho = i; bitStart = simT; draw(simT); return;
        }
      }
    }
    // bartender?
    if (px > 786 && px < 994 && py > 462 && py < 652) {
      if (chaos < 4) {
        chaos++;
        drinkBorn[1 + chaos] = simT; // the newest drink slides in
        if (drinkBorn[chaos + 1] === -1) drinkBorn[chaos + 1] = simT;
      }
      roundStart = simT;
      draw(simT);
      return;
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onTap);
    canvas.addEventListener('touchstart', onTap);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
