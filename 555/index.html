<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin Mi Ayuda Estarías Perdido</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EAC97E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict, nothing else. Flat fills only, no gradients.
  var YELLOW = '#F2C230', JUNGLE = '#3E7A3E', WHITE = '#FFFFFF',
      TAN = '#EAC97E', INK = '#1A1A1A', BLUSH = '#F08A8A';

  var PHASE0 = 0.9; // constant first-frame phase

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(555067);

  // ---- the advice bank: 12 fixed lines, his smug voice (work, love, health, money) ----
  var BANK = [
    'El truco del trabajo es parecer ocupado. De nada.',
    'Si tu jefe no te valora, renuncia. Yo te consigo otro. Bueno, casi.',
    'En el amor, hazte el difícil. Funciona siempre. Casi siempre.',
    '¿Problemas de pareja? Compra flores. O un coche. Yo qué sé.',
    'Para la salud: duerme mucho y no leas noticias. Problema resuelto.',
    'El dolor de espalda se cura ignorándolo. Confía en mí.',
    'El dinero se multiplica solo si no lo miras. Es física.',
    'Invierte en lo que suba. Si baja, es que no era eso.',
    'La dieta perfecta: come de todo, pero con confianza.',
    'Si discutes, sube el volumen. Así se ganan los debates.',
    'Tu currículum está perfecto. Solo falta que lo lean.',
    'El amor verdadero llega cuando dejas de buscarlo. O no.'
  ];
  var adviceIdx = Math.floor(rng() * BANK.length); // fixed seed pick: frame one

  // ---- layout (1080 x 1080 design space): 2x2 wobbly panels ----
  var SLOTS = [
    { x: 40,  y: 36,  w: 480, h: 462 },
    { x: 560, y: 36,  w: 480, h: 462 },
    { x: 40,  y: 538, w: 480, h: 462 },
    { x: 560, y: 538, w: 480, h: 462 }
  ];
  var rot = 0; // carousel rotation: content c sits in slot (c + rot) % 4

  // ---- precomputed wobble seeds per panel frame (fixed forever) ----
  function jitterPath(x, y, w, h, seed) {
    var r = mulberry32(seed);
    var pts = [], i, t;
    var steps = 7;
    for (i = 0; i <= steps; i++) { t = i / steps; pts.push([x + t * w, y + (r() - 0.5) * 7]); }
    for (i = 1; i <= steps; i++) { t = i / steps; pts.push([x + w + (r() - 0.5) * 7, y + t * h]); }
    for (i = 1; i <= steps; i++) { t = i / steps; pts.push([x + w - t * w, y + h + (r() - 0.5) * 7]); }
    for (i = 1; i < steps; i++) { t = i / steps; pts.push([x + (r() - 0.5) * 7, y + h - t * h]); }
    return pts;
  }
  var FRAMES = SLOTS.map(function (s, i) { return jitterPath(s.x, s.y, s.w, s.h, 9100 + i * 131); });

  // ---- precomputed jungle hatch field for panel 2 (seeded, fixed) ----
  var HATCH = [];
  (function () {
    var r = mulberry32(4242);
    for (var i = 0; i < 210; i++) {
      HATCH.push({
        x: r() * 480, y: r() * 462,
        len: 16 + r() * 26, ang: (r() - 0.5) * 0.9 + 0.7, w: 2 + r() * 2.4
      });
    }
    // a few leaf blobs among the hatch
    for (var j = 0; j < 26; j++) {
      HATCH.push({ leaf: true, x: r() * 480, y: r() * 462, s: 9 + r() * 13, ang: r() * Math.PI });
    }
  })();

  // ---- small helpers ----
  function tracePts(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }

  // hand-lettered wobbly text: per-letter jitter from a stable string hash
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function wobText(text, cx, cy, size, align) {
    ctx.font = '700 ' + size + 'px "Comic Sans MS", "Segoe Print", "Comic Neue", cursive, sans-serif';
    ctx.fillStyle = INK;
    ctx.textBaseline = 'middle';
    var r = mulberry32(hashStr(text + '|' + size));
    var widths = [], total = 0, i, w;
    for (i = 0; i < text.length; i++) { w = ctx.measureText(text[i]).width; widths.push(w); total += w; }
    var x = align === 'center' ? cx - total / 2 : cx;
    for (i = 0; i < text.length; i++) {
      ctx.save();
      ctx.translate(x + widths[i] / 2, cy + (r() - 0.5) * size * 0.14);
      ctx.rotate((r() - 0.5) * 0.13);
      ctx.textAlign = 'center';
      ctx.fillText(text[i], 0, 0);
      ctx.restore();
      x += widths[i];
    }
  }
  function wrapText(text, maxW, size) {
    ctx.font = '700 ' + size + 'px "Comic Sans MS", "Segoe Print", "Comic Neue", cursive, sans-serif';
    var words = text.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var t = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = t;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  // a wobbly speech bubble with a short tail hanging from its bottom edge
  function bubble(bx, by, bw, bh, tailX, tailY, lines, size) {
    rr(bx, by, bw, bh, 26);
    ctx.fillStyle = WHITE; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    // tail triangle: base centred on tailX along the bottom edge
    var half = 17;
    ctx.beginPath();
    ctx.moveTo(tailX - half, by + bh - 3);
    ctx.lineTo(tailX, tailY);
    ctx.lineTo(tailX + half, by + bh - 3);
    ctx.closePath();
    ctx.fillStyle = WHITE; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    // erase the seam where the tail meets the bubble bottom
    ctx.beginPath();
    ctx.moveTo(tailX - half + 4, by + bh - 4);
    ctx.lineTo(tailX + half - 4, by + bh - 4);
    ctx.strokeStyle = WHITE; ctx.lineWidth = 7; ctx.stroke();
    var lh = size * 1.28;
    var y0 = by + bh / 2 - (lines.length - 1) * lh / 2;
    for (var i = 0; i < lines.length; i++) wobText(lines[i], bx + bw / 2, y0 + i * lh, size, 'center');
  }

  // ---- Señor Sabenada ----
  // pose: 'waveL' | 'point' | 'wink' | 'waveR'; look: {x,y} pupil offset; wag: finger wag angle
  function sabenada(cx, baseY, pose, look, wag) {
    var bobY = 0;
    ctx.save();
    ctx.translate(cx, baseY + bobY);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    // legs / feet
    ctx.strokeStyle = INK; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(-34, -52); ctx.lineTo(-38, -6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(34, -52); ctx.lineTo(38, -6); ctx.stroke();
    ell(-46, -4, 20, 9); ctx.fillStyle = INK; ctx.fill();
    ell(46, -4, 20, 9); ctx.fillStyle = INK; ctx.fill();

    // arms behind body where needed
    function arm(sx, sy, ex, ey, hand) {
      ctx.strokeStyle = YELLOW; ctx.lineWidth = 30;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
      circ(ex, ey, 17); ctx.fillStyle = YELLOW; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
      if (hand) hand(ex, ey);
    }

    if (pose === 'waveL') {
      arm(-72, -196, -128, -268, null); // raised waving hand
      arm(72, -196, 108, -128, null);
    } else if (pose === 'waveR') {
      arm(72, -196, 128, -268, null);
      arm(-72, -196, -108, -128, null);
    } else if (pose === 'wink') {
      // OK hand up at right
      arm(72, -196, 126, -238, function (hx, hy) {
        ctx.save(); ctx.translate(hx, hy);
        circ(16, -10, 15); ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
        ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(24, -20); ctx.lineTo(38, -42); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(29, -12); ctx.lineTo(47, -30); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(28, -3); ctx.lineTo(48, -14); ctx.stroke();
        ctx.restore();
      });
      arm(-72, -196, -104, -132, null);
    }

    // body: one proud yellow blob
    ctx.beginPath();
    ctx.moveTo(0, -262);
    ctx.bezierCurveTo(66, -262, 88, -196, 84, -128);
    ctx.bezierCurveTo(80, -66, 44, -34, 0, -34);
    ctx.bezierCurveTo(-44, -34, -80, -66, -84, -128);
    ctx.bezierCurveTo(-88, -196, -66, -262, 0, -262);
    ctx.closePath();
    ctx.fillStyle = YELLOW; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();

    if (pose === 'point') {
      // raised pointing arm, hand placed by caller via wag/look direction
      var hx = 118 + look.x * 0.7, hy = -252 + look.y * 0.7;
      ctx.strokeStyle = YELLOW; ctx.lineWidth = 30;
      ctx.beginPath(); ctx.moveTo(70, -208); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.moveTo(70, -208); ctx.lineTo(hx, hy); ctx.stroke();
      circ(hx, hy, 17); ctx.fillStyle = YELLOW; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
      // the wagging finger
      var fx = hx + 26 + Math.sin(wag) * 7, fy = hy - 16 - Math.abs(Math.cos(wag)) * 4;
      ctx.strokeStyle = INK; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(hx + 6, hy - 4); ctx.lineTo(fx, fy); ctx.stroke();
      arm(-72, -196, -106, -130, null);
    }

    // face: permanent smug
    var lx = look.x, ly = look.y;
    // blush
    ell(-46, -196, 15, 10); ctx.fillStyle = BLUSH; ctx.fill();
    ell(46, -196, 15, 10); ctx.fillStyle = BLUSH; ctx.fill();
    if (pose === 'wink') {
      // left eye winks shut, right eye smug
      ctx.strokeStyle = INK; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-38, -224); ctx.quadraticCurveTo(-24, -216, -10, -224); ctx.stroke();
      circ(26 + lx, -226 + ly, 6.5); ctx.fillStyle = INK; ctx.fill();
      ctx.beginPath(); ctx.moveTo(8, -240); ctx.lineTo(44, -240); ctx.stroke(); // lid
    } else {
      circ(-25 + lx, -226 + ly, 6.5); ctx.fillStyle = INK; ctx.fill();
      circ(25 + lx, -226 + ly, 6.5); ctx.fillStyle = INK; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-42, -241); ctx.lineTo(-8, -241); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, -241); ctx.lineTo(42, -241); ctx.stroke();
      // smug raised brow
      ctx.beginPath(); ctx.moveTo(-40, -252); ctx.quadraticCurveTo(-24, -260, -8, -253); ctx.stroke();
    }
    // smug smile, always
    ctx.strokeStyle = INK; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(4, -196, 22, Math.PI * 0.15, Math.PI * 0.8); ctx.stroke();

    ctx.restore();
  }

  // ---- panels (content 0..3), drawn inside slot rect s ----
  function panelBG(idx, s) {
    if (idx === 1) {
      ctx.fillStyle = JUNGLE; ctx.fillRect(s.x + 5, s.y + 5, s.w - 10, s.h - 10);
      ctx.save();
      ctx.beginPath(); ctx.rect(s.x + 5, s.y + 5, s.w - 10, s.h - 10); ctx.clip();
      ctx.translate(s.x, s.y);
      ctx.strokeStyle = INK; ctx.lineCap = 'round';
      for (var i = 0; i < HATCH.length; i++) {
        var h = HATCH[i];
        if (h.leaf) {
          ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.ang);
          ell(0, 0, h.s, h.s * 0.42); ctx.fillStyle = JUNGLE; ctx.fill();
          ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.stroke();
          ctx.restore();
        } else {
          ctx.lineWidth = h.w;
          ctx.beginPath();
          ctx.moveTo(h.x, h.y);
          ctx.lineTo(h.x + Math.cos(h.ang) * h.len, h.y + Math.sin(h.ang) * h.len);
          ctx.stroke();
        }
      }
      ctx.restore();
    } else if (idx === 2) {
      ctx.fillStyle = TAN; ctx.fillRect(s.x + 5, s.y + 5, s.w - 10, s.h - 10);
    } else {
      ctx.fillStyle = WHITE; ctx.fillRect(s.x + 5, s.y + 5, s.w - 10, s.h - 10);
    }
  }

  function panelContent(idx, s, t, look, wag) {
    var cx = s.x + s.w / 2, baseY = s.y + s.h - 26;
    if (idx === 0) {
      bubble(s.x + 22, s.y + 20, 192, 76, cx - 104, s.y + 130, ['¡HOLA!'], 40);
      bubble(s.x + 232, s.y + 20, 232, 100, cx + 52, s.y + 152,
        ['nunca entendí', 'a qué te dedicas'], 25);
      sabenada(cx, baseY, 'waveL', look, 0);
    } else if (idx === 1) {
      var lines = wrapText(BANK[adviceIdx], 356, 26);
      var bh = lines.length * 34 + 30;
      bubble(s.x + 42, s.y + 22, 396, bh, cx + 84, s.y + 22 + bh + 32, lines, 26);
      sabenada(cx, baseY, 'point', look, wag);
    } else if (idx === 2) {
      bubble(s.x + 52, s.y + 24, 376, 128, cx + 6, s.y + 24 + 128 + 28,
        ['SIN MI AYUDA', 'ESTARÍAS PERDIDO,', 'BEBÉ…'], 29);
      sabenada(cx, baseY, 'wink', look, 0);
    } else {
      bubble(s.x + 120, s.y + 26, 240, 76, cx + 66, s.y + 26 + 76 + 32, ['¡SALUDOS!'], 36);
      sabenada(cx, baseY, 'waveR', look, 0);
    }
  }

  // ---- interaction state ----
  var dragging = false, dragMoved = false, downX = 0, downY = 0, downT = 0;
  var look = { x: 0, y: 0 };   // pupil/hand follow, design units
  var lookTgt = { x: 0, y: 0 };

  function toDesign(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return {
      x: (e.clientX - r.left - OX) / S * 1080,
      y: (e.clientY - r.top - OY) / S * 1080
    };
  }
  function onDown(e) {
    var p = toDesign(e);
    dragging = true; dragMoved = false;
    downX = p.x; downY = p.y; downT = simT;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var p = toDesign(e);
    if (Math.abs(p.x - downX) + Math.abs(p.y - downY) > 14) dragMoved = true;
    if (dragMoved) {
      // eyes + pointing hand aim from panel-2 figure's face toward the pointer
      var slot = SLOTS[(1 + rot) % 4];
      var fx = slot.x + slot.w / 2, fy = slot.y + slot.h - 26 - 226;
      var dx = p.x - fx, dy = p.y - fy;
      var m = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      lookTgt.x = dx / m * 9; lookTgt.y = dy / m * 7;
    }
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var wasDrag = dragMoved;
    dragMoved = false;
    lookTgt.x = 0; lookTgt.y = 0;
    if (wasDrag) {
      // release: snap back smug + fresh unsolicited advice
      adviceIdx = (adviceIdx + 1) % BANK.length;
    } else if (simT - downT < 1.2) {
      rot = (rot + 1) % 4; // tap: carousel advances by one
    }
    draw(simT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---- draw ----
  var simT = PHASE0;
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = TAN;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);
    ctx.lineJoin = 'round';

    // ease the gaze toward its target (snaps home on release)
    look.x += (lookTgt.x - look.x) * 0.35;
    look.y += (lookTgt.y - look.y) * 0.35;
    var wag = dragging && dragMoved ? t * 14 : 0;

    for (var c = 0; c < 4; c++) {
      var slot = SLOTS[(c + rot) % 4];
      var frame = FRAMES[(c + rot) % 4];
      panelBG(c, slot);
      panelContent(c, slot, t, c === 1 ? look : { x: 0, y: 0 }, wag);
      tracePts(frame);
      ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
    }

    // hint
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = INK;
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('drag · tap', 1052, 1072);
    ctx.restore();

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground is tan) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }
  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      S = W; OX = 0; OY = (H - S) / 2;
    } else {
      S = Math.min(W, H); OX = (W - S) / 2; OY = (H - S) / 2;
    }
    draw(simT);
  }

  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
