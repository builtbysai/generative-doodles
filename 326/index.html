<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.326 Swirling Vines</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EFE6D2; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.326 Swirling Vines (meohmy_graphics).
// Six jungle vines trail from the top edge down across a cream
// ground, built as chained segments with a per segment curl phase
// taken from authored stem tables. Exactly 3 daisies sit at
// authored nodes on each stem, 18 daisies in all, and leaves sit
// at authored nodes in the same tables. The idle motion is a 40s
// seamless loop of slow curl and unfurl at the vine tips plus a
// gentle leaf tremble, with stems fully grown in frame one, so
// the frame at 40s is identical to frame 0. Dragging is a wind:
// segments near the pointer bend away on springs and spring back
// when it passes, and the daisies tremble. No stem is uprooted
// and nothing is reseeded. All marks are data drawn each frame
// on one canvas.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GREEN = '#3E6B4F', TEAL = '#2E7D7B', CREAM = '#F2EBD8', GOLD = '#D9A441', GROUND = '#EFE6D2';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 40;
var T = 9.0, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var NSEG = 18, SEGLEN = 52;

function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }

// ---- authored stem tables --------------------------------------
// SWIRL is the authored per segment bend table, read at a per
// stem shift and direction. Daisies and leaves are authored per
// stem as node indices along the chain, with side, size and a
// tremble phase for each one.
var SWIRL = [-0.28, -0.38, -0.30, -0.10, 0.16, 0.34, 0.40, 0.28, 0.06, -0.18, -0.34, -0.38, -0.26, -0.04, 0.20, 0.36, 0.40, 0.24];
var STEMS = [
  { x: 105, dir: 1, shift: 0, curl: 0.0,
    daisies: [{ node: 5, side: 1, scale: 1.00 }, { node: 11, side: -1, scale: 0.86 }, { node: 16, side: 1, scale: 1.10 }],
    leaves: [{ node: 2, side: -1, size: 1.00, ph: 0.4 }, { node: 4, side: 1, size: 0.90, ph: 1.7 }, { node: 7, side: -1, size: 1.05, ph: 2.9 }, { node: 9, side: 1, size: 0.92, ph: 4.1 }, { node: 13, side: -1, size: 1.00, ph: 5.3 }, { node: 15, side: 1, size: 0.88, ph: 0.9 }] },
  { x: 315, dir: -1, shift: 4, curl: 1.1,
    daisies: [{ node: 4, side: -1, scale: 0.90 }, { node: 10, side: 1, scale: 1.08 }, { node: 15, side: -1, scale: 0.96 }],
    leaves: [{ node: 2, side: 1, size: 0.92, ph: 2.2 }, { node: 6, side: -1, size: 1.02, ph: 3.6 }, { node: 8, side: 1, size: 0.88, ph: 5.0 }, { node: 12, side: -1, size: 1.06, ph: 1.2 }, { node: 14, side: 1, size: 0.94, ph: 2.7 }, { node: 17, side: -1, size: 0.86, ph: 4.4 }] },
  { x: 525, dir: 1, shift: 8, curl: 2.2,
    daisies: [{ node: 6, side: 1, scale: 1.06 }, { node: 12, side: -1, scale: 0.92 }, { node: 17, side: 1, scale: 1.00 }],
    leaves: [{ node: 3, side: -1, size: 0.98, ph: 5.6 }, { node: 5, side: 1, size: 1.04, ph: 0.8 }, { node: 8, side: -1, size: 0.90, ph: 2.0 }, { node: 10, side: 1, size: 1.00, ph: 3.3 }, { node: 13, side: -1, size: 0.94, ph: 4.7 }, { node: 16, side: 1, size: 1.02, ph: 1.5 }] },
  { x: 715, dir: -1, shift: 2, curl: 3.3,
    daisies: [{ node: 5, side: -1, scale: 0.94 }, { node: 11, side: 1, scale: 1.02 }, { node: 16, side: -1, scale: 0.88 }],
    leaves: [{ node: 2, side: 1, size: 1.04, ph: 1.0 }, { node: 4, side: -1, size: 0.90, ph: 2.4 }, { node: 7, side: 1, size: 0.96, ph: 3.8 }, { node: 9, side: -1, size: 1.08, ph: 5.1 }, { node: 13, side: 1, size: 0.90, ph: 0.2 }, { node: 15, side: -1, size: 0.98, ph: 3.0 }] },
  { x: 930, dir: 1, shift: 11, curl: 4.4,
    daisies: [{ node: 4, side: 1, scale: 1.02 }, { node: 10, side: -1, scale: 0.88 }, { node: 15, side: 1, scale: 1.06 }],
    leaves: [{ node: 3, side: 1, size: 0.88, ph: 4.9 }, { node: 6, side: -1, size: 1.00, ph: 1.4 }, { node: 8, side: 1, size: 1.06, ph: 2.8 }, { node: 12, side: -1, size: 0.92, ph: 4.0 }, { node: 14, side: 1, size: 1.00, ph: 5.5 }, { node: 17, side: -1, size: 0.90, ph: 0.6 }] },
  { x: 1145, dir: -1, shift: 6, curl: 5.5,
    daisies: [{ node: 6, side: -1, scale: 0.92 }, { node: 12, side: 1, scale: 1.04 }, { node: 17, side: -1, scale: 0.98 }],
    leaves: [{ node: 2, side: -1, size: 0.96, ph: 3.1 }, { node: 5, side: 1, size: 1.02, ph: 4.5 }, { node: 8, side: -1, size: 0.90, ph: 5.8 }, { node: 10, side: 1, size: 0.98, ph: 1.9 }, { node: 13, side: -1, size: 1.04, ph: 3.4 }, { node: 16, side: 1, size: 0.92, ph: 0.3 }] }
];
if (STEMS.length !== 6) throw new Error('Swirling Vines needs exactly 6 stems');
(function () {
  var totalDaisies = 0, totalLeaves = 0, i;
  for (i = 0; i < STEMS.length; i++) {
    if (STEMS[i].daisies.length !== 3) throw new Error('Swirling Vines needs exactly 3 daisies per stem');
    if (!STEMS[i].leaves.length) throw new Error('Swirling Vines needs leaves at authored nodes');
    totalDaisies += STEMS[i].daisies.length;
    totalLeaves += STEMS[i].leaves.length;
  }
  if (totalDaisies !== 18) throw new Error('Swirling Vines needs exactly 18 daisies');
  if (totalLeaves !== 36) throw new Error('Swirling Vines needs exactly 36 leaves');
})();
// Per segment wind spring state, one offset and velocity per segment.
(function () {
  var i, j;
  for (i = 0; i < STEMS.length; i++) {
    STEMS[i].wind = []; STEMS[i].windV = [];
    for (j = 0; j < NSEG; j++) { STEMS[i].wind.push(0); STEMS[i].windV.push(0); }
  }
})();

function loopPhase(t) { return ((t % LOOP) / LOOP) * Math.PI * 2; }

// Forward kinematics for one stem: start at the top edge and chain
// the segments, each turned by its authored bend, its curl phase
// (growing toward the tip) and its wind spring offset.
function computeNodes(stem, t) {
  var lp = loopPhase(t);
  var nodes = [{ x: stem.x, y: -15, a: Math.PI / 2 }];
  var x = stem.x, y = -15, i, tipW, curl, a;
  for (i = 0; i < NSEG; i++) {
    tipW = Math.pow(i / (NSEG - 1), 1.8);
    curl = stem.dir * 0.68 * tipW * Math.sin(lp + stem.curl + i * 0.42)
         + 0.06 * Math.sin(2 * lp + stem.curl + i * 0.30);
    a = Math.PI / 2 + stem.dir * SWIRL[(i + stem.shift) % SWIRL.length] + curl + stem.wind[i];
    x += Math.cos(a) * SEGLEN;
    y += Math.sin(a) * SEGLEN;
    nodes.push({ x: x, y: y, a: a });
  }
  return nodes;
}
var LAST = [];
(function () { var i; for (i = 0; i < STEMS.length; i++) LAST.push(computeNodes(STEMS[i], T)); })();

// ---- wind: pointer drag bends segments away on springs ---------
var pointer = { active: false, x: 0, y: 0 };
function stepPhysics(dt) {
  var i, j, stem, mx, my, dx, dy, d, fall, target;
  for (i = 0; i < STEMS.length; i++) {
    stem = STEMS[i];
    for (j = 0; j < NSEG; j++) {
      target = 0;
      if (pointer.active && LAST[i] && LAST[i][j + 1]) {
        mx = (LAST[i][j].x + LAST[i][j + 1].x) / 2;
        my = (LAST[i][j].y + LAST[i][j + 1].y) / 2;
        dx = mx - pointer.x; dy = my - pointer.y;
        d = Math.sqrt(dx * dx + dy * dy);
        if (d < 200 && d > 1) {
          fall = 1 - d / 200;
          // Bend away from the pointer: a segment right of the
          // pointer tilts further right, which is a smaller angle.
          target = -(dx / d) * 1.05 * fall * fall;
        }
      }
      stem.windV[j] += ((target - stem.wind[j]) * 110 - stem.windV[j] * 10) * dt;
      stem.wind[j] += stem.windV[j] * dt;
    }
  }
}

function drawLeaf(x, y, angle, size) {
  var len = 45 * size, wid = 16 * size;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle);
  ctx.fillStyle = TEAL;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.5, -wid, len, 0);
  ctx.quadraticCurveTo(len * 0.5, wid, 0, 0);
  ctx.closePath(); ctx.fill();
  st(GREEN, 1.6);
  ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(len * 0.84, 0); ctx.stroke();
  ctx.restore();
}
function drawDaisy(x, y, scale, rot) {
  var k, a, px, py;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = CREAM;
  for (k = 0; k < 8; k++) {
    a = k / 8 * Math.PI * 2 - Math.PI / 2;
    px = Math.cos(a) * 13 * scale; py = Math.sin(a) * 13 * scale;
    ctx.save();
    ctx.translate(px, py); ctx.rotate(a);
    ctx.beginPath();
    ctx.ellipse(0, 0, 10 * scale, 5.4 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = GOLD; circ(0, 0, 6.4 * scale, true);
  ctx.restore();
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var lp = loopPhase(T);
  var i, j, stem, nodes, leaf, daisy, node, tremble, windHere;
  for (i = 0; i < STEMS.length; i++) {
    stem = STEMS[i];
    nodes = computeNodes(stem, T);
    LAST[i] = nodes;
    // Stem, drawn segment by segment so the chain tapers to the tip.
    for (j = 0; j < NSEG; j++) {
      st(GREEN, Math.max(3.4, 7.6 - j * 0.24));
      ctx.beginPath();
      ctx.moveTo(nodes[j].x, nodes[j].y);
      ctx.lineTo(nodes[j + 1].x, nodes[j + 1].y);
      ctx.stroke();
      ctx.fillStyle = GREEN;
      circ(nodes[j + 1].x, nodes[j + 1].y, Math.max(1.7, (7.6 - j * 0.24) / 2), true);
    }
    // Leaves at their authored nodes, trembling on the loop.
    for (j = 0; j < stem.leaves.length; j++) {
      leaf = stem.leaves[j];
      node = nodes[leaf.node];
      windHere = stem.wind[Math.min(NSEG - 1, leaf.node)];
      tremble = 0.08 * Math.sin(lp * 6 + leaf.ph) + windHere * 0.5;
      drawLeaf(node.x, node.y, node.a + leaf.side * 0.95 + tremble, leaf.size);
    }
    // Daisies at their authored nodes, offset to their authored side.
    for (j = 0; j < stem.daisies.length; j++) {
      daisy = stem.daisies[j];
      node = nodes[daisy.node];
      windHere = stem.wind[Math.min(NSEG - 1, daisy.node)];
      tremble = 0.10 * Math.sin(lp * 6 + daisy.node * 0.7 + i) + windHere * 0.7;
      drawDaisy(
        node.x + Math.cos(node.a + Math.PI / 2) * daisy.side * 13,
        node.y + Math.sin(node.a + Math.PI / 2) * daisy.side * 13,
        daisy.scale, tremble);
    }
  }
}

// ---- interaction: drag through the vines as wind ---------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  pointer.active = true; pointer.x = p[0]; pointer.y = p[1];
});
canvas.addEventListener('pointermove', function (e) {
  if (!pointer.active) return;
  var p = toDesign(e);
  pointer.x = p[0]; pointer.y = p[1];
});
canvas.addEventListener('pointerup', function () { pointer.active = false; });
canvas.addEventListener('pointercancel', function () { pointer.active = false; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; stepPhysics(TICK); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
