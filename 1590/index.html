<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entropy, Running</title>
<style>
html, body { margin: 0; padding: 0; background: #050506; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BG = [5, 5, 6];
var WHITE = [245, 245, 242];
var GREY = [138, 138, 146];
var GOLD = [242, 228, 196];
var PHASE = 15.0;
var WHIRL_EVERY = 4.0;
var PARTS_PER_WHIRL = 36;
var MAX_WHIRLS = 8;
var BURST_EVERY = 2.5;
var BURST_OFFSET = 1.25;
var BURST_LIFE = 2.0;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function fmt2(v) {
  var s = (Math.round(v * 100) / 100).toFixed(2);
  return s;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function whirlParams(k) {
  var r = mulberry32(1590000 + k * 7919);
  return {
    fx: 0.40 + r() * 0.20,
    fy: 0.16 + r() * 0.34,
    rot: (r() < 0.5 ? -1 : 1) * (0.25 + r() * 0.45),
    reach: 0.10 + r() * 0.09,
    arms: 3 + Math.floor(r() * 3)
  };
}
function whirlCount(t) {
  var n = Math.floor(t / WHIRL_EVERY) + 1;
  if (n < 0) n = 0;
  if (n > MAX_WHIRLS) n = MAX_WHIRLS;
  return n;
}
function particleRec(i, t) {
  var k = Math.floor(i / PARTS_PER_WHIRL);
  var w = whirlParams(k);
  var birth = k * WHIRL_EVERY;
  var age = t - birth;
  if (age < 0) return null;
  var r = mulberry32(1591000 + i * 104729);
  var a0 = r() * TAU;
  var rad0 = 0.012 + r() * 0.030;
  var grow = 0.004 + r() * 0.006;
  var arm = i % w.arms;
  var armOff = (arm / w.arms) * TAU;
  var rad = Math.min(rad0 + grow * age, w.reach);
  var ang = a0 + armOff + w.rot * age * (1.6 - rad / w.reach * 0.9);
  ang += 0.35 * Math.sin(rad * 40 + age * 0.6 + i * 0.7);
  var md = Math.min(VW, VH);
  var cx = w.fx * VW, cy = w.fy * VH;
  var x = cx + rad * md * Math.cos(ang);
  var y = cy + rad * md * 0.78 * Math.sin(ang);
  var a2 = ang + 0.45;
  var x2 = cx + rad * md * Math.cos(a2);
  var y2 = cy + rad * md * 0.78 * Math.sin(a2);
  var fade = age < 1 ? age : 1;
  var alpha = (0.30 + 0.60 * (1 - rad / w.reach)) * fade;
  return { x: x, y: y, x2: x2, y2: y2, alpha: alpha, grey: (i % 5 === 0) };
}
function burstEvents(t) {
  var out = [];
  var n = Math.floor((t - BURST_OFFSET) / BURST_EVERY);
  for (var e = Math.max(0, n - 3); e <= n; e++) {
    var tb = e * BURST_EVERY + BURST_OFFSET;
    var age = t - tb;
    if (age < 0 || age > BURST_LIFE) continue;
    out.push({ e: e, age: age });
  }
  return out;
}
function burstParticle(e, j, age) {
  var r = mulberry32(1592000 + e * 7919 + j * 131);
  var ang = r() * TAU;
  var spd = 14 + r() * 46;
  var d = spd * age;
  return {
    dx: Math.cos(ang) * d,
    dy: Math.sin(ang) * d - 18 * age * age,
    a: Math.max(0, 1 - age / BURST_LIFE),
    s: 1.2 + r() * 2.2
  };
}
function floorY() { return VH * 0.70; }
function seamX(frac, y) {
  return frac * VW + 6 - 12 * (y / floorY());
}
function wallQuad(f0, f1) {
  var fy = floorY();
  return [
    { x: seamX(f0, 0), y: 0 },
    { x: seamX(f1, 0), y: 0 },
    { x: seamX(f1, fy), y: fy },
    { x: seamX(f0, fy), y: fy }
  ];
}
function clipQuad(q) {
  ctx.beginPath();
  ctx.moveTo(q[0].x, q[0].y);
  ctx.lineTo(q[1].x, q[1].y);
  ctx.lineTo(q[2].x, q[2].y);
  ctx.lineTo(q[3].x, q[3].y);
  ctx.closePath();
  ctx.clip();
}
function codeLines(t) {
  var nw = whirlCount(t);
  var parts = nw * PARTS_PER_WHIRL;
  var lines = [];
  if (isPhone) lines.push('// entropy, run');
  else lines.push('// entropy, running');
  lines.push(isPhone ? 'u_time = ' + fmt2(t) : 'float u_time = ' + fmt2(t));
  lines.push('int tick = ' + Math.floor(t * 30));
  lines.push('int whirls = ' + nw);
  lines.push('int parts = ' + parts);
  lines.push('int bursts = ' + Math.max(0, Math.floor((t - BURST_OFFSET) / BURST_EVERY)));
  for (var k = 0; k < nw; k++) {
    var w = whirlParams(k);
    if (isPhone) lines.push('w' + k + ' ' + fmt2(w.fx) + ' ' + fmt2(w.fy));
    else lines.push('whirl[' + k + '] ' + fmt2(w.fx) + ' ' + fmt2(w.fy) + ' ' + fmt2(w.rot));
  }
  lines.push('// spawn log');
  var evs = spawnEvents(t);
  for (var i = 0; i < evs.length; i++) lines.push(evs[i]);
  return lines;
}
function spawnEvents(t) {
  var out = [];
  var nw = whirlCount(t);
  for (var k = 0; k < nw; k++) {
    if (isPhone) out.push('t=' + fmt2(k * WHIRL_EVERY) + ' w' + k);
    else out.push('t=' + fmt2(k * WHIRL_EVERY) + ' w' + k + ' spawn');
  }
  var nb = Math.floor((t - BURST_OFFSET) / BURST_EVERY);
  for (var e = Math.max(0, nb - 2); e <= nb; e++) {
    var tb = e * BURST_EVERY + BURST_OFFSET;
    if (isPhone) out.push('t=' + fmt2(tb) + ' L' + (e % 7));
    else out.push('t=' + fmt2(tb) + ' burst L' + (e % 7));
  }
  return out;
}
function drawCodeWall(t) {
  var q = wallQuad(0, 0.34);
  ctx.save();
  clipQuad(q);
  ctx.fillStyle = 'rgb(' + BG[0] + ',' + BG[1] + ',' + BG[2] + ')';
  ctx.fillRect(0, 0, VW, floorY());
  var wallW = seamX(0.34, floorY() * 0.5);
  var fontPx = Math.max(9, Math.min(17, wallW / 24));
  var lh = fontPx * 1.55;
  var pad = isPhone ? 8 : 16;
  var lines = codeLines(t);
  var maxLines = Math.floor((floorY() - pad * 2) / lh);
  var total = lines.length;
  var scroll = 0;
  if (total > maxLines) {
    var span = total - maxLines + 1;
    scroll = Math.floor((t - PHASE) / 3) % span;
    if (scroll < 0) scroll = 0;
  }
  ctx.font = fontPx + 'px monospace';
  ctx.textBaseline = 'top';
  for (var i = 0; i < maxLines; i++) {
    var li = scroll + i;
    if (li >= total) break;
    var y = pad + i * lh;
    var num = ('00' + (li + 1)).slice(-3);
    var isLive = li >= 1 && li <= 5;
    ctx.fillStyle = rgba(GREY, 0.85);
    ctx.fillText(num, pad, y);
    ctx.fillStyle = isLive ? rgba(WHITE, 0.95) : rgba(WHITE, 0.75);
    ctx.fillText(lines[li], pad + fontPx * 2.4, y);
  }
  var curY = pad + maxLines * lh;
  if (curY < floorY() - lh) {
    ctx.fillStyle = rgba(GREY, 0.7);
    ctx.fillText('_', pad + fontPx * 2.4, curY);
  }
  ctx.restore();
}
function drawStreaks(t, reflect) {
  var nw = whirlCount(t);
  var total = nw * PARTS_PER_WHIRL;
  var fy = floorY();
  for (var i = 0; i < total; i++) {
    var p = particleRec(i, t);
    if (!p) continue;
    var a = p.alpha * (reflect ? 0.30 : 1);
    if (a < 0.02) continue;
    var col = p.grey ? GREY : WHITE;
    ctx.strokeStyle = rgba(col, a);
    ctx.lineWidth = reflect ? 1 : (isPhone ? 1.4 : 1.8);
    ctx.beginPath();
    if (reflect) {
      var ry = fy + (fy - p.y) * 0.45;
      var ry2 = fy + (fy - p.y2) * 0.45;
      ctx.moveTo(p.x, ry);
      ctx.lineTo(p.x2, ry2);
    } else {
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x2, p.y2);
    }
    ctx.stroke();
  }
}
function drawCenterWall(t) {
  var q = wallQuad(0.34, 0.66);
  ctx.save();
  clipQuad(q);
  ctx.fillStyle = 'rgb(' + BG[0] + ',' + BG[1] + ',' + BG[2] + ')';
  ctx.fillRect(0, 0, VW, floorY());
  drawStreaks(t, false);
  ctx.restore();
}
function drawEntropyWall(t) {
  var q = wallQuad(0.66, 1.0);
  ctx.save();
  clipQuad(q);
  ctx.fillStyle = 'rgb(' + BG[0] + ',' + BG[1] + ',' + BG[2] + ')';
  ctx.fillRect(0, 0, VW, floorY());
  var x0 = seamX(0.66, floorY() * 0.3);
  var x1 = seamX(1.0, floorY() * 0.3);
  var wallW = x1 - x0;
  var pad = isPhone ? 8 : 18;
  var word = 'Entropy';
  var fontPx = Math.floor((wallW - pad * 2) / (word.length * 0.62));
  if (fontPx > 110) fontPx = 110;
  if (fontPx < 22) fontPx = 22;
  var wy = floorY() * 0.16;
  ctx.font = 'bold ' + fontPx + 'px monospace';
  ctx.textBaseline = 'top';
  var wordW = ctx.measureText(word).width;
  if (x0 + pad + wordW > x1 - pad) {
    fontPx = Math.floor(fontPx * (x1 - x0 - pad * 2) / wordW);
    ctx.font = 'bold ' + fontPx + 'px monospace';
    wordW = ctx.measureText(word).width;
  }
  var wx = x0 + (wallW - wordW) / 2;
  ctx.fillStyle = rgba(WHITE, 0.96);
  ctx.fillText(word, wx, wy);
  var events = burstEvents(t);
  for (var e = 0; e < events.length; e++) {
    var ev = events[e];
    var li = ev.e % 7;
    var lx = wx + (li + 0.5) / 7 * wordW;
    var ly = wy + fontPx * 0.55;
    for (var j = 0; j < 12; j++) {
      var b = burstParticle(ev.e, j, ev.age);
      var a = b.a * 0.95;
      if (a < 0.02) continue;
      ctx.fillStyle = rgba(GOLD, a);
      ctx.beginPath();
      ctx.moveTo(lx + b.dx + b.s, ly + b.dy);
      ctx.arc(lx + b.dx, ly + b.dy, b.s, 0, TAU);
      ctx.fill();
    }
  }
  var logFont = Math.max(9, Math.min(16, wallW / 24));
  var lh = logFont * 1.55;
  var evs = spawnEvents(t);
  ctx.font = logFont + 'px monospace';
  var ly0 = wy + fontPx * 1.5;
  var show = evs.slice(-7);
  for (var i2 = 0; i2 < show.length; i2++) {
    var y = ly0 + i2 * lh;
    if (y > floorY() - lh) break;
    ctx.fillStyle = rgba(GREY, 0.85);
    ctx.fillText(show[i2], x0 + pad, y);
  }
  ctx.restore();
}
function drawFloor(t) {
  var fy = floorY();
  ctx.fillStyle = 'rgb(' + BG[0] + ',' + BG[1] + ',' + BG[2] + ')';
  ctx.fillRect(0, fy, VW, VH - fy);
  var q = wallQuad(0.34, 0.66);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(q[2].x, fy);
  ctx.lineTo(q[3].x, fy);
  ctx.lineTo(q[3].x + (q[3].x - q[2].x) * 0.1, VH);
  ctx.lineTo(q[2].x - (q[2].x - q[3].x) * 0.1, VH);
  ctx.closePath();
  ctx.clip();
  drawStreaks(t, true);
  ctx.restore();
  ctx.strokeStyle = rgba(GREY, 0.5);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, fy);
  ctx.lineTo(VW, fy);
  ctx.stroke();
  var hintPx = isPhone ? 10 : 12;
  ctx.font = hintPx + 'px monospace';
  ctx.textBaseline = 'top';
  ctx.fillStyle = rgba(GREY, 0.8);
  ctx.fillText('watch only', isPhone ? 8 : 16, VH - hintPx - 12);
}
function drawSeams() {
  var fy = floorY();
  ctx.strokeStyle = rgba(GREY, 0.45);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(seamX(0.34, 0), 0);
  ctx.lineTo(seamX(0.34, fy), fy);
  ctx.moveTo(seamX(0.66, 0), 0);
  ctx.lineTo(seamX(0.66, fy), fy);
  ctx.stroke();
}
function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = 'rgb(' + BG[0] + ',' + BG[1] + ',' + BG[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  drawCodeWall(t);
  drawCenterWall(t);
  drawEntropyWall(t);
  drawFloor(t);
  drawSeams();
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
var startT = null;
function loop(ts) {
  if (typeof requestAnimationFrame === 'undefined') return;
  if (startT === null) startT = ts;
  var t = PHASE + (ts - startT) / 1000;
  draw(t);
  requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
