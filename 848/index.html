<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№848 The Palm Tray</title>
<style>
  html, body { margin: 0; padding: 0; background: #3f6b2a; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №848 The Palm Tray, IA2 / PP1248, study #261 iso-attrill.
  // An open palm held over grass presents a slowly rearranging
  // collection of foraged things: staghorn fungus, twig
  // skeleton, citrus-peel ring, seed, tiny insect. Shells
  // decorate the fingernails. Daylight grass green, skin
  // tones, citrus yellow, shell cream. The palm is centered,
  // the grass a soft surround, the objects arranged like a
  // specimen tray. TAP deals a new arrangement from fixed
  // authored tables; objects drift gently between
  // arrangements like a slow mobile. No text, no audio.
  var GROUND = '#3f6b2a'; // page ground, deep grass green

  // Fixed-phase first frame: FIRST_T = 6 s. Arrangement 0
  // is settled at load and the drift is visible: each object
  // bobs gently on its own closed-form sway, and the insect
  // wanders a small closed loop around its anchor. A tap
  // advances to the next arrangement over TRANS = 2.5 s with
  // a smooth ease and a small arc lift, then settles.
  var FIRST_T = 6;
  var TRANS = 2.5;
  var SEED = 848;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;
  var L = {};

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: daylight grass green, skin tones, citrus yellow,
  // shell cream. Hexes recorded in process.md.
  var GRASS_DEEP = [63, 107, 42];
  var GRASS_MID = [92, 138, 60];
  var GRASS_LIGHT = [127, 174, 90];
  var GRASS_PALE = [168, 201, 126];
  var BLADE_A = [74, 122, 48];
  var BLADE_B = [107, 154, 69];
  var BLADE_C = [63, 107, 42];
  var SKIN = [231, 185, 140];
  var SKIN_LIGHT = [244, 210, 168];
  var SKIN_SHADOW = [198, 143, 94];
  var SKIN_DEEP = [169, 111, 66];
  var NAIL = [242, 216, 196];
  var SHELL = [246, 238, 220];
  var SHELL_LINE = [217, 201, 168];
  var FUNGUS = [234, 217, 184];
  var FUNGUS_DARK = [201, 168, 118];
  var TWIG = [107, 74, 47];
  var CITRUS = [242, 194, 48];
  var PEEL = [232, 169, 28];
  var PITH = [246, 238, 220];
  var SEED_C = [74, 50, 32];
  var SEED_HI = [138, 106, 74];
  var INSECT = [46, 33, 24];
  var WING = [220, 230, 242];

  // ---- Arrangements --------------------------------------------
  // Six fixed authored arrangements of the five found things.
  // Each entry is a tray-fraction position (x, y), a rotation
  // in radians and a scale. Index 0 is the load arrangement.
  // 0 staghorn fungus, 1 twig skeleton, 2 citrus-peel ring,
  // 3 seed, 4 tiny insect.
  var ARR = [
    [ { x: 0.44, y: 0.52, r: -0.20, s: 1.00 },
      { x: 0.56, y: 0.50, r: 0.55, s: 1.05 },
      { x: 0.50, y: 0.62, r: 0.00, s: 1.00 },
      { x: 0.43, y: 0.68, r: 0.30, s: 0.95 },
      { x: 0.58, y: 0.68, r: -0.40, s: 1.00 } ],
    [ { x: 0.40, y: 0.60, r: 0.35, s: 0.95 },
      { x: 0.47, y: 0.47, r: -0.70, s: 1.00 },
      { x: 0.56, y: 0.50, r: 0.40, s: 1.10 },
      { x: 0.60, y: 0.63, r: -0.25, s: 1.00 },
      { x: 0.47, y: 0.70, r: 0.15, s: 0.95 } ],
    [ { x: 0.50, y: 0.55, r: 0.10, s: 1.10 },
      { x: 0.44, y: 0.60, r: 1.10, s: 0.95 },
      { x: 0.57, y: 0.60, r: -0.30, s: 1.00 },
      { x: 0.50, y: 0.68, r: 0.00, s: 1.05 },
      { x: 0.50, y: 0.47, r: 0.60, s: 1.00 } ],
    [ { x: 0.40, y: 0.47, r: -0.45, s: 1.00 },
      { x: 0.47, y: 0.55, r: 0.25, s: 1.10 },
      { x: 0.53, y: 0.62, r: 0.20, s: 0.95 },
      { x: 0.59, y: 0.68, r: -0.35, s: 1.00 },
      { x: 0.44, y: 0.70, r: -0.10, s: 1.05 } ],
    [ { x: 0.50, y: 0.46, r: 0.25, s: 1.05 },
      { x: 0.60, y: 0.55, r: -0.50, s: 1.00 },
      { x: 0.57, y: 0.68, r: 0.10, s: 1.00 },
      { x: 0.43, y: 0.68, r: 0.45, s: 0.95 },
      { x: 0.40, y: 0.55, r: 0.30, s: 1.00 } ],
    [ { x: 0.58, y: 0.52, r: 0.50, s: 0.95 },
      { x: 0.42, y: 0.52, r: -0.20, s: 1.05 },
      { x: 0.50, y: 0.70, r: -0.15, s: 1.10 },
      { x: 0.55, y: 0.60, r: 0.20, s: 1.00 },
      { x: 0.46, y: 0.62, r: -0.55, s: 0.95 } ]
  ];
  var N_ARR = ARR.length;

  // Arrangement state. A tap captures the current base
  // positions as the transition start, advances the index
  // with wrap, and stamps the start time. Drift is a
  // closed-form ease, never frame-integrated state.
  var state = { arr: 0, from: null, t0: -1e9 };
  function basePos(i, t) {
    var A = ARR[state.arr][i];
    var bx = A.x, by = A.y, br = A.r, u = 1;
    if (state.from && t - state.t0 < TRANS) {
      u = smooth((t - state.t0) / TRANS);
      var F = state.from[i];
      bx = F.x + (A.x - F.x) * u;
      by = F.y + (A.y - F.y) * u;
      br = F.r + (A.r - F.r) * u;
    }
    return { x: bx, y: by, r: br, s: A.s, u: u };
  }
  function handleTap(t) {
    var from = [];
    for (var i = 0; i < 5; i++) {
      var p = basePos(i, t);
      from.push({ x: p.x, y: p.y, r: p.r });
    }
    state.from = from;
    state.t0 = t;
    state.arr = (state.arr + 1) % N_ARR;
    return { arr: state.arr };
  }

  // ---- Layout ----------------------------------------------------
  // The tray is a square of side P = min(W, 0.92 H) centered
  // at (W/2, 0.52 H). All palm and object geometry is in
  // tray fractions, so the composition holds on phones
  // (full-bleed) and on desktop (square stage).
  function layout() {
    L.P = Math.min(W, H * 0.92);
    L.cx = W / 2;
    L.cy = H * 0.52;
  }
  function px(f) { return L.cx + (f - 0.5) * L.P; }
  function py(f) { return L.cy + (f - 0.5) * L.P; }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Grass -----------------------------------------------------
  function drawGrass() {
    ctx.fillStyle = rgb(GRASS_MID);
    ctx.fillRect(0, 0, W, H);
    // Soft light dapples, fixed seed.
    var rng = mulberry32(SEED * 13 + 5);
    var i, dx, dy, dr;
    for (i = 0; i < 7; i++) {
      dx = rng() * W; dy = rng() * H; dr = W * (0.12 + rng() * 0.16);
      var g = ctx.createRadialGradient(dx, dy, 0, dx, dy, dr);
      g.addColorStop(0, rgba([242, 230, 170], a4(0.07)));
      g.addColorStop(1, rgba([242, 230, 170], 0));
      ctx.fillStyle = g;
      ctx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);
    }
    // Grass tufts, three blades each, fixed seed. The palm
    // is drawn over the middle, so tufts under it are hidden.
    var rng2 = mulberry32(SEED * 7 + 3);
    var blades = [BLADE_A, BLADE_B, BLADE_C];
    var n = Math.round(240 * (W * H) / (720 * 720));
    for (i = 0; i < n; i++) {
      var x = rng2() * W, y = rng2() * H;
      var len = (5 + rng2() * 9) * (Math.min(W, H) / 720);
      var col = blades[Math.floor(rng2() * 3)];
      ctx.strokeStyle = rgba(col, a4(0.45 + rng2() * 0.35));
      ctx.lineWidth = Math.max(1, Math.min(W, H) / 720 * 1.1);
      ctx.lineCap = 'round';
      for (var k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + k * len * 0.28, y - len * (0.8 + 0.2 * Math.abs(k)));
        ctx.stroke();
      }
    }
    // A few pale seed heads scattered in the grass.
    var rng3 = mulberry32(SEED * 11 + 9);
    for (i = 0; i < 26; i++) {
      var sx = rng3() * W, sy = rng3() * H;
      var sr = Math.max(1, Math.min(W, H) / 720 * 1.6);
      ctx.fillStyle = rgba(GRASS_PALE, a4(0.7));
      ctx.beginPath();
      ctx.moveTo(sx + sr, sy);
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Palm ------------------------------------------------------
  // Fingers as thick round-capped strokes from base to tip in
  // tray fractions; thumb angled out to the left. Nails carry
  // small cream fan shells.
  var FINGERS = [
    { bx: 0.400, by: 0.500, tx: 0.375, ty: 0.300, w: 0.048 },
    { bx: 0.465, by: 0.485, tx: 0.465, ty: 0.255, w: 0.050 },
    { bx: 0.535, by: 0.485, tx: 0.560, ty: 0.275, w: 0.050 },
    { bx: 0.600, by: 0.500, tx: 0.635, ty: 0.345, w: 0.044 }
  ];
  var THUMB = { bx: 0.345, by: 0.700, tx: 0.235, ty: 0.545, w: 0.055 };

  function fingerStroke(f, color, width, alpha) {
    ctx.strokeStyle = rgba(color, a4(alpha));
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px(f.bx), py(f.by));
    ctx.lineTo(px(f.tx), py(f.ty));
    ctx.stroke();
  }
  function drawShell(x, y, r, ang) {
    // Small fan shell: a cream fan with radiating lines.
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.fillStyle = rgb(SHELL);
    ctx.beginPath();
    ctx.moveTo(0, r * 0.9);
    ctx.arc(0, 0, r, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba(SHELL_LINE, a4(0.9));
    ctx.lineWidth = Math.max(0.8, r * 0.10);
    for (var k = -2; k <= 2; k++) {
      var a = Math.PI / 2 + k * Math.PI / 8;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.15, Math.sin(a) * r * 0.15);
      ctx.lineTo(Math.cos(a) * r * 0.92, Math.sin(a) * r * 0.92);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawNail(f) {
    var dx = px(f.tx) - px(f.bx), dy = py(f.ty) - py(f.by);
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ang = Math.atan2(dy, dx);
    var nx = px(f.tx) - (dx / len) * L.P * 0.012;
    var ny = py(f.ty) - (dy / len) * L.P * 0.012;
    var rx = L.P * 0.019, ry = L.P * 0.026;
    ctx.save();
    ctx.translate(nx, ny);
    ctx.rotate(ang + Math.PI / 2);
    ctx.fillStyle = rgb(NAIL);
    ctx.beginPath();
    ctx.moveTo(rx, 0);
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    drawShell(nx, ny, L.P * 0.016, ang - Math.PI / 2);
  }
  function drawPalm() {
    var P = L.P;
    // Soft shadow under the palm.
    ctx.fillStyle = rgba(GRASS_DEEP, a4(0.28));
    ctx.beginPath();
    ctx.moveTo(L.cx + P * 0.30, L.cy + P * 0.30);
    ctx.ellipse(L.cx, L.cy + P * 0.30, P * 0.30, P * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();
    // Wrist, below the pad.
    ctx.fillStyle = rgb(SKIN);
    ctx.beginPath();
    ctx.moveTo(px(0.41), py(0.70));
    ctx.lineTo(px(0.59), py(0.70));
    ctx.lineTo(px(0.585), py(0.86));
    ctx.quadraticCurveTo(px(0.50), py(0.895), px(0.415), py(0.86));
    ctx.closePath();
    ctx.fill();
    // Palm pad.
    ctx.fillStyle = rgb(SKIN);
    ctx.beginPath();
    ctx.moveTo(px(0.50) + P * 0.17, py(0.62));
    ctx.ellipse(px(0.50), py(0.62), P * 0.17, P * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    // Thumb, then fingers, skin base.
    fingerStroke(THUMB, SKIN, P * THUMB.w, 1);
    for (var i = 0; i < FINGERS.length; i++) {
      fingerStroke(FINGERS[i], SKIN, P * FINGERS[i].w, 1);
    }
    // Skin shading: light along the left edge, shadow along
    // the right edge, and thin separations between fingers.
    ctx.strokeStyle = rgba(SKIN_LIGHT, a4(0.55));
    ctx.lineWidth = Math.max(1, P * 0.008);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px(0.345), py(0.70));
    ctx.quadraticCurveTo(px(0.325), py(0.58), px(0.345), py(0.50));
    ctx.stroke();
    ctx.strokeStyle = rgba(SKIN_DEEP, a4(0.35));
    ctx.beginPath();
    ctx.moveTo(px(0.655), py(0.70));
    ctx.quadraticCurveTo(px(0.675), py(0.58), px(0.655), py(0.50));
    ctx.stroke();
    ctx.strokeStyle = rgba(SKIN_SHADOW, a4(0.45));
    ctx.lineWidth = Math.max(1, P * 0.005);
    var gaps = [0.432, 0.500, 0.568];
    for (var gi = 0; gi < gaps.length; gi++) {
      ctx.beginPath();
      ctx.moveTo(px(gaps[gi]), py(0.50));
      ctx.lineTo(px(gaps[gi] + (gi - 1) * 0.012), py(0.44));
      ctx.stroke();
    }
    // Palm lines, subtle.
    ctx.strokeStyle = rgba(SKIN_DEEP, a4(0.30));
    ctx.lineWidth = Math.max(1, P * 0.004);
    ctx.beginPath();
    ctx.moveTo(px(0.40), py(0.74));
    ctx.quadraticCurveTo(px(0.46), py(0.62), px(0.44), py(0.50));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px(0.60), py(0.72));
    ctx.quadraticCurveTo(px(0.54), py(0.64), px(0.56), py(0.52));
    ctx.stroke();
    // Nails with shells on every fingertip and the thumb.
    drawNail(THUMB);
    for (var n = 0; n < FINGERS.length; n++) {
      drawNail(FINGERS[n]);
    }
  }

  // ---- Found things ----------------------------------------------
  // Each object is drawn at (x, y) in px, unit s in px, rotated
  // by r. All closed-form, no state.
  function drawFungus(x, y, s, r) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(r);
    ctx.strokeStyle = rgb(FUNGUS_DARK);
    ctx.fillStyle = rgb(FUNGUS);
    ctx.lineCap = 'round';
    // Main stem.
    ctx.lineWidth = s * 2.6;
    ctx.beginPath();
    ctx.moveTo(0, s * 9);
    ctx.lineTo(0, s * -4);
    ctx.stroke();
    // Antler branches, each forking at the tip.
    var angs = [-0.95, -0.5, -0.05, 0.45, 0.9];
    for (var i = 0; i < angs.length; i++) {
      var a = angs[i];
      var bx = Math.sin(a) * s * 13, by = -s * 4 - Math.cos(a) * s * 12;
      ctx.lineWidth = s * 2.2;
      ctx.beginPath();
      ctx.moveTo(0, s * -4);
      ctx.lineTo(bx, by);
      ctx.stroke();
      ctx.lineWidth = s * 1.6;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx - Math.cos(a) * s * 5, by - Math.sin(a) * s * 5);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + Math.cos(a) * s * 5, by + Math.sin(a) * s * 2);
      ctx.stroke();
      ctx.fillStyle = rgb(FUNGUS);
      ctx.beginPath();
      ctx.moveTo(bx + s * 1.8, by);
      ctx.arc(bx, by, s * 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  function drawTwig(x, y, s, r) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(r);
    ctx.strokeStyle = rgb(TWIG);
    ctx.lineCap = 'round';
    ctx.lineWidth = s * 1.8;
    ctx.beginPath();
    ctx.moveTo(-s * 14, s * 6);
    ctx.lineTo(s * 14, -s * 6);
    ctx.stroke();
    var offs = [-9, -3, 3, 9];
    for (var i = 0; i < offs.length; i++) {
      var ox = offs[i] * s, oy = -offs[i] * s * 0.43;
      var dir = (i % 2 === 0) ? 1 : -1;
      ctx.lineWidth = s * 1.2;
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(ox + dir * s * 2, oy - s * 7);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ox + dir * s * 2, oy - s * 7);
      ctx.lineTo(ox + dir * s * 5, oy - s * 9);
      ctx.stroke();
    }
    ctx.fillStyle = rgb(TWIG);
    ctx.beginPath();
    ctx.moveTo(-s * 14 + s * 1.5, s * 6);
    ctx.arc(-s * 14, s * 6, s * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function drawCitrusRing(x, y, s, r) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(r);
    ctx.lineCap = 'round';
    // Peel ring: dark outer, bright middle, pale pith.
    ctx.strokeStyle = rgb(PEEL);
    ctx.lineWidth = s * 5.5;
    ctx.beginPath();
    ctx.moveTo(x * 0 + s * 10, 0);
    ctx.arc(0, 0, s * 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = rgb(CITRUS);
    ctx.lineWidth = s * 3.2;
    ctx.beginPath();
    ctx.moveTo(s * 10, 0);
    ctx.arc(0, 0, s * 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = rgb(PITH);
    ctx.lineWidth = s * 1.4;
    ctx.beginPath();
    ctx.moveTo(s * 7.4, 0);
    ctx.arc(0, 0, s * 7.4, 0, Math.PI * 2);
    ctx.stroke();
    // Segment spokes inside.
    ctx.strokeStyle = rgba(CITRUS, a4(0.85));
    ctx.lineWidth = s * 1.1;
    for (var k = 0; k < 8; k++) {
      var a = k * Math.PI / 4 + 0.2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * s * 2, Math.sin(a) * s * 2);
      ctx.lineTo(Math.cos(a) * s * 6.8, Math.sin(a) * s * 6.8);
      ctx.stroke();
    }
    // A curl of peel lifting off the ring.
    ctx.strokeStyle = rgb(PEEL);
    ctx.lineWidth = s * 2.6;
    ctx.beginPath();
    ctx.moveTo(s * 9, -s * 4);
    ctx.quadraticCurveTo(s * 16, -s * 10, s * 13, -s * 16);
    ctx.stroke();
    ctx.restore();
  }
  function drawSeed(x, y, s, r) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(r);
    ctx.fillStyle = rgb(SEED_C);
    ctx.beginPath();
    ctx.moveTo(s * 6, 0);
    ctx.ellipse(0, 0, s * 6, s * 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgba(SEED_HI, a4(0.9));
    ctx.lineWidth = s * 1.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-s * 3, -s * 4);
    ctx.quadraticCurveTo(-s * 5, 0, -s * 3, s * 5);
    ctx.stroke();
    ctx.fillStyle = rgb(PITH);
    ctx.beginPath();
    ctx.moveTo(s * 2, -s * 8 + s * 1.2);
    ctx.arc(s * 2, -s * 8, s * 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function drawInsect(x, y, s, r, t) {
    // Fixed-path wanderer: a small closed loop around its
    // anchor, closed-form in t. Body angle follows the path
    // tangent.
    var wx = Math.cos(t * 0.55 + 1.2) * L.P * 0.018;
    var wy = Math.sin(t * 0.80 + 1.2) * L.P * 0.011;
    var vx = -Math.sin(t * 0.55 + 1.2) * 0.55 * 0.018;
    var vy = Math.cos(t * 0.80 + 1.2) * 0.80 * 0.011;
    var ang = Math.atan2(vy, vx) + r;
    ctx.save();
    ctx.translate(x + wx, y + wy);
    ctx.rotate(ang);
    // Wing, translucent, over the back.
    ctx.fillStyle = rgba(WING, a4(0.55));
    ctx.beginPath();
    ctx.moveTo(s * 2.2, -s * 1);
    ctx.ellipse(-s * 1, -s * 3.5, s * 2.2, s * 5.5, 0.5, 0, Math.PI * 2);
    ctx.fill();
    // Legs.
    ctx.strokeStyle = rgb(INSECT);
    ctx.lineWidth = Math.max(0.8, s * 0.9);
    ctx.lineCap = 'round';
    for (var k = 0; k < 3; k++) {
      var ly = -s * 3 + k * s * 3;
      ctx.beginPath();
      ctx.moveTo(0, ly);
      ctx.lineTo(-s * 5, ly - s * 3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, ly);
      ctx.lineTo(s * 5, ly - s * 3);
      ctx.stroke();
    }
    // Antennae.
    ctx.beginPath();
    ctx.moveTo(-s * 1.5, -s * 6);
    ctx.lineTo(-s * 4, -s * 10);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(s * 1.5, -s * 6);
    ctx.lineTo(s * 4, -s * 10);
    ctx.stroke();
    // Body: abdomen, thorax, head.
    ctx.fillStyle = rgb(INSECT);
    ctx.beginPath();
    ctx.moveTo(s * 3, s * 2);
    ctx.ellipse(0, s * 3.5, s * 3, s * 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(s * 2.4, -s * 2);
    ctx.arc(0, -s * 2, s * 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(s * 1.9, -s * 5.5);
    ctx.arc(0, -s * 5.5, s * 1.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawObjects(t) {
    var P = L.P;
    var s0 = P * 0.0038; // object unit: features span about 10-28 s, so objects land near 0.1 P
    for (var i = 0; i < 5; i++) {
      var p = basePos(i, t);
      // Gentle mobile bob, closed-form per object.
      var ph = i * 1.3;
      var bx = Math.sin(t * 0.45 + ph) * P * 0.0035;
      var by = Math.cos(t * 0.38 + ph * 1.7) * P * 0.0028;
      // Arc lift while easing between arrangements.
      var lift = (p.u < 1) ? Math.sin(p.u * Math.PI) * P * 0.02 : 0;
      var x = px(p.x) + bx;
      var y = py(p.y) + by - lift;
      var rot = p.r + Math.sin(t * 0.30 + ph) * 0.03;
      var s = s0 * p.s;
      if (i === 0) { drawFungus(x, y, s, rot); }
      else if (i === 1) { drawTwig(x, y, s, rot); }
      else if (i === 2) { drawCitrusRing(x, y, s, rot); }
      else if (i === 3) { drawSeed(x, y, s, rot); }
      else { drawInsect(x, y, s, rot, t); }
    }
  }

  // ---- Draw ------------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    drawGrass();
    drawPalm();
    drawObjects(t);

    // Caption, top left, and the hint, bottom center, in the
    // template's place: shell cream on the grass green.
    var fsCap = Math.round(clamp(W * 0.020, 11, 15));
    var fsDate = Math.round(clamp(W * 0.016, 9, 12));
    var fsHint = Math.round(clamp(W * 0.022, 12, 16));
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(SHELL, a4(0.85));
    ctx.font = '600 ' + fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№848 · The Palm Tray', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(SHELL, a4(0.65));
    ctx.font = fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 08', W * 0.04, H * 0.055 + fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(SHELL, a4(0.9));
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Tap for a new arrangement.', W / 2, H - fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // ---- Interaction -----------------------------------------------
  // TAP deals the next arrangement from the fixed tables.
  // Never click-to-reload.
  function onDown(ev) {
    handleTap(lastT);
    try {
      if (ev.preventDefault) { ev.preventDefault(); }
    } catch (e) {}
  }
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('pointerdown', onDown);
    }
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece848 exposes the arrangement and the tap so a
  // probe can tap, redraw, and confirm a new arrangement with
  // the palm and grass unchanged, and walk all arrangements.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece848 = {
      firstT: FIRST_T,
      count: N_ARR,
      arrangement: function () { return state.arr; },
      tap: function (t) { return handleTap(t); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: gentle drift and the insect wander. Guarded
  // so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
