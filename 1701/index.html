<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seven Million Years</title>
<style>
html, body { margin: 0; padding: 0; background: #0E1B2E; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var NAVY = '#0E1B2E';
var FLOOR = '#0A1524';
var PLATE = '#1E3252';
var PLATE_LINE = 'rgba(232,220,192,0.45)';
var INK = '#E8DCC0';
var DIM_INK = '#C9B98A';

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

    Math.round(a[2] + (b[2] - a[2]) * f)

  for (i = 0; i < s.length; i++) {

    out += s[i];

}
function fmtBytes(n) {
  var s = '' + n, out = '', i;
  for (i = 0; i < s.length; i++) {
    if (i > 0 && (s.length - i) % 3 === 0) out += ',';
    out += s[i];

}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;

function size() {
  var vw = 0, vh = 0;

    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;

  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';

}
/* ---- value noise on a seeded grid ---- */

  var rng = mulberry32(seed), g = new Array(n * n), i;
  for (i = 0; i < n * n; i++) g[i] = rng();

}
function vnoise(g, n, u, v) {
  var x = clamp(u, 0, 1) * (n - 1), y = clamp(v, 0, 1) * (n - 1);
  var x0 = Math.floor(x), y0 = Math.floor(y);
  var x1 = Math.min(x0 + 1, n - 1), y1 = Math.min(y0 + 1, n - 1);
  var fx = smooth(x - x0), fy = smooth(y - y0);
  var a = g[y0 * n + x0], b = g[y0 * n + x1], c = g[y1 * n + x0], d = g[y1 * n + x1];

/* ---- folded-plate form, seeded ---- */

  var rng = mulberry32(seed);
  var base = [-0.43, -0.27, -0.13, 0.02, 0.16, 0.30, 0.43];
  var xs = [], yTop = [], yBot = [], i;
  for (i = 0; i < base.length; i++) xs.push(base[i] + (rng() - 0.5) * 0.03);
  for (i = 0; i < base.length; i++) {
    yTop.push(-0.46 + (rng() - 0.5) * 0.04);
    yBot.push(0.48 + (rng() - 0.5) * 0.04);

  for (i = 0; i < xs.length - 1; i++) {
    facets.push({ x0: xs[i], x1: xs[i + 1], yt0: yTop[i], yt1: yTop[i + 1],

function facetPts(f) {

/* ---- corrosion cells: seeded noise field, rust blooms from edges first ---- */

      inside = false;

      }
      if (!inside) continue;
      d = 10;
      for (si = 0; si < segs.length; si++) {
        d = Math.min(d, segDist(lx, ly, segs[si][0], segs[si][1], segs[si][2], segs[si][3]));

  var vals = [], ci;
  for (ci = 0; ci < cells.length; ci++) vals.push(cells[ci].n);
  vals.sort(function (a, b) { return a - b; });

function coverageOf(geo, t) {
  var th = geo.p95 * clamp(t, 0, DECAY) / DECAY;

  for (i = 0; i < geo.cells.length; i++) if (geo.cells[i].n < th) c++;

}
function seedFor(i) { return 1701 + i * 13; }
var clockT = FIRST_T, geoIdx = -1, curGeo = null, prevGeo = null, nextGeo = null;
var lastDrawn = -1;
function thresholdAt(t) { return curGeo.p95 * clamp(t, 0, DECAY) / DECAY; }
function ageYear(t) {
  if (t >= DECAY) return 7000000;
  return 1 + (t / DECAY) * 6999999;
}
/* ---- draw one form with its corrosion at a given threshold and alpha ---- */
var BRONZE_DARK = hexRgb('#5E3A1E'), BRONZE_LIGHT = hexRgb('#D9A05E');
var RUST = hexRgb('#A34A1F'), RUST_DEEP = hexRgb('#7E3416');
var VERDIGRIS = '#5E8A7A', PIT = '#1E1A16';
function drawForm(geo, threshold, alpha, sunA, shear) {

  ctx.transform(1, 0, shear, 1, 0, 0);

  for (fi = 0; fi < geo.form.facets.length; fi++) {
    f = geo.form.facets[fi];
    pts = facetPts(f);
    lf = clamp((f.dir > 0 ? 0.62 : 0.38) + 0.18 * Math.cos(sunA - f.dir * 0.6), 0.15, 1);
    col = mixRgb(BRONZE_DARK, BRONZE_LIGHT, lf);
    ctx.fillStyle = 'rgb(' + col[0] + ',' + col[1] + ',' + col[2] + ')';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (j = 1; j < 4; j++) ctx.lineTo(pts[j][0], pts[j][1]);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(20,12,6,0.55)';
    ctx.lineWidth = 0.003;
    ctx.stroke();
  }
  /* plinth slab under the form, uncorroded; top overlaps facet bottoms */
  ctx.fillStyle = '#3A2412';
  ctx.fillRect(-0.48, 0.46, 0.96, 0.07);
  ctx.strokeStyle = 'rgba(20,12,6,0.6)';
  ctx.lineWidth = 0.003;
  ctx.strokeRect(-0.48, 0.46, 0.96, 0.07);
  /* clip corrosion to the form silhouette so no rust cell spills past an edge */
  ctx.beginPath();
  ctx.moveTo(geo.form.xs[0], geo.form.yTop[0]);
  for (j = 1; j < geo.form.xs.length; j++) ctx.lineTo(geo.form.xs[j], geo.form.yTop[j]);
  ctx.lineTo(geo.form.xs[geo.form.xs.length - 1] * 1.05, geo.form.yBot[geo.form.xs.length - 1]);
  for (j = geo.form.xs.length - 1; j >= 0; j--) ctx.lineTo(geo.form.xs[j] * 1.05, geo.form.yBot[j]);

    rc = mixRgb(RUST, RUST_DEEP, depth);
    a = (0.30 + 0.55 * depth).toFixed(4);
    ctx.fillStyle = 'rgba(' + rc[0] + ',' + rc[1] + ',' + rc[2] + ',' + a + ')';
    ctx.fillRect(cell.x - half, cell.y - half, CS, CS);

      ctx.fillStyle = 'rgba(94,138,122,0.3000)';
      ctx.fillRect(cell.x - half, cell.y - half, CS, CS);

  while (titlePx > 9 && ctx.measureText('Seven Million Years').width > VW - 60) {
    titlePx -= 1;

  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 08').width;

  var plateH = titlePx + smallPx + 20;

  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Seven Million Years', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = INK;
  ctx.fillText('2006 · 09 · 08', plateX + 14, plateY + 7 + titlePx + 3);

  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;

  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;

  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);

    ctx.textAlign = 'right';
