<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wood Sings</title>
<style>
  html, body { margin: 0; padding: 0; background: #060505; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* No.983 "The Wood Sings" (PP144 Timber/Timbre, daito-manabe / molg study)
   A wooden electronic instrument: a cello-circuit hybrid body whose grain
   is the interface. 8 strings, 22 brass nodes. Pluck a node and the glow
   runs along the grain; drag across the strings to bow. Idle, the wood
   breathes: a sap-glow travels the grain and every ~30 s the instrument
   tunes itself with a slow arpeggio. The sound is lazy WebAudio
   Karplus-Strong plucks, synthesized into buffers on first gesture.
   Everything drawn is a closed-form function of piece time t and the
   recorded gesture events. Frame one is the synchronous draw at T0. */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

var T0 = 11.0;                // fixed frame-one offset (seconds of piece time)
var SEED = 983144;

/* palette (strict) */
var COL = {
  black: '#060505', wood: '#8A5A33', grain: '#6B4226', hi: '#C98F4E',
  strings: '#D8D2C4', brass: '#D9A441', glow: '#FFC44F',
  sap: '#7D5A2E', label: '#3A2A1A'
};

var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var W = 0, H = 0;

function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  if (window.visualViewport){ w = window.visualViewport.width; h = window.visualViewport.height; }
  W = w; H = h;
  cv.width = Math.round(w); cv.height = Math.round(h);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);
resize();

function isPhone(){
  var sw = (window.screen && window.screen.width)  || W;
  var sh = (window.screen && window.screen.height) || H;
  if (Math.min(sw, sh) < 700) return true;
  return H > W * 1.15;
}

/* ---------------- body outline (unit space 1000x1000) ----------------
   Left side: cello bouts. Right side: straight circuit-board edge with
   three rectangular notches. Sampled into a polygon. */

function sampleLine(pts, x1, y1, x2, y2, n){
  for (var i = 1; i <= n; i++){ var u = i / n; pts.push([x1 + (x2 - x1) * u, y1 + (y2 - y1) * u]); }
}
function sampleQuad(pts, x0, y0, cx, cy, x1, y1, n){
  for (var i = 1; i <= n; i++){
    var u = i / n, v = 1 - u;
    pts.push([v * v * x0 + 2 * v * u * cx + u * u * x1, v * v * y0 + 2 * v * u * cy + u * u * y1]);
  }
}
function sampleCubic(pts, x0, y0, c1x, c1y, c2x, c2y, x1, y1, n){
  for (var i = 1; i <= n; i++){
    var u = i / n, v = 1 - u;
    pts.push([
      v*v*v*x0 + 3*v*v*u*c1x + 3*v*u*u*c2x + u*u*u*x1,
      v*v*v*y0 + 3*v*v*u*c1y + 3*v*u*u*c2y + u*u*u*y1
    ]);
  }
}

function buildOutline(){
  var pts = [[215, 222]];
  sampleQuad(pts, 215, 222, 460, 196, 700, 200, 26);       // top edge
  sampleLine(pts, 700, 200, 872, 206, 8);
  sampleLine(pts, 872, 206, 872, 318, 8);                  // right edge
  sampleLine(pts, 872, 318, 838, 318, 3);                  // notch 1
  sampleLine(pts, 838, 318, 838, 356, 3);
  sampleLine(pts, 838, 356, 872, 356, 3);
  sampleLine(pts, 872, 356, 872, 508, 10);
  sampleLine(pts, 872, 508, 840, 508, 3);                  // notch 2
  sampleLine(pts, 840, 508, 840, 542, 3);
  sampleLine(pts, 840, 542, 872, 542, 3);
  sampleLine(pts, 872, 542, 872, 660, 8);
  sampleLine(pts, 872, 660, 842, 660, 3);                  // notch 3
  sampleLine(pts, 842, 660, 842, 688, 2);
  sampleLine(pts, 842, 688, 872, 688, 3);
  sampleLine(pts, 872, 688, 872, 782, 7);                  // bottom-right
  sampleQuad(pts, 872, 782, 560, 812, 260, 796, 30);       // bottom edge
  sampleCubic(pts, 260, 796, 140, 780, 96, 700, 112, 612, 16);   // lower bout
  sampleCubic(pts, 112, 612, 150, 560, 168, 545, 172, 500, 10);  // waist
  sampleCubic(pts, 172, 500, 150, 430, 108, 400, 118, 330, 12);  // upper bout
  sampleCubic(pts, 118, 330, 128, 262, 160, 236, 215, 222, 10);
  return pts;
}
var OUTLINE = buildOutline();

function pointInPoly(x, y){
  var inside = false;
  for (var i = 0, j = OUTLINE.length - 1; i < OUTLINE.length; j = i++){
    var xi = OUTLINE[i][0], yi = OUTLINE[i][1];
    var xj = OUTLINE[j][0], yj = OUTLINE[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function bodyPath(){
  ctx.beginPath();
  ctx.moveTo(OUTLINE[0][0], OUTLINE[0][1]);
  for (var i = 1; i < OUTLINE.length; i++) ctx.lineTo(OUTLINE[i][0], OUTLINE[i][1]);
  ctx.closePath();
}

/* ---------------- knots + grain (seeded flow field) ---------------- */

var genRnd = mulberry32(SEED);
var KNOTS = [];
(function(){
  var base = [[330, 420], [610, 600], [720, 330]];
  for (var i = 0; i < base.length; i++){
    KNOTS.push({
      x: base[i][0] + (genRnd() - 0.5) * 36,
      y: base[i][1] + (genRnd() - 0.5) * 36,
      ph: genRnd() * Math.PI * 2,
      dir: genRnd() < 0.5 ? 1 : -1
    });
  }
})();

function flowAngle(x, y){
  var a = 0.16 * Math.sin((y + 26 * Math.sin(x * 0.006)) * 0.012)
        + 0.05 * Math.sin(x * 0.004 + 1.3);
  for (var i = 0; i < KNOTS.length; i++){
    var k = KNOTS[i];
    var dx = x - k.x, dy = y - k.y;
    var d2 = dx * dx + dy * dy;
    var infl = Math.exp(-d2 / (2 * 95 * 95)) * 1.15 * k.dir;
    var tang = Math.atan2(dy, dx) + Math.PI / 2;
    a += Math.sin(tang) * infl * 0.4 + (Math.cos(tang) - 0) * infl * 0.12;
  }
  return a;
}

/* Grain polylines -> flat segment list {x1,y1,x2,y2,mx,my,hl} */
var GRAIN_SEGS = [];
(function(){
  var rnd = mulberry32(SEED ^ 0x51ab);
  var li = 0;
  for (var gy = 236; gy <= 790; gy += 16.5, li++){
    var x = 66 + rnd() * 34, y = gy + (rnd() - 0.5) * 5;
    var hl = (li % 5 === 2);
    var pts = [], inside = false, outRun = 0;
    for (var s = 0; s < 95; s++){
      var a = flowAngle(x, y);
      x += 13; y += Math.tan(a) * 13;
      if (pointInPoly(x, y)){
        pts.push([x, y]); inside = true; outRun = 0;
      } else if (inside){
        outRun++;
        if (outRun > 2) break;
      }
      if (x > 905) break;
    }
    for (var p = 1; p < pts.length; p++){
      GRAIN_SEGS.push({
        x1: pts[p-1][0], y1: pts[p-1][1], x2: pts[p][0], y2: pts[p][1],
        mx: (pts[p-1][0] + pts[p][0]) / 2, my: (pts[p-1][1] + pts[p][1]) / 2,
        hl: hl
      });
    }
  }
})();

/* ---------------- strings + nodes ---------------- */

var SCALES = [
  [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24],   // A minor pentatonic
  [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24],    // A major pentatonic
  [0, 2, 3, 7, 9, 12, 14, 15, 19, 21, 24]     // A dorian colour
];
var STRING_TOP = 252, STRING_BOT = 748;
var strings = [];   // {x, segs:[{y1,y2,my}], nodes:[node]}
var nodes = [];     // {x, y, f, si, deg, baseDeg}

(function(){
  var rnd = mulberry32(SEED ^ 0x77c1);
  var counts = [3, 3, 2, 3, 3, 2, 3, 3];      // 22 nodes
  for (var i = 0; i < 8; i++){
    var x = 252 + i * 74 + (rnd() - 0.5) * 10;
    var st = { x: x, segs: [], nodes: [] };
    var NS = 22;
    for (var s2 = 0; s2 < NS; s2++){
      var ya = STRING_TOP + (STRING_BOT - STRING_TOP) * s2 / NS;
      var yb = STRING_TOP + (STRING_BOT - STRING_TOP) * (s2 + 1) / NS;
      st.segs.push({ y1: ya, y2: yb, my: (ya + yb) / 2 });
    }
    var fs = [];
    var guard = 0;
    while (fs.length < counts[i] && guard++ < 200){
      var f = 0.10 + rnd() * 0.80;
      var ok = true;
      for (var q = 0; q < fs.length; q++) if (Math.abs(fs[q] - f) < 0.17) ok = false;
      if (ok) fs.push(f);
    }
    fs.sort(function(a, b){ return a - b; });
    for (var n2 = 0; n2 < fs.length; n2++){
      var f2 = fs[n2];
      var deg = Math.round((1 - f2) * 10);
      var nd = {
        x: x, y: STRING_TOP + f2 * (STRING_BOT - STRING_TOP),
        f: f2, si: i, deg: deg, id: nodes.length
      };
      st.nodes.push(nd); nodes.push(nd);
    }
    strings.push(st);
  }
})();

var tuning = 0;              // index into SCALES; double-tap cycles it
function nodeFreq(nd){
  var off = SCALES[tuning][nd.deg];
  return 110 * Math.pow(2, off / 12);
}

/* screws (seeded, near the edges) */
var SCREWS = [];
(function(){
  var rnd = mulberry32(SEED ^ 0x3d9e);
  var base = [[262, 268], [560, 238], [846, 452], [300, 742], [700, 758]];
  for (var i = 0; i < base.length; i++){
    SCREWS.push({
      x: base[i][0] + (rnd() - 0.5) * 18,
      y: base[i][1] + (rnd() - 0.5) * 18,
      a: rnd() * Math.PI
    });
  }
})();

/* cables drooping from the lower edge */
var CABLES = [
  { x0: 430, y0: 792, c1x: 428, c1y: 880, c2x: 372, c2y: 908, x1: 388, y1: 972 },
  { x0: 560, y0: 798, c1x: 566, c1y: 884, c2x: 646, c2y: 900, x1: 636, y1: 978 }
];

/* ---------------- events + schedule ---------------- */

var plucks = [];       // {x, y, t0, str, node}  visitor + arpeggio grain glow
var nodeHits = [];     // {node, t0, str}        node flare envelopes
var stamps = [];       // {x, y, t}              bow drag stamps
var pendingTap = null; // {x, y, tExec}
var labelUntil = -1;   // piece time until which the label reads RETUNED
var ARP_BASE = 9.2, ARP_EVERY = 30, ARP_STEP = 0.55;

function arpSeq(k){
  var rnd = mulberry32((SEED ^ (k * 7919 + 13)) >>> 0);
  var picks = [], guard = 0;
  while (picks.length < 5 && guard++ < 300){
    var id = Math.floor(rnd() * nodes.length);
    if (picks.indexOf(id) < 0) picks.push(id);
  }
  return picks;
}
/* arpeggio pulse brightness for a node at time t (also used to trigger tones) */
function arpEnv(nd, t){
  var e = 0;
  for (var k = 0; k < 3; k++){
    var base = ARP_BASE + k * ARP_EVERY;
    if (t < base - 0.1) continue;
    var seq = arpSeq(k);
    for (var j = 0; j < seq.length; j++){
      if (seq[j] !== nd.id) continue;
      var age = t - (base + j * ARP_STEP);
      if (age > 0) e = Math.max(e, env(age) * 0.85);
    }
  }
  return e;
}
function env(age){
  if (age <= 0) return 0;
  if (age < 0.06) return age / 0.06;
  return Math.exp(-(age - 0.06) * 2.0);
}
function sapFrontX(t){
  return ((t * 55 + 150) % 1300) - 150;
}
function fireNode(nd, t, str){
  nodeHits.push({ node: nd, t0: t, str: str });
  plucks.push({ x: nd.x, y: nd.y, t0: t, str: str });
  playPluck(nodeFreq(nd), 0.5 * str + 0.2);
  trimEvents(t);
}
function trimEvents(t){
  plucks = plucks.filter(function(p){ return t - p.t0 < 2.2; });
  nodeHits = nodeHits.filter(function(h){ return t - h.t0 < 1.6; });
  stamps = stamps.filter(function(s){ return t - s.t < 0.9; });
}

/* ---------------- audio (lazy, guarded) ---------------- */

var AC = null, ksCache = {}, bowNodes = null;
function ensureAudio(){
  if (AC) { if (AC.resume) AC.resume(); return; }
  var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext
           : (typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null;
  if (!Ctor) return;
  try { AC = new Ctor(); } catch (e) { AC = null; }
}
function ksBuffer(freq){
  var key = Math.round(freq * 10);
  if (ksCache[key]) return ksCache[key];
  var sr = AC.sampleRate, dur = 1.4, len = Math.floor(sr * dur);
  var buf = AC.createBuffer(1, len, sr);
  var d = buf.getChannelData(0);
  var N = Math.max(2, Math.round(sr / freq));
  var i, j;
  for (i = 0; i < N; i++) d[i] = Math.random() * 2 - 1;
  for (j = N; j < len; j++){
    var prev = d[j - N], prev2 = d[j - N - 1] || 0;
    d[j] = (prev + prev2) * 0.5 * 0.996;
  }
  ksCache[key] = buf;
  return buf;
}
function playPluck(freq, gain){
  if (!AC) return;
  try {
    var src = AC.createBufferSource();
    src.buffer = ksBuffer(freq);
    var g = AC.createGain();
    g.gain.value = Math.min(0.6, gain);
    src.connect(g); g.connect(AC.destination);
    src.start();
  } catch (e) {}
}
function playKnock(){
  if (!AC) return;
  try {
    var dur = 0.07, sr = AC.sampleRate;
    var buf = AC.createBuffer(1, Math.floor(sr * dur), sr);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 320;
    var g = AC.createGain(); g.gain.value = 0.05;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start();
  } catch (e) {}
}
function bowStart(){
  if (!AC || bowNodes) return;
  try {
    var osc = AC.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 196;
    var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500; f.Q.value = 2;
    var g = AC.createGain(); g.gain.value = 0;
    osc.connect(f); f.connect(g); g.connect(AC.destination);
    osc.start();
    bowNodes = { osc: osc, f: f, g: g };
  } catch (e) { bowNodes = null; }
}
function bowMove(freq, speed){
  if (!bowNodes || !AC) return;
  var t = AC.currentTime;
  bowNodes.osc.frequency.setTargetAtTime(freq, t, 0.05);
  bowNodes.f.frequency.setTargetAtTime(Math.min(2400, 320 + speed * 2.4), t, 0.06);
  bowNodes.g.gain.setTargetAtTime(0.10, t, 0.05);
}
function bowStop(){
  if (!bowNodes || !AC) return;
  var bn = bowNodes; bowNodes = null;
  try {
    bn.g.gain.setTargetAtTime(0, AC.currentTime, 0.08);
    setTimeout(function(){ try { bn.osc.stop(); } catch (e) {} }, 350);
  } catch (e) {}
}

/* ---------------- transform + hit testing ---------------- */

var view = { s: 1, cx: 0, cy: 0, ang: -0.10 };
function computeView(){
  view.s = Math.min(W, H) / 1000 * 0.99;
  view.cx = W / 2; view.cy = H / 2;
}
function toUnit(px, py){
  var dx = px - view.cx, dy = py - view.cy;
  var ca = Math.cos(-view.ang), sa = Math.sin(-view.ang);
  return [ (dx * ca - dy * sa) / view.s + 500, (dx * sa + dy * ca) / view.s + 500 ];
}
function nearestNode(x, y, maxD){
  var best = null, bd = maxD;
  for (var i = 0; i < nodes.length; i++){
    var dx = nodes[i].x - x, dy = nodes[i].y - y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < bd) { bd = d; best = nodes[i]; }
  }
  return best;
}

/* ---------------- draw ---------------- */

function draw(t){
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  computeView();
  ctx.fillStyle = COL.black;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(view.cx, view.cy);
  ctx.rotate(view.ang);
  ctx.scale(view.s, view.s);
  ctx.translate(-500, -500);

  /* cables, from behind the lower edge */
  ctx.lineCap = 'round';
  for (var ci = 0; ci < CABLES.length; ci++){
    var cb = CABLES[ci];
    ctx.beginPath();
    ctx.moveTo(cb.x0, cb.y0);
    ctx.bezierCurveTo(cb.c1x, cb.c1y, cb.c2x, cb.c2y, cb.x1, cb.y1);
    ctx.strokeStyle = '#140D08'; ctx.lineWidth = 6; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cb.x0, cb.y0);
    ctx.bezierCurveTo(cb.c1x, cb.c1y - 1, cb.c2x, cb.c2y - 1, cb.x1, cb.y1);
    ctx.strokeStyle = '#2A1A0E'; ctx.lineWidth = 1.6; ctx.stroke();
  }

  /* body */
  bodyPath();
  ctx.fillStyle = COL.wood;
  ctx.fill();

  ctx.save();
  bodyPath();
  ctx.clip();

  /* grain base pass */
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = 2.1;
  for (var gi = 0; gi < GRAIN_SEGS.length; gi++){
    var g = GRAIN_SEGS[gi];
    ctx.beginPath();
    ctx.moveTo(g.x1, g.y1); ctx.lineTo(g.x2, g.y2);
    ctx.strokeStyle = g.hl ? COL.hi : COL.grain;
    ctx.globalAlpha = g.hl ? 0.42 : 0.55;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* knots */
  for (var ki = 0; ki < KNOTS.length; ki++){
    var kn = KNOTS[ki];
    ctx.strokeStyle = COL.grain;
    for (var r = 0; r < 5; r++){
      var rad = 4 + r * 6.5;
      ctx.beginPath();
      for (var ai = 0; ai <= 26; ai++){
        var th = ai / 26 * Math.PI * 2;
        var rr = rad + Math.sin(th * 3 + kn.ph + r) * 1.5;
        var px = kn.x + Math.cos(th) * rr, py = kn.y + Math.sin(th) * rr * 0.82;
        if (ai === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.globalAlpha = 0.55; ctx.lineWidth = 1.6; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(kn.x, kn.y, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = '#5A3520'; ctx.fill();
  }

  /* sap glow: a warm band travelling along the grain */
  var fx = sapFrontX(t);
  for (var si = 0; si < GRAIN_SEGS.length; si++){
    var sg = GRAIN_SEGS[si];
    var dd = (sg.mx - fx) / 115;
    var fall = Math.exp(-dd * dd);
    if (fall < 0.04) continue;
    ctx.beginPath();
    ctx.moveTo(sg.x1, sg.y1); ctx.lineTo(sg.x2, sg.y2);
    ctx.strokeStyle = COL.sap; ctx.globalAlpha = 0.30 * fall; ctx.lineWidth = 4.6; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sg.x1, sg.y1); ctx.lineTo(sg.x2, sg.y2);
    ctx.strokeStyle = COL.hi; ctx.globalAlpha = 0.36 * fall; ctx.lineWidth = 1.8; ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* pluck / arpeggio glow along the grain */
  var sources = [];
  for (var pi = 0; pi < plucks.length; pi++){
    var pe = env(t - plucks[pi].t0) * plucks[pi].str;
    if (pe > 0.02) sources.push({ x: plucks[pi].x, y: plucks[pi].y, e: pe });
  }
  for (var ni = 0; ni < nodes.length; ni++){
    var ae = arpEnv(nodes[ni], t);
    if (ae > 0.02) sources.push({ x: nodes[ni].x, y: nodes[ni].y, e: ae * 0.8 });
  }
  if (sources.length){
    for (var qi = 0; qi < GRAIN_SEGS.length; qi++){
      var qg = GRAIN_SEGS[qi];
      var glow = 0;
      for (var wi = 0; wi < sources.length; wi++){
        var dx = qg.mx - sources[wi].x, dy = qg.my - sources[wi].y;
        glow += sources[wi].e * Math.exp(-Math.sqrt(dx * dx + dy * dy) / 120);
      }
      if (glow < 0.05) continue;
      ctx.beginPath();
      ctx.moveTo(qg.x1, qg.y1); ctx.lineTo(qg.x2, qg.y2);
      ctx.strokeStyle = COL.glow;
      ctx.globalAlpha = Math.min(0.85, glow);
      ctx.lineWidth = 3.0;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* strings */
  ctx.strokeStyle = COL.strings;
  ctx.lineWidth = 1.3;
  for (var ti = 0; ti < strings.length; ti++){
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(strings[ti].x, STRING_TOP);
    ctx.lineTo(strings[ti].x, STRING_BOT);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* bow glow on string segments near recent stamps */
  if (stamps.length){
    for (var bi = 0; bi < strings.length; bi++){
      var bst = strings[bi];
      for (var bs = 0; bs < bst.segs.length; bs++){
        var seg = bst.segs[bs];
        var bg = 0;
        for (var sti = 0; sti < stamps.length; sti++){
          var age = t - stamps[sti].t;
          if (age < 0) continue;
          var bdx = bst.x - stamps[sti].x, bdy = seg.my - stamps[sti].y;
          bg += Math.exp(-Math.sqrt(bdx * bdx + bdy * bdy) / 46) * Math.exp(-age * 4);
        }
        if (bg < 0.05) continue;
        ctx.beginPath();
        ctx.moveTo(bst.x, seg.y1); ctx.lineTo(bst.x, seg.y2);
        ctx.strokeStyle = COL.glow;
        ctx.globalAlpha = Math.min(0.8, bg);
        ctx.lineWidth = 3.2;
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* nodes */
  for (var ndi = 0; ndi < nodes.length; ndi++){
    var nd = nodes[ndi];
    var fl = arpEnv(nd, t);
    for (var hi2 = 0; hi2 < nodeHits.length; hi2++){
      if (nodeHits[hi2].node === nd) fl = Math.max(fl, env(t - nodeHits[hi2].t0) * nodeHits[hi2].str);
    }
    if (fl > 0.02){
      var rp = Math.min(1, (t % 1) * 0 + fl);
      ctx.beginPath();
      ctx.arc(nd.x, nd.y, 8 + 22 * (1 - fl), 0, Math.PI * 2);
      ctx.strokeStyle = COL.glow; ctx.globalAlpha = fl * 0.7; ctx.lineWidth = 2; ctx.stroke();
      ctx.globalAlpha = 1;
      void rp;
    }
    ctx.beginPath(); ctx.arc(nd.x, nd.y, 7.4, 0, Math.PI * 2);
    ctx.fillStyle = '#8A6420'; ctx.fill();
    ctx.beginPath(); ctx.arc(nd.x, nd.y, 6.2, 0, Math.PI * 2);
    ctx.fillStyle = COL.brass; ctx.fill();
    if (fl > 0.02){
      ctx.beginPath(); ctx.arc(nd.x, nd.y, 6.2, 0, Math.PI * 2);
      ctx.fillStyle = COL.glow; ctx.globalAlpha = fl * 0.75; ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.beginPath(); ctx.arc(nd.x - 1.8, nd.y - 1.8, 1.7, 0, Math.PI * 2);
    ctx.fillStyle = COL.hi; ctx.globalAlpha = 0.8; ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* screws */
  for (var sci = 0; sci < SCREWS.length; sci++){
    var sc = SCREWS[sci];
    ctx.beginPath(); ctx.arc(sc.x, sc.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = COL.grain; ctx.fill();
    ctx.beginPath(); ctx.arc(sc.x, sc.y, 5, 0, Math.PI * 2);
    ctx.strokeStyle = COL.hi; ctx.globalAlpha = 0.35; ctx.lineWidth = 1; ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.moveTo(sc.x - Math.cos(sc.a) * 3.4, sc.y - Math.sin(sc.a) * 3.4);
    ctx.lineTo(sc.x + Math.cos(sc.a) * 3.4, sc.y + Math.sin(sc.a) * 3.4);
    ctx.strokeStyle = COL.label; ctx.lineWidth = 1.4; ctx.stroke();
  }

  /* engraved label */
  var label = (t < labelUntil) ? 'RETUNED' : 'TIMBER / TIMBRE';
  ctx.font = '600 19px Georgia, "Times New Roman", serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.30; ctx.fillStyle = COL.hi;
  ctx.fillText(label, 500, 737.4);
  ctx.globalAlpha = 0.92; ctx.fillStyle = COL.label;
  ctx.fillText(label, 500, 736);
  ctx.globalAlpha = 1;

  ctx.restore();   // unclip

  /* body edge */
  bodyPath();
  ctx.strokeStyle = COL.grain; ctx.globalAlpha = 0.6; ctx.lineWidth = 2; ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.restore();
}

/* ---------------- interaction ---------------- */

var pdown = null;   // {px, py, t, dragging, lx, ly, lastStamp, moved}
function pieceNow(){
  return T0 + (nowStamp() - startStamp) / 1000;
}
function nowStamp(){
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
}
var startStamp = nowStamp();

function onDown(e){
  ensureAudio();
  var pt = evPoint(e);
  pdown = { px: pt[0], py: pt[1], lx: pt[0], ly: pt[1], dragging: false, lastStamp: 0, t: pieceNow() };
}
function onMove(e){
  if (!pdown) return;
  var pt = evPoint(e);
  var dx = pt[0] - pdown.px, dy = pt[1] - pdown.py;
  if (!pdown.dragging && Math.sqrt(dx * dx + dy * dy) > 7){
    pdown.dragging = true;
    bowStart();
  }
  if (pdown.dragging){
    var t = pieceNow();
    var u = toUnit(pt[0], pt[1]);
    var mdx = pt[0] - pdown.lx, mdy = pt[1] - pdown.ly;
    var speed = Math.sqrt(mdx * mdx + mdy * mdy);
    if (t - pdown.lastStamp > 0.016){
      stamps.push({ x: u[0], y: u[1], t: t });
      pdown.lastStamp = t;
      /* string crossings: grain glow where the drag crosses a string */
      var pu = toUnit(pdown.lx, pdown.ly);
      for (var i = 0; i < strings.length; i++){
        var sx = strings[i].x;
        if ((pu[0] - sx) * (u[0] - sx) < 0){
          var frac = (sx - pu[0]) / (u[0] - pu[0]);
          var cy2 = pu[1] + frac * (u[1] - pu[1]);
          if (cy2 > STRING_TOP - 10 && cy2 < STRING_BOT + 10)
            plucks.push({ x: sx, y: cy2, t0: t, str: 0.55 });
        }
      }
      var nn = nearestNode(u[0], u[1], 400);
      if (nn) bowMove(nodeFreq(nn), speed * 60);
      trimEvents(t);
    }
    pdown.lx = pt[0]; pdown.ly = pt[1];
  }
}
function onUp(e){
  if (!pdown) return;
  var pt = evPoint(e);
  var wasDrag = pdown.dragging;
  pdown = null;
  if (wasDrag){ bowStop(); return; }
  var t = pieceNow();
  var u = toUnit(pt[0], pt[1]);
  if (pendingTap && t - pendingTap.tapT < 0.35){
    pendingTap = null;
    /* double-tap: retune */
    tuning = (tuning + 1) % SCALES.length;
    labelUntil = t + 1.5;
    plucks.push({ x: 500, y: 736, t0: t, str: 0.7 });
    return;
  }
  pendingTap = { x: u[0], y: u[1], tapT: t, tExec: t + 0.22 };
}
function evPoint(e){
  if (e && typeof e.clientX === 'number') return [e.clientX, e.clientY];
  if (e && e.touches && e.touches[0]) return [e.touches[0].clientX, e.touches[0].clientY];
  if (e && e.changedTouches && e.changedTouches[0]) return [e.changedTouches[0].clientX, e.changedTouches[0].clientY];
  return [0, 0];
}
if (cv.addEventListener){
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', function(){ pdown = null; bowStop(); });
  cv.addEventListener('touchstart', function(e){ if (e.preventDefault) e.preventDefault(); }, { passive: false });
}

/* ---------------- main loop ---------------- */

var lastArpFired = -1, lastSapCycle = -1;
function frame(){
  var t = pieceNow();
  /* execute a pending single tap */
  if (pendingTap && t >= pendingTap.tExec){
    var pt2 = pendingTap; pendingTap = null;
    var nd = nearestNode(pt2.x, pt2.y, 110);
    if (nd) fireNode(nd, t, 1.0);
    else { plucks.push({ x: pt2.x, y: pt2.y, t0: t, str: 0.6 }); trimEvents(t); }
  }
  /* arpeggio tones + sap knocks (audio side effects only) */
  if (AC){
    var k = Math.floor((t - ARP_BASE) / ARP_EVERY);
    for (var kk = Math.max(0, k - 1); kk <= k + 1; kk++){
      var base = ARP_BASE + kk * ARP_EVERY;
      var seq = arpSeq(kk);
      for (var j = 0; j < seq.length; j++){
        var ptm = base + j * ARP_STEP;
        var idkey = kk * 100 + j;
        if (ptm <= t && ptm > t - 0.06 && lastArpFired !== idkey){
          lastArpFired = idkey;
          playPluck(nodeFreq(nodes[seq[j]]), 0.22);
        }
      }
    }
    var cyc = Math.floor((t * 55 + 150) / 1300);
    if (lastSapCycle < 0) lastSapCycle = cyc;
    else if (cyc !== lastSapCycle){ lastSapCycle = cyc; playKnock(); }
  }
  draw(t);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
draw(T0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
</script>
</body>
