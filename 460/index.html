<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Door Policy</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0B10; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var SURROUND = '#0B0B10';
var GLOW_HI = '#FFD166';
var GLOW_LO = '#FF9E3D';
var SIL = '#2A2118';
var MAN = '#1A1512';

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- interior scene (seeded) ----------
var sceneSeed = 46055;          // arrangement zero
var sceneStream = mulberry32(90210);
var desks = [];                 // {x:0..1, row:0|1, s:scale, fig:bool, ph:phase}
function buildScene(seed) {
  var rng = mulberry32(seed);
  desks = [];
  var count = 3 + Math.floor(rng() * 3);        // 3 to 5 desks
  for (var i = 0; i < count; i++) {
    desks.push({
      x: (i + 0.5) / count + (rng() - 0.5) * 0.10,
      row: i % 2,
      s: 0.85 + rng() * 0.35,
      fig: rng() > 0.15,
      ph: rng() * Math.PI * 2
    });
  }
  desks.sort(function (a, b) { return a.row - b.row; });
}
buildScene(sceneSeed);
function reseed() {
  sceneSeed = 1000 + Math.floor(sceneStream() * 900000);
  buildScene(sceneSeed);
}

// ---------- state ----------
var PRE_ROLL = 21000;           // fixed pre-roll, ms: first frame fully developed
var startStamp = Date.now();
var doorAngle = 1.12;           // fixed inviting angle for frame one (rad)
var dragging = false, dragMoved = 0, downX = 0, downY = 0, downT = 0;
var lastW = 0, lastH = 0, isPhone = false;

function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  lastW = w; lastH = h;
  var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
  isPhone = sw < 700 || h > w * 1.15;
  draw(currentT());
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
window.addEventListener('resize', resize);

function currentT() {
  return PRE_ROLL + (Date.now() - startStamp);
}

// geometry for the current viewport
function geom(w, h) {
  var groundY = h * 0.84;
  var doorH = h * 0.60;
  var doorW = doorH * 0.46;
  var cx = isPhone ? w * 0.60 : w * 0.62;
  var ox = cx - doorW / 2;
  return { groundY: groundY, doorH: doorH, doorW: doorW, ox: ox, top: groundY - doorH };
}

// ---------- drawing ----------
function drawFigureAtDesks(g, t) {
  // interior, clipped inside the door opening, sheared by door angle
  var openW = g.doorW;
  ctx.save();
  ctx.beginPath();
  ctx.rect(g.ox, g.top, openW, g.doorH);
  ctx.clip();
  var grad = ctx.createLinearGradient(0, g.top, 0, g.groundY);
  grad.addColorStop(0, GLOW_HI);
  grad.addColorStop(1, GLOW_LO);
  ctx.fillStyle = grad;
  ctx.fillRect(g.ox, g.top, openW, g.doorH);
  var shear = (doorAngle - 0.5) * g.doorW * 0.10;
  // back wall panel (parallax by angle)
  ctx.fillStyle = 'rgba(42,33,24,0.14)';
  ctx.fillRect(g.ox + openW * 0.34 - shear, g.top + g.doorH * 0.10,
               openW * 0.52, g.doorH * 0.26);
  ctx.strokeStyle = 'rgba(42,33,24,0.35)';
  ctx.lineWidth = Math.max(1, g.doorW * 0.008);
  ctx.strokeRect(g.ox + openW * 0.34 - shear, g.top + g.doorH * 0.10,
                 openW * 0.52, g.doorH * 0.26);
  // desks and figures
  for (var i = 0; i < desks.length; i++) {
    var d = desks[i];
    var rowY = g.top + g.doorH * (d.row === 0 ? 0.64 : 0.82);
    var dx = g.ox + d.x * openW - shear * (d.row === 0 ? 0.7 : 1);
    var dw = g.doorW * 0.34 * d.s;
    var dh = g.doorH * 0.038 * d.s;
    if (d.fig) {
      var sway = Math.sin((t / 60000) * Math.PI * 2 + d.ph) * 0.055;
      var fr = g.doorH * 0.034 * d.s;
      ctx.save();
      ctx.translate(dx, rowY - dh);
      ctx.rotate(sway);
      ctx.fillStyle = SIL;
      ctx.beginPath(); ctx.arc(0, -fr * 1.50, fr, 0, Math.PI * 2); ctx.fill(); // head
      ctx.beginPath();                                                        // shoulders
      ctx.moveTo(-fr * 1.6, 0); ctx.lineTo(fr * 1.6, 0);
      ctx.lineTo(fr * 0.95, -fr * 1.0); ctx.lineTo(-fr * 0.95, -fr * 1.0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = SIL;
    ctx.fillRect(dx - dw / 2, rowY - dh, dw, dh);                       // desk top
    ctx.fillRect(dx - dw / 2, rowY, dh * 0.8, g.doorH * 0.085 * d.s);   // leg L
    ctx.fillRect(dx + dw / 2 - dh * 0.8, rowY, dh * 0.8, g.doorH * 0.085 * d.s); // leg R
  }
  ctx.restore();
}

function drawBusinessman(g) {
  var bx = isPhone ? lastW * 0.15 : lastW * 0.19;
  var bh = g.doorH * 0.34;
  var by = g.groundY;
  var u = bh / 100;
  // soft shadow
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.ellipse(bx, by + u * 2, u * 17, u * 3.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = MAN;
  ctx.strokeStyle = MAN;
  // legs
  ctx.lineWidth = u * 5.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bx - u * 2, by - u * 38); ctx.lineTo(bx - u * 5, by - u * 1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx + u * 2, by - u * 38); ctx.lineTo(bx + u * 6, by - u * 1); ctx.stroke();
  // torso (suit), facing right
  ctx.beginPath();
  ctx.moveTo(bx - u * 10, by - u * 78); ctx.lineTo(bx + u * 10, by - u * 78);
  ctx.lineTo(bx + u * 7, by - u * 36); ctx.lineTo(bx - u * 7, by - u * 36);
  ctx.closePath(); ctx.fill();
  // arm toward the door, holding a briefcase
  ctx.lineWidth = u * 4.4;
  ctx.beginPath(); ctx.moveTo(bx + u * 8, by - u * 72); ctx.lineTo(bx + u * 16, by - u * 46); ctx.stroke();
  ctx.fillRect(bx + u * 11, by - u * 46, u * 17, u * 12);
  // head
  ctx.beginPath(); ctx.arc(bx + u * 1, by - u * 88, u * 10, 0, Math.PI * 2); ctx.fill();
  // warm rim light on the side facing the door
  ctx.strokeStyle = 'rgba(255,158,61,0.6)';
  ctx.lineWidth = Math.max(1, u * 1.4);
  ctx.beginPath(); ctx.arc(bx + u * 1, by - u * 88, u * 10, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx + u * 10, by - u * 77); ctx.lineTo(bx + u * 7, by - u * 38); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,209,102,0.5)';
  ctx.strokeRect(bx + u * 11, by - u * 46, u * 17, u * 12);
}

function draw(t) {
  var w = lastW, h = lastH;
  if (!w || !h) return;
  var dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  var g = geom(w, h);

  // dark surround and ground
  ctx.fillStyle = SURROUND;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.018)';
  ctx.fillRect(0, g.groundY, w, h - g.groundY);

  var openFrac = Math.sin(Math.max(0, Math.min(1.35, doorAngle))); // 0 closed, ~0.81 at rest
  var panelW = Math.max(g.doorW * 0.06, g.doorW * Math.cos(doorAngle));

  // ---- light spill on the ground, widens with the door ----
  var revL = g.ox + panelW, revR = g.ox + g.doorW;
  var spillH = g.doorH * 0.20 * (0.45 + openFrac);
  var spillL = g.doorW * (0.35 + openFrac * 1.15);
  var sg = ctx.createLinearGradient(0, g.groundY, 0, g.groundY + spillH * 1.7);
  sg.addColorStop(0, 'rgba(255,209,102,' + (0.28 + openFrac * 0.38) + ')');
  sg.addColorStop(0.55, 'rgba(255,158,61,' + (0.10 + openFrac * 0.16) + ')');
  sg.addColorStop(1, 'rgba(255,158,61,0)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.moveTo(revL, g.groundY);
  ctx.lineTo(revR, g.groundY);
  ctx.lineTo(revR + spillL * 0.30, g.groundY + spillH * 1.7);
  ctx.lineTo(revL - spillL * 0.62, g.groundY + spillH * 1.7);
  ctx.closePath(); ctx.fill();

  // ---- halo around the doorway ----
  ctx.fillStyle = 'rgba(255,158,61,0.07)';
  ctx.fillRect(g.ox - g.doorW * 0.16, g.top - g.doorH * 0.07, g.doorW * 1.32, g.doorH * 1.10);
  ctx.fillStyle = 'rgba(255,209,102,0.08)';
  ctx.fillRect(g.ox - g.doorW * 0.08, g.top - g.doorH * 0.035, g.doorW * 1.16, g.doorH * 1.05);

  // ---- interior through the opening ----
  drawFigureAtDesks(g, t);

  // ---- the door panel, hinged at the left edge of the opening ----
  var pg = ctx.createLinearGradient(0, g.top, 0, g.groundY);
  pg.addColorStop(0, GLOW_LO);
  pg.addColorStop(1, GLOW_HI);
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.moveTo(g.ox, g.top);
  ctx.lineTo(g.ox + panelW, g.top + g.doorH * 0.028);
  ctx.lineTo(g.ox + panelW, g.groundY - g.doorH * 0.018);
  ctx.lineTo(g.ox, g.groundY);
  ctx.closePath(); ctx.fill();
  // panel inset line and knob
  ctx.strokeStyle = 'rgba(42,33,24,0.5)';
  ctx.lineWidth = Math.max(1, g.doorW * 0.010);
  ctx.beginPath();
  ctx.moveTo(g.ox + panelW * 0.14, g.top + g.doorH * 0.07);
  ctx.lineTo(g.ox + panelW * 0.88, g.top + g.doorH * 0.09);
  ctx.lineTo(g.ox + panelW * 0.88, g.groundY - g.doorH * 0.08);
  ctx.lineTo(g.ox + panelW * 0.14, g.groundY - g.doorH * 0.06);
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = SIL;
  ctx.beginPath();
  ctx.arc(g.ox + panelW * 0.82, g.top + g.doorH * 0.52, Math.max(2, g.doorW * 0.022), 0, Math.PI * 2);
  ctx.fill();

  // ---- freestanding frame ----
  ctx.strokeStyle = SIL;
  ctx.lineWidth = Math.max(3, g.doorW * 0.055);
  ctx.strokeRect(g.ox - ctx.lineWidth / 2, g.top - ctx.lineWidth / 2,
                 g.doorW + ctx.lineWidth, g.doorH + ctx.lineWidth / 2);
  ctx.strokeStyle = 'rgba(255,209,102,0.75)';
  ctx.lineWidth = Math.max(1, g.doorW * 0.012);
  ctx.strokeRect(g.ox, g.top, g.doorW, g.doorH);

  // ---- the lone businessman ----
  drawBusinessman(g);

  // ---- hint ----
  ctx.fillStyle = 'rgba(255,158,61,0.42)';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('drag', w - 16, h - 14);
  ctx.textAlign = 'left';
}

// ---------- interaction ----------
function point(e) {
  return { x: e.clientX, y: e.clientY };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = point(e);
  downX = p.x; downY = p.y; downT = Date.now(); dragMoved = 0;
  var g = geom(lastW, lastH);
  dragging = p.x > g.ox - 30 && p.x < g.ox + g.doorW + 40 &&
             p.y > g.top - 30 && p.y < g.groundY + 10;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = point(e);
  dragMoved = Math.max(dragMoved, Math.abs(p.x - downX), Math.abs(p.y - downY));
  var g = geom(lastW, lastH);
  var frac = (p.x - g.ox) / g.doorW;
  frac = Math.max(0.04, Math.min(0.995, frac));
  doorAngle = Math.acos(frac);
  draw(currentT());
});
canvas.addEventListener('pointerup', function (e) {
  var wasDrag = dragging && dragMoved > 8;
  dragging = false;
  if (!wasDrag && Date.now() - downT < 600) { reseed(); }
  draw(currentT());
});

// ---------- run ----------
resize();                 // draws the synchronous first frame at PRE_ROLL phase
function loop() {
  draw(currentT());
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
</script>
</body>
</html>
