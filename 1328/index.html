<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anxious Grid</title>
<style>
  html, body { margin: 0; padding: 0; background: #EDE9E0; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). No unseeded randomness anywhere.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var TILE = '#EDE9E0', GROUT = '#9A978C', SOAP = '#14120F';
  var SHEEN = '#2E2A24', GLINT = '#5C564B';
  var COLS = 8, ROWS = 10;
  var CYCLE = 60; // pour 0-12, scrape 12-24, hold 24-48, fade 48-60
  var PHASE_SHIFT = 24; // frame one opens in the hold phase: pour settled, faces scraped

  var W = 0, H = 0, currentT = 0, started = false, startStamp = 0;
  var touches = []; // {x, y, t, face} touch-darken events
  var extraScrapes = []; // {x, y, t, combo} new scrapes beside touched faces
  var smears = []; // {pts: [[x,y]...], t0} drag smear trails
  var dragPts = null, lastWetUntil = -1;

  function isPhone() {
    try {
      var s = window.screen;
      if (s && s.width && s.height) return Math.min(s.width, s.height) < 700;
    } catch (e) {}
    return H > W * 1.15;
  }

  function size() {
    var vw = W, vh = H;
    try {
      if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
      else { vw = window.innerWidth; vh = window.innerHeight; }
    } catch (e) {}
    W = Math.max(1, Math.floor(vw)); H = Math.max(1, Math.floor(vh));
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }

  // Layout for one cycle, fully seeded.
  function layout(cycle) {
    var rng = mulberry32(1328000 + cycle * 7919);
    var blobs = [];
    var nBlobs = 6;
    for (var i = 0; i < nBlobs; i++) {
      // Anchor on an edge or corner: pour thick at edges, thin toward center.
      var side = Math.floor(rng() * 4);
      var bx, by;
      if (side === 0) { bx = rng() * W; by = -H * 0.02; }
      else if (side === 1) { bx = W * 1.02; by = rng() * H; }
      else if (side === 2) { bx = rng() * W; by = H * 1.02; }
      else { bx = -W * 0.02; by = rng() * H; }
      var r = Math.min(W, H) * (0.22 + rng() * 0.20);
      var pts = [];
      var nPts = 10;
      for (var k = 0; k < nPts; k++) {
        var a = (k / nPts) * Math.PI * 2;
        var rr = r * (0.72 + rng() * 0.5);
        pts.push([bx + Math.cos(a) * rr, by + Math.sin(a) * rr]);
      }
      blobs.push({ x: bx, y: by, r: r, pts: pts });
    }
    // Drip runs at pour boundaries.
    var drips = [];
    for (var d = 0; d < 14; d++) {
      var b = blobs[Math.floor(rng() * blobs.length)];
      var ang = rng() * Math.PI * 2;
      var dx = b.x + Math.cos(ang) * b.r * (0.85 + rng() * 0.25);
      var dy = b.y + Math.sin(ang) * b.r * (0.85 + rng() * 0.25);
      drips.push({ x: dx, y: dy, len: 12 + rng() * 42, w: 2 + rng() * 3, dir: (Math.abs(Math.cos(ang)) > 0.5) ? 'h' : 'v' });
    }
    // Faces: clusters of 1-3 with long empty stretches; unique scratch combos.
    var cw = W / COLS, ch = H / ROWS;
    var combos = [];
    for (var e = 0; e < 3; e++) for (var m = 0; m < 3; m++) for (var o = 0; o < 2; o++) combos.push({ eyes: e, mouth: m, outline: o === 1 });
    // Seeded shuffle of combos.
    for (var s = combos.length - 1; s > 0; s--) {
      var j = Math.floor(rng() * (s + 1));
      var tmp = combos[s]; combos[s] = combos[j]; combos[j] = tmp;
    }
    var faces = [];
    var ci = 0;
    function inPour(cx, cy) {
      for (var q = 0; q < blobs.length; q++) {
        var dx = cx - blobs[q].x, dy = cy - blobs[q].y;
        if (dx * dx + dy * dy < blobs[q].r * blobs[q].r * 0.64) return true;
      }
      return false;
    }
    for (var row = 0; row < ROWS && ci < combos.length; row++) {
      for (var col = 0; col < COLS && ci < combos.length; col++) {
        var cx = (col + 0.5) * cw, cy = (row + 0.5) * ch;
        if (!inPour(cx, cy)) continue;
        if (rng() < 0.50) {
          var cluster = 1 + Math.floor(rng() * 3);
          for (var cc = 0; cc < cluster && col + cc < COLS && ci < combos.length; cc++) {
            var fx = (col + cc + 0.5) * cw, fy = (row + 0.5) * ch;
            if (!inPour(fx, fy)) break;
            faces.push({ x: fx, y: fy, s: Math.min(cw * 1.0, ch * 0.75), combo: combos[ci++] });
          }
          col += cluster; // long empty stretch follows the cluster
        }
      }
    }
    // Sheen patches: flat alpha shapes over the black.
    var sheens = [];
    for (var sh = 0; sh < 10; sh++) {
      var sb = blobs[Math.floor(rng() * blobs.length)];
      sheens.push({ x: sb.x + (rng() - 0.5) * sb.r, y: sb.y + (rng() - 0.5) * sb.r, rx: 20 + rng() * 60, ry: 6 + rng() * 16, rot: rng() * Math.PI });
    }
    return { blobs: blobs, drips: drips, faces: faces, sheens: sheens, cw: cw, ch: ch };
  }

  // Build the stroke list for one face from its combo. Each stroke is drawn
  // with its own beginPath so arcs never connect to a previous subpath.
  function faceStrokes(f) {
    var s = f.s, x = f.x, y = f.y, c = f.combo;
    var st = [];
    if (c.outline) st.push({ t: 'ellipse', x: x, y: y, rx: s * 0.52, ry: s * 0.66, rot: 0 });
    if (c.eyes === 0) {
      st.push({ t: 'ellipse', x: x - s * 0.22, y: y - s * 0.14, rx: s * 0.16, ry: s * 0.20, rot: 0 });
      st.push({ t: 'ellipse', x: x + s * 0.22, y: y - s * 0.14, rx: s * 0.16, ry: s * 0.20, rot: 0 });
    } else if (c.eyes === 1) {
      st.push({ t: 'line', x1: x - s * 0.36, y1: y - s * 0.16, x2: x - s * 0.10, y2: y - s * 0.10 });
      st.push({ t: 'line', x1: x - s * 0.10, y1: y - s * 0.10, x2: x - s * 0.36, y2: y - s * 0.02 });
      st.push({ t: 'line', x1: x + s * 0.10, y1: y - s * 0.10, x2: x + s * 0.36, y2: y - s * 0.16 });
      st.push({ t: 'line', x1: x + s * 0.36, y1: y - s * 0.16, x2: x + s * 0.10, y2: y - s * 0.02 });
    } else {
      st.push({ t: 'arc', x: x - s * 0.22, y: y - s * 0.12, r: s * 0.15, a0: Math.PI, a1: Math.PI * 2 });
      st.push({ t: 'arc', x: x + s * 0.22, y: y - s * 0.12, r: s * 0.15, a0: Math.PI, a1: Math.PI * 2 });
    }
    if (c.mouth === 0) {
      st.push({ t: 'ellipse', x: x, y: y + s * 0.30, rx: s * 0.20, ry: s * 0.30, rot: 0 });
    } else if (c.mouth === 1) {
      st.push({ t: 'arc', x: x, y: y + s * 0.22, r: s * 0.22, a0: 0.15 * Math.PI, a1: 0.85 * Math.PI });
      st.push({ t: 'line', x1: x - s * 0.22, y1: y + s * 0.22, x2: x + s * 0.22, y2: y + s * 0.22 });
    } else {
      st.push({ t: 'line', x1: x - s * 0.28, y1: y + s * 0.28, x2: x + s * 0.28, y2: y + s * 0.34 });
      st.push({ t: 'line', x1: x - s * 0.28, y1: y + s * 0.40, x2: x + s * 0.28, y2: y + s * 0.34 });
    }
    return st;
  }

  function drawStroke(st, lw) {
    ctx.beginPath();
    if (st.t === 'ellipse') {
      ctx.moveTo(st.x + st.rx, st.y);
      ctx.ellipse(st.x, st.y, st.rx, st.ry, st.rot, 0, Math.PI * 2);
    } else if (st.t === 'arc') {
      ctx.moveTo(st.x + Math.cos(st.a0) * st.r, st.y + Math.sin(st.a0) * st.r);
      ctx.arc(st.x, st.y, st.r, st.a0, st.a1);
    } else {
      ctx.moveTo(st.x1, st.y1);
      ctx.lineTo(st.x2, st.y2);
    }
    ctx.lineWidth = lw;
    ctx.stroke();
  }

  function draw(t) {
    currentT = t;
    size();
    var cw = W / COLS, ch = H / ROWS;
    var phase = (t + PHASE_SHIFT) % CYCLE;
    var cycle = Math.floor((t + PHASE_SHIFT) / CYCLE);
    var L = layout(cycle);

    // Phase envelopes: pour grows 0-12, scrape reveals 12-24, hold 24-48, fade 48-60.
    var pourA = 1, reveal = 1, fadeA = 1;
    if (phase < 12) { pourA = phase / 12; reveal = 0; }
    else if (phase < 24) { reveal = (phase - 12) / 12; }
    else if (phase >= 48) { fadeA = 1 - (phase - 48) / 12; }

    // Tiles with slightly uneven grout.
    ctx.fillStyle = GROUT;
    ctx.fillRect(0, 0, W, H);
    var grng = mulberry32(1328000 + cycle * 7919 + 99);
    for (var row = 0; row < ROWS; row++) {
      for (var col = 0; col < COLS; col++) {
        var jx = (grng() - 0.5) * 3, jy = (grng() - 0.5) * 3;
        ctx.fillStyle = TILE;
        ctx.fillRect(col * cw + 2 + jx, row * ch + 2 + jy, cw - 4, ch - 4);
      }
    }

    // Pour layer (fades with the cycle fade).
    ctx.save();
    ctx.globalAlpha = pourA * fadeA;
    ctx.fillStyle = SOAP;
    for (var b = 0; b < L.blobs.length; b++) {
      var pts = L.blobs[b].pts;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var p = 1; p < pts.length; p++) ctx.lineTo(pts[p][0], pts[p][1]);
      ctx.closePath();
      ctx.fill();
    }
    // Drip runs at pour boundaries, growing with the pour.
    for (var d = 0; d < L.drips.length; d++) {
      var dr = L.drips[d];
      ctx.fillStyle = SOAP;
      if (dr.dir === 'v') ctx.fillRect(dr.x - dr.w / 2, dr.y, dr.w, dr.len * pourA);
      else ctx.fillRect(dr.x, dr.y - dr.w / 2, dr.len * pourA, dr.w);
    }
    // Greasy sheen: flat alpha shapes, no gradients.
    ctx.fillStyle = SHEEN;
    for (var sh = 0; sh < L.sheens.length; sh++) {
      var sn = L.sheens[sh];
      ctx.save();
      ctx.globalAlpha = 0.35 * pourA * fadeA;
      ctx.beginPath();
      ctx.moveTo(sn.x + sn.rx, sn.y);
      ctx.ellipse(sn.x, sn.y, sn.rx, sn.ry, sn.rot, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // Scraped faces: strokes in tile color reveal the tile beneath the black.
    // Clipped to the pour polygons so no face spills onto bare tile.
    ctx.save();
    ctx.beginPath();
    for (var bp = 0; bp < L.blobs.length; bp++) {
      var bpts = L.blobs[bp].pts;
      ctx.moveTo(bpts[0][0], bpts[0][1]);
      for (var bq = 1; bq < bpts.length; bq++) ctx.lineTo(bpts[bq][0], bpts[bq][1]);
      ctx.closePath();
    }
    ctx.clip();
    ctx.save();
    ctx.globalAlpha = fadeA;
    for (var f = 0; f < L.faces.length; f++) {
      var face = L.faces[f];
      var strokes = faceStrokes(face);
      var n = Math.floor(reveal * strokes.length);
      ctx.strokeStyle = TILE;
      for (var si = 0; si < n; si++) drawStroke(strokes[si], Math.max(2.5, face.s * 0.08));
      ctx.strokeStyle = GLINT;
      for (var gi = 0; gi < n; gi++) drawStroke(strokes[gi], Math.max(1, face.s * 0.025));
    }
    ctx.restore();

    // Touch-darkened faces and new scrapes beside them (closed-form from events).
    for (var ti = 0; ti < touches.length; ti++) {
      var ev = touches[ti];
      if (ev.face) {
        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = SOAP;
        ctx.beginPath();
        ctx.moveTo(ev.face.x + ev.face.s * 0.6, ev.face.y);
        ctx.ellipse(ev.face.x, ev.face.y, ev.face.s * 0.6, ev.face.s * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    for (var ei = 0; ei < extraScrapes.length; ei++) {
      var es = extraScrapes[ei];
      var esStrokes = faceStrokes({ x: es.x, y: es.y, s: Math.min(cw, ch) * 0.30, combo: es.combo });
      ctx.strokeStyle = TILE;
      for (var esi = 0; esi < esStrokes.length; esi++) drawStroke(esStrokes[esi], 2);
    }
    ctx.restore(); // close pour clip

    // Drag smears: wet sheen for 4s, then hardened.
    for (var mi = 0; mi < smears.length; mi++) {
      var sm = smears[mi];
      var age = t - sm.t0;
      var wet = age < 4;
      ctx.save();
      ctx.strokeStyle = wet ? SHEEN : SOAP;
      ctx.globalAlpha = wet ? 0.55 : 0.9;
      ctx.lineWidth = wet ? 7 : 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(sm.pts[0][0], sm.pts[0][1]);
      for (var sp = 1; sp < sm.pts.length; sp++) ctx.lineTo(sm.pts[sp][0], sm.pts[sp][1]);
      ctx.stroke();
      ctx.restore();
    }
  }

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0].clientY);
    return { x: cx - r.left, y: cy - r.top };
  }

  function nearestFace(x, y, t) {
    var cycle = Math.floor((t + PHASE_SHIFT) / CYCLE);
    var L = layout(cycle);
    var best = null, bd = 1e9;
    for (var i = 0; i < L.faces.length; i++) {
      var dx = x - L.faces[i].x, dy = y - L.faces[i].y;
      var d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = L.faces[i]; }
    }
    var cell = Math.min(W / COLS, H / ROWS);
    if (best && bd < cell * cell * 2.25) return best;
    return null;
  }

  function onDown(e) {
    var p = pos(e);
    var face = nearestFace(p.x, p.y, currentT);
    if (face) {
      touches.push({ x: p.x, y: p.y, t: currentT, face: face });
      // New scrape beside the touched face: one cell over, seeded combo.
      var rng = mulberry32(1328000 + touches.length * 131);
      var cell = Math.min(W / COLS, H / ROWS);
      var nx = face.x + cell * (rng() < 0.5 ? -1 : 1);
      var ny = face.y;
      var combos = [];
      for (var ee = 0; ee < 3; ee++) for (var mm = 0; mm < 3; mm++) for (var oo = 0; oo < 2; oo++) combos.push({ eyes: ee, mouth: mm, outline: oo === 1 });
      extraScrapes.push({ x: nx, y: ny, t: currentT, combo: combos[Math.floor(rng() * combos.length)] });
      lastWetUntil = currentT + 4;
    }
    dragPts = [[p.x, p.y]];
    draw(currentT);
  }

  function onMove(e) {
    if (!dragPts) return;
    var p = pos(e);
    dragPts.push([p.x, p.y]);
    if (currentT <= lastWetUntil || smears.length === 0) {
      smears.push({ pts: dragPts.slice(), t0: currentT });
    } else {
      // Dry drag: extend the last smear as a hardened trail.
      smears.push({ pts: dragPts.slice(), t0: currentT - 5 });
    }
    dragPts = [[p.x, p.y]];
    draw(currentT);
  }

  function onUp() { dragPts = null; }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function onResize() { draw(currentT); }
  try {
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', onResize);
      window.visualViewport.addEventListener('scroll', onResize);
    }
  } catch (e) {}
  window.addEventListener('resize', onResize);

  // Boot: one synchronous developed frame at exactly t = 0.
  draw(0);

  function loop(stamp) {
    if (!started) { started = true; startStamp = stamp; }
    var t = (stamp - startStamp) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
