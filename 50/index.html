<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№50 · Neon Drift</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0a; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// No50 Neon Drift (replaces Mandelbulb Orbit).
// A thousand particles ride a curl-noise flow field on near-black,
// leaving phosphor trails. One neon hue (#d8ff3e) with bone-white
// cores. The field breathes on a slow loop; drag stirs the current.
// No grid, no text, no UI.

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0a0a0a';
const NEON = [216, 255, 62];
const CORE = [244, 241, 234];
const COUNT = 900;

// seeded PRNG
let _s = 50;
function rnd(){ _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; }

// value-noise based curl field
function hash(x, y){
  let h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return h - Math.floor(h);
}
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function field(x, y, t){
  const s = 0.0016;
  const e = 0.35;
  // curl of (n1, n2)
  const n1 = (x, y) => vnoise(x * s + t * 0.05, y * s);
  const n2 = (x, y) => vnoise(x * s + 5.2, y * s + t * 0.04);
  const dy1 = (n1(x, y + e) - n1(x, y - e)) / (2 * e);
  const dx2 = (n2(x + e, y) - n2(x - e, y)) / (2 * e);
  const dy2 = (n2(x, y + e) - n2(x, y - e)) / (2 * e);
  const dx1 = (n1(x + e, y) - n1(x - e, y)) / (2 * e);
  return [dy1 - dx2, dx1 - dy2];
}

const P = [];
function seedParticles(w, h){
  P.length = 0;
  for (let i = 0; i < COUNT; i++){
    P.push({
      x: rnd() * w, y: rnd() * h,
      vx: 0, vy: 0,
      life: rnd(),
      maxLife: 4 + rnd() * 8,
      size: 0.6 + rnd() * 1.6
    });
  }
}

let stirX = -9999, stirY = -9999, stirT = 0;
let dragging = false, lastP = null;

function drawFrame(nowMs){
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    seedParticles(w, h);
  }
  if (!P.length) seedParticles(w, h);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';

  // fade trails
  ctx.fillStyle = 'rgba(10,10,10,0.045)';
  ctx.fillRect(0, 0, w, h);

  const t = nowMs / 1000;
  const breathe = 0.75 + 0.25 * Math.sin(t * 0.11);

  for (const p of P){
    const [fx, fy] = field(p.x, p.y, t);
    let ax = fx * 42 * breathe, ay = fy * 42 * breathe;

    // stir from drag
    const dxs = p.x - stirX, dys = p.y - stirY;
    const ds = Math.hypot(dxs, dys);
    const stirAge = (performance.now() / 1000) - stirT;
    if (ds < 190 && stirAge < 1.6){
      const f = (1 - ds / 190) * (1 - stirAge / 1.6) * 260;
      ax += (dxs / (ds || 1)) * f;
      ay += (dys / (ds || 1)) * f;
    }

    p.vx = (p.vx + ax * 0.016) * 0.94;
    p.vy = (p.vy + ay * 0.016) * 0.94;
    p.x += p.vx; p.y += p.vy;
    p.life += 0.016;

    if (p.life > p.maxLife || p.x < -20 || p.x > w + 20 || p.y < -20 || p.y > h + 20){
      p.x = rnd() * w; p.y = rnd() * h;
      p.vx = 0; p.vy = 0;
      p.life = 0;
      p.maxLife = 4 + rnd() * 8;
    }

    const fadeIn = Math.min(1, p.life * 3);
    const fadeOut = Math.min(1, (p.maxLife - p.life) * 1.5);
    const a = Math.max(0, Math.min(1, fadeIn * fadeOut));
    if (a <= 0.01) continue;
    const sp = Math.hypot(p.vx, p.vy);
    const glow = Math.min(1, sp * 0.09);

    // neon trail dot
    ctx.fillStyle = 'rgba(' + NEON[0] + ',' + NEON[1] + ',' + NEON[2] + ',' + (a * (0.25 + glow * 0.55)).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (1 + glow), 0, Math.PI * 2);
    ctx.fill();
    // hot core on fast particles
    if (glow > 0.45){
      ctx.fillStyle = 'rgba(' + CORE[0] + ',' + CORE[1] + ',' + CORE[2] + ',' + (a * glow * 0.8).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function loop(nowMs){ drawFrame(nowMs); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); }
drawFrame(1200);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

canvas.addEventListener('pointerdown', ev => {
  dragging = true;
  const r = canvas.getBoundingClientRect();
  lastP = { x: ev.clientX - r.left, y: ev.clientY - r.top };
  stirX = lastP.x; stirY = lastP.y; stirT = performance.now() / 1000;
});
canvas.addEventListener('pointermove', ev => {
  if (!dragging) return;
  const r = canvas.getBoundingClientRect();
  stirX = ev.clientX - r.left; stirY = ev.clientY - r.top;
  stirT = performance.now() / 1000;
});
function endDrag(){ dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
