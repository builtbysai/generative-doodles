<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№50 · Mandelbulb Orbit</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// No50 Mandelbulb Orbit (after darien.brito, prompt 15 via Bug).
// A power-8 Mandelbulb, sphere-traced on the CPU over a coarse
// grid (the prompt's own fallback route, so the piece runs the
// same in the QA harness and on any device without WebGL). Bone
// shading from a fixed light, one cyan rim where the surface
// turns away. The camera rides a closed 30 second orbit; drag
// tilts the orbit plane and dollies, easing back on release.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '50', 10) || 50;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
const LOOP = 30;
let dragTilt = 0, dragDist = 0, easeTilt = 0, easeDist = 0, dragging = false, lastP = null;

function bulbDE(px, py, pz){
  let zx = px, zy = py, zz = pz, dr = 1, r = 0;
  for (let i = 0; i < 8; i++){
    r = Math.sqrt(zx * zx + zy * zy + zz * zz);
    if (r > 2) break;
    const theta = Math.acos(Math.max(-1, Math.min(1, zz / (r || 1e-9)))) * 8;
    const phi = Math.atan2(zy, zx) * 8;
    dr = Math.pow(r, 7) * 8 * dr + 1;
    const zr = Math.pow(r, 8);
    const st = Math.sin(theta);
    zx = zr * st * Math.cos(phi) + px;
    zy = zr * st * Math.sin(phi) + py;
    zz = zr * Math.cos(theta) + pz;
  }
  return r > 0 ? 0.5 * Math.log(r) * r / dr : 0;
}
function trace(ro, rd){
  let t = 0.9;
  for (let s = 0; s < 42; s++){
    const d = bulbDE(ro[0] + rd[0] * t, ro[1] + rd[1] * t, ro[2] + rd[2] * t);
    if (d < 0.004) return t;
    t += Math.max(d * 0.9, 0.01);
    if (t > 5.5) return -1;
  }
  return -1;
}
function drawFrame(nowMs){
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
  const t = (nowMs / 1000) % LOOP;
  easeTilt *= 0.97; easeDist *= 0.97;
  const tilt = 0.55 + dragTilt + easeTilt;
  const dist = 2.30 + dragDist + easeDist;
  const ang = (t / LOOP) * Math.PI * 2;
  const cam = [Math.cos(ang) * Math.cos(tilt) * dist, Math.sin(tilt) * dist * 0.8 + 0.35, Math.sin(ang) * Math.cos(tilt) * dist];
  let fw = [-cam[0], -cam[1], -cam[2]];
  const fl = Math.hypot(fw[0], fw[1], fw[2]); fw = fw.map(v => v / fl);
  let rt = [fw[2], 0, -fw[0]]; const rl = Math.hypot(rt[0], rt[1], rt[2]) || 1; rt = rt.map(v => v / rl);
  const up = [rt[1] * fw[2] - rt[2] * fw[1], rt[2] * fw[0] - rt[0] * fw[2], rt[0] * fw[1] - rt[1] * fw[0]];
  let rx, ry, rw, rh;
  if (isPhone()){ rw = w; rh = h; rx = 0; ry = 0; }
  else { const s = Math.min(w, h); rw = s; rh = s; rx = (w - s) / 2; ry = (h - s) / 2; }
  const cell = Math.max(rw, rh) / 150;
  const GNX = Math.max(32, Math.round(rw / cell)), GNY = Math.max(32, Math.round(rh / cell));
  const cw = rw / GNX, ch = rh / GNY;
  const depth = new Float32Array(GNX * GNY).fill(-1);
  const fov = 0.62, aspect = rw / rh;
  for (let gy = 0; gy < GNY; gy++) for (let gx = 0; gx < GNX; gx++){
    const u = ((gx / (GNX - 1)) * 2 - 1) * aspect, v = 1 - (gy / (GNY - 1)) * 2;
    let rd = [fw[0] + (rt[0] * u + up[0] * v) * fov, fw[1] + (rt[1] * u + up[1] * v) * fov, fw[2] + (rt[2] * u + up[2] * v) * fov];
    const l = Math.hypot(rd[0], rd[1], rd[2]); rd = rd.map(q => q / l);
    depth[gy * GNX + gx] = trace(cam, rd);
  }
  const light = [0.5, 0.75, 0.42];
  for (let gy = 0; gy < GNY; gy++) for (let gx = 0; gx < GNX; gx++){
    const d = depth[gy * GNX + gx];
    if (d < 0) continue;
    const dx = (depth[gy * GNX + Math.min(GNX - 1, gx + 1)] - depth[gy * GNX + Math.max(0, gx - 1)]) || 0;
    const dy = (depth[Math.min(GNY - 1, gy + 1) * GNX + gx] - depth[Math.max(0, gy - 1) * GNX + gx]) || 0;
    let nx = -dx * GNX * 0.10, ny = dy * GNY * 0.10, nz = 1;
    const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
    const diff = Math.max(0, nx * light[0] + ny * light[1] + nz * light[2]);
    const rim = Math.pow(1 - Math.abs(nz), 3);
    const shade = 0.16 + diff * 0.95;
    let rC = 232 * shade, gC = 228 * shade, bC = 216 * shade;
    if (rim > 0.42){ const k = Math.min(1, (rim - 0.42) * 2.4); rC = rC * (1 - k) + 61 * k; gC = gC * (1 - k) + 214 * k; bC = bC * (1 - k) + 232 * k; }
    ctx.fillStyle = 'rgb(' + Math.round(rC) + ',' + Math.round(gC) + ',' + Math.round(bC) + ')';
    ctx.fillRect(rx + gx * cw - 0.5, ry + gy * ch - 0.5, cw + 1, ch + 1);
  }
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); }
drawFrame(8000);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown', ev => { dragging = true; lastP = { x: ev.clientX, y: ev.clientY }; });
canvas.addEventListener('pointermove', ev => {
  if (!dragging || !lastP) return;
  dragTilt = Math.max(-0.5, Math.min(0.6, dragTilt + (ev.clientY - lastP.y) * 0.002));
  dragDist = Math.max(-0.7, Math.min(0.9, dragDist + (ev.clientX - lastP.x) * 0.0016));
  lastP = { x: ev.clientX, y: ev.clientY };
});
function endDrag(){ if (dragging){ easeTilt = dragTilt; easeDist = dragDist; dragTilt = 0; dragDist = 0; } dragging = false; lastP = null; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
