<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Hill</title>
<style>
  html, body { margin: 0; padding: 0; background: #101014; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32, fixed seed) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(524063);

  // ---------- palette ----------
  var SKY = '#101014', HILL = '#1E6E46', DRED = '#E6392B', DYEL = '#F2B705',
      LANT = '#FF4E3B', DOME = '#F7F2E4', TRED = '#C8352A', LEAF = '#2E9E57',
      STAR = '#F7F2E4';

  // ---------- precomputed scene data (all seeded, static) ----------
  // stars
  var stars = [];
  for (var i = 0; i < 150; i++) {
    stars.push({ x: rng(), y: rng() * 0.52, r: 0.8 + rng() * 1.9, ph: rng() * Math.PI * 2, sp: 0.6 + rng() * 1.4 });
  }
  // grain specks (short strokes over the whole stage)
  var grain = [];
  for (var g = 0; g < 620; g++) {
    grain.push({ x: rng(), y: rng(), a: rng() * Math.PI, l: 2 + rng() * 4, dark: rng() < 0.5, al: 0.03 + rng() * 0.06 });
  }
  // lanterns along the string
  var NL = 11;
  var lanterns = [];
  for (var li = 0; li < NL; li++) {
    lanterns.push({ u: 0.06 + 0.88 * (li / (NL - 1)), ph: rng() * Math.PI * 2, drop: 0.030 + rng() * 0.012, sz: 0.016 + rng() * 0.005 });
  }
  // dancers: parametric glyphs, 3 pose keyframes each
  // limb direction = (sin a, cos a): a=0 points down, a=+/-PI points up
  var POSES = [
    { aL: -2.50, aR: 2.50, lL: -0.35, lR: 0.35, lean: 0.05, hop: 0.006 },
    { aL: -2.90, aR: 1.35, lL: 0.50, lR: -0.15, lean: -0.06, hop: 0.000 },
    { aL: -1.50, aR: 1.55, lL: -0.60, lR: 0.10, lean: 0.08, hop: 0.003 }
  ];
  var ND = 17;
  var dancers = [];
  for (var di = 0; di < ND; di++) {
    var dx = 0.19 + 0.60 * (di / (ND - 1)) + (rng() - 0.5) * 0.04;
    if (dx < 0.17) dx = 0.17; if (dx > 0.80) dx = 0.80;
    dancers.push({
      x: dx,
      row: rng(),                       // 0 back (small) .. 1 front (large)
      col: (di % 2 === 0) ? DRED : DYEL,
      cyc: 1.1 + rng() * 0.9,           // pose cycle seconds
      off: rng() * 3,                   // pose phase offset
      ph: rng() * Math.PI * 2
    });
  }
  dancers.sort(function (a, b) { return a.row - b.row; });

  function hillY(x) { // stage-unit y of the hill surface
    return 0.545 + 0.115 * x + 0.028 * Math.sin(x * 2.4 + 0.4);
  }

  // ---------- viewport / stage ----------
  var W = 0, H = 0, SX = 0, SY = 0, SS = 0; // stage origin + size (square)
  var isPhone = false;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SS = Math.min(w, h);
    SX = (w - SS) / 2; SY = (h - SS) / 2;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || h > w * 1.15;
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- wind (drag breeze) ----------
  var wind = 0, dragging = false, lastPX = null, lastPT = 0;
  function pdown(e) { dragging = true; lastPX = e.clientX; lastPT = performance.now(); }
  function pmove(e) {
    if (!dragging || lastPX === null) return;
    var now = performance.now(), dt = Math.max(1, now - lastPT);
    var v = (e.clientX - lastPX) / dt; // px per ms
    wind += v * 1.4;
    if (wind > 2.4) wind = 2.4; if (wind < -2.4) wind = -2.4;
    lastPX = e.clientX; lastPT = now;
  }
  function pup() { dragging = false; lastPX = null; }
  canvas.addEventListener('pointerdown', pdown);
  canvas.addEventListener('pointermove', pmove);
  window.addEventListener('pointerup', pup);
  canvas.addEventListener('touchstart', function (e) { if (e.touches[0]) pdown(e.touches[0]); }, { passive: true });
  canvas.addEventListener('touchmove', function (e) { if (e.touches[0]) pmove(e.touches[0]); }, { passive: true });
  window.addEventListener('touchend', pup);

  // ---------- drawing helpers (stage units: u = SS pixels) ----------
  function X(u) { return SX + u * SS; }
  function Y(u) { return SY + u * SS; }
  function line(x1, y1, x2, y2, wdt, col) {
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
  }
  function circ(x, y, r, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(X(x), Y(y), r * SS, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function lerp(a, b, k) { return a + (b - a) * k; }

  function drawDancer(d, t) {
    var surfY = hillY(d.x);
    var depth = 0.25 + 0.75 * d.row;              // back rows higher & smaller
    var baseY = surfY + 0.02 + d.row * (0.97 - surfY - 0.05);
    var s = 0.066 * (0.55 + 0.80 * d.row);         // glyph height in stage units
    // pose interpolation across 3 keyframes
    var ph = ((t / d.cyc) + d.off) % 3;
    var i0 = Math.floor(ph), fr = ph - i0;
    var sm = fr * fr * (3 - 2 * fr);
    var A = POSES[i0], B = POSES[(i0 + 1) % 3];
    var lean = lerp(A.lean, B.lean, sm) + wind * 0.16 + Math.sin(t * 1.3 + d.ph) * 0.02;
    var hop = lerp(A.hop, B.hop, sm) * SS / SS;   // stage units already
    var aL = lerp(A.aL, B.aL, sm), aR = lerp(A.aR, B.aR, sm);
    var lL = lerp(A.lL, B.lL, sm), lR = lerp(A.lR, B.lR, sm);
    var fx = d.x, fy = baseY - hop;
    var hipY = fy - s * 0.46, shY = fy - s * 0.82;
    var leanDx = Math.sin(lean) * s;
    var hipX = fx + leanDx * 0.4, shX = fx + leanDx;
    var lw = 0.0075 * (0.7 + 0.5 * d.row);
    // legs: foot = hip + rotated (0, legLen); angles measured from straight down
    var legLen = s * 0.46;
    ctx.strokeStyle = d.col; ctx.lineWidth = lw * SS; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(X(hipX), Y(hipY));
    ctx.lineTo(X(hipX + Math.sin(lL) * legLen), Y(hipY + Math.cos(lL) * legLen));
    ctx.moveTo(X(hipX), Y(hipY));
    ctx.lineTo(X(hipX + Math.sin(lR) * legLen), Y(hipY + Math.cos(lR) * legLen));
    ctx.stroke();
    // torso
    line(hipX, hipY, shX, shY, lw * 1.25, d.col);
    // arms (from shoulder, angles from straight up-ish spread)
    var armLen = s * 0.40;
    ctx.beginPath();
    ctx.moveTo(X(shX), Y(shY));
    ctx.lineTo(X(shX + Math.sin(aL) * armLen), Y(shY + Math.cos(aL) * armLen));
    ctx.moveTo(X(shX), Y(shY));
    ctx.lineTo(X(shX + Math.sin(aR) * armLen), Y(shY + Math.cos(aR) * armLen));
    ctx.stroke();
    // head
    circ(shX + leanDx * 0.25, shY - s * 0.14, s * 0.125, d.col);
  }

  function draw(t) {
    // pin canvas css size every frame (house rule)
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // page ground
    ctx.fillStyle = SKY; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath(); ctx.rect(SX, SY, SS, SS); ctx.clip();

    // stars (twinkle)
    for (var si = 0; si < stars.length; si++) {
      var st = stars[si];
      var tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * st.sp + st.ph));
      circ(st.x, st.y, st.r / 1080, STAR, tw);
      if (st.r > 2.1) { // cross sparkle on the biggest stars
        line(st.x - 0.006, st.y, st.x + 0.006, st.y, 0.0012, STAR);
        line(st.x, st.y - 0.006, st.x, st.y + 0.006, 0.0012, STAR);
      }
    }

    // lantern string: catenary-ish arc across the top third
    function stringY(u) { return 0.085 + 0.10 * Math.pow((u - 0.5) * 2, 2) + 0.015 * u; }
    ctx.strokeStyle = 'rgba(247,242,228,0.35)'; ctx.lineWidth = Math.max(1, 0.0016 * SS); ctx.lineCap = 'round';
    ctx.beginPath();
    for (var su = 0; su <= 1.0001; su += 0.05) {
      var px = X(su), py = Y(stringY(su));
      if (su === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    var swayAmp = 1 + Math.min(2.2, Math.abs(wind)) * 1.1;
    for (var li2 = 0; li2 < lanterns.length; li2++) {
      var L = lanterns[li2];
      var anchorY = stringY(L.u);
      var ang = (Math.sin(t * 0.9 + L.ph) * 0.10 + wind * 0.22) * swayAmp;
      var lx = L.u + Math.sin(ang) * L.drop, ly = anchorY + Math.cos(ang) * L.drop;
      line(L.u, anchorY, lx, ly, 0.0016, 'rgba(247,242,228,0.5)');
      // glow: layered translucent circles (flat, no gradient tool)
      circ(lx, ly + L.sz * 0.9, L.sz * 2.6, LANT, 0.05);
      circ(lx, ly + L.sz * 0.9, L.sz * 1.8, LANT, 0.09);
      circ(lx, ly + L.sz * 0.9, L.sz * 1.25, LANT, 0.16);
      // lantern body
      ctx.fillStyle = LANT;
      ctx.beginPath();
      ctx.ellipse(X(lx), Y(ly + L.sz * 0.9), L.sz * 0.82 * SS, L.sz * SS, 0, 0, Math.PI * 2);
      ctx.fill();
      line(lx - L.sz * 0.45, ly + L.sz * 0.12, lx + L.sz * 0.45, ly + L.sz * 0.12, 0.0022, '#101014');
    }

    // hill
    ctx.fillStyle = HILL;
    ctx.beginPath();
    ctx.moveTo(X(0), Y(hillY(0)));
    for (var hx = 0; hx <= 1.0001; hx += 0.04) ctx.lineTo(X(hx), Y(hillY(hx)));
    ctx.lineTo(X(1), Y(1)); ctx.lineTo(X(0), Y(1)); ctx.closePath(); ctx.fill();

    // dome at the hill's left edge
    var domeX = 0.085, domeBase = hillY(0.085) + 0.035, domeR = 0.052;
    ctx.fillStyle = DOME;
    ctx.beginPath(); ctx.arc(X(domeX), Y(domeBase), domeR * SS, Math.PI, 0); ctx.fill();
    ctx.fillRect(X(domeX - domeR), Y(domeBase) - 1, domeR * 2 * SS, 0.012 * SS);
    // cupola
    ctx.fillStyle = TRED;
    ctx.beginPath(); ctx.arc(X(domeX), Y(domeBase - domeR - 0.004), 0.016 * SS, Math.PI, 0); ctx.fill();
    ctx.fillRect(X(domeX - 0.016), Y(domeBase - domeR - 0.004) - 1, 0.032 * SS, 0.008 * SS);
    circ(domeX, domeBase - domeR - 0.026, 0.005, TRED);
    line(domeX, domeBase - domeR - 0.020, domeX, domeBase - domeR - 0.031, 0.002, TRED);
    // dome door
    ctx.fillStyle = SKY;
    ctx.beginPath(); ctx.arc(X(domeX), Y(domeBase + 0.012), 0.011 * SS, Math.PI, 0); ctx.fill();
    ctx.fillRect(X(domeX - 0.011), Y(domeBase + 0.012) - 1, 0.022 * SS, 0.012 * SS);

    // dancers (back to front)
    for (var di2 = 0; di2 < dancers.length; di2++) drawDancer(dancers[di2], t);

    // foreground tree, bottom-right: red trunk + green fringe
    var tx = 0.885, tBase = 1.0, tTop = 0.70;
    ctx.strokeStyle = TRED; ctx.lineCap = 'round';
    ctx.lineWidth = 0.016 * SS;
    ctx.beginPath(); ctx.moveTo(X(tx), Y(tBase));
    ctx.quadraticCurveTo(X(tx + 0.012), Y(0.86), X(tx - 0.006), Y(tTop));
    ctx.stroke();
    ctx.lineWidth = 0.009 * SS;
    ctx.beginPath(); ctx.moveTo(X(tx - 0.002), Y(0.80)); ctx.quadraticCurveTo(X(tx - 0.035), Y(0.76), X(tx - 0.052), Y(0.715)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(tx - 0.004), Y(0.845)); ctx.quadraticCurveTo(X(tx + 0.034), Y(0.815), X(tx + 0.05), Y(0.775)); ctx.stroke();
    // fringe branches: hanging green strokes over the crown
    var fringeSeed = mulberry32(9241);
    ctx.strokeStyle = LEAF; ctx.lineWidth = 0.0045 * SS;
    for (var fi = 0; fi < 48; fi++) {
      var fa = fringeSeed() * Math.PI * 2, fr2 = fringeSeed();
      var cx = tx - 0.006 + Math.cos(fa) * 0.075 * fr2;
      var cy = tTop + Math.sin(fa) * 0.045 * fr2 - 0.01;
      var sway = Math.sin(t * 1.1 + fi) * 0.0022 * (1 + Math.abs(wind));
      ctx.beginPath();
      ctx.moveTo(X(cx), Y(cy));
      ctx.quadraticCurveTo(X(cx + sway), Y(cy + 0.030), X(cx + sway * 1.6 + (fringeSeed() - 0.5) * 0.006), Y(cy + 0.052 + fringeSeed() * 0.02));
      ctx.stroke();
    }
    circ(tx - 0.006, tTop - 0.01, 0.030, LEAF, 0.25);

    // grain specks (precomputed, drawn directly)
    for (var gi = 0; gi < grain.length; gi++) {
      var gr = grain[gi];
      ctx.strokeStyle = gr.dark ? 'rgba(0,0,0,' + gr.al + ')' : 'rgba(255,255,255,' + gr.al + ')';
      ctx.lineWidth = Math.max(1, 0.0013 * SS);
      ctx.beginPath();
      ctx.moveTo(X(gr.x), Y(gr.y));
      ctx.lineTo(X(gr.x + Math.cos(gr.a) * gr.l / 1080), Y(gr.y + Math.sin(gr.a) * gr.l / 1080));
      ctx.stroke();
    }

    // hint
    ctx.fillStyle = 'rgba(247,242,228,0.42)';
    ctx.font = (0.020 * SS) + 'px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag', X(0.022), Y(0.972));

    ctx.restore();

    // wind decay
    wind *= Math.pow(0.35, 1 / 60); // per-frame-ish decay applied in draw; dt-independent enough for a breeze
  }

  // ---------- deterministic first frame + loop ----------
  var PHASE0 = 2.4; // constant loop phase for frame one
  draw(PHASE0);
  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    draw(PHASE0 + (now - startStamp) / 1000);
    window.requestAnimationFrame(frame);
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
