<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corner Play</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #F5F3EF;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Strict palette. Nothing else is ever drawn.
  var FACE = [220, 216, 206];    // #DCD8CE near-white face field
  var GOLD = [216, 168, 72];     // #D8A848 seam gold
  var VIOLET = [110, 99, 152];   // #6E6398 seam violet
  var VOID = [245, 243, 239];    // #F5F3EF gallery void

  var ORBIT = 180; // 3-minute light orbit, seconds

  function cl(v) { return Math.max(0, Math.min(255, Math.round(v))); }
  function rgba(c, a) {
    return 'rgba(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ',' + a + ')';
  }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function mix(c1, c2, u) {
    return [lerp(c1[0], c2[0], u), lerp(c1[1], c2[1], u), lerp(c1[2], c2[2], u)];
  }

  // ---- Drag state: recorded samples only. The azimuth offset at time t is
  // a closed-form function of this log, so any frame can be recomputed.
  // Each entry: { t0, t1 (null while dragging), off } where off is the
  // azimuth offset in units of seam-length fraction (-1..1).
  var dragLog = [];
  var dragNow = null; // { startT, startX, off }

  function azimuthOffset(t) {
    var off = 0;
    for (var i = 0; i < dragLog.length; i++) {
      var d = dragLog[i];
      if (t < d.t0) break;
      if (d.t1 === null || t <= d.t1) {
        off = d.off;
      } else {
        // Released: ease back to the orbit over ~2.5 s (exponential).
        off = d.off * Math.exp(-(t - d.t1) / 2.5);
      }
    }
    return off;
  }

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  // Draw one seam from A to B as layered segments. intensityAt(s) returns
  // 0..1 brightness along the seam; colorAt(s) its RGB. Three passes:
  // wide faint halo, mid glow, thin core. Studio scale, no bloom blowout.
  function drawSeam(A, B, t, strength, hotspotS, isMain) {
    var SEG = 72;
    var unit = Math.min(W, H);
    var widths = [unit * 0.016, unit * 0.007, unit * 0.0028];
    var alphas = [0.12, 0.26, 0.85];
    for (var pass = 0; pass < 3; pass++) {
      ctx.lineWidth = Math.max(0.6, widths[pass]);
      ctx.lineCap = 'round';
      for (var i = 0; i < SEG; i++) {
        var s0 = i / SEG, s1 = (i + 1) / SEG, sm = (s0 + s1) / 2;
        // Base profile: brightest near the corner (s=0), falling to the far
        // end; the traveling hotspot adds a gaussian gold peak.
        var base = Math.pow(1 - sm, 1.35);
        var g = Math.exp(-Math.pow((sm - hotspotS) / 0.13, 2));
        var inten = Math.min(1, (0.34 * base + 1.0 * g + 0.20) * strength);
        // Color: violet at the far ends, gold where the light lives.
        var goldMix = Math.min(1, 0.45 * base + 1.15 * g + (isMain ? 0.10 : 0.0));
        var col = mix(VIOLET, GOLD, Math.max(0, goldMix));
        ctx.strokeStyle = rgba(col, alphas[pass] * inten + (pass === 2 ? 0.05 * strength : 0));
        ctx.beginPath();
        ctx.moveTo(lerp(A[0], B[0], s0), lerp(A[1], B[1], s0));
        ctx.lineTo(lerp(A[0], B[0], s1), lerp(A[1], B[1], s1));
        ctx.stroke();
      }
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var phase = (t % ORBIT) / ORBIT; // 0..1 around the orbit
    var ang = phase * Math.PI * 2;

    // Void ground.
    ctx.fillStyle = rgba(VOID, 1);
    ctx.fillRect(0, 0, W, H);

    // Corner point at the lower-right golden point; seams run from it to
    // three frame edges. The corner never moves; only the light does.
    var C = [0.62 * W, 0.68 * H];
    var P1 = [0, 0];               // main seam: the long diagonal, up-left
    var P2 = [W, 0.18 * H];        // secondary seam: right edge
    var P3 = [0.18 * W, H];        // secondary seam: bottom edge

    var faces = [
      [C, P1, [W, 0], P2],         // top / right face
      [C, P2, [W, H], P3],         // lower right face
      [C, P3, [0, H], P1]          // left face
    ];
    // Faint interference tint per face: a whisper of gold or violet laid
    // over the face field, cycling on its own slow phase. Plus a fixed
    // per-face lightness step (void overlay) so the three planes separate.
    var faceLight = [0.30, 0.10, 0.18];
    for (var f = 0; f < 3; f++) {
      poly(faces[f]);
      ctx.fillStyle = rgba(FACE, 1);
      ctx.fill();
      poly(faces[f]);
      ctx.fillStyle = rgba(VOID, faceLight[f]);
      ctx.fill();
      var tintPhase = 0.5 + 0.5 * Math.sin(ang + f * 2.1);
      var tintCol = f === 1 ? VIOLET : GOLD;
      poly(faces[f]);
      ctx.fillStyle = rgba(tintCol, 0.028 + 0.030 * tintPhase);
      ctx.fill();
    }

    // Light state: the hotspot rides the main seam out and back once per
    // orbit (s=0 at the corner at t=0), and the whole seam ignites and
    // dims on the same cycle.
    var az = azimuthOffset(t);
    var hsBase = 0.5 - 0.5 * Math.cos(ang); // 0 at t=0, 1 at mid-orbit
    var hsMain = Math.max(0, Math.min(1, hsBase + az * 0.35));
    var ignite = 0.78 + 0.22 * Math.sin(ang - Math.PI / 2 + 0.6);

    // Secondary seams first (dimmer echoes), main seam last, on top.
    drawSeam(C, P2, t, 0.42 * ignite, Math.max(0, Math.min(1, hsBase * 0.8 + az * 0.2)), false);
    drawSeam(C, P3, t, 0.36 * ignite, Math.max(0, Math.min(1, hsBase * 0.7 + az * 0.2)), false);
    drawSeam(C, P1, t, 1.0 * ignite, hsMain, true);

    // The corner point itself: a small knot of gold where the panes meet,
    // swelling as the hotspot passes through it.
    var knot = Math.exp(-Math.pow(hsMain / 0.16, 2));
    var r = Math.min(W, H) * 0.012;
    for (var k = 3; k >= 1; k--) {
      ctx.beginPath();
      ctx.arc(C[0], C[1], r * k, 0, Math.PI * 2);
      ctx.fillStyle = rgba(GOLD, 0.05 + 0.10 * knot);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(C[0], C[1], r * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = rgba(GOLD, 0.35 + 0.45 * knot);
    ctx.fill();

    if (document.body && document.body.style) document.body.style.background = rgba(VOID, 1);
  }

  // ---- Interaction: drag shifts the light azimuth. Recorded, never a
  // reload, and the corner itself is never touched.
  var clockStart = null;
  function nowSec() {
    if (typeof performance !== 'undefined' && performance.now) {
      var ms = performance.now();
      if (clockStart === null) clockStart = ms;
      return (ms - clockStart) / 1000;
    }
    return 0;
  }

  function px(ev) {
    if (ev.touches && ev.touches.length) return ev.touches[0].clientX;
    return ev.clientX;
  }

  function onDown(ev) {
    dragNow = { startT: nowSec(), startX: px(ev), off: 0 };
    dragLog.push({ t0: dragNow.startT, t1: null, off: 0 });
  }
  function onMove(ev) {
    if (!dragNow) return;
    var dx = px(ev) - dragNow.startX;
    var off = Math.max(-1, Math.min(1, dx / (W * 0.45)));
    dragLog[dragLog.length - 1].off = off;
  }
  function onUp() {
    if (!dragNow) return;
    dragLog[dragLog.length - 1].t1 = nowSec();
    dragNow = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    canvas.addEventListener('touchmove', onMove, { passive: true });
    canvas.addEventListener('touchend', onUp);
  }

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(0); });
  }
  window.addEventListener('resize', function () { resize(); draw(0); });

  // Frame one: the synchronous draw at orbit t = 0. Hotspot at the corner,
  // faces pale, seams lit but restrained.
  draw(0);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts;
      draw((ts - t0) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
