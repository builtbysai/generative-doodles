<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the Stage Props Do at Night</title>
<style>
  html, body { margin: 0; padding: 0; background: #09090B; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (strict) ----------
  var STAGE = '#09090B';
  var CUBE = '#EDEFF2';
  var GLOW = '#7FD4FF';
  var PULSE = '#FFFFFF';
  var DANCER = '#0B0C0E';
  var TRAIL = '#FFFFFF';

  // ---------- constants ----------
  var BASE_SEED = 1038199;
  var LOOP = 60;               // the whole dance repeats every 60 s
  var T0 = 15;                 // frame one: fixed phase, seconds into the loop
  var STAGE_W = 100;           // stage width in units, mapped to canvas width
  var CUBE_U = 6.5;            // cube edge, stage units
  var SPEED = 7;               // machined travel speed, units per second
  var MIN_TRANSIT = 0.55;      // shortest transit, seconds (even a nudge is deliberate)
  var DANCER_CYCLE = 48;       // full there-and-back walk; divides nothing, wraps clean
  var DANCER_PHI = -0.5;       // tuned: at t = 15 the dancer is at x = 60, mid-stage

  var seed = BASE_SEED;
  var pieceTime = T0;
  var booted = false;

  // ---------- the choreography ----------
  // Formations are mark sets: one {x, lv} per cube. lv 1 = stacked on the
  // cube below. Slots switch hard at their start times; between switches the
  // cubes dwell exactly on their marks. The last slot returns to LINE so the
  // 60 s loop closes on itself.
  var FORMATIONS = [
    { name: 'LINE', start: 0, marks: [
      { x: 10, lv: 0 }, { x: 23, lv: 0 }, { x: 36, lv: 0 }, { x: 49, lv: 0 },
      { x: 62, lv: 0 }, { x: 75, lv: 0 }, { x: 88, lv: 0 } ] },
    { name: 'PAIRS + STACK', start: 13.5, marks: [
      { x: 14, lv: 0 }, { x: 21, lv: 0 }, { x: 38, lv: 0 }, { x: 45, lv: 0 },
      { x: 62, lv: 0 }, { x: 69, lv: 0 }, { x: 69, lv: 1 } ] },
    { name: 'SCATTER', start: 23.5, marks: [
      { x: 8, lv: 0 }, { x: 19, lv: 0 }, { x: 31, lv: 0 }, { x: 46, lv: 0 },
      { x: 58, lv: 0 }, { x: 76, lv: 0 }, { x: 92, lv: 0 } ] },
    { name: 'WALL', start: 33.5, marks: [
      { x: 10, lv: 0 }, { x: 17, lv: 0 }, { x: 24, lv: 0 }, { x: 31, lv: 0 },
      { x: 38, lv: 0 }, { x: 45, lv: 0 }, { x: 52, lv: 0 } ] },
    { name: 'SPREAD', start: 43.5, marks: [
      { x: 8, lv: 0 }, { x: 20, lv: 0 }, { x: 34, lv: 0 }, { x: 50, lv: 0 },
      { x: 68, lv: 0 }, { x: 84, lv: 0 }, { x: 94, lv: 0 } ] },
    { name: 'LINE (return)', start: 53.5, marks: [
      { x: 10, lv: 0 }, { x: 23, lv: 0 }, { x: 36, lv: 0 }, { x: 49, lv: 0 },
      { x: 62, lv: 0 }, { x: 75, lv: 0 }, { x: 88, lv: 0 } ] }
  ];

  // Per cube, a segment list built from the formations:
  // { t0, t1, x0, lv0, x1, lv1 } travel at constant velocity, then dwell.
  var cubes = [];              // { segs: [...], arrivals: [loop times] }
  var dancerPhi = DANCER_PHI;

  function build(s) {
    var rng = mulberry32(s);
    var canonical = (s === BASE_SEED);
    // jittered copies of the formations for reseeds; canonical stays exact
    var forms = [];
    for (var f = 0; f < FORMATIONS.length; f++) {
      var marks = [];
      for (var i = 0; i < FORMATIONS[f].marks.length; i++) {
        var m = FORMATIONS[f].marks[i];
        var jx = canonical ? 0 : (rng() * 5 - 2.5);
        marks.push({ x: Math.max(4, Math.min(96, m.x + jx)), lv: m.lv });
      }
      forms.push({ name: FORMATIONS[f].name, start: FORMATIONS[f].start, marks: marks });
    }
    dancerPhi = canonical ? DANCER_PHI : rng() * DANCER_CYCLE;
    cubes = [];
    for (var c = 0; c < 7; c++) {
      var segs = [], arrivals = [];
      for (var k = 1; k < forms.length; k++) {
        var prev = forms[k - 1].marks[c], next = forms[k].marks[c];
        var dx = next.x - prev.x, dy = (next.lv - prev.lv) * CUBE_U;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var dur = dist < 0.01 ? 0 : Math.max(MIN_TRANSIT, dist / SPEED);
        segs.push({
          t0: forms[k].start, t1: forms[k].start + dur,
          x0: prev.x, lv0: prev.lv, x1: next.x, lv1: next.lv
        });
        if (dur > 0) arrivals.push(forms[k].start + dur);
      }
      cubes.push({ segs: segs, arrivals: arrivals, home: forms[0].marks[c] });
    }
    cueEvents = [];
    tapPulses = [];
  }

  function loopT(t) { return ((t % LOOP) + LOOP) % LOOP; }

  // Closed-form cube position at loop time lt: dwell or constant-velocity leg.
  function cubePos(c, lt) {
    var cube = cubes[c];
    var pos = { x: cube.home.x, lv: cube.home.lv, moving: false };
    for (var i = 0; i < cube.segs.length; i++) {
      var sg = cube.segs[i];
      if (lt < sg.t0) break;
      if (lt <= sg.t1 && sg.t1 > sg.t0) {
        var u = (lt - sg.t0) / (sg.t1 - sg.t0);
        pos = { x: sg.x0 + (sg.x1 - sg.x0) * u, lv: sg.lv0 + (sg.lv1 - sg.lv0) * u, moving: u < 1 };
      } else {
        pos = { x: sg.x1, lv: sg.lv1, moving: false };
      }
    }
    return pos;
  }

  // Arrival pulse envelope: bright at the mark, decaying over ~3 s.
  function arrivalPulse(c, lt) {
    var arr = cubes[c].arrivals, best = 0;
    for (var i = 0; i < arr.length; i++) {
      var age = ((lt - arr[i]) % LOOP + LOOP) % LOOP;
      if (age < 4) {
        var e = Math.exp(-age * 1.05);
        if (e > best) best = e;
      }
    }
    return best;
  }

  // ---------- recorded interaction (closed form over the event list) ----------
  // A cue event: { t, x, offs: [offset per cube at t], tgts: [target offset] }.
  // Between events each offset runs toward its target at SPEED and stops dead.
  var cueEvents = [];
  var tapPulses = [];          // { c, t } forced arrival pulses

  function offsetsAt(t) {
    var offs = [0, 0, 0, 0, 0, 0, 0];
    var ev = null;
    for (var i = 0; i < cueEvents.length; i++) {
      if (cueEvents[i].t <= t) ev = cueEvents[i]; else break;
    }
    if (!ev) return offs;
    var dt = t - ev.t;
    for (var c = 0; c < 7; c++) {
      var o0 = ev.offs[c], tg = ev.tgts[c];
      var step = SPEED * dt;
      if (Math.abs(tg - o0) <= step) offs[c] = tg;
      else offs[c] = o0 + Math.sign(tg - o0) * step;
    }
    return offs;
  }

  function pushCue(t, cueX, release) {
    var cur = offsetsAt(t);
    var tgts = [0, 0, 0, 0, 0, 0, 0];
    if (!release && cueX !== null) {
      var lt = loopT(t);
      for (var c = 0; c < 7; c++) {
        var base = cubePos(c, lt).x + cur[c];
        if (Math.abs(base - cueX) < 30) {
          tgts[c] = Math.max(-16, Math.min(16, cueX - cubePos(c, lt).x));
        }
      }
    }
    cueEvents.push({ t: t, x: cueX, offs: cur, tgts: tgts });
    if (cueEvents.length > 400) cueEvents.splice(0, cueEvents.length - 400);
  }

  function tapPulseAt(c, t) {
    var best = 0;
    for (var i = 0; i < tapPulses.length; i++) {
      if (tapPulses[i].c !== c) continue;
      var age = t - tapPulses[i].t;
      if (age >= 0 && age < 4) {
        var e = Math.exp(-age * 1.05);
        if (e > best) best = e;
      }
    }
    return best;
  }

  // ---------- the dancer (the guest) ----------
  function dancerState(t) {
    var te = t + dancerPhi;
    var u = ((te % DANCER_CYCLE) + DANCER_CYCLE) % DANCER_CYCLE;
    var half = DANCER_CYCLE / 2;
    if (u < half) return { x: 2 + 4 * u, dir: 1 };
    return { x: 98 - 4 * (u - half), dir: -1 };
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function fit() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    if (vv && vv.width) { W = vv.width; H = vv.height; }
    else if (typeof window !== 'undefined' && window.innerWidth) { W = window.innerWidth; H = window.innerHeight; }
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (booted) draw();
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { fit(); });
    }
  }

  // ---------- audio (lazy, guarded; first gesture only) ----------
  var AC = null, glideOsc = null, glideGain = null;
  var lastThumpAt = 0, lastStepAt = 0;
  function audio() {
    if (AC) { if (AC.resume) { try { AC.resume(); } catch (e) {} } return AC; }
    var Ctor = null;
    if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
    else if (typeof window !== 'undefined' && window.webkitAudioContext) Ctor = window.webkitAudioContext;
    if (!Ctor) return null;
    try {
      AC = new Ctor();
      glideOsc = AC.createOscillator();
      glideOsc.type = 'triangle';
      glideOsc.frequency.value = 82;
      var lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 320;
      glideGain = AC.createGain();
      glideGain.gain.value = 0;
      glideOsc.connect(lp); lp.connect(glideGain); glideGain.connect(AC.destination);
      glideOsc.start();
    } catch (e) { AC = null; glideOsc = null; glideGain = null; }
    return AC;
  }
  function thumpSound() {
    if (!AC) return;
    try {
      var now = AC.currentTime;
      if (now - lastThumpAt < 0.07) return;
      lastThumpAt = now;
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(96, now);
      o.frequency.exponentialRampToValueAtTime(52, now + 0.11);
      g.gain.setValueAtTime(0.13, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
      o.connect(g); g.connect(AC.destination);
      o.start(now); o.stop(now + 0.16);
    } catch (e) {}
  }
  function stepSound() {
    if (!AC) return;
    try {
      var now = AC.currentTime;
      if (now - lastStepAt < 0.09) return;
      lastStepAt = now;
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle';
      o.frequency.value = 170;
      g.gain.setValueAtTime(0.010, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
      o.connect(g); g.connect(AC.destination);
      o.start(now); o.stop(now + 0.045);
    } catch (e) {}
  }
  var prevMoving = null, prevStepIdx = null;
  function audioFrame(speeds, dX) {
    if (!AC || !glideGain) return;
    try {
      var sum = 0, moving = [], i;
      for (i = 0; i < speeds.length; i++) { sum += speeds[i]; moving.push(speeds[i] > 0.01); }
      var norm = Math.min(1, sum / 22);
      glideGain.gain.setTargetAtTime(0.006 + 0.038 * norm, AC.currentTime, 0.12);
      if (glideOsc) glideOsc.frequency.setTargetAtTime(74 + 42 * norm, AC.currentTime, 0.12);
      if (prevMoving) {
        for (i = 0; i < moving.length; i++) {
          if (prevMoving[i] && !moving[i]) thumpSound(); // a hard stop is an arrival
        }
      }
      prevMoving = moving;
      var idx = Math.floor((dX * 0.55 + 1.4) / Math.PI);
      if (prevStepIdx !== null && idx !== prevStepIdx) stepSound();
      prevStepIdx = idx;
    } catch (e) {}
  }

  // ---------- drawing ----------
  function drawGlow(cx, cy, s, pulse) {
    // layered flat alpha pools, never a gradient
    var layers = [
      { w: 1.65, h: 0.30, a: 0.10 },
      { w: 1.28, h: 0.22, a: 0.13 },
      { w: 0.95, h: 0.16, a: 0.12 }
    ];
    var i, L;
    ctx.fillStyle = GLOW;
    for (i = 0; i < layers.length; i++) {
      L = layers[i];
      ctx.globalAlpha = L.a;
      ctx.beginPath();
      ctx.ellipse(cx, cy, s * L.w / 2, s * L.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    if (pulse > 0.01) {
      ctx.fillStyle = PULSE;
      for (i = 0; i < layers.length; i++) {
        L = layers[i];
        ctx.globalAlpha = L.a * 2.4 * pulse;
        ctx.beginPath();
        ctx.ellipse(cx, cy, s * L.w / 2, s * L.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawCube(cx, bottom, s) {
    var x = cx - s / 2, y = bottom - s;
    ctx.fillStyle = CUBE;
    ctx.fillRect(x, y, s, s);
    // product finish in stage tone: a lid seam, a top face hint, the omni base
    ctx.fillStyle = STAGE;
    ctx.globalAlpha = 0.20;
    ctx.fillRect(x, y + s * 0.16, s, Math.max(1, s * 0.022));       // lid seam
    ctx.globalAlpha = 0.14;
    ctx.fillRect(x, y, s, s * 0.16);                                 // top face shade
    ctx.globalAlpha = 0.30;
    ctx.fillRect(x, bottom - s * 0.10, s, s * 0.10);                 // base band
    ctx.globalAlpha = 0.5;
    ctx.fillRect(x + s * 0.18, bottom - s * 0.045, s * 0.16, Math.max(1, s * 0.03));
    ctx.fillRect(x + s * 0.66, bottom - s * 0.045, s * 0.16, Math.max(1, s * 0.03));
    ctx.globalAlpha = 1;
  }

  function drawDancer(floorY, cubePx) {
    var d = dancerState(pieceTime);
    var ux = W / STAGE_W;
    var cx = d.x * ux;
    var hd = cubePx * 1.7;
    var y0 = floorY;
    var ph = d.x * 0.55 + 1.4; // step phase from distance walked
    var s = Math.sin(ph), co = Math.cos(ph);
    var hipX = cx, hipY = y0 - hd * 0.52;
    var shX = cx + d.dir * hd * 0.06, shY = y0 - hd * 0.84;
    ctx.strokeStyle = DANCER;
    ctx.fillStyle = DANCER;
    ctx.lineWidth = Math.max(1.6, hd * 0.05);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(cx + s * hd * 0.30, y0 - Math.max(0, co) * hd * 0.07);
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(cx - s * hd * 0.30, y0 - Math.max(0, -co) * hd * 0.07);
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(shX, shY);
    ctx.moveTo(shX, shY);
    ctx.lineTo(shX - s * hd * 0.22, y0 - hd * 0.55);
    ctx.moveTo(shX, shY);
    ctx.lineTo(shX + s * hd * 0.22, y0 - hd * 0.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + d.dir * hd * 0.09, y0 - hd * 0.95, hd * 0.085, 0, Math.PI * 2);
    ctx.fill();
    return d;
  }

  var lastSpeeds = null;

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = STAGE;
    ctx.fillRect(0, 0, W, H);
    var ux = W / STAGE_W;
    var cubePx = CUBE_U * ux;
    var floorY = H * 0.74;
    // the floor plane: a clean dark slab in the lower third
    ctx.fillStyle = DANCER;
    ctx.globalAlpha = 0.55;
    ctx.fillRect(0, floorY, W, H - floorY);
    ctx.globalAlpha = 1;
    ctx.fillStyle = CUBE;
    ctx.globalAlpha = 0.07;
    ctx.fillRect(0, floorY, W, 1);
    ctx.globalAlpha = 1;

    var lt = loopT(pieceTime);
    var offs = offsetsAt(pieceTime);
    var pos = [], c, i;
    for (c = 0; c < 7; c++) {
      var p = cubePos(c, lt);
      pos.push({ x: p.x + offs[c], lv: p.lv, moving: p.moving });
    }
    // path memory: the same closed form sampled at past times, drawn as
    // fading segments (a position buffer, never a canvas fade)
    ctx.strokeStyle = TRAIL;
    ctx.lineWidth = Math.max(1, cubePx * 0.05);
    for (c = 0; c < 7; c++) {
      ctx.globalAlpha = 0.06;
      ctx.beginPath();
      for (i = 0; i <= 9; i++) {
        var pt = cubePos(c, loopT(lt - i * 0.22));
        var px = (pt.x + offs[c]) * ux;
        var py = floorY - pt.lv * cubePx - cubePx / 2;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // underglow pools (for stacked cubes the pool stays on the floor)
    for (c = 0; c < 7; c++) {
      var pulse = Math.max(arrivalPulse(c, lt), tapPulseAt(c, pieceTime));
      drawGlow(pos[c].x * ux, floorY + cubePx * 0.10, cubePx, pulse);
    }
    // cubes: level 0 first, then the stacked cube
    for (c = 0; c < 7; c++) if (pos[c].lv < 0.5) drawCube(pos[c].x * ux, floorY - pos[c].lv * cubePx, cubePx);
    for (c = 0; c < 7; c++) if (pos[c].lv >= 0.5) drawCube(pos[c].x * ux, floorY - pos[c].lv * cubePx, cubePx);
    // the guest walks in front of the furniture, quiet and dark
    var d = drawDancer(floorY, cubePx);
    // speeds for the audio frame
    lastSpeeds = [];
    for (c = 0; c < 7; c++) {
      var a = cubePos(c, loopT(lt - 0.05)), b = cubePos(c, lt);
      lastSpeeds.push(Math.abs(b.x - a.x) / 0.05 + Math.abs(b.lv - a.lv) * CUBE_U / 0.05);
    }
    lastDancerX = d.x;
  }
  var lastDancerX = 0;

  // ---------- pointer interaction ----------
  var downInfo = null;
  var lastTapT = -10, lastTapCube = -2;

  function ptr(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function cubeAt(px, py) {
    var ux = W / STAGE_W;
    var cubePx = CUBE_U * ux;
    var floorY = H * 0.74;
    var lt = loopT(pieceTime);
    var offs = offsetsAt(pieceTime);
    for (var c = 6; c >= 0; c--) {
      var p = cubePos(c, lt);
      var cx = (p.x + offs[c]) * ux;
      var bottom = floorY - p.lv * cubePx;
      if (px >= cx - cubePx / 2 && px <= cx + cubePx / 2 && py >= bottom - cubePx && py <= bottom) return c;
    }
    return -1;
  }
  function onDown(e) {
    audio();
    var p = ptr(e);
    downInfo = { x: p.x, y: p.y, t: pieceTime, moved: false, cube: cubeAt(p.x, p.y) };
    pushCue(pieceTime, p.x / (W / STAGE_W), false);
  }
  function onMove(e) {
    if (!downInfo) return;
    var p = ptr(e);
    if (Math.abs(p.x - downInfo.x) + Math.abs(p.y - downInfo.y) > 8) downInfo.moved = true;
    if (downInfo.moved) pushCue(pieceTime, p.x / (W / STAGE_W), false);
  }
  function onUp(e) {
    if (!downInfo) return;
    var p = ptr(e);
    var wasDrag = downInfo.moved;
    var downCube = downInfo.cube;
    var downT = downInfo.t;
    downInfo = null;
    pushCue(pieceTime, null, true); // release: return to formation at machined speed
    if (wasDrag) return;
    if (pieceTime - downT > 0.5) return;
    var c = cubeAt(p.x, p.y);
    if (c < 0) c = downCube;
    if (pieceTime - lastTapT < 0.35 && c === lastTapCube) {
      // double tap: new choreography
      seed = (seed * 1664525 + 1013904223) >>> 0;
      build(seed);
      prevMoving = null; prevStepIdx = null;
      lastTapT = -10; lastTapCube = -2;
      draw();
      return;
    }
    lastTapT = pieceTime; lastTapCube = c;
    if (c >= 0) { tapPulses.push({ c: c, t: pieceTime }); draw(); }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () {
      if (downInfo) { pushCue(pieceTime, null, true); downInfo = null; }
    });
  }

  // ---------- boot: frame one at the fixed phase, then the live loop ----------
  fit();
  build(seed);
  booted = true;
  draw();

  if (typeof requestAnimationFrame !== 'undefined') {
    var lastMs = null;
    var loop = function (ms) {
      if (lastMs === null) lastMs = ms;
      var elapsed = (ms - lastMs) / 1000;
      lastMs = ms;
      if (elapsed > 0.25) elapsed = 0.25;
      if (elapsed < 0) elapsed = 0;
      pieceTime += elapsed;
      draw();
      if (lastSpeeds) audioFrame(lastSpeeds, lastDancerX);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
