<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Weather Changes the Rules</title>
<style>
html, body { margin: 0; padding: 0; background: #2A2350; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND_HARSH = [34, 28, 68];   // #221C44, harsh weather ground
var GROUND_KIND = [55, 42, 110];   // #372A6E, generous weather ground
var CELL = '#F2EDE4';              // warm white cells
var CORE = '#1A1A2E';              // dark cores
var LOOP = 20;                     // envFactor sweep period, seconds
var DT = 1 / 30;                   // CA step, seconds
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var seed = 1572;
var cols = 0, rows = 0, cell = 18;
var health = [], neigh = [];
var simTime = 0, simStep = 0;
var placedW = 0, placedH = 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Deterministic hash to [0,1): pure function of its integer inputs.
function hash01(a, b, c) {
  var x = ((a * 374761393) ^ (b * 668265263) ^ (c * 2246822519)) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
  x = x ^ (x >>> 16);
  return (x >>> 0) / 4294967296;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
// envFactor: 0.1 at t=0, 0.8 at t=10, back to 0.1 at t=20. One full sine
// cycle per loop, so the weather sweep is seamless and pure in t.
function envFactor(t) {
  return 0.45 + 0.35 * Math.sin(TAU * t / LOOP - Math.PI / 2);
}
// Initial health: smooth value-noise field, 25..90, seeded.
function initHealth() {
  var rnd = mulberry32(seed);
  var gw = 9, gh = 7, g = [], i, j;
  for (j = 0; j < gh; j++) { g.push([]); for (i = 0; i < gw; i++) g[j].push(rnd()); }
  health = [];
  neigh = [];
  for (j = 0; j < rows; j++) {
    for (i = 0; i < cols; i++) {
      var fx = i / Math.max(1, cols - 1) * (gw - 1);
      var fy = j / Math.max(1, rows - 1) * (gh - 1);
      var x0 = Math.floor(fx), y0 = Math.floor(fy);
      var x1 = Math.min(gw - 1, x0 + 1), y1 = Math.min(gh - 1, y0 + 1);
      var tx = fx - x0, ty = fy - y0;
      var v = (g[y0][x0] * (1 - tx) + g[y0][x1] * tx) * (1 - ty)
            + (g[y1][x0] * (1 - tx) + g[y1][x1] * tx) * ty;
      health.push(25 + 65 * v);
      neigh.push(50);
    }
  }
  simTime = 0; simStep = 0;
}
function buildGrid() {
  var u = Math.min(VW, VH) / 900;
  cell = 18 * u;
  cols = Math.max(8, Math.ceil(VW / cell));
  rows = Math.max(8, Math.ceil(VH / cell));
  initHealth();
  placedW = VW; placedH = VH;
}
// One CA step at simTime: each cell drifts toward its neighbours' mean
// health, scaled by the weather; the weather also raises or lowers the
// target, so generous weather grows the field and harsh weather starves it.
// Neighbour influence is relative to each cell's own health, never a fixed
// threshold. A tiny deterministic wobble keeps the field alive.
function caStep() {
  var env = envFactor(simTime);
  var next = new Array(cols * rows);
  var nAvg = new Array(cols * rows);
  var i, j, x, y, idx, sum, cnt;
  for (j = 0; j < rows; j++) {
    for (i = 0; i < cols; i++) {
      idx = j * cols + i;
      sum = 0; cnt = 0;
      for (y = -1; y <= 1; y++) {
        for (x = -1; x <= 1; x++) {
          if (x === 0 && y === 0) continue;
          var ni = i + x, nj = j + y;
          if (ni < 0 || ni >= cols || nj < 0 || nj >= rows) continue;
          sum += health[nj * cols + ni]; cnt++;
        }
      }
      var avg = cnt ? sum / cnt : health[idx];
      nAvg[idx] = avg;
      // Target blends neighbour influence with a weather baseline: in
      // generous weather the baseline lifts the whole field toward bloom,
      // in harsh weather it starves it toward dots. A purely multiplicative
      // target could never regrow a starved field, so the additive term
      // carries the weather.
      var target = avg * (0.55 + 0.45 * env) + (env - 0.45) * 60;
      if (target < 0) target = 0;
      if (target > 100) target = 100;
      var h = health[idx] + (target - health[idx]) * 0.06
            + (hash01(seed, simStep, idx) - 0.5) * 0.5;
      if (h < 0) h = 0;
      if (h > 100) h = 100;
      next[idx] = h;
    }
  }
  health = next;
  neigh = nAvg;
  simTime += DT;
  simStep++;
}
// Advance the simulation to time t in fixed steps. Monotonic playback
// steps forward incrementally; a rewind (or a fresh t=0 draw) rebuilds
// from the seeded initial field, so frame one is always identical.
function simulateTo(t) {
  if (t < simTime - 1e-9) initHealth();
  var guard = 0;
  while (simTime + DT <= t + 1e-9 && guard < 4000) { caStep(); guard++; }
}
function lerpGround(env) {
  var r = Math.round(GROUND_HARSH[0] + (GROUND_KIND[0] - GROUND_HARSH[0]) * env);
  var g = Math.round(GROUND_HARSH[1] + (GROUND_KIND[1] - GROUND_HARSH[1]) * env);
  var b = Math.round(GROUND_HARSH[2] + (GROUND_KIND[2] - GROUND_HARSH[2]) * env);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function draw(t) {
  lastT = t;
  size();
  if (cols === 0 || placedW !== VW || placedH !== VH) buildGrid();
  simulateTo(t);
  var env = envFactor(t);
  ctx.fillStyle = lerpGround(env);
  ctx.fillRect(0, 0, VW, VH);
  var i, j, idx;
  for (j = 0; j < rows; j++) {
    for (i = 0; i < cols; i++) {
      idx = j * cols + i;
      var h = health[idx];
      if (h < 4) continue;
      // Generous weather: cells swell past their slot and merge with
      // corner-rounded joins. Harsh weather: isolated dots.
      var s = cell * (0.22 + 0.85 * (h / 100));
      var cx = i * cell + cell / 2, cy = j * cell + cell / 2;
      var rad = s * (0.15 + 0.35 * (neigh[idx] / 100));
      if (rad > s / 2) rad = s / 2;
      var a = 0.30 + 0.70 * (h / 100);
      ctx.globalAlpha = Number(a.toFixed(4));
      ctx.fillStyle = CELL;
      roundRectPath(cx - s / 2, cy - s / 2, s, s, rad);
      ctx.fill();
      // Dark core, sized by health.
      if (h > 40) {
        var cr = s * 0.18 * (h / 100);
        ctx.fillStyle = CORE;
        ctx.beginPath();
        ctx.moveTo(cx + cr, cy);
        ctx.arc(cx, cy, cr, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
  // Caption: title, formula date, watch-only cue.
  var minDim = Math.min(VW, VH);
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'The Weather Changes the Rules  ·  2006 · 05 · 02  ·  Watch the weather change the rules.';
  ctx.font = fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  var pad = Math.round(fs * 0.7);
  var bx = Math.round(fs * 0.8), by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  ctx.fillStyle = CELL;
  ctx.fillRect(bx - pad, by, Math.ceil(tw) + 2 * pad, fs + 2 * pad);
  ctx.fillStyle = CORE;
  ctx.textBaseline = 'top';
  ctx.fillText(label, bx, by + pad);
  if (typeof window !== 'undefined') {
    var sum = 0, hi = 0;
    for (var k = 0; k < health.length; k++) { sum += health[k]; if (health[k] > 80) hi++; }
    window.__p1572 = {
      t: t, seed: seed, env: env, cols: cols, rows: rows,
      meanHealth: health.length ? sum / health.length : 0,
      fullCells: hi, phone: isPhone()
    };
  }
}
// Watch-only: no pointer interaction of any kind.
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
