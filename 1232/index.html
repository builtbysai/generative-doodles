<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The People in This Picture</title>
<style>
  html, body { margin: 0; padding: 0; background: #101214; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1232 "The People in This Picture" - Christina Battle study CB1.
   A procedural prairie-town "photograph" (block houses, grain elevators,
   a funnel on the horizon) rendered as a corrupted video frame. The
   prompt's byte-level datamosh is realised as DATA TRANSFORMS on the
   scene's shape records - row-band displacement, macroblock duplication
   from displaced sources, channel-split silhouette passes, rain-lattice
   hatch - all driven by one crash-depth parameter d and a hashed crash
   scheduler. No pixel buffer, no glitch filter. Once per 26 s cycle the
   frame "repairs" clean for 3 s; the repair is the lie. Plain white
   typewriter captions sit in a protected low-third band that corruption
   never enters. Silent. Seeded hashes only. */

var T0 = 7.78;               /* fixed first-frame phase: cycle 0, crash 0 attack step 2, d = 0.649 */
var CYCLE = 26;              /* seconds per scheduler cycle */
var STEP = 0.12;             /* datamosh quantum: every change lands in 0.12 s steps */

var INK    = '#101214';      /* deep field black / caption band */
var GREY   = '#6E7A82';      /* storm grey */
var GREY_D = '#59646B';      /* upper sky band */
var MAG    = '#B03A6B';      /* corrupted magenta */
var GRN    = '#3F7A52';      /* macroblock green */
var YEL    = '#E3C447';      /* warning yellow */
var CAPW   = '#F5F2E9';      /* caption white */

var CAPTIONS = [
  'the funnel stayed on the ground eleven minutes',
  'the grain elevator held',
  'everything smelled of rain',
  'the power went out at 4:47',
  'nobody on our street was hurt'
];

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0;

/* ---------- seeded hash ---------- */
function ihash(a, b, c) {
  var x = (a * 374761393 + b * 668265263 + c * 2246822519) | 0;
  x = (x ^ (x >>> 13)) | 0;
  x = Math.imul(x, 1274126177);
  x = (x ^ (x >>> 16)) >>> 0;
  return x / 4294967296;
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

/* ---------- sizing: Visual Viewport API ---------- */
function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function isPhone() {
  var s = window.screen;
  if (s && Math.min(s.width, s.height) < 700) return true;
  return H > W * 1.15;
}
window.addEventListener('resize', function () { resize(); draw(pieceNow()); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceNow()); });
resize();

/* ---------- the clean photograph: shape records in unit space ----------
   Each shape: {k:'r'|'t'|'p'|'c'|'l', geometry in [0,1] units, col, a}   */
function buildScene(cyc) {
  var S = [];
  function r(x, y, w, h, col, a) { S.push({ k: 'r', x: x, y: y, w: w, h: h, col: col, a: a == null ? 1 : a }); }
  function t(x, y, w, h, col, a) { S.push({ k: 't', x: x, y: y, w: w, h: h, col: col, a: a == null ? 1 : a }); }
  function p(pts, col, a) { S.push({ k: 'p', pts: pts, col: col, a: a == null ? 1 : a }); }
  function ci(x, y, rad, col, a) { S.push({ k: 'c', x: x, y: y, r: rad, col: col, a: a == null ? 1 : a }); }
  function ln(x1, y1, x2, y2, wdt, col, a) { S.push({ k: 'l', x: x1, y: y1, x2: x2, y2: y2, w: wdt, col: col, a: a == null ? 1 : a }); }

  /* sky: two flat storm bands */
  r(0, 0, 1, 0.30, GREY_D);
  r(0, 0.30, 1, 0.34, GREY);
  /* low cloud bank on the horizon */
  p([[0, 0.56], [0.22, 0.52], [0.45, 0.565], [0.68, 0.53], [1, 0.56], [1, 0.64], [0, 0.64]], '#525C62');
  /* ground / field */
  r(0, 0.62, 1, 0.38, '#5C564B');
  r(0, 0.62, 1, 0.035, '#4E4A42');

  /* the funnel: hashed x per cycle, tapered segmented polygon */
  var fx = 0.46 + 0.22 * ihash(cyc, 7, 1);
  var seg = 6, lpts = [], rpts = [], i, yy, ww, sway;
  for (i = 0; i <= seg; i++) {
    yy = 0.05 + (0.60 - 0.05) * (i / seg);
    ww = 0.185 - (0.185 - 0.020) * Math.pow(i / seg, 1.35);
    sway = Math.sin(i * 1.15 + cyc) * 0.012 * (i / seg);
    lpts.push([fx - ww + sway, yy]);
    rpts.push([fx + ww + sway, yy]);
  }
  p(lpts.concat(rpts.reverse()), '#2E3438');
  /* debris swirl at the funnel base */
  for (i = 0; i < 5; i++) {
    ci(fx + (ihash(cyc, 40 + i, 2) - 0.5) * 0.13, 0.585 + ihash(cyc, 50 + i, 2) * 0.045,
       0.016 + ihash(cyc, 60 + i, 2) * 0.02, '#3A4146');
  }

  /* grain elevators */
  function elevator(u, tall) {
    r(u, 0.62 - tall, 0.055, tall, '#98938A');
    ci(u + 0.0275, 0.62 - tall, 0.0275, '#98938A');
    r(u + 0.055, 0.62 - tall * 0.55, 0.034, tall * 0.55, '#8A857C');
    r(u + 0.008, 0.62 - tall * 0.8, 0.010, tall * 0.8, '#7C776E');
  }
  elevator(0.13 + 0.03 * ihash(cyc, 3, 9), 0.33);
  elevator(0.79 + 0.03 * ihash(cyc, 4, 9), 0.28);

  /* block houses */
  var houseCols = ['#8A7F6E', '#7C8288', '#94897A', '#6E6A63', '#857B6C', '#7E7466'];
  var nh = 6;
  for (i = 0; i < nh; i++) {
    var hu = 0.24 + i * 0.085 + (ihash(cyc, 70 + i, 4) - 0.5) * 0.03;
    var hw = 0.062 + ihash(cyc, 80 + i, 4) * 0.026;
    var hh = 0.085 + ihash(cyc, 90 + i, 4) * 0.04;
    if (Math.abs(hu + hw / 2 - fx) < 0.075) hu += 0.085;   /* keep houses out of the funnel */
    r(hu, 0.62 - hh, hw, hh, houseCols[(i + cyc) % houseCols.length]);
    t(hu - 0.006, 0.62 - hh - 0.032, hw + 0.012, 0.034, '#3E4448');
    r(hu + hw * 0.18, 0.62 - hh * 0.55, hw * 0.2, hh * 0.3, '#2E3438', 0.85);
    r(hu + hw * 0.62, 0.62 - hh * 0.55, hw * 0.2, hh * 0.3, '#2E3438', 0.85);
  }

  /* trees: dark blob clusters */
  for (i = 0; i < 3; i++) {
    var tx = 0.06 + i * 0.31 + ihash(cyc, 21 + i, 6) * 0.08;
    ci(tx, 0.585, 0.026, '#39413C');
    ci(tx + 0.024, 0.595, 0.019, '#39413C');
    ci(tx - 0.022, 0.598, 0.016, '#424B44');
    r(tx - 0.003, 0.60, 0.006, 0.025, '#2E2A24');
  }

  /* road with centre dashes */
  r(0, 0.795, 1, 0.07, '#33373B');
  for (i = 0; i < 9; i++) r(0.03 + i * 0.108, 0.826, 0.05, 0.006, CAPW, 0.4);

  /* telephone poles + sagging wires */
  var poles = [0.05, 0.34, 0.66, 0.95];
  for (i = 0; i < poles.length; i++) {
    var px = poles[i];
    r(px, 0.615, 0.006, 0.20, '#241F1B');
    r(px - 0.02, 0.628, 0.046, 0.007, '#241F1B');
    if (i < poles.length - 1) {
      ln(px + 0.02, 0.632, poles[i + 1] - 0.02, 0.632, 0.0022, '#1C1A17', 0.9);
      ln(px + 0.02, 0.645, poles[i + 1] - 0.02, 0.645, 0.0022, '#1C1A17', 0.7);
    }
  }
  return S;
}
var sceneCache = {};
function sceneFor(cyc) {
  if (!sceneCache[cyc]) { sceneCache = {}; sceneCache[cyc] = buildScene(cyc); }
  return sceneCache[cyc];
}

/* shape bbox in unit space, for culling */
function shapeBBox(s) {
  if (s.k === 'r' || s.k === 't') return [s.x, s.y, s.x + s.w, s.y + s.h];
  if (s.k === 'c') return [s.x - s.r, s.y - s.r, s.x + s.r, s.y + s.r];
  if (s.k === 'l') return [Math.min(s.x, s.x2), Math.min(s.y, s.y2) - 0.004, Math.max(s.x, s.x2), Math.max(s.y, s.y2) + 0.004];
  var x0 = 9, y0 = 9, x1 = -9, y1 = -9;
  for (var i = 0; i < s.pts.length; i++) {
    x0 = Math.min(x0, s.pts[i][0]); y0 = Math.min(y0, s.pts[i][1]);
    x1 = Math.max(x1, s.pts[i][0]); y1 = Math.max(y1, s.pts[i][1]);
  }
  return [x0, y0, x1, y1];
}
var passAlpha = 1;   /* multiplier for channel-split passes; drawShape respects it */
function drawShape(s, tint) {
  ctx.globalAlpha = s.a * passAlpha;
  ctx.fillStyle = tint || s.col;
  ctx.strokeStyle = tint || s.col;
  var i;
  if (s.k === 'r') {
    ctx.fillRect(s.x * W, s.y * H, s.w * W, s.h * H);
  } else if (s.k === 't') {
    ctx.beginPath();
    ctx.moveTo(s.x * W, (s.y + s.h) * H);
    ctx.lineTo((s.x + s.w / 2) * W, s.y * H);
    ctx.lineTo((s.x + s.w) * W, (s.y + s.h) * H);
    ctx.closePath(); ctx.fill();
  } else if (s.k === 'p') {
    ctx.beginPath();
    ctx.moveTo(s.pts[0][0] * W, s.pts[0][1] * H);
    for (i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i][0] * W, s.pts[i][1] * H);
    ctx.closePath(); ctx.fill();
  } else if (s.k === 'c') {
    ctx.beginPath();
    ctx.moveTo((s.x + s.r) * W, s.y * H);
    ctx.arc(s.x * W, s.y * H, s.r * W, 0, Math.PI * 2);
    ctx.fill();
  } else if (s.k === 'l') {
    ctx.lineWidth = Math.max(1, s.w * H);
    ctx.beginPath();
    ctx.moveTo(s.x * W, s.y * H);
    ctx.lineTo(s.x2 * W, s.y2 * H);
    ctx.stroke();
  }
  ctx.globalAlpha = passAlpha;
}
/* draw all shapes whose bbox intersects unit rect [x0,y0,x1,y1] */
function drawShapesIn(S, x0, y0, x1, y1, tint) {
  for (var i = 0; i < S.length; i++) {
    var b = shapeBBox(S[i]);
    if (b[2] < x0 || b[0] > x1 || b[3] < y0 || b[1] > y1) continue;
    drawShape(S[i], tint);
  }
}
/* topmost shape colour at a unit point (bbox test), for smear sampling */
function colorAt(S, u, v) {
  for (var i = S.length - 1; i >= 0; i--) {
    var b = shapeBBox(S[i]);
    if (u >= b[0] && u <= b[2] && v >= b[1] && v <= b[3]) return S[i].col;
  }
  return GREY;
}

/* ---------- crash scheduler ---------- */
function repairStart(c) { return 2.5 + 6 * ihash(c, 101, 7); }
function crashStart(c, j) { return repairStart(c) + 4.6 + j * 5.2 + 2.2 * ihash(c, 200 + j, 3); }
function crashPeak(c, j) { return 0.78 + 0.18 * ihash(c, 300 + j, 5); }
function crashProfile(ct, s, peak) {
  var atk = 3 * STEP, holdEnd = s + atk + 0.9, decSteps = 5, end = holdEnd + decSteps * STEP;
  if (ct < s || ct >= end) return -1;
  if (ct < s + atk) { var st = Math.floor((ct - s) / STEP); return 0.25 + (peak - 0.25) * (st + 1) / 3; }
  if (ct < holdEnd) return peak;
  var ds = Math.floor((ct - holdEnd) / STEP);
  return Math.max(0.25, peak - (peak - 0.25) * (ds + 1) / decSteps);
}
function schedDepth(t) {
  var c = Math.floor(t / CYCLE), ct = t - c * CYCLE, cc, cct, j, v;
  for (cc = c - 1; cc <= c; cc++) {                      /* repair window wins: d = 0 */
    cct = t - cc * CYCLE;
    if (cct >= repairStart(cc) && cct < repairStart(cc) + 3) return 0;
  }
  var d = 0.23 + 0.05 * ihash(Math.floor(t * 2), 55, 9); /* idle, stepped */
  for (cc = c - 1; cc <= c; cc++) {
    cct = t - cc * CYCLE;
    for (j = 0; j < 3; j++) {
      v = crashProfile(cct, crashStart(cc, j), crashPeak(cc, j));
      if (v > d) d = v;
    }
  }
  return d;
}
/* caption window: opens just after the repair, in the calm stretch;
   index advances one per cycle, rotated by the double-tap reseed salt */
var captionSalt = 0;
function captionAt(t) {
  var c = Math.floor(t / CYCLE), ct = t - c * CYCLE;
  var rs = repairStart(c);
  if (ct >= rs + 3.4 && ct < rs + 9.4) {
    var idx = ((c + captionSalt) % CAPTIONS.length + CAPTIONS.length) % CAPTIONS.length;
    var age = ct - (rs + 3.4);
    return { text: CAPTIONS[idx], a: age < 0.24 ? 0.5 : 1 };  /* two-step typewriter fade-in */
  }
  return null;
}

/* ---------- interaction: forensic drag + double-tap reseed ---------- */
var drag = null;   /* {startX, curX, downT, upT, upOff} */
function dragOffsetAt(t) {
  if (!drag) return 0;
  if (drag.upT == null) return (drag.curX - drag.startX) / 600;
  var q = Math.floor((t - drag.upT) / STEP) * STEP;         /* stepped 2 s resume */
  var f = Math.max(0, 1 - q / 2);
  return drag.upOff * f;
}
var lastTapT = -9, lastTapX = 0;
function evX(e) { return (e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0)); }
canvas.addEventListener('pointerdown', function (e) {
  var t = pieceNow(), x = evX(e);
  if (t - lastTapT < 0.35 && Math.abs(x - lastTapX) < 40) { captionSalt++; lastTapT = -9; }
  else { lastTapT = t; lastTapX = x; }
  drag = { startX: x, curX: x, downT: t, upT: null, upOff: 0 };
});
canvas.addEventListener('pointermove', function (e) { if (drag && drag.upT == null) drag.curX = evX(e); });
function endDrag() {
  if (drag && drag.upT == null) { drag.upT = pieceNow(); drag.upOff = (drag.curX - drag.startX) / 600; }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', endDrag);

/* ---------- render ---------- */
function draw(t) {
  var cyc = Math.floor(t / CYCLE);
  var S = sceneFor(cyc);
  var d = clamp01(schedDepth(t) + dragOffsetAt(t));
  var capTop = H * 0.865;
  var stepI = Math.floor(t / STEP);
  var i, j;

  ctx.fillStyle = INK;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, capTop); ctx.clip();

  if (d < 0.02) {
    drawShapesIn(S, 0, 0, 1, 1, null);                       /* the repair: clean photograph */
  } else {
    /* 1) row-band displacement: the frame drawn in horizontal bands,
          each shifted by a hashed amount that jumps every 0.12 s */
    var bh = Math.max(10, H * 0.045);
    var nb = Math.ceil(capTop / bh);
    var amp = Math.pow(d, 1.5) * W * 0.09;
    for (i = 0; i < nb; i++) {
      var shift = (ihash(i, stepI, cyc * 3 + 1) - 0.5) * 2 * amp;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, i * bh, W, bh + 1); ctx.clip();
      ctx.translate(shift, 0);
      drawShapesIn(S, -Math.abs(shift) / W - 0.02, i * bh / H, 1 + Math.abs(shift) / W + 0.02, (i + 1) * bh / H + 0.002, null);
      ctx.restore();
    }

    /* 2) channel-split silhouette passes: magenta left, green right */
    if (d > 0.35) {
      var off = d * W * 0.012;
      passAlpha = 0.26;
      ctx.save(); ctx.translate(-off, 0); drawShapesIn(S, 0, 0, 1, 1, MAG); ctx.restore();
      ctx.save(); ctx.translate(off, 0); drawShapesIn(S, 0, 0, 1, 1, GRN); ctx.restore();
      passAlpha = 1;
      ctx.globalAlpha = 1;
    }

    /* 3) macroblock fractures: blocks redrawn from displaced sources,
          some tinted over in corrupted colours */
    var cols = 14, rows = 11, bw = W / cols, bhk = capTop / rows;
    for (i = 0; i < cols; i++) {
      for (j = 0; j < rows; j++) {
        var hb = ihash(i * 31 + j, stepI, cyc * 7 + 2);
        if (hb >= d * 0.55) continue;
        var dx = (ihash(i, j * 17, stepI) - 0.5) * W * 0.10 * d;
        var dy = (ihash(j, i * 13, stepI) - 0.5) * H * 0.03 * d;
        ctx.save();
        ctx.beginPath(); ctx.rect(i * bw, j * bhk, bw + 1, bhk + 1); ctx.clip();
        ctx.translate(dx, dy);
        drawShapesIn(S, i * bw / W - Math.abs(dx) / W - 0.02, j * bhk / H - 0.02,
                        (i + 1) * bw / W + Math.abs(dx) / W + 0.02, (j + 1) * bhk / H + 0.02, null);
        ctx.restore();
        var ht = ihash(i * 7, j * 19, stepI + 5);
        if (ht < d * 0.26) {
          ctx.globalAlpha = 0.38;
          ctx.fillStyle = ht < d * 0.10 ? MAG : (ht < d * 0.18 ? GRN : YEL);
          ctx.fillRect(i * bw, j * bhk, bw + 1, bhk + 1);
          ctx.globalAlpha = 1;
        }
      }
    }

    /* 4) P-frame smears: horizontal streaks carrying a sampled colour */
    var nStreak = Math.floor(26 * d);
    for (i = 0; i < nStreak; i++) {
      var sy = ihash(i, stepI, 77) * 0.80;
      var sx = ihash(i, stepI, 78) * 0.85;
      var len = (0.10 + ihash(i, stepI, 79) * 0.42) * d;
      var sh = 0.004 + ihash(i, stepI, 80) * 0.012;
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = colorAt(S, sx + 0.01, sy);
      ctx.fillRect(sx * W, sy * H, len * W, Math.max(2, sh * H));
      ctx.globalAlpha = 1;
    }

    /* 5) rain-lattice: diagonal hatch in corrupted colours at high depth */
    if (d > 0.55) {
      ctx.globalAlpha = Math.min(0.5, (d - 0.55) * 1.2);
      ctx.lineWidth = 1.5;
      var sp = 15, drift = (stepI % 5) * 3;
      for (i = -Math.floor(capTop / sp); i < Math.floor(W / sp) + 2; i++) {
        var hl = ihash(i, stepI, 91);
        ctx.strokeStyle = hl < 0.4 ? MAG : (hl < 0.75 ? GRN : YEL);
        var x0 = i * sp + drift;
        ctx.beginPath();
        ctx.moveTo(x0, 0);
        ctx.lineTo(x0 + capTop * 0.36, capTop);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();

  /* caption band: protected. Corruption never enters. */
  ctx.fillStyle = INK;
  ctx.fillRect(0, capTop, W, H - capTop);
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = CAPW;
  ctx.fillRect(0, capTop, W, 1);
  ctx.globalAlpha = 1;
  var cap = captionAt(t);
  if (cap) {
    var fs = isPhone() ? Math.max(13, W * 0.036) : Math.min(24, Math.max(15, W * 0.021));
    ctx.font = fs + 'px "Courier New", monospace';
    var tw = ctx.measureText(cap.text).width;
    if (tw > W * 0.89) { fs = fs * (W * 0.89) / tw; ctx.font = fs + 'px "Courier New", monospace'; }
    ctx.globalAlpha = cap.a;
    ctx.fillStyle = CAPW;
    ctx.textBaseline = 'middle';
    ctx.fillText(cap.text, W * 0.055, capTop + (H - capTop) / 2);
    ctx.globalAlpha = 1;
  }
  /* pin canvas CSS size (house phone rule) */
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}

/* ---------- clock: fixed first frame, rAF anchored at load ---------- */
var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
function pieceNow() {
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  return T0 + (now - startStamp) / 1000;
}
draw(T0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function () { draw(pieceNow()); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
