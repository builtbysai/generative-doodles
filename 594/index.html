<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Static Yet Never Still</title>
<style>
html, body { margin: 0; padding: 0; background: #1B1B1E; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a held stillness that is only still from a distance. From across
   the room the frame never changes, but up close it is always quietly sparking. */
var TAU = Math.PI * 2;
var GROUND = '#1B1B1E';
var SLATE = '#5B6470';
var HOT = '#F7F9FC';
var BLUE = '#2E6BFF';
var PLATE = '#101013';
var PLATE_LINE = 'rgba(247,249,252,0.30)';
var TITLE_INK = '#EDEDE8';
var HINT_INK = '#9AA3AD';
var LOOP = 18;             /* macro loop, seconds: two 18 s loops phased against each other */
var HORIZON = 360;         /* event schedule horizon, seconds; positions and palette shift each cycle */
var LAMBDA = 1.5;          /* mean micro-events per second (poisson scheduler) */
var FRAME_T = 110.8;       /* fixed phase: five micro-events mid-decay, grid reading */
var PENTA = [523.25, 587.33, 659.25, 783.99, 880.00];
var BLUE_P = [0.05, 0.10, 0.15, 0.20]; /* blue share per 18 s loop, rotates so repetition never lands */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hash2(x, y) {
  var s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1836);
var phaseT = FRAME_T;
var soundOn = false;
var audioCtx = null;
var droneNodes = null;
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
var lastT = null;
/* ---- micro-event schedule: poisson arrivals, seeded, fixed at load ---- */
var EVENTS = [];
(function () {
  var t = 0.4;
  var prevFx = -1, prevFy = -1;
  while (t < HORIZON) {
    t += -Math.log(1 - rng()) / LAMBDA;
    if (t >= HORIZON) break;
    var fx = 0.04 + rng() * 0.92;
    var fy = 0.06 + rng() * 0.88;
    if (Math.abs(fx - prevFx) < 0.02 && Math.abs(fy - prevFy) < 0.02) fx = 0.02 + ((fx + 0.31) % 0.94);
    if (Math.abs(fx - 0.5) < 0.03 && Math.abs(fy - 0.5) < 0.03) fx = 0.02 + ((fx + 0.11) % 0.94);
    prevFx = fx; prevFy = fy;
    var r = rng();
    var type = r < 0.45 ? 0 : (r < 0.75 ? 1 : (r < 0.92 ? 2 : 3));
    var dur = type === 3 ? 0.35 + rng() * 0.25 : 0.45 + rng() * 0.45;
    EVENTS.push({
      t0: t, dur: dur, fx: fx, fy: fy, type: type,
      ang: rng() * TAU,
      len: 0.8 + rng() * 1.4,
      pitch: Math.floor(rng() * 5)
    });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function sceneRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function gridGeom(sc) {
  var spacing = Math.max(30, Math.min(sc.w, sc.h) / 16);
  var cols = Math.max(2, Math.floor(sc.w / spacing) + 1);
  var rows = Math.max(2, Math.floor(sc.h / spacing) + 1);
  var ox = sc.x + (sc.w - (cols - 1) * spacing) / 2;
  var oy = sc.y + (sc.h - (rows - 1) * spacing) / 2;
  return { spacing: spacing, cols: cols, rows: rows, ox: ox, oy: oy };
}
/* macro layer: each point drifts on two 18 s loops phased against each other */
function pointAt(g, col, row, t) {
  var ph1 = hash2(col, row) * TAU;
  var ph2 = hash2(row, col + 7) * TAU;
  var ph3 = hash2(col + 13, row + 5) * TAU;
  var dx = 1.7 * Math.sin(TAU * t / LOOP + ph1) + 1.1 * Math.sin(TAU * t / LOOP + 1.9 + ph2);
  var dy = 1.7 * Math.cos(TAU * t / LOOP + ph3) + 1.1 * Math.sin(TAU * t / LOOP + 2.6 + ph1);
  return { x: g.ox + col * g.spacing + dx, y: g.oy + row * g.spacing + dy };
}
function drawGrid(sc, t, g) {
  var col, row, p, a, r;
  for (col = 0; col < g.cols; col++) {
    for (row = 0; row < g.rows; row++) {
      p = pointAt(g, col, row, t);
      a = 0.30 + 0.42 * hash2(col + 3, row + 11);
      r = 1.1 + 0.7 * hash2(col + 21, row + 4);
      ctx.fillStyle = rgba(SLATE, a);
      ctx.fillRect(p.x - r / 2, p.y - r / 2, r, r);
    }
  }
}
/* event anchor: fractional position snapped to the nearest grid point,
   shifted per horizon cycle so the pattern never visibly repeats */
function eventAnchor(ev, g, cyc) {
  var fx = ev.fx, fy = ev.fy;
  if (cyc > 0) {
    fx = 0.02 + ((fx - 0.02 + 0.37 * cyc) % 0.94);
    fy = 0.03 + ((fy - 0.03 + 0.23 * cyc) % 0.90);
  }
  var col = Math.round(fx * (g.cols - 1));
  var row = Math.round(fy * (g.rows - 1));
  return pointAt(g, col, row, phaseT);
}
function eventIsBlue(ev, te, cyc) {
  var loopIdx = (Math.floor(te / LOOP) + cyc) % 4;
  return hash2(ev.t0 * 7.31, cyc * 3.17 + ev.pitch) < BLUE_P[loopIdx];
}
function drawEvents(sc, t, g) {
  var cyc = Math.floor(t / HORIZON);
  var te = t - cyc * HORIZON;
  var i, ev, u, a, p, colr, r, L, mx, my, bx, by;
  for (i = 0; i < EVENTS.length; i++) {
    ev = EVENTS[i];
    if (te < ev.t0 || te >= ev.t0 + ev.dur) continue;
    u = (te - ev.t0) / ev.dur;
    a = (1 - u) * (1 - u);
    p = eventAnchor(ev, g, cyc);
    colr = eventIsBlue(ev, te, cyc) ? BLUE : HOT;
    if (ev.type === 0) {
      /* point fires: a brief flare on its grid point */
      r = Math.max(1.2, (1.6 + 3.2 * (1 - u)) * (g.spacing / 45));
      ctx.fillStyle = rgba(colr, a);
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.fill();
    } else if (ev.type === 1) {
      /* hairline fires from the point and dies */
      L = ev.len * g.spacing * (0.3 + 0.7 * Math.min(1, u * 3));
      ctx.strokeStyle = rgba(colr, a);
      ctx.lineWidth = Math.max(1, g.spacing / 45);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.cos(ev.ang) * L, p.y + Math.sin(ev.ang) * L);
      ctx.stroke();
    } else if (ev.type === 2) {
      /* hairline splits at its midpoint into a fork */
      L = ev.len * g.spacing * (0.3 + 0.7 * Math.min(1, u * 3));
      mx = p.x + Math.cos(ev.ang) * L * 0.55;
      my = p.y + Math.sin(ev.ang) * L * 0.55;
      ctx.strokeStyle = rgba(colr, a);
      ctx.lineWidth = Math.max(1, g.spacing / 45);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(mx, my);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(mx, my);
      bx = mx + Math.cos(ev.ang + 0.6) * L * 0.45;
      by = my + Math.sin(ev.ang + 0.6) * L * 0.45;
      ctx.lineTo(bx, by);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(mx, my);
      bx = mx + Math.cos(ev.ang - 0.6) * L * 0.45;
      by = my + Math.sin(ev.ang - 0.6) * L * 0.45;
      ctx.lineTo(bx, by);
      ctx.stroke();
    } else {
      /* color flash: a small disc that flares for a beat and dies */
      r = Math.max(1.5, (2.6 + 2.4 * (1 - u)) * (g.spacing / 45));
      ctx.fillStyle = rgba(colr, a);
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.fill();
    }
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Static Yet Never Still').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Static Yet Never Still').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 21').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Static Yet Never Still', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 21', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, soundPlate.x + 12, soundPlate.y + 7);
}
/* ---- sound: closed-form model, real WebAudio only after a tap ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try { audioCtx = new AudioContext(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function startDrone(ac) {
  if (droneNodes) return;
  try {
    var g = ac.createGain();
    g.gain.value = 0.018;
    g.connect(ac.destination);
    var o1 = ac.createOscillator();
    o1.type = 'sine'; o1.frequency.value = 55;
    var o2 = ac.createOscillator();
    o2.type = 'sine'; o2.frequency.value = 55.35;
    o1.connect(g); o2.connect(g);
    o1.start(); o2.start();
    droneNodes = { g: g, o1: o1, o2: o2 };
  } catch (e) { droneNodes = null; }
}
function stopDrone() {
  if (!droneNodes) return;
  try { droneNodes.o1.stop(); droneNodes.o2.stop(); droneNodes.g.disconnect(); } catch (e) {}
  droneNodes = null;
}
function playBlip(ev) {
  var ac = ensureAudio();
  if (!ac || !soundOn) return;
  var now = ac.currentTime;
  var f = PENTA[ev.pitch % 5] * (eventIsBlue(ev, phaseT - Math.floor(phaseT / HORIZON) * HORIZON, Math.floor(phaseT / HORIZON)) ? 0.5 : 1);
  try {
    var osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.10, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.30);
    osc.connect(g);
    g.connect(ac.destination);
    osc.start(now);
    osc.stop(now + 0.32);
  } catch (e) {}
}
function maybeBlips(t) {
  if (!soundOn || lastT === null) return;
  var cyc = Math.floor(t / HORIZON);
  var prevCyc = Math.floor(lastT / HORIZON);
  if (cyc !== prevCyc) return;
  var te = t - cyc * HORIZON;
  var prevTe = lastT - prevCyc * HORIZON;
  var i, ev;
  for (i = 0; i < EVENTS.length; i++) {
    ev = EVENTS[i];
    if (ev.t0 > prevTe && ev.t0 <= te) playBlip(ev);
  }
}
function draw() {
  size();
  var sc = sceneRect();
  var t = phaseT;
  var g = gridGeom(sc);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawGrid(sc, t, g);
  drawEvents(sc, t, g);
  drawPlates();
  maybeBlips(t);
  lastT = t;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    activeAt: function (t) {
      var cyc = Math.floor(t / HORIZON);
      var te = t - cyc * HORIZON;
      var n = 0, i, ev;
      for (i = 0; i < EVENTS.length; i++) { ev = EVENTS[i]; if (te >= ev.t0 && te < ev.t0 + ev.dur) n++; }
      return n;
    },
    eventCount: EVENTS.length
  };
}
/* ---- frame one: fixed phase t = 110.8 s, five micro-events mid-decay ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('click', function (ev) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    var x = ev.clientX - rect.left;
    var y = ev.clientY - rect.top;
    if (x >= soundPlate.x && x <= soundPlate.x + soundPlate.w && y >= soundPlate.y && y <= soundPlate.y + soundPlate.h) {
      soundOn = !soundOn;
      if (soundOn) {
        var ac = ensureAudio();
        if (ac) startDrone(ac);
      } else {
        stopDrone();
      }
      draw();
    }
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
