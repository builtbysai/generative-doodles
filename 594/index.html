<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1+1=2</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#FAF7F0; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var INK = '#1A1A1A', PAPER = '#FAF7F0', BLUE = '#3E6FA8';

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rng = mulberry32(594072);

/* ---------- precomputed paper speckle + notebook ruled lines (seeded data, drawn directly) ---------- */
var speckles = [];
for (var si = 0; si < 220; si++){
  speckles.push({ x: rng()*1000, y: rng()*1000, r: 0.8 + rng()*1.5, a: 0.03 + rng()*0.05 });
}
var ruled = [];
for (var ry = 92; ry < 980; ry += 44) ruled.push(ry + (rng()*2 - 1)*1.5);

/* ---------- geometry helpers ---------- */
function seg(x1,y1,x2,y2,n){ var p=[],i; n = n || Math.max(2, Math.round(Math.hypot(x2-x1, y2-y1)/11)); for(i=0;i<=n;i++) p.push([x1+(x2-x1)*i/n, y1+(y2-y1)*i/n]); return p; }
function rectP(x,y,w,h){ return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]]; }
function circP(cx,cy,r,n){ var p=[],i,a; n=n||24; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function arcP(cx,cy,r,a0,a1,n){ var p=[],i,a; n=n||12; for(i=0;i<=n;i++){ a=a0+(a1-a0)*i/n; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function bez(p0,p1,p2,p3,n){ var p=[],i,t,u; n=n||16; for(i=0;i<=n;i++){ t=i/n; u=1-t; p.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0], u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]); } return p; }
function rrP(x,y,w,h,r){ var p=[],i,a,corners=[[x+w-r,y+r,-Math.PI/2,0],[x+w-r,y+h-r,0,Math.PI/2],[x+r,y+h-r,Math.PI/2,Math.PI],[x+r,y+r,Math.PI,Math.PI*1.5]]; for(var c=0;c<4;c++){ var cc=corners[c]; for(i=0;i<=4;i++){ a=cc[2]+(cc[3]-cc[2])*i/4; p.push([cc[0]+Math.cos(a)*r, cc[1]+Math.sin(a)*r]); } } return p; }
function jit(pts, amt){ var out=[],i; for(i=0;i<pts.length;i++) out.push([pts[i][0]+(rng()*2-1)*amt, pts[i][1]+(rng()*2-1)*amt]); return out; }
function S(pts, o){ o = o || {}; var p = jit(pts, o.j !== undefined ? o.j : 1.4); var len=0,i; var n=p.length, lim = o.close ? n : n-1; for(i=1;i<=lim;i++){ var a=p[i-1], b=p[i%n]; len += Math.hypot(b[0]-a[0], b[1]-a[1]); } return { pts:p, w:o.w||2.8, close:!!o.close, len:len }; }
function star4(cx,cy,r){ return [ S(seg(cx-r,cy,cx+r,cy),{w:2,j:0.8}), S(seg(cx,cy-r,cx,cy+r),{w:2,j:0.8}), S(seg(cx-r*0.6,cy-r*0.6,cx+r*0.6,cy+r*0.6),{w:1.6,j:0.8}), S(seg(cx-r*0.6,cy+r*0.6,cx+r*0.6,cy-r*0.6),{w:1.6,j:0.8}) ]; }

/* ---------- strip geometry ---------- */
var PANEL_Y = 310, PANEL_H = 380, PANEL_W = 222;
var PANEL_X = [20, 266, 512, 758];
var FLOOR = 330; /* panel-local ground line */

/* ---------- panel borders: hand-ruled, always fully inked ---------- */
var borders = [];
for (var bi2 = 0; bi2 < 4; bi2++) borders.push(S(rectP(0,0,PANEL_W,PANEL_H), { close:true, w:3.2, j:1.8 }));

/* ---------- speech bubbles (stroke + tail built once; text drawn per mode) ---------- */
function makeBubble(x,y,w,h,lines,size,tailPts){
  var strokes = [ S(rrP(x,y,w,h,13), { close:true, w:2.6, j:1 }) ];
  for (var i=0;i<tailPts.length;i++) strokes.push(S(seg(tailPts[i][0],tailPts[i][1],tailPts[i][2],tailPts[i][3]), { w:2.4, j:0.8 }));
  return { strokes:strokes, cx:x+w/2, cy:y+h/2, lines:lines, size:size };
}
var bubble1 = makeBubble(104, 8, 112, 78, ['Noah, llevá','las cosas','de a una.'], 17.5, [[126,86,110,98],[142,86,112,100]]);
var bubble2 = makeBubble(12, 8, 198, 88, ['Sí, lo que pasa','es que tengo','dos manos.'], 16.5, [[96,96,105,124],[114,96,109,125]]);
var bubble3 = makeBubble(14, 12, 112, 50, ['1+1=2.'], 21, [[58,62,72,110],[74,62,76,112]]);

/* ================= PANEL 1: the mother states the rule ================= */
var p1 = [
  S(circP(92,118,25), { close:true, w:2.8 }),                    /* head */
  S(circP(114,95,9), { close:true, w:2.4 }),                     /* bun */
  S(arcP(92,118,25, Math.PI*1.08, Math.PI*1.55), { w:2.2 }),     /* hair sweep */
  S(seg(80,146,104,146), { w:2.6 }),                             /* collar */
  S(seg(80,146,70,296), { w:2.8 }), S(seg(104,146,116,296), { w:2.8 }),
  S(seg(70,296,116,296), { w:2.8 }),                             /* dress + hem */
  S(bez([82,162],[104,190],[116,204],[128,214]), { w:2.6 }),    /* arm to tray */
  S(bez([102,162],[128,186],[140,200],[150,212]), { w:2.6 }),   /* other arm */
  S(seg(110,216,180,216), { w:3.2 }),                           /* tray */
  S(rectP(138,191,15,25), { close:true, w:2.2 }),               /* glass on tray */
  S(seg(138,203,153,203), { w:1.6 }),                           /* water line */
  S(bez([168,216],[174,232],[166,246],[170,258]), { w:2 }),     /* cloth over tray edge */
  S(seg(82,296,80,330), { w:2.6 }), S(seg(104,296,106,330), { w:2.6 }),
  S(seg(72,330,90,330), { w:2.6 }), S(seg(98,330,116,330), { w:2.6 }),
  S(seg(87,129,97,129), { w:2 })                                /* mouth: stating, firmly */
];
var p1dots = [ [84,116],[100,116] ];

/* ================= PANEL 2: Noah's airtight logic ================= */
/* body strokes (arms + glasses are dynamic: they rise when panel 2 is held) */
var p2 = [
  S(circP(108,150,22), { close:true, w:2.8 }),                   /* head */
  S(arcP(108,150,22, Math.PI*1.08, Math.PI*1.92), { w:2.2 }),   /* hair */
  S(rectP(88,176,42,64), { close:true, w:2.8 }),                 /* shirt outline */
  S(seg(88,240,130,240), { w:2.6 }),                             /* waist */
  S(seg(93,240,91,322), { w:2.6 }), S(seg(125,240,127,322), { w:2.6 }),
  S(seg(82,326,100,326), { w:2.6 }), S(seg(118,326,136,326), { w:2.6 }),
  S(arcP(108,155,7, Math.PI*0.12, Math.PI*0.88), { w:2 })       /* smile: logic is logic */
];
var p2dots = [ [100,148],[116,148] ];
var shirt2Pts = jit(rectP(88,176,42,64), 1.1);
/* fixed wobble for the dynamic arms/glasses so frames never flicker */
var armJit = [], gi;
for (gi = 0; gi < 13; gi++) armJit.push((rng()*2-1)*1.3);
var glassWob = [[0,0],[0.8,-0.5],[-0.6,0.4],[0.5,0.8],[-0.4,-0.3]];

/* ================= PANEL 3: the careful walk, mother watching ================= */
var p3 = [
  /* Noah, mid-stride */
  S(circP(78,138,21), { close:true, w:2.8 }),
  S(arcP(78,138,21, Math.PI*1.08, Math.PI*1.92), { w:2.2 }),
  S(rectP(60,164,38,58), { close:true, w:2.8 }),                 /* shirt outline */
  S(bez([62,172],[44,168],[34,168],[27,169]), { w:2.6 }),       /* arm out left */
  S(bez([96,172],[114,168],[124,168],[131,169]), { w:2.6 }),    /* arm out right */
  S(seg(66,222,50,272), { w:2.6 }), S(seg(50,272,66,318), { w:2.6 }),   /* bent front leg */
  S(seg(92,222,104,276), { w:2.6 }), S(seg(104,276,96,320), { w:2.6 }), /* back leg */
  S(seg(58,322,76,322), { w:2.6 }), S(seg(88,324,106,324), { w:2.6 }),
  S(seg(30,326,46,326), { w:1.8 }), S(seg(116,328,132,328), { w:1.8 }), /* motion ticks */
  S(seg(46,112,38,120), { w:1.8 }), S(seg(42,126,32,130), { w:1.8 }),  /* effort marks */
  /* the two glasses, held wide and level */
  S(rectP(18,152,17,26), { close:true, w:2.2 }), S(seg(18,165,35,165), { w:1.5 }),
  S(rectP(123,152,17,26), { close:true, w:2.2 }), S(seg(123,165,140,165), { w:1.5 }),
  /* mother watching, arms crossed */
  S(circP(184,128,20), { close:true, w:2.8 }),
  S(circP(200,109,8), { close:true, w:2.2 }),
  S(seg(174,152,168,268), { w:2.8 }), S(seg(194,152,200,268), { w:2.8 }),
  S(seg(168,268,200,268), { w:2.8 }),
  S(bez([176,168],[186,182],[194,194],[198,198]), { w:2.4 }),
  S(bez([192,168],[182,182],[174,194],[170,198]), { w:2.4 }),
  S(seg(178,268,177,330), { w:2.6 }), S(seg(192,268,193,330), { w:2.6 }),
  S(seg(169,330,185,330), { w:2.6 }), S(seg(185,330,201,330), { w:2.6 }),
  S(seg(179,138,189,138), { w:2 })
];
var p3dots = [ [72,140],[86,140],[178,126],[190,126] ];
var shirt3Pts = jit(rectP(60,164,38,58), 1.1);

/* ================= PANEL 4: the mother, flat on her back ================= */
var p4 = [
  S(seg(14,332,208,332), { w:2.6 }),                             /* the floor receives her */
  S(circP(52,306,23), { close:true, w:2.8 }),                    /* head, resting */
  S(circP(72,288,7), { close:true, w:2 }),                       /* bun, squashed sideways */
  S(seg(40,300,48,308), { w:2 }), S(seg(48,300,40,308), { w:2 }),   /* X eye */
  S(seg(56,300,64,308), { w:2 }), S(seg(64,300,56,308), { w:2 }),   /* X eye */
  S(seg(76,310,150,314), { w:2.8 }),                             /* body, top edge */
  S(seg(76,322,150,324), { w:2.8 }),                             /* body, lower edge */
  S(seg(150,314,152,324), { w:2.8 }),                            /* hem */
  S(seg(150,316,170,282), { w:2.6 }), S(seg(170,282,184,314), { w:2.6 }), /* one leg bent up */
  S(seg(150,322,198,324), { w:2.6 }), S(seg(198,324,200,316), { w:2.6 }), /* straight leg + foot */
  S(seg(80,312,64,284), { w:2.6 }),                              /* arm flung up */
  S(seg(110,323,142,331), { w:2.6 }),                            /* arm along the floor */
  S(seg(96,296,92,282), { w:1.8 }), S(seg(120,300,124,286), { w:1.8 })   /* impact ticks */
];
var p4stars = star4(22,258,11).concat(star4(88,252,9)).concat(star4(54,232,8));

var panelStrokes = [p1, p2, p3, p4];

/* ---------- drawing primitives ---------- */
function handFont(size, weight){ return 'italic ' + (weight||600) + ' ' + size + 'px "Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive,sans-serif'; }
function pathOf(pts, close){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function strokePartial(pts, close, budget){
  var n = pts.length, lim = close ? n : n-1, b = budget, i, a, c, dx, dy, L;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(i=1;i<=lim;i++){
    a = pts[i-1]; c = pts[i%n]; dx = c[0]-a[0]; dy = c[1]-a[1]; L = Math.hypot(dx,dy);
    if (b >= L){ ctx.lineTo(c[0], c[1]); b -= L; }
    else { var f = L ? b/L : 0; ctx.lineTo(a[0]+dx*f, a[1]+dy*f); b = 0; break; }
  }
  ctx.stroke();
  return b;
}
function drawStrokes(strokes, p){
  var total = 0, i;
  for(i=0;i<strokes.length;i++) total += strokes[i].len;
  var budget = p * total, st;
  for(i=0;i<strokes.length;i++){
    st = strokes[i];
    if (budget <= 0) break;
    ctx.strokeStyle = INK; ctx.lineWidth = st.w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (budget >= st.len){ pathOf(st.pts, st.close); ctx.stroke(); budget -= st.len; }
    else { strokePartial(st.pts, st.close, budget); budget = 0; }
  }
}
function fillPath(pts, color){
  ctx.save(); ctx.fillStyle = color; pathOf(pts, true); ctx.fill(); ctx.restore();
}
function drawDots(dots){
  ctx.save(); ctx.fillStyle = INK;
  for (var i=0;i<dots.length;i++){ ctx.beginPath(); ctx.arc(dots[i][0], dots[i][1], 1.9, 0, Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function drawBubbleText(b){
  ctx.save(); ctx.fillStyle = INK; ctx.font = handFont(b.size, 600);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  var n = b.lines.length, i;
  for (i=0;i<n;i++) ctx.fillText(b.lines[i], b.cx, b.cy + (i - (n-1)/2) * b.size * 1.28 + b.size * 0.36);
  ctx.restore();
}
/* a small drinking glass, drawn around a hand point (dynamic, fixed wobble) */
function drawGlass(cx, cy){
  var rel = [[-9,-17],[9,-17],[7,13],[-7,13]];
  var pts = [], i;
  for (i=0;i<4;i++) pts.push([cx + rel[i][0] + glassWob[i][0], cy + rel[i][1] + glassWob[i][1]]);
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  pathOf(pts, true); ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx - 8, cy - 3); ctx.lineTo(cx + 8, cy - 3); ctx.stroke();
  ctx.restore();
}
function drawArm(sx, sy, hx, hy){
  var pts = [], i, t, u, mx = (sx+hx)/2, my = Math.min(sy,hy) - 14;
  for (i=0;i<=12;i++){
    t = i/12; u = 1-t;
    pts.push([u*u*sx + 2*u*t*mx + t*t*hx, u*u*sy + 2*u*t*my + t*t*hy + armJit[i]]);
  }
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  pathOf(pts, false); ctx.stroke(); ctx.restore();
}

/* ---------- state ---------- */
var PHASE0 = 0;                 /* fixed phase anchor: frame one never comes from a clock */
var curT = PHASE0, prevT = PHASE0;
var inkP = [1, 0, 0, 0];        /* panel 1 arrives inked; 2-4 wait as pencil ghosts */
var inkAnim = null;             /* { idx, t0 } */
var puaT0 = -10;                /* last ¡Pua! replay time */
var glassHold = false, glassLift = 0;

/* ---------- sizing ---------- */
var viewW = 300, viewH = 300, dpr = 1;
var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : { width:300, height:300 };
var isPhone = Math.min(scr.width, scr.height) < 700; // aspect fallback below only if screen lies
if (!isPhone && viewH > viewW * 1.15 && Math.min(viewW, viewH) < 700) isPhone = true;

function panelMode(i){
  if (inkAnim && inkAnim.idx === i) return 'anim';
  if (inkP[i] >= 1) return 'ink';
  return 'ghost';
}
function textAlpha(i){
  var m = panelMode(i);
  if (m === 'ghost') return 0.15;
  if (m === 'ink') return 1;
  return Math.max(0, Math.min(1, (inkP[i] - 0.55) / 0.45));
}

function drawPanel(i){
  var mode = panelMode(i);
  var bob = Math.sin(curT * Math.PI * 2 / 3.4 + i * 1.3) * 1.1;   /* the characters breathe, waiting */
  ctx.save();
  ctx.translate(PANEL_X[i], PANEL_Y);
  /* border: hand-ruled, always there */
  drawStrokes([borders[i]], 1);
  /* panel 4 shake on the ¡Pua! replay */
  var shX = 0, shY = 0;
  if (i === 3){
    var age = curT - puaT0;
    if (age >= 0 && age < 0.9){ var k = 1 - age/0.9; shX = Math.sin(age*46) * 7 * k; shY = Math.cos(age*39) * 3.5 * k; }
  }
  ctx.save();
  ctx.translate(shX, shY + bob);
  ctx.beginPath(); ctx.rect(3, 3, PANEL_W - 6, PANEL_H - 6); ctx.clip();

  if (mode === 'ghost') ctx.globalAlpha = 0.15;
  var prog = (mode === 'anim') ? inkP[i] : 1;
  drawStrokes(panelStrokes[i], prog);
  if (i === 3) drawStrokes(p4stars, prog);

  /* fills + faces + words fade in behind the last strokes */
  ctx.save();
  ctx.globalAlpha = (mode === 'ghost') ? 0.15 : textAlpha(i);
  if (i === 0){ drawDots(p1dots); drawBubbleText(bubble1); }
  if (i === 2){ fillPath(shirt3Pts, (mode === 'ghost') ? INK : BLUE); drawDots(p3dots); drawBubbleText(bubble3); }
  if (i === 3){
    drawDots([]);
    var age2 = curT - puaT0, sc = 1;
    if (age2 >= 0 && age2 < 0.9) sc = 1 + 0.16 * Math.sin(age2 * Math.PI / 0.9);
    ctx.save(); ctx.translate(111, 100); ctx.rotate(-0.05); ctx.scale(sc, sc);
    ctx.fillStyle = INK; ctx.font = handFont(64, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('¡Pua!', 0, 0); ctx.restore();
  }
  ctx.restore();

  /* panel 2's arms + glasses: dynamic, they rise while the panel is held */
  if (i === 1){
    var liftY = glassLift * 26;
    var hl = [50, 148 - liftY], hr = [166, 148 - liftY];
    ctx.save();
    if (mode === 'ghost') ctx.globalAlpha = 0.15;
    else if (mode === 'anim') ctx.globalAlpha = textAlpha(i);
    fillPath(shirt2Pts, (mode === 'ghost') ? INK : BLUE);
    drawArm(90, 184, hl[0], hl[1]);
    drawArm(128, 184, hr[0], hr[1]);
    drawGlass(hl[0], hl[1] - 4);
    drawGlass(hr[0], hr[1] - 4);
    drawDots(p2dots);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = (mode === 'ghost') ? 0.15 : textAlpha(i);
    drawBubbleText(bubble2);
    ctx.restore();
    drawStrokes(bubble2.strokes, prog);   /* prog is 1 in ghost mode; the panel alpha does the fading */
  }
  if (i === 0 || i === 2){
    var b = (i === 0) ? bubble1 : bubble3;
    if (mode !== 'ghost') drawStrokes(b.strokes, prog);
    else drawStrokes(b.strokes, 1);
  }
  if (i === 3){ /* panel 4 has no bubble */ }

  ctx.restore(); /* unclip + unshake */
  ctx.restore(); /* panel translate */
}

function draw(){
  canvas.style.width = viewW + 'px'; canvas.style.height = viewH + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);
  var s = Math.min(viewW/1000, viewH/1000);
  var ox = (viewW - 1000*s)/2, oy = (viewH - 1000*s)/2;
  ctx.setTransform(dpr*s, 0, 0, dpr*s, dpr*ox, dpr*oy);
  var i;
  for (i=0;i<speckles.length;i++){ var sp = speckles[i]; ctx.save(); ctx.globalAlpha = sp.a; ctx.fillStyle = INK; ctx.fillRect(sp.x, sp.y, sp.r, sp.r); ctx.restore(); }
  ctx.save(); ctx.globalAlpha = 0.05; ctx.strokeStyle = INK; ctx.lineWidth = 1.4;
  for (i=0;i<ruled.length;i++){ ctx.beginPath(); ctx.moveTo(0, ruled[i]); ctx.lineTo(1000, ruled[i]); ctx.stroke(); }
  ctx.restore();
  for (i=0;i<4;i++) drawPanel(i);
  ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = INK; ctx.font = handFont(21, 600);
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.fillText('tap', 972, 952); ctx.restore();
}

/* bubble strokes for panel 1 and 3 must be drawn even in ghost mode at ghost alpha:
   handled inside drawPanel via the mode branches above (ghost drawn with the panel alpha). */

/* ---------- sizing listeners (Visual Viewport API + window) ---------- */
function resize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  viewW = vv ? vv.width : window.innerWidth;
  viewH = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw();
}
if (typeof window !== 'undefined' && window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (typeof window !== 'undefined') window.addEventListener('resize', resize);

/* ---------- interaction: tap inks the next panel; holding panel 2 raises the glasses ---------- */
function toStage(e){
  var r = { left:0, top:0 };
  if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
  var cx = (e.clientX - r.left), cy = (e.clientY - r.top);
  var s = Math.min(viewW/1000, viewH/1000);
  return { x: (cx - (viewW - 1000*s)/2)/s, y: (cy - (viewH - 1000*s)/2)/s };
}
function panelAt(p){
  if (p.y < PANEL_Y || p.y > PANEL_Y + PANEL_H) return -1;
  for (var i=0;i<4;i++) if (p.x >= PANEL_X[i] && p.x <= PANEL_X[i] + PANEL_W) return i;
  return -1;
}
var pdown = null;
canvas.addEventListener('pointerdown', function(e){
  var p = toStage(e);
  pdown = { x:p.x, y:p.y, moved:false };
  if (panelAt(p) === 1) glassHold = true;
});
canvas.addEventListener('pointermove', function(e){
  if (!pdown) return;
  var p = toStage(e);
  if (Math.abs(p.x - pdown.x) > 8 || Math.abs(p.y - pdown.y) > 8) pdown.moved = true;
});
function endPointer(){
  if (!pdown) return;
  var wasTap = !pdown.moved;
  pdown = null;
  glassHold = false;
  if (!wasTap){ draw(); return; }
  if (inkAnim) return;
  for (var i=0;i<4;i++){
    if (inkP[i] < 1){ inkAnim = { idx:i, t0: curT }; return; }
  }
  /* the strip is fully read: the ¡Pua! lands again */
  puaT0 = curT;
  draw();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ pdown = null; glassHold = false; });
if (typeof window !== 'undefined') window.addEventListener('pointerup', function(){ pdown = null; glassHold = false; });

/* ---------- tick ---------- */
function tick(t){
  var dt = Math.min(0.05, Math.max(0, t - prevT));
  prevT = t; curT = t;
  if (inkAnim && dt > 0){
    inkP[inkAnim.idx] = Math.min(1, (t - inkAnim.t0) / 0.9);
    if (inkP[inkAnim.idx] >= 1){
      if (inkAnim.idx === 3) puaT0 = t;   /* the fall lands with a shake */
      inkAnim = null;
    }
  }
  var target = glassHold ? 1 : 0;
  glassLift += (target - glassLift) * Math.min(1, dt * 7);
  if (Math.abs(target - glassLift) < 0.002) glassLift = target;
}

/* ---------- go: synchronous first frame, then the loop ---------- */
resize();
var baseTs = null;
function loop(ts){
  if (baseTs === null){ baseTs = ts; curT = PHASE0; prevT = PHASE0; }
  tick(PHASE0 + (ts - baseTs)/1000);
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
</script>
</body>
</html>
