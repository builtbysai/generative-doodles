<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mangled Chamber</title>
<style>
html, body { margin: 0; padding: 0; background: #1e3a2b; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#1e3a2b';
var GROUND_DEEP = '#162e21';
var OAK = '#6b4a2f';
var OAK_DARK = '#3a2415';
var OAK_LIGHT = '#8a5a33';
var INK_BLUE = '#33507f';
var INK_BLUE_DARK = '#243a5e';
var GUNMETAL = '#4a4f55';
var GUNMETAL_LIGHT = '#6a7076';
var GUNMETAL_DARK = '#33373b';
var RUST = '#c1440e';
var RUST_LIGHT = '#d0501a';
var WHITE = '#f2ead8';
var AMBER = '#e8c97a';
var AMBER_PALE = '#f2d492';
var PLATE = '#162e21';
var PLATE_LINE = 'rgba(232,201,122,0.55)';
var TITLE_INK = '#f2ead8';
var HINT_INK = '#e8c97a';
var FRAME_T = 60.0; /* fixed phase: pipeline populated end to end */
var PERIOD = 36.0; /* mangling wave period, slow sine gating chaos */
var SPAWN_EVERY = 2.4;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1764);
var phaseT = FRAME_T;
var simT = 0;
var particles = [];
var nextSpawn = 1.0;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
function fx(u) { return F.x + u * F.w; }
function fy(v) { return F.y + v * F.h; }
function chaosAt(t) { return 0.5 + 0.5 * Math.sin(TAU * t / PERIOD); }
/* ---- benches: 3 rows x 5, lower left ---- */
var BENCHES = [];
(function () {
  var r, c;
  for (r = 0; r < 3; r++) {
    for (c = 0; c < 5; c++) {
      BENCHES.push({
        u: 0.05 + c * 0.052 + (r % 2) * 0.012,
        v: 0.66 + r * 0.085,
        w: 0.042, h: 0.05
      });
    }
  }
})();
/* ---- gears in the vertical band ---- */
var GEARS = [
  { u: 0.455, v: 0.34, r: 0.062, teeth: 10, speed: 0.22, off: 0.0 },
  { u: 0.525, v: 0.55, r: 0.075, teeth: 12, speed: -0.16, off: 0.4 },
  { u: 0.46, v: 0.76, r: 0.058, teeth: 9, speed: 0.28, off: 0.9 }
];
var BLOCKS = [
  { u: 0.40, v: 0.22, w: 0.05, h: 0.07 },
  { u: 0.53, v: 0.26, w: 0.045, h: 0.05 },
  { u: 0.40, v: 0.44, w: 0.04, h: 0.06 },
  { u: 0.535, v: 0.66, w: 0.05, h: 0.055 },
  { u: 0.405, v: 0.84, w: 0.055, h: 0.05 }
];
function spawnMark() {
  var b = BENCHES[Math.floor(rng() * BENCHES.length)];
  particles.push({
    kind: 'mark', state: 'rise',
    x: fx(b.u + b.w / 2), y: fy(b.v) - 6,
    vx: 0, vy: 0, rot: 0, vr: 0,
    size: 7 + rng() * 5, age: 0, life: 0,
    sway: rng() * TAU, swayAmp: 2 + rng() * 4,
    targetGear: GEARS[Math.floor(rng() * GEARS.length)]
  });
}
function spawnShards(x, y, chaos) {
  var n = 4 + Math.floor(rng() * 3);
  var i, a, sp;
  for (i = 0; i < n; i++) {
    a = -0.5 + rng() * 1.1; /* mostly rightward */
    sp = (55 + rng() * 115) * (0.6 + 0.8 * chaos);
    particles.push({
      kind: 'shard', state: 'fly',
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      rot: rng() * TAU, vr: (rng() - 0.5) * 6,
      size: 4 + rng() * 7, age: 0, life: 0,
      rust: rng() < 0.6, pts: 3 + Math.floor(rng() * 2),
      jag: [], seed: rng()
    });
    var p = particles[particles.length - 1];
    var k;
    for (k = 0; k < p.pts; k++) p.jag.push(0.6 + rng() * 0.7);
  }
}
function stepSim(dt) {
  simT += dt;
  var chaos = chaosAt(simT);
  while (nextSpawn <= simT) {
    spawnMark();
    nextSpawn += SPAWN_EVERY;
  }
  var i, p, j;
  for (i = particles.length - 1; i >= 0; i--) {
    p = particles[i];
    p.age += dt;
    if (p.kind === 'mark') {
      if (p.state === 'rise') {
        p.y -= (26 + 8 * Math.sin(p.sway)) * dt;
        p.x += Math.sin(simT * 0.9 + p.sway) * p.swayAmp * dt;
        p.rot = Math.sin(simT * 0.9 + p.sway) * 0.12;
        if (p.y < fy(0.30) || p.x > fx(0.40)) { p.state = 'capture'; p.capT = 0; }
      } else if (p.state === 'capture') {
        p.capT += dt;
        var g = p.targetGear;
        var gx = fx(g.u), gy = fy(g.v);
        p.x += (gx - p.x) * 2.2 * dt;
        p.y += (gy - p.y) * 2.2 * dt;
        p.rot += 3.0 * dt;
        p.size *= (1 - 0.35 * dt);
        if (p.capT > 1.5) {
          spawnShards(p.x, p.y, chaos);
          particles.splice(i, 1);
        }
      }
    } else if (p.kind === 'shard') {
      var damp = Math.exp(-0.55 * dt);
      p.vx *= damp; p.vy *= damp;
      p.vy += 6 * dt; /* slight settle downward */
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.vr *= damp;
      var speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      if (speed < 9 || p.age > 9) {
        p.kind = 'mote';
        p.state = 'drift';
        p.age = 0;
        p.life = 14 + p.seed * 8;
        p.vx = (rng() - 0.5) * 6;
        p.vy = -3 - rng() * 5;
      }
      if (p.x > fx(0.99) || p.y > fy(0.99) || p.y < fy(0.02)) {
        particles.splice(i, 1);
      }
    } else if (p.kind === 'mote') {
      p.x += (p.vx + Math.sin(simT * 0.4 + p.seed * 20) * 3) * dt;
      p.y += p.vy * dt;
      if (p.age > p.life) particles.splice(i, 1);
    }
  }
  /* keep the calm field stocked with ambient motes */
  var motes = 0;
  for (j = 0; j < particles.length; j++) if (particles[j].kind === 'mote') motes++;
  if (motes < 20 && simT > 4) {
    particles.push({
      kind: 'mote', state: 'drift',
      x: fx(0.60 + rng() * 0.36), y: fy(0.10 + rng() * 0.80),
      vx: (rng() - 0.5) * 5, vy: -2 - rng() * 4,
      rot: 0, vr: 0, size: 2.5 + rng() * 4, age: 0,
      life: 16 + rng() * 10, seed: rng()
    });
  }
}
function drawGear(g) {
  var cx = fx(g.u), cy = fy(g.v);
  var r = g.r * F.w;
  var ang = g.off + phaseT * g.speed;
  var i, a;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  ctx.fillStyle = GUNMETAL;
  for (i = 0; i < g.teeth; i++) {
    a = i * TAU / g.teeth;
    ctx.save();
    ctx.rotate(a);
    ctx.fillRect(r * 0.92, -r * 0.09, r * 0.22, r * 0.18);
    ctx.restore();
  }
  ctx.beginPath();
  ctx.moveTo(cx - cx + r, 0);
  ctx.arc(0, 0, r, 0, TAU);
  ctx.fillStyle = GUNMETAL;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(r * 0.62, 0);
  ctx.arc(0, 0, r * 0.62, 0, TAU);
  ctx.fillStyle = GUNMETAL_LIGHT;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(r * 0.22, 0);
  ctx.arc(0, 0, r * 0.22, 0, TAU);
  ctx.fillStyle = GROUND_DEEP;
  ctx.fill();
  ctx.restore();
  /* hub pin */
  ctx.beginPath();
  ctx.moveTo(cx + 2.5, cy);
  ctx.arc(cx, cy, 2.5, 0, TAU);
  ctx.fillStyle = WHITE;
  ctx.fill();
}
function drawMark(p) {
  var s = p.size;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  ctx.fillStyle = p.state === 'capture' ? rgba(INK_BLUE, 0.85) : INK_BLUE;
  ctx.beginPath();
  ctx.moveTo(s, 0);
  ctx.arc(0, 0, s, 0, TAU);
  ctx.fill();
  /* tail, pointing down-left toward the benches */
  ctx.beginPath();
  ctx.moveTo(-s * 0.3, s * 0.7);
  ctx.lineTo(-s * 1.15, s * 1.5);
  ctx.lineTo(s * 0.45, s * 0.75);
  ctx.closePath();
  ctx.fillStyle = INK_BLUE_DARK;
  ctx.fill();
  /* inner orderly dot */
  ctx.beginPath();
  ctx.moveTo(s * 0.35, 0);
  ctx.arc(0, 0, s * 0.35, 0, TAU);
  ctx.fillStyle = rgba(WHITE, 0.75);
  ctx.fill();
  ctx.restore();
}
function drawShard(p) {
  var s = p.size;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  ctx.beginPath();
  var k, a, rr;
  for (k = 0; k < p.pts; k++) {
    a = k * TAU / p.pts;
    rr = s * p.jag[k];
    if (k === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = p.rust ? RUST : WHITE;
  ctx.fill();
  ctx.restore();
}
function drawMote(p) {
  var fade = p.age < 2 ? p.age / 2 : (p.age > p.life - 4 ? Math.max(0, (p.life - p.age) / 4) : 1);
  var a = (0.28 + 0.30 * fade).toFixed(4);
  ctx.beginPath();
  ctx.moveTo(p.x + p.size, p.y);
  ctx.arc(p.x, p.y, p.size, 0, TAU);
  ctx.fillStyle = 'rgba(242,212,146,' + a + ')';
  ctx.fill();
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* calm-field amber wash, right and above */
  var wash = ctx.createLinearGradient(fx(0.58), 0, fx(1.0), 0);
  wash.addColorStop(0, rgba(AMBER, 0.0));
  wash.addColorStop(1, rgba(AMBER, 0.14));
  ctx.fillStyle = wash;
  ctx.fillRect(fx(0.58), F.y, F.x + F.w - fx(0.58), F.h);
  /* bench rows, lower left */
  var i, b, bx, by, bw, bh;
  for (i = 0; i < BENCHES.length; i++) {
    b = BENCHES[i];
    bx = fx(b.u); by = fy(b.v);
    bw = b.w * F.w; bh = b.h * F.h;
    ctx.fillStyle = OAK_DARK;
    ctx.fillRect(bx, by, bw, bh * 0.42); /* backrest */
    ctx.fillStyle = OAK;
    ctx.fillRect(bx, by + bh * 0.42, bw, bh * 0.30); /* seat */
    ctx.fillStyle = OAK_LIGHT;
    ctx.fillRect(bx, by + bh * 0.42, bw, 1.5); /* seat edge */
    ctx.fillStyle = OAK_DARK;
    ctx.fillRect(bx + 1, by + bh * 0.72, 2, bh * 0.28);
    ctx.fillRect(bx + bw - 3, by + bh * 0.72, 2, bh * 0.28);
  }
  /* modular blocks in the gear band */
  for (i = 0; i < BLOCKS.length; i++) {
    var bl = BLOCKS[i];
    ctx.fillStyle = GUNMETAL_DARK;
    ctx.fillRect(fx(bl.u), fy(bl.v), bl.w * F.w, bl.h * F.h);
    ctx.strokeStyle = rgba(GUNMETAL_LIGHT, 0.7);
    ctx.lineWidth = 1;
    ctx.strokeRect(fx(bl.u) + 0.5, fy(bl.v) + 0.5, bl.w * F.w - 1, bl.h * F.h - 1);
    ctx.fillStyle = rgba(WHITE, 0.14);
    ctx.fillRect(fx(bl.u) + 2, fy(bl.v) + 2, bl.w * F.w - 4, 2);
  }
  /* gear band spine */
  ctx.fillStyle = rgba(GUNMETAL_DARK, 0.55);
  ctx.fillRect(fx(0.475), fy(0.20), 3, fy(0.90) - fy(0.20));
  for (i = 0; i < GEARS.length; i++) drawGear(GEARS[i]);
  /* particles: motes behind, then marks, then shards */
  for (i = 0; i < particles.length; i++) if (particles[i].kind === 'mote') drawMote(particles[i]);
  for (i = 0; i < particles.length; i++) if (particles[i].kind === 'mark') drawMark(particles[i]);
  for (i = 0; i < particles.length; i++) if (particles[i].kind === 'shard') drawShard(particles[i]);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Mangled Chamber').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Mangled Chamber').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 10').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Mangled Chamber', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 10', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    particleCount: function () { return particles.length; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60 s, sim pre-run 0 to 60 s in 1/30 s steps ---- */
size();
/* pre-run the pipeline so frame one is populated end to end */
(function () {
  var steps = Math.round(FRAME_T * 30);
  var s;
  for (s = 0; s < steps; s++) stepSim(1 / 30);
  phaseT = FRAME_T;
})();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0, acc = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      acc += dt;
      while (acc >= 1 / 30) { stepSim(1 / 30); acc -= 1 / 30; }
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
