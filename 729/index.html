<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public Trust</title>
<style>
  html, body { margin: 0; padding: 0; background: #E8E2D5; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// Public Trust (EXPANSION #89 paul-ramirez-jonas, block 2)
// A black marquee across the top typesets promises letter by letter in
// white plastic letters, on its own endless seeded loop: the board never
// clears, it re-sets in waves, the oldest promise dropping off as a new
// one arrives. Below, a birch table holds the five oath objects: a book,
// a bottle of water, a stone, a small bell, and two linked pinky fingers.
// TAP an oath object to choose it, then TAP the table: a seeded promise
// is typeset onto the marquee with the object's icon stamped beside it,
// and a graphite rubbing of the promise slides down to you at the
// bottom. TAP-AND-HOLD on the pinky icon performs the pinky promise:
// it posts with a small shake. No real text entry, no ticker, no emoji.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  board: '#0B0B0C',
  letters: '#F5F5F0',
  birch: '#D9B98A',
  stone: '#8A9BA8',
  water: '#4A7FB5',
  bell: '#B08D3E',
  ground: '#E8E2D5'
};

// ---------------------------------------------------------------------------
// Promise corpus. Seeded text only; every entry fits the phone grid
// (24 columns). The stream mixes plain civic promises with generic
// "public figure" style ones, about three to one. No real names.
// ---------------------------------------------------------------------------
var CIVIC = [
  'I promise to wave back', 'I will return the ladder', 'I promise to listen',
  'I will hold the door', 'I promise to show up', 'I will water the plants',
  'I promise to share lunch', 'I will fix the fence', 'I promise to be on time',
  'I will return every call', 'I promise the truth', 'I will sweep the stoop',
  'I promise to bring soup', 'I will save you a seat', 'I promise to keep watch',
  'I will lend my ladder', 'I promise to write back', 'I will mind the store',
  'I promise to stay late', 'I will feed the cat', 'I promise to drive slow',
  'I will keep the light on', 'I promise to ask first', 'I will shovel your walk',
  'I promise to mean it', 'I will guard the garden', 'I promise to bring pie',
  'I will hold the ladder', 'I promise to stay calm', 'I will return the book',
  'I promise to help move', 'I will watch the kids', 'I promise to chip in',
  'I will keep my word', 'I promise to call mom', 'I will rake the leaves',
  'I promise to be kind', 'I will share the road', 'I promise to pitch in',
  'I will lock up at night', 'I promise to own up', 'I will tend the fire',
  'I promise to wait', 'I will bring the chairs', 'I promise to look up',
  'I will keep the gate', 'I promise to say thanks', 'I will walk you home',
  'I promise to dig in', 'I will hold your place', 'I promise to be fair',
  'I will mend the fence', 'I promise to sit awhile', 'I will light the porch',
  'I promise to speak up', 'I will carry the bags', 'I promise to be there',
  'I will watch the door', 'I promise to keep at it', 'I will pass the salt'
];
var PUBLIC = [
  'I will lower your taxes', 'I will fix the roads', 'I promise more jobs',
  'I will cut the red tape', 'I promise safer streets', 'I will fund the schools',
  'I promise cleaner water', 'I will back small shops', 'I promise shorter lines',
  'I will hire more nurses', 'I promise open books', 'I will pave the highway',
  'I promise fair rents', 'I will plant more trees', 'I promise honest work',
  'I will answer to you', 'I promise results fast', 'I will guard the budget',
  'I promise no excuses', 'I will show my work'
];

function makePicker(seed) {
  var rng = mulberry32(seed);
  var last = '';
  return function (maxLen) {
    for (var tries = 0; tries < 60; tries++) {
      var arr = rng() < 0.25 ? PUBLIC : CIVIC;
      var txt = arr[Math.floor(rng() * arr.length)];
      if (txt.length <= maxLen && txt !== last) { last = txt; return txt; }
    }
    last = 'I will keep my word';
    return last;
  };
}

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, isPhone = false;
var ROWS = 4;
var COLS = 26; // 24 on phones; set in resize()

// Typeset timing (seconds).
var LEAD = 0.25;      // pause before a promise's first letter
var CHARD = 0.055;    // per-letter flip-in interval
var FLIP = 0.14;      // single letter flip duration
var HOLD = 1.7;       // pause after a promise completes
var ORIGIN = -1.05;   // schedule origin: frame one is mid-typeset
var SHIFT_DUR = 0.45; // board re-set wave duration

var baseSeed = 72989;
var autoPicker = makePicker(baseSeed);
var userPicker = makePicker(baseSeed + 4242);
var autoTexts = [];   // prefix cache of the auto stream (pure, ordered)

// ---------------------------------------------------------------------------
// Events and the slot schedule. A slot is one promise's turn on the
// board: {text, icon, pinky, fromEvent, start, dur, autoAfter, evAfter}.
// The schedule is a pure function of (seed, events, t): the auto stream
// fills slots in order; a recorded post event is consumed by the first
// slot that starts at or after the event's time. Counters are snapshotted
// per slot so a late event can truncate and rebuild the tail exactly.
// ---------------------------------------------------------------------------
var events = [];      // {time, text, icon, pinky}, time-ordered
var slots = [];
var S = { auto: 0, ev: 0 };

function slotDur(text) { return LEAD + text.length * CHARD + HOLD; }

function ensureAuto(i) {
  while (autoTexts.length <= i) autoTexts.push(autoPicker(COLS));
  return autoTexts[i];
}

function buildSlots(until) {
  var guard = 0;
  while (guard++ < 100000) {
    var start, prevEnd = null;
    if (slots.length === 0) start = ORIGIN;
    else { prevEnd = slots[slots.length - 1].start + slots[slots.length - 1].dur; start = prevEnd; }
    if (slots.length > 0 && start > until) break;
    var ev = S.ev < events.length ? events[S.ev] : null;
    var slot;
    if (ev && ev.time <= start) {
      slot = { text: ev.text, icon: ev.icon, pinky: ev.pinky, fromEvent: true,
               start: start, dur: slotDur(ev.text) };
      S.ev += 1;
    } else {
      var txt = ensureAuto(S.auto);
      slot = { text: txt, icon: null, pinky: false, fromEvent: false,
               start: start, dur: slotDur(txt) };
      S.auto += 1;
    }
    slot.autoAfter = S.auto;
    slot.evAfter = S.ev;
    slots.push(slot);
    if (start > until && slots.length > 1) break;
  }
}

function insertEvent(ev) {
  events.push(ev);
  var keep = 0, i;
  for (i = 0; i < slots.length; i++) {
    if (slots[i].start <= ev.time) keep = i + 1; else break;
  }
  slots.length = keep;
  if (keep > 0) { S.auto = slots[keep - 1].autoAfter; S.ev = slots[keep - 1].evAfter; }
  else { S.auto = 0; S.ev = 0; }
}

// ---------------------------------------------------------------------------
// QA hook (inert in the gallery): ?seed=tNN pins schedule time NN;
// ?seed=uNN also plants one canned post event at t=2 (stone icon).
// ---------------------------------------------------------------------------
var forcedT = -1;
(function () {
  try {
    var m = /[?&]seed=([tu])(\d+(?:\.\d+)?)/.exec(location.search || '');
    if (m) {
      forcedT = parseFloat(m[2]);
      if (m[1] === 'u') insertEvent({ time: 2.0, text: 'I will fix the fence', icon: 'stone', pinky: false });
    }
  } catch (e) { /* inert hook, QA only */ }
})();

// ---------------------------------------------------------------------------
// Layout. One function shared by drawing and hit-testing.
// ---------------------------------------------------------------------------
function layout() {
  var bx = W * 0.035, bw = W * 0.93, by = H * 0.045, bh = H * 0.30;
  var ix = bx + W * 0.02, iw = bw - W * 0.04;
  var iy = by + bh * 0.07, ih = bh * 0.86;
  var tableY = H * 0.56, slabH = H * 0.030;
  var objS = Math.min(H * 0.115, W * 0.15);
  var kinds = ['book', 'water', 'stone', 'bell', 'pinky'];
  var objs = [];
  for (var i = 0; i < 5; i++) {
    objs.push({ kind: kinds[i], cx: W * (0.16 + 0.17 * i), baseY: tableY, s: objS });
  }
  return {
    board: { x: bx, y: by, w: bw, h: bh },
    inner: { x: ix, y: iy, w: iw, h: ih },
    colW: iw / COLS, rowH: ih / ROWS,
    table: { x: W * 0.07, y: tableY, w: W * 0.86, h: slabH },
    objs: objs,
    captionY: H * 0.735,
    rubY: H * 0.90
  };
}

// ---------------------------------------------------------------------------
// Oath object icons, drawn centered in a square box of side s at (cx, cy).
// ---------------------------------------------------------------------------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawIcon(kind, cx, cy, s) {
  var u = s / 100; // unit: design space is 100x100
  ctx.save();
  ctx.translate(cx, cy);
  if (kind === 'book') {
    ctx.fillStyle = COL.board;
    rr(-31 * u, -40 * u, 62 * u, 80 * u, 6 * u); ctx.fill();
    ctx.fillStyle = COL.letters;
    rr(-19 * u, -32 * u, 44 * u, 64 * u, 3 * u); ctx.fill();
    ctx.fillStyle = COL.board;
    ctx.fillRect(-31 * u, -40 * u, 9 * u, 80 * u);
    ctx.fillStyle = COL.bell;
    ctx.beginPath(); ctx.arc(14 * u, -32 * u, 5 * u, 0, Math.PI * 2); ctx.fill();
  } else if (kind === 'water') {
    ctx.fillStyle = COL.water;
    rr(-22 * u, -6 * u, 44 * u, 48 * u, 9 * u); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-22 * u, -6 * u); ctx.lineTo(-9 * u, -30 * u);
    ctx.lineTo(9 * u, -30 * u); ctx.lineTo(22 * u, -6 * u);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(-9 * u, -44 * u, 18 * u, 15 * u);
    ctx.fillStyle = COL.board;
    ctx.fillRect(-11 * u, -52 * u, 22 * u, 9 * u);
    ctx.fillStyle = COL.letters;
    ctx.globalAlpha = 0.30;
    rr(-15 * u, 2 * u, 8 * u, 32 * u, 4 * u); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (kind === 'stone') {
    ctx.fillStyle = COL.stone;
    ctx.beginPath();
    ctx.moveTo(-38 * u, 26 * u); ctx.lineTo(-30 * u, -8 * u);
    ctx.lineTo(-10 * u, -28 * u); ctx.lineTo(16 * u, -30 * u);
    ctx.lineTo(36 * u, -6 * u); ctx.lineTo(38 * u, 26 * u);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = COL.letters;
    ctx.globalAlpha = 0.20;
    ctx.beginPath();
    ctx.moveTo(-30 * u, -8 * u); ctx.lineTo(-10 * u, -28 * u);
    ctx.lineTo(16 * u, -30 * u); ctx.lineTo(2 * u, -2 * u);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (kind === 'bell') {
    ctx.fillStyle = COL.bell;
    ctx.beginPath();
    ctx.arc(0, -26 * u, 8 * u, Math.PI, 0); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-8 * u, -26 * u);
    ctx.quadraticCurveTo(-10 * u, 4 * u, -24 * u, 22 * u);
    ctx.lineTo(24 * u, 22 * u);
    ctx.quadraticCurveTo(10 * u, 4 * u, 8 * u, -26 * u);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(-27 * u, 22 * u, 54 * u, 7 * u);
    ctx.fillStyle = COL.board;
    ctx.beginPath(); ctx.arc(0, 38 * u, 7 * u, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.25;
    ctx.fillRect(-27 * u, 12 * u, 54 * u, 4 * u);
    ctx.globalAlpha = 1;
  } else if (kind === 'pinky') {
    ctx.strokeStyle = COL.board;
    ctx.lineWidth = 15 * u;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-30 * u, 34 * u);
    ctx.quadraticCurveTo(-34 * u, -6 * u, -16 * u, -22 * u);
    ctx.quadraticCurveTo(-2 * u, -34 * u, 0, -14 * u);
    ctx.quadraticCurveTo(1 * u, 0, -6 * u, 10 * u);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(30 * u, 34 * u);
    ctx.quadraticCurveTo(34 * u, -6 * u, 16 * u, -22 * u);
    ctx.quadraticCurveTo(2 * u, -34 * u, 0, -14 * u);
    ctx.quadraticCurveTo(-1 * u, 2 * u, 8 * u, 12 * u);
    ctx.stroke();
  }
  ctx.restore();
}

function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }
function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---------------------------------------------------------------------------
// Drawing.
// ---------------------------------------------------------------------------
var selectedIcon = null;

function draw(t) {
  if (W === 0 || H === 0) return;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var L = layout();

  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, 0, W, H);

  buildSlots(t + 1);

  // --- Marquee board ---
  var B = L.board, I = L.inner;
  ctx.fillStyle = COL.board;
  rr(B.x, B.y, B.w, B.h, Math.min(14, B.h * 0.05)); ctx.fill();
  ctx.strokeStyle = COL.letters;
  ctx.globalAlpha = 0.18;
  ctx.lineWidth = 2;
  rr(B.x + 4, B.y + 4, B.w - 8, B.h - 8, Math.min(11, B.h * 0.04)); ctx.stroke();
  ctx.globalAlpha = 0.30;
  ctx.fillStyle = COL.letters;
  var sc = [[B.x + 13, B.y + 13], [B.x + B.w - 13, B.y + 13], [B.x + 13, B.y + B.h - 13], [B.x + B.w - 13, B.y + B.h - 13]];
  for (var si = 0; si < 4; si++) { ctx.beginPath(); ctx.arc(sc[si][0], sc[si][1], 2.4, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;

  // Letter track lines.
  ctx.strokeStyle = COL.letters;
  ctx.globalAlpha = 0.09;
  ctx.lineWidth = 1;
  for (var r = 0; r < ROWS; r++) {
    var ty = I.y + (r + 0.5) * L.rowH;
    ctx.beginPath(); ctx.moveTo(I.x, ty - L.rowH * 0.30); ctx.lineTo(I.x + I.w, ty - L.rowH * 0.30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(I.x, ty + L.rowH * 0.30); ctx.lineTo(I.x + I.w, ty + L.rowH * 0.30); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // --- Rows ---
  var started = [];
  for (var i = 0; i < slots.length; i++) if (slots[i].start <= t) started.push(slots[i]);
  var count = started.length;
  var shiftP = 0;
  if (count > ROWS && count > 0) {
    var newest = started[count - 1];
    if (t - newest.start < SHIFT_DUR) shiftP = easeInOut(clamp((t - newest.start) / SHIFT_DUR, 0, 1));
  }
  var visCount = count <= ROWS ? count : ROWS + (shiftP > 0 ? 1 : 0);
  var base = count - visCount;
  var fontPx = Math.min(L.rowH * 0.60, L.colW * 0.98);
  ctx.save();
  ctx.beginPath(); ctx.rect(I.x - 2, B.y + 2, I.w + 4, B.h - 4); ctx.clip();
  ctx.font = '700 ' + fontPx.toFixed(1) + 'px "Courier New", Courier, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var vi = 0; vi < visCount; vi++) {
    var slot = started[base + vi];
    var isDropping = count > ROWS && vi === 0 && shiftP > 0;
    var rowAlpha = isDropping ? 1 - shiftP : 1;
    var rowX = isDropping ? -shiftP * L.colW * 1.5 : 0;
    if (slot.pinky && t - slot.start < 0.7 && t >= slot.start) {
      rowX += Math.sin((t - slot.start) * 45) * 4 * (1 - (t - slot.start) / 0.7);
    }
    var cy = I.y + (vi + 0.5 - shiftP) * L.rowH;
    var startCol = 0;
    if (slot.icon) {
      startCol = 2;
      var stampS = L.rowH * 0.78;
      ctx.fillStyle = COL.letters;
      ctx.globalAlpha = 0.12 * rowAlpha;
      rr(I.x + rowX + L.colW * 0.12, cy - stampS / 2, L.colW * 1.76, stampS, 4); ctx.fill();
      ctx.globalAlpha = rowAlpha;
      drawIcon(slot.icon, I.x + rowX + L.colW * 1.0, cy, stampS * 0.82);
    }
    var upper = slot.text.toUpperCase();
    ctx.fillStyle = COL.letters;
    for (var li = 0; li < upper.length; li++) {
      var lt = slot.start + LEAD + li * CHARD;
      var p = clamp((t - lt) / FLIP, 0, 1);
      if (p <= 0) continue;
      var lx = I.x + rowX + (startCol + li + 0.5) * L.colW;
      ctx.save();
      ctx.translate(lx, cy);
      ctx.scale(1, Math.max(0.05, easeOutCubic(p)));
      ctx.globalAlpha = rowAlpha * (0.35 + 0.65 * p);
      ctx.fillText(upper.charAt(li), 0, fontPx * 0.04);
      ctx.restore();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // --- Table ---
  var Tb = L.table;
  ctx.fillStyle = COL.birch;
  ctx.globalAlpha = 0.75;
  ctx.fillRect(Tb.x + W * 0.05, Tb.y + Tb.h, W * 0.022, H * 0.68 - (Tb.y + Tb.h));
  ctx.fillRect(Tb.x + Tb.w - W * 0.05 - W * 0.022, Tb.y + Tb.h, W * 0.022, H * 0.68 - (Tb.y + Tb.h));
  ctx.globalAlpha = 1;
  ctx.fillStyle = COL.board;
  ctx.globalAlpha = 0.08;
  ctx.fillRect(0, H * 0.685, W, 2);
  ctx.globalAlpha = 1;
  // Soft shadows, then objects, then the slab front edge.
  for (var oi = 0; oi < L.objs.length; oi++) {
    var o = L.objs[oi];
    ctx.fillStyle = COL.board;
    ctx.globalAlpha = 0.13;
    ctx.beginPath(); ctx.ellipse(o.cx, o.baseY + 3, o.s * 0.42, o.s * 0.07, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = COL.birch;
  rr(Tb.x, Tb.y, Tb.w, Tb.h, 4); ctx.fill();
  ctx.fillStyle = COL.board;
  ctx.globalAlpha = 0.15;
  ctx.fillRect(Tb.x, Tb.y + Tb.h - 3, Tb.w, 3);
  ctx.globalAlpha = 1;
  for (var oj = 0; oj < L.objs.length; oj++) {
    var ob = L.objs[oj];
    var sel = selectedIcon === ob.kind;
    var lift = sel ? H * 0.008 : 0;
    if (sel) {
      ctx.strokeStyle = COL.board;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 2;
      rr(ob.cx - ob.s * 0.58, ob.baseY - ob.s - lift - ob.s * 0.08, ob.s * 1.16, ob.s * 1.16, 8); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = COL.board;
      ctx.fillRect(ob.cx - ob.s * 0.30, ob.baseY + H * 0.012, ob.s * 0.60, 3);
    }
    drawIcon(ob.kind, ob.cx, ob.baseY - ob.s / 2 - lift, ob.s);
  }

  // --- Caption ---
  ctx.fillStyle = COL.board;
  ctx.globalAlpha = 0.55;
  ctx.font = '600 ' + Math.max(12, H * 0.017).toFixed(1) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('make your promise', W / 2, L.captionY);
  ctx.globalAlpha = 1;

  // --- Graphite rubbing (latest posted promise) ---
  var rubSlot = null;
  for (var ri = started.length - 1; ri >= 0; ri--) {
    if (started[ri].fromEvent) { rubSlot = started[ri]; break; }
  }
  if (rubSlot) {
    var rp = easeOutCubic(clamp((t - rubSlot.start) / 0.8, 0, 1));
    if (rp > 0) {
      var rFont = Math.min(L.rowH * 0.44, H * 0.024);
      ctx.font = '700 ' + rFont.toFixed(1) + 'px "Courier New", Courier, monospace';
      var rText = rubSlot.text.toUpperCase();
      var tw = ctx.measureText(rText).width;
      var slipW = Math.min(W * 0.92, tw + rFont * 3.4);
      var slipH = H * 0.052;
      var slipX = (W - slipW) / 2;
      var slipY = L.rubY - slipH / 2 + (1 - rp) * H * 0.03;
      ctx.globalAlpha = rp;
      ctx.fillStyle = COL.letters;
      rr(slipX, slipY, slipW, slipH, 5); ctx.fill();
      if (rubSlot.icon) drawIcon(rubSlot.icon, slipX + rFont * 1.05, L.rubY + (1 - rp) * H * 0.03, slipH * 0.66);
      ctx.fillStyle = COL.board;
      ctx.globalAlpha = rp * 0.52;
      ctx.textAlign = 'center';
      ctx.fillText(rText, W / 2 + (rubSlot.icon ? rFont * 0.55 : 0), L.rubY + (1 - rp) * H * 0.03 + rFont * 0.04);
      ctx.globalAlpha = 1;
    }
  }
}

// ---------------------------------------------------------------------------
// Sizing and main loop.
// ---------------------------------------------------------------------------
function resize() {
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = Math.round(vw);
  H = Math.round(vh);
  canvas.width = W;
  canvas.height = H;
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  COLS = isPhone ? 24 : 26;
  if (forcedT >= 0) draw(forcedT);
  else draw(loopStarted ? elapsed() : 0);
}

var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
function elapsed() {
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp;
  return (now - startStamp) / 1000;
}

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (window.addEventListener) window.addEventListener('resize', resize);

// ---------------------------------------------------------------------------
// The toll: choose an oath object, then tap the table to post. Tap-and-
// hold on the pinky posts the pinky promise outright, with a shake.
// ---------------------------------------------------------------------------
var downInfo = null;

function hitTest(x, y) {
  var L = layout();
  for (var i = 0; i < L.objs.length; i++) {
    var o = L.objs[i];
    var dx = x - o.cx, dy = y - (o.baseY - o.s / 2);
    if (Math.abs(dx) < o.s * 0.62 && Math.abs(dy) < o.s * 0.68) return { kind: 'object', icon: o.kind };
  }
  var Tb = L.table;
  if (x > Tb.x - W * 0.02 && x < Tb.x + Tb.w + W * 0.02 && y > Tb.y - H * 0.02 && y < Tb.y + Tb.h + H * 0.03) {
    return { kind: 'table' };
  }
  return { kind: 'none' };
}

function postPromise(icon, pinky) {
  insertEvent({ time: elapsed(), text: userPicker(COLS - 2), icon: icon, pinky: pinky });
}

if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    if (forcedT >= 0) return;
    var x = (typeof e.clientX === 'number') ? e.clientX : 0;
    var y = (typeof e.clientY === 'number') ? e.clientY : 0;
    downInfo = { x: x, y: y, time: elapsed(), hit: hitTest(x, y), fired: false };
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!downInfo || downInfo.fired) { downInfo = null; return; }
    var dt = elapsed() - downInfo.time;
    var x = (typeof e.clientX === 'number') ? e.clientX : downInfo.x;
    var y = (typeof e.clientY === 'number') ? e.clientY : downInfo.y;
    var moved = Math.abs(x - downInfo.x) + Math.abs(y - downInfo.y);
    var hit = downInfo.hit;
    downInfo = null;
    if (dt > 0.5 || moved > 14) return;
    if (hit.kind === 'object') selectedIcon = hit.icon;
    else if (hit.kind === 'table' && selectedIcon) postPromise(selectedIcon, false);
  });
  canvas.addEventListener('pointercancel', function () { downInfo = null; });
}

// Frame one: synchronous draw at schedule t=0 (deterministic).
var loopStarted = false;
resize();

if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    loopStarted = true;
    if (forcedT < 0) {
      // Pinky hold: fires once the press has lasted 0.45 s.
      if (downInfo && !downInfo.fired && downInfo.hit.kind === 'object' && downInfo.hit.icon === 'pinky'
          && elapsed() - downInfo.time >= 0.45) {
        downInfo.fired = true;
        selectedIcon = 'pinky';
        postPromise('pinky', true);
      }
      draw(elapsed());
    } else {
      draw(forcedT);
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
