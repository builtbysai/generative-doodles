<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.319 Crackle Screen</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5F1E6; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.319 Crackle Screen (Coral Cockatoo).
// Their Marble Crackle screen as a flat printed graphic: a black
// crackle network on white paper, treated as a repeating printed
// tile rather than a glaze. The screen is a window onto an endless
// field, bigger than the frame. One tile holds exactly 40 voronoi
// cells, exactly 2 of them tinted celadon, exactly 5 percent. The
// tile is drawn 3x3 as path data each frame on ONE canvas, no
// offscreen tile. Drag pans the field with wraparound at one tile
// period and release leaves the pan where it stopped. Every
// exactly 14s one crack extends one segment, following a
// precomputed authored sequence of 24 steps per constellation;
// extensions accumulate and hold. Tap advances to the next of 5
// authored constellations in fixed order. Frame one is already
// panned a little off the tile origin with the first extension
// drawn, so the print reads as a window, not a poster.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var INK = '#1E1B16', PAPER = '#F5F1E6', CELADON = '#9DBEA3';
var DW = 1280, DH = 900;
var TW = 640, TH = 450; // one tile period, design units
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }

// ---- constellations: exactly 5, exactly 40 cells per tile -----
var CONSTELLATIONS = 5;
// Authored accent cell indices per constellation: exactly 2 of
// the 40 cells, exactly 5 percent, celadon fixed for all five.
var ACCENTS = [[1, 32], [17, 20], [10, 27], [1, 36], [10, 39]];
var EXT_STEPS = 24;
var consts = [];
var ci, ai;
for (ci = 0; ci < CONSTELLATIONS; ci++) {
  var r0 = rng(31911 + ci * 137);
  var sites = [];
  for (ai = 0; ai < 40; ai++) sites.push({ x: r0() * TW, y: r0() * TH });
  if (sites.length !== 40) throw new Error('Crackle Screen needs exactly 40 cells per tile');
  if (ACCENTS[ci].length !== 2) throw new Error('Crackle Screen needs exactly 2 accented cells per tile');
  if (ACCENTS[ci][0] === ACCENTS[ci][1]) throw new Error('Crackle Screen accent cells must be distinct');
  consts.push({ sites: sites, cells: null, ext: null });
}
if (consts.length !== 5) throw new Error('Crackle Screen needs exactly 5 constellations');

// Clip polygon to the half plane of points at least as close to
// s as to o (Sutherland style, bisector clip).
function clipBisector(poly, s, o) {
  var mx = (s.x + o.x) / 2, my = (s.y + o.y) / 2;
  var dx = o.x - s.x, dy = o.y - s.y;
  var out = [], i, a, b, da, db;
  for (i = 0; i < poly.length; i++) {
    a = poly[i]; b = poly[(i + 1) % poly.length];
    da = (a.x - mx) * dx + (a.y - my) * dy;
    db = (b.x - mx) * dx + (b.y - my) * dy;
    if (da <= 0) out.push(a);
    if ((da < 0 && db > 0) || (da > 0 && db < 0)) {
      var t = da / (da - db);
      out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    }
  }
  return out;
}
function distToTile(x, y) {
  var dx = x < 0 ? -x : (x > TW ? x - TW : 0);
  var dy = y < 0 ? -y : (y > TH ? y - TH : 0);
  return Math.sqrt(dx * dx + dy * dy);
}

// Build one constellation on first use: the toroidal voronoi
// cells clipped to the tile, plus its authored extension
// sequence of exactly 24 segments grown from network vertices.
function buildConst(c) {
  var con = consts[c];
  if (con.cells) return con;
  var copies = [], i, j, gx, gy, s, o;
  for (gx = -1; gx <= 1; gx++) for (gy = -1; gy <= 1; gy++) {
    for (i = 0; i < con.sites.length; i++) {
      s = con.sites[i];
      copies.push({ x: s.x + gx * TW, y: s.y + gy * TH, idx: i });
    }
  }
  var cells = [];
  for (i = 0; i < copies.length; i++) {
    s = copies[i];
    if (distToTile(s.x, s.y) > 340) continue;
    var poly = [{ x: 0, y: 0 }, { x: TW, y: 0 }, { x: TW, y: TH }, { x: 0, y: TH }];
    for (j = 0; j < copies.length && poly.length; j++) {
      if (j === i) continue;
      o = copies[j];
      var ddx = o.x - s.x, ddy = o.y - s.y;
      if (ddx * ddx + ddy * ddy > 1440000) continue;
      if (ddx === 0 && ddy === 0) continue;
      poly = clipBisector(poly, s, o);
    }
    if (poly.length >= 3) cells.push({ idx: s.idx, poly: poly });
  }
  con.cells = cells;
  // Network vertices, deduplicated, for extension start points.
  var seen = {}, verts = [], k, p, key;
  for (i = 0; i < cells.length; i++) {
    for (k = 0; k < cells[i].poly.length; k++) {
      p = cells[i].poly[k];
      key = Math.round(p.x * 10) + ',' + Math.round(p.y * 10);
      if (!seen[key]) { seen[key] = 1; verts.push(p); }
    }
  }
  var r = rng(31977 + c * 91);
  var ext = [];
  for (i = 0; i < EXT_STEPS; i++) {
    var v = verts[Math.floor(r() * verts.length)];
    var ang = r() * Math.PI * 2, len = 16 + r() * 26;
    ext.push({ x1: v.x, y1: v.y, x2: v.x + Math.cos(ang) * len, y2: v.y + Math.sin(ang) * len });
  }
  if (ext.length !== 24) throw new Error('Crackle Screen needs exactly 24 extension steps per constellation');
  con.ext = ext;
  return con;
}

// ---- state ------------------------------------------------------
// Frame one is already panned a little off the tile origin.
var pan = { x: 73, y: 41 };
var cur = 0;
var growthStart = 0; // T of the current constellation's first beat
buildConst(0);

function extShown() {
  var n = 1 + Math.floor((T - growthStart) / 14);
  if (n < 1) n = 1;
  if (n > EXT_STEPS) n = EXT_STEPS;
  return n;
}

function drawTile(con, bx, by, shown) {
  var i, k, cell, p;
  // Accent cells first, flat celadon under the crackle lines.
  ctx.fillStyle = CELADON;
  for (i = 0; i < con.cells.length; i++) {
    cell = con.cells[i];
    if (cell.idx !== ACCENTS[cur][0] && cell.idx !== ACCENTS[cur][1]) continue;
    ctx.beginPath();
    for (k = 0; k < cell.poly.length; k++) {
      p = cell.poly[k];
      if (k === 0) ctx.moveTo(bx + p.x, by + p.y); else ctx.lineTo(bx + p.x, by + p.y);
    }
    ctx.closePath();
    ctx.fill();
  }
  // The whole crackle network as one path of cell edges.
  // Segments lying on the tile border are clip artifacts, not
  // crackle: skipping them is what makes the tiling seamless.
  st(INK, 2.4);
  ctx.beginPath();
  for (i = 0; i < con.cells.length; i++) {
    cell = con.cells[i];
    for (k = 0; k < cell.poly.length; k++) {
      p = cell.poly[k];
      var q = cell.poly[(k + 1) % cell.poly.length];
      if ((p.x < 0.01 && q.x < 0.01) || (p.x > TW - 0.01 && q.x > TW - 0.01) ||
          (p.y < 0.01 && q.y < 0.01) || (p.y > TH - 0.01 && q.y > TH - 0.01)) continue;
      ctx.moveTo(bx + p.x, by + p.y);
      ctx.lineTo(bx + q.x, by + q.y);
    }
  }
  ctx.stroke();
  // Revealed extension segments, part of the same tile data.
  if (shown > 0) {
    st(INK, 2.4);
    ctx.beginPath();
    for (i = 0; i < shown; i++) {
      ctx.moveTo(bx + con.ext[i].x1, by + con.ext[i].y1);
      ctx.lineTo(bx + con.ext[i].x2, by + con.ext[i].y2);
    }
    ctx.stroke();
  }
}

function draw() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, DW, DH);
  var con = consts[cur];
  var shown = extShown();
  // Pan wraparound at one tile period; 3x3 tile copies cover the
  // full design space for any pan position.
  var bx = -(((pan.x % TW) + TW) % TW);
  var by = -(((pan.y % TH) + TH) % TH);
  var i, j;
  for (i = 0; i < 3; i++) for (j = 0; j < 3; j++) {
    drawTile(con, bx + i * TW, by + j * TH, shown);
  }
}

// ---- interaction -------------------------------------------------
var drag = null;
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  drag = { x: p[0], y: p[1], sx: p[0], sy: p[1], moved: 0 };
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var p = toDesign(e);
  pan.x += p[0] - drag.x;
  pan.y += p[1] - drag.y;
  drag.x = p[0]; drag.y = p[1];
  drag.moved = Math.max(drag.moved, Math.abs(p[0] - drag.sx), Math.abs(p[1] - drag.sy));
});
function endDrag(e) {
  if (drag && drag.moved < 9) {
    // Tap: next constellation in the authored rotation of 5.
    cur = (cur + 1) % CONSTELLATIONS;
    buildConst(cur);
    growthStart = T;
  }
  drag = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', function () { drag = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  // Cover-fit: this is a full-bleed field composition.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
