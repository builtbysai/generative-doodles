<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encasement</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #F7F5F0;
  }
  canvas {
    display: block;
    position: fixed;
    left: 0;
    top: 0;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- Palette (strict) ----
  var ROOM = '#F7F5F0';
  var HALO = '#F0F4FA';
  var CORE = '#FFFFFF';
  // Tonality states: white (default) -> blue -> rose -> white ...
  var STATES = [
    { panel: '#FBFAF7', edge: '#DCEBFF' },
    { panel: '#C9D9F2', edge: '#BFD4FF' },
    { panel: '#F2D9D4', edge: '#FFD9CF' }
  ];

  function hexRgb(hex) {
    return [
      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16)
    ];
  }
  function mixRgb(a, b, f) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * f),
      Math.round(a[1] + (b[1] - a[1]) * f),
      Math.round(a[2] + (b[2] - a[2]) * f)
    ];
  }
  function rgba(c, a) {
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  var ROOM_RGB = hexRgb(ROOM);
  var HALO_RGB = hexRgb(HALO);
  var CORE_RGB = hexRgb(CORE);
  var STATE_RGB = STATES.map(function (s) {
    return { panel: hexRgb(s.panel), edge: hexRgb(s.edge) };
  });
  // Coved-corner shading tone: room pulled slightly toward the halo tone.
  var COVE_RGB = mixRgb(ROOM_RGB, HALO_RGB, 0.55);

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- Sizing: Visual Viewport API first, window fallback ----
  var W = 0, H = 0, DPR = 1;
  function viewSize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 0);
    var h = vv ? vv.height : (window.innerHeight || 0);
    return { w: w, h: h };
  }
  function resize() {
    var s = viewSize();
    W = Math.max(1, Math.round(s.w));
    H = Math.max(1, Math.round(s.h));
    DPR = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  if (typeof window !== 'undefined' && window.visualViewport &&
      typeof window.visualViewport.addEventListener === 'function') {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }

  // ---- Phone detection: window.screen physical size, aspect fallback ----
  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
    return H > W * 1.15;
  }

  function rr(x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  // ---- Interaction state: everything is closed-form in (events, t) ----
  var taps = [];          // piece-time of each tap (tonality cycle)
  var seg = null;         // active parallax segment {t0, ox, oy, tx, ty}
  var drag = null;        // live drag {sx, sy, moved, tDown}
  var lastT = 0;

  function offsetAt(t) {
    if (!seg) return { x: 0, y: 0 };
    var dt = Math.max(0, t - seg.t0);
    var k = Math.exp(-dt / 0.45); // ease toward target; release target is 0 (decay home)
    return {
      x: seg.tx + (seg.ox - seg.tx) * k,
      y: seg.ty + (seg.oy - seg.ty) * k
    };
  }
  function currentTarget() {
    return seg ? { x: seg.tx, y: seg.ty } : { x: 0, y: 0 };
  }

  function onDown(x, y, t) {
    var o = offsetAt(t);
    drag = { sx: x, sy: y, moved: false, tDown: t };
    seg = { t0: t, ox: o.x, oy: o.y, tx: o.x, ty: o.y };
  }
  function onMove(x, y, t) {
    if (!drag) return;
    var dx = x - drag.sx, dy = y - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 7) drag.moved = true;
    if (!drag.moved) return;
    var o = offsetAt(t);
    var lim = 0.03; // parallax capped at +-3% of panel size (applied at draw)
    var tx = Math.max(-1, Math.min(1, dx / (W * 0.35))) * lim;
    var ty = Math.max(-1, Math.min(1, dy / (H * 0.35))) * lim;
    seg = { t0: t, ox: o.x, oy: o.y, tx: tx, ty: ty };
  }
  function onUp(t) {
    if (!drag) return;
    var o = offsetAt(t);
    if (!drag.moved && t - drag.tDown < 0.35) {
      taps.push(t); // tap cycles tonality (specced mode change)
    }
    seg = { t0: t, ox: o.x, oy: o.y, tx: 0, ty: 0 }; // gentle decay home
    drag = null;
  }

  if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
    window.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY, lastT); });
    window.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY, lastT); });
    window.addEventListener('pointerup', function () { onUp(lastT); });
    window.addEventListener('pointercancel', function () { onUp(lastT); });
  }

  // ---- Tonality: closed-form crossfade from the recorded tap list ----
  function smooth(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }
  function tonalityAt(t) {
    var n = taps.length;
    if (n === 0) return STATE_RGB[0];
    var cur = STATE_RGB[n % 3];
    var prev = STATE_RGB[(n - 1) % 3];
    var f = smooth((t - taps[n - 1]) / 2); // 2 s crossfade
    return {
      panel: mixRgb(prev.panel, cur.panel, f),
      edge: mixRgb(prev.edge, cur.edge, f)
    };
  }

  // Point at parameter u along a rect perimeter (0 = top-left, clockwise).
  function perimPoint(x, y, w, h, u) {
    var p = 2 * (w + h);
    var d = ((u % 1) + 1) % 1 * p;
    if (d < w) return { x: x + d, y: y };
    d -= w;
    if (d < h) return { x: x + w, y: y + d };
    d -= h;
    if (d < w) return { x: x + w - d, y: y + h };
    d -= w;
    return { x: x, y: y + h - d };
  }

  function draw(t) {
    if (W === 0) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var phone = isPhone();
    var cx = W / 2, cy = H / 2;
    var panel = Math.min(H * 0.45, W * (phone ? 0.74 : 0.62));
    var px = cx - panel / 2, py = cy - panel / 2;

    var ton = tonalityAt(t);
    var haloRgb = mixRgb(HALO_RGB, ton.edge, 0.35);
    var off = offsetAt(t);
    var hx = cx + off.x * panel, hy = cy + off.y * panel;

    // Room
    ctx.fillStyle = rgba(ROOM_RGB, 1);
    ctx.fillRect(0, 0, W, H);

    // Coved corners: layered quarter-ellipses pull each corner softly away,
    // so the room never presents a hard angle.
    var cw = Math.max(W, H) * 0.62;
    var corners = [
      { x: 0, y: 0 }, { x: W, y: 0 }, { x: 0, y: H }, { x: W, y: H }
    ];
    for (var ci = 0; ci < corners.length; ci++) {
      for (var li = 14; li >= 1; li--) {
        var f = li / 14;
        ctx.beginPath();
        ctx.ellipse(corners[ci].x, corners[ci].y, cw * f, cw * f, 0, 0, Math.PI * 2);
        ctx.fillStyle = rgba(COVE_RGB, 0.02);
        ctx.fill();
      }
    }

    // Halo: many layered copies bleeding outward, alpha fading to nothing.
    var LAYERS = 30;
    for (var i = LAYERS; i >= 1; i--) {
      var hf = i / LAYERS;                    // 1 at the rim, -> 0 at panel
      var hs = panel * (1 + hf * 1.5);        // extends to ~2.5x panel width
      var ha = 0.05 * Math.pow(1 - hf, 1.6) + 0.012 * (1 - hf);
      rr(hx - hs / 2, hy - hs / 2, hs, hs, hs * 0.08);
      ctx.fillStyle = rgba(haloRgb, ha);
      ctx.fill();
    }

    // Panel body: stepped inset bands, brightest at the edge, falling inward.
    rr(px, py, panel, panel, panel * 0.03);
    ctx.fillStyle = rgba(mixRgb(ton.panel, ton.edge, 0.30), 1);
    ctx.fill();
    var BANDS = 16;
    for (var b = 1; b <= BANDS; b++) {
      var bf = b / BANDS;
      var inset = bf * panel * 0.5;
      var bc = mixRgb(ton.panel, ton.edge, 0.30 * (1 - bf));
      rr(px + inset, py + inset, panel - inset * 2, panel - inset * 2, panel * 0.03);
      ctx.fillStyle = rgba(bc, 0.55);
      ctx.fill();
    }

    // Neon edge line inside the panel edges: layered strokes, white core.
    var e = Math.max(3, panel * 0.03);
    var ex = px + e, ey = py + e, ew = panel - e * 2, eh = panel - e * 2;
    var er = panel * 0.018;
    ctx.lineJoin = 'round';
    rr(ex, ey, ew, eh, er);
    ctx.strokeStyle = rgba(ton.edge, 0.10);
    ctx.lineWidth = panel * 0.05;
    ctx.stroke();
    rr(ex, ey, ew, eh, er);
    ctx.strokeStyle = rgba(ton.edge, 0.30);
    ctx.lineWidth = panel * 0.02;
    ctx.stroke();
    rr(ex, ey, ew, eh, er);
    ctx.strokeStyle = rgba(ton.edge, 0.85);
    ctx.lineWidth = Math.max(2, panel * 0.007);
    ctx.stroke();
    rr(ex, ey, ew, eh, er);
    ctx.strokeStyle = rgba(CORE_RGB, 0.95);
    ctx.lineWidth = Math.max(1.2, panel * 0.0032);
    ctx.stroke();

    // Bright point: the edge glow gathers where the view leans.
    var mag = Math.min(1, Math.sqrt(off.x * off.x + off.y * off.y) / 0.03);
    var u = 0.125 + off.x / 0.03 * 0.10 + off.y / 0.03 * 0.22;
    var bp = perimPoint(ex, ey, ew, eh, u);
    var brad = panel * 0.055;
    for (var g = 3; g >= 1; g--) {
      ctx.beginPath();
      ctx.ellipse(bp.x, bp.y, brad * g, brad * g, 0, 0, Math.PI * 2);
      ctx.fillStyle = rgba(CORE_RGB, (0.10 + 0.16 * mag) / g);
      ctx.fill();
    }
  }

  // ---- Run: frame one is synchronous at t=0; rAF (if present) anchors elapsed time ----
  resize();
  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    var epoch = null;
    var loop = function (ts) {
      if (epoch === null) epoch = ts;
      lastT = (ts - epoch) / 1000;
      draw(lastT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
