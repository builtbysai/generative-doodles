<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calla Dive</title>
<style>
  html, body { margin: 0; padding: 0; background: #5B8CB0; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette
  var WATER_TOP = '#5B8CB0';
  var WATER_BOT = '#3D6B8A';
  var PETAL = '#F7F4EC';
  var PETAL_SHADOW = '#D8D2C0';
  var SPADIX = '#D9A03F';
  var CAP = '#D61F26';
  var SKIN = '#EBC9A8';

  var LOOP = 36;          // seconds, full seamless loop
  var FIXED_PHASE = 24.0; // constant first frame: mid-dive (dive runs 23s..25s)

  // Seeded RNG (mulberry32, fixed seed)
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Precomputed seeded grain: identical every frame.
  var grain = [];
  (function buildGrain() {
    var rnd = mulberry32(480057);
    for (var i = 0; i < 850; i++) {
      grain.push({
        x: rnd(), y: rnd(),
        r: 0.6 + rnd() * 1.5,
        a: 0.025 + rnd() * 0.05,
        light: rnd() > 0.5
      });
    }
  })();

  var vw = 300, vh = 300, dpr = 1, isPhone = false;

  function resize() {
    var vv = window.visualViewport;
    vw = vv ? vv.width : window.innerWidth;
    vh = vv ? vv.height : window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    if (window.screen && window.screen.width && window.screen.height) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = vh > vw * 1.15;
    }
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  // Timeline (all periods divide 36s):
  //   0..23   long still approach: she hangs arched high above the lily, barely drifting
  //   23..25  dive along an arc into the throat (2s)
  //   25..28  swallowed: she sinks behind the front petal as the petals close gently (3s)
  //   28..36  held breath inside: spadix pulses softly (8s)
  //   35..36  seam: petals reopen and she fades back in above, so the wrap to 0 is continuous
  function stateAt(p) {
    var close, diverAlpha, diveT, sinkT, breath;
    if (p < 23) {
      close = 0; diverAlpha = 1; diveT = 0; sinkT = 0; breath = 0;
    } else if (p < 25) {
      close = 0; diverAlpha = 1; diveT = easeInOut((p - 23) / 2); sinkT = 0; breath = 0;
    } else if (p < 28) {
      var q = (p - 25) / 3;
      close = easeInOut(q); diveT = 1; sinkT = easeInOut(q);
      diverAlpha = 1 - clamp01((q - 0.45) / 0.55); breath = 0;
    } else if (p < 35) {
      close = 1; diverAlpha = 0; diveT = 1; sinkT = 1; breath = 1;
    } else {
      var r = (p - 35) / 1;
      close = 1 - easeInOut(r); diverAlpha = easeOut(r); diveT = 0; sinkT = 0; breath = 1;
    }
    return { close: close, alpha: diverAlpha, diveT: diveT, sinkT: sinkT, breath: breath };
  }

  function drawDiver(cx, y, s, rot, alpha) {
    if (alpha <= 0.001) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, y);
    ctx.rotate(rot);
    ctx.scale(s, s);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Far leg
    ctx.strokeStyle = SKIN; ctx.globalAlpha = alpha * 0.82; ctx.lineWidth = 0.15;
    ctx.beginPath();
    ctx.moveTo(-0.30, -1.26); ctx.lineTo(-0.13, -0.66); ctx.lineTo(0.03, -0.16);
    ctx.stroke();
    // Far pointed foot
    ctx.lineWidth = 0.10;
    ctx.beginPath();
    ctx.moveTo(-0.30, -1.26); ctx.lineTo(-0.20, -1.50);
    ctx.stroke();
    ctx.globalAlpha = alpha;

    // Near leg
    ctx.lineWidth = 0.17;
    ctx.beginPath();
    ctx.moveTo(-0.62, -1.12); ctx.lineTo(-0.38, -0.60); ctx.lineTo(0.0, -0.18);
    ctx.stroke();
    // Near pointed foot
    ctx.lineWidth = 0.10;
    ctx.beginPath();
    ctx.moveTo(-0.62, -1.12); ctx.lineTo(-0.72, -1.38);
    ctx.stroke();

    // Torso: arched back from hips down to shoulders
    ctx.strokeStyle = SKIN; ctx.lineWidth = 0.32;
    ctx.beginPath();
    ctx.moveTo(0.0, -0.18);
    ctx.quadraticCurveTo(0.40, 0.02, 0.52, 0.42);
    ctx.stroke();
    // Suit band drawn along the very same torso curve, so it can never drift off her back
    ctx.strokeStyle = WATER_BOT; ctx.lineWidth = 0.35;
    ctx.beginPath();
    var qx, qy, qt;
    for (var qi = 0; qi <= 8; qi++) {
      qt = qi / 8 * 0.58;
      qx = (1 - qt) * (1 - qt) * 0.0 + 2 * (1 - qt) * qt * 0.40 + qt * qt * 0.52;
      qy = (1 - qt) * (1 - qt) * (-0.18) + 2 * (1 - qt) * qt * 0.02 + qt * qt * 0.42;
      if (qi === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy);
    }
    ctx.stroke();
    // Neck: shoulder into the cap
    ctx.strokeStyle = SKIN; ctx.lineWidth = 0.20;
    ctx.beginPath();
    ctx.moveTo(0.52, 0.42); ctx.lineTo(0.62, 0.56);
    ctx.stroke();

    // Far arm, reaching down toward the throat
    ctx.strokeStyle = SKIN; ctx.globalAlpha = alpha * 0.82; ctx.lineWidth = 0.12;
    ctx.beginPath();
    ctx.moveTo(0.50, 0.40); ctx.lineTo(0.82, 0.82);
    ctx.stroke();
    ctx.globalAlpha = alpha;
    // Near arm
    ctx.lineWidth = 0.14;
    ctx.beginPath();
    ctx.moveTo(0.54, 0.44); ctx.lineTo(0.98, 0.94);
    ctx.stroke();

    // Head: the red swim cap, at the low end. No face detail.
    ctx.fillStyle = CAP;
    ctx.beginPath();
    ctx.arc(0.66, 0.60, 0.185, 0, Math.PI * 2);
    ctx.fill();
    // Small cap brim toward the dive direction
    ctx.beginPath();
    ctx.arc(0.74, 0.70, 0.10, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function draw(p) {
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var W = vw, H = vh;
    var st = stateAt(p);

    // Water field
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, WATER_TOP);
    g.addColorStop(1, WATER_BOT);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Geometry: lily centre at ~55% of frame height, spanning ~70% width.
    var cx = W * 0.5;
    var cy = H * 0.55;
    var lw = Math.min(W * 0.70, H * 0.88);
    var lh = H * 0.50;
    if (isPhone) { lw = Math.min(W * 0.82, H * 0.88); }

    var close = st.close;
    // Gentle deterministic petal breathing, period 12s (divides 36).
    var sway = Math.sin((p / 12) * Math.PI * 2) * 0.018 * (1 - close);
    function PX(fx) { return cx + fx * lw; }
    function PY(fy) { return cy + fy * lh; }
    // Key points lerp between open and closed by the curl parameter.
    function KP(ox, oy, qx, qy) {
      var t = close;
      return [PX(lerp(ox, qx, t) + sway * lw * 0.1), PY(lerp(oy, qy, t))];
    }

    var B = [cx, PY(0.52)]; // petal convergence, bottom of the spathe

    // Stem, sinking into the deep water below
    ctx.fillStyle = 'rgba(38,74,99,0.55)';
    ctx.beginPath();
    ctx.moveTo(B[0] - lw * 0.035, B[1] - lh * 0.02);
    ctx.quadraticCurveTo(cx - lw * 0.02, PY(0.85), cx - lw * 0.012, H + 4);
    ctx.lineTo(cx + lw * 0.030, H + 4);
    ctx.quadraticCurveTo(cx + lw * 0.035, PY(0.82), B[0] + lw * 0.038, B[1] - lh * 0.02);
    ctx.closePath();
    ctx.fill();

    // Back petal: the tall hood of the spathe, rising to a distinct pointed
    // tip that leans and curls slightly, then falling away to the right.
    var lSh = KP(-0.46, 0.00, -0.28, 0.02);     // left shoulder
    var rSh = KP(0.44, -0.04, 0.27, 0.02);      // right shoulder
    var tip = KP(0.10, -0.74, 0.03, -0.56);     // pointed tip
    ctx.fillStyle = PETAL;
    ctx.beginPath();
    ctx.moveTo(B[0], B[1]);
    ctx.bezierCurveTo(PX(-0.44), PY(0.30), lSh[0] - lw * 0.04, lSh[1] + lh * 0.20, lSh[0], lSh[1]);
    ctx.bezierCurveTo(lSh[0] + lw * 0.03, lSh[1] - lh * 0.34, PX(-0.16), PY(lerp(-0.60, -0.46, close)), tip[0] - lw * 0.085, tip[1] + lh * 0.10);
    ctx.quadraticCurveTo(tip[0] - lw * 0.01, tip[1] + lh * 0.01, tip[0], tip[1]);
    ctx.bezierCurveTo(PX(0.30), PY(lerp(-0.58, -0.44, close)), rSh[0] + lw * 0.05, rSh[1] - lh * 0.26, rSh[0], rSh[1]);
    ctx.bezierCurveTo(rSh[0] - lw * 0.01, rSh[1] + lh * 0.30, PX(0.42), PY(0.30), B[0], B[1]);
    ctx.closePath();
    ctx.fill();

    // Inner wrap: shadow petal inside the hood, giving the throat its depth.
    var iL = KP(-0.265, 0.03, -0.175, 0.05);
    var iR = KP(0.275, 0.01, 0.175, 0.05);
    var iT = KP(0.05, -0.36, 0.015, -0.27);
    ctx.fillStyle = PETAL_SHADOW;
    ctx.beginPath();
    ctx.moveTo(B[0], B[1]);
    ctx.bezierCurveTo(PX(-0.25), PY(0.28), iL[0] - lw * 0.03, iL[1] + lh * 0.14, iL[0], iL[1]);
    ctx.bezierCurveTo(iL[0] + lw * 0.05, iL[1] - lh * 0.24, iT[0] - lw * 0.07, iT[1] + lh * 0.05, iT[0], iT[1]);
    ctx.bezierCurveTo(iT[0] + lw * 0.09, iT[1] + lh * 0.04, iR[0] + lw * 0.02, iR[1] - lh * 0.20, iR[0], iR[1]);
    ctx.bezierCurveTo(iR[0] - lw * 0.02, iR[1] + lh * 0.26, PX(0.23), PY(0.28), B[0], B[1]);
    ctx.closePath();
    ctx.fill();

    // Spadix: mustard column at the centre of the throat, with a soft pulse.
    var pulsePhase = (p / 4) * Math.PI * 2; // period 4s, divides 36
    var pulse = st.breath > 0
      ? 0.5 + 0.30 * Math.sin(pulsePhase)
      : 0.30 + 0.12 * Math.sin(pulsePhase);
    var spTop = PY(lerp(-0.36, -0.22, close));
    var spBase = PY(0.20);
    var spX = cx + lw * 0.015;
    var spW = lw * 0.062 * (1 - close * 0.25);
    var glowR = lw * (0.16 + 0.05 * pulse);
    var rg = ctx.createRadialGradient(spX, (spTop + spBase) / 2, 2, spX, (spTop + spBase) / 2, glowR);
    rg.addColorStop(0, 'rgba(217,160,63,' + (0.34 * pulse + 0.10).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(217,160,63,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(spX, (spTop + spBase) / 2, glowR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = SPADIX;
    ctx.beginPath();
    ctx.moveTo(spX - spW / 2, spBase);
    ctx.quadraticCurveTo(spX - spW / 2, spTop + spW * 0.6, spX, spTop);
    ctx.quadraticCurveTo(spX + spW / 2, spTop + spW * 0.6, spX + spW / 2, spBase);
    ctx.closePath();
    ctx.fill();

    // Diver: hangs arched above, dives along an arc, sinks as she is swallowed.
    var s = lw * 0.235;
    var hangX = cx + Math.sin((p / 36) * Math.PI * 2) * W * 0.008;
    var hangY = H * 0.295 + Math.sin((p / 18) * Math.PI * 2) * H * 0.006;
    var throatX = cx - s * 0.25;
    var throatY = cy - lh * 0.26;
    var arcCX = (hangX + throatX) / 2 + W * 0.055;
    var arcCY = (hangY + throatY) / 2 - H * 0.02;
    var dt = st.diveT;
    var dx = (1 - dt) * (1 - dt) * hangX + 2 * (1 - dt) * dt * arcCX + dt * dt * throatX;
    var dy = (1 - dt) * (1 - dt) * hangY + 2 * (1 - dt) * dt * arcCY + dt * dt * throatY;
    dy += st.sinkT * lh * 0.46;
    var rot = lerp(-0.14, 0.52, dt);
    drawDiver(dx, dy, s, rot, st.alpha);

    // Front petal: the wrapping flap in front of the throat.
    // Drawn after the diver, so the dive disappears into the flower, tenderly.
    var fL = KP(-0.385, -0.04, -0.235, -0.20);
    var fR = KP(0.375, -0.05, 0.225, -0.20);
    ctx.fillStyle = PETAL;
    ctx.beginPath();
    ctx.moveTo(B[0], B[1]);
    ctx.bezierCurveTo(PX(-0.37), PY(0.30), fL[0] - lw * 0.03, fL[1] + lh * 0.16, fL[0], fL[1]);
    ctx.quadraticCurveTo(cx, PY(lerp(0.115, -0.055, close)), fR[0], fR[1]);
    ctx.bezierCurveTo(fR[0] + lw * 0.03, fR[1] + lh * 0.16, PX(0.36), PY(0.30), B[0], B[1]);
    ctx.closePath();
    ctx.fill();
    // Soft shadow line along the front flap rim
    ctx.strokeStyle = 'rgba(120,112,92,0.35)';
    ctx.lineWidth = Math.max(1, lw * 0.004);
    ctx.beginPath();
    ctx.moveTo(fL[0], fL[1]);
    ctx.quadraticCurveTo(cx, PY(lerp(0.115, -0.055, close)), fR[0], fR[1]);
    ctx.stroke();
    // Petal side shading strokes
    ctx.strokeStyle = 'rgba(120,112,92,0.20)';
    ctx.beginPath();
    ctx.moveTo(B[0], B[1]);
    ctx.bezierCurveTo(PX(-0.48), PY(0.30), lSh[0] - lw * 0.05, lSh[1] + lh * 0.18, lSh[0], lSh[1]);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(B[0], B[1]);
    ctx.bezierCurveTo(PX(0.44), PY(0.30), rSh[0] - lw * 0.01, rSh[1] + lh * 0.30, rSh[0], rSh[1]);
    ctx.stroke();

    // Soft grain, precomputed and identical every frame.
    for (var i = 0; i < grain.length; i++) {
      var d = grain[i];
      ctx.fillStyle = d.light
        ? 'rgba(255,255,255,' + d.a.toFixed(3) + ')'
        : 'rgba(20,45,66,' + d.a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(d.x * W, d.y * H, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // One synchronous first frame at the constant loop phase.
  draw(FIXED_PHASE);

  // Anchored animation: fixed offset plus elapsed, never a wall clock date.
  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var tick = function (ts) {
      if (t0 === null) t0 = ts;
      var elapsed = (ts - t0) / 1000;
      draw((FIXED_PHASE + elapsed) % LOOP);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
