<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon Touch</title>
<style>
  html, body { margin: 0; padding: 0; background: #0E1E33; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// Horizon Touch (EXPANSION #87 janine-antoni, block 6)
// Touch (2002): a tightrope strung exactly at the sea's horizon. A small
// silhouette walks it; with each step the rope dips, and at the deepest
// point of the dip the walker's feet touch the horizon line itself.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  skyTop: '#0E1E33',
  skyBot: '#4A6E8A',
  sea: '#16324A',
  rope: '#2A2E36',
  walker: '#0A0C10',
  glint: '#F5D9A0'
};

function hexRGB(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixA(a, b, f) {
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
function colStr(a) {
  return 'rgb(' + Math.round(a[0]) + ',' + Math.round(a[1]) + ',' + Math.round(a[2]) + ')';
}

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, isPhone = false;
var CYCLE = 60; // seconds per crossing

// ---------------------------------------------------------------------------
// Cycle state. Frame one is cycle 0 at t=0, drawn synchronously. Taps and
// cycle rollovers only ever re-anchor the epoch; every visible quantity is
// a closed-form function of (seed, t).
// ---------------------------------------------------------------------------
var baseSeed = 71787;
var cycleIndex = 0;
var epochStart = 0; // performance.now() timestamp of cycle start
var forcedT = -1;
(function () {
  try {
    var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(location.search || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (e) { /* inert hook, QA only */ }
})();

function cycleParams(seed) {
  var rng = mulberry32(seed);
  return {
    // balance noise: three seeded sine components
    bF: [0.9 + rng() * 0.5, 1.7 + rng() * 0.7, 3.1 + rng() * 0.9],
    bP: [rng() * 6.283, rng() * 6.283, rng() * 6.283],
    bA: [1.0, 0.55, 0.3],
    armF: 1.3 + rng() * 0.6,
    armP: rng() * 6.283,
    startFrac: 0.035 + rng() * 0.02,  // walker start, fraction of width
    endFrac: 1.04 + rng() * 0.03,     // walker exit past the right edge
    dipSigma: 0.075 + rng() * 0.03,   // dip width, fraction of width
    stepOff: rng() * Math.PI,         // gait phase at crossing start
    shimmerSeed: rng() * 1000
  };
}

function balance(p, t, k) {
  var v = 0;
  for (var i = 0; i < 3; i++) v += p.bA[i] * Math.sin(p.bF[i] * t * (k || 1) + p.bP[i]);
  return v / 1.85;
}

function walkerX(p, startX, endX, t) {
  return startX + (endX - startX) * (t / CYCLE);
}

function draw(t) {
  if (W === 0 || H === 0) return;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  var p = cycleParams(baseSeed + cycleIndex * 101);
  var horizonY = H * 0.5;
  var i, f;

  // --- Sky: flat horizontal bands stepping skyTop -> skyBot -------------
  var skyA = hexRGB(COL.skyTop), skyB = hexRGB(COL.skyBot), seaC = hexRGB(COL.sea);
  var skyBands = 7;
  for (i = 0; i < skyBands; i++) {
    f = skyBands === 1 ? 1 : i / (skyBands - 1);
    ctx.fillStyle = colStr(mixA(skyA, skyB, Math.pow(f, 1.25)));
    var y0 = Math.floor(horizonY * i / skyBands);
    var y1 = Math.ceil(horizonY * (i + 1) / skyBands);
    ctx.fillRect(0, y0, W, y1 - y0 + 1);
  }

  // --- Sea: flat bands from a lighter horizon tone down to sea ---------
  var seaBands = 7;
  var seaTop = mixA(skyB, seaC, 0.45);
  for (i = 0; i < seaBands; i++) {
    f = seaBands === 1 ? 1 : i / (seaBands - 1);
    ctx.fillStyle = colStr(mixA(seaTop, seaC, Math.pow(f, 0.8)));
    var sy0 = Math.floor(horizonY + (H - horizonY) * i / seaBands);
    var sy1 = Math.ceil(horizonY + (H - horizonY) * (i + 1) / seaBands);
    ctx.fillRect(0, sy0, W, sy1 - sy0 + 1);
  }

  // --- Sea shimmer: faint horizontal lines, seeded, gently breathing ---
  ctx.save();
  var shimmerN = 26;
  for (i = 0; i < shimmerN; i++) {
    var srng = mulberry32(9000 + i * 37 + Math.floor(p.shimmerSeed));
    var sy = horizonY + 6 + srng() * (H - horizonY - 14);
    var sx = srng() * W * 0.7;
    var sw = W * (0.08 + srng() * 0.25);
    var ph = srng() * 6.283;
    ctx.globalAlpha = 0.07 + 0.05 * (0.5 + 0.5 * Math.sin(t * 0.7 + ph));
    ctx.strokeStyle = COL.skyBot;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(Math.min(W, sx + sw), sy);
    ctx.stroke();
  }
  ctx.restore();

  // --- Walker kinematics -------------------------------------------------
  var startX = Math.max(p.startFrac * W, H * 0.036); // keep arms on-canvas
  var endX = p.endFrac * W;
  var wx = walkerX(p, startX, endX, t);
  var lagT = 0.45;
  var dipX = walkerX(p, startX, endX, Math.max(0, t - lagT));
  var dist = Math.max(0, wx - startX);
  var stepLen = H * 0.028;
  var stepPhase = dist / stepLen * Math.PI + p.stepOff; // full cycle = two steps
  var dipPulse = Math.pow(0.5 + 0.5 * Math.sin(stepPhase - Math.PI / 2), 1.4);
  var bal = balance(p, t, 1);
  var dipAmt = 0.3 + 0.7 * dipPulse * (0.85 + 0.15 * bal);
  var clearance = H * 0.016;            // rope ride height above horizon
  var dipBelow = clearance * 0.55;      // and how far the full dip sinks
  var sigma = p.dipSigma * W;

  // Rope height at x. Far from the walker the rope sits on the horizon
  // line; under the walker it rides the clearance above the line, and
  // each step's dip pulls it down through the line, so at the deepest
  // point of the dip the feet touch and cross the horizon: the walker
  // steps onto the water itself.
  function ropeYAt(x) {
    var g = Math.exp(-((x - dipX) * (x - dipX)) / (2 * sigma * sigma));
    return horizonY + g * (-clearance * (1 - dipAmt) + dipBelow * dipAmt);
  }

  // --- Horizon glint near the walker -------------------------------------
  var glintW = W * 0.09;
  ctx.save();
  ctx.globalAlpha = 0.25 + 0.45 * dipAmt;
  ctx.strokeStyle = COL.glint;
  ctx.lineWidth = Math.max(1, H * 0.0022);
  ctx.beginPath();
  ctx.moveTo(wx - glintW / 2, horizonY + 0.5);
  ctx.lineTo(wx + glintW / 2, horizonY + 0.5);
  ctx.stroke();
  ctx.restore();

  // --- Rope ---------------------------------------------------------------
  ctx.save();
  ctx.strokeStyle = COL.rope;
  ctx.lineWidth = Math.max(1, H * 0.0026);
  ctx.beginPath();
  var steps = Math.max(48, Math.floor(W / 8));
  for (i = 0; i <= steps; i++) {
    var x = W * i / steps;
    var y = ropeYAt(x);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();

  // --- Walker --------------------------------------------------------------
  var wh = H * 0.08;                    // walker height ~8% of frame
  var legLen = wh * 0.44;
  var torsoLen = wh * 0.34;
  var armLen = wh * 0.36;
  var headR = wh * 0.085;
  var feetY = ropeYAt(wx);
  var tilt = 0.16 * bal;                // torso lean from balance noise
  var hipX = wx + Math.sin(tilt) * legLen * 0.4;
  var hipY = feetY - legLen;
  var shX = hipX + Math.sin(tilt) * torsoLen;
  var shY = hipY - Math.cos(tilt) * torsoLen;
  var headX = shX + Math.sin(tilt) * headR * 2.4;
  var headY = shY - Math.cos(tilt) * headR * 2.4 - headR * 0.4;

  // feet: alternate steps along the rope
  var stepAmp = stepLen * 0.42;
  var f1x = wx + Math.sin(stepPhase) * stepAmp;
  var f2x = wx + Math.sin(stepPhase + Math.PI) * stepAmp;
  var f1y = ropeYAt(f1x) - Math.max(0, Math.cos(stepPhase)) * wh * 0.05;
  var f2y = ropeYAt(f2x) - Math.max(0, Math.cos(stepPhase + Math.PI)) * wh * 0.05;

  // arms: raised and out like a tightrope walker's balancing arms,
  // flapping with the balance noise
  var flap = Math.sin(p.armF * t + p.armP) * 0.5 + balance(p, t * 1.31, 1) * 0.6;
  var h1x = shX - Math.cos(flap * 0.4 + 0.5) * armLen;
  var h1y = shY - Math.sin(0.7 + flap * 0.5) * armLen * 0.62;
  var h2x = shX + Math.cos(flap * 0.4 + 0.5) * armLen;
  var h2y = shY - Math.sin(0.7 - flap * 0.5) * armLen * 0.62;

  ctx.save();
  ctx.strokeStyle = COL.walker;
  ctx.fillStyle = COL.walker;
  ctx.lineWidth = Math.max(1.2, wh * 0.045);
  ctx.lineCap = 'round';
  ctx.beginPath();
  // legs
  ctx.moveTo(hipX, hipY); ctx.lineTo(f1x, f1y);
  ctx.moveTo(hipX, hipY); ctx.lineTo(f2x, f2y);
  // torso
  ctx.moveTo(hipX, hipY); ctx.lineTo(shX, shY);
  // arms
  ctx.moveTo(shX, shY); ctx.lineTo(h1x, h1y);
  ctx.moveTo(shX, shY); ctx.lineTo(h2x, h2y);
  ctx.stroke();
  // head
  ctx.beginPath();
  ctx.arc(headX, headY, headR, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Sizing and main loop.
// ---------------------------------------------------------------------------
function resize() {
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = Math.round(vw);
  H = Math.round(vh);
  canvas.width = W;
  canvas.height = H;
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  // Before the loop starts, every draw is frame one at exactly t=0.
  draw(forcedT >= 0 ? forcedT : (loopStarted ? currentT() : 0));
}

var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
epochStart = startStamp;
function currentT() {
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp;
  var t = (now - epochStart) / 1000;
  if (t >= CYCLE) {
    var adv = Math.floor(t / CYCLE);
    cycleIndex += adv;
    epochStart += adv * CYCLE * 1000;
    t -= adv * CYCLE;
  }
  return t;
}

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (window.addEventListener) window.addEventListener('resize', resize);

// TAP reseeds: a fresh crossing starts from the left edge.
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function () {
    cycleIndex += 1;
    epochStart = (typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp;
    draw(0);
  });
}

// Frame one: synchronous draw at crossing t=0 (never clock-derived).
resize();

var loopStarted = false;
if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    loopStarted = true;
    if (forcedT < 0) draw(currentT());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
