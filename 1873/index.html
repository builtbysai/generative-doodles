<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alternation, Not Blending</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Two incompatible visual systems share one screen and never mix.
   System A: a skronk field on black, thin white and rust lines that
   jitter, snap and spray like bowed-wire noise. System B: a stripper-beat
   blues grid in warm amber, a heavy backbeat pulse, twelve-bar chord
   blocks marching left to right, a baritone-guitar silhouette strumming.
   The piece hard-cuts between them: about 20 seconds of A, one black
   frame, about 20 seconds of B, one black frame, back to A but different.
   No crossfade ever. Each system always finishes its phrase before the
   cut. The mechanism is the refusal to blend. Watch only. */
var TAU = Math.PI * 2;
/* System A palette: black, white, rust orange, signal red. */
var A_BLACK = '#000000';
var A_WHITE = '#F2F0EA';
var A_RUST = '#C65A1E';
var A_RED = '#D92323';
/* System B palette: amber, tobacco brown, cream, deep blue stage light. */
var B_AMBER = '#E8A33D';
var B_TOBACCO = '#4A3220';
var B_TOBACCO_DK = '#2E1F13';
var B_CREAM = '#F2E3C2';
var B_BLUE = '#1E2A52';
var B_GUITAR = '#120C08';
var PLATE = '#0A0A0A';
var PLATE_LINE = 'rgba(242,240,234,0.22)';
var TITLE_INK = '#F2F0EA';
var HINT_INK = '#B9B2A4';
var FRAME_T = 4.0; /* fixed phase: inside system A, skronk field reading clearly */
var BLACK_FRAME = 0.12; /* one black frame between systems */
var BAR_S = 1.6; /* one blues bar: four beats of 0.4 s, twelve bars is 19.2 s */
/* Cut sequencer: each system always finishes its phrase before the cut.
   A durations are irregular; every B segment is exactly twelve bars. */
var SEGMENTS = [
  { sys: 'A', dur: 20.8, variant: 0 },
  { sys: 'X', dur: BLACK_FRAME, variant: 0 },
  { sys: 'B', dur: 12 * BAR_S, variant: 0 },
  { sys: 'X', dur: BLACK_FRAME, variant: 0 },
  { sys: 'A', dur: 22.4, variant: 1 },
  { sys: 'X', dur: BLACK_FRAME, variant: 0 },
  { sys: 'B', dur: 12 * BAR_S, variant: 1 },
  { sys: 'X', dur: BLACK_FRAME, variant: 0 },
  { sys: 'A', dur: 19.6, variant: 2 },
  { sys: 'X', dur: BLACK_FRAME, variant: 0 },
  { sys: 'B', dur: 12 * BAR_S, variant: 2 },
  { sys: 'X', dur: BLACK_FRAME, variant: 0 }
];
var CYCLE = 0;
(function () { var i; for (i = 0; i < SEGMENTS.length; i++) CYCLE += SEGMENTS[i].dur; })();
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* Seeded wires: three variants of the skronk field, one per A segment. */
var WIRES = (function () {
  var out = [], v, i, rng, wires, j;
  for (v = 0; v < 3; v++) {
    rng = mulberry32(1873 + v * 97);
    wires = [];
    for (i = 0; i < 14; i++) {
      wires.push({
        y: 0.06 + rng() * 0.88,
        amp: 0.012 + rng() * 0.030,
        f1: 2.0 + rng() * 5.0,
        f2: 6.0 + rng() * 9.0,
        p1: rng() * TAU,
        p2: rng() * TAU,
        col: rng() < 0.55 ? A_WHITE : (rng() < 0.7 ? A_RUST : A_RED),
        w: rng() < 0.7 ? 1 : 2,
        snapX: 0.2 + rng() * 0.6,
        snapK: 2 + Math.floor(rng() * 4)
      });
    }
    out.push(wires);
  }
  return out;
})();
/* Seeded spray: particles burst from fixed sources, positions a pure
   function of time so frame one is deterministic. */
var SPRAY = (function () {
  var rng = mulberry32(18731), out = [], i;
  for (i = 0; i < 110; i++) {
    out.push({
      ox: 0.08 + rng() * 0.84,
      oy: 0.08 + rng() * 0.84,
      ang: rng() * TAU,
      spd: 0.05 + rng() * 0.16,
      cyc: 1.6 + rng() * 3.4,
      off: rng(),
      r: 0.6 + rng() * 1.6,
      col: rng() < 0.5 ? A_WHITE : (rng() < 0.65 ? A_RUST : A_RED)
    });
  }
  return out;
})();
/* Twelve-bar walk: I I I I IV IV I I V IV I V, heights in field units. */
var CHORDS = ['I', 'I', 'I', 'I', 'IV', 'IV', 'I', 'I', 'V', 'IV', 'I', 'V'];
var CHORD_H = [0.50, 0.50, 0.50, 0.50, 0.68, 0.68, 0.50, 0.50, 0.82, 0.68, 0.50, 0.82];
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* Which segment the clock is in, and the system's own time within it. */
function segmentAt(t) {
  var tt = t % CYCLE, i, acc = 0;
  for (i = 0; i < SEGMENTS.length; i++) {
    if (tt < acc + SEGMENTS[i].dur) return { seg: SEGMENTS[i], local: tt - acc };
    acc += SEGMENTS[i].dur;
  }
  return { seg: SEGMENTS[0], local: 0 };
}
/* ---- System A: skronk field ---- */
function drawSystemA(t, variant, sc) {
  var i, j, w, n, u, x, y, baseY, jit, snap;
  ctx.fillStyle = A_BLACK;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  /* bowed wires: jittering polylines, each snapping hard at its own
     seeded position on its own beat */
  var wires = WIRES[variant];
  for (i = 0; i < wires.length; i++) {
    w = wires[i];
    baseY = sc.y + w.y * sc.h;
    snap = (Math.floor(t * 1.5 + i * 0.37) % w.snapK === 0) ? (sc.h * 0.05) : 0;
    ctx.strokeStyle = rgba(w.col, 0.55 + 0.25 * Math.sin(t * 3.1 + w.p1));
    ctx.lineWidth = w.w;
    ctx.beginPath();
    n = 60;
    for (j = 0; j <= n; j++) {
      u = j / n;
      x = sc.x + u * sc.w;
      jit = Math.sin(TAU * (w.f1 * u) + t * 9.0 + w.p1) * w.amp * sc.h
          + Math.sin(TAU * (w.f2 * u) - t * 13.0 + w.p2) * w.amp * 0.5 * sc.h;
      if (u > w.snapX && u < w.snapX + 0.06) jit += snap * (1 - Math.abs(u - w.snapX - 0.03) / 0.03);
      y = baseY + jit;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  /* spray: short bright streaks bursting from fixed sources */
  for (i = 0; i < SPRAY.length; i++) {
    var p = SPRAY[i];
    var cyc = (t * p.spd + p.off) % 1;
    var dist = cyc * cyc * sc.w * 0.34;
    var px = sc.x + p.ox * sc.w + Math.cos(p.ang) * dist;
    var py = sc.y + p.oy * sc.h + Math.sin(p.ang) * dist * 0.8;
    var a = (1 - cyc) * 0.85;
    if (a <= 0.02) continue;
    ctx.strokeStyle = rgba(p.col, a);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px - Math.cos(p.ang) * 7, py - Math.sin(p.ang) * 7);
    ctx.stroke();
    ctx.fillStyle = rgba(p.col, a);
    ctx.beginPath();
    ctx.moveTo(px + p.r, py);
    ctx.arc(px, py, p.r, 0, TAU);
    ctx.fill();
  }
  /* a few hard vertical snap lines, present only on their own beats */
  for (i = 0; i < 5; i++) {
    if (Math.floor(t * 2.2 + i * 1.7) % 7 !== 0) continue;
    var sx = sc.x + sc.w * (0.12 + i * 0.17 + 0.03 * Math.sin(t * 7 + i));
    ctx.strokeStyle = rgba(i % 2 === 0 ? A_RED : A_WHITE, 0.8);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sx, sc.y + sc.h * 0.10);
    ctx.lineTo(sx + 4 * Math.sin(t * 11 + i), sc.y + sc.h * 0.9);
    ctx.stroke();
  }
}
/* ---- System B: blues grid ---- */
function drawSystemB(t, variant, sc) {
  var i, bx, bw, bh, by;
  /* tobacco ground with a deep blue stage light washing down from above */
  ctx.fillStyle = B_TOBACCO;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  var glow = ctx.createRadialGradient(
    sc.x + sc.w * 0.5, sc.y - sc.h * 0.1, 0,
    sc.x + sc.w * 0.5, sc.y - sc.h * 0.1, sc.h * 0.95);
  glow.addColorStop(0, rgba(B_BLUE, 0.85));
  glow.addColorStop(0.6, rgba(B_BLUE, 0.25));
  glow.addColorStop(1, rgba(B_BLUE, 0));
  ctx.fillStyle = glow;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  /* heavy backbeat pulse on beats 2 and 4 */
  var beat = Math.floor(t / (BAR_S / 4));
  var beatT = t - beat * (BAR_S / 4);
  var pulse = 0;
  if (beat % 2 === 1) pulse = Math.max(0, 1 - beatT / 0.28);
  if (pulse > 0.01) {
    ctx.fillStyle = rgba(B_AMBER, 0.10 * pulse);
    ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  }
  var barFloat = t / BAR_S;
  var barNow = Math.floor(barFloat);
  var gridTop = sc.y + sc.h * 0.10;
  var gridBot = sc.y + sc.h * 0.62;
  var gridH = gridBot - gridTop;
  var gap = Math.max(2, sc.w * 0.008);
  var colW = sc.w / 12;
  /* twelve-bar chord blocks marching left to right */
  for (i = 0; i < 12; i++) {
    bx = sc.x + i * colW + gap / 2;
    bw = colW - gap;
    bh = CHORD_H[i] * gridH;
    by = gridBot - bh;
    var played = i < barNow;
    var current = i === barNow;
    var a = current ? 0.95 : (played ? 0.75 : 0.34);
    ctx.fillStyle = rgba(B_AMBER, a);
    ctx.fillRect(bx, by, bw, bh);
    if (current) {
      ctx.fillStyle = rgba(B_CREAM, 0.95);
      ctx.fillRect(bx, by, bw, Math.max(2, sc.h * 0.008));
    }
    ctx.fillStyle = rgba(B_CREAM, current ? 0.95 : 0.55);
    ctx.font = 'bold ' + Math.max(10, Math.round(sc.w * 0.016)) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(CHORDS[i], bx + bw / 2, gridBot + sc.h * 0.015);
  }
  /* playhead: a cream line marching across the twelve bars */
  var px = sc.x + (barFloat / 12) * sc.w;
  ctx.strokeStyle = rgba(B_CREAM, 0.9);
  ctx.lineWidth = Math.max(1.5, sc.w * 0.002);
  ctx.beginPath();
  ctx.moveTo(px, gridTop - sc.h * 0.01);
  ctx.lineTo(px, gridBot);
  ctx.stroke();
  drawGuitar(t, sc, pulse);
}
/* Baritone-guitar silhouette strumming on the beat, bottom center. */
function drawGuitar(t, sc, pulse) {
  var cx = sc.x + sc.w * 0.5;
  var cy = sc.y + sc.h * 0.88;
  var bodyRx = sc.w * 0.16, bodyRy = sc.h * 0.07;
  var strum = Math.sin(TAU * (t / (BAR_S / 4)) * 0.5) * 0.035 + pulse * 0.02;
  var neckLen = sc.w * 0.23;
  var neckAng = -0.62 + strum;
  var neckX = cx + Math.cos(neckAng) * neckLen;
  var neckY = cy - sc.h * 0.05 + Math.sin(neckAng) * neckLen;
  ctx.save();
  ctx.translate(cx, cy);
  /* body */
  ctx.fillStyle = B_GUITAR;
  ctx.beginPath();
  ctx.moveTo(bodyRx, 0);
  ctx.ellipse(0, 0, bodyRx, bodyRy, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(B_AMBER, 0.8);
  ctx.lineWidth = Math.max(1, sc.w * 0.0018);
  ctx.stroke();
  /* sound hole */
  ctx.fillStyle = rgba(B_TOBACCO_DK, 1);
  ctx.beginPath();
  ctx.moveTo(bodyRx * 0.22, 0);
  ctx.arc(0, 0, bodyRx * 0.22, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(B_AMBER, 0.5);
  ctx.stroke();
  ctx.restore();
  /* neck, rising up to the right, strumming on the beat */
  var neckW = Math.max(4, sc.h * 0.018);
  var dx = neckX - cx, dy = neckY - (cy - sc.h * 0.05);
  var len = Math.sqrt(dx * dx + dy * dy);
  var ux = dx / len, uy = dy / len;
  var pxn = -uy, pyn = ux;
  ctx.fillStyle = B_GUITAR;
  ctx.beginPath();
  ctx.moveTo(cx + pxn * neckW / 2, cy - sc.h * 0.05 + pyn * neckW / 2);
  ctx.lineTo(neckX + pxn * neckW / 2, neckY + pyn * neckW / 2);
  ctx.lineTo(neckX - pxn * neckW / 2, neckY - pyn * neckW / 2);
  ctx.lineTo(cx - pxn * neckW / 2, cy - sc.h * 0.05 - pyn * neckW / 2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = rgba(B_AMBER, 0.6);
  ctx.lineWidth = 1;
  ctx.stroke();
  /* headstock */
  ctx.fillStyle = B_GUITAR;
  ctx.beginPath();
  ctx.moveTo(neckX + pxn * neckW * 0.7, neckY + pyn * neckW * 0.7);
  ctx.lineTo(neckX + ux * sc.w * 0.045 + pxn * neckW * 0.7, neckY + uy * sc.w * 0.045 + pyn * neckW * 0.7);
  ctx.lineTo(neckX + ux * sc.w * 0.045 - pxn * neckW * 0.7, neckY + uy * sc.w * 0.045 - pyn * neckW * 0.7);
  ctx.lineTo(neckX - pxn * neckW * 0.7, neckY - pyn * neckW * 0.7);
  ctx.closePath();
  ctx.fill();
  /* four strings, vibrating with the strum */
  var s;
  for (s = 0; s < 4; s++) {
    var off = (s - 1.5) * neckW * 0.28;
    var vib = Math.sin(t * 26 + s * 1.3) * 1.2 * (0.4 + pulse);
    ctx.strokeStyle = rgba(B_CREAM, 0.55);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx + pxn * off, cy - sc.h * 0.05 + pyn * off);
    ctx.lineTo(neckX + ux * sc.w * 0.04 + pxn * off + vib * pxn, neckY + uy * sc.w * 0.04 + pyn * off + vib * pyn);
    ctx.stroke();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  var title = 'Alternation, Not Blending';
  var date = '2007 · 02 · 27';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(title).width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(title).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText(date).width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(title, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText(date, plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. Two systems, one screen, never mixed.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  var seg = segmentAt(t);
  if (seg.seg.sys === 'X') {
    ctx.fillStyle = A_BLACK;
    ctx.fillRect(0, 0, VW, VH);
  } else {
    /* page ground takes the current system's own ground color */
    ctx.fillStyle = seg.seg.sys === 'A' ? A_BLACK : B_TOBACCO_DK;
    ctx.fillRect(0, 0, VW, VH);
    if (seg.seg.sys === 'A') drawSystemA(seg.local, seg.seg.variant, sc);
    else drawSystemB(seg.local, seg.seg.variant, sc);
    if (!isPhone) {
      ctx.strokeStyle = seg.seg.sys === 'A' ? rgba(A_WHITE, 0.10) : rgba(B_AMBER, 0.25);
      ctx.lineWidth = 1;
      ctx.strokeRect(sc.x + 0.5, sc.y + 0.5, sc.w - 1, sc.h - 1);
    }
  }
  drawPlates();
}
/* ---- frame one: fixed phase t = 4.0 s, inside system A variant 0 ----
   the skronk field reads clearly, no cut yet */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
