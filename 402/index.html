<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.402 Shrine</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#191D45; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.402 Shrine (nina-clausonet).
// After Nina Clausonet's body-as-landscape mechanism: the
// white-haired muse in profile on a deep navy night, her
// torso and shawl drawn as a purple mountain-night scene
// clipped inside her own silhouette - a tiny manger, three
// palms, one winding path, exactly forty twinkling stars,
// and an eight-point star at her sternum that breathes
// light on an 8s cycle. WATCH-ONLY: no interaction at
// all, a pure 40s motion loop. The muse herself is still;
// only the light inside her moves. The purple ramp inside
// the shawl is stepped flat bands (no gradient anywhere),
// the star glow is layered translucent flat discs, and
// the paper grain is fixed speckle dot data drawn from a
// table. Palette is closed at the specced hexes, each used
// flat or at flat alpha steps. One canvas, no offscreen
// canvas, no filters, no shadowBlur. No text anywhere.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var NAVY = '#191D45', WHITE = '#FFFFFF', HAIR = '#F5F2EC';
var FACE = '#8C2F28', LIPS = '#E56B9B';
// Stepped purple bands inside the shawl, top to bottom,
// authored steps between the two specced endpoints.
var BANDS = ['#6B3AA8', '#7442B1', '#7D4ABA', '#8652C3', '#8F5AC9'];
if (BANDS.length !== 5) throw new Error('Shrine needs its 5 purple bands');
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 40;
if (LOOP !== 40) throw new Error('Shrine loop must be 40s');
var STAR_P = 8; // sternum star pulse, seconds
if (LOOP / STAR_P !== 5) throw new Error('star pulse must complete exactly 5 cycles per loop');
var TICK = 1 / 60;
var TAU = Math.PI * 2;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-looking
// value is baked from this at load and never changes
// between frames or renders.
var seed = 402;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// Shawl stars: exactly 40 dots scattered in the upper
// scene sky, each with a fixed twinkle phase and a period
// that divides the loop (5s, 8s or 10s), so every star is
// home again at the wrap.
var STARS = [];
(function () {
  var i;
  for (i = 0; i < 40; i++) {
    STARS.push({
      x: 490 + rnd() * 400,
      y: 345 + rnd() * 225,
      r: 1.4 + rnd() * 1.7,
      p: [5, 8, 10][Math.floor(rnd() * 3)],
      ph: rnd() * TAU,
      base: 0.35 + rnd() * 0.3
    });
  }
})();
if (STARS.length !== 40) throw new Error('Shrine needs exactly 40 shawl stars');

// Sparkles: 14 motes that drift up from the winding path,
// each on a 20s rise (2 per loop) with a sine envelope
// that is zero at both ends, staggered by a fixed table.
var SPARK_P = 20;
if (LOOP / SPARK_P !== 2) throw new Error('sparkle cycle must complete whole times per loop');
var SPARKS = [];
(function () {
  var i;
  for (i = 0; i < 14; i++) {
    SPARKS.push({
      off: i * (SPARK_P / 14),
      x0: 640 + rnd() * 120,
      rise: 60 + rnd() * 55,
      wig: 6 + rnd() * 12,
      r: 1.6 + rnd() * 1.2
    });
  }
})();
if (SPARKS.length !== 14) throw new Error('Shrine needs its 14 sparkles');

// Paper grain: 700 static speckle dots from a fixed table,
// half star-white and half navy, both at low flat alpha,
// drawn last in the same order every frame.
var GRAIN = [];
(function () {
  var i;
  for (i = 0; i < 700; i++) {
    GRAIN.push({ x: rnd() * DW, y: rnd() * DH, r: 0.8 + rnd() * 1.3, dark: i % 2 === 0 });
  }
})();
if (GRAIN.length !== 700) throw new Error('Shrine needs its 700 grain dots');

// Palms: exactly 3 silhouettes inside the scene.
var PALMS = [
  { x: 520, y: 716, s: 1.0 },
  { x: 884, y: 700, s: 0.85 },
  { x: 596, y: 648, s: 0.6 }
];
if (PALMS.length !== 3) throw new Error('Shrine needs exactly 3 palms');

// ---- drawing helpers -----------------------------------
function circ(x, y, r, col, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function ell(x, y, rx, ry, col, rot, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function poly(pts, col, alpha) {
  var i;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function stroke(points, w, col, alpha) {
  var i;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for (i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- the muse ------------------------------------------
// Body silhouette: neck and shoulders flaring into a wide
// shawl cloak that fills the lower two thirds. This one
// path is both the drawn shawl edge and the clip region
// for the night scene inside her.
function bodyPath() {
  ctx.beginPath();
  ctx.moveTo(640, 318);
  ctx.bezierCurveTo(560, 338, 500, 420, 470, 560);
  ctx.bezierCurveTo(445, 680, 430, 800, 425, 900);
  ctx.lineTo(955, 900);
  ctx.bezierCurveTo(950, 780, 935, 660, 905, 540);
  ctx.bezierCurveTo(880, 430, 830, 350, 745, 324);
  ctx.bezierCurveTo(715, 314, 670, 312, 640, 318);
  ctx.closePath();
}

// Hair: one white mass floating left from the head, its
// lower edge scalloped into slow lobes, with three strand
// curves inside it.
function drawHair() {
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.moveTo(694, 116);
  ctx.bezierCurveTo(598, 90, 478, 98, 408, 138);
  ctx.bezierCurveTo(348, 176, 306, 196, 288, 214);
  ctx.bezierCurveTo(330, 226, 356, 240, 366, 262);
  ctx.bezierCurveTo(322, 268, 296, 284, 292, 304);
  ctx.bezierCurveTo(340, 308, 376, 322, 392, 344);
  ctx.bezierCurveTo(352, 356, 336, 372, 340, 392);
  ctx.bezierCurveTo(420, 396, 500, 388, 570, 362);
  ctx.bezierCurveTo(640, 336, 690, 300, 706, 240);
  ctx.bezierCurveTo(714, 194, 710, 152, 694, 116);
  ctx.closePath();
  ctx.fill();
  stroke([[420, 150], [470, 210], [462, 300]], 3, NAVY, 0.10);
  stroke([[500, 128], [540, 196], [520, 292]], 3, NAVY, 0.08);
  stroke([[360, 196], [410, 250], [404, 330]], 3, NAVY, 0.08);
}

// Face in profile, looking right: deep red, eyes closed,
// serene. Drawn over the hair's right edge and the neck.
function drawHead() {
  // Neck down into the shawl.
  poly([[648, 262], [716, 262], [724, 344], [652, 344]], FACE);
  // Head mass.
  ell(692, 204, 76, 92, FACE);
  // Nose: one small soft bump on the profile edge.
  ell(766, 215, 12, 10, FACE, 0.2);
  // Closed eye: a single downward-bowing lash line.
  ctx.globalAlpha = 0.75;
  ctx.strokeStyle = NAVY;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(700, 196);
  ctx.quadraticCurveTo(717, 209, 736, 197);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Lips: one small pink leaf at the mouth.
  ell(758, 244, 10, 5, LIPS, 0.35);
  // Brow: a faint short arc above the eye.
  ctx.globalAlpha = 0.4;
  ctx.strokeStyle = NAVY;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(702, 176);
  ctx.quadraticCurveTo(718, 169, 734, 175);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- the scene inside her -------------------------------
// The eight-point star of the shrine, centred at the
// sternum: 16 alternating points, authored once.
function starPoints(cx, cy, rO, rI) {
  var pts = [], i, a;
  for (i = 0; i < 16; i++) {
    a = (i / 16) * TAU - Math.PI / 2;
    var r = i % 2 === 0 ? rO : rI;
    pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return pts;
}
function drawScene(t) {
  var i, j;
  ctx.save();
  bodyPath();
  ctx.clip();
  // Stepped flat purple bands, top to bottom: the house
  // treatment of her soft vertical ramp. No gradient.
  var bandH = DH / BANDS.length;
  for (i = 0; i < BANDS.length; i++) {
    ctx.fillStyle = BANDS[i];
    ctx.fillRect(0, i * bandH, DW, bandH + 1);
  }
  // Far mountain ridge, navy at low alpha.
  poly([[400, 566], [500, 492], [576, 548], [660, 478], [742, 544], [830, 496], [980, 572], [980, 900], [400, 900]], NAVY, 0.28);
  // Near ridge, darkest purple, full strength.
  poly([[400, 690], [492, 622], [580, 676], [668, 612], [758, 672], [846, 626], [980, 694], [980, 900], [400, 900]], BANDS[0], 1);
  // The forty shawl stars, twinkling on fixed phases.
  for (i = 0; i < STARS.length; i++) {
    var st = STARS[i];
    var tw = st.base + (1 - st.base) * (0.5 + 0.5 * Math.sin(TAU * (t / st.p) + st.ph));
    circ(st.x, st.y, st.r, WHITE, tw);
  }
  // Sternum star: layered translucent flat discs breathing
  // on the 8s cycle (5 per loop), then the star itself,
  // gently scaling with the same breath.
  var pulse = 0.5 + 0.5 * Math.sin(TAU * (t / STAR_P));
  var sx = 692, sy = 446;
  circ(sx, sy, 84, WHITE, 0.04 + 0.03 * pulse);
  circ(sx, sy, 56, WHITE, 0.06 + 0.04 * pulse);
  circ(sx, sy, 36, WHITE, 0.09 + 0.05 * pulse);
  var sr = 30 * (1 + 0.1 * pulse);
  poly(starPoints(sx, sy, sr, sr * 0.42), WHITE, 0.95);
  // Winding path: one curved band of pale hair-white at
  // flat alpha, from below the manger down to the hem.
  ctx.globalAlpha = 0.42;
  ctx.strokeStyle = HAIR;
  ctx.lineWidth = 15;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(700, 762);
  ctx.bezierCurveTo(652, 806, 742, 838, 706, 902);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // The manger: exactly 5 flat shapes, navy silhouettes
  // with the child as one pale bundle.
  var mx = 700, my = 724;
  poly([[mx - 34, my - 44], [mx - 26, my - 44], [mx - 26, my + 14], [mx - 34, my + 14]], NAVY, 0.9); // post left
  poly([[mx + 26, my - 44], [mx + 34, my - 44], [mx + 34, my + 14], [mx + 26, my + 14]], NAVY, 0.9); // post right
  poly([[mx - 46, my - 42], [mx + 46, my - 42], [mx, my - 74]], NAVY, 0.9); // roof
  poly([[mx - 24, my + 2], [mx + 24, my + 2], [mx + 17, my + 20], [mx - 17, my + 20]], NAVY, 0.9); // crib
  ell(mx, my - 2, 11, 7, HAIR, -0.2, 0.95); // the child, one pale bundle
  // Palms: curved trunk and five fronds each, navy.
  for (j = 0; j < PALMS.length; j++) {
    var p = PALMS[j];
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = NAVY;
    ctx.lineCap = 'round';
    ctx.lineWidth = 7 * p.s;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.quadraticCurveTo(p.x + 8 * p.s, p.y - 44 * p.s, p.x + 20 * p.s, p.y - 82 * p.s);
    ctx.stroke();
    ctx.lineWidth = 5 * p.s;
    var tx = p.x + 20 * p.s, ty = p.y - 82 * p.s, k;
    var fronds = [[-52, -20], [-30, -34], [0, -42], [32, -32], [54, -16]];
    for (k = 0; k < fronds.length; k++) {
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo(tx + fronds[k][0] * p.s * 0.6, ty + fronds[k][1] * p.s - 8 * p.s,
                           tx + fronds[k][0] * p.s, ty + fronds[k][1] * p.s + 14 * p.s);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // Sparkles drifting up from the path on whole cycles.
  for (i = 0; i < SPARKS.length; i++) {
    var sp = SPARKS[i];
    var pr = ((t + sp.off) % SPARK_P) / SPARK_P;
    var env = Math.sin(Math.PI * pr);
    if (env <= 0.02) continue;
    var y = 770 - sp.rise * pr;
    var x = sp.x0 + sp.wig * Math.sin(TAU * pr);
    circ(x, y, sp.r, WHITE, 0.75 * env);
  }
  ctx.restore();
  // Shawl edge: one pale line tracing the silhouette so the
  // body reads against the navy ground.
  bodyPath();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = HAIR;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- grain ----------------------------------------------
function drawGrain() {
  var i;
  for (i = 0; i < GRAIN.length; i++) {
    var g = GRAIN[i];
    circ(g.x, g.y, g.r, g.dark ? NAVY : WHITE, 0.055);
  }
}

function draw(t) {
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, DW, DH);
  drawHair();
  drawScene(t);
  drawHead();
  drawGrain();
}

// ---- clock and frame -----------------------------------
// Determinism: frame one is drawn synchronously at the
// constant phase T0 (scene complete, sternum star rising
// through its breath, twinkles and sparkles developed),
// and the animation clock advances from that anchor in
// fixed 1/60 ticks accumulated from rAF timestamps. Frame
// one never reads a wall clock.
var T0 = 9.0;
var T = T0;
var lastNow = -1, acc = 0;
function step() { /* watch-only: state lives in the clock */ }

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Centred fit: the whole scene sits inside the viewport,
  // and the page ground takes the navy tone.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
