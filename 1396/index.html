<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shameless Pole</title>
<style>
  html, body { margin: 0; padding: 0; background: #c8c4b8; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (prompt verbatim)
  var SKY = '#c8c4b8', LOBSTER = '#c23b22', HATBLK = '#1a1a18',
      STEEL = '#5a5e66', FLOWER = '#f5c542', PATCH = '#d42a8a',
      BEAD = '#3fa7a0', WOOD = '#7a5a34', WOODDARK = '#5d4426';

  // Seeded PRNG (mulberry32); never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0;
  function size() {
    var vw = (typeof visualViewport !== 'undefined' && visualViewport)
      ? visualViewport.width : window.innerWidth;
    var vh = (typeof visualViewport !== 'undefined' && visualViewport)
      ? visualViewport.height : window.innerHeight;
    W = Math.max(1, Math.round(vw)); H = Math.max(1, Math.round(vh));
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  size();
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', function () { size(); draw(clockT); });
  }
  window.addEventListener('resize', function () { size(); draw(clockT); });

  // Phone detection: window.screen physical size, aspect fallback only.
  function isPhone() {
    var mn = Math.min(window.screen.width, window.screen.height);
    if (mn < 700) return true;
    return H > W * 1.15;
  }

  // ---- drawing helpers (every arc gets its own beginPath; dots as rects/arcs) ----
  function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
  function disc(x, y, r, col) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
  }
  function ellipse(x, y, rx, ry, rot, col) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.fill();
  }
  function poly(pts, col) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  }
  function line(x1, y1, x2, y2, w, col) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke();
  }
  // Pseudo-script glyph: drawn shapes only, never letters.
  function glyph(x, y, s, kind, col) {
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, s * 0.14);
    ctx.beginPath();
    if (kind === 0) { // chevron
      ctx.moveTo(x - s * 0.4, y - s * 0.3); ctx.lineTo(x, y + s * 0.3); ctx.lineTo(x + s * 0.4, y - s * 0.3);
    } else if (kind === 1) { // arc
      ctx.arc(x, y, s * 0.35, Math.PI * 1.1, Math.PI * 1.9);
    } else if (kind === 2) { // cross
      ctx.moveTo(x - s * 0.35, y); ctx.lineTo(x + s * 0.35, y);
      ctx.moveTo(x, y - s * 0.35); ctx.lineTo(x, y + s * 0.35);
    } else { // triangle
      ctx.moveTo(x - s * 0.35, y + s * 0.3); ctx.lineTo(x, y - s * 0.35); ctx.lineTo(x + s * 0.35, y + s * 0.3);
      ctx.closePath();
    }
    ctx.stroke();
    disc(x + s * 0.45, y + s * 0.35, Math.max(1, s * 0.07), col);
  }

  // ---- adornment sets (seeded, deterministic per part + redress count) ----
  // hat: [lobsterCount, mugCount, featherColorIndex]; musket: flower petal count/color;
  // patches: glyph-kind triple.
  function adorn(part, count) {
    var r = mulberry32(1396000 + part * 7919 + count * 104729);
    if (part === 0) return [2 + Math.floor(r() * 3), 1 + Math.floor(r() * 3), Math.floor(r() * 3)];
    if (part === 1) return [5 + Math.floor(r() * 3), Math.floor(r() * 2)];
    return [Math.floor(r() * 4), Math.floor(r() * 4), Math.floor(r() * 4)];
  }
  var redress = { hat: 0, musket: 0, patches: 0 };
  var redressStart = { hat: -10, musket: -10, patches: -10 }; // piece time of last redress
  var drag = null; // {part, dx, dy}

  // Part animation: detach, spin, reattach over 0.9 s after a redress (closed-form).
  function partAnim(part, t) {
    var dt = t - redressStart[part];
    if (dt < 0 || dt > 0.9) return { ox: 0, oy: 0, rot: 0 };
    var p = dt / 0.9;
    var lift = Math.sin(p * Math.PI);
    return { ox: Math.sin(p * Math.PI * 2) * 18, oy: -lift * 46, rot: p * Math.PI * 2 };
  }

  function draw(t) {
    var u = H / 11; // pole unit; pole height ~ 8.5u, dominates vertical center
    var cx = W / 2;
    var groundY = H * 0.5 + 4.6 * u;
    if (groundY > H * 0.94) groundY = H * 0.94;
    var baseY = groundY;

    // Sky wash + plaza
    rect(0, 0, W, H, SKY);
    ctx.fillStyle = 'rgba(26,26,24,0.10)';
    ctx.fillRect(0, groundY, W, H - groundY);
    line(0, groundY, W, groundY, Math.max(1, u * 0.02), HATBLK);

    // Hard shadow under the stack
    ctx.fillStyle = 'rgba(26,26,24,0.18)';
    ctx.fillRect(cx - 1.9 * u, groundY, 3.8 * u, Math.max(2, u * 0.10));

    // ---- crates (bottom of the totem) ----
    var cw = 2.6 * u, ch = 0.95 * u;
    rect(cx - cw / 2, baseY - ch, cw, ch, WOOD);
    rect(cx - cw / 2, baseY - ch, cw, ch * 0.12, WOODDARK);
    rect(cx - cw / 2, baseY - 2 * ch - 0.06 * u, cw * 0.82, ch, WOOD);
    rect(cx - cw * 0.41, baseY - 2 * ch - 0.06 * u, cw * 0.82, ch * 0.12, WOODDARK);
    line(cx - cw * 0.48, baseY - ch * 0.5, cx + cw * 0.48, baseY - ch * 0.5, Math.max(1, u * 0.03), WOODDARK);
    line(cx - cw * 0.39, baseY - 2 * ch * 0.5 - 0.06 * u, cx + cw * 0.39, baseY - 2 * ch * 0.5 - 0.06 * u, Math.max(1, u * 0.03), WOODDARK);
    disc(cx - cw * 0.5, baseY - ch * 0.5, Math.max(1, u * 0.03), WOODDARK);
    disc(cx + cw * 0.5, baseY - ch * 0.5, Math.max(1, u * 0.03), WOODDARK);

    // ---- figure group (bobs in an endless mid-stride march-in-place) ----
    var bob = Math.sin(t * Math.PI * 2 / 1.6) * 0.05 * u;
    var march = Math.sin(t * Math.PI * 2 / 0.8 + 0.9); // phase-shifted so frame one is already mid-stride
    var figY = baseY - 2 * ch - 0.06 * u + bob; // feet line
    var hipY = figY - 1.55 * u;
    var shoulderY = figY - 2.75 * u;
    var headY = figY - 3.35 * u;
    var sway = Math.sin(t * Math.PI * 2 / 2.3) * 0.06; // shared sway envelope

    // Legs: mid-stride, alternating
    var lw = Math.max(2, u * 0.13);
    line(cx - 0.08 * u, hipY, cx - 0.08 * u + march * 0.34 * u, figY, lw, HATBLK);
    line(cx + 0.08 * u, hipY, cx + 0.08 * u - march * 0.34 * u, figY, lw, HATBLK);
    // Torso: lobster-red coat
    poly([[cx - 0.42 * u, shoulderY], [cx + 0.42 * u, shoulderY],
          [cx + 0.34 * u, hipY], [cx - 0.34 * u, hipY]], LOBSTER);
    // Coat buttons (flower yellow dots)
    disc(cx, shoulderY + 0.45 * u, Math.max(1, u * 0.05), FLOWER);
    disc(cx, shoulderY + 0.95 * u, Math.max(1, u * 0.05), FLOWER);
    // Arms: one swinging forward, one back
    line(cx - 0.40 * u, shoulderY + 0.1 * u, cx - 0.62 * u, shoulderY + 0.85 * u + march * 0.2 * u, lw, LOBSTER);
    line(cx + 0.40 * u, shoulderY + 0.1 * u, cx + 0.62 * u, shoulderY + 0.85 * u - march * 0.2 * u, lw, LOBSTER);
    // Bead strand across the torso (turquoise dots)
    var br = mulberry32(1396000 + 55);
    for (var i = 0; i < 7; i++) {
      var bx = cx - 0.32 * u + i * 0.107 * u;
      var by = shoulderY + 0.35 * u + Math.sin(i * 0.9) * 0.12 * u;
      disc(bx, by, Math.max(1, u * 0.055), BEAD);
    }
    void br;

    // ---- patches (draggable part) ----
    var pa = partAnim('patches', t);
    var pg = adorn(2, redress.patches);
    ctx.save();
    ctx.translate(cx + pa.ox, shoulderY + 0.7 * u + pa.oy);
    ctx.rotate(pa.rot * 0.3);
    var patchPos = [[-0.22, 0.15], [0.22, 0.05], [0.0, -0.35]];
    for (var pi = 0; pi < 3; pi++) {
      var px = patchPos[pi][0] * u, py = patchPos[pi][1] * u;
      disc(px, py, 0.16 * u, PATCH);
      glyph(px, py, 0.16 * u, pg[pi], SKY);
    }
    ctx.restore();

    // ---- head (outlined so the face reads against the sky wash) ----
    disc(cx, headY, 0.30 * u, SKY);
    ctx.beginPath(); ctx.arc(cx, headY, 0.30 * u, 0, Math.PI * 2);
    ctx.strokeStyle = HATBLK; ctx.lineWidth = Math.max(1, u * 0.02); ctx.stroke();
    disc(cx - 0.09 * u, headY - 0.02 * u, Math.max(1, u * 0.03), HATBLK);
    disc(cx + 0.09 * u, headY - 0.02 * u, Math.max(1, u * 0.03), HATBLK);

    // ---- hat (draggable part) with overflowing lobsters + mugs + feathers ----
    var ha = partAnim('hat', t);
    var hd = adorn(0, redress.hat);
    ctx.save();
    ctx.translate(cx + ha.ox, headY - 0.30 * u + ha.oy);
    ctx.rotate(ha.rot * 0.3 + sway * 0.4);
    var brimY = 0, crownY = -0.62 * u;
    ellipse(0, brimY, 0.72 * u, 0.14 * u, 0, HATBLK);
    poly([[-0.42 * u, brimY], [0.42 * u, brimY], [0.34 * u, crownY], [-0.34 * u, crownY]], HATBLK);
    rect(-0.36 * u, crownY + 0.28 * u, 0.72 * u, 0.10 * u, PATCH);
    // Feathers from the brim
    var featherCols = [BEAD, PATCH, FLOWER];
    for (var fi = 0; fi < 3; fi++) {
      var fa = -0.7 + fi * 0.45 + hd[2] * 0.12;
      ellipse((0.55 + fi * 0.12) * u, brimY - 0.30 * u - fi * 0.06 * u, 0.05 * u, 0.22 * u, fa, featherCols[(fi + hd[2]) % 3]);
    }
    // Lobsters perched on the brim
    for (var li = 0; li < hd[0]; li++) {
      var lx = (-0.55 + li * 0.30) * u;
      ellipse(lx, brimY - 0.12 * u, 0.13 * u, 0.08 * u, -0.3, LOBSTER);
      disc(lx - 0.14 * u, brimY - 0.16 * u, 0.05 * u, LOBSTER);
      disc(lx + 0.14 * u, brimY - 0.16 * u, 0.05 * u, LOBSTER);
    }
    // Beer mugs tucked behind the crown
    for (var mi = 0; mi < hd[1]; mi++) {
      var mx = (-0.30 + mi * 0.34) * u;
      rect(mx - 0.08 * u, crownY - 0.18 * u, 0.16 * u, 0.22 * u, FLOWER);
      rect(mx - 0.08 * u, crownY - 0.22 * u, 0.16 * u, 0.06 * u, SKY);
    }
    ctx.restore();

    // ---- musket (draggable part) with flower in the barrel ----
    var ma = partAnim('musket', t);
    var md = adorn(1, redress.musket);
    var handX = cx + 0.62 * u, handY = shoulderY + 0.85 * u - march * 0.2 * u;
    ctx.save();
    ctx.translate(handX + ma.ox, handY + ma.oy);
    ctx.rotate(-0.55 + ma.rot * 0.3 + Math.sin(t * Math.PI * 2 / 2.3) * 0.08);
    // Barrel + stock
    rect(-0.06 * u, -1.55 * u, 0.12 * u, 2.1 * u, STEEL);
    poly([[-0.06 * u, 0.55 * u], [0.06 * u, 0.55 * u], [0.16 * u, 0.95 * u], [-0.16 * u, 0.95 * u]], WOOD);
    // Flower poking from the barrel: petal count varies by adornment
    var petals = md[0];
    for (var fp = 0; fp < petals; fp++) {
      var fang = (fp / petals) * Math.PI * 2 + t * 0.2;
      disc(Math.cos(fang) * 0.16 * u, -1.55 * u - 0.22 * u + Math.sin(fang) * 0.16 * u, 0.09 * u, md[1] ? PATCH : FLOWER);
    }
    disc(0, -1.77 * u, 0.09 * u, LOBSTER);
    ctx.restore();

    // Drag ghost: while dragging, the grabbed part follows the pointer faintly.
    if (drag) {
      ctx.fillStyle = 'rgba(26,26,24,0.15)';
      ctx.fillRect(drag.x - 0.3 * u, drag.y - 0.3 * u, 0.6 * u, 0.6 * u);
    }
    void isPhone;
  }

  // ---- interaction: drag a part to re-dress it ----
  function partAt(x, y) {
    var u = H / 11, cx = W / 2;
    var groundY = Math.min(H * 0.5 + 4.6 * u, H * 0.94);
    var figY = groundY - 2 * 0.95 * u - 0.06 * u;
    var shoulderY = figY - 2.75 * u, headY = figY - 3.35 * u;
    // Hat zone
    if (Math.abs(x - cx) < 0.85 * u && y > headY - 1.1 * u && y < headY + 0.1 * u) return 'hat';
    // Musket zone: diagonal band right of the figure
    if (x > cx + 0.3 * u && x < cx + 1.6 * u && y > shoulderY - 1.6 * u && y < shoulderY + 1.2 * u) return 'musket';
    // Patches zone: torso
    if (Math.abs(x - cx) < 0.45 * u && y > shoulderY - 0.1 * u && y < shoulderY + 1.5 * u) return 'patches';
    return null;
  }
  var dragStart = null;
  canvas.addEventListener('pointerdown', function (e) {
    var p = partAt(e.clientX, e.clientY);
    if (p) { drag = { part: p, x: e.clientX, y: e.clientY }; dragStart = { x: e.clientX, y: e.clientY }; }
  });
  window.addEventListener('pointermove', function (e) {
    if (drag) { drag.x = e.clientX; drag.y = e.clientY; }
  });
  window.addEventListener('pointerup', function (e) {
    if (!drag) return;
    var moved = Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y);
    var part = drag.part;
    drag = null; dragStart = null;
    if (moved > 20) { redress[part]++; redressStart[part] = clockT; }
  });

  // ---- clock: frame one = draw(0); rAF loop starts the clock ----
  var clockT = 0, startMs = null, booted = false;
  draw(0);
  function loop(ts) {
    if (startMs === null) startMs = ts;
    clockT = (ts - startMs) / 1000;
    draw(clockT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  void booted;
})();
</script>
</body>
</html>
