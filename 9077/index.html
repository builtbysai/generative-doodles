<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9077 · Compass</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#22332c; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(233,238,220,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.7); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another compass</div>
<script>
'use strict';
// No9077 Compass.
// A field of small needles, one per grid point, each pointing where a
// seeded angle field tells it. The field is built from three sine
// terms at different scales, so whole regions agree (a weather system
// of direction) while the boundaries between regions churn. Needle
// length follows how strongly the terms agree there: long where the
// field is sure of itself, stubby where it is torn. Most needles are
// bone on deep green; a needle is vermilion where the field turns
// nearly vertical, a sparse accident the build does not place, only
// counts: seeds are kept when between 2 and 9 percent of needles come
// out vermilion, so the accidents stay rare enough to notice.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9077', 10) || 9077;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#22332c';
const BONE = 'rgba(233,238,220,0.88)';
const VERM = '#c65a34';

function compose(s) {
  const rnd = mulberry32(s);
  return {
    a1: 2.2 + rnd() * 1.6, a2: 3.4 + rnd() * 2.2, a3: 6.0 + rnd() * 3.0,
    p1: rnd() * Math.PI * 2, p2: rnd() * Math.PI * 2, p3: rnd() * Math.PI * 2,
    w1: 1.5 + rnd() * 0.7, w2: 0.9 + rnd() * 0.5, w3: 0.45 + rnd() * 0.3,
    base: rnd() * Math.PI * 2,
  };
}

// Returns [angle, certainty 0..1].
function needleAt(p, u, v) {
  const s1 = Math.sin(u * p.a1 * Math.PI + p.p1) * p.w1;
  const s2 = Math.sin(v * p.a2 * Math.PI + p.p2) * p.w2;
  const s3 = Math.sin((u + v) * p.a3 * Math.PI + p.p3) * p.w3;
  const sum = s1 + s2 + s3;
  const agreement = Math.abs(s1 + s2) / (p.w1 + p.w2);   // how much the big terms agree
  return [p.base + sum, Math.max(0.25, Math.min(1, agreement))];
}

function measure(p) {
  let verm = 0, n = 0;
  for (let i = 0; i <= 30; i++) for (let j = 0; j <= 30; j++) {
    const [ang] = needleAt(p, i / 30, j / 30);
    const vert = Math.abs(Math.sin(ang));       // 1 = vertical
    if (vert > 0.94) verm++;
    n++;
  }
  return verm / n;
}

function buildPiece(baseSeed) {
  let best = null, bestDist = 1;
  for (let attempt = 0; attempt < 24; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    const m = measure(p);
    const dist = Math.abs(m - 0.05);
    if (dist < bestDist) { bestDist = dist; best = p; }
    if (m >= 0.02 && m <= 0.09) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  const cols = 34;
  const cell = RX / cols;
  const rows = Math.max(10, Math.round(RY / cell));
  ctx.lineCap = 'round';
  for (let j = 0; j < rows; j++) {
    const v = (j + 0.5) / rows;
    for (let i = 0; i < cols; i++) {
      const u = (i + 0.5) / cols;
      const [ang, cert] = needleAt(p, u, v);
      const vert = Math.abs(Math.sin(ang)) > 0.94;
      const len = cell * 0.42 * cert;
      const cxp = ox + u * RX, cyp = oy + v * RY;
      const dx = Math.cos(ang) * len, dy = Math.sin(ang) * len;
      ctx.strokeStyle = vert ? VERM : BONE;
      ctx.lineWidth = Math.max(1, cell * 0.07);
      ctx.beginPath();
      ctx.moveTo(cxp - dx, cyp - dy);
      ctx.lineTo(cxp + dx, cyp + dy);
      ctx.stroke();
    }
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
