<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Room Is the Instrument</title>
<style>
html, body { margin: 0; padding: 0; background: #8A8680; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var WORLD = 3.0;           /* hall length, world units; one screen width shows 1.0 */
var FRAME_T = 6.0;         /* fixed phase: pulses mid-travel, figure mid-hall, mid-stride */
var FIG_X0 = 1.25;          /* figure starts mid-hall, brass horn in frame to the left, tall rack beside him */
var WALK_PHASE0 = 1.1;     /* mid-stride at frame one */
var WALK_VEL0 = 0.6;       /* mid-walk at frame one; decays to standing when idle */
var WALL = '#98948B';
var WALL_DARK = '#8A8680';
var WALL_SEAM = '#7E7A72';
var FLOOR = '#7A756D';
var FLOOR_LINE = '#6B665E';
var SKYLIGHT = '#C9C4B8';
var WOOD = '#6B4A2F';
var WOOD_DARK = '#54371F';
var COPPER = '#B87333';
var COPPER_DARK = '#8C5A2B';
var COPPER_LIGHT = '#D08A4A';
var BRASS = '#C9A227';
var BRASS_DARK = '#9A7B1E';
var BRASS_LIGHT = '#E3C766';
var PLINTH = '#F2EFE9';
var PLINTH_SHADE = '#D8D3C8';
var FIBER = '#E9E7DB';
var FIBER_DARK = '#CFCBB8';
var BLOWER = '#5B7A8C';
var BLOWER_DARK = '#47616F';
var HOSE = '#4A5560';
var PULSE = '#F5EFE0';
var FIGURE = '#1E1C1A';
var PLATE = '#2A2724';
var PLATE_LINE = 'rgba(245,239,224,0.40)';
var TITLE_INK = '#F2EFE9';
var HINT_INK = '#D8CFC0';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function modW(v) { var m = v % WORLD; return m < 0 ? m + WORLD : m; }
function worldDist(a, b) {
  var d = Math.abs(a - b) % WORLD;
  return d > WORLD / 2 ? WORLD - d : d;
}
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1834);
var phaseT = FRAME_T;
var figX = FIG_X0;
var walkPhase = WALK_PHASE0;
var walkVel = WALK_VEL0;
var facing = 1;
var dragging = false;
var lastDragX = 0;
var lastDragDist = 0;
var soundOn = false;
var audioCtx = null;
var noiseBuf = null;
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
/* hall layout: components spaced like gallery sculptures along the loop */
var COMPONENTS = [
  { type: 'rack', wx: 0.12, pipes: 7, w: 0.30, h: 0.42, seed: 0.13 },
  { type: 'blower', wx: 0.52 },
  { type: 'horn', wx: 0.98 },
  { type: 'rack', wx: 1.42, pipes: 5, w: 0.22, h: 0.50, seed: 0.47 },
  { type: 'fibers', wx: 1.88 },
  { type: 'rack', wx: 2.32, pipes: 6, w: 0.26, h: 0.38, seed: 0.81 },
  { type: 'fiber', wx: 2.72 }
];
/* seeded per-rack pipe heights, graduated short to tall with jitter */
var RACKS = [];
(function () {
  var i, j;
  for (i = 0; i < COMPONENTS.length; i++) {
    var c = COMPONENTS[i];
    if (c.type !== 'rack') continue;
    var heights = [];
    for (j = 0; j < c.pipes; j++) {
      heights.push(0.55 + 0.45 * (j / (c.pipes - 1)) + (rng() - 0.5) * 0.06);
    }
    RACKS.push({ wx: c.wx, pipes: c.pipes, w: c.w, h: c.h, seed: c.seed, heights: heights });
  }
})();
/* emitters: each cluster gates its drone gain by figure distance */
var EMITTERS = [
  { wx: 0.12, freq: 98.0, radius: 0.30, osc: null, gain: null },
  { wx: 0.98, freq: 61.7, radius: 0.34, osc: null, gain: null },
  { wx: 1.42, freq: 116.5, radius: 0.30, osc: null, gain: null },
  { wx: 1.88, freq: 146.8, radius: 0.30, osc: null, gain: null },
  { wx: 2.32, freq: 130.8, radius: 0.30, osc: null, gain: null },
  { wx: 2.72, freq: 164.8, radius: 0.26, osc: null, gain: null }
];
function emitterProx(em) {
  return clamp(1 - worldDist(figX, em.wx) / em.radius, 0, 1);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function sceneRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* screen x for a world x, wrapped so the hall loops around the camera */
function screenX(sc, wx) {
  var rel = modW(wx - figX + WORLD / 2) - WORLD / 2;
  return sc.x + (rel + 0.5) * sc.w;
}
function floorY(sc) { return sc.y + sc.h * 0.72; }
function drawHall(sc, t) {
  var gy = floorY(sc);
  var i, x;
  ctx.fillStyle = WALL;
  ctx.fillRect(sc.x, sc.y, sc.w, gy - sc.y);
  ctx.fillStyle = FLOOR;
  ctx.fillRect(sc.x, gy, sc.w, sc.y + sc.h - gy);
  /* skylight band near the ceiling, slow parallax */
  var skyOff = modW(figX * 0.4);
  ctx.fillStyle = rgba(SKYLIGHT, 0.35);
  for (i = -1; i < 4; i++) {
    x = sc.x + (((i * 0.5 - skyOff) % 1.5) + 1.5) % 1.5 * sc.w - sc.w * 0.06;
    ctx.fillRect(x, sc.y + sc.h * 0.03, sc.w * 0.12, sc.h * 0.02);
  }
  /* wall panel seams, slight parallax */
  ctx.strokeStyle = rgba(WALL_SEAM, 0.55);
  ctx.lineWidth = 1;
  var seamOff = modW(figX * 0.4);
  for (i = -1; i < 8; i++) {
    x = sc.x + (((i * 0.25 - seamOff) % 1.5) + 1.5) % 1.5 * sc.w;
    ctx.beginPath();
    ctx.moveTo(x, sc.y + sc.h * 0.06);
    ctx.lineTo(x, gy);
    ctx.stroke();
  }
  ctx.strokeStyle = rgba(WALL_SEAM, 0.4);
  ctx.beginPath();
  ctx.moveTo(sc.x, sc.y + sc.h * 0.06);
  ctx.lineTo(sc.x + sc.w, sc.y + sc.h * 0.06);
  ctx.stroke();
  /* floor board seams, full parallax, slight perspective slant */
  ctx.strokeStyle = rgba(FLOOR_LINE, 0.6);
  var boardOff = modW(figX);
  for (i = -1; i < 12; i++) {
    x = sc.x + (((i * 0.1 - boardOff) % 1.1) + 1.1) % 1.1 * sc.w;
    ctx.beginPath();
    ctx.moveTo(x, gy);
    ctx.lineTo(x + sc.w * 0.015, sc.y + sc.h);
    ctx.stroke();
  }
  ctx.strokeStyle = rgba(FLOOR_LINE, 0.35);
  ctx.beginPath();
  ctx.moveTo(sc.x, gy + sc.h * 0.10);
  ctx.lineTo(sc.x + sc.w, gy + sc.h * 0.10);
  ctx.stroke();
}
function drawShadow(sc, cx, w) {
  var gy = floorY(sc);
  var g = ctx.createRadialGradient(cx, gy + sc.h * 0.008, 0, cx, gy + sc.h * 0.008, w);
  g.addColorStop(0, 'rgba(0,0,0,0.30)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(cx, gy + sc.h * 0.008, w, sc.h * 0.012, 0, 0, TAU);
  ctx.fill();
}
function drawPipeRack(sc, rack, t) {
  var cx = screenX(sc, rack.wx);
  var gy = floorY(sc);
  var rw = rack.w * sc.w;
  var rh = rack.h * sc.h;
  var top = gy - rh;
  var i, pw = rw / rack.pipes;
  var prox = 0;
  for (i = 0; i < EMITTERS.length; i++) {
    if (Math.abs(EMITTERS[i].wx - rack.wx) < 0.01) prox = emitterProx(EMITTERS[i]);
  }
  drawShadow(sc, cx, rw * 0.62);
  /* wooden rack: posts and rails */
  ctx.fillStyle = WOOD_DARK;
  ctx.fillRect(cx - rw / 2 - sc.w * 0.006, top - sc.h * 0.012, sc.w * 0.012, rh + sc.h * 0.012);
  ctx.fillRect(cx + rw / 2 - sc.w * 0.006, top - sc.h * 0.012, sc.w * 0.012, rh + sc.h * 0.012);
  ctx.fillStyle = WOOD;
  ctx.fillRect(cx - rw / 2 - sc.w * 0.008, top - sc.h * 0.014, rw + sc.w * 0.016, sc.h * 0.014);
  ctx.fillRect(cx - rw / 2 - sc.w * 0.008, gy - sc.h * 0.014, rw + sc.w * 0.016, sc.h * 0.014);
  for (i = 0; i < rack.pipes; i++) {
    var ph = rh * rack.heights[i];
    var px = cx - rw / 2 + i * pw + pw * 0.08;
    var pw2 = pw * 0.84;
    var pTop = gy - ph;
    var grad = ctx.createLinearGradient(px, 0, px + pw2, 0);
    grad.addColorStop(0, COPPER_LIGHT);
    grad.addColorStop(0.5, COPPER);
    grad.addColorStop(1, COPPER_DARK);
    ctx.fillStyle = grad;
    ctx.fillRect(px, pTop, pw2, ph);
    /* pipe mouth */
    ctx.fillStyle = COPPER_DARK;
    ctx.beginPath();
    ctx.ellipse(px + pw2 / 2, pTop, pw2 / 2, Math.max(2, pw2 * 0.16), 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = rgba('#3A2415', 0.85);
    ctx.beginPath();
    ctx.ellipse(px + pw2 / 2, pTop, pw2 * 0.32, Math.max(1.5, pw2 * 0.10), 0, 0, TAU);
    ctx.fill();
    /* air pulse travelling up the pipe, closed-form function of t */
    var ph2 = ((t * 0.22 + rack.seed + i * 0.37) % 1 + 1) % 1;
    var py = gy - sc.h * 0.01 - ph2 * (ph - sc.h * 0.02);
    var pa = 0.55 * Math.sin(ph2 * Math.PI) * (0.35 + 0.65 * prox);
    if (pa > 0.02) {
      ctx.fillStyle = rgba(PULSE, pa);
      ctx.beginPath();
      ctx.ellipse(px + pw2 / 2, py, pw2 * 0.30, Math.max(3, sc.h * 0.012), 0, 0, TAU);
      ctx.fill();
    }
    /* faint tone ring at the mouth as the pulse leaves */
    if (ph2 > 0.86) {
      var ra = (ph2 - 0.86) / 0.14;
      ctx.strokeStyle = rgba(PULSE, (1 - ra) * 0.5 * (0.35 + 0.65 * prox));
      ctx.lineWidth = Math.max(1, sc.h * 0.003);
      ctx.beginPath();
      ctx.ellipse(px + pw2 / 2, pTop - ra * sc.h * 0.02, pw2 * (0.5 + ra * 0.5), Math.max(2, pw2 * 0.16 * (1 + ra)), 0, 0, TAU);
      ctx.stroke();
    }
  }
}
function drawBlower(sc, wx) {
  var cx = screenX(sc, wx);
  var gy = floorY(sc);
  var bw = sc.w * 0.14;
  var bh = sc.h * 0.15;
  drawShadow(sc, cx, bw * 0.7);
  /* hose snaking along the floor toward the rack on the left */
  ctx.strokeStyle = HOSE;
  ctx.lineWidth = Math.max(3, sc.h * 0.012);
  ctx.beginPath();
  ctx.moveTo(cx - bw * 0.5, gy - bh * 0.55);
  ctx.quadraticCurveTo(cx - bw * 0.9, gy - bh * 0.2, cx - bw * 1.15, gy - sc.h * 0.005);
  ctx.stroke();
  ctx.strokeStyle = rgba(HOSE, 0.6);
  ctx.lineWidth = Math.max(1, sc.h * 0.003);
  ctx.beginPath();
  ctx.moveTo(cx - bw * 0.5, gy - bh * 0.55);
  ctx.quadraticCurveTo(cx - bw * 0.9, gy - bh * 0.2, cx - bw * 1.15, gy - sc.h * 0.005);
  ctx.stroke();
  /* blower body */
  ctx.fillStyle = BLOWER_DARK;
  ctx.fillRect(cx - bw / 2, gy - bh, bw, bh);
  ctx.fillStyle = BLOWER;
  ctx.fillRect(cx - bw / 2 + sc.w * 0.004, gy - bh + sc.h * 0.006, bw - sc.w * 0.008, bh - sc.h * 0.006);
  /* fan grille */
  var fx = cx, fy = gy - bh * 0.55, fr = Math.min(bw, bh) * 0.30;
  ctx.fillStyle = BLOWER_DARK;
  ctx.beginPath();
  ctx.ellipse(fx, fy, fr, fr, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(PULSE, 0.55);
  ctx.lineWidth = Math.max(1, sc.h * 0.0025);
  var k;
  for (k = 0; k < 6; k++) {
    var a = k * Math.PI / 3;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx + Math.cos(a) * fr * 0.9, fy + Math.sin(a) * fr * 0.9);
    ctx.stroke();
  }
  ctx.strokeStyle = rgba(PULSE, 0.7);
  ctx.beginPath();
  ctx.ellipse(fx, fy, fr * 0.9, fr * 0.9, 0, 0, TAU);
  ctx.stroke();
  /* small control dial */
  ctx.fillStyle = PLINTH;
  ctx.beginPath();
  ctx.ellipse(cx + bw * 0.30, gy - bh * 0.16, sc.w * 0.006, sc.w * 0.006, 0, 0, TAU);
  ctx.fill();
}
function drawBrassHorn(sc, wx, t) {
  var cx = screenX(sc, wx);
  var gy = floorY(sc);
  var pw = sc.w * 0.13;
  var ph = sc.h * 0.11;
  var prox = 0;
  var i;
  for (i = 0; i < EMITTERS.length; i++) {
    if (Math.abs(EMITTERS[i].wx - wx) < 0.01) prox = emitterProx(EMITTERS[i]);
  }
  drawShadow(sc, cx, pw * 0.7);
  /* white plinth */
  ctx.fillStyle = PLINTH_SHADE;
  ctx.fillRect(cx - pw / 2, gy - ph, pw, ph);
  ctx.fillStyle = PLINTH;
  ctx.fillRect(cx - pw / 2 + sc.w * 0.003, gy - ph + sc.h * 0.004, pw - sc.w * 0.006, ph - sc.h * 0.004);
  var py = gy - ph;
  var hornLen = sc.w * 0.20;
  var bellR = sc.h * 0.085;
  var tubeY = py - sc.h * 0.10;
  /* horn tube flaring left into the bell */
  var grad = ctx.createLinearGradient(cx - hornLen, tubeY - bellR, cx + sc.w * 0.01, tubeY + bellR);
  grad.addColorStop(0, BRASS_LIGHT);
  grad.addColorStop(0.55, BRASS);
  grad.addColorStop(1, BRASS_DARK);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(cx + sc.w * 0.01, tubeY - sc.h * 0.012);
  ctx.lineTo(cx - hornLen + bellR * 0.4, tubeY - bellR * 0.92);
  ctx.lineTo(cx - hornLen + bellR * 0.4, tubeY + bellR * 0.92);
  ctx.lineTo(cx + sc.w * 0.01, tubeY + sc.h * 0.012);
  ctx.closePath();
  ctx.fill();
  /* bell rim */
  ctx.fillStyle = BRASS_DARK;
  ctx.beginPath();
  ctx.ellipse(cx - hornLen + bellR * 0.4, tubeY, sc.w * 0.008, bellR, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = BRASS_LIGHT;
  ctx.beginPath();
  ctx.ellipse(cx - hornLen + bellR * 0.4, tubeY, sc.w * 0.005, bellR * 0.82, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = rgba('#5E4A12', 0.9);
  ctx.beginPath();
  ctx.ellipse(cx - hornLen + bellR * 0.4, tubeY, sc.w * 0.0028, bellR * 0.62, 0, 0, TAU);
  ctx.fill();
  /* mouthpiece stem on the plinth */
  ctx.fillStyle = BRASS_DARK;
  ctx.fillRect(cx + sc.w * 0.008, tubeY - sc.h * 0.008, sc.w * 0.012, py - tubeY + sc.h * 0.008);
  /* warm breath at the bell when the horn speaks */
  var pulseA = 0.10 + 0.30 * prox;
  var breathe = 0.5 + 0.5 * Math.sin(t * 1.4);
  var bg = ctx.createRadialGradient(cx - hornLen, tubeY, 0, cx - hornLen, tubeY, bellR * 1.6);
  bg.addColorStop(0, rgba(PULSE, pulseA * (0.4 + 0.6 * breathe)));
  bg.addColorStop(1, rgba(PULSE, 0));
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(cx - hornLen, tubeY, bellR * 1.6, bellR * 1.6, 0, 0, TAU);
  ctx.fill();
}
function drawFiberHorn(sc, wx, flip, tall) {
  var cx = screenX(sc, wx);
  var gy = floorY(sc);
  var prox = 0;
  var i;
  for (i = 0; i < EMITTERS.length; i++) {
    if (Math.abs(EMITTERS[i].wx - wx) < 0.01) prox = emitterProx(EMITTERS[i]);
  }
  drawShadow(sc, cx, sc.w * 0.05);
  var standH = (tall ? sc.h * 0.30 : sc.h * 0.24);
  var hornLen = sc.w * 0.11;
  var bellR = sc.h * 0.055;
  var hy = gy - standH;
  /* stand */
  ctx.strokeStyle = '#3A3835';
  ctx.lineWidth = Math.max(2, sc.w * 0.004);
  ctx.beginPath();
  ctx.moveTo(cx, gy);
  ctx.lineTo(cx, hy);
  ctx.stroke();
  ctx.fillStyle = '#3A3835';
  ctx.fillRect(cx - sc.w * 0.02, gy - sc.h * 0.006, sc.w * 0.04, sc.h * 0.006);
  /* pale fiberglass horn, bell facing the flip direction */
  var dir = flip ? -1 : 1;
  var grad = ctx.createLinearGradient(cx, hy - bellR, cx, hy + bellR);
  grad.addColorStop(0, '#FFFFFF');
  grad.addColorStop(0.5, FIBER);
  grad.addColorStop(1, FIBER_DARK);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(cx - dir * sc.w * 0.008, hy - sc.h * 0.008);
  ctx.lineTo(cx + dir * (hornLen - bellR * 0.3), hy - bellR * 0.9);
  ctx.lineTo(cx + dir * (hornLen - bellR * 0.3), hy + bellR * 0.9);
  ctx.lineTo(cx - dir * sc.w * 0.008, hy + sc.h * 0.008);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = FIBER_DARK;
  ctx.beginPath();
  ctx.ellipse(cx + dir * (hornLen - bellR * 0.3), hy, sc.w * 0.005, bellR, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = rgba('#8F8B7A', 0.8);
  ctx.beginPath();
  ctx.ellipse(cx + dir * (hornLen - bellR * 0.3), hy, sc.w * 0.003, bellR * 0.7, 0, 0, TAU);
  ctx.fill();
  /* faint breath glow at the bell when this cluster speaks */
  if (prox > 0.05) {
    var g = ctx.createRadialGradient(cx + dir * hornLen, hy, 0, cx + dir * hornLen, hy, bellR * 1.4);
    g.addColorStop(0, rgba(PULSE, 0.35 * prox));
    g.addColorStop(1, rgba(PULSE, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx + dir * hornLen, hy, bellR * 1.4, bellR * 1.4, 0, 0, TAU);
    ctx.fill();
  }
}
function drawComponents(sc, t) {
  var i, c;
  for (i = 0; i < COMPONENTS.length; i++) {
    c = COMPONENTS[i];
    var rel = modW(c.wx - figX + WORLD / 2) - WORLD / 2;
    if (rel < -0.6 || rel > 0.6) continue;
    if (c.type === 'rack') {
      var r = null, j;
      for (j = 0; j < RACKS.length; j++) if (RACKS[j].wx === c.wx) r = RACKS[j];
      if (r) drawPipeRack(sc, r, t);
    } else if (c.type === 'blower') {
      drawBlower(sc, c.wx);
    } else if (c.type === 'horn') {
      drawBrassHorn(sc, c.wx, t);
    } else if (c.type === 'fibers') {
      drawFiberHorn(sc, c.wx - 0.045, false, true);
      drawFiberHorn(sc, c.wx + 0.045, true, false);
    } else if (c.type === 'fiber') {
      drawFiberHorn(sc, c.wx, false, true);
    }
  }
}
function drawFigure(sc) {
  var gy = floorY(sc);
  var figH = sc.h * 0.17;
  var u = figH / 100;
  var fx = sc.x + sc.w * 0.5;
  var amp = clamp(walkVel, 0, 1);
  var swing = 13 * u * amp;
  var lift = 3 * u * amp;
  var sA = Math.sin(walkPhase);
  var sB = Math.sin(walkPhase + Math.PI);
  ctx.save();
  ctx.translate(fx, gy);
  ctx.scale(facing, 1);
  /* soft shadow */
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(0, 2 * u, 16 * u, 3 * u, 0, 0, TAU);
  ctx.fill();
  /* legs */
  ctx.strokeStyle = FIGURE;
  ctx.lineCap = 'round';
  ctx.lineWidth = 3.2 * u;
  ctx.beginPath();
  ctx.moveTo(0, -38 * u);
  ctx.lineTo(swing * sA, -Math.max(0, lift * Math.max(0, sA)) * 0.4 - 1 * u);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -38 * u);
  ctx.lineTo(swing * sB, -Math.max(0, lift * Math.max(0, sB)) * 0.4 - 1 * u);
  ctx.stroke();
  /* torso, leaning slightly into the walk */
  ctx.fillStyle = FIGURE;
  ctx.beginPath();
  ctx.moveTo(-6 * u, -84 * u);
  ctx.quadraticCurveTo(2 * u + 2 * u * amp, -86 * u, 7 * u, -82 * u);
  ctx.lineTo(8 * u, -40 * u);
  ctx.lineTo(-7 * u, -40 * u);
  ctx.closePath();
  ctx.fill();
  /* arms, counter-swinging */
  ctx.strokeStyle = FIGURE;
  ctx.lineWidth = 2.6 * u;
  ctx.beginPath();
  ctx.moveTo(-5 * u, -80 * u);
  ctx.lineTo(-9 * u - 3 * u * amp * sB, -52 * u);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(6 * u, -80 * u);
  ctx.lineTo(10 * u + 3 * u * amp * sA, -52 * u);
  ctx.stroke();
  /* head */
  ctx.fillStyle = FIGURE;
  ctx.beginPath();
  ctx.ellipse(1 * u, -91 * u, 6.2 * u, 7 * u, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Room Is the Instrument').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Room Is the Instrument').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 19').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Room Is the Instrument', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 19', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to walk the hall.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, soundPlate.x + 12, soundPlate.y + 7);
}
/* ---- sound: closed-form model, real WebAudio only after a tap ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try { audioCtx = new AudioContext(); } catch (e) { return null; }
    try {
      var i;
      for (i = 0; i < EMITTERS.length; i++) {
        var em = EMITTERS[i];
        em.osc = audioCtx.createOscillator();
        em.osc.type = 'sine';
        em.osc.frequency.value = em.freq;
        em.gain = audioCtx.createGain();
        em.gain.gain.value = 0;
        em.osc.connect(em.gain);
        em.gain.connect(audioCtx.destination);
        em.osc.start();
      }
      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.5, audioCtx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      var j;
      for (j = 0; j < d.length; j++) d[j] = Math.random() * 2 - 1;
    } catch (e) { noiseBuf = null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function updateAudio() {
  if (!soundOn || !audioCtx) return;
  var now = audioCtx.currentTime;
  var i, nearest = 0;
  for (i = 0; i < EMITTERS.length; i++) {
    var em = EMITTERS[i];
    var prox = emitterProx(em);
    if (prox > nearest) nearest = prox;
    if (em.gain) em.gain.gain.setTargetAtTime(prox * prox * 0.10, now, 0.12);
  }
  if (noiseBuf && audioCtx.__breath) {
    audioCtx.__breath.gain.gain.setTargetAtTime(nearest * 0.05, now, 0.15);
    audioCtx.__breath.filter.frequency.setTargetAtTime(400 + 900 * nearest, now, 0.15);
  }
}
function startBreath() {
  if (!audioCtx || !noiseBuf || audioCtx.__breath) return;
  try {
    var src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    var bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 500;
    bp.Q.value = 0.8;
    var ng = audioCtx.createGain();
    ng.gain.value = 0;
    src.connect(bp);
    bp.connect(ng);
    ng.connect(audioCtx.destination);
    src.start();
    audioCtx.__breath = { gain: ng, filter: bp };
  } catch (e) {}
}
function applyDrag(dxPx, scW) {
  var dWorld = dxPx / scW;
  figX = modW(figX + dWorld);
  walkPhase += dWorld * 10;
  if (dxPx > 0) facing = 1;
  else if (dxPx < 0) facing = -1;
  walkVel = clamp(Math.abs(dWorld) * 4 + 0.2, 0, 1);
}
function draw() {
  size();
  var sc = sceneRect();
  var t = phaseT;
  ctx.fillStyle = WALL_DARK;
  ctx.fillRect(0, 0, VW, VH);
  /* keep the hall inside the scene rect; sculptures slice at the frame edge as they scroll */
  ctx.save();
  ctx.beginPath();
  ctx.rect(sc.x, sc.y, sc.w, sc.h);
  ctx.clip();
  drawHall(sc, t);
  drawComponents(sc, t);
  drawFigure(sc);
  ctx.restore();
  drawPlates();
  updateAudio();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    figX: function () { return figX; },
    walkPhase: function () { return walkPhase; },
    facing: function () { return facing; },
    drag: function (dxPx) { var sc = sceneRect(); applyDrag(dxPx, sc.w); draw(); },
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    nearestProx: function () {
      var best = 0, i;
      for (i = 0; i < EMITTERS.length; i++) best = Math.max(best, emitterProx(EMITTERS[i]));
      return best;
    }
  };
}
/* ---- frame one: fixed phase t = 6.0 s, pulses mid-travel, figure mid-hall, mid-stride ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (ev) {
    dragging = true;
    lastDragX = ev.clientX;
    lastDragDist = 0;
    try { ev.preventDefault(); } catch (e) {}
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!dragging) return;
    var dx = ev.clientX - lastDragX;
    lastDragX = ev.clientX;
    lastDragDist += Math.abs(dx);
    var sc = sceneRect();
    applyDrag(dx, sc.w);
    draw();
  });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });
  canvas.addEventListener('click', function (ev) {
    if (lastDragDist > 8) return;
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    var x = ev.clientX - rect.left;
    var y = ev.clientY - rect.top;
    if (x >= soundPlate.x && x <= soundPlate.x + soundPlate.w && y >= soundPlate.y && y <= soundPlate.y + soundPlate.h) {
      soundOn = !soundOn;
      if (soundOn) { ensureAudio(); startBreath(); }
      draw();
    }
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      if (!dragging) walkVel *= Math.exp(-dt * 2.2);
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
