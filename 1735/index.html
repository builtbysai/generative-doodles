<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Endless Shelf</title>
<style>
html, body { margin: 0; padding: 0; background: #2A1D12; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#2A1D12';
var CARD = '#3B2A1B';
var CARD_SHADOW = 'rgba(0,0,0,0.35)';
var CARD_LINE = 'rgba(237,230,214,0.28)';
var INK = '#EDE6D6';
var MUTED = 'rgba(237,230,214,0.55)';
var RULE = '#E85D1F';
var PLATE = '#241811';
var PLATE_LINE = 'rgba(237,230,214,0.30)';
var TITLE_INK = '#EDE6D6';
var HINT_INK = 'rgba(237,230,214,0.75)';
var SWAP_EVERY = 3.5;
var SWAP_ANIM = 0.9;
var EPOCH_LEN = 40;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* fixed opening shuffle, seeded once: frame one always shows this grid */
var rng = mulberry32(1735);
var grid = [];
(function initGrid() {
  var i, j, t;
  for (i = 1; i <= 24; i++) grid.push(i);
  for (i = grid.length - 1; i > 0; i--) {
    j = Math.floor(rng() * (i + 1));
    t = grid[i]; grid[i] = grid[j]; grid[j] = t;
  }
})();
var simTime = 0;
var swapsDone = 0;
var swapAnim = null;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* layout: card centered with margins, 8x3 grid filling its face */
function layout() {
  var cardW = Math.min(VW - (isPhone ? 32 : 160), 880);
  var cardH = cardW * 0.58;
  var pad = Math.round(cardW * 0.05);
  var titleH = isPhone ? 16 : 20;
  var gap = Math.max(4, Math.round(cardW * 0.012));
  var gridW = cardW - pad * 2;
  var gridH = cardH - pad * 2 - titleH - 14;
  return {
    cardW: cardW, cardH: cardH,
    cardX: (VW - cardW) / 2, cardY: (VH - cardH) / 2,
    pad: pad, titleH: titleH, gap: gap,
    gridX: (VW - cardW) / 2 + pad,
    gridY: (VH - cardH) / 2 + pad,
    cellW: (gridW - gap * 7) / 8,
    cellH: gridH / 3,
    gridH: gridH
  };
}
function colX(L, idx) {
  var col = idx % 8;
  return L.gridX + col * (L.cellW + L.gap) + L.cellW / 2;
}
function rowY(L, idx) {
  var row = Math.floor(idx / 8);
  return L.gridY + row * L.cellH + L.cellH / 2;
}
/* valid adjacent pairs stay inside one row (never across a row break) */
function validPairs() {
  var p = [], i;
  for (i = 0; i < 23; i++) if (i % 8 < 7) p.push(i);
  return p;
}
/* swap k is a pure function of k and the grid state it follows from:
   first 30 swaps of each 40-swap epoch pick an adjacent inversion
   (biased toward sortedness); the last 10 re-shuffle with random
   adjacent swaps. The epoch seed never repeats a cycle identically. */
function swapPairAt(k) {
  var rngK = mulberry32(1735 * 7919 + k);
  var phase = k % EPOCH_LEN;
  var i;
  if (phase < 30) {
    var inv = [];
    for (i = 0; i < 23; i++) {
      if (i % 8 < 7 && grid[i] > grid[i + 1]) inv.push(i);
    }
    if (inv.length) return inv[Math.floor(rngK() * inv.length)];
  }
  var pairs = validPairs();
  return pairs[Math.floor(rngK() * pairs.length)];
}
function doSwap(k) {
  var i = swapPairAt(k);
  var t = grid[i]; grid[i] = grid[i + 1]; grid[i + 1] = t;
  swapAnim = { fromA: i, fromB: i + 1, t0: (k + 1) * SWAP_EVERY };
}
function update(dt) {
  simTime += dt;
  while (simTime >= (swapsDone + 1) * SWAP_EVERY) {
    doSwap(swapsDone);
    swapsDone++;
  }
  if (swapAnim && simTime - swapAnim.t0 > SWAP_ANIM + 0.05) swapAnim = null;
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var L = layout();
  var i;
  /* card shadow and face */
  ctx.fillStyle = CARD_SHADOW;
  ctx.fillRect(L.cardX + 6, L.cardY + 8, L.cardW, L.cardH);
  ctx.fillStyle = CARD;
  ctx.fillRect(L.cardX, L.cardY, L.cardW, L.cardH);
  ctx.strokeStyle = CARD_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(L.cardX + 0.5, L.cardY + 0.5, L.cardW - 1, L.cardH - 1);
  /* the 24 numerals, 8 across by 3 down */
  var numPx = Math.floor(Math.min(L.cellH * 0.52, L.cellW * 0.62));
  ctx.font = '600 ' + numPx + 'px Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = INK;
  var animP = 0, ax = 0, bx = 0;
  if (swapAnim) {
    animP = clamp((simTime - swapAnim.t0) / SWAP_ANIM, 0, 1);
    animP = animP * animP * (3 - 2 * animP);
  }
  for (i = 0; i < 24; i++) {
    var x = colX(L, i), y = rowY(L, i);
    if (swapAnim && animP < 1) {
      /* the pair trades places on a small vertical arc so the two
         numerals pass without ever overlapping mid-glide */
      var lift = Math.sin(Math.PI * animP) * L.cellH * 0.25;
      if (i === swapAnim.fromB) { x = colX(L, swapAnim.fromA) + (colX(L, swapAnim.fromB) - colX(L, swapAnim.fromA)) * animP; y -= lift; }
      if (i === swapAnim.fromA) { x = colX(L, swapAnim.fromB) + (colX(L, swapAnim.fromA) - colX(L, swapAnim.fromB)) * animP; y += lift; }
    }
    ctx.fillText(String(grid[i]), x, y);
  }
  /* thin signal-orange rule, then the single title line at the bottom */
  var ruleY = L.gridY + L.gridH + 7;
  ctx.fillStyle = RULE;
  ctx.fillRect(L.cardX + L.pad, ruleY, L.cardW - L.pad * 2, 2);
  var titleLine = 'GREYFADE · PP982 · SIDE A · 24 TRACKS';
  var tlPx = isPhone ? 11 : 13;
  ctx.font = '600 ' + tlPx + 'px Helvetica, Arial, sans-serif';
  while (tlPx > 8 && ctx.measureText(titleLine).width > L.cardW - L.pad * 2) {
    tlPx -= 1;
    ctx.font = '600 ' + tlPx + 'px Helvetica, Arial, sans-serif';
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = MUTED;
  ctx.fillText(titleLine, L.cardX + L.pad, ruleY + 2 + L.titleH / 2 + 2);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  while (titlePx > 9 && ctx.measureText('The Endless Shelf').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  }
  var titleW = ctx.measureText('The Endless Shelf').width;
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var dateW = ctx.measureText('2006 · 10 · 12').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  ctx.fillText('The Endless Shelf', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 12', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. The numbers re-sort themselves.';
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { simTime = t; while (simTime >= (swapsDone + 1) * SWAP_EVERY) { doSwap(swapsDone); swapsDone++; } draw(); },
    grid: function () { return grid.slice(); },
    swapsDone: function () { return swapsDone; },
    simTime: function () { return simTime; },
    swapEvery: function () { return SWAP_EVERY; }
  };
}
/* ---- frame one: fixed phase, simTime 0, no swap yet ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) { update(dt); draw(); }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
