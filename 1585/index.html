<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchid, Regrown Every Minute</title>
<style>
html, body { margin: 0; padding: 0; background: #FAF6EF; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#FAF6EF';
var MAGENTA = '#D83A8C';
var VIOLET = '#7A3FD1';
var CRIMSON = '#C02448';
var LEAF = '#4E9A51';
var HUES = [MAGENTA, VIOLET, CRIMSON];
var CYCLE = 60;                 // one life, in seconds
var FIRST_PHASE = 38;           // fixed first frame: stem, leaves and buds done, petals mostly open
var SEEDS = [158501, 158502, 158503, 158504, 158505, 158506, 158507, 158508];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, U = 0, CX = 0, lastT = 0, startT = null;
var orchid = null;              // geometry for the current life, in orchid space

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  // Orchid ~70% of frame height; capped so the lateral spread keeps
  // generous white margins on narrow phones.
  U = Math.min(0.70 * VH, 1.45 * VW);
  CX = VW / 2;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function ease(p) { p = clamp(p, 0, 1); return 1 - (1 - p) * (1 - p) * (1 - p); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mix(h1, h2, f) {
  var a = hexRgb(h1), b = hexRgb(h2);
  var r = Math.round(a[0] + (b[0] - a[0]) * f);
  var g = Math.round(a[1] + (b[1] - a[1]) * f);
  var bl = Math.round(a[2] + (b[2] - a[2]) * f);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
function alpha(v) { return Number(clamp(v, 0, 1).toFixed(4)); }
// Orchid space: x in units of U from the stem base, y from 0 (bottom
// edge) to 1 (top of the flower head). Map to pixels.
function px(x) { return CX + x * U; }
function py(y) { return VH - y * U; }
function qbez(p0, p1, p2, s) {
  var u = 1 - s;
  return [u * u * p0[0] + 2 * u * s * p1[0] + s * s * p2[0],
          u * u * p0[1] + 2 * u * s * p1[1] + s * s * p2[1]];
}
// Build one life from its fixed seed. Every parameter is authored by
// the seed table: no Math.random anywhere, so each life is reproducible.
function buildOrchid(seed) {
  var rnd = mulberry32(seed);
  var lean = (rnd() - 0.5) * 0.16;          // stem tip lateral offset
  var bend = (rnd() - 0.5) * 0.10;          // stem control offset
  var hueIdx = Math.floor(rnd() * 3);
  var accentIdx = (hueIdx + 1 + Math.floor(rnd() * 2)) % 3;
  var nFlowers = 3 + Math.floor(rnd() * 2); // 3-4 blooms
  var nBuds = 2 + Math.floor(rnd() * 3);    // 2-4 buds
  var nLeaves = 2 + Math.floor(rnd() * 2);  // 2-3 leaves
  var swayPh = rnd() * TAU;
  // Stem: quadratic bezier sampled into a polyline.
  var stem = [], i, s;
  for (i = 0; i <= 30; i++) {
    s = i / 30;
    stem.push(qbez([0, 0], [bend, 0.55], [lean, 1.0], s));
  }
  function stemAt(s2) {
    var f = clamp(s2, 0, 1) * 30, i0 = Math.floor(f), i1 = Math.min(30, i0 + 1);
    var t = f - i0;
    return [stem[i0][0] + (stem[i1][0] - stem[i0][0]) * t,
            stem[i0][1] + (stem[i1][1] - stem[i0][1]) * t];
  }
  // Flowers: top first, opening bottom-up. Lateral offsets alternate.
  var flowers = [];
  var fS = [0.99, 0.86, 0.74, 0.62];
  for (i = 0; i < nFlowers; i++) {
    var base = stemAt(fS[i]);
    var side = (i % 2 === 0) ? 1 : -1;
    var off = side * (0.05 + rnd() * 0.05);
    flowers.push({
      x: base[0] + off, y: base[1] + 0.01,
      r: i === 0 ? 0.105 : 0.085 - i * 0.006,
      delay: (nFlowers - 1 - i) * 1.2,
      tilt: side * (0.10 + rnd() * 0.15)
    });
  }
  // Buds on short stalks further down the stem.
  var buds = [];
  var bS = [0.52, 0.66, 0.80, 0.94];
  for (i = 0; i < nBuds; i++) {
    var bb = stemAt(bS[i]);
    var bs = (i % 2 === 0) ? 1 : -1;
    buds.push({ x: bb[0] + bs * 0.045, y: bb[1] + 0.015, r: 0.020 + rnd() * 0.010 });
  }
  // Leaves low on the stem, angled outward.
  var leaves = [];
  var lS = [0.16, 0.30, 0.44];
  for (i = 0; i < nLeaves; i++) {
    var lb = stemAt(lS[i]);
    var ls = (i % 2 === 0) ? 1 : -1;
    leaves.push({
      x: lb[0], y: lb[1],
      ang: ls * (0.55 + rnd() * 0.35),
      len: 0.15 + rnd() * 0.05,
      wid: 0.045 + rnd() * 0.015
    });
  }
  // Paint-dust particles, sampled from the stored geometry so the
  // dissolve scatters the actual flower, never pixels.
  var parts = [];
  function addPart(x, y, color, size) {
    var a = rnd() * TAU;
    var d = 0.05 + rnd() * 0.20;
    parts.push({
      x: x, y: y, color: color, size: size,
      vx: Math.cos(a) * d, vy: Math.sin(a) * d * 0.7 + 0.06,
      a0: 0.55 + rnd() * 0.45
    });
  }
  var f, p, k, ang, rr, dab;
  for (f = 0; f < flowers.length; f++) {
    var fl = flowers[f];
    for (p = 0; p < 5; p++) {
      var pa = fl.tilt + (-58 + p * 29) * Math.PI / 180;
      for (k = 0; k < 6; k++) {
        ang = rnd() * TAU; rr = Math.sqrt(rnd());
        dab = 0.35 + 0.6 * rnd();
        addPart(
          fl.x + Math.sin(pa) * fl.r * 1.05 * dab + Math.cos(ang) * fl.r * 0.32 * rr,
          fl.y + Math.cos(pa) * fl.r * 1.05 * dab + Math.sin(ang) * fl.r * 0.32 * rr,
          (k % 3 === 0) ? HUES[accentIdx] : HUES[hueIdx],
          0.006 + rnd() * 0.008
        );
      }
    }
    for (k = 0; k < 4; k++) addPart(fl.x + (rnd() - 0.5) * fl.r * 0.3, fl.y + (rnd() - 0.5) * fl.r * 0.3, HUES[accentIdx], 0.005 + rnd() * 0.006);
  }
  for (i = 0; i < stem.length; i += 2) addPart(stem[i][0], stem[i][1], LEAF, 0.005 + rnd() * 0.007);
  for (i = 0; i < leaves.length; i++) {
    for (k = 0; k < 10; k++) {
      var lv = leaves[i];
      var lt = rnd();
      addPart(lv.x + Math.sin(lv.ang) * lv.len * lt + (rnd() - 0.5) * lv.wid,
              lv.y + Math.cos(lv.ang) * lv.len * lt + (rnd() - 0.5) * lv.wid,
              LEAF, 0.005 + rnd() * 0.007);
    }
  }
  for (i = 0; i < buds.length; i++) {
    for (k = 0; k < 6; k++) addPart(buds[i].x + (rnd() - 0.5) * buds[i].r * 2, buds[i].y + (rnd() - 0.5) * buds[i].r * 2, HUES[hueIdx], 0.005 + rnd() * 0.006);
  }
  return {
    seed: seed, stem: stem, flowers: flowers, buds: buds, leaves: leaves,
    parts: parts, hue: HUES[hueIdx], accent: HUES[accentIdx], swayPh: swayPh
  };
}
function drawStem(p, geoA) {
  if (p <= 0) return;
  var n = orchid.stem.length, upto = Math.max(1, Math.floor(p * (n - 1)));
  var i, a, b;
  ctx.lineCap = 'round';
  for (i = 0; i < upto; i++) {
    a = orchid.stem[i]; b = orchid.stem[i + 1];
    var s = i / (n - 1);
    ctx.globalAlpha = alpha(0.95 * geoA);
    ctx.strokeStyle = LEAF;
    ctx.lineWidth = Math.max(1, U * 0.011 * (1 - s * 0.55));
    ctx.beginPath();
    ctx.moveTo(px(a[0]), py(a[1]));
    ctx.lineTo(px(b[0]), py(b[1]));
    ctx.stroke();
  }
  // Pale highlight thread along the grown stem.
  ctx.globalAlpha = alpha(0.35 * geoA);
  ctx.strokeStyle = mix(LEAF, GROUND, 0.45);
  ctx.lineWidth = Math.max(1, U * 0.0035);
  ctx.beginPath();
  for (i = 0; i <= upto; i++) {
    var pt = orchid.stem[i];
    if (i === 0) ctx.moveTo(px(pt[0]) - U * 0.002, py(pt[1]));
    else ctx.lineTo(px(pt[0]) - U * 0.002, py(pt[1]));
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawLeaf(lv, p, geoA) {
  if (p <= 0) return;
  var len = lv.len * p, wid = lv.wid * (0.4 + 0.6 * p);
  var ex = lv.x + Math.sin(lv.ang) * len, ey = lv.y + Math.cos(lv.ang) * len;
  ctx.globalAlpha = alpha(0.92 * geoA);
  ctx.fillStyle = LEAF;
  ctx.beginPath();
  ctx.moveTo(px(lv.x), py(lv.y));
  ctx.ellipse(px((lv.x + ex) / 2), py((lv.y + ey) / 2), Math.max(1, wid * U), Math.max(1, len * U / 2), lv.ang + Math.PI, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = alpha(0.5 * geoA);
  ctx.strokeStyle = mix(LEAF, GROUND, 0.5);
  ctx.lineWidth = Math.max(1, U * 0.0025);
  ctx.beginPath();
  ctx.moveTo(px(lv.x), py(lv.y));
  ctx.lineTo(px(ex), py(ey));
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawBud(bd, p, geoA) {
  if (p <= 0) return;
  var r = bd.r * (0.35 + 0.65 * p);
  ctx.globalAlpha = alpha(0.95 * geoA);
  ctx.fillStyle = orchid.hue;
  ctx.beginPath();
  ctx.moveTo(px(bd.x + r), py(bd.y));
  ctx.arc(px(bd.x), py(bd.y), Math.max(0.5, r * U), 0, TAU);
  ctx.fill();
  ctx.globalAlpha = alpha(0.6 * geoA);
  ctx.fillStyle = orchid.accent;
  ctx.beginPath();
  ctx.moveTo(px(bd.x + r * 0.5), py(bd.y - r * 0.3));
  ctx.arc(px(bd.x), py(bd.y - r * 0.2), Math.max(0.5, r * 0.45 * U), 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;
}
function drawPetal(fl, ang, len, wid, p, geoA) {
  if (p <= 0) return;
  var cx = fl.x, cy = fl.y;
  var dx = Math.sin(ang), dy = Math.cos(ang);
  var cols = [orchid.hue, mix(orchid.hue, GROUND, 0.28), mix(orchid.hue, '#000000', 0.18)];
  var k, t, dxx, dyy, rr;
  for (k = 0; k < 3; k++) {
    t = 0.30 + k * 0.25;
    dxx = cx + dx * len * t * p;
    dyy = cy + dy * len * t * p;
    rr = wid * (1 - k * 0.12) * (0.6 + 0.4 * p);
    ctx.globalAlpha = alpha((0.88 - k * 0.10) * geoA);
    ctx.fillStyle = cols[k];
    ctx.beginPath();
    ctx.moveTo(px(dxx + rr), py(dyy));
    ctx.ellipse(px(dxx), py(dyy), Math.max(0.5, rr * U), Math.max(0.5, rr * 0.72 * U), ang - Math.PI / 2, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawFlower(fl, ct, geoA, sway) {
  var base = 28 + fl.delay;
  var i, pp;
  // Soft wash at the flower centre so the petals read as one bloom.
  var wash = ease((ct - base) / 3);
  if (wash > 0) {
    ctx.globalAlpha = alpha(0.18 * wash * geoA);
    ctx.fillStyle = orchid.hue;
    ctx.beginPath();
    ctx.moveTo(px(fl.x + fl.r * 0.55), py(fl.y));
    ctx.arc(px(fl.x), py(fl.y), Math.max(0.5, fl.r * 0.55 * U), 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  // Five petals fanning upward, then a darker lip petal below.
  for (i = 0; i < 5; i++) {
    pp = ease((ct - base - i * 2.2) / 4);
    if (pp <= 0) continue;
    var ang = fl.tilt + (-58 + i * 29) * Math.PI / 180;
    var len = fl.r * 0.95 * (i === 2 ? 1.15 : (i === 0 || i === 4 ? 0.9 : 1.02));
    drawPetal(fl, ang, len, fl.r * 0.42, pp, geoA);
  }
  pp = ease((ct - base - 5 * 2.2) / 4);
  if (pp > 0) {
    // Lip petal, in the accent hue, pointing down.
    var save = orchid.hue;
    orchid.hue = orchid.accent;
    drawPetal(fl, fl.tilt + Math.PI, fl.r * 0.72, fl.r * 0.30, pp, geoA);
    orchid.hue = save;
  }
  // Flower centre: a small column of accent dots.
  var cp = ease((ct - base - 6) / 3);
  if (cp > 0) {
    ctx.globalAlpha = alpha(0.95 * cp * geoA);
    ctx.fillStyle = orchid.accent;
    for (i = 0; i < 3; i++) {
      var ox = (i - 1) * fl.r * 0.16;
      ctx.beginPath();
      ctx.moveTo(px(fl.x + ox + fl.r * 0.09), py(fl.y + sway * 0.4));
      ctx.arc(px(fl.x + ox), py(fl.y + sway * 0.4), Math.max(0.5, fl.r * 0.09 * U), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}
function drawParticles(diss) {
  var i, pt;
  for (i = 0; i < orchid.parts.length; i++) {
    pt = orchid.parts[i];
    var x = pt.x + pt.vx * diss;
    var y = pt.y + pt.vy * diss;
    ctx.globalAlpha = alpha(pt.a0 * (1 - diss));
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.moveTo(px(x + pt.size), py(y));
    ctx.arc(px(x), py(y), Math.max(0.5, pt.size * U * (1 + diss * 0.6)), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function draw(t) {
  lastT = t;
  size();
  var cyc = Math.floor(t / CYCLE);
  var ct = t - cyc * CYCLE;
  var seed = SEEDS[((cyc % SEEDS.length) + SEEDS.length) % SEEDS.length];
  if (!orchid || orchid.seed !== seed) orchid = buildOrchid(seed);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  // Growth order, legible: stem 0-14s, leaves 8-24s, buds 18-34s,
  // petals 28-46s, full bloom 46-55s, dissolve 55-60s.
  var stemP = ease(ct / 14);
  var leafP = ease((ct - 8) / 16);
  var budP = ease((ct - 18) / 16);
  var diss = clamp((ct - 55) / 5, 0, 1);
  var geoA = 1 - diss;
  var sway = Math.sin(TAU * t / 9 + orchid.swayPh) * 0.006 * ease((ct - 40) / 6);
  var i;
  drawStem(stemP, geoA);
  for (i = 0; i < orchid.leaves.length; i++) drawLeaf(orchid.leaves[i], leafP, geoA);
  for (i = 0; i < orchid.buds.length; i++) drawBud(orchid.buds[i], budP, geoA);
  for (i = 0; i < orchid.flowers.length; i++) {
    var fl = orchid.flowers[i];
    var flSway = { x: fl.x + sway, y: fl.y };
    var saveX = fl.x;
    fl.x = flSway.x;
    drawFlower(fl, ct, geoA, sway);
    fl.x = saveX;
  }
  if (diss > 0) drawParticles(diss);
  // Elapsed-seconds counter: a function of the fixed loop phase.
  var ss = Math.floor(ct);
  var label = '00:' + (ss < 10 ? '0' : '') + ss;
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#7A7268';
  ctx.font = Math.round(Math.max(13, U * 0.032)) + 'px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(label, Math.round(VW * 0.045), Math.round(VH * 0.05));
  if (typeof window !== 'undefined') {
    window.__p1585 = {
      t: t, cycle: cyc, ct: Number(ct.toFixed(2)), seed: seed,
      flowers: orchid.flowers.length, buds: orchid.buds.length,
      leaves: orchid.leaves.length, parts: orchid.parts.length,
      phone: isPhone()
    };
  }
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(FIRST_PHASE);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = FIRST_PHASE + (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
