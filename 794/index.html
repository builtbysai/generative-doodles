<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Red Doorway</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F7F5F0; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Strict palette (EXPANSION #97 niele-toroni, PP3 "The Red Doorway").
  var WALL = '#F7F5F0';
  var PARQUET = '#C69A5E';
  var VERMILION = '#C73E1D';
  var CANVAS_GROUND = '#EFEDE6';
  var BLACK = '#1A1A1A';
  var ORANGE = '#E06A1B';
  var DARK = '#232323'; // doorway interior, borrowed from the study's other rooms

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0;
  var L = null;          // layout, recomputed on resize
  var doorU = 0.24;      // doorway centre as a fraction of W (home: left third)
  var drag = null;       // recorded pointer state: { grabDx } while dragging
  var wrapCache = {};    // doorway x (px, rounded) -> wrapped lattice points

  function isPhone(w, h) {
    if (typeof window !== 'undefined' && window.screen &&
        window.screen.width > 0 && window.screen.height > 0) {
      return Math.min(window.screen.width, window.screen.height) < 700;
    }
    return h > w * 1.15; // fallback only
  }

  function layout() {
    var floorH = Math.round(H * 0.20);
    var wallH = H - floorH;
    var doorW = Math.round(W * 0.17);
    var doorH = Math.round(wallH * 0.84);
    var doorTop = wallH - doorH;
    var stepX = W / 10.5;
    var stepY = wallH / 6.5;
    var dabS = stepX * 0.34;
    var cvsW = Math.round(Math.min(W * 0.16, H * 0.16));
    var cvsH = Math.round(cvsW * 1.18);
    var cvsY = Math.round(wallH * 0.30);
    var cvs2x = Math.round(W - cvsW - W * 0.03);
    var cvs1x = Math.round(cvs2x - cvsW - W * 0.035);
    var canvases = [
      { x: cvs1x, y: cvsY, w: cvsW, h: cvsH, color: BLACK, seed: 11 },
      { x: cvs2x, y: cvsY, w: cvsW, h: cvsH, color: ORANGE, seed: 23 }
    ];
    // Doorway travel: from near the left edge to just clear of the canvases.
    var doorMin = doorW / 2 + W * 0.035;
    var doorMax = canvases[0].x - W * 0.045 - doorW / 2;
    L = {
      floorH: floorH, wallH: wallH,
      doorW: doorW, doorH: doorH, doorTop: doorTop,
      stepX: stepX, stepY: stepY, dabS: dabS,
      canvases: canvases, doorMin: doorMin, doorMax: doorMax,
      phone: isPhone(W, H)
    };
    wrapCache = {};
  }

  function doorCx() {
    var cx = doorU * W;
    if (cx < L.doorMin) cx = L.doorMin;
    if (cx > L.doorMax) cx = L.doorMax;
    return cx;
  }

  // The base lattice: brick-offset rows over the wall. Pure function of layout.
  function latticePoints() {
    var pts = [];
    var row = 0;
    for (var y = L.stepY * 0.78; y < L.wallH - L.dabS * 0.4; y += L.stepY, row++) {
      var off = (row % 2 === 1) ? L.stepX * 0.5 : 0;
      var col = 0;
      for (var x = L.stepX * 0.55 + off; x < W - L.dabS * 0.3; x += L.stepX, col++) {
        pts.push({ x: x, y: y, idx: row * 40 + col });
      }
    }
    return pts;
  }

  // Wrap construction: for a given doorway centre x, every lattice point is
  // tested against the doorway exclusion rect (the opening expanded by half a
  // dab plus a small clearance). A point inside shifts to the nearest free
  // position hugging the frame: left edge, right edge, or top edge of the
  // exclusion rect, whichever is closest. Points under the small canvases are
  // covered, so they are dropped. Results are cached per doorway x so a drag
  // recomputes each position once and then replays it instantly: the grid is
  // the constant, the architecture is the variable, the re-wrap is mechanical.
  function wrappedPoints(cx) {
    var key = Math.round(cx);
    if (wrapCache[key]) return wrapCache[key];
    var half = L.dabS * 0.5 + 5;
    var exL = cx - L.doorW / 2 - half, exR = cx + L.doorW / 2 + half;
    var exT = L.doorTop - half, exB = L.wallH + half;
    var out = [];
    var base = latticePoints();
    for (var i = 0; i < base.length; i++) {
      var p = base[i];
      var covered = false;
      for (var j = 0; j < L.canvases.length; j++) {
        var cv = L.canvases[j];
        if (p.x > cv.x - 4 && p.x < cv.x + cv.w + 4 && p.y > cv.y - 4 && p.y < cv.y + cv.h + 4) {
          covered = true; break;
        }
      }
      if (covered) continue;
      if (p.x > exL && p.x < exR && p.y > exT && p.y < exB) {
        // Inside the exclusion zone: shift to the nearest frame edge.
        var dLeft = p.x - exL, dRight = exR - p.x, dTop = p.y - exT;
        var nx = p.x, ny = p.y;
        if (dTop <= dLeft && dTop <= dRight) { ny = exT - L.dabS * 0.28; }
        else if (dLeft <= dRight) { nx = exL - L.dabS * 0.28; }
        else { nx = exR + L.dabS * 0.28; }
        out.push({ x: nx, y: ny, idx: p.idx });
      } else {
        out.push(p);
      }
    }
    wrapCache[key] = out;
    return out;
  }

  // One Toroni imprint: a squarish dab whose bristle streaks all start at the
  // top edge (where the brush first pressed) and die out downward, so the top
  // reads dense and the bottom dry. Texture is a pure function of the imprint
  // index: same lattice point, same dab, every frame, every device.
  function dab(x, y, s, color, idx) {
    var rnd = mulberry32(794131 + idx * 1013);
    var rot = (rnd() * 2 - 1) * 0.035;
    var sc = 0.95 + rnd() * 0.10;
    var w = s, h = s * 0.92;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(sc, sc);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.58;
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.globalAlpha = 0.72;
    ctx.fillRect(-w / 2, -h / 2, w, h * 0.30); // pressed top band
    var streaks = 15;
    for (var k = 0; k < streaks; k++) {
      var sx = -w / 2 + rnd() * w;
      var len = h * (0.45 + rnd() * 0.55);
      var sw = 0.8 + rnd() * 1.7;
      ctx.globalAlpha = 0.30 + rnd() * 0.40;
      ctx.fillRect(sx, -h / 2, sw, len);
    }
    ctx.globalAlpha = 0.35; // a couple of dry flecks near the bottom edge
    ctx.fillRect(-w / 2 + rnd() * w * 0.6, h * 0.28, w * 0.22, 1.6);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawRoom(cx) {
    // Wall (also the page ground).
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);

    // Parquet floor: flat tone, cheap perspective.
    ctx.fillStyle = PARQUET;
    ctx.fillRect(0, L.wallH, W, L.floorH);
    var vpx = W * 0.46, vpy = L.wallH;
    ctx.strokeStyle = DARK;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.16;
    ctx.beginPath();
    for (var b = -1; b <= 9; b++) {
      var bx = (W / 8) * b + W * 0.06;
      ctx.moveTo(bx, H);
      ctx.lineTo(vpx + (bx - vpx) * 0.12, vpy);
    }
    ctx.stroke();
    ctx.globalAlpha = 0.13;
    ctx.beginPath();
    var fr = [0.20, 0.45, 0.72];
    for (var f = 0; f < fr.length; f++) {
      var fy = L.wallH + L.floorH * fr[f];
      ctx.moveTo(0, fy);
      ctx.lineTo(W, fy);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    // Skirting line at the wall/floor junction.
    ctx.fillStyle = DARK;
    ctx.globalAlpha = 0.20;
    ctx.fillRect(0, L.wallH - 2, W, 2);
    ctx.globalAlpha = 1;
  }

  function drawDoorway(cx) {
    var x = cx - L.doorW / 2, y = L.doorTop;
    // Soft shadow the frame casts on the wall.
    ctx.fillStyle = DARK;
    ctx.globalAlpha = 0.16;
    ctx.fillRect(x + 7, y + 5, L.doorW, L.doorH);
    ctx.globalAlpha = 1;
    // Frame trim.
    ctx.fillStyle = CANVAS_GROUND;
    ctx.fillRect(x - 5, y - 5, L.doorW + 10, L.doorH + 5);
    // The opening.
    ctx.fillStyle = DARK;
    ctx.fillRect(x, y, L.doorW, L.doorH);
    // A breath of light on the inner top jamb; the parquet runs into the dark.
    ctx.fillStyle = WALL;
    ctx.globalAlpha = 0.10;
    ctx.fillRect(x, y, L.doorW, 3);
    ctx.globalAlpha = 1;
    ctx.fillStyle = PARQUET;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(x, L.wallH - 5, L.doorW, 5);
    ctx.globalAlpha = 1;
  }

  function drawCanvases() {
    for (var j = 0; j < L.canvases.length; j++) {
      var cv = L.canvases[j];
      ctx.fillStyle = DARK;
      ctx.globalAlpha = 0.15;
      ctx.fillRect(cv.x + 5, cv.y + 5, cv.w, cv.h);
      ctx.globalAlpha = 1;
      ctx.fillStyle = CANVAS_GROUND;
      ctx.fillRect(cv.x, cv.y, cv.w, cv.h);
      ctx.strokeStyle = DARK;
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(cv.x + 0.5, cv.y + 0.5, cv.w - 1, cv.h - 1);
      ctx.globalAlpha = 1;
      var s = cv.w * 0.17;
      var gx = [0.26, 0.52, 0.78], gy = [0.28, 0.55, 0.82];
      for (var r = 0; r < 3; r++) {
        for (var c = 0; c < 3; c++) {
          dab(cv.x + cv.w * gx[c], cv.y + cv.h * gy[r], s, cv.color, cv.seed * 100 + r * 10 + c);
        }
      }
    }
  }

  function draw() {
    if (!L) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var cx = doorCx();
    drawRoom(cx);
    var pts = wrappedPoints(cx);
    for (var i = 0; i < pts.length; i++) {
      dab(pts[i].x, pts[i].y, L.dabS, VERMILION, pts[i].idx);
    }
    drawDoorway(cx);
    drawCanvases();
  }

  function resize() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    }
    if (!w && typeof window !== 'undefined') { w = window.innerWidth; h = window.innerHeight; }
    if (!w) { w = 1280; h = 900; }
    W = Math.round(w); H = Math.round(h);
    canvas.width = W; canvas.height = H;
    layout();
    draw();
  }

  function ptrX(e) { return (typeof e.clientX === 'number') ? e.clientX : 0; }

  function onDown(e) {
    var cx = doorCx();
    var px = ptrX(e);
    var py = (typeof e.clientY === 'number') ? e.clientY : 0;
    if (Math.abs(px - cx) <= L.doorW / 2 + 16 && py >= L.doorTop - 16 && py <= L.wallH + 4) {
      drag = { grabDx: px - cx };
      if (canvas.setPointerCapture && e.pointerId !== undefined) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (e.preventDefault) e.preventDefault();
    }
  }

  function onMove(e) {
    if (!drag) return;
    var cx = ptrX(e) - drag.grabDx;
    if (cx < L.doorMin) cx = L.doorMin;
    if (cx > L.doorMax) cx = L.doorMax;
    doorU = cx / W;
    draw();
  }

  function onUp() { drag = null; }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  resize(); // frame one: synchronous draw, doorway home, grid wrapped

  if (typeof requestAnimationFrame !== 'undefined') {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
