<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.335 Raudra Roop</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#121110; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.335 Raudra Roop (arunima-dazess-wangchuk).
// A wrathful deity mask in glazed ceramic fills the frame:
// crown of skulls, spiral brows, bulging eyes, fangs and a
// protruding tongue. The mask itself is fixed symmetric path
// data, drawn every frame and never moving. What moves is the
// glaze: stepped colour cells as JS data, clipped to the mask
// silhouette by a path clip on this one canvas, their colour
// indices advected by a travelling wave. Pooling is not
// computed at runtime: an authored concavity table darkens
// the cells around the crevices and thins the cells on the
// high points toward glaze blue. The wave completes whole
// cycles in the 60s loop, so frame 60s is pixel identical
// to frame 0. Watch only: there is no interaction at all.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#121110';
var TURQ = '#4FA3A3', TEAL = '#2E6E6A', BLUE = '#3D6E8C';
var POOL = '#1E2A30', CLAY = '#8A5A3B';
var GLAZE = [POOL, TEAL, TURQ, BLUE];
var DW = 1280, DH = 900;
var CX = 640, CY = 480;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 60;
var T = 27.3, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function mx(x) { return 1280 - x; }

// ---- mask silhouette: symmetric control polygon, smoothed ----
// Authored once, closed Catmull-Rom sampling. The crown rises
// just past the top edge and the chin just past the bottom, so
// the frame crops the mask slightly, as specced.
var SIL_CTRL = [
  [640, 2], [733, -8], [847, 2], [943, 42], [1016, 114],
  [1060, 212], [1089, 330], [1108, 452], [1084, 578],
  [1023, 702], [940, 808], [838, 878], [735, 906], [640, 914],
  [545, 906], [442, 878], [340, 808], [257, 702], [196, 578],
  [172, 452], [191, 330], [220, 212], [264, 114], [337, 42],
  [433, 2], [547, -8]
];
var SIL = [];
(function () {
  var n = SIL_CTRL.length, i, j, p0, p1, p2, p3, t, t2, t3;
  for (i = 0; i < n; i++) {
    p0 = SIL_CTRL[(i + n - 1) % n]; p1 = SIL_CTRL[i];
    p2 = SIL_CTRL[(i + 1) % n]; p3 = SIL_CTRL[(i + 2) % n];
    for (j = 0; j < 8; j++) {
      t = j / 8; t2 = t * t; t3 = t2 * t;
      SIL.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
      ]);
    }
  }
})();
function silPath(scale) {
  var i, x, y;
  ctx.beginPath();
  for (i = 0; i < SIL.length; i++) {
    x = CX + (SIL[i][0] - CX) * scale;
    y = 455 + (SIL[i][1] - 455) * scale;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

// ---- authored concavity table --------------------------------
// Crevice points sampled by hand along the brow furrow, the
// eye rings, the nose sides, the mouth line, the crown groove,
// the tongue groove and the chin crease. Cells near a crevice
// pool dark. High points (forehead dome, cheekbones, nose
// bridge) thin toward glaze blue. Precomputed once, below,
// into each cell's bias. No runtime curvature anywhere.
var CREVICES = [];
(function () {
  var i, a;
  for (i = 0; i <= 8; i++) CREVICES.push([472 + i * 42, 372]);              // brow furrow
  for (i = 0; i < 10; i++) { a = i / 10 * Math.PI * 2;                     // eye rings
    CREVICES.push([498 + Math.cos(a) * 64, 418 + Math.sin(a) * 64]);
    CREVICES.push([782 + Math.cos(a) * 64, 418 + Math.sin(a) * 64]); }
  for (i = 0; i <= 4; i++) { CREVICES.push([612 - i * 9, 470 + i * 22]);   // nose sides
    CREVICES.push([668 + i * 9, 470 + i * 22]); }
  for (i = 0; i <= 8; i++) CREVICES.push([452 + i * 47, 640 + Math.sin(i / 8 * Math.PI) * 14]); // mouth line
  for (i = 0; i <= 6; i++) { a = (-90 + (i - 3) * 13) * Math.PI / 180;     // crown groove
    CREVICES.push([CX + Math.cos(a) * 464, CY + Math.sin(a) * 380]); }
  for (i = 0; i <= 3; i++) CREVICES.push([640, 692 + i * 36]);             // tongue groove
  for (i = 0; i <= 6; i++) { a = (72 + i * 6) * Math.PI / 180;             // chin crease
    CREVICES.push([CX + Math.cos(a) * 425, CY + Math.sin(a) * 348]); }
})();
var HIGHS = [
  { x: 640, y: 212, r: 96 },   // forehead dome
  { x: 440, y: 520, r: 74 },   // cheekbones
  { x: 840, y: 520, r: 74 },
  { x: 640, y: 486, r: 44 }    // nose bridge
];
function biasAt(x, y) {
  var i, dx, dy, d, b = 0;
  for (i = 0; i < CREVICES.length; i++) {
    dx = x - CREVICES[i][0]; dy = y - CREVICES[i][1];
    d = Math.sqrt(dx * dx + dy * dy);
    if (d < 34) { b = -0.7; break; }
  }
  for (i = 0; i < HIGHS.length; i++) {
    dx = x - HIGHS[i].x; dy = y - HIGHS[i].y;
    if (Math.sqrt(dx * dx + dy * dy) < HIGHS[i].r) b += 0.75;
  }
  return b;
}

// ---- glaze cells: stepped colour data, advected by a wave ----
// WAVE_A and WAVE_B are whole numbers: both wave terms
// complete whole cycles in the 60s loop, so the colour field
// at 60s is exactly the colour field at 0s.
var WAVE_A = 2, WAVE_B = 1;
if (Math.round(WAVE_A) !== WAVE_A || Math.round(WAVE_B) !== WAVE_B) throw new Error('Raudra Roop wave cycles must be whole');
var CELLS = [];
(function () {
  var gx, gy, h, h2, base, x, y;
  for (gy = 0; gy < 20; gy++) {
    for (gx = 0; gx < 21; gx++) {
      x = 170 + gx * 46; y = -2 + gy * 46;
      h = ((gx * 73856093) ^ (gy * 19349663)) >>> 0;
      h = (h % 1000) / 1000;
      h2 = (((gx * 83492791) ^ (gy * 2971215073)) >>> 0) % 1000 / 1000;
      base = h < 0.05 ? 0 : (h < 0.30 ? 1 : (h < 0.72 ? 2 : 3));
      if (y < 300 && h2 < 0.4) base = Math.min(3, base + 1);
      CELLS.push({ x: x, y: y, base: base, bias: biasAt(x, y), jit: (h2 - 0.5) * 0.36, spk: h });
    }
  }
})();
function glazeIndex(c, frac) {
  var w = Math.sin(2 * Math.PI * ((c.x * 0.35 + c.y * 1.15) / 660 - WAVE_A * frac))
        + 0.9 * Math.sin(2 * Math.PI * (c.x / 520 - WAVE_B * frac));
  var idx = c.base + Math.round(w * 0.4 + c.bias + c.jit);
  if (idx < 0) idx = 0;
  if (idx > 3) idx = 3;
  return idx;
}
function drawGlaze(frac) {
  var i, c, idx;
  ctx.save();
  silPath(0.97);
  ctx.clip();
  for (i = 0; i < CELLS.length; i++) {
    c = CELLS[i];
    idx = glazeIndex(c, frac);
    ctx.fillStyle = GLAZE[idx];
    ctx.fillRect(c.x - 22.75, c.y - 22.75, 45.5, 45.5);
    if (c.spk > 0.62) {
      ctx.fillStyle = POOL;
      ctx.globalAlpha = 0.22;
      ctx.fillRect(c.x - 9 + (c.spk * 37) % 16, c.y - 6 + (c.spk * 53) % 13, 2.6, 2.6);
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

// ---- fixed feature path data, drawn unmoving every frame -----
function spiral(cx, cy, rMax, turns, lw, mirror) {
  var i, a, r, px, py, N = 64;
  st(POOL, lw);
  ctx.beginPath();
  for (i = 0; i <= N; i++) {
    a = (i / N) * turns * Math.PI * 2;
    r = 2 + (i / N) * rMax;
    px = cx + (mirror ? -1 : 1) * Math.cos(a) * r;
    py = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

// The crown carries exactly 5 skulls, asserted.
var SKULL_ANGLES = [-90, -65, -115, -40, -140];
var SKULL_FILL = [TURQ, BLUE, TEAL, BLUE, TURQ];
if (SKULL_ANGLES.length !== 5) throw new Error('Raudra Roop crown needs exactly 5 skulls');
function drawSkull(x, y, rot, fill) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = fill;
  ctx.strokeStyle = POOL; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, -4, 41, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-24, 22); ctx.lineTo(24, 22); ctx.lineTo(20, 48); ctx.lineTo(-20, 48);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = POOL;
  ctx.beginPath(); ctx.ellipse(-15, -6, 9.5, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(15, -6, 9.5, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(-6, 20); ctx.lineTo(6, 20); ctx.closePath(); ctx.fill();
  st(POOL, 3);
  ctx.beginPath(); ctx.moveTo(-12, 30); ctx.lineTo(-12, 44); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(0, 46); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, 30); ctx.lineTo(12, 44); ctx.stroke();
  ctx.restore();
}
function drawCrown() {
  var i, a, x, y;
  st(POOL, 5);
  ctx.beginPath(); ctx.ellipse(CX, CY, 485, 398, 0, -2.62, -0.52); ctx.stroke();
  st(POOL, 3);
  ctx.beginPath(); ctx.ellipse(CX, CY, 468, 380, 0, -2.62, -0.52); ctx.stroke();
  st(POOL, 5);
  ctx.beginPath(); ctx.ellipse(CX, CY, 424, 344, 0, -2.58, -0.56); ctx.stroke();
  for (i = 0; i < SKULL_ANGLES.length; i++) {
    a = SKULL_ANGLES[i] * Math.PI / 180;
    x = CX + Math.cos(a) * 452; y = CY + Math.sin(a) * 371;
    drawSkull(x, y, a + Math.PI / 2, SKULL_FILL[i]);
  }
}
function drawEye(ex) {
  ctx.fillStyle = BLUE;
  ctx.strokeStyle = POOL; ctx.lineWidth = 6;
  circ(ex, 418, 56, true); ctx.stroke();
  ctx.fillStyle = TURQ;
  circ(ex, 424, 30, true); ctx.stroke();
  ctx.fillStyle = POOL;
  circ(ex, 428, 13, true);
  ctx.fillStyle = BLUE;
  circ(ex - 5, 421, 4.5, true);
  st(POOL, 7);
  ctx.beginPath(); ctx.arc(ex, 410, 66, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
}
function drawFace() {
  var i, dx;
  // Spiral brows, mirrored.
  spiral(498, 318, 40, 2.6, 9, false);
  spiral(782, 318, 40, 2.6, 9, true);
  st(POOL, 5);
  ctx.beginPath(); ctx.arc(498, 330, 56, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  ctx.beginPath(); ctx.arc(782, 330, 56, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  // Third eye on the forehead.
  ctx.fillStyle = BLUE;
  ctx.strokeStyle = POOL; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.ellipse(640, 262, 25, 38, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  spiral(640, 262, 14, 2.2, 4, false);
  // Bulging eyes.
  drawEye(498);
  drawEye(782);
  // Cheek and side spirals.
  spiral(306, 592, 28, 2.4, 5, false);
  spiral(974, 592, 28, 2.4, 5, true);
  spiral(264, 452, 20, 2.2, 4.5, false);
  spiral(1016, 452, 20, 2.2, 4.5, true);
  // Nose: one filled glazed form, nostrils pooled dark on it.
  ctx.fillStyle = BLUE;
  ctx.strokeStyle = POOL; ctx.lineWidth = 5.5;
  ctx.beginPath();
  ctx.moveTo(618, 462);
  ctx.quadraticCurveTo(600, 520, 578, 550);
  ctx.quadraticCurveTo(640, 584, 702, 550);
  ctx.quadraticCurveTo(680, 520, 662, 462);
  ctx.quadraticCurveTo(640, 476, 618, 462);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = POOL;
  ctx.beginPath(); ctx.ellipse(607, 556, 16, 10.5, -0.25, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(673, 556, 16, 10.5, 0.25, 0, Math.PI * 2); ctx.fill();
  // Mouth cavity.
  ctx.fillStyle = POOL;
  ctx.beginPath();
  ctx.moveTo(428, 638);
  ctx.quadraticCurveTo(640, 598, 852, 638);
  ctx.quadraticCurveTo(820, 726, 640, 736);
  ctx.quadraticCurveTo(460, 726, 428, 638);
  ctx.closePath(); ctx.fill();
  // Upper teeth and the two great fangs.
  ctx.fillStyle = BLUE;
  ctx.strokeStyle = POOL; ctx.lineWidth = 3.5;
  var teeth = [-112, -56, 0, 56, 112];
  for (i = 0; i < teeth.length; i++) {
    dx = teeth[i];
    ctx.beginPath();
    ctx.moveTo(640 + dx - 16, 638); ctx.lineTo(640 + dx + 16, 638); ctx.lineTo(640 + dx, 684);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(452, 640); ctx.lineTo(488, 640); ctx.lineTo(470, 748); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(792, 640); ctx.lineTo(828, 640); ctx.lineTo(810, 748); ctx.closePath(); ctx.fill(); ctx.stroke();
  // Lower teeth, points up, flanking the tongue.
  var low = [-140, -84, 84, 140];
  for (i = 0; i < low.length; i++) {
    dx = low[i];
    ctx.beginPath();
    ctx.moveTo(640 + dx - 13, 720); ctx.lineTo(640 + dx + 13, 720); ctx.lineTo(640 + dx, 676);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // Protruding tongue, over the chin.
  ctx.fillStyle = TURQ;
  ctx.strokeStyle = POOL; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(598, 652);
  ctx.bezierCurveTo(592, 742, 604, 806, 640, 826);
  ctx.bezierCurveTo(676, 806, 688, 742, 682, 652);
  ctx.quadraticCurveTo(640, 668, 598, 652);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  st(POOL, 4);
  ctx.beginPath(); ctx.moveTo(640, 692); ctx.lineTo(640, 788); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(640, 826); ctx.lineTo(640, 806); ctx.stroke();
  // Chin crease.
  ctx.globalAlpha = 0.55;
  st(POOL, 4);
  ctx.beginPath(); ctx.ellipse(CX, CY, 425, 348, 0, 1.26, 1.88); ctx.stroke();
  ctx.globalAlpha = 1;
}

// Side light: layered translucency offset strokes on the
// left edges, built only from palette colours. Never
// shadowBlur, never a filter.
function drawSideLight() {
  var i;
  ctx.save();
  silPath(0.985);
  ctx.clip();
  for (i = 0; i < 3; i++) {
    ctx.globalAlpha = 0.10 - i * 0.025;
    st(TURQ, 26 - i * 6);
    ctx.beginPath(); ctx.arc(430 + i * 16, 452, 310, Math.PI * 0.62, Math.PI * 1.06); ctx.stroke();
  }
  ctx.globalAlpha = 0.10;
  st(BLUE, 20);
  ctx.beginPath(); ctx.arc(500, 240, 150, Math.PI * 0.95, Math.PI * 1.5); ctx.stroke();
  ctx.globalAlpha = 0.08;
  st(TURQ, 16);
  ctx.beginPath(); ctx.arc(430, 540, 120, Math.PI * 0.7, Math.PI * 1.25); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  // Rim in clay body colour, the only place clay shows.
  silPath(1);
  ctx.fillStyle = CLAY;
  ctx.fill();
  ctx.strokeStyle = CLAY;
  ctx.lineWidth = 14;
  ctx.stroke();
  // Dark underglaze base inside the rim.
  silPath(0.97);
  ctx.fillStyle = POOL;
  ctx.fill();
  ctx.strokeStyle = POOL;
  ctx.lineWidth = 3;
  ctx.stroke();
  drawGlaze((T % LOOP) / LOOP);
  drawCrown();
  drawFace();
  drawSideLight();
}

// ---- sizing: centred fit, page ground is the piece ground ----
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
