<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bloemenlust</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1A1512; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  // Seeded PRNG (mulberry32). Never Math.random: every load is identical.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var CYCLE = 75;
  var NPET = 96;
  var NRAIN = 130;

  // Drag-stir events: {t, x, y, dx}. Closed-form decay; never frame-integrated.
  var stirs = [];
  var dragging = false, lastX = 0, lastY = 0, lastT = 0;

  function size() {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
  }
  size();
  if (window.visualViewport) window.visualViewport.addEventListener('resize', size);
  window.addEventListener('resize', size);

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(v) { return v * v * (3 - 2 * v); }
  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  var LIVING = hexRgb('#C76B8A'), ROT = hexRgb('#6B4A33'), COMPOST = hexRgb('#3A2E22');
  function mix3(a, b, c, v) {
    var x, y;
    if (v < 0.5) { x = a; y = b; v = v * 2; }
    else { x = b; y = c; v = (v - 0.5) * 2; }
    var r = Math.round(x[0] + (y[0] - x[0]) * v);
    var g = Math.round(x[1] + (y[1] - x[1]) * v);
    var bl = Math.round(x[2] + (y[2] - x[2]) * v);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  function rgba(hex, a) {
    var c = hexRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  // Per-loop seeded layout: petal sizes, wobbles, rain streaks.
  function loopLayout(loop) {
    var rnd = mulberry32(1303 + loop * 7919);
    var petals = [];
    var i;
    for (i = 0; i < NPET; i++) {
      petals.push({
        s: 0.55 + rnd() * 0.9,
        wob: (rnd() - 0.5) * 0.5,
        tilt: (rnd() - 0.5) * 0.9
      });
    }
    var rain = [];
    for (i = 0; i < NRAIN; i++) {
      rain.push({
        x: rnd(), y0: rnd(), len: 0.04 + rnd() * 0.10, sp: 0.9 + rnd() * 0.9
      });
    }
    return { petals: petals, rain: rain };
  }

  // Phase envelopes over the 75 s cycle.
  // growth 0-18, downpour 18-33, rot 33-51, drought 51-66, bloom 66-72, reseed 72-75.
  function phase(t) {
    var lt = t % CYCLE;
    var growth = clamp(lt / 18, 0, 1);
    var rainEnv = lt < 18 ? 0 : lt < 21 ? (lt - 18) / 3 : lt < 30 ? 1 : lt < 33 ? (33 - lt) / 3 : 0;
    var rotT = clamp((lt - 33) / 18, 0, 1);
    var drought = lt < 51 ? 0 : lt < 54 ? (lt - 51) / 3 : lt < 63 ? 1 : lt < 66 ? (66 - lt) / 3 : 0;
    var bloom = lt < 66 ? 0 : lt < 69 ? (lt - 66) / 3 : lt < 72 ? (72 - lt) / 3 : 0;
    var shed = lt < 72 ? 0 : (lt - 72) / 3;
    return { lt: lt, growth: growth, rainEnv: rainEnv, rotT: rotT, drought: drought, bloom: bloom, shed: shed };
  }

  // Stir displacement for a point, closed form over recorded drag events.
  function stirAt(px, py, t) {
    var ox = 0, oy = 0, i, e, dx, dy, d, fall, dec;
    for (i = 0; i < stirs.length; i++) {
      e = stirs[i];
      var dt = t - e.t;
      if (dt < 0 || dt > 4) continue;
      dx = px - e.x; dy = py - e.y;
      d = Math.sqrt(dx * dx + dy * dy);
      fall = Math.exp(-d / (0.14 * W + 40));
      dec = Math.exp(-dt / 1.5);
      ox += e.dx * fall * dec;
      oy += e.dx * 0.25 * fall * dec;
    }
    return [ox, oy];
  }

  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, 2 * Math.PI);
    ctx.fill();
  }

  // One petal: a pointed oval drawn as two quadratic curves. Closed form.
  function drawPetal(x, y, ang, len, wid, color) {
    var c = Math.cos(ang), s = Math.sin(ang);
    var tx = x + c * len, ty = y + s * len;
    var nx = -s * wid, ny = c * wid;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + nx * 0.9 + c * len * 0.4, y + ny * 0.9 + s * len * 0.4, tx, ty);
    ctx.quadraticCurveTo(x - nx * 0.9 + c * len * 0.4, y - ny * 0.9 + s * len * 0.4, x, y);
    ctx.fill();
  }

  function draw(t) {
    lastT = t;
    var loop = Math.floor(t / CYCLE);
    var L = loopLayout(loop);
    var ph = phase(t);
    var cx = 0.5 * W, cy = 0.56 * H;
    var rx = 0.44 * W, ry = 0.17 * H;
    var base = Math.min(W, H);
    var i, u, th, px, py, tang, p, unf, rot, col, bow, st, len, wid;

    // Soil bed.
    ctx.fillStyle = '#1A1512';
    ctx.fillRect(0, 0, W, H);

    // Faint soil texture: flat low-alpha dashes, seeded per loop.
    var rndT = mulberry32(9100 + loop * 7919);
    ctx.fillStyle = 'rgba(58,46,34,0.55)';
    for (i = 0; i < 90; i++) {
      var sx = rndT() * W, sy = rndT() * H;
      ctx.fillRect(sx, sy, 2 + rndT() * 5, 1);
    }

    // Spiral ribbon of petals across the middle band.
    var turns = 3, thMax = turns * 2 * Math.PI;
    for (i = 0; i < NPET; i++) {
      u = i / (NPET - 1);
      th = u * thMax;
      var rr = Math.pow(u, 0.8);
      px = cx + Math.cos(th) * rx * rr + Math.sin(th * 2.3) * 0.012 * W;
      py = cy + Math.sin(th) * ry * rr;
      tang = Math.atan2(Math.cos(th) * ry, -Math.sin(th) * rx);
      p = L.petals[i];
      // Growth: petals unfurl in spiral order over 18 s.
      unf = smooth(clamp((ph.growth * 18 - u * 16) / 2.5, 0, 1));
      // Rot: browning runs from the spiral tail (u = 1) inward over 18 s.
      rot = smooth(clamp((ph.rotT * 18 - (1 - u) * 16) / 3, 0, 1));
      // Reseed shed: everything fades out in the last 3 s.
      var vis = 1 - ph.shed;
      if (vis <= 0) continue;
      col = mix3(LIVING, ROT, COMPOST, rot);
      // Downpour bow: petals bow downward with rain intensity.
      bow = ph.rainEnv * 0.5 * (0.5 + 0.5 * Math.sin(u * 9 + 1));
      st = stirAt(px, py, t);
      px += st[0]; py += st[1];
      len = (0.018 + 0.030 * unf) * base * p.s;
      wid = (0.006 + 0.010 * unf) * base * p.s;
      ctx.globalAlpha = vis * (0.55 + 0.45 * unf);
      drawPetal(px, py + bow * 0.02 * H, tang + p.tilt * 0.4 + bow, len, wid, col);
      // Bud dot at the unfurling tip while closed.
      if (unf < 0.9) {
        ctx.globalAlpha = vis * 0.8;
        dot(px, py, Math.max(2, 0.009 * base * p.s), col);
      }
    }
    ctx.globalAlpha = 1;

    // Downpour: vertical rain streaks, grey, no cartoon splashes.
    if (ph.rainEnv > 0) {
      ctx.strokeStyle = rgba('#6E7A80', 0.35 * ph.rainEnv);
      ctx.lineWidth = 1;
      var span = H * 1.2;
      for (i = 0; i < NRAIN; i++) {
        var r = L.rain[i];
        var y = ((r.y0 * span + (ph.lt - 18) * 0.9 * H * r.sp) % span) - 0.1 * H;
        if (y < -0.1 * H || y > H) continue;
        ctx.beginPath();
        ctx.moveTo(r.x * W, y);
        ctx.lineTo(r.x * W, y + r.len * H);
        ctx.stroke();
      }
    }

    // Drought: amber heat shimmer, still petals (no sway added anywhere).
    if (ph.drought > 0) {
      var a = 0.10 * ph.drought;
      ctx.strokeStyle = rgba('#B98A4A', a);
      ctx.lineWidth = 1;
      for (i = 0; i < 7; i++) {
        var yy = cy - ry - 0.02 * H + i * (2 * ry + 0.04 * H) / 6;
        ctx.beginPath();
        for (var x = 0; x <= W; x += 24) {
          var wy = yy + Math.sin(x / 90 + i * 1.7 + ph.lt * 1.2) * 3;
          if (x === 0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
        }
        ctx.stroke();
      }
    }

    // White bloom event: fullscreen, brief, neurological, not decorative.
    if (ph.bloom > 0) {
      var b = ph.bloom;
      // Faint scan-green grid.
      ctx.strokeStyle = rgba('#7FB069', 0.10 * b);
      ctx.lineWidth = 1;
      for (var gx = 0; gx <= W; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
      }
      for (var gy = 0; gy <= H; gy += 40) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
      }
      // Radial white flower with scan-line jitter: petals in horizontal bands,
      // each band offset slightly, so the bloom reads like a scan image.
      var rndB = mulberry32(4400 + loop * 7919);
      var bands = 22, k, j;
      var bR = 0.42 * Math.min(W, H) * (0.4 + 0.6 * b);
      for (k = 0; k < bands; k++) {
        var by = H * (0.5 - 0.42 * b) + k * (0.84 * b * H) / bands;
        var jit = (rndB() - 0.5) * 14 * b;
        var halfW = Math.sqrt(Math.max(0, bR * bR - Math.pow(by - cy, 2))) * 1.4;
        if (halfW <= 0) continue;
        ctx.fillStyle = rgba('#F2EFE8', 0.16 * b);
        ctx.fillRect(cx - halfW + jit, by, halfW * 2, Math.max(2, (0.84 * b * H) / bands));
      }
      // Core petals radiating from the center.
      for (j = 0; j < 14; j++) {
        var ang = (j / 14) * 2 * Math.PI + 0.2;
        ctx.globalAlpha = 0.55 * b;
        drawPetal(cx, cy, ang, bR * 0.9, bR * 0.16, '#F2EFE8');
      }
      ctx.globalAlpha = 1;
      // White wash ring.
      ctx.globalAlpha = 0.10 * b;
      ctx.fillStyle = '#F2EFE8';
      ctx.beginPath();
      ctx.moveTo(cx + bR, cy);
      ctx.arc(cx, cy, bR, 0, 2 * Math.PI);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Pin canvas size in draw (house rule).
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function onMove(e) {
    var x = e.clientX, y = e.clientY;
    if (dragging) {
      stirs.push({ t: lastT, x: x, y: y, dx: (x - lastX) * 0.6 });
      if (stirs.length > 40) stirs.shift();
    }
    lastX = x; lastY = y;
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });

  // Boot flag: frame one is exactly t = 0; the clock starts with the rAF loop.
  draw(0);
  var t0 = null;
  function loop(ts) {
    if (t0 === null) t0 = ts;
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
