<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amiga, Date Cuenta</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F5EEDA; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict, nothing else. Flat fills only, no gradients.
  var TAN = '#C9A06A', RED = '#D93A2B', YELLOW = '#F5D90A',
      PURPLE = '#4A2E5A', INK = '#141414', PAPER = '#F5EEDA';

  var PHASE0 = 1.7; // constant first-frame phase

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  // ---- slide geometry (1080 x 1080 design space) ----
  var SL = { x: 180, y: 80, w: 720, h: 920 };

  // ---- carousel state ----
  var slide = 0;              // 0..4
  var slideStartT = PHASE0;   // simT when the current slide was entered
  var pupilsHuge = true;      // slide 4 toggle state
  var wagEnergy = 0;          // drag-fed tail energy, decays in the frame loop

  // ---- small canvas helpers ----
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function fs(fill, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function line(x1, y1, x2, y2, color, lw) {
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  // wobbly rounded-rect path, jitter seeded per id so it never shimmers
  function wobRect(x, y, w, h, r, id) {
    var rng = mulberry32(565000 + id * 131);
    function j(v) { return v + (rng() - 0.5) * 5; }
    ctx.beginPath();
    ctx.moveTo(j(x + r), j(y));
    ctx.lineTo(j(x + w - r), j(y)); ctx.quadraticCurveTo(j(x + w), j(y), j(x + w), j(y + r));
    ctx.lineTo(j(x + w), j(y + h - r)); ctx.quadraticCurveTo(j(x + w), j(y + h), j(x + w - r), j(y + h));
    ctx.lineTo(j(x + r), j(y + h)); ctx.quadraticCurveTo(j(x), j(y + h), j(x), j(y + h - r));
    ctx.lineTo(j(x), j(y + r)); ctx.quadraticCurveTo(j(x), j(y), j(x + r), j(y));
    ctx.closePath();
  }

  // ---- hand lettering: per-letter jitter seeded by the string itself ----
  function setFont(size, weight) {
    ctx.font = (weight || 700) + ' ' + size + 'px "Arial Rounded MT Bold","Trebuchet MS",Verdana,sans-serif';
  }
  function lettered(str, cx, y, size, color, weight) {
    setFont(size, weight);
    var rng = mulberry32(565100 + hashStr(str));
    var widths = [], total = 0, i, w;
    for (i = 0; i < str.length; i++) { w = ctx.measureText(str[i]).width; widths.push(w); total += w; }
    var x = cx - total / 2;
    ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (i = 0; i < str.length; i++) {
      var jx = (rng() - 0.5) * size * 0.07, jy = (rng() - 0.5) * size * 0.09;
      ctx.save();
      ctx.translate(x + widths[i] / 2 + jx, y + jy);
      ctx.rotate((rng() - 0.5) * 0.05);
      ctx.fillText(str[i], -widths[i] / 2, 0);
      ctx.restore();
      x += widths[i];
    }
    return total;
  }
  function wrapLines(str, size, maxW) {
    setFont(size, 700);
    var words = str.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function letteredBlock(str, cx, cy, size, color, maxW, weight) {
    var lines = wrapLines(str, size, maxW);
    var lh = size * 1.22, y = cy - (lines.length - 1) * lh / 2;
    for (var i = 0; i < lines.length; i++) { lettered(lines[i], cx, y + i * lh, size, color, weight); }
    return lines.length * lh;
  }

  // ---- bubbles ----
  function speechBubble(cx, cy, w, h, tailX, tailY, id) {
    wobRect(cx - w / 2, cy - h / 2, w, h, 26, id); fs(PAPER, 5);
    ctx.beginPath();
    ctx.moveTo(tailX - 14, cy + h / 2 - 8);
    ctx.lineTo(tailX + 14, cy + h / 2 - 8);
    ctx.lineTo(tailX + (tailX < cx ? -6 : 6), tailY);
    ctx.closePath(); fs(PAPER, 5);
    ctx.fillStyle = PAPER;
    ctx.fillRect(tailX - 15, cy + h / 2 - 12, 30, 8);
  }
  function thoughtBubble(cx, cy, w, h, fromX, fromY) {
    // trail of shrinking circles from the thinker up to the cloud
    var steps = 3, i, t;
    for (i = 1; i <= steps; i++) {
      t = i / (steps + 1);
      circ(fromX + (cx - fromX) * t, fromY + (cy - fromY) * t, 13 - i * 3); fs(PAPER, 4);
    }
    ctx.beginPath();
    var bumps = 11, rng = mulberry32(565200);
    for (i = 0; i <= bumps; i++) {
      var a = (i / bumps) * Math.PI * 2;
      var rr = 1 + (rng() - 0.5) * 0.13;
      var px = cx + Math.cos(a) * w / 2 * rr, py = cy + Math.sin(a) * h / 2 * rr;
      if (i === 0) ctx.moveTo(px, py); else {
        var pa = ((i - 0.5) / bumps) * Math.PI * 2;
        ctx.quadraticCurveTo(cx + Math.cos(pa) * (w / 2 + 16), cy + Math.sin(pa) * (h / 2 + 16), px, py);
      }
    }
    ctx.closePath(); fs(PAPER, 5);
  }

  // ---- characters ----
  // the dog-woman: tan, floppy ears, purple dress, wagging tail.
  // feet at (cx, baseY); s = scale (1 = about 300 units tall)
  function dogWoman(cx, baseY, s, opts) {
    var wagA = Math.sin(simT * (5 + wagEnergy * 14)) * (0.22 + Math.min(wagEnergy, 1.4) * 0.35);
    ctx.save();
    ctx.translate(cx, baseY);
    ctx.scale(s, s);
    if (opts.lean) ctx.rotate(opts.lean);
    // tail, wagging from the hip (low, behind the dress, thinner than an arm)
    ctx.save();
    ctx.translate(-48, -36);
    ctx.rotate(wagA);
    ctx.strokeStyle = TAN; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-34, 2, -44, -26); ctx.stroke();
    ctx.restore();
    // dress
    ctx.beginPath();
    ctx.moveTo(-26, -196); ctx.lineTo(26, -196); ctx.lineTo(58, 0); ctx.lineTo(-58, 0);
    ctx.closePath(); fs(PURPLE, 5);
    // feet
    ell(-26, 2, 17, 8); fs(INK, 0);
    ell(26, 2, 17, 8); fs(INK, 0);
    // arms
    if (opts.handsClasped) {
      line(-24, -182, 8, -128, TAN, 15); line(24, -182, 4, -128, TAN, 15);
      circ(6, -126, 11); fs(TAN, 4);
    } else if (opts.pointing) {
      line(-24, -182, -52, -138, TAN, 15);
      line(24, -182, 86, -176, TAN, 15);
      circ(92, -177, 9); fs(TAN, 4);
    } else {
      line(-24, -182, -50, -128, TAN, 15);
      line(24, -182, 50, -128, TAN, 15);
    }
    // ears (behind head)
    ctx.save(); ctx.translate(-46, -252); ctx.rotate(0.5 + (opts.droop || 0));
    ell(0, 0, 17, 44); fs(TAN, 5); ctx.restore();
    ctx.save(); ctx.translate(46, -252); ctx.rotate(-0.5 - (opts.droop || 0));
    ell(0, 0, 17, 44); fs(TAN, 5); ctx.restore();
    // head
    circ(0, -238, 56); fs(TAN, 5);
    // muzzle
    ell(0, -218, 27, 19); fs(PAPER, 4);
    ell(0, -228, 9, 6); fs(INK, 0);
    // eyes, glancing
    var gx = opts.glance || 0;
    circ(-20 + gx, -248, 5.5); fs(INK, 0);
    circ(20 + gx, -248, 5.5); fs(INK, 0);
    // brows
    if (opts.worried) {
      line(-30 + gx, -258, -11 + gx, -267, INK, 4);
      line(30 + gx, -258, 11 + gx, -267, INK, 4);
      // small wavy mouth
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-9, -206);
      ctx.quadraticCurveTo(-4.5, -211, 0, -206);
      ctx.quadraticCurveTo(4.5, -201, 9, -206);
      ctx.stroke();
    } else if (opts.earnest) {
      line(-30 + gx, -262, -11 + gx, -264, INK, 4);
      line(30 + gx, -262, 11 + gx, -264, INK, 4);
      ell(0, -204, 7, 9); fs(INK, 0); // open, pleading mouth
    } else {
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, -210, 9, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    }
    ctx.restore();
  }

  // Scott: paper skin, ink hair, purple shirt. Pupils dilated by default.
  function scott(cx, baseY, s, opts) {
    ctx.save();
    ctx.translate(cx, baseY);
    ctx.scale(s, s);
    if (opts.lean) ctx.rotate(opts.lean);
    // shirt
    ctx.beginPath();
    ctx.moveTo(-30, -172); ctx.lineTo(30, -172); ctx.lineTo(46, 0); ctx.lineTo(-46, 0);
    ctx.closePath(); fs(PURPLE, 5);
    ell(-24, 2, 15, 7); fs(INK, 0);
    ell(24, 2, 15, 7); fs(INK, 0);
    // arms
    if (opts.handsUp) {
      line(-28, -160, -62, -208, PAPER, 14);
      line(28, -160, 62, -208, PAPER, 14);
      circ(-64, -212, 10); fs(PAPER, 4);
      circ(64, -212, 10); fs(PAPER, 4);
    } else {
      line(-28, -160, -48, -110, PAPER, 14);
      line(28, -160, 48, -110, PAPER, 14);
    }
    // head
    circ(0, -216, 50); fs(PAPER, 5);
    // hair cap
    ctx.beginPath(); ctx.arc(0, -222, 50, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); fs(INK, 0);
    // eyes with dilated pupils
    var pr = opts.pupilR || 13;
    circ(-19, -216, pr); fs(INK, 0);
    circ(19, -216, pr); fs(INK, 0);
    // mouth: small o when recoiling, flat otherwise
    if (opts.recoil) { ell(0, -182, 8, 11); fs(INK, 0); }
    else line(-10, -184, 10, -184, INK, 4);
    ctx.restore();
  }

  // the friend: paper skin, ink bun, yellow top, always right.
  function friend(cx, baseY, s, opts) {
    ctx.save();
    ctx.translate(cx, baseY);
    ctx.scale(s, s);
    // top
    ctx.beginPath();
    ctx.moveTo(-28, -168); ctx.lineTo(28, -168); ctx.lineTo(50, 0); ctx.lineTo(-50, 0);
    ctx.closePath(); fs(YELLOW, 5);
    ell(-24, 2, 15, 7); fs(INK, 0);
    ell(24, 2, 15, 7); fs(INK, 0);
    if (opts.armsCrossed) {
      line(-26, -150, 30, -118, PAPER, 13);
      line(26, -150, -30, -118, PAPER, 13);
    } else if (opts.pointing) {
      line(-26, -150, -50, -104, PAPER, 13);
      line(26, -150, 78, -158, PAPER, 13);
      circ(84, -159, 9); fs(PAPER, 4);
    } else {
      line(-26, -150, -48, -102, PAPER, 13);
      line(26, -150, 48, -102, PAPER, 13);
    }
    // head + bun
    circ(14, -252, 17); fs(INK, 0);
    circ(0, -212, 48); fs(PAPER, 5);
    ctx.beginPath(); ctx.arc(0, -218, 48, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); fs(INK, 0);
    // calm, correct face
    circ(-17, -210, 5); fs(INK, 0);
    circ(17, -210, 5); fs(INK, 0);
    line(-27, -226, -8, -224, INK, 3.5);
    line(27, -226, 8, -224, INK, 3.5);
    line(-8, -182, 10, -183, INK, 3.5); // flat, unimpressed mouth
    ctx.restore();
  }

  // small background party guest silhouette
  function guest(cx, baseY, s, flip) {
    ctx.save();
    ctx.translate(cx, baseY); ctx.scale(s * (flip ? -1 : 1), s);
    ctx.beginPath();
    ctx.moveTo(-24, -150); ctx.lineTo(24, -150); ctx.lineTo(40, 0); ctx.lineTo(-40, 0);
    ctx.closePath(); fs(INK, 0);
    circ(0, -192, 42); fs(INK, 0);
    ctx.restore();
  }

  function partyLights(y, t) {
    // string of yellow bulbs sagging across the top of the slide
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(SL.x + 26, y);
    ctx.quadraticCurveTo(SL.x + SL.w / 2, y + 52, SL.x + SL.w - 26, y);
    ctx.stroke();
    for (var i = 0; i <= 10; i++) {
      var u = i / 10;
      var bx = SL.x + 26 + (SL.w - 52) * u;
      var by = y + 2 * 52 * u * (1 - u) + 8;
      var tw = 0.65 + 0.35 * Math.sin(t * 2.2 + i * 1.7);
      ctx.save(); ctx.globalAlpha = tw;
      circ(bx, by, 8); fs(YELLOW, 3);
      ctx.restore();
    }
  }

  function slideFrame(bg, id) {
    wobRect(SL.x, SL.y, SL.w, SL.h, 30, id); fs(bg, 6);
    ctx.save();
    wobRect(SL.x, SL.y, SL.w, SL.h, 30, id); ctx.clip();
    ctx.restore();
  }
  function clipSlide(id) {
    wobRect(SL.x, SL.y, SL.w, SL.h, 30, id); ctx.clip();
  }

  // ---- slides ----
  function slide1(t) {
    slideFrame(PURPLE, 1);
    ctx.save(); clipSlide(1);
    partyLights(SL.y + 44, t);
    // roommates in the back, mid-praise
    guest(332, 560, 0.66, false);
    friend(428, 566, 0.62, { pointing: true });
    speechBubble(392, 300, 330, 104, 420, 424, 11);
    letteredBlock('¡es tan atento, tan cariñoso!', 392, 300, 30, INK, 290);
    // the dog-woman, front and centre, dreading it
    dogWoman(612, 912, 1.42, { worried: true, droop: 0.22, glance: -6 });
    thoughtBubble(566, 208, 400, 168, 560, 560);
    letteredBlock('por favor, que no sea Scott, el escroto', 566, 208, 31, INK, 330);
    ctx.restore();
  }

  function slide2(t) {
    slideFrame(PURPLE, 2);
    ctx.save(); clipSlide(2);
    partyLights(SL.y + 44, t);
    dogWoman(372, 908, 1.3, { earnest: true, handsClasped: true, lean: 0.04 });
    speechBubble(396, 268, 400, 138, 420, 560, 21);
    letteredBlock('sentí una conexión profunda contigo en la fiesta', 396, 268, 30, INK, 350);
    scott(716, 908, 1.3, { recoil: true, handsUp: true, lean: -0.07, pupilR: 14 });
    speechBubble(722, 238, 218, 84, 700, 540, 22);
    lettered('Ay, Dios...', 722, 238, 32, INK);
    ctx.restore();
  }

  function slide3(t) {
    slideFrame(PURPLE, 3);
    ctx.save(); clipSlide(3);
    partyLights(SL.y + 44, t);
    dogWoman(356, 912, 1.28, { pointing: true, earnest: true });
    speechBubble(430, 252, 430, 120, 348, 545, 31);
    letteredBlock('¡mira sus pupilas! ¡eso es atracción!', 430, 252, 30, INK, 380);
    scott(742, 900, 1.18, { pupilR: 15 });
    friend(560, 928, 1.22, { armsCrossed: true });
    speechBubble(566, 560, 386, 110, 560, 660, 32);
    letteredBlock('es el alcohol, no el amor', 566, 560, 31, INK, 340);
    ctx.restore();
  }

  function slide4(t) {
    slideFrame(PAPER, 4);
    ctx.save(); clipSlide(4);
    var fx = SL.x + SL.w / 2, fy = 452;
    // giant face
    circ(fx, fy, 296); fs(PAPER, 7);
    ctx.beginPath(); ctx.arc(fx, fy - 22, 296, Math.PI * 1.03, Math.PI * 1.97); ctx.closePath(); fs(INK, 0);
    // ears
    ell(fx - 296, fy + 6, 26, 44); fs(PAPER, 6);
    ell(fx + 296, fy + 6, 26, 44); fs(PAPER, 6);
    // eyes: paper sclera, pupils huge red or normal ink
    var ex = 108, ey = fy - 26;
    ell(fx - ex, ey, 96, 82); fs(PAPER, 6);
    ell(fx + ex, ey, 96, 82); fs(PAPER, 6);
    if (pupilsHuge) {
      circ(fx - ex, ey, 60); fs(RED, 0);
      circ(fx + ex, ey, 60); fs(RED, 0);
      circ(fx - ex, ey, 13); fs(INK, 0);
      circ(fx + ex, ey, 13); fs(INK, 0);
    } else {
      circ(fx - ex, ey, 25); fs(INK, 0);
      circ(fx + ex, ey, 25); fs(INK, 0);
    }
    // nose + flat mouth
    line(fx, ey + 66, fx - 14, fy + 96, INK, 6);
    line(fx - 44, fy + 168, fx + 44, fy + 168, INK, 6);
    ctx.restore();
    // caption band
    ctx.fillStyle = INK;
    ctx.fillRect(SL.x + 26, SL.y + SL.h - 108, SL.w - 52, 74);
    lettered('solo parece cariñoso los fines de semana', SL.x + SL.w / 2, SL.y + SL.h - 71, 27, PAPER);
  }

  function miniPanel(x, y, w, h, id, drawFn) {
    wobRect(x, y, w, h, 12, id); fs(PAPER, 4);
    ctx.save();
    wobRect(x, y, w, h, 12, id); ctx.clip();
    drawFn(x, y, w, h);
    ctx.restore();
  }

  function slide5(t) {
    slideFrame(PAPER, 5);
    ctx.save(); clipSlide(5);
    // compressed recap strip: the whole arc in four mini panels
    var mx = SL.x + 34, my = SL.y + 36, mw = 152, mh = 176, gap = 14;
    miniPanel(mx, my, mw, mh, 51, function (x, y, w, h) {
      ctx.fillStyle = PURPLE; ctx.fillRect(x, y, w, h);
      dogWoman(x + w / 2, y + h - 8, 0.42, { worried: true, droop: 0.2 });
      circ(x + w / 2 + 26, y + 30, 15); fs(PAPER, 3);
      circ(x + w / 2 + 40, y + 18, 10); fs(PAPER, 3);
    });
    miniPanel(mx + (mw + gap), my, mw, mh, 52, function (x, y, w, h) {
      ctx.fillStyle = PURPLE; ctx.fillRect(x, y, w, h);
      scott(x + w / 2, y + h - 8, 0.42, { recoil: true, handsUp: true, pupilR: 13 });
    });
    miniPanel(mx + (mw + gap) * 2, my, mw, mh, 53, function (x, y, w, h) {
      ctx.fillStyle = PURPLE; ctx.fillRect(x, y, w, h);
      friend(x + w / 2, y + h - 8, 0.42, { armsCrossed: true });
    });
    miniPanel(mx + (mw + gap) * 3, my, mw, mh, 54, function (x, y, w, h) {
      circ(x + w / 2 - 32, y + h / 2, 27); fs(RED, 0);
      circ(x + w / 2 + 32, y + h / 2, 27); fs(RED, 0);
    });
    ctx.restore();

    // the tribunal banner, slamming in from its top edge
    var e = t - slideStartT;
    var sy = 1;
    if (e < 0.55) sy = easeOutBack(Math.max(e, 0) / 0.55);
    var bx = SL.x + 18, bw = SL.w - 36, by = 396, bh = 330;
    ctx.save();
    ctx.translate(bx + bw / 2, by);
    ctx.scale(1, sy);
    ctx.translate(-(bx + bw / 2), -by);
    ctx.save();
    ctx.translate(bx + bw / 2, by + bh / 2); ctx.rotate(-0.012);
    ctx.translate(-(bx + bw / 2), -(by + bh / 2));
    wobRect(bx, by, bw, bh, 14, 55); fs(YELLOW, 8);
    lettered('BEWARE!', bx + bw / 2, by + 62, 56, INK, 800);
    lettered('SCOTT', bx + bw / 2, by + 158, 128, INK, 800);
    lettered('THE SCROTUM', bx + bw / 2, by + 262, 84, INK, 800);
    ctx.restore();
    ctx.restore();

    // closing caption: the title, as the verdict
    lettered('amiga, date cuenta', SL.x + SL.w / 2, 884, 44, INK);
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(SL.x + SL.w / 2 - 168, 922);
    ctx.quadraticCurveTo(SL.x + SL.w / 2, 934, SL.x + SL.w / 2 + 168, 922);
    ctx.stroke();
  }
  function easeOutBack(u) {
    var c = 1.70158;
    return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2);
  }

  var SLIDES = [slide1, slide2, slide3, slide4, slide5];

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);
    ctx.lineJoin = 'round';

    SLIDES[slide](t);

    // slide counter + hint
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = INK;
    setFont(25, 700);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('slide ' + (slide + 1) + ' / 5', 20, 1062);
    ctx.textAlign = 'right';
    ctx.fillText('tap', 1060, 1062);
    ctx.restore();

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage; page ground is the paper) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      S = W;
      OX = 0; OY = (H - S) / 2;
    } else {
      S = Math.min(W, H);
      OX = (W - S) / 2; OY = (H - S) / 2;
    }
    draw(simT);
  }

  // ---- interaction ----
  function toDesign(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return {
      x: (e.clientX - rect.left - OX) / S * 1080,
      y: (e.clientY - rect.top - OY) / S * 1080
    };
  }
  // rough on-screen zones of the dog-woman per slide (design coords)
  function inDogZone(p) {
    if (slide === 0) return p.x > 380 && p.x < 850 && p.y > 480 && p.y < 1000;
    if (slide === 1) return p.x > 180 && p.x < 580 && p.y > 480 && p.y < 1000;
    if (slide === 2) return p.x > 160 && p.x < 560 && p.y > 500 && p.y < 1000;
    return false;
  }
  function inScottFace(p) {
    var fx = SL.x + SL.w / 2, fy = 452;
    var dx = p.x - fx, dy = p.y - fy;
    return dx * dx + dy * dy < 296 * 296;
  }

  var downInfo = null;
  function onDown(e) {
    var p = toDesign(e);
    downInfo = { x: p.x, y: p.y, t: e.timeStamp || 0, dog: inDogZone(p), lastX: p.x, lastY: p.y, moved: 0 };
  }
  function onMove(e) {
    if (!downInfo) return;
    var p = toDesign(e);
    var d = Math.sqrt((p.x - downInfo.lastX) * (p.x - downInfo.lastX) +
                      (p.y - downInfo.lastY) * (p.y - downInfo.lastY));
    downInfo.moved += d;
    downInfo.lastX = p.x; downInfo.lastY = p.y;
    if (downInfo.dog) wagEnergy = Math.min(wagEnergy + d * 0.006, 2.2);
  }
  function onUp(e) {
    if (!downInfo) return;
    var p = toDesign(e);
    var dt = (e.timeStamp || 0) - downInfo.t;
    var wasTap = downInfo.moved < 14 && dt < 500;
    var startedOnDog = downInfo.dog;
    downInfo = null;
    if (!wasTap) return;
    if (slide === 3 && inScottFace(p)) {
      pupilsHuge = !pupilsHuge;
      draw(simT);
      return;
    }
    if (startedOnDog) return; // a tap on her is for the tail, not the carousel
    slide = (slide + 1) % 5;
    slideStartT = simT;
    draw(simT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { downInfo = null; });
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null, prevStamp = null;
  function frame(ts) {
    if (startStamp === null) { startStamp = ts; prevStamp = ts; }
    var dt = Math.min((ts - prevStamp) / 1000, 0.1);
    prevStamp = ts;
    wagEnergy *= Math.pow(0.3, dt); // tail settles over about a second
    if (wagEnergy < 0.001) wagEnergy = 0;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
