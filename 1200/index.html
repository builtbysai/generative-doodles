<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Digital Alzheimer's</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070F; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// No.1200 "Digital Alzheimer's" — Evan Meaney study block EV1.
// One home-movie image, clear for 10 seconds, then it forgets itself in
// discrete horizontal shear events for 3 minutes and never remembers.
// The end state (ghost-blue smear) holds forever. Dragging is a bad
// sector: it hastens the forgetting where it touches, irreversibly.

var T0 = 8;                 // fixed phase of the synchronous first frame
var SLICES = 56;            // horizontal slices the scene is drawn in
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 720, H = 720;

// ---------- seeded rng / hash (mulberry32 family) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash1(n) { // deterministic [0,1) from an integer
  var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

// ---------- color helpers ----------
function hx(c) {
  return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
}
function mixc(c1, c2, f) {
  var a = hx(c1), b = hx(c2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' +
                  Math.round(a[1] + (b[1] - a[1]) * f) + ',' +
                  Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}

// ---------- decay event schedule (precomputed, irreversible) ----------
// Events start after the 10s of clarity; gaps 8-15s, hashed; each shears a
// band of 3-9 slices by an offset that grows with the event index.
var EVENTS = (function () {
  var rnd = mulberry32(1200101);
  var evs = [], t = 10, k = 0;
  while (t < 168) {
    var rows = 3 + Math.floor(rnd() * 7);              // 3..9 slices
    var start = Math.floor(rnd() * (SLICES - rows));
    var mag = Math.min(0.083, 0.016 + k * 0.0045);     // fraction of W, grows
    var off = (0.35 + rnd() * 0.65) * mag * (rnd() < 0.5 ? -1 : 1);
    evs.push({ time: t, row0: start, row1: start + rows, off: off });
    t += 8 + rnd() * 7;                                // gap 8..15 s
    k++;
  }
  return evs;
})();

// ---------- bad sectors (drag samples, never expire) ----------
var samples = [];   // {x, y (fractions of W,H), t (piece time), dir}
var pointerDown = false, lastPX = 0, lastPY = 0, lastSampleT = -10;

// ---------- per-slice horizontal offset (fraction of W) ----------
function rowOffset(row, yc, t) {
  var off = 0, i, e;
  for (i = 0; i < EVENTS.length; i++) {
    e = EVENTS[i];
    if (e.time <= t && row >= e.row0 && row < e.row1) off += e.off;
  }
  // final minute: slow global smear-out
  if (t > 120) off += Math.sin(row * 0.7) * ((t - 120) / 60) * 0.042;
  // magenta chew band jitter (hash-stepped every 0.3 s)
  var bandC = -0.10 + (t / 180) * 1.25;                // fraction of H
  if (Math.abs(yc - bandC) < 0.045) {
    var step = Math.floor(t / 0.3);
    off += (hash1(row * 131 + step * 17) - 0.5) * 0.028;
  }
  // bad sectors: touched rows shear further, growing over 4 s, forever
  for (i = 0; i < samples.length; i++) {
    var s = samples[i];
    var dy = Math.abs(yc - s.y);
    if (dy < 0.07 && t > s.t) {
      off += s.dir * Math.min(1, (t - s.t) / 4) * 0.036 * (1 - dy / 0.07);
    }
  }
  return off;
}

// ---------- the scene ----------
// All geometry in fractions; u = min(W,H) is the figure unit.
function sceneColors(t) {
  var f = Math.min(1, t / 180);                        // overall deepening
  var g = Math.min(1, t / 150);                        // skin forgetting
  return {
    skyTop: mixc('#1B4FD8', '#14306B', f),
    skyHor: mixc('#7FA8F2', '#14306B', f),
    ground: mixc('#5A7A38', '#12233F', f * 0.9),
    groundFar: mixc('#6E8C46', '#16294A', f * 0.9),
    skin: mixc('#C8A080', '#8C8C8C', g),
    hair: mixc('#3A2A1E', '#3A3A3A', g),
    shirt: mixc('#C84A3A', '#7A5A55', f * 0.55),
    pants: mixc('#2E4A6B', '#33404E', f * 0.55),
    shoe: '#1E1A16',
    houseWall: mixc('#D8CFC0', '#5A6274', f * 0.8),
    houseRoof: mixc('#8A4A3A', '#3E3444', f * 0.8),
    houseDark: mixc('#4A3A2E', '#141A2A', f * 0.8),
    sun: mixc('#F5E9C8', '#8A94B8', f),
    bush: mixc('#3E6030', '#101E33', f * 0.9)
  };
}

function poly(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
}
function circ(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}
function rect(x, y, w, h) { ctx.fillRect(x, y, w, h); }

// Background: sky bands + sun + ground. flat != null tints objects only,
// so the background is only drawn in the color pass.
function drawBackground(C) {
  var bands = 12, i, horY = 0.78 * H;
  // sky / ground rects are drawn 3x wide so a sheared slice still covers
  // the frame edge-to-edge (objects shear away; the field remains)
  for (i = 0; i < bands; i++) {
    ctx.fillStyle = mixc2(C.skyTop, C.skyHor, i / (bands - 1));
    ctx.fillRect(-W, (horY * i) / bands - 1, W * 3, horY / bands + 2);
  }
  ctx.fillStyle = C.sun;
  circ(0.14 * W, 0.16 * H, 0.05 * Math.min(W, H));
  ctx.fillStyle = C.groundFar;
  ctx.fillRect(-W, horY - 1, W * 3, 0.035 * H + 2);
  ctx.fillStyle = C.ground;
  ctx.fillRect(-W, horY + 0.035 * H, W * 3, H - horY);
}
function mixc2(rgbA, rgbB, f) { // mix two 'rgb()' strings via stored arrays
  var a = rgbA.match(/\d+/g), b = rgbB.match(/\d+/g);
  return 'rgb(' + Math.round(+a[0] + (b[0] - a[0]) * f) + ',' +
                  Math.round(+a[1] + (b[1] - a[1]) * f) + ',' +
                  Math.round(+a[2] + (b[2] - a[2]) * f) + ')';
}

// Foreground objects: house, bushes, figure. flat = a single color string
// for chroma-fringe passes, or null for true colors. figAlpha applies to
// the figure only (its end-state fade to a ghost).
function drawObjects(C, flat, figAlpha) {
  var u = Math.min(W, H), horY = 0.78 * H;
  function F(col) { ctx.fillStyle = flat || col; }
  // --- house (right) ---
  var hx0 = 0.70 * W, hw = 0.20 * W, hTop = horY - 0.17 * H;
  F(C.houseWall); rect(hx0, hTop, hw, 0.17 * H);
  F(C.houseRoof);
  poly([[hx0 - 0.02 * W, hTop], [hx0 + hw + 0.02 * W, hTop], [hx0 + hw * 0.72, hTop - 0.085 * H], [hx0 + hw * 0.28, hTop - 0.085 * H]]);
  F(C.houseDark); rect(hx0 + hw * 0.40, horY - 0.075 * H, hw * 0.20, 0.075 * H);   // door
  F(C.houseDark); rect(hx0 + hw * 0.10, hTop + 0.045 * H, hw * 0.16, 0.045 * H);   // window
  F(C.houseDark); rect(hx0 + hw * 0.74, hTop + 0.045 * H, hw * 0.16, 0.045 * H);
  // --- bushes ---
  F(C.bush);
  circ(0.665 * W, horY + 0.012 * H, 0.030 * u); circ(0.695 * W, horY + 0.018 * H, 0.024 * u);
  circ(0.185 * W, horY + 0.014 * H, 0.026 * u); circ(0.215 * W, horY + 0.020 * H, 0.020 * u);
  // --- figure (center-left, standing) ---
  ctx.globalAlpha = figAlpha;
  var cx = 0.42 * W, feet = 0.825 * H;
  var headR = 0.055 * H, headCY = feet - 0.44 * H;
  var hipY = feet - 0.21 * H, shoY = feet - 0.375 * H;
  // legs (pants)
  F(C.pants);
  rect(cx - 0.052 * u, hipY, 0.042 * u, feet - hipY - 0.012 * H);
  rect(cx + 0.010 * u, hipY, 0.042 * u, feet - hipY - 0.012 * H);
  // shoes
  F(C.shoe);
  rect(cx - 0.056 * u, feet - 0.014 * H, 0.052 * u, 0.014 * H);
  rect(cx + 0.006 * u, feet - 0.014 * H, 0.052 * u, 0.014 * H);
  // arms: upper (shirt) angled down-out, forearm (skin) hanging
  F(C.shirt);
  poly([[cx - 0.085 * u, shoY + 0.005 * H], [cx - 0.125 * u, shoY + 0.085 * H], [cx - 0.098 * u, shoY + 0.10 * H], [cx - 0.062 * u, shoY + 0.03 * H]]);
  poly([[cx + 0.085 * u, shoY + 0.005 * H], [cx + 0.125 * u, shoY + 0.085 * H], [cx + 0.098 * u, shoY + 0.10 * H], [cx + 0.062 * u, shoY + 0.03 * H]]);
  F(C.skin);
  poly([[cx - 0.125 * u, shoY + 0.085 * H], [cx - 0.132 * u, shoY + 0.175 * H], [cx - 0.104 * u, shoY + 0.175 * H], [cx - 0.098 * u, shoY + 0.10 * H]]);
  poly([[cx + 0.125 * u, shoY + 0.085 * H], [cx + 0.132 * u, shoY + 0.175 * H], [cx + 0.104 * u, shoY + 0.175 * H], [cx + 0.098 * u, shoY + 0.10 * H]]);
  circ(cx - 0.118 * u, shoY + 0.185 * H, 0.016 * u);   // hands
  circ(cx + 0.118 * u, shoY + 0.185 * H, 0.016 * u);
  // torso (shirt trapezoid)
  F(C.shirt);
  poly([[cx - 0.088 * u, shoY], [cx + 0.088 * u, shoY], [cx + 0.066 * u, hipY + 0.01 * H], [cx - 0.066 * u, hipY + 0.01 * H]]);
  // neck + head + hair
  F(C.skin); rect(cx - 0.018 * u, headCY + headR * 0.7, 0.036 * u, 0.035 * H);
  F(C.skin); circ(cx, headCY, headR);
  F(C.hair);
  ctx.beginPath();
  ctx.moveTo(cx - headR, headCY + headR * 0.15);
  ctx.arc(cx, headCY, headR, Math.PI * 0.95, Math.PI * 2.05);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

// ---------- frame ----------
function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var te = Math.min(t, 185);                            // end state clamps
  var C = sceneColors(te);
  var ghost = Math.max(0, Math.min(1, (te - 150) / 30));
  var figAlpha = 1 - 0.75 * ghost;
  var sh = H / SLICES;
  var bandC = -0.10 + (te / 180) * 1.25;
  for (var i = 0; i < SLICES; i++) {
    var y0 = i * sh, yc = (y0 + sh / 2) / H;
    var off = rowOffset(i, yc, te) * W;
    ctx.save();
    ctx.beginPath();
    ctx.rect(-80, y0 - 0.6, W + 160, sh + 1.2);
    ctx.clip();
    if (Math.abs(off) > 4) {
      // chroma fringe: magenta / cyan object ghosts around displaced slice
      ctx.save(); ctx.translate(off - 3, 0); ctx.globalAlpha = 0.5;
      drawObjects(C, '#FF2B8D', figAlpha); ctx.restore();
      ctx.save(); ctx.translate(off + 3, 0); ctx.globalAlpha = 0.5;
      drawObjects(C, '#00E5FF', figAlpha); ctx.restore();
    }
    ctx.save(); ctx.translate(off, 0);
    drawBackground(C);
    drawObjects(C, null, figAlpha);
    ctx.restore();
    // magenta chew-band wash over its slices
    if (Math.abs(yc - bandC) < 0.045) {
      ctx.fillStyle = 'rgba(255,43,141,0.25)';
      ctx.fillRect(0, y0 - 0.6, W, sh + 1.2);
    }
    ctx.restore();
  }
}

// ---------- sizing (Visual Viewport API) ----------
function fit() {
  var vv = window.visualViewport;
  W = vv ? vv.width : (window.innerWidth || 720);
  H = vv ? vv.height : (window.innerHeight || 720);
  var dpr = window.devicePixelRatio || 1;
  // house style: backing store in CSS pixels (renderer is 1:1)
  canvas.width = W; canvas.height = H;
  void dpr;
  // phone detection per house rules (full-bleed piece either way)
  var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
  var phone = sw < 700 || H > W * 1.15;
  void phone;
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', function () { fit(); draw(nowT()); });
}
window.addEventListener('resize', function () { fit(); draw(nowT()); });

// ---------- clock: fixed-phase first frame, rAF anchored ----------
var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
function nowT() {
  var n = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  return T0 + (n - startStamp) / 1000;
}
fit();
draw(T0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function () { draw(nowT()); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

// ---------- pointer: the finger is a bad sector ----------
function addSample(x, y, t) {
  var dir = 1;
  if (samples.length) {
    var dx = x - samples[samples.length - 1].x;
    if (Math.abs(dx) > 0.004) dir = dx > 0 ? 1 : -1;
    else dir = hash1(samples.length * 7) < 0.5 ? -1 : 1;
  }
  samples.push({ x: x, y: y, t: t, dir: dir });
  if (samples.length > 200) samples.shift();
}
function evtPos(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: W, height: H };
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}
canvas.addEventListener('pointerdown', function (e) {
  pointerDown = true; var p = evtPos(e); lastPX = p.x; lastPY = p.y;
  lastSampleT = nowT(); addSample(p.x, p.y, lastSampleT);
});
canvas.addEventListener('pointermove', function (e) {
  if (!pointerDown) return;
  var t = nowT(); if (t - lastSampleT < 0.05) return;
  var p = evtPos(e); lastPX = p.x; lastPY = p.y; lastSampleT = t;
  addSample(p.x, p.y, t);
});
canvas.addEventListener('pointerup', function () { pointerDown = false; });
canvas.addEventListener('pointercancel', function () { pointerDown = false; });
</script>
</body>
</html>
