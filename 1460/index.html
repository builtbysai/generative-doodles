<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bilderpartitur</title>
<style>
  html, body { margin: 0; padding: 0; background: #b09a7a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  /* ---- seeded PRNG (mulberry32), never Math.random ---- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1460000);

  /* ---- palette: board kraft, cards black/white/grey, yarn red only ---- */
  var BOARD = '#b09a7a', DOOR = '#8a7358';
  var BLACK = '#141414', WHITE = '#f2f2f2', GREY = '#8a8a8a';
  var YARN = '#c1272d';
  var CORKDOT = 'rgba(101,74,47,0.18)';

  /* ---- viewport ---- */
  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.round(W); canvas.height = Math.round(H);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var minScreen = 99999;
    if (typeof window !== 'undefined' && window.screen) {
      minScreen = Math.min(window.screen.width, window.screen.height);
    }
    phone = minScreen < 700 || (H > W * 1.15 && minScreen >= 700 && W < 700);
  }
  size();
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', size);
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', size);
    }
  }

  /* ---- helpers (node-canvas safe: no gradients, no shadowBlur, no Path2D) ---- */
  function a4(x) { return Math.round(x * 10000) / 10000; }
  function rect(x, y, w, h, fill) {
    ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  }
  function strokeRect(x, y, w, h, col, wdt) {
    ctx.strokeStyle = col; ctx.lineWidth = wdt;
    ctx.strokeRect(x + 0.5, y + 0.5, w, h);
  }
  function dot(x, y, r, fill) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
  }
  function ring(x, y, r, col, wdt) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = col; ctx.lineWidth = wdt; ctx.stroke();
  }
  function line(x1, y1, x2, y2, wdt, col) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = col || BLACK; ctx.lineWidth = wdt; ctx.stroke();
  }
  function poly(pts, fill, strokeIt) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    if (strokeIt) { ctx.strokeStyle = BLACK; ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.002); ctx.stroke(); }
  }
  function ellipse(x, y, rx, ry, fill) {
    ctx.beginPath(); ctx.moveTo(x + rx, y); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function ease(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }

  /* ---- seeded layout (fractions of frame; computed ONCE, never in draw) ---- */
  var cardTypes = ['figure', 'junk', 'street', 'mask', 'trophy', 'figure2', 'junk', 'street', 'figure'];
  var cards = [];
  for (var ci = 0; ci < 9; ci++) {
    var col = ci % 3, row = Math.floor(ci / 3);
    var cx = (col + 0.5) / 3 + (rng() - 0.5) * 0.10;
    var cy = (row + 0.5) / 3 + (rng() - 0.5) * 0.10;
    if (ci === 4) cx += 0.05; /* centre card leans onto its neighbour: a real overlap */
    var bg = rng() < 0.5 ? WHITE : GREY;
    cards.push({ type: cardTypes[ci], cx: cx, cy: cy, bg: bg, fg: bg === WHITE ? BLACK : WHITE });
  }
  /* yarn web: fixed pairs, sag seeded once */
  var yarnPairs = [
    [0, 1], [1, 2], [2, 5], [5, 8], [8, 7], [7, 6], [6, 3], [3, 0],
    [0, 4], [4, 8], [1, 4], [4, 6], [2, 4], [4, 3]
  ];
  var yarnSag = [];
  for (var yi = 0; yi < yarnPairs.length; yi++) {
    yarnSag.push((rng() < 0.5 ? -1 : 1) * (0.10 + rng() * 0.20));
  }
  /* cork texture dots, seeded once */
  var cork = [];
  for (var di = 0; di < 70; di++) {
    cork.push({ x: rng(), y: rng(), s: 1 + rng() * 2.5 });
  }
  /* three cutout windows, seeded jitter around fixed spots */
  var winTypes = ['mask', 'trophy', 'junk'];
  var winSpots = [[0.18, 0.62], [0.60, 0.14], [0.80, 0.78]];
  var wins = [];
  for (var wi = 0; wi < 3; wi++) {
    wins.push({
      type: winTypes[wi],
      cx: winSpots[wi][0] + (rng() - 0.5) * 0.04,
      cy: winSpots[wi][1] + (rng() - 0.5) * 0.04,
      open: false,
      anim: { from: 0, to: 0, start: 0 }
    });
  }

  /* ---- geometry helpers (px, from fractions) ---- */
  function cardRect(c) {
    var cw = Math.min(W, H) * 0.26, ch = cw * 1.3;
    /* clamp so no card is ever clipped by the frame edge, any aspect */
    var x = clamp(c.cx * W - cw / 2, 4, Math.max(4, W - cw - 4));
    var y = clamp(c.cy * H - ch / 2, 4, Math.max(4, H - ch - 4));
    return { x: x, y: y, w: cw, h: ch };
  }
  function winRect(wn) {
    var s = Math.min(W, H) * 0.17;
    var x = clamp(wn.cx * W - s / 2, 4, Math.max(4, W - s - 4));
    var y = clamp(wn.cy * H - s / 2, 4, Math.max(4, H - s - 4));
    return { x: x, y: y, w: s, h: s };
  }
  /* point on a rect border toward a target point */
  function borderPoint(r, tx, ty) {
    var cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    var dx = tx - cx, dy = ty - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    var sx = dx !== 0 ? (r.w / 2) / Math.abs(dx) : 1e9;
    var sy = dy !== 0 ? (r.h / 2) / Math.abs(dy) : 1e9;
    var t = Math.min(sx, sy) * 0.98;
    return { x: cx + dx * t, y: cy + dy * t };
  }
  function doorProgress(wn, t) {
    var a = wn.anim;
    return a.from + (a.to - a.from) * ease((t - a.start) / 0.5);
  }

  /* ---- greyscale silhouettes (image area ix,iy,iw,ih; main + detail) ---- */
  function drawSilhouette(type, ix, iy, iw, ih, main, detail) {
    var cx = ix + iw / 2, cy = iy + ih / 2, s = Math.min(iw, ih);
    var u = s / 100;
    if (type === 'figure' || type === 'figure2') {
      /* standing costumed figure: head, robe, arms */
      dot(cx, iy + ih * 0.22, s * 0.11, main);
      var shoulderY = iy + ih * 0.36, hemY = iy + ih * 0.86;
      poly([[cx - s * 0.20, shoulderY], [cx + s * 0.20, shoulderY],
            [cx + s * 0.30, hemY], [cx - s * 0.30, hemY]], main, false);
      if (type === 'figure') {
        line(cx - s * 0.20, shoulderY + s * 0.05, cx - s * 0.32, shoulderY + s * 0.30, Math.max(1, u * 2.5), main);
        line(cx + s * 0.20, shoulderY + s * 0.05, cx + s * 0.32, shoulderY + s * 0.30, Math.max(1, u * 2.5), main);
      } else {
        line(cx - s * 0.20, shoulderY + s * 0.05, cx - s * 0.34, shoulderY - s * 0.18, Math.max(1, u * 2.5), main);
        line(cx + s * 0.20, shoulderY + s * 0.05, cx + s * 0.34, shoulderY - s * 0.18, Math.max(1, u * 2.5), main);
      }
      rect(cx - s * 0.30, hemY - s * 0.04, s * 0.60, s * 0.04, detail);
    } else if (type === 'junk') {
      /* Chinese junk: hull, masts, battened sails */
      var hullY = iy + ih * 0.62;
      poly([[ix + iw * 0.12, hullY], [ix + iw * 0.88, hullY],
            [ix + iw * 0.78, hullY + s * 0.16], [ix + iw * 0.22, hullY + s * 0.16]], main, false);
      line(cx - s * 0.16, hullY, cx - s * 0.16, iy + ih * 0.16, Math.max(1, u * 2), main);
      line(cx + s * 0.18, hullY, cx + s * 0.18, iy + ih * 0.24, Math.max(1, u * 2), main);
      poly([[cx - s * 0.16, iy + ih * 0.20], [cx - s * 0.02, iy + ih * 0.20],
            [cx - s * 0.02, iy + ih * 0.46], [cx - s * 0.16, iy + ih * 0.46]], detail, false);
      poly([[cx + s * 0.18, iy + ih * 0.28], [cx + s * 0.32, iy + ih * 0.28],
            [cx + s * 0.32, iy + ih * 0.50], [cx + s * 0.18, iy + ih * 0.50]], detail, false);
      rect(ix + iw * 0.10, hullY + s * 0.20, iw * 0.80, s * 0.03, detail);
    } else if (type === 'street') {
      /* street: three buildings, doorways, small windows */
      var base = iy + ih * 0.86;
      var bw = iw / 3;
      for (var bi = 0; bi < 3; bi++) {
        var bx = ix + bi * bw + bw * 0.08;
        var bh = ih * (0.42 + bi * 0.10);
        rect(bx, base - bh, bw * 0.84, bh, main);
        rect(bx + bw * 0.30, base - ih * 0.16, bw * 0.24, ih * 0.16, detail);
        rect(bx + bw * 0.14, base - bh * 0.70, bw * 0.16, ih * 0.10, detail);
        rect(bx + bw * 0.56, base - bh * 0.70, bw * 0.16, ih * 0.10, detail);
      }
      rect(ix, base, iw, ih * 0.04, main);
    } else if (type === 'mask') {
      /* mask: oval, eye holes, mouth */
      ellipse(cx, cy, s * 0.30, s * 0.38, main);
      dot(cx - s * 0.13, cy - s * 0.06, s * 0.055, detail);
      dot(cx + s * 0.13, cy - s * 0.06, s * 0.055, detail);
      line(cx - s * 0.12, cy + s * 0.18, cx + s * 0.12, cy + s * 0.18, Math.max(1, u * 2.5), detail);
      ring(cx, cy, s * 0.42, main, Math.max(1, u * 2));
    } else if (type === 'trophy') {
      /* trophy: cup, stem, base, handles */
      var cupY = iy + ih * 0.18;
      poly([[cx - s * 0.22, cupY], [cx + s * 0.22, cupY],
            [cx + s * 0.14, cupY + s * 0.30], [cx - s * 0.14, cupY + s * 0.30]], main, false);
      rect(cx - s * 0.03, cupY + s * 0.30, s * 0.06, s * 0.16, main);
      rect(cx - s * 0.16, cupY + s * 0.46, s * 0.32, s * 0.08, main);
      line(cx - s * 0.22, cupY + s * 0.05, cx - s * 0.32, cupY + s * 0.18, Math.max(1, u * 2.5), main);
      line(cx + s * 0.22, cupY + s * 0.05, cx + s * 0.32, cupY + s * 0.18, Math.max(1, u * 2.5), main);
      dot(cx, cupY - s * 0.06, s * 0.05, detail);
    }
  }

  /* ---- interaction: drag a card, tap a window; never resets layout ---- */
  var drag = null;       /* {card, ox, oy} offsets in fractions */
  var pendingTap = null; /* {win, x, y} */
  function hitTest(e) {
    var px = e.clientX, py = e.clientY;
    for (var wi = wins.length - 1; wi >= 0; wi--) {
      var wr = winRect(wins[wi]);
      if (px >= wr.x && px <= wr.x + wr.w && py >= wr.y && py <= wr.y + wr.h) {
        return { kind: 'win', win: wins[wi] };
      }
    }
    /* cards in reverse draw order; dragged card is topmost */
    var order = [];
    for (var ci = 0; ci < cards.length; ci++) order.push(cards[ci]);
    if (drag) {
      var di = order.indexOf(drag.card);
      if (di >= 0) { order.splice(di, 1); order.push(drag.card); }
    }
    for (var oi = order.length - 1; oi >= 0; oi--) {
      var cr = cardRect(order[oi]);
      if (px >= cr.x && px <= cr.x + cr.w && py >= cr.y && py <= cr.y + cr.h) {
        return { kind: 'card', card: order[oi] };
      }
    }
    return null;
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (e.preventDefault) e.preventDefault();
    var hit = hitTest(e);
    if (!hit) return;
    if (hit.kind === 'win') {
      pendingTap = { win: hit.win, x: e.clientX, y: e.clientY };
    } else {
      drag = { card: hit.card, ox: hit.card.cx - e.clientX / W, oy: hit.card.cy - e.clientY / H };
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.card.cx = clamp(e.clientX / W + drag.ox, 0.06, 0.94);
    drag.card.cy = clamp(e.clientY / H + drag.oy, 0.06, 0.94);
  });
  function endPointer(e) {
    if (pendingTap) {
      var moved = Math.abs(e.clientX - pendingTap.x) + Math.abs(e.clientY - pendingTap.y);
      if (moved < 8) {
        var wn = pendingTap.win;
        var now = clockNow();
        wn.anim = { from: doorProgress(wn, now), to: wn.open ? 0 : 1, start: now };
        wn.open = !wn.open;
      }
      pendingTap = null;
    }
    drag = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  /* ---- clock ---- */
  var startMs = null;
  function clockNow() {
    if (startMs === null) return 0;
    return (performance.now() - startMs) / 1000;
  }

  /* ---- draw ---- */
  function draw(t) {
    size();
    var S = Math.min(W, H);
    rect(0, 0, W, H, BOARD);
    /* cork texture: flat seeded dots */
    for (var ci2 = 0; ci2 < cork.length; ci2++) {
      var d = cork[ci2];
      rect(d.x * W, d.y * H, d.s, d.s, CORKDOT);
    }
    /* yarn web, under the cards, re-routed live from current anchors */
    ctx.strokeStyle = YARN;
    ctx.lineWidth = Math.max(1.5, S * 0.004);
    ctx.lineCap = 'round';
    for (var yi2 = 0; yi2 < yarnPairs.length; yi2++) {
      var a = cards[yarnPairs[yi2][0]], b = cards[yarnPairs[yi2][1]];
      var ra = cardRect(a), rb = cardRect(b);
      var pa = borderPoint(ra, rb.x + rb.w / 2, rb.y + rb.h / 2);
      var pb = borderPoint(rb, ra.x + ra.w / 2, ra.y + ra.h / 2);
      var mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
      var dx = pb.x - pa.x, dy = pb.y - pa.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / len, ny = dx / len;
      var sag = yarnSag[yi2] * len;
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.quadraticCurveTo(mx + nx * sag, my + ny * sag, pb.x, pb.y);
      ctx.stroke();
    }
    /* cards; dragged card drawn last, on top */
    var order2 = [];
    for (var ci3 = 0; ci3 < cards.length; ci3++) order2.push(cards[ci3]);
    if (drag) {
      var dj = order2.indexOf(drag.card);
      if (dj >= 0) { order2.splice(dj, 1); order2.push(drag.card); }
    }
    for (var oi2 = 0; oi2 < order2.length; oi2++) {
      var c = order2[oi2];
      var r = cardRect(c);
      rect(r.x, r.y, r.w, r.h, WHITE);
      strokeRect(r.x, r.y, r.w, r.h, BLACK, Math.max(1, S * 0.002));
      var inset = r.w * 0.08;
      rect(r.x + inset, r.y + inset, r.w - inset * 2, r.h - inset * 2, c.bg);
      drawSilhouette(c.type, r.x + inset, r.y + inset, r.w - inset * 2, r.h - inset * 2,
        c.fg, c.fg === BLACK ? GREY : BLACK);
    }
    /* red pins where yarn meets card edges */
    for (var yi3 = 0; yi3 < yarnPairs.length; yi3++) {
      var a3 = cards[yarnPairs[yi3][0]], b3 = cards[yarnPairs[yi3][1]];
      var ra3 = cardRect(a3), rb3 = cardRect(b3);
      var pa3 = borderPoint(ra3, rb3.x + rb3.w / 2, rb3.y + rb3.h / 2);
      var pb3 = borderPoint(rb3, ra3.x + ra3.w / 2, ra3.y + ra3.h / 2);
      var ps = Math.max(2, S * 0.008);
      rect(pa3.x - ps / 2, pa3.y - ps / 2, ps, ps, YARN);
      rect(pb3.x - ps / 2, pb3.y - ps / 2, ps, ps, YARN);
    }
    /* cutout windows, on top */
    for (var wi2 = 0; wi2 < wins.length; wi2++) {
      var wn2 = wins[wi2];
      var wr2 = winRect(wn2);
      var pad = wr2.w * 0.06;
      rect(wr2.x, wr2.y, wr2.w, wr2.h, DOOR);
      rect(wr2.x + pad, wr2.y + pad, wr2.w - pad * 2, wr2.h - pad * 2, WHITE);
      drawSilhouette(wn2.type, wr2.x + pad, wr2.y + pad, wr2.w - pad * 2, wr2.h - pad * 2,
        BLACK, GREY);
      /* hinged door: swings from the left edge, width shrinks with progress */
      var p = doorProgress(wn2, t);
      var dw = wr2.w * (1 - p);
      if (dw > 0.5) {
        rect(wr2.x, wr2.y, dw, wr2.h, DOOR);
        strokeRect(wr2.x, wr2.y, dw, wr2.h, BLACK, Math.max(1, S * 0.002));
        /* door edge + handle, riding the shrinking edge */
        line(wr2.x + dw, wr2.y, wr2.x + dw, wr2.y + wr2.h, Math.max(1, S * 0.002), BLACK);
        if (p < 0.9) {
          var hs = Math.max(2, S * 0.008);
          rect(wr2.x + dw - hs * 2, wr2.y + wr2.h / 2 - hs / 2, hs, hs, BLACK);
        }
      }
    }
  }

  /* probe hook (no visual effect) */
  if (typeof window !== 'undefined') {
    window.__piece = { draw: draw, cards: cards, wins: wins, cardRect: cardRect, winRect: winRect, doorProgress: doorProgress, clockNow: clockNow };
  }

  /* frame one = draw(0) at constant phase, then the rAF loop */
  function loop() {
    draw(clockNow());
    requestAnimationFrame(loop);
  }
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    startMs = performance.now();
    loop();
  }
})();
</script>
</body>
</html>
