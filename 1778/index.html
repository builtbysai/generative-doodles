<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Instruments Performed by the Tide</title>
<style>
html, body { margin: 0; padding: 0; background: #42566B; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#42566B'; /* slate water */
var WATER_DEEP = '#33424F';
var WATER_LIGHT = '#5A7086';
var DOCK = '#10151A'; /* near-black dock */
var DOCK_EDGE = 'rgba(255,255,255,0.09)';
var SILVER_HI = '#E9EDEF';
var SILVER_MID = '#9AA3AC';
var SILVER_LO = '#5E686F';
var RIM = '#2A2F33';
var RING = '#BFE9F2'; /* pale cyan strike rings */
var SWELL_FILL = 'rgba(190,215,230,0.10)';
var SWELL_CORE = 'rgba(205,228,238,0.38)';
var FRAME_T = 60.0; /* fixed phase: one swell mid-frame, leftmost disc just struck */
var CYCLE = 3600.0; /* seconds; one hour, the weather cycle */
var SWELL_DUR = 45.0; /* seconds for one swell front to cross the field */
/* fixed authored swell births inside each 1 h cycle; gaps 575, 530, 830, 810, 855 s
   across the cycle boundary: irregular, weather-like, never metronomic */
var BIRTHS = [45, 620, 1150, 1980, 2790];
/* five discs in a loose row along the dock, largest at center */
var DISC_X = [0.15, 0.325, 0.50, 0.675, 0.85];
var DISC_DX = [-0.008, 0.010, 0, -0.012, 0.006]; /* fixed authored jitter */
var DISC_DY = [-0.006, 0.008, 0, -0.005, 0.007];
var DISC_R = [0.045, 0.052, 0.070, 0.052, 0.045]; /* fractions of field side */
/* stored-energy model: each swell crossing a disc adds ENERGY units;
   at THRESHOLD the disc is struck and the counter resets (remainder carries) */
var ENERGY = [1.0, 0.8, 1.1, 0.8, 1.0];
var THRESHOLD = [1.5, 2.4, 3.0, 2.4, 2.0];
var RING_LIFE = 9.0; /* seconds a strike ring stays visible */
var DOCK_ANGLE = -0.1228; /* tan(-7 deg): the dock is a dark diagonal band */
var DOCK_Y = 0.58; /* dock centerline height, fraction of field height */
var DOCK_H = 0.16; /* dock band height, fraction of field height */
var PLATE_INK = '#ffffff';
var PLATE_LINE = 'rgba(255,255,255,0.45)';
var HINT_INK = '#ffffff';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
/* fixed-seed RNG for the static water streaks only; frame one is byte-comparable */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* swell front position, fraction of field width, for a birth at time b.
   -1 when the swell is not active at time t. Closed-form function of piece time. */
function swellU(t, b) {
  var u = (t - b) / SWELL_DUR;
  if (u < 0 || u > 1) return -1;
  return u;
}
function swellFrontX(u) {
  return F.x + (-0.12 + 1.24 * u) * F.w;
}
/* the swell active at time t, if any: births repeat every CYCLE, so the
   lookup checks the current cycle and the one before it. */
function swellAt(t) {
  var b, k, u;
  var k0 = Math.floor(t / CYCLE);
  for (k = k0 - 1; k <= k0; k++) {
    for (b = 0; b < BIRTHS.length; b++) {
      u = swellU(t, BIRTHS[b] + k * CYCLE);
      if (u >= 0) return { birth: BIRTHS[b] + k * CYCLE, u: u };
    }
  }
  return null;
}
/* time a swell born at b crosses the disc at field-x fraction fx */
function crossingTime(b, fx) {
  return b + SWELL_DUR * (fx + 0.12) / 1.24;
}
/* all swell crossings of disc i up to time t, from the fixed birth table.
   History runs from a fixed epoch (the previous cycle) and only grows with t,
   so a strike is never un-happened by a sliding window: state is a pure,
   consistent function of piece time. */
function discCrossings(i, t) {
  var out = [], k, b, tc;
  for (k = -1; BIRTHS[0] + k * CYCLE <= t; k++) {
    for (b = 0; b < BIRTHS.length; b++) {
      tc = crossingTime(BIRTHS[b] + k * CYCLE, DISC_X[i] + DISC_DX[i]);
      if (tc <= t) out.push(tc);
    }
  }
  out.sort(function (a, b) { return a - b; });
  return out;
}
/* disc state at time t: charge fraction 0..1 and strike times in the last
   RING_LIFE seconds. Pure function of t; no state, no randomness. */
function discState(i, t) {
  var cr = discCrossings(i, t), acc = 0, strikes = [], j;
  for (j = 0; j < cr.length; j++) {
    acc += ENERGY[i];
    if (acc >= THRESHOLD[i] - 1e-9) { strikes.push(cr[j]); acc -= THRESHOLD[i]; }
  }
  var recent = [];
  for (j = 0; j < strikes.length; j++) {
    if (t - strikes[j] <= RING_LIFE) recent.push(strikes[j]);
  }
  return { charge: clamp(acc / THRESHOLD[i], 0, 1), strikes: recent };
}
function dockYAt(fx) {
  var cx = F.x + 0.5 * F.w;
  var cy = F.y + DOCK_Y * F.h;
  return cy + DOCK_ANGLE * (F.x + fx * F.w - cx);
}
function discCenter(i) {
  var S = Math.min(F.w, F.h);
  var fx = DISC_X[i] + DISC_DX[i];
  return {
    x: F.x + fx * F.w,
    y: dockYAt(fx) + DISC_DY[i] * F.h,
    r: DISC_R[i] * S
  };
}
function drawWater() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(F.x, F.y, F.w, F.h);
  /* static streaks on the water: fixed seed, drawn the same every frame */
  var rnd = mulberry32(1778);
  var i, x, y, len, a;
  for (i = 0; i < 46; i++) {
    x = F.x + rnd() * F.w;
    y = F.y + rnd() * F.h;
    len = (0.03 + rnd() * 0.09) * F.w;
    a = 0.04 + rnd() * 0.06;
    ctx.strokeStyle = rnd() < 0.5 ? 'rgba(90,112,134,' + a.toFixed(3) + ')'
                                  : 'rgba(51,66,79,' + a.toFixed(3) + ')';
    ctx.lineWidth = Math.max(1, 0.0015 * F.w);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len, y);
    ctx.stroke();
  }
}
function drawSwells() {
  var sw = swellAt(phaseT);
  if (!sw) return;
  var fx, bw, slant, fade;
  var slantF = 0.08 * F.w;
  bw = 0.07 * F.w;
  fx = swellFrontX(sw.u);
  fade = Math.min(1, sw.u * 8, (1 - sw.u) * 8);
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.fillStyle = SWELL_FILL;
  ctx.beginPath();
  ctx.moveTo(fx - bw / 2 + slantF, F.y);
  ctx.lineTo(fx + bw / 2 + slantF, F.y);
  ctx.lineTo(fx + bw / 2 - slantF, F.y + F.h);
  ctx.lineTo(fx - bw / 2 - slantF, F.y + F.h);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = SWELL_CORE;
  ctx.lineWidth = Math.max(2, 0.003 * F.w);
  ctx.beginPath();
  ctx.moveTo(fx + slantF, F.y);
  ctx.lineTo(fx - slantF, F.y + F.h);
  ctx.stroke();
  ctx.restore();
}
function drawDock() {
  var cx = F.x + 0.5 * F.w;
  var cy = F.y + DOCK_Y * F.h;
  var halfW = 0.75 * F.w;
  var halfH = DOCK_H * F.h / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.atan(DOCK_ANGLE));
  ctx.fillStyle = DOCK;
  ctx.fillRect(-halfW, -halfH, 2 * halfW, 2 * halfH);
  ctx.strokeStyle = DOCK_EDGE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-halfW, -halfH + 0.5);
  ctx.lineTo(halfW, -halfH + 0.5);
  ctx.stroke();
  ctx.restore();
}
function drawDisc(i) {
  var d = discCenter(i);
  var st = discState(i, phaseT);
  var g = ctx.createRadialGradient(d.x - d.r * 0.3, d.y - d.r * 0.35, d.r * 0.1,
                                   d.x, d.y, d.r);
  g.addColorStop(0, SILVER_HI);
  g.addColorStop(0.55, SILVER_MID);
  g.addColorStop(1, SILVER_LO);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(d.x, d.y, d.r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = RIM;
  ctx.lineWidth = Math.max(1.5, 0.004 * d.r * 10);
  ctx.stroke();
  /* brushed highlight arc across the top */
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = Math.max(1, 0.02 * d.r);
  ctx.beginPath();
  ctx.arc(d.x, d.y, d.r * 0.82, Math.PI * 1.15, Math.PI * 1.85);
  ctx.stroke();
  /* center bolt */
  ctx.fillStyle = RIM;
  ctx.beginPath();
  ctx.arc(d.x, d.y, d.r * 0.08, 0, TAU);
  ctx.fill();
  /* stored-energy charge arc around the disc */
  var rr = d.r + Math.max(5, 0.012 * Math.min(F.w, F.h));
  ctx.strokeStyle = 'rgba(191,233,242,0.18)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(d.x, d.y, rr, 0, TAU);
  ctx.stroke();
  if (st.charge > 0.01) {
    ctx.strokeStyle = RING;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(d.x, d.y, rr, -Math.PI / 2, -Math.PI / 2 + st.charge * TAU);
    ctx.stroke();
  }
  /* strike rings: expanding pale cyan circles, fading over RING_LIFE */
  var j, age, a2, rad;
  for (j = 0; j < st.strikes.length; j++) {
    age = phaseT - st.strikes[j];
    rad = d.r * (1 + 3.2 * age / RING_LIFE);
    ctx.strokeStyle = RING;
    ctx.globalAlpha = 0.85 * (1 - age / RING_LIFE);
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(d.x, d.y, rad, 0, TAU);
    ctx.stroke();
    if (age > 1.2) {
      a2 = age - 1.2;
      rad = d.r * (1 + 3.2 * a2 / RING_LIFE);
      ctx.globalAlpha = 0.7 * (1 - a2 / RING_LIFE);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(d.x, d.y, rad, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  var title = 'Five Instruments Performed by the Tide';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(title).width > F.w - 40) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(title).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 24').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = F.x + 12, plateY = F.y + 12;
  ctx.fillStyle = DOCK;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(title, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 24', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = F.x + 12;
  var hintPlateY = F.y + F.h - hintPlateH - 12;
  ctx.fillStyle = DOCK;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  ctx.beginPath();
  ctx.rect(F.x, F.y, F.w, F.h);
  ctx.clip();
  drawWater();
  drawSwells();
  drawDock();
  var i;
  for (i = 0; i < 5; i++) drawDisc(i);
  ctx.restore();
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    discState: function (i, t) { return discState(i, t); },
    swellActive: function (t) { return swellAt(t); }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
