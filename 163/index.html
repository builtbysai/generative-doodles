<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Najm Rosette</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5F2EA; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  build();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

// Kaplan's two-step engine (Najm, 2004), performed as the
// piece. Step one: a hexagonal tiling is drawn in hairline
// grey. Step two: an 8-pointed rosette ({8/3}) is placed in
// every hexagon, and straps join the rosettes across the
// shared edges, matched vertex to vertex. Then the tiling is
// ERASED: the scaffold fades to nothing and the interlaced
// star field stands unsupported, one gold rosette at its
// heart. The weave is not a texture: every crossing of every
// strap is computed, and the under-strand is gapped so the
// over-strand passes cleanly. 45 second loop: scaffold draws,
// rosettes bloom outward, straps interlace, scaffold fades,
// hold, soft reset. Watch only.
var R = 100;               // hexagon circumradius
var STRAPW = 6;
var hexes = [];            // {x, y, dist}
var straps = [];           // {pts:[[x,y],...], gold, hexA, hexB, star}
var crossings = [];        // {x, y, ux, uy, ox, oy}
var centerHex = 0;

function starVerts(cx, cy, r, rot) {
  var out = [];
  for (var i = 0; i < 8; i++) {
    var a = rot + i * Math.PI / 4;
    out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return out;
}

function build() {
  hexes = []; straps = []; crossings = [];
  if (!W || !H) return;
  R = Math.min(W, H) * 0.155;
  STRAPW = Math.max(2, R * 0.062);
  var sx = Math.sqrt(3) * R, sy = 1.5 * R;
  var cx0 = W / 2, cy0 = H / 2;
  var ni = Math.ceil(W / sx) + 2, nj = Math.ceil(H / sy) + 2;
  var i, j, x, y;
  for (j = -nj; j <= nj; j++) for (i = -ni; i <= ni; i++) {
    x = cx0 + i * sx + (Math.abs(j) % 2 ? sx / 2 : 0);
    y = cy0 + j * sy;
    hexes.push({ x: x, y: y, dist: Math.sqrt((x - cx0) * (x - cx0) + (y - cy0) * (y - cy0)) / R });
  }
  centerHex = 0;
  for (i = 1; i < hexes.length; i++) if (hexes[i].dist < hexes[centerHex].dist) centerHex = i;
  var rr = R * 0.78, rot = Math.PI / 8;
  var verts = hexes.map(function (hx) { return starVerts(hx.x, hx.y, rr, rot); });
  // rosette per hexagon: the 8-pointed star outline (outer
  // points joined through the {8/3} silhouette valleys) plus a
  // small {8/3} chord star turning inside it
  var rIn = rr * Math.cos(3 * Math.PI / 8) / Math.cos(2 * Math.PI / 8);
  var order = [0, 3, 6, 1, 4, 7, 2, 5];
  hexes.forEach(function (hx, hi) {
    var outline = [];
    for (var k = 0; k < 8; k++) {
      outline.push(verts[hi][k]);
      var aMid = rot + (k + 0.5) * Math.PI / 4;
      outline.push([hx.x + rIn * Math.cos(aMid), hx.y + rIn * Math.sin(aMid)]);
    }
    outline.push(verts[hi][0]);
    straps.push({ pts: outline, gold: hi === centerHex, hexA: hi, hexB: hi, star: true });
    var inner = order.map(function (k) {
      var a = rot + k * Math.PI / 4;
      return [hx.x + R * 0.30 * Math.cos(a), hx.y + R * 0.30 * Math.sin(a)];
    });
    inner.push(inner[0]);
    straps.push({ pts: inner, gold: hi === centerHex, hexA: hi, hexB: hi, star: true });
  });
  // connectors: for each neighbouring pair, the two closest
  // disjoint vertex pairs whose join hugs the shared edge are
  // strapped straight across it
  var k, a, b, va, vb, cand;
  for (a = 0; a < hexes.length; a++) for (b = a + 1; b < hexes.length; b++) {
    var dx = hexes[b].x - hexes[a].x, dy = hexes[b].y - hexes[a].y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (Math.abs(d - sx) > 1.5) continue;
    var mx = (hexes[a].x + hexes[b].x) / 2, my = (hexes[a].y + hexes[b].y) / 2;
    cand = [];
    for (i = 0; i < 8; i++) for (j = 0; j < 8; j++) {
      va = verts[a][i]; vb = verts[b][j];
      var dd = Math.sqrt((vb[0] - va[0]) * (vb[0] - va[0]) + (vb[1] - va[1]) * (vb[1] - va[1]));
      var mm = Math.sqrt((mx - (va[0] + vb[0]) / 2) * (mx - (va[0] + vb[0]) / 2) + (my - (va[1] + vb[1]) / 2) * (my - (va[1] + vb[1]) / 2));
      if (dd < R * 0.85 && mm < R * 0.38) cand.push({ i: i, j: j, d: dd });
    }
    cand.sort(function (p, q) { return p.d - q.d; });
    var usedI = {}, usedJ = {}, picked = 0;
    for (k = 0; k < cand.length && picked < 2; k++) {
      if (usedI[cand[k].i] || usedJ[cand[k].j]) continue;
      usedI[cand[k].i] = 1; usedJ[cand[k].j] = 1; picked++;
      // the strap runs star point -> contact point on the
      // shared edge -> star point: one continuous band, kinked
      // at the boundary, as in polygons-in-contact
      straps.push({ pts: [verts[a][cand[k].i], [mx, my], verts[b][cand[k].j]], gold: a === centerHex || b === centerHex, hexA: a, hexB: b, star: false });
    }
  }
  // crossings: every segment against every other, computed once
  var segs = [];
  straps.forEach(function (st, si) {
    for (k = 0; k < st.pts.length - 1; k++) {
      segs.push({ x1: st.pts[k][0], y1: st.pts[k][1], x2: st.pts[k + 1][0], y2: st.pts[k + 1][1], owner: si, along: 0 });
    }
  });
  function samePt(x1, y1, x2, y2) { return Math.abs(x1 - x2) < 0.01 && Math.abs(y1 - y2) < 0.01; }
  var s1, s2, den, t, u, px, py;
  for (i = 0; i < segs.length; i++) for (j = i + 1; j < segs.length; j++) {
    s1 = segs[i]; s2 = segs[j];
    if (samePt(s1.x1, s1.y1, s2.x1, s2.y1) || samePt(s1.x1, s1.y1, s2.x2, s2.y2) ||
        samePt(s1.x2, s1.y2, s2.x1, s2.y1) || samePt(s1.x2, s1.y2, s2.x2, s2.y2)) continue;
    den = (s1.x2 - s1.x1) * (s2.y2 - s2.y1) - (s1.y2 - s1.y1) * (s2.x2 - s2.x1);
    if (Math.abs(den) < 1e-9) continue;
    t = ((s2.x1 - s1.x1) * (s2.y2 - s2.y1) - (s2.y1 - s1.y1) * (s2.x2 - s2.x1)) / den;
    u = ((s2.x1 - s1.x1) * (s1.y2 - s1.y1) - (s2.y1 - s1.y1) * (s1.x2 - s1.x1)) / den;
    if (t <= 0.001 || t >= 0.999 || u <= 0.001 || u >= 0.999) continue;
    var l1 = Math.sqrt((s1.x2 - s1.x1) * (s1.x2 - s1.x1) + (s1.y2 - s1.y1) * (s1.y2 - s1.y1));
    var l2 = Math.sqrt((s2.x2 - s2.x1) * (s2.x2 - s2.x1) + (s2.y2 - s2.y1) * (s2.y2 - s2.y1));
    if (t * l1 < STRAPW * 1.7 || (1 - t) * l1 < STRAPW * 1.7 ||
        u * l2 < STRAPW * 1.7 || (1 - u) * l2 < STRAPW * 1.7) continue;
    // the weave lives between the rosettes: a crossing is only
    // gapped when at least one of the strands is a connector
    if (straps[s1.owner].star && straps[s2.owner].star) continue;
    px = s1.x1 + t * (s1.x2 - s1.x1); py = s1.y1 + t * (s1.y2 - s1.y1);
    var under = ((s1.along + s2.along + i) % 2 === 0) ? s1 : s2;
    var over = (under === s1) ? s2 : s1;
    s1.along++; s2.along++;
    var ul = (under === s1) ? l1 : l2, ol = (over === s1) ? l1 : l2;
    crossings.push({
      x: px, y: py, gold: straps[over.owner].gold,
      ux: (under.x2 - under.x1) / ul, uy: (under.y2 - under.y1) / ul,
      ox: (over.x2 - over.x1) / ol, oy: (over.y2 - over.y1) / ol
    });
  }
}

var LOOP = 45000, OFFSET = 33500; // frame one: the finished field, held
function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  var t = (((now - start + OFFSET) % LOOP) + LOOP) % LOOP / 1000;
  ctx.fillStyle = '#F5F2EA'; ctx.fillRect(0, 0, W, H);
  var patAlpha = t < 40 ? 1 : 1 - (t - 40) / 5;
  if (patAlpha <= 0) return;
  // scaffold: in over 0-5s, gone over 23-28s
  var scaf = (t < 5 ? smooth(t / 5) : 1) * (t > 23 ? 1 - smooth((t - 23) / 5) : 1);
  // breathing scale during the hold
  var breathe = (t > 28 && t < 40) ? 1 + 0.005 * Math.sin((t - 28) / 12 * Math.PI * 2) : 1;
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(breathe, breathe); ctx.translate(-W / 2, -H / 2);
  ctx.globalAlpha = patAlpha;
  var i, hx, st, cr;
  if (scaf > 0.003) {
    ctx.strokeStyle = 'rgba(185,180,166,' + (0.9 * scaf).toFixed(3) + ')';
    ctx.lineWidth = 1;
    for (i = 0; i < hexes.length; i++) {
      hx = hexes[i];
      ctx.beginPath();
      for (var k = 0; k < 6; k++) {
        var a = Math.PI / 2 + k * Math.PI / 3;
        var x = hx.x + R * Math.cos(a), y = hx.y + R * Math.sin(a);
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.stroke();
    }
  }
  // straps: rosettes scale up as they bloom; connectors fade in
  var strapW = STRAPW;
  ctx.lineWidth = strapW; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  function bloomOf(hi) { return smooth((t - 5 - hexes[hi].dist * 1.1) / 3.5); }
  for (i = 0; i < straps.length; i++) {
    st = straps[i];
    ctx.strokeStyle = st.gold ? '#C9A227' : '#1B3A6B';
    if (st.star) {
      var g = bloomOf(st.hexA);
      if (g <= 0) continue;
      hx = hexes[st.hexA];
      ctx.beginPath();
      st.pts.forEach(function (p, k2) {
        var x = hx.x + (p[0] - hx.x) * g, y = hx.y + (p[1] - hx.y) * g;
        if (k2 === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    } else {
      var ga = clamp01((Math.min(bloomOf(st.hexA), bloomOf(st.hexB)) - 0.55) / 0.45);
      if (ga <= 0) continue;
      ctx.globalAlpha = patAlpha * ga;
      ctx.beginPath();
      st.pts.forEach(function (p, k2) { if (k2 === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
      ctx.stroke();
      ctx.globalAlpha = patAlpha;
    }
  }
  // interlace: gap the under-strand, restroke the over-strand
  var weave = smooth((t - 15) / 8);
  if (weave > 0) {
    var gapLen = strapW * 1.15;
    ctx.globalAlpha = patAlpha * weave;
    for (i = 0; i < crossings.length; i++) {
      cr = crossings[i];
      ctx.strokeStyle = '#F5F2EA'; ctx.lineWidth = strapW + 2.5;
      ctx.beginPath();
      ctx.moveTo(cr.x - cr.ux * gapLen, cr.y - cr.uy * gapLen);
      ctx.lineTo(cr.x + cr.ux * gapLen, cr.y + cr.uy * gapLen);
      ctx.stroke();
    }
    ctx.lineWidth = strapW;
    for (i = 0; i < crossings.length; i++) {
      cr = crossings[i];
      ctx.strokeStyle = cr.gold ? '#C9A227' : '#1B3A6B';
      ctx.beginPath();
      ctx.moveTo(cr.x - cr.ox * gapLen, cr.y - cr.oy * gapLen);
      ctx.lineTo(cr.x + cr.ox * gapLen, cr.y + cr.oy * gapLen);
      ctx.stroke();
    }
    ctx.globalAlpha = patAlpha;
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
function frame(now) {
  draw(typeof now === 'number' ? now : start);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
resize();
draw(start);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
