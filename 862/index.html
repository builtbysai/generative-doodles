<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№862 Format Grain Archive</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №862 Format Grain Archive, CK8 / PP1262, study #262 colton-kempf.
  // The same tidal-flat figure walking, rendered three ways: super-8
  // with a red light leak and tree silhouettes, VHS with scanline
  // bloom and degraded color, lo-fi camcorder with a date stamp.
  // Under all three, a faint electronic hum on a black screen before
  // the image arrives. The three format panels are stacked; TAP
  // advances which panel is the live one, the active panel full and
  // vivid, the other two dimmed and quiet. No format is best. The
  // hum never leaves. Audio is visual-only in this gallery: the hum
  // is a thin line in the black between the panels, no real
  // WebAudio, per the Franke rule.
  var GROUND = '#050505'; // page ground, hum black

  // Fixed-phase first frame: FIRST_T = 12 s into a 60 s cycle.
  // The walk stride is 2 s, the tracking band 30 s, the hum wobble
  // 10 s, grain breathing 6 s; every period divides 60, so the
  // frame at FIRST_T + 60 equals the frame at FIRST_T.
  var FIRST_T = 12;
  var CYCLE = 60;
  var SEED = 862;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // ?format=<0|1|2> sets the live panel at load. Read at load only.
  var probeT = null;
  var probeFormat = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
    var mf = qs.match(/[?&]format=([012])/);
    if (mf) { probeFormat = parseInt(mf[1], 10); }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;
  var active = (probeFormat !== null) ? probeFormat : 0; // 0 super-8, 1 VHS, 2 camcorder

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function ellipsePath(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }

  // Palettes, one per format. No clean digital reference frame.
  var PAL = [
    { // 0 super-8: red and cream
      skyTop: [244, 226, 196], skyLow: [232, 178, 138],
      sandTop: [168, 74, 52], sandLow: [96, 36, 28],
      figure: [58, 18, 14], figureRim: [232, 90, 60],
      sun: [250, 238, 210], streak: [244, 210, 170],
      pool: [238, 200, 160], label: [244, 226, 196]
    },
    { // 1 VHS: pink-orange bloom, degraded color
      skyTop: [255, 176, 146], skyLow: [238, 128, 110],
      sandTop: [196, 104, 78], sandLow: [110, 48, 44],
      figure: [66, 24, 30], figureRim: [255, 120, 160],
      sun: [255, 190, 170], streak: [255, 170, 150],
      pool: [250, 170, 150], label: [255, 200, 180]
    },
    { // 2 camcorder: grey-green
      skyTop: [172, 182, 160], skyLow: [140, 150, 132],
      sandTop: [112, 122, 100], sandLow: [62, 70, 58],
      figure: [30, 36, 30], figureRim: [190, 200, 180],
      sun: [200, 208, 190], streak: [180, 188, 168],
      pool: [160, 170, 150], label: [210, 218, 200]
    }
  ];
  var PANEL_NAMES = ['SUPER-8', 'VHS', 'CAMCORDER'];
  var CREAM = [244, 226, 200];

  // ---- Fixed grain tables: 70 speckles per panel ------------------
  var grainRng = mulberry32(SEED * 17 + 3);
  var GRAIN = [];
  var gi;
  for (gi = 0; gi < 70; gi++) {
    GRAIN.push({
      x: grainRng(), y: grainRng(),
      r: 0.0012 + grainRng() * 0.0028,
      ph: grainRng() * Math.PI * 2,
      light: grainRng() > 0.5
    });
  }
  // ---- Fixed pool table: 3 still pools on the flat ----------------
  var poolRng = mulberry32(SEED * 23 + 7);
  var POOLS = [];
  var pi;
  for (pi = 0; pi < 3; pi++) {
    POOLS.push({
      x: 0.16 + pi * 0.32 + (poolRng() - 0.5) * 0.10,
      y: 0.78 + poolRng() * 0.12,
      rx: 0.09 + poolRng() * 0.06,
      ph: poolRng() * Math.PI * 2
    });
  }
  // ---- Fixed sand streak table ------------------------------------
  var streakRng = mulberry32(SEED * 31 + 11);
  var STREAKS = [];
  var si;
  for (si = 0; si < 9; si++) {
    STREAKS.push({
      x: 0.05 + streakRng() * 0.9,
      y: 0.46 + streakRng() * 0.48,
      len: 0.08 + streakRng() * 0.22,
      ph: streakRng() * Math.PI * 2
    });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.fsLabel = Math.round(clamp(W * 0.014, 9, 12));
    L.fsStamp = Math.round(clamp(W * 0.024, 13, 18));
    // Three stacked panels with a black hum band between them.
    L.panelTop = 0.095;
    L.panelH = 0.255;
    L.humGap = 0.0125;
    L.panelY = [
      L.panelTop,
      L.panelTop + L.panelH + L.humGap,
      L.panelTop + 2 * (L.panelH + L.humGap)
    ];
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function cycleU(t) {
    return (((t - FIRST_T) % CYCLE) + CYCLE) % CYCLE / CYCLE;
  }
  // The black-screen hum opener: a fixed-phase beat of the loop,
  // keyed to absolute cycle phase so FIRST_T is never inside it.
  // The image fades out to black in the last 3 s of each cycle and
  // fades back in over the first 3 s, the hum line holding the
  // black between. At FIRST_T the image is fully present, so the
  // first frame is deterministic and legible.
  function openerAlpha(t) {
    var p = (((t % CYCLE) + CYCLE) % CYCLE);
    if (p < 3) { return smooth(p / 3); }
    if (p >= 57) { return 1 - smooth((p - 57) / 3); }
    return 1;
  }
  // The walking figure crosses the flat once per cycle, entering
  // from the left already a third of the way in at FIRST_T.
  function figureX(t) {
    var u = cycleU(t);
    return -0.15 + 1.3 * ((u + 0.35) % 1);
  }
  // Stride: 2 s period, divides the 60 s cycle. Phase offset so
  // the legs are visibly apart at FIRST_T, a mid-stride pose.
  function legSwing(t) {
    return Math.sin(2 * Math.PI * (t - FIRST_T) / 2 + 1.1);
  }

  // ---- The walking figure, one base scene for all three panels ----
  // Drawn in panel-local coordinates: px,py is the panel origin,
  // pw,ph its size. s is the figure height in px.
  function drawFigure(px, py, pw, ph, t, P, alpha) {
    var gy = py + ph * 0.74; // ground line
    var fx = px + figureX(t) * pw;
    var s = ph * 0.52;
    var swing = legSwing(t);
    var lean = 0.03 * s;
    var hipX = fx, hipY = gy - s * 0.50;
    var shX = fx + lean, shY = gy - s * 0.86;
    var headX = fx + lean * 1.2, headY = gy - s * 0.95;
    var headR = s * 0.068;
    ctx.save();
    ctx.globalAlpha = a4(alpha);
    ctx.strokeStyle = rgb(P.figure);
    ctx.fillStyle = rgb(P.figure);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Legs: two-segment, swinging in opposite phase.
    var lw = Math.max(1.5, s * 0.048);
    ctx.lineWidth = lw;
    var fFootX = fx + swing * s * 0.26, fFootY = gy;
    var bFootX = fx - swing * s * 0.26, bFootY = gy;
    var fKneeX = fx + swing * s * 0.16, fKneeY = gy - s * 0.26;
    var bKneeX = fx - swing * s * 0.16, bKneeY = gy - s * 0.26;
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(fKneeX, fKneeY);
    ctx.lineTo(fFootX, fFootY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(bKneeX, bKneeY);
    ctx.lineTo(bFootX, bFootY);
    ctx.stroke();
    // Torso, a solid stroke with round caps so the figure reads
    // as a walking body, not a pole.
    ctx.lineWidth = Math.max(2, s * 0.085);
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(shX, shY);
    ctx.stroke();
    // Arms, swinging opposite to the legs.
    var armSwing = -swing;
    ctx.lineWidth = Math.max(1.25, s * 0.032);
    var fHandX = shX + armSwing * s * 0.16, fHandY = shY + s * 0.34;
    var bHandX = shX - armSwing * s * 0.16, bHandY = shY + s * 0.34;
    ctx.beginPath();
    ctx.moveTo(shX, shY);
    ctx.lineTo(shX + armSwing * s * 0.08, shY + s * 0.18);
    ctx.lineTo(fHandX, fHandY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(shX, shY);
    ctx.lineTo(shX - armSwing * s * 0.08, shY + s * 0.18);
    ctx.lineTo(bHandX, bHandY);
    ctx.stroke();
    // Head.
    circle(headX, headY, headR);
    ctx.fill();
    // Rim light on the lit side of head and torso.
    ctx.strokeStyle = rgba(P.figureRim, a4(0.6 * alpha));
    ctx.lineWidth = Math.max(1, s * 0.012);
    ctx.beginPath();
    ctx.moveTo(headX + headR * 0.5, headY - headR * 0.7);
    ctx.arc(headX, headY, headR, -Math.PI * 0.35, Math.PI * 0.35);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(shX + lw * 0.6, shY);
    ctx.lineTo(hipX + lw * 0.6, hipY);
    ctx.stroke();
    // Wet-sand reflection: the same stride, flattened and faint.
    ctx.globalAlpha = a4(0.16 * alpha);
    ctx.strokeStyle = rgb(P.figure);
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(fx, gy);
    ctx.lineTo(fx + swing * s * 0.10, gy + s * 0.22);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(fx, gy);
    ctx.lineTo(fx - swing * s * 0.10, gy + s * 0.22);
    ctx.stroke();
    ctx.restore();
  }

  // ---- Base scene: tidal flat, sky, sand, pools -------------------
  function drawScene(px, py, pw, ph, t, P) {
    // Sky.
    var sky = ctx.createLinearGradient(0, py, 0, py + ph * 0.38);
    sky.addColorStop(0, rgb(P.skyTop));
    sky.addColorStop(1, rgb(P.skyLow));
    ctx.fillStyle = sky;
    ctx.fillRect(px, py, pw, ph * 0.38);
    // Low sun, a pale disc on the horizon.
    ctx.fillStyle = rgba(P.sun, a4(0.85));
    circle(px + pw * 0.72, py + ph * 0.30, ph * 0.055);
    ctx.fill();
    // Wet sand.
    var sand = ctx.createLinearGradient(0, py + ph * 0.38, 0, py + ph);
    sand.addColorStop(0, rgb(P.sandTop));
    sand.addColorStop(1, rgb(P.sandLow));
    ctx.fillStyle = sand;
    ctx.fillRect(px, py + ph * 0.38, pw, ph * 0.62);
    // Horizon line.
    ctx.fillStyle = rgba(P.figure, a4(0.5));
    ctx.fillRect(px, py + ph * 0.38, pw, Math.max(1, ph * 0.006));
    // Still pools, catching the sky.
    var i, p;
    for (i = 0; i < POOLS.length; i++) {
      p = POOLS[i];
      var shimmer = 0.5 + 0.5 * Math.sin(2 * Math.PI * (t - FIRST_T) / 6 + p.ph);
      ctx.fillStyle = rgba(P.pool, a4(0.35 + 0.15 * shimmer));
      ellipsePath(px + p.x * pw, py + p.y * ph, p.rx * pw, ph * 0.018, 0);
      ctx.fill();
    }
    // Sand streaks, wet shine lines.
    ctx.strokeStyle = rgba(P.streak, a4(0.30));
    ctx.lineWidth = Math.max(1, ph * 0.006);
    for (i = 0; i < STREAKS.length; i++) {
      var st = STREAKS[i];
      var tw = 0.7 + 0.3 * Math.sin(2 * Math.PI * (t - FIRST_T) / 6 + st.ph);
      ctx.globalAlpha = a4(0.30 * tw);
      ctx.beginPath();
      ctx.moveTo(px + st.x * pw, py + st.y * ph);
      ctx.lineTo(px + (st.x + st.len) * pw, py + st.y * ph);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    drawFigure(px, py, pw, ph, t, P, 1);
  }

  // ---- Super-8 post: red light leak, tree silhouettes, grain -----
  function drawSuper8(px, py, pw, ph, t, P) {
    // Tree silhouettes at both edges, dark against the cream sky.
    // The left tree hugs the cropped edge so it never covers the
    // format label.
    ctx.fillStyle = rgba(P.figure, a4(0.92));
    var tx, ty, ti;
    // Left tree: trunk and a cluster of canopy blobs.
    ctx.fillRect(px + pw * 0.008, py + ph * 0.08, Math.max(1.5, pw * 0.006), ph * 0.30);
    var leftBlobs = [[0.012, 0.045], [0.028, 0.025], [0.004, 0.03], [0.02, 0.012]];
    for (ti = 0; ti < leftBlobs.length; ti++) {
      circle(px + leftBlobs[ti][0] * pw, py + leftBlobs[ti][1] * ph, ph * 0.045);
      ctx.fill();
    }
    // Right tree, taller, leaning in.
    ctx.fillRect(px + pw * 0.945, py + ph * 0.06, Math.max(1.5, pw * 0.006), ph * 0.34);
    var rightBlobs = [[0.95, 0.07], [0.925, 0.04], [0.972, 0.05], [0.94, 0.10]];
    for (ti = 0; ti < rightBlobs.length; ti++) {
      circle(px + rightBlobs[ti][0] * pw, py + rightBlobs[ti][1] * ph, ph * 0.06);
      ctx.fill();
    }
    // Red light leak from the top right corner.
    var leak = ctx.createRadialGradient(px + pw * 0.98, py, 0, px + pw * 0.98, py, pw * 0.75);
    leak.addColorStop(0, rgba([220, 40, 30], a4(0.62)));
    leak.addColorStop(0.5, rgba([220, 40, 30], a4(0.24)));
    leak.addColorStop(1, rgba([220, 40, 30], 0));
    ctx.fillStyle = leak;
    ctx.fillRect(px, py, pw, ph);
    // A vertical leak streak down the right side.
    var streak = ctx.createLinearGradient(px + pw * 0.86, 0, px + pw * 0.99, 0);
    streak.addColorStop(0, rgba([230, 60, 40], 0));
    streak.addColorStop(0.6, rgba([230, 60, 40], a4(0.18)));
    streak.addColorStop(1, rgba([230, 60, 40], a4(0.28)));
    ctx.fillStyle = streak;
    ctx.fillRect(px + pw * 0.86, py, pw * 0.13, ph);
    // Warm vignette, the film edge darkening.
    var vg = ctx.createRadialGradient(px + pw / 2, py + ph / 2, Math.min(pw, ph) * 0.35,
      px + pw / 2, py + ph / 2, Math.max(pw, ph) * 0.75);
    vg.addColorStop(0, rgba([40, 10, 8], 0));
    vg.addColorStop(1, rgba([40, 10, 8], a4(0.4)));
    ctx.fillStyle = vg;
    ctx.fillRect(px, py, pw, ph);
    drawGrain(px, py, pw, ph, t, [250, 235, 205], 0.35);
  }

  // ---- VHS post: scanlines, pink-orange bloom, tracking band ------
  function drawVHS(px, py, pw, ph, t, P) {
    // Bloom: a soft pink-orange wash over the whole panel.
    var bloom = ctx.createRadialGradient(px + pw * 0.5, py + ph * 0.42, 0,
      px + pw * 0.5, py + ph * 0.42, pw * 0.7);
    bloom.addColorStop(0, rgba([255, 120, 160], a4(0.22)));
    bloom.addColorStop(1, rgba([255, 120, 160], 0));
    ctx.fillStyle = bloom;
    ctx.fillRect(px, py, pw, ph);
    // Chromatic offset: the figure's rim redrawn a few pixels off
    // in pink, a degraded-color ghost of the walk.
    ctx.save();
    ctx.globalAlpha = a4(0.35);
    ctx.translate(2, 0);
    ctx.fillStyle = rgba([255, 90, 140], a4(0.5));
    var gy = py + ph * 0.74;
    var fx = px + figureX(t) * pw + 2;
    var s = ph * 0.52;
    circle(fx + s * 0.03, gy - s * 0.95, s * 0.068);
    ctx.fill();
    ctx.restore();
    // Tracking band: a pale horizontal band drifting down the panel
    // once per 30 s, with the image inside it slightly sheared.
    var bandU = (((t - FIRST_T) / 30) % 1 + 1) % 1;
    var bandY = py + bandU * ph * 0.9;
    ctx.fillStyle = rgba([255, 220, 210], a4(0.10));
    ctx.fillRect(px, bandY, pw, ph * 0.06);
    ctx.fillStyle = rgba([255, 220, 210], a4(0.16));
    ctx.fillRect(px, bandY, pw, Math.max(1, ph * 0.008));
    // Scanlines across the whole panel.
    ctx.fillStyle = rgba([20, 8, 12], a4(0.16));
    var y;
    for (y = py + 2; y < py + ph; y += 4) {
      ctx.fillRect(px, y, pw, 1);
    }
    // Degraded color: a washed, slightly lifted black.
    ctx.fillStyle = rgba([255, 150, 130], a4(0.06));
    ctx.fillRect(px, py, pw, ph);
    drawGrain(px, py, pw, ph, t, [255, 210, 200], 0.30);
  }

  // ---- Camcorder post: grey-green, interlace, date stamp ----------
  function drawCamcorder(px, py, pw, ph, t, P) {
    // Cool desaturating wash.
    ctx.fillStyle = rgba([120, 135, 115], a4(0.10));
    ctx.fillRect(px, py, pw, ph);
    // Interlace: faint alternate lines, coarser than VHS scanlines.
    ctx.fillStyle = rgba([10, 14, 10], a4(0.10));
    var y;
    for (y = py + 3; y < py + ph; y += 6) {
      ctx.fillRect(px, y, pw, 1);
    }
    drawGrain(px, py, pw, ph, t, [200, 208, 190], 0.22);
    // Date stamp, bottom right inside the panel: 24 8 18.
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba([245, 248, 240], a4(0.92));
    ctx.font = '700 ' + L.fsStamp + 'px "Courier New", Courier, monospace';
    ctx.fillText('24 8 18', px + pw - pw * 0.03, py + ph - ph * 0.06);
    ctx.textAlign = 'left';
  }

  // ---- Grain: fixed speckles breathing on a 6 s period -------------
  function drawGrain(px, py, pw, ph, t, col, base) {
    var i, g, ga;
    for (i = 0; i < GRAIN.length; i++) {
      g = GRAIN[i];
      ga = base * (0.5 + 0.5 * Math.sin(2 * Math.PI * (t - FIRST_T) / 6 + g.ph));
      if (g.light) {
        ctx.fillStyle = rgba(col, a4(ga));
      } else {
        ctx.fillStyle = rgba([10, 8, 8], a4(ga * 0.8));
      }
      ctx.fillRect(px + g.x * pw, py + g.y * ph, Math.max(1, g.r * pw), Math.max(1, g.r * pw));
    }
  }

  // ---- One panel: scene, format post, dimming, label --------------
  function drawPanel(idx, t) {
    var P = PAL[idx];
    var px = W * 0.04, py = H * L.panelY[idx];
    var pw = W * 0.92, ph = H * L.panelH;
    var isLive = (idx === active);
    drawScene(px, py, pw, ph, t, P);
    if (idx === 0) { drawSuper8(px, py, pw, ph, t, P); }
    else if (idx === 1) { drawVHS(px, py, pw, ph, t, P); }
    else { drawCamcorder(px, py, pw, ph, t, P); }
    // Quiet panels: dimmed and still, the live one full and vivid.
    if (!isLive) {
      ctx.fillStyle = rgba([5, 5, 5], a4(0.55));
      ctx.fillRect(px, py, pw, ph);
    }
    // Panel edge.
    ctx.strokeStyle = rgba(P.label, a4(isLive ? 0.55 : 0.30));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.strokeRect(px, py, pw, ph);
    // Format label, top left inside the panel.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(P.label, a4(isLive ? 0.95 : 0.55));
    ctx.font = '700 ' + L.fsLabel + 'px Georgia, "Times New Roman", serif';
    var label = PANEL_NAMES[idx] + (isLive ? '  LIVE' : '');
    // Format label, top left inside the panel, clear of the
    // super-8 tree at the cropped left edge.
    ctx.fillText(label, px + pw * 0.05, py + ph * 0.10);
    ctx.textAlign = 'left';
  }

  // ---- The hum: thin lines in the black between the panels --------
  function drawHum(t) {
    var i, y, wob;
    for (i = 0; i < 2; i++) {
      y = H * (L.panelY[i] + L.panelH + L.humGap / 2);
      wob = Math.sin(2 * Math.PI * (t - FIRST_T) / 10 + i * 1.3) * H * 0.0012;
      ctx.strokeStyle = rgba(CREAM, a4(0.28));
      ctx.lineWidth = Math.max(1, H * 0.0012);
      ctx.beginPath();
      ctx.moveTo(W * 0.04, y + wob);
      ctx.lineTo(W * 0.96, y + wob);
      ctx.stroke();
      // A fainter second line, the hum's harmonic.
      ctx.strokeStyle = rgba(CREAM, a4(0.10));
      ctx.beginPath();
      ctx.moveTo(W * 0.04, y + wob + H * 0.004);
      ctx.lineTo(W * 0.96, y + wob + H * 0.004);
      ctx.stroke();
    }
  }

  // ---- Caption and hint, in the template's place ----------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CREAM, a4(0.9));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№862 · Format Grain Archive', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CREAM, a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 22', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CREAM, a4(0.85));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Tap to change format.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var i;
    for (i = 0; i < 3; i++) { drawPanel(i, t); }
    drawHum(t);
    // The hum opener: image arriving from black at the cycle start.
    var oa = openerAlpha(t);
    if (oa < 1) {
      ctx.fillStyle = rgba([5, 5, 5], a4(1 - oa));
      ctx.fillRect(W * 0.04, H * L.panelTop, W * 0.92, H * (3 * L.panelH + 2 * L.humGap));
    }
    drawText();
  }

  // TAP steps through the formats; each carries its era's texture.
  function advanceFormat() {
    active = (active + 1) % 3;
    draw(lastT);
  }
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('click', advanceFormat);
    }
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece862 exposes the walk, the opener and the formats.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece862 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      active: function () { return active; },
      setFormat: function (n) { active = ((n % 3) + 3) % 3; draw(lastT); },
      advanceFormat: function () { advanceFormat(); },
      figureX: function (t) { return figureX(t); },
      legSwing: function (t) { return legSwing(t); },
      openerAlpha: function (t) { return openerAlpha(t); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 60 s cycle, closed-form. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
