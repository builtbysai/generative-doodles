<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightsaber Study</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var T0 = 33.0;              // fixed frame-one phase (seconds into the schedule)
  var TRAIL_SPAN = 6.0;       // ghost writing fades over ~6 s
  var STAMP_DT = 0.045;       // trail stamp cadence
  var BLACK = '#000000';
  var CORE = '#FFFFFF';
  var EDGE = '#6BD5FF';
  var GHOST = '#4A90B8';
  var SHIMMER = '#FFB347';

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- choreography schedule ----------
  // A phrase is 6-9 gestures. The schedule is generated sequentially from the
  // seed, so the beam state at any time t is a pure function of (seed, t).
  var seed = 1058219;
  var rng = null;
  var gestures = [];        // {type, t0, dur, a0, a1}
  var schedEnd = 0;
  var curAngle = 0;
  var gripP = null;         // seeded grip-wander parameters

  function easeInOut(u) {
    return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  }

  function addGesture() {
    var r = rng();
    var type;
    var prev = gestures.length ? gestures[gestures.length - 1].type : '';
    if (r < 0.34) type = 'CUT';
    else if (r < 0.58) type = 'SWEEP';
    else if (r < 0.82) type = 'HOLD';
    else type = 'REST';
    if (type === 'REST' && prev === 'REST') type = 'SWEEP';   // never two rests in a row
    if (type === 'HOLD' && prev === 'HOLD') type = 'CUT';

    var dur, delta;
    var dir = rng() < 0.5 ? -1 : 1;
    if (type === 'CUT') {
      dur = 0.35 + rng() * 0.18;                              // ~0.4 s fast arc
      delta = dir * (1.05 + rng() * 1.35);                    // 60-137 degrees
    } else if (type === 'SWEEP') {
      dur = 1.8 + rng() * 0.6;                                // ~2 s slow arc
      delta = dir * (0.7 + rng() * 1.05);                     // 40-100 degrees
    } else if (type === 'HOLD') {
      dur = 1.25 + rng() * 0.55;                              // ~1.5 s held pose
      delta = dir * (0.02 + rng() * 0.05);                    // nearly still
    } else { // REST
      dur = 0.85 + rng() * 0.55;
      delta = dir * (0.15 + rng() * 0.3);
    }
    gestures.push({ type: type, t0: schedEnd, dur: dur, a0: curAngle, a1: curAngle + delta });
    schedEnd += dur;
    curAngle += delta;
  }

  function buildSchedule(newSeed) {
    seed = newSeed;
    rng = mulberry32(seed);
    gestures = [];
    schedEnd = 0;
    curAngle = -0.7 + rng() * 1.1;
    gripP = {
      bx: 0.40 + rng() * 0.10,          // grip base, off-center
      by: 0.56 + rng() * 0.10,
      ax1: 0.030 + rng() * 0.030, wx1: 0.10 + rng() * 0.05, px1: rng() * 6.283,
      ax2: 0.016 + rng() * 0.020, wx2: 0.041 + rng() * 0.03, px2: rng() * 6.283,
      ay1: 0.024 + rng() * 0.024, wy1: 0.083 + rng() * 0.05, py1: rng() * 6.283,
      ay2: 0.012 + rng() * 0.016, wy2: 0.037 + rng() * 0.03, py2: rng() * 6.283
    };
    extendSchedule(T0 + 60);
  }

  function extendSchedule(until) {
    while (schedEnd < until) {
      var n = 6 + Math.floor(rng() * 4);   // phrase of 6-9 gestures
      for (var i = 0; i < n; i++) addGesture();
    }
  }

  function gestureAt(t) {
    if (t > schedEnd - 30) extendSchedule(t + 60);
    for (var i = 0; i < gestures.length; i++) {
      var g = gestures[i];
      if (t >= g.t0 && t < g.t0 + g.dur) return g;
    }
    return gestures[gestures.length - 1];
  }

  // Beam state at time t: {angle, lenF, alpha, hold}
  function stateAt(t) {
    var g = gestureAt(t);
    var u = (t - g.t0) / g.dur;
    if (u < 0) u = 0; if (u > 1) u = 1;
    var angle = g.a0 + (g.a1 - g.a0) * easeInOut(u);
    var lenF = 1, alpha = 1, hold = 0;
    if (g.type === 'HOLD') {
      hold = Math.sin(Math.PI * u);                            // shimmer envelope
      angle += 0.0087 * Math.sin(2 * Math.PI * 8 * (t - g.t0)); // 0.5 deg at ~8 Hz
    } else if (g.type === 'REST') {
      var k = Math.sin(Math.PI * Math.min(1, u * 1.15));
      lenF = 1 - 0.45 * k;                                     // lowered: shorter
      alpha = 1 - 0.62 * k;                                    // lowered: dimmer
    }
    return { angle: angle, lenF: lenF, alpha: alpha, hold: hold };
  }

  // Grip point in world space: fractions of a centered square of side min(W,H)
  function gripAt(t) {
    var x = gripP.bx + gripP.ax1 * Math.sin(gripP.wx1 * t + gripP.px1)
                     + gripP.ax2 * Math.sin(gripP.wx2 * t + gripP.px2);
    var y = gripP.by + gripP.ay1 * Math.sin(gripP.wy1 * t + gripP.py1)
                     + gripP.ay2 * Math.sin(gripP.wy2 * t + gripP.py2);
    return { x: x, y: y };
  }

  function worldScale() {
    var m = Math.min(W, H);
    return { m: m, ox: (W - m) / 2, oy: (H - m) / 2 };
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;   // aspect fallback only
  }

  function fit() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    if (vv && vv.width) { W = vv.width; H = vv.height; }
    else if (typeof window !== 'undefined' && window.innerWidth) { W = window.innerWidth; H = window.innerHeight; }
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(curT); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { fit(); draw(curT); });
    }
  }

  // ---------- drawing ----------
  function beamGeom(t) {
    var s = stateAt(t);
    var g = gripAt(t);
    var ws = worldScale();
    var m = ws.m;
    var gx = ws.ox + g.x * m, gy = ws.oy + g.y * m;
    var len = 0.80 * m * s.lenF;
    return {
      gx: gx, gy: gy,
      tx: gx + Math.cos(s.angle) * len,
      ty: gy + Math.sin(s.angle) * len,
      alpha: s.alpha, hold: s.hold
    };
  }

  function strokeBeam(b, coreA, edgeA, warmA) {
    ctx.lineCap = 'round';
    // layered halo (house rule: no gradients; halo is stacked strokes)
    var layers = [
      { w: 0.052, a: 0.05 },
      { w: 0.036, a: 0.08 },
      { w: 0.024, a: 0.13 },
      { w: 0.015, a: 0.22 }
    ];
    var m = Math.min(W, H);
    var i;
    ctx.strokeStyle = EDGE;
    for (i = 0; i < layers.length; i++) {
      ctx.globalAlpha = layers[i].a * edgeA;
      ctx.lineWidth = Math.max(1, layers[i].w * m);
      ctx.beginPath(); ctx.moveTo(b.gx, b.gy); ctx.lineTo(b.tx, b.ty); ctx.stroke();
    }
    if (warmA > 0.01) {
      ctx.strokeStyle = SHIMMER;
      ctx.globalAlpha = 0.13 * warmA;
      ctx.lineWidth = Math.max(1, 0.030 * m);
      ctx.beginPath(); ctx.moveTo(b.gx, b.gy); ctx.lineTo(b.tx, b.ty); ctx.stroke();
    }
    ctx.strokeStyle = CORE;
    ctx.globalAlpha = coreA;
    ctx.lineWidth = Math.max(1.2, 0.0075 * m);
    ctx.beginPath(); ctx.moveTo(b.gx, b.gy); ctx.lineTo(b.tx, b.ty); ctx.stroke();
    ctx.globalAlpha = coreA;
    ctx.lineWidth = Math.max(0.7, 0.0032 * m);
    ctx.beginPath(); ctx.moveTo(b.gx, b.gy); ctx.lineTo(b.tx, b.ty); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);

    // ghost writing: stamps sampled from the schedule's past, oldest first.
    // Each stamp is weighted by how far the beam actually moved since the
    // previous stamp, so held poses lay almost no ghost (no bright stacking)
    // and moving gestures lay even calligraphy.
    ctx.strokeStyle = GHOST;
    ctx.lineCap = 'round';
    var m = Math.min(W, H);
    ctx.lineWidth = Math.max(1, 0.005 * m);
    var prev = null;
    for (var age = TRAIL_SPAN; age >= STAMP_DT; age -= STAMP_DT) {
      var bt = t - age;
      if (bt < 0) continue;
      var b = beamGeom(bt);
      var moved = 1;
      if (prev) {
        var dx = b.tx - prev.tx, dy = b.ty - prev.ty;
        moved = Math.min(1, Math.sqrt(dx * dx + dy * dy) / (0.020 * m));
        if (moved < 0.05) moved = 0.05;
      }
      prev = b;
      var k = 1 - age / TRAIL_SPAN;
      ctx.globalAlpha = 0.26 * k * k * b.alpha * moved;
      ctx.beginPath(); ctx.moveTo(b.gx, b.gy); ctx.lineTo(b.tx, b.ty); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // the beam now
    var now = beamGeom(t);
    strokeBeam(now, now.alpha, now.alpha, now.hold);
  }

  // ---------- interaction: watch-only, double-tap reseeds ----------
  var curT = T0;
  var lastTapAt = -1e9;
  function reseed() {
    buildSchedule(seed + 7919);
    draw(curT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('dblclick', function () { reseed(); });
    canvas.addEventListener('pointerdown', function () {
      var now = curT;
      if (now - lastTapAt < 0.35) { lastTapAt = -1e9; reseed(); }
      else lastTapAt = now;
    });
  }

  // ---------- boot ----------
  buildSchedule(seed);
  fit();
  draw(T0);

  if (typeof requestAnimationFrame === 'function') {
    var startTs = null;
    var loop = function (ts) {
      if (startTs === null) startTs = ts;
      curT = T0 + (ts - startTs) / 1000;
      draw(curT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
