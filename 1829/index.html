<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duet Infiltration</title>
<style>
html, body { margin: 0; padding: 0; background: #0D0A0C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0D0A0C';
var STAGE = '#120D11';
var FLOOR = '#171118';
var STAGE_LIGHT = '#C4455A';
var STAGE_LIGHT_SOFT = '#D96A7A';
var VARNISH = '#7A4A26';
var VARNISH_HI = '#A9713F';
var VARNISH_DARK = '#4A2C15';
var STEEL = '#9AA3AD';
var STEEL_DIM = '#6E7680';
var GOLD = '#E8C97A';
var GOLD_PALE = '#F2DFA8';
var SILHOUETTE = '#1A1216';
var RIM = '#E0707F';
var PLATE = '#171013';
var PLATE_LINE = 'rgba(232,201,122,0.35)';
var TITLE_INK = '#F2EDE3';
var HINT_INK = '#D8C9B8';
var FRAME_T = 60;          /* fixed phase: t = 60 s, phrase position 12 s, cello playing */
var PHRASE = 24;           /* cello phrase cycle, seconds: plays 16 s, rests 8 s */
var PLAY_LEN = 16;
var PITCHES = [2, 3, 5, 3]; /* wire partials the cello line steps through, one per 4 s */
var CELLO_X = 0.72, CELLO_Y = 0.70;   /* cellist position, stage fractions */
var DRONE_X = 0.35, DRONE_Y = 0.35;   /* drone field heart, stage fractions */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, u) { return a + (b - a) * u; }
function smoothstep(a, b, x) {
  var u = clamp((x - a) / (b - a), 0, 1);
  return u * u * (3 - 2 * u);
}
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + Number(a).toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1829);
var phaseT = FRAME_T;
var listener = { x: 0.5, y: 0.5 };        /* fixed start: center, both voices audible */
var listenerTarget = { x: 0.5, y: 0.5 };
var dragging = false;
var soundOn = false;
var toggleRect = { x: 0, y: 0, w: 0, h: 0 };
/* ---- the Long String Instrument: six wires crossing the stage.
   ang: direction in radians, off: perpendicular offset from stage
   center in stage units, partial: overtone the wire carries. ---- */
var WIRES = [
  { ang: 0.62, off: -0.30, partial: 2, nearCello: false, phase: 0.4 },
  { ang: 0.62, off: -0.12, partial: 3, nearCello: false, phase: 1.7 },
  { ang: 0.62, off: 0.06, partial: 5, nearCello: true, phase: 2.9 },
  { ang: 0.62, off: 0.24, partial: 3, nearCello: true, phase: 4.2 },
  { ang: -0.55, off: -0.10, partial: 2, nearCello: false, phase: 5.1 },
  { ang: -0.55, off: 0.16, partial: 5, nearCello: true, phase: 0.9 }
];
/* seeded ripple character per wire: slow breathing speed and ripple count */
WIRES.forEach(function (w) {
  w.speed = 0.05 + rng() * 0.06;
  w.freq = 2 + Math.floor(rng() * 3);
  w.breathe = 0.6 + rng() * 0.5;
});
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* stage rect: full-bleed on phones, centered square on desktop */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function unit() { var r = stageRect(); return Math.min(r.w, r.h); }
function phrasePos(t) { return ((t % PHRASE) + PHRASE) % PHRASE; }
function isPlaying(t) { return phrasePos(t) < PLAY_LEN; }
function currentPartial(t) {
  if (!isPlaying(t)) return 0;
  return PITCHES[Math.floor(phrasePos(t) / 4) % PITCHES.length];
}
function playEnv(t) {
  var p = phrasePos(t);
  if (p >= PLAY_LEN) return 0;
  return smoothstep(0, 1.5, p) * (1 - smoothstep(PLAY_LEN - 1.5, PLAY_LEN, p));
}
/* squared falloff mix: listener walks between cello and drone field */
function mixAt(lx, ly) {
  var dc = Math.sqrt((lx - CELLO_X) * (lx - CELLO_X) + (ly - CELLO_Y) * (ly - CELLO_Y));
  var dw = Math.sqrt((lx - DRONE_X) * (lx - DRONE_X) + (ly - DRONE_Y) * (ly - DRONE_Y));
  var cello = clamp(1 - (dc / 0.7) * (dc / 0.7), 0, 1);
  var drone = clamp(1 - (dw / 0.7) * (dw / 0.7), 0, 1);
  return { cello: cello, drone: drone };
}
function channelGains(lx, ly) {
  var corners = [[0.07, 0.13], [0.93, 0.13], [0.07, 0.87], [0.93, 0.87]];
  return corners.map(function (c) {
    var d = Math.sqrt((lx - c[0]) * (lx - c[0]) + (ly - c[1]) * (ly - c[1]));
    return clamp(1 - d / 1.1, 0.05, 1);
  });
}
function wireEndpoints(w) {
  var r = stageRect();
  var cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  var dx = Math.cos(w.ang), dy = Math.sin(w.ang);
  var nx = -dy, ny = dx;
  var px = cx + nx * w.off * unit(), py = cy + ny * w.off * unit();
  var tmin = -1e9, tmax = 1e9, t1, t2;
  if (Math.abs(dx) > 1e-6) {
    t1 = (r.x - px) / dx; t2 = (r.x + r.w - px) / dx;
    tmin = Math.max(tmin, Math.min(t1, t2)); tmax = Math.min(tmax, Math.max(t1, t2));
  }
  if (Math.abs(dy) > 1e-6) {
    t1 = (r.y - py) / dy; t2 = (r.y + r.h - py) / dy;
    tmin = Math.max(tmin, Math.min(t1, t2)); tmax = Math.min(tmax, Math.max(t1, t2));
  }
  return { x0: px + dx * tmin, y0: py + dy * tmin, x1: px + dx * tmax, y1: py + dy * tmax, nx: nx, ny: ny, len: tmax - tmin };
}
function wireAlign(w, t, mix) {
  var env = playEnv(t);
  var target;
  if (isPlaying(t) && w.partial === currentPartial(t)) target = 1;
  else if (w.nearCello) target = 0.55;
  else target = 0.12;
  return lerp(0.10, target, env) * (0.35 + 0.65 * mix.drone);
}
function drawWire(w, t, mix) {
  var s = unit();
  var e = wireEndpoints(w);
  var align = wireAlign(w, t, mix);
  var breathe = 0.75 + 0.25 * Math.sin(t * w.speed * TAU + w.phase) * w.breathe;
  var amp = (0.004 + 0.010 * align) * s * breathe;
  var segs = 48, i, u, px, py, disp;
  /* gold glow pass under the wire when it aligns with the cello line */
  if (align > 0.25) {
    ctx.beginPath();
    for (i = 0; i <= segs; i++) {
      u = i / segs;
      disp = amp * Math.sin(TAU * (u * w.freq - t * w.speed) + w.phase);
      px = lerp(e.x0, e.x1, u) + e.nx * disp;
      py = lerp(e.y0, e.y1, u) + e.ny * disp;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = rgba(GOLD, 0.10 + 0.45 * align);
    ctx.lineWidth = Math.max(s * 0.014, 3);
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  /* steel core */
  ctx.beginPath();
  for (i = 0; i <= segs; i++) {
    u = i / segs;
    disp = amp * Math.sin(TAU * (u * w.freq - t * w.speed) + w.phase);
    px = lerp(e.x0, e.x1, u) + e.nx * disp;
    py = lerp(e.y0, e.y1, u) + e.ny * disp;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.strokeStyle = align > 0.5 ? rgba(GOLD_PALE, 0.55 + 0.35 * align) : rgba(STEEL, 0.55 + 0.25 * align);
  ctx.lineWidth = Math.max(s * 0.0022, 1);
  ctx.lineCap = 'round';
  ctx.stroke();
}
function drawSpeaker(x, y, gain) {
  var s = unit();
  var a = 0.25 + 0.75 * gain;
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = rgba(gain > 0.6 ? GOLD : STEEL, a.toFixed(4));
  ctx.lineWidth = Math.max(s * 0.002, 1);
  ctx.strokeRect(-s * 0.014, -s * 0.014, s * 0.028, s * 0.028);
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.006, 0, TAU);
  ctx.fillStyle = rgba(gain > 0.6 ? GOLD : STEEL, a.toFixed(4));
  ctx.fill();
  var k;
  for (k = 1; k <= 2; k++) {
    ctx.beginPath();
    ctx.arc(0, 0, s * (0.011 + k * 0.009), -Math.PI * 0.35, Math.PI * 0.35);
    ctx.strokeStyle = rgba(gain > 0.6 ? GOLD : STEEL, (a * (0.7 - k * 0.2)).toFixed(4));
    ctx.stroke();
  }
  ctx.restore();
}
function drawCellist(t, mix) {
  var r = stageRect();
  var s = unit();
  var cx = r.x + CELLO_X * r.w;
  var cy = r.y + CELLO_Y * r.h;
  var playing = isPlaying(t);
  var celloLight = 0.30 + 0.70 * mix.cello;
  var env = playEnv(t);
  /* the figure reads small on a tall phone stage, so scale it up there */
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(isPhone ? 1.3 : 1, isPhone ? 1.3 : 1);
  ctx.translate(-cx, -cy);
  /* warm pool of stage light around the cellist, stronger near the cello */
  var pool = ctx.createRadialGradient(cx, cy, 0, cx, cy, s * 0.30);
  pool.addColorStop(0, rgba(STAGE_LIGHT, (0.16 * celloLight).toFixed(4)));
  pool.addColorStop(1, rgba(STAGE_LIGHT, 0));
  ctx.fillStyle = pool;
  ctx.fillRect(cx - s * 0.30, cy - s * 0.30, s * 0.60, s * 0.60);
  /* stool */
  ctx.strokeStyle = rgba(STEEL_DIM, 0.8);
  ctx.lineWidth = Math.max(s * 0.003, 1);
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.028, cy + s * 0.105);
  ctx.lineTo(cx + s * 0.028, cy + s * 0.105);
  ctx.moveTo(cx - s * 0.020, cy + s * 0.105);
  ctx.lineTo(cx - s * 0.026, cy + s * 0.155);
  ctx.moveTo(cx + s * 0.020, cy + s * 0.105);
  ctx.lineTo(cx + s * 0.026, cy + s * 0.155);
  ctx.stroke();
  /* seated legs: thigh forward, shin down to the floor */
  ctx.strokeStyle = SILHOUETTE;
  ctx.lineCap = 'round';
  ctx.lineWidth = s * 0.017;
  ctx.beginPath();
  ctx.moveTo(cx + s * 0.005, cy + s * 0.075);
  ctx.lineTo(cx - s * 0.055, cy + s * 0.095);
  ctx.lineTo(cx - s * 0.058, cy + s * 0.155);
  ctx.stroke();
  /* cello body: lower and upper bouts, tilted toward the player */
  var bx = cx - s * 0.088, by = cy + s * 0.045;
  var tilt = -0.32;
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(tilt);
  ctx.globalAlpha = 0.55 + 0.45 * celloLight;
  ctx.beginPath();
  ctx.ellipse(0, s * 0.028, s * 0.046, s * 0.056, 0, 0, TAU);
  ctx.fillStyle = VARNISH;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.038, s * 0.035, s * 0.043, 0, 0, TAU);
  ctx.fillStyle = VARNISH;
  ctx.fill();
  /* varnish highlight down the body */
  ctx.beginPath();
  ctx.ellipse(-s * 0.012, s * 0.020, s * 0.016, s * 0.045, 0.08, 0, TAU);
  ctx.fillStyle = rgba(VARNISH_HI, 0.55);
  ctx.fill();
  /* dark outline and waist */
  ctx.beginPath();
  ctx.ellipse(0, s * 0.028, s * 0.046, s * 0.056, 0, 0, TAU);
  ctx.strokeStyle = VARNISH_DARK;
  ctx.lineWidth = Math.max(s * 0.002, 1);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.038, s * 0.035, s * 0.043, 0, 0, TAU);
  ctx.stroke();
  /* fingerboard and neck up to the scroll */
  ctx.fillStyle = '#241A12';
  ctx.fillRect(-s * 0.006, -s * 0.155, s * 0.012, s * 0.085);
  ctx.beginPath();
  ctx.arc(0, -s * 0.160, s * 0.009, 0, TAU);
  ctx.fillStyle = VARNISH_DARK;
  ctx.fill();
  /* strings along the body */
  ctx.strokeStyle = rgba(GOLD_PALE, (0.35 + 0.45 * celloLight).toFixed(4));
  ctx.lineWidth = Math.max(s * 0.0012, 0.6);
  var si;
  for (si = -1; si <= 1; si++) {
    ctx.beginPath();
    ctx.moveTo(si * s * 0.004, -s * 0.150);
    ctx.lineTo(si * s * 0.006, s * 0.075);
    ctx.stroke();
  }
  /* bridge */
  ctx.strokeStyle = VARNISH_DARK;
  ctx.lineWidth = Math.max(s * 0.002, 1);
  ctx.beginPath();
  ctx.moveTo(-s * 0.022, s * 0.012);
  ctx.lineTo(s * 0.022, s * 0.012);
  ctx.stroke();
  ctx.restore();
  /* torso, leaning into the cello */
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.028, cy + s * 0.100);
  ctx.lineTo(cx - s * 0.034, cy - s * 0.030);
  ctx.lineTo(cx - s * 0.006, cy - s * 0.062);
  ctx.lineTo(cx + s * 0.022, cy - s * 0.052);
  ctx.lineTo(cx + s * 0.026, cy + s * 0.100);
  ctx.closePath();
  ctx.fillStyle = SILHOUETTE;
  ctx.fill();
  /* pink-red rim light on the player's right edge */
  ctx.beginPath();
  ctx.moveTo(cx + s * 0.022, cy - s * 0.052);
  ctx.lineTo(cx + s * 0.026, cy + s * 0.100);
  ctx.strokeStyle = rgba(RIM, (0.35 + 0.55 * celloLight).toFixed(4));
  ctx.lineWidth = Math.max(s * 0.0025, 1);
  ctx.stroke();
  /* head, bowed slightly toward the strings */
  ctx.beginPath();
  ctx.arc(cx - s * 0.014, cy - s * 0.088, s * 0.024, 0, TAU);
  ctx.fillStyle = SILHOUETTE;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx - s * 0.014, cy - s * 0.088, s * 0.024, Math.PI * 0.95, Math.PI * 1.95);
  ctx.strokeStyle = rgba(RIM, (0.30 + 0.5 * celloLight).toFixed(4));
  ctx.lineWidth = Math.max(s * 0.002, 1);
  ctx.stroke();
  /* left arm reaching to the neck */
  ctx.strokeStyle = SILHOUETTE;
  ctx.lineCap = 'round';
  ctx.lineWidth = s * 0.013;
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.018, cy - s * 0.045);
  ctx.lineTo(bx + s * 0.012, by - s * 0.125);
  ctx.stroke();
  /* bow arm and bow: slow strokes while playing, bow lowered at rest */
  var stroke = playing ? Math.sin(t * TAU * 0.18 + 0.6) : -0.85;
  var bowBase = 0.28 + 0.10 * stroke * env + (playing ? 0 : -0.22);
  var hx = cx - s * 0.030, hy = cy - s * 0.010;
  var bowTipX = bx + s * 0.055 + Math.cos(bowBase) * s * 0.075;
  var bowTipY = by + s * 0.020 + Math.sin(bowBase) * s * 0.075;
  ctx.beginPath();
  ctx.moveTo(cx + s * 0.016, cy - s * 0.040);
  ctx.lineTo(hx, hy);
  ctx.strokeStyle = SILHOUETTE;
  ctx.lineWidth = s * 0.013;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(bowTipX, bowTipY);
  ctx.strokeStyle = rgba(GOLD_PALE, (0.5 + 0.4 * celloLight).toFixed(4));
  ctx.lineWidth = Math.max(s * 0.0018, 0.8);
  ctx.stroke();
  /* bow hair line */
  ctx.beginPath();
  ctx.moveTo(hx + s * 0.004, hy + s * 0.004);
  ctx.lineTo(bowTipX + s * 0.004, bowTipY + s * 0.004);
  ctx.strokeStyle = rgba(STEEL, 0.5);
  ctx.lineWidth = Math.max(s * 0.001, 0.6);
  ctx.stroke();
  ctx.restore();
}
function drawListener() {
  var r = stageRect();
  var s = unit();
  var x = r.x + listener.x * r.w;
  var y = r.y + listener.y * r.h;
  ctx.beginPath();
  ctx.arc(x, y, s * 0.030, 0, TAU);
  ctx.fillStyle = rgba(GOLD, 0.10);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y, s * 0.012, 0, TAU);
  ctx.strokeStyle = rgba(GOLD_PALE, 0.95);
  ctx.lineWidth = Math.max(s * 0.002, 1);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, s * 0.0035, 0, TAU);
  ctx.fillStyle = GOLD_PALE;
  ctx.fill();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Duet Infiltration').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Duet Infiltration').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 14').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Duet Infiltration', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 14', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to move through the room.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  var sndW = ctx.measureText(snd).width;
  var sndPlateW = sndW + 24;
  var sndPlateH = smallPx + 14;
  var sndPlateX = VW - sndPlateW - 12;
  var sndPlateY = VH - sndPlateH - 12;
  toggleRect = { x: sndPlateX, y: sndPlateY, w: sndPlateW, h: sndPlateH };
  ctx.fillStyle = PLATE;
  ctx.fillRect(sndPlateX, sndPlateY, sndPlateW, sndPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(sndPlateX + 0.5, sndPlateY + 0.5, sndPlateW - 1, sndPlateH - 1);
  ctx.fillStyle = soundOn ? GOLD_PALE : HINT_INK;
  ctx.fillText(snd, sndPlateX + 12, sndPlateY + 7);
}
function draw() {
  size();
  var r = stageRect();
  var s = unit();
  var t = phaseT;
  /* listener eases toward its drag target */
  listener.x = lerp(listener.x, listenerTarget.x, 0.12);
  listener.y = lerp(listener.y, listenerTarget.y, 0.12);
  var mix = mixAt(listener.x, listener.y);
  var gains = channelGains(listener.x, listener.y);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* stage floor */
  ctx.fillStyle = STAGE;
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = FLOOR;
  ctx.fillRect(r.x, r.y + r.h * 0.86, r.w, r.h * 0.14);
  /* pink-red stage light wash from above */
  var wash = ctx.createRadialGradient(r.x + r.w * 0.30, r.y + r.h * 0.10, 0, r.x + r.w * 0.30, r.y + r.h * 0.10, Math.max(r.w, r.h) * 0.75);
  wash.addColorStop(0, rgba(STAGE_LIGHT, 0.20));
  wash.addColorStop(0.55, rgba(STAGE_LIGHT_SOFT, 0.06));
  wash.addColorStop(1, rgba(STAGE_LIGHT, 0));
  ctx.fillStyle = wash;
  ctx.fillRect(r.x, r.y, r.w, r.h);
  /* horizon line where the stage meets the floor */
  ctx.fillStyle = rgba(STEEL, 0.12);
  ctx.fillRect(r.x, r.y + r.h * 0.86, r.w, Math.max(s * 0.002, 1));
  /* the crossing wires, drawn under the cellist */
