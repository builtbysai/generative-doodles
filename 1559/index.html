<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Flock's Wake</title>
<style>
html, body { margin: 0; padding: 0; background: #EFEFEF; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BG = [239, 239, 239];
var INK = [26, 26, 26];
var NB = 320;
var NG = 5;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(1559000);
/* Stream groups: each drifts on its own slow Lissajous path; boids in a group
   share that drift, so neighbours stream together and turn together. */
var G = [];
for (var gi = 0; gi < NG; gi++) {
  G.push({
    axF: 0.06 + rng() * 0.06,
    ayF: 0.05 + rng() * 0.05,
    wx: TAU / (40 + rng() * 60),
    wy: TAU / (45 + rng() * 70),
    px: rng() * TAU,
    py: rng() * TAU
  });
}
/* Mover wander: closed-form layered sines, never shown, never accumulated. */
var MV = {
  x: [{ a: 0.20, w: TAU / 47, p: 1.3 }, { a: 0.09, w: TAU / 83, p: 4.1 }, { a: 0.05, w: TAU / 131, p: 2.2 }],
  y: [{ a: 0.16, w: TAU / 59, p: 5.0 }, { a: 0.08, w: TAU / 97, p: 0.6 }, { a: 0.04, w: TAU / 149, p: 3.3 }]
};
function wander(t) {
  var x = 0.5 * VW, y = 0.5 * VH;
  for (var i = 0; i < 3; i++) {
    x += MV.x[i].a * VW * Math.sin(MV.x[i].w * t + MV.x[i].p);
    y += MV.y[i].a * VH * Math.sin(MV.y[i].w * t + MV.y[i].p);
  }
  return { x: x, y: y };
}
/* Boids: seeded homes on a jittered grid so the flock covers the whole field.
   Position is a closed-form function of piece time: home + group drift + bob. */
var COLS = 20, ROWS = 16;
var B = [];
for (var bi = 0; bi < NB; bi++) {
  var col = bi % COLS, row = Math.floor(bi / COLS);
  B.push({
    g: Math.floor(rng() * NG),
    hxF: 0.04 + 0.92 * (col + 0.2 + rng() * 0.6) / COLS,
    hyF: 0.04 + 0.92 * (row + 0.2 + rng() * 0.6) / ROWS,
    dT: (rng() * 2 - 1) * 4,
    bobP: 4 + rng() * 10,
    bobA: 3 + rng() * 6,
    bobW: TAU / (5 + rng() * 9),
    bobPh: rng() * TAU,
    bobPh2: rng() * TAU,
    len: 7 + rng() * 6,
    lw: 1.4 + rng() * 0.8
  });
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var presses = [];
var activePress = null;
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width; sh = window.screen.height; }
  if (sw && sh) {
    if (Math.min(sw, sh) < 700) return true;
    if (VH > VW * 1.15) return true;
  }
  return VH > VW * 1.15;
}
function groupDrift(g, t) {
  var gr = G[g];
  return {
    x: gr.axF * VW * Math.sin(gr.wx * t + gr.px),
    y: gr.ayF * VH * Math.sin(gr.wy * t + gr.py)
  };
}
function groupVel(g, t) {
  var gr = G[g];
  return {
    x: gr.axF * VW * gr.wx * Math.cos(gr.wx * t + gr.px),
    y: gr.ayF * VH * gr.wy * Math.cos(gr.wy * t + gr.py)
  };
}
function moverAtPress(pr, t) {
  var base = wander(pr.tDown);
  var tgt = pr.samples[0];
  for (var i = 0; i < pr.samples.length; i++) {
    if (pr.samples[i].t <= t) tgt = pr.samples[i];
  }
  var k = 1 - Math.exp(-(t - pr.tDown) / 0.5);
  return { x: base.x + (tgt.x - base.x) * k, y: base.y + (tgt.y - base.y) * k };
}
function moverPos(t) {
  var pr = null;
  for (var i = 0; i < presses.length; i++) {
    if (presses[i].tDown <= t) pr = presses[i];
  }
  if (!pr) return wander(t);
  if (pr.tUp === null || t < pr.tUp) return moverAtPress(pr, t);
  var rel = moverAtPress(pr, pr.tUp);
  var wUp = wander(pr.tUp);
  var w = wander(t);
  var d = Math.exp(-(t - pr.tUp) / 2.0);
  return { x: w.x + (rel.x - wUp.x) * d, y: w.y + (rel.y - wUp.y) * d };
}
function boidBase(b, t) {
  var tt = t + b.dT;
  var dr = groupDrift(b.g, tt);
  var gv = groupVel(b.g, tt);
  var sp = Math.sqrt(gv.x * gv.x + gv.y * gv.y);
  var dx = 1, dy = 0, px = 0, py = 1;
  if (sp > 1e-6) { dx = gv.x / sp; dy = gv.y / sp; px = -dy; py = dx; }
  var bp = b.bobP * Math.sin(b.bobW * t + b.bobPh);
  var ba = b.bobA * Math.sin(b.bobW * 1.7 * t + b.bobPh2);
  return {
    x: b.hxF * VW + dr.x + px * bp + dx * ba,
    y: b.hyF * VH + dr.y + py * bp + dy * ba
  };
}
function boidPos(b, t, mv) {
  var p = boidBase(b, t);
  var dx = p.x - mv.x, dy = p.y - mv.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  var R = Math.max(70, 0.11 * Math.min(VW, VH));
  if (d < R && d > 1e-6) {
    var push = R - d;
    p = { x: p.x + (dx / d) * push, y: p.y + (dy / d) * push };
  } else if (d <= 1e-6) {
    p = { x: p.x + R, y: p.y };
  }
  var m = 48, f = 0.6;
  if (p.x < m) p.x = p.x + (m - p.x) * f;
  if (p.x > VW - m) p.x = p.x - (p.x - (VW - m)) * f;
  if (p.y < m) p.y = p.y + (m - p.y) * f;
  if (p.y > VH - m) p.y = p.y - (p.y - (VH - m)) * f;
  return p;
}
function publishHook(mv) {
  if (typeof window !== 'undefined') {
    window.__p1559 = {
      mover: { x: mv.x, y: mv.y },
      count: NB, groups: NG,
      pressing: activePress !== null,
      w: VW, h: VH
    };
  }
}
function draw(t) {
  lastT = t;
  size();
  var mv = moverPos(t);
  var phone = isPhone();
  var sc = phone ? Math.max(0.85, Math.min(VW, VH) / 560) : Math.max(0.7, Math.min(1.25, Math.min(VW, VH) / 800));
  ctx.fillStyle = rgb(BG);
  ctx.fillRect(0, 0, VW, VH);
  ctx.strokeStyle = rgb(INK);
  ctx.lineCap = 'round';
  for (var i = 0; i < NB; i++) {
    var b = B[i];
    var p = boidPos(b, t, mv);
    var q = boidPos(b, t + 0.06, moverPos(t + 0.06));
    var ang = Math.atan2(q.y - p.y, q.x - p.x);
    var hl = (b.len * sc) / 2;
    var cdx = Math.cos(ang), cdy = Math.sin(ang);
    ctx.lineWidth = b.lw * sc;
    ctx.beginPath();
    ctx.moveTo(p.x - cdx * hl, p.y - cdy * hl);
    ctx.lineTo(p.x + cdx * hl, p.y + cdy * hl);
    ctx.stroke();
  }
  publishHook(mv);
}
function onDown(e) {
  var pr = { tDown: lastT, samples: [{ t: lastT, x: e.clientX, y: e.clientY }], tUp: null };
  presses.push(pr);
  if (presses.length > 8) presses.shift();
  activePress = pr;
  publishHook(moverPos(lastT));
}
function onMove(e) {
  if (!activePress) return;
  var s = activePress.samples;
  var last = s[s.length - 1];
  if (Math.abs(e.clientX - last.x) > 2 || Math.abs(e.clientY - last.y) > 2) {
    s.push({ t: lastT, x: e.clientX, y: e.clientY });
    if (s.length > 200) s.shift();
  }
  publishHook(moverPos(lastT));
}
function onUp(e) {
  if (!activePress) return;
  activePress.samples.push({ t: lastT, x: e.clientX, y: e.clientY });
  activePress.tUp = lastT;
  activePress = null;
  publishHook(moverPos(lastT));
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
