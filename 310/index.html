<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.310 Tower of Chance</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1E1B17; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.310 Tower of Chance (Xanthe Caesia).
// A stacked clay wizard tower: exactly 7 shrinking stone
// courses with glowing slit windows, a carved door at the
// base, backflow smoke at the chimney and mist pooling at
// the foot. Exactly 3 bone dice rest at its foot at frame
// one, one mid-rest at the door. Drag a die into the roof
// mouth and it tumbles down one hidden spiral path with
// physics-eased bounces, rolls out the door and settles on
// the next face from an authored seeded roll sequence,
// never a runtime random pick. A die dropped short eases back to the
// foot. Tap the chimney for a backflow pulse: smoke goes
// down and mist seeps from the seams for one pulse, then
// the rise resumes. Fixed seeds throughout.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var STONE = '#6B625A', MORTAR = '#3E3833', AMBER = '#F2B45C';
var SMOKE = '#B9BFC2', MIST = '#8E969B', BONE = '#EFE8D8', GROUND = '#1E1B17';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 3.4, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, u) { return a + (b - a) * u; }
function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
function oval(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }

// ---- tower courses ---------------------------------------------------
// Exactly 7 courses, bottom first. Widths shrink per course.
var BASE_Y = 792, COURSE_H = 84, CX = 640;
var COURSES = [];
(function () {
  for (var i = 0; i < 7; i++) {
    var wB = lerp(400, 218, i / 7), wT = lerp(400, 218, (i + 1) / 7) - 16;
    COURSES.push({
      yB: BASE_Y - i * COURSE_H, yT: BASE_Y - (i + 1) * COURSE_H,
      wB: wB, wT: wT, jit: [3, -4, 2, -2, 4, -3, 1][i]
    });
  }
})();
if (COURSES.length !== 7) throw new Error('Tower of Chance needs exactly 7 courses');
var ROOF_Y = BASE_Y - 7 * COURSE_H; // 204
var MOUTH = { x: CX, y: ROOF_Y - 60 };
var CHIMNEY = { x: CX + 92, y: ROOF_Y - 86, w: 34, h: 74 };
var DOOR = { x: CX, y: BASE_Y, w: 78, h: 118 };

// Seeded slit windows per course (bottom to top): offsets in
// course-local units, 1 or 2 per course.
var WINDOWS = [
  [{ dx: -118, w: 11 }, { dx: 112, w: 11 }],
  [{ dx: -78, w: 10 }],
  [{ dx: 86, w: 11 }, { dx: -132, w: 9 }],
  [{ dx: -52, w: 10 }],
  [{ dx: 62, w: 10 }, { dx: -98, w: 9 }],
  [{ dx: -34, w: 9 }],
  [{ dx: 40, w: 9 }]
];
if (WINDOWS.length !== 7) throw new Error('Tower of Chance needs windows for 7 courses');
// Seeded surface speckles per course.
var SPECKS = [
  [-150, -60, 40, 130], [-90, 20, 110], [-120, -20, 70, 140],
  [-80, 30, 100], [-100, -40, 60], [-60, 20, 80], [-50, 10, 55]
];

// ---- dice --------------------------------------------------------------
// Authored seeded roll sequence. Settle faces are taken in
// order from this list, never from a runtime random pick.
var ROLL_SEQ = [5, 2, 6, 3, 1, 4, 5, 3, 6, 2, 4, 1];
var rollIdx = 0;
var DICE = [
  { x: 452, y: 800, homeX: 452, homeY: 800, rot: 0.22, face: 3, size: 48, state: 'rest', t: 0 },
  { x: 522, y: 822, homeX: 522, homeY: 822, rot: -0.30, face: 5, size: 52, state: 'rest', t: 0 },
  { x: 668, y: 800, homeX: 668, homeY: 800, rot: -0.10, face: 2, size: 46, state: 'rest', t: 0 }
];
if (DICE.length !== 3) throw new Error('Tower of Chance needs exactly 3 dice');
// Hidden spiral path inside the tower, mouth to door.
var SPIRAL = [
  [CX, MOUTH.y + 10], [CX - 88, ROOF_Y + 46], [CX + 82, ROOF_Y + 128],
  [CX - 74, ROOF_Y + 216], [CX + 66, ROOF_Y + 300], [CX - 52, ROOF_Y + 384],
  [CX + 36, ROOF_Y + 462], [CX, BASE_Y - 96]
];
function spiralPos(u, out) {
  var seg = clamp(u, 0, 0.999) * (SPIRAL.length - 1);
  var i = Math.floor(seg), f = seg - i;
  var bounce = Math.abs(Math.sin(f * Math.PI)) * 10 * (1 - u * 0.5);
  out.x = lerp(SPIRAL[i][0], SPIRAL[i + 1][0], smooth(f));
  out.y = lerp(SPIRAL[i][1], SPIRAL[i + 1][1], f * f * (3 - 2 * f)) - bounce * 0.35;
  return out;
}
var PIPS = {
  1: [[0, 0]],
  2: [[-0.26, -0.26], [0.26, 0.26]],
  3: [[-0.28, -0.28], [0, 0], [0.28, 0.28]],
  4: [[-0.26, -0.26], [0.26, -0.26], [-0.26, 0.26], [0.26, 0.26]],
  5: [[-0.27, -0.27], [0.27, -0.27], [0, 0], [-0.27, 0.27], [0.27, 0.27]],
  6: [[-0.26, -0.30], [0.26, -0.30], [-0.26, 0], [0.26, 0], [-0.26, 0.30], [0.26, 0.30]]
};
function drawDie(d) {
  ctx.save();
  ctx.translate(d.x, d.y); ctx.rotate(d.rot);
  var s = d.size, h = s / 2;
  // flat tumbling polygon: a bone square with a facet diagonal
  ctx.beginPath();
  ctx.moveTo(-h + 5, -h); ctx.lineTo(h - 5, -h); ctx.quadraticCurveTo(h, -h, h, -h + 5);
  ctx.lineTo(h, h - 5); ctx.quadraticCurveTo(h, h, h - 5, h);
  ctx.lineTo(-h + 5, h); ctx.quadraticCurveTo(-h, h, -h, h - 5);
  ctx.lineTo(-h, -h + 5); ctx.quadraticCurveTo(-h, -h, -h + 5, -h);
  ctx.closePath();
  ctx.fillStyle = BONE; ctx.fill();
  ctx.strokeStyle = MORTAR; ctx.lineWidth = 2.6; ctx.lineJoin = 'round'; ctx.stroke();
  // one facet crease in a top corner only, no numerals
  ctx.strokeStyle = MORTAR; ctx.lineWidth = 1.3; ctx.globalAlpha = 0.4;
  ctx.beginPath(); ctx.moveTo(h - 13, -h); ctx.lineTo(h, -h + 13); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-h, h - 11); ctx.lineTo(-h + 11, h); ctx.stroke();
  ctx.globalAlpha = 1;
  var pips = PIPS[d.face], i;
  ctx.fillStyle = MORTAR;
  for (i = 0; i < pips.length; i++) { oval(pips[i][0] * s, pips[i][1] * s, s * 0.075, s * 0.075); ctx.fill(); }
  ctx.restore();
}

// ---- smoke and mist ------------------------------------------------------
// Pooled smoke puffs, deterministic functions of time.
var PUFFS = [];
(function () {
  for (var i = 0; i < 26; i++) PUFFS.push({ ph: i / 26, sway: (i % 5 - 2) * 9, r: 11 + (i % 4) * 5 });
})();
if (PUFFS.length !== 26) throw new Error('Tower of Chance needs exactly 26 smoke puffs');
var smokeBoost = 0, backflow = 0; // timers in seconds remaining

function drawSmoke(t) {
  var thick = smokeBoost > 0 ? 1.7 : 1;
  var i, p, u, x, y;
  if (backflow > 0) {
    // backflow: puffs wick DOWN the chimney side
    var bf = 1 - backflow / 1.6;
    for (i = 0; i < 12; i++) {
      p = PUFFS[i];
      u = (p.ph + bf * 0.9) % 1;
      x = CHIMNEY.x + CHIMNEY.w + 10 + Math.sin(u * 5 + i) * 6;
      y = lerp(CHIMNEY.y - 6, ROOF_Y + 36, u);
      ctx.globalAlpha = 0.34 * (1 - u * 0.4);
      oval(x, y, p.r * 0.8, p.r * 0.62); ctx.fillStyle = SMOKE; ctx.fill();
    }
    ctx.globalAlpha = 1;
    return;
  }
  for (i = 0; i < PUFFS.length; i++) {
    p = PUFFS[i];
    u = (p.ph + t * 0.055) % 1;
    x = CHIMNEY.x + 17 + p.sway * u + Math.sin(u * 7 + i * 1.7) * 12 * u - 22 * u * u;
    y = lerp(CHIMNEY.y - 8, CHIMNEY.y - 104, u);
    ctx.globalAlpha = Math.min(0.34, (0.07 + 0.17 * (1 - Math.abs(u - 0.35))) * thick);
    oval(x, y, p.r * (0.65 + u * 0.95) * (thick > 1 ? 1.25 : 1), p.r * 0.68 * (0.65 + u * 0.85));
    ctx.fillStyle = SMOKE; ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawMist(t) {
  var breathe = 0.5 + 0.5 * Math.sin(t * 0.45);
  var seamA = backflow > 0 ? 0.38 : 0.0;
  var i;
  // seam seep on the backflow envelope, at course joins
  if (seamA > 0) {
    ctx.strokeStyle = MIST; ctx.lineWidth = 7; ctx.lineCap = 'round';
    for (i = 1; i < 7; i++) {
      var c = COURSES[i];
      ctx.globalAlpha = seamA * (0.5 + 0.5 * Math.sin(t * 3 + i));
      ctx.beginPath();
      ctx.moveTo(CX - c.wB / 2 - 16, c.yB); ctx.lineTo(CX - c.wB / 2 + 26, c.yB + 4);
      ctx.moveTo(CX + c.wB / 2 + 16, c.yB); ctx.lineTo(CX + c.wB / 2 - 26, c.yB + 4);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // pooling mist at the base
  var blobs = [[-150, 24, 105], [-55, 34, 135], [45, 30, 125], [140, 26, 95], [0, 42, 155]];
  for (i = 0; i < blobs.length; i++) {
    ctx.globalAlpha = 0.10 + 0.09 * breathe + (backflow > 0 ? 0.10 : 0);
    oval(CX + blobs[i][0] + Math.sin(t * 0.3 + i * 2.1) * 10, BASE_Y + blobs[i][1], blobs[i][2] * (0.92 + 0.10 * breathe), 20);
    ctx.fillStyle = MIST; ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---- tower drawing -------------------------------------------------------
function drawTower(t) {
  var i, j, c;
  // roof cap
  ctx.beginPath();
  ctx.moveTo(CX - 128, ROOF_Y + 6); ctx.lineTo(CX, ROOF_Y - 74); ctx.lineTo(CX + 128, ROOF_Y + 6);
  ctx.closePath(); ctx.fillStyle = MORTAR; ctx.fill();
  ctx.strokeStyle = GROUND; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
  // roof mouth: dark opening at the apex
  oval(MOUTH.x, MOUTH.y + 12, 27, 8.5); ctx.fillStyle = GROUND; ctx.fill();
  ctx.strokeStyle = STONE; ctx.lineWidth = 2.6; ctx.stroke();
  // courses, top first so lower course overlaps read correctly
  for (i = 6; i >= 0; i--) {
    c = COURSES[i];
    ctx.beginPath();
    ctx.moveTo(CX - c.wT / 2 + c.jit, c.yT); ctx.lineTo(CX + c.wT / 2 + c.jit, c.yT);
    ctx.lineTo(CX + c.wB / 2 + c.jit, c.yB); ctx.lineTo(CX - c.wB / 2 + c.jit, c.yB);
    ctx.closePath(); ctx.fillStyle = STONE; ctx.fill();
    ctx.strokeStyle = MORTAR; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
    // course line and rough speckles
    ctx.strokeStyle = MORTAR; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.55;
    for (j = 0; j < SPECKS[i].length; j++) {
      ctx.beginPath();
      ctx.moveTo(CX + SPECKS[i][j] * 0.82 + c.jit, c.yT + 22 + (j % 2) * 26);
      ctx.lineTo(CX + SPECKS[i][j] * 0.82 + c.jit + 14, c.yT + 20 + (j % 2) * 26);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // slit windows, glowing amber with layered translucency
    for (j = 0; j < WINDOWS[i].length; j++) {
      var wx = CX + WINDOWS[i][j].dx + c.jit, wy = (c.yT + c.yB) / 2, ww = WINDOWS[i][j].w;
      if (i === 0 && Math.abs(WINDOWS[i][j].dx) < 60) continue;
      var flick = 0.85 + 0.15 * Math.sin(t * 1.7 + i * 2.3 + j * 1.1);
      ctx.globalAlpha = 0.16 * flick; oval(wx, wy, ww * 2.6, 30); ctx.fillStyle = AMBER; ctx.fill();
      ctx.globalAlpha = 0.38 * flick; oval(wx, wy, ww * 1.5, 22); ctx.fillStyle = AMBER; ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = AMBER;
      ctx.fillRect(wx - ww / 2, wy - 17, ww, 34);
      ctx.strokeStyle = MORTAR; ctx.lineWidth = 1.6; ctx.strokeRect(wx - ww / 2, wy - 17, ww, 34);
    }
  }
  // carved door at the base
  ctx.beginPath();
  ctx.moveTo(DOOR.x - DOOR.w / 2, DOOR.y);
  ctx.lineTo(DOOR.x - DOOR.w / 2, DOOR.y - DOOR.h + DOOR.w / 2);
  ctx.quadraticCurveTo(DOOR.x, DOOR.y - DOOR.h - 12, DOOR.x + DOOR.w / 2, DOOR.y - DOOR.h + DOOR.w / 2);
  ctx.lineTo(DOOR.x + DOOR.w / 2, DOOR.y);
  ctx.closePath(); ctx.fillStyle = MORTAR; ctx.fill();
  ctx.strokeStyle = GROUND; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = STONE; ctx.lineWidth = 2; ctx.globalAlpha = 0.8;
  ctx.beginPath(); ctx.moveTo(DOOR.x - 22, DOOR.y - 26); ctx.lineTo(DOOR.x - 22, DOOR.y - 76); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(DOOR.x + 22, DOOR.y - 26); ctx.lineTo(DOOR.x + 22, DOOR.y - 76); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(DOOR.x - 28, DOOR.y - 52); ctx.lineTo(DOOR.x + 28, DOOR.y - 52); ctx.stroke();
  oval(DOOR.x + 24, DOOR.y - 44, 4, 4); ctx.fillStyle = AMBER; ctx.fill();
  ctx.globalAlpha = 1;
  // chimney on the roof, right of the mouth
  ctx.fillStyle = STONE;
  ctx.fillRect(CHIMNEY.x, CHIMNEY.y, CHIMNEY.w, CHIMNEY.h);
  ctx.strokeStyle = MORTAR; ctx.lineWidth = 2.6; ctx.strokeRect(CHIMNEY.x, CHIMNEY.y, CHIMNEY.w, CHIMNEY.h);
  ctx.fillStyle = MORTAR; ctx.fillRect(CHIMNEY.x - 4, CHIMNEY.y - 8, CHIMNEY.w + 8, 10);
  oval(CHIMNEY.x + CHIMNEY.w / 2, CHIMNEY.y - 4, 13, 4.5); ctx.fillStyle = GROUND; ctx.fill();
}

// ---- interaction ---------------------------------------------------------
var dragDie = null, dragOffX = 0, dragOffY = 0, downPos = null, downTime = 0;
function toDesign(cx, cy) { return { x: (cx - OX) / S, y: (cy - OY) / S }; }
function dieAt(p) {
  for (var i = DICE.length - 1; i >= 0; i--) {
    var d = DICE[i];
    if (d.state === 'rest' && Math.abs(p.x - d.x) < d.size * 0.85 && Math.abs(p.y - d.y) < d.size * 0.85) return d;
  }
  return null;
}
function onDown(cx, cy) {
  var p = toDesign(cx, cy); downPos = p; downTime = T;
  var d = dieAt(p);
  if (d) { dragDie = d; d.state = 'drag'; dragOffX = d.x - p.x; dragOffY = d.y - p.y; }
}
function onMove(cx, cy) {
  if (!dragDie) return;
  var p = toDesign(cx, cy);
  dragDie.x = p.x + dragOffX; dragDie.y = p.y + dragOffY;
}
function onUp(cx, cy) {
  var p = toDesign(cx, cy);
  if (dragDie) {
    var d = dragDie; dragDie = null;
    var distM = Math.hypot(d.x - MOUTH.x, d.y - MOUTH.y);
    if (distM < 78) {
      d.state = 'tumble'; d.t = 0;
      d.fromX = d.x; d.fromY = d.y;
      smokeBoost = 2.4;
    } else {
      d.state = 'return'; d.t = 0; d.fromX = d.x; d.fromY = d.y;
    }
    return;
  }
  // tap the chimney: backflow pulse
  if (downPos && Math.hypot(p.x - downPos.x, p.y - downPos.y) < 18 &&
      p.x > CHIMNEY.x - 26 && p.x < CHIMNEY.x + CHIMNEY.w + 30 &&
      p.y > CHIMNEY.y - 44 && p.y < CHIMNEY.y + CHIMNEY.h + 16) {
    backflow = 1.6;
  }
  downPos = null;
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY); });
  canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
  canvas.addEventListener('pointerup', function (e) { onUp(e.clientX, e.clientY); });
  canvas.addEventListener('mousedown', function (e) { onDown(e.clientX, e.clientY); });
  canvas.addEventListener('mousemove', function (e) { onMove(e.clientX, e.clientY); });
  canvas.addEventListener('mouseup', function (e) { onUp(e.clientX, e.clientY); });
}

function step(dt) {
  if (smokeBoost > 0) smokeBoost -= dt;
  if (backflow > 0) backflow -= dt;
  for (var i = 0; i < DICE.length; i++) {
    var d = DICE[i];
    if (d.state === 'return') {
      d.t += dt / 0.6;
      var u = smooth(d.t);
      d.x = lerp(d.fromX, d.homeX, u); d.y = lerp(d.fromY, d.homeY, u);
      d.rot = lerp(d.rot, d.homeRot !== undefined ? d.homeRot : d.rot, u);
      if (d.t >= 1) { d.state = 'rest'; d.x = d.homeX; d.y = d.homeY; }
    } else if (d.state === 'tumble') {
      d.t += dt / 3.0;
      if (d.t < 0.78) {
        var sp = spiralPos((d.t / 0.78), d);
        d.x = sp.x; d.y = sp.y;
        d.rot += dt * 9;
        // face cycles through the spiral, settles later
        d.face = ROLL_SEQ[(rollIdx + Math.floor(d.t * 14)) % ROLL_SEQ.length];
      } else if (d.t < 1) {
        var v = (d.t - 0.78) / 0.22, ve = 1 - Math.pow(1 - v, 3);
        d.x = lerp(CX, CX + 58, ve);
        d.y = lerp(BASE_Y - 52, 800, ve) - Math.abs(Math.sin(v * Math.PI * 2)) * 16 * (1 - v);
        d.rot = lerp(d.rot, -0.10, ve * 0.4);
        if (v >= 0.98 && d.state === 'tumble') {
          d.face = ROLL_SEQ[rollIdx % ROLL_SEQ.length]; rollIdx++;
          d.homeX = CX + 58; d.homeY = 800; d.x = d.homeX; d.y = d.homeY; d.rot = -0.10;
          d.state = 'rest'; smokeBoost = Math.max(smokeBoost, 1.2);
        }
      }
    }
  }
}

// ---- frame ---------------------------------------------------------------
function draw() {
  ctx.fillStyle = GROUND; ctx.fillRect(0, 0, DW, DH);
  // ground shadow pool under the tower
  ctx.globalAlpha = 0.45; oval(CX, BASE_Y + 30, 258, 22); ctx.fillStyle = MORTAR; ctx.fill(); ctx.globalAlpha = 1;
  drawSmoke(T);
  drawTower(T);
  drawMist(T);
  var i;
  // a tumbling die reads over the tower face, on its spiral
  for (i = 0; i < DICE.length; i++) if (DICE[i].state === 'tumble') drawDie(DICE[i]);
  for (i = 0; i < DICE.length; i++) if (DICE[i].state !== 'tumble') drawDie(DICE[i]);
}
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND; ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(TICK); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
