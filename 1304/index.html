<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disc Nine</title>
<style>
  html, body { margin: 0; padding: 0; background: #C8A96A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG only. No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var KRAFT = '#C8A96A';
  var INK = '#1A1512';
  var SEPIA = '#6B4F35';
  var RUST = '#8B3A2A';

  var W = 0, H = 0, CX = 0, CY = 0, R = 0, S = 1;
  var isPhone = false;

  function size() {
    var vw, vh;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      vw = visualViewport.width; vh = visualViewport.height;
    } else {
      vw = window.innerWidth; vh = window.innerHeight;
    }
    W = Math.round(vw); H = Math.round(vh);
    var sw = 0, sh = 0;
    try {
      if (window.screen) { sw = window.screen.width; sh = window.screen.height; }
    } catch (e) { sw = 0; sh = 0; }
    var minScreen = (sw && sh) ? Math.min(sw, sh) : 9999;
    isPhone = (minScreen < 700) || (H > W * 1.15);
    // Square disc, centered. Page ground is the kraft itself.
    var m = Math.min(W, H);
    CX = W / 2; CY = H / 2;
    R = m * 0.44;
    S = R / 396;
    canvas.width = W; canvas.height = H;
    if (canvas.style) {
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
    }
  }

  // Glyph types, one dominant type per ring band.
  var BAND_TYPES = ['cross', 'flag', 'medal', 'gun', 'portrait', 'rubble', 'cross', 'medal', 'gun'];

  function drawGlyph(type, x, y, rot, s, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(s, s);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    if (type === 'cross') {
      ctx.fillRect(-1.6, -9, 3.2, 18);
      ctx.fillRect(-7, -5, 14, 3.2);
    } else if (type === 'flag') {
      ctx.beginPath();
      ctx.moveTo(-6, -10); ctx.lineTo(-6, 10);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-6, -10);
      ctx.quadraticCurveTo(0, -8, 7, -10);
      ctx.quadraticCurveTo(0, -5, 7, -3);
      ctx.quadraticCurveTo(0, -5, -6, -3);
      ctx.closePath();
      ctx.fill();
    } else if (type === 'medal') {
      ctx.beginPath();
      ctx.moveTo(-4, -10); ctx.lineTo(-1, -4); ctx.lineTo(1, -4); ctx.lineTo(4, -10);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 3); ctx.arc(0, 3, 6.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 3); ctx.arc(0, 3, 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 'gun') {
      // Abstract rifle silhouette: barrel, body, stock. No detail, no gore.
      ctx.beginPath();
      ctx.moveTo(-11, -1); ctx.lineTo(11, -1); ctx.lineTo(11, 1.5);
      ctx.lineTo(4, 1.5); ctx.lineTo(2, 5); ctx.lineTo(-4, 5);
      ctx.lineTo(-6, 1.5); ctx.lineTo(-11, 1.5);
      ctx.closePath();
      ctx.fill();
    } else if (type === 'portrait') {
      ctx.beginPath();
      ctx.moveTo(0, -8); ctx.ellipse(0, -8, 5.5, 7, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-8, 9);
      ctx.quadraticCurveTo(0, -1, 8, 9);
      ctx.stroke();
    } else { // rubble hatching
      for (var i = 0; i < 5; i++) {
        var hx = -8 + i * 4;
        ctx.beginPath();
        ctx.moveTo(hx, 6 - i); ctx.lineTo(hx + 5, -2 - i);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(-9, 8); ctx.lineTo(9, 8);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Build the glyph layout for one loop from a seeded sequence.
  function buildLayout(loop) {
    var rng = mulberry32(1304000 + loop * 7919);
    var glyphs = [];
    var turns = 5;
    var thetaMax = turns * Math.PI * 2;
    var r0 = 14 * S;
    var k = (R - r0) / thetaMax;
    var spacing = 30 * S;
    var theta = 0, acc = 0, prevX = CX, prevY = CY - r0;
    var step = 0.02;
    var idx = 0;
    while (theta < thetaMax) {
      var r = r0 + k * theta;
      var x = CX + r * Math.cos(theta - Math.PI / 2);
      var y = CY + r * Math.sin(theta - Math.PI / 2);
      if (idx > 0) {
        var dx = x - prevX, dy = y - prevY;
        acc += Math.sqrt(dx * dx + dy * dy);
      }
      if (acc >= spacing || idx === 0) {
        acc = 0;
        var band = Math.min(8, Math.floor((r / R) * 9));
        var coherence = 1 - Math.pow(r / R, 1.5);
        var jit = (1 - coherence) * 15 * S;
        var jx = (rng() * 2 - 1) * jit;
        var jy = (rng() * 2 - 1) * jit;
        var rotJit = (1 - coherence) * (rng() * 2 - 1) * 0.9;
        var scaleJit = 1 + (1 - coherence) * (rng() * 2 - 1) * 0.35;
        var cr = rng();
        var color = cr < 0.62 ? INK : (cr < 0.86 ? SEPIA : RUST);
        glyphs.push({
          x: x + jx, y: y + jy,
          bx: x, by: y,
          rot: rotJit + (rng() * 2 - 1) * 0.12,
          s: S * scaleJit,
          color: color,
          band: band,
          type: BAND_TYPES[band],
          frac: theta / thetaMax,
          rad: r / R
        });
      }
      prevX = x; prevY = y;
      theta += step;
      idx++;
    }
    return { glyphs: glyphs, thetaMax: thetaMax, r0: r0, k: k };
  }

  // Static kraft flecks, fixed seed so the paper never jumps on reseed.
  function drawFlecks() {
    var rng = mulberry32(1304);
    ctx.fillStyle = SEPIA;
    var n = Math.round(Math.min(W, H) / 9);
    for (var i = 0; i < n; i++) {
      var fx = rng() * W, fy = rng() * H;
      ctx.globalAlpha = 0.05 + rng() * 0.06;
      ctx.fillRect(fx, fy, 1 + rng() * 3, 1);
    }
    ctx.globalAlpha = 1;
  }

  function drawSpiralGuide(layout, progress) {
    ctx.save();
    ctx.strokeStyle = SEPIA;
    ctx.globalAlpha = 0.22;
    ctx.lineWidth = 1;
    ctx.beginPath();
    var maxTheta = layout.thetaMax * progress;
    var started = false;
    for (var th = 0; th <= maxTheta; th += 0.05) {
      var r = layout.r0 + layout.k * th;
      var x = CX + r * Math.cos(th - Math.PI / 2);
      var y = CY + r * Math.sin(th - Math.PI / 2);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    size();
    ctx.fillStyle = KRAFT;
    ctx.fillRect(0, 0, W, H);
    drawFlecks();

    var LOOP = 90;
    // Phase-shifted loop: frame one opens on the finished disc
    // (fully drawn, still coherent), then it degrades, clears, and
    // draws itself outward again. Same 90 s cycle, fixed phase at t = 0.
    var shifted = t + 70;
    var loop = Math.floor(shifted / LOOP);
    var lt = shifted - loop * LOOP;
    var layout = buildLayout(loop);
    var glyphs = layout.glyphs;

    var progress, degrade, fade;
    if (lt < 70) {
      progress = lt / 70; degrade = 0; fade = 1;
    } else if (lt < 85) {
      progress = 1; degrade = (lt - 70) / 15; fade = 1;
    } else {
      progress = 1; degrade = 1; fade = 1 - (lt - 85) / 5;
    }

    ctx.save();
    ctx.globalAlpha = fade;

    // Center anchor: the first mark, present even at t = 0.
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(CX, CY - 4 * S); ctx.arc(CX, CY, 4 * S, 0, Math.PI * 2);
    ctx.fill();

    drawSpiralGuide(layout, progress);

    for (var i = 0; i < glyphs.length; i++) {
      var g = glyphs[i];
      if (g.frac > progress) continue;
      var x = g.x, y = g.y, rot = g.rot;
      if (degrade > 0 && g.band >= 5) {
        // Outer bands dissolve into a pile: scatter grows with degrade and radius.
        var drng = mulberry32(1304000 + loop * 7919 + 5000 + i * 13);
        var sc = degrade * g.rad * 22 * S;
        x = g.bx + (drng() * 2 - 1) * sc;
        y = g.by + (drng() * 2 - 1) * sc;
        rot = g.rot + degrade * (drng() * 2 - 1) * 1.2;
      }
      drawGlyph(g.type, x, y, rot, g.s, g.color);
    }
    ctx.restore();
  }

  // Frame one is drawn synchronously at exactly t = 0. The clock
  // starts only with the rAF loop, never from elapsed time at load.
  var lastT = 0;
  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    function loop(now) {
      if (t0 === null) t0 = now;
      lastT = (now - t0) / 1000;
      draw(lastT);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  if (typeof window !== 'undefined' && window.addEventListener) {
    function onResize() { draw(lastT); }
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', onResize);
    }
    window.addEventListener('resize', onResize);
  }
})();
</script>
</body>
</html>
