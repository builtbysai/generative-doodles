<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Eye</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0B0D; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: negotiation between two voices, approach, listen, withdraw,
   never collide, with distance mapping to harmonic tension. A small
   restless form (guitar) and a slow large form (cello) drift on a
   near-black field, exchange edges, and retreat. When they come close,
   two pale voice-threads weave between them and fade as they separate.
   The viewer witnesses the dialogue. Watch only. */
var TAU = Math.PI * 2;
var GROUND = '#0B0B0D';
var GROUND_HI = '#121214';
var SMALL_FILL = '#2B2B30';
var SMALL_EDGE = '#45454C';
var LARGE_FILL = '#1E1E22';
var LARGE_EDGE = '#3A3A41';
var WARM = '#B98A5E';
var BONE = '#E8E2D4';
var PLATE = '#16161A';
var PLATE_LINE = 'rgba(232,226,212,0.22)';
var TITLE_INK = '#E8E2D4';
var HINT_INK = '#9A958A';
var FRAME_T = 14.0;        /* fixed phase: forms mid approach, threads half lit */
var LOOP_LEN = 64.0;       /* seconds per negotiation loop */
var MIN_D = 0.30;          /* minimum approach distance, in field units */
var MAX_D = 0.75;          /* distance where tension reaches zero */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* seeded ground specks: faint dust on the near-black field */
var SPECKS = (function () {
  var rng = mulberry32(1868), out = [], i;
  for (i = 0; i < 70; i++) {
    out.push({ x: rng(), y: rng(), r: 0.5 + rng() * 1.1, a: 0.03 + rng() * 0.06 });
  }
  return out;
})();
/* seeded thread beads: small pale dots that ride the voice-threads */
var BEADS = (function () {
  var rng = mulberry32(18681), out = [], i;
  for (i = 0; i < 14; i++) {
    out.push({ f: rng(), off: (rng() - 0.5) * 0.05, r: 1 + rng() * 1.6 });
  }
  return out;
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- the two blob agents: pure closed-form functions of t ---- */
function rawSmall(t) {
  return {
    x: -0.17 + 0.11 * Math.cos(0.13 * t + 0.9) + 0.04 * Math.sin(0.31 * t + 2.0),
    y: 0.03 + 0.08 * Math.sin(0.11 * t + 0.4) + 0.03 * Math.cos(0.27 * t)
  };
}
function rawLarge(t) {
  return {
    x: 0.19 + 0.07 * Math.cos(0.07 * t + 2.6) + 0.03 * Math.sin(0.17 * t),
    y: -0.02 + 0.06 * Math.sin(0.09 * t + 1.2) + 0.02 * Math.cos(0.19 * t + 0.5)
  };
}
/* Attraction and repulsion with a minimum-approach distance: if the raw
   drift would bring the forms closer than MIN_D, push them apart along
   the line between them so they never collide. Deterministic in t. */
function agents(t) {
  var s = rawSmall(t), l = rawLarge(t);
  var dx = l.x - s.x, dy = l.y - s.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d < MIN_D && d > 0.0001) {
    var push = (MIN_D - d) / 2;
    var ux = dx / d, uy = dy / d;
    s.x -= ux * push; s.y -= uy * push;
    l.x += ux * push; l.y += uy * push;
    d = MIN_D;
  }
  var tension = 1 - clamp((d - MIN_D) / (MAX_D - MIN_D), 0, 1);
  return { s: s, l: l, d: d, tension: tension };
}
/* Organic blob outline: radial wobble, drawn as a many-point polygon. */
function blobPath(cx, cy, r, t, seedPh) {
  var n = 48, i, a, rr;
  ctx.beginPath();
  for (i = 0; i <= n; i++) {
    a = i / n * TAU;
    rr = r * (1 + 0.11 * Math.sin(3 * a + seedPh + t * 0.21) +
      0.07 * Math.sin(5 * a - seedPh * 2 + t * 0.13) +
      0.05 * Math.sin(2 * a + seedPh + t * 0.07));
    var px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function drawBlob(cx, cy, r, t, seedPh, fill, edge) {
  /* soft halo, a faint breath of light around the form */
  var g = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r * 1.9);
  g.addColorStop(0, rgba(fill, 0.35));
  g.addColorStop(1, rgba(fill, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(cx + r * 1.9, cy); ctx.arc(cx, cy, r * 1.9, 0, TAU); ctx.fill();
  blobPath(cx, cy, r, t, seedPh);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = edge;
  ctx.lineWidth = Math.max(1, r * 0.02);
  ctx.stroke();
}
/* Faint warm edge on the large form, on the side facing the small form. */
function drawWarmEdge(lx, ly, r, sx, sy, t, alpha) {
  var a = Math.atan2(sy - ly, sx - lx);
  var spread = 0.9;
  ctx.strokeStyle = rgba(WARM, 0.55 * alpha);
  ctx.lineWidth = Math.max(1.5, r * 0.035);
  ctx.beginPath();
  ctx.moveTo(lx + Math.cos(a - spread) * r * 1.0, ly + Math.sin(a - spread) * r * 1.0);
  ctx.arc(lx, ly, r * 1.0, a - spread, a + spread, false);
  ctx.stroke();
}
function quadPoint(p0, p1, p2, f) {
  var u = 1 - f;
  return {
    x: u * u * p0.x + 2 * u * f * p1.x + f * f * p2.x,
    y: u * u * p0.y + 2 * u * f * p1.y + f * f * p2.y
  };
}
function drawThreads(s, l, tension, t, U) {
  if (tension <= 0.12) return;
  var alpha = 0.12 + 0.6 * tension;
  var i, j;
  var dx = l.x - s.x, dy = l.y - s.y;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var px = -dy / len, py = dx / len; /* perpendicular to the line between forms */
  var mx = (s.x + l.x) / 2, my = (s.y + l.y) / 2;
  for (j = 0; j < 2; j++) {
    var side = j === 0 ? 1 : -1;
    var lift = side * (0.10 + 0.04 * Math.sin(t * 0.5 + j * 1.7)) * U;
    var c = { x: mx + px * lift, y: my + py * lift };
    ctx.strokeStyle = rgba(BONE, alpha * (j === 0 ? 1 : 0.7));
    ctx.lineWidth = Math.max(1, U * 0.004 * (j === 0 ? 1.4 : 1));
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.quadraticCurveTo(c.x, c.y, l.x, l.y);
    ctx.stroke();
    /* beads riding the thread */
    for (i = 0; i < BEADS.length; i++) {
      if ((i % 2) !== j) continue;
      var b = BEADS[i];
      var p = quadPoint(s, c, l, b.f);
      ctx.fillStyle = rgba(BONE, alpha * 0.85);
      ctx.beginPath();
      ctx.moveTo(p.x + b.r, p.y + b.off * U);
      ctx.arc(p.x, p.y + b.off * U, b.r, 0, TAU);
      ctx.fill();
    }
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Weather Eye').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Weather Eye').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 22').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Weather Eye', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 22', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. Two voices negotiate.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  var ag = agents(t);
  var cx = sc.x + sc.w / 2, cy = sc.y + sc.h / 2;
  var U = Math.min(sc.w, sc.h) * 0.5;
  var sx = cx + ag.s.x * U, sy = cy + ag.s.y * U;
  var lx = cx + ag.l.x * U, ly = cy + ag.l.y * U;
  var sR = U * 0.105, lR = U * 0.175;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* faint ground field, slightly lighter inside the square on desktop */
  if (!isPhone) {
    ctx.fillStyle = GROUND_HI;
    ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
    ctx.strokeStyle = rgba(BONE, 0.08);
    ctx.lineWidth = 1;
    ctx.strokeRect(sc.x + 0.5, sc.y + 0.5, sc.w - 1, sc.h - 1);
  }
  /* seeded specks on the ground */
  var i;
  for (i = 0; i < SPECKS.length; i++) {
    var sp = SPECKS[i];
    ctx.fillStyle = rgba(BONE, sp.a);
    ctx.beginPath();
    ctx.moveTo(sc.x + sp.x * sc.w + sp.r, sc.y + sp.y * sc.h);
    ctx.arc(sc.x + sp.x * sc.w, sc.y + sp.y * sc.h, sp.r, 0, TAU);
    ctx.fill();
  }
  /* voice-threads weave between the forms, lit by closeness */
  drawThreads({ x: sx, y: sy }, { x: lx, y: ly }, ag.tension, t, U);
  /* the slow large form first, then the restless small one */
  drawBlob(lx, ly, lR, t, 1.3, LARGE_FILL, LARGE_EDGE);
  drawWarmEdge(lx, ly, lR * 0.985, sx, sy, t, 0.5 + 0.5 * ag.tension);
  drawBlob(sx, sy, sR, t, 4.1, SMALL_FILL, SMALL_EDGE);
  /* a small pale core in the restless form, its listening eye */
  var coreR = sR * 0.22 * (0.8 + 0.2 * Math.sin(t * 0.9));
  ctx.fillStyle = rgba(BONE, 0.35 + 0.25 * ag.tension);
  ctx.beginPath();
  ctx.moveTo(sx + coreR, sy);
  ctx.arc(sx, sy, coreR, 0, TAU);
  ctx.fill();
  drawPlates();
}
/* ---- frame one: fixed phase t = 14.0 s, forms mid approach, threads half lit ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % LOOP_LEN;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
