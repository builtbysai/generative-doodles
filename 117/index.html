<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№117 · Topomembrane</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#060A0A; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,163,61,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to press the membrane</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

// No.117 Topomembrane: a full-bleed grid of points displaced by layered sine
// waves plus two knot centres at golden-ratio points where the contours pinch.
// Dots only, no mesh lines. Colour is a lerp from deep teal to amber driven by
// the steepness of the displacement gradient, so the steep places glow like
// contour lines on a topographic map. Pressing injects a ripple that expands
// and decays. Palette: ground #060A0A, teal #0E3B3B, amber #E8A33D, nothing else.
const TEAL=[14,59,59], AMBER=[232,163,61];
const PAL=[];
for(let i=0;i<=32;i++){ const u=i/32; PAL.push('rgb('+Math.round(TEAL[0]+(AMBER[0]-TEAL[0])*u)+','+Math.round(TEAL[1]+(AMBER[1]-TEAL[1])*u)+','+Math.round(TEAL[2]+(AMBER[2]-TEAL[2])*u)+')'); }
let ripples=[]; // {x, y, t0}
let pressing=false, lastRippleMs=-9999;

function zAt(x,y,t,knots){
  let z=Math.sin(x*0.021+t)+Math.sin(y*0.017-t*1.3)+Math.sin((x+y)*0.011+t*0.7);
  for(let k=0;k<knots.length;k++){
    const dx=x-knots[k][0], dy=y-knots[k][1];
    const d=Math.sqrt(dx*dx+dy*dy);
    z+=1.15*Math.sin(d*0.055-t*1.1)*Math.exp(-d*0.0022);
  }
  for(let r=0;r<ripples.length;r++){
    const age=t-ripples[r].t0;
    if(age<0||age>5) continue;
    const dx=x-ripples[r].x, dy=y-ripples[r].y;
    const d=Math.sqrt(dx*dx+dy*dy);
    z+=1.5*Math.sin(d*0.09-age*7)*Math.exp(-d*0.004)*Math.exp(-age*0.6);
  }
  return z;
}

function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const t=nowMs/1000;
  ripples=ripples.filter(r=>t-r.t0<5);
  ctx.fillStyle='#060A0A'; ctx.fillRect(0,0,w,h);
  const knots=[[w*0.382,h*0.382],[w*0.618,h*0.618]];
  const sp=clamp(Math.round(Math.min(w,h)/95),6,14);
  const cols=Math.ceil(w/sp)+1, rows=Math.ceil(h/sp)+1;
  const Z=new Float32Array(cols*rows);
  for(let j=0;j<rows;j++){
    const y=j*sp;
    for(let i=0;i<cols;i++){ Z[j*cols+i]=zAt(i*sp,y,t,knots); }
  }
  const dot=Math.max(2,Math.round(sp*0.22));
  for(let j=0;j<rows;j++){
    for(let i=0;i<cols;i++){
      const idx=j*cols+i;
      const gx=(i+1<cols?Z[idx+1]:Z[idx])-(i>0?Z[idx-1]:Z[idx]);
      const gy=(j+1<rows?Z[idx+cols]:Z[idx])-(j>0?Z[idx-cols]:Z[idx]);
      const mag=Math.abs(gx)+Math.abs(gy);
      let b=clamp((mag-0.45)*1.4,0,1);
      b=Math.pow(b,1.25);
      ctx.fillStyle=PAL[Math.round(b*32)];
      ctx.fillRect(i*sp-1,j*sp-1,dot,dot);
    }
  }
  return {};
}
function pressAt(x,y,nowMs){
  if(nowMs-lastRippleMs>140){ ripples.push({x:x,y:y,t0:nowMs/1000}); if(ripples.length>6) ripples.shift(); lastRippleMs=nowMs; }
}
canvas.addEventListener('pointerdown',e=>{ pressing=true; pressAt(e.clientX,e.clientY,performance.now()); });
canvas.addEventListener('pointermove',e=>{ if(!pressing) return; pressAt(e.clientX,e.clientY,performance.now()); });
function endP(){ pressing=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(2400);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
