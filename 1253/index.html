<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theater of the Mind</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var T0 = 9;                 // fixed first-frame phase, seconds
  var CYCLE = 45;             // gaze story cycle, seconds
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seed ----------
  var seedBase = 1253;
  try {
    var qs = (window.location && window.location.search) || (typeof location !== 'undefined' ? location.search : '') || '';
    var sm = /[?&]seed=(\d+)/.exec(qs);
    if (sm) seedBase = parseInt(sm[1], 10);
  } catch (e) {}
  var salt = 0;

  function mix(n) {
    var x = (n | 0) ^ 0x9E3779B9;
    x = Math.imul(x ^ (x >>> 16), 0x21F0AAAD);
    x = Math.imul(x ^ (x >>> 15), 0x735A2D97);
    x = (x ^ (x >>> 15)) >>> 0;
    return x / 4294967296;
  }
  function H(a, b, c) {
    return mix((a * 374761393 + b * 668265263 + c * 1274126177 +
                seedBase * 974711 + salt * 2246822519) | 0);
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function clamp01(v) { return clamp(v, 0, 1); }
  function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }

  // ---------- gaze story: fixation script ----------
  var fix = [], fixStart = [];
  function buildStory() {
    fix = [];
    fix.push({ d: 2.6, x: 0.05, y: 0.02 });
    fix.push({ d: 4.8, x: 0.55, y: -0.20 });
    fix.push({ d: 5.0, x: -0.85, y: 0.06 });
    var t = 12.4, k = 3;
    while (t < CYCLE) {
      var d = 2 + 3 * H(k, 1, 0);
      if (t + d > CYCLE) d = CYCLE - t;
      fix.push({ d: d, x: (2 * H(k, 2, 0) - 1) * 0.9, y: (2 * H(k, 3, 0) - 1) * 0.55 });
      t += d; k++;
    }
    fixStart = [];
    var acc = 0;
    for (var i = 0; i < fix.length; i++) { fixStart.push(acc); acc += fix[i].d; }
  }
  buildStory();

  function gazeAt(t) {
    var tc = ((t % CYCLE) + CYCLE) % CYCLE;
    var i = 0;
    while (i < fix.length - 1 && tc >= fixStart[i] + fix[i].d) i++;
    var local = tc - fixStart[i];
    var cur = fix[i];
    var prev = fix[(i + fix.length - 1) % fix.length];
    var x, y;
    if (local < 0.15) {
      var s = smooth(local / 0.15);
      x = prev.x + (cur.x - prev.x) * s;
      y = prev.y + (cur.y - prev.y) * s;
    } else { x = cur.x; y = cur.y; }
    // microsaccade drift
    x += 0.012 * Math.sin(t * 1.7 + 2.0);
    y += 0.010 * Math.sin(t * 2.3);
    return { x: x, y: y, idx: i, local: local };
  }

  // ---------- ghosts ----------
  // dirs: doorway left, field right, hand top-left, window top-right
  var ghostDir = [
    { x: -0.999, y: 0.05 },
    { x: 0.999, y: -0.05 },
    { x: -0.45, y: -0.89 },
    { x: 0.55, y: -0.83 }
  ];
  function alignFor(f, gi) {
    var len = Math.sqrt(f.x * f.x + f.y * f.y);
    if (len < 0.001) return 0.25;
    var dot = (f.x / len) * ghostDir[gi].x + (f.y / len) * ghostDir[gi].y;
    return clamp01(0.25 + 0.95 * Math.max(0, dot));
  }
  // brightness of ghost gi at time t, closed-form over the fixation script
  function ghostB(t, gi) {
    var g = gazeAt(t);
    var i = g.idx, n = fix.length;
    var B = alignFor(fix[(i - 2 + 2 * n) % n], gi);
    for (var j = i - 2; j < i; j++) {
      var fj = fix[(j + 2 * n) % n];
      var A = alignFor(fj, gi);
      B = A + (B - A) * Math.exp(-fj.d / 0.9);
    }
    var Ac = alignFor(fix[i], gi);
    B = Ac + (B - Ac) * Math.exp(-g.local / 0.9);
    return B;
  }

  // ---------- blinks ----------
  var blinkStarts = [2.9, 6.4];
  var blinkK = 2;
  function ensureBlinks(t) {
    while (blinkStarts[blinkStarts.length - 1] < t + 1) {
      var prev = blinkStarts[blinkStarts.length - 1];
      blinkStarts.push(prev + 3.4 + 2.6 * H(blinkK, 5, 0));
      blinkK++;
    }
  }
  function blinkClosure(t) {
    ensureBlinks(t);
    for (var i = 0; i < blinkStarts.length; i++) {
      var dt = t - blinkStarts[i];
      if (dt < 0) break;
      if (dt < 0.12) return smooth(dt / 0.12);
      if (dt < 0.16) return 1;
      if (dt < 0.34) return 1 - smooth((dt - 0.16) / 0.18);
    }
    return 0;
  }

  // ---------- interaction state ----------
  var tapBlinkT = -100;       // start time of held tap-blink
  var lastDownT = -100;
  var drag = null;            // {sx,sy,cx,cy}
  var biasVec = { x: 0, y: 0 };
  var biasStartT = -100, biasReleaseT = -100;

  function biasAt(t) {
    if (drag) return { f: 1, x: biasVec.x, y: biasVec.y };
    if (t < biasReleaseT + 4 && biasReleaseT > 0) {
      return { f: 1 - (t - biasReleaseT) / 4, x: biasVec.x, y: biasVec.y };
    }
    return { f: 0, x: 0, y: 0 };
  }

  // ---------- sizing ----------
  var W = 0, Hh = 0, DPR = 1, phone = false;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = w; Hh = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var sw = window.screen ? window.screen.width : w;
    var sh = window.screen ? window.screen.height : h;
    phone = Math.min(sw, sh) < 700 || h > w * 1.15;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(curT); });
  }
  window.addEventListener('resize', function () { resize(); draw(curT); });

  // ---------- ghost vignettes (indigo, drawn behind eyes) ----------
  function ghostDoorway(cx, cy, s) {
    ctx.fillStyle = '#3E3E52';
    ctx.strokeStyle = '#3E3E52';
    var w = s * 0.46, h = s * 1.2, x = cx - w / 2, y = cy - h / 2;
    ctx.lineWidth = Math.max(1.5, s * 0.045);
    ctx.strokeRect(x, y, w, h);
    // door ajar: inner panel swung, light wedge spilling right
    ctx.beginPath();
    ctx.moveTo(x + w * 0.12, y + h * 0.06);
    ctx.lineTo(x + w * 0.62, y + h * 0.16);
    ctx.lineTo(x + w * 0.62, y + h * 0.94);
    ctx.lineTo(x + w * 0.12, y + h * 0.94);
    ctx.closePath();
    ctx.fill();
    ctx.save();
    ctx.globalAlpha *= 0.55;
    ctx.fillStyle = '#F0ECE0';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.62, y + h * 0.16);
    ctx.lineTo(x + w * 1.55, y + h * 0.55);
    ctx.lineTo(x + w * 1.55, y + h * 0.98);
    ctx.lineTo(x + w * 0.62, y + h * 0.94);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  function ghostField(cx, cy, s) {
    ctx.fillStyle = '#3E3E52';
    ctx.strokeStyle = '#3E3E52';
    // ground
    ctx.beginPath();
    ctx.moveTo(cx - s, cy + s * 0.18);
    ctx.quadraticCurveTo(cx - s * 0.3, cy - s * 0.02, cx + s * 0.2, cy + s * 0.14);
    ctx.quadraticCurveTo(cx + s * 0.6, cy + s * 0.24, cx + s, cy + s * 0.16);
    ctx.lineTo(cx + s, cy + s * 0.62);
    ctx.lineTo(cx - s, cy + s * 0.62);
    ctx.closePath();
    ctx.fill();
    // low sun disc above horizon
    ctx.beginPath();
    ctx.arc(cx - s * 0.45, cy + s * 0.02, s * 0.13, 0, Math.PI * 2);
    ctx.fill();
    // tree blob on a stick
    ctx.fillRect(cx + s * 0.34, cy - s * 0.18, s * 0.045, s * 0.34);
    ctx.beginPath(); ctx.arc(cx + s * 0.22, cy - s * 0.24, s * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + s * 0.40, cy - s * 0.30, s * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + s * 0.52, cy - s * 0.20, s * 0.12, 0, Math.PI * 2); ctx.fill();
    // grass ticks
    ctx.lineWidth = Math.max(1, s * 0.02);
    for (var i = 0; i < 7; i++) {
      var gx = cx - s * 0.8 + i * s * 0.24 + s * 0.1 * H(i, 9, 1);
      ctx.beginPath();
      ctx.moveTo(gx, cy + s * 0.55);
      ctx.lineTo(gx + s * 0.03, cy + s * 0.38);
      ctx.stroke();
    }
  }
  function ghostHand(cx, cy, s) {
    ctx.fillStyle = '#3E3E52';
    function blob(x, y, rx, ry, rot) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    // fingers fanned above palm
    blob(cx - s * 0.30, cy - s * 0.34, s * 0.085, s * 0.26, -0.45);
    blob(cx - s * 0.11, cy - s * 0.44, s * 0.09, s * 0.32, -0.15);
    blob(cx + s * 0.09, cy - s * 0.46, s * 0.09, s * 0.33, 0.05);
    blob(cx + s * 0.28, cy - s * 0.38, s * 0.085, s * 0.27, 0.3);
    // thumb
    blob(cx - s * 0.42, cy + s * 0.08, s * 0.09, s * 0.24, 0.85);
    // palm
    blob(cx, cy + s * 0.12, s * 0.34, s * 0.40, 0);
  }
  function ghostWindow(cx, cy, s) {
    ctx.strokeStyle = '#3E3E52';
    ctx.fillStyle = '#3E3E52';
    var w = s * 0.95, h = s * 1.05, x = cx - w / 2, y = cy - h / 2;
    ctx.lineWidth = Math.max(1.5, s * 0.05);
    ctx.strokeRect(x, y, w, h);
    ctx.beginPath();
    ctx.moveTo(cx, y); ctx.lineTo(cx, y + h);
    ctx.moveTo(x, cy); ctx.lineTo(x + w, cy);
    ctx.stroke();
    // curtain over left pane, wavy hem
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w * 0.42, y);
    ctx.lineTo(x + w * 0.42, y + h * 0.52);
    ctx.quadraticCurveTo(cx - w * 0.18, y + h * 0.66, x + w * 0.14, y + h * 0.5);
    ctx.quadraticCurveTo(x + w * 0.05, y + h * 0.42, x, y + h * 0.55);
    ctx.closePath();
    ctx.fill();
  }
  var ghostDraw = [ghostDoorway, ghostField, ghostHand, ghostWindow];
  var ghostPos = [
    { x: 0.15, y: 0.33, s: 0.30 },
    { x: 0.85, y: 0.67, s: 0.32 },
    { x: 0.24, y: 0.15, s: 0.26 },
    { x: 0.78, y: 0.15, s: 0.27 }
  ];

  // ---------- eyes ----------
  function almondPath(cx, cy, w, h) {
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy);
    ctx.quadraticCurveTo(cx - w * 0.05, cy - h * 1.02, cx + w / 2, cy);
    ctx.quadraticCurveTo(cx + w * 0.03, cy + h * 0.62, cx - w / 2, cy);
    ctx.closePath();
  }
  function drawEye(cx, cy, w, h, gx, gy, closure, dil, eyeIdx) {
    var r = h * 0.46;
    var ix = cx + gx * w * 0.14;
    var iy = cy + gy * h * 0.18;
    // faint socket halo
    ctx.beginPath();
    ctx.ellipse(cx, cy, w * 0.56, h * 0.72, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(24,21,18,0.55)';
    ctx.fill();

    almondPath(cx, cy, w, h);
    ctx.save();
    ctx.clip();
    ctx.fillStyle = '#D9D4C7';
    ctx.fillRect(cx - w / 2 - 2, cy - h / 2 - 2, w + 4, h + 4);
    // flat shading bands: upper-lid shadow, lower band
    ctx.fillStyle = 'rgba(70,60,50,0.20)';
    ctx.fillRect(cx - w / 2 - 2, cy - h / 2 - 2, w + 4, h * 0.44);
    ctx.fillStyle = 'rgba(70,60,50,0.10)';
    ctx.fillRect(cx - w / 2 - 2, cy + h * 0.28, w + 4, h * 0.3);
    // corner shading
    ctx.beginPath();
    ctx.ellipse(cx - w / 2, cy, w * 0.16, h * 0.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(90,80,70,0.16)';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + w / 2, cy, w * 0.16, h * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    // iris wedges (flat radial pattern)
    var shades = ['#7A5C3E', '#715637', '#86664A', '#7A5C3E', '#6B4F34', '#826344'];
    var NW = 14;
    for (var k = 0; k < NW; k++) {
      var a0 = (k / NW) * Math.PI * 2, a1 = ((k + 1) / NW) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(ix, iy);
      ctx.lineTo(ix + Math.cos(a0) * r, iy + Math.sin(a0) * r);
      ctx.lineTo(ix + Math.cos(a1) * r, iy + Math.sin(a1) * r);
      ctx.closePath();
      ctx.fillStyle = shades[Math.floor(H(k, 11, eyeIdx) * shades.length) % shades.length];
      ctx.fill();
    }
    // iris rim
    ctx.beginPath();
    ctx.arc(ix, iy, r, 0, Math.PI * 2);
    ctx.strokeStyle = '#43331F';
    ctx.lineWidth = Math.max(1.2, r * 0.14);
    ctx.stroke();
    // pupil
    ctx.beginPath();
    ctx.arc(ix, iy, r * 0.46 * dil, 0, Math.PI * 2);
    ctx.fillStyle = '#0A0A0A';
    ctx.fill();
    // one catchlight
    ctx.beginPath();
    ctx.arc(ix - r * 0.34, iy - r * 0.38, Math.max(1.2, r * 0.10), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(240,236,224,0.95)';
    ctx.fill();

    // blink lids (black shapes inside the almond)
    if (closure > 0.001) {
      ctx.fillStyle = '#0A0A0A';
      var topCov = closure * (h + 6);
      ctx.fillRect(cx - w / 2 - 2, cy - h / 2 - 3, w + 4, topCov);
      var botCov = closure * 0.25 * (h + 6);
      ctx.fillRect(cx - w / 2 - 2, cy + h / 2 + 3 - botCov, w + 4, botCov);
      // lash line along the lid edge
      var ly = cy - h / 2 - 3 + topCov;
      ctx.beginPath();
      ctx.moveTo(cx - w / 2, ly - h * 0.04);
      ctx.quadraticCurveTo(cx, ly + h * 0.10, cx + w / 2, ly - h * 0.04);
      ctx.strokeStyle = 'rgba(30,27,24,0.9)';
      ctx.lineWidth = Math.max(1.2, h * 0.03);
      ctx.stroke();
    }
    ctx.restore();

    // upper lid line + faint crease
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy);
    ctx.quadraticCurveTo(cx - w * 0.05, cy - h * 1.02, cx + w / 2, cy);
    ctx.strokeStyle = 'rgba(35,31,28,0.55)';
    ctx.lineWidth = Math.max(1.2, h * 0.035);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.38, cy - h * 0.58);
    ctx.quadraticCurveTo(cx, cy - h * 0.78, cx + w * 0.38, cy - h * 0.58);
    ctx.strokeStyle = 'rgba(217,212,199,0.08)';
    ctx.lineWidth = Math.max(1, h * 0.02);
    ctx.stroke();
  }

  // ---------- main draw ----------
  var curT = T0;
  function draw(t) {
    curT = t;
    if (W === 0) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = Hh + 'px';
    ctx.fillStyle = '#0A0A0A';
    ctx.fillRect(0, 0, W, Hh);

    // held tap-blink: pure dark, nothing else
    if (t >= tapBlinkT && t < tapBlinkT + 2) return;

    var g = gazeAt(t);
    var bias = biasAt(t);
    var egx = clamp(g.x + bias.x * bias.f * 0.8, -1, 1);
    var egy = clamp(g.y + bias.y * bias.f * 0.8, -1, 1);

    // ghosts behind eyes
    var minD = Math.min(W, Hh);
    var maxB = 0;
    var Bs = [];
    for (var gi = 0; gi < 4; gi++) {
      var B = ghostB(t, gi);
      if (bias.f > 0.01) {
        // pull brightness toward the biased gaze's instantaneous alignment
        var el = Math.sqrt(egx * egx + egy * egy);
        var Ai = 0.25;
        if (el > 0.001) {
          var dot = (egx / el) * ghostDir[gi].x + (egy / el) * ghostDir[gi].y;
          Ai = clamp01(0.25 + 0.95 * Math.max(0, dot));
        }
        var pull = bias.f * (1 - Math.exp(-(t - biasStartT) / 0.9));
        B = B + (Ai - B) * clamp01(pull);
      }
      Bs.push(B);
      if (B > maxB) maxB = B;
    }
    for (var gj = 0; gj < 4; gj++) {
      var flick = 0.90 + 0.10 * H(Math.floor(t / 0.4), 7, gj);
      ctx.save();
      ctx.globalAlpha = 0.125 * Bs[gj] * flick;
      var p = ghostPos[gj];
      ghostDraw[gj](p.x * W, p.y * Hh, p.s * minD);
      ctx.restore();
    }

    // pupil dilation: slow noise + ghost response
    var dil = 1 + 0.08 * Math.sin(t * 0.35 + 1.7) * Math.sin(t * 0.13) + 0.05 * maxB;
    var closure = blinkClosure(t);

    var eyeW = (phone ? 0.38 : 0.27) * W;
    var eyeH = eyeW * 0.46;
    var cy = Hh * 0.5;
    drawEye(W * (phone ? 0.27 : 0.315), cy, eyeW, eyeH, egx, egy, closure, dil, 0);
    drawEye(W * (phone ? 0.73 : 0.685), cy, eyeW, eyeH, egx, egy, closure, dil, 1);
  }

  // ---------- pointer interaction ----------
  function evtPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = evtPos(e);
    if (curT - lastDownT < 0.35) {
      // double-tap: reseed the story
      salt++;
      buildStory();
      blinkStarts = [2.9, 6.4];
      blinkK = 2;
      tapBlinkT = -100;
      lastDownT = -100;
      drag = null;
      return;
    }
    lastDownT = curT;
    tapBlinkT = curT;             // held blink begins; cancelled if it becomes a drag
    drag = { sx: p.x, sy: p.y, cx: p.x, cy: p.y, moved: false };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = evtPos(e);
    drag.cx = p.x; drag.cy = p.y;
    var dx = p.x - drag.sx, dy = p.y - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 12) {
      drag.moved = true;
      tapBlinkT = -100;           // it was a drag, not a tap
      var sc = 0.35 * Math.min(W, Hh);
      biasVec = { x: clamp(dx / sc, -1, 1), y: clamp(dy / sc, -1, 1) };
      if (biasStartT < 0 || biasReleaseT > 0) biasStartT = curT;
      biasReleaseT = -100;
    }
  });
  function endDrag() {
    if (drag && drag.moved) biasReleaseT = curT;
    drag = null;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- boot ----------
  resize();
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var startStamp = null;
    var loop = function (ts) {
      if (startStamp === null) startStamp = ts;
      draw(T0 + (ts - startStamp) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
