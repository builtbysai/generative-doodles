<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis (Living Portrait)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0E0C09; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
"use strict";

/* ---------- seeded hash (integer, deterministic) ---------- */
function hash(n){
  var x = (n * 2654435761) >>> 0;
  x ^= x >>> 15; x = (x * 2246822519) >>> 0;
  x ^= x >>> 13; x = (x * 3266489917) >>> 0;
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}

/* ---------- palette ---------- */
var BG = "#0E0C09", PLASTER = "#E6E0D3", CREAM = "#F2EEDF",
    AMBER = "#D9A441", SHADOW = "#3A342A";

/* ---------- the face (unit space, y down; profile facing right) ---------- */
var FACE = [
  [0.34,0.03],[0.55,0.05],[0.72,0.11],[0.79,0.20],[0.80,0.28],[0.775,0.335],
  [0.815,0.375],[0.875,0.435],[0.845,0.465],[0.775,0.475],[0.79,0.51],
  [0.825,0.535],[0.795,0.56],[0.815,0.585],[0.785,0.615],[0.815,0.655],
  [0.79,0.70],[0.68,0.775],[0.56,0.83],[0.545,0.92],[0.56,1.00],
  [0.18,1.00],[0.16,0.88],[0.10,0.68],[0.065,0.45],[0.09,0.24],[0.18,0.10]
];
var CENT = [0.42, 0.50];
var EYE = [0.64, 0.355], MOU = [0.80, 0.56];

function inFace(x, y){
  var inside = false;
  for (var i = 0, j = FACE.length - 1; i < FACE.length; j = i++){
    var xi = FACE[i][0], yi = FACE[i][1], xj = FACE[j][0], yj = FACE[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

/* ---------- the colony: pre-grown as data ----------
   Each segment carries g0n, its growth coordinate along its branch from a
   seed, normalised to 0..1 across the whole colony. Growth is the front
   moving along that coordinate; nothing is simulated per frame. */
var STEP = 0.014;
function genColony(SALT){
  var segs = [];
  var ctr = 0;
  function rnd(){ return hash(SALT * 100000 + (ctr++)); }
  var walkers = [];
  var spawned = 0;
  function spawn(x, y, ang, depth, g, max){
    walkers.push({x:x, y:y, ang:ang, depth:depth, g:g, steps:0, max:max, kids:0});
    spawned++;
  }
  var ear = [0.40, 0.50], jaw = [0.55, 0.80], hair = [0.60, 0.09];
  var a, b, c;
  for (a = 0; a < 5; a++) spawn(ear[0], ear[1], -0.9 + a * 0.45 + rnd() * 0.3, 0, 0, Math.round(37 + rnd() * 22));
  for (b = 0; b < 2; b++) spawn(jaw[0], jaw[1], -2.4 + b * 0.7 + rnd() * 0.3, 0, 0, Math.round(34 + rnd() * 20));
  for (c = 0; c < 2; c++) spawn(hair[0], hair[1], 0.5 + c * 0.6 + rnd() * 0.3, 0, 0, Math.round(34 + rnd() * 20));
  while (walkers.length){
    var w = walkers.pop();
    while (w.steps < w.max && segs.length < 1600){
      w.steps++;
      var ang = w.ang + (rnd() - 0.5) * 0.85;
      /* soft avoidance: the young colony skirts the eye socket and mouth */
      var dE = Math.hypot(w.x - EYE[0], w.y - EYE[1]);
      if (dE < 0.115) ang += (Math.atan2(w.y - EYE[1], w.x - EYE[0]) - ang) * 0.4 + 0.3;
      var dM = Math.hypot(w.x - MOU[0], w.y - MOU[1]);
      if (dM < 0.09) ang += (Math.atan2(w.y - MOU[1], w.x - MOU[0]) - ang) * 0.35 + 0.25;
      var nx = w.x + Math.cos(ang) * STEP, ny = w.y + Math.sin(ang) * STEP;
      var tries = 0;
      while (!inFace(nx, ny) && tries < 4){
        var toC = Math.atan2(CENT[1] - w.y, CENT[0] - w.x);
        ang += (toC - ang) * 0.55 + (rnd() - 0.5) * 0.3;
        nx = w.x + Math.cos(ang) * STEP; ny = w.y + Math.sin(ang) * STEP;
        tries++;
      }
      if (!inFace(nx, ny)) break;
      segs.push({x1:w.x, y1:w.y, x2:nx, y2:ny, g0:w.g, depth:w.depth});
      w.x = nx; w.y = ny; w.ang = ang; w.g += STEP;
      if (w.depth < 4 && w.kids < 4 && spawned < 30 && rnd() < 0.11){
        w.kids++;
        spawn(w.x, w.y, ang + (rnd() < 0.5 ? -1 : 1) * (0.4 + rnd() * 0.55),
              w.depth + 1, w.g, Math.round(30 + rnd() * 24 - (w.depth + 1) * 4));
      }
      if (rnd() < 0.008) break;
    }
  }
  var gmax = 0, i;
  for (i = 0; i < segs.length; i++) if (segs[i].g0 + STEP > gmax) gmax = segs[i].g0 + STEP;
  for (i = 0; i < segs.length; i++){
    segs[i].g0n = segs[i].g0 / gmax;
    segs[i].g1n = (segs[i].g0 + STEP) / gmax;
    segs[i].cord = (segs[i].depth === 0 && segs[i].g0n < 0.20);
  }
  return segs;
}

var SALT = 1258;
var colony = genColony(SALT);

/* ---------- growth clock ----------
   front = integral of the growth rate / FULL, rate 1 normally, 3 while
   misted and for a 10 s tail after each misting. Frame one is anchored at
   CLOCK0 = 132 growth-seconds, where front = 132/600 = 0.22 (day 2). */
var FULL = 600, CLOCK0 = 132;
var elapsed = 0;              /* real seconds since load, from the loop */
var curClock = CLOCK0;
var lastStamp = -1;
var mistIntervals = [];       /* closed [start, end] in clock seconds */
var misting = false, mistFrom = 0, mistX = 0, mistY = 0;
var lastTapC = -10000, lastTapX = 0, lastTapY = 0;
var downC = 0, downX = 0, downY = 0;

function boostedMeasure(clock){
  /* total clock seconds (up to `clock`) covered by mist intervals + tails */
  var spans = [];
  var i, a, b;
  for (i = 0; i < mistIntervals.length; i++){
    a = mistIntervals[i][0]; b = Math.min(mistIntervals[i][1] + 10, clock);
    if (a < clock && b > a) spans.push([a, b]);
  }
  if (misting){
    a = mistFrom; b = clock + 0; /* open interval: tail still to come */
    if (a < clock) spans.push([a, clock]);
  }
  spans.sort(function(p, q){ return p[0] - q[0]; });
  var total = 0, cs = -1, ce = -1;
  for (i = 0; i < spans.length; i++){
    if (cs < 0){ cs = spans[i][0]; ce = spans[i][1]; }
    else if (spans[i][0] <= ce){ if (spans[i][1] > ce) ce = spans[i][1]; }
    else { total += ce - cs; cs = spans[i][0]; ce = spans[i][1]; }
  }
  if (cs >= 0) total += ce - cs;
  return total;
}
function frontAt(clock){
  var f = (clock + 2 * boostedMeasure(clock)) / FULL;
  return f > 1 ? 1 : f;
}

/* ---------- canvas / viewport ---------- */
var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");
var W = 0, H = 0, PHONE = false;

function resize(){
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.max(50, Math.round(w)); H = Math.max(50, Math.round(h));
  cv.width = W; cv.height = H;
  PHONE = false;
  if (window.screen && Math.min(window.screen.width, window.screen.height) < 700) PHONE = true;
  if (!PHONE && H > W * 1.15) PHONE = true;
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
window.addEventListener("resize", resize);
resize();

/* face placement (recomputed per frame from W/H) */
var FH = 0, FW = 0, OX = 0, OY = 0;
function layout(){
  FH = PHONE ? W * 1.12 : H * 0.86;
  FW = FH * 0.88;
  OX = (PHONE ? W * 0.50 : W * 0.44) - FW * 0.47;
  OY = H * 0.52 - FH * 0.50;
}
function X(u){ return OX + u * FW; }
function Y(v){ return OY + v * FH; }

function facePath(){
  ctx.beginPath();
  var n = FACE.length;
  var mx = (FACE[n - 1][0] + FACE[0][0]) / 2, my = (FACE[n - 1][1] + FACE[0][1]) / 2;
  ctx.moveTo(X(mx), Y(my));
  for (var i = 0; i < n; i++){
    var p = FACE[i], q = FACE[(i + 1) % n];
    ctx.quadraticCurveTo(X(p[0]), Y(p[1]), X((p[0] + q[0]) / 2), Y((p[1] + q[1]) / 2));
  }
  ctx.closePath();
}
function poly(pts){
  ctx.beginPath();
  ctx.moveTo(X(pts[0][0]), Y(pts[0][1]));
  for (var i = 1; i < pts.length; i++) ctx.lineTo(X(pts[i][0]), Y(pts[i][1]));
  ctx.closePath();
}

function drawFace(){
  /* plaster body */
  facePath();
  ctx.fillStyle = PLASTER;
  ctx.fill();

  ctx.save();
  facePath();
  ctx.clip();

  /* flat shading shapes */
  ctx.fillStyle = SHADOW;
  ctx.globalAlpha = 0.06;
  poly([[0.065,0.45],[0.09,0.24],[0.18,0.10],[0.30,0.05],[0.26,0.30],[0.20,0.55],[0.16,0.88],[0.10,0.68]]);
  ctx.fill();
  ctx.globalAlpha = 0.08;
  poly([[0.545,0.92],[0.56,0.83],[0.68,0.775],[0.66,0.86],[0.60,1.00],[0.45,1.00]]);
  ctx.fill();
  ctx.globalAlpha = 0.08;
  poly([[0.775,0.465],[0.83,0.50],[0.79,0.535],[0.77,0.49]]);
  ctx.fill();
  /* cheek and socket shading as soft flat ellipses */
  ctx.globalAlpha = 0.050;
  ctx.beginPath();
  ctx.ellipse(X(EYE[0]), Y(EYE[1]), FW * 0.100, FH * 0.054, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 0.032;
  ctx.beginPath();
  ctx.ellipse(X(0.575), Y(0.665), FW * 0.125, FH * 0.088, 0.25, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 0.040;
  ctx.beginPath();
  ctx.ellipse(X(0.60), Y(0.775), FW * 0.098, FH * 0.058, 0.15, 0, Math.PI * 2);
  ctx.fill();

  /* plaster speckle */
  var i, sx, sy;
  for (i = 0; i < 150; i++){
    sx = 0.05 + 0.86 * hash(9000 + i * 3);
    sy = 0.02 + 0.97 * hash(9100 + i * 7);
    if (!inFace(sx, sy)) continue;
    ctx.globalAlpha = 0.04 + 0.05 * hash(9200 + i);
    ctx.fillStyle = (i % 3 === 0) ? "#FFFFFF" : SHADOW;
    ctx.fillRect(X(sx), Y(sy), Math.max(0.7, FH * 0.0016), Math.max(0.7, FH * 0.0016));
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* features: closed eye, ear, nostril, mouth — calm lines in shadow tone */
  ctx.strokeStyle = SHADOW;
  ctx.lineCap = "round";
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = Math.max(1.1, FH * 0.0042);
  ctx.beginPath(); /* closed lid */
  ctx.moveTo(X(0.555), Y(0.350));
  ctx.quadraticCurveTo(X(0.64), Y(0.392), X(0.725), Y(0.348));
  ctx.stroke();
  ctx.globalAlpha = 0.22;
  ctx.lineWidth = Math.max(0.9, FH * 0.003);
  ctx.beginPath(); /* lid crease */
  ctx.moveTo(X(0.57), Y(0.325));
  ctx.quadraticCurveTo(X(0.64), Y(0.350), X(0.71), Y(0.322));
  ctx.stroke();
  ctx.globalAlpha = 0.45;
  ctx.lineWidth = Math.max(1.0, FH * 0.0036);
  ctx.beginPath(); /* ear, outer */
  ctx.ellipse(X(0.40), Y(0.50), FW * 0.036, FH * 0.056, -0.12, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath(); /* ear, inner spiral hint */
  ctx.ellipse(X(0.402), Y(0.502), FW * 0.019, FH * 0.031, -0.12, Math.PI * 0.15, Math.PI * 1.55);
  ctx.stroke();
  ctx.globalAlpha = 0.40;
  ctx.beginPath(); /* nostril */
  ctx.ellipse(X(0.795), Y(0.470), FW * 0.008, FH * 0.006, 0.3, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 0.30;
  ctx.beginPath(); /* mouth line */
  ctx.moveTo(X(0.786), Y(0.559));
  ctx.quadraticCurveTo(X(0.80), Y(0.565), X(0.813), Y(0.556));
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawColony(F){
  var i, s, lw;
  ctx.strokeStyle = CREAM;
  ctx.lineCap = "round";
  /* soft mat halo under the filaments */
  ctx.globalAlpha = 0.06;
  for (i = 0; i < colony.length; i++){
    s = colony[i];
    if (s.g0n > F) continue;
    lw = FH * 0.0050 * (1 - s.depth * 0.16) * (s.cord ? 1.8 : 1);
    ctx.lineWidth = Math.max(0.8, lw * 2.8);
    ctx.beginPath();
    ctx.moveTo(X(s.x1), Y(s.y1));
    if (s.g1n <= F) ctx.lineTo(X(s.x2), Y(s.y2));
    else {
      var t = (F - s.g0n) / (s.g1n - s.g0n);
      ctx.lineTo(X(s.x1 + (s.x2 - s.x1) * t), Y(s.y1 + (s.y2 - s.y1) * t));
    }
    ctx.stroke();
  }
  /* filaments */
  for (i = 0; i < colony.length; i++){
    s = colony[i];
    if (s.g0n > F) continue;
    lw = FH * 0.0050 * (1 - s.depth * 0.16) * (s.cord ? 1.8 : 1);
    ctx.lineWidth = Math.max(0.6, lw);
    ctx.globalAlpha = (s.cord ? 0.88 : 0.78 - s.depth * 0.10);
    ctx.beginPath();
    ctx.moveTo(X(s.x1), Y(s.y1));
    if (s.g1n <= F) ctx.lineTo(X(s.x2), Y(s.y2));
    else {
      var t2 = (F - s.g0n) / (s.g1n - s.g0n);
      ctx.lineTo(X(s.x1 + (s.x2 - s.x1) * t2), Y(s.y1 + (s.y2 - s.y1) * t2));
    }
    ctx.stroke();
  }
  /* amber growth tips where the front is passing */
  ctx.fillStyle = AMBER;
  for (i = 0; i < colony.length; i++){
    s = colony[i];
    if (s.g0n >= F) continue;
    var tipX = -1, tipY = -1, tipA = 0;
    if (s.g1n > F){
      var tt = (F - s.g0n) / (s.g1n - s.g0n);
      tipX = s.x1 + (s.x2 - s.x1) * tt; tipY = s.y1 + (s.y2 - s.y1) * tt; tipA = 0.95;
    } else if (s.g1n > F - 0.012){
      tipX = s.x2; tipY = s.y2; tipA = 0.6;
    }
    if (tipX >= 0){
      ctx.globalAlpha = tipA;
      ctx.beginPath();
      ctx.arc(X(tipX), Y(tipY), Math.max(1.0, FH * 0.0038), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawMist(clock){
  var i, bx, by, px, py;
  /* spray: fine dots falling over the face */
  ctx.fillStyle = CREAM;
  for (i = 0; i < 46; i++){
    bx = 0.08 + 0.82 * hash(5000 + i * 3);
    by = (hash(5100 + i * 7) + clock * 0.22) % 1;
    px = bx + Math.sin(clock * 3 + i * 1.7) * 0.004;
    py = 0.03 + by * 0.94;
    if (!inFace(px, py)) continue;
    ctx.globalAlpha = 0.26;
    ctx.fillRect(X(px), Y(py), Math.max(0.8, FH * 0.002), Math.max(0.8, FH * 0.002));
  }
  /* soft held disc at the pointer */
  ctx.fillStyle = CREAM;
  var base = Math.min(W, H) / 800;
  var radii = [70, 46, 27], alphas = [0.020, 0.035, 0.055];
  for (i = 0; i < 3; i++){
    ctx.globalAlpha = alphas[i];
    ctx.beginPath();
    ctx.arc(mistX, mistY, radii[i] * base * (1 + 0.05 * Math.sin(clock * 2.4 + i)), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawCounter(F){
  var day = 1 + Math.floor(F * 7);
  if (day > 7) day = 7;
  var fs = PHONE ? 13 : 14;
  var bx = 18, by = H - 20;
  /* droplet icon */
  ctx.fillStyle = AMBER;
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.moveTo(bx + fs * 0.32, by - fs * 0.95);
  ctx.quadraticCurveTo(bx + fs * 0.78, by - fs * 0.38, bx + fs * 0.62, by - fs * 0.16);
  ctx.quadraticCurveTo(bx + fs * 0.52, by, bx + fs * 0.32, by);
  ctx.quadraticCurveTo(bx + fs * 0.12, by, bx + fs * 0.02, by - fs * 0.16);
  ctx.quadraticCurveTo(bx - fs * 0.14, by - fs * 0.38, bx + fs * 0.32, by - fs * 0.95);
  ctx.fill();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = PLASTER;
  ctx.font = "500 " + fs + "px ui-monospace, Menlo, Consolas, monospace";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("day " + day, bx + fs * 1.05, by);
  ctx.globalAlpha = 1;
}

function draw(){
  cv.style.width = W + "px"; cv.style.height = H + "px";
  curClock = CLOCK0 + elapsed;
  var F = frontAt(curClock);
  layout();
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  drawFace();
  drawColony(F);
  if (misting) drawMist(curClock);
  drawCounter(F);
}

/* ---------- loop ---------- */
function tick(stamp){
  if (lastStamp < 0) lastStamp = stamp;
  elapsed += (stamp - lastStamp) / 1000;
  lastStamp = stamp;
  draw();
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(tick);
}

/* ---------- pointer: hold = mist, double-tap = reseed ---------- */
function reseed(){
  SALT += 1;
  colony = genColony(SALT);
  elapsed = 0;
  mistIntervals = [];
  misting = false;
  lastTapC = -10000;
}
cv.addEventListener("pointerdown", function(e){
  misting = true;
  mistFrom = curClock;
  mistX = e.clientX; mistY = e.clientY;
  downC = curClock; downX = e.clientX; downY = e.clientY;
});
cv.addEventListener("pointermove", function(e){
  if (misting){ mistX = e.clientX; mistY = e.clientY; }
});
function endPointer(e){
  if (!misting) return;
  misting = false;
  mistIntervals.push([mistFrom, curClock]);
  var quick = (curClock - downC) < 0.35 &&
              Math.abs(e.clientX - downX) < 10 && Math.abs(e.clientY - downY) < 10;
  if (quick){
    if (curClock - lastTapC < 0.4 &&
        Math.abs(e.clientX - lastTapX) < 44 && Math.abs(e.clientY - lastTapY) < 44){
      reseed();
    } else {
      lastTapC = curClock; lastTapX = e.clientX; lastTapY = e.clientY;
    }
  }
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
window.addEventListener("pointerup", function(){
  if (misting){ misting = false; mistIntervals.push([mistFrom, curClock]); }
});

/* synchronous first frame at the fixed phase (front = 0.22, day 2) */
draw();
if (typeof requestAnimationFrame === "function") requestAnimationFrame(tick);
})();
</script>
</body>
</html>
