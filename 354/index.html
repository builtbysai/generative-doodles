<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.354 Neon Midnight Garden</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D0D12; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.354 Neon Midnight Garden (betterloveart).
// After Suchita Prakash's "Neon midnight garden": dense flat neon
// florals, dahlias, sunflowers and moths, packed maximalist over a
// near-black ground in three inks only (hot pink, light pink,
// violet), zero shading, no glow. Every bloom is a parametric
// rosette (petal count, curl, radius from a fixed seed table held
// as literal data) and sits at exactly one of three scales: hero,
// secondary, filler sprig. The counts are asserted: 5 heroes, 14
// secondary, 48 fillers, 67 blooms in all. The open/close wave is
// a pure function of grid position and loop time: each bloom's
// aperture is sin of the master cycle minus a phase set by its
// position, so the wave travels across the field and frame 18s is
// pixel-identical to frame 0. Dragging pushes a radial repulsion
// field through the garden: blooms near the pointer lean away and
// spring back fully on release, so no lean residue ever breaks
// the seam. One canvas, flat colour only, no text, no chrome.
// Determinism: the first frame is drawn synchronously at the
// constant phase T = 6.3 (never Date.now() minus an offset), and
// the animation advances from that anchor in fixed 1/60 ticks.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var LOOP = 18;
var GROUND = '#0D0D12';
var INKS = ['#FF2E88', '#FF6EC7', '#B537F2'];
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 6.3, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- the fixed seed table, as literal data ---------------------
// Fields per bloom: [x, y, kind, scaleClass, petals, curl, radius,
// ink]. kind: 0 dahlia, 1 sunflower, 2 moth, 3 sprig. scaleClass:
// 0 hero, 1 secondary, 2 filler. The wave phase of a bloom derives
// from its x/y (see aperture()), so no per-bloom phase is stored.
var BLOOMS = [
  [250,215,0,0,11,0,118,0],
  [705,160,1,0,14,-0.4,104,0],
  [1062,300,0,0,11,0.3,122,0],
  [428,562,1,0,15,0.6,100,1],
  [918,642,0,0,14,-0.5,112,2],
  [125,436,0,1,13,0.7,67,0],
  [315,357,1,1,12,0.2,59,1],
  [544,306,2,1,0,-0.7,47,2],
  [817,434,0,1,13,0.4,55,1],
  [1127,84,1,1,15,0.6,61,2],
  [1170,530,0,1,10,0.7,50,2],
  [167,749,2,1,0,-0.1,46,0],
  [504,806,0,1,13,0.8,64,2],
  [755,844,1,1,12,0.2,48,0],
  [1037,838,2,1,0,0.6,53,0],
  [646,470,0,1,9,-0.7,52,1],
  [72,75,1,1,13,0.2,54,1],
  [1182,710,0,1,13,0.5,59,2],
  [308,94,2,1,0,-0.7,59,0],
  [72,100,3,2,5,-0.6,22,0],
  [240,53,3,2,6,0.4,25,0],
  [389,103,3,2,5,-0.6,20,0],
  [594,88,3,2,5,-0.4,22,0],
  [727,50,3,2,5,-0.4,27,2],
  [854,38,3,2,5,-0.2,22,2],
  [1026,40,3,2,6,-0.6,27,0],
  [1231,77,3,2,6,0.6,20,0],
  [104,214,3,2,6,0.6,19,1],
  [246,239,3,2,6,-0.3,26,1],
  [393,239,3,2,5,0.2,22,1],
  [536,247,3,2,6,0.8,25,1],
  [693,219,2,2,0,0.3,23,1],
  [897,210,3,2,5,0.1,24,1],
  [1043,245,3,2,6,-0.8,18,0],
  [1235,213,3,2,5,0.4,22,2],
  [72,395,3,2,6,0.6,22,2],
  [275,375,3,2,5,-0.8,27,0],
  [368,387,3,2,6,0,17,2],
  [547,344,2,2,0,0.5,17,1],
  [713,361,3,2,5,-0.2,18,2],
  [840,344,3,2,5,0.3,28,0],
  [1047,369,3,2,6,-0.4,25,2],
  [1227,362,3,2,5,0.7,20,1],
  [82,490,3,2,5,-0.6,19,0],
  [252,534,2,2,0,0.6,22,0],
  [399,561,3,2,5,0.3,23,1],
  [586,551,3,2,5,0.6,24,0],
  [719,526,3,2,6,0.8,17,1],
  [893,509,3,2,6,-0.5,17,2],
  [1070,560,3,2,6,0.6,21,1],
  [1194,503,3,2,6,0.5,18,0],
  [88,651,3,2,6,0.8,17,0],
  [246,663,3,2,6,-0.6,27,2],
  [428,709,2,2,0,-0.5,24,2],
  [579,706,3,2,5,0.1,26,1],
  [722,673,2,2,0,-0.1,16,0],
  [914,648,2,2,0,-0.6,15,1],
  [1018,690,2,2,0,-0.2,26,0],
  [1228,665,3,2,6,0,28,2],
  [57,832,2,2,0,-0.1,19,0],
  [216,853,3,2,5,0.5,18,0],
  [362,824,3,2,5,0.7,22,1],
  [595,848,3,2,6,-0.3,25,0],
  [716,833,2,2,0,0.6,21,0],
  [842,812,3,2,5,0.4,17,1],
  [1011,821,2,2,0,0.7,23,0],
  [1212,852,3,2,6,-0.7,19,1]
];

// ---- table assertions ------------------------------------------
(function () {
  var counts = [0, 0, 0], kinds = [0, 0, 0, 0], i, b;
  if (BLOOMS.length !== 67) throw new Error('Neon Midnight Garden needs exactly 67 blooms');
  for (i = 0; i < BLOOMS.length; i++) {
    b = BLOOMS[i];
    if (b.length !== 8) throw new Error('bloom ' + i + ' must hold exactly 8 fields');
    if (b[3] < 0 || b[3] > 2) throw new Error('bloom ' + i + ' scale class outside the three scales');
    if (b[2] < 0 || b[2] > 3) throw new Error('bloom ' + i + ' kind outside the table');
    if (b[7] < 0 || b[7] > 2) throw new Error('bloom ' + i + ' ink outside the three inks');
    counts[b[3]]++; kinds[b[2]]++;
    if (b[2] === 0 && (b[4] < 9 || b[4] > 14)) throw new Error('dahlia petal count outside its seed range');
    if (b[2] === 1 && (b[4] < 11 || b[4] > 15)) throw new Error('sunflower petal count outside its seed range');
    if (b[2] === 3 && (b[4] < 5 || b[4] > 6)) throw new Error('sprig petal count outside its seed range');
    if (b[5] < -0.8 || b[5] > 0.8) throw new Error('bloom ' + i + ' curl outside its seed range');
  }
  if (counts[0] !== 5 || counts[1] !== 14 || counts[2] !== 48) throw new Error('scale classes must hold exactly 5 heroes, 14 secondary, 48 fillers');
  for (i = 0; i < 4; i++) if (kinds[i] === 0) throw new Error('every kind must appear in the garden');
})();

// draw order: fillers first, then secondary, heroes on top
var ORDER = BLOOMS.map(function (b, i) { return i; }).sort(function (a, b) { return BLOOMS[b][3] - BLOOMS[a][3]; });

// per-bloom lean state (drag repulsion), starts at exact rest
var leanX = [], leanY = [];
BLOOMS.forEach(function () { leanX.push(0); leanY.push(0); });

// ---- wave --------------------------------------------------------
// Aperture is a pure function of position and loop time: a diagonal
// travelling wave across the field, one full cycle per loop.
function aperture(b, cyc) {
  var dist = b[0] * 0.0045 + b[1] * 0.0031;
  return 0.5 + 0.5 * Math.sin((cyc / LOOP) * Math.PI * 2 - dist);
}

// ---- motif drawing (local space, origin at bloom centre) --------
function petalPath(L, Wd, c) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(Wd, -L * 0.45, c * L * 0.38, -L);
  ctx.quadraticCurveTo(-Wd, -L * 0.45, 0, 0);
  ctx.closePath();
}

function drawRosette(b, open) {
  var ink = INKS[b[7]];
  var alt = INKS[(b[7] + 1) % 3];
  var third = INKS[(b[7] + 2) % 3];
  var R = b[6], n = b[4];
  var rf = 0.45 + 0.55 * open;             // closed blooms pull their petals in
  var curl = b[5] * (1.3 - 0.6 * open);    // and curl harder while closed
  var i, a;
  if (b[2] === 1) {
    // sunflower: one ring of long narrow petals, flat disc heart,
    // a ring of dots in the petal ink on the disc
    ctx.fillStyle = ink;
    for (i = 0; i < n; i++) {
      a = (i / n) * Math.PI * 2 + curl * 0.2;
      ctx.save(); ctx.rotate(a);
      petalPath(R * rf, R * rf * 0.16, curl);
      ctx.fill(); ctx.restore();
    }
    ctx.fillStyle = alt;
    ctx.beginPath(); ctx.arc(0, 0, R * 0.32, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = ink;
    for (i = 0; i < 8; i++) {
      a = (i / 8) * Math.PI * 2 + 0.39;
      ctx.beginPath(); ctx.arc(Math.cos(a) * R * 0.2, Math.sin(a) * R * 0.2, R * 0.038, 0, Math.PI * 2); ctx.fill();
    }
    return;
  }
  if (b[2] === 0) {
    // dahlia: outer petal ring, a shorter inner ring in the second
    // ink, heart dot in the third
    ctx.fillStyle = ink;
    for (i = 0; i < n; i++) {
      a = (i / n) * Math.PI * 2 + curl * 0.15;
      ctx.save(); ctx.rotate(a);
      petalPath(R * rf, R * rf * 0.3, curl);
      ctx.fill(); ctx.restore();
    }
    ctx.fillStyle = alt;
    var n2 = Math.max(5, n - 3);
    for (i = 0; i < n2; i++) {
      a = ((i + 0.5) / n2) * Math.PI * 2 + curl * 0.15;
      ctx.save(); ctx.rotate(a);
      petalPath(R * 0.55 * rf, R * 0.55 * rf * 0.3, curl);
      ctx.fill(); ctx.restore();
    }
    ctx.fillStyle = third;
    ctx.beginPath(); ctx.arc(0, 0, R * 0.11, 0, Math.PI * 2); ctx.fill();
    return;
  }
  // sprig: one small ring of wide petals, heart in the second ink
  ctx.fillStyle = ink;
  for (i = 0; i < n; i++) {
    a = (i / n) * Math.PI * 2 + curl * 0.2;
    ctx.save(); ctx.rotate(a);
    petalPath(R * rf, R * rf * 0.34, curl);
    ctx.fill(); ctx.restore();
  }
  ctx.fillStyle = alt;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.18, 0, Math.PI * 2); ctx.fill();
}

function drawMoth(b, open) {
  var ink = INKS[b[7]];
  var alt = INKS[(b[7] + 1) % 3];
  var R = b[6];
  var flap = 0.55 + (open - 0.5) * 0.85;   // wings ride the same wave
  var side, w;
  ctx.fillStyle = ink;
  for (side = -1; side <= 1; side += 2) {
    // forewing: a broad petal blob angled up and out
    ctx.save();
    ctx.scale(side, 1);
    ctx.rotate(flap * 0.55);
    ctx.beginPath();
    ctx.moveTo(0, -R * 0.1);
    ctx.quadraticCurveTo(R * 0.72, -R * 0.62, R * 0.98, -R * 0.08);
    ctx.quadraticCurveTo(R * 0.6, R * 0.16, 0, R * 0.1);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // hindwing: a smaller blob angled down and out
    ctx.save();
    ctx.scale(side, 1);
    ctx.rotate(-flap * 0.3);
    ctx.beginPath();
    ctx.moveTo(0, R * 0.08);
    ctx.quadraticCurveTo(R * 0.55, R * 0.2, R * 0.62, R * 0.52);
    ctx.quadraticCurveTo(R * 0.3, R * 0.62, 0, R * 0.34);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // body and head in the second ink, antennae stroked in the first
  ctx.fillStyle = alt;
  ctx.beginPath(); ctx.ellipse(0, R * 0.08, R * 0.13, R * 0.42, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -R * 0.38, R * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = Math.max(1.2, R * 0.045);
  ctx.lineCap = 'round';
  for (w = -1; w <= 1; w += 2) {
    ctx.beginPath();
    ctx.moveTo(w * R * 0.05, -R * 0.46);
    ctx.quadraticCurveTo(w * R * 0.3, -R * 0.78, w * R * 0.52, -R * 0.72);
    ctx.stroke();
  }
}

// ---- drawing -----------------------------------------------------
function draw() {
  var cyc = ((T % LOOP) + LOOP) % LOOP;
  var k, i, b, open;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  for (k = 0; k < ORDER.length; k++) {
    i = ORDER[k]; b = BLOOMS[i];
    open = aperture(b, cyc);
    ctx.save();
    ctx.translate(b[0] + leanX[i], b[1] + leanY[i]);
    if (leanX[i] !== 0) ctx.rotate(leanX[i] * 0.0035);
    if (b[2] === 2) drawMoth(b, open); else drawRosette(b, open);
    ctx.restore();
  }
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag: radial repulsion, springs fully home ------------------
var pointerActive = false, pointerX = 0, pointerY = 0;
var LEAN_R = 280, LEAN_MAX = 30;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  pointerActive = true; pointerX = p.x; pointerY = p.y;
});
canvas.addEventListener('pointermove', function (e) {
  if (!pointerActive) return;
  var p = toDesign(e);
  pointerX = p.x; pointerY = p.y;
});
function endDrag() { pointerActive = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

function tickLean() {
  var i, b, dx, dy, d, tx, ty, f;
  for (i = 0; i < BLOOMS.length; i++) {
    b = BLOOMS[i]; tx = 0; ty = 0;
    if (pointerActive) {
      dx = b[0] - pointerX; dy = b[1] - pointerY;
      d = Math.sqrt(dx * dx + dy * dy);
      if (d > 0.001 && d < LEAN_R) {
        f = (1 - d / LEAN_R) * LEAN_MAX;
        tx = (dx / d) * f; ty = (dy / d) * f;
      }
    }
    leanX[i] += (tx - leanX[i]) * 0.16;
    leanY[i] += (ty - leanY[i]) * 0.16;
    if (!pointerActive && Math.abs(leanX[i]) < 0.02 && Math.abs(leanY[i]) < 0.02) {
      leanX[i] = 0; leanY[i] = 0;   // exact rest: the seam is never broken
    }
  }
}

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK;
    tickLean();
    acc -= TICK; guard++;
  }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
})();
</script>
</body>
</html>
