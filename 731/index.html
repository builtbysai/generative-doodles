<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake ID</title>
<style>
  html, body { margin: 0; padding: 0; background: #3A3F4A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var TABLE = '#3A3F4A';
  var LIC   = '#4A7FB5';
  var MEM   = '#C0392B';
  var BANK  = '#7BA05B';
  var TRAN  = '#E8A33D';
  var LIB   = '#8A6FB5';
  var BRASS = '#B08D3E';
  var CREAM = '#F5F1E6';
  var INK   = '#1A1A1A';

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }
  function easeInOutCubic(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function lerp(a, b, p) { return a + (b - a) * p; }

  // Epoch data: a fresh seeded set of five cards
  var NAMES = ['R. QUISPE', 'D. MERCER', 'L. FROST', 'P. HADDAD', 'J. OKONKWO', 'T. LINDQVIST', 'M. ALVARADO', 'S. VERO'];
  var CARD_W = 296, CARD_H = 188;
  var BASE_POSES = [
    { x: -272, y: 306, rot: -15 },
    { x: -138, y: 338, rot: -6 },
    { x: 0,    y: 352, rot: 2 },
    { x: 138,  y: 338, rot: 9 },
    { x: 272,  y: 306, rot: 17 }
  ];
  // card order: 0 license, 1 membership, 2 banknote, 3 transit, 4 library
  var CARD_COLORS = [LIC, MEM, BANK, TRAN, LIB];

  function digits(rng, n) {
    var s = '';
    for (var i = 0; i < n; i++) s += Math.floor(rng() * 10);
    return s;
  }
  function expiry(rng) {
    var m = 1 + Math.floor(rng() * 12);
    var y = 27 + Math.floor(rng() * 5);
    return 'EXP ' + (m < 10 ? '0' + m : '' + m) + '/' + y;
  }
  function genEpoch(seed) {
    var rng = mulberry32((seed ^ 0x9E3779B9) >>> 0);
    // five distinct names, shuffled assignment
    var pool = NAMES.slice();
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    var cards = [];
    for (var c = 0; c < 5; c++) {
      cards.push({
        name: pool[c],
        pose: {
          x: BASE_POSES[c].x + (rng() * 24 - 12),
          y: BASE_POSES[c].y + (rng() * 20 - 10),
          rot: BASE_POSES[c].rot + (rng() * 6 - 3)
        }
      });
    }
    cards[0].number = 'DL ' + digits(rng, 4) + ' ' + digits(rng, 3);
    cards[0].expiry = expiry(rng);
    cards[1].number = 'NO ' + digits(rng, 5);
    cards[1].expiry = expiry(rng);
    cards[2].serial = 'BN ' + digits(rng, 5);
    cards[2].denom = [10, 20, 50][Math.floor(rng() * 3)];
    cards[3].number = 'NO ' + digits(rng, 4) + ' ' + digits(rng, 4);
    cards[3].expiry = expiry(rng);
    cards[4].number = 'NO ' + digits(rng, 5);
    cards[4].expiry = expiry(rng);
    // the assembled identity: one field from each card
    var id = {
      name: cards[4].name,        // from the library card
      number: cards[3].number,    // from the transit card
      expiry: cards[1].expiry,    // from the membership card
      barcodeDigits: (cards[3].number.replace(/\D/g, '') + cards[1].number.replace(/\D/g, '') + cards[1].expiry.replace(/\D/g, ''))
    };
    return { cards: cards, id: id };
  }

  // Layout anchors (design space 1000 x 1000, origin at center)
  var WALLET = { x: -398, y: 168, w: 150, h: 100, rot: -8 };
  var MACHINE = { x: 0, y: -410, w: 920, h: 120 };
  var STAND = { x: 0, y: -26 };
  var ID_W = 360, ID_H = 220;

  // local anchors on source cards (field origins)
  var SRC_LOCAL = [
    { x: -100, y: -6 },   // license: photo slot center
    { x: 66,   y: 58 },   // membership: expiry line
    { x: -88,  y: -6 },   // banknote: portrait center
    { x: 0,    y: 26 },   // transit: number line
    { x: 0,    y: -28 }   // library: name line
  ];
  // transfer order: photo slot (license), name (library), number (transit), portrait (banknote), expiry (membership)
  var TRANSFERS = [
    { card: 0, dst: { x: -122, y: -16 }, kind: 'photo' },
    { card: 4, dst: { x: 0,    y: -52 }, kind: 'name' },
    { card: 3, dst: { x: 0,    y: -4 },  kind: 'number' },
    { card: 2, dst: { x: 126,  y: -16 }, kind: 'portrait' },
    { card: 1, dst: { x: 0,    y: 44 },  kind: 'expiry' }
  ];
  var SLIDE_DUR = 0.9;
  var TRANSFER_T0 = 1.1, TRANSFER_STEP = 0.95, TRANSFER_DUR = 0.8;
  var STAMP_T = TRANSFER_T0 + 4 * TRANSFER_STEP + 0.35; // ~5.25
  var DONE_T = STAMP_T + 0.45;

  // State
  var epoch = 1;
  var data = genEpoch(epoch);
  var spillT0 = -3;        // initial spill already settled at t = 0
  var asmT0 = null;        // assembly start time, null when idle
  var flipT0 = null;       // flip animation start
  var showingBack = false; // settled side of the finished card

  function nowSec() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return 0;
  }
  var T0 = nowSec();
  function elapsed() { return nowSec() - T0; }

  function isAssembling(t) { return asmT0 !== null && (t - asmT0) < DONE_T; }
  function isDone(t) { return asmT0 !== null && (t - asmT0) >= DONE_T; }

  // Spill pose for card i at time t (closed form)
  function cardPose(i, t) {
    var target = data.cards[i].pose;
    var p = clamp01((t - spillT0 - i * 0.09) / 0.85);
    if (p >= 1) return target;
    var e = easeOutCubic(p);
    return {
      x: lerp(WALLET.x, target.x, e),
      y: lerp(WALLET.y, target.y, e) - Math.sin(p * Math.PI) * 46,
      rot: lerp(0, target.rot, e)
    };
  }
  function localToWorld(pose, lx, ly) {
    var r = pose.rot * Math.PI / 180;
    var c = Math.cos(r), s = Math.sin(r);
    return { x: pose.x + lx * c - ly * s, y: pose.y + lx * s + ly * c };
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function text(str, x, y, font, color, align) {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  function drawPortrait(cx, cy, rx, ry) {
    // flat oval portrait: cream oval, ink silhouette
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = CREAM;
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.beginPath();
    ctx.arc(cx, cy - ry * 0.28, rx * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = INK;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx, cy + ry * 0.78, rx * 0.72, ry * 0.52, 0, 0, Math.PI * 2);
    ctx.fillStyle = INK;
    ctx.fill();
    ctx.restore();
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = INK;
    ctx.stroke();
  }
  function drawPhotoSlot(cx, cy, w, h, lineColor) {
    ctx.lineWidth = 3;
    ctx.strokeStyle = lineColor;
    ctx.strokeRect(cx - w / 2, cy - h / 2, w, h);
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy - h / 2);
    ctx.lineTo(cx + w / 2, cy + h / 2);
    ctx.moveTo(cx + w / 2, cy - h / 2);
    ctx.lineTo(cx - w / 2, cy + h / 2);
    ctx.stroke();
    ctx.restore();
    text('PHOTO', cx, cy, '600 15px sans-serif', lineColor, 'center');
  }

  // Source card faces (local coords, origin at card center)
  function drawCardFace(i) {
    var card = data.cards[i];
    ctx.fillStyle = CARD_COLORS[i];
    roundRectPath(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 14);
    ctx.fill();
    ctx.save();
    roundRectPath(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 14);
    ctx.clip();
    ctx.lineWidth = 2;
    ctx.strokeStyle = CREAM;
    ctx.globalAlpha = 0.5;
    ctx.strokeRect(-CARD_W / 2 + 9, -CARD_H / 2 + 9, CARD_W - 18, CARD_H - 18);
    ctx.globalAlpha = 1;
    if (i === 0) { // license
      text('LICENSE', -132, -66, '700 21px sans-serif', CREAM);
      drawPhotoSlot(-100, -6, 76, 104, CREAM);
      text('NAME: ' + card.name, -46, -52, '600 19px sans-serif', CREAM);
      text(card.number, -46, -8, '700 21px monospace', CREAM);
      text(card.expiry, -46, 34, '600 18px sans-serif', CREAM);
    } else if (i === 1) { // membership
      text('MEMBER CARD', -132, -66, '700 21px sans-serif', CREAM);
      text('NAME: ' + card.name, -132, -24, '600 19px sans-serif', CREAM);
      text(card.number, -132, 14, '700 21px monospace', CREAM);
      text(card.expiry, -132, 58, '600 18px sans-serif', CREAM);
    } else if (i === 2) { // banknote
      drawPortrait(-88, -6, 42, 56);
      text('' + card.denom, 84, -40, '700 44px sans-serif', CREAM, 'center');
      text('NOTE', 84, 6, '600 16px sans-serif', CREAM, 'center');
      text(card.serial, -132, 68, '700 20px monospace', CREAM);
    } else if (i === 3) { // transit
      ctx.fillStyle = INK;
      ctx.fillRect(-CARD_W / 2, -CARD_H / 2, CARD_W, 28);
      text('TRANSIT PASS', -132, -38, '700 21px sans-serif', CREAM);
      text('NAME: ' + card.name, -132, 0, '600 19px sans-serif', CREAM);
      text(card.number, -132, 40, '700 21px monospace', CREAM);
    } else { // library
      text('LIBRARY', -132, -66, '700 21px sans-serif', CREAM);
      text('NAME: ' + card.name, -132, -24, '600 19px sans-serif', CREAM);
      text(card.number, -132, 14, '700 21px monospace', CREAM);
      text(card.expiry, -132, 56, '600 18px sans-serif', CREAM);
    }
    ctx.restore();
    ctx.lineWidth = 2;
    ctx.strokeStyle = INK;
    ctx.globalAlpha = 0.35;
    roundRectPath(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 14);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawMachine(t) {
    ctx.save();
    ctx.translate(MACHINE.x, MACHINE.y);
    ctx.fillStyle = BRASS;
    roundRectPath(-MACHINE.w / 2, -MACHINE.h / 2, MACHINE.w, MACHINE.h, 16);
    ctx.fill();
    // ribbing
    ctx.save();
    roundRectPath(-MACHINE.w / 2, -MACHINE.h / 2, MACHINE.w, MACHINE.h, 16);
    ctx.clip();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = INK;
    for (var x = -MACHINE.w / 2 + 36; x < MACHINE.w / 2 - 10; x += 44) {
      ctx.fillRect(x, -MACHINE.h / 2, 3, MACHINE.h);
    }
    ctx.globalAlpha = 1;
    // top sheen band
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = CREAM;
    ctx.fillRect(-MACHINE.w / 2, -MACHINE.h / 2, MACHINE.w, 12);
    ctx.globalAlpha = 1;
    ctx.restore();
    // output slot
    ctx.fillStyle = INK;
    roundRectPath(-310, 18, 620, 22, 10);
    ctx.fill();
    // end bolts
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(-MACHINE.w / 2 + 30, -24, 9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(MACHINE.w / 2 - 30, -24, 9, 0, Math.PI * 2); ctx.fill();
    // status lamp: steady on when idle, pulsing while assembling
    var lampA = isAssembling(t) ? 0.55 + 0.45 * Math.sin(t * 10) : 1;
    ctx.save();
    ctx.globalAlpha = lampA;
    ctx.fillStyle = MEM;
    ctx.beginPath(); ctx.arc(MACHINE.w / 2 - 30, 8, 8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.restore();
    // output tray line under the slot
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-330, MACHINE.y + 78);
    ctx.lineTo(330, MACHINE.y + 78);
    ctx.stroke();
  }

  function drawStand() {
    ctx.fillStyle = INK;
    ctx.fillRect(STAND.x - 122, STAND.y + 62, 14, 58);
    ctx.fillRect(STAND.x + 108, STAND.y + 62, 14, 58);
    roundRectPath(STAND.x - 152, STAND.y + 118, 304, 16, 6);
    ctx.fill();
  }

  function drawWallet() {
    ctx.save();
    ctx.translate(WALLET.x, WALLET.y);
    ctx.rotate(WALLET.rot * Math.PI / 180);
    ctx.fillStyle = INK;
    roundRectPath(-WALLET.w / 2, -WALLET.h / 2, WALLET.w, WALLET.h, 12);
    ctx.fill();
    ctx.strokeStyle = CREAM;
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 2;
    roundRectPath(-WALLET.w / 2 + 8, -WALLET.h / 2 + 8, WALLET.w - 16, WALLET.h - 16, 9);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-WALLET.w / 2 + 8, -6);
    ctx.lineTo(WALLET.w / 2 - 8, -6);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = BRASS;
    roundRectPath(WALLET.w / 2 - 34, -13, 22, 14, 4);
    ctx.fill();
    ctx.restore();
  }

  // Finished ID card faces (local coords, origin at card center)
  function drawIDFront(t, rel) {
    ctx.fillStyle = CREAM;
    roundRectPath(-ID_W / 2, -ID_H / 2, ID_W, ID_H, 14);
    ctx.fill();
    ctx.fillStyle = BRASS;
    ctx.fillRect(-ID_W / 2 + 10, -ID_H / 2 + 10, ID_W - 20, 16);
    ctx.lineWidth = 2;
    ctx.strokeStyle = INK;
    ctx.globalAlpha = 0.4;
    roundRectPath(-ID_W / 2, -ID_H / 2, ID_W, ID_H, 14);
    ctx.stroke();
    ctx.globalAlpha = 1;
    var id = data.id;
    // fields appear per transfer progress
    function fieldAlpha(k) {
      if (rel === null) return 0;
      var start = TRANSFER_T0 + k * TRANSFER_STEP;
      return clamp01((rel - start) / TRANSFER_DUR);
    }
    var a;
    a = fieldAlpha(0);
    if (a > 0) { ctx.save(); ctx.globalAlpha = a; drawPhotoSlot(-122, -16, 76, 100, INK); ctx.restore(); }
    a = fieldAlpha(1);
    if (a > 0) { ctx.save(); ctx.globalAlpha = a; text('NAME: ' + id.name, -64, -52, '700 23px sans-serif', INK); ctx.restore(); }
    a = fieldAlpha(2);
    if (a > 0) { ctx.save(); ctx.globalAlpha = a; text(id.number, -64, -4, '700 22px monospace', INK); ctx.restore(); }
    a = fieldAlpha(3);
    if (a > 0) { ctx.save(); ctx.globalAlpha = a; drawPortrait(126, -16, 34, 46); ctx.restore(); }
    a = fieldAlpha(4);
    if (a > 0) { ctx.save(); ctx.globalAlpha = a; text(id.expiry, -64, 44, '600 20px sans-serif', INK); ctx.restore(); }
    // SPECIMEN stamp lands at STAMP_T
    if (rel !== null && rel >= STAMP_T) {
      var p = clamp01((rel - STAMP_T) / 0.3);
      var e = easeOutCubic(p);
      ctx.save();
      ctx.translate(6, 62);
      ctx.rotate(-16 * Math.PI / 180);
      ctx.scale(lerp(2.1, 1, e), lerp(2.1, 1, e));
      ctx.globalAlpha = 0.25 + 0.75 * p;
      ctx.strokeStyle = MEM;
      ctx.lineWidth = 4;
      ctx.strokeRect(-102, -27, 204, 54);
      ctx.lineWidth = 2;
      ctx.strokeRect(-94, -20, 188, 40);
      text('SPECIMEN', 0, 2, '700 30px sans-serif', MEM, 'center');
      ctx.restore();
    }
  }
  function drawIDBack() {
    ctx.fillStyle = CREAM;
    roundRectPath(-ID_W / 2, -ID_H / 2, ID_W, ID_H, 14);
    ctx.fill();
    ctx.fillStyle = INK;
    ctx.fillRect(-ID_W / 2, -ID_H / 2 + 14, ID_W, 34);
    ctx.lineWidth = 2;
    ctx.strokeStyle = INK;
    ctx.globalAlpha = 0.4;
    roundRectPath(-ID_W / 2, -ID_H / 2, ID_W, ID_H, 14);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // barcode built from the mixed digits
    var d = data.id.barcodeDigits;
    var x = -150;
    ctx.fillStyle = INK;
    var k = 0;
    while (x < 138 && d.length > 0) {
      var wdt = (parseInt(d.charAt(k % d.length), 10) + 1) * 1.6;
      ctx.fillRect(x, -52, wdt, 84);
      x += wdt + 3.4;
      k++;
    }
    text(data.id.number, 0, 58, '700 21px monospace', INK, 'center');
    text('SPECIMEN', 0, 88, '600 15px sans-serif', MEM, 'center');
  }

  function drawTransfers(t, rel, cardCenterY) {
    // dashed connectors + travelling field ghosts during each transfer window
    for (var k = 0; k < TRANSFERS.length; k++) {
      var tr = TRANSFERS[k];
      var start = TRANSFER_T0 + k * TRANSFER_STEP;
      var p = (rel - start) / TRANSFER_DUR;
      if (p < 0 || p > 1) continue;
      var pose = cardPose(tr.card, t);
      var src = localToWorld(pose, SRC_LOCAL[tr.card].x, SRC_LOCAL[tr.card].y);
      var dst = { x: STAND.x + tr.dst.x, y: cardCenterY + tr.dst.y };
      ctx.save();
      ctx.strokeStyle = INK;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 3;
      ctx.setLineDash([11, 9]);
      ctx.lineDashOffset = -rel * 46;
      ctx.beginPath();
      ctx.moveTo(src.x, src.y);
      ctx.lineTo(dst.x, dst.y);
      ctx.stroke();
      ctx.setLineDash([]);
      var gx = lerp(src.x, dst.x, easeInOutCubic(p));
      var gy = lerp(src.y, dst.y, easeInOutCubic(p));
      ctx.globalAlpha = 0.95;
      ctx.translate(gx, gy);
      if (tr.kind === 'photo') {
        drawPhotoSlot(0, 0, 40, 54, INK);
      } else if (tr.kind === 'portrait') {
        drawPortrait(0, 0, 20, 27);
      } else if (tr.kind === 'name') {
        text('NAME: ' + data.id.name, 0, 0, '700 20px sans-serif', INK, 'center');
      } else if (tr.kind === 'number') {
        text(data.id.number, 0, 0, '700 19px monospace', INK, 'center');
      } else if (tr.kind === 'expiry') {
        text(data.id.expiry, 0, 0, '600 18px sans-serif', INK, 'center');
      }
      ctx.restore();
    }
  }

  function drawFinishedCard(t) {
    if (asmT0 === null) return;
    var rel = t - asmT0;
    // slide out of the machine slot, then settle on the stand
    var slideP = clamp01(rel / SLIDE_DUR);
    var cy = lerp(MACHINE.y + 30, STAND.y, easeInOutCubic(slideP));
    if (rel < DONE_T) {
      ctx.save();
      ctx.translate(STAND.x, cy);
      drawIDFront(t, rel);
      ctx.restore();
      if (slideP >= 1) drawTransfers(t, rel, cy);
      return;
    }
    // settled: handle flip
    var sx = 1, back = showingBack;
    if (flipT0 !== null) {
      var fp = clamp01((t - flipT0) / 0.7);
      sx = Math.cos(fp * Math.PI);
      back = sx < 0 ? !showingBack : showingBack;
      if (fp >= 1) { showingBack = !showingBack; flipT0 = null; sx = 1; back = showingBack; }
    }
    ctx.save();
    ctx.translate(STAND.x, STAND.y);
    ctx.scale(sx, 1);
    if (back) { ctx.scale(-1, 1); drawIDBack(); }
    else drawIDFront(t, DONE_T);
    ctx.restore();
  }

  function measure() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 1000; h = 1000; }
    return { w: w, h: h };
  }

  function draw(t) {
    var m = measure();
    var w = m.w, h = m.h;
    var dpr = 1;
    if (typeof window !== 'undefined' && window.devicePixelRatio) {
      dpr = Math.min(window.devicePixelRatio, 2);
    }
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = TABLE;
    ctx.fillRect(0, 0, w, h);

    // design space: 1000 x 1000 square fitted to the smaller dimension, centered
    var U = Math.min(w, h);
    var scale = U / 1000;
    ctx.translate(w / 2, h / 2);
    ctx.scale(scale, scale);

    drawMachine(t);
    drawStand();

    // spilled cards
    for (var i = 0; i < 5; i++) {
      var pose = cardPose(i, t);
      ctx.save();
      ctx.translate(pose.x, pose.y);
      ctx.rotate(pose.rot * Math.PI / 180);
      drawCardFace(i);
      ctx.restore();
    }

    drawFinishedCard(t);
    drawWallet();
  }

  // Interaction: taps only, recorded against the same elapsed clock
  function toDesign(e) {
    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;
    var m = measure();
    var U = Math.min(m.w, m.h);
    var scale = U / 1000;
    return { x: (px - m.w / 2) / scale, y: (py - m.h / 2) / scale };
  }
  function inRect(p, cx, cy, w, h) {
    return Math.abs(p.x - cx) <= w / 2 && Math.abs(p.y - cy) <= h / 2;
  }
  canvas.addEventListener('pointerdown', function (e) {
    var t = elapsed();
    if (isAssembling(t)) return; // the assembly is the show: taps wait
    var p = toDesign(e);
    // finished card: flip
    if (isDone(t) && flipT0 === null && inRect(p, STAND.x, STAND.y, ID_W, ID_H)) {
      flipT0 = t;
      return;
    }
    // machine: assemble
    if (inRect(p, MACHINE.x, MACHINE.y, MACHINE.w, MACHINE.h)) {
      asmT0 = t;
      flipT0 = null;
      showingBack = false;
      draw(t);
      return;
    }
    // wallet: spill a fresh seeded set
    if (inRect(p, WALLET.x, WALLET.y, WALLET.w + 30, WALLET.h + 30)) {
      epoch += 1;
      data = genEpoch(epoch);
      spillT0 = t;
      asmT0 = null;
      flipT0 = null;
      showingBack = false;
      draw(t);
    }
  });

  function onResize() { draw(elapsed()); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
    window.addEventListener('resize', onResize);
  }

  // Frame one: synchronous draw at t = 0 (constant phase, no wall clock)
  draw(0);

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(elapsed());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
