<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hue Tornado</title>
<style>
html, body { margin: 0; padding: 0; background: #0d0d0d; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var SEP = '#0d0d0d';
var BASE = TAU / 120;
var NRINGS = 26;
var NSEG_DESK = 30;
var NSEG_MOB = 24;
var HUE_R = 0.55;
var HUE_T = 4;
var SPIN_MAX = 2.5;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(1553000);
var CXF = 0.60 + rng() * 0.06;
var CYF = 0.38 + rng() * 0.05;
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var rot = 0, spin = 0, spinTarget = 0, dragVel = 0;
var dragging = false, lastAng = 0, lastMoveTs = 0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function isPhone() {
  var w = 0, h = 0;
  if (typeof window !== 'undefined' && window.screen) { w = window.screen.width; h = window.screen.height; }
  if (w && h) {
    if (Math.min(w, h) < 700) return true;
    return h > w * 1.15;
  }
  return false;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function stateAt(t) {
  var cx = CXF * VW, cy = CYF * VH;
  var corners = [
    Math.sqrt(cx * cx + cy * cy),
    Math.sqrt((VW - cx) * (VW - cx) + cy * cy),
    Math.sqrt(cx * cx + (VH - cy) * (VH - cy)),
    Math.sqrt((VW - cx) * (VW - cx) + (VH - cy) * (VH - cy))
  ];
  var rmax = Math.max(corners[0], corners[1], corners[2], corners[3]);
  var step = rmax / NRINGS;
  var nseg = isPhone() ? NSEG_MOB : NSEG_DESK;
  var minDim = Math.min(VW, VH);
  var sepW = isPhone() ? 1 : Math.max(1, 0.0022 * minDim);
  return { cx: cx, cy: cy, rmax: rmax, step: step, nseg: nseg, sepW: sepW };
}
function publishHook(t, st) {
  if (typeof window !== 'undefined') {
    window.__p1553 = {
      t: t, rot: rot, spin: spin, spinTarget: spinTarget,
      dragging: dragging, dragVel: dragVel, base: BASE,
      cx: st.cx, cy: st.cy, rmax: st.rmax
    };
  }
}
function draw(t) {
  var dt = t - lastT;
  if (dt < 0) dt = 0;
  if (dt > 0.1) dt = 0.1;
  lastT = t;
  var k = 1 - Math.exp(-3 * dt);
  spin += (spinTarget - spin) * k;
  rot += (BASE + spin) * dt;
  size();
  var st = stateAt(t);
  ctx.fillStyle = SEP;
  ctx.fillRect(0, 0, VW, VH);
  ctx.strokeStyle = SEP;
  ctx.lineWidth = st.sepW;
  var dSeg = TAU / st.nseg;
  for (var i = 0; i < NRINGS; i++) {
    var r0 = i * st.step, r1 = (i + 1) * st.step;
    var rMid = (i + 0.5) * st.step;
    for (var j = 0; j < st.nseg; j++) {
      var a0 = j * dSeg + rot, a1 = (j + 1) * dSeg + rot;
      var hue = (a0 * 180 / Math.PI + rMid * HUE_R + t * HUE_T) % 360;
      if (hue < 0) hue += 360;
      ctx.fillStyle = 'hsl(' + Math.round(hue) + ',85%,55%)';
      ctx.beginPath();
      if (i === 0) {
        ctx.moveTo(st.cx, st.cy);
        ctx.arc(st.cx, st.cy, r1, a0, a1);
      } else {
        ctx.moveTo(st.cx + r0 * Math.cos(a0), st.cy + r0 * Math.sin(a0));
        ctx.arc(st.cx, st.cy, r1, a0, a1);
        ctx.arc(st.cx, st.cy, r0, a1, a0, true);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }
  publishHook(t, st);
}
function pointerAngle(e, st) {
  return Math.atan2(e.clientY - st.cy, e.clientX - st.cx);
}
function onDown(e) {
  var st = stateAt(lastT);
  dragging = true;
  dragVel = 0;
  lastAng = pointerAngle(e, st);
  lastMoveTs = (typeof e.timeStamp === 'number' && isFinite(e.timeStamp)) ? e.timeStamp : lastT * 1000;
  spinTarget = 0;
  publishHook(lastT, st);
}
function onMove(e) {
  if (!dragging) return;
  var st = stateAt(lastT);
  var ang = pointerAngle(e, st);
  var d = ang - lastAng;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  var ts = (typeof e.timeStamp === 'number' && isFinite(e.timeStamp)) ? e.timeStamp : lastT * 1000;
  var dtMs = ts - lastMoveTs;
  if (!(dtMs > 0) || dtMs > 500) dtMs = 16.7;
  var inst = d / (dtMs / 1000);
  dragVel = 0.65 * dragVel + 0.35 * inst;
  spinTarget = clamp(Math.abs(dragVel), 0, SPIN_MAX);
  lastAng = ang;
  lastMoveTs = ts;
  publishHook(lastT, st);
}
function onUp(e) {
  dragging = false;
  dragVel = 0;
  spinTarget = 0;
  publishHook(lastT, stateAt(lastT));
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
