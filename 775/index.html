<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Earth</title>
<style>
  html, body { margin: 0; padding: 0; background: #060607; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- Palette (strict) ----
  var PIT   = [6, 6, 7];        // #060607 deep pit black
  var BASE  = [14, 14, 16];     // #0E0E10 slab base
  var SHEEN = [42, 42, 46];     // #2A2A2E sheen
  var WARM  = [74, 66, 56];     // #4A4238 warm highlight at glancing angles

  // ---- Seeded RNG: mulberry32 ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- Ripple field: sum of seeded low-frequency sine fields (finger ripples) ----
  // h(u,v) = sum_i A_i * sin(2 * PI * f_i * (dx_i*u + dy_i*v) + phase_i)
  // Gradient is analytic; it is precomputed on the draw grid at layout time.
  var WAVES = [];
  (function buildWaves() {
    var rnd = mulberry32(77500137);
    var defs = [
      { f: 2.1, a: 1.00 },
      { f: 3.4, a: 0.62 },
      { f: 5.2, a: 0.38 },
      { f: 7.9, a: 0.20 }
    ];
    for (var i = 0; i < defs.length; i++) {
      var ang = rnd() * Math.PI * 2;
      WAVES.push({
        dx: Math.cos(ang), dy: Math.sin(ang),
        f: defs[i].f * (0.85 + rnd() * 0.3),
        a: defs[i].a,
        ph: rnd() * Math.PI * 2
      });
    }
  })();

  function heightAt(u, v) {
    var h = 0;
    for (var i = 0; i < WAVES.length; i++) {
      var w = WAVES[i];
      h += w.a * Math.sin(2 * Math.PI * w.f * (w.dx * u + w.dy * v) + w.ph);
    }
    return h;
  }
  function gradAt(u, v) {
    var gx = 0, gy = 0;
    for (var i = 0; i < WAVES.length; i++) {
      var w = WAVES[i];
      var c = w.a * 2 * Math.PI * w.f * Math.cos(2 * Math.PI * w.f * (w.dx * u + w.dy * v) + w.ph);
      gx += c * w.dx; gy += c * w.dy;
    }
    return [gx, gy];
  }

  // Broad tonal undulation (very low frequency) so the glaze is never flat.
  var BROAD = (function () {
    var rnd = mulberry32(77500911);
    var a1 = rnd() * Math.PI * 2, a2 = rnd() * Math.PI * 2;
    return { dx: Math.cos(a1), dy: Math.sin(a1), ph: rnd() * Math.PI * 2,
             dx2: Math.cos(a2), dy2: Math.sin(a2), ph2: rnd() * Math.PI * 2 };
  })();
  function broadAt(u, v) {
    return 0.5 + 0.30 * Math.sin(2 * Math.PI * 0.9 * (BROAD.dx * u + BROAD.dy * v) + BROAD.ph)
               + 0.20 * Math.sin(2 * Math.PI * 1.7 * (BROAD.dx2 * u + BROAD.dy2 * v) + BROAD.ph2);
  }

  // ---- Shade ramp: quantized palette steps driven by the specular term ----
  // s in [-1, 1]: troughs fall to pit black, aligned slopes rise through base
  // and sheen, and the steepest glancing facets pick up the warm highlight.
  var STOPS = [
    { p: -1.00, c: PIT },
    { p: -0.38, c: PIT },
    { p: -0.08, c: BASE },
    { p:  0.22, c: BASE },
    { p:  0.48, c: SHEEN },
    { p:  0.78, c: WARM },
    { p:  1.00, c: WARM }
  ];
  var LEVELS = 20;
  var rampCache = [];
  function rampColor(s) {
    var q = Math.round(((s + 1) / 2) * (LEVELS - 1));
    if (rampCache[q]) return rampCache[q];
    var x = (q / (LEVELS - 1)) * 2 - 1;
    var c = STOPS[STOPS.length - 1].c;
    for (var i = 0; i < STOPS.length - 1; i++) {
      var a = STOPS[i], b = STOPS[i + 1];
      if (x >= a.p && x <= b.p) {
        var t = (x - a.p) / (b.p - a.p);
        c = [0, 1, 2].map(function (k) { return Math.round(a.c[k] + (b.c[k] - a.c[k]) * t); });
        break;
      }
    }
    var str = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    rampCache[q] = str;
    return str;
  }

  // ---- Viewport sizing (Visual Viewport API) ----
  var W = 0, H = 0, isPhone = false;
  function measure() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 0);
    var h = vv ? vv.height : (window.innerHeight || 0);
    W = Math.max(1, Math.round(w)); H = Math.max(1, Math.round(h));
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  }

  // ---- Perspective: the slab fills the frame edge to edge; the field is
  // sampled through a floor-plane warp (top edge narrower: at the top the
  // view takes in a wider, vertically compressed span of the surface).
  function warpU(u, v) { return 0.5 + (u - 0.5) * (1.38 - 0.38 * v); }
  function warpV(v) { return 1 - Math.pow(1 - v, 1.45); }

  // ---- Draw grid: gradient precomputed per layout at the warped samples ----
  var grid = null; // { cols, rows, gx[], gy[], broad[] }
  function buildGrid() {
    var cell = isPhone ? 13 : 11;
    var cols = Math.max(24, Math.ceil(W / cell));
    var rows = Math.max(24, Math.ceil(H / cell));
    var n = cols * rows;
    var gx = new Float32Array(n), gy = new Float32Array(n), br = new Float32Array(n);
    var sumM = 0;
    var i, u, v, g;
    for (var r = 0; r < rows; r++) {
      v = (r + 0.5) / rows;
      var wv = warpV(v);
      for (var c = 0; c < cols; c++) {
        u = (c + 0.5) / cols;
        var wu = warpU(u, v);
        g = gradAt(wu, wv);
        i = r * cols + c;
        gx[i] = g[0]; gy[i] = g[1];
        sumM += Math.sqrt(g[0] * g[0] + g[1] * g[1]);
        br[i] = broadAt(wu, wv);
      }
    }
    // Normalize by the mean gradient magnitude so typical facets spread
    // across the whole ramp instead of huddling at its dark end.
    var scale = 1 / ((sumM / n) * 1.35);
    for (i = 0; i < n; i++) { gx[i] *= scale; gy[i] *= scale; }
    grid = { cols: cols, rows: rows, gx: gx, gy: gy, broad: br };
  }

  function layout() {
    measure();
    canvas.width = W; canvas.height = H;
    buildGrid();
  }

  // ---- Light: one slow 35 s pass (idle), drag takes the lamp ----
  var PASS = 35; // seconds, across and back
  function idleAzimuth(t) {
    // Phase 0: raking from the left. Sweeps across and back over one pass.
    var ph = (t % PASS) / PASS;              // 0..1
    var tri = ph < 0.5 ? ph * 2 : 2 - ph * 2; // 0..1..0
    // Azimuth of the light direction in slab space: starts pointing from the
    // left (light travels +x, slightly downward), ends from the right.
    return Math.PI * (0.92 - 0.84 * tri) + 0.55 * Math.sin(ph * Math.PI * 2);
  }

  var drag = { active: false, az: 0, blendFrom: 0, blendStart: -10, blending: false };
  function currentAzimuth(t) {
    var idle = idleAzimuth(t);
    if (drag.active) return drag.az;
    if (drag.blending) {
      var k = (t - drag.blendStart) / 1.6;
      if (k >= 1) { drag.blending = false; return idle; }
      var s = k * k * (3 - 2 * k);
      var d = idle - drag.blendFrom;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return drag.blendFrom + d * s;
    }
    return idle;
  }

  function pointerAzimuth(x, y) {
    // The lamp sits where the hand is: light direction points from the
    // pointer toward the slab center, kept in slab uv orientation.
    var cx = W / 2, cy = H / 2;
    return Math.atan2(-(y - cy), x - cx);
  }

  function onDown(e) {
    var p = e; if (e.touches && e.touches[0]) p = e.touches[0];
    drag.active = true; drag.blending = false;
    drag.az = pointerAzimuth(p.clientX, p.clientY);
  }
  function onMove(e) {
    if (!drag.active) return;
    var p = e; if (e.touches && e.touches[0]) p = e.touches[0];
    drag.az = pointerAzimuth(p.clientX, p.clientY);
  }
  function onUp(tNow) {
    if (!drag.active) return;
    drag.active = false;
    drag.blendFrom = drag.az;
    drag.blendStart = tNow;
    drag.blending = true;
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = 'rgb(6,6,7)';
    ctx.fillRect(0, 0, W, H);
    if (!grid) return;

    var az = currentAzimuth(t);
    var lx = Math.cos(az), ly = Math.sin(az);
    // Elevation breath within the pass: mid-pass the rake is shallower and
    // the field reads a touch brighter; at the ends it goes low and dark.
    var ph = (t % PASS) / PASS;
    var elev = drag.active || drag.blending ? 1 : (0.9 + 0.26 * Math.sin(ph * Math.PI));

    var cols = grid.cols, rows = grid.rows;
    var gx = grid.gx, gy = grid.gy, br = grid.broad;
    var cw = W / cols, ch = H / rows;

    for (var r = 0; r < rows; r++) {
      var y = r * ch;
      for (var c = 0; c < cols; c++) {
        var i = r * cols + c;
        // Specular term: alignment of the surface gradient with the light.
        var s = -(gx[i] * lx + gy[i] * ly);
        s = s * elev * (0.8 + 0.45 * br[i]);
        if (s > 1) s = 1; if (s < -1) s = -1;
        ctx.fillStyle = rampColor(s);
        ctx.fillRect(c * cw, y, cw + 1, ch + 1);
      }
    }
  }

  // ---- Boot: frame one is the synchronous draw at pass t = 0 ----
  layout();
  draw(0);

  // ---- Interaction (drag moves the light; the slab never moves) ----
  var startStamp = null;
  function elapsed() {
    if (startStamp === null) return 0;
    return (performance.now() - startStamp) / 1000;
  }
  canvas.addEventListener('pointerdown', onDown);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', function () { onUp(elapsed()); });
    window.addEventListener('resize', function () { layout(); draw(elapsed()); });
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { layout(); draw(elapsed()); });
  }

  // ---- Animation loop (guarded; QA renderer has no rAF) ----
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (ts) {
      if (startStamp === null) startStamp = ts;
      draw((ts - startStamp) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
