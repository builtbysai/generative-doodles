<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detritus Diptych</title>
<style>
  html, body { margin: 0; padding: 0; background: #0D0D0D; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var BLACK = '#0D0D0D', PAPER = '#F2F0EA', GRAY1 = '#8A8A86', GRAY2 = '#3A3A38', AMBER = '#C8871E';
  var CYCLE = 20; // seconds per build cycle

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Scene generator: same object list feeds both panels; only the rendering style differs.
  function sceneFor(index) {
    var rng = mulberry32(1305000 + index * 7919);
    var types = ['can', 'glue', 'fork', 'knife', 'bag', 'spool', 'box'];
    var n = 4 + Math.floor(rng() * 3);
    var objs = [];
    for (var i = 0; i < n; i++) {
      var j = [];
      for (var k = 0; k < 8; k++) j.push(rng() * 2 - 1);
      objs.push({
        type: types[Math.floor(rng() * types.length)],
        x: 0.10 + i * (0.80 / n) + rng() * 0.05,
        s: 0.13 + rng() * 0.07,
        j: j
      });
    }
    var flats = [];
    for (var f = 0; f < 2; f++) {
      flats.push({ x: 0.05 + rng() * 0.7, w: 0.18 + rng() * 0.14, h: 0.42 + rng() * 0.22 });
    }
    var amber = Math.floor(rng() * n);
    // The amber accent must always be visible: force the amber object to a type that carries an amber band.
    objs[amber].type = (rng() < 0.5) ? 'can' : 'spool';
    return { objs: objs, flats: flats, amber: amber };
  }

  // Seeded swap flag per cycle: cycle 0 always crude-left, matching the prompt description.
  function swappedFor(cycle) {
    if (cycle <= 0) return false;
    return mulberry32(1305000 + cycle * 104729)() < 0.35;
  }

  // Seeded glitch offset for glitch index g (glitches at most one per 3.1 s, never a full-frame flash).
  function glitchOffset(g) {
    var rng = mulberry32(777000 + g * 7919);
    return (rng() * 2 - 1) * 12;
  }

  var W = 0, H = 0, phone = false, booted = false, lastT = 0;
  var taps = []; // double-tap events: { t } in piece time
  var lastTap = null;

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var minDim = 1e9;
    if (typeof window !== 'undefined' && window.screen) {
      minDim = Math.min(window.screen.width, window.screen.height);
    } else { minDim = Math.min(W, H); }
    phone = minDim < 700 || H > W * 1.15;
  }

  function layout() {
    var cw, ch, cx, cy;
    if (phone) { cw = W; ch = H; cx = 0; cy = 0; }
    else {
      cw = Math.min(W * 0.9, H * 1.8);
      ch = cw / 2; cx = (W - cw) / 2; cy = (H - ch) / 2;
    }
    var pw = cw * 0.47, seamW = cw * 0.06;
    return {
      cx: cx, cy: cy, cw: cw, ch: ch,
      left: { x: cx, y: cy + ch * 0.08, w: pw, h: ch * 0.80 },
      right: { x: cx + cw * 0.53, y: cy + ch * 0.13, w: pw, h: ch * 0.74 },
      seam: { x: cx + cw * 0.47, y: cy + ch * 0.08, w: seamW, h: ch * 0.80 }
    };
  }

  function ellipsePath(x, y, rx, ry) {
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  }

  // Draw one detritus object. Panel-local: origin at floor point, s = size in px.
  // style 'crude': jittered polygon, heavy offset shadow, hatch. style 'clean': precise paths.
  function drawObject(o, x, floorY, s, style, isAmber) {
    var j = o.j;
    ctx.save();
    ctx.translate(x, floorY);
    var ink = (style === 'crude') ? BLACK : PAPER;
    var fill = (style === 'crude') ? GRAY2 : GRAY1;
    var jit = function (v, k) { return style === 'crude' ? v + j[k % 8] * s * 0.06 : v; };
    if (style === 'crude') {
      // Harsh-light offset shadow, flat alpha.
      ctx.fillStyle = 'rgba(13,13,13,0.35)';
      ctx.save(); ctx.translate(s * 0.08, s * 0.05);
      ctx.beginPath(); ctx.rect(-s * 0.35, -s * 1.1, s * 0.7, s * 1.1); ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = ink; ctx.fillStyle = fill; ctx.lineWidth = Math.max(1.5, s * 0.03);
    ctx.beginPath();
    if (o.type === 'can') {
      var cw2 = s * 0.7, ch2 = s * 1.1;
      ctx.moveTo(jit(-cw2 / 2, 0), 0);
      ctx.lineTo(jit(-cw2 / 2, 1), -ch2);
      ctx.lineTo(jit(cw2 / 2, 2), -ch2);
      ctx.lineTo(jit(cw2 / 2, 3), 0);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ellipsePath(0, -ch2, cw2 / 2, s * 0.12); ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
      if (isAmber) { ctx.beginPath(); ctx.rect(-cw2 / 2, -ch2 * 0.55, cw2, ch2 * 0.22); ctx.fillStyle = AMBER; ctx.fill(); }
    } else if (o.type === 'glue') {
      var gw = s * 0.45, gh = s * 1.25;
      ctx.moveTo(jit(-gw / 2, 0), 0); ctx.lineTo(jit(-gw / 2, 1), -gh);
      ctx.lineTo(jit(gw / 2, 2), -gh); ctx.lineTo(jit(gw / 2, 3), 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.rect(-gw * 0.62, -gh - s * 0.22, gw * 1.24, s * 0.22); ctx.fill(); ctx.stroke();
    } else if (o.type === 'fork') {
      ctx.moveTo(jit(-s * 0.12, 0), 0); ctx.lineTo(jit(-s * 0.12, 1), -s * 0.9);
      ctx.lineTo(jit(s * 0.12, 2), -s * 0.9); ctx.lineTo(jit(s * 0.12, 3), 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      for (var t = 0; t < 4; t++) {
        var tx = -s * 0.16 + t * s * 0.11;
        ctx.beginPath(); ctx.rect(jit(tx, t), -s * 1.25, s * 0.06, s * 0.38); ctx.fill(); ctx.stroke();
      }
    } else if (o.type === 'knife') {
      ctx.moveTo(jit(-s * 0.10, 0), 0); ctx.lineTo(jit(-s * 0.10, 1), -s * 0.7);
      ctx.lineTo(jit(s * 0.10, 2), -s * 0.7); ctx.lineTo(jit(s * 0.10, 3), 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(jit(-s * 0.10, 4), -s * 0.7); ctx.lineTo(jit(s * 0.10, 5), -s * 0.7);
      ctx.lineTo(jit(s * 0.02, 6), -s * 1.35); ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else if (o.type === 'bag') {
      ctx.moveTo(0, -s * 0.5);
      for (var b = 0; b < 8; b++) {
        var a = (b / 8) * Math.PI * 2;
        var r = s * (0.42 + j[b] * 0.12);
        ctx.lineTo(Math.cos(a) * r, -s * 0.5 + Math.sin(a) * r * 0.8);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (o.type === 'spool') {
      var sw = s * 0.6, sh = s * 0.9;
      ctx.moveTo(jit(-sw / 2, 0), 0); ctx.lineTo(jit(-sw / 2, 1), -sh);
      ctx.lineTo(jit(sw / 2, 2), -sh); ctx.lineTo(jit(sw / 2, 3), 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.rect(-sw * 0.62, -sh * 0.18, sw * 1.24, s * 0.14); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.rect(-sw * 0.62, -sh - s * 0.05, sw * 1.24, s * 0.14); ctx.fill(); ctx.stroke();
      if (isAmber) { ctx.beginPath(); ctx.rect(-sw / 2, -sh * 0.62, sw, sh * 0.28); ctx.fillStyle = AMBER; ctx.fill(); }
    } else { // box
      var bw = s * 0.85, bh = s * 0.8;
      ctx.moveTo(jit(-bw / 2, 0), 0); ctx.lineTo(jit(-bw / 2, 1), -bh);
      ctx.lineTo(jit(bw / 2, 2), -bh); ctx.lineTo(jit(bw / 2, 3), 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(jit(-bw / 2, 4), -bh); ctx.lineTo(jit(0, 5), -bh - s * 0.3); ctx.lineTo(jit(bw / 2, 6), -bh);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    if (style === 'crude') {
      // Rough hatch across the object.
      ctx.strokeStyle = 'rgba(13,13,13,0.5)'; ctx.lineWidth = Math.max(1, s * 0.02);
      ctx.beginPath();
      for (var h = 0; h < 3; h++) {
        var hy = -s * (0.25 + h * 0.3);
        ctx.moveTo(jit(-s * 0.3, h), hy); ctx.lineTo(jit(s * 0.3, h + 3), hy - s * 0.08);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPanel(p, scene, style, t) {
    // Ground travels with the style: crude side is paper, clean side is black.
    ctx.fillStyle = (style === 'crude') ? PAPER : BLACK;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.strokeStyle = (style === 'crude') ? BLACK : PAPER;
    ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.w, p.h);
    var floorY = p.y + p.h * 0.78;
    // Set flats (backdrop rectangles).
    ctx.fillStyle = (style === 'crude') ? GRAY1 : GRAY2;
    for (var f = 0; f < scene.flats.length; f++) {
      var fl = scene.flats[f];
      ctx.fillRect(p.x + p.w * fl.x, floorY - p.h * fl.h, p.w * fl.w, p.h * fl.h);
    }
    // Floor line.
    ctx.strokeStyle = (style === 'crude') ? BLACK : PAPER;
    ctx.lineWidth = Math.max(1.5, p.w * 0.004);
    ctx.beginPath(); ctx.moveTo(p.x, floorY); ctx.lineTo(p.x + p.w, floorY); ctx.stroke();
    // Handheld jitter on the crude side only: tiny whole-scene shift, slow sine.
    var jx = 0, jy = 0;
    if (style === 'crude') {
      jx = Math.sin(t * 7.3) * p.w * 0.002;
      jy = Math.cos(t * 5.1) * p.w * 0.0015;
    }
    for (var i = 0; i < scene.objs.length; i++) {
      var o = scene.objs[i];
      drawObject(o, p.x + p.w * o.x + jx, floorY + jy, p.w * o.s, style, i === scene.amber);
    }
  }

  function drawSeam(s, t) {
    // Slow shimmer; glitch slices at most one event per 3.1 s, each 0.35 s long, never full-frame.
    var shimmer = 0.85 + 0.15 * Math.sin(t * 0.9);
    var period = 3.1, ph = t % period;
    var glitching = ph < 0.35;
    var g = Math.floor(t / period);
    var off = glitching ? glitchOffset(g) : 0;
    ctx.fillStyle = PAPER;
    ctx.globalAlpha = shimmer;
    if (!glitching) {
      ctx.fillRect(s.x, s.y, s.w, s.h);
    } else {
      var bands = 3, bh = s.h / bands;
      for (var b = 0; b < bands; b++) {
        var bo = (b === 1) ? off : (b === 2 ? -off * 0.5 : 0);
        ctx.fillRect(s.x + bo, s.y + b * bh, s.w, bh);
      }
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = BLACK; ctx.lineWidth = 1.5;
    ctx.strokeRect(s.x, s.y, s.w, s.h);
  }

  function draw(t) {
    lastT = t;
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);
    var L = layout();
    var cycle = Math.floor(t / CYCLE);
    var tapCount = 0;
    for (var i = 0; i < taps.length; i++) if (taps[i].t <= t) tapCount++;
    var scene = sceneFor(cycle + tapCount);
    var swapped = swappedFor(cycle);
    var leftStyle = swapped ? 'clean' : 'crude';
    var rightStyle = swapped ? 'crude' : 'clean';
    drawPanel(L.left, scene, leftStyle, t);
    drawPanel(L.right, scene, rightStyle, t);
    drawSeam(L.seam, t);
  }

  function onResize() {
    size();
    if (booted) draw(lastT);
  }

  size();
  draw(0);
  booted = true;

  canvas.addEventListener('pointerdown', function (e) {
    var now = lastT;
    var x = (e.clientX !== undefined) ? e.clientX : 0;
    var y = (e.clientY !== undefined) ? e.clientY : 0;
    if (lastTap && now - lastTap.t < 0.4) {
      var dx = x - lastTap.x, dy = y - lastTap.y;
      if (dx * dx + dy * dy < 1600) {
        taps.push({ t: now });
        lastTap = null;
        return;
      }
    }
    lastTap = { t: now, x: x, y: y };
  });

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) window.addEventListener('resize', onResize);
  }
  if (typeof requestAnimationFrame === 'function' && typeof performance !== 'undefined' && performance.now) {
    var t0 = null;
    function loop(ts) {
      if (t0 === null) t0 = ts;
      draw((ts - t0) / 1000);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
