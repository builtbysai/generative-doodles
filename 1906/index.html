<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1906 Compose, Scomponi, Ricombina</title>
<style>
  html, body { margin: 0; padding: 0; background: #fbfaf6; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette from the prompt: paper white ground, ink black voice,
  // signal red electronics, pencil grey fragments, warm sepia palimpsest.
  var PAPER = '#fbfaf6';
  var INK = '#1c1a17';
  var INK_DIM = '#6b675f';
  var RED = '#c8341f';
  var RED_SOFT = '#e07a63';
  var GREY = '#8a867e';
  var GREY_FAINT = '#b5b1a8';
  var SEPIA = '#8a6b45';
  var SEPIA_FAINT = '#b39a7a';
  var TABLE = '#e9e2d2';
  var TABLE_EDGE = '#cfc4a8';

  // Fixed-phase first frame: t = 14 s, cycle 1, orbit phase. The first line
  // is already shredded and its fragments orbit the desk; the palimpsest
  // already holds one seed line, the recombination of the arrival line.
  // The whole state is a pure function of t, so frame one is reproducible.
  var FIRST_T = 14;
  var CYCLE = 24;             // seconds per cycle: read, shred, orbit, recombine
  var READ_END = 5;
  var SHRED_END = 10;
  var ORBIT_END = 17;

  // Original migration-poem lines, written for this piece. No real poet
  // names, no quoted published poetry.
  var LINES = [
    'I packed the house into one suitcase.',
    'The border asked my name in three tongues.',
    'My mother sewed the map into my coat.',
    'We crossed at dawn with bread and salt.',
    'The train kept my village in its window.',
    'A new street learned to say my name.',
    'I carry the river in a paper cup.'
  ];

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  // Cycle state. A tap lays a fresh line: the cycle number rises, the line
  // index advances, and the clock restarts at the read phase.
  var cycleStart = 0;
  var cycleNum = 1;
  var lineIdx = 0;
  var now = FIRST_T;

  // QA hook: ?tap=1 simulates a tap having laid a fresh line, so a
  // post-tap frame can be rendered headlessly.
  var tapProbe = false;
  try {
    var locSearch = '';
    if (typeof location !== 'undefined' && location.search) { locSearch = location.search; }
    if (!locSearch && typeof window !== 'undefined' && window.location) { locSearch = window.location.search || ''; }
    tapProbe = /tap=1/.test(locSearch);
  } catch (e) { tapProbe = false; }
  if (tapProbe) {
    cycleNum = 2;
    lineIdx = 1;
    cycleStart = 0;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(u) { return u * u * (3 - 2 * u); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      // Field-like composition: square on desktop, page ground is the
      // piece's own paper white.
      var side = Math.min(vw, vh) * 0.88;
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Split a word into syllable-like fragments at vowel groups.
  function syllables(word) {
    var vowels = 'aeiouAEIOU';
    var out = [], cur = '', i, ch;
    for (i = 0; i < word.length; i++) {
      ch = word[i];
      cur += ch;
      if (vowels.indexOf(ch) >= 0 && cur.length >= 2 && i < word.length - 1) {
        out.push(cur); cur = '';
      }
    }
    if (cur) { out.push(cur); }
    if (out.length === 0) { out.push(word); }
    return out;
  }

  // All fragments of a line, in reading order, with their word index.
  function lineFragments(idx) {
    var words = LINES[idx].replace(/[.,]/g, '').split(' ');
    var frags = [], i, j, syl;
    for (i = 0; i < words.length; i++) {
      syl = syllables(words[i]);
      for (j = 0; j < syl.length; j++) {
        frags.push({ text: syl[j], word: i, inWord: j, wordCount: syl.length });
      }
    }
    return frags;
  }

  // Recombine a line by a slot/template grammar: a fixed template with
  // noun-phrase and prepositional-phrase slots filled from small pools.
  // Every template is grammatical by construction (fixed verb agreement
  // and word order; slots are only noun phrases or prepositional phrases),
  // so no recombination can come out as word salad. Deterministic for a
  // given line and cycle seed. A result that lands on a corpus line
  // verbatim is rebuilt from the next template.
  var OBJ = ['the river', 'my village', 'the map', 'bread and salt', 'my name', 'one suitcase', 'the house'];
  var PACK_OBJ = ['the river', 'my village', 'the map', 'bread and salt', 'my name', 'the house'];
  var SEW_OBJ = ['the map', 'my name', 'the river', 'my village'];
  var PREP = ['in a paper cup', 'through the morning', 'across the border', 'into my coat', 'at dawn', 'in three tongues'];
  var DAY_PREP = ['at dawn', 'through the morning', 'in three tongues'];
  var PLACE = ['border', 'train', 'new street', 'station', 'river'];
  var KEEP_PLACE = ['The train', 'The station', 'The border'];
  var ASK_PLACE = ['border', 'train', 'station', 'new street'];

  function pick(pool, seed) {
    return pool[Math.floor(hash(seed) * pool.length)];
  }

  function buildLine(ti, seedNum, idx) {
    var o = seedNum * 3 + idx * 5 + 12;
    var p = seedNum * 5 + idx * 7 + 12;
    var q = seedNum * 7 + idx * 11 + 12;
    if (ti === 0) { return 'I carry ' + pick(OBJ, o) + ' ' + pick(PREP, p) + '.'; }
    if (ti === 1) { return 'My mother sewed ' + pick(SEW_OBJ, o) + ' into my coat.'; }
    if (ti === 2) { return 'We crossed at dawn with ' + pick(OBJ, p) + '.'; }
    if (ti === 3) { return 'The ' + pick(PLACE, q) + ' learned to say my name.'; }
    if (ti === 4) { return pick(KEEP_PLACE, q) + ' kept ' + pick(OBJ, o) + ' in its window.'; }
    if (ti === 5) { return 'The ' + pick(ASK_PLACE, q) + ' asked my name in three tongues.'; }
    if (ti === 6) { return 'I packed ' + pick(PACK_OBJ, o) + ' into one suitcase.'; }
    return 'A new street learned to say my name ' + pick(DAY_PREP, p) + '.';
  }

  function recombine(idx, seedNum) {
    // Try templates in turn from the seeded start until the line is one
    // the poet never wrote; every template is grammatical, so any of them
    // is a valid result.
    var ti = (seedNum * 3 + idx) % 8;
    var k, line, l, verbatim;
    for (k = 0; k < 8; k++) {
      line = buildLine((ti + k) % 8, seedNum, idx);
      verbatim = false;
      for (l = 0; l < LINES.length; l++) {
        if (line === LINES[l]) { verbatim = true; break; }
      }
      if (!verbatim) { return line; }
    }
    return line;
  }

  // Recombined lines of completed cycles, oldest first, plus the seed line
  // from the arrival (cycle 0), which is already on the palimpsest at load.
  function palimpsestLines() {
    var out = [{ text: recombine(0, 0), age: cycleNum }];
    var j, li;
    for (j = 1; j < cycleNum; j++) {
      li = ((lineIdx - (cycleNum - j)) % LINES.length + LINES.length) % LINES.length;
      out.push({ text: recombine(li, j), age: cycleNum - j });
    }
    return out;
  }

  function fitFont(text, maxW, startFs) {
    var fs = startFs;
    ctx.font = 'italic ' + Math.round(fs) + 'px Georgia, "Times New Roman", serif';
    while (fs > 9.5 && ctx.measureText(text).width > maxW) {
      fs -= 1;
      ctx.font = 'italic ' + Math.round(fs) + 'px Georgia, "Times New Roman", serif';
    }
    return fs;
  }

  function drawVoice(x, baseY, s, t, speaking) {
    // The voice: an ink figure facing the table, one arm toward it.
    var breathe = 1 + 0.012 * Math.sin(t * 0.3);
    var headR = 12 * s * breathe;
    var headY = baseY - 104 * s;
    var shoulderY = baseY - 84 * s;
    var hipY = baseY - 14 * s;
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(x - 17 * s, shoulderY);
    ctx.quadraticCurveTo(x - 22 * s, (shoulderY + hipY) / 2, x - 19 * s, hipY);
    ctx.lineTo(x + 19 * s, hipY);
    ctx.quadraticCurveTo(x + 22 * s, (shoulderY + hipY) / 2, x + 17 * s, shoulderY);
    ctx.quadraticCurveTo(x, shoulderY - 10 * s, x - 17 * s, shoulderY);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + headR, headY);
    ctx.arc(x, headY, headR, 0, Math.PI * 2);
    ctx.fill();
    // Arm reaching toward the table.
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4.5 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + 12 * s, shoulderY + 8 * s);
    ctx.quadraticCurveTo(x + 30 * s, shoulderY + 12 * s, x + 40 * s, shoulderY + 22 * s);
    ctx.stroke();
    // Speaking arcs from the mouth while the voice reads.
    if (speaking) {
      var i, r, al;
      for (i = 0; i < 3; i++) {
        r = (10 + ((t * 14 + i * 9) % 27)) * s;
        al = a4(0.30 * (1 - r / (40 * s)));
        if (al <= 0) { continue; }
        ctx.strokeStyle = hexA(INK, al);
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(x + 12 * s, headY + 4 * s, r, -Math.PI * 0.32, Math.PI * 0.32);
        ctx.stroke();
      }
    }
    return { mouthX: x + 12 * s, mouthY: headY + 4 * s };
  }

  function drawDesk(x, baseY, s, t, swelling) {
    // The electronics desk: a signal red console with dials and an aerial.
    var topY = baseY - 62 * s;
    var w = 58 * s, h = 34 * s;
    ctx.fillStyle = RED;
    ctx.fillRect(x - w / 2, topY, w, h);
    ctx.fillStyle = PAPER;
    var i, dx;
    for (i = 0; i < 3; i++) {
      dx = (i - 1) * 16 * s;
      ctx.beginPath();
      ctx.moveTo(x + dx + 5 * s, topY + 12 * s);
      ctx.arc(x + dx, topY + 12 * s, 5 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = hexA(RED, 0.8);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + dx, topY + 12 * s);
      ctx.lineTo(x + dx + Math.cos(t * 0.4 + i * 2.1) * 5 * s, topY + 12 * s + Math.sin(t * 0.4 + i * 2.1) * 5 * s);
      ctx.stroke();
    }
    // Sliders under the dials.
    for (i = 0; i < 3; i++) {
      dx = (i - 1) * 16 * s;
      ctx.strokeStyle = hexA(PAPER, 0.7);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x + dx, topY + 22 * s);
      ctx.lineTo(x + dx, topY + 30 * s);
      ctx.stroke();
      ctx.fillStyle = PAPER;
      ctx.fillRect(x + dx - 2.5 * s, topY + (22 + hash(i + 9) * 6) * s, 5 * s, 2 * s);
    }
    // Legs.
    ctx.fillStyle = RED;
    ctx.fillRect(x - w / 2 + 3 * s, topY + h, 3 * s, baseY - topY - h);
    ctx.fillRect(x + w / 2 - 6 * s, topY + h, 3 * s, baseY - topY - h);
    // Aerial with a blinking tip, quantized to whole seconds.
    var blink = (Math.floor(t) % 2 === 0) ? 0.9 : 0.25;
    ctx.strokeStyle = RED;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(x + w / 2 - 8 * s, topY);
    ctx.lineTo(x + w / 2 + 2 * s, topY - 22 * s);
    ctx.stroke();
    ctx.fillStyle = hexA(RED, blink);
    ctx.beginPath();
    ctx.moveTo(x + w / 2 + 2 * s + 3 * s, topY - 22 * s);
    ctx.arc(x + w / 2 + 2 * s, topY - 22 * s, 3 * s, 0, Math.PI * 2);
    ctx.fill();
    // Swelling electronic bed while the recombination is spoken.
    if (swelling > 0) {
      var j, rr;
      for (j = 0; j < 3; j++) {
        rr = (18 + j * 14 + swelling * 26) * s;
        ctx.strokeStyle = hexA(RED, a4(0.22 * (1 - j / 3) * (0.4 + 0.6 * swelling)));
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(x, topY - 6 * s, rr, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    return { topX: x, topY: topY, deskX: x };
  }

  function drawTable(x0, x1, y, s, legLen) {
    // A table with a visible surface: sheen on top, a thick slab, and
    // sturdy legs that end on the figures' ground line, so it reads as
    // furniture, not a hairline.
    ctx.fillStyle = TABLE;
    ctx.fillRect(x0, y, x1 - x0, 16 * s);
    ctx.fillStyle = '#f4efe2';
    ctx.fillRect(x0, y, x1 - x0, 5 * s);
    ctx.fillStyle = TABLE_EDGE;
    ctx.fillRect(x0, y + 16 * s, x1 - x0, 2.5 * s);
    ctx.fillStyle = TABLE_EDGE;
    ctx.fillRect(x0 + 10 * s, y + 18.5 * s, 6 * s, legLen);
    ctx.fillRect(x1 - 16 * s, y + 18.5 * s, 6 * s, legLen);
  }

  function drawTag(x, y, s) {
    // A small luggage tag marking the cycle number.
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.12);
    ctx.strokeStyle = hexA(INK_DIM, 0.7);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-14 * s, 0);
    ctx.lineTo(-30 * s, -10 * s);
    ctx.stroke();
    ctx.fillStyle = PAPER;
    ctx.strokeStyle = RED;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.rect(-14 * s, -9 * s, 30 * s, 18 * s);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = RED;
    ctx.beginPath();
    ctx.moveTo(-14 * s + 4 * s, 0);
    ctx.arc(-14 * s + 4 * s, 0, 2 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = INK;
    ctx.font = '600 ' + Math.round(11 * s) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(cycleNum), -14 * s + 17 * s, 1);
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  function draw(t) {
    now = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    var s = clamp(Math.min(W, H) / 350, 0.9, 2.0);
    var u = t - cycleStart;
    // The figures are anchored to the table, not to the frame: the voice
    // head clears the table top by a fixed margin at every size, so the
    // figure never sinks behind the table on phones.
    var tableY = H * 0.50;
    var baseY = tableY + 68 * s;
    var tableX0 = W * (isPhone ? 0.08 : 0.16);
    var tableX1 = W * (isPhone ? 0.92 : 0.84);
    var voiceX = W * (isPhone ? 0.10 : 0.13);
    var deskX = W * (isPhone ? 0.80 : 0.85);
    var orbitX = deskX - 30 * s;
    var orbitY = H * 0.36;
    var lineY = tableY + 12 * s;

    var speaking = u < READ_END;
    var swelling = clamp((u - ORBIT_END) / (CYCLE - ORBIT_END), 0, 1);

    // The two agents.
    drawVoice(voiceX, baseY, s, t, speaking);
    drawDesk(deskX, baseY, s, t, swelling);

    // The table between them, legs ending on the ground line.
    drawTable(tableX0, tableX1, tableY, s, baseY - tableY - 18.5 * s);

    // Agent labels, drawn after the table so the legs never cover them.
    ctx.fillStyle = hexA(INK_DIM, 0.75);
    ctx.font = Math.round(9 * s) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('the voice', voiceX - 22 * s, baseY + 16 * s);
    ctx.fillText('the desk', deskX - 24 * s, baseY + 16 * s);

    // Luggage tag with the cycle number, at the table's right edge.
    drawTag(tableX1 + 6 * s, tableY - 6 * s, s);

    var frags = lineFragments(lineIdx);
    var fs = 15 * s;
    var maxW = (tableX1 - tableX0) * 0.86;

    if (u < READ_END) {
      // The voice reads the line once, straight, on the table.
      var readFs = fitFont(LINES[lineIdx], maxW, 19 * s);
      ctx.fillStyle = INK;
      ctx.textAlign = 'center';
      ctx.fillText(LINES[lineIdx], W / 2, lineY);
      ctx.textAlign = 'left';
      // The line fades as the shredder starts.
      if (u > READ_END - 1.2) {
        ctx.fillStyle = hexA(PAPER, a4(clamp((u - (READ_END - 1.2)) / 1.2, 0, 1)));
        ctx.fillRect(tableX0, lineY - readFs - 6, tableX1 - tableX0, readFs + 12);
      }
    } else if (u < SHRED_END) {
      // Shred: fragments fly from their words on the table to orbit.
      var p = smooth((u - READ_END) / (SHRED_END - READ_END));
      drawFragments(frags, p, orbitX, orbitY, tableY, lineY, fs, maxW, s, 1);
    } else if (u < ORBIT_END) {
      // Orbit: fragments circle the desk agent.
      drawFragments(frags, 1, orbitX, orbitY, tableY, lineY, fs, maxW, s, 1);
    } else {
      // Recombine: fragments fly back to the table and assemble a new line.
      var q = smooth((u - ORBIT_END) / (CYCLE - ORBIT_END));
      var newLine = recombine(lineIdx, cycleNum);
      var newFs = fitFont(newLine, maxW, 16 * s);
      drawRecombined(frags, newLine, q, orbitX, orbitY, tableY, lineY, newFs, s);
      if (q > 0.55) {
        ctx.fillStyle = hexA(SEPIA, a4(clamp((q - 0.55) / 0.45, 0, 1)));
        ctx.textAlign = 'center';
        ctx.font = 'italic ' + Math.round(newFs) + 'px Georgia, "Times New Roman", serif';
        ctx.fillText(newLine, W / 2, lineY);
        ctx.textAlign = 'left';
      }
    }

    // Palimpsest: recombined lines accumulate along the bottom, older ones
    // fading to grey. Newest sits closest to the bottom edge.
    var pal = palimpsestLines();
    var show = pal.slice(Math.max(0, pal.length - 4));
    var i, entry, ageFrac, py, palFs;
    palFs = Math.round(12 * s);
    ctx.font = 'italic ' + palFs + 'px Georgia, "Times New Roman", serif';
    var palMaxW = W * (isPhone ? 0.78 : 0.84);
    for (i = 0; i < show.length; i++) {
      entry = show[i];
      ageFrac = (show.length - 1 - i) / Math.max(1, show.length - 1);
      py = H - 26 * s - (show.length - 1 - i) * (palFs + 5);
      var txt = entry.text;
      var words = txt.split(' ');
      while (words.length > 1 && ctx.measureText(words.join(' ') + '...').width > palMaxW) {
        words.pop();
      }
      txt = words.join(' ');
      if (txt !== entry.text) { txt += '...'; }
      if (i === show.length - 1) {
        ctx.fillStyle = hexA(SEPIA, 0.85);
      } else {
        ctx.fillStyle = hexA(GREY, a4(0.75 - 0.45 * ageFrac));
      }
      ctx.fillText(txt, 18, py);
    }

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 640, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Compose, Scomponi, Ricombina', 18, 34);
    ctx.fillStyle = INK_DIM;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1906 · 2007 · 04 · 01', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(INK_DIM, 0.9);
    ctx.font = Math.round(13 * s) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'right';
    ctx.fillText('Tap for a new line.', W - 18, H - 20);
    ctx.textAlign = 'left';
  }

  // Fragment positions on the table, from the line's word layout.
  function tablePositions(frags, lineY, fs, maxW, s) {
    var line = LINES[lineIdx];
    var words = line.replace(/[.,]/g, '').split(' ');
    ctx.font = Math.round(fs) + 'px Georgia, "Times New Roman", serif';
    var widths = [], i, total = 0;
    for (i = 0; i < words.length; i++) {
      widths.push(ctx.measureText(words[i]).width);
      total += widths[i];
    }
    total += (words.length - 1) * fs * 0.45;
    var x = W / 2 - total / 2;
    var centers = [];
    for (i = 0; i < words.length; i++) {
      centers.push(x + widths[i] / 2);
      x += widths[i] + fs * 0.45;
    }
    var pos = [];
    for (i = 0; i < frags.length; i++) {
      var f = frags[i];
      pos.push({
        x: centers[f.word] + (f.inWord - (f.wordCount - 1) / 2) * 9 * s,
        y: lineY + (hash(i * 13 + 5) - 0.5) * 6 * s
      });
    }
    return pos;
  }

  // Fragment positions in orbit around the desk agent. Base angles are
  // spread evenly around the ellipse so fragments do not clump, and radii
  // are capped so nothing leaves the stage.
  function orbitPositions(frags, orbitX, orbitY, s, t) {
    var pos = [], i;
    var cap = Math.min(140 * s, orbitX - 24, W - orbitX - 16);
    for (i = 0; i < frags.length; i++) {
      var rx = (0.35 + 0.65 * hash(i * 3 + 1)) * cap;
      var ry = rx * 0.6;
      var speed = (0.25 + hash(i * 7 + 3) * 0.35) * (hash(i * 11 + 4) > 0.5 ? 1 : -1);
      var ang = (i / frags.length) * Math.PI * 2 + hash(i * 5 + 2) * 0.6 + t * speed;
      pos.push({ x: orbitX + Math.cos(ang) * rx, y: orbitY + Math.sin(ang) * ry });
    }
    return pos;
  }

  function drawFragments(frags, p, orbitX, orbitY, tableY, lineY, fs, maxW, s, alpha) {
    var from = tablePositions(frags, lineY, fs, maxW, s);
    var to = orbitPositions(frags, orbitX, orbitY, s, now);
    var i, x, y;
    ctx.font = Math.round(13 * s) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    for (i = 0; i < frags.length; i++) {
      x = lerp(from[i].x, to[i].x, p);
      y = lerp(from[i].y, to[i].y, p);
      ctx.fillStyle = hexA(GREY, a4(0.85 * alpha));
      ctx.fillText(frags[i].text, x, y);
      ctx.fillStyle = hexA(GREY_FAINT, a4(0.6 * alpha));
      ctx.beginPath();
      ctx.moveTo(x + 2 * s, y + 3 * s);
      ctx.arc(x, y + 3 * s, 1.2 * s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.textAlign = 'left';
  }

  function drawRecombined(frags, newLine, q, orbitX, orbitY, tableY, lineY, newFs, s) {
    // Fragments fly from orbit to their places in the recombined line.
    var from = orbitPositions(frags, orbitX, orbitY, s, now);
    ctx.font = 'italic ' + Math.round(newFs) + 'px Georgia, "Times New Roman", serif';
    var parts = newLine.split(' ');
    var widths = [], i, total = 0;
    for (i = 0; i < parts.length; i++) {
      widths.push(ctx.measureText(parts[i]).width);
      total += widths[i];
    }
    total += (parts.length - 1) * newFs * 0.4;
    var x = W / 2 - total / 2;
    var targets = [];
    for (i = 0; i < parts.length; i++) {
      targets.push({ x: x + widths[i] / 2, y: lineY });
      x += widths[i] + newFs * 0.4;
    }
    ctx.font = Math.round(13 * s) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    for (i = 0; i < frags.length; i++) {
      var ti = targets[i % targets.length];
      var px = lerp(from[i].x, ti.x, q);
      var py = lerp(from[i].y, ti.y, q);
      ctx.fillStyle = hexA(GREY, a4(0.85 * (1 - q * 0.7)));
      ctx.fillText(frags[i].text, px, py);
    }
    ctx.textAlign = 'left';
  }

  // Lazy audio, created inside the first tap only, never autoplay.
  var audioCtx = null;
  function ensureAudio() {
    try {
      if (audioCtx) { return; }
      var AC = null;
      if (typeof window !== 'undefined') {
        AC = window.AudioContext || window.webkitAudioContext;
      }
      if (typeof AC !== 'function') { return; }
      audioCtx = new AC();
      var g = audioCtx.createGain();
      g.gain.value = 0;
      g.connect(audioCtx.destination);
      var o1 = audioCtx.createOscillator();
      o1.type = 'sine'; o1.frequency.value = 110;
      var o2 = audioCtx.createOscillator();
      o2.type = 'sine'; o2.frequency.value = 164.8;
      o1.connect(g); o2.connect(g);
      o1.start(); o2.start();
      var t0 = audioCtx.currentTime;
      g.gain.linearRampToValueAtTime(0.05, t0 + 2);
      g.gain.linearRampToValueAtTime(0, t0 + 6);
      o1.stop(t0 + 6.2); o2.stop(t0 + 6.2);
    } catch (e) { audioCtx = null; }
  }

  function onTap() {
    cycleNum += 1;
    lineIdx = (lineIdx + 1) % LINES.length;
    cycleStart = now;
    ensureAudio();
    draw(now);
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onTap);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(now); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(now); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (ms) {
      now = FIRST_T + (ms - start) / 1000;
      var u = now - cycleStart;
      if (u >= CYCLE) {
        cycleStart += CYCLE;
        cycleNum += 1;
        lineIdx = (lineIdx + 1) % LINES.length;
      }
      draw(now);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
