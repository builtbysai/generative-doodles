<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1963 Language (nearly there)</title>
<style>
  html, body { margin: 0; padding: 0; background: #f3f0e8; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Language (nearly there), CW4 / PP1210, study #256 caius-williams.
  // A small room, pints on a table, a mic in the middle. Two
  // voices negotiate: one sings long held tones close to the mic,
  // the other answers on a low stringed voice. They trade the lead
  // in long phrases, never quite landing in unison; nearly there
  // is the point. The singer is the near orbit, pale gray; the
  // string is the farther orbit, charcoal. Tap swaps which voice
  // leads. The tap is a handoff, not a reseed: the roles exchange
  // and the negotiation continues, crossfading over six seconds.
  // Visual only, per the Franke audio rule: the prompt's WebAudio
  // is not built; the visuals run on a closed-form sound model.
  var PAPER = '#f3f0e8';  // warm B&W photo paper
  var INK = '#1a1a1a';    // ink black
  var SINGER = '#c9c9c9'; // singer tone, pale gray
  var SINGER_RING = '#8f8f8f'; // singer ring, mid gray so it reads on paper
  var SINGER_DK = '#6e6e6e'; // singer label, dark enough to read
  var STRING = '#2e2e2e'; // string answer, charcoal
  var STRING_LT = '#555555'; // string answer, lighter
  var AMBER = '#b5772e';  // warm table amber
  var AMBER_DK = '#8a5a1e'; // table amber, dark edge
  var FOAM = '#faf7ef';   // pint foam

  // Fixed-phase first frame: FIRST_T = 32 s. At t = 32 the
  // singer's second phrase (22 to 34 s) is at full hold while
  // the string's answer (30 to 42 s) is still rising toward its
  // late peak, so frame one already shows both breath forms
  // circling the mic at different strengths, close to unison
  // and not there. The two orbit angles at t = 32 put the
  // singer up-left of the mic and the string to its right.
  var FIRST_T = 32;
  var SEED = 1963;
  var CYCLE = 48; // one negotiation cycle, in seconds
  var CROSS = 6;  // handoff crossfade, in seconds

  // QA probe hooks, read at load only. ?t=<seconds> sets the
  // virtual clock; ?seed= is accepted as an alias for the same
  // clock, so the node-canvas render tool (which passes its probe
  // value as ?seed=) can verify that the frame changes over time.
  // ?lead=singer|?lead=string sets the lead voice at load.
  // ?cross=<0..1> sets how far through the handoff the load
  // frame sits (0 = just tapped, 1 = settled).
  var probeT = null, probeLead = null, probeCross = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
    var ml = qs.match(/[?&]lead=(singer|string)/);
    if (ml) { probeLead = ml[1]; }
    var mc = qs.match(/[?&]cross=([0-9.]+)/);
    if (mc) { probeCross = Math.max(0, Math.min(1, parseFloat(mc[1]))); }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and fixed salts, so every frame is a pure
  // function of t and the lead state.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // Lead state. The singer leads at load. A tap flips the lead
  // and stamps the handoff time; the crossfade weight moves from
  // the old lead to the new one over CROSS seconds. The state is
  // part of the frame function, so a probe can render either
  // lead at the same t.
  var lead = probeLead || 'singer';
  var crossStart = (probeCross !== null)
    ? (probeT !== null ? probeT : FIRST_T) - probeCross * CROSS
    : -1e9;
  function leadWeight(t) {
    // Weight of the current lead voice: 0 just after a tap, 1
    // once the handoff has settled.
    var p = (t - crossStart) / CROSS;
    if (p <= 0) { return 0; }
    if (p >= 1) { return 1; }
    return p * p * (3 - 2 * p);
  }
  function swapLead(t) {
    lead = (lead === 'singer') ? 'string' : 'singer';
    crossStart = t;
  }

  // The phrase template, one 48 second cycle. Singer phrases are
  // long held tones (12 s), string answers are long low drones
  // (12 s). They overlap in the middle of each exchange but their
  // peaks are offset by design, so the two voices never crest
  // together. Between exchanges sits a short listening gap.
  var TEMPLATE = [
    { v: 'singer', s: 0, d: 12 },   // singer holds
    { v: 'string', s: 8, d: 12 },   // string answers, overlap 8 to 12
    // listening gap 20 to 22, both quiet
    { v: 'singer', s: 22, d: 12 },  // singer holds again
    { v: 'string', s: 30, d: 12 },  // string answers, overlap 30 to 34
    // listening gap 42 to 44
    { v: 'singer', s: 44, d: 12 }   // singer holds, runs past the cycle edge
  ];

  // Smooth envelope for a phrase. The singer rises fast (2 s),
  // holds, and falls fast (2 s), so it crests early in its
  // phrase. The string rises slowly (8 s) and falls fast (2 s),
  // so it crests late, and it keeps a 0.35 floor: a low drone
  // that never quite goes silent. The two peaks never coincide.
  function phraseEnv(ph, t) {
    if (t < ph.start || t > ph.start + ph.d) { return 0; }
    var u = (t - ph.start) / ph.d;
    var rise = (ph.v === 'string') ? 8 : 2;
    var fall = 2;
    var e = Math.min(1, u * ph.d / rise, (1 - u) * ph.d / fall);
    if (ph.v === 'string') {
      e = 0.35 + 0.65 * e;
    }
    return e;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function lerp(a, b, f) { return a + (b - a) * f; }

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    L.cx = W / 2;
    if (isPhone) {
      L.micY = H * 0.40;
      L.tableY = H * 0.74;
      L.orbitSinger = 0.15 * u;
      L.orbitString = 0.25 * u;
      L.micR = 0.085 * u;
    } else {
      L.micY = H * 0.44;
      L.tableY = H * 0.76;
      L.orbitSinger = 0.15 * u;
      L.orbitString = 0.25 * u;
      L.micR = 0.08 * u;
    }
    L.pintW = 0.075 * u;
    L.pintH = 0.15 * u;
    L.pintLx = W * 0.16;
    L.pintRx = W * 0.84;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Voice activity at t: envelope 0..1 for each voice, from the
  // phrase template across the cycle boundary.
  function voiceEnv(v, t) {
    var cycle = Math.floor(t / CYCLE);
    var tc = t - cycle * CYCLE;
    var e = 0;
    var i;
    for (i = 0; i < TEMPLATE.length; i++) {
      var ph = TEMPLATE[i];
      if (ph.v !== v) { continue; }
      e = Math.max(e, phraseEnv({ v: ph.v, start: ph.s, d: ph.d }, tc));
      // A phrase that runs past the cycle edge is also heard at
      // the start of the next cycle.
      e = Math.max(e, phraseEnv({ v: ph.v, start: ph.s - CYCLE, d: ph.d }, tc));
    }
    return e;
  }

  // The phase name for the plate: who leads, and whether the
  // handoff is still crossing over.
  function phaseName(t) {
    var w = leadWeight(t);
    var who = (lead === 'singer') ? 'Singer leads' : 'String leads';
    if (w < 1) { return 'Handoff: ' + who.toLowerCase(); }
    return who;
  }

  // One breath form: a closed wobbly ring circling the mic. The
  // ring's centre travels its orbit, its radius breathes with
  // the voice's envelope, and its wobble is a slow closed-form
  // ripple so the form never repeats exactly but is always a
  // pure function of t.
  function drawBreath(v, t, lw) {
    var env = voiceEnv(v, t);
    var isLead = (lead === v);
    var leadF = isLead ? lw : (1 - lw);
    var orbitR = (v === 'singer') ? L.orbitSinger : L.orbitString;
    var speed = (v === 'singer') ? 0.11 : -0.07;
    var baseAng = (v === 'singer') ? 0.6 : 2.4;
    var ang = baseAng + speed * t;
    var ox = L.cx + Math.cos(ang) * orbitR;
    var oy = L.micY + Math.sin(ang) * orbitR * 0.62;
    var breath = 0.5 + 0.5 * Math.sin(t * 0.45 + (v === 'singer' ? 0 : 1.9));
    var formR = L.u * (v === 'singer' ? 0.10 : 0.12) * (0.72 + 0.45 * env) * (0.92 + 0.16 * breath);
    var col = (v === 'singer') ? SINGER_RING : STRING;
    var colLt = (v === 'singer') ? SINGER : STRING_LT;
    var alpha = 0.35 + 0.55 * env * (0.55 + 0.45 * leadF);
    var lineW = (v === 'singer' ? 2.2 : 3.0) * (0.7 + 0.6 * leadF);
    // Faint filled breath under the ring.
    ctx.fillStyle = hexA(colLt, a4(0.10 + 0.14 * env * leadF));
    ctx.beginPath();
    var N = 48, i;
    for (i = 0; i <= N; i++) {
      var th = (i / N) * Math.PI * 2;
      var wob = 1 + 0.14 * Math.sin(3 * th + t * 0.3 + (v === 'singer' ? 0 : 2.1))
                  + 0.07 * Math.sin(5 * th - t * 0.2);
      var px = ox + Math.cos(th) * formR * wob;
      var py = oy + Math.sin(th) * formR * wob * 0.85;
      if (i === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
    }
    ctx.closePath();
    ctx.fill();
    // The ring itself.
    ctx.strokeStyle = hexA(col, a4(alpha));
    ctx.lineWidth = lineW;
    ctx.beginPath();
    for (i = 0; i <= N; i++) {
      var th2 = (i / N) * Math.PI * 2;
      var wob2 = 1 + 0.14 * Math.sin(3 * th2 + t * 0.3 + (v === 'singer' ? 0 : 2.1))
                   + 0.07 * Math.sin(5 * th2 - t * 0.2);
      var qx = ox + Math.cos(th2) * formR * wob2;
      var qy = oy + Math.sin(th2) * formR * wob2 * 0.85;
      if (i === 0) { ctx.moveTo(qx, qy); } else { ctx.lineTo(qx, qy); }
    }
    ctx.closePath();
    ctx.stroke();
    // Bright head dot on the ring, at the tone's crest.
    var hd = (v === 'singer') ? 1.2 : 4.4;
    var hx = ox + Math.cos(hd) * formR * (1 + 0.14 * Math.sin(3 * hd + t * 0.3 + (v === 'singer' ? 0 : 2.1)));
    var hy = oy + Math.sin(hd) * formR * (1 + 0.14 * Math.sin(3 * hd + t * 0.3 + (v === 'singer' ? 0 : 2.1))) * 0.85;
    var hr = Math.max(3, L.u * 0.009) * (0.8 + 0.7 * env);
    ctx.fillStyle = hexA(col, a4(0.55 + 0.4 * env));
    ctx.beginPath();
    ctx.moveTo(hx + hr, hy);
    ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    ctx.fill();
    return { x: ox, y: oy, env: env, leadF: leadF };
  }

  // A pint glass on the table: amber fill, foam cap, ink outline.
  function drawPint(x) {
    var w = L.pintW, h = L.pintH;
    var top = L.tableY - h;
    ctx.fillStyle = hexA(AMBER, a4(0.85));
    ctx.fillRect(x - w / 2, top + h * 0.18, w, h * 0.82);
    ctx.fillStyle = hexA(FOAM, a4(0.95));
    ctx.fillRect(x - w / 2, top, w, h * 0.18);
    ctx.strokeStyle = hexA(INK, a4(0.7));
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, top);
    ctx.lineTo(x - w / 2, top + h);
    ctx.lineTo(x + w / 2, top + h);
    ctx.lineTo(x + w / 2, top);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - w / 2, top + h * 0.18);
    ctx.lineTo(x + w / 2, top + h * 0.18);
    ctx.stroke();
  }

  // The mic, centre-frame: stand pole from the table, round
  // grille head with horizontal grille lines.
  function drawMic() {
    var r = L.micR;
    var hy = L.micY;
    ctx.strokeStyle = hexA(INK, a4(0.85));
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(L.cx, hy + r * 0.8);
    ctx.lineTo(L.cx, L.tableY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(L.cx - r * 0.9, L.tableY);
    ctx.lineTo(L.cx + r * 0.9, L.tableY);
    ctx.stroke();
    ctx.fillStyle = hexA(SINGER, a4(0.9));
    ctx.beginPath();
    ctx.moveTo(L.cx + r, hy);
    ctx.arc(L.cx, hy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = hexA(INK, a4(0.85));
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(L.cx + r, hy);
    ctx.arc(L.cx, hy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = hexA(INK, a4(0.35));
    ctx.lineWidth = 1;
    var i;
    for (i = -2; i <= 2; i++) {
      var gy = hy + i * r * 0.36;
      var half = Math.sqrt(Math.max(0, r * r - (i * r * 0.36) * (i * r * 0.36)));
      ctx.beginPath();
      ctx.moveTo(L.cx - half * 0.92, gy);
      ctx.lineTo(L.cx + half * 0.92, gy);
      ctx.stroke();
    }
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Paper ground.
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // The table: a warm amber band.
    ctx.fillStyle = hexA(AMBER, a4(0.28));
    ctx.fillRect(0, L.tableY, W, H - L.tableY);
    ctx.fillStyle = hexA(AMBER_DK, a4(0.5));
    ctx.fillRect(0, L.tableY, W, 2);

    // Two pints on the table, one per voice.
    drawPint(L.pintLx);
    drawPint(L.pintRx);

    // The two breath forms circle the mic: string first (farther
    // orbit, behind), singer second (near orbit, in front).
    var lw = leadWeight(t);
    drawBreath('string', t, lw);
    var singerState = drawBreath('singer', t, lw);

    // The mic, centre-frame, over the orbits.
    drawMic();

    // Voice labels: singer pale gray on the left, string
    // charcoal on the right, under the table line.
    var fsLabel = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    ctx.font = fsLabel + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = hexA(SINGER_DK, a4(0.9));
    ctx.textAlign = 'center';
    ctx.fillText('the singer', L.pintLx, L.tableY + fsLabel + 16);
    ctx.fillStyle = hexA(STRING, a4(0.9));
    ctx.fillText('the string', L.pintRx, L.tableY + fsLabel + 16);
    ctx.textAlign = 'left';
    void singerState;

    // ---- Plates: title top-left, number and date below it, the
    // phase readout and a short descriptor top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Language (nearly there)', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.8);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1963 · 2007 · 05 · 28', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(INK, 0.65);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('two voices, one mic', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.fillStyle = hexA(INK, 0.85);
    ctx.font = fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(phaseName(t), W - 18, 18 + fsTitle * 0.8 + fsSmall + 8 + fsSmall + 6);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom, ink on a faint paper
    // pill so it stays legible over the table.
    var hint = 'Tap to swap the lead.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(INK, a4(0.08));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(INK, a4(0.35));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = hexA(INK, a4(0.95));
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // Tap is the handoff: swap the lead, keep the timeline going.
  function onTap() {
    swapLead(lastT);
    draw(lastT);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onTap);
    canvas.addEventListener('click', onTap);
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1963 exposes the phase, the lead state, and a
  // tap simulation for probing the handoff.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1963 = {
      phase: function (t) { return phaseName(t); },
      lead: function () { return lead; },
      leadWeight: function (t) { return leadWeight(t); },
      tap: function (t) { swapLead(t); draw(t); },
      cycle: CYCLE,
      cross: CROSS,
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the orbits turn at about 0.02 Hz and the breath
  // forms pulse at about 0.07 Hz, all well under the 14 Hz
  // ceiling. Guarded so node-canvas QA (no
  // requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
