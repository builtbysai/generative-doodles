<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every Place, Its Colors</title>
<style>
  html, body { margin: 0; padding: 0; background: #F5F1E8; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var PAPER = '#F5F1E8';

  // ---------- places: fixed order, exact palettes ----------
  // perm maps logical slots 0..4 onto palette indices for the base skin.
  var PLACES = [
    { // New Orleans
      colors: ['#E87B9C', '#6A9A5B', '#C98A2E', '#F2C14E', '#12315E'],
      perm: [0, 1, 2, 3, 4]
    },
    { // high summer garden
      colors: ['#7A4E8C', '#5C8A4D', '#F2C14E', '#E2725B', '#F5F1E8'],
      perm: [2, 0, 3, 1, 4]
    },
    { // early autumn
      colors: ['#8A5A33', '#C98A2E', '#A63A2E', '#5C6B3C', '#F0E6D2'],
      perm: [1, 2, 0, 4, 3]
    },
    { // indigo night (4 chips)
      colors: ['#2B3A67', '#1A2440', '#4A5A8A', '#F5F1E8'],
      perm: [0, 2, 1, 3, 3]
    }
  ];

  // ---------- state ----------
  var BASE_SEED = 622075;
  var placeIdx = 0;
  var slotMap = PLACES[0].perm.slice(); // logical slot -> palette index
  var leanSlot = -1;                     // palette index leaned into, -1 = none
  var remixCount = 0;
  var travelCount = 0;
  var trans = null; // {start, fromColors, swapped}

  // ---------- precomputed chip blob shapes (unit radius, fixed seeds) ----------
  function blobPoints(seed, n, jitter) {
    var rng = mulberry32(seed), pts = [], i, ang, r;
    for (i = 0; i < n; i++) {
      ang = (i / n) * Math.PI * 2;
      r = 1 - jitter / 2 + rng() * jitter;
      pts.push({ x: Math.cos(ang) * r, y: Math.sin(ang) * r });
    }
    return pts;
  }
  var chipBlobs = [];
  for (var ci = 0; ci < 5; ci++) chipBlobs.push(blobPoints(BASE_SEED + ci * 131, 9, 0.34));
  var chipDabs = [];
  for (var cj = 0; cj < 5; cj++) {
    var drng = mulberry32(BASE_SEED + 5000 + cj * 77), dabs = [];
    for (var dk = 0; dk < 3; dk++) dabs.push({ a: drng() * Math.PI * 2, d: 0.95 + drng() * 0.25, r: 0.10 + drng() * 0.10 });
    chipDabs.push(dabs);
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300, PHONE = false;

  function measure() {
    var vv = window.visualViewport;
    var w = vv && vv.width ? vv.width : window.innerWidth;
    var h = vv && vv.height ? vv.height : window.innerHeight;
    W = w; H = h;
    var scr = window.screen || { width: w, height: h };
    var minScr = Math.min(scr.width || w, scr.height || h);
    PHONE = minScr < 700 || (h > w * 1.15 && Math.min(w, h) < 700);
  }

  // ---------- layout ----------
  function layout() {
    var S = Math.min(W, H), i, chips = [], studies = [];
    var n = PLACES[placeIdx].colors.length;
    if (PHONE) {
      var ry = H * 0.10, rr = W * 0.052;
      for (i = 0; i < n; i++) chips.push({ x: W * (0.13 + 0.74 * (n === 1 ? 0.5 : i / (n - 1))), y: ry, r: rr });
      var gx = [0.27, 0.73], gy = [0.40, 0.76];
      for (var a = 0; a < 2; a++) for (var b = 0; b < 2; b++)
        studies.push({ x: W * gx[b], y: H * gy[a], u: Math.min(W * 0.40, H * 0.30) * 0.5 });
    } else {
      var cx = W * 0.155, cr = S * 0.054;
      for (i = 0; i < n; i++) chips.push({ x: cx, y: H * (0.17 + 0.66 * (n === 1 ? 0.5 : i / (n - 1))), r: cr });
      var sx = [0.475, 0.755], sy = [0.30, 0.72];
      for (var c = 0; c < 2; c++) for (var d = 0; d < 2; d++)
        studies.push({ x: W * sx[d], y: H * sy[c], u: Math.min(W * 0.26, H * 0.40) * 0.5 });
    }
    return { chips: chips, studies: studies };
  }

  // ---------- color resolution ----------
  function col(slot) {
    var p = PLACES[placeIdx];
    var idx = slotMap[((slot % 5) + 5) % 5] % p.colors.length;
    return p.colors[idx];
  }
  function leanCol(slot, emphasis) {
    if (leanSlot >= 0 && emphasis) {
      var p = PLACES[placeIdx];
      return p.colors[leanSlot % p.colors.length];
    }
    return col(slot);
  }

  // ---------- drawing helpers ----------
  function blobPath(pts, x, y, r) {
    ctx.beginPath();
    var n = pts.length, i, mx, my;
    mx = (pts[0].x + pts[n - 1].x) / 2; my = (pts[0].y + pts[n - 1].y) / 2;
    ctx.moveTo(x + mx * r, y + my * r);
    for (i = 0; i < n; i++) {
      var p = pts[i], q = pts[(i + 1) % n];
      ctx.quadraticCurveTo(x + p.x * r, y + p.y * r, x + (p.x + q.x) / 2 * r, y + (p.y + q.y) / 2 * r);
    }
    ctx.closePath();
  }
  function ellipse(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function leaf(x, y, len, wid, ang) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * 0.5, -wid, len, 0);
    ctx.quadraticCurveTo(len * 0.5, wid, 0, 0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fill();
  }

  var foxBlob = blobPoints(BASE_SEED + 901, 10, 0.22);
  var birdBlob = blobPoints(BASE_SEED + 902, 10, 0.18);
  var capBlob = blobPoints(BASE_SEED + 903, 9, 0.16);

  // ---------- studies: fixed shape programs, palette slots per part ----------
  function drawFox(u) {
    // tail (emphasis)
    ctx.fillStyle = leanCol(1, true);
    blobPath(foxBlob, -u * 0.50, u * 0.20, u * 0.36); ctx.fill();
    ctx.fillStyle = col(2);
    ellipse(-u * 0.70, u * 0.04, u * 0.10, u * 0.13, 0.5);
    // body
    ctx.fillStyle = col(0);
    blobPath(foxBlob, -u * 0.05, u * 0.16, u * 0.46); ctx.fill();
    // head
    ellipse(u * 0.38, -u * 0.18, u * 0.30, u * 0.27, 0);
    // ears
    ctx.fillStyle = col(1);
    poly([[u * 0.18, -u * 0.36], [u * 0.24, -u * 0.62], [u * 0.36, -u * 0.40]]);
    poly([[u * 0.42, -u * 0.40], [u * 0.56, -u * 0.60], [u * 0.58, -u * 0.32]]);
    // snout
    ctx.fillStyle = col(3);
    poly([[u * 0.52, -u * 0.22], [u * 0.74, -u * 0.10], [u * 0.52, -u * 0.04]]);
    // legs
    ctx.fillStyle = col(4 % 5);
    ellipse(-u * 0.22, u * 0.58, u * 0.09, u * 0.16, 0);
    ellipse(u * 0.18, u * 0.58, u * 0.09, u * 0.16, 0);
    // eye
    ctx.fillStyle = col(4);
    ellipse(u * 0.42, -u * 0.20, u * 0.035, u * 0.035, 0);
  }
  function drawBird(u) {
    // tail leaves
    ctx.fillStyle = col(1);
    leaf(-u * 0.34, u * 0.05, u * 0.42, u * 0.13, 2.55);
    leaf(-u * 0.30, u * 0.16, u * 0.38, u * 0.12, 2.95);
    // body
    ctx.fillStyle = col(0);
    blobPath(birdBlob, 0, u * 0.05, u * 0.44); ctx.fill();
    // head
    ellipse(u * 0.30, -u * 0.28, u * 0.24, u * 0.22, 0);
    // wing (emphasis)
    ctx.fillStyle = leanCol(2, true);
    leaf(-u * 0.16, -u * 0.02, u * 0.44, u * 0.20, 0.85);
    // beak
    ctx.fillStyle = col(3);
    poly([[u * 0.48, -u * 0.32], [u * 0.70, -u * 0.24], [u * 0.47, -u * 0.18]]);
    // crest
    ctx.fillStyle = col(2);
    leaf(u * 0.22, -u * 0.44, u * 0.22, u * 0.07, -0.9);
    // legs
    ctx.strokeStyle = col(4); ctx.lineWidth = u * 0.035; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-u * 0.05, u * 0.44); ctx.lineTo(-u * 0.05, u * 0.62); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(u * 0.14, u * 0.44); ctx.lineTo(u * 0.14, u * 0.62); ctx.stroke();
    // eye
    ctx.fillStyle = col(4);
    ellipse(u * 0.34, -u * 0.30, u * 0.032, u * 0.032, 0);
  }
  function mushroom(x, y, u, capSlot, stemSlot, dotSlot) {
    ctx.fillStyle = col(stemSlot);
    poly([[x - u * 0.10, y + u * 0.02], [x + u * 0.10, y + u * 0.02], [x + u * 0.13, y + u * 0.42], [x - u * 0.13, y + u * 0.42]]);
    ctx.fillStyle = col(capSlot);
    ctx.beginPath();
    ctx.arc(x, y + u * 0.04, u * 0.34, Math.PI, 0);
    ctx.quadraticCurveTo(x + u * 0.30, y + u * 0.14, x, y + u * 0.10);
    ctx.quadraticCurveTo(x - u * 0.30, y + u * 0.14, x - u * 0.34, y + u * 0.04);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = col(dotSlot);
    ellipse(x - u * 0.13, y - u * 0.14, u * 0.05, u * 0.04, 0);
    ellipse(x + u * 0.10, y - u * 0.20, u * 0.04, u * 0.035, 0);
    ellipse(x + u * 0.02, y - u * 0.06, u * 0.035, u * 0.03, 0);
  }
  function drawShrooms(u) {
    mushroom(-u * 0.34, u * 0.05, u * 0.85, 0, 2, 3);
    mushroom(u * 0.30, -u * 0.12, u * 1.05, 1, 2, 3);
    mushroom(u * 0.42, u * 0.28, u * 0.6, 2, 2, 3);
    // grass tufts (emphasis on one)
    ctx.fillStyle = leanCol(1, true);
    leaf(-u * 0.62, u * 0.48, u * 0.26, u * 0.07, -1.15);
    ctx.fillStyle = col(1);
    leaf(-u * 0.05, u * 0.50, u * 0.24, u * 0.07, -1.35);
    leaf(u * 0.66, u * 0.50, u * 0.22, u * 0.06, -1.8);
  }
  function drawSprig(u) {
    ctx.strokeStyle = col(1); ctx.lineWidth = u * 0.045; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, u * 0.62);
    ctx.quadraticCurveTo(u * 0.10, u * 0.0, -u * 0.04, -u * 0.55);
    ctx.stroke();
    var rng = mulberry32(BASE_SEED + 4242);
    for (var i = 0; i < 6; i++) {
      var tt = i / 6, ly = u * (0.42 - tt * 0.85), lx = u * (0.05 * Math.sin(tt * 4));
      ctx.fillStyle = col(i % 2 === 0 ? 0 : 1);
      leaf(lx, ly, u * 0.34, u * 0.11, i % 2 === 0 ? -0.65 : 2.45);
    }
    // berries (emphasis)
    ctx.fillStyle = leanCol(3, true);
    ellipse(u * 0.20, -u * 0.30, u * 0.07, u * 0.07, 0);
    ellipse(u * 0.26, -u * 0.12, u * 0.055, u * 0.055, 0);
    ellipse(-u * 0.22, -u * 0.05, u * 0.05, u * 0.05, 0);
    // top flower
    ctx.fillStyle = col(2);
    for (var p = 0; p < 5; p++) {
      var pa = p / 5 * Math.PI * 2;
      ellipse(-u * 0.04 + Math.cos(pa) * u * 0.10, -u * 0.58 + Math.sin(pa) * u * 0.10, u * 0.07, u * 0.07, 0);
    }
    ctx.fillStyle = col(3);
    ellipse(-u * 0.04, -u * 0.58, u * 0.05, u * 0.05, 0);
    void rng;
  }
  var STUDY_FNS = [drawFox, drawBird, drawShrooms, drawSprig];

  // ---------- main draw ----------
  function draw(t) {
    measure();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // travel transition bookkeeping (stepped wash)
    var washX = -1, washColor = null;
    if (trans) {
      var k = (t - trans.start) / 0.7;
      if (k >= 0.5 && !trans.swapped) {
        placeIdx = trans.to; trans.swapped = true;
        slotMap = PLACES[placeIdx].perm.slice(); leanSlot = -1;
      }
      if (k >= 1) { trans = null; }
      else {
        var step = Math.floor(Math.max(0, k) * 14) / 14;
        washX = -20 + step * (W + 40);
        washColor = PLACES[trans.to].colors[0];
      }
    }

    var L = layout();
    var i, j;

    // chips
    var n = PLACES[placeIdx].colors.length;
    for (i = 0; i < n; i++) {
      var ch = L.chips[i];
      var rr = ch.r * (leanSlot === i ? 1.13 : 1);
      ctx.fillStyle = PLACES[placeIdx].colors[i];
      blobPath(chipBlobs[i], ch.x, ch.y, rr); ctx.fill();
      for (j = 0; j < chipDabs[i].length; j++) {
        var dab = chipDabs[i][j];
        ellipse(ch.x + Math.cos(dab.a) * rr * dab.d, ch.y + Math.sin(dab.a) * rr * dab.d, rr * dab.r, rr * dab.r * 0.8, dab.a);
      }
      // glisten
      var ga = 0.10 + 0.08 * Math.sin(t * 0.9 + i * 1.3);
      ctx.fillStyle = 'rgba(245,241,232,' + ga.toFixed(3) + ')';
      ellipse(ch.x - rr * 0.30, ch.y - rr * 0.34, rr * 0.30, rr * 0.16, -0.6);
    }

    // studies
    for (i = 0; i < 4; i++) {
      var st = L.studies[i];
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.rotate(0.02 * Math.sin(t * 0.7 + i * 1.7));
      ctx.scale(st.u, st.u);
      STUDY_FNS[i](1);
      ctx.restore();
    }

    // wash sweep overlay
    if (trans && washX >= 0) {
      ctx.fillStyle = washColor;
      ctx.globalAlpha = 0.55;
      ctx.fillRect(0, 0, washX, H);
      ctx.globalAlpha = 0.9;
      ctx.fillRect(washX - 6, 0, 6, H);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- interaction ----------
  var downPos = null, downTime = 0, dragged = false, lastTap = -10, lastTapPos = null;
  function now() { return perfT; }
  var perfT = 0;

  function hitChip(x, y) {
    var L = layout(), n = PLACES[placeIdx].colors.length;
    for (var i = 0; i < n; i++) {
      var dx = x - L.chips[i].x, dy = y - L.chips[i].y;
      if (dx * dx + dy * dy <= Math.pow(L.chips[i].r * 1.25, 2)) return i;
    }
    return -1;
  }
  function inStudies(x, y) {
    var L = layout();
    for (var i = 0; i < 4; i++) {
      var dx = x - L.studies[i].x, dy = y - L.studies[i].y;
      if (Math.abs(dx) < L.studies[i].u * 1.5 && Math.abs(dy) < L.studies[i].u * 1.5) return true;
    }
    return false;
  }
  function travel() {
    if (trans) return;
    travelCount++;
    trans = { start: perfT, from: placeIdx, to: (placeIdx + 1) % PLACES.length, swapped: false };
  }
  function remix() {
    remixCount++;
    var rng = mulberry32(BASE_SEED + 77000 + remixCount * 977);
    var arr = slotMap.slice(), i, j, tmp;
    for (i = arr.length - 1; i > 0; i--) { j = Math.floor(rng() * (i + 1)); tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; }
    slotMap = arr;
  }
  function onDown(e) {
    var r = canvas.getBoundingClientRect();
    downPos = { x: e.clientX - r.left, y: e.clientY - r.top };
    downTime = perfT; dragged = false;
  }
  function onMove(e) {
    if (!downPos || dragged) return;
    var r = canvas.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var dx = x - downPos.x, dy = y - downPos.y;
    if (dx * dx + dy * dy > 64 && inStudies(x, y)) { dragged = true; remix(); }
  }
  function onUp(e) {
    if (!downPos) return;
    var r = canvas.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var wasDrag = dragged;
    downPos = null; dragged = false;
    if (wasDrag) return;
    // tap
    if (lastTapPos && perfT - lastTap < 0.35) {
      var ddx = x - lastTapPos.x, ddy = y - lastTapPos.y;
      if (ddx * ddx + ddy * ddy < 1600) { travel(); lastTap = -10; lastTapPos = null; return; }
    }
    lastTap = perfT; lastTapPos = { x: x, y: y };
    var ci = hitChip(x, y);
    if (ci >= 0) leanSlot = ci;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);

  function onResize() { draw(perfT); }
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', onResize);
  window.addEventListener('resize', onResize);

  // ---------- frame one + loop ----------
  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var loop = function (ts) {
      if (t0 === null) t0 = ts;
      perfT = (ts - t0) / 1000;
      draw(perfT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
