<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Retune · №8956</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #f2e9d6;
    overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 70vw;
    font: 400 13px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(74, 64, 48, 0.78); letter-spacing: 0.01em;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 ui-rounded, system-ui, sans-serif;
    color: rgba(74, 64, 48, 0.45);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="cap">Two circle-grids, one retuned a few pixels off. The pattern between them is exact, and the rule is dumb. Drag to retune it yourself. Tap for a new instrument.</div>
<div id="seedtag"></div>
<script>
"use strict";
/* ============================================================
   Retune - No.8956 (2026-07-19)
   Seed 257 (Retune the Instrument): shift the coordinate system
   slightly, apply the dumbest rule, and the output looks exact
   in a way the rule cannot explain. Two sets of concentric
   circles are drawn from centers a few pixels apart, plus a dot
   grid in a slightly sheared system. The interference between
   them, the moire, draws rosettes and hyperbolic fringes that no
   single layer contains. Dragging retunes the shift and shear
   live; left alone, the instrument breathes on its own.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 895601;
document.getElementById("seedtag").textContent = "seed " + seed;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

const PAPER = "#f2e9d6";
let W = 0, H = 0, DPR = 1;
let rand = null;
let ringGap = 13, dotGap = 26;
let shiftBase = 26, shearBase = 0.021; // px, radians
let shiftCur = 26, shearCur = 0.021;
let manualShift = null, manualShear = null, manualT = 0;
let cxN = 0.5, cyN = 0.52;

function build() {
  rand = mulberry32(seed);
  cxN = 0.42 + rand() * 0.16;
  cyN = 0.44 + rand() * 0.16;
  ringGap = Math.max(9, Math.min(16, Math.min(W, H) / 46));
  dotGap = ringGap * (1.9 + rand() * 0.5);
  shiftBase = ringGap * (1.4 + rand() * 1.2);
  shearBase = (0.6 + rand() * 1.4) * Math.PI / 180 * (rand() < 0.5 ? -1 : 1);
  shiftCur = shiftBase; shearCur = shearBase;
  manualShift = null; manualShear = null;
}

function drawCircles(cx, cy, color) {
  const diag = Math.hypot(W, H) / 2 + ringGap * 2;
  const n = Math.ceil(diag / ringGap);
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1, ringGap / 11);
  ctx.beginPath();
  for (let i = 1; i <= n; i++) {
    ctx.moveTo(cx + i * ringGap, cy);
    ctx.arc(cx, cy, i * ringGap, 0, 6.2832);
  }
  ctx.stroke();
}

function drawDots(shear) {
  ctx.save();
  ctx.translate(cxN * W, cyN * H);
  ctx.rotate(shear);
  ctx.fillStyle = "rgba(96,102,52,0.50)";
  const r = Math.max(1, dotGap / 14);
  const ex = Math.hypot(W, H) / 2 + dotGap;
  for (let y = -ex; y <= ex; y += dotGap) {
    for (let x = -ex; x <= ex; x += dotGap) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.restore();
}

function draw(t) {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  const idleShift = Math.sin(t * 0.23) * ringGap * 0.35;
  const idleShear = Math.sin(t * 0.17 + 1.2) * 0.004;
  const sh = (manualShift !== null ? manualShift : shiftBase + idleShift);
  const sr = (manualShear !== null ? manualShear : shearBase + idleShear);
  shiftCur += (sh - shiftCur) * 0.08;
  shearCur += (sr - shearCur) * 0.08;

  const cx = cxN * W, cy = cyN * H;
  drawDots(shearCur);
  drawCircles(cx - shiftCur, cy, "rgba(38,52,94,0.42)");
  drawCircles(cx + shiftCur, cy, "rgba(140,58,30,0.42)");

  // title + readout
  const ts = Math.max(18, Math.min(W, H) / 24);
  ctx.fillStyle = "rgba(74,64,48,0.88)";
  ctx.font = "700 " + ts + "px ui-rounded, system-ui, sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("RETUNE", 14, 34);
  ctx.textAlign = "right";
  ctx.font = "400 " + ts * 0.55 + "px ui-rounded, system-ui, sans-serif";
  ctx.fillStyle = "rgba(74,64,48,0.60)";
  ctx.fillText(
    "shift " + shiftCur.toFixed(1) + "px · shear " + (shearCur * 180 / Math.PI).toFixed(2) + "°",
    W - 14, 32);
  ctx.textAlign = "left";
}

let t0 = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (!t0) t0 = t;
  if (manualShift !== null && performance.now() - manualT > 5000) {
    manualShift = null; manualShear = null;
  }
  draw((t - t0) / 1000);
}

let dragging = false, downX = 0, downY = 0, moved = false;
canvas.addEventListener("pointerdown", function (e) {
  dragging = true; moved = false;
  downX = e.clientX; downY = e.clientY;
  manualT = performance.now();
});
canvas.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  const dx = e.clientX - downX, dy = e.clientY - downY;
  if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
  if (moved) {
    if (manualShift === null) { manualShift = shiftCur; manualShear = shearCur; }
    manualShift = Math.min(ringGap * 5, Math.max(0, manualShift + dx * 0.4));
    manualShear = Math.max(-0.09, Math.min(0.09, manualShear + dy * 0.0004));
    downX = e.clientX; downY = e.clientY;
    manualT = performance.now();
  }
});
function endDrag(e) {
  if (dragging && !moved) {
    seed = (seed + 1) >>> 0;
    document.getElementById("seedtag").textContent = "seed " + seed;
    build();
  }
  dragging = false;
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", function () { dragging = false; });

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  build();
}
window.addEventListener("resize", resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
