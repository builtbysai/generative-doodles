<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not Only Perlin</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0E12; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = [11, 14, 18];
var TEAL = [78, 205, 196];
var GREY = [138, 138, 146];
var ORANGE = [255, 107, 53];
var AMBER = [247, 201, 72];
var VIOLET = [58, 46, 92];
var CARGO = [ORANGE, AMBER, VIOLET];
var TEXT = [138, 138, 146];
var PHASE = 20.0;
var BASE_SEED = 1600000;
var N_PARTICLES = 600;
var TRAIL_LEN = 12;
var PREROLL_S = 20.0;
var PREROLL_DT = 0.05;
var FIELD_SPEED = 0.022;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerpColor(a, b, f) {
  return [Math.round(a[0] + (b[0] - a[0]) * f), Math.round(a[1] + (b[1] - a[1]) * f), Math.round(a[2] + (b[2] - a[2]) * f)];
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {

}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function u() { return Math.min(VW, VH) / 100; }
// Closed-form curl field: velocity is the analytic curl of a layered-sine
// stream function, so the field is a pure function of (u, v, t, phases).
// No Perlin implementation anywhere; the first frame is reproducible.
function fieldVel(f, uu, vv, t) {
  var a1 = TAU * (1.3 * uu + 0.7 * vv) + 0.11 * t + f.ph[0];
  var a2 = TAU * (0.6 * uu - 1.1 * vv) - 0.07 * t + f.ph[1];
  var a3 = TAU * (2.1 * uu + 1.7 * vv) + 0.05 * t + f.ph[2];
  var c1 = Math.cos(a1), c2 = Math.cos(a2), c3 = Math.cos(a3);
  var dpsi_du = 0.60 * TAU * 1.3 * c1 + 0.40 * TAU * 0.6 * c2 + 0.25 * TAU * 2.1 * c3;
  var dpsi_dv = 0.60 * TAU * 0.7 * c1 + 0.40 * TAU * (-1.1) * c2 + 0.25 * TAU * 1.7 * c3;
  return { x: dpsi_dv * FIELD_SPEED, y: -dpsi_du * FIELD_SPEED };
}
function makeParticle(f, i) {
  var rng = mulberry32(f.seed + i * 7919 + 13);
  var p = {
    rng: rng,
    u: 0.05 + 0.9 * rng(), v: 0.05 + 0.9 * rng(),
    age: 0, maxAge: 6 + rng() * 8,
    color: rng() < 0.7 ? TEAL : GREY,
    alpha: 0.25 + rng() * 0.25,
    trail: []

  p.trail.push({ u: p.u, v: p.v });
  return p;
}
function respawnParticle(f, p) {
  p.u = 0.05 + 0.9 * p.rng();
  p.v = 0.05 + 0.9 * p.rng();
  p.age = 0;
  p.maxAge = 6 + p.rng() * 8;
  p.trail.length = 0;
  p.trail.push({ u: p.u, v: p.v });
}
function advanceParticle(f, p, dt, t) {
  var vel = fieldVel(f, p.u, p.v, t);
  p.u += vel.x * dt;
  p.v += vel.y * dt;
  p.age += dt;
  if (p.u < -0.02 || p.u > 1.02 || p.v < -0.02 || p.v > 1.02 || p.age > p.maxAge) {
    respawnParticle(f, p);
    return;
  }
  p.trail.push({ u: p.u, v: p.v });
  if (p.trail.length > TRAIL_LEN) p.trail.shift();
}
function makeFragment(f, i, rng) {
  var types = ['grid', 'bloom', 'cluster', 'grid', 'bloom'];
  var type = i < 3 ? ['grid', 'bloom', 'cluster'][i] : types[Math.floor(rng() * types.length)];
  var ci = Math.floor(rng() * 3);
  var cj = (ci + 1 + Math.floor(rng() * 2)) % 3;
  var fr = {
    type: type,
    colorA: CARGO[ci], colorB: CARGO[cj],
    u: 0, v: 0, rng: mulberry32(f.seed + i * 104729 + 101),
    rot: rng() * TAU, rotSpeed: (rng() - 0.5) * 0.12,
    shearBase: (rng() - 0.5) * 0.5, scaleBase: 0.9 + rng() * 0.25,
    seedPhase: rng() * TAU, birth: f.birth,
    dots: [], petals: [], bow: rng() * TAU
  };
  var k;
  for (k = 0; k < 14; k++) {
    var a = rng() * TAU, r = Math.sqrt(rng()) * 0.85;
    fr.dots.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, r: 0.05 + rng() * 0.09, c: Math.floor(rng() * 3) });
  }
  for (k = 0; k < 7; k++) fr.petals.push(0.85 + 0.3 * Math.sin(k * 2.1 + fr.bow));
  return fr;
}
function placeFragments(f, rng) {
  var placed = [];
  for (var i = 0; i < 5; i++) {
    var fr = makeFragment(f, i, rng);
    var ok = false, tries = 0;
    while (!ok && tries < 40) {
      tries++;
      fr.u = 0.18 + 0.64 * rng();
      fr.v = 0.18 + 0.64 * rng();
      ok = true;
      for (var j = 0; j < placed.length; j++) {
        var dx = fr.u - placed[j].u, dy = fr.v - placed[j].v;
        if (dx * dx + dy * dy < 0.18 * 0.18) { ok = false; break; }
      }
    }
    placed.push(fr);
  }
  return placed;
}
function makeField(seed, nowT) {
  var rng = mulberry32(seed);
  var f = {
    seed: seed, birth: nowT, mintBase: 0,
    ph: [rng() * TAU, rng() * TAU, rng() * TAU],
    particles: [], fragments: []
  };
  for (var i = 0; i < N_PARTICLES; i++) f.particles.push(makeParticle(f, i));
  f.fragments = placeFragments(f, rng);
  return f;
}
function prerollField(f, nowT) {
  var steps = Math.round(PREROLL_S / PREROLL_DT);
  var t0 = nowT - PREROLL_S;
  for (var s = 0; s < steps; s++) {
    var t = t0 + s * PREROLL_DT;
    for (var i = 0; i < f.particles.length; i++) advanceParticle(f, f.particles[i], PREROLL_DT, t);
    advanceFragments(f, PREROLL_DT, t);
  }
}
function advanceFragments(f, dt, t) {
  for (var i = 0; i < f.fragments.length; i++) {
    var fr = f.fragments[i];
    var vel = fieldVel(f, fr.u, fr.v, t);
    fr.u += vel.x * dt * 0.4;
    fr.v += vel.y * dt * 0.4;
    if (fr.u < 0.16 || fr.u > 0.84 || fr.v < 0.16 || fr.v > 0.84) {
      fr.u = 0.2 + 0.6 * fr.rng();
      fr.v = 0.2 + 0.6 * fr.rng();
    }
  }
}
function advanceField(f, dt, t) {
  var n = Math.max(1, Math.ceil(dt / PREROLL_DT));
  var sub = dt / n;
  for (var s = 0; s < n; s++) {
    var tt = t - dt + (s + 1) * sub;
    for (var i = 0; i < f.particles.length; i++) advanceParticle(f, f.particles[i], sub, tt);
    advanceFragments(f, sub, tt);
  }
}
var tapCount = 0;
var current = makeField(BASE_SEED, 0);
prerollField(current, PHASE);
var prevField = null, prevFadeStart = 0;
function seedForTap(n) { return BASE_SEED + n * 104729; }
function doTap(t) {
  tapCount++;
  prevField = current;
  prevFadeStart = t;
  current = makeField(seedForTap(tapCount), t);
  current.mintBase = Math.min(0.45, tapCount * 0.15);
  prerollField(current, t);
}
function drawGrid(fr, col, e, t) {
  var i, x, bow = Math.sin(fr.bow + e * 2.0) * 0.18 * (0.4 + e);
  ctx.strokeStyle = rgba(col, 0.92);
  ctx.lineWidth = 0.055;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (i = 0; i <= 4; i++) {
    x = -1 + i * 0.5;
    ctx.moveTo(x, -1);
    ctx.quadraticCurveTo(x + bow * (1 - Math.abs(x)), 0, x - bow * 0.5, 1);
  }
  for (i = 0; i <= 4; i++) {
    x = -1 + i * 0.5;
    ctx.moveTo(-1, x);
    ctx.quadraticCurveTo(0, x + bow * (1 - Math.abs(x)), 1, x - bow * 0.5);
  }
  ctx.stroke();
  ctx.strokeStyle = rgba(col, 0.55);
  ctx.lineWidth = 0.04;
  ctx.beginPath();
  ctx.moveTo(-1, -1);
  ctx.lineTo(0.1 + e * 0.3, 0.1 + e * 0.3);
  ctx.lineTo(1, -1);
  ctx.stroke();
}
function drawBloom(fr, col, colB, e, t) {
  var k, ang;
  ctx.fillStyle = rgba(col, 0.9);
  for (k = 0; k < 7; k++) {
    ang = (k / 7) * TAU + e * 0.5;
    var len = fr.petals[k] * (1 + 0.25 * e * Math.sin(t * 0.3 + k));
    ctx.save();
    ctx.rotate(ang);
    ctx.translate(0, -0.52);
    ctx.scale(0.30, 0.58 * len);
    ctx.beginPath();
    ctx.moveTo(1, 0);
    ctx.arc(0, 0, 1, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = rgba(colB, 0.95);
  ctx.beginPath();
  ctx.moveTo(0.2, 0);
  ctx.arc(0, 0, 0.2, 0, TAU);
  ctx.fill();
}
function drawCluster(fr, e, t) {
  for (var k = 0; k < fr.dots.length; k++) {
    var d = fr.dots[k];
    var wob = 1 + 0.3 * e * Math.sin(t * 0.4 + k * 1.7);
    ctx.fillStyle = rgba(CARGO[d.c], 0.92);
    ctx.beginPath();
    ctx.moveTo(d.x * wob + d.r, d.y * wob);
    ctx.arc(d.x * wob, d.y * wob, d.r, 0, TAU);
    ctx.fill();
  }
}
function drawFragment(f, fr, comp, t, alpha) {
  var age = t - fr.birth;
  var e = clamp(age / 45 + f.mintBase, 0, 1);
  var S = 0.10 * comp.w;
  var px = comp.x + fr.u * comp.w;
  var py = comp.y + fr.v * comp.h;
  var rot = fr.rot + fr.rotSpeed * age;
  var shear = fr.shearBase + e * 0.55 * Math.sin(age * 0.23 + fr.seedPhase);
  var sc = fr.scaleBase * (1 + 0.18 * e * Math.sin(age * 0.31 + fr.seedPhase * 2));
  var col = lerpColor(fr.colorA, fr.colorB, e * 0.3);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(px, py);
  ctx.rotate(rot);
  ctx.transform(1, shear * 0.4, shear, 1, 0, 0);
  ctx.scale(sc * S / 2, sc * S / 2);
  if (fr.type === 'grid') drawGrid(fr, col, e, t);
  else if (fr.type === 'bloom') drawBloom(fr, col, lerpColor(fr.colorB, fr.colorA, 0.5), e, t);
  else drawCluster(fr, e, t);
  ctx.restore();
}
function drawField(f, comp, t, alpha) {
  var i, p, pt;
  var lw = Math.max(1, 0.14 * u());
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round';
  for (i = 0; i < f.particles.length; i++) {
    p = f.particles[i];
    if (p.trail.length < 2) continue;
    ctx.strokeStyle = rgba(p.color, p.alpha);
    ctx.lineWidth = lw;
    ctx.beginPath();
    pt = p.trail[0];
    ctx.moveTo(comp.x + pt.u * comp.w, comp.y + pt.v * comp.h);
    for (var j = 1; j < p.trail.length; j++) {
      pt = p.trail[j];
      ctx.lineTo(comp.x + pt.u * comp.w, comp.y + pt.v * comp.h);
    }
    ctx.stroke();
  }
  for (i = 0; i < f.fragments.length; i++) drawFragment(f, f.fragments[i], comp, t, 1);

}
function draw(t) {
  var dt = clamp(t - lastT, 0, 0.1);
  lastT = t;
  size();
  if (dt > 0) advanceField(current, dt, t);
  ctx.fillStyle = 'rgb(' + GROUND[0] + ',' + GROUND[1] + ',' + GROUND[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var comp = compRect();
  if (prevField) {
    var k = clamp((t - prevFadeStart) / 2, 0, 1);
    drawField(prevField, comp, t, 1 - k);
    drawField(current, comp, t, k);
    if (k >= 1) prevField = null;
  } else {
    drawField(current, comp, t, 1);
  }
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba(TEXT, 0.62);
  ctx.fillText('Not Only Perlin', comp.x + comp.w / 2, comp.y + Math.max(6, 0.012 * comp.h));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(TEXT, 0.45);
  ctx.fillText('2006 · 05 · 30', comp.x + comp.w / 2, comp.y + Math.max(6, 0.012 * comp.h) + titlePx + 5);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(TEXT, 0.5);

var downX = 0, downY = 0;
function onPointerDown(e) { downX = e.clientX; downY = e.clientY; }
function onPointerUp(e) {

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointerup', onPointerUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof window !== 'undefined') {
  window.__notonly1600 = { draw: draw, doTap: doTap, state: function () { return { tapCount: tapCount, seed: current.seed, mintBase: current.mintBase, fragments: current.fragments.map(function (fr) { return { type: fr.type, u: fr.u, v: fr.v }; }) }; } };
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;

    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
