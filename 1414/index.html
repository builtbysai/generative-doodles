<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captioning the City</title>
<style>
  html, body { margin: 0; padding: 0; background: #9a9a92; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1414000);

  var W = 0, H = 0, phone = false;
  function sizeCanvas() {
    var w, h;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      w = visualViewport.width; h = visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    var minDim = 1e9;
    if (typeof window !== 'undefined' && window.screen) {
      minDim = Math.min(window.screen.width, window.screen.height);
    }
    phone = (minDim < 700) || (h > w * 1.15);
  }
  sizeCanvas();
  if (typeof visualViewport !== 'undefined' && visualViewport &&
      typeof visualViewport.addEventListener === 'function') {
    visualViewport.addEventListener('resize', sizeCanvas);
  }
  if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
    window.addEventListener('resize', sizeCanvas);
  }

  var GRAY = '#9a9a92', CREAM = '#e8e2d4', INK = '#1a1a18',
      BLUE = '#7a9ab0', OCHRE = '#c89a5e', GOLD = '#d4a24e';

  // City layout, flat vector planes, all fractions of the frame.
  function buildings() {
    var list = [], i, x = 0.02, bw;
    // Rooftop row along the top.
    while (x < 0.98) {
      bw = 0.06 + rnd() * 0.09;
      list.push({
        x: x, w: bw, top: 0.02 + rnd() * 0.10, bot: 0.30,
        peak: rnd() < 0.35, windows: 2 + Math.floor(rnd() * 4)
      });
      x += bw + 0.012;
    }
    // Side blocks, leaving the central plaza open.
    list.push({ x: 0.02, w: 0.20, top: 0.36, bot: 0.62, peak: false, windows: 6 });
    list.push({ x: 0.78, w: 0.20, top: 0.36, bot: 0.62, peak: false, windows: 6 });
    list.push({ x: 0.02, w: 0.14, top: 0.70, bot: 0.96, peak: false, windows: 4 });
    list.push({ x: 0.84, w: 0.14, top: 0.70, bot: 0.96, peak: false, windows: 4 });
    return list;
  }
  var BLOCKS = buildings();

  function round4(v) {
    return Math.round(v * 10000) / 10000;
  }
  function smooth(u) {
    u = u < 0 ? 0 : (u > 1 ? 1 : u);
    return u * u * (3 - 2 * u);
  }

  // Caption pool. One 120 s loop; rush hour is cycle seconds 40-80, where
  // most spawn times cluster, so many captions are in flight at once.
  var TEXTS = ['bus brakes', 'rain on awnings', 'plane, two minutes',
               'door slams', 'heels on stone', 'siren, far off', 'market chatter'];
  var CYCLE = 120, DRIFT = 18, HOLD = 62, FADE = 14;
  var caps = [], i;
  for (i = 0; i < 26; i++) {
    var spawn;
    if (rnd() < 0.6) spawn = 40 + rnd() * 40;
    else spawn = rnd() * CYCLE;
    var edge = Math.floor(rnd() * 4), ex, ey;
    if (edge === 0) { ex = -0.05; ey = rnd(); }
    else if (edge === 1) { ex = 1.05; ey = rnd(); }
    else if (edge === 2) { ex = rnd(); ey = -0.05; }
    else { ex = rnd(); ey = 1.05; }
    var zone = rnd(), sx, sy, pile = false;
    if (zone < 0.45) {
      pile = true;
      sx = 0.5 + (rnd() - 0.5) * 0.34;
      sy = 0.55 + (rnd() - 0.5) * 0.26;
    } else if (zone < 0.75) {
      sx = 0.08 + rnd() * 0.84;
      sy = 0.06 + rnd() * 0.20;
    } else {
      sx = (rnd() < 0.5 ? 0.08 + rnd() * 0.14 : 0.78 + rnd() * 0.12);
      sy = 0.40 + rnd() * 0.50;
    }
    caps.push({
      text: TEXTS[Math.floor(rnd() * TEXTS.length)],
      spawn: spawn, ex: ex, ey: ey, sx: sx, sy: sy, pile: pile,
      size: 14 + Math.floor(rnd() * 7),
      tumble: (rnd() - 0.5) * 0.5, tphase: rnd() * 6.2832,
      wob: 0.01 + rnd() * 0.02, wphase: rnd() * 6.2832,
      override: null, overrideCycle: -1,
      resettle: null, dragSeq: 0
    });
  }

  var now = 0; // piece time in seconds, anchored on first rAF call
  var drag = null; // {cap, x, y}

  function cycleIndex(cap, t) {
    return Math.floor((t - cap.spawn) / CYCLE);
  }
  function phaseOf(cap, t) {
    var p = (t - cap.spawn) % CYCLE;
    if (p < 0) p += CYCLE;
    return p;
  }

  // Closed-form caption state at time t. Returns null when invisible.
  function stateAt(cap, t) {
    if (drag && drag.cap === cap) {
      return { x: drag.x, y: drag.y, rot: 0, alpha: 1, settled: false };
    }
    if (cap.resettle) {
      var rs = cap.resettle;
      var u = (t - rs.start) / 6;
      if (u < 1) {
        var wob = Math.sin(t * 1.3 + cap.wphase) * cap.wob;
        return {
          x: (rs.fx + (rs.tx - rs.fx) * smooth(u)) * W + wob * W,
          y: (rs.fy + (rs.ty - rs.fy) * smooth(u)) * H,
          rot: Math.sin(t * 0.9 + cap.tphase) * 0.12 * (1 - u),
          alpha: 1, settled: false
        };
      }
      // Re-settled: compact toward the pile centre like any settled caption,
      // but never past 55% of the original offset, so the drift stays legible.
      var age = t - (rs.start + 6);
      var cx = 0.5 * W, cy = 0.55 * H;
      var k = 0.55 + 0.45 * Math.exp(-age / 60);
      return {
        x: cx + (rs.tx * W - cx) * k, y: cy + (rs.ty * H - cy) * k,
        rot: 0, alpha: 1, settled: true
      };
    }
    var ci = cycleIndex(cap, t);
    if (cap.override && cap.overrideCycle !== ci) cap.override = null;
    var sx = cap.override ? cap.override.x : cap.sx;
    var sy = cap.override ? cap.override.y : cap.sy;
    var pile = cap.override ? cap.override.pile : cap.pile;
    var p = phaseOf(cap, t);
    if (p < DRIFT) {
      var du = p / DRIFT;
      var px = cap.ex + (sx - cap.ex) * smooth(du);
      var py = cap.ey + (sy - cap.ey) * smooth(du);
      var wob2 = Math.sin(t * 1.3 + cap.wphase) * cap.wob * Math.sin(du * 3.1416);
      return {
        x: px * W + wob2 * W, y: py * H,
        rot: Math.sin(t * 0.9 + cap.tphase) * 0.18 * Math.sin(du * 3.1416),
        alpha: 1, settled: false
      };
    }
    if (p < DRIFT + HOLD) {
      var age2 = cap.override ? (t - cap.overrideSettledAt) : (p - DRIFT);
      if (pile) {
        var cx2 = 0.5 * W, cy2 = 0.55 * H;
        var k2 = 0.55 + 0.45 * Math.exp(-age2 / 60);
        return {
          x: cx2 + (sx * W - cx2) * k2, y: cy2 + (sy * H - cy2) * k2,
          rot: 0, alpha: 1, settled: true
        };
      }
      return { x: sx * W, y: sy * H, rot: 0, alpha: 1, settled: true };
    }
    if (p < DRIFT + HOLD + FADE) {
      var fu = (p - DRIFT - HOLD) / FADE;
      var a = 1 - fu;
      if (pile) {
        var cx3 = 0.5 * W, cy3 = 0.55 * H;
        var k3 = cap.override
          ? 0.55 + 0.45 * Math.exp(-(t - cap.overrideSettledAt) / 60)
          : 0.55 + 0.45 * Math.exp(-(DRIFT + HOLD) / 60);
        return {
          x: cx3 + (sx * W - cx3) * k3, y: cy3 + (sy * H - cy3) * k3,
          rot: 0, alpha: round4(a), settled: true
        };
      }
      return { x: sx * W, y: sy * H, rot: 0, alpha: round4(a), settled: true };
    }
    return null;
  }

  function draw(t) {
    now = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GRAY;
    ctx.fillRect(0, 0, W, H);

    // Diagonal streets crossing at the central intersection.
    ctx.save();
    ctx.fillStyle = GOLD;
    ctx.globalAlpha = round4(0.85);
    ctx.translate(W * 0.5, H * 0.55);
    ctx.rotate(0.6);
    ctx.fillRect(-W * 0.75, -H * 0.035, W * 1.5, H * 0.07);
    ctx.rotate(-1.2);
    ctx.fillRect(-W * 0.75, -H * 0.035, W * 1.5, H * 0.07);
    ctx.restore();
    ctx.globalAlpha = 1;

    // Central intersection plaza.
    ctx.fillStyle = CREAM;
    ctx.globalAlpha = round4(0.9);
    ctx.beginPath();
    ctx.ellipse(W * 0.5, H * 0.55, W * 0.19, H * 0.15, 0, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Buildings: flat cream planes with darker roofs and windows.
    var b, j;
    for (i = 0; i < BLOCKS.length; i++) {
      b = BLOCKS[i];
      var bx = b.x * W, by = b.top * H, bw = b.w * W, bh = (b.bot - b.top) * H;
      ctx.fillStyle = CREAM;
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#8f8a7c';
      ctx.fillRect(bx, by, bw, Math.max(3, H * 0.012));
      if (b.peak) {
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + bw / 2, by - H * 0.03);
        ctx.lineTo(bx + bw, by);
        ctx.closePath();
        ctx.fillStyle = CREAM;
        ctx.fill();
      }
      ctx.fillStyle = '#8f8a7c';
      for (j = 0; j < b.windows; j++) {
        var wx = bx + bw * (0.12 + 0.76 * ((j * 0.37) % 1));
        var wy = by + bh * (0.25 + 0.5 * ((j * 0.53) % 1));
        ctx.fillRect(wx, wy, Math.max(3, W * 0.012), Math.max(4, H * 0.02));
      }
    }

    // Settled drift: a soft ochre wash under the central pile.
    ctx.fillStyle = OCHRE;
    ctx.globalAlpha = round4(0.18);
    ctx.beginPath();
    ctx.ellipse(W * 0.5, H * 0.55, W * 0.17, H * 0.12, 0, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Captions: drifting in blue, settled in ink with an ochre mark.
    var fs = phone ? 0.85 : 1;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (i = 0; i < caps.length; i++) {
      var st = stateAt(caps[i], t);
      if (!st || st.alpha <= 0.01) continue;
      var size = caps[i].size * fs * Math.min(1.15, Math.max(0.75, Math.min(W, H) / 900));
      ctx.font = Math.round(size) + 'px sans-serif';
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.rotate(st.rot);
      ctx.globalAlpha = st.alpha;
      ctx.fillStyle = st.settled ? INK : BLUE;
      ctx.fillText(caps[i].text, 0, 0);
      if (st.settled) {
        var tw = ctx.measureText(caps[i].text).width;
        ctx.fillStyle = OCHRE;
        ctx.fillRect(-tw / 2, size * 0.7, tw, Math.max(2, size * 0.08));
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function posOf(e) {
    if (typeof e.offsetX === 'number' && typeof e.offsetY === 'number') {
      return { x: e.offsetX, y: e.offsetY };
    }
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function pick(x, y) {
    var best = null, bestD = 1e9, k, st, d;
    for (k = 0; k < caps.length; k++) {
      if (caps[k].resettle) continue;
      st = stateAt(caps[k], now);
      if (!st || st.alpha < 0.4) continue;
      d = (st.x - x) * (st.x - x) + (st.y - y) * (st.y - y);
      if (d < bestD) { bestD = d; best = caps[k]; }
    }
    if (best && bestD < 46 * 46) return best;
    return null;
  }
  function onDown(e) {
    if (e.preventDefault) e.preventDefault();
    var p = posOf(e);
    var cap = pick(p.x, p.y);
    if (cap) drag = { cap: cap, x: p.x, y: p.y };
  }
  function onMove(e) {
    if (!drag) return;
    var p = posOf(e);
    drag.x = p.x; drag.y = p.y;
  }
  function onUp(e) {
    if (!drag) return;
    var p = posOf(e);
    var cap = drag.cap;
    drag = null;
    cap.dragSeq += 1;
    // Re-settle elsewhere: a fresh seeded point near the release point.
    var r2 = mulberry32(1414000 + cap.dragSeq * 7919 + 12345);
    var tx = p.x / W + (r2() - 0.5) * 0.24;
    var ty = p.y / H + (r2() - 0.5) * 0.20;
    tx = Math.max(0.10, Math.min(0.90, tx));
    ty = Math.max(0.10, Math.min(0.90, ty));
    var nearPile = (tx - 0.5) * (tx - 0.5) + (ty - 0.55) * (ty - 0.55) < 0.045;
    cap.resettle = {
      fx: p.x / W, fy: p.y / H, tx: tx, ty: ty, start: now
    };
    cap.override = { x: tx, y: ty, pile: nearPile };
    cap.overrideCycle = cycleIndex(cap, now);
    cap.overrideSettledAt = now + 6;
    // Clear the resettle record once it has played out.
    var rs = cap.resettle;
    var clearAt = rs.start + 6;
    cap._clearResettleAt = clearAt;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // Clear finished resettle records inside the state function path.
  var origStateAt = stateAt;
  stateAt = function (cap, t) {
    if (cap.resettle && t >= cap._clearResettleAt) {
      cap.resettle = null;
    }
    return origStateAt(cap, t);
  };

  // Frame one is drawn synchronously at a constant phase; the clock starts
  // only with the rAF loop.
  draw(0);
  var t0 = null;
  function loop(ts) {
    if (t0 === null) t0 = ts;
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
