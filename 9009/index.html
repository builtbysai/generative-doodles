<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9009 · Corridor · Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0e0e10;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 620px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #b9b2a0; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 700px);
    aspect-ratio: 1 / 1;
    background: #0a0a0b;
    border: 1px solid #232326;
    box-shadow: 0 18px 60px rgba(0,0,0,0.6);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #b9b2a0; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9009</span> · Corridor</h1>
  <p>A flat quadtree of solved geometry, flown through like architecture.
  Kwok's 189D0 move: the index does the composing, the camera does the rest.
  <b>Click the piece for a new variation.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 99;
const T_FROZEN = params.has("t") ? parseFloat(params.get("t")) : null; // QA: freeze clock (ms)
const FLAT = params.has("flat"); // QA: show the flat index instead of the corridor

const TS = 1408;                 // flat index texture, px
const INK = "#f4f2ec", VOID = "#0a0a0b";
const TAU = Math.PI * 2;

// Corridor geometry (world units)
const H = 1;          // tunnel half-size
const SEG = 8;        // one texture tile = one tunnel segment
const RIB = 4;        // arch ribs every RIB units (seams land on ribs)
const ZNEAR = 0.5, ZMAX = 8;
const FOCAL = 0.95;
const SPEED = 1.4;    // units per second

// ---------- flat index: quadtree + motif solvers ----------
function pickMotif(rnd){
  const r = rnd();
  let m;
  if (r < 0.24) m = 0;       // concentric rings
  else if (r < 0.44) m = 1;  // circle clipped by inset square
  else if (r < 0.64) m = 2;  // offset-circle rosette
  else if (r < 0.80) m = 3;  // dot grid
  else m = 4;                // nested rotated squares
  return { m, inv: rnd() < 0.12 }; // rare inverted leaf: a lit panel in the dark
}

function motifRings(g, rnd, x, y, w, h, fg){
  const cx = x + w / 2, cy = y + h / 2, s = Math.min(w, h);
  const n = Math.max(2, Math.min(8, Math.round(s / 30)));
  const rmax = s * 0.46;
  for (let i = 1; i <= n; i++){
    g.beginPath(); g.arc(cx, cy, rmax * i / n, 0, TAU); g.stroke();
  }
  g.fillStyle = fg;
  g.beginPath(); g.arc(cx, cy, Math.max(1.6, s * 0.022), 0, TAU); g.fill();
}
function motifCircSq(g, rnd, x, y, w, h, fg, bg){
  const cx = x + w / 2, cy = y + h / 2, s = Math.min(w, h);
  g.fillStyle = fg;
  g.beginPath(); g.arc(cx, cy, s * 0.44, 0, TAU); g.fill();
  const sq = s * 0.62;
  g.fillStyle = bg;
  g.fillRect(cx - sq / 2, cy - sq / 2, sq, sq);
  g.strokeStyle = fg;
  g.beginPath(); g.rect(cx - sq / 2, cy - sq / 2, sq, sq); g.stroke();
  g.beginPath(); g.arc(cx, cy, s * 0.44, 0, TAU); g.stroke();
}
function motifRosette(g, rnd, x, y, w, h, fg){
  const cx = x + w / 2, cy = y + h / 2, s = Math.min(w, h);
  const n = 6 + ((rnd() * 3) | 0);
  const ro = s * 0.17, rp = s * 0.27, off = rnd() * TAU;
  for (let i = 0; i < n; i++){
    const a = off + i / n * TAU;
    g.beginPath();
    g.arc(cx + Math.cos(a) * ro, cy + Math.sin(a) * ro, rp, 0, TAU);
    g.stroke();
  }
  g.beginPath(); g.arc(cx, cy, Math.max(1.6, s * 0.07), 0, TAU); g.stroke();
}
function motifDots(g, rnd, x, y, w, h, fg){
  const s = Math.min(w, h);
  const sp = Math.max(7, Math.min(26, s / 8));
  const dr = Math.max(1.6, Math.min(5, sp * 0.24));
  g.fillStyle = fg;
  for (let gy = y + rnd() * sp; gy < y + h; gy += sp){
    for (let gx = x + rnd() * sp; gx < x + w; gx += sp){
      g.beginPath(); g.arc(gx, gy, dr, 0, TAU); g.fill();
    }
  }
}
function motifNestSq(g, rnd, x, y, w, h, fg){
  const cx = x + w / 2, cy = y + h / 2, s = Math.min(w, h);
  const k = Math.max(2, Math.min(6, Math.round(s / 46)));
  const rot = rnd() * Math.PI / 2, step = (12 + rnd() * 10) * Math.PI / 180;
  for (let i = 0; i < k; i++){
    const side = s * 0.9 * (1 - i / (k + 0.4));
    g.save();
    g.translate(cx, cy); g.rotate(rot + i * step);
    g.strokeRect(-side / 2, -side / 2, side, side);
    g.restore();
  }
}
const MOTIFS = [motifRings, motifCircSq, motifRosette, motifDots, motifNestSq];

function buildTexture(sd){
  const rnd = mulberry32(sd);
  const cv = document.createElement("canvas");
  cv.width = cv.height = TS;
  const g = cv.getContext("2d");
  g.fillStyle = VOID;
  g.fillRect(0, 0, TS, TS);

  const leaves = [];
  const MINL = TS / 32;
  (function split(x, y, w, h, depth){
    const areaFrac = (w * h) / (TS * TS);
    const pSplit = Math.max(0, 0.90 - depth * 0.18); // split chance falls with depth
    const must = areaFrac > 0.25 && depth < 5;        // huge cells must keep going
    const can = depth < 5 && w > MINL * 2 && h > MINL * 2;
    if (!can || (!must && rnd() > pSplit)){
      leaves.push({ x, y, w, h, depth, ...pickMotif(rnd) });
      return;
    }
    if (depth >= 1 && rnd() < 0.15){                 // golden-ratio slab split
      const t = rnd() < 0.5 ? 0.618 : 0.382;
      if (w >= h){
        const sx = x + w * t;
        split(x, y, sx - x, h, depth + 1);
        split(sx, y, x + w - sx, h, depth + 1);
      } else {
        const sy = y + h * t;
        split(x, y, w, sy - y, depth + 1);
        split(x, sy, w, y + h - sy, depth + 1);
      }
      return;
    }
    const tx = 0.34 + rnd() * 0.32, ty = 0.34 + rnd() * 0.32;
    const sx = x + w * tx, sy = y + h * ty;
    split(x, y, sx - x, sy - y, depth + 1);
    split(sx, y, x + w - sx, sy - y, depth + 1);
    split(x, sy, sx - x, y + h - sy, depth + 1);
    split(sx, sy, x + w - sx, y + h - sy, depth + 1);
  })(0, 0, TS, TS, 0);

  for (const L of leaves){
    const s = Math.min(L.w, L.h);
    const fg = L.inv ? VOID : INK;
    const bg = L.inv ? INK : VOID;
    g.save();
    g.beginPath(); g.rect(L.x, L.y, L.w, L.h); g.clip();
    if (L.inv){ g.fillStyle = INK; g.fillRect(L.x, L.y, L.w, L.h); }
    // stroke weight scales with leaf size: small leaves stay legible
    g.lineWidth = Math.max(1.4, Math.min(9, s * 0.05));
    g.strokeStyle = fg; g.fillStyle = fg;
    MOTIFS[L.m](g, rnd, L.x, L.y, L.w, L.h, fg, bg);
    g.restore();
    // the index grid itself stays visible
    g.lineWidth = Math.max(1, s * 0.014);
    g.strokeStyle = fg;
    g.strokeRect(L.x, L.y, L.w, L.h);
  }
  return cv;
}

// ---------- corridor projection ----------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let tex = buildTexture(seed);
let S = 0, D = 1, cx = 0, cy = 0;

function sizeCanvas(){
  const stage = document.getElementById("stage");
  S = stage.clientWidth;
  D = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(S * D);
  canvas.height = Math.round(S * D);
  cx = S / 2; cy = S / 2;
}
window.addEventListener("resize", sizeCanvas);
sizeCanvas();

function proj(x, y, zr){
  const s = FOCAL * (S / 2) / zr;
  return [cx + x * s, cy + y * s];
}

// one wall slice: texture strip [0,TS]x[v0*TS,v1*TS] -> quad (p00,p10,p01)
function wallSlice(p00, p10, p01, v0, v1){
  const a = p10[0] - p00[0], b = p10[1] - p00[1];
  const c = p01[0] - p00[0], d = p01[1] - p00[1];
  ctx.setTransform(a * D, b * D, c * D, d * D, p00[0] * D, p00[1] * D);
  ctx.drawImage(tex, 0, v0 * TS, TS, (v1 - v0) * TS, 0, 0, 1, 1);
}

function wallPoint(wall, t, zr){
  return wall[0] === "x" ? proj(wall[1], t, zr) : proj(t, wall[1], zr);
}

function drawFrame(tms){
  const camZ = tms / 1000 * SPEED;
  ctx.setTransform(D, 0, 0, D, 0, 0);
  ctx.fillStyle = VOID;
  ctx.fillRect(0, 0, S, S);

  // the flat index hangs at the vanishing point: the poster's face
  const f0 = proj(-H, -H, ZMAX), f1 = proj(H, H, ZMAX);
  ctx.drawImage(tex, f0[0], f0[1], f1[0] - f0[0], f1[1] - f0[1]);

  // walls: far segments first, slices spaced evenly in 1/z for a clean taper
  const walls = [["x", -H], ["x", H], ["y", -H], ["y", H]];
  const kMin = Math.floor((camZ + ZNEAR) / SEG);
  const kMax = Math.floor((camZ + ZMAX - 1e-6) / SEG);
  const NSL = 30;
  for (let k = kMax; k >= kMin; k--){
    const zA = Math.max(k * SEG, camZ + ZNEAR);
    const zB = Math.min((k + 1) * SEG, camZ + ZMAX);
    const wFar = 1 / (zB - camZ), wNear = 1 / (zA - camZ);
    for (const wall of walls){
      for (let j = 0; j < NSL; j++){
        const w0 = wFar + (wNear - wFar) * j / NSL;
        const w1 = wFar + (wNear - wFar) * (j + 1) / NSL;
        const zrFar = 1 / w0, zrNear = 1 / w1;
        const zwFar = camZ + zrFar, zwNear = camZ + zrNear;
        const vFar = (zwFar - k * SEG) / SEG;
        const vNear = (zwNear - k * SEG) / SEG;
        wallSlice(
          wallPoint(wall, -H, zrFar), wallPoint(wall, H, zrFar),
          wallPoint(wall, -H, zrNear), vFar, vNear
        );
      }
    }
  }
  ctx.setTransform(D, 0, 0, D, 0, 0);

  // arch ribs: heavy at segment seams (they hide the tile joint), light between
  const mMin = Math.ceil((camZ + ZNEAR) / RIB);
  const mMax = Math.floor((camZ + ZMAX) / RIB);
  for (let m = mMax; m >= mMin; m--){
    const zr = m * RIB - camZ;
    if (zr < ZNEAR + 0.02) continue;
    const fade = Math.min(1, (zr - ZNEAR) / 0.7);
    const heavy = (m % 2) === 0;
    const lw = Math.min(11, Math.max(0.8, 64 / zr)) * (heavy ? 1.9 : 1);
    ctx.strokeStyle = "rgba(244,242,236," + ((heavy ? 0.95 : 0.6) * fade).toFixed(3) + ")";
    ctx.lineWidth = lw;
    const a = proj(-H, -H, zr), b = proj(H, -H, zr);
    const c = proj(H, H, zr), d = proj(-H, H, zr);
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]);
    ctx.closePath();
    ctx.stroke();
  }

  // faint center glow keeps the vanishing point alive
  const vg = ctx.createRadialGradient(cx, cy, 0, cx, cy, S * 0.55);
  vg.addColorStop(0, "rgba(244,242,236,0.05)");
  vg.addColorStop(1, "rgba(244,242,236,0)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, S, S);
}

function drawFlat(){
  ctx.setTransform(D, 0, 0, D, 0, 0);
  ctx.fillStyle = VOID;
  ctx.fillRect(0, 0, S, S);
  ctx.drawImage(tex, 0, 0, S, S);
}

document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  tex = buildTexture(seed);
});

const t0 = performance.now();
function tick(){
  const tms = T_FROZEN !== null ? T_FROZEN : performance.now() - t0;
  if (FLAT) drawFlat(); else drawFrame(tms);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
