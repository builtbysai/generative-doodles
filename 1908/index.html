<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1908 Mobile Equilibrium</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette from the prompt: black void, dim spotlight figures,
  // faint grey wires, steady amber for written patterns, sudden white
  // for freedom impulses.
  var VOID = '#050505';
  var WIRE = '#5a5a58';
  var WIRE_FAINT = '#3a3a38';
  var SPOT = '#9a9a92';
  var FIGURE = '#8f8f88';
  var FIGURE_DARK = '#5c5c57';
  var FIGURE_DIM = '#767670';
  var AMBER = '#d9a441';
  var AMBER_SOFT = '#b98a3a';
  var WHITE = '#f5f5f0';
  var PLATE = '#c9c9c2';
  var PLATE_DIM = '#8a8a82';

  // Fixed-phase first frame: t = 23 s. At that moment the latest freedom
  // impulse (struck at t = 21.5 s, the tenor sax) is 1.5 s old, so its
  // white flash is still half bright; the beam is tilted about 0.22 rad
  // by the impulse kick plus the slow swing; the three agents hang at
  // different heights: drums high left, sax mid right, guitar low center.
  // All state is a pure function of t, so frame one is byte-reproducible.
  var FIRST_T = 23;
  var IMPULSE_GAP = 17;        // one freedom impulse every 17 s
  var IMPULSE_FIRST = 4.5;     // impulses strike at 4.5, 21.5, 38.5 s ...

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha

  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      // Vertical mobile composition: a square stage, page ground is the
      // piece's own black void.
      stageH = vh * 0.94;
      stageW = Math.min(vw * 0.94, stageH);
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Pendulum model. The beam tilt is a slow swing plus a decaying kick
  // from each freedom impulse. The kick of impulse k (struck at
  // IMPULSE_FIRST + k * IMPULSE_GAP) is a damped sine in the age since
  // the strike. Tension oscillates slowly between written pattern
  // (steady amber) and freedom (impulse bursts).
  function impulseIndex(t) {
    if (t < IMPULSE_FIRST) { return -1; }
    return Math.floor((t - IMPULSE_FIRST) / IMPULSE_GAP);
  }
  function impulseAge(t) {
    var k = impulseIndex(t);
    if (k < 0) { return 999; }
    return t - (IMPULSE_FIRST + k * IMPULSE_GAP);
  }
  function beamTilt(t) {
    var th = 0.10 * Math.sin(t * 0.11) + 0.05 * Math.sin(t * 0.043 + 1.3);
    var k, tk, age;
    for (k = impulseIndex(t); k >= 0 && k > impulseIndex(t) - 3; k--) {
      tk = IMPULSE_FIRST + k * IMPULSE_GAP;
      age = t - tk;
      if (age >= 0) {
        th += 0.16 * Math.exp(-age / 6) * Math.sin(age * 1.1);
      }
    }
    return th;
  }
  function tension(t) {
    return 0.5 + 0.5 * Math.sin(t * 0.07 + 0.8);
  }
  // The impulse agent cycles drums, sax, guitar, drum machine.
  function impulseAgent(t) {
    var k = impulseIndex(t);
    if (k < 0) { return 0; }
    return ((k % 4) + 4) % 4;
  }
  // White flash envelope: bright at the strike, gone after 3 s.
  function flashAlpha(t) {
    var age = impulseAge(t);
    if (age > 3) { return 0; }
    return a4(0.9 * (1 - age / 3));
  }

  // A hanging point: pivot px,py, wire length len, swing phase.
  // Returns the agent anchor point after its own pendulum swing.
  function hangPoint(px, py, len, t, omega, phase, extraTilt) {
    var ang = extraTilt + 0.06 * Math.sin(t * omega + phase);
    return { x: px + Math.sin(ang) * len, y: py + Math.cos(ang) * len, ang: ang };
  }

  function drawWire(x1, y1, x2, y2, faint) {
    ctx.strokeStyle = hexA(faint ? WIRE_FAINT : WIRE, faint ? 0.55 : 0.8);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawSpot(x, y, r, alpha) {
    var g = ctx.createRadialGradient(x, y, 2, x, y, r);
    g.addColorStop(0, hexA(SPOT, alpha));
    g.addColorStop(1, hexA(SPOT, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDrums(x, y, s, t, amber) {
    // A drum kit in silhouette: bass drum, snare, two cymbals on stands.
    var r = 26 * s;
    ctx.fillStyle = FIGURE_DIM;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = FIGURE_DARK;
    ctx.beginPath();
    ctx.moveTo(x + r * 0.55, y);
    ctx.arc(x, y, r * 0.55, 0, Math.PI * 2);
    ctx.fill();
    // Snare, upper right.
    ctx.fillStyle = FIGURE;
    ctx.beginPath();
    ctx.moveTo(x + r * 1.5, y - r * 0.9);
    ctx.arc(x + r * 0.95, y - r * 0.9, r * 0.42, 0, Math.PI * 2);
    ctx.fill();
    // Cymbals: thin tilted ellipses on stands.
    ctx.strokeStyle = FIGURE;
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.moveTo(x - r * 1.5, y - r * 1.05);
    ctx.lineTo(x - r * 0.6, y - r * 0.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + r * 1.4, y - r * 1.7);
    ctx.lineTo(x + r * 0.9, y - r * 1.1);
    ctx.stroke();
    ctx.fillStyle = hexA(amber ? AMBER : FIGURE, amber ? 0.85 : 0.9);
    ctx.beginPath();
    ctx.moveTo(x - r * 1.05, y - r * 1.25);
    ctx.arc(x - r * 1.05, y - r * 1.25, 3.5 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + r * 1.55, y - r * 1.9);
    ctx.arc(x + r * 1.55, y - r * 1.9, 3.5 * s, 0, Math.PI * 2);
    ctx.fill();
    // Sticks: two short lines crossed above the kit.
    var wob = Math.sin(t * 0.9) * 4 * s;
    ctx.strokeStyle = FIGURE_DIM;
    ctx.lineWidth = 1.6 * s;
    ctx.beginPath();
    ctx.moveTo(x - r * 0.4, y - r * 1.5 + wob);
    ctx.lineTo(x + r * 0.2, y - r * 0.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + r * 0.5, y - r * 1.5 - wob);
    ctx.lineTo(x - r * 0.1, y - r * 0.9);
    ctx.stroke();
  }

  function drawSax(x, y, s, t, amber) {
    // A tenor sax in silhouette: a long curved tube with a flared bell.
    var len = 74 * s;
    var sway = Math.sin(t * 0.5 + 2.0) * 3 * s;
    ctx.strokeStyle = FIGURE;
    ctx.lineWidth = 9 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 6 * s, y - len * 0.55);
    ctx.quadraticCurveTo(x - 16 * s + sway, y, x + 2 * s, y + len * 0.42);
    ctx.stroke();
    // Bell flare.
    ctx.fillStyle = FIGURE_DIM;
    ctx.beginPath();
    ctx.moveTo(x + 2 * s + 12 * s, y + len * 0.42);
    ctx.arc(x + 2 * s, y + len * 0.42, 13 * s, -Math.PI * 0.35, Math.PI * 0.62);
    ctx.closePath();
    ctx.fill();
    // Mouthpiece.
    ctx.strokeStyle = FIGURE_DARK;
    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.moveTo(x - 6 * s, y - len * 0.55);
    ctx.lineTo(x - 14 * s, y - len * 0.68);
    ctx.stroke();
    // Keys: a row of small dots down the tube, amber while written.
    var i, ky;
    for (i = 0; i < 5; i++) {
      ky = y - len * 0.35 + i * len * 0.16;
      ctx.fillStyle = hexA(amber ? AMBER : FIGURE_DIM, amber ? 0.9 : 0.9);
      ctx.beginPath();
      ctx.moveTo(x - 12 * s + 3 * s, ky);
      ctx.arc(x - 12 * s, ky, 2.6 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGuitar(x, y, s, t, amber) {
    // A guitar in silhouette: figure-eight body, neck, headstock.
    var tilt = -0.5 + Math.sin(t * 0.4 + 1.0) * 0.03;
    var bx = x, by = y;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(tilt);
    ctx.fillStyle = FIGURE_DIM;
    ctx.beginPath();
    ctx.moveTo(16 * s, 6 * s);
    ctx.arc(0, 6 * s, 16 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(21 * s, -16 * s);
    ctx.arc(0, -16 * s, 21 * s, 0, Math.PI * 2);
    ctx.fill();
    // Sound hole.
    ctx.fillStyle = VOID;
    ctx.beginPath();
    ctx.moveTo(7 * s, -2 * s);
    ctx.arc(0, -2 * s, 7 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = hexA(amber ? AMBER : FIGURE, amber ? 0.9 : 0.9);
    ctx.lineWidth = 1.4 * s;
    ctx.beginPath();
    ctx.moveTo(7 * s, -2 * s);
    ctx.arc(0, -2 * s, 7 * s, 0, Math.PI * 2);
    ctx.stroke();
    // Neck and headstock.
    ctx.strokeStyle = FIGURE;
    ctx.lineWidth = 6 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -34 * s);
    ctx.lineTo(0, -72 * s);
    ctx.stroke();
    ctx.fillStyle = FIGURE_DARK;
    ctx.fillRect(-5 * s, -84 * s, 10 * s, 14 * s);
    // Strings.
    ctx.strokeStyle = hexA(FIGURE_DIM, 0.7);
    ctx.lineWidth = 0.8 * s;
    var j;
    for (j = -1; j <= 1; j++) {
      ctx.beginPath();
      ctx.moveTo(j * 2.4 * s, -72 * s);
      ctx.lineTo(j * 2.4 * s, 20 * s);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMachine(x, y, s, t, amber, lit) {
    // A small drum machine: a dark box with a grid of pads, one lit.
    var w = 34 * s, h = 24 * s;
    ctx.fillStyle = FIGURE_DARK;
    ctx.fillRect(x - w / 2, y - h / 2, w, h);
    ctx.strokeStyle = hexA(FIGURE, 0.8);
    ctx.lineWidth = 1;
    ctx.strokeRect(x - w / 2, y - h / 2, w, h);
    var r, c, px, py;
    for (r = 0; r < 2; r++) {
      for (c = 0; c < 4; c++) {
        px = x - w / 2 + 5 * s + c * 7 * s;
        py = y - h / 2 + 5 * s + r * 8 * s;
        var isLit = lit && (r * 4 + c) === (Math.floor(t / 0.5) % 8);
        ctx.fillStyle = hexA(isLit ? AMBER : FIGURE_DIM, isLit ? 0.95 : 0.8);
        ctx.fillRect(px, py, 5 * s, 5 * s);
      }
    }
    // A tiny blinking step light while written patterns hold.
    if (amber) {
      ctx.fillStyle = hexA(AMBER, 0.6 + 0.4 * Math.sin(t * 2.2));
      ctx.beginPath();
      ctx.moveTo(x + w / 2 - 4 * s, y - h / 2 + 3 * s);
      ctx.arc(x + w / 2 - 6 * s, y - h / 2 + 3 * s, 1.8 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFlash(x, y, r, alpha, t) {
    // A sudden white flash: a bright core, a halo, and short rays.
    var g = ctx.createRadialGradient(x, y, 2, x, y, r);
    g.addColorStop(0, hexA(WHITE, a4(alpha)));
    g.addColorStop(0.4, hexA(WHITE, a4(alpha * 0.35)));
    g.addColorStop(1, hexA(WHITE, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    var i, a;
    ctx.strokeStyle = hexA(WHITE, a4(alpha * 0.8));
    ctx.lineWidth = 1.6;
    for (i = 0; i < 8; i++) {
      a = i * Math.PI / 4 + 0.3;
      var r1 = r * 0.55, r2 = r * (0.8 + 0.25 * Math.sin(t * 3 + i));
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
      ctx.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2);
      ctx.stroke();
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Black void.
    ctx.fillStyle = VOID;
    ctx.fillRect(0, 0, W, H);

    var s = clamp(Math.min(W, H) / 620, 0.62, 1.25);
    var ten = tension(t);
    var written = ten > 0.55;
    var flash = flashAlpha(t);
    var impAgent = impulseAgent(t);
    var th = beamTilt(t);

    // Pivot and main beam. The pivot sits low enough that even at the
    // strongest tilt the beam's rising end stays clear of the date plate.
    var px = W / 2, py = H * 0.21;
    var beamHalf = W * 0.36;
    var bx1 = px - Math.cos(th) * beamHalf, by1 = py + H * 0.02 - Math.sin(th) * beamHalf;
    var bx2 = px + Math.cos(th) * beamHalf, by2 = py + H * 0.02 + Math.sin(th) * beamHalf;
    var bcx = (bx1 + bx2) / 2, bcy = (by1 + by2) / 2;

    // The invisible wire from above: a single faint line from the top edge.
    drawWire(px, -4, px, py, true);

    // Hanging points, each with its own slow pendulum swing.
    var drums = hangPoint(bx1, by1, H * 0.24, t, 0.21, 0.4, th * 0.5);
    var sax = hangPoint(bx2, by2, H * 0.32, t, 0.17, 2.2, th * 0.5);
    var sub = hangPoint(bcx, bcy, H * 0.16, t, 0.15, 1.1, th * 0.4);
    var subTilt = th * 0.6 + 0.04 * Math.sin(t * 0.13 + 0.9);
    var subHalf = W * 0.11;
    var sx1 = sub.x - Math.cos(subTilt) * subHalf, sy1 = sub.y - Math.sin(subTilt) * subHalf;
    var sx2 = sub.x + Math.cos(subTilt) * subHalf, sy2 = sub.y + Math.sin(subTilt) * subHalf;
    var guitar = hangPoint(sx1, sy1, H * 0.37, t, 0.19, 3.0, subTilt * 0.5);
    var machine = hangPoint(sx2, sy2, H * 0.10, t, 0.23, 4.4, subTilt * 0.5);

    // Dim spotlights behind each figure.
    drawSpot(drums.x, drums.y, 120 * s, 0.10);
    drawSpot(sax.x, sax.y, 120 * s, 0.10);
    drawSpot(guitar.x, guitar.y, 110 * s, 0.09);
    drawSpot(machine.x, machine.y, 60 * s, 0.07);

    // Wires: beam to each agent, beam center to sub-bar, sub-bar to guitar
    // and machine.
    drawWire(bx1, by1, drums.x, drums.y - 34 * s, false);
    drawWire(bx2, by2, sax.x, sax.y - 46 * s, false);
    drawWire(bcx, bcy, sub.x, sub.y, false);
    drawWire(sx1, sy1, guitar.x, guitar.y - 40 * s, false);
    drawWire(sx2, sy2, machine.x, machine.y - 12 * s, false);

    // Main beam and sub-bar.
    ctx.strokeStyle = hexA(FIGURE_DIM, 0.95);
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx1, by1);
    ctx.lineTo(bx2, by2);
    ctx.stroke();
    ctx.strokeStyle = hexA(FIGURE_DIM, 0.85);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx1, sy1);
    ctx.lineTo(sx2, sy2);
    ctx.stroke();
    // Pivot hub.
    ctx.fillStyle = FIGURE_DIM;
    ctx.beginPath();
    ctx.moveTo(px + 4, py + H * 0.02);
    ctx.arc(px, py + H * 0.02, 4, 0, Math.PI * 2);
    ctx.fill();

    // Written-pattern moments: a steady amber line of sequenced dots
    // along the beam, lit while the tension favors the written pattern.
    var i, dx, dy, lit;
    for (i = 0; i < 7; i++) {
      var u = i / 6;
      dx = lerp(bx1, bx2, u);
      dy = lerp(by1, by2, u) - 8 * s;
      lit = written && (Math.floor(t / 0.6) % 7) === i;
      ctx.fillStyle = hexA(AMBER, lit ? 0.95 : (written ? 0.45 : 0.18));
      ctx.beginPath();
      ctx.moveTo(dx + 3 * s, dy);
      ctx.arc(dx, dy, 3 * s, 0, Math.PI * 2);
      ctx.fill();
    }

    // The three figures and the small drum machine.
    drawDrums(drums.x, drums.y, s, t, written);
    drawSax(sax.x, sax.y, s, t, written);
    drawGuitar(guitar.x, guitar.y, s, t, written);
    drawMachine(machine.x, machine.y, s, t, written, written);

    // Freedom impulse: a sudden white flash at the impulse agent.
    if (flash > 0.01) {
      var fx = 0, fy = 0, fr = 90 * s;
      if (impAgent === 0) { fx = drums.x; fy = drums.y; }
      else if (impAgent === 1) { fx = sax.x; fy = sax.y; }
      else if (impAgent === 2) { fx = guitar.x; fy = guitar.y; }
      else { fx = machine.x; fy = machine.y; fr = 60 * s; }
      drawFlash(fx, fy, fr, flash, t);
    }

    // Title plate, drawn on the canvas, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 640, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = PLATE;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Mobile Equilibrium', 18, 34);
    ctx.fillStyle = PLATE_DIM;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1908 · 2007 · 04 · 03', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(PLATE_DIM, 0.9);
    ctx.fillText('Watch the mobile find balance.', 18, H - 20);
  }

  // Watch only: no pointer, touch, or key handlers. The wire physics
  // decide the tilt; nothing here lets a viewer push the mobile.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
