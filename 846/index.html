<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Doot-Doot Choir</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAF7F0; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var PAPER = '#FAF7F0';
  var GOLD  = '#C89B3C';
  var INK   = '#141414';
  var RAINBOW = ['#E04E39', '#E8B400', '#3E8E5A', '#3E6BB8'];

  // Original street tableaux, flat register. Three sets, one per height band.
  var TABLEAUX = [
    [
      'The man on the corner sells umbrellas in the rain.',
      'He does not look up. The rain does not look down.',
      'Everybody here is on their way somewhere else.'
    ],
    [
      'A woman walks her dog past the closed theater.',
      'The marquee still shows last month\u2019s title.',
      'The dog stops. She waits. That is the whole arrangement.'
    ],
    [
      'Two men argue quietly outside the diner.',
      'Neither one is winning. The coffee is.',
      'The streetlight changes for nobody in particular.'
    ]
  ];

  // Doot density per band: number of 3-glyph candy-stripe repeats.
  var DOOT_REPEATS = [2, 3, 5];

  // Walking bassline: 16 steps per pass, one pass = 8 seconds, never hurries.
  var STEPS = 16;
  var PASS_SECONDS = 8;
  var WALK = [0, 1, 2, 3, 2, 1, 0, 1, 2, 3, 4, 3, 2, 1, 0, -1];

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Seeded doot glyph placements per band, precomputed once. Closed-form:
  // depends only on the band index, never on time or events.
  var DOOTS = [];
  for (var b = 0; b < 3; b++) {
    var rng = mulberry32(84600 + b * 977);
    var list = [];
    var repeats = DOOT_REPEATS[b];
    for (var r = 0; r < repeats; r++) {
      for (var g = 0; g < 3; g++) {
        var fx = (r + 0.5) / repeats + (g - 1) * 0.088 + (rng() - 0.5) * 0.008;
        var fy = 0.375 + (rng() - 0.5) * 0.012 + (g % 2) * 0.014;
        list.push({ fx: fx, fy: fy, s: 0.85 + rng() * 0.3 });
      }
    }
    DOOTS.push(list);
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, MIN = 0, PHONE = false;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    MIN = Math.min(W, H);
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  }

  // Band state: recorded drag events only. Each event: {band, t}.
  // Frame one has no events: band 0 (top band), fully faded in.
  var bandEvents = [];
  var dragging = false;

  function bandAt(t) {
    var cur = 0, prev = 0, tChange = -10;
    for (var i = 0; i < bandEvents.length; i++) {
      if (bandEvents[i].t <= t) { prev = cur; cur = bandEvents[i].band; tChange = bandEvents[i].t; }
    }
    return { cur: cur, prev: prev, tChange: tChange };
  }

  function bandForY(y) {
    var f = y / H;
    if (f < 1 / 3) return 0;
    if (f < 2 / 3) return 1;
    return 2;
  }

  function noteHead(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.35);
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.013 * MIN * s, 0.0095 * MIN * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // stem
    ctx.fillRect(x + 0.0115 * MIN * s, y - 0.036 * MIN * s, Math.max(1.2, 0.0022 * MIN), 0.036 * MIN * s);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // Overexposed white field
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // Gold banner across mid-frame
    var banY0 = 0.335 * H, banY1 = 0.585 * H;
    ctx.fillStyle = GOLD;
    ctx.fillRect(0, banY0, W, banY1 - banY0);

    var st = bandAt(t);

    // Doot choir: candy-stripe repeats along the banner, density per band.
    ctx.fillStyle = INK;
    var doots = DOOTS[st.cur];
    var dootFont = Math.max(9, 0.021 * MIN);
    ctx.font = '600 ' + dootFont + 'px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < doots.length; i++) {
      var d = doots[i];
      var dx = d.fx * W, dy = d.fy * H;
      noteHead(dx, dy + 0.006 * MIN, d.s);
      ctx.fillText('doot', dx + 0.02 * MIN * d.s, dy - 0.004 * MIN);
    }

    // Walking bassline: stepped contour, closed-form in loop t.
    var phase = (t / PASS_SECONDS) * STEPS; // steps elapsed
    var cy = 0.485 * H;
    var stepH = 0.021 * H;
    var stepW = W / STEPS;
    ctx.strokeStyle = INK;
    ctx.fillStyle = INK;
    ctx.lineWidth = Math.max(3, 0.011 * MIN);
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'butt';
    ctx.beginPath();
    for (var sx = 0; sx <= STEPS; sx++) {
      var idx = ((sx + Math.floor(phase)) % STEPS + STEPS) % STEPS;
      var y = cy - WALK[idx] * stepH;
      var x = sx * stepW;
      if (sx === 0) ctx.moveTo(x, y); else {
        var pIdx = (((sx - 1) + Math.floor(phase)) % STEPS + STEPS) % STEPS;
        var py = cy - WALK[pIdx] * stepH;
        ctx.lineTo(x, py);
        ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
    // note dots at plateau centers
    var dotR = Math.max(2.2, 0.006 * MIN);
    for (var k = 0; k < STEPS; k++) {
      var kIdx = ((k + Math.floor(phase)) % STEPS + STEPS) % STEPS;
      var ky = cy - WALK[kIdx] * stepH;
      ctx.beginPath();
      ctx.arc((k + 0.5) * stepW, ky, dotR, 0, Math.PI * 2);
      ctx.fill();
    }

    // Street tableau beneath the banner. Band changes crossfade text only,
    // quick and plain (0.4 s), driven by the recorded event list.
    var fade = Math.min(1, Math.max(0, (t - st.tChange) / 0.4));
    var fontSize = PHONE ? Math.max(13, 0.036 * MIN) : Math.max(14, 0.027 * MIN);
    ctx.font = fontSize + 'px system-ui, sans-serif';
    ctx.textBaseline = 'alphabetic';
    var tx = 0.08 * W;
    var ty = 0.675 * H;
    var lh = fontSize * 1.55;
    function drawSet(set, alpha) {
      if (alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = INK;
      for (var li = 0; li < set.length; li++) {
        ctx.fillText(set[li], tx, ty + li * lh);
      }
      ctx.restore();
    }
    if (fade < 1 && st.prev !== st.cur) drawSet(TABLEAUX[st.prev], 1 - fade);
    drawSet(TABLEAUX[st.cur], fade < 1 && st.prev !== st.cur ? fade : 1);

    // Rainbow strip along the bottom edge, like a seal.
    var stripH = 0.028 * H;
    var bandH = stripH / RAINBOW.length;
    for (var rb = 0; rb < RAINBOW.length; rb++) {
      ctx.fillStyle = RAINBOW[rb];
      ctx.fillRect(0, H - stripH + rb * bandH, W, bandH + 1);
    }
  }

  var startStamp = null;
  function nowSeconds() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return 0;
  }
  function frame() {
    draw(nowSeconds() - startStamp);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  function pointerY(e) {
    if (e && typeof e.clientY === 'number') return e.clientY;
    if (e && e.touches && e.touches.length) return e.touches[0].clientY;
    if (e && e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientY;
    return 0;
  }
  function onDrag(e) {
    var b = bandForY(pointerY(e));
    var t = startStamp === null ? 0 : nowSeconds() - startStamp;
    var cur = bandAt(t).cur;
    if (b !== cur) bandEvents.push({ band: b, t: t });
  }
  canvas.addEventListener('pointerdown', function (e) { dragging = true; onDrag(e); });
  canvas.addEventListener('pointermove', function (e) { if (dragging) onDrag(e); });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(startStamp === null ? 0 : nowSeconds() - startStamp); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(startStamp === null ? 0 : nowSeconds() - startStamp); });
  }

  resize();
  draw(0); // deterministic frame one: t = 0, band 1 (top band), bassline at walk start
  if (typeof requestAnimationFrame === 'function') {
    startStamp = nowSeconds();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
