<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№846 The Red Poncho</title>
<style>
  html, body { margin: 0; padding: 0; background: #204e2c; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №846 The Red Poncho, SN8 / PP1246, study #260 syd-nuku.
  // A lush green hillside garden fills the frame. A pale path
  // runs down through it and forks once mid-frame. A small
  // figure in a bright red poncho walks down the path, pauses
  // at the fork, and continues down the branch the visitor
  // taps. The garden ahead re-seeds along the chosen branch.
  // Painterly and fairytale-plain: garden green in several
  // depths, poncho red, path pale. No dark-fantasy mood, no
  // walk looping forever without the choice.
  var GROUND = '#204e2c'; // page ground, deep garden green

  // Fixed-phase first frame: FIRST_T = 8 s. The walk cycle is
  // 40 s: 0 to 14 s the figure walks the upper path to the
  // fork, 14 to 20 s it pauses at the fork (the tap window),
  // 20 to 34 s it walks the chosen branch to the bottom, 34
  // to 38 s it stands, 38 to 40 s it fades out, and the walk
  // restarts from the top, fading in over the first 2 s. At
  // t = 8 the figure is a third of the way down the upper
  // path, small against the green, the fork ahead of it.
  var FIRST_T = 8;
  var CYCLE = 40;
  var SEED = 846;
  var T_FORK = 14;
  var T_PAUSE_END = 20;
  var T_BOTTOM = 34;
  var T_FADE = 38;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x) {
    var i = Math.floor(x), f = x - i;
    var u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }
  function fbm(x) {
    return vnoise(x) * 0.55 + vnoise(x * 2.13 + 7.7) * 0.30 + vnoise(x * 4.31 + 3.1) * 0.15;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: garden green in several depths, poncho red,
  // path pale, cream for the hint.
  var GREEN_DEEP = [32, 78, 44];
  var GREEN_BAND_C = [61, 111, 56];
  var GREEN_SOFT = [89, 138, 72];
  var GREEN_LIGHT = [127, 174, 95];
  var GREEN_PALE = [147, 185, 111];
  var PATH_PALE = [236, 229, 203];
  var PATH_EDGE = [203, 191, 154];
  var STONE = [221, 210, 174];
  var PONCHO = [217, 43, 31];
  var PONCHO_DARK = [168, 30, 20];
  var PONCHO_TRIM = [240, 96, 74];
  var FACE = [238, 195, 154];
  var LEG = [58, 42, 30];
  var TRUNK = [90, 61, 36];
  var CREAM = [244, 239, 220];
  var CAPTION = [30, 70, 40];
  var BUSH = [[44, 99, 52], [58, 122, 62], [76, 138, 68], [39, 96, 47]];
  var FLOWER = [[242, 227, 148], [247, 243, 226], [232, 167, 184]];

  // ---- Path graph ----------------------------------------------
  // One fork: the upper path runs from the top to the fork,
  // then a left branch and a right branch run to the bottom.
  // Cubic Bezier segments in normalized coordinates.
  var TOP = { x: 0.52, y: -0.03 };
  var UC1 = { x: 0.46, y: 0.16 };
  var UC2 = { x: 0.56, y: 0.34 };
  var FORK = { x: 0.50, y: 0.52 };
  var LC1 = { x: 0.44, y: 0.66 };
  var LC2 = { x: 0.30, y: 0.82 };
  var LEND = { x: 0.24, y: 1.03 };
  var RC1 = { x: 0.56, y: 0.66 };
  var RC2 = { x: 0.70, y: 0.82 };
  var REND = { x: 0.76, y: 1.03 };

  function cubic(p0, p1, p2, p3, s) {
    var u = 1 - s;
    return {
      x: u * u * u * p0.x + 3 * u * u * s * p1.x + 3 * u * s * s * p2.x + s * s * s * p3.x,
      y: u * u * u * p0.y + 3 * u * u * s * p1.y + 3 * u * s * s * p2.y + s * s * s * p3.y
    };
  }
  function upperPoint(s) { return cubic(TOP, UC1, UC2, FORK, s); }
  function branchPoint(b, s) {
    return b === 'left' ? cubic(FORK, LC1, LC2, LEND, s) : cubic(FORK, RC1, RC2, REND, s);
  }
  // Sampled point on a segment with its outward normal and
  // half width in pixels. Width grows with depth, so the path
  // reads as near at the bottom, far at the top.
  function samplePath(seg, s) {
    var p = seg === 'upper' ? upperPoint(s) : branchPoint(seg, s);
    var e = 0.01;
    var s0 = Math.max(0, s - e), s1 = Math.min(1, s + e);
    var p0 = seg === 'upper' ? upperPoint(s0) : branchPoint(seg, s0);
    var p1 = seg === 'upper' ? upperPoint(s1) : branchPoint(seg, s1);
    var dx = (p1.x - p0.x) * W, dy = (p1.y - p0.y) * H;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var hw = W * (seg === 'upper' ? (0.013 + 0.013 * s) : (0.026 + 0.026 * s));
    return { x: p.x * W, y: p.y * H, nx: -dy / len, ny: dx / len, hw: hw };
  }

  // ---- Walk state ----------------------------------------------
  // The chosen branch lives in state. At each cycle boundary
  // it resets to the deterministic default for that cycle:
  // even cycles go left, odd cycles go right. A tap during
  // the pause overrides it for the rest of that cycle. The
  // lower garden is seeded from the branch, so the garden
  // ahead regenerates deterministically on the new branch.
  var state = { cycle: -1, branch: 'left', tapped: false };
  function defaultBranch(ci) { return (ci % 2 === 0) ? 'left' : 'right'; }
  function syncState(t) {
    var ci = Math.floor(t / CYCLE);
    if (ci !== state.cycle) {
      state.cycle = ci;
      state.branch = defaultBranch(ci);
      state.tapped = false;
    }
  }
  function figureState(t) {
    syncState(t);
    var tc = ((t % CYCLE) + CYCLE) % CYCLE;
    var st = { tc: tc, cycle: state.cycle, branch: state.branch };
    if (tc < T_FORK) {
      var s = tc / T_FORK;
      var p = upperPoint(s);
      st.x = p.x; st.y = p.y;
      st.walking = true; st.phase = s * 34;
      st.alpha = smooth(tc / 2); st.atFork = false;
    } else if (tc < T_PAUSE_END) {
      st.x = FORK.x; st.y = FORK.y;
      st.walking = false; st.phase = 34;
      st.alpha = 1; st.atFork = true;
    } else if (tc < T_BOTTOM) {
      var s2 = (tc - T_PAUSE_END) / (T_BOTTOM - T_PAUSE_END);
      var p2 = branchPoint(state.branch, s2);
      st.x = p2.x; st.y = p2.y;
      st.walking = true; st.phase = 34 + s2 * 34;
      st.alpha = 1; st.atFork = false;
    } else {
      var p3 = branchPoint(state.branch, 1);
      st.x = p3.x; st.y = p3.y;
      st.walking = false; st.phase = 68;
      st.alpha = tc < T_FADE ? 1 : 1 - smooth((tc - T_FADE) / (CYCLE - T_FADE));
      st.atFork = false;
    }
    return st;
  }
  // Tap during the pause window chooses the branch by the
  // tapped side of the fork. Taps outside the window are
  // ignored. Returns what happened, for the QA probe.
  function handleTap(nx, ny, t) {
    var tc = ((t % CYCLE) + CYCLE) % CYCLE;
    if (tc >= T_FORK && tc < T_PAUSE_END) {
      syncState(t);
      state.branch = (nx < FORK.x) ? 'left' : 'right';
      state.tapped = true;
      return { accepted: true, branch: state.branch };
    }
    return { accepted: false, branch: state.branch };
  }

  // ---- Layout ----------------------------------------------------
  var L = {};
  var PATH_SAMPLES = [];
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.fh = H * (isPhone ? 0.072 : 0.078);
    PATH_SAMPLES.length = 0;
    var i, s, q;
    var segs = ['upper', 'left', 'right'];
    for (var k = 0; k < segs.length; k++) {
      for (i = 0; i <= 40; i++) {
        s = i / 40;
        q = samplePath(segs[k], s);
        PATH_SAMPLES.push({ x: q.x, y: q.y, hw: q.hw });
      }
    }
  }
  function nearPath(x, y, margin) {
    for (var i = 0; i < PATH_SAMPLES.length; i++) {
      var s = PATH_SAMPLES[i];
      var dx = x - s.x, dy = y - s.y;
      var r = s.hw + margin;
      if (dx * dx + dy * dy < r * r) { return true; }
    }
    return false;
  }
  function distToFork(x, y) {
    var dx = x - FORK.x * W, dy = y - FORK.y * H;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Hills -----------------------------------------------------
  function bandTopY(x, band) {
    return H * (band.y + 0.052 * (fbm(x * 0.0045 + band.off) - 0.5) * 2);
  }
  function drawHills() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(GREEN_PALE));
    g.addColorStop(0.45, rgb(GREEN_SOFT));
    g.addColorStop(1, rgb(GREEN_DEEP));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // Three rolling bands, light at the top, deep at the
    // bottom, so the hillside reads as depth.
    var bands = [
      { y: 0.14, c: GREEN_LIGHT, off: 2.3 },
      { y: 0.34, c: GREEN_SOFT, off: 7.9 },
      { y: 0.56, c: GREEN_BAND_C, off: 13.7 }
    ];
    for (var b = 0; b < bands.length; b++) {
      var band = bands[b];
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, bandTopY(0, band));
      var step = Math.max(6, W / 48), x;
      for (x = step; x <= W; x += step) {
        ctx.lineTo(x, bandTopY(x, band));
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fillStyle = rgb(band.c);
      ctx.fill();
    }
  }
  function drawDapples() {
    var rng = mulberry32(SEED * 13 + 5);
    for (var i = 0; i < 8; i++) {
      var dx = rng() * W, dy = rng() * H * 0.8, dr = W * (0.10 + rng() * 0.14);
      var g = ctx.createRadialGradient(dx, dy, 0, dx, dy, dr);
      g.addColorStop(0, rgba([242, 230, 170], a4(0.07)));
      g.addColorStop(1, rgba([242, 230, 170], 0));
      ctx.fillStyle = g;
      ctx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);
    }
  }

  // ---- Path ------------------------------------------------------
  function ribbon(seg) {
    var N = 40, i, s, q;
    ctx.beginPath();
    for (i = 0; i <= N; i++) {
      s = i / N; q = samplePath(seg, s);
      if (i === 0) { ctx.moveTo(q.x + q.nx * q.hw, q.y + q.ny * q.hw); }
      else { ctx.lineTo(q.x + q.nx * q.hw, q.y + q.ny * q.hw); }
    }
    for (i = N; i >= 0; i--) {
      s = i / N; q = samplePath(seg, s);
      ctx.lineTo(q.x - q.nx * q.hw, q.y - q.ny * q.hw);
    }
    ctx.closePath();
  }
  function drawPath() {
    ctx.fillStyle = rgb(PATH_PALE);
    ribbon('upper'); ctx.fill();
    ribbon('left'); ctx.fill();
    ribbon('right'); ctx.fill();
    ctx.strokeStyle = rgba(PATH_EDGE, a4(0.55));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ribbon('upper'); ctx.stroke();
    ribbon('left'); ctx.stroke();
    ribbon('right'); ctx.stroke();
    // Stepping stones down each segment.
    var segs = ['upper', 'left', 'right'];
    for (var k = 0; k < segs.length; k++) {
      for (var j = 1; j <= 7; j++) {
        var q = samplePath(segs[k], j / 8);
        ctx.fillStyle = rgba(STONE, a4(0.55));
        ctx.beginPath();
        ctx.moveTo(q.x + q.hw * 0.34, q.y);
        ctx.arc(q.x, q.y, q.hw * 0.34, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---- Trees -----------------------------------------------------
  var TREES = [
    { x: 0.11, y: 0.16, s: 1.0 },
    { x: 0.89, y: 0.24, s: 0.85 },
    { x: 0.07, y: 0.72, s: 1.15 }
  ];
  function drawTrees() {
    for (var i = 0; i < TREES.length; i++) {
      var tr = TREES[i];
      var tx = tr.x * W, ty = tr.y * H, ts = tr.s;
      var trunkH = H * 0.055 * ts, trunkW = Math.max(2, W * 0.008 * ts);
      ctx.fillStyle = rgb(TRUNK);
      ctx.fillRect(tx - trunkW / 2, ty, trunkW, trunkH);
      var rng = mulberry32(SEED * 31 + i * 17);
      for (var c = 0; c < 7; c++) {
        var ang = rng() * Math.PI * 2;
        var dist = rng() * W * 0.030 * ts;
        var cx = tx + Math.cos(ang) * dist;
        var cy = ty - H * 0.020 * ts + Math.sin(ang) * dist * 0.7;
        var cr = W * (0.018 + rng() * 0.022) * ts;
        ctx.fillStyle = rgba(BUSH[c % BUSH.length], a4(0.92));
        ctx.beginPath();
        ctx.moveTo(cx + cr, cy);
        ctx.arc(cx, cy, cr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---- Garden ----------------------------------------------------
  // Bushes, flowers and grass tufts, placed by seeded RNG and
  // kept off the path. The upper garden uses the base seed;
  // the lower garden is seeded from the chosen branch, so a
  // tap at the fork regenerates the garden ahead.
  function gardenPass(rng, y0, y1, nBush, nFlower, nTuft) {
    var i, x, y, r, k;
    for (i = 0; i < nBush; i++) {
      x = (0.03 + rng() * 0.94) * W;
      y = (y0 + rng() * (y1 - y0)) * H;
      if (nearPath(x, y, W * 0.05)) { continue; }
      if (distToFork(x, y) < W * 0.07) { continue; }
      var nb = 4 + Math.floor(rng() * 3);
      for (k = 0; k < nb; k++) {
        var bx = x + (rng() - 0.5) * W * 0.05;
        var by = y + (rng() - 0.5) * H * 0.03;
        var br = W * (0.009 + rng() * 0.013);
        ctx.fillStyle = rgba(BUSH[Math.floor(rng() * BUSH.length)], a4(0.90));
        ctx.beginPath();
        ctx.moveTo(bx + br, by);
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (i = 0; i < nFlower; i++) {
      x = rng() * W;
      y = (y0 + rng() * (y1 - y0)) * H;
      if (nearPath(x, y, W * 0.016)) { continue; }
      r = W * (0.0016 + rng() * 0.0028);
      ctx.fillStyle = rgba(FLOWER[Math.floor(rng() * FLOWER.length)], a4(0.85));
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    for (i = 0; i < nTuft; i++) {
      x = rng() * W;
      y = (y0 + rng() * (y1 - y0)) * H;
      if (nearPath(x, y, W * 0.010)) { continue; }
      var len = H * (0.008 + rng() * 0.012);
      ctx.strokeStyle = rgba(rng() > 0.5 ? [111, 160, 85] : [44, 99, 52], a4(0.55 + rng() * 0.25));
      ctx.lineWidth = Math.max(1, W * 0.0012);
      for (k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + k * W * 0.004, y - len * (0.8 + 0.2 * Math.abs(k)));
        ctx.stroke();
      }
    }
  }
  function drawGarden() {
    var rngUp = mulberry32(SEED * 3 + 1);
    gardenPass(rngUp, 0.03, 0.50, 26, 70, 110);
    var branchSeed = SEED + (state.branch === 'left' ? 101 : 202);
    var rngLow = mulberry32(branchSeed * 5 + 11);
    gardenPass(rngLow, 0.56, 0.98, 26, 70, 110);
  }

  // ---- Fork pulse ------------------------------------------------
  // During the pause a soft ring breathes around the fork and
  // two pale dots mark the heads of the two branches, inviting
  // the tap. Slow by construction, about a 2 s period.
  function drawForkPulse(t, tc) {
    var fx = FORK.x * W, fy = FORK.y * H;
    var pulse = 0.5 + 0.5 * Math.sin((tc - T_FORK) * Math.PI);
    var pr = W * (0.020 + 0.010 * pulse);
    ctx.strokeStyle = rgba(CREAM, a4(0.30 + 0.30 * pulse));
    ctx.lineWidth = Math.max(1.5, W * 0.003);
    ctx.beginPath();
    ctx.moveTo(fx + pr, fy);
    ctx.arc(fx, fy, pr, 0, Math.PI * 2);
    ctx.stroke();
    var lp = branchPoint('left', 0.12), rp = branchPoint('right', 0.12);
    var dr = W * 0.008;
    ctx.fillStyle = rgba(CREAM, a4(0.55 + 0.35 * pulse));
    ctx.beginPath();
    ctx.moveTo(lp.x * W + dr, lp.y * H);
    ctx.arc(lp.x * W, lp.y * H, dr, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(rp.x * W + dr, rp.y * H);
    ctx.arc(rp.x * W, rp.y * H, dr, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- Figure ----------------------------------------------------
  // A small walking figure in a bright red poncho: hood and
  // pale face, bell poncho with fold lines and a lighter hem
  // trim, two dark legs swinging with the walk phase. The
  // figure bobs gently as it walks and sways idly at the fork.
  function drawFigure(fs, t) {
    var fh = L.fh;
    var px = fs.x * W, py = fs.y * H;
    var bob = fs.walking ? Math.abs(Math.sin(fs.phase)) * fh * 0.03 : Math.sin(t * 0.8) * fh * 0.012;
    py -= bob;
    ctx.save();
    ctx.globalAlpha = a4(clamp(fs.alpha, 0, 1));
    // Soft contact shadow.
    ctx.fillStyle = rgba([20, 40, 24], a4(0.25));
    ctx.beginPath();
    ctx.save();
    ctx.translate(px, fs.y * H + fh * 0.02);
    ctx.scale(1, 0.28);
    ctx.moveTo(fh * 0.30, 0);
    ctx.arc(0, 0, fh * 0.30, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // Legs, swinging with the walk phase.
    var hipY = py - fh * 0.30;
    var swing = fs.walking ? Math.sin(fs.phase) * fh * 0.09 : 0;
    ctx.strokeStyle = rgb(LEG);
    ctx.lineWidth = Math.max(1.5, fh * 0.05);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px, hipY);
    ctx.lineTo(px - swing, py - fh * 0.02);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px, hipY);
    ctx.lineTo(px + swing, py - fh * 0.02);
    ctx.stroke();
    // Poncho bell, swaying slightly with the walk.
    var shoulderY = py - fh * 0.72;
    var hemY = py - fh * 0.28;
    var sh = fh * 0.10, hem = fh * 0.17;
    var sway = fs.walking ? Math.sin(fs.phase) * fh * 0.02 : Math.sin(t * 0.8) * fh * 0.012;
    ctx.fillStyle = rgb(PONCHO);
    ctx.beginPath();
    ctx.moveTo(px - sh, shoulderY);
    ctx.quadraticCurveTo(px - hem - sway * 0.5, (shoulderY + hemY) / 2, px - hem + sway, hemY);
    ctx.lineTo(px + hem + sway, hemY);
    ctx.quadraticCurveTo(px + hem + sway * 0.5, (shoulderY + hemY) / 2, px + sh, shoulderY);
    ctx.quadraticCurveTo(px, shoulderY - fh * 0.06, px - sh, shoulderY);
    ctx.closePath();
    ctx.fill();
    // Fold lines.
    ctx.strokeStyle = rgba(PONCHO_DARK, a4(0.55));
    ctx.lineWidth = Math.max(1, fh * 0.02);
    ctx.beginPath();
    ctx.moveTo(px - fh * 0.04, shoulderY + fh * 0.08);
    ctx.lineTo(px - fh * 0.08, hemY - fh * 0.02);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px + fh * 0.04, shoulderY + fh * 0.08);
    ctx.lineTo(px + fh * 0.08, hemY - fh * 0.02);
    ctx.stroke();
    // Hem trim.
    ctx.strokeStyle = rgba(PONCHO_TRIM, a4(0.85));
    ctx.lineWidth = Math.max(1, fh * 0.025);
    ctx.beginPath();
    ctx.moveTo(px - hem + sway, hemY);
    ctx.lineTo(px + hem + sway, hemY);
    ctx.stroke();
    // Hood and pale face.
    var hy = py - fh * 0.80;
    ctx.fillStyle = rgb(PONCHO);
    ctx.beginPath();
    ctx.moveTo(px + fh * 0.115, hy);
    ctx.arc(px, hy, fh * 0.115, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(FACE);
    ctx.beginPath();
    ctx.moveTo(px + fh * 0.068, hy + fh * 0.01);
    ctx.arc(px, hy + fh * 0.01, fh * 0.068, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ---- Draw ------------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var fs = figureState(t);

    ctx.fillStyle = rgb(GREEN_DEEP);
    ctx.fillRect(0, 0, W, H);

    drawHills();
    drawDapples();
    drawPath();
    drawTrees();
    drawGarden();
    if (fs.atFork) { drawForkPulse(t, fs.tc); }
    drawFigure(fs, t);

    // Caption, top left, and the hint, bottom center. Dark
    // green caption reads on the pale hilltop; cream hint
    // reads on the deep green at the bottom.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.85));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№846 · The Red Poncho · 2004 · 05 · 06', W * 0.04, H * 0.055);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CREAM, a4(0.95));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(fs.atFork ? 'Tap left or right to choose the path.' : 'Tap at the fork to choose a path.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // ---- Interaction -----------------------------------------------
  // TAP at the fork chooses left or right; the figure
  // continues down the chosen path and the garden ahead
  // re-seeds on the new branch. Taps outside the pause
  // window are ignored. Never click-to-reload.
  function pointerPos(ev) {
    var r = null;
    try {
      if (typeof canvas.getBoundingClientRect === 'function') {
        r = canvas.getBoundingClientRect();
      }
    } catch (e) { r = null; }
    if (r && r.width) {
      return { x: (ev.clientX - r.left) / r.width, y: (ev.clientY - r.top) / r.height };
    }
    if (typeof ev.offsetX === 'number') {
      return { x: ev.offsetX / stageW, y: ev.offsetY / stageH };
    }
    return { x: 0.5, y: 0.35 };
  }
  function onDown(ev) {
    var p = pointerPos(ev);
    handleTap(p.x, p.y, lastT);
    try {
      if (ev.preventDefault) { ev.preventDefault(); }
    } catch (e) {}
  }
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('pointerdown', onDown);
    }
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece846 exposes the figure state and the tap so
  // a probe can tap during the pause, redraw, and confirm the
  // figure takes the chosen branch.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece846 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      figure: figureState,
      branch: function () { return state.branch; },
      tap: function (nx, ny, t) { return handleTap(nx, ny, t); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the figure walks the path, pauses at the
  // fork, and walks the chosen branch down. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
