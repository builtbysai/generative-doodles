<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Precipice</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0C0C0E; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  fitView();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// --- golden rhomb patch: 5-generator zonogon (Penrose fat + thin rhombs),
// --- halved three times so every tile is one flat height.
var V = [];
for (var k = 0; k < 5; k++) V.push([Math.cos(k * Math.PI / 5), Math.sin(k * Math.PI / 5)]);
function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
function baseRhombs() {
  var out = [];
  for (var i = 0; i < 5; i++) for (var j = i + 1; j < 5; j++) {
    var o = [0, 0];
    for (var m = i + 1; m < j; m++) o = add(o, V[m]);
    out.push([o, add(o, V[i]), add(add(o, V[i]), V[j]), add(o, V[j])]);
  }
  return out;
}
function subdivide(list) {
  var out = [];
  for (var n = 0; n < list.length; n++) {
    var r = list[n], c0 = r[0], c1 = r[1], c2 = r[2], c3 = r[3];
    function mid(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
    var m01 = mid(c0, c1), m12 = mid(c1, c2), m23 = mid(c2, c3), m03 = mid(c0, c3), cc = mid(c0, c2);
    out.push([c0, m01, cc, m03], [m01, c1, m12, cc], [cc, m12, c2, m23], [m03, cc, m23, c3]);
  }
  return out;
}
var TILES = subdivide(subdivide(subdivide(baseRhombs()))); // 640 rhombs
var CENT = [], BOUNDS = { x: 1e9, y: 1e9, w: 0, h: 0 };
(function () {
  var mxx = -1e9, mxy = -1e9;
  for (var i = 0; i < TILES.length; i++) {
    var cx = 0, cy = 0;
    for (var j = 0; j < 4; j++) {
      cx += TILES[i][j][0] / 4; cy += TILES[i][j][1] / 4;
      BOUNDS.x = Math.min(BOUNDS.x, TILES[i][j][0]); mxx = Math.max(mxx, TILES[i][j][0]);
      BOUNDS.y = Math.min(BOUNDS.y, TILES[i][j][1]); mxy = Math.max(mxy, TILES[i][j][1]);
    }
    CENT.push([cx, cy]);
  }
  BOUNDS.w = mxx - BOUNDS.x; BOUNDS.h = mxy - BOUNDS.y;
})();
// edge map: key -> [tileA, tileB, p1, p2] for cliff lookup
var EDGES = (function () {
  var map = {};
  function key(a, b) {
    var ka = Math.round(a[0] * 4096) + ',' + Math.round(a[1] * 4096);
    var kb = Math.round(b[0] * 4096) + ',' + Math.round(b[1] * 4096);
    return ka < kb ? ka + '|' + kb : kb + '|' + ka;
  }
  for (var i = 0; i < TILES.length; i++) {
    for (var e = 0; e < 4; e++) {
      var p1 = TILES[i][e], p2 = TILES[i][(e + 1) % 4], k = key(p1, p2);
      if (!map[k]) map[k] = { tiles: [], p1: p1, p2: p2 };
      map[k].tiles.push(i);
    }
  }
  var out = [];
  for (var k in map) if (map[k].tiles.length === 2) out.push(map[k]);
  return out;
})();

var view = { s: 1, ox: 0, oy: 0 };
function fitView() {
  // the patch is a decagon: scale by its apothem so the field truly fills
  // the frame, corners included, and the rim tiles bleed off-frame
  var ccx = BOUNDS.x + BOUNDS.w / 2, ccy = BOUNDS.y + BOUNDS.h / 2, rmax = 0;
  for (var i = 0; i < TILES.length; i++) for (var j = 0; j < 4; j++) {
    var dx = TILES[i][j][0] - ccx, dy = TILES[i][j][1] - ccy;
    rmax = Math.max(rmax, Math.sqrt(dx * dx + dy * dy));
  }
  var apothem = rmax * Math.cos(Math.PI / 10);
  var s = (0.5 * Math.sqrt(W * W + H * H)) / apothem * 1.03;
  view.s = s;
  view.ox = W / 2 - ccx * s;
  view.oy = H / 2 - ccy * s;
}
function px(p) { return [view.ox + p[0] * view.s, view.oy + p[1] * view.s]; }

// top face shade: 5 discrete steps between the two given top colors
function shade(h) {
  var a = [0xD9, 0xD2, 0xC0], b = [0xF2, 0xEE, 0xE2], f = h / 4;
  var r = Math.round(a[0] + (b[0] - a[0]) * f), g = Math.round(a[1] + (b[1] - a[1]) * f), bl = Math.round(a[2] + (b[2] - a[2]) * f);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
function heightAt(cx, cy, ph) {
  var n = 0.50
    + 0.29 * Math.sin(cx * 3.10 + ph * 1.25) * Math.cos(cy * 2.60 - ph * 0.90)
    + 0.23 * Math.sin((cx + cy) * 2.00 - ph * 0.75)
    + 0.15 * Math.sin(cx * 5.20 - cy * 3.90 + ph * 0.55)
    + 0.23 * Math.tanh((cx * 1.24 + cy * 0.88 - 0.35 - 0.30 * Math.sin(ph * 0.45)) * 4.2);
  n = 0.5 + (n - 0.5) * 1.45; // stretch so all five levels populate and cliffs form
  var h = Math.floor(n * 5);
  return h < 0 ? 0 : (h > 4 ? 4 : h);
}

var T0 = 9.0; // loop-clock offset: frame one is mid-wave, cliffs formed
var start = Date.now();
function draw() {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#0C0C0E'; ctx.fillRect(0, 0, W, H);
  var t = (T0 + (Date.now() - start) / 1000) % 28;
  var ph = (t < 18 ? t : 18) * (Math.PI * 2 / 18) * 0.9;
  var heights = new Array(TILES.length);
  var i, j;
  for (i = 0; i < TILES.length; i++) heights[i] = heightAt(CENT[i][0], CENT[i][1], ph);
  for (i = 0; i < TILES.length; i++) {
    ctx.fillStyle = shade(heights[i]);
    ctx.beginPath();
    for (j = 0; j < 4; j++) {
      var q = px(TILES[i][j]);
      if (j === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
    }
    ctx.closePath(); ctx.fill();
  }
  // cliffs: dark faces where a neighbour sits more than one level lower
  ctx.fillStyle = '#2E2A24';
  var edgeLen = view.s * 0.125;
  for (i = 0; i < EDGES.length; i++) {
    var ed = EDGES[i], ha = heights[ed.tiles[0]], hb = heights[ed.tiles[1]];
    if (Math.abs(ha - hb) < 2) continue;
    var hi = ha > hb ? ed.tiles[0] : ed.tiles[1], lo = ha > hb ? ed.tiles[1] : ed.tiles[0];
    var diff = Math.abs(ha - hb);
    var a = px(ed.p1), b = px(ed.p2);
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    var lc = px(CENT[lo]);
    var dx = lc[0] - mx, dy = lc[1] - my, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var wdt = diff * edgeLen * 0.26;
    dx = dx / len * wdt; dy = dy / len * wdt;
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    ctx.lineTo(b[0] + dx, b[1] + dy); ctx.lineTo(a[0] + dx, a[1] + dy);
    ctx.closePath(); ctx.fill();
  }
  if (t >= 24) { // soft fade to blank
    ctx.fillStyle = 'rgba(12,12,14,' + ((t - 24) / 4).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
resize();
draw();
function frame() {
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
