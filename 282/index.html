<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.282 Basin Rings</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B0D; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.282 Basin Rings (Njalikwa Chongwe).
// A basin seen from directly above: concentric glaze rings,
// an ochre rim, a broad celadon ring and a dark-red centre
// pool, under a fine crackle that covers everything. The
// rings turn with glacial slowness, each at its own pace,
// while the crackle holds still. On a 48 second loop each
// ring set holds for 6 seconds and then crossfades slowly
// into the next curated set. Watch-only, no reload.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0B0B0D', OCHRE = '#C98F2D', CELADON = '#9DBEA6', RED = '#7A2A22', CRACKLE = '#2A2018';
var DW = 1280, DH = 900;
var CX = 640, CY = 450, ROUT = 405; // rings fill 90 percent of the 900 frame height
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0; // stored centred-fit transform
var T = 3, lastNow = -1, acc = 0; // frame one opens mid-hold of the first set
var TICK = 1 / 60;
var LOOP = 48, SEG = 16, HOLD = 6;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- ring sets ---------------------------------------------------------------
// Three curated seeds. Every set keeps the same grammar: an
// ochre rim, a broad celadon ring, alternating middle bands
// in the three glaze colours only, and a dark-red centre
// pool whose centre sits a little off the ring centre, so
// the basin is never perfectly symmetric. Band thicknesses
// jitter per seed, so a crossfade visibly re-forms the rings.
var BAND_COLS = [OCHRE, CELADON, OCHRE, CELADON, RED, OCHRE, CELADON];
var BAND_BASE = [40, 74, 30, 52, 18, 44, 34];
var BAND_SPEED = [0.006, -0.009, 0.012, -0.007, 0.015, -0.011, 0.008];
var MARK_COLS = [OCHRE, CELADON, RED, GROUND];
function makeSet(seed) {
  var r = rng(seed);
  var bands = [];
  var rOut = ROUT;
  for (var i = 0; i < BAND_COLS.length; i++) {
    var thick = BAND_BASE[i] + (r() * 12 - 6);
    var rIn = rOut - thick;
    var marks = [];
    var nMarks = 5 + Math.floor(r() * 4);
    for (var m = 0; m < nMarks; m++) {
      marks.push({
        a0: r() * Math.PI * 2,
        len: 0.2 + r() * 0.75,
        rOff: (r() - 0.5) * Math.max(4, thick - 14),
        w: 1.5 + r() * 2.6,
        col: MARK_COLS[Math.floor(r() * MARK_COLS.length)],
        alpha: 0.10 + r() * 0.14
      });
    }
    bands.push({
      rOut: rOut, rIn: rIn, col: BAND_COLS[i],
      speed: BAND_SPEED[i] + (r() * 0.004 - 0.002),
      phase: r() * Math.PI * 2,
      wobA: 1 + r() * 1.8,
      wobK: 2 + Math.floor(r() * 2),
      marks: marks
    });
    rOut = rIn;
  }
  var poolMarks = [];
  for (var p = 0; p < 4; p++) {
    poolMarks.push({
      a0: r() * Math.PI * 2,
      len: 0.2 + r() * 0.4,
      rOff: 18 + r() * Math.max(10, rOut - 34),
      w: 1.5 + r() * 2.2,
      col: r() < 0.5 ? OCHRE : CELADON,
      alpha: 0.09 + r() * 0.08
    });
  }
  return {
    bands: bands,
    poolR: rOut,
    poolDX: 11 + r() * 7,
    poolDY: -(5 + r() * 7),
    poolSpeed: 0.005 + r() * 0.002,
    poolPhase: r() * Math.PI * 2,
    poolWobA: 0.8 + r() * 1.2,
    poolMarks: poolMarks
  };
}
var SETS = [makeSet(282101), makeSet(282207), makeSet(282313)];

// ---- crackle -------------------------------------------------------------------
// A fine seeded network held purely as polyline data and
// drawn fixed every frame: it never rotates with the rings
// and never crossfades with the sets. Two scales: longer
// primary cracks and a denser web of short ones, all kept
// inside the basin disc and drawn at low alpha.
var cracks = [];
(function () {
  var r = rng(282999);
  function walker(x, y, steps, stepLen, alpha, w) {
    var pts = [[x, y]];
    var a = r() * Math.PI * 2;
    for (var i = 0; i < steps; i++) {
      a += (r() - 0.5) * 1.1;
      x += Math.cos(a) * stepLen * (0.7 + r() * 0.6);
      y += Math.sin(a) * stepLen * (0.7 + r() * 0.6);
      var dx = x - CX, dy = y - CY;
      if (dx * dx + dy * dy > 398 * 398) break;
      pts.push([x, y]);
    }
    if (pts.length > 1) cracks.push({ pts: pts, alpha: alpha, w: w });
  }
  var i, a0, rad;
  for (i = 0; i < 110; i++) {
    a0 = r() * Math.PI * 2; rad = Math.sqrt(r()) * 380;
    walker(CX + Math.cos(a0) * rad, CY + Math.sin(a0) * rad,
      5 + Math.floor(r() * 4), 10 + r() * 8, 0.19, 1.0);
  }
  for (i = 0; i < 190; i++) {
    a0 = r() * Math.PI * 2; rad = Math.sqrt(r()) * 390;
    walker(CX + Math.cos(a0) * rad, CY + Math.sin(a0) * rad,
      3 + Math.floor(r() * 4), 6 + r() * 6, 0.14, 0.8);
  }
})();

// ---- drawing ---------------------------------------------------------------------
// An annulus: outer edge sampled forward, inner edge back.
// Neighbouring bands share each boundary radius exactly, so
// no ground ever shows between bands; the turn of each ring
// is carried by the marks inside it, not by its edges.
function annulusPath(cx, cy, band, ang) {
  var steps = 120, i, a;
  ctx.beginPath();
  for (i = 0; i <= steps; i++) {
    a = (i / steps) * Math.PI * 2;
    var x = cx + Math.cos(a) * band.rOut, y = cy + Math.sin(a) * band.rOut;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  for (i = steps; i >= 0; i--) {
    a = (i / steps) * Math.PI * 2;
    ctx.lineTo(cx + Math.cos(a) * band.rIn, cy + Math.sin(a) * band.rIn);
  }
  ctx.closePath();
}
function wobbleCirclePath(cx, cy, rad0, band, ang) {
  var steps = 120;
  ctx.beginPath();
  for (var i = 0; i <= steps; i++) {
    var a = (i / steps) * Math.PI * 2;
    var x = cx + Math.cos(a) * rad0, y = cy + Math.sin(a) * rad0;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function drawMarks(cx, cy, rMid, marks, ang, alphaMul) {
  ctx.lineCap = 'round';
  for (var i = 0; i < marks.length; i++) {
    var mk = marks[i];
    ctx.strokeStyle = rgba(mk.col, mk.alpha * alphaMul);
    ctx.lineWidth = mk.w;
    ctx.beginPath();
    ctx.arc(cx, cy, rMid + mk.rOff, ang + mk.a0, ang + mk.a0 + mk.len);
    ctx.stroke();
  }
}
function drawSet(set, alphaMul) {
  var i, band, ang;
  // glaze bands, outermost first
  for (i = 0; i < set.bands.length; i++) {
    band = set.bands[i];
    ang = band.phase + band.speed * T;
    annulusPath(CX, CY, band, ang);
    ctx.fillStyle = rgba(band.col, alphaMul);
    ctx.fill();
  }
  // glaze-bleed feather at each boundary: layered translucent
  // strokes straddling the join, a couple of pixels each side,
  // in the colours of the two bands that meet there
  for (i = 0; i < set.bands.length; i++) {
    band = set.bands[i];
    ang = band.phase + band.speed * T;
    var innerCol = i + 1 < set.bands.length ? set.bands[i + 1].col : RED;
    ctx.strokeStyle = rgba(band.col, 0.26 * alphaMul);
    ctx.lineWidth = 2;
    wobbleCirclePath(CX, CY, band.rIn - 1, band, ang);
    ctx.stroke();
    ctx.strokeStyle = rgba(innerCol, 0.26 * alphaMul);
    wobbleCirclePath(CX, CY, band.rIn + 1, band, ang);
    ctx.stroke();
    ctx.strokeStyle = rgba(innerCol, 0.12 * alphaMul);
    ctx.lineWidth = 3;
    wobbleCirclePath(CX, CY, band.rIn + 2, band, ang);
    ctx.stroke();
  }
  // the turning marks inside each band
  for (i = 0; i < set.bands.length; i++) {
    band = set.bands[i];
    ang = band.phase + band.speed * T;
    drawMarks(CX, CY, (band.rOut + band.rIn) / 2, band.marks, ang, alphaMul);
  }
  // centre pool, offset a little from the ring centre: a
  // centred red disc fills the middle first so the offset
  // never leaves an uncovered crescent, then the offset pool
  // disc itself is laid over it in the same red
  var px = CX + set.poolDX, py = CY + set.poolDY;
  var poolBand = { rOut: set.poolR, rIn: 0, wobA: set.poolWobA, wobK: 3, phase: set.poolPhase };
  var pang = set.poolPhase + set.poolSpeed * T;
  ctx.fillStyle = rgba(RED, alphaMul);
  ctx.beginPath();
  ctx.arc(CX, CY, set.poolR + 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(px, py, set.poolR, 0, Math.PI * 2);
  ctx.fill();
  // feather at the pool edge, centred on the ring centre and
  // drawn over the pool fill: celadon bleeding in from the
  // last band, red bleeding out, a couple of pixels each side
  ctx.strokeStyle = rgba(CELADON, 0.26 * alphaMul);
  ctx.lineWidth = 2;
  wobbleCirclePath(CX, CY, set.poolR - 1, poolBand, pang);
  ctx.stroke();
  ctx.strokeStyle = rgba(RED, 0.26 * alphaMul);
  wobbleCirclePath(CX, CY, set.poolR + 1, poolBand, pang);
  ctx.stroke();
  drawMarks(px, py, 0, set.poolMarks, pang, alphaMul);
}
function drawCrackle() {
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, 404, 0, Math.PI * 2);
  ctx.clip();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var i = 0; i < cracks.length; i++) {
    var ck = cracks[i];
    ctx.strokeStyle = rgba(CRACKLE, ck.alpha);
    ctx.lineWidth = ck.w;
    ctx.beginPath();
    for (var j = 0; j < ck.pts.length; j++) {
      if (j === 0) ctx.moveTo(ck.pts[j][0], ck.pts[j][1]);
      else ctx.lineTo(ck.pts[j][0], ck.pts[j][1]);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-80, -80, DW + 160, DH + 160);
  // 48 second loop in three 16 second segments: each set
  // holds alone for 6 seconds, then crossfades over the
  // remaining 10 into the next set; ring angles run on the
  // continuous clock, so the turn never jumps at the wrap
  var cyc = T % LOOP;
  var seg = Math.floor(cyc / SEG);
  var local = cyc - seg * SEG;
  drawSet(SETS[seg], 1);
  if (local >= HOLD) {
    var w = (local - HOLD) / (SEG - HOLD);
    w = w * w * (3 - 2 * w);
    drawSet(SETS[(seg + 1) % SETS.length], w);
  }
  drawCrackle();
  ctx.strokeStyle = rgba(OCHRE, 0.75);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(CX, CY, ROUT, 0, Math.PI * 2);
  ctx.stroke();
}

// ---- simulation ------------------------------------------------------------------
// The clock is the whole simulation: advancing it turns the
// rings and walks the loop through its holds and crossfades.
function stepSim() { T += TICK; }

// ---- resize ------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame -----------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the square basin keeps its shape, centred in
  // the frame, with the page ground in the piece ground colour
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
