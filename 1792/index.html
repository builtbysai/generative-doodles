<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlapped Listening</title>
<style>
html, body { margin: 0; padding: 0; background: #d6d0c2; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#d6d0c2';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, sensor mid-leg right window to right doorway */
var BONE = '#EFEAE0';
var NEARBLACK = '#1E1C19';
var BLUE = '#5F7FA8'; /* the single cold blue, reserved for the sensor reticle */
var PLATE_FILL = '#F4F1EA';
var PLATE_LINE = 'rgba(0,0,0,0.28)';
var PLATE_INK = '#26241F';
var HINT_INK = '#26241F';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- attraction points: the recordist's preoccupations ----
   doorways, windows, corners, in normalized field coords. */
var ATTRACT = [
  { name: 'left window', u: 0.17, v: 0.28 },
  { name: 'centre doorway', u: 0.50, v: 0.40 },
  { name: 'right window', u: 0.79, v: 0.28 },
  { name: 'right doorway', u: 0.66, v: 0.45 },
  { name: 'right floor corner', u: 0.88, v: 0.82 },
  { name: 'left floor corner', u: 0.12, v: 0.82 },
  { name: 'centre floor', u: 0.50, v: 0.76 }
];
var LEG = 24.0; /* seconds per leg between attraction points */
var COLUMNS = [0.035, 0.30, 0.415, 0.585, 0.90]; /* column centre x, width 0.03 */
/* Fixed seeded grain field (detail layer only): 2400 speckles. */
var GRAIN = [];
(function buildGrain() {
  var rng = mulberry32(1792);
  var i;
  for (i = 0; i < 2400; i++) {
    GRAIN.push({
      u: rng(), v: rng(),
      s: 0.8 + rng() * 1.0,
      a: 0.05 + rng() * 0.21,
      light: rng() < 0.35
    });
  }
})();
/* Fixed seeded wall texture strokes (detail layer only). */
var WALLTEX = [];
(function buildWallTex() {
  var rng = mulberry32(1793);
  var i;
  for (i = 0; i < 60; i++) {
    WALLTEX.push({
      u: 0.03 + rng() * 0.94, v: 0.08 + rng() * 0.50,
      len: 6 + rng() * 9, ang: (rng() - 0.5) * 0.5,
      a: 0.03 + rng() * 0.04
    });
  }
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var dragging = false;
var dragTarget = null; /* normalized field coords under the pointer */
var dragOff = { u: 0, v: 0 }; /* bounded sensor offset from its path, 0 at frame one */
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
function X(u) { return F.x + u * F.w; }
function Y(v) { return F.y + v * F.h; }
/* ---- sensor path: closed form of piece time ----
   Cosine-eased legs between attraction points, plus a slow wobble,
   so the drift is preoccupied rather than uniform. */
function pathPos(t) {
  var leg = Math.floor(t / LEG) % ATTRACT.length;
  var u = (t % LEG) / LEG;
  var e = 0.5 * (1 - Math.cos(Math.PI * u));
  var a = ATTRACT[leg], b = ATTRACT[(leg + 1) % ATTRACT.length];
  var pu = a.u + (b.u - a.u) * e + 0.012 * Math.sin(TAU * t / 53 + 0.7);
  var pv = a.v + (b.v - a.v) * e + 0.010 * Math.sin(TAU * t / 71 + 2.1);
  return { u: pu, v: pv };
}
function sensorNorm(t) {
  var p = pathPos(t);
  return { u: p.u + dragOff.u, v: p.v + dragOff.v };
}
function sensorPx(t) {
  var p = sensorNorm(t);
  return { x: X(p.u), y: Y(p.v) };
}
function sensorR() {
  return 0.17 * Math.min(F.w, F.h); /* diameter about one third of frame width */
}
/* ---- the fixed architectural field ----
   detail=false draws the soft grey blur layer: low contrast warm greys,
   no fine lines, no grain. detail=true draws the same scene in
   grainy black-and-white: crisp near-black lines, bone white walls,
   seeded film grain. Same geometry in both, so the two layers register. */
function drawScene(detail) {
  var i, k;
  var lw = F.w / 640;
  /* ceiling band */
  ctx.fillStyle = detail ? '#E2DCCD' : '#C4BDA9';
  ctx.fillRect(F.x, Y(0.00), F.w, Y(0.06) - Y(0.00));
  if (detail) {
    ctx.fillStyle = '#D5CEBC';
    var beams = [0.22, 0.48, 0.74];
    for (i = 0; i < beams.length; i++) {
      ctx.fillRect(X(beams[i]), Y(0.00), F.w * 0.04, Y(0.06) - Y(0.00));
    }
  }
  /* wall */
  ctx.fillStyle = detail ? '#EDE8DB' : '#CFC8B8';
  ctx.fillRect(F.x, Y(0.06), F.w, Y(0.60) - Y(0.06));
  /* floor */
  ctx.fillStyle = detail ? '#D9D2C0' : '#BFB7A4';
  ctx.fillRect(F.x, Y(0.60), F.w, F.y + F.h - Y(0.60));
  if (detail) {
    /* wall texture strokes */
    ctx.strokeStyle = NEARBLACK;
    ctx.lineCap = 'round';
    for (i = 0; i < WALLTEX.length; i++) {
      var wt = WALLTEX[i];
      ctx.globalAlpha = wt.a;
      ctx.lineWidth = Math.max(1, lw * 0.9);
      ctx.beginPath();
      ctx.moveTo(X(wt.u), Y(wt.v));
      ctx.lineTo(X(wt.u) + Math.cos(wt.ang) * wt.len, Y(wt.v) + Math.sin(wt.ang) * wt.len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    /* dado line and wall seams */
    ctx.strokeStyle = '#8F8878';
    ctx.lineWidth = Math.max(1, lw * 1.0);
    ctx.beginPath();
    ctx.moveTo(F.x, Y(0.10)); ctx.lineTo(F.x + F.w, Y(0.10));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(X(0.33), Y(0.06)); ctx.lineTo(X(0.33), Y(0.60));
    ctx.moveTo(X(0.67), Y(0.06)); ctx.lineTo(X(0.67), Y(0.60));
    ctx.stroke();
  }
  /* windows */
  var wins = [[0.10, 0.24], [0.72, 0.86]];
  for (i = 0; i < wins.length; i++) {
    var wx0 = wins[i][0], wx1 = wins[i][1];
    ctx.fillStyle = detail ? '#F2EEE3' : '#D8D2C2';
    ctx.fillRect(X(wx0), Y(0.14), X(wx1) - X(wx0), Y(0.42) - Y(0.14));
    if (detail) {
      ctx.strokeStyle = NEARBLACK;
      ctx.lineWidth = Math.max(1.2, lw * 2);
      ctx.strokeRect(X(wx0), Y(0.14), X(wx1) - X(wx0), Y(0.42) - Y(0.14));
      ctx.lineWidth = Math.max(1, lw * 1.6);
      ctx.beginPath();
      ctx.moveTo(X((wx0 + wx1) / 2), Y(0.14)); ctx.lineTo(X((wx0 + wx1) / 2), Y(0.42));
      ctx.moveTo(X(wx0), Y(0.28)); ctx.lineTo(X(wx1), Y(0.28));
      ctx.stroke();
      /* sill */
      ctx.fillStyle = '#C9C2AF';
      ctx.fillRect(X(wx0) - F.w * 0.01, Y(0.42), (X(wx1) - X(wx0)) + F.w * 0.02, F.h * 0.015);
      ctx.strokeStyle = NEARBLACK;
      ctx.lineWidth = 1;
      ctx.strokeRect(X(wx0) - F.w * 0.01, Y(0.42), (X(wx1) - X(wx0)) + F.w * 0.02, F.h * 0.015);
    } else {
      ctx.strokeStyle = '#A39C8A';
      ctx.lineWidth = Math.max(2, lw * 2.5);
      ctx.strokeRect(X(wx0), Y(0.14), X(wx1) - X(wx0), Y(0.42) - Y(0.14));
    }
  }
  /* centre doorway, arched */
  ctx.beginPath();
  ctx.moveTo(X(0.44), Y(0.60));
  ctx.lineTo(X(0.44), Y(0.26));
  ctx.arc(X(0.50), Y(0.26), F.w * 0.06, Math.PI, 0);
  ctx.lineTo(X(0.56), Y(0.60));
  ctx.closePath();
  ctx.fillStyle = detail ? '#211F1C' : '#8F8878';
  ctx.fill();
  if (detail) {
    ctx.strokeStyle = NEARBLACK;
    ctx.lineWidth = Math.max(1.2, lw * 2);
    ctx.stroke();
    ctx.fillStyle = BONE;
    ctx.fillRect(X(0.44), Y(0.592), X(0.56) - X(0.44), F.h * 0.008);
  }
  /* right doorway, slightly ajar */
  ctx.fillStyle = detail ? '#211F1C' : '#8F8878';
  ctx.fillRect(X(0.62), Y(0.30), X(0.70) - X(0.62), Y(0.60) - Y(0.30));
  if (detail) {
    ctx.strokeStyle = NEARBLACK;
    ctx.lineWidth = Math.max(1.2, lw * 2);
    ctx.strokeRect(X(0.62), Y(0.30), X(0.70) - X(0.62), Y(0.60) - Y(0.30));
    /* the ajar door edge catching light */
    ctx.fillStyle = '#EDE8DB';
    ctx.fillRect(X(0.685), Y(0.32), F.w * 0.010, Y(0.58) - Y(0.32));
  }
  /* colonnade */
  for (i = 0; i < COLUMNS.length; i++) {
    var cx = COLUMNS[i];
    ctx.fillStyle = detail ? '#C9C2AF' : '#B5AD99';
    ctx.fillRect(X(cx - 0.015), Y(0.06), F.w * 0.03, Y(0.60) - Y(0.06));
    ctx.fillRect(X(cx - 0.021), Y(0.06), F.w * 0.042, F.h * 0.015);
    ctx.fillRect(X(cx - 0.021), Y(0.585), F.w * 0.042, F.h * 0.015);
    if (detail) {
      ctx.strokeStyle = NEARBLACK;
      ctx.lineWidth = 1;
      ctx.strokeRect(X(cx - 0.015), Y(0.06), F.w * 0.03, Y(0.60) - Y(0.06));
      /* fluting */
      ctx.strokeStyle = 'rgba(30,28,25,0.45)';
      ctx.beginPath();
      ctx.moveTo(X(cx - 0.006), Y(0.08)); ctx.lineTo(X(cx - 0.006), Y(0.58));
      ctx.moveTo(X(cx + 0.006), Y(0.08)); ctx.lineTo(X(cx + 0.006), Y(0.58));
      ctx.stroke();
      /* shadow at the base, on the floor */
      ctx.fillStyle = 'rgba(30,28,25,0.18)';
      ctx.fillRect(X(cx - 0.021), Y(0.60), F.w * 0.042, F.h * 0.012);
    }
  }
  /* skirting line where wall meets floor */
  ctx.strokeStyle = detail ? NEARBLACK : '#A39C8A';
  ctx.lineWidth = detail ? Math.max(1.2, lw * 2) : Math.max(2, lw * 3);
  ctx.beginPath();
  ctx.moveTo(F.x, Y(0.60)); ctx.lineTo(F.x + F.w, Y(0.60));
  ctx.stroke();
  /* floor grid, perspective to the vanishing point */
  var vpx = X(0.50), vpy = Y(0.60);
  ctx.strokeStyle = detail ? '#3A362F' : '#A39C8A';
  ctx.lineWidth = detail ? Math.max(1, lw * 1.2) : Math.max(1.5, lw * 2.5);
  ctx.beginPath();
  for (k = 0; k <= 10; k++) {
    var fx = k / 10;
    ctx.moveTo(vpx, vpy);
    ctx.lineTo(X(fx), F.y + F.h);
  }
  for (k = 1; k <= 6; k++) {
    var hy = 0.60 + 0.40 * Math.pow(k / 6, 1.6);
    ctx.moveTo(F.x, Y(hy));
    ctx.lineTo(F.x + F.w, Y(hy));
  }
  ctx.stroke();
  if (detail) {
    /* film grain: fixed seeded speckle over the whole field */
    for (i = 0; i < GRAIN.length; i++) {
      var g = GRAIN[i];
      ctx.fillStyle = g.light
        ? 'rgba(239,234,224,' + g.a.toFixed(4) + ')'
        : 'rgba(30,28,25,' + g.a.toFixed(4) + ')';
      ctx.fillRect(X(g.u), Y(g.v), g.s, g.s);
    }
  }
}
/* ---- the roving sensor: detail core, crossfaded edge, reticle ---- */
function drawSensor(t) {
  var c = sensorPx(t);
  var R = sensorR();
  var rings = 16, i, r0, r1;
  ctx.save();
  ctx.beginPath();
  ctx.rect(F.x, F.y, F.w, F.h);
  ctx.clip();
  /* grainy detail core */
  ctx.save();
  ctx.beginPath();
  ctx.arc(c.x, c.y, R * 0.74, 0, TAU);
  ctx.clip();
  drawScene(true);
  ctx.restore();
  /* crossfade rings: the blurred base redrawn over the detail edge,
     alpha rising outward, so the circle edge is soft, not cut. */
  for (i = 0; i < rings; i++) {
    r0 = R * (0.74 + 0.26 * i / rings);
    r1 = R * (0.74 + 0.26 * (i + 1) / rings);
    ctx.save();
    ctx.beginPath();
    ctx.arc(c.x, c.y, r1, 0, TAU);
    ctx.arc(c.x, c.y, r0, 0, TAU, true);
    ctx.clip();
    ctx.globalAlpha = (i + 0.5) / rings;
    drawScene(false);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  /* reticle: the single cold blue, ring plus four ticks and a centre dot */
  ctx.strokeStyle = BLUE;
  ctx.fillStyle = BLUE;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(c.x, c.y, R + 2, 0, TAU);
  ctx.stroke();
  var tick = 9, gap = 4;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(c.x, c.y - R - gap - tick); ctx.lineTo(c.x, c.y - R - gap);
  ctx.moveTo(c.x, c.y + R + gap); ctx.lineTo(c.x, c.y + R + gap + tick);
  ctx.moveTo(c.x - R - gap - tick, c.y); ctx.lineTo(c.x - R - gap, c.y);
  ctx.moveTo(c.x + R + gap, c.y); ctx.lineTo(c.x + R + gap + tick, c.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(c.x, c.y, 2.2, 0, TAU);
  ctx.fill();
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Overlapped Listening').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Overlapped Listening').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 08').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Overlapped Listening', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 08', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to re-aim the sensor.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawScene(false);
  drawSensor(phaseT);
  drawPlates();
}
function pointerToField(e) {
  var px = (e && typeof e.clientX === 'number') ? e.clientX : 0;
  var py = (e && typeof e.clientY === 'number') ? e.clientY : 0;
  return {
    u: clamp((px - F.x) / F.w, 0.05, 0.95),
    v: clamp((py - F.y) / F.h, 0.05, 0.95)
  };
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    sensorPos: function (t) { var p = sensorNorm(t); return [p.u, p.v]; },
    pathPos: function (t) { var p = pathPos(t); return [p.u, p.v]; },
    attract: function () {
      var out = [], i;
      for (i = 0; i < ATTRACT.length; i++) out.push([ATTRACT[i].u, ATTRACT[i].v]);
      return out;
    },
    dragOff: function () { return [dragOff.u, dragOff.v]; },
    grainCount: function () { return GRAIN.length; }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragTarget = pointerToField(e);
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    dragTarget = pointerToField(e);
  });
  window.addEventListener('pointerup', function () { dragging = false; dragTarget = null; });
  window.addEventListener('pointercancel', function () { dragging = false; dragTarget = null; });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      /* drag: while held, the offset chases the pointer; on release it
         decays back to the path with a slow lag, the ear catching up. */
      var p = pathPos(phaseT);
      if (dragging && dragTarget) {
        var k = 1 - Math.exp(-dt * 6);
        dragOff.u += ((dragTarget.u - p.u) - dragOff.u) * k;
        dragOff.v += ((dragTarget.v - p.v) - dragOff.v) * k;
      } else {
        var kd = Math.exp(-dt / 6);
        dragOff.u *= kd;
        dragOff.v *= kd;
        if (Math.abs(dragOff.u) < 0.0005) dragOff.u = 0;
        if (Math.abs(dragOff.v) < 0.0005) dragOff.v = 0;
      }
      dragOff.u = clamp(dragOff.u, -0.35, 0.35);
      dragOff.v = clamp(dragOff.v, -0.35, 0.35);
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
