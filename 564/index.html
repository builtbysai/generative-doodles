<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Para Qué Quiere Los Dientes?</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #2E3A5A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: the specced five, plus flat supporting tones for skin, hair and
  // shirts (recorded in process.md). Flat fills only, no gradients.
  var INDIGO = '#2E3A5A', CREAM = '#F8F3E4', CREAM_D = '#E9DFC6',
      DUCK = '#E88B2E', RED = '#C23B3B', INK = '#141414',
      SKIN = '#E8B88A', WHITE = '#FFFFFF',
      HAIR_D = '#241D18', HAIR_B = '#3A2A1C',
      SHIRT_G = '#4E7A5A', SHIRT_M = '#B98A3E';

  var PHASE0 = 1.7; // constant first-frame phase

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(564068);       // fixed seed: layout picks
  var rngDeal = mulberry32(987123);   // runtime stream for drag deals

  // ---- the clue bank: scripted escalation, her voice (see process.md) ----
  // who: 0 duck host, 1 man one, 2 Carmen, 3 man two
  var BANK = [
    { who: 0, text: 'Es un diez pero... Carta a la frente, sin mirar. Vosotros adivináis el número.' },
    { who: 0, text: 'Es un diez pero es el del festival que dijo que le daba asco comer coños.' },
    { who: 1, text: '¡JODER! ¿¡Ese soy yo!?' },
    { who: 0, text: 'Es un diez pero es politoxicómana. De las organizadas, ¿eh?' },
    { who: 1, text: 'Es un diez pero no tiene dientes. Ni uno solo.' },
    { who: 3, text: 'Un ocho. Y me he enamorado.' }
  ];
  var clueIdx = 0;

  // ---- footer zingers: the specced one is the default and returns ----
  var FOOTERS = [
    '¿Para qué quiere los dientes, de todas formas?',
    'Un ocho, con la boca cerrada.',
    'El amor no necesita dentadura.',
    'La carta sigue en blanco. Ese es el juego.'
  ];
  var footerIdx = 0;

  // ---- players ----
  // kind: 'duck' | 'man1' | 'carmen' | 'man2'; side: which hand holds the card
  var PLAYERS = [
    { x: 180, kind: 'duck',   side: 1,  rot: -0.09, phase: 0.0, flipStart: -10 },
    { x: 420, kind: 'man1',   side: -1, rot: 0.06,  phase: 1.7, flipStart: -10 },
    { x: 660, kind: 'carmen', side: 1,  rot: -0.05, phase: 3.4, flipStart: -10 },
    { x: 900, kind: 'man2',   side: -1, rot: 0.10,  phase: 5.1, flipStart: -10 }
  ];
  var HEAD_Y = 470, CARD_Y = 322, CARD_W = 118, CARD_H = 158;

  // ---- precomputed party dressing (seeded, fixed forever) ----
  var CONFETTI = [];
  (function () {
    var r = mulberry32(31337);
    var cols = [CREAM, DUCK, RED];
    for (var i = 0; i < 46; i++) {
      CONFETTI.push({
        x: 30 + r() * 1020, y: 30 + r() * 900,
        s: 3 + r() * 5, rot: r() * Math.PI, c: cols[Math.floor(r() * 3)],
        circ: r() > 0.5
      });
    }
  })();
  var STUBBLE = [];
  (function () {
    var r = mulberry32(777);
    for (var i = 0; i < 26; i++) STUBBLE.push({ a: 0.35 + r() * (Math.PI - 0.7), d: 62 + r() * 13 });
  })();

  // ---- small helpers ----
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function fillStroke(fill, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.strokeStyle = INK; ctx.lineWidth = lw || 6; ctx.stroke();
  }

  // hand-lettered wobbly text: per-letter jitter from a stable string hash
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  var FONT = '"Comic Sans MS", "Segoe Print", "Comic Neue", cursive, sans-serif';
  function wobText(text, cx, cy, size) {
    ctx.font = '700 ' + size + 'px ' + FONT;
    ctx.fillStyle = INK;
    ctx.textBaseline = 'middle';
    var r = mulberry32(hashStr(text + '|' + size));
    var widths = [], total = 0, i, w;
    for (i = 0; i < text.length; i++) { w = ctx.measureText(text[i]).width; widths.push(w); total += w; }
    var x = cx - total / 2;
    for (i = 0; i < text.length; i++) {
      ctx.save();
      ctx.translate(x + widths[i] / 2, cy + (r() - 0.5) * size * 0.14);
      ctx.rotate((r() - 0.5) * 0.13);
      ctx.textAlign = 'center';
      ctx.fillText(text[i], 0, 0);
      ctx.restore();
      x += widths[i];
    }
  }
  function wrapText(text, maxW, size) {
    ctx.font = '700 ' + size + 'px ' + FONT;
    var words = text.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var t = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = t;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ---- background dressing ----
  function drawParty(t) {
    // confetti
    for (var i = 0; i < CONFETTI.length; i++) {
      var c = CONFETTI[i];
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.c;
      if (c.circ) { circ(0, 0, c.s * 0.6); ctx.fill(); }
      else ctx.fillRect(-c.s, -c.s * 0.45, c.s * 2, c.s * 0.9);
      ctx.restore();
    }
    // bunting: two strings with triangle flags + twinkling bulbs
    var strings = [
      { x0: -10, y0: 26, x1: 370, y1: 96, x2: 700, y2: 22 },
      { x0: 700, y0: 22, x1: 920, y1: 84, x2: 1090, y2: 30 }
    ];
    var flagCols = [RED, DUCK, CREAM];
    for (var s = 0; s < strings.length; s++) {
      var st = strings[s];
      ctx.strokeStyle = INK; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(st.x0, st.y0);
      ctx.quadraticCurveTo(st.x1, st.y1, st.x2, st.y2);
      ctx.stroke();
      for (var k = 1; k <= 7; k++) {
        var u = k / 8;
        var px = (1 - u) * (1 - u) * st.x0 + 2 * (1 - u) * u * st.x1 + u * u * st.x2;
        var py = (1 - u) * (1 - u) * st.y0 + 2 * (1 - u) * u * st.y1 + u * u * st.y2;
        ctx.beginPath();
        ctx.moveTo(px - 17, py);
        ctx.lineTo(px + 17, py);
        ctx.lineTo(px, py + 34);
        ctx.closePath();
        fillStroke(flagCols[k % 3], 4);
        var tw = 0.45 + 0.4 * Math.sin(t * 2 + k * 1.3 + s * 2.1);
        ctx.save();
        ctx.globalAlpha = tw;
        circ(px, py + 46, 5); ctx.fillStyle = CREAM; ctx.fill();
        ctx.restore();
      }
    }
  }

  // ---- faces ----
  function duckHead(x, y) {
    // dark bob hair behind the white head
    ell(x, y - 8, 86, 88); fillStroke(HAIR_D, 6);
    ell(x, y, 74, 80); fillStroke(WHITE, 6);
    // hair cap re-drawn on top so the bob reads
    ctx.beginPath();
    ctx.ellipse(x, y - 16, 76, 82, 0, Math.PI * 1.08, Math.PI * 1.92);
    ctx.fillStyle = HAIR_D; ctx.fill();
    // stern eyes
    circ(x - 29, y - 12, 6); ctx.fillStyle = INK; ctx.fill();
    circ(x + 29, y - 12, 6); ctx.fillStyle = INK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 46, y - 34); ctx.lineTo(x - 14, y - 24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 46, y - 34); ctx.lineTo(x + 14, y - 24); ctx.stroke();
    // the bill
    ell(x, y + 30, 46, 25); fillStroke(DUCK, 6);
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x - 44, y + 30); ctx.quadraticCurveTo(x, y + 40, x + 44, y + 30); ctx.stroke();
    circ(x - 13, y + 22, 3); ctx.fillStyle = INK; ctx.fill();
    circ(x + 13, y + 22, 3); ctx.fillStyle = INK; ctx.fill();
  }
  function man1Head(x, y) {
    circ(x, y, 80); fillStroke(SKIN, 6);
    // hair cap
    ctx.beginPath();
    ctx.ellipse(x, y - 6, 81, 81, 0, Math.PI * 1.05, Math.PI * 1.95);
    ctx.fillStyle = HAIR_D; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(x, y - 6, 81, 81, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    // eyes, raised worried brows
    circ(x - 28, y - 4, 6); ctx.fillStyle = INK; ctx.fill();
    circ(x + 28, y - 4, 6); ctx.fillStyle = INK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 44, y - 28); ctx.quadraticCurveTo(x - 28, y - 38, x - 12, y - 28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 12, y - 28); ctx.quadraticCurveTo(x + 28, y - 38, x + 44, y - 28); ctx.stroke();
    // stubble
    ctx.fillStyle = INK;
    for (var i = 0; i < STUBBLE.length; i++) {
      var st = STUBBLE[i];
      circ(x + Math.cos(st.a) * st.d, y + Math.sin(st.a) * st.d, 2.2); ctx.fill();
    }
    // flat uneasy mouth
    ctx.strokeStyle = INK; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x - 16, y + 44); ctx.lineTo(x + 16, y + 44); ctx.stroke();
  }
  function carmenHead(x, y) {
    // big dark curls: a halo of ink circles
    var curls = [[-72, -30], [-66, 22], [-52, -62], [-24, -80], [8, -84], [40, -74], [64, -48], [74, -8], [70, 34], [-74, 30]];
    for (var i = 0; i < curls.length; i++) { circ(x + curls[i][0], y + curls[i][1], 26); fillStroke(HAIR_D, 5); }
    circ(x, y, 76); fillStroke(SKIN, 6);
    // raised brows, bright eyes, open enthusiastic smile
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 46, y - 30); ctx.quadraticCurveTo(x - 28, y - 42, x - 10, y - 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 10, y - 30); ctx.quadraticCurveTo(x + 28, y - 42, x + 46, y - 30); ctx.stroke();
    circ(x - 27, y - 8, 6.5); ctx.fillStyle = INK; ctx.fill();
    circ(x + 27, y - 8, 6.5); ctx.fillStyle = INK; ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y + 18, 26, Math.PI * 0.1, Math.PI * 0.9);
    ctx.closePath(); fillStroke(INK, 4);
    ell(x, y + 30, 14, 7); ctx.fillStyle = RED; ctx.fill();
    circ(x + 44, y + 22, 4); ctx.fillStyle = INK; ctx.fill(); // beauty mark
  }
  function man2Head(x, y) {
    circ(x, y, 80); fillStroke(SKIN, 6);
    // beard: bottom crescent
    ctx.beginPath();
    ctx.ellipse(x, y + 6, 79, 79, 0, Math.PI * 0.18, Math.PI * 0.82);
    ctx.fillStyle = HAIR_B; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    // short hair cap
    ctx.beginPath();
    ctx.ellipse(x, y - 8, 80, 80, 0, Math.PI * 1.12, Math.PI * 1.88);
    ctx.fillStyle = HAIR_B; ctx.fill();
    // calm eyes + nose over the beard
    circ(x - 27, y - 14, 6); ctx.fillStyle = INK; ctx.fill();
    circ(x + 27, y - 14, 6); ctx.fillStyle = INK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 43, y - 32); ctx.lineTo(x - 11, y - 32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 11, y - 32); ctx.lineTo(x + 43, y - 32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.quadraticCurveTo(x + 8, y + 8, x, y + 16); ctx.stroke();
  }

  // ---- one player: torso, head, holding arm, forehead card ----
  function drawPlayer(p, t) {
    var bob = Math.sin(t * 1.4 + p.phase) * 3.5;
    var x = p.x, hy = HEAD_Y + bob;
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    // torso (the table will cover its base)
    var shirt = p.kind === 'duck' ? CREAM : p.kind === 'man1' ? SHIRT_G :
                p.kind === 'carmen' ? RED : SHIRT_M;
    ctx.beginPath();
    ctx.moveTo(x - 74, 566);
    ctx.lineTo(x + 74, 566);
    ctx.lineTo(x + 92, 736);
    ctx.lineTo(x - 92, 736);
    ctx.closePath(); fillStroke(shirt, 6);
    if (p.kind === 'carmen') { // neckline
      ctx.beginPath();
      ctx.moveTo(x - 30, 566); ctx.lineTo(x + 30, 566); ctx.lineTo(x, 606);
      ctx.closePath(); fillStroke(SKIN, 5);
    }
    // resting arm down to the table
    var rx = x - p.side * 62, ry = 592;
    ctx.strokeStyle = INK; ctx.lineWidth = 34;
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(x - p.side * 102, 700); ctx.stroke();
    ctx.strokeStyle = shirt; ctx.lineWidth = 25;
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(x - p.side * 102, 700); ctx.stroke();
    circ(x - p.side * 102, 702, 15); fillStroke(SKIN, 5);

    // holding arm up to the card's lower corner (drawn before the head,
    // so the head overlaps the arm instead of the arm crossing the face)
    var gx = x + p.side * 52, gy = CARD_Y + 64 + bob;
    ctx.strokeStyle = INK; ctx.lineWidth = 34;
    ctx.beginPath(); ctx.moveTo(x + p.side * 58, 592); ctx.lineTo(gx, gy); ctx.stroke();
    ctx.strokeStyle = shirt; ctx.lineWidth = 25;
    ctx.beginPath(); ctx.moveTo(x + p.side * 58, 592); ctx.lineTo(gx, gy); ctx.stroke();

    // head
    if (p.kind === 'duck') duckHead(x, hy);
    else if (p.kind === 'man1') man1Head(x, hy);
    else if (p.kind === 'carmen') carmenHead(x, hy);
    else man2Head(x, hy);

    // the card: blank on both sides, forever (that is the gag)
    var fp = (t - p.flipStart) / 0.45;
    var sx = 1;
    if (fp >= 0 && fp < 1) sx = Math.cos(fp * Math.PI);
    ctx.save();
    ctx.translate(x, CARD_Y + bob);
    ctx.rotate(p.rot);
    ctx.scale(sx, 1);
    var back = sx < 0;
    rr(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 10);
    fillStroke(back ? CREAM_D : CREAM, 6);
    rr(-CARD_W / 2 + 11, -CARD_H / 2 + 11, CARD_W - 22, CARD_H - 22, 6);
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.save(); ctx.globalAlpha = 0.45; ctx.stroke(); ctx.restore();
    ctx.restore();

    // grip hand over the card's lower corner
    circ(gx, gy, 16); fillStroke(p.kind === 'duck' ? WHITE : SKIN, 5);

    ctx.restore();
  }

  // ---- table and props ----
  function bottle(x, y, col) {
    ctx.beginPath();
    ctx.moveTo(x - 17, y); ctx.lineTo(x - 17, y - 52);
    ctx.lineTo(x - 6, y - 66); ctx.lineTo(x - 6, y - 88);
    ctx.lineTo(x + 6, y - 88); ctx.lineTo(x + 6, y - 66);
    ctx.lineTo(x + 17, y - 52); ctx.lineTo(x + 17, y);
    ctx.closePath(); fillStroke(col, 5);
    rr(x - 7, y - 100, 14, 13, 3); fillStroke(INK, 4);
  }
  function drawTable() {
    bottle(470, 690, RED);
    bottle(560, 690, SHIRT_G);
    bottle(792, 690, DUCK);
    // snack bowl, in the gap between the duck host and man one:
    // an upper half-disc so it sits on the table line like the bottles
    ctx.beginPath();
    ctx.arc(300, 688, 34, Math.PI, 2 * Math.PI);
    ctx.closePath(); fillStroke(CREAM, 5);
    ell(300, 688, 34, 8); fillStroke(CREAM_D, 4);
    circ(284, 678, 8); ctx.fillStyle = DUCK; ctx.fill();
    circ(304, 672, 8); ctx.fillStyle = RED; ctx.fill();
    circ(320, 680, 8); ctx.fillStyle = DUCK; ctx.fill();
    // cups
    var cupXs = [386, 872];
    for (var i = 0; i < cupXs.length; i++) {
      ctx.beginPath();
      ctx.moveTo(cupXs[i] - 16, 660); ctx.lineTo(cupXs[i] + 16, 660);
      ctx.lineTo(cupXs[i] + 12, 690); ctx.lineTo(cupXs[i] - 12, 690);
      ctx.closePath(); fillStroke(CREAM, 5);
    }
    // table top + cloth front
    rr(58, 688, 964, 40, 12); fillStroke(CREAM_D, 6);
    ctx.beginPath();
    ctx.moveTo(58, 722); ctx.lineTo(1022, 722);
    ctx.lineTo(1022, 892);
    ctx.quadraticCurveTo(1022, 908, 1006, 908);
    ctx.lineTo(74, 908);
    ctx.quadraticCurveTo(58, 908, 58, 892);
    ctx.closePath(); fillStroke(CREAM, 6);
    ctx.save();
    ctx.globalAlpha = 0.14; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    for (var fx = 218; fx < 1000; fx += 160) {
      ctx.beginPath(); ctx.moveTo(fx, 730); ctx.lineTo(fx, 900); ctx.stroke();
    }
    ctx.restore();
    // face-down blank cards on the cloth
    var down = [[238, 806, 0.22], [706, 838, -0.16], [468, 856, 0.4]];
    for (var d = 0; d < down.length; d++) {
      ctx.save();
      ctx.translate(down[d][0], down[d][1]);
      ctx.rotate(down[d][2]);
      rr(-42, -56, 84, 112, 8); fillStroke(CREAM_D, 5);
      ctx.restore();
    }
  }

  // ---- the clue bubble, tail aimed at the current speaker ----
  function drawBubble(t) {
    var e = BANK[clueIdx];
    var lines = wrapText(e.text, 560, 37);
    var lh = 47, bw = 660;
    var bh = lines.length * lh + 38;
    var bx = 540 - bw / 2, by = 128;
    rr(bx, by, bw, bh, 28);
    ctx.fillStyle = CREAM; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
    var sp = PLAYERS[e.who];
    var tailX = Math.max(bx + 50, Math.min(bx + bw - 50, sp.x));
    var bob = Math.sin(t * 1.4 + sp.phase) * 3.5;
    ctx.beginPath();
    ctx.moveTo(tailX - 19, by + bh - 4);
    ctx.lineTo(sp.x, HEAD_Y - 92 + bob);
    ctx.lineTo(tailX + 19, by + bh - 4);
    ctx.closePath();
    ctx.fillStyle = CREAM; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tailX - 15, by + bh - 5);
    ctx.lineTo(tailX + 15, by + bh - 5);
    ctx.strokeStyle = CREAM; ctx.lineWidth = 8; ctx.stroke();
    var y0 = by + bh / 2 - (lines.length - 1) * lh / 2;
    for (var i = 0; i < lines.length; i++) wobText(lines[i], 540, y0 + i * lh, 37);
  }

  // ---- footer caption bar ----
  var FOOTER_Y = 964;
  function drawFooter() {
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, FOOTER_Y, 1080, 1080 - FOOTER_Y);
    ctx.strokeStyle = INK; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(0, FOOTER_Y); ctx.lineTo(1080, FOOTER_Y); ctx.stroke();
    var lines = wrapText(FOOTERS[footerIdx], 990, 39);
    var lh = 50;
    var y0 = FOOTER_Y + (1080 - FOOTER_Y) / 2 - (lines.length - 1) * lh / 2;
    for (var i = 0; i < lines.length; i++) wobText(lines[i], 540, y0 + i * lh, 39);
  }

  // ---- interaction ----
  var simT = PHASE0;
  var dragging = false, dragMoved = false, downX = 0, downY = 0;
  function toDesign(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return {
      x: (e.clientX - r.left - OX) / S * 1080,
      y: (e.clientY - r.top - OY) / S * 1080
    };
  }
  function onDown(e) {
    var p = toDesign(e);
    dragging = true; dragMoved = false;
    downX = p.x; downY = p.y;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var p = toDesign(e);
    if (Math.abs(p.x - downX) + Math.abs(p.y - downY) > 16) dragMoved = true;
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var p = toDesign(e);
    if (dragMoved) {
      // drag: deal a fresh blank card to a random player, clue escalates
      var target = Math.floor(rngDeal() * 4);
      PLAYERS[target].flipStart = simT;
      clueIdx = (clueIdx + 1) % BANK.length;
    } else {
      if (p.y >= FOOTER_Y) {
        footerIdx = (footerIdx + 1) % FOOTERS.length;
      } else {
        for (var i = 0; i < PLAYERS.length; i++) {
          var pl = PLAYERS[i];
          if (Math.abs(p.x - pl.x) < 118 && p.y > 190 && p.y < 720) {
            pl.flipStart = simT;
            break;
          }
        }
      }
    }
    draw(simT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---- draw ----
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = INDIGO;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);
    ctx.lineJoin = 'round';

    drawParty(t);
    for (var i = 0; i < PLAYERS.length; i++) drawPlayer(PLAYERS[i], t);
    drawTable();
    drawBubble(t);
    drawFooter();

    // hint
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = CREAM;
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('tap · drag', 1052, 950);
    ctx.restore();

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground is indigo) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }
  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      S = W; OX = 0; OY = (H - S) / 2;
    } else {
      S = Math.min(W, H); OX = (W - S) / 2; OY = (H - S) / 2;
    }
    draw(simT);
  }

  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
