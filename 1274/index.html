<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wedded Bliss</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #121013; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Deterministic seeded random (integer LCG, no Math.random).
  var seedState = 1274;
  function rnd() {
    seedState = (seedState * 1664525 + 1013904223) >>> 0;
    return seedState / 4294967296;
  }

  var startMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function pieceTime() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - startMs) / 1000;
    }
    return 0;
  }

  // Interaction state: closed-form functions of recorded events and t.
  var dragging = null; // {side:'L'|'R', startX:number, off:number}
  var lastRelease = null; // {t:number, l:number, r:number}
  var dragOff = { l: 0, r: 0 };

  function offsetFor(side, t) {
    if (dragging && dragging.side === side) return dragging.off;
    if (lastRelease) {
      var d = side === 'L' ? lastRelease.l : lastRelease.r;
      var dt = t - lastRelease.t;
      if (dt < 0) dt = 0;
      return d * Math.exp(-dt / 1.4);
    }
    return 0;
  }

  // Pre-seed the stitch field (deterministic, built once at load).
  var stitches = [];
  (function buildStitches() {
    var rows = 7;
    for (var i = 0; i < 28; i++) {
      var row = i % rows;
      var col = Math.floor(i / rows);
      stitches.push({
        y: 0.30 + row * 0.068 + (rnd() - 0.5) * 0.02,
        col: col,
        phase: rnd() * Math.PI * 2,
        sagJ: (rnd() - 0.5) * 0.02,
        lenJ: 0.85 + rnd() * 0.3
      });
    }
  })();

  // Pre-seed sari dot fields for each figure (positions in figure-local coords).
  function buildDots(n) {
    var dots = [];
    for (var i = 0; i < n; i++) {
      dots.push({ x: (rnd() - 0.5), y: (rnd() - 0.5), r: 0.008 + rnd() * 0.012 });
    }
    return dots;
  }
  var dotsL = buildDots(46);
  var dotsR = buildDots(46);

  function viewport() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    return { w: w, h: h };
  }

  function isPhone(vp) {
    var minDim = 1e9;
    if (typeof window !== 'undefined' && window.screen) {
      minDim = Math.min(window.screen.width, window.screen.height);
    }
    if (minDim < 700) return true;
    return vp.h > vp.w * 1.15;
  }

  function drawFigure(cx, baseY, fw, fh, lean, palette) {
    // Draped abstract figure: soft blob silhouette, wider at base, facing inward.
    ctx.save();
    ctx.translate(cx + lean, baseY);
    ctx.rotate(lean * 0.0012);
    ctx.beginPath();
    ctx.moveTo(0, -fh);
    ctx.bezierCurveTo(fw * 0.42, -fh * 0.98, fw * 0.52, -fh * 0.72, fw * 0.46, -fh * 0.45);
    ctx.bezierCurveTo(fw * 0.42, -fh * 0.20, fw * 0.58, -fh * 0.08, fw * 0.55, 0);
    ctx.lineTo(-fw * 0.55, 0);
    ctx.bezierCurveTo(-fw * 0.58, -fh * 0.08, -fw * 0.42, -fh * 0.20, -fw * 0.46, -fh * 0.45);
    ctx.bezierCurveTo(-fw * 0.52, -fh * 0.72, -fw * 0.42, -fh * 0.98, 0, -fh);
    ctx.closePath();
    ctx.fillStyle = palette.body;
    ctx.fill();
    // Thin trim outline so the dark figure reads against the ink ground.
    ctx.strokeStyle = palette.trim;
    ctx.lineWidth = Math.max(1, fw * 0.008);
    ctx.stroke();
    // Sari layers clipped to the silhouette.
    ctx.save();
    ctx.clip();
    ctx.fillStyle = palette.band;
    ctx.fillRect(-fw * 0.6, -fh * 0.78, fw * 1.2, fh * 0.05);
    ctx.fillRect(-fw * 0.6, -fh * 0.52, fw * 1.2, fh * 0.035);
    ctx.fillRect(-fw * 0.6, -fh * 0.28, fw * 1.2, fh * 0.05);
    ctx.fillStyle = palette.trim;
    ctx.fillRect(-fw * 0.6, -fh * 0.735, fw * 1.2, fh * 0.012);
    ctx.fillRect(-fw * 0.6, -fh * 0.485, fw * 1.2, fh * 0.012);
    ctx.fillRect(-fw * 0.6, -fh * 0.235, fw * 1.2, fh * 0.012);
    // Dot field, clipped to the silhouette (each dot its own path).
    ctx.fillStyle = palette.dot;
    var dots = palette.dots;
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      ctx.beginPath();
      ctx.arc(d.x * fw * 0.9, d.y * fh - fh * 0.5, d.r * fw, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.restore();
  }

  function draw(t) {
    var vp = viewport();
    var w = vp.w, h = vp.h;
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var phone = isPhone(vp);

    // Page ground is the piece background on every size.
    ctx.fillStyle = '#121013';
    ctx.fillRect(0, 0, w, h);

    // Centered square composition.
    var S = Math.min(w, h);
    var ox = (w - S) / 2;
    var oy = (h - S) / 2;
    var cx = ox + S / 2;
    var groundY = oy + S * 0.82;

    // Ground shadow, flat alpha ellipse (paired arcs, own paths).
    ctx.fillStyle = 'rgba(42,47,69,0.55)';
    ctx.beginPath();
    ctx.moveTo(cx + S * 0.34, groundY);
    ctx.ellipse(cx, groundY, S * 0.34, S * 0.022, 0, 0, Math.PI * 2);
    ctx.fill();

    var offL = offsetFor('L', t);
    var offR = offsetFor('R', t);
    var fw = S * 0.30, fh = S * 0.62;
    var figLx = cx - S * 0.235, figRx = cx + S * 0.235;

    // Stitch bridge first (behind figure fronts, anchors follow the figures).
    var gapL = figLx + offL + fw * 0.46;
    var gapR = figRx + offR - fw * 0.46;
    var gap = gapR - gapL;
    var gapBase = S * 0.235 * 2 - fw * 0.92;
    var slack = Math.max(0, gap - gapBase) / S; // >0 when pulled apart
    var tight = Math.max(0, gapBase - gap) / S; // >0 when pushed together
    for (var i = 0; i < stitches.length; i++) {
      var st = stitches[i];
      var y = oy + S * st.y;
      var x0 = gapL + st.col * gap * 0.06;
      var x1 = gapR - st.col * gap * 0.06;
      var sag = (0.012 + slack * 0.10 - tight * 0.008 + st.sagJ) * S;
      var pulse = 0.68 + 0.25 * Math.sin((Math.PI * 2 * t) / 5 + st.phase);
      ctx.strokeStyle = 'rgba(232,140,160,' + pulse.toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, S * 0.0035);
      // Dashed thread curve: short segments along a quadratic bezier.
      var segs = 6;
      var px = x0, py = y;
      for (var sgm = 0; sgm < segs; sgm++) {
        var u0 = sgm / segs, u1 = (sgm + 0.7) / segs;
        var mx0 = (1 - u0) * (1 - u0) * x0 + 2 * (1 - u0) * u0 * ((x0 + x1) / 2) + u0 * u0 * x1;
        var my0 = (1 - u0) * (1 - u0) * y + 2 * (1 - u0) * u0 * (y + sag) + u0 * u0 * y;
        var mx1 = (1 - u1) * (1 - u1) * x0 + 2 * (1 - u1) * u1 * ((x0 + x1) / 2) + u1 * u1 * x1;
        var my1 = (1 - u1) * (1 - u1) * y + 2 * (1 - u1) * u1 * (y + sag) + u1 * u1 * y;
        ctx.beginPath();
        ctx.moveTo(mx0, my0);
        ctx.lineTo(mx1, my1);
        ctx.stroke();
        px = mx1; py = my1;
      }
    }

    // Figures.
    drawFigure(figLx, groundY, fw, fh, offL, {
      body: '#A4133C', band: '#D4A017', trim: '#E88CA0', dot: '#D4A017', dots: dotsL
    });
    drawFigure(figRx, groundY, fw, fh, offR, {
      body: '#2A2F45', band: '#A4133C', trim: '#D4A017', dot: '#D9BFA3', dots: dotsR
    });
    // Skin-toned sash accents, flat shapes on each figure's outer edge.
    ctx.fillStyle = '#D9BFA3';
    ctx.fillRect(figLx + offL - fw * 0.52, groundY - fh * 0.62, fw * 0.07, fh * 0.30);
    ctx.fillRect(figRx + offR + fw * 0.45, groundY - fh * 0.62, fw * 0.07, fh * 0.30);
    void phone;
  }

  function onDown(e) {
    var vp = viewport();
    var S = Math.min(vp.w, vp.h);
    var cx = (vp.w - S) / 2 + S / 2;
    var x = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
    if (x === undefined) return;
    var side = x < cx ? 'L' : 'R';
    dragging = { side: side, startX: x, off: 0 };
  }
  function onMove(e) {
    if (!dragging) return;
    var vp = viewport();
    var S = Math.min(vp.w, vp.h);
    var x = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
    if (x === undefined) return;
    var lim = S * 0.10;
    var off = x - dragging.startX;
    if (off > lim) off = lim;
    if (off < -lim) off = -lim;
    dragging.off = off;
    if (dragging.side === 'L') dragOff.l = off; else dragOff.r = off;
  }
  function onUp() {
    if (!dragging) return;
    lastRelease = { t: pieceTime(), l: dragOff.l, r: dragOff.r };
    dragging = null;
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(pieceTime()); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { draw(pieceTime()); });
    }
  }

  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    (function loop() {
      draw(pieceTime());
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
