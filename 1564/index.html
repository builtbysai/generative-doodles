<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Alphabet, Lit</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0B10; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BG = '#0B0B10';
var WHITE = [244, 244, 244];
var CYAN = [127, 231, 242];
var PINK = [242, 160, 192];
var BASE_LETTERS = ['B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','Q'];
var SWAP_PERIOD = 30;
var MAX_EPOCHS = 400;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function rgba(c, a) { var av = (typeof a === 'number') ? a.toFixed(4) : a; return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + av + ')'; }

/* Seeded layout: tube colors (6 white, 5 cyan, 5 pink), rotation jitter,
   flicker state-machine parameters, and the dark-ground speckle texture. */
var rng = mulberry32(1564000);
var tubePool = [];
var ti;
for (ti = 0; ti < 6; ti++) tubePool.push(WHITE);
for (ti = 0; ti < 5; ti++) tubePool.push(CYAN);
for (ti = 0; ti < 5; ti++) tubePool.push(PINK);
for (var sh = tubePool.length - 1; sh > 0; sh--) {
  var sj = Math.floor(rng() * (sh + 1));
  var tmp = tubePool[sh]; tubePool[sh] = tubePool[sj]; tubePool[sj] = tmp;
}
var tubeColor = tubePool.slice();
var rotJitter = [], flickPeriod = [], flickOffset = [], flickDropAt = [], flickDropDur = [];
for (var i = 0; i < 16; i++) {
  rotJitter.push((rng() - 0.5) * 0.12);
  flickPeriod.push(7 + rng() * 9);
  flickOffset.push(rng() * 1.5);
  flickDropAt.push(3 + rng() * 6);
  flickDropDur.push(1.0 + rng() * 1.5);
}
var speckles = [];
for (var sp = 0; sp < 420; sp++) {
  speckles.push([rng(), rng(), 0.5 + rng() * 1.6, 0.02 + rng() * 0.06]);
}

/* Seeded swap sequence: epoch k swaps one cell to a different letter.
   letterAt(i, t) replays epochs 0..floor(t/30)-1 from the seeded stream,
   so it is a closed-form function of piece time; at t = 0 nothing has swapped. */
var swapRng = mulberry32(1564001);
var swapCell = [], swapLetter = [];
for (var e = 0; e < MAX_EPOCHS; e++) {
  swapCell.push(Math.floor(swapRng() * 16));
  swapLetter.push(String.fromCharCode(65 + Math.floor(swapRng() * 26)));
}
function letterAt(i, t) {
  var k = Math.floor(t / SWAP_PERIOD);
  if (k > MAX_EPOCHS) k = MAX_EPOCHS;
  var letter = BASE_LETTERS[i];
  var cur = BASE_LETTERS.slice();
  for (var j = 0; j < k; j++) {
    var cell = swapCell[j];
    var cand = swapLetter[j];
    if (cand === cur[cell]) cand = String.fromCharCode(65 + ((cand.charCodeAt(0) - 65 + 1) % 26));
    cur[cell] = cand;
  }
  return cur[i];
}

/* Per-letter flicker brightness, closed-form in piece time.
   Phase runs on, then drops to dim for 1-2.5 s, then buzzes back over
   0.6 s at about 3 Hz, then runs on again. At t = 0 every letter is on. */
function flicker(i, t) {
  var p = flickPeriod[i];
  var phase = (t + flickOffset[i]) % p;
  var d0 = flickDropAt[i], d1 = d0 + flickDropDur[i], d2 = d1 + 0.6;
  if (phase < d0) return { b: 1, dim: false };
  if (phase < d1) return { b: 0.22, dim: true };
  if (phase < d2) {
    var u = (phase - d1) / 0.6;
    return { b: 0.45 + 0.45 * Math.sin(u * TAU * 1.8), dim: false };
  }
  return { b: 1, dim: false };
}

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, startT = null;

function isPhone() {
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    if (mn < 700) return true;
  }
  return VH > VW * 1.15;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}

function drawLetter(ch, cx, cy, fs, color, state) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.font = 'bold ' + Math.round(fs) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  if (state.dim) {
    ctx.strokeStyle = rgba(color, 0.22);
    ctx.lineWidth = fs * 0.045;
    ctx.strokeText(ch, 0, 0);
  } else {
    var b = state.b;
    ctx.strokeStyle = rgba(color, (0.16 * b).toFixed(4));
    ctx.lineWidth = fs * 0.16;
    ctx.strokeText(ch, 0, 0);
    ctx.strokeStyle = rgba(color, (0.34 * b).toFixed(4));
    ctx.lineWidth = fs * 0.09;
    ctx.strokeText(ch, 0, 0);
    ctx.strokeStyle = rgba(color, (0.95 * b).toFixed(4));
    ctx.lineWidth = fs * 0.045;
    ctx.strokeText(ch, 0, 0);
  }
  ctx.restore();
}

function draw(t) {
  size();
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, VW, VH);
  var minDim = Math.min(VW, VH);
  var phone = isPhone();
  var gs = minDim * (phone ? 0.66 : 0.60);
  var cell = gs / 4;
  var gx = (VW - gs) / 2, gy = (VH - gs) / 2 + VH * 0.01;
  var fs = cell * 0.72;

  var s;
  for (s = 0; s < speckles.length; s++) {
    var spk = speckles[s];
    ctx.fillStyle = 'rgba(180,180,200,' + spk[3].toFixed(4) + ')';
    ctx.fillRect(spk[0] * VW, spk[1] * VH, spk[2], spk[2]);
  }

  var i, row, col, cx, cy;
  for (i = 0; i < 16; i++) {
    row = Math.floor(i / 4); col = i % 4;
    cx = gx + (col + 0.5) * cell;
    cy = gy + (row + 0.5) * cell;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotJitter[i]);
    drawLetter(letterAt(i, t), 0, 0, fs, tubeColor[i], flicker(i, t));
    ctx.restore();
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(244,244,244,0.72)';
  ctx.font = Math.round(minDim * 0.032) + 'px sans-serif';
  ctx.fillText('The Alphabet, Lit', VW / 2, VH * 0.055);
  ctx.fillStyle = 'rgba(244,244,244,0.5)';
  ctx.font = Math.round(minDim * 0.022) + 'px sans-serif';
  ctx.fillText('2006 · 04 · 24', VW / 2, VH * 0.935);
  ctx.fillStyle = 'rgba(244,244,244,0.45)';
  ctx.fillText('Watch the letters flicker.', VW / 2, VH * 0.968);
}

if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
