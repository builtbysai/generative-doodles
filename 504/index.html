<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mural Cats</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#FFFFFF; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  // Design space: a landscape painted wall, 1600 x 1000. The wall
  // keeps this shape on every screen; the page ground is the white.
  var DW = 1600, DH = 1000;

  // First frame is the synchronous draw at this constant phase: every
  // cat at its seeded anchor, springs at rest, all eyes open.
  var PHASE0 = 1.6;
  var SEED = 504008;

  var WALL = '#FFFFFF';
  var INK = '#111111';
  var ACCENTS = ['#E05435', '#87CECA', '#E9A63B']; // tangerine, teal, mustard
  var LW = 8; // mural line weight in design px (~8px at 1080 scale)

  // Seeded RNG (mulberry32): the opening wall is identical for every
  // viewer and every QA render.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ---------------- scene generation ----------------
  // Cats sit in a jittered 3x3 grid so faces never overlap; clouds and
  // yarn balls take rejected-sample spots clear of the cats.
  var scene = null;
  var reseedCount = 0;

  function buildScene(seed) {
    var rng = mulberry32(seed);
    var cells = shuffled([0, 1, 2, 3, 4, 5, 6, 7, 8], rng);
    var nCats = 7;
    var accentIdx = shuffled([0, 1, 2, 3, 4, 5, 6], rng).slice(0, 3);
    var cats = [];
    var i, cell, cx, cy;
    for (i = 0; i < nCats; i++) {
      cell = cells[i];
      cx = (cell % 3) * (DW / 3) + DW / 6 + (rng() - 0.5) * 110;
      cy = (Math.floor(cell / 3) + 0.5) * (DH / 3) + 95 + (rng() - 0.5) * 70;
      var ai = accentIdx.indexOf(i);
      cats.push({
        ax: cx, ay: cy,                 // anchor (ground point)
        x: cx, y: cy, vx: 0, vy: 0,      // spring state
        rot: 0, rv: 0, tailLag: 0,
        s: 52 + rng() * 98,             // unit scale: 30-100% of base 150
        pose: rng() < 0.5 ? 'sit' : 'stand',
        flip: rng() < 0.5 ? -1 : 1,
        fill: ai >= 0 ? ACCENTS[ai % 3] : WALL,
        phase: rng() * Math.PI * 2,
        grabbed: false
      });
    }
    var clouds = [];
    for (i = 0; i < 4; i++) {
      clouds.push({
        x: 140 + rng() * (DW - 280),
        y: 90 + rng() * 300,
        w: 170 + rng() * 110,
        phase: rng() * Math.PI * 2
      });
    }
    var yarns = [];
    var tries = 0;
    while (yarns.length < 4 && tries < 300) {
      tries++;
      var yx = 90 + rng() * (DW - 180);
      var yy = 480 + rng() * 430;
      var ok = true;
      for (i = 0; i < cats.length; i++) {
        var dx = cats[i].ax - yx, dy = (cats[i].ay - cats[i].s * 1.1) - yy;
        var bx = cats[i].ax - yx, by = cats[i].ay - yy;
        if (dx * dx + dy * dy < 210 * 210) { ok = false; break; }
        if (bx * bx + by * by < 190 * 190) { ok = false; break; }
      }
      for (i = 0; ok && i < yarns.length; i++) {
        var ddx = yarns[i].x - yx, ddy = yarns[i].y - yy;
        if (ddx * ddx + ddy * ddy < 150 * 150) ok = false;
      }
      if (ok) {
        yarns.push({
          x: yx, y: yy, r: 32 + rng() * 16,
          dir: rng() < 0.5 ? -1 : 1,
          len: 130 + rng() * 130,
          phase: rng() * Math.PI * 2
        });
      }
    }
    return { cats: cats, clouds: clouds, yarns: yarns };
  }

  scene = buildScene(SEED);

  function reseed() {
    reseedCount++;
    scene = buildScene(SEED + reseedCount * 7919);
  }

  // ---------------- cat drawing (unit space, y down, ground at 0) ----
  function strokePath() { ctx.strokeStyle = INK; ctx.stroke(); }

  var catLW = LW, catScale = 1; // effective line weight for the cat being drawn
  function whiskers(x, y, dir) {
    ctx.save();
    ctx.lineWidth = (catLW * 0.72) / catScale;
    ctx.beginPath();
    var k;
    for (k = -1; k <= 1; k++) {
      ctx.moveTo(x, y + k * 0.04);
      ctx.lineTo(x + dir * 0.46, y + k * 0.14);
    }
    strokePath();
    ctx.restore();
  }

  function face(cx, cy, r, closed) {
    var ex = 0.15 * r / 0.40, ey = cy - 0.02 * r / 0.40;
    // eyes: dots, or short dashes mid-blink
    if (closed) {
      ctx.beginPath();
      ctx.moveTo(cx - ex - 0.05, ey); ctx.lineTo(cx - ex + 0.05, ey);
      ctx.moveTo(cx + ex - 0.05, ey); ctx.lineTo(cx + ex + 0.05, ey);
      strokePath();
    } else {
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(cx - ex, ey, 0.042, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + ex, ey, 0.042, 0, Math.PI * 2); ctx.fill();
    }
    // nose: tiny filled triangle; mouth: one small curve
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(cx - 0.045, cy + 0.075);
    ctx.lineTo(cx + 0.045, cy + 0.075);
    ctx.lineTo(cx, cy + 0.135);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 0.075, cy + 0.19);
    ctx.quadraticCurveTo(cx, cy + 0.26, cx + 0.075, cy + 0.19);
    strokePath();
    whiskers(cx - 0.30, cy + 0.10, -1);
    whiskers(cx + 0.30, cy + 0.10, 1);
  }

  function ears(cx, cy, r) {
    var dx = 0.27 * r / 0.40, dy = 0.30 * r / 0.40;
    ctx.beginPath();
    ctx.moveTo(cx - dx - 0.07, cy - dy + 0.10);
    ctx.lineTo(cx - dx - 0.03, cy - dy - 0.28);
    ctx.lineTo(cx - dx + 0.22, cy - dy + 0.02);
    ctx.closePath();
    ctx.fillStyle = currentFill; ctx.fill(); strokePath();
    ctx.beginPath();
    ctx.moveTo(cx + dx + 0.07, cy - dy + 0.10);
    ctx.lineTo(cx + dx + 0.03, cy - dy - 0.28);
    ctx.lineTo(cx + dx - 0.22, cy - dy + 0.02);
    ctx.closePath();
    ctx.fillStyle = currentFill; ctx.fill(); strokePath();
  }

  var currentFill = WALL;

  function drawSit(cat, wag, closed) {
    var f = cat.flip;
    currentFill = cat.fill;
    catScale = cat.s;
    catLW = 4.5 + (LW - 4.5) * (0.35 + 0.65 * (cat.s - 52) / 98);
    ctx.lineWidth = catLW / cat.s;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // tail: root at body side, curling up; tip swayed by wag
    ctx.beginPath();
    ctx.moveTo(f * 0.48, -0.10);
    ctx.quadraticCurveTo(f * (1.02 + wag * 0.4), -0.16,
                         f * (1.10 + wag), -0.62 - Math.abs(wag) * 0.2);
    strokePath();
    // body
    ctx.beginPath();
    ctx.ellipse(0, -0.52, 0.60, 0.52, 0, 0, Math.PI * 2);
    ctx.fillStyle = cat.fill; ctx.fill(); strokePath();
    // paws
    ctx.beginPath();
    ctx.ellipse(-0.24, -0.05, 0.17, 0.09, 0, 0, Math.PI * 2);
    ctx.ellipse(0.24, -0.05, 0.17, 0.09, 0, 0, Math.PI * 2);
    ctx.fillStyle = cat.fill; ctx.fill(); strokePath();
    // head + ears + face
    ears(0, -1.28, 0.40);
    ctx.beginPath();
    ctx.arc(0, -1.28, 0.40, 0, Math.PI * 2);
    ctx.fillStyle = cat.fill; ctx.fill(); strokePath();
    face(0, -1.28, 0.40, closed);
  }

  function drawStand(cat, wag, closed) {
    var f = cat.flip;
    currentFill = cat.fill;
    catScale = cat.s;
    catLW = 4.5 + (LW - 4.5) * (0.35 + 0.65 * (cat.s - 52) / 98);
    ctx.lineWidth = catLW / cat.s;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // tail from the rear, raised and curling
    ctx.beginPath();
    ctx.moveTo(-f * 0.80, -0.80);
    ctx.quadraticCurveTo(-f * (1.18 + wag * 0.4), -1.30,
                         -f * (0.92 + wag), -1.58 - Math.abs(wag) * 0.15);
    strokePath();
    // legs
    ctx.beginPath();
    var lx = [-0.55, -0.30, 0.35, 0.62], i;
    for (i = 0; i < 4; i++) {
      ctx.moveTo(lx[i], -0.40);
      ctx.lineTo(lx[i], -0.02);
      ctx.lineTo(lx[i] + 0.09, -0.02);
    }
    strokePath();
    // body
    ctx.beginPath();
    ctx.ellipse(0, -0.68, 0.88, 0.42, 0, 0, Math.PI * 2);
    ctx.fillStyle = cat.fill; ctx.fill(); strokePath();
    // head at the front
    var hx = f * 1.02, hy = -1.04;
    ears(hx, hy, 0.36);
    ctx.beginPath();
    ctx.arc(hx, hy, 0.36, 0, Math.PI * 2);
    ctx.fillStyle = cat.fill; ctx.fill(); strokePath();
    face(hx, hy, 0.36, closed);
  }

  // ---------------- other elements ----------------
  function drawCloud(cl, t) {
    var sway = Math.sin(t * 0.5 + cl.phase) * 6;
    var x = cl.x + sway, y = cl.y, w = cl.w;
    // three contiguous bumps sharing one baseline
    var r1 = w * 0.14, r2 = w * 0.21, r3 = w * 0.15;
    var c1 = x - w / 2 + r1, c2 = c1 + r1 + r2, c3 = c2 + r2 + r3;
    ctx.lineWidth = LW;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y);
    ctx.arc(c1, y, r1, Math.PI, 0);
    ctx.arc(c2, y, r2, Math.PI, 0);
    ctx.arc(c3, y, r3, Math.PI, 0);
    ctx.lineTo(x - w / 2, y);
    ctx.closePath();
    ctx.fillStyle = WALL; ctx.fill();
    ctx.strokeStyle = INK; ctx.stroke();
  }

  function drawYarn(yn, t) {
    ctx.lineWidth = LW;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // unraveling string: wanders away from the ball with a loose curl,
    // swaying gently
    var sway = Math.sin(t * 0.8 + yn.phase) * 12;
    var sx = yn.x + yn.dir * yn.r * 0.7, sy = yn.y + yn.r * 0.55;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(sx + yn.dir * yn.len * 0.45, sy + 26 + sway * 0.4,
                         sx + yn.dir * yn.len * 0.72, sy + 8 + sway);
    ctx.quadraticCurveTo(sx + yn.dir * yn.len * 0.95, sy - 14 + sway,
                         sx + yn.dir * yn.len, sy + 16 + sway * 0.6);
    ctx.strokeStyle = INK; ctx.stroke();
    // ball: circle with wrap arcs
    ctx.beginPath();
    ctx.arc(yn.x, yn.y, yn.r, 0, Math.PI * 2);
    ctx.fillStyle = WALL; ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.arc(yn.x, yn.y, yn.r * 0.98, -0.5, 1.15);
    ctx.moveTo(yn.x - yn.r * 0.75, yn.y - yn.r * 0.62);
    ctx.quadraticCurveTo(yn.x, yn.y - yn.r * 0.1, yn.x + yn.r * 0.78, yn.y - yn.r * 0.55);
    ctx.moveTo(yn.x - yn.r * 0.72, yn.y + yn.r * 0.60);
    ctx.quadraticCurveTo(yn.x, yn.y + yn.r * 0.05, yn.x + yn.r * 0.74, yn.y + yn.r * 0.58);
    ctx.stroke();
  }

  // ---------------- idle schedule ----------------
  // One seeded cat blinks or flicks its tail during each 5.5s window.
  var WINDOW = 5.5;
  function idleState(t) {
    var wi = Math.floor(t / WINDOW);
    var wphase = (t - wi * WINDOW) / WINDOW;
    var rng = mulberry32(wi * 131 + 17);
    var idx = Math.floor(rng() * scene.cats.length);
    var mode = rng() < 0.5 ? 'blink' : 'flick';
    return { idx: idx, mode: mode, wphase: wphase };
  }

  // ---------------- draw ----------------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);
    var scale = Math.min(W / DW, H / DH);
    var ox = (W - DW * scale) / 2, oy = (H - DH * scale) / 2;
    ctx.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * ox, DPR * oy);

    var i;
    for (i = 0; i < scene.clouds.length; i++) drawCloud(scene.clouds[i], t);
    for (i = 0; i < scene.yarns.length; i++) drawYarn(scene.yarns[i], t);

    var idle = idleState(t);
    var order = scene.cats.slice().sort(function (a, b) { return a.ay - b.ay; });
    var grabbedCat = null;
    for (i = 0; i < order.length; i++) if (order[i].grabbed) grabbedCat = order[i];
    for (i = 0; i < order.length; i++) {
      var cat = order[i];
      if (cat === grabbedCat) continue;
      drawCat(cat, t, idle);
    }
    if (grabbedCat) drawCat(grabbedCat, t, idle);

    // hint, screen space
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = 'rgba(17,17,17,0.35)';
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillText('drag', 14, H - 14);
  }

  function drawCat(cat, t, idle) {
    var ci = scene.cats.indexOf(cat);
    var flick = (idle.idx === ci && idle.mode === 'flick')
      ? Math.sin(idle.wphase * Math.PI) : 0;
    var closed = (idle.idx === ci && idle.mode === 'blink' && idle.wphase < 0.05);
    var wag = Math.sin(t * (1.4 + flick * 5) + cat.phase) * (0.05 + flick * 0.22)
              + cat.tailLag;
    ctx.save();
    ctx.translate(cat.x, cat.y);
    ctx.rotate(cat.rot);
    ctx.scale(cat.s, cat.s);
    if (cat.pose === 'sit') drawSit(cat, wag, closed);
    else drawStand(cat, wag, closed);
    ctx.restore();
  }

  // ---------------- physics ----------------
  function stepPhysics(dt, t) {
    var k = 90, c = 2 * Math.sqrt(k) * 0.42; // underdamped springs
    for (var i = 0; i < scene.cats.length; i++) {
      var cat = scene.cats[i];
      var gx = cat.grabbed ? dragX : cat.ax;
      var gy = cat.grabbed ? dragY : cat.ay;
      cat.vx += (k * (gx - cat.x) - c * cat.vx) * dt;
      cat.vy += (k * (gy - cat.y) - c * cat.vy) * dt;
      cat.x += cat.vx * dt;
      cat.y += cat.vy * dt;
      var targetRot = Math.max(-0.18, Math.min(0.18, cat.vx * 0.00035));
      cat.rv += (60 * (targetRot - cat.rot) - 9 * cat.rv) * dt;
      cat.rot += cat.rv * dt;
      var tailTarget = Math.max(-0.3, Math.min(0.3, -cat.vx * 0.0012));
      cat.tailLag += (tailTarget - cat.tailLag) * Math.min(1, dt * 5);
    }
  }

  // ---------------- interaction ----------------
  var dragging = null, dragX = 0, dragY = 0;
  var lastTapMs = -1000, lastTapX = 0, lastTapY = 0;
  var downMs = 0, downX = 0, downY = 0, moved = false;

  function toDesign(e) {
    var rect = canvas.getBoundingClientRect();
    var scale = Math.min(W / DW, H / DH);
    var ox = (W - DW * scale) / 2, oy = (H - DH * scale) / 2;
    return {
      x: (e.clientX - rect.left - ox) / scale,
      y: (e.clientY - rect.top - oy) / scale
    };
  }
  function nowMs() {
    return (typeof performance !== 'undefined' && performance.now)
      ? performance.now() : 0;
  }
  function onDown(e) {
    var p = toDesign(e), ms = nowMs();
    downMs = ms; downX = p.x; downY = p.y; moved = false;
    // double-tap: reseed the whole wall
    if (ms - lastTapMs < 350 &&
        Math.abs(p.x - lastTapX) < 60 && Math.abs(p.y - lastTapY) < 60) {
      reseed();
      lastTapMs = -1000;
      return;
    }
    lastTapMs = ms; lastTapX = p.x; lastTapY = p.y;
    // grab the nearest cat within reach (topmost last)
    var best = null, bestD = 1e12;
    for (var i = 0; i < scene.cats.length; i++) {
      var cat = scene.cats[i];
      var dx = cat.x - p.x, dy = (cat.y - cat.s * 0.9) - p.y;
      var d = dx * dx + dy * dy;
      var reach = cat.s * 1.6;
      if (d < reach * reach && d < bestD) { best = cat; bestD = d; }
    }
    if (best) {
      dragging = best; best.grabbed = true;
      dragX = p.x; dragY = p.y;
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var p = toDesign(e);
    dragX = p.x; dragY = p.y;
    if (Math.abs(p.x - downX) > 8 || Math.abs(p.y - downY) > 8) moved = true;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() {
    if (dragging) { dragging.grabbed = false; dragging = null; }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---------------- sizing + loop ----------------
  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    // House phone rule: physical screen size decides; aspect fallback.
    var sw = (window.screen && window.screen.width) ? window.screen.width : W;
    var sh = (window.screen && window.screen.height) ? window.screen.height : H;
    var isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE0);
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  resize();
  draw(PHASE0);

  if (typeof requestAnimationFrame === 'function') {
    var startMs = null, lastMs = null;
    var loop = function (now) {
      if (startMs === null) { startMs = now; lastMs = now; }
      var dt = Math.min(0.033, (now - lastMs) / 1000);
      lastMs = now;
      var t = PHASE0 + (now - startMs) / 1000;
      if (dt > 0) stepPhysics(dt, t);
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
