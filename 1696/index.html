<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rayhatch Field</title>
<style>
html, body { margin: 0; padding: 0; background: #F7F3E8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F7F3E8';
var INK = '#141414';
var INDIGO = '#2E3A8F';
var PLATE = '#EFE9D6';
var PLATE_LINE = 'rgba(20,20,20,0.45)';
var TITLE_INK = '#141414';
var HINT_INK = '#141414';
var FIRST_T = 30;
var BUDGET = 10844;
/* DRIVER: a morphing SDF creature drawn entirely as hatch strokes.
   The same field drives shading and stroke placement; strokes run
   along surface tangents, denser where the surface turns from light. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* Deterministic per-cell random in [0,1), pure function of cell index. */
function cellRand(i, salt) {
  var s = Math.sin(i * 12.9898 + salt * 78.233) * 43758.5453;
  return s - Math.floor(s);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* ---- SDF scene: blob + tube worm + pillow, all pure functions of t ---- */
var CX = 0, CY = 0, R = 0;
function sceneParams(t) {
  var breathe = 1 + 0.06 * Math.sin(t * 0.21);
  var twist = 0.35 * Math.sin(t * 0.11);
  return {
    blob: { x: CX - R * 0.28 + R * 0.10 * Math.sin(t * 0.13),
            y: CY - R * 0.10 + R * 0.08 * Math.cos(t * 0.17),
            r: R * 0.52 * breathe, wob: 0.10 * Math.sin(t * 0.19 + 1.3) },
    worm: { ax: CX - R * 0.85, ay: CY + R * 0.55,
            bx: CX - R * 0.10 + R * 0.22 * Math.sin(t * 0.15), by: CY + R * 0.05,
            cx: CX + R * 0.80, cy: CY - R * 0.35 + R * 0.18 * Math.cos(t * 0.12),
            r: R * 0.16 * (1 + 0.10 * Math.sin(t * 0.23 + 2.0)), twist: twist },
    pillow: { x: CX + R * 0.30, y: CY + R * 0.42, hw: R * 0.42, hh: R * 0.26,
              rot: 0.35 + 0.18 * Math.sin(t * 0.09), rr: R * 0.16 }
  };
}
function smin(a, b, k) {
  var h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1);
  return b * (1 - h) + a * h - k * h * (1 - h);
}
function blobD(x, y, b, t) {
  var dx = x - b.x, dy = y - b.y;
  var ang = Math.atan2(dy, dx);
  var rr = Math.sqrt(dx * dx + dy * dy);
  var wob = 1 + b.wob * Math.sin(3 * ang + t * 0.25) + 0.05 * Math.sin(5 * ang - t * 0.18);
  return rr / wob - b.r;
}
function wormPts(w) {
  var pts = [], i, u, mt, a, b, c;
  for (i = 0; i <= 16; i++) {
    u = i / 16; mt = 1 - u;
    a = mt * mt; b = 2 * mt * u; c = u * u;
    pts.push([a * w.ax + b * w.bx + c * w.cx, a * w.ay + b * w.by + c * w.cy]);
  }
  return pts;
}
function wormD(x, y, w, pts) {
  var best = 1e9, i, px, py, qx, qy, dx, dy, ex, ey, tt, ddx, ddy, dd;
  for (i = 0; i < pts.length - 1; i++) {
    px = pts[i][0]; py = pts[i][1];
    qx = pts[i + 1][0]; qy = pts[i + 1][1];
    ex = qx - px; ey = qy - py;
    dx = x - px; dy = y - py;
    tt = clamp((dx * ex + dy * ey) / (ex * ex + ey * ey + 1e-9), 0, 1);
    ddx = dx - ex * tt; ddy = dy - ey * tt;
    dd = Math.sqrt(ddx * ddx + ddy * ddy);
    if (dd < best) best = dd;
  }
  return best - w.r;
}
function pillowD(x, y, p) {
  var cs = Math.cos(-p.rot), sn = Math.sin(-p.rot);
  var dx = x - p.x, dy = y - p.y;
  var lx = dx * cs - dy * sn, ly = dx * sn + dy * cs;
  var qx = Math.abs(lx) - (p.hw - p.rr), qy = Math.abs(ly) - (p.hh - p.rr);
  var ox = Math.max(qx, 0), oy = Math.max(qy, 0);
  return Math.sqrt(ox * ox + oy * oy) + Math.min(Math.max(qx, qy), 0) - p.rr;
}
/* Dent state: pointer presses a thumb into the field. */
var dent = { x: 0, y: 0, depth: 0, target: 0, active: false, r: 0 };
function fieldD(x, y, sp, pts) {
  var d = blobD(x, y, sp.blob, lastT);
  d = smin(d, wormD(x, y, sp.worm, pts), R * 0.10);
  d = smin(d, pillowD(x, y, sp.pillow), R * 0.10);
  if (dent.depth > 0.001) {
    var dx = x - dent.x, dy = y - dent.y;
    var g = Math.exp(-(dx * dx + dy * dy) / (dent.r * dent.r));
    d -= dent.depth * R * 0.22 * g;
  }
  return d;
}
var lastT = FIRST_T;
var strokeCount = 0;
function drawField(t) {
  var minDim = Math.min(VW, VH);
  CX = VW / 2; CY = VH / 2;
  R = minDim * 0.35;
  var sp = sceneParams(t);
  var pts = wormPts(sp.worm);
  var cell = Math.max(4, minDim / 170);
  var half = R * 1.18;
  var x0 = CX - half, x1 = CX + half, y0 = CY - half, y1 = CY + half;
  var cols = Math.ceil((x1 - x0) / cell), rows = Math.ceil((y1 - y0) / cell);
  var lx = -0.45, ly = -0.89, ll = Math.sqrt(lx * lx + ly * ly);
  lx /= ll; ly /= ll;
  var eps = cell * 0.6;
  strokeCount = 0;
  ctx.lineCap = 'round';
  var j, i, idx = 0;
  for (j = 0; j < rows; j++) {
    for (i = 0; i < cols; i++, idx++) {
      var x = x0 + (i + 0.5) * cell;
      var y = y0 + (j + 0.5) * cell;
      var d = fieldD(x, y, sp, pts);
      if (d > cell * 0.9) continue;
      var gx = fieldD(x + eps, y, sp, pts) - d;
      var gy = fieldD(x, y + eps, sp, pts) - d;
      var gl = Math.sqrt(gx * gx + gy * gy);
      var nx = 0, ny = 1, shade = 0.5;
      if (gl > 1e-6) {
        nx = gx / gl; ny = gy / gl;
        shade = clamp(0.5 + 0.5 * (nx * lx + ny * ly), 0, 1);
      }
      /* Tangent direction: perpendicular to the gradient. */
      var tx = -ny, ty = nx;
      if (gl < 1e-6) {
        var ra = cellRand(idx, 7) * TAU;
        tx = Math.cos(ra); ty = Math.sin(ra);
      }
      var r1 = cellRand(idx, 1), r2 = cellRand(idx, 2), r3 = cellRand(idx, 3);
      var nearEdge = Math.abs(d) < cell * 0.6;
      var p = nearEdge ? 1 : clamp(0.65 + (1 - shade) * 0.8, 0, 1);
      var ox = (r2 - 0.5) * cell * 0.5, oy = (r3 - 0.5) * cell * 0.5;
      var deep = shade < 0.08;
      if (r1 < p) {
        var len = cell * (0.55 + 0.5 * (1 - shade));
        if (len > cell * 1.1) len = cell * 1.1;
        var hx = tx * len / 2, hy = ty * len / 2;
        /* Indigo only as a sparse accent inside the deepest shadow. */
        ctx.strokeStyle = (deep && cellRand(idx, 6) < 0.45) ? INDIGO : INK;
        ctx.globalAlpha = Number((deep ? 0.95 : 0.88).toFixed(4));
        ctx.lineWidth = Math.max(1, cell * 0.20);
        ctx.beginPath();
        ctx.moveTo(x + ox - hx, y + oy - hy);
        ctx.lineTo(x + ox + hx, y + oy + hy);
        ctx.stroke();
        strokeCount++;
      }
      /* Second pass in darker regions: a shorter offset stroke. */
      if (shade < 0.65 && d < -cell * 0.3) {
        var r4 = cellRand(idx, 4);
        if (r4 < 0.8) {
          var len2 = cell * 0.55;
          var hx2 = tx * len2 / 2, hy2 = ty * len2 / 2;
          var nxo = nx * cell * 0.32, nyo = ny * cell * 0.32;
          ctx.strokeStyle = (shade < 0.08 && cellRand(idx, 8) < 0.45) ? INDIGO : INK;
          ctx.globalAlpha = Number(0.85.toFixed(4));
          ctx.lineWidth = Math.max(1, cell * 0.18);
          ctx.beginPath();
          ctx.moveTo(x + ox + nxo - hx2, y + oy + nyo - hy2);
          ctx.lineTo(x + ox + nxo + hx2, y + oy + nyo + hy2);
          ctx.stroke();
          strokeCount++;
        }
      }
      /* Dent tightening: extra strokes crowded around the thumb. */
      if (dent.depth > 0.05) {
        var ddx = x - dent.x, ddy = y - dent.y;
        var dd = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dd < dent.r * 1.5 && d < cell * 0.5) {
          var r5 = cellRand(idx, 5);
          if (r5 < dent.depth * 0.85) {
            var len3 = cell * 0.5;
            var hx3 = tx * len3 / 2, hy3 = ty * len3 / 2;
            ctx.strokeStyle = INK;
            ctx.globalAlpha = Number(0.9.toFixed(4));
            ctx.lineWidth = Math.max(1, cell * 0.16);
            ctx.beginPath();
            ctx.moveTo(x - hx3, y - hy3);
            ctx.lineTo(x + hx3, y + hy3);
            ctx.stroke();
            strokeCount++;
          }
        }
      }
    }
  }
  ctx.globalAlpha = 1;
}
function drawCounter() {
  var s = 'STROKES ' + strokeCount + ' / ' + BUDGET;
  ctx.font = (isPhone ? 11 : 12) + 'px monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  var w = ctx.measureText(s).width;
  var px = VW - w - 26, py = VH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(px - 12, py - 20, w + 24, 26);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(px - 11.5, py - 19.5, w + 23, 25);
  ctx.fillStyle = TITLE_INK;
  ctx.fillText(s, VW - 26, py + 1);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Rayhatch Field').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Rayhatch Field').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 03').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Rayhatch Field', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 03', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to dimple the field.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 26;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  lastT = t;
  size();
  dent.r = Math.min(VW, VH) * 0.16;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  drawField(t);
  drawPlates();
  drawCounter();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    strokeCount: function () { return strokeCount; },
    budget: function () { return BUDGET; }
  };
}
/* ---- pointer: drag presses a thumb into the field ---- */
function pointerPos(e) {
  var r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
var dragging = false;
function press(e) {
  var p = pointerPos(e);
  dent.x = p.x; dent.y = p.y;
  dent.target = 1; dent.active = true; dragging = true;
  if (e.preventDefault) e.preventDefault();
}
function move(e) {
  if (!dragging) return;
  var p = pointerPos(e);
  dent.x = p.x; dent.y = p.y;
  if (e.preventDefault) e.preventDefault();
}
function release() { dent.target = 0; dragging = false; }
if (typeof window !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', press);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', release);
}
/* ---- frame one: t = 30, fixed phase; dent at rest ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null, lastDrawn = -1;
draw(FIRST_T);
lastDrawn = FIRST_T;
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    dent.depth += (dent.target - dent.depth) * Math.min(1, dt * 6);
    if (clockT - lastDrawn >= 0.08) {
      draw(clockT);
      lastDrawn = clockT;
    }
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
