<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marienbad Garden</title>
<style>
  html, body { margin: 0; padding: 0; background: #c9d4d2; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (prompt only, no other color).
  var SKY = '#c9d4d2', GRAVEL = '#d8cfc0', HEDGE = '#2f4636';
  var STONE = '#b8b2a4', DRESS = '#1c1c22', SKIN = '#f2ead8';

  var LOOP = 48; // seconds per full circuit
  var seeded = 1464000;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(seeded);

  // Per-statue fixed pose offsets (seeded constants, never advancing randomness).
  var statueOff = [];
  for (var i = 0; i < 4; i++) { statueOff.push(Math.floor(rnd() * 4)); }

  var W = 0, H = 0, phone = false;
  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var minDim = Math.min(sw, sh);
    if (minDim > 0 && minDim < 700) { return true; }
    return H > W * 1.15;
  }
  function resize() {
    var vw = W, vh = H;
    if (typeof window !== 'undefined' && window.visualViewport) {
      vw = window.visualViewport.width; vh = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      vw = window.innerWidth; vh = window.innerHeight;
    }
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    phone = isPhone();
    draw(lastT);
  }

  // Walk state: closed-form over recorded events, never frame-integrated.
  // u = unwrapped circuit count (1.0 = one full circuit).
  var anchorT = 0, anchorU = 0;
  var dragging = false, dragStartX = 0, dragStartU = 0, dragLastX = 0;
  var lastT = 0;
  var SCRUB = 1.2; // circuits per circuit-perimeter of horizontal drag

  function circuitRect() {
    var gx, gy, gw, gh;
    if (phone) { gx = 0; gy = 0; gw = W; gh = H; }
    else { gx = W * 0.05; gy = H * 0.10; gw = W * 0.90; gh = H * 0.80; }
    return { x: gx, y: gy, w: gw, h: gh };
  }
  function circuitPath(g) {
    var x0 = g.x + g.w * 0.14, y0 = g.y + g.h * 0.16;
    var x1 = g.x + g.w * 0.86, y1 = g.y + g.h * 0.84;
    return { x0: x0, y0: y0, x1: x1, y1: y1 };
  }
  function perimeter(c) {
    return 2 * ((c.x1 - c.x0) + (c.y1 - c.y0));
  }
  function currentU(t) {
    if (dragging) {
      var c = circuitPath(circuitRect());
      return dragStartU + (dragLastX - dragStartX) * SCRUB / perimeter(c);
    }
    return anchorU + (t - anchorT) / LOOP;
  }
  // Point on the rectangular circuit. s in [0,1): 0 = left-edge midpoint,
  // then up to the top-left corner, right along the top, down the right
  // edge, left along the bottom, up the left edge back to the start.
  function pointOnCircuit(c, s) {
    var w = c.x1 - c.x0, h = c.y1 - c.y0;
    var per = 2 * (w + h);
    var d = s * per;
    var halfL = h / 2;
    if (d < halfL) { return { x: c.x0, y: (c.y0 + c.y1) / 2 - d, dir: 'up' }; }
    d -= halfL;
    if (d < w) { return { x: c.x0 + d, y: c.y0, dir: 'right' }; }
    d -= w;
    if (d < h) { return { x: c.x1, y: c.y0 + d, dir: 'down' }; }
    d -= h;
    if (d < w) { return { x: c.x1 - d, y: c.y1, dir: 'left' }; }
    d -= w;
    return { x: c.x0, y: c.y1 - d, dir: 'up' };
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }
  function disc(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStatue(x, y, s, pose) {
    // Pedestal, body, head, one arm whose angle is the pose.
    var pedW = s * 0.55, pedH = s * 0.16;
    rect(x - pedW / 2, y - pedH, pedW, pedH, STONE);
    var bodyW = s * 0.34, bodyH = s * 0.62;
    rect(x - bodyW / 2, y - pedH - bodyH, bodyW, bodyH, STONE);
    disc(x, y - pedH - bodyH - s * 0.14, s * 0.14, STONE);
    // Arm: from the shoulder, angle 0 = hanging down, rising in 25-degree steps.
    var ang = pose * Math.PI / 180 * 25 - Math.PI / 2;
    var ax = x + bodyW / 2, ay = y - pedH - bodyH + s * 0.10;
    var len = s * 0.42;
    var ex = ax + Math.cos(ang) * len, ey = ay + Math.sin(ang) * len;
    ctx.strokeStyle = STONE;
    ctx.lineWidth = Math.max(2, s * 0.07);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ex, ey);
    ctx.stroke();
  }

  function drawFigure(x, y, s, walkPhase, dir) {
    // Small elegant figure: black dress, ivory head and hands, two-frame walk.
    var dressW = s * 0.52, dressH = s * 0.72;
    ctx.fillStyle = DRESS;
    ctx.beginPath();
    ctx.moveTo(x - dressW * 0.28, y - dressH);
    ctx.lineTo(x + dressW * 0.28, y - dressH);
    ctx.lineTo(x + dressW * 0.5, y);
    ctx.lineTo(x - dressW * 0.5, y);
    ctx.closePath();
    ctx.fill();
    disc(x, y - dressH - s * 0.16, s * 0.16, SKIN);
    // Legs: two-frame walk, alternating offset.
    var legOff = walkPhase === 0 ? s * 0.06 : -s * 0.06;
    rect(x - s * 0.20 + legOff, y, s * 0.10, s * 0.18, DRESS);
    rect(x + s * 0.10 - legOff, y, s * 0.10, s * 0.18, DRESS);
    // Arms hang at the sides.
    rect(x - dressW * 0.30, y - dressH + s * 0.10, s * 0.07, s * 0.30, DRESS);
    rect(x + dressW * 0.23, y - dressH + s * 0.10, s * 0.07, s * 0.30, DRESS);
    disc(x - dressW * 0.26, y - dressH + s * 0.42, s * 0.05, SKIN);
    disc(x + dressW * 0.27, y - dressH + s * 0.42, s * 0.05, SKIN);
  }

  function draw(t) {
    lastT = t;
    if (W === 0 || H === 0) { return; }
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var M = Math.min(W, H);
    var g = circuitRect();
    var c = circuitPath(g);

    // Sky, then the gravel garden.
    rect(0, 0, W, H, SKY);
    rect(g.x, g.y, g.w, g.h, GRAVEL);

    // Hedge parterre: one central mass split by gravel cross paths, so the
    // border path (the circuit) and the cross paths read as a grid.
    var hx0 = g.x + g.w * 0.28, hy0 = g.y + g.h * 0.28;
    var hx1 = g.x + g.w * 0.72, hy1 = g.y + g.h * 0.72;
    var cross = Math.min(g.w, g.h) * 0.07;
    var cxm = (hx0 + hx1) / 2, cym = (hy0 + hy1) / 2;
    rect(hx0, hy0, cxm - cross / 2 - hx0, cym - cross / 2 - hy0, HEDGE);
    rect(cxm + cross / 2, hy0, hx1 - (cxm + cross / 2), cym - cross / 2 - hy0, HEDGE);
    rect(hx0, cym + cross / 2, cxm - cross / 2 - hx0, hy1 - (cym + cross / 2), HEDGE);
    rect(cxm + cross / 2, cym + cross / 2, hx1 - (cxm + cross / 2), hy1 - (cym + cross / 2), HEDGE);
    // Corner hedge blocks outside the circuit corners.
    var cs = Math.min(g.w, g.h) * 0.075;
    rect(c.x0 - cs * 1.6, c.y0 - cs * 1.6, cs, cs, HEDGE);
    rect(c.x1 + cs * 0.6, c.y0 - cs * 1.6, cs, cs, HEDGE);
    rect(c.x0 - cs * 1.6, c.y1 + cs * 0.6, cs, cs, HEDGE);
    rect(c.x1 + cs * 0.6, c.y1 + cs * 0.6, cs, cs, HEDGE);

    // Statues at the four circuit corners, pose advanced one step per
    // completed circuit (plus each statue's fixed seeded offset).
    var u = currentU(t);
    var circuits = Math.floor(u);
    var ss = M * 0.11;
    var corners = [
      { x: c.x0, y: c.y0, dx: -1, dy: -1 },
      { x: c.x1, y: c.y0, dx: 1, dy: -1 },
      { x: c.x1, y: c.y1, dx: 1, dy: 1 },
      { x: c.x0, y: c.y1, dx: -1, dy: 1 }
    ];
    for (var i = 0; i < 4; i++) {
      var co = corners[i];
      var pose = (((circuits + statueOff[i]) % 4) + 4) % 4;
      drawStatue(co.x + co.dx * ss * 0.55, co.y + co.dy * ss * 0.55, ss, pose);
    }

    // The walking figure.
    var s = ((u % 1) + 1) % 1;
    var p = pointOnCircuit(c, s);
    var walked = u * perimeter(c);
    var walkPhase = Math.floor(walked / (M * 0.045)) % 2;
    if (walkPhase < 0) { walkPhase += 2; }
    drawFigure(p.x, p.y, M * 0.115, walkPhase, p.dir);
  }

  function pos(e) {
    if (e.clientX !== undefined) { return e.clientX; }
    if (e.touches && e.touches[0]) { return e.touches[0].clientX; }
    return 0;
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragStartX = pos(e);
    dragLastX = dragStartX;
    dragStartU = anchorU + (lastT - anchorT) / LOOP;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (dragging) { dragLastX = pos(e); }
  });
  function endDrag() {
    if (!dragging) { return; }
    dragging = false;
    var c = circuitPath(circuitRect());
    anchorU = dragStartU + (dragLastX - dragStartX) * SCRUB / perimeter(c);
    anchorT = lastT;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) {
      window.addEventListener('resize', resize);
    }
    window.__piece = {
      draw: draw,
      getU: function () { return currentU(lastT); },
      getCircuits: function () { return Math.floor(currentU(lastT)); }
    };
  }

  // Frame one is draw(0) at a constant phase; the clock starts with the loop.
  resize();
  draw(0);
  var started = false, startT = 0;
  function loop(ts) {
    if (!started) { started = true; startT = ts; }
    draw((ts - startT) / 1000);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
