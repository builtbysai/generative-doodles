<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9 · Shimmer</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2eee6; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(60,54,44,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(242,238,230,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another shimmer</div>
<script>
'use strict';
// No9 Shimmer.
// An op-art target that vibrates without moving: concentric rings,
// each drawn as dashes whose length and gap change with the ring
// index, alternating black and white rings against each other. The
// dash patterns of neighboring rings interfere (long dash over short
// gap, offset by half a dash each ring), and the interference is the
// shimmer. One ring, chosen in the middle band, is vermilion
// (brief concept 9, shimmer target).

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9', 10) || 9;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f2eee6';
const INK = '#17150f';
const VERM = '#b3402a';

function compose(s) {
  const rnd = mulberry32(s);
  const rings = 26 + ((rnd() * 8) | 0);          // 26..33
  const verm = Math.floor(rings * (0.35 + rnd() * 0.3));
  const phase0 = rnd() * Math.PI * 2;
  return { rings, verm, phase0 };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2;
  const R = S * 0.44;
  const ringW = R / p.rings;

  for (let i = p.rings - 1; i >= 0; i--) {
    const r = (i + 0.5) * ringW;
    // Dash length cycles with ring index, so neighboring rings carry
    // different patterns and their interference is what shimmers. Each
    // dash is its own subpath: a shared path would join the arcs with
    // straight spokes.
    const dashLen = ringW * (2.0 + (i % 3) * 1.15);
    const dashes = Math.max(6, Math.round((Math.PI * 2 * r) / dashLen));
    const period = (Math.PI * 2) / dashes;
    const dashFrac = (i % 2 === 0) ? 0.72 : 0.48;
    const off = p.phase0 + (i % 2) * period * 0.5;
    ctx.strokeStyle = i === p.verm ? VERM : INK;
    ctx.lineWidth = ringW * 0.92;
    ctx.beginPath();
    for (let d = 0; d < dashes; d++) {
      const a0 = off + d * period;
      const a1 = a0 + period * dashFrac;
      ctx.moveTo(cx + Math.cos(a0) * r, cy + Math.sin(a0) * r);
      ctx.arc(cx, cy, r, a0, a1);
    }
    ctx.stroke();
  }
  // Center dot.
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.arc(cx, cy, ringW * 0.42, 0, Math.PI * 2);
  ctx.fill();
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
