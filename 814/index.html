<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khiropractik</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #7A0A0A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// Khiropractik - EXPANSION #99 jacob-kassay, block 7.
// A translucent glass centipede resting on a low white plinth in a
// red-lit gallery room, inside a warm spotlight halo. Watch-only:
// the spine ripples with a traveling wave, the legs pulse after it,
// and once per 24 s loop the head lifts and settles. A slow
// anatomical study, not a monster.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mix(h1, h2, f) {
  var a = [parseInt(h1.slice(1, 3), 16), parseInt(h1.slice(3, 5), 16), parseInt(h1.slice(5, 7), 16)];
  var b = [parseInt(h2.slice(1, 3), 16), parseInt(h2.slice(3, 5), 16), parseInt(h2.slice(5, 7), 16)];
  return "rgb(" + Math.round(a[0] + (b[0] - a[0]) * f) + "," +
                  Math.round(a[1] + (b[1] - a[1]) * f) + "," +
                  Math.round(a[2] + (b[2] - a[2]) * f) + ")";
}

// Palette (strict). Shading tones are mixes of these only.
var ROOM = "#7A0A0A";    // deep red room
var HALO = "#FF6A2A";    // warm spotlight
var PLINTH = "#F5F5F5";  // white plinth
var GLASS = "#EAF2F5";   // glass body, used at low alpha
var AMBER = "#D8A03C";   // amber edge refraction

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  if (window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
  DPR = window.devicePixelRatio || 1;
  W = Math.round(w); H = Math.round(h);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", function () { resize(); draw(now()); });
window.addEventListener("resize", function () { resize(); draw(now()); });

var T0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
function now() { return (((typeof performance !== "undefined" && performance.now) ? performance.now() : 0) - T0) / 1000; }

// ---------- seeded precomputed layout ----------
// N articulated segments, tail (i=0) to head (i=N-1). Per-segment
// jitter (width, length, leg length) is fixed data from one stream;
// all placement and all motion are closed-form in t.
var NSEG = 26;
var rng = mulberry32(814001);
var segs = [];
for (var i = 0; i < NSEG; i++) {
  var u = i / (NSEG - 1); // 0 tail .. 1 head
  segs.push({
    u: u,
    wob: 0.92 + rng() * 0.16,                    // width jitter
    legLen: 0.9 + rng() * 0.25,                  // leg length jitter
    legPhase: (rng() * 2 - 1) * 0.22,            // small per-leg phase scatter
    // body radius profile: thin tail, full mid-body, slight taper to head
    rad: Math.sin(Math.PI * (0.10 + 0.80 * u)) * 0.82 + 0.30
  });
}
// Ceiling track-light spots: fixed positions/sizes.
var tracks = [];
for (var ti = 0; ti < 5; ti++) {
  tracks.push({ x: 0.16 + ti * 0.17 + (rng() * 2 - 1) * 0.02, y: 0.055 + rng() * 0.02, r: 0.016 + rng() * 0.008 });
}

// ---------- motion model (all closed-form in loop phase p, 0..1) ----------
// Loop is 24 s. Wave: a sine traveling tail->head, 2.2 wavelengths
// along the body, 3 full temporal cycles per loop (integer, so the
// loop closes). PHASE0 leaves frame one mid-ripple, never flat.
// Head lift: one raised-cosine bump per loop, centred at p = 0.60,
// half-width 0.10 (about 4.8 s up and down), periodic via circular
// distance. Legs pulse on the same wave, lagging the spine by 0.55 rad.
var LOOP = 24, WAVE_CYCLES = 3, WAVE_K = 2.2, PHASE0 = 0.9, LEG_LAG = 0.55;

function wavePhase(u, p) { return Math.PI * 2 * (WAVE_K * u - WAVE_CYCLES * p) + PHASE0; }
function headLift(p) {
  var d = Math.abs(p - 0.60); d = Math.min(d, 1 - d);
  if (d >= 0.10) return 0;
  var c = Math.cos(Math.PI * d / (2 * 0.10));
  return c * c;
}

function draw(t) {
  if (W === 0) resize();
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  var p = ((t % LOOP) + LOOP) % LOOP / LOOP;
  var isPhone = (window.screen && Math.min(window.screen.width, window.screen.height) < 700) || H > W * 1.15;

  // Room: deep red, with flat darker bands low (floor falloff).
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.16; ctx.fillStyle = mix(ROOM, "#000000", 0.55);
  ctx.fillRect(0, H * 0.86, W, H * 0.14);
  ctx.globalAlpha = 0.10;
  ctx.fillRect(0, H * 0.78, W, H * 0.08);
  ctx.globalAlpha = 1;

  // Ceiling track lights: faint warm discs and a whisper of beam.
  for (var ti = 0; ti < tracks.length; ti++) {
    var tr = tracks[ti];
    for (var tl = 2; tl >= 1; tl--) {
      ctx.globalAlpha = 0.035;
      ctx.fillStyle = HALO;
      ctx.beginPath();
      ctx.ellipse(tr.x * W, tr.y * H, tr.r * W * tl, tr.r * W * tl * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 0.16; ctx.fillStyle = GLASS;
    ctx.beginPath();
    ctx.ellipse(tr.x * W, tr.y * H, tr.r * W * 0.5, tr.r * W * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Plinth geometry: low, wide, centred. Top face around y = 0.66 H.
  var pw = W * (isPhone ? 0.86 : 0.58);
  var px = (W - pw) / 2;
  var pTop = H * 0.655;            // top face back edge
  var pDepth = pw * 0.055;         // top face depth (perspective)
  var pFront = pTop + pDepth;      // top face front edge
  var pBase = pFront + H * 0.115;  // plinth bottom
  var cx = W / 2, cyTop = (pTop + pFront) / 2;

  // Spotlight halo pooled on the plinth top, centred on the creature.
  for (var hl = 5; hl >= 1; hl--) {
    ctx.globalAlpha = 0.045;
    ctx.fillStyle = HALO;
    ctx.beginPath();
    ctx.ellipse(cx, cyTop + pDepth * 0.4, pw * 0.105 * hl, pw * 0.105 * hl * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Plinth: top face lit by the halo, front face shaded toward the room.
  ctx.fillStyle = mix(PLINTH, HALO, 0.10);
  ctx.beginPath();
  ctx.moveTo(px, pTop); ctx.lineTo(px + pw, pTop);
  ctx.lineTo(px + pw * 0.985, pFront); ctx.lineTo(px + pw * 0.015, pFront);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = mix(PLINTH, ROOM, 0.34);
  ctx.beginPath();
  ctx.moveTo(px + pw * 0.015, pFront); ctx.lineTo(px + pw * 0.985, pFront);
  ctx.lineTo(px + pw * 0.985, pBase); ctx.lineTo(px + pw * 0.015, pBase);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  // ---------- the centipede ----------
  // Spine: a gentle S across the plinth top. Screen y undulates with
  // the traveling wave; head end rises with the lift bump.
  var bodyLen = pw * 0.84;
  var x0 = cx - bodyLen / 2;
  var unit = Math.min(pw, H) / 100;       // scale helper
  var maxRad = unit * (isPhone ? 3.0 : 2.6);
  // Feet stand on the top face, a little back from its front edge;
  // the spine rides a leg's length above the surface, so most of the
  // body is silhouetted against the room and the halo, not lost on
  // the white plinth.
  var surfY = pTop + pDepth * 0.62;
  var baseY = surfY - maxRad * 2.05;
  var lift = headLift(p);
  var pts = [];
  for (var si = 0; si < NSEG; si++) {
    var sg = segs[si];
    var wp = wavePhase(sg.u, p);
    var liftF = Math.max(0, (sg.u - 0.78) / 0.22); // head fifth of the body
    liftF = liftF * liftF;
    pts.push({
      x: x0 + sg.u * bodyLen + Math.sin(wp) * unit * 0.55,
      y: baseY
         - Math.sin(sg.u * Math.PI) * unit * 1.1   // gentle resting arc
         + Math.sin(wp) * unit * 0.85              // the ripple
         - lift * liftF * unit * 6.5,              // head lift
      r: maxRad * sg.rad * sg.wob,
      wp: wp
    });
  }
  // Tangents.
  for (var sj = 0; sj < NSEG; sj++) {
    var a = pts[Math.max(0, sj - 1)], b = pts[Math.min(NSEG - 1, sj + 1)];
    pts[sj].ang = Math.atan2(b.y - a.y, b.x - a.x);
  }

  // Soft shadow pooled under the body, on the top face.
  for (var sh = 3; sh >= 1; sh--) {
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = mix(PLINTH, ROOM, 0.6);
    ctx.beginPath();
    ctx.ellipse(cx, surfY + unit * 0.5, bodyLen * 0.30 * sh / 2.2, unit * 1.6 * sh / 2.2, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  function legPair(pt, near) {
    // One leg: two-segment stroke from the body's lower side down to
    // a foot planted on the top face. The foot slides with the wave
    // (the pulse); far legs plant a touch higher (perspective).
    var slide = Math.sin(pt.wp - LEG_LAG + pt.legScatter) * unit * 1.3;
    var hipX = pt.x + Math.cos(pt.ang) * pt.r * 0.3;
    var hipY = pt.y + pt.r * 0.55;
    var footY = surfY - (near ? 0 : unit * 0.9);
    var footX = hipX + unit * 1.6 + slide;
    var kneeX = hipX + (footX - hipX) * 0.45 + unit * 0.5;
    var kneeY = hipY + (footY - hipY) * 0.42;
    ctx.lineCap = "round";
    ctx.strokeStyle = GLASS; ctx.globalAlpha = near ? 0.65 : 0.38;
    ctx.lineWidth = Math.max(1, pt.r * 0.17);
    ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kneeX, kneeY); ctx.lineTo(footX, footY); ctx.stroke();
    // Amber catch along the shin, the refraction glint.
    ctx.strokeStyle = AMBER; ctx.globalAlpha = near ? 0.65 : 0.38;
    ctx.lineWidth = Math.max(0.7, pt.r * 0.08);
    ctx.beginPath(); ctx.moveTo(kneeX, kneeY); ctx.lineTo(footX, footY); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (var li = 0; li < NSEG; li++) { pts[li].legLen = segs[li].legLen; pts[li].legScatter = segs[li].legPhase; }
  // Far legs first (behind the body), then near legs after it.
  for (var lf = NSEG - 1; lf >= 0; lf--) legPair(pts[lf], false);

  // Body outline: offset curves along the spine normals.
  function outline(off) {
    ctx.beginPath();
    for (var oi = 0; oi < NSEG; oi++) {
      var q = pts[oi], nx = -Math.sin(q.ang), ny = Math.cos(q.ang);
      var ox = q.x + nx * q.r * off, oy = q.y + ny * q.r * off;
      if (oi === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
    }
    for (var oj = NSEG - 1; oj >= 0; oj--) {
      var q2 = pts[oj], nx2 = -Math.sin(q2.ang), ny2 = Math.cos(q2.ang);
      ctx.lineTo(q2.x - nx2 * q2.r * off, q2.y - ny2 * q2.r * off);
    }
    ctx.closePath();
  }
  // Glass fill: low-alpha passes so overlaps read as thickness. A
  // faint room-red tint in the glass separates it from the white
  // plinth where the body crosses the top face.
  outline(1); ctx.globalAlpha = 0.14; ctx.fillStyle = GLASS; ctx.fill();
  outline(0.82); ctx.globalAlpha = 0.10; ctx.fillStyle = GLASS; ctx.fill();
  outline(0.9); ctx.globalAlpha = 0.10; ctx.fillStyle = mix(GLASS, ROOM, 0.22); ctx.fill();
  ctx.globalAlpha = 1;

  // Articulation: a short amber arc across the body at each joint.
  ctx.lineCap = "round";
  for (var ai = 1; ai < NSEG; ai++) {
    var qa = pts[ai], anx = -Math.sin(qa.ang), any = Math.cos(qa.ang);
    ctx.strokeStyle = AMBER; ctx.globalAlpha = 0.30;
    ctx.lineWidth = Math.max(0.7, qa.r * 0.09);
    ctx.beginPath();
    ctx.moveTo(qa.x + anx * qa.r * 0.92, qa.y + any * qa.r * 0.92);
    ctx.quadraticCurveTo(qa.x + Math.cos(qa.ang) * qa.r * 0.3, qa.y + Math.sin(qa.ang) * qa.r * 0.3,
                         qa.x - anx * qa.r * 0.92, qa.y - any * qa.r * 0.92);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Upper edge: amber refraction line along the lit side.
  ctx.strokeStyle = AMBER; ctx.globalAlpha = 0.60;
  ctx.lineWidth = Math.max(0.8, maxRad * 0.10);
  ctx.beginPath();
  for (var ei = 0; ei < NSEG; ei++) {
    var qe = pts[ei], enx = -Math.sin(qe.ang), eny = Math.cos(qe.ang);
    var ex = qe.x + enx * qe.r * 0.98, ey = qe.y + eny * qe.r * 0.98;
    if (ei === 0) ctx.moveTo(ex, ey); else ctx.lineTo(ex, ey);
  }
  ctx.stroke();
  // Lower edge: pale glass line.
  ctx.strokeStyle = GLASS; ctx.globalAlpha = 0.45;
  ctx.lineWidth = Math.max(0.8, maxRad * 0.09);
  ctx.beginPath();
  for (var di = 0; di < NSEG; di++) {
    var qd = pts[di], dnx = -Math.sin(qd.ang), dny = Math.cos(qd.ang);
    var dx2 = qd.x - dnx * qd.r * 0.98, dy2 = qd.y - dny * qd.r * 0.98;
    if (di === 0) ctx.moveTo(dx2, dy2); else ctx.lineTo(dx2, dy2);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Inner highlight: a bright thread along the upper third of the
  // body, offset from the spine - the glass sheen.
  ctx.strokeStyle = GLASS; ctx.globalAlpha = 0.55;
  ctx.lineWidth = Math.max(1, maxRad * 0.34);
  ctx.beginPath();
  for (var hi = 0; hi < NSEG; hi++) {
    var qh = pts[hi], hnx = -Math.sin(qh.ang), hny = Math.cos(qh.ang);
    var hx = qh.x + hnx * qh.r * 0.45, hy = qh.y + hny * qh.r * 0.45;
    if (hi === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Antennae: two tapering curves from the head, swaying with the
  // wave and rising with the lift.
  var head = pts[NSEG - 1];
  var sway = Math.sin(wavePhase(1, p) - 0.7) * unit * 1.4;
  for (var an = 0; an < 2; an++) {
    var sgn = an === 0 ? 1 : -1;
    var ax = head.x + Math.cos(head.ang) * head.r * 0.8;
    var ay = head.y + Math.sin(head.ang) * head.r * 0.8;
    var bx = ax + unit * (5.2 + an * 1.1);
    var by = ay - unit * (3.4 + an * 0.9) - lift * unit * 2.2 + sgn * unit * 0.7;
    var exx = bx + unit * 4.6, eyy = by + unit * 1.3 + sway * (0.4 + an * 0.3) + sgn * unit * 1.5;
    ctx.strokeStyle = GLASS; ctx.globalAlpha = 0.55;
    ctx.lineWidth = Math.max(0.8, maxRad * 0.09);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(bx, by, exx, eyy); ctx.stroke();
    ctx.strokeStyle = AMBER; ctx.globalAlpha = 0.5;
    ctx.lineWidth = Math.max(0.6, maxRad * 0.05);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(bx, by - unit * 0.3, exx, eyy - unit * 0.3); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Near legs, over the body's lower edge.
  for (var ln = 0; ln < NSEG; ln++) legPair(pts[ln], true);
}

resize();
draw(0);
if (typeof requestAnimationFrame !== "undefined") {
  var loop = function () { draw(now()); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
