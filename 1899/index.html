<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Fourth Higher</title>
<style>
html, body { margin: 0; padding: 0; background: #16233F; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* A Fourth Higher: a familiar coloratura run, drawn as a clean
   staircase of ascending notes. It plays once at its proper height.
   Then it tries the same staircase a fourth higher: the staircase
   stretches, wobbles, compresses itself against the top edge of the
   frame, and somehow lands every step, each landing flashing a
   small clown sticker. The run attempts on its own schedule, with
   slight variations each loop: higher entries, different entry
   points, the sticker placement moving. Watch only. Audio is
   omitted; the visual attempt carries the music. */
var TAU = Math.PI * 2;
var GROUND = '#16233F';   /* stage blue, dark */
var WHITE = '#F2F5FA';    /* cool white staircase */
var YELLOW = '#F7C948';   /* sticker yellow landing flashes */
var LAV = '#CDBBF0';      /* pale lavender entry trails */
var FRAME_T = 14.5;       /* fixed phase: mid higher attempt, staircase
                             pressed against the top edge, the fourth
                             step just landed with a fresh clown
                             sticker flashing */
var CYCLE = 24;           /* seconds per full loop of the attempt */
var STEPS = 8;            /* notes in the run, corners 0 to 7 */
var RUN_LEN = 8;          /* proper run, seconds */
var TRY_START = 10;       /* higher attempt begins */
var TRY_LEN = 10;         /* higher attempt, seconds */
var STEP_DUR = TRY_LEN / (STEPS - 1);   /* 10/7 s per step, attempt */
var FLASH_LEN = 1.4;      /* seconds a landing flash lasts */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* QA hook only: ?t=N sets the clock in seconds. No link in the
   piece uses it. */
try {
  var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
  var mt = qs.match(/[?&]t=([0-9.]+)/);
  if (mt) phaseT = parseFloat(mt[1]);
} catch (e) { /* keep defaults */ }
FRAME_T = phaseT;
/* ---- loop variation: each loop tries from a slightly different
   entry point, a slightly higher entry, and the stickers move ---- */
function loopVars(k) {
  var rng = mulberry32(1899000 + k);
  var i, stick = [];
  for (i = 0; i < STEPS; i++) {
    stick.push({ dx: (rng() * 2 - 1) * 0.018, dy: (rng() * 2 - 1) * 0.016,
                 rot: (rng() * 2 - 1) * 0.5 });
  }
  return {
    shiftX: (rng() * 2 - 1) * 0.035,
    shiftY: (rng() * 2 - 1) * 0.020,
    liftMax: 0.27 + rng() * 0.07,
    wobPhase: rng() * TAU,
    wobAmp: 0.014 + rng() * 0.012,
    stick: stick
  };
}
/* Proper-height corner i, as fractions of the rect. The staircase
   climbs from lower left to upper right. */
function properCorner(i, v) {
  return { x: 0.10 + i * 0.105 + v.shiftX,
           y: 0.88 - i * 0.075 + v.shiftY };
}
/* Corner i under stretch morph m (0 proper, 1 a fourth higher) at
   time t. The lift grows toward the top steps, the top steps squash
   against the top edge, and the whole staircase wobbles. */
function corner(i, v, m, t) {
  var p = properCorner(i, v);
  var f = i / (STEPS - 1);
  var lift = v.liftMax * Math.pow(f, 1.35);
  var yh = p.y - lift;
  var top = 0.075;
  if (yh < top) yh = top + (yh - top) * 0.22;
  var wob = m * v.wobAmp * f * Math.sin(TAU * 0.9 * t + v.wobPhase + i * 0.85);
  return { x: p.x + wob, y: p.y + (yh - p.y) * m };
}
/* Stretch morph over the cycle: 0 during the proper run, ramps up
   during the breath, 1 through the attempt, eases back to settle. */
function morph(tc) {
  if (tc < 9) return 0;
  if (tc < TRY_START) return smooth(tc - 9);
  if (tc < 20) return 1;
  if (tc < 22) return 1 - smooth((tc - 20) / 2);
  return 0;
}
/* Head position at cycle time tc, given loop variation v and morph
   m. Returns {x, y, moving} in rect fractions. */
function headPos(tc, v, m, tAbs) {
  var seg, frac, a, b;
  if (tc < RUN_LEN) {
    if (tc >= STEPS - 1) return { x: corner(STEPS - 1, v, m, tAbs).x,
                                  y: corner(STEPS - 1, v, m, tAbs).y, moving: false };
    seg = Math.floor(tc); frac = smooth(tc - seg);
    a = corner(seg, v, m, tAbs); b = corner(seg + 1, v, m, tAbs);
    return { x: lerp(a.x, b.x, frac), y: lerp(a.y, b.y, frac), moving: true };
  }
  if (tc < TRY_START) {
    var c = corner(STEPS - 1, v, m, tAbs);
    return { x: c.x, y: c.y, moving: false };
  }
  if (tc < TRY_START + TRY_LEN) {
    var tt = tc - TRY_START;
    if (tt >= (STEPS - 1) * STEP_DUR) {
      var c2 = corner(STEPS - 1, v, m, tAbs);
      return { x: c2.x, y: c2.y, moving: false };
    }
    seg = Math.floor(tt / STEP_DUR); frac = smooth((tt - seg * STEP_DUR) / STEP_DUR);
    a = corner(seg, v, m, tAbs); b = corner(seg + 1, v, m, tAbs);
    return { x: lerp(a.x, b.x, frac), y: lerp(a.y, b.y, frac), moving: true };
  }
  var c3 = corner(STEPS - 1, v, m, tAbs);
  return { x: c3.x, y: c3.y, moving: false };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on
   desktop. Returns {ox, oy, s, w, h}. */
function pieceRect() {
  if (isPhone) return { ox: 0, oy: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { ox: (VW - s) / 2, oy: (VH - s) / 2, s: s, w: s, h: s };
}
function drawStaircase(R, v, m, tAbs, alpha, lw) {
  ctx.strokeStyle = rgba(WHITE, alpha);
  ctx.lineWidth = lw;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  var i, c;
  ctx.beginPath();
  c = corner(0, v, m, tAbs);
  ctx.moveTo(R.ox + c.x * R.w, R.oy + c.y * R.h);
  for (i = 0; i < STEPS - 1; i++) {
    var a = corner(i, v, m, tAbs), b = corner(i + 1, v, m, tAbs);
    ctx.lineTo(R.ox + b.x * R.w, R.oy + a.y * R.h);
    ctx.lineTo(R.ox + b.x * R.w, R.oy + b.y * R.h);
  }
  ctx.stroke();
  /* note dots on every corner */
  for (i = 0; i < STEPS; i++) {
    c = corner(i, v, m, tAbs);
    ctx.fillStyle = rgba(WHITE, alpha);
    ctx.beginPath();
    ctx.moveTo(R.ox + c.x * R.w + Math.max(1.5, R.s * 0.006), R.oy + c.y * R.h);
    ctx.arc(R.ox + c.x * R.w, R.oy + c.y * R.h, Math.max(1.5, R.s * 0.006), 0, TAU);
    ctx.fill();
  }
}
/* A small clown sticker, drawn as simple vector shapes: yellow
   backing, white face, lavender hair tufts and hat, yellow nose,
   stage blue eyes and smile. No emoji, no text. */
function drawClown(R, x, y, r, rot, alpha) {
  ctx.save();
  ctx.translate(R.ox + x * R.w, R.oy + y * R.h);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  /* sticker backing */
  ctx.fillStyle = YELLOW;
  ctx.beginPath();
  ctx.moveTo(r * 1.28, 0);
  ctx.arc(0, 0, r * 1.28, 0, TAU);
  ctx.fill();
  /* hair tufts */
  ctx.fillStyle = LAV;
  var tufts = [[-0.95, -0.55], [0, -1.05], [0.95, -0.55]];
  var i, tp;
  for (i = 0; i < tufts.length; i++) {
    tp = tufts[i];
    ctx.beginPath();
    ctx.moveTo(tp[0] * r + r * 0.30, tp[1] * r);
    ctx.arc(tp[0] * r, tp[1] * r, r * 0.30, 0, TAU);
    ctx.fill();
  }
  /* hat */
  ctx.fillStyle = LAV;
  ctx.beginPath();
  ctx.moveTo(-r * 0.42, -r * 0.78);
  ctx.lineTo(r * 0.42, -r * 0.78);
  ctx.lineTo(0, -r * 1.45);
  ctx.closePath();
  ctx.fill();
  /* face */
  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.arc(0, 0, r, 0, TAU);
  ctx.fill();
  /* eyes */
  ctx.fillStyle = GROUND;
  var eyes = [[-0.36, -0.18], [0.36, -0.18]];
  for (i = 0; i < eyes.length; i++) {
    ctx.beginPath();
    ctx.moveTo(eyes[i][0] * r + r * 0.09, eyes[i][1] * r);
    ctx.arc(eyes[i][0] * r, eyes[i][1] * r, r * 0.09, 0, TAU);
    ctx.fill();
  }
  /* nose */
  ctx.fillStyle = YELLOW;
  ctx.beginPath();
  ctx.moveTo(r * 0.24, r * 0.12);
  ctx.arc(0, r * 0.12, r * 0.24, 0, TAU);
  ctx.fill();
  /* smile */
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = Math.max(1, r * 0.09);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(r * 0.40, r * 0.50);
  ctx.arc(0, r * 0.30, r * 0.45, Math.PI * 0.15, Math.PI * 0.85);
  ctx.stroke();
  ctx.restore();
}
function drawPlates(R) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('A Fourth Higher').width > R.w - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('A Fourth Higher').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 25').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = R.ox + 12, plateY = R.oy + 12;
  ctx.fillStyle = GROUND;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(LAV, 0.5);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = WHITE;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('A Fourth Higher', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2007 · 03 · 25', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the run try it a fourth higher.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = R.ox + 12;
  var hintPlateY = R.oy + R.h - hintPlateH - 12;
  ctx.fillStyle = GROUND;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(LAV, 0.5);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = WHITE;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var R = pieceRect();
  var S = R.s;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var t = phaseT;
  var k = Math.floor(t / CYCLE);
  var tc = t - k * CYCLE;
  var v = loopVars(k);
  var m = morph(tc);
  var i;
  /* faint staff lines, the stage the run is sung on */
  ctx.strokeStyle = rgba(LAV, 0.10);
  ctx.lineWidth = 1;
  for (i = 0; i < 5; i++) {
    var ly = R.oy + (0.30 + i * 0.12) * R.h;
    ctx.beginPath();
    ctx.moveTo(R.ox + R.w * 0.05, ly);
    ctx.lineTo(R.ox + R.w * 0.95, ly);
    ctx.stroke();
  }
  /* the top edge, the constraint the piece pushes against */
  if (m > 0.02) {
    ctx.strokeStyle = rgba(WHITE, 0.45 * m);
    ctx.lineWidth = Math.max(1.5, S * 0.002);
    ctx.beginPath();
    ctx.moveTo(R.ox + R.w * 0.04, R.oy + 2);
    ctx.lineTo(R.ox + R.w * 0.96, R.oy + 2);
    ctx.stroke();
  }
  /* ghost of the proper-height staircase, for comparison, while
     the attempt is stretched above it */
  if (m > 0.02) drawStaircase(R, v, 0, t, 0.16, Math.max(1.5, S * 0.003));
  /* the active staircase */
  drawStaircase(R, v, m, t, 0.95, Math.max(2, S * 0.005));
  /* entry trail: pale lavender samples of the head path just run */
  var hp = headPos(tc, v, m, t);
  if (hp.moving && tc > 0.6) {
    ctx.lineCap = 'round';
    var prev = null;
    for (i = 0; i <= 14; i++) {
      var tt = tc - i * 0.07;
      if (tt <= 0) break;
      var sp = headPos(tt, v, m, t - i * 0.07);
      var px = R.ox + sp.x * R.w, py = R.oy + sp.y * R.h;
      if (prev) {
        ctx.strokeStyle = rgba(LAV, 0.55 * (1 - i / 15));
        ctx.lineWidth = Math.max(1, S * 0.0035 * (1 - i / 18));
        ctx.beginPath();
        ctx.moveTo(prev[0], prev[1]);
        ctx.lineTo(px, py);
        ctx.stroke();
      }
      prev = [px, py];
    }
  }
  /* landing events: proper run lands at 1..7 s, attempt lands at
     10 + (i+1) * STEP_DUR. Each landing flashes yellow; attempt
     landings also stick a small clown sticker on the step. */
  var events = [];
  for (i = 1; i < STEPS; i++) events.push({ tau: i, cornerIdx: i, attempt: false });
  for (i = 1; i < STEPS; i++) events.push({ tau: TRY_START + i * STEP_DUR, cornerIdx: i, attempt: true });
  for (i = 0; i < events.length; i++) {
    var ev = events[i];
    var age = tc - ev.tau;
    if (age < 0 || age >= FLASH_LEN) continue;
    var frac = age / FLASH_LEN;
    var ec = corner(ev.cornerIdx, v, ev.attempt ? 1 : 0, t);
    var ex = R.ox + ec.x * R.w, ey = R.oy + ec.y * R.h;
    /* expanding yellow ring */
    var rr = (0.012 + frac * 0.045) * S;
    ctx.strokeStyle = rgba(YELLOW, (1 - frac) * 0.9);
    ctx.lineWidth = Math.max(1.5, S * 0.003 * (1 - frac * 0.5));
    ctx.beginPath();
    ctx.moveTo(ex + rr, ey);
    ctx.arc(ex, ey, Math.max(0.5, rr), 0, TAU);
    ctx.stroke();
    if (ev.attempt) {
      /* starburst rays */
      ctx.strokeStyle = rgba(YELLOW, (1 - frac) * 0.85);
      ctx.lineWidth = Math.max(1, S * 0.002);
      var ray;
      for (ray = 0; ray < 8; ray++) {
        var ra = ray * TAU / 8 + 0.4;
        var r0 = 0.016 * S, r1 = (0.016 + 0.022 * (1 - frac)) * S;
        ctx.beginPath();
        ctx.moveTo(ex + Math.cos(ra) * r0, ey + Math.sin(ra) * r0);
        ctx.lineTo(ex + Math.cos(ra) * r1, ey + Math.sin(ra) * r1);
        ctx.stroke();
      }
      /* clown sticker, popping in and fading with the flash */
      var st = v.stick[ev.cornerIdx];
      var pop = 1 + 0.55 * Math.exp(-age * 5);
      var salpha = age < 0.9 ? 1 : 1 - (age - 0.9) / 0.5;
      drawClown(R, ec.x + st.dx - 0.012, ec.y + st.dy - 0.040, 0.030 * S * pop, st.rot, clamp(salpha, 0, 1));
    }
  }
  /* the travelling note head */
  var hr = Math.max(3, S * 0.013);
  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.moveTo(R.ox + hp.x * R.w + hr, R.oy + hp.y * R.h);
  ctx.arc(R.ox + hp.x * R.w, R.oy + hp.y * R.h, hr, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(YELLOW, 0.9);
  ctx.lineWidth = Math.max(1, S * 0.0018);
  ctx.beginPath();
  ctx.moveTo(R.ox + hp.x * R.w + hr * 1.5, R.oy + hp.y * R.h);
  ctx.arc(R.ox + hp.x * R.w, R.oy + hp.y * R.h, hr * 1.5, 0, TAU);
  ctx.stroke();
  drawPlates(R);
}
/* ---- frame one: fixed phase t = 14.5 s, loop 0, mid higher
   attempt, staircase pressed against the top edge, the fourth step
   just landed with a fresh clown sticker flashing ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
