<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1926 Climates for the Ear</title>
<style>
  html, body { margin: 0; padding: 0; background: #070b14; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/lauren-kinsella.md does not exist in the repo, so these
  // hex values are chosen from the prompt's own color names.
  var BG = '#070b14';        // near-black blue field, page ground too
  var SMOKE = '#cfd4d6';     // word-breath, pale smoke
  var AMBER = '#c9a35f';     // sax-moths, dusty amber
  var AMBER_LT = '#e2c98d';  // sax-moth glow, lighter amber
  var BROWN = '#4a3220';     // the drone, deep organ brown
  var BROWN_LT = '#6b4a2e';  // drone haze, lighter organ brown
  var TEAL = '#5fa8a0';      // climate wash, iridescent teal
  var VIOLET = '#8d7fc0';    // climate wash, iridescent violet
  var ROSE = '#c08a9a';      // climate wash, iridescent rose
  var INK_SOFT = '#7e8a99';  // date line, hint and labels, muted blue grey

  // Fixed-phase first frame: t = 60 s. By then the three emissions have
  // been running long enough that every climate pocket is formed: the
  // voice climate hangs upper center, the sax climate lower right, the
  // piano climate lower left, and a small central pocket where all three
  // overlap. Words are mid-flight, several sheltered inside climates.
  // Frame one is byte-reproducible: every particle, word and wash is a
  // pure function of t and the seeded PRNG.
  var FIRST_T = 60;

  // Seeded PRNG, mulberry32. A fresh instance is built per draw from the
  // piece number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Short original words carried by the Voice. No real lyrics.
  var WORDS = ['low', 'air', 'hush', 'slow', 'blue', 'held', 'thin', 'warm', 'drift', 'soft', 'near', 'still'];

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The three emitters sit at triangle points in the field.
  function emitters() {
    return {
      voice: { x: W * 0.24, y: H * 0.30 },
      sax: { x: W * 0.76, y: H * 0.30 },
      piano: { x: W * 0.50, y: H * 0.78 }
    };
  }

  // The slow current: a gentle field-wide drift, different in x and y,
  // on incommensurate frequencies so nothing ever repeats in lockstep.
  function current(t) {
    return {
      x: Math.sin(t * 0.021 + 0.8) * 0.006 + Math.sin(t * 0.047 + 2.1) * 0.003,
      y: Math.sin(t * 0.017 + 2.9) * 0.004 + Math.sin(t * 0.053 + 0.4) * 0.002
    };
  }

  // Climate pockets: one at each pair overlap, plus a small central one
  // where all three emissions meet. Each center drifts on its own slow
  // sines and its radius breathes slowly, so pockets merge and dissipate
  // on the current instead of pulsing together.
  function climates(t) {
    var e = emitters();
    var defs = [
      { bx: (e.voice.x + e.sax.x) / 2, by: (e.voice.y + e.sax.y) / 2 - H * 0.02,
        ax: 0.030, ay: 0.020, wx: 0.019, wy: 0.031, px: 0.7, py: 2.2,
        r: 0.140, rw: 0.011, wr: 0.013, pr: 1.9, colors: [TEAL, VIOLET] },
      { bx: (e.voice.x + e.piano.x) / 2, by: (e.voice.y + e.piano.y) / 2,
        ax: 0.024, ay: 0.026, wx: 0.027, wy: 0.017, px: 3.1, py: 0.5,
        r: 0.128, rw: 0.013, wr: 0.021, pr: 4.4, colors: [VIOLET, ROSE] },
      { bx: (e.sax.x + e.piano.x) / 2, by: (e.sax.y + e.piano.y) / 2,
        ax: 0.028, ay: 0.022, wx: 0.023, wy: 0.029, px: 5.0, py: 3.6,
        r: 0.132, rw: 0.010, wr: 0.017, pr: 2.7, colors: [ROSE, TEAL] },
      { bx: W * 0.50, by: H * 0.47,
        ax: 0.018, ay: 0.016, wx: 0.015, wy: 0.023, px: 1.4, py: 4.9,
        r: 0.095, rw: 0.012, wr: 0.019, pr: 0.3, colors: [TEAL, ROSE] }
    ];
    var out = [];
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      out.push({
        x: d.bx + Math.sin(t * d.wx + d.px) * W * d.ax,
        y: d.by + Math.sin(t * d.wy + d.py) * H * d.ay,
        r: W * (d.r + Math.sin(t * d.wr + d.pr) * d.rw),
        colors: d.colors
      });
    }
    return out;
  }

  // Density at a point: the strongest climate pocket covering it, 0 to 1.
  function densityAt(x, y, cl) {
    var best = 0;
    for (var i = 0; i < cl.length; i++) {
      var dx = (x - cl[i].x) / cl[i].r, dy = (y - cl[i].y) / cl[i].r;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < 1) { best = Math.max(best, 1 - d); }
    }
    return best;
  }

  // Climate washes: soft radial gradients, two hues per pocket layered so
  // the color shifts across the pocket. Drawn additively at low alpha.
  function drawClimates(t, cl) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < cl.length; i++) {
      var c = cl[i];
      for (var k = 0; k < 2; k++) {
        var g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
        g.addColorStop(0, hexA(c.colors[k], a4(k === 0 ? 0.16 : 0.11)));
        g.addColorStop(0.6, hexA(c.colors[k], a4(k === 0 ? 0.06 : 0.05)));
        g.addColorStop(1, hexA(c.colors[k], 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(c.x + c.r, c.y);
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
      }
      // A faint rim so the pocket reads as a volume of air, not a stain.
      ctx.strokeStyle = hexA(c.colors[0], 0.05);
      ctx.lineWidth = Math.max(1, H * 0.0012);
      ctx.beginPath();
      ctx.moveTo(c.x + c.r * 0.92, c.y);
      ctx.arc(c.x, c.y, c.r * 0.92, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // The drone: deep organ brown haze that sits like weather around the
  // piano emitter, wide slow bands plus a few rising wisps. It never
  // pulses; each band undulates on its own slow frequency.
  function drawDrone(t, e) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var bands = 4;
    for (var i = 0; i < bands; i++) {
      var ph = i * 1.7 + 0.6;
      var by = e.piano.y - H * 0.08 + i * H * 0.05
        + Math.sin(t * 0.019 + ph) * H * 0.012;
      var bw = W * (0.25 + 0.05 * Math.sin(t * 0.013 + ph * 2.0));
      var g = ctx.createRadialGradient(e.piano.x, by, 0, e.piano.x, by, bw);
      g.addColorStop(0, hexA(BROWN_LT, 0.11));
      g.addColorStop(0.7, hexA(BROWN, 0.07));
      g.addColorStop(1, hexA(BROWN, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(e.piano.x + bw, by);
      ctx.arc(e.piano.x, by, bw, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Sax moths: dusty amber specks that flutter away from the sax emitter
  // on two incommensurate sines, each on its own phase, so the swarm
  // never moves as one. A few carry a faint wing tick.
  function drawMoths(t, e, rng) {
    var n = 34;
    var cur = current(t);
    for (var i = 0; i < n; i++) {
      var ph = rng() * Math.PI * 2;
      var ph2 = rng() * Math.PI * 2;
      var spread = 0.05 + rng() * 0.20;
      var ang = rng() * Math.PI * 2;
      var drift = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.011 + ph)));
      var x = e.sax.x + Math.cos(ang) * W * spread * drift
        + Math.sin(t * 0.31 + ph) * W * 0.008
        + cur.x * W * 0.6 * drift;
      var y = e.sax.y + Math.sin(ang) * H * spread * drift * 0.8
        + Math.sin(t * 0.43 + ph2) * H * 0.010
        + cur.y * H * 0.6 * drift;
      var r = Math.max(1.2, H * 0.0032 * (0.7 + rng() * 0.8));
      var fade = 0.45 + 0.45 * Math.sin(t * 0.07 + ph * 3.0);
      ctx.fillStyle = hexA(AMBER, a4(0.85 * fade));
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      if (rng() < 0.3) {
        var w = r * 2.4;
        ctx.strokeStyle = hexA(AMBER_LT, a4(0.5 * fade));
        ctx.lineWidth = Math.max(0.8, H * 0.0009);
        ctx.beginPath();
        ctx.moveTo(x - w, y - r * 0.6);
        ctx.lineTo(x + w, y + r * 0.6);
        ctx.stroke();
      }
    }
  }

  // Word-breath: pale smoke puffs the Voice exhales, expanding and
  // thinning as they drift toward the center on the current.
  function drawBreath(t, e, rng) {
    var n = 30;
    var cur = current(t);
    for (var i = 0; i < n; i++) {
      var period = 18 + rng() * 14;
      var age = (t + rng() * period) % period;
      var u = age / period;
      var ang = rng() * Math.PI * 2;
      var dist = W * (0.03 + u * 0.30);
      var x = e.voice.x + Math.cos(ang) * dist * 0.8 + cur.x * W * u * 2.0;
      var y = e.voice.y + Math.sin(ang) * dist * 0.55 - u * H * 0.05 + cur.y * H * u * 2.0;
      var r = Math.max(2, H * (0.006 + u * 0.030));
      var a = 0.20 * (1 - u) * (0.5 + 0.5 * Math.sin(t * 0.05 + ang));
      if (a < 0.01) { continue; }
      ctx.fillStyle = hexA(SMOKE, a4(a));
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Words: text sprites the Voice emits. Each word lives on its own
  // cycle; it drifts from the Voice toward the center on the current,
  // and its breath decays slowly. Inside a climate pocket the decay
  // runs at a third of the open-air rate, so words survive longest
  // inside their own climate.
  function drawWords(t, e, cl, rng) {
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    var fs = Math.round(clamp(W / 34, 13, 24));
    ctx.font = 'italic ' + fs + 'px Georgia, "Times New Roman", serif';
    var cur = current(t);
    for (var i = 0; i < WORDS.length; i++) {
      var period = 30 + rng() * 18;
      // Ages are staggered evenly across the cycle, so the words are
      // spread along their whole flight path instead of bunching young
      // at the emitter.
      var offset = (i / WORDS.length) * period;
      var age = (t + offset) % period;
      var u = age / period;
      // Each word fans out on its own bearing across a wide arc, so the
      // words spread across the field instead of stacking at the emitter.
      var ang = -1.05 + (i / (WORDS.length - 1)) * 2.1 + (rng() - 0.5) * 0.3;
      var dist = W * (0.10 + u * 0.32);
      // On tall phone fields the words would bunch in one horizontal
      // band, so the vertical component of the fan is widened there.
      var vSpread = isPhone ? 1.6 : 1.0;
      var x = e.voice.x + Math.cos(ang) * dist + cur.x * W * u * 2.4
        + Math.sin(t * 0.09 + i * 2.3) * W * 0.012;
      var y = e.voice.y + Math.sin(ang) * dist * 0.7 * vSpread + u * H * 0.06
        + cur.y * H * u * 2.4 + Math.sin(t * 0.13 + i * 1.1) * H * 0.008;
      // Decay: fade in over the first tenth, then thin out. Sheltered
      // words (inside a climate) decay at a third of the open-air rate.
      var d = densityAt(x, y, cl);
      var rate = 1 - 0.67 * d;
      var life = clamp(1 - (u - 0.1) / 0.9 * rate * 1.35, 0, 1);
      var a = clamp(u / 0.1, 0, 1) * life;
      if (a < 0.03) { continue; }
      var tw = ctx.measureText(WORDS[i]).width;
      if (x - tw / 2 < 6) { x = 6 + tw / 2; }
      if (x + tw / 2 > W - 6) { x = W - 6 - tw / 2; }
      if (y < 60) { y = 60; }
      if (y > H - 44) { y = H - 44; }
      ctx.fillStyle = hexA(SMOKE, a4(0.92 * a));
      ctx.fillText(WORDS[i], x, y);
    }
  }

  // The three emitters: small quiet marks with a lowercase label, so the
  // trio is legible without any one of them dominating the field.
  function drawEmitters(e) {
    var marks = [
      { p: e.voice, label: 'voice', color: SMOKE },
      { p: e.sax, label: 'sax', color: AMBER },
      { p: e.piano, label: 'piano', color: BROWN_LT }
    ];
    for (var i = 0; i < marks.length; i++) {
      var m = marks[i];
      var r = Math.max(3, H * 0.005);
      ctx.fillStyle = hexA(m.color, 0.9);
      ctx.beginPath(); ctx.moveTo(m.p.x + r, m.p.y); ctx.arc(m.p.x, m.p.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = hexA(m.color, 0.45);
      ctx.lineWidth = Math.max(1, H * 0.0012);
      ctx.beginPath(); ctx.moveTo(m.p.x + r * 3, m.p.y); ctx.arc(m.p.x, m.p.y, r * 3, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = hexA(INK_SOFT, 0.85);
      ctx.font = Math.round(clamp(W / 52, 10, 15)) + 'px Georgia, "Times New Roman", serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      if (m.label === 'voice') {
        // Words fan out to the right of the voice emitter, so its label
        // sits above the mark where the breath never reaches.
        ctx.fillText(m.label, m.p.x - r * 2, m.p.y - r * 3 - 6);
      } else {
        ctx.fillText(m.label, m.p.x + r * 3 + 6, m.p.y + 4);
      }
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Near-black blue ground.
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var e = emitters();
    var cl = climates(t);

    // One fresh seeded PRNG per draw keeps every frame reproducible.
    var rng = mulberry32(1926);
    drawDrone(t, e);
    drawClimates(t, cl);
    drawBreath(t, e, rng);
    drawMoths(t, e, rng);
    drawWords(t, e, cl, rng);
    drawEmitters(e);

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = SMOKE;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Climates for the Ear', 18, 34);
    ctx.fillStyle = INK_SOFT;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1926 · 2007 · 04 · 21', 18, 34 + fs2 + 8);

    // Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK_SOFT, 0.9);
    ctx.textAlign = 'center';
    var hint = 'Watch the weather form.';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(hint, W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - t0) / 1000;
    }
    return 0;
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T + elapsed()); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T + elapsed()); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no interaction, no click-to-reload, no audio, no drum or
  // pulse layer. All motion runs under 1 Hz, well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      draw(FIRST_T + (now - start) / 1000);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
