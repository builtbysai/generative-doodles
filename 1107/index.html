<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Strata</title>
<style>
  html, body { margin: 0; padding: 0; background: #F2EFE8; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- helpers ----------
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  var TAU = Math.PI * 2;

  // ---------- palette ----------
  var PAPER = '#F2EFE8';
  var ICE = '#DCE8EC';
  var SHIMMER = '#B8C4C8';
  var INK = '#1A1C20';

  // ---------- minerals: name, the innovation it stands for, band color, pick weight ----------
  var MINERALS = [
    { name: 'Gold',      innov: 'camera contacts',      col: '#C9962E', w: 2 },
    { name: 'Lithium',   innov: 'battery anode',        col: '#E8E4DA', w: 3 },
    { name: 'Cobalt',    innov: 'battery cathode',      col: '#2E4D7B', w: 3 },
    { name: 'Silicon',   innov: 'computation',          col: '#8A93A0', w: 3 },
    { name: 'Neodymium', innov: 'magnets and speakers', col: '#5C6B52', w: 2 },
    { name: 'Aluminium', innov: 'casing',               col: '#C4CBD1', w: 3 },
    { name: 'Copper',    innov: 'wiring',               col: '#A8642F', w: 2 },
    { name: 'Carbon',    innov: 'composites',           col: '#3A3D42', w: 2 }
  ];
  var WTOT = 0, mi;
  for (mi = 0; mi < MINERALS.length; mi++) WTOT += MINERALS[mi].w;
  function pickMineral(r, avoid) {
    var x = r() * WTOT, k = 0;
    while (x > MINERALS[k].w) { x -= MINERALS[k].w; k++; }
    if (k === avoid) k = (k + 1) % MINERALS.length;
    return k;
  }

  // ---------- layer sequence: one seeded period of NL layers, total thickness T_SEQ ----------
  var NL = 40;
  var T_SEQ = 3.6;               // stage units of material per period
  var LOOP = 90;                 // seconds; scroll advances exactly T_SEQ per loop
  var layerMin = [], layerCum = [0];
  function genLayers(seed) {
    var r = mulberry32(seed), i, prev = -1, sum = 0;
    var th = [];
    layerMin = [];
    for (i = 0; i < NL; i++) {
      var m = pickMineral(r, prev);
      prev = m;
      layerMin.push(m);
      th.push(0.055 + r() * 0.05);
      sum += th[i];
    }
    var sc = T_SEQ / sum;
    layerCum = [0];
    for (i = 0; i < NL; i++) layerCum.push(layerCum[i] + th[i] * sc);
  }
  var seedBase = 11071107;
  genLayers(seedBase);

  // layer whose material span [c0,c1) contains u (sequence is periodic, valid for any u)
  function layerSpan(u) {
    var p = Math.floor(u / T_SEQ);
    var local = u - p * T_SEQ;
    var i = 0;
    while (i < NL - 1 && layerCum[i + 1] <= local) i++;
    return { gi: p * NL + i, i: i, c0: p * T_SEQ + layerCum[i], c1: p * T_SEQ + layerCum[i + 1], min: layerMin[i] };
  }

  // ---------- loop state: closed form in loop time lt ----------
  // entry scroll B(lt): rate v = V0 * (1 + 0.5 sin(a*lt + b)), integrated analytically.
  var V0 = T_SEQ / LOOP, PHB = -1.1, A = TAU / LOOP;
  function scrollB(lt) {
    return V0 * lt + V0 * 0.5 * (Math.cos(PHB) - Math.cos(A * lt + PHB)) / A;
  }
  function scrollV(lt) { return V0 * (1 + 0.5 * Math.sin(A * lt + PHB)); }
  // core height H(lt): smooth grow/melt cycle, H = B - M so melt rate rM = v - dH/dt >= 0
  function coreH(lt) { return 0.52 + 0.26 * (0.5 - 0.5 * Math.cos(A * (lt - 8))); }
  function coreDH(lt) { return 0.26 * 0.5 * A * Math.sin(A * (lt - 8)); }
  function meltNorm(lt) {
    var rM = scrollV(lt) - coreDH(lt);
    return clamp((rM - 0.01) / 0.055, 0, 1);
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var vw = 720, vh = 720, dpr = 1;
  var stageSide = 720, offX = 0, offY = 0, isPhone = false;

  function resize() {
    var vv = window.visualViewport;
    vw = (vv && vv.width) ? vv.width : window.innerWidth;
    vh = (vv && vv.height) ? vv.height : window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    var sw = (window.screen && window.screen.width) || vw;
    var sh = (window.screen && window.screen.height) || vh;
    isPhone = (Math.min(sw, sh) < 700) || (vh > vw * 1.15);
    stageSide = Math.min(vw, vh);
    offX = (vw - stageSide) / 2;
    offY = (vh - stageSide) / 2;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- geometry ----------
  var CX0 = 0.375, CX1 = 0.625, YBASE = 0.965;

  // ---------- interaction state (recorded events; drawing is a function of these + t) ----------
  var heat = [];            // {f: height fraction 0..1, t: piece time}
  var story = null;         // {uMid, min, t0}
  var lastTapT = -10, lastTapReal = 0;
  var downInfo = null;

  function heatAt(f, now) {
    var s = 0;
    for (var j = 0; j < heat.length; j++) {
      var age = now - heat[j].t;
      if (age < 0 || age > 30) continue;
      var df = (f - heat[j].f) / 0.085;
      s += Math.exp(-age / 6) * Math.exp(-df * df);
    }
    return clamp(s, 0, 1);
  }
  function heatMelt(now) {
    var s = 0;
    for (var j = 0; j < heat.length; j++) {
      var age = now - heat[j].t;
      if (age < 0 || age > 80) continue;
      s += 0.006 * Math.exp(-age / 22);
    }
    return Math.min(s, 0.10);
  }

  // ---------- audio: lazy crystalline drone, gesture-gated, visuals never depend on it ----------
  var AC = (typeof window !== 'undefined') ? (window.AudioContext || window.webkitAudioContext) : null;
  var audio = null;
  function startAudio() {
    if (audio || !AC) return;
    try {
      var ac = new AC();
      var g = ac.createGain(); g.gain.value = 0.0;
      var fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 900;
      var o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = 130;
      var o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = 261.5;
      var g2 = ac.createGain(); g2.gain.value = 0.35;
      o1.connect(fl); o2.connect(g2); g2.connect(fl); fl.connect(g); g.connect(ac.destination);
      o1.start(); o2.start();
      g.gain.linearRampToValueAtTime(0.045, ac.currentTime + 1.5);
      audio = { ac: ac, o1: o1, o2: o2, g: g };
    } catch (e) { audio = null; }
  }
  function audioUpdate(mn) {
    if (!audio) return;
    try {
      var f = 150 - 55 * mn;
      audio.o1.frequency.value = f;
      audio.o2.frequency.value = f * 2.01 + 4 * Math.sin(perfNow() * 0.0004);
    } catch (e) { /* silent */ }
  }

  function perfNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return Date.now();
  }

  // ---------- shimmer particles (seeded, closed form in lt) ----------
  var SHIM = [];
  (function () {
    var r = mulberry32(4242);
    for (var j = 0; j < 26; j++) {
      SHIM.push({ dx: (r() * 2 - 1) * 0.145, cyc: 2.5 + r() * 2.5, ph: r(), sway: 0.5 + r() * 1.5, len: 0.006 + r() * 0.010 });
    }
  })();

  // ---------- drawing ----------
  function draw(lt, now) {
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    var B = scrollB(lt);
    var M = B - coreH(lt) + heatMelt(now);
    var Hv = B - M;
    var topY = YBASE - Hv;
    var mn = meltNorm(lt);
    var unit = 1 / (dpr * stageSide);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, vw, vh);
    ctx.translate(offX, offY);
    ctx.scale(stageSide, stageSide);
    ctx.lineJoin = 'miter';

    // faint vertical guides at core edges
    ctx.strokeStyle = 'rgba(26,28,32,0.13)';
    ctx.lineWidth = 1 * unit;
    ctx.beginPath();
    ctx.moveTo(CX0, 0.055); ctx.lineTo(CX0, YBASE);
    ctx.moveTo(CX1, 0.055); ctx.lineTo(CX1, YBASE);
    ctx.stroke();

    // collect visible spans, top first
    var spans = [];
    var sp = layerSpan(M);
    var guard = 0;
    while (sp.c0 < B && guard < 80) {
      var v0 = Math.max(sp.c0, M), v1 = Math.min(sp.c1, B);
      if (v1 > v0) spans.push({ gi: sp.gi, min: sp.min, c0: sp.c0, c1: sp.c1, v0: v0, v1: v1 });
      if (sp.c1 >= B) break;
      sp = layerSpan(sp.c1 + 1e-9);
      guard++;
    }

    // bands
    var storySpan = null;
    for (var j = spans.length - 1; j >= 0; j--) {
      var s = spans[j];
      var topH = B - s.v0, botH = B - s.v1;      // height above base of top / bottom edge
      var yTop = YBASE - topH, yBot = YBASE - botH;
      var hgt = yBot - yTop;
      var fMid = ((topH + botH) / 2) / Hv;
      var heatL = heatAt(fMid, now);
      var dTop = yTop, dBot = yBot;
      if (heatL > 0.04) dTop = yBot - hgt * (1 - 0.5 * heatL);  // local thinning, anchored at bottom
      ctx.fillStyle = MINERALS[s.min].col;
      ctx.fillRect(CX0, dTop, CX1 - CX0, dBot - dTop);
      // ice wash over the band
      ctx.fillStyle = 'rgba(220,232,236,0.28)';
      ctx.fillRect(CX0, dTop, CX1 - CX0, dBot - dTop);
      // seeded internal streaks (diagram texture)
      var sr = mulberry32(s.gi * 131 + 7);
      ctx.strokeStyle = 'rgba(242,239,232,0.13)';
      ctx.lineWidth = 1 * unit;
      ctx.beginPath();
      for (var q = 0; q < 2; q++) {
        var sy = dTop + (dBot - dTop) * (0.25 + 0.5 * sr());
        var sx0 = CX0 + 0.012 + sr() * 0.05;
        var sx1 = CX1 - 0.012 - sr() * 0.05;
        ctx.moveTo(sx0, sy); ctx.lineTo(sx1, sy);
      }
      ctx.stroke();
      // thin ice line at band top
      ctx.fillStyle = 'rgba(220,232,236,0.55)';
      ctx.fillRect(CX0, dTop, CX1 - CX0, Math.max(1.2 * unit, 0.0016));
      // heat shimmer inside the band
      if (heatL > 0.04) {
        ctx.strokeStyle = 'rgba(184,196,200,' + (0.75 * heatL).toFixed(3) + ')';
        ctx.lineWidth = 1.2 * unit;
        ctx.beginPath();
        for (var w = 0; w < 4; w++) {
          var wx = CX0 + 0.03 + ((s.gi * 37 + w * 53) % 100) / 100 * (CX1 - CX0 - 0.06);
          var wy0 = dBot - 0.004, wy1 = dTop + 0.004;
          ctx.moveTo(wx, wy0); ctx.lineTo(wx + 0.004 * Math.sin(now * 2 + w), wy1);
        }
        ctx.stroke();
      }
      if (story && Math.abs((s.c0 + s.c1) / 2 - story.uMid) < (s.c1 - s.c0) / 2 + 1e-6) storySpan = { s: s, yTop: yTop, yBot: yBot };
      s._yTop = yTop; s._yBot = yBot;
    }

    // story highlight
    var storyA = 0;
    if (story) {
      var age = now - story.t0;
      if (age > 6) story = null;
      else storyA = clamp(age / 0.3, 0, 1) * clamp((6 - age) / 1.0, 0, 1);
    }
    if (story && storySpan && storyA > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.30 * storyA).toFixed(3) + ')';
      ctx.fillRect(CX0, storySpan.yTop, CX1 - CX0, storySpan.yBot - storySpan.yTop);
      ctx.strokeStyle = 'rgba(26,28,32,' + (0.8 * storyA).toFixed(3) + ')';
      ctx.lineWidth = 1.2 * unit;
      ctx.strokeRect(CX0, storySpan.yTop, CX1 - CX0, storySpan.yBot - storySpan.yTop);
    }

    // core outline (diagram precision)
    ctx.strokeStyle = 'rgba(26,28,32,0.38)';
    ctx.lineWidth = 1 * unit;
    ctx.strokeRect(CX0, topY, CX1 - CX0, Hv);

    // intake: dashed outline on the forming (bottom, newest) band
    if (spans.length) {
      var bot = spans[spans.length - 1];
      ctx.save();
      ctx.setLineDash([4 * unit * 2, 3 * unit * 2]);
      ctx.strokeStyle = 'rgba(26,28,32,0.45)';
      ctx.lineWidth = 1 * unit;
      ctx.strokeRect(CX0 - 0.006, bot._yTop, (CX1 - CX0) + 0.012, bot._yBot - bot._yTop);
      ctx.restore();
    }

    // baseline + intake markers
    ctx.strokeStyle = 'rgba(26,28,32,0.55)';
    ctx.lineWidth = 1.2 * unit;
    ctx.beginPath();
    ctx.moveTo(0.30, YBASE); ctx.lineTo(0.70, YBASE);
    ctx.stroke();
    ctx.fillStyle = 'rgba(26,28,32,0.45)';
    var tris = [[CX0 - 0.016, 1], [CX1 + 0.016, -1]];
    for (var ti = 0; ti < 2; ti++) {
      var tx = tris[ti][0], td = tris[ti][1];
      ctx.beginPath();
      ctx.moveTo(tx, YBASE - 0.010);
      ctx.lineTo(tx, YBASE + 0.002);
      ctx.lineTo(tx + 0.010 * td, YBASE - 0.004);
      ctx.closePath(); ctx.fill();
    }

    // melt shimmer rising off the top
    ctx.strokeStyle = SHIMMER;
    ctx.lineWidth = 1.3 * unit;
    for (var si = 0; si < SHIM.length; si++) {
      var p = SHIM[si];
      var ph = ((lt / p.cyc + p.ph) % 1 + 1) % 1;
      var a = (1 - ph) * 0.6 * (0.2 + 0.8 * mn);
      if (a < 0.02) continue;
      var sx = (CX0 + CX1) / 2 + p.dx + 0.008 * Math.sin(lt * p.sway + p.ph * 9);
      var sy2 = topY - 0.004 - ph * 0.085;
      ctx.strokeStyle = 'rgba(184,196,200,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(sx, sy2);
      ctx.lineTo(sx, sy2 - p.len);
      ctx.stroke();
    }

    // ---------- text pass (pixel space): strata labels + story ----------
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var labFs = isPhone ? 9.5 : 10.5;
    ctx.font = labFs + 'px "Courier New", monospace';
    ctx.fillStyle = 'rgba(26,28,32,0.78)';
    var lx = CX0 * stageSide + offX, rx = CX1 * stageSide + offX;
    for (var lj = 0; lj < spans.length; lj++) {
      var ls = spans[lj];
      var midPx = offY + (ls._yTop + ls._yBot) / 2 * stageSide;
      var name = MINERALS[ls.min].name.toUpperCase();
      ctx.strokeStyle = 'rgba(26,28,32,0.32)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (ls.gi % 2 === 0) { // left side
        ctx.moveTo(lx - 4, midPx); ctx.lineTo(lx - 16, midPx);
        ctx.stroke();
        ctx.textAlign = 'right';
        ctx.fillText(name, lx - 20, midPx + labFs * 0.35);
      } else {              // right side
        ctx.moveTo(rx + 4, midPx); ctx.lineTo(rx + 16, midPx);
        ctx.stroke();
        ctx.textAlign = 'left';
        ctx.fillText(name, rx + 20, midPx + labFs * 0.35);
      }
    }
    // story text next to its band
    if (story && storySpan && storyA > 0) {
      var sm = MINERALS[story.min];
      var sMidPx = offY + (storySpan.yTop + storySpan.yBot) / 2 * stageSide;
      ctx.fillStyle = 'rgba(26,28,32,' + (0.95 * storyA).toFixed(3) + ')';
      var leftSide = (storySpan.s.gi % 2 === 0);
      ctx.textAlign = leftSide ? 'right' : 'left';
      var sxp = leftSide ? lx - 20 : rx + 20;
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.fillText(sm.name.toUpperCase(), sxp, sMidPx - 4);
      ctx.font = '11px "Courier New", monospace';
      ctx.fillText(sm.innov, sxp, sMidPx + 11);
    }
    ctx.textAlign = 'left';

    audioUpdate(mn);
  }

  // ---------- pointer: drag = heat, tap = story, double-tap = new core ----------
  function toStage(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return [ (e.clientX - rect.left - offX) / stageSide, (e.clientY - rect.top - offY) / stageSide ];
  }
  function pieceT() { return PHASE + (perfNow() - startMs) / 1000; }

  function addHeat(sx, sy, now) {
    if (Math.abs(sx - (CX0 + CX1) / 2) > 0.19) return;
    var lt = ((now % LOOP) + LOOP) % LOOP;
    var Hv = coreH(lt) - heatMelt(now);
    var f = clamp((YBASE - sy) / Math.max(Hv, 0.05), 0, 1);
    heat.push({ f: f, t: now });
    if (heat.length > 240) heat.splice(0, heat.length - 240);
  }
  function doTap(sx, sy, now) {
    var lt = ((now % LOOP) + LOOP) % LOOP;
    var B = scrollB(lt);
    var M = B - coreH(lt) + heatMelt(now);
    // double-tap: reseed
    if (now - lastTapT < 0.35) {
      seedBase += 1013;
      genLayers(seedBase);
      story = null; heat = [];
      lastTapT = -10;
      return;
    }
    lastTapT = now;
    if (sx < CX0 - 0.01 || sx > CX1 + 0.01) return;
    var hAbove = YBASE - sy;
    if (hAbove < 0 || hAbove > B - M) return;
    var u = B - hAbove;
    var sp = layerSpan(u);
    story = { uMid: (sp.c0 + sp.c1) / 2, min: sp.min, t0: now };
  }
  function pDown(e) {
    startAudio();
    if (audio && audio.ac && audio.ac.resume) audio.ac.resume();
    var s = toStage(e);
    downInfo = { x: s[0], y: s[1], t: pieceT(), moved: false };
    addHeat(s[0], s[1], downInfo.t);
  }
  function pMove(e) {
    if (!downInfo) return;
    var s = toStage(e);
    if (Math.abs(s[0] - downInfo.x) + Math.abs(s[1] - downInfo.y) > 0.02) downInfo.moved = true;
    if (downInfo.moved) addHeat(s[0], s[1], pieceT());
  }
  function pUp(e) {
    if (!downInfo) return;
    var s = toStage(e);
    var now = pieceT();
    if (!downInfo.moved && now - downInfo.t < 0.4) doTap(s[0], s[1], now);
    downInfo = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', pDown);
    canvas.addEventListener('pointermove', pMove);
    canvas.addEventListener('pointerup', pUp);
    canvas.addEventListener('pointercancel', function () { downInfo = null; });
    canvas.addEventListener('mousedown', pDown);
    canvas.addEventListener('mousemove', pMove);
    canvas.addEventListener('mouseup', pUp);
  }

  // ---------- run: synchronous fixed-phase frame one, then guarded rAF ----------
  var PHASE = 40;
  var startMs = perfNow();
  draw(PHASE, PHASE);

  if (typeof requestAnimationFrame === 'function') {
    var frame = function () {
      var now = pieceT();
      var lt = ((now % LOOP) + LOOP) % LOOP;
      draw(lt, now);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
