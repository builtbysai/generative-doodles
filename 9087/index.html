<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9087 · Crosscurrent</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#05070a; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; cursor:crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  "use strict";
  var TAU = Math.PI * 2;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  // ---------- seeded value noise (3D) ----------
  var seed = (Math.random() * 1e9) | 0;
  var noise;
  function makeNoise(s){
    var p = new Uint8Array(512), perm = [], i, j, tmp;
    s = (s >>> 0) || 1;
    function rnd(){ s = ((s * 1664525 + 1013904223) >>> 0); return s / 4294967296; }
    for (i = 0; i < 256; i++) perm[i] = i;
    for (i = 255; i > 0; i--){ j = (rnd() * (i + 1)) | 0; tmp = perm[i]; perm[i] = perm[j]; perm[j] = tmp; }
    for (i = 0; i < 512; i++) p[i] = perm[i & 255];
    function fade(t){ return t * t * (3 - 2 * t); }
    return function n3(x, y, z){
      var X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      var u = fade(x), v = fade(y), w = fade(z);
      function h(i, j, k){ return p[(p[(p[(X + i) & 255] + ((Y + j) & 255)) & 255] + ((Z + k) & 255)) & 255] / 255; }
      function l(a, b, t){ return a + (b - a) * t; }
      return l(
        l(l(h(0,0,0), h(1,0,0), u), l(h(0,1,0), h(1,1,0), u), v),
        l(l(h(0,0,1), h(1,0,1), u), l(h(0,1,1), h(1,1,1), u), v), w);
    };
  }
  noise = makeNoise(seed);

  // ---------- state ----------
  var INK1 = '#2fe8d8';   // cyan
  var INK2 = '#ff9e3d';   // amber
  var COUNT = 2400;
  var px = new Float32Array(COUNT), py = new Float32Array(COUNT);
  var spd = new Float32Array(COUNT), ink = new Uint8Array(COUNT);
  var tField = Math.random() * 100;
  var dragging = false, dragX = 0, dragY = 0, dragOn = false;
  var lastTap = 0;

  function respawn(i, anywhere){
    px[i] = Math.random() * W;
    py[i] = anywhere ? Math.random() * H : (Math.random() < 0.5 ? -4 : H + 4);
    if (!anywhere && Math.random() < 0.5){ px[i] = Math.random() < 0.5 ? -4 : W + 4; py[i] = Math.random() * H; }
  }

  function initParticles(){
    for (var i = 0; i < COUNT; i++){
      respawn(i, true);
      spd[i] = 0.7 + Math.random() * 1.1;
      ink[i] = i % 2;
    }
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#05070a';
    ctx.fillRect(0, 0, W, H);
    initParticles();
  }
  window.addEventListener('resize', resize);
  resize();

  function fieldAngle(x, y){
    var a = noise(x * 0.0016, y * 0.0016, tField);
    var b = noise(x * 0.0007 + 31.7, y * 0.0007 - 11.3, tField * 0.6 + 7.2);
    var ang = (a * 4 - 2) * Math.PI + (b * 2 - 1) * Math.PI * 0.9;
    if (dragOn){
      var dx = x - dragX, dy = y - dragY;
      var d2 = dx * dx + dy * dy, r = 170;
      if (d2 < r * r * 4) ang += 2.4 * Math.exp(-d2 / (r * r));
    }
    return ang;
  }

  var path1 = new Path2D(), path2 = new Path2D();

  function frame(){
    tField += 0.0016;
    // fade trails
    ctx.fillStyle = 'rgba(5,7,10,0.055)';
    ctx.fillRect(0, 0, W, H);

    path1 = new Path2D(); path2 = new Path2D();
    for (var i = 0; i < COUNT; i++){
      var x = px[i], y = py[i];
      var ang = fieldAngle(x, y) + ink[i] * (Math.PI / 2);
      var s = spd[i] * (0.75 + 0.5 * noise(x * 0.004, y * 0.004, tField * 2));
      var nx = x + Math.cos(ang) * s * 1.6, ny = y + Math.sin(ang) * s * 1.6;
      var path = ink[i] ? path2 : path1;
      path.moveTo(x, y); path.lineTo(nx, ny);
      px[i] = nx; py[i] = ny;
      if (nx < -8 || nx > W + 8 || ny < -8 || ny > H + 8 || Math.random() < 0.0015) respawn(i, false);
    }
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = INK1; ctx.stroke(path1);
    ctx.strokeStyle = INK2; ctx.stroke(path2);
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- interaction: drag perturbs, double-tap reseeds ----------
  function point(e){
    var t = e.touches && e.touches[0] ? e.touches[0] : e;
    return [t.clientX, t.clientY];
  }
  canvas.addEventListener('pointerdown', function(e){
    var pt = point(e); dragX = pt[0]; dragY = pt[1]; dragOn = true; dragging = true;
    var now = Date.now();
    if (now - lastTap < 320){
      seed = (Math.random() * 1e9) | 0;
      noise = makeNoise(seed);
      ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, W, H);
      initParticles();
      lastTap = 0;
    } else lastTap = now;
  });
  canvas.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var pt = point(e); dragX = pt[0]; dragY = pt[1];
  });
  function endDrag(){ dragging = false; dragOn = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', endDrag);
})();
</script>
</body>
</html>
