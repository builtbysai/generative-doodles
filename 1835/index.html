<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where the Acoustic Ends</title>
<style>
html, body { margin: 0; padding: 0; background: #0C0E26; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
/* Palette, hand-picked from the prompt's named colors. */
var FIELD = '#0C0E26';        /* deep indigo field */
var FIELD_DEEP = '#07081A';
var MIST = '#23265A';         /* low held-chord band, indigo mist */
var MIST_SOFT = '#1B1E4A';
var SILVER = '#C8CCD4';       /* string fragments */
var SILVER_DIM = '#8E93A3';
var ACID = '#A8E10C';         /* glitch pixels */
var ACID_DIM = '#6FA307';
var AMBER = '#C08A3E';        /* horn swells */
var AMBER_DIM = '#8A6428';
var PLATE = '#10122E';
var PLATE_LINE = 'rgba(200,204,212,0.35)';
var TITLE_INK = '#EDEFF4';
var HINT_INK = '#B9BDCB';
var FRAME_T = 2.6;            /* fixed phase: both materials visible, mist band up */
var PITCHES = [110, 130.81, 146.83, 164.81, 196, 220, 246.94];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1835);
var phaseT = FRAME_T;
var soundOn = false;
var audioCtx = null;
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
/* Seeded particles: position, slow drift, size, material-flip clock. */
var PARTICLES = [];
(function () {
  var i;
  for (i = 0; i < 110; i++) {
    PARTICLES.push({
      x: rng(), y: rng(),
      vx: (rng() - 0.5) * 0.006, vy: (rng() - 0.5) * 0.004,
      len: 0.018 + rng() * 0.05,
      ang: rng() * TAU,
      flipPeriod: 1.6 + rng() * 4.4,   /* stochastic clock, 1.6 to 6.0 s */
      flipOff: rng() * 6.0,
      base: rng() < 0.5 ? 0 : 1,       /* seeded starting material, keeps the field balanced */
      vib: 5 + rng() * 3,              /* string vibration, 5 to 8 Hz */
      ph: rng() * TAU,
      a: 0.35 + rng() * 0.55
    });
  }
})();
/* Seeded horn swells: slow amber washes drifting without visible sources. */
var SWELLS = [];
(function () {
  var i;
  for (i = 0; i < 5; i++) {
    SWELLS.push({
      x: rng(), y: 0.15 + rng() * 0.7,
      r: 0.22 + rng() * 0.22,
      drift: (rng() - 0.5) * 0.008,
      period: 9 + rng() * 6,           /* 9 to 15 s swell cycle */
      ph: rng() * TAU,
      a: 0.07 + rng() * 0.09
    });
  }
})();
/* Seeded percussion blips: faint rings that bloom and fade, no source shown. */
var BLIPS = [];
(function () {
  var i;
  for (i = 0; i < 7; i++) {
    BLIPS.push({
      x: rng(), y: rng(),
      period: 5.5 + rng() * 4.5,       /* 5.5 to 10 s between blips */
      off: rng() * 10,
      maxR: 0.05 + rng() * 0.06
    });
  }
})();
/* Material flag: closed-form function of time, so frame one is fixed and
   each particle keeps switching material mid-flight on its own clock. */
function materialAt(p, t) {
  var k = Math.floor((t + p.flipOff) / p.flipPeriod);
  return ((p.base + k) % 2 === 0) ? 'string' : 'glitch';
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function sceneRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function drawMist(sc, t) {
  /* Low held-chord band behind everything, like mist. Breathes slowly. */
  var bandY = sc.y + sc.h * 0.62;
  var bandH = sc.h * 0.30;
  var breathe = 0.5 + 0.5 * Math.sin(t * 0.35);
  var g = ctx.createLinearGradient(0, bandY - bandH / 2, 0, bandY + bandH / 2);
  g.addColorStop(0, rgba(MIST, 0));
  g.addColorStop(0.5, rgba(MIST, 0.26 + 0.08 * breathe));
  g.addColorStop(1, rgba(MIST_SOFT, 0));
  ctx.fillStyle = g;
  ctx.fillRect(sc.x, bandY - bandH / 2, sc.w, bandH);
}
function drawSwells(sc, t) {
  var i, s, cx, cy, r, a;
  for (i = 0; i < SWELLS.length; i++) {
    s = SWELLS[i];
    cx = sc.x + (((s.x + s.drift * t) % 1.2) + 1.2) % 1.2 * sc.w - sc.w * 0.1;
    cy = sc.y + s.y * sc.h;
    r = s.r * sc.w;
    a = s.a * (0.5 + 0.5 * Math.sin(TAU * t / s.period + s.ph));
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, rgba(AMBER, a));
    g.addColorStop(1, rgba(AMBER, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx + r, cy);
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.fill();
  }
}
function drawBlips(sc, t) {
  var i, b, u, r, a;
  for (i = 0; i < BLIPS.length; i++) {
    b = BLIPS[i];
    u = (((t + b.off) % b.period) + b.period) % b.period / b.period;
    r = b.maxR * sc.w * (0.15 + 0.85 * u);
    a = 0.30 * (1 - u);
    ctx.strokeStyle = rgba(SILVER, a);
    ctx.lineWidth = Math.max(1, sc.w * 0.0012);
    ctx.beginPath();
    ctx.moveTo(b.x * sc.w + sc.x + r, b.y * sc.h + sc.y);
    ctx.arc(sc.x + b.x * sc.w, sc.y + b.y * sc.h, r, 0, TAU);
    ctx.stroke();
  }
}
function drawParticles(sc, t) {
  var i, p, px, py, u, len, ang, mat, wob, x1, y1, x2, y2, mx, my, s, flick;
  for (i = 0; i < PARTICLES.length; i++) {
    p = PARTICLES[i];
    var wx = (((p.x + p.vx * t) % 1) + 1) % 1;
    var wy = (((p.y + p.vy * t) % 1) + 1) % 1;
    px = sc.x + (0.04 + 0.92 * wx) * sc.w;
    py = sc.y + (0.04 + 0.92 * wy) * sc.h;
    u = sc.w;
    len = p.len * u;
    ang = p.ang + 0.05 * Math.sin(t * 0.3 + p.ph);
    mat = materialAt(p, t);
    if (mat === 'string') {
      /* Struck string fragment: a vibrating line with nodes. */
      wob = Math.sin(TAU * p.vib * t + p.ph) * len * 0.10;
      var nx = Math.cos(ang + Math.PI / 2), ny = Math.sin(ang + Math.PI / 2);
      x1 = px - Math.cos(ang) * len / 2;
      y1 = py - Math.sin(ang) * len / 2;
      x2 = px + Math.cos(ang) * len / 2;
      y2 = py + Math.sin(ang) * len / 2;
      mx = px + nx * wob;
      my = py + ny * wob;
      ctx.strokeStyle = rgba(SILVER, p.a);
      ctx.lineWidth = Math.max(1, u * 0.0016);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(mx, my, x2, y2);
      ctx.stroke();
      /* Nodes at the ends and the middle. */
      ctx.fillStyle = rgba(SILVER, p.a * 0.9);
      s = Math.max(1.5, u * 0.0022);
      ctx.beginPath(); ctx.moveTo(x1 + s, y1); ctx.arc(x1, y1, s, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x2 + s, y2); ctx.arc(x2, y2, s, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(mx + s * 0.8, my); ctx.arc(mx, my, s * 0.8, 0, TAU); ctx.fill();
    } else {
      /* Glitch pixel: a hard rectangle with scanline flicker, 6 Hz. */
      flick = 0.55 + 0.45 * Math.sin(TAU * 6 * t + p.ph);
      var gw = len * 0.9, gh = len * 0.55;
      ctx.fillStyle = rgba(ACID, p.a * (0.55 + 0.45 * flick));
      ctx.fillRect(px - gw / 2, py - gh / 2, gw, gh);
      ctx.fillStyle = rgba(ACID_DIM, p.a * 0.5 * flick);
      ctx.fillRect(px - gw / 2, py - gh * 0.12, gw, Math.max(1, gh * 0.16));
      ctx.fillRect(px - gw / 2, py + gh * 0.28, gw * 0.7, Math.max(1, gh * 0.16));
    }
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Where the Acoustic Ends').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Where the Acoustic Ends').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 20').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Where the Acoustic Ends', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 20', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, soundPlate.x + 12, soundPlate.y + 7);
}
/* ---- sound: closed-form model, real WebAudio only after a tap ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try { audioCtx = new AudioContext(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function playPluck(freq) {
  var ac = ensureAudio();
  if (!ac || !soundOn) return;
  var now = ac.currentTime;
  var osc = ac.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.5), now + 0.4);
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.12, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
  osc.connect(g);
  g.connect(ac.destination);
  osc.start(now);
  osc.stop(now + 0.65);
}
function playSwell(freq) {
  var ac = ensureAudio();
  if (!ac || !soundOn) return;
  var now = ac.currentTime;
  var osc = ac.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(freq, now);
  var lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(300, now);
  lp.frequency.linearRampToValueAtTime(1400, now + 1.2);
  lp.frequency.linearRampToValueAtTime(300, now + 2.4);
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(0.05, now + 1.2);
  g.gain.linearRampToValueAtTime(0.0001, now + 2.6);
  osc.connect(lp);
  lp.connect(g);
  g.connect(ac.destination);
  osc.start(now);
  osc.stop(now + 2.7);
}
var lastBlip = -1, lastSwell = -1;
function maybeSound(t) {
  if (!soundOn) return;
  var bi = Math.floor(t / 2.7);
  if (bi !== lastBlip) {
    lastBlip = bi;
    playPluck(PITCHES[bi % PITCHES.length]);
  }
  var si = Math.floor(t / 9.5);
  if (si !== lastSwell) {
    lastSwell = si;
    playSwell(PITCHES[(si * 2 + 3) % PITCHES.length] / 2);
  }
}
function draw() {
  size();
  var sc = sceneRect();
  var t = phaseT;
  ctx.fillStyle = FIELD_DEEP;
  ctx.fillRect(0, 0, VW, VH);
  var bg = ctx.createLinearGradient(0, sc.y, 0, sc.y + sc.h);
  bg.addColorStop(0, FIELD);
  bg.addColorStop(1, FIELD_DEEP);
  ctx.fillStyle = bg;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  drawMist(sc, t);
  drawSwells(sc, t);
  drawBlips(sc, t);
  drawParticles(sc, t);
  drawPlates();
  maybeSound(t);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 2.6 s, both materials present, mist up ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('click', function (ev) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    var x = ev.clientX - rect.left;
    var y = ev.clientY - rect.top;
    if (x >= soundPlate.x && x <= soundPlate.x + soundPlate.w && y >= soundPlate.y && y <= soundPlate.y + soundPlate.h) {
      soundOn = !soundOn;
      if (soundOn) { ensureAudio(); playPluck(220); }
      draw();
    }
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
