<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.253 Dandelion Ball</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#050505; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.253 Dandelion Ball (tanzinchospel.art). After his
// Nov 2020 particle study: a dandelion seed head built
// from 2600 pastel strands on near black, a thin stem
// below. The ball sways gently and sheds the odd seed
// upward. Drag across it to shake: a burst of seeds lets
// go and drifts off, and the ball regrows over about ten
// seconds. Sixty percent of the frame stays empty black.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var BLUE = '#A8D8F0', WHITE = '#F5F5F5', PINK = '#F0B8D0', GROUND = '#050505';
var DW = 1000, DH = 1000;
var CX = 500, CY = 398, RAD = 158;
var NSTRAND = 2600;
var W = 0, H = 0, phone = false;
var viewS = 1, viewOX = 0, viewOY = 0;
var T = 0, lastNow = -1; // frame one: full head, a few seeds already airborne
var shakeX = 0, shakeY = 0, shakeVX = 0, shakeVY = 0;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- strands: a fibonacci sphere of pastel hairs --------------------------------------
var strands = [];
(function () {
  var r = rng(25307);
  var GA = Math.PI * (3 - Math.sqrt(5));
  for (var i = 0; i < NSTRAND; i++) {
    var y = 1 - (i / (NSTRAND - 1)) * 2;
    var rad = Math.sqrt(Math.max(0, 1 - y * y));
    var th = GA * i;
    var pick = r();
    strands.push({
      dx: Math.cos(th) * rad, dy: y, dz: Math.sin(th) * rad,
      col: pick < 0.40 ? BLUE : (pick < 0.75 ? WHITE : PINK),
      full: 0.78 + r() * 0.34,      // full length, fraction of RAD
      len: 1,                        // current grown fraction of full
      gone: false, regrowAt: 0, growFrom: 0,
      ph: r() * Math.PI * 2
    });
  }
})();

// ---- seeds: detached strands adrift -----------------------------------------------------
var seeds = [];
function spawnSeed(x, y, col, vx, vy, age) {
  seeds.push({ x: x, y: y, vx: vx, vy: vy, col: col, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 1.6, life: -age, max: 6 + Math.random() * 3.5 });
}
(function () { // a few already airborne on frame one
  var r = rng(25399);
  for (var i = 0; i < 7; i++) {
    var a = r() * Math.PI * 2, rr = RAD * (0.3 + r() * 0.6);
    spawnSeed(CX + Math.cos(a) * rr, CY - RAD * (0.7 + r() * 0.9), r() < 0.5 ? BLUE : (r() < 0.5 ? WHITE : PINK), 6 + r() * 10, -14 - r() * 10, r() * 3);
  }
})();

function windAt(x, y, t) {
  return Math.sin(x * 0.004 + t * 0.7) + Math.cos(y * 0.0032 - t * 0.5);
}

function detach(st, burst) {
  var tip = strandTip(st);
  spawnSeed(tip.x, tip.y, st.col, (Math.random() - 0.5) * 22, -12 - Math.random() * 16, 0);
  st.gone = true;
  st.len = 0;
  // a shaken strand takes its time: together a burst reads
  // as the whole ball regrowing over about ten seconds
  st.regrowAt = T + (burst ? 2.5 + Math.random() * 3.5 : 0.5 + Math.random() * 1.5);
  st.growFrom = st.regrowAt;
}
function strandTip(st) {
  var sway = Math.sin(T * 0.45) * 10;
  var rot = Math.sin(T * 0.30) * 0.045;
  var cs = Math.cos(rot), sn = Math.sin(rot);
  var px = st.dx, py = st.dy;
  var rx = px * cs - py * sn, ry = px * sn + py * cs;
  var L = RAD * st.full * st.len;
  var bend = windAt(CX + rx * RAD, CY + ry * RAD, T + st.ph * 0.14) * 7 * (0.4 + 0.6 * st.len);
  return { x: CX + sway + shakeX + rx * L + bend, y: CY + shakeY + ry * L, bx: CX + sway + shakeX + rx * RAD * 0.10, by: CY + shakeY + ry * RAD * 0.10, z: st.dz };
}

// ---- simulation -----------------------------------------------------------------------------
var detachClock = 0;
function step(dt) {
  // the head's own slow shedding: a seed lets go now and then
  detachClock -= dt;
  if (detachClock <= 0) {
    detachClock = 0.35 + Math.random() * 0.5;
    for (var tries = 0; tries < 8; tries++) {
      var st = strands[(Math.random() * NSTRAND) | 0];
      if (!st.gone && st.dz > 0.1 && st.len > 0.9) { detach(st, false); break; }
    }
  }
  // regrowth
  for (var i = 0; i < NSTRAND; i++) {
    var s2 = strands[i];
    if (s2.gone) {
      if (T >= s2.regrowAt) {
        s2.len = Math.min(1, (T - s2.growFrom) / 4);
        if (s2.len >= 1) s2.gone = false;
      }
    }
  }
  // seeds drift up on the wind and fade
  for (var j = seeds.length - 1; j >= 0; j--) {
    var sd = seeds[j];
    sd.life += dt;
    sd.vx += windAt(sd.x, sd.y, T) * 3.2 * dt;
    sd.vy -= 2.0 * dt; // buoyant
    sd.vx *= (1 - 0.25 * dt); sd.vy *= (1 - 0.25 * dt);
    sd.x += sd.vx * dt; sd.y += sd.vy * dt;
    sd.rot += sd.vr * dt;
    if (sd.life > sd.max || sd.y < -30) seeds.splice(j, 1);
  }
  // the shake spring settles
  shakeVX += (-shakeX * 42 - shakeVX * 7) * dt;
  shakeVY += (-shakeY * 42 - shakeVY * 7) * dt;
  shakeX += shakeVX * dt; shakeY += shakeVY * dt;
}

// ---- drawing ----------------------------------------------------------------------------------
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);

  var sway = Math.sin(T * 0.45) * 10;
  // the thin stem, from the head's base to the bottom edge
  ctx.strokeStyle = rgba(BLUE, 0.38);
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(CX + sway * 0.9 + shakeX, CY + RAD * 0.62);
  ctx.quadraticCurveTo(CX - 16 + shakeX * 0.5, CY + RAD * 1.55, CX - 26, DH + 6);
  ctx.stroke();

  ctx.lineWidth = 1.3;
  ctx.lineCap = 'round';
  // back strands first, then the front of the ball
  for (var pass = 0; pass < 2; pass++) {
    for (var i = 0; i < NSTRAND; i++) {
      var st = strands[i];
      if (pass === 0 && st.dz > -0.15) continue;
      if (pass === 1 && st.dz <= -0.15) continue;
      if (st.len <= 0.01) continue;
      var tip = strandTip(st);
      var depth = 0.35 + 0.65 * ((st.dz + 1) / 2);
      ctx.strokeStyle = rgba(st.col, 0.62 * depth * Math.min(1, st.len + 0.25));
      ctx.beginPath();
      ctx.moveTo(tip.bx, tip.by);
      ctx.quadraticCurveTo((tip.bx + tip.x) / 2, (tip.by + tip.y) / 2 - 3, tip.x, tip.y);
      ctx.stroke();
      // the seed tuft at the tip of the front strands
      if (st.dz > 0.25 && st.len > 0.5) {
        ctx.strokeStyle = rgba(st.col, 0.5 * depth);
        for (var k = -1; k <= 1; k++) {
          var ang = Math.atan2(tip.y - tip.by, tip.x - tip.bx) + k * 0.5;
          ctx.beginPath();
          ctx.moveTo(tip.x, tip.y);
          ctx.lineTo(tip.x + Math.cos(ang) * 6.5, tip.y + Math.sin(ang) * 6.5);
          ctx.stroke();
        }
      }
    }
  }
  // core shadow of the head
  ctx.fillStyle = rgba(BLUE, 0.05);
  ctx.beginPath(); ctx.arc(CX + sway + shakeX, CY + shakeY, RAD * 0.30, 0, Math.PI * 2); ctx.fill();

  // airborne seeds: a dot of hairs on a hair stem
  for (var j = 0; j < seeds.length; j++) {
    var sd = seeds[j];
    var fade = sd.life < 0 ? 1 : Math.max(0, 1 - sd.life / sd.max);
    ctx.strokeStyle = rgba(sd.col, 0.8 * fade);
    ctx.lineWidth = 1.1;
    for (var m = 0; m < 5; m++) {
      var a2 = sd.rot + (m / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(sd.x, sd.y);
      ctx.lineTo(sd.x + Math.cos(a2) * 7, sd.y + Math.sin(a2) * 7 - 2);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(sd.x, sd.y);
    ctx.lineTo(sd.x - sd.vx * 0.14, sd.y + 11);
    ctx.stroke();
  }
}

// ---- drag to shake ------------------------------------------------------------------------------
var dragging = false, lastPX = 0, lastPY = 0, lastPT = 0;
function toDesign(e) {
  return { x: (e.clientX - viewOX) / viewS, y: (e.clientY - viewOY) / viewS };
}
canvas.addEventListener('pointerdown', function (e) {
  dragging = true;
  var p = toDesign(e);
  lastPX = p.x; lastPY = p.y; lastPT = T;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dx = p.x - lastPX, dy = p.y - lastPY;
  var dt = Math.max(0.008, T - lastPT);
  var speed = Math.sqrt(dx * dx + dy * dy) / dt; // design units per second
  lastPX = p.x; lastPY = p.y; lastPT = T;
  // the head itself gets knocked
  shakeVX += dx * 2.4; shakeVY += dy * 2.4;
  if (speed < 260) return; // a gentle pass only stirs it
  // strands near the drag path let go, more the faster the shake
  var want = Math.min(46, 6 + speed * 0.03);
  var done = 0;
  for (var i = 0; i < NSTRAND && done < want; i++) {
    var st = strands[(Math.random() * NSTRAND) | 0];
    if (st.gone || st.len < 0.6) continue;
    var tip = strandTip(st);
    var ddx = tip.x - p.x, ddy = tip.y - p.y;
    if (ddx * ddx + ddy * ddy < 120 * 120) { detach(st, true); done++; }
  }
});
canvas.addEventListener('pointerup', function () { dragging = false; });
canvas.addEventListener('pointercancel', function () { dragging = false; });

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // contain-fit: the composition keeps its shape, centred,
  // the near-black ground filling the rest of the screen
  viewS = Math.min(W / DW, H / DH);
  viewOX = (W - DW * viewS) / 2;
  viewOY = (H - DH * viewS) / 2;
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  if (dt > 0) step(dt);
  ctx.setTransform(viewS, 0, 0, viewS, viewOX, viewOY);
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
