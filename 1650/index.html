<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Realism Is an Optical Illusion</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BLACK = '#000000';
var ROSE = '#f7c8d0';
/* Summed oscillators draw ribbons whose braiding and flattening are the
   phase relationships themselves. Frame one is at t = 6 s: the detuning
   beat is mid-breath and the sum ribbon is developed. */
var PHASE = 6;
/* One oscillator per ribbon: color, cycles across the width, angular
   frequency, authored phase, amplitude as a fraction of band half-height. */
var OSC = [
  { c: [0, 216, 255],   k: 2.0, w: 0.90, p: 0.0, a: 0.52 },
  { c: [255, 46, 154],  k: 2.5, w: 1.04, p: 1.9, a: 0.46 },
  { c: [181, 230, 29],  k: 3.0, w: 1.18, p: 3.7, a: 0.40 },
  { c: [155, 92, 255],  k: 3.5, w: 1.32, p: 5.1, a: 0.44 }
];
var ROSE_RGB = [247, 200, 208];
var WHITE_RGB = [255, 255, 255];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* ---- corner emitters: the sources of the wavefunction ---- */
var emitters = [
  { fx: 0.09, fy: 0.10, pe: 0.0 },
  { fx: 0.91, fy: 0.10, pe: 2.1 }
];
function emitterPos(e) { return { x: e.fx * VW, y: e.fy * VH }; }
/* Phase the emitters contribute at position x along the band: radial
   wavefronts thrown from each emitter point, weighted differently per
   oscillator so moving a source changes the RELATIVE phases, and the
   ribbons genuinely re-phase instead of sliding together. */
var EM_GAIN = [1.0, 0.7, 1.3, 0.85];
function emitterWave(e, x, t) {
  var ex = e.fx * VW, ey = e.fy * VH;
  var dx = x - ex, dy = bandCenter() - ey;
  var d = Math.sqrt(dx * dx + dy * dy);
  var lam = 0.28 * Math.min(VW, VH);
  return Math.sin(TAU * d / lam - 0.7 * t + e.pe);
}
function phaseAt(i, x, t) {
  var o = OSC[i];
  return TAU * o.k * (x / VW) - o.w * t + o.p
    + 0.35 * EM_GAIN[i] * (emitterWave(emitters[0], x, t) + emitterWave(emitters[1], x, t));
}
function sinesAt(x, t) {
  var s = [], i;
  for (i = 0; i < OSC.length; i++) s.push(Math.sin(phaseAt(i, x, t)));
  return s;
}
function bandCenter() { return VH * 0.5; }
function bandHalf() { return VH * 0.16; }
/* Ribbon i: its own oscillator plus a pull toward the mean of the others,
   so ribbons braid where phases agree and separate where they do not. */
function ribbonY(i, x, t) {
  var s = sinesAt(x, t), j, mean = 0;
  for (j = 0; j < OSC.length; j++) mean += OSC[j].a * s[j];
  mean /= OSC.length;
  var d = OSC[i].a * s[i] + 0.30 * mean;
  return bandCenter() + bandHalf() * clamp(d, -0.98, 0.98);
}
/* The summed waveform: pale rose spine of the standing band. Where the
   oscillators agree it swings wide; where they cancel it flattens. */
function sumY(x, t) {
  var s = sinesAt(x, t), j, sum = 0;
  for (j = 0; j < OSC.length; j++) sum += OSC[j].a * s[j];
  return bandCenter() + bandHalf() * 0.55 * clamp(sum, -1.7, 1.7);
}
/* Detuning beat: how much the oscillators agree at time t, 0..1, measured
   from the summed waveform itself (its widest swing over the width,
   divided by the swing if all agreed). The standing band breathes with it. */
function bandEnvelope(t) {
  var max = 0, x, s, j, sum, total = 0;
  for (j = 0; j < OSC.length; j++) total += OSC[j].a;
  var step = VW / 64;
  for (x = 0; x <= VW; x += step) {
    s = sinesAt(x, t); sum = 0;
    for (j = 0; j < OSC.length; j++) sum += OSC[j].a * s[j];
    if (Math.abs(sum) > max) max = Math.abs(sum);
  }
  return max / total;
}
function drawDisc(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
}
function drawBand(t) {
  var yc = bandCenter(), h = bandHalf(), env = bandEnvelope(t);
  var a = 0.06 + 0.17 * env * env;
  ctx.fillStyle = rgba(ROSE_RGB, a);
  ctx.fillRect(0, yc - h, VW, 2 * h);
  ctx.strokeStyle = rgba(ROSE_RGB, 0.30);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, yc - h + 0.5); ctx.lineTo(VW, yc - h + 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, yc + h + 0.5); ctx.lineTo(VW, yc + h + 0.5); ctx.stroke();
  /* Sum ribbon: the standing wave made visible. */
  var step = Math.max(3, VW / 220), x, y;
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(ROSE_RGB, 0.50);
  ctx.lineWidth = Math.max(8, Math.min(VW, VH) * 0.022);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, sumY(0, t));
  for (x = step; x <= VW; x += step) ctx.lineTo(x, sumY(x, t));
  ctx.stroke();
  ctx.strokeStyle = rgba(WHITE_RGB, 0.35 + 0.45 * env);
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(0, sumY(0, t));
  for (x = step; x <= VW; x += step) ctx.lineTo(x, sumY(x, t));
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}
function drawRibbons(t) {
  var step = Math.max(3, VW / 220), i, x;
  var lw = Math.max(6, Math.min(VW, VH) * 0.014);
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (i = 0; i < OSC.length; i++) {
    ctx.strokeStyle = rgba(OSC[i].c, 0.55);
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(0, ribbonY(i, 0, t));
    for (x = step; x <= VW; x += step) ctx.lineTo(x, ribbonY(i, x, t));
    ctx.stroke();
    ctx.strokeStyle = rgba(WHITE_RGB, 0.28);
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(0, ribbonY(i, 0, t));
    for (x = step; x <= VW; x += step) ctx.lineTo(x, ribbonY(i, x, t));
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawEmitters(t) {
  var e, ep, n, frac, r, maxR = Math.min(VW, VH) * 0.12;
  for (e = 0; e < emitters.length; e++) {
    ep = emitterPos(emitters[e]);
    /* Expanding ripple rings, the sources throwing waves. */
    for (n = 0; n < 3; n++) {
      frac = (t * 0.22 + n / 3 + emitters[e].pe / TAU) % 1;
      r = frac * maxR;
      if (r < 1) continue;
      ctx.strokeStyle = rgba(ROSE_RGB, (1 - frac) * 0.45);
      ctx.lineWidth = 1.2;
      drawDisc(ep.x, ep.y, r);
      ctx.stroke();
    }
    /* Steady punctuation rings. */
    ctx.strokeStyle = rgba(ROSE_RGB, 0.75);
    ctx.lineWidth = 1.4;
    drawDisc(ep.x, ep.y, Math.min(VW, VH) * 0.018);
    ctx.stroke();
    ctx.fillStyle = rgba(ROSE_RGB, 0.9);
    drawDisc(ep.x, ep.y, Math.min(VW, VH) * 0.006);
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  var title = 'Local Realism Is an Optical Illusion';
  var date = '2006 · 07 · 19';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(title).width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(title).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText(date).width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = VH - plateH - 12;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(ROSE_RGB, 0.4);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = ROSE;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(title, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(ROSE_RGB, 0.8);
  ctx.fillText(date, plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag a corner emitter to re-phase the ribbons.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = 12;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(ROSE_RGB, 0.4);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(ROSE_RGB, 0.9);
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
/* ---- drag interaction: move a corner emitter, re-phase the ribbons ---- */
var dragging = -1;
function pointerPos(e) {
  var r = { x: 0, y: 0 };
  if (e && typeof e.clientX === 'number') { r.x = e.clientX; r.y = e.clientY; }
  return r;
}
function onPointerDown(e) {
  var p = pointerPos(e), i, ep, dx, dy, d, best = -1, bestD = 1e9;
  var grab = Math.max(48, Math.min(VW, VH) * 0.08);
  for (i = 0; i < emitters.length; i++) {
    ep = emitterPos(emitters[i]);
    dx = p.x - ep.x; dy = p.y - ep.y;
    d = Math.sqrt(dx * dx + dy * dy);
    if (d < grab && d < bestD) { best = i; bestD = d; }
  }
  if (best >= 0) {
    dragging = best;
    if (e && e.preventDefault) e.preventDefault();
  }
}
function onPointerMove(e) {
  if (dragging < 0) return;
  var p = pointerPos(e);
  emitters[dragging].fx = clamp(p.x / VW, 0.03, 0.97);
  emitters[dragging].fy = clamp(p.y / VH, 0.03, 0.45);
  if (e && e.preventDefault) e.preventDefault();
}
function onPointerUp(e) { dragging = -1; }
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('pointerleave', onPointerUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function draw(t) {
  size();
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, VW, VH);
  drawBand(t);
  drawRibbons(t);
  drawEmitters(t);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    bandEnvelope: function (t) { return bandEnvelope(t); },
    sumY: function (x, t) { return sumY(x, t); },
    ribbonY: function (i, x, t) { return ribbonY(i, x, t); },
    emitter: function (i) { return { fx: emitters[i].fx, fy: emitters[i].fy }; },
    dragEmitter: function (i, px, py) {
      dragging = i;
      onPointerMove({ clientX: px, clientY: py });
      dragging = -1;
    },
    size: function () { return { w: VW, h: VH, phone: isPhone }; }
  };
}
/* ---- frame one: fixed phase, fixed seeds, no wall clock ---- */
size();
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
