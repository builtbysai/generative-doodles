<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№38 · Thirty-Two Words</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#101010; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(242,237,227,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag up or down to count</div>
<script>
'use strict';
// No38 Thirty-Two Words.
// Five lamps, each on or off, make exactly 32 words. This piece
// lists all 32 binary strings of length 5, generated in code and
// asserted (values 0 to 31, each exactly once), one word per row,
// filled lamp for 1, open ring for 0. A counting sweep lights the
// rows in binary counting order; the current row inverts, so the
// count itself reads as a moving band of light. The units column
// (rightmost lamp, the one that flips every count) is neon, tying
// back to No.35. Drag vertically to move the count by hand; on
// release the loop resumes after a few idle seconds.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '38', 10) || 38;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#101010';
const WARM = '#f2ede3';
const NEON = '#d8ff3e';
const WORDS = Array.from({ length: 32 }, (_, i) => i);   // 0..31 each once
const STEP = 0.55;                    // seconds per count
const LOOP = STEP * 32;

let scrub = 0;
let dragInfo = null;
let holdPos = null, holdUntil = 0;

function layout(w, h) {
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  return { RX, RY, ox: (w - RX) / 2, oy: (h - RY) / 2 };
}

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const { RX, RY, ox, oy } = layout(w, h);
  let tPos;
  if (dragInfo) tPos = dragInfo.pos;
  else if (holdPos != null && performance.now() / 1000 < holdUntil) tPos = holdPos;
  else tPos = ((nowMs / 1000 + scrub) % LOOP + LOOP) % LOOP;
  const current = Math.floor(tPos / STEP) % 32;

  const rows = 32;
  const rowH = RY * 0.94 / rows;
  const lampR = Math.min(rowH * 0.30, RX * 0.021);
  const span = RX * 0.52;
  const x0 = ox + (RX - span) / 2;
  const top = oy + RY * 0.03;

  for (let r = 0; r < rows; r++) {
    const v = WORDS[r];
    const cy = top + (r + 0.5) * rowH;
    const isCurrent = r === current;
    if (isCurrent) {
      ctx.fillStyle = 'rgba(242,237,227,0.92)';
      ctx.fillRect(x0 - span * 0.14, cy - rowH * 0.46, span * 1.28, rowH * 0.92);
    }
    for (let b = 0; b < 5; b++) {
      const bit = (v >> (4 - b)) & 1;
      const x = x0 + span * (b / 4);
      const isUnits = b === 4;
      const ink = isCurrent ? GROUND : (isUnits ? NEON : WARM);
      ctx.beginPath();
      ctx.arc(x, cy, lampR, 0, Math.PI * 2);
      if (bit ^ (isCurrent ? 1 : 0)) {
        ctx.fillStyle = ink;
        ctx.fill();
      } else {
        ctx.strokeStyle = ink;
        ctx.lineWidth = Math.max(0.8, lampR * 0.22);
        ctx.stroke();
        if (isCurrent) { ctx.fillStyle = ink; }
      }
    }
  }
  return { RY, oy };
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(6100);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function pointerY(ev) {
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { top: 0 };
  return ev.clientY - r.top;
}
function currentPos() {
  if (dragInfo) return dragInfo.pos;
  return ((performance.now() / 1000 + scrub) % LOOP + LOOP) % LOOP;
}
canvas.addEventListener('pointerdown', ev => {
  dragInfo = { y: pointerY(ev), startPos: currentPos(), pos: currentPos() };
  holdPos = null;
});
canvas.addEventListener('pointermove', ev => {
  if (!dragInfo) return;
  const [w, h] = viewportWH();
  const L = layout(w, h);
  const dy = pointerY(ev) - dragInfo.y;
  dragInfo.pos = (((dragInfo.startPos + (dy / L.RY) * LOOP) % LOOP) + LOOP) % LOOP;
});
function endDrag() {
  if (!dragInfo) return;
  holdPos = dragInfo.pos;
  holdUntil = performance.now() / 1000 + 4;
  scrub = dragInfo.pos - performance.now() / 1000;
  dragInfo = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
