<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror, Dreaming</title>
<style>
  html, body { margin: 0; padding: 0; background: #07080C; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  No.978 "Mirror, Dreaming" (Transformirror mechanism).
  A mirror that re-dreams the room around a standing silhouette.
  Closed-form state over (piece time, events). Frame one is the
  synchronous draw at piece time T0 = 16 s: the astronaut dream
  fully bloomed, its prompt fully typed, the silhouette mid-sway.
  No wall clock feeds any drawn state.
*/

var T0 = 16;                 // fixed frame-one offset, seconds
var CYCLE = 45;              // seconds per dream
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 720, H = 720;

/* ---------- seeded rng ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* integer hash -> [0,1), for the shimmer clock */
function hashN(n) {
  n = (n << 13) ^ n;
  n = (n * (n * n * 15731 + 789221) + 1376312589) | 0;
  return ((n ^ (n >>> 14)) >>> 0) / 4294967296;
}

/* ---------- palette ---------- */
var MIRROR = '#07080C';
var SIL = '#1A1D24', RIM = '#B8C4D4';
var PROMPT_COL = '#7DF9C6';
var A = { panels: '#C9CFDB', earth: '#2E7DD1', glow: '#D8FFE8', tools: '#8A8D84' };
var R = { coral: '#E8875A', sand: '#D8C49A', sea: '#1E5D6B' };
var F = { trunk: '#2A2118', canopy: '#3CC86B', accent: '#FF4FD8' };

var PROMPTS = [
  'an astronaut drifting above the earth, cinematic',
  'a coral reef breathing in slow currents',
  'a neon forest after rain, glowing paths'
];
var CHORDS = [ [220.0, 277.18, 329.63], [196.0, 246.94, 293.66], [174.61, 220.0, 261.63] ];

/* ---------- scene construction (seeded shape lists) ---------- */
function buildAstronaut() {
  var rnd = mulberry32(97801);
  var s = { stars: [], tools: [], swirls: [] };
  var i;
  for (i = 0; i < 46; i++) s.stars.push({ x: rnd() * 1000, y: rnd() * 1000, r: 0.8 + rnd() * 1.6 });
  for (i = 0; i < 7; i++) {
    s.tools.push({
      x: 180 + rnd() * 640, y: 180 + rnd() * 480, w: 10 + rnd() * 22, h: 5 + rnd() * 9,
      rot: rnd() * Math.PI, ph: rnd() * 6.28, sp: 0.11 + rnd() * 0.2, amp: 6 + rnd() * 12, round: rnd() > 0.5
    });
  }
  for (i = 0; i < 5; i++) {
    s.swirls.push({ dx: (rnd() - 0.5) * 120, dy: (rnd() - 0.5) * 90, r: 34 + rnd() * 96, a0: rnd() * 6.28, a1: 1.1 + rnd() * 1.8 });
  }
  return s;
}
function buildReef() {
  var rnd = mulberry32(97802);
  var s = { corals: [], fans: [], fish: [], sandPts: [] };
  var i, j;
  for (i = 0; i < 7; i++) {
    var bx = 90 + rnd() * 820, branches = [], nb = 5 + Math.floor(rnd() * 4);
    for (j = 0; j < nb; j++) {
      var ang = -Math.PI / 2 + (rnd() - 0.5) * 1.5, len = 60 + rnd() * 130;
      branches.push({ ang: ang, len: len, x2: bx + Math.cos(ang) * len * 0.55 + (rnd() - 0.5) * 30, y2: 905 - Math.abs(Math.sin(ang)) * len * 0.55, len2: len * (0.35 + rnd() * 0.3), ang2: ang + (rnd() - 0.5) * 0.9 });
    }
    s.corals.push({ x: bx, y: 905, branches: branches, big: rnd() > 0.5 });
  }
  for (i = 0; i < 5; i++) s.fans.push({ x: 120 + rnd() * 760, y: 830 + rnd() * 70, r: 34 + rnd() * 44, n: 6 + Math.floor(rnd() * 4) });
  for (i = 0; i < 26; i++) s.fish.push({ x: rnd() * 1000, y: 120 + rnd() * 520, ph: rnd() * 6.28, sp: 0.05 + rnd() * 0.12, amp: 14 + rnd() * 30, s: 2.2 + rnd() * 3.2, warm: rnd() > 0.5 });
  for (i = 0; i <= 20; i++) s.sandPts.push({ x: i * 50, y: 905 + Math.sin(i * 1.7) * 12 + rnd() * 8 });
  return s;
}
function buildForest() {
  var rnd = mulberry32(97803);
  var s = { trunks: [], dots: [], path: [] };
  var i, j;
  for (i = 0; i < 11; i++) {
    var tx = 60 + rnd() * 880, th = 380 + rnd() * 300;
    var blobs = [], nb = 3 + Math.floor(rnd() * 3);
    for (j = 0; j < nb; j++) blobs.push({ dx: (rnd() - 0.5) * 130, dy: (rnd() - 0.5) * 80, r: 26 + rnd() * 46, mag: rnd() > 0.78 });
    s.trunks.push({ x: tx, top: 960 - th, lean: (rnd() - 0.5) * 36, w: 7 + rnd() * 9, blobs: blobs });
  }
  for (i = 0; i < 34; i++) s.dots.push({ x: rnd() * 1000, y: rnd() * 1000, ph: rnd() * 6.28, r: 1 + rnd() * 2.2, mag: rnd() > 0.8 });
  for (i = 0; i < 16; i++) s.path.push({ x: 60 + i * 58 + rnd() * 22, y: 918 - Math.abs(i - 7.5) * 7 + rnd() * 10, mag: i % 4 === 3 });
  return s;
}
var ASTRO = buildAstronaut(), REEF = buildReef(), FOREST = buildForest();

/* ---------- state ---------- */
var base = { idx: 0, start: 0 };       // cycle base: scene idx at piece time base.start
var blinkT = -10;                      // last tap-advance time (mirror blink)
var wakeT = -100;                      // last double-tap time (clean mirror)
var pendingTap = -10;                  // tap awaiting double-tap disambiguation
var drag = null;                       // {x0, t0, dx}
var easeBack = null;                   // {t0, w}
var lastIdx = 0, lastTyped = -1;

function cycleAt(T) {
  var el = T - base.start;
  var k = Math.floor(el / CYCLE);
  return { idx: (((base.idx + k) % 3) + 3) % 3, phase: el - k * CYCLE };
}
function advance(T) {
  var c = cycleAt(T);
  base.idx = (c.idx + 1) % 3;
  base.start = T;
  blinkT = T;
  easeBack = null;
}
function dragWeight(T) {
  if (drag && Math.abs(drag.dx) > 8) return Math.min(1, Math.abs(drag.dx) / (0.35 * W));
  if (easeBack) return easeBack.w * Math.max(0, 1 - (T - easeBack.t0) / 0.4);
  return 0;
}
function wakeFactor(T) {
  var t = T - wakeT;
  if (t < 0 || t > 10) return 1;
  if (t < 0.8) return 1 - t / 0.8;
  if (t < 8) return 0;
  return (t - 8) / 2;
}

/* ---------- audio (lazy, gesture-born, guarded) ---------- */
var AC = null, washGain = null, muted = false;
function audioInit() {
  if (AC) return;
  if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
  try {
    var Ctor = AudioContext || webkitAudioContext;
    AC = new Ctor();
    var len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    var r = mulberry32(978);
    for (var i = 0; i < len; i++) d[i] = r() * 2 - 1;
    var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    var flt = AC.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 420;
    washGain = AC.createGain(); washGain.gain.value = muted ? 0 : 0.028;
    src.connect(flt); flt.connect(washGain); washGain.connect(AC.destination);
    src.start();
  } catch (e) { AC = null; }
}
function tick() {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = 1900;
    g.gain.setValueAtTime(0.012, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.03);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + 0.04);
  } catch (e) {}
}
function chord(idx) {
  if (!AC) return;
  try {
    var t = AC.currentTime, notes = CHORDS[idx];
    for (var i = 0; i < notes.length; i++) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.value = notes[i];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.035, t + 0.9);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + 3.3);
    }
  } catch (e) {}
}

/* ---------- sizing ---------- */
function isPhone() {
  try {
    if (typeof screen !== 'undefined' && screen && Math.min(screen.width, screen.height) < 700) return true;
  } catch (e) {}
  return H > W * 1.15;
}
function fit() {
  var vw = W, vh = H;
  if (typeof visualViewport !== 'undefined' && visualViewport) { vw = visualViewport.width; vh = visualViewport.height; }
  else if (typeof window !== 'undefined') { vw = window.innerWidth; vh = window.innerHeight; }
  W = Math.max(50, Math.round(vw)); H = Math.max(50, Math.round(vh));
  canvas.width = W; canvas.height = H;
}
if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) visualViewport.addEventListener('resize', fit);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', fit);

/* ---------- drawing helpers ---------- */
function shim(i, bucket) {  // near-consistency flicker, ~1.5 px, 0.4 s hash clock
  return {
    x: (hashN(i * 131 + bucket * 7919) - 0.5) * 3,
    y: (hashN(i * 197 + bucket * 104729 + 31) - 0.5) * 3
  };
}
function drawAstronaut(s, alpha, bucket, T, drift) {
  var i, o;
  ctx.save();
  ctx.translate(drift.x, drift.y);
  // panel grid
  ctx.strokeStyle = A.panels; ctx.lineWidth = 1.1; ctx.globalAlpha = alpha * 0.30;
  ctx.beginPath();
  for (i = 0; i <= 8; i++) { ctx.moveTo(i * 125, 0); ctx.lineTo(i * 125, 1000); }
  for (i = 0; i <= 8; i++) { ctx.moveTo(0, i * 125); ctx.lineTo(1000, i * 125); }
  ctx.stroke();
  // a few panel outlines, heavier
  ctx.globalAlpha = alpha * 0.5; ctx.lineWidth = 1.6;
  var cells = [[1, 1], [5, 0], [6, 3], [0, 4], [3, 5], [7, 6]];
  for (i = 0; i < cells.length; i++) {
    o = shim(40 + i, bucket);
    ctx.strokeRect(cells[i][0] * 125 + 9 + o.x, cells[i][1] * 125 + 9 + o.y, 107, 107);
  }
  // stars
  ctx.fillStyle = A.glow;
  for (i = 0; i < s.stars.length; i++) {
    o = shim(100 + i, bucket);
    ctx.globalAlpha = alpha * 0.5;
    ctx.beginPath(); ctx.arc(s.stars[i].x + o.x, s.stars[i].y + o.y, s.stars[i].r, 0, 6.2832); ctx.fill();
  }
  // porthole
  o = shim(90, bucket);
  ctx.globalAlpha = alpha * 0.85; ctx.strokeStyle = A.panels; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(668 + o.x, 272 + o.y, 88, 0, 6.2832); ctx.stroke();
  ctx.globalAlpha = alpha * 0.35; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(668 + o.x, 272 + o.y, 73, 0, 6.2832); ctx.stroke();
  ctx.fillStyle = A.earth; ctx.globalAlpha = alpha * 0.5;
  ctx.beginPath(); ctx.arc(684 + o.x, 286 + o.y, 28, 0, 6.2832); ctx.fill();
  // earth: low and wide, so its disc reads around the standing figure
  o = shim(91, bucket);
  ctx.fillStyle = A.earth; ctx.globalAlpha = alpha * 0.95;
  ctx.beginPath(); ctx.arc(478 + o.x, 762 + o.y, 182, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = A.glow; ctx.globalAlpha = alpha * 0.4; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(478 + o.x, 762 + o.y, 186, 0, 6.2832); ctx.stroke();
  ctx.lineWidth = 6;
  for (i = 0; i < s.swirls.length; i++) {
    var sw = s.swirls[i];
    ctx.globalAlpha = alpha * 0.30;
    ctx.beginPath(); ctx.arc(478 + sw.dx + o.x, 762 + sw.dy + o.y, sw.r, sw.a0, sw.a0 + sw.a1); ctx.stroke();
  }
  // floating tools
  ctx.fillStyle = A.tools;
  for (i = 0; i < s.tools.length; i++) {
    var tl = s.tools[i];
    o = shim(200 + i, bucket);
    var px = tl.x + Math.sin(T * tl.sp + tl.ph) * tl.amp + o.x;
    var py = tl.y + Math.cos(T * tl.sp * 0.8 + tl.ph) * tl.amp * 0.7 + o.y;
    ctx.save(); ctx.translate(px, py); ctx.rotate(tl.rot + Math.sin(T * 0.1 + tl.ph) * 0.2);
    ctx.globalAlpha = alpha * 0.85;
    if (tl.round) { ctx.beginPath(); ctx.arc(0, 0, tl.w * 0.4, 0, 6.2832); ctx.fill(); }
    else ctx.fillRect(-tl.w / 2, -tl.h / 2, tl.w, tl.h);
    ctx.restore();
  }
  ctx.restore();
}
function drawReef(s, alpha, bucket, T, drift) {
  var i, j, o;
  ctx.save();
  ctx.translate(drift.x, drift.y);
  // sea wash
  ctx.fillStyle = R.sea; ctx.globalAlpha = alpha * 0.5;
  ctx.fillRect(-40, -40, 1080, 1080);
  // light shafts
  ctx.fillStyle = A.glow; ctx.globalAlpha = alpha * 0.05;
  for (i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(180 + i * 260, -20); ctx.lineTo(300 + i * 260, -20); ctx.lineTo(430 + i * 260, 1020); ctx.lineTo(240 + i * 260, 1020);
    ctx.closePath(); ctx.fill();
  }
  // sand band
  ctx.fillStyle = R.sand; ctx.globalAlpha = alpha * 0.75;
  ctx.beginPath(); ctx.moveTo(-40, 1040); ctx.lineTo(-40, s.sandPts[0].y);
  for (i = 0; i < s.sandPts.length; i++) ctx.lineTo(s.sandPts[i].x, s.sandPts[i].y);
  ctx.lineTo(1040, 1040); ctx.closePath(); ctx.fill();
  // coral fans
  ctx.strokeStyle = R.coral; ctx.lineWidth = 3;
  for (i = 0; i < s.fans.length; i++) {
    var fn = s.fans[i]; o = shim(300 + i, bucket);
    ctx.globalAlpha = alpha * 0.55;
    for (j = 0; j < fn.n; j++) {
      var fa = -Math.PI + (j / (fn.n - 1)) * Math.PI;
      ctx.beginPath(); ctx.moveTo(fn.x + o.x, fn.y + o.y);
      ctx.lineTo(fn.x + o.x + Math.cos(fa) * fn.r, fn.y + o.y + Math.sin(fa) * fn.r); ctx.stroke();
    }
  }
  // branching corals
  ctx.lineWidth = 4;
  for (i = 0; i < s.corals.length; i++) {
    var co = s.corals[i]; o = shim(330 + i, bucket);
    ctx.strokeStyle = co.big ? R.coral : R.sand;
    ctx.globalAlpha = alpha * 0.8;
    for (j = 0; j < co.branches.length; j++) {
      var b = co.branches[j];
      ctx.beginPath();
      ctx.moveTo(co.x + o.x, co.y + o.y);
      ctx.lineTo(b.x2 + o.x, b.y2 + o.y);
      ctx.lineTo(b.x2 + o.x + Math.cos(b.ang2) * b.len2, b.y2 + o.y - Math.abs(Math.sin(b.ang2)) * b.len2);
      ctx.stroke();
    }
  }
  // fish specks
  for (i = 0; i < s.fish.length; i++) {
    var f = s.fish[i]; o = shim(400 + i, bucket);
    var fx = f.x + Math.sin(T * f.sp + f.ph) * f.amp + o.x;
    var fy = f.y + Math.cos(T * f.sp * 0.7 + f.ph) * f.amp * 0.4 + o.y;
    ctx.fillStyle = f.warm ? R.sand : A.glow;
    ctx.globalAlpha = alpha * 0.7;
    ctx.beginPath(); ctx.ellipse(fx, fy, f.s, f.s * 0.45, 0, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}
function drawForest(s, alpha, bucket, T, drift) {
  var i, j, o;
  ctx.save();
  ctx.translate(drift.x, drift.y);
  // deep ground wash
  ctx.fillStyle = F.trunk; ctx.globalAlpha = alpha * 0.35;
  ctx.fillRect(-40, -40, 1080, 1080);
  // glowing path dots (behind trunks)
  for (i = 0; i < s.path.length; i++) {
    var p = s.path[i]; o = shim(500 + i, bucket);
    ctx.fillStyle = p.mag ? F.accent : A.glow;
    ctx.globalAlpha = alpha * (0.35 + 0.2 * Math.sin(T * 0.7 + i));
    ctx.beginPath(); ctx.arc(p.x + o.x, p.y + o.y, 4.5, 0, 6.2832); ctx.fill();
  }
  // trunks + canopies
  for (i = 0; i < s.trunks.length; i++) {
    var tr = s.trunks[i]; o = shim(530 + i, bucket);
    ctx.strokeStyle = F.trunk; ctx.lineWidth = tr.w; ctx.globalAlpha = alpha * 0.95;
    ctx.beginPath(); ctx.moveTo(tr.x + o.x, 985);
    ctx.quadraticCurveTo(tr.x + tr.lean * 0.4 + o.x, (tr.top + 985) / 2, tr.x + tr.lean + o.x, tr.top + o.y); ctx.stroke();
    for (j = 0; j < tr.blobs.length; j++) {
      var bl = tr.blobs[j];
      ctx.fillStyle = bl.mag ? F.accent : F.canopy;
      ctx.globalAlpha = alpha * (bl.mag ? 0.4 : 0.5);
      ctx.beginPath(); ctx.arc(tr.x + tr.lean + bl.dx + o.x, tr.top + bl.dy + o.y, bl.r, 0, 6.2832); ctx.fill();
    }
  }
  // fireflies
  for (i = 0; i < s.dots.length; i++) {
    var d = s.dots[i]; o = shim(600 + i, bucket);
    var dxp = d.x + Math.sin(T * 0.16 + d.ph) * 22 + o.x;
    var dyp = d.y + Math.cos(T * 0.13 + d.ph) * 16 + o.y;
    ctx.fillStyle = d.mag ? F.accent : A.glow;
    ctx.globalAlpha = alpha * (0.3 + 0.3 * (0.5 + 0.5 * Math.sin(T * 0.9 + d.ph * 3)));
    ctx.beginPath(); ctx.arc(dxp, dyp, d.r, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}
var DRAWERS = [
  function (a, b, T, d) { drawAstronaut(ASTRO, a, b, T, d); },
  function (a, b, T, d) { drawReef(REEF, a, b, T, d); },
  function (a, b, T, d) { drawForest(FOREST, a, b, T, d); }
];

function drawSilhouette(T, s) {
  var sway = Math.sin(T * 0.23) * 7;
  var bob = Math.sin(T * 0.31 + 1) * 4;
  var lean = Math.sin(T * 0.19) * 0.02;
  ctx.save();
  ctx.translate(500 + sway, 0);
  ctx.translate(0, 770); ctx.rotate(lean); ctx.translate(0, -770);
  ctx.fillStyle = SIL; ctx.globalAlpha = 1;
  // torso
  ctx.beginPath(); ctx.ellipse(0, 585 + bob, 118, 205, 0, 0, 6.2832); ctx.fill();
  // shoulders
  ctx.beginPath(); ctx.ellipse(0, 452 + bob, 138, 58, 0, 0, 6.2832); ctx.fill();
  // neck + head
  ctx.beginPath(); ctx.ellipse(0, 400 + bob, 30, 34, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 330 + bob, 64, 0, 6.2832); ctx.fill();
  // rim light, right side
  ctx.strokeStyle = RIM; ctx.lineCap = 'round';
  ctx.globalAlpha = 0.85; ctx.lineWidth = 3.2;
  ctx.beginPath(); ctx.arc(0, 330 + bob, 64, -1.15, 0.95); ctx.stroke();
  ctx.globalAlpha = 0.55; ctx.lineWidth = 3.6;
  ctx.beginPath(); ctx.ellipse(0, 585 + bob, 118, 205, 0, -1.0, 0.9); ctx.stroke();
  ctx.globalAlpha = 0.4; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(0, 452 + bob, 138, 58, 0, -1.05, 0.75); ctx.stroke();
  ctx.restore();
}

/* ---------- main draw ---------- */
function draw(T) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = MIRROR;
  ctx.fillRect(0, 0, W, H);

  var s = Math.max(W, H) / 1000;             // cover mapping, unit space 1000x1000
  var ox = (W - 1000 * s) / 2, oy = (H - 1000 * s) / 2;
  var bucket = Math.floor(T / 0.4);
  var cyc = cycleAt(T);
  var wf = wakeFactor(T);
  var breathe = 0.92 + 0.08 * Math.sin(T * 0.5 + cyc.idx * 1.7);

  ctx.save();
  ctx.translate(ox, oy); ctx.scale(s, s);

  if (wf > 0.001) {
    // crossfade / bloom between scenes in the first 3 s of a cycle
    var blend = Math.min(1, cyc.phase / 3);
    blend = blend * blend * (3 - 2 * blend);
    var dw = dragWeight(T);
    if (blend < 1) {
      var prev = (((cyc.idx - 1) % 3) + 3) % 3;
      DRAWERS[prev](wf * breathe * (1 - blend), bucket, T, { x: -14 * blend, y: 0 });
    }
    DRAWERS[cyc.idx](wf * breathe * (blend >= 1 ? 1 : blend), bucket, T, { x: 14 * (1 - blend), y: 0 });
    if (dw > 0.001) {
      var nxt = (cyc.idx + 1) % 3;
      DRAWERS[nxt](wf * dw, bucket, T, { x: 20 * (1 - dw), y: 0 });
    }
  }
  drawSilhouette(T, s);
  ctx.restore();

  // prompt, typed along the top (screen space)
  if (wf > 0.4) {
    var prompt = PROMPTS[cyc.idx];
    var typeDur = prompt.length * 0.06, delStart = 41, delDur = prompt.length * 0.03;
    var n = prompt.length;
    if (cyc.phase < typeDur) n = Math.floor(cyc.phase / 0.06);
    else if (cyc.phase > delStart) n = Math.max(0, prompt.length - Math.floor((cyc.phase - delStart) / 0.03));
    var shown = prompt.slice(0, n);
    if (cyc.phase < typeDur) shown += '_';
    lastTyped = n;
    var fs = Math.round(Math.max(12, Math.min(20, W * (isPhone() ? 0.03 : 0.018))));
    ctx.font = fs + 'px monospace';
    ctx.fillStyle = PROMPT_COL;
    ctx.globalAlpha = 0.92 * wf;
    ctx.fillText(shown, Math.max(14, W * 0.04), fs + 16);
    ctx.globalAlpha = 1;
  } else lastTyped = -1;

  // mirror blink (tap advance): a short dark dip
  var bt = T - blinkT;
  if (bt >= 0 && bt < 0.2) {
    ctx.fillStyle = '#000000';
    ctx.globalAlpha = 0.8 * (1 - bt / 0.2);
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // audio side effects, driven by state changes only
  if (AC) {
    if (cyc.idx !== lastIdx) { chord(cyc.idx); lastIdx = cyc.idx; }
    if (lastTyped >= 0 && typeof draw._pt === 'number' && lastTyped > draw._pt && cyc.phase < 4) tick();
    if (washGain) { var target = (wf < 0.4) ? 0 : 0.028; try { washGain.gain.setTargetAtTime(target, AC.currentTime, 0.3); } catch (e) {} }
  }
  draw._pt = lastTyped;
  if (!AC) lastIdx = cyc.idx;
}

/* ---------- interaction ---------- */
function pieceNow() { return draw._T || T0; }
function onDown(e) {
  audioInit();
  if (AC && AC.resume) { try { AC.resume(); } catch (err) {} }
  drag = { x0: e.clientX, t0: pieceNow(), dx: 0 };
}
function onMove(e) {
  if (drag) drag.dx = e.clientX - drag.x0;
}
function onUp(e) {
  if (!drag) return;
  var T = pieceNow();
  var adx = Math.abs(drag.dx);
  var dt = T - drag.t0;
  if (adx > 8) {
    var w = Math.min(1, adx / (0.35 * W));
    if (w >= 0.5) advance(T);
    else easeBack = { t0: T, w: w };
  } else if (dt < 0.45) {
    if (pendingTap > 0 && T - pendingTap <= 0.35) { wakeT = T; pendingTap = -10; }
    else pendingTap = T;
  }
  drag = null;
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { drag = null; });
}

/* ---------- run ---------- */
fit();
draw._T = T0;
draw(T0);
if (typeof requestAnimationFrame === 'function') {
  var lastTs = null;
  var step = function (ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;
    draw._T += dt;
    var T = draw._T;
    if (pendingTap > 0 && T - pendingTap > 0.35) { advance(T); pendingTap = -10; }
    draw(T);
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
</script>
</body>
