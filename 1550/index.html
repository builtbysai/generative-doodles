<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atoms From Then to Now</title>
<style>
html, body { margin: 0; padding: 0; background: #232830; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var LOOP = 240;
var SXF = 0.42;
var NP = 26;
var COOL = [122, 138, 154];
var FLASHC = [240, 232, 208];
var LEFT_BG = '#232830';
var RIGHT_BG = '#2a2118';
var SEAM_C = '#6a6258';

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function a4(v) {
  if (v < 0) v = 0;
  if (v > 1) v = 1;
  return Math.round(v * 10000) / 10000;
}
function rgbaStr(rgb, a) {
  return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a4(a) + ')';
}
function lerpC(a, b, f) {
  return [Math.round(a[0] + (b[0] - a[0]) * f), Math.round(a[1] + (b[1] - a[1]) * f), Math.round(a[2] + (b[2] - a[2]) * f)];
}
function gauss(d, s) {
  var z = d / s;
  return Math.exp(-0.5 * z * z);
}

var rng = mulberry32(1550000);
var P = [];
for (var i = 0; i < NP; i++) {
  P.push({
    y: 0.06 + rng() * 0.88,
    x0: rng(),
    laps: 1 + Math.floor(rng() * 3),
    r: 2 + rng() * 2.5,
    warm: (rng() < 0.5) ? [232, 176, 75] : [201, 168, 106]
  });
}
var pSessions = [];
for (var j = 0; j < NP; j++) pSessions.push([]);
var seamSessions = [];
var dragP = -1;
var dragSeam = -1;

var VW = 0, VH = 0, canvas = null, ctx = null;
var t0 = null, lastT = 0, lastState = null;

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  if (!vw) { vw = 720; vh = 720; }
  VW = vw; VH = vh;
  if (canvas) {
    canvas.width = VW; canvas.height = VH;
    canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  }
}
function seamX() { return Math.round(SXF * VW); }

function boostAt(t, sessions) {
  var b = 0;
  for (var k = 0; k < sessions.length; k++) {
    var s = sessions[k];
    if (t < s.grabT) break;
    if (s.releaseT === null || t < s.releaseT) {
      b = s.startBoost + 2 * (t - s.grabT);
      break;
    }
    var bRel = s.startBoost + 2 * (s.releaseT - s.grabT);
    if (t < s.releaseT + 3) {
      b = bRel * (1 - (t - s.releaseT) / 3);
    } else {
      b = 0;
    }
  }
  return b;
}
function seamBendAt(t) {
  var bend = 0;
  for (var k = 0; k < seamSessions.length; k++) {
    var s = seamSessions[k];
    if (t < s.grabT) continue;
    var lastDx = 0, lastY = s.grabY;
    for (var m = 0; m < s.moves.length; m++) {
      if (s.moves[m].t <= t) { lastDx = s.moves[m].dx; lastY = s.moves[m].y; }
    }
    if (s.releaseT === null || t < s.releaseT) {
      bend = lastDx;
    } else {
      if (t < s.releaseT + 2) {
        bend = lastDx * (1 - (t - s.releaseT) / 2);
      } else {
        bend = 0;
      }
    }
  }
  return bend;
}
function seamBendYAt(t) {
  var by = 0.5 * VH;
  for (var k = 0; k < seamSessions.length; k++) {
    var s = seamSessions[k];
    if (t < s.grabT) continue;
    var lastY = s.grabY;
    for (var m = 0; m < s.moves.length; m++) {
      if (s.moves[m].t <= t) lastY = s.moves[m].y;
    }
    by = lastY;
  }
  return by;
}
function seamEffAt(t, yPx) {
  var bend = seamBendAt(t);
  var by = seamBendYAt(t);
  return seamX() + bend * gauss(yPx - by, 0.12 * VH);
}

function particleState(p, idx, tAbs) {
  var tLoop = ((tAbs % LOOP) + LOOP) % LOOP;
  var boost = boostAt(tAbs, pSessions[idx]);
  var u = p.x0 + p.laps * (tLoop + boost) / LOOP;
  u = u - Math.floor(u);
  var x = u * VW;
  var y = p.y * VH;
  var s = Math.min(VW, VH) / 720;
  var se = seamEffAt(tAbs, y);
  var d = (x - se) / VW;
  var r0 = p.r * s;
  var col, rad;
  if (d <= 0) { col = COOL; rad = r0; }
  else if (d >= 0.035) { col = p.warm; rad = r0 * 1.6; }
  else {
    var f = d / 0.035;
    col = lerpC(COOL, p.warm, f);
    rad = r0 * (1 + 0.6 * f);
  }
  var flash = 0.9 * Math.exp(-Math.abs(d) / 0.008);
  var alpha = 1;
  if (u >= 0.86 && u < 0.98) alpha = (0.98 - u) / 0.12;
  else if (u >= 0.98) alpha = 0;
  var side = (d < 0) ? 'then' : ((d >= 0.035) ? 'now' : 'crossing');
  return { x: x, y: y, r: rad, r0: r0, col: col, flash: flash, alpha: alpha, u: u, d: d, side: side, seamEff: se };
}

function draw(tAbs) {
  lastT = tAbs;
  if (!ctx) return;
  var sx = seamX();
  ctx.fillStyle = LEFT_BG;
  ctx.fillRect(0, 0, sx, VH);
  ctx.fillStyle = RIGHT_BG;
  ctx.fillRect(sx, 0, VW - sx, VH);
  var bend = seamBendAt(tAbs);
  var by = seamBendYAt(tAbs);
  ctx.strokeStyle = 'rgba(106,98,88,0.85)';
  ctx.lineWidth = 2;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  var first = true;
  for (var y = 0; y <= VH; y += 8) {
    var bx = sx + bend * gauss(y - by, 0.12 * VH);
    if (first) { ctx.moveTo(bx, y); first = false; }
    else { ctx.lineTo(bx, y); }
  }
  ctx.stroke();
  var parts = [];
  for (var i = 0; i < NP; i++) {
    var st = particleState(P[i], i, tAbs);
    parts.push(st);
    if (st.alpha <= 0) continue;
    if (st.flash > 0.02) {
      ctx.fillStyle = rgbaStr(FLASHC, st.flash * st.alpha * 0.85);
      ctx.beginPath();
      ctx.moveTo(st.x + st.r * 2.6, st.y);
      ctx.arc(st.x, st.y, st.r * 2.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = rgbaStr(st.col, st.alpha);
    ctx.beginPath();
    ctx.moveTo(st.x + st.r, st.y);
    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    ctx.fill();
  }
  lastState = { t: tAbs, particles: parts, seamBend: bend, seamBendY: by, seamX: sx };
}

function nearestParticle(x, y) {
  if (!lastState) return -1;
  var s = Math.min(VW, VH) / 720;
  var best = -1, bestD = 22 * s;
  for (var i = 0; i < NP; i++) {
    var st = lastState.particles[i];
    if (st.alpha <= 0) continue;
    var dx = st.x - x, dy = st.y - y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist <= bestD + st.r) { best = i; bestD = dist; }
  }
  return best;
}
function onDown(e) {
  var x = e.clientX, y = e.clientY;
  var idx = nearestParticle(x, y);
  if (idx >= 0) {
    dragP = idx;
    pSessions[idx].push({ grabT: lastT, releaseT: null, startBoost: boostAt(lastT, pSessions[idx]) });
    return;
  }
  var s = Math.min(VW, VH) / 720;
  if (Math.abs(x - seamX()) <= 16 * s) {
    dragSeam = 1;
    seamSessions.push({ grabT: lastT, releaseT: null, grabY: y, moves: [{ t: lastT, dx: 0, y: y }] });
  }
}
function onMove(e) {
  if (dragSeam >= 0 && seamSessions.length > 0) {
    var s = seamSessions[seamSessions.length - 1];
    if (s.releaseT === null) {
      var maxB = 0.03 * VW;
      var dx = e.clientX - seamX();
      if (dx > maxB) dx = maxB;
      if (dx < -maxB) dx = -maxB;
      s.moves.push({ t: lastT, dx: dx, y: e.clientY });
    }
  }
}
function onUp() {
  if (dragP >= 0) {
    var sessions = pSessions[dragP];
    if (sessions.length > 0 && sessions[sessions.length - 1].releaseT === null) {
      sessions[sessions.length - 1].releaseT = lastT;
    }
    dragP = -1;
  }
  if (dragSeam >= 0) {
    if (seamSessions.length > 0 && seamSessions[seamSessions.length - 1].releaseT === null) {
      seamSessions[seamSessions.length - 1].releaseT = lastT;
    }
    dragSeam = -1;
  }
}

function loop(ms) {
  if (t0 === null) t0 = ms;
  var t = (ms - t0) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}

if (typeof document !== 'undefined') {
  canvas = document.getElementById('c');
  if (canvas) {
    ctx = canvas.getContext('2d');
    size();
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.addEventListener) {
        window.visualViewport.addEventListener('resize', size);
      }
      if (window.addEventListener) window.addEventListener('resize', size);
    }
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }
  }
}
draw(0);
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

if (typeof window !== 'undefined') {
  window.__p50 = {
    loop: LOOP,
    seamFrac: SXF,
    state: function () { return lastState; },
    seamEffAt: function (yPx) { return seamEffAt(lastT, yPx); },
    boostAt: function (idx, t) { return boostAt(t, pSessions[idx]); },
    particles: function () { return lastState ? lastState.particles : []; }
  };
}
})();
</script>
</body>
</html>
