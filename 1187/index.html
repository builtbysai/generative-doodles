<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rock Speaker Garden (4 Hours)</title>
<style>
  html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ===== Rock Speaker Garden (4 Hours) — Jeff Kolar study block JK4 =====
  // A top-down plan of the courtyard installation: ten speaker monoliths on
  // a dashed S-curve path, each broadcasting its own track as expanding
  // rings in its own colour and cadence. Where two zones' rings cross, the
  // crossing points flare white — multichannel bleed. A ghost visitor walks
  // the path at constant speed; the zone it stands in lights up. Four hours
  // of programme are compressed into a three-minute cycle. The tracks are
  // drawn, never heard: the piece is silent. Drag pans the plan; the walk
  // keeps its own course.

  // ---------- seeded RNG (mulberry32 only) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- plan space ----------
  var PW = 1600, PH = 1000;              // plan units
  var ZR = PW * 0.12;                    // zone radius (~12% of plan width)
  var CYCLE = 180;                       // 3 minutes stand in for 4 hours
  var PROG_SECONDS = 4 * 3600;           // the full programme: 4:00:00
  var VIS_OFF = 0.16;                    // the walk's phase in the cycle

  var ZONE_COLORS = ['#FF2B6E', '#00FFC2', '#FFE14D', '#7C5CFF', '#FF8A00',
                     '#4DD2FF', '#B8FF2E', '#FF5C5C', '#C77B3F', '#4D9FFF'];

  var GROUND = '#141210';
  var MONO_FILL = '#1E1C19';
  var MONO_EDGE = '#3A352E';
  var MONO_EDGE_LIT = '#D8C9A3';
  var PATH_INK = '#8A7F6A';
  var LABEL_DIM = '#7A7060';
  var LABEL_LIT = '#EDE4CE';
  var HEADER_INK = '#CFC6B2';
  var CLOCK_INK = '#9A8F7A';
  var HINT_INK = '#57503F';

  // S-curve spine: x sweeps 8%..92% of the plan, y rides one smooth S.
  function spine(u) {
    return {
      x: PW * (0.08 + 0.84 * u),
      y: PH * (0.5 + 0.27 * Math.sin((u - 0.5) * Math.PI * 1.6))
    };
  }
  function spinePerp(u) {
    var e = 0.001;
    var a = spine(Math.max(0, u - e)), b = spine(Math.min(1, u + e));
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    return { x: -dy / len, y: dx / len };
  }

  // ---------- zones (fixed at load, seeded) ----------
  var zones = [];
  (function buildZones() {
    var rng = mulberry32(1187041);
    for (var i = 0; i < 10; i++) {
      var u = 0.045 + i * (0.91 / 9) + (rng() - 0.5) * 0.036;
      var p = spine(u);
      var n = spinePerp(u);
      var off = (rng() - 0.5) * 92;               // perpendicular jitter
      zones.push({
        u: u,
        x: p.x + n.x * off,
        y: p.y + n.y * off,
        color: ZONE_COLORS[i],
        cadence: 2.2 + rng() * 2.3,               // 2.2 .. 4.5 s per ring
        phase: rng()                                // ring phase offset 0..1
      });
    }
  })();

  // ---------- gravel (fixed at load, seeded) ----------
  var speckles = [];
  var patches = [];
  (function buildGround() {
    var rng = mulberry32(1187097);
    for (var i = 0; i < 620; i++) {
      speckles.push({
        x: rng() * PW, y: rng() * PH,
        s: 1.6 + rng() * 2.4,
        tone: rng() < 0.5 ? '#1E1A16' : '#0D0B09',
        a: 0.45 + rng() * 0.45
      });
    }
    for (var j = 0; j < 12; j++) {
      patches.push({
        x: rng() * PW, y: rng() * PH,
        rx: 90 + rng() * 170, ry: 40 + rng() * 70,
        rot: rng() * Math.PI,
        tone: rng() < 0.5 ? '#221D17' : '#0B0908',
        a: 0.05 + rng() * 0.02
      });
    }
  })();

  // ---------- rings & bleed ----------
  // Two rings per zone, half a cadence apart; radius is a pure function of t.
  function zoneRings(z, t) {
    var out = [];
    for (var k = 0; k < 2; k++) {
      var p = ((t / z.cadence + z.phase + k * 0.5) % 1 + 1) % 1;
      out.push({ x: z.x, y: z.y, r: p * ZR, p: p, color: z.color });
    }
    return out;
  }
  var lastBleedCount = 0;
  function bleedPoints(t) {
    var rings = [];
    for (var i = 0; i < zones.length; i++) rings.push(zoneRings(zones[i], t));
    var pts = [];
    for (var a = 0; a < zones.length; a++) {
      for (var b = a + 1; b < zones.length; b++) {
        var A = zones[a], B = zones[b];
        var dx = B.x - A.x, dy = B.y - A.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < 0.5) continue;
        for (var ra = 0; ra < 2; ra++) {
          for (var rb = 0; rb < 2; rb++) {
            var r1 = rings[a][ra].r, r2 = rings[b][rb].r;
            if (r1 < 4 || r2 < 4) continue;
            if (d >= r1 + r2 - 1 || d <= Math.abs(r1 - r2) + 1) continue;
            var s = (r1 * r1 - r2 * r2 + d * d) / (2 * d);
            var h2 = r1 * r1 - s * s;
            if (h2 <= 0) continue;
            var h = Math.sqrt(h2);
            var mx = A.x + s * dx / d, my = A.y + s * dy / d;
            var ox = -dy / d * h, oy = dx / d * h;
            pts.push({ x: mx + ox, y: my + oy });
            pts.push({ x: mx - ox, y: my - oy });
          }
        }
      }
    }
    lastBleedCount = pts.length;
    return pts;
  }

  // ---------- visitor ----------
  function visitorU(t) {
    var s = (t / CYCLE + VIS_OFF) % 1;
    return s < 0 ? s + 1 : s;
  }

  // ---------- canvas / viewport (house boilerplate) ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var T0 = 64.0; // fixed first-frame phase: clock ~1:25:20, visitor by zone 06
  var currentT = T0;

  function viewW() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    if (vv && vv.width) return vv.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    if (vv && vv.height) return vv.height;
    return window.innerHeight || 600;
  }
  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw || 9999, sh || 9999);
    if (mn < 700) return true;
    return H > W * 1.15;
  }
  function fit() {
    W = viewW(); H = viewH();
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    var bw = Math.round(W * DPR), bh = Math.round(H * DPR);
    if (canvas.width !== bw) canvas.width = bw;
    if (canvas.height !== bh) canvas.height = bh;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(currentT); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { fit(); draw(currentT); });
  }

  // ---------- pan (drag; the walk stays its own course) ----------
  var panX = 0, panY = 0;
  var dragging = false, dragSX = 0, dragSY = 0, panSX = 0, panSY = 0;
  function clampPan() {
    var mx = W * 0.15, my = H * 0.15;
    if (panX > mx) panX = mx; if (panX < -mx) panX = -mx;
    if (panY > my) panY = my; if (panY < -my) panY = -my;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true; dragSX = e.clientX; dragSY = e.clientY; panSX = panX; panSY = panY;
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      panX = panSX + (e.clientX - dragSX);
      panY = panSY + (e.clientY - dragSY);
      clampPan();
      draw(currentT);
    });
    canvas.addEventListener('pointerup', function () { dragging = false; });
    canvas.addEventListener('pointercancel', function () { dragging = false; });
  }

  // ---------- drawing ----------
  function circlePath(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, 6.283185307179586);
  }

  function fmtClock(t) {
    var e = Math.floor(((t % CYCLE) + CYCLE) % CYCLE / CYCLE * PROG_SECONDS);
    var hh = Math.floor(e / 3600);
    var mm = Math.floor((e % 3600) / 60);
    var ss = e % 60;
    return hh + ':' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
  }

  function draw(t) {
    currentT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var phone = isPhone();

    var headerH = phone ? 46 : 54;
    var planTop = headerH + 6;
    var availH = Math.max(120, H - planTop - 10);
    // On portrait phones the wide plan is turned 90° so its long axis runs
    // down the screen; the pan offset is applied in screen space first, so
    // dragging still moves the plan the way the finger moves.
    var rotated = phone && H > W * 1.15;

    ctx.save();
    if (rotated) {
      var kr = Math.min(availH / PW, W / PH);
      ctx.translate(W / 2 + panX, planTop + availH / 2 + panY);
      ctx.rotate(-Math.PI / 2);
      ctx.scale(kr, kr);
      ctx.translate(-PW / 2, -PH / 2);
    } else {
      var k = Math.min(W / PW, availH / PH);
      ctx.translate((W - PW * k) / 2 + panX, planTop + (availH - PH * k) / 2 + panY);
      ctx.scale(k, k);
    }

    // gravel patches (each ellipse its own path)
    for (var pi = 0; pi < patches.length; pi++) {
      var pa = patches[pi];
      ctx.globalAlpha = pa.a;
      ctx.fillStyle = pa.tone;
      ctx.beginPath();
      ctx.ellipse(pa.x, pa.y, pa.rx, pa.ry, pa.rot, 0, 6.283185307179586);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // gravel speckle
    for (var si = 0; si < speckles.length; si++) {
      var sp = speckles[si];
      ctx.globalAlpha = sp.a;
      ctx.fillStyle = sp.tone;
      ctx.fillRect(sp.x, sp.y, sp.s, sp.s);
    }
    ctx.globalAlpha = 1;

    // dashed S-curve path
    ctx.strokeStyle = PATH_INK;
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 2.2;
    ctx.setLineDash([11, 9]);
    ctx.beginPath();
    for (var sIdx = 0; sIdx <= 200; sIdx++) {
      var pp = spine(sIdx / 200);
      if (sIdx === 0) ctx.moveTo(pp.x, pp.y); else ctx.lineTo(pp.x, pp.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    // broadcast rings
    var ringsByZone = [];
    for (var zi = 0; zi < zones.length; zi++) {
      var zr2 = zoneRings(zones[zi], t);
      ringsByZone.push(zr2);
      for (var ri = 0; ri < zr2.length; ri++) {
        var rg = zr2[ri];
        if (rg.r < 3) continue;
        ctx.globalAlpha = 0.5 * (1 - 0.55 * rg.p);
        ctx.strokeStyle = rg.color;
        ctx.lineWidth = 2.2;
        circlePath(rg.x, rg.y, rg.r);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // multichannel bleed: white flares where ring circles cross
    var bleed = bleedPoints(t);
    ctx.fillStyle = '#FFFFFF';
    for (var bi = 0; bi < bleed.length; bi++) {
      ctx.globalAlpha = 0.32;
      circlePath(bleed[bi].x, bleed[bi].y, 5.2);
      ctx.fill();
      ctx.globalAlpha = 0.16;
      circlePath(bleed[bi].x, bleed[bi].y, 10.5);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // visitor position (for zone lighting)
    var vu = visitorU(t);
    var vp = spine(vu);
    var LIT_R = ZR * 0.6;

    // monoliths + labels
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (var mi = 0; mi < zones.length; mi++) {
      var zn = zones[mi];
      var dvx = vp.x - zn.x, dvy = vp.y - zn.y;
      var lit = (dvx * dvx + dvy * dvy) < LIT_R * LIT_R;
      ctx.fillStyle = MONO_FILL;
      ctx.fillRect(zn.x - 30, zn.y - 19, 60, 38);
      ctx.fillStyle = lit ? MONO_EDGE_LIT : MONO_EDGE;
      ctx.fillRect(zn.x - 30, zn.y - 19, 60, 4);
      // speaker dot at the monolith's heart
      ctx.fillStyle = zn.color;
      ctx.globalAlpha = lit ? 0.95 : 0.55;
      circlePath(zn.x, zn.y + 3, 4.2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.font = '600 21px monospace';
      ctx.fillStyle = lit ? LABEL_LIT : LABEL_DIM;
      ctx.fillText((mi + 1 < 10 ? '0' : '') + (mi + 1), zn.x, zn.y + 26);
    }

    // ghost visitor: closed-form trail, then the dot
    for (var tk = 9; tk >= 1; tk--) {
      var tu = vu - tk * 0.0045;
      if (tu < 0) continue;
      var tp = spine(tu);
      ctx.globalAlpha = 0.4 * (1 - tk / 10);
      ctx.fillStyle = '#FFFFFF';
      circlePath(tp.x, tp.y, 4.6 - tk * 0.32);
      ctx.fill();
    }
    ctx.globalAlpha = 0.10; ctx.fillStyle = '#FFFFFF';
    circlePath(vp.x, vp.y, 15); ctx.fill();
    ctx.globalAlpha = 0.18;
    circlePath(vp.x, vp.y, 9.5); ctx.fill();
    ctx.globalAlpha = 0.95;
    circlePath(vp.x, vp.y, 4.6); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.restore();

    // ---------- header (screen space; the plan pans, the header doesn't) ----------
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, headerH + 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = (phone ? 11 : 14) + 'px monospace';
    ctx.fillStyle = HEADER_INK;
    ctx.fillText('ROCK SPEAKER GARDEN', phone ? 12 : 20, headerH - 16);
    var clock = fmtClock(t) + ' / 4:00:00';
    ctx.font = (phone ? 11 : 14) + 'px monospace';
    ctx.fillStyle = CLOCK_INK;
    var cw = ctx.measureText(clock).width;
    ctx.fillText(clock, W - cw - (phone ? 12 : 20), headerH - 16);
    // progress hairline
    var prog = (((t % CYCLE) + CYCLE) % CYCLE) / CYCLE;
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = PATH_INK;
    ctx.fillRect(0, headerH + 1, W, 1.5);
    ctx.globalAlpha = 0.85;
    ctx.fillRect(0, headerH + 1, W * prog, 1.5);
    ctx.globalAlpha = 1;
    // hint
    ctx.font = (phone ? 9 : 10) + 'px monospace';
    ctx.fillStyle = HINT_INK;
    var hint = 'drag to pan';
    var hw = ctx.measureText(hint).width;
    ctx.fillText(hint, W - hw - (phone ? 10 : 16), H - 10);
    ctx.textAlign = 'left';
  }

  // ---------- run ----------
  fit();
  draw(T0);
  var bootStamp = null;
  function frame(now) {
    if (bootStamp === null) bootStamp = now;
    draw(T0 + (now - bootStamp) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
