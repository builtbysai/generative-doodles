<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Every Surface Patterned</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#F4EBD3; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  // Design space: a landscape editorial interior, 1600 x 1000. The
  // composition keeps this shape on every screen; the page ground is
  // the cream of the wall.
  var DW = 1600, DH = 1000;

  // First frame is the synchronous draw at this constant phase: tail
  // mid-swish, laptop screen on a fixed dot bucket, lamp glow fixed.
  var PHASE0 = 2.35;
  var SEED = 501001;

  var CREAM = '#F4EBD3';
  var WHITE = '#FFFFFF';
  var SKIN  = '#F8F5F0';
  var NAVY  = '#3D5577';
  var INK   = '#2B2B2B';
  var ACCENT_POOL = ['#B2D243', '#F397BE', '#D42F8D', '#47AE65',
                     '#87CECA', '#E9A63B', '#3D5577'];
  var TEXTURES = ['dots', 'dashes', 'squiggles', 'stars', 'pinstripes', 'zigzag'];

  // Seeded RNG (mulberry32): every viewer sees the same room, every
  // QA render is byte-identical.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function luminance(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255;
    var g = parseInt(hex.slice(3, 5), 16) / 255;
    var b = parseInt(hex.slice(5, 7), 16) / 255;
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  // Mark colour that stays readable on a flat base.
  function markFor(base) {
    if (base === CREAM || base === WHITE) return NAVY;
    return luminance(base) > 0.55 ? NAVY : CREAM;
  }

  // ---------------- palette + texture assignment ----------------
  var rngMain = mulberry32(SEED);
  var ACC = shuffled(ACCENT_POOL, rngMain).slice(0, 4);

  var ADJ = {
    wall:    ['floor', 'frame', 'shade', 'sofa'],
    floor:   ['wall', 'rug', 'sofa'],
    frame:   ['wall', 'inner'],
    inner:   ['frame'],
    shade:   ['wall'],
    sofa:    ['wall', 'floor', 'rug', 'blanket', 'clothes'],
    rug:     ['floor', 'sofa', 'cat'],
    blanket: ['sofa', 'clothes', 'laptop'],
    clothes: ['sofa', 'blanket', 'laptop'],
    laptop:  ['blanket', 'clothes'],
    cat:     ['rug']
  };
  // The laptop screen is a dot field by definition (it flickers), and
  // the framed picture holds poem lines, a dash texture. Both are
  // fixed first so their neighbours avoid those textures.
  var TEX = { laptop: 'dots', inner: 'dashes' };
  (function assign() {
    var order = shuffled(['wall', 'floor', 'frame', 'shade', 'sofa',
                          'rug', 'blanket', 'clothes', 'cat'], rngMain);
    for (var k = 0; k < order.length; k++) {
      var name = order[k];
      var banned = {};
      var nb = ADJ[name];
      for (var i = 0; i < nb.length; i++) {
        if (TEX[nb[i]]) banned[TEX[nb[i]]] = 1;
      }
      var cands = shuffled(TEXTURES, rngMain);
      var pick = null, fallback = null, fallbackCount = 99;
      for (var c = 0; c < cands.length; c++) {
        if (!banned[cands[c]]) { pick = cands[c]; break; }
        var cnt = 0;
        for (var m = 0; m < nb.length; m++) if (TEX[nb[m]] === cands[c]) cnt++;
        if (cnt < fallbackCount) { fallbackCount = cnt; fallback = cands[c]; }
      }
      TEX[name] = pick || fallback;
    }
  })();

  var BASE = {
    wall: CREAM,                 floor: ACC[1],
    frame: ACC[2],               inner: WHITE,
    shade: ACC[3],               sofa: ACC[0],
    rug: ACC[3],                 blanket: ACC[2],
    clothes: ACC[1],             laptop: NAVY,
    cat: ACC[2]
  };
  // Keep big neighbours visually distinct where the seed allows:
  // the cat never matches the blanket it sits in front of, and the
  // rug takes the first accent not used by floor, sofa or cat.
  if (BASE.cat === BASE.blanket) BASE.cat = ACC[3];
  for (var bi = 0; bi < ACC.length; bi++) {
    if (ACC[bi] !== BASE.floor && ACC[bi] !== BASE.sofa && ACC[bi] !== BASE.cat) {
      BASE.rug = ACC[bi];
      break;
    }
  }

  // ---------------- path helpers (design coordinates) ----------------
  function poly(pts) {
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
  function rrect(x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function ellipse(cx, cy, rx, ry) {
    ctx.moveTo(cx + rx, cy);
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.closePath();
  }
  function circle(cx, cy, r) {
    ctx.moveTo(cx + r, cy);
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.closePath();
  }

  // Region paths. Each returns a bbox for texture coverage.
  var PATHS = {
    wall: function () {
      ctx.beginPath(); ctx.rect(0, 0, DW, 550);
      return { x: 0, y: 0, w: DW, h: 550 };
    },
    floor: function () {
      ctx.beginPath(); ctx.rect(0, 550, DW, 450);
      return { x: 0, y: 550, w: DW, h: 450 };
    },
    frame: function () {
      ctx.beginPath();
      ctx.rect(90, 70, 340, 260);
      ctx.rect(124, 104, 272, 192);
      return { x: 90, y: 70, w: 340, h: 260, evenodd: true };
    },
    inner: function () {
      ctx.beginPath(); ctx.rect(124, 104, 272, 192);
      return { x: 124, y: 104, w: 272, h: 192 };
    },
    shade: function () {
      ctx.beginPath();
      poly([[1340, 130], [1460, 130], [1506, 300], [1294, 300]]);
      return { x: 1294, y: 130, w: 212, h: 170 };
    },
    rug: function () {
      ctx.beginPath();
      poly([[280, 800], [1440, 800], [1500, 955], [220, 955]]);
      return { x: 220, y: 800, w: 1280, h: 155 };
    },
    sofa: function () {
      ctx.beginPath();
      rrect(180, 500, 800, 180, 26);   // back
      rrect(180, 640, 820, 130, 22);   // seat
      rrect(150, 580, 90, 215, 24);    // left arm
      rrect(950, 580, 90, 215, 24);    // right arm
      ctx.rect(215, 770, 26, 34);      // legs
      ctx.rect(945, 770, 26, 34);
      return { x: 150, y: 500, w: 890, h: 304 };
    },
    clothes: function () {
      ctx.beginPath();
      poly([[375, 578], [595, 650], [605, 742], [385, 690]]);        // torso
      poly([[595, 650], [922, 682], [922, 740], [605, 742]]);        // legs
      poly([[430, 600], [605, 640], [615, 674], [442, 638]]);        // arm
      ellipse(932, 713, 27, 13);                                     // shoes
      return { x: 375, y: 578, w: 584, h: 164 };
    },
    blanket: function () {
      ctx.beginPath();
      ctx.moveTo(620, 700);
      ctx.lineTo(885, 706);
      ctx.lineTo(888, 798);
      for (var x = 888; x >= 617; x -= 24) {
        ctx.lineTo(x - 12, 798 + Math.sin((x - 617) / 271 * Math.PI * 5) * 7);
        ctx.lineTo(x - 24, 798);
      }
      ctx.closePath();
      return { x: 617, y: 700, w: 271, h: 106 };
    },
    cat: function () {
      ctx.beginPath();
      ellipse(1245, 882, 80, 60);      // body
      circle(1245, 788, 47);           // head
      poly([[1212, 758], [1204, 706], [1240, 736]]);   // left ear
      poly([[1278, 758], [1286, 706], [1250, 736]]);   // right ear
      return { x: 1165, y: 706, w: 160, h: 236 };
    }
  };

  // ---------------- textures ----------------
  // Marks are laid out fresh from a per-region seed on every draw, so
  // the jitter never moves; only the animated elements (dash drift,
  // screen flicker) depend on t.
  function drawTexture(name, bb, color, seed, t) {
    var rng = mulberry32(seed);
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    var x, y, i;
    if (name === 'dots') {
      var s = 36;
      for (y = bb.y + 16; y < bb.y + bb.h - 6; y += s) {
        for (x = bb.x + 16; x < bb.x + bb.w - 6; x += s) {
          ctx.beginPath();
          ctx.arc(x + (rng() - 0.5) * 9, y + (rng() - 0.5) * 9, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (name === 'dashes') {
      var off = (t * 14) % 46;
      ctx.lineWidth = 6; ctx.lineCap = 'round';
      for (y = bb.y + 20; y < bb.y + bb.h - 8; y += 32) {
        for (x = bb.x - 46 + off + (Math.floor((y - bb.y) / 32) % 2) * 18;
             x < bb.x + bb.w; x += 46) {
          ctx.beginPath();
          ctx.moveTo(x, y); ctx.lineTo(x + 20, y);
          ctx.stroke();
        }
      }
    } else if (name === 'squiggles') {
      ctx.lineWidth = 4.5; ctx.lineCap = 'round';
      for (y = bb.y + 20; y < bb.y + bb.h - 8; y += 36) {
        var ph = rng() * Math.PI * 2;
        ctx.beginPath();
        for (x = bb.x + 4; x <= bb.x + bb.w - 4; x += 8) {
          var yy = y + Math.sin((x - bb.x) / 34 * Math.PI * 2 + ph) * 5;
          if (x === bb.x + 4) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }
    } else if (name === 'stars') {
      for (y = bb.y + 34; y < bb.y + bb.h - 12; y += 68) {
        for (x = bb.x + 34; x < bb.x + bb.w - 12; x += 68) {
          var cx = x + (rng() - 0.5) * 22, cy = y + (rng() - 0.5) * 22;
          var rot = rng() * Math.PI / 2;
          ctx.beginPath();
          for (i = 0; i < 8; i++) {
            var rr = i % 2 === 0 ? 12 : 3.6;
            var a = rot + i * Math.PI / 4;
            var px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath(); ctx.fill();
        }
      }
    } else if (name === 'pinstripes') {
      ctx.lineWidth = 4;
      for (x = bb.x + 8; x < bb.x + bb.w; x += 18) {
        ctx.beginPath();
        ctx.moveTo(x, bb.y - 4);
        ctx.lineTo(x + 12, bb.y + bb.h + 4);
        ctx.stroke();
      }
    } else if (name === 'zigzag') {
      ctx.lineWidth = 4.5; ctx.lineJoin = 'round';
      for (y = bb.y + 18; y < bb.y + bb.h - 6; y += 32) {
        ctx.beginPath();
        var up = false;
        for (x = bb.x + 4; x <= bb.x + bb.w - 4; x += 20) {
          var zy = y + (up ? -8 : 8);
          if (x === bb.x + 4) ctx.moveTo(x, zy); else ctx.lineTo(x, zy);
          up = !up;
        }
        ctx.stroke();
      }
    }
  }

  function paintRegion(name, t, markOverride) {
    var bb = PATHS[name]();
    ctx.save();
    ctx.fillStyle = BASE[name];
    if (bb.evenodd) ctx.fill('evenodd'); else ctx.fill();
    PATHS[name]();
    if (bb.evenodd) ctx.clip('evenodd'); else ctx.clip();
    if (name === 'inner') {
      drawPoemLines();
    } else {
      drawTexture(TEX[name], bb, markOverride || markFor(BASE[name]),
                  SEED + name.length * 131 + name.charCodeAt(0) * 17, t);
    }
    ctx.restore();
    PATHS[name]();
    ctx.strokeStyle = 'rgba(61,85,119,0.5)';
    ctx.lineWidth = 3;
    if (bb.evenodd) ctx.stroke('evenodd'); else ctx.stroke();
  }

  // The framed picture: a tiny poem as lines, never real text.
  function drawPoemLines() {
    var rng = mulberry32(SEED + 777);
    ctx.fillStyle = NAVY;
    var y = 138;
    var lines = 6;
    for (var i = 0; i < lines; i++) {
      var len = 90 + rng() * 140;
      if (i === lines - 1) len *= 0.55;
      if (i === 2) { y += 16; continue; }   // stanza break
      ctx.fillRect(148, y, len, 7);
      y += 26;
    }
  }

  // ---------------- faces (her grammar) ----------------
  function face(cx, cy, s, hairColor) {
    // flat hair block: a half-disc cap, slightly oversized
    ctx.beginPath();
    ctx.arc(cx, cy - 4 * s, 46 * s, Math.PI * 0.92, Math.PI * 2.08);
    ctx.closePath();
    ctx.fillStyle = hairColor;
    ctx.fill();
    // head
    ctx.beginPath();
    ctx.arc(cx, cy, 44 * s, 0, Math.PI * 2);
    ctx.fillStyle = SKIN;
    ctx.fill();
    // hair again as a cap over the top of the head
    ctx.beginPath();
    ctx.arc(cx, cy - 3 * s, 45 * s, Math.PI * 1.08, Math.PI * 1.92);
    ctx.quadraticCurveTo(cx, cy - 16 * s, cx - 45 * s * Math.cos(Math.PI * 0.08), cy - 3 * s + 45 * s * Math.sin(Math.PI * 1.08));
    ctx.closePath();
    ctx.fillStyle = hairColor;
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    // arc eyes (closed, content)
    ctx.lineWidth = 5 * s;
    ctx.beginPath();
    ctx.arc(cx - 16 * s, cy + 2 * s, 9 * s, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + 16 * s, cy + 2 * s, 9 * s, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    // L-line nose
    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.moveTo(cx + 1 * s, cy + 2 * s);
    ctx.lineTo(cx - 2 * s, cy + 13 * s);
    ctx.lineTo(cx + 5 * s, cy + 14 * s);
    ctx.stroke();
    // short-curve smile
    ctx.lineWidth = 5 * s;
    ctx.beginPath();
    ctx.arc(cx, cy + 12 * s, 13 * s, Math.PI * 0.25, Math.PI * 0.75);
    ctx.stroke();
  }

  function catFace(cx, cy, s) {
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    ctx.lineWidth = 4.5 * s;
    // arc eyes
    ctx.beginPath();
    ctx.arc(cx - 17 * s, cy, 8 * s, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + 17 * s, cy, 8 * s, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    // nose + curve mouth
    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.moveTo(cx - 4 * s, cy + 9 * s);
    ctx.lineTo(cx + 4 * s, cy + 9 * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx - 5 * s, cy + 9 * s, 5.5 * s, 0, Math.PI * 0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + 5 * s, cy + 9 * s, 5.5 * s, Math.PI * 0.15, Math.PI);
    ctx.stroke();
    // whisker dashes, 3 per side
    ctx.lineWidth = 3 * s;
    for (var i = 0; i < 3; i++) {
      var wy = cy + 2 * s + i * 7 * s;
      ctx.beginPath();
      ctx.moveTo(cx - 34 * s, wy - 4 * s);
      ctx.lineTo(cx - 52 * s, wy - 7 * s + i * 3 * s);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + 34 * s, wy - 4 * s);
      ctx.lineTo(cx + 52 * s, wy - 7 * s + i * 3 * s);
      ctx.stroke();
    }
  }

  // ---------------- the room ----------------
  function drawRoom(t) {
    paintRegion('wall', t);
    paintRegion('floor', t);
    paintRegion('frame', t);
    paintRegion('inner', t);
    paintRegion('rug', t);

    // Lamp glow: concentric low-alpha circles (light, not a fill).
    var pulse = 0.05 + 0.04 * Math.sin(t * 0.8);
    var glowR = [258, 208, 160, 116];
    for (var gi = 0; gi < glowR.length; gi++) {
      ctx.beginPath();
      ctx.arc(1400, 300, glowR[gi], 0, Math.PI * 2);
      ctx.fillStyle = '#E9A63B';
      ctx.globalAlpha = Math.max(0.01, pulse - gi * 0.008);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Lamp pole + base, then the textured shade.
    ctx.strokeStyle = NAVY;
    ctx.lineWidth = 11;
    ctx.beginPath();
    ctx.moveTo(1400, 296); ctx.lineTo(1400, 932);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(1400, 940, 56, 12, 0, 0, Math.PI * 2);
    ctx.fillStyle = NAVY;
    ctx.fill();
    paintRegion('shade', t);

    paintRegion('sofa', t);

    // Reclining figure: clothes first (textured), then head + hand.
    paintRegion('clothes', t);
    face(345, 560, 1.15, NAVY);
    ctx.beginPath();
    ctx.arc(618, 668, 14, 0, Math.PI * 2);
    ctx.fillStyle = SKIN;
    ctx.fill();

    paintRegion('blanket', t);

    // Laptop on the lap: navy body, screen of flickering dots.
    ctx.save();
    ctx.translate(706, 634);
    ctx.rotate(-0.1);
    ctx.beginPath();
    rrect(-88, -62, 176, 124, 8);
    ctx.fillStyle = NAVY;
    ctx.fill();
    ctx.beginPath();
    rrect(-74, -48, 148, 96, 5);
    ctx.fillStyle = '#87CECA';
    ctx.fill();
    ctx.clip();
    var bucket = Math.floor(t * 2.5);
    var srng = mulberry32(SEED + 5000 + bucket * 101);
    ctx.fillStyle = CREAM;
    for (var sy = -38; sy < 44; sy += 15) {
      for (var sx = -64; sx < 70; sx += 15) {
        if (srng() > 0.38) {
          ctx.beginPath();
          ctx.arc(sx, sy, 2.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.restore();

    // Cat: tail first (it swishes in a 2-frame loop), then the
    // textured body, then the face.
    var frame2 = Math.floor(t * 2.2) % 2;
    var sway = frame2 === 0 ? -20 : 20;
    ctx.beginPath();
    ctx.moveTo(1312, 902);
    ctx.quadraticCurveTo(1396, 928 + sway * 0.4, 1438, 862 + sway);
    ctx.strokeStyle = BASE.cat;
    ctx.lineWidth = 25;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(1312, 902);
    ctx.quadraticCurveTo(1396, 928 + sway * 0.4, 1438, 862 + sway);
    ctx.strokeStyle = 'rgba(61,85,119,0.5)';
    ctx.lineWidth = 29;
    ctx.globalAlpha = 0.25;
    ctx.stroke();
    ctx.globalAlpha = 1;
    paintRegion('cat', t);
    catFace(1245, 786, 1);
  }

  // ---------------- sizing + main draw ----------------
  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, W, H);
    var scale = Math.min(W / DW, H / DH);
    var ox = (W - DW * scale) / 2, oy = (H - DH * scale) / 2;
    ctx.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * ox, DPR * oy);
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, DW, DH);
    drawRoom(t);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE0);
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  resize();
  draw(PHASE0);

  if (typeof requestAnimationFrame === 'function') {
    var startMs = null;
    var loop = function (now) {
      if (startMs === null) startMs = now;
      draw(PHASE0 + (now - startMs) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
