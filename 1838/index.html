/* Driver: a catalog of etudes on a dark stage. Each miniature is a small
   machine with its own two colours, playing itself for about twenty seconds
   before the next begins. The viewer only browses, never plays. */
var TAU = Math.PI * 2;
var GROUND = '#0E0E10';
var PANEL = '#141416';

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;

function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';

var audioCtx = null;

var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
var lastT = null;
/* ---- seeded tables, one per miniature, fixed at load ---- */
var SEED = [];
(function () {
  var i, j, r;
  for (i = 0; i < 32; i++) {
    r = mulberry32(1838000 + i * 97);

})();
function size() {

{ name: 'Phasing Metronomes', a: '#E8D9A0', b: '#7FB069', dur: 20, f: function (g, u, s) {
