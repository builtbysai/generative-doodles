<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>9112 — The Worried Note</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0d0c10;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
// №9112 "The Worried Note" — after study #203 (Arthur Jafa), prompt AJ1 (PP783).
// Driver: a single mark plays a nonmetronomic phrase — fast / freeze / replay / slow / freeze —
// with small duration variations every cycle, never the same twice. Replays leave ghost trails.
// Drag grabs the mark but the stutter continues under the pointer; drag a ghost to erase it.
var cv=document.getElementById("c"),ctx=cv.getContext("2d");
var W=0,H=0;
function resize(){var d=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
window.addEventListener("resize",resize);

var seed=9112;
function rnd(){seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;}

// phrase: list of segments {type, dur}
function newPhrase(){
  var segs=[
    {t:"fast", d:0.6+rnd()*0.9},
    {t:"freeze", d:0.7+rnd()*1.2},
    {t:"replay", d:0.5+rnd()*0.6},
    {t:"slow", d:1.2+rnd()*1.6},
    {t:"freeze", d:0.9+rnd()*1.4}
  ];
  return {segs:segs, i:0, t:segs[0].d};
}
var phrase=newPhrase();

// wandering path: summed sines, position param s advances with phrase speed
var s=0, px=W/2, py=H/2, ang=0;
function pathPos(ss){
  var x=W*(0.5+0.34*Math.sin(ss*0.31)+0.08*Math.sin(ss*1.13+1.7));
  var y=H*(0.5+0.30*Math.sin(ss*0.23+0.6)+0.07*Math.sin(ss*0.97+3.1));
  return [x,y];
}
var trail=[], ghosts=[]; // ghosts: arrays of points from replays
var dragMark=false, dragX=0, dragY=0;

function segSpeed(t){
  if(t==="fast") return 1.6;
  if(t==="slow") return 0.25;
  if(t==="replay") return -1.2;
  return 0; // freeze
}

cv.addEventListener("pointerdown",function(e){
  var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(Math.hypot(x-px,y-py)<44){ dragMark=true; dragX=x; dragY=y; cv.setPointerCapture(e.pointerId); return; }
  // erase a ghost under the pointer
  for(var i=ghosts.length-1;i>=0;i--){
    var g=ghosts[i];
    for(var j=0;j<g.length;j+=4){
      if(Math.hypot(x-g[j][0],y-g[j][1])<26){ ghosts.splice(i,1); return; }
    }
  }
});
cv.addEventListener("pointermove",function(e){
  if(!dragMark) return;
  var r=cv.getBoundingClientRect(); dragX=e.clientX-r.left; dragY=e.clientY-r.top;
});
function endDrag(){ dragMark=false; }
cv.addEventListener("pointerup",endDrag);
cv.addEventListener("pointercancel",endDrag);

var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  var seg=phrase.segs[phrase.i];
  phrase.t-=dt;
  if(phrase.t<=0){
    if(seg.t==="replay" && trail.length>10){
      // leave a ghost of the replayed stretch
      ghosts.push(trail.slice(-40));
      if(ghosts.length>5) ghosts.shift();
    }
    phrase.i++;
    if(phrase.i>=phrase.segs.length) phrase=newPhrase();
    else phrase.t=phrase.segs[phrase.i].d;
    seg=phrase.segs[phrase.i];
  }
  var v=segSpeed(seg.t);
  s+=v*dt;
  var p=pathPos(s);
  ang=Math.atan2(p[1]-py,p[0]-px);
  if(!dragMark){ px=p[0]; py=p[1]; }
  else { px=dragX; py=dragY; }
  trail.push([px,py]); if(trail.length>240) trail.shift();

  ctx.fillStyle="#0d0c10"; ctx.fillRect(0,0,W,H);
  // ghosts
  ctx.strokeStyle="rgba(74,68,56,0.8)"; ctx.lineWidth=7; ctx.lineCap="round";
  ghosts.forEach(function(g){
    ctx.beginPath();
    g.forEach(function(pt,i){ i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1]); });
    ctx.stroke();
  });
  // the mark: thick short bar with rounded end, one red "worried" segment
  ctx.save(); ctx.translate(px,py); ctx.rotate(ang);
  ctx.lineCap="round";
  ctx.strokeStyle="#ddd3b8"; ctx.lineWidth=13;
  ctx.beginPath(); ctx.moveTo(-26,0); ctx.lineTo(10,0); ctx.stroke();
  ctx.strokeStyle="#b33324"; ctx.lineWidth=13;
  ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(26,0); ctx.stroke();
  ctx.restore();
  requestAnimationFrame(frame);
}
resize();
var ip=pathPos(0); px=ip[0]; py=ip[1];
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
