<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.281 Terracotta Speckle</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#B85C2E; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.281 Terracotta Speckle (Njalikwa Chongwe).
// A burnt-orange field of raw clay, dense with cream and dark
// speckle, as if the camera is pressed against the surface.
// Idle, the speckle shimmers faintly. Dragging stirs it: dots
// inside the drag radius take velocity from the drag vector
// plus a rotational impulse, swirl, and damp back to rest,
// fully settled about six seconds after release. No reload.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#B85C2E', CREAM = '#EFE6D2', DARK = '#5A2E1A', TRAIL = '#D97B3F';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0; // stored cover-fit transform, used by the pointer handlers
var T = 0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- the speckle field -------------------------------------------------------
// About 1200 dots held purely as data: home is wherever they
// rest, each with a position, a velocity (zero at rest), a
// colour, a size and a shimmer phase. Sizes are skewed small
// so the field reads rough and granular, with a few larger
// grains scattered through it. Drawn past the design edges
// so the cover crop is always covered.
var COUNT = 1200;
var dots = [];
(function () {
  var r = rng(281117);
  for (var i = 0; i < COUNT; i++) {
    var big = r();
    var size = big < 0.82 ? 1.5 + r() * 2.0 : (big < 0.96 ? 3.5 + r() * 1.6 : 5.1 + r() * 1.5);
    dots.push({
      x: -16 + r() * (DW + 32),
      y: -16 + r() * (DH + 32),
      vx: 0, vy: 0,
      col: r() < 0.54 ? CREAM : DARK,
      size: size,
      phase: r() * Math.PI * 2,
      rate: 0.7 + r() * 0.9
    });
  }
})();

// ---- simulation ----------------------------------------------------------------
// One fixed tick: move by velocity, wrap at the extended
// edges so density is never lost, and damp velocity by 0.94
// per tick. At sixty ticks a second that leaves motion
// imperceptible about six seconds after a stir ends.
function stepSim() {
  T += TICK;
  for (var i = 0; i < dots.length; i++) {
    var d = dots[i];
    if (d.vx === 0 && d.vy === 0) continue;
    d.x += d.vx;
    d.y += d.vy;
    d.vx *= 0.94;
    d.vy *= 0.94;
    if (Math.abs(d.vx) < 0.005 && Math.abs(d.vy) < 0.005) { d.vx = 0; d.vy = 0; }
    if (d.x < -18) d.x += DW + 36; else if (d.x > DW + 18) d.x -= DW + 36;
    if (d.y < -18) d.y += DH + 36; else if (d.y > DH + 18) d.y -= DH + 36;
  }
}

// ---- drawing ---------------------------------------------------------------------
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-80, -80, DW + 160, DH + 160);
  // swirl trails: short segments back along each moving dot's
  // velocity, in the trail colour at low alpha, one batched path
  ctx.strokeStyle = rgba(TRAIL, 0.38);
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  var anyTrail = false;
  ctx.beginPath();
  for (var i = 0; i < dots.length; i++) {
    var d = dots[i];
    var sp2 = d.vx * d.vx + d.vy * d.vy;
    if (sp2 < 0.09) continue;
    anyTrail = true;
    ctx.moveTo(d.x - d.vx * 3.2, d.y - d.vy * 3.2);
    ctx.lineTo(d.x, d.y);
  }
  if (anyTrail) ctx.stroke();
  // the speckle itself, batched by colour; the shimmer is a
  // faint per-dot radius breathing on its own phase and rate
  for (var pass = 0; pass < 2; pass++) {
    var want = pass === 0 ? CREAM : DARK;
    ctx.fillStyle = want === CREAM ? rgba(CREAM, 0.92) : rgba(DARK, 0.88);
    ctx.beginPath();
    for (var j = 0; j < dots.length; j++) {
      var p = dots[j];
      if (p.col !== want) continue;
      var rr = p.size * (0.86 + 0.14 * Math.sin(T * p.rate + p.phase));
      ctx.moveTo(p.x + rr, p.y);
      ctx.arc(p.x, p.y, rr, 0, Math.PI * 2);
    }
    ctx.fill();
  }
}

// ---- resize ------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction: drag-disturb --------------------------------------------------------
// Dragging stirs: dots inside the drag radius take velocity
// from the drag vector, scaled by a smooth falloff, plus a
// rotational impulse around the drag point so the speckle
// curls into swirls instead of only sliding sideways.
var dragging = false, lastDragX = 0, lastDragY = 0;
var RADIUS = 190;
function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function stir(cx, cy, dx, dy) {
  var dragSp = Math.sqrt(dx * dx + dy * dy);
  if (dragSp < 0.5) return;
  // a fixed swirl sense keeps close drags curling one way
  for (var i = 0; i < dots.length; i++) {
    var d = dots[i];
    var ox = d.x - cx, oy = d.y - cy;
    var dist = Math.sqrt(ox * ox + oy * oy);
    if (dist >= RADIUS) continue;
    var fall = 1 - dist / RADIUS;
    fall = fall * fall * (3 - 2 * fall); // smoothstep falloff
    var ux = dist > 1 ? ox / dist : 0, uy = dist > 1 ? oy / dist : 0;
    // tangential direction around the drag point
    var tx = -uy, ty = ux;
    var swirl = Math.min(dragSp, 26) * 0.16 * fall;
    d.vx += dx * 0.34 * fall + tx * swirl;
    d.vy += dy * 0.34 * fall + ty * swirl;
    // keep speeds in a range where trails read but nothing flies off
    var sp = Math.sqrt(d.vx * d.vx + d.vy * d.vy);
    if (sp > 15) { d.vx = d.vx / sp * 15; d.vy = d.vy / sp * 15; }
  }
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true;
  lastDragX = p[0]; lastDragY = p[1];
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dx = p[0] - lastDragX, dy = p[1] - lastDragY;
  if (dx * dx + dy * dy < 1) return;
  stir(p[0], p[1], dx, dy);
  lastDragX = p[0]; lastDragY = p[1];
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- frame -----------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: the clay field fills the frame edge to edge
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
