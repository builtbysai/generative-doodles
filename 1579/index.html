<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth, Contained</title>
<style>
html, body { margin: 0; padding: 0; background: #B8B8BC; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#B8B8BC';
var CORAL = '#F7F7F7';
var SHADOW = '#6E6E74';
var SHELL = '#FFFFFF';
var LOOP = 45;                     // seamless loop, seconds
var PHASE0 = 22.5;                 // fixed first-frame phase (p = 0.5):
                                   // the coral near full bloom, so the
                                   // first frame and the thumb show the
                                   // piece, not the bare seed
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var seed = 1579;
// Coral: recursive subdivision of a seeded icosahedron. Twelve primary
// branches grow from the icosahedron vertices; each branch splits into
// two mirrored children, depth 4. The shell is a wireframe icosahedron
// whose vertices lerp toward the growth's bounding radius in the final
// third of the loop, then both relax back to the seed state. Every
// animated quantity is a periodic function of loop phase with matched
// endpoints, so frame 45s equals frame 0s by construction.
var segs = [];                     // {x0,y0,z0,x1,y1,z1,w,tip}
var shellVerts = [];               // unit icosahedron vertices
var shellEdges = [];               // [i, j] index pairs
var coralBuilt = false;
var maxR = 1;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
function smoothstep(a, b, x) {
  if (x <= a) return 0;
  if (x >= b) return 1;
  var u = (x - a) / (b - a);
  return u * u * (3 - 2 * u);
}
function norm3(x, y, z) {
  var l = Math.sqrt(x * x + y * y + z * z) || 1;
  return [x / l, y / l, z / l];
}
// Rotate vector v around unit axis k by angle a (Rodrigues).
function rotAxis(v, k, a) {
  var c = Math.cos(a), s = Math.sin(a);
  var dot = v[0] * k[0] + v[1] * k[1] + v[2] * k[2];
  return [
    v[0] * c + (k[1] * v[2] - k[2] * v[1]) * s + k[0] * dot * (1 - c),
    v[1] * c + (k[2] * v[0] - k[0] * v[2]) * s + k[1] * dot * (1 - c),
    v[2] * c + (k[0] * v[1] - k[1] * v[0]) * s + k[2] * dot * (1 - c)
  ];
}
function buildShell() {
  var PHI = (1 + Math.sqrt(5)) / 2;
  var raw = [
    [-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0],
    [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI],
    [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1]
  ];
  var i, j;
  for (i = 0; i < raw.length; i++) {
    var v = norm3(raw[i][0], raw[i][1], raw[i][2]);
    shellVerts.push(v);
  }
  var minD = 1e9;
  for (i = 0; i < 12; i++) {
    for (j = i + 1; j < 12; j++) {
      var dx = shellVerts[i][0] - shellVerts[j][0];
      var dy = shellVerts[i][1] - shellVerts[j][1];
      var dz = shellVerts[i][2] - shellVerts[j][2];
      var d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d < minD) minD = d;
    }
  }
  for (i = 0; i < 12; i++) {
    for (j = i + 1; j < 12; j++) {
      var ex = shellVerts[i][0] - shellVerts[j][0];
      var ey = shellVerts[i][1] - shellVerts[j][1];
      var ez = shellVerts[i][2] - shellVerts[j][2];
      var ed = Math.sqrt(ex * ex + ey * ey + ez * ez);
      if (ed < minD * 1.01) shellEdges.push([i, j]);
    }
  }
}
// One branch: two short segments with a seeded bend, then two mirrored
// children. Positions are unit-space; the whole coral is later scaled
// so its longest tip sits at 0.95 of the shell radius.
function growBranch(p, d, len, w, depth, rnd) {
  var cur = [p[0], p[1], p[2]];
  var dir = [d[0], d[1], d[2]];
  var s;
  for (s = 0; s < 2; s++) {
    var bend = (rnd() - 0.5) * 0.5;
    var ax = norm3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5);
    dir = norm3(rotAxis(dir, ax, bend)[0], rotAxis(dir, ax, bend)[1], rotAxis(dir, ax, bend)[2]);
    var step = len * (s === 0 ? 0.55 : 0.45);
    var nx = cur[0] + dir[0] * step;
    var ny = cur[1] + dir[1] * step;
    var nz = cur[2] + dir[2] * step;
    segs.push({ x0: cur[0], y0: cur[1], z0: cur[2], x1: nx, y1: ny, z1: nz, w: w, tip: false });
    cur = [nx, ny, nz];
  }
  if (depth <= 0) {
    segs[segs.length - 1].tip = true;
    return;
  }
  var spread = 0.45 + rnd() * 0.25;
  var perp = norm3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5);
  // Perpendicular axis to the branch direction, for mirrored splits.
  var k = norm3(
    dir[1] * perp[2] - dir[2] * perp[1],
    dir[2] * perp[0] - dir[0] * perp[2],
    dir[0] * perp[1] - dir[1] * perp[0]
  );
  var d1 = norm3(rotAxis(dir, k, spread)[0], rotAxis(dir, k, spread)[1], rotAxis(dir, k, spread)[2]);
  var d2 = norm3(rotAxis(dir, k, -spread)[0], rotAxis(dir, k, -spread)[1], rotAxis(dir, k, -spread)[2]);
  growBranch(cur, d1, len * 0.66, w * 0.72, depth - 1, rnd);
  growBranch(cur, d2, len * 0.66, w * 0.72, depth - 1, rnd);
}
function buildCoral() {
  var rnd = mulberry32(seed);
  buildShell();
  var i;
  for (i = 0; i < 12; i++) {
    var v = shellVerts[i];
    var start = [v[0] * 0.06, v[1] * 0.06, v[2] * 0.06];
    growBranch(start, v, 0.34, 0.035, 4, rnd);
  }
  maxR = 0;
  var s;
  for (s = 0; s < segs.length; s++) {
    var g = segs[s];
    var r1 = Math.sqrt(g.x1 * g.x1 + g.y1 * g.y1 + g.z1 * g.z1);
    if (r1 > maxR) maxR = r1;
  }
  var norm = 0.95 / maxR;
  for (s = 0; s < segs.length; s++) {
    var h = segs[s];
    h.x0 *= norm; h.y0 *= norm; h.z0 *= norm;
    h.x1 *= norm; h.y1 *= norm; h.z1 *= norm;
  }
  coralBuilt = true;
}
// Growth amount: rises 0 to 1, presses 12% past the shell, relaxes to 0.
function growthE(p) {
  if (p < 0.55) return smoothstep(0, 0.55, p);
  if (p < 0.62) return 1;
  if (p < 0.78) return 1 + 0.12 * Math.sin(Math.PI * (p - 0.62) / 0.16);
  return 1 - smoothstep(0.78, 1, p);
}
// Shell stretch: still until the overgrowth, full stretch at the climax,
// relaxed back to the seed radius at the loop point.
function shellS(p) {
  if (p < 0.60) return 0;
  if (p < 0.80) return smoothstep(0.60, 0.80, p);
  if (p < 0.85) return 1;
  return 1 - smoothstep(0.85, 1, p);
}
function draw(t) {
  lastT = t;
  size();
  if (!coralBuilt) buildCoral();
  var p = ((t % LOOP) + LOOP) % LOOP / LOOP;
  var minDim = Math.min(VW, VH);
  var R = minDim * 0.35;             // shell radius: shell spans ~70%
  var cx = VW / 2, cy = VH / 2;
  var E = growthE(p);
  var S = shellS(p);
  var scale = 0.15 + 0.85 * E;       // coral scale: seed stub to overgrowth
  var tipR = 0.95 * scale;           // growth bounding radius, unit space
  var rotY = TAU * p;                // one full turn per loop: periodic
  var rotX = 0.32 + 0.08 * Math.sin(TAU * p);
  var F = 3.2;                       // weak perspective distance
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  function proj(x, y, z) {
    var c = Math.cos(rotY), s = Math.sin(rotY);
    var x1 = x * c + z * s, z1 = -x * s + z * c, y1 = y;
    var c2 = Math.cos(rotX), s2 = Math.sin(rotX);
    var y2 = y1 * c2 - z1 * s2, z2 = y1 * s2 + z1 * c2;
    var sc = F / (F - z2);
    return [cx + x1 * sc * R, cy - y2 * sc * R, z2];
  }
  // Project coral segments once, sort by depth, draw shadow then white.
  var projSegs = [];
  var i;
  for (i = 0; i < segs.length; i++) {
    var g = segs[i];
    var a = proj(g.x0 * scale, g.y0 * scale, g.z0 * scale);
    var b = proj(g.x1 * scale, g.y1 * scale, g.z1 * scale);
    projSegs.push({ ax: a[0], ay: a[1], bx: b[0], by: b[1], z: (a[2] + b[2]) / 2, w: g.w, tip: g.tip });
  }
  projSegs.sort(function (m, n) { return m.z - n.z; });
  var ox = 3 * minDim / 900, oy = 4 * minDim / 900;
  var pass;
  for (pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = pass === 0 ? SHADOW : CORAL;
    ctx.globalAlpha = Number((pass === 0 ? 0.45 : 1).toFixed(4));
    ctx.lineCap = 'round';
    for (i = 0; i < projSegs.length; i++) {
      var q = projSegs[i];
      ctx.lineWidth = Math.max(0.75, q.w * R);
      ctx.beginPath();
      ctx.moveTo(q.ax + (pass === 0 ? ox : 0), q.ay + (pass === 0 ? oy : 0));
      ctx.lineTo(q.bx + (pass === 0 ? ox : 0), q.by + (pass === 0 ? oy : 0));
      ctx.stroke();
      if (q.tip) {
        var tr = Math.max(1, q.w * R * 0.9);
        ctx.beginPath();
        ctx.moveTo(q.bx + (pass === 0 ? ox : 0) + tr, q.by + (pass === 0 ? oy : 0));
        ctx.arc(q.bx + (pass === 0 ? ox : 0), q.by + (pass === 0 ? oy : 0), tr, 0, TAU);
        ctx.fillStyle = pass === 0 ? SHADOW : CORAL;
        ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;
  // Seed at the centre: a small white sphere the growth returns to.
  var seedR = Math.max(2, 0.03 * R);
  ctx.fillStyle = SHADOW;
  ctx.globalAlpha = Number((0.5).toFixed(4));
  ctx.beginPath();
  ctx.moveTo(cx + ox + seedR, cy + oy);
  ctx.arc(cx + ox, cy + oy, seedR, 0, TAU);
  ctx.fill();
  ctx.fillStyle = CORAL;
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.moveTo(cx + seedR, cy);
  ctx.arc(cx, cy, seedR, 0, TAU);
  ctx.fill();
  // Shell: wireframe icosahedron. Vertices lerp toward the growth's
  // bounding radius as the coral presses, then relax to the seed radius.
  var shellR = 1 + S * 0.7 * Math.max(0, tipR - 1) + S * 0.03;
  var sv = [];
  for (i = 0; i < shellVerts.length; i++) {
    var v = shellVerts[i];
    sv.push(proj(v[0] * shellR, v[1] * shellR, v[2] * shellR));
  }
  ctx.strokeStyle = SHELL;
  ctx.globalAlpha = Number((0.5).toFixed(4));
  ctx.lineWidth = Math.max(0.75, 0.0016 * minDim);
  for (i = 0; i < shellEdges.length; i++) {
    var e = shellEdges[i];
    ctx.beginPath();
    ctx.moveTo(sv[e[0]][0], sv[e[0]][1]);
    ctx.lineTo(sv[e[1]][0], sv[e[1]][1]);
    ctx.stroke();
  }
  ctx.fillStyle = SHELL;
  ctx.globalAlpha = Number((0.6).toFixed(4));
  for (i = 0; i < sv.length; i++) {
    var vr = Math.max(1, 0.004 * minDim);
    ctx.beginPath();
    ctx.moveTo(sv[i][0] + vr, sv[i][1]);
    ctx.arc(sv[i][0], sv[i][1], vr, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Caption: title, formula date, watch cue. White chip, grey text.
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'Growth, Contained  ·  2006 · 05 · 09  ·  Watch the shell stretch.';
  ctx.font = fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  var pad = Math.round(fs * 0.7);
  var bx = Math.round(fs * 0.8), by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  ctx.fillStyle = CORAL;
  ctx.fillRect(bx - pad, by, Math.ceil(tw) + 2 * pad, fs + 2 * pad);
  ctx.fillStyle = SHADOW;
  ctx.textBaseline = 'top';
  ctx.fillText(label, bx, by + pad);
  if (typeof window !== 'undefined') {
    window.__p1579 = {
      t: t, seed: seed, segs: segs.length, shellEdges: shellEdges.length,
      E: E, S: S, tipR: tipR, shellR: shellR, phone: isPhone()
    };
  }
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = PHASE0 + (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
