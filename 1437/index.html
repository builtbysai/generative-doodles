<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Copy Shop</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1712; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded PRNG (mulberry32), never Math.random ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function r4(x) { return Math.round(x * 10000) / 10000; }

  // ---------- palette ----------
  var COUNTER = '#1a1712', COPIER_WHITE = '#ece8dc', COPIER_GREY = '#8a8f94';
  var LAND_GREEN = '#5a6a3a', SKY = '#9ab4c0', TOY_RED = '#c01818', MAG_PINK = '#e8b8c0';
  var PERM_GOLD = '#d4a24e', PERM_VIOLET = '#6a4a8a', INK = '#141210';

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function rgbStr(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  // Colour-permutation modes, applied to every motif colour of a copy.
  function permute(hex, mode) {
    var c = hexRgb(hex), r = c[0], g = c[1], b = c[2], t;
    if (mode === 1) { r = Math.min(255, Math.round(r * 1.35)); g = Math.round(g * 0.75); b = Math.round(b * 0.75); }
    else if (mode === 2) { r = Math.round(r * 0.75); g = Math.round(g * 0.85); b = Math.min(255, Math.round(b * 1.35)); }
    else if (mode === 3) { r = 255 - r; g = 255 - g; b = 255 - b; }
    else if (mode === 4) { t = r; r = g; g = t; }
    else if (mode === 5) { r = Math.min(255, Math.round(r * 1.15)); b = Math.round(b * 0.55); }
    else if (mode === 6) { r = Math.round(r * 0.9); g = Math.round(g * 0.6); b = Math.min(255, Math.round(b * 1.3)); }
    return rgbStr([r, g, b]);
  }

  // ---------- motifs (drawn from a palette object, so permutations apply) ----------
  function drawMotif(motif, x, y, w, h, P) {
    // P: function(hex) -> colour string
    if (motif === 0) { // postcard landscape
      ctx.fillStyle = P(SKY); ctx.fillRect(x, y, w, h);
      ctx.fillStyle = P('#e8c832'); ctx.beginPath(); ctx.arc(x + w * 0.78, y + h * 0.24, Math.max(3, w * 0.09), 0, 6.2832); ctx.fill();
      ctx.fillStyle = P(LAND_GREEN); ctx.fillRect(x, y + h * 0.62, w, h * 0.38);
      ctx.fillStyle = P('#3a5a2a'); ctx.beginPath(); ctx.arc(x + w * 0.3, y + h * 0.62, w * 0.22, 0, 6.2832); ctx.fill();
      ctx.fillStyle = P(LAND_GREEN); ctx.fillRect(x + w * 0.3, y + h * 0.62, w * 0.7, h * 0.38);
      ctx.fillStyle = P('#8a6a44'); ctx.fillRect(x + w * 0.62, y + h * 0.42, w * 0.12, h * 0.22);
      ctx.fillStyle = P('#a01818'); ctx.fillRect(x + w * 0.58, y + h * 0.34, w * 0.2, h * 0.1);
    } else if (motif === 1) { // art-book plate
      ctx.fillStyle = P(COPIER_WHITE); ctx.fillRect(x, y, w, h);
      var cx = x + w / 2, cy = y + h / 2, r = Math.min(w, h) * 0.38;
      ctx.strokeStyle = P(INK); ctx.lineWidth = Math.max(1, w * 0.02);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.62, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = P(TOY_RED);
      var i, a;
      for (i = 0; i < 8; i++) {
        a = i * 0.7854;
        ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r * 0.8, cy + Math.sin(a) * r * 0.8, Math.max(2, w * 0.035), 0, 6.2832); ctx.fill();
      }
      ctx.fillStyle = P(PERM_GOLD);
      ctx.beginPath(); ctx.arc(cx, cy, Math.max(2, w * 0.06), 0, 6.2832); ctx.fill();
    } else if (motif === 2) { // toy ball
      ctx.fillStyle = P(COPIER_WHITE); ctx.fillRect(x, y, w, h);
      var bx = x + w / 2, by = y + h / 2, br = Math.min(w, h) * 0.38;
      ctx.fillStyle = P(TOY_RED);
      ctx.beginPath(); ctx.arc(bx, by, br, 0, 6.2832); ctx.fill();
      ctx.fillStyle = P(COPIER_WHITE);
      ctx.fillRect(bx - br, by - br * 0.18, br * 2, br * 0.36);
      ctx.fillStyle = P(SKY);
      ctx.beginPath(); ctx.arc(bx - br * 0.35, by - br * 0.4, Math.max(2, br * 0.16), 0, 6.2832); ctx.fill();
    } else { // magazine cut
      ctx.fillStyle = P(MAG_PINK); ctx.fillRect(x, y, w, h);
      ctx.fillStyle = P(INK);
      ctx.fillRect(x + w * 0.12, y + h * 0.18, w * 0.76, h * 0.16);
      ctx.fillStyle = P(COPIER_WHITE);
      ctx.beginPath(); ctx.arc(x + w * 0.68, y + h * 0.62, Math.max(3, w * 0.14), 0, 6.2832); ctx.fill();
      ctx.fillStyle = P(PERM_VIOLET);
      ctx.fillRect(x + w * 0.1, y + h * 0.78, w * 0.5, h * 0.1);
    }
  }

  // ---------- chain state: segments defined by reset events (closed-form over events + t) ----------
  var SLOT = 8;
  var segments = [{ t0: -4, startSerial: 10, motif: 0, seedBase: 1437000 }];
  var drag = null; // transient pointer state, never part of frame one
  var firstTs = null, lastTs = 0, booted = false;

  function segmentAt(t) {
    var s = segments[0], i;
    for (i = 0; i < segments.length; i++) { if (segments[i].t0 <= t) s = segments[i]; }
    return s;
  }
  function serialAt(t) {
    var s = segmentAt(t);
    return s.startSerial + Math.floor((t - s.t0) / SLOT);
  }
  function slotStartOf(seg, serial) { return seg.t0 + (serial - seg.startSerial) * SLOT; }
  function copyParams(seg, serial) {
    var rnd = mulberry32(seg.seedBase + (serial + 1000) * 7919);
    return {
      motif: seg.motif,
      perm: ((serial % 7) + 7) % 7,
      rot: (rnd() - 0.5) * 0.2,
      jx: (rnd() - 0.5) * 6,
      jy: (rnd() - 0.5) * 6,
      sy: 0.95 + rnd() * 0.1
    };
  }

  // ---------- sizing ----------
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  }
  function isPhone(w, h) {
    var scrMin = (typeof window !== 'undefined' && window.screen) ? Math.min(window.screen.width, window.screen.height) : 0;
    if (scrMin) return scrMin < 700;
    return h > w * 1.15;
  }

  function layout(w, h) {
    var phone = isPhone(w, h);
    var pad = phone ? 10 : 24;
    var topH = phone ? 104 : 128;
    var pinH = phone ? 66 : 82;
    var srcW = phone ? Math.floor(w * 0.3) : 170;
    var machW = phone ? 52 : 70, machH = 46, machGap = phone ? 14 : 22;
    var machX0 = pad + srcW + (phone ? 14 : 28);
    var rowY = pad + topH + pad;
    var rowH = h - rowY - pinH - pad;
    var gap = phone ? 6 : 8;
    var cols = phone ? 5 : 10, rows = phone ? 2 : 1;
    var cardW = Math.floor((w - pad * 2 - gap * (cols - 1)) / cols);
    var cardH = Math.floor((rowH - gap * (rows - 1)) / rows);
    return {
      phone: phone, pad: pad, topH: topH, pinH: pinH, srcW: srcW,
      machW: machW, machH: machH, machGap: machGap, machX0: machX0,
      rowY: rowY, rowH: rowH, gap: gap, cols: cols, rows: rows,
      cardW: cardW, cardH: cardH,
      machY: pad + Math.floor((topH - machH) / 2),
      pinY: h - pinH - pad
    };
  }
  function cardPos(L, idx, w) {
    var col, row;
    if (L.phone) { col = idx % 5; row = Math.floor(idx / 5); }
    else { col = idx; row = 0; }
    return { x: L.pad + col * (L.cardW + L.gap), y: L.rowY + row * (L.cardH + L.gap) };
  }

  // ---------- drawing ----------
  function drawCopyCard(cx, cy, cw, ch, params, posIdx, alpha, pin) {
    ctx.save();
    ctx.globalAlpha = r4(alpha);
    ctx.fillStyle = COPIER_WHITE; ctx.fillRect(cx, cy, cw, ch);
    ctx.strokeStyle = COPIER_GREY; ctx.lineWidth = 1; ctx.strokeRect(cx + 0.5, cy + 0.5, cw - 1, ch - 1);
    // pin dot
    ctx.fillStyle = INK; ctx.fillRect(cx + cw / 2 - 2, cy + 3, 4, 4);
    // motif: a tall print centred in the card, distortion growing with position
    var scale = 0.88 + posIdx * 0.02;
    var mw = cw * 0.84, mh = Math.min(ch * 0.62, mw * 1.7);
    var ccx = cx + cw / 2 + params.jx * (posIdx / 9), ccy = cy + ch / 2 + params.jy * (posIdx / 9);
    ctx.save();
    ctx.translate(ccx, ccy);
    ctx.rotate(params.rot * (0.4 + posIdx * 0.12));
    ctx.scale(scale, scale * params.sy);
    var P = function (hex) { return permute(hex, params.perm); };
    drawMotif(params.motif, -mw / 2, -mh / 2, mw, mh, P);
    ctx.restore();
    ctx.restore();
    if (pin) { ctx.fillStyle = INK; ctx.fillRect(cx + cw / 2 - 2, cy + 3, 4, 4); }
  }

  function draw(t) {
    var w = canvas.width, h = canvas.height;
    var L = layout(w, h);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = COUNTER; ctx.fillRect(0, 0, w, h);

    var seg = segmentAt(t);
    var serial = serialAt(t);
    var boundary = seg.t0 + Math.floor((t - seg.t0) / SLOT) * SLOT;
    var animT = (t === 0) ? 1 : Math.min(1, Math.max(0, (t - boundary) / 0.8));
    var ease = 1 - (1 - animT) * (1 - animT);

    // --- top strip: source motif panel ---
    var srcX = L.pad, srcY = L.pad;
    ctx.fillStyle = COPIER_WHITE; ctx.fillRect(srcX, srcY, L.srcW, L.topH);
    ctx.strokeStyle = COPIER_GREY; ctx.lineWidth = 1; ctx.strokeRect(srcX + 0.5, srcY + 0.5, L.srcW - 1, L.topH - 1);
    var sm = 14;
    drawMotif(seg.motif, srcX + sm, srcY + sm, L.srcW - sm * 2, L.topH - sm * 2, function (hex) { return hex; });

    // --- machines: three small plain boxes with arrows, dials above ---
    var i, mx;
    for (i = 0; i < 3; i++) {
      mx = L.machX0 + i * (L.machW + L.machGap);
      ctx.fillStyle = COPIER_GREY; ctx.fillRect(mx, L.machY, L.machW, L.machH);
      ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.strokeRect(mx + 0.5, L.machY + 0.5, L.machW - 1, L.machH - 1);
      ctx.fillStyle = INK; ctx.fillRect(mx + 8, L.machY + L.machH / 2 - 1, L.machW - 16, 2);
      // dial: small circle with one tick mark, no words
      var dx = mx + L.machW / 2, dy = L.pad + 12, dr = 9;
      var drnd = mulberry32(1437000 + i * 7919);
      var ang = drnd() * 6.2832;
      ctx.strokeStyle = PERM_GOLD; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(dx, dy, dr, 0, 6.2832); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(dx + Math.cos(ang) * dr, dy + Math.sin(ang) * dr); ctx.stroke();
      if (i < 2) {
        var ax = mx + L.machW + 2, ay = L.machY + L.machH / 2;
        ctx.fillStyle = PERM_GOLD;
        ctx.beginPath(); ctx.moveTo(ax, ay - 5); ctx.lineTo(ax + L.machGap - 4, ay); ctx.lineTo(ax, ay + 5); ctx.closePath(); ctx.fill();
      }
    }

    // --- row of ten copies ---
    var step = L.phone ? 0 : (L.cardW + L.gap);
    for (i = 0; i < 10; i++) {
      var s = serial - 9 + i;
      var params = copyParams(seg, s);
      var pos = cardPos(L, i, w);
      var alpha = 1, ox = 0;
      if (!L.phone) {
        if (s === serial) { // newest: slides in from the right
          ox = (1 - ease) * step; alpha = 0.3 + 0.7 * animT;
        } else if (animT < 1) { // older cards shift one step left
          ox = (1 - ease) * step;
        }
      } else if (s === serial && animT < 1) {
        alpha = 0.3 + 0.7 * animT;
      }
      // dragged copy is drawn at the pointer instead
      if (drag && drag.kind === 'copy' && drag.serial === s) continue;
      drawCopyCard(pos.x + ox, pos.y, L.cardW, L.cardH, params, i, alpha, true);
    }

    // --- pinboard strip: last three retired copies, faded ---
    ctx.fillStyle = '#241f18'; ctx.fillRect(L.pad, L.pinY, w - L.pad * 2, L.pinH);
    ctx.strokeStyle = COPIER_GREY; ctx.lineWidth = 1; ctx.strokeRect(L.pad + 0.5, L.pinY + 0.5, w - L.pad * 2 - 1, L.pinH - 1);
    var pinSerials = (serial >= 13) ? [serial - 12, serial - 11, serial - 10] : [91, 92, 93];
    var pw = L.phone ? 56 : 72, ph = L.pinH - 16;
    for (i = 0; i < 3; i++) {
      var ps = pinSerials[i];
      var pp = copyParams(seg, ps);
      var px = L.pad + 12 + i * (pw + 14), py = L.pinY + 8;
      drawCopyCard(px, py, pw, ph, pp, 0, 0.28, true);
    }

    // --- drag ghost ---
    if (drag && drag.kind === 'copy') {
      var dp = copyParams(seg, drag.serial);
      var gw = L.cardW, gh = L.cardH;
      drawCopyCard(drag.x - gw / 2, drag.y - gh / 2, gw, gh, dp, 9, 0.92, true);
    }
  }

  // ---------- interaction ----------
  function evtPos(e) {
    var x = (typeof e.offsetX === 'number') ? e.offsetX : (e.clientX || 0);
    var y = (typeof e.offsetY === 'number') ? e.offsetY : (e.clientY || 0);
    return { x: x, y: y };
  }
  function hitCopy(t, x, y) {
    var w = canvas.width, L = layout(w, canvas.height);
    var seg = segmentAt(t), serial = serialAt(t);
    var i, pos;
    for (i = 0; i < 10; i++) {
      pos = cardPos(L, i, w);
      if (x >= pos.x && x <= pos.x + L.cardW && y >= pos.y && y <= pos.y + L.cardH) {
        return serial - 9 + i;
      }
    }
    return null;
  }
  function inMachines(x, y) {
    var L = layout(canvas.width, canvas.height);
    var x0 = L.machX0 - 10, x1 = L.machX0 + 3 * L.machW + 2 * L.machGap + 10;
    return x >= x0 && x <= x1 && y >= L.pad - 6 && y <= L.pad + L.topH;
  }
  function inSource(x, y) {
    var L = layout(canvas.width, canvas.height);
    return x >= L.pad && x <= L.pad + L.srcW && y >= L.pad && y <= L.pad + L.topH;
  }
  function nowT() {
    if (firstTs === null) return 0;
    return (lastTs - firstTs) / 1000;
  }
  function onDown(e) {
    var p = evtPos(e), t = nowT();
    var s = hitCopy(t, p.x, p.y);
    if (s !== null) { drag = { kind: 'copy', serial: s, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: 0 }; return; }
    if (inSource(p.x, p.y)) { drag = { kind: 'source', x: p.x, y: p.y, sx: p.x, sy: p.y, moved: 0 }; }
  }
  function onMove(e) {
    if (!drag) return;
    var p = evtPos(e);
    drag.moved = Math.max(drag.moved, Math.abs(p.x - drag.sx) + Math.abs(p.y - drag.sy));
    drag.x = p.x; drag.y = p.y;
    draw(nowT());
  }
  function onUp(e) {
    if (!drag) return;
    var p = evtPos(e), t = nowT();
    var d = drag; drag = null;
    if (d.kind === 'copy' && inMachines(p.x, p.y)) {
      // re-feed: restart the chain from the dragged copy, new parameters
      var seg = segmentAt(t);
      segments.push({ t0: t, startSerial: serialAt(t) + 1, motif: copyParams(seg, d.serial).motif, seedBase: 1437000 + (d.serial + 1) * 7919 + 13 });
    } else if (d.kind === 'source' && d.moved > 20) {
      var cur = segmentAt(t);
      segments.push({ t0: t, startSerial: serialAt(t) + 1, motif: (cur.motif + 1) % 4, seedBase: 1437000 + (serialAt(t) + 1) * 7919 });
    }
    draw(t);
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);

  function loop(ts) {
    if (firstTs === null) firstTs = ts;
    lastTs = ts;
    draw((ts - firstTs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }

  size();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(booted ? nowT() : 0); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { size(); draw(booted ? nowT() : 0); });
    }
  }
  draw(0); // frame one: constant phase
  booted = true;
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  // probe hook (harmless in browsers)
  if (typeof globalThis !== 'undefined') {
    globalThis.__piece = { draw: draw, segmentAt: segmentAt, serialAt: serialAt, copyParams: copyParams, layout: layout, segments: segments, getDrag: function () { return drag; } };
  }
})();
</script>
</body>
</html>
