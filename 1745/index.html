<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primitive Complexity</title>
<style>
html, body { margin: 0; padding: 0; background: #F4F1EA; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F4F1EA';
var PLATE = '#EDE7DA';
var PLATE_LINE = 'rgba(122,92,46,0.55)';
var TITLE_INK = '#26221C';
var HINT_INK = '#7A5C2E';
var BOX_TAN = '#C9A06B';
var BOX_TAN_DARK = '#A97F4E';
var MOTOR_BLACK = '#1C1A17';
var COTTON = '#FFFFFF';
var COTTON_SHADE = '#E6E1D4';
var WIRE = '#4A4640';
var FRAME_T = 0.0;
var PERIOD = 2.4;
var MULT_START = 8.0;
var MULT_SPAN = 12.0;
var N_CLONES = 12;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1745);
var phaseT = FRAME_T;
/* ---- the prototype's observed period: clones inherit it, never share it ---- */
var PROTO_PERIOD = PERIOD;
var CLONES = [];
(function () {
  var i, a, r;
  for (i = 0; i < N_CLONES; i++) {
    a = (i / N_CLONES) * TAU + (rng() - 0.5) * 0.55;
    r = 0.32 + rng() * 0.14;
    CLONES.push({
      ang: a,
      rad: r,
      scale: 0.20 + rng() * 0.09,
      phase: rng() * TAU,
      period: PROTO_PERIOD * (0.86 + rng() * 0.30),
      appear: MULT_START + i * 1.0
    });
  }
})();
/* ---- drag impulses: closed-form spring response, summed over samples ---- */
var impulses = [];
var SPRING_W = 5.2;
var SPRING_D = 0.55;
function impulseResponse(t, imp) {
  var dt = t - imp.t0;
  if (dt <= 0) return 0;
  return imp.v * Math.exp(-SPRING_D * dt) * Math.sin(SPRING_W * dt) / SPRING_W;
}
function armAngle(t) {
  var base = 0.52 * Math.sin((t / PROTO_PERIOD) * TAU);
  var i, sum = 0;
  for (i = 0; i < impulses.length; i++) sum += impulseResponse(t, impulses[i]);
  return base + sum;
}
function cloneAngle(c, t) {
  return 0.52 * Math.sin((t / c.period) * TAU + c.phase);
}
function multProgress(t) {
  return clamp((t - MULT_START) / MULT_SPAN, 0, 1);
}
function cloneAlpha(c, t) {
  return clamp((t - c.appear) / 1.5, 0, 1);
}
function protoScale(t) {
  return 1 - 0.28 * multProgress(t);
}
var dragging = false;
var lastX = 0, lastY = 0;
function protoCenter() {
  return { x: VW * 0.5, y: VH * 0.52 };
}
function protoSize() {
  return Math.min(VW, VH) * 0.34 * protoScale(phaseT);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function pointerPos(e) {
  var x = e.clientX, y = e.clientY;
  if (typeof x !== 'number' && e.touches && e.touches.length) {
    x = e.touches[0].clientX; y = e.touches[0].clientY;
  }
  return [x, y];
}
function nearProto(x, y) {
  var c = protoCenter();
  var s = protoSize();
  return Math.abs(x - c.x) < s * 0.9 && Math.abs(y - c.y) < s * 0.9;
}
function onDown(e) {
  var p = pointerPos(e);
  if (typeof p[0] !== 'number') return;
  if (nearProto(p[0], p[1])) {
    dragging = true;
    lastX = p[0]; lastY = p[1];
  }
  if (e.preventDefault) { try { e.preventDefault(); } catch (err) {} }
}
function onMove(e) {
  if (!dragging) return;
  var p = pointerPos(e);
  if (typeof p[0] !== 'number') return;
  var dx = p[0] - lastX;
  var dy = p[1] - lastY;
  lastX = p[0]; lastY = p[1];
  var v = (dx - dy * 0.4) / Math.max(Math.min(VW, VH), 1) * 9.0;
  if (v !== 0) impulses.push({ t0: phaseT, v: clamp(v, -2.2, 2.2) });
  if (impulses.length > 40) impulses.splice(0, impulses.length - 40);
  if (e.preventDefault) { try { e.preventDefault(); } catch (err) {} }
}
function onUp() { dragging = false; }
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown);
  canvas.addEventListener('touchmove', onMove);
  canvas.addEventListener('touchend', onUp);
}
function drawUnit(cx, cy, s, ang) {
  var bw = s, bh = s * 0.62;
  var bx = cx - bw / 2, by = cy - bh / 2 + s * 0.10;
  /* soft floor shadow */
  ctx.fillStyle = 'rgba(90,70,40,0.14)';
  ctx.beginPath();
  ctx.ellipse(cx, by + bh + s * 0.06, bw * 0.52, s * 0.05, 0, 0, TAU);
  ctx.fill();
  /* box: tan, lid seam, corner screws */
  ctx.fillStyle = BOX_TAN;
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = BOX_TAN_DARK;
  ctx.fillRect(bx, by, bw, s * 0.045);
  ctx.fillRect(bx, by + bh - s * 0.045, bw, s * 0.045);
  ctx.strokeStyle = 'rgba(120,90,50,0.6)';
  ctx.lineWidth = Math.max(s * 0.012, 0.75);
  ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  var sx, sy;
  var screws = [[0.08, 0.12], [0.92, 0.12], [0.08, 0.88], [0.92, 0.88]];
  for (var k = 0; k < screws.length; k++) {
    sx = bx + screws[k][0] * bw; sy = by + screws[k][1] * bh;
    ctx.fillStyle = 'rgba(90,64,32,0.75)';
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(s * 0.018, 1), 0, TAU);
    ctx.fill();
  }
  /* motor: black block on the box lid, left of center */
  var mw = s * 0.34, mh = s * 0.30;
  var mx = cx - s * 0.28, my = by - mh + s * 0.02;
  ctx.fillStyle = MOTOR_BLACK;
  ctx.fillRect(mx, my, mw, mh);
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  ctx.fillRect(mx, my, mw, mh * 0.18);
  ctx.strokeStyle = 'rgba(20,18,15,0.9)';
  ctx.lineWidth = Math.max(s * 0.012, 0.75);
  ctx.strokeRect(mx + 0.5, my + 0.5, mw - 1, mh - 1);
  /* cotton ball: white cluster on the lid, right of the motor */
  var ccx = cx + s * 0.24, ccy = by - s * 0.06;
  var puffs = [[0, 0, 0.16], [-0.13, 0.06, 0.12], [0.13, 0.07, 0.12], [0, -0.11, 0.12], [-0.07, -0.08, 0.10], [0.08, -0.07, 0.10]];
  var q;
  for (q = 0; q < puffs.length; q++) {
    ctx.fillStyle = q === 0 ? COTTON : '#EFEAE0';
    ctx.beginPath();
    ctx.arc(ccx + puffs[q][0] * s, ccy + puffs[q][1] * s, Math.max(puffs[q][2] * s, 1), 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(178,168,146,0.55)';
    ctx.lineWidth = Math.max(s * 0.008, 0.5);
    ctx.stroke();
  }
  /* wire arm: pivot at the motor top, sweeping above the unit */
  var px = mx + mw / 2, py = my;
  var len = s * 0.72;
  var tipX = px + Math.sin(ang) * len;
  var tipY = py - Math.cos(ang) * len;
  ctx.strokeStyle = WIRE;
  ctx.lineWidth = Math.max(s * 0.02, 1);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(tipX, tipY);
  ctx.stroke();
  ctx.fillStyle = MOTOR_BLACK;
  ctx.beginPath();
  ctx.arc(px, py, Math.max(s * 0.045, 1.5), 0, TAU);
  ctx.fill();
  ctx.fillStyle = WIRE;
  ctx.beginPath();
  ctx.arc(tipX, tipY, Math.max(s * 0.03, 1), 0, TAU);
  ctx.fill();
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var t = phaseT;
  var c = protoCenter();
  var s = protoSize();
  var m = Math.min(VW, VH);
  /* clones: ring around the prototype, each ticking out of phase */
  var i, cl, alpha, clx, cly, cs;
  for (i = 0; i < CLONES.length; i++) {
    cl = CLONES[i];
    alpha = cloneAlpha(cl, t);
    if (alpha <= 0) continue;
    clx = c.x + Math.cos(cl.ang) * cl.rad * m;
    cly = c.y + Math.sin(cl.ang) * cl.rad * m * 0.92;
    clx = clamp(clx, m * 0.10, VW - m * 0.10);
    cly = clamp(cly, m * 0.14, VH - m * 0.10);
    cs = s * cl.scale * (0.6 + 0.4 * alpha);
    ctx.save();
    ctx.globalAlpha = alpha;
    drawUnit(clx, cly, cs, cloneAngle(cl, t));
    ctx.restore();
  }
  /* the prototype, large and centered, first and always */
  drawUnit(c.x, c.y, s, armAngle(t));
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Primitive Complexity').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Primitive Complexity').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 22').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Primitive Complexity', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 22', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag the first unit.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    armAt: function (t) { return armAngle(t); },
    applyImpulse: function (v, t) { impulses.push({ t0: (typeof t === 'number' ? t : phaseT), v: v }); },
    clonePhasesAt: function (t) {
      var out = [];
      var i;
      for (i = 0; i < CLONES.length; i++) out.push({ n: i, angle: cloneAngle(CLONES[i], t), period: CLONES[i].period, phase: CLONES[i].phase, alpha: cloneAlpha(CLONES[i], t) });
      return out;
    },
    proto: function () { var cc = protoCenter(); return { x: cc.x, y: cc.y, size: protoSize(), scale: protoScale(phaseT) }; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 0 s, single prototype large and centered ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
