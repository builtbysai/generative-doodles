<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contours, No Noise</title>
<style>
html, body { margin: 0; padding: 0; background: #F7F4EC; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = [247, 244, 236];
var INK = [42, 78, 138];
var PHASE = 30.0;
var CYCLE = 60.0;
var CLOUD_N = 10;
var OUT_PTS = 72;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth01(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var FX = 0, FY = 0, FW = 0, FH = 0; // field rect: square on desktop, full viewport on phone

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
  if (isPhone) { FX = 0; FY = 0; FW = VW; FH = VH; }
  else { FW = Math.min(VW, VH); FH = FW; FX = (VW - FW) / 2; FY = (VH - FH) / 2; }
}
function scaleF() { return Math.min(FW, FH) / 900 + 0.35; }

// ---- clouds: sine-warped superellipses, fixed seed per cloud ----
function warpSet(rng) {
  var a = [], p = [], i;
  for (i = 0; i < 3; i++) {
    a.push(0.04 + rng() * 0.09);
    p.push(rng() * TAU);
  }
  return { a: a, p: p };
}
var clouds = [];
(function buildClouds() {
  var rng = mulberry32(1594001);
  var i, k;
  for (i = 0; i < CLOUD_N; i++) {
    var big = i < 3;
    var rx = big ? 0.16 + rng() * 0.05 : 0.07 + rng() * 0.08; // largest ~0.42 of field width
    var ry = rx * (0.45 + rng() * 0.25);
    var cx = 0.14 + rng() * 0.72;
    var cy = 0.16 + rng() * 0.62;
    var jitR = [], jitA = [];
    for (k = 0; k < OUT_PTS; k++) {
      jitR.push((rng() - 0.5) * 0.05);
      jitA.push((rng() - 0.5) * 0.045);
    }
    clouds.push({
      cx: cx, cy: cy, rx: rx, ry: ry,
      n: 2.4 + rng() * 1.2,
      wA: warpSet(rng), wB: warpSet(rng),
      dx: (rng() - 0.5) * 0.05, dy: (rng() - 0.5) * 0.04,
      phase: rng() * TAU,
      w: big ? 1.0 : 0.7 + rng() * 0.3,
      jitR: jitR, jitA: jitA
    });
  }
})();

function morphM(t) {
  var ph = ((t % CYCLE) + CYCLE) % CYCLE / CYCLE;
  return 0.5 - 0.5 * Math.cos(TAU * ph);
}
function cloudCenter(c, m) {
  return { x: FX + (c.cx + c.dx * (m - 0.5)) * FW, y: FY + (c.cy + c.dy * (m - 0.5)) * FH };
}
function warpAt(w, th) {
  return 1 + w.a[0] * Math.sin(2 * th + w.p[0])
           + w.a[1] * Math.sin(3 * th + w.p[1])
           + w.a[2] * Math.sin(5 * th + w.p[2]);
}
function cloudRadius(c, th, m, breathe) {
  var a = [], p = [], i;
  for (i = 0; i < 3; i++) {
    a.push(c.wA.a[i] + (c.wB.a[i] - c.wA.a[i]) * m);
    p.push(c.wA.p[i] + (c.wB.p[i] - c.wA.p[i]) * m);
  }
  var w = 1 + a[0] * Math.sin(2 * th + p[0]) + a[1] * Math.sin(3 * th + p[1]) + a[2] * Math.sin(5 * th + p[2]);
  var co = Math.cos(th), si = Math.sin(th);
  var rx = c.rx * Math.min(FW, FH) * breathe, ry = c.ry * Math.min(FW, FH) * breathe;
  var se = Math.pow(Math.pow(Math.abs(co) / rx, c.n) + Math.pow(Math.abs(si) / ry, c.n), -1 / c.n);
  return se * w;
}
function cloudPoint(c, k, m, breathe, scale) {
  var th = (k / OUT_PTS) * TAU + c.jitA[k];
  var r = cloudRadius(c, th, m, breathe) * (1 + c.jitR[k]) * scale;
  var ctr = cloudCenter(c, m);
  return { x: ctr.x + r * Math.cos(th), y: ctr.y + r * Math.sin(th), th: th };
}
function darknessAt(x, y, t) {
  var m = morphM(t);
  var ph = ((t % CYCLE) + CYCLE) % CYCLE / CYCLE;
  var total = 0, i;
  for (i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    var breathe = 1 + 0.035 * Math.sin(TAU * ph + c.phase);
    var ctr = cloudCenter(c, m);
    var dx = x - ctr.x, dy = y - ctr.y;
    var th = Math.atan2(dy, dx);
    var r = cloudRadius(c, th, m, breathe);
    var d = Math.sqrt(dx * dx + dy * dy) / Math.max(r, 1);
    if (d < 1) total += (1 - d) * c.w;
  }
  return clamp(total, 0, 1);
}

// ---- rain: hatch strokes, density follows the clouds ----
// size() must run first: rain positions and cloud darkness need the field rect.
size();
var rain = [];
(function buildRain() {
  var rng = mulberry32(1594007);
  var tries = 0;
  while (rain.length < 1500 && tries < 9000) {
    tries++;
    var x = FX + rng() * FW;
    var y = FY + rng() * FH;
    var dark = darknessAt(x, y, PHASE);
    var accept = 0.10 + 0.90 * dark;
    if (rng() > accept) continue;
    rain.push({
      x: x, y: y,
      len: 5 + rng() * 9,
      slant: (rng() - 0.5) * 0.10,
      fall: 28 + rng() * 46,
      jit: (rng() - 0.5) * 2.2
    });
  }
})();

function drawClouds(t) {
  var m = morphM(t);
  var ph = ((t % CYCLE) + CYCLE) % CYCLE / CYCLE;
  var i, k;
  var lw = 1.6 * scaleF() * (isPhone ? 1.25 : 1.0);
  for (i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    var breathe = 1 + 0.035 * Math.sin(TAU * ph + c.phase);
    var alpha = 0.55 + 0.35 * c.w;
    // faint inner echo, the hand redrawing the line
    ctx.strokeStyle = rgba(INK, (alpha * 0.28).toFixed(4) * 1);
    ctx.lineWidth = lw * 0.7;
    ctx.beginPath();
    for (k = 0; k <= OUT_PTS; k++) {
      var pe = cloudPoint(c, k % OUT_PTS, m, breathe, 0.94);
      if (k === 0) ctx.moveTo(pe.x, pe.y); else ctx.lineTo(pe.x, pe.y);
    }
    ctx.closePath();
    ctx.stroke();
    // main contour
    ctx.strokeStyle = rgba(INK, alpha);
    ctx.lineWidth = lw;
    ctx.beginPath();
    for (k = 0; k <= OUT_PTS; k++) {
      var p = cloudPoint(c, k % OUT_PTS, m, breathe, 1.0);
      if (k === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.stroke();
  }
}

function drawRain(t) {
  var s = scaleF();
  var i;
  ctx.save();
  ctx.beginPath();
  ctx.rect(FX, FY, FW, FH);
  ctx.clip();
  for (i = 0; i < rain.length; i++) {
    var r = rain[i];
    var y = FY + ((r.y - FY + t * r.fall) % FH);
    var dark = darknessAt(r.x, y, t);
    var a = 0.10 + 0.62 * dark;
    if (a <= 0.03) continue;
    var len = (r.len + 8 * dark) * s;
    var x0 = r.x + r.jit;
    ctx.strokeStyle = rgba(INK, a);
    ctx.lineWidth = 1.0 * s;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x0 + r.slant * len, y + len);
    ctx.stroke();
  }
  ctx.restore();
}

function drawText() {
  var s = scaleF();
  ctx.fillStyle = rgba(INK, 0.85);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '600 ' + Math.round(21 * s) + 'px sans-serif';
  ctx.fillText('Contours, No Noise', FX + 26 * s, FY + 44 * s);
  ctx.font = Math.round(14 * s) + 'px sans-serif';
  ctx.fillStyle = rgba(INK, 0.62);
  ctx.fillText('2006 · 05 · 24', FX + 26 * s, FY + 68 * s);
  ctx.fillStyle = rgba(INK, 0.62);
  ctx.fillText('Watch only.', FX + 26 * s, FY + FH - 26 * s);
}

function draw(t) {
  size();
  ctx.fillStyle = 'rgb(' + PAPER[0] + ',' + PAPER[1] + ',' + PAPER[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  drawClouds(t);
  drawRain(t);
  drawText();
}

if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}

var reduced = false;
if (typeof window !== 'undefined' && typeof window.matchMedia === 'function') {
  reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
