<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.284 Slow Dissolve</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0C0C0E; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.284 Slow Dissolve (Sophia Golovanevskaya).
// A tall dark vessel with a green-blue crackled glaze pouring
// down from the shoulder in long drips, like the ocean receding
// over rocks. The base fades to rough pale stone. Drips grow
// slowly on their own. Dragging across the surface smears new
// drips downward and lengthens the crackle; releasing lets the
// glaze settle. Double-tap reseeds the drip map. No reload.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0C0C0E', GLAZE = '#3E9E8E', DEEP = '#2A6F66', SHADOW = '#1E4E48', PALE = '#DCD6C4', CRACK = '#16302C';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0; // stored centred-fit transform, used by the pointer handlers
var T = 0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- vessel profile ----------------------------------------------------------
// Lathe profile as control points [y, halfWidth], cosine eased
// between points so the silhouette stays smooth. A narrow mouth,
// a swelling shoulder, a long body tapering to a small foot.
var CX = 640;
var PROF = [
  [92, 76], [106, 95], [136, 78], [182, 81], [232, 94],
  [290, 148], [346, 190], [428, 207], [540, 197], [648, 174],
  [728, 142], [788, 117], [818, 123]
];
function halfW(y) {
  if (y <= PROF[0][0]) return PROF[0][1];
  for (var i = 0; i < PROF.length - 1; i++) {
    var y0 = PROF[i][0], y1 = PROF[i + 1][0];
    if (y >= y0 && y <= y1) {
      var t = (y - y0) / (y1 - y0);
      var s = t * t * (3 - 2 * t);
      return PROF[i][1] + (PROF[i + 1][1] - PROF[i][1]) * s;
    }
  }
  return PROF[PROF.length - 1][1];
}
function topForX(ax) {
  for (var y = 90; y <= 820; y += 1) { if (halfW(y) >= ax) return y; }
  return 820;
}
function bottomForX(ax) {
  for (var y = 820; y >= 90; y -= 1) { if (halfW(y) >= ax) return y; }
  return 90;
}
function vesselPath() {
  ctx.beginPath();
  var y;
  for (y = 92; y <= 818; y += 2.5) {
    var x = CX - halfW(y);
    if (y === 92) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  for (y = 818; y >= 92; y -= 2.5) ctx.lineTo(CX + halfW(y), y);
  ctx.closePath();
}
function insideVessel(x, y) {
  if (y < 90 || y > 820) return false;
  return Math.abs(x - CX) < halfW(y) - 2;
}

// ---- the pour: strips, drip units, crackle, stone ----------------------------
// The glaze is held as vertical strips 5px wide across the
// vessel. Each strip knows the silhouette top and bottom at its
// x, its natural drip tip (a random walk across drip units,
// smoothed) and its current tip. Drips are pure column data:
// length grows slowly, drag adds downward velocity locally.
var STRIP = 5;
var strips = [];
var units = [];
var crackLarge = [], crackSmall = [];
var speckles = [];
var shoreDots = [];
var crackleGrow = 0.7;
var pourSeed = 284221;

function buildPour(seed) {
  var r = rng(seed);
  strips = []; units = []; crackLarge = []; crackSmall = []; speckles = []; shoreDots = [];
  crackleGrow = 0.7;
  // drip units: a random walk of drip LENGTHS measured from
  // the pour line, plus a matching walk of frame-one grown
  // fractions, so the opening drip edge is smooth across
  // strips, never a comb. The pour line follows the shoulder:
  // a strip is glazed from its silhouette top, but drip length
  // is counted from where the shoulder line crosses it, so the
  // front of the belly gets long drips too.
  var nU = 24, walk = 215 + r() * 40, fw = 0.68, i, u;
  for (i = 0; i < nU; i++) {
    walk += (r() - 0.48) * 78;
    if (walk < 115) walk = 115 + r() * 22;
    if (walk > 335) walk = 335 - r() * 22;
    fw += (r() - 0.5) * 0.14;
    if (fw < 0.58) fw = 0.58;
    if (fw > 0.8) fw = 0.8;
    units.push({ x: CX - 192 + (384 * (i + 0.5)) / nU, len: walk, frac: fw, w: 384 / nU, shade: r() });
  }
  function unitLerp(x, key) {
    var f = ((x - (CX - 192)) / 384) * nU - 0.5;
    var i0 = Math.floor(f), fr = f - i0;
    var a = units[Math.max(0, Math.min(nU - 1, i0))][key];
    var b = units[Math.max(0, Math.min(nU - 1, i0 + 1))][key];
    var s = fr * fr * (3 - 2 * fr);
    return a + (b - a) * s;
  }
  for (var dx = -206; dx <= 206; dx += STRIP) {
    var x = CX + dx, ax = Math.abs(dx);
    var top = topForX(ax), bot = bottomForX(ax);
    if (bot - top < 30) continue;
    var capY = 330 - 30 * Math.pow(ax / 207, 2);
    var org = Math.max(top, capY);
    var tgt = org + unitLerp(x, 'len');
    var hi = bot - 46;
    if (tgt > hi) tgt = hi;
    if (tgt < org + 60) tgt = org + 60;
    // frame one: drips already grown partway down the shoulder
    var cur = org + (tgt - org) * unitLerp(x, 'frac');
    strips.push({ x: x, top: top, bot: bot, org: org, tgt: tgt, cur: cur, vel: 0, ushade: unitLerp(x, 'shade') });
  }
  // crackle: two scales of wandering polylines, stored as data
  // and masked to the drip region when drawn
  var k, j;
  for (k = 0; k < 120; k++) {
    var lx = CX - 200 + r() * 400, ly = 105 + r() * 520, ang = r() * Math.PI * 2, pts = [[lx, ly]];
    var steps = 4 + Math.floor(r() * 3);
    for (j = 0; j < steps; j++) {
      ang += (r() - 0.5) * 1.25;
      lx += Math.cos(ang) * (11 + r() * 12);
      ly += Math.sin(ang) * (11 + r() * 12);
      pts.push([lx, ly]);
    }
    crackLarge.push(pts);
  }
  for (k = 0; k < 320; k++) {
    var sx = CX - 200 + r() * 400, sy = 105 + r() * 540, sang = r() * Math.PI * 2, spts = [[sx, sy]];
    var ssteps = 2 + Math.floor(r() * 2);
    for (j = 0; j < ssteps; j++) {
      sang += (r() - 0.5) * 1.3;
      sx += Math.cos(sang) * (7 + r() * 7);
      sy += Math.sin(sang) * (7 + r() * 7);
      spts.push([sx, sy]);
    }
    crackSmall.push(spts);
  }
  // rough stone speckle for the pale base, plus a ragged shore
  for (k = 0; k < 560; k++) {
    speckles.push({
      x: CX - 205 + r() * 410, y: 585 + r() * 232,
      s: 0.9 + r() * 2.4,
      col: r() < 0.62 ? PALE : (r() < 0.55 ? SHADOW : DEEP),
      a: 0.25 + r() * 0.6
    });
  }
  for (k = 0; k < 90; k++) {
    shoreDots.push({ x: CX - 200 + r() * 400, y: 598 + (r() - 0.5) * 26, s: 2 + r() * 5, a: 0.2 + r() * 0.45 });
  }
}
function tipAt(x) {
  var best = null, bd = 1e9;
  for (var i = 0; i < strips.length; i++) {
    var d = Math.abs(strips[i].x - x);
    if (d < bd) { bd = d; best = strips[i]; }
  }
  return best;
}
function inGlaze(x, y) {
  if (!insideVessel(x, y)) return false;
  var st = tipAt(x);
  if (!st) return false;
  return y >= st.top - 2 && y <= st.cur + 2;
}

// ---- simulation ----------------------------------------------------------------
// Fixed tick: each drip tip creeps toward its natural target
// (slow growth, about 2px a second) and carries any velocity
// the drag gave it, damped so the glaze settles after release.
function stepSim() {
  T += TICK;
  for (var i = 0; i < strips.length; i++) {
    var st = strips[i];
    st.cur += st.vel;
    st.vel *= 0.9;
    if (Math.abs(st.vel) < 0.004) st.vel = 0;
    if (st.cur < st.tgt) st.cur += 0.032;
    var cap = st.bot - 20;
    if (st.cur > cap) st.cur = cap;
    if (st.cur < st.org + 12) st.cur = st.org + 12;
  }
  if (crackleGrow < 0.82) crackleGrow += 0.00012;
}

// ---- drawing ---------------------------------------------------------------------
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-80, -80, DW + 160, DH + 160);
  // vessel body: dark glaze shadow stone
  vesselPath();
  ctx.fillStyle = SHADOW;
  ctx.fill();
  // pale stone base: layered translucent bands, denser toward
  // the foot, clipped to the silhouette; no gradients, no filters
  ctx.save();
  vesselPath();
  ctx.clip();
  var y, f;
  for (y = 592; y < 824; y += 8) {
    f = (y - 592) / 232;
    ctx.fillStyle = rgba(PALE, Math.pow(f, 1.55) * 0.9);
    ctx.fillRect(CX - 215, y, 430, 8);
  }
  // ragged shoreline where glaze gives way to stone
  ctx.fillStyle = PALE;
  for (var sd = 0; sd < shoreDots.length; sd++) {
    var d0 = shoreDots[sd];
    if (!insideVessel(d0.x, d0.y)) continue;
    ctx.globalAlpha = d0.a;
    ctx.beginPath();
    ctx.arc(d0.x, d0.y, d0.s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // stone roughness speckle, clipped by the silhouette test
  for (var sp = 0; sp < speckles.length; sp++) {
    var sk = speckles[sp];
    if (!insideVessel(sk.x, sk.y)) continue;
    ctx.fillStyle = rgba(sk.col, sk.a);
    ctx.beginPath();
    ctx.arc(sk.x, sk.y, sk.s, 0, Math.PI * 2);
    ctx.fill();
  }
  // glaze strips: a short shadow underlay at each drip tip,
  // then the glaze itself with a deeper lower run; everything
  // clipped to the silhouette so no drip ever leaves the vessel
  ctx.save();
  vesselPath();
  ctx.clip();
  var i, st;
  ctx.fillStyle = rgba(SHADOW, 0.8);
  for (i = 0; i < strips.length; i++) {
    st = strips[i];
    ctx.fillRect(st.x - STRIP / 2 - 1, st.cur - 24, STRIP + 2, 29);
  }
  for (i = 0; i < strips.length; i++) {
    st = strips[i];
    var len = st.cur - st.top;
    ctx.fillStyle = rgba(GLAZE, 0.96);
    ctx.fillRect(st.x - STRIP / 2, st.top, STRIP, len);
    // depth varies smoothly per drip unit over the full run
    ctx.fillStyle = rgba(DEEP, st.ushade * 0.22);
    ctx.fillRect(st.x - STRIP / 2, st.top, STRIP, len);
  }
  // rounded drip bulbs at each unit tip
  for (var u2 = 0; u2 < units.length; u2++) {
    var un = units[u2];
    var ust = tipAt(un.x);
    if (!ust) continue;
    ctx.fillStyle = rgba(un.shade < 0.5 ? GLAZE : DEEP, 0.9);
    ctx.beginPath();
    ctx.ellipse(un.x, ust.cur, un.w * 0.34, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(GLAZE, 0.35);
    ctx.beginPath();
    ctx.ellipse(un.x - un.w * 0.1, ust.cur - 2, un.w * 0.16, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  // crackle network, masked segment by segment to the drip
  // region and clipped to the silhouette, so no line ever
  // strays outside the glaze; the share drawn grows with
  // crackleGrow, which dragging lengthens
  ctx.save();
  vesselPath();
  ctx.clip();
  function drawCrack(set, alpha, lw) {
    var n = Math.floor(set.length * crackleGrow);
    ctx.strokeStyle = rgba(CRACK, alpha);
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    var any = false;
    for (var ci = 0; ci < n; ci++) {
      var pts = set[ci];
      for (var pj = 1; pj < pts.length; pj++) {
        var mx = (pts[pj - 1][0] + pts[pj][0]) / 2, my = (pts[pj - 1][1] + pts[pj][1]) / 2;
        if (!inGlaze(mx, my)) continue;
        any = true;
        ctx.moveTo(pts[pj - 1][0], pts[pj - 1][1]);
        ctx.lineTo(pts[pj][0], pts[pj][1]);
      }
    }
    if (any) ctx.stroke();
  }
  drawCrack(crackLarge, 0.42, 1.1);
  drawCrack(crackSmall, 0.3, 0.7);
  ctx.restore();
  // mouth: dark opening with a glazed rim
  ctx.fillStyle = GROUND;
  ctx.beginPath();
  ctx.ellipse(CX, 95, 72, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = rgba(DEEP, 0.95);
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.ellipse(CX, 95, 74, 13, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = rgba(CRACK, 0.55);
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.ellipse(CX, 95, 57, 8, 0, 0, Math.PI * 2);
  ctx.stroke();
  // silhouette edge so the dark body holds against the ground
  vesselPath();
  ctx.strokeStyle = rgba(DEEP, 0.75);
  ctx.lineWidth = 2.4;
  ctx.stroke();
}

// ---- resize ------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction: drag-disturb + double-tap reseed ----------------------------------
// Dragging smears: strips near the drag point take downward
// velocity (from the drag's downward share plus a gravity share
// of any sideways travel) and the crackle lengthens. A second
// tap within 380ms reseeds the whole drip map instead.
var dragging = false, lastDragX = 0, lastDragY = 0;
var lastTapT = -10000, lastTapX = 0, lastTapY = 0, reseedCount = 0;
function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function smear(cx, cy, dx, dy) {
  var down = Math.max(0, dy) + Math.abs(dx) * 0.3;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 0.5) return;
  crackleGrow = Math.min(1, crackleGrow + dist * 0.0011);
  for (var i = 0; i < strips.length; i++) {
    var st = strips[i];
    var ox = st.x - cx;
    if (Math.abs(ox) > 135) continue;
    if (cy < st.top - 40 || cy > st.cur + 130) continue;
    var fall = 1 - Math.abs(ox) / 135;
    fall = fall * fall * (3 - 2 * fall);
    st.vel += (0.22 + down * 0.055) * fall;
    if (st.vel > 3.4) st.vel = 3.4;
  }
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var ddx = p[0] - lastTapX, ddy = p[1] - lastTapY;
  if (now - lastTapT < 380 && ddx * ddx + ddy * ddy < 3600) {
    reseedCount++;
    pourSeed = 284221 + reseedCount * 7919;
    buildPour(pourSeed);
    lastTapT = -10000;
    dragging = false;
    return;
  }
  lastTapT = now; lastTapX = p[0]; lastTapY = p[1];
  dragging = true;
  lastDragX = p[0]; lastDragY = p[1];
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dx = p[0] - lastDragX, dy = p[1] - lastDragY;
  if (dx * dx + dy * dy < 1) return;
  smear(p[0], p[1], dx, dy);
  lastDragX = p[0]; lastDragY = p[1];
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- frame -----------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the shaped vessel keeps its proportions and
  // the page ground is the piece's own ground colour
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
buildPour(pourSeed);
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
