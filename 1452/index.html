<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Birds, No Catwalk</title>
<style>
  html, body { margin: 0; padding: 0; background: #141414; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var LOOP = 48; // seconds; every ambient period divides 48, so the loop closes exactly
  var W = 0, H = 0, isPhone = false;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function round4(x) { return Math.round(x * 10000) / 10000; }
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }

  // Seeded per-figure attributes (seed 1452000 + index*7919). Never Math.random.
  var COSTUMES = ['#d81a2a', '#e8a81a', '#1a9aaa', '#c81a6a'];
  var birds = [];
  (function () {
    for (var i = 0; i < 4; i++) {
      var r = mulberry32(1452000 + i * 7919);
      birds.push({
        color: COSTUMES[i],
        bobPeriod: [1.6, 2, 2.4, 3][i],
        bobPhase: r() * Math.PI * 2,
        peckPeriod: [0.8, 1.2, 1.6, 2.4][i],
        peckPhase: r() * Math.PI * 2,
        swayPhase: r() * Math.PI * 2,
        sizeJitter: 0.92 + r() * 0.16
      });
    }
  })();

  // Recorded interaction events (closed-form functions of event lists + t, never frame state).
  var startles = []; // {bay, t}
  var trapReleases = []; // {t, offset}
  var trapDrag = null; // {x} while a trapeze drag is active
  var lastT = 0;

  function isPhoneSize() {
    var sw = 0, sh = 0;
    try {
      if (typeof window !== 'undefined' && window.screen) {
        sw = window.screen.width || 0; sh = window.screen.height || 0;
      }
    } catch (e) {}
    if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
    return (typeof window !== 'undefined' && window.innerHeight > window.innerWidth * 1.15);
  }

  function resize() {
    var w, h;
    try {
      if (typeof visualViewport !== 'undefined' && visualViewport) {
        w = visualViewport.width; h = visualViewport.height;
      } else { w = window.innerWidth; h = window.innerHeight; }
    } catch (e) { w = window.innerWidth; h = window.innerHeight; }
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    isPhone = isPhoneSize();
  }

  function ellipse(x, y, rx, ry) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  function startleAmp(bay, t) {
    var s = 0;
    for (var i = 0; i < startles.length; i++) {
      var e = startles[i];
      if (e.bay === bay && t >= e.t) {
        var dt = t - e.t;
        s += Math.exp(-dt / 1.5);
      }
    }
    return s;
  }
  function trapOffset(t) {
    var off = 0;
    if (trapDrag) off = trapDrag.x;
    for (var i = 0; i < trapReleases.length; i++) {
      var e = trapReleases[i];
      if (t >= e.t) off += e.offset * Math.exp(-(t - e.t) / 2);
    }
    return off;
  }

  // Stylised bird-figure: knit-costume body, head that pitches to peck, wing arms.
  function drawBird(x, y, s, color, peck, flutter) {
    var bodyW = 26 * s, bodyH = 40 * s;
    ctx.fillStyle = color;
    ellipse(x, y, bodyW, bodyH);
    ctx.fill();
    // knit band stripes
    ctx.fillStyle = '#f2ead8';
    ctx.fillRect(x - bodyW * 0.8, y - bodyH * 0.25, bodyW * 1.6, 3 * s);
    ctx.fillRect(x - bodyW * 0.8, y + bodyH * 0.25, bodyW * 1.6, 3 * s);
    // wing arms held like wings, flutter lifts them
    var lift = flutter * 10 * s;
    ctx.fillStyle = color;
    poly([[x - bodyW * 0.7, y - bodyH * 0.2], [x - bodyW * 1.7, y - bodyH * 0.5 - lift], [x - bodyW * 1.5, y + bodyH * 0.1 - lift], [x - bodyW * 0.6, y + bodyH * 0.3]]);
    ctx.fill();
    poly([[x + bodyW * 0.7, y - bodyH * 0.2], [x + bodyW * 1.7, y - bodyH * 0.5 - lift], [x + bodyW * 1.5, y + bodyH * 0.1 - lift], [x + bodyW * 0.6, y + bodyH * 0.3]]);
    ctx.fill();
    // legs, quick pecking steps implied by stance
    ctx.strokeStyle = '#f2ead8'; ctx.lineWidth = 2 * s;
    ctx.beginPath(); ctx.moveTo(x - 8 * s, y + bodyH); ctx.lineTo(x - 10 * s, y + bodyH + 12 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 8 * s, y + bodyH); ctx.lineTo(x + 10 * s, y + bodyH + 12 * s); ctx.stroke();
    // head, pitched forward by peck (0..~0.55 rad)
    var hx = x + Math.sin(peck) * 14 * s;
    var hy = y - bodyH - 8 * s + Math.sin(peck) * 6 * s;
    ctx.fillStyle = color;
    circle(hx, hy, 11 * s); ctx.fill();
    // beak
    ctx.fillStyle = '#e8a81a';
    poly([[hx + 8 * s, hy - 1 * s], [hx + 18 * s, hy + 3 * s], [hx + 8 * s, hy + 5 * s]]);
    ctx.fill();
    // eye
    ctx.fillStyle = '#141414';
    circle(hx + 3 * s, hy - 2 * s, 2 * s); ctx.fill();
  }

  function draw(t) {
    lastT = t;
    var m = Math.min(W, H);
    var NB = 4;
    var bayW = W / NB;
    var floorY = H * 0.86;

    // Hall
    ctx.fillStyle = '#141414';
    ctx.fillRect(0, 0, W, H);

    // Spotlight cones (flat-alpha layers, never gradients), swaying slightly.
    for (var b = 0; b < NB; b++) {
      var cx = bayW * (b + 0.5) + Math.sin((t / 12) * Math.PI * 2 + b * 1.3) * 8;
      var topW = 14, botW = bayW * 0.46;
      ctx.fillStyle = 'rgba(232,200,106,' + round4(0.07) + ')';
      poly([[cx - topW, 0], [cx + topW, 0], [cx + botW, floorY], [cx - botW, floorY]]);
      ctx.fill();
      ctx.fillStyle = 'rgba(232,200,106,' + round4(0.06) + ')';
      poly([[cx - topW * 0.6, 0], [cx + topW * 0.6, 0], [cx + botW * 0.6, floorY], [cx - botW * 0.6, floorY]]);
      ctx.fill();
      // warm pool on the floor
      ctx.fillStyle = 'rgba(255,242,204,' + round4(0.10) + ')';
      ellipse(cx, floorY + 6, botW * 0.9, 10);
      ctx.fill();
      // spotlight housing
      ctx.fillStyle = '#fff2cc';
      ctx.fillRect(cx - 10, 0, 20, 8);
    }

    // Wire-mesh barriers (vertical divisions)
    ctx.strokeStyle = '#6a6a6a'; ctx.lineWidth = 2;
    for (var v = 1; v < NB; v++) {
      var bx = bayW * v;
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx, H); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(106,106,106,' + round4(0.5) + ')'; ctx.lineWidth = 1;
    for (var v2 = 1; v2 < NB; v2++) {
      var bx2 = bayW * v2;
      for (var yy = 8; yy < H; yy += 16) {
        ctx.beginPath(); ctx.moveTo(bx2 - 5, yy); ctx.lineTo(bx2 + 5, yy + 8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx2 + 5, yy); ctx.lineTo(bx2 - 5, yy + 8); ctx.stroke();
      }
    }

    // Trapeze spanning the upper third: pivot at top centre, slow pendulum swing.
    var trapOff = trapOffset(t);
    var ang = Math.sin((t / 6) * Math.PI * 2) * 0.16 + trapOff;
    var px = W / 2, py = 0;
    var barY = H * 0.28;
    var span = Math.min(W * 0.44, 340);
    var cosA = Math.cos(ang), sinA = Math.sin(ang);
    function rot(x, y) {
      var dx = x - px, dy = y - py;
      return [px + dx * cosA - dy * sinA, py + dx * sinA + dy * cosA];
    }
    var lTop = rot(W / 2 - span / 2, 0), rTop = rot(W / 2 + span / 2, 0);
    var lBot = rot(W / 2 - span / 2, barY), rBot = rot(W / 2 + span / 2, barY);
    ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(lTop[0], lTop[1]); ctx.lineTo(lBot[0], lBot[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rTop[0], rTop[1]); ctx.lineTo(rBot[0], rBot[1]); ctx.stroke();
    ctx.strokeStyle = '#f2ead8'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(lBot[0], lBot[1]); ctx.lineTo(rBot[0], rBot[1]); ctx.stroke();
    // two performers swinging on the bar (stylised figures, hanging)
    var perf = [
      { fx: 0.32, col: '#d81a2a' },
      { fx: 0.68, col: '#1a9aaa' }
    ];
    for (var p = 0; p < perf.length; p++) {
      var bp = rot(W / 2 - span / 2 + span * perf[p].fx, barY);
      var sway = Math.sin((t / 6) * Math.PI * 2 + p * 1.7) * 3;
      ctx.fillStyle = perf[p].col;
      circle(bp[0] + sway, bp[1] + 8, 7); ctx.fill();
      ellipse(bp[0] + sway, bp[1] + 24, 9, 16); ctx.fill();
    }

    // Egg cycle (48 s loop): intact 0-3, crack 3-5, shell parts 5-8,
    // figure unfolds 5-9, hatched bird present 9-44, egg fades back in 44-48.
    var eggX = W / 2, eggY = H * 0.80;
    var eggR = m * 0.055;
    var eggA = 1;
    if (t >= 44) eggA = (t - 44) / 4;
    else if (t >= 9) eggA = 0;
    if (eggA > 0) {
      // During 5-8 s the egg exists ONLY as its two parting halves (no full
      // egg underneath, or the shell would visually duplicate instead of split).
      if (t < 5 || t >= 8) {
        ctx.fillStyle = 'rgba(242,234,216,' + round4(eggA) + ')';
        ellipse(eggX, eggY, eggR, eggR * 1.28); ctx.fill();
      }
      if (t >= 3 && t < 8) {
        var crackP = clamp((t - 3) / 2, 0, 1);
        ctx.strokeStyle = 'rgba(42,42,42,' + round4(eggA) + ')'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(eggX - eggR * 0.7, eggY - eggR * 0.3);
        ctx.lineTo(eggX - eggR * 0.3, eggY + eggR * 0.1 * crackP);
        ctx.lineTo(eggX + eggR * 0.1, eggY - eggR * 0.2 * crackP);
        ctx.lineTo(eggX + eggR * 0.5, eggY + eggR * 0.2 * crackP);
        ctx.stroke();
      }
      if (t >= 5 && t < 8) {
        var sep = (t - 5) / 3;
        ctx.fillStyle = 'rgba(242,234,216,' + round4(eggA * 0.9) + ')';
        ellipse(eggX - sep * 18, eggY - sep * 8, eggR * 0.8, eggR * 0.9); ctx.fill();
        ellipse(eggX + sep * 18, eggY + sep * 6, eggR * 0.8, eggR * 0.9); ctx.fill();
      }
    }

    // Birds, one per bay, bobbing + pecking; startle adds hop + flutter.
    var baseY = H * 0.70;
    for (var i = 0; i < NB; i++) {
      var bd = birds[i];
      var bx3 = bayW * (i + 0.5);
      var amp = startleAmp(i, t);
      var bob = Math.sin((t / bd.bobPeriod) * Math.PI * 2 + bd.bobPhase) * 4;
      var hop = 0, flutter = 0;
      if (amp > 0.01) {
        var dt2 = 0; // hop shape driven by the same decay envelope
        hop = -14 * amp * (0.5 + 0.5 * Math.sin(t * 12));
        flutter = amp;
        dt2 = dt2; // (kept explicit: hop is a closed-form function of t and events)
      }
      var peck = Math.pow(Math.max(0, Math.sin((t / bd.peckPeriod) * Math.PI * 2 + bd.peckPhase)), 2) * 0.55;
      var s = (m / 900) * bd.sizeJitter;
      drawBird(bx3, baseY + bob + hop, s, bd.color, peck, flutter);
    }

    // Hatched bird: unfolds from the egg (5-9 s), joins bay 2, fades out 44-48.
    if (t >= 5 && t < 44) {
      var unfold = clamp((t - 5) / 4, 0, 1);
      var hx2 = eggX + (bayW * 2.5 - eggX) * unfold;
      var hy2 = eggY + (baseY - eggY) * unfold;
      var hs = (m / 900) * 0.95 * (0.4 + 0.6 * unfold);
      var hatchPeck = Math.pow(Math.max(0, Math.sin((t / 1.2) * Math.PI * 2)), 2) * 0.55;
      ctx.save();
      ctx.globalAlpha = round4(1);
      drawBird(hx2, hy2, hs, '#e8a81a', hatchPeck, 0);
      ctx.restore();
    } else if (t >= 44) {
      var fade = 1 - (t - 44) / 4;
      ctx.save();
      ctx.globalAlpha = round4(Math.max(0, fade));
      drawBird(bayW * 2.5, baseY, (m / 900) * 0.95, '#e8a81a', 0, 0);
      ctx.restore();
    }
  }

  function pointerPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function onDown(e) {
    var p = pointerPos(e);
    var barY = H * 0.28;
    if (p.y < barY + 40 && p.y > barY - 60 && Math.abs(p.x - W / 2) < Math.min(W * 0.44, 340) / 2 + 30) {
      trapDrag = { x: 0 };
    }
  }
  function onMove(e) {
    if (!e.buttons && e.type !== 'touchmove') return;
    var p = pointerPos(e);
    if (trapDrag) {
      trapDrag.x = clamp((p.x - W / 2) / (W / 2), -0.4, 0.4);
      return;
    }
    var bayW = W / 4;
    var bay = Math.floor(p.x / bayW);
    if (bay >= 0 && bay < 4) {
      var last = startles[startles.length - 1];
      if (!last || last.bay !== bay || lastT - last.t > 0.4) {
        startles.push({ bay: bay, t: lastT });
      }
    }
  }
  function onUp() {
    if (trapDrag) {
      trapReleases.push({ t: lastT, offset: trapDrag.x });
      trapDrag = null;
    }
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function resizeListen() {
    try {
      if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
        visualViewport.addEventListener('resize', function () { resize(); draw(0); });
      }
      if (typeof window !== 'undefined' && window.addEventListener) {
        window.addEventListener('resize', function () { resize(); draw(0); });
      }
    } catch (e) {}
  }

  resize();
  resizeListen();
  draw(0); // frame one at a constant phase

  var startTime = null;
  function loop(ts) {
    if (startTime === null) startTime = ts;
    var t = ((ts - startTime) / 1000) % LOOP;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

  if (typeof window !== 'undefined') {
    window.__piece = { draw: draw, getState: function () { return { startles: startles, trapReleases: trapReleases, W: W, H: H }; } };
  }
})();
</script>
</body>
</html>
