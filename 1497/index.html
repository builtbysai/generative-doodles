<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process Time</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e0d0; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var LOOP = 24;
  var CREAM = '#e8e0d0', COLD = '#55565e', WALNUT = '#6b4a3a';
  var SILVER = '#b8bcc0', SKIN = '#f2ead8', GOLD = '#d9a441', SCARLET = '#c1272d';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function round4(v) { return Math.round(v * 10000) / 10000; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // Right-bench click schedule: accelerating intervals, stall from 18s to loop end.
  var CLICK_TIMES = [];
  (function () {
    var ct = 0.8, iv = 1.4;
    while (ct < 18) { CLICK_TIMES.push(ct); iv = Math.max(0.18, iv * 0.82); ct += iv; }
  })();

  // Seeded decoration.
  var dust = [];
  (function () {
    var r = mulberry32(1497000);
    for (var i = 0; i < 12; i++) {
      dust.push({
        bx: 0.04 + r() * 0.40, by: 0.10 + r() * 0.60,
        amp: 6 + r() * 10, per: [24, 12, 8][i % 3], ph: r() * Math.PI * 2
      });
    }
  })();
  function winPos(idx) {
    var r = mulberry32(1497000 + idx * 7919);
    return { fx: 0.55 + r() * 0.30, fy: 0.12 + r() * 0.50 };
  }

  // Drag state: closed-form integral of the right-bench rate over recorded segments.
  var segs = [];
  var active = null;
  function effT(t) {
    var eff = 0, last = 0;
    var list = segs.slice();
    if (active) list.push({ a: active.a, b: t, rate: active.rate });
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (s.a >= t) break;
      eff += (s.a - last) * 1;
      var end = Math.min(s.b, t);
      eff += (end - s.a) * s.rate;
      last = end;
      if (s.b >= t) break;
    }
    eff += (t - last) * 1;
    return eff;
  }

  var curW = 0, curH = 0;
  function size() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return { w: w, h: h };
  }
  function clockNow() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - t0) / 1000;
    return 0;
  }
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;

  function pointerDown(x, y, t) {
    if (active) return;
    if (x < curW / 2) return; // only the right bench is draggable
    active = { a: t, startX: x, startY: y, rate: 1 };
  }
  function pointerMove(x, y, t) {
    if (!active) return;
    var dy = Math.max(0, y - active.startY);
    var rate = clamp(1 - dy / 600, 0.25, 1);
    if (rate !== active.rate) {
      segs.push({ a: active.a, b: t, rate: active.rate });
      active = { a: t, startX: active.startX, startY: active.startY, rate: rate };
    }
  }
  function pointerUp(t) {
    if (!active) return;
    segs.push({ a: active.a, b: t, rate: active.rate });
    active = null;
  }

  function draw(t) {
    var s = size();
    var W = s.w, H = s.h;
    curW = W; curH = H;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

    var lt = t % LOOP; // loop-local time; every sine period below divides LOOP
    var rt = effT(t) % LOOP; // right-bench effective loop-local time

    // Backgrounds: split frame, equal halves.
    ctx.fillStyle = CREAM; ctx.fillRect(0, 0, W / 2, H);
    ctx.fillStyle = COLD; ctx.fillRect(W / 2, 0, W / 2, H);

    // Benches.
    ctx.fillStyle = WALNUT;
    ctx.fillRect(W * 0.03, H * 0.78, W * 0.44, H * 0.08);
    ctx.fillRect(W * 0.53, H * 0.78, W * 0.44, H * 0.08);

    // ---- Left bench: film strips hanging in loops, slow winding, dust ----
    var stripXs = [W * 0.09, W * 0.21, W * 0.33];
    var sw = Math.max(14, W * 0.045);
    for (var i = 0; i < 3; i++) {
      var sway = 6 * Math.sin(2 * Math.PI * lt / (i === 1 ? 8 : 12) + i * 1.3);
      var x = stripXs[i] + sway;
      var top = H * 0.06, bot = H * 0.52;
      ctx.fillStyle = SILVER;
      ctx.fillRect(x, top, sw, bot - top);
      // Loop curl at the bottom: the strip curls back up.
      ctx.beginPath();
      ctx.moveTo(x, bot);
      ctx.arc(x + sw / 2, bot, sw * 0.9, Math.PI, 0, false);
      ctx.lineTo(x + sw, top + (bot - top) * 0.55);
      ctx.lineTo(x + sw - sw * 0.4, top + (bot - top) * 0.55);
      ctx.closePath();
      ctx.fill();
    }
    // Reels: one full turn per loop, so lt=LOOP matches lt=0 exactly.
    var reelAngle = 2 * Math.PI * lt / LOOP;
    var reelCenters = [[W * 0.13, H * 0.70], [W * 0.35, H * 0.70]];
    var rr = Math.min(W, H) * 0.055;
    for (var j = 0; j < 2; j++) {
      var cx = reelCenters[j][0], cy = reelCenters[j][1];
      ctx.fillStyle = SILVER;
      ctx.beginPath(); ctx.moveTo(cx + rr, cy); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = WALNUT; ctx.lineWidth = 2;
      ctx.beginPath();
      for (var k = 0; k < 4; k++) {
        var a = reelAngle + k * Math.PI / 2;
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
      }
      ctx.stroke();
      // Winding hand: large skin-tone palm + fingers, slow sine rock.
      var ha = 0.12 * Math.sin(2 * Math.PI * lt / 12 + j * 1.7);
      ctx.save();
      ctx.translate(cx, cy - rr - 6);
      ctx.rotate(ha);
      ctx.fillStyle = SKIN;
      ctx.fillRect(-rr * 0.5, -rr * 0.35, rr, rr * 0.7);
      for (var f = 0; f < 4; f++) {
        ctx.fillRect(-rr * 0.5 + f * rr * 0.27, -rr * 0.7, rr * 0.2, rr * 0.4);
      }
      ctx.restore();
    }
    // Dust motes drifting slowly.
    ctx.fillStyle = SILVER;
    for (var d = 0; d < dust.length; d++) {
      var m = dust[d];
      var mx = m.bx * W + m.amp * Math.sin(2 * Math.PI * lt / m.per + m.ph);
      var my = m.by * H + m.amp * 0.6 * Math.cos(2 * Math.PI * lt / m.per + m.ph);
      ctx.fillRect(mx, my, 3, 3);
    }

    // ---- Gold thread crossing the seam at mid-height ----
    ctx.strokeStyle = GOLD; ctx.lineWidth = 2;
    ctx.beginPath();
    var first = true;
    for (var tx = W * 0.03; tx <= W * 0.97; tx += W * 0.02) {
      var ty = H * 0.5 + 4 * Math.sin(2 * Math.PI * lt / 12 + tx * 0.01);
      if (first) { ctx.moveTo(tx, ty); first = false; } else { ctx.lineTo(tx, ty); }
    }
    ctx.stroke();

    // ---- Right bench: cursor, stacking windows, stall, reset ----
    var stalled = rt >= 18;
    var clicks = [];
    for (var c = 0; c < CLICK_TIMES.length; c++) {
      if (CLICK_TIMES[c] <= rt) clicks.push(c);
    }
    var ww = W * 0.14, wh = H * 0.11;
    var alive = [];
    for (var a2 = clicks.length - 1; a2 >= 0; a2--) {
      var ci = clicks[a2];
      var age = rt - CLICK_TIMES[ci];
      if (age < 2.5) alive.unshift(ci);
      if (alive.length >= 6) break;
    }
    // Windows stack: oldest first, newest on top with a small offset.
    for (var w2 = 0; w2 < alive.length; w2++) {
      var idx = alive[w2];
      var p = winPos(idx);
      var wx = p.fx * W, wy = p.fy * H;
      var age2 = rt - CLICK_TIMES[idx];
      var alpha = age2 < 2.0 ? 1 : round4((2.5 - age2) / 0.5);
      ctx.fillStyle = alpha === 1 ? SILVER : 'rgba(184,188,192,' + alpha + ')';
      ctx.fillRect(wx + w2 * 4, wy + w2 * 4, ww, wh);
      ctx.strokeStyle = alpha === 1 ? WALNUT : 'rgba(107,74,58,' + alpha + ')'; ctx.lineWidth = 2;
      ctx.strokeRect(wx + w2 * 4, wy + w2 * 4, ww, wh);
    }
    // Cursor: at the most recent click's window centre, else its home spot.
    var curPos = { x: W * 0.74, y: H * 0.42 };
    if (clicks.length > 0) {
      var lp = winPos(clicks[clicks.length - 1]);
      curPos = { x: lp.fx * W + ww / 2, y: lp.fy * H + wh / 2 };
    }
    var blinkOn = stalled ? true : (Math.floor(rt * 3) % 2 === 0);
    if (blinkOn) {
      var cs = Math.max(10, Math.min(W, H) * 0.02);
      ctx.fillStyle = SCARLET;
      ctx.beginPath();
      ctx.moveTo(curPos.x, curPos.y);
      ctx.lineTo(curPos.x + cs, curPos.y + cs * 0.5);
      ctx.lineTo(curPos.x + cs * 0.5, curPos.y + cs);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(curPos.x - cs * 0.3, curPos.y - cs * 0.3, cs * 0.3, cs * 0.3);
    }
  }

  draw(0);

  canvas.addEventListener('pointerdown', function (e) { pointerDown(e.clientX, e.clientY, clockNow()); });
  canvas.addEventListener('pointermove', function (e) { pointerMove(e.clientX, e.clientY, clockNow()); });
  canvas.addEventListener('pointerup', function (e) { pointerUp(clockNow()); });

  if (typeof window !== 'undefined') {
    window.__piece = {
      drawAt: draw,
      down: pointerDown,
      move: pointerMove,
      up: pointerUp,
      effT: effT,
      clickTimes: CLICK_TIMES,
      canvas: canvas
    };
  }

  function loop(now) {
    draw((now - t0) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(clockNow()); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { draw(clockNow()); });
    }
  }
})();
</script>
</body>
</html>
