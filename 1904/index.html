<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1904 Three Knots of Wind</title>
<style>
  html, body { margin: 0; padding: 0; background: #141a2e; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: night-room indigo, warm wood, pale gold baton theme, chalk white.
  var ROOM = '#141a2e';
  var ROOM_DEEP = '#0e1220';
  var ROOM_SOFT = '#1d2542';
  var WOOD = '#8a5a33';
  var WOOD_LIGHT = '#b07a45';
  var WOOD_PALE = '#c99a5f';
  var GOLD = '#e8c96a';
  var GOLD_SOFT = '#f2d98a';
  var CHALK = '#f2ede0';
  var CHALK_DIM = '#b9b4a4';
  var SAX_BRASS = '#d9a441';
  var DRUM_SKIN = '#e8dcc0';

  // Fixed-phase first frame: FIRST_T = 19.5 s, wind 3 knots. At wind 3 the
  // pass cycle is 15 s, so t = 19.5 sits at u = 0.3 of the second pass:
  // the baton is mid-flight from the sax to the trombone, the quartet
  // mid-passing-game, the kite lifted at three knots. The whole state is
  // a pure function of t and wind, so frame one is byte-reproducible.
  var FIRST_T = 19.5;
  var TRANSIT_FRAC = 0.6; // fraction of each cycle spent in transit

  // The wind is the schedule. Dragging raises or lowers it; it gates how
  // often the theme passes. 0 to 5 knots, first frame at 3.
  var wind = 3;
  var probe = null; // {sx, sy} from ?sx= &sy= QA hook, or null

  try {
    if (typeof location !== 'undefined' && location.search) {
      var q = location.search.replace(/^\?/, '').split('&');
      var pv = {};
      for (var qi = 0; qi < q.length; qi++) {
        var kv = q[qi].split('=');
        if (kv.length === 2) { pv[kv[0]] = parseFloat(kv[1]); }
      }
      if (isFinite(pv.sx) && isFinite(pv.sy)) {
        probe = { sx: pv.sx, sy: pv.sy };
        wind = clampNum(5 * (1 - pv.sy), 0, 5);
      }
    }
  } catch (e) { probe = null; }

  function clampNum(v, a, b) { return v < a ? a : (v > b ? b : v); }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(u) { return u * u * (3 - 2 * u); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha

  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      // Field-like composition: square on desktop, page ground is the
      // piece's own night-room indigo.
      stageH = vh * 0.92;
      stageW = Math.min(vw * 0.94, stageH);
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  // The four instrument agents, spread wide. Each voice rephrases the
  // theme in its own timbre: guitar straight, sax curved, trombone bent,
  // drums pulsed.
  var VOICES = [
    { name: 'GUITAR',   fx: 0.12, timbre: 'straight', accent: WOOD_PALE, note: 392 },
    { name: 'SAX',      fx: 0.38, timbre: 'curve',    accent: SAX_BRASS, note: 440 },
    { name: 'TROMBONE', fx: 0.62, timbre: 'bend',     accent: WOOD_LIGHT, note: 523 },
    { name: 'DRUMS',    fx: 0.88, timbre: 'pulse',    accent: DRUM_SKIN,  note: 659 }
  ];

  // Pass cycle length in seconds, set by the wind. At 3 knots it is 15 s.
  // Below 1 knot the theme stops passing and only single phrases drift.
  function cycleLen(w) { return 24 - 3 * w; }

  // Scheduler: a pure function of t and wind. Returns the pass in flight,
  // or null while the quartet idles between passes.
  function passAt(t, w) {
    if (w < 1) { return null; }
    var C = cycleLen(w);
    var k = Math.floor(t / C);
    var u = (t - k * C) / C;
    var from = ((k % 4) + 4) % 4;
    var to = (from + 1) % 4;
    if (u < TRANSIT_FRAC) {
      return { from: from, to: to, u: u / TRANSIT_FRAC, cycle: k, idle: false };
    }
    return { from: from, to: to, u: (u - TRANSIT_FRAC) / (1 - TRANSIT_FRAC), cycle: k, idle: true };
  }

  // The receiving voice's timbre transform: vertical offset of a phrase
  // dot at step s (0 to 1) along its path.
  function timbreOffset(timbre, s, amp) {
    if (timbre === 'curve') { return Math.sin(s * Math.PI * 2) * amp; }
    if (timbre === 'bend') { return -s * s * amp * 1.6; }
    if (timbre === 'pulse') { return (Math.floor(s * 6) % 2 === 0 ? -amp * 0.5 : amp * 0.5); }
    return 0; // guitar: straight
  }

  function drawFigure(v, idx, baseY, s, active, t) {
    var x = v.fx * W;
    var breathe = 1 + 0.012 * Math.sin(t * 0.3 + idx * 1.9);
    var headR = 12 * s * breathe;
    var headY = baseY - 112 * s;
    var shoulderY = baseY - 90 * s;
    var hipY = baseY - 14 * s;
    var dim = active ? 1 : 0.62;

    ctx.save();
    ctx.globalAlpha = dim;

    // Body: warm wood column.
    ctx.fillStyle = WOOD;
    ctx.beginPath();
    ctx.moveTo(x - 19 * s, shoulderY);
    ctx.quadraticCurveTo(x - 25 * s, (shoulderY + hipY) / 2, x - 21 * s, hipY);
    ctx.lineTo(x + 21 * s, hipY);
    ctx.quadraticCurveTo(x + 25 * s, (shoulderY + hipY) / 2, x + 19 * s, shoulderY);
    ctx.quadraticCurveTo(x, shoulderY - 12 * s, x - 19 * s, shoulderY);
    ctx.closePath();
    ctx.fill();

    // Head.
    ctx.fillStyle = WOOD_LIGHT;
    ctx.beginPath();
    ctx.moveTo(x + headR, headY);
    ctx.arc(x, headY, headR, 0, Math.PI * 2);
    ctx.fill();

    // Instrument, per voice.
    ctx.strokeStyle = v.accent;
    ctx.fillStyle = v.accent;
    ctx.lineCap = 'round';
    if (v.timbre === 'straight') {
      // Guitar: rounded body and neck, held across the torso.
      ctx.beginPath();
      ctx.moveTo(x - 16 * s + 10 * s, shoulderY + 44 * s);
      ctx.arc(x - 16 * s, shoulderY + 44 * s, 13 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 4 * s;
      ctx.beginPath();
      ctx.moveTo(x - 8 * s, shoulderY + 40 * s);
      ctx.lineTo(x + 26 * s, shoulderY + 18 * s);
      ctx.stroke();
    } else if (v.timbre === 'curve') {
      // Sax: brass curve rising from the hands, bell at the top.
      ctx.lineWidth = 5 * s;
      ctx.beginPath();
      ctx.moveTo(x - 6 * s, shoulderY + 46 * s);
      ctx.quadraticCurveTo(x - 26 * s, shoulderY + 30 * s, x - 14 * s, shoulderY - 2 * s);
      ctx.quadraticCurveTo(x - 8 * s, shoulderY - 18 * s, x + 2 * s, shoulderY - 14 * s);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 2 * s + 7 * s, shoulderY - 14 * s);
      ctx.arc(x + 2 * s, shoulderY - 14 * s, 7 * s, 0, Math.PI * 2);
      ctx.fill();
    } else if (v.timbre === 'bend') {
      // Trombone: long slide held out to the right.
      ctx.lineWidth = 3.5 * s;
      ctx.beginPath();
      ctx.moveTo(x + 6 * s, shoulderY + 34 * s);
      ctx.lineTo(x + 52 * s, shoulderY + 26 * s);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 6 * s, shoulderY + 42 * s);
      ctx.lineTo(x + 52 * s, shoulderY + 34 * s);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 52 * s, shoulderY + 26 * s);
      ctx.lineTo(x + 52 * s, shoulderY + 34 * s);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 52 * s + 6 * s, shoulderY + 30 * s);
      ctx.arc(x + 52 * s, shoulderY + 30 * s, 6 * s, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Drums: two drum heads and a cymbal line in front of the player.
      ctx.fillStyle = DRUM_SKIN;
      ctx.beginPath();
      ctx.moveTo(x - 26 * s + 11 * s, shoulderY + 46 * s);
      ctx.arc(x - 26 * s, shoulderY + 46 * s, 11 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + 24 * s + 12 * s, shoulderY + 44 * s);
      ctx.arc(x + 24 * s, shoulderY + 44 * s, 12 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = GOLD_SOFT;
      ctx.lineWidth = 3 * s;
      ctx.beginPath();
      ctx.moveTo(x - 2 * s, shoulderY + 22 * s);
      ctx.lineTo(x + 34 * s, shoulderY + 16 * s);
      ctx.stroke();
      // Drumsticks, raised.
      ctx.strokeStyle = WOOD_PALE;
      ctx.lineWidth = 2.5 * s;
      ctx.beginPath();
      ctx.moveTo(x - 12 * s, shoulderY + 30 * s);
      ctx.lineTo(x - 24 * s, shoulderY + 8 * s);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 12 * s, shoulderY + 30 * s);
      ctx.lineTo(x + 26 * s, shoulderY + 10 * s);
      ctx.stroke();
    }

    ctx.restore();

    // Voice label in chalk, below the figure.
    ctx.fillStyle = hexA(CHALK_DIM, 0.85);
    ctx.font = '600 ' + Math.round(11 * s + 2) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.fillText(v.name, x, baseY + 22 * s);
    ctx.textAlign = 'left';

    return { handX: x, handY: shoulderY + 30 * s };
  }

  function drawKite(t, w) {
    // The Emong kite, waiting on feeble wind and lifted by three knots.
    // Its height and tilt are pure functions of the wind.
    var kx = W * 0.5 + Math.sin(t * 0.11) * W * 0.02;
    var ky = H * 0.15 - w * H * 0.012 + Math.sin(t * 0.23) * 3;
    var ks = clamp(Math.min(W, H) / 560, 0.6, 1.2) * (0.8 + w * 0.07);
    var tilt = (w - 3) * 0.06 + Math.sin(t * 0.17) * 0.05;
    ctx.save();
    ctx.translate(kx, ky);
    ctx.rotate(tilt);
    ctx.fillStyle = hexA(GOLD, 0.9);
    ctx.beginPath();
    ctx.moveTo(0, -16 * ks);
    ctx.lineTo(11 * ks, 0);
    ctx.lineTo(0, 16 * ks);
    ctx.lineTo(-11 * ks, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = hexA(CHALK, 0.55);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -16 * ks);
    ctx.lineTo(0, 16 * ks);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-11 * ks, 0);
    ctx.lineTo(11 * ks, 0);
    ctx.stroke();
    // Tail ribbon.
    ctx.strokeStyle = hexA(GOLD_SOFT, 0.8);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, 16 * ks);
    ctx.quadraticCurveTo(Math.sin(t * 0.4) * 10, 16 * ks + 18 * ks, Math.sin(t * 0.4 + 1) * 8, 16 * ks + 34 * ks);
    ctx.stroke();
    ctx.restore();
    // String down toward the room.
    ctx.strokeStyle = hexA(CHALK, 0.28);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(kx, ky + 16 * ks);
    ctx.quadraticCurveTo(kx + 20, ky + H * 0.10, kx - 10, H * 0.32);
    ctx.stroke();
  }

  function drawWindStreaks(t, w) {
    // Faint chalk air: more streaks, faster, as the wind rises.
    var n = Math.round(w * 4);
    var i, y, x0, len, speed;
    for (i = 0; i < n; i++) {
      y = hash(i * 3 + 5) * H * 0.85 + H * 0.06;
      speed = 12 + w * 9;
      x0 = ((hash(i * 7 + 2) * W + t * speed) % (W + 240)) - 120;
      len = 40 + hash(i * 11 + 1) * 90;
      ctx.strokeStyle = hexA(CHALK, a4(0.05 + 0.03 * w / 5));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x0 + len, y);
      ctx.stroke();
    }
  }

  function drawPhrase(from, to, timbre, u, alphaScale) {
    // The baton theme in flight: a ribbon of gold dots from the sender's
    // hand to the receiver's, arched between them and shaped by the
    // receiver's timbre transform.
    var steps = 24;
    var i, s, px, py, rr, al;
    var amp = H * 0.045;
    for (i = 0; i <= steps; i++) {
      s = (i / steps) * u;
      var e = smooth(s);
      px = lerp(from.handX, to.handX, e);
      py = lerp(from.handY, to.handY, e) - Math.sin(e * Math.PI) * H * 0.07 + timbreOffset(timbre, e, amp);
      rr = 1.5 + 5.5 * (s / Math.max(u, 0.001)) * (1 - 0.3 * (s / Math.max(u, 0.001)));
      if (u <= 0) { rr = 1.5; }
      al = a4((0.06 + 0.24 * (s / Math.max(u, 0.001))) * alphaScale);
      ctx.fillStyle = hexA(i % 2 === 0 ? GOLD : GOLD_SOFT, al);
      ctx.beginPath();
      ctx.moveTo(px + rr, py);
      ctx.arc(px, py, rr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawDrift(voice, hand, t) {
    // Below one knot, or between passes: only single phrases drift,
    // three faint gold dots near the idle voice.
    var i, px, py;
    for (i = 0; i < 3; i++) {
      px = hand.handX + Math.sin(t * 0.22 + i * 2.1) * 26 - 30 + i * 26;
      py = hand.handY - 26 - i * 8 + Math.cos(t * 0.17 + i * 1.4) * 6;
      ctx.fillStyle = hexA(GOLD, a4(0.28 - i * 0.07));
      ctx.beginPath();
      ctx.moveTo(px + 3.5, py);
      ctx.arc(px, py, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWindCounter() {
    // Fixed at the lower edge: chalk white, five knots, no game HUD.
    var label = 'WIND ' + (Math.round(wind * 10) / 10) + ' KNOTS';
    var fs = Math.round(clamp(W / 640, 0.85, 1.15) * 13);
    ctx.font = '600 ' + fs + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = CHALK;
    var tx = W - 18;
    var ty = H - 20;
    ctx.fillText(label, tx, ty);
    // Five knot ticks under the label; filled in proportion to the wind.
    var tw = 14, gap = 5;
    var total = 5 * tw + 4 * gap;
    var x0 = W - 18 - total;
    var y0 = ty + 10;
    var i, fill;
    for (i = 0; i < 5; i++) {
      fill = clamp(wind - i, 0, 1);
      ctx.fillStyle = hexA(CHALK, a4(0.25 + 0.65 * fill));
      ctx.fillRect(x0 + i * (tw + gap), y0, tw, 4);
    }
    ctx.textAlign = 'left';
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Night rehearsal room.
    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, W, H);
    var floor = ctx.createLinearGradient(0, H * 0.7, 0, H);
    floor.addColorStop(0, hexA(ROOM_DEEP, 0));
    floor.addColorStop(1, hexA(ROOM_DEEP, 0.55));
    ctx.fillStyle = floor;
    ctx.fillRect(0, H * 0.7, W, H * 0.3);

    var s = clamp(Math.min(W, H) / 560, 0.6, 1.25);
    var baseY = H * 0.70;

    drawKite(t, wind);
    drawWindStreaks(t, wind);

    // The pass in flight, or the idle drift between passes.
    var pass = passAt(t, wind);

    // The quartet, spread wide. Voices in the pass stay lit; the rest
    // idle in near-silence.
    var hands = [];
    var i;
    for (i = 0; i < 4; i++) {
      var active = true;
      if (pass && !pass.idle) { active = (i === pass.from || i === pass.to); }
      if (pass && pass.idle) { active = (i === pass.to); }
      if (!pass) { active = false; }
      hands.push(drawFigure(VOICES[i], i, baseY, s, active, t));
    }

    if (pass && !pass.idle) {
      var fromH = hands[pass.from];
      var toH = hands[pass.to];
      var recv = VOICES[pass.to];
      drawPhrase(fromH, toH, recv.timbre, pass.u, 1);
      // The baton head: a pale gold orb with a halo, mid-flight.
      var eu = smooth(pass.u);
      var hx = lerp(fromH.handX, toH.handX, eu);
      var hy = lerp(fromH.handY, toH.handY, eu) - Math.sin(eu * Math.PI) * H * 0.07 + timbreOffset(recv.timbre, eu, H * 0.045);
      var hr = 11 * s;
      var halo = ctx.createRadialGradient(hx, hy, 2, hx, hy, hr * 3.4);
      halo.addColorStop(0, hexA(GOLD, 0.32));
      halo.addColorStop(0.6, hexA(GOLD, 0.08));
      halo.addColorStop(1, hexA(GOLD, 0));
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.moveTo(hx + hr * 3.4, hy);
      ctx.arc(hx, hy, hr * 3.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = hexA(GOLD, 0.95);
      ctx.beginPath();
      ctx.moveTo(hx + hr, hy);
      ctx.arc(hx, hy, hr, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = hexA(GOLD_SOFT, 0.9);
      ctx.beginPath();
      ctx.moveTo(hx + hr * 0.5, hy - hr * 0.15);
      ctx.arc(hx, hy - hr * 0.15, hr * 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Between passes, or below one knot: single phrases drift.
      var idleVoice = pass ? pass.to : Math.floor(t / 6) % 4;
      drawDrift(VOICES[idleVoice], hands[idleVoice], t);
    }

    // QA probe marker: a faint gust where the drag landed.
    if (probe) {
      var gx = probe.sx * W, gy = probe.sy * H;
      ctx.strokeStyle = hexA(CHALK, 0.5);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(gx - 26, gy);
      ctx.quadraticCurveTo(gx, gy - 18, gx + 26, gy);
      ctx.stroke();
    }

    // Title plate, drawn on the canvas, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 640, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = CHALK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Three Knots of Wind', 18, 34);
    ctx.fillStyle = CHALK_DIM;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1904 · 2007 · 03 · 30', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(CHALK_DIM, 0.9);
    ctx.fillText('Drag to raise the wind.', 18, H - 20);

    drawWindCounter();
  }

  // Lazy audio: one melodic motif, re-voiced per agent. Created only
  // inside the first drag, never autoplay, guarded for node-canvas QA.
  var audioCtx = null;
  var lastCycle = -1;
  function ensureAudio() {
    if (audioCtx) { return; }
    try {
      var AC = (typeof AudioContext !== 'undefined') ? AudioContext :
        (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if (!AC) { return; }
      audioCtx = new AC();
      if (audioCtx.resume) { audioCtx.resume(); }
    } catch (e) { audioCtx = null; }
  }
  function pluck(freq) {
    if (!audioCtx) { return; }
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.04, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.9);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 1);
    } catch (e) {}
  }

  // Drag is the kite-flyer's hand on the string: dragging up raises the
  // wind, dragging down lowers it. Nothing is clicked or selected.
  var dragging = false;
  var lastX = 0, lastY = 0;
  function pointerPos(e) {
    var r = { x: 0, y: 0 };
    try {
      if (typeof e.clientX === 'number') { r.x = e.clientX; r.y = e.clientY; }
      if (canvas.getBoundingClientRect) {
        var b = canvas.getBoundingClientRect();
        r.x -= b.left; r.y -= b.top;
      }
    } catch (err) {}
    return r;
  }
  function onDown(e) {
    ensureAudio();
    dragging = true;
    var p = pointerPos(e);
    lastX = p.x; lastY = p.y;
    if (e.preventDefault) { e.preventDefault(); }
  }
  function onMove(e) {
    if (!dragging) { return; }
    var p = pointerPos(e);
    var dx = p.x - lastX, dy = p.y - lastY;
    wind = clamp(wind + (0 - dy) * 0.015 + Math.abs(dx) * 0.002, 0, 5);
    lastX = p.x; lastY = p.y;
    draw(currentT());
  }
  function onUp() { dragging = false; }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(currentT()); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(currentT()); });
    }
  } catch (e) {}

  var startNow = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var started = false;
  function currentT() {
    if (!started) { return FIRST_T; }
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    return FIRST_T + (now - startNow) / 1000;
  }

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    started = true;
    startNow = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - startNow) / 1000;
      var pass = passAt(t, wind);
      if (pass && pass.cycle !== lastCycle) {
        lastCycle = pass.cycle;
        pluck(VOICES[pass.to].note);
      }
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
