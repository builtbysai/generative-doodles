<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Walk Is the Score</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0E1C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var FRAME_T = 60.0; /* fixed phase: t = 60 s */
var FLOOR = '#0A0E1C'; /* dark room floor, near-black blue */
var FLOOR_LT = '#0E1326'; /* floor, slightly lighter toward the top */
var STEEL = '#9AA3B2'; /* bare steel grey wires */
var STEEL_DIM = '#5F6878'; /* wires far from the performer */
var WOOD = '#C9A876'; /* pale wood resonators */
var WOOD_DK = '#A9855C'; /* resonator edge and grain */
var AMBER = '#E8A33D'; /* position glow, warm amber */
var AMBER_DK = '#C77F1F'; /* deep amber, bloom core */
var AUD = '#232A3D'; /* audience, dim silhouette band */
var AUD_DK = '#1B2133'; /* audience, deeper silhouettes */
var FIGURE = '#EDE6D6'; /* the performer, pale linen */
var PLATE_FILL = '#0A0E1C';
var PLATE_LINE = 'rgba(154,163,178,0.30)';
var PLATE_INK = '#D8DEE9';
var HINT_INK = '#C7D2E0';
var WIRE_N = 24; /* real count, asserted by the harness */
var ZONE_N = 6; /* invisible thresholds across the room length */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, u) { return a + (b - a) * u; }
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + clamp(a, 0, 1).toFixed(4) + ')';
}
function smooth01(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* Room plan geometry, recomputed on resize. ROOM is the room seen
   from above; BOXW is the resonator width; WIRES span between boxes. */
var F = { x: 0, y: 0, w: 0, h: 0 };
var ROOM = { x: 0, y: 0, w: 0, h: 0 };
var BOXW = 0;
var BAND = { y0: 0, y1: 0 }; /* wire band, top and bottom */
var AUDY = 0; /* audience band baseline */
/* The performer walks the length of the room. perfX is her position
   as a fraction of the room length; targetX is where the drag points.
   She lags behind the drag like a body walking. */
var perfX = 0.32;
var targetX = 0.32;
var dragging = false;
var walkPhase = 0; /* advances with distance walked, drives the bow */
var lastPerfX = 0.32;
var lastMoveT = -100; /* phase time of the last drag movement */
var perfY = 0.5; /* fraction down the wire band where she stands */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {

    isPhone = mn < 700 || VH > VW * 1.15;

    F = { x: 0, y: 0, w: VW, h: VH };

    var side = Math.min(VW, VH) - 40;

    x: F.x + F.w * 0.035,
    y: F.y + F.h * 0.085,
    w: F.w * 0.93,
    h: F.h * 0.80

  BOXW = ROOM.w * 0.055;

}
/* Wire i runs left to right, converging slightly onto the resonator
   boxes at both ends: the spread is full at mid-room and pinched to
   0.80 at the boxes. Returns endpoints in room pixels. */
function wireEnds(i) {
  var u = WIRE_N === 1 ? 0.5 : i / (WIRE_N - 1);
  var cy = (BAND.y0 + BAND.y1) / 2;
  var half = (BAND.y1 - BAND.y0) / 2;
  var yL = cy + (u - 0.5) * 2 * half * 0.80;
  var yR = cy + (u - 0.5) * 2 * half * 0.80;

    x0: ROOM.x + BOXW, y0: yL,

}
function wireYAt(i, x) {

function zoneOf(x) {

}
/* Just-intonation drone stack. Ratios over a 55 Hz root; each floor

var RATIOS = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3, 2, 7 / 4, 15 / 8];
var ZONE_GAINS = [
  [0.50, 0.10, 0.30, 0.12, 0.08, 0.20, 0.04, 0.03],
  [0.42, 0.22, 0.12, 0.30, 0.10, 0.16, 0.05, 0.04],
  [0.36, 0.12, 0.34, 0.14, 0.22, 0.12, 0.10, 0.05],
  [0.40, 0.10, 0.14, 0.34, 0.12, 0.22, 0.06, 0.10],
  [0.34, 0.26, 0.10, 0.16, 0.30, 0.14, 0.12, 0.06],
  [0.44, 0.08, 0.22, 0.10, 0.14, 0.30, 0.16, 0.12]

var audio = null; /* { ctx, gains[], master } or null until first gesture */
var audioZone = -1;
function ensureAudio() {

    master.connect(ac.destination);

      osc.type = 'sine';

function retuneAudio(zone, instant) {

  var t = audio.ctx.currentTime;
  var i;
  for (i = 0; i < RATIOS.length; i++) {

    var g = audio.gains[i].gain;

    if (instant) audio.master.gain.setValueAtTime(0.9, t);

}
function decayAudio() {
  if (!audio) return;
  var t = audio.ctx.currentTime;

  try {
    audio.master.gain.linearRampToValueAtTime(0.0001, t + 2.5);
    for (i = 0; i < RATIOS.length; i++) {
      audio.gains[i].gain.linearRampToValueAtTime(0.0001, t + 2.5);
    }

}
function drawFloor() {
  var g = ctx.createLinearGradient(0, ROOM.y, 0, ROOM.y + ROOM.h);
  g.addColorStop(0, FLOOR_LT);
  g.addColorStop(1, FLOOR);
  ctx.fillStyle = g;
  ctx.fillRect(ROOM.x, ROOM.y, ROOM.w, ROOM.h);
  ctx.strokeStyle = rgba(STEEL, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(ROOM.x + 0.5, ROOM.y + 0.5, ROOM.w - 1, ROOM.h - 1);
  /* Notation ticks along the top edge mark the invisible thresholds. */
  var z;
  ctx.fillStyle = rgba(STEEL, 0.55);
  for (z = 1; z < ZONE_N; z++) {
    var tx = ROOM.x + (z / ZONE_N) * ROOM.w;
    ctx.fillRect(tx - 0.5, ROOM.y + 2, 1, Math.max(5, ROOM.h * 0.014));
    ctx.beginPath();
    ctx.moveTo(tx + 3, ROOM.y + 8);
    ctx.lineTo(tx, ROOM.y + 3);
    ctx.lineTo(tx - 3, ROOM.y + 8);
    ctx.closePath();
    ctx.fill();
  }
}
function drawResonators() {
  var bw = BOXW;
  var bh = (BAND.y1 - BAND.y0) * 1.06;
  var by = (BAND.y0 + BAND.y1) / 2 - bh / 2;
  var bx;
  for (bx = 0; bx < 2; bx++) {
    var x = bx === 0 ? ROOM.x : ROOM.x + ROOM.w - bw;
    ctx.fillStyle = WOOD;
    ctx.fillRect(x, by, bw, bh);
    ctx.strokeStyle = WOOD_DK;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, by + 0.5, bw - 1, bh - 1);
    /* Grain lines down the pale wood. */
    var gi;
    ctx.strokeStyle = rgba(WOOD_DK, 0.5);
    for (gi = 1; gi < 4; gi++) {
      var gx = x + (gi / 4) * bw;
      ctx.beginPath();
      ctx.moveTo(gx, by + 4);
      ctx.lineTo(gx, by + bh - 4);
      ctx.stroke();
    }
    /* Bridge pins where the wires meet the box. */
    var pi;
    for (pi = 0; pi < WIRE_N; pi++) {
      var w = wireEnds(pi);
      var px = bx === 0 ? w.x0 : w.x1;
      var py = bx === 0 ? w.y0 : w.y1;
      ctx.fillStyle = WOOD_DK;
      ctx.beginPath();
      ctx.moveTo(px + 1.5, py);
      ctx.arc(px, py, 1.5, 0, TAU);
      ctx.fill();
    }
  }

function drawAudience(t) {
  var n = isPhone ? 14 : 22;

    var u = (i + 0.5) / n;
    var ax = ROOM.x + u * ROOM.w;
    var sway = Math.sin(TAU * t / 47 + i * 1.7) * ROOM.h * 0.002;
    var r = Math.max(3, ROOM.w * 0.011);
    var tone = i % 3 === 0 ? AUD_DK : AUD;
    ctx.fillStyle = tone;
    ctx.beginPath();
    ctx.moveTo(ax + r, AUDY + sway);
    ctx.arc(ax, AUDY + sway, r, 0, TAU);
    ctx.fill();
    ctx.fillRect(ax - r * 0.85, AUDY + sway + r * 0.4, r * 1.7, ROOM.h * 0.035);

  ctx.fillStyle = rgba(STEEL, 0.25);
  ctx.font = (isPhone ? 9 : 10) + 'px monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';

function drawWires(t) {

  for (i = 0; i < WIRE_N; i++) {
    w = wireEnds(i);
    var wy = wireYAt(i, px);
    var d = Math.abs(wy - py) / ((BAND.y1 - BAND.y0) / 2);

    ctx.lineWidth = Math.max(1, ROOM.w * 0.0011);

    ctx.lineTo(w.x1, w.y1);

    ctx.lineWidth = Math.max(1.5, ROOM.w * 0.0022);

    ctx.moveTo(x0, lerp(w.y0, w.y1, (x0 - w.x0) / (w.x1 - w.x0)));

function drawPerformer(t) {

/* ---- frame one: fixed phase t = 60 s ----

      lastPerfX = perfX;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
