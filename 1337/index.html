<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flash Reveal</title>
<style>
  html, body { margin: 0; padding: 0; background: #0D0C0B; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Fixed latent composition: one archival street scene, always the same. */
  var rng = mulberry32(1337000);
  var FIG = [];
  var COATS = ['#5C4A3A', '#2E4A5A', '#7A2E2E', '#4A4038', '#3A3A3C', '#5A5A42'];
  var i, fx, fy, fs;
  for (i = 0; i < 46; i++) {
    fx = 0.04 + rng() * 0.92;
    fy = 0.62 + rng() * 0.30;
    fs = 0.55 + rng() * 0.75;
    FIG.push({ x: fx, y: fy, s: fs, coat: COATS[(rng() * COATS.length) | 0], hat: rng() < 0.4 });
  }
  /* Faint dark-state texture: breath on glass. */
  var SPECK = [];
  for (i = 0; i < 240; i++) {
    SPECK.push({ x: rng(), y: rng(), r: 0.6 + rng() * 1.8, a: 0.05 + rng() * 0.10 });
  }
  var ARCS = [];
  for (i = 0; i < 7; i++) {
    ARCS.push({ x: rng(), y: rng(), r: 0.10 + rng() * 0.22, a0: rng() * 6.28, a1: 0 });
  }
  for (i = 0; i < ARCS.length; i++) ARCS[i].a1 = ARCS[i].a0 + 0.6 + rng() * 1.4;

  var flash = null; /* {x, y, down, up} in css px, times in seconds */
  var started = false;
  var startMs = 0;

  function size() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function disc(x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, 6.283185307179586);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawLatent(t) {
    var u = Math.min(W, H);
    /* Sky / buildings. */
    ctx.fillStyle = '#232326';
    ctx.fillRect(0, 0, W, H * 0.62);
    ctx.fillStyle = '#2C2C30';
    ctx.fillRect(W * 0.06, H * 0.10, W * 0.16, H * 0.52);
    ctx.fillStyle = '#26262A';
    ctx.fillRect(W * 0.30, H * 0.06, W * 0.20, H * 0.56);
    ctx.fillStyle = '#2C2C30';
    ctx.fillRect(W * 0.58, H * 0.12, W * 0.14, H * 0.50);
    ctx.fillStyle = '#26262A';
    ctx.fillRect(W * 0.80, H * 0.08, W * 0.15, H * 0.54);
    /* Windows: sparse lit dots, flat alpha. */
    var wx, wy;
    ctx.fillStyle = 'rgba(232,181,58,0.55)';
    for (wx = 0; wx < 9; wx++) {
      for (wy = 0; wy < 5; wy++) {
        if ((wx * 7 + wy * 3) % 4 === 0) {
          ctx.fillRect(W * 0.075 + wx * W * 0.017, H * 0.13 + wy * H * 0.085, W * 0.008, H * 0.028);
        }
      }
    }
    /* Street. */
    ctx.fillStyle = '#3A3A3C';
    ctx.fillRect(0, H * 0.62, W, H * 0.38);
    ctx.fillStyle = '#434347';
    ctx.fillRect(0, H * 0.78, W, H * 0.012);
    /* Crowd: head disc + coat trapezoid, painterly flat. */
    var f, cx, cy, ch, cw, hh;
    for (i = 0; i < FIG.length; i++) {
      f = FIG[i];
      cx = f.x * W;
      cy = f.y * H;
      ch = u * 0.085 * f.s;
      cw = ch * 0.62;
      hh = ch * 0.30;
      ctx.fillStyle = f.coat;
      ctx.beginPath();
      ctx.moveTo(cx - cw, cy);
      ctx.lineTo(cx - cw * 0.72, cy - ch);
      ctx.lineTo(cx + cw * 0.72, cy - ch);
      ctx.lineTo(cx + cw, cy);
      ctx.closePath();
      ctx.fill();
      disc(cx, cy - ch - hh * 0.55, hh * 0.62, '#8A5A3B');
      if (f.hat) {
        ctx.fillStyle = '#2A241E';
        ctx.fillRect(cx - hh * 0.75, cy - ch - hh * 1.15, hh * 1.5, hh * 0.22);
      }
    }
    /* The one vivid accent: a protest sign, yellow, held high left of center. */
    var sx = W * 0.38, sy = H * 0.52;
    ctx.fillStyle = '#3A332A';
    ctx.fillRect(sx - u * 0.002, sy, u * 0.004, H * 0.20);
    ctx.fillStyle = '#E8B53A';
    ctx.fillRect(sx - u * 0.055, sy - u * 0.075, u * 0.11, u * 0.075);
    ctx.fillStyle = '#B8912E';
    ctx.fillRect(sx - u * 0.055, sy - u * 0.075, u * 0.11, u * 0.012);
    /* Vignette falloff to black: flat-alpha edge bands. */
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H * 0.03);
    ctx.fillRect(0, H * 0.97, W, H * 0.03);
    ctx.fillRect(0, 0, W * 0.03, H);
    ctx.fillRect(W * 0.97, 0, W * 0.03, H);
  }

  function drawDark(t) {
    var u = Math.min(W, H);
    ctx.fillStyle = '#0D0C0B';
    ctx.fillRect(0, 0, W, H);
    /* Faint texture, barely there. */
    var s, a;
    for (i = 0; i < SPECK.length; i++) {
      s = SPECK[i];
      ctx.fillStyle = 'rgba(30,28,26,' + s.a.toFixed(3) + ')';
      ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
    }
    ctx.strokeStyle = 'rgba(30,28,26,0.5)';
    ctx.lineWidth = 1;
    for (i = 0; i < ARCS.length; i++) {
      a = ARCS[i];
      ctx.beginPath();
      ctx.moveTo(a.x * W + a.r * u * Math.cos(a.a0), a.y * H + a.r * u * Math.sin(a.a0));
      ctx.arc(a.x * W, a.y * H, a.r * u, a.a0, a.a1);
      ctx.stroke();
    }
    /* Pulsing camera-flash icon, shapes only, bottom right. */
    var ix = W * 0.88, iy = H * 0.88, is = u * 0.032;
    var pulse = 0.55 + 0.35 * Math.sin(6.283185307179586 * t / 2.4);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#FFFDF5';
    ctx.beginPath();
    ctx.moveTo(ix + is * 0.15, iy - is);
    ctx.lineTo(ix - is * 0.45, iy + is * 0.15);
    ctx.lineTo(ix - is * 0.05, iy + is * 0.15);
    ctx.lineTo(ix - is * 0.15, iy + is);
    ctx.lineTo(ix + is * 0.45, iy - is * 0.15);
    ctx.lineTo(ix + is * 0.05, iy - is * 0.15);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* Flash intensity as a closed-form function of piece time and tap events. */
  function flashState(t) {
    /* Ambient half-flash: one brief flicker per 25 s, never a full reveal. */
    var ph = t % 25;
    var amb = null;
    if (ph >= 24.2) {
      var ap = (ph - 24.2) / 0.8;
      var ae = ap < 0.5 ? ap * 2 : (1 - ap) * 2;
      amb = { x: W * 0.5, y: H * 0.5, r: Math.min(W, H) * 0.22, a: 0.5 * ae };
    }
    if (!flash) return amb;
    if (flash.up === null) {
      /* Held: full bulb. */
      return { x: flash.x, y: flash.y, r: Math.min(W, H) * 0.52, a: 1 };
    }
    var dt = t - flash.up;
    if (dt >= 2) return amb;
    var d = 1 - dt / 2;
    return { x: flash.x, y: flash.y, r: Math.min(W, H) * 0.52 * (0.35 + 0.65 * d), a: d };
  }

  function draw(t) {
    size();
    drawDark(t);
    var fs = flashState(t);
    if (fs && fs.a > 0.01 && fs.r > 2) {
      /* Concentric flat-alpha discs: outer rings faint, core full. */
      var N = 24, j, rr, aa;
      for (j = N - 1; j >= 0; j--) {
        rr = fs.r * (j + 1) / N;
        aa = fs.a * (0.25 + 0.75 * (j + 1) / N);
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(fs.x + rr, fs.y);
        ctx.arc(fs.x, fs.y, rr, 0, 6.283185307179586);
        ctx.clip();
        ctx.globalAlpha = aa;
        drawLatent(t);
        ctx.restore();
        ctx.globalAlpha = 1;
      }
      /* Overexposed core. */
      ctx.globalAlpha = 0.22 * fs.a;
      disc(fs.x, fs.y, fs.r * 0.10, '#FFFDF5');
      ctx.globalAlpha = 1;
    }
  }

  function now() {
    return started ? (performance.now() - startMs) / 1000 : 0;
  }

  function loop() {
    draw(now());
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }

  function down(e) {
    var r = canvas.getBoundingClientRect();
    var x = (e.clientX - r.left) * (W / Math.max(1, r.width));
    var y = (e.clientY - r.top) * (H / Math.max(1, r.height));
    flash = { x: x, y: y, down: now(), up: null };
    if (e.preventDefault) e.preventDefault();
  }
  function up() {
    if (flash && flash.up === null) flash.up = now();
  }

  canvas.addEventListener('pointerdown', down, false);
  if (typeof window !== 'undefined') {
    window.addEventListener('pointerup', up, false);
    window.addEventListener('pointercancel', up, false);
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', function () { draw(now()); }, false);
    }
    window.addEventListener('resize', function () { draw(now()); }, false);
  }

  /* Frame one: synchronous, exactly t = 0, before the clock starts. */
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    started = true;
    startMs = performance.now();
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
