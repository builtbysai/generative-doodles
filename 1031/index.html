<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Is the Instrument</title>
<style>
  html, body { margin: 0; padding: 0; background: #070708; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- constants ----------
  var FIELD = '#070708';
  var WARM = '#FFE9B8';
  var RING = '#3A3D46';
  var FLARE = '#FFFFFF';
  var DOWN = '#FFD97A';
  var STEP = 1 / 120;              // fixed sim step, seconds
  var PREROLL = 2400;              // 20 s at 120 Hz: frame one lives here
  var BASE = 2.4;                  // base period, seconds
  var DB_WINDOW = 11;              // 90 ms at 120 Hz ~ 11 steps
  // Ratios against the base: simple ratios mixed with irrationals.
  var RATIOS = [1, 4 / 3, 3 / 2, Math.SQRT2, 2, (1 + Math.sqrt(5)) / 2,
                5 / 3, Math.PI / 2, Math.sqrt(3), 3, 2 * Math.SQRT2, 5 / 2];
  // Clocks 0, 2, 4, 9 (ratios 1, 3/2, 2, 3) share a common tick at T_ALIGN:
  // the rational family whose downbeats are earned, every 14.4 s (their LCM).
  var FAMILY = [0, 2, 4, 9];
  var T_ALIGN = 19.7;
  var BASE_SEED = 1031192;

  var seed = BASE_SEED;
  var simStep = 0;
  var simTime = 0;

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function fit() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    if (vv && vv.width) { W = vv.width; H = vv.height; }
    else if (typeof window !== 'undefined' && window.innerWidth) { W = window.innerWidth; H = window.innerHeight; }
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { fit(); draw(); });
    }
  }

  // ---------- clocks ----------
  // phase0 chosen so a tick lands at absolute time T: ticks at (T mod P) + kP.
  function phaseForTickAt(P, T) {
    var f = (T % P) / P;
    return (1 - f) % 1;
  }

  var clocks = [];   // {period, phase, bend, bendTarget, flash, energy, lastTick, lastDown}
  var shimmer = 0;   // global downbeat envelope

  function buildClocks(s, alignAt) {
    var rng = mulberry32(s);
    clocks = [];
    for (var i = 0; i < 12; i++) {
      var P = BASE * RATIOS[i];
      var ph;
      if (FAMILY.indexOf(i) >= 0) ph = phaseForTickAt(P, alignAt);
      else if (i === 3) ph = phaseForTickAt(P, alignAt + 0.06); // sqrt2 straggler joins the window
      else ph = rng();
      clocks.push({
        period: P, phase: ph, bend: 1, bendTarget: 1,
        flash: 0, energy: 0, lastTick: -100000, lastDown: -100000
      });
    }
    shimmer = 0;
  }

  // ---------- audio (lazy, gesture-gated, guarded) ----------
  var AC = null, masterGain = null, glissOsc = null, glissGain = null;
  function audioOn() {
    if (AC) return true;
    var Ctor = null;
    if (typeof window !== 'undefined') Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor && typeof AudioContext !== 'undefined') Ctor = AudioContext;
    if (!Ctor) return false;
    try {
      AC = new Ctor();
      masterGain = AC.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(AC.destination);
    } catch (e) { AC = null; return false; }
    return true;
  }
  function freqFor(c) { return 523.25 * Math.pow(BASE / (c.period * c.bend), 0.8); }
  function tone(freq, t0, dur, vol, type) {
    if (!AC) return;
    try {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  }
  function playTick(i) {
    if (!AC) return;
    tone(freqFor(clocks[i]), AC.currentTime, 0.4, 0.10);
  }
  function playDownbeat(members) {
    if (!AC) return;
    var t0 = AC.currentTime;
    for (var k = 0; k < members.length; k++) tone(freqFor(clocks[members[k]]), t0, 0.9, 0.07);
    tone(freqFor(clocks[members[0]]) / 2, t0, 1.1, 0.05);
  }
  function glissStart() {
    if (!AC || glissOsc) return;
    try {
      glissOsc = AC.createOscillator(); glissGain = AC.createGain();
      glissOsc.type = 'sine'; glissGain.gain.value = 0.0;
      glissGain.gain.linearRampToValueAtTime(0.04, AC.currentTime + 0.1);
      glissOsc.connect(glissGain); glissGain.connect(masterGain);
      glissOsc.start();
    } catch (e) { glissOsc = null; }
  }
  function glissSet(freq) {
    if (!AC || !glissOsc) return;
    try { glissOsc.frequency.setTargetAtTime(freq, AC.currentTime, 0.05); } catch (e) {}
  }
  function glissStop() {
    if (!AC || !glissOsc) return;
    try {
      glissGain.gain.setTargetAtTime(0.0, AC.currentTime, 0.08);
      glissOsc.stop(AC.currentTime + 0.4);
    } catch (e) {}
    glissOsc = null; glissGain = null;
  }

  // ---------- simulation ----------
  var tickQueue = [];   // audio events gathered during steps: {type, i|members}

  function step() {
    simStep++; simTime += STEP;
    var ticked = [];
    for (var i = 0; i < 12; i++) {
      var c = clocks[i];
      // bend eases toward its target: fast while dragging, slow spring home
      var tau = (c.bendTarget !== 1) ? 0.15 : 2.0;
      c.bend += (c.bendTarget - c.bend) * (1 - Math.exp(-STEP / tau));
      c.phase += STEP / (c.period * c.bend);
      if (c.phase >= 1) {
        c.phase -= 1;
        c.lastTick = simStep;
        c.flash = 1;
        c.energy = Math.min(1.6, c.energy + 1);
        ticked.push(i);
        tickQueue.push({ type: 'tick', i: i });
      }
      c.flash *= Math.exp(-STEP / 0.30);
      c.energy *= Math.exp(-STEP / 0.45);
    }
    shimmer *= Math.exp(-STEP / 0.9);
    if (ticked.length) {
      // downbeat: 3+ clocks whose last ticks fall inside the 90 ms window
      for (var a = 0; a < ticked.length; a++) {
        var members = [];
        for (var j = 0; j < 12; j++) {
          if (simStep - clocks[j].lastTick <= DB_WINDOW) members.push(j);
        }
        if (members.length >= 3) {
          for (var m = 0; m < members.length; m++) {
            clocks[members[m]].lastDown = simStep;
            clocks[members[m]].energy = Math.min(1.9, clocks[members[m]].energy + 0.7);
          }
          shimmer = 1;
          tickQueue.push({ type: 'down', members: members });
          break;
        }
      }
    }
  }

  function flushAudio() {
    if (!AC) { tickQueue.length = 0; return; }
    for (var k = 0; k < tickQueue.length; k++) {
      var ev = tickQueue[k];
      if (ev.type === 'tick') playTick(ev.i);
      else playDownbeat(ev.members);
    }
    tickQueue.length = 0;
  }

  // ---------- layout ----------
  function layout() {
    var phone = isPhone();
    var x0 = W * 0.09, x1 = W * 0.91;
    var xs = [];
    for (var i = 0; i < 12; i++) xs.push(x0 + (x1 - x0) * (i / 11));
    var trackTop = H * 0.44, trackBot = H * 0.85;
    var ys = [];
    for (var j = 0; j < 12; j++) ys.push(trackTop + (trackBot - trackTop) * (j / 11));
    return {
      phone: phone, xs: xs, ys: ys,
      clockY: H * 0.21,
      nodeR: phone ? 4.5 : 6.5,
      ringR: phone ? 10.5 : 14,
      lineH: phone ? 2.5 : 3.5,
      trackX0: x0, trackX1: x1,
      trackTop: trackTop, trackBot: trackBot
    };
  }

  // ---------- draw ----------
  function circle(x, y, r, fill, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);
    var L = layout();
    var i, c, x, y;

    // downbeat shimmer column, far left of the score
    if (shimmer > 0.01) {
      var sx = W * 0.035;
      ctx.globalAlpha = 0.08 * shimmer;
      ctx.fillStyle = DOWN;
      ctx.fillRect(sx - 6, L.trackTop - H * 0.03, 12, (L.trackBot - L.trackTop) + H * 0.06);
      ctx.globalAlpha = 0.20 * shimmer;
      ctx.fillRect(sx - 1, L.trackTop - H * 0.03, 2, (L.trackBot - L.trackTop) + H * 0.06);
      ctx.globalAlpha = 1;
    }

    // tracks: idle line, energy body, white tick flash, downbeat tint
    for (i = 0; i < 12; i++) {
      c = clocks[i];
      y = L.ys[i] - L.lineH / 2;
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = WARM;
      ctx.fillRect(L.trackX0, y, L.trackX1 - L.trackX0, L.lineH);
      var downAge = (simStep - c.lastDown) * STEP;
      var eAlpha = Math.min(0.8, c.energy * 0.62);
      if (eAlpha > 0.01) {
        ctx.globalAlpha = eAlpha;
        ctx.fillStyle = (downAge < 1.1) ? DOWN : WARM;
        ctx.fillRect(L.trackX0, y, L.trackX1 - L.trackX0, L.lineH);
      }
      if (c.flash > 0.02) {
        ctx.globalAlpha = Math.min(0.65, c.flash * 0.65);
        ctx.fillStyle = FLARE;
        ctx.fillRect(L.trackX0, y, L.trackX1 - L.trackX0, L.lineH);
      }
      ctx.globalAlpha = 1;
    }

    // clocks: ring track, phase arc, glowing node
    for (i = 0; i < 12; i++) {
      c = clocks[i];
      x = L.xs[i]; y = L.clockY;
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = RING;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x, y, L.ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = WARM;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, L.ringR, -Math.PI / 2, -Math.PI / 2 + c.phase * Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      // glow: layered alpha, no gradients
      circle(x, y, L.nodeR * 3.1, WARM, 0.05 + c.flash * 0.10);
      circle(x, y, L.nodeR * 1.9, WARM, 0.10 + c.flash * 0.18);
      circle(x, y, L.nodeR, WARM, 0.85);
      if (c.flash > 0.02) circle(x, y, L.nodeR * (0.55 + c.flash * 0.3), FLARE, Math.min(0.95, c.flash));
    }
  }

  // ---------- interaction ----------
  var pDown = null;     // {x, y, t, dragged, clock}
  var lastTap = null;   // {t, clock}
  var dragging = false;

  function clockAt(px, py) {
    var L = layout();
    var best = -1, bd = 1e9;
    for (var i = 0; i < 12; i++) {
      var dx = px - L.xs[i], dy = py - L.clockY;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bd) { bd = d; best = i; }
    }
    var tol = Math.max(30, (L.xs[1] - L.xs[0]) * 0.55);
    return (bd <= Math.max(tol, Math.abs(py - L.clockY) < H * 0.12 ? tol : 0) && Math.abs(py - L.clockY) < H * 0.14) ? best : -1;
  }

  function onDown(e) {
    audioOn();
    if (AC && AC.resume) { try { AC.resume(); } catch (err) {} }
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var px = (e.clientX || 0) - r.left, py = (e.clientY || 0) - r.top;
    pDown = { x: px, y: py, dx: 0, dragged: false, clock: clockAt(px, py) };
    dragging = false;
  }

  function onMove(e) {
    if (!pDown) return;
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var px = (e.clientX || 0) - r.left, py = (e.clientY || 0) - r.top;
    var totalDX = px - pDown.x;
    if (Math.abs(totalDX) > 6 || Math.abs(py - pDown.y) > 6) pDown.dragged = true;
    if (pDown.dragged) {
      dragging = true;
      var L = layout();
      var bend = Math.max(0.55, Math.min(1.8, 1 + (totalDX / 260)));
      // every clock swept between the press point and the finger gets bent
      var lo = Math.min(pDown.x, px), hi = Math.max(pDown.x, px);
      var bent = -1;
      for (var i = 0; i < 12; i++) {
        if (L.xs[i] >= lo - 14 && L.xs[i] <= hi + 14) { clocks[i].bendTarget = bend; bent = i; }
      }
      if (bent < 0) { var near = clockAt(px, py); if (near >= 0) { clocks[near].bendTarget = bend; bent = near; } }
      if (AC && bent >= 0) { glissStart(); glissSet(freqFor(clocks[bent])); }
    }
  }

  function onUp(e) {
    if (!pDown) return;
    var wasDrag = pDown.dragged;
    var clk = pDown.clock;
    for (var i = 0; i < 12; i++) clocks[i].bendTarget = 1;
    if (dragging) glissStop();
    dragging = false;
    if (!wasDrag) {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : simTime * 1000;
      if (lastTap && (now - lastTap.t) < 350) {
        // double tap: new clockwork
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        buildClocks(seed, simTime + 5 + mulberry32(seed)() * 8);
        lastTap = null;
      } else {
        if (clk >= 0) {
          clocks[clk].phase += 0.15;   // nudge the tick earlier
          if (clocks[clk].phase >= 1) clocks[clk].phase -= 1;
        }
        lastTap = { t: now, clock: clk };
      }
    }
    pDown = null;
    draw();
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---------- boot: fixed pre-roll, then frame one ----------
  fit();
  buildClocks(seed, T_ALIGN);
  for (var s = 0; s < PREROLL; s++) step();
  tickQueue.length = 0;   // frame one is silent; pre-roll sounds never play
  draw();

  // ---------- live loop ----------
  if (typeof requestAnimationFrame !== 'undefined') {
    var lastTs = null, acc = 0;
    var loop = function (ts) {
      if (lastTs === null) lastTs = ts;
      var dt = Math.min(0.1, Math.max(0, (ts - lastTs) / 1000));
      lastTs = ts;
      acc += dt;
      var n = 0;
      while (acc >= STEP && n < 40) { step(); acc -= STEP; n++; }
      flushAudio();
      draw();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
