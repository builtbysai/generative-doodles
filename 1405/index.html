<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Segregations</title>
<style>
html,body{margin:0;padding:0;background:#e8e2d4;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, nowT = 0;
  var WALL = '#e8e2d4', FLOOR = '#d5cdb6', WIN = '#7a9ab0';
  var STEEL = '#8a8f94', SHADOW = '#4a4a44', DUST = '#c89a5e';
  var PERIOD = 150, DRIFT = 25, CYCLE = 120;

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function clamp(x,a,b){return x<a?a:(x>b?b:x);}
  function smooth(x){x=clamp(x,0,1);return x*x*(3-2*x);}
  function a4(x){return Math.round(clamp(x,0,1)*10000)/10000;}
  function rgba(hex,al){
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+a4(al)+')';
  }
  function resize(){
    var w = (typeof window!=='undefined'&&window.visualViewport)?window.visualViewport.width:window.innerWidth;
    var h = (typeof window!=='undefined'&&window.visualViewport)?window.visualViewport.height:window.innerHeight;
    W=w;H=h;
    canvas.width=w;canvas.height=h;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
  }

  var NWORDS = 7, words = [];
  for(var i=0;i<NWORDS;i++){
    var rng = mulberry32(1405000+i*7919);
    var g = [], n = 3+Math.floor(rng()*3);
    for(var k=0;k<n;k++) g.push(Math.floor(rng()*8));
    words.push({idx:i, glyphs:g, offset:i*23, manual:null, dragCount:0});
  }
  function settlePoint(wi, round){
    var r = mulberry32(1405000+wi*7919+round*104729);
    return {x:(0.12+0.76*r())*W, y:(0.52+0.28*r())*H};
  }
  function windowPoint(){return {x:0.19*W, y:0.20*H};}

  var dragging = null;
  function wordState(wd, t){
    if(dragging && dragging.word===wd){
      return {x:dragging.x, y:dragging.y, rot:0, lift:1};
    }
    var phase = (((t+wd.offset)%PERIOD)+PERIOD)%PERIOD;
    var round = Math.floor((t+wd.offset)/PERIOD);
    var driftStart = t-phase;
    var m = wd.manual;
    if(m){
      var dsAfter = (Math.floor((m.releaseTime+3+wd.offset)/PERIOD)+1)*PERIOD-wd.offset;
      if(t<dsAfter){
        if(t<m.releaseTime+3){
          var p = smooth((t-m.releaseTime)/3);
          return {x:m.releasePos.x+(m.settle.x-m.releasePos.x)*p,
                  y:m.releasePos.y+(m.settle.y-m.releasePos.y)*p-Math.sin(p*Math.PI)*18,
                  rot:0, lift:1-p};
        }
        return {x:m.settle.x, y:m.settle.y, rot:0, lift:0};
      }
      if(phase<DRIFT && Math.abs(driftStart-dsAfter)<0.001){
        var p2 = smooth(phase/DRIFT);
        var tgt2 = settlePoint(wd.idx,round);
        return {x:m.settle.x+(tgt2.x-m.settle.x)*p2,
                y:m.settle.y+(tgt2.y-m.settle.y)*p2-Math.sin(p2*Math.PI)*18,
                rot:(p2*1.2-0.6), lift:0};
      }
    }
    if(phase<DRIFT){
      var dep = (round===0)?windowPoint():settlePoint(wd.idx,round-1);
      var tgt = settlePoint(wd.idx,round);
      var p3 = smooth(phase/DRIFT);
      return {x:dep.x+(tgt.x-dep.x)*p3,
              y:dep.y+(tgt.y-dep.y)*p3-Math.sin(p3*Math.PI)*18,
              rot:(p3*1.2-0.6), lift:0};
    }
    var s = settlePoint(wd.idx,round);
    return {x:s.x, y:s.y, rot:0, lift:0};
  }

  function pointerPos(e){
    var r = {left:0,top:0};
    if(canvas.getBoundingClientRect){r = canvas.getBoundingClientRect();}
    return {x:(e.clientX||0)-r.left, y:(e.clientY||0)-r.top};
  }
  function onDown(e){
    var p = pointerPos(e);
    var best = null, bd = 1e9;
    for(var i=0;i<words.length;i++){
      var s = wordState(words[i],nowT);
      var d = Math.hypot(s.x-p.x, s.y-p.y);
      if(d<bd){bd=d;best=words[i];}
    }
    if(best && bd<60){dragging = {word:best, x:p.x, y:p.y, moved:0};}
  }
  function onMove(e){
    if(!dragging) return;
    var p = pointerPos(e);
    dragging.moved += Math.hypot(p.x-dragging.x, p.y-dragging.y);
    dragging.x = p.x; dragging.y = p.y;
  }
  function onUp(){
    if(!dragging) return;
    var w = dragging.word;
    if(dragging.moved>=14){
      var r = mulberry32(1405000+w.idx*7919+w.dragCount*31337+7);
      w.manual = {releaseTime:nowT, releasePos:{x:dragging.x, y:dragging.y},
                  settle:{x:(0.12+0.76*r())*W, y:(0.52+0.28*r())*H}};
      w.dragCount++;
    }
    dragging = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function drawGlyph(kind,x,y,s){
    ctx.beginPath();
    if(kind===0){
      ctx.moveTo(x-s,y+s*0.5);ctx.lineTo(x,y-s*0.5);ctx.lineTo(x+s,y+s*0.5);
    }else if(kind===1){
      ctx.moveTo(x-s,y);ctx.arc(x,y,s,Math.PI,2*Math.PI);
    }else if(kind===2){
      ctx.moveTo(x-s,y);ctx.lineTo(x+s,y);ctx.moveTo(x,y-s);ctx.lineTo(x,y+s);
    }else if(kind===3){
      ctx.moveTo(x,y-s);ctx.lineTo(x,y+s);ctx.moveTo(x,y);ctx.lineTo(x+s*0.6,y+s*0.2);
    }else if(kind===4){
      ctx.fillRect(x-s*0.7,y-s,s*0.4,s*2);ctx.fillRect(x+s*0.3,y-s*0.5,s*0.4,s);
    }else if(kind===5){
      ctx.fillRect(x-s*0.7,y-s*0.3,s*0.5,s*0.5);ctx.fillRect(x+s*0.2,y-s*0.3,s*0.5,s*0.5);
    }else if(kind===6){
      ctx.moveTo(x-s,y+s*0.6);ctx.lineTo(x,y-s*0.7);ctx.lineTo(x+s,y+s*0.6);ctx.closePath();
    }else{
      ctx.moveTo(x-s,y);ctx.lineTo(x-s*0.33,y-s*0.5);ctx.lineTo(x+s*0.33,y+s*0.5);ctx.lineTo(x+s,y);
    }
    ctx.stroke();
  }
  function drawWord(wd,x,y,rot,lift){
    var gs = clamp(Math.min(W,H)*0.02,7,16);
    var gap = gs*2.6;
    var n = wd.glyphs.length;
    var x0 = -((n-1)*gap)/2;
    var sc = 1+lift*0.12;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.scale(sc,sc);
    ctx.lineWidth = Math.max(2,gs*0.28);
    ctx.lineCap = 'round';
    ctx.save();
    ctx.translate(2,3);
    ctx.strokeStyle = rgba(SHADOW,0.30);
    ctx.fillStyle = rgba(SHADOW,0.30);
    for(var k=0;k<n;k++) drawGlyph(wd.glyphs[k],x0+k*gap,0,gs);
    ctx.restore();
    ctx.strokeStyle = STEEL;
    ctx.fillStyle = STEEL;
    for(var k2=0;k2<n;k2++) drawGlyph(wd.glyphs[k2],x0+k2*gap,0,gs);
    ctx.restore();
  }

  function draw(t){
    nowT = t;
    var floorTop = 0.78*H;
    var ct = (((t+45)%CYCLE)+CYCLE)%CYCLE;
    var shActive = ct>=100 && ct<112;
    var shP = shActive ? (ct-100)/12 : 0;
    var shAmp = shActive ? 1.6*Math.sin(shP*Math.PI) : 0;
    function shx(i){return Math.sin(t*37+i*2.1)*shAmp;}
    function shy(i){return Math.cos(t*29+i*1.7)*shAmp*0.6;}

    ctx.fillStyle = WALL;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0,floorTop,W,H-floorTop);
    ctx.fillStyle = SHADOW;
    ctx.fillRect(0,floorTop,W,2);

    var wx = 0.08*W, wy = 0.08*H, ww = 0.24*W, wh = 0.22*H;
    ctx.fillStyle = SHADOW;
    ctx.fillRect(wx,wy,ww,wh);
    ctx.fillStyle = WIN;
    ctx.fillRect(wx+5,wy+5,ww-10,wh-10);
    ctx.fillStyle = SHADOW;
    ctx.fillRect(wx+ww/2-2,wy,4,wh);
    ctx.fillRect(wx,wy+wh/2-2,ww,4);
    ctx.fillStyle = STEEL;
    ctx.fillRect(wx-6,wy+wh,ww+12,6);

    var f = 0;
    function furn(x,y,w2,h2,col){
      f++;
      ctx.fillStyle = col;
      ctx.fillRect(x+shx(f),y+shy(f),w2,h2);
    }
    furn(0.50*W,0.63*H,0.20*W,0.018*H,SHADOW);
    furn(0.51*W,0.65*H,0.008*W,0.13*H,SHADOW);
    furn(0.68*W,0.65*H,0.008*W,0.13*H,SHADOW);
    furn(0.33*W,0.58*H,0.012*W,0.12*H,SHADOW);
    furn(0.33*W,0.68*H,0.09*W,0.018*H,SHADOW);
    furn(0.34*W,0.70*H,0.008*W,0.08*H,SHADOW);
    furn(0.76*W,0.44*H,0.16*W,0.012*H,SHADOW);
    furn(0.78*W,0.38*H,0.04*W,0.06*H,DUST);
    furn(0.84*W,0.40*H,0.035*W,0.04*H,WIN);
    furn(0.14*W,0.70*H,0.14*W,0.08*H,STEEL);

    if(shActive){
      var bw = 0.38*W;
      var bx = -bw+(W+2*bw)*shP;
      ctx.fillStyle = rgba(SHADOW,0.22);
      ctx.fillRect(bx,floorTop,bw,H-floorTop);
    }

    var fade = ct>112 ? (120-ct)/8 : 1;
    var dustH = (ct/CYCLE)*0.07*H;
    if(dustH>0.5 && fade>0){
      ctx.fillStyle = rgba(DUST,0.55*fade);
      ctx.fillRect(0,H-dustH,W,dustH);
      var dr = mulberry32(1405000+999);
      ctx.fillStyle = rgba(DUST,0.8*fade);
      for(var d=0;d<90;d++){
        var dx = dr()*W, dy = H-dr()*0.07*H;
        if(dy>=H-dustH){ctx.fillRect(dx,dy,2,2);}
      }
    }

    for(var wi=0;wi<words.length;wi++){
      var s = wordState(words[wi],t);
      drawWord(words[wi], s.x+shx(wi+10), s.y+shy(wi+10), s.rot, s.lift);
    }
  }

  resize();
  draw(0);
  if(typeof window!=='undefined'&&window.visualViewport&&window.visualViewport.addEventListener){
    window.visualViewport.addEventListener('resize',resize);
  }
  if(typeof window!=='undefined'&&window.addEventListener){
    window.addEventListener('resize',resize);
  }
  if(typeof requestAnimationFrame==='function'){
    var t0 = null;
    function loop(ts){
      if(t0===null) t0 = ts;
      draw((ts-t0)/1000);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
