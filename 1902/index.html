<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1902 Fish Dance When They Are Not Sleeping</title>
<style>
  html, body { margin: 0; padding: 0; background: #04101f; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var WATER = '#04101f';     // deep water black-blue
  var WATER_DEEP = '#020810';
  var WATER_GLOW = '#0a2438';
  var FISH = '#39ff9c';      // phosphor green
  var FISH_DIM = '#1fae6b';
  var FISH_DEEP = '#0d5c38';
  var SOURCE = '#ffb347';    // warm dot
  var SOURCE_DEEP = '#ff8c42';
  var LINE = '#ffffff';      // mapping lines, faint white
  var PLATE = '#dfeef2';
  var PLATE_DIM = '#7fa8b5';
  var HINT = '#9fd8c2';

  // Fixed-phase first frame: t = 6 s, source point at (0.42, 0.45),
  // school gathered around it mid-phrase. Frame one is byte-reproducible.
  var FIRST_T = 6;
  var FIRST_SX = 0.42;
  var FIRST_SY = 0.45;

  var NFISH = 9;
  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  // Source point state, normalized 0..1.
  var sx = FIRST_SX;
  var sy = FIRST_SY;
  var dragging = false;

  // Optional source-point override for QA: ?sx=0.7&sy=0.3.
  try {
    if (typeof location !== 'undefined' && location.search) {
      var q = location.search.replace(/^\?/, '').split('&');
      for (var i = 0; i < q.length; i++) {
        var kv = q[i].split('=');
        if (kv[1] !== undefined) {
          var v = parseFloat(decodeURIComponent(kv[1]));
          if (!isNaN(v) && v >= 0 && v <= 1) {
            if (kv[0] === 'sx') { sx = clamp(v, 0.05, 0.95); }
            if (kv[0] === 'sy') { sy = clamp(v, 0.05, 0.95); }
          }
        }
      }
    }
  } catch (e) {}

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      // Field-like composition: square on desktop, full-bleed on phones.
      stageH = Math.min(vh * 0.94, vw * 0.86);
      stageW = stageH;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The generative vocal phrase. An 8 second phrase loops with a contour
  // variation per phrase index; energy is the phrase's amplitude envelope.
  // Frequencies stay near 0.5 to 2 Hz, well under the 14 Hz ceiling.
  function phrase(t) {
    var idx = Math.floor(t / 8) % 4;
    var ph = t - Math.floor(t / 8) * 8; // 0..8 within the phrase
    var shift = idx * 0.9;
    var env = 0.45 + 0.35 * Math.sin((Math.PI * 2 * ph) / 8 - 0.6 + shift)
                   + 0.20 * Math.sin((Math.PI * 4 * ph) / 8 + 1.3 - shift * 0.5);
    env = clamp(env, 0.08, 1);
    var contour = Math.sin((Math.PI * 2 * ph) / 8 + shift)
                + 0.5 * Math.sin((Math.PI * 4 * ph) / 8 - 0.8 + shift);
    return { energy: env, contour: contour, idx: idx };
  }

  // ---- the school: a boid model around the source point ----
  var fish = [];
  function initFish() {
    fish = [];
    var cx0 = sx * W, cy0 = sy * H;
    var sc = clamp(Math.min(W, H) / 520, 0.62, 1.35);
    for (var i = 0; i < NFISH; i++) {
      var a = hash(i * 3 + 1) * Math.PI * 2;
      var r = (0.25 + hash(i * 5 + 2) * 0.75) * 90 * sc;
      var fx = cx0 + Math.cos(a) * r;
      var fy = cy0 + Math.sin(a) * r * 0.7;
      // Heading starts pointed at the source, so frame one already
      // shows the school oriented on the voice.
      var hd = Math.atan2(cy0 - fy, cx0 - fx) + (hash(i * 7 + 3) - 0.5) * 0.5;
      fish.push({
        x: fx, y: fy,
        vx: Math.cos(hd) * 20, vy: Math.sin(hd) * 20,
        len: (15 + hash(i * 11 + 4) * 9) * sc,
        phase: hash(i * 13 + 5) * Math.PI * 2,
        bright: 0.65 + hash(i * 17 + 6) * 0.35
      });
    }
  }

  function stepFish(dt, t, energy) {
    var cx0 = sx * W, cy0 = sy * H;
    var sc = clamp(Math.min(W, H) / 520, 0.62, 1.35);
    // School density follows the voice's energy: high energy gathers
    // the school tight and quick, low energy lets it spread and drift.
    var spread = lerp(150, 68, energy) * sc;
    var speed = (24 + energy * 46) * sc;
    var centX = 0, centY = 0;
    for (var i = 0; i < NFISH; i++) { centX += fish[i].x; centY += fish[i].y; }
    centX /= NFISH; centY /= NFISH;
    for (var k = 0; k < NFISH; k++) {
      var f = fish[k];
      var ax = 0, ay = 0;
      // Attraction to the source point, the steering vector.
      var dx = cx0 - f.x, dy = cy0 - f.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var pull = clamp(d / spread, 0.25, 1.6);
      ax += (dx / d) * pull * 1.5;
      ay += (dy / d) * pull * 1.5;
      // Cohesion toward the school centroid.
      var gx = centX - f.x, gy = centY - f.y;
      var gd = Math.sqrt(gx * gx + gy * gy) || 1;
      ax += (gx / gd) * 0.55;
      ay += (gy / gd) * 0.55;
      // Separation from near neighbours.
      for (var j = 0; j < NFISH; j++) {
        if (j === k) { continue; }
        var ox = f.x - fish[j].x, oy = f.y - fish[j].y;
        var od = Math.sqrt(ox * ox + oy * oy);
        if (od > 0.01 && od < 34 * sc) {
          var wgt = (1 - od / (34 * sc)) * 1.8;
          ax += (ox / od) * wgt;
          ay += (oy / od) * wgt;
        }
      }
      // Alignment with neighbours' headings.
      var avx = 0, avy = 0;
      for (var m = 0; m < NFISH; m++) {
        if (m === k) { continue; }
        var mx = fish[m].x - f.x, my = fish[m].y - f.y;
        if (Math.sqrt(mx * mx + my * my) < 90 * sc) { avx += fish[m].vx; avy += fish[m].vy; }
      }
      var ad = Math.sqrt(avx * avx + avy * avy);
      if (ad > 0.01) { ax += (avx / ad) * 0.5; ay += (avy / ad) * 0.5; }
      // Slow wander, the water's own drift.
      ax += Math.cos(t * 0.7 + f.phase) * 0.35;
      ay += Math.sin(t * 0.55 + f.phase * 1.3) * 0.35;
      // Steer velocity toward the desired direction at the phrase speed.
      var am = Math.sqrt(ax * ax + ay * ay) || 1;
      var tx = (ax / am) * speed, ty = (ay / am) * speed;
      f.vx += (tx - f.vx) * Math.min(1, dt * 3.2);
      f.vy += (ty - f.vy) * Math.min(1, dt * 3.2);
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      // Soft walls: stay inside the water.
      var mg = 14;
      if (f.x < mg) { f.x = mg; f.vx = Math.abs(f.vx); }
      if (f.x > W - mg) { f.x = W - mg; f.vx = -Math.abs(f.vx); }
      if (f.y < mg) { f.y = mg; f.vy = Math.abs(f.vy); }
      if (f.y > H - mg) { f.y = H - mg; f.vy = -Math.abs(f.vy); }
    }
  }

  function nearestFish(cx0, cy0) {
    var best = null, bestD = 1e9;
    for (var i = 0; i < NFISH; i++) {
      var dx = fish[i].x - cx0, dy = fish[i].y - cy0;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = fish[i]; }
    }
    return best;
  }

  function drawFish(f, t, energy) {
    var hd = Math.atan2(f.vy, f.vx);
    var tail = Math.sin(t * (2.2 + energy * 3.2) + f.phase) * 0.45;
    var L = f.len, wdt = L * 0.30;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(hd);
    // Tail, wagging with the phrase rhythm.
    ctx.fillStyle = hexA(FISH_DIM, a4(0.75 * f.bright));
    ctx.beginPath();
    ctx.moveTo(-L * 0.42, 0);
    ctx.lineTo(-L * 0.95, -wdt * 0.9 + tail * L * 0.28);
    ctx.lineTo(-L * 0.95, wdt * 0.9 + tail * L * 0.28);
    ctx.closePath();
    ctx.fill();
    // Body: a luminous lens, brighter at the head.
    var bg = ctx.createLinearGradient(-L * 0.5, 0, L * 0.55, 0);
    bg.addColorStop(0, hexA(FISH_DEEP, a4(0.85 * f.bright)));
    bg.addColorStop(0.55, hexA(FISH, a4(0.95 * f.bright)));
    bg.addColorStop(1, hexA(FISH, a4(0.9 * f.bright)));
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-L * 0.5, 0);
    ctx.bezierCurveTo(-L * 0.25, -wdt, L * 0.2, -wdt * 0.9, L * 0.55, 0);
    ctx.bezierCurveTo(L * 0.2, wdt * 0.9, -L * 0.25, wdt, -L * 0.5, 0);
    ctx.closePath();
    ctx.fill();
    // Eye, a single dark dot with a phosphor rim.
    ctx.fillStyle = hexA(FISH, 0.9);
    ctx.beginPath(); ctx.moveTo(L * 0.34, -wdt * 0.28); ctx.arc(L * 0.34, -wdt * 0.28, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#04101f';
    ctx.beginPath(); ctx.moveTo(L * 0.34, -wdt * 0.28); ctx.arc(L * 0.34, -wdt * 0.28, 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var p = phrase(t);
    var energy = p.energy;
    var sc = clamp(Math.min(W, H) / 520, 0.62, 1.35);

    // Deep water, darker at the edges, a faint glow where the voice sits.
    var bg = ctx.createRadialGradient(W * 0.5, H * 0.5, 10, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
    bg.addColorStop(0, WATER_GLOW);
    bg.addColorStop(0.55, WATER);
    bg.addColorStop(1, WATER_DEEP);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Sparse faint motes, drifting slowly, so the water is not flat.
    for (var s = 0; s < 22; s++) {
      var hx = hash(s * 3 + 1), hy = hash(s * 7 + 2), hp = hash(s * 11 + 3);
      var mx = hx * W + Math.sin(t * 0.12 + hp * 6) * 8;
      var my = hy * H + Math.cos(t * 0.09 + hp * 5) * 6;
      var ma = a4(0.03 + 0.07 * (0.5 + 0.5 * Math.sin(t * 0.6 + s * 1.7)));
      ctx.fillStyle = hexA(PLATE, ma);
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.arc(mx, my, (0.7 + hp * 1.1), 0, Math.PI * 2); ctx.fill();
    }

    var cx0 = sx * W, cy0 = sy * H;

    // The mapping line: from the drag point to the nearest fish,
    // the steering vector made visible. Fainter threads reach the
    // next two nearest fish.
    var near = nearestFish(cx0, cy0);
    if (near) {
      ctx.strokeStyle = hexA(LINE, 0.38);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx0, cy0);
      ctx.lineTo(near.x, near.y);
      ctx.stroke();
      var sorted = fish.slice().sort(function (a, b) {
        var da = (a.x - cx0) * (a.x - cx0) + (a.y - cy0) * (a.y - cy0);
        var db = (b.x - cx0) * (b.x - cx0) + (b.y - cy0) * (b.y - cy0);
        return da - db;
      });
      ctx.strokeStyle = hexA(LINE, 0.14);
      for (var li = 1; li < 3 && li < sorted.length; li++) {
        ctx.beginPath();
        ctx.moveTo(cx0, cy0);
        ctx.lineTo(sorted[li].x, sorted[li].y);
        ctx.stroke();
      }
    }

    // The school.
    for (var i = 0; i < NFISH; i++) { drawFish(fish[i], t, energy); }

    // The source point: a warm dot with a soft glow ring that breathes
    // with the phrase energy.
    var glowR = (26 + energy * 22) * sc;
    var gl = ctx.createRadialGradient(cx0, cy0, 1, cx0, cy0, glowR);
    gl.addColorStop(0, hexA(SOURCE, a4(0.5 + energy * 0.25)));
    gl.addColorStop(0.5, hexA(SOURCE, 0.12));
    gl.addColorStop(1, hexA(SOURCE, 0));
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.moveTo(cx0 + glowR, cy0); ctx.arc(cx0, cy0, glowR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = SOURCE;
    ctx.beginPath(); ctx.moveTo(cx0 + 6 * sc, cy0); ctx.arc(cx0, cy0, 6 * sc, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = SOURCE_DEEP;
    ctx.beginPath(); ctx.moveTo(cx0 + 2.6 * sc, cy0); ctx.arc(cx0, cy0, 2.6 * sc, 0, Math.PI * 2); ctx.fill();
    // Faint ring marking the source's reach.
    ctx.strokeStyle = hexA(LINE, 0.22);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx0 + glowR, cy0); ctx.arc(cx0, cy0, glowR, 0, Math.PI * 2); ctx.stroke();

    // Title plate, drawn on the canvas, top-left. The title is long,
    // so it runs on two lines on narrow frames.
    ctx.textBaseline = 'alphabetic';
    var fs1 = Math.round(20 * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.fillStyle = PLATE;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    if (W < 520) {
      ctx.fillText('Fish Dance When They', 18, 32);
      ctx.fillText('Are Not Sleeping', 18, 32 + fs1 + 4);
      ctx.fillStyle = PLATE_DIM;
      ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
      ctx.fillText('№1902 · 2007 · 03 · 28', 18, 32 + fs1 + 4 + fs2 + 10);
    } else {
      ctx.fillText('Fish Dance When They Are Not Sleeping', 18, 34);
      ctx.fillStyle = PLATE_DIM;
      ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
      ctx.fillText('№1902 · 2007 · 03 · 28', 18, 34 + fs2 + 8);
    }
    ctx.fillStyle = hexA(HINT, 0.9);
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag the voice through the water.', 18, H - 20);
  }

  // ---- audio: lazy, inside the first drag gesture only, never autoplay ----
  var audio = null;
  function ensureAudio() {
    if (audio) { return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { return; }
      var ac = new AC();
      var osc = ac.createOscillator();
      osc.type = 'sine';
      var oct = ac.createOscillator();
      oct.type = 'triangle';
      var vib = ac.createOscillator();
      vib.frequency.value = 5;
      var vibGain = ac.createGain();
      vibGain.gain.value = 7;
      vib.connect(vibGain);
      vibGain.connect(osc.frequency);
      vibGain.connect(oct.frequency);
      var gain = ac.createGain();
      gain.gain.value = 0.0;
      var lp = ac.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2400;
      osc.connect(lp);
      oct.connect(lp);
      lp.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      oct.start();
      vib.start();
      audio = { ac: ac, osc: osc, oct: oct, gain: gain };
    } catch (e) { audio = null; }
  }
  function audioUpdate(t) {
    if (!audio) { return; }
    try {
      var p = phrase(t);
      // The vocal line wanders a fifth around 330 Hz with the phrase contour.
      var f = 330 * Math.pow(2, p.contour * 0.28);
      var t0 = audio.ac.currentTime;
      audio.osc.frequency.setTargetAtTime(f, t0, 0.09);
      audio.oct.frequency.setTargetAtTime(f * 2, t0, 0.09);
      var level = dragging ? 0.05 : 0.03;
      audio.gain.gain.setTargetAtTime(level * (0.35 + 0.65 * p.energy), t0, 0.15);
    } catch (e) {}
  }

  // ---- interaction: drag steers the voice through the water ----
  function canvasPos(ev) {
    var rect = { left: stageX, top: stageY, width: stageW, height: stageH };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    var cx = ev.clientX, cy = ev.clientY;
    if (typeof ev.touches !== 'undefined' && ev.touches && ev.touches.length) {
      cx = ev.touches[0].clientX; cy = ev.touches[0].clientY;
    }
    return { x: cx - rect.left, y: cy - rect.top };
  }
  function setSource(p) {
    // Drag travel clamped so the source point stays inside the frame.
    sx = clamp(p.x / W, 0.05, 0.95);
    sy = clamp(p.y / H, 0.05, 0.95);
  }
  function onDown(ev) {
    ensureAudio();
    dragging = true;
    canvas.classList.add('dragging');
    setSource(canvasPos(ev));
    audioUpdate(FIRST_T);
    if (ev.preventDefault) { ev.preventDefault(); }
  }
  function onMove(ev) {
    if (!dragging) { return; }
    setSource(canvasPos(ev));
    if (ev.preventDefault) { ev.preventDefault(); }
  }
  function onUp() {
    dragging = false;
    canvas.classList.remove('dragging');
    // Release keeps the last formation: the source stays where it was
    // left and the school keeps drifting around it.
  }

  try {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); initFish(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); initFish(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  initFish();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var lastT = start;
    var lastNow = start;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      var dt = Math.min(0.05, Math.max(0.001, (now - lastT) / 1000));
      lastT = now;
      lastNow = now;
      stepFish(dt, t, phrase(t).energy);
      draw(t);
      audioUpdate(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
