<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata of Noise</title>
<style>
html, body { margin: 0; padding: 0; background: #22101B; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#22101B';
var PLATE = '#2E1622';
var PLATE_LINE = 'rgba(242,232,213,0.45)';
var TITLE_INK = '#F2E8D5';
var HINT_INK = '#B9C4A8';
var CYCLE = 32;
var T0 = 6.0;
var BANDS = 44;
var PTS = 140;
var PALETTE = ['#8E2A4E', '#5E2B4A', '#B07D8F', '#8A9B7E', '#F2E8D5', '#A63A5B', '#6E3A5C', '#C49AA8', '#A8B89A', '#EFE3C8'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function lerp(a, b, t) { return a + (b - a) * t; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function darken(h, f) {
  var c = hexRgb(h);
  return 'rgb(' + Math.round(c[0] * f) + ',' + Math.round(c[1] * f) + ',' + Math.round(c[2] * f) + ')';
}
/* ---- seeded value noise, 2D, with fbm ---- */
function hash2(ix, iy) {
  var h = (ix * 374761393 + iy * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = (h ^ (h >>> 16)) >>> 0;
  return h / 4294967296;
}
function vnoise(x, y) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  var ux = smooth(fx), uy = smooth(fy);
  var a = hash2(ix, iy), b = hash2(ix + 1, iy);
  var c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}
function fbm(x, y) {
  var v = 0, amp = 0.5, f = 1, o;
  for (o = 0; o < 3; o++) {
    v += amp * vnoise(x * f, y * f);
    amp *= 0.5; f *= 2.03;
  }
  return v;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* seeded band colors: walk the palette so neighbours never repeat */
var rng = mulberry32(1704);
var bandCol = [];
var bi, prev = -1, pick;
for (bi = 0; bi < BANDS; bi++) {
  pick = Math.floor(rng() * PALETTE.length);
  if (pick === prev) pick = (pick + 1 + Math.floor(rng() * 3)) % PALETTE.length;
  bandCol.push(PALETTE[pick]);
  prev = pick;
}
/* per-band phase seeds, fixed */
var bandSeed = [];
for (bi = 0; bi < BANDS; bi++) bandSeed.push(rng() * 100);
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- band base y: denser toward the bottom, airy at the top ---- */
function bandY(i, st) {
  var f = i / BANDS;
  return st.y + st.h * (1 - Math.pow(1 - f, 1.5));
}
/* ---- black-and-white snap mix for a given time: 0 in color, 1 at the snap ---- */
function bwMixAt(t) {
  var p = ((t / CYCLE) % 1 + 1) % 1;
  var m = smooth(clamp((p - 0.70) / 0.06, 0, 1));
  m *= 1 - smooth(clamp((p - 0.84) / 0.06, 0, 1));
  return m;
}
function bandColor(i, m) {
  if (m <= 0) return bandCol[i];
  var c = hexRgb(bandCol[i]);
  var lum = (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
  var edge = smooth(clamp((lum - 0.42) / 0.16, 0, 1));
  var bw = [lerp(20, 245, edge), lerp(16, 240, edge), lerp(15, 230, edge)];
  return 'rgb(' + Math.round(lerp(c[0], bw[0], m)) + ',' + Math.round(lerp(c[1], bw[1], m)) + ',' + Math.round(lerp(c[2], bw[2], m)) + ')';
}
var clockT = T0;
var gusts = [];
var dragging = false;
var lastX = 0, lastY = 0;
function gustAt(x, y, t, s) {
  var g, age, dx, dy, d2, sig = 150;
  var total = 0;
  for (g = 0; g < gusts.length; g++) {
    age = t - gusts[g].t0;
    if (age < 0 || age > 3) continue;
    dx = x - gusts[g].x; dy = y - gusts[g].y;
    d2 = dx * dx + dy * dy;
    total += gusts[g].s * Math.exp(-age / 1.2) * Math.exp(-d2 / (2 * sig * sig)) * Math.sin(Math.sqrt(d2) / sig * 5 - age * 9);
  }
  return total;
}
function lineY(i, x, st, t) {
  var f = i / BANDS;
  var amp = (6 + 20 * Math.sin(Math.PI * clamp(f, 0, 1))) * (st.h / 900);
  var n = fbm(x * 0.0035 + bandSeed[i], bandSeed[i] * 0.7 + t * 0.045) - 0.5;
  var n2 = fbm(x * 0.011 + bandSeed[i] * 1.3, bandSeed[i] - t * 0.03) - 0.5;
  var drift = (fbm(t * 0.02, bandSeed[i] * 0.5) - 0.5) * 12 * (st.h / 900);
  var y = bandY(i, st) + (n * 1.3 + n2 * 0.7) * amp + drift;
  y += gustAt(x, y, t, 1) * 14 * (st.h / 900);
  return y;
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var t = clockT;
  var m = bwMixAt(t);
  var i, p, x, y;
  var top = [], bot = [];
  /* build the two edge polylines of each strip, then fill the strip solid */
  for (i = 0; i < BANDS; i++) {
    for (p = 0; p <= PTS; p++) {
      x = st.x + st.w * p / PTS;
      top[p] = lineY(i, x, st, t);
      bot[p] = lineY(i + 1, x, st, t);
    }
    ctx.beginPath();
    ctx.moveTo(st.x, top[0]);
    for (p = 1; p <= PTS; p++) ctx.lineTo(st.x + st.w * p / PTS, top[p]);
    for (p = PTS; p >= 0; p--) ctx.lineTo(st.x + st.w * p / PTS, bot[p]);
    ctx.closePath();
    ctx.fillStyle = bandColor(i, m);
    ctx.fill();
    /* hairline along the lower edge so strata stay readable, never blended */
    ctx.beginPath();
    ctx.moveTo(st.x, bot[0]);
    for (p = 1; p <= PTS; p++) ctx.lineTo(st.x + st.w * p / PTS, bot[p]);
    ctx.lineWidth = Math.max(1, st.h * 0.0012);
    ctx.strokeStyle = m > 0.5 ? 'rgba(20,16,15,0.55)' : darken(bandCol[i], 0.45);
    ctx.globalAlpha = m > 0.5 ? 1 : 0.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Strata of Noise').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Strata of Noise').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 11').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Strata of Noise', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 11', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to stir the field.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function onPointer(x, y, down) {
  if (down) {
    dragging = true;
    lastX = x; lastY = y;
    gusts.push({ x: x, y: y, t0: clockT, s: 1.0 });
  } else if (dragging) {
    var dx = x - lastX, dy = y - lastY;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > 4) {
      gusts.push({ x: x, y: y, t0: clockT, s: clamp(d / 24, 0.4, 2.2) });
      lastX = x; lastY = y;
    }
  }
  if (gusts.length > 24) gusts.splice(0, gusts.length - 24);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (tt, gx, gy) {
      clockT = tt;
      gusts = [];
      if (typeof gx === 'number') gusts.push({ x: gx, y: gy || 0, t0: tt, s: 1.5 });
      draw();
    },
    bandCount: function () { return BANDS; },
    bwMixAt: function (tt) { return bwMixAt(tt); },
    gustCount: function () { return gusts.length; },
    clockT: function () { return clockT; }
  };
}
/* ---- frame one: fixed pre-roll t = 6s, color phase, no pointer input ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) { onPointer(e.clientX, e.clientY, true); });
  canvas.addEventListener('pointermove', function (e) { if (dragging) onPointer(e.clientX, e.clientY, false); });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    var prevTs = null, t0 = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })(0);
}
</script>
</body>
</html>
