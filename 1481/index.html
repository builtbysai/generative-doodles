<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reorder, and the Meaning Reverses</title>
<style>
  html, body { margin: 0; padding: 0; background: #8a6a48; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (exactly the prompt's colors, no others).
  var CHARCOAL = '#2a2a30';
  var CREAM = '#e8e0d0';
  var TEAL = '#2e6f6a';
  var BRICK = '#a8674a';
  var GREY = '#b8bcc0';
  var SCARLET = '#c1272d';
  var WOOD = '#8a6a48';

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1481000);

  // Scene ids: 0 = room of seated figures, 1 = broadcast screen, 2 = monitor wall.
  // Starting order [0,1,2] yields the calm grey disc; exactly [1,0,2] yields scarlet.
  var SCARLET_ORDER = [1, 0, 2];
  var order = [0, 1, 2];
  var morphStart = -1e9; // time of the last order change; -inf means settled grey.


  function discIsScarlet(ord) {
    return ord[0] === SCARLET_ORDER[0] && ord[1] === SCARLET_ORDER[1] && ord[2] === SCARLET_ORDER[2];
  }

  // Drag state (transient; order changes are recorded as swaps).
  var drag = null; // {scene, grabX, offsetX, startSlot}
  var swaps = []; // recorded {t, scene, dir} for closed-form order replay (probe use).
  var morphFromRGB = null; // displayed disc color captured at the last swap time.

  var W = 0, H = 0, isPhone = false;

  function sizeCanvas() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var minDim = 1e9;
    if (typeof window !== 'undefined' && window.screen) {
      minDim = Math.min(window.screen.width, window.screen.height);
    }
    isPhone = (minDim < 700) || (h > w * 1.15);
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }
  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function line(x1, y1, x2, y2, color, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  // Layout: three panels in a row across the upper two-thirds; final card centered below.
  function layout() {
    var pw = W * 0.28, ph = H * 0.54;
    var py = H * 0.08;
    var slots = [W * 0.04, W * 0.36, W * 0.68];
    var cardW = W * 0.28, cardH = H * 0.18;
    var card = { x: W * 0.36, y: H * 0.70, w: cardW, h: cardH };
    return { pw: pw, ph: ph, py: py, slots: slots, card: card };
  }

  function panelRectForSlot(lay, slot) {
    var x = lay.slots[slot];
    if (drag && drag.slot === slot) x += drag.offsetX;
    return { x: x, y: lay.py, w: lay.pw, h: lay.ph };
  }

  // --- Scene painters (each a closed-form function of t; periods divide 24 s) ---

  // Room of seated figures (cream interior). Speaker cycles every 4 s, 12 s loop.
  function drawRoom(x, y, w, h, t) {
    rect(x, y, w, h, CREAM);
    var n = 3;
    var floorY = y + h * 0.78;
    rect(x, floorY, w, h - (floorY - y), WOOD);
    var speaker = Math.floor(t / 4) % n;
    var local = t % 4;
    for (var i = 0; i < n; i++) {
      var fx = x + w * (0.22 + i * 0.28);
      var bodyW = w * 0.16, bodyH = h * 0.30;
      var bodyY = floorY - bodyH;
      var bodyColor = (i === 0) ? TEAL : (i === 1) ? BRICK : CHARCOAL;
      rect(fx - bodyW / 2, bodyY, bodyW, bodyH, bodyColor);
      var headR = w * 0.055;
      var headX = fx, headY = bodyY - headR * 1.1;
      var tilt = 0;
      if (i === speaker) {
        tilt = Math.sin(local * Math.PI * 2 / 4) * 0.12;
      } else {
        tilt = (i < speaker ? 0.06 : -0.06);
      }
      headX += tilt * headR * 2;
      dot(headX, headY, headR, GREY);
      dot(headX - headR * 0.3, headY - headR * 0.1, Math.max(1, headR * 0.12), CHARCOAL);
      var mouthY = headY + headR * 0.35;
      if (i === speaker) {
        var mw = headR * (0.5 + 0.3 * Math.sin(local * Math.PI * 2 / 2));
        line(headX - mw / 2, mouthY, headX + mw / 2, mouthY + Math.sin(local * Math.PI * 2 / 4) * headR * 0.15, CHARCOAL, Math.max(1, headR * 0.12));
      } else {
        line(headX - headR * 0.3, mouthY, headX + headR * 0.3, mouthY, CHARCOAL, Math.max(1, headR * 0.12));
      }
    }
  }

  // Broadcast screen of suited figures (teal interior). Mouths on 2 s beats, 4 s loop.
  function drawBroadcast(x, y, w, h, t) {
    rect(x, y, w, h, TEAL);
    var floorY = y + h * 0.80;
    rect(x, floorY, w, h - (floorY - y), GREY);
    var n = 4;
    var beat = Math.floor(t / 2) % 2; // 0 = mouths closed-ish, 1 = open
    for (var i = 0; i < n; i++) {
      var fx = x + w * (0.16 + i * 0.23);
      var bodyW = w * 0.14, bodyH = h * 0.42;
      var bodyY = floorY - bodyH;
      rect(fx - bodyW / 2, bodyY, bodyW, bodyH, CHARCOAL);
      var headR = w * 0.05;
      var headY = bodyY - headR * 1.1;
      dot(fx, headY, headR, CHARCOAL);
      var mh = beat === 1 ? headR * 0.45 : headR * 0.12;
      rect(fx - headR * 0.35, headY + headR * 0.25, headR * 0.7, Math.max(1, mh), GREY);
    }
  }

  // Monitor wall (brick interior). Three monitors; screens cycle cream/grey/teal, 6 s loop.
  function drawMonitors(x, y, w, h, t) {
    rect(x, y, w, h, BRICK);
    var screenColors = [CREAM, GREY, TEAL];
    var phase = Math.floor(t / 2) % 3;
    for (var i = 0; i < 3; i++) {
      var mw = w * 0.26, mh = h * 0.34;
      var mx = x + w * (0.06 + i * 0.32);
      var my = y + h * 0.18 + (i % 2) * h * 0.10;
      rect(mx, my, mw, mh, CHARCOAL);
      var inset = Math.max(2, w * 0.012);
      var sc = screenColors[(i + phase) % 3];
      rect(mx + inset, my + inset, mw - inset * 2, mh - inset * 2, sc);
      // Flickering abstract blocks on the screens (2 s flicker).
      var flick = Math.floor(t / 2) % 2 === 0;
      var bw = (mw - inset * 2) * 0.4, bh = (mh - inset * 2) * 0.22;
      rect(mx + inset + (mw - inset * 2) * 0.12, my + inset + (mh - inset * 2) * 0.18, bw, bh, flick ? CHARCOAL : TEAL);
      rect(mx + inset + (mw - inset * 2) * 0.55, my + inset + (mh - inset * 2) * 0.55, bw * 0.7, bh, flick ? TEAL : CHARCOAL);
    }
  }

  var painters = [drawRoom, drawBroadcast, drawMonitors];

  function hexToRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  var GREY_RGB = hexToRgb(GREY);
  var SCARLET_RGB = hexToRgb(SCARLET);
  function discRGBAt(t) {
    var target = discIsScarlet(order);
    var p = (t - morphStart) / 0.8;
    if (p >= 1) return target ? SCARLET_RGB : GREY_RGB;
    var from = morphFromRGB || GREY_RGB;
    if (p <= 0) return from;
    var to = target ? SCARLET_RGB : GREY_RGB;
    return [
      Math.round(from[0] + (to[0] - from[0]) * p),
      Math.round(from[1] + (to[1] - from[1]) * p),
      Math.round(from[2] + (to[2] - from[2]) * p)
    ];
  }
  function discColorAt(t) {
    var c = discRGBAt(t);
    return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
  }

  function draw(t) {
    sizeCanvas();
    var lay = layout();
    rect(0, 0, W, H, WOOD);
    var frame = Math.max(3, W * 0.006);
    for (var slot = 0; slot < 3; slot++) {
      var scene = order[slot];
      var pr = panelRectForSlot(lay, slot);
      rect(pr.x - frame, pr.y - frame, pr.w + frame * 2, pr.h + frame * 2, CHARCOAL);
      painters[scene](pr.x, pr.y, pr.w, pr.h, t);
    }
    // Final card panel, centered below.
    var c = lay.card;
    rect(c.x - frame, c.y - frame, c.w + frame * 2, c.h + frame * 2, CHARCOAL);
    rect(c.x, c.y, c.w, c.h, CREAM);
    var discR = Math.min(c.w, c.h) * 0.30;
    dot(c.x + c.w / 2, c.y + c.h / 2, discR, discColorAt(t));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function panelAt(px, py) {
    var lay = layout();
    for (var slot = 0; slot < 3; slot++) {
      var pr = panelRectForSlot(lay, slot);
      if (px >= pr.x && px <= pr.x + pr.w && py >= pr.y && py <= pr.y + pr.h) {
        return { slot: slot, scene: order[slot], rect: pr };
      }
    }
    return null;
  }

  function onDown(px, py, t) {
    var hit = panelAt(px, py);
    if (!hit) return;
    drag = { scene: hit.scene, slot: hit.slot, grabX: px, offsetX: 0 };
  }

  function onMove(px, py, t) {
    if (!drag) return;
    var lay = layout();
    drag.offsetX = px - drag.grabX;
    var slotW = lay.pw + W * 0.08; // slot pitch (panel width + gap)
    var center = lay.slots[drag.slot] + drag.offsetX + lay.pw / 2;
    // Live swap when the dragged center crosses a neighbor slot center.
    if (drag.slot < 2) {
      var rightCenter = lay.slots[drag.slot + 1] + lay.pw / 2;
      if (center >= rightCenter) {
        morphFromRGB = discRGBAt(t); // displayed color before the swap
        var s = drag.slot;
        var tmp = order[s]; order[s] = order[s + 1]; order[s + 1] = tmp;
        swaps.push({ t: t, scene: drag.scene, dir: 1 });
        morphStart = t;
        drag.slot = s + 1;
        drag.grabX += slotW;
        drag.offsetX = px - drag.grabX;
      }
    }
    if (drag.slot > 0) {
      var leftCenter = lay.slots[drag.slot - 1] + lay.pw / 2;
      if (center <= leftCenter) {
        morphFromRGB = discRGBAt(t); // displayed color before the swap
        var s2 = drag.slot;
        var tmp2 = order[s2]; order[s2] = order[s2 - 1]; order[s2 - 1] = tmp2;
        swaps.push({ t: t, scene: drag.scene, dir: -1 });
        morphStart = t;
        drag.slot = s2 - 1;
        drag.grabX -= slotW;
        drag.offsetX = px - drag.grabX;
      }
    }
  }

  function onUp(px, py, t) {
    drag = null;
  }

  function attach() {
    canvas.addEventListener('pointerdown', function (e) {
      onDown(e.clientX || 0, e.clientY || 0, currentTime());
    });
    canvas.addEventListener('pointermove', function (e) {
      onMove(e.clientX || 0, e.clientY || 0, currentTime());
    });
    canvas.addEventListener('pointerup', function (e) {
      onUp(e.clientX || 0, e.clientY || 0, currentTime());
    });
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('resize', function () { draw(currentTime()); });
      if (window.visualViewport && window.visualViewport.addEventListener) {
        window.visualViewport.addEventListener('resize', function () { draw(currentTime()); });
      }
    }
  }

  var bootDone = false;
  var startStamp = 0;
  function currentTime() {
    if (!bootDone) return 0;
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - startStamp) / 1000;
    }
    return 0;
  }

  // Probe interface (used by the QA harness; harmless in browsers).
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: function (t) { draw(t); },
      down: function (x, y, t) { onDown(x, y, t); },
      move: function (x, y, t) { onMove(x, y, t); },
      up: function (x, y, t) { onUp(x, y, t); },
      getOrder: function () { return order.slice(); },
      isScarlet: function () { return discIsScarlet(order); },
      getSwaps: function () { return swaps.slice(); }
    };
  }

  // Frame one at a constant phase; the clock starts only with the rAF loop.
  draw(0);
  bootDone = true;
  if (typeof performance !== 'undefined' && performance.now) {
    startStamp = performance.now();
  }
  attach();
  function loop(ts) {
    if (typeof performance !== 'undefined' && performance.now) {
      draw((ts - startStamp) / 1000);
    }
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
