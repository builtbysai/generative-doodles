<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Amanecida en Cerro Castillo</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #141B33; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var RIDGE = '#0C0F14';
  var INDIGO = '#141B33';
  var VIOLET = '#3A2E5C';
  var ROSE = '#E89B7D';
  var GOLD = '#E8B93B';
  var STAR = '#F2EDDA';
  var CONDOR = '#0A0C10';

  var LOOP = 90; // seconds per night to dawn to night cycle

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerpColor(c1, c2, t) {
    return 'rgb(' + Math.round(lerp(c1[0], c2[0], t)) + ',' + Math.round(lerp(c1[1], c2[1], t)) + ',' + Math.round(lerp(c1[2], c2[2], t)) + ')';
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function smooth(a, b, v) { var t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); }

  // Sky keyframes: [phase, [bandTop, bandUpper, bandLower, bandBottom]] as palette hexes.
  // Four stacked flat bands, hard edges, colors lerp between keyframes.
  var KEYS = [
    [0.00, [INDIGO, INDIGO, INDIGO, INDIGO]],
    [0.34, [INDIGO, INDIGO, INDIGO, INDIGO]],
    [0.45, [INDIGO, VIOLET, VIOLET, VIOLET]],
    [0.55, [VIOLET, VIOLET, ROSE, ROSE]],
    [0.62, [VIOLET, ROSE, ROSE, GOLD]],
    [0.69, [VIOLET, VIOLET, ROSE, ROSE]],
    [0.79, [INDIGO, VIOLET, VIOLET, VIOLET]],
    [0.89, [INDIGO, INDIGO, INDIGO, INDIGO]],
    [1.00, [INDIGO, INDIGO, INDIGO, INDIGO]]
  ];
  var KEYS_RGB = KEYS.map(function (k) { return [k[0], k[1].map(hexRgb)]; });

  function skyColors(phase) {
    for (var i = 0; i < KEYS_RGB.length - 1; i++) {
      var a = KEYS_RGB[i], b = KEYS_RGB[i + 1];
      if (phase >= a[0] && phase <= b[0]) {
        var t = (b[0] - a[0]) > 0 ? (phase - a[0]) / (b[0] - a[0]) : 0;
        var out = [];
        for (var j = 0; j < 4; j++) out.push(lerpColor(a[1][j], b[1][j], t));
        return out;
      }
    }
    return KEYS_RGB[0][1].map(function (c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; });
  }

  // Daylight factor for star fade: 0 at night, 1 at peak gold (phase 0.62).
  function daylight(phase) {
    if (phase < 0.34) return 0;
    if (phase < 0.62) return smooth(0.34, 0.62, phase);
    if (phase < 0.89) return 1 - smooth(0.62, 0.89, phase);
    return 0;
  }

  // Condor window: crosses once per loop while the low band is gold.
  var CONDOR_A = 0.545, CONDOR_B = 0.695;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, isPhone = false;
  var ridgePts = []; // normalized [x 0..1, topY 0..1] samples
  var stars = [];    // normalized {x, y, r, tw}

  function buildScene() {
    // Ridgeline: one seed-fixed function. Base swell from value noise plus a
    // cluster of steep narrow spires mid-ridge (the Cerro Castillo towers).
    var rng = mulberry32(0xCE570);
    var knots = [];
    var nK = 26;
    for (var i = 0; i <= nK; i++) knots.push(0.08 + rng() * 0.22); // base height fraction of ridge band
    var knots2 = [];
    var nK2 = 110;
    for (var i2 = 0; i2 <= nK2; i2++) knots2.push(rng() * 0.055); // jagged second octave
    var spires = [];
    var nS = 7;
    for (var s = 0; s < nS; s++) {
      spires.push({
        x: 0.40 + s * 0.035 + rng() * 0.015,
        h: 0.50 + rng() * 0.45,       // tall: rises well above base swell
        wdt: 0.005 + rng() * 0.006,   // steep and narrow
        lean: (rng() - 0.5) * 0.006
      });
    }
    // A couple of outlying crags so the towers read as a cluster, not a wall.
    spires.push({ x: 0.30 + rng() * 0.02, h: 0.26 + rng() * 0.14, wdt: 0.009, lean: 0 });
    spires.push({ x: 0.68 + rng() * 0.02, h: 0.24 + rng() * 0.13, wdt: 0.010, lean: 0 });

    ridgePts = [];
    var N = 360;
    for (var k = 0; k <= N; k++) {
      var x = k / N;
      // cosine-interpolated value noise over the knots, two octaves
      var fk = x * nK, i0 = Math.floor(fk), fr = fk - i0;
      var tt = (1 - Math.cos(fr * Math.PI)) / 2;
      var base = lerp(knots[i0], knots[Math.min(i0 + 1, nK)], tt);
      var fk2 = x * nK2, j0 = Math.floor(fk2), fr2 = fk2 - j0;
      var tt2 = (1 - Math.cos(fr2 * Math.PI)) / 2;
      base += lerp(knots2[j0], knots2[Math.min(j0 + 1, nK2)], tt2);
      var hh = base;
      for (var q = 0; q < spires.length; q++) {
        var sp = spires[q];
        var d = (x - sp.x) / sp.wdt;
        var g = Math.exp(-d * d);
        // sharpen the spire into a tower: power curve keeps a pointy crest
        var v = sp.h * Math.pow(g, 0.55);
        if (v > hh) hh = v;
      }
      ridgePts.push([x, hh]);
    }

    // Stars: fixed seeded field in the upper sky.
    var srng = mulberry32(0x57A25);
    stars = [];
    for (var m = 0; m < 170; m++) {
      stars.push({ x: srng(), y: Math.pow(srng(), 1.25) * 0.58, r: 0.6 + srng() * 1.5, tw: srng() * Math.PI * 2 });
    }
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || H > W * 1.15;
  }

  function drawCondor(cx, cy, s) {
    // Soaring condor: one fixed pose. Broad flat wings in a shallow V,
    // body ellipse, small head, fanned tail. Wings never move.
    ctx.fillStyle = CONDOR;
    ctx.beginPath();
    // left wing: from body out to tip, slight dihedral rise
    ctx.moveTo(cx - 0.10 * s, cy + 0.02 * s);
    ctx.lineTo(cx - 1.00 * s, cy - 0.16 * s);
    ctx.lineTo(cx - 1.04 * s, cy - 0.10 * s);
    ctx.lineTo(cx - 0.62 * s, cy + 0.045 * s);
    ctx.lineTo(cx - 0.30 * s, cy + 0.075 * s);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    // right wing (mirror)
    ctx.moveTo(cx + 0.10 * s, cy + 0.02 * s);
    ctx.lineTo(cx + 1.00 * s, cy - 0.16 * s);
    ctx.lineTo(cx + 1.04 * s, cy - 0.10 * s);
    ctx.lineTo(cx + 0.62 * s, cy + 0.045 * s);
    ctx.lineTo(cx + 0.30 * s, cy + 0.075 * s);
    ctx.closePath();
    ctx.fill();
    // tail fan
    ctx.beginPath();
    ctx.moveTo(cx - 0.05 * s, cy + 0.10 * s);
    ctx.lineTo(cx + 0.05 * s, cy + 0.10 * s);
    ctx.lineTo(cx + 0.11 * s, cy + 0.24 * s);
    ctx.lineTo(cx - 0.11 * s, cy + 0.24 * s);
    ctx.closePath();
    ctx.fill();
    // body
    ctx.beginPath();
    ctx.ellipse(cx, cy + 0.04 * s, 0.11 * s, 0.20 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // head
    ctx.beginPath();
    ctx.ellipse(cx, cy - 0.17 * s, 0.055 * s, 0.075 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw(phase) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var horizon = H * 0.72;      // ridge baseline: massif sits in the lower third
    var ridgeH = H * 0.44;

    // Sky: four stacked flat bands with hard edges, meeting at the horizon.
    var cols = skyColors(phase);
    var edges = [0, 0.28, 0.52, 0.76, 1.0];
    for (var b = 0; b < 4; b++) {
      ctx.fillStyle = cols[b];
      var y0 = edges[b] * horizon, y1 = edges[b + 1] * horizon;
      ctx.fillRect(0, Math.floor(y0), W, Math.ceil(y1 - y0) + 1);
    }

    // Stars, opacity tied to phase.
    var d = daylight(phase);
    var sa = 1 - smooth(0.10, 0.55, d);
    if (sa > 0.01) {
      ctx.fillStyle = STAR;
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i];
        // a whisper of twinkle from the anchored clock phase only
        var tw = 0.82 + 0.18 * Math.sin(phase * Math.PI * 2 * 3 + st.tw);
        ctx.globalAlpha = sa * tw;
        ctx.beginPath();
        ctx.arc(st.x * W, st.y * H, st.r * (isPhone ? 0.85 : 1), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Condor: once per loop, inside the gold window only.
    if (phase >= CONDOR_A && phase <= CONDOR_B) {
      var q = (phase - CONDOR_A) / (CONDOR_B - CONDOR_A);
      var cx = (-0.10 + q * 1.20) * W;
      var cy = H * (0.215 - 0.045 * Math.sin(q * Math.PI));
      var s = Math.min(W, H) * (isPhone ? 0.085 : 0.105);
      drawCondor(cx, cy, s);
    }

    // Ridgeline: redrawn from the same seed-fixed samples every frame,
    // so the silhouette is byte-identical across frames and loops.
    ctx.fillStyle = RIDGE;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (var k = 0; k < ridgePts.length; k++) {
      var px = ridgePts[k][0] * W;
      var py = horizon - ridgePts[k][1] * ridgeH;
      ctx.lineTo(px, py);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  // Phase plumbing: anchored elapsed clock from rAF timestamps.
  // Frame one is drawn synchronously at phase 0.
  var phaseOffset = 0;
  var t0 = null;

  function phaseAt(tsMs) {
    var el = (tsMs - t0) / 1000;
    return (((el / LOOP) + phaseOffset) % 1 + 1) % 1;
  }

  // QA hook: ?t=<seconds> freezes the synchronous frame at that loop time.
  var qaT = null;
  if (typeof location !== 'undefined' && location.search) {
    var mm = /t=([0-9.]+)/.exec(location.search);
    if (mm) qaT = parseFloat(mm[1]);
  }

  function frame(ts) {
    if (t0 === null) t0 = ts;
    lastTs = ts;
    draw(phaseAt(ts));
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  // Tap: force one immediate dawn. Jump phase to the start of the gold
  // window; the loop then continues through dusk back to night.
  var lastTs = null;
  function onTap() {
    if (lastTs === null) return;
    var cur = phaseAt(lastTs);
    phaseOffset = (((phaseOffset + (CONDOR_A - cur)) % 1) + 1) % 1;
  }
  canvas.addEventListener('pointerdown', onTap);
  canvas.addEventListener('click', onTap);

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); if (qaT !== null) draw((qaT / LOOP) % 1); else if (lastTs !== null) draw(phaseAt(lastTs)); });
  }
  window.addEventListener('resize', function () { resize(); if (qaT !== null) draw((qaT / LOOP) % 1); else if (lastTs !== null) draw(phaseAt(lastTs)); });

  buildScene();
  resize();

  if (qaT !== null) {
    draw((qaT / LOOP) % 1);
  } else {
    draw(0); // frame one: full night, synchronous
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
