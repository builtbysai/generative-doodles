<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№643 As the Element</title>
<style>
  html, body { margin: 0; padding: 0; background: #050506; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1984 As the Element, MC1 / PP1231, study #259 mateo-villanueva-brandt.
  // A black reclined figure against dark rock, one continuous
  // mass. The body is coated in the element: wet sheen is the
  // only anatomy, specular highlights draw shoulders, ribs,
  // thighs out of the darkness. Palette: near-black, wet
  // graphite, one cold silver highlight band. The figure runs
  // diagonal across the lower third, dark mass filling
  // two-thirds, spray particles at the top edge. The sheen
  // slowly crawls as if water moves across skin. DRAG moves
  // the hard light source; the specular highlights slide
  // across the body accordingly, anatomy appearing and
  // dissolving with the light. No face, no landscape detail,
  // no colour, never a still flat image.
  var GROUND = '#050506'; // page ground, near-black

  // Fixed-phase first frame: FIRST_T = 14 s. The light cycle
  // is 96 s: the hard light drifts slowly across the stage on
  // a smooth orbit, so the sheen crawls and the anatomy
  // breathes in and out without a cut. At t = 14 the light
  // sits near the middle of the stage, over the ribs, so the
  // first frame shows the shoulder and rib highlights
  // readable while the hips stay half dissolved.
  var FIRST_T = 14;
  var CYCLE = 96;
  var SEED = 1984;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x. The
  // figure and the rock share this one field, so they read
  // as a single mass: the rock edge, the rock mottling, the
  // body mottling and the wet streak drift all sample it.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x) {
    var i = Math.floor(x), f = x - i;
    var u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }
  function fbm(x) {
    return vnoise(x) * 0.55 + vnoise(x * 2.13 + 7.7) * 0.30 + vnoise(x * 4.31 + 3.1) * 0.15;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function gauss(x, c, w) { var d = (x - c) / w; return Math.exp(-d * d); }
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: grayscale only. Near-black ground, wet graphite
  // body and rock, one cold silver highlight band.
  var ROCK_TOP = [15, 15, 18];
  var ROCK_BOT = [8, 8, 10];
  var ROCK_BAND = [24, 25, 29];
  var BODY_TOP = [20, 21, 26];
  var BODY_BOT = [8, 8, 10];
  var GRAPHITE = [38, 40, 46];
  var SILVER = [205, 209, 214];
  var SILVER_BRIGHT = [232, 235, 238];
  var CAPTION = [201, 204, 210];

  // ---- Light -----------------------------------------------------
  // One light vector drives every specular effect: the sheen
  // band, the anatomy glints, the rim light and the rock
  // sheen. Automatic crawl: a slow orbit across the stage.
  // Drag overrides the target; release eases back to the orbit.
  var lightCur = { x: 0.5, y: 0.35 };
  var dragTarget = null;
  var dragging = false;

  function lightAuto(t) {
    var lx = 0.5 + 0.34 * Math.sin(2 * Math.PI * t / CYCLE - 0.9);
    var ly = 0.30 + 0.10 * Math.sin(2 * Math.PI * t / (CYCLE * 0.63) + 0.7);
    return { x: lx, y: ly };
  }
  function setLight(nx, ny) {
    dragTarget = { x: clamp(nx, 0, 1), y: clamp(ny, 0, 1) };
  }
  function releaseLight() { dragTarget = null; }

  // ---- Layout ----------------------------------------------------
  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    // Rock lower edge, noisy, around 0.60 of the height.
    L.rockEdge = function (x) {
      return H * (0.60 + 0.035 * (fbm(x * 0.008 + 3.7) - 0.5) * 2 + 0.012 * Math.sin(x * 0.02 + 1.1));
    };
    // Body span and thickness: wider and thicker on phones,
    // where the tall full-bleed stage would shrink it.
    L.bodyX0 = isPhone ? 0.10 : 0.07;
    L.bodyX1 = isPhone ? 0.92 : 0.83;
    L.bodyR = H * (isPhone ? 0.085 : 0.075);
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Body geometry ---------------------------------------------
  // Reclined figure, head low at the left, feet rising to the
  // right, diagonal across the lower third. Centreline plus a
  // radius profile sampled at control points: head, neck,
  // shoulder, chest, waist, hip, thigh, calf, ankle, foot.
  var PROFILE = [
    [-0.04, 0.44], [0.00, 0.44], [0.08, 0.30], [0.18, 0.95],
    [0.30, 0.80], [0.45, 0.62], [0.60, 1.00], [0.72, 0.82],
    [0.85, 0.60], [0.94, 0.42], [1.00, 0.30]
  ];
  function bodyRadius(s) {
    var i;
    if (s <= PROFILE[0][0]) { return PROFILE[0][1]; }
    for (i = 0; i < PROFILE.length - 1; i++) {
      var s0 = PROFILE[i][0], s1 = PROFILE[i + 1][0];
      if (s >= s0 && s <= s1) {
        var f = smooth((s - s0) / (s1 - s0));
        return PROFILE[i][1] + (PROFILE[i + 1][1] - PROFILE[i][1]) * f;
      }
    }
    return PROFILE[PROFILE.length - 1][1];
  }
  function bodyCenter(s) {
    var x = W * (L.bodyX0 + (L.bodyX1 - L.bodyX0) * s);
    var y = H * (0.885 - 0.235 * s);
    y -= H * 0.020 * gauss(s, 0.20, 0.09); // shoulder mound rises
    y -= H * 0.025 * gauss(s, 0.64, 0.10); // hip mound rises
    y += H * 0.012 * gauss(s, 0.46, 0.08); // waist dips
    return { x: x, y: y };
  }
  // Centre point plus outward normal at parameter s.
  function bodyPoint(s) {
    var e = 0.004;
    var c0 = bodyCenter(Math.max(-0.04, s - e));
    var c1 = bodyCenter(Math.min(1.0, s + e));
    var c = bodyCenter(s);
    var dx = c1.x - c0.x, dy = c1.y - c0.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    // Normal pointing to the upper side of the body.
    var nx = -dy / len, ny = dx / len;
    if (ny > 0) { nx = -nx; ny = -ny; }
    var r = L.bodyR * bodyRadius(s);
    return { x: c.x, y: c.y, nx: nx, ny: ny, r: r };
  }
  // Silhouette path: top edge forward, bottom edge back.
  function bodyPath() {
    var N = 48, i, s, p;
    ctx.beginPath();
    for (i = 0; i <= N; i++) {
      s = -0.04 + (1.04 * i) / N;
      p = bodyPoint(s);
      var tx = p.x + p.nx * p.r, ty = p.y + p.ny * p.r;
      if (i === 0) { ctx.moveTo(tx, ty); } else { ctx.lineTo(tx, ty); }
    }
    for (i = N; i >= 0; i--) {
      s = -0.04 + (1.04 * i) / N;
      p = bodyPoint(s);
      ctx.lineTo(p.x - p.nx * p.r, p.y - p.ny * p.r);
    }
    ctx.closePath();
  }
  // Top edge path alone, for the rim light stroke.
  function bodyTopPath() {
    var N = 48, i, s, p;
    ctx.beginPath();
    for (i = 0; i <= N; i++) {
      s = -0.04 + (1.04 * i) / N;
      p = bodyPoint(s);
      var tx = p.x + p.nx * p.r, ty = p.y + p.ny * p.r;
      if (i === 0) { ctx.moveTo(tx, ty); } else { ctx.lineTo(tx, ty); }
    }
  }

  // ---- Rock ------------------------------------------------------
  function rockPath() {
    var step = Math.max(6, W / 60), x;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(W, 0);
    ctx.lineTo(W, L.rockEdge(W));
    for (x = W - step; x >= 0; x -= step) {
      ctx.lineTo(x, L.rockEdge(x));
    }
    ctx.lineTo(0, L.rockEdge(0));
    ctx.closePath();
  }
  function drawRock(t) {
    rockPath();
    var g = ctx.createLinearGradient(0, 0, 0, H * 0.62);
    g.addColorStop(0, rgb(ROCK_TOP));
    g.addColorStop(1, rgb(ROCK_BOT));
    ctx.fillStyle = g;
    ctx.fill();

    // Horizontal graphite bands, very faint strata in the
    // rock, kept low so they never read as landscape lines.
    var b;
    ctx.save();
    rockPath();
    ctx.clip();
    for (b = 0; b < 4; b++) {
      var by = H * (0.10 + b * 0.11);
      var bh = H * (0.020 + 0.014 * hash1(b * 7.3));
      ctx.fillStyle = rgba(ROCK_BAND, a4(0.10 + 0.06 * hash1(b * 3.1)));
      ctx.fillRect(0, by, W, bh);
    }
    // Mottling from the shared noise field: soft graphite
    // blobs, darker and lighter, so the rock is not flat.
    var rng = mulberry32(SEED * 7 + 3);
    var i, bx, by2, br;
    for (i = 0; i < 150; i++) {
      bx = rng() * W;
      by2 = rng() * H * 0.58;
      br = W * (0.012 + rng() * 0.045);
      var light = rng() > 0.5;
      var bg = ctx.createRadialGradient(bx, by2, 0, bx, by2, br);
      bg.addColorStop(0, rgba(light ? GRAPHITE : [0, 0, 0], a4(0.10 + rng() * 0.08)));
      bg.addColorStop(1, rgba(light ? GRAPHITE : [0, 0, 0], 0));
      ctx.fillStyle = bg;
      ctx.fillRect(bx - br, by2 - br, br * 2, br * 2);
    }
    // A few short dark cracks following the noise field.
    ctx.lineWidth = Math.max(1, W * 0.0012);
    for (var c = 0; c < 4; c++) {
      var cx = W * (0.08 + hash1(c * 5.9) * 0.84);
      var cy = H * (0.06 + hash1(c * 9.1) * 0.22);
      ctx.strokeStyle = rgba([0, 0, 0], a4(0.22));
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      var k, px = cx, py = cy;
      for (k = 0; k < 4; k++) {
        px += (fbm(cx * 0.01 + k * 1.7 + c) - 0.5) * W * 0.05;
        py += H * 0.025;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    // Rock sheen: the same light vector catches the rock
    // faintly, so figure and rock share one light.
    var lx = lightCur.x * W, ly = lightCur.y * H;
    var sg = ctx.createRadialGradient(lx, ly, 0, lx, ly, W * 0.45);
    sg.addColorStop(0, rgba(SILVER, a4(0.07)));
    sg.addColorStop(1, rgba(SILVER, 0));
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, W, H * 0.65);
    ctx.restore();
  }

  // ---- Figure ----------------------------------------------------
  var STATIONS = [
    { s: 0.16, name: 'shoulder' },
    { s: 0.30, name: 'ribs' },
    { s: 0.44, name: 'ribs' },
    { s: 0.62, name: 'hip' },
    { s: 0.76, name: 'thigh' },
    { s: 0.90, name: 'calf' }
  ];
  function drawFigure(t) {
    // Soft contact shadow where the body meets the rock.
    var sh = bodyCenter(0.55);
    ctx.fillStyle = rgba([0, 0, 0], a4(0.45));
    ctx.beginPath();
    ctx.moveTo(sh.x + W * 0.34, sh.y + H * 0.075);
    ctx.ellipse(sh.x, sh.y + H * 0.075, W * 0.34, H * 0.018, -0.28, 0, Math.PI * 2);
    ctx.fill();

    // Base body: wet graphite gradient along the diagonal.
    bodyPath();
    var head = bodyCenter(-0.02), foot = bodyCenter(0.99);
    var g = ctx.createLinearGradient(head.x, head.y, foot.x, foot.y);
    g.addColorStop(0, rgb(BODY_TOP));
    g.addColorStop(1, rgb(BODY_BOT));
    ctx.fillStyle = g;
    ctx.fill();

    // Round the cut ends: head and foot caps in the local
    // gradient colours, so neither end reads as a chop.
    var hp = bodyPoint(-0.04), fp = bodyPoint(1.0);
    ctx.fillStyle = rgb(BODY_TOP);
    ctx.beginPath();
    ctx.moveTo(hp.x + hp.r, hp.y);
    ctx.arc(hp.x, hp.y, hp.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(BODY_BOT);
    ctx.beginPath();
    ctx.moveTo(fp.x + fp.r, fp.y);
    ctx.arc(fp.x, fp.y, fp.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    bodyPath();
    ctx.clip();

    // Mottling from the shared noise field, same field as
    // the rock, so body and rock read as one mass.
    var rng = mulberry32(SEED * 11 + 7);
    var i;
    for (i = 0; i < 90; i++) {
      var s = rng();
      var p = bodyPoint(s);
      var off = (rng() - 0.5) * 1.4 * p.r;
      var mx = p.x - p.ny * off, my = p.y + p.nx * off;
      var mr = p.r * (0.25 + rng() * 0.5);
      var mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr);
      var light = rng() > 0.45;
      mg.addColorStop(0, rgba(light ? GRAPHITE : [0, 0, 0], a4(0.12 + rng() * 0.10)));
      mg.addColorStop(1, rgba(light ? GRAPHITE : [0, 0, 0], 0));
      ctx.fillStyle = mg;
      ctx.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
    }

    // The cold silver highlight band: a soft band along the
    // body axis whose centre slides with the light, plus a
    // slow crawl so the sheen moves like water on skin.
    var lx = lightCur.x * W;
    var crawl = W * 0.020 * Math.sin(t * 0.11 + 1.3) +
      W * 0.012 * (fbm(t * 0.02 + 5.5) - 0.5) * 2;
    var bandX = lx + crawl;
    var bp = (bandX - head.x) / (foot.x - head.x);
    bp = clamp(bp, 0, 1);
    var bandW = 0.11;
    var bg2 = ctx.createLinearGradient(head.x, head.y, foot.x, foot.y);
    bg2.addColorStop(0, rgba(SILVER, 0));
    bg2.addColorStop(clamp(bp - bandW, 0, 1), rgba(SILVER, 0));
    bg2.addColorStop(bp, rgba(SILVER, a4(0.38)));
    bg2.addColorStop(clamp(bp + bandW, 0, 1), rgba(SILVER, 0));
    bg2.addColorStop(1, rgba(SILVER, 0));
    ctx.fillStyle = bg2;
    ctx.fillRect(0, H * 0.55, W, H * 0.45);

    // Anatomy glints: at each station the highlight swells
    // as the light passes over it and dissolves as it leaves.
    // Each glint also breathes slowly, water moving on skin.
    for (i = 0; i < STATIONS.length; i++) {
      var st = STATIONS[i];
      var pp = bodyPoint(st.s);
      var prox = clamp(1 - Math.abs(pp.x - bandX) / (W * 0.30), 0, 1);
      var breathe = 0.55 + 0.45 * Math.sin(t * 0.4 + i * 2.3);
      var strength = prox * prox * breathe;
      if (strength > 0.02) {
        var gr = pp.r * 0.9;
        var gg = ctx.createRadialGradient(pp.x, pp.y, 0, pp.x, pp.y, gr);
        gg.addColorStop(0, rgba(SILVER, a4(0.42 * strength)));
        gg.addColorStop(0.55, rgba(SILVER, a4(0.18 * strength)));
        gg.addColorStop(1, rgba(SILVER, 0));
        ctx.fillStyle = gg;
        ctx.fillRect(pp.x - gr, pp.y - gr, gr * 2, gr * 2);
        var cr = pp.r * 0.4;
        var cg = ctx.createRadialGradient(pp.x, pp.y, 0, pp.x, pp.y, cr);
        cg.addColorStop(0, rgba(SILVER_BRIGHT, a4(0.70 * strength)));
        cg.addColorStop(1, rgba(SILVER_BRIGHT, 0));
        ctx.fillStyle = cg;
        ctx.fillRect(pp.x - cr, pp.y - cr, cr * 2, cr * 2);
      }
    }

    // Wet streaks running along the body, drifting slowly
    // with the crawl so the sheen never sits still.
    ctx.lineWidth = Math.max(1, W * 0.0012);
    for (i = 0; i < 16; i++) {
      var ss = (hash1(i * 3.7) + t * 0.002) % 1;
      var sp = bodyPoint(ss);
      var sx = sp.x, sy = sp.y;
      var ex = sx + sp.nx * sp.r * 0.55, ey = sy + sp.ny * sp.r * 0.55;
      var sa = 0.015 + 0.04 * hash1(i * 7.9);
      ctx.strokeStyle = rgba(SILVER, a4(sa));
      ctx.beginPath();
      ctx.moveTo(sx - sp.nx * sp.r * 0.55, sy - sp.ny * sp.r * 0.55);
      ctx.lineTo(ex, ey);
      ctx.stroke();
    }

    // Slow ripples sliding along the body: thin bright arcs
    // crossing the body width, pure functions of t.
    for (i = 0; i < 5; i++) {
      var rs = (hash1(i * 13.3) + t * 0.004) % 1;
      var rp = bodyPoint(rs);
      var ra = 0.06 * (0.5 + 0.5 * Math.sin(t * 0.3 + i * 1.9));
      ctx.strokeStyle = rgba(SILVER_BRIGHT, a4(ra));
      ctx.lineWidth = Math.max(1, W * 0.001);
      ctx.beginPath();
      ctx.moveTo(rp.x - rp.nx * rp.r * 0.7, rp.y - rp.ny * rp.r * 0.7);
      ctx.lineTo(rp.x + rp.nx * rp.r * 0.7, rp.y + rp.ny * rp.r * 0.7);
      ctx.stroke();
    }
    ctx.restore();

    // Rim light along the body's upper edge: stronger when
    // the light sits high, weaker when it drops low.
    var rimA = 0.10 + 0.22 * (1 - clamp(lightCur.y, 0, 1));
    bodyTopPath();
    ctx.strokeStyle = rgba(SILVER, a4(rimA));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.stroke();
  }

  // ---- Spray -----------------------------------------------------
  // Fine spray particles at the top edge, drifting upward,
  // twinkling slowly. Pure functions of t.
  function drawSpray(t) {
    var i;
    for (i = 0; i < 110; i++) {
      var px = hash1(i * 3.1) * W;
      var speed = 6 + hash1(i * 5.7) * 14; // px per second upward
      var span = H * 0.12;
      var py = span - ((hash1(i * 7.7) * span + t * speed) % span);
      var pr = 0.5 + hash1(i * 11.3) * 1.3;
      var tw = 0.5 + 0.5 * Math.sin(t * 0.8 + i * 1.7);
      var pa = (0.15 + 0.35 * tw) * (1 - py / (span * 1.4));
      if (pa <= 0.02) { continue; }
      ctx.fillStyle = rgba(SILVER, a4(pa));
      ctx.beginPath();
      ctx.moveTo(px + pr, py);
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fill();
    }
    // A few larger soft spray sprites near the top edge.
    for (i = 0; i < 12; i++) {
      var sx = hash1(i * 17.3) * W;
      var sy = hash1(i * 19.7) * H * 0.05;
      var sr = W * (0.004 + hash1(i * 23.1) * 0.008);
      var sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
      sg.addColorStop(0, rgba(SILVER, a4(0.18)));
      sg.addColorStop(1, rgba(SILVER, 0));
      ctx.fillStyle = sg;
      ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    }
  }

  // ---- Draw ------------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Ease the light toward its target: the drag target while
    // dragging, the automatic orbit once released.
    var auto = lightAuto(t);
    var target = dragTarget || auto;
    lightCur.x += (target.x - lightCur.x) * 0.22;
    lightCur.y += (target.y - lightCur.y) * 0.22;

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawRock(t);
    drawFigure(t);
    drawSpray(t);

    // Caption, top left, and the hint, bottom center. Cold
    // silver stays readable on the near-black ground.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.88));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№643 · As the Element', W * 0.04, H * 0.055);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CAPTION, a4(0.92));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag the light across the body.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // ---- Interaction -----------------------------------------------
  // DRAG moves the hard light source. Release eases back to
  // the automatic sheen crawl. Never click-to-reload.
  function pointerPos(ev) {
    var r = null;
    try {
      if (typeof canvas.getBoundingClientRect === 'function') {
        r = canvas.getBoundingClientRect();
      }
    } catch (e) { r = null; }
    if (r && r.width) {
      return { x: (ev.clientX - r.left) / r.width, y: (ev.clientY - r.top) / r.height };
    }
    if (typeof ev.offsetX === 'number') {
      return { x: ev.offsetX / stageW, y: ev.offsetY / stageH };
    }
    return { x: 0.5, y: 0.35 };
  }
  function onDown(ev) {
    dragging = true;
    var p = pointerPos(ev);
    setLight(p.x, p.y);
    try {
      if (ev.preventDefault) { ev.preventDefault(); }
      if (canvas.setPointerCapture && ev.pointerId !== undefined) {
        canvas.setPointerCapture(ev.pointerId);
      }
    } catch (e) {}
  }
  function onMove(ev) {
    if (!dragging) { return; }
    var p = pointerPos(ev);
    setLight(p.x, p.y);
  }
  function onUp() {
    dragging = false;
    releaseLight();
  }
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);
      canvas.addEventListener('pointerleave', onUp);
    }
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1984 exposes the light vector and the drag
  // state so a probe can set the light, redraw, and confirm
  // the highlights slide.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1984 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      auto: lightAuto,
      light: function () { return { x: lightCur.x, y: lightCur.y }; },
      setLight: setLight,
      releaseLight: releaseLight,
      isDragging: function () { return dragging; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  // Initialise the light at the probe clock so the first
  // frame is deterministic.
  lightCur = lightAuto(probeT !== null ? probeT : FIRST_T);
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the light orbits slowly, the sheen crawls,
  // spray drifts, ripples slide along the body. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
