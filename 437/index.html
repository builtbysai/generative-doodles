<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.437 Picnic From Above</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F6D7DE; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.437 Picnic From Above (angelina_bambina_dsgn,
// EXPANSION #47, prompt ANG5). Her top-down social
// tableau: a bird's-eye picnic on a red-pink checkered
// blanket filling the centre of the frame. On an
// authored 6x5 anchor grid sit watermelon slices, a
// fruit platter, a wine bottle and glass, a baguette,
// sunglasses, a straw hat and two plates; a dog sleeps
// curled at a blanket corner. Three friends are
// present only as arms reaching in from the left, top
// and right frame edges. Oversized tropical leaves and
// flowers bleed in from all four edges and sway. No
// faces, no text anywhere.
// Ambient 60s loop: the dog breathes on 10 whole 6s
// cycles; the leaves sway on whole cycles; a butterfly
// crosses the blanket on 2 fixed slots 25s apart, each
// crossing 8s with 16 whole wing flaps. DRAG pans the
// whole still life (blanket, items and dog keep their
// relative layout); on release the pan springs back to
// exactly zero. DOUBLE-TAP advances the picnic through
// a FIXED AUTHORED TABLE of exactly 3 arrangements.
// Frame one is the full scene at the constant phase
// T = 10.0s: dog asleep mid-breath, butterfly
// mid-crossing in its first slot. The clock is anchored
// there and advances in fixed 1/60 ticks, never from a
// wall clock. Flat colour only, one canvas, no
// offscreen canvas, no gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette (closed) -----------------------------------
// The ten specced hexes and nothing else. The arms'
// skin and sleeve tones resolve inside this palette:
// skins are the flower orange, the baguette tan and
// the dog tan; sleeves are the check pink, the leaf
// green and the bottle green; cuffs are the cloth
// light. Documented in process.md.
var BASE = '#F6D7DE';      // cloth light, page ground
var CHECK = '#D94F6B';     // cloth checks
var MELON = '#E4575B';     // watermelon flesh
var RIND = '#4E7A3A';      // watermelon rind
var BAGUETTE = '#D9A55B';  // baguette, straw hat, skin
var BOTTLE = '#2E5339';    // wine bottle, details
var LEAF = '#2E7A4E';       // tropical leaves, sleeves
var FLOWERP = '#F06A8A';   // flower pink, butterfly
var FLOWERO = '#F5A623';   // flower orange, skin
var DOG = '#C9A06A';       // the sleeping dog, skin

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 60;
if (LOOP !== 60) throw new Error('Picnic loop must be 60s');
var TICK = 1 / 60;
var T0 = 10.0;
var T = T0;

// ---- the blanket ------------------------------------------
// Centre of the frame: 1104 x 736 at (88, 82), a 12x8
// checkerboard of 92px cells in CHECK and BASE with a
// CHECK border band and fringe ticks on its edge.
var BX = 88, BY = 82, BW = 1104, BH = 736, CELL = 92;
if (BW / CELL !== 12 || BH / CELL !== 8) throw new Error('blanket must be 12x8 checks');

// ---- the anchor grid ---------------------------------------
// Authored 6x5 grid over the blanket: cell centres.
function cellCX(i) { return BX + (i % 6 + 0.5) * (BW / 6); }
function cellCY(i) { return BY + (Math.floor(i / 6) + 0.5) * (BH / 5); }

// ---- the items ----------------------------------------------
// The fixed picnic set. Every arrangement lays these
// same items out on the anchor grid: c = cell index,
// dx/dy = offset from the cell centre, r = rotation.
var ITEM_KINDS = ['melon', 'melon', 'melon', 'platter', 'bottle',
                  'glass', 'baguette', 'shades', 'hat', 'plate', 'plate'];
if (ITEM_KINDS.length !== 11) throw new Error('picnic must hold exactly 11 items');
var ARR = [
  [ // arrangement 0: platter centred, hat top, dog bottom-right
    { c: 13, dx: -18, dy: 6,  r: 0.5 }, { c: 15, dx: 22, dy: -8, r: 2.4 }, { c: 21, dx: -6, dy: 14, r: 4.2 },
    { c: 14, dx: 0,   dy: 0,  r: 0.2 },
    { c: 8,  dx: 6,   dy: -4, r: 1.25 },
    { c: 9,  dx: -14, dy: 10, r: -0.4 },
    { c: 20, dx: 0,   dy: 2,  r: 0.45 },
    { c: 16, dx: 8,   dy: -12, r: -0.3 },
    { c: 3,  dx: 0,   dy: 0,  r: 0.15 },
    { c: 7,  dx: -10, dy: 4,  r: 0 }, { c: 22, dx: 14, dy: -6, r: 0 }
  ],
  [ // arrangement 1: platter right, bottle down the left, dog bottom-left
    { c: 7,  dx: 10,  dy: -6, r: 1.8 }, { c: 19, dx: -16, dy: 10, r: 3.6 }, { c: 26, dx: 4, dy: -12, r: 0.2 },
    { c: 15, dx: -6,  dy: 2,  r: -0.15 },
    { c: 12, dx: 0,   dy: 6,  r: 1.85 },
    { c: 13, dx: 16,  dy: -8, r: 0.5 },
    { c: 9,  dx: -4,  dy: 0,  r: -0.35 },
    { c: 21, dx: -10, dy: 6,  r: 0.9 },
    { c: 4,  dx: 8,   dy: 4,  r: -0.2 },
    { c: 8,  dx: 0,   dy: -10, r: 0 }, { c: 17, dx: -14, dy: 8, r: 0 }
  ],
  [ // arrangement 2: platter top-left, hat centre, dog top-right
    { c: 16, dx: -8,  dy: 12, r: 2.9 }, { c: 22, dx: 18, dy: -4, r: 0.9 }, { c: 10, dx: 0, dy: -14, r: 5.1 },
    { c: 7,  dx: 6,   dy: 0,  r: 0.35 },
    { c: 20, dx: -10, dy: 4,  r: 0.7 },
    { c: 21, dx: 12,  dy: 12, r: -0.9 },
    { c: 15, dx: 4,   dy: -2, r: 1.1 },
    { c: 26, dx: -6,  dy: -8, r: 0.2 },
    { c: 14, dx: 0,   dy: 2,  r: -0.1 },
    { c: 13, dx: -16, dy: -6, r: 0 }, { c: 19, dx: 10, dy: 10, r: 0 }
  ]
];
if (ARR.length !== 3) throw new Error('arrangement table must hold exactly 3 arrangements');
for (var av = 0; av < 3; av++)
  if (ARR[av].length !== ITEM_KINDS.length) throw new Error('each arrangement must place every item');
var arrIdx = 0;

// The dog's blanket corner per arrangement.
var DOGPOS = [
  { x: BX + BW - 58, y: BY + BH - 66, r: -0.5 },
  { x: BX + 62,      y: BY + BH - 62, r: 0.45 },
  { x: BX + BW - 62, y: BY + 74,      r: 2.6 }
];
if (DOGPOS.length !== 3) throw new Error('dog table must hold exactly 3 corners');

// ---- the arms -------------------------------------------------
// Exactly 3 arms, from the left, top and right edges.
// x, y = wrist point in frame space; rot = direction the
// fingers point (local +Y rotated by rot). Sleeves and
// skins resolve inside the palette (see palette note).
var ARMS = [
  { x: 118,  y: 306, rot: -Math.PI / 2, skin: BAGUETTE, sleeve: CHECK,   cuff: BASE },
  { x: 902,  y: 108, rot: 0,            skin: FLOWERO,  sleeve: LEAF,    cuff: BASE },
  { x: 1162, y: 566, rot: Math.PI / 2,  skin: DOG,      sleeve: BOTTLE,  cuff: BASE }
];
if (ARMS.length !== 3) throw new Error('Picnic must hold exactly 3 arms');

// ---- the edge leaves and flowers --------------------------------
// Oversized tropical leaves bleeding in from all four
// frame edges: x, y = base point, s = length, rot =
// resting direction of the leaf tip, m = whole sway
// cycles per loop, ph = sway phase.
var EDGE_LEAVES = [
  { x: 190,  y: -34,  s: 128, rot: Math.PI - 0.15, m: 3, ph: 0.0 },
  { x: 650,  y: -48,  s: 148, rot: Math.PI + 0.1,  m: 4, ph: 1.3 },
  { x: 1090, y: -32,  s: 120, rot: Math.PI - 0.3,  m: 3, ph: 2.1 },
  { x: 250,  y: 934,  s: 132, rot: 0.18,           m: 4, ph: 0.7 },
  { x: 770,  y: 944,  s: 142, rot: -0.12,          m: 3, ph: 1.8 },
  { x: 1150, y: 926,  s: 112, rot: 0.3,            m: 5, ph: 2.6 },
  { x: -38,  y: 190,  s: 116, rot: Math.PI / 2 + 0.2,  m: 4, ph: 1.0 },
  { x: -30,  y: 706,  s: 126, rot: Math.PI / 2 - 0.15, m: 3, ph: 2.9 },
  { x: 1318, y: 250,  s: 122, rot: -Math.PI / 2 - 0.2, m: 5, ph: 0.4 },
  { x: 1312, y: 668,  s: 110, rot: -Math.PI / 2 + 0.25, m: 4, ph: 1.6 }
];
if (EDGE_LEAVES.length !== 10) throw new Error('edge leaf table must hold exactly 10 leaves');
var EDGE_FLOWERS = [
  { x: 92,   y: 58,  s: 17, col: FLOWERP, ph: 0.3 },
  { x: 1236, y: 118, s: 15, col: FLOWERO, ph: 1.4 },
  { x: 58,   y: 836, s: 16, col: FLOWERO, ph: 2.2 },
  { x: 1206, y: 852, s: 18, col: FLOWERP, ph: 0.9 },
  { x: 436,  y: 24,  s: 13, col: FLOWERP, ph: 1.9 },
  { x: 906,  y: 880, s: 14, col: FLOWERP, ph: 2.7 }
];
if (EDGE_FLOWERS.length !== 6) throw new Error('edge flower table must hold exactly 6 flowers');

// ---- the butterfly ----------------------------------------------
// Two fixed crossing slots, 25s apart, each 8s long.
// A flies left to right across the upper blanket, B
// right to left across the lower blanket. The wing
// flap runs at 2Hz, so each crossing holds exactly 16
// whole flaps and the seam stays clean.
var FLIGHTS = [
  { t0: 6,  x1: -50, y1: 300, cx: 640, cy: 110, x2: 1330, y2: 235 },
  { t0: 31, x1: 1330, y1: 625, cx: 640, cy: 790, x2: -50, y2: 470 }
];
if (FLIGHTS.length !== 2) throw new Error('butterfly must hold exactly 2 flight slots');
if (FLIGHTS[1].t0 - FLIGHTS[0].t0 !== 25) throw new Error('flight slots must sit 25s apart');
var FLIGHT_LEN = 8;

// ---- state ---------------------------------------------------------
var dragging = false;
var panX = 0, panY = 0, panVX = 0, panVY = 0;
var lastPtrX = 0, lastPtrY = 0;
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
var lastNow = -1, acc = 0;

// QA hook via the renderer's query string (?seed=N):
// seed=N starts the piece on arrangement N of the
// table. Default play is unaffected.
var QS = (typeof location !== 'undefined' && location.search) || '';
var sm = QS.match(/seed=(\d)/);
if (sm) arrIdx = clampInt(parseInt(sm[1], 10), 0, 2);
function clampInt(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---- small helpers --------------------------------------------------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function frac(v) { return v - Math.floor(v); }
function ell(x, y, rx, ry, rot, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function circ(x, y, r, col) { ell(x, y, r, r, 0, col); }
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function rr(x, y, w, h, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath(); ctx.fill();
}
function seg(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function curve(x1, y1, cx, cy, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
}

// ---- the blanket -------------------------------------------------------
function drawBlanket() {
  rect(BX, BY, BW, BH, CHECK);
  var r, c;
  for (r = 0; r < 8; r++)
    for (c = 0; c < 12; c++)
      if ((r + c) % 2 === 0) rect(BX + c * CELL, BY + r * CELL, CELL, CELL, BASE);
  ctx.strokeStyle = CHECK; ctx.lineWidth = 13;
  ctx.strokeRect(BX + 7, BY + 7, BW - 14, BH - 14);
  // Fringe ticks along the edge.
  ctx.strokeStyle = CHECK; ctx.lineWidth = 5; ctx.lineCap = 'round';
  var k;
  ctx.beginPath();
  for (k = 0; k <= 24; k++) {
    var fx = BX + k * (BW / 24);
    ctx.moveTo(fx, BY - 3); ctx.lineTo(fx, BY - 17);
    ctx.moveTo(fx, BY + BH + 3); ctx.lineTo(fx, BY + BH + 17);
  }
  for (k = 0; k <= 16; k++) {
    var fy = BY + k * (BH / 16);
    ctx.moveTo(BX - 3, fy); ctx.lineTo(BX - 17, fy);
    ctx.moveTo(BX + BW + 3, fy); ctx.lineTo(BX + BW + 17, fy);
  }
  ctx.stroke();
}

// ---- the items ------------------------------------------------------------
function drawMelon(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = RIND;
  ctx.beginPath(); ctx.moveTo(0, -6);
  ctx.arc(0, -6, 58, Math.PI * 0.18, Math.PI * 0.82); ctx.closePath(); ctx.fill();
  ctx.fillStyle = MELON;
  ctx.beginPath(); ctx.moveTo(0, -6);
  ctx.arc(0, -6, 47, Math.PI * 0.18, Math.PI * 0.82); ctx.closePath(); ctx.fill();
  var seeds = [[-24, 16], [-8, 26], [10, 27], [25, 15], [0, 12]], i;
  for (i = 0; i < seeds.length; i++) circ(seeds[i][0], seeds[i][1], 3.6, BOTTLE);
  ctx.restore();
}
function drawPlatter(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ell(0, 0, 98, 64, 0, BASE);
  ctx.beginPath(); ctx.ellipse(0, 0, 86, 53, 0, 0, Math.PI * 2);
  ctx.strokeStyle = CHECK; ctx.lineWidth = 6; ctx.stroke();
  circ(-32, -8, 21, MELON); circ(20, -16, 18, FLOWERO); circ(36, 13, 17, FLOWERP);
  circ(-4, 17, 16, MELON); circ(-48, 14, 13, FLOWERO);
  var grapes = [[52, -18], [62, -6], [48, -30], [58, -24]], i;
  for (i = 0; i < grapes.length; i++) circ(grapes[i][0], grapes[i][1], 7.5, FLOWERP);
  drawSprig(-58, -22, 0.7); drawSprig(6, -34, 2.2);
  ctx.restore();
}
function drawSprig(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ell(0, 0, 7, 16, 0.5, RIND); ell(10, 2, 7, 15, -0.6, RIND);
  ctx.restore();
}
function drawBottle(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  rr(-21, -52, 42, 96, 11, BOTTLE);            // body
  rect(-7, -88, 14, 40, BOTTLE);               // neck
  rect(-10, -95, 20, 10, BOTTLE);              // lip
  rr(-6, -108, 12, 14, 3, BAGUETTE);           // cork
  rect(-21, -16, 42, 32, BASE);                // label
  rect(-21, -16, 42, 8, CHECK);                // label stripe
  ctx.restore();
}
function drawGlass(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ell(0, -6, 23, 29, 0, BASE);                 // bowl
  ctx.beginPath(); ctx.ellipse(0, -6, 23, 29, 0, 0, Math.PI * 2);
  ctx.strokeStyle = CHECK; ctx.lineWidth = 3; ctx.stroke();
  ell(0, 2, 17, 19, 0, MELON);                 // wine
  seg(0, 22, 0, 46, 4.5, CHECK);               // stem
  ell(0, 49, 17, 5.5, 0, CHECK);               // foot
  ctx.restore();
}
function drawBaguette(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ell(0, 0, 80, 21, 0, BAGUETTE);
  var i;
  for (i = -2; i <= 2; i++) seg(i * 30 - 8, -11, i * 30 + 9, 9, 5, BASE);
  ctx.restore();
}
function drawShades(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  seg(-72, -16, -54, -10, 6, BOTTLE);          // temples
  seg(72, -16, 54, -10, 6, BOTTLE);
  rr(-56, -18, 47, 36, 10, BOTTLE);
  rr(9, -18, 47, 36, 10, BOTTLE);
  seg(-9, -8, 9, -8, 6, BOTTLE);               // bridge
  ctx.restore();
}
function drawHat(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ell(0, 0, 76, 47, 0, BAGUETTE);              // brim
  ell(0, -3, 42, 28, 0, CHECK);                // band
  ell(0, -8, 39, 25, 0, BAGUETTE);             // dome
  ctx.restore();
}
function drawPlate(x, y) {
  ell(x, y, 54, 37, 0, BASE);
  ctx.beginPath(); ctx.ellipse(x, y, 43, 27, 0, 0, Math.PI * 2);
  ctx.strokeStyle = CHECK; ctx.lineWidth = 5; ctx.stroke();
}
var ITEM_DRAW = {
  melon: drawMelon, platter: drawPlatter, bottle: drawBottle,
  glass: drawGlass, baguette: drawBaguette, shades: drawShades,
  hat: drawHat, plate: function (x, y) { drawPlate(x, y); }
};

// ---- the dog ------------------------------------------------------------------
// Curled asleep at a blanket corner: a round body, the
// head tucked against it, one ear flopped, the tail
// wrapped around the side. The breath scales the body
// on the 6s cycle, the side rising and falling; it
// never wakes.
function drawDog(p, lt) {
  var b = Math.sin(Math.PI * 2 * (lt / 6));
  ctx.save();
  ctx.translate(p.x, p.y); ctx.rotate(p.r);
  ctx.scale(1 + 0.015 * b, 1 + 0.042 * b);
  ell(0, 0, 88, 57, 0, DOG);                              // body
  ctx.beginPath(); ctx.ellipse(0, 0, 74, 46, 0, -0.7, 1.15);
  ctx.strokeStyle = DOG; ctx.lineWidth = 17; ctx.stroke(); // tail wrap
  circ(96, 8, 10, BAGUETTE);                                // tail tip
  ell(-34, 34, 24, 12, 0.5, BAGUETTE);                      // front paw
  circ(-56, -14, 34, DOG);                                  // head
  ctx.save(); ctx.globalAlpha = 0.22;
  ctx.beginPath(); ctx.arc(-30, -6, 33, Math.PI * 0.6, Math.PI * 1.45);
  ctx.strokeStyle = BOTTLE; ctx.lineWidth = 3.5; ctx.stroke(); // curl seam
  ctx.restore();
  ell(-64, -40, 13, 21, -0.5, BAGUETTE);                    // ear
  ctx.beginPath(); ctx.arc(-66, -12, 9, Math.PI * 1.1, Math.PI * 1.7);
  ctx.strokeStyle = BOTTLE; ctx.lineWidth = 3.2; ctx.stroke(); // closed eye
  circ(-86, -2, 5, BOTTLE);                                 // nose
  ctx.restore();
}

// ---- the edge leaves and flowers ----------------------------------------------
function drawLeafShape(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.quadraticCurveTo(s * 0.58, -s * 0.25, 0, s);
  ctx.quadraticCurveTo(-s * 0.58, -s * 0.25, 0, -s);
  ctx.closePath();
  ctx.fillStyle = LEAF; ctx.fill();
  ctx.save(); ctx.globalAlpha = 0.30;
  seg(0, -s * 0.9, 0, s * 0.9, 4, BOTTLE);
  seg(0, -s * 0.4, s * 0.3, -s * 0.15, 2.5, BOTTLE);
  seg(0, -s * 0.4, -s * 0.3, -s * 0.15, 2.5, BOTTLE);
  seg(0, s * 0.1, s * 0.34, s * 0.3, 2.5, BOTTLE);
  seg(0, s * 0.1, -s * 0.34, s * 0.3, 2.5, BOTTLE);
  ctx.restore();
  ctx.restore();
}
function drawFlower(x, y, s, col, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  var i;
  for (i = 0; i < 5; i++) {
    var a = i / 5 * Math.PI * 2;
    ell(Math.cos(a) * s * 0.62, Math.sin(a) * s * 0.62, s * 0.52, s * 0.34, a, col);
  }
  circ(0, 0, s * 0.36, col === FLOWERO ? FLOWERP : FLOWERO);
  ctx.restore();
}

// ---- the arms ---------------------------------------------------------------------
// The No.428 hand in local space: the sleeve runs off
// the top (local -Y) past the wrist at (0, 0), the palm
// rounds below it, four finger capsules hang with bare
// gaps between them, a thumb rides the side.
function drawArm(a) {
  ctx.save();
  ctx.translate(a.x, a.y); ctx.rotate(a.rot);
  rr(-40, -216, 80, 198, 18, a.sleeve);          // sleeve
  rr(-43, -32, 86, 32, 11, a.cuff);              // cuff
  ell(0, 30, 37, 37, 0, a.skin);                 // palm
  var fl = [36, 47, 43, 31], fx = [-27, -9, 9, 27], i;
  for (i = 0; i < 4; i++) rr(fx[i] - 8, 46, 16, fl[i], 8, a.skin);
  ctx.save();
  ctx.translate(35, 16); ctx.rotate(0.7);
  rr(-8, -4, 16, 35, 8, a.skin);                 // thumb
  ctx.restore();
  ctx.restore();
}

// ---- the butterfly -------------------------------------------------------------------
function drawButterfly(lt) {
  var i, f, e, u, mt;
  for (i = 0; i < FLIGHTS.length; i++) {
    f = FLIGHTS[i];
    e = lt - f.t0;
    if (e < 0 || e > FLIGHT_LEN) continue;
    u = e / FLIGHT_LEN;
    mt = 1 - u;
    var x = mt * mt * f.x1 + 2 * mt * u * f.cx + u * u * f.x2;
    var y = mt * mt * f.y1 + 2 * mt * u * f.cy + u * u * f.y2;
    var flap = Math.abs(Math.sin(Math.PI * 2 * 2 * e + Math.PI / 2));
    var dir = f.x2 > f.x1 ? 1 : -1;
    ctx.save(); ctx.translate(x, y);
    ctx.scale(dir, 1);
    ctx.save(); ctx.scale(0.3 + 0.7 * flap, 1);
    ell(16, -7, 17, 10, -0.5, FLOWERP);
    ell(15, 8, 14, 8.5, 0.5, FLOWERP);
    circ(12, -6, 3.4, FLOWERO); circ(18, 7, 2.8, FLOWERO);
    ctx.restore();
    ctx.save(); ctx.scale(-(0.3 + 0.7 * flap), 1);
    ell(16, -7, 17, 10, -0.5, FLOWERP);
    ell(15, 8, 14, 8.5, 0.5, FLOWERP);
    ctx.restore();
    seg(0, -11, 0, 12, 5.5, BOTTLE);
    ctx.restore();
  }
}

// ---- draw ------------------------------------------------------------------------------
function draw() {
  var lt = T % LOOP;
  rect(-2400, -2400, DW + 4800, DH + 4800, BASE);
  var i;
  // The still life pans as one layout under the drag.
  ctx.save();
  ctx.translate(panX, panY);
  drawBlanket();
  drawDog(DOGPOS[arrIdx], lt);
  var lay = ARR[arrIdx], p;
  for (i = 0; i < ITEM_KINDS.length; i++) {
    p = lay[i];
    ITEM_DRAW[ITEM_KINDS[i]](cellCX(p.c) + p.dx, cellCY(p.c) + p.dy, p.r);
  }
  ctx.restore();
  // Frame furniture: leaves and flowers bleed from the
  // edges and sway on whole cycles; arms reach in over
  // the blanket edge; the butterfly crosses on top.
  var lf, sway;
  for (i = 0; i < EDGE_LEAVES.length; i++) {
    lf = EDGE_LEAVES[i];
    sway = 0.05 * Math.sin(Math.PI * 2 * lf.m * (lt / LOOP) + lf.ph);
    drawLeafShape(lf.x, lf.y, lf.s, lf.rot + sway);
  }
  for (i = 0; i < EDGE_FLOWERS.length; i++) {
    var ef = EDGE_FLOWERS[i];
    drawFlower(ef.x, ef.y, ef.s, ef.col, 0.4 * Math.sin(Math.PI * 2 * 3 * (lt / LOOP) + ef.ph));
  }
  for (i = 0; i < ARMS.length; i++) drawArm(ARMS[i]);
  drawButterfly(lt);
}

// ---- step ---------------------------------------------------------------------------------
// Only the pan has state: while dragging it is set by
// pointer moves; after release a damped spring on
// fixed ticks returns it to exactly zero, snapping the
// last epsilon away so the still life settles back
// onto its authored layout.
function step() {
  if (dragging) return;
  panVX += (-120 * panX - 14 * panVX) * TICK;
  panVY += (-120 * panY - 14 * panVY) * TICK;
  panX += panVX * TICK;
  panY += panVY * TICK;
  if (Math.abs(panX) < 0.05 && Math.abs(panVX) < 0.5) { panX = 0; panVX = 0; }
  if (Math.abs(panY) < 0.05 && Math.abs(panVY) < 0.5) { panY = 0; panVY = 0; }
}

// ---- pointer: drag pans the still life, double-tap re-lays the picnic -----------------------
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true;
  panVX = 0; panVY = 0;
  lastPtrX = p.x; lastPtrY = p.y;
  var dxT = p.x - lastTapX, dyT = p.y - lastTapY;
  if (T - lastTapT < 0.34 && Math.sqrt(dxT * dxT + dyT * dyT) < 60) {
    arrIdx = (arrIdx + 1) % 3;
    lastTapT = -10;
  } else {
    lastTapT = T; lastTapX = p.x; lastTapY = p.y;
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  panX = clamp(panX + (p.x - lastPtrX), -150, 150);
  panY = clamp(panY + (p.y - lastPtrY), -110, 110);
  lastPtrX = p.x; lastPtrY = p.y;
});
function endPointer() { dragging = false; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// ---- sizing: full-bleed field, cover-fit ------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
