<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1972 Scene 1: Preface</title>
<style>
  html, body { margin: 0; padding: 0; background: #f2ead8; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Scene 1: Preface, TL5 / PP1219, study #257 theodora-laird.
  // A hand-bound book page fills the screen, typeset like a
  // zone6press chapbook. Narrator and Chorus voices alternate
  // in blocks. Behind the text, barely visible, a generative
  // tableau shifts per scene: a gray room, a shoreline, a dark
  // stage, a room after rain, a dawn coda. The text is the
  // foreground; the scene is the room the words are spoken in.
  // Tap turns the page. The book has a fixed order and it ends.
  var PAPER = '#f2ead8';  // aged paper cream
  var PAPERD = '#e2d5b8'; // paper shadow, darker cream
  var INK = '#211d18';    // ink black type
  var GRAY = '#8a8d90';   // gray room wash
  var SEA = '#7e8b8c';    // sea gray wash
  var STAGE = '#1a1a1c';  // stage black wash
  var RAIN = '#8b9187';   // rain gray green wash
  var DAWN = '#d9c9a8';   // dawn pale wash
  var SPOT = '#e8d9a8';   // spotlight warm pale

  // Fixed-phase first frame: FIRST_T = 6 s. Scene 1 began at
  // t = 0, so at t = 6 its text is fully typed in (typing runs
  // at 55 characters per second and the Preface holds about
  // 240 characters, done by about 4.4 s). The gray room tableau
  // is fully faded in and the dust is mid drift.
  var FIRST_T = 6;
  var SEED = 1972;
  var TYPE_RATE = 55; // characters per second, reading speed

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and fixed salts, so every frame is a pure
  // function of t and the scene index.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // The book: five scenes in a fixed order. Tap advances the
  // index; the last page stays put. Texts are new short scenes
  // written for this piece, in the observed register.
  var SCENES = [
    {
      kicker: 'SCENE 1',
      title: 'Preface (Prayer)',
      lines: [
        { v: 'NARRATOR', t: 'Before the room wakes, we lay the table for the words.' },
        { v: 'CHORUS', t: 'Bread, water, a chair pulled close to the light.' },
        { v: 'NARRATOR', t: 'Nothing here is owned. Everything here is lent.' },
        { v: 'CHORUS', t: 'Say it plain, and say it once, and let it stand.' },
        { v: 'NARRATOR', t: 'The prayer is short. The listening is long.' }
      ]
    },
    {
      kicker: 'SCENE 2',
      title: 'The Shoreline',
      lines: [
        { v: 'NARRATOR', t: 'The tide comes in and takes the footprints first.' },
        { v: 'CHORUS', t: 'We stand where the water has already decided.' },
        { v: 'NARRATOR', t: 'Every shell is a small room with the sea inside.' },
        { v: 'CHORUS', t: 'Carry nothing home that the tide still wants.' },
        { v: 'NARRATOR', t: 'The gulls keep the hour better than we do.' }
      ]
    },
    {
      kicker: 'SCENE 3',
      title: 'The Dark Stage',
      lines: [
        { v: 'NARRATOR', t: 'The curtain does not rise. It only thins.' },
        { v: 'CHORUS', t: 'One lamp, one chair, one voice left standing.' },
        { v: 'NARRATOR', t: 'In the dark, every word has to earn its light.' },
        { v: 'CHORUS', t: 'We speak so the room can hear itself think.' },
        { v: 'NARRATOR', t: 'When the lamp goes out, the play is not over.' }
      ]
    },
    {
      kicker: 'SCENE 4',
      title: 'A Room After Rain',
      lines: [
        { v: 'NARRATOR', t: 'Rain has washed the window and left the light clean.' },
        { v: 'CHORUS', t: 'The roof keeps time in drops, slow and even.' },
        { v: 'NARRATOR', t: 'A wet street shines like a page left open.' },
        { v: 'CHORUS', t: 'We dry the chairs and set the table again.' },
        { v: 'NARRATOR', t: 'After rain, the smallest room feels wide.' }
      ]
    },
    {
      kicker: 'SCENE 5',
      title: 'Coda (Benediction)',
      lines: [
        { v: 'NARRATOR', t: 'The book closes the way a door closes, gently.' },
        { v: 'CHORUS', t: 'What was said stays in the room behind us.' },
        { v: 'NARRATOR', t: 'Go in peace, and keep the words you were given.' },
        { v: 'CHORUS', t: 'The end is a beginning, practised quietly.' },
        { v: 'NARRATOR', t: 'Amen, said softly, so the house can sleep.' }
      ]
    }
  ];
  var sceneIndex = 0;
  var sceneStartT = 0; // clock time the current scene began

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function spaced(s) { return s.split('').join(' '); }

  var L = {};
  function layout() {
    L.mx = isPhone ? W * 0.08 : W * 0.10;
    L.textW = W - L.mx * 2;
    L.topY = isPhone ? H * 0.055 : H * 0.07;
    L.fsKicker = Math.round(clamp(W * 0.020, 11, 17));
    L.fsTitle = Math.round(clamp(W * 0.052, 26, 44));
    L.fsSub = Math.round(L.fsTitle * 0.62);
    L.fsBody = Math.round(clamp(W * 0.034, 18, 27));
    L.fsLabel = Math.round(L.fsBody * 0.58);
    L.lhBody = L.fsBody * 1.62;
    L.lhLabel = L.fsLabel * 1.9;
    L.fsHint = Math.round(clamp(W * 0.020, 12, 15));
    L.fsPage = Math.round(clamp(W * 0.018, 11, 14));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Typewriter --------------------------------------------
  // Characters typed so far in the current scene, a pure
  // function of the clock. In reduced motion the text is whole.
  function typedChars(t) {
    if (reduced) { return 100000; }
    var el = t - sceneStartT;
    if (el < 0) { el = 0; }
    return Math.floor(el * TYPE_RATE);
  }
  function sceneCharTotal(si) {
    var n = 0, i;
    for (i = 0; i < SCENES[si].lines.length; i++) { n += SCENES[si].lines[i].t.length; }
    return n;
  }

  // ---- Tableaux ----------------------------------------------
  // Each tableau is drawn at low opacity behind the type, then
  // a cream veil is laid over the whole page so the words stay
  // the foreground. All motion is slow drift, well under 14 Hz.
  function tableauAlpha(t) {
    if (reduced) { return 1; }
    var el = t - sceneStartT;
    return clamp(0.25 + 0.75 * (el / 1.2), 0, 1);
  }

  function drawTableau(t, si, ta) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();
    var rng = mulberry32(SEED * 31 + si * 101 + 7);
    var i, x, y;
    if (si === 0) {
      // Gray room: wash, a window at the right, a shaft of
      // light, a floor line, slow dust motes. On phones the
      // window is omitted: the tall sheet puts the text where
      // the window would sit, and the pane lines would cross
      // the words.
      ctx.fillStyle = hexA(GRAY, a4(0.16 * ta));
      ctx.fillRect(0, 0, W, H);
      if (!isPhone) {
      var wx0 = W * 0.62, wx1 = W * 0.88, wy0 = H * 0.16, wy1 = H * 0.48;
      ctx.strokeStyle = hexA(INK, a4(0.45 * ta));
      ctx.lineWidth = Math.max(1.5, W * 0.003);
      ctx.strokeRect(wx0, wy0, wx1 - wx0, wy1 - wy0);
      ctx.beginPath();
      ctx.moveTo((wx0 + wx1) / 2, wy0);
      ctx.lineTo((wx0 + wx1) / 2, wy1);
      ctx.moveTo(wx0, (wy0 + wy1) / 2);
      ctx.lineTo(wx1, (wy0 + wy1) / 2);
      ctx.stroke();
      ctx.fillStyle = hexA(PAPERD, a4(0.16 * ta));
      ctx.beginPath();
      ctx.moveTo(wx0, wy1);
      ctx.lineTo(wx1, wy1);
      ctx.lineTo(wx1 - W * 0.10, H * 0.86);
      ctx.lineTo(wx0 - W * 0.16, H * 0.86);
      ctx.closePath();
      ctx.fill();
      }
      ctx.strokeStyle = hexA(INK, a4(0.30 * ta));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, H * 0.72);
      ctx.lineTo(W, H * 0.72);
      ctx.stroke();
      for (i = 0; i < 24; i++) {
        var dx0 = rng() * W, dy0 = H * 0.10 + rng() * H * 0.70;
        var sp = 2 + rng() * 4;
        x = (dx0 + sp * t) % W;
        y = dy0 + Math.sin(t * 0.25 + i * 1.7) * H * 0.008;
        ctx.fillStyle = hexA(INK, a4((0.14 + rng() * 0.12) * ta));
        ctx.beginPath();
        ctx.moveTo(x + 1.6, y);
        ctx.arc(x, y, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (si === 1) {
      // Shoreline: sea-gray wash, a horizon, slow wave lines,
      // three gulls drifting, foam dots near the foot of the page.
      ctx.fillStyle = hexA(SEA, a4(0.18 * ta));
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = hexA(PAPER, a4(0.12 * ta));
      ctx.beginPath();
      ctx.moveTo(W * 0.72, H * 0.20);
      ctx.arc(W * 0.72, H * 0.20, W * 0.045, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = hexA(INK, a4(0.35 * ta));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, H * 0.55);
      ctx.lineTo(W, H * 0.55);
      ctx.stroke();
      var wv;
      for (wv = 0; wv < 5; wv++) {
        var wy = H * (0.60 + wv * 0.055);
        ctx.strokeStyle = hexA(INK, a4((0.28 - wv * 0.03) * ta));
        ctx.lineWidth = Math.max(1, W * 0.0018);
        ctx.beginPath();
        var px;
        for (px = 0; px <= W; px += W / 24) {
          var py = wy + Math.sin(px * 0.012 + t * 0.45 + wv * 1.3) * H * 0.006;
          if (px === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
        }
        ctx.stroke();
      }
      for (i = 0; i < 3; i++) {
        var gx0 = rng() * W * 0.7, gy0 = H * (0.18 + rng() * 0.16);
        x = (gx0 + (4 + i * 2) * t) % (W * 1.1) - W * 0.05;
        y = gy0 + Math.sin(t * 0.5 + i * 2.1) * H * 0.01;
        var gw = W * 0.022;
        ctx.strokeStyle = hexA(INK, a4(0.45 * ta));
        ctx.lineWidth = Math.max(1.2, W * 0.002);
        ctx.beginPath();
        ctx.moveTo(x - gw, y);
        ctx.quadraticCurveTo(x - gw * 0.4, y - gw * 0.55, x, y);
        ctx.quadraticCurveTo(x + gw * 0.4, y - gw * 0.55, x + gw, y);
        ctx.stroke();
      }
      for (i = 0; i < 18; i++) {
        var fx0 = rng() * W, fy0 = H * (0.86 + rng() * 0.10);
        x = (fx0 + (1 + rng() * 2) * t) % W;
        y = fy0 + Math.sin(t * 0.6 + i) * 2;
        ctx.fillStyle = hexA(PAPER, a4((0.20 + rng() * 0.15) * ta));
        ctx.beginPath();
        ctx.moveTo(x + 1.8, y);
        ctx.arc(x, y, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (si === 2) {
      // Dark stage: stage-black wash, curtain folds at both
      // edges, one spotlight cone from above, dust in the beam.
      ctx.fillStyle = hexA(STAGE, a4(0.30 * ta));
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = hexA(SPOT, a4(0.10 * ta));
      ctx.beginPath();
      ctx.moveTo(W * 0.44, 0);
      ctx.lineTo(W * 0.56, 0);
      ctx.lineTo(W * 0.68, H * 0.78);
      ctx.lineTo(W * 0.32, H * 0.78);
      ctx.closePath();
      ctx.fill();
      var cf;
      for (cf = 0; cf < 4; cf++) {
        var cx0 = W * (0.02 + cf * 0.045);
        ctx.strokeStyle = hexA(STAGE, a4(0.55 * ta));
        ctx.lineWidth = Math.max(2, W * 0.008);
        ctx.beginPath();
        ctx.moveTo(cx0, 0);
        ctx.bezierCurveTo(cx0 + W * 0.02, H * 0.3, cx0 - W * 0.02, H * 0.6, cx0 + W * 0.01, H);
        ctx.stroke();
        var cx1 = W * (0.98 - cf * 0.045);
        ctx.beginPath();
        ctx.moveTo(cx1, 0);
        ctx.bezierCurveTo(cx1 - W * 0.02, H * 0.3, cx1 + W * 0.02, H * 0.6, cx1 - W * 0.01, H);
        ctx.stroke();
      }
      ctx.strokeStyle = hexA(PAPER, a4(0.20 * ta));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, H * 0.78);
      ctx.lineTo(W, H * 0.78);
      ctx.stroke();
      for (i = 0; i < 20; i++) {
        var bx0 = W * (0.38 + rng() * 0.24), by0 = rng() * H * 0.7;
        x = bx0 + Math.sin(t * 0.3 + i * 1.9) * W * 0.01;
        y = (by0 + (3 + rng() * 4) * t) % (H * 0.78);
        ctx.fillStyle = hexA(SPOT, a4((0.20 + rng() * 0.15) * ta));
        ctx.beginPath();
        ctx.moveTo(x + 1.5, y);
        ctx.arc(x, y, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (si === 3) {
      // A room after rain: gray-green wash, a window with rain
      // streaks sliding down, a puddle with slow ripples below.
      ctx.fillStyle = hexA(RAIN, a4(0.16 * ta));
      ctx.fillRect(0, 0, W, H);
      var rx0 = W * 0.14, rx1 = W * 0.42, ry0 = H * 0.16, ry1 = H * 0.46;
      ctx.strokeStyle = hexA(INK, a4(0.35 * ta));
      ctx.lineWidth = Math.max(1.5, W * 0.003);
      ctx.strokeRect(rx0, ry0, rx1 - rx0, ry1 - ry0);
      ctx.beginPath();
      ctx.moveTo((rx0 + rx1) / 2, ry0);
      ctx.lineTo((rx0 + rx1) / 2, ry1);
      ctx.stroke();
      ctx.save();
      ctx.beginPath();
      ctx.rect(rx0, ry0, rx1 - rx0, ry1 - ry0);
      ctx.clip();
      for (i = 0; i < 26; i++) {
        var sx0 = rx0 + rng() * (rx1 - rx0);
        var sy0 = ry0 + rng() * (ry1 - ry0);
        var drop = (sy0 + (26 + rng() * 22) * t - ry0) % (ry1 - ry0) + ry0;
        ctx.strokeStyle = hexA(INK, a4((0.18 + rng() * 0.14) * ta));
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx0, drop - H * 0.02);
        ctx.lineTo(sx0, drop);
        ctx.stroke();
      }
      ctx.restore();
      var pcx = W * 0.62, pcy = H * 0.80;
      ctx.fillStyle = hexA(SEA, a4(0.12 * ta));
      ctx.beginPath();
      ctx.moveTo(pcx + W * 0.20, pcy);
      ctx.arc(pcx, pcy, W * 0.20, 0, Math.PI * 2);
      ctx.fill();
      var rp;
      for (rp = 0; rp < 3; rp++) {
        var rr = ((t * 9 + rp * 22) % 66) + 6;
        ctx.strokeStyle = hexA(INK, a4((0.25 * (1 - rr / 72)) * ta));
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pcx + rr, pcy);
        ctx.arc(pcx, pcy, rr, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else {
      // Coda: dawn wash, bands of rising light, a tall door of
      // light at the right, motes drifting upward.
      ctx.fillStyle = hexA(DAWN, a4(0.18 * ta));
      ctx.fillRect(0, 0, W, H);
      var bd;
      for (bd = 0; bd < 5; bd++) {
        ctx.fillStyle = hexA(SPOT, a4((0.10 - bd * 0.015) * ta));
        ctx.fillRect(0, H * (0.14 + bd * 0.05), W, H * 0.045);
      }
      var dx0 = W * 0.74, dx1 = W * 0.90, dy0 = H * 0.18, dy1 = H * 0.74;
      ctx.fillStyle = hexA(SPOT, a4(0.14 * ta));
      ctx.fillRect(dx0, dy0, dx1 - dx0, dy1 - dy0);
      ctx.strokeStyle = hexA(INK, a4(0.35 * ta));
      ctx.lineWidth = Math.max(1.5, W * 0.003);
      ctx.strokeRect(dx0, dy0, dx1 - dx0, dy1 - dy0);
      ctx.beginPath();
      ctx.moveTo(0, H * 0.74);
      ctx.lineTo(W, H * 0.74);
      ctx.stroke();
      for (i = 0; i < 22; i++) {
        var ux0 = rng() * W, uy0 = H * 0.20 + rng() * H * 0.60;
        x = ux0 + Math.sin(t * 0.3 + i * 1.4) * W * 0.012;
        y = H * 0.80 - ((uy0 - H * 0.20 + (2 + rng() * 3) * t) % (H * 0.60));
        ctx.fillStyle = hexA(INK, a4((0.14 + rng() * 0.12) * ta));
        ctx.beginPath();
        ctx.moveTo(x + 1.6, y);
        ctx.arc(x, y, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // ---- Text ----------------------------------------------------
  function wrapText(text, maxW) {
    var words = text.split(' ');
    var lines = [], cur = '', i;
    for (i = 0; i < words.length; i++) {
      var trial = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(trial).width > maxW && cur) {
        lines.push(cur);
        cur = words[i];
      } else {
        cur = trial;
      }
    }
    if (cur) { lines.push(cur); }
    return lines;
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var si = sceneIndex;
    var sc = SCENES[si];
    var elapsed = reduced ? 999 : (t - sceneStartT);
    if (elapsed < 0) { elapsed = 0; }
    var ta = tableauAlpha(t);

    // Page ground is the aged paper cream; the stage is the page.
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    drawTableau(t, si, ta);

    // Cream veil over the tableau: the words stay the foreground.
    ctx.fillStyle = hexA(PAPER, a4(0.55));
    ctx.fillRect(0, 0, W, H);

    // Page border: a thin double rule inset from the edge.
    ctx.strokeStyle = hexA(INK, a4(0.35));
    ctx.lineWidth = 1;
    ctx.strokeRect(10.5, 10.5, W - 21, H - 21);
    ctx.strokeStyle = hexA(INK, a4(0.18));
    ctx.strokeRect(14.5, 14.5, W - 29, H - 29);

    // ---- Header: imprint, scene kicker, title, rule.
    var y = L.topY;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    ctx.fillStyle = hexA(INK, a4(0.70));
    ctx.font = '600 ' + L.fsKicker + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(spaced('ZONE6PRESS'), W / 2, y + L.fsKicker);
    y += L.fsKicker + L.fsTitle * 0.55;
    ctx.fillStyle = INK;
    ctx.font = '600 ' + L.fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(sc.kicker, W / 2, y + L.fsTitle * 0.8);
    y += L.fsTitle * 0.8 + L.fsSub * 0.5;
    ctx.fillStyle = hexA(INK, a4(0.85));
    ctx.font = 'italic ' + L.fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(sc.title, W / 2, y + L.fsSub * 0.8);
    y += L.fsSub * 0.8 + H * 0.022;
    ctx.strokeStyle = hexA(INK, a4(0.55));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2 - W * 0.14, y);
    ctx.lineTo(W / 2 + W * 0.14, y);
    ctx.stroke();
    y += H * 0.035;

    // ---- Voice blocks, typed in at reading speed. The block
    // is laid out from the full text, so its position never
    // moves while the lines type in, and it sits centred in
    // the space between the header rule and the footer.
    var typed = typedChars(t);
    var acc = 0, li;
    ctx.textAlign = 'left';
    ctx.font = L.fsBody + 'px Georgia, "Times New Roman", serif';
    var fullWrapped = [];
    var totalH = 0;
    for (li = 0; li < sc.lines.length; li++) {
      var wl = wrapText(sc.lines[li].t, L.textW);
      fullWrapped.push(wl);
      totalH += L.lhLabel + wl.length * L.lhBody + L.lhBody * 0.28;
    }
    var headerBottom = y;
    var footerTop = H - L.fsHint - 44;
    y = headerBottom + Math.max(0, (footerTop - headerBottom - totalH) / 2);
    for (li = 0; li < sc.lines.length; li++) {
      var line = sc.lines[li];
      var show = clamp(typed - acc, 0, line.t.length);
      acc += line.t.length;
      if (show <= 0) { continue; }
      var part = line.t.slice(0, show);
      ctx.font = '600 ' + L.fsLabel + 'px Georgia, "Times New Roman", serif';
      ctx.fillStyle = hexA(INK, a4(0.62));
      ctx.fillText(spaced(line.v), L.mx, y + L.fsLabel);
      y += L.lhLabel;
      ctx.font = L.fsBody + 'px Georgia, "Times New Roman", serif';
      ctx.fillStyle = INK;
      var wrapped = wrapText(part, L.textW);
      var wi;
      for (wi = 0; wi < wrapped.length; wi++) {
        ctx.fillText(wrapped[wi], L.mx, y + L.fsBody * 0.8);
        y += L.lhBody;
      }
      y += L.lhBody * 0.28;
    }

    // ---- Footer: page number and hint.
    var last = (si === SCENES.length - 1);
    var hint = last ? 'The book ends here.' : 'Tap to turn the page.';
    ctx.textAlign = 'center';
    ctx.fillStyle = hexA(INK, a4(0.70));
    ctx.font = L.fsPage + 'px Georgia, "Times New Roman", serif';
    ctx.fillText((si + 1) + ' of ' + SCENES.length, W / 2, H - L.fsHint - 26);
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - L.fsHint - 20, pw = hw + 24, ph = L.fsHint + 12;
    ctx.fillStyle = hexA(PAPERD, a4(0.92));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(INK, a4(0.35));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = INK;
    ctx.fillText(hint, W / 2, H - 14);
    ctx.textAlign = 'left';

    // ---- Page-turn wipe: a paper sheet sweeps right across
    // the page for 0.7 s after each tap, then the new page
    // stands clear. Skipped in reduced motion.
    if (!reduced && elapsed < 0.7) {
      var wx = W * (1 - elapsed / 0.7);
      ctx.fillStyle = PAPER;
      ctx.fillRect(wx, 0, W - wx, H);
      ctx.fillStyle = hexA(PAPERD, a4(0.9));
      ctx.fillRect(wx - 3, 0, 3, H);
      ctx.fillStyle = hexA(INK, a4(0.25));
      ctx.fillRect(wx - 4, 0, 1, H);
    }
  }

  // Tap turns the page: advance one scene in the fixed order.
  // The book ends at the last scene; further taps stay there.
  // Never a reseed, never a reload.
  function advance() {
    if (sceneIndex < SCENES.length - 1) {
      sceneIndex++;
      sceneStartT = lastT;
    }
  }
  if (typeof canvas.addEventListener === 'function') {
    // pointerdown alone: adding a click listener too would turn
    // one tap into two page turns in a real browser.
    canvas.addEventListener('pointerdown', function () { advance(); draw(lastT); });
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1972 exposes the book state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1972 = {
      firstT: FIRST_T,
      scene: function () { return sceneIndex; },
      title: function () { return SCENES[sceneIndex].title; },
      typed: function (t) { return typedChars(t); },
      total: function () { return sceneCharTotal(sceneIndex); },
      tap: function () { advance(); },
      sceneStart: function () { return sceneStartT; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: dust drifts, waves breathe, rain falls, light
  // rises, and the text types in after each page turn. All
  // motion is on multi second timescales, well under the 14 Hz
  // ceiling. Guarded so node-canvas QA (no requestAnimationFrame)
  // works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
