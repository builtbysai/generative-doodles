<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Germany, Retold Plainly</title>
<style>
  html, body { margin: 0; padding: 0; background: #f2ead8; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  /* ---- seeded PRNG (mulberry32), never Math.random ---- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1455000);

  /* ---- palette ---- */
  var PAPER = '#f2ead8', INK = '#1a1a1a';
  var DIRNDL = '#2a7a3a', APRON = '#f2f2ee', LEDER = '#7a5a2a';
  var BEER = '#e8a81a', PRETZEL = '#c88a5a', FOREST = '#3a6a2a';
  var COTTAGE = '#efe8d8', ROOF = '#b84a1a', BRASS = '#c88a2a', SKY = '#d8e8e8';
  var SKIN = '#e8c8a8';

  /* ---- viewport ---- */
  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.round(W); canvas.height = Math.round(H);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var minScreen = 99999;
    if (typeof window !== 'undefined' && window.screen) {
      minScreen = Math.min(window.screen.width, window.screen.height);
    }
    phone = minScreen < 700 || (H > W * 1.15 && minScreen >= 700 && W < 700);
  }
  size();
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', size);
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', size);
    }
  }

  /* ---- helpers (node-canvas safe: no gradients, no shadowBlur, no Path2D) ---- */
  function a4(x) { return Math.round(x * 10000) / 10000; }
  function rect(x, y, w, h, fill, stroke) {
    ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
    if (stroke) { ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, S * 0.02); ctx.strokeRect(x + 0.5, y + 0.5, w, h); }
  }
  function dot(x, y, r, fill) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
  }
  function line(x1, y1, x2, y2, wdt, col) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = col || INK; ctx.lineWidth = wdt; ctx.stroke();
  }
  function poly(pts, fill) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, S * 0.02); ctx.stroke();
  }
  function ellipse(x, y, rx, ry, fill, strokeIt) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
    if (strokeIt) { ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, S * 0.02); ctx.stroke(); }
  }
  function head(x, y, r) {
    dot(x, y, r, SKIN);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, S * 0.02); ctx.stroke();
    dot(x - r * 0.35, y - r * 0.1, Math.max(1, r * 0.09), INK);
    dot(x + r * 0.35, y - r * 0.1, Math.max(1, r * 0.09), INK);
  }

  /* scene box: centered, ~70% of frame height */
  var S = 100;
  function box() {
    var bh = H * 0.7;
    var bw = Math.min(W * (phone ? 0.92 : 0.8), bh * 1.5);
    return { x: (W - bw) / 2, y: (H - bh) / 2, w: bw, h: bh };
  }

  /* ---- seeded leaf drift data (forest scene) ---- */
  var leaves = [];
  for (var li = 0; li < 12; li++) {
    leaves.push({
      x: rng(), y: rng(), s: 0.5 + rng(), ph: rng() * Math.PI * 2, sp: 0.6 + rng() * 0.8
    });
  }

  /* ---- scene drawings: drawScene(i, b, t) ---- */
  function sceneOktoberfest(b, t) {
    var u = b.h / 100;
    S = u;
    /* ground band inside scene */
    rect(b.x, b.y + b.h * 0.62, b.w, b.h * 0.38, '#d8c8a8', false);
    /* table */
    var ty = b.y + b.h * 0.62;
    rect(b.x + b.w * 0.18, ty, b.w * 0.64, b.h * 0.05, LEDER, true);
    line(b.x + b.w * 0.24, ty + b.h * 0.05, b.x + b.w * 0.24, ty + b.h * 0.22, u * 1.5);
    line(b.x + b.w * 0.76, ty + b.h * 0.05, b.x + b.w * 0.76, ty + b.h * 0.22, u * 1.5);
    /* dancer: dirndl, apron, stepping */
    var step = Math.sin(t * Math.PI * 2 / 2.4) * b.h * 0.02;
    var dx = b.x + b.w * 0.5, dy = b.y + b.h * 0.30 + step;
    head(dx, dy - b.h * 0.16, b.h * 0.055);
    /* hair: two side dots */
    dot(dx - b.h * 0.05, dy - b.h * 0.19, b.h * 0.02, '#5a3418');
    dot(dx + b.h * 0.05, dy - b.h * 0.19, b.h * 0.02, '#5a3418');
    /* bodice + skirt */
    poly([[dx - b.w * 0.05, dy - b.h * 0.10], [dx + b.w * 0.05, dy - b.h * 0.10],
          [dx + b.w * 0.11, dy + b.h * 0.16], [dx - b.w * 0.11, dy + b.h * 0.16]], DIRNDL);
    poly([[dx - b.w * 0.035, dy - b.h * 0.08], [dx + b.w * 0.035, dy - b.h * 0.08],
          [dx + b.w * 0.05, dy + b.h * 0.14], [dx - b.w * 0.05, dy + b.h * 0.14]], APRON);
    /* raised arms */
    line(dx - b.w * 0.05, dy - b.h * 0.08, dx - b.w * 0.12, dy - b.h * 0.20, u * 2);
    line(dx + b.w * 0.05, dy - b.h * 0.08, dx + b.w * 0.12, dy - b.h * 0.20, u * 2);
    /* mugs lift in turn */
    var lift1 = Math.max(0, Math.sin(t * Math.PI * 2 / 5)) * b.h * 0.03;
    var lift2 = Math.max(0, Math.sin(t * Math.PI * 2 / 5 + Math.PI)) * b.h * 0.03;
    mug(b.x + b.w * 0.26, ty - b.h * 0.10 - lift1);
    mug(b.x + b.w * 0.68, ty - b.h * 0.10 - lift2);
    /* pretzels on the table */
    pretzel(b.x + b.w * 0.40, ty - b.h * 0.045);
    pretzel(b.x + b.w * 0.56, ty - b.h * 0.045);
  }
  function mug(x, y) {
    var mw = S * 9, mh = S * 11;
    rect(x, y, mw, mh, BEER, true);
    rect(x, y - mh * 0.18, mw, mh * 0.18, APRON, true);
    ctx.beginPath(); ctx.moveTo(x + mw, y + mh * 0.25); ctx.lineTo(x + mw * 1.35, y + mh * 0.25);
    ctx.lineTo(x + mw * 1.35, y + mh * 0.75); ctx.lineTo(x + mw, y + mh * 0.75);
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, S * 0.02); ctx.stroke();
  }
  function pretzel(x, y) {
    var r = S * 4;
    dot(x - r * 0.7, y, r * 0.8, PRETZEL);
    dot(x + r * 0.7, y, r * 0.8, PRETZEL);
    dot(x, y - r * 0.5, r * 0.7, PRETZEL);
    ctx.beginPath(); ctx.arc(x - r * 0.7, y, r * 0.8, 0, Math.PI * 2);
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, S * 0.015); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + r * 0.7, y, r * 0.8, 0, Math.PI * 2); ctx.stroke();
  }
  function tree(x, y, s) {
    line(x, y, x, y - s * 0.35, s * 0.08, '#7a5a2a');
    poly([[x - s * 0.28, y - s * 0.30], [x + s * 0.28, y - s * 0.30], [x, y - s * 0.95]], FOREST);
    poly([[x - s * 0.22, y - s * 0.55], [x + s * 0.22, y - s * 0.55], [x, y - s * 1.1]], FOREST);
  }
  function sceneForest(b, t) {
    var u = b.h / 100;
    S = u;
    rect(b.x, b.y, b.w, b.h * 0.62, SKY, false);
    rect(b.x, b.y + b.h * 0.62, b.w, b.h * 0.38, '#c8b898', false);
    /* path */
    poly([[b.x + b.w * 0.42, b.y + b.h], [b.x + b.w * 0.58, b.y + b.h],
          [b.x + b.w * 0.52, b.y + b.h * 0.62], [b.x + b.w * 0.48, b.y + b.h * 0.62]], '#e8dcc0');
    /* cottage */
    var cx = b.x + b.w * 0.58, cy = b.y + b.h * 0.62;
    rect(cx - b.w * 0.13, cy - b.h * 0.26, b.w * 0.26, b.h * 0.26, COTTAGE, true);
    poly([[cx - b.w * 0.16, cy - b.h * 0.26], [cx + b.w * 0.16, cy - b.h * 0.26], [cx, cy - b.h * 0.44]], ROOF);
    rect(cx - b.w * 0.03, cy - b.h * 0.14, b.w * 0.06, b.h * 0.14, LEDER, true);
    rect(cx - b.w * 0.10, cy - b.h * 0.22, b.w * 0.05, b.h * 0.07, SKY, true);
    rect(cx + b.w * 0.05, cy - b.h * 0.22, b.w * 0.05, b.h * 0.07, SKY, true);
    /* trees */
    tree(b.x + b.w * 0.14, b.y + b.h * 0.66, b.h * 0.34);
    tree(b.x + b.w * 0.28, b.y + b.h * 0.70, b.h * 0.26);
    tree(b.x + b.w * 0.86, b.y + b.h * 0.66, b.h * 0.36);
    /* drifting leaves: closed-form fall + sway */
    for (var i = 0; i < leaves.length; i++) {
      var L = leaves[i];
      var fall = ((t * 0.05 * L.sp + L.y) % 1);
      var lx = b.x + ((L.x + Math.sin(t * 0.9 + L.ph) * 0.02) % 1) * b.w;
      var ly = b.y + fall * b.h * 0.9;
      rect(lx, ly, S * 1.6, S * 1.1, FOREST, false);
    }
  }
  function sceneBrass(b, t) {
    var u = b.h / 100;
    S = u;
    rect(b.x, b.y + b.h * 0.62, b.w, b.h * 0.38, '#d8c8a8', false);
    var fx = b.x + b.w * 0.5, fy = b.y + b.h * 0.34;
    /* figure: white shirt, brown trousers */
    head(fx - b.w * 0.02, fy - b.h * 0.22, b.h * 0.055);
    dot(fx - b.w * 0.02 - b.h * 0.045, fy - b.h * 0.25, b.h * 0.015, INK); /* cap */
    rect(fx - b.w * 0.07, fy - b.h * 0.16, b.w * 0.10, b.h * 0.18, APRON, true);
    rect(fx - b.w * 0.06, fy + b.h * 0.02, b.w * 0.045, b.h * 0.20, LEDER, true);
    rect(fx + b.w * 0.015, fy + b.h * 0.02, b.w * 0.045, b.h * 0.20, LEDER, true);
    /* tuba held to the right, bell pulses */
    var pulse = 1 + 0.06 * Math.sin(t * Math.PI * 2 / 2);
    var tx = fx + b.w * 0.10, ty2 = fy - b.h * 0.10;
    ellipse(tx + b.w * 0.06, ty2 - b.h * 0.08, b.w * 0.055 * pulse, b.h * 0.075 * pulse, BRASS, true);
    ellipse(tx + b.w * 0.02, ty2 + b.h * 0.08, b.w * 0.045, b.h * 0.10, BRASS, true);
    line(tx - b.w * 0.02, ty2 + b.h * 0.02, fx + b.w * 0.03, fy - b.h * 0.10, u * 2);
    /* music puffs: small flat-alpha dots, no text */
    var puffA = a4(0.25 + 0.15 * Math.sin(t * Math.PI * 2 / 2));
    ctx.globalAlpha = puffA;
    dot(tx + b.w * 0.13, ty2 - b.h * 0.16, S * 1.8, BRASS);
    ctx.globalAlpha = 1;
  }
  var scenes = [sceneOktoberfest, sceneForest, sceneBrass];

  /* ---- timeline: 5 s hold + 1.2 s wipe per scene, 18.6 s cycle ---- */
  var HOLD = 5, WIPE = 1.2, STEP = HOLD + WIPE, CYCLE = STEP * 3;
  function timeline(t) {
    var ph = t % CYCLE;
    var idx = Math.floor(ph / STEP);
    var local = ph - idx * STEP;
    if (local < HOLD) return { from: idx, to: idx, p: 0 };
    return { from: idx, to: (idx + 1) % 3, p: (local - HOLD) / WIPE };
  }

  /* ---- drag state: recorded events, closed-form tweens ---- */
  var drag = null;        /* {x0, dx, scene} while dragging */
  var tween = null;       /* {fromScene, toScene, fromOff, toOff, start, dur} */
  var frozen = null;      /* {scene, t0} snapshot while dragging */
  var baseTime = 0;       /* timeline offset so drags don't jump the timer */
  var timeOffset = 0;     /* accumulated shift from completed drags */

  function effTime(t) { return t + timeOffset; }

  canvas.addEventListener('pointerdown', function (e) {
    var tl = timeline(effTime(clockNow()));
    drag = { x0: e.clientX, dx: 0, scene: tl.from };
    frozen = { scene: tl.from };
    tween = null;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.dx = e.clientX - drag.x0;
  });
  function endDrag() {
    if (!drag) return;
    var b = box();
    var th = b.w * 0.3;
    var target = drag.scene;
    var dir = 0;
    if (drag.dx > th) { target = (drag.scene + 1) % 3; dir = 1; }
    else if (drag.dx < -th) { target = (drag.scene + 2) % 3; dir = -1; }
    if (dir !== 0) {
      tween = { fromScene: drag.scene, toScene: target, fromOff: drag.dx, toOff: dir * b.w, start: clockNow(), dur: 0.6 };
      /* shift the timeline so the timer resumes on the new scene */
      var now = effTime(clockNow());
      var cur = timeline(now);
      var want = target;
      /* set offset so that timeline(now) lands at the start of `want`'s hold */
      var ph = now % CYCLE;
      var targetPhase = want * STEP;
      timeOffset += (targetPhase - ph);
    } else {
      tween = { fromScene: drag.scene, toScene: drag.scene, fromOff: drag.dx, toOff: 0, start: clockNow(), dur: 0.4 };
    }
    drag = null; frozen = null;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  /* ---- clock ---- */
  var startMs = null, bootDone = false;
  function clockNow() {
    if (startMs === null) return 0;
    return (performance.now() - startMs) / 1000;
  }

  function draw(t) {
    size();
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
    var b = box();
    S = b.h / 100;
    ctx.save();
    ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();

    var from, to, off;
    if (drag) {
      /* scrub: current scene shifts with finger, neighbour enters */
      var d = drag.dx;
      var next = d > 0 ? (drag.scene + 1) % 3 : (drag.scene + 2) % 3;
      ctx.save(); ctx.translate(-d, 0); scenes[drag.scene](b, t); ctx.restore();
      /* neighbour offset so its edge tracks the finger */
      ctx.save();
      if (d > 0) ctx.translate(b.w - d, 0); else ctx.translate(-b.w - d, 0);
      scenes[next](b, t);
      ctx.restore();
    } else if (tween) {
      var tp = (clockNow() - tween.start) / tween.dur;
      if (tp >= 1) {
        tween = null;
        var tl2 = timeline(effTime(t));
        scenes[tl2.from](b, t);
      } else {
        var e = tp < 0.5 ? 2 * tp * tp : 1 - Math.pow(-2 * tp + 2, 2) / 2;
        var cur = tween.fromOff + (tween.toOff - tween.fromOff) * e;
        ctx.save(); ctx.translate(-cur, 0); scenes[tween.fromScene](b, t); ctx.restore();
        ctx.save();
        if (tween.toOff > 0) ctx.translate(b.w - cur, 0); else ctx.translate(-b.w - cur, 0);
        scenes[tween.toScene](b, t);
        ctx.restore();
      }
    } else {
      var tl = timeline(effTime(t));
      if (tl.p === 0) {
        scenes[tl.from](b, t);
      } else {
        var p = tl.p;
        ctx.save(); ctx.translate(-p * b.w, 0); scenes[tl.from](b, t); ctx.restore();
        ctx.save(); ctx.translate((1 - p) * b.w, 0); scenes[tl.to](b, t); ctx.restore();
      }
    }
    ctx.restore();
  }

  /* frame one = draw(0) at constant phase, then the rAF loop */
  draw(0);
  bootDone = true;
  if (typeof requestAnimationFrame !== 'undefined') {
    startMs = performance.now();
    (function loop() {
      draw(clockNow());
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
