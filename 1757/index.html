<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twelve Months, Twelve Speakers</title>
<style>
html, body { margin: 0; padding: 0; background: #241A15; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#241A15';
var GROUND_DEEP = '#1B130F';
var FLOOR = '#2E211A';
var CONCRETE = '#8C857C';
var CONCRETE_DARK = '#6E6860';
var CONCRETE_LIGHT = '#A8A199';
var SPEAKER = '#17130F';
var SPEAKER_LIGHT = '#2A241E';
var RIM = '#3A332C';
var RING = '#55504A';
var CAP = '#0C0A08';
var WIRE = '#7A6248';
var WIRE_FAINT = 'rgba(122,98,72,0.9)';
var AMBER = '#FFAA3C';
var LABEL_INK = '#B9B0A4';
var PLATE = '#E9DCC4';
var PLATE_LINE = 'rgba(122,82,51,0.7)';
var TITLE_INK = '#2E2417';
var HINT_INK = '#6B5636';
var FRAME_T = 60.0;
var LOOP = 60.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- driver: the year itself, read as movement. Twelve speakers arc
   left to right, months 1 to 12, each with a FIXED amplitude from the
   data table below: quiet winter months barely move, the summer peak
   shakes its cylinder. A 60 s loop carries one slow wave of attention
   across the year; every value is a closed-form function of piece
   time, never random, never re-rolled. ---- */
var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
var AMP = [0.22, 0.18, 0.34, 0.42, 0.55, 0.78, 0.92, 0.86, 0.64, 0.48, 0.30, 0.24];
var SPEAKERS = [];
(function () {
  var i;
  for (i = 0; i < 12; i++) {
    SPEAKERS.push({
      i: i,
      x: 0.06 + 0.88 * (i / 11),
      arc: Math.sin(Math.PI * (i / 11)),
      amp: AMP[i],
      vib: 0.09 + 0.0035 * ((i * 5) % 12),
      vib2: 0.11 + 0.003 * ((i * 7) % 12),
      ph1: i * 1.7,
      ph2: i * 2.3 + 0.8
    });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Year position u in [0,1): the loop is offset so that at the fixed
   frame-one phase t = 60 s the wave sits on July (month 7, amp 0.92),
   mid-swell. Envelope e is a smooth bump centred on each speaker's
   own month slot; every speaker keeps a 0.30 floor so the whole year
   stays faintly alive even off-peak. */
function yearU(t) { return (((t + 30) % LOOP) + LOOP) % LOOP / LOOP; }
function envelope(sp, t) {
  var u = yearU(t);
  var c = 0.5 + 0.5 * Math.cos(TAU * (u - sp.i / 12));
  return 0.30 + 0.70 * Math.pow(c, 3);
}
function speakerGeom(sp, t) {
  var s = Math.min(VW, VH);
  var spacing = 0.88 * VW / 11;
  var r = Math.min(0.048 * s, spacing * 0.44);
  var cx = sp.x * VW;
  var cy = (0.72 - 0.07 * sp.arc) * VH;
  var e = envelope(sp, t);
  var a = sp.amp * e;
  var sh1 = Math.sin(TAU * (t / sp.vib) + sp.ph1);
  var sh2 = Math.cos(TAU * (t / sp.vib2) + sp.ph2);
  var dx = r * 0.07 * a * sh2;
  var dy = r * 0.06 * a * sh1;
  return { cx: cx + dx, cy: cy + dy, r: r, e: e, a: a, sh1: sh1, sh2: sh2, dx: dx, dy: dy };
}
function floorY() { return 0.86 * VH; }
function drawFloor(t) {
  var fy = floorY();
  ctx.fillStyle = FLOOR;
  ctx.fillRect(0, fy, VW, VH - fy);
  ctx.fillStyle = GROUND_DEEP;
  ctx.fillRect(0, fy, VW, 2);
}
function drawWires(t) {
  var fy = floorY();
  var s = Math.min(VW, VH);
  var i, sp, g, prevX = null, prevY = null;
  ctx.strokeStyle = WIRE_FAINT;
  ctx.lineWidth = Math.max(s * 0.002, 1);
  for (i = 0; i < SPEAKERS.length; i++) {
    sp = SPEAKERS[i];
    g = speakerGeom(sp, t);
    var bx = g.cx, by = fy + (s * 0.012) * Math.sin(i * 1.3 + 0.5);
    if (prevX !== null) {
      ctx.beginPath();
      ctx.moveTo(prevX, prevY);
      ctx.quadraticCurveTo((prevX + bx) / 2, fy + s * 0.035 * Math.sin(i * 2.1), bx, by);
      ctx.stroke();
    }
    /* a short slack loop dropping from each cylinder base */
    ctx.beginPath();
    ctx.moveTo(bx - g.r * 0.4, fy);
    ctx.quadraticCurveTo(bx - g.r * 0.1, fy + s * 0.03, bx + g.r * 0.35, fy + s * 0.008);
    ctx.stroke();
    prevX = bx; prevY = by;
  }
  /* one long trace running off the right edge */
  ctx.beginPath();
  ctx.moveTo(prevX, prevY);
  ctx.quadraticCurveTo(prevX + VW * 0.03, fy + s * 0.04, VW, fy + s * 0.015);
  ctx.stroke();
}
function drawHalo(g) {
  var gr = g.r * (1.9 + 1.1 * g.a);
  var peak = 0.06 + 0.42 * g.a;
  var grad = ctx.createRadialGradient(g.cx, g.cy, 0, g.cx, g.cy, gr);
  grad.addColorStop(0, 'rgba(255,170,60,' + peak.toFixed(4) + ')');
  grad.addColorStop(0.55, 'rgba(255,170,60,' + (peak * 0.35).toFixed(4) + ')');
  grad.addColorStop(1, 'rgba(255,170,60,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(g.cx + gr, g.cy);
  ctx.arc(g.cx, g.cy, gr, 0, TAU);
  ctx.fill();
}
function drawCylinder(sp, g) {
  var s = Math.min(VW, VH);
  var fy = floorY();
  var topY = g.cy + g.r * 0.45;
  var cw = g.r * (isPhone ? 0.92 : 1.15);
  var x0 = g.cx - cw, x1 = g.cx + cw;
  /* body: raw concrete grey with a darker weathered edge */
  var grad = ctx.createLinearGradient(x0, 0, x1, 0);
  grad.addColorStop(0, CONCRETE_DARK);
  grad.addColorStop(0.5, CONCRETE);
  grad.addColorStop(1, CONCRETE_DARK);
  ctx.fillStyle = grad;
  ctx.fillRect(x0, topY, cw * 2, fy - topY);
  /* top face: pale ellipse the speaker sits on */
  ctx.fillStyle = CONCRETE_LIGHT;
  ctx.beginPath();
  ctx.moveTo(g.cx + cw, topY);
  ctx.ellipse(g.cx, topY, cw, Math.max(s * 0.006, 2.5), 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(CONCRETE_DARK, 0.8);
  ctx.lineWidth = Math.max(s * 0.0015, 0.7);
  ctx.beginPath();
  ctx.moveTo(g.cx + cw, topY);
  ctx.ellipse(g.cx, topY, cw, Math.max(s * 0.006, 2.5), 0, 0, TAU);
  ctx.stroke();
  /* one faint horizontal form line on the concrete */
  ctx.strokeStyle = rgba(CONCRETE_DARK, 0.55);
  ctx.lineWidth = Math.max(s * 0.0012, 0.6);
  ctx.beginPath();
  ctx.moveTo(x0 + 2, topY + (fy - topY) * 0.55);
  ctx.lineTo(x1 - 2, topY + (fy - topY) * 0.55);
  ctx.stroke();
}
function drawSpeaker(sp, g) {
  var s = Math.min(VW, VH);
  var cx = g.cx, cy = g.cy, r = g.r;
  /* soft shadow where the speaker meets the cylinder */
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.9, cy + r * 0.55);
  ctx.ellipse(cx, cy + r * 0.55, r * 0.9, r * 0.22, 0, 0, TAU);
  ctx.fill();
  /* bare black cone */
  var grad = ctx.createRadialGradient(cx - r * 0.25, cy - r * 0.3, r * 0.1, cx, cy, r);
  grad.addColorStop(0, SPEAKER_LIGHT);
  grad.addColorStop(0.6, SPEAKER);
  grad.addColorStop(1, CAP);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.fill();
  /* outer rim */
  ctx.strokeStyle = RIM;
  ctx.lineWidth = Math.max(s * 0.004, 1.5);
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r - ctx.lineWidth / 2, 0, TAU);
  ctx.stroke();
  /* surround rings */
  var i;
  for (i = 1; i <= 2; i++) {
    var rr = r * (0.86 - 0.14 * (i - 1));
    ctx.strokeStyle = rgba(RING, 0.55);
    ctx.lineWidth = Math.max(s * 0.002, 0.8);
    ctx.beginPath();
    ctx.moveTo(cx + rr, cy);
    ctx.arc(cx, cy, rr, 0, TAU);
    ctx.stroke();
  }
  /* trembling membrane: ellipse breathing on the per-speaker vibration,
     scaled by the month's fixed amplitude and the year envelope */
  var mr = r * 0.62 * (1 + 0.10 * g.a * g.sh1);
  var mgrad = ctx.createRadialGradient(cx - mr * 0.2, cy - mr * 0.25, mr * 0.1, cx, cy, mr);
  mgrad.addColorStop(0, SPEAKER_LIGHT);
  mgrad.addColorStop(1, SPEAKER);
  ctx.fillStyle = mgrad;
  ctx.beginPath();
  ctx.moveTo(cx + mr, cy);
  ctx.ellipse(cx, cy, mr, mr * (0.94 + 0.05 * g.a * g.sh2), 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(RING, 0.6);
  ctx.lineWidth = Math.max(s * 0.0018, 0.7);
  ctx.beginPath();
  ctx.moveTo(cx + mr, cy);
  ctx.ellipse(cx, cy, mr, mr * (0.94 + 0.05 * g.a * g.sh2), 0, 0, TAU);
  ctx.stroke();
  /* dust cap */
  var cr = r * 0.22 * (1 + 0.05 * g.a * g.sh1);
  ctx.fillStyle = CAP;
  ctx.beginPath();
  ctx.moveTo(cx + cr, cy);
  ctx.arc(cx, cy, cr, 0, TAU);
  ctx.fill();
  ctx.fillStyle = rgba(SPEAKER_LIGHT, 0.5);
  ctx.beginPath();
  ctx.moveTo(cx + cr * 0.5, cy - cr * 0.4);
  ctx.arc(cx - cr * 0.15, cy - cr * 0.2, cr * 0.45, 0, TAU);
  ctx.fill();
}
function drawLabel(sp, g) {
  var s = Math.min(VW, VH);
  var px = isPhone ? 8 : 11;
  ctx.font = px + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = LABEL_INK;
  ctx.fillText(MONTHS[sp.i], g.cx, floorY() + Math.max(s * 0.008, 4));
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Twelve Months, Twelve Speakers').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Twelve Months, Twelve Speakers').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 03').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Twelve Months, Twelve Speakers', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 03', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawFloor(phaseT);
  drawWires(phaseT);
  var i, sp, g;
  for (i = 0; i < SPEAKERS.length; i++) {
    sp = SPEAKERS[i];
    g = speakerGeom(sp, phaseT);
    drawHalo(g);
  }
  for (i = 0; i < SPEAKERS.length; i++) {
    sp = SPEAKERS[i];
    g = speakerGeom(sp, phaseT);
    drawCylinder(sp, g);
    drawSpeaker(sp, g);
  }
  for (i = 0; i < SPEAKERS.length; i++) {
    sp = SPEAKERS[i];
    g = speakerGeom(sp, phaseT);
    drawLabel(sp, g);
  }
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    speakerCount: function () { return SPEAKERS.length; },
    amplitude: function (i) { return AMP[i]; },
    envelope: function (i, t) { return envelope(SPEAKERS[i], t); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, year wave on July ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
