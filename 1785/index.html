<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seven Notes, Six Notes</title>
<style>
html, body { margin: 0; padding: 0; background: #ffffff; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#ffffff';
var GRAPHITE = '#4a4842';
var GRAPHITE_SOFT = 'rgba(74,72,66,0.55)';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, playhead mid-grid, row 9 blooming */
var ROWS = 18;
var COLS = 7;
var BAND_ROWS = 6;
var ROW_DUR = 20 / 3; /* seconds per row; full pass 120 s */
var PHASE_OFF = 0.62; /* playhead sits 0.62 down the current row at frame one */
var CYCLE = ROWS * ROW_DUR; /* 120 s */
var DEEPEN_DUR = 15.0; /* seconds a crossed cell stays deepened */
var PULSE_DUR = 2.0; /* seconds a crossed dot pulses */
var TILT = -0.026; /* radians; about -1.5 degrees, sheet held by hand */
var PALETTE = ['#E23B2E', '#F07A1E', '#F2C200', '#3D9E4D', '#2F6FD0', '#7B4BA6', '#E85D9E'];
var BAND = '#ffb042'; /* warm highlight for the playhead band */
var PLATE_FILL = '#ffffff';
var PLATE_LINE = 'rgba(0,0,0,0.28)';
var PLATE_INK = '#2b2b28';
var HINT_INK = '#2b2b28';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* hex colour to [r,g,b] */
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function mix(a, b, f) {
  var ca = rgb(a), cb = rgb(b);
  return 'rgb(' + Math.round(ca[0] + (cb[0] - ca[0]) * f) + ',' +
    Math.round(ca[1] + (cb[1] - ca[1]) * f) + ',' +
    Math.round(ca[2] + (cb[2] - ca[2]) * f) + ')';
}
function shade(hex, f) { /* darken toward black by f; returns a hex string */
  var c = rgb(hex);
  var r = Math.round(c[0] * (1 - f)), g = Math.round(c[1] * (1 - f)), b = Math.round(c[2] * (1 - f));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function colsForRow(r) { return (r >= 6 && r < 12) ? 6 : 7; }
/* Grid table: fixed authored table from seed 1785, one per cycle.
   Per cell, in row-major order: one stream value picks the palette colour,
   then eight values jitter the four corners (-1..1, scaled to 4.5% of cell size).
   Arrow wobbles continue the same stream after the grid. */
var GRID = [];
var ARROW_J = [];
(function buildGrid() {
  var rng = mulberry32(1785);
  var r, c, k;
  for (r = 0; r < ROWS; r++) {
    var row = [];
    var ncols = colsForRow(r);
    for (c = 0; c < ncols; c++) {
      var ci = Math.floor(rng() * 7);
      var j = [];
      for (k = 0; k < 8; k++) j.push(rng() * 2 - 1);
      row.push({ ci: ci, j: j });
    }
    GRID.push(row);
  }
  for (k = 0; k < 12; k++) ARROW_J.push(rng() * 2 - 1);
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var dragOff = 0; /* bounded playhead offset in rows, from vertical drag; 0 at frame one */
var dragging = false, dragStartY = 0, dragStartOff = 0;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
var G = { x: 0, y: 0, w: 0, h: 0, cw: 0, ch: 0 }; /* grid rect + cell size */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
  var lm = 0.085 * F.w, tm = 0.075 * F.h, rm = 0.02 * F.w, bm = 0.045 * F.h;
  G.x = F.x + lm; G.y = F.y + tm;
  G.w = F.w - lm - rm; G.h = F.h - tm - bm;
  G.cw = G.w / COLS; G.ch = G.h / ROWS;
}
/* Playhead position in row units, 0..18: closed form of piece time plus the
   bounded drag offset. At t = 60 s, drag 0: 60 / (20/3) + 0.62 = 9.62, so the
   band sits 0.62 down row 9, mid-grid. */
function playheadFrac(t) {
  var f = (t / ROW_DUR + PHASE_OFF + dragOff) % ROWS;
  if (f < 0) f += ROWS;
  return f;
}
function currentRow(t) { return Math.floor(playheadFrac(t)); }
/* Seconds since the playhead centre last crossed the centre of row r. */
function sinceCross(r, t) {
  var frac = playheadFrac(t);
  var dRows = (frac - (r + 0.5) + ROWS) % ROWS;
  return dRows * ROW_DUR;
}
function cellRect(r, c) {
  var ncols = colsForRow(r);
  var x0 = G.x + (c + (ncols < COLS ? 0.5 : 0)) * G.cw;
  var y0 = G.y + r * G.ch;
  return { x0: x0, y0: y0, ncols: ncols };
}
function drawCell(r, c, t) {
  var cell = GRID[r][c];
  var rc = cellRect(r, c);
  var jx = 0.045 * G.cw, jy = 0.045 * G.ch;
  var j = cell.j;
  var x0 = rc.x0, y0 = rc.y0, x1 = x0 + G.cw, y1 = y0 + G.ch;
  var dt = sinceCross(r, t);
  var deepen = dt < DEEPEN_DUR ? 1 - dt / DEEPEN_DUR : 0;
  var base = PALETTE[cell.ci];
  var fill = deepen > 0 ? mix(base, shade(base, 0.45), 0.55 * deepen) : base;
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(x0 + j[0] * jx, y0 + j[1] * jy);
  ctx.lineTo(x1 + j[2] * jx, y0 + j[3] * jy);
  ctx.lineTo(x1 + j[4] * jx, y1 + j[5] * jy);
  ctx.lineTo(x0 + j[6] * jx, y1 + j[7] * jy);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(60,58,52,0.28)';
  ctx.lineWidth = Math.max(1, 0.0015 * Math.min(G.w, G.h));
  ctx.stroke();
  /* centre dot: deepened shade of the cell colour, pulsing once on crossing */
  var pulse = 0;
  if (dt < PULSE_DUR) {
    pulse = dt < 0.3 ? dt / 0.3 : Math.max(0, 1 - (dt - 0.3) / 1.7);
  }
  var cx = x0 + G.cw / 2, cy = y0 + G.ch / 2;
  var dotR = 0.11 * Math.min(G.cw, G.ch) * (1 + 0.9 * pulse);
  ctx.fillStyle = shade(base, 0.45);
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(1.5, dotR), 0, TAU);
  ctx.fill();
}
function drawBand(t) {
  var frac = playheadFrac(t);
  var cy = G.y + frac * G.ch;
  var top = cy - 0.95 * G.ch, h = 1.9 * G.ch;
  var grad = ctx.createLinearGradient(0, top, 0, top + h);
  grad.addColorStop(0, rgba(BAND, 0));
  grad.addColorStop(0.25, rgba(BAND, 0.30));
  grad.addColorStop(0.5, rgba(BAND, 0.34));
  grad.addColorStop(0.75, rgba(BAND, 0.30));
  grad.addColorStop(1, rgba(BAND, 0));
  ctx.fillStyle = grad;
  ctx.fillRect(G.x - 4, top, G.w + 8, h);
}
function drawArrow(x0, y0, x1, y1, wob) {
  var mx = (x0 + x1) / 2, my = (y0 + y1) / 2 + wob * 3;
  ctx.strokeStyle = GRAPHITE_SOFT;
  ctx.lineWidth = Math.max(1, 0.0022 * Math.min(G.w, G.h));
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(mx, my, x1, y1);
  ctx.stroke();
  /* arrowhead */
  var ang = Math.atan2(y1 - my, x1 - mx);
  var ah = Math.max(5, 0.012 * Math.min(G.w, G.h));
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - ah * Math.cos(ang - 0.45), y1 - ah * Math.sin(ang - 0.45));
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - ah * Math.cos(ang + 0.45), y1 - ah * Math.sin(ang + 0.45));
  ctx.stroke();
}
function drawLabels(t) {
  var labels = ['7 notes', '6 notes', '7 notes'];
  var cur = currentRow(t);
  var curBand = Math.floor(cur / BAND_ROWS);
  var fs = isPhone ? 13 : 15;
  ctx.font = 'italic ' + fs + 'px Georgia, "Times New Roman", serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  var b, cy, jig;
  for (b = 0; b < 3; b++) {
    cy = G.y + (b * BAND_ROWS + BAND_ROWS / 2) * G.ch;
    jig = 0;
    if (b === curBand) jig = 1.6 * Math.sin(TAU * t * 2.5 + b * 1.7);
    var ax0 = F.x + 8, ax1 = G.x - 8;
    ctx.fillStyle = GRAPHITE;
    ctx.fillText(labels[b], ax0, cy + jig - fs - 2);
    drawArrow(ax0 + 4, cy + jig, ax1, cy + jig, ARROW_J[b * 2]);
  }
  /* "Top" arrow above the grid, pointing down; set toward the right end so
     it never sits under the title plate on narrow phones */
  var tx = G.x + G.w * 0.85;
  var ty0 = G.y - Math.max(26, 0.038 * F.h);
  var ty1 = G.y - 6;
  ctx.fillStyle = GRAPHITE;
  ctx.fillText('Top', tx - 14, ty0 - 4);
  ctx.save();
  ctx.translate(tx, ty0);
  ctx.rotate(Math.PI / 2);
  drawArrow(0, 0, ty1 - ty0, 0, ARROW_J[8]);
  ctx.restore();
}
function drawGrid(t) {
  var r, c;
  ctx.save();
  ctx.translate(F.x + F.w / 2, F.y + F.h / 2);
  ctx.rotate(TILT);
  ctx.translate(-(F.x + F.w / 2), -(F.y + F.h / 2));
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < colsForRow(r); c++) drawCell(r, c, t);
  }
  drawBand(t);
  drawLabels(t);
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Seven Notes, Six Notes').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Seven Notes, Six Notes').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 01').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Seven Notes, Six Notes', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 01', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to conduct.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawGrid(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    frac: function () { return playheadFrac(phaseT); },
    currentRow: function () { return currentRow(phaseT); },
    dragOff: function () { return dragOff; }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
function pluck() {
  try {
    if (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined') {
      var AC = typeof AudioContext !== 'undefined' ? AudioContext : webkitAudioContext;
      var ac = new AC();
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.frequency.value = 196 * Math.pow(2, (currentRow(phaseT) % 12) / 12);
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.04, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 1.5);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + 1.6);
    }
  } catch (e) { /* audio is optional; the piece works fully muted */ }
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragStartY = (e && typeof e.clientY === 'number') ? e.clientY : 0;
    dragStartOff = dragOff;
    pluck();
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging || !e || typeof e.clientY !== 'number') return;
    dragOff = clamp(dragStartOff + (e.clientY - dragStartY) / G.ch, -3, 3);
  });
  window.addEventListener('pointerup', function () { dragging = false; });
  window.addEventListener('pointercancel', function () { dragging = false; });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      if (!dragging && Math.abs(dragOff) > 0.001) {
        dragOff += (0 - dragOff) * (1 - Math.exp(-dt / 8));
        if (Math.abs(dragOff) < 0.001) dragOff = 0;
      }
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
