<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№9046 · The Copy Relay</title>
<style>
  html, body { margin: 0; padding: 0; background: #e9e4d8; }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #stage { position: relative; }
  canvas { display: block; }
  .cap { font-family: Georgia, 'Times New Roman', serif; font-style: italic;
         color: #4a4438; text-align: center; padding: 14px 20px 26px;
         font-size: 17px; max-width: 720px; }
  .cap b { font-style: normal; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="cap"><b>№9046 · The Copy Relay</b> (after Sol LeWitt). Forty drafters, each copies the previous drafter's line, no corrections back toward the original. The red line is the score, the graphite is what happened. Click for another relay.</div>
<script>
'use strict';
// The Copy Relay, after Sol LeWitt's Wall Drawings #123 and #797.
// One line is the score. Thirty-nine drafters copy it in turn, each
// tracing the last with a trembling hand. Nobody may correct back
// toward the original, so the drift is the content.

function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rand) {
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function parseSeed() {
  const m = /[?&]seed=(\d+)/.exec(location.search);
  if (m) return parseInt(m[1], 10) >>> 0;
  return 373001;
}
let seed = parseSeed();

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const U = 1000;

function fit() {
  const availW = Math.min(window.innerWidth, 900);
  const availH = window.innerHeight - 120;
  const s = Math.max(0.2, Math.min(availW / U, availH / U));
  cv.width = Math.round(U * s); cv.height = Math.round(U * s);
  cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';
}
window.addEventListener('resize', () => { fit(); draw(); });

// smooth path through points (quadratic midpoints)
function trace(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i+1][0]) / 2, my = (pts[i][1] + pts[i+1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  const l = pts[pts.length - 1];
  ctx.lineTo(l[0], l[1]);
  ctx.stroke();
}

function draw() {
  const s = cv.width / U;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  const rand = mulberry32(seed);

  // the wall: warm white, barely-there grain
  const g = ctx.createLinearGradient(0, 0, 0, U);
  g.addColorStop(0, '#fbf9f3'); g.addColorStop(1, '#f4f0e6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, U, U);
  for (let i = 0; i < 2600; i++) {
    const x = rand() * U, y = rand() * U;
    ctx.fillStyle = 'rgba(120,110,95,' + (0.02 + rand() * 0.03).toFixed(3) + ')';
    ctx.fillRect(x, y, 1.2, 1.2);
  }

  // the score: nine points, one opinionated line
  const N = 9, X0 = 130, X1 = 870, MID = 470;
  const shape = [0, -52, 30, -68, 12, 54, -26, 38, 0];
  let pts = [];
  for (let i = 0; i < N; i++) {
    pts.push([X0 + (X1 - X0) * (i / (N - 1)), MID + shape[i]]);
  }

  const GENS = 40;
  // the score, in red: the idea, stated once
  ctx.strokeStyle = 'rgba(178,52,40,0.92)';
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  trace(pts);

  // the relay: each generation traces the last with a trembling hand
  let dx = 0, dy = 0; // the drift: a random walk with memory
  for (let gen = 1; gen < GENS; gen++) {
    dx = dx * 0.93 + gauss(rand) * 1.35;
    dy = dy * 0.93 + gauss(rand) * 1.35;
    const next = pts.map(([x, y]) => [
      x + dx * 0.35 + gauss(rand) * 2.6,
      y + dy * 0.35 + gauss(rand) * 2.6
    ]);
    // the hand tires: later generations press lighter
    const t = gen / (GENS - 1);
    const alpha = 0.5 * (1 - t) + 0.05;
    ctx.strokeStyle = 'rgba(58,56,52,' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 2.1 - t * 1.2;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    trace(next);
    pts = next;
  }

  // wall label
  ctx.fillStyle = 'rgba(60,55,45,0.85)';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = '600 21px Helvetica, Arial, sans-serif';
  ctx.fillText('THE COPY RELAY', 72, 108);
  ctx.font = 'italic 24px Georgia, serif';
  ctx.fillStyle = 'rgba(60,55,45,0.72)';
  ctx.fillText('Forty drafters. Each copies the previous drafter\u2019s line.', 72, 146);
  ctx.fillText('No corrections back toward the original.', 72, 178);
  ctx.textAlign = 'right';
  ctx.font = '600 21px Helvetica, Arial, sans-serif';
  ctx.fillStyle = 'rgba(60,55,45,0.5)';
  ctx.fillText('№9046', 928, 108);
  ctx.font = 'italic 20px Georgia, serif';
  ctx.fillText('after Sol LeWitt', 928, 908);
}

fit();
draw();
document.addEventListener('click', () => {
  seed = (Math.random() * 1e9) >>> 0;
  history.replaceState(null, '', '?seed=' + seed);
  draw();
});
</script>
</body>
</html>
