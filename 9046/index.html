<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9046 · Square Fountain</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#07070d; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// Eternal Bloom v4: Hans's vision.
// Squares spawn small in the center, grow and rotate, get deleted at max size.
// New squares keep spawning. Continuous beautiful loop.
const SPAWN_EVERY = 1.1;   // seconds between spawns
const LIFETIME = 7;        // seconds from spawn to deletion
const MAX_SIZE = 0.85;     // max half-size as fraction of min(w,h)/2 ... deleted here

const squares = [];
let spawnTimer = 0;
let spawnCount = 0;
const rng = mulberry(9048048);

// luminous palette
const PAL = [
  [99, 102, 241], [34, 211, 238], [244, 114, 182], [251, 191, 36], [99, 102, 241]
];
function palAt(v){
  v = ((v % 1) + 1) % 1;
  const seg = v * (PAL.length - 1);
  const i = Math.min(PAL.length - 2, Math.floor(seg));
  const t = seg - i, a = PAL[i], b = PAL[i+1];
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}
function css(c, al){
  return 'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+al.toFixed(3)+')';
}

function spawnSquare(){
  const dir = rng() > 0.5 ? 1 : -1;
  squares.push({
    age: 0,
    rotSpeed: dir * (0.25 + rng() * 0.5),   // radians per second
    rot0: rng() * Math.PI * 2,
    hue: (spawnCount * 0.13) % 1,            // color steps through palette
    wobble: rng() * Math.PI * 2,
    id: spawnCount
  });
  spawnCount++;
}

function drawSquare(cx, cy, half, rot, col, alpha, glow){
  const c = Math.cos(rot), s = Math.sin(rot);
  const pts = [[-1,-1],[1,-1],[1,1],[-1,1]].map(p => [
    cx + (p[0]*c - p[1]*s) * half,
    cy + (p[0]*s + p[1]*c) * half
  ]);
  // glow underlay
  if (glow > 0.01){
    ctx.save();
    ctx.shadowColor = css(col, 0.8);
    ctx.shadowBlur = 24 * glow;
    ctx.strokeStyle = css(col, alpha * 0.9);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.stroke();
    ctx.restore();
  } else {
    ctx.strokeStyle = css(col, alpha);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.stroke();
  }
}

let lastT = -1;
function drawFrame(nowMs){
  const [w, h] = viewportWH(); prep(w, h);
  const t = nowMs / 1000;
  if (lastT < 0) lastT = t;
  let dt = Math.min(t - lastT, 0.1); lastT = t;

  ctx.fillStyle = '#07070d'; ctx.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const maxHalf = Math.min(w, h) / 2 * MAX_SIZE;

  // spawn on schedule
  spawnTimer += dt;
  while (spawnTimer >= SPAWN_EVERY){ spawnTimer -= SPAWN_EVERY; spawnSquare(); }

  // update + draw (oldest first so newest draws on top)
  for (let i = squares.length - 1; i >= 0; i--){
    const sq = squares[i];
    sq.age += dt;
    const life = sq.age / LIFETIME; // 0..1
    if (life >= 1){ squares.splice(i, 1); continue; }

    // ease-out growth: fast at birth, gentle near max
    const eased = 1 - Math.pow(1 - life, 2.2);
    const half = 4 + eased * (maxHalf - 4);
    const rot = sq.rot0 + sq.rotSpeed * sq.age;

    // alpha: fade in fast, hold, fade out at end
    let alpha;
    if (life < 0.08) alpha = life / 0.08;
    else if (life > 0.85) alpha = (1 - life) / 0.15;
    else alpha = 1;

    const col = palAt(sq.hue + t * 0.008); // hues drift almost imperceptibly
    const glow = Math.max(0, 1 - life * 1.6); // glow strongest when young

    drawSquare(cx, cy, half, rot, col, alpha, glow);

    // inner echo: smaller companion square, counter-rotating
    if (life > 0.1 && life < 0.9){
      drawSquare(cx, cy, half * 0.62, -rot * 0.8 + 0.4, col, alpha * 0.35, 0);
    }
  }
}

function loop(nowMs){ drawFrame(nowMs); requestAnimationFrame(loop); }
// pre-roll so the screen is full on load
(function(){
  const [w, h] = viewportWH(); prep(w, h);
  for (let k = 0; k < 7; k++){ spawnSquare(); squares[squares.length-1].age = k * SPAWN_EVERY; }
})();
requestAnimationFrame(loop);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
