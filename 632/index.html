<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Escape, Reader</title>
<style>
  html, body { margin: 0; padding: 0; background: #12315E; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SEED = 632076;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette (strict) ----------
  var SEA = '#12315E', LAGOON = '#2B7A8C', SAND = '#E8D9A8', CORAL = '#E2725B',
      KELP = '#3E6B35', EMBER = '#C9562E', CREAM = '#F5F1E8', GOLD = '#E8B93B';

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function rgba(h, a) {
    var c = hexRgb(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function easeIO(x) { x = clamp01(x); return x * x * (3 - 2 * x); }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

  // ---------- island geometry (seeded, pure functions of the seed) ----------
  var grng = mulberry32(SEED);
  var ARM_ANG = [], ARM_AMP = [];
  for (var k = 0; k < 8; k++) {
    ARM_ANG.push(k * Math.PI / 4 + (grng() - 0.5) * 0.13);
    ARM_AMP.push(0.135 + grng() * 0.065);
  }
  var WOB1 = grng() * Math.PI * 2, WOB2 = grng() * Math.PI * 2;
  function coastR(th) {
    var r = 0.252;
    for (var i = 0; i < 8; i++) {
      var d = th - ARM_ANG[i];
      var c = Math.cos(d);
      if (c > 0) r += ARM_AMP[i] * Math.pow(c, 4);
    }
    r += 0.0075 * Math.sin(3 * th + WOB1) + 0.0055 * Math.sin(7 * th + WOB2);
    return r;
  }
  function polar(r, a) { return [r * Math.cos(a), r * Math.sin(a)]; }

  // key directions: maze arm 0 (east), reef arm 5 (upper left), bells arm 3 (lower left)
  var MAZE_A = ARM_ANG[0], REEF_A = ARM_ANG[5], BELL_A = ARM_ANG[3];
  var VOLC_A = -1.02;

  // channel centerline (unit coords): lagoon edge -> cove at the maze arm tip
  var CHAN = [];
  (function () {
    for (var i = 0; i <= 10; i++) {
      var t = i / 10;
      var r = 0.085 + (0.408 - 0.085) * t;
      var a = MAZE_A + Math.sin(t * 2.4) * 0.045 * Math.sin(t * Math.PI);
      CHAN.push(polar(r, a));
    }
  })();
  var COVE = CHAN[CHAN.length - 1];
  var MOUTH = CHAN[0];
  var MOOR = [0.018, 0.012];

  // golden route: lagoon -> channel -> cove -> open sea edge
  var ROUTE = [[0, 0]];
  for (var ri = 0; ri < CHAN.length; ri++) ROUTE.push(CHAN[ri].slice());
  ROUTE.push(polar(0.62, MAZE_A), polar(0.95, MAZE_A), polar(1.7, MAZE_A));
  var ROUTE_LEN = [0];
  for (var rj = 1; rj < ROUTE.length; rj++) {
    ROUTE_LEN.push(ROUTE_LEN[rj - 1] + dist2(ROUTE[rj][0], ROUTE[rj][1], ROUTE[rj - 1][0], ROUTE[rj - 1][1]));
  }
  var ROUTE_TOTAL = ROUTE_LEN[ROUTE_LEN.length - 1];
  function routeAt(len) {
    len = Math.max(0, Math.min(ROUTE_TOTAL, len));
    var i = 1;
    while (i < ROUTE_LEN.length - 1 && ROUTE_LEN[i] < len) i++;
    var segLen = ROUTE_LEN[i] - ROUTE_LEN[i - 1] || 1;
    var f = (len - ROUTE_LEN[i - 1]) / segLen;
    return [ROUTE[i - 1][0] + (ROUTE[i][0] - ROUTE[i - 1][0]) * f,
            ROUTE[i - 1][1] + (ROUTE[i][1] - ROUTE[i - 1][1]) * f];
  }
  // project a point onto the channel polyline; returns [projX, projY, perpDist]
  function chanProject(p) {
    var best = null, bd = 1e9;
    for (var i = 1; i < CHAN.length; i++) {
      var ax = CHAN[i - 1][0], ay = CHAN[i - 1][1], bx = CHAN[i][0], by = CHAN[i][1];
      var dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1;
      var f = clamp01(((p[0] - ax) * dx + (p[1] - ay) * dy) / L2);
      var qx = ax + dx * f, qy = ay + dy * f;
      var d = dist2(p[0], p[1], qx, qy);
      if (d < bd) { bd = d; best = [qx, qy]; }
    }
    return [best[0], best[1], bd];
  }

  // ---------- enigma sites ----------
  // Pattern Reef: 7 shells on an arc around the reef site center
  var REEF_C = polar(0.368, REEF_A);
  var SHELLS = [];
  (function () {
    for (var i = 0; i < 7; i++) {
      var a = REEF_A + Math.PI + (i - 3) * 0.36;
      SHELLS.push({ x: REEF_C[0] + 0.060 * Math.cos(a), y: REEF_C[1] + 0.060 * Math.sin(a), face: a });
    }
  })();
  // Tide Bells: large, medium, small along the tangent at the bells site
  var BELL_C = polar(0.348, BELL_A);
  var BELLS = [];
  (function () {
    var tx = -Math.sin(BELL_A), ty = Math.cos(BELL_A);
    var sizes = [0.031, 0.0235, 0.0165];             // low, mid, high pitch by size
    var offs = [-0.062, 0, 0.058];
    for (var i = 0; i < 3; i++) {
      BELLS.push({ x: BELL_C[0] + tx * offs[i], y: BELL_C[1] + ty * offs[i], r: sizes[i], rung: false, swingT0: -10 });
    }
  })();
  // Kelp fronds along both channel banks
  var KELPS = [];
  (function () {
    var krng = mulberry32(SEED + 31);
    var stations = [0.22, 0.40, 0.58, 0.76, 0.90];
    for (var i = 0; i < stations.length; i++) {
      var idx = stations[i] * (CHAN.length - 1);
      var i0 = Math.floor(idx), f = idx - i0;
      var bx = CHAN[i0][0] + (CHAN[Math.min(i0 + 1, CHAN.length - 1)][0] - CHAN[i0][0]) * f;
      var by = CHAN[i0][1] + (CHAN[Math.min(i0 + 1, CHAN.length - 1)][1] - CHAN[i0][1]) * f;
      var dirx = CHAN[Math.min(i0 + 1, CHAN.length - 1)][0] - CHAN[Math.max(i0 - 1, 0)][0];
      var diry = CHAN[Math.min(i0 + 1, CHAN.length - 1)][1] - CHAN[Math.max(i0 - 1, 0)][1];
      var dl = Math.sqrt(dirx * dirx + diry * diry) || 1; dirx /= dl; diry /= dl;
      var px = -diry, py = dirx;
      for (var s = -1; s <= 1; s += 2) {
        KELPS.push({
          bx: bx + px * 0.056 * s, by: by + py * 0.056 * s,
          ix: px * -s, iy: py * -s,               // inward direction (toward centerline)
          dx: dirx, dy: diry,
          phase: krng() * Math.PI * 2, len: 0.037 + krng() * 0.011
        });
      }
    }
  })();
  function kelpTip(kp, t) {
    var sway = Math.sin(t * 0.85 + kp.phase) * 0.008;
    return [kp.bx + kp.ix * kp.len + kp.dx * sway, kp.by + kp.iy * kp.len + kp.dy * sway];
  }

  // sea texture + island dressing (seeded, precomputed)
  var WAVES = [], CORALS = [], SCRUB = [];
  (function () {
    var wrng = mulberry32(SEED + 7);
    for (var i = 0; i < 110; i++) WAVES.push({ x: (wrng() - 0.5) * 2.4, y: (wrng() - 0.5) * 2.4, r: 0.006 + wrng() * 0.012, a: 0.04 + wrng() * 0.06, ph: wrng() * 6.28 });
    var crng = mulberry32(SEED + 13);
    for (var j = 0; j < 54; j++) {
      var th = crng() * Math.PI * 2;
      CORALS.push({ th: th, extra: 0.012 + crng() * 0.026, s: 0.004 + crng() * 0.006 });
    }
    var srng = mulberry32(SEED + 19);
    for (var m = 0; m < 80; m++) {
      var th2 = srng() * Math.PI * 2, fr = 0.30 + srng() * 0.55;
      SCRUB.push({ th: th2, fr: fr, s: 0.004 + srng() * 0.007 });
    }
  })();

  // ---------- game state ----------
  var solved = { reef: false, bells: false, maze: false };
  var phase = 'play';               // play | route | rest
  var routeT0 = 0, restT0 = 0;
  var reefState = 'idle';           // idle | showing | input
  var reefShowT0 = 0, reefSeq = [], reefProg = 0, reefAttempts = 0;
  var shellLit = [false, false, false, false, false, false, false];
  var bellProg = 0;                 // next expected bell index (0 = largest first)
  var mazeMode = 'moor';            // moor | toMouth | steer | toLagoon | done
  var boat = { x: MOOR[0], y: MOOR[1], h: MAZE_A, alpha: 1 };
  var glide = null;                 // {fx,fy,tx,ty,t0,dur,next}
  var dragging = false, dragPt = null;
  var ripples = [], pulses = [];
  var lastWake = 0, boatFadeT0 = -10;
  var lastElapsed = 0;

  var SEARCH = (typeof location !== 'undefined' && location.search) || '';
  if (/finale/.test(SEARCH)) {
    solved.reef = solved.bells = solved.maze = true;
    for (var fi = 0; fi < 7; fi++) shellLit[fi] = true;
    for (var fb = 0; fb < 3; fb++) BELLS[fb].rung = true;
    phase = 'route'; routeT0 = -1.35; mazeMode = 'done';
  }

  function spawnRipple(x, y, color, maxR, dur) {
    ripples.push({ x: x, y: y, t0: lastElapsed, color: color, maxR: maxR, dur: dur || 1.1 });
    if (ripples.length > 60) ripples.shift();
  }
  function spawnPulse(x, y) {
    pulses.push({ x: x, y: y, t0: lastElapsed });
    if (pulses.length > 8) pulses.shift();
  }

  function startReef() {
    reefAttempts++;
    var rng = mulberry32(SEED + 101 + reefAttempts * 77);
    reefSeq = [];
    while (reefSeq.length < 4) {
      var v = Math.floor(rng() * 7);
      if (reefSeq.length === 0 || reefSeq[reefSeq.length - 1] !== v) reefSeq.push(v);
    }
    reefProg = 0;
    for (var i = 0; i < 7; i++) shellLit[i] = false;
    reefState = 'showing';
    reefShowT0 = lastElapsed;
  }
  function resetReefSoft() { startReef(); }   // tide re-lights a fresh sequence

  function startGlide(tx, ty, dur, next) {
    glide = { fx: boat.x, fy: boat.y, tx: tx, ty: ty, t0: lastElapsed, dur: dur, next: next };
  }

  function checkFinale() {
    if (phase === 'play' && solved.reef && solved.bells && solved.maze) {
      phase = 'route'; routeT0 = lastElapsed;
      mazeMode = 'done';
    }
  }
  function doReset(t) {
    solved.reef = solved.bells = solved.maze = false;
    reefState = 'idle'; reefProg = 0;
    for (var i = 0; i < 7; i++) shellLit[i] = false;
    bellProg = 0;
    for (var b = 0; b < 3; b++) { BELLS[b].rung = false; BELLS[b].swingT0 = -10; }
    mazeMode = 'moor';
    boat.x = MOOR[0]; boat.y = MOOR[1]; boat.h = MAZE_A;
    boatFadeT0 = t;
    phase = 'play';
    spawnRipple(MOOR[0], MOOR[1], GOLD, 0.06, 1.4);
  }

  // ---------- update (called from draw with the anchored clock) ----------
  function update(t) {
    // reef: showing -> input
    if (reefState === 'showing' && t > reefShowT0 + 4 * 0.55 + 0.35) reefState = 'input';

    // boat glides
    if (glide) {
      var f = clamp01((t - glide.t0) / glide.dur), e = easeIO(f);
      boat.x = glide.fx + (glide.tx - glide.fx) * e;
      boat.y = glide.fy + (glide.ty - glide.fy) * e;
      boat.h = Math.atan2(glide.ty - glide.fy, glide.tx - glide.fx);
      if (f >= 1) { var nx = glide.next; glide = null; if (nx) nx(); }
    }

    // maze steering
    if (mazeMode === 'steer' && dragging && dragPt) {
      var dx = dragPt[0] - boat.x, dy = dragPt[1] - boat.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > 0.004) {
        var step = Math.min(d, 0.0038);
        boat.x += dx / d * step; boat.y += dy / d * step;
        boat.h = Math.atan2(dy, dx);
      }
      // keep the boat in the water corridor
      var proj = chanProject([boat.x, boat.y]);
      if (proj[2] > 0.034) {
        boat.x += (proj[0] - boat.x) * (1 - 0.034 / proj[2]);
        boat.y += (proj[1] - boat.y) * (1 - 0.034 / proj[2]);
      }
      // kelp collision (forgiving radius)
      for (var i = 0; i < KELPS.length; i++) {
        var tip = kelpTip(KELPS[i], t);
        if (dist2(boat.x, boat.y, tip[0], tip[1]) < 0.021) {
          spawnPulse(boat.x, boat.y);
          mazeMode = 'toMouth';
          startGlide(MOUTH[0], MOUTH[1], 0.9, function () { mazeMode = 'steer'; });
          dragging = false;
          break;
        }
      }
      if (mazeMode === 'steer' && dist2(boat.x, boat.y, COVE[0], COVE[1]) < 0.034) {
        solved.maze = true;
        mazeMode = 'toLagoon';
        spawnRipple(COVE[0], COVE[1], GOLD, 0.075, 1.5);
        startGlide(MOOR[0], MOOR[1], 1.6, function () { mazeMode = 'moor'; checkFinale(); });
      }
    }

    // wake while moving
    var moving = !!glide || (mazeMode === 'steer' && dragging);
    if (phase === 'route') moving = true;
    if (moving && t - lastWake > 0.22) {
      lastWake = t;
      spawnRipple(boat.x - Math.cos(boat.h) * 0.02, boat.y - Math.sin(boat.h) * 0.02, CREAM, 0.030, 1.0);
    }

    // finale sequencing
    if (phase === 'route') {
      var rt = t - routeT0;
      var boatLen = clamp01((rt - 0.35) / 3.4) * ROUTE_TOTAL;
      var bp = routeAt(boatLen);
      var bp2 = routeAt(Math.min(ROUTE_TOTAL, boatLen + 0.01));
      boat.x = bp[0]; boat.y = bp[1];
      boat.h = Math.atan2(bp2[1] - bp[1], bp2[0] - bp[0]);
      if (rt > 4.3) { phase = 'rest'; restT0 = t; }
    } else if (phase === 'rest') {
      boat.alpha = Math.max(0, 1 - (t - restT0 - 2.6) / 1.2);
      if (t - restT0 > 4.0) { boat.alpha = 1; doReset(t); }
    }
    if (phase === 'play') boat.alpha = clamp01((t - boatFadeT0) / 1.0);

    // prune
    ripples = ripples.filter(function (r) { return t - r.t0 < r.dur; });
    pulses = pulses.filter(function (p) { return t - p.t0 < 0.8; });
  }

  // ---------- pointer ----------
  function toUnit(ev) {
    var rect = canvas.getBoundingClientRect();
    var px = (ev.clientX - rect.left), py = (ev.clientY - rect.top);
    var u = Math.min(W, H);
    return [(px - W / 2) / u, (py - H / 2) / u];
  }
  var downPt = null, downT = 0;
  function onDown(ev) {
    var p = toUnit(ev);
    downPt = p; downT = lastElapsed;
    if (mazeMode === 'steer' && phase === 'play') { dragging = true; dragPt = p; }
    if (ev.preventDefault) ev.preventDefault();
  }
  function onMove(ev) {
    if (dragging) dragPt = toUnit(ev);
  }
  function onUp(ev) {
    var wasDrag = dragging;
    dragging = false;
    if (!downPt) return;
    var p = toUnit(ev);
    var moved = dist2(p[0], p[1], downPt[0], downPt[1]);
    var dt = lastElapsed - downT;
    downPt = null;
    if (wasDrag && mazeMode === 'steer') return;
    if (moved < 0.025 && dt < 0.6) handleTap(p[0], p[1]);
  }
  function handleTap(x, y) {
    if (phase !== 'play') return;
    var i;
    // bells first (precise shapes)
    if (!solved.bells) {
      for (i = 0; i < 3; i++) {
        if (dist2(x, y, BELLS[i].x, BELLS[i].y) < BELLS[i].r + 0.016) {
          if (i === bellProg) {
            BELLS[i].rung = true; BELLS[i].swingT0 = lastElapsed;
            spawnRipple(BELLS[i].x, BELLS[i].y, GOLD, 0.035 + (2 - i) * 0.016, 1.2);
            bellProg++;
            if (bellProg >= 3) { solved.bells = true; spawnRipple(BELL_C[0], BELL_C[1], GOLD, 0.10, 1.6); checkFinale(); }
          } else {
            spawnPulse(BELL_C[0], BELL_C[1]);
            bellProg = 0;
            for (var b = 0; b < 3; b++) BELLS[b].rung = false;
          }
          return;
        }
      }
    }
    // reef shells
    if (!solved.reef) {
      for (i = 0; i < 7; i++) {
        if (dist2(x, y, SHELLS[i].x, SHELLS[i].y) < 0.031) {
          if (reefState === 'idle') { startReef(); return; }
          if (reefState === 'input') {
            if (i === reefSeq[reefProg]) {
              shellLit[i] = true;
              spawnRipple(SHELLS[i].x, SHELLS[i].y, CREAM, 0.045, 1.0);
              reefProg++;
              if (reefProg >= 4) {
                solved.reef = true;
                for (var s = 0; s < 7; s++) shellLit[s] = true;
                spawnRipple(REEF_C[0], REEF_C[1], GOLD, 0.10, 1.6);
                checkFinale();
              }
            } else {
              spawnPulse(REEF_C[0], REEF_C[1]);
              resetReefSoft();
            }
          }
          return;
        }
      }
      if (reefState === 'idle' && dist2(x, y, REEF_C[0], REEF_C[1]) < 0.105) { startReef(); return; }
    }
    // maze site
    if (!solved.maze && mazeMode === 'moor') {
      if (dist2(x, y, COVE[0], COVE[1]) < 0.095 || dist2(x, y, MOUTH[0], MOUTH[1]) < 0.07) {
        mazeMode = 'toMouth';
        startGlide(MOUTH[0], MOUTH[1], 1.2, function () { mazeMode = 'steer'; });
        return;
      }
    }
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { dragging = false; downPt = null; });

  // ---------- sizing (Visual Viewport API) ----------
  var W = 0, H = 0;
  function resize() {
    var vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(lastElapsed);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  function isPhone(w, h) {
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  // ---------- drawing ----------
  function coastPath(scale) {
    ctx.beginPath();
    for (var i = 0; i <= 180; i++) {
      var th = i / 180 * Math.PI * 2;
      var r = coastR(th) * scale;
      var x = r * Math.cos(th), y = r * Math.sin(th);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function drawShell(s, lit, u) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.face + Math.PI / 2);
    var r = 0.0175;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, -Math.PI * 0.92, -Math.PI * 0.08);
    ctx.closePath();
    ctx.fillStyle = lit ? GOLD : CORAL;
    ctx.fill();
    ctx.strokeStyle = rgba(SAND, 0.85);
    ctx.lineWidth = 0.0016;
    ctx.stroke();
    ctx.beginPath();
    for (var i = -2; i <= 2; i++) {
      var a = -Math.PI / 2 + i * 0.36;
      ctx.moveTo(0, 0);
      ctx.lineTo(r * 0.92 * Math.cos(a), r * 0.92 * Math.sin(a));
    }
    ctx.strokeStyle = rgba(SEA, 0.35);
    ctx.stroke();
    ctx.restore();
  }

  function drawBell(b, t, u) {
    ctx.save();
    ctx.translate(b.x, b.y - b.r * 0.9);
    var rot = 0;
    if (b.swingT0 > 0 && t - b.swingT0 < 2.2) {
      var st = t - b.swingT0;
      rot = Math.sin(st * 11) * 0.38 * Math.exp(-st * 2.4);
    }
    ctx.rotate(rot);
    ctx.translate(0, b.r * 0.9);
    var r = b.r;
    ctx.beginPath();
    ctx.moveTo(-r, r * 0.45);
    ctx.bezierCurveTo(-r, -r * 0.75, -r * 0.42, -r * 1.02, 0, -r * 1.02);
    ctx.bezierCurveTo(r * 0.42, -r * 1.02, r, -r * 0.75, r, r * 0.45);
    ctx.lineTo(r * 1.16, r * 0.72);
    ctx.lineTo(-r * 1.16, r * 0.72);
    ctx.closePath();
    ctx.fillStyle = b.rung ? GOLD : CORAL;
    ctx.fill();
    ctx.strokeStyle = rgba(SEA, 0.4);
    ctx.lineWidth = 0.0016;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, r * 0.95, r * 0.20, 0, Math.PI * 2);
    ctx.fillStyle = b.rung ? CREAM : SAND;
    ctx.fill();
    ctx.restore();
  }

  function drawBoat(u, t) {
    ctx.save();
    ctx.globalAlpha = boat.alpha;
    ctx.translate(boat.x, boat.y);
    ctx.rotate(boat.h);
    ctx.beginPath();
    ctx.moveTo(0.027, 0);
    ctx.lineTo(-0.019, -0.0125);
    ctx.lineTo(-0.014, 0);
    ctx.lineTo(-0.019, 0.0125);
    ctx.closePath();
    ctx.fillStyle = CREAM;
    ctx.fill();
    ctx.strokeStyle = CORAL;
    ctx.lineWidth = 0.0022;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-0.002, 0, 0.0042, 0, Math.PI * 2);
    ctx.fillStyle = GOLD;
    ctx.fill();
    ctx.restore();
  }

  function siteHalo(x, y, r, t, ph, solvedFlag) {
    var a = solvedFlag ? 0.16 : 0.085 + 0.045 * Math.sin(t * 1.9 + ph);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = rgba(GOLD, a);
    ctx.fill();
    if (solvedFlag) {
      ctx.beginPath();
      ctx.arc(x, y, r * 0.72, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(GOLD, 0.75);
      ctx.lineWidth = 0.0035;
      ctx.stroke();
    }
  }

  function draw(rawT) {
    var t = rawT;
    lastElapsed = t;
    update(t);
    var w = W, h = H;
    if (!w || !h) return;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var u = Math.min(w, h);
    var cx = w / 2, cy = h / 2;
    ctx.save();
    // work in unit space: 1 unit = u px, origin at center
    ctx.translate(cx, cy);
    ctx.scale(u, u);

    // sea
    ctx.fillStyle = SEA;
    ctx.fillRect(-cx / u, -cy / u, w / u, h / u);
    ctx.strokeStyle = rgba(LAGOON, 1);
    for (var wi = 0; wi < WAVES.length; wi++) {
      var wv = WAVES[wi];
      if (Math.abs(wv.x) > cx / u + 0.05 || Math.abs(wv.y) > cy / u + 0.05) continue;
      ctx.globalAlpha = wv.a * (0.75 + 0.25 * Math.sin(t * 0.6 + wv.ph));
      ctx.lineWidth = 0.0022;
      ctx.beginPath();
      ctx.arc(wv.x, wv.y, wv.r, Math.PI * 1.05, Math.PI * 1.75);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // shallow halo + island sand
    coastPath(1.045);
    ctx.fillStyle = rgba(LAGOON, 0.5);
    ctx.fill();
    coastPath(1.0);
    ctx.fillStyle = SAND;
    ctx.fill();
    coastPath(0.93);
    ctx.fillStyle = rgba(KELP, 0.10);
    ctx.fill();

    // coral speckles outside the coast
    for (var ci = 0; ci < CORALS.length; ci++) {
      var co = CORALS[ci];
      var cr = coastR(co.th) + co.extra;
      ctx.beginPath();
      ctx.arc(cr * Math.cos(co.th), cr * Math.sin(co.th), co.s, 0, Math.PI * 2);
      ctx.fillStyle = rgba(CORAL, 0.75);
      ctx.fill();
    }
    // scrub
    for (var si = 0; si < SCRUB.length; si++) {
      var sc = SCRUB[si];
      var sr = coastR(sc.th) * sc.fr;
      if (sr < 0.148) continue;
      ctx.beginPath();
      ctx.arc(sr * Math.cos(sc.th), sr * Math.sin(sc.th), sc.s, 0, Math.PI * 2);
      ctx.fillStyle = rgba(KELP, 0.30);
      ctx.fill();
    }

    // lagoon heart
    ctx.beginPath();
    ctx.arc(0, 0, 0.104, 0, Math.PI * 2);
    ctx.fillStyle = LAGOON;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, 0.104, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(CREAM, 0.35);
    ctx.lineWidth = 0.0022;
    ctx.stroke();

    // channel water (through the maze arm to the cove)
    ctx.beginPath();
    ctx.moveTo(CHAN[0][0], CHAN[0][1]);
    for (var chi = 1; chi < CHAN.length; chi++) ctx.lineTo(CHAN[chi][0], CHAN[chi][1]);
    ctx.strokeStyle = LAGOON;
    ctx.lineWidth = 0.088;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    // cove
    ctx.beginPath();
    ctx.arc(COVE[0], COVE[1], 0.052, 0, Math.PI * 2);
    ctx.fillStyle = LAGOON;
    ctx.fill();

    // kelp fronds
    ctx.strokeStyle = KELP;
    ctx.lineCap = 'round';
    for (var ki = 0; ki < KELPS.length; ki++) {
      var kp = KELPS[ki];
      var tip = kelpTip(kp, t);
      var mx = kp.bx + kp.ix * kp.len * 0.5 + kp.dx * Math.sin(t * 0.85 + kp.phase) * 0.004;
      var my = kp.by + kp.iy * kp.len * 0.5 + kp.dy * Math.sin(t * 0.85 + kp.phase) * 0.004;
      ctx.lineWidth = 0.0075;
      ctx.beginPath();
      ctx.moveTo(kp.bx, kp.by);
      ctx.quadraticCurveTo(mx, my, tip[0], tip[1]);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(tip[0], tip[1], 0.005, 0, Math.PI * 2);
      ctx.fillStyle = KELP;
      ctx.fill();
    }

    // volcano
    var vp = polar(0.185, VOLC_A);
    ctx.save();
    ctx.translate(vp[0], vp[1]);
    ctx.beginPath();
    ctx.moveTo(-0.034, 0.020);
    ctx.quadraticCurveTo(-0.012, -0.026, 0, -0.030);
    ctx.quadraticCurveTo(0.012, -0.026, 0.034, 0.020);
    ctx.closePath();
    ctx.fillStyle = CORAL;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -0.020, 0.0105, 0, Math.PI * 2);
    ctx.fillStyle = EMBER;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -0.020, 0.0105 + 0.006 * (0.6 + 0.4 * Math.sin(t * 2.2)), 0, Math.PI * 2);
    ctx.strokeStyle = rgba(EMBER, 0.4);
    ctx.lineWidth = 0.003;
    ctx.stroke();
    ctx.restore();

    // golden route (finale)
    if (phase !== 'play') {
      var rt = t - routeT0;
      var drawn = phase === 'rest' ? ROUTE_TOTAL : clamp01(rt / 3.2) * ROUTE_TOTAL;
      ctx.save();
      ctx.strokeStyle = GOLD;
      ctx.lineWidth = 0.005;
      ctx.setLineDash([0.020, 0.013]);
      ctx.lineDashOffset = -t * 0.02;
      ctx.beginPath();
      var steps = Math.max(2, Math.floor(drawn / 0.01));
      for (var qi = 0; qi <= steps; qi++) {
        var qp = routeAt(drawn * qi / steps);
        if (qi === 0) ctx.moveTo(qp[0], qp[1]); else ctx.lineTo(qp[0], qp[1]);
      }
      ctx.stroke();
      ctx.restore();
    }

    // enigma halos
    siteHalo(REEF_C[0], REEF_C[1], 0.088, t, 0.0, solved.reef);
    siteHalo(BELL_C[0], BELL_C[1], 0.092, t, 2.1, solved.bells);
    siteHalo(COVE[0], COVE[1], 0.082, t, 4.2, solved.maze);

    // pattern reef shells
    var showIdx = -1;
    if (reefState === 'showing') {
      var si2 = Math.floor((t - reefShowT0) / 0.55);
      if (si2 >= 0 && si2 < 4) showIdx = reefSeq[si2];
    }
    for (var shi = 0; shi < 7; shi++) {
      drawShell(SHELLS[shi], shellLit[shi] || shi === showIdx, u);
    }

    // tide bells
    for (var bi = 0; bi < 3; bi++) drawBell(BELLS[bi], t, u);

    // ripples + pulses (under the boat)
    for (var rpi = 0; rpi < ripples.length; rpi++) {
      var rp = ripples[rpi];
      var rf = (t - rp.t0) / rp.dur;
      if (rf < 0 || rf > 1) continue;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, 0.006 + rp.maxR * easeIO(rf), 0, Math.PI * 2);
      ctx.strokeStyle = rgba(rp.color, 0.55 * (1 - rf));
      ctx.lineWidth = 0.0026;
      ctx.stroke();
    }
    for (var pui = 0; pui < pulses.length; pui++) {
      var pu = pulses[pui];
      var pf = (t - pu.t0) / 0.8;
      if (pf < 0 || pf > 1) continue;
      ctx.beginPath();
      ctx.arc(pu.x, pu.y, 0.01 + 0.085 * easeIO(pf), 0, Math.PI * 2);
      ctx.strokeStyle = rgba(CORAL, 0.38 * (1 - pf));
      ctx.lineWidth = 0.006 * (1 - pf) + 0.001;
      ctx.stroke();
    }

    drawBoat(u, t);
    ctx.restore();
  }

  // ---------- frame one + loop ----------
  resize();
  draw(0);
  var startStamp = null;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (ts) {
      if (startStamp === null) startStamp = ts;
      draw((ts - startStamp) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
