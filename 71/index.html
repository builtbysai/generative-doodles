<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№71 · Missing Pixels</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1ea; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(20,20,20,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to open a missing pixel</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }
const GREYS=[]; for(let i=0;i<9;i++){ const v=Math.round(26+(232-26)*i/8); GREYS.push('rgb('+v+','+v+','+v+')'); }
const BANDIDX=[0,1,2,3,4,5,6,7,8,7,6,5,4,3];
const NB=BANDIDX.length;
const rnd=mulberry(7101);
const APS=[];
(function(){
  let tries=0;
  while(APS.length<6&&tries<400){ tries++;
    const cand={ fx:0.08+rnd()*0.84, fy:0.10+rnd()*0.80, base:0.045+rnd()*0.065, phase:rnd()*Math.PI*2, k:1+Math.floor(rnd()*3), drift:(rnd()-0.5)*0.05, yAmp:0.012+rnd()*0.02, seed:rnd()*100, lobes:[0.75+rnd()*0.5,0.8+rnd()*0.45,0.85+rnd()*0.4] };
    let ok=true;
    for(const a of APS){ const dx=(a.fx-cand.fx), dy=(a.fy-cand.fy); if(dx*dx+dy*dy<0.045) ok=false; }
    if(ok) APS.push(cand);
  }
})();
let touchAp=null, draggingAp=null;
function fieldRect(w,h){ if(isPhone()) return {x:0,y:0,w:w,h:h}; const S=Math.min(w,h); return {x:(w-S)/2,y:(h-S)/2,w:S,h:S}; }
function apPos(a,f,t){
  const driftX=Math.sin(2*Math.PI*a.k*t/20+a.phase)*0.06;
  let x=(a.fx+ (t/20)*a.drift + driftX)*f.w+f.x; x=f.x+((x-f.x)%f.w+f.w)%f.w;
  const y=f.y+(a.fy+Math.sin(2*Math.PI*t/20+a.phase*1.7)*a.yAmp)*f.h;
  const r=a.base*Math.min(f.w,f.h)*(0.45+0.55*(0.5+0.5*Math.sin(2*Math.PI*a.k*t/20+a.phase)));
  return {x,y,r};
}
function drawBlob(x,y,r,seed,lobes){
  ctx.beginPath();
  const n=28;
  for(let i=0;i<=n;i++){ const ang=i/n*Math.PI*2; const wob=0.72+0.18*Math.sin(ang*3+seed)+0.10*Math.sin(ang*5+seed*2.1); const rr=r*wob*(lobes?lobes[i%3]*0.22+0.78:1); const px=x+Math.cos(ang)*rr*1.25, py=y+Math.sin(ang)*rr*0.82; if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.closePath(); ctx.fill();
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#f4f1ea'; ctx.fillRect(0,0,w,h);
  const f=fieldRect(w,h); const t=nowMs/1000;
  const bh=f.h/NB;
  for(let i=0;i<NB;i++){ ctx.fillStyle=GREYS[BANDIDX[i]]; ctx.fillRect(f.x,f.y+i*bh,f.w,bh+1); }
  ctx.fillStyle='#0a0a0a';
  for(const a of APS){ const p=apPos(a,f,t); if(p.r>2) drawBlob(p.x,p.y,p.r,a.seed,a.lobes); }
  if(touchAp){
    const age=t-touchAp.born;
    let scale=1;
    if(!touchAp.held){ const remain=6-(age-touchAp.holdAge); scale=Math.max(0,Math.min(1,remain/1.2)); }
    else scale=smooth(Math.min(1,age/0.35));
    if(scale>0) drawBlob(touchAp.x,touchAp.y,touchAp.r*scale,touchAp.seed,null);
    if(!touchAp.held&&age-touchAp.holdAge>6) touchAp=null;
  }
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(9000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',e=>{
  const [w,h]=viewportWH(); const f=fieldRect(w,h); const t=performance.now()/1000;
  draggingAp=null;
  for(const a of APS){ const p=apPos(a,f,t); const dx=e.clientX-p.x, dy=e.clientY-p.y; if(dx*dx+dy*dy<p.r*p.r*1.6){ draggingAp={a,dx,dy}; break; } }
  if(!draggingAp){ touchAp={x:e.clientX,y:e.clientY,r:Math.min(w,h)*0.075,born:t,holdAge:0,held:true,seed:Math.random()*100}; }
});
canvas.addEventListener('pointermove',e=>{
  if(draggingAp){ const [w,h]=viewportWH(); const f=fieldRect(w,h); draggingAp.a.fx=Math.max(0.03,Math.min(0.97,(e.clientX-draggingAp.dx-f.x)/f.w)); draggingAp.a.fy=Math.max(0.03,Math.min(0.97,(e.clientY-draggingAp.dy-f.y)/f.h)); }
  else if(touchAp&&touchAp.held){ touchAp.x=e.clientX; touchAp.y=e.clientY; }
});
function endP(){ if(touchAp&&touchAp.held){ touchAp.held=false; touchAp.holdAge=performance.now()/1000-touchAp.born; } draggingAp=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
