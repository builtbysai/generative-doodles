<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8470;9028 &middot; Wire Garden</title>
<style>
  :root{ --paper:#f5f0e3; --ink:#26221a; --ink-soft:rgba(38,34,26,.62); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--paper)}
  body{font-family:"Noto Serif","DejaVu Serif",Georgia,serif;color:var(--ink);
       -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #stage{position:fixed;inset:0;display:block;touch-action:manipulation;cursor:pointer}
  #plate{position:fixed;top:14px;left:18px;pointer-events:none;user-select:none;
         font-size:13px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
  #plate b{color:var(--ink);font-weight:700}
  #hint{position:fixed;left:50%;transform:translateX(-50%);
        bottom:calc(14px + env(safe-area-inset-bottom));
        width:max-content;max-width:92vw;text-align:center;
        pointer-events:none;user-select:none;
        font-size:12.5px;font-style:italic;color:var(--ink-soft)}
  @media (max-width:520px){
    #plate{font-size:11px;top:10px;left:12px}
    #hint{font-size:11px;bottom:calc(10px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="plate"><b>&#8470;9028 &middot; Wire Garden</b></div>
<div id="hint">one wire grows itself, bending toward a wandering target &middot; tap for a fresh one</div>
<script>
"use strict";
/* №9028 Wire Garden, sketchbook seed 43, "mega-wire".
   A pool of short polyline fragments (river meanders, highway glides,
   contour wiggles, S-curves, switchbacks, hooks, hairpins, loops) is
   synthesized per seed. The wire grows fragment by fragment: a target
   heading wanders on slow sine periods; each step a hand of 7 fragments
   is drawn and the one whose net turn bends the wire closest to the target
   wins (greedy angle matching); 10% of the time a wild card from the hand
   is taken instead. Each fragment rotates rigidly onto the wire tip, so the
   wire never truly obeys the heading; it bends toward it through the
   pool's own vocabulary. Ten minutes in, the wire has drawn a landscape
   no one planned. */

function xmur3(str){for(var i=0,h=1779033703^str.length;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0}}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rngFrom(seed){return mulberry32(xmur3(String(seed))())}
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;else if(d<-Math.PI)d+=TAU;return d;}

function opts(){
  const o={seed:43,fast:0};
  const s=(location.search||"")+"&"+(location.hash||"").replace(/^#/,"");
  const m=s.match(/seed=([0-9]+)/); if(m)o.seed=parseInt(m[1],10);
  const f=s.match(/fast=([0-9]+)/); if(f)o.fast=parseInt(f[1],10);
  return o;
}
const OPT=opts();

/* ---------- fragment pool ---------- */
const POOL_N=72, HAND_N=5, WILD_P=0.10, CAP=4200;
const SHOW_WILD=true; /* rust dot at each wild-card joint: the 10% made visible */
function buildFragment(rng){
  /* smooth arc fragments: each has a characteristic net turn T (the
     angleDiff the greedy matcher works with) plus a small hand-drawn
     texture wiggle. Sharp-turn kinds (hook, hairpin, loop) are rare and
     wildcard-only, so the wire travels instead of churning. */
  const kinds=[["glide",24],["bend",26],["curve",18],["scurve",14],
               ["meander",12],["hook",3],["hairpin",2],["loop",1]];
  let r=rng()*100, kind=kinds[0][0];
  for(const kw of kinds){ if((r-=kw[1])<0){kind=kw[0];break;} }
  const m=14+((rng()*11)|0), pts=[[0,0]];
  const dir=rng()<0.5?1:-1;
  let T=0, waves=1, texAmp=0.04;
  switch(kind){
    case "glide":   T=(rng()-0.5)*0.28; texAmp=0.03; break;
    case "bend":    T=dir*(0.26+rng()*0.44); texAmp=0.05; break;   /* 15-40 deg */
    case "curve":   T=dir*(0.80+rng()*0.60); texAmp=0.05; break;   /* 45-80 deg */
    case "meander": T=dir*(0.17+rng()*0.35); texAmp=0.16; waves=1.5; break;
    case "hook":    T=dir*(1.75+rng()*0.70); texAmp=0.04; break;   /* 100-140 deg */
    case "hairpin": T=dir*(2.60+rng()*0.55); texAmp=0.04; break;   /* 150-180 deg */
    case "loop":    T=dir*TAU; texAmp=0.03; break;
    default:        T=0; texAmp=0; waves=0; break;                 /* scurve */
  }
  const ph=rng()*TAU;
  let x=0,y=0;
  for(let i=1;i<m;i++){
    const t=i/(m-1);
    let h;
    if(kind==="scurve"){
      h=dir*0.95*Math.sin(t*TAU);          /* S: net turn ~ 0 */
    }else{
      const s=t*t*(3-2*t);                /* smoothstep 0 -> T */
      h=T*s+texAmp*Math.sin(t*waves*TAU+ph)*(1-t*0.5);
    }
    x+=Math.cos(h); y+=Math.sin(h); pts.push([x,y]);
  }
  const n=pts.length;
  /* entry heading is 0 by construction, so netTurn is the exit heading */
  const netTurn=Math.atan2(pts[n-1][1]-pts[n-2][1], pts[n-1][0]-pts[n-2][0]);
  return {pts:pts, netTurn:netTurn, kind:kind,
          lex:pts[n-1][0], ley:pts[n-1][1]};
}

/* ---------- state ---------- */
const canvas=document.getElementById("stage");
const vctx=canvas.getContext("2d");
const off=document.createElement("canvas");
const octx=off.getContext("2d");
let W=0,H=0,S=2,dpr=1,lw=2;
let rng,pool,tipX,tipY,heading,fragCount,ph1,ph2,ph3,t0,lastTarget,seed,turnAcc;

function size(){
  W=window.innerWidth; H=window.innerHeight;
  dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  off.width=Math.round(W*dpr); off.height=Math.round(H*dpr);
  octx.setTransform(dpr,0,0,dpr,0,0);
  vctx.setTransform(1,0,0,1,0,0);
  S=clamp(Math.min(W,H)/230,1.2,2.8);
  lw=clamp(Math.min(W,H)/430,1.5,2.2);
}

function build(s){
  seed=s;
  rng=rngFrom("wire-garden:"+seed);
  pool=[]; for(let i=0;i<POOL_N;i++) pool.push(buildFragment(rng));
  ph1=rng()*TAU; ph2=rng()*TAU; ph3=rng()*TAU;
  lureT1=17+rng()*9; lureT2=13+rng()*8;
  lureP1=rng()*TAU; lureP2=rng()*TAU;
  turnAcc=0;
  tipX=W*(0.42+rng()*0.16); tipY=H*(0.42+rng()*0.16);
  heading=(rng()-0.5)*0.6;
  fragCount=0; lastTarget=heading;
  octx.setTransform(dpr,0,0,dpr,0,0);
  octx.clearRect(0,0,W,H);
  t0=performance.now();
}

/* the wandering target: slow sine drift plus a slow misperception bias.
   Deliberately page-ignorant and smooth everywhere; containment lives in
   the greedy score, not in the target, so there are no vector-cancellation
   stagnation points and no discontinuities. */
/* the wandering target: the wire chases a lure point P(t) that drifts
   around the page on a slow Lissajous path, plus a breath of sine
   wander for texture. P never leaves the page, so the wire never needs
   a wall, a bounce, or a penalty field: boundedness comes from the
   lure's bounded motion. Anti-windup (in growOne) keeps the wire from
   coiling when it catches up. */
let lureT1=37, lureT2=29, lureP1=0, lureP2=0;
function targetHeading(elapsed){
  const t=elapsed/1000;
  const px=W/2+(W*0.40)*Math.sin(TAU*t/lureT1+lureP1);
  const py=H/2+(H*0.40)*Math.sin(TAU*t/lureT2+lureP2);
  const w=1.2*Math.sin(TAU*elapsed/251+ph1)+0.6*Math.sin(TAU*elapsed/97+ph2)
        +0.3*Math.sin(TAU*elapsed/61+ph3);
  const dx=px-tipX, dy=py-tipY;
  /* dead zone: when close to the lure, follow pure wander instead of
     orbiting it; chase only from a distance. This keeps the trail open. */
  if(Math.hypot(dx,dy)<300) return w;
  return Math.atan2(dy,dx)+w*0.3;
}

/* sharp-turn fragment kinds: greedy never takes these (they coil in
   place while scoring as "straight"); only the 10% wildcard may. */
function isWildKind(f){ return f.kind==="hook"||f.kind==="hairpin"||f.kind==="loop"; }

function growOne(elapsed){
  const hand=new Set();
  while(hand.size<HAND_N) hand.add((rng()*POOL_N)|0);
  const tgt=targetHeading(elapsed);
  lastTarget=tgt;
  let best=null,bestErr=Infinity;
  for(const i of hand){
    const f=pool[i];
    if(isWildKind(f)) continue;
    const exitH=heading+f.netTurn;
    /* greedy angle match: the wire bends toward the wandering target
       but never obeys it. Strong laziness keeps it meandering; the
       anti-windup punishes continuing an accumulated turn. */
    let e=Math.abs(angDiff(exitH,tgt))+0.35*Math.abs(f.netTurn);
    e+=Math.max(0,turnAcc*f.netTurn)*0.5;
    if(e<bestErr){bestErr=e;best=f;}
  }
  if(!best){ const arr=Array.from(hand); best=pool[arr[0]]; }
  let wild=false;
  if(rng()<WILD_P){
    const arr=Array.from(hand);
    best=pool[arr[(rng()*arr.length)|0]];
    wild=true;
  }
  const ch=Math.cos(heading), sh=Math.sin(heading);
  const sub=[];
  for(const p of best.pts){
    sub.push(tipX+(p[0]*ch-p[1]*sh)*S, tipY+(p[0]*sh+p[1]*ch)*S);
  }
  tipX=sub[sub.length-2]; tipY=sub[sub.length-1];
  heading=Math.atan2(Math.sin(heading+best.netTurn),Math.cos(heading+best.netTurn));
  turnAcc=turnAcc*0.95+best.netTurn;
  fragCount++;
  return {sub:sub, wild:wild, jx:sub[0], jy:sub[1],
          width:lw*(0.82+rng()*0.36), alpha:0.80+rng()*0.18};
}

function strokeSub(r){
  octx.beginPath();
  octx.moveTo(r.sub[0],r.sub[1]);
  for(let i=2;i<r.sub.length;i+=2) octx.lineTo(r.sub[i],r.sub[i+1]);
  octx.strokeStyle="rgba(38,34,26,"+r.alpha.toFixed(3)+")";
  octx.lineWidth=r.width; octx.lineCap="round"; octx.lineJoin="round";
  octx.stroke();
  if(r.wild&&SHOW_WILD){
    octx.beginPath(); octx.arc(r.jx,r.jy,1.7,0,TAU);
    octx.fillStyle="rgba(154,91,60,0.55)"; octx.fill();
  }
}

/* ---------- dial: the wandering target, made visible ---------- */
function drawDial(){
  const r=Math.min(W,H)<520?15:20;
  const cx=W-r-18, cy=H-r-34;
  vctx.save();
  /* paper backing disc so the dial always reads, even under the wire */
  vctx.fillStyle="#f5f0e3";
  vctx.beginPath(); vctx.arc(cx,cy,r+11,0,TAU); vctx.fill();
  vctx.strokeStyle="rgba(38,34,26,0.45)"; vctx.lineWidth=1;
  vctx.beginPath(); vctx.arc(cx,cy,r,0,TAU); vctx.stroke();
  const a=lastTarget;
  vctx.strokeStyle="rgba(38,34,26,0.80)"; vctx.lineWidth=1.6;
  vctx.beginPath(); vctx.moveTo(cx,cy);
  vctx.lineTo(cx+Math.cos(a)*(r-5),cy+Math.sin(a)*(r-5)); vctx.stroke();
  vctx.fillStyle="rgba(38,34,26,0.80)";
  vctx.beginPath(); vctx.arc(cx,cy,2,0,TAU); vctx.fill();
  vctx.fillStyle="rgba(38,34,26,0.50)";
  vctx.font="italic 10px Georgia,serif"; vctx.textAlign="center";
  vctx.fillText("target",cx,cy+r+13);
  vctx.restore();
}

let lastStep=0;
function frame(now){
  const elapsed=(now-t0)/1000;
  if(fragCount<CAP){
    const interval=95+105*(fragCount/CAP);
    if(now-lastStep>=interval){
      strokeSub(growOne(elapsed));
      lastStep=now;
    }
  }
  vctx.drawImage(off,0,0,W,H);
  if(fragCount<CAP){ /* the pen tip, while the wire still grows */
    vctx.fillStyle="rgba(38,34,26,0.9)";
    vctx.beginPath(); vctx.arc(tipX,tipY,lw*0.95,0,TAU); vctx.fill();
  }
  drawDial();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
size();
build(OPT.seed);
if(OPT.fast>0){
  const n=Math.min(OPT.fast,CAP);
  for(let i=0;i<n;i++) strokeSub(growOne(i*0.13));
}
requestAnimationFrame(frame);

canvas.addEventListener("pointerdown",function(){
  build((Math.random()*1e9)|0);
});

let rzT=null;
window.addEventListener("resize",function(){
  if(rzT) clearTimeout(rzT);
  rzT=setTimeout(function(){ size(); build(seed); },250);
});
</script>
</body>
</html>
