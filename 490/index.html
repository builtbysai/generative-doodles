<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraktur Field</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0A0A; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var BG = '#0A0A0A';
  var FG = '#FAFAF6';

  var PHASE = 9.0;        // fixed pre-roll: glyph 1 at peak breath, all offsets zero
  var BREATH_SLOT = 6.0;  // seconds per breathing glyph
  var SEED = 490207;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------------- fraktur glyph skeletons ----------------
  // Unit box: x 0..1, y 0..1 (y DOWN, 0 = cap top, 1 = baseline).
  // strokes: { w: width factor of glyph size, pts: [[x,y],...] }
  // cuts: thin BG strokes split down the heavy stems (carved split)
  // diamonds: [x, y, size factor] filled rotated squares at terminals
  var MAIN = 0.145, THIN = 0.075;
  var GLYPHS = [
    { // arch: two stems, broken arch, crossbar
      strokes: [
        { w: MAIN, pts: [[0.12,0.03],[0.12,0.97]] },
        { w: MAIN, pts: [[0.82,0.30],[0.82,0.97]] },
        { w: MAIN, pts: [[0.12,0.05],[0.30,0.00],[0.55,0.02],[0.74,0.12],[0.82,0.30]] },
        { w: THIN, pts: [[0.12,0.55],[0.82,0.55]] }
      ],
      cuts: [ [[0.12,0.10],[0.12,0.90]], [[0.82,0.38],[0.82,0.90]] ],
      diamonds: [ [0.12,0.0,0.15], [0.12,1.0,0.15], [0.82,1.0,0.15] ]
    },
    { // bowl: stem with two stacked angular bowls
      strokes: [
        { w: MAIN, pts: [[0.14,0.03],[0.14,0.97]] },
        { w: MAIN, pts: [[0.14,0.07],[0.50,0.02],[0.72,0.14],[0.66,0.34],[0.44,0.44],[0.14,0.46]] },
        { w: MAIN, pts: [[0.14,0.46],[0.52,0.44],[0.78,0.58],[0.72,0.84],[0.44,0.97],[0.14,0.95]] }
      ],
      cuts: [ [[0.14,0.10],[0.14,0.90]] ],
      diamonds: [ [0.14,0.0,0.15], [0.14,1.0,0.15], [0.72,0.14,0.11] ]
    },
    { // twin stems, diagonal, top bar
      strokes: [
        { w: MAIN, pts: [[0.12,0.05],[0.12,0.97]] },
        { w: MAIN, pts: [[0.86,0.05],[0.86,0.97]] },
        { w: MAIN, pts: [[0.12,0.06],[0.86,0.94]] },
        { w: THIN, pts: [[0.05,0.05],[0.93,0.05]] }
      ],
      cuts: [ [[0.12,0.12],[0.12,0.88]] ],
      diamonds: [ [0.49,0.50,0.19], [0.12,1.0,0.15], [0.86,0.0,0.15] ]
    },
    { // hook: stem, top bowl, diagonal leg
      strokes: [
        { w: MAIN, pts: [[0.14,0.03],[0.14,0.97]] },
        { w: MAIN, pts: [[0.14,0.07],[0.52,0.02],[0.74,0.16],[0.64,0.40],[0.36,0.48],[0.14,0.48]] },
        { w: MAIN, pts: [[0.50,0.48],[0.88,0.97]] }
      ],
      cuts: [ [[0.14,0.10],[0.14,0.90]] ],
      diamonds: [ [0.14,0.0,0.15], [0.14,1.0,0.15], [0.88,1.0,0.12] ]
    },
    { // zig: broken S/Z zigzag
      strokes: [
        { w: MAIN, pts: [[0.78,0.07],[0.32,0.02],[0.20,0.20],[0.72,0.50],[0.82,0.68],[0.62,0.95],[0.18,0.93]] }
      ],
      cuts: [],
      diamonds: [ [0.80,0.05,0.14], [0.16,0.95,0.14], [0.72,0.50,0.11] ]
    },
    { // tee: top bar, center stem
      strokes: [
        { w: 0.12, pts: [[0.05,0.07],[0.95,0.07]] },
        { w: MAIN, pts: [[0.50,0.07],[0.50,0.97]] },
        { w: THIN, pts: [[0.28,0.42],[0.72,0.42]] }
      ],
      cuts: [ [[0.50,0.14],[0.50,0.90]] ],
      diamonds: [ [0.05,0.07,0.15], [0.95,0.07,0.15], [0.50,1.0,0.15] ]
    },
    { // twin arch: M-form with mid drop
      strokes: [
        { w: MAIN, pts: [[0.10,0.97],[0.10,0.07],[0.30,0.00],[0.50,0.14],[0.70,0.00],[0.90,0.07],[0.90,0.97]] },
        { w: MAIN, pts: [[0.50,0.14],[0.50,0.52]] }
      ],
      cuts: [ [[0.10,0.16],[0.10,0.90]], [[0.90,0.16],[0.90,0.90]] ],
      diamonds: [ [0.10,1.0,0.15], [0.90,1.0,0.15], [0.50,0.55,0.11] ]
    },
    { // spire: A-form, apex diamond, crossbar
      strokes: [
        { w: MAIN, pts: [[0.08,0.97],[0.42,0.05]] },
        { w: MAIN, pts: [[0.42,0.05],[0.88,0.97]] },
        { w: THIN, pts: [[0.24,0.62],[0.70,0.62]] },
        { w: THIN, pts: [[0.42,0.20],[0.42,0.55]] }
      ],
      cuts: [],
      diamonds: [ [0.42,0.02,0.17], [0.08,1.0,0.13], [0.88,1.0,0.13] ]
    }
  ];

  // ---------------- layout ----------------
  var W = 0, H = 0, DPR = 1;
  var glyphs = [];   // { cx, cy, size, gi, flip, jit[], ox, oy, vx, vy }

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }

  function layout() {
    var rng = mulberry32(SEED);
    var minDim = Math.min(W, H);
    var n = isPhone() ? 10 : 11;
    glyphs = [];
    // forced edge-bleed anchors first: left, top, right, bottom
    var forced = [
      { fx: 0.02, fy: 0.30 }, { fx: 0.38, fy: 0.02 },
      { fx: 0.97, fy: 0.42 }, { fx: 0.62, fy: 0.98 }
    ];
    for (var i = 0; i < n; i++) {
      var size = minDim * (0.40 + rng() * 0.28);
      var fx, fy;
      if (i < forced.length) { fx = forced[i].fx; fy = forced[i].fy; }
      else { fx = 0.06 + rng() * 0.88; fy = 0.08 + rng() * 0.84; }
      // per-glyph point jitter, seeded
      var jit = [];
      for (var j = 0; j < 64; j++) jit.push((rng() - 0.5) * 0.035);
      glyphs.push({
        cx: fx * W, cy: fy * H, size: size,
        gi: Math.floor(rng() * GLYPHS.length),
        flip: rng() < 0.35 ? -1 : 1,
        jit: jit,
        ox: 0, oy: 0, vx: 0, vy: 0
      });
    }
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    layout();
    draw(PHASE);
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // ---------------- interaction: drag disturbs the field ----------------
  var dragging = false, lastPX = 0, lastPY = 0;
  function pointerPos(e) {
    return { x: e.clientX, y: e.clientY };
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; var p = pointerPos(e); lastPX = p.x; lastPY = p.y;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = pointerPos(e);
    var dx = p.x - lastPX, dy = p.y - lastPY;
    lastPX = p.x; lastPY = p.y;
    var R = Math.min(W, H) * 0.5;
    for (var i = 0; i < glyphs.length; i++) {
      var g = glyphs[i];
      var ddx = g.cx + g.ox - p.x, ddy = g.cy + g.oy - p.y;
      var d = Math.sqrt(ddx * ddx + ddy * ddy);
      if (d < R + g.size * 0.5) {
        var f = Math.max(0, 1 - d / (R + g.size * 0.5));
        g.vx += dx * f * 2.4;
        g.vy += dy * f * 2.4;
      }
    }
  });
  function endDrag() { dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', endDrag);

  function stepPhysics(dt) {
    var K = 26.0, C = 2 * Math.sqrt(K) * 0.55; // underdamped: swings back
    var steps = Math.max(1, Math.min(8, Math.round(dt / 0.008)));
    var h = dt / steps;
    for (var s = 0; s < steps; s++) {
      for (var i = 0; i < glyphs.length; i++) {
        var g = glyphs[i];
        g.vx += (-K * g.ox - C * g.vx) * h;
        g.vy += (-K * g.oy - C * g.vy) * h;
        g.ox += g.vx * h;
        g.oy += g.vy * h;
      }
    }
  }

  // ---------------- drawing ----------------
  function drawGlyph(g, scaleMul) {
    var def = GLYPHS[g.gi];
    var s = g.size * scaleMul;
    var x0 = g.cx + g.ox - s / 2, y0 = g.cy + g.oy - s / 2;
    var ji = 0;
    function px(v) { return x0 + (g.flip < 0 ? (1 - v) : v) * s; }
    function jx(v) { var j = g.jit[ji % g.jit.length]; ji++; return v + j; }
    ctx.save();
    ctx.strokeStyle = FG;
    ctx.fillStyle = FG;
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'square';
    var i, k, pts;
    for (i = 0; i < def.strokes.length; i++) {
      pts = def.strokes[i].pts;
      ctx.lineWidth = def.strokes[i].w * s;
      ctx.beginPath();
      for (k = 0; k < pts.length; k++) {
        var X = px(jx(pts[k][0])), Y = y0 + (pts[k][1] + g.jit[(ji + 31) % g.jit.length]) * s; ji++;
        if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
      ctx.stroke();
    }
    // carved splits down the heavy stems
    ctx.strokeStyle = BG;
    for (i = 0; i < def.cuts.length; i++) {
      pts = def.cuts[i];
      ctx.lineWidth = 0.022 * s;
      ctx.beginPath();
      for (k = 0; k < pts.length; k++) {
        var CX = px(pts[k][0]), CY = y0 + pts[k][1] * s;
        if (k === 0) ctx.moveTo(CX, CY); else ctx.lineTo(CX, CY);
      }
      ctx.stroke();
    }
    // diamond terminals
    ctx.fillStyle = FG;
    for (i = 0; i < def.diamonds.length; i++) {
      var d = def.diamonds[i];
      var DX = px(d[0]), DY = y0 + d[1] * s, r = d[2] * s * 0.5;
      ctx.beginPath();
      ctx.moveTo(DX, DY - r);
      ctx.lineTo(DX + r, DY);
      ctx.lineTo(DX, DY + r);
      ctx.lineTo(DX - r, DY);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var active = glyphs.length ? Math.floor(t / BREATH_SLOT) % glyphs.length : -1;
    var frac = (t % BREATH_SLOT) / BREATH_SLOT;
    var pulse = Math.sin(Math.PI * frac);
    for (var i = 0; i < glyphs.length; i++) {
      drawGlyph(glyphs[i], i === active ? 1 + 0.02 * pulse : 1);
    }

    // tiny mono caption, top-left: the only text in the piece.
    // It sits on a small patch of bare field so it stays legible
    // where a glyph passes behind it.
    var monoSize = Math.max(9, Math.min(W, H) * 0.019);
    ctx.font = monoSize + 'px monospace';
    ctx.textBaseline = 'top';
    var capText = 'FRACTURA 2026 x ATELIER';
    var capX = W * 0.028, capY = H * 0.024;
    var capW = ctx.measureText(capText).width;
    ctx.fillStyle = BG;
    ctx.fillRect(capX - monoSize * 0.35, capY - monoSize * 0.3, capW + monoSize * 0.7, monoSize * 1.6);
    ctx.fillStyle = FG;
    ctx.fillText(capText, capX, capY);
  }

  resize();
  draw(PHASE);

  if (typeof requestAnimationFrame === 'function') {
    var start = null, prev = null;
    var loop = function (now) {
      if (start === null) { start = now; prev = now; }
      var dt = Math.min(0.05, (now - prev) / 1000); prev = now;
      stepPhysics(dt);
      draw(PHASE + (now - start) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
