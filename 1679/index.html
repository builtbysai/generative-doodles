<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day Garden (50 of 5000)</title>
<style>
html, body { margin: 0; padding: 0; background: #F0E7D3; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F0E7D3';
var PINK = '#D9A8A0';
var GRAY = '#B9B0A2';
var AMBER = '#E3B34E';
var HORIZON = '#D98A2B';
var INK = '#2B2620';
var PLATE = '#2B2620';
var PLATE_LINE = 'rgba(240,231,211,0.45)';
var TITLE_INK = '#F0E7D3';
var HINT_INK = '#F0E7D3';
var FIRST_T = 0;
/* DRIVER: the algorithm proposes thousands, taste disposes until one
   remains; the selection sweep IS the piece. A dense grid of tiny
   seeded color-geometry studies thins in waves, 50 then 12 then 1.
   The survivor blooms from its cell to fill the frame, holds in
   silence, and the grid returns. */
var SWEEP_END = 90, BLOOM_END = 105, HOLD_END = 165, PERIOD = 170;
var STAGE50_END = 60, STAGE12_END = 78;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* Deterministic hash noise in [0, 1), from an integer key. */
function hash01(n) {
  var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
  gridCache = null;
}
/* ---- thumbnail bank: one seeded study per grid cell ---- */
var PALETTE = [PAPER, PINK, GRAY, AMBER];
function harmonyOf(colors) {
  /* Artist-tuned pairing table: cream with amber or pink sings,
     three busy colors crowd each other. */
  var key = colors.slice().sort().join('|');
  var table = {};
  table[PAPER + '|' + AMBER] = 1.0;
  table[PAPER + '|' + PINK] = 0.92;
  table[PAPER + '|' + GRAY] = 0.86;
  table[GRAY + '|' + PINK] = 0.72;
  table[AMBER + '|' + PINK] = 0.62;
  table[AMBER + '|' + GRAY] = 0.76;
  if (table[key] !== undefined) return table[key];
  return 0.66;
}
function tileParams(idx) {
  var rng = mulberry32(167900 + idx * 7919);
  var r = rng();
  var type = r < 0.38 ? 'planes' : (r < 0.68 ? 'diag' : 'horizon');
  var p = { idx: idx, type: type, shapes: 2, cream: 0.5, harmony: 0.8 };
  var i, c;
  if (type === 'planes') {
    var horiz = rng() < 0.6;
    var n = 2 + Math.floor(rng() * 2);
    var cuts = [];
    for (i = 0; i < n - 1; i++) cuts.push(0.18 + rng() * 0.64);
    cuts.sort(function (a, b) { return a - b; });
    var bands = [];
    var used = {};
    var creamArea = 0;
    var prev = 0;
    for (i = 0; i < n; i++) {
      var end = i < n - 1 ? cuts[i] : 1;
      c = PALETTE[Math.floor(rng() * PALETTE.length)];
      bands.push({ a: prev, b: end, color: c });
      if (c === PAPER) creamArea += end - prev;
      used[c] = true;
      prev = end;
    }
    var distinct = [];
    for (c in used) distinct.push(c);
    p.horiz = horiz;
    p.bands = bands;
    p.shapes = n;
    p.cream = creamArea;
    p.harmony = harmonyOf(distinct);
  } else if (type === 'diag') {
    var dir = rng() < 0.5 ? 1 : -1;
    var c1 = PALETTE[Math.floor(rng() * PALETTE.length)];
    var c2 = PALETTE[Math.floor(rng() * PALETTE.length)];
    if (c2 === c1) c2 = c1 === PAPER ? PINK : PAPER;
    var stripe = rng() < 0.45;
    p.dir = dir;
    p.c1 = c1; p.c2 = c2;
    p.stripe = stripe;
    p.stripeColor = stripe ? (rng() < 0.5 ? AMBER : PINK) : null;
    p.shapes = stripe ? 3 : 2;
    p.cream = (c1 === PAPER ? 0.5 : 0) + (c2 === PAPER ? 0.5 : 0);
    p.harmony = harmonyOf([c1, c2]);
  } else {
    var ly = 0.35 + rng() * 0.35;
    var lt = 0.02 + rng() * 0.03;
    var strip = rng() < 0.5;
    var sh = strip ? 0.06 + rng() * 0.09 : 0;
    p.lineY = ly;
    p.lineT = lt;
    p.strip = strip;
    p.stripH = sh;
    p.shapes = strip ? 2 : 1;
    p.cream = 1 - lt - sh;
    p.harmony = 1.0;
  }
  /* Score: breathing room first, then simplicity, then harmony.
     Horizon studies breathe most, so the best horizon study is the
     natural survivor; the score itself is never shown. */
  var simplicity = 1 - (p.shapes - 1) / 6;
  p.score = 0.55 * p.cream + 0.30 * simplicity + 0.15 * p.harmony;
  return p;
}
/* ---- grid layout, cached per viewport size ---- */
var gridCache = null;
function grid() {
  if (gridCache && gridCache.vw === VW && gridCache.vh === VH) return gridCache;
  var cols = clamp(Math.round(VW / 68), 5, 22);
  var rows = clamp(Math.round(VH / 68), 6, 16);
  var cw = VW / cols, ch = VH / rows;
  var tiles = [], i, r;
  for (i = 0; i < cols * rows; i++) tiles.push(tileParams(i));
  /* Survivor: the highest-scoring horizon study. It leads the keep
     order, then every other tile follows by score. */
  var survivor = null;
  for (i = 0; i < tiles.length; i++) {
    if (tiles[i].type === 'horizon' && (!survivor || tiles[i].score > survivor.score)) survivor = tiles[i];
  }
  var order = tiles.slice();
  order.sort(function (a, b) {
    if (a === survivor) return -1;
    if (b === survivor) return 1;
    return b.score - a.score;
  });
  for (r = 0; r < order.length; r++) order[r].rank = r;
  for (i = 0; i < tiles.length; i++) {
    var col = i % cols, row = Math.floor(i / cols);
    tiles[i].x = col * cw + 1;
    tiles[i].y = row * ch + 1;
    tiles[i].w = cw - 2;
    tiles[i].h = ch - 2;
    tiles[i].cx = col * cw + cw / 2;
    tiles[i].cy = row * ch + ch / 2;
  }
  gridCache = { vw: VW, vh: VH, cols: cols, rows: rows, tiles: tiles, survivor: survivor, count: tiles.length };
  return gridCache;
}
/* ---- per-tile alpha: closed-form function of piece time ---- */
function tileAlpha(tile, t) {
  if (t < SWEEP_END) {
    var start, dur;
    if (tile.rank >= 50) {
      start = (tile.cx / VW) * 38 + hash01(tile.idx * 5 + 1) * 17;
      dur = 5;
    } else if (tile.rank >= 12) {
      start = STAGE50_END + (tile.cx / VW) * 8 + hash01(tile.idx * 5 + 3) * 6;
      dur = 4;
    } else if (tile.rank >= 1) {
      start = STAGE12_END + hash01(tile.idx * 5 + 7) * 8;
      dur = 4;
    } else {
      return 1;
    }
    return 1 - smooth(clamp((t - start) / dur, 0, 1));
  }
  if (t < BLOOM_END) return tile.rank === 0 ? 1 : 0;
  if (t < HOLD_END) return tile.rank === 0 ? 1 : 0;
  /* Return: the grid fades back in, staggered, over five seconds. */
  return smooth(clamp(((t - HOLD_END) - hash01(tile.idx * 5 + 11) * 2) / 1.5, 0, 1));
}
function cycleAt(t) {
  var mod = ((t % PERIOD) + PERIOD) % PERIOD;
  if (mod < SWEEP_END) return { phase: 'sweep', local: mod };
  if (mod < BLOOM_END) return { phase: 'bloom', local: mod - SWEEP_END };
  if (mod < HOLD_END) return { phase: 'hold', local: mod - BLOOM_END };
  return { phase: 'return', local: mod - HOLD_END };
}
/* ---- drawing one study, at any rect ---- */
function drawStudy(p, x, y, w, h) {
  if (p.type === 'planes') {
    var i, b;
    for (i = 0; i < p.bands.length; i++) {
      b = p.bands[i];
      ctx.fillStyle = b.color;
      if (p.horiz) ctx.fillRect(x, y + b.a * h, w, (b.b - b.a) * h + 0.5);
      else ctx.fillRect(x + b.a * w, y, (b.b - b.a) * w + 0.5, h);
    }
  } else if (p.type === 'diag') {
    ctx.fillStyle = p.c1;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = p.c2;
    ctx.beginPath();
    if (p.dir === 1) {
      ctx.moveTo(x, y + h);
      ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + h);
      ctx.closePath();
    } else {
      ctx.moveTo(x, y);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      ctx.closePath();
    }
    ctx.fill();
    if (p.stripe) {
      ctx.strokeStyle = p.stripeColor;
      ctx.lineWidth = Math.max(1, Math.min(w, h) * 0.045);
      ctx.beginPath();
      if (p.dir === 1) {
        ctx.moveTo(x + w * 0.18, y + h);
        ctx.lineTo(x + w, y + h * 0.18);
      } else {
        ctx.moveTo(x + w * 0.18, y);
        ctx.lineTo(x + w, y + h * 0.82);
      }
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = PAPER;
    ctx.fillRect(x, y, w, h);
    if (p.strip) {
      ctx.fillStyle = PINK;
      ctx.fillRect(x, y + (p.lineY + p.lineT) * h, w, p.stripH * h + 0.5);
    }
    ctx.fillStyle = HORIZON;
    ctx.fillRect(x, y + p.lineY * h, w, Math.max(1, p.lineT * h));
  }
}
/* Sparse deterministic paper grain, flat speckles only. */
function drawGrain(x, y, w, h, alpha) {
  var n = clamp(Math.floor(w * h / 2600), 80, 900);
  var i, gx, gy, a;
  for (i = 0; i < n; i++) {
    gx = x + hash01(i * 3 + 11) * w;
    gy = y + hash01(i * 7 + 23) * h;
    a = (0.02 + 0.035 * hash01(i * 13 + 5)) * alpha;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#8A7F70';
    ctx.fillRect(gx, gy, 1.4, 1.4);
  }
  ctx.globalAlpha = 1;
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Day Garden (50 of 5000)').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Day Garden (50 of 5000)').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 17').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Day Garden (50 of 5000)', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 17', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the garden choose.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var g = grid();
  var cyc = cycleAt(t);
  var i, tile;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  if (cyc.phase === 'bloom') {
    var f = smooth(clamp(cyc.local / 15, 0, 1));
    var s = g.survivor;
    var rx = lerp(s.x, 0, f), ry = lerp(s.y, 0, f);
    var rw = lerp(s.w, VW, f), rh = lerp(s.h, VH, f);
    drawStudy(s, rx, ry, rw, rh);
    if (f > 0.6) drawGrain(rx, ry, rw, rh, (f - 0.6) / 0.4);
  } else if (cyc.phase === 'hold') {
    var s2 = g.survivor;
    drawStudy(s2, 0, 0, VW, VH);
    drawGrain(0, 0, VW, VH, 1);
  } else {
    if (cyc.phase === 'return') {
      var u = clamp(cyc.local / 5, 0, 1);
      var s3 = g.survivor;
      var survA = 1 - smooth(clamp(u / 0.5, 0, 1));
      if (survA > 0) {
        ctx.globalAlpha = survA;
        drawStudy(s3, 0, 0, VW, VH);
        ctx.globalAlpha = 1;
      }
    }
    for (i = 0; i < g.tiles.length; i++) {
      tile = g.tiles[i];
      var a = tileAlpha(tile, t);
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      drawStudy(tile, tile.x, tile.y, tile.w, tile.h);
    }
    ctx.globalAlpha = 1;
    if (cyc.phase === 'sweep' && cyc.local < STAGE50_END) {
      var bx = (cyc.local / STAGE50_END) * VW;
      ctx.globalAlpha = 0.09;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(bx - 30, 0, 60, VH);
      ctx.globalAlpha = 1;
    }
  }
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    cycleAt: function (t) { return cycleAt(t); },
    tileCount: function () { size(); return grid().count; },
    survivorIdx: function () { size(); return grid().survivor.idx; },
    aliveAt: function (t) {
      size();
      var g = grid(), n = 0, i;
      for (i = 0; i < g.tiles.length; i++) if (tileAlpha(g.tiles[i], t) > 0.01) n++;
      return n;
    }
  };
}
/* ---- frame one: t = 0, the full dense grid, nothing yet refused ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
