<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Producer's Piano</title>
<style>
  html, body { margin:0; padding:0; background:#0D0D0C; height:100%; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // Palette (strict)
  var COL_BG     = "#0D0D0C";  // studio black
  var COL_AMBER  = "#E08A1E";  // pulse amber
  var COL_RIPPLE = "#4A3A20";  // ripple
  var COL_SLATE  = "#3A3F44";  // riff-lines
  var COL_FLOOR  = "#1E1C18";  // floor sheen

  var BEAT = 0.6;              // 100 BPM, exactly; never changes
  var NOTE_HZ = 220;           // one note, forever
  var RIPPLE_LIFE = 2.4;       // four beats of travel

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1, minDim = 0, cx = 0, cyMid = 0, horizon = 0, baseY = 0;

  function isPhone() {
    try {
      if (window.screen) {
        var m = Math.min(window.screen.width || 0, window.screen.height || 0);
        if (m > 0) return m < 700;
      }
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    minDim = Math.min(W, H);
    cx = W / 2;
    cyMid = H * 0.44;
    horizon = H * 0.70;
    baseY = H * 0.80;
  }

  // Seeded RNG
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Riff-lines: closed-form parametric wanderers (seeded Lissajous family)
  var SEED0 = 836005;
  var generation = 0;
  var lines = [];

  function buildLines() {
    var rnd = mulberry32(SEED0 + generation * 7919);
    lines = [];
    var n = 6;
    for (var i = 0; i < n; i++) {
      lines.push({
        // stratified: one line per angular sector and radius band, so the
        // tangle reads as distinct orbits around the column, not a scribble
        baseAngle: (i / n) * Math.PI * 2 + (rnd() - 0.5) * 0.6,
        orbit: (0.03 + rnd() * 0.06) * (rnd() < 0.5 ? -1 : 1),
        R: 0.19 + i * 0.032 + rnd() * 0.02,   // fraction of minDim
        sweep: 0.9 + rnd() * 0.9,             // angular extent, radians
        wobK: 1 + Math.floor(rnd() * 2),
        wobAmp: 0.06 + rnd() * 0.08,
        wobSpeed: (0.2 + rnd() * 0.5) * (rnd() < 0.5 ? -1 : 1),
        phase: rnd() * Math.PI * 2
      });
    }
  }

  // Drag influence: recorded control events, evaluated closed-form.
  // hold events pin the pressure; a release event decays it exponentially.
  var inflEvents = []; // {t, v, rel}
  function inflAt(t) {
    for (var i = inflEvents.length - 1; i >= 0; i--) {
      var e = inflEvents[i];
      if (e.t <= t) {
        if (e.rel) return e.v * Math.exp(-(t - e.t) / 1.1);
        return e.v;
      }
    }
    return 0;
  }

  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16),
        g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }

  function drawRipples(t, flash) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, horizon, W, H - horizon);
    ctx.clip();
    // floor pool under the column, breathing with the flash
    var poolRx = W * 0.17, poolRy = poolRx * 0.26;
    ctx.fillStyle = rgba(COL_RIPPLE, 0.16 + 0.10 * flash);
    ctx.beginPath(); ctx.ellipse(cx, baseY, poolRx, poolRy, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(COL_AMBER, 0.05 * flash);
    ctx.beginPath(); ctx.ellipse(cx, baseY, poolRx * 0.6, poolRy * 0.6, 0, 0, Math.PI * 2); ctx.fill();

    var kMax = Math.floor(t / BEAT);
    var kMin = Math.ceil((t - RIPPLE_LIFE) / BEAT);
    for (var k = kMin; k <= kMax; k++) {
      var age = t - k * BEAT;
      if (age < 0 || age > RIPPLE_LIFE) continue;
      var pr = age / RIPPLE_LIFE;
      var rx = 6 + pr * (W * 0.47 - 6);
      var ry = rx * 0.26;
      var a = Math.pow(1 - pr, 1.6) * 0.85;
      ctx.strokeStyle = rgba(COL_RIPPLE, a);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(cx, baseY, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
      if (age < BEAT) { // the newborn ring still carries the flash's amber
        ctx.strokeStyle = rgba(COL_AMBER, (1 - age / BEAT) * 0.35);
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(cx, baseY, rx * 0.92, ry * 0.92, 0, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawRiffLines(t, infl) {
    var spread = 1 + 0.38 * infl;
    var minD = Math.max(minDim * 0.045, minDim * 0.085 * (1 + 0.30 * infl));
    var SAMPLES = 56;
    ctx.strokeStyle = rgba(COL_SLATE, 0.92);
    ctx.lineWidth = Math.max(1.4, minDim * 0.0035);
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    for (var li = 0; li < lines.length; li++) {
      var L = lines[li];
      var prevSide = 0, inGap = false;
      ctx.beginPath();
      for (var si = 0; si <= SAMPLES; si++) {
        var s = si / SAMPLES;
        var ang = L.baseAngle + L.orbit * t + L.sweep * (s - 0.5);
        var rad = L.R * minDim * (1 + L.wobAmp * Math.sin(L.wobK * 6.2831853 * s + L.wobSpeed * t + L.phase));
        var x = cx + Math.cos(ang) * rad;
        var y = cyMid + Math.sin(ang) * rad * 0.82;
        // drag pressure: bend toward / away from the column, radially in x
        var dx = (x - cx) * spread;
        x = cx + dx;
        // minimum-distance rule: a riff-line never touches the column.
        // Samples inside the keep-out band are a gap: the stroke ends at the
        // band's edge and resumes on exit, instead of tracing the boundary.
        var clamped = Math.abs(dx) < minD;
        if (clamped) x = cx + (dx < 0 ? -minD : minD);
        var side = dx < 0 ? -1 : 1;
        if (si === 0) ctx.moveTo(x, y);
        else if (clamped && inGap) { /* inside the band: pen stays up */ }
        else if (!clamped && inGap) ctx.moveTo(x, y);
        else if (!clamped && side !== prevSide) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        inGap = clamped;
        prevSide = side;
      }
      ctx.stroke();
    }
  }

  function drawColumn(flash) {
    var coreW = Math.max(5, W * 0.007);
    var layers = [
      [7.0, 0.05 + 0.05 * flash],
      [3.6, 0.09 + 0.08 * flash],
      [1.9, 0.15 + 0.13 * flash]
    ];
    var i, w;
    for (i = 0; i < layers.length; i++) {
      w = coreW * layers[i][0];
      ctx.fillStyle = rgba(COL_AMBER, layers[i][1]);
      ctx.fillRect(cx - w / 2, 0, w, H);
    }
    ctx.fillStyle = rgba(COL_AMBER, 0.38 + 0.62 * flash);
    ctx.fillRect(cx - coreW / 2, 0, coreW, H);
    // bright heart at flash peak
    if (flash > 0.02) {
      ctx.fillStyle = rgba(COL_AMBER, 0.55 * flash);
      ctx.fillRect(cx - coreW * 0.22, 0, coreW * 0.44, H);
    }
  }

  function draw(t) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = COL_BG;
    ctx.fillRect(0, 0, W, H);
    // floor plane
    ctx.fillStyle = COL_FLOOR;
    ctx.fillRect(0, horizon, W, H - horizon);

    var beatPos = t / BEAT;
    var phase = beatPos - Math.floor(beatPos);
    var flash = Math.exp(-phase * 3.2); // 1 exactly on the beat

    drawRipples(t, flash);
    drawRiffLines(t, inflAt(t));
    drawColumn(flash);
  }

  // Piece clock: anchored at load; frame one is draw(0), never wall-clock derived.
  var startPerf = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  function tNow() {
    if (typeof performance !== "undefined" && performance.now) {
      return (performance.now() - startPerf) / 1000;
    }
    return 0;
  }

  // Audio: one pluck per beat, same pitch, started on first tap only.
  var AC = null, master = null, audioOn = false, nextBeat = 0;

  function initAudio() {
    if (audioOn) return;
    var Ctor = null;
    if (typeof window !== "undefined") Ctor = window.AudioContext || window.webkitAudioContext;
    if (typeof Ctor !== "function") return;
    try {
      AC = new Ctor();
      var comp = AC.createDynamicsCompressor();
      master = AC.createGain();
      master.gain.value = 0.5;
      master.connect(comp);
      comp.connect(AC.destination);
      nextBeat = Math.ceil(tNow() / BEAT);
      audioOn = true;
    } catch (e) {
      AC = null; master = null; audioOn = false;
    }
  }

  function pluck(when) {
    var f = NOTE_HZ;
    var flt = AC.createBiquadFilter();
    flt.type = "lowpass"; flt.frequency.value = 1400; flt.Q.value = 0.4;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(0.42, when + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0008, when + 0.9);
    flt.connect(g); g.connect(master);
    var parts = [[1, "triangle", 1.0], [2, "sine", 0.35], [3.01, "sine", 0.12]];
    for (var i = 0; i < parts.length; i++) {
      var o = AC.createOscillator();
      o.type = parts[i][1];
      o.frequency.value = f * parts[i][0];
      var og = AC.createGain(); og.gain.value = parts[i][2];
      o.connect(og); og.connect(flt);
      o.start(when); o.stop(when + 1.0);
    }
  }

  function scheduleAudio() {
    if (!audioOn || !AC) return;
    if (AC.state === "suspended" && AC.resume) { /* resumed on gesture */ }
    var horizonT = AC.currentTime + 0.18;
    for (;;) {
      var when = AC.currentTime + (nextBeat * BEAT - tNow());
      if (when > horizonT) break;
      if (when >= AC.currentTime - 0.05) pluck(Math.max(when, AC.currentTime));
      nextBeat++;
    }
  }

  // Interaction
  var dragging = false, dragAnchorX = 0, dragAnchorY = 0, dragMoved = 0,
      downT = 0, lastInflPush = -1, lastTapT = -10;

  function pointerPos(e) {
    return { x: e.clientX, y: e.clientY };
  }

  canvas.addEventListener("pointerdown", function (e) {
    initAudio();
    if (AC && AC.state === "suspended" && AC.resume) AC.resume();
    var p = pointerPos(e);
    dragging = true; dragMoved = 0;
    dragAnchorX = p.x; dragAnchorY = p.y;
    downT = tNow(); lastInflPush = -1;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var p = pointerPos(e);
    var dx = p.x - dragAnchorX, dy = p.y - dragAnchorY;
    dragMoved = Math.max(dragMoved, Math.sqrt(dx * dx + dy * dy));
    var now = tNow();
    if (now - lastInflPush > 0.04) {
      lastInflPush = now;
      var v = dx / (0.25 * W);
      if (v > 1) v = 1; if (v < -1) v = -1;
      inflEvents.push({ t: now, v: v, rel: false });
      if (inflEvents.length > 400) inflEvents.splice(0, inflEvents.length - 400);
    }
  });

  function endPointer(e) {
    if (!dragging) return;
    dragging = false;
    var now = tNow();
    var v = 0;
    for (var i = inflEvents.length - 1; i >= 0; i--) {
      if (!inflEvents[i].rel) { v = inflEvents[i].v; break; }
    }
    inflEvents.push({ t: now, v: v, rel: true });
    // tap / double-tap
    if (now - downT < 0.3 && dragMoved < 8) {
      if (now - lastTapT < 0.33) {
        generation++;
        buildLines();
        lastTapT = -10;
      } else {
        lastTapT = now;
      }
    }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  // Boot
  buildLines();
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", resize);
  }
  window.addEventListener("resize", resize);
  draw(0);

  if (typeof requestAnimationFrame === "function") {
    var loop = function () {
      draw(tNow());
      scheduleAudio();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
