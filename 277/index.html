<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.277 Target</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EFE6D2; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.277 Target (Njalikwa Chongwe).
// After her hand-painted medallions: a wobbly spiral target
// in terracotta, cream and cobalt on a crackled cream ground,
// green bleeding in at the rim, drawn stroke by stroke, ring
// by ring, the ochre spiral last. Watch only: there are no
// interaction handlers.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#EFE6D2', CRACKLE = '#8A8272', TERRA = '#B85C2E';
var CREAM = '#F5EEDC', COBALT = '#2E4EA3', OCHRE = '#C98F2D', RIM = '#7FA88F';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var T = 8, lastNow = -1; // frame one: loop at about 8s, several rings already drawn

function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- seeded 1D value noise ----------------------------------------------
// Coarse knots wrapped periodically so the wobble joins up
// around the full circle, smoothstep interpolated between
// knots. Each ring gets its own knot set and phase.
function makeNoise(seed, knots, amp) {
  var r = rng(seed), vals = [], i;
  for (i = 0; i < knots; i++) vals.push((r() * 2 - 1) * amp);
  return { vals: vals, knots: knots };
}
function noiseAt(n, u) {
  var x = u * n.knots;
  var i0 = Math.floor(x) % n.knots;
  var i1 = (i0 + 1) % n.knots;
  var f = x - Math.floor(x);
  var s = f * f * (3 - 2 * f);
  return n.vals[i0] + (n.vals[i1] - n.vals[i0]) * s;
}

// ---- the medallion --------------------------------------------------------
// Centred at 640, 450 in the 1280 by 900 design space. Outer
// radius 270, so the medallion spans 540 design px, about
// 60 percent of the frame height.
var CX = 640, CY = 450;
var RING_R = [95, 130, 165, 200, 235, 270];
var RING_C = [COBALT, CREAM, TERRA, COBALT, CREAM, TERRA];
var RING_W = [20, 22, 24, 22, 24, 26];
var ringNoise = [], ringNoise2 = [], ringAlpha = [];
(function () {
  var r = rng(27711);
  for (var k = 0; k < RING_R.length; k++) {
    ringNoise.push(makeNoise(27711 + k * 131, 9, 4.2));
    ringNoise2.push(makeNoise(27711 + 900 + k * 57, 17, 1.8));
    ringAlpha.push(0.86 + r() * 0.13);
  }
})();
var RING_STEPS = 180;
function ringPoint(k, i) {
  var u = i / RING_STEPS;
  var th = u * Math.PI * 2;
  var rad = RING_R[k] + noiseAt(ringNoise[k], u) + noiseAt(ringNoise2[k], u);
  if (rad < 18) rad = 18; // enforced minimum, never collapses
  return [CX + Math.cos(th) * rad, CY + Math.sin(th) * rad];
}
// Archimedean spiral centre: r = a + b * theta, five turns,
// outer radius about 68, drawn last.
var SP_TURNS = 5, SP_MAX = SP_TURNS * Math.PI * 2;
var SP_A = 6, SP_B = (68 - SP_A) / SP_MAX;
var SP_STEPS = 260;
var spNoise = makeNoise(27799, 23, 1.6);
function spiralPoint(i, total) {
  var u = i / total;
  var th = u * SP_MAX;
  var rad = SP_A + SP_B * th + noiseAt(spNoise, u);
  return [CX + Math.cos(th) * rad, CY + Math.sin(th) * rad];
}

// ---- the crackle ground ---------------------------------------------------
// A seeded fine crack network stored as polyline data and
// drawn each frame at low alpha. No offscreen canvas.
var cracks = [];
(function () {
  var r = rng(27741);
  for (var k = 0; k < 110; k++) {
    var x = r() * DW, y = r() * DH;
    var ang = r() * Math.PI * 2;
    var segs = 4 + Math.floor(r() * 8);
    var pts = [[x, y]];
    for (var i = 0; i < segs; i++) {
      ang += (r() - 0.5) * 1.1;
      var len = 14 + r() * 30;
      x += Math.cos(ang) * len;
      y += Math.sin(ang) * len;
      pts.push([x, y]);
    }
    cracks.push(pts);
  }
})();

function draw() {
  var lt = T % 30;
  // fade: hold until 26s, then the medallion fades out over
  // the last 4s as the fresh ground comes back underneath
  var medAlpha = 1;
  if (lt > 26) medAlpha = (30 - lt) / 4;
  if (medAlpha < 0) medAlpha = 0;
  if (medAlpha > 1) medAlpha = 1;

  ctx.fillStyle = GROUND;
  ctx.fillRect(-20, -20, DW + 40, DH + 40);

  // rim bleed: a green band at the frame edge at low alpha,
  // layered strokes so the bleed softens inward, under the
  // crackle
  ctx.strokeStyle = RIM;
  ctx.globalAlpha = 0.13;
  ctx.lineWidth = 44;
  ctx.strokeRect(0, 0, DW, DH);
  ctx.globalAlpha = 0.18;
  ctx.lineWidth = 24;
  ctx.strokeRect(0, 0, DW, DH);
  ctx.globalAlpha = 0.26;
  ctx.lineWidth = 10;
  ctx.strokeRect(0, 0, DW, DH);
  ctx.globalAlpha = 1;

  // crackle ground, drawn every frame from the stored data
  ctx.strokeStyle = CRACKLE;
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.22;
  ctx.beginPath();
  for (var c = 0; c < cracks.length; c++) {
    var pts = cracks[c];
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var p = 1; p < pts.length; p++) ctx.lineTo(pts[p][0], pts[p][1]);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  if (medAlpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = medAlpha;

  // rings draw outward one by one: each ring takes 2.2s,
  // revealed along the angle, so the six rings complete at
  // 13.2s and frame one at 8s shows three full rings plus
  // the fourth part drawn
  var RING_DUR = 2.2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (var k = 0; k < RING_R.length; k++) {
    var f = (lt - k * RING_DUR) / RING_DUR;
    if (f <= 0) continue;
    if (f > 1) f = 1;
    var upto = Math.floor(f * RING_STEPS);
    if (upto < 1) continue;
    ctx.strokeStyle = RING_C[k];
    ctx.lineWidth = RING_W[k];
    // one seeded alpha per ring, so the hand-painted
    // unevenness sits between rings, not in dotted joints
    ctx.globalAlpha = medAlpha * ringAlpha[k];
    ctx.beginPath();
    for (var i = 0; i <= upto; i++) {
      var q = ringPoint(k, i % RING_STEPS);
      if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
    }
    ctx.stroke();
    ctx.globalAlpha = medAlpha;
  }

  // the ochre spiral draws last, 13.2s to 17s
  var sf = (lt - RING_R.length * RING_DUR) / 3.8;
  if (sf > 0) {
    if (sf > 1) sf = 1;
    var sup = Math.floor(sf * SP_STEPS);
    if (sup >= 1) {
      ctx.strokeStyle = OCHRE;
      ctx.lineWidth = 13;
      ctx.globalAlpha = medAlpha * 0.96;
      ctx.beginPath();
      for (var j = 0; j <= sup; j++) {
        var sp = spiralPoint(j, SP_STEPS);
        if (j === 0) ctx.moveTo(sp[0], sp[1]); else ctx.lineTo(sp[0], sp[1]);
      }
      ctx.stroke();
      ctx.globalAlpha = medAlpha;
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the medallion keeps its shape at any aspect,
  // with the page ground in the piece's ground cream
  var S = Math.min(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
