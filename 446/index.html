<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jewel Beast</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#FDFBFA; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  // deterministic PRNG (mulberry32, fixed seed)
  function RNG(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // fur-edge tufts: fixed seeded jitter (local unit coords, angle, length)
  var tufts = [];
  (function () {
    var r = RNG(446001);
    var base = [
      [-0.33, 0.00, -2.9], [-0.32, 0.25, -2.7], [-0.28, 0.40, -2.5],
      [0.31, 0.00, -0.2], [0.31, 0.28, -0.5], [0.28, 0.40, -0.7],
      [-0.14, -0.38, -2.8], [0.26, -0.38, -0.3]
    ];
    for (var i = 0; i < base.length; i++) {
      tufts.push({ x: base[i][0] + (r() - 0.5) * 0.03, y: base[i][1] + (r() - 0.5) * 0.03, a: base[i][2], l: 0.05 + r() * 0.03 });
    }
  })();

  // fawn spots (local unit coords on the fawn body)
  var spots = [];
  (function () {
    var r = RNG(446002);
    var guard = 0;
    while (spots.length < 14 && guard++ < 300) {
      var u = (r() - 0.5) * 0.44, v = (r() - 0.5) * 0.22;
      if (u * u / 0.052 + v * v / 0.014 > 1) continue;
      spots.push({ u: u, v: v, s: 0.012 + r() * 0.014 });
    }
  })();

  var PAIRINGS = ['cat', 'fawn', 'hare', 'owl'];
  var pairingIndex = 0;            // fixed authored table, index 0 at load
  var userLight = -2.25;           // drag-set light angle (upper left at load)
  var PHASE0 = 1.5;                // constant first-frame loop phase (seconds)

  var BLUE_DARK = '#0E1E5B', BLUE = '#1E3A8A', BLUE_MID = '#2E4B9E';
  var GOLD = '#D4A017', GOLD_LITE = '#F5D78E', GEM = '#3AA6D8';
  var GROUND = '#FDFBFA', PINK = '#F2D5D8';

  function animalCenter() { return { x: W / 2, y: H * 0.52 }; }

  // ---- shared helpers (all drawing in local unit space, origin at animal centre) ----
  function eye(x, y, r, lx, ly) {
    ctx.fillStyle = BLUE_DARK;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(x + lx * r * 0.38, y + ly * r * 0.38 - r * 0.08, r * 0.30, 0, Math.PI * 2); ctx.fill();
  }
  function furTuft(x, y, a, l) {
    ctx.strokeStyle = BLUE_DARK; ctx.lineWidth = 0.008; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a - 0.35) * l, y + Math.sin(a - 0.35) * l);
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a + 0.35) * l, y + Math.sin(a + 0.35) * l);
    ctx.stroke();
  }
  function whiskers(x, y, dir) {
    ctx.strokeStyle = 'rgba(14,30,91,0.55)'; ctx.lineWidth = 0.005; ctx.lineCap = 'round';
    for (var i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(x, y + i * 0.022);
      ctx.quadraticCurveTo(x + dir * 0.10, y + i * 0.03, x + dir * 0.19, y + i * 0.045);
      ctx.stroke();
    }
  }
  function star4(x, y, r, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4 - Math.PI / 2;
      var rr = (i % 2 === 0) ? r : r * 0.16;
      var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // facet brightness from the rotating 8s glint sweep
  function facetAlpha(sweep, facetAngle) {
    var d = Math.cos(sweep - facetAngle);
    return 0.10 + 0.55 * (0.5 + 0.5 * d);
  }

  // ---- jewels (local unit coords) ----
  function emeraldRing(px, py, t, la, lx, ly) {
    var sweep = (t % 8) / 8 * Math.PI * 2;
    // gold band wrapped around the paw
    ctx.strokeStyle = GOLD; ctx.lineWidth = 0.035;
    ctx.beginPath(); ctx.ellipse(px, py + 0.02, 0.085, 0.055, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = GOLD_LITE; ctx.lineWidth = 0.010;
    ctx.beginPath(); ctx.ellipse(px, py + 0.02, 0.085, 0.055, 0, -2.4, -0.6); ctx.stroke();
    // emerald-cut gem: rectangle with cut corners, sitting on top of the paw
    var gx = px, gy = py - 0.075, w = 0.095, h = 0.075, cut = 0.022;
    ctx.fillStyle = GEM;
    ctx.beginPath();
    ctx.moveTo(gx - w + cut, gy - h); ctx.lineTo(gx + w - cut, gy - h);
    ctx.lineTo(gx + w, gy - h + cut); ctx.lineTo(gx + w, gy + h - cut);
    ctx.lineTo(gx + w - cut, gy + h); ctx.lineTo(gx - w + cut, gy + h);
    ctx.lineTo(gx - w, gy + h - cut); ctx.lineTo(gx - w, gy - h + cut);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = GOLD; ctx.lineWidth = 0.008;
    ctx.stroke();
    // hard facets: four corner triangles + central table
    var corners = [
      [-1, -1, -0.5], [1, -1, 0.9], [1, 1, 2.2], [-1, 1, -2.6]
    ];
    for (var i = 0; i < 4; i++) {
      var sx = corners[i][0], sy = corners[i][1];
      ctx.fillStyle = 'rgba(255,255,255,' + facetAlpha(sweep, corners[i][2]).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.lineTo(gx + sx * w, gy + sy * (h - cut));
      ctx.lineTo(gx + sx * (w - cut), gy + sy * h);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(245,215,142,' + (0.18 + 0.20 * (0.5 + 0.5 * Math.cos(sweep))).toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(gx - w * 0.55, gy - h * 0.55); ctx.lineTo(gx + w * 0.55, gy - h * 0.55);
    ctx.lineTo(gx + w * 0.55, gy + h * 0.55); ctx.lineTo(gx - w * 0.55, gy + h * 0.55);
    ctx.closePath(); ctx.fill();
    // 4-point star sparkles on glint peaks
    star4(gx - w * 0.6, gy - h * 0.6, 0.035, Math.pow(Math.max(0, Math.cos(sweep - 0.5)), 6));
    star4(gx + w * 0.65, gy + h * 0.55, 0.028, Math.pow(Math.max(0, Math.cos(sweep - 2.4)), 6));
    star4(gx + w * 0.2, gy - h * 0.7, 0.022, Math.pow(Math.max(0, Math.cos(sweep - 4.2)), 6));
  }
  function diamondPendant(cx, cy, t, la, lx, ly, half, topOff) {
    var sweep = (t % 8) / 8 * Math.PI * 2;
    // gold chain: two bows from the neck down to the pendant bead, always joined
    var topY = cy + topOff, beadY = cy - 0.02;
    ctx.strokeStyle = GOLD; ctx.lineWidth = 0.010; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - half, topY);
    ctx.quadraticCurveTo(cx - half * 0.4, (topY + beadY) / 2 + 0.02, cx, beadY);
    ctx.quadraticCurveTo(cx + half * 0.4, (topY + beadY) / 2 + 0.02, cx + half, topY);
    ctx.stroke();
    ctx.fillStyle = GOLD;
    ctx.beginPath(); ctx.arc(cx, cy - 0.02, 0.014, 0, Math.PI * 2); ctx.fill();
    // brilliant-cut diamond: crown trapezoid + pavilion point
    var w = 0.085, ch = 0.045, ph = 0.10;
    ctx.fillStyle = '#EAF6FC';
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.62, cy); ctx.lineTo(cx + w * 0.62, cy);
    ctx.lineTo(cx + w, cy + ch); ctx.lineTo(cx - w, cy + ch);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#BFE3F2';
    ctx.beginPath();
    ctx.moveTo(cx - w, cy + ch); ctx.lineTo(cx + w, cy + ch); ctx.lineTo(cx, cy + ch + ph);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = GOLD; ctx.lineWidth = 0.007; ctx.stroke();
    // facet lines fanning from the girdle
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 0.005;
    for (var i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * w * 0.55, cy + 0.004);
      ctx.lineTo(cx + i * w * 0.4, cy + ch + ph * 0.92);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,' + facetAlpha(sweep, 0.8).toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(cx - w, cy + ch); ctx.lineTo(cx, cy + ch); ctx.lineTo(cx, cy + ch + ph);
    ctx.closePath(); ctx.fill();
    star4(cx - w * 0.7, cy + ch * 0.4, 0.032, Math.pow(Math.max(0, Math.cos(sweep - 1.1)), 6));
    star4(cx + w * 0.8, cy + ch * 1.4, 0.026, Math.pow(Math.max(0, Math.cos(sweep - 3.6)), 6));
  }
  function sapphireBrooch(cx, cy, t, la, lx, ly) {
    var sweep = (t % 8) / 8 * Math.PI * 2;
    // gold setting: ring of small beads
    ctx.fillStyle = GOLD;
    for (var i = 0; i < 12; i++) {
      var a = i * Math.PI / 6;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * 0.088, cy + Math.sin(a) * 0.088, 0.011, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = BLUE_MID;
    ctx.beginPath(); ctx.ellipse(cx, cy, 0.078, 0.078, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.ellipse(cx - 0.012, cy - 0.012, 0.055, 0.055, 0, 0, Math.PI * 2); ctx.fill();
    // facet wedges
    for (var k = 0; k < 6; k++) {
      var fa = k * Math.PI / 3 + 0.3;
      ctx.fillStyle = 'rgba(255,255,255,' + facetAlpha(sweep, fa).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, 0.055, fa - 0.22, fa + 0.22);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(cx + lx * 0.028, cy + ly * 0.028 - 0.006, 0.012, 0, Math.PI * 2); ctx.fill();
    star4(cx + 0.055, cy - 0.055, 0.026, Math.pow(Math.max(0, Math.cos(sweep - 2.0)), 6));
  }

  // ---- animals (local unit space; animal height spans about 1.1 units) ----
  function shadeClip(pathFn, x0, y0, x1, y1, lx) {
    // soft shadow on the side away from the light, clipped to the body
    // path so no hard rect edge ever shows against the ground
    ctx.save();
    pathFn();
    ctx.clip();
    var g = ctx.createLinearGradient(x0, 0, x1, 0);
    if (lx > 0) { g.addColorStop(0, 'rgba(14,30,91,0.25)'); g.addColorStop(1, 'rgba(14,30,91,0)'); }
    else { g.addColorStop(0, 'rgba(14,30,91,0)'); g.addColorStop(1, 'rgba(14,30,91,0.25)'); }
    ctx.fillStyle = g;
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.restore();
  }

  function drawCat(t, la, lx, ly) {
    // tail curling around the base, behind the body
    ctx.strokeStyle = BLUE; ctx.lineWidth = 0.13; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0.30, 0.42);
    ctx.bezierCurveTo(0.42, 0.50, 0.30, 0.56, 0.02, 0.55);
    ctx.bezierCurveTo(-0.26, 0.54, -0.38, 0.46, -0.36, 0.36);
    ctx.stroke();
    ctx.strokeStyle = BLUE_MID; ctx.lineWidth = 0.05;
    ctx.beginPath();
    ctx.moveTo(0.30, 0.42);
    ctx.bezierCurveTo(0.42, 0.50, 0.30, 0.56, 0.02, 0.55);
    ctx.stroke();
    // seated haunch
    var haunchPath = function () {
      ctx.beginPath();
      ctx.moveTo(-0.06, -0.30);
      ctx.bezierCurveTo(-0.26, -0.28, -0.34, -0.02, -0.33, 0.22);
      ctx.bezierCurveTo(-0.32, 0.44, -0.20, 0.52, 0.0, 0.52);
      ctx.bezierCurveTo(0.22, 0.52, 0.33, 0.44, 0.32, 0.22);
      ctx.bezierCurveTo(0.31, -0.02, 0.24, -0.26, 0.06, -0.30);
      ctx.closePath();
    };
    ctx.fillStyle = BLUE;
    haunchPath(); ctx.fill();
    shadeClip(haunchPath, -0.34, -0.30, 0.33, 0.52, lx);
    // chest patch
    ctx.fillStyle = BLUE_MID;
    ctx.beginPath(); ctx.ellipse(0.02, 0.08, 0.15, 0.28, 0, 0, Math.PI * 2); ctx.fill();
    // front legs and paws
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.ellipse(-0.11, 0.28, 0.055, 0.24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.11, 0.28, 0.058, 0.24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-0.11, 0.50, 0.075, 0.045, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.11, 0.50, 0.080, 0.048, 0, 0, Math.PI * 2); ctx.fill();
    // head, turned toward the viewer, 3/4 view
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.ellipse(0.06, -0.38, 0.20, 0.19, 0, 0, Math.PI * 2); ctx.fill();
    // ears
    ctx.fillStyle = BLUE;
    ctx.beginPath();
    ctx.moveTo(-0.08, -0.48); ctx.lineTo(-0.04, -0.64); ctx.lineTo(0.06, -0.52); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.14, -0.52); ctx.lineTo(0.24, -0.63); ctx.lineTo(0.26, -0.46); ctx.closePath(); ctx.fill();
    ctx.fillStyle = BLUE_MID;
    ctx.beginPath();
    ctx.moveTo(-0.05, -0.50); ctx.lineTo(-0.03, -0.60); ctx.lineTo(0.03, -0.52); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.17, -0.51); ctx.lineTo(0.22, -0.59); ctx.lineTo(0.23, -0.48); ctx.closePath(); ctx.fill();
    // muzzle, nose, eyes (never blink)
    ctx.fillStyle = BLUE_MID;
    ctx.beginPath(); ctx.ellipse(0.06, -0.30, 0.085, 0.06, 0, 0, Math.PI * 2); ctx.fill();
    eye(-0.02, -0.42, 0.028, lx, ly);
    eye(0.14, -0.42, 0.026, lx, ly);
    ctx.fillStyle = BLUE_DARK;
    ctx.beginPath();
    ctx.moveTo(0.03, -0.335); ctx.lineTo(0.09, -0.335); ctx.lineTo(0.06, -0.31); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = BLUE_DARK; ctx.lineWidth = 0.006; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0.06, -0.31); ctx.quadraticCurveTo(0.02, -0.28, -0.01, -0.295);
    ctx.moveTo(0.06, -0.31); ctx.quadraticCurveTo(0.10, -0.28, 0.13, -0.295);
    ctx.stroke();
    whiskers(-0.06, -0.32, -1);
    whiskers(0.18, -0.32, 1);
    // fur tufts along the silhouette
    for (var i = 0; i < tufts.length; i++) furTuft(tufts[i].x, tufts[i].y, tufts[i].a, tufts[i].l);
    // the ring, on the front paw
    emeraldRing(0.11, 0.50, t, la, lx, ly);
  }

  function drawFawn(t, la, lx, ly) {
    // legs
    ctx.strokeStyle = BLUE; ctx.lineWidth = 0.045; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-0.20, 0.22); ctx.lineTo(-0.22, 0.52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.08, 0.22); ctx.lineTo(-0.08, 0.52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0.16, 0.22); ctx.lineTo(0.18, 0.52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0.26, 0.22); ctx.lineTo(0.28, 0.52); ctx.stroke();
    // body, horizontal
    var fawnBodyPath = function () {
      ctx.beginPath(); ctx.ellipse(0.02, 0.08, 0.28, 0.17, 0, 0, Math.PI * 2);
    };
    ctx.fillStyle = BLUE;
    fawnBodyPath(); ctx.fill();
    shadeClip(fawnBodyPath, -0.26, -0.09, 0.30, 0.25, lx);
    // spots
    ctx.fillStyle = BLUE_MID;
    for (var i = 0; i < spots.length; i++) {
      ctx.beginPath(); ctx.arc(0.02 + spots[i].u, 0.08 + spots[i].v, spots[i].s, 0, Math.PI * 2); ctx.fill();
    }
    // tail nub
    ctx.fillStyle = BLUE_MID;
    ctx.beginPath(); ctx.ellipse(-0.27, 0.02, 0.035, 0.05, -0.5, 0, Math.PI * 2); ctx.fill();
    // long neck rising to the head
    ctx.fillStyle = BLUE;
    ctx.beginPath();
    ctx.moveTo(0.18, 0.12);
    ctx.quadraticCurveTo(0.26, -0.12, 0.28, -0.30);
    ctx.quadraticCurveTo(0.28, -0.38, 0.22, -0.38);
    ctx.quadraticCurveTo(0.18, -0.30, 0.14, -0.10);
    ctx.quadraticCurveTo(0.12, 0.08, 0.10, 0.14);
    ctx.closePath(); ctx.fill();
    // head in profile, turned slightly toward the viewer
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.ellipse(0.26, -0.38, 0.10, 0.075, 0.15, 0, Math.PI * 2); ctx.fill();
    // small rounded ears
    ctx.beginPath(); ctx.ellipse(0.15, -0.46, 0.05, 0.022, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.27, -0.47, 0.022, 0.045, 0.3, 0, Math.PI * 2); ctx.fill();
    // muzzle and eye
    ctx.fillStyle = BLUE_MID;
    ctx.beginPath(); ctx.ellipse(0.34, -0.35, 0.045, 0.032, 0, 0, Math.PI * 2); ctx.fill();
    eye(0.27, -0.40, 0.022, lx, ly);
    ctx.fillStyle = BLUE_DARK;
    ctx.beginPath(); ctx.arc(0.365, -0.355, 0.010, 0, Math.PI * 2); ctx.fill();
    // diamond pendant on a gold chain at the neck
    diamondPendant(0.20, 0.22, t, la, lx, ly, 0.075, -0.24);
  }

  function drawHare(t, la, lx, ly) {
    // long ears
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.ellipse(-0.02, -0.62, 0.045, 0.20, -0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.10, -0.62, 0.045, 0.20, 0.10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BLUE_MID;
    ctx.beginPath(); ctx.ellipse(-0.02, -0.62, 0.018, 0.14, -0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.10, -0.62, 0.018, 0.14, 0.10, 0, Math.PI * 2); ctx.fill();
    // upright seated body
    var hareBodyPath = function () {
      ctx.beginPath();
      ctx.moveTo(-0.02, -0.34);
      ctx.bezierCurveTo(-0.22, -0.28, -0.28, 0.05, -0.26, 0.28);
      ctx.bezierCurveTo(-0.25, 0.46, -0.12, 0.54, 0.04, 0.54);
      ctx.bezierCurveTo(0.22, 0.54, 0.28, 0.42, 0.26, 0.26);
      ctx.bezierCurveTo(0.24, 0.02, 0.16, -0.28, 0.04, -0.34);
      ctx.closePath();
    };
    ctx.fillStyle = BLUE;
    hareBodyPath(); ctx.fill();
    shadeClip(hareBodyPath, -0.28, -0.34, 0.28, 0.54, lx);
    // chest patch and front paws
    ctx.fillStyle = BLUE_MID;
    ctx.beginPath(); ctx.ellipse(0.03, 0.10, 0.11, 0.24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.ellipse(-0.05, 0.34, 0.04, 0.16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.09, 0.34, 0.04, 0.16, 0, 0, Math.PI * 2); ctx.fill();
    // head and face
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.ellipse(0.04, -0.38, 0.14, 0.13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BLUE_MID;
    ctx.beginPath(); ctx.ellipse(0.04, -0.32, 0.06, 0.045, 0, 0, Math.PI * 2); ctx.fill();
    eye(-0.03, -0.42, 0.026, lx, ly);
    eye(0.11, -0.42, 0.026, lx, ly);
    ctx.fillStyle = BLUE_DARK;
    ctx.beginPath();
    ctx.moveTo(0.015, -0.335); ctx.lineTo(0.065, -0.335); ctx.lineTo(0.04, -0.315); ctx.closePath(); ctx.fill();
    whiskers(-0.05, -0.33, -1);
    whiskers(0.13, -0.33, 1);
    // sapphire brooch on the chest
    sapphireBrooch(0.03, 0.12, t, la, lx, ly);
  }

  function drawOwl(t, la, lx, ly) {
    // ear tufts
    ctx.fillStyle = BLUE;
    ctx.beginPath();
    ctx.moveTo(-0.16, -0.40); ctx.lineTo(-0.20, -0.54); ctx.lineTo(-0.08, -0.44); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.16, -0.40); ctx.lineTo(0.20, -0.54); ctx.lineTo(0.08, -0.44); ctx.closePath(); ctx.fill();
    // round body
    var owlBodyPath = function () {
      ctx.beginPath(); ctx.ellipse(0, 0.06, 0.27, 0.36, 0, 0, Math.PI * 2);
    };
    ctx.fillStyle = BLUE;
    owlBodyPath(); ctx.fill();
    shadeClip(owlBodyPath, -0.27, -0.30, 0.27, 0.42, lx);
    // wings
    ctx.fillStyle = BLUE_DARK;
    ctx.beginPath(); ctx.ellipse(-0.25, 0.10, 0.07, 0.22, 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.25, 0.10, 0.07, 0.22, -0.25, 0, Math.PI * 2); ctx.fill();
    // belly scallops
    ctx.strokeStyle = BLUE_MID; ctx.lineWidth = 0.008;
    for (var r = 0; r < 3; r++) {
      for (var c = -1; c <= 1; c++) {
        ctx.beginPath();
        ctx.arc(c * 0.09, 0.16 + r * 0.11, 0.05, 0.15, Math.PI - 0.15);
        ctx.stroke();
      }
    }
    // facial disc and big eyes
    ctx.fillStyle = BLUE_MID;
    ctx.beginPath(); ctx.ellipse(0, -0.28, 0.20, 0.17, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = GROUND;
    ctx.beginPath(); ctx.arc(-0.09, -0.30, 0.062, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.09, -0.30, 0.062, 0, Math.PI * 2); ctx.fill();
    eye(-0.09, -0.30, 0.038, lx, ly);
    eye(0.09, -0.30, 0.038, lx, ly);
    // beak and feet
    ctx.fillStyle = GOLD;
    ctx.beginPath();
    ctx.moveTo(-0.025, -0.22); ctx.lineTo(0.025, -0.22); ctx.lineTo(0, -0.16); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = GOLD; ctx.lineWidth = 0.014; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-0.14, 0.44); ctx.lineTo(-0.14, 0.50); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0.14, 0.44); ctx.lineTo(0.14, 0.50); ctx.stroke();
    // diamond pendant on a gold chain at the neck
    diamondPendant(0, 0.02, t, la, lx, ly, 0.13, -0.30);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // ground
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var S = Math.min(W, H);
    var inset = S * 0.04;

    // faint pink backdrop architecture (12% opacity)
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = PINK;
    ctx.fillRect(W * 0.10, H * 0.08, W * 0.055, H * 0.72);
    ctx.fillRect(W * 0.845, H * 0.08, W * 0.055, H * 0.72);
    ctx.fillRect(W * 0.10, H * 0.08, W * 0.80, H * 0.055);
    ctx.beginPath();
    ctx.moveTo(W * 0.30, H * 0.80);
    ctx.lineTo(W * 0.30, H * 0.34);
    ctx.quadraticCurveTo(W * 0.30, H * 0.20, W * 0.44, H * 0.20);
    ctx.quadraticCurveTo(W * 0.58, H * 0.20, W * 0.58, H * 0.34);
    ctx.lineTo(W * 0.58, H * 0.80);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    var c = animalCenter();
    // breathing: scale 1.0 to 1.015 over 5s
    var br = 1 + 0.0075 * (1 - Math.cos((t % 5) / 5 * Math.PI * 2));
    var A = S * 0.65 * br; // animal height, 65% of the short side

    // soft ground shadow
    ctx.fillStyle = 'rgba(14,30,91,0.14)';
    ctx.beginPath(); ctx.ellipse(c.x, c.y + A * 0.52, A * 0.30, A * 0.045, 0, 0, Math.PI * 2); ctx.fill();

    // light: drag-set base angle plus a seamless 8s travel sway
    var la = userLight + 0.35 * Math.sin((t % 8) / 8 * Math.PI * 2);
    var lx = Math.cos(la), ly = Math.sin(la);

    var name = PAIRINGS[pairingIndex];
    // the hare's ears make it the tallest pairing: shrink slightly and
    // recenter its span so no ear tip ever crosses the border
    var yOff = 0;
    if (name === 'hare') { A = S * 0.60 * br; yOff = 0.135 * A; }
    ctx.save();
    ctx.translate(c.x, c.y + yOff);
    ctx.scale(A, A);
    if (name === 'cat') drawCat(t, la, lx, ly);
    else if (name === 'fawn') drawFawn(t, la, lx, ly);
    else if (name === 'hare') drawHare(t, la, lx, ly);
    else drawOwl(t, la, lx, ly);
    ctx.restore();

    // thin geometric border, inset 4%, with square corner ornaments
    ctx.strokeStyle = BLUE_MID;
    ctx.lineWidth = Math.max(2, S * 0.003);
    ctx.strokeRect(inset, inset, W - inset * 2, H - inset * 2);
    var cs = Math.max(7, S * 0.016);
    ctx.fillStyle = BLUE_MID;
    var corners = [
      [inset, inset], [W - inset, inset], [inset, H - inset], [W - inset, H - inset]
    ];
    for (var i = 0; i < 4; i++) {
      ctx.fillRect(corners[i][0] - cs / 2, corners[i][1] - cs / 2, cs, cs);
    }
  }

  // interaction: drag orbits the light; double-tap cycles animal + jewel
  var dragging = false, downX = 0, downY = 0, moved = false, lastTapAt = 0;
  function pointerAngle(e) {
    if (typeof canvas.getBoundingClientRect !== 'function') return null;
    var r = canvas.getBoundingClientRect();
    var c = animalCenter();
    return Math.atan2((e.clientY - r.top) - c.y, (e.clientX - r.left) - c.x);
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; moved = false; downX = e.clientX; downY = e.clientY;
    var a = pointerAngle(e); if (a !== null) userLight = a - 0.35 * Math.sin((currentT % 8) / 8 * Math.PI * 2);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 6) moved = true;
    var a = pointerAngle(e); if (a !== null) userLight = a - 0.35 * Math.sin((currentT % 8) / 8 * Math.PI * 2);
  });
  canvas.addEventListener('pointerup', function () {
    dragging = false;
    if (moved) return;
    var now = Date.now();
    if (now - lastTapAt < 350) { pairingIndex = (pairingIndex + 1) % PAIRINGS.length; lastTapAt = 0; }
    else lastTapAt = now;
  });
  canvas.addEventListener('pointercancel', function () { dragging = false; });

  var currentT = PHASE0;
  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    var loop = function (now) {
      currentT = PHASE0 + (now - start) / 1000;
      draw(currentT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
