<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesame Spiral</title>
<style>
html, body { margin: 0; padding: 0; background: #FAF8F2; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#FAF8F2';
var GRAIN = '#141414';
var GUIDE = '#D8D4C8';
var SEED = 1622007;
var RATE = 8;        /* grains per second: the rate is the piece */
var REST_S = 10;     /* seconds of rest after a spiral completes */
var R_NORM = 0.425;  /* spiral radius as a fraction of the field */
var TURN_GAP = 1 / 13; /* gap between successive turns, field units */
var STEP = 1 / 130;  /* arc-length interval between grains, field units */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
var GRAIN_RGB = hexRgb(GRAIN);
var GUIDE_RGB = hexRgb(GUIDE);
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Centered square sheet; on phones the sheet is the full viewport. */
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.86;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* On phones the field is inset from the title strip at top and the hint
   strip at bottom. On desktop the title and hint sit outside the sheet. */
function fieldRect(rect) {
  if (isPhone) {
    var top = 66, bot = 40;
    return { x: rect.x, y: rect.y + top, w: rect.w, h: rect.h - top - bot };
  }
  return rect;
}

/* ---- seeded spiral cycle: pure function of cycle index n ---- */
/* Archimedean spiral, r = k * theta, k = TURN_GAP / TAU. Arms are full
   spirals rotated evenly around the centre, laid arm by arm. Grains are
   placed at fixed arc-length intervals along each arm, with seeded size,
   rotation and position jitter. All coordinates are in field units
   (field = 1 x 1, centre 0.5, 0.5), so the grain list and the grain
   count are identical at every viewport size. */
function genCycle(n) {
  var rng = mulberry32((SEED + n * 7919) >>> 0);
  var arms = 1 + Math.floor(rng() * 3);
  var k = TURN_GAP / TAU;
  var thetaMax = R_NORM / k;
  var grains = [], guide = [];
  var a, th, r, px, py, nx, ny, acc, dth, dx, dy, seg;
  for (a = 0; a < arms; a++) {
    var off = a * TAU / arms;
    var pts = [];
    th = 0; px = 0.5; py = 0.5;
    pts.push({ x: px, y: py });
    while (th < thetaMax) {
      dth = 0.01;
      if (th + dth > thetaMax) dth = thetaMax - th;
      th += dth;
      r = k * th;
      nx = 0.5 + r * Math.cos(th + off);
      ny = 0.5 + r * Math.sin(th + off);
      pts.push({ x: nx, y: ny });
      px = nx; py = ny;
    }
    guide.push(pts);
    /* Walk the polyline, dropping a grain every STEP of arc length. */
    acc = 0;
    var carryX = pts[0].x, carryY = pts[0].y;
    var i;
    for (i = 1; i < pts.length; i++) {
      dx = pts[i].x - pts[i - 1].x;
      dy = pts[i].y - pts[i - 1].y;
      seg = Math.sqrt(dx * dx + dy * dy);
      var ux = seg > 0 ? dx / seg : 1, uy = seg > 0 ? dy / seg : 0;
      var tAlong = 0;
      while (acc + (seg - tAlong) >= STEP) {
        var need = STEP - acc;
        tAlong += need;
        var gx = pts[i - 1].x + ux * tAlong;
        var gy = pts[i - 1].y + uy * tAlong;
        var tang = Math.atan2(uy, ux);
        /* Small seeded jitter: across the path, plus size and rotation. */
        var jx = (rng() - 0.5) * 0.0024;
        var jy = (rng() - 0.5) * 0.0024;
        var perpX = -uy, perpY = ux;
        grains.push({
          x: gx + perpX * jx + ux * jy,
          y: gy + perpY * jx + uy * jy,
          rot: tang + (rng() - 0.5) * 0.9,
          s: 0.7 + rng() * 0.6
        });
        acc = 0;
      }
      acc += seg - tAlong;
      carryX = pts[i].x; carryY = pts[i].y;
    }
    void carryX; void carryY;
  }
  return { arms: arms, grains: grains, guide: guide, total: grains.length };
}
var cycles = [];
function getCycle(n) {
  if (!cycles[n]) cycles[n] = genCycle(n);
  return cycles[n];
}
function cycleDuration(c) { return c.total / RATE + REST_S; }
/* Cycle 0 is generated before the first draw so PHASE can be fixed as
   exactly one third of its grains laid: a satisfying partial spiral. */
var cycle0 = getCycle(0);
var PHASE = Math.floor(cycle0.total / 3) / RATE;
/* Resolve piece time t into { cycle, laid, resting }: laid is the number
   of grains on the paper, resting is true during the 10-second pause. */
function stateAt(t) {
  var n = 0, start = 0, c = cycle0, dur = cycleDuration(c);
  while (t >= start + dur) {
    start += dur;
    n += 1;
    c = getCycle(n);
    dur = cycleDuration(c);
  }
  var el = t - start;
  var laid = Math.floor(el * RATE);
  if (laid >= c.total) return { cycle: c, laid: c.total, resting: true, lead: null };
  return { cycle: c, laid: laid, resting: false, lead: laid > 0 ? c.grains[laid - 1] : null };
}
function drawGrain(g, ox, oy, S) {
  var x = ox + g.x * S, y = oy + g.y * S;
  var rx = 0.0062 * S * g.s, ry = 0.0046 * S * g.s;
  ctx.beginPath();
  ctx.moveTo(x + rx, y);
  ctx.ellipse(x, y, rx, ry, g.rot, 0, TAU);
  ctx.fill();
}
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  var titlePx = isPhone ? 16 : 18;
  var smallPx = isPhone ? 11 : 12;
  var f = fieldRect(rect);
  var S = Math.min(f.w, f.h);
  /* The spiral is square: centre a square drawing area inside the field
     so a tall phone field cannot stretch it into an ellipse. */
  var ox = f.x + (f.w - S) / 2, oy = f.y + (f.h - S) / 2;
  var titleY, dateY, hintY;
  if (isPhone) {
    titleY = 16;
    dateY = 16 + titlePx + 5;
    hintY = VH - smallPx - 12;
  } else {
    titleY = rect.y - titlePx - smallPx - 10;
    dateY = rect.y - smallPx - 6;
    hintY = rect.y + rect.h + 12;
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = GRAIN;
  ctx.fillText('Sesame Spiral', rect.x + rect.w / 2, titleY);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(GRAIN_RGB, 0.65);
  ctx.fillText('2006 · 06 · 21', rect.x + rect.w / 2, dateY);
  var st = stateAt(t);
  var c = st.cycle;
  var i, g;
  /* Faint pencil guide: the full spiral path, all arms, underneath. */
  ctx.save();
  ctx.strokeStyle = rgba(GUIDE_RGB, 0.9);
  ctx.lineWidth = Math.max(0.8, S * 0.0013);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var a = 0; a < c.guide.length; a++) {
    var pts = c.guide[a];
    ctx.beginPath();
    for (i = 0; i < pts.length; i++) {
      var gx = ox + pts[i].x * S, gy = oy + pts[i].y * S;
      if (i === 0) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
    }
    ctx.stroke();
  }
  /* Grains laid so far, one ellipse each. */
  ctx.fillStyle = GRAIN;
  for (i = 0; i < st.laid; i++) {
    drawGrain(c.grains[i], ox, oy, S);
  }
  /* Dispenser head implied at the leading edge: a small open ring with a
     short stem, parked on the newest grain while the machine is laying. */
  if (!st.resting && st.lead) {
    var lx = ox + st.lead.x * S, ly = oy + st.lead.y * S;
    var hr = 0.011 * S;
    ctx.strokeStyle = rgba(GRAIN_RGB, 0.55);
    ctx.lineWidth = Math.max(0.9, S * 0.0016);
    ctx.beginPath();
    ctx.moveTo(lx + hr, ly);
    ctx.arc(lx, ly, hr, 0, TAU);
    ctx.stroke();
    var sa = st.lead.rot;
    ctx.beginPath();
    ctx.moveTo(lx + Math.cos(sa) * hr, ly + Math.sin(sa) * hr);
    ctx.lineTo(lx + Math.cos(sa) * hr * 2.1, ly + Math.sin(sa) * hr * 2.1);
    ctx.stroke();
  }
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(GRAIN_RGB, 0.7);
  ctx.fillText('Watch the machine work.', rect.x + rect.w / 2, hintY);
}
/* Watch-only: no pointer listeners of any kind. */
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
