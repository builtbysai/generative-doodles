<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Am a Piece. I Am a Portal to the Data.</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAF7F0; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var PAPER = '#FAF7F0';
  var INK = '#141210';
  var ACCENT = '#E4572E';
  var DROPBLUE = '#2E86AB';
  var MOUSE = '#8A8578';

  var LOOP = 8; // seconds: the idle breathing loop of the piece (card 5 states this honestly)

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var viewW = 300, viewH = 300, dpr = 1, isPhone = false;

  function measure() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    }
    if (!w) { w = 300; h = 300; }
    viewW = w; viewH = h;
    dpr = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (dpr < 1) dpr = 1; if (dpr > 3) dpr = 3;
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    isPhone = (Math.min(sw, sh) > 0 && Math.min(sw, sh) < 700) || (viewH > viewW * 1.15);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
  }
  measure();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', measure);
    if (window.addEventListener) window.addEventListener('resize', measure);
  }

  // Seeded RNG (mulberry32), used only for the slam page jump.
  var rngState = 92586;
  function rng() {
    rngState |= 0; rngState = (rngState + 0x6D2B79F5) | 0;
    var t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // Clock: elapsed seconds since load. Frame one is drawn at t = 0 synchronously.
  function rawNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return 0;
  }
  var startT = rawNow();
  function elapsed() { return Math.max(0, rawNow() - startT); }

  // ----- Layout (functions of current size) -----
  function ruleY() { return viewH * 0.66; }
  function bookSize() {
    var bw = Math.max(120, Math.min(viewW * 0.30, 280));
    return { w: bw, h: bw * 1.35 };
  }
  function homeCenter() {
    var s = bookSize();
    return { x: viewW / 2, y: ruleY() - 26 - s.h / 2 };
  }
  function restCenterY() { return ruleY() - 26 - bookSize().h / 2; }

  // ----- Card script -----
  // Live numbers are formatted from the real canvas at draw time.
  function cardText(i) {
    var W = Math.round(viewW), H = Math.round(viewH);
    switch (i) {
      case 0: return 'I am a piece. I am a portal to the data.';
      case 1: return 'I am ' + W + ' pixels wide. That is not an accident.';
      case 2: return 'A mouse drinks less than 6 ml of water a day. My drop is exactly 6 pixels.';
      case 3: return 'I am ' + H + ' pixels tall. I counted.';
      case 4: return 'My loop takes ' + LOOP + ' seconds. You are inside second ' + (Math.floor(elapsed() % LOOP) + 1) + '.';
      case 5: return 'I draw myself with ' + TICKS.length + ' marks. Every one is placed.';
      case 6: return 'Drop me. I splash exactly as much as I am.';
      case 7: return 'I have told you everything I am. Turn the page.';
    }
    return '';
  }

  // Card 6: exactly this many tick marks, placed by a fixed formula around the book.
  var TICKS = [];
  (function () {
    var M = 60;
    for (var i = 0; i < M; i++) {
      var a = (i / M) * Math.PI * 2;
      var rr = 1 + 0.13 * Math.sin(a * 3 + 1.7); // gentle wobble, fixed formula
      TICKS.push({ a: a, r: rr, len: 7 + 5 * (0.5 + 0.5 * Math.sin(a * 5 + 0.4)) });
    }
  })();

  // ----- Recorded state (everything drawn is a closed-form function of these + t) -----
  var cardIndex = 0;
  var cardEnteredAt = 0;
  var drag = null;        // {grabDX, grabDY, samples:[{t,x,y}], x, y}
  var flight = null;      // {t0, x0, cy0, vx, vy, ang0, kind} airborne event (release or self-drop)
  var pendingTap = null;  // {t, x, y}
  var flashUntil = -1;
  var lastTapAt = -10, lastTapX = 0, lastTapY = 0;

  var GRAV = 1500; // px per second squared, in CSS px

  function flightLanding(f) {
    // solve cy0 + vy*dt + 0.5*GRAV*dt^2 = restCY for dt > 0
    var restCY = restCenterY();
    var c = f.cy0 - restCY;
    var disc = f.vy * f.vy - 2 * GRAV * c;
    if (disc < 0) return 0;
    var sq = Math.sqrt(disc);
    var dt = (-f.vy + sq) / GRAV;
    if (dt < 0) dt = (-f.vy - sq) / GRAV;
    return Math.max(0, dt);
  }

  // Book pose at time t: {cx, cy, ang, puddle:{alpha, w} or null}
  function poseAt(t) {
    var home = homeCenter();
    var s = bookSize();
    var breathe = 0.02 * Math.sin((t % LOOP) / LOOP * Math.PI * 2);

    if (drag) {
      var vx = 0;
      var sm = drag.samples;
      if (sm.length >= 2) {
        var a = sm[sm.length - 2], b = sm[sm.length - 1];
        if (b.t > a.t) vx = (b.x - a.x) / (b.t - a.t);
      }
      var ang = Math.max(-0.35, Math.min(0.35, vx * 0.00045));
      return { cx: drag.x, cy: drag.y, ang: ang, puddle: null };
    }

    if (flight) {
      var f = flight;
      var dt = t - f.t0;
      var tLand = flightLanding(f);
      var settleStart = tLand + 0.9, settleEnd = tLand + 2.1;
      if (dt < tLand) {
        return {
          cx: f.x0 + f.vx * dt,
          cy: f.cy0 + f.vy * dt + 0.5 * GRAV * dt * dt,
          ang: f.ang0 * Math.max(0, 1 - dt / Math.max(tLand, 0.001) * 0.6),
          puddle: null
        };
      }
      // landed: splash, rest, then glide home
      var pw = s.w; // the puddle is exactly as wide as the book: 1:1
      var pAlpha = 0;
      var sinceLand = dt - tLand;
      if (sinceLand < 2.4) {
        pAlpha = 0.5 * (sinceLand < 1.6 ? 1 : 1 - (sinceLand - 1.6) / 0.8);
        pw = s.w * (sinceLand < 0.22 ? (0.55 + 0.45 * (sinceLand / 0.22)) : 1);
      }
      var cx = f.x0 + f.vx * tLand, cy = restCenterY();
      if (dt > settleStart) {
        var k = Math.min(1, (dt - settleStart) / (settleEnd - settleStart));
        var sm2 = k * k * (3 - 2 * k);
        cx = cx + (home.x - cx) * sm2;
        cy = cy + (home.y - cy) * sm2;
        if (k >= 1) flight = null;
      }
      return { cx: cx, cy: cy, ang: breathe, puddle: pAlpha > 0 ? { alpha: pAlpha, w: pw } : null };
    }

    // Card 7 self-drop: a small hop shortly after the card is entered.
    if (cardIndex === 6) {
      var te = cardEnteredAt + 0.45;
      if (t >= te && !poseAt.selfDone) {
        poseAt.selfDone = true;
        flight = { t0: te, x0: home.x, cy0: home.y, vx: 0, vy: -230, ang0: 0, kind: 'self' };
        return poseAt(t);
      }
    }

    return { cx: home.x, cy: home.y, ang: breathe, puddle: null };
  }

  // ----- Audio (lazy, gesture-only, typeof-guarded; never runs in the QA harness) -----
  var AC = null;
  function audio() {
    if (AC) return AC;
    var Ctor = null;
    if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
    else if (typeof webkitAudioContext !== 'undefined') Ctor = webkitAudioContext;
    if (!Ctor) return null;
    try { AC = new Ctor(); } catch (e) { AC = null; }
    return AC;
  }
  function noiseBuffer(ac) {
    var len = Math.floor(ac.sampleRate * 0.5);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  function sndSwish() {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime;
    var src = ac.createBufferSource(); src.buffer = noiseBuffer(ac);
    var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(500, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t + 0.16);
    bp.frequency.exponentialRampToValueAtTime(700, t + 0.34);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start(t); src.stop(t + 0.4);
  }
  function sndThudPlink(delay) {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime + Math.max(0, delay || 0);
    // thud
    var o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(48, t + 0.14);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.18);
    // the plink: exactly 6 ms, because the drop is exactly 6 px (1:1, the joke)
    var p = ac.createOscillator(); p.type = 'sine'; p.frequency.value = 3400;
    var pg = ac.createGain();
    pg.gain.setValueAtTime(0.0001, t);
    pg.gain.exponentialRampToValueAtTime(0.18, t + 0.001);
    pg.gain.exponentialRampToValueAtTime(0.0001, t + 0.006);
    p.connect(pg); pg.connect(ac.destination);
    p.start(t); p.stop(t + 0.008);
  }
  function sndThump() {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(95, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.22);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.3);
    var src = ac.createBufferSource(); src.buffer = noiseBuffer(ac);
    var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
    var ng = ac.createGain();
    ng.gain.setValueAtTime(0.15, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    src.connect(lp); lp.connect(ng); ng.connect(ac.destination);
    src.start(t); src.stop(t + 0.12);
  }

  // ----- Card changes -----
  function setCard(i, t) {
    cardIndex = ((i % 8) + 8) % 8;
    cardEnteredAt = t;
    flight = null; poseAt.selfDone = false;
    if (cardIndex === 6) {
      // schedule the self-drop's landing sound in step with the visual hop
      var f = { t0: t + 0.45, x0: 0, cy0: restCenterY(), vx: 0, vy: -230, ang0: 0, kind: 'self' };
      sndThudPlink((t + 0.45 - elapsed()) + flightLanding(f));
    }
  }
  function doTapAction(t) {
    sndSwish();
    setCard(cardIndex + 1, t);
  }
  function doSlam(t) {
    flashUntil = t + 0.2;
    sndThump();
    var jump = 1 + Math.floor(rng() * 7); // 1..7: always a different card
    setCard(cardIndex + jump, t);
  }

  // ----- Pointer handling -----
  function ptrPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX != null ? e.clientX : 0) - r.left;
    var y = (e.clientY != null ? e.clientY : 0) - r.top;
    return { x: x, y: y };
  }
  function nearBook(x, y, t) {
    var p = poseAt(t);
    var s = bookSize();
    return Math.abs(x - p.cx) < s.w * 0.75 && Math.abs(y - p.cy) < s.h * 0.7;
  }
  var downInfo = null;

  function onDown(e) {
    audio(); // first gesture may unlock audio; harmless if unavailable
    var t = elapsed();
    var p = ptrPos(e);
    downInfo = { t: t, x: p.x, y: p.y, moved: false };
    if (nearBook(p.x, p.y, t)) {
      var pose = poseAt(t);
      flight = null;
      drag = { grabDX: p.x - pose.cx, grabDY: p.y - pose.cy, samples: [{ t: t, x: p.x, y: p.y }], x: pose.cx, y: pose.cy };
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!downInfo) return;
    var t = elapsed();
    var p = ptrPos(e);
    if (Math.abs(p.x - downInfo.x) > 6 || Math.abs(p.y - downInfo.y) > 6) downInfo.moved = true;
    if (drag) {
      drag.samples.push({ t: t, x: p.x, y: p.y });
      if (drag.samples.length > 6) drag.samples.shift();
      var s = bookSize();
      drag.x = Math.max(s.w / 2, Math.min(viewW - s.w / 2, p.x - drag.grabDX));
      drag.y = Math.max(s.h / 2, Math.min(ruleY() - s.h / 2 - 4, p.y - drag.grabDY));
    }
  }
  function onUp(e) {
    var t = elapsed();
    if (drag) {
      var sm = drag.samples;
      var vx = 0, vy = 0;
      if (sm.length >= 2) {
        var a = sm[sm.length - 2], b = sm[sm.length - 1];
        if (b.t > a.t) { vx = (b.x - a.x) / (b.t - a.t); vy = (b.y - a.y) / (b.t - a.t); }
      }
      vx = Math.max(-500, Math.min(500, vx));
      vy = Math.max(-400, Math.min(600, vy));
      var f = { t0: t, x0: drag.x, cy0: drag.y, vx: vx, vy: vy, ang0: 0, kind: 'drop' };
      flight = f;
      sndThudPlink(flightLanding(f));
      drag = null;
      downInfo = null;
      return;
    }
    if (downInfo && !downInfo.moved && t - downInfo.t < 0.5) {
      // a tap: check for the double-tap slam first
      if (t - lastTapAt < 0.35 && Math.abs(downInfo.x - lastTapX) < 40 && Math.abs(downInfo.y - lastTapY) < 40) {
        pendingTap = null;
        lastTapAt = -10;
        doSlam(t);
      } else {
        pendingTap = { t: t, x: downInfo.x, y: downInfo.y };
        lastTapAt = t; lastTapX = downInfo.x; lastTapY = downInfo.y;
      }
    }
    downInfo = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('pointerup', onUp);

  // ----- Drawing helpers -----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function drawBook(cx, cy, ang, closedBright) {
    var s = bookSize();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    // cover
    ctx.fillStyle = INK;
    roundRect(-s.w / 2, -s.h / 2, s.w, s.h, 10);
    ctx.fill();
    // page block peeking at the right edge
    ctx.fillStyle = PAPER;
    roundRect(s.w / 2 - 9, -s.h / 2 + 7, 6, s.h - 14, 3);
    ctx.fill();
    // spine
    ctx.fillStyle = ACCENT;
    ctx.globalAlpha = closedBright ? 1 : 0.92;
    roundRect(-s.w / 2, -s.h / 2, closedBright ? 20 : 15, s.h, 9);
    ctx.fill();
    ctx.globalAlpha = 1;
    // a quiet cover ring, the only decoration, in mouse gray
    ctx.strokeStyle = MOUSE;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(s.w * 0.08, 0, Math.min(s.w, s.h) * 0.21, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    if (closedBright) {
      // bookmark ribbon for the closing card
      ctx.fillStyle = ACCENT;
      var rx = s.w * 0.22;
      ctx.beginPath();
      ctx.moveTo(rx, -s.h / 2);
      ctx.lineTo(rx + 13, -s.h / 2);
      ctx.lineTo(rx + 13, -s.h / 2 + 44);
      ctx.lineTo(rx + 6.5, -s.h / 2 + 34);
      ctx.lineTo(rx, -s.h / 2 + 44);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    return s;
  }

  function drawCardVisual(t, pose) {
    var s = bookSize();
    var cx = pose.cx, cy = pose.cy;
    if (cardIndex === 1) {
      // width rule spanning exactly the canvas width, above the book
      var y = Math.max(26, cy - s.h / 2 - 34);
      ctx.strokeStyle = INK;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, y); ctx.lineTo(viewW, y);
      ctx.moveTo(0.75, y - 7); ctx.lineTo(0.75, y + 7);
      ctx.moveTo(viewW - 0.75, y - 7); ctx.lineTo(viewW - 0.75, y + 7);
      ctx.stroke();
    } else if (cardIndex === 2) {
      // the drop: exactly 6 CSS px tall, drop blue, resting on the cover
      var dx = cx + s.w * 0.08, dy = cy - 3;
      ctx.fillStyle = DROPBLUE;
      ctx.beginPath();
      ctx.moveTo(dx, dy - 3);
      ctx.bezierCurveTo(dx + 2.4, dy + 0.4, dx + 2.1, dy + 1.6, dx + 1.2, dy + 2.4);
      ctx.arc(dx, dy + 1.4, 1.65, 0.35, Math.PI - 0.35, false);
      ctx.bezierCurveTo(dx - 2.1, dy + 1.6, dx - 2.4, dy + 0.4, dx, dy - 3);
      ctx.fill();
    } else if (cardIndex === 3) {
      // height rule at the left side, spanning exactly the canvas height
      var x = Math.max(14, cx - s.w / 2 - 40);
      ctx.strokeStyle = INK;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x, viewH);
      ctx.moveTo(x - 7, 0.75); ctx.lineTo(x + 7, 0.75);
      ctx.moveTo(x - 7, viewH - 0.75); ctx.lineTo(x + 7, viewH - 0.75);
      ctx.stroke();
    } else if (cardIndex === 4) {
      // loop progress line under the book: filled portion is the live second count
      var frac = (t % LOOP) / LOOP;
      var y2 = ruleY() - 12;
      var x0 = cx - s.w / 2, x1 = cx + s.w / 2;
      ctx.strokeStyle = MOUSE;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x0, y2); ctx.lineTo(x1, y2); ctx.stroke();
      ctx.strokeStyle = INK;
      ctx.beginPath(); ctx.moveTo(x0, y2); ctx.lineTo(x0 + (x1 - x0) * frac, y2); ctx.stroke();
    } else if (cardIndex === 5) {
      // exactly TICKS.length marks around the book
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (var i = 0; i < TICKS.length; i++) {
        var tk = TICKS[i];
        var rx = Math.cos(tk.a) * (s.w * 0.72) * tk.r;
        var ry = Math.sin(tk.a) * (s.h * 0.66) * tk.r;
        var ux = Math.cos(tk.a), uy = Math.sin(tk.a);
        ctx.moveTo(cx + rx, cy + ry);
        ctx.lineTo(cx + rx + ux * tk.len, cy + ry + uy * tk.len);
      }
      ctx.stroke();
    }
  }

  function wrapText(text, maxW, font) {
    ctx.font = font;
    var words = text.split(' ');
    var lines = [];
    var cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function draw(t) {
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // paper
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, viewW, viewH);

    var pose = poseAt(t);

    // puddle under the book (drawn before the book)
    if (pose.puddle) {
      ctx.fillStyle = INK;
      ctx.globalAlpha = pose.puddle.alpha;
      ctx.beginPath();
      ctx.ellipse(pose.cx, ruleY() - 22, pose.puddle.w / 2, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    drawBook(pose.cx, pose.cy, pose.ang, cardIndex === 7);
    drawCardVisual(t, pose);

    // the rule between field and caption band
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, ruleY()); ctx.lineTo(viewW, ruleY());
    ctx.stroke();

    // caption band: the narrator
    var base = isPhone ? 16 : 21;
    var fs = Math.max(14, Math.min(base, viewW * 0.052));
    var font = fs + 'px Georgia, "Times New Roman", serif';
    var lines = wrapText(cardText(cardIndex), viewW * 0.86, font);
    ctx.fillStyle = INK;
    ctx.font = font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var bandMid = ruleY() + (viewH - ruleY()) / 2;
    var lh = fs * 1.35;
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], viewW / 2, bandMid + (i - (lines.length - 1) / 2) * lh);
    }

    // slam flash
    if (t < flashUntil) {
      ctx.fillStyle = INK;
      ctx.globalAlpha = Math.max(0, (flashUntil - t) / 0.2);
      ctx.fillRect(0, 0, viewW, viewH);
      ctx.globalAlpha = 1;
    }
  }

  // Frame one: synchronous, t = 0, deterministic.
  draw(0);

  function frame() {
    var t = elapsed();
    if (pendingTap && t - pendingTap.t > 0.35) {
      var pt = pendingTap; pendingTap = null;
      doTapAction(t);
    }
    if (cardIndex === 4) { /* card 5 counts live seconds; redraw every frame covers it */ }
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
