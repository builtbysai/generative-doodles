<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.445 Word Shadow</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#E8B4C8; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.445 Word Shadow (maite-leon, EXPANSION #51, prompt 5).
// Typography as backdrop, after Maite Leon's BELL-PEPPER (2023):
// one glossy subject stands centred like a product shot in front
// of a wall made of its own name. The word is set in one heavy
// grotesque (canvas fillText, weight 900), tone-on-tone just
// darker than the ground, no outlines, stretched a touch
// vertically so the cap height overflows the frame and the
// letters are cropped top and bottom as well as at the sides;
// roughly two letterforms span the width. Paper grain over
// everything. No other text anywhere.
//
// Fixed authored pair table, index 0 at load; the word always
// names the subject:
//   0 "LEMON" + glossy lemon, pink ground #E8B4C8, letters
//     #D98CB3, lemon #F5D90A, gloss #FFF3B0, shadow #B8860B.
//   1 "TASSE" + glossy teacup, teal ground #9BD1D1, letters
//     #7FBFBF, cup deep plum #5B2A4A with in-family gloss.
//   2 "PAS" + glossy shoe, pink ground family (the pair-0
//     pink, the prompt's own pink family), shoe deep plum
//     #5B2A4A with the same in-family gloss.
// The plum gloss family is authored in-family: light plum
// #8A4A72, dark plum #3E1C32, pale gloss #EFC3DC.
//
// Subject is 45% of frame height, centred, with a flipped,
// faded reflection beneath it and a soft contact shadow.
// Ambient loop: the word layer drifts 10px left/right on a
// 24s cycle; the subject bobs 4px on a 6s cycle.
// DRAG slides the word layer horizontally only (the subject
// stays fixed; different cropped letterforms reveal).
// DOUBLE-TAP cycles to the next pair in the table.
//
// DETERMINISM: frame one is drawn synchronously at the
// constant loop phase T = 3.0s; the rAF clock is anchored
// there as T0 + elapsed-since-load, never read from a wall
// clock for the first frame. Grain is a fixed-seed table.
// One canvas, no offscreen canvases, no sprites: the
// reflection replays the same subject painter under a flip
// transform at low alpha.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- pair table ------------------------------------------
var PAIRS = [
  { word: 'LEMON', ground: '#E8B4C8', letters: '#D98CB3', kind: 'lemon' },
  { word: 'TASSE', ground: '#9BD1D1', letters: '#7FBFBF', kind: 'cup' },
  { word: 'PAS',   ground: '#E8B4C8', letters: '#D98CB3', kind: 'shoe' }
];
if (PAIRS.length !== 3) throw new Error('Word Shadow needs 3 pairs');
var pairIdx = 0;

var LEMON = '#F5D90A', LEMON_GLOSS = '#FFF3B0', LEMON_SH = '#B8860B';
var PLUM = '#5B2A4A', PLUM_L = '#8A4A72', PLUM_D = '#3E1C32', PLUM_GLOSS = '#EFC3DC';

// ---- paper grain: fixed-seed speckle table ----------------
function grainTable(seed, n) {
  var pts = [], s = seed >>> 0;
  for (var i = 0; i < n; i++) {
    s = (s * 1664525 + 1013904223) >>> 0;
    var fx = (s % 10000) / 10000;
    s = (s * 1664525 + 1013904223) >>> 0;
    var fy = (s % 10000) / 10000;
    s = (s * 1664525 + 1013904223) >>> 0;
    var r = 0.6 + (s % 1000) / 1000 * 1.3;
    s = (s * 1664525 + 1013904223) >>> 0;
    var dark = (s % 100) < 46;
    s = (s * 1664525 + 1013904223) >>> 0;
    var a = 0.03 + (s % 1000) / 1000 * 0.06;
    pts.push([fx, fy, r, dark ? 1 : 0, a]);
  }
  return pts;
}
var GRAIN = grainTable(445001, 2400);

// Lemon pore dots, authored unit offsets.
var PORES = [
  [-0.42, -0.18], [-0.18, 0.22], [0.08, -0.30], [0.30, 0.14],
  [0.46, -0.10], [-0.05, 0.05], [0.20, -0.06], [-0.30, 0.30],
  [0.52, 0.22], [-0.52, 0.10], [0.38, -0.30], [-0.10, -0.36]
];

// ---- subjects ---------------------------------------------
// Each painter draws its subject centred at (cx, cy) with
// total height h, gloss-graded shapes only.
function drawLemon(cx, cy, h) {
  var w = 1.30 * h;
  function bodyPath() {
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy + 0.02 * h);
    ctx.quadraticCurveTo(cx - 0.30 * h, cy - 0.52 * h, cx + 0.05 * h, cy - 0.48 * h);
    ctx.quadraticCurveTo(cx + 0.42 * h, cy - 0.44 * h, cx + w / 2, cy + 0.02 * h);
    ctx.quadraticCurveTo(cx + 0.40 * h, cy + 0.48 * h, cx, cy + 0.50 * h);
    ctx.quadraticCurveTo(cx - 0.38 * h, cy + 0.50 * h, cx - w / 2, cy + 0.02 * h);
    ctx.closePath();
  }
  var g = ctx.createLinearGradient(0, cy - 0.5 * h, 0, cy + 0.5 * h);
  g.addColorStop(0, LEMON_GLOSS);
  g.addColorStop(0.32, LEMON);
  g.addColorStop(0.72, LEMON);
  g.addColorStop(1, LEMON_SH);
  bodyPath();
  ctx.fillStyle = g; ctx.fill();
  // tip nubs
  ctx.fillStyle = LEMON_SH; ctx.globalAlpha = 0.75;
  ctx.beginPath(); ctx.ellipse(cx - w / 2, cy + 0.02 * h, 0.045 * h, 0.035 * h, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + w / 2, cy + 0.02 * h, 0.045 * h, 0.035 * h, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // inner shading + gloss, clipped to the body
  ctx.save();
  bodyPath(); ctx.clip();
  ctx.fillStyle = LEMON_SH; ctx.globalAlpha = 0.30;
  ctx.beginPath(); ctx.ellipse(cx + 0.05 * h, cy + 0.52 * h, 0.62 * h, 0.20 * h, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  var rg = ctx.createRadialGradient(cx - 0.22 * h, cy - 0.26 * h, 0, cx - 0.22 * h, cy - 0.26 * h, 0.44 * h);
  rg.addColorStop(0, 'rgba(255,255,255,0.95)');
  rg.addColorStop(0.55, 'rgba(255,255,255,0.35)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg;
  ctx.save();
  ctx.translate(cx - 0.22 * h, cy - 0.26 * h); ctx.scale(1.25, 0.72); ctx.translate(-(cx - 0.22 * h), -(cy - 0.26 * h));
  ctx.fillRect(cx - 0.66 * h, cy - 0.70 * h, 0.88 * h, 0.88 * h);
  ctx.restore();
  ctx.fillStyle = LEMON_SH; ctx.globalAlpha = 0.45;
  for (var i = 0; i < PORES.length; i++) {
    ctx.beginPath();
    ctx.arc(cx + PORES[i][0] * h, cy + PORES[i][1] * h, 0.013 * h, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // crisp specular dot
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath(); ctx.arc(cx - 0.31 * h, cy - 0.31 * h, 0.045 * h, 0, Math.PI * 2); ctx.fill();
}

function bowlPath(cx, cy, h) {
  ctx.beginPath();
  ctx.moveTo(cx - 0.72 * h, cy - 0.30 * h);
  ctx.bezierCurveTo(cx - 0.70 * h, cy + 0.05 * h, cx - 0.52 * h, cy + 0.24 * h, cx - 0.30 * h, cy + 0.28 * h);
  ctx.quadraticCurveTo(cx, cy + 0.34 * h, cx + 0.30 * h, cy + 0.28 * h);
  ctx.bezierCurveTo(cx + 0.52 * h, cy + 0.24 * h, cx + 0.70 * h, cy + 0.05 * h, cx + 0.72 * h, cy - 0.30 * h);
  ctx.closePath();
}
function drawCup(cx, cy, h) {
  // handle, behind the bowl so its ends tuck in
  ctx.strokeStyle = PLUM; ctx.lineWidth = 0.10 * h; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + 0.62 * h, cy - 0.16 * h);
  ctx.bezierCurveTo(cx + 0.94 * h, cy - 0.24 * h, cx + 0.96 * h, cy + 0.14 * h, cx + 0.56 * h, cy + 0.17 * h);
  ctx.stroke();
  // saucer
  ctx.fillStyle = PLUM_D;
  ctx.beginPath(); ctx.ellipse(cx, cy + 0.37 * h, 0.88 * h, 0.13 * h, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PLUM;
  ctx.beginPath(); ctx.ellipse(cx, cy + 0.345 * h, 0.88 * h, 0.13 * h, 0, 0, Math.PI * 2); ctx.fill();
  // bowl
  var g = ctx.createLinearGradient(0, cy - 0.32 * h, 0, cy + 0.34 * h);
  g.addColorStop(0, PLUM_L);
  g.addColorStop(0.45, PLUM);
  g.addColorStop(1, PLUM_D);
  bowlPath(cx, cy, h);
  ctx.fillStyle = g; ctx.fill();
  // gloss streak, clipped to the bowl
  ctx.save();
  bowlPath(cx, cy, h); ctx.clip();
  var lg = ctx.createLinearGradient(cx - 0.55 * h, 0, cx - 0.05 * h, 0);
  lg.addColorStop(0, 'rgba(255,255,255,0)');
  lg.addColorStop(0.5, 'rgba(255,255,255,0.42)');
  lg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = lg;
  ctx.save();
  ctx.translate(cx - 0.30 * h, cy); ctx.rotate(0.18); ctx.translate(-(cx - 0.30 * h), -cy);
  ctx.fillRect(cx - 0.55 * h, cy - 0.34 * h, 0.50 * h, 0.70 * h);
  ctx.restore();
  ctx.fillStyle = PLUM_GLOSS; ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.ellipse(cx - 0.34 * h, cy - 0.12 * h, 0.05 * h, 0.10 * h, 0.25, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
  // rim + tea surface
  ctx.fillStyle = PLUM_D;
  ctx.beginPath(); ctx.ellipse(cx, cy - 0.30 * h, 0.72 * h, 0.115 * h, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PLUM_L;
  ctx.beginPath(); ctx.ellipse(cx, cy - 0.30 * h, 0.60 * h, 0.085 * h, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(cx - 0.18 * h, cy - 0.315 * h, 0.16 * h, 0.028 * h, -0.12, 0, Math.PI * 2); ctx.fill();
}

function shoePath(cx, cy, h) {
  ctx.beginPath();
  ctx.moveTo(cx - 0.80 * h, cy + 0.30 * h);
  ctx.quadraticCurveTo(cx - 0.55 * h, cy + 0.05 * h, cx - 0.28 * h, cy - 0.02 * h);
  ctx.quadraticCurveTo(cx - 0.05 * h, cy - 0.10 * h, cx + 0.05 * h, cy - 0.34 * h);
  ctx.quadraticCurveTo(cx + 0.28 * h, cy - 0.43 * h, cx + 0.48 * h, cy - 0.30 * h);
  ctx.quadraticCurveTo(cx + 0.60 * h, cy - 0.05 * h, cx + 0.60 * h, cy + 0.10 * h);
  ctx.lineTo(cx + 0.70 * h, cy + 0.42 * h);
  ctx.lineTo(cx + 0.56 * h, cy + 0.42 * h);
  ctx.lineTo(cx + 0.50 * h, cy + 0.16 * h);
  ctx.quadraticCurveTo(cx, cy + 0.30 * h, cx - 0.45 * h, cy + 0.335 * h);
  ctx.closePath();
}
function drawShoe(cx, cy, h) {
  var g = ctx.createLinearGradient(0, cy - 0.43 * h, 0, cy + 0.42 * h);
  g.addColorStop(0, PLUM_L);
  g.addColorStop(0.45, PLUM);
  g.addColorStop(1, PLUM_D);
  shoePath(cx, cy, h);
  ctx.fillStyle = g; ctx.fill();
  // gloss along the vamp, clipped to the shoe
  ctx.save();
  shoePath(cx, cy, h); ctx.clip();
  var lg = ctx.createLinearGradient(cx - 0.70 * h, cy + 0.30 * h, cx - 0.05 * h, cy - 0.20 * h);
  lg.addColorStop(0, 'rgba(255,255,255,0)');
  lg.addColorStop(0.55, 'rgba(255,255,255,0.40)');
  lg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(cx - 0.85 * h, cy - 0.45 * h, 1.6 * h, 0.9 * h);
  ctx.fillStyle = PLUM_GLOSS; ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.ellipse(cx - 0.34 * h, cy + 0.02 * h, 0.16 * h, 0.035 * h, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
  // ankle opening
  ctx.fillStyle = PLUM_D;
  ctx.beginPath(); ctx.ellipse(cx + 0.26 * h, cy - 0.335 * h, 0.20 * h, 0.055 * h, -0.15, 0, Math.PI * 2); ctx.fill();
  // sole line
  ctx.strokeStyle = PLUM_D; ctx.globalAlpha = 0.65; ctx.lineWidth = 0.028 * h; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 0.78 * h, cy + 0.315 * h);
  ctx.quadraticCurveTo(cx - 0.2 * h, cy + 0.375 * h, cx + 0.52 * h, cy + 0.40 * h);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawSubject(kind, cx, cy, h) {
  if (kind === 'lemon') drawLemon(cx, cy, h);
  else if (kind === 'cup') drawCup(cx, cy, h);
  else drawShoe(cx, cy, h);
}

// ---- state -------------------------------------------------
var W = 0, H = 0, phone = false;
var T0 = 3.0;              // constant first-frame phase
var startStamp = -1;
var dragOff = 0;           // drag offset on the word layer, px
var lastWordW = 0;

function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var pair = PAIRS[pairIdx];
  var u = H / 720; if (u < 0.4) u = 0.4;
  ctx.fillStyle = pair.ground;
  ctx.fillRect(0, 0, W, H);

  // word layer: drifts 10px on a 24s cycle; drag adds its own
  // offset; the subject never moves with it.
  var drift = 10 * u * Math.sin(2 * Math.PI * t / 24);
  var F = 1.18 * H;
  ctx.save();
  ctx.translate(W / 2, H * 0.47);
  ctx.scale(1, 1.25);
  ctx.font = '900 ' + F + 'px Arial, Helvetica, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = pair.letters;
  var ww = ctx.measureText(pair.word).width;
  lastWordW = ww;
  ctx.fillText(pair.word, -ww * 0.42 + drift + dragOff, 0);
  ctx.restore();

  // subject, 45% of frame height, bobbing 4px on a 6s cycle
  var subjH = Math.min(0.45 * H, 0.50 * W);
  var cx = W / 2;
  var cy = H * 0.46 + 4 * u * Math.sin(2 * Math.PI * t / 6);
  var axisY = cy + subjH / 2 + subjH * 0.05;

  // flipped, faded reflection beneath
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.translate(0, axisY * 1.55);
  ctx.scale(1, -0.55);
  drawSubject(pair.kind, cx, cy, subjH);
  ctx.restore();
  // the reflection fades into the ground
  var fg = ctx.createLinearGradient(0, axisY, 0, axisY + subjH * 0.62);
  fg.addColorStop(0, hexA(pair.ground, 0));
  fg.addColorStop(1, hexA(pair.ground, 0.88));
  ctx.fillStyle = fg;
  ctx.fillRect(cx - subjH * 1.05, axisY, subjH * 2.1, subjH * 0.62);
  // soft contact shadow
  ctx.fillStyle = 'rgba(60,20,40,0.14)';
  ctx.beginPath(); ctx.ellipse(cx, axisY + subjH * 0.015, subjH * 0.52, subjH * 0.045, 0, 0, Math.PI * 2); ctx.fill();

  drawSubject(pair.kind, cx, cy, subjH);

  // paper grain over everything
  for (var i = 0; i < GRAIN.length; i++) {
    var p = GRAIN[i];
    ctx.fillStyle = p[3] ? 'rgba(90,40,60,' + p[4] + ')' : 'rgba(255,255,255,' + p[4] + ')';
    ctx.fillRect(p[0] * W, p[1] * H, p[2] * u, p[2] * u);
  }
}
function hexA(hex, a) {
  var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ---- pointer: drag slides the word; double-tap cycles -----
function evX(ev) {
  if (ev.clientX !== undefined) return ev.clientX;
  if (ev.touches && ev.touches[0]) return ev.touches[0].clientX;
  if (ev.changedTouches && ev.changedTouches[0]) return ev.changedTouches[0].clientX;
  return 0;
}
function evY(ev) {
  if (ev.clientY !== undefined) return ev.clientY;
  if (ev.touches && ev.touches[0]) return ev.touches[0].clientY;
  if (ev.changedTouches && ev.changedTouches[0]) return ev.changedTouches[0].clientY;
  return 0;
}
var dragging = false, dragStartX = 0, dragStartOff = 0, dragMoved = 0;
var downStamp = -1, downPosX = 0, downPosY = 0, lastTapStamp = -1, lastCycleStamp = -1;
function onDown(ev) {
  dragging = true; dragMoved = 0;
  dragStartX = evX(ev); dragStartOff = dragOff;
  downPosX = evX(ev); downPosY = evY(ev);
  downStamp = (typeof ev.timeStamp === 'number') ? ev.timeStamp : -1;
  if (ev.preventDefault) ev.preventDefault();
}
function onMove(ev) {
  if (!dragging) return;
  var dx = evX(ev) - dragStartX;
  dragMoved = Math.max(dragMoved, Math.abs(dx));
  var lim = Math.max(lastWordW * 0.5, W * 0.6);
  dragOff = dragStartOff + dx;
  if (dragOff > lim) dragOff = lim;
  if (dragOff < -lim) dragOff = -lim;
  if (ev.preventDefault) ev.preventDefault();
}
function onUp(ev) {
  if (!dragging) return;
  dragging = false;
  var now = (typeof ev.timeStamp === 'number') ? ev.timeStamp : -1;
  var moved = Math.abs(evX(ev) - downPosX) + Math.abs(evY(ev) - downPosY);
  if (downStamp >= 0 && now >= 0 && now - downStamp < 300 && moved < 12 && dragMoved < 12) {
    if (lastTapStamp >= 0 && now - lastTapStamp < 380 && now - lastCycleStamp > 80) {
      pairIdx = (pairIdx + 1) % PAIRS.length;
      dragOff = 0;
      lastCycleStamp = now;
      lastTapStamp = -1;
    } else {
      lastTapStamp = now;
    }
  }
  downStamp = -1;
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { dragging = false; downStamp = -1; });
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('touchcancel', function () { dragging = false; downStamp = -1; });
}

// ---- sizing -------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(now) {
  if (startStamp < 0) startStamp = (typeof now === 'number' && now > 0) ? now : 0;
  var elapsed = (typeof now === 'number' && now > 0) ? (now - startStamp) / 1000 : 0;
  if (elapsed < 0) elapsed = 0;
  draw(T0 + elapsed);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
