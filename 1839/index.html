<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revolving Harps</title>
<style>
html, body { margin: 0; padding: 0; background: #DDD6C9; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a machine that will never hurry. Three harps turn like carousel
   sculptures in a dim gallery, and small iron pluckers catch the passing
   strings, so the room fills with a slow arpeggio nobody is playing. */
var TAU = Math.PI * 2;
var GROUND = '#DDD6C9';
var WALL_DARK = '#CFC7B6';
var FLOOR = '#B3A892';
var FLOOR_LINE = '#9C917C';
var WOOD = '#8A5A33';
var WOOD_DARK = '#5E3B1F';
var WOOD_LIGHT = '#A97C50';
var IRON = '#2A2723';
var GLINT = '#F2E6A8';
var STRING = '#D9C08A';
var STRING_BACK = '#A98F5F';
var GURDY = '#3A332C';
var GURDY_DARK = '#2B251F';
var PLATE = '#2A2723';
var PLATE_LINE = 'rgba(221,214,201,0.35)';
var TITLE_INK = '#EDE6D8';
var HINT_INK = '#C4BBA8';
var FRAME_T = 40.0;        /* fixed phase: harps mid-turn, one glint lit */
var CHORD = [130.81, 164.81, 196.00, 246.94, 293.66, 329.63, 392.00, 440.00];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1839);
var phaseT = FRAME_T;
var soundOn = false;
var audioCtx = null;
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
var lastT = null;
var prevX = {};
/* wall speckle, seeded once, fixed at load */
var SPECKS = [];
(function () {
  var i;
  for (i = 0; i < 90; i++) SPECKS.push({ fx: rng(), fy: rng() * 0.62, r: 0.6 + rng() * 1.4, a: 0.05 + rng() * 0.08 });
})();
/* harps in depth: largest in front. angle(t) is closed-form so frame one
   is reproducible; the drift term is a slow sine, never a random walk. */
var HARPS = [
  { cx: 0.68, base: 0.74, w: 0.30, h: 0.46, n: 9,  th0: 3.9,  w0: 0.040, ph: 4.0, tone: 0 },
  { cx: 0.34, base: 0.80, w: 0.36, h: 0.56, n: 11, th0: 1.2,  w0: 0.055, ph: 2.1, tone: 1 },
  { cx: 0.55, base: 0.88, w: 0.46, h: 0.66, n: 14, th0: 5.0,  w0: 0.045, ph: 0.7, tone: 2 }
];
function harpAngle(hp, t) {
  return hp.th0 + hp.w0 * t + 0.15 * Math.sin(0.02 * t + hp.ph);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function sceneRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function drawRoom(sc, t) {
  var i, s;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* wall speckle */
  for (i = 0; i < SPECKS.length; i++) {
    s = SPECKS[i];
    ctx.fillStyle = rgba(WALL_DARK, s.a);
    ctx.beginPath();
    ctx.arc(sc.x + s.fx * sc.w, sc.y + s.fy * sc.h, s.r, 0, TAU);
    ctx.fill();
  }
  /* floor */
  var fy = sc.y + sc.h * 0.72;
  ctx.fillStyle = FLOOR;
  ctx.fillRect(sc.x, fy, sc.w, sc.h - (fy - sc.y));
  ctx.strokeStyle = FLOOR_LINE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sc.x, fy + 0.5);
  ctx.lineTo(sc.x + sc.w, fy + 0.5);
  ctx.stroke();
  /* hurdy-gurdy looming at the back: dark body, slow crank, spoked wheel */
  var gx = sc.x + sc.w * 0.20, gy = sc.y + sc.h * 0.09;
  var gw = sc.w * 0.60, gh = sc.h * 0.16;
  ctx.fillStyle = GURDY;
  ctx.beginPath();
  ctx.moveTo(gx, gy + gh * 0.35);
  ctx.quadraticCurveTo(gx + gw * 0.08, gy, gx + gw * 0.30, gy);
  ctx.lineTo(gx + gw * 0.72, gy);
  ctx.quadraticCurveTo(gx + gw * 0.95, gy, gx + gw, gy + gh * 0.4);
  ctx.lineTo(gx + gw * 0.96, gy + gh * 0.85);
  ctx.quadraticCurveTo(gx + gw * 0.7, gy + gh, gx + gw * 0.3, gy + gh);
  ctx.quadraticCurveTo(gx + gw * 0.05, gy + gh, gx, gy + gh * 0.8);
  ctx.closePath();
  ctx.fill();
  /* key row along its top */
  ctx.fillStyle = '#54432F';
  var k;
  for (k = 0; k < 12; k++) {
    ctx.fillRect(gx + gw * (0.10 + k * 0.068), gy + gh * 0.06, gw * 0.03, gh * 0.22);
  }
  /* wheel: slow spokes, closed-form angle */
  var wx = gx + gw * 0.82, wy = gy + gh * 0.52, wr = gh * 0.30;
  var wa = 0.02 * t + 0.6;
  ctx.strokeStyle = rgba(GLINT, 0.55);
  ctx.lineWidth = Math.max(1, sc.w * 0.002);
  ctx.beginPath();
  ctx.arc(wx, wy, wr, 0, TAU);
  ctx.stroke();
  var sp;
  for (sp = 0; sp < 6; sp++) {
    var a = wa + sp * TAU / 6;
    ctx.beginPath();
    ctx.moveTo(wx, wy);
    ctx.lineTo(wx + Math.cos(a) * wr, wy + Math.sin(a) * wr);
    ctx.stroke();
  }
  /* crank turning by itself, same slow rate */
  var cx2 = gx + gw * 0.12, cy2 = gy + gh * 0.55, cr = gh * 0.18;
  var ca = 0.02 * t + 2.2;
  ctx.strokeStyle = IRON;
  ctx.lineWidth = Math.max(2, sc.w * 0.004);
  ctx.beginPath();
  ctx.arc(cx2, cy2, cr * 0.35, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx2, cy2);
  ctx.lineTo(cx2 + Math.cos(ca) * cr, cy2 + Math.sin(ca) * cr);
  ctx.stroke();
  ctx.fillStyle = IRON;
  ctx.beginPath();
  ctx.arc(cx2 + Math.cos(ca) * cr, cy2 + Math.sin(ca) * cr, Math.max(2, sc.w * 0.005), 0, TAU);
  ctx.fill();
}
function drawHarp(sc, hp, t, idx) {
  var cx = sc.x + hp.cx * sc.w;
  var baseY = sc.y + hp.base * sc.h;
  var W = hp.w * sc.w, H = hp.h * sc.h;
  var ang = harpAngle(hp, t);
  var f = Math.cos(ang);
  var back = f < 0;
  var af = Math.abs(f);
  var u = Math.max(0.06, af);
  /* floor shadow */
  ctx.fillStyle = 'rgba(60,50,38,0.18)';
  ctx.beginPath();
  ctx.ellipse(cx, baseY + H * 0.02, W * 0.42 * u + W * 0.08, H * 0.018, 0, 0, TAU);
  ctx.fill();
  /* pedestal */
  ctx.fillStyle = IRON;
  ctx.fillRect(cx - W * 0.16 * u - W * 0.02, baseY - H * 0.015, W * 0.32 * u + W * 0.04, H * 0.02);
  function px(uu) { return cx + uu * (W / 2) * f; }
  function py(vv) { return baseY - vv * H; }
  function topY(uu) { return 0.94 - 0.10 * ((uu + 1) / 2); }
  function botY(uu) { return 0.04 + 0.52 * ((uu + 1) / 2); }
  var lw = Math.max(1, sc.w * 0.0016);
  /* strings first, frame over them */
  var k, uu, x1, y1, x2, y2;
  for (k = 0; k < hp.n; k++) {
    uu = -0.88 + 1.76 * k / (hp.n - 1);
    x1 = px(uu); y1 = py(topY(uu));
    x2 = px(uu); y2 = py(botY(uu));
    ctx.strokeStyle = back ? STRING_BACK : STRING;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  /* frame: pillar, neck, soundboard */
  var wood = back ? WOOD_DARK : WOOD;
  var woodL = back ? WOOD : WOOD_LIGHT;
  ctx.strokeStyle = wood;
  ctx.lineWidth = Math.max(2, H * 0.028);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px(-0.95), py(0.02));
  ctx.lineTo(px(-0.95), py(0.96));
  ctx.stroke();
  ctx.strokeStyle = woodL;
  ctx.lineWidth = Math.max(2, H * 0.02);
  ctx.beginPath();
  ctx.moveTo(px(-0.95), py(0.96));
  ctx.quadraticCurveTo(px(-0.45), py(1.0), px(0.92), py(topY(0.92)));
  ctx.stroke();
  ctx.strokeStyle = wood;
  ctx.lineWidth = Math.max(2, H * 0.024);
  ctx.beginPath();
  ctx.moveTo(px(-0.95), py(0.02));
  ctx.lineTo(px(0.92), py(botY(0.92)));
  ctx.stroke();
  /* finial on the pillar top */
  ctx.fillStyle = woodL;
  ctx.beginPath();
  ctx.arc(px(-0.95), py(0.97), Math.max(2, H * 0.014), 0, TAU);
  ctx.fill();
  /* fixed iron plucker on its own stand, at the edge of the string field */
  var plx = cx + (W / 2) * 0.68;
  var ply = baseY - H * 0.55;
  ctx.strokeStyle = IRON;
  ctx.lineWidth = Math.max(3, sc.w * 0.004);
  ctx.beginPath();
  ctx.moveTo(plx, baseY);
  ctx.lineTo(plx, ply);
  ctx.stroke();
  ctx.fillStyle = IRON;
  ctx.fillRect(plx - W * 0.035, baseY - Math.max(2, sc.w * 0.003), W * 0.07, Math.max(2, sc.w * 0.003));
  ctx.fillStyle = IRON;
  ctx.beginPath();
  ctx.moveTo(plx - W * 0.03, ply - H * 0.045);
  ctx.lineTo(plx + W * 0.01, ply);
  ctx.lineTo(plx - W * 0.03, ply + H * 0.045);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(plx - W * 0.035, ply - H * 0.045, W * 0.008, H * 0.09);
  /* glints: a string passing the plucker catches pale yellow light */
  var thresh = Math.max(5, W * 0.055);
  for (k = 0; k < hp.n; k++) {
    uu = -0.88 + 1.76 * k / (hp.n - 1);
    var sx = px(uu);
    var d = Math.abs(sx - plx);
    if (d < thresh) {
      var a = (1 - d / thresh) * 0.95;
      ctx.fillStyle = rgba(GLINT, a);
      ctx.beginPath();
      ctx.arc(plx, ply, Math.max(2.5, sc.w * 0.006), 0, TAU);
      ctx.fill();
      ctx.strokeStyle = rgba(GLINT, a * 0.8);
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(plx - thresh, ply);
      ctx.lineTo(plx + thresh, ply);
      ctx.stroke();
    }
    /* crossing detection for the slow arpeggio (sound only when toggled on) */
    var key = idx + '-' + k;
    if (soundOn && lastT !== null) {
      var prev = prevX[key];
      if (prev !== undefined && (prev - plx) * (sx - plx) < 0) {
        playNote((hp.tone * 3 + k) % CHORD.length);
      }
    }
    prevX[key] = sx;
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Revolving Harps').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Revolving Harps').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 24').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Revolving Harps', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 24', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, soundPlate.x + 12, soundPlate.y + 7);
}
/* ---- sound: closed-form model, real WebAudio only after a tap ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try { audioCtx = new AudioContext(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function playNote(idx) {
  var ac = ensureAudio();
  if (!ac || !soundOn) return;
  var now = ac.currentTime;
  var f = CHORD[idx % CHORD.length];
  try {
    var osc = ac.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(f, now);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
    osc.connect(g);
    g.connect(ac.destination);
    osc.start(now);
    osc.stop(now + 1.25);
  } catch (e) {}
}
function draw() {
  size();
  var sc = sceneRect();
  var t = phaseT;
  drawRoom(sc, t);
  var i;
  for (i = 0; i < HARPS.length; i++) drawHarp(sc, HARPS[i], t, i);
  drawPlates();
  lastT = t;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); }
  };
}
/* ---- frame one: fixed phase t = 40.0 s, harps mid-turn ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('click', function (ev) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    var x = ev.clientX - rect.left;
    var y = ev.clientY - rect.top;
    if (x >= soundPlate.x && x <= soundPlate.x + soundPlate.w && y >= soundPlate.y && y <= soundPlate.y + soundPlate.h) {
      soundOn = !soundOn;
      if (soundOn) ensureAudio();
      draw();
    }
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
