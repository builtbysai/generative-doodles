<!DOCTYPE html>
<!-- 9174-echo-pain-suffering -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echo — №9174</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #14161c;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: Georgia, "Times New Roman", serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: block;
    touch-action: none;
    cursor: pointer;
  }
  .label {
    position: fixed;
    z-index: 2;
    color: #9a938a;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .label.hidden { opacity: 0; }
  #corner {
    top: 20px; left: 22px;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #8d867b;
  }
  #foot {
    left: 0; right: 0; bottom: 22px;
    text-align: center;
    padding: 0 20px;
  }
  #foot .q {
    font-size: 16px;
    font-style: italic;
    letter-spacing: 0.03em;
    color: #cfc8ba;
  }
  #foot .a {
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #6f6a61;
  }
  #foot .r {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #8d867b;
  }
  #foot .h {
    margin-top: 4px;
    font-size: 11px;
    font-style: italic;
    letter-spacing: 0.04em;
    color: #63605a;
  }
  @media (max-width: 600px) {
    #foot .q { font-size: 14px; }
    #corner { font-size: 12px; top: 16px; left: 16px; }
    #foot { bottom: 16px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="corner" class="label">№ 9174 · Echo</div>
<div id="foot" class="label">
  <div class="q">Pain is unavoidable, but suffering is optional.</div>
  <div class="a">after Haruki Murakami</div>
  <div class="r" id="readout">pain 0 · echoes 0</div>
  <div class="h">a pulse sounds on its own and returns off the walls, again and again. tap to open the walls and let it out. the pulses keep coming.</div>
</div>
<script>
(function () {
  "use strict";

  // Pain is unavoidable, but suffering is optional.
  //
  // A third reading of the quote. Pain is a pulse: it sounds on its own
  // schedule, a clean ring going out. Suffering is the echo: the ring
  // hits the walls and comes back, and comes back again, each return a
  // little dimmer and a little redder, until the room is full of the
  // same pain replayed. The walls are the mind holding on. Tap and the
  // walls open: every ring flies out and dissolves, the room clears.
  // The walls close again after two seconds, and the next pulse sounds
  // anyway. Letting go is a practice you repeat, not a door you open
  // once. Nothing here is spelled out in words. The system is the
  // meaning: pain arrives, the echo is optional.

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var readout = document.getElementById("readout");
  var labels = document.querySelectorAll(".label");

  var W = 0, H = 0, DPR = 1;
  var rings = [];
  var nextPulse = 800; // ms until the first pulse
  var last = performance.now();
  var labelsShown = true;
  var wallsOpenUntil = 0;
  var frameOpen = 0; // 0 = walls closed, 1 = fully open (lerped)

  var GOLD = [232, 221, 196];
  var RUST = [176, 86, 63];
  var SPEED = 90;        // px per second
  var MAX_RINGS = 8;
  var GEN_FADE = 0.65;   // alpha kept each time a ring returns
  var OPEN_MS = 2000;    // how long a tap keeps the walls open

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function mix(c1, c2, t) {
    return [
      Math.round(c1[0] + (c2[0] - c1[0]) * t),
      Math.round(c1[1] + (c2[1] - c1[1]) * t),
      Math.round(c1[2] + (c2[2] - c1[2]) * t)
    ];
  }

  function wallDist(x, y) {
    return Math.min(x, W - x, y, H - y);
  }

  function pulse(x, y) {
    if (rings.length >= MAX_RINGS) return null;
    var r = { x: x, y: y, r: 0, dir: 1, gen: 0, a: 0.9, escaping: false };
    if (wallsOpen()) r.escaping = true; // born while the walls are open: passes straight through
    rings.push(r);
    return r;
  }

  function schedulePulse() {
    nextPulse = 4000 + Math.random() * 3000; // 4-7s, on its own schedule
  }

  function wallsOpen() {
    return performance.now() < wallsOpenUntil;
  }

  function openWalls() {
    wallsOpenUntil = performance.now() + OPEN_MS;
    // Everything in the room flies out through the open walls.
    for (var i = 0; i < rings.length; i++) {
      rings[i].escaping = true;
      rings[i].dir = 1;
    }
  }

  function update(dt) {
    nextPulse -= dt * 1000;
    if (nextPulse <= 0) {
      var px = 80 + Math.random() * Math.max(20, W - 160);
      var py = 100 + Math.random() * Math.max(20, H - 280);
      pulse(px, py);
      schedulePulse();
    }
    var open = wallsOpen();
    frameOpen += ((open ? 1 : 0) - frameOpen) * Math.min(1, dt * 6);
    var maxR = Math.max(W, H) * 1.5;
    for (var i = rings.length - 1; i >= 0; i--) {
      var rg = rings[i];
      if (rg.escaping) {
        rg.r += SPEED * dt * 1.6;
        rg.a -= dt * 0.8;
        if (rg.a <= 0.02 || rg.r > maxR) { rings.splice(i, 1); continue; }
      } else if (rg.dir === 1) {
        rg.r += SPEED * dt;
        if (rg.r >= wallDist(rg.x, rg.y)) rg.dir = -1; // hit the wall: the echo comes back
      } else {
        rg.r -= SPEED * dt;
        if (rg.r <= 0) {
          rg.r = 0;
          rg.dir = 1;
          rg.gen++;
          rg.a *= GEN_FADE; // each return is dimmer
          if (rg.a < 0.06) { rings.splice(i, 1); continue; }
        }
      }
    }
  }

  function drawRing(rg) {
    if (rg.r <= 0.5 || rg.a <= 0.01) return;
    var col = mix(GOLD, RUST, Math.min(1, rg.gen / 5));
    ctx.strokeStyle = "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + (rg.a * 0.14).toFixed(3) + ")";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + rg.a.toFixed(3) + ")";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawFrame() {
    // The walls: a thin frame inset 14px. When open, each edge splits
    // with a gap in the middle and dims.
    var inset = 14;
    var gap = 140 * frameOpen;
    var alpha = 0.9 - 0.65 * frameOpen;
    ctx.strokeStyle = "rgba(90, 96, 112, " + alpha.toFixed(3) + ")";
    ctx.lineWidth = 1;
    var x0 = inset, y0 = inset, x1 = W - inset, y1 = H - inset;
    var mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    ctx.beginPath();
    // top edge
    ctx.moveTo(x0, y0); ctx.lineTo(mx - gap / 2, y0);
    ctx.moveTo(mx + gap / 2, y0); ctx.lineTo(x1, y0);
    // bottom edge
    ctx.moveTo(x0, y1); ctx.lineTo(mx - gap / 2, y1);
    ctx.moveTo(mx + gap / 2, y1); ctx.lineTo(x1, y1);
    // left edge
    ctx.moveTo(x0, y0); ctx.lineTo(x0, my - gap / 2);
    ctx.moveTo(x0, my + gap / 2); ctx.lineTo(x0, y1);
    // right edge
    ctx.moveTo(x1, y0); ctx.lineTo(x1, my - gap / 2);
    ctx.moveTo(x1, my + gap / 2); ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  function draw() {
    ctx.fillStyle = "#14161c";
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < rings.length; i++) drawRing(rings[i]);
    drawFrame();
  }

  function counts() {
    var echoes = 0;
    for (var i = 0; i < rings.length; i++) {
      if (rings[i].gen >= 1) echoes++;
    }
    return { pain: rings.length, echoes: echoes };
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    var c = counts();
    readout.textContent = "pain " + c.pain + " · echoes " + c.echoes;
    requestAnimationFrame(frame);
  }

  function setLabels(show) {
    labelsShown = show;
    for (var i = 0; i < labels.length; i++) {
      labels[i].classList.toggle("hidden", !show);
    }
  }

  // Tap: open the walls at once, no delay. A second tap within 300ms
  // also toggles the labels (it re-opens the walls too, which is
  // harmless). Letting go should feel immediate.
  var downPos = null;
  var downTime = 0;
  var lastTap = 0;

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    downPos = { x: e.clientX, y: e.clientY };
    downTime = performance.now();
  });

  canvas.addEventListener("pointerup", function (e) {
    if (!downPos) return;
    var dt = performance.now() - downTime;
    var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    var moved = Math.sqrt(dx * dx + dy * dy);
    downPos = null;
    if (dt > 500 || moved > 12) return; // a drag, not a tap
    var now = performance.now();
    openWalls();
    if (now - lastTap < 300) setLabels(!labelsShown);
    lastTap = now;
  });

  canvas.addEventListener("pointercancel", function () {
    downPos = null;
  });

  document.addEventListener("visibilitychange", function () {
    last = performance.now();
  });

  window.addEventListener("resize", resize);

  // Harness hook: read-only state for verification, not part of the piece.
  window.__9174 = {
    rings: function () {
      return rings.map(function (r) {
        return { x: r.x, y: r.y, r: r.r, gen: r.gen, dir: r.dir,
                 escaping: r.escaping, a: r.a };
      });
    },
    counts: counts,
    pulseAt: function (x, y) { return pulse(x, y); },
    wallsOpen: wallsOpen,
    clear: function () { rings.length = 0; schedulePulse(); },
    labelsShown: function () { return labelsShown; }
  };

  resize();
  schedulePulse();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
