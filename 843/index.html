<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peel Slowly and See</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAFAF7; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var GROUND = "#FAFAF7";
  var YELLOW = "#E8B400";
  var BLACK  = "#111111";
  var PINK   = "#F4A7B9";

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 720, H = 720, DPR = 1, PHONE = false;

  // ---- State (all geometry in stage units: 1 unit = min(W,H) px, origin at center)
  var PLATE = 0.37;        // plate half-size in units (plate is the printed square)
  var PEEL_R = 0.088;      // peel capsule radius in units
  var segments = [];       // recorded drag path: {x1,y1,x2,y2} in units
  var hiddenIndex = 0;     // which of the 3 hidden artworks lies beneath
  // __STATE_INIT__

  var dragging = false;
  var lastPt = null;
  var downPt = null;
  var downMoved = false;
  var pressTimer = null;

  function isPhoneNow(w, h) {
    try {
      var s = window.screen;
      if (s) {
        var m = Math.min(s.width, s.height);
        if (m > 0 && m < 700) return true;
      }
    } catch (e) {}
    return h > w * 1.15;
  }

  function resize() {
    var vw, vh;
    if (window.visualViewport && window.visualViewport.width) {
      vw = window.visualViewport.width; vh = window.visualViewport.height;
    } else {
      vw = window.innerWidth || 720; vh = window.innerHeight || 720;
    }
    DPR = window.devicePixelRatio || 1;
    W = vw; H = vh;
    PHONE = isPhoneNow(W, H);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(0);
  }

  function S() { return Math.min(W, H); }
  function X(u) { return W / 2 + u * S(); }
  function Y(v) { return H / 2 + v * S(); }
  function toUnit(px, py) { return { x: (px - W / 2) / S(), y: (py - H / 2) / S() }; }

  // ---------- Top artwork: one bold screen-printed form (yellow + black) ----------
  function drawTopArt() {
    var cx = 0, cy = -0.03, r = 0.27;
    // yellow disc
    ctx.fillStyle = YELLOW;
    ctx.beginPath(); ctx.arc(X(cx), Y(cy), r * S(), 0, Math.PI * 2); ctx.fill();
    // black cap: top half of the disc
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(X(cx), Y(cy), r * S(), Math.PI, Math.PI * 2); ctx.fill();
    // thin black ring around the disc
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = Math.max(1.5, S() * 0.008);
    ctx.beginPath(); ctx.arc(X(cx), Y(cy), r * S(), 0, Math.PI * 2); ctx.stroke();
    // bold black band across the lower field, running past the disc on both sides
    ctx.fillStyle = BLACK;
    ctx.fillRect(X(-PLATE), Y(0.13), 2 * PLATE * S(), 0.10 * S());
    // small yellow block seated on the band, right of center
    ctx.fillStyle = YELLOW;
    ctx.fillRect(X(0.10), Y(0.13), 0.11 * S(), 0.10 * S());
  }

  // ---------- Hidden artworks (the revealed second layer) ----------
  function drawHiddenArt(idx) {
    var i, j;
    if (idx === 0) {
      // 1. Starburst: black field, pink rays from center, pink ring, black heart.
      ctx.fillStyle = BLACK;
      ctx.fillRect(X(-PLATE), Y(-PLATE), 2 * PLATE * S(), 2 * PLATE * S());
      var rays = 24;
      ctx.fillStyle = PINK;
      for (i = 0; i < rays; i++) {
        if (i % 2 !== 0) continue;
        var a1 = (i / rays) * Math.PI * 2, a2 = ((i + 1) / rays) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(X(0), Y(0));
        ctx.lineTo(X(Math.cos(a1) * 0.55), Y(Math.sin(a1) * 0.55));
        ctx.lineTo(X(Math.cos(a2) * 0.55), Y(Math.sin(a2) * 0.55));
        ctx.closePath(); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(X(0), Y(0), 0.095 * S(), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = BLACK;
      ctx.beginPath(); ctx.arc(X(0), Y(0), 0.052 * S(), 0, Math.PI * 2); ctx.fill();
    } else if (idx === 1) {
      // 2. Rings: pink field, concentric alternating rings, off-center weight.
      ctx.fillStyle = PINK;
      ctx.fillRect(X(-PLATE), Y(-PLATE), 2 * PLATE * S(), 2 * PLATE * S());
      var radii = [0.52, 0.445, 0.37, 0.295, 0.22, 0.145, 0.07];
      for (i = 0; i < radii.length; i++) {
        ctx.fillStyle = (i % 2 === 0) ? BLACK : PINK;
        ctx.beginPath(); ctx.arc(X(0), Y(-0.04), radii[i] * S(), 0, Math.PI * 2); ctx.fill();
      }
    } else {
      // 3. Scale field: ground field of pink scallop discs, black accent and base band.
      ctx.fillStyle = GROUND;
      ctx.fillRect(X(-PLATE), Y(-PLATE), 2 * PLATE * S(), 2 * PLATE * S());
      var step = 0.115, rr = 0.060, row = 0;
      ctx.fillStyle = PINK;
      for (var vy = -PLATE + 0.02; vy < PLATE - 0.06; vy += 0.072, row++) {
        var off = (row % 2 === 0) ? 0 : step / 2;
        for (var vx = -PLATE - step; vx < PLATE + step; vx += step) {
          ctx.beginPath(); ctx.arc(X(vx + off), Y(vy), rr * S(), 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.fillStyle = BLACK;
      ctx.beginPath(); ctx.arc(X(-0.21), Y(-0.21), 0.068 * S(), 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(X(-PLATE), Y(0.295), 2 * PLATE * S(), (PLATE - 0.295) * S());
      j = 0; // (loop var kept referenced)
    }
  }

  // ---------- Peel mask: union of capsules along the recorded drag path ----------
  function capsuleSubpath(sg) {
    var x1 = X(sg.x1), y1 = Y(sg.y1), x2 = X(sg.x2), y2 = Y(sg.y2);
    var r = PEEL_R * S();
    var ang = Math.atan2(y2 - y1, x2 - x1);
    ctx.moveTo(x2 + Math.cos(ang - Math.PI / 2) * r, y2 + Math.sin(ang - Math.PI / 2) * r);
    ctx.arc(x2, y2, r, ang - Math.PI / 2, ang + Math.PI / 2);
    ctx.arc(x1, y1, r, ang + Math.PI / 2, ang + Math.PI * 1.5);
    ctx.closePath();
  }

  function maskPath() {
    ctx.beginPath();
    for (var i = 0; i < segments.length; i++) capsuleSubpath(segments[i]);
  }

  function platePath() {
    ctx.beginPath();
    ctx.rect(X(-PLATE), Y(-PLATE), 2 * PLATE * S(), 2 * PLATE * S());
  }

  // ---------- Torn edge: seeded jitter polylines along both sides of the peel trail ----------
  function tornEdges() {
    if (!segments.length) return;
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = Math.max(1.2, S() * 0.0032);
    ctx.globalAlpha = 0.9;
    ctx.lineJoin = "round";
    for (var i = 0; i < segments.length; i++) {
      var sg = segments[i];
      var dx = sg.x2 - sg.x1, dy = sg.y2 - sg.y1;
      var len = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      var nx = -dy / len, ny = dx / len;
      var steps = Math.max(2, Math.round(len / 0.02));
      for (var side = -1; side <= 1; side += 2) {
        var rng = mulberry32(843100 + i * 977 + (side > 0 ? 331 : 0));
        ctx.beginPath();
        for (var k = 0; k <= steps; k++) {
          var f = k / steps;
          var jit = (rng() - 0.5) * 0.38 * PEEL_R;
          var rr = PEEL_R + jit;
          var px = X(sg.x1 + dx * f + nx * side * rr);
          var py = Y(sg.y1 + dy * f + ny * side * rr);
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    }
    // jagged cap around the peel head
    var last = segments[segments.length - 1];
    var rngH = mulberry32(843900 + segments.length * 131);
    ctx.beginPath();
    var nA = 22;
    for (var a = 0; a <= nA; a++) {
      var th = (a / nA) * Math.PI * 2;
      var rj = PEEL_R * (1 + (rngH() - 0.5) * 0.34);
      var hx = X(last.x2 + Math.cos(th) * rj), hy = Y(last.y2 + Math.sin(th) * rj);
      if (a === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---------- Curling fold strip at the peel head ----------
  function foldStrip() {
    if (!segments.length) return;
    var last = segments[segments.length - 1];
    var dx = last.x2 - last.x1, dy = last.y2 - last.y1;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 0.001) {
      if (segments.length < 2) return;
      var pv = segments[segments.length - 2];
      dx = pv.x2 - pv.x1; dy = pv.y2 - pv.y1; len = Math.sqrt(dx * dx + dy * dy) || 1;
    }
    dx /= len; dy /= len;
    var nx = -dy, ny = dx;
    var fl = PEEL_R * 0.55;
    var hx = last.x2, hy = last.y2;
    var bx = hx - dx * fl, by = hy - dy * fl;
    ctx.fillStyle = GROUND;
    ctx.globalAlpha = 0.94;
    ctx.beginPath();
    ctx.moveTo(X(hx + nx * PEEL_R), Y(hy + ny * PEEL_R));
    ctx.lineTo(X(hx - nx * PEEL_R), Y(hy - ny * PEEL_R));
    ctx.lineTo(X(bx - nx * PEEL_R), Y(by - ny * PEEL_R));
    ctx.lineTo(X(bx + nx * PEEL_R), Y(by + ny * PEEL_R));
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = Math.max(1, S() * 0.0026);
    ctx.stroke();
    // one inner crease line for the curl
    ctx.beginPath();
    ctx.moveTo(X(hx - dx * fl * 0.45 + nx * PEEL_R * 0.92), Y(hy - dy * fl * 0.45 + ny * PEEL_R * 0.92));
    ctx.lineTo(X(hx - dx * fl * 0.45 - nx * PEEL_R * 0.92), Y(hy - dy * fl * 0.45 - ny * PEEL_R * 0.92));
    ctx.stroke();
  }

  // ---------- Peel tab (visible only while unpeeled) ----------
  function drawTab() {
    var t = 0.095;
    var cxp = X(PLATE), cyp = Y(PLATE);
    // dog-ear at the plate corner: yellow base triangle, ground-colored folded flap inside it
    ctx.fillStyle = YELLOW;
    ctx.beginPath();
    ctx.moveTo(cxp, cyp);
    ctx.lineTo(X(PLATE - t), cyp);
    ctx.lineTo(cxp, Y(PLATE - t));
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = Math.max(1, S() * 0.0026);
    ctx.beginPath();
    ctx.moveTo(X(PLATE - t), cyp);
    ctx.lineTo(cxp, Y(PLATE - t));
    ctx.stroke();
    ctx.fillStyle = GROUND;
    ctx.beginPath();
    ctx.moveTo(cxp, cyp);
    ctx.lineTo(X(PLATE - t * 0.72), Y(PLATE - t * 0.10));
    ctx.lineTo(X(PLATE - t * 0.10), Y(PLATE - t * 0.72));
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = Math.max(1.2, S() * 0.0032);
    ctx.stroke();
  }

  function draw() {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // ground
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // the print plate: top artwork, clipped to the plate
    ctx.save();
    platePath(); ctx.clip();
    drawTopArt();
    ctx.restore();

    // plate hairline edge
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = Math.max(1, S() * 0.0022);
    ctx.globalAlpha = 0.35;
    ctx.strokeRect(X(-PLATE), Y(-PLATE), 2 * PLATE * S(), 2 * PLATE * S());
    ctx.globalAlpha = 1;

    // revealed layer: hidden artwork drawn over the top art, clipped to plate and peel mask
    if (segments.length) {
      ctx.save();
      platePath(); ctx.clip();
      maskPath(); ctx.clip();
      drawHiddenArt(hiddenIndex);
      ctx.restore();
      tornEdges();
      foldStrip();
    } else {
      drawTab();
    }

    // instruction, small caps, top-right
    var fs = Math.max(10, Math.round(S() * 0.026));
    ctx.fillStyle = BLACK;
    ctx.font = "700 " + fs + "px Arial, Helvetica, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "top";
    ctx.fillText("PEEL SLOWLY AND SEE", W - S() * 0.045, S() * 0.045);
  }

  // ---------- Interaction ----------
  function evtPos(e) {
    var r = canvas.getBoundingClientRect();
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: cx - r.left, y: cy - r.top };
  }

  function clearPress() {
    if (pressTimer !== null) {
      if (typeof clearTimeout === "function") clearTimeout(pressTimer);
      pressTimer = null;
    }
  }

  function onDown(e) {
    var p = evtPos(e);
    dragging = true; downMoved = false;
    downPt = p; lastPt = toUnit(p.x, p.y);
    clearPress();
    if (typeof setTimeout === "function") {
      pressTimer = setTimeout(function () {
        if (dragging && !downMoved) {
          // long-press: restore the sheet and advance to the next hidden artwork
          segments = [];
          hiddenIndex = (hiddenIndex + 1) % 3;
          dragging = false;
          draw(0);
        }
      }, 800);
    }
    if (e.preventDefault) e.preventDefault();
  }

  function onMove(e) {
    if (!dragging) return;
    var p = evtPos(e);
    if (downPt && Math.abs(p.x - downPt.x) + Math.abs(p.y - downPt.y) > 8) {
      downMoved = true; clearPress();
    }
    var u = toUnit(p.x, p.y);
    var ddx = u.x - lastPt.x, ddy = u.y - lastPt.y;
    if (Math.sqrt(ddx * ddx + ddy * ddy) >= 0.006) {
      if (segments.length === 0) {
        // the peel always starts at the tab corner: anchor stroke from the tab
        segments.push({ x1: PLATE, y1: PLATE, x2: lastPt.x, y2: lastPt.y });
      }
      segments.push({ x1: lastPt.x, y1: lastPt.y, x2: u.x, y2: u.y });
      lastPt = u;
      draw(0);
    }
    if (e.preventDefault) e.preventDefault();
  }

  function onUp() {
    dragging = false;
    clearPress();
  }

  if (typeof window !== "undefined" && window.PointerEvent) {
    canvas.addEventListener("pointerdown", onDown);
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
  } else {
    canvas.addEventListener("mousedown", onDown);
    canvas.addEventListener("mousemove", onMove);
    canvas.addEventListener("mouseup", onUp);
    canvas.addEventListener("touchstart", onDown, { passive: false });
    canvas.addEventListener("touchmove", onMove, { passive: false });
    canvas.addEventListener("touchend", onUp);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", resize);
  }
  window.addEventListener("resize", resize);

  resize();

  if (typeof requestAnimationFrame === "function") {
    var loop = function () { draw(0); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
