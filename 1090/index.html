<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>White Room</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FFFFFF;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
(function () {
  'use strict';

  // White Room — the workshop before the performance.
  // Watch-only: the power-up ritual is the machines' own. No interaction, no audio.
  // Every visible quantity is a closed-form function of the loop clock t in [0,60).

  var T0 = 30; // frame one: mid-hold, all eight drones lit and breathing
  var LOOP = 60;
  var WORLD = 1000;
  var canvas = document.getElementById('piece');
  var ctx = canvas.getContext('2d');
  var currentT = T0;
  var view = { w: 0, h: 0, dpr: 1, scale: 1, ox: 0, oy: 0, phone: false };

  var COLORS = {
    floor: '#FFFFFF',
    frame: '#141418',
    orbOff: '#D8D8D8',
    orbLit: '#FFF7E6',
    glowFar: '#F2DFAE',
    glowMid: '#F9EDCB',
    shadow: '#E4E4E0',
    engineer: '#111114',
    status: '#35E0FF',
    marker: '#FFFFFF',
    shimmer: '#9A9A94'
  };

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }

  function resize() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    }
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(vw * dpr));
    canvas.height = Math.max(1, Math.round(vh * dpr));
    var screenMin = 0;
    if (window.screen) screenMin = Math.min(window.screen.width || 0, window.screen.height || 0);
    var phone = screenMin > 0 ? screenMin < 700 : vh > vw * 1.15;
    var scale = Math.min(vw / WORLD, vh / WORLD);
    view = {
      w: vw,
      h: vh,
      dpr: dpr,
      scale: scale,
      ox: (vw - WORLD * scale) / 2,
      oy: (vh - WORLD * scale) / 2,
      phone: phone
    };
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(currentT); });
  }
  window.addEventListener('resize', function () { resize(); draw(currentT); });
  resize();

  // 3-2-3 loose grid, receding: back row small and high, front row large and low.
  // order is the power-up order 1..8 (back row, middle row, front row).
  var drones = [
    { x: 322, y: 556, s: 0.60, order: 0 },
    { x: 500, y: 548, s: 0.63, order: 1 },
    { x: 678, y: 556, s: 0.60, order: 2 },
    { x: 402, y: 676, s: 0.84, order: 3 },
    { x: 602, y: 676, s: 0.84, order: 4 },
    { x: 272, y: 826, s: 1.14, order: 5 },
    { x: 500, y: 838, s: 1.18, order: 6 },
    { x: 728, y: 826, s: 1.14, order: 7 }
  ];

  // Lit level L in [0,1] for one drone, purely from the master clock.
  // Power-up: 0-24s, drone `order` ramps over its own 3s window.
  // Hold: 24-44s, fully lit. Power-down: 44-60s, reverse order, 2s each.
  function litLevel(d, t) {
    var upStart = d.order * 3;
    var downStart = 44 + (7 - d.order) * 2;
    var up = smooth((t - upStart) / 3);
    var down = 1 - smooth((t - downStart) / 2);
    return Math.min(up, down);
  }

  // Status dot: blinks while its drone is powering up (its 3s window),
  // steady once lit, gone when dark.
  function statusAlpha(d, t) {
    var L = litLevel(d, t);
    if (L <= 0) return 0;
    var upStart = d.order * 3;
    if (t >= upStart && t < upStart + 3) {
      return (Math.floor(t * 2.5) % 2 === 0) ? 0.95 : 0.08;
    }
    return 0.95 * L;
  }

  function circle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function ellipse(x, y, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  }

  // One engineer silhouette, cropped by the frame edge. side: -1 left, +1 right.
  // Motionless: head, shoulders, torso and legs as one filled path.
  function drawEngineer(side) {
    var bx = side < 0 ? 26 : WORLD - 26;
    ctx.fillStyle = COLORS.engineer;
    ctx.beginPath();
    // head
    ctx.arc(bx, 402, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    // body: shoulders at y=430 down to the floor line, slightly leaning in
    var lean = side * -6;
    ctx.moveTo(bx - 37, 1000);
    ctx.lineTo(bx - 33, 560);
    ctx.quadraticCurveTo(bx - 34, 452, bx - 18, 428);
    ctx.lineTo(bx + 18 + lean, 428);
    ctx.quadraticCurveTo(bx + 34, 452, bx + 33, 560);
    ctx.lineTo(bx + 37, 1000);
    ctx.lineTo(bx + 10, 1000);
    ctx.lineTo(bx + 4, 700);
    ctx.lineTo(bx - 4, 700);
    ctx.lineTo(bx - 10, 1000);
    ctx.closePath();
    ctx.fill();
    // one arm hanging at the side facing the room
    ctx.beginPath();
    var ax = bx + side * -30;
    ctx.moveTo(ax - 8, 470);
    ctx.lineTo(ax + 8, 470);
    ctx.lineTo(ax + 6, 660);
    ctx.lineTo(ax - 6, 660);
    ctx.closePath();
    ctx.fill();
  }

  function drawDrone(d, t) {
    var L = litLevel(d, t);
    // gentle orb breathing while lit (hold phase shimmer of life)
    var breathe = 1 + 0.05 * Math.sin(t * 0.9 + d.order * 0.7);
    var x = d.x, y = d.y, s = d.s;

    // floor shadow: skewed flat ellipse under the machine
    ctx.fillStyle = COLORS.shadow;
    ctx.globalAlpha = 0.35;
    ellipse(x + 10 * s, y + 34 * s, 74 * s, 13 * s);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);

    var rotors = [[-46, -14], [46, -14], [-42, 15], [42, 15]];

    // arms: center body out to each rotor hub
    ctx.strokeStyle = COLORS.frame;
    ctx.lineCap = 'round';
    ctx.lineWidth = 6;
    ctx.beginPath();
    for (var i = 0; i < 4; i++) {
      ctx.moveTo(0, 0);
      ctx.lineTo(rotors[i][0], rotors[i][1]);
    }
    ctx.stroke();

    // propeller guards: rings around each rotor
    ctx.lineWidth = 3.4;
    for (i = 0; i < 4; i++) {
      ellipse(rotors[i][0], rotors[i][1], 21, 9);
      ctx.stroke();
    }
    // rotor discs
    ctx.fillStyle = COLORS.frame;
    for (i = 0; i < 4; i++) {
      ellipse(rotors[i][0], rotors[i][1], 16, 6);
      ctx.fill();
    }
    // rotor shimmer: two rotating arc strokes per drone, alpha follows power
    if (L > 0.02) {
      ctx.strokeStyle = COLORS.shimmer;
      ctx.lineWidth = 2.2;
      for (i = 0; i < 4; i++) {
        var a = t * 9 + d.order * 1.7 + i * (Math.PI / 2);
        ctx.globalAlpha = 0.55 * L;
        ctx.beginPath();
        ctx.ellipse(rotors[i][0], rotors[i][1], 18, 7.5, 0, a, a + 1.9);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // Vicon markers: white pinpoints on the arms, dark-ringed to read on white
    ctx.fillStyle = COLORS.marker;
    ctx.strokeStyle = COLORS.frame;
    ctx.lineWidth = 1.1;
    var marks = [[-24, -8], [24, -8], [-22, 8], [22, 8], [0, -4]];
    for (i = 0; i < marks.length; i++) {
      ctx.beginPath();
      ctx.arc(marks[i][0], marks[i][1], 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    // body
    ctx.fillStyle = COLORS.frame;
    ellipse(0, 0, 25, 15);
    ctx.fill();
    ctx.fillRect(-25, -3, 50, 6);

    // orb mast and orb
    ctx.strokeStyle = COLORS.frame;
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(0, -26);
    ctx.stroke();

    var orbR = 11.5;
    var oy = -38;
    // unlit orb: flat gray
    ctx.fillStyle = COLORS.orbOff;
    circle(0, oy, orbR);
    if (L > 0.01) {
      // warm glow: layered flat-alpha circles, soft and photographic
      ctx.fillStyle = COLORS.glowFar;
      ctx.globalAlpha = 0.34 * L;
      circle(0, oy, orbR * 2.6 * breathe);
      ctx.fillStyle = COLORS.glowMid;
      ctx.globalAlpha = 0.5 * L;
      circle(0, oy, orbR * 1.8 * breathe);
      ctx.fillStyle = COLORS.orbLit;
      ctx.globalAlpha = 0.95 * L;
      circle(0, oy, orbR * 1.18 * breathe);
      ctx.globalAlpha = 1;
      // small warm core highlight
      ctx.fillStyle = COLORS.orbLit;
      ctx.globalAlpha = 0.9 * L;
      circle(-3, oy - 3, 3.4);
      ctx.globalAlpha = 1;
    }

    // status dot on the body
    var sa = statusAlpha(d, t);
    if (sa > 0.01) {
      ctx.fillStyle = COLORS.status;
      ctx.globalAlpha = sa;
      circle(13, 3, 2.6);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function draw(t) {
    currentT = t;
    canvas.style.width = view.w + 'px';
    canvas.style.height = view.h + 'px';
    ctx.setTransform(view.dpr || 1, 0, 0, view.dpr || 1, 0, 0);
    ctx.fillStyle = COLORS.floor;
    ctx.fillRect(0, 0, view.w, view.h);
    ctx.translate(view.ox, view.oy);
    ctx.scale(view.scale, view.scale);

    // engineers at the edges, behind the machines' plane
    drawEngineer(-1);
    drawEngineer(1);
    // drones back-to-front so nearer machines overlap farther ones
    for (var i = 0; i < drones.length; i++) drawDrone(drones[i], t);
  }

  function frame(ms) {
    var elapsed = (typeof ms === 'number' && isFinite(ms) ? ms / 1000 : 0);
    var t = (T0 + elapsed) % LOOP;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  frame(0);
})();
</script>
</body>
</html>
