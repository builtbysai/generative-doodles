<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Hundred and One Fragments</title>
<style>
html, body { margin: 0; padding: 0; background: #c9c4b8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var FRAME_T = 60.0; /* fixed phase: t = 60 s, wall mid-swap, one tile enlarged */
var COLS = 24, ROWS = 14, NCELLS = 336, NSEEDS = 401;
var FADE_DUR = 2.5; /* seconds a swap takes to crossfade and slide */
var ENLARGE_CYCLE = 420.0; /* one enlarge per seven-minute cycle */
var ENLARGE_BASE = 60.0; /* first enlarge starts near t = 51 s */
var ENLARGE_DUR = 16.0; /* grow 5 s, hold 6 s, return 5 s */
var WALL = '#C9C4B8'; /* warm grey ground, the wall read from a distance */
var PAPER = '#E9E3D3';
var PAPER2 = '#DED7C4';
var INK = '#211D19';
var RUST = '#A34D2D';
var BROWN = '#8A6B4A';
var GREY = '#9A968C';
var PLATE_FILL = '#211D19';
var PLATE_LINE = 'rgba(233,227,211,0.28)';
var PLATE_INK = '#E9E3D3';
var HINT_INK = '#E9E3D3';
var PERIODS = [7, 11, 17, 26, 40, 61, 97, 150, 240];
var GLYPHS = ['\u00D7', '+', '\u00A7', '#', '\u25E6', '\u00B7', '\u2014', '/', 'o', '0', 'A', '\u2021', '\u2248', '\u2234', '*', '%'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mod(n, m) { return ((n % m) + m) % m; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- the 401-seed archive, fixed table from seed 1802 ----
   Kinds: 0 noise field, 1 line cluster, 2 glyph, 3 scanlines.
   Each seed carries its own small palette drawn from paper, ink,
   rust, tape-box brown and photocopy grey. The table is built once
   at load from mulberry32(1802), so it is identical every run. */
var SEEDS = [];
(function buildSeeds() {
  var rng = mulberry32(1802);
  var bgs = [PAPER, PAPER, PAPER2, PAPER2, '#D8D2C2', '#CFC9B8', '#B9B4A6', '#B9B4A6', GREY, '#C4BFAF'];
  var inks = [INK, INK, INK, RUST, BROWN, GREY, RUST, INK];
  var s;
  for (s = 0; s < NSEEDS; s++) {
    var roll = rng();
    var kind = roll < 0.30 ? 0 : (roll < 0.55 ? 1 : (roll < 0.80 ? 2 : 3));
    SEEDS.push({
      kind: kind,
      bg: bgs[Math.floor(rng() * bgs.length)],
      ink: inks[Math.floor(rng() * inks.length)],
      accent: rng() < 0.5 ? RUST : BROWN,
      angle: rng() * Math.PI,
      count: 4 + Math.floor(rng() * 8),
      glyph: GLYPHS[Math.floor(rng() * GLYPHS.length)],
      gap: 3 + Math.floor(rng() * 4),
      a1: 0.35 + rng() * 0.45,
      a2: 0.25 + rng() * 0.5
    });
  }
})();
/* ---- three-layer index: which seed sits in a cell at time t ----
   Layer 1, archive: base_i = (i * 37 + 11) mod 401, a fixed scatter
   of the 401 seeds across the 336 cells, so seeds rotate through
   cells and no two neighbours share a seed.
   Layer 2, cell clock: each cell has its own period (7 to 240 s),
   phase offset and step (1 to 7). At swap epoch k the cell moves
   from seed idx(i, k-1) to idx(i, k) over FADE_DUR seconds.
   Layer 3, drift: every 12th swap the cell also advances by a small
   per-cell drift step, a slow rotation of the whole archive.
   idx(i, k) = (base_i + k * step_i + floor(k / 12) * drift_i) mod 401.
   Everything is a pure function of (cell, epoch), so a swap never
   jumps mid-fade and frame one is byte-comparable. */
var CELLS = [];
(function buildCells() {
  var i;
  for (i = 0; i < NCELLS; i++) {
    var rng = mulberry32(1802 ^ Math.imul(i + 1, 2654435761));
    CELLS.push({
      base: mod(i * 37 + 11, NSEEDS),
      period: PERIODS[Math.floor(rng() * PERIODS.length)],
      offset: 0,
      step: 1 + Math.floor(rng() * 7),
      drift: 1 + Math.floor(rng() * 3),
      slide: rng() * TAU
    });
    CELLS[i].offset = rng() * CELLS[i].period;
  }
})();
function seedIndex(i, k) {
  var c = CELLS[i];
  return mod(c.base + k * c.step + Math.floor(k / 12) * c.drift, NSEEDS);
}
function cellState(i, t) {
  var c = CELLS[i];
  var phase = t - c.offset;
  var k = Math.floor(phase / c.period);
  var local = phase - k * c.period;
  if (local < FADE_DUR) {
    return { seed: seedIndex(i, k), from: seedIndex(i, k - 1), frac: smooth(local / FADE_DUR), fading: true };
  }
  return { seed: seedIndex(i, k), from: -1, frac: 1, fading: false };
}
/* ---- enlarge schedule, fixed from seed 1802 ----
   One enlarge per 420 s cycle: start = 60 + j * 420 + jitter (+/-25 s).
   The tile is the first cell, scanning forward from a seeded start
   cell, whose seed at the event start is a line cluster or a glyph,
   so the enlarged fragment stays legible at quadrant scale (a noise
   field would read as a few huge bars). Duration 16 s: grow 5 s,
   hold 6 s, return 5 s. j = 0 starts at 50.96 s on cell 27
   (col 3, row 1, seed 208, glyph approx), so at frame one (t = 60 s)
   it is 9.04 s old, in its hold phase, fully enlarged over the
   top-left quadrant. Next enlarge starts at 468.55 s on cell 298
   (col 10, row 12, seed 231, line cluster) over the bottom-left
   quadrant. */
var ENLARGES = [];
(function buildEnlarges() {
  var rng = mulberry32(1802 + 91);
  var j;
  for (j = -1; j <= 3; j++) {
    var start = ENLARGE_BASE + j * ENLARGE_CYCLE + (rng() - 0.5) * 50;
    var scan = Math.floor(rng() * NCELLS);
    var cell = scan, guard;
    for (guard = 0; guard < NCELLS; guard++) {
      var s = cellState(cell, start).seed;
      if (SEEDS[s].kind === 1 || SEEDS[s].kind === 2) break;
      cell = (cell + 1) % NCELLS;
    }
    ENLARGES.push({ start: start, cell: cell });
  }
})();
function enlargeScale(age) {
  if (age < 0 || age >= ENLARGE_DUR) return 0;
  if (age < 5) return smooth(age / 5);
  if (age < 11) return 1;
  return 1 - smooth((age - 11) / 5);
}
function enlargeAt(t) {
  var out = [], i;
  for (i = 0; i < ENLARGES.length; i++) {
    var e = ENLARGES[i];
    var age = t - e.start;
    var sc = enlargeScale(age);
    if (sc > 0) {
      out.push({ cell: e.cell, col: e.cell % COLS, row: Math.floor(e.cell / COLS), age: age, scale: sc, start: e.start });
    }
  }
  return out;
}
function nextEnlarge(t) {
  var i, best = null;
  for (i = 0; i < ENLARGES.length; i++) {
    if (ENLARGES[i].start > t && (!best || ENLARGES[i].start < best.start)) best = ENLARGES[i];
  }
  return best;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* Draw one fragment seed into a rect. Marks come from a fresh
   mulberry32 seeded by the seed index, so the same seed always
   draws the same fragment at any size. */
function drawSeed(s, x, y, w, h) {
  var sd = SEEDS[s];
  var u = Math.min(w, h);
  var rng = mulberry32(Math.imul(s + 1, 2654435761) ^ 1802);
  ctx.fillStyle = sd.bg;
  ctx.fillRect(x, y, w, h);
  var i, j;
  if (sd.kind === 0) {
    /* noise field: scattered dots and short dashes */
    var n = 12 + Math.floor(rng() * 18);
    for (i = 0; i < n; i++) {
      var px = x + rng() * w, py = y + rng() * h;
      var sz = Math.max(1, u * (0.03 + rng() * 0.05));
      ctx.fillStyle = rgba(rng() < 0.7 ? sd.ink : sd.accent, sd.a1);
      if (rng() < 0.5) ctx.fillRect(px, py, sz, sz);
      else ctx.fillRect(px, py, sz * 2.2, Math.max(1, sz * 0.45));
    }
  } else if (sd.kind === 1) {
    /* line cluster: parallel lines at the seed angle */
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    var ca = Math.cos(sd.angle), sa = Math.sin(sd.angle);
    var diag = Math.sqrt(w * w + h * h);
    var cx = x + w / 2, cy = y + h / 2;
    for (i = 0; i < sd.count; i++) {
      var off = (i - (sd.count - 1) / 2) * (u * 0.16);
      var ox = -sa * off, oy = ca * off;
      ctx.strokeStyle = rgba(i % 3 === 0 ? sd.accent : sd.ink, sd.a1);
      ctx.lineWidth = Math.max(1, u * 0.045);
      ctx.beginPath();
      ctx.moveTo(cx + ox - ca * diag / 2, cy + oy - sa * diag / 2);
      ctx.lineTo(cx + ox + ca * diag / 2, cy + oy + sa * diag / 2);
      ctx.stroke();
    }
    ctx.restore();
  } else if (sd.kind === 2) {
    /* glyph: one large character, two small satellite marks */
    ctx.fillStyle = rgba(sd.ink, sd.a2 + 0.25);
    ctx.font = 'bold ' + Math.max(6, u * 0.62) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(sd.glyph, x + w / 2, y + h / 2 + u * 0.02);
    for (j = 0; j < 2; j++) {
      ctx.fillStyle = rgba(sd.accent, sd.a1);
      ctx.fillRect(x + rng() * w, y + rng() * h, Math.max(1, u * 0.06), Math.max(1, u * 0.06));
    }
  } else {
    /* scanlines: fine horizontal rules with one rust tick */
    ctx.fillStyle = rgba(sd.ink, 0.45);
    var yy;
    for (yy = y + 1; yy < y + h - 1; yy += sd.gap) {
      ctx.fillRect(x + 1, yy, w - 2, 1);
    }
    ctx.fillStyle = rgba(sd.accent, 0.85);
    var tx = x + rng() * w * 0.7;
    ctx.fillRect(tx, y + h * 0.15, Math.max(1, u * 0.07), h * 0.7);
  }
  /* faint seam so the grid reads tile by tile */
  ctx.strokeStyle = rgba(INK, 0.08);
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}
function drawCell(i, t) {
  var c = i % COLS, r = Math.floor(i / COLS);
  var cw = F.w / COLS, ch = F.h / ROWS;
  var x = F.x + c * cw, y = F.y + r * ch;
  var st = cellState(i, t);
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, cw, ch);
  ctx.clip();
  if (st.fading) {
    var slide = (1 - st.frac) * 3;
    var dx = Math.cos(CELLS[i].slide) * slide;
    var dy = Math.sin(CELLS[i].slide) * slide;
    ctx.globalAlpha = 1 - st.frac;
    drawSeed(st.from, x, y, cw, ch);
    ctx.globalAlpha = st.frac;
    drawSeed(st.seed, x + dx, y + dy, cw, ch);
  } else {
    ctx.globalAlpha = 1;
    drawSeed(st.seed, x, y, cw, ch);
  }
  ctx.restore();
}
function drawWall(t) {
  ctx.fillStyle = WALL;
  ctx.fillRect(F.x, F.y, F.w, F.h);
  var i;
  for (i = 0; i < NCELLS; i++) drawCell(i, t);
  /* the enlarge: one tile grows to fill its quadrant, then slides back */
  var evs = enlargeAt(t);
  var e;
  for (e = 0; e < evs.length; e++) {
    var ev = evs[e];
    var c = ev.col, r = ev.row;
    var cw = F.w / COLS, ch = F.h / ROWS;
    var qx = c >= COLS / 2 ? 1 : 0, qy = r >= ROWS / 2 ? 1 : 0;
    var tx = F.x + qx * F.w / 2, ty = F.y + qy * F.h / 2;
    var tw = F.w / 2, th = F.h / 2;
    var sx = F.x + c * cw, sy = F.y + r * ch;
    var sc = ev.scale;
    var ex = sx + (tx - sx) * sc, ey = sy + (ty - sy) * sc;
    var ew = cw + (tw - cw) * sc, eh = ch + (th - ch) * sc;
    var st = cellState(ev.cell, t);
    ctx.save();
    ctx.shadowColor = 'rgba(33,29,25,0.35)';
    ctx.shadowBlur = Math.max(2, 18 * sc);
    ctx.shadowOffsetY = Math.max(1, 4 * sc);
    ctx.beginPath();
    ctx.rect(ex, ey, ew, eh);
    ctx.clip();
    drawSeed(st.seed, ex, ey, ew, eh);
    ctx.restore();
    ctx.strokeStyle = rgba(INK, 0.25 * sc);
    ctx.lineWidth = 1;
    ctx.strokeRect(ex + 0.5, ey + 0.5, ew - 1, eh - 1);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Four Hundred and One Fragments').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Four Hundred and One Fragments').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 18').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Four Hundred and One Fragments', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 18', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = WALL;
  ctx.fillRect(0, 0, VW, VH);
  drawWall(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    cellState: function (i, t) { return cellState(i, t); },
    swappingCells: function (t) {
      var out = [], i;
      for (i = 0; i < NCELLS; i++) {
        var st = cellState(i, t);
        if (st.fading) out.push({ cell: i, col: i % COLS, row: Math.floor(i / COLS), from: st.from, to: st.seed, frac: st.frac });
      }
      return out;
    },
    enlargeAt: function (t) { return enlargeAt(t); },
    nextEnlarge: function (t) { return nextEnlarge(t); },
    seedCount: function () { return SEEDS.length; },
    seedKinds: function () {
      var k = [0, 0, 0, 0], i;
      for (i = 0; i < SEEDS.length; i++) k[SEEDS[i].kind]++;
      return k;
    }
  };
}
/* ---- frame one: fixed phase t = 60 s ----
   No wall clock is read for frame one. At t = 60 s the wall is
   mid-swap on dozens of cells and one tile (cell 27, col 3, row 1,
   seed 208, glyph approx) is enlarged over the top-left quadrant.
   No pointer or keyboard handlers are registered: the archive
   takes no requests. */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  /* True time: phase is computed from a wall-clock start captured after
     the fixed first frame, so dropped frames never lose time. */
  var startMs = Date.now();
  (function loop() {
    function step() {
      phaseT = FRAME_T + (Date.now() - startMs) / 1000;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
