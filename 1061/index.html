<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layered Sequences</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
  Layered Sequences (hideaki-tai HT6 / PP222, FastLEDManager).
  Sixteen discrete LED bars. Three independent light scripts run at once,
  additively mixed per segment. White exists only where scripts overlap:
  every script carries a single-slot colour with at least one channel
  capped low, so no script alone can approach white.
  Frame one is the synchronous draw at fixed phase T0 = 21 s.
*/

var T0 = 21;
var BARS = 16, SEGS = 48;
var SLOT_COLORS = [
  [0, 217, 255],    /* slot 0: cyan   #00D9FF */
  [255, 77, 141],   /* slot 1: magenta #FF4D8D */
  [255, 215, 94]    /* slot 2: amber  #FFD75E */
];
var GRAMMAR = ["march", "wave", "breath", "blink", "chase", "still"];

/* ---------- deterministic RNG ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(a, b, c) {
  var h = 2166136261 >>> 0;
  h = Math.imul(h ^ (a + 101), 16777619);
  h = Math.imul(h ^ (b + 733), 16777619);
  h = Math.imul(h ^ (c + 3911), 16777619);
  return h >>> 0;
}

/* ---------- script value functions: pure in (x, bar, t) ---------- */
function scriptValue(kind, p, x, bar, t) {
  var v, s, d, px, pb;
  switch (kind) {
    case "march": {
      var ph = (x - p.speed * t + bar * p.barSkew) % p.spacing;
      if (ph < 0) ph += p.spacing;
      d = Math.min(ph, p.spacing - ph);
      v = Math.exp(-(d * d) / (2 * p.sigma * p.sigma));
      return p.cap * v;
    }
    case "wave": {
      s = 0.5 + 0.5 * Math.sin(2 * Math.PI * (x / p.lambda + bar * p.barPhase - t / p.period) + p.phase);
      return p.cap * Math.pow(s, 1.6);
    }
    case "breath": {
      var g = 0.5 + 0.5 * Math.sin(2 * Math.PI * t / p.period + p.phase);
      var sp = 0.75 + 0.25 * Math.sin(2 * Math.PI * bar / BARS * p.barCycles + p.phase2);
      return p.cap * g * sp;
    }
    case "blink": {
      var cyc = (t / p.period + bar * p.barStep) % 1;
      if (cyc < 0) cyc += 1;
      v = (cyc < p.duty) ? 1 : 0.08;
      return p.cap * v;
    }
    case "chase": {
      px = ((p.speed * t + p.off) % (SEGS + 8)) - 4;
      pb = 7.5 + 7 * Math.sin(2 * Math.PI * t / p.barPeriod + p.phase);
      d = (x - px) * (x - px) + 4 * (bar - pb) * (bar - pb);
      return p.cap * Math.exp(-d / (2 * p.sigma * p.sigma));
    }
    case "still": {
      return p.cap * (0.7 + 0.3 * Math.sin(2 * Math.PI * t / p.period + bar * 0.7));
    }
  }
  return 0;
}

/* ---------- per-generation parameters ---------- */
function genParams(slot, gen) {
  if (gen === 0) {
    if (slot === 0) return { kind: "march", cap: 0.85, spacing: 15, speed: 5, sigma: 3.2, barSkew: 0.4 };
    if (slot === 1) return { kind: "wave", cap: 0.8, lambda: 36, barPhase: 0.02, period: 13, phase: 0.38 };
    return { kind: "breath", cap: 0.55, period: 24, phase: -3.927, barCycles: 1, phase2: 0 };
  }
  var rnd = mulberry32(hashSeed(1061, slot, gen));
  var kind = GRAMMAR[Math.floor(rnd() * GRAMMAR.length)];
  var p = { kind: kind };
  if (kind === "march") { p.cap = 0.85; p.spacing = 11 + rnd() * 8; p.speed = 3 + rnd() * 5; p.sigma = 2.4 + rnd() * 1.6; p.barSkew = rnd() * 0.8; }
  if (kind === "wave") { p.cap = 0.8; p.lambda = 24 + rnd() * 24; p.barPhase = rnd() * 0.08; p.period = 9 + rnd() * 10; p.phase = rnd() * 6.283; }
  if (kind === "breath") { p.cap = 0.55; p.period = 18 + rnd() * 14; p.phase = rnd() * 6.283; p.barCycles = 1 + Math.floor(rnd() * 2); p.phase2 = rnd() * 6.283; }
  if (kind === "blink") { p.cap = 0.7; p.period = 1.6 + rnd() * 2.4; p.duty = 0.3 + rnd() * 0.4; p.barStep = rnd() * 0.3; }
  if (kind === "chase") { p.cap = 0.8; p.speed = 6 + rnd() * 8; p.off = rnd() * 20; p.barPeriod = 14 + rnd() * 12; p.phase = rnd() * 6.283; p.sigma = 3 + rnd() * 2; }
  if (kind === "still") { p.cap = 0.3; p.period = 7 + rnd() * 8; }
  return p;
}

/* ---------- slots: three scripts, oldest swapped every 30 s ---------- */
var slots = [];
var swapQueue = [0, 1, 2];
var nextSwapAt = 30;
for (var si = 0; si < 3; si++) {
  slots.push({ gen: 0, params: genParams(si, 0), prev: null, fadeStart: -10 });
}
function doSwap(t) {
  var idx = swapQueue.shift();
  swapQueue.push(idx);
  var s = slots[idx];
  s.prev = s.params;
  s.gen += 1;
  s.params = genParams(idx, s.gen);
  s.fadeStart = t;
}
function syncSwaps(t) {
  while (t >= nextSwapAt) { doSwap(nextSwapAt); nextSwapAt += 30; }
}
function slotValue(slot, x, bar, t) {
  var s = slots[slot];
  var v = scriptValue(s.params.kind, s.params, x, bar, t);
  if (s.prev && t - s.fadeStart < 1) {
    var f = Math.max(0, t - s.fadeStart);
    v = scriptValue(s.prev.kind, s.prev, x, bar, t) * (1 - f) + v * f;
  }
  return v;
}

/* ---------- canvas / viewport ---------- */
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0;
function isPhone() {
  var sw = 0, sh = 0;
  if (typeof window !== "undefined" && window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
  var mn = Math.min(sw, sh);
  if (mn > 0 && mn < 700) return true;
  return H > W * 1.15;
}
function resize() {
  var w = 0, h = 0;
  if (typeof window !== "undefined" && window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
  if (!w && typeof window !== "undefined") { w = window.innerWidth; h = window.innerHeight; }
  if (!w) { w = 720; h = 720; }
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
}
if (typeof window !== "undefined") {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener("resize", function () { resize(); draw(currentT); });
  if (window.addEventListener) window.addEventListener("resize", function () { resize(); draw(currentT); });
}

/* ---------- draw ---------- */
var currentT = T0;
function draw(t) {
  currentT = t;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, W, H);
  var pitch = H / BARS;
  var barH = pitch * 0.86;
  var segW = W / SEGS;
  var x, bar, slot;
  for (bar = 0; bar < BARS; bar++) {
    var by = bar * pitch + pitch * 0.07;
    for (x = 0; x < SEGS; x++) {
      var r = 0, g = 0, b = 0;
      for (slot = 0; slot < 3; slot++) {
        var v = slotValue(slot, x, bar, t);
        var col = SLOT_COLORS[slot];
        r += col[0] * v; g += col[1] * v; b += col[2] * v;
      }
      if (r > 255) r = 255; if (g > 255) g = 255; if (b > 255) b = 255;
      if (r < 2 && g < 2 && b < 2) continue;
      ctx.fillStyle = "rgb(" + Math.round(r) + "," + Math.round(g) + "," + Math.round(b) + ")";
      ctx.fillRect(x * segW + 0.5, by, segW - 1, barH);
    }
  }
}

/* ---------- run ---------- */
resize();
draw(T0);
var startStamp = -1;
if (typeof requestAnimationFrame === "function") {
  var loop = function (ts) {
    if (startStamp < 0) startStamp = ts;
    var t = T0 + (ts - startStamp) / 1000;
    syncSwaps(t);
    draw(t);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

/* ---------- interaction: watch-only; double-tap swaps a script ---------- */
var lastTapAt = -1000, lastTapT = 0;
if (typeof window !== "undefined" && window.addEventListener) {
  window.addEventListener("pointerup", function () {
    var now = currentT;
    if (now - lastTapT < 0.35 && lastTapT > 0) {
      doSwap(now);
      nextSwapAt = now + 30;
      lastTapT = -1000;
    } else {
      lastTapT = now;
    }
    lastTapAt = now;
  });
}
</script>
</body>
</html>
