<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Are You Now, In Wood and Oil</title>
<style>
  html, body { margin: 0; padding: 0; background: #efe9dc; overflow: hidden; }
  canvas { display: block; background: #efe9dc; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random: frame one must be reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1446000);

  function roundAlpha(a) {
    if (a < 0) a = 0; if (a > 1) a = 1;
    return Math.round(a * 10000) / 10000;
  }
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + roundAlpha(a) + ')';
  }

  // 3x5 pixel font. Letters are built from material blocks, never clean type.
  var FONT = {
    'H': ['101', '101', '111', '101', '101'],
    'O': ['010', '101', '101', '101', '010'],
    'W': ['101', '101', '101', '111', '101'],
    'A': ['010', '101', '111', '101', '101'],
    'R': ['110', '101', '110', '101', '101'],
    'E': ['111', '100', '110', '100', '111'],
    'Y': ['101', '101', '010', '010', '010'],
    'U': ['101', '101', '101', '101', '111'],
    'N': ['101', '111', '111', '101', '101'],
    '?': ['111', '001', '011', '000', '010'],
    'I': ['111', '010', '010', '010', '111'],
    'T': ['111', '010', '010', '010', '010'],
    'S': ['011', '100', '010', '001', '110'],
    'L': ['100', '100', '100', '100', '111'],
    'G': ['011', '100', '101', '101', '011'],
    'D': ['110', '101', '101', '101', '110'],
    "'": ['010', '000', '000', '000', '000']
  };

  var Q_LINES = ['HOW ARE', 'YOU NOW?'];
  var A_LINES = ["IT'S ALL", 'GOOD NOW'];

  var OIL = ['#1a1a1a', '#f2f2ee', '#c88a2a', '#b81a2a', '#1a7a6a'];
  var OIL_DARK = { '#1a1a1a': '#000000', '#f2f2ee': '#d8c8a8', '#c88a2a': '#8a5a1a', '#b81a2a': '#7a1a1a', '#1a7a6a': '#0a4a3a' };
  var OIL_LIGHT = { '#1a1a1a': '#3a3a3a', '#f2f2ee': '#ffffff', '#c88a2a': '#e8b83a', '#b81a2a': '#d83a3a', '#1a7a6a': '#2a9a8a' };

  // Build the letter list once, with stable seeded per-letter data.
  var letters = [];
  function buildLetters(lines, side) {
    var li = 0;
    for (var l = 0; l < lines.length; l++) {
      var line = lines[l];
      for (var i = 0; i < line.length; i++) {
        var ch = line.charAt(i);
        if (ch === ' ') continue;
        var cells = [];
        var rows = FONT[ch] || FONT['?'];
        for (var r = 0; r < 5; r++) {
          for (var c = 0; c < 3; c++) {
            if (rows[r].charAt(c) === '1') {
              cells.push({ r: r, c: c, jx: (rng() - 0.5) * 3, jy: (rng() - 0.5) * 3 });
            }
          }
        }
        var mat;
        if (side === 'q') mat = (li % 2 === 0) ? 'wood' : 'paper';
        else mat = 'oil';
        letters.push({
          ch: ch, side: side, line: l, col: i, cells: cells,
          mat: mat, oilIdx: li % OIL.length,
          phase: rng() * Math.PI * 2, phase2: rng() * Math.PI * 2,
          disturbAt: -100, idx: letters.length
        });
        li++;
      }
    }
  }
  buildLetters(Q_LINES, 'q');
  buildLetters(A_LINES, 'a');
  var totalLetters = letters.length;

  var W = 0, H = 0, lastT = 0, started = false, t0 = 0;
  var boxes = []; // letter bboxes from the last draw, for pointer handling

  function isPhone() {
    var minDim = 1000000;
    if (typeof window !== 'undefined' && window.screen) {
      minDim = Math.min(window.screen.width || 1000000, window.screen.height || 1000000);
    }
    if (minDim < 700) return true;
    if (typeof window !== 'undefined' && window.innerWidth && window.innerHeight) {
      return window.innerHeight > window.innerWidth * 1.15;
    }
    return false;
  }

  function viewportSize() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    }
    if ((!w || !h) && typeof window !== 'undefined') { w = window.innerWidth; h = window.innerHeight; }
    return { w: w || 800, h: h || 600 };
  }

  function resize() {
    var s = viewportSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    draw(lastT);
  }

  function drawCell(x, y, cw, ch, mat, oilHex, jitter, lift) {
    var jx = jitter.jx, jy = jitter.jy;
    if (mat === 'paper') {
      // Torn-paper shadow, then a jagged-edged paper block. The paper tone
      // is near the wall tone, so the shadow is offset wide and the block
      // carries a darker torn edge on its lower and right sides to stay legible.
      ctx.fillStyle = '#d8c8a8';
      ctx.fillRect(x + 3, y + 4, cw, ch);
      ctx.fillStyle = '#f2ead8';
      ctx.beginPath();
      ctx.moveTo(x + jx, y + jy - lift);
      ctx.lineTo(x + cw + jx, y + jy * 0.5);
      ctx.lineTo(x + cw - jx, y + ch + jy);
      ctx.lineTo(x - jx, y + ch - jy * 0.5);
      ctx.closePath();
      ctx.fill();
      // Torn edge: darker lower and right edges plus ticks along the bottom.
      ctx.fillStyle = '#c8b898';
      ctx.fillRect(x, y + ch - 1, cw, 1);
      ctx.fillRect(x + cw - 1, y, 1, ch);
      ctx.fillRect(x + cw * 0.2, y + ch - 1, cw * 0.15, 2);
      ctx.fillRect(x + cw * 0.6, y + ch - 1, cw * 0.12, 2);
    } else if (mat === 'wood') {
      ctx.fillStyle = '#8a5a2a';
      ctx.fillRect(x + jx, y + jy, cw, ch);
      // Wood grain: two darker lines running along the block.
      ctx.fillStyle = '#5a3418';
      ctx.fillRect(x + jx, y + jy + ch * 0.3, cw, Math.max(1, ch * 0.06));
      ctx.fillRect(x + jx, y + jy + ch * 0.65, cw, Math.max(1, ch * 0.05));
      ctx.fillStyle = '#b87a3a';
      ctx.fillRect(x + jx, y + jy + ch * 0.48, cw, Math.max(1, ch * 0.04));
    } else {
      // Oil: thick stroke block with brush ridges.
      ctx.fillStyle = oilHex;
      ctx.fillRect(x + jx, y + jy, cw, ch);
      ctx.fillStyle = OIL_DARK[oilHex] || '#000000';
      ctx.fillRect(x + jx, y + jy + ch * 0.75, cw, Math.max(1, ch * 0.08));
      ctx.fillStyle = OIL_LIGHT[oilHex] || '#ffffff';
      ctx.fillRect(x + jx, y + jy + ch * 0.18, cw, Math.max(1, ch * 0.07));
      // White oil on the warm wall needs a faint edge to stay readable.
      if (oilHex === '#f2f2ee') {
        ctx.fillStyle = rgba('#8a7a64', 0.35);
        ctx.fillRect(x + jx, y + jy + ch - 1, cw, 1);
        ctx.fillRect(x + jx + cw - 1, y + jy, 1, ch);
      }
    }
  }

  function draw(t) {
    lastT = t;
    if (!W || !H) { var s = viewportSize(); W = s.w; H = s.h; canvas.width = W; canvas.height = H; }
    ctx.fillStyle = '#efe9dc';
    ctx.fillRect(0, 0, W, H);
    var phone = isPhone();
    boxes = [];

    var cell, chH, adv, lineH, qX, qY, aX, aY;
    if (!phone) {
      // Two rooms: question left, answer right, narrow gap between them.
      var margin = Math.max(16, W * 0.03);
      var blockW = (W - margin * 2 - 8) / 2;
      cell = Math.min(blockW / 28, H * 0.028);
      cell = Math.max(6, cell);
      chH = cell * 1.35; // tall cells: letters reach ~15% of frame height
      adv = cell * 3.5; lineH = chH * 5 + cell * 1.2;
      var totalH = lineH * 2 - cell * 1.2;
      qX = margin; qY = (H - totalH) / 2;
      aX = margin + blockW + 8; aY = (H - totalH) / 2;
      // The narrow gap between the two rooms.
      ctx.fillStyle = rgba('#8a7a64', 0.5);
      ctx.fillRect(margin + blockW + 3, H * 0.15, 2, H * 0.7);
    } else {
      // Stacked: question above, answer below, horizontal seam between.
      var m2 = Math.max(12, W * 0.04);
      cell = Math.min((W - m2 * 2) / 28, H * 0.02);
      cell = Math.max(6, cell);
      chH = cell * 1.35;
      adv = cell * 3.5; lineH = chH * 5 + cell * 1.2;
      var th2 = lineH * 2 - cell * 1.2;
      qX = m2; qY = Math.max(12, (H - th2 * 2 - 24) / 2);
      aX = m2; aY = qY + th2 + 24;
      ctx.fillStyle = rgba('#8a7a64', 0.5);
      ctx.fillRect(W * 0.15, qY + th2 + 10, W * 0.7, 2);
    }

    // Material swap: one letter every 12 s, crossfade in 1 s, hold, crossfade out.
    var swapIdx = Math.floor(t / 12) % totalLetters;
    var swapPhase = t % 12;
    var swapAmt = 0;
    if (swapPhase < 1) swapAmt = swapPhase;
    else if (swapPhase < 2.5) swapAmt = 1;
    else if (swapPhase < 3.5) swapAmt = (3.5 - swapPhase);
    else swapAmt = 0;

    for (var li = 0; li < letters.length; li++) {
      var L = letters[li];
      var bx = (L.side === 'q' ? qX : aX) + L.col * adv;
      var by = (L.side === 'q' ? qY : aY) + L.line * lineH;
      // Gentle micro-motion: planks slide, paper flutters, oil thickens and relaxes.
      var dx = Math.sin(t * 0.4 + L.phase) * 1.5;
      var dy = Math.cos(t * 0.33 + L.phase2) * 1.5;
      // Drag disturbance: closed-form decay from the recorded disturb time.
      var dt = t - L.disturbAt;
      var disturb = (dt >= 0 && dt < 4) ? Math.exp(-dt * 1.2) : 0;
      var jAmp = 1 + disturb * 4;
      var lift = disturb * 6;
      var inset = (L.mat === 'oil') ? (1 + Math.sin(t * 0.5 + L.phase) * 0.8) : 0;
      var isSwap = (li === swapIdx);
      for (var ci = 0; ci < L.cells.length; ci++) {
        var c = L.cells[ci];
        var cw = cell, chh = chH;
        var cx = bx + dx + c.c * cell + c.jx * jAmp * 0.4;
        var cy = by + dy + c.r * chH + c.jy * jAmp * 0.4;
        var mat = L.mat, oilHex = OIL[L.oilIdx];
        if (L.mat === 'oil') {
          var ins = inset * 0.5;
          drawCell(cx + ins, cy + ins, Math.max(2, cw - ins * 2), Math.max(2, chh - ins * 2), 'oil', oilHex, { jx: c.jx * jAmp * 0.4, jy: c.jy * jAmp * 0.4 }, 0);
          if (isSwap && swapAmt > 0) {
            var nextHex = OIL[(L.oilIdx + 1) % OIL.length];
            ctx.globalAlpha = roundAlpha(swapAmt * 0.9);
            drawCell(cx + ins, cy + ins, Math.max(2, cw - ins * 2), Math.max(2, chh - ins * 2), 'oil', nextHex, { jx: c.jx * jAmp * 0.4, jy: c.jy * jAmp * 0.4 }, 0);
            ctx.globalAlpha = 1;
          }
        } else {
          drawCell(cx, cy, cw, chh, mat, null, { jx: c.jx * jAmp * 0.4, jy: c.jy * jAmp * 0.4 }, (mat === 'paper' ? lift : 0));
          if (isSwap && swapAmt > 0) {
            var alt = (mat === 'wood') ? 'paper' : 'wood';
            ctx.globalAlpha = roundAlpha(swapAmt * 0.9);
            drawCell(cx, cy, cw, chh, alt, null, { jx: c.jx * jAmp * 0.4, jy: c.jy * jAmp * 0.4 }, (alt === 'paper' ? lift : 0));
            ctx.globalAlpha = 1;
          }
        }
      }
      boxes.push({ x: bx, y: by, w: adv, h: chH * 5, idx: li });
    }
  }

  function disturbAt(px, py) {
    for (var i = 0; i < boxes.length; i++) {
      var b = boxes[i];
      if (px >= b.x - 4 && px <= b.x + b.w + 4 && py >= b.y - 4 && py <= b.y + b.h + 4) {
        letters[b.idx].disturbAt = lastT;
      }
    }
  }

  function onPointer(ev) {
    var rect = { left: 0, top: 0 };
    try { if (canvas.getBoundingClientRect) rect = canvas.getBoundingClientRect(); } catch (e) {}
    var px = (typeof ev.offsetX === 'number') ? ev.offsetX : (ev.clientX - rect.left);
    var py = (typeof ev.offsetY === 'number') ? ev.offsetY : (ev.clientY - rect.top);
    disturbAt(px, py);
    draw(lastT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onPointer);
    canvas.addEventListener('pointermove', onPointer);
  }

  function onResize() { resize(); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) window.addEventListener('resize', onResize);
  }

  // Frame one is drawn synchronously at a constant phase; the loop only
  // starts with the first rAF callback, so the gate render is deterministic.
  draw(0);

  function loop(ts) {
    if (!started) { started = true; t0 = ts; }
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  // Probe hook for the QA harness (not part of the visible piece).
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw, disturbAt: disturbAt,
      letterCount: function () { return totalLetters; },
      boxes: function () { return boxes; }
    };
  }
})();
</script>
</body>
</html>
