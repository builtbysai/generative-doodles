<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wildfire Eats the Grid</title>
<style>
html, body { margin: 0; padding: 0; background: #EDE3CB; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#EDE3CB';
var MUSTARD = '#D9A01F';
var RED = '#C23B2A';
var CREAM = '#F2EDE2';
var BLACK = '#141210';
var PLATE = '#141210';
var PLATE_LINE = 'rgba(242,237,226,0.45)';
var TITLE_INK = '#F2EDE2';
var HINT_INK = '#F2EDE2';
var FIRST_T = 0;
/* DRIVER: a clean Archetype-style block field stands, then wildfire
   enters from the left edge. A turbulent front eats the geometry
   block by block, scorching each one black and dissolving it into
   rising smoke, until only a sliver of geometry survives at the right
   edge. From that surviving edge the blocks regrow, sharper each
   cycle. Order, wildfire, order. The smoke is strictly black and
   off-white; the color lives only in the geometry. */
var PERIOD = 36;
var BURN_END = 18, HOLD_END = 22, REGROW_END = 31;
var SURVIVOR_X = 0.93;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function hash01(n) {
  var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixHex(a, b, f) {
  var ca = hexRgb(a), cb = hexRgb(b);
  var r = Math.round(ca[0] + (cb[0] - ca[0]) * f);
  var g = Math.round(ca[1] + (cb[1] - ca[1]) * f);
  var bl = Math.round(ca[2] + (cb[2] - ca[2]) * f);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Square field on desktop, full-bleed on phones. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, s: s, w: s, h: s };
}
/* ---- block tree: recursive subdivision, fixed seed 934 (PP934) ---- */
var leaves = [];
var rng = mulberry32(934);
function buildTree(x, y, w, h, d) {
  if (d >= 5 || (d >= 3 && rng() < 0.35)) {
    leaves.push({ x: x, y: y, w: w, h: h });
    return;
  }
  var vertical = rng() < 0.5;
  var r = 0.38 + rng() * 0.24;
  if (vertical) {
    buildTree(x, y, w * r, h, d + 1);
    buildTree(x + w * r, y, w * (1 - r), h, d + 1);
  } else {
    buildTree(x, y, w, h * r, d + 1);
    buildTree(x, y + h * r, w, h * (1 - r), d + 1);
  }
}
buildTree(0, 0, SURVIVOR_X, 1, 0);
/* Survivor strip: never burns, split into three stacked blocks. */
(function () {
  var y = 0, i;
  var hs = [0.34, 0.33, 0.33];
  for (i = 0; i < 3; i++) {
    leaves.push({ x: SURVIVOR_X, y: y, w: 1 - SURVIVOR_X, h: hs[i] });
    y += hs[i];
  }
})();
var GEO_COLORS = [MUSTARD, RED, CREAM];
var i;
for (i = 0; i < leaves.length; i++) {
  var b = leaves[i];
  b.idx = i;
  b.uc = b.x + b.w / 2;
  b.vc = b.y + b.h / 2;
  var roll = rng();
  b.color = roll < 0.40 ? MUSTARD : (roll < 0.75 ? RED : CREAM);
  /* Smoke birth: the cycle time the front reaches this block's center. */
  b.tb = BURN_END * clamp((b.uc + 0.02) / 0.92, 0, 1);
}
/* ---- cycle: burn 0-18, hold 18-22, regrow 22-31, rest 31-36 ---- */
function cycleAt(t) {
  var tc = ((t % PERIOD) + PERIOD) % PERIOD;
  var mode, base;
  if (tc < BURN_END) {
    mode = 'burn';
    base = -0.02 + 0.92 * smooth(tc / BURN_END);
  } else if (tc < HOLD_END) {
    mode = 'hold';
    base = 0.90;
  } else if (tc < REGROW_END) {
    mode = 'regrow';
    base = 0.90 * (1 - smooth((tc - HOLD_END) / (REGROW_END - HOLD_END)));
  } else {
    mode = 'rest';
    base = -0.02;
  }
  return { t: tc, mode: mode, base: base };
}
/* Turbulent front line: base position plus curl-ish wobble in v. */
function frontU(v, base) {
  return base
    + 0.020 * Math.sin(v * 9.3 + 1.7)
    + 0.012 * Math.sin(v * 17.7 + 4.1)
    + 0.008 * Math.sin(v * 29.1 + 0.6);
}
function blockAlive(b, cyc) {
  if (cyc.mode === 'rest') return 1;
  if (cyc.mode === 'burn' || cyc.mode === 'hold') {
    var f = frontU(b.vc, cyc.base);
    var p = clamp((f - b.x) / (b.w + 0.04), 0, 1);
    return 1 - p;
  }
  /* Regrow: never below the charred state at the end of the hold,
     then rising as the reverse front passes the block right to left. */
  var fHold = frontU(b.vc, 0.90);
  var pHold = clamp((fHold - b.x) / (b.w + 0.04), 0, 1);
  var aHold = 1 - pHold;
  var aGrow = clamp((b.x + b.w - frontU(b.vc, cyc.base)) / 0.08, 0, 1);
  return Math.max(aHold, aGrow);
}
function drawBlock(b, a, fr) {
  var x = fr.x + b.x * fr.w, y = fr.y + b.y * fr.h;
  var w = b.w * fr.w, h = b.h * fr.h;
  var gap = Math.max(1, fr.s * 0.004);
  /* Charred blocks crumble inward and dissolve; at a = 0 nothing is left. */
  var crumble = Math.pow(1 - a, 1.2) * 0.45;
  var shrink = crumble * Math.min(w, h);
  var ix = x + gap + shrink, iy = y + gap + shrink;
  var iw = w - 2 * gap - 2 * shrink, ih = h - 2 * gap - 2 * shrink;
  if (iw <= 0.5 || ih <= 0.5) return;
  ctx.fillStyle = a >= 0.999 ? b.color : mixHex(b.color, BLACK, 1 - a);
  if (a < 0.3) ctx.globalAlpha = Number((a / 0.3).toFixed(4));
  ctx.fillRect(ix, iy, iw, ih);
  ctx.globalAlpha = 1;
}
function drawSmoke(b, a, tc, fr) {
  var k;
  for (k = 0; k < 5; k++) {
    var h1 = hash01(b.idx * 7 + k * 13 + 3);
    var h2 = hash01(b.idx * 11 + k * 5 + 8);
    var age = tc - b.tb;
    if (age < 0 || age >= 7) continue;
    var fade = 1 - age / 7;
    var alpha = (0.08 + 0.08 * h1) * fade * (1 - a * 0.5);
    if (alpha <= 0.004) continue;
    var px = fr.x + (b.uc + (h1 - 0.5) * b.w * 0.6 + Math.sin(age * 1.2 + h1 * 9) * 0.012) * fr.w;
    var py = fr.y + (b.vc - age * 0.018 - age * age * 0.0006) * fr.h;
    var r = (0.016 + age * 0.008 + h2 * 0.012) * fr.s;
    ctx.fillStyle = (k % 2 === 0) ? BLACK : CREAM;
    ctx.globalAlpha = Number(alpha.toFixed(4));
    ctx.beginPath();
    ctx.moveTo(px + r, py);
    ctx.arc(px, py, r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawFrontBand(cyc, fr) {
  if (cyc.mode !== 'burn' && cyc.mode !== 'hold') return;
  var v, n = 0;
  for (v = 0.02; v <= 1; v += 0.045, n++) {
    var h1 = hash01(n * 3 + 17);
    var h2 = hash01(n * 5 + 41);
    var fx = fr.x + frontU(v, cyc.base) * fr.w;
    var fy = fr.y + (v + (h2 - 0.5) * 0.03) * fr.h;
    var r = (0.014 + h1 * 0.020) * fr.s;
    var alpha = 0.12 + 0.12 * h1;
    ctx.fillStyle = (n % 2 === 0) ? BLACK : CREAM;
    ctx.globalAlpha = Number(alpha.toFixed(4));
    ctx.beginPath();
    ctx.moveTo(fx + r, fy);
    ctx.arc(fx, fy, r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Wildfire Eats the Grid').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Wildfire Eats the Grid').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 25').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Wildfire Eats the Grid', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 25', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the fire burn and the geometry regrow.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var cyc = cycleAt(t);
  var fr = fieldRect();
  var i;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  for (i = 0; i < leaves.length; i++) {
    drawBlock(leaves[i], blockAlive(leaves[i], cyc), fr);
  }
  drawFrontBand(cyc, fr);
  for (i = 0; i < leaves.length; i++) {
    drawSmoke(leaves[i], blockAlive(leaves[i], cyc), cyc.t, fr);
  }
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    cycleAt: function (t) { return cycleAt(t); },
    leafCount: function () { return leaves.length; },
    survivorCount: function () {
      var n = 0, i;
      for (i = 0; i < leaves.length; i++) if (leaves[i].x >= SURVIVOR_X) n++;
      return n;
    },
    colorCounts: function () {
      var c = { mustard: 0, red: 0, cream: 0 }, i;
      for (i = 0; i < leaves.length; i++) {
        if (leaves[i].color === MUSTARD) c.mustard++;
        else if (leaves[i].color === RED) c.red++;
        else c.cream++;
      }
      return c;
    }
  };
}
/* ---- frame one: t = 0, clean field, fire just starting at the left edge ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
