<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1956 Vernell's Dice</title>
<style>
  html, body { margin: 0; padding: 0; background: #6b4a2f; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Vernell's Dice, TC5 / PP1203, study #255 tom-challenger.
  // A child's game board on a table: hand-drawn squares, a pair
  // of dice, small tokens, blue triangle/dash/dot marks like the
  // Yarns notation. Each throw reconfigures the piece: the dice
  // decide which section plays, the tokens set the density.
  // Serious improvisation works over the child's rules. The
  // board is centered; the piece's current state blooms above
  // it as light shapes. The dice are a score, not a contest:
  // there are no points, no winner, only the next section and
  // the next density. Tap the dice to throw.
  var CREAM = '#f7f2e4';    // paper cream, board and hint pill
  var CREAM_DIM = '#e9e2cf';// board edge shade
  var INK = '#3a3128';      // plate ink, warm dark brown
  var PLATE = '#f7f2e4';    // plate ink on the wood, cream
  var BLUE = '#2b4fd8';     // crayon blue, marks and tokens
  var BLUE_DK = '#1e3a9e';  // darker crayon blue
  var RED = '#d9261c';      // crayon red, marks and tokens
  var WOOD = '#8a5f3c';     // table wood, mid tone
  var WOOD_DK = '#6b4a2f';  // table wood, dark tone
  var WOOD_LT = '#a87a52';  // table wood, light tone
  var DICE = '#fdfcf7';     // dice white
  var PIP = '#2b2b28';      // dice pips, near black

  // Fixed-phase first frame: FIRST_T = 6 s. At t = 6 the dice
  // show 3 and 4, so section 2 plays, the tokens are dealt from
  // the opening seed, and the bloom above the board is open.
  var FIRST_T = 6;
  var SEED = 1956;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load,
  // ?throw=<n> applies n throws at load (dice and tokens advance
  // through the seeded throw sequence), ?seed= varies the
  // texture seed. Read at load only.
  var seedParam = 0, probeT = null, probeThrows = 0;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m;
    m = qs.match(/[?&]seed=(-?\d+)/); if (m) { seedParam = parseInt(m[1], 10) || 0; }
    var mt = qs.match(/[?&]t=([0-9.]+)/); if (mt) { probeT = parseFloat(mt[1]); }
    var mh = qs.match(/[?&]throw=(\d+)/); if (mh) { probeThrows = parseInt(mh[1], 10) || 0; }
  } catch (e) {}
  var FIELD_SEED = seedParam ? (SEED + seedParam * 101) : SEED;

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and a fixed salt, so every frame is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // State. The dice and the token deal are the only state, and
  // they only change through a throw, so frame one is a pure
  // function of FIRST_T and the fixed opening state.
  var d1 = 3, d2 = 4;        // opening throw, fixed
  var throwCount = 0;
  var throwT = -10;          // virtual time of the last throw
  var tokens = [];           // 5 tokens, each { sq: 0..15, color }

  // Sections are the four 2x2 quadrants of the 4x4 board:
  // 1 top-left, 2 top-right, 3 bottom-left, 4 bottom-right.
  // The dice sum picks the section; the tokens in that section
  // set the density of the bloom.
  function section() { return ((d1 + d2 - 2) % 4) + 1; }
  function sqSection(sq) {
    var col = sq % 4, row = Math.floor(sq / 4);
    return (row < 2 ? 0 : 2) + (col < 2 ? 1 : 2);
  }
  function tokensInSection() {
    var s = section(), n = 0, i;
    for (i = 0; i < tokens.length; i++) {
      if (sqSection(tokens[i].sq) === s) { n++; }
    }
    return n;
  }
  function density() { return tokensInSection(); } // 0..5
  function bloomScale() {
    var sum = d1 + d2;
    if (sum <= 4) { return 0.8; }
    if (sum <= 8) { return 1.0; }
    return 1.25;
  }

  // Deal five tokens into five distinct squares, seeded by the
  // throw count, so each throw re-deals the tokens deterministically.
  function dealTokens() {
    var rng = mulberry32(FIELD_SEED * 13 + throwCount * 104729 + 85);
    var squares = [];
    var i;
    for (i = 0; i < 16; i++) { squares.push(i); }
    for (i = 15; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = squares[i]; squares[i] = squares[j]; squares[j] = tmp;
    }
    tokens = [];
    for (i = 0; i < 5; i++) {
      tokens.push({ sq: squares[i], color: (i % 2 === 0) ? BLUE : RED });
    }
  }

  // A throw: new dice from the seeded throw sequence, tokens
  // re-dealt, section and density shift. The board, the marks,
  // the palette, and the layout stay put, so a throw is a
  // structural event, not a reseed.
  function throwDice() {
    throwCount++;
    var rng = mulberry32(FIELD_SEED * 7 + throwCount * 7919 + 6);
    d1 = 1 + Math.floor(rng() * 6);
    d2 = 1 + Math.floor(rng() * 6);
    dealTokens();
    throwT = lastT;
    return true;
  }
  dealTokens();

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // Layout, recomputed in draw() from W and H. The board is a
  // square of side bs centered horizontally and sitting a little
  // below center; the bloom lives in the band above it; the dice
  // rest on the board's bottom-right corner.
  var L = {};
  function layout() {
    var u = Math.min(W, H);
    var bs = 0.66 * u;
    var cx = W / 2;
    var cy = H * 0.59;
    L.u = u; L.bs = bs;
    L.bx0 = cx - bs / 2; L.bx1 = cx + bs / 2;
    L.by0 = cy - bs / 2; L.by1 = cy + bs / 2;
    L.cs = bs / 4;
    L.bloomTop = L.by0 - 0.17 * u;
    L.bloomBot = L.by0 - 0.015 * u;
    var ds = 0.085 * u;
    L.ds = ds;
    L.die1 = { x: L.bx1 - 0.11 * u, y: L.by1 - 0.10 * u, s: ds };
    L.die2 = { x: L.bx1 - 0.015 * u, y: L.by1 - 0.015 * u, s: ds };
  }
  function sqCenter(sq) {
    var col = sq % 4, row = Math.floor(sq / 4);
    return {
      x: L.bx0 + (col + 0.5) * L.cs,
      y: L.by0 + (row + 0.5) * L.cs
    };
  }
  function sectionColCenter(s) {
    // Horizontal center of a section's column, for the bloom band.
    var col = (s === 2 || s === 4) ? 1 : 0;
    return L.bx0 + (col * 2 + 1) * L.cs;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function lerp(a, b, f) { return a + (b - a) * f; }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The table: warm wood, a vertical gradient with plank seams
  // and faint grain strokes, all seeded so the wood is fixed.
  function drawWood() {
    var grad = ctx.createLinearGradient(0, 0, W * 0.3, H);
    grad.addColorStop(0, WOOD_LT);
    grad.addColorStop(0.5, WOOD);
    grad.addColorStop(1, WOOD_DK);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    var rng = mulberry32(FIELD_SEED * 3 + 11);
    var i, y;
    ctx.strokeStyle = hexA(WOOD_DK, a4(0.45));
    ctx.lineWidth = 2;
    for (i = 1; i < 5; i++) {
      y = (H / 5) * i + (rng() - 0.5) * 8;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y + (rng() - 0.5) * 6); ctx.stroke();
    }
    ctx.strokeStyle = hexA(WOOD_DK, a4(0.16));
    ctx.lineWidth = 1;
    for (i = 0; i < 26; i++) {
      y = rng() * H;
      var x0 = rng() * W * 0.7;
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.bezierCurveTo(x0 + 40, y + (rng() - 0.5) * 6, x0 + 90, y + (rng() - 0.5) * 6, x0 + 140 + rng() * 60, y + (rng() - 0.5) * 8);
      ctx.stroke();
    }
  }

  // A hand-drawn wobbly line between two points, seeded by salt.
  function wobblyLine(x0, y0, x1, y1, salt, steps) {
    var rng = mulberry32(FIELD_SEED * 101 + salt);
    var i, f, x, y;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    for (i = 1; i < steps; i++) {
      f = i / steps;
      x = lerp(x0, x1, f) + (rng() - 0.5) * 3;
      y = lerp(y0, y1, f) + (rng() - 0.5) * 3;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  // The board: a cream paper square with a soft shadow, a
  // hand-drawn 4x4 grid, and a faint wash over the section that
  // is currently playing. A small blue triangle marks the active
  // section's column on the board's top edge.
  function drawBoard() {
    // Soft shadow under the board.
    ctx.fillStyle = hexA('#3d2a18', a4(0.35));
    ctx.fillRect(L.bx0 + 5, L.by0 + 7, L.bs, L.bs);
    // Paper.
    ctx.fillStyle = CREAM;
    ctx.fillRect(L.bx0, L.by0, L.bs, L.bs);
    // Paper edge shade along the bottom and right.
    ctx.fillStyle = hexA(CREAM_DIM, a4(0.7));
    ctx.fillRect(L.bx0, L.by1 - 3, L.bs, 3);
    ctx.fillRect(L.bx1 - 3, L.by0, 3, L.bs);
    // Wash over the playing section.
    var s = section();
    var scol = (s === 2 || s === 4) ? 2 : 0;
    var srow = (s >= 3) ? 2 : 0;
    ctx.fillStyle = hexA(BLUE, a4(0.07));
    ctx.fillRect(L.bx0 + scol * L.cs, L.by0 + srow * L.cs, 2 * L.cs, 2 * L.cs);
    // Hand-drawn grid.
    ctx.strokeStyle = hexA(INK, a4(0.8));
    ctx.lineWidth = 1.6;
    var i;
    for (i = 0; i <= 4; i++) {
      wobblyLine(L.bx0 + i * L.cs, L.by0, L.bx0 + i * L.cs, L.by1, 100 + i, 6);
      wobblyLine(L.bx0, L.by0 + i * L.cs, L.bx1, L.by0 + i * L.cs, 200 + i, 6);
    }
    // Heavier hand-drawn border, drawn twice with a slight offset.
    ctx.strokeStyle = hexA(INK, a4(0.9));
    ctx.lineWidth = 2.5;
    wobblyLine(L.bx0, L.by0, L.bx1, L.by0, 301, 8);
    wobblyLine(L.bx1, L.by0, L.bx1, L.by1, 302, 8);
    wobblyLine(L.bx1, L.by1, L.bx0, L.by1, 303, 8);
    wobblyLine(L.bx0, L.by1, L.bx0, L.by0, 304, 8);
    // Section marker: a small blue triangle above the playing column.
    var mx = sectionColCenter(s);
    var my = L.by0 - 0.028 * L.u;
    ctx.fillStyle = BLUE;
    ctx.beginPath();
    ctx.moveTo(mx, my + 9);
    ctx.lineTo(mx - 8, my - 5);
    ctx.lineTo(mx + 8, my - 5);
    ctx.closePath();
    ctx.fill();
  }

  // Yarns notation in every square: a blue triangle, a red dash,
  // or a blue dot, placed with a seeded jitter so each square
  // reads hand-marked. Marks in the playing section are drawn
  // a touch larger.
  function drawMarks() {
    var s = section();
    var sq;
    for (sq = 0; sq < 16; sq++) {
      var rng = mulberry32(FIELD_SEED * 17 + sq * 31 + 3);
      var c = sqCenter(sq);
      var jx = (rng() - 0.5) * L.cs * 0.3;
      var jy = (rng() - 0.5) * L.cs * 0.3;
      var kind = Math.floor(rng() * 3);
      var big = (sqSection(sq) === s) ? 1.25 : 1.0;
      var r = L.cs * 0.16 * big;
      var x = c.x + jx, y = c.y + jy;
      if (kind === 0) {
        ctx.fillStyle = hexA(BLUE, a4(0.9));
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.lineTo(x + r * 0.9, y + r * 0.7);
        ctx.lineTo(x - r * 0.9, y + r * 0.7);
        ctx.closePath();
        ctx.fill();
      } else if (kind === 1) {
        ctx.strokeStyle = hexA(RED, a4(0.9));
        ctx.lineWidth = 3 * big;
        var ang = (rng() - 0.5) * 0.6;
        var dx = Math.cos(ang) * r, dy = Math.sin(ang) * r;
        ctx.beginPath(); ctx.moveTo(x - dx, y - dy); ctx.lineTo(x + dx, y + dy); ctx.stroke();
      } else {
        ctx.fillStyle = hexA(BLUE, a4(0.9));
        ctx.beginPath(); ctx.moveTo(x + r * 0.6, y); ctx.arc(x, y, r * 0.6, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // The five tokens: small discs in their dealt squares, blue
  // and red alternating, with a darker rim and a soft shadow.
  function drawTokens() {
    var i;
    for (i = 0; i < tokens.length; i++) {
      var tk = tokens[i];
      var c = sqCenter(tk.sq);
      var rng = mulberry32(FIELD_SEED * 23 + i * 47 + throwCount * 13 + 9);
      var jx = (rng() - 0.5) * L.cs * 0.22;
      var jy = (rng() - 0.5) * L.cs * 0.22;
      var x = c.x + jx, y = c.y + jy;
      var r = L.cs * 0.17;
      ctx.fillStyle = hexA('#3d2a18', a4(0.3));
      ctx.beginPath(); ctx.moveTo(x + r + 2, y + 2); ctx.arc(x + 2, y + 3, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = tk.color;
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = hexA(tk.color === BLUE ? BLUE_DK : '#8f1a12', a4(0.9));
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = hexA('#ffffff', a4(0.45));
      ctx.beginPath(); ctx.moveTo(x - r * 0.3 + 2, y - r * 0.3); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.28, 0, Math.PI * 2); ctx.fill();
    }
  }

  // One die: a white rounded square with a soft shadow and pips
  // in the standard layout, drawn at (cx, cy) with side s.
  function drawDie(cx, cy, s, val) {
    var r = s * 0.18;
    ctx.fillStyle = hexA('#3d2a18', a4(0.35));
    roundRect(cx - s / 2 + 3, cy - s / 2 + 4, s, s, r);
    ctx.fill();
    ctx.fillStyle = DICE;
    roundRect(cx - s / 2, cy - s / 2, s, s, r);
    ctx.fill();
    ctx.strokeStyle = hexA(INK, a4(0.55));
    ctx.lineWidth = 1.5;
    roundRect(cx - s / 2, cy - s / 2, s, s, r);
    ctx.stroke();
    var o = s * 0.26;
    var pr = s * 0.085;
    var pts = [];
    if (val === 1) { pts = [[0, 0]]; }
    else if (val === 2) { pts = [[-o, -o], [o, o]]; }
    else if (val === 3) { pts = [[-o, -o], [0, 0], [o, o]]; }
    else if (val === 4) { pts = [[-o, -o], [o, -o], [-o, o], [o, o]]; }
    else if (val === 5) { pts = [[-o, -o], [o, -o], [0, 0], [-o, o], [o, o]]; }
    else { pts = [[-o, -o], [o, -o], [-o, 0], [o, 0], [-o, o], [o, o]]; }
    ctx.fillStyle = PIP;
    var i;
    for (i = 0; i < pts.length; i++) {
      ctx.beginPath(); ctx.moveTo(cx + pts[i][0] + pr, cy + pts[i][1]); ctx.arc(cx + pts[i][0], cy + pts[i][1], pr, 0, Math.PI * 2); ctx.fill();
    }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  function drawDice() {
    drawDie(L.die1.x, L.die1.y, L.die1.s, d1);
    drawDie(L.die2.x, L.die2.y, L.die2.s, d2);
  }

  // The bloom: the current state made visible above the board.
  // Light shapes, blue triangles, red dashes, cream dots, drift
  // slowly in the band above the board over the playing section's
  // column. The count is 4 plus 6 per token in the playing
  // section, the size follows the dice sum, and a fresh throw
  // fades the bloom in over about a second.
  function drawBloom(t) {
    var s = section();
    var n = 4 + 6 * tokensInSection();
    var sc = bloomScale();
    var cx = sectionColCenter(s);
    var fade = clamp((t - throwT) / 1.2, 0, 1);
    if (fade <= 0) { return; }
    // Soft glow behind the bloom.
    var gy = (L.bloomTop + L.bloomBot) / 2;
    var glowR = L.u * 0.16 * sc;
    var pulse = 0.5 + 0.5 * Math.sin(t * 0.35);
    ctx.fillStyle = hexA(CREAM, a4(0.05 + 0.03 * pulse) * fade);
    ctx.beginPath(); ctx.moveTo(cx + glowR, gy); ctx.arc(cx, gy, glowR, 0, Math.PI * 2); ctx.fill();
    var i;
    for (i = 0; i < n; i++) {
      var rng = mulberry32(FIELD_SEED * 29 + s * 101 + tokensInSection() * 7 + i * 53 + 13);
      var fx = rng(), fy = rng();
      var bx = cx + (fx - 0.5) * L.u * 0.30;
      var by = lerp(L.bloomTop, L.bloomBot, fy);
      var phase = rng() * Math.PI * 2;
      var drift = 0.05 + rng() * 0.05;
      bx += Math.sin(t * drift * 2 * Math.PI + phase) * 7;
      by += Math.sin(t * drift * 1.4 * Math.PI + phase * 1.7) * 5;
      var kind = Math.floor(rng() * 3);
      var r = (5 + rng() * 9) * sc;
      var al = (0.45 + rng() * 0.4) * fade;
      if (kind === 0) {
        ctx.fillStyle = hexA(BLUE, a4(al));
        ctx.beginPath();
        ctx.moveTo(bx, by - r);
        ctx.lineTo(bx + r * 0.9, by + r * 0.7);
        ctx.lineTo(bx - r * 0.9, by + r * 0.7);
        ctx.closePath();
        ctx.fill();
      } else if (kind === 1) {
        ctx.strokeStyle = hexA(RED, a4(al));
        ctx.lineWidth = 3;
        var ang = (rng() - 0.5) * 0.8;
        ctx.beginPath();
        ctx.moveTo(bx - Math.cos(ang) * r, by - Math.sin(ang) * r);
        ctx.lineTo(bx + Math.cos(ang) * r, by + Math.sin(ang) * r);
        ctx.stroke();
      } else {
        ctx.fillStyle = hexA(CREAM, a4(al));
        ctx.beginPath(); ctx.moveTo(bx + r * 0.55, by); ctx.arc(bx, by, r * 0.55, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    drawWood();
    drawBloom(t);
    drawBoard();
    drawMarks();
    drawTokens();
    drawDice();

    // ---- Plates: title top-left, number and date below it, a
    // short descriptor and the section readout top-right. The
    // plates sit on the wood, so they use the cream plate ink.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = PLATE;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText("Vernell's Dice", 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(PLATE, 0.8);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1956 · 2007 · 05 · 21', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(PLATE, 0.65);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('the dice are a score', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.fillStyle = hexA(PLATE, 0.8);
    ctx.font = fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Section ' + section() + ' of 4 · Density ' + density(), W - 18, 18 + fsTitle * 0.8 + fsSmall + 8 + fsSmall + 6);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom on a cream pill so it
    // stays legible over the wood.
    var hint = 'Tap the dice to throw.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(CREAM, a4(0.9));
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  function perfT() { return lastT; }

  function canvasPos(e) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (err) {}
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  // Tap on either die throws the dice. The hit area is generous:
  // each die plus a small margin around it.
  function onDice(nx, ny) {
    var px = nx * W, py = ny * H;
    var m = L.ds * 0.35;
    function hit(d) {
      return px >= d.x - d.s / 2 - m && px <= d.x + d.s / 2 + m &&
             py >= d.y - d.s / 2 - m && py <= d.y + d.s / 2 + m;
    }
    return hit(L.die1) || hit(L.die2);
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      var rect = { left: 0, top: 0 };
      try { rect = canvas.getBoundingClientRect(); } catch (err) {}
      var nx = (e.clientX - rect.left) / W;
      var ny = (e.clientY - rect.top) / H;
      if (!onDice(nx, ny)) { return; }
      throwDice();
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      draw(reduced ? FIRST_T : perfT());
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1956 exposes the throw, the section, the
  // density, the dice, and the token deal.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1956 = {
      throwDice: throwDice,
      section: section,
      density: density,
      tokensInSection: tokensInSection,
      dice: function () { return [d1, d2]; },
      throwCount: function () { return throwCount; },
      bloomCount: function () { return 4 + 6 * tokensInSection(); },
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  // Apply the ?throw= hook after resize(), before the first frame.
  var ti;
  for (ti = 0; ti < probeThrows; ti++) { throwDice(); }
  if (probeThrows > 0) { throwT = -10; } // a load-time throw reads as settled
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the bloom drifts at about 0.05 to 0.1 Hz and the
  // glow pulses at about 0.06 Hz, all well under the 14 Hz
  // ceiling. Guarded so node-canvas QA (no requestAnimationFrame)
  // still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
