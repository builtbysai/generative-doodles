<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Button Pusher</title>
<style>
  html, body { margin: 0; padding: 0; background: #E8DFC9; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1245 "Button Pusher" - Adan De La Garza study block ADG6.
   After De La Garza's Button Pusher (2015-ongoing), the annual photo
   zine: the camera as a nervous habit, a reflex for moving through
   space. A year of procedural snapshots - doorways, cup shadows,
   pigeons, cracked windshields, empty chairs, handrails - fills a
   12 x 30 calendar grid tile by tile over 120 seconds, each photo
   landing with a soft xerox thump, each one a little crooked, each
   one framed slightly wrong. No captions, ever: the photos explain
   nothing. Drag vertically to scrub back through the archive of
   completed years; tap a photo to hold it up close with a zine-page
   wobble; double-tap reseeds the year. Silent; flat fills only;
   seeded hashes only. */

var T0 = 47;                   // fixed first-frame phase: 141 tiles filled
var YEAR_LEN = 120;            // seconds for one year to fill
var COLS = 30, ROWS = 12, NTILES = COLS * ROWS;
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

var PAL = {
  paper: '#E8DFC9', slot: '#DED1B2', panel: '#F0E7D0',
  ink: '#1B1B1B', band: '#B04A3A', bandInk: '#E8DFC9',
  doorBrown: '#6E5643', doorWall: '#9A8266', doorDark: '#46351F',
  cupGrey: '#8A8D94', glare: '#C9CDD3', light: '#DDE1E6',
  pig: '#7A8699', pigDark: '#57637A', skyMute: '#9DADC0',
  dash: '#33302A', chairWall: '#B3A184', floor: '#87765B',
  railWall: '#A79C8B', winWall: '#6E6F72', winLit: '#F2EAD8',
  stairA: '#C9CDD3', stairB: '#7A8699'
};

/* ---------- seeded hash (integer, deterministic) ---------- */
function ih(a, b) {
  var x = ((a | 0) * 374761393 + (b | 0) * 668265263) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/* ---------- time ---------- */
function perfNow() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
}
var startPerf = perfNow();
function pieceNow() { return T0 + (perfNow() - startPerf); }

/* ---------- state (all interaction is recorded, never integrated) ---------- */
var salt = 0;                  // double-tap reseeds the photos
var scrub = 0;                 // seconds scrubbed back into the archive
var big = null;                // enlarged tile: {year, idx, t} in perf seconds

function dispTime() { return Math.max(0, pieceNow() - scrub); }
/* fill state of a displayed moment: which year, how many tiles */
function fillState(t) {
  var year = Math.floor(t / YEAR_LEN);
  var within = t - year * YEAR_LEN;
  var count = clamp(Math.floor(within * 3 + 0.5), 0, NTILES);
  return { year: year, within: within, count: count };
}
function tileAge(within, i) { return within - (i + 0.5) / 3; }

/* ---------- per-tile photo identity ---------- */
function photoOf(year, idx) {
  var seed = 1245 + salt * 7919 + year * 104729;
  return {
    tpl: Math.floor(ih(seed, idx * 7 + 1) * 9),
    flip: ih(seed, idx * 7 + 2) < 0.5 ? 1 : -1,
    ox: (ih(seed, idx * 7 + 3) - 0.5) * 0.16,
    oy: (ih(seed, idx * 7 + 4) - 0.5) * 0.16,
    tint: ih(seed, idx * 7 + 5),
    rot: (ih(seed, idx * 7 + 6) * 2 - 1) * 0.0349,      // +/- 2 degrees
    jx: (ih(seed, idx * 7 + 7) - 0.5) * 0.10,
    jy: (ih(seed + 31, idx * 7 + 1) - 0.5) * 0.10
  };
}

/* ---------- layout ---------- */
function isPhone() {
  var s = window.screen;
  if (s && Math.min(s.width, s.height) < 700) return true;
  return H > W * 1.15;
}
function layout() {
  var phone = isPhone();
  var padX = Math.max(10, W * 0.035), padY = Math.max(10, H * 0.035);
  var bandW = phone ? 18 : clamp(W * 0.028, 16, 30);
  var bandGap = Math.max(4, Math.round(W * 0.006));
  var availW = W - 2 * padX - bandW - bandGap;
  var availH = H - 2 * padY;
  var gap = 2;
  var tile = Math.floor(Math.min((availW - (COLS - 1) * gap) / COLS,
                                  (availH - (ROWS - 1) * gap) / ROWS));
  if (tile < 12) { gap = 1; tile = Math.floor(Math.min((availW - (COLS - 1) * gap) / COLS,
                                                       (availH - (ROWS - 1) * gap) / ROWS)); }
  var gridW = COLS * tile + (COLS - 1) * gap;
  var gridH = ROWS * tile + (ROWS - 1) * gap;
  var blockW = bandW + bandGap + gridW;
  var x0 = Math.round((W - blockW) / 2);
  var y0 = Math.round((H - gridH) / 2);
  return {
    phone: phone, tile: tile, gap: gap, bandW: bandW, bandGap: bandGap,
    bandX: x0, gridX: x0 + bandW + bandGap, gridY: y0,
    gridW: gridW, gridH: gridH, pitch: tile + gap
  };
}

/* ---------- drawing helpers ---------- */
function rect(x, y, w, h) { ctx.fillRect(x, y, w, h); }
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function poly(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
function line(x1, y1, x2, y2, w) {
  ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

/* ---------- photo templates ----------
   Drawn in local coords: square of side s centred on 0,0.
   Background first (full square), then the framed-wrong foreground. */
function drawPhotoContents(p, s) {
  var u = s;                                   // local unit = tile side
  ctx.save();
  ctx.beginPath(); ctx.rect(-u / 2, -u / 2, u, u); ctx.clip();
  drawPhotoBg(p, u);
  ctx.translate(p.ox * u, p.oy * u);
  ctx.scale(p.flip, 1);
  drawPhotoFg(p, u);
  ctx.restore();
}
function drawPhotoBg(p, u) {
  var c;
  switch (p.tpl) {
    case 0: c = PAL.doorWall; break;
    case 1: c = PAL.glare; break;
    case 2: c = PAL.skyMute; break;
    case 3: c = PAL.glare; break;
    case 4: c = PAL.chairWall; break;
    case 5: c = PAL.railWall; break;
    case 6: c = PAL.winWall; break;
    case 7: c = PAL.cupGrey; break;
    default: c = PAL.stairB; break;
  }
  if (p.tpl === 4) {                            // chair: wall over floor
    ctx.fillStyle = PAL.chairWall; rect(-u / 2, -u / 2, u, u * 0.62);
    ctx.fillStyle = PAL.floor; rect(-u / 2, u * 0.12, u, u * 0.38);
    return;
  }
  if (p.tpl === 6) {                            // window: wall over floor
    ctx.fillStyle = PAL.winWall; rect(-u / 2, -u / 2, u, u * 0.72);
    ctx.fillStyle = PAL.floor; rect(-u / 2, u * 0.22, u, u * 0.28);
    return;
  }
  ctx.fillStyle = c; rect(-u / 2, -u / 2, u, u);
}
function drawPhotoFg(p, u) {
  var ink = PAL.ink;
  switch (p.tpl) {
    case 0: { /* doorway */
      ctx.fillStyle = PAL.doorBrown; rect(-u * 0.30, u * 0.22, u * 0.86, u * 0.28);
      ctx.fillStyle = PAL.doorDark; rect(-u * 0.22, -u * 0.44, u * 0.44, u * 0.68);
      ctx.strokeStyle = PAL.doorWall; line(-u * 0.22, -u * 0.44, u * 0.22, -u * 0.44, u * 0.03);
      line(-u * 0.22, -u * 0.44, -u * 0.22, u * 0.24, u * 0.03);
      line(u * 0.22, -u * 0.44, u * 0.22, u * 0.24, u * 0.03);
      ctx.fillStyle = PAL.glare; circ(u * 0.13, -u * 0.08, u * 0.035);
      break;
    }
    case 1: { /* coffee cup's shadow */
      ctx.fillStyle = PAL.light;
      poly([-u / 2, -u / 2, u * 0.1, -u / 2, -u * 0.3, u / 2, -u / 2, u / 2]);
      ctx.fillStyle = PAL.cupGrey; ell(u * 0.10, u * 0.16, u * 0.30, u * 0.12);
      ctx.fillStyle = PAL.dash; ell(u * 0.06, u * 0.13, u * 0.17, u * 0.06);
      ctx.strokeStyle = ink; ctx.lineWidth = u * 0.035;
      ctx.beginPath(); ctx.arc(-u * 0.20, -u * 0.16, u * 0.13, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = PAL.cupGrey; ell(-u * 0.20, -u * 0.16, u * 0.07, u * 0.035);
      break;
    }
    case 2: { /* pigeon */
      ctx.fillStyle = PAL.pig; rect(-u / 2, u * 0.26, u, u * 0.24);
      ctx.strokeStyle = PAL.pigDark;
      line(-u * 0.06, u * 0.30, -u * 0.06, u * 0.42, u * 0.025);
      line(u * 0.08, u * 0.30, u * 0.08, u * 0.42, u * 0.025);
      ctx.fillStyle = PAL.pig;
      poly([-u * 0.18, -u * 0.02, -u * 0.44, -u * 0.16, -u * 0.40, u * 0.06, -u * 0.16, u * 0.08]);
      ell(0, 0, u * 0.27, u * 0.18);
      ctx.fillStyle = PAL.pigDark; circ(u * 0.22, -u * 0.15, u * 0.105);
      ctx.fillStyle = ink; poly([u * 0.31, -u * 0.17, u * 0.42, -u * 0.11, u * 0.31, -u * 0.09]);
      ctx.fillStyle = PAL.winLit; circ(u * 0.25, -u * 0.18, u * 0.022);
      break;
    }
    case 3: { /* cracked windshield */
      ctx.fillStyle = PAL.light; poly([-u / 2, -u / 2, u * 0.2, -u / 2, -u * 0.1, u * 0.1, -u / 2, u * 0.1]);
      ctx.fillStyle = PAL.dash; rect(-u / 2, u * 0.24, u, u * 0.26);
      ctx.strokeStyle = ink;
      var cx = u * 0.10, cy = -u * 0.04, k, ang;
      for (k = 0; k < 6; k++) {
        ang = k * 1.13 + p.tint * 0.7;
        line(cx, cy, cx + Math.cos(ang) * u * (0.22 + 0.16 * ih(9, k)),
             cy + Math.sin(ang) * u * (0.22 + 0.16 * ih(9, k + 40)), u * 0.02);
      }
      ctx.beginPath(); ctx.arc(cx, cy, u * 0.05, 0, Math.PI * 2); ctx.stroke();
      break;
    }
    case 4: { /* empty chair */
      ctx.fillStyle = PAL.dash; ell(u * 0.02, u * 0.40, u * 0.26, u * 0.045);
      ctx.fillStyle = ink;
      rect(-u * 0.20, -u * 0.34, u * 0.07, u * 0.44);
      rect(u * 0.14, -u * 0.34, u * 0.07, u * 0.44);
      rect(-u * 0.20, -u * 0.34, u * 0.41, u * 0.07);
      rect(-u * 0.20, -u * 0.16, u * 0.41, u * 0.05);
      rect(-u * 0.22, u * 0.08, u * 0.45, u * 0.06);
      rect(-u * 0.19, u * 0.14, u * 0.055, u * 0.30);
      rect(u * 0.15, u * 0.14, u * 0.055, u * 0.30);
      break;
    }
    case 5: { /* handrail */
      ctx.strokeStyle = ink;
      var bx, railY;
      for (bx = -0.42; bx <= 0.43; bx += 0.14) {
        railY = -bx * u * 0.62;
        line(bx * u, railY, bx * u, u * 0.5, u * 0.028);
      }
      line(-u * 0.52, u * 0.34, u * 0.52, -u * 0.30, u * 0.075);
      ctx.strokeStyle = PAL.dash;
      line(-u * 0.52, u * 0.42, u * 0.52, -u * 0.22, u * 0.03);
      break;
    }
    case 6: { /* window light */
      ctx.fillStyle = PAL.cupGrey;
      poly([-u * 0.24, u * 0.02, u * 0.28, u * 0.02, u * 0.44, u * 0.5, -u * 0.02, u * 0.5]);
      ctx.fillStyle = PAL.winLit; rect(-u * 0.26, -u * 0.42, u * 0.54, u * 0.46);
      ctx.strokeStyle = ink;
      line(0, -u * 0.42, 0, u * 0.04, u * 0.035);
      line(-u * 0.26, -u * 0.19, u * 0.28, -u * 0.19, u * 0.035);
      ctx.strokeRect(-u * 0.26, -u * 0.42, u * 0.54, u * 0.46);
      break;
    }
    case 7: { /* floor tiles */
      var r, cc, rh = [0.10, 0.13, 0.17, 0.24], yy = -u / 2;
      for (r = 0; r < 4; r++) {
        var hh = rh[r] * u;
        for (cc = 0; cc < 5; cc++) {
          ctx.fillStyle = ((r + cc) % 2 === 0) ? PAL.glare : PAL.cupGrey;
          var inset = (r * 0.09) * u;
          var cw = (u - inset * 2) / 5;
          rect(-u / 2 + inset + cc * cw + 1, yy + 1, cw - 2, hh - 2);
        }
        yy += hh;
      }
      ctx.fillStyle = PAL.dash; rect(-u / 2, -u / 2, u, u * 0.05);
      break;
    }
    default: { /* stair edge */
      ctx.fillStyle = PAL.stairB; rect(-u / 2, -u / 2, u, u);
      ctx.fillStyle = PAL.stairA;
      var sx = -u / 2, sy = u / 2, st;
      ctx.beginPath(); ctx.moveTo(-u / 2, u / 2);
      for (st = 0; st < 5; st++) {
        sy -= u * 0.17; ctx.lineTo(sx, sy);
        sx += u * 0.2; ctx.lineTo(sx, sy);
      }
      ctx.lineTo(u / 2, u / 2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = ink;
      line(-u * 0.44, -u * 0.02, u * 0.46, -u * 0.40, u * 0.04);
      break;
    }
  }
}

/* ---------- one grid tile ---------- */
function drawTile(L, fs, i) {
  var row = Math.floor(i / COLS), col = i % COLS;
  var s = L.tile;
  var cx = L.gridX + col * L.pitch + s / 2;
  var cy = L.gridY + row * L.pitch + s / 2;
  var filled = i < fs.count;
  if (!filled) {
    ctx.fillStyle = PAL.slot;
    rect(cx - s / 2, cy - s / 2, s, s);
    return;
  }
  var p = photoOf(fs.year, i);
  var age = tileAge(fs.within, i);
  var newest = (i === fs.count - 1);
  if (newest && age >= 0 && age < 0.034) {       // xerox flash, one frame
    ctx.fillStyle = '#F7F1DE';
    rect(cx - s / 2 - 1, cy - s / 2 - 1, s + 2, s + 2);
  }
  var sc = 1;
  if (newest && age >= 0 && age < 0.15) sc = 1.06 - 0.06 * (age / 0.15);
  ctx.save();
  ctx.translate(cx + p.jx * s, cy + p.jy * s);
  ctx.rotate(p.rot);
  ctx.scale(sc, sc);
  drawPhotoContents(p, s);
  ctx.restore();
}

/* ---------- the enlarged photo ---------- */
function drawBig(L, t) {
  if (!big) return;
  var age = perfNow() - big.t;
  var s = L.tile * 4;
  var cx = W / 2, cy = H / 2;
  ctx.fillStyle = PAL.panel;
  rect(cx - s * 0.58, cy - s * 0.58, s * 1.16, s * 1.16);
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.5;
  ctx.strokeRect(cx - s * 0.58, cy - s * 0.58, s * 1.16, s * 1.16);
  var p = photoOf(big.year, big.idx);
  var wob = age < 1.6 ? 0.055 * Math.sin(age * 22.4) * Math.exp(-age * 3.6) : 0;
  var pop = 0.86 + 0.14 * Math.min(1, age / 0.18);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(p.rot + wob);
  ctx.scale(pop, pop);
  drawPhotoContents(p, s);
  ctx.restore();
}

/* ---------- draw ---------- */
function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var L = layout();
  ctx.fillStyle = PAL.paper;
  rect(0, 0, W, H);
  var fs = fillState(Math.max(0, t - scrub));

  /* month band */
  ctx.fillStyle = PAL.band;
  rect(L.bandX, L.gridY, L.bandW, L.gridH);
  ctx.fillStyle = PAL.bandInk;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + Math.max(7, Math.round(L.bandW * 0.52)) + 'px "Courier New",monospace';
  var m;
  for (m = 0; m < ROWS; m++) {
    ctx.fillText(String(m + 1), L.bandX + L.bandW / 2, L.gridY + m * L.pitch + L.tile / 2 + 1);
    if (m > 0) {
      ctx.fillStyle = PAL.paper;
      rect(L.bandX, L.gridY + m * L.pitch - L.gap / 2 - 0.5, L.bandW, 1);
      ctx.fillStyle = PAL.bandInk;
    }
  }

  /* tiles */
  var i;
  for (i = 0; i < NTILES; i++) drawTile(L, fs, i);

  /* archive dots: one per year completed before the displayed year */
  var dots = Math.min(fs.year, 60);
  if (dots > 0) {
    ctx.fillStyle = PAL.ink;
    var dy = L.gridY + L.gridH + Math.max(8, H * 0.02);
    for (i = 0; i < dots; i++) circ(L.bandX + L.bandW / 2 + i * 9 - (dots - 1) * 4.5, dy, 2);
  }

  drawBig(L, t);
}

/* ---------- interaction ---------- */
var dragging = false, dragMoved = false, downX = 0, downY = 0, lastY = 0,
    downT = 0, lastTapT = -10;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; dragMoved = false;
  downX = e.clientX; downY = e.clientY; lastY = e.clientY; downT = perfNow();
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var dy = e.clientY - lastY; lastY = e.clientY;
  var dx = e.clientX - downX;
  if (Math.abs(e.clientY - downY) > 6 || Math.abs(dx) > 6) dragMoved = true;
  if (dragMoved && Math.abs(e.clientY - downY) >= Math.abs(dx)) {
    var L = layout();
    var maxScrub = pieceNow();                 // never before time zero
    scrub = clamp(scrub + dy * (YEAR_LEN / Math.max(1, L.gridH)), 0, maxScrub);
  }
});
function endPointer(e) {
  if (!dragging) return; dragging = false;
  if (dragMoved) { lastTapT = -10; return; }
  var now = perfNow();
  if (now - downT > 0.5) return;
  if (now - lastTapT < 0.34) {                   // double-tap: reseed
    salt++; big = null; lastTapT = -10; return;
  }
  lastTapT = now;
  if (big) { big = null; return; }               // tap again releases
  var L = layout();
  var fs = fillState(dispTime());
  var col = Math.floor((downX - L.gridX) / L.pitch);
  var row = Math.floor((downY - L.gridY) / L.pitch);
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
  if ((downX - L.gridX) % L.pitch > L.tile || (downY - L.gridY) % L.pitch > L.tile) return;
  var idx = row * COLS + col;
  if (idx < fs.count) big = { year: fs.year, idx: idx, t: now };
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- sizing: Visual Viewport API ---------- */
function resize() {
  var vv = window.visualViewport;
  W = Math.floor(vv ? vv.width : window.innerWidth);
  H = Math.floor(vv ? vv.height : window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceNow()); });
window.addEventListener('resize', function () { resize(); draw(pieceNow()); });

resize();
draw(T0);                                        // synchronous fixed-phase first frame
if (typeof requestAnimationFrame === 'function') {
  var tick = function () {
    draw(pieceNow());
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
