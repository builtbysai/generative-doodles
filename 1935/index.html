<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1935 The Arrangement Grid</title>
<style>
  html, body { margin: 0; padding: 0; background: #24262a; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/chris-hyson.md does not exist in the repo, so these
  // hex values are chosen from the prompt's own color names.
  var BG = '#24262a';       // DAW dark grey ground
  var PANEL = '#282b2f';     // lane ground, a shade lighter
  var GRID = '#3a3d42';      // grid lines
  var PIANO = '#8fc3e8';    // piano figure, ice blue
  var PIANO_BD = '#b7d9f2'; // piano border, lighter ice blue
  var DRUM = '#5c6067';     // drum loop, charcoal (lightened so it reads on the dark ground)
  var DRUM_BD = '#8b8e95';  // drum border
  var VOCAL = '#d9a441';     // vocal, warm gold
  var VOCAL_BD = '#eec27a'; // vocal border, lighter gold
  var SYNTH = '#21756d';    // synth bed, deep teal
  var SYNTH_BD = '#3f9a90'; // synth border, lighter teal
  var PLAYHEAD = '#f2f0e8'; // playhead, pale white
  var INK = '#e8e6df';      // plate ink, bone white
  var INK_DIM = '#9a978c';  // muted ink

  // Fixed-phase first frame: t = 12 s, playhead at year 2020, mid
  // ferment. At 2020 the piano and drum are present, the vocal is muted,
  // and the synth bed has not arrived yet, so all three stem states read
  // at frame one. Frame one is byte-reproducible: every clip, tick and
  // drift offset is a pure function of t and the seeded PRNG.
  var FIRST_T = 12;
  var FIRST_YEAR = 2020;
  var YEAR0 = 2017, YEAR1 = 2023;

  // Seeded PRNG, mulberry32. A fresh instance is built per draw from the
  // piece number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Year-keyed arrangement model. keys are stem states at 2017..2023:
  // 1 present, 0.35 muted, 0 absent. States interpolate linearly between
  // integer years as the playhead scrubs, so the mix cross-fades instead
  // of snapping. Clips are regions with year spans; a clip is active
  // while the playhead year falls inside its span (with a short fade at
  // each edge) and a faint ghost otherwise, so the whole timeline stays
  // visible while the playhead's year lights up the live arrangement.
  // Clips sharing a group number g reuse the same waveform pattern: the
  // region was duplicated, not re-recorded.
  var STEMS = [
    { name: 'piano figure', origin: '2015', color: PIANO, border: PIANO_BD,
      keys: [1, 1, 0.35, 1, 0.35, 1, 1],
      clips: [
        { y0: 2017, y1: 2018.5, g: 1 }, { y0: 2018.5, y1: 2019.7, g: 2 },
        { y0: 2019.7, y1: 2021.2, g: 1 }, { y0: 2021.2, y1: 2022.1, g: 3 },
        { y0: 2022.1, y1: 2023, g: 2 }
      ] },
    { name: 'drum loop', origin: '2017', color: DRUM, border: DRUM_BD,
      keys: [1, 0.35, 1, 1, 1, 0.35, 1],
      clips: [
        { y0: 2017, y1: 2018.2, g: 1 }, { y0: 2018.2, y1: 2019.4, g: 2 },
        { y0: 2019.4, y1: 2020.6, g: 1 }, { y0: 2020.6, y1: 2022.2, g: 3 },
        { y0: 2022.2, y1: 2023, g: 2 }
      ] },
    { name: 'vocal', origin: '2019', color: VOCAL, border: VOCAL_BD,
      keys: [0, 0, 1, 0.35, 1, 1, 0.35],
      clips: [
        { y0: 2019, y1: 2020.1, g: 1 }, { y0: 2020.1, y1: 2021.3, g: 2 },
        { y0: 2021.3, y1: 2022.4, g: 1 }, { y0: 2022.4, y1: 2023, g: 3 }
      ] },
    { name: 'synth bed', origin: '2021', color: SYNTH, border: SYNTH_BD,
      keys: [0, 0, 0, 0, 1, 1, 1],
      clips: [
        { y0: 2021, y1: 2021.9, g: 1 }, { y0: 2021.9, y1: 2023, g: 1 }
      ] }
  ];

  // Per-clip drift phases and waveform patterns, fixed at load from the
  // seed. The drift is a slow sine of t, so no two visits look identical
  // but every visit at the same t is identical.
  var CLIPS = [];
  (function buildClips() {
    for (var s = 0; s < STEMS.length; s++) {
      for (var c = 0; c < STEMS[s].clips.length; c++) {
        var clip = STEMS[s].clips[c];
        var rng = mulberry32(1935 + s * 1000 + c * 17);
        var pat = [];
        var prng = mulberry32(1935 + s * 97 + clip.g * 13);
        for (var i = 0; i < 24; i++) { pat.push(0.25 + prng() * 0.75); }
        CLIPS.push({
          stem: s, clip: c, phase: rng() * Math.PI * 2,
          phase2: rng() * Math.PI * 2, pat: pat
        });
      }
    }
  })();
  // CLIPS is built stem-major, so the safe lookup sums the clip counts
  // of the earlier stems.
  function clipMetaSafe(s, c) {
    var idx = 0;
    for (var i = 0; i < s; i++) { idx += STEMS[i].clips.length; }
    return CLIPS[idx + c];
  }

  // QA probe hook: ?year=2017 renders the frame with the playhead at
  // 2017. render-piece.js passes its seed argument as ?seed=, so a
  // four-digit seed in 2017..2023 is read as the probe year too. The
  // default render (no params) is the deterministic first frame.
  function probeYear() {
    try {
      var s = (typeof location !== 'undefined' && location.search) ? location.search : '';
      var m = s.match(/[?&]year=(\d{4})/);
      if (m) { return clamp(parseInt(m[1], 10), YEAR0, YEAR1); }
      var m2 = s.match(/[?&]seed=(\d{4})/);
      if (m2) {
        var y = parseInt(m2[1], 10);
        if (y >= YEAR0 && y <= YEAR1) { return y; }
      }
    } catch (e) {}
    return null;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var currentYear = FIRST_YEAR;
  var probe = probeYear();
  if (probe !== null) { currentYear = probe; }
  var dragging = false;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function smooth(a, b, x) {
    var u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }

  // Layout, recomputed in resize() and read by draw().
  var L = {};
  function layout() {
    var headerH = Math.round(H * 0.085);
    var rulerH = Math.round(H * 0.045);
    var hintH = Math.round(H * 0.05);
    var labelW = clamp(W * 0.20, 84, 150);
    var gridX0 = labelW + 16;
    var gridX1 = W - 16;
    var lanesY0 = headerH + rulerH + 10;
    var lanesY1 = H - hintH - 12;
    var laneGap = 6;
    var laneH = (lanesY1 - lanesY0 - laneGap * (STEMS.length - 1)) / STEMS.length;
    L = {
      headerH: headerH, rulerH: rulerH, hintH: hintH,
      labelW: labelW, gridX0: gridX0, gridX1: gridX1,
      lanesY0: lanesY0, lanesY1: lanesY1, laneGap: laneGap, laneH: laneH
    };
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
    layout();
  }

  function yearToX(y) {
    return L.gridX0 + (y - YEAR0) / (YEAR1 - YEAR0) * (L.gridX1 - L.gridX0);
  }
  function xToYear(x) {
    return clamp(YEAR0 + (x - L.gridX0) / (L.gridX1 - L.gridX0) * (YEAR1 - YEAR0), YEAR0, YEAR1);
  }

  // A stem's presence at a playhead year: linear interpolation between
  // the integer-year keyframes, so the mix cross-fades while scrubbing.
  function stemState(stem, yr) {
    if (yr <= YEAR0) { return stem.keys[0]; }
    if (yr >= YEAR1) { return stem.keys[stem.keys.length - 1]; }
    var i = Math.floor(yr - YEAR0);
    var f = yr - YEAR0 - i;
    return stem.keys[i] + (stem.keys[i + 1] - stem.keys[i]) * f;
  }

  // A clip's edge fade at the playhead year: 1 while the playhead is
  // inside the clip's span, fading out over 0.12 years past each edge.
  function clipFade(clip, yr) {
    var d = Math.min(yr - (clip.y0 - 0.12), (clip.y1 + 0.12) - yr) / 0.12;
    return clamp(d, 0, 1);
  }

  function laneY(s) { return L.lanesY0 + s * (L.laneH + L.laneGap); }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var yr = currentYear;

    // ---- Plates: title top-left, year readout top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsTick = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    var fsLabel = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    var fsSmall = Math.round(fsLabel * 0.78);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Arrangement Grid', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1935 · 2007 · 04 · 30', 18, 18 + fsTitle * 0.8 + fsSub + 8);

    // Year readout: the playhead's present is always unfinished.
    ctx.textAlign = 'right';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(Math.round(yr) + ' · mix in progress', W - 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.6);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('one fermenting mix', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.textAlign = 'left';

    // ---- Year ruler along the top edge of the grid.
    var rulerY = L.headerH + L.rulerH;
    ctx.strokeStyle = hexA(INK, 0.25);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(L.gridX0, rulerY); ctx.lineTo(L.gridX1, rulerY);
    ctx.stroke();
    ctx.font = fsTick + 'px Georgia, "Times New Roman", serif';
    for (var y = YEAR0; y <= YEAR1; y++) {
      var tx = yearToX(y);
      ctx.strokeStyle = hexA(INK, 0.4);
      ctx.beginPath();
      ctx.moveTo(tx, rulerY - 7); ctx.lineTo(tx, rulerY);
      ctx.stroke();
      ctx.fillStyle = hexA(INK, 0.85);
      if (y === YEAR0) { ctx.textAlign = 'left'; }
      else if (y === YEAR1) { ctx.textAlign = 'right'; }
      else { ctx.textAlign = 'center'; }
      ctx.fillText(String(y), tx, rulerY - 11);
    }
    ctx.textAlign = 'left';

    // ---- Vertical year gridlines across the lanes, very faint.
    ctx.strokeStyle = hexA(INK, 0.05);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var gy = YEAR0; gy <= YEAR1; gy++) {
      var gx = yearToX(gy);
      ctx.moveTo(gx, L.lanesY0); ctx.lineTo(gx, L.lanesY1);
    }
    ctx.stroke();

    // ---- Lanes: label column, state dot, clips.
    for (var s = 0; s < STEMS.length; s++) {
      var stem = STEMS[s];
      var ly = laneY(s);
      var lh = L.laneH;
      var state = stemState(stem, yr);

      // Lane ground.
      ctx.fillStyle = (s % 2 === 0) ? PANEL : BG;
      ctx.fillRect(0, ly, W, lh);
      ctx.strokeStyle = hexA(INK, 0.08);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, ly + lh); ctx.lineTo(W, ly + lh);
      ctx.stroke();

      // State dot: filled when present, dimmed when muted, hollow when absent.
      var dotX = 26, dotY = ly + lh / 2, dotR = Math.max(3.5, fsLabel * 0.28);
      if (state >= 0.7) {
        ctx.fillStyle = stem.color;
        ctx.beginPath(); ctx.moveTo(dotX + dotR, dotY); ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2); ctx.fill();
      } else if (state >= 0.15) {
        ctx.fillStyle = hexA(stem.color, 0.4);
        ctx.beginPath(); ctx.moveTo(dotX + dotR, dotY); ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.strokeStyle = hexA(INK, 0.4);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(dotX + dotR, dotY); ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2); ctx.stroke();
      }

      // Lane label: stem name and origin year, small type.
      ctx.fillStyle = (state < 0.15) ? hexA(INK_DIM, 0.7) : INK;
      ctx.font = fsLabel + 'px Georgia, "Times New Roman", serif';
      ctx.fillText(stem.name, 38, ly + lh / 2 - 2);
      ctx.fillStyle = hexA(INK_DIM, 0.85);
      ctx.font = fsSmall + 'px Georgia, "Times New Roman", serif';
      ctx.fillText(stem.origin, 38, ly + lh / 2 + fsSmall + 4);

      // Clips: ghosts first, then the live arrangement at the playhead year.
      var clipTop = ly + lh * 0.20, clipH = lh * 0.60;
      for (var pass = 0; pass < 2; pass++) {
        for (var c = 0; c < stem.clips.length; c++) {
          var clip = stem.clips[c];
          var meta = clipMetaSafe(s, c);
          var fade = clipFade(clip, yr);
          var drift = Math.sin(t * 0.12 + meta.phase) * H * 0.002;
          var cx0 = yearToX(clip.y0) + 2;
          var cx1 = yearToX(clip.y1) - 2;
          var cw = Math.max(2, cx1 - cx0);
          if (pass === 0) {
            // Ghost: the region exists on the timeline but is not live now.
            if (fade > 0.95) { continue; }
            ctx.fillStyle = hexA(stem.color, a4(0.09 * (1 - fade)));
            roundRect(cx0, clipTop + drift, cw, clipH, 4);
            ctx.fill();
          } else {
            if (fade <= 0.01 || state <= 0.01) { continue; }
            var alpha = a4(state * fade);
            ctx.fillStyle = hexA(stem.color, alpha);
            roundRect(cx0, clipTop + drift, cw, clipH, 4);
            ctx.fill();
            ctx.strokeStyle = hexA(stem.border, a4(Math.min(1, state * fade + 0.15)));
            ctx.lineWidth = 1;
            roundRect(cx0, clipTop + drift, cw, clipH, 4);
            ctx.stroke();
            // Waveform ticks inside the clip, shimmering slowly with t.
            var shimmer = 0.9 + 0.1 * Math.sin(t * 0.2 + meta.phase2);
            ctx.strokeStyle = 'rgba(255,255,255,0.28)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            var step = 6;
            var n = Math.floor(cw / step);
            for (var k = 0; k < n; k++) {
              var wx = cx0 + 3 + k * step;
              var ph2 = meta.pat[k % meta.pat.length] * clipH * 0.72 * shimmer;
              var cy = clipTop + drift + clipH / 2;
              ctx.moveTo(wx, cy - ph2 / 2);
              ctx.lineTo(wx, cy + ph2 / 2);
            }
            ctx.stroke();
            // Muted clips get a diagonal hatch so the mute reads even
            // where the color is dim.
            if (state < 0.7 && state >= 0.15) {
              ctx.save();
              roundRect(cx0, clipTop + drift, cw, clipH, 4);
              ctx.clip();
              ctx.strokeStyle = 'rgba(255,255,255,0.16)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              for (var hx = cx0 - clipH; hx < cx0 + cw + clipH; hx += 9) {
                ctx.moveTo(hx, clipTop + drift + clipH);
                ctx.lineTo(hx + clipH, clipTop + drift);
              }
              ctx.stroke();
              ctx.restore();
            }
          }
        }
      }
    }

    // ---- Playhead: a pale white vertical line the viewer drags,
    // with a small handle triangle on the ruler. The line starts at the
    // ruler itself so it never strikes through a year label.
    var px = yearToX(yr);
    ctx.strokeStyle = hexA(PLAYHEAD, 0.95);
    ctx.lineWidth = Math.max(1.5, W * 0.002);
    ctx.beginPath();
    ctx.moveTo(px, rulerY);
    ctx.lineTo(px, L.lanesY1);
    ctx.stroke();
    ctx.fillStyle = hexA(PLAYHEAD, 0.95);
    ctx.beginPath();
    ctx.moveTo(px - 6, rulerY - 1);
    ctx.lineTo(px + 6, rulerY - 1);
    ctx.lineTo(px, rulerY + 8);
    ctx.closePath();
    ctx.fill();

    // ---- Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK, 0.85);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fsTick * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to scrub through the years of the mix.', W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // Scrub: any horizontal drag on the canvas moves the playhead, which
  // maps drag x to a year. No click-to-reload, no other interaction.
  function scrubTo(clientX) {
    var rect = { left: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    var x = clientX - rect.left;
    currentYear = xToYear(x);
    draw(reduced ? FIRST_T : perfT());
  }
  var lastT = FIRST_T;
  function perfT() { return lastT; }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      try { if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) { canvas.setPointerCapture(e.pointerId); } } catch (err) {}
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      scrubTo(e.clientX);
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('pointermove', function (e) {
      if (dragging) { scrubTo(e.clientX); }
    });
    window.addEventListener('pointerup', function () { dragging = false; });
    window.addEventListener('pointercancel', function () { dragging = false; });
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop: only the slow drift moves on its own; the playhead
  // moves only by drag. Guarded so node-canvas QA (no
  // requestAnimationFrame) still works. All motion runs under 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
