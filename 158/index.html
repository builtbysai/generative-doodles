<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Puzzling Unstructured</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4F1E8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  build();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function phase(t, a, b) { return clamp01((t - a) / (b - a)); }
function smooth(u) { return u * u * (3 - 2 * u); }
function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ---- the coarse 4.8.8 scaffolding ------------------------------------
// Octagons on a square lattice, squares in the diagonal gaps, edges
// deduplicated so every polygon vertex is a true grid intersection.
// The fine level is registered to this grid: a red 8-point rosette
// sits on every vertex, nested where the wide ribbons cross.
var polys = [], edges = [], verts = [], panel = null;
var AP = Math.cos(Math.PI / 8), SIDE = 2 * Math.sin(Math.PI / 8);
var LUNIT = 2 * AP + SIDE;

function polyPts(cx, cy, n, R, rot) {
  var pts = [], k, a;
  for (k = 0; k < n; k++) {
    a = rot + k * 2 * Math.PI / n;
    pts.push([cx + Math.cos(a) * R, cy + Math.sin(a) * R]);
  }
  return pts;
}

function build() {
  polys = []; edges = []; verts = [];
  if (!W || !H) return;
  var side = Math.min(W, H) * 0.92;
  panel = { x: (W - side) / 2, y: (H - side) / 2, s: side };
  var L = side / 2.55;                       // only ~3 cells across
  var R = L / LUNIT, Rsq = SIDE * R / Math.SQRT2;
  var cx = W / 2, cy = H / 2, i, j;
  var reach = side / 2 + L * 0.75;
  for (i = -3; i <= 3; i++) for (j = -3; j <= 3; j++) {
    var ox = cx + i * L, oy = cy + j * L;
    if (Math.abs(ox - cx) < reach && Math.abs(oy - cy) < reach)
      polys.push({ pts: polyPts(ox, oy, 8, R, Math.PI / 8), n: 8 });
    var sx = ox + L / 2, sy = oy + L / 2;
    if (Math.abs(sx - cx) < reach && Math.abs(sy - cy) < reach)
      polys.push({ pts: polyPts(sx, sy, 4, Rsq, 0), n: 4 });
  }
  var emap = {}, vmap = {};
  polys.forEach(function (p) {
    p.pts.forEach(function (A, k) {
      var B = p.pts[(k + 1) % p.pts.length];
      var key = [A, B].map(function (P) { return Math.round(P[0] * 2) + ',' + Math.round(P[1] * 2); }).sort().join('|');
      if (!emap[key]) { emap[key] = { a: A, b: B }; edges.push(emap[key]); }
      [A, B].forEach(function (P) {
        var vk = Math.round(P[0] * 2) + ',' + Math.round(P[1] * 2);
        if (!vmap[vk]) { vmap[vk] = P; verts.push(P); }
      });
    });
  });
  panel.L = L;
}

function strokePartial(x1, y1, x2, y2, f) {
  if (f <= 0) return;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 + (x2 - x1) * f, y1 + (y2 - y1) * f);
  ctx.stroke();
}
function starPath(cx, cy, R, n, q, rot) {
  ctx.beginPath();
  for (var k = 0; k < 2 * n; k++) {
    var ang = rot + k * Math.PI / n, rad = (k % 2 === 0) ? R : R * q;
    var x = cx + Math.cos(ang) * rad, y = cy + Math.sin(ang) * rad;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

var LOOP = 36, OFFSET = 24;   // frame one opens on the hold: grid deleted
function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#F4F1E8'; ctx.fillRect(0, 0, W, H);
  if (!panel) return;
  var t = ((now / 1000 + OFFSET) % LOOP + LOOP) % LOOP;
  var gridP = phase(t, 0, 4);
  // coarse alpha: present while the panel is built, deleted 16-21s,
  // absent through the hold, then the ghost breathes back to 25%
  var gridA = gridP * (1 - phase(t, 16, 21));
  var ghost = 0.25 * Math.sin(Math.PI * phase(t, 28, 34));
  gridA = Math.max(gridA, ghost * gridP);
  var ribbonW = 1.5 + (panel.L * 0.085 - 1.5) * phase(t, 4, 9);

  ctx.save();
  ctx.beginPath();
  ctx.rect(panel.x, panel.y, panel.s, panel.s);
  ctx.clip();

  // the scaffolding, on its own alpha: drawn, deleted, ghosted.
  // Once the ribbons start widening it is stroked just wider than
  // they are, so the pencil underdrawing peeks out around every
  // strap and its deletion is visible when the halo leaves.
  if (gridA > 0.003) {
    ctx.strokeStyle = '#C9C4B4';
    ctx.lineWidth = (t < 4) ? 1.6 : ribbonW + 6;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.globalAlpha = gridA;
    edges.forEach(function (e, ei) {
      var f = clamp01(gridP * 1.7 - hash(ei) * 0.7);
      if (t >= 4) f = 1;
      strokePartial(e.a[0], e.a[1], e.b[0], e.b[1], f);
    });
    ctx.globalAlpha = 1;
  }
  // the ribbons: the coarse edges themselves, widened into straps
  if (t >= 4) {
    ctx.strokeStyle = '#1A1A1A';
    ctx.lineWidth = ribbonW;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    edges.forEach(function (e) {
      strokePartial(e.a[0], e.a[1], e.b[0], e.b[1], 1);
    });
  }
  // the fine level: red 8-point rosettes blooming at the intersections
  verts.forEach(function (v, vi) {
    var s = smooth(phase(t, 9 + hash(vi * 3 + 1) * 2.5, 15.5));
    if (s <= 0) return;
    starPath(v[0], v[1], panel.L * 0.08 * s, 8, 0.541, -Math.PI / 2 + hash(vi) * 0.3);
    ctx.fillStyle = '#B03A2E';
    ctx.globalAlpha = s;
    ctx.fill();
    ctx.strokeStyle = '#B03A2E';
    ctx.lineWidth = 1.8;
    ctx.globalAlpha = s;
    ctx.stroke();
    ctx.fillStyle = '#1A1A1A';
    ctx.beginPath(); ctx.arc(v[0], v[1], 1.6 * s, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  });
  ctx.restore();

  if (t >= 34) {   // soft reset to blank paper
    ctx.fillStyle = 'rgba(244,241,232,' + phase(t, 34, 36).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

resize();
draw(0);
function frame(ts) {
  draw(ts || 0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
