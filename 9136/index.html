<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Through Your Own Past</title>
<style>
  html, body { margin: 0; padding: 0; background: #0c0d11; overflow: hidden; height: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .caption {
    position: fixed; bottom: 18px; left: 22px; color: rgba(220,215,200,0.42);
    font: 11px/1.5 -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.14em;
    text-transform: uppercase; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption">Through Your Own Past &middot; after Gadamer</div>
<script>
/*
 * THROUGH YOUR OWN PAST
 * "Whose words have you been hearing through your own past?"
 * Words fall from above — clean, white, as spoken. They pass through
 * veils of memory: each translucent layer tints, bends, and fragments
 * them. What reaches the bottom is not what left the top.
 */
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let seed = 9136;
  function rnd() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  // veils: translucent memory layers
  const VEILS = [
    { y: 0.22, cr: 120, cg: 150, cg2: 0, cb: 190, alpha: 0.10, label: 0 },
    { y: 0.40, cr: 150, cg: 130, cb: 170, alpha: 0.12, label: 0 },
    { y: 0.58, cr: 190, cg: 140, cb: 100, alpha: 0.13, label: 0 },
    { y: 0.76, cr: 210, cg: 110, cb: 80,  alpha: 0.14, label: 0 }
  ];
  const MARKS = [];
  const NM = 420;
  function buildMarks() {
    MARKS.length = 0; seed = 9136;
    for (let i = 0; i < NM; i++) {
      MARKS.push({
        x: rnd() * W,
        y: rnd() * H - H * 0.2,
        vy: 0.5 + rnd() * 1.1,
        sway: rnd() * Math.PI * 2,
        swayAmp: 8 + rnd() * 22,
        k: Math.floor(rnd() * 4),
        len: 4 + rnd() * 12,
        w: 0.6 + rnd() * 1.3,
        tint: 0  // 0 = pure (as spoken), grows through veils
      });
    }
  }
  let grain = null;
  function makeGrain() {
    grain = document.createElement('canvas');
    grain.width = 128; grain.height = 128;
    const g = grain.getContext('2d');
    const d = g.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      d.data[i] = d.data[i+1] = d.data[i+2] = v;
      d.data[i+3] = 12;
    }
    g.putImageData(d, 0, 0);
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildMarks();
    const grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#101218');
    grd.addColorStop(1, '#0a0b0e');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }
  // color: white at top -> tinted by veil depth
  function markColor(tint) {
    // tint 0..1: 0 = #dfe6ee (as spoken), 1 = deep amber-rose (through the past)
    const r = 223 - 40 * tint + 30 * tint * tint;
    const g = 230 - 110 * tint;
    const b = 238 - 150 * tint;
    const a = 0.75 - 0.15 * tint;
    return 'rgba('+(r|0)+','+(g|0)+','+(b|0)+','+a.toFixed(2)+')';
  }
  let T = 0;
  function frame() {
    T += 0.016;
    ctx.fillStyle = 'rgba(12,13,17,0.18)';
    ctx.fillRect(0, 0, W, H);
    // draw veils as soft horizontal bands
    for (const v of VEILS) {
      const vy = v.y * H + Math.sin(T * 0.3 + v.y * 9) * 6;
      const grd = ctx.createLinearGradient(0, vy - 46, 0, vy + 46);
      grd.addColorStop(0, 'rgba('+v.cr+','+v.cg+','+v.cb+',0)');
      grd.addColorStop(0.5, 'rgba('+v.cr+','+v.cg+','+v.cb+','+v.alpha+')');
      grd.addColorStop(1, 'rgba('+v.cr+','+v.cg+','+v.cb+',0)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, vy - 46, W, 92);
      // veil edge line
      ctx.strokeStyle = 'rgba('+v.cr+','+v.cg+','+v.cb+',0.14)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, vy);
      for (let x = 0; x <= W; x += 24) {
        ctx.lineTo(x, vy + Math.sin(x * 0.008 + T * 0.5 + v.y * 20) * 5);
      }
      ctx.stroke();
    }
    // falling marks
    ctx.lineCap = 'round';
    for (const m of MARKS) {
      const prevY = m.y;
      m.y += m.vy;
      m.x += Math.sin(T * 0.9 + m.sway) * 0.4;
      // tint grows as it passes each veil
      let tint = 0;
      for (const v of VEILS) {
        if (prevY < v.y * H && m.y >= v.y * H) {
          m.tint = Math.min(1, m.tint + 0.28);
          // veil crossing: sideways kick + fragment
          m.x += (rnd() - 0.5) * 26;
          m.len *= 0.88;
        }
      }
      tint = m.tint;
      if (m.y > H + 20) {
        m.y = -20 - rnd() * 60;
        m.x = rnd() * W;
        m.tint = 0;
        m.len = 4 + rnd() * 12;
        continue;
      }
      const sx = m.x + Math.sin(T * 0.9 + m.sway) * m.swayAmp * 0.3;
      ctx.strokeStyle = markColor(tint);
      ctx.lineWidth = m.w;
      ctx.beginPath();
      const L = m.len;
      const wob = Math.sin(T * 1.3 + m.sway) * (2 + tint * 8);
      if (m.k === 0) {
        ctx.moveTo(sx, m.y);
        ctx.lineTo(sx + wob, m.y + L);
      } else if (m.k === 1) {
        ctx.moveTo(sx, m.y);
        ctx.lineTo(sx + 0.6, m.y + 0.6);
      } else if (m.k === 2) {
        ctx.arc(sx, m.y, L * 0.35, 0.4, 2.4);
      } else {
        ctx.moveTo(sx - L * 0.3, m.y + L * 0.5);
        ctx.lineTo(sx + L * 0.3, m.y + L * 0.5);
      }
      ctx.stroke();
    }
    if (grain) {
      ctx.save(); ctx.globalAlpha = 0.5;
      ctx.fillStyle = ctx.createPattern(grain, 'repeat');
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  let running = true;
  function setRunning(v) {
    if (v === running) return;
    running = v;
    if (v) requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => setRunning(!document.hidden));
  window.addEventListener('blur', () => setRunning(false));
  window.addEventListener('focus', () => setRunning(true));
  window.addEventListener('resize', resize);
  makeGrain();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
