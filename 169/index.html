<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No.169 Absolute Rosette</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#F4EFE6; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// One rosette, two geometries. The motif is built once as a path function.
// Left: stamped on a square lattice, flat and still. Right: the same motif
// laid out in hyperbolic polar coordinates inside a Poincare disc:
// ring radius by tanh(rho/2), ring population growing with sinh(rho),
// motif size shrinking with the conformal factor (1 - r^2). The disc
// turns about its centre, a true rotation isometry, one turn per loop.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0;
var INDIGO = '#2A2A72', VERM = '#D64533', PAPER = '#F4EFE6';
var LOOP = 40000, OFFSET = 9000;

var p1 = null, p2 = null, gap = 24; // panel rects {x,y,s}
function layout() {
  var availW = W * 0.90, availH = H * 0.90;
  gap = Math.max(14, Math.min(30, W * 0.024));
  var s;
  if (W >= H) {
    s = Math.min((availW - gap) / 2, availH);
    var tw = 2 * s + gap;
    p1 = { x: (W - tw) / 2, y: (H - s) / 2, s: s };
    p2 = { x: p1.x + s + gap, y: p1.y, s: s };
  } else {
    s = Math.min(availW, (availH - gap) / 2);
    var th = 2 * s + gap;
    p1 = { x: (W - s) / 2, y: (H - th) / 2, s: s };
    p2 = { x: p1.x, y: p1.y + s + gap, s: s };
  }
}
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  layout();
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- the rosette motif: 8-point star, inner octagon, centre ring.
// Drawn centred at (cx,cy) with radius R and rotation a. Unit motif, scaled.
function motif(cx, cy, R, a) {
  var i, ang, r, x, y;
  ctx.beginPath();
  for (i = 0; i < 16; i++) {
    ang = a + i * Math.PI / 8;
    r = (i % 2 === 0) ? R : R * 0.5412;
    x = cx + r * Math.cos(ang); y = cy + r * Math.sin(ang);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.beginPath();
  for (i = 0; i < 8; i++) {
    ang = a + Math.PI / 8 + i * Math.PI / 4;
    x = cx + 0.52 * R * Math.cos(ang); y = cy + 0.52 * R * Math.sin(ang);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, 0.13 * R, 0, Math.PI * 2);
  ctx.stroke();
}

// ---- hyperbolic layout, precomputed once (unit disc coords)
// ring j: hyperbolic radius rho = j * DRHO; euclidean r = tanh(rho/2);
// count grows with sinh(rho) for (near) constant hyperbolic spacing.
var DRHO = 0.5, DSP = 0.55;
var rings = [];
(function () {
  for (var j = 1; j <= 9; j++) {
    var rho = j * DRHO;
    var r = Math.tanh(rho / 2);
    if (r > 0.985) break;
    var m = Math.max(4, Math.round(2 * Math.PI * Math.sinh(rho) / DSP));
    rings.push({ r: r, m: m, off: (j % 2) * 0.5 });
  }
})();

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var theta = ((now + OFFSET) % LOOP) / LOOP * Math.PI * 2;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  ctx.lineJoin = 'round';

  // left panel: Euclidean, square lattice 5 x 5, perfectly still
  var n = 5, cell = p1.s / n, mr = cell * 0.46;
  ctx.strokeStyle = INDIGO;
  ctx.lineWidth = Math.max(1, p1.s / 420);
  for (var gy = 0; gy < n; gy++) for (var gx = 0; gx < n; gx++) {
    if (gx === 2 && gy === 2) continue;
    motif(p1.x + (gx + 0.5) * cell, p1.y + (gy + 0.5) * cell, mr, 0);
  }
  ctx.strokeStyle = VERM;
  motif(p1.x + 2.5 * cell, p1.y + 2.5 * cell, mr, 0);

  // right panel: Poincare disc
  var cx = p2.x + p2.s / 2, cy = p2.y + p2.s / 2, R = p2.s * 0.48;
  ctx.strokeStyle = 'rgba(42,42,114,0.4)';
  ctx.lineWidth = Math.max(1, p2.s / 500);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.stroke();
  // centre motif, vermillion, spins with the disc
  var baseR = R * 0.115; // hyperbolic radius 0.23: motifs abut, never overlap
  ctx.strokeStyle = VERM;
  ctx.lineWidth = Math.max(0.8, p2.s / 460);
  motif(cx, cy, baseR, theta);
  ctx.strokeStyle = INDIGO;
  for (var j = 0; j < rings.length; j++) {
    var ring = rings[j];
    // motif euclidean radius follows the conformal factor (1 - r^2)
    var mr2 = baseR * (1 - ring.r * ring.r);
    if (mr2 < 1.1) continue;
    ctx.lineWidth = Math.max(0.6, mr2 / 16);
    for (var k = 0; k < ring.m; k++) {
      var a = theta + (k + ring.off) / ring.m * Math.PI * 2;
      var x = cx + ring.r * R * Math.cos(a), y = cy + ring.r * R * Math.sin(a);
      if (mr2 < 2.4) {
        ctx.beginPath();
        ctx.arc(x, y, Math.max(0.6, mr2 * 0.4), 0, Math.PI * 2);
        ctx.stroke();
      } else {
        motif(x, y, mr2, a);
      }
    }
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
