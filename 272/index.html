<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.272 Rock That Was Once Rock</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#D9D2C2; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.272 Rock That Was Once Rock (Shupiwe Chongwe).
// After her stoneware rock forms: vessel-forms inspired by
// rock formations, in material that was once rock. Four
// craggy, strata-banded vessels stand in a loose cluster
// on a bare studio ground, reading as both geology and pot.
// Tap to re-stratify: the silhouettes stay fixed while the
// strata bands, iron seams and lichen patches re-form in a
// new arrangement, crossfading slowly. Never a reload.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GREY = '#7B7568', IRON = '#8A4E2E', LICHEN = '#7A8B6F', GROUND = '#D9D2C2', CREVICE = '#3A332C';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 0, lastNow = -1;
var FLOOR = 692;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// ---- the four rock-vessels: fixed craggy silhouettes ---------------------------
// Each silhouette is a side-profile lathe path built once from
// its own fixed seed: a piecewise width profile sampled at 16
// levels, with angular jitter on each side. The jitter and the
// profile never change across reseeds, so a tap can only ever
// re-form what is drawn inside the outline.
var PROFILES = [
  [[0, 0.94], [0.18, 1.00], [0.38, 0.90], [0.58, 0.82], [0.78, 0.68], [1, 0.56]],
  [[0, 0.90], [0.20, 1.06], [0.42, 0.98], [0.62, 0.82], [0.82, 0.64], [1, 0.50]],
  [[0, 0.96], [0.18, 1.00], [0.40, 0.88], [0.60, 0.80], [0.80, 0.66], [1, 0.58]],
  [[0, 0.92], [0.20, 1.03], [0.40, 0.94], [0.60, 0.80], [0.80, 0.63], [1, 0.52]]
];
function profileAt(prof, t) {
  for (var i = 1; i < prof.length; i++) {
    if (t <= prof[i][0] || i === prof.length - 1) {
      var a = prof[i - 1], b = prof[i];
      var f = (t - a[0]) / Math.max(0.0001, b[0] - a[0]);
      if (f < 0) f = 0; if (f > 1) f = 1;
      return a[1] + (b[1] - a[1]) * f;
    }
  }
  return prof[prof.length - 1][1];
}
var vessels = [];
(function () {
  var defs = [
    { cx: 368, base: 686, half: 102, h: 352, seed: 27201, prof: 0 },
    { cx: 548, base: 696, half: 80, h: 268, seed: 27213, prof: 1 },
    { cx: 706, base: 689, half: 116, h: 462, seed: 27229, prof: 2 },
    { cx: 898, base: 694, half: 88, h: 318, seed: 27241, prof: 3 }
  ];
  for (var v = 0; v < defs.length; v++) {
    var d = defs[v], r = rng(d.seed), prof = PROFILES[d.prof];
    var left = [], right = [], NL = 16, i, t;
    for (i = 0; i <= NL; i++) {
      t = i / NL;
      var hw = d.half * profileAt(prof, t);
      var jl = (r() - 0.5) * 15 * (0.25 + t);
      var jr = (r() - 0.5) * 15 * (0.25 + t);
      if (r() > 0.82) jl -= 6 + r() * 9;
      if (r() > 0.82) jr += 6 + r() * 9;
      if (i === 0) { jl *= 0.3; jr *= 0.3; }
      left.push({ x: d.cx - hw + jl, y: d.base - t * d.h, hw: hw });
      right.push({ x: d.cx + hw + jr, y: d.base - t * d.h, hw: hw });
    }
    vessels.push({
      cx: d.cx, base: d.base, half: d.half, h: d.h,
      top: d.base - d.h, left: left, right: right,
      topHalf: left[NL].hw, seed: d.seed
    });
  }
})();
function vesselPath(v) {
  ctx.beginPath();
  ctx.moveTo(v.left[0].x, v.left[0].y);
  for (var i = 1; i < v.left.length; i++) ctx.lineTo(v.left[i].x, v.left[i].y);
  // across the top, with a shallow dip at the mouth
  var rt = v.right[v.right.length - 1], lt = v.left[v.left.length - 1];
  ctx.lineTo(v.cx - rt.hw * 0.34, v.top + 3);
  ctx.lineTo(v.cx, v.top + 11);
  ctx.lineTo(v.cx + lt.hw * 0.34, v.top + 3);
  for (var j = v.right.length - 1; j >= 0; j--) ctx.lineTo(v.right[j].x, v.right[j].y);
  ctx.lineTo(v.cx + v.half * 0.3, v.base + 3);
  ctx.lineTo(v.cx - v.half * 0.28, v.base + 2);
  ctx.closePath();
}

// ---- strata sets: everything a reseed re-forms ----------------------------------
// A set is pure data, derived from one strata seed per vessel:
// horizontal bands covering the full height, iron seam
// polylines, dark crevice cracks and lichen patches. Drawing a
// set means clipping to the fixed silhouette and painting the
// data, so two sets can be alpha-blended for the crossfade.
function makeStrata(seed) {
  var sets = [];
  for (var v = 0; v < vessels.length; v++) {
    var vs = vessels[v], r = rng(seed + v * 131 + 7);
    var bands = [], y = vs.top - 2;
    while (y < vs.base + 2) {
      var bh = 20 + r() * 40;
      var p = r(), fill;
      if (p < 0.46) fill = mix(GREY, CREVICE, r() * 0.28);
      else if (p < 0.64) fill = mix(GREY, GROUND, 0.22 + r() * 0.34);
      else if (p < 0.79) fill = mix(IRON, GREY, r() * 0.35);
      else if (p < 0.90) fill = mix(LICHEN, GREY, 0.30 + r() * 0.30);
      else fill = mix(CREVICE, GREY, 0.15 + r() * 0.20);
      bands.push({ y0: y, h: bh + 1, fill: fill });
      y += bh;
    }
    var seams = [], ns = 3 + Math.floor(r() * 3), s, k;
    for (s = 0; s < ns; s++) {
      var sy = vs.top + 24 + r() * (vs.h - 48), pts = [];
      for (k = 0; k <= 8; k++) {
        pts.push({ x: vs.cx - vs.half - 14 + (k / 8) * (vs.half * 2 + 28), y: sy + (r() - 0.5) * 9 });
      }
      seams.push({ pts: pts, w: 1.6 + r() * 3.2, a: 0.50 + r() * 0.40, iron: r() > 0.30 });
    }
    var cracks = [];
    for (s = 0; s < 2; s++) {
      var cx0 = vs.cx + (r() - 0.5) * vs.half * 1.1, cy0 = vs.top + 30 + r() * vs.h * 0.35, cpts = [];
      for (k = 0; k <= 5; k++) cpts.push({ x: cx0 + (r() - 0.5) * 14, y: cy0 + k * (16 + r() * 12) });
      cracks.push({ pts: cpts, w: 1.2 + r() * 1.2, a: 0.35 + r() * 0.30 });
    }
    var lichen = [], nl = 5 + Math.floor(r() * 5);
    for (s = 0; s < nl; s++) {
      lichen.push({
        x: vs.cx + (r() - 0.5) * vs.half * 1.25,
        y: vs.top + 26 + r() * (vs.h - 52),
        rx: 10 + r() * 24, ry: 5 + r() * 9,
        rot: (r() - 0.5) * 0.7, a: 0.28 + r() * 0.28,
        spots: 2 + Math.floor(r() * 3), seed: Math.floor(r() * 99999)
      });
    }
    sets.push({ bands: bands, seams: seams, cracks: cracks, lichen: lichen });
  }
  return sets;
}
var seedSeq = 0;
var curSet = makeStrata(27211);
var oldSet = null, fadeStart = -10;
var FADE = 3.0;

function drawStrataSet(v, set, alpha) {
  ctx.save();
  vesselPath(v);
  ctx.clip();
  ctx.globalAlpha = alpha;
  var i, j;
  for (i = 0; i < set.bands.length; i++) {
    ctx.fillStyle = set.bands[i].fill;
    ctx.fillRect(v.cx - v.half - 24, set.bands[i].y0, v.half * 2 + 48, set.bands[i].h);
  }
  for (i = 0; i < set.seams.length; i++) {
    var sm = set.seams[i];
    ctx.strokeStyle = rgba(sm.iron ? IRON : CREVICE, sm.a);
    ctx.lineWidth = sm.w;
    ctx.beginPath();
    ctx.moveTo(sm.pts[0].x, sm.pts[0].y);
    for (j = 1; j < sm.pts.length; j++) ctx.lineTo(sm.pts[j].x, sm.pts[j].y);
    ctx.stroke();
  }
  for (i = 0; i < set.cracks.length; i++) {
    var ck = set.cracks[i];
    ctx.strokeStyle = rgba(CREVICE, ck.a);
    ctx.lineWidth = ck.w;
    ctx.beginPath();
    ctx.moveTo(ck.pts[0].x, ck.pts[0].y);
    for (j = 1; j < ck.pts.length; j++) ctx.lineTo(ck.pts[j].x, ck.pts[j].y);
    ctx.stroke();
  }
  for (i = 0; i < set.lichen.length; i++) {
    var li = set.lichen[i], lr = rng(li.seed);
    ctx.fillStyle = rgba(LICHEN, li.a);
    ctx.beginPath();
    ctx.ellipse(li.x, li.y, li.rx, li.ry, li.rot, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(LICHEN, li.a * 0.8);
    for (j = 0; j < li.spots; j++) {
      ctx.beginPath();
      ctx.ellipse(li.x + (lr() - 0.5) * li.rx * 1.7, li.y + (lr() - 0.5) * li.ry * 1.7,
        1.6 + lr() * 3.4, 1.2 + lr() * 2.2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---- studio ground texture ---------------------------------------------------------
var flecks = [];
(function () {
  var r = rng(27297);
  var cols = [GREY, CREVICE, IRON, LICHEN];
  for (var i = 0; i < 520; i++) {
    flecks.push({
      x: r() * DW, y: FLOOR + 6 + r() * (DH - FLOOR - 18),
      s: 0.8 + r() * 2.4, a: 0.04 + r() * 0.08,
      col: cols[Math.floor(r() * cols.length)]
    });
  }
  for (var j = 0; j < 90; j++) {
    flecks.push({
      x: r() * DW, y: 60 + r() * (FLOOR - 90),
      s: 0.8 + r() * 1.8, a: 0.025 + r() * 0.05,
      col: cols[Math.floor(r() * cols.length)]
    });
  }
})();

function draw() {
  // ---- the bare studio ground ------------------------------------------------------
  ctx.fillStyle = GROUND;
  ctx.fillRect(-10, -10, DW + 20, DH + 20);
  // the back wall sits a touch darker than the floor
  ctx.fillStyle = rgba(GREY, 0.10);
  ctx.fillRect(-10, -10, DW + 20, FLOOR + 10);
  ctx.fillStyle = rgba(CREVICE, 0.16);
  ctx.fillRect(-10, FLOOR, DW + 20, 2);
  for (var g = 0; g < flecks.length; g++) {
    var fl = flecks[g];
    ctx.fillStyle = rgba(fl.col, fl.a);
    ctx.fillRect(fl.x, fl.y, fl.s, fl.s * 0.7);
  }
  var v, i;
  // ---- long soft shadows: flattened silhouette copies, layered translucency --------
  for (v = 0; v < vessels.length; v++) {
    var vs = vessels[v];
    ctx.fillStyle = rgba(CREVICE, 0.055);
    ctx.save();
    ctx.translate(vs.cx + 165, vs.base + 7);
    ctx.scale(1.75, 0.13);
    ctx.translate(-vs.cx, -vs.base);
    vesselPath(vs);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = rgba(CREVICE, 0.11);
    ctx.save();
    ctx.translate(vs.cx + 100, vs.base + 5);
    ctx.scale(1.48, 0.10);
    ctx.translate(-vs.cx, -vs.base);
    vesselPath(vs);
    ctx.fill();
    ctx.restore();
    // contact shadow under the foot
    ctx.fillStyle = rgba(CREVICE, 0.20);
    ctx.beginPath();
    ctx.ellipse(vs.cx + 8, vs.base + 5, vs.half * 1.02, 10, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // ---- the vessels -------------------------------------------------------------------
  var fade = oldSet ? clamp01((T - fadeStart) / FADE) : 1;
  if (oldSet && fade >= 1) oldSet = null;
  for (v = 0; v < vessels.length; v++) {
    var vv2 = vessels[v];
    // base rock tone under the strata
    vesselPath(vv2);
    ctx.fillStyle = GREY;
    ctx.fill();
    if (oldSet) {
      drawStrataSet(vv2, oldSet[v], 1);
      drawStrataSet(vv2, curSet[v], fade);
    } else {
      drawStrataSet(vv2, curSet[v], 1);
    }
    // fixed modelling: a shaded left flank and a lit right edge,
    // held inside the silhouette, the same on every face
    ctx.save();
    vesselPath(vv2);
    ctx.clip();
    // stepped strips, so the modelling fades across the flank
    // rather than ending in one hard vertical edge
    for (var sh = 0; sh < 5; sh++) {
      ctx.fillStyle = rgba(CREVICE, 0.028);
      ctx.fillRect(vv2.cx - vv2.half - 20 + sh * vv2.half * 0.16, vv2.top - 4, vv2.half * 0.18, vv2.h + 8);
      ctx.fillStyle = rgba(GROUND, 0.024);
      ctx.fillRect(vv2.cx + vv2.half * 0.86 - sh * vv2.half * 0.16, vv2.top - 4, vv2.half * 0.18, vv2.h + 8);
    }
    ctx.restore();
    // the mouth: a dark hollow at the top, fixed across reseeds
    ctx.fillStyle = rgba(CREVICE, 0.88);
    ctx.beginPath();
    ctx.ellipse(vv2.cx, vv2.top + 7, vv2.topHalf * 0.58, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(CREVICE, 0.45);
    ctx.beginPath();
    ctx.ellipse(vv2.cx, vv2.top + 7, vv2.topHalf * 0.80, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(CREVICE, 0.92);
    ctx.beginPath();
    ctx.ellipse(vv2.cx, vv2.top + 7, vv2.topHalf * 0.55, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    // craggy outline
    vesselPath(vv2);
    ctx.strokeStyle = rgba(CREVICE, 0.38);
    ctx.lineWidth = 2;
    ctx.stroke();
    void i;
  }
}

// ---- tap to re-stratify --------------------------------------------------------------
// A deliberate tap re-forms the strata only. The silhouettes
// are never regenerated, and the change crossfades over about
// three seconds rather than cutting.
var downX = 0, downY = 0, downT = 0;
function toDesign(cx, cy) {
  return { x: (cx - OX) / S, y: (cy - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  downX = e.clientX; downY = e.clientY; downT = T;
  void toDesign(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup', function (e) {
  var dx = e.clientX - downX, dy = e.clientY - downY;
  if (Math.sqrt(dx * dx + dy * dy) > 14) return;
  // if a fade is still running, settle it before starting the next
  if (oldSet) { oldSet = null; }
  oldSet = curSet;
  seedSeq++;
  curSet = makeStrata(27211 + seedSeq * 7919);
  fadeStart = T;
  void downT;
});

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// Centred fit: the shaped cluster keeps its proportions, and
// the page ground is the studio ground colour.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
