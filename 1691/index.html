<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifold, Rebuilt</title>
<style>
html, body { margin: 0; padding: 0; background: #1A1410; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#1A1410';
var BASE = '#3A2E24';
var CREAM = '#F2EAD8';
var PALE = '#B9C98E';
var COBALT = '#1E3FAE';
var FOLIAGE = '#2E5B33';
var UMBER = '#1A1410';
var PLATE = '#F2EAD8';
var PLATE_LINE = 'rgba(26,20,16,0.45)';
var TITLE_INK = '#1A1410';
var HINT_INK = '#1A1410';
var FIRST_T = 22;
/* DRIVER: a hydrangea bouquet assembles itself one brushstroke at a
   time. Cream and pale-green ribbon petals layer into clusters, a
   cobalt vase builds from vertical strokes, and the dark umber
   background fills in last. Strokes are lifted geometry with soft
   offset shadows, lit from the upper left. The style cycles oil to
   charcoal to watercolor every minute, keeping the same bouquet. */
var BLOCK = 60;
var STYLES = ['oil', 'charcoal', 'watercolor'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function easeOutBack(p) {
  var c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
}
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  /* Accept '#RRGGBB' and 'rgb(r,g,b)' so mixed colors can be mixed again. */
  if (h.charAt(0) === 'r') {
    var m = h.match(/\d+/g);
    return [parseInt(m[0], 10), parseInt(m[1], 10), parseInt(m[2], 10)];
  }
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixHex(a, b, f) {
  var ca = hexRgb(a), cb = hexRgb(b);
  var r = Math.round(ca[0] + (cb[0] - ca[0]) * f);
  var g = Math.round(ca[1] + (cb[1] - ca[1]) * f);
  var bl = Math.round(ca[2] + (cb[2] - ca[2]) * f);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
function a4(v) { return Number(v.toFixed(4)); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Centered composition: square field on desktop, full-bleed on phones. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, s: s, w: s, h: s };
}
/* ---- parametric bouquet, fixed seed 938 (PP938) ---- */
var rng = mulberry32(938);
var CLUSTERS = [
  { u: 0.50, v: 0.30, r: 0.155 },
  { u: 0.36, v: 0.38, r: 0.130 },
  { u: 0.64, v: 0.38, r: 0.130 },
  { u: 0.42, v: 0.24, r: 0.115 },
  { u: 0.58, v: 0.24, r: 0.115 }
];
var petals = [];
var leaves = [];
var stems = [];
var i, j, k;
for (i = 0; i < CLUSTERS.length; i++) {
  var cl = CLUSTERS[i];
  var nFl = 16 + Math.floor(rng() * 7);
  for (j = 0; j < nFl; j++) {
    var fa = rng() * TAU;
    var fr = Math.sqrt(rng()) * cl.r * 0.92;
    var fx = cl.u + Math.cos(fa) * fr;
    var fy = cl.v + Math.sin(fa) * fr * 0.9;
    var nP = 4 + (rng() < 0.5 ? 1 : 0);
    var baseAng = rng() * TAU;
    for (k = 0; k < nP; k++) {
      var ang = baseAng + (k / nP) * TAU + (rng() - 0.5) * 0.5;
      var len = (0.028 + rng() * 0.016) * (1 - fr / cl.r * 0.25);
      petals.push({
        x: fx, y: fy, ang: ang, len: len,
        wid: 0.016 + rng() * 0.008,
        curl: (rng() - 0.5) * 0.02,
        color: rng() < 0.68 ? CREAM : PALE,
        shade: rng(),
        birth: (i / CLUSTERS.length) * 4 + (j / nFl) * 4 + rng() * 2
      });
    }
  }
}
/* Foliage: leaves ringing the bouquet, angled outward from its heart. */
for (i = 0; i < 26; i++) {
  var la = rng() * TAU;
  var lx = 0.5 + Math.cos(la) * (0.14 + rng() * 0.13);
  var ly = 0.34 + Math.sin(la) * 0.11 + rng() * 0.04;
  leaves.push({
    x: lx, y: ly, ang: la + (rng() - 0.5) * 0.6,
    len: 0.05 + rng() * 0.035, wid: 0.016 + rng() * 0.008,
    curl: (rng() - 0.5) * 0.03, shade: rng(),
    birth: 9 + rng() * 2.5
  });
}
for (i = 0; i < 12; i++) {
  var sx = 0.5 + (rng() - 0.5) * 0.18;
  stems.push({
    x0: sx, y0: 0.36 + rng() * 0.07,
    x1: 0.5 + (rng() - 0.5) * 0.05, y1: 0.45,
    wob: (rng() - 0.5) * 0.03, shade: rng(),
    birth: 9 + rng() * 2
  });
}
/* Vase: vertical cobalt strokes, clipped to the silhouette. */
var VASE_STROKES = [];
for (i = 0; i < 46; i++) {
  var u = -1 + 2 * (i / 45);
  VASE_STROKES.push({
    u: u,
    wob: (rng() - 0.5) * 0.03,
    shade: rng(),
    birth: 12 + (i / 45) * 6 + rng() * 0.8
  });
}
/* Background: broad umber strokes filling left to right, top to bottom. */
var BG_STROKES = [];
var NBG = 26;
for (i = 0; i < NBG; i++) {
  BG_STROKES.push({
    x: i / NBG,
    shade: rng(),
    birth: 18 + (i / NBG) * 8

}
function styleAt(t) {
  var block = Math.floor(t / BLOCK);
  var cur = STYLES[((block % 3) + 3) % 3];
  var frac = t - block * BLOCK;
  if (frac < 2) {
    var prev = STYLES[((block - 1) % 3 + 3) % 3];
    return { cur: cur, prev: prev, blend: frac / 2 };
  }
  return { cur: cur, prev: null, blend: 0 };
}
/* Ribbon petal/leaf: tapered filled shape with a curl. */
function ribbonPath(fr, p, scale) {
  var dx = Math.cos(p.ang), dy = Math.sin(p.ang);
  var px = -dy, py = dx;
  var len = p.len * scale, wid = p.wid * scale;
  var tipX = fr.x + (p.x + dx * len) * fr.w;
  var tipY = fr.y + (p.y + dy * len) * fr.h;
  var midX = fr.x + (p.x + dx * len * 0.55 + px * p.curl) * fr.w;
  var midY = fr.y + (p.y + dy * len * 0.55 + py * p.curl) * fr.h;
  var bx = fr.x + p.x * fr.w, by = fr.y + p.y * fr.h;
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.quadraticCurveTo(midX + px * wid * 0.5 * fr.s, midY + py * wid * 0.5 * fr.s, tipX, tipY);
  ctx.quadraticCurveTo(midX - px * wid * 0.5 * fr.s, midY - py * wid * 0.5 * fr.s, bx, by);
  ctx.closePath();
}
function shadowPath(fr, p, scale) {
  var ox = 0.006 * fr.s, oy = 0.008 * fr.s;
  ctx.save();
  ctx.translate(ox, oy);
  ribbonPath(fr, p, scale);
  ctx.restore();
}
function drawPetal(fr, p, tc, style, alphaMul) {
  var raw = clamp((tc - p.birth) / 0.3, 0, 1);
  if (raw <= 0) return;
  var sc = Math.max(0.05, easeOutBack(raw));
  var a = clamp(raw * 2, 0, 1) * alphaMul;
  if (a <= 0.004) return;
  var col = mixHex(p.color, '#8A7B5E', p.shade * 0.25);
  /* Soft offset shadow: the lift off the surface. Kept faint in the
     translucent styles so stacked shadows do not swamp the strokes. */
  var shA = style === 'charcoal' ? 0.10 : (style === 'watercolor' ? 0.18 : 0.35);
  ctx.fillStyle = 'rgba(8,5,3,' + shA + ')';
  ctx.globalAlpha = a4(a * 0.9);
  shadowPath(fr, p, sc);
  ctx.fill();
  if (style === 'oil') {
    ctx.fillStyle = col;
    ctx.globalAlpha = a4(a);
    ribbonPath(fr, p, sc);
    ctx.fill();
    /* Gloss highlight along the upper edge. */
    var dx = Math.cos(p.ang), dy = Math.sin(p.ang);
    var px = -dy, py = dx;
    ctx.strokeStyle = 'rgba(255,250,235,0.35)';
    ctx.lineWidth = Math.max(1, 0.0025 * fr.s);
    ctx.globalAlpha = a4(a * 0.8);
    ctx.beginPath();
    ctx.moveTo(fr.x + (p.x + px * p.wid * 0.22 * sc) * fr.w, fr.y + (p.y + py * p.wid * 0.22 * sc) * fr.h);
    ctx.quadraticCurveTo(
      fr.x + (p.x + dx * p.len * 0.5 * sc + px * (p.curl + p.wid * 0.3) * sc) * fr.w,
      fr.y + (p.y + dy * p.len * 0.5 * sc + py * (p.curl + p.wid * 0.3) * sc) * fr.h,
      fr.x + (p.x + dx * p.len * 0.92 * sc) * fr.w, fr.y + (p.y + dy * p.len * 0.92 * sc) * fr.h);
    ctx.stroke();
  } else if (style === 'charcoal') {
    /* Chalk sketch on the dark ground: pale scratchy lines, mid-tone core.
       Dark-on-dark would vanish, so the charcoal reads as pale chalk.
       Fill first at near-full scale, lines on top so they stay visible. */
    ctx.fillStyle = mixHex(col, '#8A7B5E', 0.15);
    ctx.globalAlpha = a4(a * 0.85);
    ribbonPath(fr, p, sc * 0.9);
    ctx.fill();
    ctx.strokeStyle = mixHex(col, '#F2EAD8', 0.6);
    ctx.lineWidth = Math.max(1, 0.0022 * fr.s);
    ctx.globalAlpha = a4(a * 0.95);
    var dx2 = Math.cos(p.ang), dy2 = Math.sin(p.ang);
    var px2 = -dy2, py2 = dx2;
    var m;
    for (m = -1; m <= 1; m++) {
      ctx.beginPath();
      ctx.moveTo(fr.x + (p.x + px2 * p.wid * 0.28 * m * sc) * fr.w, fr.y + (p.y + py2 * p.wid * 0.28 * m * sc) * fr.h);

        fr.x + (p.x + dx2 * p.len * 0.55 * sc + px2 * (p.curl + p.wid * 0.2 * m) * sc) * fr.w,
        fr.y + (p.y + dy2 * p.len * 0.55 * sc + py2 * (p.curl + p.wid * 0.2 * m) * sc) * fr.h,
        fr.x + (p.x + dx2 * p.len * sc) * fr.w, fr.y + (p.y + dy2 * p.len * sc) * fr.h);

    /* Watercolor: translucent washes, a bleed halo then the core. */
    ctx.fillStyle = col;
    ctx.globalAlpha = a4(a * 0.22);
    ribbonPath(fr, p, sc * 1.15);
    ctx.fill();
    ctx.globalAlpha = a4(a * 0.5);
    ribbonPath(fr, p, sc);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawLeaf(fr, p, tc, style, alphaMul) {
  var raw = clamp((tc - p.birth) / 0.3, 0, 1);
  if (raw <= 0) return;
  var sc = Math.max(0.05, easeOutBack(raw));
  var a = clamp(raw * 2, 0, 1) * alphaMul;
  if (a <= 0.004) return;
  var col = mixHex(FOLIAGE, '#1E3A22', p.shade * 0.4);
  var shA = style === 'charcoal' ? 0.10 : (style === 'watercolor' ? 0.18 : 0.35);
  ctx.fillStyle = 'rgba(8,5,3,' + shA + ')';
  ctx.globalAlpha = a4(a * 0.9);
  shadowPath(fr, p, sc);
  ctx.fill();
  if (style === 'charcoal') {
    ctx.fillStyle = mixHex(col, '#5A4A38', 0.15);
    ctx.globalAlpha = a4(a * 0.6);
    ribbonPath(fr, p, sc * 0.9);
    ctx.fill();
    ctx.strokeStyle = mixHex(col, CREAM, 0.5);
    ctx.lineWidth = Math.max(1, 0.0022 * fr.s);
    ctx.globalAlpha = a4(a * 0.95);
    var dx = Math.cos(p.ang), dy = Math.sin(p.ang);
    ctx.beginPath();
    ctx.moveTo(fr.x + p.x * fr.w, fr.y + p.y * fr.h);
    ctx.lineTo(fr.x + (p.x + dx * p.len * sc) * fr.w, fr.y + (p.y + dy * p.len * sc) * fr.h);
    ctx.stroke();
  } else {
    ctx.fillStyle = col;
    ctx.globalAlpha = a4(a * (style === 'watercolor' ? 0.55 : 1));
    ribbonPath(fr, p, sc);
    ctx.fill();
    if (style === 'watercolor') {
      ctx.globalAlpha = a4(a * 0.2);
      ribbonPath(fr, p, sc * 1.15);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function drawStem(fr, s, tc, style, alphaMul) {
  var raw = clamp((tc - s.birth) / 0.3, 0, 1);
  if (raw <= 0) return;
  var a = clamp(raw * 2, 0, 1) * alphaMul;
  if (a <= 0.004) return;
  var col = mixHex(FOLIAGE, '#1E3A22', s.shade * 0.4);
  if (style === 'charcoal') col = mixHex(FOLIAGE, CREAM, 0.45);
  ctx.strokeStyle = col;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1, (style === 'charcoal' ? 0.004 : 0.007) * fr.s);
  ctx.globalAlpha = a4(a * (style === 'watercolor' ? 0.6 : 1));
  ctx.beginPath();
  ctx.moveTo(fr.x + s.x0 * fr.w, fr.y + s.y0 * fr.h);
  ctx.quadraticCurveTo(
    fr.x + (s.x0 + s.wob) * fr.w, fr.y + ((s.y0 + s.y1) / 2) * fr.h,
    fr.x + s.x1 * fr.w, fr.y + s.y1 * fr.h);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function vasePath(fr) {
  var cx = fr.x + 0.5 * fr.w;
  ctx.beginPath();
  ctx.moveTo(cx - 0.052 * fr.w, fr.y + 0.42 * fr.h);
  ctx.bezierCurveTo(cx - 0.058 * fr.w, fr.y + 0.47 * fr.h, cx - 0.11 * fr.w, fr.y + 0.50 * fr.h, cx - 0.145 * fr.w, fr.y + 0.56 * fr.h);
  ctx.bezierCurveTo(cx - 0.172 * fr.w, fr.y + 0.61 * fr.h, cx - 0.168 * fr.w, fr.y + 0.67 * fr.h, cx - 0.128 * fr.w, fr.y + 0.72 * fr.h);
  ctx.lineTo(cx + 0.128 * fr.w, fr.y + 0.72 * fr.h);
  ctx.bezierCurveTo(cx + 0.168 * fr.w, fr.y + 0.67 * fr.h, cx + 0.172 * fr.w, fr.y + 0.61 * fr.h, cx + 0.145 * fr.w, fr.y + 0.56 * fr.h);
  ctx.bezierCurveTo(cx + 0.11 * fr.w, fr.y + 0.50 * fr.h, cx + 0.058 * fr.w, fr.y + 0.47 * fr.h, cx + 0.052 * fr.w, fr.y + 0.42 * fr.h);

function drawVase(fr, tc, style, alphaMul) {

    ctx.fillStyle = 'rgba(30,63,174,0.22)';
    ctx.fillRect(fr.x + 0.33 * fr.w, fr.y + 0.42 * fr.h, 0.34 * fr.w, 0.30 * fr.h);

  for (i = 0; i < VASE_STROKES.length; i++) {
    var s = VASE_STROKES[i];

    var p = smooth(raw);
    var a = clamp(raw * 2, 0, 1) * alphaMul;
    if (a <= 0.004) continue;

    ctx.moveTo(x, yTop);

    ctx.strokeStyle = 'rgba(180,200,255,0.7)';
    ctx.lineWidth = Math.max(1, 0.003 * fr.s);
    ctx.globalAlpha = a4(rimP * alphaMul * 0.8);
    ctx.beginPath();
    ctx.moveTo(fr.x + 0.448 * fr.w, fr.y + 0.422 * fr.h);

function drawBackground(fr, tc) {
  var i;
  for (i = 0; i < BG_STROKES.length; i++) {
    var s = BG_STROKES[i];
    var raw = clamp((tc - s.birth) / 0.3, 0, 1);
    if (raw <= 0) continue;
    var p = smooth(raw);
    var col = mixHex(UMBER, '#241B14', s.shade * 0.6);
    ctx.fillStyle = col;
    ctx.fillRect(fr.x + s.x * fr.w, fr.y, (1 / NBG) * fr.w + 1, p * fr.h);

    ctx.fillStyle = '#1F1712';
    ctx.globalAlpha = a4(tp * 0.5);
    ctx.fillRect(fr.x, fr.y + 0.72 * fr.h, fr.w, 0.28 * fr.h);
    ctx.globalAlpha = a4(tp * 0.8);
    ctx.fillStyle = '#3A2C1E';

function drawBouquet(fr, tc, style, alphaMul) {
  var i;

  if (tc > 26) sway = 0.004 * Math.sin((tc - 26) * 0.35);
  ctx.save();
  ctx.translate(fr.x + 0.5 * fr.w, fr.y + 0.72 * fr.h);
  ctx.rotate(sway);
  ctx.translate(-(fr.x + 0.5 * fr.w), -(fr.y + 0.72 * fr.h));
  drawVase(fr, tc, style, alphaMul);
  for (i = 0; i < stems.length; i++) drawStem(fr, stems[i], tc, style, alphaMul);
  for (i = 0; i < leaves.length; i++) drawLeaf(fr, leaves[i], tc, style, alphaMul);
  for (i = 0; i < petals.length; i++) drawPetal(fr, petals[i], tc, style, alphaMul);

}
function drawPlates() {

  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Manifold, Rebuilt').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Manifold, Rebuilt').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 29').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Manifold, Rebuilt', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 29', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
