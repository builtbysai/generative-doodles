<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.369 Thistle Crest</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1A1512; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.369 Thistle Crest (al_kovalyova_design).
// After Olena Kovalova's Dark Academia damask: a
// mirrored heraldic crest in antique-gold linework on
// near-black, repeated in a half-drop lattice, with a
// secondary tossed field of spread-wing ravens flying
// upward between the crest columns in the same gold
// line. The crest is hand-line, not clip art: every
// path is sampled and passed through a fixed 1-2px
// jitter baked from a deterministic hash, so the wobble
// is identical in every repeat and every frame, like a
// carved block. The gold breathes: opacity 0.75 to 1.0
// on an 8s cycle, three whole cycles inside one 24s
// master loop. Drag horizontally and the lattice
// shears, crests leaning with the pointer, then springs
// back to exactly zero on release. Double-tap advances
// the crest motif through an authored heraldic table:
// thistle, pinecone, artichoke, acorn, all drawn from
// the same mirrored crest grammar (crosshatched or
// scaled bulb, scrolling acanthus, bud dots). Never
// click-to-reload. All placement is fixed tables,
// never runtime random.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette: four flat colours, nothing else ------------------
var GROUND = '#1A1512';
var GOLD = '#C9A24B';
var DEEP = '#8A6A2E';
var BUD = '#6B4C2A';

// ---- the heraldic table -----------------------------------------
var MOTIFS = ['thistle', 'pinecone', 'artichoke', 'acorn'];
if (MOTIFS.length !== 4) throw new Error('Thistle Crest needs exactly four crest motifs');
var motifIdx = 0;

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 24;              // seconds, seamless master loop (3 x 8s breath)
if (LOOP !== 24) throw new Error('Thistle Crest loop must be 24s');
var BREATH = 8;
var TICK = 1 / 60;
// Frame one starts developed: exactly 10s into the 24s
// loop, the gold breath mid-cycle, shear at rest. Drawn
// at this fixed phase, never from a wall clock, so the
// thumbnail reproduces byte-identically; the live loop
// advances from that same anchor.
var T_OFFSET = 10.0;
var T = T_OFFSET;

// ---- fixed hand-line jitter --------------------------------------
// Deterministic hash of (|x|, y, k): the same authored
// point always jitters the same way, and a mirrored
// point (-x, y) gets the mirrored offset, so the crest
// halves stay true mirrors with a hand-drawn wobble of
// about 1-2px. Amplitude 2.6 peak to peak.
function fract(x) { return x - Math.floor(x); }
function jp(x, y, k) {
  var ax = Math.abs(x), sgn = x < 0 ? -1 : 1;
  var h1 = fract(Math.sin(ax * 12.9898 + y * 78.233 + k * 37.719) * 43758.5453);
  var h2 = fract(Math.sin(ax * 26.651 + y * 11.317 + k * 91.170) * 28001.8384);
  return [x + sgn * (h1 - 0.5) * 2.6, y + (h2 - 0.5) * 2.6];
}

// ---- sampled path helpers -----------------------------------------
function quad(p0, p1, p2, n) {
  var out = [], i, t, mt;
  for (i = 0; i <= n; i++) {
    t = i / n; mt = 1 - t;
    out.push([mt * mt * p0[0] + 2 * mt * t * p1[0] + t * t * p2[0],
              mt * mt * p0[1] + 2 * mt * t * p1[1] + t * t * p2[1]]);
  }
  return out;
}
function cubic(p0, p1, p2, p3, n) {
  var out = [], i, t, mt, a, b, c, d;
  for (i = 0; i <= n; i++) {
    t = i / n; mt = 1 - t;
    a = mt * mt * mt; b = 3 * mt * mt * t; c = 3 * mt * t * t; d = t * t * t;
    out.push([a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0],
              a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1]]);
  }
  return out;
}
function cat() {
  var out = [], i, j, a;
  for (i = 0; i < arguments.length; i++) {
    a = arguments[i];
    for (j = 0; j < a.length; j++) out.push(a[j]);
  }
  return out;
}
// Stroke an authored point list with the fixed jitter.
// k seeds the wobble per part; the point index feeds it
// too, so the wobble runs along the line like a hand.
function strokePts(pts, k, close) {
  var i, p;
  ctx.beginPath();
  for (i = 0; i < pts.length; i++) {
    p = jp(pts[i][0], pts[i][1], k + i * 0.37);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  if (close) ctx.closePath();
  ctx.stroke();
}
function strokeMirror(pts, k, close) {
  var m = [], i;
  for (i = 0; i < pts.length; i++) m.push([-pts[i][0], pts[i][1]]);
  strokePts(m, k, close);
}
function dot(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

// ---- crosshatch, clipped to an authored outline -------------------
function hatch(pts, x0, y0, x1, y1, step) {
  var i, o;
  ctx.save();
  ctx.beginPath();
  for (i = 0; i < pts.length; i++) {
    if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.closePath();
  ctx.clip();
  ctx.strokeStyle = DEEP;
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  for (o = x0 - (y1 - y0); o < x1; o += step) {
    ctx.moveTo(o, y0); ctx.lineTo(o + (y1 - y0), y1);
  }
  for (o = x0; o < x1 + (y1 - y0); o += step) {
    ctx.moveTo(o, y0); ctx.lineTo(o - (y1 - y0), y1);
  }
  ctx.stroke();
  ctx.restore();
}

// ---- crest bulbs: one body per motif, drawn full width ------------
// Thistle: rounded cup, crosshatched, under a spiked crown.
function thistleCup() {
  return cat(
    cubic([-27, -4], [-31, 20], [-17, 40], [0, 44], 10),
    cubic([0, 44], [17, 40], [31, 20], [27, -4], 10),
    cubic([27, -4], [13, -11], [-13, -11], [-27, -4], 8));
}
function spike(bx, baseY, h, w) {
  return cat(
    quad([bx - w, baseY], [bx - w * 0.55, baseY - h * 0.6], [bx, baseY - h], 6),
    quad([bx, baseY - h], [bx + w * 0.55, baseY - h * 0.6], [bx + w, baseY], 6));
}
function drawThistle() {
  var cup = thistleCup(), i;
  hatch(cup, -31, -8, 31, 46, 9);
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2.4;
  strokePts(cup, 11, true);
  // back row of crown spikes, deep gold shadow
  ctx.strokeStyle = DEEP; ctx.lineWidth = 2.2;
  var back = [-19.5, -6.5, 6.5, 19.5], bh = [26, 33, 33, 26];
  for (i = 0; i < 4; i++) strokePts(spike(back[i], -2, bh[i], 5.5), 21 + i, false);
  // front row, full gold, centre spike tallest
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2.4;
  var front = [-26, -13, 0, 13, 26], fh = [30, 40, 48, 40, 30];
  for (i = 0; i < 5; i++) strokePts(spike(front[i], -4, fh[i], 5.5), 31 + i, false);
}
// Pinecone: oval of overlapping scale arcs, deep gold foot row.
function pineHalfW(y) { return 13 + 17 * Math.sin(Math.PI * (y + 42) / 92); }
function drawScales(yTop, rows, stepY, hwFn, bulge, deepLast) {
  var r, y, hw, n, j, w, x;
  for (r = 0; r < rows; r++) {
    y = yTop + r * stepY;
    hw = hwFn(y);
    n = (r % 2 === 0) ? 3 : 4;
    w = (hw * 2) / n;
    ctx.strokeStyle = (deepLast && r === rows - 1) ? DEEP : GOLD;
    for (j = 0; j < n; j++) {
      x = -hw + j * w;
      strokePts(quad([x, y], [x + w / 2, y + bulge * 1.45], [x + w, y], 6), 41 + r * 7 + j, false);
    }
  }
}
function drawPinecone() {
  var body = cat(
    cubic([0, -40], [24, -34], [30, -6], [28, 16], 10),
    cubic([28, 16], [24, 36], [12, 44], [0, 46], 8),
    cubic([0, 46], [-12, 44], [-24, 36], [-28, 16], 8),
    cubic([-28, 16], [-30, -6], [-24, -34], [0, -40], 10));
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2.4;
  strokePts(body, 51, true);
  ctx.lineWidth = 2.2;
  drawScales(-30, 6, 12.5, pineHalfW, 9, true);
  // little stem curl at the foot
  strokePts(quad([0, 46], [2, 53], [9, 55], 6), 59, false);
}
// Artichoke: pointed teardrop of bigger scales.
function drawArtichoke() {
  var body = cat(
    cubic([0, -52], [20, -30], [30, -2], [30, 14], 10),
    cubic([30, 14], [26, 36], [12, 46], [0, 48], 8),
    cubic([0, 48], [-12, 46], [-26, 36], [-30, 14], 8),
    cubic([-30, 14], [-30, -2], [-20, -30], [0, -52], 10));
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2.4;
  strokePts(body, 61, true);
  var hwT = [12, 22, 28, 30, 27, 20];
  ctx.lineWidth = 2.2;
  drawScales(-34, 6, 13, function (y) {
    var idx = Math.round((y + 34) / 13);
    if (idx < 0) idx = 0; if (idx > 5) idx = 5;
    return hwT[idx];
  }, 10, true);
  // single centre scale petal at the point
  strokePts(spike(0, -40, 20, 6), 69, false);
}
// Acorn: crosshatched cap, smooth nut, curled stem.
function drawAcorn() {
  var cap = cat(
    cubic([-32, -6], [-30, -26], [-16, -34], [0, -35], 10),
    cubic([0, -35], [16, -34], [30, -26], [32, -6], 10),
    cubic([32, -6], [16, 1], [-16, 1], [-32, -6], 8));
  hatch(cap, -33, -36, 33, 2, 8);
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2.4;
  strokePts(cap, 71, true);
  strokePts([[-32, -6], [32, -6]], 73, false);
  var nut = cat(
    cubic([-26, 0], [-26, 22], [-12, 40], [0, 47], 10),
    cubic([0, 47], [12, 40], [26, 22], [26, 0], 10));
  strokePts(nut, 75, false);
  ctx.strokeStyle = DEEP; ctx.lineWidth = 1.8;
  strokePts(quad([-12, 5], [-9, 22], [-5, 38], 7), 77, false);
  strokePts(quad([12, 5], [9, 22], [5, 38], 7), 78, false);
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2.2;
  strokePts(quad([0, -35], [3, -44], [10, -48], 6), 79, false);
  ctx.fillStyle = BUD;
  dot(11, -49, 3);
}

// ---- shared crest grammar: acanthus scrolls, leaves, buds --------
// Drawn for the right half (x >= 0) from authored points,
// then mirrored. Identical for all four motifs: the crest
// grammar is shared, only the bulb changes.
function drawOrnaments(sign) {
  var i, pts;
  function M(a) {
    var out = [];
    for (var j = 0; j < a.length; j++) out.push([sign * a[j][0], a[j][1]]);
    return out;
  }
  ctx.strokeStyle = GOLD;
  // bottom acanthus scroll: a sampled spiral curl
  pts = [];
  for (i = 0; i <= 40; i++) {
    var a = i / 40, ang = -2.2 + a * 7.5, r = 16 - 12.5 * a;
    pts.push([37 + r * Math.cos(ang), 42 + r * Math.sin(ang) * 0.92]);
  }
  ctx.lineWidth = 2.3;
  strokePts(M(pts), 81, false);
  // big leaf: base low, tip high, outer and inner edges, vein
  var leaf = cat(
    quad([8, 54], [38, 28], [36, -16], 8),
    quad([36, -16], [34, -26], [30, -34], 4),
    quad([30, -34], [16, -6], [10, 26], 8),
    quad([10, 26], [8, 40], [8, 54], 4));
  ctx.lineWidth = 2.3;
  strokePts(M(leaf), 83, true);
  ctx.lineWidth = 1.6;
  strokePts(M(quad([9, 50], [22, 16], [29, -30], 8)), 85, false);
  strokePts(M([[20, 22], [28, 18]]), 86, false);
  strokePts(M([[17, 34], [25, 31]]), 88, false);
  // small leaf reaching out at mid height
  var leaf2 = cat(
    quad([14, 10], [36, -2], [52, -16], 7),
    quad([52, -16], [34, 8], [16, 14], 7));
  ctx.lineWidth = 2.1;
  strokePts(M(leaf2), 87, true);
  ctx.lineWidth = 1.5;
  strokePts(M(quad([16, 11], [32, 2], [50, -15], 6)), 89, false);
  // bud on a stem, bud dots in bud brown
  ctx.strokeStyle = GOLD; ctx.lineWidth = 1.8;
  strokePts(M([[46, -24], [56, -38]]), 91, false);
  ctx.fillStyle = BUD;
  dot(sign * 57, -40, 3.4);
  ctx.strokeStyle = GOLD;
  strokePts(M([[57, -43.5], [57, -48]]), 92, false);
  ctx.fillStyle = BUD;
  dot(sign * 52, 26, 1.7);
  dot(sign * 58, 34, 1.7);
  dot(sign * 49, 36, 1.7);
}

// ---- one crest ------------------------------------------------------
var shear = 0, shearV = 0;
function drawCrest(c, alpha) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.transform(1, 0, shear, 1, 0, 0);
  ctx.scale(0.94, 0.94);
  ctx.globalAlpha = alpha;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  var m = MOTIFS[motifIdx];
  if (m === 'thistle') drawThistle();
  else if (m === 'pinecone') drawPinecone();
  else if (m === 'artichoke') drawArtichoke();
  else drawAcorn();
  drawOrnaments(1);
  drawOrnaments(-1);
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---- one raven -------------------------------------------------------
// Ellipse body, circle head, beak up; spread wings with
// feather notches along the trailing edge. Drawn flying
// upward, about 90px tall, from authored points only.
function drawRaven(rv, alpha) {
  var sign, wing;
  ctx.save();
  ctx.translate(rv.x, rv.y);
  ctx.rotate(rv.rot);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = GOLD;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (sign = 1; sign >= -1; sign -= 2) {
    wing = cat(
      quad([0, -12], [sign * 26, -30], [sign * 54, -34], 8),
      [[sign * 46, -18], [sign * 40, -24], [sign * 34, -12], [sign * 27, -18],
       [sign * 20, -6], [sign * 13, -10], [sign * 6, 2]]);
    // map back through sign for the quad part already signed; stroke raw
    ctx.lineWidth = 2.2;
    strokePts(wing, sign > 0 ? 101 : 103, false);
  }
  // body: sampled ellipse
  var body = [], i, a;
  for (i = 0; i <= 28; i++) {
    a = (i / 28) * Math.PI * 2;
    body.push([Math.cos(a) * 9, 4 + Math.sin(a) * 23]);
  }
  ctx.lineWidth = 2.2;
  strokePts(body, 107, true);
  // head and beak
  var head = [];
  for (i = 0; i <= 16; i++) {
    a = (i / 16) * Math.PI * 2;
    head.push([Math.cos(a) * 5.5, -24 + Math.sin(a) * 5.5]);
  }
  strokePts(head, 109, true);
  strokePts([[-2.5, -28], [0, -36], [2.5, -28]], 111, false);
  // tail fan
  ctx.lineWidth = 2.0;
  strokePts([[0, 26], [-7, 40]], 113, false);
  strokePts([[0, 26], [0, 42]], 114, false);
  strokePts([[0, 26], [7, 40]], 115, false);
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---- the lattice ------------------------------------------------------
// Half-drop: columns step 256, rows step 190, odd columns
// dropped half a row. Crests about 150px tall (1/6 of the
// frame height). Authored oversized so the field covers
// the frame at any shear.
var DX = 256, DY = 190;
var CRESTS = [];
(function buildCrests() {
  var col, row;
  for (col = -2; col <= 5; col++) {
    for (row = -2; row <= 5; row++) {
      CRESTS.push({
        x: col * DX,
        y: row * DY + (Math.abs(col) % 2 === 1 ? DY / 2 : 0),
        ph: (col * 0.9 + row * 1.7) % (Math.PI * 2)
      });
    }
  }
})();
if (CRESTS.length !== 64) throw new Error('Thistle Crest needs 64 crests, got ' + CRESTS.length);
// Ravens: fixed count woven between crest columns, on a
// checkerboard sublattice, rotations from an authored
// table in the range plus/minus 20 degrees.
var RAVENS = [];
(function buildRavens() {
  var col, row;
  for (col = -2; col <= 4; col++) {
    for (row = -2; row <= 5; row++) {
      if ((col + row) % 2 !== 0) continue;
      RAVENS.push({
        x: col * DX + DX / 2,
        y: row * DY + DY * 0.28,
        rot: (((col * 3 + row * 5) % 5) - 2) * 10 * Math.PI / 180,
        ph: (col * 1.3 + row * 2.1) % (Math.PI * 2)
      });
    }
  }
})();
if (RAVENS.length !== 28) throw new Error('Thistle Crest needs 28 ravens, got ' + RAVENS.length);

// ---- drawing ------------------------------------------------------------
function draw(t) {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-260, -260, DW + 520, DH + 520);
  var bph = ((t % BREATH) / BREATH) * Math.PI * 2;
  var i, c, rv;
  for (i = 0; i < RAVENS.length; i++) {
    rv = RAVENS[i];
    if (rv.x < -180 || rv.x > DW + 180 || rv.y < -180 || rv.y > DH + 180) continue;
    drawRaven(rv, 0.82 + 0.18 * Math.sin(bph + rv.ph));
  }
  for (i = 0; i < CRESTS.length; i++) {
    c = CRESTS[i];
    if (c.x < -190 || c.x > DW + 190 || c.y < -190 || c.y > DH + 190) continue;
    drawCrest(c, 0.875 + 0.125 * Math.sin(bph + c.ph));
  }
}

// ---- interaction: drag shears, double-tap advances the crest --------
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function clampShear() {
  if (shear > 0.42) shear = 0.42;
  if (shear < -0.42) shear = -0.42;
}
var drag = null, downAt = 0, lastTapMs = -10000;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  drag = { x: p[0], y: p[1], shear: shear, moved: 0 };
  shearV = 0;
  downAt = Date.now();
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var p = toDesign(e);
  shear = drag.shear + (p[0] - drag.x) * 0.0016;
  clampShear();
  drag.moved = Math.max(drag.moved, Math.abs(p[0] - drag.x) + Math.abs(p[1] - drag.y));
});
canvas.addEventListener('pointerup', function (e) {
  if (!drag) return;
  var now = Date.now();
  if (drag.moved < 14 && now - downAt < 400) {
    if (now - lastTapMs < 350) {
      motifIdx = (motifIdx + 1) % MOTIFS.length;
      lastTapMs = -10000;
    } else {
      lastTapMs = now;
    }
  }
  drag = null;
});
canvas.addEventListener('pointercancel', function () { drag = null; });

// ---- sizing: full-bleed field, cover-fit ------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame ---------------------------------------------------------------
var lastNow = -1, acc = 0;
function frame(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var dt = 0;
  if (lastNow >= 0 && now > 0) dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK; acc -= TICK; guard++;
    // shear spring, integrated on the same fixed ticks:
    // released, the lean springs back to exactly zero
    if (!drag) {
      shearV += (-160 * shear - 13 * shearV) * TICK;
      shear += shearV * TICK;
      if (Math.abs(shear) < 0.0005 && Math.abs(shearV) < 0.0005) { shear = 0; shearV = 0; }
    }
  }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
