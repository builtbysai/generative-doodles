<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9105 · Five Up, Turn</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #24344d; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #mute { position: fixed; top: 14px; right: 14px; width: 40px; height: 40px;
    border: 0; border-radius: 50%; background: rgba(0,0,0,0.35); cursor: pointer; padding: 8px; }
  #mute svg { width: 100%; height: 100%; fill: #e8dcc8; }
  #mute.off svg { opacity: 0.35; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="sound"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
<script>
(function () {
  "use strict";

  // After Salvo Stassi (@salvothejuggler): five balls, but the BODY moves.
  // №9101 stood still and let the arms work. Here the figure walks the space,
  // turns full 360s under a high ball, kicks balls blind off the foot, crosses
  // into mills mess, throws from the shoulder and throws overhead — on a seeded
  // 64-second passage schedule that repeats seamlessly. Every flight endpoint is
  // sampled from the actual hand or foot position at release and catch time, so
  // props stay glued through every turn, kick and step. Watch only; drag nudges
  // the figure sideways (the whole pattern slides with him, nothing detaches).

  var T = 2000;               // one ball cycle, ms
  var MC = 32;               // master loop, ball cycles (64 s)
  var DWELL = 0.30;          // fraction of a ball cycle spent held
  var HAND_CYCLE = 0.40;     // hand cycle (Shannon: 2 hands, 5 balls)
  var N_BALLS = 5;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, FH = 0, CX = 0, TX = 0;
  var TOP = 0, FLOOR = 0, SHOULDER_Y = 0, HIP_Y = 0, HAND_Y = 0;
  var CATCH_X = 0, THROW_X = 0, DIP = 0, APEX_H = 0, BALL_R = 0;
  var L1 = 0, L2 = 0;
  var backdrop = null, sprites = [];
  var nudgeX = 0, nudgeTarget = 0, dragging = false, lastPX = 0;
  var CUM = null, TOTAL_DIST = 0, STRIDE = 1;

  function frac(x) { return x - Math.floor(x); }
  function mod(x, n) { return ((x % n) + n) % n; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function easeIO(t) { return t * t * (3 - 2 * t); }
  function sstep(a, b, x) {
    var t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function hash2(a, b) {
    var x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function master(u) { return mod(u, MC); }

  // circular pulse centred at c with half-width hw (wraps at the loop seam)
  function pulse(m, c, hw) {
    var d = Math.abs(m - c);
    d = Math.min(d, MC - d);
    var t = clamp((hw - d) / (hw * 0.55), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function wTravel(m) { return pulse(m, 4, 4.6); }
  function wSpin(m) { return pulse(m, 10, 2.6); }
  function wMills(m) { return pulse(m, 14, 2.6); }
  function wKick(m) { return pulse(m, 18, 2.6); }
  function wShoulder(m) { return pulse(m, 22, 2.6); }
  function wOver(m) { return pulse(m, 26, 2.6); }
  function wBack(m) { return pulse(m, 30, 2.6); }

  // ---- root travel: periodic keyframes over the master loop -----------------
  var KEYS = [[0, -1], [8, 1], [12, 0.85], [16, 0.3], [20, -0.05], [24, -0.3], [28, 0.15], [32, -1]];
  function travelFrac(m) {
    for (var i = 0; i < KEYS.length - 1; i++) {
      var a = KEYS[i], b = KEYS[i + 1];
      if (m >= a[0] && m <= b[0]) {
        var t = (m - a[0]) / (b[0] - a[0]);
        return lerp(a[1], b[1], 0.5 - 0.5 * Math.cos(Math.PI * t));
      }
    }
    return -1;
  }
  function rootX(u) { return CX + travelFrac(master(u)) * TX; }
  function rootSpeed(u) {
    var m = master(u);
    var f = function (mm) { return travelFrac(mod(mm, MC)); };
    return Math.abs(f(m + 0.3) - f(m - 0.3)) / 0.6; // travel-frac per cycle
  }
  function speedNorm(u) {
    var m = master(u);
    var s = (rootSpeed(u) + rootSpeed(u + 0.01) + rootSpeed(u - 0.01)) / 3;
    return clamp(s / 0.30, 0, 1);
  }
  function stepPhaseAt(m) {
    // cumulative distance along the path, rescaled so the loop holds an
    // integer number of strides: the step pose is identical at the seam
    if (!CUM) return 0;
    var x = m / 0.05;
    var i0 = Math.floor(x), f = x - i0;
    var d = lerp(CUM[Math.min(i0, CUM.length - 1)], CUM[Math.min(i0 + 1, CUM.length - 1)], f);
    return 6.2832 * d / STRIDE;
  }
  function bob(u) {
    var m = master(u);
    return 0.005 * FH * Math.sin(12.5664 * u / HAND_CYCLE + 1.0) +
           0.010 * FH * speedNorm(u) * Math.abs(Math.sin(stepPhaseAt(m)));
  }
  function swaySh(u) {
    return 0.010 * FH * Math.sin(6.2832 * u / HAND_CYCLE) +
           0.012 * FH * (rootSpeed(u) > 0.02 ? 1 : 0) * Math.sin(stepPhaseAt(master(u)));
  }
  function swayHip(u) {
    return 0.008 * FH * Math.sin(6.2832 * u / HAND_CYCLE);
  }

  // ---- the 360: two spin flights per spin passage ----------------------------
  // Spin ball 0 flies [8.3, 9.0], spin ball 2 flies [10.7, 11.4] (master cycles).
  // The turn parameter runs 0 -> 1 across each flight: the body faces front at
  // release and front again at the catch, having turned once in between.
  var SPINS = [{ b: 0, k: 8 }, { b: 2, k: 10 }];
  function turnAt(u) {
    var m = master(u);
    for (var i = 0; i < SPINS.length; i++) {
      var s = SPINS[i];
      var a = mod(s.b * 0.2 + s.k + DWELL, MC);
      var b = mod(s.b * 0.2 + s.k + 1, MC);
      if (m >= a && m <= b) return sstep(a, b, m);
    }
    return 0;
  }
  function isSpinBall(i, k) {
    var km = mod(k, MC);
    for (var j = 0; j < SPINS.length; j++) {
      if (SPINS[j].b === i && SPINS[j].k === km) return true;
    }
    return false;
  }
  // Blind kicks, deliberately spaced (throw times 16.0, 17.2, 18.8) so no two
  // kicks ever fight over one foot: the earlier every-ball-kicks design let a
  // return window overlap the next dwell on the same foot and the foot jumped.
  var KICKS = [{ b: 0, k: 16, foot: 1 }, { b: 1, k: 17, foot: -1 }, { b: 4, k: 18, foot: 1 }];
  function kickFor(i, k) {
    var km = mod(k, MC);
    for (var j = 0; j < KICKS.length; j++) {
      if (KICKS[j].b === i && KICKS[j].k === km) return KICKS[j].foot;
    }
    return null;
  }
  function isKick(i, k) { return kickFor(i, k) !== null; }

  // ---- hands: the scoop, bent by each passage --------------------------------
  function handPos(h, u) {
    var s = h === 0 ? -1 : 1;
    var m = master(u);
    var q = frac((u - h * 0.2) / HAND_CYCLE);
    var mills = wMills(m), sho = wShoulder(m), ov = wOver(m);
    var tau = turnAt(u);
    var turnScale = 0.45 + 0.55 * Math.abs(Math.cos(Math.PI * tau));
    var wm = (1 - 0.10 * mills) * (1 + 0.08 * ov);
    var cX = CATCH_X * wm;
    var tX = Math.max(THROW_X * wm, 0.145 * FH);
    var dip = DIP * (0.85 + 0.30 * Math.sin(u * 2.1 + h));
    var x, y;
    if (q < 0.75) {
      var w = easeIO(q / 0.75);
      x = s * lerp(cX, tX, w);
      y = HAND_Y + dip * Math.sin(Math.PI * Math.pow(q / 0.75, 0.9));
      // shoulder throws arc up over the shoulder during the carry
      y -= sho * 0.12 * FH * Math.sin(Math.PI * q / 0.75);
    } else {
      var v = (q - 0.75) / 0.25;
      var e = 1 - (1 - v) * (1 - v);
      x = s * lerp(tX, cX, e);
      y = HAND_Y + dip * 0.35 * Math.sin(Math.PI * v);
    }
    // shoulder throws tuck the hands toward the centreline in BOTH phases:
    // scaling only the carry opened a seam at the carry/return boundary
    x *= (1 - 0.22 * sho);
    // mills mess: each hand throws from the other side of the body
    x = lerp(x, -x * 0.9, mills);
    y -= mills * 0.03 * FH;
    // overhead: the hands live above the head
    y -= ov * 0.15 * FH;
    // the turn tucks the arms as the back comes round
    x *= turnScale;
    y -= Math.sin(Math.PI * tau) * 0.02 * FH;
    return { x: rootX(u) + x + swaySh(u), y: y + bob(u) };
  }
  function heldPos(h, u) {
    var p = handPos(h, u);
    return { x: p.x, y: p.y - BALL_R * 0.55 };
  }

  // ---- feet: steps, and the blind kick ---------------------------------------
  function footHome(side, u) {
    var m = master(u);
    var sp = stepPhaseAt(m);
    var sn = speedNorm(u);
    var swing = Math.sin(sp + (side > 0 ? 0 : Math.PI));
    var dir = rootX(u + 0.3) >= rootX(u - 0.3) ? 1 : -1;
    var lift = Math.max(0, swing) * sn;
    return {
      x: rootX(u) + side * 0.148 * FH + dir * 0.10 * FH * sn * Math.max(0, swing),
      y: FLOOR - 0.018 * FH - 0.05 * FH * lift
    };
  }
  // active kick dwell (or just-ended return window) for one foot at time u.
  // Dwell always wins over a return window: a foot cannot be returning from
  // one kick while it is already kicking the next ball.
  function kickState(side, u) {
    var ret = null;
    for (var j = 0; j < KICKS.length; j++) {
      var kc = KICKS[j];
      if (kc.foot !== side) continue;
      var uu = u - kc.b * 0.2;
      var k = Math.floor(uu), p = uu - k;
      if (mod(k, MC) !== kc.k) continue;
      if (p < DWELL) return { ball: kc.b, t0: kc.b * 0.2 + k, phase: 'dwell', s: p / DWELL };
      if (p < DWELL + 0.25) ret = { ball: kc.b, t0: kc.b * 0.2 + k, phase: 'return', s: (p - DWELL) / 0.25 };
    }
    return ret;
  }
  function footPos(side, u) {
    var home = footHome(side, u);
    var ks = kickState(side, u);
    if (!ks) return home;
    if (ks.phase === 'dwell') {
      var e = easeIO(ks.s);
      return {
        x: lerp(home.x, home.x - side * 0.06 * FH, e),
        y: home.y - 0.20 * FH * Math.sin(Math.PI / 2 * ks.s)
      };
    }
    var r = easeIO(ks.s);
    return {
      x: lerp(home.x - side * 0.06 * FH, home.x, r),
      y: lerp(home.y - 0.20 * FH, home.y, r)
    };
  }

  // ---- balls -------------------------------------------------------------------
  function apexFor(i, k) {
    var km = mod(k, MC);
    var mt = mod(i * 0.2 + k, MC); // master time of this throw
    var a = 1 + (hash2(i * 7 + 2, km) - 0.5) * 0.14;
    if (isSpinBall(i, k)) a *= 1.55;
    else if (isKick(i, k + 1)) a *= 0.30;     // setup flight dives to the foot,
                                             // never arcs through the chest
    else if (mt >= 8 && mt < 12) a *= 0.72;   // low fast balls under the spin
    else if (mt >= 12 && mt < 16) a *= 0.95;  // mills mess
    else if (isKick(i, k)) a *= 1.15;        // kicked ball goes high
    else if (mt >= 20 && mt < 24) a *= 1.05;  // shoulder
    else if (mt >= 24 && mt < 28) a *= 1.35;  // overhead
    return Math.max(a, 0.70);
  }
  function ballPos(i, u) {
    var uu = u - i * 0.2;
    var k = Math.floor(uu);
    var p = uu - k;
    var hand = mod(i + k, 2);
    var kickFoot = kickFor(i, k);
    var nextKickFoot = kickFor(i, k + 1);
    if (p < DWELL) {
      if (kickFoot !== null) {
        var fp = footPos(kickFoot, u);
        return { x: fp.x, y: fp.y - BALL_R * 0.9, held: true };
      }
      var hp = heldPos(hand, u);
      return { x: hp.x, y: hp.y, held: true };
    }
    var w = (p - DWELL) / (1 - DWELL);
    var tRel = i * 0.2 + k + DWELL;
    var tCatch = i * 0.2 + k + 1;
    var A, B;
    if (kickFoot !== null) {
      var fr = footPos(kickFoot, tRel);
      A = { x: fr.x, y: fr.y - BALL_R * 0.9 };
    } else {
      A = heldPos(hand, tRel);
    }
    if (nextKickFoot !== null) {
      var fh = footHome(nextKickFoot, tCatch);
      B = { x: fh.x, y: fh.y - BALL_R * 0.9 };
    } else {
      B = heldPos(1 - hand, tCatch);
    }
    // the highest throws (spin ball, overhead) used to leave the top of the
    // frame at apex: cap the lift so the ball never crosses the top edge
    var chordY = lerp(A.y, B.y, w);
    var lift = APEX_H * apexFor(i, k) * 4 * w * (1 - w);
    var maxLift = Math.max(0, chordY - BALL_R - 0.02 * H);
    return {
      x: lerp(A.x, B.x, w),
      y: chordY - Math.min(lift, maxLift),
      held: false
    };
  }

  // ---- arms: two-bone IK -------------------------------------------------------
  function elbow(S, P, s) {
    var dx = P.x - S.x, dy = P.y - S.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var maxD = (L1 + L2) * 0.999;
    if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
    if (d < 1) { dx = 0; dy = 1; d = 1; }
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var hgt = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var mx = S.x + dx * a / d, my = S.y + dy * a / d;
    var px = -dy / d, py = dx / d;
    if (py < 0) { px = -px; py = -py; }
    return { x: mx + px * hgt + s * 0.012 * FH, y: my + py * hgt };
  }
  function limb(g, A, B, C, wA, wB, wC, col) {
    g.strokeStyle = col;
    g.lineCap = 'round';
    g.lineWidth = wA;
    g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke();
    g.lineWidth = wB;
    g.beginPath(); g.moveTo(B.x, B.y); g.lineTo(C.x, C.y); g.stroke();
    g.fillStyle = col;
    g.beginPath(); g.arc(B.x, B.y, wB * 0.5, 0, 6.2832); g.fill();
    g.beginPath(); g.arc(C.x, C.y, wC * 0.5, 0, 6.2832); g.fill();
  }
  function smoothClosed(g, pts) {
    var n = pts.length;
    var mx = (pts[0].x + pts[n - 1].x) / 2, my = (pts[0].y + pts[n - 1].y) / 2;
    g.beginPath();
    g.moveTo(mx, my);
    for (var i = 0; i < n; i++) {
      var p = pts[i], q = pts[(i + 1) % n];
      g.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
    }
    g.closePath();
  }

  var INK = '#17110d';
  var INK_FAR = '#100d0a';
  var BALL_COLS = ['#e8722a', '#3fae5a', '#7ec8e3', '#f2c200', '#d92b2e'];

  // BODY-V2: a performer, not a pictogram. Every anchor below is the model's
  // own (shoulders, elbows, hands from handPos, hips, ankles from footPos) —
  // ballPos samples those functions, so NOTHING in this function feeds the
  // ball model. Twist, lean, crouch, knee bend, shrug, clothing, hair and
  // light are all visual-only; the glue cannot break from here.
  var SKIN = '#d9a06b', SKIN_FAR = '#bd8757';
  var HAIR = '#221610';
  var TOPC = '#4a2f3d', TOPC_FAR = '#3a2431', TOPC_LIT = '#63455a';
  var TROC = '#2c2230', TROC_FAR = '#231b26';
  var SHOE = '#191219', RIM = '#f0b269', SASH = '#e8a34a';

  function seg(g, P, Q, wP, wQ) {
    var dx = Q.x - P.x, dy = Q.y - P.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / d, ny = dx / d;
    g.beginPath();
    g.moveTo(P.x + nx * wP / 2, P.y + ny * wP / 2);
    g.lineTo(Q.x + nx * wQ / 2, Q.y + ny * wQ / 2);
    g.lineTo(Q.x - nx * wQ / 2, Q.y - ny * wQ / 2);
    g.lineTo(P.x - nx * wP / 2, P.y - ny * wP / 2);
    g.closePath();
    g.fill();
  }
  function drawArm(g, sh, el, ha, far) {
    var sleeve = far ? TOPC_FAR : TOPC;
    var skin = far ? SKIN_FAR : SKIN;
    g.fillStyle = sleeve;
    seg(g, sh, el, 0.058 * FH, 0.046 * FH);
    g.beginPath(); g.arc(el.x, el.y, 0.026 * FH, 0, 6.2832); g.fill();
    g.fillStyle = skin;
    seg(g, el, ha, 0.044 * FH, 0.034 * FH);
    // mitt: a hand, not a dot — the ball lands on top of it (balls draw last)
    g.beginPath(); g.ellipse(ha.x, ha.y + 0.004 * FH, 0.030 * FH, 0.022 * FH, 0, 0, 6.2832); g.fill();
  }
  function drawShoe(g, ank, dir, toeUp) {
    g.save();
    g.translate(ank.x + dir * 0.014 * FH, ank.y + 0.010 * FH);
    g.rotate(dir * 0.08 - toeUp * 0.45);
    g.fillStyle = SHOE;
    g.beginPath(); g.ellipse(0, 0, 0.054 * FH, 0.019 * FH, 0, 0, 6.2832); g.fill();
    g.strokeStyle = RIM; g.lineWidth = 1.3; g.globalAlpha = 0.55;
    g.beginPath(); g.ellipse(0, -0.003 * FH, 0.050 * FH, 0.014 * FH, 0, Math.PI, 2 * Math.PI); g.stroke();
    g.restore();
  }

  function drawFigure(u, balls) {
    var g = ctx;
    g.save();
    g.translate(nudgeX, 0);
    var RX = rootX(u);
    var tau = turnAt(u);
    var m = master(u);
    var ov = wOver(m), sho = wShoulder(m);
    // spin: narrow, but never a sliver; shoulders and hips twist against each
    // other with a lag, so the turn reads as rotation, not squash
    var ts = 0.62 + 0.38 * Math.abs(Math.cos(Math.PI * tau));
    var shShift = Math.sin(2 * Math.PI * tau) * 0.030 * FH;
    var hipShift = Math.sin(2 * Math.PI * tau - 0.7) * 0.020 * FH;
    // wind-up crouch at the start of each spin
    var windup = (tau > 0 && tau < 0.25) ? Math.sin(Math.PI * tau / 0.25) : 0;
    var crouch = windup * 0.018 * FH;
    // travel lean into the direction of motion
    var dir = rootX(u + 0.3) >= rootX(u - 0.3) ? 1 : -1;
    var travelLean = dir * speedNorm(u) * 0.025 * FH;
    // kick lean: which foot is off the floor, and how far up
    var homeL = footHome(-1, u), homeR = footHome(1, u);
    var ankL = footPos(-1, u), ankR = footPos(1, u);
    var liftL = homeL.y - ankL.y, liftR = homeR.y - ankR.y;
    var kickSide = liftL > liftR ? -1 : 1;
    var kickBend = clamp(Math.max(liftL, liftR) / (0.20 * FH), 0, 1);
    var kickLean = -kickSide * kickBend * 0.025 * FH;
    // overhead shrug: shoulders rise, head tips back to look up at the throw
    var shrug = ov * 0.045 * FH;

    var bb = bob(u);
    var bobN = clamp(bb / (0.015 * FH), 0, 1);
    var shY = SHOULDER_Y + bb * 0.7 + crouch - shrug;
    var hipY = HIP_Y + bb + crouch;
    var shTot = swaySh(u) + shShift + travelLean + kickLean;
    var hipTot = swayHip(u) + hipShift + travelLean * 0.5;

    // floor shadow: follows the figure, shrinks and fades as he leaves the floor
    g.fillStyle = 'rgba(0,0,0,' + (0.35 * (1 - 0.4 * bobN)).toFixed(3) + ')';
    g.beginPath();
    g.ellipse(RX, FLOOR + 0.006 * H, 0.30 * FH * (1 - 0.25 * bobN), 0.030 * FH, 0, 0, 6.2832);
    g.fill();
    if (kickBend > 0.1) {
      var kx = kickSide < 0 ? ankL.x : ankR.x;
      g.fillStyle = 'rgba(0,0,0,' + (0.22 * (1 - kickBend)).toFixed(3) + ')';
      g.beginPath();
      g.ellipse(kx, FLOOR + 0.006 * H, 0.10 * FH * (1 - 0.5 * kickBend), 0.014 * FH, 0, 0, 6.2832);
      g.fill();
    }

    var sh = [
      { x: RX - 0.115 * FH * ts + shTot, y: shY + 0.01 * FH },
      { x: RX + 0.115 * FH * ts + shTot, y: shY + 0.01 * FH }
    ];
    var hands = [handPos(0, u), handPos(1, u)];
    var elb = [elbow(sh[0], hands[0], -1), elbow(sh[1], hands[1], 1)];

    // legs: ankles ARE footPos, so a kicking leg and a kicked ball agree.
    // The knee is visual-only, so it may bend hard for a kick without
    // touching the model: the bend grows with the foot's lift.
    for (var li = 0; li < 2; li++) {
      var s = li === 0 ? -1 : 1;
      var hip = { x: RX + s * 0.072 * FH * ts + hipTot, y: hipY + 0.02 * FH };
      var ank = s < 0 ? ankL : ankR;
      var home = s < 0 ? homeL : homeR;
      var lift = home.y - ank.y;
      var bend = clamp(lift / (0.20 * FH), 0, 1);
      var support = (kickBend > 0.1 && s !== kickSide) ? 0.35 * kickBend : 0;
      var b = Math.max(bend, support);
      var knee = {
        x: (hip.x + ank.x) / 2 + s * (0.014 + 0.055 * b) * FH,
        y: (hip.y + ank.y) / 2 + (0.012 - 0.020 * b) * FH
      };
      var tro = li === 0 ? TROC_FAR : TROC;
      g.fillStyle = tro;
      seg(g, hip, knee, 0.078 * FH, 0.058 * FH);
      seg(g, knee, ank, 0.056 * FH, 0.042 * FH);
      g.beginPath(); g.arc(knee.x, knee.y, 0.030 * FH, 0, 6.2832); g.fill();
      if (li === 0) {
        // far leg sits behind the torso; draw it now, near leg after the torso
        drawShoe(g, ank, dir, bend);
      } else {
        // store near leg to draw after the torso
        var nearLeg = { hip: hip, knee: knee, ank: ank, bend: bend };
      }
    }

    // far arm (behind the torso)
    drawArm(g, sh[0], elb[0], hands[0], true);

    // neck: skin, so the head no longer floats on the torso color
    g.fillStyle = SKIN;
    g.beginPath();
    g.moveTo(RX - 0.028 * FH * ts + shTot, shY - 0.085 * FH);
    g.lineTo(RX + 0.028 * FH * ts + shTot, shY - 0.085 * FH);
    g.lineTo(RX + 0.045 * FH * ts + shTot, shY + 0.02 * FH);
    g.lineTo(RX - 0.045 * FH * ts + shTot, shY + 0.02 * FH);
    g.closePath();
    g.fill();

    // shoulder caps round the arm joints into the torso
    g.fillStyle = TOPC;
    g.beginPath(); g.arc(sh[0].x, sh[0].y, 0.042 * FH, 0, 6.2832); g.fill();
    g.beginPath(); g.arc(sh[1].x, sh[1].y, 0.042 * FH, 0, 6.2832); g.fill();

    // torso: ribcage and pelvis with a waist pinch, not a barrel
    var midY = (shY + hipY) / 2 + 0.03 * FH;
    var torso = [
      { x: RX - 0.042 * FH * ts + shTot, y: shY - 0.028 * FH },
      { x: RX - 0.128 * FH * ts + shTot, y: shY + 0.016 * FH },
      { x: RX - 0.086 * FH * ts + hipTot, y: midY },
      { x: RX - 0.098 * FH * ts + hipTot, y: hipY + 0.05 * FH },
      { x: RX + 0.098 * FH * ts + hipTot, y: hipY + 0.05 * FH },
      { x: RX + 0.086 * FH * ts + hipTot, y: midY },
      { x: RX + 0.128 * FH * ts + shTot, y: shY + 0.016 * FH },
      { x: RX + 0.042 * FH * ts + shTot, y: shY - 0.028 * FH }
    ];
    smoothClosed(g, torso);
    g.fillStyle = TOPC;
    g.fill();
    // directional light: the sun side of the tunic is lit
    var sunSide = (0.78 * W - RX) >= 0 ? 1 : -1;
    g.save();
    smoothClosed(g, torso);
    g.clip();
    g.fillStyle = TOPC_LIT;
    g.globalAlpha = 0.5;
    if (sunSide > 0) g.fillRect(RX, TOP, W, FH);
    else g.fillRect(0, TOP, RX, FH);
    g.restore();
    // neckline: a skin V at the collar
    g.fillStyle = SKIN;
    g.beginPath();
    g.moveTo(RX - 0.034 * FH * ts + shTot, shY - 0.028 * FH);
    g.lineTo(RX + 0.034 * FH * ts + shTot, shY - 0.028 * FH);
    g.lineTo(RX + shTot, shY + 0.035 * FH);
    g.closePath();
    g.fill();
    // sash: a gold band at the waist, the costume's one bright line
    var wl = { x: RX - 0.086 * FH * ts + hipTot, y: midY };
    var wr = { x: RX + 0.086 * FH * ts + hipTot, y: midY };
    g.fillStyle = SASH;
    g.beginPath();
    g.moveTo(wl.x - 0.004 * FH, wl.y - 0.014 * FH);
    g.lineTo(wr.x + 0.004 * FH, wr.y - 0.014 * FH);
    g.lineTo(wr.x + 0.004 * FH, wr.y + 0.016 * FH);
    g.lineTo(wl.x - 0.004 * FH, wl.y + 0.016 * FH);
    g.closePath();
    g.fill();
    // rim light on the sun-side silhouette edge
    g.strokeStyle = RIM; g.lineWidth = 2; g.globalAlpha = 0.6;
    g.beginPath();
    if (sunSide > 0) {
      g.moveTo(RX + 0.042 * FH * ts + shTot, shY - 0.028 * FH);
      g.lineTo(RX + 0.128 * FH * ts + shTot, shY + 0.016 * FH);
      g.lineTo(RX + 0.086 * FH * ts + hipTot, midY);
    } else {
      g.moveTo(RX - 0.042 * FH * ts + shTot, shY - 0.028 * FH);
      g.lineTo(RX - 0.128 * FH * ts + shTot, shY + 0.016 * FH);
      g.lineTo(RX - 0.086 * FH * ts + hipTot, midY);
    }
    g.stroke();
    g.globalAlpha = 1;

    // head: tilts toward the highest ball, tips back on overhead throws,
    // and turns its back to the camera mid-spin (hair covers the head)
    var topBall = null;
    for (var bi = 0; bi < balls.length; bi++) {
      if (!balls[bi].held && (!topBall || balls[bi].y < topBall.y)) topBall = balls[bi];
    }
    var tilt = topBall ? clamp((topBall.x - RX) / (0.5 * W), -1, 1) * 0.055 : 0;
    var headX = RX + shTot, headY = shY - 0.012 * FH + sho * 0.012 * FH;
    var headRX = 0.056 * FH * ts, headRY = 0.070 * FH;
    var headCY = headY - 0.108 * FH;
    g.save();
    g.globalAlpha = 1 - 0.85 * Math.sin(Math.PI * tau);
    g.fillStyle = SKIN;
    g.beginPath(); g.arc(headX - headRX, headCY, 0.014 * FH, 0, 6.2832); g.fill();
    g.beginPath(); g.arc(headX + headRX, headCY, 0.014 * FH, 0, 6.2832); g.fill();
    g.restore();
    g.save();
    g.translate(headX, headY);
    g.rotate(tilt - ov * 0.10);
    g.fillStyle = SKIN;
    g.beginPath(); g.ellipse(0, -0.108 * FH, headRX, headRY, 0, 0, 6.2832); g.fill();
    g.save();
    g.beginPath(); g.ellipse(0, -0.108 * FH, headRX, headRY, 0, 0, 6.2832); g.clip();
    var cover = 0.42 + 0.58 * Math.sin(Math.PI * tau);
    g.fillStyle = HAIR;
    g.fillRect(-headRX, -0.108 * FH - headRY, headRX * 2, headRY * 2 * cover);
    g.restore();
    g.restore();

    // near leg (in front of the tunic hem) and near shoe
    if (typeof nearLeg !== 'undefined') {
      g.fillStyle = TROC;
      seg(g, nearLeg.hip, nearLeg.knee, 0.078 * FH, 0.058 * FH);
      seg(g, nearLeg.knee, nearLeg.ank, 0.056 * FH, 0.042 * FH);
      g.beginPath(); g.arc(nearLeg.knee.x, nearLeg.knee.y, 0.030 * FH, 0, 6.2832); g.fill();
      drawShoe(g, nearLeg.ank, dir, nearLeg.bend);
    }

    // near arm
    drawArm(g, sh[1], elb[1], hands[1], false);
    g.restore();
  }

  // ---- stage: flat dusk park, no gradients -------------------------------------
  function build() {
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    FH = 0.58 * Math.min(H, 1.35 * W);
    CX = W / 2;
    FLOOR = 0.88 * H;
    TOP = FLOOR - FH;              // figure span is FH in both orientations:
                                   // tying TOP to H stretched the figure on phones
    SHOULDER_Y = TOP + 0.19 * FH;
    HIP_Y = TOP + 0.52 * FH;
    HAND_Y = TOP + 0.46 * FH;
    CATCH_X = 0.36 * FH;
    THROW_X = 0.19 * FH;
    DIP = 0.05 * FH;
    APEX_H = 0.80 * FH;
    BALL_R = 0.026 * FH;
    L1 = 0.20 * FH;
    L2 = 0.215 * FH;
    TX = Math.max(0, Math.min(0.30 * W, W / 2 - 0.42 * FH));

    // cumulative path distance, for seamless stepping at the loop seam
    CUM = [0];
    var prev = travelFrac(0);
    var total = 0;
    for (var mm = 0.05; mm <= MC + 0.001; mm += 0.05) {
      var cur = travelFrac(mod(mm, MC));
      total += Math.abs(cur - prev) * TX;
      CUM.push(total);
      prev = cur;
    }
    TOTAL_DIST = total;
    var nStrides = Math.max(1, Math.round(total / (0.16 * FH)));
    STRIDE = total / nStrides;

    bakeBackdrop();
    bakeBalls();
  }

  function bakeBackdrop() {
    backdrop = document.createElement('canvas');
    backdrop.width = Math.max(2, Math.floor(W));
    backdrop.height = Math.max(2, Math.floor(H));
    var g = backdrop.getContext('2d');
    // flat dusk sky
    g.fillStyle = '#24344d';
    g.fillRect(0, 0, W, H);
    // stars: flat dots
    g.fillStyle = 'rgba(232,220,200,0.5)';
    for (var i = 0; i < 26; i++) {
      var sx = hash2(i * 3 + 1, 7) * W, sy = hash2(i * 5 + 2, 13) * 0.42 * H;
      g.fillRect(sx, sy, 2, 2);
    }
    // low flat sun
    g.fillStyle = '#e8a34a';
    g.beginPath();
    g.arc(0.78 * W, 0.30 * H, 0.045 * H, 0, 6.2832);
    g.fill();
    // distant tree line: flat dark canopies on the horizon
    g.fillStyle = '#1c2b23';
    var hy = 0.80 * H;
    for (var j = 0; j < 14; j++) {
      var tx0 = hash2(j * 7 + 3, 11) * W;
      var tr = (0.03 + 0.05 * hash2(j, 17)) * H;
      g.beginPath();
      g.arc(tx0, hy, tr, 0, 6.2832);
      g.fill();
    }
    // flat ground
    g.fillStyle = '#2e2118';
    g.fillRect(0, hy, W, H - hy);
    // warm pool where the figure performs
    g.fillStyle = 'rgba(255,170,92,0.10)';
    g.beginPath();
    g.ellipse(CX, FLOOR + 0.012 * H, 0.46 * W, 0.030 * H, 0, 0, 6.2832);
    g.fill();
  }

  function bakeBalls() {
    sprites = BALL_COLS.map(function (col) {
      var d = 128;
      var cv = document.createElement('canvas');
      cv.width = cv.height = d;
      var g = cv.getContext('2d');
      g.fillStyle = col;
      g.beginPath();
      g.arc(d / 2, d / 2, d * 0.49, 0, 6.2832);
      g.fill();
      g.fillStyle = 'rgba(255,255,255,0.75)';
      g.beginPath();
      g.arc(d * 0.36, d * 0.32, d * 0.10, 0, 6.2832);
      g.fill();
      return cv;
    });
  }

  // ---- sound: soft catch ticks, off until first touch --------------------------
  var AC = null, soundOn = true, prevHeld = [false, false, false, false, false];
  function tick() {
    if (!AC || !soundOn) return;
    try {
      var t0 = AC.currentTime;
      var o = AC.createOscillator(), gn = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(620, t0);
      o.frequency.exponentialRampToValueAtTime(240, t0 + 0.05);
      gn.gain.setValueAtTime(0.05, t0);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.07);
      o.connect(gn); gn.connect(AC.destination);
      o.start(t0); o.stop(t0 + 0.08);
    } catch (e) { /* audio is decorative; never break the piece */ }
  }
  document.getElementById('mute').addEventListener('click', function (e) {
    soundOn = !soundOn;
    e.currentTarget.classList.toggle('off', !soundOn);
  });
  canvas.addEventListener('pointerdown', function (e) {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e2) {} }
    if (AC && AC.state === 'suspended') AC.resume();
    dragging = true; lastPX = e.clientX;
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    nudgeTarget = clamp(nudgeTarget + (e.clientX - lastPX) * 0.5, -70, 70);
    lastPX = e.clientX;
  });
  window.addEventListener('pointerup', function () {
    dragging = false; nudgeTarget = 0;
  });

  var FIXED_T = null;
  (function () {
    var m = /[?&]t=(\d+)/.exec(window.location.search || '');
    if (m) FIXED_T = parseInt(m[1], 10);
  })();

  function drawBall(i, u, b) {
    ctx.drawImage(sprites[i], b.x + nudgeX - BALL_R, b.y - BALL_R, BALL_R * 2, BALL_R * 2);
  }

  function frame(now) {
    var c = (FIXED_T === null ? now : FIXED_T) / T;
    var u = c;
    ctx.drawImage(backdrop, 0, 0, W, H);

    if (!dragging) nudgeX += (nudgeTarget - nudgeX) * 0.08;
    else nudgeX += (nudgeTarget - nudgeX) * 0.35;

    var balls = [];
    for (var i = 0; i < N_BALLS; i++) {
      var bp = ballPos(i, u);
      balls.push(bp);
      if (!bp.held && prevHeld[i]) tick();
      prevHeld[i] = bp.held;
    }

    drawFigure(u, balls);
    for (var j = 0; j < N_BALLS; j++) drawBall(j, u, balls[j]);

    requestAnimationFrame(frame);
  }

  // test hooks: the model is pure in u, so a harness can verify glue,
  // continuity, floor and torso clearance across whole master loops
  window.__J = {
    ballPos: ballPos, handPos: handPos, footPos: footPos, footHome: footHome,
    rootX: rootX, turnAt: turnAt, MC: MC, T: T,
    floor: function () { return FLOOR; },
    torsoRect: function (u) {
      return { x0: rootX(u) - 0.18 * FH, x1: rootX(u) + 0.18 * FH,
               y0: SHOULDER_Y - 0.05 * FH, y1: HIP_Y + 0.06 * FH };
    },
    figureH: function () { return FH; }
  };

  window.addEventListener('resize', build);
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
