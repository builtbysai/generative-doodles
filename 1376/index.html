<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stereograph Rupture</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0d0b08; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var SEED = 1376000;

  // Viewport from the Visual Viewport API.
  var W = 0, H = 0;
  function isPhone() {
    try {
      var s = window.screen;
      if (s && s.width && s.height) return Math.min(s.width, s.height) < 700;
    } catch (e) {}
    return H > W * 1.15;
  }
  function resize() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.max(1, Math.round(W));
    canvas.height = Math.max(1, Math.round(H));
    draw(clockT);
  }
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', resize);
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', resize);
      visualViewport.addEventListener('scroll', resize);
    }
  }

  // Drag scrubs the rupture phase: recorded samples, exponential decay (tau 4 s).
  var drags = [];
  var dragging = false, lastX = 0, lastY = 0;
  function dragOffsetAt(t) {
    var off = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      var age = t - d.t;
      if (age < 0) continue;
      off += d.dx * 0.006 * Math.exp(-age / 4);
    }
    return off;
  }
  function onDown(x, y) { dragging = true; lastX = x; lastY = y; }
  function onMove(x, y) {
    if (!dragging) return;
    drags.push({ t: clockT, dx: x - lastX });
    if (drags.length > 200) drags.shift();
    lastX = x; lastY = y;
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY); });
  canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', function (e) {
    if (e.touches && e.touches.length) onDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  canvas.addEventListener('touchend', onUp);

  // Pseudo-script glyphs: loops, hooks, dots, ticks, chevrons — never letters.
  function glyph(g, x, y, s, col) {
    ctx.strokeStyle = col;
    ctx.fillStyle = col;
    ctx.lineWidth = Math.max(1, s * 0.12);
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (g === 0) { // open spiral tail, never a closed ring
      ctx.moveTo(x - s * 0.3, y + s * 0.4);
      ctx.bezierCurveTo(x - s * 0.5, y - s * 0.3, x + s * 0.5, y - s * 0.4, x + s * 0.1, y + s * 0.1);
      ctx.lineTo(x + s * 0.35, y + s * 0.35);
    } else if (g === 1) { // hook
      ctx.moveTo(x - s * 0.3, y - s * 0.3);
      ctx.quadraticCurveTo(x + s * 0.3, y - s * 0.2, x, y + s * 0.4);
      ctx.moveTo(x, y + s * 0.4);
      ctx.arc(x, y + s * 0.4, s * 0.08, 0, Math.PI * 2);
      ctx.fill();
      return;
    } else if (g === 2) { // chevron pair
      ctx.moveTo(x - s * 0.35, y);
      ctx.lineTo(x, y - s * 0.3);
      ctx.lineTo(x + s * 0.35, y);
      ctx.moveTo(x - s * 0.35, y + s * 0.3);
      ctx.lineTo(x, y);
      ctx.lineTo(x + s * 0.35, y + s * 0.3);
    } else if (g === 3) { // dot trail
      ctx.arc(x - s * 0.25, y, s * 0.09, 0, Math.PI * 2);
      ctx.moveTo(x, y);
      ctx.arc(x, y - s * 0.1, s * 0.07, 0, Math.PI * 2);
      ctx.moveTo(x + s * 0.25, y - s * 0.2);
      ctx.arc(x + s * 0.25, y - s * 0.2, s * 0.09, 0, Math.PI * 2);
      ctx.fill();
      return;
    } else if (g === 4) { // tick + bar
      ctx.moveTo(x - s * 0.35, y + s * 0.3);
      ctx.lineTo(x + s * 0.35, y - s * 0.3);
      ctx.moveTo(x - s * 0.1, y + s * 0.35);
      ctx.lineTo(x + s * 0.3, y + s * 0.35);
    } else { // wave line with dot
      ctx.moveTo(x - s * 0.35, y + s * 0.1);
      ctx.quadraticCurveTo(x - s * 0.15, y - s * 0.3, x, y + s * 0.1);
      ctx.quadraticCurveTo(x + s * 0.15, y + s * 0.5, x + s * 0.35, y + s * 0.1);
      ctx.moveTo(x + s * 0.4, y + s * 0.35);
      ctx.arc(x + s * 0.4, y + s * 0.35, s * 0.07, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    ctx.stroke();
  }

  // Rupture envelope: 9 s cycle, fast attack, slow grind back to zero.
  function envelope(t) {
    var cyc = 9;
    var p = ((t % cyc) + cyc) % cyc;
    if (p < 0.8) return p / 0.8;
    return Math.exp(-(p - 0.8) * 0.9);
  }

  // Seeded scene elements for one plate (drawn in plate-local coords).
  function sceneSeed(par) {
    var r = mulberry32(SEED + (par ? 7919 : 0));
    var ridge = [];
    for (var i = 0; i <= 8; i++) ridge.push(r());
    var figs = [];
    for (var j = 0; j < 4; j++) figs.push({ x: r(), h: 0.10 + r() * 0.06, w: 0.03 + r() * 0.02 });
    var specks = [];
    for (var k = 0; k < 26; k++) specks.push({ x: r(), y: r(), s: 1 + r() * 2 });
    return { ridge: ridge, figs: figs, specks: specks, par: par };
  }
  var sceneL = sceneSeed(false), sceneR = sceneSeed(true);

  function drawScene(sc, x, y, w, h) {
    // Aged paper ground, pre-blended with the sepia wash (opaque: per-cell
    // redraws must not double up translucent fills at cell boundaries).
    ctx.fillStyle = '#d3b681';
    ctx.fillRect(x, y, w, h);
    // Sky speckles, opaque.
    ctx.fillStyle = '#6b5238';
    for (var i = 0; i < sc.specks.length; i++) {
      var sp = sc.specks[i];
      if (sp.y < 0.5) ctx.fillRect(x + sp.x * w, y + sp.y * h, sp.s, sp.s);
    }
    // Ridge silhouette (dark umber), parallax shifts it slightly.
    var par = sc.par ? 6 : 0;
    ctx.fillStyle = '#3d2c1e';
    ctx.beginPath();
    ctx.moveTo(x, y + h * 0.62);
    for (var i = 0; i <= 8; i++) {
      ctx.lineTo(x + (i / 8) * w, y + h * (0.52 + sc.ridge[i] * 0.14));
    }
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.closePath();
    ctx.fill();
    // Ground band, opaque pre-blended umber over paper.
    ctx.fillStyle = '#806a4b';
    ctx.fillRect(x, y + h * 0.78, w, h * 0.22);
    // Standing figures (simple silhouettes, no detail).
    ctx.fillStyle = '#3d2c1e';
    for (var j = 0; j < sc.figs.length; j++) {
      var f = sc.figs[j];
      var fx = x + f.x * w + par;
      var fy = y + h * 0.72;
      var fh = f.h * h;
      ctx.fillRect(fx - f.w * w / 2, fy - fh, f.w * w, fh);
      ctx.beginPath();
      ctx.arc(fx, fy - fh - f.w * w * 0.6, f.w * w * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
    // A low structure and a pole (abstract, no letters).
    ctx.fillStyle = 'rgba(61,44,30,0.8)';
    ctx.fillRect(x + w * 0.62 + par, y + h * 0.60, w * 0.16, h * 0.12);
    ctx.beginPath();
    ctx.moveTo(x + w * 0.60 + par, y + h * 0.60);
    ctx.lineTo(x + w * 0.70 + par, y + h * 0.50);
    ctx.lineTo(x + w * 0.80 + par, y + h * 0.60);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(x + w * 0.18 + par, y + h * 0.38, 2, h * 0.34);
  }

  // Fracture cells for one plate: seeded offsets, stronger near the gutter.
  function plateCells(side) {
    var r = mulberry32(SEED + 31337 + (side === 'R' ? 5000 : 0));
    var cells = [];
    var cols = 5, rows = 4;
    for (var cy = 0; cy < rows; cy++) {
      for (var cx = 0; cx < cols; cx++) {
        var a = r() * Math.PI * 2;
        var mag = 0.5 + r() * 0.5;
        // Gutter side: left plate's gutter is its right edge, right plate's is its left.
        var gutterDist = (side === 'L') ? (cols - 1 - cx) / (cols - 1) : cx / (cols - 1);
        var fall = 1 - gutterDist * 0.6;
        var out = (side === 'L') ? -1 : 1;
        cells.push({
          cx: cx, cy: cy,
          ox: (Math.cos(a) * 0.4 + out * 0.6) * mag * fall,
          oy: Math.sin(a) * 0.5 * mag
        });
      }
    }
    return cells;
  }
  var cellsL = plateCells('L'), cellsR = plateCells('R');

  function drawPlate(sc, cells, px, py, pw, ph, env) {
    var cols = 5, rows = 4;
    var cw = pw / cols, ch = ph / rows;
    var maxOff = 14 * env;
    // Integer cell edges: fractional clip rects antialias at the boundary,
    // blending the ridge with the paper painted first in the same cell.
    var ex = [], ey = [];
    for (var v = 0; v <= cols; v++) ex.push(Math.round(px + v * cw));
    for (var u = 0; u <= rows; u++) ey.push(Math.round(py + u * ch));
    for (var i = 0; i < cells.length; i++) {
      var cl = cells[i];
      var cx0 = ex[cl.cx], cy0 = ey[cl.cy];
      var cwI = ex[cl.cx + 1] - cx0, chI = ey[cl.cy + 1] - cy0;
      ctx.save();
      ctx.beginPath();
      ctx.rect(cx0, cy0, cwI, chI);
      ctx.clip();
      ctx.save();
      ctx.translate(cl.ox * maxOff, cl.oy * maxOff);
      drawScene(sc, px, py, pw, ph);
      ctx.restore();
      ctx.restore();
    }
    // Fracture seams radiating from the gutter, visible with the envelope.
    if (env > 0.02) {
      ctx.strokeStyle = 'rgba(13,11,8,' + (0.55 * env).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, pw * 0.004);
      ctx.beginPath();
      for (var v = 0; v <= cols; v++) {
        var gx = (cells === cellsL) ? px + pw - v * cw * 0.2 : px + v * cw * 0.2;
        ctx.moveTo(gx, py);
        ctx.lineTo(gx + (cells === cellsL ? -pw * 0.06 : pw * 0.06), py + ph);
      }
      ctx.stroke();
    }
    // Ornate border: double ochre frame, drawn unfractured on top.
    ctx.strokeStyle = '#e0a92e';
    ctx.lineWidth = Math.max(2, pw * 0.012);
    ctx.strokeRect(px, py, pw, ph);
    ctx.lineWidth = Math.max(1, pw * 0.005);
    ctx.strokeRect(px + pw * 0.02, py + ph * 0.02, pw * 0.96, ph * 0.96);
    // Corner ornaments.
    ctx.fillStyle = '#e0a92e';
    var cs = pw * 0.03;
    var corners = [[px, py], [px + pw - cs, py], [px, py + ph - cs], [px + pw - cs, py + ph - cs]];
    for (var c = 0; c < 4; c++) ctx.fillRect(corners[c][0], corners[c][1], cs, cs);
  }

  function drawCaption(x, y, w, h) {
    ctx.fillStyle = '#d8c194';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#e0a92e';
    ctx.lineWidth = Math.max(2, w * 0.003);
    ctx.strokeRect(x, y, w, h);
    ctx.lineWidth = 1;
    ctx.strokeRect(x + w * 0.01, y + h * 0.12, w * 0.98, h * 0.76);
    var r = mulberry32(SEED + 999);
    var n = Math.max(8, Math.floor(w / 46));
    var gs = Math.min(h * 0.5, 26);
    for (var i = 0; i < n; i++) {
      var gx = x + w * 0.06 + (i / (n - 1)) * w * 0.88;
      glyph(Math.floor(r() * 6), gx, y + h * 0.5, gs, '#3d2c1e');
    }
  }

  function draw(t) {
    var w = W, h = H;
    if (!w || !h) return;
    ctx.fillStyle = '#0d0b08';
    ctx.fillRect(0, 0, w, h);
    var phone = isPhone();
    var margin = phone ? w * 0.04 : w * 0.08;
    var gutter = Math.max(10, w * 0.03);
    var avail = w - margin * 2 - gutter;
    var pw = avail / 2;
    var ph = Math.min(h * 0.52, pw * 0.78);
    var py = h * 0.20;
    var pxL = margin, pxR = margin + pw + gutter;
    var env = envelope(t + dragOffsetAt(t));
    drawPlate(sceneL, cellsL, pxL, py, pw, ph, env);
    drawPlate(sceneR, cellsR, pxR, py, pw, ph, env);
    // Caption strip along the bottom edge.
    var capH = Math.min(h * 0.10, 64);
    drawCaption(margin, py + ph + h * 0.06, w - margin * 2, capH);
    // Grain: seeded dots keyed by quantized 0.25 s time index, never per-frame random.
    var qi = Math.floor(t / 0.25);
    var gr = mulberry32(SEED + 777 + qi * 104729);
    ctx.fillStyle = 'rgba(216,193,148,0.06)';
    for (var i = 0; i < 180; i++) {
      ctx.fillRect(gr() * w, gr() * h, 1.5, 1.5);
    }
    // Vignette edges as flat-alpha bands (no gradients).
    ctx.fillStyle = 'rgba(13,11,8,0.35)';
    ctx.fillRect(0, 0, w, h * 0.03);
    ctx.fillRect(0, h * 0.97, w, h * 0.03);
    ctx.fillRect(0, 0, w * 0.02, h);
    ctx.fillRect(w * 0.98, 0, w * 0.02, h);
  }

  // Boot flag: frame one is draw(0); the clock starts only with the rAF loop.
  var clockT = 0;
  var started = false;
  var lastTs = 0;
  function loop(ts) {
    if (!started) { started = true; lastTs = ts; }
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.1) dt = 0.1;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  resize();
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
