<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dirty New Media</title>
<style>
  html, body { margin:0; padding:0; background:#FAFAFA; overflow:hidden; height:100%; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

// ---------- deterministic hash / rng ----------
function hash(n){
  n = Math.imul(n ^ (n >>> 16), 2246822519);
  n = Math.imul(n ^ (n >>> 13), 3266489917);
  n = n ^ (n >>> 16);
  return (n >>> 0) / 4294967296;
}

// ---------- constants ----------
var FIELD = '#FAFAFA';
var GRIDLINE = '#E5E5EA';
var GRAYS = ['#8E8E93', '#48484A', '#C7C7CC'];
var MAGENTA = '#FF2BD1';
var GREEN = '#33FF66';
var CYAN = '#00E5FF';
var ROT = '#0B0B0D';
var CYCLE = 120;          // seconds per clean->rot cycle
var PROG = 14;            // seconds for one cell to fully corrupt
var T0 = 84;              // fixed first-frame phase (cycle 0, 84s in)
var EDGE_BASE = 18;       // flood delay scale (tuned: ~half corrupt at 84s)

// base gray per cell (fixed across cycles: the design is the same, the rot is not)
var cellGray = [];
for (var i = 0; i < 36; i++) cellGray.push(GRAYS[Math.floor(hash(i * 131 + 7) * 3)]);

// ---------- rot flood schedule (per cycle, Dijkstra over the grid graph) ----------
var schedCache = {}; // cycle -> {seed, starts[36]}
function schedule(cyc){
  if (schedCache[cyc]) return schedCache[cyc];
  var corners = [0, 5, 30, 35];
  var seed = corners[Math.floor(hash(Math.imul(cyc + 7, 2654435761)) * 4)];
  var st = new Array(36), done = new Array(36), k;
  for (k = 0; k < 36; k++){ st[k] = Infinity; done[k] = false; }
  st[seed] = 8;
  function edgeDelay(a, b, diag){
    var lo = Math.min(a, b), hi = Math.max(a, b);
    var key = (lo * 64 + hi) ^ Math.imul(cyc + 1, 974634211);
    return (0.45 + 0.9 * hash(key)) * EDGE_BASE * (diag ? 1.35 : 1);
  }
  for (var it = 0; it < 36; it++){
    var u = -1, best = Infinity;
    for (k = 0; k < 36; k++) if (!done[k] && st[k] < best){ best = st[k]; u = k; }
    if (u < 0) break;
    done[u] = true;
    var ux = u % 6, uy = (u / 6) | 0;
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++){
      if (!dx && !dy) continue;
      var vx = ux + dx, vy = uy + dy;
      if (vx < 0 || vx > 5 || vy < 0 || vy > 5) continue;
      var v = vy * 6 + vx;
      var ns = st[u] + edgeDelay(u, v, dx !== 0 && dy !== 0);
      if (ns < st[v]) st[v] = ns;
    }
  }
  var out = { seed: seed, starts: st };
  schedCache[cyc] = out;
  return out;
}

// ---------- canvas / viewport ----------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

function viewportSize(){
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  var w = vv ? vv.width : (window.innerWidth || 1280);
  var h = vv ? vv.height : (window.innerHeight || 800);
  return { w: w, h: h };
}
function fit(){
  var s = viewportSize();
  W = s.w; H = s.h;
  DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
}
if (typeof window !== 'undefined'){
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', fit);
  if (window.addEventListener) window.addEventListener('resize', fit);
}
fit();

function isPhone(){
  var sw = 9999, sh = 9999;
  if (typeof window !== 'undefined' && window.screen){ sw = window.screen.width; sh = window.screen.height; }
  if (Math.min(sw, sh) < 700) return true;
  return H > W * 1.15;
}

// ---------- layout ----------
function layout(){
  var m = Math.min(W, H);
  var side = m * 0.84;                       // grid block inside 8% margins
  var gx = (W - side) / 2, gy = (H - side) / 2;
  var cell = side / 6;
  var gap = cell * 0.18;
  return { gx: gx, gy: gy, side: side, cell: cell, gap: gap, sq: cell - gap, phone: isPhone() };
}
function cellRect(L, idx){
  var cx = idx % 6, cy = (idx / 6) | 0;
  return { x: L.gx + cx * L.cell + L.gap / 2, y: L.gy + cy * L.cell + L.gap / 2, s: L.sq,
           cx: L.gx + cx * L.cell + L.cell / 2, cy: L.gy + cy * L.cell + L.cell / 2 };
}
function rr(x, y, s, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + s, y, x + s, y + s, r);
  ctx.arcTo(x + s, y + s, x, y + s, r);
  ctx.arcTo(x, y + s, x, y, r);
  ctx.arcTo(x, y, x + s, y, r);
  ctx.closePath();
}

// ---------- squeegee (drag = cleanliness) ----------
var samples = []; // {x, y, t}
function addSample(x, y, t){
  samples.push({ x: x, y: y, t: t });
  if (samples.length > 60) samples.shift();
}
function cleanFactor(cx, cy, t){
  var bestAge = Infinity;
  for (var i = 0; i < samples.length; i++){
    var s = samples[i], age = t - s.t;
    if (age < 0 || age >= 5) continue;
    var dx = s.x - cx, dy = s.y - cy;
    if (dx * dx + dy * dy <= 52 * 52 && age < bestAge) bestAge = age;
  }
  if (bestAge === Infinity) return { f: 0, age: Infinity };
  var f = bestAge < 4 ? 1 : (5 - bestAge); // rot creeps back over the last second
  return { f: f, age: bestAge };
}

// ---------- cell rendering: pure function of (idx, progress p, time t) ----------
function drawStaticLayer(idx, x, y, s, frac, t, dark){
  // 10x10 subtiles switch to static in hash order as frac grows
  var n = 10, ts = s / n, step = Math.floor(t * 7);
  for (var a = 0; a < n; a++) for (var b = 0; b < n; b++){
    var order = hash(idx * 4096 + a * 64 + b * 7 + 11);
    if (order >= frac) continue;
    var pick = hash(idx * 8192 + a * 131 + b * 17 + step * 1013);
    var col;
    if (dark) col = pick < 0.72 ? ROT : (pick < 0.86 ? MAGENTA : (pick < 0.95 ? GREEN : CYAN));
    else col = pick < 0.55 ? '#5A5A60' : (pick < 0.72 ? MAGENTA : (pick < 0.86 ? GREEN : (pick < 0.95 ? '#2E2E33' : CYAN)));
    ctx.fillStyle = col;
    ctx.fillRect(x + b * ts - 0.5, y + a * ts - 0.5, ts + 1, ts + 1);
  }
}
function drawNicks(idx, x, y, s, count, t){
  // fray: short scanline nicks eating in from the cell edges
  ctx.lineWidth = Math.max(1, s * 0.03);
  for (var k = 0; k < count; k++){
    var h1 = hash(idx * 2048 + k * 37 + 5);
    var h2 = hash(idx * 2048 + k * 91 + 9);
    var edge = Math.floor(h1 * 4);
    var pos = h2 * s, len = s * (0.12 + 0.2 * hash(idx * 777 + k * 13));
    ctx.strokeStyle = (k % 3 === 0) ? MAGENTA : ROT;
    ctx.beginPath();
    if (edge === 0){ ctx.moveTo(x + pos, y + 1); ctx.lineTo(x + pos + len, y + 1); }
    else if (edge === 1){ ctx.moveTo(x + pos, y + s - 1); ctx.lineTo(x + pos + len, y + s - 1); }
    else if (edge === 2){ ctx.moveTo(x + 1, y + pos); ctx.lineTo(x + 1, y + pos + len); }
    else { ctx.moveTo(x + s - 1, y + pos); ctx.lineTo(x + s - 1, y + pos + len); }
    ctx.stroke();
  }
}
function drawCell(idx, L, p, t){
  var R = cellRect(L, idx), x = R.x, y = R.y, s = R.s;
  var rad = s * 0.16;
  if (p <= 0){
    ctx.fillStyle = cellGray[idx];
    rr(x, y, s, rad); ctx.fill();
    return;
  }
  ctx.save();
  rr(x, y, s, rad); ctx.clip();
  if (p < 0.3){
    // stage 1: clean, corners fraying
    ctx.fillStyle = cellGray[idx];
    ctx.fillRect(x - 1, y - 1, s + 2, s + 2);
    drawNicks(idx, x, y, s, Math.floor((p / 0.3) * 10), t);
  } else if (p < 0.65){
    // stage 2: fill dissolves into hash-static (gray + magenta/green flecks)
    ctx.fillStyle = cellGray[idx];
    ctx.fillRect(x - 1, y - 1, s + 2, s + 2);
    var f2 = 0.15 + 0.85 * ((p - 0.3) / 0.35);
    drawStaticLayer(idx, x, y, s, f2, t, false);
    drawNicks(idx, x, y, s, 10, t);
  } else {
    // stage 3: rot black takes over, static remnants + cyan tear line
    var f3 = (p - 0.65) / 0.35;
    ctx.fillStyle = cellGray[idx];
    ctx.fillRect(x - 1, y - 1, s + 2, s + 2);
    drawStaticLayer(idx, x, y, s, 1, t, false);
    drawStaticLayer(idx, x, y, s, f3 * 0.94, t + 31.7, true);
    // cyan tear line
    var ty = y + s * (0.2 + 0.6 * hash(idx * 555 + 3));
    ctx.fillStyle = CYAN;
    ctx.globalAlpha = 0.35 + 0.65 * f3;
    ctx.fillRect(x - 1, ty, s + 2, Math.max(1, s * 0.035));
    ctx.globalAlpha = 1;
    drawNicks(idx, x, y, s, 10, t);
  }
  ctx.restore();
  // hairline outline so fully-rotted cells still read as cells
  ctx.strokeStyle = 'rgba(11,11,13,0.25)';
  ctx.lineWidth = 1;
  rr(x, y, s, rad); ctx.stroke();
}
function drawGhost(L, g){
  // the CLEAN composition, misregistered: cyan and magenta offset passes
  var passes = [
    { dx: 20 * g, dy: 6 * g, col: CYAN, a: 0.18 },
    { dx: -14 * g, dy: -4 * g, col: MAGENTA, a: 0.14 }
  ];
  for (var pi = 0; pi < passes.length; pi++){
    var P = passes[pi];
    ctx.fillStyle = P.col;
    ctx.globalAlpha = P.a;
    for (var i = 0; i < 36; i++){
      var R = cellRect(L, i);
      rr(R.x + P.dx, R.y + P.dy, R.s, R.s * 0.16); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- main draw ----------
function draw(t){
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  var cyc = Math.floor(t / CYCLE);
  var ct = t - cyc * CYCLE;

  // reset flash: one held white frame at the cycle seam
  if (ct >= 119.9){
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, W, H);
    return;
  }

  var L = layout();
  var sched = schedule(cyc);

  ctx.fillStyle = FIELD;
  ctx.fillRect(0, 0, W, H);

  // precise grid lines
  ctx.strokeStyle = GRIDLINE;
  ctx.lineWidth = 1;
  var gi;
  ctx.beginPath();
  for (gi = 0; gi <= 6; gi++){
    var lx = L.gx + gi * L.cell, ly = L.gy + gi * L.cell;
    ctx.moveTo(lx, L.gy); ctx.lineTo(lx, L.gy + L.side);
    ctx.moveTo(L.gx, ly); ctx.lineTo(L.gx + L.side, ly);
  }
  ctx.stroke();

  // cells
  for (var i = 0; i < 36; i++){
    var p = (ct - sched.starts[i]) / PROG;
    if (p < 0) p = 0; if (p > 1) p = 1;
    var R = cellRect(L, i);
    var cf = cleanFactor(R.cx, R.cy, t);
    if (cf.f > 0) p = p * (1 - cf.f);
    drawCell(i, L, p, t);
    if (cf.age < 1){
      // wipe sheen on freshly squeegeed cells
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1;
      rr(R.x, R.y, R.s, R.s * 0.16); ctx.stroke();
    }
  }

  // chromatic ghost of the clean design, from the 60% mark on
  if (ct >= 72){
    var g = Math.min(1, (ct - 72) / 1);
    drawGhost(L, g);
  }
}

// ---------- time: fixed-phase first frame, rAF anchored at T0 + elapsed ----------
var startStamp = null;
function frame(now){
  if (startStamp === null) startStamp = now;
  draw(T0 + (now - startStamp) / 1000);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
draw(T0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

// ---------- pointer: the squeegee ----------
var dragging = false;
function pointerPos(e){
  var r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function nowT(){
  // piece-time of "now" is tracked off the same anchor as the frame loop
  return T0 + (performance.now() - (startStamp === null ? performance.now() : startStamp)) / 1000;
}
if (canvas.addEventListener){
  canvas.addEventListener('pointerdown', function(e){
    dragging = true;
    var p = pointerPos(e); addSample(p.x, p.y, nowT());
    if (canvas.setPointerCapture && e.pointerId !== undefined){ try { canvas.setPointerCapture(e.pointerId); } catch (err){} }
  });
  canvas.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var p = pointerPos(e); addSample(p.x, p.y, nowT());
  });
  canvas.addEventListener('pointerup', function(){ dragging = false; });
  canvas.addEventListener('pointercancel', function(){ dragging = false; });
}
})();
</script>
</body>
</html>
