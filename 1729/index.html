<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice-Leading Spiral</title>
<style>
html, body { margin: 0; padding: 0; background: #1E1E1C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#1E1E1C';
var BONE = '#EFE9DD';
var AMBER = '#D9A02B';
var PLATE = '#2A2A27';
var PLATE_LINE = 'rgba(217,160,43,0.55)';
var TITLE_INK = '#EFE9DD';
var HINT_INK = '#D9A02B';
var PERIOD = 32;
var FRAME_T = 8.0;
var RUNGS = 24;
var CELL = [0, 3, 7, 10];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1729);
var phaseT = FRAME_T;
/* ---- the complete vocabulary: all 24 orderings of the 4-note cell [0,3,7,10] ---- */
var VOICINGS = [];
(function () {
  var a = CELL.slice(), i, j, k, tmp;
  /* lexicographic permutations, seeded order kept deterministic */
  function pushPerm(p) {
    var mean = (p[0] + p[1] + p[2] + p[3]) / 4;
    var span = Math.abs(p[3] - p[0]);
    VOICINGS.push({ notes: p.slice(), mean: mean, span: span });
  }
  function nextPerm(p) {
    var i2 = p.length - 2;
    while (i2 >= 0 && p[i2] >= p[i2 + 1]) i2--;
    if (i2 < 0) return false;
    var j2 = p.length - 1;
    while (p[j2] <= p[i2]) j2--;
    var t2 = p[i2]; p[i2] = p[j2]; p[j2] = t2;
    var l = i2 + 1, r = p.length - 1;
    while (l < r) { var t3 = p[l]; p[l] = p[r]; p[r] = t3; l++; r--; }
    return true;
  }
  pushPerm(a);
  while (nextPerm(a)) pushPerm(a);
  /* a single seeded shuffle of presentation order keeps the set complete */
  for (i = VOICINGS.length - 1; i > 0; i--) {
    j = Math.floor(rng() * (i + 1));
    tmp = VOICINGS[i]; VOICINGS[i] = VOICINGS[j]; VOICINGS[j] = tmp;
  }
  /* keep the pitch contour gently rising so the staircase climbs with the voicings:
     every ordering shares the same mean, so order by bass note instead */
  VOICINGS.sort(function (v, w) { return v.notes[0] - w.notes[0]; });
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: centered square, wide dark margins on desktop ---- */
function stageRect() {
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* pulse position: 0..24 across the loop; wraps silently at the seam */
function pulsePos(t) {
  var u = ((t % PERIOD) + PERIOD) % PERIOD / PERIOD;
  return u * RUNGS;
}
/* circular distance between a rung index and the pulse, in rungs */
function circDist(i, p) {
  var d = Math.abs(i - p);
  return Math.min(d, RUNGS - d);
}
function rungGeom(i, st) {
  var cx0 = st.x + st.w / 2;
  var baseY = st.y + st.h * 0.82;
  var rise = st.h * 0.64;
  var v = VOICINGS[i];
  /* two full turns over 24 rungs; radius winds inward as the stair climbs */
  var theta = -Math.PI / 2 + i * (TAU * 2 / RUNGS);
  var rMax = st.w * 0.20;
  var r = rMax * (1 - 0.42 * (i / (RUNGS - 1)));
  var cx = cx0 + Math.cos(theta) * r;
  var cy = baseY - (i / (RUNGS - 1)) * rise + (v.notes[0] - 5) * st.h * 0.004;
  var len = st.w * 0.13 * (0.55 + 0.45 * (v.span / 10));
  return { cx: cx, cy: cy, len: len, v: v };
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var pulse = pulsePos(phaseT);
  var i, g;
  var geoms = [];
  for (i = 0; i < RUNGS; i++) geoms.push(rungGeom(i, st));
  /* faint risers between consecutive rung centers: the staircase spine */
  ctx.strokeStyle = rgba(BONE, 0.14);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(geoms[0].cx, geoms[0].cy);
  for (i = 1; i < RUNGS; i++) ctx.lineTo(geoms[i].cx, geoms[i].cy);
  ctx.stroke();
  /* faint center pole */
  ctx.strokeStyle = rgba(BONE, 0.10);
  ctx.beginPath();
  ctx.moveTo(st.x + st.w / 2, geoms[0].cy + st.h * 0.02);
  ctx.lineTo(st.x + st.w / 2, geoms[RUNGS - 1].cy - st.h * 0.02);
  ctx.stroke();
  for (i = 0; i < RUNGS; i++) {
    g = geoms[i];
    var d = circDist(i, pulse);
    var glow = Math.exp(-(d * d) / (2 * 1.1 * 1.1));
    var active = d < 0.5;
    var alpha = 0.42 + 0.38 * glow;
    var half = g.len / 2;
    ctx.strokeStyle = active ? rgba(AMBER, 0.98) : rgba(BONE, alpha);
    ctx.lineWidth = active ? Math.max(2.5, st.w * 0.004) : (1 + 0.8 * glow);
    ctx.beginPath();
    ctx.moveTo(g.cx - half, g.cy);
    ctx.lineTo(g.cx + half, g.cy);
    ctx.stroke();
    /* four note dots along the rung, placed by the voicing's pitch order */
    var n, nx;
    for (n = 0; n < 4; n++) {
      nx = g.cx - half + (g.v.notes[n] / 10) * g.len;
      ctx.beginPath();
      ctx.moveTo(nx + 2.2, g.cy);
      ctx.arc(nx, g.cy, 2.2, 0, TAU);
      ctx.fillStyle = active ? rgba(AMBER, 0.95) : rgba(BONE, 0.35 + 0.45 * glow);
      ctx.fill();
    }
    /* soft halo behind the active rung only, so exactly one rung reads amber */
    if (active) {
      ctx.strokeStyle = rgba(AMBER, 0.22 * glow);
      ctx.lineWidth = Math.max(6, st.w * 0.010);
      ctx.beginPath();
      ctx.moveTo(g.cx - half, g.cy);
      ctx.lineTo(g.cx + half, g.cy);
      ctx.stroke();
    }
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Voice-Leading Spiral').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Voice-Leading Spiral').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 06').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Voice-Leading Spiral', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 06', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the pulse climb the spiral.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    pieceCount: function () { return RUNGS; },
    pulsePos: function () { return pulsePos(phaseT); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 8.0 s of a 32 s cycle, pulse mid-climb on rung 6 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
