<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№2 · Orb</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a10; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(239,233,220,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another orb</div>
<script>
'use strict';
// No2 Orb.
// A sphere made of nothing but dots: points spread evenly over a
// sphere by the Fibonacci lattice, turned by a seeded tilt, and drawn
// in orthographic projection. A dot's size is set by how directly it
// faces the viewer (front dots full, limb dots pinpricks, back dots
// culled), and its color is sampled from an iridescent ramp (pearl,
// cyan, magenta) by facing and latitude together. There is no sphere
// underneath; facing alone builds the ball. The tilt is gated away
// from head-on and edge-on extremes so the lattice reads as a globe,
// not a disc of static.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '2', 10) || 2;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0a0a10';
const RAMP = [
  [111, 211, 231],   // cyan
  [239, 233, 220],   // pearl
  [231, 127, 208],   // magenta
];

function compose(s) {
  const rnd = mulberry32(s);
  const tiltX = 0.35 + rnd() * 0.75;             // radians
  const rotY = rnd() * Math.PI * 2;
  return { tiltX, rotY, ok: tiltX > 0.3 && tiltX < 1.2 };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2;
  const R = S * 0.40;

  const N = 2600;
  const golden = Math.PI * (3 - Math.sqrt(5));
  const cosT = Math.cos(p.tiltX), sinT = Math.sin(p.tiltX);
  const cosR = Math.cos(p.rotY), sinR = Math.sin(p.rotY);
  const dots = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const rad = Math.sqrt(Math.max(0, 1 - y * y));
    const th = golden * i;
    let x = Math.cos(th) * rad, z = Math.sin(th) * rad;
    // Rotate around Y, then tilt around X.
    const x1 = x * cosR + z * sinR, z1 = -x * sinR + z * cosR;
    const y2 = y * cosT - z1 * sinT, z2 = y * sinT + z1 * cosT;
    if (z2 <= 0.02) continue;                    // back face culled
    dots.push({ x: x1, y: y2, z: z2 });
  }
  dots.sort((a, b) => a.z - b.z);
  const maxDot = R / 52;
  for (const d of dots) {
    const t = Math.pow(d.z, 0.7) * 0.65 + (d.y * 0.5 + 0.5) * 0.35; // facing + latitude
    const seg = Math.max(0, Math.min(0.999, t)) * (RAMP.length - 1);
    const i0 = Math.floor(seg), f = seg - i0;
    const c0 = RAMP[i0], c1 = RAMP[Math.min(RAMP.length - 1, i0 + 1)];
    const r = Math.round(c0[0] + (c1[0] - c0[0]) * f);
    const g = Math.round(c0[1] + (c1[1] - c0[1]) * f);
    const b = Math.round(c0[2] + (c1[2] - c0[2]) * f);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.globalAlpha = 0.35 + d.z * 0.65;
    ctx.beginPath();
    ctx.arc(cx + d.x * R, cy - d.y * R, Math.max(0.5, maxDot * Math.pow(d.z, 0.8)), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
