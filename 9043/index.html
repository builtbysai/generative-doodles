<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9043 · River Stones</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #e9e2d0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; cursor: pointer; }
  .cap {
    position: fixed; left: 18px; bottom: 14px; pointer-events: none;
    color: #6b6250; font: italic 12.5px/1.5 Georgia, serif; opacity: 0.85;
  }
  .cap b { color: #3d382c; font-weight: normal; font-style: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap"><b>№9043 · River Stones</b>, a quiet bed, click for another arrangement</div>
<script>
'use strict';
/*
  River Stones: a bed of smooth river stones seen from above.
  Overlapping ink-wash ellipses with hand-wobbled edges, layered with
  multiply blending so overlaps deepen honestly. One stone in muted moss
  green, the only color. Calm, tactile, quiet.
*/

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '777001', 10) || 777001;
let rand = mulberry32(seed);

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const U = 1000; // virtual units, viewport-invariant

function fit() {
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const s = Math.min(window.innerWidth, window.innerHeight) * 0.94;
  cv.width = s * DPR; cv.height = s * DPR;
  cv.style.width = s + 'px'; cv.style.height = s + 'px';
  ctx.setTransform(cv.width / U, 0, 0, cv.width / U, 0, 0);
}
window.addEventListener('resize', () => { fit(); draw(); });

// value noise for the hand-drawn wobble
function makeNoise(r) {
  const p = new Array(256);
  for (let i = 0; i < 256; i++) p[i] = r();
  return function (x) {
    const xi = Math.floor(x), xf = x - xi;
    const a = p[xi & 255], b = p[(xi + 1) & 255];
    const u = xf * xf * (3 - 2 * xf);
    return a + (b - a) * u;
  };
}

// one water-worn stone; returns its wobbled path points for reuse
function stonePts(cx, cy, R, rot, noise, ni) {
  const N = 42;
  const ex = 1.0, ey = 0.74 + (noise(ni * 3.1) - 0.5) * 0.14;
  const a1 = 0.03 + noise(ni * 7.7) * 0.05;
  const a2 = 0.02 + noise(ni * 5.3 + 9) * 0.04;
  const p1 = noise(ni * 11.3) * 6.283, p2 = noise(ni * 13.9 + 4) * 6.283;
  const pts = [];
  for (let k = 0; k < N; k++) {
    const th = (k / N) * 6.283;
    const wob = 1 + a1 * Math.sin(2 * th + p1) + a2 * Math.sin(3 * th + p2);
    const lx = R * ex * wob * Math.cos(th);
    const ly = R * ey * wob * Math.sin(th);
    pts.push([
      cx + lx * Math.cos(rot) - ly * Math.sin(rot),
      cy + lx * Math.sin(rot) + ly * Math.cos(rot)
    ]);
  }
  return pts;
}
function tracePts(pts, dx, dy) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0] + dx, p[1] + dy) : ctx.moveTo(p[0] + dx, p[1] + dy));
  ctx.closePath();
}
// soft roundness: light from top-left, darker rim; opaque ink wash
function stoneFill(s) {
  const gx = s.cx - s.R * 0.32, gy = s.cy - s.R * 0.36, gr = s.R * 1.35;
  const g = ctx.createRadialGradient(gx, gy, s.R * 0.1, gx, gy, gr);
  let c0, c1;
  if (s.moss) {
    c0 = 'rgb(188,190,146)'; c1 = 'rgb(122,132,88)';
  } else {
    const q = (x) => Math.max(0, Math.min(255, Math.round(x)));
    c0 = 'rgb(' + q(s.v + 20) + ',' + q(s.v + 15) + ',' + q(s.v + 7) + ')';
    c1 = 'rgb(' + q(s.v - 26) + ',' + q(s.v - 28) + ',' + q(s.v - 30) + ')';
  }
  g.addColorStop(0, c0);
  g.addColorStop(0.62, c1);
  g.addColorStop(1, c1);
  tracePts(s.pts, 0, 0);
  ctx.fillStyle = g;
  ctx.fill();
  // faint rim for definition, kept quiet
  tracePts(s.pts, 0, 0);
  ctx.strokeStyle = s.moss ? 'rgba(96,106,66,0.20)' : 'rgba(80,72,60,0.18)';
  ctx.lineWidth = Math.max(1, s.R * 0.016);
  ctx.stroke();
}

function draw() {
  rand = mulberry32(seed);
  const noise = makeNoise(rand);
  const R = (a, b) => a + rand() * (b - a);
  let ni = 0;

  // ---- paper ----
  const paper = ctx.createLinearGradient(0, 0, U, U);
  paper.addColorStop(0, '#f3eee1');
  paper.addColorStop(0.6, '#efe8d6');
  paper.addColorStop(1, '#e9e1cc');
  ctx.fillStyle = paper;
  ctx.fillRect(0, 0, U, U);

  const MX = 80, MY = 80, PW = U - 2 * MX, PH = U - 2 * MY;

  ctx.save();
  ctx.beginPath(); ctx.rect(MX, MY, PW, PH); ctx.clip();

  // ---- riverbed: build the stone list back-to-front ----
  // Stones are opaque, like real stones. Overlaps deepen honestly through
  // soft contact shadows (multiply), not see-through washes.
  const stones = [];
  const n = 9, cell = PW / n;
  for (let gy = 0; gy < n; gy++) {
    for (let gx = 0; gx < n; gx++) {
      const cx = MX + (gx + 0.5) * cell + (rand() - 0.5) * cell * 0.62;
      const cy = MY + (gy + 0.5) * cell + (rand() - 0.5) * cell * 0.62;
      const rad = cell * R(0.68, 1.05);
      const s = { cx, cy, R: rad, rot: rand() * 6.283, v: R(172, 226), moss: false, ni: ni++ };
      s.pts = stonePts(cx, cy, rad, s.rot, noise, s.ni);
      stones.push(s);
    }
  }
  // anchors: a few large stones on top
  const nAnchors = 4 + Math.floor(rand() * 2);
  for (let i = 0; i < nAnchors; i++) {
    const rad = R(110, 170);
    const cx = MX + R(rad * 0.5, PW - rad * 0.5);
    const cy = MY + R(rad * 0.5, PH - rad * 0.5);
    const s = { cx, cy, R: rad, rot: rand() * 6.283, v: R(168, 218), moss: false, ni: ni++ };
    s.pts = stonePts(cx, cy, rad, s.rot, noise, s.ni);
    stones.push(s);
  }
  // the one moss stone, at a rule-of-thirds crossing, in front
  const thirds = [
    [MX + PW / 3, MY + PH / 3], [MX + 2 * PW / 3, MY + PH / 3],
    [MX + PW / 3, MY + 2 * PH / 3], [MX + 2 * PW / 3, MY + 2 * PH / 3]
  ];
  const tp = thirds[Math.floor(rand() * 4)];
  const ms = {
    cx: tp[0] + (rand() - 0.5) * 60, cy: tp[1] + (rand() - 0.5) * 60,
    R: R(62, 86), rot: rand() * 6.283, v: 0, moss: true, ni: ni++
  };
  ms.pts = stonePts(ms.cx, ms.cy, ms.R, ms.rot, noise, ms.ni);
  stones.push(ms);

  // pass 1: soft contact shadows (multiply) so overlaps deepen honestly
  ctx.globalCompositeOperation = 'multiply';
  ctx.filter = 'blur(7px)';
  ctx.fillStyle = 'rgba(48,42,34,0.20)';
  for (const s of stones) {
    tracePts(s.pts, s.R * 0.07, s.R * 0.10);
    ctx.fill();
  }
  ctx.filter = 'none';
  // pass 2: opaque stone fills, back to front
  ctx.globalCompositeOperation = 'source-over';
  for (const s of stones) stoneFill(s);

  ctx.restore();

  // ---- wobbly plate frame ----
  ctx.strokeStyle = 'rgba(70,62,50,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const fr = 52, fw = 40;
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (U - 2 * fr) * t + (noise(t * 9.1) - 0.5) * 5;
    const y = fr + (noise(t * 7.3 + 40) - 0.5) * 5;
    s2 ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr + (noise(t * 8.2 + 80) - 0.5) * 5;
    const y = fr + (U - 2 * fr) * t + (noise(t * 6.1 + 120) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr - (U - 2 * fr) * t + (noise(t * 7.7 + 160) - 0.5) * 5;
    const y = U - fr + (noise(t * 9.4 + 200) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (noise(t * 6.6 + 240) - 0.5) * 5;
    const y = U - fr - (U - 2 * fr) * t + (noise(t * 8.8 + 280) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();

  // ---- grain ----
  const gr = mulberry32(seed + 5);
  ctx.fillStyle = 'rgba(60,52,40,1)';
  for (let i = 0; i < 4200; i++) {
    ctx.globalAlpha = 0.025 + gr() * 0.055;
    ctx.beginPath();
    ctx.arc(gr() * U, gr() * U, 0.6 + gr() * 1.6, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- vignette ----
  const v = ctx.createRadialGradient(U / 2, U / 2, U * 0.32, U / 2, U / 2, U * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(40,30,18,0.15)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, U, U);
}

cv.addEventListener('click', () => {
  location.search = '?seed=' + (1000 + Math.floor(Math.random() * 900000));
});

fit();
draw();
</script>
</body>
</html>
