<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.275 Zigongo Bands</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B0D; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.275 Zigongo Bands (Njalikwa Chongwe).
// After her banded vessels: a pot in side profile stacked
// with flat bands of coral, cobalt and emerald divided by
// black zigzag lines, one cream band in the stack. The bands
// rise slowly as if the vessel is being pulled from clay
// while its belly breathes. Watch only: there are no
// interaction handlers.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0B0B0D', CORAL = '#D9402E', COBALT = '#2E4EA3';
var EMERALD = '#2E8B62', DIVIDER = '#141210', CREAM = '#EFE6D2';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var T = 6, lastNow = -1; // frame one: loop at about 6s, bands already displaced

function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- the vessel profile -------------------------------------------------
// Centred side profile, 80 percent of frame height: top at
// y 90, foot at y 810 in the 1280 by 900 design space. The
// lathe width is a piecewise function of height, given as
// knots of (fraction down the vessel, half width in px) and
// smoothstep interpolated, so the shoulder, belly and foot
// swell and settle without corners.
var CX = 640, VTOP = 90, VBOT = 810, VH = VBOT - VTOP;
var PROFILE = [
  [0.00, 74], [0.03, 72], [0.09, 58], [0.16, 60],
  [0.24, 84], [0.34, 128], [0.46, 168], [0.58, 188],
  [0.68, 186], [0.78, 168], [0.87, 132], [0.94, 96],
  [0.98, 84], [1.00, 82]
];
// The breathing weight: plus one at the belly, minus one at
// the neck, so one sine swells the belly while the neck
// narrows by the inverse amount.
var BREATHE_W = [
  [0.00, -0.4], [0.09, -1.0], [0.16, -0.9], [0.24, -0.3],
  [0.34, 0.3], [0.46, 0.75], [0.58, 1.0], [0.68, 0.95],
  [0.78, 0.7], [0.87, 0.35], [1.00, 0.0]
];
function interp(knots, v) {
  if (v <= knots[0][0]) return knots[0][1];
  for (var i = 0; i < knots.length - 1; i++) {
    var a = knots[i], b = knots[i + 1];
    if (v <= b[0]) {
      var f = (v - a[0]) / (b[0] - a[0]);
      var s = f * f * (3 - 2 * f);
      return a[1] + (b[1] - a[1]) * s;
    }
  }
  return knots[knots.length - 1][1];
}
function halfWidth(y) {
  var v = (y - VTOP) / VH;
  var breathe = Math.sin(T * Math.PI * 2 / 24);
  var factor = 1 + 0.04 * breathe * interp(BREATHE_W, v);
  return interp(PROFILE, v) * factor;
}
function profilePath() {
  var N = 72, i, y;
  ctx.beginPath();
  ctx.moveTo(CX - halfWidth(VTOP), VTOP);
  for (i = 1; i <= N; i++) {
    y = VTOP + VH * i / N;
    ctx.lineTo(CX - halfWidth(y), y);
  }
  ctx.lineTo(CX + halfWidth(VBOT), VBOT);
  for (i = N - 1; i >= 0; i--) {
    y = VTOP + VH * i / N;
    ctx.lineTo(CX + halfWidth(y), y);
  }
  ctx.closePath();
}

// ---- the bands ------------------------------------------------------------
// Flat strips 90 design px tall, colours cycling coral,
// cobalt, emerald, cream in a fixed order. The strip offset
// is (T / 24 mod 1) times one band height, so each band
// rises exactly one band height per 24 second loop and a
// band leaving the top wraps back in at the foot.
var BH = 90;
var CYCLE = [CORAL, COBALT, EMERALD, CREAM];
// Seeded wobble for the zigzag dividers, one row per
// boundary slot, fixed so the wobble rides with its line.
var wob = [];
(function () {
  var r = rng(27531);
  for (var k = 0; k < 10; k++) {
    var row = [];
    for (var i = 0; i < 28; i++) row.push((r() - 0.5) * 3);
    wob.push(row);
  }
})();

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-20, -20, DW + 40, DH + 40);
  var frac = (T / 24) - Math.floor(T / 24);
  var offset = frac * BH;
  ctx.save();
  profilePath();
  ctx.clip();
  // the stacked bands, flat fills only
  for (var k = -1; k <= 9; k++) {
    var y0 = VTOP + k * BH - offset;
    ctx.fillStyle = CYCLE[((k % 4) + 4) % 4];
    ctx.fillRect(CX - 280, y0, 560, BH + 1);
  }
  // the zigzag dividers: a triangle wave polyline at each
  // band boundary, in divider black, with the seeded wobble
  ctx.strokeStyle = DIVIDER;
  ctx.lineWidth = 5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (var b = 0; b <= 9; b++) {
    var yb = VTOP + b * BH - offset;
    if (yb < VTOP + 4 || yb > VBOT - 4) continue;
    var hw = halfWidth(yb);
    var xL = CX - hw - 6, xR = CX + hw + 6;
    var rowW = wob[b % wob.length];
    ctx.beginPath();
    var steps = Math.ceil((xR - xL) / 22);
    for (var i = 0; i <= steps; i++) {
      var x = xL + i * 22;
      if (x > xR) x = xR;
      var y = yb + (i % 2 === 0 ? -6 : 6) + rowW[i % rowW.length];
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the vessel keeps its shape at any aspect,
  // with the page ground in the piece's near-black ground
  var S = Math.min(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
