<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.241 Seeing the Night Bluely</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B10; }
  canvas { display:block; touch-action:none; }
  .cap { position:fixed; left:14px; bottom:12px; max-width:70vw; font:12px/1.5 -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing:0.02em; color:rgba(216,212,200,0.55); pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">One day&rsquo;s sky replayed in six minutes, dawn to night. Each new day brings different weather.</div>
<script>
(function () {
'use strict';
// No.241 Seeing the Night Bluely (James Woodfill). After his
// 2018 proposal for the KCTV tower: record the day's sky and
// broadcast it the next night. A wide horizon band of forty
// horizontal colour strata plays back one day's arc, dawn amber
// through noon pale through dusk violet, drifting almost
// imperceptibly over a dark field, a single thin registration
// line marking the tower. Six minutes a day, thirty seconds of
// held night, then a new sky with different weather. Colour as
// an adverb: a broadcast signal, not a landscape. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0B0B10';
// The day's arc as five stops: dawn, morning, noon, dusk, night.
var KEYS = [
  [232, 163, 79],   // dawn #E8A34F
  [216, 212, 200],  // morning #D8D4C8
  [185, 196, 204],  // noon #B9C4CC
  [122, 106, 154],  // dusk #7A6A9A
  [16, 16, 24]      // night #101018
];
var ARC = 360, HOLD = 30, CYCLE = ARC + HOLD;
var STRATA = 40; // exact
var W = 0, H = 0, phone = false;
var T = 858, lastNow = -1; // frame one: 78s into the third sky (a clear one), mid morning

function hashI(n) {
  var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
// Weather per cycle, seeded: clear keeps the full gamut,
// overcast compresses toward grey, storm drags everything low.
function weatherOf(cyc) {
  var r = hashI(9000 + cyc * 37);
  if (r < 0.45) return 0; // clear
  if (r < 0.78) return 1; // overcast
  return 2;               // storm
}
function weatherize(rgb, w) {
  var r = rgb[0], g = rgb[1], b = rgb[2];
  if (w === 1) { // overcast: compressed contrast
    r = r + (154 - r) * 0.45; g = g + (158 - g) * 0.45; b = b + (160 - b) * 0.45;
  } else if (w === 2) { // storm: dark, low-key
    r = r + (42 - r) * 0.55; g = g + (46 - g) * 0.55; b = b + (58 - b) * 0.55;
  }
  return [r, g, b];
}
function skyAt(u, wth) {
  var x = Math.max(0, Math.min(1, u)) * (KEYS.length - 1);
  var i = Math.min(KEYS.length - 2, Math.floor(x));
  var f = x - i;
  var a = KEYS[i], b = KEYS[i + 1];
  var c = weatherize([
    a[0] + (b[0] - a[0]) * f,
    a[1] + (b[1] - a[1]) * f,
    a[2] + (b[2] - a[2]) * f
  ], wth);
  return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var tIn = T % CYCLE;
  var cyc = Math.floor(T / CYCLE);
  var wth = weatherOf(cyc);
  var u = tIn >= ARC ? 1 : tIn / ARC;
  // The band: 4:1, occupying the middle third.
  var bw = W * (phone ? 1 : 0.96);
  var bh = bw / 4;
  if (bh > H * 0.9) { bh = H * 0.9; bw = bh * 4; }
  var bx = (W - bw) / 2, by = (H - bh) / 2;
  var sh = bh / STRATA;
  for (var i = 0; i < STRATA; i++) {
    // strata lag one another: the top of the band leads the
    // arc, the bottom trails it, so the day drifts down the
    // band and the whole arc is legible in any single frame.
    var ui = u - (i - (STRATA - 1) / 2) / (STRATA - 1) * 0.22;
    ctx.fillStyle = skyAt(ui, wth);
    ctx.fillRect(bx, by + i * sh, bw, sh + 1);
  }
  // The registration line: one thin mark for the tower, crossing
  // the band and running off into the dark above and below.
  ctx.strokeStyle = 'rgba(216,212,200,0.30)';
  ctx.lineWidth = 1;
  var rx = bx + bw * 0.62;
  ctx.beginPath();
  ctx.moveTo(rx, 0);
  ctx.lineTo(rx, H);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rx - 7, H / 2);
  ctx.lineTo(rx + 7, H / 2);
  ctx.stroke();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
