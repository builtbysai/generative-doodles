<!DOCTYPE html>
<html lang="utf-8">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No7 · Tide</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#050508; }
#stage { position:fixed; inset:0; display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// No7 Tide.
// A pendulum wave: a row of glowing bobs on strings, each swinging at a
// slightly different frequency. Traveling waves bloom, dissolve, and
// re-form; the whole row breathes back into unison on a slow cycle.
// Drag to stir the water: nearby bobs are pushed and settle back.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '7', 10) || 7;
let t = parseFloat(qs.get('t0') || '0') || 0;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}

const GROUND = '#050508';
let W = 0, H = 0, DPR = 1;
let bobs = [];
let N = 0, pivotY = 0, stringL = 0;
let glowSprites = [];

// pointer state: active touches push bobs
const pointers = new Map();

function makeGlow(hue){
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  grad.addColorStop(0, 'hsla(' + hue + ',100%,72%,1)');
  grad.addColorStop(0.25, 'hsla(' + hue + ',95%,60%,0.55)');
  grad.addColorStop(1, 'hsla(' + hue + ',90%,55%,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
  return c;
}

function compose(s){
  const rnd = mulberry32(s);
  const f0 = 0.32 + rnd() * 0.10;      // base frequency Hz
  const df = 0.006 + rnd() * 0.004;    // per-bob frequency step
  const amp = 0.34 + rnd() * 0.10;     // swing amplitude radians
  const hueA = 180 + rnd() * 20;       // hue sweep start (cyan)
  const hueB = 300 + rnd() * 30;       // hue sweep end (magenta)
  bobs = [];
  for (let i = 0; i < N; i++){
    const f = i / Math.max(1, N - 1);
    bobs.push({
      i: i,
      fx: 0.04 + f * 0.92,            // pivot x as share of W
      freq: f0 + i * df,
      amp: amp * (0.92 + rnd() * 0.16),
      phase: 0,                       // all start in unison; waves emerge from freq differences
      hue: hueA + (hueB - hueA) * f,
      r: 0, ox: 0, oy: 0, vx: 0, vy: 0 // touch offset + velocity
    });
  }
  glowSprites = [];
  for (let k = 0; k < 16; k++){
    glowSprites.push(makeGlow(Math.round(hueA + (hueB - hueA) * k / 15)));
  }
}

function layout(){
  const vw = viewportWH();
  W = vw[0]; H = vw[1];
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  N = Math.max(26, Math.min(60, Math.floor(W / 26)));
  pivotY = H * 0.15;
  stringL = H * 0.64;
  compose(seed);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
}

function bobPos(b){
  const px = b.fx * W;
  const th = b.amp * Math.sin(Math.PI * 2 * b.freq * t + b.phase);
  const bx = px + stringL * Math.sin(th) + b.ox;
  const by = pivotY + stringL * Math.cos(th) + b.oy;
  return [px, bx, by];
}

function frame(dt){
  t += dt;
  // fade for trails
  ctx.fillStyle = 'rgba(5,5,8,0.20)';
  ctx.fillRect(0, 0, W, H);

  // pivot bar
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W * 0.02, pivotY);
  ctx.lineTo(W * 0.98, pivotY);
  ctx.stroke();

  const R = Math.max(3, Math.min(7, W / 220));

  for (const b of bobs){
    // spring touch offset back to rest
    b.vx += (-b.ox * 14 - b.vx * 4.5) * dt;
    b.vy += (-b.oy * 14 - b.vy * 4.5) * dt;
    b.ox += b.vx * dt;
    b.oy += b.vy * dt;

    const pos = bobPos(b);
    const px = pos[0], bx = pos[1], by = pos[2];

    // string
    ctx.strokeStyle = 'rgba(235,240,255,0.13)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, pivotY);
    ctx.lineTo(bx, by);
    ctx.stroke();

    // glow + core (sprite chosen by position along the row)
    const si = Math.max(0, Math.min(15, Math.round(b.i / Math.max(1, N - 1) * 15)));
    const spr = glowSprites[si];
    const gs = R * 7;
    if (spr) ctx.drawImage(spr, bx - gs/2, by - gs/2, gs, gs);
    ctx.fillStyle = 'hsla(' + Math.round(b.hue) + ',100%,80%,0.95)';
    ctx.beginPath();
    ctx.arc(bx, by, R * 0.55, 0, Math.PI * 2);
    ctx.fill();
  }
}

// touch: push nearby bobs
function pushAt(x, y, strength){
  const rad = Math.max(90, W * 0.16);
  for (const b of bobs){
    const pos = bobPos(b);
    const dx = pos[1] - x, dy = pos[2] - y;
    const d = Math.hypot(dx, dy);
    if (d < rad && d > 1){
      const f = (1 - d / rad) * strength;
      b.vx += (dx / d) * f;
      b.vy += (dy / d) * f;
    }
  }
}

canvas.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  pushAt(e.clientX, e.clientY, 260);
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  // drag imparts velocity along the drag
  const rad = Math.max(90, W * 0.16);
  for (const b of bobs){
    const pos = bobPos(b);
    const d = Math.hypot(pos[1] - e.clientX, pos[2] - e.clientY);
    if (d < rad){
      const f = (1 - d / rad) * 9;
      b.vx += dx * f;
      b.vy += dy * f;
    }
  }
});
function endPointer(e){ pointers.delete(e.pointerId); }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  frame(dt);
  requestAnimationFrame(loop);
}

window.addEventListener('resize', layout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

layout();
requestAnimationFrame(loop);
</script>
</body>
</html>
