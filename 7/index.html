<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№7 · Vanishing</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0c; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(245,240,228,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.85); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another vanishing</div>
<script>
'use strict';
// No7 Vanishing.
// A floor of dots in perspective, receding to one off-center vanishing
// point. Rows are placed by a perspective power curve, so they crowd
// near the horizon and stride apart near the viewer; each dot's x is
// pulled toward the vanishing point by the same depth factor, and its
// radius grows as it approaches. Warm white on black, nothing else:
// depth from dots alone, no shading tricks (brief concept 7).

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '7', 10) || 7;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0a0a0c';

function compose(s) {
  const rnd = mulberry32(s);
  const vx = 0.32 + rnd() * 0.36;               // vanishing point, gated mid-band
  const vy = 0.26 + rnd() * 0.26;
  const power = 1.6 + rnd() * 0.6;
  return { vx, vy, power, ok: vx > 0.28 && vx < 0.72 && vy > 0.22 && vy < 0.58 };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;
  const vpx = ox + p.vx * RX, vpy = oy + p.vy * RY;

  const COLS = 25, ROWS = 16;
  ctx.fillStyle = '#f5f0e4';
  for (let j = 0; j < ROWS; j++) {
    const s = 0.16 + 0.84 * Math.pow((j + 1) / ROWS, p.power);   // depth factor
    const y = vpy + s * (oy + RY * 0.98 - vpy);
    const r = 0.5 + s * Math.min(RX, RY) / 110;
    for (let i = 0; i < COLS; i++) {
      const gx = (i / (COLS - 1)) * 2 - 1;              // -1..1 across the floor
      const x = vpx + gx * s * RX * 0.92;
      ctx.globalAlpha = 0.25 + s * 0.75;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
