<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№36 · Twenty-Four Orders</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1ea; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// No36 Twenty-Four Orders.
// Four distinct dots have exactly 24 orders. This piece generates
// them in Steinhaus-Johnson-Trotter order (every step is a single
// adjacent swap) and asserts the count: 24 orders, all unique. The
// row walks the sequence: on each beat the swapping pair slides past
// each other and the order advances. The four dots keep their identity
// colors (ink, indigo, vermilion, gold), so an order reads as a color
// order. Drag horizontally to scrub the sequence.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '36', 10) || 36;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f4f1ea';
const IDENTITY = ['#1e2430', '#2b3a67', '#c8432b', '#c9a227'];

// Steinhaus-Johnson-Trotter: all 24 permutations by adjacent swaps.
function sjt() {
  const a = [0, 1, 2, 3];
  const dir = [-1, -1, -1, -1];
  const out = [a.slice()];
  const swaps = [];   // index of the left element of each swap, per step
  for (;;) {
    let mi = -1, mv = -1;
    for (let i = 0; i < 4; i++) {
      const j = i + dir[i];
      if (j >= 0 && j < 4 && a[j] < a[i] && a[i] > mv) { mv = a[i]; mi = i; }
    }
    if (mi < 0) break;
    const j = mi + dir[mi];
    swaps.push(Math.min(mi, j));
    [a[mi], a[j]] = [a[j], a[mi]];
    [dir[mi], dir[j]] = [dir[j], dir[mi]];
    for (let i = 0; i < 4; i++) if (a[i] > mv) dir[i] = -dir[i];
    out.push(a.slice());
  }
  return { orders: out, swaps };
}
const { orders: ORDERS, swaps: SWAPS } = sjt();       // ORDERS.length === 24
const BEAT = 1.15;
const LOOP = BEAT * 24 + 1.6;

let scrub = 0;
let dragInfo = null;
let holdPos = null, holdUntil = 0;

function layout(w, h) {
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  return { RX, RY, ox: (w - RX) / 2, oy: (h - RY) / 2 };
}
const ease = u => u * u * (3 - 2 * u);

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const { RX, RY, ox, oy } = layout(w, h);
  let tPos;
  if (dragInfo) tPos = dragInfo.pos;
  else if (holdPos != null && performance.now() / 1000 < holdUntil) tPos = holdPos;
  else tPos = ((nowMs / 1000 + scrub) % LOOP + LOOP) % LOOP;

  const stepFloat = Math.min(23.999, tPos / BEAT);
  const stepIdx = Math.floor(stepFloat);
  const stepU = stepFloat - stepIdx;

  // hero row, centered
  const heroY = oy + RY * 0.5;
  const heroSpan = RX * 0.62;
  const hx0 = ox + (RX - heroSpan) / 2;
  const hDotR = RX * 0.045;
  const cur = ORDERS[stepIdx];
  const swapAt = stepIdx < 23 ? SWAPS[stepIdx] : -1;
  const animU = stepU < 0.55 ? ease(stepU / 0.55) : 1;
  for (let slot = 0; slot < 4; slot++) {
    let item = cur[slot];
    let slotX = slot;
    if (swapAt >= 0) {
      if (slot === swapAt) { item = cur[swapAt + 1]; slotX = slot + animU; }
      else if (slot === swapAt + 1) { item = cur[swapAt]; slotX = slot - animU; }
    }
    const x = hx0 + heroSpan * (slotX / 3);
    const y = heroY - Math.sin(animU * Math.PI) * hDotR * 0.55 * (swapAt >= 0 && (slot === swapAt || slot === swapAt + 1) ? 1 : 0);
    ctx.beginPath();
    ctx.arc(x, y, hDotR, 0, Math.PI * 2);
    ctx.fillStyle = IDENTITY[item];
    ctx.fill();
  }
  // hero underline
  ctx.strokeStyle = 'rgba(30,36,48,0.3)';
  ctx.lineWidth = Math.max(0.8, hDotR * 0.09);
  ctx.beginPath();
  ctx.moveTo(hx0 - heroSpan * 0.06, heroY + hDotR * 2.1);
  ctx.lineTo(hx0 + heroSpan * 1.06, heroY + hDotR * 2.1);
  ctx.stroke();

  return { RX, ox };
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(5300);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function pointerX(ev) {
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0 };
  return ev.clientX - r.left;
}
function currentPos() {
  if (dragInfo) return dragInfo.pos;
  return ((performance.now() / 1000 + scrub) % LOOP + LOOP) % LOOP;
}
canvas.addEventListener('pointerdown', ev => {
  dragInfo = { x: pointerX(ev), startPos: currentPos(), pos: currentPos() };
  holdPos = null;
});
canvas.addEventListener('pointermove', ev => {
  if (!dragInfo) return;
  const [w, h] = viewportWH();
  const L = layout(w, h);
  const dx = pointerX(ev) - dragInfo.x;
  dragInfo.pos = (((dragInfo.startPos + (dx / L.RX) * LOOP) % LOOP) + LOOP) % LOOP;
});
function endDrag() {
  if (!dragInfo) return;
  holdPos = dragInfo.pos;
  holdUntil = performance.now() / 1000 + 4;
  scrub = dragInfo.pos - performance.now() / 1000;
  dragInfo = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
