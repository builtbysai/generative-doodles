<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№95 · Primitive Ballet</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#E8E2D4; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(26,26,24,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to orbit the mobile</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.95 Primitive Ballet: seeded PRNG "Primitive Ballet", exactly 5 primitives (3 boxes, 2 spheres), 18s loop, canvas 2D projection
const brnd=mulberry(hashStr('Primitive Ballet'));
const PRIMS=[
 {type:'box', col:'#C4502E', x:-0.44, y:-0.14, z:0.10, s:0.21, ph:brnd()*6.28, bob:0.05+brnd()*0.04, rs:0.5+brnd()*0.4},
 {type:'sphere', col:'#2FA3A0', x:0.10, y:-0.30, z:-0.15, s:0.19, ph:brnd()*6.28, bob:0.06+brnd()*0.04, rs:0.4+brnd()*0.4},
 {type:'box', col:'#F5EFE0', x:-0.04, y:0.24, z:0.20, s:0.23, ph:brnd()*6.28, bob:0.04+brnd()*0.04, rs:0.4+brnd()*0.4},
 {type:'sphere', col:'#D9A419', x:0.44, y:0.10, z:-0.05, s:0.17, ph:brnd()*6.28, bob:0.07+brnd()*0.03, rs:0.5+brnd()*0.4},
 {type:'box', col:'#1A1A18', x:0.42, y:-0.40, z:0.25, s:0.16, ph:brnd()*6.28, bob:0.05+brnd()*0.03, rs:0.6+brnd()*0.4}
];
let camX=0, camY=0, dragging=false, lastPt=null;
function rot3(p,ax,ay){ const cx=Math.cos(ax), sx=Math.sin(ax), cy=Math.cos(ay), sy=Math.sin(ay); let y=p[1]*cx-p[2]*sx, z=p[1]*sx+p[2]*cx; let x=p[0]*cy+z*sy; z=-p[0]*sy+z*cy; return [x,y,z]; }
function shade(col,alpha){ ctx.fillStyle=col; ctx.fill(); if(alpha>0){ ctx.fillStyle='rgba(26,26,24,'+alpha+')'; ctx.fill(); } }
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const t=nowMs/1000;
  const ph2=(t%18)/18*Math.PI*2;
  if(!dragging){ camX*=0.98; camY*=0.98; }
  ctx.fillStyle='#E8E2D4'; ctx.fillRect(0,0,w,h);
  const phone=isPhone();
  let ox=0, oy=0, dw=w, dh=h;
  if(!phone){ const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; dw=S; dh=S; }
  const cx=ox+dw/2, cy=oy+dh/2, unit=Math.min(dw,dh);
  const ax=0.55+camX, ay=0.65+camY;
  // painter order by base z
  const order=PRIMS.map((p,i)=>[p.z,i]).sort((a,b)=>a[0]-b[0]);
  for(const [,idx] of order){
    const P=PRIMS[idx];
    const bobY=Math.sin(ph2*2+P.ph)*P.bob;
    const px=cx+P.x*unit*0.78, py=cy+(P.y+bobY)*unit*0.78;
    const sz=P.s*unit*0.42;
    const ra=Math.sin(ph2+P.ph)*0.45*P.rs+0.3, rb=Math.cos(ph2*0.7+P.ph)*0.4*P.rs+0.2;
    if(P.type==='sphere'){
      const q=rot3([0.35,0.35,0.7], ax+ra*0.3, ay+rb*0.3);
      ctx.beginPath(); ctx.arc(px,py,sz,0,Math.PI*2); shade(P.col,0);
      ctx.fillStyle='rgba(26,26,24,0.18)'; ctx.beginPath(); ctx.arc(px+q[0]*sz*0.8, py+q[1]*sz*0.8, sz*0.16,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(26,26,24,0.25)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(px,py,sz,0,Math.PI*2); ctx.stroke();
    } else {
      const hs=sz;
      let corners=[];
      for(const sx of [-1,1]) for(const sy of [-1,1]) for(const szz of [-1,1]) corners.push([sx*hs,sy*hs,szz*hs]);
      // faces: pairs of corner indices
      const faces=[[0,1,3,2,0.22],[4,5,7,6,0.0],[0,1,5,4,0.12],[2,3,7,6,0.30],[0,2,6,4,0.08],[1,3,7,5,0.18]];
      let proj=corners.map(c=>{ const r1=rot3(c, ra, rb); const r2=rot3(r1, ax, ay); return [px+r2[0], py+r2[1], r2[2]]; });
      let fl=faces.map(f=>{ const zs=(proj[f[0]][2]+proj[f[1]][2]+proj[f[2]][2]+proj[f[3]][2])/4; return [zs,f]; }).sort((a,b)=>a[0]-b[0]);
      for(const [,f] of fl){ ctx.beginPath(); ctx.moveTo(proj[f[0]][0],proj[f[0]][1]); ctx.lineTo(proj[f[1]][0],proj[f[1]][1]); ctx.lineTo(proj[f[2]][0],proj[f[2]][1]); ctx.lineTo(proj[f[3]][0],proj[f[3]][1]); ctx.closePath(); shade(P.col, f[4]); }
    }
  }
  if(PRIMS.length!==5) console.assert(false,'prims',PRIMS.length);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; lastPt=[e.clientX,e.clientY]; });
canvas.addEventListener('pointermove',e=>{ if(!dragging||!lastPt) return; camY=clamp(camY+(e.clientX-lastPt[0])*0.003,-0.26,0.26); camX=clamp(camX+(e.clientY-lastPt[1])*0.003,-0.26,0.26); lastPt=[e.clientX,e.clientY]; });
function endP(){ dragging=false; lastPt=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(4500);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
