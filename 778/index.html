<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anechoic Field</title>
<style>
  html, body { margin: 0; padding: 0; background: #F7F4ED; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- Palette (strict) ----
  var LIT    = '#FFFFFF'; // pyramid lit faces
  var SHADOW = '#C7CDD6'; // pyramid shadow faces, valley ground
  var GLOW   = [234, 242, 255]; // #EAF2FF valley glow (white daylight)
  var PLAT   = '#23262B'; // platform and figure
  var VOID_A = [239, 235, 227]; // #EFEBE3 void at the horizon
  var VOID_B = [247, 244, 237]; // #F7F4ED void at the top

  // ---- Seeded RNG: mulberry32 ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- Viewport sizing (Visual Viewport API) ----
  var W = 0, H = 0, isPhone = false;
  function measure() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 0);
    var h = vv ? vv.height : (window.innerHeight || 0);
    W = Math.max(1, Math.round(w)); H = Math.max(1, Math.round(h));
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  }

  // ---- Field geometry (precomputed per layout) ----
  // Rows run far (index 0, at the horizon) to near (last index, at the bottom).
  // Perspective spacing: base lines follow a power curve so rows compress
  // toward the horizon. Each pyramid is a frontal triangle split into two
  // facets: left lit white, right shadow blue-gray.
  var ROWS = 11;
  var field = null; // { horizonY, rows: [...], valleys: [...], grain: [...], platform: {...} }

  function buildField() {
    var horizonY = Math.round(H * 0.5);
    var fieldH = H - horizonY;
    var rows = [];
    var r, k;
    // Base-line positions for row boundaries 0..ROWS.
    var yb = [];
    for (k = 0; k <= ROWS; k++) {
      yb.push(horizonY + fieldH * Math.pow(k / ROWS, 1.62));
    }
    for (r = 0; r < ROWS; r++) {
      var spacing = yb[r + 1] - yb[r];
      var triH = spacing * 1.12;              // tips just cross into the row behind
      var cellW = Math.max(14, spacing * 3.1);
      var n = Math.ceil(W / cellW) + 3;
      var off = (r % 2) ? cellW * 0.5 : 0;    // alternate rows offset half a cell
      var startX = -cellW + off - (n * cellW - W) / 2 + cellW * 0.5;
      var centers = [];
      for (k = 0; k < n; k++) centers.push(startX + k * cellW);
      rows.push({
        baseY: yb[r + 1], apexY: yb[r + 1] - triH, triH: triH,
        cellW: cellW, spacing: spacing, centers: centers
      });
    }
    // Valleys: points between neighbouring tips on each row, dropped a
    // little below the apex line. Each carries a fixed wave phase so the
    // breathing travels across the field.
    var valleys = [];
    for (r = 0; r < ROWS; r++) {
      var row = rows[r];
      for (k = 0; k < row.centers.length - 1; k++) {
        valleys.push({
          x: row.centers[k] + row.cellW * 0.5,
          y: row.apexY + row.triH * 0.42,
          rad: row.cellW * 0.30,
          phase: k * 0.55 + r * 0.95
        });
      }
    }
    // Void grain: ultra-fine seeded speckle, tones stepped between the two
    // void colors. Normalized positions so a resize rebuilds the same field.
    var rnd = mulberry32(77801113);
    var grain = [];
    var gCount = isPhone ? 1400 : 2200;
    for (k = 0; k < gCount; k++) {
      grain.push({ u: rnd(), v: rnd(), s: rnd(), a: 0.04 + rnd() * 0.09 });
    }
    // Platform: a dark slab on the field at the right third, mid-depth.
    // Width is clamped so the slab never leaves the frame on narrow screens.
    var pr = rows[5];
    var pw = Math.min(pr.cellW * 2.7, W * 0.54);
    var pcx = Math.min(W * 0.70, W - pw / 2 - pw * 0.10 - W * 0.02);
    var pBackY = pr.baseY - pr.triH * 0.55;
    var pDepth = pr.spacing * 1.5;
    var pSkew = pw * 0.10;
    var platform = {
      cx: pcx,
      backY: pBackY,
      frontY: pBackY + pDepth,
      halfW: pw / 2,
      skew: pSkew,
      thick: Math.max(3, pr.triH * 0.20),
      figH: pr.triH * 0.95
    };
    field = { horizonY: horizonY, rows: rows, valleys: valleys, grain: grain, platform: platform };
  }

  function layout() {
    measure();
    canvas.width = W; canvas.height = H;
    buildField();
  }

  function mixStr(a, b, t) {
    var r = Math.round(a[0] + (b[0] - a[0]) * t);
    var g = Math.round(a[1] + (b[1] - a[1]) * t);
    var bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  var LOOP = 48; // seconds, seamless

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (!field) return;
    var horizonY = field.horizonY;
    var i, j;

    // ---- Void: stepped pale bands, cooler-warm at the horizon, lighter up top ----
    var STEPS = 18;
    for (i = 0; i < STEPS; i++) {
      var y0 = Math.floor(horizonY * i / STEPS);
      var y1 = Math.ceil(horizonY * (i + 1) / STEPS);
      // i = 0 is the top band; the band touching the horizon is VOID_A.
      ctx.fillStyle = mixStr(VOID_B, VOID_A, i / (STEPS - 1));
      ctx.fillRect(0, y0, W, y1 - y0);
    }
    // ---- Void grain ----
    var grain = field.grain;
    for (i = 0; i < grain.length; i++) {
      var g = grain[i];
      ctx.globalAlpha = g.a;
      ctx.fillStyle = g.s < 0.5 ? '#EFEBE3' : '#FFFFFF';
      ctx.fillRect(g.u * W, g.v * horizonY, 1.3, 1.3);
    }
    ctx.globalAlpha = 1;

    // ---- Valley ground: a mid mix of the shadow and glow tones, so both
    // facets read against it (lit white above it, shadow facets below it) ----
    ctx.fillStyle = mixStr([199, 205, 214], GLOW, 0.45);
    ctx.fillRect(0, horizonY, W, H - horizonY);

    // ---- Pyramids: far rows first, two facets each ----
    var rows = field.rows;
    for (i = 0; i < rows.length; i++) {
      var row = rows[i];
      var baseY = row.baseY, apexY = row.apexY, hw = row.cellW / 2;
      for (j = 0; j < row.centers.length; j++) {
        var cx = row.centers[j];
        ctx.fillStyle = LIT;
        ctx.beginPath();
        ctx.moveTo(cx, apexY);
        ctx.lineTo(cx - hw, baseY);
        ctx.lineTo(cx, baseY);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = SHADOW;
        ctx.beginPath();
        ctx.moveTo(cx, apexY);
        ctx.lineTo(cx, baseY);
        ctx.lineTo(cx + hw, baseY);
        ctx.closePath();
        ctx.fill();
      }
    }

    // ---- Valley glow: breathing in traveling waves, closed form in (position, t) ----
    // brightness = 0.5 + 0.5 * sin(2 * PI * t / 48 - phase): at t = 0 the wave
    // sits mid-swell and its phase gradient reads across the field.
    var w = 2 * Math.PI * ((t % LOOP) / LOOP);
    var valleys = field.valleys;
    for (i = 0; i < valleys.length; i++) {
      var v = valleys[i];
      if (v.x < -v.rad || v.x > W + v.rad) continue;
      var b = 0.5 + 0.5 * Math.sin(w - v.phase);
      var amp = 0.16 + 0.84 * b; // never fully dead, never a hard disc
      for (j = 3; j >= 1; j--) {
        var rr = v.rad * j / 3;
        ctx.globalAlpha = 0.10 * amp * (4 - j) / 3 + 0.04 * amp;
        ctx.fillStyle = 'rgb(' + GLOW[0] + ',' + GLOW[1] + ',' + GLOW[2] + ')';
        ctx.beginPath();
        ctx.arc(v.x, v.y, rr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // ---- Platform: flat dark slab, top face in perspective + front edge ----
    var p = field.platform;
    ctx.fillStyle = PLAT;
    ctx.beginPath(); // top face
    ctx.moveTo(p.cx - p.halfW, p.backY);
    ctx.lineTo(p.cx + p.halfW, p.backY);
    ctx.lineTo(p.cx + p.halfW + p.skew, p.frontY);
    ctx.lineTo(p.cx - p.halfW + p.skew, p.frontY);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath(); // front edge
    ctx.moveTo(p.cx - p.halfW + p.skew, p.frontY);
    ctx.lineTo(p.cx + p.halfW + p.skew, p.frontY);
    ctx.lineTo(p.cx + p.halfW + p.skew, p.frontY + p.thick);
    ctx.lineTo(p.cx - p.halfW + p.skew, p.frontY + p.thick);
    ctx.closePath();
    ctx.fill();

    // ---- Figure: one tiny standing silhouette on the platform, dwarfed ----
    var fh = p.figH;
    if (fh >= 9) {
      var fx = p.cx + p.skew * 0.35;
      var fBase = p.backY + (p.frontY - p.backY) * 0.35;
      var headR = fh * 0.13;
      var headY = fBase - fh + headR;
      ctx.beginPath();
      ctx.arc(fx, headY, headR, 0, Math.PI * 2);
      ctx.fill();
      var bw = fh * 0.16; // half body width at the shoulders
      ctx.beginPath(); // shoulders, torso, legs as one quiet shape
      ctx.moveTo(fx - bw * 0.7, headY + headR * 1.15);
      ctx.lineTo(fx + bw * 0.7, headY + headR * 1.15);
      ctx.lineTo(fx + bw, fBase - fh * 0.38);
      ctx.lineTo(fx + bw * 0.45, fBase);
      ctx.lineTo(fx + bw * 0.12, fBase);
      ctx.lineTo(fx, fBase - fh * 0.34);
      ctx.lineTo(fx - bw * 0.12, fBase);
      ctx.lineTo(fx - bw * 0.45, fBase);
      ctx.lineTo(fx - bw, fBase - fh * 0.38);
      ctx.closePath();
      ctx.fill();
    }
  }

  // ---- Boot: frame one is the synchronous draw at loop t = 0 ----
  layout();
  draw(0);

  // ---- Resize (watch-only piece: no pointer interaction) ----
  var startStamp = null;
  function elapsed() {
    if (startStamp === null) return 0;
    return (performance.now() - startStamp) / 1000;
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { layout(); draw(elapsed()); });
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { layout(); draw(elapsed()); });
  }

  // ---- Animation loop (guarded; QA renderer has no rAF) ----
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (ts) {
      if (startStamp === null) startStamp = ts;
      draw((ts - startStamp) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
