<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>164 Noses</title>
<style>
html,body{margin:0;padding:0;background:#e8e2d4;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function a4(x) { return Math.round(x * 10000) / 10000; }
  function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }

  var PAPER = '#e8e2d4', PENCIL = '#26241f',
      GREEN = '#6f8f74', GREEN_DARK = '#557a5c', GOLD = '#d4a24e',
      ROWLINE = '#b8b2a2', CHIP = '#efe9db';

  var ROWS = 14, COLS = 12, TOPN = 8;
  var CYCLE = 168, ROWSTEP = 12, PHASE = 66;
  var PLAIN_ROW = 8, PLAIN_COL = 9;

  // Nose profile polyline, unit space (scaled by nose size).
  var PROF = [[-0.05, -0.55], [0.10, -0.25], [0.30, 0.05], [0.28, 0.28], [0.05, 0.38], [-0.08, 0.30]];
  // Snort curl: small spiral at the nostril, unit space.
  var CURL = [];
  (function () {
    for (var i = 0; i <= 12; i++) {
      var ang = -1.2 + i * 0.55;
      var r = 0.02 + 0.006 * i;
      CURL.push([0.14 + r * Math.cos(ang), 0.46 + r * Math.sin(ang)]);
    }
  })();

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, phone = false, lastT = 0;
  var cellW = 0, cellH = 0;
  var noses = [];

  function buildNoses() {
    noses = [];
    for (var k = 0; k < ROWS; k++) {
      var cols = (k === ROWS - 1) ? TOPN : COLS;
      var off = (k === ROWS - 1) ? (COLS - TOPN) / 2 : 0;
      var list = [];
      for (var c = 0; c < cols; c++) {
        var col = off + c;
        if (!(k === PLAIN_ROW && col === PLAIN_COL)) list.push({ row: k, col: col, plain: false });
      }
      // The plain nose draws last in its row.
      if (k === PLAIN_ROW) list.push({ row: k, col: PLAIN_COL, plain: true });
      for (var j = 0; j < list.length; j++) {
        var n = list[j];
        var rng = mulberry32(1422000 + (k * 100 + n.col) * 7919);
        n.j = j;
        n.jx = (rng() - 0.5) * 0.20;
        n.jy = (rng() - 0.5) * 0.20;
        n.rot = (rng() - 0.5) * 0.24;
        n.ss = 0.92 + rng() * 0.16;
        n.flipped = false;
        noses.push(n);
      }
    }
  }

  function layout() {
    cellW = W / COLS;
    cellH = H / ROWS;
    for (var i = 0; i < noses.length; i++) {
      var n = noses[i];
      n.x = (n.col + 0.5 + n.jx) * cellW;
      n.y = H - (n.row + 0.5 + n.jy) * cellH;
      n.size = Math.min(cellW, cellH) * 0.55 * n.ss;
    }
  }

  function sizeCanvas() {
    var vw = 1280, vh = 900;
    if (typeof window !== 'undefined') {
      if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
      else { vw = window.innerWidth; vh = window.innerHeight; }
    }
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    phone = false;
    if (typeof window !== 'undefined' && window.screen) {
      phone = Math.min(window.screen.width, window.screen.height) < 700;
    }
    if (!phone && H > W * 1.15) phone = true;
    layout();
  }

  function greenTime(row) { return row < ROWS - 1 ? (row + 1) * ROWSTEP : 164; }

  // State of one nose at cycle time ct. Rows not yet reached in this pass
  // still show the previous pass (fully drawn, green) — the field never clears.
  function noseState(n, ct) {
    var rs = n.row * ROWSTEP;
    var start = rs + n.j * 0.6;
    var exception = n.plain && !n.flipped;
    var st = { p: 1, c: 1, green: !exception };
    if (ct < rs || ct < start) return st;
    st.p = clamp((ct - start) / 0.6, 0, 1);
    st.c = clamp((ct - (start + 0.6)) / 0.5, 0, 1);
    st.green = !exception && ct >= greenTime(n.row);
    return st;
  }

  function pathFrac(pts, s, f) {
    if (f <= 0) return;
    var total = 0;
    for (var i = 1; i < pts.length; i++) {
      var dx = (pts[i][0] - pts[i - 1][0]) * s, dy = (pts[i][1] - pts[i - 1][1]) * s;
      total += Math.sqrt(dx * dx + dy * dy);
    }
    var target = total * f, acc = 0;
    ctx.beginPath();
    ctx.moveTo(pts[0][0] * s, pts[0][1] * s);
    for (var k = 1; k < pts.length; k++) {
      var x0 = pts[k - 1][0] * s, y0 = pts[k - 1][1] * s;
      var x1 = pts[k][0] * s, y1 = pts[k][1] * s;
      var seg = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
      if (acc + seg <= target) { ctx.lineTo(x1, y1); acc += seg; }
      else {
        var r = seg === 0 ? 0 : (target - acc) / seg;
        ctx.lineTo(x0 + (x1 - x0) * r, y0 + (y1 - y0) * r);
        break;
      }
    }
    ctx.stroke();
  }

  function drawNose(n, st) {
    var s = n.size;
    ctx.save();
    ctx.translate(n.x, n.y);
    ctx.rotate(n.rot);
    var snort = (!n.plain) !== n.flipped;
    var gold = n.plain && !n.flipped;
    var stroke = st.green ? GREEN : (gold ? GOLD : PENCIL);
    ctx.strokeStyle = stroke;
    ctx.lineWidth = Math.max(1.5, s * 0.05);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    pathFrac(PROF, s, st.p);
    if (snort && st.c > 0) {
      ctx.strokeStyle = st.green ? GREEN_DARK : stroke;
      pathFrac(CURL, s, st.c);
    }
    if (snort && !st.green && st.c >= 1) {
      ctx.fillStyle = 'rgba(176,30,36,' + a4(0.55) + ')';
      var d = 0.07 * s;
      ctx.fillRect(0.16 * s - d / 2, 0.44 * s - d / 2, d, d);
    }
    ctx.restore();
  }

  // Tally: snorting noses fully drawn in the current pass, as tally marks.
  function tallyCount(ct) {
    var count = 0;
    for (var i = 0; i < noses.length; i++) {
      var n = noses[i];
      var rs = n.row * ROWSTEP;
      if (ct < rs) continue;
      var start = rs + n.j * 0.6;
      if (ct < start + 1.1) continue;
      if ((!n.plain) !== n.flipped) count++;
    }
    return count;
  }

  function drawTally(count) {
    var gw = phone ? 16 : 22;
    var mw = phone ? 2 : 3, mh = phone ? 8 : 10;
    var pad = 10;
    var chipW = Math.min(W * 0.6, 460);
    var perLine = Math.max(1, Math.floor((chipW - pad * 2) / gw));
    var groups = Math.ceil(count / 5);
    var lines = Math.max(1, Math.ceil(groups / perLine));
    var chipH = pad * 2 + lines * (mh + 4) - 4;
    var x0 = 12, y0 = H - chipH - 12;
    ctx.fillStyle = CHIP;
    ctx.fillRect(x0, y0, chipW, chipH);
    ctx.strokeStyle = ROWLINE;
    ctx.lineWidth = 1;
    ctx.strokeRect(x0 + 0.5, y0 + 0.5, chipW - 1, chipH - 1);
    ctx.fillStyle = PENCIL;
    ctx.strokeStyle = PENCIL;
    ctx.lineWidth = 1.5;
    for (var g = 0; g < groups; g++) {
      var gx = x0 + pad + (g % perLine) * gw;
      var gy = y0 + pad + Math.floor(g / perLine) * (mh + 4);
      var m = Math.min(5, count - g * 5);
      for (var i = 0; i < m; i++) {
        if (i < 4) ctx.fillRect(gx + i * (mw + 1), gy, mw, mh);
        else {
          ctx.beginPath();
          ctx.moveTo(gx - 1, gy + mh);
          ctx.lineTo(gx + mw * 4 + 3, gy);
          ctx.stroke();
        }
      }
    }
  }

  function draw(t) {
    lastT = t;
    var ct = (t + PHASE) % CYCLE;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(184,178,162,' + a4(0.6) + ')';
    for (var k = 1; k < ROWS; k++) ctx.fillRect(0, H - k * cellH, W, 1);
    for (var i = 0; i < noses.length; i++) {
      var n = noses[i];
      drawNose(n, noseState(n, ct));
    }
    drawTally(tallyCount(ct));
  }

  var grab = null;
  function hitNose(x, y) {
    for (var i = 0; i < noses.length; i++) {
      var n = noses[i];
      if (Math.abs(x - n.x) < cellW * 0.6 && Math.abs(y - n.y) < cellH * 0.6) return n;
    }
    return null;
  }
  canvas.addEventListener('pointerdown', function (e) {
    grab = hitNose(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointerup', function (e) {
    if (grab) { grab.flipped = !grab.flipped; grab = null; draw(lastT); }
  });
  canvas.addEventListener('pointercancel', function () { grab = null; });

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { sizeCanvas(); draw(lastT); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { sizeCanvas(); draw(lastT); });
    }
  }

  buildNoses();
  sizeCanvas();
  draw(0);
  var rafStarted = false, rafT0 = 0;
  function loop(ts) {
    if (!rafStarted) { rafStarted = true; rafT0 = ts; }
    draw((ts - rafT0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
