<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Parola-Canto Continuum</title>
<style>
html, body { margin: 0; padding: 0; background: #232323; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* The Parola-Canto Continuum: one waveform band runs the full width
   of the frame and melts through four registers in sequence: jagged
   spoken bursts (speech, rust), sustained looping waves (song, gold),
   thin exhale threads (breath, pale blue), scattered glitch ticks
   (noise, ash). The band never stops to change state. Above it the
   four state names glow in turn; below it a cursor word advances
   through a small list of invented words. Watch only. */
var TAU = Math.PI * 2;
var BG = '#232323';
var RUST = '#B4552D';
var GOLD = '#C9A227';
var PALE = '#A8C4D4';
var ASH = '#8A8578';
var PLATE = '#1A1A1A';
var PLATE_LINE = 'rgba(201,162,39,0.45)';
var TITLE_INK = '#EDE6D2';
var HINT_INK = '#C9A227';
var SEED0 = 1889;
var FRAME_T = 20.0;   /* fixed phase: exactly mid-morph, song 50 / breath 50 */
var CYCLE = 40.0;     /* 10 s per register, 4 s crossfade centred on each boundary */
var STATE_NAMES = ['SPEECH', 'SONG', 'BREATH', 'NOISE'];
var STATE_COLORS = [RUST, GOLD, PALE, ASH];
var WORDS = ['velna', 'sorru', 'kellin', 'morath', 'tessiv',
             'ondrel', 'faynor', 'lussa', 'brenik', 'alvor'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smoothstep(a, b, x) {
  var f = clamp((x - a) / (b - a), 0, 1);
  return f * f * (3 - 2 * f);
}
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash01(i, s) {
  var h = (Math.imul(i + 1, 374761393) + Math.imul(s + 1, 668265263) + SEED0) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (((h ^ (h >>> 16)) >>> 0) / 4294967296);
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- register weights: smooth 4 s crossfades centred on boundaries ---- */
function stateWeights(t) {
  var ph = ((t % CYCLE) + CYCLE) % CYCLE;
  var w = [0, 0, 0, 0];
  var i, d;
  for (i = 0; i < 4; i++) {
    var centre = i * 10 + 5;
    d = Math.abs(ph - centre);
    if (d > CYCLE / 2) d = CYCLE - d;
    w[i] = 1 - smoothstep(3, 7, d);
  }
  return w;
}
/* ---- the four waveform generators, all pure functions of (col, t) ---- */
function speechY(col, t, amp) {
  var burst = hash01(col, Math.floor(t * 7));
  var env = 0.35 + 0.65 * Math.abs(Math.sin(col * 0.11 + t * 0.9));
  return (burst * 2 - 1) * amp * env;
}
function songY(col, t, amp) {
  return amp * (0.6 * Math.sin(col * 0.045 + t * 1.1) +
                0.3 * Math.sin(col * 0.11 - t * 0.7) +
                0.15 * Math.sin(col * 0.23 + t * 1.6));
}
function breathY(col, t, amp) {
  return amp * 0.9 * Math.sin(col * 0.08 + t * 0.5);
}
function noiseY(col, t, amp) {
  if (hash01(col, 999) >= 0.10) return 0;
  return (hash01(col, Math.floor(t * 8)) * 2 - 1) * amp;
}
function ampEnv(i, col, t) {
  if (i === 0) return 0.55 + 0.45 * Math.abs(Math.sin(col * 0.11 + t * 0.9));
  if (i === 1) return 0.9;
  if (i === 2) return 0.22;
  return (hash01(col, 999) < 0.10) ? 0.8 : 0.15;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The band rect: full-bleed on phones, a centered square on desktop.
   The page ground is the piece's own charcoal, so the square reads as
   the band filling the frame. Returns {ox, oy, w, h}. */
function bandRect() {
  if (isPhone) return { ox: 0, oy: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { ox: (VW - s) / 2, oy: (VH - s) / 2, w: s, h: s };
}
function blendColor(w) {
  var r = 0, g = 0, b = 0, i, c;
  for (i = 0; i < 4; i++) {
    c = hexRgb(STATE_COLORS[i]);
    r += c[0] * w[i]; g += c[1] * w[i]; b += c[2] * w[i];
  }
  return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
}
function blendRgba(w, a) {
  var r = 0, g = 0, b = 0, i, c;
  for (i = 0; i < 4; i++) {
    c = hexRgb(STATE_COLORS[i]);
    r += c[0] * w[i]; g += c[1] * w[i]; b += c[2] * w[i];
  }
  return 'rgba(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ',' + a.toFixed(4) + ')';
}
function drawPlates(R) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Parola-Canto Continuum').width > R.w - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Parola-Canto Continuum').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 15').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = R.ox + 12, plateY = R.oy + 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Parola-Canto Continuum', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 03 · 15', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the band melt between states.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = R.ox + 12;
  var hintPlateY = R.oy + R.h - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var R = bandRect();
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, VW, VH);
  var w = stateWeights(phaseT);
  var cy = R.oy + R.h * 0.52;
  var half = R.h * 0.17;
  var N = 200;
  var i, col, x;
  /* faint horizontal rules above and below the band */
  ctx.strokeStyle = rgba(ASH, 0.10);
  ctx.lineWidth = 1;
  var ruleY;
  for (i = 0; i < 5; i++) {
    ruleY = R.oy + (i + 0.5) / 5 * R.h;
    ctx.beginPath();
    ctx.moveTo(R.ox, ruleY);
    ctx.lineTo(R.ox + R.w, ruleY);
    ctx.stroke();
  }
  /* timing track: a thin line with a dot marking the cycle position */
  var trackY = R.oy + R.h * 0.24;
  ctx.strokeStyle = rgba(ASH, 0.35);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(R.ox + 14, trackY);
  ctx.lineTo(R.ox + R.w - 14, trackY);
  ctx.stroke();
  var ph = ((phaseT % CYCLE) + CYCLE) % CYCLE;
  var dotX = R.ox + 14 + (ph / CYCLE) * (R.w - 28);
  ctx.fillStyle = blendColor(w);
  ctx.beginPath();
  ctx.moveTo(dotX + 4, trackY);
  ctx.arc(dotX, trackY, 4, 0, TAU);
  ctx.fill();
  /* state names: a faint caption track above the band, glowing in turn */
  var labelY = cy - half - R.h * 0.055;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var namePx = isPhone ? 12 : 14;
  ctx.font = 'bold ' + namePx + 'px monospace';
  for (i = 0; i < 4; i++) {
    var nx = R.ox + (i + 0.5) / 4 * R.w;
    ctx.fillStyle = rgba(STATE_COLORS[i], 0.25 + 0.75 * w[i]);
    ctx.fillText(STATE_NAMES[i], nx, labelY);
  }
  /* sample the blended waveform across the full width of the rect */
  var ys = [], as = [];
  for (i = 0; i <= N; i++) {
    col = i;
    var yv = 0, av = 0;
    yv += w[0] * speechY(col, phaseT, half * 0.85);
    yv += w[1] * songY(col, phaseT, half * 0.70);
    yv += w[2] * breathY(col, phaseT, half * 0.15);
    yv += w[3] * noiseY(col, phaseT, half * 0.80);
    av += w[0] * ampEnv(0, col, phaseT);
    av += w[1] * ampEnv(1, col, phaseT);
    av += w[2] * ampEnv(2, col, phaseT);
    av += w[3] * ampEnv(3, col, phaseT);
    ys.push(yv);
    as.push(av);
  }
  /* the band: a soft filled ribbon under a bright blended centre line */
  ctx.beginPath();
  for (i = 0; i <= N; i++) {
    x = R.ox + (i / N) * R.w;
    if (i === 0) ctx.moveTo(x, cy + ys[i] - as[i] * half);
    else ctx.lineTo(x, cy + ys[i] - as[i] * half);
  }
  for (i = N; i >= 0; i--) {
    x = R.ox + (i / N) * R.w;
    ctx.lineTo(x, cy + ys[i] + as[i] * half);
  }
  ctx.closePath();
  ctx.fillStyle = blendRgba(w, 0.16);
  ctx.fill();
  ctx.strokeStyle = blendColor(w);
  ctx.lineWidth = Math.max(2, R.h * 0.003);
  ctx.beginPath();
  for (i = 0; i <= N; i++) {
    x = R.ox + (i / N) * R.w;
    if (i === 0) ctx.moveTo(x, cy + ys[i]);
    else ctx.lineTo(x, cy + ys[i]);
  }
  ctx.stroke();
  /* breath threads: three thin pale lines riding the band while breath lives */
  if (w[2] > 0.02) {
    var offs = [-0.35, 0, 0.35];
    var k;
    for (k = 0; k < 3; k++) {
      ctx.strokeStyle = rgba(PALE, 0.55 * w[2]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (i = 0; i <= N; i++) {
        col = i;
        x = R.ox + (i / N) * R.w;
        var ty = cy + offs[k] * half * 0.5 + breathY(col, phaseT, half * 0.12);
        if (i === 0) ctx.moveTo(x, ty); else ctx.lineTo(x, ty);
      }
      ctx.stroke();
    }
  }
  /* noise ticks: short ash verticals at sparse fixed columns while noise lives */
  if (w[3] > 0.02) {
    ctx.strokeStyle = rgba(ASH, 0.85 * w[3]);
    ctx.lineWidth = Math.max(1, R.h * 0.002);
    for (i = 0; i <= N; i++) {
      if (hash01(i, 999) >= 0.10) continue;
      col = i;
      x = R.ox + (i / N) * R.w;
      var th = (0.3 + 0.7 * hash01(col, Math.floor(phaseT * 8))) * half * 0.9;
      ctx.beginPath();
      ctx.moveTo(x, cy + ys[i] - th);
      ctx.lineTo(x, cy + ys[i] + th);
      ctx.stroke();
    }
  }
  /* the cursor word: one invented word at a time, advancing every 2.5 s */
  var wi = Math.floor(phaseT / 2.5) % WORDS.length;
  var caret = (Math.floor(phaseT) % 2 === 0) ? ' |' : '  ';
  var tickPx = isPhone ? 15 : 18;
  ctx.font = tickPx + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = rgba(TITLE_INK, 0.85);
  ctx.fillText(WORDS[wi] + caret, R.ox + R.w / 2, cy + half + R.h * 0.07);
  drawPlates(R);
}
/* ---- frame one: fixed phase t = 20 s, song and breath at 50/50 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
