<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Meadow</title>
<style>
html, body { margin: 0; padding: 0; background: #0E0E10; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a wall of modular synth racks, cables hanging like veins, a wooden
   dummy head listening from the top. Every minute the unseen hands re-patch
   one cable and the drone shifts its routing. Patching is how it is played. */
var TAU = Math.PI * 2;
var GROUND = '#0E0E10';
var PANEL = '#17171B';
var PANEL_LINE = '#2A2A30';
var SOCKET_RING = '#3A3A40';
var SOCKET_HOLE = '#08080A';
var PLATE = '#101013';
var PLATE_LINE = 'rgba(237,237,232,0.30)';
var TITLE_INK = '#EDEDE8';
var HINT_INK = '#9AA3AD';
var WOOD = '#A97C50';
var WOOD_DARK = '#7E5A38';
var WOOD_LIGHT = '#C49A6B';
var LED_RED = '#E8442E';
var LED_GREEN = '#4FC46A';
var CABLE_COLORS = ['#D23B2E', '#E8B93C', '#3E7CD6', '#EDEDE8', '#D23B2E', '#3E7CD6'];
var CYCLE = 47;            /* seconds per routing cycle: one auto re-patch per cycle */
var HORIZON = 47 * 60;     /* event schedule horizon, seconds */
var FRAME_T = 23.4;        /* fixed phase: mid-cycle, LEDs mid-breath, no re-patch yet */
var NCABLES = 6;
var COLS = 4, ROWS = 3;    /* rack modules */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1840);
var phaseT = FRAME_T;
var soundOn = false;
var audioCtx = null;
var droneNodes = null;
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
var lastT = null;
var drag = null;           /* { cable, end, x, y } while a cable end is held */
var manualPatch = null;    /* { cable, end, socket, until } viewer re-patch, one full cycle */
/* ---- rack geometry: 4 x 3 modules, 2 x 2 sockets each = 48 sockets ---- */
var NSOCKETS = COLS * ROWS * 4;
var SOCKETS = [];          /* { mx, my, sx, sy } module col/row, socket col/row, filled at draw time */
var i, j, k;
for (i = 0; i < COLS; i++) for (j = 0; j < ROWS; j++) for (k = 0; k < 4; k++) {
  SOCKETS.push({ mx: i, my: j, sx: k % 2, sy: Math.floor(k / 2) });
}
/* ---- initial patching: 12 distinct sockets, seeded ---- */
function shuffledSockets() {
  var idx = [];
  for (i = 0; i < NSOCKETS; i++) idx.push(i);
  for (i = idx.length - 1; i > 0; i--) {
    j = Math.floor(rng() * (i + 1));
    k = idx[i]; idx[i] = idx[j]; idx[j] = k;
  }
  return idx;
}
var INIT = shuffledSockets().slice(0, 2 * NCABLES);
var CABLES = [];
for (i = 0; i < NCABLES; i++) {
  CABLES.push({ a: INIT[2 * i], b: INIT[2 * i + 1], color: CABLE_COLORS[i], phase: rng() * TAU });
}
/* ---- auto re-patch schedule: one cable per 47 s cycle, seeded, fixed at load ---- */
var AUTO = [];
(function () {
  var occ = {};            /* socket -> cable end occupying it */
  for (i = 0; i < NCABLES; i++) { occ[CABLES[i].a] = i; occ[CABLES[i].b] = i; }
  var curB = [];
  for (i = 0; i < NCABLES; i++) curB.push(CABLES[i].b);
  var cyc, cable, other, free, pick;
  for (cyc = 0; cyc < 60; cyc++) {
    cable = cyc % NCABLES;
    other = CABLES[cable].a;
    free = [];
    for (i = 0; i < NSOCKETS; i++) {
      if (i !== other && i !== curB[cable] && !(i in occ)) free.push(i);
    }
    if (free.length === 0) continue;
    pick = free[Math.floor(rng() * free.length)];
    delete occ[curB[cable]];
    occ[pick] = cable;
    curB[cable] = pick;
    AUTO.push({ t: CYCLE * (cyc + 1), cable: cable, socket: pick });
  }
})();
/* routing state at time t: auto events applied, then the viewer's manual patch */
function routingAt(t) {
  var ends = [];
  for (i = 0; i < NCABLES; i++) ends.push({ a: CABLES[i].a, b: CABLES[i].b });
  var e;
  for (e = 0; e < AUTO.length; e++) {
    if (AUTO[e].t <= t) ends[AUTO[e].cable].b = AUTO[e].socket;
    else break;
  }
  if (manualPatch && t < manualPatch.until) {
    ends[manualPatch.cable][manualPatch.end] = manualPatch.socket;
  }
  return ends;
}
function voiceAmp(cableIdx, t) {
  /* slow breathing, ~3.1 s period, well under any flicker limit */
  return 0.55 + 0.45 * Math.sin(TAU * t / 3.1 + CABLES[cableIdx].phase);
}
function voiceFreq(cableIdx, t) {
  var ends = routingAt(t);
  var s = ends[cableIdx].b % 12;
  return 55 * Math.pow(2, s / 12) * (cableIdx % 2 ? 1.5 : 1);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function sceneRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* module and socket geometry inside the scene */
function rackGeom(sc) {
  var headH = Math.min(sc.h * 0.17, sc.w * 0.30);
  var rack = { x: sc.x, y: sc.y + headH, w: sc.w, h: sc.h - headH };
  var gap = Math.max(4, sc.w * 0.008);
  var mw = (rack.w - gap * (COLS + 1)) / COLS;
  var mh = (rack.h - gap * (ROWS + 1)) / ROWS;
  return { headH: headH, rack: rack, gap: gap, mw: mw, mh: mh };
}
function moduleRect(g, mx, my) {
  return {
    x: g.rack.x + g.gap + mx * (g.mw + g.gap),
    y: g.rack.y + g.gap + my * (g.mh + g.gap),
    w: g.mw, h: g.mh
  };
}
function socketPos(g, sIdx) {
  var s = SOCKETS[sIdx];
  var m = moduleRect(g, s.mx, s.my);
  var ix = m.w * 0.28, iy = m.h * 0.30;
  return {
    x: m.x + m.w / 2 + (s.sx === 0 ? -ix : ix),
    y: m.y + m.h / 2 + (s.sy === 0 ? -iy : iy)
  };
}
function socketRadius(g) {
  return Math.max(5, Math.min(g.mw, g.mh) * 0.075);
}
function drawHead(sc, g, t) {
  var cx = sc.x + sc.w / 2;
  var cy = sc.y + g.headH * 0.58;
  var hw = g.headH * 0.48, hh = g.headH * 0.42;
  var sway = 0.012 * Math.sin(TAU * t / 23.0); /* the dummy listens, barely moving */
  /* neck and base */
  ctx.fillStyle = WOOD_DARK;
  ctx.fillRect(cx - hw * 0.32, cy + hh * 0.72, hw * 0.64, g.headH * 0.22);
  ctx.fillStyle = WOOD;
  ctx.fillRect(cx - hw * 0.85, cy + hh * 0.92, hw * 1.7, g.headH * 0.10);
  /* cranium */
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(sway);
  ctx.fillStyle = WOOD;
  ctx.beginPath();
  ctx.ellipse(0, 0, hw, hh, 0, 0, TAU);
  ctx.fill();
  /* face plane, slightly lighter, no features */
  ctx.fillStyle = WOOD_LIGHT;
  ctx.beginPath();
  ctx.ellipse(0, hh * 0.18, hw * 0.62, hh * 0.58, 0, 0, TAU);
  ctx.fill();
  /* center seam, the only line on the head */
  ctx.strokeStyle = rgba(WOOD_DARK, 0.55);
  ctx.lineWidth = Math.max(1, hw * 0.02);
  ctx.beginPath();
  ctx.moveTo(0, -hh * 0.72);
  ctx.lineTo(0, hh * 0.72);
  ctx.stroke();
  /* ear nubs */
  ctx.fillStyle = WOOD;
  ctx.beginPath();
  ctx.arc(-hw * 0.98, hh * 0.05, hw * 0.14, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(hw * 0.98, hh * 0.05, hw * 0.14, 0, TAU);
  ctx.fill();
  ctx.restore();
}
function drawModules(sc, g, t, ends) {
  var mx, my, m, lx, ly, s, p, r, amp, colr, a;
  var modAmp = [];
  for (mx = 0; mx < COLS * ROWS; mx++) modAmp.push(0.12);
  /* each cable's voice lights the module its far end plugs into */
  for (i = 0; i < NCABLES; i++) {
    var mod = SOCKETS[ends[i].b].my * COLS + SOCKETS[ends[i].b].mx;
    modAmp[mod] = Math.max(modAmp[mod], voiceAmp(i, t));
  }
  for (mx = 0; mx < COLS; mx++) {
    for (my = 0; my < ROWS; my++) {
      m = moduleRect(g, mx, my);
      ctx.fillStyle = PANEL;
      ctx.fillRect(m.x, m.y, m.w, m.h);
      ctx.strokeStyle = PANEL_LINE;
      ctx.lineWidth = 1;
      ctx.strokeRect(m.x + 0.5, m.y + 0.5, m.w - 1, m.h - 1);
      /* corner screws */
      ctx.fillStyle = '#3A3A40';
      var sr = Math.max(1.5, m.w * 0.02);
      var so = Math.max(4, m.w * 0.045);
      ctx.beginPath(); ctx.arc(m.x + so, m.y + so, sr, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(m.x + m.w - so, m.y + so, sr, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(m.x + so, m.y + m.h - so, sr, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(m.x + m.w - so, m.y + m.h - so, sr, 0, TAU); ctx.fill();
      /* module number, dim */
      ctx.fillStyle = 'rgba(237,237,232,0.28)';
      ctx.font = Math.max(8, m.w * 0.07) + 'px monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(('0' + (my * COLS + mx + 1)).slice(-2), m.x + m.w * 0.06, m.y + m.h * 0.05);
      /* two LEDs along the top edge, breathing with the voices patched here */
      amp = modAmp[my * COLS + mx];
      for (lx = 0; lx < 2; lx++) {
        colr = lx === 0 ? LED_RED : LED_GREEN;
        var lxp = m.x + m.w * (0.68 + lx * 0.16);
        var lyp = m.y + m.h * 0.10;
        var lr = Math.max(2.5, m.w * 0.028);
        a = 0.25 + 0.75 * amp * (lx === 0 ? 1 : 0.85 + 0.15 * Math.sin(TAU * t / 4.7 + my));
        ctx.fillStyle = rgba(colr, a);
        ctx.beginPath();
        ctx.arc(lxp, lyp, lr, 0, TAU);
        ctx.fill();
        ctx.fillStyle = rgba(colr, 0.18 * a);
        ctx.beginPath();
        ctx.arc(lxp, lyp, lr * 2.1, 0, TAU);
        ctx.fill();
      }
      /* sockets */
      r = socketRadius(g);
      for (s = 0; s < 4; s++) {
        p = socketPos(g, mx * (ROWS * 4) + my * 4 + s);
        ctx.fillStyle = SOCKET_RING;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, TAU);
        ctx.fill();
        ctx.fillStyle = SOCKET_HOLE;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 0.62, 0, TAU);
        ctx.fill();
      }
    }
  }
}
function cablePath(p0, p1, slack) {
  /* bezier with slack: control points hang below the chord */
  var dx = p1.x - p0.x, dy = p1.y - p0.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var sag = slack * dist * 0.28 + dist * 0.06;
  var mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
  return {
    c0: { x: p0.x + dx * 0.18, y: p0.y + dy * 0.18 + sag * 0.55 },
    c1: { x: p1.x - dx * 0.18, y: p1.y - dy * 0.18 + sag * 0.55 },
    mid: { x: mx, y: my + sag * 0.75 }
  };
}
function drawCables(sc, g, t, ends) {
  var lw = Math.max(3, Math.min(g.mw, g.mh) * 0.045);
  var r = socketRadius(g);
  for (i = 0; i < NCABLES; i++) {
    var p0 = socketPos(g, ends[i].a);
    var p1 = socketPos(g, ends[i].b);
    if (drag && drag.cable === i) {
      if (drag.end === 'b') p1 = { x: drag.x, y: drag.y };
      else p0 = { x: drag.x, y: drag.y };
    }
    var path = cablePath(p0, p1, 1);
    var amp = voiceAmp(i, t);
    ctx.lineCap = 'round';
    /* dark under-stroke so cables read against the panels */
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = lw + 2.5;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.bezierCurveTo(path.c0.x, path.c0.y, path.c1.x, path.c1.y, p1.x, p1.y);
    ctx.stroke();
    ctx.strokeStyle = CABLES[i].color;
    ctx.globalAlpha = 0.55 + 0.45 * amp;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.bezierCurveTo(path.c0.x, path.c0.y, path.c1.x, path.c1.y, p1.x, p1.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
    /* plugs at both ends */
    ctx.fillStyle = CABLES[i].color;
    ctx.beginPath(); ctx.arc(p0.x, p0.y, r * 0.85, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(p1.x, p1.y, r * 0.85, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.arc(p0.x, p0.y, r * 0.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(p1.x, p1.y, r * 0.4, 0, TAU); ctx.fill();

function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Meadow').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Meadow').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 25').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Meadow', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 25', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag a cable to re-patch.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, soundPlate.x + 12, soundPlate.y + 7);
}
/* ---- sound: closed-form drone model, real WebAudio only after a tap ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try { audioCtx = new AudioContext(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function startDrone(ac) {
  if (droneNodes) return;
  try {
    var g = ac.createGain();
    g.gain.value = 0.016;
    g.connect(ac.destination);
    var oscs = [];
    var v;
    for (v = 0; v < 3; v++) {
      var o = ac.createOscillator();
      o.type = 'sine';
      o.frequency.value = voiceFreq(v * 2, phaseT);
      o.connect(g);
      o.start();
      oscs.push(o);

function stopDrone() {
  if (!droneNodes) return;

    var v;
    for (v = 0; v < droneNodes.oscs.length; v++) droneNodes.oscs[v].stop();
    droneNodes.g.disconnect();

}
function retuneDrone() {
  if (!droneNodes || !soundOn) return;

    var ac = audioCtx;
    var now = ac.currentTime;
    var v;
    for (v = 0; v < 3; v++) {

function maybeRetune(t) {

  var cyc = Math.floor(t / CYCLE);

}
function draw() {
  size();
  var sc = sceneRect();
  var t = phaseT;
  var g = rackGeom(sc);
  var ends = routingAt(t);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawModules(sc, g, t, ends);

function pointerPos(ev) {
  var rect = { left: 0, top: 0 };
  try { rect = canvas.getBoundingClientRect(); } catch (e) {}
  return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
}
function nearestCableEnd(x, y, ends) {
  var g = rackGeom(sceneRect());
  var best = null, bestD = 22;
  var ci, e, p, d;
  for (ci = 0; ci < NCABLES; ci++) {
    for (e = 0; e < 2; e++) {
      p = socketPos(g, e === 0 ? ends[ci].a : ends[ci].b);

  return best;
}
function nearestSocket(x, y, exclude) {
  var g = rackGeom(sceneRect());
  var best = -1, bestD = 26;
  var s, p, d;
  for (s = 0; s < NSOCKETS; s++) {
    if (s === exclude) continue;
    p = socketPos(g, s);
    d = Math.sqrt((x - p.x) * (x - p.x) + (y - p.y) * (y - p.y));
    if (d < bestD) { bestD = d; best = s; }

}
function onPointerDown(ev) {
  var pos = pointerPos(ev);
  var ends = routingAt(phaseT);
  var hit = nearestCableEnd(pos.x, pos.y, ends);

    drag = { cable: hit.cable, end: hit.end, x: pos.x, y: pos.y };

    draw();

}
function onPointerMove(ev) {
  if (!drag) return;
  var pos = pointerPos(ev);
  drag.x = pos.x; drag.y = pos.y;
  draw();
}
function onPointerUp(ev) {
  if (drag) {
    var pos = pointerPos(ev);
    var ends = routingAt(phaseT);
    var other = drag.end === 'a' ? ends[drag.cable].b : ends[drag.cable].a;
    var target = nearestSocket(pos.x, pos.y, other);
    if (target >= 0 && target !== ends[drag.cable][drag.end]) {
