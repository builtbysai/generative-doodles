<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Festival of the Ugly</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #e8c9a8; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded PRNG (mulberry32), never Math.random ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(rng() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // ---------- palette (prompt only) ----------
  var SKY = '#e8c9a8', STONE = '#c9bfae';
  var SCARLET = '#c1272d', GOLD = '#d9a441', TEAL = '#2e6f6a',
      PLUM = '#5b2a4a', IVORY = '#f2ead8', INK = '#1a1a1a';

  // ---------- timing ----------
  var SLOT = 8, FIGURES = 5, TROPHY = 2, LOOP = FIGURES * SLOT + TROPHY; // 42 s
  var BASE_SEED = 1458000;

  // Recorded tap events: {time} in piece seconds. Tap reseeds the order of
  // figures not yet started in the current loop; it never pauses a figure.
  var taps = [];

  function orderAt(t) {
    var loop = Math.floor(t / LOOP);
    var lt = t - loop * LOOP;
    var order = shuffle([0, 1, 2, 3, 4], mulberry32(BASE_SEED + loop * 7919));
    var tapIdx = 0, k;
    for (k = 0; k < taps.length; k++) {
      var tp = taps[k];
      if (Math.floor(tp.time / LOOP) !== loop) continue;
      var tapLocal = tp.time - loop * LOOP;
      if (tapLocal > lt) continue;
      var started = Math.floor(tapLocal / SLOT) + 1; // figures already walking/bowing
      if (started >= FIGURES) continue;
      var rng = mulberry32(BASE_SEED + loop * 7919 + tapIdx * 104729 + Math.floor(tapLocal * 1000));
      var rest = shuffle(order.slice(started), rng);
      order = order.slice(0, started).concat(rest);
      tapIdx++;
    }
    return order;
  }

  // ---------- sizing ----------
  var W = 0, H = 0, S = 1, isPhone = false;
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    if (!W || !H) { W = 1280; H = 900; }
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    S = Math.min(W, H) / 720;
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    var minDim = sw ? Math.min(sw.width, sw.height) : Math.min(W, H);
    isPhone = minDim < 700 || (H > W * 1.15);
  }
  size();

  // ---------- figure drawing ----------
  // Every shape gets its own beginPath (node-canvas batched-arc quirk).
  function disc(x, y, r, color) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
  }
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
  }
  function poly(pts, color) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }

  // Figure specs: distinct accessories, dignified flat costume silhouettes.
  // draw(ctx, x, y, s, walk, bow) where (x,y) is the figure's ground point,
  // s its height in px, walk in [0,1) leg phase, bow in [0,1] bow amount.
  var FIGS = [
    { // dwarf: short, plum, tall pointed hat
      h: 0.62, coat: PLUM, skin: IVORY,
      draw: function (x, y, s, walk, bow) {
        var leg = Math.sin(walk * Math.PI * 2) * s * 0.03;
        rect(x - s * 0.10, y - s * 0.22, s * 0.08, s * 0.22 + leg * 0.3, INK);
        rect(x + s * 0.02, y - s * 0.22, s * 0.08, s * 0.22 - leg * 0.3, INK);
        poly([[x - s * 0.16, y - s * 0.22], [x + s * 0.16, y - s * 0.22],
              [x + s * 0.11, y - s * 0.52], [x - s * 0.11, y - s * 0.52]], PLUM);
        poly([[x - s * 0.08, y - s * 0.62], [x + s * 0.08, y - s * 0.62],
              [x, y - s * 0.86]], GOLD); // tall pointed hat
        disc(x, y - s * 0.57, s * 0.075, IVORY);
        disc(x - s * 0.025, y - s * 0.58, s * 0.008, INK);
        disc(x + s * 0.025, y - s * 0.58, s * 0.008, INK);
      }
    },
    { // bearded lady: scarlet gown, ivory beard
      h: 1.0, coat: SCARLET, skin: IVORY,
      draw: function (x, y, s, walk, bow) {
        var leg = Math.sin(walk * Math.PI * 2) * s * 0.03;
        rect(x - s * 0.07, y - s * 0.18, s * 0.06, s * 0.18 + leg * 0.3, INK);
        rect(x + s * 0.01, y - s * 0.18, s * 0.06, s * 0.18 - leg * 0.3, INK);
        poly([[x - s * 0.20, y - s * 0.18], [x + s * 0.20, y - s * 0.18],
              [x + s * 0.10, y - s * 0.62], [x - s * 0.10, y - s * 0.62]], SCARLET);
        disc(x, y - s * 0.70, s * 0.09, IVORY);
        // beard: ivory strands below the chin
        rect(x - s * 0.06, y - s * 0.62, s * 0.03, s * 0.16, IVORY);
        rect(x - s * 0.01, y - s * 0.62, s * 0.03, s * 0.20, IVORY);
        rect(x + s * 0.04, y - s * 0.62, s * 0.03, s * 0.14, IVORY);
        disc(x - s * 0.03, y - s * 0.71, s * 0.008, INK);
        disc(x + s * 0.03, y - s * 0.71, s * 0.008, INK);
      }
    },
    { // two-headed figure: teal, two heads side by side
      h: 1.0, coat: TEAL, skin: IVORY,
      draw: function (x, y, s, walk, bow) {
        var leg = Math.sin(walk * Math.PI * 2) * s * 0.03;
        rect(x - s * 0.08, y - s * 0.20, s * 0.07, s * 0.20 + leg * 0.3, INK);
        rect(x + s * 0.01, y - s * 0.20, s * 0.07, s * 0.20 - leg * 0.3, INK);
        poly([[x - s * 0.15, y - s * 0.20], [x + s * 0.15, y - s * 0.20],
              [x + s * 0.11, y - s * 0.58], [x - s * 0.11, y - s * 0.58]], TEAL);
        disc(x - s * 0.09, y - s * 0.66, s * 0.075, IVORY);
        disc(x + s * 0.09, y - s * 0.66, s * 0.075, IVORY);
        disc(x - s * 0.115, y - s * 0.67, s * 0.008, INK);
        disc(x - s * 0.065, y - s * 0.67, s * 0.008, INK);
        disc(x + s * 0.065, y - s * 0.67, s * 0.008, INK);
        disc(x + s * 0.115, y - s * 0.67, s * 0.008, INK);
      }
    },
    { // punk in leather: plum coat, gold spikes
      h: 1.0, coat: PLUM, skin: IVORY,
      draw: function (x, y, s, walk, bow) {
        var leg = Math.sin(walk * Math.PI * 2) * s * 0.03;
        rect(x - s * 0.08, y - s * 0.20, s * 0.07, s * 0.20 + leg * 0.3, INK);
        rect(x + s * 0.01, y - s * 0.20, s * 0.07, s * 0.20 - leg * 0.3, INK);
        poly([[x - s * 0.14, y - s * 0.20], [x + s * 0.14, y - s * 0.20],
              [x + s * 0.10, y - s * 0.58], [x - s * 0.10, y - s * 0.58]], PLUM);
        // mohawk spikes in gold
        poly([[x - s * 0.06, y - s * 0.72], [x - s * 0.03, y - s * 0.86], [x, y - s * 0.72]], GOLD);
        poly([[x, y - s * 0.72], [x + s * 0.03, y - s * 0.88], [x + s * 0.06, y - s * 0.72]], GOLD);
        disc(x, y - s * 0.66, s * 0.08, IVORY);
        disc(x - s * 0.028, y - s * 0.67, s * 0.008, INK);
        disc(x + s * 0.028, y - s * 0.67, s * 0.008, INK);
        // shoulder spikes
        poly([[x - s * 0.16, y - s * 0.52], [x - s * 0.22, y - s * 0.62], [x - s * 0.10, y - s * 0.56]], GOLD);
        poly([[x + s * 0.16, y - s * 0.52], [x + s * 0.22, y - s * 0.62], [x + s * 0.10, y - s * 0.56]], GOLD);
      }
    },
    { // giant: tall, gold, broad shoulders
      h: 1.35, coat: GOLD, skin: IVORY,
      draw: function (x, y, s, walk, bow) {
        var leg = Math.sin(walk * Math.PI * 2) * s * 0.03;
        rect(x - s * 0.09, y - s * 0.26, s * 0.08, s * 0.26 + leg * 0.3, INK);
        rect(x + s * 0.01, y - s * 0.26, s * 0.08, s * 0.26 - leg * 0.3, INK);
        poly([[x - s * 0.20, y - s * 0.26], [x + s * 0.20, y - s * 0.26],
              [x + s * 0.14, y - s * 0.72], [x - s * 0.14, y - s * 0.72]], GOLD);
        disc(x, y - s * 0.82, s * 0.10, IVORY);
        disc(x - s * 0.035, y - s * 0.83, s * 0.009, INK);
        disc(x + s * 0.035, y - s * 0.83, s * 0.009, INK);
      }
    }
  ];

  function drawBunny(x, y, s, raise) {
    // Large ivory bunny-costume figure on the dais, holding a gold trophy.
    // raise in [0,1]: trophy lifted high at loop end.
    var armY = y - s * 0.55 - raise * s * 0.22;
    rect(x - s * 0.09, y - s * 0.26, s * 0.08, s * 0.26, INK);
    rect(x + s * 0.01, y - s * 0.26, s * 0.08, s * 0.26, INK);
    poly([[x - s * 0.18, y - s * 0.26], [x + s * 0.18, y - s * 0.26],
          [x + s * 0.12, y - s * 0.62], [x - s * 0.12, y - s * 0.62]], IVORY);
    // long ears
    ctx.beginPath(); ctx.moveTo(x - s * 0.05, y - s * 0.72);
    ctx.ellipse(x - s * 0.05, y - s * 0.86, s * 0.035, s * 0.14, -0.15, 0, Math.PI * 2);
    ctx.fillStyle = IVORY; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + s * 0.05, y - s * 0.72);
    ctx.ellipse(x + s * 0.05, y - s * 0.86, s * 0.035, s * 0.14, 0.15, 0, Math.PI * 2);
    ctx.fillStyle = IVORY; ctx.fill();
    disc(x, y - s * 0.70, s * 0.09, IVORY);
    disc(x - s * 0.03, y - s * 0.71, s * 0.009, INK);
    disc(x + s * 0.03, y - s * 0.71, s * 0.009, INK);
    // raised arm + trophy
    rect(x + s * 0.10, armY, s * 0.05, s * 0.30, IVORY);
    var tx = x + s * 0.125, ty = armY - s * 0.10;
    poly([[tx - s * 0.07, ty], [tx + s * 0.07, ty],
          [tx + s * 0.04, ty - s * 0.10], [tx - s * 0.04, ty - s * 0.10]], GOLD);
    rect(tx - s * 0.012, ty, s * 0.024, s * 0.06, GOLD);
    rect(tx - s * 0.05, ty + s * 0.06, s * 0.10, s * 0.015, GOLD);
    if (raise > 0.5) {
      // small gold sparkles around the trophy while raised
      disc(tx - s * 0.12, ty - s * 0.12, s * 0.012, GOLD);
      disc(tx + s * 0.13, ty - s * 0.08, s * 0.010, GOLD);
      disc(tx + s * 0.02, ty - s * 0.20, s * 0.011, GOLD);
    }
  }

  // ---------- scene ----------
  function draw(t) {
    size();
    // sky + square
    rect(0, 0, W, H * 0.62, SKY);
    rect(0, H * 0.62, W, H * 0.38, STONE);
    // dais at upper right
    var dx = W * 0.80, dy = H * 0.42;
    rect(dx - W * 0.09, dy, W * 0.18, H * 0.06, PLUM);
    rect(dx - W * 0.10, dy + H * 0.06, W * 0.20, H * 0.015, GOLD);

    var loop = Math.floor(t / LOOP);
    var lt = t - loop * LOOP;
    var order = orderAt(t);
    var trophyRaise = 0;
    if (lt >= FIGURES * SLOT) {
      var rt = (lt - FIGURES * SLOT) / TROPHY;
      trophyRaise = rt < 0.25 ? rt / 0.25 : (rt > 0.75 ? (1 - rt) / 0.25 : 1);
    }

    // one figure at a time: slot k walks in, bows at the dais, exits right
    var startX = W * 0.06, startY = H * 0.90;
    var daisX = dx - W * 0.16, daisY = H * 0.62; // approach point, ground line
    var exitX = W * 1.08, exitY = H * 0.52;
    for (var k = 0; k < FIGURES; k++) {
      var slotT = lt - k * SLOT;
      if (slotT < 0 || slotT >= SLOT) continue;
      var fig = FIGS[order[k]];
      var baseH = H * 0.30 * fig.h;
      var x, y, bow = 0, walk = slotT / SLOT;
      if (slotT < 4) {
        // walk in: diagonal from lower left toward the dais, shrinking as it recedes
        var p = slotT / 4, e = p * p * (3 - 2 * p);
        x = startX + (daisX - startX) * e;
        y = startY + (daisY - startY) * e;
        var sc = 1 - 0.2 * e;
        x = Math.max(x, baseH * sc * 0.24); // keep the entering figure inside the frame on narrow phones
        drawFigure(fig, x, y, baseH * sc, walk, 0);
      } else if (slotT < 6) {
        // bow at the dais
        var bp = (slotT - 4) / 2;
        bow = bp < 0.5 ? bp * 2 : (1 - bp) * 2;
        drawFigure(fig, daisX, daisY, baseH * 0.8, walk, bow);
      } else {
        // exit to the right
        var q = (slotT - 6) / 2, eq = q * q * (3 - 2 * q);
        x = daisX + (exitX - daisX) * eq;
        y = daisY + (exitY - daisY) * eq;
        drawFigure(fig, x, y, baseH * 0.8, walk, 0);
      }
    }

    // bunny on the dais, large
    drawBunny(dx, dy, H * 0.34, trophyRaise);
  }

  function drawFigure(fig, x, y, s, walk, bow) {
    ctx.save();
    ctx.translate(x, y);
    if (bow > 0) ctx.rotate(bow * 0.28); // bow forward toward the dais
    ctx.translate(-x, -y);
    fig.draw(x, y, s, walk, bow);
    ctx.restore();
  }

  // ---------- interaction: tap reseeds the order, never pauses ----------
  function onTap() {
    taps.push({ time: currentT });
  }
  var currentT = 0;
  var startTime = null;
  function loopFn(now) {
    if (startTime === null) startTime = now;
    currentT = (now - startTime) / 1000;
    draw(currentT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn);
  }

  // pointer: tap anywhere (pointerup without much movement)
  var downX = 0, downY = 0;
  canvas.addEventListener('pointerdown', function (e) {
    downX = e.clientX; downY = e.clientY;
  });
  canvas.addEventListener('pointerup', function (e) {
    var dxm = e.clientX - downX, dym = e.clientY - downY;
    if (dxm * dxm + dym * dym < 144) onTap();
  });

  if (typeof window !== 'undefined') {
    window.addEventListener('resize', function () { size(); draw(currentT); });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(currentT); });
    }
  }

  // QA probe hooks (harmless in the browser)
  if (typeof window !== 'undefined') {
    window.__piece = {
      drawAt: function (tt) { currentT = tt; draw(tt); },
      tapAt: function (tt) { taps.push({ time: tt }); },
      orderAt: orderAt,
      loopSeconds: LOOP,
      getTaps: function () { return taps.slice(); }
    };
  }

  // frame one is a constant phase: draw(0) synchronously at load
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn);
})();
</script>
</body>
</html>
