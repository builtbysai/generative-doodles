<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.339 Puffy</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4EFE3; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.339 Puffy (myclayco). After their Oct 2026 puffy
// fridge frames: a gingerbread-man-ish blob outline that
// inflates into a dome and deflates on a seamless 16s
// loop, shaded with stepped flat bands, never a smooth
// gradient. The dome is thresholded distance data only:
// a signed distance field of the one profile is computed
// once as JS data on a fixed grid (point-to-segment
// distance, ray-cast sign). Each frame the field is
// resampled through the inflation scale (an exact uniform
// scale remap about the form centre), the drag dent adds
// a gaussian depression to the same field, and the field
// is classified into exactly 4 flat bands: the lit
// terracotta face plus 3 flat shadow steps. No radial
// gradient, no shadowBlur, no offscreen layer, one canvas.
// Exactly ONE large puffy form and exactly ONE small flat
// cutter outline of the same profile in the corner. The
// loop is inflate 5.6s + hold 4.8s + deflate 5.6s = 16s;
// at rest (no dent) frame 16s is pixel-identical to
// frame 0, and the dent springs back fully on release so
// no leftover dent ever breaks the seam. The clock is
// offset so frame one is already mid-inflate.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F4EFE3', TERRA = '#C25E3C', INK = '#1C1A17';
// Exactly 4 bands, asserted: lit face + 3 shadow steps,
// ordered deepest-interior first.
var BANDS = [TERRA, '#A84E30', '#8F4028', '#76331F'];
if (BANDS.length !== 4) throw new Error('Puffy needs exactly 4 bands');
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;

// ---- the one profile: hand-wobbled blob anchors ----------
// Gingerbread-man-ish: round head, stubby arms angled
// down-out, two legs with a crotch notch. Anchors are
// authored with slight human wobble, never clean beziers;
// a Catmull-Rom spline through them is sampled as
// polyline path data.
var CX = 640, CY = 450;
var ANCH = [
  [0, -300], [70, -286], [121, -244], [136, -180],
  [111, -141], [186, -121], [246, -60], [256, 1],
  [240, 46], [170, 20], [156, 91], [150, 171],
  [141, 251], [136, 300], [80, 306], [55, 219],
  [0, 201], [-55, 219], [-80, 306], [-136, 300],
  [-141, 251], [-150, 171], [-156, 91], [-170, 20],
  [-240, 46], [-256, 1], [-246, -60], [-186, -121],
  [-111, -141], [-136, -180], [-121, -244], [-70, -286]
];
var FORMS = [{ cx: CX, cy: CY }];           // the one large form
if (FORMS.length !== 1) throw new Error('Puffy needs exactly one form');
var CUTTERS = [{ cx: 1122, cy: 750, k: 0.16 }]; // the one cutter outline
if (CUTTERS.length !== 1) throw new Error('Puffy needs exactly one cutter');

var PTS = [];
(function () {
  var SUB = 6, n = ANCH.length;
  for (var i = 0; i < n; i++) {
    var p0 = ANCH[(i + n - 1) % n], p1 = ANCH[i];
    var p2 = ANCH[(i + 1) % n], p3 = ANCH[(i + 2) % n];
    for (var j = 0; j < SUB; j++) {
      var u = j / SUB, u2 = u * u, u3 = u2 * u;
      var x = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u +
        (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 +
        (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3);
      var y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u +
        (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 +
        (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3);
      PTS.push([CX + x, CY + y]);
    }
  }
})();

// ---- base signed distance field, computed once -----------
// Grid over the area the inflated form can reach, mapped
// back through the smallest inflation scale. Distance is
// the min point-to-segment distance to the profile
// polyline; the sign comes from an even-odd ray cast.
var GX0 = 180, GY0 = -60, GSTEP = 8, GNX = 116, GNY = 128;
var base = new Float32Array(GNX * GNY);
function segDist(px, py, ax, ay, bx, by) {
  var dx = bx - ax, dy = by - ay;
  var l2 = dx * dx + dy * dy;
  var t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  var qx = ax + t * dx - px, qy = ay + t * dy - py;
  return Math.sqrt(qx * qx + qy * qy);
}
function insidePoly(px, py) {
  var inside = false, n = PTS.length;
  for (var i = 0, j = n - 1; i < n; j = i++) {
    var xi = PTS[i][0], yi = PTS[i][1];
    var xj = PTS[j][0], yj = PTS[j][1];
    if ((yi > py) !== (yj > py) &&
        px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
(function () {
  var n = PTS.length;
  for (var gy = 0; gy < GNY; gy++) {
    for (var gx = 0; gx < GNX; gx++) {
      var px = GX0 + gx * GSTEP, py = GY0 + gy * GSTEP;
      var d = Infinity;
      for (var i = 0; i < n; i++) {
        var a = PTS[i], b = PTS[(i + 1) % n];
        var dd = segDist(px, py, a[0], a[1], b[0], b[1]);
        if (dd < d) d = dd;
      }
      base[gy * GNX + gx] = insidePoly(px, py) ? -d : d;
    }
  }
})();
function baseDist(x, y) {
  var fx = (x - GX0) / GSTEP, fy = (y - GY0) / GSTEP;
  fx = fx < 0 ? 0 : (fx > GNX - 1.001 ? GNX - 1.001 : fx);
  fy = fy < 0 ? 0 : (fy > GNY - 1.001 ? GNY - 1.001 : fy);
  var ix = Math.floor(fx), iy = Math.floor(fy);
  var tx = fx - ix, ty = fy - iy;
  var a = base[iy * GNX + ix], b = base[iy * GNX + ix + 1];
  var c = base[(iy + 1) * GNX + ix], d = base[(iy + 1) * GNX + ix + 1];
  return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
}

// ---- the 16s loop ----------------------------------------
// Inflate 5.6s, hold 4.8s, deflate 5.6s: exactly 16s, so
// frame 16000ms is pixel-identical to frame 0.
var PH_IN = 5600, PH_HOLD = 4800, PH_OUT = 5600, LOOP = 16000;
if (PH_IN + PH_HOLD + PH_OUT !== LOOP) throw new Error('Puffy phases must sum to 16s');
var OFFSET = 2800; // frame one is mid-inflate
function ease(u) { return 0.5 - 0.5 * Math.cos(Math.PI * u); }
function inflateK(t) {
  if (t < PH_IN) return ease(t / PH_IN);
  if (t < PH_IN + PH_HOLD) return 1;
  return ease(1 - (t - PH_IN - PH_HOLD) / PH_OUT);
}

// ---- drag dent: a gaussian in the same field -------------
var dentAmp = 0, dentX = CX, dentY = CY, dragging = false;
var DENT_MAX = 55, DENT_SIG = 60;
function dentAt(x, y) {
  if (dentAmp < 0.01) return 0;
  var dx = x - dentX, dy = y - dentY;
  var d2 = dx * dx + dy * dy, r = 3 * DENT_SIG;
  if (d2 > r * r) return 0;
  return dentAmp * Math.exp(-d2 / (2 * DENT_SIG * DENT_SIG));
}

// ---- drawing ----------------------------------------------
// Output cells over the form region, 5 design px each.
// Horizontal runs of one band merge into a single rect.
var OX0 = 300, OY0 = 55, OSTEP = 5, ONX = 136, ONY = 158;
function drawBands(s, depth) {
  var b3 = -0.22 * depth, b2 = -0.48 * depth, b1 = -0.78 * depth;
  for (var j = 0; j < ONY; j++) {
    var yc = OY0 + (j + 0.5) * OSTEP;
    var qy = CY + (yc - CY) / s;
    var runBand = -1, runStart = 0;
    for (var i = 0; i <= ONX; i++) {
      var band = -1;
      if (i < ONX) {
        var xc = OX0 + (i + 0.5) * OSTEP;
        var qx = CX + (xc - CX) / s;
        var d = s * baseDist(qx, qy) + dentAt(xc, yc);
        if (d < 0) band = d < b1 ? 0 : (d < b2 ? 1 : (d < b3 ? 2 : 3));
      }
      if (band !== runBand) {
        if (runBand >= 0) {
          ctx.fillStyle = BANDS[runBand];
          ctx.fillRect(OX0 + runStart * OSTEP, OY0 + j * OSTEP,
            (i - runStart) * OSTEP + 0.8, OSTEP + 0.8);
        }
        runBand = band; runStart = i;
      }
    }
  }
}
function strokeProfile(cx, cy, k, lw) {
  ctx.strokeStyle = INK;
  ctx.lineWidth = lw;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (var i = 0; i < PTS.length; i++) {
    var x = cx + (PTS[i][0] - CX) * k, y = cy + (PTS[i][1] - CY) * k;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
}
function draw(t) {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, DW, DH);
  var k = inflateK(t);
  var s = 0.80 + 0.20 * k;        // outline scale
  var depth = 46 + 40 * k;        // dome depth: band reach
  drawBands(s, depth);
  strokeProfile(FORMS[0].cx, FORMS[0].cy, s, 5);
  strokeProfile(CUTTERS[0].cx, CUTTERS[0].cy, CUTTERS[0].k, 4.5);
}

// ---- interaction: drag dents, no tap action ---------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dentX = p[0]; dentY = p[1]; dragging = true;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  dentX = p[0]; dentY = p[1];
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', endDrag);

var lastNow = -1;
function frame(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  var dt = lastNow < 0 ? 0 : Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  // Dent spring: presses in fast while dragging, and on
  // release decays all the way to exactly zero, so the
  // loop seam is never broken by a leftover dent.
  var target = dragging ? DENT_MAX : 0;
  var rate = dragging ? 10 : 5.5;
  dentAmp = target + (dentAmp - target) * Math.exp(-rate * dt);
  if (!dragging && dentAmp < 0.25) dentAmp = 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  draw((now + OFFSET) % LOOP);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
