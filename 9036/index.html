<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9036 · Colonnade</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #efe6d4; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// №9036 · Colonnade (from seed 341, after lammetje_nl's Donuts And
// Windows discipline: one primitive, translucency as the only depth
// cue, flat saturated ground, tight palette, generous margin). Rows
// of overlapping translucent arches rise from a baseline like an
// aqueduct. The overlaps bloom into new hues. Click for a new
// colonnade.
"use strict";

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seedMatch = /[?&]seed=(-?\d+)/.exec(location.search);
let SEED = seedMatch ? (parseInt(seedMatch[1], 10) >>> 0) : 9036;
let rng = mulberry32(SEED);

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;

// tight palettes: [ground, arch hues...] (arches drawn with multiply
// so overlaps bloom
const PALETTES = [
  { ground: "#efe6d4", hues: ["#e4572e", "#f3a712", "#2e86ab", "#c32f4b"] },
  { ground: "#e9e2d0", hues: ["#1b9aaa", "#f2c14e", "#ef6351", "#5b8e7d"] },
  { ground: "#f0e9dc", hues: ["#6a4c93", "#f26430", "#2a9d8f", "#e9c46a"] },
];
let pal = null;
let arches = []; // {x, y(base), w, h, hue, row}

function archPath(x, yBase, w, h) {
  // an arch: two legs and a semicircular top (like ∩)
  const r = w / 2;
  ctx.beginPath();
  ctx.moveTo(x - w / 2, yBase);
  ctx.lineTo(x - w / 2, yBase - h + r);
  ctx.arc(x, yBase - h + r, r, Math.PI, 0);
  ctx.lineTo(x + w / 2, yBase);
  ctx.closePath();
}

function build() {
  pal = PALETTES[(rng() * PALETTES.length) | 0];
  arches = [];
  const margin = Math.min(W, H) * 0.1;
  const baseY = H - margin * 1.15;
  const rows = 3 + ((rng() * 2) | 0); // 3-4 rows
  for (let row = 0; row < rows; row++) {
    const depth = row / (rows - 1); // 0 = front, 1 = back
    const yB = baseY - depth * H * 0.16;
    const hBase = H * (0.34 - depth * 0.09);
    const wBase = hBase * (0.62 + rng() * 0.1);
    const n = 5 + ((rng() * 4) | 0);
    const span = W - margin * 2;
    for (let i = 0; i < n; i++) {
      const x = margin + (i + 0.5 + (rng() - 0.5) * 0.55) * (span / n);
      const w = wBase * (0.85 + rng() * 0.3);
      const h = hBase * (0.9 + rng() * 0.25);
      const hue = pal.hues[(rng() * pal.hues.length) | 0];
      arches.push({ x, yB, w, h, hue, depth });
    }
  }
  // a few small arches floating above, like clerestory windows
  const up = 2 + ((rng() * 3) | 0);
  for (let i = 0; i < up; i++) {
    arches.push({
      x: margin + rng() * (W - margin * 2),
      yB: baseY - H * (0.3 + rng() * 0.25),
      w: 40 + rng() * 60, h: 70 + rng() * 90,
      hue: pal.hues[(rng() * pal.hues.length) | 0],
      depth: 1,
    });
  }
}

function render() {
  ctx.fillStyle = pal.ground;
  ctx.fillRect(0, 0, W, H);
  // baseline: a single held line the composition sits on
  const margin = Math.min(W, H) * 0.1;
  ctx.strokeStyle = "rgba(40,32,24,0.55)";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(margin * 0.6, H - margin * 1.15);
  ctx.lineTo(W - margin * 0.6, H - margin * 1.15);
  ctx.stroke();
  // arches back-to-front, multiply so overlaps bloom
  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  const sorted = arches.slice().sort((a, b) => b.depth - a.depth);
  for (const a of sorted) {
    ctx.globalAlpha = 0.82;
    ctx.fillStyle = a.hue;
    archPath(a.x, a.yB, a.w, a.h);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  // captions
  ctx.fillStyle = "rgba(40,32,24,0.72)";
  ctx.font = "13px Georgia, serif";
  ctx.fillText("№9036 · Colonnade", 18, H - 18);
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(40,32,24,0.45)";
  ctx.font = "italic 13px Georgia, serif";
  ctx.fillText("click for a new colonnade", W - 18, H - 18);
  ctx.textAlign = "left";
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.floor(window.innerWidth); H = Math.floor(window.innerHeight);
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  build();
  render();
}
window.addEventListener("resize", resize);

cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  SEED = (Math.random() * 1e9) | 0;
  rng = mulberry32(SEED);
  build();
  render();
  try { history.replaceState(null, "", "?seed=" + SEED); } catch (err) { /* file:// */ }
});

resize();
</script>
</body>
</html>
