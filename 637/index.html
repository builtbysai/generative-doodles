<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Una Tarde de Verano</title>
<style>
  html, body { margin: 0; padding: 0; background: #10151C; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SEED = 637077;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette (strict, no more) ----------
  var GROUND = '#10151C', INK = '#2A3340', PETAL = '#C76B5E', MOUSE = '#8A8F96',
      SHELL = '#B09A72', FEATHER = '#4A5462', MOON = '#D9D4C5';

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function rgba(h, a) {
    var c = hexRgb(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function easeIO(x) { x = clamp01(x); return x * x * (3 - 2 * x); }

  // ---------- viewport ----------
  var W = 0, H = 0, DPR = 1, phone = false;
  function fit() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    var smin = (window.screen && window.screen.width) ? Math.min(window.screen.width, window.screen.height) : 0;
    phone = smin ? (smin < 700) : (H > W * 1.15);
  }
  function onResize() { fit(); draw(elapsed); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  // ---------- book model ----------
  // Pages: the three launch vignettes, then double-tap inserts reserve pages.
  var RESERVE = ['chick', 'foxkit', 'beetle'];
  var reserveIdx = 0;
  var insertCount = 0;

  function makePage(kind, seed) {
    var rng = mulberry32(seed);
    var borderOff = [], groundOff = [], i;
    for (i = 0; i < 144; i++) borderOff.push(rng() * 2 - 1);
    // gentle hand wobble, not zigzag: circular 3-tap smoothing
    var sm = [];
    for (i = 0; i < 144; i++) {
      sm.push((borderOff[(i + 143) % 144] + borderOff[i] * 2 + borderOff[(i + 1) % 144]) / 4);
    }
    borderOff = sm;
    for (i = 0; i < 25; i++) groundOff.push(rng() * 2 - 1);
    return { kind: kind, seed: seed, borderOff: borderOff, groundOff: groundOff, inserted: false };
  }

  var pages = [
    makePage('mouse', SEED + 11),
    makePage('cicada', SEED + 101),
    makePage('owl', SEED + 1009)
  ];
  var insertedPages = [];

  var cur = 0;          // settled page index
  var off = 0;          // fractional display offset (page units)
  var anim = null;      // {from, to, start, dur}

  // QA hook: ?seed=page2 / ?seed=page3 / ?seed=<reserve kind> forces a start page.
  (function () {
    var s = '';
    try { s = (typeof location !== 'undefined' && location.search) || ''; } catch (e) { s = ''; }
    var m = s.match(/seed=([a-z0-9]+)/);
    if (!m) return;
    var q = m[1];
    if (q === 'page2') { cur = 1; off = 1; }
    else if (q === 'page3') { cur = 2; off = 2; }
    else if (RESERVE.indexOf(q) >= 0) {
      var pg = makePage(q, SEED + 5000 + RESERVE.indexOf(q) * 131);
      pg.inserted = true;
      pages.splice(1, 0, pg);
      insertedPages.push(pg);
      insertCount = 1;
      cur = 1; off = 1;
    }
  })();

  function mod(n, m) { return ((n % m) + m) % m; }

  function insertReserve() {
    var kind = RESERVE[reserveIdx % RESERVE.length];
    reserveIdx++;
    if (insertCount < 3) {
      var pg = makePage(kind, SEED + 3000 + insertCount * 733 + reserveIdx * 17);
      pg.inserted = true;
      pages.splice(cur + 1, 0, pg);
      insertedPages.push(pg);
      insertCount++;
      goTo(cur + 1);
    } else {
      // Book is full: the last inserted page is redrawn as the next reserve subject.
      var last = insertedPages[insertedPages.length - 1];
      var fresh = makePage(kind, SEED + 3000 + 2900 + reserveIdx * 17);
      last.kind = fresh.kind;
      last.seed = fresh.seed;
      last.borderOff = fresh.borderOff;
      last.groundOff = fresh.groundOff;
      goTo(pages.indexOf(last));
    }
  }

  function goTo(target) {
    anim = { from: off, to: target, start: elapsed, dur: 0.45 };
  }

  // ---------- pointer: drag to turn, tap / double-tap ----------
  var dragging = false, dragStartX = 0, dragStartY = 0, dragBase = 0, dragDX = 0, downAt = 0;
  var lastTapAt = -10;

  function pageW() { return Math.max(1, W - 2 * (phone ? W * 0.045 : W * 0.06)); }

  function evtX(e) { return (e.clientX !== undefined) ? e.clientX : 0; }
  function evtY(e) { return (e.clientY !== undefined) ? e.clientY : 0; }

  function onDown(e) {
    dragging = true;
    dragStartX = evtX(e); dragStartY = evtY(e);
    dragBase = off; dragDX = 0;
    downAt = elapsed;
    anim = null;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    dragDX = evtX(e) - dragStartX;
    off = dragBase - dragDX / pageW();
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var adx = Math.abs(dragDX), ady = Math.abs(evtY(e) - dragStartY);
    var quick = (elapsed - downAt) < 0.35;
    if (adx < 10 && ady < 10 && quick) {
      // a tap: check for double-tap
      if (elapsed - lastTapAt < 0.38) {
        lastTapAt = -10;
        insertReserve();
      } else {
        lastTapAt = elapsed;
        goTo(cur);
      }
      return;
    }
    if (adx > pageW() * 0.16 && adx > ady) {
      goTo(dragDX < 0 ? dragBase + 1 : dragBase - 1);
    } else {
      goTo(cur);
    }
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---------- geometry helpers ----------
  function ell(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function circ(x, y, r) { ell(x, y, r, r, 0); }
  function line(x1, y1, x2, y2) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function tri(x1, y1, x2, y2, x3, y3) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); ctx.fill();
  }

  // wobbly horizontal ground line from a page's seeded offsets
  function groundPath(pg, gx1, gx2, gy, u) {
    var offs = pg.groundOff, n = offs.length - 1;
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var f = i / n;
      var x = gx1 + (gx2 - gx1) * f;
      var y = gy + offs[i] * u * 0.006;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }

  // hand-drawn border: walk the rect perimeter, jitter along the normal
  function drawBorder(pg, x0, y0, pw, ph, u) {
    var NB = pg.borderOff.length;
    var per = 2 * (pw + ph);
    ctx.beginPath();
    for (var i = 0; i <= NB; i++) {
      var s = (i % NB) / NB * per;
      var x, y, nx, ny;
      if (s < pw) { x = x0 + s; y = y0; nx = 0; ny = -1; }
      else if (s < pw + ph) { x = x0 + pw; y = y0 + (s - pw); nx = 1; ny = 0; }
      else if (s < 2 * pw + ph) { x = x0 + pw - (s - pw - ph); y = y0 + ph; nx = 0; ny = 1; }
      else { x = x0; y = y0 + ph - (s - 2 * pw - ph); nx = -1; ny = 0; }
      var o = pg.borderOff[i % NB] * u * 0.011;
      x += nx * o; y += ny * o;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = rgba(INK, 0.95);
    ctx.lineWidth = Math.max(1.1, u * 0.0038);
    ctx.stroke();
  }

  // ---------- the vignettes ----------
  // All subjects are small: scene width about 0.34u, subject in the lower-center third.

  function drawMouse(scx, gy, u, t) {
    var bob = Math.pow(Math.max(0, Math.sin(t * 3.7)), 12) * u * 0.0045;
    var swayX = Math.sin(t * 0.9) * u * 0.006;
    var swayY = Math.sin(t * 1.27) * u * 0.003;
    var cy = gy - u * 0.046;
    // tail
    ctx.strokeStyle = MOUSE;
    ctx.lineWidth = u * 0.007; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(scx - u * 0.062, gy - u * 0.030);
    ctx.quadraticCurveTo(scx - u * 0.135, gy - u * 0.002, scx - u * 0.112 + swayX, gy - u * 0.088 + swayY);
    ctx.stroke();
    // body
    ctx.fillStyle = MOUSE;
    ell(scx - u * 0.005, cy, u * 0.072, u * 0.044, 0);
    // feet
    ctx.strokeStyle = INK; ctx.lineWidth = u * 0.005;
    line(scx - u * 0.038, gy - u * 0.006, scx - u * 0.038, gy);
    line(scx + u * 0.030, gy - u * 0.006, scx + u * 0.030, gy);
    // head (nose twitch bobs it)
    var hx = scx + u * 0.060 + bob, hy = cy - u * 0.012 - bob * 0.4;
    ctx.fillStyle = MOUSE;
    circ(hx - u * 0.013, hy - u * 0.027, u * 0.015);
    circ(hx + u * 0.013, hy - u * 0.029, u * 0.0135);
    ctx.fillStyle = rgba(INK, 0.55);
    circ(hx - u * 0.013, hy - u * 0.027, u * 0.0075);
    circ(hx + u * 0.013, hy - u * 0.029, u * 0.0068);
    ctx.fillStyle = MOUSE;
    circ(hx, hy, u * 0.033);
    // eye + nose + whiskers
    ctx.fillStyle = INK;
    circ(hx + u * 0.013, hy - u * 0.004, u * 0.0045);
    circ(hx + u * 0.0315, hy + u * 0.006, u * 0.0042);
    ctx.strokeStyle = rgba(INK, 0.5); ctx.lineWidth = Math.max(0.7, u * 0.0018);
    line(hx + u * 0.028, hy + u * 0.004, hx + u * 0.052, hy - u * 0.004);
    line(hx + u * 0.028, hy + u * 0.008, hx + u * 0.052, hy + u * 0.012);
    // the tulip: stem, one ink leaf, three petals
    var tx = scx + u * 0.138, tTop = gy - u * 0.128;
    ctx.strokeStyle = INK; ctx.lineWidth = u * 0.0055; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tx, gy);
    ctx.quadraticCurveTo(tx - u * 0.006, gy - u * 0.06, tx + u * 0.004, tTop);
    ctx.stroke();
    ctx.fillStyle = rgba(INK, 0.9);
    ell(tx - u * 0.012, gy - u * 0.052, u * 0.017, u * 0.006, -0.6);
    function petal(px, py, w, h, ang, col) {
      ctx.save();
      ctx.translate(px, py); ctx.rotate(ang);
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-w, -h * 0.30, -w * 0.62, -h * 0.85, 0, -h);
      ctx.bezierCurveTo(w * 0.62, -h * 0.85, w, -h * 0.30, 0, 0);
      ctx.fill();
      ctx.restore();
    }
    petal(tx + u * 0.004, tTop, u * 0.015, u * 0.038, -0.48, rgba(PETAL, 0.85));
    petal(tx + u * 0.004, tTop, u * 0.015, u * 0.038, 0.48, rgba(PETAL, 0.85));
    petal(tx + u * 0.004, tTop, u * 0.016, u * 0.046, 0, PETAL);
  }

  function drawCicada(scx, gy, u, t) {
    var burst = Math.pow(0.5 + 0.5 * Math.sin(t * 1.19 + 1.7), 8);
    var tremor = Math.sin(t * 43.0) * u * 0.0013 * burst;
    // the twig (plant element) stands clear to the right; the cicada clings beside it
    var twX = scx + u * 0.064, twTop = gy - u * 0.270;
    ctx.strokeStyle = INK; ctx.lineWidth = u * 0.009; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(twX + u * 0.010, gy);
    ctx.quadraticCurveTo(twX - u * 0.002, gy - u * 0.13, twX - u * 0.006, twTop);
    ctx.stroke();
    ctx.fillStyle = rgba(INK, 0.9);
    ell(twX + u * 0.018, twTop + u * 0.026, u * 0.020, u * 0.0085, -0.55);
    ell(twX - u * 0.014, twTop + u * 0.062, u * 0.015, u * 0.0065, 0.5);
    // grass ticks at the base
    ctx.lineWidth = u * 0.0035;
    for (var g = -1; g <= 1; g++) {
      ctx.beginPath();
      ctx.moveTo(twX + g * u * 0.016, gy);
      ctx.quadraticCurveTo(twX + g * u * 0.020, gy - u * 0.014, twX + g * u * 0.028, gy - u * 0.024);
      ctx.stroke();
    }
    var cx = scx - u * 0.014 + tremor, cy = gy - u * 0.150;
    var rx = u * 0.047, ry = u * 0.088;
    // folded wings: translucent wedges rising behind the shoulders
    ctx.fillStyle = rgba(MOON, 0.34);
    tri(cx - u * 0.006, cy - u * 0.066, cx - u * 0.066, cy + u * 0.026, cx - u * 0.016, cy + u * 0.054);
    tri(cx + u * 0.010, cy - u * 0.066, cx + u * 0.058, cy + u * 0.034, cx + u * 0.018, cy + u * 0.054);
    // shell
    ctx.fillStyle = SHELL;
    ell(cx, cy, rx, ry, 0.05);
    // head, lifted clear of the shell
    ell(cx, cy - ry - u * 0.012, u * 0.034, u * 0.022, 0);
    ctx.fillStyle = INK;
    circ(cx - u * 0.019, cy - ry - u * 0.014, u * 0.005);
    circ(cx + u * 0.019, cy - ry - u * 0.014, u * 0.005);
    // segment arcs
    ctx.strokeStyle = rgba(INK, 0.55); ctx.lineWidth = u * 0.0035;
    for (var i = 0; i < 5; i++) {
      var fy = -0.62 + i * 0.31;
      var yy = cy + fy * ry;
      var w = rx * Math.sqrt(Math.max(0.05, 1 - fy * fy)) * 0.94;
      ctx.beginPath();
      ctx.moveTo(cx - w, yy);
      ctx.quadraticCurveTo(cx, yy + u * 0.009, cx + w, yy);
      ctx.stroke();
    }
    // legs: three reach right and grip the twig; two small ones brace left
    ctx.strokeStyle = INK; ctx.lineWidth = u * 0.0038;
    for (var l = 0; l < 3; l++) {
      var ly = cy - u * 0.028 + l * u * 0.040;
      ctx.beginPath();
      ctx.moveTo(cx + rx * 0.72, ly);
      ctx.quadraticCurveTo(cx + rx + u * 0.018, ly + u * 0.004, twX - u * 0.002, ly + u * 0.014);
      ctx.stroke();
    }
    line(cx - rx * 0.8, cy + u * 0.010, cx - rx - u * 0.016, cy + u * 0.034);
    line(cx - rx * 0.8, cy + u * 0.048, cx - rx - u * 0.013, cy + u * 0.070);
  }

  function drawOwl(scx, gy, u, t) {
    // low haiku-gray moon behind
    ctx.fillStyle = rgba(MOON, 0.92);
    circ(scx + u * 0.018, gy - u * 0.178, u * 0.100);
    // branch
    ctx.strokeStyle = INK; ctx.lineWidth = u * 0.008; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(scx - u * 0.170, gy + u * 0.004);
    ctx.quadraticCurveTo(scx, gy - u * 0.006, scx + u * 0.170, gy + u * 0.002);
    ctx.stroke();
    ctx.fillStyle = rgba(INK, 0.9);
    ell(scx - u * 0.128, gy - u * 0.016, u * 0.016, u * 0.006, 0.5);
    ell(scx + u * 0.142, gy - u * 0.012, u * 0.014, u * 0.0055, -0.4);
    // body
    var cx = scx, cy = gy - u * 0.088;
    ctx.fillStyle = FEATHER;
    tri(cx - u * 0.040, cy - u * 0.058, cx - u * 0.021, cy - u * 0.096, cx - u * 0.010, cy - u * 0.056);
    tri(cx + u * 0.040, cy - u * 0.058, cx + u * 0.021, cy - u * 0.096, cx + u * 0.010, cy - u * 0.056);
    ell(cx, cy, u * 0.060, u * 0.080, 0);
    // face disc
    ctx.fillStyle = rgba(MOON, 0.9);
    ell(cx, cy - u * 0.028, u * 0.040, u * 0.047, 0);
    // eyes: blink shut for 0.2 s in every 7 s
    var ph = t % 7;
    var open = (ph > 6.78) ? 0.12 : 1;
    ctx.fillStyle = INK;
    ell(cx - u * 0.017, cy - u * 0.032, u * 0.0075, u * 0.0075 * open, 0);
    ell(cx + u * 0.017, cy - u * 0.032, u * 0.0075, u * 0.0075 * open, 0);
    // beak
    tri(cx - u * 0.006, cy - u * 0.019, cx + u * 0.006, cy - u * 0.019, cx, cy - u * 0.008);
    // belly arcs + feet
    ctx.strokeStyle = rgba(INK, 0.35); ctx.lineWidth = u * 0.003;
    ctx.beginPath(); ctx.arc(cx - u * 0.016, cy + u * 0.036, u * 0.013, 0.3, Math.PI - 0.3); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + u * 0.016, cy + u * 0.036, u * 0.013, 0.3, Math.PI - 0.3); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = u * 0.004;
    line(cx - u * 0.020, gy - u * 0.004, cx - u * 0.020, gy + u * 0.003);
    line(cx + u * 0.020, gy - u * 0.004, cx + u * 0.020, gy + u * 0.003);
  }

  function drawChick(scx, gy, u, t) {
    // grass tuft (plant element)
    ctx.strokeStyle = INK; ctx.lineWidth = u * 0.0035; ctx.lineCap = 'round';
    for (var g = 0; g < 5; g++) {
      var bx = scx + u * 0.085 + g * u * 0.011;
      ctx.beginPath();
      ctx.moveTo(bx, gy);
      ctx.quadraticCurveTo(bx + u * 0.004, gy - u * 0.020, bx + (g - 2) * u * 0.006, gy - u * 0.034 - (g % 2) * u * 0.008);
      ctx.stroke();
    }
    var ph = t % 2.9;
    var dip = (ph < 0.55) ? Math.sin(ph / 0.55 * Math.PI) : 0;
    // legs
    ctx.lineWidth = u * 0.004;
    line(scx - u * 0.014, gy - u * 0.016, scx - u * 0.014, gy);
    line(scx + u * 0.016, gy - u * 0.016, scx + u * 0.016, gy);
    line(scx - u * 0.020, gy, scx - u * 0.008, gy);
    line(scx + u * 0.010, gy, scx + u * 0.022, gy);
    // body + tail
    ctx.fillStyle = MOON;
    tri(scx - u * 0.040, gy - u * 0.062, scx - u * 0.058, gy - u * 0.082, scx - u * 0.028, gy - u * 0.048);
    circ(scx, gy - u * 0.044, u * 0.044);
    // wing
    ctx.fillStyle = rgba(MOUSE, 0.5);
    ell(scx - u * 0.008, gy - u * 0.046, u * 0.020, u * 0.013, -0.3);
    // head, pecking
    var hx = scx + u * 0.036 + dip * u * 0.010, hy = gy - u * 0.080 + dip * u * 0.021;
    ctx.fillStyle = MOON;
    circ(hx, hy, u * 0.028);
    ctx.fillStyle = INK;
    tri(hx + u * 0.024, hy + dip * u * 0.006, hx + u * 0.040, hy + u * 0.004 + dip * u * 0.010, hx + u * 0.022, hy + u * 0.009 + dip * u * 0.006);
    circ(hx + u * 0.010, hy - u * 0.006, u * 0.0042);
  }

  function drawFoxkit(scx, gy, u, t) {
    // sprig (plant element)
    var sx = scx + u * 0.118;
    ctx.strokeStyle = INK; ctx.lineWidth = u * 0.004; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx, gy);
    ctx.quadraticCurveTo(sx + u * 0.006, gy - u * 0.045, sx + u * 0.002, gy - u * 0.088);
    ctx.stroke();
    ctx.fillStyle = rgba(INK, 0.9);
    ell(sx - u * 0.011, gy - u * 0.034, u * 0.014, u * 0.0055, -0.6);
    ell(sx + u * 0.013, gy - u * 0.058, u * 0.014, u * 0.0055, 0.6);
    ell(sx + u * 0.002, gy - u * 0.092, u * 0.012, u * 0.005, 0);
    // tail: big curve behind, moon tip
    ctx.fillStyle = FEATHER;
    ell(scx - u * 0.088, gy - u * 0.028, u * 0.052, u * 0.020, -0.45);
    ctx.fillStyle = MOON;
    ell(scx - u * 0.122, gy - u * 0.048, u * 0.020, u * 0.011, -0.45);
    // body
    ctx.fillStyle = FEATHER;
    ell(scx - u * 0.005, gy - u * 0.040, u * 0.068, u * 0.042, 0);
    ell(scx + u * 0.038, gy - u * 0.008, u * 0.016, u * 0.009, 0);
    ell(scx - u * 0.042, gy - u * 0.008, u * 0.016, u * 0.009, 0);
    // head
    var hx = scx + u * 0.052, hy = gy - u * 0.078;
    var ph = t % 4.3;
    var flick = (ph > 3.85) ? Math.sin((ph - 3.85) / 0.45 * Math.PI) * 0.45 : 0;
    ctx.fillStyle = FEATHER;
    tri(hx - u * 0.026, hy - u * 0.020, hx - u * 0.020, hy - u * 0.052, hx - u * 0.004, hy - u * 0.026);
    // flicking ear: tip swings by the flick angle
    var etx = hx + u * 0.020 + Math.sin(flick) * u * 0.030;
    var ety = hy - u * 0.026 - Math.cos(flick) * u * 0.028;
    tri(hx + u * 0.004, hy - u * 0.026, etx, ety, hx + u * 0.027, hy - u * 0.020);
    circ(hx, hy, u * 0.034);
    // muzzle + nose + eye
    ctx.fillStyle = MOON;
    ell(hx + u * 0.020, hy + u * 0.012, u * 0.016, u * 0.011, 0);
    ctx.fillStyle = INK;
    circ(hx + u * 0.033, hy + u * 0.009, u * 0.0042);
    circ(hx + u * 0.008, hy - u * 0.007, u * 0.0042);
  }

  function drawBeetle(scx, gy, u, t) {
    // the leaf it stands beside (plant element)
    ctx.fillStyle = rgba(INK, 0.85);
    ell(scx + u * 0.088, gy - u * 0.007, u * 0.056, u * 0.014, -0.12);
    ctx.strokeStyle = INK; ctx.lineWidth = u * 0.003;
    line(scx + u * 0.040, gy - u * 0.010, scx + u * 0.128, gy - u * 0.016);
    var bx = scx - u * 0.010, by = gy - u * 0.037;
    // legs
    ctx.lineWidth = u * 0.0038; ctx.lineCap = 'round';
    for (var l = 0; l < 3; l++) {
      var lx = bx - u * 0.026 + l * u * 0.026;
      line(lx, by + u * 0.020, lx - u * 0.010, gy);
      line(lx + u * 0.006, by + u * 0.024, lx + u * 0.014, gy);
    }
    // shell body
    ctx.fillStyle = SHELL;
    ell(bx, by, u * 0.050, u * 0.036, 0);
    // wing-case split
    ctx.strokeStyle = rgba(INK, 0.7); ctx.lineWidth = u * 0.003;
    line(bx - u * 0.046, by, bx + u * 0.038, by);
    ctx.beginPath(); ctx.arc(bx - u * 0.012, by, u * 0.030, 0.25, Math.PI - 0.25); ctx.stroke();
    // head + swaying antennae
    ctx.fillStyle = INK;
    circ(bx + u * 0.052, by + u * 0.002, u * 0.019);
    var s1 = Math.sin(t * 1.7) * u * 0.006, s2 = Math.sin(t * 1.7 + 1.3) * u * 0.006;
    ctx.strokeStyle = INK; ctx.lineWidth = u * 0.003;
    ctx.beginPath();
    ctx.moveTo(bx + u * 0.058, by - u * 0.012);
    ctx.quadraticCurveTo(bx + u * 0.072, by - u * 0.034, bx + u * 0.080 + s1, by - u * 0.042);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bx + u * 0.062, by - u * 0.008);
    ctx.quadraticCurveTo(bx + u * 0.080, by - u * 0.026, bx + u * 0.090 + s2, by - u * 0.030);
    ctx.stroke();
    // highlight
    ctx.fillStyle = rgba(MOON, 0.7);
    circ(bx - u * 0.018, by - u * 0.016, u * 0.005);
  }

  function drawSubject(kind, scx, gy, u, t) {
    if (kind === 'mouse') drawMouse(scx, gy, u, t);
    else if (kind === 'cicada') drawCicada(scx, gy, u, t);
    else if (kind === 'owl') drawOwl(scx, gy, u, t);
    else if (kind === 'chick') drawChick(scx, gy, u, t);
    else if (kind === 'foxkit') drawFoxkit(scx, gy, u, t);
    else if (kind === 'beetle') drawBeetle(scx, gy, u, t);
  }

  // ---------- draw ----------
  var elapsed = 0;

  function drawPage(pg, ox, t) {
    var mx = (phone ? W * 0.045 : W * 0.06);
    var my = (phone ? H * 0.05 : H * 0.07);
    var x0 = mx + ox, y0 = my, pw = W - 2 * mx, ph = H - 2 * my;
    var u = Math.min(pw, ph) * (phone ? 1.06 : 1.0);
    drawBorder(pg, x0, y0, pw, ph, u);
    var gy = y0 + ph * 0.70;
    var gx1 = x0 + pw * 0.16, gx2 = x0 + pw * 0.84;
    // ground wash: soft ink band under the wobbly line
    ctx.beginPath();
    groundPath(pg, gx1, gx2, gy, u);
    ctx.lineTo(gx2, gy + ph * 0.024);
    ctx.lineTo(gx1, gy + ph * 0.024);
    ctx.closePath();
    ctx.fillStyle = rgba(INK, 0.22);
    ctx.fill();
    groundPath(pg, gx1, gx2, gy, u);
    ctx.strokeStyle = rgba(INK, 0.85);
    ctx.lineWidth = Math.max(1.1, u * 0.0035);
    ctx.stroke();
    drawSubject(pg.kind, x0 + pw * 0.5, gy, u, t);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    if (anim) {
      var p = (t - anim.start) / anim.dur;
      if (p >= 1) {
        cur = mod(Math.round(anim.to), pages.length);
        off = cur;
        anim = null;
      } else {
        off = anim.from + (anim.to - anim.from) * easeIO(p);
      }
    }

    var n = pages.length;
    var base = Math.floor(off);
    var frac = off - base;
    var mx = (phone ? W * 0.045 : W * 0.06);
    var pw = W - 2 * mx;
    var turning = Math.abs(frac) > 0.0005;
    for (var k = -1; k <= 1; k++) {
      var idx = base + k;
      if (k !== 0 && !turning) continue;
      var pg = pages[mod(idx, n)];
      var ox = (idx - off) * pw;
      // clip to this page's own strip so a neighbour's border cannot bleed in
      ctx.save();
      ctx.beginPath();
      ctx.rect(mx + ox - pw * 0.02, 0, pw * 1.04, H);
      ctx.clip();
      drawPage(pg, ox, t);
      ctx.restore();
    }
    // page-curl shading: layered translucent bands at the incoming page's leading edge
    if (Math.abs(frac) > 0.002 && !dragging || (dragging && Math.abs(frac) > 0.002)) {
      var incoming = (frac > 0) ? base + 1 : base - 1;
      var edgeX = mx + (incoming - off) * pw + (frac > 0 ? 0 : pw);
      var dir = (frac > 0) ? 1 : -1;
      var bw = Math.min(pw, Math.max(10, pw * 0.055));
      var strength = Math.sin(Math.min(1, Math.abs(frac)) * Math.PI) * 0.5 + Math.abs(frac) * 0.3;
      for (var j = 0; j < 10; j++) {
        var a = 0.16 * (1 - j / 10) * strength;
        ctx.fillStyle = 'rgba(0,0,0,' + a.toFixed(3) + ')';
        var bx = (dir > 0) ? edgeX + j * bw / 10 : edgeX - (j + 1) * bw / 10;
        ctx.fillRect(bx, 0, bw / 10 + 1, H);
      }
    }
  }

  // ---------- run ----------
  fit();
  draw(0);
  var startTs = null;
  function frame(ts) {
    if (startTs === null) startTs = ts;
    elapsed = (ts - startTs) / 1000;
    draw(elapsed);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
