<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№637 Caustics</title>
<style>
  html, body { margin: 0; padding: 0; background: #06231b; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1978 Caustics, CR3 / PP1225, study #258 ciara-reddy.
  // A body submerged in green water, seen from just above
  // the surface. Sunlight draws bright caustic lines across
  // the skin, crawling and splitting as the water moves. The
  // frame is mostly water, the body only the left third, the
  // caustics the actual subject. Slow, hypnotic, the lines
  // never repeating a path. Watch-only: the water's slow
  // drift is the only motion; the piece asks for looking,
  // not touching.
  var GOLD = '#ffe9a8';   // hot pale gold caustic lines
  var GOLD2 = '#ffd76a';  // deeper gold core
  var GROUND = '#06231b'; // page ground, deep green water
  var SKIN1 = '#ecd9ba';  // pale skin, lit
  var SKIN2 = '#d3b48e';  // pale skin, shaded

  // Fixed-phase first frame: FIRST_T = 9 s into a 60 s
  // cycle. Every time-driven value derives from t, so frame
  // one is a pure function of FIRST_T. No wall clock, no
  // unseeded randomness at frame one.
  var FIRST_T = 9;
  var CYCLE = 60;
  var SEED = 1978;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 2D value noise, pure function of (x, y).
  function hash2(ix, iy) {
    var s = Math.sin(ix * 127.1 + iy * 311.7 + SEED * 74.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise2(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x - ix, fy = y - iy;
    var ux = fx * fx * (3 - 2 * fx);
    var uy = fy * fy * (3 - 2 * fy);
    var a = hash2(ix, iy), b = hash2(ix + 1, iy);
    var c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
    return (a * (1 - ux) + b * ux) * (1 - uy) + (c * (1 - ux) + d * ux) * uy;
  }
  function fbm2(x, y) {
    return vnoise2(x, y) * 0.55 + vnoise2(x * 2.13 + 7.7, y * 2.13 + 3.1) * 0.30 +
           vnoise2(x * 4.31 + 3.1, y * 4.31 + 9.4) * 0.15;
  }
  function ridge2(x, y) {
    var v = fbm2(x, y);
    var r = 1 - Math.abs(2 * v - 1);
    return r * r;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgba(r, g, b, a) {
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  // ---- Static layout, fixed seeded PRNG -------------------------
  // Filament parameters are drawn once from the seeded PRNG,
  // so the layout is identical on every load; only the phase
  // moves with t.
  var rng = mulberry32(SEED * 13 + 5);
  var FILAMENTS = [];
  var fi;
  for (fi = 0; fi < 150; fi++) {
    FILAMENTS.push({
      y0: rng(),                 // base height, 0..1 of H
      cyc: 2 + rng() * 4,        // wave oscillations across the width
      amp: 0.015 + rng() * 0.035,// wave amplitude, fraction of H
      ph: rng() * Math.PI * 2,   // phase offset
      sp: 0.05 + rng() * 0.11,   // drift speed, cycles per second-ish
      w: 0.8 + rng() * 1.8,      // line width, px at unit scale
      bright: 0.45 + rng() * 0.55,
      slope: (rng() - 0.5) * 0.35 // vertical drift across the width
    });
  }
  var DIAGONALS = [];
  for (fi = 0; fi < 70; fi++) {
    DIAGONALS.push({
      x0: rng(),                 // base x, 0..1 of W
      cyc: 2 + rng() * 3,        // wave oscillations down the height
      amp: 0.015 + rng() * 0.03, // wave amplitude, fraction of W
      ph: rng() * Math.PI * 2,
      sp: 0.05 + rng() * 0.11,
      w: 0.8 + rng() * 1.6,
      bright: 0.4 + rng() * 0.55,
      slope: (rng() - 0.5) * 0.4 // horizontal drift down the height
    });
  }
  var SPARKS = [];
  for (fi = 0; fi < 260; fi++) {
    SPARKS.push({
      x: rng(), y: rng(), r: 0.6 + rng() * 1.8,
      ph: rng() * Math.PI * 2, sp: 0.04 + rng() * 0.09
    });
  }
  var BLOBS = [];
  for (fi = 0; fi < 14; fi++) {
    BLOBS.push({
      x: rng(), y: rng(), r: 0.10 + rng() * 0.22,
      light: rng() > 0.5, ph: rng() * Math.PI * 2
    });
  }

  var SHIMMER = [];
  for (fi = 0; fi < 7; fi++) {
    SHIMMER.push({
      y: 0.03 + fi * 0.028, x: 0.30 + rng() * 0.35,
      len: 0.18 + rng() * 0.35, ph: fi * 1.7
    });
  }
  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.024, 12, 17));
    L.fsDate = Math.round(clamp(W * 0.019, 10, 14));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    // Body edge: the pale form occupies the left third, its
    // right contour a slow S curve from top to bottom.
    L.bodyTop = H * 0.06;
    L.bodyBot = H * 1.0;
  }
  function bodyEdge(y) {
    // Right contour of the submerged body at height y (px).
    var u = y / H;
    var e = W * 0.30
      + Math.sin(u * 2.4 + 0.6) * W * 0.060
      + Math.sin(u * 5.1 + 2.0) * W * 0.016;
    return e;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Water -----------------------------------------------------
  function drawWater(t) {
    var i, x, y;
    // Deep green field, lighter toward the sunlit top.
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0e4d38');
    g.addColorStop(0.45, '#0a3a2b');
    g.addColorStop(1, '#052015');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Slow-drifting soft blotches: lighter green swell and
    // darker depth, so the water is never flat.
    for (i = 0; i < BLOBS.length; i++) {
      var b = BLOBS[i];
      var drift = Math.sin(t * 0.05 + b.ph) * W * 0.03;
      var bx = b.x * W + drift;
      var by = b.y * H + Math.cos(t * 0.04 + b.ph) * H * 0.02;
      var br = b.r * W;
      var rg = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      if (b.light) {
        rg.addColorStop(0, rgba(38, 110, 82, 0.20));
        rg.addColorStop(1, rgba(38, 110, 82, 0));
      } else {
        rg.addColorStop(0, rgba(2, 20, 12, 0.28));
        rg.addColorStop(1, rgba(2, 20, 12, 0));
      }
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(bx + br, by);
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
    }

    // Sunlit surface shimmer: short broken bands near the top,
    // breathing slowly, faint enough to read as light on water.
    for (i = 0; i < SHIMMER.length; i++) {
      var sm = SHIMMER[i];
      var sy = H * sm.y;
      var sh = H * 0.008;
      var sa = 0.04 + 0.03 * Math.sin(t * 0.12 + sm.ph);
      ctx.fillStyle = rgba(255, 233, 168, a4(clamp(sa, 0.01, 0.08)));
      ctx.fillRect(W * sm.x, sy, W * sm.len, sh);
    }
  }

  // ---- Body ------------------------------------------------------
  // A pale form along the left edge, mostly cropped: shoulder
  // at top, torso curving down, no face, no full figure. The
  // body is a screen for the light, not a character.
  function drawBody(t) {
    var y;
    var grad = ctx.createLinearGradient(0, 0, W * 0.36, 0);
    grad.addColorStop(0, SKIN1);
    grad.addColorStop(0.75, '#dfc39c');
    grad.addColorStop(1, SKIN2);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-W * 0.05, -H * 0.02);
    ctx.lineTo(W * 0.20, -H * 0.02);
    // Right contour, top to bottom, following bodyEdge.
    for (y = 0; y <= H; y += H / 60) {
      ctx.lineTo(bodyEdge(y), y);
    }
    ctx.lineTo(-W * 0.05, H * 1.02);
    ctx.closePath();
    ctx.fill();

    // Soft shading: a darker band hugging the right contour
    // (the body's edge falling away into deep water) and a
    // lit band just inside it.
    ctx.strokeStyle = rgba(120, 88, 50, 0.28);
    ctx.lineWidth = Math.max(2, W * 0.012);
    ctx.beginPath();
    for (y = 0; y <= H; y += H / 60) {
      var ex = bodyEdge(y) - W * 0.006;
      if (y === 0) { ctx.moveTo(ex, y); } else { ctx.lineTo(ex, y); }
    }
    ctx.stroke();
    ctx.strokeStyle = rgba(255, 244, 214, 0.30);
    ctx.lineWidth = Math.max(1, W * 0.005);
    ctx.beginPath();
    for (y = 0; y <= H; y += H / 60) {
      var lx = bodyEdge(y) - W * 0.020;
      if (y === 0) { ctx.moveTo(lx, y); } else { ctx.lineTo(lx, y); }
    }
    ctx.stroke();

    // A slow, barely-there swell: the body breathes with the
    // water, a few pixels of drift, so it stays still while
    // the light dances. Rendered as a translucent green wash
    // that slides over the skin.
    var wash = ctx.createLinearGradient(0, 0, W * 0.36, H * 0.2);
    var wa = 0.10 + 0.05 * Math.sin(t * 0.10 + 1.0);
    wash.addColorStop(0, rgba(10, 58, 43, a4(wa)));
    wash.addColorStop(1, rgba(10, 58, 43, 0));
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W * 0.38, H);
  }

  // ---- Caustics --------------------------------------------------
  // Layered moving noise projected as bright gold lines. Each
  // filament is a wavy line whose brightness follows a ridged
  // noise field, so lines crawl, split, and reform as the
  // water moves. Lines crossing the body read brighter: the
  // skin catches the light.
  function drawCaustics(t) {
    var i, x, y;
    var step = W / 110;
    for (i = 0; i < FILAMENTS.length; i++) {
      var f = FILAMENTS[i];
      ctx.lineWidth = Math.max(0.8, f.w * (W / 720));
      // Draw in short segments so brightness can follow the
      // ridge field along the line, breaking it into crawling
      // pieces instead of one continuous scratch.
      for (x = 0; x < W; x += step) {
        var u = x / W;
        var wob = Math.sin(u * Math.PI * 2 * f.cyc + f.ph + t * f.sp * 2.0) * f.amp * H;
        var wob2 = Math.sin(u * Math.PI * 2 * f.cyc * 2.7 + f.ph * 1.7 - t * f.sp * 1.3) * f.amp * H * 0.35;
        var yy = f.y0 * H + u * f.slope * H + wob + wob2;
        var nx = x + step;
        var nu = nx / W;
        var nwob = Math.sin(nu * Math.PI * 2 * f.cyc + f.ph + t * f.sp * 2.0) * f.amp * H;
        var nwob2 = Math.sin(nu * Math.PI * 2 * f.cyc * 2.7 + f.ph * 1.7 - t * f.sp * 1.3) * f.amp * H * 0.35;
        var ny = f.y0 * H + nu * f.slope * H + nwob + nwob2;
        // Ridge field at this point: slow drift in both axes.
        // A second, offset ridge gates the line so it splits
        // and reforms instead of running unbroken.
        var r = ridge2(u * 3.0 + t * 0.018, f.y0 * 3.0 + t * 0.011 + f.ph * 0.1);
        var r2 = ridge2(u * 5.0 - t * 0.013 + 4.0, f.y0 * 5.0 + t * 0.007);
        var a = smooth((r - 0.56) / 0.44) * smooth((r2 - 0.40) / 0.60) * f.bright;
        if (a < 0.03) { continue; }
        var midX = (x + nx) / 2;
        var midY = (yy + ny) / 2;
        var overBody = midX < bodyEdge(midY);
        var boost = overBody ? 1.0 : 0.72;
        var core = a * boost;
        ctx.strokeStyle = rgba(255, 215, 106, a4(clamp(core, 0, 0.95)));
        ctx.beginPath();
        ctx.moveTo(x, yy);
        ctx.lineTo(nx, ny);
        ctx.stroke();
        // Hot pale core on the brightest segments.
        if (core > 0.55) {
          ctx.strokeStyle = rgba(255, 233, 168, a4(clamp((core - 0.55) * 1.6, 0, 0.9)));
          ctx.lineWidth = Math.max(0.6, f.w * (W / 720) * 0.45);
          ctx.beginPath();
          ctx.moveTo(x, yy);
          ctx.lineTo(nx, ny);
          ctx.stroke();
          ctx.lineWidth = Math.max(0.8, f.w * (W / 720));
        }
      }
    }

    // Diagonal set: lines running down the frame, crossing the
    // horizontal filaments so the web reads as caustics, not
    // scratches.
    var dstep = H / 110;
    for (i = 0; i < DIAGONALS.length; i++) {
      var d = DIAGONALS[i];
      ctx.lineWidth = Math.max(0.8, d.w * (W / 720));
      for (y = 0; y < H; y += dstep) {
        var v = y / H;
        var dwob = Math.sin(v * Math.PI * 2 * d.cyc + d.ph + t * d.sp * 2.0) * d.amp * W;
        var dwob2 = Math.sin(v * Math.PI * 2 * d.cyc * 2.3 + d.ph * 1.7 - t * d.sp * 1.3) * d.amp * W * 0.35;
        var xx = d.x0 * W + v * d.slope * W + dwob + dwob2;
        var ny2 = y + dstep;
        var nv = ny2 / H;
        var ndwob = Math.sin(nv * Math.PI * 2 * d.cyc + d.ph + t * d.sp * 2.0) * d.amp * W;
        var ndwob2 = Math.sin(nv * Math.PI * 2 * d.cyc * 2.3 + d.ph * 1.7 - t * d.sp * 1.3) * d.amp * W * 0.35;
        var nx2 = d.x0 * W + nv * d.slope * W + ndwob + ndwob2;
        var dr = ridge2(xx / W * 3.0 + t * 0.018, v * 3.0 + t * 0.011 + d.ph * 0.1);
        var dr2 = ridge2(xx / W * 5.0 - t * 0.013 + 4.0, v * 5.0 + t * 0.007);
        var da = smooth((dr - 0.56) / 0.44) * smooth((dr2 - 0.40) / 0.60) * d.bright;
        if (da < 0.03) { continue; }
        var dmidX = (xx + nx2) / 2;
        var dmidY = (y + ny2) / 2;
        var doverBody = dmidX < bodyEdge(dmidY);
        var dcore = da * (doverBody ? 1.0 : 0.72);
        ctx.strokeStyle = rgba(255, 215, 106, a4(clamp(dcore, 0, 0.95)));
        ctx.beginPath();
        ctx.moveTo(xx, y);
        ctx.lineTo(nx2, ny2);
        ctx.stroke();
        if (dcore > 0.55) {
          ctx.strokeStyle = rgba(255, 233, 168, a4(clamp((dcore - 0.55) * 1.6, 0, 0.9)));
          ctx.lineWidth = Math.max(0.6, d.w * (W / 720) * 0.45);
          ctx.beginPath();
          ctx.moveTo(xx, y);
          ctx.lineTo(nx2, ny2);
          ctx.stroke();
          ctx.lineWidth = Math.max(0.8, d.w * (W / 720));
        }
      }
    }

    // Sparks: small bright dashes where the ridge field peaks,
    // drifting slowly, so the web keeps splitting and reforming.
    for (i = 0; i < SPARKS.length; i++) {
      var s = SPARKS[i];
      var sx = (s.x * W + Math.sin(t * s.sp + s.ph) * W * 0.05 + W) % W;
      var sy = (s.y * H + Math.cos(t * s.sp * 0.8 + s.ph) * H * 0.03 + H) % H;
      var sr = ridge2(sx / W * 3.0 + t * 0.018, sy / H * 3.0 + t * 0.011);
      var sa = smooth((sr - 0.62) / 0.38);
      if (sa < 0.05) { continue; }
      var overB = sx < bodyEdge(sy);
      ctx.fillStyle = rgba(255, 233, 168, a4(clamp(sa * (overB ? 0.95 : 0.6), 0, 0.95)));
      ctx.beginPath();
      ctx.moveTo(sx + s.r, sy);
      ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Frame -----------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawWater(t);
    drawBody(t);
    drawCaustics(t);

    // Vignette: darken the far water slightly so the eye stays
    // on the body and the brightest caustics.
    var vg = ctx.createRadialGradient(W * 0.42, H * 0.5, H * 0.3, W * 0.42, H * 0.5, H * 0.95);
    vg.addColorStop(0, rgba(2, 20, 12, 0));
    vg.addColorStop(1, rgba(2, 20, 12, 0.35));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // Caption, top right over the water, and the hint, bottom
    // center. Watch-only: the hint says so.
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(232, 240, 228, 0.85);
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№637 · Caustics', W * 0.96, H * 0.055);
    ctx.fillStyle = rgba(232, 240, 228, 0.60);
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2007 · 06 · 12', W * 0.96, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(255, 233, 168, 0.75);
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the light move.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer handlers change the piece. The
  // water drifts on its own clock; there is nothing to touch.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1978 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1978 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      caustic: function (t, u, v) { return ridge2(u * 3.0 + t * 0.018, v * 3.0 + t * 0.011); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the caustic field crawls on a 60 s cycle.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
