<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lift the Flap</title>
<style>
  html, body { margin: 0; padding: 0; background: #F0E6D2; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SEED = 629076;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette ----------
  var GROUND = '#F0E6D2';       // board cream
  var FACE = '#F8F1E0';         // tile face: a touch lighter than the ground
  var CAVITY = '#E9DCC0';       // revealed base under a flap: a touch darker
  var EDGE = '#D9C9A6';         // tile paper edge
  var WHITE = '#FFFFFF';        // flap paper-thick edge
  var PURPLE = '#7A4E8C';       // octopus ink
  var AMBER = '#C9862E';        // cat ink
  var GREEN = '#6A9A5B';        // chameleon ink
  var BROWN = '#6B4A2E';        // owl ink
  var GOLD = '#E8B93B';         // firefly ink
  var BLACK = '#1C1A16';        // ink black (axolotl / snail / bat outlines, frog details)

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function rgba(h, a) {
    var c = hexRgb(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function fract(x) { return x - Math.floor(x); }

  // ---------- tiles ----------
  // Fixed order: octopus, cat, chameleon / owl, firefly, axolotl / snail, bat, frog.
  // Ink assignment (the prompt lists six inks for nine creatures): the first five
  // creatures take the five named inks; axolotl, snail and bat are ink-black
  // outlines each with ONE family accent (gold gills, amber shell, purple wings);
  // the frog takes the sixth listed ink, chameleon green, as its body.
  var NAMES = ['octopus', 'cat', 'chameleon', 'owl', 'firefly', 'axolotl', 'snail', 'bat', 'frog'];
  var tiles = [];
  for (var i = 0; i < 9; i++) {
    tiles.push({
      name: NAMES[i],
      open01: 0,          // 0 closed, 1 fully open
      target: 0,
      phase: 0,           // mechanism clock; advances only while this is the active tile
      rng: mulberry32(SEED + i * 131)
    });
  }
  var activeMech = -1;      // most recently opened tile; only its mechanism animates

  // QA hooks (inert in the shipped piece; used only by throwaway forced renders)
  if (typeof window !== 'undefined' && typeof window.__forceOpen === 'number') {
    var fo = Math.max(0, Math.min(8, window.__forceOpen | 0));
    tiles[fo].open01 = 1;
    tiles[fo].target = 1;
    tiles[fo].phase = (typeof window.__forcePhase === 'number') ? window.__forcePhase : 1.6;
    activeMech = fo;
  }

  // seeded per-tile mechanism details
  var camoAccent = [];   // octopus: which dots carry the accent
  (function () {
    var r = mulberry32(SEED + 901);
    for (var k = 0; k < 36; k++) camoAccent.push(r() < 0.22);
  })();
  var preyDots = [];     // owl: two bright prey dots (tile-local fractions)
  (function () {
    var r = mulberry32(SEED + 902);
    preyDots.push({ x: -0.22 + r() * 0.14, y: -0.18 + r() * 0.12 });
    preyDots.push({ x: 0.10 + r() * 0.16, y: 0.08 + r() * 0.16 });
  })();
  var tailDots = [];     // axolotl: scatter offsets for the broken tail
  (function () {
    var r = mulberry32(SEED + 903);
    for (var k = 0; k < 9; k++) tailDots.push({ x: (r() - 0.5) * 0.30, y: (r() - 0.5) * 0.22, s: 0.008 + r() * 0.010 });
  })();

  // ---------- sizing (Visual Viewport API) ----------
  var W = 0, H = 0;
  function resize() {
    var vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(lastElapsed);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  function isPhone(w, h) {
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  // ---------- layout ----------
  function layout() {
    var availW = W * 0.94, availH = H * 0.92;
    var cell = Math.min(availW, availH) / 3.4;   // 3 tiles + 2 gaps of 0.2 cell
    var gap = cell * 0.2;
    var total = cell * 3 + gap * 2;
    return { cell: cell, gap: gap, x0: (W - total) / 2, y0: (H - total) / 2 };
  }
  function tileRect(idx) {
    var L = layout();
    var col = idx % 3, row = (idx / 3) | 0;
    return {
      x: L.x0 + col * (L.cell + L.gap),
      y: L.y0 + row * (L.cell + L.gap),
      s: L.cell
    };
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // ================= CREATURES (drawn on the flap front, tile-local) =================
  // Each takes the tile rect; draws centered. u = tile size.

  function drawOctopus(x, y, s) {
    var cx = x + s / 2, cy = y + s / 2, u = s;
    ctx.strokeStyle = PURPLE; ctx.fillStyle = PURPLE;
    ctx.lineCap = 'round';
    // tentacles
    var baseY = cy + 0.06 * u;
    for (var k = -2; k <= 2; k++) {
      var tx = cx + k * 0.11 * u;
      ctx.beginPath();
      ctx.moveTo(tx, baseY);
      ctx.quadraticCurveTo(tx + (k % 2 ? 0.05 : -0.05) * u, baseY + 0.14 * u, tx + (k % 2 ? -0.03 : 0.03) * u, baseY + 0.24 * u);
      ctx.lineWidth = 0.062 * u;
      ctx.stroke();
    }
    // dome head
    ctx.beginPath();
    ctx.arc(cx, baseY, 0.21 * u, Math.PI, 0);
    ctx.quadraticCurveTo(cx + 0.21 * u, baseY + 0.05 * u, cx + 0.17 * u, baseY + 0.02 * u);
    ctx.lineTo(cx - 0.17 * u, baseY + 0.02 * u);
    ctx.quadraticCurveTo(cx - 0.21 * u, baseY + 0.05 * u, cx - 0.21 * u, baseY);
    ctx.closePath();
    ctx.fill();
    // eyes
    ctx.fillStyle = FACE;
    ctx.beginPath(); ctx.arc(cx - 0.08 * u, cy - 0.04 * u, 0.032 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 0.08 * u, cy - 0.04 * u, 0.032 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(cx - 0.08 * u, cy - 0.04 * u, 0.016 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 0.08 * u, cy - 0.04 * u, 0.016 * u, 0, Math.PI * 2); ctx.fill();
  }

  function drawCat(x, y, s) {
    var cx = x + s / 2, cy = y + s / 2, u = s;
    ctx.fillStyle = AMBER; ctx.strokeStyle = AMBER; ctx.lineCap = 'round';
    // tail
    ctx.beginPath();
    ctx.moveTo(cx + 0.16 * u, cy + 0.24 * u);
    ctx.quadraticCurveTo(cx + 0.30 * u, cy + 0.20 * u, cx + 0.28 * u, cy + 0.02 * u);
    ctx.lineWidth = 0.05 * u; ctx.stroke();
    // body
    ctx.beginPath(); ctx.ellipse(cx, cy + 0.20 * u, 0.17 * u, 0.115 * u, 0, 0, Math.PI * 2); ctx.fill();
    // ears
    ctx.beginPath();
    ctx.moveTo(cx - 0.155 * u, cy - 0.10 * u); ctx.lineTo(cx - 0.13 * u, cy - 0.27 * u); ctx.lineTo(cx - 0.03 * u, cy - 0.17 * u);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 0.155 * u, cy - 0.10 * u); ctx.lineTo(cx + 0.13 * u, cy - 0.27 * u); ctx.lineTo(cx + 0.03 * u, cy - 0.17 * u);
    ctx.closePath(); ctx.fill();
    // head
    ctx.beginPath(); ctx.arc(cx, cy - 0.03 * u, 0.185 * u, 0, Math.PI * 2); ctx.fill();
    // eyes + nose
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(cx - 0.07 * u, cy - 0.05 * u, 0.016 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 0.07 * u, cy - 0.05 * u, 0.016 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 0.02 * u, cy + 0.015 * u); ctx.lineTo(cx + 0.02 * u, cy + 0.015 * u); ctx.lineTo(cx, cy + 0.04 * u);
    ctx.closePath(); ctx.fill();
    // whiskers
    ctx.strokeStyle = BLACK; ctx.lineWidth = Math.max(1, 0.011 * u);
    for (var k = -1; k <= 1; k++) {
      ctx.beginPath(); ctx.moveTo(cx - 0.06 * u, cy + 0.02 * u + k * 0.012 * u); ctx.lineTo(cx - 0.24 * u, cy + k * 0.045 * u); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 0.06 * u, cy + 0.02 * u + k * 0.012 * u); ctx.lineTo(cx + 0.24 * u, cy + k * 0.045 * u); ctx.stroke();
    }
  }

  function drawChameleon(x, y, s) {
    var cx = x + s / 2, cy = y + s / 2, u = s;
    ctx.strokeStyle = GREEN; ctx.fillStyle = GREEN; ctx.lineCap = 'round';
    // curled tail (left)
    ctx.beginPath();
    var tr = 0.085 * u, tcx = cx - 0.24 * u, tcy = cy + 0.13 * u;
    for (var a = 0; a <= Math.PI * 3.4; a += 0.15) {
      var rr = tr * (1 - a / (Math.PI * 4.4));
      var px = tcx + Math.cos(a + 2.2) * rr, py = tcy + Math.sin(a + 2.2) * rr;
      if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.lineWidth = 0.045 * u; ctx.stroke();
    // body: a plump arc blob
    ctx.beginPath();
    ctx.moveTo(cx - 0.20 * u, cy + 0.16 * u);
    ctx.quadraticCurveTo(cx - 0.22 * u, cy - 0.14 * u, cx + 0.02 * u, cy - 0.17 * u);
    ctx.quadraticCurveTo(cx + 0.24 * u, cy - 0.19 * u, cx + 0.27 * u, cy - 0.02 * u);
    ctx.quadraticCurveTo(cx + 0.28 * u, cy + 0.10 * u, cx + 0.16 * u, cy + 0.15 * u);
    ctx.lineTo(cx - 0.20 * u, cy + 0.16 * u);
    ctx.closePath(); ctx.fill();
    // crest bumps
    ctx.beginPath();
    for (var k = 0; k < 4; k++) {
      var bx = cx - 0.10 * u + k * 0.085 * u, by = cy - 0.175 * u - Math.sin(k / 3 * Math.PI) * 0.02 * u;
      ctx.moveTo(bx + 0.028 * u, by + 0.02 * u);
      ctx.arc(bx, by + 0.02 * u, 0.028 * u, 0, Math.PI, true);
    }
    ctx.fill();
    // legs
    ctx.lineWidth = 0.04 * u;
    ctx.beginPath(); ctx.moveTo(cx - 0.10 * u, cy + 0.15 * u); ctx.lineTo(cx - 0.12 * u, cy + 0.26 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 0.12 * u, cy + 0.15 * u); ctx.lineTo(cx + 0.14 * u, cy + 0.26 * u); ctx.stroke();
    // branch
    ctx.strokeStyle = BROWN; ctx.lineWidth = 0.035 * u;
    ctx.beginPath(); ctx.moveTo(cx - 0.30 * u, cy + 0.27 * u); ctx.lineTo(cx + 0.30 * u, cy + 0.27 * u); ctx.stroke();
    // eye cone + pupil
    ctx.fillStyle = GREEN;
    ctx.beginPath(); ctx.arc(cx + 0.20 * u, cy - 0.08 * u, 0.052 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(cx + 0.215 * u, cy - 0.08 * u, 0.020 * u, 0, Math.PI * 2); ctx.fill();
    // back dots
    ctx.fillStyle = FACE;
    ctx.beginPath(); ctx.arc(cx - 0.05 * u, cy - 0.05 * u, 0.018 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 0.06 * u, cy - 0.10 * u, 0.014 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 0.02 * u, cy + 0.05 * u, 0.015 * u, 0, Math.PI * 2); ctx.fill();
  }

  function drawOwl(x, y, s) {
    var cx = x + s / 2, cy = y + s / 2, u = s;
    ctx.fillStyle = BROWN; ctx.strokeStyle = BROWN; ctx.lineCap = 'round';
    // ear tufts
    ctx.beginPath();
    ctx.moveTo(cx - 0.16 * u, cy - 0.14 * u); ctx.lineTo(cx - 0.15 * u, cy - 0.28 * u); ctx.lineTo(cx - 0.05 * u, cy - 0.19 * u);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 0.16 * u, cy - 0.14 * u); ctx.lineTo(cx + 0.15 * u, cy - 0.28 * u); ctx.lineTo(cx + 0.05 * u, cy - 0.19 * u);
    ctx.closePath(); ctx.fill();
    // body
    ctx.beginPath(); ctx.ellipse(cx, cy + 0.02 * u, 0.185 * u, 0.235 * u, 0, 0, Math.PI * 2); ctx.fill();
    // wing arcs
    ctx.strokeStyle = rgba(BLACK, 0.25); ctx.lineWidth = 0.02 * u;
    ctx.beginPath(); ctx.arc(cx - 0.10 * u, cy + 0.05 * u, 0.10 * u, 0.4, 2.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 0.10 * u, cy + 0.05 * u, 0.10 * u, Math.PI - 2.2, Math.PI - 0.4); ctx.stroke();
    // face discs
    ctx.fillStyle = FACE;
    ctx.beginPath(); ctx.arc(cx - 0.075 * u, cy - 0.07 * u, 0.078 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 0.075 * u, cy - 0.07 * u, 0.078 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(cx - 0.075 * u, cy - 0.07 * u, 0.034 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 0.075 * u, cy - 0.07 * u, 0.034 * u, 0, Math.PI * 2); ctx.fill();
    // beak
    ctx.fillStyle = GOLD;
    ctx.beginPath();
    ctx.moveTo(cx - 0.028 * u, cy + 0.005 * u); ctx.lineTo(cx + 0.028 * u, cy + 0.005 * u); ctx.lineTo(cx, cy + 0.05 * u);
    ctx.closePath(); ctx.fill();
    // belly scallops
    ctx.strokeStyle = rgba(FACE, 0.55); ctx.lineWidth = 0.014 * u;
    for (var r = 0; r < 2; r++) for (var k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.arc(cx + k * 0.075 * u, cy + 0.13 * u + r * 0.07 * u, 0.032 * u, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
    // feet
    ctx.strokeStyle = GOLD; ctx.lineWidth = 0.02 * u;
    ctx.beginPath(); ctx.moveTo(cx - 0.07 * u, cy + 0.255 * u); ctx.lineTo(cx - 0.07 * u, cy + 0.29 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 0.07 * u, cy + 0.255 * u); ctx.lineTo(cx + 0.07 * u, cy + 0.29 * u); ctx.stroke();
  }

  function drawFirefly(x, y, s) {
    var cx = x + s / 2, cy = y + s / 2, u = s;
    ctx.lineCap = 'round';
    // wings (pale, behind body)
    ctx.fillStyle = rgba(FACE, 0.9);
    ctx.beginPath(); ctx.ellipse(cx - 0.13 * u, cy - 0.10 * u, 0.13 * u, 0.055 * u, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 0.13 * u, cy - 0.10 * u, 0.13 * u, 0.055 * u, 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = EDGE; ctx.lineWidth = Math.max(1, 0.008 * u);
    ctx.beginPath(); ctx.ellipse(cx - 0.13 * u, cy - 0.10 * u, 0.13 * u, 0.055 * u, -0.6, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx + 0.13 * u, cy - 0.10 * u, 0.13 * u, 0.055 * u, 0.6, 0, Math.PI * 2); ctx.stroke();
    // legs
    ctx.strokeStyle = BLACK; ctx.lineWidth = 0.018 * u;
    for (var k = -1; k <= 1; k++) {
      ctx.beginPath(); ctx.moveTo(cx - 0.08 * u, cy + 0.02 * u + k * 0.07 * u); ctx.lineTo(cx - 0.20 * u, cy + 0.06 * u + k * 0.08 * u); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 0.08 * u, cy + 0.02 * u + k * 0.07 * u); ctx.lineTo(cx + 0.20 * u, cy + 0.06 * u + k * 0.08 * u); ctx.stroke();
    }
    // body
    ctx.fillStyle = GOLD;
    ctx.beginPath(); ctx.ellipse(cx, cy + 0.03 * u, 0.115 * u, 0.20 * u, 0, 0, Math.PI * 2); ctx.fill();
    // abdomen bands
    ctx.strokeStyle = rgba(BLACK, 0.55); ctx.lineWidth = 0.016 * u;
    ctx.beginPath(); ctx.arc(cx, cy + 0.10 * u, 0.085 * u, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy + 0.155 * u, 0.065 * u, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
    // head + antennae
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(cx, cy - 0.20 * u, 0.075 * u, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = BLACK; ctx.lineWidth = 0.014 * u;
    ctx.beginPath(); ctx.moveTo(cx - 0.03 * u, cy - 0.26 * u); ctx.quadraticCurveTo(cx - 0.10 * u, cy - 0.33 * u, cx - 0.14 * u, cy - 0.32 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 0.03 * u, cy - 0.26 * u); ctx.quadraticCurveTo(cx + 0.10 * u, cy - 0.33 * u, cx + 0.14 * u, cy - 0.32 * u); ctx.stroke();
    // lamp tip
    ctx.fillStyle = FACE;
    ctx.beginPath(); ctx.arc(cx, cy + 0.185 * u, 0.035 * u, 0, Math.PI * 2); ctx.fill();
  }

  function drawAxolotl(x, y, s) {
    var cx = x + s / 2, cy = y + s / 2, u = s;
    ctx.lineCap = 'round';
    // gold gill frills (accent) behind the head
    ctx.strokeStyle = GOLD; ctx.lineWidth = 0.020 * u;
    for (var k = -1; k <= 1; k++) {
      ctx.beginPath(); ctx.moveTo(cx - 0.155 * u, cy - 0.02 * u + k * 0.03 * u);
      ctx.quadraticCurveTo(cx - 0.24 * u, cy - 0.05 * u + k * 0.045 * u, cx - 0.27 * u, cy - 0.01 * u + k * 0.06 * u); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 0.155 * u, cy - 0.02 * u + k * 0.03 * u);
      ctx.quadraticCurveTo(cx + 0.24 * u, cy - 0.05 * u + k * 0.045 * u, cx + 0.27 * u, cy - 0.01 * u + k * 0.06 * u); ctx.stroke();
    }
    // body (outline): head dome left, body to a tapered tail on the right
    ctx.beginPath();
    ctx.moveTo(cx - 0.17 * u, cy + 0.10 * u);
    ctx.quadraticCurveTo(cx - 0.20 * u, cy - 0.14 * u, cx - 0.05 * u, cy - 0.15 * u);
    ctx.quadraticCurveTo(cx + 0.10 * u, cy - 0.155 * u, cx + 0.17 * u, cy - 0.06 * u);
    ctx.quadraticCurveTo(cx + 0.27 * u, cy + 0.0 * u, cx + 0.30 * u, cy + 0.05 * u);
    ctx.quadraticCurveTo(cx + 0.20 * u, cy + 0.10 * u, cx + 0.10 * u, cy + 0.115 * u);
    ctx.lineTo(cx - 0.17 * u, cy + 0.10 * u);
    ctx.closePath();
    ctx.fillStyle = FACE; ctx.fill();
    ctx.strokeStyle = BLACK; ctx.lineWidth = Math.max(1.6, 0.020 * u); ctx.stroke();
    // tail fin line
    ctx.beginPath(); ctx.moveTo(cx + 0.16 * u, cy - 0.055 * u); ctx.quadraticCurveTo(cx + 0.24 * u, cy + 0.01 * u, cx + 0.295 * u, cy + 0.048 * u);
    ctx.lineWidth = Math.max(1, 0.010 * u); ctx.stroke();
    // legs
    ctx.lineWidth = Math.max(1.6, 0.020 * u);
    ctx.beginPath(); ctx.moveTo(cx - 0.10 * u, cy + 0.11 * u); ctx.lineTo(cx - 0.12 * u, cy + 0.20 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 0.06 * u, cy + 0.115 * u); ctx.lineTo(cx + 0.05 * u, cy + 0.20 * u); ctx.stroke();
    // eye + smile
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(cx - 0.10 * u, cy - 0.03 * u, 0.016 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 0.02 * u, cy - 0.03 * u, 0.016 * u, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = BLACK; ctx.lineWidth = Math.max(1, 0.010 * u);
    ctx.beginPath(); ctx.arc(cx - 0.04 * u, cy + 0.015 * u, 0.055 * u, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  }

  function drawSnail(x, y, s) {
    var cx = x + s / 2, cy = y + s / 2, u = s;
    ctx.lineCap = 'round';
    // body (outline), a low slug shape along the bottom
    ctx.beginPath();
    ctx.moveTo(cx - 0.28 * u, cy + 0.22 * u);
    ctx.quadraticCurveTo(cx - 0.28 * u, cy + 0.08 * u, cx - 0.10 * u, cy + 0.07 * u);
    ctx.lineTo(cx + 0.16 * u, cy + 0.07 * u);
    ctx.quadraticCurveTo(cx + 0.26 * u, cy + 0.06 * u, cx + 0.27 * u, cy - 0.04 * u);

  function mechOctopus(x, y, s, ph) {           // camouflage: rippling dot field

    ctx.beginPath(); ctx.arc(dx, dy, 0.020 * u, 0, Math.PI * 2); ctx.fill();
  }

  var MECHS = [mechOctopus, mechCat, mechChameleon, mechOwl, mechFirefly, mechAxolotl, mechSnail, mechBat, mechFrog];

  // ================= DRAW =================
  var lastElapsed = 0;
  var THETA_MAX = 105 * Math.PI / 180;

  function ease(k) { return k * k * (3 - 2 * k); }

  function draw(t) {
    if (!W || !H) return;
    var w = W, h = H;
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, w, h);

    var i, r, tile;
    // pass 1: tile bases + mechanisms (mechanisms always drawn; the closed flap covers them)
    for (i = 0; i < 9; i++) {
      r = tileRect(i);
      tile = tiles[i];
      roundRect(r.x, r.y, r.s, r.s, r.s * 0.07);
      ctx.fillStyle = CAVITY;
      ctx.fill();
      ctx.strokeStyle = EDGE;
      ctx.lineWidth = Math.max(1, r.s * 0.012);
      ctx.stroke();
      // cavity shadow deepens as the flap lifts
      var shA = Math.sin(ease(tile.open01) * THETA_MAX) * 0.16;
      if (shA > 0.004) {
        ctx.save();
        roundRect(r.x, r.y, r.s, r.s, r.s * 0.07);
        ctx.clip();
        ctx.fillStyle = 'rgba(70,52,20,' + shA.toFixed(3) + ')';
        ctx.fillRect(r.x, r.y, r.s, r.s);
        ctx.restore();
      }
      // mechanism, clipped to the tile interior
      ctx.save();
      roundRect(r.x + r.s * 0.05, r.y + r.s * 0.05, r.s * 0.90, r.s * 0.90, r.s * 0.05);
      ctx.clip();
      MECHS[i](r.x, r.y, r.s, tile.phase);
      ctx.restore();
    }

    // pass 2: flaps (hinged at each tile's top edge), creatures riding the flap front
    for (i = 0; i < 9; i++) {
      r = tileRect(i);
      tile = tiles[i];
      var inset = r.s * 0.045;
      var fx = r.x + inset, fw = r.s - inset * 2;
      var hingeY = r.y + inset;
      var flapH = r.s - inset * 2;
      var theta = ease(tile.open01) * THETA_MAX;
      var proj = Math.cos(theta);
      var edgeY = hingeY + flapH * proj;
      var top = Math.min(hingeY, edgeY), bot = Math.max(hingeY, edgeY);
      // flap face
      ctx.beginPath();
      ctx.moveTo(fx, hingeY);
      ctx.lineTo(fx + fw, hingeY);
      ctx.lineTo(fx + fw, edgeY);
      ctx.lineTo(fx, edgeY);
      ctx.closePath();
      ctx.fillStyle = FACE;
      ctx.fill();
      ctx.strokeStyle = EDGE;
      ctx.lineWidth = Math.max(1, r.s * 0.010);
      ctx.stroke();
      // creature, squished by the same projection about the hinge
      if (Math.abs(proj) > 0.02) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(fx - r.s * 0.3, top - r.s * 0.02, fw + r.s * 0.6, (bot - top) + r.s * 0.04);
        ctx.clip();
        ctx.translate(0, hingeY);
        ctx.scale(1, proj);
        ctx.translate(0, -hingeY);
        CREATURES[i](r.x, r.y, r.s);
        ctx.restore();
      }
      // paper-thick white edge on the flap's free edge
      var thick = 1 + 4 * Math.sin(theta);
      ctx.strokeStyle = WHITE;
      ctx.lineWidth = thick;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(fx, edgeY);
      ctx.lineTo(fx + fw, edgeY);
      ctx.stroke();
      // hinge crease
      ctx.strokeStyle = rgba(EDGE, 0.9);
      ctx.lineWidth = Math.max(1, r.s * 0.008);
      ctx.beginPath();
      ctx.moveTo(fx, hingeY);
      ctx.lineTo(fx + fw, hingeY);
      ctx.stroke();
    }

    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }

  // ---------- interaction: tap a tile toggles its flap ----------
  var downX = 0, downY = 0, downT = 0, hasDown = false;
  function tileAt(px, py) {
    for (var i = 0; i < 9; i++) {
      var r = tileRect(i);
      if (px >= r.x && px <= r.x + r.s && py >= r.y && py <= r.y + r.s) return i;
    }
    return -1;
  }
  canvas.addEventListener('pointerdown', function (e) {
    hasDown = true;
    downX = e.clientX; downY = e.clientY; downT = lastElapsed;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!hasDown) return;
    hasDown = false;
    var moved = Math.sqrt(Math.pow(e.clientX - downX, 2) + Math.pow(e.clientY - downY, 2));
    if (moved > 14 || (lastElapsed - downT) > 0.6) return;   // a drag does nothing
    var i = tileAt(e.clientX, e.clientY);
    if (i < 0) return;
    var tile = tiles[i];
    tile.target = tile.target > 0.5 ? 0 : 1;
    if (tile.target === 1) activeMech = i;   // most recently opened animates
  });
  canvas.addEventListener('pointercancel', function () { hasDown = false; });

  // ---------- clock / loop (anchored elapsed, rAF guarded) ----------
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var prevElapsed = 0;
  function frame() {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : t0;
    var elapsed = (now - t0) / 1000;
    var dt = Math.min(0.05, Math.max(0, elapsed - prevElapsed));
    prevElapsed = elapsed;
    lastElapsed = elapsed;
    for (var i = 0; i < 9; i++) {
      var tile = tiles[i];
      if (tile.open01 < tile.target) tile.open01 = Math.min(tile.target, tile.open01 + dt / 0.6);  // open ~0.6 s
      else if (tile.open01 > tile.target) tile.open01 = Math.max(tile.target, tile.open01 - dt / 0.5); // close ~0.5 s
    }
    if (activeMech >= 0 && tiles[activeMech].target === 1 && tiles[activeMech].open01 >= 0.99) {
      tiles[activeMech].phase += dt;      // only the active mechanism's clock runs
    }
    draw(elapsed);
  }

  resize();
  draw(0); // synchronous first frame: all nine flaps closed, fixed phase
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () { frame(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
