<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragmentation of the Continuum</title>
<style>
html, body { margin: 0; padding: 0; background: #030308; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#030308';
var PLATE = '#f4fbff';
var INK = '#14141c';
var SILVER = '#f2f5ff';
var HOLD = 3.0;
var PHASE = 5;
var PARTICLES_DESKTOP = 2200;
var PARTICLES_PHONE = 1200;
var MAX_FRONTS = 4;
/* A luminous shell expands across a dark field. Ahead of the front
   the continuum is still smooth and dark; behind it the continuum
   has fragmented into discrete particles that drift outward and
   slowly decay. Each front expands, stalls, and a new front begins
   from a new seed point: one experiment after another. Frame one is
   at t = 5 s: the first front is mid-expansion, so the thumb shows
   smooth dark ahead of the rim and particle grain behind it. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function rgb(c) {
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var SILVER_RGB = hexRgb(SILVER);
var RIM_RGB = hexRgb('#ff5a1e');
var RIM2_RGB = hexRgb('#ff8c2a');
var GOLD_RGB = hexRgb('#ffb347');
var BLUE_RGB = hexRgb('#3f7dff');
var BLUE2_RGB = hexRgb('#6fb7ff');
var SHEEN_RGB = hexRgb('#466ebe');
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Composition rect: full-bleed on phones, a centered square on
   desktop. The ground outside the square is the same black void,
   so the front simply leaves the rect into darkness. */
function rect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- authored front seeds, dealt in order. Each front differs in
   seed point, travel time, and hash seed. ---- */
var SEED_TABLE = [
  { bx: 0.50, by: 0.46, dur: 10.0, salt: 11 },
  { bx: 0.32, by: 0.62, dur: 11.5, salt: 29 },
  { bx: 0.68, by: 0.30, dur: 9.0, salt: 47 },
  { bx: 0.45, by: 0.72, dur: 12.0, salt: 63 },
  { bx: 0.62, by: 0.55, dur: 10.5, salt: 81 },
  { bx: 0.38, by: 0.36, dur: 9.5, salt: 97 }
];
var fronts = [];
var frontOrdinal = 0;
var tapOrdinal = 0;
function spawnFront(bx, by, t0, dur, salt) {
  var r = rect();
  var sx = r.x + bx * r.w, sy = r.y + by * r.h;
  /* Farthest corner from the seed, so the front always leaves. */
  var dx = Math.max(sx - r.x, r.x + r.w - sx);
  var dy = Math.max(sy - r.y, r.y + r.h - sy);
  var rmax = Math.sqrt(dx * dx + dy * dy) * 1.08;
  var seed = ((frontOrdinal * 2654435761 + salt * 104729 + 12345) >>> 0);
  var rnd = mulberry32(seed);
  var n = isPhone ? PARTICLES_PHONE : PARTICLES_DESKTOP;
  var parts = new Array(n);
  var i, u;
  for (i = 0; i < n; i++) {
    var th = rnd() * TAU;
    /* Radius biased toward the rim: the fresh grain is densest
       just behind the front. */
    var rf = 0.12 + 0.88 * Math.pow(rnd(), 0.7);
    var vp = 0.004 + 0.026 * rnd();
    var sz = 1.2 + 2.4 * rnd();
    var cl = rnd();
    var a0 = 0.55 + 0.45 * rnd();
    var om = (rnd() - 0.5) * 0.06;
    var col;
    if (cl < 0.42) col = RIM_RGB;
    else if (cl < 0.62) col = RIM2_RGB;
    else if (cl < 0.70) col = GOLD_RGB;
    else if (cl < 0.84) col = SILVER_RGB;
    else if (cl < 0.93) col = BLUE_RGB;
    else col = BLUE2_RGB;
    parts[i] = { th: th, rf: rf, vp: vp, sz: sz, a0: a0, om: om, col: col };
  }
  var f = {
    bx: bx, by: by, t0: t0, dur: dur, salt: salt,
    seed: seed, rmax: rmax, parts: parts, ordinal: frontOrdinal
  };
  frontOrdinal++;
  fronts.push(f);
  while (fronts.length > MAX_FRONTS) fronts.shift();
  return f;
}
function nextTableFront(t0) {
  var e = SEED_TABLE[(frontOrdinal) % SEED_TABLE.length];
  return spawnFront(e.bx, e.by, t0, e.dur, e.salt);
}
function ensureFronts(t) {
  if (fronts.length === 0) {
    var e0 = SEED_TABLE[0];
    spawnFront(e0.bx, e0.by, 0, e0.dur, e0.salt);
  }
  var last = fronts[fronts.length - 1];
  while (last.t0 + last.dur + HOLD <= t) {
    nextTableFront(last.t0 + last.dur + HOLD);
    last = fronts[fronts.length - 1];
  }
}
function frontRadius(f, t) {
  var local = t - f.t0;
  if (local <= 0) return 0;
  if (local >= f.dur) return f.rmax;
  return f.rmax * (local / f.dur);
}
function frontFraction(f, t) {
  return clamp((t - f.t0) / f.dur, 0, 1);
}
/* ---- tap: seed the next front at the tap point. A new experiment,
   never a restart; the old fronts keep decaying behind it. ---- */
function seedFrontAt(px, py) {
  var r = rect();
  var e = SEED_TABLE[frontOrdinal % SEED_TABLE.length];
  tapOrdinal++;
  return spawnFront(
    clamp((px - r.x) / r.w, 0.05, 0.95),
    clamp((py - r.y) / r.h, 0.05, 0.95),
    clockT, e.dur, e.salt + tapOrdinal * 131
  );
}
function onPointerDown(e) {
  if (!e) return;
  var x = (typeof e.clientX === 'number') ? e.clientX : VW / 2;
  var y = (typeof e.clientY === 'number') ? e.clientY : VH / 2;
  seedFrontAt(x, y);
  if (e.preventDefault) e.preventDefault();
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('mousedown', onPointerDown);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function drawDisc(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
}
function drawFront(f, t) {
  var r = rect();
  var sx = r.x + f.bx * r.w, sy = r.y + f.by * r.h;
  var R = frontRadius(f, t);
  if (R <= 0) return;
  var rf = frontFraction(f, t);
  var scale = clamp(Math.min(r.w, r.h) / 900, 0.6, 1.4);
  var i, p, age, rr, a, x, y, s;
  /* Faint smooth continuum just ahead of the front: an annulus
     from the rim outward, nothing more. */
  ctx.beginPath();
  ctx.moveTo(sx + R + 70, sy);
  ctx.arc(sx, sy, R + 70, 0, TAU);
  ctx.moveTo(sx + R, sy);
  ctx.arc(sx, sy, R, 0, TAU);
  ctx.fillStyle = rgba(SHEEN_RGB, 0.10);
  ctx.fill('evenodd');
  /* Particle wake, additive: only particles the front has passed
     are rendered; the rest stay hidden ahead of it. */
  ctx.globalCompositeOperation = 'lighter';
  var tEnd = f.t0 + f.dur;
  var fade = t > tEnd ? Math.exp(-(t - tEnd) / 6) : 1;
  for (i = 0; i < f.parts.length; i++) {
    p = f.parts[i];
    var tPass = f.t0 + p.rf * f.dur;
    if (t < tPass) continue;
    age = t - tPass;
    rr = (p.rf + p.vp * age) * f.rmax;
    if (rr > f.rmax * 1.25) continue;
    a = p.a0 * Math.exp(-age / 8) * fade;
    if (a < 0.02) continue;
    var th = p.th + p.om * age;
    x = sx + Math.cos(th) * rr;
    y = sy + Math.sin(th) * rr;
    s = p.sz * scale;
    ctx.fillStyle = rgba(p.col, a);
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }
  /* The front itself: silver-white rim, red-orange rim just inside,
     and a soft glow ring. */
  ctx.strokeStyle = rgba(SILVER_RGB, 0.10);
  ctx.lineWidth = 10;
  drawDisc(sx, sy, R);
  ctx.stroke();
  ctx.strokeStyle = rgba(RIM_RGB, 0.55);
  ctx.lineWidth = 3;
  drawDisc(sx, sy, Math.max(R - 7, 1));
  ctx.stroke();
  ctx.strokeStyle = rgba(SILVER_RGB, 0.95);
  ctx.lineWidth = 2.5;
  drawDisc(sx, sy, R);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Fragmentation of the Continuum').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Fragmentation of the Continuum').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 22').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(hexRgb(INK), 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Fragmentation of the Continuum', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(hexRgb(INK), 0.8);
  ctx.fillText('2006 · 07 · 22', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap to seed the next front.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(hexRgb(INK), 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(hexRgb(INK), 0.9);
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
var clockT = PHASE;
function draw(t) {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  ensureFronts(t);
  var r = rect();
  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x, r.y, r.w, r.h);
  ctx.clip();
  var i;
  for (i = 0; i < fronts.length; i++) drawFront(fronts[i], t);
  ctx.restore();
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { clockT = t; draw(t); },
    frontRadius: function (t) {
      ensureFronts(t);
      return frontRadius(fronts[0], t);
    },
    frontFraction: function (t) {
      ensureFronts(t);
      return frontFraction(fronts[0], t);
    },
    counts: function (t) {
      ensureFronts(t);
      var f = fronts[0], rf = frontFraction(f, t);
      var behind = 0, ahead = 0, i;
      for (i = 0; i < f.parts.length; i++) {
        if (f.parts[i].rf <= rf) behind++; else ahead++;
      }
      return { total: f.parts.length, behind: behind, aheadHidden: ahead, frontFraction: rf };
    },
    frontCount: function () { return fronts.length; },
    frontSeeds: function () {
      var out = [], i;
      for (i = 0; i < fronts.length; i++) out.push(fronts[i].seed);
      return out;
    },
    frontPoints: function () {
      var out = [], i;
      for (i = 0; i < fronts.length; i++) out.push([fronts[i].bx, fronts[i].by]);
      return out;
    },
    tap: function (x, y) { return seedFrontAt(x, y); },
    clock: function () { return clockT; }
  };
}
/* ---- frame one: fixed phase, fixed seeds, no wall clock ---- */
size();
var prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
