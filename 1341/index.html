<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Speech Bubble</title>
<style>
html, body { margin: 0; padding: 0; background: #101418; overflow: hidden; height: 100%; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
"use strict";
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var FRAGS = [
  "...the truth is, my grandmother...",
  "...the truth is, I forgive...",
  "...the truth is, we were here first..."
];
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0;
var lastT = 0;
var boot = true;

function isPhone() {
  try {
    var s = window.screen;
    if (s && s.width && s.height) { return Math.min(s.width, s.height) < 700; }
  } catch (e) {}
  return H > W * 1.15;
}
function size() {
  var vw, vh;
  try {
    vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  } catch (e) { vw = window.innerWidth; vh = window.innerHeight; }
  if (!vw) { vw = 1280; }
  if (!vh) { vh = 900; }
  W = vw; H = vh;
  canvas.width = Math.round(W);
  canvas.height = Math.round(H);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
}
size();
try {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", size);
  }
  if (window.addEventListener) { window.addEventListener("resize", size); }
} catch (e) {}

/* Seeded ambient fragment schedule: spawn every 2.2-4.2 s, rise ~13-17 s,
   so at most about 7 are ever visible at once (cap is 12). */
var ambient = [];
(function () {
  var r = mulberry32(1341001);
  /* Three fragments already mid-rise at t = 0, so frame one shows
     fragments rising toward the bubble's lower curve. */
  ambient.push(
    { t0: -4.0, x: 0.30, v: 0.065, fi: 0, sway: 1.1, swayAmp: 10 },
    { t0: -2.4, x: 0.62, v: 0.070, fi: 1, sway: 3.4, swayAmp: 12 },
    { t0: -0.9, x: 0.45, v: 0.060, fi: 2, sway: 5.2, swayAmp: 8 }
  );
  var t = 0.5;
  for (var i = 0; i < 240; i++) {
    ambient.push({
      t0: t,
      x: 0.10 + r() * 0.80,
      v: 0.058 + r() * 0.022,
      fi: i % 3,
      sway: r() * 6.283,
      swayAmp: 6 + r() * 14
    });
    t += 2.2 + r() * 2.0;
  }
})();
/* Seeded ember dots drifting up beside the fragments. */
var embers = [];
(function () {
  var r = mulberry32(1341002);
  for (var i = 0; i < 26; i++) {
    embers.push({
      x: 0.06 + r() * 0.88,
      v: 0.045 + r() * 0.03,
      ph: r() * 6.283,
      sz: 1.2 + r() * 1.8,
      off: r() * 18
    });
  }
})();
var offered = [];
var offeredCount = 0;
var dragStart = null;

function bubbleGeom() {
  var R = Math.min(W * 0.32, H * 0.34);
  return { cx: W / 2, cy: H * 0.40, R: R };
}
function breath(t) { return 1 + 0.015 * Math.sin(t * 1.047); }
function pulseAt(t) {
  var p = 0;
  var g = bubbleGeom();
  var absorbY = g.cy + g.R;
  function acc(t0, v, x) {
    var ta = t0 + (H + 30 - absorbY) / (v * H);
    if (t >= ta && t < ta + 1.6) { p += Math.exp(-(t - ta) / 0.55); }
  }
  for (var i = 0; i < ambient.length; i++) {
    var a = ambient[i];
    if (a.t0 > t + 1) { break; }
    acc(a.t0, a.v, a.x);
  }
  for (var j = 0; j < offered.length; j++) {
    var o = offered[j];
    acc(o.t0, o.v, o.x);
  }
  return Math.min(p, 1.4);
}
function drawBubble(t, pulse) {
  var g = bubbleGeom();
  var R = g.R * breath(t) * (1 + 0.02 * pulse);
  var cx = g.cx, cy = g.cy;
  /* Warm outer glow: two low-alpha layered ellipses, no gradients. */
  var glows = [
    [1.60, 0.04], [1.25, 0.05]
  ];
  for (var i = 0; i < glows.length; i++) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - R * glows[i][0]);
    ctx.ellipse(cx, cy, R * glows[i][0], R * glows[i][0] * 0.92, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,233,196," + (glows[i][1] + 0.05 * pulse) + ")";
    ctx.fill();
  }
  /* Tail: a tapered wedge from the bubble's lower-left curve. */
  ctx.beginPath();
  ctx.moveTo(cx - R * 0.42, cy + R * 0.72);
  ctx.quadraticCurveTo(cx - R * 0.70, cy + R * 1.05, cx - R * 0.88, cy + R * 1.38);
  ctx.quadraticCurveTo(cx - R * 0.45, cy + R * 1.15, cx - R * 0.08, cy + R * 0.95);
  ctx.closePath();
  ctx.fillStyle = "#FDFBF6";
  ctx.fill();
  /* Body: soft-edged bezier blob, slightly wobbled by fixed harmonics. */
  ctx.beginPath();
  var steps = 48;
  for (var k = 0; k <= steps; k++) {
    var a = (k / steps) * Math.PI * 2;
    var wob = 1 + 0.012 * Math.sin(3 * a + 0.7) + 0.008 * Math.cos(5 * a);
    var px = cx + Math.cos(a) * R * wob;
    var py = cy + Math.sin(a) * R * 0.92 * wob;
    if (k === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
  }
  ctx.closePath();
  ctx.fillStyle = "#FDFBF6";
  ctx.fill();
  /* Inner warm light near the lower curve where fragments are absorbed. */
  ctx.beginPath();
  ctx.moveTo(cx, cy + R * 0.55);
  ctx.ellipse(cx, cy + R * 0.42, R * 0.55, R * 0.30, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,233,196," + (0.18 + 0.22 * pulse) + ")";
  ctx.fill();
}
function drawCables(t) {
  var g = bubbleGeom();
  var R = g.R * breath(t);
  var tops = [
    [g.cx - R * 0.42, g.cy + R * 0.80],
    [g.cx + R * 0.42, g.cy + R * 0.80]
  ];
  var feet = [
    [g.cx - R * 0.62, H],
    [g.cx + R * 0.62, H]
  ];
  for (var i = 0; i < 2; i++) {
    ctx.beginPath();
    ctx.moveTo(tops[i][0], tops[i][1]);
    ctx.lineTo(feet[i][0], feet[i][1]);
    ctx.strokeStyle = "#3A3F45";
    ctx.lineWidth = Math.max(1.5, Math.min(W, H) * 0.002);
    ctx.stroke();
    /* Tether lights pulsing along each cable. */
    for (var j = 1; j <= 4; j++) {
      var f = j / 5;
      var lx = tops[i][0] + (feet[i][0] - tops[i][0]) * f;
      var ly = tops[i][1] + (feet[i][1] - tops[i][1]) * f;
      var al = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 2.2 + i * 2.1 + j * 1.3));
      ctx.beginPath();
      ctx.moveTo(lx, ly - 3);
      ctx.arc(lx, ly, 3, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(78,155,142," + al.toFixed(3) + ")";
      ctx.fill();
    }
  }
}
function drawFragment(f, t, v, x, fi, sway, swayAmp) {
  var g = bubbleGeom();
  var absorbY = g.cy + g.R;
  var y = H + 30 - v * H * (t - f);
  if (y < absorbY - 40 || t < f) { return; }
  var fx = x * W + Math.sin(t * 0.5 + sway) * swayAmp;
  var age = t - f;
  var alpha = 1;
  if (age < 1) { alpha = age; }
  var dist = y - absorbY;
  var scale = 1;
  if (dist < 60) {
    var k = dist / 60;
    alpha *= (0.25 + 0.75 * k);
    scale = 0.55 + 0.45 * k;
  }
  var fs = Math.max(13, Math.min(22, Math.min(W, H) * 0.024)) * scale;
  ctx.font = fs + "px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(216,210,196," + alpha.toFixed(3) + ")";
  ctx.fillText(FRAGS[fi], fx, y);
}
function drawEmbers(t) {
  for (var i = 0; i < embers.length; i++) {
    var e = embers[i];
    var y = ((H + 40 - e.off - e.v * H * t) % (H + 60) + H + 60) % (H + 60) - 30;
    var x = e.x * W + Math.sin(t * 0.7 + e.ph) * 12;
    var tw = 0.5 + 0.5 * Math.sin(t * 2.4 + e.ph * 2);
    ctx.beginPath();
    ctx.moveTo(x, y - e.sz);
    ctx.arc(x, y, e.sz, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(232,160,76," + (0.15 + 0.35 * tw).toFixed(3) + ")";
    ctx.fill();
  }
}
function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = "#101418";
  ctx.fillRect(0, 0, W, H);
  /* Faint plaza floor band. */
  ctx.fillStyle = "rgba(255,255,255,0.02)";
  ctx.fillRect(0, H * 0.86, W, H * 0.14);
  var pulse = pulseAt(t);
  drawCables(t);
  drawBubble(t, pulse);
  drawEmbers(t);
  for (var i = 0; i < ambient.length; i++) {
    var a = ambient[i];
    if (a.t0 > t) { break; }
    drawFragment(a.t0, t, a.v, a.x, a.fi, a.sway, a.swayAmp);
  }
  for (var j = 0; j < offered.length; j++) {
    var o = offered[j];
    drawFragment(o.t0, t, o.v, o.x, o.fi, o.sway, o.swayAmp);
  }
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
}
draw(0);
boot = false;
if (typeof requestAnimationFrame === "function") {
  var start = null;
  function loop(now) {
    if (start === null) { start = now; }
    var t = (now - start) / 1000;
    if (t < 0) { t = 0; }
    draw(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
if (canvas.addEventListener) {
  canvas.addEventListener("pointerdown", function (ev) {
    dragStart = { x: ev.clientX, y: ev.clientY, t: lastT };
  });
  canvas.addEventListener("pointerup", function (ev) {
    if (!dragStart) { return; }
    var dy = ev.clientY - dragStart.y;
    var startedLow = dragStart.y > H * 0.65;
    if (startedLow && dy < -30) {
      offered.push({
        t0: lastT,
        x: Math.max(0.08, Math.min(0.92, ev.clientX / W)),
        v: 0.09,
        fi: offeredCount % 3,
        sway: offeredCount * 1.7,
        swayAmp: 8
      });
      offeredCount++;
    }
    dragStart = null;
  });
  canvas.addEventListener("pointercancel", function () { dragStart = null; });
}
})();
</script>
</body>
</html>
