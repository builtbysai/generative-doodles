<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcae</title>
<style>
html, body { margin: 0; padding: 0; background: #0D0D0F; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var WARP = '#0D0D0F';
var THREADS = ['#1A1A1E', '#242428', '#2E2E34'];
var PALE = '#4A4A52';
var TEXT = '#7E7E88';
var PHASE = 1.0;
var SEED = 1617007;
/* Loom dates. One row per calendar day from START; TOTAL rows fill the cloth
   at completion. FIXED_REF is the frame-one reference date: 2026-11-07, which
   is 4821 days after START, so the frame-one counter reads STITCH 4821 / 51472. */
var START_MS = Date.UTC(2013, 7, 26);
var TOTAL = 51472;
var FIXED_REF_MS = Date.UTC(2026, 10, 7);
var DAY_MS = 86400000;
var FRESH = 24;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function dayIndex(ms) { return Math.floor((ms - START_MS) / DAY_MS); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
var compRectCache = { x: 0, y: 0, w: 0, h: 0 };
var shownDay = dayIndex(FIXED_REF_MS);
var todayP = 1;
var animating = false, animStart = 0, animDay = 0;
var dirty = true;
var drag = { active: false, x: 0, y: 0, strength: 0, spring: false, springT0: 0 };
function threadTone(rng) {
  var r = rng();
  if (r < 0.04) return PALE;
  if (r < 0.24) return THREADS[2];
  if (r < 0.62) return THREADS[1];
  return THREADS[0];
}
function drawWarp(rect) {
  var col, x;
  for (col = 0; col * 2 < rect.w; col++) {
    x = rect.x + col * 2;
    var rng = mulberry32(SEED + col * 7919);
    var tone = threadTone(rng);
    ctx.fillStyle = rgba(hexRgb(tone), 0.30 + rng() * 0.35);
    ctx.fillRect(x, rect.y, 1, rect.h);
  }
}
function drawBand(rect) {
  var pitch = rect.h / TOTAL;
  var bandH = shownDay * pitch;
  var py, n = Math.floor(bandH);
  for (py = 0; py < n; py++) {
    var d = Math.floor(py / pitch);
    var rng = mulberry32((d * 2654435761) >>> 0);
    ctx.fillStyle = threadTone(rng);
    ctx.globalAlpha = 0.9;
    ctx.fillRect(rect.x, rect.y + py, rect.w, 1);
  }
  ctx.globalAlpha = 1;
  return rect.y + bandH;
}
function stitchCount(rect) {
  return Math.max(1, Math.floor((rect.w - 8) / 10));
}
function dragDisp(sx, sy, rowAge, rect) {
  if (drag.strength <= 0.001) return { dx: 0, dy: 0 };
  var dxp = sx - drag.x, dyp = sy - drag.y;
  var g = Math.exp(-(dxp * dxp) / (2 * 90 * 90)) * Math.exp(-(dyp * dyp) / (2 * 42 * 42));
  if (g < 0.01) return { dx: 0, dy: 0 };
  var fall = 1 / (1 + rowAge * 0.35);
  var s = drag.strength * g * fall;
  return { dx: s * 14 * (dxp >= 0 ? 1 : -1), dy: s * 3 * (dyp >= 0 ? 1 : -1) };
}
function drawFresh(rect, bandBottom) {
  var stripTop = bandBottom - FRESH;
  var nSt = stitchCount(rect);
  var r, s;
  ctx.lineWidth = 1;
  for (r = 0; r < FRESH; r++) {
    var d = shownDay - FRESH + r;
    if (d < 0) continue;
    var y = stripTop + r + 0.5;
    var rowAge = (shownDay - 1) - d;
    var isToday = (d === shownDay - 1);
    var limit = nSt;
    if (isToday && animating) limit = Math.floor(nSt * clamp(todayP, 0, 1));
    for (s = 0; s < limit; s++) {
      var rng = mulberry32(((d * 1315423911 + s * 2654435761) >>> 0));
      var tone = threadTone(rng);
      if (isToday && rng() < 0.10) tone = PALE;
      var sx = rect.x + 4 + s * 10 + (rng() - 0.5) * 2;
      var sy = y + (rng() - 0.5) * 0.8;
      var len = 6 + rng() * 2;
      var dd = dragDisp(sx + len / 2, sy, rowAge, rect);
      ctx.strokeStyle = tone;
      ctx.globalAlpha = isToday ? 0.95 : 0.8;
      ctx.beginPath();
      ctx.moveTo(sx + dd.dx, sy + dd.dy);
      ctx.lineTo(sx + len + dd.dx, sy + dd.dy);
      ctx.stroke();
    }
    if (isToday && animating && todayP < 1) {
      var nx = rect.x + 4 + limit * 10;
      ctx.strokeStyle = PALE;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(nx, y - 3);
      ctx.lineTo(nx, y + 3);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
function drawText(rect) {
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = TEXT;
  ctx.fillText('Parcae', rect.x + rect.w / 2, rect.y + Math.max(10, 0.018 * rect.h));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(hexRgb(TEXT), 0.65);
  ctx.fillText('2006 · 06 · 16', rect.x + rect.w / 2, rect.y + Math.max(10, 0.018 * rect.h) + titlePx + 5);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = TEXT;
  ctx.fillText('STITCH ' + shownDay + ' / ' + TOTAL, rect.x + rect.w / 2, rect.y + rect.h - smallPx - 30);
  ctx.fillStyle = rgba(hexRgb(TEXT), 0.6);
  ctx.fillText("Drag to disturb today's row.", rect.x + rect.w / 2, rect.y + rect.h - smallPx - 12);
}
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  compRectCache = rect;
  ctx.fillStyle = WARP;
  ctx.fillRect(0, 0, VW, VH);
  drawWarp(rect);
  var bandBottom = drawBand(rect);
  drawFresh(rect, bandBottom);
  drawText(rect);
  dirty = false;
}
function pointerPos(e) {
  var x = (typeof e.clientX === 'number') ? e.clientX : 0;
  var y = (typeof e.clientY === 'number') ? e.clientY : 0;
  if (canvas.getBoundingClientRect) {
    var r = canvas.getBoundingClientRect();
    x -= r.left; y -= r.top;
  }
  return { x: x, y: y };
}
function onDown(e) {
  var p = pointerPos(e);
  drag.active = true;
  drag.spring = false;
  drag.x = p.x; drag.y = p.y;
  drag.strength = Math.min(1, drag.strength + 0.4);
  dirty = true;
  draw(lastT);
}
function onMove(e) {
  if (!drag.active) return;
  var p = pointerPos(e);
  drag.x = p.x; drag.y = p.y;
  drag.strength = Math.min(1, drag.strength + 0.25);
  dirty = true;
  draw(lastT);
}
function onUp() {
  if (!drag.active) return;
  drag.active = false;
  if (reduced) { drag.strength = 0; dirty = true; draw(lastT); return; }
  drag.spring = true;
  drag.springT0 = lastT;
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  var startT = null, prevT = PHASE;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    var dt = Math.min(0.1, Math.max(0, t - prevT));
    prevT = t;
    if (!animating) {
      var realDay = dayIndex(Date.now());
      if (realDay > shownDay) {
        animating = true;
        animDay = shownDay;
        animStart = t;
        todayP = 0;
        shownDay = realDay;
      }
    }
    if (animating) {
      todayP = clamp((t - animStart) / 5, 0, 1);
      if (todayP >= 1) { animating = false; todayP = 1; }
      dirty = true;
    }
    if (drag.active) {
      drag.strength = Math.min(1, drag.strength + dt * 4);
      dirty = true;
    } else if (drag.spring) {
      var st = t - drag.springT0;
      drag.strength = Math.exp(-st / 0.6) * Math.cos(st * 8);
      if (Math.abs(drag.strength) < 0.02 || st > 4) { drag.strength = 0; drag.spring = false; }
      dirty = true;
    }
    if (dirty) draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
