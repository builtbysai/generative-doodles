<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter Cards That Heckle</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #b8bcc0; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded PRNG (mulberry32), never Math.random ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (prompt only) ----------
  var GREY = '#b8bcc0';      // broadcast ground
  var CHARCOAL = '#2a2a30';  // suits
  var SCARLET = '#c1272d';
  var GOLD = '#d9a441';
  var TEAL = '#2e6f6a';
  var CREAM = '#e8e0d0';     // panel frame + card shapes

  // ---------- sizing: Visual Viewport API ----------
  var W = 0, H = 0;
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  size();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(now); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { size(); draw(now); });
    }
  }

  // ---------- broadcast figures: 2 rows x 5, seeded mouth beats ----------
  var FIGURES = [];
  (function () {
    var periods = [2, 2.4, 3, 4, 6]; // every period divides the 24 s loop
    for (var i = 0; i < 10; i++) {
      var r = mulberry32(1489000 + i * 7919);
      FIGURES.push({
        col: i % 5,
        row: (i < 5) ? 0 : 1,
        period: periods[Math.floor(r() * periods.length)],
        phase: r() * Math.PI * 2,
        seed: r()
      });
    }
  })();

  // ---------- chapter cards: queue array, slide-in / stick / slide-out ----------
  var CARDS = [
    { color: SCARLET, shape: 'disc' },
    { color: GOLD, shape: 'bar' },
    { color: TEAL, shape: 'triangle' }
  ];
  var LOOP = 24;          // seconds, 3 cards x 8 s slots
  var PHASE = 3;          // frame one opens with card 0 arrived and settled
  var BASE_ORDER = [0, 1, 2];
  var swapEvents = [];    // recorded drag swaps: { time, slot }
  var now = 0;

  function orderAt(t) {
    var order = BASE_ORDER.slice();
    for (var i = 0; i < swapEvents.length; i++) {
      var e = swapEvents[i];
      if (e.time <= t) {
        var a = e.slot, b = (e.slot + 1) % 3;
        var tmp = order[a]; order[a] = order[b]; order[b] = tmp;
      }
    }
    return order;
  }

  function cardState(t) {
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var cp = (lt + PHASE) % LOOP;
    var slot = Math.floor(cp / 8);
    var st = cp % 8;
    return { slot: slot, st: st, order: orderAt(t) };
  }

  function cardRect() {
    var cw = W * 0.30, ch = H * 0.36;
    return { w: cw, h: ch, y: (H - ch) / 2, targetX: W - cw };
  }

  function cardX(st) {
    var r = cardRect();
    if (st < 1) {
      var p = st, e = p * p * (3 - 2 * p);
      return W + (r.targetX - W) * e;
    }
    if (st < 6) return r.targetX;
    if (st < 7) {
      var q = st - 6, f = q * q * (3 - 2 * q);
      return r.targetX + (W - r.targetX) * f;
    }
    return W + 1; // fully off-screen during the gap
  }

  function drawFigure(f, lt) {
    var ux = Math.min(W * 0.085, H * 0.10);
    var xs = W * 0.10 + f.col * W * 0.16;
    var ys = (f.row === 0) ? H * 0.26 : H * 0.62;
    var tw = ux * 0.9, th = H * 0.17;
    // torso
    ctx.fillStyle = CHARCOAL;
    ctx.fillRect(xs, ys, tw, th);
    // head
    var hx = xs + tw / 2, hy = ys - ux * 0.42, hr = ux * 0.42;
    ctx.beginPath();
    ctx.moveTo(hx + hr, hy);
    ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    ctx.fillStyle = CHARCOAL;
    ctx.fill();
    // mouth: opens/closes on a seeded beat; period divides LOOP, loop-local time
    var w = Math.round(2 + 4 * (0.5 + 0.5 * Math.sin(2 * Math.PI * lt / f.period + f.phase)));
    ctx.fillStyle = GREY;
    ctx.fillRect(hx - w / 2, hy + hr * 0.25, w, Math.max(2, ux * 0.05));
  }

  function drawCard(card, x, r) {
    ctx.fillStyle = card.color;
    ctx.fillRect(x, r.y, r.w, r.h);
    ctx.fillStyle = CREAM;
    if (card.shape === 'disc') {
      var cr = Math.min(r.w, r.h) * 0.22;
      ctx.beginPath();
      ctx.moveTo(x + r.w / 2 + cr, r.y + r.h / 2);
      ctx.arc(x + r.w / 2, r.y + r.h / 2, cr, 0, Math.PI * 2);
      ctx.fill();
    } else if (card.shape === 'bar') {
      ctx.fillRect(x + r.w * 0.28, r.y + r.h / 2 - r.h * 0.05, r.w * 0.44, r.h * 0.10);
    } else {
      var tx = x + r.w / 2, ty = r.y + r.h / 2, s = Math.min(r.w, r.h) * 0.22;
      ctx.beginPath();
      ctx.moveTo(tx, ty - s);
      ctx.lineTo(tx - s, ty + s);
      ctx.lineTo(tx + s, ty + s);
      ctx.closePath();
      ctx.fill();
    }
  }

  function draw(t) {
    now = t;
    var lt = ((t % LOOP) + LOOP) % LOOP;
    size();
    // broadcast ground
    ctx.fillStyle = GREY;
    ctx.fillRect(0, 0, W, H);
    // cream panel frame
    ctx.strokeStyle = CREAM;
    ctx.lineWidth = Math.max(4, Math.min(W, H) * 0.012);
    ctx.strokeRect(ctx.lineWidth / 2, ctx.lineWidth / 2, W - ctx.lineWidth, H - ctx.lineWidth);
    // figures
    for (var i = 0; i < FIGURES.length; i++) drawFigure(FIGURES[i], lt);
    // card timeline
    var cs = cardState(t);
    var card = CARDS[cs.order[cs.slot]];
    var r = cardRect();
    if (cs.st < 7) {
      drawCard(card, cardX(cs.st), r);
    } else {
      // gap: scene resumes, slightly changed in the departed card's color
      ctx.fillStyle = card.color;
      ctx.globalAlpha = 0.15;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- drag: swap on-screen card with next card in queue ----------
  var drag = null;
  function pointInCard(x, y) {
    var cs = cardState(now);
    if (cs.st >= 7) return false;
    var r = cardRect();
    var cx = cardX(cs.st);
    return x >= cx && x <= cx + r.w && y >= r.y && y <= r.y + r.h;
  }
  function onDown(x, y, t) {
    now = t;
    if (pointInCard(x, y)) {
      var cs = cardState(t);
      drag = { startY: y, lastY: y, slot: cs.slot };
    } else {
      drag = null;
    }
  }
  function onMove(x, y, t) {
    now = t;
    if (drag) drag.lastY = y;
  }
  function onUp(x, y, t) {
    now = t;
    if (drag) {
      var dy = y - drag.startY;
      if (Math.abs(dy) >= 40) {
        swapEvents.push({ time: t, slot: drag.slot });
      }
      drag = null;
      draw(t);
    }
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY, now); });
    canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY, now); });
    canvas.addEventListener('pointerup', function (e) { onUp(e.clientX, e.clientY, now); });
  }

  // ---------- boot: fixed-phase first frame, clock starts with rAF ----------
  draw(0);
  var startTime = null;
  function loop(ts) {
    if (startTime === null) startTime = ts;
    draw((ts - startTime) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

  // ---------- probe interface (node harness only) ----------
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      down: onDown,
      move: onMove,
      up: onUp,
      order: function (t) { return orderAt(typeof t === 'number' ? t : now); },
      cardAt: function (t) { var cs = cardState(t); return CARDS[cs.order[cs.slot]]; }
    };
  }
})();
</script>
</body>
</html>
