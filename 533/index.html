<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcadia</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F7F1E3; overflow: hidden; }
  canvas { display: block; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: THREE inks only (riso print). Flat fills, no gradients anywhere, ever.
  var BLUE = '#2B5FA6',   // water and tree
      TERRA = '#C96F4A',  // rocks and swimmer
      CREAM = '#F7F1E3';  // paper

  var PHASE0 = 3.0;  // constant first-frame loop phase (seconds): arm at rest between waves, leaf attached, offsets fixed
  var WAVE_CYCLE = 8;   // the raised arm waves once every 8 seconds
  var LEAF_CYCLE = 16;  // one leaf falls per 16-second loop

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---- composition geometry (1080 x 1080 design space) ----
  var HORIZON = 486;          // sky takes the top 45%
  var SEA_BOT = 800;          // sea band across the middle
  var CANOPY = { x: 222, y: 330, r: 172 };
  var ROCKS = [
    { x: 310, y: 824, rx: 212, ry: 90 },
    { x: 120, y: 858, rx: 126, ry: 56 },
    { x: 492, y: 850, rx: 116, ry: 52 }
  ];
  var SWIM = { x: 335, feet: 736 };   // swimmer stands on the tallest rock

  // notched canopy outline: a circle with a subtly irregular edge (seeded sine harmonics, ~3% total)
  var crng = mulberry32(533101);
  var CAN_FREQS = [7, 13, 23];
  var CAN_HARM = [];
  for (var ci = 0; ci < 3; ci++) {
    CAN_HARM.push({ n: CAN_FREQS[ci], amp: 0.011 - ci * 0.002, ph: crng() * Math.PI * 2 });
  }
  function canopyRadius(a) {
    var r = CANOPY.r;
    for (var i = 0; i < CAN_HARM.length; i++) {
      r *= 1 + CAN_HARM[i].amp * Math.sin(CAN_HARM[i].n * a + CAN_HARM[i].ph);
    }
    return r;
  }
  function canopyPath() {
    ctx.beginPath();
    var steps = 72;
    for (var i = 0; i <= steps; i++) {
      var a = i / steps * Math.PI * 2;
      var r = canopyRadius(a);
      var x = CANOPY.x + Math.cos(a) * r, y = CANOPY.y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // ---- riso grain: precomputed seeded speck arrays, one per ink, clipped to that ink's regions ----
  function inEllipse(x, y, e) {
    var dx = (x - e.x) / e.rx, dy = (y - e.y) / e.ry;
    return dx * dx + dy * dy <= 1;
  }
  var grng = mulberry32(533202);
  var blueSpecks = [];
  while (blueSpecks.length < 380) {
    var bx = grng() * 1080, by = grng() * 1080;
    var inSea = by >= HORIZON && by <= SEA_BOT;
    var dcx = bx - CANOPY.x, dcy = by - CANOPY.y;
    var inCan = dcx * dcx + dcy * dcy <= CANOPY.r * CANOPY.r;
    if (inSea || inCan) blueSpecks.push({ x: bx, y: by, r: 1.2 + grng() * 2.2, a: 0.05 + grng() * 0.08 });
  }
  var terraSpecks = [];
  while (terraSpecks.length < 150) {
    var tx = grng() * 640, ty = 700 + grng() * 220;
    var hit = false;
    for (var ri = 0; ri < ROCKS.length; ri++) if (inEllipse(tx, ty, ROCKS[ri])) { hit = true; break; }
    if (hit) terraSpecks.push({ x: tx, y: ty, r: 1.2 + grng() * 2.2, a: 0.05 + grng() * 0.08 });
  }

  // ---- misregistration: each ink layer drifts slowly around its base offset ----
  function offBlue(t)  { return { x: 2 * Math.sin(t * 0.11),        y: 2 * Math.cos(t * 0.09 + 1.3) }; }
  function offTerra(t) { return { x: -2 * Math.sin(t * 0.13 + 2.0), y: 2 * Math.sin(t * 0.07 + 0.6) }; }

  // ---- sizing (Visual Viewport API; square stage centred; page ground is the paper cream) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw(simT);
  }

  // ---- swimmer glyph: flat terracotta figure, local origin at the feet, height 162 ----
  function drawSwimmer(t) {
    ctx.save();
    ctx.translate(SWIM.x, SWIM.feet);
    ctx.strokeStyle = TERRA;
    ctx.fillStyle = TERRA;
    ctx.lineCap = 'round';
    // legs
    ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(-7, -74); ctx.lineTo(-9, -2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, -74); ctx.lineTo(11, -2); ctx.stroke();
    // resting arm (left, down along the body)
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(-13, -126); ctx.lineTo(-20, -80); ctx.stroke();
    // raised arm (right): upper arm fixed, forearm waves once per WAVE_CYCLE
    ctx.beginPath(); ctx.moveTo(13, -126); ctx.lineTo(31, -150); ctx.stroke();
    var wp = t % WAVE_CYCLE;
    var wave = 0;
    if (wp < 1.6) {
      var u = wp / 1.6;
      wave = Math.sin(u * Math.PI * 4) * 0.45 * Math.sin(u * Math.PI);
    }
    var fa = 0.35 + wave; // forearm angle from vertical
    var ex = 31, ey = -150;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex + 30 * Math.sin(fa), ey - 30 * Math.cos(fa));
    ctx.stroke();
    // torso
    ctx.beginPath(); ctx.ellipse(0, -102, 16, 32, 0, 0, Math.PI * 2); ctx.fill();
    // head
    ctx.beginPath(); ctx.arc(0, -148, 13.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---- the falling leaf (blue ink, from the tree) ----
  var LEAF_START = { x: 372, y: 446 }, LEAF_END = { x: 420, y: 695 };
  function drawLeaf(t) {
    var lt = t % LEAF_CYCLE;
    var x, y, rot;
    if (lt < 9) {           // attached at the canopy edge
      x = LEAF_START.x; y = LEAF_START.y; rot = 0.7;
    } else if (lt <= 13.5) { // falling
      var p = (lt - 9) / 4.5;
      x = LEAF_START.x + (LEAF_END.x - LEAF_START.x) * p + Math.sin(p * Math.PI * 2) * 14;
      y = LEAF_START.y + (LEAF_END.y - LEAF_START.y) * Math.pow(p, 1.15);
      rot = 0.7 + p * 2.2;
    } else {
      return;               // sunk in the sea for the rest of the loop
    }
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = BLUE;
    ctx.beginPath();
    ctx.moveTo(0, -13);
    ctx.quadraticCurveTo(9, -4, 0, 13);
    ctx.quadraticCurveTo(-9, -4, 0, -13);
    ctx.fill();
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // paper ground everywhere (page ground matches the piece ground)
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    // ---------- BLUE layer (sea + tree), misregistered ----------
    var ob = offBlue(t);
    ctx.save();
    ctx.translate(ob.x, ob.y);
    // sea band across the middle
    ctx.fillStyle = BLUE;
    ctx.fillRect(-8, HORIZON, 1096, SEA_BOT - HORIZON);
    // water shimmer: two offset dashed sine bands, cream ink at low opacity over the blue
    ctx.strokeStyle = CREAM;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.16;
    ctx.lineWidth = 4.5;
    ctx.setLineDash([46, 30]);
    ctx.beginPath();
    for (var x1 = -8; x1 <= 1088; x1 += 8) {
      var y1 = 566 + Math.sin(x1 * 0.011 + t * 0.7) * 7;
      if (x1 === -8) ctx.moveTo(x1, y1); else ctx.lineTo(x1, y1);
    }
    ctx.stroke();
    ctx.setLineDash([30, 42]);
    ctx.beginPath();
    for (var x2 = -8; x2 <= 1088; x2 += 8) {
      var y2 = 672 + Math.sin(x2 * 0.008 - t * 0.5 + 2.1) * 8;
      if (x2 === -8) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    // tree: thick trunk + flat circular notched canopy, breaking the horizon line
    ctx.fillStyle = BLUE;
    ctx.fillRect(200, 430, 44, 470);
    canopyPath();
    ctx.fill();
    // the leaf rides with the blue layer
    drawLeaf(t);
    // blue grain, confined to sea and canopy
    ctx.fillStyle = BLUE;
    for (var i = 0; i < blueSpecks.length; i++) {
      var bs = blueSpecks[i];
      ctx.globalAlpha = bs.a;
      ctx.beginPath(); ctx.arc(bs.x, bs.y, bs.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // ---------- TERRACOTTA layer (rocks + swimmer), misregistered ----------
    var ot = offTerra(t);
    ctx.save();
    ctx.translate(ot.x, ot.y);
    ctx.fillStyle = TERRA;
    for (i = 0; i < ROCKS.length; i++) {
      var rk = ROCKS[i];
      ctx.beginPath(); ctx.ellipse(rk.x, rk.y, rk.rx, rk.ry, 0, 0, Math.PI * 2); ctx.fill();
    }
    drawSwimmer(t);
    // terracotta grain, confined to the rocks
    ctx.fillStyle = TERRA;
    for (i = 0; i < terraSpecks.length; i++) {
      var ts = terraSpecks[i];
      ctx.globalAlpha = ts.a;
      ctx.beginPath(); ctx.arc(ts.x, ts.y, ts.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.restore();
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
