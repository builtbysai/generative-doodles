<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trickster Cursor</title>
<style>
  html, body { margin: 0; padding: 0; background: #101114; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1389000);

  // Viewport: Visual Viewport API, resize on visualViewport and window.
  function viewport() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return { w: w, h: h };
  }
  function isPhone() {
    var s = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (s) {
      var mn = Math.min(s.width, s.height);
      if (mn < 700) return true;
    }
    var v = viewport();
    return v.h > v.w * 1.15;
  }

  // Seeded per-cabinet variation, fixed at load.
  var CAB_N = 9;
  var cabVar = [];
  for (var i = 0; i < CAB_N; i++) {
    var r = mulberry32(1389000 + i * 7919);
    cabVar.push({
      inset: 0.14 + r() * 0.10,
      dots: 2 + Math.floor(r() * 3),
      dotSeed: Math.floor(r() * 1000),
      tone: r()
    });
  }
  // Seeded floor-scuff positions.
  var scuffs = [];
  for (var j = 0; j < 26; j++) {
    var rs = mulberry32(1389000 + 5000 + j * 7919);
    scuffs.push({ x: rs(), y: 0.55 + rs() * 0.42, l: 0.02 + rs() * 0.05, a: 0.04 + rs() * 0.05 });
  }

  // Pointer state. Resting cursor = frame center.
  var cursor = { x: 0, y: 0, set: false };
  var trail = [];   // {x, y, t} recent cursor positions, stored history
  var puffs = [];   // {x, y, t0} smoke puffs, stored history
  var lastPuff = { x: -9999, y: -9999 };
  var audioCtx = null; // created lazily inside pointerdown only
  var pointerDown = false;

  function ensureAudio() {
    if (audioCtx) return;
    if (typeof window === 'undefined') return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (typeof AC === 'undefined') return;
    try { audioCtx = new AC(); } catch (e) { audioCtx = null; }
  }
  function squeak() {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      var now = audioCtx.currentTime;
      o.type = 'sine';
      o.frequency.setValueAtTime(880, now);
      o.frequency.exponentialRampToValueAtTime(1560, now + 0.07);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.06, now + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now); o.stop(now + 0.13);
    } catch (e) { /* audio is ornamental; the piece is fully visual without it */ }
  }

  function onMove(x, y, t) {
    // Smoke is left BEHIND the cursor: the puff spawns at the previous
    // cursor position, so it is never hidden under the nose itself.
    var ox = cursor.set ? cursor.x : x;
    var oy = cursor.set ? cursor.y : y;
    cursor.x = x; cursor.y = y; cursor.set = true;
    trail.push({ x: x, y: y, t: t });
    if (trail.length > 40) trail.shift();
    var dx = x - lastPuff.x, dy = y - lastPuff.y;
    if (dx * dx + dy * dy > 24 * 24) {
      puffs.push({ x: ox, y: oy, t0: t });
      lastPuff.x = x; lastPuff.y = y;
      if (pointerDown) squeak();
    }
  }
  function bindPointer() {
    if (typeof canvas.addEventListener !== 'function') return;
    canvas.addEventListener('pointerdown', function (e) {
      pointerDown = true;
      ensureAudio();
      onMove(e.clientX, e.clientY, nowSec());
    });
    canvas.addEventListener('pointermove', function (e) {
      onMove(e.clientX, e.clientY, nowSec());
    });
    canvas.addEventListener('pointerup', function () { pointerDown = false; });
    canvas.addEventListener('pointercancel', function () { pointerDown = false; });
  }

  // Clock: boot flag, frame one = draw(0), clock starts with the rAF loop.
  var started = false;
  var t0 = 0;
  function nowSec() {
    if (!started) return 0;
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - t0) / 1000;
    return 0;
  }

  function fract(v) { return v - Math.floor(v); }

  function draw(t) {
    var v = viewport();
    var W = v.w, H = v.h;
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var vx = W / 2, vy = H * 0.46;
    var hw = Math.min(W, H) * 0.30; // half-width of the back wall opening
    var hh = Math.min(W, H) * 0.20;

    // Ground: near-black.
    ctx.fillStyle = '#101114';
    ctx.fillRect(0, 0, W, H);

    // Ceiling band.
    ctx.fillStyle = '#1a1c20';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(W, 0);
    ctx.lineTo(vx + hw, vy - hh); ctx.lineTo(vx - hw, vy - hh);
    ctx.closePath(); ctx.fill();

    // Left wall.
    ctx.fillStyle = '#6b6f75';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(vx - hw, vy - hh);
    ctx.lineTo(vx - hw, vy + hh); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();
    // Right wall.
    ctx.fillStyle = '#62666c';
    ctx.beginPath();
    ctx.moveTo(W, 0); ctx.lineTo(vx + hw, vy - hh);
    ctx.lineTo(vx + hw, vy + hh); ctx.lineTo(W, H);
    ctx.closePath(); ctx.fill();

    // Floor.
    ctx.fillStyle = '#17181c';
    ctx.beginPath();
    ctx.moveTo(0, H); ctx.lineTo(vx - hw, vy + hh);
    ctx.lineTo(vx + hw, vy + hh); ctx.lineTo(W, H);
    ctx.closePath(); ctx.fill();
    // Floor perspective seams, faint.
    ctx.strokeStyle = 'rgba(232,232,226,0.07)';
    ctx.lineWidth = 1;
    for (var s = 0; s < 7; s++) {
      var bx = (s / 6) * W;
      ctx.beginPath();
      ctx.moveTo(bx, H);
      ctx.lineTo(vx, vy + hh);
      ctx.stroke();
    }
    // Seeded floor scuffs.
    for (var sc = 0; sc < scuffs.length; sc++) {
      var sf = scuffs[sc];
      ctx.fillStyle = 'rgba(107,111,117,' + sf.a.toFixed(2) + ')';
      ctx.fillRect(sf.x * W, sf.y * H, sf.l * W, 2);
    }

    // Back wall: dark doorway panel.
    ctx.fillStyle = '#0b0c0e';
    ctx.fillRect(vx - hw, vy - hh, hw * 2, hh * 2);
    ctx.strokeStyle = '#4a4d52';
    ctx.lineWidth = 2;
    ctx.strokeRect(vx - hw, vy - hh, hw * 2, hh * 2);

    // Cabinets lining both walls, far to near. Depth z in (0,1]; the
    // hallway drifts forward endlessly: z advances with piece time and
    // wraps, so cabinets slide past forever.
    var rate = 0.055;
    for (var side = 0; side < 2; side++) {
      var order = [];
      for (var k = 0; k < CAB_N; k++) {
        var z = fract(k / CAB_N + t * rate);
        order.push({ k: k, z: z });
      }
      order.sort(function (a, b) { return a.z - b.z; }); // far first
      for (var oi = 0; oi < order.length; oi++) {
        var c = order[oi];
        var zz = Math.pow(c.z, 1.6);
        var cv = cabVar[c.k];
        var cw = (0.03 + zz * 0.20) * W;
        var ch = (0.05 + zz * 0.68) * H;
        var cx, cy;
        if (side === 0) {
          var rx = vx - hw + (0 - (vx - hw)) * zz; // right edge travels to left edge
          cx = rx - cw;
        } else {
          var lx = vx + hw + (W - (vx + hw)) * zz;
          cx = lx;
        }
        cy = vy - ch * 0.42 + zz * (H * 0.10);
        // Cabinet body.
        ctx.fillStyle = cv.tone > 0.5 ? '#4a4d52' : '#43464c';
        ctx.fillRect(cx, cy, cw, ch);
        // Inset panel.
        var ins = cv.inset;
        ctx.fillStyle = '#3a3d42';
        ctx.fillRect(cx + cw * ins, cy + ch * ins, cw * (1 - 2 * ins), ch * (1 - 2 * ins));
        // Abstract specimen marks: small rects and dots, never text.
        ctx.fillStyle = '#6b6f75';
        var dr = mulberry32(1389000 + c.k * 7919 + 777);
        for (var d = 0; d < cv.dots; d++) {
          var px = cx + cw * (0.22 + dr() * 0.56);
          var py = cy + ch * (0.24 + dr() * 0.52);
          ctx.beginPath();
          ctx.moveTo(px + 2, py);
          ctx.arc(px, py, 2, 0, Math.PI * 2);
          ctx.fill();
        }
        // Handle bar.
        ctx.fillStyle = '#2c2e33';
        ctx.fillRect(cx + cw * 0.42, cy + ch * 0.55, cw * 0.16, Math.max(2, ch * 0.02));
      }
    }

    // Smoke puffs: stored history, expanding flat-alpha discs, 1.6 s life.
    for (var pi = puffs.length - 1; pi >= 0; pi--) {
      var p = puffs[pi];
      var age = t - p.t0;
      if (age < 0 || age > 1.6) { if (age > 1.6) puffs.splice(pi, 1); continue; }
      var pr = 8 + age * 30;
      var pa = 0.55 * (1 - age / 1.6);
      ctx.fillStyle = 'rgba(232,232,226,' + pa.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(p.x + pr, p.y);
      ctx.arc(p.x, p.y, pr, 0, Math.PI * 2);
      ctx.fill();
    }
    // Prune old trail points (older than 0.9 s).
    while (trail.length && t - trail[0].t > 0.9) trail.shift();

    // Cursor trail: fading small red dots along the recent path.
    for (var ti = 0; ti < trail.length; ti++) {
      var tp = trail[ti];
      var ta = 0.35 * (1 - (t - tp.t) / 0.9);
      if (ta <= 0) continue;
      ctx.fillStyle = 'rgba(212,42,42,' + ta.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(tp.x + 4, tp.y);
      ctx.arc(tp.x, tp.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Clown nose cursor: resting position is frame center.
    var ccx = cursor.set ? cursor.x : W / 2;
    var ccy = cursor.set ? cursor.y : H / 2;
    var nr = Math.max(14, Math.min(W, H) * 0.028);
    ctx.fillStyle = '#d42a2a';
    ctx.beginPath();
    ctx.moveTo(ccx + nr, ccy);
    ctx.arc(ccx, ccy, nr, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#7a1414';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ccx + nr, ccy);
    ctx.arc(ccx, ccy, nr, 0, Math.PI * 2);
    ctx.stroke();
    // Specular dot.
    ctx.fillStyle = 'rgba(232,232,226,0.85)';
    ctx.beginPath();
    ctx.moveTo(ccx - nr * 0.30 + 3, ccy - nr * 0.35);
    ctx.arc(ccx - nr * 0.30, ccy - nr * 0.35, 3, 0, Math.PI * 2);
    ctx.fill();

    // Flat-alpha edge vignette (no gradients).
    ctx.fillStyle = 'rgba(16,17,20,0.18)';
    ctx.fillRect(0, 0, W, 10);
    ctx.fillRect(0, H - 10, W, 10);
    ctx.fillRect(0, 0, 10, H);
    ctx.fillRect(W - 10, 0, 10, H);
  }

  function loop(ts) {
    if (!started) {
      started = true;
      t0 = ts;
    }
    var t = (ts - t0) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }

  bindPointer();
  draw(0); // synchronous first frame at constant phase
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
