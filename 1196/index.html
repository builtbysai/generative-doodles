<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy-It-Right</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0B0D; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function () {
  'use strict';

  // ---------- deterministic hashes (seeded only; no Math.random) ----------
  function h2(a, b) {
    var x = ((a * 374761393 + b * 668265263) ^ 0x5bf03635) >>> 0;
    x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- constants ----------
  var T0 = 65;                    // fixed first-frame phase: press 2 just filed, stamp holding
  var PRESS_EVERY = 30;           // one press every 30 s
  var PRESS_DUR = 4;              // bend animation length
  var HOLD_DUR = 3;               // stamped copy holds after filing
  var SLICES = 24;                // bend slice count
  var EDITIONS = 25;              // edition size per motif cycle
  var ARCHIVE_MAX = 8;            // strip is a window: only the 8 most recent filings show

  var COL = {
    bg: '#0B0B0D', cream: '#F5F0E6',
    magenta: '#FF2BD1', cyan: '#00E5FF', amber: '#FFB000',
    stamp: '#E8112D', gray: '#8A8A93', stripLine: '#26262B'
  };
  var STRIP_FRAC = 0.18;          // archive strip = bottom 18% of frame

  // press arithmetic: press k starts at 30k, files at 30k+4
  function motifOf(k) { return Math.floor((k - 1) / EDITIONS) % 3; }   // 0 cactus, 1 skull, 2 hat
  function editionOf(k) { return ((k - 1) % EDITIONS) + 1; }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var isPhone = false;
  if (typeof window !== 'undefined' && window.screen) {
    isPhone = Math.min(window.screen.width || 9999, window.screen.height || 9999) < 700;
  }
  function fit() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 1280);
    var h = vv ? vv.height : (window.innerHeight || 800);
    if (!isPhone && h > w * 1.15) isPhone = true; // aspect fallback
    DPR = Math.min((typeof window !== 'undefined' && window.devicePixelRatio) || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px';   // pin CSS size in draw path
    canvas.style.height = h + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  fit();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(currentT()); });
    }
    window.addEventListener('resize', function () { fit(); draw(currentT()); });
  }

  function pieceNow() { return T0 + (performance.now() - startStamp) / 1000; }
  var startStamp = (typeof performance !== 'undefined') ? performance.now() : 0;
  function currentT() { return pieceNow(); }

  // ---------- layout ----------
  function stageH() { return H * (1 - STRIP_FRAC); }
  function motifW() { return Math.min(W * 0.40, stageH() * 0.86); }
  function motifCX() { return W / 2; }
  function motifCY() { return stageH() * 0.48; }

  // ---------- drag field (recorded samples; the next press amplifies them) ----------
  // sample: {u, v, t} — u/v normalized to the motif box at record time.
  var samples = [];
  var dragging = false;
  function recordSample(ev) {
    var mw = motifW();
    var u = (ev.clientX - (motifCX() - mw / 2)) / mw;
    var v = (ev.clientY - (motifCY() - mw / 2)) / mw;
    if (u < -0.15 || u > 1.15 || v < -0.15 || v > 1.15) return; // across the motif only
    samples.push({ u: clamp(u, 0, 1), v: clamp(v, 0, 1), t: pieceNow() });
    if (samples.length > 80) samples.shift();
  }
  if (typeof window !== 'undefined' && canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (ev) { dragging = true; recordSample(ev); });
    canvas.addEventListener('pointermove', function (ev) { if (dragging) recordSample(ev); });
    var endDrag = function () { dragging = false; };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', endDrag);
  }
  // per-slice amplification for press k: samples in the window (30(k-1), 30k]
  function dragAmp(k) {
    var counts = [], amp = [], s, i;
    for (s = 0; s < SLICES; s++) { counts.push(0); }
    var lo = PRESS_EVERY * (k - 1), hi = PRESS_EVERY * k;
    for (i = 0; i < samples.length; i++) {
      var sm = samples[i];
      if (sm.t > lo && sm.t <= hi) {
        var band = Math.min(SLICES - 1, Math.floor(sm.v * SLICES));
        counts[band]++;
      }
    }
    for (s = 0; s < SLICES; s++) amp.push(1 + clamp(counts[s] / 10, 0, 1) * 1.2);
    return amp;
  }
  function dragEnergy(k) { // mean amplification (0..1) feeding the pre-bend shimmer
    var amp = dragAmp(k), sum = 0;
    for (var s = 0; s < SLICES; s++) sum += (amp[s] - 1) / 1.2;
    return sum / SLICES;
  }

  // ---------- bend parameter sets (a bend is data, never pixels) ----------
  function bendParams(k) {
    var amp = dragAmp(k);
    var ampFrac = 0.055 + 0.05 * h2(k * 31 + 5, 999);
    var P = { off: [], fray: [], drop: [], splitFrac: 0.014 + 0.02 * h2(k * 31, 55),
              streakX: [], streakW: [], streakY: [], streakL: [] };
    for (var s = 0; s < SLICES; s++) {
      P.off.push((h2(k * 101 + 7, s * 17 + 3) - 0.5) * 2 * ampFrac * amp[s]);
      P.fray.push((h2(k * 77 + 3, s * 29 + 11) - 0.5) * 2);
      P.drop.push(h2(k * 13 + 5, s * 7 + 21) < 0.14);
    }
    for (var j = 0; j < 4; j++) {
      P.streakX.push(0.08 + 0.84 * h2(k * 41 + 1, j * 13 + 7));
      P.streakW.push(0.004 + 0.008 * h2(k * 41 + 2, j * 13 + 8));
      P.streakY.push(0.30 * h2(k * 41 + 3, j * 13 + 9));
      P.streakL.push(0.45 + 0.50 * h2(k * 41 + 4, j * 13 + 10));
    }
    return P;
  }

  // ---------- motifs (flat vector glyphs in a 100x100 box) ----------
  // rounded-rect subpath: lineTo lands exactly on each arc's start point,
  // so the connecting segment has zero length.
  function rrSub(x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    rrSub(x, y, w, h, r);
    ctx.fill();
  }
  // builds the motif's full path (no fill) — used for fills and for clipping
  function motifPath(idx, x, y, w) {
    var s = w / 100;
    function X(u) { return x + u * s; }
    function Y(v) { return y + v * s; }
    var i;
    ctx.beginPath();
    if (idx === 0) { // cactus: rounded column + two arms
      rrSub(X(40), Y(8), 20 * s, 84 * s, 10 * s);
      rrSub(X(15), Y(36), 13 * s, 28 * s, 6 * s);
      rrSub(X(15), Y(52), 32 * s, 12 * s, 6 * s);
      rrSub(X(72), Y(28), 13 * s, 28 * s, 6 * s);
      rrSub(X(53), Y(40), 32 * s, 12 * s, 6 * s);
    } else if (idx === 1) { // skull: one outline, even-odd negative space
      ctx.moveTo(X(33), Y(90));
      ctx.lineTo(X(33), Y(64));
      ctx.bezierCurveTo(X(20), Y(60), X(17), Y(44), X(21), Y(30));
      ctx.bezierCurveTo(X(25), Y(14), X(37), Y(7), X(50), Y(7));
      ctx.bezierCurveTo(X(63), Y(7), X(75), Y(14), X(79), Y(30));
      ctx.bezierCurveTo(X(83), Y(44), X(80), Y(60), X(67), Y(64));
      ctx.lineTo(X(67), Y(90));
      ctx.closePath();
      var eyes = [38, 62];
      for (i = 0; i < 2; i++) {
        ctx.moveTo(X(eyes[i]) + 9.5 * s, Y(41));
        ctx.arc(X(eyes[i]), Y(41), 9.5 * s, 0, Math.PI * 2);
      }
      ctx.moveTo(X(50), Y(50));
      ctx.lineTo(X(55.5), Y(63));
      ctx.lineTo(X(44.5), Y(63));
      ctx.closePath();
      var teeth = [40.5, 48.5, 56.5];
      for (i = 0; i < 3; i++) {
        ctx.moveTo(X(teeth[i]), Y(76));
        ctx.lineTo(X(teeth[i]) + 3 * s, Y(76));
        ctx.lineTo(X(teeth[i]) + 3 * s, Y(90));
        ctx.lineTo(X(teeth[i]), Y(90));
        ctx.closePath();
      }
    } else { // cowboy hat: pinched crown + wide brim
      ctx.moveTo(X(30), Y(64));
      ctx.bezierCurveTo(X(29), Y(44), X(32), Y(28), X(41), Y(23));
      ctx.bezierCurveTo(X(45), Y(21), X(47.5), Y(25), X(50), Y(25));
      ctx.bezierCurveTo(X(52.5), Y(25), X(55), Y(21), X(59), Y(23));
      ctx.bezierCurveTo(X(68), Y(28), X(71), Y(44), X(70), Y(64));
      ctx.closePath();
      rrSub(X(4), Y(62), 92 * s, 11 * s, 5 * s);
    }
  }
  function drawMotif(idx, x, y, w) {
    if (idx === 0) {
      var s = w / 100;
      rr(x + 40 * s, y + 8 * s, 20 * s, 84 * s, 10 * s);
      rr(x + 15 * s, y + 36 * s, 13 * s, 28 * s, 6 * s);
      rr(x + 15 * s, y + 52 * s, 32 * s, 12 * s, 6 * s);
      rr(x + 72 * s, y + 28 * s, 13 * s, 28 * s, 6 * s);
      rr(x + 53 * s, y + 40 * s, 32 * s, 12 * s, 6 * s);
    } else if (idx === 1) {
      motifPath(idx, x, y, w);
      ctx.fill('evenodd');
    } else {
      motifPath(idx, x, y, w);
      ctx.fill();
    }
  }

  // ---------- bent rendering: horizontal slices x 3 channel passes ----------
  function renderBent(idx, cx, cy, w, P, strength) {
    var x0 = cx - w / 2, y0 = cy - w / 2;
    var sh = w / SLICES;
    var split = P.splitFrac * w * strength;
    var passes = [
      { dx: -split, color: COL.magenta, a: 0.8 },
      { dx: split, color: COL.cyan, a: 0.8 },
      { dx: 0, color: COL.cream, a: 1 }
    ];
    for (var s = 0; s < SLICES; s++) {
      var off = P.off[s] * w * strength;
      var frayY = P.fray[s] * strength * w * 0.006;
      var dropA = P.drop[s] ? 0.4 : 1;
      for (var p = 0; p < 3; p++) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, y0 + s * sh + frayY, W, sh);
        ctx.clip();
        ctx.globalAlpha = passes[p].a * dropA;
        ctx.fillStyle = passes[p].color;
        drawMotif(idx, x0 + off + passes[p].dx, y0, w);
        ctx.restore();
      }
    }
    // pixels sorted into vertical streaks: thin amber columns, clipped to
    // the motif silhouette so they read as sorted columns of the copy itself
    if (strength > 0.02) {
      ctx.save();
      motifPath(idx, x0, y0, w);
      if (idx === 1) ctx.clip('evenodd'); else ctx.clip();
      ctx.globalAlpha = 0.26 * strength;
      ctx.fillStyle = COL.amber;
      for (var j = 0; j < 4; j++) {
        ctx.fillRect(x0 + P.streakX[j] * w, y0 + P.streakY[j] * w,
                     Math.max(1.5, P.streakW[j] * w), P.streakL[j] * w);
      }
      ctx.restore();
    }
  }

  // ---------- the edition stamp ----------
  function drawStamp(n, cx, cy, scale) {
    var label = 'COPY-IT-RIGHT × ' + n + ' / Edition 25';
    var fs = clamp(W * 0.021, 13, 30) * (scale || 1);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.05);
    ctx.font = '700 ' + fs + 'px ui-monospace, Menlo, Consolas, monospace';
    var tw = ctx.measureText(label).width;
    ctx.globalAlpha = 0.95;
    ctx.strokeStyle = COL.stamp;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(-tw / 2 - fs * 0.55, -fs * 0.78, tw + fs * 1.1, fs * 1.56);
    ctx.stroke();
    ctx.fillStyle = COL.stamp;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, fs * 0.04);
    ctx.restore();
  }

  // ---------- archive strip ----------
  function drawArchive(t) {
    var stripTop = stageH();
    var stripH = H - stripTop;
    ctx.strokeStyle = COL.stripLine;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, stripTop + 0.5);
    ctx.lineTo(W, stripTop + 0.5);
    ctx.stroke();

    // most recent filed press
    var latest = 0;
    while (PRESS_EVERY * (latest + 1) + PRESS_DUR <= t) latest++;
    if (latest < 1) return;
    var entryW = stripH * 1.08;
    var speed = clamp(W * 0.011, 6, 16);
    var first = Math.max(1, latest - ARCHIVE_MAX + 1);
    for (var j = first; j <= latest; j++) {
      var filedAt = PRESS_EVERY * j + PRESS_DUR;
      var age = t - filedAt;
      // entries file in fully on-screen at the right, then scroll left and are gone
      var ex = (W - entryW) - age * speed;
      if (ex < -entryW || ex > W) continue;
      var mw = stripH * 0.56;
      var mcx = ex + entryW / 2;
      renderBent(motifOf(j), mcx, stripTop + stripH * 0.36, mw, bendParams(j), 1);
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = COL.stamp;
      ctx.font = '700 ' + Math.max(10, stripH * 0.085) + 'px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText('× ' + editionOf(j), mcx, stripTop + stripH * 0.76);
      ctx.fillStyle = COL.gray;
      ctx.font = Math.max(6, stripH * 0.052) + 'px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText('COPY-IT-RIGHT', mcx, stripTop + stripH * 0.905);
      ctx.restore();
    }
  }

  // ---------- main draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, W, H);

    var mw = motifW(), cx = motifCX(), cy = motifCY();
    var k = Math.floor(t / PRESS_EVERY);
    var local = t - PRESS_EVERY * k;
    var breath = 1 + 0.02 * Math.sin(t * Math.PI * 2 / 6.5);

    if (k >= 1 && local < PRESS_DUR) {
      // pressing: bend strength ramps 0 -> 1 in 8 hard steps
      var prog = local / PRESS_DUR;
      var strength = Math.min(1, Math.ceil(prog * 8) / 8);
      renderBent(motifOf(k), cx, cy, mw, bendParams(k), strength);
    } else if (k >= 1 && local < PRESS_DUR + HOLD_DUR) {
      // filed: the bent copy holds, stamped
      renderBent(motifOf(k), cx, cy, mw, bendParams(k), 1);
      drawStamp(editionOf(k), cx, cy + mw / 2 + clamp(W * 0.021, 13, 30) * 1.15, 1);
    } else {
      // between presses: the original, untouched — breathing, plus a faint
      // pre-bend shimmer (15%) from whatever the visitor has dragged into it
      var curMotif = k >= 1 ? motifOf(k) : 0;
      var shimmer = 0.15 * dragEnergy(k + 1);
      if (shimmer > 0.003) {
        renderBent(curMotif, cx, cy, mw * breath, bendParams(k + 1), shimmer);
      } else {
        ctx.fillStyle = COL.cream;
        drawMotif(curMotif, cx - mw * breath / 2, cy - mw * breath / 2, mw * breath);
      }
    }

    drawArchive(t);
  }

  // ---------- run ----------
  draw(T0); // synchronous fixed-phase first frame
  if (typeof requestAnimationFrame === 'function') {
    var loopFn = function () {
      draw(pieceNow());
      requestAnimationFrame(loopFn);
    };
    requestAnimationFrame(loopFn);
  }
})();
</script>
</body>
</html>
