<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.397 Mushroom Hat Parade</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#141210; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.397 Mushroom Hat Parade (galitskaya-illustration).
// After Anna Galitskaya's anthropomorphic costume grammar:
// six flat kidlit animals march left to right across
// near-black, each wearing one oversized costume piece -
// a kitten under a red mushroom cap, an elephant in a star
// tutu, a tabby in gardener overalls, a cat in a frog hat,
// a lama in a poncho, a leopard carrying a cello. The dark
// is the stage: no scenery, no text, nothing to press.
// WATCH-ONLY. The parade is one band of motif data drawn at
// wrapped offsets on a single canvas, scrolling exactly one
// band width per 24s loop; strides, bobs and costume sway
// all run on whole cycles, so the loop is seamless.
// Palette is closed at the five specced hexes, each used
// flat or at flat alpha steps. One canvas, no offscreen
// canvas, no gradients, no filters, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#141210', CREAM = '#F7EFD9', RED = '#E6484D';
var TEAL = '#3FBFBF', GOLD = '#E8A93D';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 24;
if (LOOP !== 24) throw new Error('Parade loop must be 24s');
var BAND = 1560; // parade band width: 6 slots of 260
if (BAND / 6 !== 260) throw new Error('band must divide into 6 even slots');
var STEP = 0.75; // leg-frame toggle interval
if (LOOP / STEP !== 32) throw new Error('stride must complete whole cycles per loop');
var BOB_P = 0.75;
if (LOOP / BOB_P !== 32) throw new Error('bob must complete whole cycles per loop');
var SWAY_P = 3;
if (LOOP / SWAY_P !== 8) throw new Error('sway must complete whole cycles per loop');
var TICK = 1 / 60;
var GY = 648; // the parade ground line, design space

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-looking
// value is baked from this at load and never changes
// between frames or renders.
var seed = 397;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// Leopard spots: fixed table baked at load, placed by
// polar coordinates scaled inside the body ellipse
// (centre 0,-106, rx 72, ry 49) so no spot ever strays
// outside the silhouette.
var SPOTS = [];
(function () {
  var i;
  for (i = 0; i < 11; i++) {
    var a = rnd() * Math.PI * 2;
    var rr = Math.sqrt(rnd()) * 0.78;
    SPOTS.push({ x: Math.cos(a) * 72 * rr, y: -106 + Math.sin(a) * 49 * rr, r: 4.5 + rnd() * 4.5 });
  }
  if (SPOTS.length !== 11) throw new Error('leopard needs its spot table');
})();

// ---- drawing helpers -----------------------------------
// All animal drawing happens in local space: origin at the
// ground contact point under the animal's centre, +x toward
// the direction of march, -y up.
function circ(x, y, r, col) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function ell(x, y, rx, ry, col, rot) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function poly(pts, col) {
  var i;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}
function blob(pts, col) {
  // Closed smooth kidlit blob through the given points,
  // using midpoint quadratic smoothing.
  var i, n = pts.length, mx, my;
  ctx.fillStyle = col;
  ctx.beginPath();
  mx = (pts[0][0] + pts[n - 1][0]) / 2; my = (pts[0][1] + pts[n - 1][1]) / 2;
  ctx.moveTo(mx, my);
  for (i = 0; i < n; i++) {
    var p = pts[i], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.closePath(); ctx.fill();
}
function limb(x1, y1, x2, y2, w, col, alpha) {
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo((x1 + x2) / 2 + 4, (y1 + y2) / 2, x2, y2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function leg(hipX, hipY, footOff, w, col, alpha) {
  limb(hipX, hipY, hipX + footOff, -2, w, col, alpha);
}
function star(x, y, r, col) {
  var i, pts = [];
  for (i = 0; i < 10; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 5;
    var rr = (i % 2 === 0) ? r : r * 0.45;
    pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
  }
  poly(pts, col);
}
// Four legs, two-frame walk: near and far pairs swing in
// opposite phase, toggled by the stride frame.
function walkLegs(fx, bx, hipY, len, swing, w, frame) {
  var s = frame ? 1 : -1;
  leg(bx - 8, hipY, -swing * s, w, CREAM, 0.62);       // far back
  leg(fx + 8, hipY, swing * s, w, CREAM, 0.62);        // far front
  leg(bx + 4, hipY, swing * s, w, CREAM, 1);           // near back
  leg(fx - 4, hipY, -swing * s, w, CREAM, 1);          // near front
}

// ---- the six animals -----------------------------------
// Kitten in the red mushroom cap with cream spots and a
// teal ribbon. The cap group sways on its anchor.
function drawKitten(a) {
  ctx.save();
  walkLegs(36, -36, -64, 64, 15, 13, a.frame);
  limb(-56, -104, -86, -150, 13, CREAM, 1);            // tail curling up
  circ(-86, -152, 8, CREAM);
  ell(0, -98, 62, 47, CREAM);                          // body
  circ(56, -146, 39, CREAM);                           // head
  poly([[30, -172], [36, -200], [52, -178]], CREAM);   // ear back
  poly([[64, -180], [78, -204], [86, -176]], CREAM);   // ear front
  // Mushroom cap, swaying about the head anchor.
  ctx.save();
  ctx.translate(56, -168);
  ctx.rotate(a.sway);
  ctx.translate(-56, 168);
  ell(56, -188, 68, 34, RED);                          // dome
  poly([[-12, -168], [124, -168], [124, -154], [-12, -154]], TEAL); // ribbon band
  circ(-2, -161, 7, TEAL);                             // bow knot
  poly([[-2, -161], [-20, -173], [-18, -151]], TEAL);  // bow wing
  poly([[-2, -161], [14, -175], [16, -149]], TEAL);    // bow wing
  circ(24, -204, 8, CREAM);                            // spots
  circ(62, -212, 10, CREAM);
  circ(94, -200, 7, CREAM);
  circ(44, -194, 5, CREAM);
  ctx.restore();
  circ(72, -146, 4.5, GOLD);                           // eye
  circ(93, -136, 3.5, GROUND);                         // nose
  ctx.restore();
}

// Elephant in a teal tutu with red stars.
function drawElephant(a) {
  ctx.save();
  walkLegs(58, -70, -86, 86, 13, 25, a.frame);
  limb(-108, -168, -122, -104, 9, CREAM, 1);           // tail
  circ(-122, -100, 7, CREAM);
  ell(-8, -152, 104, 76, CREAM);                       // body
  circ(90, -170, 51, CREAM);                           // head
  ell(58, -164, 33, 45, CREAM);                        // ear
  // Trunk, curving down and forward.
  ctx.strokeStyle = CREAM; ctx.lineWidth = 29; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(126, -156);
  ctx.quadraticCurveTo(150, -120, 142, -72);
  ctx.quadraticCurveTo(138, -48, 150, -34);
  ctx.stroke();
  // Tutu, swaying about the waist anchor.
  ctx.save();
  ctx.translate(-8, -126);
  ctx.rotate(a.sway * 0.8);
  ctx.translate(8, 126);
  blob([[-98, -128], [82, -128], [98, -84], [60, -96], [24, -84],
        [-12, -96], [-48, -84], [-84, -96]], TEAL);
  star(-64, -106, 10, RED);
  star(-24, -98, 8, RED);
  star(16, -106, 10, RED);
  star(54, -100, 8, RED);
  ctx.restore();
  circ(102, -178, 4.5, GOLD);                          // eye
  ctx.restore();
}

// Tabby in teal gardener overalls with a red pocket.
function drawTabby(a) {
  ctx.save();
  walkLegs(38, -38, -58, 58, 15, 13, a.frame);
  // Tail, swaying, with ground-dark rings.
  ctx.save();
  ctx.translate(-58, -104);
  ctx.rotate(a.sway);
  ctx.translate(58, 104);
  limb(-58, -104, -88, -158, 13, CREAM, 1);
  limb(-76, -128, -66, -120, 14, GROUND, 0.85);
  limb(-84, -146, -74, -138, 14, GROUND, 0.85);
  ctx.restore();
  ell(0, -102, 66, 51, CREAM);                         // body
  // Overalls: bib and straps in teal, red pocket.
  blob([[-50, -130], [50, -130], [54, -52], [-54, -52]], TEAL);
  poly([[-44, -150], [-26, -150], [-28, -128], [-42, -128]], TEAL);
  poly([[26, -150], [44, -150], [42, -128], [28, -128]], TEAL);
  poly([[-14, -112], [14, -112], [14, -86], [-14, -86]], RED);
  circ(60, -158, 41, CREAM);                           // head
  poly([[34, -182], [40, -210], [56, -186]], CREAM);   // ears
  poly([[66, -188], [80, -212], [88, -182]], CREAM);
  limb(48, -192, 52, -180, 5, GROUND, 0.85);           // forehead stripes
  limb(60, -194, 62, -182, 5, GROUND, 0.85);
  limb(72, -192, 70, -180, 5, GROUND, 0.85);
  circ(76, -156, 4.5, GOLD);                           // eye
  circ(98, -146, 3.5, GROUND);                         // nose
  ctx.restore();
}

// Cat in a teal frog hat; the frog's eyes are gold.
function drawFrogCat(a) {
  ctx.save();
  walkLegs(38, -38, -60, 60, 15, 13, a.frame);
  limb(-58, -106, -84, -146, 13, CREAM, 1);            // tail
  circ(-84, -148, 8, CREAM);
  ell(0, -100, 64, 50, CREAM);                         // body
  blob([[-24, -126], [40, -126], [44, -112], [-28, -112]], RED); // collar
  circ(58, -152, 40, CREAM);                           // head
  poly([[32, -176], [36, -200], [50, -180]], CREAM);   // ear peeking out
  // Frog hat, swaying about the head anchor.
  ctx.save();
  ctx.translate(58, -172);
  ctx.rotate(a.sway);
  ctx.translate(-58, 172);
  ell(58, -178, 49, 29, TEAL);                         // dome
  circ(36, -202, 13, TEAL);                            // frog eye bumps
  circ(80, -202, 13, TEAL);
  circ(36, -204, 5, GOLD);                             // frog eyes
  circ(80, -204, 5, GOLD);
  ctx.restore();
  circ(74, -150, 4.5, GOLD);                           // cat eye
  circ(95, -141, 3.5, GROUND);                         // nose
  ctx.restore();
}

// Lama in a red poncho with teal stripes.
function drawLama(a) {
  ctx.save();
  walkLegs(50, -56, -98, 98, 12, 12, a.frame);
  limb(-80, -150, -96, -118, 8, CREAM, 1);             // tail
  ell(-6, -134, 78, 45, CREAM);                        // body
  limb(52, -152, 84, -236, 33, CREAM, 1);              // neck
  // Poncho, swaying about the neck base.
  ctx.save();
  ctx.translate(0, -168);
  ctx.rotate(a.sway * 0.7);
  ctx.translate(0, 168);
  blob([[34, -182], [-78, -176], [-66, -88], [-30, -100], [2, -72],
        [30, -100], [58, -92]], RED);
  poly([[-72, -140], [48, -140], [50, -126], [-70, -126]], TEAL);
  poly([[-58, -106], [38, -106], [36, -94], [-56, -94]], TEAL);
  ctx.restore();
  ell(96, -250, 31, 20, CREAM, -0.25);                 // head
  poly([[76, -262], [80, -282], [90, -264]], CREAM);   // ears
  poly([[94, -266], [102, -284], [108, -262]], CREAM);
  circ(104, -252, 4.5, GOLD);                          // eye
  circ(122, -242, 3.5, GROUND);                        // nose
  ctx.restore();
}

// Leopard with red spots, carrying a red cello.
function drawLeopard(a) {
  var i;
  ctx.save();
  walkLegs(40, -40, -64, 64, 15, 14, a.frame);
  limb(-66, -112, -98, -160, 12, CREAM, 1);            // tail
  circ(-98, -162, 7, RED);
  ell(0, -106, 72, 49, CREAM);                         // body
  for (i = 0; i < SPOTS.length; i++) circ(SPOTS[i].x, SPOTS[i].y, SPOTS[i].r, RED);
  circ(64, -162, 39, CREAM);                           // head
  circ(40, -192, 11, CREAM);                           // round ears
  circ(84, -194, 11, CREAM);
  circ(30, -150, 5, RED);
  circ(52, -186, 4.5, RED);
  // Cello, swaying gently about its base.
  ctx.save();
  ctx.translate(116, -40);
  ctx.rotate(a.sway * 0.6);
  ctx.translate(-116, 40);
  ell(116, -78, 30, 36, RED);                          // lower bout
  ell(116, -128, 23, 27, RED);                         // upper bout
  ell(116, -103, 15, 18, RED);                         // waist
  poly([[112, -150], [120, -150], [122, -196], [114, -196]], GROUND); // neck
  circ(118, -200, 6.5, GROUND);                        // scroll
  poly([[106, -96], [126, -96], [126, -85], [106, -85]], CREAM);     // bridge
  ctx.restore();
  limb(48, -116, 108, -172, 12, CREAM, 1);             // paw to the neck
  circ(80, -160, 4.5, GOLD);                           // eye
  circ(100, -150, 3.5, GROUND);                        // nose
  ctx.restore();
}

var ANIMALS = [
  { draw: drawKitten,   slot: 0, sp: 0.00 },
  { draw: drawElephant, slot: 1, sp: 0.37 },
  { draw: drawTabby,    slot: 2, sp: 0.74 },
  { draw: drawFrogCat,  slot: 3, sp: 1.11 },
  { draw: drawLama,     slot: 4, sp: 1.48 },
  { draw: drawLeopard,  slot: 5, sp: 1.85 }
];
if (ANIMALS.length !== 6) throw new Error('parade needs exactly 6 animals');

// ---- the parade ----------------------------------------
// The band is 1560 design px wide; each animal sits at the
// centre of its slot and scrolls right with the band,
// completing exactly one band width per loop. Each animal
// is drawn at three wrapped offsets so the wrap is
// seamless at both edges.
function drawBand(t) {
  var scroll = (t / LOOP) * BAND;
  var i, k;
  for (i = 0; i < ANIMALS.length; i++) {
    var an = ANIMALS[i];
    var lt = t + an.sp;
    var frame = Math.floor(lt / STEP) % 2;
    var bob = 3.2 * Math.sin(Math.PI * 2 * lt / BOB_P);
    var sway = 0.038 * Math.sin(Math.PI * 2 * t / SWAY_P + an.slot * 1.1);
    var baseX = (an.slot + 0.5) * (BAND / 6) + scroll;
    var px = ((baseX % BAND) + BAND) % BAND;
    for (k = -1; k <= 1; k++) {
      ctx.save();
      ctx.translate(px + k * BAND, GY + bob);
      an.draw({ frame: frame, sway: sway });
      ctx.restore();
    }
  }
}

function draw(t) {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  drawBand(t);
}

// ---- clock and frame -----------------------------------
// Determinism: frame one is drawn synchronously at the
// constant phase T0 (parade mid-march, scroll well into
// the loop), and the animation clock advances from that
// anchor in fixed 1/60 ticks accumulated from rAF
// timestamps. Frame one never reads a wall clock.
var T0 = 7.3;
var T = T0;
var lastNow = -1, acc = 0;
function step() { /* watch-only: state lives in the clock */ }

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Cover-fit: the design space fills the viewport.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
