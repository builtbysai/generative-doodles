<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9008 · Field Notes · Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #e9e2d0;
    color: #3a342a;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 620px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8a7d64; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; color: #2c2721; }
  header h1 .num { color: #a53f16; }
  header p { color: #7d7260; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #4a4234; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #f1e9d6;
    box-shadow: 0 18px 60px rgba(60, 48, 30, 0.28);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #9a8f78; font-size: 13px; font-style: italic; }
  footer a { color: #a53f16; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9008</span> · Field Notes</h1>
  <p>Hundreds of inked curves walking a noise field, the way wind combs
  tall grass. Broad sweeps first, then hairlines, then a single accent color
  when the page feels bold. <b>Click the piece for a fresh page.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// ---- seeded PRNG (mulberry32) ----
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
const hashParams = (() => {
  try { return new URLSearchParams(location.hash.replace(/^#/, "")); }
  catch (e){ return new URLSearchParams(); }
})();
const getParam = k => params.get(k) || hashParams.get(k);
let seed = parseInt(getParam("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 505;
const familyParam = parseInt(getParam("family") || "", 10);
const still = getParam("still") === "1";
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const TAU = Math.PI * 2;
const VU = 1000;               // virtual units; canvas is square
const MARGIN = 0.5 * VU;       // field extends 50% past every edge
const REVEAL_MS = 2100;

function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function hexRgb(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

// ---- 2D value noise + fbm, seeded ----
function makeNoise2D(rnd){
  const perm = new Uint8Array(512);
  const p0 = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p0[i] = i;
  for (let i = 255; i > 0; i--){
    const j = (rnd() * (i + 1)) | 0;
    const t = p0[i]; p0[i] = p0[j]; p0[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = p0[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = rnd();
  const fade = t => t * t * (3 - 2 * t);
  return function(x, y){
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const aa = g[perm[perm[X] + Y] & 255], ab = g[perm[perm[X] + Y + 1] & 255];
    const ba = g[perm[perm[X + 1] + Y] & 255], bb = g[perm[perm[X + 1] + Y + 1] & 255];
    const u = fade(xf), v = fade(yf);
    const x1 = aa + (ba - aa) * u, x2 = ab + (bb - ab) * u;
    return x1 + (x2 - x1) * v;
  };
}
function makeFbm(noise){
  return function(x, y){
    return 0.55 * noise(x, y) + 0.30 * noise(x * 2.13 + 7.7, y * 2.13 + 3.1)
         + 0.15 * noise(x * 4.31 + 13.7, y * 4.31 + 9.2);
  };
}

// ---- palettes: restrained ink families on paper ----
const FAMILIES = [
  { name: "sepia", ground: "#f1e9d6",
    inks: ["#26211a", "#5c4a30", "#8a7557"], accent: "#b8441c", accentW: 0.55 },
  { name: "slate", ground: "#eae8e1",
    inks: ["#22262b", "#495058", "#7d858d"], accent: "#2e4a68", accentW: 0.55 },
  { name: "mono", ground: "#f3f0e9",
    inks: ["#1c1c1b", "#3f3f3c", "#70706a"], accent: "#8a2b1a", accentW: 0.12 }
];

// ---- occupancy grid: keeps curves from overlapping (per-curve ids) ----
const OCC_CELLS = 250, OCC_CELL = (VU + 2 * MARGIN) / OCC_CELLS;
function makeOccupancy(){
  const grid = new Int32Array(OCC_CELLS * OCC_CELLS);
  const M = VU + 2 * MARGIN;
  function cell(x, y){
    const cx = clamp(((x + MARGIN) / M * OCC_CELLS) | 0, 0, OCC_CELLS - 1);
    const cy = clamp(((y + MARGIN) / M * OCC_CELLS) | 0, 0, OCC_CELLS - 1);
    return cy * OCC_CELLS + cx;
  }
  return {
    mark(x, y, id){ grid[cell(x, y)] = id; },
    blocked(x, y, id, r){
      const cx = clamp(((x + MARGIN) / M * OCC_CELLS) | 0, 0, OCC_CELLS - 1);
      const cy = clamp(((y + MARGIN) / M * OCC_CELLS) | 0, 0, OCC_CELLS - 1);
      for (let j = cy - r; j <= cy + r; j++){
        if (j < 0 || j >= OCC_CELLS) continue;
        for (let i = cx - r; i <= cx + r; i++){
          if (i < 0 || i >= OCC_CELLS) continue;
          const v = grid[j * OCC_CELLS + i];
          if (v !== 0 && v !== id) return true;
        }
      }
      return false;
    }
  };
}

// ---- angle field for one layer ----
function makeField(rnd, scale, turb, quant){
  const fbm = makeFbm(makeNoise2D(mulberry32((rnd() * 1e9) | 0)));
  const rot = rnd() * TAU;
  const s2 = scale * (2.6 + rnd() * 1.6);
  const ox = rnd() * 40, oy = rnd() * 40;
  return function(x, y){
    let a = TAU * fbm(x * scale, y * scale);
    a += turb * TAU * (fbm(x * s2 + ox, y * s2 + oy) - 0.5) * 2;
    a += rot;
    if (quant) a = Math.round(a / (Math.PI / 4)) * (Math.PI / 4);
    return a;
  };
}

let curves = [], groundColor = "#f1e9d6", familyName = "";

function generate(){
  const rnd = mulberry32(seed);
  const famIdx = Number.isInteger(familyParam) && FAMILIES[familyParam]
    ? familyParam
    : (() => { const r = rnd(); return r < 0.5 ? 0 : r < 0.8 ? 1 : 2; })();
  const fam = FAMILIES[famIdx];
  familyName = fam.name;
  groundColor = fam.ground;
  const inks = fam.inks.map(hexRgb);
  const accent = hexRgb(fam.accent);

  // compositional heart: off-center cluster, open breathing room elsewhere
  let hx = 120 + rnd() * 760, hy = 120 + rnd() * 760;
  const dc = Math.hypot(hx - 500, hy - 500);
  if (dc < 230){ // push away from dead center: no centered blob
    const a = Math.atan2(hy - 500, hx - 500) + (rnd() - 0.5);
    hx = 500 + Math.cos(a) * (230 + rnd() * 300);
    hy = 500 + Math.sin(a) * (230 + rnd() * 300);
    hx = clamp(hx, 80, 920); hy = clamp(hy, 80, 920);
  }
  const sigma = 240 + rnd() * 150;

  let curveId = 0;
  curves = [];

  function seedPoint(spread){
    for (let t = 0; t < 40; t++){
      const x = rnd() * VU, y = rnd() * VU;
      const d2 = (x - hx) * (x - hx) + (y - hy) * (y - hy);
      const p = 0.05 + 0.95 * Math.exp(-d2 / (2 * spread * spread));
      if (rnd() < p) return [x, y];
    }
    return [rnd() * VU, rnd() * VU];
  }

  function pickInk(){
    const r = rnd();
    return r < 0.55 ? inks[0] : r < 0.85 ? inks[1] : inks[2];
  }

  function walk(layer){
    const id = ++curveId;
    const occ = layer.occ;
    const [sx, sy] = seedPoint(layer.spread);
    const gap = Math.max(1, Math.round(layer.minGap / OCC_CELL));
    if (occ.blocked(sx, sy, id, gap)) return null;
    const field = layer.field;
    const pts = [[sx, sy]];
    let x = sx, y = sy;
    const n = layer.stepsMin + rnd() * (layer.stepsMax - layer.stepsMin);
    for (let i = 0; i < n; i++){
      const a = field(x, y);
      const nx = x + Math.cos(a) * layer.step;
      const ny = y + Math.sin(a) * layer.step;
      if (nx < -MARGIN || nx > VU + MARGIN || ny < -MARGIN || ny > VU + MARGIN) break;
      if (occ.blocked(nx, ny, id, gap)) break;
      x = nx; y = ny;
      pts.push([x, y]);
      occ.mark(x, y, id);
    }
    if (pts.length < layer.minPts) return null;
    const isAccent = rnd() < layer.accentP;
    const col = isAccent ? accent : pickInk();
    curves.push({
      pts, layer: layer.name,
      color: col,
      w: layer.wMin + rnd() * (layer.wMax - layer.wMin),
      alpha: layer.aMin + rnd() * (layer.aMax - layer.aMin),
      dash: layer.dash,
      dashOn: 8 + ((rnd() * 12) | 0), dashOff: 5 + ((rnd() * 10) | 0),
      fray: layer.fray,
      crnd: mulberry32((seed ^ (id * 2654435761)) >>> 0)
    });
    return pts;
  }

  const turbBroad = 0.12 + rnd() * 0.25;
  const turbDetail = 0.25 + rnd() * 0.45;
  const turbFine = 0.4 + rnd() * 0.6;

  const layers = [];
  // broad sweeps: the composition's weather
  layers.push({
    name: "broad", field: makeField(rnd, 0.0012 + rnd() * 0.0008, turbBroad, false),
    count: 80 + ((rnd() * 50) | 0), step: 3.5 + rnd() * 1.8,
    stepsMin: 520, stepsMax: 950, minGap: 15, minPts: 26,
    wMin: 2.4, wMax: 4.2, aMin: 0.6, aMax: 0.95, spread: sigma * 1.1,
    accentP: 0, dash: false, fray: true
  });
  // detail: medium hairlines
  layers.push({
    name: "detail", field: makeField(rnd, 0.0035 + rnd() * 0.0025, turbDetail, false),
    count: 120 + ((rnd() * 80) | 0), step: 2 + rnd() * 1.2,
    stepsMin: 240, stepsMax: 520, minGap: 9, minPts: 22,
    wMin: 1.2, wMax: 2.1, aMin: 0.42, aMax: 0.72, spread: sigma,
    accentP: 0, dash: false, fray: true
  });
  // fine field: whisper texture (weighted rarity)
  const hasFine = rnd() < 0.6;
  if (hasFine){
    layers.push({
      name: "fine", field: makeField(rnd, 0.009 + rnd() * 0.008, turbFine, false),
      count: 300 + ((rnd() * 200) | 0), step: 1.4 + rnd(),
      stepsMin: 60, stepsMax: 170, minGap: 6, minPts: 12,
      wMin: 0.55, wMax: 1.0, aMin: 0.22, aMax: 0.45, spread: sigma * 0.9,
      accentP: 0, dash: false, fray: false
    });
  }
  // accent pass: the single spice color (weighted rarity)
  const hasAccent = rnd() < fam.accentW;
  if (hasAccent){
    layers.push({
      name: "accent", field: makeField(rnd, 0.0028 + rnd() * 0.002, turbDetail, false),
      count: 15 + ((rnd() * 26) | 0), step: 2.4 + rnd() * 1.4,
      stepsMin: 260, stepsMax: 560, minGap: 12, minPts: 24,
      wMin: 1.6, wMax: 2.6, aMin: 0.65, aMax: 0.95, spread: sigma,
      accentP: 1, dash: false, fray: true
    });
  }
  // quantized layer: architectural moments inside the organic flow (rare)
  const hasQuant = rnd() < 0.22;
  if (hasQuant){
    layers.push({
      name: "quant", field: makeField(rnd, 0.003 + rnd() * 0.002, 0.15, true),
      count: 20 + ((rnd() * 30) | 0), step: 2.2 + rnd(),
      stepsMin: 220, stepsMax: 460, minGap: 12, minPts: 24,
      wMin: 1.4, wMax: 2.2, aMin: 0.5, aMax: 0.8, spread: sigma * 1.1,
      accentP: 0.35 * fam.accentW, dash: false, fray: false
    });
  }
  // broken dashes: one random layer (not fine) gets frayed dash treatment (rare)
  if (rnd() < 0.3 && layers.length > 1){
    const cand = layers.filter(l => l.name !== "fine");
    cand[(rnd() * cand.length) | 0].dash = true;
  }

  for (const layer of layers){
    layer.occ = makeOccupancy(); // non-overlap enforced within a layer;
    let made = 0, tries = 0;    // layers may cross each other (Hobbs: layered passes)
    while (made < layer.count && tries < layer.count * 14){
      tries++;
      if (walk(layer)) made++;
    }
  }
  // reveal order: broad weather first, fine whispers last (reads like a hand at work)
  const order = { broad: 0, quant: 1, detail: 2, accent: 3, fine: 4 };
  curves.sort((a, b) => (order[a.layer] - order[b.layer]) || (a.crnd() - b.crnd()));
}

// ---- drawing ----
let ctx, K, dpr;

function setupCanvas(){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = stage.clientWidth;
  K = S / VU;
  canvas.width = Math.round(S * dpr); canvas.height = Math.round(S * dpr);
  ctx = canvas.getContext("2d");
  ctx.setTransform(dpr * K, 0, 0, dpr * K, 0, 0);
  ctx.fillStyle = groundColor;
  ctx.fillRect(0, 0, VU, VU);
  // paper grain: faint specks under the ink
  const grnd = mulberry32(seed ^ 0x77aa);
  ctx.fillStyle = "rgba(70,58,40,0.05)";
  for (let i = 0; i < 2200; i++){
    ctx.fillRect(grnd() * VU, grnd() * VU, 1.1, 1.1);
  }
}

function rgba(c, a){ return `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`; }

function drawCurve(cv){
  const pts = cv.pts, n = pts.length;
  if (n < 2) return;
  const r = cv.crnd;
  ctx.lineCap = "butt";
  const jit = cv.w * 0.28;
  for (let i = 0; i < n - 1; i++){
    if (cv.dash){
      const cyc = cv.dashOn + cv.dashOff;
      if ((i % cyc) >= cv.dashOn) continue;
    }
    const t = i / (n - 1);
    const edge = Math.min(1, Math.min(t, 1 - t) / 0.09); // dry-brush taper
    const fade = edge * edge * (3 - 2 * edge);
    if (fade < 0.03) continue;
    const w = cv.w * (0.32 + 0.68 * fade) * (0.85 + 0.3 * r());
    const p0 = pts[i], p1 = pts[i + 1];
    // perpendicular jitter: the frayed dry-brush hand
    const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
    const len = Math.hypot(dx, dy) || 1;
    const j0 = (r() - 0.5) * 2 * jit, j1 = (r() - 0.5) * 2 * jit;
    ctx.strokeStyle = rgba(cv.color, cv.alpha * (0.35 + 0.65 * fade));
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(p0[0] - dy / len * j0, p0[1] + dx / len * j0);
    ctx.lineTo(p1[0] - dy / len * j1, p1[1] + dx / len * j1);
    ctx.stroke();
  }
  if (cv.fray && n > 10){
    // frayed ends: short hairs splaying past each tip, never round caps
    for (const end of [0, 1]){
      const i = end === 0 ? 0 : n - 2, j = end === 0 ? 1 : n - 1;
      const tip = pts[end === 0 ? 0 : n - 1];
      const dx = pts[j][0] - pts[i][0], dy = pts[j][1] - pts[i][1];
      const base = Math.atan2(dy, dx) + (end === 0 ? Math.PI : 0);
      const fr = cv.crnd;
      for (let k = 0; k < 3; k++){
        const a = base + (fr() - 0.5) * 0.7;
        const L = 5 + fr() * 11;
        ctx.strokeStyle = rgba(cv.color, cv.alpha * 0.28);
        ctx.lineWidth = cv.w * 0.32;
        ctx.beginPath();
        ctx.moveTo(tip[0], tip[1]);
        ctx.lineTo(tip[0] + Math.cos(a) * L, tip[1] + Math.sin(a) * L);
        ctx.stroke();
      }
    }
  }
}

function finishFrame(){
  const vg = ctx.createRadialGradient(500, 500, 340, 500, 500, 780);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(60,45,25,0.16)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VU, VU);
}

let rafId = 0, drawn = 0, startT = 0;

function drawAll(){
  cancelAnimationFrame(rafId);
  for (; drawn < curves.length; drawn++) drawCurve(curves[drawn]);
  finishFrame();
}

function animate(){
  cancelAnimationFrame(rafId);
  const step = now => {
    if (!startT) startT = now;
    const target = Math.min(curves.length,
      Math.floor(((now - startT) / REVEAL_MS) * curves.length));
    while (drawn < target) drawCurve(curves[drawn++]);
    if (drawn < curves.length) rafId = requestAnimationFrame(step);
    else finishFrame();
  };
  rafId = requestAnimationFrame(step);
}

function render(){
  generate();
  setupCanvas();
  drawn = 0; startT = 0;
  if (still || reduced) drawAll();
  else animate();
}

window.addEventListener("resize", () => { render(); });
document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  render();
});
render();
</script>
</body>
</html>
