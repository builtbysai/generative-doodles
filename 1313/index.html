<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lean</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #CFC8BB; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). No Math.random anywhere.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1313000);

  // Viewport sizing from the Visual Viewport API, never window size alone.
  var W = 0, H = 0, isPhone = false;
  function size() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w, h;
    if (vv && vv.width && vv.height) { w = vv.width; h = vv.height; }
    else if (typeof window !== 'undefined' && window.innerWidth && window.innerHeight) { w = window.innerWidth; h = window.innerHeight; }
    else { w = 1280; h = 900; }
    W = w; H = h;
    canvas.width = Math.round(w);
    canvas.height = Math.round(h);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var scr = (typeof window !== 'undefined') ? window.screen : null;
    if (scr && scr.width && scr.height) {
      isPhone = Math.min(scr.width, scr.height) < 700;
    } else {
      isPhone = h > w * 1.15;
    }
    if (document.body && document.body.style) {
      document.body.style.background = '#CFC8BB';
    }
  }
  size();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(clockT); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { size(); draw(clockT); });
    }
  }

  // Drag parallax: recorded events, closed-form decay. Never frame state.
  var drags = [];
  var dragging = false, lastX = 0, lastT = 0;
  function parallaxAt(t) {
    var off = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      var age = t - d.t;
      if (age < 0) age = 0;
      off += d.dx * Math.exp(-age / 1.2);
    }
    if (off > 14) off = 14;
    if (off < -14) off = -14;
    return off;
  }
  function onDown(e) {
    dragging = true;
    lastX = (e.clientX !== undefined) ? e.clientX : (e.touches ? e.touches[0].clientX : 0);
    lastT = clockT;
  }
  function onMove(e) {
    if (!dragging) return;
    var x = (e.clientX !== undefined) ? e.clientX : (e.touches ? e.touches[0].clientX : 0);
    var dx = x - lastX;
    if (dx !== 0) drags.push({ dx: dx, t: clockT });
    lastX = x;
  }
  function onUp() { dragging = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // Precomputed static detail, seeded once.
  var flecks = [];
  for (var i = 0; i < 90; i++) {
    flecks.push({ x: rng(), y: rng(), s: 1 + rng() * 2, a: 0.04 + rng() * 0.06 });
  }
  var scrawls = [];
  for (var j = 0; j < 4; j++) {
    var pts = [];
    var sx = 0.12 + rng() * 0.5, sy = 0.30 + rng() * 0.35;
    for (var k = 0; k < 6; k++) { pts.push([sx + k * 0.03 + (rng() - 0.5) * 0.03, sy + (rng() - 0.5) * 0.05]); }
    scrawls.push(pts);
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }
  function poly(points, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
    ctx.fill();
  }
  function line(x1, y1, x2, y2, color, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  // Piece time in seconds. Boot flag: frame one is draw(0), always.
  var clockT = 0;
  var started = false;
  var startMark = 0;

  function draw(t) {
    clockT = t;
    var w = W, h = H;
    var horizon = h * 0.55;
    var px = parallaxAt(t);

    // Wall and floor.
    rect(0, 0, w, horizon, '#CFC8BB');
    rect(0, horizon, w, h - horizon, '#8A7A66');
    // Faint floor boards: flat alpha lines, perspective spacing.
    ctx.fillStyle = 'rgba(42,30,18,0.16)';
    for (var b = 0; b < 5; b++) {
      var fy = horizon + (h - horizon) * (0.18 + b * 0.18);
      ctx.fillRect(0, fy, w, 1);
    }
    // Wall grain flecks.
    for (var f = 0; f < flecks.length; f++) {
      var fl = flecks[f];
      ctx.fillStyle = 'rgba(90,80,66,' + fl.a.toFixed(3) + ')';
      ctx.fillRect(fl.x * w, fl.y * horizon, fl.s, fl.s);
    }

    // Panel geometry. Bottom-center pivot; panel never touches the wall:
    // a visible gap of wall remains behind its top edge.
    var ph = Math.min(h * 0.62, w * 0.72);
    var pw = ph * 0.62;
    var cx = w * 0.5 + px * 0.6;
    var baseY = horizon + (h - horizon) * 0.86;
    var tilt = 8 * Math.PI / 180;
    // Sway: damped settle, 1-2 px over the 60 s loop, then holds.
    var lt = t % 60;
    var swayPx = 2 * Math.exp(-lt / 9) * Math.sin(lt * 1.1);
    var swayRad = (swayPx / ph) * 0.9;
    var gap = Math.max(6, w * 0.02); // wall gap: panel leans, never touches.

    // Long soft shadow to the right: layered flat alpha parallelograms.
    var shLen = pw * 0.9;
    ctx.fillStyle = 'rgba(30,22,14,0.16)';
    ctx.beginPath();
    ctx.moveTo(cx - pw * 0.5, baseY);
    ctx.lineTo(cx + pw * 0.5, baseY);
    ctx.lineTo(cx + pw * 0.5 + shLen, baseY - ph * 0.04);
    ctx.lineTo(cx - pw * 0.5 + shLen, baseY - ph * 0.04);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(30,22,14,0.10)';
    ctx.beginPath();
    ctx.moveTo(cx - pw * 0.5, baseY + 2);
    ctx.lineTo(cx + pw * 0.5, baseY + 2);
    ctx.lineTo(cx + pw * 0.5 + shLen * 1.15, baseY - ph * 0.02);
    ctx.lineTo(cx - pw * 0.5 + shLen * 1.15, baseY - ph * 0.02);
    ctx.closePath(); ctx.fill();

    // Books + block at the frame's left base.
    var bookW = Math.min(w * 0.17, pw * 0.72);
    var bookH = Math.max(10, h * 0.032);
    var bx = cx - pw * 0.62 - bookW * 0.5 + px * 0.8;
    var by = baseY;
    var bookColors = ['#5E2420', '#C9A227', '#3A4148'];
    for (var bi = 0; bi < 3; bi++) {
      var byy = by - (bi + 1) * bookH;
      rect(bx, byy, bookW, bookH - 2, bookColors[bi]);
      // Blank cloth back: the flipped spine faces away, no label, no title.
      line(bx + 3, byy + 2, bx + 3, byy + bookH - 4, 'rgba(0,0,0,0.25)', 1);
      line(bx + bookW - 3, byy + 2, bx + bookW - 3, byy + bookH - 4, 'rgba(255,255,255,0.18)', 1);
    }
    // Book shadow.
    ctx.fillStyle = 'rgba(30,22,14,0.18)';
    ctx.fillRect(bx - 2, by, bookW + 16, 3);

    // Leaning panel, rotated about its bottom center.
    ctx.save();
    ctx.translate(cx, baseY);
    ctx.rotate(-(tilt + swayRad));
    // Panel drop shadow on the floor, offset right.
    ctx.fillStyle = 'rgba(30,22,14,0.20)';
    ctx.fillRect(-pw * 0.5 + 6, -4, pw, 8);
    // Maple frame.
    var ft = Math.max(6, pw * 0.055);
    rect(-pw / 2, -ph, pw, ph, '#B98F5E');
    // Aluminum edge: thin bright line inside the frame.
    ctx.strokeStyle = '#9AA0A6';
    ctx.lineWidth = Math.max(1.5, pw * 0.012);
    ctx.strokeRect(-pw / 2 + ft * 0.5, -ph + ft * 0.5, pw - ft, ph - ft);
    // Print field: document.
    var ix = -pw / 2 + ft, iy = -ph + ft, iw = pw - ft * 2, ih = ph - ft * 2;
    rect(ix, iy, iw, ih, '#D8CDB8');
    // Document wear: fold line, torn edge, scrawl doodles.
    line(ix + iw * 0.08, iy + ih * 0.12, ix + iw * 0.92, iy + ih * 0.06, 'rgba(42,36,28,0.35)', 1);
    poly([[ix + iw * 0.9, iy], [ix + iw, iy + ih * 0.07], [ix + iw * 0.94, iy + ih * 0.1]], '#CFC8BB');
    ctx.strokeStyle = '#2A241C';
    ctx.lineWidth = 1;
    for (var s = 0; s < scrawls.length; s++) {
      var sp = scrawls[s];
      ctx.beginPath();
      ctx.moveTo(ix + sp[0][0] * iw, iy + sp[0][1] * ih);
      for (var q = 1; q < sp.length; q++) ctx.lineTo(ix + sp[q][0] * iw, iy + sp[q][1] * ih);
      ctx.stroke();
    }
    // Pictured leaning square of wood: the form rhymes with its content.
    ctx.save();
    ctx.translate(ix + iw * 0.5, iy + ih * 0.42);
    ctx.rotate(0.14);
    var sw2 = iw * 0.34;
    rect(-sw2 / 2, -sw2 / 2, sw2, sw2, '#8A6A44');
    ctx.strokeStyle = '#4A2C17';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-sw2 / 2 + 3, -sw2 / 2 + sw2 * 0.3);
    ctx.lineTo(sw2 / 2 - 3, -sw2 / 2 + sw2 * 0.24);
    ctx.moveTo(-sw2 / 2 + 3, -sw2 / 2 + sw2 * 0.6);
    ctx.lineTo(sw2 / 2 - 3, -sw2 / 2 + sw2 * 0.55);
    ctx.stroke();
    ctx.restore();
    // Snapshot: faded coral blob field with white border, slightly rotated.
    ctx.save();
    ctx.translate(ix + iw * 0.5, iy + ih * 0.74);
    ctx.rotate(-0.12);
    var snw = iw * 0.52, snh = ih * 0.22;
    rect(-snw / 2 - 4, -snh / 2 - 4, snw + 8, snh + 8, '#F0EBDD');
    ctx.fillStyle = '#C97B5E';
    ctx.beginPath();
    ctx.moveTo(-snw / 2 + 6, -snh / 2 + 4);
    ctx.bezierCurveTo(-snw * 0.1, -snh * 0.4, snw * 0.2, -snh * 0.5, snw / 2 - 4, -snh / 2 + 8);
    ctx.bezierCurveTo(snw * 0.45, snh * 0.3, snw * 0.1, snh * 0.45, -snw * 0.2, snh / 2 - 4);
    ctx.bezierCurveTo(-snw * 0.45, snh * 0.2, -snw / 2 + 2, -snh * 0.1, -snw / 2 + 6, -snh / 2 + 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8A9678';
    ctx.beginPath();
    ctx.moveTo(snw * 0.05, snh * 0.1);
    ctx.bezierCurveTo(snw * 0.25, -snh * 0.2, snw * 0.4, snh * 0.1, snw * 0.3, snh * 0.35);
    ctx.bezierCurveTo(snw * 0.15, snh * 0.4, -snw * 0.05, snh * 0.3, snw * 0.05, snh * 0.1);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // Viewer-presence shimmer: once per 60 s loop, a soft band crosses
    // the glassless print. Flat alpha, clipped to the print field.
    var shPhase = lt;
    if (shPhase >= 40 && shPhase <= 46) {
      var prog = (shPhase - 40) / 6;
      var bandX = ix + (iw + 60) * prog - 30;
      ctx.save();
      ctx.beginPath();
      ctx.rect(ix, iy, iw, ih);
      ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(bandX, iy, 26, ih);
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(bandX + 30, iy, 12, ih);
      ctx.restore();
    }
    ctx.restore();

    // Small leaning maple block against the frame's base, standing on the
    // books. Drawn after the panel so it stays visible at the frame's edge.
    ctx.save();
    var blockX = cx - (pw / 2) * Math.cos(tilt) - (bookH * 3) * Math.sin(tilt) - 8 + px * 0.8;
    ctx.translate(blockX, by - bookH * 3);
    ctx.rotate(-0.22);
    rect(0, -bookH * 2.1, Math.max(10, bookW * 0.22), bookH * 2.1, '#B98F5E');
    ctx.strokeStyle = '#7A5A34';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(2, -bookH * 1.9);
    ctx.lineTo(2, -bookH * 0.3);
    ctx.stroke();
    ctx.restore();

    // Wall gap note: the panel's top edge stays clear of the wall plane
    // because the panel is drawn rotated about its floor pivot with the
    // floor line below the horizon; no element touches the wall edge.
    void gap;
  }

  // Frame one: synchronous, exactly t = 0, before any clock starts.
  draw(0);

  function loop(ts) {
    if (!started) {
      started = true;
      startMark = ts;
    }
    var t = (ts - startMark) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
