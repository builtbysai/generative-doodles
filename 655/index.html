<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№655 The Unwanted Visitor</title>
<style>
  html, body { margin: 0; padding: 0; background: #f2d8d5; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1996 The Unwanted Visitor, SN5 / PP1243, study #260 syd-nuku.
  // Overhead product shot: a pink tray of pale water, dahlia heads
  // arranged immaculately (one centre, six around), a small yellow toy
  // drifting at the edge. Sterile, still, product-shot serious.
  // Near stillness: the water ripples faintly, the centre flower
  // rotates slowly. On a long timer the toy drifts into the
  // arrangement and the ripples sharpen, then it eases back out.
  // Watch-only: the flip lands on its own schedule.
  var GROUND = '#f2d8d5'; // page ground, pale tray pink

  // Fixed-phase first frame: FIRST_T = 20 s. Cycle is 120 s: the toy
  // sits at the edge until t = 55, drifts in during 55-70, holds
  // inside the arrangement until 85, eases back out by 100. At
  // FIRST_T = 20 the tray is immaculate, the toy is at the edge and
  // the ripples are faint.
  var FIRST_T = 20;
  var CYCLE = 120;
  var SEED = 1996;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: tray pink, dahlia magenta and cream, toy yellow, water pale.
  var TRAY = [222, 138, 148];       // tray pink, rim
  var TRAY_DARK = [198, 108, 120];  // tray rim shadow
  var TRAY_LIP = [233, 168, 176];   // tray inner lip highlight
  var WATER = [233, 240, 238];      // pale water
  var WATER_DEEP = [214, 228, 226]; // water, slightly deeper
  var MAGENTA = [178, 32, 84];      // dahlia magenta petals
  var MAGENTA_DEEP = [138, 18, 62];
  var MAGENTA_PALE = [205, 84, 128];
  var CREAM = [247, 234, 210];      // dahlia cream petals
  var CREAM_DEEP = [228, 208, 172];
  var CENTRE = [120, 40, 52];       // dahlia centres, dark plum
  var TOY = [242, 194, 0];          // toy yellow
  var TOY_DARK = [214, 158, 0];
  var BEAK = [232, 134, 46];        // toy beak orange
  var INK = [107, 45, 58];          // caption plum
  var RIPPLE = [120, 150, 148];     // ripple lines, cool grey-green

  // Flower layout, tray fractions: centre flower plus six around it.
  // Outer flowers sit at 15, 75, 135, 195, 255, 315 degrees, leaving
  // a gap at 345 degrees where the toy approaches.
  var FLOWERS = [];
  (function () {
    var rng = mulberry32(SEED * 7 + 3);
    var i, ang;
    FLOWERS.push({ x: 0, y: 0, r: 0.20, magenta: true, rot: 1, phase: rng() * 6.28 });
    for (i = 0; i < 6; i++) {
      ang = (15 + i * 60) * Math.PI / 180;
      FLOWERS.push({
        x: 0.58 * Math.cos(ang), y: 0.58 * Math.sin(ang),
        r: 0.15, magenta: (i % 2 === 0), rot: 0, phase: rng() * 6.28
      });
    }
  })();

  // The toy approaches along 345 degrees: at the water's edge when
  // d = 0, inside the arrangement when d = 1. 345 degrees is the
  // middle of the gap between the flowers at 315 and 15 degrees, so
  // the toy nestles between them instead of sitting on a flower.
  var TOY_ANG = 345 * Math.PI / 180;
  var TOY_EDGE_R = 0.94;
  var TOY_IN_R = 0.72;

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Cycle -----------------------------------------------------
  // Drift factor d: 0 while the toy waits at the edge, ramps 55-70,
  // holds 70-85, eases back 85-100. Ripple sharpness follows d.
  function cycleState(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    var d = smooth((p - 55) / 15) * (1 - smooth((p - 85) / 15));
    var sharp = 0.35 + 0.65 * d;
    var r = TOY_EDGE_R + (TOY_IN_R - TOY_EDGE_R) * d;
    return {
      p: p, drift: d, sharp: sharp,
      toyR: r,
      toyX: r * Math.cos(TOY_ANG), toyY: r * Math.sin(TOY_ANG)
    };
  }

  // Centre flower rotates one turn per 300 s; the rest of the
  // arrangement never moves.
  function flowerRot(f, t) {
    if (f.rot === 0) { return 0; }
    return 2 * Math.PI * t / 300;
  }

  // ---- Tray ------------------------------------------------------
  function trayR() { return 0.44 * Math.min(W, H); }
  function trayCX() { return W / 2; }
  function trayCY() { return H / 2; }

  function drawTray() {
    var cx = trayCX(), cy = trayCY(), R = trayR();
    // Outer shadow under the tray, soft and low.
    ctx.fillStyle = rgba([190, 130, 128], a4(0.25));
    ctx.beginPath();
    ctx.moveTo(cx + R * 1.02, cy + R * 0.06);
    ctx.arc(cx, cy + R * 0.06, R * 1.02, 0, Math.PI * 2);
    ctx.fill();
    // Tray body: pink disc with a darker rim.
    ctx.fillStyle = rgb(TRAY);
    ctx.beginPath();
    ctx.moveTo(cx + R, cy);
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgba(TRAY_DARK, a4(0.85));
    ctx.lineWidth = Math.max(2, R * 0.018);
    ctx.beginPath();
    ctx.moveTo(cx + R, cy);
    ctx.arc(cx, cy, R - ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.stroke();
    // Water: pale disc inside the rim.
    var wR = R * 0.93;
    ctx.fillStyle = rgb(WATER);
    ctx.beginPath();
    ctx.moveTo(cx + wR, cy);
    ctx.arc(cx, cy, wR, 0, Math.PI * 2);
    ctx.fill();
    // A deeper water tint low in the tray, and a faint highlight
    // high in the tray, so the water reads as a surface.
    var wg = ctx.createRadialGradient(cx, cy + wR * 0.55, 0, cx, cy + wR * 0.55, wR);
    wg.addColorStop(0, rgba(WATER_DEEP, a4(0.35)));
    wg.addColorStop(1, rgba(WATER_DEEP, 0));
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(cx + wR, cy);
    ctx.arc(cx, cy, wR, 0, Math.PI * 2);
    ctx.fill();
    var hg = ctx.createRadialGradient(cx - wR * 0.35, cy - wR * 0.45, 0, cx - wR * 0.35, cy - wR * 0.45, wR * 0.7);
    hg.addColorStop(0, rgba([255, 255, 255], a4(0.28)));
    hg.addColorStop(1, rgba([255, 255, 255], 0));
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(cx + wR, cy);
    ctx.arc(cx, cy, wR, 0, Math.PI * 2);
    ctx.fill();
    // Inner lip: a thin pale ring where water meets tray.
    ctx.strokeStyle = rgba(TRAY_LIP, a4(0.9));
    ctx.lineWidth = Math.max(1.5, R * 0.008);
    ctx.beginPath();
    ctx.moveTo(cx + wR, cy);
    ctx.arc(cx, cy, wR, 0, Math.PI * 2);
    ctx.stroke();
  }

  // ---- Dahlias ---------------------------------------------------
  // One dahlia head: three rings of petals around a dark centre.
  // Each petal is its own path (node-canvas quirk: batched ellipse
  // subpaths connect into polygons).
  function drawDahlia(fx, fy, fr, rot, magenta, t) {
    var cx = trayCX() + fx * trayR();
    var cy = trayCY() + fy * trayR();
    var r = fr * trayR();
    var rings = [
      { n: 14, rr: 1.00, len: 0.52, wid: 0.30 },
      { n: 10, rr: 0.66, len: 0.46, wid: 0.30 },
      { n: 6, rr: 0.38, len: 0.40, wid: 0.32 }
    ];
    var petal = magenta ? MAGENTA : CREAM;
    var petalDeep = magenta ? MAGENTA_DEEP : CREAM_DEEP;
    var petalPale = magenta ? MAGENTA_PALE : CREAM;
    var i, j, ring, a, px, py, pr;
    // Petal shadow: a soft dark disc under the head so it sits on
    // the water instead of floating over it.
    ctx.fillStyle = rgba([90, 70, 72], a4(0.16));
    ctx.beginPath();
    ctx.moveTo(cx + r * 1.02, cy + r * 0.05);
    ctx.arc(cx, cy + r * 0.05, r * 1.02, 0, Math.PI * 2);
    ctx.fill();
    for (j = 0; j < rings.length; j++) {
      ring = rings[j];
      for (i = 0; i < ring.n; i++) {
        a = rot + (i / ring.n) * Math.PI * 2 + j * 0.22;
        px = cx + Math.cos(a) * r * ring.rr;
        py = cy + Math.sin(a) * r * ring.rr;
        pr = r * ring.len;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(a);
        ctx.fillStyle = rgba(j === 2 ? petalPale : (i % 2 === 0 ? petal : petalDeep), a4(0.96));
        ctx.beginPath();
        ctx.moveTo(pr, 0);
        ctx.ellipse(0, 0, pr, pr * ring.wid, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    // Dark centre with a ring of tiny dots.
    ctx.fillStyle = rgb(CENTRE);
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.20, cy);
    ctx.arc(cx, cy, r * 0.20, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(magenta ? MAGENTA_PALE : CREAM_DEEP, a4(0.9));
    for (i = 0; i < 8; i++) {
      a = rot * 0.5 + (i / 8) * Math.PI * 2;
      px = cx + Math.cos(a) * r * 0.12;
      py = cy + Math.sin(a) * r * 0.12;
      ctx.beginPath();
      ctx.moveTo(px + r * 0.028, py);
      ctx.arc(px, py, r * 0.028, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Ripples ---------------------------------------------------
  // Faint expanding rings from the toy and from two flowers. Radius
  // cycles with t; alpha fades with radius and scales with the
  // drift sharpness, so the ripples sharpen when the toy drifts in.
  function drawRipples(t, cs) {
    var cx = trayCX(), cy = trayCY(), R = trayR();
    var sources = [
      { x: cx + cs.toyX * R, y: cy + cs.toyY * R, maxR: 0.30 * R, speed: 0.0045, off: 0 },
      { x: cx, y: cy, maxR: 0.34 * R, speed: 0.0032, off: 0.4 },
      { x: cx + FLOWERS[3].x * R, y: cy + FLOWERS[3].y * R, maxR: 0.26 * R, speed: 0.0038, off: 0.7 }
    ];
    var s, k, frac, rr, al;
    for (s = 0; s < sources.length; s++) {
      for (k = 0; k < 3; k++) {
        frac = (((t * sources[s].speed) + sources[s].off + k / 3) % 1 + 1) % 1;
        rr = frac * sources[s].maxR;
        al = 0.10 * cs.sharp * (1 - frac) * (s === 0 ? 1.35 : 0.8);
        if (al <= 0.004) { continue; }
        ctx.strokeStyle = rgba(RIPPLE, a4(al));
        ctx.lineWidth = Math.max(1, (0.8 + 1.1 * cs.drift) * (W / 900));
        ctx.beginPath();
        ctx.moveTo(sources[s].x + rr, sources[s].y);
        ctx.arc(sources[s].x, sources[s].y, rr, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  // ---- Toy -------------------------------------------------------
  // A small yellow toy duck, head pointing toward the tray centre.
  // Plain and tidy, never slapstick.
  function drawToy(cs) {
    var cx = trayCX() + cs.toyX * trayR();
    var cy = trayCY() + cs.toyY * trayR();
    var R = trayR();
    var ang = Math.atan2(-cs.toyY, -cs.toyX); // face the centre
    var br = R * 0.085; // body radius
    ctx.save();
    ctx.translate(cx, cy);
    // Soft shadow on the water under the toy.
    ctx.fillStyle = rgba([90, 70, 72], a4(0.18));
    ctx.beginPath();
    ctx.moveTo(br * 1.05, br * 0.28);
    ctx.ellipse(0, br * 0.28, br * 1.05, br * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.rotate(ang);
    // Body.
    ctx.fillStyle = rgb(TOY);
    ctx.beginPath();
    ctx.moveTo(br, 0);
    ctx.ellipse(0, 0, br, br * 0.72, 0, 0, Math.PI * 2);
    ctx.fill();
    // Belly shade.
    ctx.fillStyle = rgba(TOY_DARK, a4(0.35));
    ctx.beginPath();
    ctx.moveTo(br * 0.7, br * 0.28);
    ctx.ellipse(0, br * 0.28, br * 0.7, br * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();
    // Head.
    var hx = br * 0.78, hy = -br * 0.52;
    ctx.fillStyle = rgb(TOY);
    ctx.beginPath();
    ctx.moveTo(hx + br * 0.52, hy);
    ctx.arc(hx, hy, br * 0.52, 0, Math.PI * 2);
    ctx.fill();
    // Beak.
    ctx.fillStyle = rgb(BEAK);
    ctx.beginPath();
    ctx.moveTo(hx + br * 0.42, hy - br * 0.16);
    ctx.lineTo(hx + br * 1.02, hy + br * 0.02);
    ctx.lineTo(hx + br * 0.42, hy + br * 0.20);
    ctx.closePath();
    ctx.fill();
    // Eye.
    ctx.fillStyle = rgb([40, 30, 30]);
    ctx.beginPath();
    ctx.moveTo(hx + br * 0.18 + br * 0.07, hy - br * 0.12);
    ctx.arc(hx + br * 0.18, hy - br * 0.12, br * 0.07, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ---- Draw ------------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var cs = cycleState(t);

    // Ground is pale tray pink; the stage is the whole image.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawTray();
    // Ripples under the flowers, so the heads sit on the water.
    drawRipples(t, cs);
    var i;
    for (i = 0; i < FLOWERS.length; i++) {
      drawDahlia(FLOWERS[i].x, FLOWERS[i].y, FLOWERS[i].r,
        flowerRot(FLOWERS[i], t), FLOWERS[i].magenta, t);
    }
    drawToy(cs);

    // Title plate, top left, and the hint, bottom center. Dark plum
    // stays readable over the pale pink without breaking the calm.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(INK, a4(0.72));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№655 · The Unwanted Visitor', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(INK, a4(0.52));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2007 · 06 · 30', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(INK, a4(0.75));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch only. The toy drifts in on its own schedule.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer listeners. The piece is watched,
  // never driven.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1996 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1996 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return cycleState(t); },
      drift: function (t) { return cycleState(t).drift; },
      sharp: function (t) { return cycleState(t).sharp; },
      toy: function (t) {
        var cs = cycleState(t);
        return { x: cs.toyX, y: cs.toyY, r: cs.toyR };
      },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the centre flower turns slowly, the ripples breathe
  // and the toy drifts in once every 120 s. Guarded so node-canvas
  // QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
