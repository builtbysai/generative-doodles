<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pila del Oráculo</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0A0B; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var GROUND = '#0A0A0B';
  var STONE = '#3A3A3D';
  var WATER = '#0E2A33';
  var RIPPLE = '#7FB3C8';
  var STAR = '#F2EDE4';

  var BASE_SEED = 655001;

  var BREATH_PERIOD = 60;   // seconds: the water level breathes on a
                            // long slow loop, period about 60 s
  var RIPPLE_LIFE = 9;      // seconds: a stir settles back to glass

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, isPhone = false;

  // Layout in px, rebuilt on resize.
  var cx = 0, cy = 0;        // font center
  var outerR = 0;            // basin outer radius
  var innerR = 0;            // basin inner radius (the rim's clean circle)
  var edgePts = [];          // seeded hand-cut outer edge, unit radius

  // The stone's outer edge: one seeded ring of radius jitter, drawn
  // identically every frame. Nothing else in the piece uses randomness.
  function buildEdge() {
    var rng = mulberry32(BASE_SEED);
    edgePts = [];
    var n = 72;
    var phase = rng() * Math.PI * 2;
    var a1 = 0.010 + rng() * 0.012, a2 = 0.006 + rng() * 0.010;
    var f1 = 3 + Math.floor(rng() * 3), f2 = 7 + Math.floor(rng() * 5);
    for (var i = 0; i < n; i++) {
      var th = (i / n) * Math.PI * 2;
      var r = 1 + a1 * Math.sin(th * f1 + phase) + a2 * Math.sin(th * f2 + phase * 1.7)
              + (rng() - 0.5) * 0.006;
      edgePts.push(r);
    }
  }

  function layout() {
    cx = W / 2;
    cy = H / 2;
    var m = Math.min(W, H);
    outerR = m * (isPhone ? 0.36 : 0.26);
    innerR = outerR * 0.70;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || H > W * 1.15;
    layout();
  }

  // Ripples: a list of recorded stirs, (x, y, birth) in anchored seconds.
  // Everything a ripple does is an analytic function of (t - birth):
  // expanding thin rings clipped to the disc, fading over RIPPLE_LIFE.
  var ripples = [];

  function addRipple(x, y, tSec) {
    ripples.push({ x: x, y: y, birth: tSec });
    if (ripples.length > 40) ripples.splice(0, ripples.length - 40);
  }

  // How disturbed the surface is at time t: 1 right after a stir,
  // decaying to 0 as the water settles back to glass (about 8 s).
  function disturbance(t) {
    var d = 0;
    for (var i = 0; i < ripples.length; i++) {
      var a = t - ripples[i].birth;
      if (a >= 0 && a < RIPPLE_LIFE) d += Math.exp(-a / 2.6);
    }
    return d > 1 ? 1 : d;
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Breathing: phase 0 at t = 0 (level neutral). The water disc
    // swells and settles by a few pixels over the 60 s loop; the star's
    // echo stretches and relaxes on the same phase.
    var breath = Math.sin((t / BREATH_PERIOD) * Math.PI * 2);
    var waterR = innerR * 0.985 * (1 + 0.012 * breath);

    // The basin ring: seeded hand-cut outer edge, clean inner circle,
    // one flat stone tone (even-odd fill between the two paths).
    ctx.beginPath();
    var n = edgePts.length;
    for (var i = 0; i < n; i++) {
      var th = (i / n) * Math.PI * 2;
      var px = cx + Math.cos(th) * edgePts[i] * outerR;
      var py = cy + Math.sin(th) * edgePts[i] * outerR;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.moveTo(cx + innerR, cy);
    ctx.arc(cx, cy, innerR, 0, Math.PI * 2, true);
    ctx.fillStyle = STONE;
    ctx.fill('evenodd');

    // The water disc.
    ctx.beginPath();
    ctx.arc(cx, cy, waterR, 0, Math.PI * 2);
    ctx.fillStyle = WATER;
    ctx.fill();

    // Ripples, clipped to the disc: expanding thin rings from each
    // recorded stir, alpha decaying with analytic age.
    var dist = disturbance(t);
    if (ripples.length) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, waterR, 0, Math.PI * 2);
      ctx.clip();
      ctx.strokeStyle = RIPPLE;
      ctx.lineWidth = Math.max(1, waterR * 0.008);
      var speed = waterR * 0.16;
      for (var i = ripples.length - 1; i >= 0; i--) {
        var age = t - ripples[i].birth;
        if (age < 0) continue;
        if (age >= RIPPLE_LIFE) { ripples.splice(i, 1); continue; }
        var fade = Math.pow(1 - age / RIPPLE_LIFE, 1.4);
        for (var k = 0; k < 4; k++) {
          var r = speed * (age - k * 0.45);
          if (r <= 0) continue;
          ctx.globalAlpha = 0.5 * fade * (1 - k * 0.18);
          ctx.beginPath();
          ctx.arc(ripples[i].x, ripples[i].y, r, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // One reflected star, upper-left of center on the disc: a single
    // flat point, and below it the distorted echo, a short vertical
    // smear of smaller fading flat dots. The echo stretches with the
    // breath and wobbles while the surface is disturbed.
    var sx = cx - waterR * 0.36;
    var sy = cy - waterR * 0.33;
    var starR = Math.max(2.2, waterR * 0.020);
    ctx.fillStyle = STAR;
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.arc(sx, sy, starR, 0, Math.PI * 2);
    ctx.fill();
    var stretch = 1 + 0.30 * breath;
    var wob = dist * waterR * 0.012;
    var gap = starR * 1.9;
    var yy = sy;
    for (var j = 0; j < 7; j++) {
      yy += gap * stretch * (0.6 + j * 0.17);
      if (yy > cy + waterR * 0.92) break;
      var dx = wob * Math.sin(t * 7.3 - j * 0.95) * (0.4 + j * 0.16);
      ctx.globalAlpha = 0.80 - j * 0.105;
      ctx.beginPath();
      ctx.arc(sx + dx, yy, Math.max(0.7, starR * (0.82 - j * 0.105)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Anchored elapsed clock from rAF timestamps, offset plus elapsed
  // since load. Frame one is drawn synchronously at t = 0.
  var t0 = null, lastTs = null;

  function elapsed(tsMs) { return (tsMs - t0) / 1000; }
  function nowSec() { return (t0 !== null && lastTs !== null) ? elapsed(lastTs) : 0; }

  function frame(ts) {
    if (t0 === null) t0 = ts;
    lastTs = ts;
    draw(elapsed(ts));
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  function redraw() {
    if (lastTs !== null && t0 !== null) draw(elapsed(lastTs));
    else draw(0);
  }

  function pointerPos(ev) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return [ev.clientX - r.left, ev.clientY - r.top];
  }

  // Dragging across the water stirs it; a tap is a tiny stir at that
  // point. Stirs are recorded with their anchored timestamps so the
  // surface state stays a pure function of the clock plus the events.
  var dragging = false, lastStirX = 0, lastStirY = 0;

  function stirAt(p, force) {
    var dx = p[0] - cx, dy = p[1] - cy;
    if (!force && Math.sqrt(dx * dx + dy * dy) > innerR) return;
    var ddx = p[0] - lastStirX, ddy = p[1] - lastStirY;
    if (force || ddx * ddx + ddy * ddy > 18 * 18) {
      addRipple(p[0], p[1], nowSec());
      lastStirX = p[0]; lastStirY = p[1];
    }
  }

  canvas.addEventListener('pointerdown', function (ev) {
    dragging = true;
    var p = pointerPos(ev);
    lastStirX = p[0]; lastStirY = p[1];
    stirAt(p, true);
    redraw();
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!dragging) return;
    stirAt(pointerPos(ev), false);
    redraw();
  });
  function endDrag() { dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); redraw(); });
  }
  window.addEventListener('resize', function () { resize(); redraw(); });

  buildEdge();
  resize();

  // QA hook: ?seed=stir pre-records three stirs just before t = 0, so a
  // synchronous render shows the disturbed state (rings mid-expansion,
  // echo wobbled). Inert in normal viewing.
  var qaStir = false;
  if (typeof location !== 'undefined' && location.search) {
    if (/seed=stir/.test(location.search)) qaStir = true;
  }
  if (qaStir) {
    addRipple(cx - innerR * 0.10, cy + innerR * 0.05, -0.9);
    addRipple(cx + innerR * 0.30, cy - innerR * 0.22, -2.1);
    addRipple(cx - innerR * 0.45, cy - innerR * 0.30, -3.4);
  }

  draw(0); // frame one: glass calm, breath neutral, synchronous
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
