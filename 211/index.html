<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.211 Tele-Present</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B0A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.211 Tele-Present (David Bowen). A field of 126 dried stalks,
// each a single bezier stroke with seed-head ticks, all leaning the
// same way at the same moment, because none of them is deciding: a
// single simulated remote wind sensor drives the whole field. The
// little sensor stalk in the upper-left corner, mounted on its
// accelerometer box, twitches first; the field answers a beat
// later. The weather changes every forty five seconds or so: calm
// shivers, sweeping gusts, deep storm bends. Drag anywhere to
// throw a local gust through them; they bend away from your hand
// for a few seconds, then rejoin the field.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0B0B0A';
var STALK = '#C9A86A', TIP = '#8A6F3E', STEEL = '#6A6A6A';
var W = 0, H = 0, phone = false;
var seed = 211211;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
var T = 0, lastNow = -1;

// ---- the remote wind: one signal, sampled far away ------------------------------
// windTilt(t) returns the tilt vector {x, y} in radians the sensor
// reads at time t. Pure function of time, so the field can sample
// its own delayed past exactly.
var REGIMES = [
  { name: 'gusts', amp: 0.42, wave: 0.55, f1: 0.55, f2: 1.13 },
  { name: 'storm', amp: 0.78, wave: 0.10, f1: 0.30, f2: 0.71 },
  { name: 'calm', amp: 0.13, wave: 0.05, f1: 1.60, f2: 2.63 },
  { name: 'gusts', amp: 0.50, wave: 0.70, f1: 0.47, f2: 0.97 }
];
function regimeAt(t) {
  var seg = 45, segIx = Math.floor(t / seg);
  var ix = ((segIx % REGIMES.length) + REGIMES.length) % REGIMES.length;
  var prev = REGIMES[(ix + REGIMES.length - 1) % REGIMES.length];
  var cur = REGIMES[ix];
  var lt = t - segIx * seg;
  var k = clamp(lt / 10, 0, 1); k = k * k * (3 - 2 * k);
  return {
    amp: lerp(prev.amp, cur.amp, k), wave: lerp(prev.wave, cur.wave, k),
    f1: lerp(prev.f1, cur.f1, k), f2: lerp(prev.f2, cur.f2, k)
  };
}
function windRaw(t, R) {
  // sample the "remote location": slow noise at a distant offset
  var a = Math.sin(t * R.f1 + 13.7) * 0.62
        + Math.sin(t * R.f2 + 4.1) * 0.30
        + Math.sin(t * R.f1 * 2.33 + 27.9) * 0.18;
  var d = Math.sin(t * R.f1 * 0.57 + 8.3) * 0.45 + Math.sin(t * R.f2 * 0.43 + 19.2) * 0.2;
  return { x: a * R.amp, y: d * R.amp * 0.35 };
}
function windTilt(t) {
  // during the gust regime the tilt comes in pulses; sharpen them
  var R = regimeAt(t);
  var w = windRaw(t, R);
  var pulse = 0.55 + 0.45 * Math.sin(t * 0.8 + 1.3);
  var g = 1 - R.wave * 0.45 + R.wave * 0.45 * pulse;
  return { x: w.x * g, y: w.y * g, R: R };
}

// ---- the field of stalks ------------------------------------------------------------
var stalks = [];
(function buildStalks() {
  var rows = 9, cols = 14;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var fx = (c + 0.5) / cols + (rand() - 0.5) * 0.05;
      var fy = r / (rows - 1);
      stalks.push({
        fx: fx, fy: fy,
        jx: (rand() - 0.5) * 0.012, jy: (rand() - 0.5) * 0.01,
        len: 0.62 + rand() * 0.38,
        lean: (rand() - 0.5) * 0.07,
        ticks: 2 + ((rand() * 3) | 0),
        tickA: (rand() - 0.5) * 0.9,
        dc: Math.sqrt(Math.pow(fx - 0.5, 2) + Math.pow(fy - 0.55, 2))
      });
    }
  }
  // jitter-sort toward the centre: inner stalks stand a little taller
  stalks.sort(function (a, b) { return b.dc - a.dc; });
  for (var i = 0; i < stalks.length; i++) stalks[i].len *= 1 - stalks[i].dc * 0.22;
})();
var gustPuffs = []; // {x, y, vx, vy, t0}

// ---- input -----------------------------------------------------------------------------
var dragging = false, lastPX = 0, lastPY = 0;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; lastPX = e.clientX; lastPY = e.clientY;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var vx = e.clientX - lastPX, vy = e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
  if (Math.abs(vx) + Math.abs(vy) > 2) {
    gustPuffs.push({ x: e.clientX, y: e.clientY, vx: vx, vy: vy, t0: T });
    if (gustPuffs.length > 40) gustPuffs.shift();
  }
});
canvas.addEventListener('pointerup', function () { dragging = false; });
canvas.addEventListener('pointercancel', function () { dragging = false; });

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing -----------------------------------------------------------------------------
function stalkPath(bx, by, len, tiltX, tiltY, ticks, tickA, lw) {
  var cpx = bx + tiltX * len * 0.55, cpy = by - len * 0.55 + tiltY * len * 0.3;
  var tx = bx + tiltX * len, ty = by - len + tiltY * len * 0.45;
  ctx.strokeStyle = STALK;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.quadraticCurveTo(cpx, cpy, tx, ty);
  ctx.stroke();
  // darker seed-head ticks at the tip
  ctx.strokeStyle = TIP;
  ctx.lineWidth = Math.max(1, lw * 0.8);
  for (var i = 0; i < ticks; i++) {
    var a = -0.5 + i * (1.0 / Math.max(1, ticks - 1)) + tickA * 0.3;
    var tl = len * 0.055;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx + Math.sin(a) * tl + tiltX * tl * 0.4, ty - Math.cos(a) * tl * 0.7);
    ctx.stroke();
  }
  return [tx, ty];
}
function draw(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && time > 0) T += Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var now = windTilt(T);
  var thin = phone ? 2 : 1; // thin the grid on small screens
  var baseY = H * 0.995;
  var topY = H * 0.16;
  for (var i = 0; i < stalks.length; i++) {
    if (i % thin !== 0) continue;
    var st = stalks[i];
    var bx = (st.fx + st.jx) * W;
    var by = lerp(H * 0.86, H * 1.0, st.fy) + st.jy * H;
    var len = st.len * (baseY - topY) * (0.34 + st.fy * 0.52);
    // the field follows the sensor a beat later; in the gust regime
    // the beat stretches with distance, so tilt sweeps across
    var delay = 0.45 + st.dc * 1.1 + (now.R.wave * st.fx * 0.9);
    var w = windTilt(T - delay);
    var tiltX = st.lean + w.x, tiltY = w.y;
    // local gusts from the hand
    for (var gi = 0; gi < gustPuffs.length; gi++) {
      var gp = gustPuffs[gi];
      var age = T - gp.t0;
      if (age > 3) continue;
      var dx = bx - gp.x, dy = (by - len * 0.6) - gp.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var R = Math.min(W, H) * 0.17;
      if (d < R && d > 1) {
        var f = (1 - d / R) * Math.exp(-age * 1.1) * 0.55;
        tiltX += (gp.vx * 0.02 + dx / d * 0.12) * f * 3;
        tiltY += (gp.vy * 0.012) * f * 3;
      }
    }
    ctx.globalAlpha = 0.55 + st.fy * 0.45;
    stalkPath(bx, by, len, tiltX, tiltY, st.ticks, st.tickA, Math.max(1.1, H * 0.0022));
  }
  ctx.globalAlpha = 1;
  // the sensor mechanism, upper-left: a steel box, a pivot, and the
  // one stalk that feels the wind first
  var sx = W * 0.075, sy = H * 0.135, ss = Math.min(W, H) * 0.052;
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = Math.max(1.2, ss * 0.06);
  ctx.strokeRect(sx - ss, sy - ss * 0.55, ss * 2, ss * 1.1);
  ctx.beginPath();
  ctx.moveTo(sx - ss, sy); ctx.lineTo(sx + ss, sy);
  ctx.moveTo(sx, sy - ss * 0.55); ctx.lineTo(sx, sy + ss * 0.55);
  ctx.stroke();
  ctx.fillStyle = STEEL;
  var bolts = [[-0.78, -0.36], [0.78, -0.36], [-0.78, 0.36], [0.78, 0.36]];
  for (var bi = 0; bi < 4; bi++) {
    ctx.beginPath();
    ctx.arc(sx + bolts[bi][0] * ss, sy + bolts[bi][1] * ss, Math.max(1.2, ss * 0.09), 0, 6.2832);
    ctx.fill();
  }
  ctx.beginPath(); ctx.arc(sx, sy, Math.max(1.6, ss * 0.14), 0, 6.2832); ctx.fill();
  // the sensor stalk itself: no delay, a touch larger than the field's answer
  stalkPath(sx, sy - ss * 0.5, ss * 1.8, now.x * 1.15, now.y * 1.15, 3, 0.2, Math.max(1.2, H * 0.0024));
  // a thin mast down from the box
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = Math.max(1, ss * 0.05);
  ctx.beginPath();
  ctx.moveTo(sx, sy + ss * 0.55);
  ctx.lineTo(sx, sy + ss * 1.5);
  ctx.stroke();
  // age out the gusts
  gustPuffs = gustPuffs.filter(function (gp) { return T - gp.t0 < 3.2; });
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
