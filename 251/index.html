<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.251 Lost Glacier</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#7FB2F0; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.251 Lost Glacier (tanzinchospel.art). After A Sky for
// Henasku, his digital abstraction with Avantika Bawa
// meditating on a lost glacier: a horizon in stacked bands,
// pale sky, a white glacier band, dark rock, deep shadow.
// Over a thirty second loop the glacier thins and recedes
// upward, then restores. The sky drifts almost
// imperceptibly. No objects, no text. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var SKY = '#7FB2F0', GLACIER = '#E8F1F5', ROCK = '#5C4A3A', SHADOW = '#14100E';
var W = 0, H = 0, phone = false;
var T = 7.5, lastNow = -1; // frame one: mid melt, the loss already visible

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// snow grain: seeded specks in unit space across the glacier's
// full extent; a speck shows only while the band covers it
var grain = [];
(function () {
  var r = rng(25109);
  for (var i = 0; i < 430; i++) {
    grain.push({ x: r(), y: r(), sz: 0.8 + r() * 1.1, a: 0.08 + r() * 0.16, blue: r() < 0.72 });
  }
})();

// a soft edge: stacked low alpha strips of one colour bleeding
// over a boundary line, up or down
function softEdge(y, colour, dir) {
  var steps = [[3, 0.30], [7, 0.17], [13, 0.08]];
  for (var i = 0; i < steps.length; i++) {
    ctx.fillStyle = rgba(colour, steps[i][1]);
    if (dir > 0) ctx.fillRect(0, y, W, steps[i][0]);
    else ctx.fillRect(0, y - steps[i][0], W, steps[i][0]);
  }
}

function draw() {
  var horizon = H * 0.40;
  var gTop = H * 0.330;
  var fullThick = H * 0.148;
  var ph = (T % 30) / 30;
  var melt = 0.5 - 0.5 * Math.cos(ph * Math.PI * 2); // 0 full, 1 most lost
  var thick = fullThick * (1 - 0.60 * melt);
  var gBot = gTop + thick;
  var shadowTop = H * 0.865;

  // sky
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, horizon + fullThick);
  // faint drift in the sky band: two soft pale streaks sliding
  // almost imperceptibly across, wrapping at the edges; each is
  // drawn in horizontal slices with a feathered alpha profile
  // so it has no hard ends
  function streak(cx, y, wdt, hgt, aMax) {
    var prof = [0.35, 0.7, 1, 1, 0.7, 0.35];
    var sw = wdt / prof.length;
    for (var i = 0; i < prof.length; i++) {
      ctx.fillStyle = rgba(GLACIER, aMax * prof[i]);
      ctx.fillRect(cx - wdt / 2 + i * sw, y, sw + 1, hgt);
    }
  }
  var driftA = ((T * 5.5) % (W + 500)) - 250;
  var driftB = ((T * 3.8 + W * 0.45) % (W + 620)) - 310;
  streak(driftA, H * 0.070, 620, H * 0.085, 0.035);
  streak(driftB, H * 0.192, 720, H * 0.066, 0.035);
  streak(driftA, H * 0.085, 420, H * 0.052, 0.055);
  streak(driftB, H * 0.205, 520, H * 0.040, 0.055);

  // rock, then the deep shadow foreground
  ctx.fillStyle = ROCK;
  ctx.fillRect(0, gTop, W, H - gTop);
  ctx.fillStyle = SHADOW;
  ctx.fillRect(0, shadowTop, W, H - shadowTop);
  softEdge(shadowTop, SHADOW, -1);

  // the glacier band itself, soft at both edges
  ctx.fillStyle = GLACIER;
  ctx.fillRect(0, gTop, W, thick);
  softEdge(gBot, GLACIER, 1);
  softEdge(gTop, GLACIER, -1);
  // striations on the ice
  ctx.strokeStyle = rgba(SKY, 0.13);
  ctx.lineWidth = Math.max(1, H * 0.0016);
  var fr = [0.24, 0.47, 0.71];
  fr.forEach(function (f) {
    var y = gTop + thick * f;
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(W, y);
    ctx.stroke();
  });
  // snow grain, revealed and covered as the band breathes
  grain.forEach(function (g) {
    if (g.y > thick / fullThick) return;
    ctx.fillStyle = g.blue ? rgba(SKY, g.a) : rgba(SHADOW, g.a * 0.7);
    ctx.fillRect(g.x * W, gTop + g.y * fullThick, g.sz + 0.6, g.sz);
  });
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
