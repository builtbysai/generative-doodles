<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fork This</title>
<style>
  html, body { margin: 0; padding: 0; background: #07080C; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* No.992 "Fork This" -- the Perfume Global Site Project as a living
   family tree: one white motion-capture dancer glyph at the left, and
   every tap forks it into a mutated, still-dancing descendant
   (generation palette, shifted pose phase and joint biases, changed
   line density), joined to its parent by a hairline lineage line.
   Every node's pose is a closed-form function of piece time and its
   own parameters; the tree changes only through recorded events
   (forks, prunes, reseeds), each evaluated as a function of time.
   Frame one is the synchronous draw at the fixed offset T0 = 6 s and
   never touches the wall clock. */

// ---------- seeded rng / hash ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(a, b) { // deterministic per-index hash -> [0,1)
  var h = Math.imul((a ^ 0x9E3779B9) | 0, 2654435761) ^ Math.imul(b + 1, 40503);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// ---------- palette ----------
var GROUND = "#07080C", PARENT_C = "#FFFFFF", LINE_C = "#3A3D46";
var GEN_COLORS = [null, "#4FD6FF", "#FF4FD8", "#FFD93B", "#7DF9C6"];
function genColor(depth) {
  if (depth <= 0) return PARENT_C;
  return GEN_COLORS[Math.min(depth, 4)];
}

// ---------- constants ----------
var BASE_SEED = 992153;
var T0 = 6;                // frame-one piece time (s), founding family grown in
var LOOP = 8;              // seconds per dance-phrase loop
var MAX_NODES = 48;
var MAX_CHILDREN = 3;

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, PHONE = false;

// ---------- sizing: Visual Viewport API ----------
function fit() {
  var vv = window.visualViewport;
  var w = vv && vv.width ? vv.width : window.innerWidth;
  var h = vv && vv.height ? vv.height : window.innerHeight;
  W = Math.max(50, Math.round(w)); H = Math.max(50, Math.round(h));
  if (canvas.width !== W) canvas.width = W;
  if (canvas.height !== H) canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener("resize", fit);
}
window.addEventListener("resize", fit);

// ---------- tree state ----------
// Node: {id, parent, depth, x, y (world layout), size (world height),
//   phase, speed, bLean, bArmL, bArmR, bLegL, bLegR (pose mutations),
//   density 0 sparse / 1 full / 2 echo, childCount, bornT, pruneT}
var seedBase = BASE_SEED;
var nodes = [];
var flashes = [];          // {x, y, size, t0} in world coords
var tfKeys = [];           // fit-transform keyframes {t0, from, to}
var forkCount = 0;

function makeNode(parent, rng, bornT) {
  var depth = parent ? parent.depth + 1 : 0;
  var size = parent ? parent.size * 0.85 : 1;
  var x = 0, y = 0;
  if (parent) {
    var idx = parent.childCount; parent.childCount++;
    var offs = [-0.44, 0.44, 0, -0.88, 0.88];
    var off = offs[Math.min(idx, offs.length - 1)];
    x = parent.x + parent.size * 1.14;
    y = parent.y + off * parent.size + (rng() - 0.5) * 0.1 * parent.size;
  }
  return {
    id: nodes.length, parent: parent ? parent.id : -1, depth: depth,
    x: x, y: y, size: size,
    phase: rng(), speed: 0.9 + rng() * 0.2,
    bLean: (rng() - 0.5) * 0.16,
    bArmL: (rng() - 0.5) * 0.7, bArmR: (rng() - 0.5) * 0.7,
    bLegL: (rng() - 0.5) * 0.3, bLegR: (rng() - 0.5) * 0.3,
    density: depth === 0 ? 1 : (rng() < 0.34 ? 0 : (rng() < 0.55 ? 2 : 1)),
    childCount: 0, bornT: bornT, pruneT: -1
  };
}

function addNode(parent, rng, bornT) {
  var n = makeNode(parent, rng, bornT);
  nodes.push(n);
  return n;
}
function buildTree(bornT) {
  nodes = []; flashes = [];
  var rng = mulberry32((seedBase * 7919 + 13) | 0);
  var root = addNode(null, rng, bornT);
  var A = addNode(root, rng, bornT);   // generation 1
  var B = addNode(root, rng, bornT);   // generation 1
  var A1 = addNode(A, rng, bornT);     // generation 2
  addNode(A, rng, bornT);              // generation 2
  var B1 = addNode(B, rng, bornT);     // generation 2
  addNode(A1, rng, bornT);             // generation 3
  addNode(B1, rng, bornT);             // generation 3
}

// ---------- fit transform (closed-form over keyframes) ----------
function targetTransform() {
  var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, found = false;
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.pruneT >= 0) continue;
    found = true;
    var hw = 0.52 * n.size, ht = 0.60 * n.size, hb = 0.56 * n.size;
    if (n.x - hw < minX) minX = n.x - hw;
    if (n.x + hw > maxX) maxX = n.x + hw;
    if (n.y - ht < minY) minY = n.y - ht;
    if (n.y + hb > maxY) maxY = n.y + hb;
  }
  if (!found) return { s: H * 0.4, cx: 0, cy: 0 };
  var bw = (maxX - minX) + 0.22, bh = (maxY - minY) + 0.22;
  var s = Math.min(W * 0.94 / bw, H * 0.94 / bh);
  s = Math.min(s, H * 0.46);
  return { s: s, cx: (minX + maxX) / 2, cy: (minY + maxY) / 2 };
}
function transformAt(t) {
  var k = null;
  for (var i = tfKeys.length - 1; i >= 0; i--) {
    if (tfKeys[i].t0 <= t) { k = tfKeys[i]; break; }
  }
  if (!k) return tfKeys.length ? tfKeys[tfKeys.length - 1].to : targetTransform();
  var u = (t - k.t0) / 0.65;
  if (u >= 1) return k.to;
  if (u <= 0) return k.from;
  var e = u * u * (3 - 2 * u);
  return {
    s: k.from.s + (k.to.s - k.from.s) * e,
    cx: k.from.cx + (k.to.cx - k.from.cx) * e,
    cy: k.from.cy + (k.to.cy - k.from.cy) * e
  };
}
function pushTransform(t, snap) {
  var to = targetTransform();
  var from = snap ? to : transformAt(t);
  tfKeys.push({ t0: t, from: from, to: to });
  if (tfKeys.length > 40) tfKeys.splice(0, tfKeys.length - 40);
}

// ---------- per-node time functions ----------
function growthOf(n, t) {
  var u = (t - n.bornT) / 0.5;
  if (u <= 0) return 0;
  if (u >= 1) return 1;
  return u * u * (3 - 2 * u);
}
function pruneAlpha(n, t) {
  if (n.pruneT < 0) return 1;
  var u = (t - n.pruneT) / 0.8;
  if (u <= 0) return 1;
  if (u >= 1) return 0;
  return 1 - u;
}
var posCache = {};
function drawnPos(n, t) { // world coords, with prune collapse toward parent
  var c = posCache[n.id];
  if (c) return c;
  var x = n.x, y = n.y;
  if (n.pruneT >= 0 && n.parent >= 0) {
    var u = (t - n.pruneT) / 0.8;
    u = Math.max(0, Math.min(1, u));
    var e = u * u * (3 - 2 * u);
    var pp = drawnPos(nodes[n.parent], t);
    x = n.x + (pp[0] - n.x) * e;
    y = n.y + (pp[1] - n.y) * e;
  }
  var r = [x, y];
  posCache[n.id] = r;
  return r;
}

// ---------- pose engine ----------
// Local skeleton, origin at the pelvis, y down, units of figure height.
// Joint angles are layered sines over the node's own phrase phase, plus
// the node's seeded biases: every descendant dances the same phrase
// differently.
function skeleton(n, t) {
  var ph = ((t * n.speed) / LOOP + n.phase) * Math.PI * 2;
  var lean = 0.13 * Math.sin(ph + 0.7) + n.bLean;
  var bob = 0.018 * Math.sin(2 * ph);
  var pelvis = [0, bob];
  var sdir = [Math.sin(lean), -Math.cos(lean)];
  var perp = [Math.cos(lean), Math.sin(lean)];
  var chest = [pelvis[0] + sdir[0] * 0.26, pelvis[1] + sdir[1] * 0.26];
  var headC = [chest[0] + sdir[0] * 0.15, chest[1] + sdir[1] * 0.15];
  var shL = [chest[0] - perp[0] * 0.17, chest[1] - perp[1] * 0.17];
  var shR = [chest[0] + perp[0] * 0.17, chest[1] + perp[1] * 0.17];
  var hipL = [pelvis[0] - 0.09, pelvis[1] + 0.01];
  var hipR = [pelvis[0] + 0.09, pelvis[1] + 0.01];
  function limb(from, a1, a2, l1, l2) {
    var e = [from[0] + Math.sin(a1) * l1, from[1] + Math.cos(a1) * l1];
    var w = [e[0] + Math.sin(a1 + a2) * l2, e[1] + Math.cos(a1 + a2) * l2];
    return [e, w];
  }
  var armL = limb(shL, -0.55 + 0.55 * Math.sin(ph + 0.3) + n.bArmL,
                       -0.55 + 0.45 * Math.sin(ph + 1.2), 0.23, 0.21);
  var armR = limb(shR, 0.55 + 0.55 * Math.sin(ph + Math.PI + 0.3) + n.bArmR,
                       -0.55 + 0.45 * Math.sin(ph + Math.PI + 1.2), 0.23, 0.21);
  var legL = limb(hipL, 0.38 * Math.sin(ph) + n.bLegL,
                        0.12 + 0.55 * Math.max(0, Math.sin(ph - 0.6)), 0.25, 0.25);
  var legR = limb(hipR, 0.38 * Math.sin(ph + Math.PI) + n.bLegR,
                        0.12 + 0.55 * Math.max(0, Math.sin(ph + Math.PI - 0.6)), 0.25, 0.25);
  return {
    pelvis: pelvis, chest: chest, headC: headC, headR: 0.072,
    shL: shL, shR: shR, hipL: hipL, hipR: hipR,
    elL: armL[0], wrL: armL[1], elR: armR[0], wrR: armR[1],
    knL: legL[0], anL: legL[1], knR: legR[0], anR: legR[1]
  };
}

// ---------- draw ----------
function strokeSegs(segs, cxp, cyp, S, ox, oy) {
  ctx.beginPath();
  for (var i = 0; i < segs.length; i++) {
    ctx.moveTo(cxp + segs[i][0][0] * S + ox, cyp + segs[i][0][1] * S + oy);
    ctx.lineTo(cxp + segs[i][1][0] * S + ox, cyp + segs[i][1][1] * S + oy);
  }
  ctx.stroke();
}

function drawGlyph(n, t, tf) {
  var pa = pruneAlpha(n, t);
  if (pa <= 0) return;
  var gr = growthOf(n, t);
  if (gr <= 0) return;
  var dp = drawnPos(n, t);
  var cxp = W / 2 + (dp[0] - tf.cx) * tf.s;
  var cyp = H / 2 + (dp[1] - tf.cy) * tf.s;
  var S = n.size * tf.s * gr;
  if (S < 2) return;
  var sk = skeleton(n, t);
  var col = genColor(n.depth);
  var alpha = Math.pow(0.9, n.depth) * pa;
  var segs = [
    [sk.pelvis, sk.chest], [sk.chest, sk.headC], [sk.shL, sk.shR],
    [sk.shL, sk.elL], [sk.shR, sk.elR],
    [sk.hipL, sk.hipR], [sk.hipL, sk.knL], [sk.hipR, sk.knR]
  ];
  if (n.density !== 0) {
    segs.push([sk.elL, sk.wrL], [sk.elR, sk.wrR], [sk.knL, sk.anL], [sk.knR, sk.anR]);
  }
  ctx.strokeStyle = col;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(PHONE ? 1.3 : 1, 0.02 * S);
  ctx.globalAlpha = alpha;
  strokeSegs(segs, cxp, cyp, S, 0, 0);
  if (n.density === 2) { // echo density: a second, offset stroke pass
    ctx.globalAlpha = alpha * 0.45;
    strokeSegs(segs, cxp, cyp, S, 0.016 * S, 0.01 * S);
  }
  var hr = Math.max(1.2, sk.headR * S);
  ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.arc(cxp + sk.headC[0] * S, cyp + sk.headC[1] * S, hr, 0, 6.2832); ctx.stroke();
  if (n.density === 2) {
    ctx.globalAlpha = alpha * 0.45;
    ctx.beginPath(); ctx.arc(cxp + sk.headC[0] * S + 0.016 * S, cyp + sk.headC[1] * S + 0.01 * S, hr, 0, 6.2832); ctx.stroke();
  }
  if (n.density > 0) { // joint dots
    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    var dots = [sk.pelvis, sk.chest, sk.shL, sk.shR, sk.elL, sk.elR, sk.wrL, sk.wrR,
                sk.hipL, sk.hipR, sk.knL, sk.knR, sk.anL, sk.anR];
    var r = Math.max(1, 0.017 * S);
    for (var i = 0; i < dots.length; i++) {
      ctx.beginPath();
      ctx.arc(cxp + dots[i][0] * S, cyp + dots[i][1] * S, r, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function draw(t) {
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  posCache = {};
  var tf = transformAt(t);
  var i, n, dp, pp;

  // lineage lines first, under the glyphs
  ctx.strokeStyle = LINE_C;
  ctx.lineWidth = 1;
  for (i = 0; i < nodes.length; i++) {
    n = nodes[i];
    if (n.parent < 0) continue;
    var pa = pruneAlpha(n, t);
    if (pa <= 0) continue;
    dp = drawnPos(n, t);
    pp = drawnPos(nodes[n.parent], t);
    ctx.globalAlpha = 0.9 * pa;
    ctx.beginPath();
    ctx.moveTo(W / 2 + (pp[0] - tf.cx) * tf.s, H / 2 + (pp[1] - tf.cy) * tf.s);
    ctx.lineTo(W / 2 + (dp[0] - tf.cx) * tf.s, H / 2 + (dp[1] - tf.cy) * tf.s);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // glyphs, parents before descendants
  var order = nodes.slice().sort(function (a, b) { return a.depth - b.depth; });
  for (i = 0; i < order.length; i++) drawGlyph(order[i], t, tf);

  // fork flashes
  for (i = 0; i < flashes.length; i++) {
    var f = flashes[i];
    var u = (t - f.t0) / 0.45;
    if (u < 0 || u >= 1) continue;
    ctx.strokeStyle = PARENT_C;
    ctx.globalAlpha = (1 - u) * 0.85;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(W / 2 + (f.x - tf.cx) * tf.s, H / 2 + (f.y - tf.cy) * tf.s,
            (0.15 + 0.55 * u) * f.size * tf.s, 0, 6.2832);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ---------- tree actions ----------
function aliveCount() {
  var c = 0;
  for (var i = 0; i < nodes.length; i++) if (nodes[i].pruneT < 0) c++;
  return c;
}
function doFork(n, t) {
  if (n.childCount >= MAX_CHILDREN || aliveCount() >= MAX_NODES) return;
  var rng = mulberry32((seedBase * 131 + n.id * 17 + forkCount * 101 + 7) | 0);
  forkCount++;
  var child = makeNode(n, rng, t);
  nodes.push(child);
  flashes.push({ x: child.x, y: child.y, size: child.size, t0: t });
  pushTransform(t, false);
  splitClick();
  rebuildChord();
}
function isDescOrSelf(m, id) {
  var cur = m, guard = 0;
  while (cur && guard++ < 200) {
    if (cur.id === id) return true;
    if (cur.parent < 0) return false;
    cur = nodes[cur.parent];
  }
  return false;
}
function doPrune(n, t) {
  if (n.depth === 0 || n.pruneT >= 0) return;
  var changed = false;
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].pruneT < 0 && isDescOrSelf(nodes[i], n.id)) {
      nodes[i].pruneT = t;
      changed = true;
    }
  }
  if (changed) {
    pushTransform(t, false);
    pruneNoise();
    rebuildChord();
  }
}
function doReseed(t) {
  seedBase += 1;
  forkCount = 0;
  buildTree(t);
  pushTransform(t, true);
  rebuildChord();
}
function hitNode(px, py, t) {
  var tf = transformAt(t);
  posCache = {};
  var best = null, bestD = 1e18;
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.pruneT >= 0 || growthOf(n, t) < 0.6) continue;
    var dp = drawnPos(n, t);
    var cxp = W / 2 + (dp[0] - tf.cx) * tf.s;
    var cyp = H / 2 + (dp[1] - tf.cy) * tf.s;
    var hw = 0.52 * n.size * tf.s, ht = 0.62 * n.size * tf.s, hb = 0.58 * n.size * tf.s;
    if (px < cxp - hw || px > cxp + hw || py < cyp - ht || py > cyp + hb) continue;
    var d = (px - cxp) * (px - cxp) + (py - cyp) * (py - cyp);
    if (!best || n.depth > best.depth || (n.depth === best.depth && d < bestD)) {
      best = n; bestD = d;
    }
  }
  return best;
}

// ---------- audio (lazy, first gesture, guarded) ----------
var AC = null, masterGain = null, voices = [];
function ensureAudio() {
  if (AC) { if (AC.resume) AC.resume(); return; }
  var Ctor = null;
  if (typeof window !== "undefined") Ctor = window.AudioContext || window.webkitAudioContext;
  if (typeof Ctor !== "function") return;
  try {
    AC = new Ctor();
    masterGain = AC.createGain();
    masterGain.gain.value = 0.9;
    masterGain.connect(AC.destination);
    rebuildChord();
  } catch (e) { AC = null; }
}
function rebuildChord() {
  if (!AC || !masterGain) return;
  var now = AC.currentTime, i, v;
  for (i = 0; i < voices.length; i++) {
    v = voices[i];
    try {
      v.gain.gain.cancelScheduledValues(now);
      v.gain.gain.setValueAtTime(v.gain.gain.value, now);
      v.gain.gain.linearRampToValueAtTime(0.0001, now + 0.25);
      v.osc.stop(now + 0.3);
    } catch (e) {}
  }
  voices = [];
  var alive = [];
  for (i = 0; i < nodes.length; i++) if (nodes[i].pruneT < 0) alive.push(nodes[i]);
  var mul = Math.min(1, 14 / Math.max(1, alive.length));
  for (i = 0; i < alive.length; i++) {
    var n = alive[i];
    var osc = AC.createOscillator();
    osc.type = "sine";
    var freq;
    if (n.depth === 0) freq = 55;
    else freq = 110 * Math.pow(2, Math.min(n.depth, 4) - 1) *
                (1 + (hash2(seedBase, n.id * 3 + 5) - 0.5) * 0.03);
    osc.frequency.value = freq;
    var g = AC.createGain();
    var target = (n.depth === 0 ? 0.05 : 0.022 * Math.pow(0.9, n.depth)) * mul;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(target, now + 0.4);
    osc.connect(g); g.connect(masterGain);
    osc.start(now);
    voices.push({ osc: osc, gain: g });
  }
}
function splitClick() {
  if (!AC || !masterGain) return;
  try {
    var tA = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(1600, tA);
    o.frequency.exponentialRampToValueAtTime(700, tA + 0.05);
    g.gain.setValueAtTime(0.05, tA);
    g.gain.exponentialRampToValueAtTime(0.0001, tA + 0.06);
    o.connect(g); g.connect(masterGain);
    o.start(tA); o.stop(tA + 0.07);
  } catch (e) {}
}
function pruneNoise() {
  if (!AC || !masterGain) return;
  try {
    var tA = AC.currentTime;
    var len = Math.floor(AC.sampleRate * 0.28);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var data = buf.getChannelData(0);
    var rng = mulberry32(4242);
    for (var i = 0; i < len; i++) data[i] = (rng() * 2 - 1) * (1 - i / len);
    var src = AC.createBufferSource(); src.buffer = buf;
    var flt = AC.createBiquadFilter(); flt.type = "lowpass";
    flt.frequency.setValueAtTime(900, tA);
    flt.frequency.exponentialRampToValueAtTime(160, tA + 0.28);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.06, tA);
    g.gain.exponentialRampToValueAtTime(0.0001, tA + 0.28);
    src.connect(flt); flt.connect(g); g.connect(masterGain);
    src.start(tA);
  } catch (e) {}
}

// ---------- interaction ----------
var downPos = null, dragging = false, downMoved = false;
var lastTapT = -10, pendingTap = null; // {t, x, y}
function evtPos(e) {
  var r = null;
  if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
  var x = e.clientX != null ? e.clientX : 0, y = e.clientY != null ? e.clientY : 0;
  if (r) { x -= r.left; y -= r.top; }
  return [x, y];
}
function pruneAlong(p, t) {
  var tf = transformAt(t);
  posCache = {};
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.depth === 0 || n.pruneT >= 0) continue;
    var dp = drawnPos(n, t);
    var cxp = W / 2 + (dp[0] - tf.cx) * tf.s;
    var cyp = H / 2 + (dp[1] - tf.cy) * tf.s;
    var rr = Math.max(22, 0.42 * n.size * tf.s);
    var dx = p[0] - cxp, dy = p[1] - cyp;
    if (dx * dx + dy * dy < rr * rr) doPrune(n, t);
  }
}
function onDown(e) {
  ensureAudio();
  downPos = evtPos(e);
  dragging = false; downMoved = false;
}
function onMove(e) {
  if (!downPos) return;
  var p = evtPos(e);
  var dx = p[0] - downPos[0], dy = p[1] - downPos[1];
  if (dx * dx + dy * dy > 64) downMoved = true;
  if (downMoved) { dragging = true; pruneAlong(p, pieceT); }
}
function onUp(e) {
  if (!dragging && downPos) {
    if (pieceT - lastTapT < 0.35) {
      doReseed(pieceT);
      lastTapT = -10;
      pendingTap = null;
    } else {
      lastTapT = pieceT;
      pendingTap = { t: pieceT + 0.35, x: downPos[0], y: downPos[1] };
    }
  }
  downPos = null; dragging = false; downMoved = false;
}
if (canvas.addEventListener) {
  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);
}

// ---------- main loop ----------
var pieceT = T0, lastTs = -1;
function frame(ts) {
  if (lastTs < 0) lastTs = ts;
  var dt = (ts - lastTs) / 1000; lastTs = ts;
  if (dt > 0.1) dt = 0.1;
  if (dt < 0) dt = 0;
  pieceT += dt;
  if (pendingTap && pieceT >= pendingTap.t) {
    var n = hitNode(pendingTap.x, pendingTap.y, pieceT);
    if (n) doFork(n, pieceT);
    pendingTap = null;
  }
  if (flashes.length > 64) {
    flashes = flashes.filter(function (f) { return pieceT - f.t0 < 0.5; });
  }
  draw(pieceT);
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);
}

fit();
buildTree(0);
var tf0 = targetTransform();
tfKeys = [{ t0: -1e9, from: tf0, to: tf0 }];
draw(T0);
if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);
</script>
