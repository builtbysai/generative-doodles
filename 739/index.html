<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmic Latte</title>
<style>
  html, body { margin: 0; padding: 0; background: #08090B; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var GROUND = "#08090B";
  var LATTE = "#FFF8E7";    // bulb color: the average color of the universe
  var TITANIUM = "#F5F2E8"; // titanium white clusters
  var MARS = "#D9A441";     // Mars yellow clusters
  var CHROME = "#F2B234";   // chrome yellow clusters
  var CADMIUM = "#E30022";  // cadmium red sparks, rare

  var LOOP = 40;            // seconds, seamless
  var TARGET_BULBS = 600;

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : 0;
      var sh = window.screen ? window.screen.height : 0;
      var mn = Math.min(sw, sh);
      if (mn > 0 && mn < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  window.addEventListener("resize", resize);
  resize();

  // mulberry32 seeded RNG: one stream builds the whole sky at load.
  var seed = 73901147;
  function rng() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // The arch: a quadratic bezier in unit field coordinates, upper-left to
  // lower-right, bowing gently upward like the March Milky Way.
  var P0 = { x: 0.03, y: 0.14 }, P1 = { x: 0.46, y: 0.30 }, P2 = { x: 0.97, y: 0.88 };
  function archPoint(t) {
    var a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
    return {
      x: a * P0.x + b * P1.x + c * P2.x,
      y: a * P0.y + b * P1.y + c * P2.y
    };
  }
  function archNormal(t) {
    var dx = 2 * (1 - t) * (P1.x - P0.x) + 2 * t * (P2.x - P1.x);
    var dy = 2 * (1 - t) * (P1.y - P0.y) + 2 * t * (P2.y - P1.y);
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    return { x: -dy / len, y: dx / len };
  }

  // Cluster types: pigment molecules. Titanium is large and sparse, mars and
  // chrome medium, cadmium a tiny rare spark.
  var TYPES = [
    { key: "titanium", p: 0.70, color: TITANIUM, satsMin: 6, satsMax: 9, spoke: 0.020, core: 2.5, sat: 1.8 },
    { key: "mars",     p: 0.15, color: MARS,     satsMin: 4, satsMax: 6, spoke: 0.014, core: 2.2, sat: 1.6 },
    { key: "chrome",   p: 0.12, color: CHROME,   satsMin: 4, satsMax: 6, spoke: 0.014, core: 2.2, sat: 1.6 },
    { key: "cadmium",  p: 0.03, color: CADMIUM,  satsMin: 2, satsMax: 3, spoke: 0.008, core: 1.7, sat: 1.2 }
  ];
  function pickType(r) {
    var acc = 0;
    for (var i = 0; i < TYPES.length; i++) {
      acc += TYPES[i].p;
      if (r < acc) return TYPES[i];
    }
    return TYPES[0];
  }

  // Build exactly TARGET_BULBS bulbs, grouped into molecule clusters along
  // the band. Band offset uses a centered 3-sample mean so density falls off
  // away from the arch spine. All positions are unit-field coordinates, so
  // the sky is identical at every canvas size.
  var bulbs = [];
  var counts = { titanium: 0, mars: 0, chrome: 0, cadmium: 0 };
  (function build() {
    var guard = 0;
    while (bulbs.length < TARGET_BULBS && guard < 1000) {
      guard++;
      var type = pickType(rng());
      var t = Math.pow(rng(), 0.92); // near-uniform along the arch
      var center = archPoint(t);
      var nrm = archNormal(t);
      var bandOff = ((rng() + rng() + rng()) / 3 - 0.5) * 0.17;
      var cx = center.x + nrm.x * bandOff;
      var cy = center.y + nrm.y * bandOff;
      var room = TARGET_BULBS - bulbs.length;
      var sats = type.satsMin + Math.floor(rng() * (type.satsMax - type.satsMin + 1));
      if (1 + sats > room) sats = room - 1; // land exactly on the target
      if (sats < 0) break;
      var rot = rng() * Math.PI * 2;
      // central bulb: always the latte itself
      bulbs.push(makeBulb(cx, cy, LATTE, type.core, type.key));
      counts[type.key]++;
      for (var s = 0; s < sats; s++) {
        var ang = rot + (s / Math.max(1, sats)) * Math.PI * 2 + (rng() - 0.5) * 0.5;
        var rr = type.spoke * (0.75 + rng() * 0.5);
        bulbs.push(makeBulb(cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr, type.color, type.sat, type.key));
        counts[type.key]++;
      }
    }
  })();
  function makeBulb(x, y, color, r, key) {
    return {
      x: x, y: y, color: color, r: r, key: key,
      cyc: rng() < 0.5 ? 1 : 2,          // integer breathing cycles per loop
      phase: rng()                        // seeded phase offset
    };
  }

  function draw(tSec) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var u = (tSec % LOOP) / LOOP;
    var unit = Math.min(W, H);
    // Sidereal crawl: a closed sine offset, 0 at loop start and end,
    // peaking at about 6 px mid-loop. Seamless by construction.
    var driftX = Math.sin(u * Math.PI * 2) * unit * 0.0085;
    var driftY = Math.sin(u * Math.PI * 2) * unit * 0.004;
    var phone = isPhone();

    var i, b, px, py, bright, cr;
    // Pass 1: wide faint glow discs.
    for (i = 0; i < bulbs.length; i++) {
      b = bulbs[i];
      px = b.x * W + driftX; py = b.y * H + driftY;
      bright = 0.85 + 0.15 * Math.sin((u * b.cyc + b.phase) * Math.PI * 2);
      cr = b.r * (unit / 720);
      ctx.globalAlpha = 0.05 * bright;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(px, py, cr * 4.0, 0, Math.PI * 2); ctx.fill();
    }
    // Pass 2: nearer, brighter halo discs.
    for (i = 0; i < bulbs.length; i++) {
      b = bulbs[i];
      px = b.x * W + driftX; py = b.y * H + driftY;
      bright = 0.85 + 0.15 * Math.sin((u * b.cyc + b.phase) * Math.PI * 2);
      cr = b.r * (unit / 720);
      ctx.globalAlpha = 0.13 * bright;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(px, py, cr * 2.2, 0, Math.PI * 2); ctx.fill();
    }
    // Pass 3: hard core dots.
    for (i = 0; i < bulbs.length; i++) {
      b = bulbs[i];
      px = b.x * W + driftX; py = b.y * H + driftY;
      bright = 0.85 + 0.15 * Math.sin((u * b.cyc + b.phase) * Math.PI * 2);
      cr = b.r * (unit / 720);
      ctx.globalAlpha = 0.92 * bright;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(px, py, cr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Frame one: the synchronous draw at loop t = 0.
  draw(0);

  // Animation: anchored at load, elapsed time only; frame one above is the
  // fixed t = 0 state, never derived from a wall clock phase.
  var t0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  function frame(now) {
    var elapsed = ((now - t0) / 1000) % LOOP;
    draw(elapsed);
    if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);
})();
</script>
</body>
</html>
