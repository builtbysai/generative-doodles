<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№87 · Subdivision Study</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFFFFF; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(17,17,17,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to bias the splits</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.87 Subdivision Study: seeded PRNG "Subdivision Study", depth 5, loop 40s
const DEPTH=5;
const rnd=mulberry(hashStr('Subdivision Study'));
let bias=[0.5,0.5], dragging=false, holdStart=-1, frozenPhase=null;
function makeTree(depth){ const node={ratio:0.618+(rnd()-0.5)*0.12, vert:true, depth:depth, kids:null}; if(depth<DEPTH){ node.kids=[makeTree(depth+1), makeTree(depth+1)]; } return node; }
const root=makeTree(0);
function drawNode(node,x,y,w,h,prog){
  const local=clamp(prog* (DEPTH+1) - node.depth, 0, 1);
  const eased=local*local*(3-2*local);
  ctx.strokeRect(x,y,w,h);
  if(!node.kids||eased<=0.02) return;
  const vert = w>=h;
  let ratio=node.ratio;
  // drag bias pulls splits near the pointer
  if(dragging){ const cx=x+w/2, cy=y+h/2; const d=Math.hypot(cx-bias[0],cy-bias[1]); const infl=Math.max(0,1-d/320); if(vert) ratio=clamp(ratio+(bias[0]-(x+w*ratio))/Math.max(w,1)*infl*0.6,0.25,0.8); else ratio=clamp(ratio+(bias[1]-(y+h*ratio))/Math.max(h,1)*infl*0.6,0.25,0.8); }
  if(vert){ const dw=w*ratio*eased + w*(1-eased)*0.0; const sx=x+w*ratio*eased; // divider slides in
    const divX=x+w*ratio*eased + (x+w*0 - (x+w*ratio*eased))*0; // placeholder
    const dx=x + w*ratio*eased;
    ctx.beginPath(); ctx.moveTo(x+w*ratio, y); ctx.lineTo(x+w*ratio, y+h); ctx.stroke();
    drawNode(node.kids[0], x, y, w*ratio, h, prog);
    drawNode(node.kids[1], x+w*ratio, y, w*(1-ratio), h, prog);
  } else {
    ctx.beginPath(); ctx.moveTo(x, y+h*ratio); ctx.lineTo(x+w, y+h*ratio); ctx.stroke();
    drawNode(node.kids[0], x, y, w, h*ratio, prog);
    drawNode(node.kids[1], x, y+h*ratio, w, h*(1-ratio), prog);
  }
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h); const t=nowMs/1000;
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,w,h);
  const phone=isPhone();
  const S=phone? Math.min(w,h)*0.92 : Math.min(w,h)*0.78;
  const ox=(w-S)/2, oy=(h-S)/2;
  let phase;
  if(frozenPhase!==null) phase=frozenPhase; else phase=(t%40)/40;
  const tri = phase<0.5 ? phase*2 : (1-phase)*2;
  const prog=tri*tri*(3-2*tri);
  ctx.strokeStyle='#111111'; ctx.lineWidth=1;
  drawNode(root, ox, oy, S, S, prog);
  if(DEPTH!==5) console.assert(false,'depth',DEPTH);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; bias=[e.clientX,e.clientY]; frozenPhase=((performance.now()/1000)%40)/40; });
canvas.addEventListener('pointermove',e=>{ if(dragging){ bias=[e.clientX,e.clientY]; frozenPhase=null; } });
function endP(){ dragging=false; frozenPhase=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(14000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
