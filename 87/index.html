<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№87 · Subdivision Study</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFFFFF; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0, sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const wh = viewportWH(); return wh[1] > wh[0] * 1.15;
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function smooth(u){ return u*u*(3 - 2*u); }
function mulberry(seed){ let a = seed >>> 0; return function(){ a|=0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// No.87 Subdivision Study v2: a square splits at golden-ratio points, five levels deep.
// Children grow out from each divider; line weight falls with depth; drag reshapes the splits.
const DEPTH = 5;
const rnd = mulberry(hashStr('Subdivision Study'));
function makeTree(depth){
  const node = { ratio: 0.618 + (rnd() - 0.5) * 0.12, depth: depth, kids: null };
  if (depth < DEPTH) node.kids = [makeTree(depth + 1), makeTree(depth + 1)];
  return node;
}
const root = makeTree(0);

let bias = null; // [x, y] while dragging

function drawNode(node, x, y, w, h, prog){
  let rx = x, ry = y, rw = w, rh = h;
  if (node.depth === 0){
    // the founding square blooms from the center
    const e0 = smooth(clamp(prog * (DEPTH + 1.5) / 2, 0, 1));
    if (e0 <= 0) return;
    const cx = x + w / 2, cy = y + h / 2;
    rw = w * e0; rh = h * e0;
    rx = cx - rw / 2; ry = cy - rh / 2;
  }
  ctx.lineWidth = Math.max(0.5, 1.6 - node.depth * 0.22);
  ctx.strokeStyle = '#141414';
  if (!node.kids){
    // leaf: whisper of fill so depth reads
    ctx.fillStyle = 'rgba(20,20,20,0.045)';
    ctx.fillRect(rx, ry, rw, rh);
  }
  ctx.strokeRect(rx, ry, rw, rh);
  if (!node.kids) return;

  const local = clamp(prog * (DEPTH + 1.5) - node.depth, 0, 1);
  if (local <= 0) return;
  const e = smooth(local);

  const vert = rw >= rh;
  let r = node.ratio;
  if (bias){
    const ncx = rx + rw / 2, ncy = ry + rh / 2;
    const d = Math.hypot(ncx - bias[0], ncy - bias[1]);
    const infl = Math.max(0, 1 - d / 320);
    if (infl > 0){
      if (vert) r = clamp(r + (bias[0] - (rx + rw * r)) / rw * infl * 0.5, 0.2, 0.8);
      else r = clamp(r + (bias[1] - (ry + rh * r)) / rh * infl * 0.5, 0.2, 0.8);
    }
  }
  if (vert){
    const dx = rx + rw * r;
    // children grow outward from the divider
    drawNode(node.kids[0], rx + rw * r * (1 - e), ry, rw * r * e, rh, prog);
    drawNode(node.kids[1], dx, ry, rw * (1 - r) * e, rh, prog);
  } else {
    const dy = ry + rh * r;
    drawNode(node.kids[0], rx, ry + rh * r * (1 - e), rw, rh * r * e, prog);
    drawNode(node.kids[1], rx, dy, rw, rh * (1 - r) * e, prog);
  }
}

function drawFrame(nowMs){
  const [w, h] = viewportWH(); prep(w, h);
  const t = nowMs / 1000;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, h);
  const phone = isPhone();
  const S = phone ? Math.min(w, h) * 0.92 : Math.min(w, h) * 0.78;
  const ox = (w - S) / 2, oy = (h - S) / 2;
  const phase = (t % 40) / 40;
  const tri = phase < 0.5 ? phase * 2 : (1 - phase) * 2;
  const prog = smooth(tri);
  drawNode(root, ox, oy, S, S, prog);
}

canvas.addEventListener('pointerdown', e => { bias = [e.clientX, e.clientY]; });
canvas.addEventListener('pointermove', e => { if (bias) bias = [e.clientX, e.clientY]; });
function endP(){ bias = null; }
canvas.addEventListener('pointerup', endP);
canvas.addEventListener('pointercancel', endP);
canvas.addEventListener('pointerleave', endP);

function loop(nowMs){ drawFrame(nowMs); requestAnimationFrame(loop); }
drawFrame(14000);
requestAnimationFrame(loop);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
