<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.357 Prairie Plaid Bloom</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2E8D5; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.357 Prairie Plaid Bloom (betterloveart 5).
// After Suchita Prakash's "Prairie wildflower plaid" and
// her madras plaid entries: a woven plaid ground of
// uneven hand-drawn bands in sun-bleached country tones,
// with flat wildflowers, prairie blooms, grasses and
// seed heads, overflowing the plaid lines, stems crossing
// the bands, heads nodding in a slow wind wave.
//
// The plaid is data, not vectors: every band's position,
// width, colour slot and edge wobble comes from fixed
// tables built once from a fixed seed, and each band's
// edges are sampled polylines with small fixed offsets,
// so the weave reads hand-drawn, never perfect. Bands
// are drawn as flat fills at fixed alpha, so a crossing
// of two bands is one flat step darker than a single
// band over the cream ground: stepped overlap darkening
// with flat fills only, no gradients, no shadowBlur, no
// multiply compositing, no offscreen canvas.
//
// TAP advances the plaid to the next band-colour
// arrangement in a fixed authored table of four; the
// florals never change, and nothing ever reloads.
//
// Counts are asserted in code: exactly 11 vertical and
// 9 horizontal bands, exactly 4 arrangements, exactly 30
// sprigs (12 rosette blooms, 6 coneflowers, 6 seed
// heads, 6 grass clumps). Motion is one 30s seamless
// master loop: the sway is a wind wave whose phase is
// set by x position (3 spatial cycles across the field)
// running 2 whole temporal cycles per loop, so frame 30s
// is pixel-identical to frame 0. Frame one is drawn at a
// CONSTANT phase (T_OFFSET seconds into the loop), never
// from a wall clock, so the thumbnail reproduces
// byte-identically; the live loop advances from that
// same anchor.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
// Palette only, flat: wheat, faded denim, clay, cream,
// meadow green. Nothing else.
var WHEAT = '#E3C878', DENIM = '#7A93A6', CLAY = '#B96A4B',
    CREAM = '#F2E8D5', GREEN = '#6B8E5A';
var GROUND = CREAM;
var INKS = [WHEAT, DENIM, CLAY];   // band inks by slot
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var CYCLE = 30;               // seconds, seamless master loop

// ---- fixed seed ---------------------------------------------
// One deterministic generator, seeded once. All layout
// data is built from it at load and never changes.
function makeRng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
var rng = makeRng(3570119);
function rr(a, b) { return a + rng() * (b - a); }
function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }

// ---- plaid bands ----------------------------------------------
// Two band widths each way (wide and narrow). Each band
// carries a colour slot (0, 1 or 2); an arrangement maps
// slots to inks. Edge wobble: each long edge is a polyline
// sampled every 120 design px with fixed offsets of a few
// px, so no edge is straight and no two bands align.
var EDGE_STEP = 120;
function edgeWobbles(span) {
  var n = Math.ceil(span / EDGE_STEP) + 1, out = [], i;
  for (i = 0; i < n; i++) out.push(rr(-5, 5));
  return out;
}
var VBANDS = [];
(function buildVBands() {
  var widths = [172, 56, 172, 172, 56, 172, 56, 172, 172, 56, 172];
  var slots  = [0, 1, 2, 0, 1, 2, 0, 1, 2, 0, 1];
  var x = -46, i;
  for (i = 0; i < widths.length; i++) {
    VBANDS.push({
      x: x + rr(-8, 8), w: widths[i] + rr(-12, 12),
      slot: slots[i], wide: widths[i] > 100,
      wl: edgeWobbles(DH + 60), wr: edgeWobbles(DH + 60)
    });
    x += widths[i];
  }
})();
var HBANDS = [];
(function buildHBands() {
  var heights = [150, 50, 150, 150, 50, 150, 50, 150, 150];
  var slots   = [1, 2, 0, 1, 2, 0, 1, 2, 0];
  var y = -40, i;
  for (i = 0; i < heights.length; i++) {
    HBANDS.push({
      y: y + rr(-8, 8), h: heights[i] + rr(-11, 11),
      slot: slots[i], wide: heights[i] > 100,
      wt: edgeWobbles(DW + 60), wb: edgeWobbles(DW + 60)
    });
    y += heights[i];
  }
})();
if (VBANDS.length !== 11 || HBANDS.length !== 9) {
  throw new Error('Prairie Plaid Bloom needs 11 vertical and 9 horizontal bands');
}

// ---- arrangements ----------------------------------------------
// Exactly four authored band-colour arrangements. TAP
// advances to the next one; the sequence is fixed data,
// never runtime random.
var ARRANGEMENTS = [
  { v: [0, 1, 2], h: [1, 2, 0] },
  { v: [1, 2, 0], h: [2, 0, 1] },
  { v: [2, 0, 1], h: [0, 1, 2] },
  { v: [0, 2, 1], h: [2, 1, 0] }
];
if (ARRANGEMENTS.length !== 4) throw new Error('Prairie Plaid Bloom needs exactly four arrangements');
var arrangement = 0;

// ---- florals -----------------------------------------------------
// Exactly 30 sprigs in fixed cells (6 cols x 5 rows, one
// per cell, jittered inside its cell), bases low in the
// cell so stems rise and cross the plaid bands above.
// Types: 12 rosette blooms, 6 coneflowers, 6 seed heads,
// 6 grass clumps, shuffled once from the fixed seed.
var SPRIGS = [];
(function buildSprigs() {
  var types = [], i;
  for (i = 0; i < 12; i++) types.push('bloom');
  for (i = 0; i < 6; i++) types.push('cone');
  for (i = 0; i < 6; i++) types.push('seed');
  for (i = 0; i < 6; i++) types.push('grass');
  for (i = types.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1)), tmp = types[i];
    types[i] = types[j]; types[j] = tmp;
  }
  var cols = 6, rows = 5, cw = DW / cols, ch = DH / rows, idx = 0;
  var petalInks = [CLAY, WHEAT, CREAM, CLAY, WHEAT];
  var centreInks = [CLAY, DENIM, WHEAT, DENIM, CLAY];
  for (var rI = 0; rI < rows; rI++) {
    for (var cI = 0; cI < cols; cI++, idx++) {
      var type = types[idx];
      var tall = type === 'grass' ? rr(80, 150) : rr(130, 250);
      var sprig = {
        type: type,
        x: (cI + 0.5) * cw + rr(-58, 58),
        y: (rI + 1) * ch - rr(6, 44),
        h: tall,
        lean: rr(-18, 18),
        amp: rr(0.7, 1.3),
        petal: pick(petalInks),
        centre: pick(centreInks),
        petals: 7 + Math.floor(rng() * 6),
        rot: rr(0, Math.PI * 2),
        size: rr(0.85, 1.2),
        blades: 5 + Math.floor(rng() * 3),
        leafAt: rr(0.35, 0.6),
        leafSide: rng() < 0.5 ? -1 : 1
      };
      SPRIGS.push(sprig);
    }
  }
  // painter order: higher bases first, lower sprigs in front
  SPRIGS.sort(function (a, b) { return a.y - b.y; });
})();
(function assertSprigs() {
  var counts = { bloom: 0, cone: 0, seed: 0, grass: 0 };
  for (var i = 0; i < SPRIGS.length; i++) counts[SPRIGS[i].type]++;
  if (SPRIGS.length !== 30 || counts.bloom !== 12 || counts.cone !== 6 ||
      counts.seed !== 6 || counts.grass !== 6) {
    throw new Error('Prairie Plaid Bloom needs 30 sprigs, 12/6/6/6');
  }
})();

// sway: one wind wave for the whole field. Phase is set
// by x position (3 whole spatial cycles across the design
// width) and time (2 whole temporal cycles per loop), so
// the loop is seamless and heads nod in a travelling wave.
function swayAt(x, ph) {
  return Math.sin(Math.PI * 2 * (2 * ph + 3 * (x / DW)));
}

// ---- drawing ------------------------------------------------------
function drawVBand(b, ink) {
  var n = b.wl.length, i, y;
  ctx.globalAlpha = b.wide ? 0.52 : 0.66;
  ctx.fillStyle = ink;
  ctx.beginPath();
  for (i = 0; i < n; i++) {
    y = -30 + i * EDGE_STEP;
    if (i === 0) ctx.moveTo(b.x + b.wl[i], y); else ctx.lineTo(b.x + b.wl[i], y);
  }
  for (i = n - 1; i >= 0; i--) {
    y = -30 + i * EDGE_STEP;
    ctx.lineTo(b.x + b.w + b.wr[i], y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}
function drawHBand(b, ink) {
  var n = b.wt.length, i, x;
  ctx.globalAlpha = b.wide ? 0.52 : 0.66;
  ctx.fillStyle = ink;
  ctx.beginPath();
  for (i = 0; i < n; i++) {
    x = -30 + i * EDGE_STEP;
    if (i === 0) ctx.moveTo(x, b.y + b.wt[i]); else ctx.lineTo(x, b.y + b.wt[i]);
  }
  for (i = n - 1; i >= 0; i--) {
    x = -30 + i * EDGE_STEP;
    ctx.lineTo(x, b.y + b.h + b.wb[i]);
  }
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawStem(x, y, h, lean, b) {
  // one stem as a quadratic curve; the tip displacement b
  // is the sway, the control point takes a third of it
  ctx.strokeStyle = GREEN;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + lean * 0.3 + b * 0.35, y - h * 0.55, x + lean + b, y - h);
  ctx.stroke();
  return { x: x + lean + b, y: y - h };
}
function drawLeaf(x, y, h, lean, b, at, side) {
  // a small flat leaf partway up the stem, riding the bend
  var lx = x + lean * at * 0.5 + b * 0.35 * at, ly = y - h * at;
  ctx.fillStyle = GREEN;
  ctx.save();
  ctx.translate(lx, ly);
  ctx.rotate(side * -0.7 + b * 0.008);
  ctx.beginPath();
  ctx.ellipse(side * 13, 0, 15, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function drawBloomHead(s, hx, hy, tilt) {
  var R = 21 * s.size, i, a;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(tilt + s.rot);
  ctx.fillStyle = s.petal;
  for (i = 0; i < s.petals; i++) {
    a = (i / s.petals) * Math.PI * 2;
    ctx.save();
    ctx.translate(Math.cos(a) * R * 0.62, Math.sin(a) * R * 0.62);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.ellipse(0, 0, R * 0.58, R * 0.30, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = s.centre;
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.34, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function drawConeHead(s, hx, hy, tilt) {
  var R = 23 * s.size, i, a;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(tilt + s.rot);
  // drooping petals fanned under the dome, long enough
  // to hang well below it: the coneflower silhouette
  ctx.fillStyle = s.petal;
  for (i = 0; i < 8; i++) {
    a = Math.PI * (0.08 + 0.84 * (i / 7));
    ctx.save();
    ctx.translate(Math.cos(a) * R * 0.62, Math.sin(a) * R * 0.42);
    ctx.rotate(a + Math.PI / 2);
    ctx.beginPath();
    ctx.ellipse(0, 0, R * 0.85, R * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // centre dome
  ctx.fillStyle = s.centre;
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.50, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawSeedHead(s, hx, hy, tilt) {
  var R = 19 * s.size, i, a;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(tilt);
  // awns: fine lines fanning up from the head
  ctx.strokeStyle = WHEAT;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for (i = 0; i < 5; i++) {
    a = -0.6 + i * 0.3;
    ctx.beginPath();
    ctx.moveTo(Math.sin(a) * R * 0.4, -R * 0.7);
    ctx.lineTo(Math.sin(a) * R * 1.1, -R * 1.7);
    ctx.stroke();
  }
  // the head itself: a wheat oval with cream ticks
  ctx.fillStyle = WHEAT;
  ctx.beginPath();
  ctx.ellipse(0, 0, R * 0.62, R, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = CREAM;
  ctx.lineWidth = 2.4;
  for (i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(-R * 0.34, i * R * 0.32);
    ctx.lineTo(R * 0.34, i * R * 0.32);
    ctx.stroke();
  }
  ctx.restore();
}
function drawGrass(s, ph) {
  var i, off, bh, b;
  ctx.strokeStyle = GREEN;
  ctx.lineCap = 'round';
  for (i = 0; i < s.blades; i++) {
    off = (i - (s.blades - 1) / 2) * 9;
    bh = s.h * (0.7 + 0.3 * ((i * 37 % 10) / 10));
    b = swayAt(s.x + off, ph) * 13 * s.amp * (bh / s.h);
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(s.x + off, s.y);
    ctx.quadraticCurveTo(s.x + off + b * 0.3, s.y - bh * 0.6,
                         s.x + off * 1.7 + s.lean * 0.4 + b, s.y - bh);
    ctx.stroke();
  }
}
function drawSprig(s, ph) {
  if (s.type === 'grass') { drawGrass(s, ph); return; }
  var b = swayAt(s.x, ph) * 15 * s.amp;
  var tip = drawStem(s.x, s.y, s.h, s.lean, b);
  drawLeaf(s.x, s.y, s.h, s.lean, b, s.leafAt, s.leafSide);
  var tilt = b * 0.012;
  if (s.type === 'bloom') drawBloomHead(s, tip.x, tip.y, tilt);
  else if (s.type === 'cone') drawConeHead(s, tip.x, tip.y, tilt);
  else drawSeedHead(s, tip.x, tip.y, tilt);
}

function draw(t) {
  var ph = (t % CYCLE) / CYCLE;
  var arr = ARRANGEMENTS[arrangement];
  var i;
  // cream ground
  ctx.fillStyle = GROUND;
  ctx.fillRect(-40, -40, DW + 80, DH + 80);
  // the weave: horizontal bands under vertical bands;
  // each crossing is one flat alpha step darker
  for (i = 0; i < HBANDS.length; i++) drawHBand(HBANDS[i], INKS[arr.h[HBANDS[i].slot]]);
  for (i = 0; i < VBANDS.length; i++) drawVBand(VBANDS[i], INKS[arr.v[VBANDS[i].slot]]);
  // florals drawn flat over the weave, overflowing the bands
  for (i = 0; i < SPRIGS.length; i++) drawSprig(SPRIGS[i], ph);
}

// ---- state -------------------------------------------------------
// Frame one starts developed: exactly 9s into the 30s
// cycle, plaid woven and florals mid-sway (the sway phase
// at x mid-field is well off its rest point). Drawn at
// this fixed phase, never from a wall clock.
var T_OFFSET = 9;

// ---- interaction ---------------------------------------------------
// TAP anywhere advances the plaid to the next authored
// band-colour arrangement. The tap is position
// independent (the whole ground re-colours), so no
// hit-test or coordinate conversion is needed; the
// florals and the sway are untouched and nothing reloads.
canvas.addEventListener('pointerdown', function () {
  arrangement = (arrangement + 1) % ARRANGEMENTS.length;
});

// ---- frame ---------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Full-bleed field composition: cover-fit on every
  // screen, phones included, page ground in the piece's
  // own cream so any edge reads as plaid ground.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  draw(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(T_OFFSET);
if (typeof requestAnimationFrame === 'function') {
  var loadMs = Date.now();
  var loop = function () {
    frame(T_OFFSET + (Date.now() - loadMs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
