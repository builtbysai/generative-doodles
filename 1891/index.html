<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro-Gesture Percussion</title>
<style>
html, body { margin: 0; padding: 0; background: #2E2118; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Micro-Gesture Percussion: a quiet field holds a small library of
   gesture atoms, an intake-of-breath spiral, a cluck tick, a ding
   flash, a sigh ribbon, a trill comb, a whisper scatter. The atoms
   sequence stochastically across the field, each leaving a fading
   trace; the pattern never repeats verbatim but keeps a voice-like
   density. A tap drops a fresh impulse into the field; the sequencer
   may absorb it, echo it, or refuse it. The refusal is the improv
   etiquette of the piece. Tap earned, never click-to-reload. */
var TAU = Math.PI * 2;
var BG = '#2E2118';
var CHALK = '#EDE6D6';
var BONE = '#E8DFC8';
var ASH = '#8A8578';
var PLATE = '#251B13';
var PLATE_LINE = 'rgba(237,230,214,0.40)';
var TITLE_INK = '#EDE6D6';
var HINT_INK = '#E8DFC8';
var SEED0 = 1891;
var FRAME_T = 10.0;      /* fixed phase: three atoms mid-trace */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- the library: nine stations on a loose 3x3 grid, seeded ---- */
var stations = [];
(function buildStations() {
  var rngS = mulberry32(SEED0 + 7);
  var gx, gy;
  for (gy = 0; gy < 3; gy++) {
    for (gx = 0; gx < 3; gx++) {
      stations.push({
        x: 0.16 + gx * 0.34 + (rngS() * 2 - 1) * 0.05,
        y: 0.18 + gy * 0.32 + (rngS() * 2 - 1) * 0.05
      });
    }
  }
})();
/* ---- atoms: six genuinely distinct mechanisms ---- */
var TYPES = ['spiral', 'tick', 'flash', 'ribbon', 'comb', 'scatter'];
var WEIGHTS = [0.18, 0.22, 0.12, 0.18, 0.15, 0.15];
var LIVES = { spiral: 3.0, tick: 1.1, flash: 1.3, ribbon: 2.6, comb: 2.1, scatter: 2.3 };
var rng = mulberry32(SEED0);
var atoms = [];     /* {type,x,y,born,life,rot,sc,...} live gestures */
var residues = [];  /* {x,y,born,life,kind} faint marks left behind */
var refusals = [];  /* {x,y,born,life} ash-grey refusal fades */
var echoes = [];    /* {at,x,y,type} pending echo answers */
var nextEventAt = 0.8;
function pickType() {
  var r = rng(), acc = 0, i;
  for (i = 0; i < TYPES.length; i++) { acc += WEIGHTS[i]; if (r <= acc) return TYPES[i]; }
  return 'tick';
}
function spawnAtom(type, x, y, born) {
  var a = {
    type: type, x: x, y: y, born: born, life: LIVES[type],
    rot: rng() * TAU, sc: 0.8 + rng() * 0.5
  };
  if (type === 'spiral') { a.turns = 2.2 + rng() * 1.2; }
  if (type === 'ribbon') {
    a.dx = (rng() * 2 - 1) * 0.10; a.dy = (rng() * 2 - 1) * 0.06;
    a.cx = (rng() * 2 - 1) * 0.08; a.cy = (rng() * 2 - 1) * 0.08;
  }
  if (type === 'comb') {
    a.teeth = 5 + Math.floor(rng() * 3);
    a.gap = 0.012 + rng() * 0.008;
  }
  if (type === 'scatter') {
    a.dots = [];
    var n = 10 + Math.floor(rng() * 5), i;
    for (i = 0; i < n; i++) {
      var ang = rng() * TAU, rr = 0.02 + rng() * 0.06;
      a.dots.push({ ox: Math.cos(ang) * rr, oy: Math.sin(ang) * rr, r: 0.002 + rng() * 0.004, dl: rng() * 0.5 });
    }
  }
  atoms.push(a);
  return a;
}
/* One fixed simulation step: stochastic scheduling, echo answers,
   retirement of spent atoms into faint residues. */
function stepSim(dt, t) {
  var i;
  while (nextEventAt <= t) {
    var st = stations[Math.floor(rng() * stations.length)];
    spawnAtom(pickType(), st.x, st.y, nextEventAt);
    nextEventAt += 0.9 + rng() * 1.5;
  }
  for (i = echoes.length - 1; i >= 0; i--) {
    if (echoes[i].at <= t) {
      var e = echoes.splice(i, 1)[0];
      spawnAtom(e.type, e.x, e.y, e.at);
      playAtomSound(e.type, 0.5);
    }
  }
  for (i = atoms.length - 1; i >= 0; i--) {
    if (t - atoms[i].born > atoms[i].life) {
      var a = atoms.splice(i, 1)[0];
      residues.push({ x: a.x, y: a.y, born: t, life: 4.0, kind: (a.type === 'flash' ? 'ring' : 'dot') });
    }
  }
  for (i = residues.length - 1; i >= 0; i--) {
    if (t - residues[i].born > residues[i].life) residues.splice(i, 1);
  }
  for (i = refusals.length - 1; i >= 0; i--) {
    if (t - refusals[i].born > refusals[i].life) refusals.splice(i, 1);
  }
}
/* Warm the field before frame one: 200 fixed steps from t = 0 to
   t = 10, then three atoms placed mid-trace at fixed stations, so
   the first render is reproducible. */
(function warmup() {
  var t = 0, s;
  for (s = 0; s < 200; s++) { stepSim(0.05, t); t += 0.05; }
  spawnAtom('spiral', stations[2].x, stations[2].y, FRAME_T - 1.4);
  spawnAtom('ribbon', stations[4].x, stations[4].y, FRAME_T - 0.9);
  spawnAtom('tick', stations[6].x, stations[6].y, FRAME_T - 0.5);
})();
/* ---- WebAudio: lazy, only inside a user gesture, default silent ----
   The visual sequencer is time driven (a closed-form sound model);
   audio is only a renderer for tap-triggered sounds. */
var audioCtx = null;
var audioReady = false;
var soundOn = true;
function ensureAudio() {
  if (audioCtx) return;
  try {
    var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    audioCtx = new AC();
    audioReady = true;
  } catch (e) { audioCtx = null; audioReady = false; }
}
function noiseBuf(dur) {
  var len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  var d = buf.getChannelData(0), i;
  for (i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
function blip(freq, dur, gain, when) {
  var o = audioCtx.createOscillator();
  o.type = 'sine';
  o.frequency.value = freq;
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(gain, when + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(when); o.stop(when + dur + 0.05);
}
function noiseHit(filterType, freq, q, dur, gain, when, sweepTo) {
  var src = audioCtx.createBufferSource();
  src.buffer = noiseBuf(dur + 0.1);
  var flt = audioCtx.createBiquadFilter();
  flt.type = filterType;
  flt.frequency.setValueAtTime(freq, when);
  if (sweepTo) flt.frequency.exponentialRampToValueAtTime(sweepTo, when + dur);
  flt.Q.value = q;
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(gain, when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
  src.start(when); src.stop(when + dur + 0.1);
}
function playAtomSound(type, vol) {
  if (!audioCtx || !audioReady || !soundOn) return;
  vol = vol || 1;
  var t0 = audioCtx.currentTime, i;
  try {
    if (type === 'spiral') noiseHit('bandpass', 900, 1.2, 0.9, 0.10 * vol, t0, 240);
    else if (type === 'tick') blip(1700, 0.07, 0.12 * vol, t0);
    else if (type === 'flash') { blip(880, 0.5, 0.10 * vol, t0); blip(1320, 0.3, 0.05 * vol, t0); }
    else if (type === 'ribbon') noiseHit('lowpass', 500, 0.8, 1.2, 0.08 * vol, t0, 180);
    else if (type === 'comb') { for (i = 0; i < 5; i++) blip(1200 + i * 160, 0.05, 0.07 * vol, t0 + i * 0.07); }
    else if (type === 'scatter') { for (i = 0; i < 6; i++) noiseHit('highpass', 2400, 1.0, 0.06, 0.05 * vol, t0 + i * 0.05); }
    else if (type === 'refuse') blip(90, 0.35, 0.05 * vol, t0);
  } catch (e) { /* ignore */ }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The field rect: full-bleed on phones, a centered square on desktop.
   The page ground is the same deep umber, so the square reads as the
   field filling the frame. Returns {ox, oy, s, w, h}. */
function fieldRect() {
  if (isPhone) return { ox: 0, oy: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { ox: (VW - s) / 2, oy: (VH - s) / 2, s: s, w: s, h: s };
}
/* Fade envelope: quick in, long slow out, the fading trace. */
function env(age, life) {
  var p = age / life;
  if (p <= 0 || p >= 1) return 0;
  var a = p < 0.12 ? p / 0.12 : 1;
  var f = p > 0.6 ? 1 - (p - 0.6) / 0.4 : 1;
  return a * f;
}
function qpoint(x0, y0, cx, cy, x1, y1, u) {
  var v = 1 - u;
  return { x: v * v * x0 + 2 * v * u * cx + u * u * x1, y: v * v * y0 + 2 * v * u * cy + u * u * y1 };
}
function drawAtom(a, R, t) {
  var age = t - a.born;
  var al = env(age, a.life);
  if (al <= 0.01) return;
  var p = clamp(age / a.life, 0, 1);
  var cx = R.ox + a.x * R.w, cy = R.oy + a.y * R.h;
  var S = Math.min(R.w, R.h);
  var i;
  if (a.type === 'spiral') {
    /* intake of breath: a spiral uncoiling from its center */
    var maxR = 0.085 * S * a.sc;
    var total = a.turns * TAU;
    var upto = total * (0.15 + 0.85 * p);
    ctx.strokeStyle = rgba(CHALK, 0.85 * al);
    ctx.lineWidth = Math.max(1.2, S * 0.0022);
    ctx.beginPath();
    var steps = 60, ang, rr, px, py;
    for (i = 0; i <= steps; i++) {
      ang = a.rot + (i / steps) * upto;
      rr = maxR * (i / steps) * (upto / total);
      px = cx + Math.cos(ang) * rr; py = cy + Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    var hx = cx + Math.cos(a.rot + upto) * maxR * (upto / total);
    var hy = cy + Math.sin(a.rot + upto) * maxR * (upto / total);
    ctx.fillStyle = rgba(BONE, al);
    ctx.beginPath();
    ctx.moveTo(hx + Math.max(1.5, S * 0.003), hy);
    ctx.arc(hx, hy, Math.max(1.5, S * 0.003), 0, TAU);
    ctx.fill();
  } else if (a.type === 'tick') {
    /* cluck tick: one sharp angled mark, struck and gone */
    var L = 0.022 * S * a.sc * (0.4 + 0.6 * p);
    ctx.strokeStyle = rgba(CHALK, 0.9 * al);
    ctx.lineWidth = Math.max(1.4, S * 0.0028);
    ctx.beginPath();
    ctx.moveTo(cx - L * 0.7, cy - L * 0.4);
    ctx.lineTo(cx, cy + L * 0.35);
    ctx.lineTo(cx + L * 0.8, cy - L * 0.55);
    ctx.stroke();
    ctx.fillStyle = rgba(BONE, 0.7 * al);
    ctx.beginPath();
    ctx.moveTo(cx + Math.max(1.2, S * 0.002), cy + L * 0.8);
    ctx.arc(cx, cy + L * 0.8, Math.max(1.2, S * 0.002), 0, TAU);
    ctx.fill();
  } else if (a.type === 'flash') {
    /* ding flash: an expanding ring, a bright center, four ticks */
    var fr = (0.012 + 0.055 * p) * S * a.sc;
    ctx.strokeStyle = rgba(BONE, 0.8 * al);
    ctx.lineWidth = Math.max(1.2, S * 0.002);
    ctx.beginPath();
    ctx.moveTo(cx + fr, cy);
    ctx.arc(cx, cy, fr, 0, TAU);
    ctx.stroke();
    var cr = (0.009 * (1 - p) + 0.002) * S;
    ctx.fillStyle = rgba(CHALK, 0.9 * al);
    ctx.beginPath();
    ctx.moveTo(cx + cr, cy);
    ctx.arc(cx, cy, Math.max(1, cr), 0, TAU);
    ctx.fill();
    ctx.strokeStyle = rgba(CHALK, 0.6 * al);
    ctx.lineWidth = Math.max(1, S * 0.0016);
    for (i = 0; i < 4; i++) {
      var fa = a.rot + i * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(fa) * fr * 0.7, cy + Math.sin(fa) * fr * 0.7);
      ctx.lineTo(cx + Math.cos(fa) * fr * 1.2, cy + Math.sin(fa) * fr * 1.2);
      ctx.stroke();
    }
  } else if (a.type === 'ribbon') {
    /* sigh ribbon: a slow curve breathing itself out, twice */
    var x0 = a.x - a.dx, y0 = a.y - a.dy * 0.5;
    var x1 = a.x + a.dx, y1 = a.y + a.dy;
    var kx = a.x + a.cx, ky = a.y + a.cy;
    var P0 = { x: R.ox + x0 * R.w, y: R.oy + y0 * R.h };
    var PC = { x: R.ox + kx * R.w, y: R.oy + ky * R.h };
    var P1 = { x: R.ox + x1 * R.w, y: R.oy + y1 * R.h };
    ctx.strokeStyle = rgba(CHALK, 0.8 * al);
    ctx.lineWidth = Math.max(1.5, S * 0.004);
    ctx.beginPath();
    var qsteps = 40, u, qp;
    for (i = 0; i <= qsteps; i++) {
      u = (i / qsteps) * p;
      qp = qpoint(P0.x, P0.y, PC.x, PC.y, P1.x, P1.y, u);
      if (i === 0) ctx.moveTo(qp.x, qp.y); else ctx.lineTo(qp.x, qp.y);
    }
    ctx.stroke();
    ctx.strokeStyle = rgba(BONE, 0.3 * al);
    ctx.lineWidth = Math.max(1, S * 0.0018);
    ctx.beginPath();
    for (i = 0; i <= qsteps; i++) {
      u = (i / qsteps) * p;
      qp = qpoint(P0.x, P0.y + S * 0.008, PC.x, PC.y + S * 0.008, P1.x, P1.y + S * 0.008, u);
      if (i === 0) ctx.moveTo(qp.x, qp.y); else ctx.lineTo(qp.x, qp.y);
    }
    ctx.stroke();
    qp = qpoint(P0.x, P0.y, PC.x, PC.y, P1.x, P1.y, p);
    ctx.fillStyle = rgba(BONE, 0.7 * al);
    ctx.beginPath();
    ctx.moveTo(qp.x + Math.max(1.5, S * 0.0028), qp.y);
    ctx.arc(qp.x, qp.y, Math.max(1.5, S * 0.0028), 0, TAU);
    ctx.fill();

    /* trill comb: teeth sounding one after another along a rail */
    ctx.save();
    ctx.translate(cx, cy);

    var bx0 = -(n - 1) * gap / 2;
    ctx.strokeStyle = rgba(BONE, 0.5 * al);
    ctx.lineWidth = Math.max(1, S * 0.0016);
    ctx.beginPath();
    ctx.moveTo(bx0 - gap * 0.5, 0);
    ctx.lineTo(bx0 + (n - 1) * gap + gap * 0.5, 0);
    ctx.stroke();
    ctx.strokeStyle = rgba(CHALK, 0.85 * al);
    ctx.lineWidth = Math.max(1.2, S * 0.0022);
    for (i = 0; i < n; i++) {
      var tp = clamp(p * n - i, 0, 1);
      if (tp <= 0) continue;
      var th = 0.02 * S * a.sc * tp;
      ctx.beginPath();
      ctx.moveTo(bx0 + i * gap, 0);
      ctx.lineTo(bx0 + i * gap, -th);
      ctx.stroke();

    ctx.restore();

    /* whisper scatter: small grains drifting apart, never in step */
    for (i = 0; i < a.dots.length; i++) {
      var d = a.dots[i];
      var dp = clamp((p - d.dl * 0.6) / 0.4, 0, 1);
      if (dp <= 0) continue;
      var dx = d.ox * (1 + 0.35 * p) * S;
      var dy = d.oy * (1 + 0.35 * p) * S;

      ctx.moveTo(cx + dx + Math.max(1, d.r * S), cy + dy);
      ctx.arc(cx + dx, cy + dy, Math.max(1, d.r * S), 0, TAU);

    }
  }
}
function drawField(R) {

      ctx.arc(rx, ry, 0.012 * S, 0, TAU);

    ctx.fill();
    ctx.strokeStyle = rgba(ASH, 0.7 * (1 - fp));

    ctx.moveTo(fx + frr, fy);

var soundRect = { x: 0, y: 0, w: 0, h: 0 };
function drawPlates(R) {

  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Micro-Gesture Percussion').width > R.w - 60) {

  var titleW = ctx.measureText('Micro-Gesture Percussion').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 17').width;

  ctx.lineWidth = 1;

  ctx.font = 'bold ' + titlePx + 'px monospace';
