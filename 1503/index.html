<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emptiness Where Bonds Form</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e0d0; overflow: hidden; }
  canvas { display: block; background: #e8e0d0; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var FIELD = '#e8e0d0', CHARCOAL = '#2a2a30', SLATE = '#4a5a7a',
      BRICK = '#a8674a', TEAL = '#2e6f6a', WALNUT = '#6b4a3a', GOLD = '#d9a441';
  var LOOP = 60;
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, U = 0, CX = 0, CY = 0;
  var curT = 0, startTime = null;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1503000);
  // Five orbiters. revs are integers per 60 s loop, so every angle returns
  // exactly at t = LOOP. Phases are seeded, never unseeded random.
  var ELEMENTS = [
    { kind: 'doorway', revs: 1, gap: 0.110, phase: rnd() * Math.PI * 2, color: SLATE },
    { kind: 'tree',    revs: 2, gap: 0.150, phase: rnd() * Math.PI * 2, color: TEAL },
    { kind: 'figure',  revs: 3, gap: 0.125, phase: rnd() * Math.PI * 2, color: BRICK },
    { kind: 'road',    revs: 4, gap: 0.180, phase: rnd() * Math.PI * 2, color: WALNUT },
    { kind: 'window',  revs: 5, gap: 0.095, phase: rnd() * Math.PI * 2, color: SLATE }
  ];
  // Drag segments: closed-form radius history. Each pointermove records the
  // radius it set and the piece time it was set at; radiusAt(t) is the last
  // segment at or before t, or the base radius if none. Radius persists
  // after release (the drag widens/narrows the circle; it does not spring).
  var dragSegs = [];
  var dragging = false, dragAnchorR = 0, dragAnchorDist = 0;

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    if (!W || !H) { W = 720; H = 720; }
    U = Math.min(W, H);
    CX = W / 2; CY = H / 2;
    cv.width = W; cv.height = H;
  }
  function baseR() { return 0.25 * U; }
  function minR() { return 0.18 * U; }
  function maxR() { return 0.34 * U; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function radiusAt(t) {
    var r = baseR(), i;
    for (i = 0; i < dragSegs.length; i++) {
      if (dragSegs[i].t <= t) r = dragSegs[i].r; else break;
    }
    return r;
  }
  function angleOf(el, lt) {
    return el.phase + Math.PI * 2 * el.revs * lt / LOOP;
  }
  function posOf(el, t) {
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var a = angleOf(el, lt);
    var r = radiusAt(t) + el.gap * U;
    return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a), a: a };
  }
  function wrapPi(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }
  // Thread alpha between two orbiters at piece time t: 1 while the pair is
  // within 0.10 rad of exact opposition, tapering to 0 at 0.32 rad.
  function threadAlpha(pa, pb, lt) {
    var d = Math.abs(Math.abs(wrapPi(pa - pb)) - Math.PI);
    if (d >= 0.32) return 0;
    if (d <= 0.10) return 1;
    return (0.32 - d) / 0.22;
  }
  // Only the single strongest bond is ever drawn at once. With five
  // orbiters, several pairs can approach opposition together, and drawing
  // them all would read as a net or web, which the prompt forbids. One
  // thread at a time, appearing and fading as pairs pass through
  // opposition, keeps every bond a single thin line across the centre.
  function threadsAt(t) {
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var best = null, i, j, p, q, al;
    for (i = 0; i < ELEMENTS.length; i++) {
      for (j = i + 1; j < ELEMENTS.length; j++) {
        p = posOf(ELEMENTS[i], t); q = posOf(ELEMENTS[j], t);
        al = threadAlpha(p.a, q.a, lt);
        if (al > 0 && (!best || al > best.alpha)) {
          best = { i: i, j: j, alpha: Math.round(al * 10000) / 10000, p: p, q: q };
        }
      }
    }
    return best ? [best] : [];
  }
  function rect(x, y, w, h, color, alpha) {
    ctx.fillStyle = color;
    if (alpha !== undefined) ctx.globalAlpha = Math.round(alpha * 10000) / 10000;
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 1;
  }
  function disc(x, y, r, color, alpha) {
    ctx.fillStyle = color;
    if (alpha !== undefined) ctx.globalAlpha = Math.round(alpha * 10000) / 10000;
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function drawElement(el, p) {
    var s = 0.055 * U, x = p.x, y = p.y;
    ctx.save();
    if (el.kind === 'doorway') {
      rect(x - s * 0.55, y - s * 0.8, s * 1.1, s * 1.6, SLATE);
      rect(x - s * 0.32, y - s * 0.55, s * 0.64, s * 1.35, FIELD);
    } else if (el.kind === 'tree') {
      rect(x - s * 0.08, y - s * 0.1, s * 0.16, s * 0.9, WALNUT);
      disc(x, y - s * 0.55, s * 0.55, TEAL);
    } else if (el.kind === 'figure') {
      disc(x, y - s * 0.75, s * 0.28, BRICK);
      rect(x - s * 0.22, y - s * 0.45, s * 0.44, s * 0.85, BRICK);
      rect(x - s * 0.30, y + s * 0.40, s * 0.18, s * 0.55, BRICK);
      rect(x + s * 0.12, y + s * 0.40, s * 0.18, s * 0.55, BRICK);
    } else if (el.kind === 'road') {
      ctx.translate(x, y); ctx.rotate(p.a + Math.PI / 2);
      rect(-s * 0.9, -s * 0.18, s * 1.8, s * 0.36, WALNUT);
      rect(-s * 0.9, -s * 0.03, s * 1.8, s * 0.06, FIELD);
    } else if (el.kind === 'window') {
      rect(x - s * 0.55, y - s * 0.7, s * 1.1, s * 1.4, SLATE);
      rect(x - s * 0.35, y - s * 0.5, s * 0.7, s * 1.0, FIELD);
      rect(x - s * 0.03, y - s * 0.5, s * 0.06, s * 1.0, SLATE);
      rect(x - s * 0.35, y - s * 0.03, s * 0.7, s * 0.06, SLATE);
    }
    ctx.restore();
  }
  function draw(t) {
    curT = t;
    size();
    var lt = ((t % LOOP) + LOOP) % LOOP;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.fillStyle = FIELD; ctx.fillRect(0, 0, W, H);
    var R = radiusAt(t);
    // Empty circle first: field fill inside, charcoal edge only, never
    // filled with anything else. Threads are drawn AFTER the circle fill
    // (and under the elements), so a bond reads as one unbroken line
    // across the empty centre instead of two stubs outside the ring.
    ctx.fillStyle = FIELD;
    ctx.beginPath(); ctx.moveTo(CX + R, CY); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = CHARCOAL; ctx.lineWidth = Math.max(2, 0.006 * U);
    ctx.beginPath(); ctx.moveTo(CX + R, CY); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.stroke();
    var th = threadsAt(t), k, thd;
    ctx.lineCap = 'round';
    for (k = 0; k < th.length; k++) {
      thd = th[k];
      ctx.strokeStyle = GOLD;
      ctx.globalAlpha = Math.round(thd.alpha * 0.9 * 10000) / 10000;
      ctx.lineWidth = Math.max(1, 0.004 * U);
      ctx.beginPath(); ctx.moveTo(thd.p.x, thd.p.y); ctx.lineTo(thd.q.x, thd.q.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    var i, p;
    for (i = 0; i < ELEMENTS.length; i++) {
      p = posOf(ELEMENTS[i], t);
      drawElement(ELEMENTS[i], p);
    }
  }
  function pointerPos(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    return r;
  }
  function distToCentre(x, y) {
    var dx = x - CX, dy = y - CY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function onDown(e) {
    var p = pointerPos(e);
    dragging = true;
    dragAnchorR = radiusAt(curT);
    dragAnchorDist = distToCentre(p.x, p.y);
    dragSegs.push({ t: curT, r: dragAnchorR });
  }
  function onMove(e) {
    if (!dragging) return;
    var p = pointerPos(e);
    var d = distToCentre(p.x, p.y);
    var r = clamp(dragAnchorR + (d - dragAnchorDist) * 0.5, minR(), maxR());
    dragSegs.push({ t: curT, r: r });
  }
  function onUp(e) {
    dragging = false;
  }
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);
  function onResize() { draw(curT); }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', onResize);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  if (typeof window !== 'undefined') {
    window.__piece = {
      LOOP: LOOP, draw: draw, size: size,
      setTime: function (t) { curT = t; },
      radiusAt: radiusAt, baseR: baseR, minR: minR, maxR: maxR,
      positions: function (t) { var o = [], i; for (i = 0; i < ELEMENTS.length; i++) o.push(posOf(ELEMENTS[i], t)); return o; },
      threads: threadsAt, elements: ELEMENTS,
      pointerDown: function (x, y) { onDown({ clientX: x, clientY: y }); },
      pointerMove: function (x, y) { onMove({ clientX: x, clientY: y }); },
      pointerUp: function () { onUp({}); },
      centre: function () { return { x: CX, y: CY }; }
    };
  }
  draw(0);
  function loop(ts) {
    if (startTime === null) startTime = ts;
    var t = (ts - startTime) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
