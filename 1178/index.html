<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neural goldberg (chatter) — №1178</title>
<style>
  html, body { margin: 0; padding: 0; background: #0D0D10; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- neural goldberg (chatter) — Jason Soliday study SD3 ----------
  // Two semi-autonomous systems chatter across a split screen. SYSTEM-A
  // (left/top) is angular: cyan node-link constellations that snap in.
  // SYSTEM-B (right/bottom) is organic: magenta blobs that split into
  // droplets. They speak in turns; the burst COUNT cross-triggers — B
  // splits a blob into exactly as many droplets as A's last burst had
  // segments, and the count then mutates by a hash nudge (±0..2, clamped
  // 3..9) before A speaks again, so the numbers wander without ever being
  // chosen by anyone. Every ~37 s one system drops out for ~5 s while the
  // other free-runs. A tap is the "occasional interference": it injects
  // one burst into whichever system is currently quieter. No loop point,
  // no reset, no score.
  //
  // Everything is a closed-form seeded event stream: event k is generated
  // once, in time order, from mulberry32 hashes of (MASTER, k); a frame
  // at time t is a pure function of the events with age in [0, FADE).
  // Marks are data — no offscreen canvas, no ImageData, no canvas fade.

  // ---------- seeded RNG (mulberry32 only) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

  // ---------- palette ----------
  var BG = '#0D0D10';
  var DIVIDER = '#2A2A30';
  var A_COL = '#00E5FF', A_DOT = '#FFFFFF';
  var B_COL = '#FF2BD6', B_DOT = '#FFD6F5';
  var HDR = '#8A8A93';
  var PAPER = '#C9C9D2';

  // ---------- constants ----------
  var MASTER = 11780337;
  var BEAT = 0.42;            // seconds per beat; turns run 2..9 beats
  var FADE = 14;              // seconds a mark stays visible
  var T0 = 17.35;             // fixed first frame: stream mid-chatter
  var MAXMARKS = 200;         // per-system mark budget (oldest shed first)

  // ---------- dropouts ----------
  // One seeded dropout per 37 s block: starts 26..34 s into the block,
  // lasts 5 s, silences one system. Pure function of t.
  function dropoutAt(t) {
    if (t < 0) return null;
    var b = Math.floor(t / 37);
    var off = t - b * 37;
    var rng = mulberry32(MASTER + 555000 + b * 131071);
    var start = 26 + rng() * 8;
    var sys = Math.floor(rng() * 2);
    if (off >= start && off < start + 5) return { sys: sys, start: b * 37 + start };
    return null;
  }

  // ---------- the event stream ----------
  // events: {time, sys, n, cross, inj, cx, cy, seed}
  //   cx, cy: burst centroid in the system's unit field
  //   seed:   per-burst hash seed for mark geometry
  var events = [];
  var injected = [];
  var genCursor = 0.35;       // time of the next scheduled turn
  var genK = 0;               // scheduled event index
  var turnSys = 0;            // A speaks first
  var chainN = 6;             // count the next A burst will say
  var lastA = 6;              // count of A's most recent burst (B echoes it)
  var cent = [{ x: 0.42, y: 0.46 }, { x: 0.55, y: 0.52 }]; // per-system centroid walk

  function genEvent() {
    var k = genK++;
    var rng = mulberry32(MASTER + k * 7919);
    var s = turnSys;
    turnSys = 1 - turnSys;
    var beats = 2 + Math.floor(rng() * 8);          // 2..9 beats
    var dur = beats * BEAT;
    var drop = dropoutAt(genCursor);
    if (drop && drop.sys === s) {
      // this turn is swallowed by the dropout; the floor passes quickly
      genCursor += Math.min(dur, 1.9);
      return null;
    }
    var n;
    if (s === 0) {
      n = chainN;
      lastA = chainN;
      var delta = Math.floor(rng() * 5) - 2;        // -2..+2
      chainN = clamp(chainN + delta, 3, 9);
    } else {
      n = lastA;                                    // B answers with A's count
    }
    var c = cent[s];
    var nx = clamp(c.x + (rng() - 0.5) * 0.56, 0.16, 0.84);
    var ny = clamp(c.y + (rng() - 0.5) * 0.56, 0.16, 0.84);
    cent[s] = { x: nx, y: ny };
    var ev = {
      time: genCursor, sys: s, n: n,
      cross: rng() < 0.2,
      inj: false,
      cx: nx, cy: ny,
      seed: Math.floor(rng() * 1000000000)
    };
    genCursor += dur;
    return ev;
  }
  function ensureEvents(t) {
    var guard = 0;
    while (guard++ < 600) {
      var last = events.length ? events[events.length - 1].time : -1;
      if (last > t + FADE + 2 && genCursor > t + FADE + 2) break;
      var ev = genEvent();
      if (ev) events.push(ev);
      if (genCursor > t + 60) break;
    }
  }

  // ---------- mark geometry (pure per event) ----------
  // A burst: nodes on a ring around the centroid + ring edges, chords,
  // and one re-route link back to the previous A burst's nearest node.
  function aMarks(ev, prevNodes) {
    var rng = mulberry32(ev.seed);
    var nodes = [], edges = [], i, j;
    for (i = 0; i < ev.n; i++) {
      var a = (i / ev.n) * Math.PI * 2 + rng() * 0.55;
      var d = 0.055 + rng() * 0.115;
      nodes.push({ x: ev.cx + Math.cos(a) * d * 1.25, y: ev.cy + Math.sin(a) * d });
    }
    for (i = 0; i < ev.n; i++) edges.push([i, (i + 1) % ev.n]);
    for (i = 0; i < ev.n; i++) {
      j = (i + 2) % ev.n;
      if (j !== i && rng() < 0.45) edges.push([i, j]);
    }
    if (prevNodes && prevNodes.length) {
      var best = 0, bd = 1e9;
      for (i = 0; i < prevNodes.length; i++) {
        var dx = prevNodes[i].x - nodes[0].x, dy = prevNodes[i].y - nodes[0].y;
        var dd = dx * dx + dy * dy;
        if (dd < bd) { bd = dd; best = i; }
      }
      edges.push({ link: true, from: nodes[0], to: prevNodes[best] });
    }
    return { nodes: nodes, edges: edges };
  }
  // B burst: a parent blob, exactly n droplets on an expanding ring,
  // plus a few ambient blobs that merge into the parent visually.
  function bMarks(ev) {
    var rng = mulberry32(ev.seed);
    var parent = { x: ev.cx, y: ev.cy, r: 0.05 + ev.n * 0.0075 };
    var blobs = [parent];
    var nb = 2 + Math.floor(rng() * 2);
    for (var i = 0; i < nb; i++) {
      blobs.push({
        x: ev.cx + (rng() - 0.5) * 0.17,
        y: ev.cy + (rng() - 0.5) * 0.17,
        r: 0.028 + rng() * 0.034
      });
    }
    var drops = [];
    var baseA = rng() * Math.PI * 2;
    for (var d = 0; d < ev.n; d++) {
      drops.push({ a: baseA + (d / ev.n) * Math.PI * 2 + (rng() - 0.5) * 0.3, ph: rng() * 6.28 });
    }
    return { blobs: blobs, drops: drops, parent: parent };
  }
  function markCount(ev) {
    // A: n nodes + ~1.45n edges; B: blobs + n droplets + center dots
    return ev.sys === 0 ? ev.n + Math.ceil(ev.n * 1.5) : ev.n + 5;
  }

  // ---------- activity energy (drives the bars + "quieter") ----------
  function energy(list, sys, t) {
    var e = 0;
    for (var i = 0; i < list.length; i++) {
      var ev = list[i];
      if (ev.sys !== sys) continue;
      var age = t - ev.time;
      if (age >= 0 && age < 6) e += ev.n * (1 - age / 6);
    }
    return clamp01(e / 26);
  }

  // ---------- phone detection ----------
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen) {
    sw = window.screen.width || 0;
    sh = window.screen.height || 0;
  }
  var minScreen = Math.min(sw || 9999, sh || 9999);

  // ---------- canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }

  var W = 0, H = 0, isPhone = false, stacked = false;
  var layoutKey = '';
  var fields = [{ x: 0, y: 0, w: 0, h: 0 }, { x: 0, y: 0, w: 0, h: 0 }];
  var HEAD = 58;              // 78 when stacked: header gets its own lines

  function fit() {
    var w = viewW(), hgt = viewH();
    var key = w + 'x' + hgt;
    if (key === layoutKey) return;
    layoutKey = key;
    W = w; H = hgt;
    var aspectPhone = H > W * 1.15;
    isPhone = minScreen < 700 || (minScreen === 9999 && aspectPhone);
    stacked = isPhone || aspectPhone;
    HEAD = stacked ? 78 : 58;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    if (!stacked) {
      var hw = Math.floor(W / 2);
      fields[0] = { x: 18, y: HEAD + 14, w: hw - 32, h: H - HEAD - 32 };
      fields[1] = { x: hw + 14, y: HEAD + 14, w: W - hw - 32, h: H - HEAD - 32 };
    } else {
      var midY = Math.floor((H + HEAD) / 2);
      fields[0] = { x: 16, y: HEAD + 10, w: W - 32, h: midY - HEAD - 20 };
      fields[1] = { x: 16, y: midY + 10, w: W - 32, h: H - midY - 26 };
    }
  }

  function fx(f, u) { return f.x + u * f.w; }
  function fy(f, v) { return f.y + v * f.h; }
  function fr(f, r) { return r * Math.min(f.w, f.h); }

  function steppedAlpha(age) {
    var a = 1 - age / FADE;
    if (a <= 0) return 0;
    var s = Math.floor(a * 6) / 6;         // six hard steps, no smooth fade
    return 0.08 + 0.92 * s;
  }

  // ---------- drawing: one system ----------
  function drawSystem(sys, list, t) {
    var f = fields[sys];
    var ownCol = sys === 0 ? A_COL : B_COL;
    var ownDot = sys === 0 ? A_DOT : B_DOT;
    var othCol = sys === 0 ? B_COL : A_COL;

    // visible events for this system, oldest first
    var vis = [];
    var total = 0, i, ev, age;
    for (i = 0; i < list.length; i++) {
      ev = list[i];
      if (ev.sys !== sys) continue;
      age = t - ev.time;
      if (age >= 0 && age < FADE) { vis.push(ev); total += markCount(ev); }
    }
    // shed the oldest bursts while over the mark budget
    var shed = total - MAXMARKS;
    var prevNodes = null;
    for (i = 0; i < vis.length; i++) {
      ev = vis[i];
      if (shed > 0) { shed -= markCount(ev); if (sys === 0) prevNodes = null; continue; }
      age = t - ev.time;
      var alpha = steppedAlpha(age) * (sys === 0 ? 0.95 : 0.9);
      var col = ev.cross ? othCol : ownCol;
      var k;
      if (sys === 0) {
        var mk = aMarks(ev, prevNodes);
        prevNodes = mk.nodes;
        var snap = clamp01(age / 0.15);
        // edges (segments snap in over 0.15 s)
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.6;
        for (k = 0; k < mk.edges.length; k++) {
          var e = mk.edges[k];
          var p, q;
          if (e.link) { p = e.from; q = e.to; }
          else { p = mk.nodes[e[0]]; q = mk.nodes[e[1]]; }
          var x1 = fx(f, p.x), y1 = fy(f, p.y);
          var x2 = x1 + (fx(f, q.x) - x1) * snap;
          var y2 = y1 + (fy(f, q.y) - y1) * snap;
          ctx.globalAlpha = alpha * (e.link ? 0.55 : 1);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
        // node dots (small rects — the batched-arc lesson)
        ctx.fillStyle = ownDot;
        ctx.globalAlpha = alpha;
        for (k = 0; k < mk.nodes.length; k++) {
          var nd = mk.nodes[k];
          var nx = fx(f, nd.x), ny = fy(f, nd.y);
          var r = age < 0.3 ? 3.4 : 2.6;
          ctx.fillRect(nx - r / 2, ny - r / 2, r, r);
        }
        ctx.globalAlpha = 1;
      } else {
        var bm = bMarks(ev);
        ctx.fillStyle = col;
        // ambient + parent blobs (overlaps merge visually)
        ctx.globalAlpha = alpha * 0.85;
        for (k = 0; k < bm.blobs.length; k++) {
          var b = bm.blobs[k];
          var bx = fx(f, b.x), by = fy(f, b.y), br = fr(f, b.r);
          ctx.beginPath();
          ctx.moveTo(bx + br, by);
          ctx.arc(bx, by, br, 0, 6.2832);
          ctx.fill();
        }
        // droplets: ring expands over ~1.1 s, radius pulses with age
        var grow = clamp01(age / 1.1);
        var ease = 1 - (1 - grow) * (1 - grow);
        var ringR = fr(f, bm.parent.r) * (0.3 + 1.6 * ease);
        ctx.globalAlpha = alpha;
        for (k = 0; k < bm.drops.length; k++) {
          var dr = bm.drops[k];
          var dx = fx(f, bm.parent.x) + Math.cos(dr.a) * ringR * (f.w / Math.min(f.w, f.h));
          var dy = fy(f, bm.parent.y) + Math.sin(dr.a) * ringR;
          var drr = fr(f, bm.parent.r) * 0.42 * (1 + 0.18 * Math.sin(age * 5 + dr.ph));
          ctx.beginPath();
          ctx.moveTo(dx + drr, dy);
          ctx.arc(dx, dy, drr, 0, 6.2832);
          ctx.fill();
        }
        // pale center dots
        ctx.fillStyle = ownDot;
        ctx.globalAlpha = alpha * 0.9;
        var pcx = fx(f, bm.parent.x), pcy = fy(f, bm.parent.y);
        ctx.fillRect(pcx - 2, pcy - 2, 4, 4);
        for (k = 0; k < bm.drops.length; k++) {
          var dr2 = bm.drops[k];
          var ex = fx(f, bm.parent.x) + Math.cos(dr2.a) * ringR * (f.w / Math.min(f.w, f.h));
          var ey = fy(f, bm.parent.y) + Math.sin(dr2.a) * ringR;
          ctx.fillRect(ex - 1.25, ey - 1.25, 2.5, 2.5);
        }
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---------- drawing: frame ----------
  var lastT = T0;

  function draw(t) {
    fit();
    lastT = t;
    ensureEvents(t);
    var list = events.concat(injected);
    list.sort(function (a, b) { return a.time - b.time; });

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    drawSystem(0, list, t);
    drawSystem(1, list, t);

    // divider
    ctx.fillStyle = DIVIDER;
    if (!stacked) ctx.fillRect(Math.floor(W / 2) - 1, HEAD - 6, 2, H - HEAD + 6);
    else ctx.fillRect(0, Math.floor((H + HEAD) / 2) - 1, W, 2);

    // ---- header ----
    ctx.textBaseline = 'alphabetic';
    // system labels + activity bars (stacked: below the header lines,
    // so the centered header never collides with the corner labels)
    var eA = energy(list, 0, t), eB = energy(list, 1, t);
    var barW = Math.min(92, W * 0.16);
    var labelY = stacked ? 62 : 24, barY = labelY + 7;
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = A_COL;
    ctx.fillText('SYSTEM-A', 16, labelY);
    ctx.fillStyle = B_COL;
    ctx.textAlign = 'right';
    ctx.fillText('SYSTEM-B', W - 16, labelY);
    var labW = ctx.measureText('SYSTEM-A').width;   // still bold 12px here
    // bars
    ctx.fillStyle = '#232329';
    ctx.fillRect(16, barY, barW, 5);
    ctx.fillRect(W - 16 - barW, barY, barW, 5);
    ctx.fillStyle = A_COL;
    ctx.fillRect(16, barY, barW * eA, 5);
    ctx.fillStyle = B_COL;
    ctx.fillRect(W - 16 - barW * eB, barY, barW * eB, 5);
    // dropout tag: beside the label when stacked, under the bar otherwise
    var drop = dropoutAt(t);
    if (drop) {
      ctx.font = '10px monospace';
      if (drop.sys === 0) {
        ctx.fillStyle = A_COL;
        if (stacked) {
          ctx.textAlign = 'left';
          ctx.fillText('DROPPED OUT', 16 + labW + 12, labelY);
        } else {
          ctx.textAlign = 'left';
          ctx.fillText('DROPPED OUT', 16, 48);
        }
      } else {
        ctx.fillStyle = B_COL;
        if (stacked) {
          ctx.textAlign = 'right';
          ctx.fillText('DROPPED OUT', W - 16 - labW - 12, labelY);
        } else {
          ctx.textAlign = 'right';
          ctx.fillText('DROPPED OUT', W - 16, 48);
        }
      }
    }

    // header line, verbatim
    ctx.textAlign = 'center';
    ctx.fillStyle = HDR;
    ctx.font = (isPhone ? 10.5 : 12.5) + 'px monospace';
    ctx.fillText('semi-autonomous chatter — interference: occasional.', W / 2, stacked ? 20 : 22);

    // turn counter: last exchange direction + count of exchanges
    var sched = [];
    for (var i = 0; i < list.length; i++) {
      if (!list[i].inj && list[i].time <= t) sched.push(list[i]);
    }
    if (sched.length >= 2) {
      var latest = sched[sched.length - 1];
      var dirTxt = latest.sys === 1 ? 'A → B' : 'B → A';
      ctx.fillStyle = PAPER;
      ctx.font = '12px monospace';
      ctx.fillText(dirTxt + ' ×' + (sched.length - 1), W / 2, stacked ? 40 : 44);
    } else if (sched.length === 1) {
      ctx.fillStyle = PAPER;
      ctx.font = '12px monospace';
      ctx.fillText('— ×0', W / 2, stacked ? 40 : 44);
    }
    ctx.textAlign = 'left';
  }

  // ---------- clock: anchored phase + elapsed ----------
  var anchorT = T0;
  var anchorStamp = null;

  function frame(stamp) {
    if (anchorStamp === null && typeof stamp === 'number') anchorStamp = stamp;
    var t = anchorT + (typeof stamp === 'number' ? (stamp - anchorStamp) / 1000 : 0);
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  // ---------- interaction: tap = occasional interference ----------
  var tapK = 0;
  function onDown(e) {
    var list = events.concat(injected);
    var eA = energy(list, 0, lastT), eB = energy(list, 1, lastT);
    var quiet = eA <= eB ? 0 : 1;
    var rng = mulberry32(MASTER + 999000 + (tapK++) * 31337);
    // centroid near the quiet system's own recent centroid
    var base = null, i;
    for (i = list.length - 1; i >= 0; i--) {
      if (list[i].sys === quiet && list[i].time <= lastT) { base = list[i]; break; }
    }
    var cx = base ? base.cx : 0.5, cy = base ? base.cy : 0.5;
    injected.push({
      time: lastT, sys: quiet,
      n: 3 + Math.floor(rng() * 7),
      cross: rng() < 0.2,
      inj: true,
      cx: clamp(cx + (rng() - 0.5) * 0.4, 0.16, 0.84),
      cy: clamp(cy + (rng() - 0.5) * 0.4, 0.16, 0.84),
      seed: Math.floor(rng() * 1000000000)
    });
    draw(lastT);
    if (e && e.preventDefault) e.preventDefault();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('touchstart', onDown, { passive: false });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { layoutKey = ''; draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { layoutKey = ''; draw(lastT); });
  }

  // synchronous fixed-phase first frame
  draw(T0);

  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(function (stamp) {
      anchorStamp = stamp;
      frame(stamp);
    });
  }
})();
</script>
</body>
</html>
