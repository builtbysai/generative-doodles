<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№651 The Lonely Bench</title>
<style>
  html, body { margin: 0; padding: 0; background: #a9c6bf; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1992 The Lonely Bench, SN1 / PP1239, study #260 syd-nuku.
  // A locked static frame of a drab room: pale institutional walls,
  // one bench, three figures arranged like furniture facing nowhere.
  // Nothing moves except the middle figure, who slowly leans, and
  // once per cycle raises a hand and lowers it again, all at glacial
  // pace. Palette: washed turquoise and grey, one warm skin tone,
  // tired fluorescent white. The locked camera is the discipline.
  // Watch-only: there is nothing to touch here.
  var GROUND = '#a9c6bf'; // page ground, the wall colour itself

  // Fixed-phase first frame: FIRST_T = 40 s. The cycle is 120 s: the
  // lean is a slow sine over the full cycle, the hand rises once per
  // cycle (up 52-64 s, held 64-76 s, down 76-88 s) and is still the
  // rest of the time. At t = 40 the lean is at 0.575 of its full
  // 7 degrees, the hand is down: the first frame shows the middle
  // figure caught mid-lean, the room otherwise perfectly still.
  var FIRST_T = 40;
  var CYCLE = 120;
  var SEED = 1992;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: washed turquoise and grey, one warm skin tone, tired
  // fluorescent white. Nothing rich, nothing saturated.
  var WALL_TOP = [174, 201, 194];
  var WALL_BOT = [157, 184, 177];
  var FLOOR = [143, 146, 144];
  var FLOOR_DARK = [126, 130, 128];
  var BASEBOARD = [124, 128, 125];
  var BENCH = [107, 111, 108];
  var BENCH_DARK = [84, 88, 86];
  var FLUOR = [238, 240, 230];     // tired fluorescent white
  var SKIN = [201, 161, 132];      // the one warm skin tone
  var SKIN_SHADE = [178, 138, 110];
  var CLOTH_A = [122, 127, 124];   // left figure
  var CLOTH_B = [106, 110, 107];   // middle figure (the leaner)
  var CLOTH_C = [134, 139, 136];   // right figure
  var LEGS = [88, 92, 90];
  var SHOE = [70, 74, 72];
  var CAPTION = [55, 64, 61];

  // Furniture-like blocking: three figures, awkward symmetry.
  // Fixed seeded jitter so the arrangement is identical every load.
  var blockRng = mulberry32(SEED * 7 + 3);
  var FIGURES = [
    { x: 0.245 + (blockRng() - 0.5) * 0.012, cloth: CLOTH_A, leaner: false },
    { x: 0.505 + (blockRng() - 0.5) * 0.012, cloth: CLOTH_B, leaner: true },
    { x: 0.755 + (blockRng() - 0.5) * 0.012, cloth: CLOTH_C, leaner: false }
  ];

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Scene rect: the wide room shot inside the stage. Desktop keeps a
  // 16:10 letterbox; phones get a near-square room so the figures
  // stay legible. Outside the rect is plain wall colour.
  var SX = 0, SY = 0, SW = 0, SH = 0;
  function sceneRect() {
    SW = 0.96 * W;
    SH = isPhone ? Math.min(0.58 * H, SW / 0.95) : SW / 1.6;
    SX = (W - SW) / 2;
    SY = (H - SH) / 2;
  }
  function X(f) { return SX + f * SW; }
  function Y(f) { return SY + f * SH; }

  // ---- Cycle -----------------------------------------------------
  // Lean: 0..1 over the 120 s cycle, a slow sine. Phase chosen so
  // lean(40) = 0.575, mid-lean at the first frame.
  var LEAN_PHASE = -1.944;
  var LEAN_MAX = 0.122; // 7 degrees
  function leanOf(t) {
    return 0.5 + 0.5 * Math.sin(2 * Math.PI * t / CYCLE + LEAN_PHASE);
  }
  // Hand: 0 except one window per cycle. Up 52-64, held 64-76,
  // down 76-88, still for the other 84 seconds.
  function handOf(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    if (p < 52 || p >= 88) { return 0; }
    if (p < 64) { return smooth((p - 52) / 12); }
    if (p < 76) { return 1; }
    return 1 - smooth((p - 76) / 12);
  }
  function cycleState(t) {
    return { lean: leanOf(t), hand: handOf(t) };
  }

  // ---- Room ------------------------------------------------------
  var FLOOR_Y = 0.68;   // floor line, scene fraction
  var SEAT_Y = 0.55;    // bench seat top, scene fraction

  function drawRoom() {
    // Wall: gentle vertical gradient, washed turquoise.
    var wg = ctx.createLinearGradient(0, Y(0), 0, Y(FLOOR_Y));
    wg.addColorStop(0, rgb(WALL_TOP));
    wg.addColorStop(1, rgb(WALL_BOT));
    ctx.fillStyle = wg;
    ctx.fillRect(X(0), Y(0), SW, FLOOR_Y * SH);

    // Faint wall panel seams, barely there.
    ctx.strokeStyle = rgba([90, 105, 100], a4(0.10));
    ctx.lineWidth = Math.max(1, SW * 0.0015);
    var seam;
    for (seam = 0; seam < 3; seam++) {
      var sx = X(0.10 + seam * 0.40);
      ctx.beginPath();
      ctx.moveTo(sx, Y(0.02));
      ctx.lineTo(sx, Y(FLOOR_Y));
      ctx.stroke();
    }

    // One small scuff on the wall, left of the bench.
    ctx.fillStyle = rgba([90, 100, 96], a4(0.12));
    ctx.beginPath();
    ctx.moveTo(X(0.075), Y(0.40));
    ctx.arc(X(0.075), Y(0.40), SW * 0.012, 0, Math.PI * 2);
    ctx.fill();

    // Fluorescent fixture: tired white bar with a soft tired glow.
    var fx = X(0.33), fw = 0.34 * SW, fy = Y(0.06), fh = 0.032 * SH;
    var glow = ctx.createRadialGradient(
      fx + fw / 2, fy + fh / 2, 0, fx + fw / 2, fy + fh / 2, fw * 0.75);
    glow.addColorStop(0, rgba(FLUOR, a4(0.28)));
    glow.addColorStop(1, rgba(FLUOR, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(fx - fw * 0.5, fy - fh * 4, fw * 2, fh * 10);
    ctx.fillStyle = rgba([120, 126, 122], a4(0.55));
    ctx.fillRect(fx - SW * 0.004, fy - SH * 0.006, fw + SW * 0.008, fh + SH * 0.006);
    ctx.fillStyle = rgb(FLUOR);
    ctx.fillRect(fx, fy, fw, fh);

    // Floor and baseboard.
    ctx.fillStyle = rgb(FLOOR);
    ctx.fillRect(X(0), Y(FLOOR_Y), SW, SH * (1 - FLOOR_Y));
    ctx.fillStyle = rgb(FLOOR_DARK);
    ctx.fillRect(X(0), Y(FLOOR_Y), SW, SH * 0.012);
    ctx.fillStyle = rgb(BASEBOARD);
    ctx.fillRect(X(0), Y(FLOOR_Y - 0.022), SW, SH * 0.022);
  }

  function drawBench() {
    // Soft shadow under the bench.
    ctx.fillStyle = rgba([60, 64, 62], a4(0.20));
    ctx.beginPath();
    ctx.moveTo(X(0.12), Y(FLOOR_Y) + SH * 0.01);
    ctx.lineTo(X(0.88), Y(FLOOR_Y) + SH * 0.01);
    ctx.lineTo(X(0.88), Y(FLOOR_Y) + SH * 0.045);
    ctx.lineTo(X(0.12), Y(FLOOR_Y) + SH * 0.045);
    ctx.closePath();
    ctx.fill();

    // Legs, then the seat slab.
    ctx.fillStyle = rgb(BENCH_DARK);
    ctx.fillRect(X(0.155), Y(SEAT_Y + 0.028), SW * 0.018, SH * (FLOOR_Y - SEAT_Y - 0.028));
    ctx.fillRect(X(0.827), Y(SEAT_Y + 0.028), SW * 0.018, SH * (FLOOR_Y - SEAT_Y - 0.028));
    ctx.fillStyle = rgb(BENCH);
    ctx.fillRect(X(0.13), Y(SEAT_Y), SW * 0.74, SH * 0.028);
    ctx.fillStyle = rgba([200, 205, 200], a4(0.35));
    ctx.fillRect(X(0.13), Y(SEAT_Y), SW * 0.74, SH * 0.005);
  }

  // ---- Figures ---------------------------------------------------
  // Seated figure, front view: torso, head, legs hanging to the
  // floor, arms at the sides. U is the torso height in px.
  function drawFigure(fig, cs) {
    var hx = X(fig.x);
    var hipY = Y(SEAT_Y);
    var floorY = Y(FLOOR_Y);
    var U = 0.17 * SH;
    var torsoW = 0.105 * SW;
    var headR = 0.032 * SH;

    // Contact shadow on the floor under the figure: a flat ellipse.
    ctx.fillStyle = rgba([60, 64, 62], a4(0.18));
    ctx.beginPath();
    ctx.moveTo(hx + torsoW * 0.62, floorY + SH * 0.012);
    ctx.ellipse(hx, floorY + SH * 0.012, torsoW * 0.62, SH * 0.012, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs: two dark rects from the seat front down to the floor,
    // with shoes. Legs never lean: the feet stay planted.
    var legW = 0.020 * SW;
    var legX1 = hx - torsoW * 0.30;
    var legX2 = hx + torsoW * 0.30 - legW;
    ctx.fillStyle = rgb(LEGS);
    ctx.fillRect(legX1, hipY + SH * 0.01, legW, floorY - hipY - SH * 0.01);
    ctx.fillRect(legX2, hipY + SH * 0.01, legW, floorY - hipY - SH * 0.01);
    ctx.fillStyle = rgb(SHOE);
    ctx.fillRect(legX1 - SW * 0.004, floorY - SH * 0.018, legW + SW * 0.012, SH * 0.018);
    ctx.fillRect(legX2 - SW * 0.004, floorY - SH * 0.018, legW + SW * 0.012, SH * 0.018);

    // Torso, head and arms: the leaner rotates about the hip.
    var leanAngle = fig.leaner ? cs.lean * LEAN_MAX : 0;
    ctx.save();
    ctx.translate(hx, hipY);
    ctx.rotate(leanAngle);

    // Torso: a plain rounded block.
    ctx.fillStyle = rgb(fig.cloth);
    ctx.beginPath();
    ctx.moveTo(-torsoW / 2, 0);
    ctx.lineTo(-torsoW / 2, -U * 0.92);
    ctx.quadraticCurveTo(-torsoW / 2, -U, -torsoW * 0.32, -U);
    ctx.lineTo(torsoW * 0.32, -U);
    ctx.quadraticCurveTo(torsoW / 2, -U, torsoW / 2, -U * 0.92);
    ctx.lineTo(torsoW / 2, 0);
    ctx.closePath();
    ctx.fill();

    // Neck and head: the one warm skin tone, facing nowhere.
    ctx.fillStyle = rgb(SKIN_SHADE);
    ctx.fillRect(-torsoW * 0.09, -U - headR * 0.55, torsoW * 0.18, headR * 0.7);
    ctx.fillStyle = rgb(SKIN);
    ctx.beginPath();
    ctx.moveTo(headR, -U - headR * 0.35);
    ctx.arc(0, -U - headR * 0.35, headR, 0, Math.PI * 2);
    ctx.fill();
    // Hair: a flat grey cap, no face detail at this distance.
    ctx.fillStyle = rgba([105, 108, 105], a4(0.85));
    ctx.beginPath();
    ctx.moveTo(-headR, -U - headR * 0.35);
    ctx.arc(0, -U - headR * 0.35, headR, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.fill();

    // Left arm hangs at the side.
    drawArm(-1, 0, torsoW, U, fig.cloth);
    // Right arm: the leaner raises it once per cycle; the others
    // keep it hanging.
    var hand = fig.leaner ? cs.hand : 0;
    drawArm(1, hand, torsoW, U, fig.cloth);

    ctx.restore();
  }

  // Arm from the shoulder. hand = 0 hangs straight down, hand = 1
  // is raised up and out. Drawn in the (possibly rotated) figure
  // frame, shoulder at the torso edge.
  function drawArm(side, hand, torsoW, U, cloth) {
    var shX = side * torsoW * 0.44;
    var shY = -U * 0.86;
    var len = U * 0.62;
    // Angle from straight down, toward the figure's own side.
    // Down: 0.12 rad, barely out. Raised: 2.20 rad, up and out.
    var theta = 0.12 + (2.20 - 0.12) * smooth(hand);
    var hx = shX + side * Math.sin(theta) * len;
    var hy = shY + Math.cos(theta) * len;
    ctx.strokeStyle = rgb(cloth);
    ctx.lineWidth = Math.max(2, torsoW * 0.16);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(shX, shY);
    ctx.lineTo(hx, hy);
    ctx.stroke();
    // Skin hand at the end of the arm.
    ctx.fillStyle = rgb(SKIN);
    ctx.beginPath();
    ctx.moveTo(hx + Math.max(1.5, torsoW * 0.07), hy);
    ctx.arc(hx, hy, Math.max(1.5, torsoW * 0.07), 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- Captions --------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    sceneRect();

    var cs = cycleState(t);

    // Ground is the wall colour; the stage is the room.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawRoom();
    drawBench();
    var i;
    for (i = 0; i < FIGURES.length; i++) {
      drawFigure(FIGURES[i], cs);
    }

    // Title plate, top left, and the hint, bottom center. Dark slate
    // stays readable over the washed wall.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.72));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№651 · The Lonely Bench', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CAPTION, a4(0.55));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2007 · 06 · 26', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CAPTION, a4(0.75));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch. Nothing hurries here.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer listeners. The piece is watched,
  // never driven.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1992 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1992 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return cycleState(t); },
      lean: function (t) { return leanOf(t); },
      hand: function (t) { return handOf(t); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: a 120 s lean and one hand raise per cycle, glacial.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
