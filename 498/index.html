<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slash Races</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #47AE65; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var GREEN = '#47AE65';
  var RED = '#B93439';
  var WHITE = '#FFFFFF';
  var SUIT = '#5E79D0';
  var NAVY = '#3D5577';
  var BIB = '#FE0000';
  var SKIN = '#F8F5F0';

  var REST_ANGLE = Math.PI * 0.75; // slash runs top-right to bottom-left (-45 deg line)

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smoothstep(lo, hi, v) {
    var t = clamp((v - lo) / (hi - lo), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function rot(x, y, ang) {
    var c = Math.cos(ang), s = Math.sin(ang);
    return { x: x * c - y * s, y: x * s + y * c };
  }

  // ---------------- viewport ----------------
  var W = 0, H = 0, isPhone = false;
  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
    buildField();
    draw(lastT);
  }

  // ---------------- dot field (seeded, normalized) ----------------
  var dots = [];
  function buildField() {
    var rng = mulberry32(498001);
    dots = [];
    var minD = Math.min(W, H);
    var sp = clamp(0.032 * minD, 12, 34);
    var cols = Math.ceil((W + 2 * sp) / sp);
    var rows = Math.ceil((H + 2 * sp) / sp);
    for (var i = 0; i < cols; i++) {
      for (var j = 0; j < rows; j++) {
        dots.push({
          bx: -sp + i * sp + (rng() - 0.5) * sp * 0.7,
          by: -sp + j * sp + (rng() - 0.5) * sp * 0.7,
          rv: 0.7 + rng() * 0.6
        });
      }
    }
    dots.sp = sp;
  }

  // ---------------- racers (seeded speckle etc.) ----------------
  function bilerp(p0, p1, p2, p3, s, t) {
    var ax = p0.x + (p1.x - p0.x) * s, ay = p0.y + (p1.y - p0.y) * s;
    var bx = p3.x + (p2.x - p3.x) * s, by = p3.y + (p2.y - p3.y) * s;
    return { x: ax + (bx - ax) * t, y: ay + (by - ay) * t };
  }
  var TORSO = [{ x: -0.11, y: -0.47 }, { x: 0.03, y: -0.47 }, { x: 0.21, y: -0.735 }, { x: 0.09, y: -0.775 }];
  var THIGH_N = [{ x: 0.10, y: -0.285 }, { x: 0.19, y: -0.30 }, { x: 0.005, y: -0.52 }, { x: -0.095, y: -0.50 }];
  var THIGH_F = [{ x: 0.065, y: -0.265 }, { x: 0.155, y: -0.28 }, { x: -0.03, y: -0.50 }, { x: -0.13, y: -0.48 }];

  function makeRacer(seed, uFrac, vOff, hFrac, phase) {
    var rng = mulberry32(seed);
    var speck = [];
    var i, p;
    for (i = 0; i < 30; i++) { // torso back half only (front is the bib)
      p = bilerp(TORSO[0], TORSO[1], TORSO[2], TORSO[3], rng() * 0.45, 0.08 + rng() * 0.84);
      speck.push({ x: p.x, y: p.y, r: 0.008 + rng() * 0.008 });
    }
    for (i = 0; i < 12; i++) {
      p = bilerp(THIGH_N[0], THIGH_N[1], THIGH_N[2], THIGH_N[3], rng(), rng());
      speck.push({ x: p.x, y: p.y, r: 0.007 + rng() * 0.007 });
    }
    for (i = 0; i < 12; i++) {
      p = bilerp(THIGH_F[0], THIGH_F[1], THIGH_F[2], THIGH_F[3], rng(), rng());
      speck.push({ x: p.x, y: p.y, r: 0.007 + rng() * 0.007 });
    }
    return {
      uFrac: uFrac, vOff: vOff, hFrac: hFrac, phase: phase,
      lean: (rng() - 0.5) * 0.05, speck: speck
    };
  }
  var racers = [
    makeRacer(498101, -0.13, -0.10, 0.30, 0.9),
    makeRacer(498202, 0.15, 0.10, 0.26, 2.4)
  ];

  var NAMES = [
    { text: 'IRENE', color: NAVY, uFrac: -0.14, side: 1 },
    { text: 'ELENA', color: BIB, uFrac: 0.14, side: -1 }
  ];

  // ---------------- interaction state ----------------
  var delta = 0, omega = 0;         // slash angle spring (offset from rest)
  var dragging = false, dragTarget = 0, dragSX = 0, dragSY = 0;
  var lastT = 0, prevTs = -1;

  function onDown(x, y) { dragging = true; dragSX = x; dragSY = y; }
  function onMove(x, y) {
    if (!dragging) return;
    dragTarget = clamp(((x - dragSX) - (y - dragSY)) * 0.0008, -0.16, 0.16);
  }
  function onUp() { dragging = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY); });
    canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', function (e) { if (e.touches && e.touches[0]) onDown(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    canvas.addEventListener('touchmove', function (e) { if (e.touches && e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    canvas.addEventListener('touchend', onUp);
  }

  // ---------------- drawing helpers ----------------
  function poly(pts, fill) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }
  function quad(x1, y1, x2, y2, x3, y3, x4, y4, fill) {
    poly([{ x: x1, y: y1 }, { x: x2, y: y2 }, { x: x3, y: y3 }, { x: x4, y: y4 }], fill);
  }

  function drawRacer(r, C, a, b, slashLen, halfW, t, stretch) {
    var Hpx = Math.min(r.hFrac * H, slashLen * r.hFrac * 1.05, 0.62 * W);
    var bob = Math.sin(t * (Math.PI * 2 / 1.6) + r.phase) * 0.008 * Math.min(W, H);
    var u = r.uFrac * slashLen + bob;
    var v = r.vOff * halfW;
    var px = C.x + u * a.x + v * b.x;
    var py = C.y + u * a.y + v * b.y;
    // keep the whole rig in frame on narrow screens (head reaches ~0.86 Hpx
    // up-slope-side of the anchor, ski tail ~0.3 Hpx the other way)
    px = clamp(px, 0.82 * Hpx, W - 0.30 * Hpx);
    py = clamp(py, 0.60 * Hpx, H - 0.32 * Hpx);
    var wob = 0.02 * Math.sin(t * (Math.PI * 2 / 1.7) + r.phase * 1.7) + delta * 0.6;
    var a2 = rot(a.x, a.y, wob + r.lean), b2 = rot(b.x, b.y, wob + r.lean);
    ctx.setTransform(a2.x * Hpx * stretch, a2.y * Hpx * stretch, -b2.x * Hpx, -b2.y * Hpx, px, py);

    // far ski + tip
    quad(-0.30, 0.050, 0.30, 0.036, 0.30, 0.064, -0.30, 0.078, NAVY);
    quad(0.30, 0.036, 0.385, 0.006, 0.40, 0.022, 0.30, 0.064, NAVY);
    // far leg
    quad(-0.040, -0.005, 0.020, -0.015, 0.140, -0.285, 0.080, -0.30, SUIT);   // shin
    quad(0.065, -0.265, 0.155, -0.28, -0.03, -0.50, -0.13, -0.48, SUIT);      // thigh
    // near ski + tip
    quad(-0.30, 0.006, 0.30, -0.008, 0.30, 0.020, -0.30, 0.034, NAVY);
    quad(0.30, -0.008, 0.385, -0.038, 0.40, -0.022, 0.30, 0.020, NAVY);
    // near leg
    quad(0.005, -0.02, 0.065, -0.03, 0.185, -0.30, 0.125, -0.315, SUIT);     // shin
    quad(0.10, -0.285, 0.19, -0.30, 0.005, -0.52, -0.095, -0.50, SUIT);      // thigh
    quad(0.0, -0.035, 0.075, -0.045, 0.085, 0.005, 0.01, 0.012, NAVY);       // boot
    // far arm (swept back)
    quad(0.075, -0.755, 0.185, -0.715, 0.03, -0.575, -0.075, -0.615, SUIT);
    quad(0.02, -0.575, -0.075, -0.615, -0.175, -0.46, -0.09, -0.425, SUIT);
    // torso
    quad(-0.11, -0.47, 0.03, -0.47, 0.21, -0.735, 0.09, -0.775, SUIT);
    // bib (front panel)
    quad(-0.005, -0.472, 0.032, -0.468, 0.212, -0.733, 0.15, -0.752, BIB);
    // near arm (swept back, with pole)
    quad(0.115, -0.745, 0.225, -0.70, 0.10, -0.53, -0.005, -0.575, SUIT);
    quad(0.095, -0.535, -0.005, -0.575, -0.115, -0.415, -0.03, -0.385, SUIT);
    // tricolor sleeve patch on near upper arm
    var S = { x: 0.17, y: -0.72 }, E = { x: 0.05, y: -0.555 };
    var dx = E.x - S.x, dy = E.y - S.y, len = Math.sqrt(dx * dx + dy * dy);
    var ux = dx / len, uy = dy / len, nx = -uy, ny = ux, pw = 0.034;
    var cols = [GREEN, WHITE, BIB];
    for (var k = 0; k < 3; k++) {
      var t0 = 0.30 + k * 0.13, t1 = t0 + 0.13;
      var cx0 = S.x + dx * t0, cy0 = S.y + dy * t0, cx1 = S.x + dx * t1, cy1 = S.y + dy * t1;
      quad(cx0 + nx * pw, cy0 + ny * pw, cx1 + nx * pw, cy1 + ny * pw,
           cx1 - nx * pw, cy1 - ny * pw, cx0 - nx * pw, cy0 - ny * pw, cols[k]);
    }
    // pole
    ctx.beginPath();
    ctx.moveTo(-0.07, -0.40);
    ctx.lineTo(0.14, 0.005);
    ctx.strokeStyle = NAVY;
    ctx.lineWidth = 0.013;
    ctx.stroke();
    // suit speckle (seeded, kept off the face and bib)
    ctx.fillStyle = WHITE;
    for (var i = 0; i < r.speck.length; i++) {
      ctx.beginPath();
      ctx.arc(r.speck[i].x, r.speck[i].y, r.speck[i].r, 0, Math.PI * 2);
      ctx.fill();
    }
    // neck + head (her face grammar: near-white skin, flat hair block, arc eye)
    quad(0.155, -0.76, 0.225, -0.735, 0.245, -0.80, 0.175, -0.825, SKIN);
    ctx.beginPath();
    ctx.arc(0.235, -0.845, 0.095, 0, Math.PI * 2);
    ctx.fillStyle = SKIN;
    ctx.fill();
    ctx.beginPath(); // hair block: back and top of the head
    ctx.arc(0.226, -0.852, 0.099, Math.PI * 0.82, Math.PI * 1.62);
    ctx.closePath();
    ctx.fillStyle = NAVY;
    ctx.fill();
    ctx.beginPath(); // arc eye
    ctx.arc(0.262, -0.852, 0.020, Math.PI * 1.05, Math.PI * 1.95);
    ctx.strokeStyle = NAVY;
    ctx.lineWidth = 0.011;
    ctx.stroke();
    ctx.beginPath(); // L-nose tick
    ctx.moveTo(0.315, -0.838);
    ctx.lineTo(0.328, -0.822);
    ctx.lineTo(0.318, -0.818);
    ctx.stroke();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  // ---------------- main draw ----------------
  function draw(t) {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var minD = Math.min(W, H);
    var D = Math.hypot(W, H);
    var C = { x: W * 0.5, y: H * 0.5 };
    var theta = REST_ANGLE + delta;
    var a = { x: Math.cos(theta), y: Math.sin(theta) };   // down-slope unit
    var b = { x: -Math.sin(theta), y: Math.cos(theta) };  // toward green side
    var halfW = 0.04 * W;
    var slashLen = 2 * Math.min((W / 2) / Math.abs(a.x), (H / 2) / Math.abs(a.y));

    // halves: green ground, then red polygon side, then the white slash band
    ctx.fillStyle = GREEN;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(C.x, C.y);
    ctx.rotate(theta);
    ctx.fillStyle = RED;
    ctx.fillRect(-D, -D, D * 2, D - halfW);
    ctx.fillStyle = WHITE;
    ctx.fillRect(-D, -halfW, D * 2, halfW * 2);
    ctx.restore();

    // halftone dot fields: dense near the outer edges, fading toward the slash;
    // green field weighted to the lower-left, red field to the upper-right.
    var sp = dots.sp || 20;
    var drift = (t * sp * 0.35) % sp;
    var baseR = 0.0055 * minD;
    ctx.fillStyle = WHITE;
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      var y = d.by - drift;
      if (y < -sp) y += H + 2 * sp;
      var relx = d.bx - C.x, rely = y - C.y;
      var u = relx * a.x + rely * a.y;
      var v = relx * b.x + rely * b.y;
      var av = Math.abs(v);
      if (av <= halfW) continue;
      var edge = clamp((av - halfW) / (0.34 * minD), 0, 1);
      if (edge <= 0.02) continue;
      var along;
      if (v > 0) along = 0.35 + 0.65 * smoothstep(-0.25 * D, 0.35 * D, u);
      else along = 0.35 + 0.65 * smoothstep(0.25 * D, -0.35 * D, u);
      var r = baseR * d.rv * (0.2 + 0.8 * edge) * along;
      if (r < 0.4) continue;
      ctx.globalAlpha = 0.25 + 0.75 * edge * along;
      ctx.beginPath();
      ctx.arc(d.bx, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // outline-only name blocks, parallel to the slash, one per half
    var targetW = Math.max(90, 0.35 * W);
    for (var n = 0; n < NAMES.length; n++) {
      var nm = NAMES[n];
      ctx.font = 'bold 100px Arial, sans-serif';
      var measured = ctx.measureText(nm.text).width;
      var size = clamp(100 * targetW / measured, 24, 0.21 * minD);
      var uN = nm.uFrac * slashLen;
      var vN = nm.side * (halfW + size * 0.55 + 0.04 * minD);
      var ax = C.x + uN * a.x + vN * b.x;
      var ay = C.y + uN * a.y + vN * b.y;
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(theta + Math.PI);
      ctx.font = 'bold ' + size + 'px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(2, size * 0.045);
      ctx.strokeStyle = nm.color;
      ctx.strokeText(nm.text, 0, 0);
      ctx.restore();
    }

    // racers riding the slash
    var stretch = 1 + clamp(Math.abs(omega) * 1.1 + (dragging ? Math.abs(delta) * 0.7 : 0), 0, 0.3);
    for (var ri = 0; ri < racers.length; ri++) {
      drawRacer(racers[ri], C, a, b, slashLen, halfW, t, ri === 0 ? stretch : 1 + (stretch - 1) * 0.6);
    }

    // hint
    ctx.font = '12px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('drag', 12, H - 12);
  }

  // ---------------- loop ----------------
  function frame(ts) {
    var t = ts / 1000;
    if (prevTs >= 0) {
      var dt = Math.min(0.05, t - prevTs);
      var target = dragging ? dragTarget : 0;
      omega += ((target - delta) * 110 - omega * 9) * dt;
      delta += omega * dt;
    }
    prevTs = t;
    lastT = t;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();
  draw(0); // synchronous first frame: rest angle, fixed bob phases
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
