<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Dances: Two Voices, One Room</title>
<style>
html, body { margin: 0; padding: 0; background: #2a2a30; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0;
var ROOM = '#2a2a30', CREAM = '#e8e0d0', GOLD = '#d9a441', GREY = '#b8bcc0', SLATE = '#4a5a7a';
var SEED = 1510000;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function r4(x) { return Math.round(x * 10000) / 10000; }

// ---- Turn scheduler: per-loop durations from a seeded stream, never Math.random.
// Loop k: column turn, silence, line turn, silence. Durations vary per loop;
// the total varies too, so loop k is identified by walking cumulative totals.
function loopDurations(k) {
  var r = mulberry32((SEED + k * 1013904223) | 0);
  var col = 6 + r() * 4;      // 6-10 s
  var s1 = 2 + r() * 1.5;     // 2-3.5 s
  var line = 7 + r() * 5;     // 7-12 s
  var s2 = 2 + r() * 1.5;     // 2-3.5 s
  return { col: col, s1: s1, line: line, s2: s2, total: col + s1 + line + s2 };
}
function loopStart(k) {
  var s = 0;
  for (var j = 0; j < k; j++) s += loopDurations(j).total;
  return s;
}
// turnAt(eff): which turn the effective clock sits in. eff is loop-local
// schedule time; every value derives from eff, so the same eff always
// renders the same frame.
function turnAt(eff) {
  var k = 0, s = 0;
  for (;;) {
    var d = loopDurations(k);
    if (eff < s + d.total) {
      var lt = eff - s;
      if (lt < d.col) return { k: k, turn: 'col', local: lt, start: 0, dur: d.col, d: d };
      if (lt < d.col + d.s1) return { k: k, turn: 'sil1', local: lt - d.col, start: d.col, dur: d.s1, d: d };
      if (lt < d.col + d.s1 + d.line) return { k: k, turn: 'line', local: lt - d.col - d.s1, start: d.col + d.s1, dur: d.line, d: d };
      return { k: k, turn: 'sil2', local: lt - d.col - d.s1 - d.line, start: d.col + d.s1 + d.line, dur: d.s2, d: d };
    }
    s += d.total; k++;
  }
}

// ---- Column marks: fixed seeded layout, abstract marks only (bars, dots,
// squares, short ticks). No letterforms, no readable words.
var MARKS = (function () {
  var r = mulberry32(SEED + 77);
  var arr = [];
  for (var i = 0; i < 14; i++) {
    arr.push({
      yf: 0.14 + i * 0.052 + r() * 0.012,
      len: 0.02 + r() * 0.035,
      off: r() * 0.03,
      type: i % 4,
      ph: r() * 6.2832
    });
  }
  return arr;
})();

// ---- Drag state: closed-form rate segments over recorded events.
// Each pointerdown opens a segment; each move closes it and opens a new one
// with the new x; pointerup closes it. While a segment runs, the turn clock
// runs at 0.75 only when the drag side matches the turn active at the
// segment's start; otherwise it runs at 1. After release the clock runs at
// 1 from the shifted anchor, so the loop's own rhythm resumes.
var drags = [];
var curSeg = null;
function pieceNow() {
  if (forced !== null) return forced;
  return liveT;
}
function openSeg(x) {
  curSeg = { t0: pieceNow(), t1: null, x: x };
  drags.push(curSeg);
}
function closeSeg() {
  if (curSeg) { curSeg.t1 = pieceNow(); curSeg = null; }
}
function effTime(t) {
  var eff = 0, prev = 0;
  for (var i = 0; i < drags.length; i++) {
    var d = drags[i];
    if (d.t0 >= t) break;
    if (d.t0 > prev) { eff += (d.t0 - prev); prev = d.t0; }
    var end = (d.t1 === null || d.t1 > t) ? t : d.t1;
    if (end <= prev) continue;
    var turn = turnAt(eff);
    var side = (d.x < W * 0.35) ? 'col' : 'line';
    var rate = 1;
    if ((turn.turn === 'col' && side === 'col') || (turn.turn === 'line' && side === 'line')) rate = 0.75;
    eff += (end - prev) * rate;
    prev = end;
    if (end >= t) break;
  }
  if (prev < t) eff += (t - prev);
  return eff;
}

// ---- Viewport / sizing (Visual Viewport API first, window fallback).
function viewportSize() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  if (vv && vv.width) return { w: vv.width, h: vv.height };
  return { w: window.innerWidth, h: window.innerHeight };
}
function isPhone() {
  try {
    var m = Math.min(window.screen.width, window.screen.height);
    if (m < 700) return true;
  } catch (e) {}
  var v = viewportSize();
  return v.h > v.w * 1.15;
}
function resize() {
  var v = viewportSize();
  W = v.w; H = v.h;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  draw();
}
function onDown(e) {
  var x = (typeof e.clientX === 'number') ? e.clientX : (e.offsetX || 0);
  closeSeg();
  openSeg(x);
}
function onMove(e) {
  if (!curSeg) return;
  var x = (typeof e.clientX === 'number') ? e.clientX : (e.offsetX || 0);
  closeSeg();
  openSeg(x);
}
function onUp() { closeSeg(); }
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  window.addEventListener('resize', resize);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
}

// ---- Drawing.
function drawColumn(st) {
  var U = Math.min(W, H);
  var x0 = W * 0.10, xw = W * 0.11;
  var active = (st.turn === 'col');
  var sway = active ? Math.sin(6.2832 * st.local / 6 + 0.5) * U * 0.004 : 0;
  for (var i = 0; i < MARKS.length; i++) {
    var m = MARKS[i];
    var y = H * m.yf + sway * Math.sin(m.ph + st.local * 0.9);
    var mx = x0 + m.off * W;
    var mw = Math.max(3, m.len * W);
    if (active) {
      ctx.globalAlpha = 1;
      ctx.fillStyle = CREAM;
    } else {
      ctx.globalAlpha = r4(0.45);
      ctx.fillStyle = GREY;
    }
    if (m.type === 0) {
      ctx.fillRect(mx, y, mw, Math.max(2, U * 0.006));
    } else if (m.type === 1) {
      var s = Math.max(3, U * 0.009);
      ctx.fillRect(mx, y, s, s);
    } else if (m.type === 2) {
      ctx.fillRect(mx, y, Math.max(2, U * 0.006), Math.max(4, U * 0.016));
    } else {
      ctx.fillRect(mx, y, mw * 0.6, Math.max(2, U * 0.005));
      ctx.fillRect(mx + mw * 0.6, y - Math.max(2, U * 0.005), Math.max(2, U * 0.005), Math.max(4, U * 0.012));
    }
  }
  ctx.globalAlpha = 1;
}

function drawLine(st) {
  var U = Math.min(W, H);
  var x0 = W * 0.36, x1 = W * 0.94, midY = H * 0.5;
  var active = (st.turn === 'line');
  if (!active) {
    ctx.globalAlpha = r4(0.45);
    ctx.strokeStyle = GREY;
    ctx.lineWidth = Math.max(1, U * 0.003);
    ctx.beginPath();
    ctx.moveTo(x0, midY);
    ctx.lineTo(x1, midY);
    ctx.stroke();
    ctx.globalAlpha = 1;
    return;
  }
  var lt = st.local;
  var amp = U * 0.05 * (0.7 + 0.3 * Math.sin(6.2832 * lt / 7));
  var lam = (x1 - x0) / 2.5;
  var ph = 6.2832 * lt / 9;
  ctx.globalAlpha = r4(0.25);
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = Math.max(1, U * 0.003);
  ctx.beginPath();
  for (var x = x0; x <= x1; x += 8) {
    var y = midY + amp * 0.6 * Math.sin(6.2832 * (x - x0) / lam + ph + 1.1);
    if (x === x0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = Math.max(2, U * 0.008);
  ctx.beginPath();
  for (var xx = x0; xx <= x1; xx += 8) {
    var yy = midY + amp * Math.sin(6.2832 * (xx - x0) / lam + ph);
    if (xx === x0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
  }
  ctx.stroke();
}

function draw() {
  var t = pieceNow();
  var eff = effTime(t);
  var st = turnAt(eff);
  var U = Math.min(W, H);
  ctx.globalAlpha = 1;
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, W, H);
  var inset = Math.max(6, Math.round(U * 0.02));
  ctx.strokeStyle = SLATE;
  ctx.lineWidth = Math.max(2, Math.round(U * 0.004));
  ctx.strokeRect(inset, inset, W - 2 * inset, H - 2 * inset);
  drawColumn(st);
  drawLine(st);
  ctx.globalAlpha = 1;
}

// ---- Clock: rAF timestamp anchors the clock; frame one is draw(0).
var t0 = null, liveT = 0, forced = null;
function loop(ts) {
  if (t0 === null) t0 = ts;
  liveT = (ts - t0) / 1000;
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
resize();
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

// ---- Probe API (used by the QA harness; harmless in the browser).
if (typeof window !== 'undefined') {
  window.__piece = {
    setForced: function (t) { forced = t; },
    clearForced: function () { forced = null; },
    stateAt: function (t) {
      var e = effTime(t);
      var s = turnAt(e);
      return { eff: e, turn: s.turn, loop: s.k, local: s.local, dur: s.dur };
    },
    loopInfo: function (k) { return loopDurations(k); },
    loopStart: function (k) { return loopStart(k); },
    drawAt: function (t) { forced = t; draw(); },
    drags: function () { return drags; }
  };
}
})();
</script>
</body>
</html>
