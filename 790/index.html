<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Banner</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #E4DED2; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // No.790 "The Banner" - EXPANSION #96 daniel-buren, PP7.
  // A giant double-sided striped banner hangs from the top edge and
  // divides the frame in two, after Buren's Peinture-Sculpture (1971),
  // the ~20 m banner removed from the Guggenheim rotunda before opening.
  // One face: white/red stripes. The far face: white/blue. The frame's
  // two background halves differ only in tone, so the banner is the
  // event. Watch-only: a seamless 36 s sway loop turns the banner; at
  // the edge-on moment (quarter period) the faces trade. Everything is
  // a closed-form function of the loop phase: no state, no clock reads
  // for the drawing itself, no randomness.

  var WHITE = "#F4F1EA";
  var RED = [200, 16, 46];    // #C8102E
  var BLUE = [39, 64, 139];   // #27408B
  var BG_LEFT = "#E4DED2";    // warmer / lighter half
  var BG_RIGHT = "#D6D0C2";   // cooler / darker half

  var PERIOD = 36;            // sway loop, seconds
  var PAIRS = 34;             // 8.7cm module: stripe pairs per frame height
  var HANG = 0.85;            // banner bottom, fraction of H (never the floor)
  var TOP_HALF = 0.240;       // banner top half-width, fraction of W
  var BOT_HALF = 0.205;       // banner bottom half-width (slight perspective)
  var SLIVER = 0.045;         // min width scale at edge-on: a sliver, not zero
  var FACE_BAND = 0.28;       // cos range over which the face crossfade runs
  var SWAY_OFF = 0.045;       // pendulum shear at the hem, fraction of W
  var RIP1 = 0.0040, RIP2 = 0.0025; // cloth ripple amplitudes, fraction of W

  var T_OFF = 0;              // QA hook: initial phase offset, seconds (0 live)

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1, phone = false;
  var lastT = T_OFF;

  function isPhone() {
    try {
      var s = window.screen;
      if (s && Math.min(s.width, s.height) < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function measure() {
    var vv = window.visualViewport;
    W = vv ? vv.width : (window.innerWidth || 0);
    H = vv ? vv.height : (window.innerHeight || 0);
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    phone = isPhone();
  }

  function smooth(x) { return x * x * (3 - 2 * x); }
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }

  function mix(a, b, f) {
    var r = Math.round(a[0] + (b[0] - a[0]) * f);
    var g = Math.round(a[1] + (b[1] - a[1]) * f);
    var bl = Math.round(a[2] + (b[2] - a[2]) * f);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  // Face trade: turn = cos(phase) is the banner's virtual facing.
  // turn > 0: the red face fronts us, foreshortened by |turn|.
  // turn < 0: the banner has turned through edge-on; the blue face
  // fronts us. The crossfade runs over |turn| < FACE_BAND, so exactly
  // at edge-on the sliver shows a half-and-half mix, and the trade is
  // complete once the far face has opened past the band.
  function faceMix(turn) {
    var u = clamp(0.5 - 0.5 * turn / FACE_BAND, 0, 1);
    return smooth(u); // 0 = pure red face, 1 = pure blue face
  }

  function draw(t) {
    lastT = t;
    if (!W || !H) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    // Background: two halves differing only in tone.
    ctx.fillStyle = BG_LEFT;
    ctx.fillRect(0, 0, W / 2, H);
    ctx.fillStyle = BG_RIGHT;
    ctx.fillRect(W / 2, 0, W - W / 2, H);

    var p = 2 * Math.PI * (t / PERIOD);
    var turn = Math.cos(p);            // facing / foreshortening
    var sway = Math.sin(p);            // pendulum swing, +-12 deg read
    var bw = faceMix(turn);
    var wScale = Math.max(Math.abs(turn), SLIVER);
    var colorFace = mix(RED, BLUE, bw);

    var cx = W / 2;
    var yBot = HANG * H;
    var pairH = H / PAIRS;
    var stripeH = pairH / 2;

    function halfAt(y) {
      var f = y / yBot;
      return (TOP_HALF + (BOT_HALF - TOP_HALF) * f) * W * wScale;
    }
    function driftAt(y) {
      var f = y / yBot;
      // Pendulum shear: pinned at the top rail, hem swings widest.
      var shear = sway * SWAY_OFF * W * f;
      // Cloth ripple: two sine waves travelling along the height.
      var rip = W * (RIP1 * Math.sin(2 * Math.PI * f * 2.0 + p * 2) +
                     RIP2 * Math.sin(2 * Math.PI * f * 3.7 - p * 3));
      return shear + rip;
    }

    var n = Math.ceil(yBot / stripeH);
    for (var i = 0; i < n; i++) {
      var y0 = i * stripeH;
      var y1 = Math.min(y0 + stripeH, yBot);
      var h0 = halfAt(y0), h1 = halfAt(y1);
      var d0 = driftAt(y0), d1 = driftAt(y1);
      ctx.fillStyle = (i % 2 === 0) ? WHITE : colorFace;
      ctx.beginPath();
      ctx.moveTo(cx - h0 + d0, y0);
      ctx.lineTo(cx + h0 + d0, y0);
      ctx.lineTo(cx + h1 + d1, y1 + 0.6); // hair overlap kills seams
      ctx.lineTo(cx - h1 + d1, y1 + 0.6);
      ctx.closePath();
      ctx.fill();
    }
  }

  function resize() {
    measure();
    draw(lastT);
  }

  measure();
  draw(T_OFF);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", resize);
  }
  window.addEventListener("resize", resize);

  if (typeof requestAnimationFrame === "function") {
    var start = null;
    var frame = function (now) {
      if (start === null) start = now;
      draw(T_OFF + (now - start) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
