<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumiere</title>
<style>
html, body { margin: 0; padding: 0; background: #0C0D10; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0C0D10';
var SPHERE = '#9ADFE8';
var CH_R = [232, 84, 63];    /* #E8543F */
var CH_G = [63, 163, 77];    /* #3FA34D */
var CH_B = [63, 127, 232];   /* #3F7FE8 */
var CH_RGB = [CH_R, CH_G, CH_B];
var SEED = 1631007;
var PHASE = 8;               /* frame one is 8 s into the fountain */
var POOL = 2400;             /* low thousands of distinct grains, never fog */
var BASE = [0.34, 0.33, 0.33]; /* documented balance: near-equal, faintly warm */
var TAU_RELAX = 150;         /* ratio relaxes toward base, time constant 150 s */
var FEED_K = 0.00018;        /* feed weight per px of drag travel */
var FEED_CAP = 0.5;          /* per-channel feed cap, keeps the shift bounded */
var BREATH_S = 6;            /* sphere breath, one cycle per 6 s */
var ROT_S = 60;              /* sphere rotation, one turn per 60 s */
var DT = 1 / 60;             /* fixed simulation step */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var rng = mulberry32(SEED);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Portrait field. Full-bleed on phones; on desktop a centred portrait
   rect, page ground the piece's own dark ground. */
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var w = Math.min(VW * 0.62, VH * 0.70);
  var h = w * 1.28;
  if (h > VH * 0.92) { h = VH * 0.92; w = h / 1.28; }
  return { x: (VW - w) / 2, y: (VH - h) / 2, w: w, h: h };
}
function sphereGeom(rect, t) {
  var R = rect.w * 0.22 * (1 + 0.05 * Math.sin(TAU * t / BREATH_S));
  return { cx: rect.x + rect.w / 2, cy: rect.y + rect.h * 0.76, R: R };
}
/* ---- faint circuit texture: seeded orthogonal traces, fixed table ---- */
var traces = [];
function buildTraces() {
  var tr = mulberry32(SEED + 77);
  var i, j;
  traces = [];
  for (i = 0; i < 30; i++) {
    var pts = [];
    var x = 0.04 + tr() * 0.92, y = 0.04 + tr() * 0.92;
    pts.push([x, y]);
    var segs = 2 + Math.floor(tr() * 3);
    for (j = 0; j < segs; j++) {
      if (tr() < 0.5) x = clamp(x + (tr() - 0.5) * 0.30, 0.02, 0.98);
      else y = clamp(y + (tr() - 0.5) * 0.30, 0.02, 0.98);
      pts.push([x, y]);
    }
    traces.push(pts);
  }
}
/* ---- live RGB ratio: closed-form sum over recorded drag samples ----
   Direction-to-channel map: a drag sample (dx, dy) is decomposed into
   three orthogonal parts: horizontal h = |dx| - min(|dx|,|dy|) feeds R,
   vertical v = |dy| - min(|dx|,|dy|) feeds G, diagonal
   d = min(|dx|,|dy|) feeds B. Each sample decays exponentially toward
   the base with time constant TAU_RELAX; the ratio never snaps. */
var samples = [];
function ratioAt(t) {
  var fr = 0, fg = 0, fb = 0, i, s;
  for (i = 0; i < samples.length; i++) {
    s = samples[i];
    var w = Math.exp(-(t - s.t) / TAU_RELAX);
    fr += s.r * w; fg += s.g * w; fb += s.b * w;
  }
  fr = clamp(fr, 0, FEED_CAP); fg = clamp(fg, 0, FEED_CAP); fb = clamp(fb, 0, FEED_CAP);
  var a = BASE[0] + fr, b = BASE[1] + fg, c = BASE[2] + fb;
  var tot = a + b + c;
  return [a / tot, b / tot, c / tot];
}
var curRatio = [BASE[0], BASE[1], BASE[2]];
function feedDrag(dx, dy) {
  var ax = Math.abs(dx), ay = Math.abs(dy);
  var d = Math.min(ax, ay);
  var h = ax - d, v = ay - d;
  samples.push({ t: lastT, r: h * FEED_K, g: v * FEED_K, b: d * FEED_K });
  if (samples.length > 400) samples.splice(0, samples.length - 400);
}
/* ---- particle pool: fountain emission, gravity, drag ---- */
var particles = [];
var simTime = 0;
function spawn(p, t) {
  var rect = compRect();
  var sg = sphereGeom(rect, t);
  p.x = sg.cx + (rng() - 0.5) * sg.R * 0.6;
  p.y = sg.cy - sg.R * 0.9;
  p.vx = (rng() - 0.5) * 0.22 * rect.h;
  p.vy = -(0.42 + rng() * 0.28) * rect.h;
  p.age = 0;
  p.life = 2.2 + rng() * 1.8;
  p.sz = 1.8 + rng() * 1.6;
  var u = rng();
  p.ch = u < curRatio[0] ? 0 : (u < curRatio[0] + curRatio[1] ? 1 : 2);
}
function buildPool() {
  var i;
  particles = [];
  for (i = 0; i < POOL; i++) {
    var p = {};
    spawn(p, PHASE);
    p.age = rng() * p.life; /* stagger ages so the pre-roll fills evenly */
    particles.push(p);
  }
  simTime = 0;
}
function stepSim(t) {
  var rect = compRect();
  var sg = sphereGeom(rect, t);
  var i, p;
  for (i = 0; i < particles.length; i++) {
    p = particles[i];
    p.age += DT;
    p.vy += 0.38 * rect.h * DT;
    p.vx *= (1 - 0.35 * DT);
    p.vy *= (1 - 0.12 * DT);
    if (p.vy > 0) p.vx += ((p.x - sg.cx) / rect.w) * 0.06 * rect.h * DT;
    p.x += p.vx * DT;
    p.y += p.vy * DT;
    if (p.age > p.life || p.y > sg.cy + sg.R * 1.1 ||
        p.y > rect.y + rect.h + 20 || Math.abs(p.x - sg.cx) > rect.w * 0.75) {
      spawn(p, t);
    }
  }
}
function advanceTo(t) {
  var n = Math.round((t - simTime) / DT);
  var k;
  for (k = 0; k < n; k++) {
    simTime += DT;
    stepSim(simTime);
  }
  simTime = t;
}
/* ---- drawing ---- */
function drawCircuit(rect) {
  ctx.strokeStyle = rgba([154, 223, 232], 0.05);
  ctx.lineWidth = 1;
  var i, j, pts;
  for (i = 0; i < traces.length; i++) {
    pts = traces[i];
    ctx.beginPath();
    for (j = 0; j < pts.length; j++) {
      var px = rect.x + pts[j][0] * rect.w, py = rect.y + pts[j][1] * rect.h;
      if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.fillStyle = rgba([154, 223, 232], 0.07);
    var ex = rect.x + pts[pts.length - 1][0] * rect.w;
    var ey = rect.y + pts[pts.length - 1][1] * rect.h;
    ctx.fillRect(ex - 2, ey - 2, 4, 4);
  }
}
function drawSphere(rect, t) {
  var sg = sphereGeom(rect, t);
  var rot = TAU * t / ROT_S;
  var tilt = 0.35;
  var ct = Math.cos(tilt), st = Math.sin(tilt);
  var cr = Math.cos(rot), sr = Math.sin(rot);
  function proj(lat, lon) {
    var cl = Math.cos(lat), sl = Math.sin(lat);
    var x = cl * Math.cos(lon), y = sl, z = cl * Math.sin(lon);
    var xr = x * cr + z * sr;
    var zr = -x * sr + z * cr;
    var yr = y * ct - zr * st;
    return [sg.cx + sg.R * xr, sg.cy - sg.R * yr];
  }
  ctx.fillStyle = rgba([154, 223, 232], 0.05);
  ctx.beginPath();
  ctx.arc(sg.cx, sg.cy, sg.R, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba([154, 223, 232], 0.85);
  ctx.lineWidth = Math.max(1, Math.min(VW, VH) * 0.0016);
  var m, a, pt;
  for (m = 0; m < 12; m++) {
    var lon = m * Math.PI / 6;
    ctx.beginPath();
    for (a = -90; a <= 90; a += 6) {
      pt = proj(a * Math.PI / 180, lon);
      if (a === -90) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
    }
    ctx.stroke();
  }
  var lats = [-60, -30, 0, 30, 60];
  var li;
  for (li = 0; li < lats.length; li++) {
    var lat = lats[li] * Math.PI / 180;
    ctx.beginPath();
    for (a = 0; a <= 360; a += 6) {
      pt = proj(lat, a * Math.PI / 180);
      if (a === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
    }
    ctx.stroke();
  }
}
function drawParticles(rect) {
  var scale = Math.min(VW, VH) / 720;
  var i, p;
  for (i = 0; i < particles.length; i++) {
    p = particles[i];
    var a = Math.min(1, p.age / 0.15) * clamp(1 - (p.age / p.life - 0.7) / 0.3, 0.25, 1);
    var s = p.sz * scale;
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = 'rgb(' + CH_RGB[p.ch][0] + ',' + CH_RGB[p.ch][1] + ',' + CH_RGB[p.ch][2] + ')';
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}
function drawText(rect) {
  var titlePx = isPhone ? 19 : 21;
  var smallPx = isPhone ? 12 : 13;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var titleW = ctx.measureText('Lumiere').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 06 · 30').width;
  var plateW = Math.max(titleW, dateW) + 24;
  var plateH = titlePx + smallPx + 20;
  /* Solid ground plate, so the copy reads over the fountain at every size. */
  ctx.fillStyle = GROUND;
  ctx.fillRect(cxm - plateW / 2, rect.y + 8, plateW, plateH);
  ctx.fillStyle = SPHERE;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Lumiere', cxm, rect.y + 14);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba([154, 223, 232], 0.75);
  ctx.fillText('2006 · 06 · 30', cxm, rect.y + 14 + titlePx + 6);
  ctx.fillStyle = rgba([154, 223, 232], 0.85);
  ctx.fillText('Drag through the fountain to shift its hue.', cxm, rect.y + rect.h - smallPx - 12);
}
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  curRatio = ratioAt(t);
  if (!reduced) advanceTo(t);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawCircuit(rect);
  drawSphere(rect, t);
  drawParticles(rect);
  drawText(rect);
}
/* ---- pointer: drag feeds the ratio, never reloads ---- */
var dragging = false, lastPX = 0, lastPY = 0;
function onDown(e) {
  dragging = true;
  lastPX = e.clientX; lastPY = e.clientY;
}
function onMove(e) {
  if (!dragging) return;
  var dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
  if (dx !== 0 || dy !== 0) feedDrag(dx, dy);
}
function onUp() { dragging = false; }
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
/* ---- frame one: fixed phase, fountain already developed ---- */
size();
buildTraces();
buildPool();
if (reduced) {
  advanceTo(PHASE);
  draw(PHASE);
} else {
  draw(PHASE);
  var animT0 = PHASE, startTs = null;
  function loop(ts) {
    if (startTs === null) startTs = ts;
    var t = animT0 + (ts - startTs) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
