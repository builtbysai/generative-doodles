<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Giant Tesla Coil</title>
<style>
html, body { margin: 0; padding: 0; background: #EFF3F3; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#EFF3F3';
var MACHINE = '#F7FAFA';
var MACHINE_SHADE = '#D7E8EA';
var MACHINE_LINE = '#7FB3BC';
var BORE = '#0E3A40';
var CYAN = '#2FA8BC';
var CYAN_BRIGHT = '#59C2D1';
var CYAN_DARK = '#1E7A8C';
var INK = '#16323A';
var PLATE = '#FFFFFF';
var PLATE_LINE = 'rgba(47,168,188,0.65)';
var AMBER = '#E8A33D';
var RED = '#D64541';
var GREEN = '#3FA66A';
var FRAME_T = 60; /* fixed phase: 60 s into the cycle, reproducible first frame */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1820);
var phaseT = FRAME_T;
/* ---- three streams, each with its own pulse rate and column period ----
   amber pitch 0.8 Hz, column fills over 9 s;
   red rhythm 0.5 Hz, column fills over 13 s;
   green density 1.25 Hz, column fills over 7 s. ---- */
var STREAMS = [
  { name: 'PITCH',   color: AMBER, pulseHz: 0.8,  speed: 0.16, period: 9,  phase: 0.0, row: -1 },
  { name: 'RHYTHM',  color: RED,   pulseHz: 0.5,  speed: 0.11, period: 13, phase: 2.1, row: 0 },
  { name: 'DENSITY', color: GREEN, pulseHz: 1.25, speed: 0.22, period: 7,  phase: 4.2, row: 1 }
];
/* fixed particle seeds per stream; positions are a pure function of phaseT */
var PARTICLES = [];
(function () {
  var i, j;
  for (i = 0; i < STREAMS.length; i++) {
    var arr = [];
    for (j = 0; j < 26; j++) arr.push({ u: rng(), wob: (rng() - 0.5) * 0.018, r: 0.0045 + rng() * 0.004 });
    PARTICLES.push(arr);
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function S() { return Math.min(VW, VH); }
/* layout: machine center-left, columns at the right, streams run left to right */
function layout() {
  var s = S();
  var cx = VW * 0.36;
  var cy = VH * 0.52;
  var mw = s * 0.40;   /* machine width */
  var mh = s * 0.66;   /* machine height */
  var colW = Math.max(s * 0.055, 18);
  var colH = s * 0.52;
  var colGap = Math.max(s * 0.028, 10);
  var colTop = cy - colH / 2;
  var cols = [];
  var i, x0 = VW - 12 - (colW * 3 + colGap * 2);
  for (i = 0; i < 3; i++) cols.push({ x: x0 + i * (colW + colGap), w: colW, top: colTop, h: colH });
  return { s: s, cx: cx, cy: cy, mw: mw, mh: mh, cols: cols,
           outX: cx + mw / 2, inX: cols[0].x - s * 0.02 };
}
function streamPoint(L, st, u) {
  /* quadratic path from the machine edge to the top of the stream's column */
  var sx = L.outX, sy = L.cy + st.row * L.s * 0.17;
  var ex = L.cols[st.row === -1 ? 0 : (st.row === 0 ? 1 : 2)].x + L.cols[0].w / 2;
  var ey = L.cols[0].top - L.s * 0.01;
  var mx = (sx + ex) / 2, my = sy - L.s * 0.10;
  var a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
  return { x: a * sx + b * mx + c * ex, y: a * sy + b * my + c * ey };
}
function pulse(st, t) {
  /* each stream pulses at its own rate: 0.35 to 1.0 brightness */
  return 0.675 + 0.325 * Math.sin(TAU * st.pulseHz * t);
}
function fillLevel(st, t) {
  /* columns fill and drain on their own periods */
  return 0.5 + 0.42 * Math.sin(TAU * t / st.period + st.phase);
}
function drawMachine(L, t) {
  var s = L.s, cx = L.cx, cy = L.cy, mw = L.mw, mh = L.mh;
  var top = cy - mh / 2, bot = cy + mh / 2;
  /* plinth under the machine */
  ctx.fillStyle = rgba(CYAN_DARK, 0.18);
  ctx.beginPath();
  ctx.ellipse(cx, bot + s * 0.02, mw * 0.62, s * 0.025, 0, 0, TAU);
  ctx.fill();
  /* body: vertical cylinder, white with cyan shading at the edges */
  var body = ctx.createLinearGradient(cx - mw / 2, 0, cx + mw / 2, 0);
  body.addColorStop(0, MACHINE_SHADE);
  body.addColorStop(0.22, MACHINE);
  body.addColorStop(0.78, MACHINE);
  body.addColorStop(1, MACHINE_SHADE);
  ctx.fillStyle = body;
  ctx.strokeStyle = MACHINE_LINE;
  ctx.lineWidth = Math.max(s * 0.004, 1);
  ctx.beginPath();
  ctx.moveTo(cx - mw / 2, top + s * 0.02);
  ctx.lineTo(cx - mw / 2, bot - s * 0.02);
  ctx.lineTo(cx + mw / 2, bot - s * 0.02);
  ctx.lineTo(cx + mw / 2, top + s * 0.02);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  /* top rim */
  ctx.fillStyle = MACHINE;
  ctx.beginPath();
  ctx.ellipse(cx, top + s * 0.02, mw / 2, s * 0.045, 0, 0, TAU);
  ctx.fill();
  ctx.stroke();
  /* bore: dark opening in the upper half of the tube */
  var boreCy = cy - mh * 0.16;
  var boreRx = mw * 0.34, boreRy = s * 0.115;
  ctx.fillStyle = BORE;
  ctx.beginPath();
  ctx.ellipse(cx, boreCy, boreRx, boreRy, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = CYAN_BRIGHT;
  ctx.lineWidth = Math.max(s * 0.005, 1.2);
  ctx.beginPath();
  ctx.ellipse(cx, boreCy, boreRx, boreRy, 0, 0, TAU);
  ctx.stroke();
  /* magnetic field lines inside the bore: rotating spokes and breathing rings */
  var rot = 0.12 * t;               /* rotating radio frequency parameter */
  var breathe = 1 + 0.06 * Math.sin(TAU * 0.25 * t);
  var i, a, x1, y1, x2, y2;
  ctx.strokeStyle = rgba(CYAN_BRIGHT, 0.75);
  ctx.lineWidth = Math.max(s * 0.003, 0.8);
  for (i = 0; i < 12; i++) {
    a = rot + i * TAU / 12;
    x1 = cx + Math.cos(a) * boreRx * 0.12;
    y1 = boreCy + Math.sin(a) * boreRy * 0.12;
    x2 = cx + Math.cos(a) * boreRx * 0.94;
    y2 = boreCy + Math.sin(a) * boreRy * 0.94;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  for (i = 1; i <= 3; i++) {
    var rr = i / 4 * breathe;
    ctx.strokeStyle = rgba(CYAN_BRIGHT, 0.55 - i * 0.10);
    ctx.beginPath();
    ctx.ellipse(cx, boreCy, boreRx * rr, boreRy * rr, 0, 0, TAU);
    ctx.stroke();
  }
  /* glowing core at the bore center */
  var core = ctx.createRadialGradient(cx, boreCy, 0, cx, boreCy, boreRx * 0.30);
  core.addColorStop(0, rgba(CYAN_BRIGHT, 0.85));
  core.addColorStop(1, rgba(CYAN_BRIGHT, 0));
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.ellipse(cx, boreCy, boreRx * 0.30, boreRy * 0.30, 0, 0, TAU);
  ctx.fill();
  /* casing bands and rivets on the body below the bore */
  var bandY;
  ctx.strokeStyle = rgba(MACHINE_LINE, 0.8);
  ctx.lineWidth = Math.max(s * 0.003, 0.8);
  for (i = 0; i < 3; i++) {
    bandY = cy + mh * 0.08 + i * mh * 0.13;
    ctx.beginPath();
    ctx.moveTo(cx - mw / 2 + s * 0.008, bandY);
    ctx.lineTo(cx + mw / 2 - s * 0.008, bandY);
    ctx.stroke();
  }
  ctx.fillStyle = rgba(CYAN_DARK, 0.55);
  var j;
  for (j = 0; j < 4; j++) {
    ctx.beginPath();
    ctx.arc(cx - mw * 0.30 + j * mw * 0.20, bot - s * 0.035, Math.max(s * 0.005, 1.2), 0, TAU);
    ctx.fill();
  }
  /* bottom rim */
  ctx.fillStyle = MACHINE;
  ctx.beginPath();
  ctx.ellipse(cx, bot - s * 0.02, mw / 2, s * 0.045, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = MACHINE_LINE;
  ctx.stroke();
}
function drawStreams(L, t) {
  var s = L.s, i, j, p, st;
  for (i = 0; i < STREAMS.length; i++) {
    st = STREAMS[i];
    var pu = pulse(st, t);
    /* faint guide path from machine to column */
    ctx.strokeStyle = rgba(st.color, 0.25);
    ctx.lineWidth = Math.max(s * 0.006, 1);
    ctx.beginPath();
    var a0 = streamPoint(L, st, 0), a1 = streamPoint(L, st, 0.5), a2 = streamPoint(L, st, 1);
    ctx.moveTo(a0.x, a0.y);
    ctx.quadraticCurveTo(2 * a1.x - (a0.x + a2.x) / 2, 2 * a1.y - (a0.y + a2.y) / 2, a2.x, a2.y);
    ctx.stroke();
    /* particles flowing left to right along the path */
    for (j = 0; j < PARTICLES[i].length; j++) {
      var pt = PARTICLES[i][j];
      var u = (pt.u + t * st.speed) % 1;
      p = streamPoint(L, st, u);
      var r = pt.r * s * (0.7 + 0.6 * pu);
      ctx.fillStyle = rgba(st.color, 0.55 + 0.45 * pu);
      ctx.beginPath();
      ctx.arc(p.x, p.y + pt.wob * s, Math.max(r, 0.8), 0, TAU);
      ctx.fill();
    }
    /* stream label at the machine edge, on a ground-colored backing so
       passing particles never sit on top of the letters */
    var lx = L.outX + s * 0.012;
    var ly = L.cy + st.row * s * 0.17 - s * 0.038;
    ctx.font = 'bold ' + Math.max(Math.round(s * 0.016), 9) + 'px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    var lw = ctx.measureText(st.name).width;
    ctx.fillStyle = GROUND;
    ctx.fillRect(lx - 2, ly - s * 0.014, lw + 4, s * 0.028);
    ctx.fillStyle = st.color;
    ctx.fillText(st.name, lx, ly);
  }
}
function drawColumns(L, t) {
  var s = L.s, i, st, col;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  for (i = 0; i < 3; i++) {
    st = STREAMS[i];
    col = L.cols[i];
    /* column frame */
    ctx.fillStyle = PLATE;
    ctx.fillRect(col.x, col.top, col.w, col.h);
    ctx.strokeStyle = MACHINE_LINE;
    ctx.lineWidth = Math.max(s * 0.003, 1);
    ctx.strokeRect(col.x + 0.5, col.top + 0.5, col.w - 1, col.h - 1);
    /* ledger ticks */
    ctx.strokeStyle = rgba(CYAN_DARK, 0.30);
    ctx.lineWidth = 1;
    var k;
    for (k = 1; k < 10; k++) {
      var ty = col.top + col.h * k / 10;
      ctx.beginPath();
      ctx.moveTo(col.x + 2, ty);
      ctx.lineTo(col.x + col.w - 2, ty);
      ctx.stroke();
    }
    /* fill level: rises and drains on its own period */
    var lvl = fillLevel(st, t);
    var fillH = col.h * lvl;
    ctx.fillStyle = rgba(st.color, 0.55 + 0.30 * pulse(st, t));
    ctx.fillRect(col.x + 2, col.top + col.h - fillH, col.w - 4, fillH);
    /* level line */
    ctx.strokeStyle = st.color;
    ctx.lineWidth = Math.max(s * 0.004, 1.2);
    ctx.beginPath();
    ctx.moveTo(col.x, col.top + col.h - fillH);
    ctx.lineTo(col.x + col.w, col.top + col.h - fillH);
    ctx.stroke();
    /* sorted blocks inside the fill, a ledger of sorted signals */
    var rows = Math.floor(lvl * 8);
    ctx.fillStyle = rgba('#FFFFFF', 0.35);
    for (k = 0; k < rows; k++) {
      var by = col.top + col.h - s * 0.012 - k * col.h / 8;
      ctx.fillRect(col.x + 3, by - col.h / 8 + s * 0.012, col.w - 6, Math.max(col.h / 8 - s * 0.012, 1));
    }
    /* column header: the name runs vertically inside the column, drawn
       last in dark ink so it reads over both the white ground and the
       colored fill at any fill level */
    ctx.save();
    ctx.translate(col.x + col.w / 2, col.top + col.h / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = INK;
    ctx.font = 'bold ' + Math.max(Math.round(s * 0.016), 9) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(st.name, 0, 0);
    ctx.restore();
  }
}
function draw() {
  size();
  var s = S();
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var L = layout();
  drawMachine(L, t);
  drawStreams(L, t);
  drawColumns(L, t);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Giant Tesla Coil').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Giant Tesla Coil').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 05').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Giant Tesla Coil', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = CYAN_DARK;
  ctx.fillText('2007 · 01 · 05', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = CYAN_DARK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    pulse: function (i) { return pulse(STREAMS[i], phaseT); },
    fill: function (i) { return fillLevel(STREAMS[i], phaseT); }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
