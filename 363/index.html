<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.363 Snowy Owl Stare</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#D9A441; }
  canvas { display:block; touch-action:none; cursor:grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.363 Snowy Owl Stare (jmarie.creates).
// After Julianne Haness's "Snowy Owls": giant snowy-owl
// faces in half-drop repeat on gold-ochre, white feather
// bodies, bold black brow wedges, piercing orange eyes
// staring straight out at the viewer. The blink is the
// only motion: a 700s master loop in which each of the
// 35 owls blinks exactly once, at its own fixed slot,
// one owl every 20 seconds, one at a time. Double-tap
// advances which owl starts the sequence, from a fixed
// offset table. Drag pans the oversized repeat and the
// explored position persists on release. Nothing here
// is runtime random: the grid, the speckle marks, the
// blink order and the offsets are all fixed data below.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#D9A441', WHITE = '#F5F2EA', ORANGE = '#E07B1F', BLACK = '#1A1A1A';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 700;
if (LOOP !== 700) throw new Error('Snowy Owl loop must be 700s');
var TICK = 1 / 60;

// ---- the repeat: 7 columns x 5 rows, half-drop --------
// Each face is about half the frame height (410 of 900).
// Odd rows shift by half a column. The world is authored
// oversized (centres span x -960..1120, y -900..900) so
// the field covers the frame at every clamped pan.
var DX = 320, DY = 450;
var OWLS = [];
for (var r = 0; r < 5; r++) {
  var xoff = (r % 2 === 1) ? DX / 2 : 0;
  for (var c = 0; c < 7; c++) {
    OWLS.push([-960 + xoff + c * DX, -900 + r * DY]);
  }
}
if (OWLS.length !== 35) throw new Error('Snowy Owl Stare needs 35 owls, got ' + OWLS.length);

// ---- blink schedule -------------------------------------
// Slot s starts at s * (LOOP / 35) = s * 20s and the eye
// closes for 0.7s on a sine dip to scaleY 0.05. Owl i
// takes schedule position (i - shift) mod 35, so a shift
// changes who blinks first without ever changing the
// cadence. Double-tap advances the shift through the
// fixed offset table.
var BLINK_LEN = 0.7;
var SLOT = LOOP / OWLS.length;
var SHIFTS = [0, 7, 14, 21, 28];
var shiftIdx = 0;
function openness(owlIdx, tm) {
  var pos = (((owlIdx - SHIFTS[shiftIdx]) % OWLS.length) + OWLS.length) % OWLS.length;
  var local = tm - pos * SLOT;
  if (local < 0 || local >= BLINK_LEN) return 1;
  var u = local / BLINK_LEN;
  return 1 - 0.95 * Math.pow(Math.sin(Math.PI * u), 1.5);
}
// Constant first-frame phase: the middle owl's slot plus
// half a blink, 340.35s into the loop, so frame one is
// developed with exactly one owl mid-blink and every
// other eye wide open. Frame one is drawn synchronously
// at this constant; the rAF loop advances T from the
// same anchor in fixed ticks. Frame one never reads a
// wall clock.
var T = Math.floor(OWLS.length / 2) * SLOT + BLINK_LEN / 2;
(function () {
  var mid = 0;
  for (var i = 0; i < OWLS.length; i++) if (openness(i, T % LOOP) < 0.999) mid++;
  if (mid !== 1) throw new Error('frame one must have exactly one owl mid-blink, got ' + mid);
})();
var lastNow = -1, acc = 0;

// ---- plumage marks --------------------------------------
// Sparse fixed speckle marks on the lower body and crown
// sides: the snowy owl's dark flecking, kept off the face
// so the stare stays clean. [x, y, rx, ry, tilt]
var SPECKLES = [
  [-126, -148, 7, 3.4, -0.5], [122, -138, 6.4, 3.1, 0.5],
  [-140, -62, 6.6, 3.2, -0.9], [141, -48, 6.2, 3.0, 0.9],
  [-138, 34, 6.8, 3.3, -0.7], [136, 52, 6.4, 3.1, 0.7],
  [-118, 108, 6.2, 3.0, -0.4], [112, 122, 6.6, 3.2, 0.4],
  [-84, 158, 6.0, 2.9, -0.2], [78, 166, 6.2, 3.0, 0.2],
  [-44, 184, 5.6, 2.7, 0], [40, 186, 5.6, 2.7, 0]
];

// ---- drawing: one owl ------------------------------------
// Authored bilaterally symmetric about its local vertical
// axis: an egg-shaped white body, bold black brow wedges
// slanting down toward the centre (the stare is direct,
// never cute), orange eye discs with black pupils and a
// small white catchlight, a small black beak, faint
// scallop arcs low on the body.
function drawEye(ex, ey, open) {
  ctx.save();
  ctx.translate(ex, ey);
  ctx.scale(1, Math.max(0.05, open));
  ctx.fillStyle = ORANGE;
  ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = BLACK;
  ctx.beginPath(); ctx.arc(0, 0, 11.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = WHITE;
  ctx.beginPath(); ctx.arc(-4, -5, 3.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawOwl(cx, cy, open) {
  ctx.save();
  ctx.translate(cx, cy);
  // body: rounded egg, 300 wide, 410 tall
  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.moveTo(0, -205);
  ctx.bezierCurveTo(92, -205, 150, -118, 150, -18);
  ctx.bezierCurveTo(150, 82, 104, 205, 0, 205);
  ctx.bezierCurveTo(-104, 205, -150, 82, -150, -18);
  ctx.bezierCurveTo(-150, -118, -92, -205, 0, -205);
  ctx.closePath();
  ctx.fill();
  // plumage speckles
  ctx.fillStyle = BLACK;
  for (var i = 0; i < SPECKLES.length; i++) {
    var sp = SPECKLES[i];
    ctx.save();
    ctx.translate(sp[0], sp[1]);
    ctx.rotate(sp[4]);
    ctx.beginPath(); ctx.ellipse(0, 0, sp[2], sp[3], 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // faint feather scallops low on the body
  ctx.strokeStyle = BLACK;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  var scallopRows = [[118, [-52, 0, 52]], [152, [-26, 26]]];
  for (var ri = 0; ri < scallopRows.length; ri++) {
    for (var ci = 0; ci < scallopRows[ri][1].length; ci++) {
      ctx.beginPath();
      ctx.arc(scallopRows[ri][1][ci], scallopRows[ri][0], 15, Math.PI * 0.18, Math.PI * 0.82);
      ctx.stroke();
    }
  }
  // brow wedges: thick black bars slanting down toward
  // the centre, inner end low, outer end high
  ctx.fillStyle = BLACK;
  for (var s = -1; s <= 1; s += 2) {
    ctx.beginPath();
    ctx.moveTo(s * 99, -72);
    ctx.lineTo(s * 20, -48);
    ctx.lineTo(s * 25, -29);
    ctx.lineTo(s * 95, -50);
    ctx.closePath();
    ctx.fill();
  }
  // eyes and beak
  drawEye(-58, -22, open);
  drawEye(58, -22, open);
  ctx.fillStyle = BLACK;
  ctx.beginPath();
  ctx.moveTo(0, 10);
  ctx.lineTo(9.5, 22);
  ctx.lineTo(0, 38);
  ctx.lineTo(-9.5, 22);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ---- view: drag pan state ---------------------------------
// Drag pans grab-style; the repeat is authored across an
// oversized world so it always covers the frame, the pan
// clamps to the authored margin, and the explored
// position persists on release. No snap home, no reload.
var panX = 0, panY = 0;
function clampPan() {
  var mx = 1120 - DW / 2; // world right reach minus half frame
  var my = 1105 - DH / 2; // lowest face edge minus half frame
  if (panX > mx) panX = mx; if (panX < -mx) panX = -mx;
  if (panY > my) panY = my; if (panY < -my) panY = -my;
}

function draw() {
  var tm = T % LOOP;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  ctx.save();
  ctx.translate(DW / 2, DH / 2);
  ctx.translate(-panX, -panY);
  for (var i = 0; i < OWLS.length; i++) {
    drawOwl(OWLS[i][0], OWLS[i][1], openness(i, tm));
  }
  ctx.restore();
}

// ---- sizing: full-bleed field, cover-fit -------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- pointer: drag pans, double-tap advances the blink order
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
var grab = null, downAt = 0, lastTapAt = -1000, lastTapPos = null;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  grab = { x: p[0], y: p[1], panX: panX, panY: panY, moved: false };
  downAt = T;
});
canvas.addEventListener('pointermove', function (e) {
  if (!grab) return;
  var p = toDesign(e);
  var dx = p[0] - grab.x, dy = p[1] - grab.y;
  if (Math.abs(dx) + Math.abs(dy) > 2) grab.moved = true;
  panX = grab.panX - dx;
  panY = grab.panY - dy;
  clampPan();
});
function endPointer(e) {
  if (!grab) return;
  var wasTap = !grab.moved && (T - downAt) < 0.3;
  grab = null;
  if (!wasTap || !e) return;
  var p = toDesign(e);
  var dt = T - lastTapAt;
  if (dt < 0.35 && lastTapPos && Math.abs(p[0] - lastTapPos[0]) < 30 && Math.abs(p[1] - lastTapPos[1]) < 30) {
    shiftIdx = (shiftIdx + 1) % SHIFTS.length;
    lastTapAt = -1000;
    lastTapPos = null;
  } else {
    lastTapAt = T;
    lastTapPos = p;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { grab = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
