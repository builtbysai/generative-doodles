<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No.847 The Lit Bed</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; position: absolute; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // No.847 The Lit Bed, IA1 / PP1247, study #261 iso-attrill.
  // A rumpled white bed floats in total blackness under one
  // hard light. A figure in a tuxedo with a cravat sits on
  // its edge; a nightstand holds a glass and an alarm clock;
  // a wilting orchid boutonniere is pinned to the lapel.
  // Nothing else exists. Black and white only, silver greys,
  // one warm skin highlight. Bed centered low, figure left
  // of center, vast black surround doing the focusing.
  // DRAG moves the single light source; shadows swing across
  // the sheets while the figure stays still. The orchid
  // wilts over the loop. No visible room or walls, no color,
  // no horror cliches, no audio.
  var GROUND = '#000000'; // page ground, total blackness

  // Fixed-phase first frame: FIRST_T = 12 s. Cycle 60 s:
  // the light swings on a slow closed loop above the bed,
  // crossing from left to right and back; the orchid wilt
  // is a closed-form function of cycle phase, 0 at the
  // cycle start and 1 at the end. At t = 12 the light is
  // mid-swing at the right, the orchid partly wilted.
  var FIRST_T = 12;
  var CYCLE = 60;
  var SEED = 847;
  var RETURN_S = 4; // drag release eases back over 4 s

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mix(c1, c2, t) {
    return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  }

  // Palette: black and white only, silver greys, one warm
  // skin highlight. Hexes recorded in process.md.
  var BLACK = [0, 0, 0];
  var VOID = [5, 5, 5];
  var SHEET = [201, 201, 201];
  var SHEET_LIT = [238, 238, 238];
  var SHEET_DIM = [142, 142, 142];
  var PILLOW = [224, 224, 224];
  var BLANKET = [138, 138, 138];
  var BLANKET_DARK = [96, 96, 96];
  var BASE = [38, 38, 38];
  var BASE_DARK = [20, 20, 20];
  var STAND = [28, 28, 28];
  var STAND_EDGE = [110, 110, 110];
  var JACKET = [14, 14, 14];
  var JACKET_EDGE = [120, 120, 120];
  var SHIRT = [240, 240, 240];
  var SKIN = [217, 160, 107]; // the one warm highlight
  var SKIN_SHADOW = [178, 124, 76];
  var HAIR = [8, 8, 8];
  var SHOE = [10, 10, 10];
  var GLASS = [200, 200, 200];
  var CLOCK_FACE = [232, 232, 232];
  var ORCHID_FRESH = [236, 236, 236];
  var ORCHID_WILT = [143, 143, 143];
  var FOLD_LIGHT = [255, 255, 255];
  var FOLD_DARK = [0, 0, 0];

  // ---- Layout ----------------------------------------------------
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Light model -----------------------------------------------
  // Loop path: the light swings above the bed on a closed
  // 60 s loop, x sweeping left to right and back, y dipping
  // slightly as it crosses the middle. Pure function of t.
  function loopLight(t) {
    var ph = ((t % CYCLE) + CYCLE) % CYCLE / CYCLE;
    var ang = ph * Math.PI * 2;
    return {
      x: 0.5 + 0.34 * Math.sin(ang),
      y: 0.16 + 0.05 * Math.cos(ang)
    };
  }
  // Drag state. Drag sets a target light position; the light
  // eases toward it while held. Release eases back to the
  // loop path over RETURN_S seconds. All offsets are
  // closed-form functions of t given the event state, so a
  // probe can drive them with explicit times.
  var dragState = { mode: 'loop', startT: 0, from: { x: 0.5, y: 0.16 }, target: { x: 0.5, y: 0.16 } };
  function lightPos(t) {
    if (dragState.mode === 'drag') {
      var k = 1 - Math.exp(-(t - dragState.startT) / 0.3);
      return {
        x: dragState.from.x + (dragState.target.x - dragState.from.x) * k,
        y: dragState.from.y + (dragState.target.y - dragState.from.y) * k
      };
    }
    if (dragState.mode === 'return') {
      var s = smooth((t - dragState.startT) / RETURN_S);
      var lp = loopLight(t);
      return {
        x: dragState.from.x + (lp.x - dragState.from.x) * s,
        y: dragState.from.y + (lp.y - dragState.from.y) * s
      };
    }
    return loopLight(t);
  }
  function startDrag(nx, ny, t) {
    var cur = lightPos(t);
    dragState.mode = 'drag';
    dragState.startT = t;
    dragState.from = cur;
    dragState.target = { x: clamp(nx, 0.08, 0.92), y: clamp(ny, 0.04, 0.45) };
  }
  function moveDrag(nx, ny, t) {
    if (dragState.mode !== 'drag') { return; }
    var cur = lightPos(t);
    dragState.startT = t;
    dragState.from = cur;
    dragState.target = { x: clamp(nx, 0.08, 0.92), y: clamp(ny, 0.04, 0.45) };
  }
  function releaseDrag(t) {
    if (dragState.mode === 'loop') { return; }
    dragState.mode = 'return';
    dragState.startT = t;
    dragState.from = lightPos(t);
  }
  // Orchid wilt: closed-form function of cycle phase, 0 at
  // the cycle start, 1 at the end. At FIRST_T = 12 the
  // orchid is partly wilted (w = 0.2).
  function wilt(t) {
    var ph = ((t % CYCLE) + CYCLE) % CYCLE / CYCLE;
    return ph;
  }

  // ---- Bed geometry (normalized) ---------------------------------
  // Sheet quad: A back-left, B back-right, C front-right,
  // D front-left. Pillow at the head (left). Blanket draped
  // over the right two thirds. Bed base below the front edge.
  var SHEET_Q = { ax: 0.20, ay: 0.60, bx: 0.85, by: 0.60, cx: 0.82, cy: 0.78, dx: 0.17, dy: 0.78 };
  var BLANKET_Q = { ax: 0.48, ay: 0.60, bx: 0.85, by: 0.60, cx: 0.82, cy: 0.78, dx: 0.46, dy: 0.78 };
  var PILLOW = { x: 0.225, y: 0.585, w: 0.175, h: 0.075, tilt: -0.06 };

  // Fixed authored rumple field. Each fold is a quadratic
  // curve across the sheet or blanket. Never Math.random().
  var SHEET_FOLDS = [
    { x0: 0.24, y0: 0.63, cx: 0.33, cy: 0.615, x1: 0.42, y1: 0.635 },
    { x0: 0.45, y0: 0.62, cx: 0.55, cy: 0.645, x1: 0.66, y1: 0.625 },
    { x0: 0.68, y0: 0.63, cx: 0.75, cy: 0.615, x1: 0.81, y1: 0.64 },
    { x0: 0.22, y0: 0.70, cx: 0.30, cy: 0.685, x1: 0.40, y1: 0.705 },
    { x0: 0.44, y0: 0.69, cx: 0.54, cy: 0.715, x1: 0.64, y1: 0.695 },
    { x0: 0.66, y0: 0.71, cx: 0.74, cy: 0.69, x1: 0.80, y1: 0.715 },
    { x0: 0.25, y0: 0.75, cx: 0.35, cy: 0.735, x1: 0.46, y1: 0.755 },
    { x0: 0.50, y0: 0.75, cx: 0.60, cy: 0.735, x1: 0.72, y1: 0.755 },
    { x0: 0.30, y0: 0.66, cx: 0.36, cy: 0.67, x1: 0.38, y1: 0.72 },
    { x0: 0.58, y0: 0.63, cx: 0.60, cy: 0.68, x1: 0.57, y1: 0.74 }
  ];
  var BLANKET_FOLDS = [
    { x0: 0.52, y0: 0.61, cx: 0.53, cy: 0.68, x1: 0.51, y1: 0.76 },
    { x0: 0.63, y0: 0.61, cx: 0.65, cy: 0.68, x1: 0.62, y1: 0.77 },
    { x0: 0.74, y0: 0.62, cx: 0.75, cy: 0.69, x1: 0.73, y1: 0.76 },
    { x0: 0.50, y0: 0.70, cx: 0.60, cy: 0.715, x1: 0.71, y1: 0.70 },
    { x0: 0.55, y0: 0.64, cx: 0.62, cy: 0.65, x1: 0.70, y1: 0.635 }
  ];

  function quadPath(q) {
    ctx.beginPath();
    ctx.moveTo(q.ax * W, q.ay * H);
    ctx.lineTo(q.bx * W, q.by * H);
    ctx.lineTo(q.cx * W, q.cy * H);
    ctx.lineTo(q.dx * W, q.dy * H);
    ctx.closePath();
  }
  // One rumple: a highlight stroke offset toward the light
  // and a shadow stroke offset away from it, so the fold
  // reads as relief and its lit side follows the light.
  function drawFold(f, lx, lw) {
    var mx = (f.x0 + f.x1) / 2, my = (f.y0 + f.y1) / 2;
    var toLx = lx - mx * W;
    var toLy = 0.69 * H - my * H;
    var len = Math.sqrt(toLx * toLx + toLy * toLy) || 1;
    var ox = (toLx / len) * W * 0.004, oy = (toLy / len) * H * 0.004;
    ctx.lineWidth = Math.max(1, lw * 1.4);
    ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(FOLD_LIGHT, a4(0.32));
    ctx.beginPath();
    ctx.moveTo((f.x0 * W) + ox, (f.y0 * H) + oy);
    ctx.quadraticCurveTo((f.cx * W) + ox, (f.cy * H) + oy, (f.x1 * W) + ox, (f.y1 * H) + oy);
    ctx.stroke();
    ctx.strokeStyle = rgba(FOLD_DARK, a4(0.26));
    ctx.beginPath();
    ctx.moveTo((f.x0 * W) - ox, (f.y0 * H) - oy);
    ctx.quadraticCurveTo((f.cx * W) - ox, (f.cy * H) - oy, (f.x1 * W) - ox, (f.y1 * H) - oy);
    ctx.stroke();
  }

  function drawBed(lx, ly) {
    // Light pool center on the bed, pulled toward the light.
    var poolX = (0.5 + (lx / W - 0.5) * 0.55) * W;
    var poolY = 0.69 * H;
    var poolR = W * 0.44;

    // Headboard: a dark slab at the left end of the bed.
    ctx.fillStyle = rgb(BASE_DARK);
    ctx.beginPath();
    ctx.moveTo(0.135 * W, 0.42 * H);
    ctx.lineTo(0.185 * W, 0.42 * H);
    ctx.lineTo(0.185 * W, 0.62 * H);
    ctx.lineTo(0.135 * W, 0.62 * H);
    ctx.closePath();
    ctx.fill();
    // Lit edge of the headboard, on the side facing the light.
    ctx.strokeStyle = rgba(STAND_EDGE, a4(lx > 0.16 * W ? 0.55 : 0.18));
    ctx.lineWidth = Math.max(1, W * 0.003);
    ctx.beginPath();
    ctx.moveTo(0.185 * W, 0.42 * H);
    ctx.lineTo(0.185 * W, 0.62 * H);
    ctx.stroke();

    // Bed base below the front edge, dark so the bed floats.
    ctx.fillStyle = rgb(BASE);
    ctx.beginPath();
    ctx.moveTo(SHEET_Q.dx * W, SHEET_Q.dy * H);
    ctx.lineTo(SHEET_Q.cx * W, SHEET_Q.cy * H);
    ctx.lineTo(SHEET_Q.cx * W, 0.86 * H);
    ctx.lineTo(SHEET_Q.dx * W, 0.86 * H);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgba(BLACK, a4(0.45));
    ctx.fillRect(SHEET_Q.dx * W, 0.845 * H, (SHEET_Q.cx - SHEET_Q.dx) * W, 0.015 * H);

    // Sheet top.
    quadPath(SHEET_Q);
    ctx.fillStyle = rgb(SHEET);
    ctx.fill();
    // Light pool: soft white radial wash, clipped to the sheet.
    ctx.save();
    quadPath(SHEET_Q);
    ctx.clip();
    var g = ctx.createRadialGradient(poolX, poolY, 0, poolX, poolY, poolR);
    g.addColorStop(0, rgba(SHEET_LIT, a4(0.55)));
    g.addColorStop(0.55, rgba(SHEET_LIT, a4(0.18)));
    g.addColorStop(1, rgba(SHEET_LIT, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // Far edge of the sheet falls off into dim grey away
    // from the light.
    var g2 = ctx.createRadialGradient(poolX, poolY, poolR * 0.45, poolX, poolY, poolR * 1.25);
    g2.addColorStop(0, rgba(SHEET_DIM, 0));
    g2.addColorStop(1, rgba(SHEET_DIM, a4(0.42)));
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // Sheet rumples.
    var i;
    for (i = 0; i < SHEET_FOLDS.length; i++) {
      drawFold(SHEET_FOLDS[i], lx, Math.max(1, W * 0.0022));
    }

    // Pillow at the head, slightly tilted, with creases.
    ctx.save();
    ctx.translate((PILLOW.x + PILLOW.w / 2) * W, (PILLOW.y + PILLOW.h / 2) * H);
    ctx.rotate(PILLOW.tilt);
    var pw = PILLOW.w * W, ph = PILLOW.h * H;
    ctx.fillStyle = rgb(PILLOW);
    ctx.beginPath();
    ctx.moveTo(-pw / 2 + ph * 0.3, -ph / 2);
    ctx.lineTo(pw / 2 - ph * 0.3, -ph / 2);
    ctx.quadraticCurveTo(pw / 2, -ph / 2, pw / 2, 0);
    ctx.quadraticCurveTo(pw / 2, ph / 2, pw / 2 - ph * 0.3, ph / 2);
    ctx.lineTo(-pw / 2 + ph * 0.3, ph / 2);
    ctx.quadraticCurveTo(-pw / 2, ph / 2, -pw / 2, 0);
    ctx.quadraticCurveTo(-pw / 2, -ph / 2, -pw / 2 + ph * 0.3, -ph / 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba(FOLD_DARK, a4(0.28));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.beginPath();
    ctx.moveTo(-pw * 0.28, -ph * 0.28);
    ctx.quadraticCurveTo(0, -ph * 0.05, pw * 0.30, -ph * 0.22);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-pw * 0.30, ph * 0.30);
    ctx.quadraticCurveTo(0, ph * 0.08, pw * 0.28, ph * 0.28);
    ctx.stroke();
    ctx.restore();

    // Blanket draped over the right two thirds, with a
    // folded ridge along its left edge.
    ctx.save();
    quadPath(BLANKET_Q);
    ctx.clip();
    ctx.fillStyle = rgb(BLANKET);
    ctx.fillRect(0, 0, W, H);
    var gb = ctx.createRadialGradient(poolX, poolY, 0, poolX, poolY, poolR);
    gb.addColorStop(0, rgba([200, 200, 200], a4(0.4)));
    gb.addColorStop(0.6, rgba([200, 200, 200], a4(0.12)));
    gb.addColorStop(1, rgba([200, 200, 200], 0));
    ctx.fillStyle = gb;
    ctx.fillRect(0, 0, W, H);
    var gb2 = ctx.createRadialGradient(poolX, poolY, poolR * 0.4, poolX, poolY, poolR * 1.2);
    gb2.addColorStop(0, rgba(BLANKET_DARK, 0));
    gb2.addColorStop(1, rgba(BLANKET_DARK, a4(0.4)));
    ctx.fillStyle = gb2;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    for (i = 0; i < BLANKET_FOLDS.length; i++) {
      drawFold(BLANKET_FOLDS[i], lx, Math.max(1, W * 0.0022));
    }
    // Folded ridge along the blanket's left edge.
    ctx.strokeStyle = rgba(FOLD_LIGHT, a4(0.5));
    ctx.lineWidth = Math.max(1.5, W * 0.004);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(BLANKET_Q.ax * W, BLANKET_Q.ay * H);
    ctx.quadraticCurveTo(0.475 * W, 0.69 * H, BLANKET_Q.dx * W, BLANKET_Q.dy * H);
    ctx.stroke();
    ctx.strokeStyle = rgba(FOLD_DARK, a4(0.35));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.beginPath();
    ctx.moveTo((BLANKET_Q.ax + 0.012) * W, BLANKET_Q.ay * H);
    ctx.quadraticCurveTo(0.487 * W, 0.69 * H, (BLANKET_Q.dx + 0.012) * W, BLANKET_Q.dy * H);
    ctx.stroke();
  }

  // ---- Nightstand --------------------------------------------------
  // Right of the bed: dark slab, one drawer line, two legs.
  // On top: a glass of water and a small alarm clock.
  var STAND_X0 = 0.885, STAND_X1 = 0.975, STAND_TOP = 0.615, STAND_BOT = 0.79;
  function drawNightstand(lx) {
    var x0 = STAND_X0 * W, x1 = STAND_X1 * W;
    var top = STAND_TOP * H, bot = STAND_BOT * H;
    // Legs.
    ctx.fillStyle = rgb(STAND);
    ctx.fillRect((STAND_X0 + 0.008) * W, bot, W * 0.006, 0.05 * H);
    ctx.fillRect((STAND_X1 - 0.014) * W, bot, W * 0.006, 0.05 * H);
    // Body.
    ctx.fillStyle = rgb(STAND);
    ctx.fillRect(x0, top + 0.02 * H, x1 - x0, bot - top - 0.02 * H);
    // Top slab, slightly wider, catching the light.
    ctx.fillStyle = rgb([44, 44, 44]);
    ctx.fillRect((STAND_X0 - 0.006) * W, top, (STAND_X1 - STAND_X0 + 0.012) * W, 0.02 * H);
    // Drawer line and knob.
    ctx.strokeStyle = rgba(STAND_EDGE, a4(0.35));
    ctx.lineWidth = Math.max(1, W * 0.0018);
    ctx.beginPath();
    ctx.moveTo(x0 + W * 0.006, 0.685 * H);
    ctx.lineTo(x1 - W * 0.006, 0.685 * H);
    ctx.stroke();
    ctx.fillStyle = rgba(STAND_EDGE, a4(0.6));
    ctx.beginPath();
    ctx.moveTo((0.93 * W) + W * 0.004, 0.685 * H);
    ctx.arc(0.93 * W, 0.685 * H, W * 0.004, 0, Math.PI * 2);
    ctx.fill();
    // Lit edge on the side facing the light.
    var litLeft = lx < ((STAND_X0 + STAND_X1) / 2) * W;
    ctx.strokeStyle = rgba(STAND_EDGE, a4(0.6));
    ctx.lineWidth = Math.max(1, W * 0.0025);
    ctx.beginPath();
    if (litLeft) {
      ctx.moveTo(x0, top + 0.02 * H);
      ctx.lineTo(x0, bot);
    } else {
      ctx.moveTo(x1, top + 0.02 * H);
      ctx.lineTo(x1, bot);
    }
    ctx.stroke();

    // Glass of water, left on the top slab.
    var gx = 0.905 * W, gy = top, gw = 0.018 * W, gh = 0.032 * H;
    ctx.fillStyle = rgba(GLASS, a4(0.85));
    ctx.beginPath();
    ctx.moveTo(gx - gw / 2, gy - gh);
    ctx.lineTo(gx + gw / 2, gy - gh);
    ctx.lineTo(gx + gw * 0.38, gy);
    ctx.lineTo(gx - gw * 0.38, gy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba(FOLD_LIGHT, a4(0.8));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    ctx.moveTo(gx - gw * 0.22, gy - gh * 0.85);
    ctx.lineTo(gx - gw * 0.28, gy - gh * 0.15);
    ctx.stroke();
    // Water line.
    ctx.strokeStyle = rgba([120, 120, 120], a4(0.7));
    ctx.beginPath();
    ctx.moveTo(gx - gw * 0.42, gy - gh * 0.38);
    ctx.lineTo(gx + gw * 0.42, gy - gh * 0.38);
    ctx.stroke();

    // Alarm clock, right on the top slab. Fixed hands at 3:00.
    var cx = 0.952 * W, cy = gy - 0.016 * H, cr = 0.017 * W;
    ctx.fillStyle = rgb([30, 30, 30]);
    ctx.beginPath();
    ctx.moveTo(cx - cr * 0.7, cy - cr * 1.15);
    ctx.arc(cx - cr * 0.45, cy - cr * 1.25, cr * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + cr * 0.7, cy - cr * 1.15);
    ctx.arc(cx + cr * 0.45, cy - cr * 1.25, cr * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(CLOCK_FACE);
    ctx.beginPath();
    ctx.moveTo(cx + cr, cy);
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgb([40, 40, 40]);
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.beginPath();
    ctx.moveTo(cx + cr, cy);
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.stroke();
    // Hands: hour to 3, minute to 12.
    ctx.strokeStyle = rgb([20, 20, 20]);
    ctx.lineWidth = Math.max(1, W * 0.0022);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + cr * 0.55, cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx, cy - cr * 0.75);
    ctx.stroke();
    // Little feet.
    ctx.beginPath();
    ctx.moveTo(cx - cr * 0.5, cy + cr * 0.9);
    ctx.lineTo(cx - cr * 0.7, cy + cr * 1.35);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + cr * 0.5, cy + cr * 0.9);
    ctx.lineTo(cx + cr * 0.7, cy + cr * 1.35);
    ctx.stroke();
  }

  // ---- Figure ------------------------------------------------------
  // Seated on the bed's near edge, left of center, facing
  // right in three-quarter view. Tuxedo black, white shirt
  // front, black cravat, warm skin face and hands: the one
  // warm highlight. The figure never moves; only its shadow
  // and its lit edge follow the light.
  var FIG = { headX: 0.345, headY: 0.47, headR: 0.032, hipX: 0.36, hipY: 0.665, kneeX: 0.445, kneeY: 0.70, footX: 0.45, footY: 0.835 };
  function drawFigureShadow(lx, ly) {
    // Cast shadow across the sheets: from the seated figure
    // away from the light. Direction and length follow the
    // light position; the figure itself never moves.
    var fx = FIG.hipX * W, fy = 0.72 * H;
    var dx = fx - lx, dy = fy - ly;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len;
    var sl = clamp(len * 0.42, W * 0.05, W * 0.24);
    var px = ux, py = uy;
    var nx = -uy, ny = ux;
    var w0 = W * 0.045, w1 = W * 0.075;
    ctx.fillStyle = rgba(BLACK, a4(0.42));
    ctx.beginPath();
    ctx.moveTo(fx + nx * w0, fy + ny * w0);
    ctx.lineTo(fx + px * sl + nx * w1, fy + py * sl + ny * w1);
    ctx.lineTo(fx + px * sl - nx * w1, fy + py * sl - ny * w1);
    ctx.lineTo(fx - nx * w0, fy - ny * w0);
    ctx.closePath();
    ctx.fill();
    // Soft contact shadow under the seated figure.
    ctx.fillStyle = rgba(BLACK, a4(0.22));
    ctx.beginPath();
    ctx.save();
    ctx.translate(fx, 0.745 * H);
    ctx.scale(1, 0.3);
    ctx.moveTo(W * 0.055, 0);
    ctx.arc(0, 0, W * 0.055, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function drawOrchid(w) {
    // Boutonniere pinned to the lapel. Wilt w (0 fresh to 1
    // spent) droops the petals toward the floor and greys
    // them. Closed-form function of cycle phase.
    var lx0 = 0.328 * W, ly0 = 0.568 * H;
    var col = mix(ORCHID_FRESH, ORCHID_WILT, w);
    // Stem, bending further down as it wilts.
    ctx.strokeStyle = rgba(mix([120, 120, 120], [70, 70, 70], w), a4(0.9));
    ctx.lineWidth = Math.max(1, W * 0.0016);
    ctx.beginPath();
    ctx.moveTo(lx0, ly0 + 0.012 * H);
    ctx.quadraticCurveTo(lx0 - 0.004 * W, ly0 + 0.02 * H + w * 0.008 * H, lx0 - 0.008 * W, ly0 + 0.026 * H + w * 0.012 * H);
    ctx.stroke();
    // Flower head: five petals around a pale center. Each
    // petal angle is pulled toward straight down as w grows.
    var fcx = lx0 - 0.008 * W, fcy = ly0 + 0.026 * H + w * 0.012 * H;
    var pr = W * 0.0085 * (1 - 0.2 * w);
    var i;
    for (i = 0; i < 5; i++) {
      var base = -Math.PI / 2 + i * (Math.PI * 2 / 5);
      var ang = base + (Math.PI / 2 - base) * 0.55 * w;
      var px = fcx + Math.cos(ang) * pr * 1.15;
      var py = fcy + Math.sin(ang) * pr * 1.15;
      ctx.fillStyle = rgba(col, a4(0.95));
      ctx.beginPath();
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(ang);
      ctx.scale(1, 0.62);
      ctx.moveTo(pr, 0);
      ctx.arc(0, 0, pr, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = rgba([200, 200, 200], a4(0.95));
    ctx.beginPath();
    ctx.moveTo(fcx + W * 0.003, fcy);
    ctx.arc(fcx, fcy, W * 0.003, 0, Math.PI * 2);
    ctx.fill();
  }
  function drawFigure(lx, ly, w) {
    var hx = FIG.headX * W, hy = FIG.headY * H, hr = FIG.headR * W;
    var litRight = lx > hx;
    // Legs first (behind the torso): far leg darker, near
    // leg bent at the knee, foot dangling in front of the
    // bed base.
    ctx.strokeStyle = rgb([8, 8, 8]);
    ctx.lineWidth = Math.max(2, W * 0.020);
    ctx.lineCap = 'round';
    // Far leg, slightly behind and darker.
    ctx.strokeStyle = rgba([8, 8, 8], a4(1));
    ctx.beginPath();
    ctx.moveTo((FIG.hipX - 0.015) * W, FIG.hipY * H);
    ctx.lineTo((FIG.kneeX - 0.02) * W, (FIG.kneeY + 0.01) * H);
    ctx.lineTo((FIG.footX - 0.02) * W, (FIG.footY - 0.01) * H);
    ctx.stroke();
    // Near leg.
    ctx.beginPath();
    ctx.moveTo(FIG.hipX * W, FIG.hipY * H);
    ctx.lineTo(FIG.kneeX * W, FIG.kneeY * H);
    ctx.lineTo(FIG.footX * W, FIG.footY * H);
    ctx.stroke();
    // Shoes.
    ctx.fillStyle = rgb(SHOE);
    ctx.beginPath();
    ctx.moveTo((FIG.footX - 0.012) * W, (FIG.footY - 0.008) * H);
    ctx.lineTo((FIG.footX + 0.022) * W, (FIG.footY - 0.008) * H);
    ctx.lineTo((FIG.footX + 0.026) * W, (FIG.footY + 0.008) * H);
    ctx.lineTo((FIG.footX - 0.012) * W, (FIG.footY + 0.008) * H);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb([6, 6, 6]);
    ctx.beginPath();
    ctx.moveTo((FIG.footX - 0.032) * W, (FIG.footY - 0.018) * H);
    ctx.lineTo((FIG.footX + 0.002) * W, (FIG.footY - 0.018) * H);
    ctx.lineTo((FIG.footX + 0.006) * W, (FIG.footY - 0.002) * H);
    ctx.lineTo((FIG.footX - 0.032) * W, (FIG.footY - 0.002) * H);
    ctx.closePath();
    ctx.fill();

    // Torso: tuxedo jacket, shoulders to seat.
    var shY = 0.525 * H, seatY = 0.675 * H;
    var shL = 0.308 * W, shR = 0.392 * W;
    ctx.fillStyle = rgb(JACKET);
    ctx.beginPath();
    ctx.moveTo(shL, shY + 0.01 * H);
    ctx.quadraticCurveTo(shL - 0.008 * W, (shY + seatY) / 2, shL + 0.004 * W, seatY);
    ctx.lineTo(shR - 0.004 * W, seatY);
    ctx.quadraticCurveTo(shR + 0.008 * W, (shY + seatY) / 2, shR, shY + 0.01 * H);
    ctx.quadraticCurveTo((shL + shR) / 2, shY - 0.012 * H, shL, shY + 0.01 * H);
    ctx.closePath();
    ctx.fill();
    // Lit edge of the jacket on the side facing the light.
    ctx.strokeStyle = rgba(JACKET_EDGE, a4(0.5));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.beginPath();
    if (litRight) {
      ctx.moveTo(shR, shY + 0.01 * H);
      ctx.quadraticCurveTo(shR + 0.008 * W, (shY + seatY) / 2, shR - 0.004 * W, seatY);
    } else {
      ctx.moveTo(shL, shY + 0.01 * H);
      ctx.quadraticCurveTo(shL - 0.008 * W, (shY + seatY) / 2, shL + 0.004 * W, seatY);
    }
    ctx.stroke();
    // White shirt front and lapels.
    ctx.fillStyle = rgb(SHIRT);
    ctx.beginPath();
    ctx.moveTo(0.342 * W, 0.535 * H);
    ctx.lineTo(0.362 * W, 0.535 * H);
    ctx.lineTo(0.352 * W, 0.60 * H);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba([150, 150, 150], a4(0.7));
    ctx.lineWidth = Math.max(1, W * 0.0018);
    ctx.beginPath();
    ctx.moveTo(0.342 * W, 0.535 * H);
    ctx.lineTo(0.332 * W, 0.585 * H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0.362 * W, 0.535 * H);
    ctx.lineTo(0.372 * W, 0.585 * H);
    ctx.stroke();
    // Cravat: black bow at the throat.
    ctx.fillStyle = rgb([5, 5, 5]);
    ctx.beginPath();
    ctx.moveTo(0.352 * W, 0.528 * H);
    ctx.lineTo(0.340 * W, 0.522 * H);
    ctx.lineTo(0.340 * W, 0.534 * H);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.352 * W, 0.528 * H);
    ctx.lineTo(0.364 * W, 0.522 * H);
    ctx.lineTo(0.364 * W, 0.534 * H);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.352 * W + W * 0.0025, 0.528 * H);
    ctx.arc(0.352 * W, 0.528 * H, W * 0.0025, 0, Math.PI * 2);
    ctx.fill();

    // Arms: near arm down to the knee, hand resting there.
    ctx.strokeStyle = rgb(JACKET);
    ctx.lineWidth = Math.max(2, W * 0.022);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(shR - 0.004 * W, shY + 0.03 * H);
    ctx.lineTo(0.415 * W, 0.63 * H);
    ctx.lineTo(0.435 * W, 0.685 * H);
    ctx.stroke();
    // Hand on the knee, warm skin.
    ctx.fillStyle = rgb(SKIN);
    ctx.beginPath();
    ctx.moveTo(0.435 * W + W * 0.008, 0.685 * H);
    ctx.arc(0.435 * W, 0.685 * H, W * 0.008, 0, Math.PI * 2);
    ctx.fill();
    // Far arm, hinted behind the torso.
    ctx.strokeStyle = rgba([8, 8, 8], a4(0.9));
    ctx.lineWidth = Math.max(2, W * 0.018);
    ctx.beginPath();
    ctx.moveTo(shL + 0.006 * W, shY + 0.03 * H);
    ctx.lineTo(0.315 * W, 0.62 * H);
    ctx.stroke();

    // Head: warm skin, hair black, face turned slightly
    // right. The side away from the light carries a soft
    // grey shadow so the face reads the light too.
    ctx.fillStyle = rgb(SKIN);
    ctx.beginPath();
    ctx.moveTo(hx + hr, hy);
    ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    ctx.fill();
    // Soft shadow on the side away from the light: a
    // skin-shadow disc offset toward the dark side, clipped
    // to the face circle, so it reads as a crescent rather
    // than a hard split.
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(hx + hr, hy);
    ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = rgba(SKIN_SHADOW, a4(0.5));
    ctx.beginPath();
    ctx.moveTo(hx + (litRight ? -hr * 0.55 : hr * 0.55) + hr, hy);
    ctx.arc(hx + (litRight ? -hr * 0.55 : hr * 0.55), hy, hr, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // Hair: black cap over the top of the head.
    ctx.fillStyle = rgb(HAIR);
    ctx.beginPath();
    ctx.moveTo(hx - hr * 0.95, hy - hr * 0.15);
    ctx.arc(hx, hy - hr * 0.1, hr * 0.98, Math.PI * 0.95, Math.PI * 2.05);
    ctx.closePath();
    ctx.fill();
    // Eye, a small dark mark catching the light.
    ctx.fillStyle = rgb([20, 20, 20]);
    ctx.beginPath();
    ctx.moveTo(hx + hr * 0.42, hy - hr * 0.05);
    ctx.arc(hx + hr * 0.38, hy - hr * 0.05, hr * 0.07, 0, Math.PI * 2);
    ctx.fill();
    // Neck.
    ctx.fillStyle = rgb(SKIN_SHADOW);
    ctx.fillRect(hx - hr * 0.22, hy + hr * 0.85, hr * 0.44, hr * 0.35);

    // The wilting orchid on the lapel.
    drawOrchid(w);
  }

  // ---- Draw ------------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var lp = lightPos(t);
    var lx = lp.x * W, ly = lp.y * H;
    var w = wilt(t);

    // Total blackness.
    ctx.fillStyle = rgb(BLACK);
    ctx.fillRect(0, 0, W, H);

    // Faint beam from the light down to the bed, so the
    // single hard source reads as volumetric stillness.
    ctx.fillStyle = rgba([255, 255, 255], a4(0.045));
    ctx.beginPath();
    ctx.moveTo(lx - W * 0.006, ly);
    ctx.lineTo(lx + W * 0.006, ly);
    ctx.lineTo((lp.x + 0.20) * W, 0.78 * H);
    ctx.lineTo((lp.x - 0.20) * W, 0.78 * H);
    ctx.closePath();
    ctx.fill();

    drawBed(lx, ly);
    drawFigureShadow(lx, ly);
    drawNightstand(lx);
    drawFigure(lx, ly, w);

    // The light itself: a hard bright disc with a halo,
    // drawn last so it sits above the void.
    var halo = ctx.createRadialGradient(lx, ly, 0, lx, ly, W * 0.13);
    halo.addColorStop(0, rgba([255, 255, 255], a4(0.5)));
    halo.addColorStop(0.25, rgba([255, 255, 255], a4(0.14)));
    halo.addColorStop(1, rgba([255, 255, 255], 0));
    ctx.fillStyle = halo;
    ctx.fillRect(lx - W * 0.13, ly - W * 0.13, W * 0.26, W * 0.26);
    ctx.fillStyle = rgb([255, 255, 255]);
    ctx.beginPath();
    ctx.moveTo(lx + W * 0.007, ly);
    ctx.arc(lx, ly, W * 0.007, 0, Math.PI * 2);
    ctx.fill();

    // Caption, top left, and the hint, bottom center, in the
    // template's place: silver grey on the black void.
    var fsCap = Math.round(clamp(W * 0.020, 11, 15));
    var fsDate = Math.round(clamp(W * 0.016, 9, 12));
    var fsHint = Math.round(clamp(W * 0.022, 12, 16));
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba([200, 200, 200], a4(0.72));
    ctx.font = '600 ' + fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№847 · The Lit Bed', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba([200, 200, 200], a4(0.55));
    ctx.font = fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 07', W * 0.04, H * 0.055 + fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba([200, 200, 200], a4(0.75));
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to move the light.', W / 2, H - fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // ---- Interaction -----------------------------------------------
  // DRAG moves the single light source; the light eases
  // toward the pointer while held. Release eases it back
  // to the loop path over about 4 s. The figure never
  // moves; only shadows and lit edges follow the light.
  // Never click-to-reload.
  function pointerPos(ev) {
    var r = null;
    try {
      if (typeof canvas.getBoundingClientRect === 'function') {
        r = canvas.getBoundingClientRect();
      }
    } catch (e) { r = null; }
    if (r && r.width) {
      return { x: (ev.clientX - r.left) / r.width, y: (ev.clientY - r.top) / r.height };
    }
    if (typeof ev.offsetX === 'number') {
      return { x: ev.offsetX / stageW, y: ev.offsetY / stageH };
    }
    return { x: 0.5, y: 0.16 };
  }
  var dragging = false;
  function onDown(ev) {
    dragging = true;
    var p = pointerPos(ev);
    startDrag(p.x, p.y, lastT);
    try {
      if (ev.preventDefault) { ev.preventDefault(); }
    } catch (e) {}
  }
  function onMove(ev) {
    if (!dragging) { return; }
    var p = pointerPos(ev);
    moveDrag(p.x, p.y, lastT);
    try {
      if (ev.preventDefault) { ev.preventDefault(); }
    } catch (e) {}
  }
  function onUp(ev) {
    if (!dragging) { return; }
    dragging = false;
    releaseDrag(lastT);
  }
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);
    }
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece847 exposes the light position, the fixed
  // figure anchor, the wilt, and the drag/release so a probe
  // can confirm shadows move, the figure does not, and the
  // light returns to the loop path after release.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece847 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      light: function (t) { var p = lightPos(t); return { x: +p.x.toFixed(4), y: +p.y.toFixed(4) }; },
      loopLight: function (t) { var p = loopLight(t); return { x: +p.x.toFixed(4), y: +p.y.toFixed(4) }; },
      figure: function () { return { x: FIG.headX, y: FIG.headY }; },
      wilt: function (t) { return +wilt(t).toFixed(4); },
      drag: function (dx, dy, t) {
        var p = loopLight(t);
        startDrag(p.x + dx, p.y + dy, t);
        return lightPos(t);
      },
      release: function (t) { releaseDrag(t); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the light swings, the orchid wilts, the
  // figure sits still. Guarded so node-canvas QA (no
  // requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
