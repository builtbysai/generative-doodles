<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Static Stare</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var BLACK = '#0A0A0A';
  var WHITE = '#F4F4F2';
  var TAKE = 240; // the four-minute take, seconds

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded RNG (mulberry32) - fixed seed, deterministic schedule.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Blink moments inside one take: seeded, every ~20-40 s.
  // The blinks are scheduled but NEVER executed; only a lid tremor happens.
  var blinkTimes = [];
  (function () {
    var rng = mulberry32(847103);
    var t = 9 + rng() * 8;
    while (t < TAKE - 6) {
      blinkTimes.push(t);
      t += 20 + rng() * 20;
    }
  })();

  function smoothstep(t, a, b) {
    if (t <= a) return 0;
    if (t >= b) return 1;
    var p = (t - a) / (b - a);
    return p * p * (3 - 2 * p);
  }

  // Lid tremor at a scheduled blink moment: the lid drops ~2 px and
  // recovers inside 0.22 s. The eye never closes.
  function lidTremor(tt, S) {
    var maxDrop = 0.0028; // in face units (~2 px at portrait scale)
    var drop = 0;
    for (var i = 0; i < blinkTimes.length; i++) {
      var d = tt - blinkTimes[i];
      if (d >= 0 && d <= 0.22) {
        var p = d / 0.22;
        var v = Math.sin(Math.PI * p) * (0.75 + 0.25 * Math.sin(p * Math.PI * 7));
        if (v > drop) drop = v;
      }
    }
    return maxDrop * drop;
  }

  function viewport() {
    var vv = window.visualViewport;
    var w = vv && vv.width ? vv.width : window.innerWidth;
    var h = vv && vv.height ? vv.height : window.innerHeight;
    return { w: w, h: h };
  }

  function resize() {
    var v = viewport();
    canvas.width = v.w;
    canvas.height = v.h;
  }

  function poly(pts, fill, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function strokePath(pts, color, alpha, width, close) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (close) ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function disc(x, y, r, fill, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // One eye, centered at (ex, ey) in face units. lit = full contrast;
  // the shadow-side eye is redrawn faintly after the shadow falls.
  function drawEye(ex, ey, lidDrop, lit) {
    var hw = 0.078; // half width of the almond
    var hh = 0.026; // half height
    // almond (eye white)
    ctx.globalAlpha = lit ? 1 : 0.14;
    ctx.fillStyle = WHITE;
    ctx.beginPath();
    ctx.moveTo(ex - hw, ey);
    ctx.quadraticCurveTo(ex - hw * 0.35, ey - hh * 2, ex, ey - hh * 1.55);
    ctx.quadraticCurveTo(ex + hw * 0.45, ey - hh * 2, ex + hw, ey);
    ctx.quadraticCurveTo(ex + hw * 0.4, ey + hh * 1.5, ex, ey + hh * 1.35);
    ctx.quadraticCurveTo(ex - hw * 0.45, ey + hh * 1.5, ex - hw, ey);
    ctx.fill();
    ctx.globalAlpha = 1;
    if (lit) {
      // iris, looking straight out
      disc(ex, ey - hh * 0.1, 0.030, BLACK, 0.97);
      disc(ex, ey - hh * 0.1, 0.0155, BLACK, 1);
      disc(ex - 0.010, ey - hh * 0.1 - 0.010, 0.007, WHITE, 0.95);
    } else {
      disc(ex - 0.010, ey - hh * 0.1 - 0.010, 0.007, WHITE, 0.35);
    }
    // upper lid line, displaced by the tremor (never a full blink)
    var lidY = ey - hh * 1.55 + lidDrop;
    strokePath([
      [ex - hw, ey + lidDrop * 0.4],
      [ex - hw * 0.35, lidY - hh * 0.45],
      [ex, lidY],
      [ex + hw * 0.45, lidY - hh * 0.45],
      [ex + hw, ey + lidDrop * 0.4]
    ], BLACK, lit ? 0.9 : 0.25, 0.011, false);
    if (lit) {
      // lid fold
      strokePath([
        [ex - hw * 0.8, ey - hh * 2.6],
        [ex, ey - hh * 3.1],
        [ex + hw * 0.8, ey - hh * 2.6]
      ], BLACK, 0.30, 0.005, false);
      // lower lid
      strokePath([
        [ex - hw * 0.85, ey + hh * 0.7],
        [ex, ey + hh * 1.5],
        [ex + hw * 0.85, ey + hh * 0.7]
      ], BLACK, 0.28, 0.004, false);
    }
  }

  function draw(t) {
    var v = viewport();
    var W = v.w, H = v.h;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var scr = window.screen || { width: W, height: H };
    var isPhone = (Math.min(scr.width, scr.height) < 700) || (H > W * 1.15);

    // page ground
    ctx.globalAlpha = 1;
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);

    var tt = ((t % TAKE) + TAKE) % TAKE;

    // Closed-form micro-motion.
    var breath = 1 + 0.004 * Math.sin((Math.PI * 2 * t) / 14); // 0.5% breathing scale
    var driftU = 0.010 * (0.5 - 0.5 * Math.cos((Math.PI * 2 * t) / 480)); // shadow creep, face units
    var jaw = 0.004 * (smoothstep(tt, 16, 24) - smoothstep(tt, 205, 225)); // one jaw shift, early
    var tremor = lidTremor(tt, 1);

    // Face framing: fills the frame, slightly off-center.
    var faceH = Math.min(1.06 * H, 1.20 * W);
    var S = faceH / 1.28;
    var cx = 0.47 * W;
    var cy = (isPhone ? 0.50 : 0.52) * H;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(S * breath, S * breath * 1.06);

    // --- neck (behind the head, dim) ---
    poly([[-0.155, 0.58], [0.155, 0.58], [0.235, 0.92], [-0.235, 0.92]], WHITE, 0.30);
    poly([[-0.155, 0.58], [0.155, 0.58], [0.175, 0.70], [-0.175, 0.70]], BLACK, 0.35);

    // --- skull / face base ---
    var base = [
      [0.00, -0.64], [0.20, -0.625], [0.34, -0.565], [0.43, -0.46],
      [0.465, -0.30], [0.47, -0.10], [0.455, 0.08], [0.415, 0.24],
      [0.345, 0.40], [0.25, 0.52], [0.13, 0.605], [0.00, 0.635],
      [-0.13, 0.605], [-0.25, 0.52], [-0.345, 0.40], [-0.415, 0.24],
      [-0.455, 0.08], [-0.47, -0.10], [-0.465, -0.30], [-0.43, -0.46],
      [-0.34, -0.565], [-0.20, -0.625]
    ];
    poly(base, WHITE, 0.93);

    // --- hair mass ---
    poly([
      [-0.468, -0.28], [-0.455, -0.44], [-0.40, -0.545], [-0.30, -0.60],
      [-0.16, -0.632], [0.00, -0.64], [0.16, -0.632], [0.30, -0.60],
      [0.40, -0.545], [0.455, -0.44], [0.468, -0.28],
      [0.40, -0.415], [0.28, -0.455], [0.12, -0.475], [0.00, -0.462],
      [-0.12, -0.475], [-0.28, -0.455], [-0.40, -0.415]
    ], BLACK, 0.92);

    // --- modelling planes (alpha greys only) ---
    poly([[-0.44, -0.42], [-0.30, -0.47], [-0.315, -0.20], [-0.45, -0.16]], BLACK, 0.10); // left temple
    poly([[0.44, -0.42], [0.30, -0.47], [0.315, -0.20], [0.45, -0.16]], BLACK, 0.10);  // right temple
    poly([[-0.30, -0.44], [0.05, -0.455], [0.03, -0.30], [-0.28, -0.29]], WHITE, 0.55); // forehead light
    poly([[-0.36, -0.205], [0.36, -0.205], [0.35, -0.135], [-0.35, -0.135]], BLACK, 0.15); // brow shelf shadow
    poly([[-0.30, -0.16], [-0.05, -0.15], [-0.06, 0.02], [-0.29, 0.01]], BLACK, 0.07); // left socket shade
    poly([[0.30, -0.16], [0.05, -0.15], [0.06, 0.02], [0.29, 0.01]], BLACK, 0.07);  // right socket shade
    poly([[-0.44, 0.06], [-0.28, 0.02], [-0.26, 0.22], [-0.42, 0.26]], BLACK, 0.07); // left cheek plane
    poly([[0.44, 0.06], [0.28, 0.02], [0.26, 0.22], [0.42, 0.26]], BLACK, 0.06);  // right cheek plane

    // --- brows ---
    poly([[-0.318, -0.168], [-0.20, -0.196], [-0.112, -0.182], [-0.115, -0.152], [-0.21, -0.160], [-0.315, -0.140]], BLACK, 0.88);
    poly([[0.318, -0.168], [0.20, -0.196], [0.112, -0.182], [0.115, -0.152], [0.21, -0.160], [0.315, -0.140]], BLACK, 0.88);

    // --- eyes (open, looking straight out) ---
    drawEye(-0.185, -0.075, tremor, true);
    drawEye(0.185, -0.075, tremor, true);

    // --- nose ---
    poly([[-0.030, -0.05], [0.002, -0.05], [-0.004, 0.20], [-0.026, 0.20]], WHITE, 0.45); // bridge light
    poly([[0.006, -0.04], [0.046, 0.15], [0.076, 0.235], [0.052, 0.272], [0.008, 0.245]], BLACK, 0.22); // side shadow
    poly([[-0.078, 0.272], [0.078, 0.272], [0.046, 0.318], [-0.046, 0.318]], BLACK, 0.26); // under-nose shadow
    ctx.save();
    ctx.translate(-0.040, 0.288); ctx.scale(1, 0.55); disc(0, 0, 0.011, BLACK, 0.75); ctx.restore();
    ctx.save();
    ctx.translate(0.040, 0.288); ctx.scale(1, 0.55); disc(0, 0, 0.011, BLACK, 0.75); ctx.restore();

    // nasolabial fold, lit side
    strokePath([[-0.072, 0.305], [-0.098, 0.35], [-0.112, 0.388]], BLACK, 0.22, 0.004, false);

    // --- mouth and jaw group (jaw shift applies here) ---
    ctx.save();
    ctx.translate(0, jaw);
    poly([[-0.105, 0.392], [0.105, 0.392], [0.085, 0.408], [-0.085, 0.408]], BLACK, 0.16); // above-lip shade
    strokePath([
      [-0.118, 0.406], [-0.05, 0.414], [0.00, 0.4155], [0.05, 0.414], [0.118, 0.406]
    ], BLACK, 0.85, 0.010, false); // the mouth line: flat, closed, unsmiling
    poly([[-0.085, 0.424], [0.085, 0.424], [0.055, 0.448], [-0.055, 0.448]], WHITE, 0.55); // lower lip light
    poly([[-0.07, 0.452], [0.07, 0.452], [0.045, 0.472], [-0.045, 0.472]], BLACK, 0.13); // under-lip shadow
    ctx.restore();

    // chin / jaw shading
    poly([[-0.20, 0.50], [0.20, 0.50], [0.12, 0.615], [-0.12, 0.615]], BLACK, 0.07);
    disc(0, 0.565, 0.016, BLACK, 0.10);

    // --- the shadow: half the face falls to black ---
    var bx = 0.055 + driftU; // boundary x near the nose, creeping with drift
    // soft step along the edge
    poly([
      [bx - 0.028, -0.95], [bx + 0.012, -0.30], [bx - 0.005, 0.02],
      [bx + 0.010, 0.32], [bx + 0.045, 0.66], [bx + 0.045, 1.05],
      [bx - 0.028, 1.05]
    ], BLACK, 0.45);
    // main shadow mass
    poly([
      [bx + 0.012, -0.95], [bx + 0.045, -0.30], [bx + 0.022, 0.02],
      [bx + 0.035, 0.32], [bx + 0.065, 0.66], [bx + 0.065, 1.05],
      [1.30, 1.05], [1.30, -0.95]
    ], BLACK, 0.93);

    // --- shadow-side trace: the dim eye keeps staring out of the dark ---
    // (The shadow-side mouth is simply lost to the black, as in the films.)
    drawEye(0.185, -0.075, tremor, false);

    ctx.restore();
  }

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(0); });
  }
  window.addEventListener('resize', function () { resize(); draw(0); });

  // Frame one: synchronous, fixed phase.
  draw(0);

  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = (typeof now === 'number') ? (now - start) / 1000 : 0;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
