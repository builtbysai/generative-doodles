<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.360 Dark Academia, Three Ways</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#14141C; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.360 Dark Academia, Three Ways (betterloveart).
// After Suchita Prakash's Dark Academia SPD collab
// curation: one fixed five-colour palette applied
// across many designers so the set coordinates. Here
// the one palette (plum, ink, oxblood, parchment,
// moss) runs through three generator grammars at
// once, shown as a triptych: an ogee damask panel, a
// berry lattice panel and a Delft-style tile panel,
// divided by hairline parchment lines. Each panel
// drifts at its own rate inside one shared 40s loop,
// travelling a whole number of its own pattern
// periods per loop, so frame 40s is pixel-identical
// to frame 0. Double-tap advances all three panels to
// the next authored collection in a fixed table: the
// motifs re-roll, the palette never does. The palette
// object is frozen and asserted at five inks, and
// every painter below reads colours from it alone.
// Nothing is runtime random: all motif placement,
// cluster parity and tile vignettes are fixed data
// or closed-form functions of cell indices.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- the fixed palette: five inks, never changes ------------
var PAL = Object.freeze({
  plum: '#3D2B45',
  ink: '#14141C',
  oxblood: '#5E1F27',
  parchment: '#E8DCC3',
  moss: '#5A6B48'
});
if (Object.keys(PAL).length !== 5) throw new Error('Dark Academia palette must hold exactly five inks');

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 40;              // seconds, shared seamless master loop
if (LOOP !== 40) throw new Error('Dark Academia loop must be 40s');
var TICK = 1 / 60;
// Frame one starts developed: exactly 17.35s into the
// 40s cycle, all three panels mid-drift. Drawn at this
// fixed phase, never from a wall clock, so the
// thumbnail reproduces byte-identically; the live loop
// advances from that same anchor.
var T_OFFSET = 17.35;
var T = T_OFFSET;

// ---- collections: fixed table, palette untouched -------------
// damask: the pair of motif indices alternating in the
// ogee cells. lattice: the berry cluster style at the
// lattice nodes. tileShift: rotation of the tile
// vignette table. Double-tap steps this index only.
var COLLECTIONS = [
  { damask: [0, 1], lattice: 0, tileShift: 0 },
  { damask: [2, 3], lattice: 1, tileShift: 2 },
  { damask: [0, 3], lattice: 2, tileShift: 4 },
  { damask: [1, 2], lattice: 0, tileShift: 1 }
];
if (COLLECTIONS.length !== 4) throw new Error('Dark Academia needs exactly four collections');
var collIdx = 0;

// ---- small path helpers ---------------------------------------
function circle(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}
function leafPath(x, y, len, wid, ang) {
  // one pointed leaf centred on the origin axis, drawn
  // along +y then rotated by ang
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + wid, y + len * 0.4, x, y + len);
  ctx.quadraticCurveTo(x - wid, y + len * 0.4, x, y);
  ctx.closePath();
  ctx.fill();
}
function leafAt(x, y, len, wid, ang) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  leafPath(0, -len / 2, len, wid, ang);
  ctx.restore();
}
function diamond(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.lineTo(x + r, y);
  ctx.lineTo(x, y + r);
  ctx.lineTo(x - r, y);
  ctx.closePath();
  ctx.fill();
}
function crescentPath(x, y, r) {
  // crescent opening to the right: outer circle arc
  // plus a reverse inner arc
  ctx.beginPath();
  ctx.arc(x, y, r, Math.PI * 0.32, Math.PI * 1.68, false);
  ctx.arc(x + r * 0.52, y, r * 0.78, Math.PI * 1.52, Math.PI * 0.48, true);
  ctx.closePath();
}

// ---- damask motifs (drawn centred at 0,0) ---------------------
function motifMedallion(s) {
  var i, a;
  ctx.fillStyle = PAL.oxblood;
  for (i = 0; i < 8; i++) {
    a = i * Math.PI / 4;
    ctx.save();
    ctx.rotate(a);
    leafPath(0, -s * 0.28, s * 0.72, s * 0.20, 0);
    ctx.restore();
  }
  ctx.fillStyle = PAL.parchment;
  diamond(0, 0, s * 0.46);
  ctx.fillStyle = PAL.plum;
  circle(0, 0, s * 0.15);
  ctx.fillStyle = PAL.moss;
  for (i = 0; i < 8; i++) {
    a = (i + 0.5) * Math.PI / 4;
    circle(Math.cos(a) * s * 0.86, Math.sin(a) * s * 0.86, s * 0.07);
  }
}
function motifAcorn(s) {
  ctx.strokeStyle = PAL.moss;
  ctx.lineWidth = s * 0.10;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, s * 0.85);
  ctx.quadraticCurveTo(s * 0.08, s * 0.1, 0, -s * 0.45);
  ctx.stroke();
  ctx.fillStyle = PAL.moss;
  leafAt(-s * 0.30, -s * 0.05, s * 0.85, s * 0.24, -0.85);
  leafAt(s * 0.30, -s * 0.05, s * 0.85, s * 0.24, 0.85);
  // acorn: parchment body, oxblood cap
  ctx.fillStyle = PAL.parchment;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.62);
  ctx.quadraticCurveTo(s * 0.42, s * 0.05, s * 0.34, -s * 0.28);
  ctx.lineTo(-s * 0.34, -s * 0.28);
  ctx.quadraticCurveTo(-s * 0.42, s * 0.05, 0, s * 0.62);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = PAL.oxblood;
  ctx.beginPath();
  ctx.arc(0, -s * 0.28, s * 0.37, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(-s * 0.05, -s * 0.78, s * 0.10, s * 0.16);
}
function motifStarflower(s) {
  var i, a;
  ctx.fillStyle = PAL.parchment;
  for (i = 0; i < 8; i++) {
    a = i * Math.PI / 4;
    ctx.save();
    ctx.rotate(a);
    leafPath(0, 0, s * 0.95, s * 0.15, 0);
    ctx.restore();
  }
  ctx.fillStyle = PAL.oxblood;
  for (i = 0; i < 8; i++) {
    a = (i + 0.5) * Math.PI / 4;
    ctx.save();
    ctx.rotate(a);
    leafPath(0, 0, s * 0.55, s * 0.13, 0);
    ctx.restore();
  }
  ctx.fillStyle = PAL.moss;
  circle(0, 0, s * 0.20);
  ctx.fillStyle = PAL.parchment;
  circle(0, 0, s * 0.08);
}
function motifCrescent(s) {
  ctx.fillStyle = PAL.parchment;
  crescentPath(-s * 0.12, 0, s * 0.72);
  ctx.fill();
  ctx.fillStyle = PAL.oxblood;
  diamond(s * 0.52, -s * 0.34, s * 0.20);
  ctx.fillStyle = PAL.moss;
  circle(s * 0.52, s * 0.30, s * 0.10);
}
var DAMASK_MOTIFS = [motifMedallion, motifAcorn, motifStarflower, motifCrescent];
if (DAMASK_MOTIFS.length !== 4) throw new Error('Dark Academia needs four damask motifs');

// ---- panel 1: ogee damask on plum ------------------------------
// Cell 148 x 184, columns half-dropped. The panel drifts
// down two full rows (368px) per loop: the motif parity
// (ci + ri) % 2 has vertical period two rows, so two
// rows is the smallest whole-period drift and the seam
// holds. Ogee outlines are period one row.
var DCW = 148, DCH = 184;
function ogeePath(cx, cy) {
  var hw = DCW / 2, hh = DCH / 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy - hh);
  ctx.bezierCurveTo(cx + hw * 0.85, cy - hh * 0.75, cx + hw, cy - hh * 0.20, cx + hw * 0.62, cy + hh * 0.28);
  ctx.bezierCurveTo(cx + hw * 0.42, cy + hh * 0.55, cx + hw * 0.30, cy + hh * 0.80, cx, cy + hh);
  ctx.bezierCurveTo(cx - hw * 0.30, cy + hh * 0.80, cx - hw * 0.42, cy + hh * 0.55, cx - hw * 0.62, cy + hh * 0.28);
  ctx.bezierCurveTo(cx - hw, cy - hh * 0.20, cx - hw * 0.85, cy - hh * 0.75, cx, cy - hh);
  ctx.closePath();
}
function drawDamask(pw, ph) {
  var coll = COLLECTIONS[collIdx];
  var oy = ph * DCH * 2;
  var ci, ri, x, y;
  ctx.fillStyle = PAL.plum;
  ctx.fillRect(0, 0, pw, DH);
  // ogee lattice outlines
  ctx.strokeStyle = PAL.parchment;
  ctx.lineWidth = 2;
  for (ci = -1; ci * DCW < pw + DCW; ci++) {
    var drop = (Math.abs(ci) % 2 === 1) ? DCH / 2 : 0;
    for (ri = -2; ri * DCH < DH + DCH * 2; ri++) {
      x = ci * DCW + DCW / 2;
      y = ri * DCH + drop + oy;
      if (y < -DCH || y > DH + DCH) continue;
      ogeePath(x, y);
      ctx.stroke();
    }
  }
  // motifs at cell centres, alternating by index parity
  for (ci = -1; ci * DCW < pw + DCW; ci++) {
    var drop2 = (Math.abs(ci) % 2 === 1) ? DCH / 2 : 0;
    for (ri = -2; ri * DCH < DH + DCH * 2; ri++) {
      x = ci * DCW + DCW / 2;
      y = ri * DCH + drop2 + oy;
      if (y < -DCH || y > DH + DCH) continue;
      var pick = coll.damask[((ci + ri) % 2 + 2) % 2];
      ctx.save();
      ctx.translate(x, y);
      DAMASK_MOTIFS[pick](34);
      ctx.restore();
    }
  }
  // small oxblood node diamonds at the lattice points
  ctx.fillStyle = PAL.oxblood;
  for (ci = -1; ci * DCW < pw + DCW; ci++) {
    var drop3 = (Math.abs(ci) % 2 === 1) ? DCH / 2 : 0;
    for (ri = -2; ri * DCH < DH + DCH * 2; ri++) {
      y = ri * DCH + drop3 + oy - DCH / 2;
      if (y < -20 || y > DH + 20) continue;
      diamond(ci * DCW + DCW / 2, y, 5);
    }
  }
}

// ---- panel 2: berry lattice on ink ------------------------------
// Diagonal lattice in rotated coordinates u, v with 92px
// spacing. The panel drifts one period in u AND one in v
// per loop (a 130px horizontal travel of the pattern):
// node parity (k + j) changes by two under that shift,
// so cluster and accent nodes keep their places at the
// seam and frame 40s equals frame 0.
var LSP = 92, SQ2 = Math.sqrt(2);
function berryCluster(style, x, y) {
  var i, bx, by;
  if (style === 0) {
    // round cluster of five with moss leaves
    ctx.fillStyle = PAL.moss;
    leafAt(x - 12, y - 16, 26, 8, -0.7);
    leafAt(x + 12, y - 16, 26, 8, 0.7);
    var pts = [[0, 2], [-14, -7], [14, -7], [-11, 13], [11, 13]];
    ctx.fillStyle = PAL.oxblood;
    for (i = 0; i < pts.length; i++) circle(x + pts[i][0], y + pts[i][1], 9.5);
    ctx.fillStyle = PAL.parchment;
    for (i = 0; i < pts.length; i++) circle(x + pts[i][0] - 3, y + pts[i][1] - 3, 2.2);
  } else if (style === 1) {
    // hanging bunch on a stem
    ctx.strokeStyle = PAL.moss;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y - 30);
    ctx.lineTo(x, y - 8);
    ctx.stroke();
    ctx.fillStyle = PAL.moss;
    leafAt(x + 4, y - 24, 22, 7, 0.9);
    var rows = [[0], [-9, 9], [-16, 0, 16]];
    ctx.fillStyle = PAL.oxblood;
    for (i = 0; i < rows.length; i++) {
      for (var j = 0; j < rows[i].length; j++) {
        bx = x + rows[i][j]; by = y - 2 + i * 13;
        circle(bx, by, 8.5);
      }
    }
    ctx.fillStyle = PAL.parchment;
    circle(x - 3, y - 5, 2.1);
    circle(x + 6, y + 8, 2.1);
    circle(x - 8, y + 21, 2.1);
  } else {
    // sparse: three berries and a leaf spray
    ctx.fillStyle = PAL.moss;
    leafAt(x - 4, y - 6, 30, 8, -0.5);
    leafAt(x + 8, y - 8, 30, 8, 0.45);
    leafAt(x + 2, y - 10, 34, 8, 0);
    var pts2 = [[-13, 12], [2, 17], [15, 10]];
    ctx.fillStyle = PAL.oxblood;
    for (i = 0; i < pts2.length; i++) circle(x + pts2[i][0], y + pts2[i][1], 8);
    ctx.fillStyle = PAL.parchment;
    for (i = 0; i < pts2.length; i++) circle(x + pts2[i][0] - 2.5, y + pts2[i][1] - 2.5, 2);
  }
}
function drawLattice(pw, ph) {
  var coll = COLLECTIONS[collIdx];
  var off = ph * LSP;             // one period in u and in v
  var k, j, u, v, x, y, C;
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(0, 0, pw, DH);
  ctx.strokeStyle = PAL.moss;
  ctx.lineWidth = 3;
  ctx.beginPath();
  // family u = const: lines x + y = C
  for (k = -2; k <= 14; k++) {
    C = (k * LSP + off) * SQ2;
    ctx.moveTo(C + 1100, -1100);
    ctx.lineTo(C - 2000, 2000);
  }
  // family v = const: lines x - y = C
  for (j = -12; j <= 8; j++) {
    C = (j * LSP + off) * SQ2;
    ctx.moveTo(-1100, -1100 - C);
    ctx.lineTo(1700, 1700 - C);
  }
  ctx.stroke();
  // nodes: clusters on even parity, accents on odd
  for (k = -2; k <= 14; k++) {
    for (j = -12; j <= 8; j++) {
      u = k * LSP + off;
      v = j * LSP + off;
      x = (u + v) / SQ2;
      y = (u - v) / SQ2;
      if (x < -50 || x > pw + 50 || y < -50 || y > DH + 50) continue;
      if (((k + j) % 2 + 2) % 2 === 0) {
        berryCluster(coll.lattice, x, y);
      } else {
        ctx.fillStyle = PAL.moss;
        diamond(x, y, 5.5);
        ctx.fillStyle = PAL.parchment;
        circle(x, y, 1.8);
      }
    }
  }
}

// ---- panel 3: Delft-style tiles on parchment ----------------------
// Square tiles of 142px. The panel drifts up one tile
// per loop: the vignette hash (ri * 3 + ci) has period
// two rows (3 * 2 = 6 = the library size), so a one-row
// shift at the wrap shows the identical tile and the
// seam holds.
var TILE = 142;
function vigMoth(a, b, s) {
  // wings as two ellipse pairs around a body
  ctx.fillStyle = a;
  ctx.beginPath(); ctx.ellipse(-s * 0.34, -s * 0.18, s * 0.36, s * 0.20, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.34, -s * 0.18, s * 0.36, s * 0.20, 0.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-s * 0.28, s * 0.28, s * 0.27, s * 0.16, 0.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.28, s * 0.28, s * 0.27, s * 0.16, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = b;
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.13, s * 0.48, 0, 0, Math.PI * 2); ctx.fill();
  circle(0, -s * 0.55, s * 0.13);
  ctx.strokeStyle = b;
  ctx.lineWidth = s * 0.06;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-s * 0.06, -s * 0.62); ctx.quadraticCurveTo(-s * 0.30, -s * 0.95, -s * 0.52, -s * 0.92); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s * 0.06, -s * 0.62); ctx.quadraticCurveTo(s * 0.30, -s * 0.95, s * 0.52, -s * 0.92); ctx.stroke();
  ctx.fillStyle = a;
  circle(-s * 0.36, -s * 0.20, s * 0.07);
  circle(s * 0.36, -s * 0.20, s * 0.07);
}
function vigBerry(a, b, s) {
  ctx.strokeStyle = b;
  ctx.lineWidth = s * 0.08;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, s * 0.85);
  ctx.quadraticCurveTo(s * 0.10, 0, -s * 0.05, -s * 0.55);
  ctx.stroke();
  ctx.fillStyle = b;
  leafAt(-s * 0.18, s * 0.28, s * 0.62, s * 0.20, -0.8);
  leafAt(s * 0.22, s * 0.05, s * 0.58, s * 0.19, 0.85);
  var pts = [[-s * 0.22, -s * 0.30], [s * 0.14, -s * 0.42], [0, -s * 0.08], [-s * 0.05, -s * 0.62]];
  ctx.fillStyle = a;
  for (var i = 0; i < pts.length; i++) circle(pts[i][0], pts[i][1], s * 0.17);
}
function vigTulip(a, b, s) {
  ctx.strokeStyle = b;
  ctx.lineWidth = s * 0.08;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, s * 0.88);
  ctx.lineTo(0, -s * 0.05);
  ctx.stroke();
  ctx.fillStyle = b;
  leafAt(-s * 0.05, s * 0.45, s * 0.66, s * 0.20, -0.75);
  ctx.fillStyle = a;
  ctx.beginPath();
  ctx.moveTo(-s * 0.34, -s * 0.55);
  ctx.lineTo(-s * 0.13, -s * 0.22);
  ctx.lineTo(0, -s * 0.62);
  ctx.lineTo(s * 0.13, -s * 0.22);
  ctx.lineTo(s * 0.34, -s * 0.55);
  ctx.quadraticCurveTo(s * 0.30, s * 0.05, 0, s * 0.02);
  ctx.quadraticCurveTo(-s * 0.30, s * 0.05, -s * 0.34, -s * 0.55);
  ctx.closePath();
  ctx.fill();
}
function vigMoon(a, b, s) {
  ctx.fillStyle = a;
  crescentPath(-s * 0.10, -s * 0.05, s * 0.62);
  ctx.fill();
  ctx.fillStyle = b;
  diamond(s * 0.45, -s * 0.38, s * 0.17);
  circle(s * 0.48, s * 0.28, s * 0.08);
  circle(-s * 0.42, s * 0.52, s * 0.06);
}
function vigAcorn(a, b, s) {
  ctx.fillStyle = b;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.68);
  ctx.quadraticCurveTo(s * 0.44, s * 0.08, s * 0.35, -s * 0.24);
  ctx.lineTo(-s * 0.35, -s * 0.24);
  ctx.quadraticCurveTo(-s * 0.44, s * 0.08, 0, s * 0.68);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = a;
  ctx.beginPath();
  ctx.arc(0, -s * 0.24, s * 0.39, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(-s * 0.05, -s * 0.82, s * 0.10, s * 0.20);
  ctx.fillStyle = b;
  leafAt(s * 0.30, -s * 0.55, s * 0.55, s * 0.17, 0.9);
}
function vigStar(a, b, s) {
  ctx.fillStyle = a;
  for (var i = 0; i < 6; i++) {
    ctx.save();
    ctx.rotate(i * Math.PI / 3);
    leafPath(0, 0, s * 0.78, s * 0.17, 0);
    ctx.restore();
  }
  ctx.fillStyle = b;
  circle(0, 0, s * 0.20);
  ctx.fillStyle = PAL.parchment;
  circle(0, 0, s * 0.08);
}
var VIGNETTES = [vigMoth, vigBerry, vigTulip, vigMoon, vigAcorn, vigStar];
if (VIGNETTES.length !== 6) throw new Error('Dark Academia needs six tile vignettes');
var SCHEMES = [
  [PAL.plum, PAL.oxblood],
  [PAL.ink, PAL.moss],
  [PAL.oxblood, PAL.plum],
  [PAL.moss, PAL.ink]
];
function drawTiles(pw, ph) {
  var coll = COLLECTIONS[collIdx];
  var oy = -ph * TILE;
  var ci, ri, x, y, hash, sch;
  ctx.fillStyle = PAL.parchment;
  ctx.fillRect(0, 0, pw, DH);
  for (ci = -1; ci * TILE < pw + TILE; ci++) {
    for (ri = -1; ri * TILE < DH + TILE * 2; ri++) {
      x = ci * TILE;
      y = ri * TILE + oy;
      if (y < -TILE || y > DH + TILE) continue;
      // grout and inner border
      ctx.strokeStyle = PAL.ink;
      ctx.lineWidth = 3;
      ctx.strokeRect(x + 1.5, y + 1.5, TILE - 3, TILE - 3);
      ctx.strokeStyle = PAL.plum;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 10, y + 10, TILE - 20, TILE - 20);
      // corner flourishes
      ctx.strokeStyle = PAL.oxblood;
      ctx.lineWidth = 2;
      var f = 16, inset = 15;
      ctx.beginPath(); ctx.arc(x + inset, y + inset, f, 0, Math.PI / 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + TILE - inset, y + inset, f, Math.PI / 2, Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + TILE - inset, y + TILE - inset, f, Math.PI, Math.PI * 1.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + inset, y + TILE - inset, f, Math.PI * 1.5, Math.PI * 2); ctx.stroke();
      // vignette from the fixed table, rotated by collection
      hash = ((ri * 3 + ci) % 6 + 6) % 6;
      sch = SCHEMES[((hash + coll.tileShift) % 4 + 4) % 4];
      ctx.save();
      ctx.translate(x + TILE / 2, y + TILE / 2);
      VIGNETTES[(hash + coll.tileShift) % 6](sch[0], sch[1], 34);
      ctx.restore();
    }
  }
}

// ---- drawing ---------------------------------------------------
function draw(t) {
  var ph = (t % LOOP) / LOOP;
  var b1 = DW / 3, b2 = 2 * DW / 3;
  // panel grounds first
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(0, 0, DW, DH);
  // panel 1: damask
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, b1, DH); ctx.clip();
  drawDamask(b1, ph);
  ctx.restore();
  // panel 2: lattice
  ctx.save();
  ctx.beginPath(); ctx.rect(b1, 0, b2 - b1, DH); ctx.clip();
  ctx.translate(b1, 0);
  drawLattice(b2 - b1, ph);
  ctx.restore();
  // panel 3: tiles
  ctx.save();
  ctx.beginPath(); ctx.rect(b2, 0, DW - b2, DH); ctx.clip();
  ctx.translate(b2, 0);
  drawTiles(DW - b2, ph);
  ctx.restore();
  // hairline parchment dividers
  ctx.fillStyle = PAL.parchment;
  ctx.fillRect(b1 - 1.5, 0, 3, DH);
  ctx.fillRect(b2 - 1.5, 0, 3, DH);
}

// ---- interaction: double-tap advances the collection -----------
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
var downAt = null, downXY = null, lastTapMs = -10000;
canvas.addEventListener('pointerdown', function (e) {
  downAt = Date.now();
  downXY = toDesign(e);
});
canvas.addEventListener('pointerup', function (e) {
  if (downAt === null || !downXY) return;
  var p = toDesign(e);
  var moved = Math.abs(p[0] - downXY[0]) + Math.abs(p[1] - downXY[1]);
  var now = Date.now();
  if (moved < 14 && now - downAt < 400) {
    if (now - lastTapMs < 350) {
      collIdx = (collIdx + 1) % COLLECTIONS.length;
      lastTapMs = -10000;
    } else {
      lastTapMs = now;
    }
  }
  downAt = null; downXY = null;
});
canvas.addEventListener('pointercancel', function () { downAt = null; downXY = null; });

// ---- sizing: full-bleed field, cover-fit -------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame -------------------------------------------------------
var lastNow = -1, acc = 0;
function frame(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && now > 0) dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
