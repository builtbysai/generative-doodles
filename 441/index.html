<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pomegranate Crown</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#2E2E96; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  // deterministic PRNG (mulberry32, fixed seed) — all authored data derives from this
  function RNG(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // paper grain field (data, drawn directly each frame)
  var grain = [];
  (function () {
    var r = RNG(441001);
    for (var i = 0; i < 1100; i++) {
      grain.push({ x: r(), y: r(), s: 0.6 + r() * 1.5, a: 0.03 + r() * 0.07, lite: r() > 0.5 });
    }
  })();

  // pomegranate seeds inside the split (local unit-disk coords)
  var pgSeeds = [];
  (function () {
    var r = RNG(441002), guard = 0;
    while (pgSeeds.length < 52 && guard++ < 800) {
      var u = r() * 2 - 1, v = r() * 2 - 1;
      if (u * u + v * v > 0.86) continue;
      pgSeeds.push({ u: u, v: v, sc: 0.78 + r() * 0.5, rot: r() * Math.PI, ph: r() * Math.PI * 2 });
    }
    pgSeeds.sort(function (a, b) { return a.v - b.v; });
  })();

  // fig face speckles (local unit-disk coords)
  var figSpecks = [];
  (function () {
    var r = RNG(441003), guard = 0;
    while (figSpecks.length < 110 && guard++ < 900) {
      var u = r() * 2 - 1, v = r() * 2 - 1;
      if (u * u + v * v > 0.9) continue;
      figSpecks.push({ u: u, v: v, s: 0.5 + r() * 0.9 });
    }
  })();

  // citrus glints: two per segment (segment index, radial frac, angular frac)
  var citGlints = [];
  (function () {
    var r = RNG(441004);
    for (var i = 0; i < 8; i++) for (var k = 0; k < 2; k++) {
      citGlints.push({ seg: i, rad: 0.3 + r() * 0.55, ang: 0.25 + r() * 0.5, s: 0.6 + r() * 0.8 });
    }
  })();

  // dust motes: lissajous parameters
  var motes = [
    { ax: 0.36, ay: 0.30, wx: 0.21, wy: 0.16, px: 0.4, py: 1.7, r: 0.016, a: 0.16 },
    { ax: 0.30, ay: 0.38, wx: 0.14, wy: 0.23, px: 2.6, py: 0.2, r: 0.011, a: 0.12 },
    { ax: 0.42, ay: 0.24, wx: 0.17, wy: 0.12, px: 4.4, py: 3.1, r: 0.020, a: 0.10 },
    { ax: 0.24, ay: 0.34, wx: 0.26, wy: 0.19, px: 5.5, py: 4.6, r: 0.009, a: 0.18 }
  ];

  var FRUITS = ['pomegranate', 'fig', 'persimmon', 'citrus'];
  var fruitIndex = 0;              // fixed authored table, index 0 at load
  var userLight = -2.25;           // drag-set light angle (upper left at load)
  var PHASE0 = 1.5;                // constant first-frame loop phase (seconds)

  function fruitCenter() { return { x: W / 2, y: H * 0.55 }; }

  // ---- shared gloss grammar ----
  function bodyClip(cx, cy, R) {
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.995, 0, Math.PI * 2); ctx.clip();
  }
  function glossBand(cx, cy, R, la) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(la + Math.PI / 2);
    var g = ctx.createLinearGradient(0, -R * 0.62, 0, R * 0.62);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.10)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(-R * 0.18, 0, R * 1.0, R * 0.30, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function specular(cx, cy, R, la, lx, ly) {
    // giant soft specular centred on the light side, anisotropic along the tangent
    var px = cx + lx * R * 0.48, py = cy + ly * R * 0.48;
    ctx.save();
    ctx.translate(px, py); ctx.rotate(la + Math.PI / 2); ctx.scale(1, 0.55);
    var g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.42);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.55)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // smaller hot core, offset further toward the light
    var qx = cx + lx * R * 0.66 - ly * R * 0.14, qy = cy + ly * R * 0.66 + lx * R * 0.14;
    ctx.save();
    ctx.translate(qx, qy); ctx.rotate(la + Math.PI / 2); ctx.scale(1, 0.6);
    var g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.17);
    g2.addColorStop(0, 'rgba(255,255,255,0.98)');
    g2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(0, 0, R * 0.17, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function rimLight(cx, cy, R, la, col) {
    var ra = la + Math.PI; // rim sits on the edge away from the key light
    ctx.save();
    ctx.strokeStyle = col; ctx.globalAlpha = 0.22; ctx.lineWidth = R * 0.055;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.985, ra - 0.75, ra + 0.75); ctx.stroke();
    ctx.globalAlpha = 0.8; ctx.lineWidth = R * 0.016;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.995, ra - 0.62, ra + 0.62); ctx.stroke();
    ctx.restore();
  }
  function finishGloss(cx, cy, R, la, lx, ly, rimCol) {
    ctx.save(); bodyClip(cx, cy, R);
    glossBand(cx, cy, R, la);
    specular(cx, cy, R, la, lx, ly);
    ctx.restore();
    rimLight(cx, cy, R, la, rimCol);
  }

  // ---- fruits ----
  function drawPomegranate(cx, cy, R, t, la, lx, ly) {
    var gx = cx + lx * R * 0.35, gy = cy + ly * R * 0.35;
    var g = ctx.createRadialGradient(gx, gy, R * 0.1, cx, cy, R * 1.05);
    g.addColorStop(0, '#B23347'); g.addColorStop(0.55, '#8A1F2D'); g.addColorStop(1, '#57101D');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 1.03, 0, 0, Math.PI * 2); ctx.fill();

    // crown (calyx): six spikes fanning up from the top of the fruit
    var tx = cx, ty = cy - R * 1.0;
    ctx.fillStyle = '#6E1622';
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = -Math.PI / 2 + (i - 2.5) * 0.30;
      var bx = tx + Math.cos(a + 0.14) * R * 0.10, by = ty + Math.sin(a + 0.14) * R * 0.06;
      var tipx = tx + Math.cos(a) * R * 0.24, tipy = ty + Math.sin(a) * R * 0.24;
      var bx2 = tx + Math.cos(a - 0.14) * R * 0.10, by2 = ty + Math.sin(a - 0.14) * R * 0.06;
      ctx.moveTo(bx, by); ctx.lineTo(tipx, tipy); ctx.lineTo(bx2, by2);
    }
    ctx.fill();
    ctx.fillStyle = '#8A1F2D';
    ctx.beginPath(); ctx.ellipse(tx, ty + R * 0.02, R * 0.10, R * 0.06, 0, 0, Math.PI * 2); ctx.fill();

    // the split: pith ellipse, membrane lines, ruby seeds
    var ocx = cx + R * 0.10, ocy = cy - R * 0.24, oa = R * 0.60, ob = R * 0.44, orot = -0.38;
    ctx.save();
    ctx.translate(ocx, ocy); ctx.rotate(orot);
    var pg = ctx.createRadialGradient(-oa * 0.2, -ob * 0.25, ob * 0.2, 0, 0, oa);
    pg.addColorStop(0, '#F3D9C8'); pg.addColorStop(0.7, '#EFC3BC'); pg.addColorStop(1, '#E8B4B8');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(0, 0, oa, ob, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(243,217,200,0.65)'; ctx.lineWidth = R * 0.018;
    for (var m = 0; m < 5; m++) {
      var ma = -2.5 + m * 1.25;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(Math.cos(ma) * oa * 0.5, Math.sin(ma) * ob * 0.5, Math.cos(ma) * oa * 0.97, Math.sin(ma) * ob * 0.97);
      ctx.stroke();
    }
    // seeds (pulse faintly, glints toward the light; light dir in local frame)
    var lxl = lx * Math.cos(-orot) - ly * Math.sin(-orot);
    var lyl = lx * Math.sin(-orot) + ly * Math.cos(-orot);
    for (var s = 0; s < pgSeeds.length; s++) {
      var sd = pgSeeds[s];
      var sx = sd.u * oa * 0.92, sy = sd.v * ob * 0.92;
      var sr = R * 0.088 * sd.sc * (1 + 0.055 * Math.sin(t * 2.1 + sd.ph));
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(sd.rot);
      ctx.fillStyle = '#8F0E33';
      ctx.beginPath(); ctx.ellipse(lxl * sr * 0.18, lyl * sr * 0.18 + sr * 0.14, sr, sr * 0.82, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#B3123F';
      ctx.beginPath(); ctx.ellipse(0, 0, sr, sr * 0.82, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FF6B8A';
      ctx.beginPath(); ctx.arc(lxl * sr * 0.38, lyl * sr * 0.38 - sr * 0.1, sr * 0.30, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(lxl * sr * 0.45, lyl * sr * 0.45 - sr * 0.16, sr * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // split edge: pale lip on the light side, dark rind lip below
    ctx.strokeStyle = '#E8B4B8'; ctx.lineWidth = R * 0.045;
    ctx.beginPath(); ctx.ellipse(0, 0, oa, ob, 0, la - orot - 0.9, la - orot + 0.9); ctx.stroke();
    ctx.strokeStyle = '#7E1B29'; ctx.lineWidth = R * 0.07;
    ctx.beginPath(); ctx.ellipse(0, 0, oa, ob, 0, Math.PI * 0.25, Math.PI * 0.8); ctx.stroke();
    ctx.restore();

    finishGloss(cx, cy, R, la, lx, ly, '#7FA8E0');
  }

  function drawFig(cx, cy, R, t, la, lx, ly) {
    var gx = cx + lx * R * 0.3, gy = cy + ly * R * 0.3;
    var g = ctx.createRadialGradient(gx, gy, R * 0.1, cx, cy, R * 1.15);
    g.addColorStop(0, '#5B2A6E'); g.addColorStop(0.6, '#4A2358'); g.addColorStop(1, '#2C1038');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx, cy - R * 1.02);
    ctx.bezierCurveTo(cx + R * 0.52, cy - R * 0.92, cx + R * 0.95, cy - R * 0.28, cx + R * 0.92, cy + R * 0.28);
    ctx.bezierCurveTo(cx + R * 0.88, cy + R * 0.82, cx + R * 0.45, cy + R * 1.0, cx, cy + R * 1.0);
    ctx.bezierCurveTo(cx - R * 0.45, cy + R * 1.0, cx - R * 0.88, cy + R * 0.82, cx - R * 0.92, cy + R * 0.28);
    ctx.bezierCurveTo(cx - R * 0.95, cy - R * 0.28, cx - R * 0.52, cy - R * 0.92, cx, cy - R * 1.02);
    ctx.fill();
    ctx.fillStyle = '#3A1A44';
    ctx.beginPath(); ctx.ellipse(cx, cy - R * 1.03, R * 0.07, R * 0.09, 0, 0, Math.PI * 2); ctx.fill();
    // cut face: rose interior with cream speckles
    var fg = ctx.createRadialGradient(cx - R * 0.1, cy - R * 0.05, R * 0.08, cx, cy + R * 0.08, R * 0.8);
    fg.addColorStop(0, '#E8A9B8'); fg.addColorStop(0.45, '#D77E96'); fg.addColorStop(1, '#A83A5C');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.ellipse(cx, cy + R * 0.08, R * 0.60, R * 0.76, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(250,238,220,0.85)';
    for (var i = 0; i < figSpecks.length; i++) {
      var sp = figSpecks[i];
      ctx.beginPath(); ctx.arc(cx + sp.u * R * 0.55, cy + R * 0.08 + sp.v * R * 0.70, R * 0.011 * sp.s + R * 0.004, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(74,35,88,0.5)'; ctx.lineWidth = R * 0.03;
    ctx.beginPath(); ctx.ellipse(cx, cy + R * 0.08, R * 0.60, R * 0.76, 0, 0, Math.PI * 2); ctx.stroke();
    finishGloss(cx, cy, R, la, lx, ly, '#7FA8E0');
  }

  function drawPersimmon(cx, cy, R, t, la, lx, ly) {
    var gx = cx + lx * R * 0.35, gy = cy + ly * R * 0.3 - R * 0.1;
    var g = ctx.createRadialGradient(gx, gy, R * 0.1, cx, cy, R * 1.05);
    g.addColorStop(0, '#F08A3C'); g.addColorStop(0.55, '#D9622B'); g.addColorStop(1, '#8A3408');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 0.88, 0, 0, Math.PI * 2); ctx.fill();
    // faint vertical lobes
    ctx.strokeStyle = 'rgba(138,52,8,0.35)'; ctx.lineWidth = R * 0.02;
    for (var i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * R * 0.45, cy - R * 0.82);
      ctx.quadraticCurveTo(cx + i * R * 0.58, cy, cx + i * R * 0.45, cy + R * 0.82);
      ctx.stroke();
    }
    // four-lobed calyx
    ctx.fillStyle = '#6B4A2E';
    for (var k = 0; k < 4; k++) {
      var a = k * Math.PI / 2 + 0.4;
      ctx.save();
      ctx.translate(cx + Math.cos(a) * R * 0.17, cy - R * 0.86 + Math.sin(a) * R * 0.07);
      ctx.rotate(a + Math.PI / 2);
      ctx.beginPath(); ctx.ellipse(0, 0, R * 0.10, R * 0.19, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#7A5636';
    ctx.beginPath(); ctx.ellipse(cx, cy - R * 0.86, R * 0.13, R * 0.075, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4A2E1A';
    ctx.beginPath(); ctx.arc(cx, cy - R * 0.87, R * 0.035, 0, Math.PI * 2); ctx.fill();
    finishGloss(cx, cy, R, la, lx, ly, '#7FA8E0');
  }

  function drawCitrus(cx, cy, R, t, la, lx, ly) {
    var g = ctx.createRadialGradient(cx + lx * R * 0.3, cy + ly * R * 0.3, R * 0.15, cx, cy, R);
    g.addColorStop(0, '#F09A34'); g.addColorStop(1, '#D97416');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#F7E8C8';
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.93, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#F2A33C';
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.87, 0, Math.PI * 2); ctx.fill();
    // eight segment wedges
    for (var i = 0; i < 8; i++) {
      var a0 = i * Math.PI / 4 + 0.045, a1 = (i + 1) * Math.PI / 4 - 0.045;
      var wg = ctx.createRadialGradient(cx, cy, R * 0.06, cx, cy, R * 0.85);
      wg.addColorStop(0, i % 2 ? '#F8BC5E' : '#F6AC44');
      wg.addColorStop(1, i % 2 ? '#EE9426' : '#F09A34');
      ctx.fillStyle = wg;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R * 0.84, a0, a1);
      ctx.closePath(); ctx.fill();
    }
    // segment glints
    for (var j = 0; j < citGlints.length; j++) {
      var gl = citGlints[j];
      var ga = (gl.seg + gl.ang) * Math.PI / 4;
      var grr = gl.rad * R * 0.84;
      ctx.fillStyle = 'rgba(255,243,208,' + (0.5 + 0.2 * Math.sin(t * 1.7 + j)) + ')';
      ctx.beginPath(); ctx.arc(cx + Math.cos(ga) * grr, cy + Math.sin(ga) * grr, R * 0.016 * gl.s + 1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#F7E8C8';
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.05, 0, Math.PI * 2); ctx.fill();
    finishGloss(cx, cy, R, la, lx, ly, '#7FA8E0');
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // ground: deep indigo with a soft central lift and paper grain
    ctx.fillStyle = '#2E2E96';
    ctx.fillRect(0, 0, W, H);
    var vg = ctx.createRadialGradient(W / 2, H * 0.52, 0, W / 2, H * 0.52, Math.max(W, H) * 0.72);
    vg.addColorStop(0, 'rgba(110,110,220,0.20)');
    vg.addColorStop(1, 'rgba(10,10,50,0.28)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < grain.length; i++) {
      var p = grain[i];
      ctx.fillStyle = p.lite ? 'rgba(255,255,255,' + p.a + ')' : 'rgba(8,8,48,' + p.a + ')';
      ctx.fillRect(p.x * W, p.y * H, p.s, p.s);
    }

    var c = fruitCenter();
    var S = Math.min(W, H);
    var R = S * 0.275;
    // light: drag-set base angle plus a seamless 6s travel sway
    var la = userLight + 0.9 * Math.sin((t % 6) / 6 * Math.PI * 2);
    var lx = Math.cos(la), ly = Math.sin(la);

    var name = FRUITS[fruitIndex];
    if (name === 'pomegranate') drawPomegranate(c.x, c.y, R, t, la, lx, ly);
    else if (name === 'fig') drawFig(c.x, c.y, R, t, la, lx, ly);
    else if (name === 'persimmon') drawPersimmon(c.x, c.y, R, t, la, lx, ly);
    else drawCitrus(c.x, c.y, R, t, la, lx, ly);

    // dust motes drift over the still life
    for (var m = 0; m < motes.length; m++) {
      var mo = motes[m];
      var mx = c.x + Math.sin(t * mo.wx + mo.px) * S * mo.ax;
      var my = c.y + Math.sin(t * mo.wy + mo.py) * S * mo.ay;
      var mr = mo.r * S + 2;
      var mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr);
      mg.addColorStop(0, 'rgba(255,244,220,' + mo.a + ')');
      mg.addColorStop(1, 'rgba(255,244,220,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
    }
  }

  // interaction: drag rotates the light; double-tap deals the next fruit
  var dragging = false, downX = 0, downY = 0, moved = false, lastTapAt = 0;
  function pointerAngle(e) {
    if (typeof canvas.getBoundingClientRect !== 'function') return null;
    var r = canvas.getBoundingClientRect();
    var c = fruitCenter();
    return Math.atan2((e.clientY - r.top) - c.y, (e.clientX - r.left) - c.x);
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; moved = false; downX = e.clientX; downY = e.clientY;
    var a = pointerAngle(e); if (a !== null) userLight = a - 0.9 * Math.sin((currentT % 6) / 6 * Math.PI * 2);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 6) moved = true;
    var a = pointerAngle(e); if (a !== null) userLight = a - 0.9 * Math.sin((currentT % 6) / 6 * Math.PI * 2);
  });
  canvas.addEventListener('pointerup', function () {
    dragging = false;
    if (moved) return;
    var now = Date.now();
    if (now - lastTapAt < 350) { fruitIndex = (fruitIndex + 1) % FRUITS.length; lastTapAt = 0; }
    else lastTapAt = now;
  });
  canvas.addEventListener('pointercancel', function () { dragging = false; });

  var currentT = PHASE0;
  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    var loop = function (now) {
      currentT = PHASE0 + (now - start) / 1000;
      draw(currentT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
