<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.231 Burning Year</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0A0A0A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.231 Burning Year (Matthew Kluber). After his 2025 piece of
// that name, a 3D printed PLA relief driven by custom software:
// a square field of twenty four by twenty four cells, each split
// into four triangles, coloured in hard stepped bands running
// cool to warm along the diagonal, neon green through yellow and
// orange to deep red. Cells alternate peak and valley, so the
// field reads as a faceted relief. The relief never changes
// shape. Only the light moves: a slow sun orbits over ninety
// seconds, shading every facet by its normal and dragging a
// specular streak and one warm highlight across the field.
// Razor sharp edges, no bloom, no glow. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0A0A0A';
var W = 0, H = 0, phone = false;
var T = 21, lastNow = -1; // frame one: sun off-axis, facets unevenly lit

function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// ---- colour ramp: four palette stops stepped into fourteen hard bands -----------
var STOPS = [[57, 255, 90], [255, 230, 0], [255, 106, 0], [193, 18, 31]];
var RAMP = [];
(function () {
  for (var k = 0; k < 14; k++) {
    var tt = k / 13 * 3;
    var seg = Math.min(2, Math.floor(tt));
    var f = tt - seg;
    var a = STOPS[seg], b = STOPS[seg + 1];
    RAMP.push([Math.round(a[0] + (b[0] - a[0]) * f),
               Math.round(a[1] + (b[1] - a[1]) * f),
               Math.round(a[2] + (b[2] - a[2]) * f)]);
  }
})();

// ---- the relief: 24x24 cells, 4 triangles each, colours and normals precomputed ---
var N = 24;
var cells = [];
(function () {
  var rand = rng(231864);
  for (var j = 0; j < N; j++) {
    for (var i = 0; i < N; i++) {
      var d = (i + j) / (2 * (N - 1));
      var dj = clamp(d + (rand() - 0.5) * 0.055, 0, 0.999);
      var col = RAMP[Math.floor(dj * 14)];
      var valley = ((i + j) % 2 === 1);
      var k = valley ? -0.9 : 0.9;
      var jx = (rand() - 0.5) * 0.22, jy = (rand() - 0.5) * 0.22;
      // triangle order: 0 top, 1 right, 2 bottom, 3 left (centre apex to each edge)
      var raw = [[jx, -k + jy, 1], [k + jx, jy, 1], [jx, k + jy, 1], [-k + jx, jy, 1]];
      var normals = [];
      for (var q = 0; q < 4; q++) {
        var n = raw[q], len = Math.hypot(n[0], n[1], n[2]);
        normals.push([n[0] / len, n[1] / len, n[2] / len]);
      }
      cells.push({ i: i, j: j, col: col, normals: normals });
    }
  }
})();

function panel() {
  var s = Math.min(W, H) * (phone ? 0.98 : 0.94);
  return { x: (W - s) / 2, y: (H - s) / 2, s: s };
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var p = panel();
  var cs = p.s / N;
  // the sun: azimuth orbits on a 90s clock
  var th = 2 * Math.PI * T / 90;
  var lx = 0.78 * Math.cos(th), ly = 0.78 * Math.sin(th), lz = 0.62;
  var ll = Math.hypot(lx, ly, lz);
  lx /= ll; ly /= ll; lz /= ll;
  // halfway vector toward the viewer for the specular glints
  var hx = lx, hy = ly, hz = lz + 1;
  var hl = Math.hypot(hx, hy, hz);
  hx /= hl; hy /= hl; hz /= hl;
  for (var c = 0; c < cells.length; c++) {
    var cell = cells[c];
    var x0 = p.x + cell.i * cs, y0 = p.y + cell.j * cs;
    var cxp = x0 + cs / 2, cyp = y0 + cs / 2;
    var px = [x0, x0 + cs, x0 + cs, x0];
    var py = [y0, y0, y0 + cs, y0 + cs];
    var base = cell.col;
    for (var q = 0; q < 4; q++) {
      var n = cell.normals[q];
      var diff = n[0] * lx + n[1] * ly + n[2] * lz;
      var b = clamp(0.55 + 0.62 * diff, 0.18, 1.3);
      var dh = n[0] * hx + n[1] * hy + n[2] * hz;
      var sp = dh > 0 ? Math.pow(dh, 10) * 0.45 : 0;
      var r = clamp(Math.round(base[0] * b + sp * 255), 0, 255);
      var g = clamp(Math.round(base[1] * b + sp * 240), 0, 255);
      var bl = clamp(Math.round(base[2] * b + sp * 210), 0, 255);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + bl + ')';
      ctx.beginPath();
      ctx.moveTo(cxp, cyp);
      ctx.lineTo(px[q], py[q]);
      ctx.lineTo(px[(q + 1) % 4], py[(q + 1) % 4]);
      ctx.closePath();
      ctx.fill();
    }
  }
  // one warm highlight layer riding with the sun, additive and quiet
  var ox = Math.cos(th) * p.s * 0.22, oy = Math.sin(th) * p.s * 0.22;
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, p.y, p.s, p.s); ctx.clip();
  ctx.translate(p.x + p.s / 2 + ox, p.y + p.s / 2 + oy);
  ctx.rotate(th);
  var bw = p.s * 0.5;
  var g2 = ctx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
  g2.addColorStop(0, 'rgba(255,214,150,0)');
  g2.addColorStop(0.5, 'rgba(255,214,150,0.07)');
  g2.addColorStop(1, 'rgba(255,214,150,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g2;
  ctx.fillRect(-bw / 2, -p.s, bw, p.s * 2);
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only, the light does the moving.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
