<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herringbone Garden</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #E8DFD2; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- Palette (strict) ----
  var PAPER  = [232, 223, 210]; // #E8DFD2
  var FIBER  = [201, 191, 174]; // #C9BFAE
  var SHADOW = [138, 126, 110]; // #8A7E6E
  var RED    = [166,  58,  46]; // #A63A2E

  // ---- Seeded RNG (mulberry32, fixed seed) ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var SEED = 601073;

  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function css(c, alpha) {
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + alpha + ')';
  }
  // Shade a facet by its 2D normal against the light azimuth.
  // d in [-1,1]: -1 faces fully away (deep shadow), +1 faces the light (paper bright).
  function facetColor(nx, ny, lx, ly, strength) {
    var d = (nx * lx + ny * ly) * (strength || 1);
    if (d >= 0) return mix(FIBER, PAPER, 0.35 + 0.65 * d);
    return mix(FIBER, SHADOW, Math.min(1, -d * 0.95));
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, isPhone = false;
  var facets = [];   // {pts:[[x,y]...], nx, ny} herringbone + groove handled separately
  var groove = null; // block rect
  var organics = []; // {outline:[[x,y]...], fans:[{pts,nx,ny}]}
  var speckles = []; // {x,y,r,a}
  var strokes = [];  // {x,y,len,ang,a}
  var smudge = [];   // {x,y,rx,ry,a}
  var smudgePos = null;

  function build() {
    var rng = mulberry32(SEED);
    facets = []; organics = []; speckles = []; strokes = []; smudge = [];
    var S = Math.min(W, H);

    // ---- Herringbone block: centered, ~60% of frame width ----
    var bw = W * 0.60, bh = H * 0.58;
    var bx = (W - bw) / 2, by = (H - bh) / 2;
    groove = { x: bx, y: by, w: bw, h: bh };

    // Basketweave-of-pairs herringbone: cells of 2u x 2u; a cell holds two
    // horizontal planks or two vertical planks, alternating by (i+j) parity.
    // Each plank is split along its long axis into two bevel facets whose
    // normals tilt to opposite sides, so raking light picks one side up and
    // drops the other. Planks are inset slightly so grooves read as depth.
    var u = bw / 14; // 7 cells across
    var rows = Math.max(2, Math.round(bh / (2 * u)));
    var cellH = bh / rows, cellW = 2 * u;
    var inset = Math.max(0.6, u * 0.06);
    for (var j = 0; j < rows; j++) {
      for (var i = 0; i < 7; i++) {
        var cx = bx + i * cellW, cy = by + j * cellH;
        var horiz = ((i + j) % 2 === 0);
        for (var k = 0; k < 2; k++) {
          var px, py, pw, ph, na;
          if (horiz) {
            px = cx + inset; pw = cellW - 2 * inset;
            py = cy + k * (cellH / 2) + inset; ph = cellH / 2 - 2 * inset;
            na = Math.PI / 2; // normal tilts in +/- y
          } else {
            px = cx + k * (cellW / 2) + inset; pw = cellW / 2 - 2 * inset;
            py = cy + inset; ph = cellH - 2 * inset;
            na = 0; // normal tilts in +/- x
          }
          // two bevel facets along the long axis
          for (var s = 0; s < 2; s++) {
            var pts, nx, ny, sgn = (s === 0 ? -1 : 1);
            if (horiz) {
              var y0 = py + (ph / 2) * s, y1 = py + (ph / 2) * (s + 1);
              pts = [[px, y0], [px + pw, y0], [px + pw, y1], [px, y1]];
              nx = 0; ny = sgn * 0.66;
            } else {
              var x0 = px + (pw / 2) * s, x1 = px + (pw / 2) * (s + 1);
              pts = [[x0, py], [x1, py], [x1, py + ph], [x0, py + ph]];
              nx = sgn * 0.66; ny = 0;
            }
            facets.push({ pts: pts, nx: nx, ny: ny });
          }
        }
      }
    }

    // ---- Organic relief forms: teardrop / leaf / circle ----
    // Fixed hand-placed anchor layout (normalized), orbiting the block and
    // a few overlapping its edge. Radii and blob character are seeded.
    var anchors = [
      [0.085, 0.16, 'teardrop'], [0.115, 0.46, 'leaf'], [0.075, 0.76, 'circle'],
      [0.155, 0.90, 'teardrop'], [0.36, 0.085, 'circle'], [0.60, 0.075, 'leaf'],
      [0.885, 0.13, 'leaf'], [0.915, 0.44, 'teardrop'], [0.875, 0.72, 'circle'],
      [0.80, 0.905, 'teardrop'], [0.42, 0.925, 'circle'], [0.235, 0.315, 'leaf'],
      [0.765, 0.335, 'circle'], [0.245, 0.665, 'teardrop'], [0.755, 0.675, 'leaf'],
      [0.50, 0.135, 'teardrop'], [0.945, 0.885, 'leaf']
    ];
    for (var a = 0; a < anchors.length; a++) {
      var ax = anchors[a][0] * W, ay = anchors[a][1] * H;
      var kind = anchors[a][2];
      var R = S * (0.028 + rng() * 0.026);
      var rot = rng() * Math.PI * 2;
      var wob = 0.07 + rng() * 0.09;
      var harm = 2 + Math.floor(rng() * 3); // 2..4
      var ph1 = rng() * Math.PI * 2;
      var NPT = 28, outline = [];
      for (var p = 0; p < NPT; p++) {
        var th = (p / NPT) * Math.PI * 2;
        var r = R * (1 + wob * Math.sin(harm * th + ph1));
        if (kind === 'teardrop') r *= (1 - 0.30 * (0.5 + 0.5 * Math.sin(th)));
        if (kind === 'leaf') r *= (1 - 0.22 * Math.abs(Math.sin(th)));
        var lx2 = Math.cos(th) * r, ly2 = Math.sin(th) * r;
        var rx = ax + lx2 * Math.cos(rot) - ly2 * Math.sin(rot);
        var ry = ay + lx2 * Math.sin(rot) + ly2 * Math.cos(rot);
        outline.push([rx, ry]);
      }
      // fan facets from centroid: 6 wedges, normals fanned around, so the
      // dome of each form shades in soft steps rather than hard thirds
      var fans = [];
      for (var wI = 0; wI < 6; wI++) {
        var amid = -Math.PI + (wI + 0.5) * (Math.PI / 3);
        var wpts = [[ax, ay]];
        for (var q = 0; q < outline.length; q++) {
          var vx = outline[q][0] - ax, vy = outline[q][1] - ay;
          var va = Math.atan2(vy, vx);
          var rel = Math.atan2(Math.sin(va - amid), Math.cos(va - amid));
          if (Math.abs(rel) <= Math.PI / 6 + 0.12) wpts.push(outline[q]);
        }
        if (wpts.length > 2) fans.push({ pts: wpts, nx: Math.cos(amid), ny: Math.sin(amid) });
      }
      organics.push({ outline: outline, fans: fans, cx: ax, cy: ay });
    }

    // ---- Red smudge: upper-right third, off-center ----
    smudgePos = { x: W * 0.685, y: H * 0.285 };
    var sr = S * 0.045;
    for (var m = 0; m < 26; m++) {
      var sa = rng() * Math.PI * 2, sd = Math.pow(rng(), 1.6) * sr;
      smudge.push({
        x: smudgePos.x + Math.cos(sa) * sd * 1.25,
        y: smudgePos.y + Math.sin(sa) * sd * 0.8,
        rx: sr * (0.25 + rng() * 0.55), ry: sr * (0.16 + rng() * 0.34),
        a: 0.05 + rng() * 0.10
      });
    }

    // ---- Paper fiber: speckles + short strokes, precomputed ----
    var nSp = Math.round((W * H) / 2600);
    for (var s2 = 0; s2 < nSp; s2++) {
      speckles.push({ x: rng() * W, y: rng() * H, r: 0.5 + rng() * 1.1, a: 0.05 + rng() * 0.10 });
    }
    var nSt = Math.round((W * H) / 9000);
    for (var s3 = 0; s3 < nSt; s3++) {
      strokes.push({ x: rng() * W, y: rng() * H, len: 4 + rng() * 9, ang: rng() * Math.PI, a: 0.05 + rng() * 0.08 });
    }
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || H > W * 1.15;
    build();
  }

  // ---- Light state ----
  var ORBIT_PERIOD = 36; // seconds per orbit
  var PHASE0 = 0;        // fixed phase offset; frame one is drawn at t = PHASE0
  var THETA0 = Math.PI * 0.86; // frame-one light azimuth: raking in from the left
  var dragging = false;
  var dragTheta = 0;     // light azimuth while dragging
  var autoBase = THETA0; // azimuth anchor for auto-orbit
  var autoStart = 0;     // elapsed-time anchor for auto-orbit

  function lightAt(t) {
    if (dragging) return dragTheta;
    return autoBase + ((t - autoStart) / ORBIT_PERIOD) * Math.PI * 2;
  }

  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var theta = lightAt(t);
    var lx = Math.cos(theta), ly = Math.sin(theta);

    // paper ground
    ctx.fillStyle = css(PAPER, 1);
    ctx.fillRect(0, 0, W, H);

    // fiber speckles + strokes (under the relief)
    var i;
    for (i = 0; i < speckles.length; i++) {
      var sp = speckles[i];
      ctx.fillStyle = css(FIBER, sp.a);
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.lineWidth = 1;
    for (i = 0; i < strokes.length; i++) {
      var st = strokes[i];
      ctx.strokeStyle = css(FIBER, st.a);
      ctx.beginPath();
      ctx.moveTo(st.x, st.y);
      ctx.lineTo(st.x + Math.cos(st.ang) * st.len, st.y + Math.sin(st.ang) * st.len);
      ctx.stroke();
    }

    // groove bed under the herringbone block
    if (groove) {
      ctx.fillStyle = css(FIBER, 0.40);
      ctx.fillRect(groove.x, groove.y, groove.w, groove.h);
    }

    // herringbone facets
    for (i = 0; i < facets.length; i++) {
      var f = facets[i];
      ctx.fillStyle = css(facetColor(f.nx, f.ny, lx, ly), 1);
      poly(f.pts);
      ctx.fill();
    }

    // organics: cast relief shadow + highlight (offset copies), then facets
    var off = Math.max(1.5, Math.min(W, H) * 0.004);
    var o, k;
    for (o = 0; o < organics.length; o++) {
      var og = organics[o];
      ctx.save();
      ctx.translate(-lx * off * 1.6, -ly * off * 1.6);
      ctx.fillStyle = css(SHADOW, 0.20);
      poly(og.outline);
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.translate(lx * off, ly * off);
      ctx.fillStyle = css([244, 238, 227], 0.16);
      poly(og.outline);
      ctx.fill();
      ctx.restore();
      for (k = 0; k < og.fans.length; k++) {
        var fan = og.fans[k];
        ctx.fillStyle = css(facetColor(fan.nx, fan.ny, lx, ly, 0.62), 0.96);
        poly(fan.pts);
        ctx.fill();
      }
    }

    // the one red smudge
    for (i = 0; i < smudge.length; i++) {
      var sm = smudge[i];
      ctx.fillStyle = css(RED, sm.a);
      ctx.beginPath();
      ctx.ellipse(sm.x, sm.y, sm.rx, sm.ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // hint
    ctx.fillStyle = css(SHADOW, 0.55);
    ctx.font = (isPhone ? 12 : 13) + 'px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('drag', W - 14, H - 12);
  }

  // ---- Pointer: drag takes the light ----
  function pointerAngle(e) {
    var r = canvas.getBoundingClientRect();
    var x = (e.clientX - r.left) - W / 2;
    var y = (e.clientY - r.top) - H / 2;
    return Math.atan2(y, x);
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragTheta = pointerAngle(e);
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (dragging) dragTheta = pointerAngle(e);
  });
  function endDrag(e, tNow) {
    if (!dragging) return;
    dragging = false;
    autoBase = dragTheta;
    autoStart = tNow;
  }
  canvas.addEventListener('pointerup', function (e) { endDrag(e, elapsed()); });
  canvas.addEventListener('pointercancel', function (e) { endDrag(e, elapsed()); });

  // ---- Time: anchored rAF, typeof-guarded ----
  var startStamp = null;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      if (startStamp === null) startStamp = performance.now();
      return (performance.now() - startStamp) / 1000;
    }
    return 0;
  }
  function frame() {
    draw(PHASE0 + elapsed());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(PHASE0 + elapsed()); });
  window.addEventListener('resize', function () { resize(); draw(PHASE0 + elapsed()); });

  resize();
  draw(PHASE0); // synchronous first frame at the fixed phase
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
