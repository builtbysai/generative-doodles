<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chosen Picture</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#EFD9A0; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
    layoutFrame();
    buildTiles();
  }

  // Palette: the eight prompt colors and nothing else. The frame shadow is
  // the frame brown at low alpha, so no ninth color ever appears.
  var WALL   = '#EFD9A0';  // pale yellow wallpaper ground
  var CAR    = '#4A7FB5';  // the imposed pattern: tiny blue cars
  var FRAMEC = '#6B4A2E';  // frame wood, also the hint and the cat
  var PAPER  = '#F5F2EA';  // picture paper
  var BIKE   = '#2B5FE3';  // the chosen bicycle (and boat hull blue)
  var GRASS  = '#7CB342';  // grass in the picture, water in the boat motif
  var SUN    = '#F2C14E';  // the sun in the picture
  var CHAIRC = '#8A6A45';  // the wooden chair

  // Seeded RNG (mulberry32), used once at load for tiny per-tile jitters so
  // the wallpaper feels printed rather than stamped by a machine grid. The
  // seed is fixed, so every load and every QA render agree byte for byte.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Wallpaper: a tile grid of car glyphs, stored as data and redrawn
  // every frame. Each tile carries a current offset (ox, oy) that lerps
  // toward a repulsion target computed from the frame's position: the
  // pattern gives way gently around the chosen picture and springs back
  // when the picture moves on.
  var tiles = [];
  function buildTiles() {
    tiles = [];
    if (!W || !H) return;
    var U = Math.min(W, H);
    var P = U * 0.088;                       // tile pitch
    var rng = mulberry32(472);
    var cols = Math.ceil(W / P) + 1;
    var rows = Math.ceil(H / P) + 1;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var stagger = (r % 2) ? P * 0.5 : 0;
        tiles.push({
          x: c * P + stagger - P * 0.25,
          y: r * P + P * 0.5,
          jx: (rng() - 0.5) * P * 0.07,      // fixed print jitter
          jy: (rng() - 0.5) * P * 0.07,
          s: P * (0.60 + rng() * 0.05),      // car width, near-uniform
          ox: 0, oy: 0
        });
      }
    }
    settleOffsets();
  }

  // Repulsion target for one point: push away from the frame center,
  // falling off smoothly to zero at radius R. Deliberately weak: the
  // pattern resists, it does not flee.
  function repelTarget(x, y) {
    var U = Math.min(W, H);
    var R = U * 0.44;
    var maxOff = U * 0.017;
    var dx = x - frame.x, dy = y - frame.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d >= R || d < 0.001) return [0, 0];
    var f = 1 - d / R;
    f = f * f * (3 - 2 * f);                  // smoothstep falloff
    var m = maxOff * f / d;
    return [dx * m, dy * m];
  }

  // First frame must be a constant state: offsets start already settled
  // around the frame's home position, never mid-flight.
  function settleOffsets() {
    for (var i = 0; i < tiles.length; i++) {
      var t = repelTarget(tiles[i].x + tiles[i].jx, tiles[i].y + tiles[i].jy);
      tiles[i].ox = t[0]; tiles[i].oy = t[1];
    }
  }

  // ---- The framed picture. Position is kept as fractions of the viewport
  // so a resize keeps it in the same relative spot. Three motifs in the
  // bank: 0 bicycle, 1 small boat, 2 cat. A tap advances to the next one.
  var frame = { fx: 0.5, fy: 0.34, tx: 0.5, ty: 0.34, x: 0, y: 0, w: 0, h: 0 };
  var motif = 0;
  var dragging = false;

  function layoutFrame() {
    var U = Math.min(W, H);
    frame.w = U * (PHONE ? 0.52 : 0.36);
    frame.h = frame.w * 0.78;
    frame.x = frame.fx * W;
    frame.y = frame.fy * H;
    frame.tx = frame.fx; frame.ty = frame.fy;
  }

  function roundRect(x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function circle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }

  // One wallpaper car, centered at (cx, cy), s wide. Built to stay legible
  // at tile size: a rounded body slab, a cabin with a pale window notch
  // punched out of it, and two wheel discs riding the body's lower edge.
  function drawCar(cx, cy, s) {
    var bh = s * 0.30;                        // body height
    var by = cy + s * 0.05;                   // body center
    var cw = s * 0.54, ch = s * 0.24;         // cabin
    var cabTop = by - bh / 2 - ch * 0.78;
    ctx.fillStyle = CAR;
    roundRect(cx - s / 2, by - bh / 2, s, bh, bh * 0.48);
    ctx.fill();
    roundRect(cx - cw / 2, cabTop, cw, ch, ch * 0.55);
    ctx.fill();
    ctx.fillStyle = WALL;                     // the window notch
    roundRect(cx - cw * 0.21, cabTop + ch * 0.20, cw * 0.42, ch * 0.52, ch * 0.24);
    ctx.fill();
    ctx.fillStyle = CAR;                      // wheels
    var wr = s * 0.088;
    circle(cx - s * 0.30, by + bh / 2, wr); ctx.fill();
    circle(cx + s * 0.30, by + bh / 2, wr); ctx.fill();
  }

  // ---- The three pictures that can hang in the frame.
  function drawBicycle(ix, iy, iw, ih) {
    var cx = ix + iw / 2, s = iw * 0.62;
    var gy = iy + ih * 0.80;                  // ground line
    ctx.fillStyle = SUN;
    circle(ix + iw * 0.80, iy + ih * 0.24, iw * 0.085); ctx.fill();
    ctx.fillStyle = GRASS;
    ctx.fillRect(ix, gy, iw, iy + ih - gy);
    var r = s * 0.165;
    var wy = gy - r;                          // wheel axle height
    var ax = cx - s * 0.30, bx = cx + s * 0.30;
    var seat = { x: cx - s * 0.13, y: wy - s * 0.315 };
    var head = { x: cx + s * 0.20, y: wy - s * 0.29 };
    var bb   = { x: cx + s * 0.01, y: wy - s * 0.10 };
    ctx.strokeStyle = BIKE;
    ctx.lineWidth = Math.max(1.1, s * 0.045);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    circle(ax, wy, r); ctx.stroke();
    circle(bx, wy, r); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ax, wy); ctx.lineTo(seat.x, seat.y);   // seat stay
    ctx.lineTo(head.x, head.y);                        // top tube
    ctx.lineTo(bx, wy);                                // fork
    ctx.moveTo(head.x, head.y); ctx.lineTo(bb.x, bb.y); // down tube
    ctx.lineTo(ax, wy);                                // chain stay
    ctx.moveTo(bb.x, bb.y); ctx.lineTo(seat.x, seat.y); // seat tube
    ctx.moveTo(seat.x - s * 0.055, seat.y - s * 0.035); // saddle
    ctx.lineTo(seat.x + s * 0.05, seat.y - s * 0.035);
    ctx.moveTo(head.x, head.y);                        // handlebar
    ctx.lineTo(head.x + s * 0.045, head.y - s * 0.055);
    ctx.stroke();
  }

  function drawBoat(ix, iy, iw, ih) {
    var cx = ix + iw / 2;
    var wy = iy + ih * 0.68;                  // waterline
    ctx.fillStyle = SUN;
    circle(ix + iw * 0.20, iy + ih * 0.24, iw * 0.075); ctx.fill();
    ctx.strokeStyle = BIKE;
    ctx.lineWidth = Math.max(1.1, iw * 0.022);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();                          // mast
    ctx.moveTo(cx, wy - ih * 0.06); ctx.lineTo(cx, iy + ih * 0.16);
    ctx.stroke();
    ctx.fillStyle = PAPER;                    // sails: paper-white, outlined
    ctx.beginPath();
    ctx.moveTo(cx + iw * 0.035, iy + ih * 0.18);
    ctx.lineTo(cx + iw * 0.035, wy - ih * 0.10);
    ctx.lineTo(cx + iw * 0.30, wy - ih * 0.10);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - iw * 0.035, iy + ih * 0.24);
    ctx.lineTo(cx - iw * 0.035, wy - ih * 0.10);
    ctx.lineTo(cx - iw * 0.24, wy - ih * 0.10);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = BIKE;                     // hull
    ctx.beginPath();
    ctx.moveTo(cx - iw * 0.34, wy - ih * 0.05);
    ctx.lineTo(cx + iw * 0.34, wy - ih * 0.05);
    ctx.lineTo(cx + iw * 0.22, wy + ih * 0.075);
    ctx.lineTo(cx - iw * 0.22, wy + ih * 0.075);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = GRASS;                  // water: two gentle waves
    ctx.beginPath();
    for (var k = 0; k < 2; k++) {
      var yy = wy + ih * (0.16 + k * 0.11);
      ctx.moveTo(ix + iw * 0.10, yy);
      for (var px = 0; px <= 8; px++) {
        ctx.lineTo(ix + iw * (0.10 + px * 0.10),
                   yy + Math.sin(px * Math.PI / 2) * ih * 0.018);
      }
    }
    ctx.stroke();
  }

  function drawCat(ix, iy, iw, ih) {
    var cx = ix + iw / 2;
    var gy = iy + ih * 0.80;
    ctx.fillStyle = SUN;
    circle(ix + iw * 0.80, iy + ih * 0.24, iw * 0.085); ctx.fill();
    ctx.fillStyle = GRASS;
    ctx.fillRect(ix, gy, iw, iy + ih - gy);
    ctx.fillStyle = FRAMEC;                   // the cat, in the darkest palette tone
    ctx.strokeStyle = FRAMEC;
    var bw = iw * 0.46, bh = ih * 0.30;
    var bx = cx - bw * 0.28, by = gy - bh * 0.52;
    ctx.beginPath();                          // body
    ctx.ellipse(bx, by, bw / 2, bh / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    var hx = bx + bw * 0.42, hy = by - bh * 0.52, hr = iw * 0.115;
    ctx.beginPath();                          // ears
    ctx.moveTo(hx - hr * 0.85, hy - hr * 0.35);
    ctx.lineTo(hx - hr * 0.55, hy - hr * 1.25);
    ctx.lineTo(hx - hr * 0.05, hy - hr * 0.62);
    ctx.closePath();
    ctx.moveTo(hx + hr * 0.85, hy - hr * 0.35);
    ctx.lineTo(hx + hr * 0.55, hy - hr * 1.25);
    ctx.lineTo(hx + hr * 0.05, hy - hr * 0.62);
    ctx.closePath(); ctx.fill();
    circle(hx, hy, hr); ctx.fill();           // head
    ctx.lineWidth = Math.max(1.1, iw * 0.028); // tail, curling up behind
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx - bw * 0.46, by + bh * 0.18);
    ctx.quadraticCurveTo(bx - bw * 0.78, by - bh * 0.30,
                         bx - bw * 0.52, by - bh * 0.95);
    ctx.stroke();
  }

  // ---- The wooden chair, lower-center, drawn as a plain front pictogram:
  // two uprights, two back slats, a seat slab, a low stretcher.
  function drawChair() {
    var U = Math.min(W, H);
    var s = U * (PHONE ? 0.30 : 0.21);        // chair width
    var cx = W * 0.5;
    var baseY = H - U * 0.045;
    var topY = baseY - s * 1.30;
    var seatY = baseY - s * 0.54;
    ctx.strokeStyle = CHAIRC;
    ctx.lineWidth = s * 0.072;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.40, topY); ctx.lineTo(cx - s * 0.40, baseY);
    ctx.moveTo(cx + s * 0.40, topY); ctx.lineTo(cx + s * 0.40, baseY);
    ctx.moveTo(cx - s * 0.40, topY + s * 0.17); ctx.lineTo(cx + s * 0.40, topY + s * 0.17);
    ctx.moveTo(cx - s * 0.40, topY + s * 0.42); ctx.lineTo(cx + s * 0.40, topY + s * 0.42);
    ctx.moveTo(cx - s * 0.40, baseY - s * 0.15); ctx.lineTo(cx + s * 0.40, baseY - s * 0.15);
    ctx.stroke();
    ctx.fillStyle = CHAIRC;
    ctx.fillRect(cx - s * 0.51, seatY - s * 0.06, s * 1.02, s * 0.12);
  }

  function drawFrame() {
    var U = Math.min(W, H);
    var fx = frame.x - frame.w / 2, fy = frame.y - frame.h / 2;
    ctx.fillStyle = 'rgba(107,74,46,0.28)';   // soft shadow, frame brown at alpha
    ctx.fillRect(fx + U * 0.009, fy + U * 0.012, frame.w, frame.h);
    ctx.fillStyle = FRAMEC;
    ctx.fillRect(fx, fy, frame.w, frame.h);
    var b = frame.w * 0.075;
    var ix = fx + b, iy = fy + b, iw = frame.w - 2 * b, ih = frame.h - 2 * b;
    ctx.fillStyle = PAPER;
    ctx.fillRect(ix, iy, iw, ih);
    ctx.save();
    ctx.beginPath();
    ctx.rect(ix, iy, iw, ih);
    ctx.clip();
    if (motif === 0) drawBicycle(ix, iy, iw, ih);
    else if (motif === 1) drawBoat(ix, iy, iw, ih);
    else drawCat(ix, iy, iw, ih);
    ctx.restore();
  }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);
    // Wallpaper, skipping the tiles the frame hangs over: the pattern is
    // interrupted by the picture, and bends a little around it.
    var fx0 = frame.x - frame.w / 2, fx1 = frame.x + frame.w / 2;
    var fy0 = frame.y - frame.h / 2, fy1 = frame.y + frame.h / 2;
    var pad = Math.min(W, H) * 0.045;
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      var x = t.x + t.jx + t.ox, y = t.y + t.jy + t.oy;
      if (x > fx0 - pad && x < fx1 + pad && y > fy0 - pad && y < fy1 + pad) continue;
      drawCar(x, y, t.s);
    }
    drawChair();
    drawFrame();
    // The one word of instruction, quiet in the corner.
    var U = Math.min(W, H);
    ctx.fillStyle = FRAMEC;
    ctx.globalAlpha = 0.55;
    ctx.font = '600 ' + Math.round(U * 0.030) + 'px system-ui, sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag', U * 0.035, H - U * 0.032);
    ctx.globalAlpha = 1;
  }

  // One synchronous, constant first frame: frame at home, bicycle in it,
  // warp settled. Never derived from the clock.
  resize();
  draw();

  // ---- Motion: offsets ease toward their repulsion targets; the frame
  // eases toward the pointer while dragged. Speeds divide nothing and need
  // no clock at all: plain per-frame easing toward a resting state.
  function step() {
    var k = dragging ? 0.30 : 0.12;
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      var tg = repelTarget(t.x + t.jx, t.y + t.jy);
      t.ox += (tg[0] - t.ox) * k;
      t.oy += (tg[1] - t.oy) * k;
    }
    if (dragging) {
      frame.fx += (frame.tx - frame.fx) * 0.35;
      frame.fy += (frame.ty - frame.fy) * 0.35;
      frame.x = frame.fx * W;
      frame.y = frame.fy * H;
    }
    draw();
  }

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () { step(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }

  // ---- Interaction: drag the picture around the wall. A tap (press and
  // release in place, quickly) changes the picture: bicycle, boat, cat.
  var downAt = 0, downX = 0, downY = 0, moved = false;
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function onDown(e) {
    var p = pos(e);
    downAt = Date.now(); downX = p.x; downY = p.y; moved = false;
    var fx0 = frame.x - frame.w / 2 - 14, fx1 = frame.x + frame.w / 2 + 14;
    var fy0 = frame.y - frame.h / 2 - 14, fy1 = frame.y + frame.h / 2 + 14;
    if (p.x > fx0 && p.x < fx1 && p.y > fy0 && p.y < fy1) {
      dragging = true;
      frame.tx = frame.fx; frame.ty = frame.fy;
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    var p = pos(e);
    if (Math.abs(p.x - downX) + Math.abs(p.y - downY) > 9) moved = true;
    if (!dragging) return;
    var U = Math.min(W, H);
    var mx = frame.w / 2 - U * 0.02, my = frame.h / 2 - U * 0.02;
    var nx = Math.max(mx, Math.min(W - mx, p.x));
    var ny = Math.max(my, Math.min(H - my, p.y));
    frame.tx = nx / W; frame.ty = ny / H;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    var wasTap = !moved && (Date.now() - downAt) < 350;
    if (wasTap && !dragging) { motif = (motif + 1) % 3; draw(); }
    else if (wasTap && dragging) { motif = (motif + 1) % 3; }
    dragging = false;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { dragging = false; });
  }
})();
</script>
</body>
</html>
