<!DOCTYPE html>
<!-- 9172-optional-pain-suffering -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Optional — №842</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #efe9dc;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: Georgia, "Times New Roman", serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: block;
    touch-action: none;
    cursor: pointer;
  }
  .label {
    position: fixed;
    z-index: 2;
    color: #5a5148;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .label.hidden { opacity: 0; }
  #corner {
    top: 20px; left: 22px;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #6b6156;
  }
  #foot {
    left: 0; right: 0; bottom: 22px;
    text-align: center;
    padding: 0 20px;
  }
  #foot .q {
    font-size: 16px;
    font-style: italic;
    letter-spacing: 0.03em;
    color: #4c443b;
  }
  #foot .a {
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a7f71;
  }
  #foot .r {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #6b6156;
  }
  #foot .h {
    margin-top: 4px;
    font-size: 11px;
    font-style: italic;
    letter-spacing: 0.04em;
    color: #9a8f80;
  }
  @media (max-width: 600px) {
    #foot .q { font-size: 14px; }
    #corner { font-size: 12px; top: 16px; left: 16px; }
    #foot { bottom: 16px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="corner" class="label">№ 842 · Optional</div>
<div id="foot" class="label">
  <div class="q">Pain is unavoidable, but suffering is optional.</div>
  <div class="a">after Haruki Murakami</div>
  <div class="r" id="readout">pain 0 · suffering 0</div>
  <div class="h">strikes land on their own. hold one and it darkens. let go and it fades. double-tap to begin again.</div>
</div>
<script>
(function () {
  "use strict";

  // Pain is unavoidable, but suffering is optional.
  //
  // The driver, stated plainly: strikes land on their own schedule and
  // pass on their own. Nothing can stop them arriving. Suffering is what
  // grows when you hold on: a held mark darkens, bleeds into the paper,
  // and darkens the marks near it. Let go and it fades again, from
  // wherever the holding left it. The cost of holding on is visible in
  // how long the mark then takes to pass.

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var readout = document.getElementById("readout");
  var labels = document.querySelectorAll(".label");

  var W = 0, H = 0, DPR = 1;
  var marks = [];
  var ripples = [];
  var nextStrike = 1200; // ms until the first strike
  var last = performance.now();
  var labelsShown = true;
  var grain = null;

  var INK = [26, 23, 20];       // pain: ink black
  var BLOOD = [74, 26, 22];     // suffering: faint oxblood at full darkness
  var MAX_MARKS = 40;
  var SPREAD_RADIUS = 140;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildGrain();
  }

  function buildGrain() {
    // Paper grain, pre-rendered once per resize.
    var g = document.createElement("canvas");
    var s = 180;
    g.width = s; g.height = s;
    var gc = g.getContext("2d");
    var img = gc.createImageData(s, s);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = 228 + Math.floor(Math.random() * 24) - 12;
      img.data[i] = v; img.data[i + 1] = v - 4; img.data[i + 2] = v - 12;
      img.data[i + 3] = 255;
    }
    gc.putImageData(img, 0, 0);
    grain = ctx.createPattern(g, "repeat");
  }

  function mulberry(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  function strike(x, y) {
    if (marks.length >= MAX_MARKS) return null;
    var rnd = mulberry((Math.random() * 1e9) | 0);
    var lobes = [];
    var nLobes = 5 + Math.floor(rnd() * 4);
    for (var i = 0; i < nLobes; i++) {
      lobes.push({
        a: (i / nLobes) * Math.PI * 2 + rnd() * 0.5,
        d: 0.55 + rnd() * 0.75,
        w: 0.5 + rnd() * 0.6
      });
    }
    var m = {
      x: x, y: y,
      r0: 12 + rnd() * 10,
      r: 0,
      a: 0.88,
      d: 0,            // darkness: the suffering level, 0..1
      held: false,
      born: performance.now(),
      lobes: lobes,
      seed: rnd() * Math.PI * 2
    };
    m.r = m.r0;
    marks.push(m);
    ripples.push({ x: x, y: y, t0: performance.now() });
    return m;
  }

  function scheduleStrike() {
    nextStrike = 2000 + Math.random() * 4000; // 2-6s, on its own schedule
  }

  function mix(c1, c2, t) {
    return [
      Math.round(c1[0] + (c2[0] - c1[0]) * t),
      Math.round(c1[1] + (c2[1] - c1[1]) * t),
      Math.round(c1[2] + (c2[2] - c1[2]) * t)
    ];
  }

  function update(dt, now) {
    // Strikes arrive whether or not anyone is watching.
    nextStrike -= dt * 1000;
    if (nextStrike <= 0) {
      var mx = 50 + Math.random() * Math.max(20, W - 100);
      var my = 60 + Math.random() * Math.max(20, H - 180);
      strike(mx, my);
      scheduleStrike();
    }

    var heldMarks = [];
    for (var i = 0; i < marks.length; i++) {
      if (marks[i].held) heldMarks.push(marks[i]);
    }

    for (var j = marks.length - 1; j >= 0; j--) {
      var m = marks[j];
      if (m.held) {
        // Held: it darkens, grows, and stops fading.
        m.d = Math.min(1, m.d + dt * 0.25);
        m.r = Math.min(m.r0 * 3, m.r + dt * 2.5);
        m.a = Math.min(1, m.a + dt * 0.10);
      } else {
        // Near a held mark, suffering spreads: the fade pauses and
        // the mark darkens at half rate.
        var near = false;
        for (var k = 0; k < heldMarks.length; k++) {
          var h = heldMarks[k];
          var dx = m.x - h.x, dy = m.y - h.y;
          if (dx * dx + dy * dy < SPREAD_RADIUS * SPREAD_RADIUS) { near = true; break; }
        }
        if (near) {
          m.d = Math.min(0.8, m.d + dt * 0.12);
        } else {
          // Untouched: darkness eases off, and the mark fades. A
          // darkened mark fades slower, so holding on costs time.
          m.d = Math.max(0, m.d - dt * 0.08);
          m.a -= dt * (0.09 - 0.05 * m.d);
          var target = m.r0 * (1 + 1.2 * m.d);
          m.r += (target - m.r) * Math.min(1, dt * 1.5);
        }
      }
      if (m.a <= 0.01 && m.d <= 0.01) marks.splice(j, 1);
    }

    // Ripples live 1.5s.
    for (var r = ripples.length - 1; r >= 0; r--) {
      if (now - ripples[r].t0 > 1500) ripples.splice(r, 1);
    }
  }

  function drawMark(m, now) {
    var col = mix(INK, BLOOD, m.d);
    var pulse = m.held ? 1 + Math.sin((now - m.born) / 280 + m.seed) * 0.02 : 1;
    var r = m.r * pulse;

    // Bleed: soft lobes feathering into the paper, stronger with darkness.
    var bleedA = m.a * (0.16 + 0.35 * m.d);
    if (bleedA > 0.01) {
      for (var i = 0; i < m.lobes.length; i++) {
        var lb = m.lobes[i];
        var bx = m.x + Math.cos(lb.a) * r * lb.d;
        var by = m.y + Math.sin(lb.a) * r * lb.d;
        var br = r * (0.55 + 0.5 * m.d) * lb.w;
        var bg = ctx.createRadialGradient(bx, by, 0, bx, by, br);
        bg.addColorStop(0, "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + bleedA.toFixed(3) + ")");
        bg.addColorStop(1, "rgba(" + col[0] + "," + col[1] + "," + col[2] + ",0)");
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Core: dark centre softening to the edge.
    var g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, r);
    g.addColorStop(0, "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + (m.a * 0.92).toFixed(3) + ")");
    g.addColorStop(0.55, "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + (m.a * 0.75).toFixed(3) + ")");
    g.addColorStop(1, "rgba(" + col[0] + "," + col[1] + "," + col[2] + ",0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(m.x, m.y, r, 0, Math.PI * 2);
    ctx.fill();

    // Held marks carry a thin dark ring at the edge.
    if (m.held) {
      ctx.strokeStyle = "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + (0.5 * m.a).toFixed(3) + ")";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(m.x, m.y, r + 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function draw(now) {
    ctx.fillStyle = grain || "#efe9dc";
    ctx.fillRect(0, 0, W, H);

    // Ripples under the marks.
    for (var i = 0; i < ripples.length; i++) {
      var rp = ripples[i];
      var t = (now - rp.t0) / 1500;
      var rr = 8 + t * 72;
      var ra = 0.32 * (1 - t);
      ctx.strokeStyle = "rgba(60,50,40," + ra.toFixed(3) + ")";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rr, 0, Math.PI * 2);
      ctx.stroke();
    }

    for (var j = 0; j < marks.length; j++) drawMark(marks[j], now);
  }

  function counts() {
    var pain = 0, suffering = 0;
    for (var i = 0; i < marks.length; i++) {
      if (marks[i].held || marks[i].d > 0.25) suffering++;
      else pain++;
    }
    return { pain: pain, suffering: suffering };
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt, now);
    draw(now);
    var c = counts();
    readout.textContent = "pain " + c.pain + " · suffering " + c.suffering;
    requestAnimationFrame(frame);
  }

  function markAt(x, y) {
    // Topmost mark first; grab area extends past the visible edge.
    for (var i = marks.length - 1; i >= 0; i--) {
      var m = marks[i];
      var dx = x - m.x, dy = y - m.y;
      var gr = m.r + 22;
      if (dx * dx + dy * dy < gr * gr) return m;
    }
    return null;
  }

  var heldMark = null;
  var tapTimer = null;
  var downPos = null;
  var downTime = 0;

  function setLabels(show) {
    labelsShown = show;
    for (var i = 0; i < labels.length; i++) {
      labels[i].classList.toggle("hidden", !show);
    }
  }

  function clearAll() {
    marks.length = 0;
    ripples.length = 0;
    heldMark = null;
    scheduleStrike();
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var x = e.clientX, y = e.clientY;
    downPos = { x: x, y: y };
    downTime = performance.now();
    var m = markAt(x, y);
    if (m) {
      m.held = true;
      heldMark = m;
      canvas.setPointerCapture(e.pointerId);
    }
  });

  canvas.addEventListener("pointerup", function (e) {
    if (heldMark) {
      heldMark.held = false;
      heldMark = null;
      downPos = null;
      return;
    }
    if (!downPos) return;
    var dt = performance.now() - downTime;
    var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    var moved = Math.sqrt(dx * dx + dy * dy);
    downPos = null;
    if (dt > 500 || moved > 12) return; // a drag, not a tap
    if (tapTimer) {
      // Second tap: begin again.
      clearTimeout(tapTimer);
      tapTimer = null;
      clearAll();
    } else {
      tapTimer = setTimeout(function () {
        tapTimer = null;
        setLabels(!labelsShown);
      }, 300);
    }
  });

  canvas.addEventListener("pointercancel", function () {
    if (heldMark) { heldMark.held = false; heldMark = null; }
    downPos = null;
  });

  // Pause the loop's clock jump on tab hide; resume cleanly.
  document.addEventListener("visibilitychange", function () {
    last = performance.now();
  });

  window.addEventListener("resize", resize);

  // Harness hook: read-only state for verification, not part of the piece.
  window.__9172 = {
    marks: function () {
      return marks.map(function (m) {
        return { x: m.x, y: m.y, r: m.r, r0: m.r0, a: m.a, d: m.d, held: m.held };
      });
    },
    counts: counts,
    strikeAt: function (x, y) { return strike(x, y); },
    clear: clearAll,
    labelsShown: function () { return labelsShown; }
  };

  resize();
  scheduleStrike();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
