<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Feedback Machine</title>
<style>
  html, body { margin:0; padding:0; background:#0A0A0A; height:100%; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // Palette (strict)
  var COL_BG     = "#0A0A0A";  // black
  var COL_CHROME = "#C9CCD1";  // chrome
  var COL_RED    = "#B3202C";  // red rim

  var LOOP   = 64;             // seconds; one seamless loop standing in for the 16:01 sides
  var ANCHOR = 12;             // frame one sits at loop t = 12 s (mid-surge, gain rising toward the 14 s peak)

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1, minDim = 0;
  var fieldH = 0, fieldW = 0, panelX = 0, panelW = 0, panelY = 0, panelH = 0, margin = 0;

  function isPhone() {
    try {
      if (window.screen) {
        var m = Math.min(window.screen.width || 0, window.screen.height || 0);
        if (m > 0) return m < 700;
      }
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    minDim = Math.min(W, H);
    margin = Math.max(10, minDim * 0.035);
    fieldH = Math.round(H * 0.80);
    panelW = Math.max(46, Math.min(W * (isPhone() ? 0.17 : 0.135), 150));
    panelX = W - panelW - margin;
    panelY = margin;
    panelH = fieldH - margin * 1.4;
    fieldW = panelX - margin * 1.2;
  }

  // Seeded RNG
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Wave components (one curated coupling set, seeded phases).
  // Left system: 3 components, low spatial frequencies, slow rates.
  // Right system: 4 components, higher frequencies, different rates and signs.
  // The asymmetry is the stereo split.
  var rnd = mulberry32(842003);
  function makeComps(freqs, rates, amps) {
    var out = [];
    for (var i = 0; i < freqs.length; i++) {
      out.push({ f: freqs[i], w: rates[i], a: amps[i], p: rnd() * Math.PI * 2 });
    }
    return out;
  }
  var compL = makeComps([1.5, 2.7, 4.3],        [0.55, -0.38, 0.29],  [1.0, 0.55, 0.30]);
  var compR = makeComps([2.2, 3.9, 5.6, 7.4],   [-0.71, 0.47, -0.33, 0.21], [0.90, 0.60, 0.38, 0.22]);

  function waveAt(comps, x, tau, freqScale) {
    var s = 0;
    for (var i = 0; i < comps.length; i++) {
      var c = comps[i];
      s += c.a * Math.sin(2 * Math.PI * c.f * x + c.w * tau * freqScale + c.p);
    }
    return s;
  }

  // Feedback gain: a scripted schedule over the loop (the coupling is a fixed
  // function of loop time, not simulated physics). Cosine interpolation between
  // keyframes; first and last keys match so the loop wraps seamlessly.
  var GAIN_KEYS = [
    [0, 0.62], [6, 0.85], [10, 1.12], [14, 1.30], [19, 1.18], [24, 0.95],
    [30, 0.82], [36, 0.66], [44, 0.55], [50, 0.52], [54, 0.85], [57, 1.08],
    [60, 0.88], [64, 0.62]
  ];
  function gainAt(tau) {
    for (var i = 0; i < GAIN_KEYS.length - 1; i++) {
      var t0 = GAIN_KEYS[i][0], g0 = GAIN_KEYS[i][1];
      var t1 = GAIN_KEYS[i + 1][0], g1 = GAIN_KEYS[i + 1][1];
      if (tau >= t0 && tau <= t1) {
        var u = (tau - t0) / (t1 - t0);
        var s = 0.5 - 0.5 * Math.cos(u * Math.PI);
        return g0 + (g1 - g0) * s;
      }
    }
    return GAIN_KEYS[GAIN_KEYS.length - 1][1];
  }

  // Dropout bump: smoothstep up over 0.4 s, hold, smoothstep down over 0.4 s.
  function bump(tau, t0, t1) {
    if (tau <= t0 || tau >= t1) return 0;
    var up = Math.min(1, (tau - t0) / 0.4);
    var dn = Math.min(1, (t1 - tau) / 0.4);
    var a = Math.min(up, dn);
    return a * a * (3 - 2 * a);
  }
  // Scheduled dropout windows (loop seconds):
  //   right empties + drops an octave  15.0 - 18.0
  //   left empties                     31.0 - 34.0
  //   both sag together                56.0 - 58.5
  function dropL(tau) { return (1 - 0.92 * bump(tau, 31.0, 34.0)) * (1 - 0.50 * bump(tau, 56.0, 58.5)); }
  function dropR(tau) { return (1 - 0.95 * bump(tau, 15.0, 18.0)) * (1 - 0.50 * bump(tau, 56.0, 58.5)); }
  function octR(tau)  { return 1 - 0.5 * bump(tau, 15.0, 18.0); }  // right temporal rates halve in its dropout

  function smoothstep(a, b, x) {
    var u = (x - a) / (b - a);
    if (u < 0) u = 0; if (u > 1) u = 1;
    return u * u * (3 - 2 * u);
  }
  function envL(x) { return 1 - 0.72 * smoothstep(0.30, 0.62, x); }
  function envR(x) { return 1 - 0.72 * smoothstep(0.30, 0.62, 1 - x); }

  var leftBase  = [0.16, 0.30, 0.44, 0.58, 0.72, 0.86];
  var rightBase = [0.22, 0.38, 0.54, 0.70, 0.84];

  var CAPTION = [
    "EQUIPMENT: TWO ELECTRIC GUITARS, FOUR AMPLIFIERS, ONE REEL-TO-REEL TAPE RECORDER",
    "NO VOCALS. NO MELODY. NO OVERDUBS. NO APPLAUSE.",
    "RECORDED 5 A.M., GARMENT DISTRICT. DO NOT ADJUST YOUR SET."
  ];

  function chrome(alpha) {
    return "rgba(201,204,209," + alpha.toFixed(3) + ")";
  }

  function drawLines(baseArr, comps, isLeft, amp, tau, freqScale) {
    var step = 4;
    var ampPx = fieldH * 0.052 * amp;
    ctx.lineWidth = Math.max(1, minDim * 0.0022);
    for (var j = 0; j < baseArr.length; j++) {
      var baseY = baseArr[j] * fieldH;
      var scale = 0.72 + 0.09 * j;
      var xFrom = isLeft ? 0 : fieldW * 0.38;
      var xTo   = isLeft ? fieldW * 0.62 : fieldW;
      ctx.strokeStyle = chrome(0.34 + 0.07 * j);
      ctx.beginPath();
      for (var px = xFrom; px <= xTo; px += step) {
        var x = px / fieldW;
        var v = waveAt(comps, x, tau + j * 0.35, freqScale) * scale;
        v += 0.28 * Math.sin(2 * Math.PI * (3 + j * 1.3) * x + tau * (0.9 + 0.13 * j) * freqScale + j * 1.7);
        var env = isLeft ? envL(x) : envR(x);
        var y = baseY + v * ampPx * env * 0.55;
        if (px === xFrom) ctx.moveTo(px, y); else ctx.lineTo(px, y);
      }
      ctx.stroke();
    }
  }

  function drawCollision(tau, ampLn, ampRn) {
    var cxFrom = fieldW * 0.40, cxTo = fieldW * 0.60;
    var cyC = fieldH * 0.51;
    var scalePx = fieldH * 0.05;
    var step = 3;
    // The summed curve, drawn bright across the collision zone.
    ctx.lineWidth = Math.max(1.2, minDim * 0.0032);
    ctx.strokeStyle = chrome(0.85);
    ctx.beginPath();
    var sums = [];
    for (var px = cxFrom; px <= cxTo; px += step) {
      var x = px / fieldW;
      var s = waveAt(compL, x, tau, 1) * ampLn + waveAt(compR, x, tau, octR(tau)) * ampRn;
      sums.push({ px: px, s: s });
      var y = cyC - s * scalePx;
      if (px === cxFrom) ctx.moveTo(px, y); else ctx.lineTo(px, y);
    }
    ctx.stroke();
    // Collision envelope: the band between the sum and its mirror, swelling
    // where the two systems meet hardest.
    ctx.fillStyle = chrome(0.07);
    ctx.beginPath();
    for (var q = 0; q < sums.length; q++) {
      var yq = cyC - sums[q].s * scalePx;
      if (q === 0) ctx.moveTo(sums[q].px, yq); else ctx.lineTo(sums[q].px, yq);
    }
    for (var r = sums.length - 1; r >= 0; r--) {
      ctx.lineTo(sums[r].px, cyC + sums[r].s * scalePx);
    }
    ctx.closePath();
    ctx.fill();
    // Harmonic blooms: knots only at local maxima of the sum where it
    // constructively exceeds threshold (sparse peaks, not a comb).
    var THR = 0.80;
    var WIN = 5;
    for (var i = 0; i < sums.length; i++) {
      var a = Math.abs(sums[i].s);
      if (a <= THR) continue;
      var isMax = true;
      for (var k = -WIN; k <= WIN; k++) {
        var j = i + k;
        if (j < 0 || j >= sums.length || j === i) continue;
        if (Math.abs(sums[j].s) > a) { isMax = false; break; }
      }
      if (!isMax) continue;
      var ex = Math.min(1, (a - THR) * 1.3);
      var yy = cyC - sums[i].s * scalePx;
      ctx.fillStyle = chrome(0.18 + 0.22 * ex);
      ctx.beginPath();
      ctx.arc(sums[i].px, yy, (3 + 6 * ex) * 2.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = chrome(0.40 + 0.60 * ex);
      ctx.beginPath();
      ctx.arc(sums[i].px, yy, 3 + 6 * ex, 0, Math.PI * 2);
      ctx.fill();
      // Peak tick: a short vertical stroke rising off the knot.
      ctx.strokeStyle = chrome(0.5 + 0.5 * ex);
      ctx.lineWidth = Math.max(1, minDim * 0.0026);
      ctx.beginPath();
      ctx.moveTo(sums[i].px, yy);
      ctx.lineTo(sums[i].px, yy - (8 + 18 * ex) * (sums[i].s > 0 ? 1 : -1));
      ctx.stroke();
    }
  }

  function drawPanel() {
    // Static side panel: performer emblem. No dependence on time.
    ctx.fillStyle = chrome(0.055);
    ctx.fillRect(panelX, panelY, panelW, panelH);
    ctx.strokeStyle = chrome(0.38);
    ctx.lineWidth = 1;
    ctx.strokeRect(panelX + 0.5, panelY + 0.5, panelW - 1, panelH - 1);
    // Red rim edge line down the panel's left edge.
    ctx.fillStyle = COL_RED;
    ctx.fillRect(panelX, panelY, Math.max(2, minDim * 0.005), panelH);

    // Face plane
    var faceW = panelW * 0.64;
    var faceH = panelH * 0.30;
    var faceX = panelX + (panelW - faceW) / 2;
    var faceY = panelY + panelH * 0.18;
    ctx.fillStyle = chrome(0.88);
    ctx.fillRect(faceX, faceY, faceW, faceH);
    // Red rim-light on the face's right edge.
    ctx.fillStyle = COL_RED;
    ctx.fillRect(faceX + faceW - Math.max(2, minDim * 0.004), faceY, Math.max(2, minDim * 0.004), faceH);

    // Dark glasses: two black lens rectangles, bridge, temple arms.
    var lensW = faceW * 0.36, lensH = faceH * 0.22;
    var lensY = faceY + faceH * 0.30;
    var gap = faceW * 0.10;
    var lx1 = faceX + faceW * 0.07;
    var lx2 = lx1 + lensW + gap;
    ctx.fillStyle = COL_BG;
    ctx.fillRect(lx1, lensY, lensW, lensH);
    ctx.fillRect(lx2, lensY, lensW, lensH);
    ctx.fillRect(lx1 + lensW, lensY + lensH * 0.30, gap, lensH * 0.34); // bridge
    ctx.fillRect(faceX, lensY + lensH * 0.28, faceW * 0.07, lensH * 0.30); // left temple
    ctx.fillRect(lx2 + lensW, lensY + lensH * 0.28, faceW - (lx2 + lensW - faceX), lensH * 0.30); // right temple

    // Shoulder block under the face, and a red underline.
    ctx.fillStyle = chrome(0.30);
    ctx.fillRect(faceX + faceW * 0.08, faceY + faceH + panelH * 0.045, faceW * 0.84, panelH * 0.05);
    ctx.fillStyle = COL_RED;
    ctx.fillRect(panelX + panelW * 0.18, panelY + panelH * 0.80, panelW * 0.64, Math.max(2, minDim * 0.004));
  }

  function drawCaption() {
    var size = Math.max(8, Math.min(13, W * 0.0125));
    ctx.font = size + "px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    // Shrink to fit the widest line.
    var maxW = 0;
    for (var i = 0; i < CAPTION.length; i++) maxW = Math.max(maxW, ctx.measureText(CAPTION[i]).width);
    if (maxW > W * 0.94) {
      size = Math.floor(size * (W * 0.94) / maxW);
      ctx.font = size + "px monospace";
    }
    ctx.fillStyle = chrome(0.62);
    var lineH = size * 1.55;
    var y0 = fieldH + (H - fieldH - lineH * CAPTION.length) / 2;
    for (var k = 0; k < CAPTION.length; k++) {
      ctx.fillText(CAPTION[k], W / 2, y0 + k * lineH);
    }
  }

  function draw(elapsed) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = COL_BG;
    ctx.fillRect(0, 0, W, H);

    var tau = (ANCHOR + elapsed) % LOOP;
    var g = gainAt(tau);
    var ampL = g * dropL(tau);
    var ampR = g * dropR(tau);

    drawLines(leftBase, compL, true, ampL, tau, 1);
    drawLines(rightBase, compR, false, ampR, tau, octR(tau));
    drawCollision(tau, ampL, ampR);
    drawPanel();
    drawCaption();
  }

  // Boot
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", resize);
  }
  window.addEventListener("resize", resize);
  draw(0);

  var t0 = null;
  function tNow() {
    try {
      var n = performance.now() / 1000;
      if (t0 === null) t0 = n;
      return n - t0;
    } catch (e) { return 0; }
  }
  if (typeof requestAnimationFrame === "function") {
    var loop = function () {
      draw(tNow());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
