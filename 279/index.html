<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.279 Apprentice</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B0D; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.279 Apprentice (Njalikwa Chongwe).
// After her father-daughter lineage of pots: a large master
// vessel at the left in terracotta, and to its right a family
// of smaller vessels in cobalt, emerald and ochre, each child
// inheriting the master's profile with a slight mutation of
// form and colour, joined to its parent by thin cream lines
// that pulse softly while the whole row sways gently. A tap
// grows one new generation; at most five generations stay
// visible and the oldest children fade out.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0B0B0D', MASTER = '#B85C2E', COBALT = '#2E4EA3';
var EMERALD = '#2E8B62', OCHRE = '#C98F2D', CREAM = '#EFE6D2';
var CHILD_COLS = [COBALT, EMERALD, OCHRE];
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var T = 4, lastNow = -1; // frame one: sway and pulse already mid cycle

function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(27941);
// Standard normal from the seeded stream, for the profile
// mutations: each child parameter is its parent's value
// scaled by (1 + gaussian(0, 0.08)).
function gauss() {
  var u1 = 0, u2 = 0;
  while (u1 <= 0.000001) u1 = rand();
  u2 = rand();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mutate(v) { return v * (1 + gauss() * 0.08); }

// ---- the vessels ---------------------------------------------------------
// Profile params = [belly, neck, height, foot]: belly, neck
// and foot are half widths as fractions of the vessel's own
// height, height is in design pixels. The master stands 360
// design pixels tall, 40 percent of the frame height. Each
// generation steps down by a lineage scale of 0.87 so the
// children read smaller across the frame, then every param
// is mutated by the gaussian above and clamped to pot-like
// ranges, so every child is still a believable pot: belly
// fraction 0.20 to 0.34, neck 0.09 to 0.19, foot 0.10 to
// 0.21, height 110 to 360.
function makeVessel(belly, neck, height, foot, colour, colourIdx, parent) {
  return {
    belly: belly, neck: neck, height: height, foot: foot,
    colour: colour, colourIdx: colourIdx, parent: parent,
    phase: rand() * Math.PI * 2, bx: 0, cy: 450
  };
}
var master = makeVessel(0.27, 0.125, 360, 0.15, MASTER, -1, null);
function makeChild(parent, step) {
  var h = clamp(parent.height * 0.87 * (1 + gauss() * 0.08), 110, 360);
  var belly = clamp(mutate(parent.belly), 0.20, 0.34);
  var neck = clamp(mutate(parent.neck), 0.09, 0.19);
  var foot = clamp(mutate(parent.foot), 0.10, 0.21);
  // Colour: one step shifted inside the child palette. The
  // master's children start at cobalt and emerald; later
  // children advance one step from their parent's colour.
  var idx;
  if (parent.colourIdx < 0) idx = step % CHILD_COLS.length;
  else idx = (parent.colourIdx + 1) % CHILD_COLS.length;
  return makeVessel(belly, neck, h, foot, CHILD_COLS[idx], idx, parent);
}
function makeGeneration(parents) {
  var kids = [], i;
  if (parents.length === 1) {
    kids.push(makeChild(parents[0], 0));
    kids.push(makeChild(parents[0], 1));
  } else {
    for (i = 0; i < parents.length; i++) kids.push(makeChild(parents[i], i));
  }
  return { vessels: kids, born: -10, fading: false, fadeStart: 0 };
}
// Frame one: master plus two generations already grown.
var generations = [{ vessels: [master], born: -10, fading: false, fadeStart: 0 }];
generations.push(makeGeneration(generations[0].vessels));
generations.push(makeGeneration(generations[1].vessels));

// Column x per generation slot and vertical spread per row:
// one vessel sits at the centre, two sit above and below it.
var SLOT_X = [225, 445, 640, 835, 1035];
function layout() {
  for (var g = 0; g < generations.length; g++) {
    var vs = generations[g].vessels;
    for (var i = 0; i < vs.length; i++) {
      vs[i].bx = SLOT_X[Math.min(g, SLOT_X.length - 1)];
      vs[i].cy = vs.length === 1 ? 450 : (i === 0 ? 272 : 628);
    }
  }
}
layout();

// ---- profile path ----------------------------------------------------------
// Lathe side profile from the params: knots of height
// fraction against half width, smoothstep interpolated and
// sampled per side, so neck, shoulder, belly and foot swell
// and settle without corners.
function interp(knots, v) {
  if (v <= knots[0][0]) return knots[0][1];
  for (var i = 0; i < knots.length - 1; i++) {
    var a = knots[i], b = knots[i + 1];
    if (v <= b[0]) {
      var f = (v - a[0]) / (b[0] - a[0]);
      var s = f * f * (3 - 2 * f);
      return a[1] + (b[1] - a[1]) * s;
    }
  }
  return knots[knots.length - 1][1];
}
function knotsFor(v) {
  var belly = v.belly * v.height, neck = v.neck * v.height, foot = v.foot * v.height;
  return [
    [0.00, neck * 0.92], [0.04, neck], [0.10, neck * 1.05],
    [0.18, neck * 1.28], [0.28, belly * 0.72], [0.40, belly * 0.90],
    [0.52, belly], [0.64, belly * 0.99], [0.76, belly * 0.90],
    [0.86, belly * 0.70], [0.93, Math.max(foot * 1.45, belly * 0.52)],
    [0.97, foot * 1.10], [1.00, foot]
  ];
}
function swayX(v) { return Math.sin(T * 0.6 + v.phase) * 4; }
function vesselPath(v) {
  var knots = knotsFor(v);
  var cx = v.bx + swayX(v), top = v.cy - v.height / 2, N = 56, i, y, hw;
  ctx.beginPath();
  ctx.moveTo(cx - interp(knots, 0), top);
  for (i = 1; i <= N; i++) {
    y = top + v.height * i / N;
    ctx.lineTo(cx - interp(knots, i / N), y);
  }
  ctx.lineTo(cx + interp(knots, 1), top + v.height);
  for (i = N - 1; i >= 0; i--) {
    y = top + v.height * i / N;
    ctx.lineTo(cx + interp(knots, i / N), y);
  }
  ctx.closePath();
  return cx;
}

function genAlpha(gen) {
  var a = Math.min(1, (T - gen.born) / 0.8);
  if (a < 0) a = 0;
  if (gen.fading) a *= Math.max(0, 1 - (T - gen.fadeStart) / 1.2);
  return a;
}
function alphaOf(v) {
  for (var g = 0; g < generations.length; g++) {
    if (generations[g].vessels.indexOf(v) >= 0) return genAlpha(generations[g]);
  }
  return 0;
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-20, -20, DW + 40, DH + 40);
  // drop generations that have fully faded, and orphan
  // their children so no line points at a vanished parent
  for (var g = generations.length - 1; g >= 0; g--) {
    if (generations[g].fading && genAlpha(generations[g]) <= 0) {
      var gone = generations[g].vessels;
      generations.splice(g, 1);
      for (var h = 0; h < generations.length; h++) {
        var vs = generations[h].vessels;
        for (var i = 0; i < vs.length; i++) {
          if (gone.indexOf(vs[i].parent) >= 0) vs[i].parent = null;
        }
      }
      layout();
    }
  }
  // connecting lines first, under the vessels: thin cream
  // lines from each parent's shoulder to its child's
  // shoulder, alpha pulsing on a slow sine
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  for (var k = 0; k < generations.length; k++) {
    var kids = generations[k].vessels;
    for (var j = 0; j < kids.length; j++) {
      var child = kids[j], parent = child.parent;
      if (!parent) continue;
      var pulse = 0.5 + 0.5 * Math.sin(T * 1.4 + child.phase);
      var a = (0.16 + 0.22 * pulse) * alphaOf(child) * alphaOf(parent);
      if (a <= 0.003) continue;
      var px = parent.bx + swayX(parent) + parent.belly * parent.height * 0.82;
      var py = parent.cy - parent.height * 0.18;
      var cx2 = child.bx + swayX(child) - child.belly * child.height * 0.82;
      var cy2 = child.cy - child.height * 0.18;
      ctx.strokeStyle = CREAM;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(cx2, cy2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  // the vessels themselves, flat filled silhouettes with a
  // ground coloured mouth ellipse at the rim
  for (var m = 0; m < generations.length; m++) {
    var ga = genAlpha(generations[m]);
    if (ga <= 0) continue;
    var list = generations[m].vessels;
    for (var n = 0; n < list.length; n++) {
      var v = list[n];
      ctx.globalAlpha = ga;
      var cx = vesselPath(v);
      ctx.fillStyle = v.colour;
      ctx.fill();
      ctx.fillStyle = GROUND;
      ctx.beginPath();
      ctx.ellipse(cx, v.cy - v.height / 2, v.neck * v.height * 0.92, 7, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ---- interaction -------------------------------------------------------------
// Tap anywhere: grow one new generation from the current
// youngest generation. At most five generations stay
// active; when a sixth would grow, the oldest child
// generation fades out. Never a reload.
function grow() {
  var last = generations[generations.length - 1];
  var gen = makeGeneration(last.vessels);
  gen.born = T;
  generations.push(gen);
  var active = 0, i;
  for (i = 0; i < generations.length; i++) if (!generations[i].fading) active++;
  if (active > 5) {
    for (i = 1; i < generations.length; i++) {
      if (!generations[i].fading) {
        generations[i].fading = true;
        generations[i].fadeStart = T;
        break;
      }
    }
  }
  layout();
}
canvas.addEventListener('pointerdown', function () { grow(); });

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the row keeps its shape at any aspect,
  // with the page ground in the piece's near-black ground
  var S = Math.min(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
