<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№641 Elevated Snapshot</title>
<style>
  html, body { margin: 0; padding: 0; background: #232323; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1982 Elevated Snapshot, CR7 / PP1229, study #258 ciara-reddy.
  // Three found arrangements, seen straight down or dead straight,
  // the way a phone snapshot sees them: a trash bin with tulips
  // and a coffee cup arranged by chance; a sheep standing under
  // the wrong warning sign; a football match watched off a
  // television screen, the players blurred, the sponsor boards
  // sharp. Each arrangement holds for a while, plain and funny
  // and oddly tender, then the next one drops in. Tap to drop
  // to the next snapshot; the camera gives a small settling
  // bounce like a hand lowering a phone. The tap turns the page
  // of a contact sheet. Never click to reload.
  var GROUND = '#232323'; // page ground, neutral dark gray

  // Fixed-phase first frame: FIRST_T = 2 s. Arrangement 0 (the
  // bin) is showing, the tulips mid tremble, so the first frame
  // is a plain overhead bin interior with tulips and a cup.
  var FIRST_T = 2;
  var SEED = 1982;

  // Arrangement order, fixed and cyclic: 0 bin, 1 sheep, 2 match,
  // then back to 0. The tap sequence is deterministic.
  var ARR_NAMES = ['bin', 'sheep', 'match'];
  var arr = 0;
  var lastTapT = -100; // virtual time of the last tap; -100 = none yet

  // QA probe hooks, read at load only:
  //   ?t=<seconds> sets the virtual clock.
  //   ?arr=<0|1|2> selects the arrangement.
  //   ?seed=<0|1|2> is an alias for the arrangement, so the
  //   node-canvas render tool (which passes its probe value as
  //   ?seed=) can render each arrangement.
  var probeT = null, probeArr = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    var ma = qs.match(/[?&]arr=([0-9]+)/);
    if (ma) { probeArr = parseInt(ma[1], 10) % 3; }
    if (probeArr === null) {
      var ms = qs.match(/[?&]seed=([0-9]+)/);
      if (ms) { probeArr = parseInt(ms[1], 10) % 3; }
    }
  } catch (e) {}
  if (probeArr !== null) { arr = probeArr; }

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgba(r, g, b, a) {
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function disc(x, y, r, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  var L = {};
  function layout() {
    L.S = Math.min(W, H);
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.fsBoard = Math.round(clamp(W * 0.020, 10, 15));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Arrangement 0: the bin ----------------------------------
  // Straight down into a bin: dark interior, three tulips laid
  // across it by chance, a coffee cup, crumpled paper, a bottle
  // cap, a straw. One tulip trembles, slowly, the whole time.
  function drawBin(t) {
    var S = L.S, cx = W / 2, cy = H / 2;
    // Bin interior and rim.
    disc(cx, cy, S * 0.47, '#17171a');
    ctx.strokeStyle = '#5c5c60';
    ctx.lineWidth = Math.max(2, S * 0.012);
    ctx.beginPath();
    ctx.moveTo(cx + S * 0.47, cy);
    ctx.arc(cx, cy, S * 0.47, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = '#3a3a3e';
    ctx.lineWidth = Math.max(1, S * 0.004);
    ctx.beginPath();
    ctx.moveTo(cx + S * 0.435, cy);
    ctx.arc(cx, cy, S * 0.435, 0, Math.PI * 2);
    ctx.stroke();

    // Crumpled paper balls, fixed by seed.
    var rng = mulberry32(SEED * 13 + 5);
    var i, px, py, pr;
    for (i = 0; i < 3; i++) {
      px = cx + (rng() - 0.5) * S * 0.62;
      py = cy + (rng() - 0.5) * S * 0.60;
      pr = S * (0.045 + rng() * 0.025);
      disc(px, py, pr, '#c9c9c2');
      ctx.strokeStyle = 'rgba(90,90,86,0.8)';
      ctx.lineWidth = Math.max(1, S * 0.002);
      ctx.beginPath();
      ctx.moveTo(px - pr * 0.5, py - pr * 0.2);
      ctx.lineTo(px + pr * 0.1, py + pr * 0.3);
      ctx.moveTo(px + pr * 0.4, py - pr * 0.5);
      ctx.lineTo(px - pr * 0.1, py + pr * 0.1);
      ctx.stroke();
    }

    // Tulips: stems radiate from a loose knot near the bin's
    // lower left, heads at the ends. The middle tulip trembles.
    var knotX = cx - S * 0.16, knotY = cy + S * 0.18;
    var heads = [
      { dx: 0.30, dy: -0.26, c: '#d9392b', tremble: 0 },
      { dx: 0.05, dy: -0.33, c: '#e8b93a', tremble: 1 },
      { dx: -0.28, dy: -0.12, c: '#d96a8b', tremble: 0 }
    ];
    for (i = 0; i < 3; i++) {
      var hd = heads[i];
      var hx = cx + hd.dx * S, hy = cy + hd.dy * S;
      var sway = hd.tremble ? Math.sin(t * 1.1) * 0.035 : 0;
      // Stem, slightly bent toward the head.
      ctx.strokeStyle = '#4a7a3a';
      ctx.lineWidth = Math.max(2, S * 0.008);
      ctx.beginPath();
      ctx.moveTo(knotX, knotY);
      ctx.quadraticCurveTo(knotX + (hx - knotX) * 0.5, knotY + (hy - knotY) * 0.55 + S * 0.03, hx, hy + S * 0.03);
      ctx.stroke();
      // A leaf on the stem.
      ctx.fillStyle = '#557f43';
      ctx.beginPath();
      ctx.moveTo(knotX + (hx - knotX) * 0.45, knotY + (hy - knotY) * 0.5);
      ctx.quadraticCurveTo(knotX + (hx - knotX) * 0.45 + S * 0.05, knotY + (hy - knotY) * 0.5 - S * 0.02, knotX + (hx - knotX) * 0.45 + S * 0.02, knotY + (hy - knotY) * 0.5 + S * 0.05);
      ctx.closePath();
      ctx.fill();
      // Tulip head: three petals, swaying with the tremble.
      ctx.save();
      ctx.translate(hx, hy);
      ctx.rotate(sway);
      var pr2 = S * 0.052;
      ctx.fillStyle = hd.c;
      ctx.beginPath();
      ctx.moveTo(-pr2, 0);
      ctx.ellipse(-pr2 * 0.55, -pr2 * 0.25, pr2 * 0.55, pr2 * 0.95, -0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(pr2, 0);
      ctx.ellipse(pr2 * 0.55, -pr2 * 0.25, pr2 * 0.55, pr2 * 0.95, 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, -pr2);
      ctx.ellipse(0, -pr2 * 0.35, pr2 * 0.6, pr2 * 1.05, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Coffee cup, top right of the bin interior, tipped on its side.
    var cupX = cx + S * 0.22, cupY = cy + S * 0.20;
    ctx.save();
    ctx.translate(cupX, cupY);
    ctx.rotate(0.5);
    disc(0, 0, S * 0.085, '#f0ede6');
    disc(0, 0, S * 0.062, '#6b4226');
    disc(S * 0.012, -S * 0.012, S * 0.045, '#7d5233');
    ctx.strokeStyle = '#f0ede6';
    ctx.lineWidth = Math.max(2, S * 0.010);
    ctx.beginPath();
    ctx.moveTo(S * 0.085, -S * 0.02);
    ctx.arc(S * 0.085, 0, S * 0.032, -Math.PI * 0.45, Math.PI * 0.45);
    ctx.stroke();
    ctx.restore();
    // Coffee ring stain beside the cup.
    ctx.strokeStyle = rgba(107, 66, 38, 0.55);
    ctx.lineWidth = Math.max(1, S * 0.004);
    ctx.beginPath();
    ctx.moveTo(cupX - S * 0.02 + S * 0.055, cupY + S * 0.10);
    ctx.arc(cupX - S * 0.02, cupY + S * 0.10, S * 0.055, 0.3, Math.PI * 2 - 0.4);
    ctx.stroke();

    // A bottle cap and a straw, the rest of the arrangement.
    disc(cx - S * 0.30, cy + S * 0.28, S * 0.028, '#b3271e');
    disc(cx - S * 0.30, cy + S * 0.28, S * 0.016, '#d8d8d2');
    ctx.save();
    ctx.translate(cx + S * 0.02, cy - S * 0.30);
    ctx.rotate(-0.7);
    ctx.fillStyle = '#c8442c';
    ctx.fillRect(-S * 0.09, -S * 0.006, S * 0.18, S * 0.012);
    ctx.fillStyle = '#f0ede6';
    ctx.fillRect(-S * 0.09, -S * 0.006, S * 0.03, S * 0.012);
    ctx.fillRect(-S * 0.03, -S * 0.006, S * 0.03, S * 0.012);
    ctx.restore();
  }

  // ---- Arrangement 1: the sheep --------------------------------
  // Dead straight: a green field, a warning sign on a post, and
  // a sheep standing underneath it. The sign warns of falling
  // rocks. The sheep blinks.
  function drawSheep(t) {
    var S = L.S, cx = W / 2, cy = H / 2;
    // Field: flat green with mowing bands and seeded speckles.
    ctx.fillStyle = '#4d8a3f';
    ctx.fillRect(0, 0, W, H);
    var i;
    for (i = 0; i < 6; i++) {
      ctx.fillStyle = (i % 2 === 0) ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.05)';
      ctx.fillRect(0, (H / 6) * i, W, H / 6);
    }
    var rng = mulberry32(SEED * 29 + 11);
    for (i = 0; i < 240; i++) {
      var gx = rng() * W, gy = rng() * H;
      ctx.fillStyle = rgba(30, 90, 25, a4(0.10 + rng() * 0.16));
      ctx.fillRect(gx, gy, Math.max(1, S * 0.003), Math.max(1, S * 0.003));
    }

    // Sign post and the wrong warning sign, upper right.
    var postX = cx + S * 0.26, postTop = cy - S * 0.36, postBot = cy + S * 0.10;
    ctx.fillStyle = '#8a8d90';
    ctx.fillRect(postX - S * 0.008, postTop, S * 0.016, postBot - postTop);
    var triC = { x: postX, y: postTop + S * 0.02 };
    var triR = S * 0.115;
    ctx.fillStyle = '#f2c200';
    ctx.beginPath();
    ctx.moveTo(triC.x, triC.y - triR);
    ctx.lineTo(triC.x + triR * 0.95, triC.y + triR * 0.75);
    ctx.lineTo(triC.x - triR * 0.95, triC.y + triR * 0.75);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#111111';
    ctx.lineWidth = Math.max(2, S * 0.008);
    ctx.stroke();
    // Pictogram: two falling rocks with motion ticks.
    ctx.fillStyle = '#111111';
    ctx.beginPath();
    ctx.moveTo(triC.x - S * 0.045, triC.y + S * 0.02);
    ctx.lineTo(triC.x - S * 0.01, triC.y - S * 0.02);
    ctx.lineTo(triC.x + S * 0.025, triC.y + S * 0.015);
    ctx.lineTo(triC.x - S * 0.005, triC.y + S * 0.045);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(triC.x + S * 0.02, triC.y + S * 0.055);
    ctx.lineTo(triC.x + S * 0.05, triC.y + S * 0.03);
    ctx.lineTo(triC.x + S * 0.065, triC.y + S * 0.06);
    ctx.lineTo(triC.x + S * 0.035, triC.y + S * 0.075);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#111111';
    ctx.lineWidth = Math.max(1, S * 0.004);
    ctx.beginPath();
    ctx.moveTo(triC.x - S * 0.055, triC.y - S * 0.045);
    ctx.lineTo(triC.x - S * 0.045, triC.y - S * 0.02);
    ctx.moveTo(triC.x + S * 0.055, triC.y - S * 0.03);
    ctx.lineTo(triC.x + S * 0.045, triC.y - S * 0.005);
    ctx.stroke();

    // Sheep, center left, standing under the sign. Seen from
    // slightly above, body first: a cluster of wool circles,
    // a black head, four legs, a soft shadow.
    var shX = cx - S * 0.10, shY = cy + S * 0.08;
    ctx.fillStyle = rgba(0, 0, 0, 0.18);
    ctx.beginPath();
    ctx.moveTo(shX + S * 0.24, shY + S * 0.10);
    ctx.ellipse(shX, shY + S * 0.10, S * 0.24, S * 0.05, 0, 0, Math.PI * 2);
    ctx.fill();
    // Legs.
    ctx.fillStyle = '#2b2b2b';
    var lx;
    for (i = 0; i < 4; i++) {
      lx = shX - S * 0.15 + i * S * 0.085;
      ctx.fillRect(lx, shY + S * 0.04, S * 0.022, S * 0.075);
    }
    // Wool: a cluster of seeded circles.
    var wrng = mulberry32(SEED * 41 + 3);
    var wool = [];
    for (i = 0; i < 11; i++) {
      wool.push({
        x: shX + (wrng() - 0.5) * S * 0.30,
        y: shY + (wrng() - 0.5) * S * 0.13,
        r: S * (0.045 + wrng() * 0.03)
      });
    }
    var j;
    for (j = 0; j < wool.length; j++) {
      disc(wool[j].x, wool[j].y, wool[j].r, '#e9e6dd');
    }
    for (j = 0; j < wool.length; j++) {
      disc(wool[j].x - wool[j].r * 0.2, wool[j].y - wool[j].r * 0.25, wool[j].r * 0.55, 'rgba(255,255,255,0.5)');
    }
    // Head, black, at the right end of the body, facing right.
    var hdX = shX + S * 0.20, hdY = shY - S * 0.02;
    ctx.fillStyle = '#1d1a18';
    ctx.beginPath();
    ctx.moveTo(hdX + S * 0.055, hdY);
    ctx.ellipse(hdX, hdY, S * 0.055, S * 0.038, 0.15, 0, Math.PI * 2);
    ctx.fill();
    // Ear.
    ctx.fillStyle = '#1d1a18';
    ctx.beginPath();
    ctx.moveTo(hdX - S * 0.02, hdY - S * 0.03);
    ctx.ellipse(hdX - S * 0.03, hdY - S * 0.035, S * 0.03, S * 0.012, -0.5, 0, Math.PI * 2);
    ctx.fill();
    // Eye, blinking: open except for a brief shut every 4 s.
    var phase = ((t % 4) + 4) % 4;
    var open = phase < 3.85 ? 1 : smooth((4 - phase) / 0.15);
    var eyeY = hdY - S * 0.008;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(hdX + S * 0.028, eyeY);
    ctx.ellipse(hdX + S * 0.012, eyeY, S * 0.016, S * 0.011 * open + S * 0.001, 0, 0, Math.PI * 2);
    ctx.fill();
    if (open > 0.4) {
      disc(hdX + S * 0.014, eyeY, S * 0.006, '#111111');
    }
    // Tail tuft.
    disc(shX - S * 0.20, shY - S * 0.02, S * 0.03, '#e9e6dd');
  }

  // ---- Arrangement 2: the televised match ----------------------
  // A television fills the frame. Inside the screen a football
  // pitch, the players blurred blobs in red and blue drifting
  // slowly, the ball a white dot. The sponsor boards around the
  // pitch are razor sharp. The screen flickers, faintly.
  function drawMatch(t) {
    var S = L.S;
    // Room wall behind the set.
    ctx.fillStyle = '#3a3630';
    ctx.fillRect(0, 0, W, H);
    // TV bezel.
    var bx = W * 0.04, by = H * 0.06, bw = W * 0.92, bh = H * 0.82;
    ctx.fillStyle = '#101010';
    ctx.fillRect(bx, by, bw, bh);
    // Screen.
    var sx = bx + bw * 0.025, sy = by + bh * 0.035;
    var sw = bw * 0.95, sh = bh * 0.93;
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(sx, sy, sw, sh);
    // Mowing stripes.
    var i;
    for (i = 0; i < 8; i++) {
      if (i % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(sx + (sw / 8) * i, sy, sw / 8, sh);
      }
    }
    // Pitch lines: boundary, halfway line, center circle,
    // penalty boxes. Crisp white, slightly soft alpha.
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = Math.max(1, S * 0.004);
    ctx.strokeRect(sx + sw * 0.06, sy + sh * 0.10, sw * 0.88, sh * 0.80);
    ctx.beginPath();
    ctx.moveTo(sx + sw * 0.5, sy + sh * 0.10);
    ctx.lineTo(sx + sw * 0.5, sy + sh * 0.90);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sx + sw * 0.5 + sh * 0.14, sy + sh * 0.5);
    ctx.arc(sx + sw * 0.5, sy + sh * 0.5, sh * 0.14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeRect(sx + sw * 0.06, sy + sh * 0.30, sw * 0.12, sh * 0.40);
    ctx.strokeRect(sx + sw * 0.82, sy + sh * 0.30, sw * 0.12, sh * 0.40);

    // Players: blurred blobs, red vs blue, drifting slowly.
    // Blur is faked with three offset translucent discs per
    // player, so the kits smear and the boards stay sharp.
    var prng = mulberry32(SEED * 53 + 7);
    var players = [];
    for (i = 0; i < 10; i++) {
      players.push({
        bx: 0.12 + prng() * 0.76,
        by: 0.16 + prng() * 0.68,
        dx: 0.02 + prng() * 0.03,
        dy: 0.02 + prng() * 0.03,
        ph: prng() * 6.28,
        red: i < 5
      });
    }
    for (i = 0; i < players.length; i++) {
      var p = players[i];
      var px = sx + sw * (p.bx + Math.sin(t * 0.22 + p.ph) * p.dx);
      var py = sy + sh * (p.by + Math.cos(t * 0.17 + p.ph) * p.dy);
      var pr = S * 0.020;
      var col = p.red ? '214,48,38' : '38,80,200';
      var k;
      for (k = 0; k < 3; k++) {
        disc(px + (k - 1) * S * 0.008, py + (k - 1) * S * 0.005, pr, 'rgba(' + col + ',' + a4(0.28) + ')');
      }
      disc(px, py, pr * 0.85, 'rgba(' + col + ',' + a4(0.75) + ')');
      // A dark head dot, so each blob reads as a player.
      disc(px, py - pr * 0.9, S * 0.008, 'rgba(20,16,12,0.85)');
    }
    // The ball, a white dot near the center, nudged by play.
    var ballX = sx + sw * (0.5 + Math.sin(t * 0.31) * 0.06);
    var ballY = sy + sh * (0.5 + Math.cos(t * 0.23) * 0.05);
    disc(ballX, ballY, S * 0.010, '#f5f5f0');

    // Sponsor boards, top and bottom of the screen: sharp
    // rectangles, crisp text, no blur anywhere near them.
    var boards = [
      { label: 'MUSE', bg: '#c8102e' },
      { label: 'FLY', bg: '#0b5fa5' },
      { label: 'SAI', bg: '#111111' },
      { label: '№641', bg: '#e8b93a' },
      { label: 'DOODLES', bg: '#0f7a4d' }
    ];
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + L.fsBoard + 'px Georgia, "Times New Roman", serif';
    var bw2 = sw / boards.length;
    for (i = 0; i < boards.length; i++) {
      ctx.fillStyle = boards[i].bg;
      ctx.fillRect(sx + bw2 * i + 1, sy + 1, bw2 - 2, sh * 0.075);
      ctx.fillRect(sx + bw2 * i + 1, sy + sh * 0.925 - 1, bw2 - 2, sh * 0.075);
      ctx.fillStyle = boards[i].bg === '#e8b93a' ? '#111111' : '#ffffff';
      ctx.fillText(boards[i].label, sx + bw2 * (i + 0.5), sy + sh * 0.0375);
      ctx.fillText(boards[i].label, sx + bw2 * (i + 0.5), sy + sh * 0.9625);
    }
    ctx.textAlign = 'left';

    // Screen flicker, faint, about 5 Hz by construction.
    var fl = 0.02 + 0.015 * Math.sin(t * Math.PI * 2 * 5);
    ctx.fillStyle = rgba(255, 255, 255, a4(fl));
    ctx.fillRect(sx, sy, sw, sh);
    // TV standby dot, bottom right of the bezel.
    disc(bx + bw * 0.97, by + bh * 0.985, S * 0.005, '#d9392b');
  }

  // ---- Plates ----------------------------------------------------
  function plate(x, y, w, h) {
    ctx.fillStyle = rgba(0, 0, 0, 0.42);
    ctx.beginPath();
    var r = Math.min(h / 2, 10);
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function drawPlates() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    var capW = ctx.measureText('№641 · Elevated Snapshot').width;
    var padX = L.fsCap * 0.7, padY = L.fsCap * 0.55;
    var capX = W * 0.04, capY = H * 0.02;
    plate(capX, capY, capW + padX * 2, L.fsCap + L.fsDate + padY * 2 + L.fsCap * 0.35);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillText('№641 · Elevated Snapshot', capX + padX, capY + padY + L.fsCap);
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText('2007 · 06 · 16', capX + padX, capY + padY + L.fsCap + L.fsDate + L.fsCap * 0.35);

    ctx.textAlign = 'center';
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    var hintW = ctx.measureText('Tap for the next snapshot.').width;
    var hintX = (W - hintW) / 2 - padX;
    var hintY = H - L.fsHint * 2.1;
    plate(hintX, hintY, hintW + padX * 2, L.fsHint + padY * 1.4);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillText('Tap for the next snapshot.', W / 2, hintY + padY * 0.7 + L.fsHint);
    ctx.textAlign = 'left';
  }

  // ---- Draw ------------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Settling bounce after a tap: the new arrangement drops in
    // from above and overshoots once, like a hand lowering a
    // phone. Damped cosine, about 1.4 s to settle.
    var tau = t - lastTapT;
    ctx.save();
    if (tau >= 0 && tau < 1.4) {
      var k = Math.exp(-3.2 * tau);
      var c = Math.cos(6.5 * tau);
      var off = -0.16 * H * k * c;
      var sc = 1 + 0.04 * k * c;
      ctx.translate(W / 2, H / 2 + off);
      ctx.scale(sc, sc);
      ctx.translate(-W / 2, -H / 2);
    }
    if (arr === 0) { drawBin(t); }
    else if (arr === 1) { drawSheep(t); }
    else { drawMatch(t); }
    ctx.restore();

    drawPlates();
  }

  // Tap advances to the next arrangement. The tap turns the page
  // of a contact sheet; it never reloads and never reseeds.
  function onTap() {
    arr = (arr + 1) % 3;
    lastTapT = lastT;
    if (reduced) { draw(lastT); }
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onTap);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1982 exposes the arrangement state and the tap.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1982 = {
      firstT: FIRST_T,
      arrangement: function () { return ARR_NAMES[arr]; },
      arrangementIndex: function () { return arr; },
      setArr: function (n) { arr = ((n % 3) + 3) % 3; lastTapT = -100; draw(lastT); },
      tap: function () { onTap(); },
      state: function (t) { return { t: t, arr: ARR_NAMES[arr] }; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the tulip trembles, the sheep blinks, the match
  // flickers and the players drift. Guarded so node-canvas QA
  // (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
