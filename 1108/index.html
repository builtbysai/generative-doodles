<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Machine Dreams</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0906; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) + integer hash ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash01(a, b, c) {
    var h = (a >>> 0) ^ Math.imul((b | 0) + 0x9E37, 0x85EBCA6B) ^ Math.imul((c | 0) + 0x27D4, 0xC2B2AE35);
    h ^= h >>> 13; h = Math.imul(h, 0x165667B1); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  // the machine's dream sequence: one seed per dream, any integer index
  function seedAt(k) {
    var h = (11081108 ^ Math.imul((k | 0) + 0x9E37, 0x85EBCA6B)) >>> 0;
    h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35) >>> 0; h ^= h >>> 16;
    return h >>> 0;
  }

  // ---------- helpers ----------
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function sstep(a, b, x) { var f = clamp((x - a) / (b - a), 0, 1); return f * f * (3 - 2 * f); }
  function rgba(r, g, b, a) { return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }
  var TAU = Math.PI * 2;

  // ---------- palette ----------
  var BG = '#0B0906';            // deep shadow
  var STONE_D = [42, 36, 30];    // #2A241E
  var STONE_M = [62, 54, 44];    // #3E362C
  var CYAN = [77, 216, 200];     // #4DD8C8
  var TEAL = [30, 122, 110];     // #1E7A6E
  var FRAME = [138, 147, 160];   // #8A93A0

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var vw = 720, vh = 720, dpr = 1;
  var stageSide = 720, offX = 0, offY = 0, isPhone = false;

  function resize() {
    var vv = window.visualViewport;
    vw = (vv && vv.width) ? vv.width : window.innerWidth;
    vh = (vv && vv.height) ? vv.height : window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    var sw = (window.screen && window.screen.width) || vw;
    var sh = (window.screen && window.screen.height) || vh;
    isPhone = (Math.min(sw, sh) < 700) || (vh > vw * 1.15);
    stageSide = Math.min(vw, vh);
    offX = (vw - stageSide) / 2;
    offY = (vh - stageSide) / 2;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- layout (stage units, 0..1) ----------
  var MAIN = { x: 0.175, y: 0.045, s: 0.65 };           // the dream, ~65% of frame
  var SPEC_S = 0.20, SPEC_Y = 0.765;
  var SPEC_X = [0.16, 0.40, 0.64];

  // ---------- chimera generator ----------
  // One parameterized spec per seed; the SAME draw function renders the
  // main view and every specimen, so a specimen is a real dream, promotable.
  function specFromSeed(seed) {
    var rng = mulberry32(seed);
    var spec = { seed: seed, masses: [], clusters: [], coverage: 0 };
    var nm = 2 + (rng() < 0.62 ? 1 : 0), i, j;
    for (i = 0; i < nm; i++) {
      var m = {
        cx: 0.30 + rng() * 0.40, cy: 0.30 + rng() * 0.40,
        R: 0.20 + rng() * 0.13,
        tone: (i % 2 === 0) ? STONE_D : STONE_M,
        warpAmp: 0.05 + rng() * 0.09, warpPh: rng() * TAU,
        ph0: rng() * TAU, harm: [], fils: []
      };
      for (j = 0; j < 3; j++) {
        m.harm.push({ k: 2 + ((rng() * 4) | 0), a: 0.05 + rng() * 0.10, ph: rng() * TAU, dr: (rng() - 0.5) * 0.07 });
      }
      var nf = 12 + ((rng() * 6) | 0);
      for (j = 0; j < nf; j++) {
        m.fils.push({ th: rng() * TAU, len: 0.10 + rng() * 0.16, bright: rng() < 0.30 });
      }
      spec.masses.push(m);
    }
    var nc = 6 + ((rng() * 4) | 0), shardTotal = 0;
    for (i = 0; i < nc; i++) {
      var shards = 3 + ((rng() * 4) | 0);
      shardTotal += shards;
      spec.clusters.push({
        mass: (rng() * nm) | 0, theta: rng() * TAU, frac: 0.42 + rng() * 0.52,
        baseAng: rng() * TAU, phase: rng() * TAU,
        size: 0.055 + rng() * 0.055, shards: shards,
        jx: hash01(seed, i, 991) * 2 - 1, jy: hash01(seed, i, 992) * 2 - 1,
        ja: hash01(seed, i, 993) * 2 - 1
      });
    }
    spec.coverage = clamp(shardTotal / 46, 0.15, 1);
    return spec;
  }

  function massRadius(m, th, t) {
    var r = m.R, i;
    for (i = 0; i < m.harm.length; i++) {
      var h = m.harm[i];
      r += m.R * h.a * Math.sin(h.k * th + h.ph + h.dr * t);
    }
    return r * (1 + 0.016 * Math.sin(t * 0.5 + m.ph0));
  }
  function massPoint(m, th, t, out) {
    var tw = th + m.warpAmp * Math.sin(2 * th + m.warpPh + 0.03 * t);
    var r = massRadius(m, tw, t);
    out[0] = m.cx + Math.cos(tw) * r;
    out[1] = m.cy + Math.sin(tw) * r;
    return out;
  }

  var P = [0, 0];
  function massPath(m, t, scale, ox, oy) {
    var N = 46, i;
    ctx.beginPath();
    for (i = 0; i <= N; i++) {
      var th = (i / N) * TAU;
      massPoint(m, th, t, P);
      var x = m.cx + (P[0] - m.cx) * scale + ox;
      var y = m.cy + (P[1] - m.cy) * scale + oy;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // stirs: [{x, y (stage coords), t}] — main view only
  function drawChimera(spec, rx, ry, side, t, alpha, stirs) {
    ctx.save();
    ctx.translate(rx, ry);
    ctx.scale(side, side);
    ctx.globalAlpha = alpha;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    var i, j, m;

    // masses: layered flat shapes (outer tone, inner counter-tone, core tone)
    for (i = 0; i < spec.masses.length; i++) {
      m = spec.masses[i];
      var other = (m.tone === STONE_D) ? STONE_M : STONE_D;
      massPath(m, t, 1.0, 0, 0);
      ctx.fillStyle = rgba(m.tone[0], m.tone[1], m.tone[2], 1);
      ctx.fill();
      ctx.strokeStyle = rgba(11, 9, 6, 0.55);
      ctx.lineWidth = 0.006;
      ctx.stroke();
      massPath(m, t, 0.79, 0.012, -0.010);
      ctx.fillStyle = rgba(other[0], other[1], other[2], 0.92);
      ctx.fill();
      massPath(m, t, 0.56, 0.022, -0.018);
      ctx.fillStyle = rgba(m.tone[0], m.tone[1], m.tone[2], 0.95);
      ctx.fill();
    }

    // filament veins: short bright segments riding the mass contours
    var p1 = [0, 0], p2 = [0, 0];
    for (i = 0; i < spec.masses.length; i++) {
      m = spec.masses[i];
      for (j = 0; j < m.fils.length; j++) {
        var f = m.fils[j];
        massPoint(m, f.th, t, p1);
        massPoint(m, f.th + f.len, t, p2);
        var x1 = m.cx + (p1[0] - m.cx) * 0.93, y1 = m.cy + (p1[1] - m.cy) * 0.93;
        var x2 = m.cx + (p2[0] - m.cx) * 0.93, y2 = m.cy + (p2[1] - m.cy) * 0.93;
        if (f.bright) ctx.strokeStyle = rgba(CYAN[0], CYAN[1], CYAN[2], 0.34);
        else ctx.strokeStyle = rgba(TEAL[0], TEAL[1], TEAL[2], 0.42);
        ctx.lineWidth = 0.0042;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }

    // crystal clusters: honest polygon shards with inner facets
    for (i = 0; i < spec.clusters.length; i++) {
      var c = spec.clusters[i];
      m = spec.masses[c.mass];
      massPoint(m, c.theta, t, P);
      var lx = m.cx + (P[0] - m.cx) * c.frac;
      var ly = m.cy + (P[1] - m.cy) * c.frac;
      var pulse = 0.60 + 0.40 * Math.sin(t * 0.9 + c.phase);
      var jitA = 0, jx = 0, jy = 0;
      if (stirs) {
        var sx = rx + lx * side, sy = ry + ly * side, w = 0, s2;
        for (s2 = 0; s2 < stirs.length; s2++) {
          var st = stirs[s2], age = t - st.t;
          if (age < 0 || age > 12) continue;
          var dx = sx - st.x, dy = sy - st.y;
          w += Math.exp(-(dx * dx + dy * dy) / (2 * 0.08 * 0.08)) * Math.exp(-age / 6);
        }
        if (w > 0.02) {
          var ww = Math.min(w, 1.2);
          jx = c.jx * ww * 0.030; jy = c.jy * ww * 0.030; jitA = c.ja * ww * 0.55;
        }
      }
      lx += jx; ly += jy;
      // halo
      ctx.fillStyle = rgba(CYAN[0], CYAN[1], CYAN[2], 0.07 * pulse + 0.02);
      ctx.beginPath();
      ctx.arc(lx, ly, c.size * 1.55, 0, TAU);
      ctx.fill();
      for (j = 0; j < c.shards; j++) {
        var ang = c.baseAng + jitA + (j - (c.shards - 1) / 2) * 0.52;
        var len = c.size * (0.72 + 0.55 * hash01(spec.seed, i * 17 + j, 555));
        var wid = c.size * 0.30;
        var tx = lx + Math.cos(ang) * len, ty = ly + Math.sin(ang) * len;
        var px = Math.cos(ang + Math.PI / 2) * wid, py = Math.sin(ang + Math.PI / 2) * wid;
        ctx.fillStyle = rgba(CYAN[0], CYAN[1], CYAN[2], 0.30 + 0.34 * pulse);
        ctx.beginPath();
        ctx.moveTo(lx + px, ly + py);
        ctx.lineTo(tx, ty);
        ctx.lineTo(lx - px, ly - py);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = rgba(CYAN[0], CYAN[1], CYAN[2], 0.55 * pulse + 0.15);
        ctx.lineWidth = 0.0026;
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.lineTo(tx, ty);
        ctx.stroke();
      }
      ctx.fillStyle = rgba(CYAN[0], CYAN[1], CYAN[2], 0.40 + 0.30 * pulse);
      ctx.beginPath();
      ctx.arc(lx, ly, c.size * 0.16, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---------- dream state ----------
  var PHASE = 12;                 // fixed phase for frame one
  var tNow = PHASE;
  var dreamK = 0;
  var mainSpec = specFromSeed(seedAt(0));
  var trans = null;               // {from, to, t0, dur}
  var nextDream = 30;             // the machine dreams every ~30 s
  var specimens = [];
  (function () {
    for (var i = 0; i < 3; i++) {
      var sd = seedAt(-1 - i);
      specimens.push({ seed: sd, spec: specFromSeed(sd), born: -10 });
    }
  })();
  var specNonce = 0;
  var stirs = [];

  function startTransition(toSpec, t, dur) {
    trans = { from: mainSpec, to: toSpec, t0: t, dur: dur };
    mainSpec = toSpec;
  }
  function advance(t) {
    if (trans && t > trans.t0 + trans.dur) trans = null;
    if (!trans && t >= nextDream) {
      var old = mainSpec;
      dreamK += 1;
      var ns = specFromSeed(seedAt(dreamK));
      specimens = [{ seed: old.seed, spec: old, born: t }, specimens[0], specimens[1]];
      startTransition(ns, t, 3.5);
      nextDream = t + 30;
    }
    // prune dead stirs
    for (var i = stirs.length - 1; i >= 0; i--) {
      if (t - stirs[i].t > 12) stirs.splice(i, 1);
    }
  }

  // ---------- audio (lazy, gesture-gated, visuals never depend on it) ----------
  var AC = null, masterGain = null, audioTried = false, nextPing = 0, pingIx = 0;
  function startAudio() {
    if (audioTried) { if (AC && AC.resume) { try { AC.resume(); } catch (e) {} } return; }
    audioTried = true;
    try {
      if (typeof window === 'undefined') return;
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      AC = new Ctx();
      masterGain = AC.createGain();
      masterGain.gain.value = 0.9;
      var lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 240;
      var dg = AC.createGain(); dg.gain.value = 0.045;
      var o1 = AC.createOscillator(); o1.type = 'sine'; o1.frequency.value = 54;
      var o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 81.3;
      var og2 = AC.createGain(); og2.gain.value = 0.4;
      o1.connect(dg); o2.connect(og2); og2.connect(dg);
      dg.connect(lp); lp.connect(masterGain); masterGain.connect(AC.destination);
      o1.start(); o2.start();
    } catch (e) { AC = null; }
  }
  var PING_NOTES = [523.25, 659.25, 783.99, 1046.5, 880.0];
  function maybePing(t) {
    if (!AC || !masterGain) return;
    if (t < nextPing) return;
    var cov = mainSpec ? mainSpec.coverage : 0.4;
    nextPing = t + (2.6 - 1.9 * cov) * (0.7 + 0.6 * hash01(777, pingIx, 31));
    pingIx++;
    try {
      var o = AC.createOscillator();
      o.type = 'sine';
      o.frequency.value = PING_NOTES[(pingIx * 7 + 3) % PING_NOTES.length];
      var g = AC.createGain();
      var t0 = AC.currentTime;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.055, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.3);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + 1.4);
    } catch (e) {}
  }

  // ---------- drawing ----------
  function draw() {
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    var t = tNow;
    advance(t);
    maybePing(t);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, vw, vh);
    ctx.translate(offX, offY);
    ctx.scale(stageSide, stageSide);
    var unit = 1 / (dpr * stageSide);

    // main dream (dissolve crossfade during transitions)
    if (trans) {
      var f = sstep(trans.t0, trans.t0 + trans.dur, t);
      if (f < 1) drawChimera(trans.from, MAIN.x, MAIN.y, MAIN.s, t, 1 - f, stirs);
      drawChimera(trans.to, MAIN.x, MAIN.y, MAIN.s, t, Math.max(f, 0.001), stirs);
    } else {
      drawChimera(mainSpec, MAIN.x, MAIN.y, MAIN.s, t, 1, stirs);
    }

    // specimen frames along the bottom edge: real seeded dreams, curated
    ctx.lineWidth = 1.2 * unit;
    for (var i = 0; i < 3; i++) {
      var sp = specimens[i];
      var sx = SPEC_X[i], sy = SPEC_Y;
      ctx.fillStyle = BG;
      ctx.fillRect(sx, sy, SPEC_S, SPEC_S);
      var fade = clamp((t - sp.born) / 1.0, 0, 1);
      if (fade > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(sx, sy, SPEC_S, SPEC_S);
        ctx.clip();
        drawChimera(sp.spec, sx, sy, SPEC_S, t, fade, null);
        ctx.restore();
      }
      ctx.strokeStyle = rgba(FRAME[0], FRAME[1], FRAME[2], 0.75);
      ctx.strokeRect(sx, sy, SPEC_S, SPEC_S);
    }
  }

  // ---------- pointer: tap = curate, drag = stir, double-tap = new specimens ----------
  function toStage(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return [(e.clientX - rect.left - offX) / stageSide, (e.clientY - rect.top - offY) / stageSide];
  }
  var pDownPos = null, pDownT = 0, pMoved = false, lastTapT = -10, lastStir = null;
  function specimenAt(s) {
    for (var i = 0; i < 3; i++) {
      if (s[0] >= SPEC_X[i] && s[0] <= SPEC_X[i] + SPEC_S && s[1] >= SPEC_Y && s[1] <= SPEC_Y + SPEC_S) return i;
    }
    return -1;
  }
  function inMain(s) {
    return s[0] >= MAIN.x - 0.03 && s[0] <= MAIN.x + MAIN.s + 0.03 &&
           s[1] >= MAIN.y - 0.03 && s[1] <= MAIN.y + MAIN.s + 0.03;
  }
  function promote(i) {
    var t = tNow;
    if (trans) trans = null;
    var old = mainSpec;
    var target = specimens[i].spec;
    startTransition(target, t, 2.5);
    specimens[i] = { seed: old.seed, spec: old, born: t };
    nextDream = t + 30;
  }
  function newSpecimens() {
    var t = tNow;
    for (var i = 0; i < 3; i++) {
      var sd = seedAt(1000 + specNonce * 3 + i);
      specimens[i] = { seed: sd, spec: specFromSeed(sd), born: t };
    }
    specNonce++;
  }
  function pDown(e) {
    startAudio();
    var s = toStage(e);
    pDownPos = s; pDownT = tNow; pMoved = false; lastStir = null;
  }
  function pMove(e) {
    if (!pDownPos) return;
    var s = toStage(e);
    var dx = s[0] - pDownPos[0], dy = s[1] - pDownPos[1];
    if (!pMoved && dx * dx + dy * dy > 0.012 * 0.012) pMoved = true;
    if (pMoved && inMain(s)) {
      if (!lastStir || Math.abs(s[0] - lastStir[0]) > 0.012 || Math.abs(s[1] - lastStir[1]) > 0.012) {
        stirs.push({ x: s[0], y: s[1], t: tNow });
        if (stirs.length > 40) stirs.shift();
        lastStir = s;
      }
    }
  }
  function pUp(e) {
    if (!pDownPos) return;
    var wasDrag = pMoved;
    var s = toStage(e);
    pDownPos = null; pMoved = false;
    if (wasDrag) return;
    if (tNow - pDownT > 0.45) return;
    var si = specimenAt(s);
    if (si >= 0) { promote(si); lastTapT = -10; return; }
    if (inMain(s)) {
      if (tNow - lastTapT < 0.35) { newSpecimens(); lastTapT = -10; }
      else lastTapT = tNow;
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', pDown);
    canvas.addEventListener('pointermove', pMove);
    canvas.addEventListener('pointerup', pUp);
    canvas.addEventListener('pointercancel', function () { pDownPos = null; });
    canvas.addEventListener('mousedown', pDown);
    canvas.addEventListener('mousemove', pMove);
    canvas.addEventListener('mouseup', pUp);
  }

  // ---------- run: synchronous fixed-phase frame one, then rAF ----------
  draw();

  if (typeof requestAnimationFrame === 'function') {
    var start = null;
    var frame = function (now) {
      if (start === null) start = now;
      tNow = PHASE + (now - start) / 1000;
      draw();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
