<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>White on White</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #F7F4EC;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict, three tones, no accent)
  var PAPER = [247, 244, 236];   // #F7F4EC
  var SHADOW = [207, 196, 176];  // #CFC4B0
  var SLIT = [138, 122, 100];    // #8A7A64
  var PAPER_CSS = '#F7F4EC';
  var SLIT_CSS = '#8A7A64';

  // Seeded RNG (mulberry32)
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(607073);

  // Smooth value noise from a seeded lattice
  var LATTICE = 64;
  var lattice = new Float32Array(LATTICE * LATTICE);
  for (var li = 0; li < lattice.length; li++) lattice[li] = rng();
  function latticeAt(ix, iy) {
    ix = ((ix % LATTICE) + LATTICE) % LATTICE;
    iy = ((iy % LATTICE) + LATTICE) % LATTICE;
    return lattice[iy * LATTICE + ix];
  }
  function smoothNoise(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x - ix, fy = y - iy;
    var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    var a = latticeAt(ix, iy), b = latticeAt(ix + 1, iy);
    var c = latticeAt(ix, iy + 1), d = latticeAt(ix + 1, iy + 1);
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  }
  function fbm(x, y) {
    return smoothNoise(x, y) * 0.55 +
           smoothNoise(x * 2.13 + 17.3, y * 2.13 + 9.1) * 0.28 +
           smoothNoise(x * 4.31 + 41.7, y * 4.31 + 23.9) * 0.17;
  }

  // Incised rivers: three seeded quadratic curves in unit space
  var rivers = [];
  (function buildRivers() {
    var defs = [
      { p0: [-0.08, 0.30], p1: [0.38, 0.06], p2: [1.08, 0.52] },
      { p0: [-0.06, 0.78], p1: [0.52, 0.52], p2: [1.06, 0.94] },
      { p0: [0.22, -0.08], p1: [0.60, 0.44], p2: [0.94, 1.08] }
    ];
    for (var r = 0; r < defs.length; r++) {
      var d = defs[r], pts = [];
      for (var s = 0; s <= 240; s++) {
        var t = s / 240, mt = 1 - t;
        pts.push([
          mt * mt * d.p0[0] + 2 * mt * t * d.p1[0] + t * t * d.p2[0],
          mt * mt * d.p0[1] + 2 * mt * t * d.p1[1] + t * t * d.p2[1]
        ]);
      }
      rivers.push(pts);
    }
  })();
  function riverDist(u, v) {
    var best = 1e9;
    for (var r = 0; r < rivers.length; r++) {
      var pts = rivers[r];
      for (var s = 0; s < pts.length; s++) {
        var dx = u - pts[s][0], dy = v - pts[s][1];
        var dd = dx * dx + dy * dy;
        if (dd < best) best = dd;
      }
    }
    return Math.sqrt(best);
  }

  // Dune height field in unit space (diagonal flow: ridges run NW-SE,
  // meaning height varies fastest along the NE-SW diagonal)
  function heightAt(u, v) {
    var diag = (u * 0.72 + v * 0.28);        // coordinate across the flow
    var along = (-u * 0.28 + v * 0.72);      // coordinate along the flow
    var h = Math.sin(diag * 8.0 + fbm(u * 3.0, v * 3.0) * 3.0) * 0.56
          + Math.sin(diag * 16.0 - along * 1.5 + fbm(u * 5.0 + 7.0, v * 5.0) * 2.0) * 0.20
          + (fbm(u * 2.2 + 3.0, v * 2.2) - 0.5) * 0.38;
    // Carve the rivers: narrow smooth channels
    var rd = riverDist(u, v);
    var carve = Math.exp(-(rd * rd) / (2 * 0.021 * 0.021));
    h -= carve * 0.80;
    return h;
  }

  // Three cut slits: center (unit), angle, length, width (unit)
  var slits = [
    { u: 0.30, v: 0.34, ang: 0.62, len: 0.20, wid: 0.016 },
    { u: 0.66, v: 0.58, ang: 0.95, len: 0.26, wid: 0.019 },
    { u: 0.48, v: 0.82, ang: 0.45, len: 0.15, wid: 0.013 }
  ];

  // Precomputed paper grain (seeded speckle, unit space)
  var grain = [];
  (function buildGrain() {
    var grng = mulberry32(607999);
    for (var i = 0; i < 2600; i++) {
      grain.push({
        u: grng(), v: grng(),
        s: 0.6 + grng() * 1.5,
        a: 0.05 + grng() * 0.10,
        warm: grng() < 0.72
      });
    }
  })();

  // Shade palette: 64 steps from paper white to warm shadow
  var STEPS = 64;
  var palette = [];
  for (var pi = 0; pi < STEPS; pi++) {
    var pt = pi / (STEPS - 1);
    var r = Math.round(PAPER[0] + (SHADOW[0] - PAPER[0]) * pt);
    var g = Math.round(PAPER[1] + (SHADOW[1] - PAPER[1]) * pt);
    var b = Math.round(PAPER[2] + (SHADOW[2] - PAPER[2]) * pt);
    palette.push('rgb(' + r + ',' + g + ',' + b + ')');
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, isPhone = false;
  var cols = 0, rows = 0, heights = null, cellW = 0, cellH = 0;

  function computeSize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var sw = window.screen ? window.screen.width : W;
    var sh = window.screen ? window.screen.height : H;
    isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  }

  function buildField() {
    var target = isPhone ? 150 : 210; // columns across the long dimension
    if (W >= H) {
      cols = target;
      rows = Math.max(40, Math.round(target * H / W));
    } else {
      rows = target;
      cols = Math.max(40, Math.round(target * W / H));
    }
    heights = new Float32Array((cols + 1) * (rows + 1));
    for (var j = 0; j <= rows; j++) {
      for (var i = 0; i <= cols; i++) {
        heights[j * (cols + 1) + i] = heightAt(i / cols, j / rows);
      }
    }
    cellW = W / cols;
    cellH = H / rows;
  }

  function resize() {
    computeSize();
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    buildField();
    draw(currentPhase());
  }

  // Light: frame one is a fixed raking angle from the upper left.
  // phase 0 = that exact angle; the loop breathes around it on a 60 s cycle.
  var BREATH_MS = 60000;
  function lightAt(phase) {
    // azimuth base points from upper-left; elevation low (raking)
    var az = -2.25 + Math.sin(phase * Math.PI * 2) * 0.55;       // radians, direction light travels toward surface gradient
    var el = 0.38 + Math.sin(phase * Math.PI * 2 + 1.3) * 0.13;  // strength of raking component
    return { x: Math.cos(az) * el * 2.4, y: Math.sin(az) * el * 2.4, az: az };
  }

  function draw(phase) {
    if (!heights) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = PAPER_CSS;
    ctx.fillRect(0, 0, W, H);

    var L = lightAt(phase);
    var cw = cols + 1;
    var overlap = 0.6;
    // Slope from finite differences of the height grid; shade by how the
    // slope faces the light. Ambient 0.30 keeps flats near paper white.
    for (var j = 0; j < rows; j++) {
      var y0 = j * cellH;
      for (var i = 0; i < cols; i++) {
        var iL = i > 0 ? i - 1 : i, iR = i < cols - 1 ? i + 2 : i + 1;
        var jU = j > 0 ? j - 1 : j, jD = j < rows - 1 ? j + 2 : j + 1;
        var gx = (heights[j * cw + iR] - heights[j * cw + iL]) * cols * 0.030;
        var gy = (heights[jD * cw + i] - heights[jU * cw + i]) * rows * 0.030;
        var facing = -(gx * L.x + gy * L.y);
        var t = 0.30 + facing;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        var idx = (t * (STEPS - 1)) | 0;
        ctx.fillStyle = palette[idx];
        ctx.fillRect(i * cellW - overlap / 2, y0 - overlap / 2, cellW + overlap, cellH + overlap);
      }
    }

    // Grain speckle (seeded, fixed)
    for (var gi = 0; gi < grain.length; gi++) {
      var gp = grain[gi];
      ctx.fillStyle = gp.warm
        ? 'rgba(138,122,100,' + gp.a + ')'
        : 'rgba(207,196,176,' + gp.a + ')';
      ctx.fillRect(gp.u * W, gp.v * H, gp.s, gp.s);
    }

    // Three cut slits: the only hard events. Warm shadow underlay offset
    // away from the light, paper-white lip on the lit side, deep core.
    for (var si = 0; si < slits.length; si++) {
      var s = slits[si];
      var cx = s.u * W, cy = s.v * H;
      var lenPx = s.len * Math.min(W, H) * 1.35;
      var widPx = Math.max(2.2, s.wid * Math.min(W, H));
      var dx = Math.cos(s.ang), dy = Math.sin(s.ang);
      var nx = -dy, ny = dx;
      // unit vector pointing back toward the light source
      var lx = -Math.cos(L.az), ly = -Math.sin(L.az);
      drawSlit(cx + lx * -widPx * 0.55, cy + ly * -widPx * 0.55, dx, dy, nx, ny, lenPx, widPx * 1.5, 'rgba(207,196,176,0.85)');
      drawSlit(cx + lx * widPx * 0.5, cy + ly * widPx * 0.5, dx, dy, nx, ny, lenPx, widPx * 1.05, PAPER_CSS);
      drawSlit(cx, cy, dx, dy, nx, ny, lenPx, widPx, SLIT_CSS);
    }
  }

  function drawSlit(cx, cy, dx, dy, nx, ny, len, wid, style) {
    // Tapered lens: pointed at both ends, widest at center
    ctx.fillStyle = style;
    ctx.beginPath();
    var N = 14, k, t, off;
    for (k = 0; k <= N; k++) {
      t = k / N;
      off = Math.sin(t * Math.PI) * wid * 0.5;
      var px = cx + dx * (t - 0.5) * len + nx * off;
      var py = cy + dy * (t - 0.5) * len + ny * off;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    for (k = N; k >= 0; k--) {
      t = k / N;
      off = Math.sin(t * Math.PI) * wid * 0.5;
      ctx.lineTo(cx + dx * (t - 0.5) * len - nx * off, cy + dy * (t - 0.5) * len - ny * off);
    }
    ctx.closePath();
    ctx.fill();
  }

  // Animation: anchored loop, deterministic frame one at phase 0.
  var startTime = null;
  function currentPhase() {
    if (startTime === null) return 0;
    return ((performance.now() - startTime) % BREATH_MS) / BREATH_MS;
  }
  function frame(now) {
    if (startTime === null) startTime = now;
    draw(((now - startTime) % BREATH_MS) / BREATH_MS);
    window.requestAnimationFrame(frame);
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();
  draw(0); // synchronous first frame at the fixed raking angle
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
