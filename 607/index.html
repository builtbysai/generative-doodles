<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№607 The Tension It Adds</title>
<style>
  html, body { margin: 0; padding: 0; background: #050914; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var FIELD = '#050914';      // deep black-blue, page ground
  var FIELD_DEEP = '#03060f'; // darker edge of the field
  var STEEL = '#e8eef4';      // the string, steel white
  var STEEL_DIM = '#8fa3b5';  // anchors and faint marks
  var VIOLET = '#b9a7e8';     // harmonics, pale violet
  var CYAN = '#9fd8e8';       // harmonics, ice cyan
  var MAGENTA = '#ff4fd8';    // dissonance fringing
  var HINT = '#7d8fb0';       // hint text, muted steel blue

  // Fixed-phase first frame: t = 1.0 s. The string is at rest, vibrating
  // gently at its fundamental, and the overtone stack is locked: seven
  // thin lines standing above it in phase, no fringing, no pull. Frame
  // one is a pure function of t, so re-renders are byte-identical.
  var FIRST_T = 1.0;

  // Seven overtones above the fundamental.
  var N_HARM = 7;

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- drag state ----
  // detune 0..1: how far off pitch the string is pulled. While dragging it
  // tracks the pull; on release it decays slowly, so the string settles
  // back and the overtone stack re-locks gradually, lowest first.
  var detune = 0;
  var dragX = 0.55;   // position along the string, 0..1
  var dragY = 0;      // pull in px, signed, from the string line
  var releaseDetune = 1; // detune at the moment of release, for the settle
  var dragging = false;

  // QA probe: render-piece.js passes its 5th arg as ?seed=VALUE. A seed
  // here means a pulled string: value 0..1 is the pull fraction at a
  // fixed drag position, so a probe render shows the off-pitch frame.
  var probe = null;
  try {
    var m = (typeof location !== 'undefined' && location.search) ?
      location.search.match(/seed=([0-9.]+)/) : null;
    if (m) { probe = clamp(parseFloat(m[1]), 0, 1); }
  } catch (e) { probe = null; }
  if (probe !== null) {
    detune = probe;
    dragging = true;
    dragX = 0.55;
  }

  function maxPull() { return H * 0.20; }

  // Phase divergence of harmonic k: zero when locked, growing with
  // detune and with k, so higher overtones argue first and re-lock last.
  function divergence(k, t) {
    var jitter = (hash(k * 7 + 3) - 0.5) * 2.4;
    var wobble = detune * Math.sin(t * 11 + k * 2.1) * 0.35;
    return detune * jitter * (1 + k * 0.18) + wobble;
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Deep black-blue field.
    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, hexA(FIELD_DEEP, 0.55));
    grad.addColorStop(0.55, hexA(FIELD, 0));
    grad.addColorStop(1, hexA(FIELD_DEEP, 0.55));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    var x0 = W * 0.04, x1 = W * 0.96;
    var len = x1 - x0;
    var cy = H * 0.54;
    var gap = H * 0.042;
    var pull = detune * maxPull();
    // While dragging, the finger sets the displacement directly. On
    // release the pull stays on the string and eases back with detune,
    // scaled from its value at release. The QA probe pulls upward.
    var disp = dragging ?
      (probe !== null ? -pull : dragY) :
      dragY * clamp(detune / releaseDetune, 0, 1);
    var w = Math.PI * 2 * 0.9; // fundamental, 0.9 Hz

    // ---- overtone stack, fanning upward ----
    var SEG = 90;
    for (var k = 1; k <= N_HARM; k++) {
      var baseY = cy - k * gap;
      var amp = (H * 0.016 / Math.sqrt(k)) * (1 + detune * 1.6);
      var ph = divergence(k, t);
      var col = (k % 2 === 1) ? VIOLET : CYAN;
      var alpha = 0.78 - k * 0.055;
      // Dissonance fringe: a magenta copy offset by the phase divergence,
      // visible only while the stack is out of tune.
      if (detune > 0.03) {
        var fringe = detune * 0.55;
        ctx.strokeStyle = hexA(MAGENTA, a4(fringe * 0.8));
        ctx.lineWidth = Math.max(0.8, H * 0.0011);
        ctx.beginPath();
        for (var s = 0; s <= SEG; s++) {
          var u = s / SEG;
          var xx = x0 + u * len;
          var yy = baseY + ph * 7 + amp * Math.sin(k * Math.PI * u) *
            Math.sin(k * w * t + ph + Math.PI * 0.5);
          if (s === 0) { ctx.moveTo(xx, yy); } else { ctx.lineTo(xx, yy); }
        }
        ctx.stroke();
      }
      ctx.strokeStyle = hexA(col, a4(alpha));
      ctx.lineWidth = Math.max(0.9, H * 0.0013);
      ctx.beginPath();
      for (var s2 = 0; s2 <= SEG; s2++) {
        var u2 = s2 / SEG;
        var xx2 = x0 + u2 * len;
        var yy2 = baseY + amp * Math.sin(k * Math.PI * u2) * Math.sin(k * w * t + ph);
        if (s2 === 0) { ctx.moveTo(xx2, yy2); } else { ctx.lineTo(xx2, yy2); }
      }
      ctx.stroke();
    }

    // ---- the string ----
    var vibAmp = H * 0.007 * (1 + detune * 2.2);
    var span = Math.max(dragX, 1 - dragX);
    // Soft glow under the string.
    ctx.strokeStyle = hexA(STEEL, 0.10);
    ctx.lineWidth = Math.max(4, H * 0.008);
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var p = 0; p <= SEG; p++) {
      var q = p / SEG;
      var xp = x0 + q * len;
      var tri = Math.max(0, 1 - Math.abs(q - dragX) / span);
      var yp = cy + disp * tri + vibAmp * Math.sin(Math.PI * q) * Math.sin(w * t);
      if (p === 0) { ctx.moveTo(xp, yp); } else { ctx.lineTo(xp, yp); }
    }
    ctx.stroke();
    // The string itself, steel white.
    ctx.strokeStyle = hexA(STEEL, 0.95);
    ctx.lineWidth = Math.max(1.6, H * 0.0028);
    ctx.beginPath();
    for (var p2 = 0; p2 <= SEG; p2++) {
      var q2 = p2 / SEG;
      var xp2 = x0 + q2 * len;
      var tri2 = Math.max(0, 1 - Math.abs(q2 - dragX) / span);
      var yp2 = cy + disp * tri2 + vibAmp * Math.sin(Math.PI * q2) * Math.sin(w * t);
      if (p2 === 0) { ctx.moveTo(xp2, yp2); } else { ctx.lineTo(xp2, yp2); }
    }
    ctx.stroke();
    // Faint echo of the string below it, a dim reflection in the dark
    // field, mirroring the pull and the vibration at half amplitude.
    ctx.strokeStyle = hexA(STEEL, 0.10);
    ctx.lineWidth = Math.max(0.8, H * 0.0012);
    ctx.beginPath();
    for (var p3 = 0; p3 <= SEG; p3++) {
      var q3 = p3 / SEG;
      var xp3 = x0 + q3 * len;
      var tri3 = Math.max(0, 1 - Math.abs(q3 - dragX) / span);
      var yp3 = cy + disp * tri3 + vibAmp * Math.sin(Math.PI * q3) * Math.sin(w * t);
      var ye3 = cy + H * 0.05 + (cy - yp3) * 0.5;
      if (p3 === 0) { ctx.moveTo(xp3, ye3); } else { ctx.lineTo(xp3, ye3); }
    }
    ctx.stroke();

    // Anchors: the string is held at both ends.
    ctx.fillStyle = STEEL_DIM;
    ctx.beginPath(); ctx.moveTo(x0 + 4, cy); ctx.arc(x0, cy, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x1 + 4, cy); ctx.arc(x1, cy, 4, 0, Math.PI * 2); ctx.fill();

    // Finger-point shadow at the drag position, while the string is pulled.
    if (detune > 0.02) {
      var fx = x0 + dragX * len;
      var fy = cy + disp + H * 0.035;
      ctx.fillStyle = hexA('#000000', a4(0.45 * detune + 0.1));
      ctx.beginPath();
      ctx.moveTo(fx + H * 0.018, fy);
      ctx.arc(fx, fy, H * 0.018, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = hexA(STEEL, a4(0.5 * detune));
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(fx, fy - H * 0.028); ctx.lineTo(fx, fy - H * 0.012); ctx.stroke();
      // Contact point on the string.
      ctx.fillStyle = hexA(STEEL, a4(0.9));
      ctx.beginPath(); ctx.moveTo(fx + 3, cy + disp);
      ctx.arc(fx, cy + disp, 3, 0, Math.PI * 2); ctx.fill();
    }

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = STEEL;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Tension It Adds', 18, 34);
    ctx.fillStyle = STEEL_DIM;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№607 · 2003 · 09 · 10', 18, 34 + fs2 + 8);
    // Hint, centered at the bottom.
    ctx.fillStyle = HINT;
    ctx.textAlign = 'center';
    ctx.fillText('Drag to pull the string off tune.', W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  function pointerPos(e) {
    var r = { left: 0, top: 0 };
    try { r = canvas.getBoundingClientRect(); } catch (err) {}
    var cx = (typeof e.clientX === 'number') ? e.clientX - r.left : 0;
    var cyv = (typeof e.clientY === 'number') ? e.clientY - r.top : 0;
    return { x: cx, y: cyv };
  }

  function onDown(e) {
    if (probe !== null) { return; }
    var p = pointerPos(e);
    dragging = true;
    dragX = clamp(p.x / W, 0.05, 0.95);
    dragY = clamp(p.y - H * 0.54, -maxPull(), maxPull());
    detune = clamp(Math.abs(dragY) / maxPull(), 0, 1);
    if (e && typeof e.preventDefault === 'function') { e.preventDefault(); }
  }
  function onMove(e) {
    if (!dragging || probe !== null) { return; }
    var p = pointerPos(e);
    dragX = clamp(p.x / W, 0.05, 0.95);
    dragY = clamp(p.y - H * 0.54, -maxPull(), maxPull());
    detune = clamp(Math.abs(dragY) / maxPull(), 0, 1);
    if (e && typeof e.preventDefault === 'function') { e.preventDefault(); }
  }
  function onUp() {
    if (probe !== null) { return; }
    releaseDetune = Math.max(detune, 0.001);
    dragging = false; // detune decays in the loop; resolution is gradual
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Drag only, never click-to-reload. No audio. All motion runs under 1 Hz
  // for the string and under 14 Hz for the overtone wobble by construction.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var last = start;
    var loop = function (now) {
      var dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      if (!dragging && probe === null) {
        // Slow exponential settle: about 2.5 s to re-lock.
        detune *= Math.exp(-dt / 0.9);
        if (detune < 0.001) { detune = 0; }
      }
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
