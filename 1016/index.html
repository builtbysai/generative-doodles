<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The City, Edited</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070D; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// No.1016 "The City, Edited" - yuta-asai PP177 "Ad-Null City".
// A drawn night street whose ad slots are erased to white slabs or filled
// with counterfeit generative posters, on a deterministic edit schedule.
// Frame one is the synchronous draw at fixed T0; never from Date.now().

var T0 = 11.0;                 // frame-one piece time (seconds)
var BASE_SEED = 1016177;

var COL = {
  night: '#05070D', building: '#0E1220', winDark: '#1E2A4A', winLit: '#FFD93B',
  slab: '#FFFFFF', cyan: '#00E5FF', red: '#FF2E4D',
  magenta: '#FF2EA6', halftone: '#8A8D84', black: '#000000'
};

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// deterministic hash of small ints -> [0,1)
function hashN(a, b, c) {
  var h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 974634211)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 720, H = 720, PHONE = false;

function fit() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  W = vv ? vv.width : (window.innerWidth || 720);
  H = vv ? vv.height : (window.innerHeight || 720);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = (Math.min(sw, sh) < 700) || (H > W * 1.15);
}
fit();
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', fit);
if (window.addEventListener) window.addEventListener('resize', fit);

// ---------------- city generation (seeded) ----------------
var STRIP = 3.0;               // city strip width, in viewport widths
var citySeed = BASE_SEED;
var near = [], far = [], slots = [];
// slot phase table: period 12s, poster [0,7), erased [7,12).
// Phases are design constants so frame one (t=11) reads as specced.
var SLOT_PHASE = [0.0, 3.0, 8.4, 5.0, 1.5, 10.0];
var SLOT_X = [0.50, 0.80, 1.10, 1.55, 2.05, 2.55];
var PERIOD = 12.0, POSTER_DUR = 7.0;

function genBuildings(rng, countMinH, countMaxH) {
  var arr = [], x = 0.02;
  var i = 0;
  while (x < STRIP - 0.08) {
    var bw = 0.10 + rng() * 0.12;
    var bh = countMinH + rng() * (countMaxH - countMinH);
    arr.push({ x: x, w: bw, h: bh, idx: i });
    x += bw + 0.012 + rng() * 0.03;
    i++;
  }
  return arr;
}
function buildCity(seed) {
  var rng = mulberry32(seed);
  far = genBuildings(rng, 0.22, 0.55);
  near = genBuildings(rng, 0.34, 0.90);
  slots = [];
  for (var s = 0; s < SLOT_X.length; s++) {
    var tx = SLOT_X[s], host = null;
    for (var j = 0; j < near.length; j++) {
      if (tx >= near[j].x && tx <= near[j].x + near[j].w) { host = near[j]; break; }
    }
    if (!host) { // nearest building to the target
      var best = 1e9;
      for (var k = 0; k < near.length; k++) {
        var d = Math.abs((near[k].x + near[k].w / 2) - tx);
        if (d < best) { best = d; host = near[k]; }
      }
    }
    slots.push({ tx: tx, host: host, phase: SLOT_PHASE[s], idx: s });
  }
}
buildCity(citySeed);

// user edits: slotIdx -> {mode:'poster'|'erased', variant:int, t0:seconds}
var overrides = {};
var interactionCounter = 0;

// ---------------- slot state (closed form over the schedule) ----------------
function slotState(si, t) {
  var ov = overrides[si];
  if (ov) {
    var age = t - ov.t0;
    return { mode: ov.mode, variant: ov.variant, burstAge: age < 0.8 ? age : -1, burstKey: 9000 + si * 131 + ov.variant * 17 };
  }
  var sl = slots[si];
  var u = (t + sl.phase) % PERIOD;
  var cyc = Math.floor((t + sl.phase) / PERIOD);
  if (u < POSTER_DUR) {
    return { mode: 'poster', variant: cyc * 2 + si * 3 + 1, burstAge: u < 0.8 ? u : -1, burstKey: si * 1000 + cyc * 7 };
  }
  var a2 = u - POSTER_DUR;
  return { mode: 'erased', variant: 0, burstAge: a2 < 0.8 ? a2 : -1, burstKey: si * 1000 + cyc * 7 + 1 };
}
function panOff(t) { return (t * 0.03) % STRIP; }

// slot pixel rect at time t (also used for hit tests)
function slotRect(si, t) {
  var sl = slots[si], off = panOff(t);
  var sx = sl.tx - off; if (sx < -0.4) sx += STRIP; if (sx > STRIP - 0.4) sx -= STRIP;
  var host = sl.host;
  var groundY = H * 0.92;
  var bTop = groundY - host.h * H, bH = host.h * H;
  var w = Math.min(W * 0.15, host.w * W * 0.78);
  var h = Math.min(H * 0.24, bH * 0.52);
  var cx = sx * W;
  var cy = bTop + bH * 0.36;
  return { x: cx - w / 2, y: cy - h / 2, w: w, h: h, cx: cx, cy: cy };
}

// ---------------- drawing ----------------
function drawWindows(b, bx, groundY) {
  var bw = b.w * W, bh = b.h * H, top = groundY - bh;
  var cw = Math.max(6, W * 0.016), ch = Math.max(8, H * 0.020);
  var mx = cw * 0.7, my = ch * 0.7;
  var cols = Math.floor((bw - mx * 2) / cw), rows = Math.floor((bh - my * 2) / ch);
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var hv = hashN(b.idx * 131 + 7, c * 17 + 3, r * 29 + 11);
      var x = bx + mx + c * cw, y = top + my + r * ch;
      if (hv < 0.085) {
        ctx.globalAlpha = 0.55 + 0.45 * hashN(b.idx, c, r + 500);
        ctx.fillStyle = COL.winLit;
      } else {
        ctx.globalAlpha = 1;
        ctx.fillStyle = COL.winDark;
      }
      ctx.fillRect(x, y, cw * 0.55, ch * 0.5);
    }
  }
  ctx.globalAlpha = 1;
}

function drawPoster(x, y, w, h, vseed) {
  var rng = mulberry32(vseed * 7919 + 13);
  var kind = Math.floor(rng() * 4);
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  var i, j;
  if (kind === 0) { // magenta field, black disc, halftone corner
    ctx.fillStyle = COL.magenta; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = COL.black;
    ctx.beginPath(); ctx.arc(x + w * (0.3 + rng() * 0.4), y + h * (0.3 + rng() * 0.4), w * 0.26, 0, 6.2832); ctx.fill();
    ctx.fillStyle = COL.halftone;
    for (i = 0; i < 6; i++) for (j = 0; j < 6; j++)
      ctx.fillRect(x + w * 0.62 + i * w * 0.055, y + h * 0.6 + j * h * 0.055, w * 0.03, h * 0.03);
    ctx.fillStyle = COL.black; ctx.fillRect(x, y + h * (0.75 + rng() * 0.15), w, h * 0.07);
  } else if (kind === 1) { // black field, halftone gradient dots, magenta bar
    ctx.fillStyle = COL.black; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = COL.halftone;
    for (i = 0; i < 12; i++) for (j = 0; j < 16; j++) {
      var rr = (i / 12) * w * 0.045 + 0.6;
      ctx.beginPath(); ctx.arc(x + (i + 0.5) * w / 12, y + (j + 0.5) * h / 16, rr, 0, 6.2832); ctx.fill();
    }
    ctx.fillStyle = COL.magenta;
    ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(-0.5);
    ctx.fillRect(-w * 0.7, -h * 0.07, w * 1.4, h * 0.14); ctx.restore();
  } else if (kind === 2) { // halftone field, concentric magenta rings, black slab
    ctx.fillStyle = COL.halftone; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = COL.magenta; ctx.lineWidth = Math.max(2, w * 0.045);
    for (i = 1; i <= 4; i++) {
      ctx.beginPath(); ctx.arc(x + w * 0.38, y + h * 0.42, i * w * 0.11, 0, 6.2832); ctx.stroke();
    }
    ctx.fillStyle = COL.black; ctx.fillRect(x + w * 0.58, y + h * 0.55, w * 0.34, h * 0.38);
    ctx.fillStyle = COL.magenta; ctx.fillRect(x + w * 0.58, y + h * 0.55, w * 0.34, h * 0.08);
  } else { // black field, neon mark shards, halftone strip
    ctx.fillStyle = COL.black; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = COL.magenta;
    for (i = 0; i < 5; i++) {
      ctx.save();
      ctx.translate(x + rng() * w, y + rng() * h); ctx.rotate(rng() * 3.14);
      ctx.fillRect(-w * 0.16, -h * 0.03, w * 0.32, h * 0.06);
      ctx.restore();
    }
    ctx.fillStyle = COL.halftone;
    for (i = 0; i < 14; i++) ctx.fillRect(x + i * w / 14 + 1, y + h * 0.86, w / 14 - 2, h * 0.08);
    ctx.strokeStyle = COL.magenta; ctx.lineWidth = Math.max(2, w * 0.04);
    ctx.beginPath(); ctx.arc(x + w * 0.72, y + h * 0.3, w * 0.16, 0, 6.2832); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = COL.black; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}

function drawBurst(r, age, key) {
  var inten = 1 - age / 0.8;
  var spread = 1.15 + age * 1.7;
  var i;
  for (i = 0; i < 26; i++) {
    var hx = hashN(key, i * 3, 1), hy = hashN(key, i * 3 + 1, 2), hs = hashN(key, i * 3 + 2, 3);
    var px = r.cx + (hx - 0.5) * r.w * spread;
    var py = r.cy + (hy - 0.5) * r.h * spread;
    var s = (4 + hs * 22) * (0.6 + 0.4 * inten);
    ctx.globalAlpha = inten * (0.35 + 0.55 * hs);
    ctx.fillStyle = (i % 2 === 0) ? COL.cyan : COL.red;
    ctx.fillRect(px - s / 2, py - s * 0.32, s, s * 0.64);
  }
  // datamosh smear bars inside the slot
  for (i = 0; i < 8; i++) {
    var hb = hashN(key + 55, i, 9);
    var by = r.y + hb * r.h;
    ctx.globalAlpha = inten * 0.8;
    ctx.fillStyle = (i % 2 === 0) ? COL.red : COL.cyan;
    ctx.fillRect(r.x + (hb - 0.5) * 26 * inten, by, r.w * (0.4 + 0.6 * hb), Math.max(2, r.h * 0.045));
  }
  ctx.globalAlpha = 1;
}

function drawBuildingRow(arr, offFactor, t, withWindows, alpha) {
  var off = (panOff(t) * offFactor) % STRIP;
  var groundY = H * 0.92;
  ctx.globalAlpha = alpha;
  for (var rep = 0; rep < 2; rep++) {
    for (var i = 0; i < arr.length; i++) {
      var b = arr[i];
      var bx = (b.x - off + rep * STRIP) * W;
      if (bx + b.w * W < -10 || bx > W + 10) continue;
      ctx.fillStyle = COL.building;
      ctx.fillRect(bx, groundY - b.h * H, b.w * W, b.h * H);
      if (withWindows) drawWindows(b, bx, groundY);
    }
  }
  ctx.globalAlpha = 1;
}

function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = COL.night;
  ctx.fillRect(0, 0, W, H);
  var groundY = H * 0.92;

  drawBuildingRow(far, 0.45, t, false, 0.55);
  drawBuildingRow(near, 1.0, t, true, 1.0);

  // ground line + streetlights
  ctx.fillStyle = COL.winDark;
  ctx.fillRect(0, groundY, W, 1.5);
  var off = panOff(t);
  for (var rep = 0; rep < 2; rep++) {
    for (var sIdx = 0; sIdx < 34; sIdx++) {
      var sxp = (sIdx * 0.09 + 0.03 - off + rep * STRIP) * W;
      if (sxp < -6 || sxp > W + 6) continue;
      var lit = hashN(41, sIdx, rep) < 0.3;
      ctx.globalAlpha = lit ? 0.28 : 0.15;
      ctx.fillStyle = lit ? COL.winLit : COL.winDark;
      ctx.beginPath(); ctx.arc(sxp, groundY - H * 0.012, 7, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = lit ? 0.95 : 0.8;
      ctx.beginPath(); ctx.arc(sxp, groundY - H * 0.012, 2.1, 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // ad slots, then bursts on top
  var rects = [], states = [];
  for (var i = 0; i < slots.length; i++) {
    var r = slotRect(i, t), st = slotState(i, t);
    rects.push(r); states.push(st);
    if (r.x + r.w < -30 || r.x > W + 30) continue;
    if (st.mode === 'poster') drawPoster(r.x, r.y, r.w, r.h, st.variant + 31);
    else { ctx.fillStyle = COL.slab; ctx.fillRect(r.x, r.y, r.w, r.h); }
  }
  for (var j = 0; j < slots.length; j++) {
    if (states[j].burstAge >= 0) {
      var rr = rects[j];
      if (rr.x + rr.w >= -40 && rr.x <= W + 40) drawBurst(rr, states[j].burstAge, states[j].burstKey);
    }
  }
}

// ---------------- audio (lazy, gesture-gated, guarded) ----------------
var AC = null, humGain = null;
function ensureAudio() {
  if (AC) { if (AC.resume) AC.resume(); return; }
  try {
    var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext :
      ((typeof window !== 'undefined' && window.webkitAudioContext) ? window.webkitAudioContext : null);
    if (!Ctor) return;
    AC = new Ctor();
    // low traffic hum
    var osc = AC.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 52;
    var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 140;
    humGain = AC.createGain(); humGain.gain.value = 0.035;
    osc.connect(lp); lp.connect(humGain); humGain.connect(AC.destination);
    osc.start();
  } catch (e) { AC = null; }
}
function blip(freq, dur, type, vol) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
function noiseBurst(dur, vol, freqFrom, freqTo) {
  if (!AC) return;
  try {
    var len = Math.max(1, Math.floor(AC.sampleRate * dur));
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    var rng = mulberry32(1234);
    for (var i = 0; i < len; i++) d[i] = rng() * 2 - 1;
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.8;
    f.frequency.setValueAtTime(freqFrom, AC.currentTime);
    f.frequency.exponentialRampToValueAtTime(Math.max(30, freqTo), AC.currentTime + dur);
    var g = AC.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start();
  } catch (e) {}
}
function sndErase() { noiseBurst(0.35, 0.16, 3200, 220); }
function sndCounterfeit() { blip(660 + (interactionCounter % 5) * 90, 0.18, 'triangle', 0.12); noiseBurst(0.12, 0.05, 1800, 2600); }
function sndBurst() { noiseBurst(0.2, 0.08, 900, 2400); }

// ---------------- interaction ----------------
var curT = T0;
var pdown = null, lastTapT = -10;
function slotAt(px, py, t) {
  for (var i = 0; i < slots.length; i++) {
    var r = slotRect(i, t);
    if (px >= r.x - 4 && px <= r.x + r.w + 4 && py >= r.y - 4 && py <= r.y + r.h + 4) return i;
  }
  return -1;
}
function eraseSlot(si, t) {
  var st = slotState(si, t);
  if (st.mode !== 'poster') return;
  overrides[si] = { mode: 'erased', variant: 0, t0: t };
  sndErase();
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    pdown = { x: e.clientX, y: e.clientY, moved: false };
    var si = slotAt(e.clientX, e.clientY, curT);
    if (si >= 0) eraseSlot(si, curT);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pdown) return;
    if (Math.abs(e.clientX - pdown.x) + Math.abs(e.clientY - pdown.y) > 6) pdown.moved = true;
    if (pdown.moved) {
      var si = slotAt(e.clientX, e.clientY, curT);
      if (si >= 0) eraseSlot(si, curT);
    }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!pdown) return;
    var wasDrag = pdown.moved;
    pdown = null;
    if (wasDrag) return;
    // tap
    if (curT - lastTapT < 0.35) { // double-tap: new city
      lastTapT = -10;
      citySeed += 1;
      buildCity(citySeed);
      overrides = {};
      sndBurst();
      return;
    }
    lastTapT = curT;
    var si = slotAt(e.clientX, e.clientY, curT);
    if (si >= 0) {
      var st = slotState(si, curT);
      if (st.mode === 'erased') {
        interactionCounter++;
        overrides[si] = { mode: 'poster', variant: 500 + interactionCounter * 7 + si, t0: curT };
        sndCounterfeit();
      }
    }
  });
}

// ---------------- run ----------------
var lastModes = null;
function tick(t) {
  // audio on scheduled transitions
  if (AC) {
    var modes = [];
    for (var i = 0; i < slots.length; i++) modes.push(slotState(i, t).mode);
    if (lastModes) {
      for (var j = 0; j < modes.length; j++) {
        if (modes[j] !== lastModes[j]) { if (modes[j] === 'erased') sndErase(); else sndCounterfeit(); }
      }
    }
    lastModes = modes;
  }
  draw(t);
}
draw(T0);
curT = T0;
if (typeof requestAnimationFrame === 'function') {
  var startTs = null;
  var frame = function (ts) {
    if (startTs === null) startTs = ts;
    curT = T0 + (ts - startTs) / 1000;
    tick(curT);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
