<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fabrication Inventory</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060708;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
(function () {
  'use strict';

  var T0 = 20;
  var LOOP = 60;
  var WORLD = 1000;
  var canvas = document.getElementById('piece');
  var ctx = canvas.getContext('2d');
  var currentT = T0;
  var view = { w: 0, h: 0, scale: 1, ox: 0, oy: 0, phone: false };
  var generation = 0;
  var drag = null;
  var releases = {};
  var readout = null;
  var lastTap = null;
  var audio = null;

  var COLORS = {
    stage: '#060708',
    cube: '#E8EAEE',
    mobility: '#3A4048',
    marker: '#FFFFFF',
    headset: '#0E0F12',
    lens: '#7FD4FF',
    line: '#1C1E24'
  };

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function hash(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function resize() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    }
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(vw * dpr));
    canvas.height = Math.max(1, Math.round(vh * dpr));
    var screenMin = 0;
    if (window.screen) screenMin = Math.min(window.screen.width || 0, window.screen.height || 0);
    var phone = screenMin > 0 ? screenMin < 700 : vh > vw * 1.15;
    var scale = Math.min(vw / WORLD, vh / WORLD);
    view = {
      w: vw,
      h: vh,
      dpr: dpr,
      scale: scale,
      ox: (vw - WORLD * scale) / 2,
      oy: (vh - WORLD * scale) / 2,
      phone: phone
    };
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(currentT); });
  }
  window.addEventListener('resize', function () { resize(); draw(currentT); });
  resize();

  var routePoints = [
    { x: 100, y: 140 }, { x: 900, y: 140 },
    { x: 900, y: 280 }, { x: 100, y: 280 },
    { x: 100, y: 420 }, { x: 900, y: 420 },
    { x: 900, y: 560 }, { x: 100, y: 560 },
    { x: 100, y: 700 }, { x: 900, y: 700 },
    { x: 900, y: 840 }, { x: 100, y: 840 },
    { x: 65, y: 840 }, { x: 65, y: 140 },
    { x: 100, y: 140 }
  ];
  var segments = [];
  var routeLength = 0;
  for (var i = 0; i < routePoints.length - 1; i++) {
    var a = routePoints[i];
    var b = routePoints[i + 1];
    var len = Math.hypot(b.x - a.x, b.y - a.y);
    segments.push({ a: a, b: b, start: routeLength, len: len, angle: Math.atan2(b.y - a.y, b.x - a.x) });
    routeLength += len;
  }

  function routePoint(distance) {
    var d = ((distance % routeLength) + routeLength) % routeLength;
    for (var j = 0; j < segments.length; j++) {
      var s = segments[j];
      if (d <= s.start + s.len || j === segments.length - 1) {
        var u = s.len === 0 ? 0 : (d - s.start) / s.len;
        return {
          x: lerp(s.a.x, s.b.x, u),
          y: lerp(s.a.y, s.b.y, u),
          angle: s.angle
        };
      }
    }
    return { x: routePoints[0].x, y: routePoints[0].y, angle: 0 };
  }

  var objects = [];
  var orderIndex = 0;
  function addObjects(type, count, label, system) {
    for (var k = 1; k <= count; k++) {
      objects.push({
        type: type,
        number: k,
        label: label,
        system: system,
        order: orderIndex++,
        jitter: (hash(orderIndex * 19 + k * 7) - 0.5) * 5
      });
    }
  }
  addObjects('headset', 10, 'HEADSET', 'STEREO');
  addObjects('cube', 5, 'CUBE', 'OMNI');
  addObjects('mobility', 10, 'WHILL', 'OPTITRACK');

  function basePose(obj, t) {
    var spacing = routeLength / objects.length;
    var travel = routeLength * ((t % LOOP) / LOOP);
    var genOffset = generation * routeLength * 0.173;
    var p = routePoint(travel + genOffset + obj.order * spacing);
    var side = obj.jitter + Math.sin(generation * 2.3 + obj.order * 1.7) * 1.5;
    p.x += Math.cos(p.angle + Math.PI / 2) * side;
    p.y += Math.sin(p.angle + Math.PI / 2) * side;
    return p;
  }

  function posedObject(obj, t) {
    var p = basePose(obj, t);
    var x = p.x;
    var y = p.y;
    if (drag && drag.index === obj.order) {
      x = drag.x;
      y = drag.y;
    } else if (releases[obj.order]) {
      var rel = releases[obj.order];
      var age = t - rel.t;
      if (age >= 0 && age < 7) {
        var strength = Math.exp(-age / 1.35);
        x += rel.dx * strength;
        y += rel.dy * strength;
      }
    }
    return { x: x, y: y, angle: p.angle, base: p };
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function circle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRoute() {
    var offset;
    var lane;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (lane = -1; lane <= 1; lane += 2) {
      offset = lane * 19;
      ctx.beginPath();
      for (var d = 0; d <= routeLength; d += 12) {
        var p = routePoint(d);
        var x = p.x + Math.cos(p.angle + Math.PI / 2) * offset;
        var y = p.y + Math.sin(p.angle + Math.PI / 2) * offset;
        if (d === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = COLORS.line;
      ctx.globalAlpha = 0.72;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.beginPath();
    for (var q = 0; q < routeLength; q += 86) {
      var c = routePoint(q);
      var nx = Math.cos(c.angle + Math.PI / 2);
      var ny = Math.sin(c.angle + Math.PI / 2);
      ctx.moveTo(c.x - nx * 23, c.y - ny * 23);
      ctx.lineTo(c.x + nx * 23, c.y + ny * 23);
    }
    ctx.strokeStyle = COLORS.line;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawStage() {
    ctx.fillStyle = COLORS.stage;
    ctx.fillRect(0, 0, WORLD, WORLD);
    ctx.strokeStyle = COLORS.line;
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = 2;
    ctx.strokeRect(34, 34, WORLD - 68, WORLD - 68);
    ctx.globalAlpha = 0.36;
    ctx.lineWidth = 1;
    for (var g = 140; g < WORLD; g += 172) {
      ctx.beginPath(); ctx.moveTo(g, 42); ctx.lineTo(g, WORLD - 42); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(42, g); ctx.lineTo(WORLD - 42, g); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    drawRoute();
  }

  function drawCube(obj, pose) {
    ctx.save();
    ctx.translate(pose.x, pose.y);
    ctx.rotate(pose.angle);
    ctx.fillStyle = COLORS.line;
    ctx.globalAlpha = 0.55;
    roundedRect(-21, -18, 46, 40, 5); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = COLORS.cube;
    roundedRect(-22, -22, 44, 44, 6); ctx.fill();
    ctx.strokeStyle = COLORS.line;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = COLORS.mobility;
    ctx.lineWidth = 1.4;
    ctx.strokeRect(-12, -12, 24, 24);
    ctx.fillStyle = COLORS.line;
    circle(-17, -17, 4); circle(17, -17, 4); circle(-17, 17, 4); circle(17, 17, 4);
    ctx.fillStyle = COLORS.mobility;
    circle(0, 0, 4);
    ctx.restore();
  }

  function drawHeadset(obj, pose) {
    ctx.save();
    ctx.translate(pose.x, pose.y);
    ctx.rotate(pose.angle);
    ctx.fillStyle = COLORS.line;
    ctx.globalAlpha = 0.5;
    roundedRect(-22, -13, 48, 31, 12); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = COLORS.headset;
    roundedRect(-23, -16, 46, 32, 13); ctx.fill();
    ctx.strokeStyle = COLORS.line;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = COLORS.mobility;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-19, -7); ctx.lineTo(-27, 0); ctx.lineTo(-19, 7);
    ctx.moveTo(19, -7); ctx.lineTo(27, 0); ctx.lineTo(19, 7);
    ctx.stroke();
    ctx.fillStyle = COLORS.lens;
    circle(-9, 0, 4.6);
    circle(9, 0, 4.6);
    ctx.fillStyle = COLORS.marker;
    ctx.globalAlpha = 0.72;
    circle(-9, -1.2, 1.2);
    circle(9, -1.2, 1.2);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawMobility(obj, pose) {
    ctx.save();
    ctx.translate(pose.x, pose.y);
    ctx.rotate(pose.angle);
    ctx.fillStyle = COLORS.line;
    ctx.globalAlpha = 0.48;
    roundedRect(-24, -16, 52, 37, 15); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = COLORS.mobility;
    roundedRect(-25, -18, 50, 36, 15); ctx.fill();
    ctx.strokeStyle = COLORS.line;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = COLORS.headset;
    roundedRect(-19, -12, 25, 24, 9); ctx.fill();
    ctx.fillStyle = COLORS.line;
    roundedRect(7, -13, 12, 26, 5); ctx.fill();
    ctx.fillStyle = COLORS.marker;
    circle(-19, -12, 2.4); circle(19, -12, 2.4); circle(-19, 12, 2.4); circle(19, 12, 2.4);
    ctx.fillStyle = COLORS.headset;
    circle(-27, 0, 5); circle(27, 0, 5);
    ctx.restore();
  }

  function drawReadout(t) {
    if (!readout || t - readout.t > 3.6) return;
    var obj = objects[readout.index];
    var pose = posedObject(obj, t);
    var text = obj.label + ' ' + (obj.number < 10 ? '0' : '') + obj.number + ' / ' + obj.system;
    ctx.save();
    ctx.font = '600 15px ui-monospace, SFMono-Regular, Menlo, monospace';
    var w = ctx.measureText(text).width + 18;
    var x = clamp(pose.x - w / 2, 44, WORLD - 44 - w);
    var y = clamp(pose.y - 58, 44, WORLD - 76);
    ctx.fillStyle = obj.type === 'headset' ? COLORS.lens : COLORS.marker;
    ctx.globalAlpha = 0.94;
    roundedRect(x, y, w, 25, 4); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = COLORS.stage;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 9, y + 13);
    ctx.restore();
  }

  function draw(t) {
    currentT = t;
    canvas.style.width = view.w + 'px';
    canvas.style.height = view.h + 'px';
    ctx.setTransform(view.dpr || 1, 0, 0, view.dpr || 1, 0, 0);
    ctx.fillStyle = COLORS.stage;
    ctx.fillRect(0, 0, view.w, view.h);
    ctx.translate(view.ox, view.oy);
    ctx.scale(view.scale, view.scale);
    drawStage();
    var poses = objects.map(function (obj) { return { obj: obj, pose: posedObject(obj, t) }; });
    poses.sort(function (a, b) { return a.pose.y - b.pose.y; });
    for (var i = 0; i < poses.length; i++) {
      if (poses[i].obj.type === 'cube') drawCube(poses[i].obj, poses[i].pose);
      else if (poses[i].obj.type === 'headset') drawHeadset(poses[i].obj, poses[i].pose);
      else drawMobility(poses[i].obj, poses[i].pose);
    }
    drawReadout(t);
    updateAudio();
  }

  function ensureAudio() {
    if (audio) {
      if (audio.ctx.state === 'suspended' && audio.ctx.resume) audio.ctx.resume();
      return;
    }
    var AC = null;
    if (typeof AudioContext !== 'undefined') AC = AudioContext;
    else if (typeof webkitAudioContext !== 'undefined') AC = webkitAudioContext;
    if (!AC) return;
    try {
      var actx = new AC();
      var master = actx.createGain();
      master.gain.value = 0.045;
      master.connect(actx.destination);
      var glide = actx.createOscillator();
      var glideGain = actx.createGain();
      glide.type = 'sine';
      glide.frequency.value = 54;
      glideGain.gain.value = 0.28;
      glide.connect(glideGain); glideGain.connect(master); glide.start();
      var whir = actx.createOscillator();
      var whirGain = actx.createGain();
      whir.type = 'triangle';
      whir.frequency.value = 117;
      whirGain.gain.value = 0.055;
      whir.connect(whirGain); whirGain.connect(master); whir.start();
      audio = { ctx: actx, master: master, glide: glide, whir: whir, whirGain: whirGain };
    } catch (e) {
      audio = null;
    }
  }

  function updateAudio() {
    if (!audio) return;
    var now = audio.ctx.currentTime;
    audio.glide.frequency.setTargetAtTime(53 + Math.sin(currentT * 0.37) * 2.5, now, 0.08);
    audio.whir.frequency.setTargetAtTime(113 + Math.cos(currentT * 0.53) * 5, now, 0.08);
    audio.whirGain.gain.setTargetAtTime(drag ? 0.11 : 0.05, now, 0.1);
  }

  function specTone() {
    if (!audio) return;
    try {
      var actx = audio.ctx;
      var osc = actx.createOscillator();
      var gain = actx.createGain();
      var now = actx.currentTime;
      osc.type = 'sine';
      osc.frequency.value = 690;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.24, now + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      osc.connect(gain); gain.connect(audio.master);
      osc.start(now); osc.stop(now + 0.3);
    } catch (e) {}
  }

  function pointerWorld(ev) {
    var rect = canvas.getBoundingClientRect();
    var cx = (ev.clientX - rect.left - view.ox) / view.scale;
    var cy = (ev.clientY - rect.top - view.oy) / view.scale;
    return { x: cx, y: cy };
  }

  function nearestObject(p, maxDist) {
    var best = null;
    var bestD = maxDist;
    for (var i = 0; i < objects.length; i++) {
      var pose = posedObject(objects[i], currentT);
      var d = Math.hypot(pose.x - p.x, pose.y - p.y);
      if (d < bestD) { bestD = d; best = objects[i]; }
    }
    return best;
  }

  function onDown(ev) {
    ensureAudio();
    var p = pointerWorld(ev);
    var obj = nearestObject(p, 58);
    drag = {
      index: obj ? obj.order : -1,
      x: p.x,
      y: p.y,
      startX: p.x,
      startY: p.y,
      startT: currentT,
      moved: false
    };
    if (canvas.setPointerCapture && ev.pointerId !== undefined) {
      try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    }
  }

  function onMove(ev) {
    if (!drag) return;
    var p = pointerWorld(ev);
    drag.x = p.x;
    drag.y = p.y;
    if (Math.hypot(p.x - drag.startX, p.y - drag.startY) > 7) drag.moved = true;
    draw(currentT);
  }

  function onUp(ev) {
    if (!drag) return;
    var p = pointerWorld(ev);
    var ended = drag;
    drag = null;
    var obj = ended.index >= 0 ? objects[ended.index] : nearestObject(p, 58);
    var quick = currentT - ended.startT < 0.45;
    if (obj && quick && !ended.moved) {
      if (lastTap && currentT - lastTap.t < 0.42 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 34) {
        generation++;
        releases = {};
        readout = null;
        lastTap = null;
        draw(currentT);
        return;
      }
      lastTap = { t: currentT, x: p.x, y: p.y };
      readout = { index: obj.order, t: currentT };
      specTone();
    } else if (obj && ended.index === obj.order && ended.moved) {
      var base = basePose(obj, currentT);
      releases[obj.order] = { dx: p.x - base.x, dy: p.y - base.y, t: currentT };
    }
    draw(currentT);
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { drag = null; });

  function frame(ms) {
    var t = T0 + (typeof ms === 'number' && isFinite(ms) ? ms / 1000 : 0);
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  frame(0);
})();
</script>
</body>
</html>
