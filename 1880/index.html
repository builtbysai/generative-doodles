<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Mineral, One Collaborator</title>
<style>
html, body { margin: 0; padding: 0; background: #070608; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* One Mineral, One Collaborator: a dark field holds a single growing
   crystal. It grows in strict alternation: a phase of amethyst logic
   (violet hexagonal spines branching outward, faceted tips) hard-cuts
   to a phase of halite logic (white translucent cubes stacking in
   stepped terraces), then back. Same seed point, same growth budget;
   only the lattice rule changes. Each phase runs about 25 seconds and
   the crystal keeps its accumulated form: spines sprout from cube
   terraces, cubes cap spine tips. Over several cycles a hybrid mineral
   builds that belongs to neither logic. The cut between phases is a
   single black frame. Watch only. */
var TAU = Math.PI * 2;
var GROUND = '#070608';
var AM_DEEP = '#4C1D95';
var AM_MID = '#7C3AED';
var AM_LIGHT = '#A78BFA';
var AM_PALE = '#C4B5FD';
var QUARTZ = '#F5F0E6';
var SALT = '#F2EFE9';
var GREY = '#8A8378';
var GREY_DARK = '#5C564C';
var TITLE_INK = '#F5F0E6';
var HINT_INK = '#C4B5FD';
var PLATE = '#0A0806';
var PLATE_LINE = 'rgba(167,139,250,0.30)';
var FRAME_T = 62.0;       /* fixed phase: mid-amethyst, second cycle, one
                             full amethyst phase and one full halite phase
                             already accumulated, a hybrid form */
var PHASE_LEN = 25.0;     /* each lattice phase runs about 25 seconds */
var HORIZON = 1200.0;     /* pre-simulated growth horizon, seconds */
var SEED0 = 1880;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- the crystal: one accumulation buffer, two growth rules ---- */
/* Every growth event is pre-simulated from the seeded RNG before the
   first frame is drawn. An event is born at t0 in one lattice phase and
   keeps its place forever; each new growth reads the existing crystal
   surface (the tips list) as its seed bed, so spines sprout from cube
   terraces and cubes cap spine tips. The whole timeline is a pure
   function of the seed, so frame one is reproducible. */
var events = [];
function genCrystal(seed) {
  var rng = mulberry32(seed);
  var list = [];
  var tips = [];
  var i, j, a;
  for (i = 0; i < 6; i++) {
    a = i * TAU / 6 + Math.PI / 6;
    tips.push({ x: Math.cos(a) * 0.08, y: Math.sin(a) * 0.08, nx: Math.cos(a), ny: Math.sin(a) });
  }
  var t = 0.4;
  /* pick a seed bed: usually a recent tip (the growing front), sometimes
     a deep interior point, so the crystal spreads outward instead of
     piling up at the seed */
  function pickTip() {
    var n = tips.length;
    if (rng() < 0.25) return tips[Math.floor(rng() * n)];
    var span = Math.min(n, 150);
    return tips[n - 1 - Math.floor(Math.pow(rng(), 1.6) * span)];
  }
  while (t < HORIZON) {
    var phase = Math.floor(t / PHASE_LEN) % 2; /* 0 amethyst, 1 halite */
    var ti = pickTip();
    if (phase === 0) {
      /* amethyst: a hexagonal spine branches off a surface point */
      var ang = Math.atan2(ti.ny, ti.nx) + (rng() * 2 - 1) * 0.35;
      var len = 0.10 + rng() * 0.10;
      var ex = ti.x + Math.cos(ang) * len;
      var ey = ti.y + Math.sin(ang) * len;
      var er = Math.sqrt(ex * ex + ey * ey);
      if (er > 0.97) {
        len = len * 0.97 / er;
        ex = ti.x + Math.cos(ang) * len;
        ey = ti.y + Math.sin(ang) * len;
      }
      list.push({ k: 0, t0: t, x: ti.x, y: ti.y, ang: ang, len: len,
        w: 0.020 + rng() * 0.014, shade: rng() });
      tips.push({ x: ex, y: ey, nx: Math.cos(ang), ny: Math.sin(ang) });
      if (rng() < 0.35) {
        /* a side branch off the spine's flank */
        var sa = ang + (rng() < 0.5 ? 1 : -1) * (0.9 + rng() * 0.4);
        tips.push({ x: ti.x + Math.cos(ang) * len * 0.55,
          y: ti.y + Math.sin(ang) * len * 0.55,
          nx: Math.cos(sa), ny: Math.sin(sa) });
      }
      t += 0.5 + rng() * 0.6;
    } else {
      /* halite: a stepped terrace of translucent cubes stacks on a
         surface point, climbing along the surface normal */
      var s = 0.045 + rng() * 0.045;
      var nx = ti.nx, ny = ti.ny;
      var bx = ti.x + nx * s * 0.55, by = ti.y + ny * s * 0.55;
      var n = 1 + Math.floor(rng() * 3);
      var cubes = [];
      for (j = 0; j < n; j++) {
        var cr = Math.sqrt(bx * bx + by * by);
        if (cr < 0.95) {
          cubes.push({ x: bx, y: by, s: s * (1 - j * 0.12),
            rot: (rng() * 2 - 1) * 0.18 });
        }
        bx += nx * s * 0.55 + (-ny) * (rng() * 2 - 1) * s * 0.3;
        by += ny * s * 0.55 + (nx) * (rng() * 2 - 1) * s * 0.3;
      }
      if (cubes.length) {
        list.push({ k: 1, t0: t, cubes: cubes, shade: rng() });
        var last = cubes[cubes.length - 1];
        tips.push({ x: last.x + nx * last.s * 0.5, y: last.y + ny * last.s * 0.5,
          nx: nx, ny: ny });
        tips.push({ x: last.x + (-ny) * last.s * 0.5, y: last.y + (nx) * last.s * 0.5,
          nx: -ny, ny: nx });
      }
      t += 0.7 + rng() * 0.8;
    }
  }
  return list;
}
events = genCrystal(SEED0);
/* ---- WebAudio: closed-form sound model, lazy, gesture only ---- */
/* Chimes sound on spine tips, low salt-crunch grains on cube stacking.
   The sounds follow the same deterministic event list as the picture;
   audio is created only inside the first user gesture (the sound
   toggle) and never autoplays. */
var audioCtx = null;
var audioReady = false;
var audioOn = false;
var sndIdx = 0;
(function initSndIdx() {
  while (sndIdx < events.length && events[sndIdx].t0 <= FRAME_T) sndIdx++;
})();
function ensureAudio() {
  if (audioCtx) return;
  try {
    var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    audioCtx = new AC();
    audioReady = true;
  } catch (e) { audioCtx = null; audioReady = false; }
}
function chime(freq, when) {
  if (!audioCtx || !audioReady) return;
  try {
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.07, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 1.4);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(when); osc.stop(when + 1.5);
  } catch (e) { /* audio is a garnish; never break the picture */ }
}
function crunch(when) {
  if (!audioCtx || !audioReady) return;
  try {
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = 82;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.12, when + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.16);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(when); osc.stop(when + 0.2);
  } catch (e) { /* ignore */ }
}
var CHIME_SCALE = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
function playEvent(e) {
  if (!audioCtx || !audioReady || !audioOn) return;
  try {
    var when = audioCtx.currentTime + 0.02;
    if (e.k === 0) {
      chime(CHIME_SCALE[Math.floor(e.shade * CHIME_SCALE.length) % CHIME_SCALE.length], when);
    } else {
      crunch(when);
    }
  } catch (err) { /* ignore */ }
}
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
function toggleSound() {
  ensureAudio();
  audioOn = !audioOn;
  if (audioOn && audioCtx && audioReady) {
    try { if (audioCtx.resume) audioCtx.resume(); } catch (e) { /* ignore */ }
  }
  draw();
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Centered geometric composition: full-bleed on phones, a centered
   square on desktop, the ground taking the piece's own near-black. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* The seed core: a small violet hexagon the whole crystal grows from. */
function drawCore(cx, cy, R) {
  var r = R * 0.08;
  var i, a;
  ctx.fillStyle = AM_DEEP;
  ctx.beginPath();
  for (i = 0; i < 6; i++) {
    a = i * TAU / 6 + Math.PI / 6;
    if (i === 0) ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    else ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = rgba(QUARTZ, 0.85);
  ctx.lineWidth = Math.max(1, R * 0.004);
  ctx.stroke();
  ctx.fillStyle = rgba(AM_LIGHT, 0.7);
  ctx.beginPath();
  for (i = 0; i < 6; i++) {
    a = i * TAU / 6 + Math.PI / 6;
    if (i === 0) ctx.moveTo(cx + Math.cos(a) * r * 0.45, cy + Math.sin(a) * r * 0.45);
    else ctx.lineTo(cx + Math.cos(a) * r * 0.45, cy + Math.sin(a) * r * 0.45);
  }
  ctx.closePath();
  ctx.fill();
}
/* A hexagonal spine: tapered shaft with a faceted tip, quartz edges. */
function drawSpine(e, p, age, cx, cy, R) {
  var dx = Math.cos(e.ang), dy = Math.sin(e.ang);
  var L = e.len * p * R;
  var w = e.w * R;
  var bx = cx + e.x * R, by = cy + e.y * R;
  var tx = bx + dx * L, ty = by + dy * L;
  var px = -dy, py = dx;
  var wTip = w * 0.3;
  var fresh = age < 1.5 ? 0.25 * (1 - age / 1.5) : 0;
  ctx.fillStyle = rgba(e.shade < 0.5 ? AM_MID : AM_DEEP, 0.88 + fresh);
  ctx.beginPath();
  ctx.moveTo(bx + px * w, by + py * w);
  ctx.lineTo(bx + dx * L * 0.55 + px * w * 0.85, by + dy * L * 0.55 + py * w * 0.85);
  ctx.lineTo(tx + px * wTip, ty + py * wTip);
  ctx.lineTo(tx + dx * w * 0.9, ty + dy * w * 0.9);
  ctx.lineTo(tx - px * wTip, ty - py * wTip);
  ctx.lineTo(bx + dx * L * 0.55 - px * w * 0.85, by + dy * L * 0.55 - py * w * 0.85);
  ctx.closePath();
  ctx.fill();
  /* quartz edge and a pale facet line down the shaft */
  ctx.strokeStyle = rgba(QUARTZ, 0.75);
  ctx.lineWidth = Math.max(0.75, R * 0.002);
  ctx.stroke();
  ctx.strokeStyle = rgba(AM_PALE, 0.55);
  ctx.lineWidth = Math.max(0.6, R * 0.0016);
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.lineTo(tx, ty);
  ctx.stroke();
  /* faceted tip: a small pale diamond where the spine ends */
  ctx.fillStyle = rgba(AM_PALE, 0.9);
  ctx.beginPath();
  ctx.moveTo(tx + dx * w * 0.9, ty + dy * w * 0.9);
  ctx.lineTo(tx + px * wTip, ty + py * wTip);
  ctx.lineTo(tx - dx * w * 0.5, ty - dy * w * 0.5);
  ctx.lineTo(tx - px * wTip, ty - py * wTip);
  ctx.closePath();
  ctx.fill();
}
/* A halite cube: translucent salt-white front, pale top, warm grey
   shadow side, quartz edges. */
function drawCube(c, p, cx, cy, R) {
  var s = c.s * p * R;
  if (s < 0.5) return;
  var x = cx + c.x * R, y = cy + c.y * R;
  var h = s / 2;
  var off = s * 0.28;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(c.rot);
  ctx.fillStyle = rgba(SALT, 0.72);
  ctx.beginPath();
  ctx.moveTo(-h, -h);
  ctx.lineTo(-h + off, -h - off);
  ctx.lineTo(h + off, -h - off);
  ctx.lineTo(h, -h);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = rgba(SALT, 0.55);
  ctx.fillRect(-h, -h, s, s);
  ctx.fillStyle = rgba(GREY, 0.7);
  ctx.beginPath();
  ctx.moveTo(h, -h);
  ctx.lineTo(h + off, -h - off);
  ctx.lineTo(h + off, h - off);
  ctx.lineTo(h, h);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = rgba(QUARTZ, 0.8);
  ctx.lineWidth = Math.max(0.75, R * 0.002);
  ctx.strokeRect(-h, -h, s, s);
  ctx.beginPath();
  ctx.moveTo(h, -h);
  ctx.lineTo(h + off, -h - off);
  ctx.lineTo(h + off, h - off);
  ctx.moveTo(-h, -h);
  ctx.lineTo(-h + off, -h - off);
  ctx.stroke();
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  var phaseName = (Math.floor(phaseT / PHASE_LEN) % 2 === 0) ? 'AMETHYST' : 'HALITE';
  var phaseCol = (Math.floor(phaseT / PHASE_LEN) % 2 === 0) ? AM_LIGHT : SALT;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('One Mineral, One Collaborator').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('One Mineral, One Collaborator').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 06').width;
  var phaseW = ctx.measureText(phaseName).width;
  var plateW = Math.max(titleW, dateW, phaseW) + 28;
  var plateH = titlePx + smallPx * 2 + 24;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('One Mineral, One Collaborator', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 03 · 06', plateX + 14, plateY + 7 + titlePx + 3);
  ctx.fillStyle = phaseCol;
  ctx.fillText(phaseName, plateX + 14, plateY + 7 + titlePx + 3 + smallPx + 2);
  var hint = 'Watch the crystal change its lattice.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  /* sound toggle, bottom right: the only control, watch-only otherwise */
  var snd = audioOn ? 'Sound: on' : 'Sound: off';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, soundPlate.x + 12, soundPlate.y + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  var cx = sc.x + sc.w / 2;
  var cy = sc.y + sc.h / 2;
  /* crystal fills two thirds of frame; on phones the tall field scales
     with the width instead, or the crystal reads as a postage stamp */
  var R = isPhone ? Math.min(VW * 0.46, VH * 0.26) : Math.min(sc.w, sc.h) * 0.38;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* the cut: a single black frame at each phase boundary, no blend */
  var inCut = (t % PHASE_LEN) < 0.15 && t > 0.2;
  if (!inCut) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(sc.x, sc.y, sc.w, sc.h);
    ctx.clip();
    /* a faint phase-tinted breath behind the crystal, under 1 Hz */
    var phase = Math.floor(t / PHASE_LEN) % 2;
    var tint = phase === 0 ? AM_MID : GREY;
    var breathe = 0.05 + 0.015 * Math.sin(t * 0.3);
    var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.5);
    glow.addColorStop(0, rgba(tint, breathe));
    glow.addColorStop(1, rgba(tint, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.moveTo(cx + R * 1.5, cy);
    ctx.arc(cx, cy, R * 1.5, 0, TAU);
    ctx.fill();
    drawCore(cx, cy, R);
    /* every event born so far, oldest first, so new growth sits on top */
    var i, j;
    for (i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.t0 > t) break;
      var age = t - e.t0;
      if (e.k === 0) {
        var p = clamp(age / 2.5, 0, 1);
        drawSpine(e, p, age, cx, cy, R);
      } else {
        for (j = 0; j < e.cubes.length; j++) {
          var cp = clamp((age - j * 0.25) / 1.5, 0, 1);
          drawCube(e.cubes[j], cp, cx, cy, R);
        }
      }
    }
    ctx.restore();
  }
  drawPlates();
}
/* ---- frame one: fixed phase t = 62.0 s, seed 1880, mid-amethyst with
   one amethyst and one halite phase already accumulated ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (canvas && typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', function (ev) {
    /* watch-only: the only tap target is the sound toggle */
    var x = 0, y = 0;
    try {
      if (ev && typeof ev.clientX === 'number') { x = ev.clientX; y = ev.clientY; }
      else if (ev && ev.touches && ev.touches[0]) { x = ev.touches[0].clientX; y = ev.touches[0].clientY; }
    } catch (e) { /* ignore */ }
    if (x >= soundPlate.x && x <= soundPlate.x + soundPlate.w &&
        y >= soundPlate.y && y <= soundPlate.y + soundPlate.h) {
      if (ev && ev.preventDefault) ev.preventDefault();
      toggleSound();
    }
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      /* sounds follow the same event list, only while audio is on */
      if (audioOn && audioReady) {
        while (sndIdx < events.length && events[sndIdx].t0 <= phaseT) {
          playEvent(events[sndIdx]);
          sndIdx++;
        }
      } else {
        while (sndIdx < events.length && events[sndIdx].t0 <= phaseT) sndIdx++;
      }
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
