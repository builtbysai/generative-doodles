<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.377 Night Sky Toss</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#14213D; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.377 Night Sky Toss (jenkbdoodles).
// After Jen K's Undersea Night Sky: a dense non-directional
// celestial toss on deep navy #14213D, exactly 240 flat icons in
// three scale bands with near-zero negative space. Large band:
// 12 gold crescent moons and 12 gold whales. Mid band: 24 moths,
// 24 all-seeing eyes and 24 tiny houses in purple, teal and pink,
// the eyes outlined in cream. Micro band: 72 gold stars and 72
// cream-outlined crystals. The prompt's offscreen sprite cache
// is forbidden by house rule, so every icon is a small path
// recipe drawn directly each frame on this ONE canvas; no icon
// exists anywhere but in the tables below.
// Loop: a seamless 45s master loop (LOOP). Every icon drifts on
// a tiny sine path whose x and y cycle counts are whole numbers
// per loop, so frame 45s is pixel-identical to frame 0 at rest.
// Gold stars twinkle between opacity 0.6 and 1.0 on periods of
// 5s and 3s, whole divisors of the loop.
// Interaction: DRAG stirs the field. Icons inside the pointer
// radius take a tangential swirl impulse (plus a slight outward
// push); on release a damped spring integrated on the same
// fixed ticks returns every icon to exactly its anchor, with a
// dead-zone snap so the settled offset is precisely zero. Taps
// do nothing; there is no click-to-reload and no other chrome.
// Flat colour only, no shading, no text, no labels.
// Determinism: the first frame is drawn synchronously at the
// constant phase T = 17.3 (field complete, drift and twinkle
// mid-cycle), never Date.now() minus an offset, and the
// animation advances from that anchor in fixed 1/60 ticks.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var LOOP = 45;
var TAU = Math.PI * 2;
var PAGE = '#14213D';
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 17.3, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- palette -------------------------------------------------------------
var GROUND = '#14213D';
var GOLD = '#E8C547';
var PURPLE = '#B565A7';
var TEAL = '#5BA3C4';
var PINK = '#D96A8B';
var CREAM = '#F3EBDD';
var MID_COLS = [PURPLE, TEAL, PINK];

// ---- seeded rng ------------------------------------------------------------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(377377);

// ---- the icon table ---------------------------------------------------------
// Exactly 240 icons, built band by band on jittered grids so the
// toss stays even and dense. Each icon: type, anchor x/y in
// design px, r = half-size, rot, col, flip, drift amplitudes
// ax/ay with whole cycle counts kx/ky per loop and phases,
// twinkle cycle count tw (gold stars only, 0 = steady), and the
// stir state sx/sy/vx/vy, all zero at rest.
var ICONS = [];
function addIcon(type, x, y, r, rot, col, flip, amp, tw) {
  ICONS.push({
    type: type, x: x, y: y, r: r, rot: rot, col: col, flip: flip,
    ax: amp * (0.6 + rng() * 0.7), ay: amp * (0.6 + rng() * 0.7),
    kx: 1 + Math.floor(rng() * 3), ky: 1 + Math.floor(rng() * 3),
    px: rng() * TAU, py: rng() * TAU,
    tw: tw, twp: rng() * TAU,
    sx: 0, sy: 0, vx: 0, vy: 0
  });
}
function scatterBand(types, cols, rows, rMin, rMax, amp, twinkle) {
  // One icon per jittered grid cell; types dealt round-robin from
  // a seeded shuffle so the counts per type stay exact.
  var order = [], i, j, k, tmp;
  for (i = 0; i < cols * rows; i++) order.push(types[i % types.length]);
  for (i = order.length - 1; i > 0; i--) {
    j = Math.floor(rng() * (i + 1));
    tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  var x0 = -50, y0 = -50, cw = (DW + 100) / cols, ch = (DH + 100) / rows;
  for (k = 0; k < order.length; k++) {
    var cx = k % cols, cy = Math.floor(k / cols);
    var x = x0 + (cx + 0.5) * cw + (rng() * 2 - 1) * cw * 0.30;
    var y = y0 + (cy + 0.5) * ch + (rng() * 2 - 1) * ch * 0.30;
    var type = order[k];
    var r = rMin + rng() * (rMax - rMin);
    var rot = (rng() * 2 - 1) * 0.35;
    var col = GOLD, flip = 1, tw = 0;
    if (type === 'moth' || type === 'eye' || type === 'house') {
      col = MID_COLS[Math.floor(rng() * 3)];
      rot = (rng() * 2 - 1) * (type === 'house' ? 0.12 : 0.28);
    }
    if (type === 'crystal') col = CREAM;
    if (type === 'whale') { flip = rng() < 0.5 ? -1 : 1; rot = (rng() * 2 - 1) * 0.3; }
    if (type === 'moon') rot = (rng() * 2 - 1) * 0.45;
    if (type === 'star' && twinkle) tw = rng() < 0.5 ? 9 : 15;
    addIcon(type, x, y, r, rot, col, flip, amp, tw);
  }
}
scatterBand(['moon', 'whale'], 6, 4, 52, 80, 8, false);          // 24 large
scatterBand(['moth', 'eye', 'house'], 9, 8, 30, 45, 6, false);  // 72 mid
scatterBand(['star', 'crystal'], 12, 12, 11, 18, 4, true);      // 144 micro
if (ICONS.length !== 240) throw new Error('Night Sky Toss needs exactly 240 icons');
var bandCount = [0, 0, 0];
for (var bi = 0; bi < ICONS.length; bi++) {
  if (ICONS[bi].type === 'moon' || ICONS[bi].type === 'whale') bandCount[0]++;
  else if (ICONS[bi].type === 'star' || ICONS[bi].type === 'crystal') bandCount[2]++;
  else bandCount[1]++;
}
if (bandCount[0] !== 24 || bandCount[1] !== 72 || bandCount[2] !== 144) {
  throw new Error('Night Sky Toss band counts must be 24 / 72 / 144');
}

// ---- icon recipes -------------------------------------------------------------
// Each recipe draws its motif centred on the origin at half-size
// r, in the icon's flat colour. Direct path data only.

function drawMoon(r, col) {
  // Crescent from two arcs: the outer circle less an offset
  // inner circle, intersection angles computed exactly.
  var d = 0.45 * r, r2 = 0.78 * r;
  var x = (d * d + r * r - r2 * r2) / (2 * d);
  var y = Math.sqrt(Math.max(0, r * r - x * x));
  ctx.beginPath();
  ctx.arc(0, 0, r, Math.atan2(-y, x), Math.atan2(y, x), true);
  ctx.arc(d, 0, r2, Math.atan2(y, x - d), Math.atan2(-y, x - d), false);
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
}

function drawStar(r, col) {
  var i, a, rad;
  ctx.beginPath();
  for (i = 0; i < 10; i++) {
    a = -Math.PI / 2 + i * (TAU / 10);
    rad = (i % 2 === 0) ? r : r * 0.45;
    if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
    else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
}

function drawEye(r, col) {
  // Almond outline in cream, pupil in the band colour with a
  // tiny cream centre dot.
  ctx.beginPath();
  ctx.moveTo(-r, 0);
  ctx.quadraticCurveTo(0, -r * 0.92, r, 0);
  ctx.quadraticCurveTo(0, r * 0.92, -r, 0);
  ctx.closePath();
  ctx.strokeStyle = CREAM;
  ctx.lineWidth = Math.max(1.6, r * 0.15);
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.32, 0, TAU);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.10, 0, TAU);
  ctx.fillStyle = CREAM;
  ctx.fill();
}

function drawMoth(r, col) {
  ctx.fillStyle = col;
  var s;
  for (s = -1; s <= 1; s += 2) {
    ctx.save();
    ctx.scale(s, 1);
    ctx.beginPath();
    ctx.ellipse(r * 0.46, -r * 0.10, r * 0.60, r * 0.40, -0.5, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(r * 0.40, r * 0.42, r * 0.46, r * 0.32, 0.6, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.beginPath();
  ctx.ellipse(0, r * 0.10, r * 0.17, r * 0.52, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, -r * 0.44, r * 0.17, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1.4, r * 0.09);
  ctx.lineCap = 'round';
  for (s = -1; s <= 1; s += 2) {
    ctx.beginPath();
    ctx.moveTo(s * r * 0.08, -r * 0.52);
    ctx.quadraticCurveTo(s * r * 0.45, -r * 0.95, s * r * 0.85, -r * 0.88);
    ctx.stroke();
  }
}

function drawCrystal(r, col) {
  // Diamond outline with three facet lines, cream throughout.
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1.4, r * 0.13);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(r * 0.60, -r * 0.30);
  ctx.lineTo(r * 0.38, r);
  ctx.lineTo(-r * 0.38, r);
  ctx.lineTo(-r * 0.60, -r * 0.30);
  ctx.closePath();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-r * 0.60, -r * 0.30);
  ctx.lineTo(r * 0.60, -r * 0.30);
  ctx.moveTo(0, -r);
  ctx.lineTo(-r * 0.38, r);
  ctx.moveTo(0, -r);
  ctx.lineTo(r * 0.38, r);
  ctx.stroke();
}

function drawWhale(r, col) {
  // Plump flat whale facing left: deep rounded head, high arched
  // back, flatter belly, tail stock ending in a wide horizontal
  // fluke with a centre notch, a pectoral fin, a ground-colour
  // eye dot and smile line on the head, and three spout droplets
  // above the head so it reads whale, never fish.
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-r, 0);
  ctx.bezierCurveTo(-r * 0.92, -r * 0.58, -r * 0.30, -r * 0.70, r * 0.25, -r * 0.55);
  ctx.bezierCurveTo(r * 0.50, -r * 0.47, r * 0.60, -r * 0.33, r * 0.66, -r * 0.18);
  ctx.quadraticCurveTo(r * 0.86, -r * 0.38, r * 1.02, -r * 0.40);
  ctx.quadraticCurveTo(r * 0.88, -r * 0.12, r * 0.82, -r * 0.03);
  ctx.quadraticCurveTo(r * 0.90, r * 0.14, r * 1.02, r * 0.34);
  ctx.quadraticCurveTo(r * 0.84, r * 0.30, r * 0.66, r * 0.15);
  ctx.bezierCurveTo(r * 0.40, r * 0.38, r * 0.10, r * 0.44, -r * 0.25, r * 0.42);
  ctx.bezierCurveTo(-r * 0.65, r * 0.40, -r * 0.96, r * 0.28, -r, 0);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-r * 0.05, r * 0.36);
  ctx.quadraticCurveTo(r * 0.10, r * 0.70, r * 0.30, r * 0.40);
  ctx.quadraticCurveTo(r * 0.12, r * 0.32, -r * 0.05, r * 0.36);
  ctx.closePath();
  ctx.fill();
  // Spout: three droplets fanning above the head.
  var drops = [[-0.58, -0.86, 0.075], [-0.40, -0.98, 0.09], [-0.20, -0.84, 0.065]];
  for (var di = 0; di < drops.length; di++) {
    ctx.beginPath();
    ctx.arc(drops[di][0] * r, drops[di][1] * r, Math.max(1.6, drops[di][2] * r), 0, TAU);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(-r * 0.68, -r * 0.10, Math.max(1.6, r * 0.07), 0, TAU);
  ctx.fillStyle = GROUND;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-r * 0.97, r * 0.08);
  ctx.quadraticCurveTo(-r * 0.82, r * 0.26, -r * 0.60, r * 0.20);
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = Math.max(1.6, r * 0.05);
  ctx.lineCap = 'round';
  ctx.stroke();
}

function drawHouse(r, col) {
  ctx.fillStyle = col;
  ctx.fillRect(r * 0.32, -r * 0.80, r * 0.20, r * 0.42); // chimney
  ctx.fillRect(-r * 0.56, -r * 0.02, r * 1.12, r * 0.82); // body
  ctx.beginPath(); // roof
  ctx.moveTo(-r * 0.78, -r * 0.02);
  ctx.lineTo(0, -r * 0.82);
  ctx.lineTo(r * 0.78, -r * 0.02);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = CREAM;
  ctx.fillRect(-r * 0.13, r * 0.30, r * 0.26, r * 0.50); // door
  ctx.beginPath();
  ctx.arc(0, r * 0.30, r * 0.13, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(-r * 0.42, r * 0.20, r * 0.16, r * 0.16); // windows
  ctx.fillRect(r * 0.26, r * 0.20, r * 0.16, r * 0.16);
}

var RECIPES = {
  moon: drawMoon, star: drawStar, eye: drawEye, moth: drawMoth,
  crystal: drawCrystal, whale: drawWhale, house: drawHouse
};

// ---- stir physics --------------------------------------------------------------
// Integrated on the same fixed 1/60 ticks as the master clock. A
// damped spring pulls each stir offset home; inside the dead
// zone the offset and velocity snap to exactly zero, so a
// settled field is the authored field, bit for bit.
function stirStep() {
  var i, ic, a;
  for (i = 0; i < ICONS.length; i++) {
    ic = ICONS[i];
    if (ic.sx === 0 && ic.sy === 0 && ic.vx === 0 && ic.vy === 0) continue;
    a = -30 * ic.sx - 7.5 * ic.vx;
    ic.vx += a * TICK; ic.sx += ic.vx * TICK;
    a = -30 * ic.sy - 7.5 * ic.vy;
    ic.vy += a * TICK; ic.sy += ic.vy * TICK;
    if (Math.abs(ic.sx) < 0.01 && Math.abs(ic.vx) < 0.05) { ic.sx = 0; ic.vx = 0; }
    if (Math.abs(ic.sy) < 0.01 && Math.abs(ic.vy) < 0.05) { ic.sy = 0; ic.vy = 0; }
  }
}
var STIR_R = 170;
function stirAt(px, py, strength) {
  var i, ic, dx, dy, d, f, tx, ty;
  for (i = 0; i < ICONS.length; i++) {
    ic = ICONS[i];
    dx = ic.x + ic.sx - px; dy = ic.y + ic.sy - py;
    d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1 || d > STIR_R) continue;
    f = 1 - d / STIR_R;
    tx = -dy / d; ty = dx / d; // tangential swirl direction
    ic.vx += (tx * 150 + (dx / d) * 45) * f * strength;
    ic.vy += (ty * 150 + (dy / d) * 45) * f * strength;
    var sp = Math.sqrt(ic.vx * ic.vx + ic.vy * ic.vy);
    if (sp > 280) { ic.vx = ic.vx / sp * 280; ic.vy = ic.vy / sp * 280; }
  }
}

// ---- drawing ---------------------------------------------------------------------

function draw(t) {
  var i, ic, dx, dy, alpha;
  for (i = 0; i < ICONS.length; i++) {
    ic = ICONS[i];
    dx = ic.x + ic.ax * Math.sin(TAU * (ic.kx * t / LOOP) + ic.px) + ic.sx;
    dy = ic.y + ic.ay * Math.sin(TAU * (ic.ky * t / LOOP) + ic.py) + ic.sy;
    ctx.save();
    ctx.translate(dx, dy);
    ctx.rotate(ic.rot);
    if (ic.flip < 0) ctx.scale(-1, 1);
    if (ic.tw) {
      alpha = 0.8 + 0.2 * Math.sin(TAU * (ic.tw * t / LOOP) + ic.twp);
      ctx.globalAlpha = alpha;
    }
    RECIPES[ic.type](ic.r, ic.col);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

// ---- sizing -------------------------------------------------------------------------

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- pointer: drag stirs --------------------------------------------------------------

var downPos = null;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downPos = p;
  stirAt(p.x, p.y, 0.45);
});
canvas.addEventListener('pointermove', function (e) {
  if (!downPos) return;
  var p = toDesign(e);
  stirAt(p.x, p.y, 1);
});
function endPointer() { downPos = null; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Cover-fit: the field fills any viewport, full-bleed.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAGE;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  ctx.fillStyle = GROUND;
  ctx.fillRect(-60, -60, DW + 120, DH + 120);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; stirStep(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
})();
</script>
</body>
</html>
