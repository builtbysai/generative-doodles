<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Target</title>
<style>
html, body { margin: 0; padding: 0; background: #2E2A27; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* The Daily Target: a dark rehearsal room where a practice session
   unfolds as stacked dated layers. A named technical target descends
   on a paper slip; thin copper waveform ribbons accumulate under the
   slip, one per attempt, each steadier than the last. When the
   session ends the slip seals into a labelled archive band at the
   bottom and the next slip drops. A small yellow clown sticker
   drifts in when the target names something absurdly hard. Watch
   only. Audio is omitted; the piece is visual only. */
var TAU = Math.PI * 2;
var GROUND = '#2E2A27';
var BAND = '#241F1D';
var PAPER = '#EFE9DC';
var COPPER = '#B87333';
var COPPER_LT = '#D08A4A';
var YELLOW = '#F2C200';
var INK = '#2E2A27';
var MUTED = '#8A8078';
var FRAME_T = 8.5;       /* fixed phase: second session, slip mid-descent,
                            three ribbons down, one target sealed */
var SESSION_LEN = 6;     /* seconds per session */
var ATTEMPT_AT = [0.6, 1.3, 2.0, 2.7, 3.4];
var SEAL_START = 5.0;
var SEAL_END = 5.9;
var DESCEND_LEN = 3.5;
var TARGETS = [
  { name: 'microtones', date: '2007 · 01 · 09', clown: false },
  { name: 'the C4', date: '2007 · 01 · 16', clown: false },
  { name: 'Sequenza III', date: '2007 · 01 · 23', clown: true },
  { name: 'Djamila Boupacha', date: '2007 · 01 · 30', clown: false }
];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* QA hook only: ?t=N sets the clock in seconds. No link in the piece
   uses it. */
try {
  var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
  var mt = qs.match(/[?&]t=([0-9.]+)/);
  if (mt) phaseT = parseFloat(mt[1]);
} catch (e) { /* keep defaults */ }
FRAME_T = phaseT;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on
   desktop. Returns {ox, oy, s, w, h}. */
function pieceRect() {
  if (isPhone) return { ox: 0, oy: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { ox: (VW - s) / 2, oy: (VH - s) / 2, s: s, w: s, h: s };
}
function sessionOf(t) {
  var s = Math.floor(t / SESSION_LEN);
  return { idx: s % TARGETS.length, local: t - s * SESSION_LEN, n: s };
}
function drawArchive(F, t) {
  var S = F.s;
  var bandY = F.oy + 0.66 * S;
  ctx.fillStyle = BAND;
  ctx.fillRect(F.ox, bandY, S, S - 0.66 * S);
  ctx.strokeStyle = rgba(PAPER, 0.35);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(F.ox + 0.06 * S, bandY + 0.5);
  ctx.lineTo(F.ox + 0.94 * S, bandY + 0.5);
  ctx.stroke();
  ctx.fillStyle = MUTED;
  ctx.font = Math.max(9, Math.round(0.016 * S)) + 'px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('ARCHIVE', F.ox + 0.06 * S, bandY + 0.018 * S);
  /* sealed chips: one per completed session in the current cycle */
  var sess = sessionOf(t);
  var sealed = sess.n % TARGETS.length;
  var i, tg;
  for (i = 0; i < sealed; i++) {
    tg = TARGETS[i];
    drawChip(F, tg, i);
  }
}
function drawChip(F, tg, i) {
  var S = F.s;
  var w = 0.34 * S, h = 0.05 * S;
  var x = F.ox + (S - w) / 2;
  var y = F.oy + (0.70 + i * 0.06) * S;
  ctx.fillStyle = rgba(INK, 0.35);
  ctx.fillRect(x + 0.004 * S, y + 0.004 * S, w, h);
  ctx.fillStyle = PAPER;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = COPPER;
  ctx.fillRect(x + 0.014 * S, y + h / 2 - 0.005 * S, 0.01 * S, 0.01 * S);
  var fs = Math.round(0.026 * S);
  ctx.font = fs + 'px monospace';
  while (fs > 8 && ctx.measureText(tg.name).width > w - 0.045 * S) {
    fs -= 1;
    ctx.font = fs + 'px monospace';
  }
  ctx.fillStyle = INK;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(tg.name, x + 0.034 * S, y + h / 2 + 0.5);
}
/* One waveform ribbon for attempt k of the current session. The
   wobble tightens and the line steadies as k grows. */
function drawRibbon(F, sess, k) {
  var S = F.s;
  var local = sess.local;
  var start = ATTEMPT_AT[k];
  if (local < start) return;
  var prog = clamp((local - start) / 0.5, 0, 1);
  var y0 = F.oy + (0.38 + k * 0.048) * S;
  var x0 = F.ox + 0.15 * S;
  var w = 0.70 * S;
  var amp = (0.018 - k * 0.003) * S;
  var cycles = 2.0 + k * 0.25;
  var ph = ((sess.n * 31 + k * 17) % 100) / 100 * TAU;
  ctx.strokeStyle = rgba(k < 2 ? COPPER : COPPER_LT, (0.50 + k * 0.09) * prog);
  ctx.lineWidth = Math.max(1, 0.0022 * S);
  ctx.lineCap = 'round';
  ctx.beginPath();
  var u, px, py;
  for (u = 0; u <= prog + 0.0001; u += 0.02) {
    px = x0 + u * w;
    py = y0 + amp * Math.sin(TAU * cycles * u + ph) * (0.7 + 0.3 * Math.sin(TAU * 3.7 * u + ph * 2));
    if (u === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}
function drawSlip(F, sess) {
  var S = F.s;
  var tg = TARGETS[sess.idx];
  var local = sess.local;
  var w = 0.46 * S, h = 0.11 * S;
  var restX = F.ox + (S - w) / 2;
  var restY = F.oy + 0.21 * S;
  var entryY = F.oy - h - 0.02 * S;
  var x = restX, y = restY, ww = w, hh = h, textA = 1;
  var df = clamp(local / DESCEND_LEN, 0, 1);
  var e = df * df;   /* ease-in: the slip drops like paper */
  y = lerp(entryY, restY, e);
  if (local >= SEAL_START) {
    var sf = clamp((local - SEAL_START) / (SEAL_END - SEAL_START), 0, 1);
    var sealed = sess.n % TARGETS.length;
    var cw = 0.34 * S, ch = 0.05 * S;
    var cx = F.ox + (S - cw) / 2;
    var cy = F.oy + (0.70 + sealed * 0.06) * S;
    x = lerp(restX, cx, sf);
    y = lerp(restY, cy, sf);
    ww = lerp(w, cw, sf);
    hh = lerp(h, ch, sf);
    textA = 1 - sf;
  }
  ctx.fillStyle = rgba(INK, 0.35);
  ctx.fillRect(x + 0.006 * S, y + 0.006 * S, ww, hh);
  ctx.fillStyle = PAPER;
  ctx.fillRect(x, y, ww, hh);
  /* copper pin at the top centre of the slip */
  if (textA > 0.5) {
    ctx.fillStyle = COPPER;
    ctx.beginPath();
    ctx.moveTo(x + ww / 2 + 0.008 * S, y + 0.008 * S);
    ctx.arc(x + ww / 2, y + 0.008 * S, Math.max(1.5, 0.006 * S), 0, TAU);
    ctx.fill();
  }
  if (textA > 0.05) {
    var nfs = Math.round(0.030 * S * (hh / h));
    ctx.font = 'bold ' + nfs + 'px monospace';
    while (nfs > 8 && ctx.measureText(tg.name).width > ww - 0.05 * S) {
      nfs -= 1;
      ctx.font = 'bold ' + nfs + 'px monospace';
    }
    ctx.fillStyle = rgba(INK, textA);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tg.name, x + ww / 2, y + hh * 0.38);
    var dfs = Math.round(0.018 * S * (hh / h));
    ctx.font = dfs + 'px monospace';
    ctx.fillStyle = rgba(INK, 0.65 * textA);
    ctx.fillText('session ' + tg.date, x + ww / 2, y + hh * 0.76);
  }
}
/* The clown sticker: a yellow vector face that drifts in from the
   right only while the target is absurdly hard (Sequenza III). */
function drawClown(F, sess) {
  var tg = TARGETS[sess.idx];
  if (!tg.clown) return;
  var S = F.s;
  var local = sess.local;
  var r = 0.05 * S;
  var enter = clamp(local / 2.0, 0, 1);
  var ee = 1 - (1 - enter) * (1 - enter);
  var cx = F.ox + lerp(1.08, 0.80, ee) * S;
  if (local >= SEAL_START) {
    var sf = clamp((local - SEAL_START) / (SEAL_END - SEAL_START), 0, 1);
    cx = F.ox + lerp(0.80, 1.08, sf) * S;
  }
  var cy = F.oy + 0.24 * S + Math.sin(local * TAU * 0.4) * 0.008 * S;
  ctx.fillStyle = YELLOW;
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(INK, 0.6);
  ctx.lineWidth = Math.max(1, 0.002 * S);
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.stroke();
  /* party hat: a small ink triangle on top */
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(cx - 0.32 * r, cy - 0.82 * r);
  ctx.lineTo(cx + 0.32 * r, cy - 0.82 * r);
  ctx.lineTo(cx, cy - 1.55 * r);
  ctx.closePath();
  ctx.fill();
  /* eyes */
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(cx - 0.38 * r, cy - 0.15 * r);
  ctx.arc(cx - 0.38 * r, cy - 0.15 * r, 0.11 * r, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + 0.38 * r, cy - 0.15 * r);
  ctx.arc(cx + 0.38 * r, cy - 0.15 * r, 0.11 * r, 0, TAU);
  ctx.fill();
  /* copper nose */
  ctx.fillStyle = COPPER;
  ctx.beginPath();
  ctx.moveTo(cx + 0.16 * r, cy + 0.12 * r);
  ctx.arc(cx, cy + 0.12 * r, 0.16 * r, 0, TAU);
  ctx.fill();
  /* smile */
  ctx.strokeStyle = INK;
  ctx.lineWidth = Math.max(1, 0.03 * r);
  ctx.beginPath();
  ctx.arc(cx, cy + 0.22 * r, 0.42 * r, 0.25 * Math.PI, 0.75 * Math.PI);
  ctx.stroke();
}
function drawPlates(R) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Daily Target').width > R.w - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Daily Target').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 22').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = R.ox + 12, plateY = R.oy + 12;
  ctx.fillStyle = BAND;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(PAPER, 0.45);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PAPER;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Daily Target', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2007 · 03 · 22', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the targets seal into the archive.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = R.ox + 12;
  var hintPlateY = R.oy + R.h - hintPlateH - 12;
  ctx.fillStyle = BAND;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(PAPER, 0.45);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = PAPER;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var R = pieceRect();
  /* The field itself lives in a square: on phones the square is
     centred inside the full-bleed viewport, so nothing stretches. */
  var S = Math.min(VW, VH);
  var F = isPhone
    ? { ox: (VW - S) / 2, oy: (VH - S) / 2, s: S, w: S, h: S }
    : R;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var t = phaseT;
  var sess = sessionOf(t);
  drawArchive(F, t);
  var k;
  for (k = 0; k < ATTEMPT_AT.length; k++) drawRibbon(F, sess, k);
  drawSlip(F, sess);
  drawClown(F, sess);
  drawPlates(R);
}
/* ---- frame one: fixed phase t = 8.5 s, second session (the C4),
   slip mid-descent, three ribbons down, microtones sealed ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
