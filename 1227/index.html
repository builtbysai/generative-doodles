<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Smoke (Four-Colour Catastrophe)</title>
<style>
  html, body { margin: 0; padding: 0; background: #E8E2D4; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Smoke (Four-Colour Catastrophe) - Leslie Supnet study block LS4,
  // after her 2014 film Smoke. A procedural volcanic plume, ink-drawn on
  // paper, that the viewer zooms into until the image dissolves into its
  // own four-colour offset printing process: CMYK rosette dots on rotated
  // grids, registration drifting further off as the zoom deepens, until
  // at 20x and beyond there is no catastrophe left - only print pattern.
  // "Distancing makes catastrophe a lot easier to digest"; here closeness
  // dissolves it. No real event, no photograph - the mechanics of seeing.
  //
  // Untouched, the print auto-drifts: a 90 s cycle rises in log space to
  // 12x, holds, falls back to 1x, rests. A vertical drag takes the zoom
  // over directly (200 px of travel = 4x); double-tap restarts the drift
  // from 1x. Six seconds after a drag ends, the drift quietly resumes
  // from whatever depth the visitor left it at.
  //
  // Timing choice: this is a scan/print piece, not one of Supnet's
  // stepped film loops, so the drift moves gently and continuously in
  // log space - but the rendered phase is quantized to 12 steps per
  // second, a print-scan stepping that keeps every frame reproducible.

  var PAPER = '#E8E2D4';
  var INK = '#3A3733';
  var COL_C = '#2AA9DE';
  var COL_M = '#E03A8B';
  var COL_Y = '#F2D024';
  var COL_K = '#1A1A1A';

  var T0 = 14;             // fixed first-frame phase, seconds into the drift

  // Plume space: x in [0, 0.8], y in [0, 1], y down. Ground at y ~0.96,
  // vent cone at bottom centre, column rising to a billowing cap.
  var SPACE_W = 0.8, SPACE_H = 1.0;

  // The dive target: the cap's right edge, where density grades from
  // solid ink through every mid-tone to bare paper - the richest ground
  // for rosettes. The sample window's centre travels from the plume
  // centre (0.40, 0.50) at 1x to this point at 40x. (Probed numerically:
  // across the 40x window here, D runs 0.15 to 0.69, mean 0.41.)
  var DIVE_X = 0.60, DIVE_Y = 0.295;

  // ---------- seeded hash (deterministic; no random calls anywhere) ----
  function hash01(n) {
    var x = ((n >>> 0) ^ 0x9E3779B9) >>> 0;
    x = Math.imul(x ^ (x >>> 16), 0x21F0AAAD);
    x = Math.imul(x ^ (x >>> 15), 0x735A2D97);
    x ^= x >>> 15;
    return (x >>> 0) / 4294967296;
  }
  function hash2(ix, iy, seed) {
    return hash01((Math.imul(ix, 374761393) + Math.imul(iy, 668265263) +
                   Math.imul(seed, 974634211)) | 0);
  }

  // ---------- value noise from hashed lattice points ------------------
  function vnoise(x, y, seed) {
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x - ix, fy = y - iy;
    var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    var v00 = hash2(ix, iy, seed), v10 = hash2(ix + 1, iy, seed);
    var v01 = hash2(ix, iy + 1, seed), v11 = hash2(ix + 1, iy + 1, seed);
    var a = v00 + (v10 - v00) * sx;
    var b = v01 + (v11 - v01) * sx;
    return a + (b - a) * sy;
  }

  // ---------- the plume, as data --------------------------------------
  // A density field D(x, y) in [0, 1], computable anywhere: summed radial
  // blobs (column, billowing cap, base) over a noise-displaced sample
  // point, soft-thresholded, with a vent cone and a ground band folded
  // in. Blob centres and radii carry small hashed jitter, fixed at load.
  var blobs = [];          // flat: x, y, r, w per blob
  (function buildBlobs() {
    var raw = [];
    var colY = [0.90, 0.80, 0.70, 0.60, 0.52];
    var colR = [0.070, 0.080, 0.090, 0.100, 0.110];
    for (var i = 0; i < colY.length; i++) {
      var xc = 0.40 + 0.022 * Math.sin(colY[i] * 4.6 + 1.1);
      raw.push([xc, colY[i], colR[i], 0.80]);
    }
    raw.push([0.40, 0.34, 0.160, 0.95]);   // cap core
    raw.push([0.30, 0.30, 0.130, 0.90]);
    raw.push([0.51, 0.31, 0.135, 0.90]);   // cap right - dive edge
    raw.push([0.36, 0.24, 0.130, 0.88]);
    raw.push([0.46, 0.22, 0.115, 0.85]);
    raw.push([0.28, 0.38, 0.100, 0.85]);
    raw.push([0.53, 0.40, 0.105, 0.85]);
    raw.push([0.40, 0.16, 0.100, 0.82]);   // cap top
    raw.push([0.40, 0.95, 0.100, 1.00]);   // base mass
    for (var j = 0; j < raw.length; j++) {
      var jx = (hash01(31000 + j * 3) - 0.5) * 0.024;
      var jy = (hash01(31000 + j * 3 + 1) - 0.5) * 0.024;
      var jr = 0.92 + 0.16 * hash01(31000 + j * 3 + 2);
      blobs.push(raw[j][0] + jx, raw[j][1] + jy, raw[j][2] * jr, raw[j][3]);
    }
  })();

  function density(x, y) {
    // Noise-displaced edge: sample the blobs at a wobbled point so the
    // plume's outline boils instead of sitting in perfect circles.
    var n1 = vnoise(x * 6 + 13.7, y * 6 + 91.3, 5);
    var n2 = vnoise(x * 6 + 57.1, y * 6 + 3.9, 9);
    var xd = x + (n1 - 0.5) * 0.06;
    var yd = y + (n2 - 0.5) * 0.06;
    var F = 0;
    for (var i = 0; i < blobs.length; i += 4) {
      var dx = xd - blobs[i], dy = yd - blobs[i + 1];
      var r = blobs[i + 2];
      var q = (dx * dx + dy * dy) / (r * r);
      if (q < 1) {
        var f = 1 - q;
        F += blobs[i + 3] * f * f;
      }
    }
    var D = (F - 0.16) / 0.78;
    if (D < 0) D = 0; else if (D > 1) D = 1;
    D = D * D * (3 - 2 * D);
    // Vent cone: apex (0.40, 0.90), base half-width 0.085 at the ground.
    if (y > 0.90 && y <= 1.0) {
      var hw = 0.085 * (y - 0.90) / 0.10;
      if (Math.abs(x - 0.40) < hw && D < 0.88) D = 0.88;
    }
    // Fine ink texture in the density itself.
    var g = vnoise(x * 34 + 7.7, y * 34 + 27.1, 23);
    D *= 0.93 + 0.14 * g;
    // Ground band.
    if (y > 0.962) {
      var gd = 0.50 + 0.25 * g;
      if (D < gd) D = gd;
    }
    if (D < 0) D = 0; else if (D > 1) D = 1;
    return D;
  }

  // ---------- zoom: drift cycle + recorded visitor events -------------
  var DRIFT_PEAK = 12;
  var PEAK_LZ = Math.log(DRIFT_PEAK);
  var MAX_LZ = Math.log(40);
  var CYCLE = 90, RISE = 32, HOLD_END = 50, FALL_END = 82;
  var RESUME_AFTER = 6;

  function driftLogz(u) {
    u = ((u % CYCLE) + CYCLE) % CYCLE;
    u = Math.floor(u * 12) / 12;         // 12 steps/s print-scan stepping
    if (u < RISE) {
      var p = u / RISE;
      return PEAK_LZ * (1 - (1 - p) * (1 - p));
    }
    if (u < HOLD_END) return PEAK_LZ;
    if (u < FALL_END) {
      var q = (u - HOLD_END) / (FALL_END - HOLD_END);
      return PEAK_LZ * (1 - q * q);
    }
    return 0;
  }
  // Inverse of the rise limb: the drift phase at which drift = lz.
  function phaseFor(lz) {
    if (lz <= 0) return 0;
    if (lz >= PEAK_LZ) return (RISE + HOLD_END) / 2;
    return RISE * (1 - Math.sqrt(1 - lz / PEAK_LZ));
  }

  var zEvents = [];        // {t, kind:'user', lz} | {t, kind:'reset'}
  var dragActive = false, dragY0 = 0, dragStartLz = 0, dragLz = 0;
  var lastT = T0;
  var lastDownT = -10, lastDownX = 0, lastDownY = 0;

  function logzAt(t) {
    if (dragActive) return dragLz;
    var mode = 'drift', epoch = 0, uLz = 0, uSince = 0;
    for (var i = 0; i < zEvents.length; i++) {
      var e = zEvents[i];
      if (e.t > t) break;
      if (mode === 'user' && e.t > uSince + RESUME_AFTER) {
        mode = 'drift';
        epoch = uSince + RESUME_AFTER - phaseFor(uLz);
      }
      if (e.kind === 'user') { mode = 'user'; uLz = e.lz; uSince = e.t; }
      else { mode = 'drift'; epoch = e.t; }
    }
    if (mode === 'user') {
      if (t > uSince + RESUME_AFTER) {
        return driftLogz(t - (uSince + RESUME_AFTER - phaseFor(uLz)));
      }
      return uLz;
    }
    return driftLogz(t - epoch);
  }
  function clampLz(lz) {
    if (lz < 0) return 0;
    if (lz > MAX_LZ) return MAX_LZ;
    return lz;
  }

  // ---------- canvas / viewport ---------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, isPhone = false;

  function fit() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    isPhone = (Math.min(sw, sh) < 700) || (h > w * 1.15);
  }
  fit();

  // Print rectangle: vertical format, aspect 0.8, centred in the frame.
  function printRect() {
    var ph = Math.min(H * 0.96, W * 0.94 / 0.8);
    var pw = ph * 0.8;
    if (pw > W * 0.94) { pw = W * 0.94; ph = pw / 0.8; }
    return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph };
  }

  // ---------- pointer: vertical drag zooms, double-tap resets ---------
  function evtY(e) {
    if (e.clientY !== undefined) return e.clientY;
    if (e.touches && e.touches.length) return e.touches[0].clientY;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientY;
    return 0;
  }
  function evtX(e) {
    if (e.clientX !== undefined) return e.clientX;
    if (e.touches && e.touches.length) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
    return 0;
  }
  function onDown(e) {
    var x = evtX(e), y = evtY(e);
    if (lastT - lastDownT < 0.35 &&
        Math.abs(x - lastDownX) < 30 && Math.abs(y - lastDownY) < 30) {
      // Double-tap: hand the print back to the drift, from 1x.
      zEvents.push({ t: lastT, kind: 'reset' });
      dragActive = false;
      lastDownT = -10;
      draw(lastT);
      return;
    }
    lastDownT = lastT; lastDownX = x; lastDownY = y;
    dragActive = true;
    dragY0 = y;
    dragStartLz = logzAt(lastT);
    dragLz = dragStartLz;
  }
  function onMove(e) {
    if (!dragActive) return;
    // 200 px of upward travel multiplies the zoom by 4.
    dragLz = clampLz(dragStartLz + (dragY0 - evtY(e)) / 200 * Math.log(4));
    draw(lastT);
  }
  function onUp() {
    if (!dragActive) return;
    dragActive = false;
    if (Math.abs(dragLz - dragStartLz) > 0.01) {
      zEvents.push({ t: lastT, kind: 'user', lz: dragLz });
      if (zEvents.length > 256) zEvents.splice(0, zEvents.length - 256);
    }
    draw(lastT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('dblclick', function () {
      zEvents.push({ t: lastT, kind: 'reset' });
      dragActive = false;
      draw(lastT);
    });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerup', onUp);
    window.addEventListener('resize', function () { fit(); draw(lastT); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(lastT); });
    }
  }

  // ---------- the two print regimes -----------------------------------
  // Regime weights along log zoom. Ink holds full to 6x and is gone at
  // 20x. Dots first stir at 4.5x - faint ghosts in the dense passages -
  // and own the frame from 20x.
  function regime(z) {
    var lz = Math.log(z);
    var wI = 1;
    if (lz > Math.log(6)) {
      wI = 1 - (lz - Math.log(6)) / (Math.log(20) - Math.log(6));
      if (wI < 0) wI = 0;
    }
    var wD = 0;
    if (lz > Math.log(4.5)) {
      wD = (lz - Math.log(4.5)) / (Math.log(20) - Math.log(4.5));
      if (wD > 1) wD = 1;
    }
    return { ink: wI, dot: wD };
  }

  // Sample window in plume space at zoom z.
  function windowAt(z) {
    var s = Math.log(z) / MAX_LZ;
    if (s < 0) s = 0; else if (s > 1) s = 1;
    var k = Math.pow(s, 1.5);
    return {
      cx: (SPACE_W / 2) + (DIVE_X - SPACE_W / 2) * k,
      cy: (SPACE_H / 2) + (DIVE_Y - SPACE_H / 2) * k,
      hw: (SPACE_W / 2) / z,
      hh: (SPACE_H / 2) / z
    };
  }

  function drawInk(pr, win, wI) {
    var cell = 6;
    var cols = Math.ceil(pr.w / cell), rows = Math.ceil(pr.h / cell);
    var grid = new Float32Array(cols * rows);
    var r, c, px, py;
    for (r = 0; r < rows; r++) {
      py = pr.y + (r + 0.5) * cell;
      var sy = win.cy - win.hh + ((py - pr.y) / pr.h) * 2 * win.hh;
      for (c = 0; c < cols; c++) {
        px = pr.x + (c + 0.5) * cell;
        var sx = win.cx - win.hw + ((px - pr.x) / pr.w) * 2 * win.hw;
        grid[r * cols + c] = density(sx, sy);
      }
    }
    ctx.fillStyle = INK;
    for (var L = 8; L >= 1; L--) {
      ctx.globalAlpha = (L / 8) * wI;
      for (r = 0; r < rows; r++) {
        for (c = 0; c < cols; c++) {
          if (Math.round(grid[r * cols + c] * 8) === L) {
            ctx.fillRect(pr.x + c * cell - 0.5, pr.y + r * cell - 0.5,
                         cell + 1, cell + 1);
          }
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // CMYK separations: classic screen angles, per-channel phase offsets
  // so the four grids interleave into rosettes, and a registration shift
  // per channel that grows linearly with zoom (K is the reference).
  var CHANNELS = [
    { col: COL_C, ang: 15, ox: 0.00, oy: 0.00, sx: 0.35, sy: 0.12, ds: 0.95, bias: 0.00 },
    { col: COL_M, ang: 75, ox: 0.50, oy: 0.33, sx: -0.30, sy: 0.24, ds: 0.90, bias: 0.02 },
    { col: COL_Y, ang: 0,  ox: 0.33, oy: 0.50, sx: 0.16, sy: -0.28, ds: 0.85, bias: 0.03 },
    { col: COL_K, ang: 45, ox: 0.50, oy: 0.50, sx: 0.00, sy: 0.00, ds: 1.00, bias: 0.05 }
  ];

  function drawDots(pr, win, wD, z) {
    var s = Math.min(pr.w, pr.h) / 46;
    if (s < 9) s = 9; else if (s > 15) s = 15;
    // Early in the blend the dots are only stirring: fainter and smaller,
    // so the breakup shows first along the density edge, where dots land
    // on paper and mid-tones, while solid ink still reads as ink. Both
    // reach full strength as wD does.
    var alpha = wD * 1.15;
    if (alpha > 1) alpha = 1;
    var rf = 0.42 + 0.58 * wD;
    ctx.save();
    ctx.beginPath();
    ctx.rect(pr.x, pr.y, pr.w, pr.h);
    ctx.clip();
    var ccx = pr.x + pr.w / 2, ccy = pr.y + pr.h / 2;
    var R = Math.sqrt(pr.w * pr.w + pr.h * pr.h) / 2 + s;
    var n = Math.ceil(R / s);
    for (var ch = 0; ch < CHANNELS.length; ch++) {
      var C = CHANNELS[ch];
      var th = C.ang * Math.PI / 180;
      var ux = Math.cos(th), uy = Math.sin(th);
      var vx = -uy, vy = ux;
      var shx = C.sx * z, shy = C.sy * z;      // registration, screen px
      ctx.fillStyle = C.col;
      ctx.globalAlpha = alpha;
      for (var i = -n; i <= n; i++) {
        for (var j = -n; j <= n; j++) {
          var px = ccx + ux * (i + C.ox) * s + vx * (j + C.oy) * s;
          var py = ccy + uy * (i + C.ox) * s + vy * (j + C.oy) * s;
          if (px < pr.x - s || px > pr.x + pr.w + s ||
              py < pr.y - s || py > pr.y + pr.h + s) continue;
          // Sample this channel's separation: the plume seen from a
          // point shifted by the channel's registration error.
          var qx = px - shx, qy = py - shy;
          var sxp = win.cx - win.hw + ((qx - pr.x) / pr.w) * 2 * win.hw;
          var syp = win.cy - win.hh + ((qy - pr.y) / pr.h) * 2 * win.hh;
          var Dc = density(sxp, syp) * C.ds - C.bias;
          if (Dc < 0.015) continue;
          var rad = s * 0.72 * Math.sqrt(Dc) * rf;
          if (rad < 0.5) continue;
          ctx.beginPath();
          ctx.moveTo(px + rad, py);
          ctx.arc(px, py, rad, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- paper grain ----------------------------------------------
  function drawGrain() {
    ctx.fillStyle = INK;
    for (var i = 0; i < 650; i++) {
      var gx = hash01(77000 + i * 2) * W;
      var gy = hash01(77000 + i * 2 + 1) * H;
      ctx.globalAlpha = 0.03 + 0.06 * hash01(79000 + i);
      var gs = 1 + Math.floor(hash01(81000 + i) * 2);
      ctx.fillRect(gx, gy, gs, 1);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- draw ------------------------------------------------------
  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    var z = Math.exp(logzAt(t));
    var win = windowAt(z);
    var reg = regime(z);
    var pr = printRect();

    if (reg.ink > 0) drawInk(pr, win, reg.ink);
    if (reg.dot > 0) drawDots(pr, win, reg.dot, z);

    // Plate mark: the hairline edge of the scanned print.
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1;
    ctx.strokeRect(pr.x + 0.5, pr.y + 0.5, pr.w - 1, pr.h - 1);
    ctx.globalAlpha = 1;

    drawGrain();
  }

  // ---------- first frame at fixed phase, then rAF anchored ------------
  draw(T0);
  if (typeof requestAnimationFrame !== 'undefined') {
    var startTs = null;
    var loop = function (ts) {
      if (startTs === null) startTs = ts;
      draw(T0 + (ts - startTs) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
