<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Never Posted</title>
<style>
  html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  // ---------- seeded PRNG (never Math.random) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function r4(x) { return Math.round(x * 10000) / 10000; }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function viewportSize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return { w: w, h: h };
  }
  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    var s = viewportSize();
    return s.h > s.w * 1.15;
  }
  function resize() {
    var s = viewportSize();
    canvas.width = Math.round(s.w);
    canvas.height = Math.round(s.h);
    canvas.style.width = Math.round(s.w) + 'px';
    canvas.style.height = Math.round(s.h) + 'px';
  }
  resize();
  if (typeof document !== 'undefined' && document.body) {
    document.body.style.background = '#141210';
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { resize(); });
    }
  }

  // ---------- seeded static scenery (computed once, never per-frame random) ----------
  var rng = mulberry32(1438000);
  // Stones: tall grey slabs left and right of the lake.
  var stones = [];
  var i, j;
  for (i = 0; i < 5; i++) {
    stones.push({ x: 0.015 + i * 0.038 + rng() * 0.012, w: 0.028 + rng() * 0.02, top: 0.30 + rng() * 0.10, shade: i % 2 ? '#8a8f94' : '#4a4a44' });
  }
  for (i = 0; i < 5; i++) {
    stones.push({ x: 0.80 + i * 0.038 + rng() * 0.012, w: 0.028 + rng() * 0.02, top: 0.28 + rng() * 0.12, shade: i % 2 ? '#4a4a44' : '#8a8f94' });
  }
  // Trees: dark blobs between stones and lake.
  var trees = [];
  for (i = 0; i < 9; i++) {
    trees.push({ x: 0.03 + rng() * 0.94, y: 0.48 + rng() * 0.06, r: 0.018 + rng() * 0.02 });
  }
  // Speckle grain for the photograph (fixed positions).
  var grain = [];
  for (i = 0; i < 260; i++) {
    grain.push({ x: rng(), y: rng(), a: 0.03 + rng() * 0.05 });
  }

  // ---------- scrap near-word generator ----------
  // Target the prompt's own near-word "N OFENDE" but never land on it: exactly
  // one letter is always mutated, so the string approaches the target and drifts away.
  var BASE = 'N OFENDE';
  var ALPH = 'ABCDEFGHJKLMNPRSTUVZ';
  function nearWord(t) {
    var tick = Math.floor(t / 2);
    var letters = [0, 2, 3, 4, 5, 6, 7]; // letter positions, skipping the space at 1
    var idx = letters[tick % letters.length];
    var r = mulberry32(1438000 + tick * 7919 + idx * 131);
    var ch = ALPH[Math.floor(r() * ALPH.length)];
    if (ch === BASE[idx]) ch = ALPH[(Math.floor(r() * ALPH.length) + 1) % ALPH.length];
    if (ch === BASE[idx]) ch = 'X';
    var out = '';
    for (j = 0; j < BASE.length; j++) out += (j === idx) ? ch : BASE[j];
    return out;
  }
  // Haze lines: single seeded letters separated by spaces — a haze, never a word.
  function hazeLine(t, row) {
    var tick = Math.floor(t / 4);
    var r = mulberry32(1438000 + tick * 7919 + row * 104729);
    var s = '';
    for (j = 0; j < 9; j++) {
      s += ALPH[Math.floor(r() * ALPH.length)] + ' ';
    }
    return s;
  }

  // ---------- drag state: closed-form over the recorded move list ----------
  var moves = []; // {x, y} in CSS pixels
  var downPos = null;
  function scrapCenter(W, H) { return { x: 0.72 * W, y: 0.13 * H }; }
  function zoomFromMoves(W, H) {
    var c = scrapCenter(W, H);
    var score = 0, prev = null, k;
    for (k = 0; k < moves.length; k++) {
      var m = moves[k];
      var d = Math.sqrt((m.x - c.x) * (m.x - c.x) + (m.y - c.y) * (m.y - c.y));
      if (prev !== null) score += (prev - d);
      prev = d;
    }
    var z = 1 + score * 0.015;
    if (z < 1) z = 1;
    if (z > 7) z = 7;
    return z;
  }
  function onDown(e) {
    var p = e;
    downPos = { x: p.clientX, y: p.clientY };
    moves.push({ x: p.clientX, y: p.clientY });
  }
  function onMove(e) {
    if (!downPos) return;
    moves.push({ x: e.clientX, y: e.clientY });
  }
  function onUp() { downPos = null; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---------- drawing ----------
  function draw(t) {
    var W = canvas.width, H = canvas.height;
    var s = Math.min(W, H);
    var phone = isPhone();
    void phone;

    // Photograph ground: black-and-white world.
    ctx.fillStyle = '#141210';
    ctx.fillRect(0, 0, W, H);

    // Carmine twilight sky (coloured collage layer): flat bands, never a gradient.
    ctx.fillStyle = '#a01818';
    ctx.fillRect(0, 0, W, 0.30 * H);
    ctx.fillStyle = '#7a1010';
    ctx.fillRect(0, 0.26 * H, W, 0.08 * H);

    // Twilight disc: flat-alpha circle, no gradient, no shadowBlur.
    ctx.beginPath();
    ctx.moveTo(0.30 * W + 0.05 * s, 0.16 * H);
    ctx.arc(0.30 * W, 0.16 * H, 0.05 * s, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(236,232,220,' + r4(0.25) + ')';
    ctx.fill();

    // Tall stones rising by the lake (grey photograph tones).
    for (i = 0; i < stones.length; i++) {
      var st = stones[i];
      ctx.fillStyle = st.shade;
      ctx.beginPath();
      ctx.moveTo(st.x * W, 0.56 * H);
      ctx.lineTo(st.x * W, st.top * H);
      ctx.lineTo((st.x + st.w * 0.7) * W, (st.top - 0.03) * H);
      ctx.lineTo((st.x + st.w) * W, 0.56 * H);
      ctx.closePath();
      ctx.fill();
    }

    // Shade: flat-alpha dark ground under stones and trees.
    ctx.fillStyle = 'rgba(20,18,16,' + r4(0.35) + ')';
    ctx.fillRect(0, 0.50 * H, W, 0.06 * H);

    // Trees: dark blobs.
    for (i = 0; i < trees.length; i++) {
      var tr = trees[i];
      ctx.beginPath();
      ctx.moveTo(tr.x * W + tr.r * s, tr.y * H);
      ctx.arc(tr.x * W, tr.y * H, tr.r * s, 0, Math.PI * 2);
      ctx.fillStyle = '#141210';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(tr.x * W + tr.r * s * 0.4, (tr.y + 0.03) * H);
      ctx.arc(tr.x * W, (tr.y + 0.03) * H, tr.r * s * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = '#3a3a34';
      ctx.fill();
    }

    // Lake: dark water, barely moving (60 s periodic shimmer, so the loop closes).
    ctx.fillStyle = '#1a2a2a';
    ctx.fillRect(0, 0.56 * H, W, 0.44 * H);
    for (i = 0; i < 4; i++) {
      var yy = (0.60 + i * 0.09) * H + Math.sin(2 * Math.PI * t / 60 + i * 1.7) * 0.004 * H;
      ctx.fillStyle = 'rgba(236,232,220,' + r4(0.06 + 0.02 * Math.sin(2 * Math.PI * t / 60 + i)) + ')';
      ctx.fillRect(0.08 * W, yy, 0.84 * W, Math.max(1, 0.0015 * H));
    }

    // Photograph grain (fixed, seeded).
    for (i = 0; i < grain.length; i++) {
      var g = grain[i];
      ctx.fillStyle = 'rgba(236,232,220,' + r4(g.a) + ')';
      ctx.fillRect(g.x * W, g.y * H, 1, 1);
    }

    // Island: glowing green, luminous at the lake's centre. Flat-alpha halos only.
    var ix = 0.50 * W, iy = 0.74 * H;
    var iw = 0.06 * s, ih = 0.02 * s;
    ctx.beginPath();
    ctx.moveTo(ix + iw * 1.5, iy);
    ctx.arc(ix, iy, iw * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(74,232,106,' + r4(0.12) + ')';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(ix + iw * 1.2, iy);
    ctx.arc(ix, iy, iw * 1.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(74,232,106,' + r4(0.28) + ')';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(ix + iw, iy);
    ctx.arc(ix, iy, iw, 0, Math.PI * 2);
    ctx.fillStyle = '#4ae86a';
    ctx.fill();
    // Visible cut edge around the island: hard white stroke, no blending.
    ctx.beginPath();
    ctx.moveTo(ix + iw, iy);
    ctx.arc(ix, iy, iw, 0, Math.PI * 2);
    ctx.strokeStyle = '#ece8dc';
    ctx.lineWidth = Math.max(1.5, 0.002 * s);
    ctx.stroke();

    // Figure: small, stylized, crouching, smiling, chin between outstretched arms.
    // Drawn as a collage cut-out with a hard white outline — never blended.
    var fx = ix, fy = iy - ih * 0.4;
    var fh = 0.05 * s; // figure height, small against the island
    var skin = '#d4a880';
    ctx.lineWidth = Math.max(1.5, 0.002 * s);
    ctx.strokeStyle = '#ece8dc';
    ctx.fillStyle = skin;
    // Legs folded (crouch).
    ctx.beginPath();
    ctx.moveTo(fx - 0.30 * fh, fy);
    ctx.lineTo(fx + 0.30 * fh, fy);
    ctx.lineTo(fx + 0.18 * fh, fy - 0.22 * fh);
    ctx.lineTo(fx - 0.18 * fh, fy - 0.22 * fh);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Torso.
    ctx.beginPath();
    ctx.moveTo(fx - 0.16 * fh, fy - 0.22 * fh);
    ctx.lineTo(fx + 0.16 * fh, fy - 0.22 * fh);
    ctx.lineTo(fx + 0.12 * fh, fy - 0.62 * fh);
    ctx.lineTo(fx - 0.12 * fh, fy - 0.62 * fh);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Outstretched arms, chin between them.
    ctx.beginPath();
    ctx.moveTo(fx - 0.55 * fh, fy - 0.52 * fh);
    ctx.lineTo(fx - 0.12 * fh, fy - 0.60 * fh);
    ctx.lineTo(fx - 0.10 * fh, fy - 0.48 * fh);
    ctx.lineTo(fx - 0.52 * fh, fy - 0.40 * fh);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(fx + 0.55 * fh, fy - 0.52 * fh);
    ctx.lineTo(fx + 0.12 * fh, fy - 0.60 * fh);
    ctx.lineTo(fx + 0.10 * fh, fy - 0.48 * fh);
    ctx.lineTo(fx + 0.52 * fh, fy - 0.40 * fh);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Head with smile, chin resting between the arms.
    ctx.beginPath();
    ctx.moveTo(fx + 0.14 * fh, fy - 0.70 * fh);
    ctx.arc(fx, fy - 0.70 * fh, 0.14 * fh, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Hair cap.
    ctx.beginPath();
    ctx.moveTo(fx + 0.14 * fh, fy - 0.74 * fh);
    ctx.arc(fx, fy - 0.74 * fh, 0.14 * fh, Math.PI, Math.PI * 2);
    ctx.fillStyle = '#141210';
    ctx.fill();
    // Smile.
    ctx.beginPath();
    ctx.moveTo(fx - 0.06 * fh, fy - 0.68 * fh);
    ctx.arc(fx, fy - 0.68 * fh, 0.06 * fh, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.strokeStyle = '#141210';
    ctx.lineWidth = Math.max(1, 0.0012 * s);
    ctx.stroke();
    // Eye dots.
    ctx.fillStyle = '#141210';
    ctx.fillRect(fx - 0.07 * fh, fy - 0.74 * fh, Math.max(1, 0.012 * fh), Math.max(1, 0.012 * fh));
    ctx.fillRect(fx + 0.05 * fh, fy - 0.74 * fh, Math.max(1, 0.012 * fh), Math.max(1, 0.012 * fh));

    // Scrap of paper in the sky: tiny at rest, enlarged by dragging toward it.
    var zoom = zoomFromMoves(W, H);
    var sc = scrapCenter(W, H);
    var baseW = 0.022 * s, baseH = 0.016 * s;
    var sw = baseW * zoom, sh = baseH * zoom;
    ctx.save();
    ctx.translate(sc.x, sc.y);
    ctx.rotate(-0.12);
    ctx.fillStyle = '#e8e2d4';
    ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
    ctx.strokeStyle = '#1a1712';
    ctx.lineWidth = Math.max(0.5, 0.0008 * s);
    ctx.strokeRect(-sw / 2, -sh / 2, sw, sh);
    if (zoom >= 2.5) {
      // Haze of words: the near-word plus letter haze, visible only when approached.
      ctx.fillStyle = '#1a1712';
      ctx.font = Math.max(6, 0.016 * s * zoom * 0.55) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(nearWord(t), 0, -sh * 0.18);
      ctx.font = Math.max(5, 0.010 * s * zoom * 0.55) + 'px monospace';
      ctx.fillText(hazeLine(t, 0), 0, sh * 0.18);
      ctx.fillText(hazeLine(t, 1), 0, sh * 0.42);
    }
    ctx.restore();
  }

  // Frame one = draw(0) via boot flag; the clock starts only with the rAF loop.
  draw(0);
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) / 1000;
    resize();
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
