<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.179 Hierarchical Draw</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EFE9DC; }
  canvas { display:block; touch-action:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font:12px system-ui, sans-serif; color:#1A1A1A; opacity:0.55;
    pointer-events:none; letter-spacing:0.04em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tap to reseed</div>
<script>
(function () {
'use strict';
// No.179 Hierarchical Draw (Goodman-Strauss). Trilobite tiles (a
// square with a quarter scale square notch) and cross tiles fill
// the field edge to edge on a jittered grid, notches facing tip to
// tip on a checkerboard matching rule with seeded variation. Every
// tile carries layered markings: indigo arc bands on the notch
// side, rust on the flat side. The markings line up into a lattice
// of squares, and the loop draws that lattice in at three
// doublings, s, 2s, 4s, holds, soft resets. Tap reseeds. All
// strokes carry a 1-2px hand wobble keyed to the shared lattice
// vertices so neighbouring tiles still meet.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0;
var GROUND = '#EFE9DC', INK = '#1A1A1A', INDIGO = '#2E3A9B', RUST = '#C4451F';
var T = 23000, OFFSET = 19000;
var seed = 20240709;
(function () {
  var m = /seed=(\d+)/.exec(location.search || '');
  if (m) seed = parseInt(m[1], 10) >>> 0;
})();
var epochT = 0, baseOffset = OFFSET;

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }
function hash(x, y, s) {
  var h = (x * 374761393 + y * 668265263 + s * 974634531) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
// hand wobble keyed to global quarter-cell coordinates
function wob(tx, ty) {
  var qx = Math.round(tx * 4), qy = Math.round(ty * 4);
  return [(hash(qx, qy, seed ^ 0x9e37) - 0.5) * 3.2, (hash(qy, qx, seed ^ 0x51f7) - 0.5) * 3.2];
}

var cs = 80, cols = 0, rows = 0;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  cs = Math.max(40, Math.min(100, Math.min(W, H) / 8.5));
  cols = Math.ceil(W / cs) + 2;
  rows = Math.ceil(H / cs) + 2;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function rotPt(lx, ly, k) {
  if (k === 0) return [lx, ly];
  if (k === 1) return [1 - ly, lx];
  if (k === 2) return [1 - lx, 1 - ly];
  return [ly, 1 - lx];
}
// local point of tile (i,j) -> screen point (wobbled)
function sp(i, j, lx, ly, k) {
  var r = rotPt(lx, ly, k);
  var tx = i + r[0], ty = j + r[1];
  var w = wob(tx, ty);
  return [(tx - 1) * cs + w[0], (ty - 1) * cs + w[1]];
}
function poly(i, j, pts, k, close) {
  ctx.beginPath();
  for (var n = 0; n < pts.length; n++) {
    var p = sp(i, j, pts[n][0], pts[n][1], k);
    if (n === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  if (close) ctx.closePath();
}
function arcPts(cx, cy, r, a0, a1, n) {
  var out = [];
  for (var s = 0; s <= n; s++) {
    var a = a0 + (a1 - a0) * s / n;
    out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return out;
}

var TRI = [[0, 0], [1, 0], [1, 0.375], [0.75, 0.375], [0.75, 0.625], [1, 0.625], [1, 1], [0, 1]];
var CROSS = [[0.25, 0], [0.75, 0], [0.75, 0.25], [1, 0.25], [1, 0.75], [0.75, 0.75], [0.75, 1], [0.25, 1], [0.25, 0.75], [0, 0.75], [0, 0.25], [0.25, 0.25]];
var DIAMOND = [[0.5, 0.38], [0.62, 0.5], [0.5, 0.62], [0.38, 0.5]];

function drawTile(i, j, alpha) {
  var isTri = hash(i, j, seed ^ 0x51) < 0.62;
  var k;
  if (isTri) {
    k = ((i + j) % 2 === 0) ? 0 : 2; // notches face tip to tip
    var v = hash(i, j, seed ^ 0x77);
    if (v < 0.16) k = (k + 1) % 4; else if (v < 0.32) k = (k + 3) % 4;
  } else {
    k = Math.floor(hash(i, j, seed ^ 0x77) * 4) % 4;
  }
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.8;
  ctx.lineJoin = 'round';
  poly(i, j, isTri ? TRI : CROSS, k, true);
  ctx.stroke();
  ctx.lineCap = 'round';
  if (isTri) {
    ctx.strokeStyle = INDIGO;
    ctx.lineWidth = 0.085 * cs;
    poly(i, j, arcPts(0.88, 0.5, 0.30, Math.PI * 0.62, Math.PI * 1.38, 12), k, false);
    ctx.stroke();
    ctx.lineWidth = 0.055 * cs;
    poly(i, j, arcPts(0.88, 0.5, 0.185, Math.PI * 0.62, Math.PI * 1.38, 10), k, false);
    ctx.stroke();
    ctx.strokeStyle = RUST;
    ctx.lineWidth = 0.085 * cs;
    poly(i, j, arcPts(0.10, 0.5, 0.30, -Math.PI * 0.38, Math.PI * 0.38, 12), k, false);
    ctx.stroke();
  } else {
    ctx.strokeStyle = INDIGO;
    ctx.lineWidth = 0.07 * cs;
    poly(i, j, arcPts(0.5, 0.03, 0.155, Math.PI * 0.15, Math.PI * 0.85, 8), k, false);
    ctx.stroke();
    ctx.strokeStyle = RUST;
    poly(i, j, arcPts(0.5, 0.97, 0.155, Math.PI * 1.15, Math.PI * 1.85, 8), k, false);
    ctx.stroke();
  }
  ctx.fillStyle = INK;
  poly(i, j, DIAMOND, k, true);
  ctx.fill();
  ctx.globalAlpha = 1;
}

// hierarchy overlay: squares at cell = cs * 2^L, ordered by growth
function overlaySquares(L) {
  var step = Math.pow(2, L);
  var out = [];
  var na = Math.ceil(W / cs / step) + 2, nb = Math.ceil(H / cs / step) + 2;
  for (var a = 0; a < na; a++) for (var b = 0; b < nb; b++) out.push([a, b]);
  out.sort(function (p, q) { return (p[0] + p[1]) - (q[0] + q[1]) || p[0] - q[0]; });
  return { step: step, list: out };
}
function drawOverlay(L, progress, fade) {
  if (progress <= 0) return;
  var o = overlaySquares(L);
  var n = Math.floor(progress * o.list.length);
  var cell = cs * o.step;
  ctx.lineWidth = 1.6 + L * 0.7;
  for (var s = 0; s < n; s++) {
    var a = o.list[s][0] * o.step, b = o.list[s][1] * o.step;
    var corners = [[a, b], [a + o.step, b], [a + o.step, b + o.step], [a, b + o.step]];
    var pts = corners.map(function (c) {
      var w = wob(c[0], c[1]);
      return [(c[0] - 1) * cs + w[0], (c[1] - 1) * cs + w[1]];
    });
    ctx.globalAlpha = 0.85 * fade;
    ctx.strokeStyle = INK;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    ctx.lineTo(pts[1][0], pts[1][1]);
    ctx.lineTo(pts[2][0], pts[2][1]);
    ctx.lineTo(pts[3][0], pts[3][1]);
    ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 0.55 * fade;
    ctx.beginPath(); // left edge indigo
    ctx.strokeStyle = INDIGO;
    ctx.moveTo(pts[3][0], pts[3][1]);
    ctx.lineTo(pts[0][0], pts[0][1]);
    ctx.stroke();
    ctx.beginPath(); // right edge rust
    ctx.strokeStyle = RUST;
    ctx.moveTo(pts[1][0], pts[1][1]);
    ctx.lineTo(pts[2][0], pts[2][1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var ts = ((((now - epochT + baseOffset) % T) + T) % T) / 1000;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var fade = ts >= 21 ? 1 - smooth((ts - 21) / 2) : 1;
  var ci = cols / 2, cj = rows / 2;
  for (var j = 0; j < rows; j++) {
    for (var i = 0; i < cols; i++) {
      var d = Math.sqrt((i - ci) * (i - ci) + (j - cj) * (j - cj));
      var a = clamp01((ts - d * 0.28) / 1.4) * fade;
      if (a > 0.01) drawTile(i, j, a);
    }
  }
  for (var L = 0; L < 3; L++) {
    drawOverlay(L, clamp01((ts - (4 + 3 * L)) / 2.6), fade);
  }
}

var downAt = 0, downX = 0, downY = 0;
canvas.addEventListener('pointerdown', function (e) {
  downAt = e.timeStamp; downX = e.clientX; downY = e.clientY;
});
canvas.addEventListener('pointerup', function (e) {
  var moved = Math.sqrt((e.clientX - downX) * (e.clientX - downX) + (e.clientY - downY) * (e.clientY - downY));
  if (e.timeStamp - downAt < 400 && moved < 14) {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    epochT = e.timeStamp; baseOffset = 0;
  }
});

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
