<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.374 Moth Mosaic</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#2A1F2B; }
  canvas { display:block; touch-action:none; cursor:grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.374 Moth Mosaic (al_kovalyova_design).
// After Olena Kovalova's moth suite: a great dusky moth
// on deep plum whose spread wings are a mosaic - each
// wing an 8x8 grid of tiles clipped to a hand-authored
// bezier wing shape with tattered notches, every tile
// holding one mini-motif (petal, dot, leaf or spiral)
// in stepped blue-to-lavender flat tones, grout lines
// between. The wings beat slowly, plus or minus 10
// degrees on a 3s cycle. Dragging near a wing ripples
// the tiles outward from the pointer on damped springs
// and they settle back to exactly their authored
// positions; double-tap advances the mosaic motif
// assignment through three authored arrangement
// tables. Sparse sprigs drift in the negative space.
// Nothing is runtime random: the wing outline, the
// tile set, the motif tables, the body fuzz and the
// sprigs are all fixed data below.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#2A1F2B', GROUT = '#1E1520', BODY = '#4A2E1E';
var CREAM = '#F5EFE2', GOLD = '#C9A24B';
// The blue-to-lavender ramp as six discrete stepped
// flat tones, blue at the wing root to lavender at
// the tips. No gradients anywhere.
var TONES = ['#9BB8D3', '#98ACCA', '#969FC2', '#9393B9', '#9186B1', '#8E7AA8'];
var DW = 1280, DH = 900, AXIS = 640;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 12;
if (LOOP !== 12) throw new Error('Moth Mosaic loop must be 12s');
if (TONES.length !== 6) throw new Error('Moth Mosaic needs exactly 6 stepped tones');
var TICK = 1 / 60;
var BEAT_PERIOD = 3; // seconds; LOOP / BEAT_PERIOD = 4 whole beats per loop
if (LOOP % BEAT_PERIOD !== 0) throw new Error('wing beat must complete whole cycles per loop');
var BEAT_AMP = 10 * Math.PI / 180; // plus or minus 10 degrees

// ---- wing outline ---------------------------------------------
// Authored in wing-local coords: origin at the wing
// root, +x outward, +y down. The grid bbox is x 0..448,
// y -224..224. The outline is a list of cubic segments
// and straight notch dips: two notches bite the outer
// and trailing edges and one bites the hindwing bottom,
// so the wings read tattered, never butterfly-clean.
// Sampled once into a polygon used both for the tile
// mask test and for the drawn silhouette path.
var OUTLINE = [
  // [kind, ...] kind 'c': cubic c1x c1y c2x c2y x y ; kind 'l': line x y
  ['M', 4, -88],
  ['c', 150, -232, 310, -238, 430, -150],  // forewing leading edge to the tip
  ['c', 454, -122, 442, -40, 410, 14],     // tip rounding down the outer edge
  ['l', 386, 26],                          // notch 1 bite in
  ['l', 400, 56],                          // notch 1 back out
  ['c', 394, 94, 366, 126, 332, 148],      // trailing edge into the hindwing
  ['l', 308, 156],                         // notch 2 bite in
  ['l', 324, 184],                         // notch 2 back out
  ['c', 292, 198, 266, 207, 240, 210],     // hindwing bottom, first span
  ['l', 222, 192],                         // notch 3 bite up into the wing
  ['l', 204, 208],                         // notch 3 back out to the edge
  ['c', 150, 209, 80, 190, 28, 140],       // bottom into the inner root
  ['c', 12, 96, 6, 40, 8, -12],            // inner edge rising
  ['c', 6, -44, 4, -66, 4, -88]            // home to the root top
];
function sampleOutline() {
  var pts = [], cur = null, i, j;
  for (i = 0; i < OUTLINE.length; i++) {
    var seg = OUTLINE[i];
    if (seg[0] === 'M') { cur = [seg[1], seg[2]]; pts.push(cur); }
    else if (seg[0] === 'l') { cur = [seg[1], seg[2]]; pts.push(cur); }
    else {
      var p0 = cur, c1 = [seg[1], seg[2]], c2 = [seg[3], seg[4]], p1 = [seg[5], seg[6]];
      var steps = 22;
      for (j = 1; j <= steps; j++) {
        var t = j / steps, u = 1 - t;
        pts.push([
          u * u * u * p0[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p1[0],
          u * u * u * p0[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * p1[1]
        ]);
      }
      cur = p1;
    }
  }
  return pts;
}
var WING_POLY = sampleOutline();
function inWing(x, y) {
  // ray-cast point-in-polygon over the sampled outline
  var inside = false, i, j;
  for (i = 0, j = WING_POLY.length - 1; i < WING_POLY.length; j = i++) {
    var xi = WING_POLY[i][0], yi = WING_POLY[i][1];
    var xj = WING_POLY[j][0], yj = WING_POLY[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

// ---- tiles ------------------------------------------------------
// The 8x8 mosaic grid over the wing bbox. A cell becomes
// a tile when its centre falls inside the wing outline;
// tiles are drawn inset so the grout shows between
// them, and clipped to the silhouette so edge tiles
// follow the tattered edge exactly. Tone steps run
// blue at the root toward lavender at the tips and
// lower edge. A fixed authored set of cells is cream.
var CELL = 56, HALF = 25; // tile drawn 50px, 3px grout gap each side
var HI_CELLS = { '1,1': 1, '6,2': 1, '2,5': 1, '5,6': 1, '3,3': 1, '4,0': 1 };
var TILES = [];
(function () {
  for (var row = 0; row < 8; row++) {
    for (var col = 0; col < 8; col++) {
      var lx = col * CELL + CELL / 2, ly = -224 + row * CELL + CELL / 2;
      if (!inWing(lx, ly)) continue;
      var t = (col * 0.65 + row * 0.35) / 7;
      var tone = Math.min(5, Math.floor(t * 6));
      TILES.push({ col: col, row: row, lx: lx, ly: ly, tone: tone, hi: !!HI_CELLS[col + ',' + row] });
    }
  }
  if (TILES.length < 30) throw new Error('wing mask holds too few tiles: ' + TILES.length);
})();
// Motif library, exactly four: 0 petal, 1 dot, 2 leaf,
// 3 spiral. Three authored arrangement tables map each
// cell to a motif; double-tap advances the table.
var TABLES = [
  function (c, r) { return (c + 2 * r) % 4; },
  function (c, r) { return (3 * c + r + 1) % 4; },
  function (c, r) { return ((c >> 1) + 2 * (r >> 1)) % 4; }
];
if (TABLES.length !== 3) throw new Error('Moth Mosaic needs exactly 3 motif tables');
var tableIdx = 0;
// Tile instances: one per tile per wing, carrying the
// ripple spring state in world space. Offsets start at
// exactly zero and snap back to exactly zero.
var INST = [];
(function () {
  for (var s = 0; s < 2; s++) {
    for (var i = 0; i < TILES.length; i++) {
      INST.push({ tile: TILES[i], side: s === 0 ? 1 : -1, dx: 0, dy: 0, vx: 0, vy: 0 });
    }
  }
})();

// ---- body ---------------------------------------------------------
// Fuzzy thorax, head and tapered abdomen in #4A2E1E on
// the axis; feathery antennae sampled from two authored
// cubics with barb strokes along them. Fuzz strokes are
// baked at load from a fixed-seed LCG: deterministic
// data, never per-frame noise.
var seed = 374;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
var FUZZ = [];
(function () {
  var i, a, ex, ey;
  for (i = 0; i < 90; i++) { // thorax + abdomen fuzz
    a = rnd() * Math.PI * 2;
    var cy = 400 + rnd() * 230, ry = 46 + (cy - 400) * 0.28, rx = 37 - (cy - 400) * 0.045;
    ex = AXIS + Math.cos(a) * rx; ey = cy + Math.sin(a) * ry * 0.9;
    FUZZ.push([ex, ey, ex + Math.cos(a) * (5 + rnd() * 7), ey + Math.sin(a) * (5 + rnd() * 7)]);
  }
  for (i = 0; i < 26; i++) { // head fuzz
    a = rnd() * Math.PI * 2;
    ex = AXIS + Math.cos(a) * 29; ey = 352 + Math.sin(a) * 27;
    FUZZ.push([ex, ey, ex + Math.cos(a) * (4 + rnd() * 5), ey + Math.sin(a) * (4 + rnd() * 5)]);
  }
})();
function cubicAt(p0, c1, c2, p1, t) {
  var u = 1 - t;
  return [
    u * u * u * p0[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p1[0],
    u * u * u * p0[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * p1[1]
  ];
}
var ANT = { p0: [652, 330], c1: [700, 262], c2: [762, 238], p1: [806, 246] };

// ---- sprigs -------------------------------------------------------
// Sparse sprigs in the negative space: a curved stem,
// three leaf pairs in stepped tones, a gold tip dot.
// Each drifts on whole cycles of the 12s loop (one bob
// cycle, two sway cycles) so the loop is seamless.
// [x, y, rotation, toneA, toneB, phase]
var SPRIGS = [
  [112, 148, -0.45, 0, 2, 0.0], [150, 762, 0.30, 1, 3, 0.37],
  [1168, 140, 0.45, 2, 4, 0.61], [1130, 772, -0.30, 3, 5, 0.83],
  [88, 470, -1.15, 4, 1, 0.19], [1192, 472, 1.15, 5, 2, 0.52],
  [300, 108, -0.15, 1, 4, 0.74], [988, 104, 0.15, 0, 3, 0.28],
  [292, 806, 0.20, 3, 0, 0.91], [1002, 812, -0.20, 2, 5, 0.44],
  [640, 84, 0.0, 4, 2, 0.66]
];

// ---- motion state ---------------------------------------------------
// Constant first-frame phase: T = 1.75s into the 12s
// loop. The wing beat (3s cycle) sits at sin = -0.5
// there, angle -5 degrees: wings mid-beat, neither
// raised nor pressed flat. All ripple offsets are zero.
// Frame one is drawn synchronously at this constant;
// the rAF loop advances T from the same anchor in fixed
// ticks. Frame one never reads a wall clock.
var T = 1.75;
var lastNow = -1, acc = 0;
var ROOT_R = [652, 445], ROOT_L = [628, 445];

function beatAngle() {
  return BEAT_AMP * Math.sin(Math.PI * 2 * ((T % BEAT_PERIOD) / BEAT_PERIOD));
}
function rot(x, y, a) {
  var c = Math.cos(a), s = Math.sin(a);
  return [x * c - y * s, x * s + y * c];
}
function tileWorld2(inst, th) {
  // world centre of a tile instance at beat angle th;
  // the left wing negates the local x and rotates by
  // -th about its own root, which is exactly the axis
  // mirror of the right wing's placement
  var lx = inst.side > 0 ? inst.tile.lx : -inst.tile.lx;
  var r = rot(lx, inst.tile.ly, inst.side * th);
  var root = inst.side > 0 ? ROOT_R : ROOT_L;
  return [root[0] + r[0] + inst.dx, root[1] + r[1] + inst.dy];
}

// ---- drawing -------------------------------------------------------
function wingPathWorld(side, th) {
  ctx.beginPath();
  for (var i = 0; i < WING_POLY.length; i++) {
    var lx = side > 0 ? WING_POLY[i][0] : -WING_POLY[i][0];
    var r = rot(lx, WING_POLY[i][1], side * th);
    var root = side > 0 ? ROOT_R : ROOT_L;
    var x = root[0] + r[0], y = root[1] + r[1];
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function drawMotif(m, tone, hi) {
  // mini-motif centred at origin inside a tile, drawn
  // in the tile's local frame (unit ~ tile half 25)
  var ink = hi ? '#8E7AA8' : CREAM;
  var i, a;
  if (m === 0) { // petal: a small five-petal flower
    ctx.fillStyle = ink;
    for (i = 0; i < 5; i++) {
      a = (i / 5) * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * 8, Math.sin(a) * 8, 6.4, 4.2, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = GOLD;
    ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, Math.PI * 2); ctx.fill();
  } else if (m === 1) { // dot: gold cluster
    ctx.fillStyle = GOLD;
    var offs = [[0, -8], [-8, 2], [8, 2], [-4, 10], [4, 10]];
    for (i = 0; i < offs.length; i++) {
      ctx.beginPath(); ctx.arc(offs[i][0], offs[i][1], 3.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.arc(0, 1, 2.2, 0, Math.PI * 2); ctx.fill();
  } else if (m === 2) { // leaf: stem with two leaflets
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-3, 13); ctx.quadraticCurveTo(0, 0, 3, -13); ctx.stroke();
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.ellipse(-7, 3, 7.5, 3.6, -0.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7, -3, 7.5, 3.6, -0.7, 0, Math.PI * 2); ctx.fill();
  } else { // spiral: an Archimedean swirl
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    var turns = 2.6 * Math.PI, steps = 40;
    for (i = 0; i <= steps; i++) {
      var t2 = i / steps, rr = 11.5 * t2;
      var sx = Math.cos(t2 * turns) * rr, sy = Math.sin(t2 * turns) * rr;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }
}
function drawWing(side, th) {
  // grout silhouette
  wingPathWorld(side, th);
  ctx.fillStyle = GROUT;
  ctx.fill();
  // tiles clipped to the silhouette
  ctx.save();
  wingPathWorld(side, th);
  ctx.clip();
  for (var i = 0; i < INST.length; i++) {
    var inst = INST[i];
    if (inst.side !== side) continue;
    var w = tileWorld2(inst, th);
    ctx.save();
    ctx.translate(w[0], w[1]);
    ctx.rotate(side * th);
    if (side < 0) ctx.scale(-1, 1);
    ctx.fillStyle = inst.tile.hi ? CREAM : TONES[inst.tile.tone];
    ctx.fillRect(-HALF, -HALF, HALF * 2, HALF * 2);
    drawMotif(TABLES[tableIdx](inst.tile.col, inst.tile.row), inst.tile.tone, inst.tile.hi);
    ctx.restore();
  }
  ctx.restore();
  // crisp tattered edge
  wingPathWorld(side, th);
  ctx.strokeStyle = GROUT;
  ctx.lineWidth = 2.5;
  ctx.stroke();
}
function drawAntenna(side) {
  ctx.strokeStyle = BODY;
  ctx.lineCap = 'round';
  var P = function (p) { return [AXIS + side * (p[0] - AXIS), p[1]]; };
  var p0 = P(ANT.p0), c1 = P(ANT.c1), c2 = P(ANT.c2), p1 = P(ANT.p1);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(p0[0], p0[1]);
  ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], p1[0], p1[1]);
  ctx.stroke();
  // feathery barbs along the stem, tapering to the tip
  ctx.lineWidth = 1.8;
  for (var t = 0.14; t < 0.98; t += 0.075) {
    var pt = cubicAt(p0, c1, c2, p1, t);
    var pt2 = cubicAt(p0, c1, c2, p1, t + 0.02);
    var tx = pt2[0] - pt[0], ty = pt2[1] - pt[1];
    var tl = Math.sqrt(tx * tx + ty * ty) || 1; tx /= tl; ty /= tl;
    var len = 17 * (1 - t * 0.45);
    // barbs angled off the stem tangent, both sides
    ctx.beginPath();
    ctx.moveTo(pt[0], pt[1]);
    ctx.lineTo(pt[0] + (tx * 0.45 - ty * 0.89) * len, pt[1] + (ty * 0.45 + tx * 0.89) * len);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pt[0], pt[1]);
    ctx.lineTo(pt[0] + (tx * 0.45 + ty * 0.89) * len * 0.8, pt[1] + (ty * 0.45 - tx * 0.89) * len * 0.8);
    ctx.stroke();
  }
}
function drawBody() {
  // abdomen and thorax as filled capsules
  ctx.fillStyle = BODY;
  ctx.beginPath(); ctx.ellipse(AXIS, 596, 27, 82, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(AXIS, 462, 38, 92, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(AXIS, 352, 30, 0, Math.PI * 2); ctx.fill();
  // abdomen segmentation in grout, for a dusky texture
  ctx.strokeStyle = GROUT;
  ctx.lineWidth = 2.4;
  var segY = [556, 588, 620, 650];
  for (var si = 0; si < segY.length; si++) {
    ctx.beginPath();
    ctx.moveTo(AXIS - 24 + si * 1.5, segY[si]);
    ctx.quadraticCurveTo(AXIS, segY[si] + 7, AXIS + 24 - si * 1.5, segY[si]);
    ctx.stroke();
  }
  // fuzz strokes baked at load
  ctx.strokeStyle = BODY;
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (var i = 0; i < FUZZ.length; i++) {
    ctx.moveTo(FUZZ[i][0], FUZZ[i][1]);
    ctx.lineTo(FUZZ[i][2], FUZZ[i][3]);
  }
  ctx.stroke();
  drawAntenna(1);
  drawAntenna(-1);
  // eyes: gold with a cream glint
  ctx.fillStyle = GOLD;
  ctx.beginPath(); ctx.arc(AXIS - 12, 348, 3.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(AXIS + 12, 348, 3.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.arc(AXIS - 13, 347, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(AXIS + 11, 347, 1.2, 0, Math.PI * 2); ctx.fill();
}
function drawSprig(sp) {
  var ph = sp[5] * Math.PI * 2;
  var bob = 9 * Math.sin(Math.PI * 2 * (T / LOOP) + ph);
  var sway = 5 * Math.sin(Math.PI * 2 * (2 * T / LOOP) + ph * 1.7);
  ctx.save();
  ctx.translate(sp[0] + sway, sp[1] + bob);
  ctx.rotate(sp[2] + 0.03 * Math.sin(Math.PI * 2 * (T / LOOP) + ph));
  ctx.strokeStyle = TONES[sp[4]];
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 26); ctx.quadraticCurveTo(5, 0, 0, -26); ctx.stroke();
  ctx.fillStyle = TONES[sp[3]];
  var ys = [-14, -2, 10];
  for (var i = 0; i < ys.length; i++) {
    ctx.beginPath(); ctx.ellipse(-8, ys[i], 8.5, 3.8, -0.65, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, ys[i] + 5, 8.5, 3.8, 0.65, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = GOLD;
  ctx.beginPath(); ctx.arc(0, -30, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2000, -2000, DW + 4000, DH + 4000);
  var i, th = beatAngle();
  for (i = 0; i < SPRIGS.length; i++) drawSprig(SPRIGS[i]);
  drawWing(1, th);
  drawWing(-1, th);
  drawBody();
}

// ---- sizing: centred fit, page ground is the plum -----------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- pointer: drag ripples the tiles, double-tap advances the table --
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
var grab = null, downAt = 0, lastTapAt = -1000, lastTapPos = null;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  grab = { x: p[0], y: p[1], lx: p[0], ly: p[1], moved: false };
  downAt = T;
});
canvas.addEventListener('pointermove', function (e) {
  if (!grab) return;
  var p = toDesign(e);
  var dx = p[0] - grab.lx, dy = p[1] - grab.ly;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (Math.abs(p[0] - grab.x) + Math.abs(p[1] - grab.y) > 2) grab.moved = true;
  grab.lx = p[0]; grab.ly = p[1];
  if (!grab.moved || dist < 0.5) return;
  // radial impulse: tiles near the pointer are pushed
  // outward, strongest at the pointer, fading by 190px
  var th = beatAngle();
  for (var i = 0; i < INST.length; i++) {
    var inst = INST[i];
    var w = tileWorld2(inst, th);
    var ox = w[0] - p[0], oy = w[1] - p[1];
    var d = Math.sqrt(ox * ox + oy * oy);
    if (d > 190 || d < 1) continue;
    var f = (1 - d / 190) * Math.min(60, dist * 9);
    inst.vx += (ox / d) * f;
    inst.vy += (oy / d) * f;
  }
});
function endPointer(e) {
  var wasTap = false;
  if (grab) {
    wasTap = !grab.moved && (T - downAt) < 0.3;
    grab = null;
  }
  if (!wasTap || !e) return;
  var p = toDesign(e);
  var dt = T - lastTapAt;
  if (dt < 0.35 && lastTapPos && Math.abs(p[0] - lastTapPos[0]) < 30 && Math.abs(p[1] - lastTapPos[1]) < 30) {
    tableIdx = (tableIdx + 1) % TABLES.length;
    lastTapAt = -1000;
    lastTapPos = null;
  } else {
    lastTapAt = T;
    lastTapPos = p;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { grab = null; });

function step() {
  // tile ripple springs: stiff spring home with damping,
  // snapping to exactly zero so the mosaic settles back
  // to its authored positions precisely
  for (var i = 0; i < INST.length; i++) {
    var inst = INST[i];
    if (inst.dx === 0 && inst.dy === 0 && inst.vx === 0 && inst.vy === 0) continue;
    inst.vx += (-110 * inst.dx - 10 * inst.vx) * TICK;
    inst.vy += (-110 * inst.dy - 10 * inst.vy) * TICK;
    inst.dx += inst.vx * TICK;
    inst.dy += inst.vy * TICK;
    if (Math.abs(inst.dx) < 0.02 && Math.abs(inst.dy) < 0.02 && Math.abs(inst.vx) < 0.05 && Math.abs(inst.vy) < 0.05) {
      inst.dx = 0; inst.dy = 0; inst.vx = 0; inst.vy = 0;
    }
  }
}

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
