<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№113 · Cellfield</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#101014; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(230,230,225,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to pull the warm field</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function qseed(){ const m=(window.location&&window.location.search||'').match(/seed=(\d+)/); return m?parseInt(m[1],10):null; }
function hexRgb(hx){ return [parseInt(hx.slice(1,3),16), parseInt(hx.slice(3,5),16), parseInt(hx.slice(5,7),16)]; }
function mixc(c1,c2,f){ return [Math.round(c1[0]+(c2[0]-c1[0])*f), Math.round(c1[1]+(c2[1]-c1[1])*f), Math.round(c1[2]+(c2[2]-c1[2])*f)]; }
function css(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

// No.113 Cellfield: polar grid 9 rings x 48 sectors; each cell colour mixes a warm
// and a cool radial field whose centres orbit each other on a 75s period.
const SEED=qseed()||113113;
const RINGS=9, SECT=48;
const EMBER=hexRgb('#E4572E'), GOLD=hexRgb('#F2A03D'), DEEP=hexRgb('#1B3A6B'), CYAN=hexRgb('#3FA7D6');
let geom=null, dragging=false, dragX=0, dragY=0, offX=0, offY=0, lastMs=null, grainState=(SEED^0x51ab)>>>0;
function buildGeom(w,h){
  const S=Math.min(w,h), R=S*0.42, cx=w/2, cy=h/2;
  const radii=[]; for(let k=0;k<=RINGS;k++) radii.push(R*Math.pow(k/RINGS,0.8));
  const cells=[];
  const gapA=0.010;
  for(let k=0;k<RINGS;k++) for(let j=0;j<SECT;j++){
    const a0=(j/SECT)*Math.PI*2+gapA, a1=((j+1)/SECT)*Math.PI*2-gapA;
    const r0=radii[k]+(k===0?0:0.9), r1=radii[k+1]-0.9;
    const rm=(radii[k]+radii[k+1])/2, am=(a0+a1)/2;
    cells.push({ a0:a0, a1:a1, r0:r0, r1:r1, mx:cx+Math.cos(am)*rm, my:cy+Math.sin(am)*rm });
  }
  return { w:w, h:h, R:R, cx:cx, cy:cy, cells:cells };
}
function grainRand(){ grainState=(Math.imul(grainState,1664525)+1013904223)>>>0; return grainState/4294967296; }
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0.016; if(lastMs!==null) dt=clamp((nowMs-lastMs)/1000,0.001,0.05); lastMs=nowMs;
  if(!geom||geom.w!==w||geom.h!==h) geom=buildGeom(w,h);
  const t=nowMs/1000, R=geom.R, cx=geom.cx, cy=geom.cy;
  const wa=t*(Math.PI*2/75), ca=wa+Math.PI;
  const orbX=Math.cos(wa)*R*0.45, orbY=Math.sin(wa)*R*0.45;
  if(dragging){ offX+=(dragX-(cx+orbX)-offX)*(1-Math.exp(-dt*7)); offY+=(dragY-(cy+orbY)-offY)*(1-Math.exp(-dt*7)); }
  else { const dec=Math.exp(-dt*0.45); offX*=dec; offY*=dec; }
  const wx=cx+orbX+offX, wy=cy+orbY+offY;
  const kx=cx+Math.cos(ca)*R*0.45, ky=cy+Math.sin(ca)*R*0.45;
  ctx.fillStyle='#101014'; ctx.fillRect(0,0,w,h);
  const fall=1.35*R;
  for(const c of geom.cells){
    const dw=Math.hypot(c.mx-wx,c.my-wy), dk=Math.hypot(c.mx-kx,c.my-ky);
    const iw=Math.pow(clamp(1-dw/fall,0,1),1.15), ik=Math.pow(clamp(1-dk/fall,0,1),1.15);
    const warm=mixc(EMBER,GOLD,iw), cool=mixc(DEEP,CYAN,ik);
    const tw=iw/(iw+ik+0.0001);
    ctx.fillStyle=css(mixc(cool,warm,tw),1);
    ctx.beginPath();
    ctx.arc(cx,cy,c.r1,c.a0,c.a1);
    ctx.arc(cx,cy,c.r0,c.a1,c.a0,true);
    ctx.closePath(); ctx.fill();
  }
  // fine film grain over everything
  ctx.fillStyle='rgba(255,255,255,0.05)';
  ctx.beginPath();
  for(let i=0;i<1600;i++){ ctx.rect(grainRand()*w, grainRand()*h, 1.2, 1.2); }
  ctx.fill();
  if(geom.cells.length!==RINGS*SECT) console.assert(false,'cells',geom.cells.length);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; dragX=e.clientX; dragY=e.clientY; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; dragX=e.clientX; dragY=e.clientY; });
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(3000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
