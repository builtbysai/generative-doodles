<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Diamond Presentation</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F0EEE7; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // No.801 "Diamond Presentation" (EXPANSION #98 olivier-mosset, PP2).
  // The same square ring canvas as the study's ring, hung on a bare wall.
  // The only variable is the presentation: drag sideways and the CANVAS
  // rotates between square (0 deg) and diamond (+/-45 deg); the ring
  // inside it never changes. On release the canvas settles, slowly and
  // with weight, to the nearest of square / diamond.

  var CANVAS_TONE = "#F4F2EC";   // the painting's own ground
  var RING = "#141414";          // the ring
  var SHADOW = "#D9D4C8";        // wall shadow tone
  // Wall: a whisper-different mix of the two specced tones,
  // 85% canvas tone + 15% shadow tone = #F0EEE7, so the canvas reads
  // against the wall by its hairline edge and its cast shadow.
  var WALL = "#F0EEE7";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var DEG = Math.PI / 180;
  var ANGLE0 = 45;               // frame one: hung as a diamond
  var ANGLE_MIN = -45, ANGLE_MAX = 45;
  var ANCHORS = [-45, 0, 45];    // square at 0, diamonds at +/-45
  var TAU = 0.55;                // settle time constant (s): slow, weighty

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var mn = Math.min(sw || 1e9, sh || 1e9);
    if (mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    DPR = window.devicePixelRatio || 1;
    W = Math.round(w);
    H = Math.round(h);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  // ---- interaction state: recorded samples, closed-form angle ----
  // events: list of {type:'grab'|'move'|'release', t, x, base, ang}
  // angleAt(t) is a pure function of this list and t.
  var events = [];
  var dragging = false;

  function nowSec() {
    if (typeof performance !== "undefined" && performance.now) {
      return performance.now() / 1000;
    }
    return Date.now() / 1000;
  }
  var T0 = nowSec();

  function clampAngle(a) {
    return a < ANGLE_MIN ? ANGLE_MIN : (a > ANGLE_MAX ? ANGLE_MAX : a);
  }

  function nearestAnchor(a) {
    var best = ANCHORS[0], bd = Math.abs(a - best);
    for (var i = 1; i < ANCHORS.length; i++) {
      var d = Math.abs(a - ANCHORS[i]);
      if (d < bd) { bd = d; best = ANCHORS[i]; }
    }
    return best;
  }

  // Critically damped settle: value approaches target as
  // target + (a0 - target) * (1 + u/tau) * exp(-u/tau), u = seconds since
  // release. Monotone, no overshoot, no bounce: a heavy canvas easing
  // onto its nail, not a spring.
  function settle(a0, target, u) {
    if (u <= 0) return a0;
    var k = 1 + u / TAU;
    return target + (a0 - target) * k * Math.exp(-u / TAU);
  }

  function angleAt(t) {
    var ang = ANGLE0;         // resting diamond before any touch
    var mode = "rest";        // rest | drag | settle
    var relT = 0, relAng = ANGLE0, target = ANGLE0;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.t > t) break;
      if (e.type === "grab") {
        // grab freezes whatever the settle had reached at that instant
        ang = (mode === "settle") ? settle(relAng, target, e.t - relT) : ang;
        mode = "drag";
        e.base = ang;
      } else if (e.type === "move") {
        if (mode === "drag") {
          var grab = events[grabIndex(i)];
          ang = clampAngle(grab.base + (e.x - grab.x) * dragDegPerPx());
          e.ang = ang;
        }
      } else if (e.type === "release") {
        if (mode === "drag") {
          mode = "settle";
          relT = e.t; relAng = ang; target = nearestAnchor(ang);
        }
      }
    }
    if (mode === "settle") return settle(relAng, target, t - relT);
    return ang;
  }

  function grabIndex(i) {
    for (var j = i; j >= 0; j--) if (events[j].type === "grab") return j;
    return 0;
  }

  function dragDegPerPx() {
    // a horizontal drag across 55% of the frame width sweeps the full
    // 90 degrees from diamond-left to diamond-right
    return 90 / (0.55 * Math.max(W, 1));
  }

  function pointerX(ev) {
    if (ev.touches && ev.touches.length) return ev.touches[0].clientX;
    if (ev.changedTouches && ev.changedTouches.length) return ev.changedTouches[0].clientX;
    return ev.clientX;
  }

  function onDown(ev) {
    var t = nowSec() - T0;
    events.push({ type: "grab", t: t, x: pointerX(ev) });
    dragging = true;
    if (ev.preventDefault) ev.preventDefault();
  }
  function onMove(ev) {
    if (!dragging) return;
    var t = nowSec() - T0;
    events.push({ type: "move", t: t, x: pointerX(ev) });
    if (ev.preventDefault) ev.preventDefault();
  }
  function onUp(ev) {
    if (!dragging) return;
    var t = nowSec() - T0;
    events.push({ type: "release", t: t, x: pointerX(ev) });
    dragging = false;
    if (ev.preventDefault) ev.preventDefault();
  }

  if (canvas.addEventListener) {
    canvas.addEventListener("pointerdown", onDown);
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
    canvas.addEventListener("touchstart", onDown, { passive: false });
    canvas.addEventListener("touchmove", onMove, { passive: false });
    canvas.addEventListener("touchend", onUp, { passive: false });
    canvas.addEventListener("mousedown", onDown);
    canvas.addEventListener("mousemove", onMove);
    canvas.addEventListener("mouseup", onUp);
  }

  // ---- drawing ----

  function draw(t) {
    if (W === 0) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    // wall
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);

    var ang = angleAt(t) * DEG;
    var cx = W / 2, cy = H / 2;

    // Square side: sized from the diagonal so the diamond's corners
    // keep generous wall margin at every angle (bounding box of a
    // rotated square never exceeds side * sqrt(2)).
    var S = 0.56 * Math.min(W, H);
    var half = S / 2;

    // Shadow: layered flat copies of the rotated square in the shadow
    // tone, offset along an offset vector that follows the angle: the
    // drop swings with the canvas, mostly downward, leaning away from
    // the tilt. Each layer alpha 0.09, stacked counts as the soft edge.
    var ox = (Math.sin(ang) * -0.020 + 0.006) * S;
    var oy = (0.016 + 0.010 * Math.cos(ang)) * S;
    var LAYERS = 6;
    ctx.fillStyle = SHADOW;
    for (var i = LAYERS; i >= 1; i--) {
      var f = i / LAYERS;
      ctx.save();
      ctx.translate(cx + ox * f, cy + oy * f);
      ctx.rotate(ang);
      ctx.globalAlpha = 0.085;
      var grow = 1 + 0.012 * f;
      ctx.fillRect(-half * grow, -half * grow, S * grow, S * grow);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // The canvas itself, rotated as one rigid body: ground, hairline
    // edge, then the ring, fixed inside it.
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.fillStyle = CANVAS_TONE;
    ctx.fillRect(-half, -half, S, S);
    ctx.strokeStyle = SHADOW;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1;
    ctx.strokeRect(-half + 0.5, -half + 0.5, S - 1, S - 1);
    ctx.globalAlpha = 1;
    // the ring: an outline, stroke 3.3% of the canvas side, radius 31%
    ctx.beginPath();
    ctx.arc(0, 0, 0.31 * S, 0, Math.PI * 2);
    ctx.strokeStyle = RING;
    ctx.lineWidth = 0.033 * S;
    ctx.stroke();
    ctx.restore();
  }

  var startT = nowSec();
  function frame() {
    var t = nowSec() - startT;
    draw(t);
    if (typeof requestAnimationFrame === "function") {
      requestAnimationFrame(frame);
    }
  }

  resize();
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () { resize(); draw(nowSec() - startT); });
  }
  window.addEventListener("resize", function () { resize(); draw(nowSec() - startT); });

  // Frame one: the synchronous draw at t = 0, canvas hung as a diamond.
  draw(0);
  if (typeof requestAnimationFrame === "function") {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
