<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>The Shelf Becomes a Stream</title>
<style>html,body{margin:0;padding:0;background:#e8e0d0;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
(function(){
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CREAM = '#e8e0d0', WOOD = '#8a6a48', CHAR = '#2a2a30', GOLD = '#d9a441', SCAR = '#c1272d', LIGHT = '#d8d2c4';
var SPINE_COLORS = ['#4a5a7a', '#6b4a3a', '#2f4636', '#7a6a8a', '#d8d2c4'];
var ROWS = 4, COLS = 6;
var SCREEN_FR = [[0.78, 0.20], [0.89, 0.34], [0.77, 0.48], [0.89, 0.62], [0.80, 0.78]];
var PULL = 0.4, LEG = 0.6, TRAVEL = 3.0, PUSH = 0.4;
var events = [];
var probeNow = null;
var T0 = null;

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function smooth(u){ if(u < 0) u = 0; if(u > 1) u = 1; return u * u * (3 - 2 * u); }
function lerp(a, b, u){ return a + (b - a) * u; }

function vvSize(){
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  return { w: Math.round(w), h: Math.round(h) };
}

function layout(W, H){
  var gap = Math.max(8, 0.012 * W);
  var regionW = 0.60 * W, x0 = 0.04 * W;
  var spineH = Math.min(H * 0.13, 120);
  var spineW = Math.min((regionW - (COLS - 1) * gap) / COLS, spineH * 0.55);
  var totalW = COLS * spineW + (COLS - 1) * gap;
  var sx = x0 + (regionW - totalW) / 2;
  var rng = mulberry32(1494000);
  var spines = [];
  for(var r = 0; r < ROWS; r++){
    var rowY = H * (0.20 + 0.18 * r);
    for(var j = 0; j < COLS; j++){
      var idx = r * COLS + j;
      spines.push({ x: sx + j * (spineW + gap), y: rowY - spineH, w: spineW, h: spineH, rowY: rowY,
        color: SPINE_COLORS[Math.floor(rng() * SPINE_COLORS.length)],
        stripe: rng() < 0.4, index: idx });
    }
  }
  var sw2 = Math.max(52, Math.min(130, 0.16 * W));
  var sh2 = sw2 * 0.85;
  var screens = [];
  for(var i = 0; i < 5; i++){
    screens.push({ x: SCREEN_FR[i][0] * W - sw2 / 2, y: SCREEN_FR[i][1] * H - sh2 / 2, w: sw2, h: sh2,
      cx: SCREEN_FR[i][0] * W, cy: SCREEN_FR[i][1] * H });
  }
  return { spines: spines, screens: screens, boardH: Math.max(6, 0.009 * H), x0: x0, regionW: regionW };
}

function buildSegments(){
  var segs = []; var frag = -1; var avail = 0;
  for(var k = 0; k < events.length; k++){
    var e = events[k];
    if(e.kind === 'send'){
      var start = Math.max(e.time, avail);
      if(frag >= 0){
        segs.push({ type: 'travel', start: start, end: start + TRAVEL, spine: frag, dir: -1 });
        segs.push({ type: 'push', start: start + TRAVEL, end: start + TRAVEL + PUSH, spine: frag });
        start = start + TRAVEL + PUSH; frag = -1;
      }
      segs.push({ type: 'pull', start: start, end: start + PULL, spine: e.spine });
      segs.push({ type: 'travel', start: start + PULL, end: start + PULL + TRAVEL, spine: e.spine, dir: 1 });
      segs.push({ type: 'settled', start: start + PULL + TRAVEL, end: Infinity, spine: e.spine, settleStart: start + PULL + TRAVEL });
      frag = e.spine; avail = start + PULL + TRAVEL;
    } else {
      if(frag < 0) continue;
      var start2 = Math.max(e.time, avail);
      segs.push({ type: 'travel', start: start2, end: start2 + TRAVEL, spine: frag, dir: -1 });
      segs.push({ type: 'push', start: start2 + TRAVEL, end: start2 + TRAVEL + PUSH, spine: frag });
      frag = -1; avail = start2 + TRAVEL + PUSH;
    }
  }
  return segs;
}

function segState(seg, t){
  if(seg.type === 'pull'){ return { phase: 'pull', spine: seg.spine, off: smooth((t - seg.start) / PULL) }; }
  if(seg.type === 'travel'){ return { phase: 'travel', spine: seg.spine, dir: seg.dir, tt: t - seg.start }; }
  if(seg.type === 'settled'){ return { phase: 'settled', spine: seg.spine, settleStart: seg.settleStart }; }
  return { phase: 'push', spine: seg.spine, off: 1 - smooth((t - seg.start) / PUSH) };
}

function stateAt(t){
  var segs = buildSegments();
  var cur = null;
  for(var i = 0; i < segs.length; i++){ if(segs[i].start <= t) cur = segs[i]; else break; }
  if(!cur) return { phase: 'idle' };
  if(t < cur.end) return segState(cur, t);
  return { phase: 'idle' };
}

function liveNow(){
  if(typeof performance !== 'undefined' && performance.now){
    if(T0 === null) T0 = performance.now();
    return (performance.now() - T0) / 1000;
  }
  return 0;
}
function currentTime(){ return probeNow !== null ? probeNow : liveNow(); }

function drawSpine(sp, off){
  var oy = off * sp.h * 0.35;
  var y = sp.y - oy;
  ctx.fillStyle = sp.color;
  ctx.fillRect(sp.x, y, sp.w, sp.h);
  if(sp.stripe){
    ctx.fillStyle = GOLD;
    var sw = Math.max(2, sp.w * 0.12);
    ctx.fillRect(sp.x + sp.w * 0.25, y, sw, sp.h);
  }
}

function drawMiniScene(rc, spineIdx, stime){
  var rng = mulberry32(1494000 + spineIdx * 7919);
  var cols = [];
  for(var i = 0; i < 3; i++) cols.push(SPINE_COLORS[Math.floor(rng() * SPINE_COLORS.length)]);
  var speaker = Math.floor((stime % 6) / 2) % 3;
  var bw = rc.w * 0.16, bh = rc.h * 0.45;
  var benchY = rc.y + rc.h * 0.78;
  ctx.fillStyle = CHAR;
  ctx.fillRect(rc.x + rc.w * 0.08, benchY, rc.w * 0.84, Math.max(1, rc.h * 0.03));
  for(var k = 0; k < 3; k++){
    var fx = rc.x + rc.w * (0.20 + 0.30 * k);
    var fy = benchY - bh;
    ctx.fillStyle = cols[k];
    ctx.fillRect(fx - bw / 2, fy, bw, bh);
    var hr = Math.max(3, rc.w * 0.085);
    var hx = fx, hy = fy - hr * 0.8;
    ctx.fillStyle = LIGHT;
    ctx.beginPath();
    ctx.moveTo(hx + hr, hy);
    ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = CHAR;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(hx + hr, hy);
    ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = CHAR;
    ctx.fillRect(hx - 1, hy - 1, 2, 2);
    var mw = (k === speaker) ? Math.max(3, bw * 0.5) : Math.max(2, bw * 0.25);
    ctx.fillRect(hx - mw / 2, hy + hr * 0.35, mw, Math.max(1, hr * 0.12));
  }
}

function draw(t){
  var s = vvSize();
  var W = s.w, H = s.h;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  var lay = layout(W, H);
  var st = stateAt(t);
  ctx.fillStyle = CREAM;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = CHAR;
  ctx.lineWidth = Math.max(1.5, 0.002 * W);
  ctx.beginPath();
  ctx.moveTo(lay.screens[0].cx, lay.screens[0].cy);
  for(var i = 1; i < 5; i++) ctx.lineTo(lay.screens[i].cx, lay.screens[i].cy);
  ctx.stroke();
  ctx.fillStyle = WOOD;
  for(var r = 0; r < ROWS; r++){
    var ry = H * (0.20 + 0.18 * r);
    ctx.fillRect(lay.x0, ry, lay.regionW, lay.boardH);
  }
  var pulled = (st.phase === 'pull' || st.phase === 'travel' || st.phase === 'settled' || st.phase === 'push') ? st.spine : -1;
  var pullOff = 0;
  if(st.phase === 'pull' || st.phase === 'push') pullOff = st.off;
  else if(st.phase === 'travel' || st.phase === 'settled') pullOff = 1;
  for(var i2 = 0; i2 < lay.spines.length; i2++){
    if(i2 === pulled) continue;
    drawSpine(lay.spines[i2], 0);
  }
  if(pulled >= 0) drawSpine(lay.spines[pulled], pullOff);
  var lit = [false, false, false, false, false];
  if(st.phase === 'travel'){
    var kk = Math.floor(st.tt / LEG);
    if(st.dir === 1){ if(kk >= 1 && kk <= 4) lit[kk - 1] = true; }
    else { lit[4 - kk] = true; }
  }
  if(st.phase === 'settled') lit[4] = true;
  for(var s2 = 0; s2 < 5; s2++){
    var sc = lay.screens[s2];
    if(lit[s2]){
      ctx.fillStyle = CREAM;
      ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
      ctx.strokeStyle = CHAR;
      ctx.lineWidth = 2;
      ctx.strokeRect(sc.x, sc.y, sc.w, sc.h);
    } else {
      ctx.fillStyle = CHAR;
      ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
    }
  }
  if(st.phase === 'settled') drawMiniScene(lay.screens[4], st.spine, t - st.settleStart);
  if(st.phase === 'travel'){
    var sp = lay.spines[st.spine];
    var p0 = { x: sp.x + sp.w / 2, y: sp.y + sp.h / 2 - sp.h * 0.35 };
    var path = [p0];
    for(var p = 0; p < 5; p++) path.push({ x: lay.screens[p].cx, y: lay.screens[p].cy });
    var leg = Math.min(4, Math.floor(st.tt / LEG));
    var lt = st.tt / LEG - leg;
    var u = lt < 0.5 ? 2 * lt * lt : 1 - Math.pow(-2 * lt + 2, 2) / 2;
    var a, b;
    if(st.dir === 1){ a = path[leg]; b = path[leg + 1]; }
    else { a = path[5 - leg]; b = path[4 - leg]; }
    var dx = lerp(a.x, b.x, u), dy = lerp(a.y, b.y, u);
    var dotR = Math.max(5, 0.011 * W);
    ctx.fillStyle = SCAR;
    ctx.beginPath();
    ctx.moveTo(dx + dotR, dy);
    ctx.arc(dx, dy, dotR, 0, Math.PI * 2);
    ctx.fill();
  }
}

function onTap(x, y){
  var t = currentTime();
  var s = vvSize();
  var lay = layout(s.w, s.h);
  var st = stateAt(t);
  var pulledSpine = (st.phase === 'pull' || st.phase === 'travel' || st.phase === 'settled' || st.phase === 'push') ? st.spine : -1;
  var pullOff = (st.phase === 'pull' || st.phase === 'push') ? st.off : ((st.phase === 'travel' || st.phase === 'settled') ? 1 : 0);
  function hitSpine(){
    for(var i = 0; i < lay.spines.length; i++){
      var sp = lay.spines[i];
      var oy = (i === pulledSpine) ? pullOff * sp.h * 0.35 : 0;
      if(x >= sp.x && x <= sp.x + sp.w && y >= sp.y - oy && y <= sp.y + sp.h - oy) return i;
    }
    return -1;
  }
  function inScreen5(){
    var rc = lay.screens[4];
    return x >= rc.x && x <= rc.x + rc.w && y >= rc.y && y <= rc.y + rc.h;
  }
  if(st.phase === 'idle'){
    var sp = hitSpine();
    if(sp >= 0) events.push({ time: t, kind: 'send', spine: sp });
  } else if(st.phase === 'settled'){
    if(inScreen5()){ events.push({ time: t, kind: 'return' }); return; }
    var sp2 = hitSpine();
    if(sp2 >= 0){
      if(sp2 === st.spine){ events.push({ time: t, kind: 'return' }); }
      else { events.push({ time: t, kind: 'return' }); events.push({ time: t, kind: 'send', spine: sp2 }); }
    }
  } else {
    var sp3 = hitSpine();
    if(sp3 >= 0) events.push({ time: t, kind: 'send', spine: sp3 });
  }
}

if(canvas.addEventListener){
  canvas.addEventListener('pointerdown', function(ev){
    var r = (canvas.getBoundingClientRect) ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (ev.clientX !== undefined ? ev.clientX : ev.offsetX) - (r.left || 0);
    var y = (ev.clientY !== undefined ? ev.clientY : ev.offsetY) - (r.top || 0);
    onTap(x, y);
  });
}

if(typeof window !== 'undefined'){
  window.__piece = {
    drawAt: function(t){ probeNow = t; draw(t); },
    tapAt: function(x, y, t){ probeNow = t; onTap(x, y); },
    stateAt: function(t){ return stateAt(t); },
    layout: function(){ var s = vvSize(); return layout(s.w, s.h); },
    events: function(){ return events.slice(); }
  };
}

draw(0);
function loop(){
  draw(currentTime());
  if(typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if(typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script></body></html>
