<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pluma de Sietecolores</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0A0B; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // TWO-SEED ARCHITECTURE. This is the point of the piece: the work it
  // comes from was made by two authors in two passes, "Forma F Gazitua /
  // Color Angela Leible", so the piece is built by two independent
  // generators that never read each other's seed.
  //
  // FORM PASS (his half): a stone feather, parametric geometry only,
  // built from the FORM seed alone. Granite fill, fracture-dark barb
  // strokes and facet wedges: carved mass, no color anywhere.
  //
  // COLOR PASS (her half): seven stain fields, built from the COLOR
  // seed alone. The color generator receives only the finished feather
  // silhouette (as a point-in-polygon mask) and lays its blotches
  // inside it; it knows nothing about barbs, wedges or the form seed.
  //
  // Both seeds advance by loop index: loop k uses FORM_BASE + k*FORM_STEP
  // and COLOR_BASE + k*COLOR_STEP, so every 36 second loop is a fresh
  // collaboration between a new form and a new coloring of it.
  // ------------------------------------------------------------------
  var GROUND = '#0A0A0B';
  var GRANITE = '#9A9A9C';
  var FRACTURE = '#3A3A3D';
  // The seven, in arrival order: cinnabar, gold, turquoise, indigo,
  // violet, ember orange, bone white. Discrete stains, never a gradient.
  var COLORS = ['#C0392B', '#D9A441', '#2FA3A0', '#2B3A7A', '#6B4E9B', '#E2703A', '#EDE4D0'];
  var FORM_BASE = 659001, COLOR_BASE = 659101;
  var FORM_STEP = 7919, COLOR_STEP = 104729;
  var LOOP_S = 36;

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

  function inPoly(px, py, poly) {
    var inside = false, i, j;
    for (i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  // ------------------------------------------------------------------
  // FORM PASS. Form space: x in [0, FW], y in [0, FH], y down.
  // The spine runs s = 0 (quill foot, y = FH) to s = 1 (tip, y = 0).
  // ------------------------------------------------------------------
  var FW = 1.0, FH = 1.9;
  var VANE_S0 = 0.10, VANE_S1 = 0.995;
  var NB = 23; // barbs per side, 46 in all

  function buildForm(seed) {
    var rng = mulberry32(seed);
    var bendA = (rng() - 0.5) * 0.09;
    var bendB = (rng() - 0.5) * 0.05;
    var spine = [];
    var J, s;
    for (J = 0; J <= 48; J++) {
      s = J / 48;
      spine.push([0.5 + bendA * Math.sin(s * Math.PI * 0.85) + bendB * s * s, FH * (1 - s)]);
    }
    function spineAt(sv) {
      var f = clamp01(sv) * 48;
      var i = Math.min(47, Math.floor(f));
      var u = f - i;
      return [spine[i][0] + (spine[i + 1][0] - spine[i][0]) * u,
              spine[i][1] + (spine[i + 1][1] - spine[i][1]) * u];
    }
    var barbs = [];
    var sides = [-1, 1], si, i;
    for (si = 0; si < 2; si++) {
      var side = sides[si];
      for (i = 0; i < NB; i++) {
        var bs = VANE_S0 + (VANE_S1 - VANE_S0) * (i / (NB - 1));
        var base = spineAt(bs);
        var lt = Math.sin(Math.PI * Math.pow(bs, 0.9));
        var L = 0.47 * (0.22 + 0.78 * Math.pow(Math.max(0, lt), 1.15)) * (0.94 + rng() * 0.12);
        // Tip taper: the last barbs shrink toward nothing so their tips
        // land on the spine tip instead of overshooting past it.
        L *= clamp01((1 - bs) / 0.06) * 0.94 + 0.06;
        var ang = (1.14 - 0.62 * bs) + (rng() - 0.5) * 0.09; // radians off vertical
        var dx = side * Math.sin(ang), dy = -Math.cos(ang);
        var ctrl = [base[0] + dx * L * 0.52, base[1] + dy * L * 0.52 - L * 0.055];
        var tip = [base[0] + dx * L + side * L * 0.02, base[1] + dy * L + L * 0.015];
        barbs.push({ side: side, idx: i, s: bs, base: base, ctrl: ctrl, tip: tip });
      }
    }
    // Fracture facet wedges: dark triangles seated between neighbour
    // barbs, apex pulled in toward the spine.
    var wedges = [];
    for (var w = 0; w < 9; w++) {
      var wside = rng() < 0.5 ? -1 : 1;
      var wi = Math.floor(rng() * (NB - 1));
      var b1 = null, b2 = null;
      for (i = 0; i < barbs.length; i++) {
        if (barbs[i].side === wside && barbs[i].idx === wi) b1 = barbs[i];
        if (barbs[i].side === wside && barbs[i].idx === wi + 1) b2 = barbs[i];
      }
      if (!b1 || !b2) continue;
      var apex = [((b1.tip[0] + b2.tip[0]) / 2 + (b1.base[0] + b2.base[0]) / 2) / 2,
                  ((b1.tip[1] + b2.tip[1]) / 2 + (b1.base[1] + b2.base[1]) / 2) / 2];
      wedges.push({ pts: [b1.base, b2.base, apex], i1: wi, side: wside });
    }
    return { spine: spine, spineAt: spineAt, barbs: barbs, wedges: wedges };
  }

  function quadAt(b, g) {
    var u = 1 - g;
    return [u * u * b.base[0] + 2 * u * g * b.ctrl[0] + g * g * b.tip[0],
            u * u * b.base[1] + 2 * u * g * b.ctrl[1] + g * g * b.tip[1]];
  }

  // Barb growth during the form phase: barbs grow in sequence from the
  // quill outward (lowest vane barb first). p1 is form-phase progress.
  function barbGrowth(b, p1) {
    var start = (b.idx / (NB - 1)) * 0.82 - 0.02;
    return clamp01((p1 - start) / 0.07);
  }

  function outlineAt(F, p1, shaftRev) {
    var pts = [F.spineAt(0)];
    var i, b, g;
    for (i = 0; i < F.barbs.length; i++) { // left side, s ascending
      b = F.barbs[i];
      if (b.side !== -1) continue;
      g = barbGrowth(b, p1);
      if (g > 0) pts.push(quadAt(b, g));
    }
    pts.push(F.spineAt(Math.min(1, Math.max(shaftRev, VANE_S1 * p1))));
    for (i = F.barbs.length - 1; i >= 0; i--) { // right side, s descending
      b = F.barbs[i];
      if (b.side !== 1) continue;
      g = barbGrowth(b, p1);
      if (g > 0) pts.push(quadAt(b, g));
    }
    return pts;
  }

  // ------------------------------------------------------------------
  // COLOR PASS. Seven horizontal bands across the vane. Band k (0 = top)
  // takes COLORS[k] and arrives k-th. Each band is a field of flat
  // blotches on a jittered grid, kept only where the blotch centre falls
  // inside the finished silhouette; the canvas clip does the rest, so a
  // blotch may bleed past the band edge but never past the feather.
  // A blotch wakes when the band's flood front passes its threshold:
  // thresholds run from the band's entry edge (alternating top/bottom)
  // so the stain visibly grows across its band and bleeds a little
  // into the neighbouring bands at the boundary.
  // ------------------------------------------------------------------
  function buildColor(seed, outline) {
    var rng = mulberry32(seed);
    var yTop = FH * (1 - VANE_S1), yBot = FH * (1 - VANE_S0);
    var bandH = (yBot - yTop) / 7;
    var bands = [];
    for (var k = 0; k < 7; k++) {
      var bTop = yTop + k * bandH, bBot = bTop + bandH;
      var fromTop = (k % 2 === 0);
      var list = [];
      for (var gy = bTop - bandH * 0.30; gy <= bBot + bandH * 0.30; gy += 0.05) {
        for (var gx = 0.03; gx <= FW - 0.02; gx += 0.05) {
          var cx = gx + (rng() - 0.5) * 0.03;
          var cy = gy + (rng() - 0.5) * 0.03;
          if (!inPoly(cx, cy, outline)) continue;
          var edgeDist = fromTop ? (cy - bTop) / bandH : (bBot - cy) / bandH;
          var th = clamp01(edgeDist) * 0.55 + rng() * 0.2;
          list.push({ x: cx, y: cy, r: 0.055 + rng() * 0.022, th: th });
        }
      }
      bands.push(list);
    }
    return bands;
  }

  // Band flood progress at a loop time: staggered arrivals during the
  // flood phase, full through the hold, then a staggered drain.
  function bandProgress(k, loopT) {
    var start = 8 + k * 1.6;
    var g = clamp01((loopT - start) / 5);
    if (loopT >= 30) {
      var d = smooth((loopT - 30) / 6);
      g = clamp01(g - d * (1.0 + (6 - k) * 0.10));
    }
    return g;
  }

  // ------------------------------------------------------------------
  // Clock. Frame one is the synchronous draw at loop time 0, never
  // derived from Date.now. The QA seed hook (location.search
  // "seed=tNN") freezes the clock at NN seconds for state-forced
  // verification renders; it is inert in normal viewing.
  // ------------------------------------------------------------------
  var forcedT = -1;
  try {
    var qs = String((typeof location !== 'undefined' && location.search) || '');
    var mt = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(qs);
    if (mt) forcedT = parseFloat(mt[1]);
  } catch (e) { forcedT = -1; }

  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (forcedT >= 0) return forcedT;
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - t0) / 1000;
    return 0;
  }

  // ------------------------------------------------------------------
  // Layout
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var orgX = 0, orgY = 0, scale = 1;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr) isPhone = Math.min(scr.width, scr.height) < 700;
    else isPhone = h > w * 1.15;
    scale = Math.min((isPhone ? H * 0.92 : H * 0.94) / FH, (isPhone ? W * 0.94 : W * 0.90) / FW);
    orgX = (W - FW * scale) / 2;
    orgY = (H - FH * scale) / 2;
  }

  function X(x) { return orgX + x * scale; }
  function Y(y) { return orgY + y * scale; }

  function pathFrom(pts) {
    ctx.beginPath();
    ctx.moveTo(X(pts[0][0]), Y(pts[0][1]));
    for (var i = 1; i < pts.length; i++) ctx.lineTo(X(pts[i][0]), Y(pts[i][1]));
    ctx.closePath();
  }

  // ------------------------------------------------------------------
  // Loop state cache: geometry is rebuilt only when the loop index
  // changes, and is a pure function of (formSeed, colorSeed).
  // ------------------------------------------------------------------
  var curLoop = -1, FORM = null, COLOR = null;
  function ensure(loopIdx) {
    if (loopIdx === curLoop) return;
    curLoop = loopIdx;
    FORM = buildForm(FORM_BASE + loopIdx * FORM_STEP);
    COLOR = buildColor(COLOR_BASE + loopIdx * COLOR_STEP, outlineAt(FORM, 1, 1));
  }

  function draw(tOver) {
    if (!W) resize();
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var t = (typeof tOver === 'number') ? tOver : elapsed();
    var loopIdx = Math.floor(t / LOOP_S);
    var loopT = t - loopIdx * LOOP_S;
    ensure(loopIdx);
    var F = FORM;

    var p1 = clamp01(loopT / 8); // form phase progress
    var shaftRev = clamp01(0.15 + p1 * 1.15);
    var outline = outlineAt(F, p1, shaftRev);
    if (outline.length < 3) return;

    // Granite mass.
    pathFrom(outline);
    ctx.fillStyle = GRANITE;
    ctx.fill();

    // Fracture facet wedges (once their barbs have grown).
    ctx.fillStyle = FRACTURE;
    ctx.globalAlpha = 0.5;
    var i, b;
    for (i = 0; i < F.wedges.length; i++) {
      var wz = F.wedges[i];
      var ok = true;
      for (var j = 0; j < F.barbs.length; j++) {
        if (F.barbs[j].side === wz.side && (F.barbs[j].idx === wz.i1 || F.barbs[j].idx === wz.i1 + 1)) {
          if (barbGrowth(F.barbs[j], p1) < 0.95) ok = false;
        }
      }
      if (!ok) continue;
      pathFrom(wz.pts);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Shaft: a tapered stone strip along the spine, drawn up to the
    // reveal fraction. The quill foot below the vane is its thick end.
    var seg = 40, upto = Math.max(2, Math.round(seg * shaftRev));
    var left = [], right = [];
    for (i = 0; i <= upto; i++) {
      var sv = (i / seg) * shaftRev;
      var p = F.spineAt(sv);
      var p2 = F.spineAt(Math.min(1, sv + 0.01));
      var nx = -(p2[1] - p[1]), ny = (p2[0] - p[0]);
      var nl = Math.sqrt(nx * nx + ny * ny) || 1;
      var hw = 0.017 * (1 - sv) + 0.004;
      left.push([p[0] + (nx / nl) * hw, p[1] + (ny / nl) * hw]);
      right.push([p[0] - (nx / nl) * hw, p[1] - (ny / nl) * hw]);
    }
    pathFrom(left.concat(right.reverse()));
    ctx.fillStyle = GRANITE;
    ctx.fill();
    ctx.strokeStyle = FRACTURE;
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = Math.max(1, scale * 0.0035);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Color pass: seven stain fields, clipped strictly to the feather.
    if (loopT >= 8) {
      ctx.save();
      pathFrom(outline);
      ctx.clip();
      for (var k = 0; k < 7; k++) {
        var g = bandProgress(k, loopT);
        if (g <= 0) continue;
        ctx.fillStyle = COLORS[k];
        ctx.globalAlpha = 0.85;
        var list = COLOR[k];
        for (i = 0; i < list.length; i++) {
          var bl = list[i];
          var u = (g - bl.th) / 0.25;
          if (u <= 0) continue;
          ctx.beginPath();
          ctx.arc(X(bl.x), Y(bl.y), bl.r * scale * smooth(u), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // Carved barb strokes over the top, so the stone texture reads
    // through the stain the way grain reads through a wash.
    ctx.strokeStyle = FRACTURE;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = Math.max(1, scale * 0.0055);
    ctx.lineCap = 'round';
    for (i = 0; i < F.barbs.length; i++) {
      b = F.barbs[i];
      var gb = barbGrowth(b, p1);
      if (gb <= 0) continue;
      ctx.beginPath();
      var steps = 8;
      for (var q = 0; q <= steps; q++) {
        var pt = quadAt(b, (q / steps) * gb);
        if (q === 0) ctx.moveTo(X(pt[0]), Y(pt[1]));
        else ctx.lineTo(X(pt[0]), Y(pt[1]));
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
    }
  }

  resize();
  draw(forcedT >= 0 ? forcedT : 0); // frame one: synchronous, loop time 0

  if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
