<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hortus</title>
<style>
  html, body { margin: 0; padding: 0; background: #F7F2E4; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32, fixed seed) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(528063);

  // ---------- palette (the listed 8 colours only, plus grain specks) ----------
  var CREAM = '#F7F2E4',  // sky + page ground
      TREE  = '#C8352A',  // tree trunk red
      GATE  = '#2B4FE0',  // gate blue
      GOLD  = '#F5B301',  // gold frog
      TURQ  = '#35C4B5',  // turquoise frog / foliage
      BLUEF = '#2B7DE0',  // blue frog
      WRED  = '#E6392B',  // woman's red top + sun red
      TONGUE = '#EE8C7E'; // flat pink mixed from sun red + sky cream (see process.md)

  // ---------- precomputed scene data (all seeded, static) ----------
  // grain specks (short strokes over the whole stage)
  var grain = [];
  for (var g = 0; g < 620; g++) {
    grain.push({ x: rng(), y: rng(), a: rng() * Math.PI, l: 2 + rng() * 4, dark: rng() < 0.55, al: 0.03 + rng() * 0.055 });
  }
  // gold flower dots sprinkled along the garden floor
  var floorDots = [];
  for (var fd = 0; fd < 26; fd++) {
    floorDots.push({ x: 0.11 + rng() * 0.86, y: 0.962 + rng() * 0.032, r: 0.0035 + rng() * 0.003, col: rng() < 0.6 ? GOLD : TURQ });
  }
  // gold fruit dots on the canopy
  var fruit = [];
  for (var fr = 0; fr < 15; fr++) {
    var fa = rng() * Math.PI * 2, frr = Math.sqrt(rng());
    fruit.push({ x: 0.50 + Math.cos(fa) * 0.165 * frr, y: 0.215 + Math.sin(fa) * 0.095 * frr, r: 0.009 + rng() * 0.005 });
  }
  // hedge scallops along the back of the garden floor
  var hedge = [];
  for (var hx = 0.018; hx < 1.0; hx += 0.052) {
    hedge.push({ x: hx + (rng() - 0.5) * 0.008, y: 0.908 + (rng() - 0.5) * 0.006, r: 0.034 + rng() * 0.008 });
  }
  // tree canopy blobs (hand-placed, turquoise)
  var canopy = [
    { x: 0.360, y: 0.240, r: 0.062 }, { x: 0.430, y: 0.185, r: 0.075 },
    { x: 0.500, y: 0.155, r: 0.082 }, { x: 0.570, y: 0.185, r: 0.075 },
    { x: 0.640, y: 0.240, r: 0.062 }, { x: 0.415, y: 0.262, r: 0.058 },
    { x: 0.585, y: 0.262, r: 0.058 }, { x: 0.500, y: 0.248, r: 0.070 },
    { x: 0.325, y: 0.288, r: 0.050 }, { x: 0.675, y: 0.288, r: 0.050 }
  ];

  // ---------- perches (fixed points: x, base y in stage units) ----------
  var PERCH = [
    { x: 0.338, y: 0.344 },  // 0 left branch tip (just below the canopy edge)
    { x: 0.662, y: 0.342 },  // 1 right branch tip (just below the canopy edge)
    { x: 0.087, y: 0.250 },  // 2 left gate arch top
    { x: 0.913, y: 0.250 },  // 3 right gate arch top
    { x: 0.500, y: 0.078 },  // 4 canopy top
    { x: 0.200, y: 0.962 },  // 5 ground left
    { x: 0.800, y: 0.962 },  // 6 ground right
    { x: 0.665, y: 0.990 },  // 7 foreground (giant frog anchor)
    { x: 0.115, y: 0.966 },  // 8 ground far left
    { x: 0.885, y: 0.906 },  // 9 hedge top, far right
    { x: 0.565, y: 0.922 }   // 10 bush top, mid ground
  ];

  // ---------- frogs ----------
  // sit durations cycle deterministically per frog
  function sitSeq(seed, n) {
    var r = mulberry32(seed), out = [];
    for (var i = 0; i < n; i++) out.push(2.4 + r() * 2.6);
    return out;
  }
  function makeFrog(col, s, route, home, seed, giant) {
    return {
      col: col, s: s, route: route, ri: home, giant: !!giant,
      mode: 'sit', sitUntil: 0, sitK: 0, sitDurs: sitSeq(seed, 6),
      fromX: 0, fromY: 0, toIdx: home, hopT0: 0, hopDur: 0.7, landT: -9,
      ph: seed * 0.618 % (Math.PI * 2)
    };
  }
  var frogs = [
    makeFrog(BLUEF, 0.055, [0, 5, 8], 0, 1101),
    makeFrog(GOLD, 0.052, [1, 6, 9], 0, 2202),
    makeFrog(TURQ, 0.046, [2, 4, 3], 0, 3303),
    makeFrog(GOLD, 0.075, [5, 10, 8], 0, 4404),
    makeFrog(TURQ, 0.070, [9, 6, 3], 0, 5505),
    makeFrog(BLUEF, 0.170, [7], 0, 6606, true) // giant foreground anchor
  ];
  // frame one: everybody seated at home, first hops a while off
  var INIT_DELAY = [2.6, 4.1, 3.3, 5.2, 4.6, 0];
  var PHASE0 = 2.0; // constant loop phase for frame one (tongue retracted, all frogs seated)
  for (var fi0 = 0; fi0 < frogs.length; fi0++) {
    frogs[fi0].sitUntil = PHASE0 + INIT_DELAY[fi0];
  }

  function perchPos(idx) { return PERCH[idx]; }
  function frogPos(f) {
    if (f.mode === 'hop') {
      var u = Math.min(1, Math.max(0, (nowT - f.hopT0) / f.hopDur));
      var a = perchPos(f.route[f.ri]), b = perchPos(f.route[f.toIdx]);
      var dist = Math.sqrt((b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y));
      var h = Math.min(0.20, 0.05 + dist * 0.30);
      var lift = 4 * h * u * (1 - u); // parabolic arc, peak h at u=0.5
      return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u - lift, u: u };
    }
    var p = perchPos(f.route[f.ri]);
    return { x: p.x, y: p.y, u: 0 };
  }
  function beginHop(f, t, routeIdx) {
    var a = perchPos(f.route[f.ri]), b = perchPos(f.route[routeIdx]);
    var d = Math.sqrt((b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y));
    f.mode = 'hop'; f.toIdx = routeIdx; f.hopT0 = t; f.hopDur = 0.55 + d * 0.85;
  }
  function stepFrogs(t) {
    for (var i = 0; i < frogs.length; i++) {
      var f = frogs[i];
      if (f.giant) continue;
      if (f.mode === 'sit' && t >= f.sitUntil) {
        beginHop(f, t, (f.ri + 1) % f.route.length);
      } else if (f.mode === 'hop' && t >= f.hopT0 + f.hopDur) {
        f.ri = f.toIdx; f.mode = 'sit'; f.landT = t;
        f.sitK++; f.sitUntil = t + f.sitDurs[f.sitK % f.sitDurs.length];
      }
    }
  }
  // drag scatter: sitting frogs near the touch leap to their route perch farthest from it
  function scatter(u, v) {
    for (var i = 0; i < frogs.length; i++) {
      var f = frogs[i];
      if (f.giant || f.mode !== 'sit' || f.route.length < 2) continue;
      var p = perchPos(f.route[f.ri]);
      var d = Math.sqrt((p.x - u) * (p.x - u) + (p.y - v) * (p.y - v));
      if (d > 0.38) continue;
      var best = -1, bestD = -1;
      for (var k = 0; k < f.route.length; k++) {
        if (k === f.ri) continue;
        var q = perchPos(f.route[k]);
        var qd = Math.sqrt((q.x - u) * (q.x - u) + (q.y - v) * (q.y - v));
        if (qd > bestD) { bestD = qd; best = k; }
      }
      if (best >= 0) beginHop(f, nowT, best);
    }
  }

  // ---------- viewport / stage ----------
  var W = 0, H = 0, SX = 0, SY = 0, SS = 0; // stage origin + size (square)
  var isPhone = false;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SS = Math.min(w, h);
    SX = (w - SS) / 2; SY = (h - SS) / 2;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || h > w * 1.15;
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- pointer (drag to scatter) ----------
  var nowT = PHASE0;
  function toStage(e) {
    return { u: (e.clientX - SX) / SS, v: (e.clientY - SY) / SS };
  }
  var dragging = false;
  function pdown(e) { dragging = true; var p = toStage(e); scatter(p.u, p.v); }
  function pmove(e) { if (!dragging) return; var p = toStage(e); scatter(p.u, p.v); }
  function pup() { dragging = false; }
  canvas.addEventListener('pointerdown', pdown);
  canvas.addEventListener('pointermove', pmove);
  window.addEventListener('pointerup', pup);
  canvas.addEventListener('touchstart', function (e) { if (e.touches[0]) pdown(e.touches[0]); }, { passive: true });
  canvas.addEventListener('touchmove', function (e) { if (e.touches[0]) pmove(e.touches[0]); }, { passive: true });
  window.addEventListener('touchend', pup);

  // ---------- drawing helpers (stage units: u = SS pixels) ----------
  function X(u) { return SX + u * SS; }
  function Y(u) { return SY + u * SS; }
  function line(x1, y1, x2, y2, wdt, col) {
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
  }
  function circ(x, y, r, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(X(x), Y(y), r * SS, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function ell(x, y, rx, ry, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(X(x), Y(y), rx * SS, ry * SS, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ---------- frog glyph ----------
  // Drawn in unit space: width 1 (x -0.5..0.5), base at y=0, top near y=-0.80.
  function drawFrogUnit(col, legExtend) {
    // hind legs: folded ellipses when perched, stretched back when leaping
    ctx.fillStyle = col;
    var hlx = -0.36 - legExtend * 0.10, hrx = 0.36 + legExtend * 0.10;
    var hly = -0.10 - legExtend * 0.10, hrot = 0.35 + legExtend * 0.55;
    ctx.save(); ctx.translate(hlx, hly); ctx.rotate(hrot);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.20 + legExtend * 0.09, 0.115, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(hrx, hly); ctx.rotate(-hrot);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.20 + legExtend * 0.09, 0.115, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // feet
    ctx.beginPath(); ctx.ellipse(-0.33 - legExtend * 0.13, -0.018, 0.155, 0.05, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.33 + legExtend * 0.13, -0.018, 0.155, 0.05, 0, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.beginPath(); ctx.ellipse(0, -0.335, 0.465, 0.305, 0, 0, Math.PI * 2); ctx.fill();
    // belly patch (cream, from the palette)
    ctx.fillStyle = CREAM; ctx.globalAlpha = 0.45;
    ctx.beginPath(); ctx.ellipse(0, -0.245, 0.255, 0.175, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // front feet peeking at the base
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(-0.13, -0.03, 0.075, 0.045, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.13, -0.03, 0.075, 0.045, 0, 0, Math.PI * 2); ctx.fill();
    // eye bumps
    ctx.beginPath(); ctx.arc(-0.175, -0.615, 0.118, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.175, -0.615, 0.118, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.arc(-0.175, -0.625, 0.064, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.175, -0.625, 0.064, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = TREE;
    ctx.beginPath(); ctx.arc(-0.168, -0.632, 0.033, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.182, -0.632, 0.033, 0, Math.PI * 2); ctx.fill();
    // smile
    ctx.strokeStyle = TREE; ctx.lineWidth = 0.022; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, -0.415, 0.155, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke();
  }
  function drawFrog(f, t) {
    var pos = frogPos(f);
    var sy, sx, tilt = 0, legExtend = 0;
    if (f.mode === 'hop') {
      var u = pos.u;
      var stretch = Math.sin(u * Math.PI);
      sy = 1 + 0.13 * stretch; sx = 1 - 0.09 * stretch;
      var a = perchPos(f.route[f.ri]), b = perchPos(f.route[f.toIdx]);
      tilt = -Math.sign(b.x - a.x || 1) * 0.16 * stretch;
      legExtend = stretch;
    } else {
      var br = Math.sin(t * 2.1 + f.ph);
      sy = 1 + 0.025 * br; sx = 1 - 0.018 * br;
      var sinceLand = t - f.landT;
      if (sinceLand >= 0 && sinceLand < 0.22) { // landing squash
        var k = 1 - sinceLand / 0.22;
        sy -= 0.15 * k; sx += 0.11 * k;
      }
    }
    ctx.save();
    ctx.translate(X(pos.x), Y(pos.y));
    ctx.rotate(tilt);
    ctx.scale(SS * f.s * sx, SS * f.s * sy);
    drawFrogUnit(f.col, legExtend);
    ctx.restore();
  }

  // ---------- one art-nouveau gate, open (m = -1 left, +1 right) ----------
  function drawGate(m) {
    function gx(u) { return m < 0 ? u : 1 - u; }
    ctx.strokeStyle = GATE; ctx.fillStyle = GATE; ctx.lineCap = 'round';
    // outer + inner posts
    ctx.fillRect(X(gx(0.010)) - (m < 0 ? 0 : 0.016 * SS), Y(0.300), 0.016 * SS, 0.670 * SS);
    ctx.fillRect(X(gx(0.150)) - (m < 0 ? 0 : 0.016 * SS), Y(0.335), 0.016 * SS, 0.635 * SS);
    circ(gx(0.018), 0.296, 0.013, GATE);
    circ(gx(0.158), 0.331, 0.013, GATE);
    // arch across the top
    ctx.lineWidth = 0.015 * SS;
    ctx.beginPath(); ctx.arc(X(0.500 + m * 0.413), Y(0.335), 0.079 * SS, Math.PI, 0); ctx.stroke();
    // the open door: a foreshortened panel swung inward from the inner post
    var hx = 0.166, tx2 = 0.252; // hinge edge -> free edge (stage-left coords, mirrored by gx)
    var top0 = 0.355, top1 = 0.425, bot0 = 0.950, bot1 = 0.895;
    ctx.lineWidth = 0.009 * SS;
    ctx.beginPath();
    ctx.moveTo(X(gx(hx)), Y(top0)); ctx.lineTo(X(gx(tx2)), Y(top1));
    ctx.lineTo(X(gx(tx2)), Y(bot1)); ctx.lineTo(X(gx(hx)), Y(bot0));
    ctx.closePath(); ctx.stroke();
    // spindles following the swing
    ctx.lineWidth = 0.005 * SS;
    for (var si = 1; si <= 4; si++) {
      var kk = si / 5;
      var px = hx + (tx2 - hx) * kk;
      ctx.beginPath();
      ctx.moveTo(X(gx(px)), Y(top0 + (top1 - top0) * kk));
      ctx.lineTo(X(gx(px)), Y(bot0 + (bot1 - bot0) * kk));
      ctx.stroke();
    }
    // art-nouveau curl medallion on the door
    var mx = gx(0.209), my = 0.640;
    ctx.lineWidth = 0.006 * SS;
    ctx.beginPath(); ctx.arc(X(mx), Y(my), 0.026 * SS, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(X(mx), Y(my), 0.016 * SS, Math.PI * 0.5, Math.PI * 2.6); ctx.stroke();
    circ(mx, my, 0.006, GOLD);
  }

  // ---------- the woman and her frog ----------
  var WOM = { x: 0.295, base: 0.970, headX: 0.295, headY: 0.828, headR: 0.017 };
  var NOSE = { x: WOM.headX + WOM.headR * 0.96, y: WOM.headY + 0.003 };
  var HELD = { x: 0.352, y: 0.888, s: 0.034, col: TURQ }; // small frog in her hand
  var MOUTH = { x: HELD.x - 0.0145, y: HELD.y - 0.0150 }; // its mouth, facing her
  function tongueE(t) {
    var lt = t % 4.6;
    if (lt < 2.6 || lt > 3.3) return 0;
    if (lt < 2.78) { var a = (lt - 2.6) / 0.18; return a * a * (3 - 2 * a); }
    if (lt < 3.05) return 1;
    var b = (lt - 3.05) / 0.25; return 1 - b * b * (3 - 2 * b);
  }
  function drawWoman(t) {
    var x = WOM.x, base = WOM.base;
    // legs (gate blue) + shoes (tree red)
    line(x - 0.008, 0.918, x - 0.011, base - 0.004, 0.007, GATE);
    line(x + 0.008, 0.918, x + 0.012, base - 0.004, 0.007, GATE);
    ell(x - 0.012, base - 0.002, 0.008, 0.004, TREE);
    ell(x + 0.013, base - 0.002, 0.008, 0.004, TREE);
    // red top: flat trapezoid torso
    ctx.fillStyle = WRED;
    ctx.beginPath();
    ctx.moveTo(X(x - 0.0135), Y(0.852));
    ctx.lineTo(X(x + 0.0135), Y(0.852));
    ctx.lineTo(X(x + 0.019), Y(0.922));
    ctx.lineTo(X(x - 0.019), Y(0.922));
    ctx.closePath(); ctx.fill();
    // arm reaching right, holding the frog (tree-red sleeve stroke)
    line(x + 0.011, 0.866, HELD.x - 0.006, HELD.y - 0.004, 0.0065, TREE);
    // head: cream disc, tree-red hair cap, one dot eye
    circ(WOM.headX, WOM.headY, WOM.headR, CREAM);
    ctx.strokeStyle = TREE; ctx.lineWidth = 0.0016 * SS;
    ctx.beginPath(); ctx.arc(X(WOM.headX), Y(WOM.headY), WOM.headR * SS, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = TREE;
    ctx.beginPath(); ctx.arc(X(WOM.headX), Y(WOM.headY), WOM.headR * SS, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
    circ(WOM.headX + 0.006, WOM.headY + 0.001, 0.0022, TREE);
    // the held frog (breathing squash only; it stays in her hand)
    ctx.save();
    ctx.translate(X(HELD.x), Y(HELD.y));
    var br = Math.sin(t * 2.3 + 1.1);
    ctx.scale(SS * HELD.s * (1 - 0.018 * br), SS * HELD.s * (1 + 0.025 * br));
    drawFrogUnit(HELD.col, 0);
    ctx.restore();
    // tongue flick: flat pink stroke + tip, frog mouth -> her nose
    var e = tongueE(t);
    if (e > 0.01) {
      var tipX = MOUTH.x + (NOSE.x - MOUTH.x) * e;
      var tipY = MOUTH.y + (NOSE.y - MOUTH.y) * e + Math.sin(e * Math.PI) * 0.004;
      ctx.strokeStyle = TONGUE; ctx.lineWidth = 0.0055 * SS; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(X(MOUTH.x), Y(MOUTH.y));
      ctx.quadraticCurveTo(X((MOUTH.x + tipX) / 2), Y(Math.max(MOUTH.y, tipY) + 0.006), X(tipX), Y(tipY));
      ctx.stroke();
      circ(tipX, tipY, 0.0055, TONGUE);
    }
  }

  function draw(t) {
    nowT = t;
    stepFrogs(t);
    // pin canvas css size every frame (house rule)
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // page ground
    ctx.fillStyle = CREAM; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath(); ctx.rect(SX, SY, SS, SS); ctx.clip();

    // sun disc, top-left, with short rays
    for (var ri = 0; ri < 8; ri++) {
      var ra = ri / 8 * Math.PI * 2 + 0.39;
      line(0.105 + Math.cos(ra) * 0.052, 0.105 + Math.sin(ra) * 0.052,
           0.105 + Math.cos(ra) * 0.064, 0.105 + Math.sin(ra) * 0.064, 0.004, WRED);
    }
    circ(0.105, 0.105, 0.042, WRED);

    // hedge: scalloped turquoise band at the back of the floor
    ctx.fillStyle = TURQ;
    ctx.fillRect(X(0), Y(0.912), SS, 0.048 * SS);
    for (var hi = 0; hi < hedge.length; hi++) circ(hedge[hi].x, hedge[hi].y, hedge[hi].r, TURQ);

    // gates, open at both sides
    drawGate(-1);
    drawGate(1);

    // tree: trunk, branches, canopy
    ctx.fillStyle = TREE;
    ctx.beginPath();
    ctx.moveTo(X(0.460), Y(1.0));
    ctx.quadraticCurveTo(X(0.472), Y(0.70), X(0.480), Y(0.455));
    ctx.lineTo(X(0.520), Y(0.455));
    ctx.quadraticCurveTo(X(0.530), Y(0.70), X(0.542), Y(1.0));
    ctx.closePath(); ctx.fill();
    ell(0.478, 0.995, 0.026, 0.010, TREE);
    ell(0.524, 0.995, 0.026, 0.010, TREE);
    ctx.strokeStyle = TREE; ctx.lineCap = 'round';
    ctx.lineWidth = 0.020 * SS;
    ctx.beginPath(); ctx.moveTo(X(0.492), Y(0.47)); ctx.quadraticCurveTo(X(0.435), Y(0.405), X(0.340), Y(0.340)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(0.508), Y(0.47)); ctx.quadraticCurveTo(X(0.575), Y(0.398), X(0.660), Y(0.338)); ctx.stroke();
    ctx.lineWidth = 0.016 * SS;
    ctx.beginPath(); ctx.moveTo(X(0.500), Y(0.46)); ctx.quadraticCurveTo(X(0.498), Y(0.36), X(0.500), Y(0.265)); ctx.stroke();
    for (var ci = 0; ci < canopy.length; ci++) circ(canopy[ci].x, canopy[ci].y, canopy[ci].r, TURQ);
    for (var fi = 0; fi < fruit.length; fi++) circ(fruit[fi].x, fruit[fi].y, fruit[fi].r, GOLD);

    // bush the mid-ground perch sits on
    ell(0.565, 0.945, 0.046, 0.026, TURQ);

    // the woman + her frog, lower third
    drawWoman(t);

    // frogs: high/small first, giant foreground last
    var order = [2, 0, 1, 3, 4, 5];
    for (var oi = 0; oi < order.length; oi++) drawFrog(frogs[order[oi]], t);

    // garden floor flower dots
    for (var di = 0; di < floorDots.length; di++) circ(floorDots[di].x, floorDots[di].y, floorDots[di].r, floorDots[di].col);

    // grain specks (precomputed, drawn directly)
    for (var gi = 0; gi < grain.length; gi++) {
      var gr = grain[gi];
      ctx.strokeStyle = gr.dark ? 'rgba(60,20,10,' + gr.al + ')' : 'rgba(255,255,255,' + gr.al + ')';
      ctx.lineWidth = Math.max(1, 0.0013 * SS);
      ctx.beginPath();
      ctx.moveTo(X(gr.x), Y(gr.y));
      ctx.lineTo(X(gr.x + Math.cos(gr.a) * gr.l / 1080), Y(gr.y + Math.sin(gr.a) * gr.l / 1080));
      ctx.stroke();
    }

    // hint
    ctx.fillStyle = 'rgba(200,53,42,0.50)';
    ctx.font = (0.020 * SS) + 'px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag', X(0.022), Y(0.976));

    ctx.restore();
  }

  // ---------- deterministic first frame + loop ----------
  draw(PHASE0);
  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    draw(PHASE0 + (now - startStamp) / 1000);
    window.requestAnimationFrame(frame);
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
