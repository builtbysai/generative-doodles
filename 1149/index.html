<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Axes of Affordance</title>
<style>
  html, body { margin: 0; padding: 0; background: #080808; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1149 "Axes of Affordance" - Rosa Menkman study block RM6 (The BLOB of Im/Possible Images).
   A cube volume of tiny generative image-cells is cut by a translucent plane.
   Cells on the possible side render crisp and neon; cells on the impossible side
   survive only as mirrored, half-erased residue with inverted fragments.
   Pseudo-3D on canvas 2D. No WebGL, no libraries, no sound. */

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- seeded rng ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- palette ---------- */
var FIELD = '#080808';
var NEON = ['#00E5FF', '#FF2E88', '#7CFF00', '#FFD21E', '#FF6A00', '#C792FF', '#00FF85', '#FF3B5C'];
var AXIS = { x: '#FF1E3C', y: '#00FF85', z: '#1E9CFF', a: '#FFD21E' };
var RES_BASE = '#3A3A3A';

function invColor(hex) {
  var r = 255 - parseInt(hex.slice(1, 3), 16);
  var g = 255 - parseInt(hex.slice(3, 5), 16);
  var b = 255 - parseInt(hex.slice(5, 7), 16);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ---------- cells ---------- */
var POS_SEED = 114906;
var glyphSeed = 5271;
var cells = [];

function buildPositions() {
  var rnd = mulberry32(POS_SEED);
  cells = [];
  var nx = 6, ny = 6, nz = 7;
  for (var i = 0; i < nx; i++) for (var j = 0; j < ny; j++) for (var k = 0; k < nz; k++) {
    var px = -1 + 2 * (i + 0.5) / nx + (rnd() - 0.5) * 0.20;
    var py = -1 + 2 * (j + 0.5) / ny + (rnd() - 0.5) * 0.20;
    var pz = -1 + 2 * (k + 0.5) / nz + (rnd() - 0.5) * 0.20;
    cells.push({ p: [px, py, pz], type: 0, color: NEON[0], inv: invColor(NEON[0]), v: [0, 0, 0, 0], phase: 0 });
  }
}
function buildGlyphs() {
  var rnd = mulberry32(glyphSeed);
  for (var i = 0; i < cells.length; i++) {
    var c = cells[i];
    c.type = Math.floor(rnd() * 5);
    c.color = NEON[Math.floor(rnd() * NEON.length)];
    c.inv = invColor(c.color);
    c.v = [rnd(), rnd(), rnd(), rnd()];
    c.phase = rnd() * Math.PI * 2;
  }
}
buildPositions();
buildGlyphs();

/* ---------- cutting plane (object space) ---------- */
var PN = (function () {
  var x = 1, y = 0.55, z = 0.8, l = Math.sqrt(x * x + y * y + z * z);
  return [x / l, y / l, z / l];
})();
var PU = (function () { // u = normalize(cross(PN, (0,1,0)))
  var ux = PN[1] * 0 - PN[2] * 1; // = -PN.z
  var uy = PN[2] * 0 - PN[0] * 0; // = 0
  var uz = PN[0] * 1 - PN[1] * 0; // = PN.x
  var l = Math.sqrt(ux * ux + uy * uy + uz * uz);
  return [ux / l, uy / l, uz / l];
})();
var PV = [ // v = cross(PN, PU)
  PN[1] * PU[2] - PN[2] * PU[1],
  PN[2] * PU[0] - PN[0] * PU[2],
  PN[0] * PU[1] - PN[1] * PU[0]
];

/* ---------- view / interaction state ---------- */
var T0 = 7.0; // fixed phase of the synchronous first frame
var userYawT = 0, userYaw = 0;
var userPitchT = 0, userPitch = 0;
var dragOffT = 0, dragOff = 0;
var lastTouch = -100; // phase time of last interaction (idle auto-rotation is always on, slow)
var dragging = false, lastPX = 0, lastPY = 0;
var lastDownT = -10, lastDownX = 0, lastDownY = 0;

function onDown(x, y, nowMs) {
  var t = T0 + (nowMs - startStamp) / 1000;
  if (t - lastDownT < 0.32 && Math.abs(x - lastDownX) < 24 && Math.abs(y - lastDownY) < 24) {
    glyphSeed = glyphSeed * 31 + 17;
    buildGlyphs();
    lastDownT = -10;
  } else {
    lastDownT = t; lastDownX = x; lastDownY = y;
  }
  dragging = true; lastPX = x; lastPY = y; lastTouch = t;
}
function onMove(x, y, nowMs) {
  if (!dragging) return;
  var dx = x - lastPX, dy = y - lastPY;
  lastPX = x; lastPY = y;
  userYawT += dx * 0.005;
  dragOffT += dy * 0.0035;
  if (dragOffT > 0.85) dragOffT = 0.85;
  if (dragOffT < -0.85) dragOffT = -0.85;
  userPitchT += dy * 0.0012;
  if (userPitchT > 0.5) userPitchT = 0.5;
  if (userPitchT < -0.5) userPitchT = -0.5;
  lastTouch = T0 + (nowMs - startStamp) / 1000;
}
function onUp(nowMs) { dragging = false; lastTouch = T0 + (nowMs - startStamp) / 1000; }

canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY, performance.now()); });
canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY, performance.now()); });
canvas.addEventListener('pointerup', function (e) { onUp(performance.now()); });
canvas.addEventListener('pointercancel', function (e) { onUp(performance.now()); });

/* ---------- sizing ---------- */
var W = 0, H = 0, cssW = 0, cssH = 0, DPR = 1, isPhone = false;
function fit() {
  var vv = window.visualViewport;
  cssW = vv ? vv.width : window.innerWidth;
  cssH = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cssW * DPR);
  canvas.height = Math.round(cssH * DPR);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  W = canvas.width; H = canvas.height;
  var scr = window.screen || { width: cssW, height: cssH };
  isPhone = Math.min(scr.width, scr.height) < 700 || cssH > cssW * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', fit);
}
window.addEventListener('resize', fit);
fit();

/* ---------- projection ---------- */
var F = 5.0;
function project(p, cy, sy, cp, sp, R, cx, cyy) {
  // rotate around Y (yaw) then X (pitch)
  var x = p[0] * cy + p[2] * sy;
  var z = -p[0] * sy + p[2] * cy;
  var y = p[1];
  var y2 = y * cp - z * sp;
  var z2 = y * sp + z * cp;
  var s = F / (F - z2);
  return [cx + x * s * R, cyy + y2 * s * R, z2, s];
}

/* ---------- glyph drawing (local coords, cell spans -h..h) ---------- */
function drawGlyph(type, color, s, v) {
  var h = s / 2;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(1, s * 0.09);
  if (type === 0) { // arc fan from top-left corner
    var radii = [0.38, 0.66, 0.94];
    for (var i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(-h, -h, radii[i] * s, 0, Math.PI / 2);
      ctx.stroke();
    }
  } else if (type === 1) { // dot grid
    var bits = Math.floor(v[0] * 512);
    for (var a = 0; a < 3; a++) for (var b = 0; b < 3; b++) {
      if ((bits >> (a * 3 + b)) & 1) {
        ctx.beginPath();
        ctx.arc(-s * 0.28 + a * s * 0.28, -s * 0.28 + b * s * 0.28, Math.max(0.8, s * 0.075), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else if (type === 2) { // bar stack
    for (var r2 = 0; r2 < 3; r2++) {
      var wdt = s * (0.35 + 0.6 * v[r2]);
      ctx.fillRect(-h, -s * 0.33 + r2 * s * 0.26, wdt, s * 0.15);
    }
  } else if (type === 3) { // ring + core
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.32, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(0.8, s * 0.09), 0, Math.PI * 2);
    ctx.fill();
  } else { // cross + square
    ctx.beginPath();
    ctx.moveTo(-s * 0.4, 0); ctx.lineTo(s * 0.4, 0);
    ctx.moveTo(0, -s * 0.4); ctx.lineTo(0, s * 0.4);
    ctx.stroke();
    ctx.strokeRect(-s * 0.13, -s * 0.13, s * 0.26, s * 0.26);
  }
}

/* ---------- main draw ---------- */
function draw(t) {
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  ctx.fillStyle = FIELD;
  ctx.fillRect(0, 0, W, H);

  // eased interaction state (targets set only by recorded drag events)
  userYaw += (userYawT - userYaw) * 0.12;
  userPitch += (userPitchT - userPitch) * 0.12;
  dragOff += (dragOffT - dragOff) * 0.12;

  var yaw = 0.55 + 0.055 * t + userYaw;
  var pitch = 0.38 + 0.05 * Math.sin(t * 0.23) + userPitch;
  var off = 0.18 * Math.sin(t * 0.11) + dragOff;

  var cy = Math.cos(yaw), sy = Math.sin(yaw);
  var cp = Math.cos(pitch), sp = Math.sin(pitch);
  var R = Math.min(W, H) * (isPhone ? 0.30 : 0.27);
  var cx = W / 2, cyy = H / 2;
  var cellBase = Math.min(W, H) * (isPhone ? 0.019 : 0.0165);

  function P(p) { return project(p, cy, sy, cp, sp, R, cx, cyy); }

  // axes (behind cells)
  var axes = [
    [[-1.45, 0, 0], [1.45, 0, 0], AXIS.x],
    [[0, -1.45, 0], [0, 1.45, 0], AXIS.y],
    [[0, 0, -1.45], [0, 0, 1.45], AXIS.z],
    [[-0.58, -0.63, -0.61], [0.58, 0.63, 0.61], AXIS.a]
  ];
  ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.002);
  for (var ai = 0; ai < axes.length; ai++) {
    var pa = P(axes[ai][0]), pb = P(axes[ai][1]);
    ctx.strokeStyle = axes[ai][2];
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // project all cells, depth-sort back to front
  var items = [];
  for (var i = 0; i < cells.length; i++) {
    var c = cells[i];
    var pr = P(c.p);
    var sd = c.p[0] * PN[0] + c.p[1] * PN[1] + c.p[2] * PN[2] - off;
    items.push({ c: c, x: pr[0], y: pr[1], z: pr[2], s: pr[3], sd: sd });
  }
  items.sort(function (a, b) { return a.z - b.z; });

  for (var k = 0; k < items.length; k++) {
    var it = items[k];
    var cell = it.c;
    var size = cellBase * it.s;
    if (size < 4) size = 4;
    if (size > 20) size = 20;
    var depthA = 0.55 + 0.45 * ((it.z + 1.8) / 3.6);
    if (depthA < 0.3) depthA = 0.3;
    if (depthA > 1) depthA = 1;
    var pulse = 0.92 + 0.08 * Math.sin(t * 0.7 + cell.phase);
    var h = size / 2;

    ctx.save();
    ctx.translate(it.x, it.y);
    if (it.sd >= 0) {
      // possible side: crisp neon tile
      ctx.globalAlpha = depthA * 0.95;
      ctx.fillStyle = '#12121A';
      ctx.fillRect(-h, -h, size, size);
      ctx.globalAlpha = depthA * pulse;
      drawGlyph(cell.type, cell.color, size * 0.82, cell.v);
      ctx.globalAlpha = depthA * 0.28;
      ctx.strokeStyle = cell.color;
      ctx.lineWidth = 1;
      ctx.strokeRect(-h, -h, size, size);
    } else {
      // impossible side: mirrored residue, checkerboard-erased, inverted fragments
      ctx.scale(-1, 1);
      ctx.globalAlpha = depthA * 0.9;
      ctx.fillStyle = '#141414';
      ctx.fillRect(-h, -h, size, size);
      ctx.globalAlpha = depthA * 0.95;
      var quads = [[-h, -h], [0, 0]];
      for (var q = 0; q < 2; q++) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(quads[q][0], quads[q][1], h, h);
        ctx.clip();
        drawGlyph(cell.type, RES_BASE, size * 0.82, cell.v);
        ctx.restore();
      }
      // inverted fragments of the original tile
      ctx.globalAlpha = depthA * 0.85;
      ctx.fillStyle = cell.inv;
      var fw = size * (0.14 + 0.14 * cell.v[2]);
      var fh = size * (0.12 + 0.12 * cell.v[3]);
      ctx.fillRect((cell.v[0] - 0.5) * size * 0.66 - fw / 2, (cell.v[1] - 0.5) * size * 0.66 - fh / 2, fw, fh);
      ctx.globalAlpha = depthA * 0.6;
      ctx.fillRect((0.5 - cell.v[1]) * size * 0.6 - fw / 3, (cell.v[0] - 0.5) * size * 0.6 - fh / 3, fw * 0.66, fh * 0.66);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // cutting plane quad (translucent sheet over the field)
  var ctr = [PN[0] * off, PN[1] * off, PN[2] * off];
  var corners = [];
  var sgn = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
  for (var ci = 0; ci < 4; ci++) {
    var pt = [
      ctr[0] + 1.3 * (sgn[ci][0] * PU[0] + sgn[ci][1] * PV[0]),
      ctr[1] + 1.3 * (sgn[ci][0] * PU[1] + sgn[ci][1] * PV[1]),
      ctr[2] + 1.3 * (sgn[ci][0] * PU[2] + sgn[ci][1] * PV[2])
    ];
    corners.push(P(pt));
  }
  ctx.beginPath();
  ctx.moveTo(corners[0][0], corners[0][1]);
  for (var ei = 1; ei < 4; ei++) ctx.lineTo(corners[ei][0], corners[ei][1]);
  ctx.closePath();
  ctx.fillStyle = 'rgba(240,248,255,0.06)';
  ctx.fill();
  var edgeCols = [AXIS.x, AXIS.y, AXIS.z, AXIS.a];
  ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.0022);
  for (var ej = 0; ej < 4; ej++) {
    var a2 = corners[ej], b2 = corners[(ej + 1) % 4];
    ctx.strokeStyle = edgeCols[ej];
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(a2[0], a2[1]); ctx.lineTo(b2[0], b2[1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ---------- run ---------- */
var startStamp = performance.now();
draw(T0); // synchronous fixed-phase first frame
if (typeof requestAnimationFrame === 'function') {
  var rafLoop = function (nowMs) {
    draw(T0 + (nowMs - startStamp) / 1000);
    requestAnimationFrame(rafLoop);
  };
  requestAnimationFrame(rafLoop);
}
</script>
</body>
</html>
