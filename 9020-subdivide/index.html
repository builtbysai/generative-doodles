<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9020 · Subdivide — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14120d;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 600px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #a33b2e; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #f2ecdd;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #a33b2e; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9020</span> · Subdivide</h1>
  <p>One rectangle, split again and again until every piece earns its texture:
  hatching, stipple, rings, the occasional flat solid. Mondrian-adjacent in
  method only. <b>Click the piece for a new variation.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 867530;

const PAPER = "#f2ecdd";
const INK = "#23201a";
const TAU = Math.PI * 2;

// All layout happens in viewport-independent virtual units (1000x1000), so a
// seed draws the identical composition at every screen size; only the render
// resolution changes.
const VU = 1000, VM = 75, VW = 850, VH = 850, VMIN = 68;

const ACCENTS = ["#a2442b", "#c08a3e", "#33415e", "#2e6e63", "#6e3b52"];

function makeNoise(rnd){
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = rnd();
  const at = (x, y) => g[((x & 255) + (y & 255) * 137) & 255];
  const sm = t => t * t * (3 - 2 * t);
  return function(x, y){
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    const u = sm(xf), v = sm(yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}

function pointInPoly(px, py, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi))
      inside = !inside;
  }
  return inside;
}
function bbox(poly){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of poly){
    if (p[0] < x0) x0 = p[0]; if (p[1] < y0) y0 = p[1];
    if (p[0] > x1) x1 = p[0]; if (p[1] > y1) y1 = p[1];
  }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
function polyArea(poly){
  let a = 0;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++)
    a += (poly[j][0] + poly[i][0]) * (poly[j][1] - poly[i][1]);
  return Math.abs(a / 2);
}

function draw(){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = stage.clientWidth;
  const K = S / VU; // virtual-unit -> css px scale
  canvas.width = S * dpr; canvas.height = S * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr * K, dpr * K); // draw everything in virtual units

  const rnd = mulberry32(seed);
  const wobN = makeNoise(mulberry32(seed ^ 0x51ab));

  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VU, VU);

  // per-piece accent discipline: one dominant, one rare second
  const a1 = ACCENTS[(rnd() * ACCENTS.length) | 0];
  let a2 = ACCENTS[(rnd() * ACCENTS.length) | 0];
  if (a2 === a1) a2 = ACCENTS[((rnd() * ACCENTS.length) | 0 + 1) % ACCENTS.length];

  // ---- recursive subdivision (virtual units) ----
  const leaves = [];
  const cuts = [];
  const maxDepth = 4 + ((rnd() * 2) | 0); // 4..5

  function subdivide(x, y, w, h, depth){
    const areaFrac = (w * h) / (VW * VH);
    // big cells must keep splitting: scale the stop chance by area so a
    // click can never land on a two-slab composition
    const stopP = (0.06 + depth * 0.11) * Math.min(1, Math.max(0.12, areaFrac / 0.30));
    const mustSplit = areaFrac > 0.30;
    if (depth >= maxDepth || ((w < VMIN * 2 && h < VMIN * 2) || (!mustSplit && rnd() < stopP))){
      leaves.push([[x, y], [x + w, y], [x + w, y + h], [x, y + h]]);
      return;
    }
    // rare diagonal split: terminal, produces two polygons
    if (depth >= 1 && Math.min(w, h) > VMIN * 2.6 && rnd() < 0.10){
      const t1 = 0.25 + rnd() * 0.5, t2 = 0.25 + rnd() * 0.5;
      if (rnd() < 0.5){
        const ax = x + w * t1, by = y + h * t2;
        leaves.push([[x, y], [ax, y], [x, by]]);
        leaves.push([[ax, y], [x + w, y], [x + w, y + h], [x, y + h], [x, by]]);
        cuts.push({ x1: ax, y1: y, x2: x, y2: by });
      } else {
        const ax = x + w * t1, ry = y + h * (1 - t2);
        leaves.push([[x + w, ry], [x + w, y + h], [ax, y + h]]);
        leaves.push([[x, y], [x + w, y], [x + w, ry], [ax, y + h], [x, y + h]]);
        cuts.push({ x1: x + w, y1: ry, x2: ax, y2: y + h });
      }
      return;
    }
    let vertical;
    if (w > h * 1.25) vertical = true;
    else if (h > w * 1.25) vertical = false;
    else vertical = rnd() < 0.5;
    const t = 0.30 + rnd() * 0.40;
    if (vertical){
      const sx = x + w * t;
      cuts.push({ x1: sx, y1: y, x2: sx, y2: y + h });
      subdivide(x, y, sx - x, h, depth + 1);
      subdivide(sx, y, x + w - sx, h, depth + 1);
    } else {
      const sy = y + h * t;
      cuts.push({ x1: x, y1: sy, x2: x + w, y2: sy });
      subdivide(x, y, w, sy - y, depth + 1);
      subdivide(x, sy, w, y + h - sy, depth + 1);
    }
  }
  subdivide(VM, VM, VW, VH, 0);

  // ---- texture fills (virtual units) ----
  function pathPoly(poly){
    ctx.beginPath();
    ctx.moveTo(poly[0][0], poly[0][1]);
    for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
    ctx.closePath();
  }
  function hatch(poly, angle, spacing, color, lw, alpha){
    const bb = bbox(poly);
    const diag = Math.hypot(bb.w, bb.h);
    const cx = bb.x + bb.w / 2, cy = bb.y + bb.h / 2;
    const dx = Math.cos(angle), dy = Math.sin(angle);
    const nx = -dy, ny = dx;
    ctx.save(); pathPoly(poly); ctx.clip();
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.globalAlpha = alpha;
    ctx.beginPath();
    for (let d = -diag / 2; d <= diag / 2; d += spacing){
      const px = cx + nx * d, py = cy + ny * d;
      ctx.moveTo(px - dx * diag / 2, py - dy * diag / 2);
      ctx.lineTo(px + dx * diag / 2, py + dy * diag / 2);
    }
    ctx.stroke();
    ctx.restore(); ctx.globalAlpha = 1;
  }
  function stipple(poly, density, color){
    const bb = bbox(poly);
    const n = Math.min(1500, Math.max(24, (polyArea(poly) / density) | 0));
    ctx.fillStyle = color;
    let placed = 0, tries = 0;
    while (placed < n && tries < n * 12){
      tries++;
      const px = bb.x + rnd() * bb.w, py = bb.y + rnd() * bb.h;
      if (!pointInPoly(px, py, poly)) continue;
      const r = 1.3 + rnd() * 2.6;
      ctx.globalAlpha = 0.55 + rnd() * 0.35;
      ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill();
      placed++;
    }
    ctx.globalAlpha = 1;
  }
  function dotGrid(poly, spacing, color){
    const bb = bbox(poly);
    const ox = rnd() * spacing, oy = rnd() * spacing;
    ctx.fillStyle = color;
    for (let gy = bb.y + oy; gy < bb.y + bb.h; gy += spacing){
      for (let gx = bb.x + ox; gx < bb.x + bb.w; gx += spacing){
        if (!pointInPoly(gx, gy, poly)) continue;
        ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.arc(gx, gy, 2.1, 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  function rings(poly, color){
    const bb = bbox(poly);
    const cx = bb.x + bb.w / 2, cy = bb.y + bb.h / 2;
    const maxR = Math.hypot(bb.w, bb.h) / 2;
    const step = 7.9 + rnd() * 9.2;
    ctx.save(); pathPoly(poly); ctx.clip();
    ctx.strokeStyle = color; ctx.lineWidth = 2.6; ctx.globalAlpha = 0.8;
    ctx.beginPath();
    for (let r = step * 0.7; r < maxR; r += step){
      ctx.moveTo(cx + r, cy);
      ctx.arc(cx, cy, r, 0, TAU);
    }
    ctx.stroke();
    ctx.restore(); ctx.globalAlpha = 1;
  }
  function waves(poly, color){
    const bb = bbox(poly);
    const spacing = 9.2 + rnd() * 10.5;
    const amp = 2.6 + rnd() * 4.6;
    const ph = rnd() * TAU, fr = 0.015 + rnd() * 0.015;
    ctx.save(); pathPoly(poly); ctx.clip();
    ctx.strokeStyle = color; ctx.lineWidth = 2.1; ctx.globalAlpha = 0.75;
    ctx.beginPath();
    for (let yy = bb.y; yy < bb.y + bb.h + spacing; yy += spacing){
      for (let xx = bb.x - 13; xx < bb.x + bb.w + 13; xx += 8){
        const wy = yy + Math.sin(xx * fr + ph) * amp;
        if (xx <= bb.x - 13 + 0.01) ctx.moveTo(xx, wy); else ctx.lineTo(xx, wy);
      }
    }
    ctx.stroke();
    ctx.restore(); ctx.globalAlpha = 1;
  }

  const HATCH_ANGLES = [0, Math.PI / 2, Math.PI / 4, -Math.PI / 4, Math.PI / 6];
  let solidInkUsed = 0, solidAccUsed = 0;
  function pickTexture(area){
    const big = area > 50000; // large cells must earn a texture
    for (let tries = 0; tries < 10; tries++){
      const r = rnd();
      let k;
      if (r < 0.20) k = "paper";
      else if (r < 0.40) k = "hatch";
      else if (r < 0.48) k = "cross";
      else if (r < 0.60) k = "stipple";
      else if (r < 0.68) k = "dots";
      else if (r < 0.75) k = "solidInk";
      else if (r < 0.84) k = "solidAcc";
      else if (r < 0.92) k = "rings";
      else k = "waves";
      if (k === "paper" && big) continue;
      if (k === "solidInk" && (solidInkUsed >= 3 || area < 4000 || area > 120000)) continue;
      if (k === "solidAcc" && (solidAccUsed >= 4 || area < 3000 || area > 100000)) continue;
      if ((k === "rings" || k === "waves") && area < 4000) continue;
      return k;
    }
    return "hatch";
  }

  for (const poly of leaves){
    const area = polyArea(poly);
    const k = pickTexture(area);
    const bb = bbox(poly);
    if (k === "solidInk"){
      solidInkUsed++;
      ctx.fillStyle = INK;
      pathPoly(poly); ctx.fill();
    } else if (k === "solidAcc"){
      solidAccUsed++;
      // slight misregistration: accent slips a few units past the ink line
      const ma = rnd() * TAU, mm = 2.6 + rnd() * 3.3;
      ctx.save();
      ctx.translate(Math.cos(ma) * mm, Math.sin(ma) * mm);
      ctx.fillStyle = rnd() < 0.75 ? a1 : a2;
      pathPoly(poly); ctx.fill();
      ctx.restore();
    } else if (k === "hatch"){
      hatch(poly, HATCH_ANGLES[(rnd() * HATCH_ANGLES.length) | 0],
            6.6 + rnd() * 11.8, INK, 2.1, 0.72);
    } else if (k === "cross"){
      const an = HATCH_ANGLES[(rnd() * HATCH_ANGLES.length) | 0];
      const sp = 9.2 + rnd() * 10.5;
      hatch(poly, an, sp, INK, 1.7, 0.55);
      hatch(poly, an + Math.PI / 2, sp, INK, 1.7, 0.40);
    } else if (k === "stipple"){
      stipple(poly, 73 + rnd() * 120, INK);
    } else if (k === "dots"){
      dotGrid(poly, 11.8 + rnd() * 10.5, INK);
    } else if (k === "rings"){
      rings(poly, rnd() < 0.3 ? (rnd() < 0.7 ? a1 : a2) : INK);
    } else if (k === "waves"){
      waves(poly, INK);
    } else {
      // paper: occasional inner frame for rhythm
      if (rnd() < 0.16 && bb.w > 118 && bb.h > 118){
        const ins = Math.min(bb.w, bb.h) * 0.18;
        ctx.strokeStyle = INK; ctx.globalAlpha = 0.6;
        ctx.lineWidth = 2.1;
        ctx.strokeRect(bb.x + ins, bb.y + ins, bb.w - 2 * ins, bb.h - 2 * ins);
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---- ink lines: outer border + cuts, hand-wobbled once each ----
  ctx.strokeStyle = INK;
  ctx.lineCap = "round";
  function wobLine(x1, y1, x2, y2, lw){
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const len = Math.hypot(x2 - x1, y2 - y1);
    const nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
    const off = (wobN(mx * 0.023, my * 0.023) - 0.5) * 2 * 2.9;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(mx + nx * off, my + ny * off, x2, y2);
    ctx.stroke();
  }
  wobLine(VM, VM, VM + VW, VM, 6);
  wobLine(VM + VW, VM, VM + VW, VM + VH, 6);
  wobLine(VM + VW, VM + VH, VM, VM + VH, 6);
  wobLine(VM, VM + VH, VM, VM, 6);
  for (const c of cuts) wobLine(c.x1, c.y1, c.x2, c.y2, 2.8);

  // ---- analogue grain ----
  const rnd2 = mulberry32(seed ^ 0x77e);
  for (let i = 0; i < 3800; i++){
    const gx = rnd2() * VU, gy = rnd2() * VU;
    ctx.globalAlpha = 0.03 + rnd2() * 0.05;
    ctx.fillStyle = rnd2() < 0.6 ? "#4a4438" : "#ffffff";
    const gs = 1.05 + rnd2() * 1.6;
    ctx.fillRect(gx, gy, gs, gs);
  }
  ctx.globalAlpha = 1;
  const vg = ctx.createRadialGradient(500, 500, 400, 500, 500, 800);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(74,64,46,0.10)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VU, VU);
}

document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  draw();
});
window.addEventListener("resize", draw);
draw();
</script>
</body>
</html>
