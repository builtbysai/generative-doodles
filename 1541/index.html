<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wheel in Chains</title>
<style>
html, body { margin: 0; padding: 0; background: #0d0c10; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// The Wheel in Chains (arthur-jafa AJ6). One huge ring, a tire, turning
// slowly with one long pause per revolution; a chain of link glyphs rides
// the circumference, one link signal red, always the same link.
var REV = 60;      // seconds of steady rotation per revolution
var PAUSE = 8;     // long beat held at the top of each revolution
var LOOP = REV + PAUSE; // 68 s film loop: rotate, pause, repeat exactly
var LINKS = 36;
var TREADS = 48;
var SEED = 1541000;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(SEED);
var TREAD_JIT = [];
for (var i = 0; i < TREADS; i++) TREAD_JIT.push((rand() - 0.5) * 0.10);

var W = 0, H = 0;
var lastT = 0;

function r4(v) { return Math.round(v * 10000) / 10000; }

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  } else { vw = 720; vh = 720; }
  W = vw; H = vh;
  var phone = false;
  if (typeof window !== 'undefined' && window.screen) {
    var m = Math.min(window.screen.width, window.screen.height);
    if (m < 700) phone = true;
  }
  if (!phone && H > W * 1.15) phone = true;
  // Centered geometric piece: the ring keeps its shape on every screen and
  // the page ground takes the piece's own background color. Phone detection
  // above still runs; the layout below is size-driven, not phone-gated.
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}

function loopLocal(t) {
  var u = t % LOOP;
  if (u < 0) u += LOOP;
  return u;
}

// Scheduled ring angle at absolute piece time t: steady rotation for REV
// seconds, then held at the completed revolution for PAUSE seconds.
function scheduledAngle(t) {
  var u = loopLocal(t);
  if (u < REV) return (Math.PI * 2) * (u / REV);
  return Math.PI * 2;
}

// Drag sessions. Ring drags speed or slow the rotation only while held:
// the direction is set by the first qualifying horizontal move of the
// session and the offset grows from that moment, so the angle stays a
// closed-form function of recorded events. On release the offset is
// dropped and the ring cuts back to its scheduled angle (the same
// release rule as the Worried Note's mark drag). Red-link drags hold the
// ring with the red link at the top while pressed.
var ringSessions = [];
var curRing = null;
var curRed = null;

function angleAt(t) {
  var base = scheduledAngle(t);
  if (curRed) return -Math.PI / 2;
  if (curRing && curRing.dir !== 0 && t >= curRing.tDir) {
    var extraRate = 0.5 * (Math.PI * 2 / REV);
    return base + curRing.dir * extraRate * (t - curRing.tDir);
  }
  return base;
}

function geom() {
  var S = Math.min(W, H);
  return {
    cx: W / 2, cy: H / 2, S: S,
    rOut: 0.47 * S, rIn: 0.34 * S,
    treadR: 0.455 * S, linkR: 0.405 * S
  };
}

function onDown(e) {
  size();
  var g = geom();
  var dx = e.clientX - g.cx, dy = e.clientY - g.cy;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var a = angleAt(lastT);
  var redX = g.cx + g.linkR * Math.cos(a);
  var redY = g.cy + g.linkR * Math.sin(a);
  var rdx = e.clientX - redX, rdy = e.clientY - redY;
  if (rdx * rdx + rdy * rdy <= (0.05 * g.S) * (0.05 * g.S)) {
    curRed = { t0: lastT };
  } else if (dist >= g.rIn * 0.75 && dist <= g.rOut * 1.15) {
    curRing = { t0: lastT, t1: null, dir: 0, tDir: 0, startX: e.clientX };
    ringSessions.push(curRing);
  }
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (curRing && curRing.dir === 0) {
    var ddx = e.clientX - curRing.startX;
    if (Math.abs(ddx) > 4) {
      curRing.dir = ddx > 0 ? 1 : -1;
      curRing.tDir = lastT;
    }
  }
}
function onUp() {
  if (curRing) { curRing.t1 = lastT; curRing = null; }
  if (curRed) { curRed = null; }
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', size);
  }
  if (window.addEventListener) window.addEventListener('resize', size);
}

var hook = {};
if (typeof window !== 'undefined') window.__t41 = hook;

function draw(t) {
  size();
  lastT = t;
  var a = angleAt(t);
  var g = geom();

  ctx.fillStyle = '#0d0c10';
  ctx.fillRect(0, 0, W, H);

  // Ring band: filled outer disc, then the ground-colored inner disc.
  ctx.fillStyle = '#26221e';
  ctx.beginPath();
  ctx.moveTo(g.cx + g.rOut, g.cy);
  ctx.arc(g.cx, g.cy, g.rOut, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0d0c10';
  ctx.beginPath();
  ctx.moveTo(g.cx + g.rIn, g.cy);
  ctx.arc(g.cx, g.cy, g.rIn, 0, Math.PI * 2);
  ctx.fill();

  // Tread: short diagonal bars around the outer edge, rotating with the ring.
  ctx.fillStyle = '#3a352e';
  for (var i = 0; i < TREADS; i++) {
    var ta = a + (i / TREADS) * Math.PI * 2 + TREAD_JIT[i] * 0.05;
    var tx = g.cx + g.treadR * Math.cos(ta);
    var ty = g.cy + g.treadR * Math.sin(ta);
    var len = 0.045 * g.S, wid = 0.012 * g.S;
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(ta + Math.PI / 2 + 0.6);
    ctx.fillStyle = '#3a352e';
    ctx.fillRect(-wid / 2, -len / 2, wid, len);
    ctx.restore();
  }

  // Chain: evenly spaced link glyphs (overlapping ovals) on the band.
  // Link 0 is always signal red; the rest alternate pale silver and shadow.
  var lw = Math.max(1, 0.008 * g.S);
  ctx.lineWidth = lw;
  for (var j = 0; j < LINKS; j++) {
    var la = a + (j / LINKS) * Math.PI * 2;
    var lx = g.cx + g.linkR * Math.cos(la);
    var ly = g.cy + g.linkR * Math.sin(la);
    if (j === 0) ctx.strokeStyle = '#b33324';
    else if (j % 2 === 1) ctx.strokeStyle = '#5a5348';
    else ctx.strokeStyle = '#b8b8b8';
    ctx.beginPath();
    ctx.ellipse(lx, ly, 0.028 * g.S, 0.016 * g.S, la + Math.PI / 2, 0, Math.PI * 2);
    ctx.stroke();
  }

  hook.angle = a;
  hook.u = loopLocal(t);
  hook.cx = g.cx; hook.cy = g.cy;
  hook.rOut = g.rOut; hook.rIn = g.rIn; hook.linkR = g.linkR;
  hook.links = LINKS;
  hook.redX = g.cx + g.linkR * Math.cos(a);
  hook.redY = g.cy + g.linkR * Math.sin(a);
  hook.dragging = curRing !== null || curRed !== null;
  hook.dragKind = curRed ? 'red' : (curRing ? 'ring' : null);
}

draw(0);

var started = false;
var t0 = 0;
function loop(ts) {
  if (!started) { started = true; t0 = ts; }
  draw((ts - t0) / 1000);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
