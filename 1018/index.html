<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nine Buffers</title>
<style>
html, body { margin: 0; padding: 0; background: #050507; height: 100%; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// No.1018 "Nine Buffers" - study #125 yuta-asai, PP179 "Composer Grid" (Glitch Composer).
// A 3x3 grid of nine live procedural buffers. No text, no chrome: the cells are the interface.
// Frame one is the synchronous draw at fixed T0 = 12 s. All state is seeded / closed-form.

var FIELD = '#050507', DIV = '#14161C', WHITE = '#FFFFFF', GRAY = '#8A8D84';
var CYAN = '#00E5FF', MAG = '#FF2EA6', GRN = '#3DDC84', YEL = '#FFD93B', RED = '#FF2E4D';
var T0 = 12;

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  var h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, u) { return a + (b - a) * u; }

// ---------- seeded parameters ----------
var baseSeed = 1018179;
var P = null;          // per-cell parameter sets, regenerated on reseed
var tunes = null;      // per-cell tune values set by dragging

function genParams(seed) {
  var p = {};
  var i, r;
  // 1 DETECTION: 3 targets on lissajous paths
  r = mulberry32(seed * 31 + 1);
  p.det = { targets: [], flareP: 2.6 + r() * 1.2, flareO: r() * 3 };
  for (i = 0; i < 3; i++) p.det.targets.push({
    ax: 0.22 + r() * 0.14, ay: 0.20 + r() * 0.14,
    fx: 0.11 + r() * 0.10, fy: 0.13 + r() * 0.10,
    px: r() * 6.28, py: r() * 6.28, size: 0.16 + r() * 0.10
  });
  // 2 PEOPLE-MASKS: 3 drifting glyph figures
  r = mulberry32(seed * 31 + 2);
  p.masks = { figs: [], flareP: 4.5 + r() * 2, flareO: r() * 5 };
  for (i = 0; i < 3; i++) p.masks.figs.push({
    shade: i, ax: 0.16 + r() * 0.12, ay: 0.10 + r() * 0.08,
    fx: 0.05 + r() * 0.04, fy: 0.04 + r() * 0.03,
    px: r() * 6.28, py: r() * 6.28, sc: 0.30 + r() * 0.10, bob: r() * 6.28
  });
  // 3 AD-SLOT MASKS: 3 rectangles on cadences
  r = mulberry32(seed * 31 + 3);
  p.slots = { rects: [], flareP: 3.4 + r() * 1.5, flareO: r() * 4 };
  var slotPos = [[0.08, 0.10, 0.52, 0.34], [0.42, 0.52, 0.50, 0.36], [0.10, 0.58, 0.34, 0.30]];
  for (i = 0; i < 3; i++) p.slots.rects.push({
    x: slotPos[i][0], y: slotPos[i][1], w: slotPos[i][2], h: slotPos[i][3],
    per: 5.0 + r() * 3.0, off: r()
  });
  // 4 HALFTONE: radial wave
  r = mulberry32(seed * 31 + 4);
  p.halftone = { fx: 0.05 + r() * 0.04, fy: 0.04 + r() * 0.03, px: r() * 6.28, py: r() * 6.28, flareP: 5.5 + r() * 2, flareO: r() * 6 };
  // 5 GLITCH: hidden figure chewed into macroblocks
  r = mulberry32(seed * 31 + 5);
  p.glitch = { px: r() * 6.28, py: r() * 6.28, seed: (r() * 100000) | 0, flareP: 2.2 + r() * 1.0, flareO: r() * 3 };
  // 6 DEPTH: drifting grayscale blobs
  r = mulberry32(seed * 31 + 6);
  p.depth = { blobs: [], flareP: 6.0 + r() * 2, flareO: r() * 6 };
  for (i = 0; i < 5; i++) p.depth.blobs.push({
    x: 0.2 + r() * 0.6, y: 0.2 + r() * 0.6, rad: 0.22 + r() * 0.22,
    val: 0.25 + r() * 0.75, ax: 0.05 + r() * 0.07, ay: 0.04 + r() * 0.06,
    fx: 0.05 + r() * 0.05, fy: 0.04 + r() * 0.05, ph: r() * 6.28
  });
  // 7 SEGMENTATION: 3 class centres wandering (voronoi-ish blocks)
  r = mulberry32(seed * 31 + 7);
  p.seg = { centres: [], flareP: 4.0 + r() * 1.5, flareO: r() * 4 };
  var segCols = [MAG, GRN, YEL];
  for (i = 0; i < 3; i++) p.seg.centres.push({
    col: segCols[i], ax: 0.24 + r() * 0.12, ay: 0.22 + r() * 0.12,
    fx: 0.05 + r() * 0.05, fy: 0.04 + r() * 0.05, px: r() * 6.28, py: r() * 6.28,
    reach: 0.34 + r() * 0.14
  });
  // 8 INPAINT: hole / heal cycles
  r = mulberry32(seed * 31 + 8);
  p.inpaint = { cyc: 9.0, seed: (r() * 100000) | 0, flareO: r() * 2 };
  // 9 MASTER: composite miniature
  r = mulberry32(seed * 31 + 9);
  p.master = { px: r() * 6.28, py: r() * 6.28, seed: (r() * 100000) | 0, flareP: 3.0 + r() * 1.2, flareO: r() * 3 };
  return p;
}
function defaultTunes() {
  // det: box lag seconds; halftone: pitch px factor; glitch: block px factor;
  // inpaint: heal speed; others: rate multipliers. Drag writes these.
  return { detLag: 0.35, maskRate: 1, slotRate: 1, halfPitch: 1, glitchBlock: 1, depthRate: 1, segRate: 1, healSpeed: 1, masterGlitch: 1 };
}
P = genParams(baseSeed);
tunes = defaultTunes();

// ---------- viewport ----------
var VW = 720, VH = 720, DPR = 1, PHONE = false;
function viewSize() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  var w = vv ? vv.width : (typeof window !== 'undefined' ? window.innerWidth : 720);
  var h = vv ? vv.height : (typeof window !== 'undefined' ? window.innerHeight : 720);
  return [w, h];
}
function resize() {
  var s = viewSize();
  VW = s[0]; VH = s[1];
  DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
  canvas.width = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
  var mn = Math.min(sw, sh);
  PHONE = (mn > 0 && mn < 700) || (VH > VW * 1.15);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', function () { resize(); draw(curT); });
  if (window.addEventListener) window.addEventListener('resize', function () { resize(); draw(curT); });
}
resize();

// border flare from a seeded event schedule: events at off + k*per
function flareAlpha(per, off, t) {
  if (t < off) return 0;
  var e = off + Math.floor((t - off) / per) * per;
  var d = t - e;
  return d < 1.2 ? 0.9 * Math.exp(-d / 0.22) : 0;
}

// ---------- glyph figure (capsule skeleton) ----------
// Returns joint points for a standing figure centred at (cx, cy), height s,
// with a gentle seeded sway pose at time t.
function figurePoints(cx, cy, s, t, ph) {
  var sw = Math.sin(t * 0.9 + ph) * 0.05;          // lean
  var armA = Math.sin(t * 0.7 + ph * 1.7) * 0.30;  // arm swing
  var legA = Math.sin(t * 0.55 + ph * 2.3) * 0.16; // leg swing
  var u = s / 8; // unit: head radius = u
  var hip = { x: cx + sw * s * 0.4, y: cy + 0.6 * u };
  var neck = { x: cx + sw * s, y: cy - 2.2 * u };
  var head = { x: neck.x + sw * s * 0.5, y: neck.y - 1.5 * u };
  function limb(ox, oy, a1, l1, a2, l2) {
    var j = { x: ox + Math.sin(a1) * l1, y: oy + Math.cos(a1) * l1 };
    var e = { x: j.x + Math.sin(a2) * l2, y: j.y + Math.cos(a2) * l2 };
    return [j, e];
  }
  var aL = limb(neck.x, neck.y, 0.9 + armA, 2.0 * u, 1.2 + armA * 0.7, 1.9 * u);
  var aR = limb(neck.x, neck.y, -0.9 + armA * 0.8, 2.0 * u, -1.2 + armA * 0.5, 1.9 * u);
  var lL = limb(hip.x, hip.y, 0.28 + legA, 2.1 * u, 0.10 + legA * 0.6, 2.1 * u);
  var lR = limb(hip.x, hip.y, -0.28 - legA * 0.8, 2.1 * u, -0.10 - legA * 0.5, 2.1 * u);
  return {
    head: head, headR: u, neck: neck, hip: hip,
    elL: aL[0], haL: aL[1], elR: aR[0], haR: aR[1],
    knL: lL[0], ftL: lL[1], knR: lR[0], ftR: lR[1], thick: 0.72 * u
  };
}
var FIG_SEGS = [['neck', 'hip'], ['neck', 'elL'], ['elL', 'haL'], ['neck', 'elR'], ['elR', 'haR'],
  ['hip', 'knL'], ['knL', 'ftL'], ['hip', 'knR'], ['knR', 'ftR'], ['neck', 'head']];
function drawFigure(fp, color) {
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = fp.thick * 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (var i = 0; i < FIG_SEGS.length; i++) {
    var a = fp[FIG_SEGS[i][0]], b = fp[FIG_SEGS[i][1]];
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  }
  ctx.stroke();
  ctx.beginPath(); ctx.arc(fp.head.x, fp.head.y, fp.headR, 0, 6.2832); ctx.fill();
}
function distToSeg(px, py, a, b) {
  var dx = b.x - a.x, dy = b.y - a.y;
  var L2 = dx * dx + dy * dy;
  var u = L2 > 0 ? clamp(((px - a.x) * dx + (py - a.y) * dy) / L2, 0, 1) : 0;
  var ex = a.x + dx * u - px, ey = a.y + dy * u - py;
  return Math.sqrt(ex * ex + ey * ey);
}
function pointInFigure(px, py, fp) {
  var dh = Math.sqrt((px - fp.head.x) * (px - fp.head.x) + (py - fp.head.y) * (py - fp.head.y));
  if (dh < fp.headR * 1.05) return true;
  for (var i = 0; i < FIG_SEGS.length; i++) {
    if (distToSeg(px, py, fp[FIG_SEGS[i][0]], fp[FIG_SEGS[i][1]]) < fp.thick * 1.05) return true;
  }
  return false;
}

// ---------- cell 1: DETECTION ----------
function detTargetPos(tg, t, w, h) {
  return {
    x: (0.5 + tg.ax * Math.sin(tg.fx * 6.2832 * t + tg.px)) * w,
    y: (0.5 + tg.ay * Math.sin(tg.fy * 6.2832 * t + tg.py)) * h
  };
}
function drawDetection(w, h, t) {
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
  for (var i = 0; i < P.det.targets.length; i++) {
    var tg = P.det.targets[i];
    var now = detTargetPos(tg, t, w, h);
    var then = detTargetPos(tg, Math.max(0, t - tunes.detLag), w, h); // the box hunts where it was
    ctx.fillStyle = WHITE;
    ctx.beginPath(); ctx.arc(now.x, now.y, Math.max(1.6, w * 0.008), 0, 6.2832); ctx.fill();
    var bw = tg.size * w, bh = tg.size * h * 0.86;
    ctx.strokeStyle = CYAN; ctx.lineWidth = 1.4;
    ctx.strokeRect(then.x - bw / 2, then.y - bh / 2, bw, bh);
    ctx.strokeStyle = WHITE; ctx.lineWidth = 1.6;
    var c = Math.min(bw, bh) * 0.24, x0 = then.x - bw / 2, y0 = then.y - bh / 2, x1 = then.x + bw / 2, y1 = then.y + bh / 2;
    ctx.beginPath();
    ctx.moveTo(x0, y0 + c); ctx.lineTo(x0, y0); ctx.lineTo(x0 + c, y0);
    ctx.moveTo(x1 - c, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0 + c);
    ctx.moveTo(x1, y1 - c); ctx.lineTo(x1, y1); ctx.lineTo(x1 - c, y1);
    ctx.moveTo(x0 + c, y1); ctx.lineTo(x0, y1); ctx.lineTo(x0, y1 - c);
    ctx.stroke();
  }
}

// ---------- cell 2: PEOPLE-MASKS ----------
function drawMasks(w, h, t) {
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
  var shades = [WHITE, GRAY, '#C9CBC4'];
  for (var i = 0; i < P.masks.figs.length; i++) {
    var f = P.masks.figs[i];
    var tt = t * tunes.maskRate;
    var cx = (0.5 + f.ax * Math.sin(f.fx * 6.2832 * tt + f.px)) * w;
    var cy = (0.52 + f.ay * Math.sin(f.fy * 6.2832 * tt + f.py)) * h + Math.sin(tt * 1.3 + f.bob) * h * 0.012;
    drawFigure(figurePoints(cx, cy, f.sc * Math.min(w, h) * 1.9, tt, f.px), shades[f.shade]);
  }
}

// ---------- cell 3: AD-SLOT MASKS ----------
function drawSlots(w, h, t) {
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
  for (var i = 0; i < P.slots.rects.length; i++) {
    var rc = P.slots.rects[i];
    var ph = ((t * tunes.slotRate / rc.per) + rc.off) % 1;
    var a = 0;
    if (ph < 0.10) a = ph / 0.10; else if (ph < 0.62) a = 1; else if (ph < 0.78) a = 1 - (ph - 0.62) / 0.16;
    if (a <= 0) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = WHITE;
    ctx.fillRect(rc.x * w, rc.y * h, rc.w * w, rc.h * h);
    ctx.globalAlpha = a * 0.55;
    ctx.fillStyle = GRAY;
    ctx.fillRect(rc.x * w + 3, rc.y * h + 3, rc.w * w - 6, rc.h * h - 6);
    ctx.globalAlpha = 1;
  }
}

// ---------- cell 4: HALFTONE ----------
function drawHalftone(w, h, t) {
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
  var pitch = (PHONE ? 13 : 11) * tunes.halfPitch;
  var cx = (0.5 + 0.26 * Math.sin(P.halftone.fx * 6.2832 * t + P.halftone.px)) * w;
  var cy = (0.5 + 0.26 * Math.sin(P.halftone.fy * 6.2832 * t + P.halftone.py)) * h;
  var maxD = Math.sqrt(w * w + h * h) * 0.55;
  ctx.fillStyle = WHITE;
  for (var y = pitch / 2; y < h; y += pitch) {
    for (var x = pitch / 2; x < w; x += pitch) {
      var d = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy));
      var v = 0.5 + 0.5 * Math.sin(d / maxD * 12.0 - t * 1.7);
      var rr = pitch * 0.46 * v * v;
      if (rr < 0.3) continue;
      ctx.globalAlpha = 0.25 + 0.75 * v;
      ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- cell 5: GLITCH ----------
var GLITCH_COLS = [CYAN, RED, MAG, WHITE];
function drawGlitchField(w, h, t, seedOff, blockScale, cxFrac, cyFrac, figScale) {
  var cx = (cxFrac + 0.05 * Math.sin(0.31 * t + P.glitch.px)) * w;
  var cy = (cyFrac + 0.04 * Math.sin(0.23 * t + P.glitch.py)) * h;
  var fp = figurePoints(cx, cy, figScale * Math.min(w, h), t * 0.8, 1.3);
  var tfp = { head: fp.head, headR: fp.headR * 1.5, neck: fp.neck, hip: fp.hip, elL: fp.elL, haL: fp.haL, elR: fp.elR, haR: fp.haR, knL: fp.knL, ftL: fp.ftL, knR: fp.knR, ftR: fp.ftR, thick: fp.thick * 1.9 };
  var bs = Math.max(4, Math.min(w, h) / 13) * blockScale;
  var tick = Math.floor(t * 7);
  for (var by = 0; by * bs < h; by++) {
    for (var bx = 0; bx * bs < w; bx++) {
      var px = bx * bs + bs / 2, py = by * bs + bs / 2;
      if (!pointInFigure(px, py, tfp)) continue;
      var hv = hash2(bx * 7 + seedOff, by * 13 + tick * 101);
      if (hv < 0.16) continue; // chewed away entirely this tick
      var col = GLITCH_COLS[Math.floor(hash2(bx + seedOff, by + tick * 57) * GLITCH_COLS.length) % GLITCH_COLS.length];
      var ox = (hash2(bx + tick, by + seedOff) - 0.5) * bs * 0.5;
      var oy = (hash2(bx + seedOff, by + tick) - 0.5) * bs * 0.5;
      ctx.globalAlpha = 0.55 + 0.45 * hv;
      ctx.fillStyle = col;
      ctx.fillRect(bx * bs + ox, by * bs + oy, bs * 0.92, bs * 0.92);
    }
  }
  ctx.globalAlpha = 1;
}
function drawGlitch(w, h, t) {
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
  drawGlitchField(w, h, t, P.glitch.seed, tunes.glitchBlock, 0.5, 0.52, 0.82);
}

// ---------- cell 6: DEPTH ----------
function drawDepth(w, h, t) {
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
  var tt = t * tunes.depthRate;
  for (var i = 0; i < P.depth.blobs.length; i++) {
    var b = P.depth.blobs[i];
    var cx = (b.x + b.ax * Math.sin(b.fx * 6.2832 * tt + b.ph)) * w;
    var cy = (b.y + b.ay * Math.sin(b.fy * 6.2832 * tt + b.ph * 1.7)) * h;
    var R = b.rad * Math.min(w, h) * (1 + 0.10 * Math.sin(tt * 0.4 + b.ph));
    var g = Math.round(40 + b.val * 190);
    // layered flat-alpha ellipses fake the soft wash (no gradients allowed)
    for (var k = 5; k >= 1; k--) {
      ctx.globalAlpha = 0.10;
      ctx.fillStyle = 'rgb(' + g + ',' + g + ',' + g + ')';
      ctx.beginPath(); ctx.ellipse(cx, cy, R * k / 5, R * 0.78 * k / 5, 0, 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- cell 7: SEGMENTATION ----------
function drawSeg(w, h, t) {
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
  var tt = t * tunes.segRate;
  var cols = PHONE ? 6 : 7, rows = 5;
  var cw = w / cols, ch = h / rows;
  var cs = [];
  for (var i = 0; i < P.seg.centres.length; i++) {
    var c = P.seg.centres[i];
    cs.push({
      x: (0.5 + c.ax * Math.sin(c.fx * 6.2832 * tt + c.px)) * w,
      y: (0.5 + c.ay * Math.sin(c.fy * 6.2832 * tt + c.py)) * h,
      col: c.col, reach: c.reach * Math.min(w, h)
    });
  }
  for (var by = 0; by < rows; by++) {
    for (var bx = 0; bx < cols; bx++) {
      var px = (bx + 0.5) * cw, py = (by + 0.5) * ch;
      var best = null, bd = 1e9;
      for (var j = 0; j < cs.length; j++) {
        var d = Math.sqrt((px - cs[j].x) * (px - cs[j].x) + (py - cs[j].y) * (py - cs[j].y));
        if (d < bd) { bd = d; best = cs[j]; }
      }
      ctx.fillStyle = (best && bd < best.reach) ? best.col : DIV;
      ctx.fillRect(bx * cw + 1, by * ch + 1, cw - 2, ch - 2);
    }
  }
}

// ---------- cell 8: INPAINT ----------
function drawInpaint(w, h, t) {
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
  var cols = 10, rows = 8, cw = w / cols, ch = h / rows;
  var cycT = P.inpaint.cyc / tunes.healSpeed;
  var k = Math.floor(t / cycT), lt = (t - k * cycT) / cycT;
  var hseed = P.inpaint.seed + k * 977;
  var hw = 3 + Math.floor(hash2(hseed, 1) * 2);           // hole size in cells
  var hh = 3 + Math.floor(hash2(hseed, 2) * 2);
  var hx = 1 + Math.floor(hash2(hseed, 3) * (cols - hw - 1));
  var hy = 1 + Math.floor(hash2(hseed, 4) * (rows - hh - 1));
  var heal = clamp((lt - 0.15) / 0.60, 0, 1);              // frontier sweeps inward
  var maxRing = Math.ceil(Math.min(hw, hh) / 2);
  for (var by = 0; by < rows; by++) {
    for (var bx = 0; bx < cols; bx++) {
      var g = 0.16 + hash2(bx * 3 + P.inpaint.seed, by * 5) * 0.30;
      var inHole = bx >= hx && bx < hx + hw && by >= hy && by < hy + hh;
      if (inHole) {
        var ring = Math.min(bx - hx, hx + hw - 1 - bx, by - hy, hy + hh - 1 - by);
        if (ring / maxRing <= heal) {
          // healed: texture returns, frontier cells flash white as they close
          var fresh = (ring / maxRing > heal - 0.18) ? 0.35 : 0;
          ctx.fillStyle = 'rgba(255,255,255,' + fresh + ')';
          ctx.fillRect(bx * cw + 1, by * ch + 1, cw - 2, ch - 2);
          ctx.fillStyle = 'rgba(138,141,132,' + g + ')';
          ctx.fillRect(bx * cw + 1, by * ch + 1, cw - 2, ch - 2);
        } else {
          ctx.fillStyle = '#000000';
          ctx.fillRect(bx * cw + 1, by * ch + 1, cw - 2, ch - 2);
        }
      } else {
        ctx.fillStyle = 'rgba(138,141,132,' + g + ')';
        ctx.fillRect(bx * cw + 1, by * ch + 1, cw - 2, ch - 2);
      }
    }
  }
}

// ---------- cell 9: MASTER ----------
function drawMaster(w, h, t) {
  ctx.fillStyle = '#0A0B0E'; ctx.fillRect(0, 0, w, h);
  // counterfeit poster (pure shape, no text)
  ctx.fillStyle = MAG; ctx.fillRect(w * 0.06, h * 0.07, w * 0.36, h * 0.30);
  ctx.strokeStyle = WHITE; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(w * 0.06, h * 0.37); ctx.lineTo(w * 0.42, h * 0.07); ctx.stroke();
  ctx.beginPath(); ctx.arc(w * 0.24, h * 0.22, Math.min(w, h) * 0.07, 0, 6.2832); ctx.stroke();
  ctx.fillStyle = CYAN; ctx.fillRect(w * 0.10, h * 0.30, w * 0.12, h * 0.045);
  // two silhouettes, one tracked by a box, glitch confined to both
  var fp1 = figurePoints(w * 0.66, h * 0.56, Math.min(w, h) * 0.78, t, 0.7);
  var fp2 = figurePoints(w * 0.30, h * 0.62, Math.min(w, h) * 0.64, t, 3.9);
  drawFigure(fp2, GRAY);
  drawFigure(fp1, WHITE);
  var bs = Math.max(3, Math.min(w, h) / 22) * tunes.masterGlitch;
  var tick = Math.floor(t * 7);
  var figs = [fp1, fp2];
  for (var by = 0; by * bs < h; by++) {
    for (var bx = 0; bx * bs < w; bx++) {
      var px = bx * bs + bs / 2, py = by * bs + bs / 2;
      if (!pointInFigure(px, py, figs[0]) && !pointInFigure(px, py, figs[1])) continue;
      var hv = hash2(bx * 11 + P.master.seed, by * 7 + tick * 89);
      if (hv < 0.35) continue;
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = GLITCH_COLS[Math.floor(hash2(bx + P.master.seed, by + tick * 41) * 4) % 4];
      ctx.fillRect(bx * bs, by * bs, bs * 0.9, bs * 0.9);
    }
  }
  ctx.globalAlpha = 1;
  // tracking box on figure 1's head, honestly lagged
  var lagP = figurePoints(w * 0.66, h * 0.56, Math.min(w, h) * 0.78, Math.max(0, t - tunes.detLag), 0.7);
  ctx.strokeStyle = CYAN; ctx.lineWidth = 1.4;
  var bw = Math.min(w, h) * 0.30;
  ctx.strokeRect(lagP.head.x - bw / 2, lagP.head.y - bw * 0.42, bw, bw * 1.5);
}

var CELL_DRAW = [drawDetection, drawMasks, drawSlots, drawHalftone, drawGlitch, drawDepth, drawSeg, drawInpaint, drawMaster];
var CELL_FLARE = [
  function (t) { return flareAlpha(P.det.flareP, P.det.flareO, t); },
  function (t) { return flareAlpha(P.masks.flareP, P.masks.flareO, t); },
  function (t) { return flareAlpha(P.slots.flareP, P.slots.flareO, t); },
  function (t) { return flareAlpha(P.halftone.flareP, P.halftone.flareO, t); },
  function (t) { return flareAlpha(P.glitch.flareP, P.glitch.flareO, t); },
  function (t) { return flareAlpha(P.depth.flareP, P.depth.flareO, t); },
  function (t) { return flareAlpha(P.seg.flareP, P.seg.flareO, t); },
  function (t) { return flareAlpha(P.inpaint.cyc / tunes.healSpeed, P.inpaint.flareO + P.inpaint.cyc * 0.72, t); },
  function (t) { return flareAlpha(P.master.flareP, P.master.flareO, t); }
];

// ---------- composition ----------
var curT = T0;
var soloIdx = -1, soloUntil = -1;
function drawCell(idx, x, y, w, h, t) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.translate(x, y);
  CELL_DRAW[idx](w, h, t);
  ctx.restore();
  var fa = CELL_FLARE[idx](t);
  if (idx === 8) { // master carries a slightly brighter resting border
    ctx.strokeStyle = GRAY; ctx.globalAlpha = 0.55; ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    ctx.globalAlpha = 1;
  }
  if (fa > 0.01) {
    ctx.strokeStyle = WHITE; ctx.globalAlpha = Math.min(0.9, fa); ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    ctx.globalAlpha = 1;
  }
}
function draw(t) {
  curT = t;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.fillStyle = FIELD; ctx.fillRect(0, 0, VW, VH);
  if (soloIdx >= 0 && t < soloUntil) {
    drawCell(soloIdx, 0, 0, VW, VH, t);
    ctx.strokeStyle = DIV; ctx.lineWidth = 2; ctx.strokeRect(1, 1, VW - 2, VH - 2);
    return;
  }
  soloIdx = -1;
  var cw = VW / 3, ch = VH / 3;
  for (var i = 0; i < 9; i++) {
    drawCell(i, (i % 3) * cw, Math.floor(i / 3) * ch, cw, ch, t);
  }
  ctx.strokeStyle = DIV; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cw, 0); ctx.lineTo(cw, VH);
  ctx.moveTo(cw * 2, 0); ctx.lineTo(cw * 2, VH);
  ctx.moveTo(0, ch); ctx.lineTo(VW, ch);
  ctx.moveTo(0, ch * 2); ctx.lineTo(VW, ch * 2);
  ctx.stroke();
}

// ---------- audio (lazy, gesture-gated, guarded) ----------
var AC = null, voiceGains = [];
function ensureAudio() {
  if (AC) return;
  if (typeof window === 'undefined') return;
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  try {
    AC = new Ctor();
    var master = AC.createGain(); master.gain.value = 0.16; master.connect(AC.destination);
    var freqs = [1240, 220, 520, 330, 140, 90, 440, 660, 262];
    for (var i = 0; i < 9; i++) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = i === 4 ? 'sawtooth' : (i === 5 ? 'sine' : 'triangle');
      o.frequency.value = freqs[i];
      g.gain.value = 0;
      o.connect(g); g.connect(master); o.start();
      voiceGains.push(g);
    }
    voiceGains[8].gain.value = 0.05; // the master cell's mix sits under everything
  } catch (e) { AC = null; }
}
function audioTick(t) {
  if (!AC) return;
  for (var i = 0; i < 9; i++) {
    if (!voiceGains[i]) continue;
    var target = 0;
    if (i === 8) target = 0.05;
    else if (CELL_FLARE[i](t) > 0.25) target = 0.05;
    if (tuneCell === i) target = Math.max(target, 0.07);
    voiceGains[i].gain.setTargetAtTime(target, AC.currentTime, 0.09);
  }
}

// ---------- interaction ----------
var tuneCell = -1;
var pDown = null, lastTap = null;
function cellAt(x, y) {
  if (soloIdx >= 0) return soloIdx;
  var cx = Math.min(2, Math.floor(x / (VW / 3))), cy = Math.min(2, Math.floor(y / (VH / 3)));
  return cy * 3 + cx;
}
function applyTune(idx, dxTotal) {
  var u = clamp(dxTotal / 260, -1, 1);
  if (idx === 0) tunes.detLag = clamp(0.35 - u * 0.30, 0.05, 0.9);
  else if (idx === 1) tunes.maskRate = clamp(1 + u * 0.8, 0.3, 2.2);
  else if (idx === 2) tunes.slotRate = clamp(1 + u * 0.9, 0.3, 2.4);
  else if (idx === 3) tunes.halfPitch = clamp(1 - u * 0.45, 0.55, 1.8);
  else if (idx === 4) tunes.glitchBlock = clamp(1 + u * 0.9, 0.45, 2.2);
  else if (idx === 5) tunes.depthRate = clamp(1 + u * 0.9, 0.25, 2.4);
  else if (idx === 6) tunes.segRate = clamp(1 + u * 1.1, 0.25, 2.6);
  else if (idx === 7) tunes.healSpeed = clamp(1 + u * 1.1, 0.3, 2.6);
  else if (idx === 8) tunes.masterGlitch = clamp(1 + u * 0.9, 0.45, 2.2);
}
function onDown(x, y) {
  ensureAudio();
  if (AC && AC.resume) AC.resume();
  pDown = { x: x, y: y, cell: cellAt(x, y), dragged: false };
  tuneCell = pDown.cell;
}
function onMove(x, y) {
  if (!pDown) return;
  var dx = x - pDown.x, dy = y - pDown.y;
  if (Math.abs(dx) + Math.abs(dy) > 7) pDown.dragged = true;
  if (pDown.dragged) applyTune(pDown.cell, dx);
}
function onUp(x, y, ts) {
  if (!pDown) return;
  var wasDrag = pDown.dragged, cell = pDown.cell;
  pDown = null; tuneCell = -1;
  if (wasDrag) return;
  if (lastTap && ts - lastTap.ts < 350 && lastTap.cell === cell) {
    // double-tap: new feed
    baseSeed += 7919;
    P = genParams(baseSeed);
    tunes = defaultTunes();
    soloIdx = -1; soloUntil = -1;
    lastTap = null;
    return;
  }
  lastTap = { ts: ts, cell: cell };
  if (soloIdx === cell) { soloIdx = -1; soloUntil = -1; }
  else { soloIdx = cell; soloUntil = curT + 10; }
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY); });
  canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
  canvas.addEventListener('pointerup', function (e) { onUp(e.clientX, e.clientY, e.timeStamp || 0); });
  canvas.addEventListener('pointercancel', function () { pDown = null; tuneCell = -1; });
}

// ---------- main loop ----------
var startTs = null;
function frame(ts) {
  var t = T0;
  if (typeof ts === 'number') {
    if (startTs === null) startTs = ts;
    t = T0 + (ts - startTs) / 1000;
  }
  draw(t);
  audioTick(t);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
draw(T0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
</script>
</body>
