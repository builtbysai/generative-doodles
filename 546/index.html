<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nine Small Dooms</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #E0532F; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (strict): cat black, eye yellow, nose red, ground orange-red,
  // triangle green, brick green, vignette yellow / blue / teal. Flat fills
  // only, no gradients. WHITE appears only where the visual spec demands it:
  // the smoke pouring from the open door, the cigarette smoke, and the small
  // ghost (see process.md deviations).
  var INK = '#111111', YELLOW = '#FFD400', RED = '#E63B2B', GROUND = '#E0532F',
      TRI = '#1E9E6A', BRICK = '#2AA37A', BLUE = '#00AEEF', TEAL = '#2AA5C4',
      WHITE = '#FFFFFF';

  var LOOP = 30;      // seconds per seamless loop
  var PHASE0 = 3.0;   // constant first-frame phase: eyes open, mid-drift

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(546066);

  // ---- stipple: precomputed seeded dot field over the ground ----
  var STIPPLE = [];
  for (var i = 0; i < 300; i++) {
    STIPPLE.push([rng() * 1080, rng() * 1080, 1.6 + rng() * 2.2]);
  }

  function outline(lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw || 6; ctx.stroke(); }
  function circ(x, y, r, fill) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  }
  function ell(x, y, rx, ry, fill) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  }

  // ================= the cat =================
  function drawCat(t) {
    var cyc = t % LOOP;
    // one slow blink per loop, near the end of the cycle
    var b = 0;
    if (cyc > 26 && cyc < 28.2) b = Math.sin((cyc - 26) / 2.2 * Math.PI);
    var eyeOpen = 1 - 0.92 * b;

    ctx.save();
    ctx.translate(540, 268);
    // ears
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(-218, -120); ctx.lineTo(-168, -268); ctx.lineTo(-52, -176);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(218, -120); ctx.lineTo(168, -268); ctx.lineTo(52, -176);
    ctx.closePath(); ctx.fill();
    // head
    circ(0, 0, 252, INK);
    // eyes: yellow almonds with black slit pupils, blink = vertical squash
    [-118, 118].forEach(function (ex) {
      ctx.save();
      ctx.translate(ex, -18);
      ctx.scale(1, Math.max(0.08, eyeOpen));
      ell(0, 0, 52, 34, YELLOW);
      ell(0, 0, 52, 34, null); outline(5);
      ell(0, 0, 7, 24, INK);
      ctx.restore();
    });
    // nose
    ctx.fillStyle = RED;
    ctx.beginPath();
    ctx.moveTo(-30, 62); ctx.lineTo(30, 62); ctx.lineTo(0, 96);
    ctx.closePath(); ctx.fill(); outline(5);
    // mouth line under the nose
    ctx.strokeStyle = INK; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(0, 96); ctx.lineTo(0, 116); ctx.stroke();
    ctx.restore();
  }

  // ================= vignette scenes (local space, circle r = 118) =================
  // 1. parrot on a soda can beside a small ghost. Micro: parrot bobs, ghost drifts.
  function sceneParrot(t) {
    // soda can
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.rect(-72, 6, 62, 92); ctx.fill(); outline(6);
    ctx.fillStyle = TEAL;
    ctx.fillRect(-72, 30, 62, 16);
    ell(-41, 6, 31, 8, TEAL); outline(5);
    // parrot, bobbing on the can
    var bob = Math.sin(t / LOOP * Math.PI * 2 * 2) * 5;
    ctx.save();
    ctx.translate(-41, bob);
    ell(0, -34, 26, 36, TRI); outline(6);            // body
    circ(6, -76, 21, TRI); outline(6);               // head
    ctx.fillStyle = RED;                              // beak
    ctx.beginPath();
    ctx.moveTo(24, -82); ctx.lineTo(46, -72); ctx.lineTo(24, -62);
    ctx.closePath(); ctx.fill(); outline(4);
    circ(10, -80, 4.5, INK);                          // eye
    ctx.strokeStyle = BLUE; ctx.lineWidth = 9;        // tail feathers
    ctx.beginPath(); ctx.moveTo(-16, -2); ctx.lineTo(-30, 34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(-8, 38); ctx.stroke();
    ctx.restore();
    // small ghost, drifting
    var gx = 62 + Math.sin(t / LOOP * Math.PI * 2 + 1.3) * 7;
    var gy = -18 + Math.cos(t / LOOP * Math.PI * 2 * 2 + 0.6) * 5;
    ctx.save();
    ctx.translate(gx, gy);
    ctx.fillStyle = WHITE;
    ctx.beginPath();
    ctx.moveTo(-24, 34);
    ctx.lineTo(-24, -8);
    ctx.quadraticCurveTo(-24, -38, 0, -38);
    ctx.quadraticCurveTo(24, -38, 24, -8);
    ctx.lineTo(24, 34);
    ctx.lineTo(12, 24); ctx.lineTo(0, 34); ctx.lineTo(-12, 24);
    ctx.closePath(); ctx.fill(); outline(5);
    circ(-9, -12, 4.5, INK); circ(9, -12, 4.5, INK);
    ell(0, 2, 5, 7, INK);
    ctx.restore();
  }

  // 2. palm tree on yellow. Micro: fronds sway.
  function scenePalm(t) {
    var sway = Math.sin(t / LOOP * Math.PI * 2) * 0.07;
    // trunk
    ctx.strokeStyle = BRICK; ctx.lineWidth = 17; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, 104); ctx.quadraticCurveTo(2, 30, 10, -18); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-14, 60); ctx.lineTo(16, 54); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-11, 22); ctx.lineTo(19, 16); ctx.stroke();
    // fronds
    ctx.save();
    ctx.translate(10, -22);
    ctx.rotate(sway);
    ctx.strokeStyle = TRI; ctx.lineWidth = 13;
    var fr = [[-78, -34], [-52, -58], [0, -70], [54, -56], [80, -30]];
    for (var i = 0; i < fr.length; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(fr[i][0] * 0.55, fr[i][1] - 14, fr[i][0], fr[i][1] + 16);
      ctx.stroke();
    }
    ctx.restore();
    // coconuts
    circ(-2, -12, 10, INK); circ(18, -6, 9, INK);
    // ground tuft
    ell(0, 106, 74, 12, TRI);
  }

  // 3. smoking man crouched on blue tile. Micro: cigarette smoke curls rise.
  function sceneSmoker(t) {
    // tile lines
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    for (var gx = -88; gx <= 88; gx += 44) {
      ctx.beginPath(); ctx.moveTo(gx, -118); ctx.lineTo(gx, 118); ctx.stroke();
    }
    for (var gy = -88; gy <= 88; gy += 44) {
      ctx.beginPath(); ctx.moveTo(-118, gy); ctx.lineTo(118, gy); ctx.stroke();
    }
    // crouched figure, black silhouette
    ctx.fillStyle = INK;
    ell(-16, 44, 52, 40, INK);                        // haunch
    ctx.save();
    ctx.translate(-6, -6); ctx.rotate(0.5);
    ell(0, 0, 30, 52, INK);                            // torso leaning
    ctx.restore();
    circ(28, -56, 25, INK);                            // head
    ctx.strokeStyle = INK; ctx.lineWidth = 13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(18, -22); ctx.lineTo(58, 6); ctx.stroke();  // arm
    ctx.beginPath(); ctx.moveTo(-34, 74); ctx.lineTo(38, 88); ctx.stroke(); // leg
    // cigarette + rising smoke curls
    circ(60, 8, 4, RED);
    ctx.fillStyle = WHITE;
    for (var i = 0; i < 3; i++) {
      var p = ((t / 5) + i / 3) % 1;
      var sx = 60 + Math.sin(p * 5 + i * 2.1) * 9;
      var sy = -2 - p * 74;
      ctx.globalAlpha = 0.95 * (1 - p);
      circ(sx, sy, 5 + p * 8, WHITE);
    }
    ctx.globalAlpha = 1;
  }

  // 4. duck face with red flame eyes. Micro: flames flicker (flat shape swap).
  function sceneDuck(t) {
    circ(0, 2, 84, YELLOW); outline(7);
    // bill
    ell(0, 34, 44, 20, RED); outline(5);
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-44, 32); ctx.lineTo(44, 32); ctx.stroke();
    // flame eyes: two sizes swapped on a fixed step clock
    var big = (Math.floor(t * 2.2) % 2 === 0);
    [-36, 36].forEach(function (ex) {
      var s = big ? 1 : 0.78;
      ctx.save();
      ctx.translate(ex, -26); ctx.scale(s, s);
      ctx.fillStyle = RED;
      ctx.beginPath();
      ctx.moveTo(0, -26);
      ctx.quadraticCurveTo(15, -6, 11, 8);
      ctx.quadraticCurveTo(8, 20, 0, 22);
      ctx.quadraticCurveTo(-8, 20, -11, 8);
      ctx.quadraticCurveTo(-15, -6, 0, -26);
      ctx.closePath(); ctx.fill(); outline(4);
      ctx.restore();
    });
  }

  // 5. doner kebab with a smiley face, carved by a cook. Micro: kebab stripes
  //    cycle (rotation), cook's knife slices up and down.
  function sceneKebab(t) {
    // spit
    ctx.strokeStyle = INK; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-18, -104); ctx.lineTo(-18, 96); ctx.stroke();
    // meat stack: stacked ellipses, stripes drift downward = rotation
    var off = (t / 3) % 1;
    for (var i = 0; i < 6; i++) {
      var yy = -78 + i * 30;
      ell(-18, yy, 40 - Math.abs(i - 2.5) * 4, 17, (i % 2 === 0) ? RED : GROUND);
      outline(4);
    }
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    for (var k = 0; k < 3; k++) {
      var sy2 = -84 + ((off * 3 + k * 30) % 90);
      ctx.beginPath(); ctx.moveTo(-52, sy2); ctx.lineTo(16, sy2); ctx.stroke();
    }
    // smiley on the meat
    circ(-30, -34, 4.5, INK); circ(-8, -34, 4.5, INK);
    ctx.strokeStyle = INK; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.arc(-19, -22, 11, 0.25, Math.PI - 0.25); ctx.stroke();
    // cook at the right: head, cap, arm with knife
    circ(74, -64, 24, TEAL); outline(6);
    ctx.fillStyle = WHITE;
    ctx.beginPath(); ctx.rect(50, -96, 48, 14); ctx.fill(); outline(4);
    circ(68, -68, 4, INK); circ(84, -68, 4, INK);
    var slice = Math.sin(t / LOOP * Math.PI * 2 * 5) * 16;
    ctx.save();
    ctx.translate(0, slice);
    ctx.strokeStyle = INK; ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(66, -38); ctx.lineTo(30, -6); ctx.stroke(); // arm
    ctx.fillStyle = BLUE;                              // knife blade
    ctx.beginPath();
    ctx.moveTo(32, -14); ctx.lineTo(6, 16); ctx.lineTo(20, 22); ctx.lineTo(40, -4);
    ctx.closePath(); ctx.fill(); outline(4);
    ctx.restore();
    // tray
    ell(-16, 102, 62, 10, TEAL); outline(4);
  }

  // 6. open door pouring white smoke. Micro: smoke puffs rise and wrap.
  function sceneOpenDoor(t) {
    // dark opening
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.rect(-56, -96, 96, 196); ctx.fill();
    // door slab, ajar
    ctx.save();
    ctx.translate(40, 0); ctx.transform(0.62, 0, -0.18, 1, 0, 0);
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.rect(0, -96, 62, 196); ctx.fill(); outline(6);
    circ(14, 0, 6, YELLOW);
    ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.rect(-56, -96, 96, 196); ctx.stroke();
    // smoke
    ctx.fillStyle = WHITE;
    for (var i = 0; i < 5; i++) {
      var p = ((t / 6) + i / 5) % 1;
      var sx = -30 + Math.sin(p * 4.4 + i * 1.7) * 16 - p * 22;
      var sy = 66 - p * 178;
      ctx.globalAlpha = 0.95 * (1 - p * 0.75);
      ell(sx, sy, 15 + p * 24, 11 + p * 16, WHITE);
    }
    ctx.globalAlpha = 1;
  }

  // 7. closed blue door with a tiny table. Micro: table lamp pulses.
  function sceneClosedDoor(t) {
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.rect(-78, -98, 92, 198); ctx.fill(); outline(7);
    ctx.beginPath(); ctx.rect(-64, -84, 64, 74); ctx.stroke();
    ctx.beginPath(); ctx.rect(-64, 6, 64, 80); ctx.stroke();
    circ(-14, 0, 7, YELLOW); outline(3);
    // tiny table beside the door
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(38, 34); ctx.lineTo(102, 34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(46, 34); ctx.lineTo(46, 100); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(94, 34); ctx.lineTo(94, 100); ctx.stroke();
    // lamp on the table, pulsing on the shared clock
    var pulse = 0.5 + 0.5 * Math.sin(t / LOOP * Math.PI * 2 * 2);
    circ(70, 16, 8 + pulse * 4, YELLOW); outline(3);
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(70, 26); ctx.lineTo(70, 34); ctx.stroke();
  }

  // vignette registry: base centre, ground, scene, orbit cycles / phase
  var VIG = [
    { x: 168, y: 566, g: TEAL,   fn: sceneParrot,    cyc: 1, ph: 0.0 },
    { x: 404, y: 626, g: YELLOW, fn: scenePalm,      cyc: 2, ph: 1.1 },
    { x: 652, y: 646, g: BLUE,   fn: sceneSmoker,    cyc: 1, ph: 2.2 },
    { x: 892, y: 584, g: TEAL,   fn: sceneDuck,      cyc: 2, ph: 3.3 },
    { x: 272, y: 842, g: YELLOW, fn: sceneKebab,     cyc: 1, ph: 4.1 },
    { x: 542, y: 868, g: TEAL,   fn: sceneOpenDoor,  cyc: 2, ph: 5.0 },
    { x: 812, y: 846, g: BLUE,   fn: sceneClosedDoor, cyc: 1, ph: 5.9 }
  ];
  var VR = 118;

  function drawVignette(v, t) {
    var w = Math.PI * 2 * v.cyc * t / LOOP;
    var cx = v.x + Math.cos(w + v.ph) * 12;
    var cy = v.y + Math.sin(w + v.ph * 1.7) * 9;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, VR, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = v.g;
    ctx.fillRect(cx - VR, cy - VR, VR * 2, VR * 2);
    ctx.translate(cx, cy);
    v.fn(t);
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, VR, 0, Math.PI * 2);
    ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.stroke();
  }

  // ================= scene =================
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    // stipple
    ctx.fillStyle = INK;
    for (var i = 0; i < STIPPLE.length; i++) {
      ctx.beginPath();
      ctx.arc(STIPPLE[i][0], STIPPLE[i][1], STIPPLE[i][2], 0, Math.PI * 2);
      ctx.fill();
    }

    // green triangle behind the cat and the band
    ctx.fillStyle = TRI;
    ctx.beginPath();
    ctx.moveTo(540, 318); ctx.lineTo(120, 640); ctx.lineTo(960, 640);
    ctx.closePath(); ctx.fill(); outline(7);

    // brick band across the middle (clipped to the stage: the stagger
    // pattern would otherwise paint one stray line into the letterbox)
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 556, 1080, 108); ctx.clip();
    ctx.fillStyle = BRICK;
    ctx.fillRect(0, 556, 1080, 108);
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, 556); ctx.lineTo(1080, 556); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 664); ctx.lineTo(1080, 664); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 610); ctx.lineTo(1080, 610); ctx.stroke();
    for (var bx = 0; bx <= 1080; bx += 120) {
      ctx.beginPath(); ctx.moveTo(bx + 60, 556); ctx.lineTo(bx + 60, 610); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx, 610); ctx.lineTo(bx, 664); ctx.stroke();
    }
    ctx.restore();

    drawCat(t);

    for (var j = 0; j < VIG.length; j++) drawVignette(VIG[j], t);

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground = the orange-red) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      S = W;
      OX = 0; OY = (H - S) / 2;
    } else {
      S = Math.min(W, H);
      OX = (W - S) / 2; OY = (H - S) / 2;
    }
    draw(simT);
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
