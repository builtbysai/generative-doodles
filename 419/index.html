<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.419 Funk My Life</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFC0E8; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.419 Funk My Life (kittyo.illustration, EXPANSION #45).
// After Kitty O'Rourke's 2022 #facetober retro-funk
// poster: a Black woman with a huge afro, square
// glasses and oversized flower earrings, chin up and
// confident, inside a light-pink gig-poster frame on a
// dark plum ground. The words FUNK MY LIFE arch over
// her in big hand-lettered caps, cream with a pink
// shadow; psychedelic dots and swirls fill the plum
// around her and the star dots twinkle. WATCH-ONLY,
// one 30s seamless loop: the lettering grooves on a
// slow pulse, the flower earrings swing as pendulums
// on a 2s period, the afro bounces barely, the stars
// twinkle on whole cycles. No signature (she does not
// sign these) and no text beyond the lettering.
// The lettering is per-letter PATH DATA: every glyph
// is a table of filled polygons drawn fresh on the one
// canvas each frame along the arc, the groove pulse
// applied as a group scale. Never drawn once to an
// offscreen canvas, never a system font. The specced
// 4s pulse period is resolved to 8 whole cycles per
// 30s loop (3.75s), the nearest whole-cycle period, so
// the loop seam is exact. Frame one is drawn at the
// constant phase T = 7.3s (earrings mid-swing, poster
// complete); the clock is anchored there and advances
// in fixed 1/60 ticks, never from a wall clock. Flat
// colour only, one canvas, no offscreen canvas, no
// gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Ground dark plum; star dots yellow; frame light
// pink; skin deep brown; afro black with a purple
// highlight; glasses mustard; earrings pink and
// orange; top teal; lettering cream with a pink
// shadow; pattern dots pink, yellow and sky. Nothing
// else. Black outlines on every shape.
var PLUM = '#2A0E2E', STAR = '#FFE066', FRAME = '#FFC0E8';
var SKIN = '#6B3A1F', AFRO = '#1A1A1A', PURPLE = '#7B2D8E';
var MUSTARD = '#D9A419', EPINK = '#FF4FA3', EORANGE = '#F26A1B';
var TEAL = '#2A9D8F', CREAM = '#FFF6E8', PDOT = '#FF9ECF', SKY = '#7BCEEB';
var INK = '#1A1A1A';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 30;
if (LOOP !== 30) throw new Error('Funk My Life loop must be 30s');
var TICK = 1 / 60;
var FRAMEW = 54; // frame border: 6% of the 900 short side

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
function makeRng(seedStart) {
  var s = seedStart;
  return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// Star dots: exactly 90 asserted, scattered over the
// plum interior. Each twinkles on a whole number of
// cycles per 30s loop (2, 3 or 4) with a fixed phase,
// so every star is exactly home at the seam. A quarter
// of them are drawn as four-point sparkles.
var rngStar = makeRng(41990);
var STARS = [];
for (var si = 0; si < 90; si++) {
  STARS.push({
    x: 84 + rngStar() * 1112, y: 84 + rngStar() * 732,
    r: 2.2 + rngStar() * 2.6,
    cyc: 2 + Math.floor(rngStar() * 3),
    ph: rngStar() * Math.PI * 2,
    spark: si % 4 === 0
  });
}
if (STARS.length !== 90) throw new Error('stars must be exactly 90');

// Psychedelic swirls: exactly 12 asserted, fixed table
// positions around the figure, stroked spirals in pink
// and sky, alternating.
var SWIRLS = [
  { x: 150, y: 480, r: 34, col: PDOT }, { x: 1130, y: 470, r: 34, col: SKY },
  { x: 175, y: 660, r: 27, col: SKY }, { x: 1105, y: 655, r: 27, col: PDOT },
  { x: 130, y: 300, r: 24, col: SKY }, { x: 1150, y: 295, r: 24, col: PDOT },
  { x: 250, y: 790, r: 22, col: PDOT }, { x: 1030, y: 790, r: 22, col: SKY },
  { x: 330, y: 415, r: 19, col: SKY }, { x: 950, y: 410, r: 19, col: PDOT },
  { x: 285, y: 590, r: 17, col: PDOT }, { x: 995, y: 585, r: 17, col: SKY }
];
if (SWIRLS.length !== 12) throw new Error('swirls must be exactly 12');

// Dot flowers: exactly 8 asserted. A centre dot with a
// ring of 8 dots, in the three pattern colours,
// turning very slowly on whole cycles per loop.
var RINGS = [
  { x: 218, y: 372, col: PDOT, cyc: 1 }, { x: 1062, y: 368, col: STAR, cyc: -1 },
  { x: 150, y: 565, col: STAR, cyc: -1 }, { x: 1132, y: 560, col: PDOT, cyc: 1 },
  { x: 352, y: 700, col: SKY, cyc: 1 }, { x: 928, y: 700, col: PDOT, cyc: -1 },
  { x: 395, y: 330, col: STAR, cyc: -1 }, { x: 885, y: 326, col: SKY, cyc: 1 }
];
if (RINGS.length !== 8) throw new Error('dot flowers must be exactly 8');

// ---- lettering: per-letter filled path data ------------
// Each glyph is a table of filled polygons in a unit
// box (x 0..w, y 0..140, cap top 0, baseline 140),
// hand-cut with slight wobbles. Drawn fresh each frame:
// translated onto the arc, rotated tangent to it,
// filled cream over a pink shadow offset, with a thin
// black outline. No font is ever used.
var GLYPHS = {
  'F': { w: 88, paths: [
    [[8, 8], [38, 5], [36, 135], [10, 137]],
    [[8, 8], [90, 3], [93, 26], [10, 29]],
    [[11, 62], [75, 59], [76, 82], [12, 84]] ] },
  'U': { w: 96, paths: [
    [[6, 5], [34, 4], [36, 90], [40, 110], [52, 119], [64, 110], [68, 90], [66, 4], [94, 5], [95, 94], [87, 119], [71, 133], [49, 137], [28, 132], [12, 117], [5, 93]] ] },
  'N': { w: 96, paths: [
    [[6, 135], [5, 6], [29, 5], [71, 88], [70, 5], [95, 6], [96, 135], [72, 135], [72, 50], [29, 135]] ] },
  'K': { w: 97, paths: [
    [[8, 6], [35, 4], [34, 135], [9, 137]],
    [[37, 64], [83, 3], [99, 6], [53, 68]],
    [[51, 63], [99, 132], [74, 136], [38, 77]] ] },
  'M': { w: 96, paths: [
    [[6, 135], [5, 6], [29, 5], [50, 56], [71, 5], [95, 6], [96, 135], [72, 135], [72, 52], [51, 93], [29, 52], [30, 135]] ] },
  'Y': { w: 96, paths: [
    [[4, 5], [30, 4], [51, 45], [71, 4], [96, 5], [64, 73], [64, 135], [37, 135], [37, 73]] ] },
  'L': { w: 92, paths: [
    [[8, 6], [36, 4], [35, 109], [91, 107], [93, 133], [9, 136]] ] },
  'I': { w: 84, paths: [
    [[16, 5], [83, 3], [84, 25], [17, 27]],
    [[36, 25], [64, 24], [63, 111], [37, 112]],
    [[15, 111], [84, 111], [85, 134], [16, 136]] ] },
  'E': { w: 94, paths: [
    [[8, 7], [93, 3], [95, 25], [34, 27], [34, 57], [79, 55], [80, 78], [34, 80], [35, 109], [95, 107], [96, 132], [9, 136]] ] }
};
var TITLE = 'FUNK MY LIFE';
var LSCALE = 0.84;              // glyph units to design px
var ARC_CX = 640, ARC_CY = 975, ARC_R = 790;
// Total advance of the title along the arc, and a
// per-letter fixed tilt for the hand-set feel.
var TITLE_ADV = [];
(function () {
  var total = 0;
  for (var i = 0; i < TITLE.length; i++) {
    var ch = TITLE[i];
    var adv = ch === ' ' ? 58 : (GLYPHS[ch].w + 19) * LSCALE;
    TITLE_ADV.push(adv); total += adv;
  }
  TITLE_ADV.total = total;
})();
var TILT = [-0.03, 0.02, -0.015, 0.03, 0, -0.025, 0.02, 0, 0.015, -0.02, 0.03, -0.01, 0.02];

function poly(pts, fill, stroke, lw) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.lineJoin = 'round'; ctx.stroke(); }
}

function drawGlyph(ch, col, stroke) {
  var g = GLYPHS[ch];
  for (var i = 0; i < g.paths.length; i++) poly(g.paths[i], col, stroke, 3.2);
}

// The whole title, redrawn from path data every frame.
// Pulse: 8 whole cycles per 30s loop (period 3.75s, the
// nearest whole-cycle period to the specced 4s), scale
// 1.0 to 1.03 about the arc centre of the title.
function drawTitle(lt) {
  var pulse = 1 + 0.03 * (0.5 - 0.5 * Math.cos(2 * Math.PI * 8 * lt / LOOP));
  ctx.save();
  ctx.translate(640, 330); ctx.scale(pulse, pulse); ctx.translate(-640, -330);
  var s = -TITLE_ADV.total / 2;
  for (var i = 0; i < TITLE.length; i++) {
    var ch = TITLE[i], adv = TITLE_ADV[i];
    if (ch !== ' ') {
      var mid = s + adv / 2;
      var a = mid / ARC_R;
      var px = ARC_CX + ARC_R * Math.sin(a);
      var py = ARC_CY - ARC_R * Math.cos(a);
      for (var pass = 0; pass < 2; pass++) {
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(a + TILT[i]);
        ctx.scale(LSCALE, LSCALE);
        ctx.translate(-GLYPHS[ch].w / 2, -140);
        if (pass === 0) { ctx.translate(7, 8); drawGlyph(ch, EPINK, null); }
        else drawGlyph(ch, CREAM, INK);
        ctx.restore();
      }
    }
    s += adv;
  }
  ctx.restore();
}

// ---- helpers --------------------------------------------
function ell(x, y, rx, ry, rot, fill, stroke, lw) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 4; ctx.stroke(); }
}
function arcStroke(x, y, r, a0, a1, col, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, a0, a1);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}

// ---- pattern field --------------------------------------
function drawStars(lt) {
  for (var i = 0; i < STARS.length; i++) {
    var st = STARS[i];
    var tw = 0.30 + 0.70 * (0.5 - 0.5 * Math.cos(2 * Math.PI * st.cyc * lt / LOOP + st.ph));
    ctx.globalAlpha = tw;
    ctx.fillStyle = STAR;
    if (st.spark) {
      var r = st.r * 3.1;
      ctx.beginPath();
      ctx.moveTo(st.x, st.y - r); ctx.quadraticCurveTo(st.x, st.y, st.x + r, st.y);
      ctx.quadraticCurveTo(st.x, st.y, st.x, st.y + r); ctx.quadraticCurveTo(st.x, st.y, st.x - r, st.y);
      ctx.quadraticCurveTo(st.x, st.y, st.x, st.y - r);
      ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawSwirls() {
  for (var i = 0; i < SWIRLS.length; i++) {
    var sw = SWIRLS[i];
    ctx.beginPath();
    for (var k = 0; k <= 44; k++) {
      var th = k / 44 * Math.PI * 4.4;
      var rr = 3 + (sw.r - 3) * (k / 44);
      var x = sw.x + rr * Math.cos(th), y = sw.y + rr * Math.sin(th);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = sw.col; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
  }
}

function drawRings(lt) {
  for (var i = 0; i < RINGS.length; i++) {
    var rg = RINGS[i];
    var rot = 2 * Math.PI * rg.cyc * lt / LOOP;
    ctx.fillStyle = rg.col;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, 6.5, 0, Math.PI * 2); ctx.fill();
    for (var d = 0; d < 8; d++) {
      var a = rot + d * Math.PI / 4;
      ctx.beginPath();
      ctx.arc(rg.x + 24 * Math.cos(a), rg.y + 24 * Math.sin(a), 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ---- figure ----------------------------------------------
// Oversized flower earring on a pendulum: anchor at the
// ear, string, six petals round a centre. Angle is a
// pure sine on the 2s period; the two earrings swing
// in opposite phase.
function drawEarring(ax, ay, ang, petal, centre) {
  ctx.save();
  ctx.translate(ax, ay); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 50);
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
  ctx.translate(0, 86);
  for (var p = 0; p < 6; p++) {
    ctx.save(); ctx.rotate(p * Math.PI / 3);
    ell(0, -21, 13.5, 22, 0, petal, INK, 3.5);
    ctx.restore();
  }
  ell(0, 0, 13, 13, 0, centre, INK, 3.5);
  ctx.restore();
}

// The afro: one scalloped blob path (radius modulated
// by 14 lobes), filled black, stroked once, with
// purple highlight arcs on the upper left. The bounce
// is a barely-there squash about the chin pivot.
function afroPath(cx, cy, R) {
  ctx.beginPath();
  for (var k = 0; k <= 160; k++) {
    var th = k / 160 * Math.PI * 2;
    var rr = R + 17 * Math.cos(th * 14);
    var x = cx + rr * Math.cos(th), y = cy + rr * Math.sin(th) * 0.94;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawFigure(lt) {
  var CX = 640;
  // Top: teal, shoulders rising to the neck, black outline.
  poly([[452, 846], [476, 756], [556, 724], [724, 724], [804, 756], [828, 846]], TEAL, INK, 5);
  // Collar: a cream scallop at the neckline.
  arcStroke(CX, 730, 62, Math.PI * 0.15, Math.PI * 0.85, CREAM, 9);
  // Neck.
  poly([[606, 668], [674, 668], [674, 742], [606, 742]], SKIN, INK, 4.5);
  // Ears.
  ell(503, 598, 25, 30, 0, SKIN, INK, 4.5);
  ell(777, 598, 25, 30, 0, SKIN, INK, 4.5);
  // Afro with its bounce (6 whole cycles per loop).
  var bph = 2 * Math.PI * 6 * lt / LOOP;
  ctx.save();
  ctx.translate(CX, 668); ctx.scale(1 - 0.006 * Math.sin(bph), 1 + 0.013 * Math.sin(bph)); ctx.translate(-CX, -668);
  afroPath(CX, 466, 224);
  ctx.fillStyle = AFRO; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
  // Purple highlights: short arcs inside the silhouette,
  // following the lobes on the upper left and top right.
  arcStroke(CX, 466, 178, Math.PI * 1.08, Math.PI * 1.36, PURPLE, 10);
  arcStroke(CX, 466, 152, Math.PI * 1.18, Math.PI * 1.42, PURPLE, 10);
  arcStroke(CX, 466, 182, Math.PI * 1.58, Math.PI * 1.84, PURPLE, 10);
  ctx.restore();
  // Face: chin up, features set high, looking up.
  ell(CX, 586, 126, 146, 0, SKIN, INK, 5);
  // Eyes: happy upward arcs under the glasses.
  arcStroke(CX - 58, 566, 27, Math.PI * 1.12, Math.PI * 1.88, INK, 7);
  arcStroke(CX + 58, 566, 27, Math.PI * 1.12, Math.PI * 1.88, INK, 7);
  // Nose and confident smile.
  arcStroke(CX + 4, 606, 13, Math.PI * 0.1, Math.PI * 0.75, INK, 5);
  arcStroke(CX, 622, 40, Math.PI * 0.18, Math.PI * 0.82, INK, 6.5);
  // Square glasses: black rim under a mustard frame,
  // bridge and temples to the ears.
  var gy = 548;
  ctx.beginPath(); ctx.moveTo(503, gy - 6); ctx.lineTo(526, gy - 2);
  ctx.moveTo(754, gy - 2); ctx.lineTo(777, gy - 6);
  ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.stroke();
  function lens(cx) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(cx - 56, gy - 52, 112, 104, 14); else ctx.rect(cx - 56, gy - 52, 112, 104);
    ctx.strokeStyle = INK; ctx.lineWidth = 21; ctx.stroke();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(cx - 56, gy - 52, 112, 104, 14); else ctx.rect(cx - 56, gy - 52, 112, 104);
    ctx.strokeStyle = MUSTARD; ctx.lineWidth = 12; ctx.stroke();
  }
  lens(CX - 62); lens(CX + 62);
  ctx.beginPath(); ctx.moveTo(CX - 8, gy - 14); ctx.quadraticCurveTo(CX, gy - 24, CX + 8, gy - 14);
  ctx.strokeStyle = MUSTARD; ctx.lineWidth = 11; ctx.stroke();
  // Earrings last, swinging clear of the face. 2s
  // pendulum period, opposite phases (15 whole cycles
  // per loop each, so both are home at the seam).
  var ea = 0.23 * Math.sin(2 * Math.PI * lt / 2);
  drawEarring(503, 624, ea, EPINK, EORANGE);
  drawEarring(777, 624, -ea, EORANGE, EPINK);
}

// ---- scene -----------------------------------------------
function drawScene(lt) {
  // Page ground: the frame pink, everywhere.
  ctx.fillStyle = FRAME; ctx.fillRect(-OX / S - 4, -OY / S - 4, W / S + 8, H / S + 8);
  // Plum interior inside the 54px frame border.
  ctx.fillStyle = PLUM;
  ctx.fillRect(FRAMEW, FRAMEW, DW - 2 * FRAMEW, DH - 2 * FRAMEW);
  // Pattern field on the plum, around the figure.
  drawStars(lt);
  drawSwirls();
  drawRings(lt);
  // Lettering over the top of the field.
  drawTitle(lt);
  // The portrait.
  drawFigure(lt);
  // Frame rims, drawn last so the border reads clean
  // over everything: outer edge and inner edge.
  ctx.strokeStyle = INK; ctx.lineWidth = 5;
  ctx.strokeRect(3, 3, DW - 6, DH - 6);
  ctx.strokeRect(FRAMEW, FRAMEW, DW - 2 * FRAMEW, DH - 2 * FRAMEW);
  ctx.beginPath(); ctx.moveTo(FRAMEW + 14, FRAMEW + 14); ctx.lineTo(DW - FRAMEW - 14, FRAMEW + 14);
  ctx.lineTo(DW - FRAMEW - 14, DH - FRAMEW - 14); ctx.lineTo(FRAMEW + 14, DH - FRAMEW - 14);
  ctx.closePath();
  ctx.strokeStyle = FRAME; ctx.lineWidth = 3; ctx.stroke();
}

function draw() { drawScene(T % LOOP); }

// ---- piece state ----------------------------------------
// Constant first-frame phase: T = 7.3s into the 30s
// loop. The earring pendulums (2s period) sit at
// sin(2*pi*7.3/2) = -0.81 of full swing: mid-swing,
// one each way. The clock advances in fixed 1/60 ticks
// from there, never from a wall clock.
var T = 7.3;
var lastNow = -1, acc = 0;

function step() { /* watch-only: no per-tick state */ }

// ---- sizing: centred fit, page ground = frame pink -----
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
