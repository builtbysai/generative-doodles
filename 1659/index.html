<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mazinaw, After the Storm</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#000000';
var PLATE = '#f4fbff';
var INK = '#14141c';
var PHASE = 8;
var STROKES = 3000;
var ADVECT = 8;
var STEPS = 16;
var FS = 0.12;
/* A black field of feathery strokes keeps forming and dissolving
   vortices, brushed into being by something large and unseen.
   Frame one is at t = 8 s: the advection window is already full, so
   the vortices are developed, never blank. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
/* S = short side in px; AW/AH = frame size in units of S. */
var S = 1, AW = 1, AH = 1;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  S = Math.max(1, Math.min(VW, VH));
  AW = VW / S; AH = VH / S;
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* ---- the storm: closed-form curl noise plus six authored vortices.
   All vortex centres are off-centre by construction; none sits in
   the middle of the frame. Strengths wax and wane on slow timers. ---- */
var VORTICES = [
  { fx: 0.28, fy: 0.30, r: 0.22, per: 52, ph: 0.0, dir: 1 },
  { fx: 0.70, fy: 0.66, r: 0.26, per: 64, ph: 1.3, dir: -1 },
  { fx: 0.78, fy: 0.24, r: 0.18, per: 47, ph: 2.6, dir: 1 },
  { fx: 0.20, fy: 0.74, r: 0.20, per: 58, ph: 4.1, dir: -1 },
  { fx: 0.45, fy: 0.82, r: 0.17, per: 49, ph: 5.2, dir: 1 },
  { fx: 0.86, fy: 0.55, r: 0.19, per: 55, ph: 0.8, dir: -1 }
];
/* Curl-noise potential terms: psi = sum a * sin(k u + w t + p) * sin(l v + w t + q).
   The flow is the analytic curl of psi, divergence-free by construction. */
var CURL = [
  { a: 0.10, k: 7.0,  l: 5.7,  w: 0.05, p: 0.4, q: 1.9 },
  { a: 0.06, k: 11.4, l: 9.0,  w: 0.08, p: 2.2, q: 0.7 },
  { a: 0.04, k: 18.0, l: 14.0, w: 0.11, p: 4.0, q: 3.1 }
];
function vortexEnv(vt, t) {
  return 0.25 + 0.75 * Math.pow(0.5 + 0.5 * Math.sin(TAU * t / vt.per + vt.ph), 2);
}
function flow(u, v, t, out) {
  var vx = 0, vy = 0, i, c, s1, c1, s2, c2;
  for (i = 0; i < CURL.length; i++) {
    c = CURL[i];
    s1 = Math.sin(c.k * u + c.w * t + c.p);
    c1 = Math.cos(c.k * u + c.w * t + c.p);
    s2 = Math.sin(c.l * v + c.w * 1.3 * t + c.q);
    c2 = Math.cos(c.l * v + c.w * 1.3 * t + c.q);
    vx += c.a * c.l * s1 * c2;
    vy += -c.a * c.k * c1 * s2;
  }
  for (i = 0; i < VORTICES.length; i++) {
    var vt = VORTICES[i];
    var cx = vt.fx * AW, cy = vt.fy * AH;
    var dx = u - cx, dy = v - cy;
    var r2 = dx * dx + dy * dy;
    var fall = Math.exp(-r2 / (2 * vt.r * vt.r));
    var env = vortexEnv(vt, t);
    var om = vt.dir * 1.6 * env * fall;
    vx += -dy * om - dx * 0.22 * env * fall;
    vy += dx * om - dy * 0.22 * env * fall;
  }
  /* One slow global rotation keeps the field from settling. */
  var gx = u - 0.5 * AW, gy = v - 0.5 * AH;
  vx += -gy * 0.03;
  vy += gx * 0.03;
  out[0] = vx * FS;
  out[1] = vy * FS;
}
/* ---- the stroke population: seeded, fixed at load. ---- */
var strokes = [];
var VIOLET = [126, 111, 208];
var BANDS = [
  { c: [58, 58, 64], a: 0.30 },
  { c: [92, 92, 98], a: 0.34 },
  { c: [128, 128, 134], a: 0.40 },
  { c: [168, 168, 174], a: 0.48 },
  { c: [212, 212, 216], a: 0.55 }
];
function buildStrokes() {
  var rng = mulberry32(1659);
  var i;
  strokes = [];
  for (i = 0; i < STROKES; i++) {
    strokes.push({
      sx: rng() * 1.0,
      sy: rng() * 1.0,
      band: Math.min(4, Math.floor(rng() * 5)),
      jit: (rng() - 0.5) * 0.24,
      len: 0.75 + rng() * 0.5
    });
  }
}
buildStrokes();
var fscratch = [0, 0];
/* Advect one stroke's seed forward over the fixed window [t-ADVECT, t]
   and return its head position and flow direction at time t. Pure
   closed form in t: no frame-integrated state, frame one is exact. */
function strokeHead(st, t, out) {
  var dt = ADVECT / STEPS;
  var u = st.sx * AW, v = st.sy * AH;
  var tt = t - ADVECT;
  var i;
  for (i = 0; i < STEPS; i++) {
    flow(u, v, tt, fscratch);
    u += fscratch[0] * dt;
    v += fscratch[1] * dt;
    tt += dt;
  }
  flow(u, v, t, fscratch);
  out[0] = u; out[1] = v;
  out[2] = fscratch[0]; out[3] = fscratch[1];
}
var hscratch = [0, 0, 0, 0];
function drawStorm(t) {
  var i, st, px, py, dx, dy, sp, len, ang, ca, sa, tx, ty;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineWidth = isPhone ? 1.0 : 1.15;
  for (var b = 0; b < 5; b++) {
    ctx.beginPath();
    for (i = 0; i < strokes.length; i++) {
      st = strokes[i];
      if (st.band !== b) continue;
      strokeHead(st, t, hscratch);
      px = hscratch[0] * S; py = hscratch[1] * S;
      /* The single violet hint lives at the right edge only: strokes
         whose head lands in the upper-right edge band are violet. */
      if (hscratch[0] > 0.86 * AW && hscratch[1] > 0.10 * AH && hscratch[1] < 0.40 * AH) continue;
      dx = hscratch[2]; dy = hscratch[3];
      sp = Math.sqrt(dx * dx + dy * dy);
      if (sp < 0.0001) continue;
      len = clamp(sp * S * 0.30 * st.len, 4, 24);
      ang = Math.atan2(dy, dx) + st.jit;
      ca = Math.cos(ang); sa = Math.sin(ang);
      tx = px - ca * len; ty = py - sa * len;
      ctx.moveTo(px, py);
      ctx.lineTo(tx, ty);
    }
    ctx.strokeStyle = rgba(BANDS[b].c, BANDS[b].a);
    ctx.stroke();
  }
  /* Violet hint batch, same advection, edge band only. */
  ctx.beginPath();
  for (i = 0; i < strokes.length; i++) {
    st = strokes[i];
    strokeHead(st, t, hscratch);
    if (!(hscratch[0] > 0.86 * AW && hscratch[1] > 0.10 * AH && hscratch[1] < 0.40 * AH)) continue;
    px = hscratch[0] * S; py = hscratch[1] * S;
    dx = hscratch[2]; dy = hscratch[3];
    sp = Math.sqrt(dx * dx + dy * dy);
    if (sp < 0.0001) continue;
    len = clamp(sp * S * 0.30 * st.len, 4, 24);
    ang = Math.atan2(dy, dx) + st.jit;
    ca = Math.cos(ang); sa = Math.sin(ang);
    tx = px - ca * len; ty = py - sa * len;
    ctx.moveTo(px, py);
    ctx.lineTo(tx, ty);
  }
  ctx.strokeStyle = rgba(VIOLET, 0.5);
  ctx.lineWidth = isPhone ? 1.1 : 1.2;
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Mazinaw, After the Storm').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Mazinaw, After the Storm').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 28').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = 'rgba(20,20,28,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Mazinaw, After the Storm', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = 'rgba(20,20,28,0.8)';
  ctx.fillText('2006 · 07 · 28', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = 'rgba(20,20,28,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = 'rgba(20,20,28,0.9)';
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawStorm(t);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    strokeCount: function () { return strokes.length; },
    vortexCount: function () { return VORTICES.length; },
    violetCount: function (t) {
      var n = 0, i;
      for (i = 0; i < strokes.length; i++) {
        strokeHead(strokes[i], t, hscratch);
        if (hscratch[0] > 0.86 * AW && hscratch[1] > 0.10 * AH && hscratch[1] < 0.40 * AH) n++;
      }
      return n;
    },
    vortexEnvelopes: function (t) {
      var out = [], i;
      for (i = 0; i < VORTICES.length; i++) out.push(vortexEnv(VORTICES[i], t));
      return out;
    },
    strokePositions: function (t) {
      var out = [], i;
      for (i = 0; i < strokes.length; i++) {
        strokeHead(strokes[i], t, hscratch);
        out.push([hscratch[0], hscratch[1]]);
      }
      return out;
    },
    meanDrift: function (t0, t1) {
      var a = this.strokePositions(t0), b = this.strokePositions(t1);
      var sum = 0, i, dx, dy;
      for (i = 0; i < a.length; i++) {
        dx = b[i][0] - a[i][0]; dy = b[i][1] - a[i][1];
        sum += Math.sqrt(dx * dx + dy * dy);
      }
      return sum / a.length;
    }
  };
}
/* ---- frame one: fixed phase, fixed seeds, no wall clock ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
