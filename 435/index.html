<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.435 Cardigan Season</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#D9A441; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.435 Cardigan Season (angelina_bambina_dsgn,
// EXPANSION #47, prompt ANG3).
// Her cozy-autumn vignette: a woman with short white
// hair in an olive cardigan, sipping from a yellow
// mug at a dark wooden table; an open sketchbook with
// fall-leaf sketches; a slice of lattice-top pie;
// scattered autumn leaves; mustard ground. No snow,
// no winter elements, no text anywhere (the book
// holds leaf scribbles only).
//
// WATCH-ONLY 84s master loop, the LCM of the
// prompt's two cadences: the sip cycle runs 12s (7
// per loop) and one leaf falls and lands every 14s
// (6 per loop). The cardigan knit is procedural
// rib/stitch data clipped to the garment and drawn
// every frame; it breathes subtly on the sip cycle.
// Steam is the prompt's one allowed translucency,
// shipped as 3 stepped flat-alpha bezier ribbons.
// DOUBLE-TAP advances a FIXED AUTHORED TABLE of 3
// still-life arrangements (book, pie, mug rest and
// leaves re-laid). No Math.random at runtime.
//
// The six falling leaves land into six fixed spots
// that belong to the settled scatter: during a leaf's
// 14s slot that one spot sits empty while its leaf is
// in the air, so the leaf count never pops and the
// seam at 84s is exact.
//
// Frame one is drawn at the constant phase T = 17.4s:
// the mug is at her lips mid-sip (sip phase 0.45) and
// the second leaf is mid-fall (fall progress 0.44).
// The clock is anchored there and advances in fixed
// 1/60 ticks, never from a wall clock, so the
// thumbnail reproduces byte-identically. Flat colour
// only, one canvas, no offscreen canvas, no
// shadowBlur, no gradients.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Mustard ground, cardigan olive, mug yellow, table
// dark, pie crust and filling, three leaf colours,
// hair white. Nothing else. Skin resolves inside the
// palette to pie crust #E0A458, its warm mid-tone;
// the sketchbook pages use the hair white.
var MUSTARD = '#D9A441', OLIVE = '#6B7A2A', MUGG = '#F2C230';
var TABLE = '#3A2E2A', CRUST = '#E0A458', FILLING = '#B3392F';
var LEAF = ['#C65D2E', '#D9A441', '#8A5A2A'];
var HAIR = '#F5F2EA', SKIN = CRUST;

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 84, SIP = 12, FALL = 14;
if (LOOP % SIP !== 0 || LOOP / SIP !== 7) throw new Error('loop must hold exactly 7 sips');
if (LOOP % FALL !== 0 || LOOP / FALL !== 6) throw new Error('loop must hold exactly 6 leaf falls');
var TICK = 1 / 60;
var TABLE_Y = 620;
var CX = 640;

// QA probes via the house seed pattern: ?seed=rest
// starts with the mug down and the first leaf just
// leaving, ?seed=land starts late in the last fall.
// The shipped default is mid-sip at T_OFF = 17.4s.
var seedStr = (typeof location !== 'undefined' && location.search) ? location.search : '';
var T_OFF = 17.4;
if (seedStr.indexOf('rest') >= 0) T_OFF = 1.0;
if (seedStr.indexOf('land') >= 0) T_OFF = 76.0;

// ---- small draw helpers ---------------------------------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function circ(x, y, r, fill, alpha) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) {
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    ctx.fillStyle = fill; ctx.fill();
    ctx.restore();
  }
}
function ell(x, y, rx, ry, fill, alpha) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) {
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    ctx.fillStyle = fill; ctx.fill();
    ctx.restore();
  }
}
function line(x0, y0, x1, y1, col, lw, alpha) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore();
}
function smooth(p) { return p * p * (3 - 2 * p); }
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function lerp(a, b, t) { return a + (b - a) * t; }

// ---- leaves ----------------------------------------------
// One leaf sprite: a pointed ellipse with a vein and a
// short stem, drawn from data (position, size,
// rotation, colour). No texture, no image.
function drawLeaf(x, y, size, rot, col, alpha) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.quadraticCurveTo(size * 0.62, -size * 0.25, 0, size);
  ctx.quadraticCurveTo(-size * 0.62, -size * 0.25, 0, -size);
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, -size * 0.78); ctx.lineTo(0, size * 0.88);
  ctx.strokeStyle = TABLE; ctx.globalAlpha = (alpha !== undefined ? alpha : 1) * 0.25;
  ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, size); ctx.lineTo(0, size + 7);
  ctx.strokeStyle = col; ctx.globalAlpha = (alpha !== undefined ? alpha : 1);
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore();
}
// the loose 5x5 anchor grid the scatter sits on
function gx(c) { return 110 + c * 265; }
function gy(r) { return 95 + r * 180; }

// six fixed landing spots on the table front, part of
// the settled scatter in every arrangement
var LAND = [
  { x: 520, y: 806 }, { x: 742, y: 822 }, { x: 470, y: 818 },
  { x: 852, y: 792 }, { x: 618, y: 846 }, { x: 688, y: 752 }
];
// the fall each slot performs: sideways drift while
// dropping, total spin, colour and size
var FALLS = [
  { dx: -46, spin: 2.4, col: 0, size: 17 },
  { dx: 30, spin: -1.8, col: 2, size: 15 },
  { dx: -18, spin: 3.0, col: 1, size: 18 },
  { dx: 52, spin: -2.6, col: 0, size: 16 },
  { dx: -34, spin: 2.0, col: 2, size: 19 },
  { dx: 12, spin: -3.2, col: 1, size: 15 }
];
if (FALLS.length !== 6 || LAND.length !== 6) throw new Error('six falls into six landing spots');

// ---- the 3 authored still-life arrangements --------------
// Each re-lays the book, the pie, the mug's rest offset
// and the leaves. Scatter entries: [grid col, grid row,
// jitter x, jitter y, rotation, leaf colour, size].
// Landing leaves carry [rotation, leaf colour, size]
// per arrangement; their spots are fixed above.
var ARRANGEMENTS = [
  {
    book: { x: 370, y: 738, rot: -0.05 }, pie: { x: 905, y: 742 }, mugOff: { x: 0, y: 0 },
    scatter: [
      [0, 0, 22, 10, 0.6, 0, 16], [4, 0, -18, 26, -0.9, 2, 15], [1, 0, 40, -6, 1.9, 1, 14],
      [0, 1, 8, -22, 2.4, 2, 17], [4, 1, -30, 14, 0.2, 0, 16], [3, 0, -12, 30, -1.7, 0, 15],
      [0, 3, 16, 6, 1.2, 1, 16], [4, 3, -22, -10, 2.8, 2, 15], [0, 4, 30, -16, -0.4, 0, 17],
      [4, 4, -26, -20, 1.5, 1, 16]
    ],
    landed: [[0.7, 0, 17], [-0.5, 2, 15], [1.8, 1, 16], [2.6, 0, 18], [-1.2, 2, 16], [0.3, 1, 15]]
  },
  {
    book: { x: 345, y: 722, rot: 0.07 }, pie: { x: 935, y: 724 }, mugOff: { x: -16, y: 8 },
    scatter: [
      [0, 0, -14, 30, 2.1, 2, 15], [4, 0, 26, -2, 0.9, 0, 17], [2, 0, -48, 12, -1.3, 1, 14],
      [0, 1, 34, 18, -0.6, 1, 16], [4, 2, -8, -26, 1.4, 2, 16], [3, 1, 20, 24, 2.9, 0, 15],
      [0, 2, -28, -8, 0.5, 0, 15], [4, 4, 12, -28, -2.0, 1, 17], [0, 4, -6, -30, 2.2, 2, 16],
      [4, 3, 30, 20, 0.8, 0, 14]
    ],
    landed: [[-0.9, 1, 15], [1.4, 0, 17], [2.7, 2, 16], [0.2, 1, 15], [-1.8, 0, 18], [2.0, 2, 16]]
  },
  {
    book: { x: 398, y: 752, rot: -0.11 }, pie: { x: 872, y: 758 }, mugOff: { x: 14, y: -6 },
    scatter: [
      [0, 0, 36, -14, -2.2, 1, 16], [4, 0, -32, 8, 1.1, 2, 16], [1, 0, -24, 24, 0.4, 0, 15],
      [0, 1, -10, 28, 1.7, 0, 15], [4, 1, 18, -18, -0.8, 1, 17], [3, 0, 8, -20, 2.5, 2, 14],
      [0, 3, -20, -24, 2.9, 2, 16], [4, 2, 26, 12, -1.5, 0, 15], [0, 4, 8, -8, 1.0, 1, 15],
      [4, 4, -14, -12, -2.6, 0, 16]
    ],
    landed: [[1.9, 2, 16], [0.6, 1, 18], [-1.5, 0, 15], [2.3, 2, 17], [0.9, 1, 16], [-0.7, 0, 15]]
  }
];
if (ARRANGEMENTS.length !== 3) throw new Error('exactly 3 authored arrangements');
for (var ai = 0; ai < 3; ai++) {
  if (ARRANGEMENTS[ai].scatter.length !== 10) throw new Error('each arrangement scatters 10 leaves');
  if (ARRANGEMENTS[ai].landed.length !== 6) throw new Error('each arrangement lands 6 leaves');
}
var arrangement = 0;

// ---- the sip cycle -----------------------------------------
// 12s: rest, lift to the lips, hold the sip, lower.
function sipLift(ph) {
  var s = (ph % SIP) / SIP;
  if (s < 0.30) return 0;
  if (s < 0.45) return smooth((s - 0.30) / 0.15);
  if (s < 0.60) return 1;
  if (s < 0.75) return 1 - smooth((s - 0.60) / 0.15);
  return 0;
}

// ---- figure -------------------------------------------------
var MOUTH = { x: 640, y: 344 };
var SHOULDER_R = { x: 712, y: 408 };
var ELBOW_REST = { x: 778, y: 548 }, ELBOW_LIP = { x: 738, y: 472 };
var HAND_REST = { x: 748, y: 596 }, HAND_LIP = { x: 676, y: 384 };

function cardiganPath(breath) {
  var hw = 96 + breath * 2; // hem half width breathes a touch
  ctx.beginPath();
  ctx.moveTo(CX - 76, 388);
  ctx.quadraticCurveTo(CX - 92, 500, CX - hw, 648);
  ctx.lineTo(CX + hw, 648);
  ctx.quadraticCurveTo(CX + 92, 500, CX + 76, 388);
  ctx.quadraticCurveTo(CX, 366, CX - 76, 388);
  ctx.closePath();
}
function drawFigure(ph) {
  var breath = Math.sin(Math.PI * 2 * ph / SIP);
  // neck
  ctx.fillStyle = SKIN; ctx.fillRect(CX - 17, 344, 34, 56);
  // cardigan body, then the knit clipped inside it
  cardiganPath(breath); ctx.fillStyle = OLIVE; ctx.fill();
  ctx.save();
  cardiganPath(breath); ctx.clip();
  // ribs: vertical stitch columns, table-dark at
  // stepped flat alpha; they deepen as she sips
  var lift = sipLift(ph);
  ctx.strokeStyle = TABLE; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.globalAlpha = 0.13 + 0.07 * lift;
  ctx.beginPath();
  for (var rx = CX - 90; rx <= CX + 90; rx += 15) {
    ctx.moveTo(rx, 372); ctx.lineTo(rx + breath * 2, 652);
  }
  ctx.stroke();
  // stitch rows: little v stitches in hair white
  ctx.globalAlpha = 0.20; ctx.strokeStyle = HAIR; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (var ry = 402; ry < 640; ry += 26) {
    for (var sx2 = CX - 84; sx2 <= CX + 84; sx2 += 21) {
      ctx.moveTo(sx2 - 5, ry - 4); ctx.lineTo(sx2, ry + 3); ctx.lineTo(sx2 + 5, ry - 4);
    }
  }
  ctx.stroke();
  ctx.restore();
  // V opening at the neck
  ctx.beginPath();
  ctx.moveTo(CX - 24, 384); ctx.lineTo(CX + 24, 384); ctx.lineTo(CX, 452);
  ctx.closePath(); ctx.fillStyle = SKIN; ctx.fill();
  // buttons down the front
  for (var by = 486; by <= 612; by += 42) circ(CX, by, 5.5, TABLE);
  // head
  circ(CX, 298, 76, SKIN);
  // hair: a short white bob over the head circle, then
  // the fringe band across the forehead
  circ(CX, 290, 88, HAIR);
  ell(CX, 308, 66, 70, SKIN);
  ctx.beginPath();
  ctx.moveTo(CX - 82, 282);
  ctx.quadraticCurveTo(CX - 84, 196, CX, 194);
  ctx.quadraticCurveTo(CX + 84, 196, CX + 82, 282);
  ctx.quadraticCurveTo(CX + 40, 264, CX, 270);
  ctx.quadraticCurveTo(CX - 40, 264, CX - 82, 282);
  ctx.closePath(); ctx.fillStyle = HAIR; ctx.fill();
  // calm face: closed eyes, small mouth, soft blush
  ctx.strokeStyle = TABLE; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(612, 308, 10, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  ctx.beginPath(); ctx.arc(668, 308, 10, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  ctx.beginPath(); ctx.arc(MOUTH.x, MOUTH.y - 4, 7, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  ell(584, 330, 13, 8, FILLING, 0.28);
  ell(696, 330, 13, 8, FILLING, 0.28);
  // left arm resting toward the book, hand on the table
  ctx.strokeStyle = OLIVE; ctx.lineWidth = 34; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(CX - 74, 410); ctx.lineTo(492, 556); ctx.lineTo(458, 656); ctx.stroke();
  circ(455, 662, 13, SKIN);
}

// ---- mug, arm and steam --------------------------------------
function drawMugAndArm(ph, arr) {
  var L = sipLift(ph);
  var hx = lerp(HAND_REST.x + arr.mugOff.x, HAND_LIP.x, L);
  var hy = lerp(HAND_REST.y + arr.mugOff.y, HAND_LIP.y, L) - Math.sin(L * Math.PI) * 16;
  var ex = lerp(ELBOW_REST.x + arr.mugOff.x, ELBOW_LIP.x, L);
  var ey = lerp(ELBOW_REST.y + arr.mugOff.y, ELBOW_LIP.y, L);
  // arm: two olive segments drawn separately with
  // round caps, so the sharp elbow bend at full lift
  // can never throw a miter spike
  ctx.strokeStyle = OLIVE; ctx.lineWidth = 34; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(SHOULDER_R.x, SHOULDER_R.y); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
  // mug, tilting toward the mouth as it rises
  var mx = hx + 2, my = hy - 26, tilt = -0.20 * L;
  ctx.save(); ctx.translate(mx, my); ctx.rotate(tilt);
  ctx.beginPath(); ctx.arc(38, 0, 13, 0, Math.PI * 2);
  ctx.strokeStyle = MUGG; ctx.lineWidth = 8; ctx.stroke();
  rr(-32, -27, 64, 54, 10); ctx.fillStyle = MUGG; ctx.fill();
  ell(0, -27, 30, 8.5, TABLE); // the coffee surface
  ctx.restore();
  // hand gripping the near edge
  circ(hx + 2, hy - 2, 13, SKIN);
  drawSteam(ph, mx, my, tilt);
}
// 3 stepped flat-alpha bezier ribbons rising off the
// mug; sway is a 2-phase sine (12s and 7s, both
// dividing the 84s loop) so the seam is clean.
function drawSteam(ph, mx, my, tilt) {
  var bx = mx + 30 * Math.sin(tilt), by = my - 30 * Math.cos(tilt);
  var alphas = [0.28, 0.18, 0.10];
  for (var i = 0; i < 3; i++) {
    var off = (i - 1) * 14;
    var pts = [];
    for (var j = 0; j <= 4; j++) {
      var sway = Math.sin(Math.PI * 2 * ph / 12 + i * 1.7 + j * 0.9) * 8 +
                 Math.sin(Math.PI * 2 * ph / 7 + i * 0.9 + j * 0.6) * 5.5;
      pts.push({ x: bx + off + sway * (0.3 + j / 4), y: by - 6 - j * 23 });
    }
    ctx.beginPath();
    for (var a = 0; a < 5; a++) {
      var wdt = 10 - a * 1.6;
      if (a === 0) ctx.moveTo(pts[a].x - wdt / 2, pts[a].y);
      else ctx.lineTo(pts[a].x - wdt / 2, pts[a].y);
    }
    for (var b = 4; b >= 0; b--) {
      var wdt2 = 10 - b * 1.6;
      ctx.lineTo(pts[b].x + wdt2 / 2, pts[b].y);
    }
    ctx.closePath();
    ctx.fillStyle = HAIR; ctx.globalAlpha = alphas[i]; ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ---- sketchbook -----------------------------------------------
// Open book: olive cover, two hair-white pages, leaf
// scribbles only (little outlined leaves, never text).
function drawBook(arr) {
  var b = arr.book;
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
  rr(-104, -62, 208, 124, 8); ctx.fillStyle = OLIVE; ctx.fill();
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.moveTo(-96, -54); ctx.quadraticCurveTo(-48, -64, 0, -50);
  ctx.lineTo(0, 52); ctx.quadraticCurveTo(-48, 62, -96, 50);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(96, -54); ctx.quadraticCurveTo(48, -64, 0, -50);
  ctx.lineTo(0, 52); ctx.quadraticCurveTo(48, 62, 96, 50);
  ctx.closePath(); ctx.fill();
  line(0, -50, 0, 52, TABLE, 2.5, 0.3);
  scribbleLeaf(-52, -18, 13, 0.6, LEAF[0]);
  scribbleLeaf(-38, 22, 11, 2.2, OLIVE);
  scribbleLeaf(-66, 30, 9, -0.8, LEAF[2]);
  scribbleLeaf(50, -22, 12, 1.8, LEAF[2]);
  scribbleLeaf(62, 18, 10, -0.4, LEAF[0]);
  scribbleLeaf(36, 30, 8, 2.8, OLIVE);
  ctx.restore();
}
function scribbleLeaf(x, y, size, rot, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.quadraticCurveTo(size * 0.62, -size * 0.25, 0, size);
  ctx.quadraticCurveTo(-size * 0.62, -size * 0.25, 0, -size);
  ctx.closePath();
  ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -size * 0.7); ctx.lineTo(0, size * 0.8); ctx.stroke();
  ctx.restore();
}

// ---- pie slice ---------------------------------------------------
// A wedge on a hair-white plate: red filling, crust
// rim, and a lattice of crust strips clipped to the
// filling, drawn from data.
function drawPie(arr) {
  var p = arr.pie;
  ell(p.x, p.y + 22, 102, 26, TABLE, 0.18); // soft contact shadow
  ell(p.x, p.y + 14, 104, 30, HAIR);        // the plate
  ctx.save(); ctx.translate(p.x, p.y);
  // filling wedge, tip to the left, a flatter base so
  // the slice sits on the plate
  ctx.beginPath();
  ctx.moveTo(-88, 4);
  ctx.quadraticCurveTo(-20, -22, 50, -28);
  ctx.quadraticCurveTo(64, 2, 50, 32);
  ctx.quadraticCurveTo(-20, 26, -88, 4);
  ctx.closePath();
  ctx.fillStyle = FILLING; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = CRUST; ctx.lineWidth = 8; ctx.lineCap = 'round';
  for (var d = -60; d <= 60; d += 24) {
    ctx.beginPath(); ctx.moveTo(-88 + d, -38); ctx.lineTo(-50 + d, 38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-88 + d, 38); ctx.lineTo(-50 + d, -38); ctx.stroke();
  }
  ctx.restore();
  // the thick crust rim down the wide edge
  ctx.beginPath();
  ctx.moveTo(50, -28);
  ctx.quadraticCurveTo(66, 2, 50, 32);
  ctx.strokeStyle = CRUST; ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore();
}

// ---- leaves: settled scatter plus the falling one ----------------
function drawLeaves(ph, arr) {
  var slot = Math.floor(ph / FALL);
  var u = (ph - slot * FALL) / FALL;
  var i, s;
  for (i = 0; i < arr.scatter.length; i++) {
    s = arr.scatter[i];
    drawLeaf(gx(s[0]) + s[2], gy(s[1]) + s[3], s[6], s[4], LEAF[s[5]]);
  }
  // landed leaves rest in their spots, except the one
  // whose slot is live: it is in the air instead
  for (i = 0; i < 6; i++) {
    if (i === slot) continue;
    var ld = arr.landed[i];
    drawLeaf(LAND[i].x, LAND[i].y, ld[2], ld[0], LEAF[ld[1]]);
  }
  // the falling leaf: fades in at the top of its drop,
  // accelerates down with a sideways sway, lands at
  // u = 0.55 into its spot, rests to the slot's end
  var f = FALLS[slot], spot = LAND[slot], la = arr.landed[slot];
  var col = LEAF[f.col];
  if (u < 0.55) {
    var p = u / 0.55;
    var acc = Math.pow(p, 1.35);
    var sx = spot.x + f.dx, sy = spot.y - 540;
    var x = lerp(sx, spot.x, acc) + Math.sin(p * Math.PI * 2) * 24 * (1 - p);
    var y = lerp(sy, spot.y, acc);
    var rot = la[0] - f.spin * (1 - p) + Math.sin(p * Math.PI * 4) * 0.3;
    var fade = clamp01(u / 0.05);
    drawLeaf(x, y, f.size, rot, col, fade);
  } else {
    drawLeaf(spot.x, spot.y, la[2], la[0], LEAF[la[1]]);
  }
}

// ---- draw ---------------------------------------------------------
function draw() {
  var ph = T % LOOP;
  var arr = ARRANGEMENTS[arrangement];
  // mustard ground and the dark table, both run far
  // past the design edges so cover-fit never shows a
  // seam at any aspect
  ctx.fillStyle = MUSTARD;
  ctx.fillRect(-2000, -2000, DW + 4000, DH + 4000);
  ctx.fillStyle = TABLE;
  ctx.fillRect(-2000, TABLE_Y, DW + 4000, DH - TABLE_Y + 4000);
  line(-2000, TABLE_Y, DW + 2000, TABLE_Y, CRUST, 4, 0.5); // table edge
  drawFigure(ph);
  drawLeaves(ph, arr);
  drawBook(arr);
  drawPie(arr);
  drawMugAndArm(ph, arr);
}

// ---- step ------------------------------------------------------------
function step() { /* state is a pure function of T plus arrangement */ }

// ---- pointer: double-tap advances the arrangement ---------------------
// Tap timing uses the piece clock, as elsewhere in the
// lane, so interaction never touches a wall clock.
var downX = -1, downY = -1, downT = 0;
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved >= 28 || held >= 0.8) return;
  var ddx = p.x - lastTapX, ddy = p.y - lastTapY;
  if (T - lastTapT <= 0.45 && Math.sqrt(ddx * ddx + ddy * ddy) < 90) {
    arrangement = (arrangement + 1) % ARRANGEMENTS.length;
    lastTapT = -10;
  } else {
    lastTapT = T; lastTapX = p.x; lastTapY = p.y;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; });

// ---- sizing: COVER fit ----------------------------------------------
// A field composition: the design fills the frame at
// any size and the centre (figure, mug, table) always
// survives the crop.
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- clock -------------------------------------------------------------
// T starts at the constant phase T_OFF and advances in
// fixed 1/60 ticks; frame one is drawn synchronously at
// T_OFF exactly, so the thumbnail reproduces
// byte-identically from the shipped script.
var T = T_OFF, acc = 0, lastNow = -1;
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = MUSTARD;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
