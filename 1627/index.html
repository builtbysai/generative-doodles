<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Path Predictions</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EEE4; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F2EEE4';
var GRID = '#C9C4B4';
var COAST = '#8A8574';
var INK = '#1F5FC4';
var INK_DARK = '#174A9E';
var INK_LIGHT = '#3A78D8';
var TITLE_INK = '#23231F';
var SEED = 1627007;
var MEMBERS = 24;        /* ensemble members per forecast cycle */
var MEMBER_MS = 2400;    /* one member every 2.4 s: 24 members in ~58 s */
var DRAW_MS = 2200;      /* each member draws in over 2.2 s */
var HOLD_MS = 4000;      /* hold after the set completes, then next cycle */
var CYCLE_MS = MEMBERS * MEMBER_MS + HOLD_MS;
var PHASE = 2 * MEMBER_MS + 1100;   /* frame one: two members done, third half drawn */
var COMPLETE_T = MEMBERS * MEMBER_MS;
var MAX_STEPS = 190;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function mixRgb(a, b, k) {
  return [Math.round(a[0] + (b[0] - a[0]) * k), Math.round(a[1] + (b[1] - a[1]) * k), Math.round(a[2] + (b[2] - a[2]) * k)];
}
var INK_RGB = hexRgb(INK);
var INK_DARK_RGB = hexRgb(INK_DARK);
var INK_LIGHT_RGB = hexRgb(INK_LIGHT);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Landscape field, 4:3. Desktop: fitted and centred on the paper ground.
   Phone: a centred landscape band, never stretched. */
function compRect() {
  var AR = 4 / 3;
  if (isPhone) {
    var w = VW, h = w / AR;
    return { x: 0, y: (VH - h) / 2, w: w, h: h };
  }
  var w2 = Math.min(VW * 0.94, VH * 0.94 * AR);
  var h2 = w2 / AR;
  return { x: (VW - w2) / 2, y: (VH - h2) / 2, w: w2, h: h2 };
}
/* ---- coastline: a height function over the field, land above, sea below ---- */
var coastRng = mulberry32(SEED + 11);
var COAST_P1 = coastRng() * TAU, COAST_P2 = coastRng() * TAU;
var COAST_A1 = 0.028 + coastRng() * 0.014, COAST_A2 = 0.012 + coastRng() * 0.010;
function coastFrac(fx) {
  return 0.10 + 0.45 * smooth(fx)
    + COAST_A1 * Math.sin(fx * 9.2 + COAST_P1)
    + COAST_A2 * Math.sin(fx * 23.0 + COAST_P2);
}
/* ---- seeded value noise for the steering field ---- */
function hash2(ix, iy, s) {
  var h = (ix * 374761393 + iy * 668265263 + s * 974634211) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = (h ^ (h >>> 16)) >>> 0;
  return h / 4294967296;
}
function vnoise(x, y, s) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  var ux = smooth(fx), uy = smooth(fy);
  var a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s);
  var c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s);
  return (a + (b - a) * ux) + ((c + (d - c) * ux) - (a + (b - a) * ux)) * uy;
}
/* ---- ensemble: integrated paths through the noise field ---- */
var rect = { x: 0, y: 0, w: 0, h: 0 };
var rectKey = '';
var seedFx = 0.78, seedFy = 0.72;   /* seed point, lower-right sea */
var cycleIdx = 0, cycleStart = 0;
var ensemble = null;
var ghosts = [];   /* [{ members, age }] oldest last; at most two cycles kept */
function buildEnsemble() {
  var rng = mulberry32(SEED + cycleIdx * 7919 + Math.round(seedFx * 1000) * 13 + Math.round(seedFy * 1000) * 7);
  var sx = rect.x + seedFx * rect.w, sy = rect.y + seedFy * rect.h;
  var step = rect.w / 160;
  var members = [], m;
  for (m = 0; m < MEMBERS; m++) {
    var mseed = Math.floor(rng() * 100000);
    var bias = (rng() - 0.5) * 0.30;
    var jx = (rng() - 0.5) * step * 1.6, jy = (rng() - 0.5) * step * 1.6;
    var wobPhase = rng() * TAU;
    var wobFreq = 0.32 + rng() * 0.18;
    var width = 1.0 + rng() * 1.5;
    var alpha = 0.55 + rng() * 0.35;
    var shade = rng();
    var rgb = shade < 0.5 ? mixRgb(INK_RGB, INK_DARK_RGB, shade * 2) : mixRgb(INK_RGB, INK_LIGHT_RGB, (shade - 0.5) * 2);
    /* each member aims at its own landfall point on the coast, so the
       bundle is thick at the seed and fans as it makes landfall */
    var landFx = 0.12 + rng() * 0.58;
    var lx = rect.x + landFx * rect.w;
    var ly = rect.y + coastFrac(landFx) * rect.h;
    var x = sx + jx, y = sy + jy;
    var heading = Math.atan2(ly - y, lx - x);
    var frozenAim = null;   /* aim direction held once close to landfall */
    var pts = [[x, y]], i;
    var inland = 0;
    for (i = 1; i < MAX_STEPS; i++) {
      var n = vnoise(x * 0.0035, y * 0.0035, mseed);
      var dL = Math.sqrt((lx - x) * (lx - x) + (ly - y) * (ly - y));
      var target;
      if (dL > 90) {
        /* steer toward the member's own landfall point */
        var aim = Math.atan2(ly - y, lx - x);
        target = aim + bias + (n - 0.5) * 0.7;
      } else {
        /* near landfall, hold the aim direction frozen: steering at a
           point a few pixels away would swing the aim around and hook
           the track, and a heading-relative target would curl it */
        if (frozenAim === null) frozenAim = Math.atan2(ly - y, lx - x);
        target = frozenAim + (n - 0.5) * 0.7;
      }
      var diff = target - heading;
      while (diff > Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      heading += diff * 0.25;
      x += Math.cos(heading) * step;
      y += Math.sin(heading) * step;
      /* slight pen wobble, perpendicular to the heading */
      var wob = 1.1 * Math.sin(i * wobFreq + wobPhase) * (step / 7);
      var px = x + -Math.sin(heading) * wob;
      var py = y + Math.cos(heading) * wob;
      pts.push([px, py]);
      var fx = (x - rect.x) / rect.w;
      var onLand = (y - rect.y) / rect.h < coastFrac(clamp(fx, 0, 1));
      if (onLand) {
        inland++;
        if (inland >= 6) break;   /* a short run inland, then the track ends */
      }
      if (x < rect.x - 20 || x > rect.x + rect.w + 20 || y < rect.y - 20 || y > rect.y + rect.h + 20) break;
    }
    members.push({ pts: pts, width: width, alpha: alpha, rgb: rgb });
  }
  return members;
}
function ensureEnsemble() {
  if (!ensemble) ensemble = buildEnsemble();
}
function drawGrid() {
  var gx, gy;
  ctx.strokeStyle = 'rgba(201,196,180,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (gx = 1; gx < 16; gx++) {
    var x = rect.x + gx * rect.w / 16;
    ctx.moveTo(x, rect.y);
    ctx.lineTo(x, rect.y + rect.h);
  }
  for (gy = 1; gy < 12; gy++) {
    var y = rect.y + gy * rect.h / 12;
    ctx.moveTo(rect.x, y);
    ctx.lineTo(rect.x + rect.w, y);
  }
  ctx.stroke();
  /* major lat/long lines, every fourth */
  ctx.strokeStyle = 'rgba(201,196,180,0.85)';
  ctx.beginPath();
  for (gx = 4; gx < 16; gx += 4) {
    var x2 = rect.x + gx * rect.w / 16;
    ctx.moveTo(x2, rect.y);
    ctx.lineTo(x2, rect.y + rect.h);
  }
  for (gy = 4; gy < 12; gy += 4) {
    var y2 = rect.y + gy * rect.h / 12;
    ctx.moveTo(rect.x, y2);
    ctx.lineTo(rect.x + rect.w, y2);
  }
  ctx.stroke();
}
function drawCoast() {
  var i, fx;
  ctx.beginPath();
  for (i = 0; i <= 60; i++) {
    fx = i / 60;
    var x = rect.x + fx * rect.w;
    var y = rect.y + coastFrac(fx) * rect.h;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(138,133,116,0.95)';
  ctx.lineWidth = Math.max(1.5, rect.w / 600);
  ctx.stroke();
  /* faint echo contour, seaward of the coast */
  ctx.beginPath();
  for (i = 0; i <= 60; i++) {
    fx = i / 60;
    var x3 = rect.x + fx * rect.w;
    var y3 = rect.y + (coastFrac(fx) + 0.022) * rect.h;
    if (i === 0) ctx.moveTo(x3, y3); else ctx.lineTo(x3, y3);
  }
  ctx.strokeStyle = 'rgba(138,133,116,0.35)';
  ctx.lineWidth = 1;
  ctx.stroke();
}
function drawMember(member, frac, alphaMul) {
  var n = member.pts.length;
  var show = frac >= 1 ? n : Math.max(2, Math.floor(frac * (n - 1)) + 1);
  if (show < 2) return;
  ctx.beginPath();
  ctx.moveTo(member.pts[0][0], member.pts[0][1]);
  var i;
  for (i = 1; i < show; i++) ctx.lineTo(member.pts[i][0], member.pts[i][1]);
  ctx.strokeStyle = rgba(member.rgb, member.alpha * alphaMul);
  ctx.lineWidth = member.width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}
function drawEnsemble(members, elapsed, alphaMul) {
  var i;
  for (i = 0; i < members.length; i++) {
    var p = clamp((elapsed - i * MEMBER_MS) / DRAW_MS, 0, 1);
    if (p <= 0) continue;
    drawMember(members[i], p, alphaMul);
  }
}
function drawSeed() {
  var sx = rect.x + seedFx * rect.w, sy = rect.y + seedFy * rect.h;
  ctx.beginPath();
  ctx.arc(sx, sy, Math.max(3, rect.w / 280), 0, TAU);
  ctx.fillStyle = rgba(INK_RGB, 0.95);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(sx, sy, Math.max(7, rect.w / 130), 0, TAU);
  ctx.strokeStyle = rgba(INK_RGB, 0.55);
  ctx.lineWidth = 1;
  ctx.stroke();
}
function draw(t) {
  lastT = t;
  size();
  rect = compRect();
  var key = Math.round(rect.w) + 'x' + Math.round(rect.h);
  if (key !== rectKey) {
    rectKey = key;
    ensemble = null;
    ghosts = [];
  }
  ensureEnsemble();
  /* advance cycles: old tracks wash to a ghost trace, then fade over two cycles */
  var elapsed = t - cycleStart;
  while (elapsed >= CYCLE_MS) {
    ghosts.unshift({ members: ensemble, age: 1 });
    if (ghosts.length > 2) ghosts.pop();
    var g;
    for (g = 0; g < ghosts.length; g++) ghosts[g].age = g + 1;
    cycleIdx++;
    cycleStart += CYCLE_MS;
    ensemble = buildEnsemble();
    elapsed = t - cycleStart;
  }
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  ctx.beginPath();
  ctx.rect(rect.x, rect.y, rect.w, rect.h);
  ctx.clip();
  drawGrid();
  drawCoast();
  var gi;
  for (gi = 0; gi < ghosts.length; gi++) {
    var ghostMul = ghosts[gi].age === 1 ? 0.13 : 0.05;
    drawEnsemble(ghosts[gi].members, COMPLETE_T, ghostMul);
  }
  drawEnsemble(ensemble, elapsed, 1);
  drawSeed();
  ctx.restore();
  /* title and hint in ink on the paper, no plates */
  var titlePx = isPhone ? 17 : 20;
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = TITLE_INK;
  ctx.fillText('Storm Path Predictions', cxm, rect.y + (isPhone ? 8 : 12));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = 'rgba(138,133,116,0.9)';
  ctx.fillText('2006 · 06 · 26', cxm, rect.y + (isPhone ? 8 : 12) + titlePx + 4);
  ctx.fillStyle = rgba(INK_RGB, 0.9);
  ctx.fillText('Tap the sea to re-seed the forecast.', cxm, rect.y + rect.h - smallPx - (isPhone ? 8 : 12));
}
function onTap(ev) {
  var px, py;
  if (ev && typeof ev.clientX === 'number') { px = ev.clientX; py = ev.clientY; }
  else return;
  var fx = (px - rect.x) / rect.w;
  var fy = (py - rect.y) / rect.h;
  if (fx < 0.02 || fx > 0.98 || fy < 0.02 || fy > 0.98) return;
  /* only the sea accepts a new seed; taps on land are ignored */
  if (fy <= coastFrac(clamp(fx, 0, 1)) + 0.01) return;
  seedFx = fx; seedFy = fy;
  ghosts.unshift({ members: ensemble, age: 1 });
  if (ghosts.length > 2) ghosts.pop();
  var g;
  for (g = 0; g < ghosts.length; g++) ghosts[g].age = g + 1;
  cycleIdx++;
  cycleStart = lastT;
  ensemble = buildEnsemble();
  draw(lastT);
}
if (typeof canvas.addEventListener === 'function') canvas.addEventListener('pointerdown', onTap);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
/* ---- frame one: fixed phase, two members drawn, third half drawn ---- */
size();
rect = compRect();
rectKey = Math.round(rect.w) + 'x' + Math.round(rect.h);
ensureEnsemble();
draw(reduced ? COMPLETE_T : PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT);   /* time is in milliseconds throughout */
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
