<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emulsion Lifts</title>
<style>
  html, body { margin: 0; padding: 0; background: #1A1712; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1235 "Emulsion Lifts" - Christina Battle study CB4.
   A faded film frame of a prairie street with a tornado on the horizon,
   sprocket holes down both sides. Sections of the emulsion peel away in
   curled shards, show the blank leader, drift, and re-adhere in the wrong
   place - a collage that keeps un-collaging itself. Physical film, not
   bytes: no glitch, no stock page-curl. Silent. Seeded hashes only. */

var T0 = 21;                  /* fixed first-frame phase, seconds */
var SEED = 1235;
var SW = 1000, SH = 700;      /* scene units inside the film frame */
var LEADER = '#E8E2D4';
var DARK = '#1A1712';
var SPROCKET = '#F5F2E9';
var EMUL = '#C9B48F';
var TAU = Math.PI * 2;

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0;

/* ---------- seeded hash ---------- */
function ihash(a, b, c) {
  var x = (a * 374761393 + b * 668265263 + c * 2246822519) | 0;
  x = (x ^ (x >>> 13)) | 0;
  x = Math.imul(x, 1274126177);
  x = (x ^ (x >>> 16)) >>> 0;
  return x / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, k) { return a + (b - a) * k; }

/* ---------- sizing: Visual Viewport API ---------- */
function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function isPhone() {
  var s = window.screen;
  if (s && Math.min(s.width, s.height) < 700) return true;
  return H > W * 1.15;
}
window.addEventListener('resize', function () { resize(); draw(pieceNow()); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceNow()); });
resize();

/* film strip layout: scene (1000x700) + sprocket bands (86 units each side) */
function layout() {
  var stripW = SW + 172, stripH = SH;
  var m = isPhone() ? 6 : 18;
  var sc = Math.min((W - m * 2) / stripW, (H - m * 2) / stripH);
  var w = stripW * sc, h = stripH * sc;
  return {
    sc: sc,
    stripX: (W - w) / 2, stripY: (H - h) / 2, stripW: w, stripH: h,
    sceneX: (W - w) / 2 + 86 * sc, sceneY: (H - h) / 2
  };
}

/* ---------- time ---------- */
var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
function pieceNow() {
  if (typeof performance === 'undefined' || !performance.now) return T0;
  return T0 + (performance.now() - startStamp) / 1000;
}

/* ---------- the scene: ownable shapes are polygons ----------
   Background (sky, funnel, road, ground) is never lifted; houses and the
   water tower are shape records a shard can own. */
function poly(pts, fill, alpha) {
  var cx = 0, cy = 0, i;
  for (i = 0; i < pts.length; i++) { cx += pts[i][0]; cy += pts[i][1]; }
  return { pts: pts, fill: fill, alpha: (alpha === undefined ? 1 : alpha),
           cx: cx / pts.length, cy: cy / pts.length, owners: [] };
}
function ell(cx, cy, rx, ry, fill, alpha) {
  var pts = [], i, a;
  for (i = 0; i < 14; i++) { a = i / 14 * TAU; pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  return poly(pts, fill, alpha);
}
function rect(x, y, w, h, fill, alpha) {
  return poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], fill, alpha);
}

var SHAPES = [];
/* water tower (left) */
SHAPES.push(ell(79, 150 + 58, 56, 36, '#5C5348'));                    /* tank (cy 208) */
SHAPES.push(poly([[27, 192], [131, 192], [79, 150]], '#4E463C'));     /* cone */
SHAPES.push(rect(27, 222, 104, 12, '#4E463C', 0.85));                 /* tank band */
SHAPES.push(poly([[52, 240], [66, 240], [76, 432], [58, 432]], '#5C5348', 0.92));
SHAPES.push(poly([[92, 240], [106, 240], [102, 432], [84, 432]], '#5C5348', 0.92));
SHAPES.push(poly([[62, 330], [98, 330], [99, 342], [61, 342]], '#5C5348', 0.8));
/* house 1 */
SHAPES.push(rect(140, 350, 90, 80, '#B59B7E'));
SHAPES.push(rect(206, 350, 24, 80, '#B06A8A', 0.32));
SHAPES.push(poly([[132, 350], [238, 350], [185, 306]], '#8A6F56'));
SHAPES.push(rect(176, 388, 18, 42, '#6E5540'));
SHAPES.push(rect(152, 364, 16, 16, '#E8E2D4', 0.85));
SHAPES.push(rect(202, 364, 16, 16, '#E8E2D4', 0.85));
/* house 2 */
SHAPES.push(rect(305, 362, 84, 68, '#A88F74'));
SHAPES.push(rect(367, 362, 22, 68, '#B06A8A', 0.30));
SHAPES.push(poly([[297, 362], [397, 362], [347, 320]], '#7D6248'));
SHAPES.push(rect(338, 392, 16, 38, '#6E5540'));
SHAPES.push(rect(316, 374, 14, 14, '#E8E2D4', 0.85));
/* house 3 (right; its roof is shard 0's victim) */
SHAPES.push(rect(788, 356, 92, 74, '#C0A98C'));
SHAPES.push(rect(856, 356, 24, 74, '#B06A8A', 0.30));
SHAPES.push(poly([[780, 356], [888, 356], [834, 312]], '#93755A'));
SHAPES.push(rect(825, 398, 18, 32, '#6E5540'));
SHAPES.push(rect(800, 372, 16, 14, '#E8E2D4', 0.85));
SHAPES.push(rect(852, 372, 16, 14, '#E8E2D4', 0.85));
/* house 4 (small, by the road) */
SHAPES.push(rect(532, 386, 58, 44, '#B59B7E'));
SHAPES.push(poly([[526, 386], [596, 386], [561, 358]], '#8A6F56'));
SHAPES.push(rect(554, 404, 12, 26, '#6E5540'));
SHAPES.push(rect(538, 396, 10, 10, '#E8E2D4', 0.85));

/* ---------- shard schedule ----------
   Shards are DATA: an edge region polygon plus a lifecycle. Ownership is
   resolved once per schedule: walking events in order, a shard captures
   every shape whose current centre (base + settled owners' offsets) lies
   inside its polygon and which is not already in flight at its start. */
var NSHARDS = 48;
var shards = [];
var salt = 0;

function pointInPoly(x, y, p) {
  var inside = false, i, j;
  for (i = 0, j = p.length - 1; i < p.length; j = i++) {
    var xi = p[i][0], yi = p[i][1], xj = p[j][0], yj = p[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function edgePoly(k, sd) {
  var edge = Math.floor(ihash(k, 12, sd) * 4);            /* 0 L, 1 R, 2 T, 3 B */
  var dep = 150 + ihash(k, 13, sd) * 110;
  var len = 150 + ihash(k, 14, sd) * 110;
  var pos = ihash(k, 15, sd);
  var j1 = (ihash(k, 16, sd) - 0.5) * 36, j2 = (ihash(k, 17, sd) - 0.5) * 36;
  var p, drift;
  if (edge === 0) {
    var y0 = pos * (SH - len);
    p = [[-12, y0], [dep, y0 + j1], [dep + j2, y0 + len * 0.55], [dep, y0 + len], [-12, y0 + len]];
    drift = [70 + ihash(k, 18, sd) * 100, (ihash(k, 19, sd) - 0.5) * 130];
  } else if (edge === 1) {
    var y1 = pos * (SH - len);
    p = [[SW + 12, y1], [SW - dep, y1 + j1], [SW - dep + j2, y1 + len * 0.55], [SW - dep, y1 + len], [SW + 12, y1 + len]];
    drift = [-(70 + ihash(k, 18, sd) * 100), (ihash(k, 19, sd) - 0.5) * 130];
  } else if (edge === 2) {
    var x0 = pos * (SW - len);
    p = [[x0, -12], [x0 + len, -12], [x0 + len, dep + j1], [x0 + len * 0.55, dep + j2], [x0, dep]];
    drift = [(ihash(k, 19, sd) - 0.5) * 130, 70 + ihash(k, 18, sd) * 100];
  } else {
    var x1 = pos * (SW - len);
    p = [[x1, SH + 12], [x1 + len, SH + 12], [x1 + len, SH - dep + j1], [x1 + len * 0.55, SH - dep + j2], [x1, SH - dep]];
    drift = [(ihash(k, 19, sd) - 0.5) * 130, -(70 + ihash(k, 18, sd) * 100)];
  }
  return { poly: p, edge: edge, drift: drift };
}

function buildSchedule() {
  var sd = SEED + salt * 7919;
  var i, s;
  for (i = 0; i < SHAPES.length; i++) SHAPES[i].owners = [];
  shards = [];
  for (var k = 0; k < NSHARDS; k++) {
    var start, ep, drift, rot, slant;
    if (k === 0) {
      start = 3;
      ep = { poly: [[752, 282], [916, 282], [916, 386], [752, 386]], edge: 1 };
      drift = [74, 58]; rot = 0.05; slant = 1;
    } else if (k === 1) {
      start = 19.5;
      ep = { poly: [[-12, 138], [202, 138], [202, 312], [-12, 312]], edge: 0 };
      drift = [128, 36]; rot = -0.04; slant = -1;
    } else {
      start = 19.5 + (k - 1) * 14.5 + (ihash(k, 11, sd) - 0.5) * 3;
      ep = edgePoly(k, sd);
      drift = ep.drift; rot = (ihash(k, 20, sd) - 0.5) * 0.12;
      slant = ihash(k, 21, sd) < 0.5 ? -1 : 1;
    }
    var dur = 7 + ihash(k, 22, sd) * 2.5;
    if (k === 0) dur = 8;
    s = {
      k: k, start: start, curlDur: 3, driftDur: dur,
      adhere: start + 3 + dur + 0.6,
      poly: ep.poly, edge: ep.edge, drift: drift, rot: rot, slant: slant,
      shapes: [], tugBake: [0, 0]
    };
    /* bbox + centroid of the home polygon */
    var mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9, cx = 0, cy = 0;
    for (i = 0; i < s.poly.length; i++) {
      mnx = Math.min(mnx, s.poly[i][0]); mxx = Math.max(mxx, s.poly[i][0]);
      mny = Math.min(mny, s.poly[i][1]); mxy = Math.max(mxy, s.poly[i][1]);
      cx += s.poly[i][0]; cy += s.poly[i][1];
    }
    s.bb = [mnx, mny, mxx, mxy];
    s.cent = [cx / s.poly.length, cy / s.poly.length];
    shards.push(s);
  }
  /* resolve ownership in event order */
  for (var a = 0; a < shards.length; a++) {
    var sh = shards[a];
    for (i = 0; i < SHAPES.length; i++) {
      var shp = SHAPES[i];
      /* current centre: base + final offsets of owners already adhered by sh.start */
      var ox = 0, oy = 0, inflight = false;
      for (var o = 0; o < shp.owners.length; o++) {
        var ow = shards[shp.owners[o]];
        if (ow.adhere <= sh.start) { ox += ow.drift[0] + ow.tugBake[0]; oy += ow.drift[1] + ow.tugBake[1]; }
        else if (ow.start <= sh.start) inflight = true;
      }
      if (inflight) continue;
      if (pointInPoly(shp.cx + ox, shp.cy + oy, sh.poly)) {
        shp.owners.push(a);
        sh.shapes.push(i);
      }
    }
  }
}
buildSchedule();

/* ---------- shard state + transform ---------- */
/* phases: dormant -> curl (3s) -> drift -> settle (0.6s) -> settled */
function shardState(sh, t) {
  if (t < sh.start) return { phase: 'dormant', p: 0, prog: 0 };
  var tc = (t - sh.start) / sh.curlDur;
  if (tc < 1) {
    /* stick-slip: the emulsion resists, then gives */
    var p = tc - 0.045 * Math.sin(tc * 22) * (1 - tc);
    return { phase: 'curl', p: clamp(p, 0, 1), prog: 0 };
  }
  var td = (t - sh.start - sh.curlDur) / sh.driftDur;
  if (td < 1) {
    var steps = Math.floor(td * 14) / 14;                 /* reluctant, stepped drift */
    var pr = steps + (td - steps) * 0.25;
    return { phase: 'drift', p: lerp(1, 0.55, pr), prog: pr };
  }
  var ts = (t - sh.start - sh.curlDur - sh.driftDur) / 0.6;
  if (ts < 1) return { phase: 'settle', p: lerp(0.55, 0.18, ts), prog: 1 };
  return { phase: 'settled', p: 0.18, prog: 1 };
}

/* tug state (single active drag) */
var tug = null;   /* {k, sx, sy, dx, dy, relT, released} */
function tugOffsetFor(k, t) {
  if (!tug || tug.k !== k) return [0, 0];
  var f = 1;
  if (tug.released) f = Math.max(0.5, 1 - 0.5 * (t - tug.relT) / 1.2);
  return [tug.dx * f, tug.dy * f];
}
function tugLiftFor(k, t) {
  if (!tug || tug.k !== k || tug.released) return 0;
  return Math.min(0.3, Math.sqrt(tug.dx * tug.dx + tug.dy * tug.dy) / 300);
}

/* map a scene point through a shard's curl, rotation and offset at time t */
function shardPoint(sh, st, t, x, y) {
  var bb = sh.bb, mnx = bb[0], mny = bb[1], mxx = bb[2], mxy = bb[3];
  var p = st.p + (st.phase === 'curl' ? tugLiftFor(sh.k, t) : 0);
  p = clamp(p, 0, 1);
  var X = x, Y = y;
  if (p > 0.003) {
    var sf = p * 0.85, s, folded;
    if (sh.edge === 0 || sh.edge === 1) {
      var w = Math.max(1, mxx - mnx);
      s = (sh.edge === 0) ? (x - mnx) / w : (mxx - x) / w;
      folded = s < sf;
      var sp = folded ? sf + (sf - s) * 0.55 : sf + (s - sf) * (1 - 0.15 * p);
      X = (sh.edge === 0) ? mnx + sp * w : mxx - sp * w;
      if (folded) Y = y + (sf - s) * w * 0.22 * sh.slant;
    } else {
      var h = Math.max(1, mxy - mny);
      s = (sh.edge === 2) ? (y - mny) / h : (mxy - y) / h;
      folded = s < sf;
      var sp2 = folded ? sf + (sf - s) * 0.55 : sf + (s - sf) * (1 - 0.15 * p);
      Y = (sh.edge === 2) ? mny + sp2 * h : mxy - sp2 * h;
      if (folded) X = x + (sf - s) * h * 0.22 * sh.slant;
    }
  }
  /* rotation about the home centroid */
  var rot = sh.rot * (st.phase === 'curl' ? 0.3 * p : st.prog);
  if (rot !== 0) {
    var dx = X - sh.cent[0], dy = Y - sh.cent[1];
    var c = Math.cos(rot), sn = Math.sin(rot);
    X = sh.cent[0] + dx * c - dy * sn;
    Y = sh.cent[1] + dx * sn + dy * c;
  }
  /* offset: drift (plus a small inward pull while curling) + tug */
  var ox = sh.drift[0] * st.prog, oy = sh.drift[1] * st.prog;
  if (st.phase === 'curl') {
    var inw = 16 * p;
    if (sh.edge === 0) ox += inw; else if (sh.edge === 1) ox -= inw;
    else if (sh.edge === 2) oy += inw; else oy -= inw;
  }
  if (st.phase === 'settled') { ox += sh.tugBake[0]; oy += sh.tugBake[1]; }
  var tg = tugOffsetFor(sh.k, t);
  return [X + ox + tg[0], Y + oy + tg[1]];
}

/* fold geometry: split a shard polygon at the fold line (source space).
   s runs 0 at the free edge to 1 at the hinge; the fold sits at s = sf.
   The part with s >= sf stays put (the silhouette); the part with s < sf
   is the flap, which folds back OVER the silhouette - both regions are
   needed, or the curled content gets clipped away. */
function foldLineX(sh, sf) { return sh.bb[0] + sf * (sh.bb[2] - sh.bb[0]); }
function foldLineRX(sh, sf) { return sh.bb[2] - sf * (sh.bb[2] - sh.bb[0]); }
function foldLineY(sh, sf) { return sh.bb[1] + sf * (sh.bb[3] - sh.bb[1]); }
function foldLineRY(sh, sf) { return sh.bb[3] - sf * (sh.bb[3] - sh.bb[1]); }
function clipHalf(p, sh, sf, above) {
  var out = [];
  function inside(q) {
    if (sh.edge === 0) return above ? q[0] >= foldLineX(sh, sf) : q[0] <= foldLineX(sh, sf);
    if (sh.edge === 1) return above ? q[0] <= foldLineRX(sh, sf) : q[0] >= foldLineRX(sh, sf);
    if (sh.edge === 2) return above ? q[1] >= foldLineY(sh, sf) : q[1] <= foldLineY(sh, sf);
    return above ? q[1] <= foldLineRY(sh, sf) : q[1] >= foldLineRY(sh, sf);
  }
  function cross(a, b) {
    var horiz = (sh.edge === 0 || sh.edge === 1);
    var L = (sh.edge === 0) ? foldLineX(sh, sf) : (sh.edge === 1) ? foldLineRX(sh, sf)
          : (sh.edge === 2) ? foldLineY(sh, sf) : foldLineRY(sh, sf);
    var ai = horiz ? a[0] : a[1], bi = horiz ? b[0] : b[1];
    var kk = (L - ai) / (bi - ai);
    return [a[0] + (b[0] - a[0]) * kk, a[1] + (b[1] - a[1]) * kk];
  }
  for (var i = 0; i < p.length; i++) {
    var cur = p[i], prv = p[(i + p.length - 1) % p.length];
    var ci = inside(cur), pi = inside(prv);
    if (ci) {
      if (!pi) out.push(cross(prv, cur));
      out.push(cur);
    } else if (pi) {
      out.push(cross(prv, cur));
    }
  }
  return out;
}
function foldSegment(sh, sf) {
  /* the chord where the fold line crosses the polygon (source space) */
  var pts = [];
  for (var i = 0; i < sh.poly.length; i++) {
    var a = sh.poly[i], b = sh.poly[(i + 1) % sh.poly.length];
    var horiz = (sh.edge === 0 || sh.edge === 1);
    var L = (sh.edge === 0) ? foldLineX(sh, sf) : (sh.edge === 1) ? foldLineRX(sh, sf)
          : (sh.edge === 2) ? foldLineY(sh, sf) : foldLineRY(sh, sf);
    var ai = horiz ? a[0] : a[1], bi = horiz ? b[0] : b[1];
    if ((ai - L) * (bi - L) < 0) {
      var kk = (L - ai) / (bi - ai);
      pts.push([a[0] + (b[0] - a[0]) * kk, a[1] + (b[1] - a[1]) * kk]);
    }
  }
  return pts.length === 2 ? pts : null;
}

/* draw one shape with its points mapped through fn */
function drawShape(shp, fn) {
  ctx.beginPath();
  for (var i = 0; i < shp.pts.length; i++) {
    var q = fn(shp.pts[i][0], shp.pts[i][1]);
    if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
  }
  ctx.closePath();
  ctx.globalAlpha = shp.alpha;
  ctx.fillStyle = shp.fill;
  ctx.fill();
  ctx.globalAlpha = 1;
}
function tracePath(pts, fn) {
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    var q = fn(pts[i][0], pts[i][1]);
    if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
  }
  ctx.closePath();
}

/* ---------- background (never lifted) ---------- */
function drawBackground(step) {
  /* sky */
  ctx.fillStyle = '#D9CAA6';
  ctx.fillRect(0, 0, SW, 432);
  ctx.fillStyle = 'rgba(122,154,160,0.38)';
  ctx.fillRect(0, 0, SW, 118);
  ctx.fillStyle = 'rgba(122,154,160,0.16)';
  ctx.fillRect(0, 118, SW, 92);
  ctx.fillStyle = '#C2B28C';
  ctx.fillRect(0, 406, SW, 26);
  /* tornado: layered flat blobs + a tapering funnel */
  ctx.fillStyle = '#8A8175';
  ellDraw(690, 148, 215, 40);
  ctx.fillStyle = '#7D7468';
  ellDraw(618, 118, 182, 47);
  ellDraw(742, 138, 150, 34);
  ctx.fillStyle = '#6B6257';
  ellDraw(742, 102, 148, 40);
  ellDraw(655, 96, 120, 30);
  var rows = 9, r;
  for (r = 0; r < rows; r++) {
    var yy = 158 + r * 30.5;
    var wTop = lerp(118, 15, r / rows), wBot = lerp(118, 15, (r + 1) / rows);
    var xc = lerp(690, 664, r / rows), xc2 = lerp(690, 664, (r + 1) / rows);
    ctx.fillStyle = (r % 2 === 0) ? '#7D7468' : '#6B6257';
    ctx.beginPath();
    ctx.moveTo(xc - wTop, yy); ctx.lineTo(xc + wTop, yy);
    ctx.lineTo(xc2 + wBot, yy + 31); ctx.lineTo(xc2 - wBot, yy + 31);
    ctx.closePath(); ctx.fill();
  }
  /* ground */
  ctx.fillStyle = '#B3A180';
  ctx.fillRect(0, 432, SW, SH - 432);
  ctx.strokeStyle = 'rgba(138,122,94,0.35)';
  ctx.lineWidth = 1.6;
  for (var g = 0; g < 44; g++) {
    var gx = ihash(g, 31, SEED) * SW, gy = 448 + ihash(g, 32, SEED) * 230;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + 7, gy - 3); ctx.stroke();
  }
  /* road: perspective band with converging edges */
  ctx.fillStyle = '#9A8C74';
  ctx.beginPath();
  ctx.moveTo(428, SH); ctx.lineTo(572, SH); ctx.lineTo(521, 432); ctx.lineTo(479, 432);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#6E6152';
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(428, SH); ctx.lineTo(479, 432); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(572, SH); ctx.lineTo(521, 432); ctx.stroke();
  ctx.fillStyle = 'rgba(232,226,212,0.5)';
  for (var d = 0; d < 5; d++) {
    var fr = d / 5, fy = lerp(SH - 12, 446, fr * fr), fw = lerp(26, 5, fr);
    ctx.fillRect(500 - fw / 2, fy, fw, lerp(16, 4, fr));
  }
  /* distant grain elevator, far right */
  ctx.fillStyle = 'rgba(160,139,108,0.9)';
  ctx.fillRect(922, 330, 44, 102);
  ctx.beginPath(); ctx.moveTo(918, 330); ctx.lineTo(970, 330); ctx.lineTo(944, 306); ctx.closePath(); ctx.fill();
}
function ellDraw(cx, cy, rx, ry) {
  ctx.beginPath();
  for (var i = 0; i < 14; i++) {
    var a = i / 14 * TAU, x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}

/* ---------- main draw ---------- */
function draw(t) {
  var L = layout();
  ctx.fillStyle = DARK;
  ctx.fillRect(0, 0, W, H);
  /* film strip body */
  ctx.fillStyle = '#14110D';
  ctx.fillRect(L.stripX, L.stripY, L.stripW, L.stripH);
  /* sprocket holes */
  var sc = L.sc;
  ctx.fillStyle = SPROCKET;
  var holeW = 40 * sc, holeH = 27 * sc, gap = 62 * sc;
  var nH = Math.floor(L.stripH / gap);
  for (var sIdx = 0; sIdx < nH; sIdx++) {
    var hy = L.stripY + (sIdx + 0.5) * gap - holeH / 2;
    rrect(L.stripX + 23 * sc, hy, holeW, holeH, 6 * sc);
    rrect(L.stripX + L.stripW - 23 * sc - holeW, hy, holeW, holeH, 6 * sc);
  }
  /* scene */
  ctx.save();
  ctx.beginPath();
  ctx.rect(L.sceneX, L.sceneY, SW * sc, SH * sc);
  ctx.clip();
  ctx.translate(L.sceneX, L.sceneY);
  ctx.scale(sc, sc);
  var step = Math.floor(t * 12);
  /* gate weave */
  ctx.translate((ihash(step, 3, 9) - 0.5) * 2.4, (ihash(step, 4, 9) - 0.5) * 2.4);
  /* leader under everything */
  ctx.fillStyle = LEADER;
  ctx.fillRect(-4, -4, SW + 8, SH + 8);
  drawBackground(step);

  /* classify shards at t */
  var settledList = [], flightList = [], i, j;
  for (i = 0; i < shards.length; i++) {
    var stI = shardState(shards[i], t);
    if (stI.phase === 'settled') settledList.push(i);
    else if (stI.phase !== 'dormant') flightList.push(i);
  }
  var faded = {};
  if (settledList.length > 9) {
    for (i = 0; i < settledList.length - 9; i++) faded[settledList[i]] = true;
  }
  /* settled shard backings (skip fully settled-into-scene ones) */
  for (i = 0; i < settledList.length; i++) {
    var shS = shards[settledList[i]];
    if (faded[settledList[i]]) continue;
    var stS = shardState(shS, t);
    tracePath(shS.poly, function (x, y) { return shardPoint(shS, stS, t, x, y); });
    ctx.fillStyle = 'rgba(201,180,143,0.22)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,50,40,0.45)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }
  /* shapes not in flight, in order of their last settled owner */
  var order = [];
  for (i = 0; i < SHAPES.length; i++) {
    var shp = SHAPES[i], inflight = false, lastK = -1;
    for (j = 0; j < shp.owners.length; j++) {
      var owSt = shardState(shards[shp.owners[j]], t);
      if (owSt.phase === 'curl' || owSt.phase === 'drift' || owSt.phase === 'settle') inflight = true;
      else if (owSt.phase === 'settled') lastK = shp.owners[j];
    }
    if (!inflight) order.push({ i: i, lastK: lastK });
  }
  order.sort(function (a, b) { return (a.lastK - b.lastK) || (a.i - b.i); });
  for (i = 0; i < order.length; i++) {
    var shp2 = SHAPES[order[i].i];
    (function (shpF) {
      drawShape(shpF, function (x, y) {
        var px = x, py = y;
        for (var o = 0; o < shpF.owners.length; o++) {
          var ow = shards[shpF.owners[o]];
          var owS = shardState(ow, t);
          if (owS.phase === 'settled') {
            var q = shardPoint(ow, owS, t, px, py);
            px = q[0]; py = q[1];
          }
        }
        return [px, py];
      });
    })(shp2);
  }
  /* in-flight shards: leader, shadow, curled sheet */
  for (i = 0; i < flightList.length; i++) {
    var sh = shards[flightList[i]];
    var st = shardState(sh, t);
    /* blank leader where the sheet was */
    tracePath(sh.poly, function (x, y) { return [x, y]; });
    ctx.fillStyle = LEADER;
    ctx.fill();
    ctx.strokeStyle = 'rgba(26,23,18,0.28)';
    ctx.lineWidth = 1.3;
    ctx.stroke();
    var fn = function (x, y) { return shardPoint(sh, st, t, x, y); };
    /* soft shadow of the hovering sheet (flat polygon, no blur) */
    tracePath(sh.poly, function (x, y) { var q = fn(x, y); return [q[0] + 13, q[1] + 17]; });
    ctx.fillStyle = 'rgba(26,23,18,0.16)';
    ctx.fill();
    /* the sheet itself, drawn in two passes: silhouette region, then the
       flap. The fold mirror-flips the flap's winding, so the two regions
       cannot share one clip path (they would cancel); separate passes also
       make the folded part sit visibly ON the sheet, a layer thicker. */
    var pNow = clamp(st.p + (st.phase === 'curl' ? tugLiftFor(sh.k, t) : 0), 0, 1);
    var sfNow = pNow * 0.85;
    var mainReg = clipHalf(sh.poly, sh, sfNow, true);
    var flapReg = (pNow > 0.03) ? clipHalf(sh.poly, sh, sfNow, false) : [];
    var sheetPass = function (reg, shade) {
      if (!reg.length) return;
      ctx.save();
      tracePath(reg, fn);
      ctx.clip();
      tracePath(sh.poly, fn);
      ctx.fillStyle = 'rgba(201,180,143,0.30)';
      ctx.fill();
      for (var sj = 0; sj < sh.shapes.length; sj++) {
        var shpF2 = SHAPES[sh.shapes[sj]];
        /* if an earlier owner settled before this shard started, the
           shape's home already includes that offset */
        (function (shpIn, shIn, stIn) {
          drawShape(shpIn, function (x, y) {
            var px = x, py = y;
            for (var o = 0; o < shpIn.owners.length; o++) {
              var ow = shards[shpIn.owners[o]];
              if (ow.k >= shIn.k) break;
              var q = shardPoint(ow, { phase: 'settled', p: 0.18, prog: 1 }, t, px, py);
              px = q[0]; py = q[1];
            }
            return shardPoint(shIn, stIn, t, px, py);
          });
        })(shpF2, shIn0, stIn0);
      }
      if (shade) {
        tracePath(reg, fn);
        ctx.fillStyle = shade;
        ctx.fill();
      }
      ctx.restore();
    };
    var shIn0 = sh, stIn0 = st;
    sheetPass(mainReg, 'rgba(255,246,225,0.08)');
    sheetPass(flapReg, 'rgba(70,54,38,0.30)');
    var seg = (pNow > 0.03) ? foldSegment(sh, sfNow) : null;
    if (seg) {
      var sA = fn(seg[0][0], seg[0][1]), sB = fn(seg[1][0], seg[1][1]);
      ctx.beginPath();
      ctx.moveTo(sA[0], sA[1]); ctx.lineTo(sB[0], sB[1]);
      ctx.strokeStyle = 'rgba(50,40,30,0.6)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    /* sheet edges: silhouette and flap outlines */
    ctx.strokeStyle = 'rgba(60,50,40,0.55)';
    ctx.lineWidth = 1.5;
    if (mainReg.length) { tracePath(mainReg, fn); ctx.stroke(); }
    if (flapReg.length) { tracePath(flapReg, fn); ctx.stroke(); }
  }
  /* faded grain over the frame */
  for (var gi = 0; gi < 240; gi++) {
    var gx2 = ihash(gi, step, 41) * SW, gy2 = ihash(gi, step, 42) * SH;
    ctx.fillStyle = ihash(gi, step, 43) < 0.5 ? 'rgba(26,23,18,0.10)' : 'rgba(245,242,233,0.10)';
    ctx.fillRect(gx2, gy2, 1.8, 1.8);
  }
  ctx.restore();
  /* inner frame line */
  ctx.strokeStyle = 'rgba(245,242,233,0.20)';
  ctx.lineWidth = 1.2;
  ctx.strokeRect(L.sceneX, L.sceneY, SW * sc, SH * sc);
  /* pin the canvas CSS size (house rule) */
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
  ctx.lineTo(x + w, y + h - r);
  ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  ctx.lineTo(x + r, y + h);
  ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  ctx.lineTo(x, y + r);
  ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  ctx.closePath();
  ctx.fill();
}

/* ---------- interaction: tug a shard, double-tap reseeds ---------- */
var lastDownAt = -10;
function toScene(e) {
  var L = layout();
  var cx = (e.clientX !== undefined ? e.clientX : 0);
  var cy = (e.clientY !== undefined ? e.clientY : 0);
  return [(cx - L.sceneX) / L.sc, (cy - L.sceneY) / L.sc];
}
canvas.addEventListener('pointerdown', function (e) {
  var now = pieceNow();
  var pt = toScene(e);
  if (now - lastDownAt < 0.35) {          /* double-tap: reseed the peel order */
    salt += 1;
    tug = null;
    buildSchedule();
    lastDownAt = now;
    return;
  }
  lastDownAt = now;
  /* topmost in-flight shard under the pointer */
  var best = -1;
  for (var i = 0; i < shards.length; i++) {
    var st = shardState(shards[i], now);
    if (st.phase === 'dormant' || st.phase === 'settled') continue;
    var sh = shards[i];
    var outline = sh.poly.map(function (q) { return shardPoint(sh, st, now, q[0], q[1]); });
    if (pointInPoly(pt[0], pt[1], outline)) best = i;
  }
  if (best >= 0) tug = { k: best, sx: pt[0], sy: pt[1], dx: 0, dy: 0, relT: 0, released: false };
});
canvas.addEventListener('pointermove', function (e) {
  if (!tug || tug.released) return;
  var pt = toScene(e);
  var dx = pt[0] - tug.sx, dy = pt[1] - tug.sy;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len > 90) { dx *= 90 / len; dy *= 90 / len; }
  tug.dx = dx; tug.dy = dy;
});
function endTug() {
  if (!tug || tug.released) return;
  tug.released = true;
  tug.relT = pieceNow();
  /* half the tug stays with the shard when it adheres: help peel, never repair */
  var sh = shards[tug.k];
  var st = shardState(sh, tug.relT);
  if (st.phase !== 'settled') {
    sh.tugBake[0] += tug.dx * 0.5;
    sh.tugBake[1] += tug.dy * 0.5;
  }
  var mine = tug;
  tug = null;
  /* keep the decaying half visible via a ghost tug record */
  tug = { k: mine.k, sx: 0, sy: 0, dx: mine.dx, dy: mine.dy, relT: mine.relT, released: true };
}
canvas.addEventListener('pointerup', endTug);
canvas.addEventListener('pointercancel', endTug);

/* ---------- run ---------- */
draw(T0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    draw(pieceNow());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
