<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№103 · Bloom Cycle</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#241A30; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(242,201,216,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to open the bloom</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mixc(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function css(c){ return 'rgb('+Math.round(clamp(c[0],0,255))+','+Math.round(clamp(c[1],0,255))+','+Math.round(clamp(c[2],0,255))+')'; }
function ramp(stops,x){ x=clamp(x,0,1); const seg=x*(stops.length-1); const i=Math.min(stops.length-2,Math.floor(seg)); return mixc(stops[i],stops[i+1],seg-i); }

// No.103 Bloom Cycle (after teknosis_sis): software shader route,
// field sampled on a reduced grid (FIELD_CELL px) and drawn full-frame.
// Exactly 8 petals, each a cluster of 3 metaballs = 24 field sources.
// Petal k balls sit at radial fractions 0.30 / 0.58 / 0.84 of the petal
// reach, radii 0.125 / 0.118 / 0.10 in unit space. Blossom diameter is
// 75% of frame (reach 0.75 in unit space, frame half-height = 1).
// Open envelope: sine, open 6s then close 6s over the 12s loop.
const FIELD_CELL=8;
const LOOP=12;
const PETALS=8, PER=3;
const GROUND=hexRGB('#241A30'), VIOLET=hexRGB('#5A2B7A'), MAGENTA=hexRGB('#C94B8F'), PETAL=hexRGB('#F2C9D8'), TIP=hexRGB('#FFF3E8');
const STOPS=[VIOLET, MAGENTA, PETAL, TIP];
const REACH=0.75;
let openDrag=-1, dragging=false;

function sources(t, open){
  const src=[];
  const sway=0.05*Math.sin(2*Math.PI*t/LOOP);
  for(let i=0;i<PETALS;i++){
    const a=i*Math.PI/4 + sway + 0.06*Math.sin(2*Math.PI*t/LOOP + i*1.7); // Lissajous wobble per petal
    const ca=Math.cos(a), sa=Math.sin(a);
    const fr=[0.30,0.58,0.84], rr=[0.125,0.118,0.10];
    for(let k=0;k<PER;k++){
      const d=REACH*fr[k]*(0.22+0.78*open);
      const r=rr[k]*(0.45+0.55*open);
      src.push([ca*d, sa*d, r]);
    }
  }
  return src;
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h); const t=nowMs/1000;
  let open=0.5-0.5*Math.cos(2*Math.PI*t/LOOP);
  if(dragging && openDrag>=0) open=openDrag;
  const src=sources(t, open);
  const cell=isPhone()?FIELD_CELL+2:FIELD_CELL, cols=Math.ceil(w/cell), rows=Math.ceil(h/cell), m=Math.min(w,h)/2;
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    const u=((i+0.5)*cell-w/2)/m, v=((j+0.5)*cell-h/2)/m;
    let f=0;
    for(let s=0;s<src.length;s++){ const dx=u-src[s][0], dy=v-src[s][1]; f+=src[s][2]*src[s][2]/(dx*dx+dy*dy+0.006); }
    const body=smooth((f-0.80)/0.80);
    if(body<=0){ ctx.fillStyle=css(GROUND); ctx.fillRect(i*cell,j*cell,cell+1,cell+1); continue; }
    const rr=Math.sqrt(u*u+v*v);
    let pos=clamp((rr/REACH)*0.85 + body*0.18 - 0.12, 0, 1); // deep violet heart out to pale tips
    let col=ramp(STOPS, pos);
    const rim=Math.exp(-Math.pow(f-1.0,2)/0.05);
    col=mixc(col, TIP, rim*0.30*body); // fresnel-like rim
    ctx.fillStyle=css(mixc(GROUND, col, body)); ctx.fillRect(i*cell,j*cell,cell+1,cell+1);
  }
  console.assert(src.length===24,'field sources',src.length);
  return {};
}
function ptrY(e){ const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{top:0}; return e.clientY-r.top; }
canvas.addEventListener('pointerdown',e=>{ dragging=true; const [w,h]=viewportWH(); openDrag=clamp(1.18-(ptrY(e)/h)*1.36,0,1); });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; const [w,h]=viewportWH(); openDrag=clamp(1.18-(ptrY(e)/h)*1.36,0,1); });
function endP(){ dragging=false; openDrag=-1; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(6000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
