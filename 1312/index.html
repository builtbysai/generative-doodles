<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Windows</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #4A2C17; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, S = 0;
  var LOOP = 90;

  function viewportSize() {
    var vw, vh;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      vw = visualViewport.width; vh = visualViewport.height;
    } else {
      vw = window.innerWidth; vh = window.innerHeight;
    }
    return [vw, vh];
  }

  function sizeCanvas() {
    var v = viewportSize();
    W = Math.round(v[0]); H = Math.round(v[1]);
    S = Math.min(W, H);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // Dot helper: one subpath per dot, moveTo before every arc (node-canvas quirk).
  function dot(x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function poly(points, color, close) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    if (close) ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function strokePoly(points, color, width) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  // Soft shadow as layered flat-alpha rects (no shadowBlur, no gradients).
  function softShadow(x, y, w, h, ox, oy) {
    rect(x + ox * 1.8, y + oy * 1.8, w, h, 'rgba(20,12,6,0.10)');
    rect(x + ox, y + oy, w, h, 'rgba(20,12,6,0.18)');
  }

  function draw(t) {
    var loopIdx = Math.floor(t / LOOP);
    var lt = t - loopIdx * LOOP;
    var rng = mulberry32(1312000 + loopIdx * 7919);
    var cx = W / 2, cy = H / 2;

    // Raking light sweep: crosses the stack once per loop (first 75 s), then holds.
    var p = lt < 75 ? lt / 75 : 1;
    // Shadow direction shifts with the light.
    var shx = -7 + 14 * p, shy = 5 + 6 * p;

    // Curl flutter: one flutter event mid-loop, decaying, then settled.
    var curl = 1;
    if (lt >= 30 && lt < 38) {
      var u = (lt - 30) / 8;
      curl = 1 + Math.sin(u * Math.PI * 2) * 0.45 * (1 - u);
    }

    // ---- Layer 3: shellac floor, fills the field ----
    rect(0, 0, W, H, '#6E4426');
    var planks = 8, ph = H / planks;
    for (var i = 0; i < planks; i++) {
      var y0 = i * ph;
      var tone = rng();
      rect(0, y0, W, ph, tone < 0.5 ? 'rgba(74,44,23,0.16)' : 'rgba(140,90,50,0.10)');
      rect(0, y0, W, Math.max(1, S * 0.002), 'rgba(30,18,8,0.55)');
      // Grain lines.
      for (var g = 0; g < 3; g++) {
        var gy = y0 + ph * (0.2 + 0.3 * g) + (rng() - 0.5) * ph * 0.1;
        var pts = [];
        for (var gx = 0; gx <= 8; gx++) {
          pts.push([gx * W / 8, gy + Math.sin(gx * 1.3 + i) * ph * 0.06]);
        }
        strokePoly(pts, 'rgba(40,24,12,0.35)', Math.max(1, S * 0.0012));
      }
      // Knots, seeded, sparse.
      if (rng() < 0.6) {
        var kx = rng() * W, ky = y0 + ph * (0.3 + rng() * 0.4);
        var kr = S * (0.008 + rng() * 0.008);
        dot(kx, ky, kr * 1.8, 'rgba(40,24,12,0.35)');
        dot(kx, ky, kr, '#4A2C17');
      }
    }
    // Floor sheen: two flat low-alpha bands.
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.35);
    rect(-W, -H * 0.18, W * 2, H * 0.10, 'rgba(240,220,180,0.05)');
    rect(-W, H * 0.22, W * 2, H * 0.06, 'rgba(240,220,180,0.04)');
    ctx.restore();

    // ---- Layer 2: worn document, central 70%, rotated ~4 degrees ----
    var doc = S * 0.70;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(4 * Math.PI / 180);
    softShadow(-doc / 2, -doc / 2, doc, doc, shx, shy);
    rect(-doc / 2, -doc / 2, doc, doc, '#D8CDB8');
    // Age blotches, flat alpha.
    for (var b = 0; b < 6; b++) {
      dot(-doc / 2 + rng() * doc, -doc / 2 + rng() * doc, S * (0.02 + rng() * 0.04), 'rgba(120,100,70,0.08)');
    }
    // Torn right edge: jagged strip darker than the paper.
    var jag = [[doc / 2, -doc / 2]];
    for (var ty = -doc / 2; ty <= doc / 2; ty += doc / 14) {
      jag.push([doc / 2 - rng() * S * 0.012, ty]);
    }
    jag.push([doc / 2, doc / 2]);
    poly(jag, 'rgba(90,75,55,0.35)', true);
    // Folded corner, top-left: folded triangle + fold line.
    var fc = doc * 0.14;
    poly([[-doc / 2, -doc / 2], [-doc / 2 + fc, -doc / 2], [-doc / 2, -doc / 2 + fc]], '#C4B69C', true);
    strokePoly([[-doc / 2 + fc, -doc / 2], [-doc / 2, -doc / 2 + fc]], 'rgba(42,36,28,0.5)', Math.max(1, S * 0.0015));
    // Headline band: abstract dash marks only, half-obscured by an ink blotch. No readable words.
    var hbY = -doc / 2 + doc * 0.10, hbH = doc * 0.075;
    rect(-doc / 2 + doc * 0.08, hbY, doc * 0.84, hbH, 'rgba(42,36,28,0.85)');
    for (var d = 0; d < 14; d++) {
      var dx = -doc / 2 + doc * 0.10 + d * doc * 0.058;
      rect(dx, hbY + hbH * 0.3, doc * (0.02 + rng() * 0.025), hbH * 0.4, '#D8CDB8');
    }
    dot(doc * 0.22, hbY + hbH * 0.5, doc * 0.055, 'rgba(42,36,28,0.55)');
    // Ink scrawl doodles: loose polylines, never letterforms.
    for (var s = 0; s < 4; s++) {
      var sx = -doc / 2 + doc * (0.12 + rng() * 0.6), sy = -doc / 2 + doc * (0.35 + rng() * 0.5);
      var sp = [];
      for (var k = 0; k < 7; k++) {
        sp.push([sx + (rng() - 0.5) * doc * 0.22, sy + (k - 3) * doc * 0.02 + (rng() - 0.5) * doc * 0.03]);
      }
      strokePoly(sp, 'rgba(42,36,28,0.55)', Math.max(1, S * 0.0012));
    }

    // ---- Layer 1: snapshot, 28% of field area (side ~0.52S), rotated -7 deg from document ----
    var snap = S * 0.52;
    var sox = doc * 0.06, soy = doc * 0.02;
    ctx.save();
    ctx.translate(sox, soy);
    ctx.rotate(-7 * Math.PI / 180);
    softShadow(-snap / 2, -snap / 2, snap, snap, shx * 0.7, shy * 0.7);
    // White border with worn edges.
    rect(-snap / 2, -snap / 2, snap, snap, '#F0EBDD');
    var img = snap * 0.88;
    rect(-img / 2, -img / 2, img, img, '#8A9678');
    // Snapshot image: soft faded blobs only, no faces, no real photo.
    dot(-img * 0.18, -img * 0.10, img * 0.26, 'rgba(201,123,94,0.75)');
    dot(img * 0.20, img * 0.05, img * 0.22, 'rgba(91,113,134,0.70)');
    dot(0, img * 0.22, img * 0.18, 'rgba(201,123,94,0.55)');
    dot(-img * 0.05, -img * 0.28, img * 0.12, 'rgba(240,235,221,0.65)');
    // Pearls: small pale dots in a loose arc.
    for (var pi = 0; pi < 6; pi++) {
      dot(-img * 0.30 + pi * img * 0.09, img * 0.30 + Math.sin(pi * 0.9) * img * 0.03, img * 0.022, 'rgba(240,235,221,0.9)');
    }
    // Barbecue grill: abstract dark grid, low alpha.
    ctx.save();
    ctx.translate(img * 0.05, -img * 0.25);
    ctx.rotate(0.15);
    for (var gi = 0; gi < 5; gi++) {
      rect(-img * 0.16 + gi * img * 0.07, -img * 0.05, Math.max(1, S * 0.0015), img * 0.10, 'rgba(42,36,28,0.45)');
    }
    rect(-img * 0.18, -img * 0.01, img * 0.32, Math.max(1, S * 0.0015), 'rgba(42,36,28,0.45)');
    ctx.restore();
    // Faded wash over the image.
    rect(-img / 2, -img / 2, img, img, 'rgba(240,235,221,0.14)');
    // Curl hack, top-right corner ONLY: corner lifts, catches a highlight.
    var cs = snap * 0.16 * curl;
    ctx.save();
    ctx.translate(snap / 2, -snap / 2);
    // Shadow of the lifted corner onto the image.
    poly([[0, 0], [-cs, 0], [0, cs]], 'rgba(30,20,10,0.28)', true);
    // The curled flap itself, lighter, with a highlight streak.
    poly([[0, 0], [-cs, 0], [-cs * 0.35, cs * 0.35], [0, cs]], '#FBF8F0', true);
    strokePoly([[-cs, 0], [-cs * 0.35, cs * 0.35]], 'rgba(42,36,28,0.35)', Math.max(1, S * 0.001));
    rect(-cs * 0.7, cs * 0.08, cs * 0.5, Math.max(1, S * 0.002), 'rgba(255,255,255,0.75)');
    ctx.restore();
    ctx.restore(); // snapshot
    ctx.restore(); // document

    // ---- Raking light sweep band, flat alpha ----
    var lx = (-0.25 + p * 1.5) * W;
    ctx.save();
    ctx.translate(lx, H / 2);
    ctx.rotate(0.22);
    rect(-W * 0.06, -H, W * 0.12, H * 2, 'rgba(255,240,200,0.06)');
    ctx.restore();
  }

  // Boot: frame one is exactly draw(0). The clock starts with the rAF loop.
  sizeCanvas();
  draw(0);
  var booted = true;

  var start = null;
  function nowMs() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return Date.now();
  }
  function loop() {
    if (start === null) start = nowMs();
    var t = (nowMs() - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  function onResize() {
    sizeCanvas();
    // Redraw at the current piece time, never restarting the performance.
    if (booted) {
      var t = start === null ? 0 : (nowMs() - start) / 1000;
      draw(t);
    }
  }
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
