<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circles Talking to Circles</title>
<style>
html, body { margin: 0; padding: 0; background: #ECEFF1; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#ECEFF1';
var SLATE = '#5A7A9A';
var TEAL = '#4E9A94';
var DEEP = '#2E4E6E';
var LOOP = 30;                     // seamless loop, seconds
var N = 36;                        // nodes per ring, fixed angular spacing
var GOLDEN = 2.39996322972865332;  // golden angle, per-node pulse phase
// GSTEP: the golden-angle stagger adjusted by the exact wrap remainder so
// 36 steps close to a whole number of turns (36*GSTEP is a multiple of
// TAU). The raw golden angle does not close over 36 nodes, which would
// break the seamless loop at the wrap node; GSTEP keeps the stagger
// (2.269 rad vs the golden 2.400) and makes the ring periodic.
var GSTEP = GOLDEN - ((N * GOLDEN) % TAU) / N;
var RINGS = [0.135, 0.255, 0.375];// ring radii as fraction of minDim
var HOLE = 0.05;                   // center hole radius, fraction of minDim
// Structured edge rule table: [ringDelta, indexStep, color].
// Same-ring steps 7 and 15 draw star polygons; cross-ring steps tie the
// rings into nested rosettes. No random edges.
var RULES = [
  [0, 7, SLATE],
  [0, 15, SLATE],
  [1, 5, TEAL],
  [1, -5, TEAL],
  [-1, 11, DEEP]
];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var seed = 1574;
var edges = [];                    // {r1,i1,r2,i2,color}, deduplicated
var placedW = 0, placedH = 0;

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
// Build the edge list once from the rule table. The table is index-shift
// invariant, so rotating the whole system by one node spacing maps the
// pattern onto itself: the loop is seamless.
function buildEdges() {
  var seen = {};
  edges = [];
  var r, i, k;
  for (r = 0; r < 3; r++) {
    for (i = 0; i < N; i++) {
      for (k = 0; k < RULES.length; k++) {
        var dr = RULES[k][0], step = RULES[k][1];
        var r2 = r + dr;
        if (r2 < 0 || r2 > 2) continue;
        var i2 = ((i + step) % N + N) % N;
        var a = r + ',' + i, b = r2 + ',' + i2;
        var key = a < b ? a + '|' + b : b + '|' + a;
        if (seen[key]) continue;
        seen[key] = true;
        edges.push({ r1: r, i1: i, r2: r2, i2: i2, color: RULES[k][2] });
      }
    }
  }
  placedW = VW; placedH = VH;
}
// Node position at time t: slow rotation (exactly one node spacing per
// 30 s loop, so the pattern returns to itself) plus a radial pulse whose
// phase is index times the golden angle. Both are whole cycles of LOOP.
function nodePos(r, i, t, minDim, cx, cy) {
  var rot = (TAU / N) * (t / LOOP);
  var ringPhase = r * TAU / 72;
  var ang = rot + ringPhase + i * TAU / N;
  // Radial pulse, phase staggered by index times the golden angle. The
  // extra t*GSTEP/LOOP drift makes the pulse pattern itself advance by
  // exactly one node over the loop, so node i at t=30 sits where node i+1
  // sat at t=0 with node i+1's pulse: the 30 s loop is seamless.
  var pulse = 0.012 * minDim * Math.sin(TAU * t / LOOP + i * GSTEP + t * GSTEP / LOOP);
  var rad = RINGS[r] * minDim + pulse;
  return { x: cx + Math.cos(ang) * rad, y: cy + Math.sin(ang) * rad };
}
function draw(t) {
  lastT = t;
  size();
  if (edges.length === 0 || placedW !== VW || placedH !== VH) buildEdges();
  var minDim = Math.min(VW, VH);
  var u = minDim / 900;
  var cx = VW / 2, cy = VH / 2;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  // Chord lines first, under the nodes.
  var e, p1, p2;
  ctx.lineWidth = Math.max(0.7, 1.1 * u);
  for (var ei = 0; ei < edges.length; ei++) {
    e = edges[ei];
    p1 = nodePos(e.r1, e.i1, t, minDim, cx, cy);
    p2 = nodePos(e.r2, e.i2, t, minDim, cx, cy);
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = e.color;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // Nodes: small deep-blue discs.
  var r, i;
  var nodeR = Math.max(1.6, 2.6 * u);
  ctx.fillStyle = DEEP;
  for (r = 0; r < 3; r++) {
    for (i = 0; i < N; i++) {
      var p = nodePos(r, i, t, minDim, cx, cy);
      ctx.beginPath();
      ctx.moveTo(p.x + nodeR, p.y);
      ctx.arc(p.x, p.y, nodeR, 0, TAU);
      ctx.fill();
    }
  }
  // Center hole: repaint the ground over any chord that crossed it, then
  // a hairline outline so the empty circle reads as the anchor.
  var holeR = HOLE * minDim;
  ctx.fillStyle = GROUND;
  ctx.beginPath(); ctx.moveTo(cx + holeR, cy); ctx.arc(cx, cy, holeR, 0, TAU); ctx.fill();
  ctx.strokeStyle = DEEP;
  ctx.lineWidth = Math.max(1, 1.4 * u);
  ctx.beginPath(); ctx.moveTo(cx + holeR, cy); ctx.arc(cx, cy, holeR, 0, TAU); ctx.stroke();
  // Caption: title, formula date, watch-only cue. Deep-blue chip, pale text.
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'Circles Talking to Circles  ·  2006 · 05 · 04  ·  Watch the loom sweep.';
  ctx.font = fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  var pad = Math.round(fs * 0.7);
  var bx = Math.round(fs * 0.8), by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  ctx.fillStyle = DEEP;
  ctx.fillRect(bx - pad, by, Math.ceil(tw) + 2 * pad, fs + 2 * pad);
  ctx.fillStyle = GROUND;
  ctx.textBaseline = 'top';
  ctx.fillText(label, bx, by + pad);
  if (typeof window !== 'undefined') {
    window.__p1574 = {
      t: t, seed: seed, nodes: 3 * N, edges: edges.length,
      holeR: holeR, phone: isPhone()
    };
  }
}
// Watch-only: no pointer interaction of any kind.
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
