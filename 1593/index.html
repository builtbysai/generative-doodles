<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Hundred Eighty Degrees</title>
<style>
html, body { margin: 0; padding: 0; background: #050508; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BG = [5, 5, 8];
var PHASE = 52.36;
var R = 1.0;
var STRIPW = 0.28;
var NU = 256;
var NV = 8;
var STOPS = [
  [0.00, [46, 232, 200]],
  [0.33, [122, 232, 240]],
  [0.66, [232, 232, 74]],
  [1.00, [240, 90, 168]]
];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function gradAt(u) {
  var i, s0 = STOPS[0], s1 = STOPS[STOPS.length - 1];
  for (i = 0; i < STOPS.length - 1; i++) {
    if (u <= STOPS[i + 1][0]) { s0 = STOPS[i]; s1 = STOPS[i + 1]; break; }
  }
  var f = (u - s0[0]) / (s1[0] - s0[0]);
  if (f < 0) f = 0; if (f > 1) f = 1;
  return [
    Math.round(s0[1][0] + (s1[1][0] - s0[1][0]) * f),
    Math.round(s0[1][1] + (s1[1][1] - s0[1][1]) * f),
    Math.round(s0[1][2] + (s1[1][2] - s0[1][2]) * f)
  ];
}
/* Precomputed Mobius grid with hand jitter. Seeded, fixed, deterministic.
   Wrap rule: grid point (NU, j) is the same physical point as (0, NV-j),
   so its jitter is copied, never re-rolled, or the seam would crack. */
var JIT = [];
var GRID = [];
(function () {
  var rng = mulberry32(1593);
  var i, j;
  for (i = 0; i <= NU; i++) {
    JIT[i] = [];
    for (j = 0; j <= NV; j++) {
      if (i === NU) { JIT[i][j] = JIT[0][NV - j]; continue; }
      JIT[i][j] = [(rng() - 0.5) * 0.012, (rng() - 0.5) * 0.012, (rng() - 0.5) * 0.012];
    }
  }
  for (i = 0; i <= NU; i++) {
    GRID[i] = [];
    var u = (i / NU) * TAU;
    var cu = Math.cos(u), su = Math.sin(u), h = Math.cos(u / 2), hs = Math.sin(u / 2);
    for (j = 0; j <= NV; j++) {
      var v = -1 + (j / NV) * 2;
      var rad = R + v * STRIPW * h;
      GRID[i][j] = [
        rad * cu + JIT[i][j][0],
        rad * su + JIT[i][j][1],
        v * STRIPW * hs + JIT[i][j][2]
      ];
    }
  }
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var lastT = PHASE;
var tiltX = 0, tiltY = 0;
var dragging = false, lastPX = 0, lastPY = 0;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function minDim() { return Math.min(VW, VH); }
function scaleF() { return minDim() / 900 + 0.4; }
function rotPoint(p, rx, ry, rz) {
  var x = p[0], y = p[1], z = p[2];
  var cy = Math.cos(ry), sy = Math.sin(ry);
  var x1 = x * cy + z * sy, z1 = -x * sy + z * cy, y1 = y;
  var cx = Math.cos(rx), sx = Math.sin(rx);
  var y2 = y1 * cx - z1 * sx, z2 = y1 * sx + z1 * cx, x2 = x1;
  var cz = Math.cos(rz), sz = Math.sin(rz);
  var x3 = x2 * cz - y2 * sz, y3 = x2 * sz + y2 * cz;
  return [x3, y3, z2];
}
function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = 'rgb(' + BG[0] + ',' + BG[1] + ',' + BG[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var S = minDim() * 0.27;
  var rx = 0.38 + 0.12 * Math.sin(t * 0.16) + tiltX;
  var ry = 0.12 * t + tiltY;
  var rz = 0.18 * Math.sin(t * 0.11);
  /* Project the whole grid once per frame. */
  var P = [];
  var i, j;
  for (i = 0; i <= NU; i++) {
    P[i] = [];
    for (j = 0; j <= NV; j++) {
      var r = rotPoint(GRID[i][j], rx, ry, rz);
      var persp = 1 / (1 - 0.10 * r[2]);
      P[i][j] = {
        x: VW / 2 + r[0] * S * persp,
        y: VH / 2 - r[1] * S * persp,
        z: r[2]
      };
    }
  }
  /* Painter's sort: far quads first so the translucent band shows
     itself passing behind itself. */
  var quads = [];
  for (i = 0; i < NU; i++) {
    var um = (i + 0.5) / NU;
    var col = gradAt(um);
    for (j = 0; j < NV; j++) {
      var z = (P[i][j].z + P[i + 1][j].z + P[i + 1][j + 1].z + P[i][j + 1].z) / 4;
      quads.push({ i: i, j: j, z: z, col: col });
    }
  }
  quads.sort(function (a, b) { return a.z - b.z; });
  for (var q = 0; q < quads.length; q++) {
    var qq = quads[q];
    var a = P[qq.i][qq.j], b = P[qq.i + 1][qq.j], c = P[qq.i + 1][qq.j + 1], d = P[qq.i][qq.j + 1];
    var seam = (qq.i === 0);
    var alpha = seam ? 0.68 : 0.5;
    var cc = qq.col;
    if (seam) cc = [Math.round((cc[0] + 255) / 2), Math.round((cc[1] + 255) / 2), Math.round((cc[2] + 255) / 2)];
    ctx.fillStyle = rgba(cc, alpha);
    ctx.strokeStyle = rgba(cc, alpha);
    ctx.lineWidth = 0.75;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineTo(c.x, c.y);
    ctx.lineTo(d.x, d.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  /* Soft white edge glow, per segment so far edges dim and near edges shine. */
  var e, v;
  for (v = 0; v <= NV; v += NV) {
    for (e = 0; e < NU; e++) {
      var p0 = P[e][v], p1 = P[e + 1][v];
      var zm = (p0.z + p1.z) / 2;
      var ea = 0.16 + 0.42 * ((zm + 1.3) / 2.6);
      ctx.strokeStyle = rgba([255, 255, 255], ea);
      ctx.lineWidth = 1.1 * scaleF();
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
  }
  /* The seam: a 2px brightness notch across the band at the 180-degree
     twist, where the gradient flips. Plus a soft halo so it reads. */
  var seamPts = [];
  for (j = 0; j <= NV; j++) seamPts.push(P[0][j]);
  ctx.strokeStyle = rgba([255, 255, 255], 0.28);
  ctx.lineWidth = 5 * scaleF();
  ctx.beginPath();
  ctx.moveTo(seamPts[0].x, seamPts[0].y);
  for (j = 1; j <= NV; j++) ctx.lineTo(seamPts[j].x, seamPts[j].y);
  ctx.stroke();
  ctx.strokeStyle = rgba([255, 255, 255], 0.95);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(seamPts[0].x, seamPts[0].y);
  for (j = 1; j <= NV; j++) ctx.lineTo(seamPts[j].x, seamPts[j].y);
  ctx.stroke();
  /* Visible copy. */
  var pad = isPhone ? 14 : 22;
  var titlePx = isPhone ? 12 : 15;
  ctx.font = titlePx + 'px monospace';
  ctx.fillStyle = rgba([255, 255, 255], 0.85);
  ctx.fillText('One Hundred Eighty Degrees', pad, pad + titlePx);
  ctx.font = (isPhone ? 10 : 12) + 'px monospace';
  ctx.fillStyle = rgba([255, 255, 255], 0.55);
  ctx.fillText('2006 \u00b7 05 \u00b7 23', pad, pad + titlePx + 20);
  var hintPx = isPhone ? 10 : 12;
  ctx.font = hintPx + 'px monospace';
  ctx.fillStyle = rgba([255, 255, 255], 0.7);
  ctx.fillText('Drag to tilt.', pad, VH - pad);
}
function onPointerDown(e) {
  dragging = true;
  lastPX = e.clientX; lastPY = e.clientY;
}
function onPointerMove(e) {
  if (!dragging) return;
  tiltY += (e.clientX - lastPX) * 0.005;
  tiltX += (e.clientY - lastPY) * 0.005;
  lastPX = e.clientX; lastPY = e.clientY;
}
function onPointerUp(e) { dragging = false; }
canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
var startT = null;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (err) { reduced = false; }
}
function loop(ts) {
  if (startT === null) startT = ts;
  var t = PHASE + (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (!reduced && typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
