<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noise Halftone</title>
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// Noise Halftone (EXPANSION #88 okazzsp, block 3)
// Built in okazzsp's live build order: grid first, shape second, one
// binary rule third, a noise-driven parameter fourth. A strict grid of
// circles on white; a slow value-noise field sets every radius, so the
// grid breathes as a halftone. The one binary rule: circles left of a
// swaying vertical divide are solid, right of it hollow rings.
// Black and white only. No image hides in the field; it is pure noise.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  paper: '#FFFFFF',
  ink: '#111111'
};

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, isPhone = false;
var T = 30; // seconds per loop; noise path and divide share this period

// ---------------------------------------------------------------------------
// Epoch state. Frame one is the epoch at loop t=0, drawn synchronously.
// A tap starts a new epoch with a fresh noise seed; the loop itself never
// reseeds, so it closes exactly on the same field every 30 seconds.
// ---------------------------------------------------------------------------
var baseSeed = 72288;
var epochIndex = 0;
var epochStart = 0; // performance.now() timestamp of epoch start
var forcedT = -1;
(function () {
  try {
    var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(location.search || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (e) { /* inert hook, QA only */ }
})();

// ---------------------------------------------------------------------------
// Seeded value noise. Lattice values come from an integer hash of the
// lattice point and the epoch seed (mulberry32-family mixing), so a seed
// fully determines the field with no stored lattice. Smoothstep
// interpolation keeps radii easing, never jumping.
// ---------------------------------------------------------------------------
function lattice(ix, iy, seed) {
  var h = seed ^ Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function vnoise(x, y, seed) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  var u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  var a = lattice(ix, iy, seed), b = lattice(ix + 1, iy, seed);
  var c = lattice(ix, iy + 1, seed), d = lattice(ix + 1, iy + 1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// Two octaves: broad swells with a finer ripple on top.
function field(x, y, seed) {
  var n = 0.68 * vnoise(x, y, seed) + 0.32 * vnoise(x * 2.3 + 40, y * 2.3 + 40, seed ^ 0x9E3779B9);
  return Math.min(1, Math.max(0, n / 0.92));
}

function draw(t) {
  if (W === 0 || H === 0) return;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  var seed = baseSeed + epochIndex * 7919;
  var side = Math.min(W, H);
  var ox = (W - side) / 2, oy = (H - side) / 2;
  var N = isPhone ? 22 : 26;             // probes per side
  var margin = side * 0.045;
  var cell = (side - margin * 2) / N;
  var maxR = cell * 0.46;                // small gaps even at full swell

  // Loop closure: the noise sampling offset travels a CIRCLE in noise
  // space with the loop period, so the field at t=T is the field at t=0
  // by construction (loop time is taken modulo T, so t=T is t=0).
  // The circle's diagonal bias makes the swells drift diagonally.
  var ph = (t / T) * Math.PI * 2;
  var pathR = 2.6;
  var nx = pathR * Math.cos(ph) + pathR * 0.7071 * Math.sin(ph);
  var ny = pathR * Math.sin(ph);

  // The divide: near 55% of the field width, swaying a few percent with
  // the same period, starting centered at loop t=0.
  var fieldW = side - margin * 2;
  var divideX = ox + margin + fieldW * (0.55 + 0.035 * Math.sin(ph));

  ctx.fillStyle = COL.paper;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = COL.ink;
  ctx.strokeStyle = COL.ink;

  var freq = 0.155; // noise units per cell: swells span several probes
  var gx, gy, cx, cy, n, r;
  for (gy = 0; gy < N; gy++) {
    for (gx = 0; gx < N; gx++) {
      cx = ox + margin + cell * (gx + 0.5);
      cy = oy + margin + cell * (gy + 0.5);
      n = field(gx * freq + nx + 100, gy * freq + ny + 100, seed);
      r = maxR * (0.06 + 0.94 * Math.pow(n, 1.25));
      if (r < 0.4) r = 0.4; // even the shallowest probe leaves a dot
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      if (cx < divideX) {
        ctx.fill();
      } else {
        ctx.lineWidth = Math.max(0.8, Math.min(r * 0.42, cell * 0.15));
        ctx.stroke();
      }
    }
  }
}

// ---------------------------------------------------------------------------
// Sizing and main loop.
// ---------------------------------------------------------------------------
function resize() {
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = Math.round(vw);
  H = Math.round(vh);
  canvas.width = W;
  canvas.height = H;
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  // Before the loop starts, every draw is frame one at exactly t=0.
  draw(forcedT >= 0 ? forcedT : (loopStarted ? currentT() : 0));
}

var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
epochStart = startStamp;
function currentT() {
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp;
  var t = (now - epochStart) / 1000;
  return t % T;
}

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (window.addEventListener) window.addEventListener('resize', resize);

// TAP reseeds: a fresh noise field for the next epoch.
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function () {
    epochIndex += 1;
    epochStart = (typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp;
    draw(0);
  });
}

// Frame one: synchronous draw at loop t=0 (deterministic; never clock-derived).
resize();

var loopStarted = false;
if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    loopStarted = true;
    if (forcedT < 0) draw(currentT());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
