  ['pelvis', 'hipL', TEAL], ['hipL', 'kneeL', TEAL], ['kneeL', 'footL', TEAL],

}
/* ---- camera drift from pointer (gentle, never a scrub) ---- */
var driftX = 0, driftY = 0, targetX = 0, targetY = 0;
function onPointer(x, y) {
  if (!VW || !VH) return;
  targetX = clamp((x / VW) * 2 - 1, -1, 1);
  targetY = clamp((y / VH) * 2 - 1, -1, 1);
}

}
/* ---- stage mapping: full-bleed, figure centered, low three-quarter ---- */
function stage() {
  var unit = isPhone ? Math.min(VW * 1.05, VH * 0.62) : Math.min(VW * 0.9, VH * 1.05);

function toPx(st, p, mirror) {
