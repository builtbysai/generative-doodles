<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№19 · Stitch</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2ecdc; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(60,54,44,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(242,236,220,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another stitch</div>
<script>
'use strict';
// No19 Stitch.
// Cross-stitch as a system: a grid of cells, each either empty or
// holding one X of two crossed strokes. Whether a cell is stitched,
// and in which of two inks (charcoal or vermilion on cream), is
// decided by one smooth seeded field read against a threshold, so
// the stitches gather into a soft continent with a ragged coast
// instead of scattering. The field is sampled at cell centers; the
// threshold is set per seed so coverage lands in a middle band.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '19', 10) || 19;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f2ecdc';
const N = 34;

function fieldAt(p, u, v) {
  return 0.5
    + 0.30 * Math.sin(u * p.a1 * Math.PI * 2 + p.p1) * Math.sin(v * p.a2 * Math.PI * 2 + p.p2)
    + 0.20 * Math.sin((u + v) * p.a3 * Math.PI + p.p3);
}

function compose(s) {
  const rnd = mulberry32(s);
  const p = {
    a1: 0.8 + rnd() * 1.1, a2: 0.8 + rnd() * 1.1, a3: 1.2 + rnd() * 1.4,
    p1: rnd() * Math.PI * 2, p2: rnd() * Math.PI * 2, p3: rnd() * Math.PI * 2
  };
  // threshold chosen from the sampled distribution for a target coverage
  const vals = [];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) vals.push(fieldAt(p, (i + 0.5) / N, (j + 0.5) / N));
  vals.sort((x, y) => x - y);
  const target = 0.34 + rnd() * 0.14;
  p.thresh = vals[Math.floor(vals.length * (1 - target))];
  p.redLine = p.thresh + 0.16 + rnd() * 0.08;   // field above this stitches vermilion
  p.coverage = target;
  p.ok = target > 0.3;
  return p;
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  const cell = RX / N, cellY = RY / N;
  const inset = 0.22;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1, Math.min(cell, cellY) / 9);
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const f = fieldAt(p, (i + 0.5) / N, (j + 0.5) / N);
      if (f < p.thresh) continue;
      ctx.strokeStyle = f > p.redLine ? '#b3402a' : '#2e2a24';
      const x0 = ox + (i + inset) * cell, x1 = ox + (i + 1 - inset) * cell;
      const y0 = oy + (j + inset) * cellY, y1 = oy + (j + 1 - inset) * cellY;
      ctx.beginPath();
      ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
      ctx.moveTo(x1, y0); ctx.lineTo(x0, y1);
      ctx.stroke();
    }
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
