<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Key Phrase</title>
<style>
  html, body { margin: 0; padding: 0; background: #58A05A; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1247 "Key Phrase" - Adan De La Garza study block ADG8.
   After De La Garza's Key Phrase (2018), a zine of problematic
   machine-translation phrases screenshotted from a cheerful language
   app ("at least 25% of the translations were problematic"). A sunny
   flashcard app teaches uncanny phrases - "The owl says: IT IS NOT
   YOUR LAND" - and stamps a big green "Correct!" on every card,
   regardless of anything. The wrongness is never acknowledged.
   Between cards the generic yellow mascot face stretches and melts
   a little while it loads. Tap for the next card, drag to skip the
   lesson, double-tap to reseed the phrase bank. The streak only
   ever rises.
   HOUSE ADAPTATION: the app would chirp; the piece ships silent.
   Flat fills only; seeded hashes only. */

var T0 = 5.4;                  // fixed first-frame phase: card 0, stamp just slammed
var PERIOD = 8;                // seconds per card
var FLIP = 0.3;                // card flip-in, seconds
var STAMP_T = 5.2;             // stamp lands
var STAMP_END = 7.2;           // stamp leaves (2.0 s hold)
var LESSON = 10;               // cards per lesson (progress bar)

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

var PAL = {
  app: '#58A05A', appLight: '#67B26B', appDark: '#4C8A4E',
  card: '#FDFBF7', cardShade: '#3E7A40',
  check: '#3E8A3E', red: '#C23B2E', streak: '#E08A2E',
  ink: '#2A2D33', yellow: '#F2C230', yellowDark: '#D9A41C',
  track: 'rgba(253,251,247,0.35)'
};

/* ---------- seeded hash (integer, deterministic) ---------- */
function ih(a, b) {
  var x = ((a | 0) * 374761393 + (b | 0) * 668265263) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/* ---------- time ---------- */
function perfNow() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
}
var startPerf = perfNow();
function pieceNow() { return T0 + (perfNow() - startPerf); }

/* ---------- phrase bank ----------
   The four documented phrases come first, verbatim. The rest are
   generated variants in the same machine-flat grammar. */
var PHRASES = [
  'IT IS NOT YOUR LAND',
  'YOU HAVE NO CULTURE',
  'WE DO NOT THINK',
  'I NEVER MAKE FOOD FOR MY CHILDREN',
  'THE RIVER IS NOT YOURS',
  'WE EAT AT NIGHT',
  'YOUR HOUSE IS TOO QUIET',
  'I HAVE NO GRANDMOTHER',
  'THE CHILDREN ARE WATCHING',
  'THIS LAND REMEMBERS',
  'THE MOUNTAIN DOES NOT MOVE FOR YOU',
  'WE COUNT THE RAIN DIFFERENTLY',
  'YOUR NAME IS DIFFICULT TO KEEP',
  'THE ROAD ENDS BEFORE THE VILLAGE',
  'NOBODY HERE OWES YOU A SONG',
  'THE SEA WAS NEVER EMPTY',
  'MY FATHER SPEAKS TO THE STONES',
  'WE DO NOT SELL THE MORNING'
];

/* ---------- sequence state ----------
   cardIdx counts cards since the epoch; epochT is the piece time at
   which card 0 of the current run began. salt reseeds the order.
   streakBase keeps the streak from ever falling across a reseed. */
var salt = 0;
var epochT = 0;
var streakBase = 0;
var perm = [];
function buildPerm() {
  var rest = [], i, j, tmp;
  for (i = 4; i < PHRASES.length; i++) rest.push(i);
  for (i = rest.length - 1; i > 0; i--) {           // Fisher-Yates on hashes
    j = Math.floor(ih(salt * 7919 + 13, i * 31 + 7) * (i + 1));
    tmp = rest[i]; rest[i] = rest[j]; rest[j] = tmp;
  }
  perm = [0, 1, 2, 3].concat(rest);
}
buildPerm();
function cardAt(t) {
  var pos = (t - epochT) / PERIOD;
  var idx = Math.floor(pos);
  return { idx: idx, phase: (pos - idx) * PERIOD };
}
function phraseFor(idx) { return PHRASES[perm[((idx % perm.length) + perm.length) % perm.length]]; }
function streakAt(t) {
  var c = cardAt(t);
  return streakBase + c.idx + (c.phase >= STAMP_T && c.phase < PERIOD ? 1 : 0);
}

/* ---------- interaction ---------- */
var pDown = null, lastTapT = -10;
canvas.addEventListener('pointerdown', function (e) {
  pDown = { x: e.clientX, y: e.clientY, t: pieceNow() };
});
canvas.addEventListener('pointerup', function (e) {
  if (!pDown) return;
  var now = pieceNow();
  var dx = e.clientX - pDown.x, dy = e.clientY - pDown.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var c = cardAt(now);
  if (dist > 60) {
    /* drag: skip the whole lesson */
    var target = (Math.floor(c.idx / LESSON) + 1) * LESSON;
    epochT = now - target * PERIOD;
  } else if (now - pDown.t < 0.6) {
    if (now - lastTapT < 0.35) {
      /* double-tap: reseed the bank, streak carries over */
      streakBase += c.idx + (c.phase >= STAMP_T ? 1 : 0);
      salt++;
      buildPerm();
      epochT = now;
    } else {
      /* tap: next card now */
      epochT = now - (c.idx + 1) * PERIOD;
    }
    lastTapT = now;
  }
  pDown = null;
});
canvas.addEventListener('pointercancel', function () { pDown = null; });

/* ---------- layout ---------- */
function isPhone() {
  var s = window.screen;
  if (s && Math.min(s.width, s.height) < 700) return true;
  return H > W * 1.15;
}
function layout() {
  var phone = isPhone();
  var u = Math.min(W, H);
  var cw = W * (phone ? 0.88 : 0.70);
  var ch = Math.min(H * 0.56, cw * 0.74);
  return {
    phone: phone, u: u,
    barY: H * 0.055, barH: Math.max(10, u * 0.022),
    barX: W * (phone ? 0.20 : 0.24), barW: W * (phone ? 0.44 : 0.46),
    cardX: (W - cw) / 2, cardY: H * 0.545 - ch / 2, cardW: cw, cardH: ch,
    cardCx: W / 2, cardCy: H * 0.545
  };
}

/* ---------- drawing helpers ---------- */
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function poly(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath(); ctx.fill();
}
var FONT = '"Arial Rounded MT Bold","Helvetica Rounded",Arial,sans-serif';

/* ---------- the owl: generic geometry, no brand ---------- */
function drawOwl(cx, cy, r) {
  ctx.fillStyle = PAL.yellowDark;                       // ear tufts
  poly([cx - r * 0.78, cy - r * 0.55, cx - r * 0.30, cy - r * 0.72, cx - r * 0.62, cy - r * 1.05]);
  poly([cx + r * 0.78, cy - r * 0.55, cx + r * 0.30, cy - r * 0.72, cx + r * 0.62, cy - r * 1.05]);
  ctx.fillStyle = PAL.yellow;                           // body disc
  circ(cx, cy, r);
  ctx.fillStyle = PAL.yellowDark;                       // wings
  ctx.beginPath(); ctx.ellipse(cx - r * 0.88, cy + r * 0.15, r * 0.22, r * 0.5, 0.25, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + r * 0.88, cy + r * 0.15, r * 0.22, r * 0.5, -0.25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PAL.card;                             // eyes
  circ(cx - r * 0.36, cy - r * 0.18, r * 0.34);
  circ(cx + r * 0.36, cy - r * 0.18, r * 0.34);
  ctx.fillStyle = PAL.ink;                              // pupils
  circ(cx - r * 0.36, cy - r * 0.18, r * 0.16);
  circ(cx + r * 0.36, cy - r * 0.18, r * 0.16);
  ctx.fillStyle = PAL.streak;                           // beak
  poly([cx - r * 0.16, cy + r * 0.22, cx + r * 0.16, cy + r * 0.22, cx, cy + r * 0.48]);
}

/* ---------- streak flame ---------- */
function drawFlame(cx, cy, s) {
  ctx.fillStyle = PAL.streak;
  ctx.beginPath();
  ctx.moveTo(cx, cy - s);
  ctx.bezierCurveTo(cx + s * 0.85, cy - s * 0.25, cx + s * 0.62, cy + s * 0.55, cx, cy + s * 0.85);
  ctx.bezierCurveTo(cx - s * 0.62, cy + s * 0.55, cx - s * 0.85, cy - s * 0.25, cx, cy - s);
  ctx.fill();
  ctx.fillStyle = PAL.yellow;
  ctx.beginPath();
  ctx.moveTo(cx, cy - s * 0.25);
  ctx.bezierCurveTo(cx + s * 0.45, cy + s * 0.05, cx + s * 0.34, cy + s * 0.42, cx, cy + s * 0.62);
  ctx.bezierCurveTo(cx - s * 0.34, cy + s * 0.42, cx - s * 0.45, cy + s * 0.05, cx, cy - s * 0.25);
  ctx.fill();
}

/* ---------- phrase text: wrap to fit the card ---------- */
function drawPhrase(L, text) {
  var maxW = L.cardW * 0.68, maxH = L.cardH * 0.30;
  var size = L.cardW * 0.10, lines = null, i, lh;
  while (size > 10) {
    ctx.font = '700 ' + size + 'px ' + FONT;
    var words = text.split(' '), cur = '', test, cand = [];
    for (i = 0; i < words.length; i++) {
      test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) { cand.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) cand.push(cur);
    lh = size * 1.22;
    if (cand.length <= 3 && lh * cand.length <= maxH + lh * 0.4) { lines = cand; break; }
    size *= 0.9;
  }
  if (!lines) lines = [text];
  ctx.fillStyle = PAL.ink;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var y0 = L.cardCy + L.cardH * 0.17 - (lines.length - 1) * lh / 2;
  for (i = 0; i < lines.length; i++) ctx.fillText(lines[i], L.cardCx, y0 + i * lh);
}

/* ---------- the Correct! stamp ---------- */
function stampScale(age) {
  if (age < 0.13) return 1.45;          // bounce frame 1: overshoot
  if (age < 0.26) return 0.86;          // bounce frame 2: squash
  if (age < 0.39) return 1.12;          // bounce frame 3: rebound
  return 1.0;
}
function drawStamp(L, phase) {
  var age = phase - STAMP_T;
  var sx = L.cardX + L.cardW * 0.86, sy = L.cardY + L.cardH * 0.80;
  var r = L.cardW * 0.08;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(-0.14);
  var sc = stampScale(age);
  ctx.scale(sc, sc);
  ctx.strokeStyle = PAL.check; ctx.lineWidth = r * 0.16;
  ctx.beginPath(); ctx.arc(0, -r * 0.28, r * 0.78, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = r * 0.30; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-r * 0.40, -r * 0.26);
  ctx.lineTo(-r * 0.10, r * 0.06);
  ctx.lineTo(r * 0.44, -r * 0.62);
  ctx.stroke();
  ctx.fillStyle = PAL.check;
  ctx.font = '700 ' + (r * 0.78) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Correct!', 0, r * 0.92);
  ctx.restore();
}

/* ---------- loading mascot face: stretches and melts ---------- */
function drawSpinner(L, phase) {
  var p = (phase - STAMP_END) / (PERIOD - STAMP_END);   // 0..1
  var cx = L.cardCx, cy = L.cardCy, r = L.cardH * 0.20;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(0.15 * Math.sin(p * Math.PI * 2));
  ctx.scale(1 - 0.10 * Math.sin(p * Math.PI * 3), 1 + 0.30 * Math.sin(p * Math.PI * 3));
  ctx.fillStyle = PAL.yellow;
  circ(0, 0, r);
  ctx.fillStyle = PAL.ink;
  circ(-r * 0.34, -r * 0.16, r * 0.11);
  circ(r * 0.34, -r * 0.16, r * 0.11);
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = r * 0.09; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, r * 0.08, r * 0.42, Math.PI * 0.25, Math.PI * 0.75); ctx.stroke();
  ctx.restore();
  /* the melt: a drip below the face */
  var d = r * 0.55 * Math.sin(p * Math.PI);
  if (d > 1) {
    ctx.fillStyle = PAL.yellow;
    poly([cx - r * 0.16, cy + r * 0.92, cx + r * 0.16, cy + r * 0.92,
          cx + r * 0.05, cy + r * 0.92 + d, cx - r * 0.05, cy + r * 0.92 + d]);
    circ(cx, cy + r * 0.92 + d, r * 0.07);
  }
}

/* ---------- chrome: close button, progress, streak ---------- */
function drawChrome(L, t, c) {
  var cy = L.barY + L.barH / 2;
  /* close button: white disc, red x (the one red accent) */
  var br = L.barH * 1.05;
  ctx.fillStyle = PAL.card;
  circ(L.barH * 1.6, cy, br);
  ctx.strokeStyle = PAL.red; ctx.lineWidth = br * 0.24; ctx.lineCap = 'round';
  var q = br * 0.42;
  ctx.beginPath(); ctx.moveTo(L.barH * 1.6 - q, cy - q); ctx.lineTo(L.barH * 1.6 + q, cy + q); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L.barH * 1.6 - q, cy + q); ctx.lineTo(L.barH * 1.6 + q, cy - q); ctx.stroke();
  /* progress bar */
  ctx.fillStyle = PAL.track;
  rrect(L.barX, L.barY, L.barW, L.barH, L.barH / 2);
  var frac = ((c.idx % LESSON) + 1) / LESSON;
  ctx.fillStyle = PAL.card;
  if (frac > 0) rrect(L.barX, L.barY, Math.max(L.barH, L.barW * frac), L.barH, L.barH / 2);
  /* streak: flame + count, top right */
  var fs = L.barH * 1.15;
  drawFlame(W - fs * 2.6, cy, fs);
  ctx.fillStyle = PAL.card;
  ctx.font = '700 ' + (L.barH * 1.7) + 'px ' + FONT;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText(String(streakAt(t)), W - L.u * 0.018, cy + 1);
}

/* ---------- the card ---------- */
function drawCard(L, t, c) {
  var flip = clamp(c.phase / FLIP, 0, 1);
  var sx = Math.sin(flip * Math.PI / 2);
  if (sx <= 0.01) sx = 0.01;
  ctx.save();
  ctx.translate(L.cardCx, L.cardCy);
  ctx.scale(sx, 1);
  ctx.translate(-L.cardCx, -L.cardCy);
  ctx.fillStyle = PAL.cardShade;                        // flat offset shade
  rrect(L.cardX + L.u * 0.012, L.cardY + L.u * 0.014, L.cardW, L.cardH, L.u * 0.03);
  ctx.fillStyle = PAL.card;
  rrect(L.cardX, L.cardY, L.cardW, L.cardH, L.u * 0.03);
  drawOwl(L.cardCx, L.cardY + L.cardH * 0.21, L.cardH * 0.125);
  ctx.fillStyle = PAL.ink;
  ctx.font = '700 ' + (L.cardH * 0.062) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('The owl says:', L.cardCx, L.cardY + L.cardH * 0.40);
  drawPhrase(L, phraseFor(c.idx));
  ctx.restore();
  if (c.phase >= STAMP_T && c.phase < STAMP_END) drawStamp(L, c.phase);
}

/* ---------- frame ---------- */
function draw(t) {
  var L = layout();
  var c = cardAt(t);
  ctx.fillStyle = PAL.app;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = PAL.appLight;                         // sunny flat geometry
  circ(W * 0.06, H * 0.02, L.u * 0.30);
  circ(W * 0.97, H * 0.88, L.u * 0.22);
  ctx.fillStyle = PAL.appDark;                          // ground band
  ctx.fillRect(0, H * 0.90, W, H * 0.10);
  drawChrome(L, t, c);
  if (c.phase < STAMP_END) drawCard(L, t, c);
  else drawSpinner(L, c.phase);
}

/* ---------- sizing: Visual Viewport API ---------- */
function resize() {
  var vv = window.visualViewport;
  W = Math.floor(vv ? vv.width : window.innerWidth);
  H = Math.floor(vv ? vv.height : window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceNow()); });
window.addEventListener('resize', function () { resize(); draw(pieceNow()); });

resize();
draw(T0);                                            // synchronous fixed-phase first frame
if (typeof requestAnimationFrame === 'function') {
  var tick = function () {
    draw(pieceNow());
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
