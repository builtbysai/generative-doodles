<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memories of Digital Data, After the Chain</title>
<style>
html, body { margin: 0; padding: 0; background: #14121A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var SKY_TOP = '#241B38';
var SKY_MID = '#6E3A5E';
var SKY_LOW = '#C96A2E';
var BLOCK_A = '#14121A';
var BLOCK_B = '#1E1A2B';
var WATER_TOP = '#9FBCCB';
var WATER_LOW = '#6E93A8';
var PALE = '#E8E2D8';
var RED = '#D21F2B';
var SEED = 1640007;
/* Frame one is at t = 8 s: the city already stands, the clouds already
   flutter, decay already visible, red already marking what is lost. */
var PHASE = 8;
var N_CLUSTERS = 8, N_BLOCKS = 34, N_REGIONS = 6, N_SHIMMER = 26;
var CLOUD_COLS = ['#C96A2E', '#D97B8F', '#7A5FA8'];
var GREY = [138, 132, 148];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function lerpRgb(a, b, f) {
  return [Math.round(a[0] + (b[0] - a[0]) * f), Math.round(a[1] + (b[1] - a[1]) * f), Math.round(a[2] + (b[2] - a[2]) * f)];
}
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var SKY_TOP_RGB = hexRgb(SKY_TOP);
var SKY_MID_RGB = hexRgb(SKY_MID);
var SKY_LOW_RGB = hexRgb(SKY_LOW);
var BLOCK_A_RGB = hexRgb(BLOCK_A);
var BLOCK_B_RGB = hexRgb(BLOCK_B);
var WATER_TOP_RGB = hexRgb(WATER_TOP);
var WATER_LOW_RGB = hexRgb(WATER_LOW);
var RED_RGB = hexRgb(RED);
var CLOUD_RGB = CLOUD_COLS.map(hexRgb);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Field-like seascape: full-bleed on phones, a centred square on
   desktop; the page ground is the block city's near-black. */
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var side = Math.min(VW, VH) * 0.86;
  return { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
}
/* ---- seeded rectangle field: clouds, blocks, shimmer ---- */
function buildField(seed) {
  var rng = mulberry32(seed);
  var clusters = [], blocks = [], regions = [], shimmer = [];
  var i, j, n, rects;
  for (i = 0; i < N_CLUSTERS; i++) {
    rects = [];
    n = 7 + Math.floor(rng() * 9);
    for (j = 0; j < n; j++) {
      rects.push({
        dx: (rng() - 0.5) * 0.22, dy: (rng() - 0.5) * 0.07,
        w: 0.02 + rng() * 0.05, h: 0.012 + rng() * 0.03,
        ci: Math.floor(rng() * 3),
        ph: rng() * TAU, sp: 0.05 + rng() * 0.12,
        miss: rng() < 0.10
      });
    }
    clusters.push({
      x: 0.05 + rng() * 0.9, y: 0.05 + rng() * 0.44,
      rects: rects, depth: rng(),
      reg: Math.floor(rng() * N_REGIONS)
    });
  }
  for (i = 0; i < N_BLOCKS; i++) {
    blocks.push({
      x: 0.02 + (i / N_BLOCKS) * 0.96 + (rng() - 0.5) * 0.012,
      w: 0.012 + rng() * 0.035,
      h: 0.03 + rng() * 0.16,
      depth: rng(),
      ci: Math.floor(rng() * 2),
      ph: rng() * TAU, sp: 0.03 + rng() * 0.08,
      miss: rng() < 0.12,
      reg: Math.floor(rng() * N_REGIONS),
      win: rng() < 0.45, winY: rng(), winX: rng()
    });
  }
  for (i = 0; i < N_REGIONS; i++) regions.push(0.3 + rng() * 0.7);
  for (i = 0; i < N_SHIMMER; i++) {
    shimmer.push({
      x: rng(), y: 0.70 + rng() * 0.27,
      w: 0.03 + rng() * 0.12, ph: rng() * TAU,
      sp: 0.2 + rng() * 0.5, a: 0.06 + rng() * 0.09
    });
  }
  return { clusters: clusters, blocks: blocks, regions: regions, shimmer: shimmer };
}
var FIELD = buildField(SEED);
function cloudRectCount() {
  var n = 0, i;
  for (i = 0; i < FIELD.clusters.length; i++) n += FIELD.clusters[i].rects.length;
  return n;
}
function missingCount() {
  var n = 0, i, j;
  for (i = 0; i < FIELD.clusters.length; i++)
    for (j = 0; j < FIELD.clusters[i].rects.length; j++)
      if (FIELD.clusters[i].rects[j].miss) n++;
  for (i = 0; i < FIELD.blocks.length; i++) if (FIELD.blocks[i].miss) n++;
  return n;
}
/* Deterioration grows slowly with piece time, bounded: frame one
   already shows it, it never runs away. */
function decayAt(t) { return clamp(0.25 + t * 0.002, 0, 0.9); }
function drawSky(rect, horizonY) {
  var strips = 42, i, f, col;
  var sh = horizonY - rect.y;
  for (i = 0; i < strips; i++) {
    f = i / (strips - 1);
    col = f < 0.55 ? lerpRgb(SKY_TOP_RGB, SKY_MID_RGB, f / 0.55)
                   : lerpRgb(SKY_MID_RGB, SKY_LOW_RGB, (f - 0.55) / 0.45);
    ctx.fillStyle = rgb(col);
    ctx.fillRect(rect.x, rect.y + i * sh / strips, rect.w, sh / strips + 1);
  }
}
function drawWater(rect, horizonY) {
  var strips = 24, i, f, col;
  var wh = rect.y + rect.h - horizonY;
  for (i = 0; i < strips; i++) {
    f = i / (strips - 1);
    col = lerpRgb(WATER_TOP_RGB, WATER_LOW_RGB, f);
    ctx.fillStyle = rgb(col);
    ctx.fillRect(rect.x, horizonY + i * wh / strips, rect.w, wh / strips + 1);
  }
}
function drawClouds(t, rect, horizonY, decay) {
  var i, j, c, r, x, y, w, h, col, disp, a;
  for (i = 0; i < FIELD.clusters.length; i++) {
    c = FIELD.clusters[i];
    disp = decay * FIELD.regions[c.reg];
    for (j = 0; j < c.rects.length; j++) {
      r = c.rects[j];
      /* Undulation on slow sine fields; distant clusters are smaller. */
      x = rect.x + (c.x + r.dx) * rect.w
        + Math.sin(t * r.sp + r.ph) * rect.w * 0.012
        + Math.sin(t * r.sp * 0.31 + r.ph * 2.7) * disp * rect.w * 0.02;
      y = rect.y + (c.y + r.dy) * rect.h
        + Math.sin(t * r.sp * 0.7 + r.ph) * rect.h * 0.008
        + Math.cos(t * r.sp * 0.23 + r.ph * 1.3) * disp * rect.h * 0.02;
      w = r.w * rect.w * (1 - c.depth * 0.45);
      h = r.h * rect.h * (1 - c.depth * 0.45);
      a = 0.55 + 0.25 * Math.sin(t * r.sp * 0.5 + r.ph);
      if (r.miss) {
        col = RED_RGB;
        /* Red bloom spreads where memory fails: a faint halo that
           grows slowly with piece time, capped, pulsing gently. */
        var bloom = Math.min(4 + t * 0.15, 26);
        var ba = (0.10 * (0.6 + 0.4 * Math.sin(t * 0.3 + r.ph))).toFixed(4);
        ctx.fillStyle = 'rgba(' + RED_RGB[0] + ',' + RED_RGB[1] + ',' + RED_RGB[2] + ',' + ba + ')';
        ctx.fillRect(x - bloom, y - bloom, w + bloom * 2, h + bloom * 2);
        ctx.fillStyle = rgba(RED_RGB, 0.85);
        ctx.fillRect(x, y, w, h);
      } else {
        col = lerpRgb(CLOUD_RGB[r.ci], GREY, disp * 0.5);
        ctx.fillStyle = rgba(col, clamp(a, 0.3, 0.85));
        ctx.fillRect(x, y, w, h);
      }
    }
  }
}
function drawBlocks(t, rect, horizonY, decay) {
  var i, b, x, w, h, y, col, disp, reflH;
  for (i = 0; i < FIELD.blocks.length; i++) {
    b = FIELD.blocks[i];
    disp = decay * FIELD.regions[b.reg];
    /* Depth is rectangle size: distant blocks smaller, set higher. */
    w = b.w * rect.w * (1 - b.depth * 0.55);
    h = b.h * rect.h * (1 - b.depth * 0.55);
    x = rect.x + b.x * rect.w
      + Math.sin(t * b.sp + b.ph) * disp * 3
      + Math.sin(t * b.sp * 0.4 + b.ph * 3.1) * disp * 2;
    y = horizonY - h + b.depth * rect.h * 0.02;
    if (b.miss) {
      var bloom = Math.min(3 + t * 0.12, 18);
      var ba = (0.09 * (0.6 + 0.4 * Math.sin(t * 0.25 + b.ph))).toFixed(4);
      ctx.fillStyle = 'rgba(' + RED_RGB[0] + ',' + RED_RGB[1] + ',' + RED_RGB[2] + ',' + ba + ')';
      ctx.fillRect(x - bloom, y - bloom, w + bloom * 2, h + bloom * 2);
      ctx.fillStyle = rgba(RED_RGB, 0.9);
      ctx.fillRect(x, y, w, h);
    } else {
      col = lerpRgb(b.ci ? BLOCK_B_RGB : BLOCK_A_RGB, GREY, disp * 0.35);
      ctx.fillStyle = rgb(col);
      ctx.fillRect(x, y, w, h);
      /* A few lit windows: the last lights of abandoned nodes. */
      if (b.win) {
        ctx.fillStyle = rgba(hexRgb('#D9A45B'), 0.7);
        ctx.fillRect(x + b.winX * w * 0.6, y + b.winY * h * 0.6,
          Math.max(2, w * 0.16), Math.max(2, h * 0.05));
      }
    }
    /* Reflection in the water band: the wreckage mirrored, wobbling. */
    reflH = h * 0.55;
    ctx.fillStyle = b.miss ? rgba(RED_RGB, 0.28)
      : rgba(b.ci ? BLOCK_B_RGB : BLOCK_A_RGB, 0.22);
    ctx.fillRect(
      x + Math.sin(t * 0.5 + b.x * 20) * 3,
      horizonY + 1, w, reflH);
  }
}
function drawShimmer(t, rect) {
  var i, s;
  for (i = 0; i < FIELD.shimmer.length; i++) {
    s = FIELD.shimmer[i];
    ctx.fillStyle = rgba(hexRgb('#DCE8EE'),
      clamp(s.a * (0.7 + 0.3 * Math.sin(t * s.sp + s.ph)), 0.02, 0.2));
    ctx.fillRect(rect.x + s.x * rect.w,
      rect.y + s.y * rect.h + Math.sin(t * s.sp + s.ph) * 2,
      s.w * rect.w, 2);
  }
}
/* ---- tap releases the wave sound: lazy WebAudio, gesture only ---- */
var audioCtx = null, wavePulseT = -1, sounded = false;
function releaseWave() {
  sounded = true;
  wavePulseT = 0;
  try {
    var AC = (typeof AudioContext !== 'undefined') ? AudioContext
      : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var dur = 4, sr = audioCtx.sampleRate;
    var buf = audioCtx.createBuffer(1, sr * dur, sr);
    var d = buf.getChannelData(0);
    var i;
    for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    var filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(420, audioCtx.currentTime);
    filt.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + dur * 0.4);
    filt.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + dur);
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    var lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.35;
    var lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.12;
    lfo.connect(lfoGain);
    lfoGain.connect(g.gain);
    src.connect(filt);
    filt.connect(g);
    g.connect(audioCtx.destination);
    src.start();
    lfo.start();
    src.stop(audioCtx.currentTime + dur);
    lfo.stop(audioCtx.currentTime + dur);
  } catch (e) { /* sound is earned, never required */ }
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', function (e) {
    if (e && e.preventDefault) e.preventDefault();
    releaseWave();
  });
  canvas.addEventListener('mousedown', function () { releaseWave(); });
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function drawText(rect) {
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  /* Title wraps to two lines when it cannot fit on one. */
  var titlePx = isPhone ? 15 : 20;
  var line1 = 'Memories of Digital Data,', line2 = 'After the Chain';
  var oneLine = 'Memories of Digital Data, After the Chain';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var twoLines = ctx.measureText(oneLine).width > rect.w - 40;
  while (!twoLines && titlePx > 9 && ctx.measureText(oneLine).width > rect.w - 40) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  if (twoLines) {
    while (titlePx > 9 && ctx.measureText(line1).width > rect.w - 40) {
      titlePx -= 1;
      ctx.font = 'bold ' + titlePx + 'px monospace';
    }
  }
  var lines = twoLines ? [line1, line2] : [oneLine];
  var titleW = 0, i;
  for (i = 0; i < lines.length; i++)
    titleW = Math.max(titleW, ctx.measureText(lines[i]).width);
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 09').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = lines.length * (titlePx + 2) + smallPx + 20;
  var plateX = cxm - plateW / 2, plateY = rect.y + 10;
  ctx.fillStyle = 'rgba(12, 10, 18, 0.78)';
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = 'rgba(232, 226, 216, 0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PALE;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  for (i = 0; i < lines.length; i++)
    ctx.fillText(lines[i], cxm, plateY + 7 + i * (titlePx + 2));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = 'rgba(232, 226, 216, 0.75)';
  ctx.fillText('2006 · 07 · 09', cxm, plateY + 7 + lines.length * (titlePx + 2) + 3);
  var hint = 'Tap to release the wave sound.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cxm - hintPlateW / 2;
  var hintPlateY = rect.y + rect.h - hintPlateH - 10;
  ctx.fillStyle = 'rgba(12, 10, 18, 0.78)';
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = sounded ? 'rgba(210, 31, 43, 0.8)' : 'rgba(232, 226, 216, 0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = 'rgba(232, 226, 216, 0.85)';
  ctx.fillText(hint, cxm, hintPlateY + 7);
}
function draw(t) {
  size();
  var rect = compRect();
  var horizonY = rect.y + rect.h * 2 / 3;
  var decay = decayAt(t);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = BLOCK_A;
  ctx.fillRect(0, 0, VW, VH);
  /* Clip the scene to the composition rect: cloud and block rects
     must never spill past the frame onto the page ground. */
  ctx.save();
  ctx.beginPath();
  ctx.rect(rect.x, rect.y, rect.w, rect.h);
  ctx.clip();
  drawSky(rect, horizonY);
  drawClouds(t, rect, horizonY, decay);
  drawWater(rect, horizonY);
  drawBlocks(t, rect, horizonY, decay);
  drawShimmer(t, rect);
  /* The released wave: a pale band travelling down the water. */
  if (wavePulseT >= 0 && wavePulseT < 1) {
    var wh = rect.y + rect.h - horizonY;
    ctx.fillStyle = rgba(hexRgb('#DCE8EE'), (0.45 * (1 - wavePulseT)).toFixed(4));
    ctx.fillRect(rect.x, horizonY + wavePulseT * wh, rect.w, 6);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(232, 226, 216, 0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1);
  drawText(rect);
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    cloudCount: function () { return cloudRectCount(); },
    blockCount: function () { return N_BLOCKS; },
    missingCount: function () { return missingCount(); },
    decayAt: function (t) { return decayAt(t); },
    sounded: function () { return sounded; },
    drawAt: function (t) { draw(t); }
  };
}
/* ---- frame one: fixed phase, fixed seed, no wall clock ---- */
size();
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    if (wavePulseT >= 0) {
      wavePulseT += dt / 3;
      if (wavePulseT >= 1) wavePulseT = -1;
    }
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
