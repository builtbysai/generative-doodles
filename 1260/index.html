<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oracle Walk</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0908; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
"use strict";

/* ---------- seeded hash (integer, deterministic) ---------- */
function hash(n){
  var x = (n * 2654435761) >>> 0;
  x ^= x >>> 15; x = (x * 2246822519) >>> 0;
  x ^= x >>> 13; x = (x * 3266489917) >>> 0;
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}

/* ---------- palette ---------- */
var BLACK = "#0A0908", DIM = "#2E2A24", DIM2 = "#3A352C", SKIN = "#C9A184",
    GLOW = "#E8DFD0", BONE = "#F0EAD8", GOLD = "#D9A441";

/* ---------- the sixteen pieces ----------
   type: art generator key; pal: flat colors for the generator;
   c: commentary (wry, specific); q: the question it asks back. */
var PIECES = [
 { type:"rings",  pal:["#B13E3E","#D9A441","#E8DFD0","#5E6B3F"],
   c:"cut from a calendar i kept meaning to throw out.",
   q:"what date do you keep circling?" },
 { type:"beads",  pal:["#A34E8C","#E8C547","#5FA88A","#E8DFD0"],
   c:"beads from a necklace that broke on the bus.",
   q:"what came apart in public?" },
 { type:"stones", pal:["#8A8177","#6E675C","#B8B0A0","#4A463E"],
   c:"stacked by the river. the river was unimpressed.",
   q:"what are you balancing that isn't yours?" },
 { type:"threads",pal:["#C96A4A","#E8C547","#7A8A4A","#D8D2C4"],
   c:"thread my grandmother measured twice and cut once.",
   q:"what are you still tied to, on purpose?" },
 { type:"sun",    pal:["#E8C547","#D9762E","#B13E3E"],
   c:"made during a power outage. it remembers the dark better than i do.",
   q:"who do you call when the power's out?" },
 { type:"coil",   pal:["#A68B5B","#7A5A3E","#C9A86A"],
   c:"coiled at the kitchen table. the table wobbled the whole time.",
   q:"what are you making slowly, on purpose?" },
 { type:"shards", pal:["#B8C4CC","#8A97A3","#E8E4D8"],
   c:"a mirror that fell and got a second job.",
   q:"which version of you does the dishes?" },
 { type:"field",  pal:["#5E6B3F","#D9A441","#2E4A5A","#B13E3E"],
   c:"painted over a grocery list. the list won.",
   q:"what did you mean to buy instead?" },
 { type:"moons",  pal:["#E8E4D8","#B8B0A0","#3A352C"],
   c:"the moon, sixteen times, from the same porch.",
   q:"what do you check on every night?" },
 { type:"ladder", pal:["#A87F3F","#7A5A3E"],
   c:"a ladder for getting down, mostly.",
   q:"what are you climbing down from?" },
 { type:"net",    pal:["#D8D2C4","#8A4B3A"],
   c:"mended three times. it holds what it holds.",
   q:"what keeps slipping through?" },
 { type:"seed",   pal:["#7A5A3E","#5DAE62","#D9A441"],
   c:"planted the week the letter came.",
   q:"what are you growing that nobody's seen?" },
 { type:"wave",   pal:["#5FA8A0","#2E4A5A","#9FB4C0"],
   c:"drawn from the sound of the radiator, not the sea.",
   q:"what noise have you learned to sleep through?" },
 { type:"masks",  pal:["#E8DFD0","#B13E3E"],
   c:"two masks. they take turns being the brave one.",
   q:"what are you not saying in the group chat?" },
 { type:"buttons",pal:["#B13E3E","#D9A441","#5E6B3F","#2E4A5A","#E8DFD0"],
   c:"spare buttons from coats i no longer own.",
   q:"what are you keeping, just in case?" },
 { type:"map",    pal:["#8A8177","#A87F3F","#5E6B3F"],
   c:"a map of the neighborhood as it was told to me.",
   q:"whose directions are you still following?" }
];

/* ---------- art generators: draw inside a square of side s, centered on origin ---------- */
function disc(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function artRings(p, s){
  for (var i = 0; i < 5; i++){
    ctx.fillStyle = p.pal[i % p.pal.length];
    disc((hash(i * 7 + 1) - 0.5) * 0.1 * s, (hash(i * 13 + 2) - 0.5) * 0.1 * s, (0.46 - i * 0.085) * s);
  }
}
function artBeads(p, s){
  var n = 6;
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++){
    ctx.fillStyle = p.pal[(r + c) % p.pal.length];
    disc((-0.4 + c * 0.16) * s, (-0.4 + r * 0.16) * s, 0.062 * s);
  }
  ctx.fillStyle = "#0A0908";
  for (var r2 = 0; r2 < n; r2++) for (var c2 = 0; c2 < n; c2++)
    disc((-0.4 + c2 * 0.16) * s, (-0.4 + r2 * 0.16) * s, 0.016 * s);
}
function artStones(p, s){
  var ys = [0.34, 0.13, -0.05, -0.21, -0.34], ws = [0.42, 0.36, 0.29, 0.22, 0.15];
  for (var i = 0; i < 5; i++){
    ctx.fillStyle = p.pal[i % p.pal.length];
    ctx.beginPath(); ctx.ellipse(0, ys[i] * s, ws[i] * s, 0.085 * s, 0, 0, Math.PI * 2); ctx.fill();
  }
}
function artThreads(p, s){
  ctx.lineWidth = Math.max(1, 0.02 * s);
  for (var i = 0; i < 9; i++){
    var x = (-0.42 + i * 0.105) * s;
    ctx.strokeStyle = p.pal[i % p.pal.length];
    ctx.beginPath(); ctx.moveTo(x, -0.46 * s);
    ctx.lineTo(x + (hash(i * 31) - 0.5) * 0.1 * s, 0.44 * s); ctx.stroke();
    ctx.fillStyle = p.pal[(i + 1) % p.pal.length];
    disc(x + (hash(i * 31) - 0.5) * 0.1 * s, (0.1 + hash(i * 17) * 0.3) * s, 0.028 * s);
  }
}
function artSun(p, s){
  ctx.fillStyle = p.pal[1];
  for (var i = 0; i < 12; i++){
    var a = i / 12 * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.13) * 0.30 * s, Math.sin(a - 0.13) * 0.30 * s);
    ctx.lineTo(Math.cos(a) * 0.48 * s, Math.sin(a) * 0.48 * s);
    ctx.lineTo(Math.cos(a + 0.13) * 0.30 * s, Math.sin(a + 0.13) * 0.30 * s);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = p.pal[0]; disc(0, 0, 0.30 * s);
  ctx.fillStyle = p.pal[2]; disc(0, 0, 0.10 * s);
}
function artCoil(p, s){
  ctx.lineWidth = Math.max(1.5, 0.055 * s); ctx.lineCap = "round";
  for (var k = 0; k < 3; k++){
    ctx.strokeStyle = p.pal[k % p.pal.length];
    ctx.beginPath();
    for (var t = 0; t <= 1.001; t += 0.05){
      var a = t * Math.PI * (5 - k) + k * 2.1, r = (0.06 + t * 0.36) * s;
      var x = Math.cos(a) * r, y = Math.sin(a) * r * 0.92;
      if (t === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.lineCap = "butt";
}
function artShards(p, s){
  for (var i = 0; i < 9; i++){
    var cx = (hash(i * 41 + 3) - 0.5) * 0.7 * s, cy = (hash(i * 43 + 5) - 0.5) * 0.7 * s;
    ctx.fillStyle = p.pal[i % p.pal.length];
    ctx.beginPath();
    for (var v = 0; v < 3; v++){
      var a = hash(i * 47 + v * 7) * Math.PI * 2, r = (0.08 + hash(i * 53 + v) * 0.13) * s;
      var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (v === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill();
  }
}
function artField(p, s){
  for (var i = 0; i < 4; i++){
    ctx.fillStyle = p.pal[i % p.pal.length];
    ctx.fillRect(-0.48 * s, (-0.48 + i * 0.24) * s, 0.96 * s, 0.24 * s);
  }
  ctx.fillStyle = p.pal[1]; disc(0.28 * s, -0.24 * s, 0.07 * s);
}
function artMoons(p, s){
  for (var i = 0; i < 4; i++){
    var x = (-0.36 + i * 0.24) * s;
    ctx.fillStyle = p.pal[0]; disc(x, 0, 0.10 * s);
    ctx.fillStyle = p.pal[2];
    if (i > 0) disc(x + i * 0.035 * s, 0, 0.095 * s);
  }
  ctx.fillStyle = p.pal[1]; ctx.fillRect(-0.48 * s, 0.30 * s, 0.96 * s, 0.015 * s);
}
function artLadder(p, s){
  ctx.fillStyle = p.pal[0];
  ctx.fillRect(-0.20 * s, -0.46 * s, 0.045 * s, 0.92 * s);
  ctx.fillRect(0.155 * s, -0.46 * s, 0.045 * s, 0.92 * s);
  ctx.fillStyle = p.pal[1];
  for (var i = 0; i < 5; i++) ctx.fillRect(-0.20 * s, (-0.38 + i * 0.19) * s, 0.40 * s, 0.04 * s);
}
function artNet(p, s){
  ctx.strokeStyle = p.pal[0]; ctx.lineWidth = Math.max(1, 0.014 * s);
  for (var i = 0; i <= 6; i++){
    var u = (-0.45 + i * 0.15) * s;
    ctx.beginPath(); ctx.moveTo(u, -0.45 * s); ctx.lineTo(u + 0.08 * s, 0.45 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.45 * s, u); ctx.lineTo(0.45 * s, u + 0.05 * s); ctx.stroke();
  }
  ctx.strokeStyle = p.pal[1];
  ctx.beginPath(); ctx.moveTo(-0.45 * s, 0.1 * s); ctx.lineTo(0.45 * s, -0.2 * s); ctx.stroke();
}
function artSeed(p, s){
  ctx.fillStyle = p.pal[0];
  ctx.beginPath();
  ctx.moveTo(-0.22 * s, 0.46 * s); ctx.lineTo(0.22 * s, 0.46 * s);
  ctx.lineTo(0.15 * s, 0.16 * s); ctx.lineTo(-0.15 * s, 0.16 * s);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = p.pal[1]; ctx.lineWidth = Math.max(1.5, 0.03 * s);
  ctx.beginPath(); ctx.moveTo(0, 0.16 * s); ctx.lineTo(0, -0.22 * s); ctx.stroke();
  ctx.fillStyle = p.pal[1];
  ctx.beginPath(); ctx.ellipse(-0.13 * s, -0.28 * s, 0.15 * s, 0.06 * s, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0.13 * s, -0.34 * s, 0.15 * s, 0.06 * s, 0.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = p.pal[2]; disc(0, -0.05 * s, 0.035 * s);
}
function artWave(p, s){
  ctx.lineWidth = Math.max(1.2, 0.022 * s);
  for (var r = 0; r < 5; r++){
    ctx.strokeStyle = p.pal[r % p.pal.length];
    ctx.beginPath();
    for (var x = -0.46; x <= 0.46; x += 0.06){
      var y = (-0.32 + r * 0.16) * s + Math.sin(x * 11 + r * 1.7) * 0.045 * s;
      if (x === -0.46) ctx.moveTo(x * s, y); else ctx.lineTo(x * s, y);
    }
    ctx.stroke();
  }
}
function artMasks(p, s){
  for (var i = 0; i < 2; i++){
    var x = (i === 0 ? -0.22 : 0.22) * s;
    ctx.fillStyle = p.pal[0];
    ctx.beginPath(); ctx.ellipse(x, 0, 0.17 * s, 0.30 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0A0908";
    ctx.beginPath(); ctx.ellipse(x - 0.06 * s, -0.08 * s, 0.035 * s, 0.02 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 0.06 * s, -0.08 * s, 0.035 * s, 0.02 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = p.pal[1];
    ctx.beginPath(); ctx.ellipse(x, 0.12 * s, 0.05 * s, 0.016 * s, 0, 0, Math.PI * 2); ctx.fill();
  }
}
function artButtons(p, s){
  for (var i = 0; i < 10; i++){
    var x = (hash(i * 61 + 1) - 0.5) * 0.72 * s, y = (hash(i * 67 + 2) - 0.5) * 0.72 * s;
    ctx.fillStyle = p.pal[i % p.pal.length]; disc(x, y, (0.05 + hash(i * 71) * 0.035) * s);
    ctx.fillStyle = "#0A0908";
    disc(x - 0.02 * s, y, 0.008 * s); disc(x + 0.02 * s, y, 0.008 * s);
  }
}
function artMap(p, s){
  ctx.lineWidth = Math.max(1, 0.013 * s);
  for (var i = 0; i < 5; i++){
    ctx.strokeStyle = p.pal[i % p.pal.length];
    ctx.beginPath();
    for (var a = 0; a <= Math.PI * 2 + 0.01; a += 0.3){
      var r = (0.10 + i * 0.085) * s * (1 + 0.16 * Math.sin(a * 3 + i * 2.0));
      var x = Math.cos(a) * r, y = Math.sin(a) * r * 0.78;
      if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.fillStyle = p.pal[1]; disc(0.05 * s, -0.02 * s, 0.02 * s);
}
var ART = { rings:artRings, beads:artBeads, stones:artStones, threads:artThreads,
  sun:artSun, coil:artCoil, shards:artShards, field:artField, moons:artMoons,
  ladder:artLadder, net:artNet, seed:artSeed, wave:artWave, masks:artMasks,
  buttons:artButtons, map:artMap };

function drawArt(i, cx, cy, s, alpha){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = alpha;
  ART[PIECES[i].type](PIECES[i], s);
  ctx.restore();
  ctx.globalAlpha = 1;
}
function frameRect(cx, cy, s, col, a, lw){
  ctx.save();
  ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw || 2;
  ctx.strokeRect(cx - s / 2, cy - s / 2, s, s);
  ctx.restore();
}

/* ---------- state ---------- */
var MODE = "prologue";        /* prologue | descend | walk | reveal | end */
var REVEAL_IDX = 0;
var revealA = 0;              /* 0 blind .. 1 fully lifted */
var calledIdx = -1;
var endLine = "";
var stateT = 0;               /* seconds in current state */
var holdT = -1;               /* press-and-hold progress in prologue (-1 = not holding) */
var handX = 0, handTargetX = 0;
var dragOn = false, downX = 0, downY = 0, downT = 0, dragMoved = false, targetAtDown = 0;
var lastTapT = -10000, lastTapX = 0, lastTapY = 0;

/* ---------- canvas / viewport ---------- */
var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");
var W = 0, H = 0, PHONE = false;

function resize(){
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.max(50, Math.round(w)); H = Math.max(50, Math.round(h));
  cv.width = W; cv.height = H;
  PHONE = false;
  if (window.screen && Math.min(window.screen.width, window.screen.height) < 700) PHONE = true;
  if (!PHONE && H > W * 1.15) PHONE = true;
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
window.addEventListener("resize", resize);
resize();

/* ---------- walk geometry ---------- */
function spacing(){ return W * 0.30; }
function pieceX(i){ return W * 0.55 + i * spacing(); }
function wallEnd(){ return pieceX(15) + spacing() * 0.9; }
function wallY(){ return H * 0.46; }

/* ---------- the guide's hand (flat, pointing right) ---------- */
function drawHand(x, y, s, bob){
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.fillStyle = SKIN;
  disc(0, 0, 0.30 * s);                                   /* palm */
  ctx.fillRect(-0.30 * s, -0.20 * s, 0.42 * s, 0.40 * s);  /* wrist/palm fill */
  ctx.fillRect(0.10 * s, -0.13 * s, 0.62 * s, 0.20 * s);   /* index finger */
  disc(0.72 * s, -0.03 * s, 0.10 * s);                    /* fingertip */
  disc(0.16 * s, 0.20 * s, 0.13 * s);                     /* curled fingers */
  disc(0.02 * s, 0.28 * s, 0.12 * s);
  disc(-0.12 * s, 0.30 * s, 0.105 * s);
  disc(-0.10 * s, -0.26 * s, 0.115 * s);                  /* thumb */
  ctx.fillStyle = "rgba(0,0,0,0.16)";
  disc(0.30 * s, 0.10 * s, 0.10 * s);                     /* knuckle shade */
  ctx.restore();
}

/* ---------- text helper ---------- */
function line(txt, cx, cy, font, col, a){
  ctx.save();
  ctx.globalAlpha = a; ctx.fillStyle = col; ctx.font = font;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(txt, cx, cy);
  ctx.restore();
}
function wrapLines(txt, maxw, font){
  ctx.font = font;
  var words = txt.split(" "), out = [], cur = "";
  for (var i = 0; i < words.length; i++){
    var t = cur ? cur + " " + words[i] : words[i];
    if (ctx.measureText(t).width > maxw && cur){ out.push(cur); cur = words[i]; }
    else cur = t;
  }
  if (cur) out.push(cur);
  return out;
}

/* ---------- scenes ---------- */
function drawPrologue(phase){
  ctx.fillStyle = "#14110D"; ctx.fillRect(0, 0, W, H);
  /* the wall from afar */
  var wy = H * 0.40, cols = PHONE ? 8 : 16, rows = PHONE ? 2 : 1;
  var fs = Math.min(W / (cols * 1.56), H * 0.11);
  ctx.fillStyle = DIM;
  var wallW = cols * fs * 1.45, wallH = rows * fs * 1.5 + fs * 0.6;
  ctx.fillRect(W / 2 - wallW / 2 - fs * 0.4, wy - wallH / 2, wallW + fs * 0.8, wallH);
  for (var i = 0; i < 16; i++){
    var c = i % cols, r = Math.floor(i / cols);
    var cx = W / 2 + (c - (cols - 1) / 2) * fs * 1.45;
    var cy = wy + (r - (rows - 1) / 2) * fs * 1.5;
    var glow = 0.35 + 0.20 * Math.sin(phase * 0.7 + i * 1.3);
    ctx.save(); ctx.globalAlpha = 0.10 + 0.06 * glow; ctx.fillStyle = GLOW;
    ctx.fillRect(cx - fs * 0.62, cy - fs * 0.62, fs * 1.24, fs * 1.24); ctx.restore();
    frameRect(cx, cy, fs, GLOW, 0.5, 1.2);
    drawArt(i, cx, cy, fs * 0.84, 0.55);
  }
  /* floor line */
  ctx.fillStyle = DIM2; ctx.fillRect(0, H * 0.86, W, 1);
  var f1 = Math.round(Math.max(14, W * 0.016)) + "px Georgia, 'Times New Roman', serif";
  line("hold your question in mind.", W / 2, H * 0.68, f1, GOLD, 0.92);
  line("when you are ready, press and hold to be blindfolded.", W / 2, H * 0.68 + Math.max(26, H * 0.045), f1, GOLD, 0.62);
  if (holdT >= 0){
    var pw = Math.min(1, holdT / 1.2) * W * 0.3;
    ctx.fillStyle = GOLD; ctx.globalAlpha = 0.8;
    ctx.fillRect(W / 2 - pw / 2, H * 0.68 + Math.max(48, H * 0.075), pw, 2);
    ctx.globalAlpha = 1;
  }
}

function drawWalk(phase){
  ctx.fillStyle = BLACK; ctx.fillRect(0, 0, W, H);
  var cam = handX - W * 0.32, wy = wallY();
  /* faint wall base line */
  ctx.fillStyle = "rgba(232,223,208,0.05)";
  ctx.fillRect(0, wy + H * 0.16, W, 1);
  /* pieces: sensed, not seen */
  for (var i = 0; i < 16; i++){
    var sx = pieceX(i) - cam;
    if (sx < -W * 0.2 || sx > W * 1.2) continue;
    var d = Math.abs(pieceX(i) - handX);
    var near = Math.max(0, 1 - d / (spacing() * 1.1));
    var breath = 0.75 + 0.25 * Math.sin(phase * 1.4 + i * 0.9);
    var fs = H * 0.20;
    ctx.save();
    ctx.globalAlpha = (0.05 + 0.30 * near * near) * breath;
    ctx.fillStyle = GLOW;
    ctx.fillRect(sx - fs * 0.62, wy - fs * 0.62, fs * 1.24, fs * 1.24);
    ctx.restore();
    frameRect(sx, wy, fs, GLOW, 0.06 + 0.4 * near * breath, 1.4);
    if (near > 0.25) drawArt(i, sx, wy, fs * 0.8, 0.05 + 0.22 * near);
    if (near > 0.45)
      line(String(i + 1), sx, wy + fs * 0.78, Math.round(H * 0.02) + "px Georgia, serif", GOLD, 0.25 + 0.4 * near);
  }
  /* breathing hole of dim visibility around the hand */
  var hx = handX - cam, hy = wy + H * 0.02;
  for (var k = 3; k >= 1; k--){
    ctx.save(); ctx.globalAlpha = 0.035; ctx.fillStyle = "#241E16";
    disc(hx, hy, H * 0.055 * k + H * 0.03);
    ctx.restore();
  }
  drawHand(hx, hy, H * 0.075, Math.sin(phase * 1.1) * H * 0.004);
  /* blindfold weight at the edges */
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, H * 0.05); ctx.fillRect(0, H * 0.95, W, H * 0.05);
}

function drawReveal(phase){
  var a = revealA;
  /* room brightens as the blindfold lifts */
  ctx.fillStyle = a > 0.6 ? "#211D17" : BLACK; ctx.fillRect(0, 0, W, H);
  if (a <= 0.02) return;
  ctx.save(); ctx.globalAlpha = a;
  var s = Math.min(W, H) * (PHONE ? 0.62 : 0.46);
  var cx = W / 2, cy = H * 0.385;
  ctx.fillStyle = DIM; ctx.fillRect(cx - s * 0.60, cy - s * 0.60, s * 1.2, s * 1.2);
  ctx.save(); ctx.globalAlpha = a * 0.13; ctx.fillStyle = GLOW;
  ctx.fillRect(cx - s * 0.68, cy - s * 0.68, s * 1.36, s * 1.36); ctx.restore();
  frameRect(cx, cy, s * 1.06, GLOW, 0.85, 2.5);
  drawArt(REVEAL_IDX, cx, cy, s * 0.88, 1);
  var fc = Math.round(Math.max(14, W * 0.0155)) + "px Georgia, 'Times New Roman', serif";
  var fq = Math.round(Math.max(15, W * 0.0175)) + "px Georgia, 'Times New Roman', serif";
  var y = cy + s * 0.60 + H * 0.045;
  var cl = wrapLines(PIECES[REVEAL_IDX].c, W * 0.8, "italic " + fc);
  for (var i = 0; i < cl.length; i++){ line(cl[i], cx, y, "italic " + fc, BONE, 0.88); y += H * 0.036; }
  y += H * 0.018;
  var ql = wrapLines(PIECES[REVEAL_IDX].q, W * 0.8, fq);
  for (var j = 0; j < ql.length; j++){ line(ql[j], cx, y, fq, GOLD, 0.95); y += H * 0.04; }
  ctx.restore();
}

function drawEnd(phase){
  ctx.fillStyle = BLACK; ctx.fillRect(0, 0, W, H);
  var f = Math.round(Math.max(15, W * 0.017)) + "px Georgia, 'Times New Roman', serif";
  var a = Math.min(1, stateT / 1.2) * 0.9;
  line(endLine, W / 2, H * 0.46, f, BONE, a);
  if (stateT > 2.5)
    line("double-tap to walk again.", W / 2, H * 0.46 + H * 0.06, f, GOLD, Math.min(0.55, (stateT - 2.5) / 2));
}

/* descend: prologue dimming under the blindfold */
function drawDescend(phase){
  drawPrologue(phase);
  ctx.fillStyle = BLACK; ctx.globalAlpha = Math.min(1, stateT / 1.0);
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  if (stateT >= 1.0){ MODE = "walk"; stateT = 0; }
}

function draw(phase){
  cv.style.width = W + "px"; cv.style.height = H + "px";
  if (MODE === "prologue") drawPrologue(phase);
  else if (MODE === "descend") drawDescend(phase);
  else if (MODE === "walk") drawWalk(phase);
  else if (MODE === "reveal") drawReveal(phase);
  else if (MODE === "end") drawEnd(phase);
}

/* ---------- interaction ---------- */
function setMode(m){ MODE = m; stateT = 0; }
function resetWalk(){
  handX = W * 0.10; handTargetX = handX;
  calledIdx = -1; revealA = 0; endLine = "";
  setMode("prologue");
}
resetWalk();

function nearestPiece(){
  var best = -1, bd = 1e9;
  for (var i = 0; i < 16; i++){
    var d = Math.abs(pieceX(i) - handX);
    if (d < bd){ bd = d; best = i; }
  }
  return bd <= spacing() * 0.45 ? best : -1;
}
function finishWalk(txt){ endLine = txt; setMode("end"); }

function pt(e){ return [e.clientX, e.clientY]; }
cv.addEventListener("pointerdown", function(e){
  var p = pt(e);
  dragOn = true; dragMoved = false;
  downX = p[0]; downY = p[1]; downT = performance.now();
  targetAtDown = handTargetX;
  if (MODE === "prologue") holdT = 0;
});
cv.addEventListener("pointermove", function(e){
  if (!dragOn) return;
  var p = pt(e);
  if (Math.abs(p[0] - downX) > 8 || Math.abs(p[1] - downY) > 8) dragMoved = true;
  if (MODE === "walk" && dragMoved){
    handTargetX = Math.max(W * 0.05, Math.min(wallEnd(), targetAtDown + (p[0] - downX)));
  }
  if (MODE === "prologue") holdT = -1; /* moving breaks the hold */
});
cv.addEventListener("pointerup", function(e){
  if (!dragOn) return;
  dragOn = false;
  var now = performance.now();
  var wasHold = (MODE === "prologue" && holdT >= 0);
  if (MODE === "prologue") holdT = -1;
  if (wasHold) return; /* the hold outcome is decided by the tick, not the release */
  if (!dragMoved && now - downT < 350){
    var p = pt(e);
    var dbl = (now - lastTapT < 380 && Math.abs(p[0] - lastTapX) < 44 && Math.abs(p[1] - lastTapY) < 44);
    if (MODE === "walk"){
      var idx = nearestPiece();
      if (idx >= 0){
        calledIdx = idx; REVEAL_IDX = idx; revealA = 0;
        setMode("reveal");
      }
      lastTapT = now; lastTapX = p[0]; lastTapY = p[1];
    } else if (MODE === "reveal"){
      if (stateT > 1.0){ finishWalk("the walk ends. one piece was yours."); }
      lastTapT = now; lastTapX = p[0]; lastTapY = p[1];
    } else if (MODE === "end"){
      if (dbl){ resetWalk(); lastTapT = -10000; }
      else { lastTapT = now; lastTapX = p[0]; lastTapY = p[1]; }
    }
  }
});
cv.addEventListener("pointercancel", function(){ dragOn = false; holdT = -1; });

/* ---------- loop ---------- */
var lastStamp = -1, phase0 = -1;
function tick(stamp){
  if (lastStamp < 0){ lastStamp = stamp; phase0 = stamp; }
  var dt = Math.min(0.05, (stamp - lastStamp) / 1000);
  lastStamp = stamp;
  var phase = (stamp - phase0) / 1000;
  stateT += dt;
  if (MODE === "prologue" && holdT >= 0 && dragOn){
    holdT += dt;
    if (holdT >= 1.2){ holdT = -1; setMode("descend"); }
  }
  if (MODE === "walk"){
    /* the hand is led: it catches up at its own pace, never faster */
    var maxStep = W * 0.30 * dt;
    var dx = handTargetX - handX;
    if (Math.abs(dx) > 0.5) handX += Math.sign(dx) * Math.min(Math.abs(dx), maxStep);
    if (handX >= pieceX(15) + spacing() * 0.8) finishWalk("no piece called. that is also an answer.");
  }
  if (MODE === "reveal"){
    revealA = Math.min(1, stateT / 0.9);
    if (stateT >= 14) finishWalk("the walk ends. one piece was yours.");
  }
  if (MODE === "end" && stateT > 11) resetWalk();
  draw(phase);
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(tick);
}

/* synchronous first frame at the fixed phase (prologue), then the loop */
draw(0);
if (typeof requestAnimationFrame === "function") requestAnimationFrame(tick);
})();
</script>
</body>
</html>
