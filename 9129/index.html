<!DOCTYPE html>
<html lang="en">

<!-- piece-9129-petal-weather -->
<title>Petal Weather</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #141238; height: 100%; }
  #field { display: block; touch-action: none; cursor: crosshair; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 18px; text-align: center;
    color: rgba(244,238,214,0.42); font: 12px/1.4 system-ui, sans-serif;
    letter-spacing: 0.08em; pointer-events: none; user-select: none;
    transition: opacity 1.6s ease; opacity: 1;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="hint">drag to stir the field &middot; tap for a new meadow</div>
<script>
'use strict';
/* Piece 9129 "Petal Weather" — DRIVER CORE.
 * Pure functions, no DOM. Shared verbatim by the browser page and the node harness.
 */

const TAU = Math.PI * 2;

function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

function smoothstep(a, b, x) {
  const t = clamp01((x - a) / (b - a));
  return t * t * (3 - 2 * t);
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Wave spec. Constants are asserted by the harness. */
const WAVE = {
  T: 22,        // seconds per full temporal cycle of wave 1
  LAMBDA: 520,  // px spatial wavelength of wave 1
  A1: 0.62,     // travel direction angle (rad) of wave 1
  T2: 44,         // wave 2 period (2x wave 1, so the whole field loops every 44s)
  LAMBDA2: 940,
  A2: -1.05,
  P1: 0.7,
  P2: 2.1,
};

const FLOWER_COUNT = 420;
const GUST_R = 150;        // px radius of a drag gust
const GUST_DECAY = 2.5;    // seconds, exponential decay of gust strength
const GUST_STRENGTH = 1.0;

/* Traveling-wave field. Returns 0..1. Periodic in t with period 44s (2x wave-1 period). */
function waveRaw(x, y, t) {
  const k1 = TAU / WAVE.LAMBDA, w1 = TAU / WAVE.T;
  const k2 = TAU / WAVE.LAMBDA2, w2 = TAU / WAVE.T2;
  const s1 = Math.sin(k1 * (x * Math.cos(WAVE.A1) + y * Math.sin(WAVE.A1)) - w1 * t + WAVE.P1);
  const s2 = Math.sin(k2 * (x * Math.cos(WAVE.A2) + y * Math.sin(WAVE.A2)) + w2 * t + WAVE.P2);
  return 0.5 + 0.27 * s1 + 0.23 * s2;
}

/* Bloom level of one flower at time t: wave-driven, thresholded into bands. */
function bloomAt(f, t) {
  const v = waveRaw(f.x, f.y, t) * 0.9 + 0.1 * (0.5 + 0.5 * Math.sin(t * 0.31 + f.phase));
  return smoothstep(0.40, 0.64, v);
}

/* Deterministic meadow. Sorted by y for painter's-order rendering. */
function makeMeadow(seed, w, h, n) {
  const rand = mulberry32(seed);
  const flowers = [];
  for (let i = 0; i < n; i++) {
    const r = rand();
    flowers.push({
      x: rand() * w,
      y: rand() * h,
      size: 7 + rand() * 13,              // base petal radius, px
      petals: 5 + Math.floor(rand() * 4), // 5..8
      family: r < 0.42 ? 0 : r < 0.74 ? 1 : 2, // 0 amber, 1 poppy, 2 ivory
      phase: rand() * TAU,
      stem: 26 + rand() * 46,             // stem length, px
      lean: (rand() - 0.5) * 14,          // resting lean, px
    });
  }
  flowers.sort((a, b) => a.y - b.y);
  return { seed, w, h, flowers };
}

/* Gusts: drag disturbances. Pure w.r.t. (x, y, t, gusts). */
function addGust(gusts, x, y, t) {
  gusts.push({ x, y, r: GUST_R, t0: t, strength: GUST_STRENGTH });
  while (gusts.length > 24) gusts.shift();
}

function gustBoost(x, y, t, gusts) {
  let b = 0;
  for (const g of gusts) {
    const age = t - g.t0;
    if (age < 0 || age > 9) continue;
    const dx = x - g.x, dy = y - g.y;
    b += g.strength * Math.exp(-(dx * dx + dy * dy) / (g.r * g.r)) * Math.exp(-age / GUST_DECAY);
  }
  return Math.min(b, 1.2);
}

/* Stem bend vector (px) away from gust centers, decaying with age. */
function bendFromGusts(x, y, t, gusts) {
  let bx = 0, by = 0;
  for (const g of gusts) {
    const age = t - g.t0;
    if (age < 0 || age > 9) continue;
    const dx = x - g.x, dy = y - g.y;
    const d = Math.hypot(dx, dy) + 1e-6;
    const f = Math.exp(-(d * d) / (g.r * g.r)) * Math.exp(-age / GUST_DECAY) * g.strength;
    bx += (dx / d) * f * 26;
    by += (dy / d) * f * 10;
  }
  return { bx, by };
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    TAU, WAVE, FLOWER_COUNT, GUST_R, GUST_DECAY, GUST_STRENGTH,
    clamp01, smoothstep, mulberry32,
    waveRaw, bloomAt, makeMeadow,
    addGust, gustBoost, bendFromGusts,
  };
}


</script>
<script>
'use strict';
/* Piece 9129 "Petal Weather" — RENDERER (browser only).
 * Uses the driver core (inlined above this script in the built page).
 */

(function () {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  const FAMILIES = [
    [245, 166, 35],   // amber
    [230, 57, 70],    // poppy
    [244, 238, 214],  // ivory
  ];
  function shade(col, k) {
    return [Math.min(255, col[0] * k) | 0, Math.min(255, col[1] * k) | 0, Math.min(255, col[2] * k) | 0];
  }
  const DARK = FAMILIES.map(c => shade(c, 0.52));
  const LIGHT = FAMILIES.map(c => shade(c, 1.16));
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(3) + ')'; }

  let W = 0, H = 0, dpr = 1;
  let seed = (Math.random() * 1e9) | 0;
  let meadow = null;
  let motes = [];
  let gusts = [];
  let stars = [];
  const DPR_CAP = 2;

  // ?t=N pins the field clock (review shots); the clock still advances from N.
  let tPin = null;
  try {
    const tp = new URLSearchParams(location.search).get('t');
    if (tp !== null && tp !== '') { const v = parseFloat(tp); if (isFinite(v)) tPin = v; }
  } catch (e) { /* ignore */ }
  const t0ms = performance.now();

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    meadow = makeMeadow(seed, W, H, FLOWER_COUNT);
    makeMotes();
    const r = mulberry32(seed ^ 0x51ab);
    stars = [];
    const n = Math.round(50 + 60 * (W * H) / (1280 * 800));
    for (let i = 0; i < n; i++) {
      stars.push({ x: r() * W, y: r() * H * 0.55, rad: 0.5 + r() * 1.1, ph: r() * TAU, a: 0.10 + r() * 0.25 });
    }
  }

  function makeMotes() {
    const r = mulberry32(seed ^ 0x9e37);
    motes = [];
    const n = Math.round(40 + 40 * (W * H) / (1280 * 800));
    for (let i = 0; i < n; i++) {
      motes.push({
        x: r() * W, y: r() * H,
        vx: (r() - 0.5) * 8, vy: -4 - r() * 8,
        rad: 0.8 + r() * 1.6, ph: r() * TAU,
      });
    }
  }

  function drawBackground(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0.00, '#171238');
    g.addColorStop(0.38, '#2c1a4d');
    g.addColorStop(0.62, '#57224b');
    g.addColorStop(0.82, '#8c3648');
    g.addColorStop(1.00, '#b25a36');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // ember glow low on the horizon
    const eg = ctx.createRadialGradient(W * 0.5, H * 1.04, 10, W * 0.5, H * 1.04, W * 0.75);
    eg.addColorStop(0, 'rgba(255,150,80,0.20)');
    eg.addColorStop(1, 'rgba(255,150,80,0)');
    ctx.fillStyle = eg;
    ctx.fillRect(0, 0, W, H);
    // stars, upper sky only
    for (const s of stars) {
      ctx.fillStyle = 'rgba(235,240,255,' + (s.a * (0.55 + 0.45 * Math.sin(t * 0.8 + s.ph))).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.rad, 0, TAU);
      ctx.fill();
    }
  }

  function petal(cx, cy, ang, len, wid) {
    const c = Math.cos(ang), s = Math.sin(ang);
    const tx = cx + c * len, ty = cy + s * len;
    const px = -s, py = c;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.quadraticCurveTo(cx + c * len * 0.55 + px * wid, cy + s * len * 0.55 + py * wid, tx, ty);
    ctx.quadraticCurveTo(cx + c * len * 0.55 - px * wid, cy + s * len * 0.55 - py * wid, cx, cy);
    ctx.fill();
  }

  function crease(cx, cy, ang, len) {
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * len * 0.12, cy + Math.sin(ang) * len * 0.12);
    ctx.lineTo(cx + Math.cos(ang) * len * 0.88, cy + Math.sin(ang) * len * 0.88);
    ctx.stroke();
  }

  function drawFlower(f, t) {
    let bloom = bloomAt(f, t) + gustBoost(f.x, f.y, t, gusts);
    if (bloom > 1) bloom = 1;
    // steep visual mapping: troughs vanish, peaks blaze
    const bv = Math.pow(bloom, 1.5);
    const ba = Math.pow(bloom, 2.0);

    const bend = bendFromGusts(f.x, f.y, t, gusts);
    const sway = 6 * Math.sin(t * 0.6 + f.y * 0.008);
    const hx = f.x + sway + bend.bx + f.lean * 0.4;
    const hy = f.y + 3 * Math.sin(t * 0.45 + f.phase) + bend.by * 0.3;

    // stem: fades out in the troughs so they read as empty dusk
    const bx0 = f.x + f.lean * 0.1, by0 = f.y + f.stem;
    ctx.strokeStyle = 'rgba(96,116,86,' + (0.05 + 0.30 * Math.pow(bloom, 0.8)).toFixed(3) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(bx0, by0);
    ctx.quadraticCurveTo(bx0 + (hx - bx0) * 0.3, by0 + (hy - by0) * 0.6, hx, hy);
    ctx.stroke();

    // one leaf at mid-stem
    if (ba > 0.05) {
      const lx = bx0 + (hx - bx0) * 0.45, ly = by0 + (hy - by0) * 0.45;
      const side = f.phase > Math.PI ? 1 : -1;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(side * 0.9);
      ctx.fillStyle = 'rgba(84,104,70,' + (0.08 + 0.42 * ba).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(f.size * 0.42, 0, f.size * 0.52, f.size * 0.20, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    if (bloom < 0.10) {
      // closed bud: small, dim — troughs stay quiet
      ctx.fillStyle = 'rgba(74,80,52,' + (0.22 + 0.30 * bloom).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(hx, hy, 2.6, 4.0, 0, 0, TAU);
      ctx.fill();
      return;
    }

    const col = FAMILIES[f.family], dark = DARK[f.family], light = LIGHT[f.family];
    const L = f.size * bv * 1.18;
    const wid = L * 0.44;

    // halo behind strong blooms
    if (bloom > 0.72) {
      const ha = 0.30 * (bloom - 0.72) / 0.28;
      const hg = ctx.createRadialGradient(hx, hy, 1, hx, hy, L * 2.4);
      hg.addColorStop(0, rgba(col, ha));
      hg.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(hx, hy, L * 2.4, 0, TAU);
      ctx.fill();
    }

    // back petal layer: darker, half-step offset, slightly larger
    ctx.fillStyle = rgba(dark, ba);
    for (let i = 0; i < f.petals; i++) {
      const ang = f.phase + ((i + 0.5) / f.petals) * TAU + 0.10 * Math.sin(f.phase + i * 1.7);
      const jl = L * 1.08 * (0.9 + 0.2 * Math.sin(f.phase + i * 2.3));
      petal(hx, hy, ang, jl, wid * 1.05);
    }
    // front petal layer: lighter, with crease lines
    ctx.fillStyle = rgba(light, ba);
    ctx.strokeStyle = rgba(dark, 0.55 * ba);
    ctx.lineWidth = 0.8;
    for (let i = 0; i < f.petals; i++) {
      const ang = f.phase + (i / f.petals) * TAU + 0.10 * Math.sin(f.phase * 1.3 + i * 2.1);
      const jl = L * (0.9 + 0.2 * Math.sin(f.phase + i * 2.3));
      petal(hx, hy, ang, jl, wid);
      crease(hx, hy, ang, jl);
    }
    // heart: dark disc, stamen ring, bright core
    ctx.fillStyle = rgba([58, 30, 26], ba);
    ctx.beginPath();
    ctx.arc(hx, hy, Math.max(1, L * 0.20), 0, TAU);
    ctx.fill();
    ctx.fillStyle = rgba([255, 236, 180], 0.9 * ba);
    const sr = L * 0.30;
    for (let i = 0; i < 7; i++) {
      const a2 = f.phase * 2 + (i / 7) * TAU;
      ctx.beginPath();
      ctx.arc(hx + Math.cos(a2) * sr, hy + Math.sin(a2) * sr, Math.max(0.6, L * 0.045), 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = rgba([255, 250, 225], ba);
    ctx.beginPath();
    ctx.arc(hx - L * 0.05, hy - L * 0.05, Math.max(0.7, L * 0.07), 0, TAU);
    ctx.fill();
  }

  let last = 0;
  function frame(now) {
    const t = tPin !== null ? tPin + (now - t0ms) / 1000 : now / 1000;
    const dt = Math.min((now - last) / 1000 || 0.016, 0.1);
    last = now;

    for (let i = gusts.length - 1; i >= 0; i--) {
      if (t - gusts[i].t0 > 9) gusts.splice(i, 1);
    }

    drawBackground(t);

    ctx.fillStyle = 'rgba(255,220,170,0.13)';
    for (const m of motes) {
      m.x += (m.vx + 3 * Math.sin(t * 0.5 + m.ph)) * dt;
      m.y += m.vy * dt;
      if (m.y < -4) { m.y = H + 4; m.x = Math.random() * W; }
      if (m.x < -4) m.x = W + 4; else if (m.x > W + 4) m.x = -4;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.rad, 0, TAU);
      ctx.fill();
    }

    for (const f of meadow.flowers) drawFlower(f, t);

    requestAnimationFrame(frame);
  }

  // interaction: drag = gust, tap = reseed
  let downAt = 0, downX = 0, downY = 0, dragging = false, lastGust = 0;
  canvas.addEventListener('pointerdown', function (e) {
    downAt = performance.now(); downX = e.clientX; downY = e.clientY;
    dragging = false;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (downAt === 0) return;
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 8) dragging = true;
    if (dragging) {
      const now = performance.now();
      if (now - lastGust > 40) {
        lastGust = now;
        const t = tPin !== null ? tPin + (now - t0ms) / 1000 : now / 1000;
        addGust(gusts, e.clientX, e.clientY, t);
      }
    }
  });
  function endPointer(e) {
    if (downAt === 0) return;
    const quick = performance.now() - downAt < 400;
    if (!dragging && quick) {
      seed = (Math.random() * 1e9) | 0;
      gusts = [];
      meadow = makeMeadow(seed, W, H, FLOWER_COUNT);
      makeMotes();
    }
    downAt = 0; dragging = false;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function () { downAt = 0; dragging = false; });

  window.addEventListener('resize', resize);

  resize();
  setTimeout(function () { hint.classList.add('gone'); }, 7000);
  requestAnimationFrame(function (n) { last = n; requestAnimationFrame(frame); });
})();

</script>
</body>
