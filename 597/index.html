<!DOCTYPE html>
<html lang="es">
<head>

<title>Microhistorias Geselinas</title>

  html, body { margin:0; padding:0; height:100%; background:#FAF7F0; overflow:hidden; }
  canvas { display:block; touch-action:none; }

<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var INK = '#1A1A1A', PAPER = '#FAF7F0', BLUE = '#3E6FA8', GREEN = '#4A6741';

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rng = mulberry32(597072);
function mod(a, n){ return ((a % n) + n) % n; }

/* ---------- precomputed paper speckle (seeded data, drawn directly) ---------- */
var speckles = [];
for (var si = 0; si < 240; si++){
  speckles.push({ x: rng()*1000, y: rng()*1000, r: 0.8 + rng()*1.5, a: 0.03 + rng()*0.05 });
}

/* ---------- geometry helpers ---------- */
function seg(x1,y1,x2,y2,n){ var p=[],i; n = n || Math.max(2, Math.round(Math.hypot(x2-x1, y2-y1)/11)); for(i=0;i<=n;i++) p.push([x1+(x2-x1)*i/n, y1+(y2-y1)*i/n]); return p; }
function rectP(x,y,w,h){ return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]]; }
function circP(cx,cy,r,n){ var p=[],i,a; n=n||24; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function ellP(cx,cy,rx,ry,n){ var p=[],i,a; n=n||28; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); } return p; }
function arcP(cx,cy,r,a0,a1,n){ var p=[],i,a; n=n||12; for(i=0;i<=n;i++){ a=a0+(a1-a0)*i/n; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function wavyH(x1,x2,y,amp,per){ var p=[],x; for(x=x1;x<=x2;x+=7) p.push([x, y+Math.sin((x-x1)/per*Math.PI*2)*amp]); p.push([x2, y+Math.sin((x2-x1)/per*Math.PI*2)*amp]); return p; }
function jit(pts, amt){ var out=[],i; for(i=0;i<pts.length;i++) out.push([pts[i][0]+(rng()*2-1)*amt, pts[i][1]+(rng()*2-1)*amt]); return out; }
function S(pts, o){ o = o || {}; var p = jit(pts, o.j !== undefined ? o.j : 1.5); var len=0,i; var n=p.length, lim = o.close ? n : n-1; for(i=1;i<=lim;i++){ var a=p[i-1], b=p[i%n]; len += Math.hypot(b[0]-a[0], b[1]-a[1]); } return { pts:p, w:o.w||3, color:o.color||null, close:!!o.close, len:len }; }
function T(strokes, ox, oy){ var out=[],i,j,st; for(i=0;i<strokes.length;i++){ st = strokes[i]; var p=[]; for(j=0;j<st.pts.length;j++) p.push([st.pts[j][0]+ox, st.pts[j][1]+oy]); out.push({ pts:p, w:st.w, color:st.color, close:st.close, len:st.len }); } return out; }

/* ================================================================
   BACK LAYER: the pine forest. Green is spent here and only here.
   Segment 1500 wide, parallax 0.30.
   ================================================================ */
var SEG_B = 1500;
function pinePts(x, base, h, w){
  var p = [
    [x, base-h],
    [x+w*0.30, base-h*0.74], [x+w*0.13, base-h*0.74],
    [x+w*0.40, base-h*0.46], [x+w*0.17, base-h*0.46],
    [x+w*0.52, base-h*0.18], [x+w*0.08, base-h*0.18],
    [x+w*0.08, base], [x-w*0.08, base],
    [x-w*0.08, base-h*0.18], [x-w*0.52, base-h*0.18],
    [x-w*0.17, base-h*0.46], [x-w*0.40, base-h*0.46],
    [x-w*0.13, base-h*0.74], [x-w*0.30, base-h*0.74]
  ];
  return jit(p, 2.2);
}
var pinesBack = [], pinesFront = [], bi, bx;
for (bi = 0; bi < 12; bi++){ bx = 40 + bi*124 + rng()*56; pinesBack.push({ pts: pinePts(bx, 508, 66 + rng()*80, 40 + rng()*26), a: 0.45 }); }
for (bi = 0; bi < 9; bi++){ bx = 70 + bi*162 + rng()*70; pinesFront.push({ pts: pinePts(bx, 502, 130 + rng()*165, 58 + rng()*34), a: 0.92 }); }

/* sky: two bird marks and one cloud, static ink */
var skyStrokes = [
  S(arcP(238,148, 11, Math.PI*1.15, Math.PI*1.85), { w:2.2, j:0.8 }),
  S(arcP(262,142, 11, Math.PI*1.15, Math.PI*1.85), { w:2.2, j:0.8 }),
  S(arcP(700,104, 9, Math.PI*1.15, Math.PI*1.85), { w:2, j:0.8 }),
  S(arcP(721,99, 9, Math.PI*1.15, Math.PI*1.85), { w:2, j:0.8 }),
  S(circP(742,196, 30), { w:2.2, j:1.6 }),
  S(circP(782,186, 38), { w:2.2, j:1.6 }),
  S(circP(826,198, 27), { w:2.2, j:1.6 })
];

/* ================================================================
   MID LAYER: the sandy street. Segment 2600 wide, parallax 0.60.
   Buildings stand on the far edge (y=590); the street runs 590-705.
   ================================================================ */
var SEG_M = 2600, PHASE_M = 1175;
var midStrokes = [], midFills = [];
function addMid(strokes, ox){ var t = T(strokes, ox, 0), i; for(i=0;i<t.length;i++) midStrokes.push(t[i]); }
function addFill(pts, ox, color){ var p=[],i; for(i=0;i<pts.length;i++) p.push([pts[i][0]+ox, pts[i][1]]); midFills.push({ pts: jit(p, 1.1), color: color }); }

/* lemon tree (world ~90-270) */
addMid([
  S(seg(172,590, 166,508), { w:4 }),
  S(seg(168,540, 138,492), { w:3 }), S(seg(167,528, 204,486), { w:3 }),
  S(circP(140,468, 46), { w:2.8 }), S(circP(188,452, 40), { w:2.8 }), S(circP(224,478, 34), { w:2.8 })
], 0);
var lemonPts = [[128,452],[168,430],[206,462],[150,486],[196,492],[226,458]];
for (bi = 0; bi < lemonPts.length; bi++){
  addFill(circP(lemonPts[bi][0], lemonPts[bi][1], 8), 0, PAPER);
  addMid([ S(circP(lemonPts[bi][0], lemonPts[bi][1], 8), { close:true, w:2, j:0.6 }) ], 0);
}

/* house A (world ~370-485) */
addMid([
  S(rectP(372,472, 110, 118), { close:true, w:3 }),
  S(seg(360,474, 427,428), { w:3.2 }), S(seg(427,428, 494,474), { w:3.2 }),
  S(rectP(448,434, 17, 26), { close:true, w:2.4 }),
  S(rectP(414,522, 28, 68), { close:true, w:2.6 }),
  S(rectP(384,498, 21, 24), { close:true, w:2.2 }), S(rectP(452,498, 21, 24), { close:true, w:2.2 })
], 0);

/* the toad, owner of the path (world ~700-760, on the street) */
addFill(ellP(728,668, 36, 18), 0, PAPER);
addFill(circP(706,650, 9), 0, PAPER);
addFill(circP(750,650, 9), 0, PAPER);
addMid([
  S(ellP(728,668, 36, 18), { close:true, w:2.8 }),
  S(circP(706,650, 9), { close:true, w:2.2 }), S(circP(750,650, 9), { close:true, w:2.2 }),
  S(arcP(728,664, 13, Math.PI*0.25, Math.PI*0.75), { w:2 }),
  S(seg(700,682, 686,690), { w:2.4 }), S(seg(756,682, 770,690), { w:2.4 }),
  S(circP(716,660, 3.4), { close:true, w:1.4, j:0.5 }), S(circP(742,672, 3), { close:true, w:1.4, j:0.5 })
], 0);

/* street pine with the woodpecker (world ~1090-1190) */
addMid([
  S(seg(1128,590, 1133,428), { w:4 }), S(seg(1148,590, 1141,428), { w:4 }),
  S(seg(1135,486, 1102,448), { w:2.6 }), S(seg(1138,462, 1172,430), { w:2.6 }),
  S(circP(1137,392, 42), { w:2.6 }), S(circP(1102,414, 33), { w:2.6 }), S(circP(1172,414, 33), { w:2.6 }),
  S(seg(1140,492, 1132,514), { w:2.2 }),
  S(seg(1180,446, 1189,441), { w:1.8, j:0.5 }), S(seg(1181,456, 1190,453), { w:1.8, j:0.5 })
], 0);
(function(){
  var bp = [], i, a;
  for (i = 0; i < 22; i++){ a = i/22*Math.PI*2; var lx = Math.cos(a)*10, ly = Math.sin(a)*17; bp.push([1150 + lx*Math.cos(-0.5) - ly*Math.sin(-0.5), 476 + lx*Math.sin(-0.5) + ly*Math.cos(-0.5)]); }
  addFill(bp, 0, PAPER);
  addFill(circP(1159,456, 8.5), 0, PAPER);
  addMid([
    { pts: jit(bp, 0.8), w:2.2, color:null, close:true, len:120 },
    S(circP(1159,456, 8.5), { close:true, w:2.2, j:0.6 }),
    S([[1166,453],[1180,458],[1166,462]], { close:true, w:2, j:0.4 })
  ], 0);
})();

/* the historic chalet (world ~1425-1625) */
addMid([
  S(seg(1425,434, 1525,338), { w:3.4 }), S(seg(1525,338, 1625,434), { w:3.4 }),
  S(seg(1438,434, 1612,434), { w:2.6 }),
  S(rectP(1448,434, 154, 156), { close:true, w:3 }),
  S(circP(1525,388, 11), { close:true, w:2.2 }),
  S(seg(1514,388, 1536,388), { w:1.6 }), S(seg(1525,377, 1525,399), { w:1.6 }),
  S(rectP(1470,382, 25, 36), { close:true, w:2.2 }), S(rectP(1555,382, 25, 36), { close:true, w:2.2 }),
  S(seg(1462,472, 1588,472), { w:2.6 }),
  S(rectP(1506,508, 38, 82), { close:true, w:2.6 }),
  S(arcP(1525,508, 19, Math.PI, 0), { w:2.6 }),
  S(rectP(1462,502, 24, 32), { close:true, w:2.2 }), S(rectP(1564,502, 24, 32), { close:true, w:2.2 }),
  S(seg(1448,576, 1602,576), { w:1.6, j:0.7 }),
  S(seg(1510,590, 1494,644), { w:2, j:0.8 }), S(seg(1540,590, 1556,644), { w:2, j:0.8 })
], 0);
for (bi = 0; bi < 9; bi++) addMid([ S(seg(1474 + bi*14, 472, 1474 + bi*14, 492), { w:1.6, j:0.5 }) ], 0);

/* garden patch behind its fence (world ~1700-2100): flowers first, fence over them */
var patchHeads = [];
for (bi = 0; bi < 13; bi++){
  var px = 1736 + bi*28 + rng()*10, ph = 552 + rng()*16;
  addMid([ S(seg(px,600, px,ph + 8), { w:1.8, j:0.7 }) ], 0);
  patchHeads.push({ x: px, y: ph, blue: rng() < 0.4 });
}
addMid([
  S(seg(1700,562, 2100,562), { w:2.4 }), S(seg(1700,586, 2100,586), { w:2.4 })
], 0);
for (bi = 0; bi < 9; bi++) addMid([ S(seg(1706 + bi*49, 546, 1706 + bi*49, 602), { w:2.6, j:0.7 }) ], 0);

/* house C, low with a porch (world ~2090-2275) */
addMid([
  S(rectP(2102,506, 158, 84), { close:true, w:3 }),
  S(seg(2090,508, 2181,476), { w:3.2 }), S(seg(2181,476, 2272,508), { w:3.2 }),
  S(seg(2112,528, 2250,528), { w:2.2 }),
  S(seg(2124,528, 2124,590), { w:2.2 }), S(seg(2238,528, 2238,590), { w:2.2 }),
  S(rectP(2166,536, 30, 54), { close:true, w:2.4 }),
  S(rectP(2128,540, 22, 24), { close:true, w:2 }), S(rectP(2212,540, 22, 24), { close:true, w:2 })
], 0);

/* the sea, glimpsed at the end of the street (world ~2300-2600) */
addMid([
  S(wavyH(2306, 2570, 500, 5, 62), { w:2.6, color: BLUE, j:0.8 }),
  S(wavyH(2326, 2590, 528, 5, 54), { w:2.6, color: BLUE, j:0.8 }),
  S(wavyH(2306, 2550, 556, 5, 70), { w:2.6, color: BLUE, j:0.8 }),
  S(wavyH(2340, 2580, 582, 4, 58), { w:2.4, color: BLUE, j:0.8 }),
  S(seg(2300,472, 2600,472), { w:1.8, j:0.7 }),
  S(seg(2446,472, 2446,438), { w:2 }),
  S([[2446,438],[2470,458],[2446,458]], { close:true, w:2, j:0.6 })
], 0);

/* sand grain on the street (seeded data, scrolls with the mid layer) */
var streetGrain = [];
for (bi = 0; bi < 340; bi++) streetGrain.push({ x: rng()*SEG_M, y: 602 + rng()*94, r: 1.2 + rng()*1.6, a: 0.06 + rng()*0.10 });
for (bi = 0; bi < 30; bi++){
  var gx = rng()*SEG_M, gy = 614 + rng()*76, gl = 7 + rng()*9;
  addMid([ S(seg(gx, gy, gx + gl, gy + (rng()*3 - 1.5)), { w:1.5, j:0.5 }) ], 0);
}

/* ================================================================
   FRONT LAYER: the garden and the sandy path. Segment 1100, parallax 1.
   ================================================================ */
var SEG_F = 1100;
var frontStrokes = [], flowers = [], bushes = [];
for (bi = 0; bi < 17; bi++){
  var fx = 30 + bi*62 + rng()*30, ftop = 764 + rng()*84, fr = 7 + rng()*4.5, fblue = rng() < 0.42;
  frontStrokes.push(S(seg(fx, 902, fx + (rng()*8 - 4), ftop + fr), { w:2.2, j:0.8 }));
  frontStrokes.push(S(arcP(fx - 8, 884, 9, Math.PI*1.1, Math.PI*1.6), { w:1.8, j:0.6 }));
  flowers.push({ x: fx, y: ftop, r: fr, blue: fblue, pts: jit(circP(fx, ftop, fr), 0.7) });
}
for (bi = 0; bi < 6; bi++) bushes.push({ x: 90 + bi*180 + rng()*60, w: 110 + rng()*50 });
for (bi = 0; bi < 15; bi++){
  var tx = 20 + bi*72 + rng()*30;
  frontStrokes.push(S(seg(tx, 906, tx - 6, 884), { w:1.8, j:0.6 }));
  frontStrokes.push(S(seg(tx, 906, tx, 880), { w:1.8, j:0.6 }));
  frontStrokes.push(S(seg(tx, 906, tx + 6, 884), { w:1.8, j:0.6 }));
}
var pathGrain = [];
for (bi = 0; bi < 170; bi++) pathGrain.push({ x: rng()*SEG_F, y: 914 + rng()*78, r: 1 + rng()*1.7, a: 0.05 + rng()*0.08 });

/* ================================================================
   FLAGS: six numbered micro-stories planted along the street.
   ================================================================ */
var FLAGS = [
  { w: 230,  n: 1, word: 'Limones',   text: 'Limones paraguayos que pican en la caminata.', mini: 'limones' },
  { w: 660,  n: 2, word: 'Sapo',      text: 'Un sapo en el sendero, dueño del paso.', mini: 'sapo' },
  { w: 1090, n: 3, word: 'Carpintero', text: 'El pájaro carpintero que la hace frenar y mirar.', mini: 'carpintero' },
  { w: 1520, n: 4, word: 'Chalet',    text: 'El chalet histórico, de cuando el pueblo era bosque.', mini: 'chalet' },
  { w: 1950, n: 5, word: 'Jardín',    text: 'A finales de agosto comienza a florecer.', mini: 'jardin' },
  { w: 2380, n: 6, word: 'Mar',       text: 'El mar, al final de la calle.', mini: 'mar' }
];

/* the vignette card frame: a wobbly notebook rectangle, precomputed once */
var cardPts = (function(){
  var pts = [], i, t;
  var x = 192, y = 262, w = 616, h = 452, step = 52;
  for (i = 0; i <= w/step; i++) pts.push([x + i*step, y]);
  for (i = 1; i <= h/step; i++) pts.push([x + w, y + i*step]);
  for (i = 1; i <= w/step; i++) pts.push([x + w - i*step, y + h]);
  for (i = 1; i <= h/step; i++) pts.push([x, y + h - i*step]);
  return jit(pts, 2.4);
})();

/* ---------- state ---------- */
var PHASE0 = 0;
var curT = PHASE0, prevT = PHASE0;
var walk = 0;
var dragging = false, lastPX = 0;
var lastInteract = -10;
var openCard = -1;

/* ---------- sizing ---------- */
var viewW = 300, viewH = 300, dpr = 1;
var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : { width:300, height:300 };
var isPhone = Math.min(scr.width, scr.height) < 700;
if (!isPhone && viewH > viewW * 1.15 && Math.min(viewW, viewH) < 700) isPhone = true;

/* ---------- drawing ---------- */
function handFont(size, weight){ return 'italic ' + (weight||600) + ' ' + size + 'px "Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive,sans-serif'; }
function pathOf(pts, close){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function strokePartial(pts, close, budget){
  var n = pts.length, lim = close ? n : n-1, b = budget, i, a, c, dx, dy, L;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(i=1;i<=lim;i++){
    a = pts[i-1]; c = pts[i%n]; dx = c[0]-a[0]; dy = c[1]-a[1]; L = Math.hypot(dx,dy);
    if (b >= L){ ctx.lineTo(c[0], c[1]); b -= L; }
    else { var f = L ? b/L : 0; ctx.lineTo(a[0]+dx*f, a[1]+dy*f); b = 0; break; }
  }
  ctx.stroke();
  return b;
}
function drawStrokes(strokes, p, fallbackColor){
  var total = 0, i;
  for(i=0;i<strokes.length;i++) total += strokes[i].len;
  var budget = p * total, st;
  for(i=0;i<strokes.length;i++){
    st = strokes[i];
    if (budget <= 0) break;
    ctx.strokeStyle = st.color || fallbackColor || INK; ctx.lineWidth = st.w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (budget >= st.len){ pathOf(st.pts, st.close); ctx.stroke(); budget -= st.len; }
    else { strokePartial(st.pts, st.close, budget); budget = 0; }
  }
}
function fillPath(pts, color){
  ctx.save(); ctx.fillStyle = color; pathOf(pts, true); ctx.fill(); ctx.restore();
}
function wrapText(text, maxW, size){
  ctx.font = handFont(size, 600);
  var words = text.split(' '), lines = [], cur = '', i, test;
  for(i=0;i<words.length;i++){
    test = cur ? cur + ' ' + words[i] : words[i];
    if (cur && ctx.measureText(test).width > maxW){ lines.push(cur); cur = words[i]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function grainDots(dots, off, segW){
  var base, i, d;
  for (base = -off; base < 1000; base += segW){
    for (i = 0; i < dots.length; i++){
      d = dots[i];
      if (base + d.x < -4 || base + d.x > 1004) continue;
      ctx.save(); ctx.globalAlpha = d.a; ctx.fillStyle = INK; ctx.fillRect(base + d.x, d.y, d.r, d.r); ctx.restore();
    }
  }
}

function drawBack(offB){
  var base, i;
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.moveTo(0, 501); ctx.lineTo(1000, 501); ctx.stroke(); ctx.restore();
  for (base = -offB; base < 1000; base += SEG_B){
    for (i = 0; i < pinesBack.length; i++){ ctx.save(); ctx.translate(base, 0); ctx.globalAlpha = pinesBack[i].a; fillPath(pinesBack[i].pts, GREEN); ctx.restore(); }
    for (i = 0; i < pinesFront.length; i++){ ctx.save(); ctx.translate(base, 0); ctx.globalAlpha = pinesFront[i].a; fillPath(pinesFront[i].pts, GREEN); ctx.restore(); }
  }
}

function flagScreenX(flag, offM){
  var sx = mod(flag.w - offM, SEG_M);
  if (sx > 1090) sx -= SEG_M;
  return sx;
}

function drawFlag(sx, flag){
  var prox = Math.max(0, 1 - Math.abs(sx - 500)/300);
  var bob = Math.sin(curT*2.4 + flag.n*1.3) * 4 * prox;
  var lift = prox * 7 + bob;
  var topY = 606 - lift;
  ctx.save();
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sx, 702); ctx.lineTo(sx, topY - 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx - 7, 702); ctx.lineTo(sx + 7, 702); ctx.stroke();
  fillPath(rectP(sx, topY, 42, 31), PAPER);
  ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
  pathOf(rectP(sx, topY, 42, 31), true); ctx.stroke();
  if (prox > 0.55){
    ctx.save(); ctx.globalAlpha = (prox - 0.55) * 1.6; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx - 9, topY + 15, 6, Math.PI*0.6, Math.PI*1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx + 51, topY + 15, 6, Math.PI*1.5, Math.PI*0.4); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = INK;
  ctx.font = handFont(Math.round(20 * (1 + prox*0.4)), 700);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(flag.n), sx + 21, topY + 17);
  ctx.restore();
}

function drawMid(offM){
  var base, i;
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(0, 590); ctx.lineTo(1000, 590); ctx.stroke(); ctx.restore();
  grainDots(streetGrain, offM, SEG_M);
  for (base = -offM; base < 1000; base += SEG_M){
    ctx.save(); ctx.translate(base, 0);
    for (i = 0; i < midFills.length; i++) fillPath(midFills[i].pts, midFills[i].color);
    for (i = 0; i < patchHeads.length; i++){
      var hd = patchHeads[i];
      if (hd.blue){ ctx.save(); ctx.fillStyle = BLUE; ctx.beginPath(); ctx.arc(hd.x, hd.y, 4.6, 0, Math.PI*2); ctx.fill(); ctx.restore(); }
      else { ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 1.8; pathOf(circP(hd.x, hd.y, 4.6), true); ctx.stroke(); ctx.restore(); }
    }
    drawStrokes(midStrokes, 1, INK);
    ctx.restore();
  }
  for (i = 0; i < FLAGS.length; i++){
    var sx = flagScreenX(FLAGS[i], offM);
    if (sx > -70 && sx < 1050) drawFlag(sx, FLAGS[i]);
  }
}

function drawFront(offF){
  var base, i, f, b;
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  pathOf(wavyH(0, 1000, 706, 5, 140), false); ctx.stroke(); ctx.restore();
  for (base = -offF; base < 1000; base += SEG_F){
    ctx.save(); ctx.translate(base, 0);
    drawStrokes(frontStrokes, 1, INK);
    for (i = 0; i < flowers.length; i++){
      f = flowers[i];
      if (f.blue){
        ctx.save(); ctx.fillStyle = BLUE; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = PAPER; ctx.beginPath(); ctx.arc(f.x, f.y, f.r*0.34, 0, Math.PI*2); ctx.fill(); ctx.restore();
      } else {
        fillPath(f.pts, PAPER);
        ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.1; ctx.lineJoin = 'round'; pathOf(f.pts, true); ctx.stroke();
        ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(f.x, f.y, 1.7, 0, Math.PI*2); ctx.fill(); ctx.restore();
      }
    }
    for (i = 0; i < bushes.length; i++){
      b = bushes[i];
      ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
      ctx.beginPath();
      var bx0 = b.x - b.w/2;
      ctx.moveTo(bx0, 906);
      for (var ax = bx0; ax < b.x + b.w/2 - 8; ax += 17) ctx.arc(ax + 8.5, 906, 8.5, Math.PI, 0, false);
      ctx.lineTo(b.x + b.w/2, 906);
      ctx.stroke(); ctx.restore();
    }
    ctx.restore();
  }
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  pathOf(wavyH(0, 1000, 908, 4, 120), false); ctx.stroke(); ctx.restore();
  grainDots(pathGrain, offF, SEG_F);
}

/* ---------- the vignette card ---------- */
function miniLine(x1, y1, x2, y2, w){
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = w || 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
function miniWave(cx, cy, w, color){
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath();
  for (var x = 0; x <= w; x += 5){ var y = cy + Math.sin(x/w*Math.PI*2.4)*4; if (x === 0) ctx.moveTo(cx + x, y); else ctx.lineTo(cx + x, y); }
  ctx.stroke(); ctx.restore();
}
function drawMini(key, cx, cy){
  ctx.save();
  if (key === 'limones'){
    ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.ellipse(cx - 18, cy + 8, 21, 16, 0.4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx + 20, cy - 6, 19, 15, 0.4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    miniLine(cx + 30, cy - 20, cx + 44, cy - 32, 2.2);
    ctx.beginPath(); ctx.ellipse(cx + 48, cy - 30, 10, 5, 0.7, 0, Math.PI*2); ctx.stroke();
  } else if (key === 'sapo'){
    ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.ellipse(cx, cy + 10, 38, 17, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx - 16, cy - 6, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 16, cy - 6, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(cx - 16, cy - 6, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 16, cy - 6, 2.2, 0, Math.PI*2); ctx.fill();
    miniLine(cx - 34, cy + 24, cx - 46, cy + 30, 2.4); miniLine(cx + 34, cy + 24, cx + 46, cy + 30, 2.4);
  } else if (key === 'carpintero'){
    miniLine(cx - 26, cy + 38, cx - 24, cy - 40, 5);
    miniLine(cx - 25, cy - 6, cx - 44, cy - 24, 2.4);
    ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(cx - 8, cy - 2, 9, 15, -0.4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 1, cy - 18, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    miniLine(cx + 7, cy - 19, cx + 20, cy - 15, 2.2);
    miniLine(cx - 13, cy + 11, cx - 20, cy + 30, 2.2);
    miniLine(cx + 24, cy - 22, cx + 31, cy - 25, 1.8); miniLine(cx + 25, cy - 12, cx + 32, cy - 12, 1.8);
  } else if (key === 'chalet'){
    miniLine(cx - 42, cy - 8, cx, cy - 40, 3); miniLine(cx, cy - 40, cx + 42, cy - 8, 3);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
    ctx.strokeRect(cx - 32, cy - 8, 64, 46);
    miniLine(cx - 32, cy + 14, cx + 32, cy + 14, 1.8);
    ctx.strokeRect(cx - 7, cy + 16, 14, 22);
    ctx.strokeRect(cx - 24, cy + 0, 11, 11); ctx.strokeRect(cx + 13, cy + 0, 11, 11);
  } else if (key === 'jardin'){
    for (var i = -1; i <= 1; i++){
      miniLine(cx + i*30, cy + 36, cx + i*30, cy - 4, 2.2);
      if (i === 0){ ctx.fillStyle = BLUE; ctx.beginPath(); ctx.arc(cx, cy - 12, 10, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = PAPER; ctx.beginPath(); ctx.arc(cx, cy - 12, 3.4, 0, Math.PI*2); ctx.fill(); }
      else { ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 2.1; ctx.beginPath(); ctx.arc(cx + i*30, cy - 10, 9, 0, Math.PI*2); ctx.fill(); ctx.stroke(); }
    }
    miniWave(cx - 52, cy + 40, 104, INK);
  } else if (key === 'mar'){
    miniWave(cx - 56, cy - 14, 112, BLUE);
    miniWave(cx - 56, cy + 4, 112, BLUE);
    miniWave(cx - 56, cy + 22, 112, BLUE);
  }
  ctx.restore();
}

function drawCard(){
  if (openCard < 0) return;
  var flag = FLAGS[openCard];
  ctx.save();
  ctx.globalAlpha = 0.10; ctx.fillStyle = INK;
  ctx.fillRect(204, 274, 616, 452);
  ctx.globalAlpha = 1;
  fillPath(cardPts, PAPER);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  pathOf(cardPts, true); ctx.stroke();
  ctx.fillStyle = INK; ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.font = handFont(112, 700);
  ctx.fillText(String(flag.n), 238, 402);
  ctx.font = handFont(50, 700);
  ctx.fillText(flag.word, 372, 398);
  ctx.save(); ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  pathOf(wavyH(238, 764, 438, 3, 90), false); ctx.stroke(); ctx.restore();
  var lines = wrapText(flag.text, 520, 28);
  ctx.font = handFont(28, 600);
  for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], 240, 500 + i*38);
  drawMini(flag.mini, 500, 616);
  ctx.restore();
}

function draw(){
  canvas.style.width = viewW + 'px'; canvas.style.height = viewH + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);
  var s = Math.min(viewW/1000, viewH/1000);
  var ox = (viewW - 1000*s)/2, oy = (viewH - 1000*s)/2;
  ctx.setTransform(dpr*s, 0, 0, dpr*s, dpr*ox, dpr*oy);
  var i;
  for(i=0;i<speckles.length;i++){ var sp = speckles[i]; ctx.save(); ctx.globalAlpha = sp.a; ctx.fillStyle = INK; ctx.fillRect(sp.x, sp.y, sp.r, sp.r); ctx.restore(); }
  drawStrokes(skyStrokes, 1, INK);
  var offB = mod(walk*0.30, SEG_B);
  var offM = mod(walk*0.60 + PHASE_M, SEG_M);
  var offF = mod(walk*1.0, SEG_F);
  drawBack(offB);
  drawMid(offM);
  drawFront(offF);
  drawCard();
  ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = INK; ctx.font = handFont(21, 600);
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.fillText('drag · tap', 972, 968); ctx.restore();
}

/* ---------- sizing listeners (Visual Viewport API + window) ---------- */
function resize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  viewW = vv ? vv.width : window.innerWidth;
  viewH = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw();
}
if (typeof window !== 'undefined' && window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (typeof window !== 'undefined') window.addEventListener('resize', resize);

/* ---------- interaction: drag walks the town; tap a flag opens its vignette; any tap closes the card ---------- */
function toStage(e){
  var r = { left:0, top:0 };
  if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
  var cx = (e.clientX - r.left), cy = (e.clientY - r.top);
  var s = Math.min(viewW/1000, viewH/1000);
  return { x: (cx - (viewW - 1000*s)/2)/s, y: (cy - (viewH - 1000*s)/2)/s };
}
var pdown = null;
canvas.addEventListener('pointerdown', function(e){
  var p = toStage(e);
  pdown = { x:p.x, y:p.y, moved:false };
  lastPX = p.x;
  lastInteract = curT;
  if (openCard < 0) dragging = true;
});
canvas.addEventListener('pointermove', function(e){
  if (!pdown) return;
  var p = toStage(e);
  if (Math.abs(p.x - pdown.x) > 8 || Math.abs(p.y - pdown.y) > 8) pdown.moved = true;
  lastInteract = curT;
  if (dragging && openCard < 0){
    walk -= (p.x - lastPX) / 0.60;
    draw();
  }
  lastPX = p.x;
});
function endPointer(e){
  if (!pdown) return;
  var wasTap = !pdown.moved, px = pdown.x, py = pdown.y;
  pdown = null; dragging = false;
  lastInteract = curT;
  if (wasTap){
    if (openCard >= 0){ openCard = -1; }
    else {
      var offM = mod(walk*0.60 + PHASE_M, SEG_M);
      var rad = isPhone ? 56 : 46, i, sx;
      for (i = 0; i < FLAGS.length; i++){
        sx = flagScreenX(FLAGS[i], offM);
        if (Math.abs(px - (sx + 21)) < rad && py > 580 && py < 720){ openCard = i; break; }
      }
    }
  }
  draw();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ pdown = null; dragging = false; });
if (typeof window !== 'undefined') window.addEventListener('pointerup', function(){ pdown = null; dragging = false; });

/* ---------- tick: a very slow auto-walk when idle; the walk never ends ---------- */
function tick(t){
  var dt = Math.min(0.05, Math.max(0, t - prevT));
  prevT = t; curT = t;
  if (!dragging && openCard < 0 && dt > 0 && (t - lastInteract) > 2.5) walk += dt * 7;
}

/* ---------- go: synchronous first frame at walk position 0, then the loop ---------- */
resize();
var baseTs = null;
function loop(ts){
  if (baseTs === null){ baseTs = ts; curT = PHASE0; prevT = PHASE0; }
  tick(PHASE0 + (ts - baseTs)/1000);
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
</script>
</body>
