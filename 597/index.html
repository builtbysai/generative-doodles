<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Faces of One Photograph</title>
<style>
html, body { margin: 0; padding: 0; background: #CFC8BC; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a single black-and-white Milan arcade interior in deep one-point
   perspective. The arcade itself never moves; only its tones invert, slowly,
   on a 40 second cycle: hold the positive, dissolve through mid-grey fog,
   hold the negative, return. A hanging sign shows only in the positive; a
   figure in a far doorway shows only in the negative. Watch only. */
var TAU = Math.PI * 2;
var GROUND = '#CFC8BC';
var STONE = '#CFC8BC';
var STONE_LO = '#BDB4A2';
var STONE_HI = '#DCD6CC';
var FLOOR = '#B7AE9E';
var RUNNER = '#C6BDAE';
var CEIL = '#C4BBA9';
var PIER = '#A99F8D';
var SHADOW = '#17150F';
var SHADOW2 = '#1E1A16';
var SKY = '#F7F5F0';
var INK = '#0E0C0A';
var PLATE = '#F3E9D2';
var PLATE_LINE = 'rgba(30,26,22,0.35)';
var TITLE_INK = '#1E1A16';
var HINT_INK = '#5C4630';
var FRAME_T = 6.0;         /* fixed phase: inside the positive hold */
var CYCLE = 40;            /* one full inversion cycle, seconds */
var S = [1, 0.70, 0.49, 0.343, 0.2401, 0.16807, 0.117649]; /* bay scales */
var NB = 6;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function shade(h, dl) {
  var c = hexRgb(h);
  var r = clamp(c[0] + dl, 0, 255), g = clamp(c[1] + dl, 0, 255), b = clamp(c[2] + dl, 0, 255);
  return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var FX = 0, FY = 0, FW = 0, FH = 0, VPX = 0, VPY = 0;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* seeded per-bay tone variation and stone speckle */
var RNG = mulberry32(1872);
var BAY_TONE = [], OPEN_TONE = [], SPECK = [], i;
for (i = 0; i < NB; i++) {
  BAY_TONE.push((RNG() - 0.5) * 14);
  OPEN_TONE.push(RNG() < 0.5 ? SHADOW : SHADOW2);
}
for (i = 0; i < 140; i++) {
  SPECK.push({ x: RNG(), y: RNG(), r: 0.5 + RNG() * 1.4, a: 0.03 + RNG() * 0.05 });
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- one-point perspective helpers (s = 1 near, 0 at the vanishing point) ---- */
function yTop(s) { return VPY - s * (VPY - FY); }
function yBot(s) { return VPY + s * (FY + FH - VPY); }
function leftX(s) { return VPX - (VPX - FX) * s; }
function rightX(s) { return VPX + (FX + FW - VPX) * s; }
function pLeft(s, v) { var yt = yTop(s), yb = yBot(s); return { x: leftX(s), y: yb + v * (yt - yb) }; }
function pRight(s, v) { var yt = yTop(s), yb = yBot(s); return { x: rightX(s), y: yb + v * (yt - yb) }; }
function pFloor(s, u) { return { x: VPX + (u - 0.5) * FW * s, y: yBot(s) }; }
function pCeil(s, u) { return { x: VPX + (u - 0.5) * FW * s, y: yTop(s) }; }
function lw(f) { return Math.max(1, FW * f); }
function seg(x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
/* inversion factor: 0 positive hold, 1 negative hold, slow dissolves between */
function invAt(t) {
  var c = t % CYCLE; if (c < 0) c += CYCLE;
  if (c < 10) return 0;
  if (c < 16) return smooth((c - 10) / 6);
  if (c < 26) return 1;
  if (c < 32) return 1 - smooth((c - 26) / 6);
  return 0;
}
/* an arched opening on a wall plane: proj is pLeft or pRight */
function openingPath(proj, sa, sb, v0, vt, ah) {
  var N = 10, k, s, v, p;
  ctx.beginPath();
  p = proj(sa, v0); ctx.moveTo(p.x, p.y);
  p = proj(sa, vt); ctx.lineTo(p.x, p.y);
  for (k = 1; k <= N; k++) {
    s = sa + (sb - sa) * k / N;
    v = vt + ah * Math.pow(Math.sin(Math.PI * k / N), 0.6);
    p = proj(s, v); ctx.lineTo(p.x, p.y);
  }
  p = proj(sb, v0); ctx.lineTo(p.x, p.y);
  ctx.closePath();
}
function quad(a, b, c, d) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
  ctx.closePath();
}
function drawScene() {
  var i, sFar, sNear, tone;
  /* far end wall and its sky opening */
  var sE = S[NB];
  ctx.fillStyle = STONE_LO;
  quad(pLeft(sE, 0), pLeft(sE, 1), pRight(sE, 1), pRight(sE, 0));
  ctx.fill();
  var lx = leftX(sE) + FW * 0.03 * sE, rx = rightX(sE) - FW * 0.03 * sE;
  var yb = yBot(sE), yt = yTop(sE);
  ctx.fillStyle = SKY;
  ctx.beginPath();
  ctx.moveTo(lx, yb);
  ctx.lineTo(lx, yt + (yb - yt) * 0.28);
  ctx.quadraticCurveTo(VPX, yt - FH * 0.05 * sE, rx, yt + (yb - yt) * 0.28);
  ctx.lineTo(rx, yb);
  ctx.closePath(); ctx.fill();
  /* faint distant mullions in the sky opening */
  ctx.strokeStyle = rgba(SHADOW, 0.25);
  ctx.lineWidth = Math.max(1, FW * 0.002 * sE);
  seg(lerp(lx, rx, 0.33), yt + (yb - yt) * 0.3, lerp(lx, rx, 0.33), yb);
  seg(lerp(lx, rx, 0.66), yt + (yb - yt) * 0.3, lerp(lx, rx, 0.66), yb);
  /* bays, far to near */
  for (i = NB - 1; i >= 0; i--) {
    sFar = S[i + 1]; sNear = S[i];
    tone = BAY_TONE[i];
    /* floor slab with a lighter center runner */
    ctx.fillStyle = shade(FLOOR, tone * 0.6);
    quad(pFloor(sFar, 0), pFloor(sFar, 1), pFloor(sNear, 1), pFloor(sNear, 0));
    ctx.fill();
    ctx.fillStyle = shade(RUNNER, tone * 0.6);
    quad(pFloor(sFar, 0.42), pFloor(sFar, 0.58), pFloor(sNear, 0.58), pFloor(sNear, 0.42));
    ctx.fill();
    /* ceiling slab */
    ctx.fillStyle = shade(CEIL, tone * 0.6);
    quad(pCeil(sFar, 0), pCeil(sFar, 1), pCeil(sNear, 1), pCeil(sNear, 0));
    ctx.fill();
    /* side wall panels */
    ctx.fillStyle = shade(STONE, tone);
    quad(pLeft(sFar, 0), pLeft(sFar, 1), pLeft(sNear, 1), pLeft(sNear, 0));
    ctx.fill();
    ctx.fillStyle = shade(STONE, tone);
    quad(pRight(sFar, 0), pRight(sFar, 1), pRight(sNear, 1), pRight(sNear, 0));
    ctx.fill();
    /* arched openings on both walls */
    var sa = sFar + (sNear - sFar) * 0.10, sb = sNear - (sNear - sFar) * 0.10;
    ctx.fillStyle = OPEN_TONE[i];
    openingPath(pLeft, sa, sb, 0.06, 0.70, 0.16); ctx.fill();
    openingPath(pRight, sa, sb, 0.06, 0.70, 0.16); ctx.fill();
    ctx.strokeStyle = rgba(STONE_HI, 0.8);
    ctx.lineWidth = lw(0.004 * ((sFar + sNear) / 2));
    openingPath(pLeft, sa, sb, 0.06, 0.70, 0.16); ctx.stroke();
    openingPath(pRight, sa, sb, 0.06, 0.70, 0.16); ctx.stroke();
    /* vault rib at the near plane of this bay */
    ctx.strokeStyle = rgba(SHADOW, 0.35);
    ctx.lineWidth = lw(0.007 * sNear);
    ctx.beginPath();
    var lp = pLeft(sNear, 1), rp = pRight(sNear, 1);
    ctx.moveTo(lp.x, lp.y);
    ctx.quadraticCurveTo(VPX, yTop(sNear) - FH * 0.11 * sNear, rp.x, rp.y);
    ctx.stroke();
  }
  /* floor joints converging on the vanishing point */
  ctx.strokeStyle = rgba(SHADOW, 0.28);
  ctx.lineWidth = lw(0.0016);
  var u;
  for (u = 0.2; u < 0.95; u += 0.2) {
    var a = pFloor(1, u);
    seg(a.x, a.y, VPX, VPY);
  }
  for (i = 1; i < NB; i++) {
    var fa = pFloor(S[i], 0), fb = pFloor(S[i], 1);
    seg(fa.x, fa.y, fb.x, fb.y);
  }
  /* stone speckle */
  var k;
  for (k = 0; k < SPECK.length; k++) {
    var sp = SPECK[k];
    ctx.fillStyle = rgba(SHADOW, sp.a);
    ctx.beginPath();
    ctx.moveTo(FX + sp.x * FW + sp.r, FY + sp.y * FH);
    ctx.arc(FX + sp.x * FW, FY + sp.y * FH, sp.r, 0, TAU);
    ctx.fill();
  }
  /* near frame: the first arch the viewer stands under */
  ctx.fillStyle = PIER;
  ctx.fillRect(FX, FY, FW * 0.065, FH);
  ctx.fillRect(FX + FW * 0.935, FY, FW * 0.065, FH);
  ctx.strokeStyle = rgba(SHADOW, 0.5);
  ctx.lineWidth = lw(0.002);
  seg(FX + FW * 0.065, FY, FX + FW * 0.065, FY + FH);
  seg(FX + FW * 0.935, FY, FX + FW * 0.935, FY + FH);
  ctx.strokeStyle = shade(PIER, -18);
  ctx.lineWidth = lw(0.03);
  ctx.beginPath();
  ctx.moveTo(FX + FW * 0.065, FY + FH * 0.55);
  ctx.ellipse(VPX, FY + FH * 0.55, FW * 0.435, FH * 0.55, 0, Math.PI, TAU);
  ctx.stroke();
  ctx.strokeStyle = rgba(SHADOW, 0.35);
  ctx.lineWidth = lw(0.004);
  ctx.beginPath();
  ctx.moveTo(FX + FW * 0.095, FY + FH * 0.55);
  ctx.ellipse(VPX, FY + FH * 0.55, FW * 0.405, FH * 0.50, 0, Math.PI, TAU);
  ctx.stroke();
}
/* phase-gated details, drawn after the inversion so they keep their own tone */
function drawDetails(inv) {
  var figA = smooth((inv - 0.5) / 0.5);
  var signA = 1 - smooth(inv / 0.5);
  /* hanging sign, right wall, bay 2: visible only in the positive */
  if (signA > 0.01) {
    var sM = (S[2] + S[3]) / 2;
    var anchor = pCeil(sM, 0.80);
    var rodLen = FH * 0.09 * sM;
    var sw = FW * 0.13 * sM, sh = FH * 0.05 * sM;
    ctx.save();
    ctx.globalAlpha = signA;
    ctx.strokeStyle = INK;
    ctx.lineWidth = lw(0.003 * sM);
    seg(anchor.x, anchor.y, anchor.x, anchor.y + rodLen);
    ctx.fillStyle = INK;
    ctx.fillRect(anchor.x - sw / 2, anchor.y + rodLen, sw, sh);
    ctx.fillStyle = STONE_HI;
    var r;
    for (r = 0; r < 3; r++) {
      ctx.fillRect(anchor.x - sw * 0.32, anchor.y + rodLen + sh * (0.22 + r * 0.26), sw * 0.64, Math.max(1, sh * 0.10));
    }
    ctx.restore();
  }
  /* figure in a doorway, left wall, bay 4: visible only in the negative */
  if (figA > 0.01) {
    var sF = (S[4] + S[5]) / 2;
    var base = pLeft(sF, 0.06);
    var hgt = (yBot(sF) - yTop(sF)) * 0.42;
    ctx.save();
    ctx.globalAlpha = figA;
    ctx.fillStyle = INK;
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.5, hgt * 0.045);
    /* head */
    ctx.beginPath();
    ctx.moveTo(base.x + hgt * 0.055, base.y - hgt * 0.94);
    ctx.arc(base.x, base.y - hgt * 0.94, hgt * 0.055, 0, TAU);
    ctx.fill();
    /* body, a long coat */
    ctx.beginPath();
    ctx.moveTo(base.x - hgt * 0.10, base.y - hgt * 0.86);
    ctx.lineTo(base.x + hgt * 0.10, base.y - hgt * 0.86);
    ctx.lineTo(base.x + hgt * 0.13, base.y - hgt * 0.08);
    ctx.lineTo(base.x - hgt * 0.13, base.y - hgt * 0.08);
    ctx.closePath(); ctx.fill();
    /* legs */
    seg(base.x - hgt * 0.05, base.y - hgt * 0.08, base.x - hgt * 0.06, base.y);
    seg(base.x + hgt * 0.05, base.y - hgt * 0.08, base.x + hgt * 0.06, base.y);
    ctx.restore();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Two Faces of One Photograph').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Two Faces of One Photograph').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 26').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Two Faces of One Photograph', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 26', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. One arcade, two faces.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  FX = sc.x; FY = sc.y; FW = sc.w; FH = sc.h;
  VPX = FX + FW * 0.5; VPY = FY + FH * 0.42;
  var inv = invAt(phaseT);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  ctx.beginPath(); ctx.rect(FX, FY, FW, FH); ctx.clip();
  drawScene();
  /* the inversion: a white difference fill collapses to flat mid-grey
     halfway through, which is the fog the prompt asks for */
  if (inv > 0) {
    ctx.globalCompositeOperation = 'difference';
    ctx.fillStyle = 'rgba(255,255,255,' + inv.toFixed(4) + ')';
    ctx.fillRect(FX, FY, FW, FH);
    ctx.globalCompositeOperation = 'source-over';
  }
  drawDetails(inv);
  ctx.restore();
  if (!isPhone) {
    ctx.strokeStyle = rgba(SHADOW, 0.35);
    ctx.lineWidth = 1;
    ctx.strokeRect(FX + 0.5, FY + 0.5, FW - 1, FH - 1);
  }
  drawPlates();
}
/* ---- frame one: fixed phase t = 6.0 s, inside the positive hold ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % CYCLE;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
