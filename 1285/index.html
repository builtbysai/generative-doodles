<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Divide</title>
<style>
  html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (no Math.random anywhere) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1285);

  // ---------- palette ----------
  var RIVER_DEEP = '#2E4A5E', RIVER_LIGHT = '#7FA8B8';
  var MUSLIN = '#E0D3B8', BORDER_RED = '#A6343C';
  var INK = '#3A3330', VERSE_GRAY = '#6B645A', GROUND = '#141210';

  // ---------- sizing (Visual Viewport API, never innerWidth alone) ----------
  var W = 0, H = 0;
  function viewport() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        window.visualViewport.width && window.visualViewport.height) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return { w: w, h: h };
  }
  function isPhone() {
    if (typeof window !== 'undefined' && window.screen &&
        window.screen.width && window.screen.height) {
      return Math.min(window.screen.width, window.screen.height) < 700;
    }
    return H > W * 1.15;
  }
  function size() {
    var vp = viewport();
    W = vp.w; H = vp.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---------- scroll geometry (rebuilt on resize) ----------
  var G = null;
  function build() {
    var phone = isPhone();
    var sh = phone ? H : Math.floor(H * 0.94);
    var sw = Math.floor(sh * 27 / 76);
    if (sw > W) { sw = W; sh = Math.floor(sw * 76 / 27); }
    if (sh > H) { sh = H; sw = Math.floor(sh * 27 / 76); }
    var sx = Math.floor((W - sw) / 2);
    var sy = Math.floor((H - sh) / 2);
    var topBand = Math.floor(sh * 0.09);
    var botBand = Math.floor(sh * 0.09);
    var fieldTop = sy + topBand, fieldBot = sy + sh - botBand;
    var fieldH = fieldBot - fieldTop;
    // muslin texture blobs (flat alpha, seeded)
    var blobs = [];
    for (var i = 0; i < 26; i++) {
      blobs.push({
        x: sx + rnd() * sw, y: fieldTop + rnd() * fieldH,
        r: 8 + rnd() * 26, a: 0.04 + rnd() * 0.06
      });
    }
    // verse dash rows: rows of dashed stitch lines, no legible wording
    function verseRows(y0, bandH) {
      var rows = [];
      for (var r = 0; r < 4; r++) {
        var y = y0 + bandH * (0.18 + r * 0.22);
        var dashes = [];
        var x = sx + sw * 0.10;
        var end = sx + sw * 0.90;
        while (x < end) {
          var len = 4 + rnd() * 14;
          dashes.push({ x: x, len: Math.min(len, end - x) });
          x += len + 4 + rnd() * 8;
        }
        rows.push({ y: y, dashes: dashes });
      }
      return rows;
    }
    // bank figures: walk up/down their bank, loop with wrap
    var figures = [];
    for (var f = 0; f < 14; f++) {
      figures.push({
        bank: f % 2 === 0 ? -1 : 1,
        y0: rnd(), dir: rnd() < 0.5 ? -1 : 1,
        rate: 0.008 + rnd() * 0.014, phase: rnd() * 6.28,
        off: (rnd() - 0.5) * 0.10
      });
    }
    // crossing figures: traverse the river horizontally, loop with wrap
    var crossers = [];
    for (var k = 0; k < 4; k++) {
      crossers.push({
        y0: 0.15 + k * 0.20 + rnd() * 0.06, dir: k % 2 === 0 ? 1 : -1,
        rate: 0.010 + rnd() * 0.010, phase: rnd() * 6.28, x0: rnd()
      });
    }
    G = {
      sx: sx, sy: sy, sw: sw, sh: sh,
      topBand: topBand, botBand: botBand,
      fieldTop: fieldTop, fieldBot: fieldBot, fieldH: fieldH,
      blobs: blobs, topRows: verseRows(sy, topBand),
      botRows: verseRows(sy + sh - botBand, botBand),
      figures: figures, crossers: crossers
    };
  }

  // river shape: center slightly off-center, widening toward the bottom
  function riverCenter(g, y) {
    var yn = (y - g.fieldTop) / g.fieldH;
    return g.sx + g.sw * (0.52 + 0.03 * Math.sin(yn * 5.2));
  }
  function riverHalf(g, y) {
    var yn = (y - g.fieldTop) / g.fieldH;
    return g.sw * (0.055 + 0.075 * yn);
  }
  function riverPath(g) {
    ctx.beginPath();
    var steps = 40, y, i;
    for (i = 0; i <= steps; i++) {
      y = g.fieldTop + (g.fieldH * i) / steps;
      var cx = riverCenter(g, y), hw = riverHalf(g, y);
      if (i === 0) ctx.moveTo(cx - hw, y); else ctx.lineTo(cx - hw, y);
    }
    for (i = steps; i >= 0; i--) {
      y = g.fieldTop + (g.fieldH * i) / steps;
      var cx2 = riverCenter(g, y), hw2 = riverHalf(g, y);
      ctx.lineTo(cx2 + hw2, y);
    }
    ctx.closePath();
  }

  // ---------- flow clock: piecewise closed-form over recorded events ----------
  var BASE_SPEED = 46; // px of flow per second
  var TAU = 1.2; // release decay, seconds
  var segs = [{ t: 0, phase: 0, speed: BASE_SPEED }];
  var release = null; // { t, phase, slowed }
  function flowPhase(t) {
    if (release && t >= release.t) {
      var dt = t - release.t;
      return release.phase + BASE_SPEED * dt -
        (BASE_SPEED - release.slowed) * TAU * (1 - Math.exp(-dt / TAU));
    }
    var s = segs[segs.length - 1];
    return s.phase + s.speed * (t - s.t);
  }
  function flowSpeed(t) {
    if (release && t >= release.t) {
      var dt2 = t - release.t;
      return BASE_SPEED - (BASE_SPEED - release.slowed) * Math.exp(-dt2 / TAU);
    }
    return segs[segs.length - 1].speed;
  }
  function pushSeg(t, speed) {
    segs.push({ t: t, phase: flowPhase(t), speed: speed });
    if (segs.length > 400) segs.splice(0, segs.length - 400);
  }

  // ---------- pointer: drag upstream (upward) slows the flow ----------
  var drag = null;
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function onDown(e) {
    var p = pos(e);
    drag = { startY: p.y, y: p.y };
    release = null;
    pushSeg(now(), BASE_SPEED);
  }
  function onMove(e) {
    if (!drag) return;
    var p = pos(e);
    drag.y = p.y;
    var up = drag.startY - drag.y; // positive = dragged upstream
    var factor = 1 - up * 0.002;
    if (factor < 0.25) factor = 0.25;
    if (factor > 1) factor = 1;
    var cur = segs[segs.length - 1].speed / BASE_SPEED;
    if (Math.abs(factor - cur) > 0.02) pushSeg(now(), BASE_SPEED * factor);
  }
  function onUp() {
    if (!drag) return;
    var t = now();
    var slowed = segs[segs.length - 1].speed;
    release = { t: t, phase: flowPhase(t), slowed: slowed };
    drag = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---------- piece time: boot-flagged, clock starts with the rAF loop ----------
  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var booted = false;
  function now() {
    if (!booted) return 0;
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - T0) / 1000;
    return 0;
  }

  // ---------- drawing ----------
  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.fill();
  }
  function figure(x, y, s, lean, color) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1, 1.6 * s);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y - 10 * s);
    ctx.lineTo(x + lean * 6 * s, y + 2 * s);
    ctx.stroke();
    dot(x + lean * 1 * s, y - 13 * s, 2.6 * s, color);
    ctx.beginPath();
    ctx.moveTo(x + lean * 6 * s, y + 2 * s);
    ctx.lineTo(x + lean * 6 * s - 2.5 * s, y + 10 * s);
    ctx.moveTo(x + lean * 6 * s, y + 2 * s);
    ctx.lineTo(x + lean * 6 * s + 2.5 * s, y + 10 * s);
    ctx.stroke();
  }
  function draw(t) {
    var g = G;
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    // scroll ground: muslin panel
    ctx.fillStyle = MUSLIN;
    ctx.fillRect(g.sx, g.sy, g.sw, g.sh);
    // muslin texture blobs (flat alpha circles, moveTo before every arc)
    for (var b = 0; b < g.blobs.length; b++) {
      var bl = g.blobs[b];
      ctx.fillStyle = 'rgba(120,95,60,' + bl.a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(bl.x + bl.r, bl.y);
      ctx.arc(bl.x, bl.y, bl.r, 0, 6.2832);
      ctx.fill();
    }
    // river
    riverPath(g);
    ctx.fillStyle = RIVER_DEEP;
    ctx.fill();
    // flowing light streaks: seamless wrap over the field height
    var phase = flowPhase(t);
    var spacing = 46;
    ctx.save();
    riverPath(g);
    ctx.clip();
    ctx.strokeStyle = RIVER_LIGHT;
    ctx.lineWidth = 1.4;
    var span = g.fieldH + spacing;
    var off = phase % spacing;
    for (var yy = g.fieldTop - spacing + off; yy < g.fieldBot + spacing; yy += spacing) {
      var cx = riverCenter(g, yy), hw = riverHalf(g, yy);
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.moveTo(cx - hw * 0.55, yy);
      ctx.lineTo(cx - hw * 0.15, yy + 7);
      ctx.moveTo(cx + hw * 0.10, yy + 3);
      ctx.lineTo(cx + hw * 0.55, yy + 10);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // phulkari border bands along both river banks (red dash rows)
    ctx.strokeStyle = BORDER_RED;
    ctx.lineWidth = 1.6;
    var steps = 60, i, y, cx2, hw2;
    ctx.beginPath();
    for (i = 0; i <= steps; i++) {
      y = g.fieldTop + (g.fieldH * i) / steps;
      cx2 = riverCenter(g, y); hw2 = riverHalf(g, y);
      var lx = cx2 - hw2 - 4, rx = cx2 + hw2 + 4;
      if (i % 2 === 0) {
        ctx.moveTo(lx, y); ctx.lineTo(lx, y + g.fieldH / steps * 0.7);
        ctx.moveTo(rx, y); ctx.lineTo(rx, y + g.fieldH / steps * 0.7);
      }
    }
    ctx.stroke();
    // bank figures: march with the flow phase, lean grows as flow slows
    var speedFrac = flowSpeed(t) / BASE_SPEED;
    var lean = (1 - speedFrac) * 0.45;
    for (var f = 0; f < g.figures.length; f++) {
      var fig = g.figures[f];
      var prog = fig.y0 + fig.dir * (phase * fig.rate) / g.fieldH * 8;
      var wn = ((prog % 1) + 1) % 1;
      var fy = g.fieldTop + wn * g.fieldH;
      var sc = 0.5 + 0.8 * wn;
      var cc = riverCenter(g, fy), hh = riverHalf(g, fy);
      var fx = fig.bank < 0
        ? g.sx + (cc - hh - g.sx) * 0.5 + fig.off * g.sw * 0.4
        : cc + hh + (g.sx + g.sw - cc - hh) * 0.5 + fig.off * g.sw * 0.4;
      figure(fx, fy, sc, fig.dir * 0.12 + lean * fig.dir, INK);
    }
    // crossing figures: traverse the river, loop with wrap
    for (var k = 0; k < g.crossers.length; k++) {
      var cr = g.crossers[k];
      var cp = ((cr.x0 + cr.dir * (phase * cr.rate) / g.fieldH * 8) % 1 + 1) % 1;
      var cy = g.fieldTop + cr.y0 * g.fieldH;
      var spanX = (g.sw * 0.9);
      var cxx = g.sx + g.sw * 0.05 + cp * spanX;
      var csc = 0.5 + 0.8 * cr.y0;
      figure(cxx, cy, csc, cr.dir * 0.15 + lean * cr.dir, INK);
    }
    // verse bands: sewn-dash rows, no legible wording
    ctx.strokeStyle = VERSE_GRAY;
    ctx.lineWidth = 1.3;
    function verseBand(rows) {
      ctx.beginPath();
      for (var r = 0; r < rows.length; r++) {
        var row = rows[r];
        for (var d = 0; d < row.dashes.length; d++) {
          var dd = row.dashes[d];
          ctx.moveTo(dd.x, row.y);
          ctx.lineTo(dd.x + dd.len, row.y);
        }
      }
      ctx.stroke();
    }
    verseBand(g.topRows);
    verseBand(g.botRows);
    // scroll edge: thin red stitch frame
    ctx.strokeStyle = BORDER_RED;
    ctx.lineWidth = 1.2;
    ctx.setLineDash([5, 5]);
    ctx.strokeRect(g.sx + 3, g.sy + 3, g.sw - 6, g.sh - 6);
    ctx.setLineDash([]);
  }

  // ---------- boot: first frame at exactly t = 0 ----------
  size();
  build();
  draw(0);
  if (typeof window !== 'undefined') {
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () { size(); build(); draw(now()); });
    }
    window.addEventListener('resize', function () { size(); build(); draw(now()); });
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    var loop = function () {
      booted = true;
      draw(now());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
