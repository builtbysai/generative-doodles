<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№62 · Pinwheel Field</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#111111; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,255,255,0.6); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to spin a pinwheel</div>
<script>
'use strict';
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '62', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }

const FAMS=[
 ['#2ea8d6','#1b6fb0','#7fd0ec','#0f4a6e'],
 ['#8cd17f','#3aa655','#c7ecb0','#1e5e34'],
 ['#f08a1d','#d95f1e','#f7c04a','#8a3d12'],
 ['#e88bb8','#c44a7e','#f7c6da','#7c2a52'],
 ['#d93b3b','#a02020','#f0977a','#5e1212'],
 ['#f5c518','#d9a012','#fbe08a','#6e4e06']
];
function rowAssign(cycle,N){
  const rng=mulberry(seed*331+cycle*104729+17);
  const order=[0,1,2,3,4,5];
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const tmp=order[i]; order[i]=order[j]; order[j]=tmp; }
  const out=[]; for(let r=0;r<N;r++) out.push(order[r%6]);
  return out;
}
const extra={};
let drag62=null;
function drawField(w,h,t,assign,alphaScale){
  const phone=isPhone();
  const N=phone?6:7;
  let ox,oy,cw,ch;
  if(phone){ ox=0; oy=0; cw=w/N; ch=h/N; }
  else { const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; cw=S/N; ch=S/N; }
  ctx.save(); ctx.globalAlpha=alphaScale;
  for(let r=0;r<N;r++){
    const fam=FAMS[assign[r%assign.length]];
    for(let c=0;c<N;c++){
      const cx=ox+(c+0.5)*cw, cy=oy+(r+0.5)*ch;
      const dir=((r+c)%2===0)?1:-1;
      let ang=dir*(t*Math.PI*2/14)+(r*0.7+c*1.3);
      const key=r+','+c;
      if(extra[key]) ang+=extra[key].a;
      const R=Math.max(cw,ch)*0.74;
      ctx.save();
      ctx.beginPath(); ctx.rect(ox+c*cw,oy+r*ch,cw,ch); ctx.clip();
      for(let i=0;i<8;i++){
        const a1=ang+i*Math.PI/4, a2=ang+(i+1)*Math.PI/4;
        ctx.fillStyle=fam[i%4];
        ctx.beginPath(); ctx.moveTo(cx,cy);
        ctx.lineTo(cx+Math.cos(a1)*R,cy+Math.sin(a1)*R);
        ctx.lineTo(cx+Math.cos(a2)*R,cy+Math.sin(a2)*R);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }
  ctx.restore();
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#111111'; ctx.fillRect(0,0,w,h);
  const t=nowMs/1000;
  const phone=isPhone(); const N=phone?6:7;
  const cycle=Math.floor(t/20), within=t-cycle*20;
  const cur=rowAssign(cycle,N), prev=rowAssign(cycle-1,N);
  if(cycle>0 && within<1){ drawField(w,h,t,prev,1); drawField(w,h,t,cur,smooth(within/1)); }
  else drawField(w,h,t,cur,1);
  for(const k in extra){ const e=extra[k]; if(!e.held && e.rel>0){ const p=(nowMs-e.rel)/900; if(p>=1) delete extra[k]; else e.a=e.a0*(1-smooth(p)); } }
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(3000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
function cellAt(ev){
  const [w,h]=viewportWH(); const phone=isPhone(); const N=phone?6:7;
  let ox,oy,cw,ch;
  if(phone){ ox=0; oy=0; cw=w/N; ch=h/N; } else { const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; cw=S/N; ch=S/N; }
  const c=Math.floor((ev.clientX-ox)/cw), r=Math.floor((ev.clientY-oy)/ch);
  if(r<0||c<0||r>=N||c>=N) return null;
  return {r,c,cx:ox+(c+0.5)*cw,cy:oy+(r+0.5)*ch};
}
canvas.addEventListener('pointerdown',ev=>{ const cell=cellAt(ev); if(!cell) return; drag62=cell; const key=cell.r+','+cell.c; extra[key]={a:Math.atan2(ev.clientY-cell.cy,ev.clientX-cell.cx),held:true,rel:0,a0:0}; });
canvas.addEventListener('pointermove',ev=>{ if(!drag62) return; const key=drag62.r+','+drag62.c; if(extra[key]) extra[key].a=Math.atan2(ev.clientY-drag62.cy,ev.clientX-drag62.cx)*2; });
function end62(){ if(!drag62) return; const key=drag62.r+','+drag62.c; if(extra[key]){ extra[key].held=false; extra[key].rel=performance.now(); extra[key].a0=extra[key].a; } drag62=null; }
canvas.addEventListener('pointerup',end62); canvas.addEventListener('pointercancel',end62);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
