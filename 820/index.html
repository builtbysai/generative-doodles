<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fifteen-Second Cathedral</title>
<style>
  html, body { margin: 0; padding: 0; background: #06070C; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var ARCH = '#9A948A';
  var GLOW = '#F2C14E';
  var BG = '#06070C';

  var TAU = 5.0;          // glow decay time constant, seconds
  var LIFE = 15.0;        // glow stays perceptible to a full 15 s
  var MAXGLOW = 40;       // cap on simultaneously active glows

  // mulberry32 seeded RNG
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 300, H = 300, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }

  // ---- Arch field layout (seeded, whole arches kept inside the frame) ----
  // Each arch: cx, by (base) in 0..1 units, s = half-width as a fraction of
  // min(W,H), profile: 0 tall, 1 round, 2 squat (leg length as multiple of s).
  var LEG = [2.3, 1.25, 0.6];
  var arches = [];

  function buildField() {
    arches = [];
    var unit = Math.min(W, H);
    var rng = mulberry32(820051);
    var target = 24, tries = 0;
    while (arches.length < target && tries < 6000) {
      tries++;
      var s = 0.036 + rng() * 0.038;
      var prof = Math.floor(rng() * 3);
      var halfX = s * unit / W + 0.015;              // half-width as x fraction + margin
      var topRoom = (LEG[prof] * s + s) * unit / H + 0.02; // full height as y fraction + margin
      var spanX = 1 - 2 * halfX;
      var spanY = 0.985 - topRoom;
      if (spanX <= 0.05 || spanY <= 0.05) continue;
      var cx = halfX + rng() * spanX;
      var by = topRoom + rng() * spanY;
      var px = cx * W, py = by * H, ok = true;
      for (var i = 0; i < arches.length; i++) {
        var a = arches[i];
        var dx = px - a.cx * W, dy = py - a.by * H;
        if (Math.sqrt(dx * dx + dy * dy) < (s + a.s) * unit * 1.30 + 0.028 * unit) { ok = false; break; }
      }
      if (ok) arches.push({ cx: cx, by: by, s: s, prof: prof });
    }
  }

  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = Math.max(50, Math.floor(w));
    H = Math.max(50, Math.floor(h));
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    buildField();
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    window.addEventListener('resize', resize);
  }
  resize();

  // ---- Strikes ----
  // strikes: array of {arch, t}. Glow of an arch at time t is the sum of
  // exp(-(t - ts)/TAU) over its strikes, so at age 15 s a strike still
  // contributes exp(-3) = 0.0498 of peak: faint, but present.
  var strikes = [];
  // Frame-one seeded strikes (negative times): ages 1.8 s, 6.0 s, 11.5 s,
  // on three spread arches chosen by field fraction.
  (function seedStrikes() {
    var fracs = [0.2, 0.55, 0.85];
    var ages = [1.8, 6.0, 11.5];
    var used = {};
    for (var k = 0; k < fracs.length; k++) {
      var idx = Math.floor(fracs[k] * arches.length) % arches.length;
      while (used[idx]) idx = (idx + 1) % arches.length;
      used[idx] = true;
      strikes.push({ arch: idx, t: -ages[k] });
    }
  })();

  // Ambient auto-strikes: one every 7 s, target chosen from a seeded stream
  // of field fractions (stable across resizes).
  var AMBIENT_EVERY = 7.0;
  var ambientFracs = [];
  (function buildAmbient() {
    var rng = mulberry32(82077);
    for (var i = 0; i < 1024; i++) ambientFracs.push(rng());
  })();
  function ambientStrikesUpTo(t) {
    var out = [];
    if (t < AMBIENT_EVERY || arches.length === 0) return out;
    var n = Math.floor(t / AMBIENT_EVERY);
    for (var k = 1; k <= n; k++) {
      var idx = Math.floor(ambientFracs[(k - 1) % ambientFracs.length] * arches.length) % arches.length;
      out.push({ arch: idx, t: k * AMBIENT_EVERY });
    }
    return out;
  }

  function glowOf(archIdx, t, all) {
    var g = 0;
    for (var i = 0; i < all.length; i++) {
      var st = all[i];
      if (st.arch !== archIdx) continue;
      var age = t - st.t;
      if (age < 0 || age > LIFE) continue;
      g += Math.exp(-age / TAU);
    }
    return g > 1.25 ? 1.25 : g;
  }

  function addStrike(archIdx, t) {
    // Cap policy: count glows still inside their 15 s life (user strikes
    // plus the deterministic ambient schedule). If the cap is reached, the
    // new strike reuses the weakest slot: the user strike with the lowest
    // current strength is dropped. Ambient strikes are schedule, never dropped.
    var all = strikes.concat(ambientStrikesUpTo(t));
    var active = 0;
    for (var i = 0; i < all.length; i++) {
      var age = t - all[i].t;
      if (age >= 0 && age <= LIFE) active++;
    }
    if (active >= MAXGLOW) {
      var weakest = -1, weakestVal = Infinity;
      for (var j = 0; j < strikes.length; j++) {
        var age2 = t - strikes[j].t;
        if (age2 < 0 || age2 > LIFE) continue;
        var v = Math.exp(-age2 / TAU);
        if (v < weakestVal) { weakestVal = v; weakest = j; }
      }
      if (weakest >= 0) strikes.splice(weakest, 1);
    }
    strikes.push({ arch: archIdx, t: t });
  }

  // ---- Drawing ----
  function archPath(cx, baseY, s, prof, scale) {
    var r = s * scale;
    var leg = LEG[prof] * s * scale;
    var cy = baseY - leg;
    ctx.beginPath();
    ctx.moveTo(cx - r, baseY);
    ctx.lineTo(cx - r, cy);
    ctx.arc(cx, cy, r, Math.PI, 0, false);
    ctx.lineTo(cx + r, baseY);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var unit = Math.min(W, H);
    var all = strikes.concat(ambientStrikesUpTo(t));
    var i, a, px, py, ps, g;

    // Glow blooms: layered flat-alpha silhouettes, largest first.
    var passes = [
      { scale: 1.55, alpha: 0.05 },
      { scale: 1.30, alpha: 0.09 },
      { scale: 1.12, alpha: 0.16 },
      { scale: 1.00, alpha: 0.22 }
    ];
    for (var p = 0; p < passes.length; p++) {
      ctx.fillStyle = GLOW;
      for (i = 0; i < arches.length; i++) {
        g = glowOf(i, t, all);
        if (g <= 0.004) continue;
        a = arches[i];
        px = a.cx * W; py = a.by * H; ps = a.s * unit;
        ctx.globalAlpha = Math.min(1, g * passes[p].alpha * 2.2);
        archPath(px, py, ps, a.prof, passes[p].scale);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // Arch outlines: dim stone, brightening to gold where a glow lives.
    for (i = 0; i < arches.length; i++) {
      a = arches[i];
      px = a.cx * W; py = a.by * H; ps = a.s * unit;
      g = glowOf(i, t, all);
      ctx.lineWidth = Math.max(1.1, ps * 0.10);
      ctx.strokeStyle = ARCH;
      ctx.globalAlpha = 0.55;
      archPath(px, py, ps, a.prof, 1.0);
      ctx.stroke();
      if (g > 0.004) {
        ctx.strokeStyle = GLOW;
        ctx.globalAlpha = Math.min(1, g * 0.95);
        archPath(px, py, ps, a.prof, 1.0);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---- Clock: frame one is a synchronous draw at t = 0 ----
  var startStamp = null;
  function nowSeconds() {
    if (typeof performance !== 'undefined' && performance.now) {
      var ms = performance.now();
      if (startStamp === null) startStamp = ms;
      return (ms - startStamp) / 1000;
    }
    return 0;
  }
  draw(0);

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(nowSeconds());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  // ---- Interaction: tap strikes nearest arch; drag sweeps a phrase ----
  var dragging = false;
  var dragStruck = {};      // arch -> true, reset each drag pass
  var lastStruckAt = {};    // arch -> time of last strike (refractory)

  function pointerPos(e) {
    var r = (canvas.getBoundingClientRect) ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX != null ? e.clientX : 0) - r.left;
    var y = (e.clientY != null ? e.clientY : 0) - r.top;
    return { x: x, y: y };
  }

  function archCenterY(a) {
    return (a.by - LEG[a.prof] * a.s * 0.5 * Math.min(W, H) / H) * H;
  }

  function nearestArch(x, y) {
    var best = -1, bestD = Infinity;
    for (var i = 0; i < arches.length; i++) {
      var a = arches[i];
      var dx = x - a.cx * W, dy = y - archCenterY(a);
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function sweepStrike(x, y, t) {
    var unit = Math.min(W, H);
    for (var i = 0; i < arches.length; i++) {
      if (dragStruck[i]) continue;
      if (lastStruckAt[i] != null && t - lastStruckAt[i] < 1.2) continue;
      var a = arches[i];
      var dx = x - a.cx * W, dy = y - archCenterY(a);
      var rr = a.s * unit * 1.7;
      if (dx * dx + dy * dy <= rr * rr) {
        dragStruck[i] = true;
        lastStruckAt[i] = t;
        addStrike(i, t);
      }
    }
  }

  function onDown(e) {
    var t = nowSeconds();
    var p = pointerPos(e);
    dragging = true;
    dragStruck = {};
    var idx = nearestArch(p.x, p.y);
    if (idx >= 0) {
      dragStruck[idx] = true;
      lastStruckAt[idx] = t;
      addStrike(idx, t);
    }
    if (typeof requestAnimationFrame !== 'function') draw(t);
  }
  function onMove(e) {
    if (!dragging) return;
    var t = nowSeconds();
    var p = pointerPos(e);
    sweepStrike(p.x, p.y, t);
    if (typeof requestAnimationFrame !== 'function') draw(t);
  }
  function onUp() { dragging = false; }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointerleave', onUp);
    canvas.addEventListener('touchstart', function (e) { if (e.preventDefault) e.preventDefault(); }, { passive: false });
  }
})();
</script>
</body>
</html>
