<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№652 Built Around the Crack</title>
<style>
  html, body { margin: 0; padding: 0; background: #1d3454; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1993 Built Around the Crack, SN2 / PP1240, study #260 syd-nuku.
  // A miniature child's bedroom, blue walls, posters, a ceiling crack
  // rendered as a jagged glowing seam. Four adult figures in pyjamas
  // are crammed in, feet on the door, one holding a small keyboard,
  // walls visibly too close. The room fills the whole frame; the crack
  // runs from the ceiling into the wall seam; bodies fold into the
  // furniture. Palette: small-blue paint, warm lamp tungsten, toy reds
  // and yellows, the crack glowing pale. Study ref: M2 miniature
  // wrong-scale room. The crack is a seam of light, nothing more.
  var GROUND = '#1d3454'; // page ground, the wall blue

  // Fixed-phase first frame: FIRST_T = 12 s. Cycle 60 s: breathing on
  // ~5 s sines, one knee slides off the bed over seconds 8 to 16 and
  // is pulled back over 16 to 26, dust motes drift in the crack light.
  // At t = 12 the knee is mid-slide (slide factor 0.50) and the
  // breathing is mid-cycle, so frame one shows the room caught
  // mid-breath with the knee already slipping.
  var FIRST_T = 12;
  var CYCLE = 60;
  var SEED = 1993;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias, so the node-canvas render tool
  // (which passes its probe value as ?seed=) can verify that the
  // frame changes over time. Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // Drag warp: target lean from the pointer, warp eases toward it.
  // Figures are anchored in stage fractions and never warp; only the
  // room mesh leans, deepening or flattening the wrong-scale illusion.
  var warp = { x: 0, y: 0 };
  var target = { x: 0, y: 0 };
  var dragging = false;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function lerp(a, b, f) { return a + (b - a) * f; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: small-blue paint, warm lamp tungsten, toy reds and
  // yellows, the crack glowing pale.
  var WALL = [51, 80, 122];
  var WALL_DARK = [38, 62, 95];
  var WALL_LIGHT = [63, 99, 148];
  var CEIL = [42, 70, 108];
  var FLOOR = [122, 90, 60];
  var FLOOR_DARK = [96, 70, 46];
  var LAMP = [245, 200, 110];
  var LAMP_DEEP = [214, 150, 66];
  var TOY_RED = [200, 68, 46];
  var TOY_YELLOW = [232, 185, 58];
  var CRACK_CORE = [234, 242, 255];
  var CRACK_GLOW = [188, 210, 255];
  var PJ_BLUE = [169, 196, 222];
  var PJ_CREAM = [232, 220, 192];
  var PJ_RED = [196, 84, 66];
  var PJ_YELLOW = [224, 178, 62];
  var SKIN = [214, 178, 146];
  var SKIN_DARK = [186, 148, 118];
  var HAIR = [74, 52, 38];
  var HAIR_GREY = [150, 148, 140];
  var CAPTION = [223, 232, 242];
  var BLANKET = [178, 58, 44];
  var BED_WOOD = [108, 76, 50];

  // Dust motes in the crack light: seeded positions near the crack,
  // drifting slowly, alpha pulsing gently. Never fast, never flashing.
  var moteRng = mulberry32(SEED * 7 + 3);
  var MOTES = [];
  (function () {
    var i;
    for (i = 0; i < 22; i++) {
      MOTES.push({
        x: 0.52 + (moteRng() - 0.5) * 0.30,
        y: 0.10 + moteRng() * 0.62,
        r: 0.0012 + moteRng() * 0.0022,
        period: 18 + moteRng() * 26,
        phase: moteRng() * Math.PI * 2,
        drift: 0.004 + moteRng() * 0.010,
        maxA: 0.25 + moteRng() * 0.45
      });
    }
  })();

  // Fixed jagged offsets for the crack polyline, so the seam keeps its
  // shape while its endpoints re-fit the warped wall seam.
  var CRACK_JOG = [0, -0.012, 0.010, -0.008, 0.012, -0.010, 0.008, -0.006, 0.010, -0.008, 0.006];

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.022, 11, 16));
    L.fsDate = Math.round(clamp(W * 0.017, 9, 13));
    L.fsHint = Math.round(clamp(W * 0.023, 12, 17));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Cycle -----------------------------------------------------
  // Knee slide: off the bed over seconds 8 to 16, held to 18, pulled
  // back over 18 to 26, at rest otherwise. At FIRST_T = 12 the slide
  // factor is 0.50: the knee is halfway off the bed.
  function kneeSlide(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    if (p < 8 || p >= 26) { return 0; }
    if (p < 16) { return smooth((p - 8) / 8); }
    if (p < 18) { return 1; }
    return 1 - smooth((p - 18) / 8);
  }
  // Breathing: slow chest rise per figure, ~5 s periods, own phases.
  function breathe(t, phase, period) {
    return Math.sin(2 * Math.PI * t / period + phase);
  }

  // ---- Room mesh -------------------------------------------------
  // Back-wall corners shift with the lean; side walls, ceiling and
  // floor are quads from the frame edges to those corners, so the
  // whole room leans while the figures stay anchored in stage space.
  function roomGeom(lx, ly) {
    return {
      tl: [0.20 + 0.055 * lx, 0.14 + 0.028 * ly],
      tr: [0.80 - 0.045 * lx, 0.14 - 0.022 * ly],
      br: [0.80 - 0.028 * lx, 0.80 - 0.012 * ly],
      bl: [0.20 + 0.038 * lx, 0.80 + 0.012 * ly]
    };
  }
  // Bilinear point inside a quad [tl, tr, br, bl].
  function quadPoint(q, u, v) {
    var topX = lerp(q[0][0], q[1][0], u), topY = lerp(q[0][1], q[1][1], u);
    var botX = lerp(q[3][0], q[2][0], u), botY = lerp(q[3][1], q[2][1], u);
    return [lerp(topX, botX, v), lerp(topY, botY, v)];
  }
  function fillQuad(pts, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0][0] * W, pts[0][1] * H);
    ctx.lineTo(pts[1][0] * W, pts[1][1] * H);
    ctx.lineTo(pts[2][0] * W, pts[2][1] * H);
    ctx.lineTo(pts[3][0] * W, pts[3][1] * H);
    ctx.closePath();
    ctx.fill();
  }
  function strokeQuad(pts, color, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0] * W, pts[0][1] * H);
    ctx.lineTo(pts[1][0] * W, pts[1][1] * H);
    ctx.lineTo(pts[2][0] * W, pts[2][1] * H);
    ctx.lineTo(pts[3][0] * W, pts[3][1] * H);
    ctx.closePath();
    ctx.stroke();
  }
  function line(a, b, color, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(a[0] * W, a[1] * H);
    ctx.lineTo(b[0] * W, b[1] * H);
    ctx.stroke();
  }

  // The crack: a jagged glowing seam from the ceiling, across the
  // back-wall top edge, then down the left wall seam to the floor.
  // Its endpoints are recomputed from the warped corners every frame.
  function crackPoints(g) {
    var pts = [];
    var top = quadPoint([g.tl, g.tr, g.br, g.bl], 0.66, 0);
    pts.push([0.60 + 0.04 * warp.x, -0.01]);
    pts.push([0.585 + 0.05 * warp.x, 0.055]);
    pts.push([0.615 + 0.03 * warp.x, 0.105]);
    pts.push([top[0] + 0.012, top[1] - 0.004]);
    var i, f, p;
    for (i = 0; i <= 6; i++) {
      f = i / 6;
      p = [lerp(g.tl[0], g.bl[0], f), lerp(g.tl[1], g.bl[1], f)];
      p[0] += CRACK_JOG[4 + i];
      pts.push(p);
    }
    return pts;
  }
  function strokePolyline(pts, color, width) {
    var i;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0] * W, pts[0][1] * H);
    for (i = 1; i < pts.length; i++) {
      ctx.lineTo(pts[i][0] * W, pts[i][1] * H);
    }
    ctx.stroke();
  }

  // ---- Furniture and room dressing -------------------------------
  function drawRoom(t, g) {
    // Ceiling, floor, side walls, back wall.
    fillQuad([[0, 0], [1, 0], g.tr, g.tl], rgb(CEIL));
    fillQuad([[0, 1], [1, 1], g.br, g.bl], rgb(FLOOR));
    fillQuad([[0, 0], [0, 1], g.bl, g.tl], rgb(WALL_DARK));
    fillQuad([[1, 0], g.tr, g.br, [1, 1]], rgb(WALL_DARK));
    fillQuad([g.tl, g.tr, g.br, g.bl], rgb(WALL));

    // Floor boards: lines from the front edge to the back edge.
    var i, u, a, b;
    for (i = 1; i < 7; i++) {
      u = i / 7;
      a = [lerp(0, 1, u), 1];
      b = quadPoint([g.tl, g.tr, g.br, g.bl], u, 1);
      line(a, b, rgba(FLOOR_DARK, a4(0.55)), Math.max(1, W * 0.0016));
    }
    // Back-wall baseboard.
    line(g.bl, g.br, rgba([24, 40, 62], a4(0.9)), Math.max(2, H * 0.012));

    // Door on the right wall: a quad inside the right-wall quad,
    // with a knob and panels. Feet rest on it lower down.
    var door = [
      quadPoint([[1, 0], g.tr, g.br, [1, 1]], 0.18, 0.22),
      quadPoint([[1, 0], g.tr, g.br, [1, 1]], 0.62, 0.14),
      quadPoint([[1, 0], g.tr, g.br, [1, 1]], 0.62, 0.98),
      quadPoint([[1, 0], g.tr, g.br, [1, 1]], 0.18, 0.98)
    ];
    fillQuad(door, rgb([58, 92, 138]));
    strokeQuad(door, rgba([30, 48, 76], a4(0.9)), Math.max(1.5, W * 0.002));
    var dIn = [
      quadPoint(door, 0.16, 0.10), quadPoint(door, 0.84, 0.10),
      quadPoint(door, 0.84, 0.46), quadPoint(door, 0.16, 0.46)
    ];
    strokeQuad(dIn, rgba([30, 48, 76], a4(0.7)), Math.max(1, W * 0.0015));
    var dIn2 = [
      quadPoint(door, 0.16, 0.54), quadPoint(door, 0.84, 0.54),
      quadPoint(door, 0.84, 0.90), quadPoint(door, 0.16, 0.90)
    ];
    strokeQuad(dIn2, rgba([30, 48, 76], a4(0.7)), Math.max(1, W * 0.0015));
    var knob = quadPoint(door, 0.14, 0.52);
    ctx.fillStyle = rgb(LAMP);
    ctx.beginPath();
    ctx.moveTo(knob[0] * W + Math.max(2, W * 0.006), knob[1] * H);
    ctx.arc(knob[0] * W, knob[1] * H, Math.max(2, W * 0.006), 0, Math.PI * 2);
    ctx.fill();

    // Posters on the back wall: a yellow sun poster and a red
    // striped poster, both inside the back-wall quad so they warp
    // with the room.
    var p1 = [
      quadPoint([g.tl, g.tr, g.br, g.bl], 0.10, 0.10),
      quadPoint([g.tl, g.tr, g.br, g.bl], 0.30, 0.10),
      quadPoint([g.tl, g.tr, g.br, g.bl], 0.30, 0.42),
      quadPoint([g.tl, g.tr, g.br, g.bl], 0.10, 0.42)
    ];
    fillQuad(p1, rgb([238, 226, 190]));
    strokeQuad(p1, rgba([30, 48, 76], a4(0.8)), Math.max(1, W * 0.0015));
    var sun = quadPoint([g.tl, g.tr, g.br, g.bl], 0.20, 0.24);
    ctx.fillStyle = rgb(TOY_YELLOW);
    ctx.beginPath();
    ctx.moveTo(sun[0] * W + W * 0.028, sun[1] * H);
    ctx.arc(sun[0] * W, sun[1] * H, W * 0.028, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(TOY_RED);
    ctx.fillRect((sun[0] - 0.055) * W, (sun[1] + 0.055) * H, W * 0.11, Math.max(2, H * 0.008));
    var p2 = [
      quadPoint([g.tl, g.tr, g.br, g.bl], 0.72, 0.12),
      quadPoint([g.tl, g.tr, g.br, g.bl], 0.90, 0.12),
      quadPoint([g.tl, g.tr, g.br, g.bl], 0.90, 0.40),
      quadPoint([g.tl, g.tr, g.br, g.bl], 0.72, 0.40)
    ];
    fillQuad(p2, rgb(TOY_RED));
    strokeQuad(p2, rgba([30, 48, 76], a4(0.8)), Math.max(1, W * 0.0015));
    for (i = 0; i < 3; i++) {
      var y0 = 0.17 + i * 0.08;
      line(
        quadPoint([g.tl, g.tr, g.br, g.bl], 0.75, y0),
        quadPoint([g.tl, g.tr, g.br, g.bl], 0.87, y0),
        rgb([238, 226, 190]), Math.max(1.5, H * 0.008));
    }

    // Small poster on the left wall, seen at a slant.
    var p3 = [
      quadPoint([[0, 0], [0, 1], g.bl, g.tl], 0.30, 0.22),
      quadPoint([[0, 0], [0, 1], g.bl, g.tl], 0.62, 0.22),
      quadPoint([[0, 0], [0, 1], g.bl, g.tl], 0.62, 0.52),
      quadPoint([[0, 0], [0, 1], g.bl, g.tl], 0.30, 0.52)
    ];
    fillQuad(p3, rgb([232, 185, 58]));
    strokeQuad(p3, rgba([30, 48, 76], a4(0.8)), Math.max(1, W * 0.0015));
    var rocket = quadPoint([[0, 0], [0, 1], g.bl, g.tl], 0.46, 0.37);
    ctx.fillStyle = rgb(TOY_RED);
    ctx.beginPath();
    ctx.moveTo(rocket[0] * W, (rocket[1] - 0.045) * H);
    ctx.lineTo((rocket[0] + 0.02) * W, (rocket[1] + 0.03) * H);
    ctx.lineTo((rocket[0] - 0.02) * W, (rocket[1] + 0.03) * H);
    ctx.closePath();
    ctx.fill();

    // Hanging lamp: cord from the ceiling quad, warm tungsten shade
    // and glow. The glow is the room's warm light.
    var lampTop = quadPoint([[0, 0], [1, 0], g.tr, g.tl], 0.55, 0.55);
    var lampY = lampTop[1] + 0.12;
    line(lampTop, [lampTop[0], lampY], rgba([40, 40, 40], a4(0.9)), Math.max(1.5, W * 0.002));
    var lg = ctx.createRadialGradient(lampTop[0] * W, lampY * H, 0, lampTop[0] * W, lampY * H, W * 0.30);
    lg.addColorStop(0, rgba(LAMP, a4(0.30)));
    lg.addColorStop(1, rgba(LAMP, 0));
    ctx.fillStyle = lg;
    ctx.fillRect((lampTop[0] - 0.30) * W, (lampY - 0.30) * H, W * 0.60, H * 0.60);
    ctx.fillStyle = rgb(LAMP_DEEP);
    ctx.beginPath();
    ctx.moveTo((lampTop[0] - 0.045) * W, lampY * H);
    ctx.lineTo((lampTop[0] + 0.045) * W, lampY * H);
    ctx.lineTo((lampTop[0] + 0.028) * W, (lampY + 0.045) * H);
    ctx.lineTo((lampTop[0] - 0.028) * W, (lampY + 0.045) * H);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb(LAMP);
    ctx.beginPath();
    ctx.moveTo(lampTop[0] * W + W * 0.016, (lampY + 0.045) * H);
    ctx.arc(lampTop[0] * W, (lampY + 0.045) * H, W * 0.016, 0, Math.PI * 2);
    ctx.fill();

    // Rug and toys on the floor.
    ctx.fillStyle = rgba(TOY_RED, a4(0.85));
    ctx.beginPath();
    ctx.moveTo(0.38 * W, 0.90 * H);
    ctx.arc(0.38 * W, 0.90 * H, W * 0.10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgba([238, 226, 190], a4(0.8));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.beginPath();
    ctx.moveTo(0.38 * W + W * 0.065, 0.90 * H);
    ctx.arc(0.38 * W, 0.90 * H, W * 0.065, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = rgb(TOY_RED);
    ctx.beginPath();
    ctx.moveTo(0.60 * W + W * 0.022, 0.93 * H);
    ctx.arc(0.60 * W, 0.93 * H, W * 0.022, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(TOY_YELLOW);
    ctx.fillRect(0.63 * W, 0.925 * H, W * 0.035, H * 0.035);
    ctx.fillStyle = rgb([58, 92, 138]);
    ctx.fillRect(0.635 * W, 0.885 * H, W * 0.025, H * 0.025);
  }

  // Bed along the bottom left, fixed in stage space so the figures
  // sitting on it never shift under the drag warp.
  function drawBed() {
    ctx.fillStyle = rgb(BED_WOOD);
    ctx.fillRect(0.03 * W, 0.78 * H, 0.50 * W, H * 0.16);
    ctx.fillStyle = rgb([238, 226, 190]);
    ctx.fillRect(0.045 * W, 0.735 * H, 0.11 * W, H * 0.05);
    ctx.fillStyle = rgb(BLANKET);
    ctx.fillRect(0.05 * W, 0.775 * H, 0.46 * W, H * 0.055);
    ctx.strokeStyle = rgba([238, 226, 190], a4(0.7));
    ctx.lineWidth = Math.max(1, W * 0.0018);
    ctx.beginPath();
    ctx.moveTo(0.05 * W, 0.802 * H);
    ctx.lineTo(0.51 * W, 0.802 * H);
    ctx.stroke();
    // Armchair bottom right, folded figure's seat.
    ctx.fillStyle = rgb([120, 52, 44]);
    ctx.beginPath();
    ctx.moveTo(0.60 * W, 0.97 * H);
    ctx.lineTo(0.60 * W, 0.86 * H);
    ctx.quadraticCurveTo(0.60 * W, 0.80 * H, 0.66 * W, 0.80 * H);
    ctx.lineTo(0.90 * W, 0.80 * H);
    ctx.quadraticCurveTo(0.96 * W, 0.80 * H, 0.96 * W, 0.86 * H);
    ctx.lineTo(0.96 * W, 0.97 * H);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb([140, 66, 54]);
    ctx.fillRect(0.62 * W, 0.82 * H, 0.32 * W, H * 0.05);
  }

  // ---- Figures ---------------------------------------------------
  // Simple flat pictogram people: round head, hair cap, pyjama body,
  // arms and legs as thick strokes. All positions are stage fractions,
  // so a drag never moves a figure, only the room around them.
  function head(x, y, r, skin, hair, hairGrey) {
    ctx.fillStyle = rgb(skin);
    ctx.beginPath();
    ctx.moveTo(x * W + r * W, y * H);
    ctx.arc(x * W, y * H, r * W, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(hairGrey ? HAIR_GREY : hair);
    ctx.beginPath();
    ctx.moveTo((x - r) * W, y * H);
    ctx.arc(x * W, y * H, r * W, Math.PI * 0.95, Math.PI * 2.05);
    ctx.closePath();
    ctx.fill();
  }
  function limb(a, b, color, width) {
    ctx.strokeStyle = rgb(color);
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(a[0] * W, a[1] * H);
    ctx.lineTo(b[0] * W, b[1] * H);
    ctx.stroke();
  }
  function torso(x, y, w, h, color, breathe) {
    var lift = breathe * H * 0.004;
    ctx.fillStyle = rgb(color);
    ctx.beginPath();
    ctx.moveTo((x - w / 2) * W, (y + h / 2) * H);
    ctx.lineTo((x - w / 2) * W, (y - h / 2 - lift / H) * H);
    ctx.quadraticCurveTo(x * W, (y - h / 2 - 0.012 - lift / H) * H, (x + w / 2) * W, (y - h / 2 - lift / H) * H);
    ctx.lineTo((x + w / 2) * W, (y + h / 2) * H);
    ctx.closePath();
    ctx.fill();
  }

  function drawFigures(t) {
    var ks = kneeSlide(t);
    var b1 = breathe(t, 0.6, 4.7);
    var b2 = breathe(t, 2.1, 5.3);
    var b3 = breathe(t, 4.0, 4.4);
    var b4 = breathe(t, 1.3, 5.9);
    var lw = Math.max(3, W * 0.016);

    // Figure A: on the bed, left, holding the small keyboard.
    torso(0.155, 0.665, 0.105, 0.115, PJ_BLUE, b1);
    head(0.155, 0.565, 0.032, SKIN, HAIR, false);
    limb([0.115, 0.63], [0.155, 0.70], PJ_BLUE, lw);
    limb([0.195, 0.63], [0.165, 0.70], PJ_BLUE, lw);
    // Keyboard across the lap: dark slab, white keys.
    ctx.save();
    ctx.translate(0.16 * W, 0.715 * H);
    ctx.rotate(-0.06);
    ctx.fillStyle = rgb([34, 34, 40]);
    ctx.fillRect(-0.075 * W, -0.016 * H, 0.15 * W, H * 0.032);
    ctx.fillStyle = rgb([240, 238, 228]);
    var ki;
    for (ki = 0; ki < 9; ki++) {
      ctx.fillRect((-0.068 + ki * 0.015) * W, -0.012 * H, W * 0.011, H * 0.020);
    }
    ctx.restore();
    limb([0.12, 0.72], [0.10, 0.78], PJ_CREAM, lw * 0.9);
    limb([0.19, 0.72], [0.21, 0.78], PJ_CREAM, lw * 0.9);

    // Figure B: on the bed, right, one knee sliding off the bed edge
    // and being pulled back. Hip stays put; only the knee travels.
    torso(0.40, 0.665, 0.105, 0.115, PJ_CREAM, b2);
    head(0.40, 0.565, 0.032, SKIN_DARK, HAIR, true);
    limb([0.36, 0.63], [0.33, 0.70], PJ_CREAM, lw);
    limb([0.44, 0.63], [0.46, 0.70], PJ_CREAM, lw);
    var kneeX = 0.475 + ks * 0.075;
    var kneeY = 0.735 + ks * 0.085;
    limb([0.44, 0.72], [kneeX, kneeY], PJ_RED, lw);
    ctx.fillStyle = rgb(SKIN_DARK);
    ctx.beginPath();
    ctx.moveTo(kneeX * W + W * 0.016, kneeY * H);
    ctx.arc(kneeX * W, kneeY * H, W * 0.016, 0, Math.PI * 2);
    ctx.fill();
    limb([kneeX, kneeY], [kneeX - 0.01, kneeY + 0.07], PJ_RED, lw * 0.9);
    limb([0.36, 0.72], [0.33, 0.79], PJ_CREAM, lw * 0.9);

    // Figure C: crammed upright at the right, feet up on the door.
    torso(0.735, 0.60, 0.10, 0.13, PJ_RED, b3);
    head(0.735, 0.495, 0.031, SKIN, HAIR, false);
    limb([0.695, 0.565], [0.66, 0.63], PJ_RED, lw);
    limb([0.775, 0.565], [0.80, 0.62], PJ_RED, lw);
    // Legs stretched up to the door, bent at the knee with a visible
    // joint; feet stay on the door panels.
    limb([0.755, 0.65], [0.83, 0.60], PJ_YELLOW, lw * 1.3);
    limb([0.83, 0.60], [0.85, 0.52], PJ_YELLOW, lw * 1.3);
    limb([0.715, 0.65], [0.795, 0.58], PJ_YELLOW, lw * 1.3);
    limb([0.795, 0.58], [0.835, 0.47], PJ_YELLOW, lw * 1.3);
    ctx.fillStyle = rgb(PJ_YELLOW);
    ctx.beginPath();
    ctx.moveTo(0.83 * W + W * 0.017, 0.60 * H);
    ctx.arc(0.83 * W, 0.60 * H, W * 0.017, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.795 * W + W * 0.017, 0.58 * H);
    ctx.arc(0.795 * W, 0.58 * H, W * 0.017, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(SKIN);
    ctx.beginPath();
    ctx.moveTo(0.85 * W + W * 0.014, 0.52 * H);
    ctx.arc(0.85 * W, 0.52 * H, W * 0.014, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.835 * W + W * 0.014, 0.47 * H);
    ctx.arc(0.835 * W, 0.47 * H, W * 0.014, 0, Math.PI * 2);
    ctx.fill();

    // Figure D: folded into the armchair, knees drawn up, sitting
    // high enough to read over the chair back.
    torso(0.78, 0.85, 0.10, 0.09, PJ_YELLOW, b4);
    head(0.78, 0.775, 0.030, SKIN_DARK, HAIR, false);
    limb([0.745, 0.82], [0.715, 0.88], PJ_YELLOW, lw);
    limb([0.815, 0.82], [0.845, 0.88], PJ_YELLOW, lw);
    // Knees up: two small circles at chest height.
    ctx.fillStyle = rgb(PJ_YELLOW);
    ctx.beginPath();
    ctx.moveTo(0.735 * W + W * 0.017, 0.815 * H);
    ctx.arc(0.735 * W, 0.815 * H, W * 0.017, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.825 * W + W * 0.017, 0.815 * H);
    ctx.arc(0.825 * W, 0.815 * H, W * 0.017, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- Crack light and dust --------------------------------------
  function drawCrack(t, g) {
    var pts = crackPoints(g);
    // Pale wash of light along the seam.
    var mid = pts[6];
    var cg = ctx.createRadialGradient(mid[0] * W, mid[1] * H, 0, mid[0] * W, mid[1] * H, W * 0.22);
    cg.addColorStop(0, rgba(CRACK_GLOW, a4(0.20)));
    cg.addColorStop(1, rgba(CRACK_GLOW, 0));
    ctx.fillStyle = cg;
    ctx.fillRect((mid[0] - 0.22) * W, (mid[1] - 0.22) * H, W * 0.44, H * 0.44);
    // Wide soft glow, medium seam, bright core.
    strokePolyline(pts, rgba(CRACK_GLOW, a4(0.16)), Math.max(3, W * 0.020));
    strokePolyline(pts, rgba(CRACK_GLOW, a4(0.38)), Math.max(2, W * 0.008));
    strokePolyline(pts, rgba(CRACK_CORE, a4(0.92)), Math.max(1.2, W * 0.0028));
  }
  function drawMotes(t) {
    var i, m, mx, my, tw, a;
    for (i = 0; i < MOTES.length; i++) {
      m = MOTES[i];
      tw = 0.5 + 0.5 * Math.sin(2 * Math.PI * t / m.period + m.phase);
      a = m.maxA * tw;
      if (a <= 0.02) { continue; }
      mx = (m.x + Math.sin(t * 0.05 + m.phase) * m.drift) * W;
      my = (m.y + Math.cos(t * 0.04 + m.phase * 1.7) * m.drift * 0.6) * H;
      ctx.fillStyle = rgba(CRACK_CORE, a4(a));
      ctx.beginPath();
      ctx.moveTo(mx + Math.max(0.8, m.r * W), my);
      ctx.arc(mx, my, Math.max(0.8, m.r * W), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Draw ------------------------------------------------------
  function draw(t) {
    lastT = t;
    // Ease the warp toward its target; snap when close so a release
    // returns exactly to frame one.
    warp.x += (target.x - warp.x) * 0.18;
    warp.y += (target.y - warp.y) * 0.18;
    if (Math.abs(target.x - warp.x) < 0.0005) { warp.x = target.x; }
    if (Math.abs(target.y - warp.y) < 0.0005) { warp.y = target.y; }
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var g = roomGeom(warp.x, warp.y);

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawRoom(t, g);
    drawBed();
    drawCrack(t, g);
    drawFigures(t);
    drawMotes(t);

    // Title plate top left, hint bottom center. Pale caption stays
    // readable over the blue walls.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.78));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№652 · Built Around the Crack', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CAPTION, a4(0.55));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2007 · 06 · 27', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CAPTION, a4(0.72));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to tilt the room. Release to let it settle.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // ---- Pointer: drag tilts the forced perspective ----------------
  function pointerPos(e) {
    var x, y;
    if (typeof e.offsetX === 'number' && typeof e.offsetY === 'number') {
      x = e.offsetX; y = e.offsetY;
    } else if (typeof e.clientX === 'number') {
      x = e.clientX - stageX; y = e.clientY - stageY;
    } else { x = W / 2; y = H / 2; }
    return { x: x, y: y };
  }
  function setLeanFromEvent(e) {
    var p = pointerPos(e);
    target.x = clamp((p.x - W / 2) / (W / 2), -1, 1) * 0.9;
    target.y = clamp((p.y - H / 2) / (H / 2), -1, 1) * 0.9;
  }
  function onDown(e) {
    dragging = true;
    setLeanFromEvent(e);
    if (e.preventDefault) { e.preventDefault(); }
  }
  function onMove(e) {
    if (!dragging) { return; }
    setLeanFromEvent(e);
    if (e.preventDefault) { e.preventDefault(); }
  }
  function onUp() {
    dragging = false;
    target.x = 0; target.y = 0;
  }
  try {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1993 exposes the cycle state and the drag warp.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1993 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      knee: kneeSlide,
      warp: function () { return { x: warp.x, y: warp.y }; },
      setDrag: function (nx, ny) {
        target.x = clamp(nx, -1, 1) * 0.9;
        target.y = clamp(ny, -1, 1) * 0.9;
      },
      release: function () { target.x = 0; target.y = 0; },
      settle: function () { warp.x = 0; warp.y = 0; target.x = 0; target.y = 0; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: breathing, the knee slide and dust over a 60 s
  // cycle. Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
