<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monolito</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0B; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SEEDBASE = 652079;        // fixed launch seed for block outline + surface
  var FORCED = null;
  // QA hook via ?seed=: "carved" applies scripted chisel strikes at load so a
  // carved state (emerging silhouette, bright fresh cuts, chips mid-fall) can
  // be rendered headlessly; a bare number reseeds the block. Inert otherwise.
  (function parseQuery() {
    var q = (typeof location !== 'undefined' && location.search) || '';
    var m = q.match(/seed=([^&]+)/);
    if (!m) return;
    var v = m[1];
    if (v === 'carved') { FORCED = 'carved'; return; }
    var n = parseInt(v, 10);
    if (!isNaN(n)) SEEDBASE = n;
  })();

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette (strict, no other hues) ----------
  var GROUND = '#0A0A0B';        // near-black ground
  var RAW = [90, 90, 94];        // raw stone #5A5A5E
  var FRACTURE = [201, 201, 204];// fresh fracture #C9C9CC
  var CHIP = '#8A8A8C';          // falling chips
  var SHADOW = 'rgba(0,0,0,0.55)';

  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function smooth(t) { return t * t * (3 - 2 * t); }

  // Granite mottling: five shade levels of the single raw tone (surface
  // texture shading, not new colors), crossed with nine freshness buckets
  // (bucket 0 = settled raw; 1..8 = fracture brightness aging out over ~4 s).
  var shadeRGB = [];
  (function () {
    var offs = [-7, -3, 0, 4, 8];
    for (var i = 0; i < offs.length; i++) {
      shadeRGB.push([RAW[0] + offs[i], RAW[1] + offs[i], RAW[2] + offs[i]]);
    }
  })();
  var cellColor = []; // cellColor[level][bucket] -> css string
  (function () {
    for (var l = 0; l < 5; l++) {
      cellColor.push([]);
      for (var b = 0; b < 9; b++) {
        var f = b === 0 ? 0 : 1 - smooth((9 - b) / 8); // bucket 8 = freshest
        var r = Math.round(shadeRGB[l][0] + (FRACTURE[0] - shadeRGB[l][0]) * f);
        var g = Math.round(shadeRGB[l][1] + (FRACTURE[1] - shadeRGB[l][1]) * f);
        var bl = Math.round(shadeRGB[l][2] + (FRACTURE[2] - shadeRGB[l][2]) * f);
        cellColor[l].push('rgb(' + r + ',' + g + ',' + bl + ')');
      }
    }
  })();

  // ---------- sizing (Visual Viewport API) ----------
  var W = 0, H = 0, lastElapsed = 0;
  var S = 0, OX = 0, OY = 0, CELL = 4, CX = 0, GROUNDY = 0;
  function resize() {
    var vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildLayout();
    draw(lastElapsed);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  function isPhone(w, h) {
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  function buildLayout() {
    if (isPhone(W, H)) S = Math.min(W * 0.84, H * 0.58);
    else S = Math.min(Math.min(W, H) * 0.64, W * 0.8);
    CELL = S / N;
    CX = W / 2;
    OX = CX - S / 2;
    OY = H / 2 - S / 2;
    GROUNDY = OY + S;
  }

  // ---------- the block: a carve grid in cell space (layout independent) --
  // The grid is fixed at N x N cells whatever the pixel size, so resizing
  // never loses the viewer's carving. A cell is stone (1) or removed (0).
  // freshAt[cell] is the anchored-clock second at which that cell's face was
  // last exposed by a cut; its brightness ages from fracture to raw in ~4 s.
  var N = 148;
  var grid = new Uint8Array(N * N);
  var shade = new Uint8Array(N * N);      // granite mottle level 0..4
  var freshAt = new Float32Array(N * N);  // -1000 = never exposed fresh

  function buildGrid() {
    var rng = mulberry32(SEEDBASE);
    // Quarried outline: a square boundary whose radius is perturbed by a few
    // seeded harmonics, with two shallow seeded notches knocked out of it.
    var harm = [];
    for (var k = 0; k < 5; k++) harm.push({ a: 0.028 - k * 0.004, p: rng() * Math.PI * 2 });
    var notch1 = rng() * Math.PI * 2, notch2 = rng() * Math.PI * 2;
    var nd1 = 0.05 + rng() * 0.04, nd2 = 0.04 + rng() * 0.04;
    function boundary(theta) {
      var c = Math.cos(theta), s = Math.sin(theta);
      var r = 0.94 / Math.max(Math.abs(c), Math.abs(s)); // unit square
      var n = 0;
      for (var k = 0; k < 5; k++) n += harm[k].a * Math.sin((k + 1) * theta + harm[k].p);
      var d1 = Math.atan2(Math.sin(theta - notch1), Math.cos(theta - notch1));
      var d2 = Math.atan2(Math.sin(theta - notch2), Math.cos(theta - notch2));
      n -= nd1 * Math.exp(-d1 * d1 * 22) + nd2 * Math.exp(-d2 * d2 * 30);
      return r * (1 + n);
    }
    // Two-octave mottle field, bilinearly sampled so neighbours share
    // tones: a coarse cloud octave plus a fine grain octave, so the surface
    // reads as granite rather than flat card or smooth cloud.
    var M = 9, mot = [];
    for (var i = 0; i < M * M; i++) mot.push(rng());
    var M2 = 41, mot2 = [];
    for (i = 0; i < M2 * M2; i++) mot2.push(rng());
    function bilin(field, m, u, v) {
      var x = u * (m - 1), y = v * (m - 1);
      var xi = Math.min(m - 2, Math.floor(x)), yi = Math.min(m - 2, Math.floor(y));
      var xf = x - xi, yf = y - yi;
      var a = field[yi * m + xi], b = field[yi * m + xi + 1];
      var c2 = field[(yi + 1) * m + xi], d = field[(yi + 1) * m + xi + 1];
      return (a + (b - a) * xf) * (1 - yf) + (c2 + (d - c2) * xf) * yf;
    }
    function mottle(u, v) { // u,v in 0..1
      return 0.7 * bilin(mot, M, u, v) + 0.3 * bilin(mot2, M2, u, v);
    }
    for (var j = 0; j < N; j++) {
      for (i = 0; i < N; i++) {
        var idx = j * N + i;
        var u = (i + 0.5) / N * 2 - 1, v = (j + 0.5) / N * 2 - 1;
        var r = Math.sqrt(u * u + v * v);
        var th = Math.atan2(v, u);
        grid[idx] = r <= boundary(th) ? 1 : 0;
        shade[idx] = Math.min(4, Math.floor(mottle((i + 0.5) / N, (j + 0.5) / N) * 5.6));
        freshAt[idx] = -1000;
      }
    }
  }

  function hasEmptyNeighbour(idx) {
    var i = idx % N, j = (idx / N) | 0;
    if (i === 0 || grid[idx - 1] === 0) return true;
    if (i === N - 1 || grid[idx + 1] === 0) return true;
    if (j === 0 || grid[idx - N] === 0) return true;
    if (j === N - 1 || grid[idx + N] === 0) return true;
    return false;
  }

  // ---------- chips: event driven, pure functions of (strike, time) ------
  // Each productive chisel sample records a strike: its time plus a handful
  // of chips whose full ballistic parameters are fixed at spawn. A chip's
  // pose at time t is computed closed-form from the record, so any frame is
  // a pure function of the strike list and the anchored clock.
  var strikes = [];
  var liveRng = mulberry32(SEEDBASE ^ 0x9E3779B9);
  var GRAV = 2.1 * N;      // cells / s^2
  var CHIP_LIFE = 1.5;     // seconds

  function spawnChips(fx, fy, tNow, rng, count) {
    var chips = [];
    for (var c = 0; c < count; c++) {
      var verts = [];
      var nv = 4 + Math.floor(rng() * 2);
      for (var k = 0; k < nv; k++) {
        verts.push({ a: (k / nv) * Math.PI * 2 + rng() * 0.7, r: 0.55 + rng() * 0.6 });
      }
      chips.push({
        x: fx, y: fy,
        vx: (rng() * 2 - 1) * 0.38 * N,
        vy: -(0.05 + rng() * 0.30) * N,
        rot: rng() * Math.PI * 2,
        vr: (rng() * 2 - 1) * 7,
        size: 0.8 + rng() * 1.5,   // cells
        verts: verts
      });
    }
    strikes.push({ t: tNow, chips: chips });
    if (strikes.length > 80) strikes.splice(0, strikes.length - 80);
  }

  // ---------- carving ------------------------------------------------------
  // Subtract a disc of rCells at cell-space point (fx, fy). Freshly exposed
  // surface cells around the bite are stamped with the cut time. Returns the
  // number of cells removed.
  function carveDisc(fx, fy, rCells, tNow) {
    var x0 = Math.max(0, Math.floor(fx - rCells - 2)), x1 = Math.min(N - 1, Math.ceil(fx + rCells + 2));
    var y0 = Math.max(0, Math.floor(fy - rCells - 2)), y1 = Math.min(N - 1, Math.ceil(fy + rCells + 2));
    var removed = 0;
    for (var j = y0; j <= y1; j++) {
      for (var i = x0; i <= x1; i++) {
        var dx = i + 0.5 - fx, dy = j + 0.5 - fy;
        if (dx * dx + dy * dy <= rCells * rCells && grid[j * N + i] === 1) {
          grid[j * N + i] = 0;
          removed++;
        }
      }
    }
    if (removed > 0) {
      var rr = rCells + 2;
      var fx0 = Math.max(0, Math.floor(fx - rr)), fx1 = Math.min(N - 1, Math.ceil(fx + rr));
      var fy0 = Math.max(0, Math.floor(fy - rr)), fy1 = Math.min(N - 1, Math.ceil(fy + rr));
      for (var jj = fy0; jj <= fy1; jj++) {
        for (var ii = fx0; ii <= fx1; ii++) {
          var idx = jj * N + ii;
          if (grid[idx] === 1) {
            var ddx = ii + 0.5 - fx, ddy = jj + 0.5 - fy;
            if (ddx * ddx + ddy * ddy <= rr * rr && hasEmptyNeighbour(idx)) freshAt[idx] = tNow;
          }
        }
      }
    }
    return removed;
  }

  function carvePathPx(xa, ya, xb, yb, tNow) {
    var dist = Math.sqrt((xb - xa) * (xb - xa) + (yb - ya) * (yb - ya));
    var steps = Math.min(48, Math.max(1, Math.ceil(dist / (CELL * 0.75))));
    var rCells = Math.max(9, CELL * 2.8) / CELL;
    for (var s = 1; s <= steps; s++) {
      var px = xa + (xb - xa) * (s / steps), py = ya + (yb - ya) * (s / steps);
      var fx = (px - OX) / CELL, fy = (py - OY) / CELL;
      var removed = carveDisc(fx, fy, rCells, tNow);
      if (removed >= 3) spawnChips(fx, fy, tNow, liveRng, 3 + Math.floor(liveRng() * 3));
    }
  }

  // ---------- pointer: drag = strike; tap and double-tap do nothing -------
  var dragging = false, lastX = 0, lastY = 0;
  function nowSec() {
    return (typeof performance !== 'undefined' && performance.now)
      ? (performance.now() - T0) / 1000 : lastElapsed;
  }
  function onDown(e) {
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var x = e.clientX, y = e.clientY;
    carvePathPx(lastX, lastY, x, y, nowSec());
    lastX = x; lastY = y;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---------- draw ----------------------------------------------------------
  function freshBucket(idx, t) {
    var age = t - freshAt[idx];
    if (age < 0 || age >= 4) return 0;
    return 8 - Math.floor(age / 0.5); // 8 freshest .. 1 oldest
  }

  function draw(t) {
    lastElapsed = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // faint contact shadow under the block
    ctx.fillStyle = SHADOW;
    ctx.beginPath();
    ctx.ellipse(CX, GROUNDY + S * 0.018, S * 0.47, S * 0.045, 0, 0, Math.PI * 2);
    ctx.fill();

    // the stone, run-length filled per row by (shade, freshness) key
    for (var j = 0; j < N; j++) {
      var y = OY + j * CELL;
      var i = 0;
      while (i < N) {
        var idx = j * N + i;
        if (grid[idx] === 0) { i++; continue; }
        var key = shade[idx] * 16 + freshBucket(idx, t);
        var start = i;
        i++;
        while (i < N) {
          var idx2 = j * N + i;
          if (grid[idx2] === 0 || shade[idx2] * 16 + freshBucket(idx2, t) !== key) break;
          i++;
        }
        ctx.fillStyle = cellColor[(key / 16) | 0][key % 16];
        ctx.fillRect(OX + start * CELL, y, (i - start) * CELL + 0.7, CELL + 0.7);
      }
    }

    // chips in flight
    for (var s = 0; s < strikes.length; s++) {
      var st = strikes[s];
      var age = t - st.t;
      if (age < 0 || age > CHIP_LIFE) continue;
      var alpha = clamp(1 - age / CHIP_LIFE, 0, 1);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = CHIP;
      for (var c = 0; c < st.chips.length; c++) {
        var ch = st.chips[c];
        var cxp = OX + (ch.x + ch.vx * age) * CELL;
        var cyp = OY + (ch.y + ch.vy * age + 0.5 * GRAV * age * age) * CELL;
        if (cyp > GROUNDY + S * 0.1) continue;
        var rot = ch.rot + ch.vr * age;
        var sz = ch.size * CELL;
        ctx.beginPath();
        for (var k = 0; k < ch.verts.length; k++) {
          var vx = cxp + Math.cos(ch.verts[k].a + rot) * ch.verts[k].r * sz;
          var vy = cyp + Math.sin(ch.verts[k].a + rot) * ch.verts[k].r * sz;
          if (k === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
        }
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- QA hook: scripted strikes for the carved-state render --------
  // Carves two full-height side trenches and two shoulder cuts so a standing
  // stele-like silhouette emerges from the block, stamped 1.1 s before t=0
  // (fresh faces still bright), with one strike's chips caught mid-fall.
  function applyScriptedCarve() {
    var rng = mulberry32(SEEDBASE + 777);
    var tCut = -1.1;
    var paths = [
      { x: 22, y0: 24, y1: 130, r: 8 },
      { x: 126, y0: 24, y1: 130, r: 8 },
      { x: 47, y0: 16, y1: 62, r: 5 },
      { x: 101, y0: 16, y1: 62, r: 5 }
    ];
    for (var p = 0; p < paths.length; p++) {
      var P = paths[p];
      for (var y = P.y0; y <= P.y1; y += 2) carveDisc(P.x, y, P.r, tCut);
    }
    spawnChips(47, 60, -0.38, rng, 6);
    spawnChips(101, 58, -0.38, rng, 6);
    spawnChips(74, 30, -0.38, rng, 5);
  }

  // ---------- boot + loop (rAF typeof-guarded; frame one is synchronous) ---
  buildGrid();
  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  resize();
  if (FORCED === 'carved') applyScriptedCarve();
  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (now) {
      draw((now - T0) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
