<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.258 Silhouette Signal</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0A2E33; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.258 Silhouette Signal (tanzinchospel.art). After his
// Day 10 hardsurface #silhouette study: a chunky black mech
// on dark teal, mirrored top and bottom, cyan lights dotted
// along its armour seams. The lights chase slowly along the
// seams from one master clock; the reflection runs the same
// chase 0.3 seconds behind. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CYAN = '#40E0D0', GROUND = '#0A2E33', SIL = '#020A0C';
var DW = 1200, DH = 900, MIRROR = 450;
var W = 0, H = 0, phone = false;
var T = 2.35, lastNow = -1; // frame one: the chase mid run

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// ---- the mech, built from chunky flat plates in the upper half ----------------
// y values stay above the mirror line; the feet land just on it.
var plates = [
  // pelvis
  [[545, 318], [655, 318], [648, 356], [552, 356]],
  // torso: a broad slab, wider at the shoulders
  [[512, 196], [688, 196], [672, 322], [528, 322]],
  // chest plate inset
  [[548, 216], [652, 216], [644, 268], [556, 268]],
  // head: a low dome block with a jaw
  [[566, 148], [634, 148], [640, 196], [560, 196]],
  [[574, 128], [626, 128], [634, 150], [566, 150]],
  // left shoulder pad and arm
  [[452, 182], [518, 182], [524, 232], [458, 238]],
  [[466, 236], [512, 234], [516, 318], [478, 322], [468, 300]],
  // right shoulder pad and arm
  [[682, 182], [748, 182], [742, 238], [676, 232]],
  [[688, 234], [734, 236], [732, 300], [722, 322], [684, 318]],
  // left thigh, shin, foot
  [[528, 354], [586, 354], [580, 402], [534, 402]],
  [[534, 400], [580, 400], [584, 436], [540, 438]],
  [[528, 436], [592, 436], [592, 450], [528, 450]],
  // right thigh, shin, foot
  [[614, 354], [672, 354], [666, 402], [620, 402]],
  [[620, 400], [666, 400], [660, 438], [616, 436]],
  [[608, 436], [672, 436], [672, 450], [608, 450]],
  // backpack block behind the shoulders
  [[540, 168], [660, 168], [660, 182], [540, 182]]
];
// ---- armour seams: polylines the lights run along --------------------------------
var seams = [
  [[512, 196], [688, 196]],                                  // shoulder line
  [[548, 216], [652, 216], [644, 268], [556, 268], [548, 216]], // chest plate rim
  [[528, 322], [672, 322]],                                  // waist line
  [[566, 148], [640, 148]],                                  // brow line
  [[452, 182], [518, 182]],                                  // left pad top
  [[682, 182], [748, 182]],                                  // right pad top
  [[466, 236], [478, 322]],                                  // left forearm seam
  [[734, 236], [722, 322]],                                  // right forearm seam
  [[528, 354], [586, 354]],                                  // left hip seam
  [[614, 354], [672, 354]],                                  // right hip seam
  [[534, 400], [580, 400]],                                  // left knee seam
  [[620, 400], [666, 400]],                                  // right knee seam
  [[600, 196], [600, 322]]                                   // spine seam
];
// sample the seams into one ordered run of lights
var lights = [];
(function () {
  var order = 0;
  for (var s = 0; s < seams.length; s++) {
    var line = seams[s];
    for (var i = 0; i < line.length - 1; i++) {
      var ax = line[i][0], ay = line[i][1], bx = line[i + 1][0], by = line[i + 1][1];
      var len = Math.sqrt((bx - ax) * (bx - ax) + (by - ay) * (by - ay));
      var steps = Math.max(1, Math.round(len / 16));
      for (var k = 0; k < steps; k++) {
        lights.push({ x: ax + (bx - ax) * k / steps, y: ay + (by - ay) * k / steps, o: order++ });
      }
    }
  }
})();
var NLIGHTS = lights.length;

function poly(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}

// brightness of one light at clock t: a slow chase pulse
// travelling the seam order, looping every 6 seconds
function pulse(o, t) {
  var head = (t % 6) / 6 * (NLIGHTS + 40) - 20;
  var d = o - head;
  var wrap = NLIGHTS + 40;
  if (d < -wrap / 2) d += wrap;
  if (d > wrap / 2) d -= wrap;
  return clamp01(1 - Math.abs(d) / 16);
}

function drawMech(t, reflected) {
  ctx.save();
  if (reflected) {
    ctx.translate(0, MIRROR * 2);
    ctx.scale(1, -1);
    ctx.globalAlpha = 0.6;
  }
  // zoom about the mirror line so the figure fills the field;
  // the anchor sits on the mirror, so the reflection zooms identically
  ctx.translate(600, MIRROR);
  ctx.scale(1.22, 1.22);
  ctx.translate(-600, -MIRROR);
  ctx.fillStyle = SIL;
  for (var i = 0; i < plates.length; i++) poly(plates[i]);
  // seam lights
  for (var j = 0; j < lights.length; j++) {
    var L = lights[j];
    var b = pulse(L.o, t);
    // a resting ember so the seams always read, then the chase on top
    ctx.fillStyle = rgba(CYAN, 0.16 + 0.10 * Math.sin(t * 0.8 + L.o * 0.35));
    ctx.beginPath(); ctx.arc(L.x, L.y, 2.1, 0, Math.PI * 2); ctx.fill();
    if (b > 0.02) {
      ctx.fillStyle = rgba(CYAN, 0.20 * b);
      ctx.beginPath(); ctx.arc(L.x, L.y, 8.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgba(CYAN, 0.95 * b);
      ctx.beginPath(); ctx.arc(L.x, L.y, 2.9, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  // the waterline: below the mirror the teal deepens a shade
  ctx.fillStyle = rgba(SIL, 0.30);
  ctx.fillRect(0, MIRROR, DW, DH - MIRROR);
  ctx.fillStyle = rgba(CYAN, 0.10);
  ctx.fillRect(0, MIRROR - 1, DW, 2);

  drawMech(T - 0.3, true);    // reflection first, running 0.3s behind
  drawMech(T, false);
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: the mirrored field fills the frame at any aspect
  var S = Math.max(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
