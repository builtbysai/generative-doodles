<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Circle</title>
<style>
  html, body { margin: 0; padding: 0; background: #090a0d; overflow: hidden; height: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .caption {
    position: fixed; bottom: 18px; left: 22px; color: rgba(220,215,200,0.42);
    font: 11px/1.5 -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.14em;
    text-transform: uppercase; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption">The Circle &middot; after Gadamer</div>
<script>
/*
 * THE CIRCLE
 * Gadamer's hermeneutic circle: understanding never starts from zero
 * and never arrives finished. Each reading returns changed, carrying
 * the last one inside it. Concentric rings turn at their own speeds,
 * some with, some against. Where their waves align, meaning flares.
 */
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let seed = 9138;
  function rnd() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const RINGS = [];
  const NR = 26;
  function buildRings() {
    RINGS.length = 0; seed = 9138;
    for (let i = 0; i < NR; i++) {
      const f = i / (NR - 1);  // 0 center, 1 edge
      RINGS.push({
        f: f,
        waves: 3 + Math.floor(rnd() * 9),       // wave count around ring
        amp: 4 + rnd() * 22 * (0.4 + f),        // radial wave amplitude
        sp: (rnd() < 0.45 ? -1 : 1) * (0.05 + rnd() * 0.22) * (1.2 - f * 0.6),
        ph: rnd() * Math.PI * 2,
        w: 0.6 + rnd() * 1.6,
        hue: 0.55 + f * 0.35 + (rnd() - 0.5) * 0.06  // teal -> amber drift outward
      });
    }
  }
  let grain = null;
  function makeGrain() {
    grain = document.createElement('canvas');
    grain.width = 128; grain.height = 128;
    const g = grain.getContext('2d');
    const d = g.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      d.data[i] = d.data[i+1] = d.data[i+2] = v;
      d.data[i+3] = 11;
    }
    g.putImageData(d, 0, 0);
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildRings();
    ctx.fillStyle = '#090a0d';
    ctx.fillRect(0, 0, W, H);
  }
  // hue 0..1 -> rgb, muted painterly
  function hueRgb(h, s, l) {
    h = ((h % 1) + 1) % 1;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h * 6) % 2) - 1));
    const m = l - c / 2;
    let r, g, b;
    if (h < 1/6) { r = c; g = x; b = 0; }
    else if (h < 2/6) { r = x; g = c; b = 0; }
    else if (h < 3/6) { r = 0; g = c; b = x; }
    else if (h < 4/6) { r = 0; g = x; b = c; }
    else if (h < 5/6) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    return [(r + m) * 255 | 0, (g + m) * 255 | 0, (b + m) * 255 | 0];
  }
  let T = 0;
  function frame() {
    T += 0.016;
    ctx.fillStyle = 'rgba(9,10,13,0.16)';
    ctx.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    const maxR = Math.min(W, H) * 0.46;
    // slow global hue drift
    const hueShift = Math.sin(T * 0.05) * 0.04;
    ctx.lineCap = 'round';
    for (const r of RINGS) {
      const baseR = 12 + r.f * maxR;
      const rot = T * r.sp + r.ph;
      // alignment flare: rings whose waves sync with neighbors brighten
      const sync = 0.5 + 0.5 * Math.sin(T * 0.4 + r.f * 9);
      const [cr, cg, cb] = hueRgb(r.hue + hueShift, 0.55, 0.42 + sync * 0.18);
      ctx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (0.30 + sync * 0.45).toFixed(2) + ')';
      ctx.lineWidth = r.w;
      ctx.beginPath();
      const steps = 220;
      for (let i = 0; i <= steps; i++) {
        const a = (i / steps) * Math.PI * 2;
        const wob = Math.sin(a * r.waves + rot * 6) * r.amp
                  + Math.sin(a * (r.waves * 2 + 1) - rot * 3) * r.amp * 0.35;
        const rr = baseR + wob;
        const px = cx + Math.cos(a + rot * 0.4) * rr;
        const py = cy + Math.sin(a + rot * 0.4) * rr * 0.94;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
    // center point: the unmoved mover
    const [pr, pg2, pb] = hueRgb(0.08 + hueShift, 0.6, 0.6);
    ctx.fillStyle = 'rgba(' + pr + ',' + pg2 + ',' + pb + ',0.8)';
    ctx.beginPath();
    ctx.arc(cx, cy, 2.5 + Math.sin(T * 1.2) * 0.8, 0, Math.PI * 2);
    ctx.fill();
    if (grain) {
      ctx.save(); ctx.globalAlpha = 0.5;
      ctx.fillStyle = ctx.createPattern(grain, 'repeat');
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  let running = true;
  function setRunning(v) {
    if (v === running) return;
    running = v;
    if (v) requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => setRunning(!document.hidden));
  window.addEventListener('blur', () => setRunning(false));
  window.addEventListener('focus', () => setRunning(true));
  window.addEventListener('resize', resize);
  makeGrain();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
