<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The X-Ray Rowhouse</title>
<style>
html, body { margin: 0; padding: 0; background: #0e1218; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// The X-Ray Rowhouse (elissa-blount-moorhead EM1). Five flat house-outlines
// in a row across the lower two-thirds; small warm light-marks drift, rock
// and pulse inside them, never outside. One house at a time glows brighter.
var SEED = 1544000;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(SEED);

// Focus schedule: five durations in [20, 40] s, houses focused in order.
// LOOP is their sum, so the whole piece repeats exactly every LOOP seconds.
var FOCUS_DUR = [];
for (var i = 0; i < 5; i++) FOCUS_DUR.push(20 + rand() * 20);
var LOOP = 0;
for (var j = 0; j < 5; j++) LOOP += FOCUS_DUR[j];
var FOCUS_START = [0];
for (var k = 1; k < 5; k++) FOCUS_START.push(FOCUS_START[k - 1] + FOCUS_DUR[k - 1]);
var BLEND = 1.5; // seconds of crossfade when the focus moves house to house

// Room order per house: a seeded permutation of the four room anchors.
var ROOM_FRACS = [[0.28, 0.30], [0.72, 0.30], [0.28, 0.70], [0.72, 0.70]];
var ROOM_ORDER = [];
for (var h = 0; h < 5; h++) {
  var perm = [0, 1, 2, 3];
  for (var s = perm.length - 1; s > 0; s--) {
    var r = Math.floor(rand() * (s + 1));
    var tmp = perm[s]; perm[s] = perm[r]; perm[r] = tmp;
  }
  ROOM_ORDER.push(perm);
}
// Per-house phase offsets for the rocking line and pulsing circle.
var PHASES = [];
for (var p = 0; p < 5; p++) PHASES.push(rand() * Math.PI * 2);

var W = 0, H = 0;
var lastT = 0;

function r4(v) { return Math.round(v * 10000) / 10000; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function smoothstep(x) {
  x = clamp(x, 0, 1);
  return x * x * (3 - 2 * x);
}
function lerp(a, b, t) { return a + (b - a) * t; }

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  } else { vw = 720; vh = 720; }
  W = vw; H = vh;
  var phone = false;
  if (typeof window !== 'undefined' && window.screen) {
    var m = Math.min(window.screen.width, window.screen.height);
    if (m < 700) phone = true;
  }
  if (!phone && H > W * 1.15) phone = true;
  // Field-like composition: full-bleed on every screen; the row layout
  // below is size-driven. Phone detection above still runs and the page
  // ground takes the piece's own background color either way.
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}

function loopLocal(t) {
  var u = t % LOOP;
  if (u < 0) u += LOOP;
  return u;
}

// Houses: five in a row across the lower two-thirds, heights varying
// slightly. Geometry is a pure function of W and H.
function houses() {
  var rowX0 = 0.06 * W, rowX1 = 0.94 * W;
  var gap = 0.02 * W;
  var hw = (rowX1 - rowX0 - 4 * gap) / 5;
  var yBase = 0.93 * H;
  var baseH = Math.min(0.42 * H, 3.0 * hw);
  var hf = [0.85, 1.0, 0.92, 1.05, 0.88];
  var out = [];
  for (var i = 0; i < 5; i++) {
    var x0 = rowX0 + i * (hw + gap);
    var hh = baseH * hf[i];
    var yTop = yBase - hh;
    out.push({
      x0: x0, x1: x0 + hw, w: hw, h: hh,
      yBase: yBase, yTop: yTop, yPeak: yTop - 0.22 * hh
    });
  }
  return out;
}

function roomsOf(g) {
  // Room anchor centers inside the rect (never in the roof).
  var rooms = [];
  for (var i = 0; i < 4; i++) {
    var f = ROOM_FRACS[i];
    rooms.push({ x: g.x0 + f[0] * g.w, y: g.yTop + f[1] * g.h });
  }
  return rooms;
}

// Focus segment index at loop-local time u.
function focusAt(u) {
  for (var i = 4; i >= 0; i--) {
    if (u >= FOCUS_START[i]) return i;
  }
  return 0;
}

// Brightness multiplier per house at loop-local time u (before drag
// overrides): focused house 1.0, others 0.45, with a BLEND-second
// crossfade at each segment boundary.
function brightnessAt(hi, u) {
  var seg = focusAt(u);
  var into = u - FOCUS_START[seg];
  if (into < BLEND) {
    var prev = (seg + 4) % 5;
    var f = smoothstep(into / BLEND);
    if (hi === seg) return 0.45 + 0.55 * f;
    if (hi === prev) return 1 - 0.55 * f;
    return 0.45;
  }
  return hi === seg ? 1 : 0.45;
}

// ---- Recorded drag events (all motion stays closed-form over these) ----
// House drags: {house, grab, release|null}. While a house is dragged its
// marks advance at 2x (time warp) and the house is bright; others dim.
var houseDrags = [];
var curHouseDrag = null;
// Mark drags: {house, kind, grab, release|null, px, py, relX, relY}.
// While dragged a mark follows the pointer clamped to its house rect;
// on release, line/pulse homes move to the release point and the dot
// glides back to its schedule over 7 s.
var markDrags = [];
var curMarkDrag = null;

function houseExtra(hi, t) {
  var extra = 0;
  for (var i = 0; i < houseDrags.length; i++) {
    var d = houseDrags[i];
    if (d.house !== hi) continue;
    var end = d.release === null ? t : Math.min(t, d.release);
    if (end > d.grab) extra += end - d.grab;
  }
  return extra;
}
// Warped time for a house's marks: marks advance 2x while their house is
// dragged; the offset persists after release, so nothing jumps.
function houseTime(hi, t) {
  return t + houseExtra(hi, t);
}
function markHome(hi, kind, t, init) {
  var home = init;
  for (var i = 0; i < markDrags.length; i++) {
    var d = markDrags[i];
    if (d.house === hi && d.kind === kind && d.release !== null && d.release <= t) {
      home = { x: d.relX, y: d.relY };
    }
  }
  return home;
}
function markReleases(hi, kind) {
  var out = [];
  for (var i = 0; i < markDrags.length; i++) {
    var d = markDrags[i];
    if (d.house === hi && d.kind === kind && d.release !== null) out.push(d);
  }
  return out;
}

// Dot scheduled position from warped phase pe in [0, 1): 12 room segments
// per loop, moving 70% of each segment, dwelling 30%.
function dotSched(g, hi, pe) {
  var rooms = roomsOf(g);
  var order = ROOM_ORDER[hi];
  var seg = Math.floor(pe * 12);
  var local = (pe * 12) % 1;
  var from = rooms[order[seg % 4]];
  var to = rooms[order[(seg + 1) % 4]];
  if (local < 0.7) {
    var s = smoothstep(local / 0.7);
    return { x: lerp(from.x, to.x, s), y: lerp(from.y, to.y, s) };
  }
  return { x: to.x, y: to.y };
}

function dotPos(g, hi, t) {
  var e = houseTime(hi, t);
  var pe = ((e % LOOP) / LOOP + 1) % 1;
  var pos = dotSched(g, hi, pe);
  // Glide back to schedule after each completed mark drag: blend from the
  // release point to the scheduled position over 7 s.
  var rels = markReleases(hi, 'dot');
  for (var i = 0; i < rels.length; i++) {
    var d = rels[i];
    if (t >= d.release) {
      var f = smoothstep((t - d.release) / 7);
      pos = { x: lerp(d.relX, pos.x, f), y: lerp(d.relY, pos.y, f) };
    }
  }
  if (curMarkDrag && curMarkDrag.house === hi && curMarkDrag.kind === 'dot') {
    pos = { x: curMarkDrag.px, y: curMarkDrag.py };
  }
  return pos;
}

function linePos(g, hi, t) {
  var home = markHome(hi, 'line', t, { x: g.x0 + 0.5 * g.w, y: g.yTop + 0.52 * g.h });
  if (curMarkDrag && curMarkDrag.house === hi && curMarkDrag.kind === 'line') {
    home = { x: curMarkDrag.px, y: curMarkDrag.py };
  }
  var e = houseTime(hi, t);
  var pe = ((e % LOOP) / LOOP + 1) % 1;
  var ang = 0.3 * Math.sin(Math.PI * 2 * 24 * pe + PHASES[hi]);
  return { x: home.x, y: home.y, ang: ang };
}

function pulsePos(g, hi, t) {
  var home = markHome(hi, 'pulse', t, { x: g.x0 + 0.5 * g.w, y: g.yTop + 0.28 * g.h });
  if (curMarkDrag && curMarkDrag.house === hi && curMarkDrag.kind === 'pulse') {
    home = { x: curMarkDrag.px, y: curMarkDrag.py };
  }
  var e = houseTime(hi, t);
  var pe = ((e % LOOP) / LOOP + 1) % 1;
  var k = 1 + 0.35 * Math.sin(Math.PI * 2 * 36 * pe + PHASES[hi]);
  return { x: home.x, y: home.y, k: k };
}

function clampToHouse(g, x, y) {
  return {
    x: clamp(x, g.x0 + 6, g.x1 - 6),
    y: clamp(y, g.yTop + 6, g.yBase - 6)
  };
}

function currentMarks(g, hi, t) {
  var dot = dotPos(g[hi], hi, t);
  var line = linePos(g[hi], hi, t);
  var pulse = pulsePos(g[hi], hi, t);
  return [
    { kind: 'dot', x: dot.x, y: dot.y },
    { kind: 'line', x: line.x, y: line.y, ang: line.ang },
    { kind: 'pulse', x: pulse.x, y: pulse.y, k: pulse.k }
  ];
}

function onDown(e) {
  size();
  var gs = houses();
  var marks = [];
  for (var hi = 0; hi < 5; hi++) marks.push(currentMarks(gs, hi, lastT));
  // Light-marks first: a press on a mark grabs the mark.
  for (var hi2 = 0; hi2 < 5; hi2++) {
    for (var m = 0; m < 3; m++) {
      var mk = marks[hi2][m];
      var dx = e.clientX - mk.x, dy = e.clientY - mk.y;
      if (dx * dx + dy * dy <= 18 * 18) {
        var c = clampToHouse(gs[hi2], e.clientX, e.clientY);
        curMarkDrag = {
          house: hi2, kind: mk.kind, grab: lastT, release: null,
          px: c.x, py: c.y, relX: c.x, relY: c.y
        };
        markDrags.push(curMarkDrag);
        if (e.preventDefault) e.preventDefault();
        return;
      }
    }
  }
  // Otherwise a press inside a house outline brightens that house.
  for (var hi3 = 0; hi3 < 5; hi3++) {
    var g = gs[hi3];
    if (e.clientX >= g.x0 && e.clientX <= g.x1 && e.clientY >= g.yPeak && e.clientY <= g.yBase) {
      curHouseDrag = { house: hi3, grab: lastT, release: null };
      houseDrags.push(curHouseDrag);
      if (e.preventDefault) e.preventDefault();
      return;
    }
  }
}
function onMove(e) {
  if (curMarkDrag) {
    var gs = houses();
    var c = clampToHouse(gs[curMarkDrag.house], e.clientX, e.clientY);
    curMarkDrag.px = c.x; curMarkDrag.py = c.y;
    curMarkDrag.relX = c.x; curMarkDrag.relY = c.y;
  }
}
function onUp() {
  if (curMarkDrag) { curMarkDrag.release = lastT; curMarkDrag = null; }
  if (curHouseDrag) { curHouseDrag.release = lastT; curHouseDrag = null; }
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', size);
  }
  if (window.addEventListener) window.addEventListener('resize', size);
}

var hook = {};
if (typeof window !== 'undefined') window.__t44 = hook;

function draw(t) {
  size();
  lastT = t;
  var gs = houses();
  var u = loopLocal(t);
  var focus = focusAt(u);
  var S = Math.min(W, H);

  ctx.fillStyle = '#0e1218';
  ctx.fillRect(0, 0, W, H);

  var hookHouses = [];
  for (var hi = 0; hi < 5; hi++) {
    var g = gs[hi];
    var b = brightnessAt(hi, u);
    if (curHouseDrag) {
      b = curHouseDrag.house === hi ? 1 : 0.3;
    }
    var marks = currentMarks(gs, hi, t);

    // House outline: rect with pitched roof, stroked only, never filled.
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'miter';
    ctx.strokeStyle = 'rgba(58,67,80,' + r4(0.5 + 0.5 * b) + ')';
    ctx.lineWidth = Math.max(1, 0.003 * S);
    ctx.beginPath();
    ctx.moveTo(g.x0, g.yBase);
    ctx.lineTo(g.x0, g.yTop);
    ctx.lineTo(g.x0 + g.w / 2, g.yPeak);
    ctx.lineTo(g.x1, g.yTop);
    ctx.lineTo(g.x1, g.yBase);
    ctx.closePath();
    ctx.stroke();

    // Light-marks: dot drifting room to room, line rocking, circle pulsing.
    var dotR = Math.max(3, 0.012 * S);
    var dot = marks[0];
    ctx.fillStyle = 'rgba(232,176,75,' + r4(0.95 * b) + ')';
    ctx.beginPath();
    ctx.moveTo(dot.x + dotR, dot.y);
    ctx.arc(dot.x, dot.y, dotR, 0, Math.PI * 2);
    ctx.fill();

    var line = marks[1];
    var len = 0.45 * g.w;
    var lx = Math.cos(line.ang), ly = Math.sin(line.ang);
    ctx.strokeStyle = hi % 2 === 0 ? 'rgba(201,168,106,' + r4(0.9 * b) + ')' : 'rgba(232,224,208,' + r4(0.9 * b) + ')';
    ctx.lineWidth = Math.max(1, 0.004 * S);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(line.x - lx * len / 2, line.y - ly * len / 2);
    ctx.lineTo(line.x + lx * len / 2, line.y + ly * len / 2);
    ctx.stroke();

    var pulse = marks[2];
    var pr = Math.max(2, 0.011 * S) * pulse.k;
    ctx.fillStyle = 'rgba(90,122,114,' + r4(0.85 * b) + ')';
    ctx.beginPath();
    ctx.moveTo(pulse.x + pr, pulse.y);
    ctx.arc(pulse.x, pulse.y, pr, 0, Math.PI * 2);
    ctx.fill();

    hookHouses.push({
      x0: g.x0, x1: g.x1, yTop: g.yTop, yBase: g.yBase, yPeak: g.yPeak,
      w: g.w, h: g.h, brightness: b,
      marks: [
        { kind: 'dot', x: dot.x, y: dot.y, alpha: r4(0.95 * b) },
        { kind: 'line', x: line.x, y: line.y, alpha: r4(0.9 * b) },
        { kind: 'pulse', x: pulse.x, y: pulse.y, alpha: r4(0.85 * b) }
      ],
      rooms: roomsOf(g)
    });
  }

  hook.houses = hookHouses;
  hook.loop = LOOP;
  hook.focusDur = FOCUS_DUR;
  hook.focusStart = FOCUS_START;
  hook.focus = focus;
  hook.u = u;
  hook.draggedHouse = curHouseDrag ? curHouseDrag.house : null;
  hook.draggedMark = curMarkDrag ? { house: curMarkDrag.house, kind: curMarkDrag.kind } : null;
}

draw(0);

var started = false;
var t0 = 0;
function loop(ts) {
  if (!started) { started = true; t0 = ts; }
  draw((ts - t0) / 1000);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
