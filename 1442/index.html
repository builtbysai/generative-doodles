<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instruments in Leather</title>
<style>
  html, body { margin: 0; padding: 0; background: #efe9dc; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random: frame one must be reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function r4(x) { return Math.round(x * 10000) / 10000; }

  var W = 0, H = 0, U = 0;
  function size() {
    var vw = window.innerWidth, vh = window.innerHeight;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      vw = visualViewport.width; vh = visualViewport.height;
    }
    W = vw; H = vh; U = Math.min(W, H);
    canvas.width = Math.round(W); canvas.height = Math.round(H);
  }
  size();
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', function () { size(); draw(clockT); });
    visualViewport.addEventListener('scroll', function () { size(); draw(clockT); });
  }
  window.addEventListener('resize', function () { size(); draw(clockT); });

  function isPhone() {
    var m = 99999;
    if (typeof window.screen !== 'undefined' && window.screen) {
      m = Math.min(window.screen.width, window.screen.height);
    }
    if (m < 700) return true;
    return H > W * 1.15;
  }

  // ---- palette ----
  var WALL = '#efe9dc', FLOOR = '#cfc8bc';
  var TAN = '#8a5a2a', DARK = '#5a3418', HIGH = '#b87a3a';
  var STITCH = '#e8d8b8', SHADOW = '#6a5a44', HEAD = '#c8a878';

  // Instruments: id, centre (fractions of W/H), hit radius (fraction of U), draw fn.
  var INST = [
    { id: 'bass',   fx: 0.26, fy: 0.64, hr: 0.155 },
    { id: 'snare',  fx: 0.395, fy: 0.60, hr: 0.085 },
    { id: 'tom',    fx: 0.325, fy: 0.47, hr: 0.075 },
    { id: 'cymbal', fx: 0.455, fy: 0.415, hr: 0.075 },
    { id: 'trumpet', fx: 0.585, fy: 0.575, hr: 0.115 },
    { id: 'keys',   fx: 0.73, fy: 0.685, hr: 0.11 },
    { id: 'violin', fx: 0.875, fy: 0.585, hr: 0.105 }
  ];
  function pos(inst) { return { x: inst.fx * W, y: inst.fy * H, r: inst.hr * U }; }

  // Wobbly filled blob: polygon around a centre, seeded jitter, stable per draw.
  function blob(cx, cy, r, seed, squashY) {
    var rnd = mulberry32(seed);
    var n = 26, i, a, rr;
    ctx.beginPath();
    for (i = 0; i <= n; i++) {
      a = (i / n) * Math.PI * 2;
      rr = r * (0.96 + rnd() * 0.07);
      var px = cx + Math.cos(a) * rr;
      var py = cy + Math.sin(a) * rr * (squashY || 1);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }
  function dot(x, y, s, col) {
    ctx.fillStyle = col;
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }
  // Speckle inside a disc: seeded, stable per draw.
  function speckle(cx, cy, r, seed, count, col, alpha) {
    var rnd = mulberry32(seed);
    var i, a, d, x, y;
    ctx.fillStyle = col;
    for (i = 0; i < count; i++) {
      a = rnd() * Math.PI * 2; d = Math.sqrt(rnd()) * r * 0.88;
      x = cx + Math.cos(a) * d; y = cy + Math.sin(a) * d;
      ctx.globalAlpha = r4(alpha * (0.5 + rnd() * 0.5));
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  function stitchRing(cx, cy, r) {
    ctx.beginPath();
    ctx.moveTo(cx + r, cy);
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = STITCH; ctx.lineWidth = Math.max(1, U * 0.0018);
    ctx.setLineDash([Math.max(3, U * 0.006), Math.max(3, U * 0.006)]);
    ctx.stroke(); ctx.setLineDash([]);
  }
  function leatherFill() {
    ctx.fillStyle = TAN; ctx.fill();
    ctx.strokeStyle = DARK; ctx.lineWidth = Math.max(1.5, U * 0.003); ctx.stroke();
  }

  function drawBass(p, seed) {
    // stand legs
    ctx.strokeStyle = DARK; ctx.lineWidth = Math.max(2, U * 0.004);
    ctx.beginPath();
    ctx.moveTo(p.x - p.r * 0.5, p.y + p.r * 0.7); ctx.lineTo(p.x - p.r * 0.7, p.y + p.r * 1.35);
    ctx.moveTo(p.x + p.r * 0.5, p.y + p.r * 0.7); ctx.lineTo(p.x + p.r * 0.7, p.y + p.r * 1.35);
    ctx.stroke();
    blob(p.x, p.y, p.r, seed, 1); leatherFill();
    // pale drumhead, muffled under leather
    blob(p.x, p.y, p.r * 0.78, seed + 11, 1);
    ctx.fillStyle = HEAD; ctx.fill();
    ctx.strokeStyle = DARK; ctx.lineWidth = Math.max(1, U * 0.002); ctx.stroke();
    stitchRing(p.x, p.y, p.r * 0.68);
    // highlight crescent
    ctx.beginPath();
    ctx.moveTo(p.x - p.r * 0.55, p.y - p.r * 0.45);
    ctx.arc(p.x, p.y, p.r * 0.72, Math.PI * 0.95, Math.PI * 1.45);
    ctx.strokeStyle = HIGH; ctx.lineWidth = Math.max(2, U * 0.005); ctx.stroke();
    speckle(p.x, p.y, p.r, seed + 23, 46, DARK, 0.16);
  }
  function drawDrum(p, seed, headR) {
    ctx.strokeStyle = DARK; ctx.lineWidth = Math.max(2, U * 0.004);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y + p.r * 0.6); ctx.lineTo(p.x, p.y + p.r * 1.5);
    ctx.stroke();
    blob(p.x, p.y, p.r, seed, 0.72); leatherFill();
    blob(p.x, p.y - p.r * 0.12, p.r * headR, seed + 7, 0.72);
    ctx.fillStyle = HEAD; ctx.fill();
    stitchRing(p.x, p.y - p.r * 0.12, p.r * headR * 0.85);
    speckle(p.x, p.y, p.r, seed + 31, 26, DARK, 0.15);
  }
  function drawCymbal(p, seed) {
    ctx.strokeStyle = DARK; ctx.lineWidth = Math.max(2, U * 0.004);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y + p.r * 0.2); ctx.lineTo(p.x, p.y + p.r * 1.9);
    ctx.stroke();
    blob(p.x, p.y, p.r, seed, 0.28); leatherFill();
    ctx.beginPath();
    ctx.moveTo(p.x - p.r * 0.7, p.y); ctx.arc(p.x, p.y, p.r * 0.7, Math.PI, 0);
    ctx.strokeStyle = HIGH; ctx.lineWidth = Math.max(1.5, U * 0.003); ctx.stroke();
    speckle(p.x, p.y, p.r, seed + 17, 18, DARK, 0.14);
  }
  function drawTrumpet(p, seed) {
    var u = p.r;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(-0.06);
    // tube
    ctx.fillStyle = TAN; ctx.fillRect(-u * 1.15, -u * 0.14, u * 1.7, u * 0.28);
    ctx.strokeStyle = DARK; ctx.lineWidth = Math.max(1.5, U * 0.003); ctx.strokeRect(-u * 1.15, -u * 0.14, u * 1.7, u * 0.28);
    // bell flare (muffled, leather-wrapped)
    ctx.beginPath();
    ctx.moveTo(u * 0.55, -u * 0.14); ctx.lineTo(u * 1.05, -u * 0.62);
    ctx.lineTo(u * 1.05, u * 0.62); ctx.lineTo(u * 0.55, u * 0.14);
    ctx.closePath(); leatherFill();
    ctx.beginPath();
    ctx.moveTo(u * 1.05, -u * 0.62); ctx.lineTo(u * 1.05, u * 0.62);
    ctx.strokeStyle = HIGH; ctx.lineWidth = Math.max(2, U * 0.005); ctx.stroke();
    // valves
    var i, vx;
    for (i = 0; i < 3; i++) {
      vx = -u * 0.35 + i * u * 0.32;
      ctx.fillStyle = TAN; ctx.fillRect(vx - u * 0.09, -u * 0.55, u * 0.18, u * 0.55);
      ctx.strokeStyle = DARK; ctx.lineWidth = Math.max(1.5, U * 0.003); ctx.strokeRect(vx - u * 0.09, -u * 0.55, u * 0.18, u * 0.55);
      dot(vx, -u * 0.62, Math.max(3, U * 0.008), HIGH);
    }
    // stitching along the tube
    ctx.beginPath();
    ctx.setLineDash([Math.max(3, U * 0.006), Math.max(3, U * 0.006)]);
    ctx.moveTo(-u * 1.05, 0); ctx.lineTo(u * 0.5, 0);
    ctx.strokeStyle = STITCH; ctx.lineWidth = Math.max(1, U * 0.0018); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    speckle(p.x, p.y, p.r, seed + 41, 30, DARK, 0.15);
  }
  function drawKeys(p, seed) {
    var u = p.r;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(-0.10);
    ctx.fillStyle = TAN; ctx.fillRect(-u * 1.05, -u * 0.45, u * 2.1, u * 0.9);
    ctx.strokeStyle = DARK; ctx.lineWidth = Math.max(1.5, U * 0.003); ctx.strokeRect(-u * 1.05, -u * 0.45, u * 2.1, u * 0.9);
    // key divisions, muffled under the wrapping
    ctx.strokeStyle = DARK; ctx.lineWidth = Math.max(1, U * 0.0018);
    var i, kx;
    for (i = 1; i < 8; i++) {
      kx = -u * 1.05 + i * (u * 2.1 / 8);
      ctx.beginPath(); ctx.moveTo(kx, -u * 0.45); ctx.lineTo(kx, u * 0.45); ctx.stroke();
    }
    // stitching across the top edge
    ctx.beginPath();
    ctx.setLineDash([Math.max(3, U * 0.006), Math.max(3, U * 0.006)]);
    ctx.moveTo(-u * 0.95, -u * 0.28); ctx.lineTo(u * 0.95, -u * 0.28);
    ctx.strokeStyle = STITCH; ctx.lineWidth = Math.max(1, U * 0.0018); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    speckle(p.x, p.y, p.r, seed + 53, 30, DARK, 0.14);
  }
  function drawViolin(p, seed) {
    var u = p.r;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(0.35);
    // neck + scroll
    ctx.fillStyle = DARK; ctx.fillRect(-u * 0.08, -u * 1.5, u * 0.16, u * 0.9);
    dot(0, -u * 1.58, Math.max(4, U * 0.01), HIGH);
    // body: two lobes, leather-wrapped
    blob(0, -u * 0.25, u * 0.52, seed, 1.15); leatherFill();
    blob(0, u * 0.55, u * 0.62, seed + 5, 1.15); leatherFill();
    // waist stitch + bridge hint under the skin
    ctx.beginPath();
    ctx.setLineDash([Math.max(3, U * 0.006), Math.max(3, U * 0.006)]);
    ctx.moveTo(-u * 0.45, u * 0.15); ctx.lineTo(u * 0.45, u * 0.15);
    ctx.strokeStyle = STITCH; ctx.lineWidth = Math.max(1, U * 0.0018); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = DARK; ctx.fillRect(-u * 0.3, u * 0.35, u * 0.6, u * 0.08);
    ctx.restore();
    speckle(p.x, p.y, p.r, seed + 67, 26, DARK, 0.15);
  }
  var DRAW = {
    bass: drawBass, snare: function (p, s) { drawDrum(p, s, 0.72); },
    tom: function (p, s) { drawDrum(p, s, 0.68); },
    cymbal: drawCymbal, trumpet: drawTrumpet, keys: drawKeys, violin: drawViolin
  };

  // ---- strikes: ambient schedule + recorded drags, closed-form over t ----
  var dragStrikes = []; // {t0, inst, nx, ny}
  var AMBIENT_EVERY = 4; // seconds between ambient strikes
  function ambientStrikes(t) {
    var out = [], k = Math.floor(t / AMBIENT_EVERY);
    // only strikes whose ripple is still alive (2.5 s) matter
    var i, st;
    for (i = k - 1; i <= k; i++) {
      if (i < 1) continue; // nothing plays at first: first ambient strike at t = 4
      st = i * AMBIENT_EVERY;
      if (t - st < 2.5) {
        var inst = INST[i % INST.length];
        var p = pos(inst);
        out.push({ t0: st, inst: inst, x: p.x, y: p.y });
      }
    }
    return out;
  }
  function allStrikes(t) {
    var out = ambientStrikes(t), i, s;
    for (i = 0; i < dragStrikes.length; i++) {
      s = dragStrikes[i];
      if (t - s.t0 < 2.5 && t >= s.t0) {
        out.push({ t0: s.t0, inst: s.inst, x: s.nx * W, y: s.ny * H });
      }
    }
    return out;
  }
  function drawStrikeRipples(t) {
    var strikes = allStrikes(t), i, s, age, k, rr, a;
    for (i = 0; i < strikes.length; i++) {
      s = strikes[i]; age = t - s.t0;
      if (age < 0 || age >= 2.5) continue;
      // dent disc: darkens then rebounds
      a = r4(0.34 * (1 - age / 2.5));
      ctx.fillStyle = DARK; ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.moveTo(s.x + 20 * (1 - age / 2.5) + 6, s.y);
      ctx.arc(s.x, s.y, 20 * (1 - age / 2.5) + 6, 0, Math.PI * 2);
      ctx.fill(); ctx.globalAlpha = 1;
      // ripple rings travelling across the wrapping
      for (k = 0; k < 3; k++) {
        rr = age * 46 + k * 16;
        a = r4(0.55 * (1 - age / 2.5) * (1 - k * 0.25));
        if (a <= 0) continue;
        ctx.beginPath();
        ctx.moveTo(s.x + rr, s.y);
        ctx.arc(s.x, s.y, rr, 0, Math.PI * 2);
        ctx.strokeStyle = STITCH; ctx.globalAlpha = a;
        ctx.lineWidth = Math.max(1.5, U * 0.003); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---- audio: lazy, gesture-gated only, never autoplay ----
  var actx = null;
  function ensureAudio() {
    if (actx) return actx;
    try {
      var AC = (typeof AudioContext !== 'undefined') ? AudioContext :
        (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if (!AC) return null;
      actx = new AC();
    } catch (e) { actx = null; }
    return actx;
  }
  function thump() {
    var ac = ensureAudio();
    if (!ac) return;
    try {
      if (ac.state === 'suspended') ac.resume();
      var o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
      o.type = 'sine'; o.frequency.value = 68;
      f.type = 'lowpass'; f.frequency.value = 280;
      var t0 = ac.currentTime;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      o.connect(f); f.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0 + 0.55);
    } catch (e) { /* silent by design */ }
  }

  // ---- interaction: drag across instruments strikes them in touch order ----
  var dragging = false, struckThisDrag = {};
  function strikeAt(clientX, clientY, t) {
    var rect = canvas.getBoundingClientRect();
    var x = clientX - rect.left, y = clientY - rect.top;
    var i, p, dx, dy;
    for (i = 0; i < INST.length; i++) {
      if (struckThisDrag[INST[i].id]) continue;
      p = pos(INST[i]);
      dx = x - p.x; dy = y - p.y;
      if (dx * dx + dy * dy <= p.r * p.r * 1.15) {
        struckThisDrag[INST[i].id] = true;
        dragStrikes.push({ t0: t, inst: INST[i], nx: x / W, ny: y / H });
        thump();
        return true;
      }
    }
    return false;
  }
  function onDown(e) {
    dragging = true; struckThisDrag = {};
    strikeAt(e.clientX, e.clientY, clockT);
  }
  function onMove(e) {
    if (!dragging) return;
    strikeAt(e.clientX, e.clientY, clockT);
  }
  function onUp() { dragging = false; struckThisDrag = {}; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---- frame ----
  function draw(t) {
    size();
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    // wall + floor
    ctx.fillStyle = WALL; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = FLOOR; ctx.fillRect(0, H * 0.62, W, H * 0.38);
    // soft floor shadow under the row
    ctx.fillStyle = SHADOW; ctx.globalAlpha = r4(0.18);
    ctx.fillRect(W * 0.08, H * 0.78, W * 0.84, H * 0.03);
    ctx.globalAlpha = 1;
    // instruments, kit centered-left, hand row to the right
    var i, p;
    for (i = 0; i < INST.length; i++) {
      p = pos(INST[i]);
      DRAW[INST[i].id](p, 1442000 + i * 7919);
    }
    drawStrikeRipples(t);
  }

  // ---- clock: frame one = draw(0) via boot flag; loop starts only with rAF ----
  var clockT = 0, startT = 0, booted = false;
  function loop(ts) {
    if (!booted) { booted = true; startT = ts; }
    clockT = (ts - startT) / 1000;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }

  // Probe hook (not visible): lets QA drive time and strikes deterministically.
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw, getT: function () { return clockT; },
      strike: function (id, t) {
        var i, inst = null;
        for (i = 0; i < INST.length; i++) if (INST[i].id === id) inst = INST[i];
        if (!inst) return false;
        var p = pos(inst);
        dragStrikes.push({ t0: t, inst: inst, nx: p.x / W, ny: p.y / H });
        return true;
      },
      instruments: INST
    };
  }
})();
</script>
</body>
</html>
