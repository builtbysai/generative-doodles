<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umi</title>
<style>
  html, body { margin: 0; padding: 0; background: #16121a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  /* ---------- seeded PRNG (mulberry32), never Math.random ---------- */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- palette ---------- */
  var PURPLE = '#4A2E4F', SAND = '#D9C7A8', RAW = '#B9A582',
      FOLD = '#33203A', STITCH = '#E8E0D0', BG = '#16121a';

  var W = 0, H = 0, isPhone = false;
  var tubes = [], loopIndex = -1, LOOP = 60;

  function size() {
    var vw = null, vh = null;
    if (typeof window !== 'undefined' && window.visualViewport) {
      vw = window.visualViewport.width; vh = window.visualViewport.height;
    }
    if (!vw) {
      vw = (typeof window !== 'undefined' && window.innerWidth) || 1280;
      vh = (typeof window !== 'undefined' && window.innerHeight) || 900;
    }
    W = vw; H = vh;
    canvas.width = Math.round(W); canvas.height = Math.round(H);
    if (canvas.style) {
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    }
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999; sh = window.screen.height || 9999;
    }
    isPhone = (Math.min(sw, sh) < 700) || (H > W * 1.15);
    if (typeof document !== 'undefined' && document.body && document.body.style) {
      document.body.style.background = BG;
    }
  }

  /* ---------- per-loop tube generation (seeded) ---------- */
  function genTubes(li) {
    var rnd = mulberry32(1297 + li * 7919);
    var count = 2 + Math.floor(rnd() * 2); /* 2 or 3 */
    var span = isPhone ? W * 0.78 : Math.min(W * 0.60, 620);
    var x0 = (W - span) / 2;
    var out = [];
    for (var i = 0; i < count; i++) {
      var cx = x0 + span * ((i + 0.5) / count) + (rnd() - 0.5) * span * 0.06;
      var w = span / count * (0.62 + rnd() * 0.22);
      var len = H * (0.78 + rnd() * 0.10);
      var color = (i % 2 === 0) ? PURPLE : SAND;
      if (rnd() < 0.25) color = (color === PURPLE) ? SAND : PURPLE;
      var period = 7 + rnd() * 5;
      var phase = rnd() * Math.PI * 2;
      var amp = (0.010 + rnd() * 0.008);
      var flaps = [];
      var nf = 10 + Math.floor(rnd() * 7);
      for (var f = 0; f < nf; f++) {
        /* gravity-sorted: denser toward the bottom */
        var u = 0.22 + 0.76 * Math.pow(rnd(), 0.62);
        var side = (rnd() < 0.5) ? -1 : 1;
        var fw = (10 + rnd() * 26) * (W / 1280 + 0.6) / 1.6;
        if (fw < 8) fw = 8;
        flaps.push({
          u: u, side: side, w: fw, h: fw * (0.6 + rnd() * 0.7),
          rot: (rnd() - 0.5) * 1.2, col: (rnd() < 0.5) ? RAW : color,
          fper: 1.6 + rnd() * 2.2, fph: rnd() * Math.PI * 2,
          famp: 0.10 + rnd() * 0.14
        });
      }
      out.push({ cx: cx, w: w, len: len, color: color,
                 period: period, phase: phase, amp: amp, flaps: flaps });
    }
    return out;
  }

  function ensureLoop(t) {
    var li = Math.floor(t / LOOP);
    if (li !== loopIndex) { loopIndex = li; tubes = genTubes(li); }
  }

  /* ---------- recorded gust events (closed-form) ---------- */
  var gusts = [];
  var lastX = null, lastT = 0;
  function gustBoost(t) {
    var b = 0;
    for (var i = 0; i < gusts.length; i++) {
      var g = gusts[i];
      if (t >= g.t) b += g.s * Math.exp(-(t - g.t) / 2.5);
    }
    if (b > 2) b = 2;
    return b;
  }
  function onDown(e) {
    var p = pos(e); lastX = p.x; lastT = curT;
  }
  function onMove(e) {
    if (lastX === null) return;
    var p = pos(e);
    var dx = p.x - lastX;
    if (Math.abs(dx) > 2) {
      gusts.push({ t: curT, s: Math.min(Math.abs(dx) * 0.012, 1.4) });
      if (gusts.length > 24) gusts.shift();
    }
    lastX = p.x; lastT = curT;
  }
  function onUp() { lastX = null; }
  function pos(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    return r;
  }
  var curT = 0;
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  /* ---------- drawing helpers (flat shapes only) ---------- */
  function dot(x, y, r, col) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  function dashLine(x1, y1, x2, y2, dash, gap, col, lw) {
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1) return;
    var ux = dx / len, uy = dy / len;
    ctx.strokeStyle = col; ctx.lineWidth = lw || 1;
    ctx.beginPath();
    var d = 0;
    while (d < len) {
      var e = Math.min(d + dash, len);
      ctx.moveTo(x1 + ux * d, y1 + uy * d);
      ctx.lineTo(x1 + ux * e, y1 + uy * e);
      d = e + gap;
    }
    ctx.stroke();
  }

  function drawTube(tb, t, boost) {
    var ang = tb.amp * Math.sin(2 * Math.PI * t / tb.period + tb.phase) * (1 + boost);
    var top = 0, len = tb.len, w = tb.w, cx = tb.cx;
    var steps = 14;
    var lx = cx - w / 2, rx = cx + w / 2;
    function offAt(y) { return Math.sin(ang) * y + Math.sin(ang * 0.6) * y * 0.06; }
    function widAt(u) { return w * (0.92 + 0.14 * u); }
    /* body: top edge, right side top to bottom, left side bottom to top */
    ctx.fillStyle = tb.color;
    ctx.beginPath();
    ctx.moveTo(lx, top);
    ctx.lineTo(rx, top);
    for (var s = 0; s <= steps; s++) {
      var u = s / steps, y = top + len * u;
      ctx.lineTo(rx + offAt(y) + (widAt(u) - w) / 2, y);
    }
    for (var s2 = steps; s2 >= 0; s2--) {
      var u2 = s2 / steps, y2 = top + len * u2;
      ctx.lineTo(lx + offAt(y2) - (widAt(u2) - w) / 2, y2);
    }
    ctx.closePath(); ctx.fill();

    /* fold shading: flat vertical bands */
    ctx.fillStyle = FOLD;
    for (var k = 0; k < 3; k++) {
      var fx = cx + (k - 1) * w * 0.26;
      var fw = w * 0.10;
      ctx.globalAlpha = 0.20;
      ctx.beginPath();
      ctx.moveTo(fx - fw / 2, top);
      ctx.lineTo(fx + fw / 2, top);
      for (var s3 = 0; s3 <= steps; s3++) {
        var u3 = s3 / steps, y3 = top + len * u3;
        ctx.lineTo(fx + fw / 2 + offAt(y3), y3);
      }
      for (var s4 = steps; s4 >= 0; s4--) {
        var u4 = s4 / steps, y4 = top + len * u4;
        ctx.lineTo(fx - fw / 2 + offAt(y4), y4);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* raw edges along both sides */
    ctx.strokeStyle = RAW; ctx.lineWidth = Math.max(1, W * 0.0012);
    ctx.beginPath();
    ctx.moveTo(lx, top);
    for (var s5 = 0; s5 <= steps; s5++) {
      var u5 = s5 / steps, y5 = top + len * u5;
      ctx.lineTo(lx + offAt(y5) - (widAt(u5) - w) / 2, y5);
    }
    ctx.moveTo(rx, top);
    for (var s6 = 0; s6 <= steps; s6++) {
      var u6 = s6 / steps, y6 = top + len * u6;
      ctx.lineTo(rx + offAt(y6) + (widAt(u6) - w) / 2, y6);
    }
    ctx.stroke();

    /* flaps: irregular barnacle polygons, flutter out of phase */
    for (var fi = 0; fi < tb.flaps.length; fi++) {
      var fl = tb.flaps[fi];
      var fy = top + len * fl.u;
      var foff = Math.sin(ang) * fy + Math.sin(ang * 0.6) * fy * 0.06;
      var wwf = w * (0.92 + 0.14 * fl.u);
      var ex = (fl.side < 0)
        ? lx + foff - (wwf - w) / 2
        : rx + foff + (wwf - w) / 2;
      var flut = Math.sin(2 * Math.PI * t / fl.fper + fl.fph) * fl.famp * (1 + boost * 0.8);
      var bx = ex + fl.side * fl.w * 0.5 + flut * 14;
      var by = fy + flut * 8;
      ctx.fillStyle = fl.col;
      ctx.beginPath();
      ctx.moveTo(ex, fy - fl.h * 0.4);
      ctx.lineTo(bx + fl.w * 0.4 * fl.side, by - fl.h * 0.5);
      ctx.lineTo(bx + fl.w * 0.7 * fl.side, by + fl.h * 0.2);
      ctx.lineTo(bx + fl.w * 0.2 * fl.side, by + fl.h * 0.55);
      ctx.lineTo(ex, fy + fl.h * 0.4);
      ctx.closePath(); ctx.fill();
      /* stitch ticks attaching the flap */
      dashLine(ex, fy - fl.h * 0.4, ex, fy + fl.h * 0.4, 3, 4, STITCH, 1);
    }
  }

  function draw(t) {
    curT = t;
    ensureLoop(t);
    var boost = gustBoost(t);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    /* faint horizontal tide line behind the tubes */
    ctx.fillStyle = STITCH;
    ctx.globalAlpha = 0.14;
    ctx.fillRect(0, H * 0.55, W, Math.max(1, H * 0.0015));
    ctx.globalAlpha = 1;
    for (var i = 0; i < tubes.length; i++) drawTube(tubes[i], t, boost);
  }

  function onResize() {
    size();
    var tt = started ? curT : 0;
    draw(tt);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', onResize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
  }

  /* ---------- boot: frame one at exactly t = 0 ---------- */
  var started = false, T0 = 0;
  size();
  draw(0);

  function loop(ts) {
    if (!started) { started = true; T0 = ts; }
    var t = (ts - T0) / 1000;
    if (t < 0) t = 0;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
