<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№8974 · Negative Space — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #17150f;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 640px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #d63d1e; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(94vw, 1150px, calc((100vh - 300px) * 1.6));
    background: #f1ebdb;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; aspect-ratio: 8 / 5; height: auto; }
  footer { margin-top: 4vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #d63d1e; text-decoration: none; }
  /* thumbnail mode: exact 1280x800 stage, no chrome */
  body.thumb-mode { padding: 0; justify-content: flex-start; }
  body.thumb-mode header, body.thumb-mode footer { display: none; }
  body.thumb-mode #stage { width: 1280px; height: 800px; box-shadow: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№8974</span> · Negative Space</h1>
  <p>A loud crowd of discs, bars and triangles in three bright inks. The empty
  ground in the middle is the drawing: look for what is not there.
  <b>Click the piece for a new variation.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 132;
if (params.has("thumb")) document.body.classList.add("thumb-mode");

const GROUND = "#f1ebdb";
const TAU = Math.PI * 2;
const VW = 1600, VH = 1000;

// ---------- seeded composition ----------
const rnd = mulberry32(seed);

// loud ink sets: exactly three inks per piece, quiet paper ground
const PALETTES = [
  ["#d63d1e", "#2340b8", "#eda612"],  // vermilion, ultramarine, ochre
  ["#0e7c66", "#d21f6e", "#e8721c"],  // teal, magenta, orange
  ["#3a1f9e", "#d91e2e", "#e6a70a"],  // indigo, red, gold
  ["#1e6e3a", "#7a1f9e", "#c91e4e"]   // forest, purple, crimson
];
const inks = PALETTES[(rnd() * PALETTES.length) | 0];

// silhouette kind: seed 132 is pinned to the flying bird (the strong default);
// every other seed rolls its own kind.
const KINDS = ["flying", "perched", "letter", "key", "fish"];
// ?kind= overrides the silhouette family (testing hook); seed 132 is pinned
// to the flying bird as the strong default; other seeds roll their own.
const kindParam = params.get("kind");
const kind = (kindParam && KINDS.includes(kindParam)) ? kindParam
  : (seed === 132) ? "flying" : KINDS[(rnd() * KINDS.length) | 0];
const letters = "ABRSEGKD";
const letter = letters[(rnd() * letters.length) | 0];
const silRot = (rnd() - 0.5) * 0.06;          // small rotation, keeps it readable
const silScale = 1.02 + rnd() * 0.18;
const silJx = (rnd() - 0.5) * 100, silJy = (rnd() - 0.5) * 60;

// Each subpath is filled separately: overlapping subpaths with opposite
// windings would cancel under the nonzero rule and leave holes.
function traceSilhouette(g){
  g.save();
  g.translate(VW / 2 + silJx, VH / 2 + silJy);
  g.rotate(silRot);
  g.scale(silScale, silScale);
  if (kind === "flying"){
    // bird in side flight, facing right: fan tail, beak, one wing up, one down
    g.beginPath();                                    // tail fan
    g.moveTo(-200, -20);
    g.lineTo(-400, -110); g.lineTo(-375, -15);
    g.lineTo(-400, 80); g.lineTo(-200, 30);
    g.fill();
    g.beginPath();                                    // body + head + beak
    g.moveTo(-240, -20);
    g.bezierCurveTo(-120, -55, 20, -60, 130, -45);
    g.bezierCurveTo(180, -70, 220, -80, 250, -65);
    g.lineTo(345, -30); g.lineTo(250, -5);
    g.bezierCurveTo(230, 25, 180, 45, 120, 52);
    g.bezierCurveTo(0, 68, -120, 60, -240, 30);
    g.fill();
    g.beginPath();                                    // raised wing
    g.moveTo(-70, -45);
    g.bezierCurveTo(-55, -150, -45, -250, -25, -350);
    g.lineTo(45, -335);
    g.bezierCurveTo(50, -235, 60, -140, 75, -40);
    g.fill();
    g.beginPath();                                    // lowered wing
    g.moveTo(-20, 55);
    g.bezierCurveTo(0, 150, 20, 230, 50, 300);
    g.lineTo(120, 285);
    g.bezierCurveTo(105, 205, 100, 130, 105, 60);
    g.fill();
  } else if (kind === "perched"){
    // songbird perched in side profile: head, beak, plump body, long tail, branch
    g.beginPath(); g.arc(135, -172, 90, 0, TAU); g.fill();   // head
    g.beginPath();                                            // beak
    g.moveTo(212, -202); g.lineTo(308, -160);
    g.lineTo(212, -128); g.closePath(); g.fill();
    g.beginPath();                                            // tail wedge
    g.moveTo(-120, 60);
    g.lineTo(-335, 295); g.lineTo(-235, 318); g.lineTo(-55, 135);
    g.closePath(); g.fill();
    g.beginPath();                                            // body
    g.moveTo(72, -128);
    g.bezierCurveTo(-12, -88, -42, -18, -45, 62);
    g.bezierCurveTo(-48, 142, -18, 202, 32, 232);
    g.bezierCurveTo(112, 266, 202, 240, 232, 170);
    g.bezierCurveTo(252, 110, 242, 20, 212, -58);
    g.bezierCurveTo(197, -100, 158, -124, 118, -134);
    g.closePath(); g.fill();
    g.beginPath(); g.rect(-300, 246, 620, 30); g.fill();      // branch
  } else if (kind === "letter"){
    g.font = "900 640px Georgia, 'Times New Roman', serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(letter, 0, 30);
  } else if (kind === "key"){
    // old key: round bow, shaft, two teeth
    g.beginPath(); g.arc(-160, 0, 150, 0, TAU); g.fill();
    g.beginPath(); g.rect(-60, -48, 530, 96); g.fill();
    g.beginPath(); g.rect(300, 48, 56, 130); g.fill();
    g.beginPath(); g.rect(410, 48, 56, 90); g.fill();
  } else { // fish
    g.beginPath(); g.ellipse(60, 0, 260, 150, 0, 0, TAU); g.fill(); // body
    g.beginPath();                                                   // tail
    g.moveTo(300, 0); g.lineTo(470, -140); g.lineTo(470, 140);
    g.closePath(); g.fill();
    g.beginPath();                                                   // dorsal fin
    g.moveTo(-40, -140); g.lineTo(60, -60); g.lineTo(-120, -60);
    g.closePath(); g.fill();
  }
  g.restore();
}

// ---------- shapes layer ----------
const layer = document.createElement("canvas");
function drawLayer(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  layer.width = Math.round(VW * dpr); layer.height = Math.round(VH * dpr);
  const g = layer.getContext("2d");
  g.scale(dpr, dpr);
  const r2 = mulberry32(seed ^ 0x2f6e2b);

  // base weave: tight jittered grid of discs, covers the ground almost fully
  // so the only quiet ground left is the silhouette
  const bstep = 95;
  for (let y = -60; y < VH + 60; y += bstep){
    for (let x = -60; x < VW + 60; x += bstep){
      const bs = 0.85 + r2() * 0.3;
      g.save();
      g.translate(x + (r2() * 2 - 1) * 28, y + (r2() * 2 - 1) * 28);
      g.fillStyle = inks[(r2() * 3) | 0];
      g.beginPath(); g.arc(0, 0, 80 * bs, 0, TAU); g.fill();
      g.restore();
    }
  }

  // dense jittered grid of bold shapes, overdrawn past the edges
  const shapes = [];
  const step = 150;
  for (let y = -120; y < VH + 160; y += step){
    for (let x = -120; x < VW + 160; x += step){
      const n = 1 + ((r2() * 2) | 0);
      for (let i = 0; i < n; i++){
        shapes.push({
          x: x + (r2() * 2 - 1) * 75, y: y + (r2() * 2 - 1) * 75,
          t: (r2() * 3) | 0, ink: inks[(r2() * 3) | 0],
          a: r2() * TAU, s: 0.7 + r2() * 0.7
        });
      }
    }
  }
  // shuffle so the three inks interleave
  for (let i = shapes.length - 1; i > 0; i--){
    const j = (r2() * (i + 1)) | 0;
    const tmp = shapes[i]; shapes[i] = shapes[j]; shapes[j] = tmp;
  }
  for (const sh of shapes){
    g.save();
    g.translate(sh.x, sh.y);
    g.rotate(sh.a);
    g.fillStyle = sh.ink;
    if (sh.t === 0){                       // disc
      g.beginPath(); g.arc(0, 0, 76 * sh.s, 0, TAU); g.fill();
    } else if (sh.t === 1){                // bar
      g.fillRect(-115 * sh.s, -36 * sh.s, 230 * sh.s, 72 * sh.s);
    } else {                               // triangle
      const R = 108 * sh.s;
      g.beginPath();
      g.moveTo(R, 0);
      g.lineTo(R * Math.cos(TAU / 3), R * Math.sin(TAU / 3));
      g.lineTo(R * Math.cos(2 * TAU / 3), R * Math.sin(2 * TAU / 3));
      g.closePath(); g.fill();
    }
    g.restore();
  }

  // punch the silhouette OUT of the loud field: the ground reads as the figure
  g.save();
  g.globalCompositeOperation = "destination-out";
  g.fillStyle = "#fff";
  g.translate(VW / 2, VH / 2); // traceSilhouette recenters itself
  g.translate(-VW / 2, -VH / 2);
  // draw mask on a scratch canvas so the trace transform stays exact
  const mask = document.createElement("canvas");
  mask.width = layer.width; mask.height = layer.height;
  const mg = mask.getContext("2d");
  mg.scale(dpr, dpr);
  mg.fillStyle = "#fff";
  traceSilhouette(mg);
  g.drawImage(mask, 0, 0, VW, VH);
  g.restore();
}

// ---------- render ----------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const stageEl = document.getElementById("stage");
function draw(){
  // deterministic 8:5 bitmap from the stage width: never trust the canvas's
  // own rect here, the first layout pass can report a wrong height and the
  // bitmap would desync from the CSS box (cream band below the art).
  const cssW = Math.max(1, Math.round(stageEl.clientWidth));
  const cssH = Math.max(1, Math.round(cssW * 5 / 8));
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const Sx = canvas.width / VW, Sy = canvas.height / VH;
  ctx.setTransform(Sx, 0, 0, Sy, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  if (params.has("mask")){
    // debug: silhouette alone in dark ink on the ground
    ctx.save();
    ctx.fillStyle = "#241e15";
    traceSilhouette(ctx);
    ctx.restore();
  } else {
    drawLayer();
    ctx.drawImage(layer, 0, 0, VW, VH);
  }

  // paper grain
  const gr = mulberry32(seed ^ 0x9e3779b9);
  ctx.fillStyle = "rgba(60,50,36,0.05)";
  for (let i = 0; i < 1200; i++){
    ctx.fillRect(gr() * VW, gr() * VH, 2.2, 2.2);
  }
  // faint vignette
  const vg = ctx.createRadialGradient(VW/2, VH/2, 520, VW/2, VH/2, 1050);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(74,64,46,0.08)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VW, VH);
}

draw();
window.addEventListener("resize", draw);

document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  location.reload();
});
</script>
</body>
</html>
