<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Distorted Mirrors</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0E1410; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1349000);

  // ---- Scene layout (fractions of frame; resolved per draw) ----
  // 6 trunks, varying widths. Each: x fraction, width fraction of W,
  // sway amplitude (px at 1000px reference), sway period (s), phase,
  // and a set of bark streaks (offset fraction within trunk, width px, alpha).
  var trunks = [];
  var i, j;
  var trunkXs = [0.06, 0.22, 0.38, 0.55, 0.71, 0.88];
  var trunkWs = [0.075, 0.052, 0.095, 0.060, 0.082, 0.048];
  for (i = 0; i < 6; i++) {
    var streaks = [];
    var nStreaks = 5 + Math.floor(rng() * 4);
    for (j = 0; j < nStreaks; j++) {
      streaks.push({
        off: 0.08 + rng() * 0.84,
        w: 1.5 + rng() * 3.5,
        a: 0.25 + rng() * 0.45
      });
    }
    trunks.push({
      x: trunkXs[i],
      w: trunkWs[i],
      swayA: 4 + rng() * 9,
      swayT: 9 + rng() * 8,
      phase: rng() * Math.PI * 2,
      streaks: streaks
    });
  }

  // 4 mirrors, each bolted to a DIFFERENT trunk, at driving height.
  // diameter as fraction of frame height (12-20%); barrel strength k.
  var mirrorTrunks = [0, 2, 3, 5];
  var mirrors = [];
  for (i = 0; i < 4; i++) {
    var mStreaks = [];
    var mN = 9 + Math.floor(rng() * 5);
    for (j = 0; j < mN; j++) {
      mStreaks.push({
        u: -1 + rng() * 2,          // normalized x within mirror (-1..1)
        w: 2 + rng() * 6,           // streak width px (at 1000px reference)
        shade: rng(),               // 0..1 picks trunk tone vs dark tone
        a: 0.35 + rng() * 0.5
      });
    }
    mirrors.push({
      trunk: mirrorTrunks[i],
      y: 0.50 + rng() * 0.10,       // driving height band
      d: 0.13 + rng() * 0.06,       // diameter fraction of H
      k: 0.28 + rng() * 0.14,       // barrel strength
      streaks: mStreaks,
      phase: rng() * Math.PI * 2
    });
  }

  // Drifting light blobs (flat alpha, never gradients).
  var drifts = [];
  for (i = 0; i < 3; i++) {
    drifts.push({
      x: rng(), y: 0.2 + rng() * 0.6,
      rx: 0.10 + rng() * 0.10, ry: 0.05 + rng() * 0.06,
      T: 26 + rng() * 18, phase: rng() * Math.PI * 2,
      a: 0.025 + rng() * 0.02
    });
  }

  // Pointer = the presence. Parked at a default; pointer-move/drag moves it.
  var pointer = { x: 0.52, y: 0.46, active: false };

  function viewport() {
    var w, h;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      w = visualViewport.width; h = visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth) {
      w = window.innerWidth; h = window.innerHeight;
    } else {
      w = canvas.width || 1280; h = canvas.height || 900;
    }
    return { w: w, h: h };
  }

  function isPhone(W, H) {
    var minDim = 1000000;
    try {
      if (typeof window !== 'undefined' && window.screen) {
        minDim = Math.min(window.screen.width, window.screen.height);
      }
    } catch (e) { /* ignore */ }
    if (minDim < 700) return true;
    return H > W * 1.15;
  }

  function draw(t) {
    var vp = viewport();
    var W = vp.w, H = vp.h;
    var phone = isPhone(W, H);
    var scale = Math.min(W, H) / 900; // reference scale for px details
    if (scale < 0.45) scale = 0.45;

    if (canvas.width !== Math.round(W) || canvas.height !== Math.round(H)) {
      canvas.width = Math.round(W); canvas.height = Math.round(H);
    }
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    try {
      if (typeof document !== 'undefined' && document.body) {
        document.body.style.background = '#0E1410';
      }
    } catch (e) { /* QA renderer has no body */ }

    // Ground: near-black green, full-bleed.
    ctx.fillStyle = '#0E1410';
    ctx.fillRect(0, 0, W, H);

    // Drifting light (behind trunks, very low alpha).
    var d;
    for (i = 0; i < drifts.length; i++) {
      d = drifts[i];
      var dx = (d.x + 0.06 * Math.sin(2 * Math.PI * t / d.T + d.phase)) * W;
      var dy = d.y * H + 14 * Math.sin(2 * Math.PI * t / (d.T * 1.3) + d.phase);
      ctx.fillStyle = 'rgba(232,217,160,' + d.a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(dx, dy, d.rx * W, d.ry * H, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Trunks: flat fields with bark streaks, gentle closed-form sway.
    // Trunks run off top and bottom: no horizon, no sky.
    var tr, sway, tx, tw, s;
    for (i = 0; i < trunks.length; i++) {
      tr = trunks[i];
      sway = tr.swayA * scale * Math.sin(2 * Math.PI * t / tr.swayT + tr.phase);
      tx = tr.x * W + sway;
      tw = tr.w * W;
      ctx.fillStyle = '#3A3226';
      ctx.fillRect(tx - tw / 2, -20, tw, H + 40);
      for (j = 0; j < tr.streaks.length; j++) {
        s = tr.streaks[j];
        ctx.fillStyle = 'rgba(36,29,18,' + s.a.toFixed(3) + ')';
        ctx.fillRect(tx - tw / 2 + s.off * tw, -20, Math.max(1, s.w * scale), H + 40);
      }
    }

    // Mirrors. Global diameter cap from the closest pair of mirror trunks,
    // minus twice the max sway plus margin, so no two mirrors can ever
    // overlap even at square aspect (trunk gap 0.17W vs diameter ~0.19H).
    // Phones instead use the stagger below, so the cap applies off-phone.
    var mXs = [];
    for (i = 0; i < mirrors.length; i++) mXs.push(trunks[mirrors[i].trunk].x);
    mXs.sort(function (a, b) { return a - b; });
    var minGap = Infinity, gi;
    for (gi = 0; gi < mXs.length - 1; gi++) {
      var g = (mXs[gi + 1] - mXs[gi]) * W;
      if (g < minGap) minGap = g;
    }
    var maxSwayPx = 0;
    for (i = 0; i < mirrors.length; i++) {
      var sa = trunks[mirrors[i].trunk].swayA * scale;
      if (sa > maxSwayPx) maxSwayPx = sa;
    }
    var diaCap = minGap - 2 * maxSwayPx - 8;

    var m, cx, cy, r, px, py, k;
    for (i = 0; i < mirrors.length; i++) {
      m = mirrors[i];
      tr = trunks[m.trunk];
      sway = tr.swayA * scale * Math.sin(2 * Math.PI * t / tr.swayT + tr.phase);
      // Phone adaptation: cap diameter so mirrors fit the narrow field,
      // and stagger alternate mirrors vertically so no two overlap
      // (adjacent mirror trunks sit only ~0.17W apart on a phone).
      var dia = m.d * H;
      var my = m.y;
      if (phone) {
        dia = Math.min(dia, 0.24 * W);
        my = 0.44 + (i % 2) * 0.14;
      } else if (dia > diaCap) {
        dia = diaCap;
      }
      cx = tr.x * W + sway;
      cy = my * H;
      r = dia / 2;
      // Keep every mirror fully in frame (edge trunks on narrow screens).
      if (cx < r) cx = r;
      if (cx > W - r) cx = W - r;

      // Proximity brightening: mirrors nearest the pointer brighten.
      var pdx = pointer.x * W - cx;
      var pdy = pointer.y * H - cy;
      var pdist = Math.sqrt(pdx * pdx + pdy * pdy) / (r * 3);
      var boost = 0;
      if (pdist < 1) boost = 0.30 * (1 - pdist);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx + r, cy);
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.clip();

      // Glass base.
      ctx.fillStyle = '#9AA8B0';
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

      // Funhouse content: seeded trunk streaks, barrel-compressed toward
      // the edges (center magnified, edges squeezed), so the woods read
      // distorted, never legible. Drawn procedurally inside the clip.
      var st, u, uc, sx;
      for (j = 0; j < m.streaks.length; j++) {
        st = m.streaks[j];
        u = st.u;
        // Barrel mapping: points move inward, more so near the edge.
        uc = u * (1 - m.k * u * u);
        sx = cx + uc * r * 0.92;
        ctx.fillStyle = st.shade < 0.5
          ? 'rgba(58,50,38,' + st.a.toFixed(3) + ')'
          : 'rgba(36,29,18,' + st.a.toFixed(3) + ')';
        ctx.fillRect(sx - (st.w * scale) / 2, cy - r, Math.max(1, st.w * scale), r * 2);
      }
      // A faint vertical trunk mass behind the streaks, also compressed.
      ctx.fillStyle = 'rgba(58,50,38,0.25)';
      ctx.fillRect(cx - r * 0.28, cy - r, r * 0.56, r * 2);

      // Brightening wash for nearby mirrors (flat alpha, no gradient).
      if (boost > 0.01) {
        ctx.fillStyle = 'rgba(232,217,160,' + boost.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(cx + r, cy);
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Presence dot: the pointer's position, barrel-distorted per mirror,
      // clamped inside the mirror. It exists ONLY as reflection: it is
      // drawn nowhere outside a mirror.
      var vx = (pointer.x * W - cx) / (r * 2.2);
      var vy = (pointer.y * H - cy) / (r * 2.2);
      var vl = Math.sqrt(vx * vx + vy * vy);
      if (vl > 1) { vx /= vl; vy /= vl; vl = 1; }
      // Barrel-compress the dot offset the same way as the streaks.
      var dc = 1 - m.k * vl * vl;
      var dox = vx * dc * r * 1.7;
      var doy = vy * dc * r * 1.7;
      var dl = Math.sqrt(dox * dox + doy * doy);
      var maxOff = r * 0.78;
      if (dl > maxOff) { dox = dox / dl * maxOff; doy = doy / dl * maxOff; }
      var dotR = Math.max(2.5, 0.055 * r);
      ctx.fillStyle = '#F5C86E';
      ctx.beginPath();
      ctx.moveTo(cx + dox + dotR, cy + doy);
      ctx.arc(cx + dox, cy + doy, dotR, 0, Math.PI * 2);
      ctx.fill();
      // Warm halo ring around the dot, flat alpha.
      ctx.fillStyle = 'rgba(245,200,110,0.25)';
      ctx.beginPath();
      ctx.moveTo(cx + dox + dotR * 2.2, cy + doy);
      ctx.arc(cx + dox, cy + doy, dotR * 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#F5C86E';
      ctx.beginPath();
      ctx.moveTo(cx + dox + dotR, cy + doy);
      ctx.arc(cx + dox, cy + doy, dotR, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // Rim + bolt (drawn after restore so they sit crisp on the edge).
      ctx.strokeStyle = '#C9D2D8';
      ctx.lineWidth = Math.max(1.5, 0.02 * r);
      ctx.beginPath();
      ctx.moveTo(cx + r, cy);
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
      // Small glass highlight arc, top-left, flat alpha.
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = Math.max(1, 0.012 * r);
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.86, Math.PI * 0.95, Math.PI * 1.45);
      ctx.stroke();
      // Bolt at the rim bottom.
      ctx.fillStyle = '#5C5C5C';
      ctx.beginPath();
      ctx.moveTo(cx + Math.max(2, 0.05 * r), cy + r);
      ctx.arc(cx, cy + r, Math.max(2, 0.05 * r), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Pointer is the presence: move/drag updates it. No tap action.
  function onMove(clientX, clientY) {
    var vp = viewport();
    pointer.x = clientX / vp.w;
    pointer.y = clientY / vp.h;
    if (pointer.x < 0) pointer.x = 0;
    if (pointer.x > 1) pointer.x = 1;
    if (pointer.y < 0) pointer.y = 0;
    if (pointer.y > 1) pointer.y = 1;
  }
  try {
    canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
    canvas.addEventListener('pointerdown', function (e) { onMove(e.clientX, e.clientY); });
  } catch (e) { /* QA renderer: listeners recorded, no events */ }

  // Resize handling.
  function onResize() { draw(bootT); }
  var bootT = 0;
  try {
    if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
      visualViewport.addEventListener('resize', onResize);
    }
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('resize', onResize);
    }
  } catch (e) { /* ignore */ }

  // Frame one: synchronous, constant phase. Clock starts with the rAF loop.
  var startTime = null;
  draw(0);
  function loop(ts) {
    if (startTime === null) startTime = ts;
    var t = (ts - startTime) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
