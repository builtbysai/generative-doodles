<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acausal Portal Field</title>
<style>
  html, body { margin: 0; padding: 0; background: #1C1A17; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
"use strict";

/* ---------- seeded hash (integer, deterministic) ---------- */
function hash(n){
  var x = (n * 2654435761) >>> 0;
  x ^= x >>> 15; x = (x * 2246822519) >>> 0;
  x ^= x >>> 13; x = (x * 3266489917) >>> 0;
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

/* ---------- the story bank: crowd-tiny, specific, wry ---------- */
var STORIES = {
  eclipse:  ["the eclipse photo came out blank.", "except one frame.",
             "my grandfather is in it, waving.", "he died in 1974."],
  fork:     ["found my grandmother's fork", "in a field in ohio.",
             "she never left denver."],
  coin:     ["the coin landed on its edge.", "twice.", "we stopped flipping."],
  key:      ["the key fit the new apartment.", "it was cut for the old one.",
             "different city."],
  leaf:     ["a leaf landed on the exact page.", "the word was 'stay'.",
             "i stayed."],
  record:   ["the record skipped at the same line", "in two different houses",
             "eleven years apart."],
  ticket:   ["found the bus ticket in a library book.", "route 9, june 1998.",
             "the route ended in 1997."],
  marble:   ["the marble rolled under the stove.", "we moved twice.",
             "it rolled out of the new stove.", "same chip on the green stripe."],
  postcard: ["the postcard arrived forty years late.", "postmarked the day i was born.",
             "it said: 'wish you were here.'", "signed with my own initials."],
  button:   ["the button popped off at the wedding.", "found it sewn back on the next morning.",
             "nobody admitted to sewing.", "the thread was red. ours was black."]
};

/* GENSTART */
/* contributed stories: the visitor contributes the act, the field the words */
var GEN_PLACES = ["ohio", "a coat i never wear", "the church basement",
                  "a bus station locker", "my sister's attic", "the wrong apartment",
                  "a library in reno", "the break room fridge"];
var GEN_BOXES  = ["attic box", "blue suitcase", "kitchen drawer", "glove compartment"];
var GEN_YEARS  = ["1987", "1994", "2003", "1979"];
var GEN_SPANS  = ["three", "eleven", "seven", "twenty"];
var GEN_STATE  = ["warm", "ticking", "folded twice", "smelling of rain"];
function genPick(arr, k, i){ return arr[Math.floor(hash(9100 + k * 131 + i * 17) * arr.length) % arr.length]; }
function genStory(k, objName){
  var t = Math.floor(hash(9200 + k * 131) * 3) % 3;
  if (t === 0) return ["the " + objName + " showed up in " + genPick(GEN_PLACES, k, 1),
                       genPick(GEN_SPANS, k, 2) + " years after i lost it.",
                       "same scratch on the back."];
  if (t === 1) return ["a stranger handed me the " + objName,
                       "in " + genPick(GEN_PLACES, k, 3) + ".",
                       "said i had dropped it.", "i had never been there."];
  return ["the " + objName + " was in the " + genPick(GEN_BOXES, k, 4),
          "the one we threw out in " + genPick(GEN_YEARS, k, 5) + ".",
          "still " + genPick(GEN_STATE, k, 6) + "."];
}
/* GENEND */

/* ---------- the field registry ---------- */
var BASE = [
  ["eclipse",  0.15, 0.20], ["fork",   0.35, 0.13], ["coin",  0.57, 0.17],
  ["key",      0.83, 0.15], ["leaf",   0.88, 0.44], ["record", 0.66, 0.40],
  ["marble",   0.13, 0.47], ["postcard", 0.31, 0.68], ["button", 0.52, 0.80],
  ["ticket",   0.80, 0.72]
];
var EXT = ["shell", "thimble", "stamp", "feather"];
var MAXOBJ = 16;
var objects = [];
for (var bi = 0; bi < BASE.length; bi++){
  objects.push({
    type: BASE[bi][0],
    fx: BASE[bi][1] + (hash(3100 + bi * 7) - 0.5) * 0.05,
    fy: BASE[bi][2] + (hash(3200 + bi * 7) - 0.5) * 0.05,
    story: STORIES[BASE[bi][0]],
    phase: hash(3300 + bi * 13) * 6.2832,
    born: -100, contrib: false
  });
}
var contribCount = 0;

/* ---------- clock: frame one at the fixed phase, then elapsed ---------- */
var T0 = 12;
var nowT = T0;
var baseClock = T0;
var lastStamp = -1;

/* ---------- interaction state ---------- */
var ptr = { x: 0, y: 0, inside: false, down: false };
var downX = 0, downY = 0, downClock = 0, downObj = null, dragging = null, dragMoved = false;
var dwellObj = null, dwellStart = 0, pressOpened = false;
var portal = null; /* {obj, openT, closeT} closeT = -1 until closing */

function hitObj(x, y, gr){
  for (var i = objects.length - 1; i >= 0; i--){
    var o = objects[i];
    var dx = x - o.fx * W, dy = y - o.fy * H;
    if (dx * dx + dy * dy < gr * gr) return o;
  }
  return null;
}
function openPortal(o){
  portal = { obj: o, openT: nowT, closeT: -1 };
  dwellObj = null;
}
function closePortal(){
  if (portal && portal.closeT < 0) portal.closeT = nowT;
}

/* ---------- canvas / viewport ---------- */
var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");
var W = 0, H = 0, PHONE = false;

function resize(){
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.max(50, Math.round(w)); H = Math.max(50, Math.round(h));
  cv.width = W; cv.height = H;
  PHONE = false;
  if (window.screen && Math.min(window.screen.width, window.screen.height) < 700) PHONE = true;
  if (!PHONE && H > W * 1.15) PHONE = true;
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
window.addEventListener("resize", resize);
resize();

/* ---------- palette ---------- */
var BG = "#1C1A17", INK = "#E8DFD0", GOLD = "#D9A441", BONE = "#F0EAD8",
    SILVER = "#B8C4CC", BRASS = "#A87F3F", LEAF = "#6B7F4E", SHEEN = "#23201B";

/* ---------- glyphs: flat ink, drawn centered at origin, box size s ---------- */
function gEclipse(s){
  ctx.strokeRect(-0.36*s, -0.46*s, 0.72*s, 0.92*s);
  ctx.beginPath(); ctx.arc(0, -0.06*s, 0.25*s, 0, 6.2832);
  ctx.fillStyle = SILVER; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0.11*s, -0.09*s, 0.225*s, 0, 6.2832);
  ctx.fillStyle = BG; ctx.fill();
  ctx.beginPath(); ctx.arc(-0.30*s, 0.28*s, 0.018*s, 0, 6.2832); ctx.fillStyle = INK; ctx.fill();
  ctx.beginPath(); ctx.arc(0.26*s, 0.33*s, 0.014*s, 0, 6.2832); ctx.fill();
}
function gFork(s){
  ctx.strokeStyle = BRASS;
  ctx.beginPath(); ctx.moveTo(0, 0.48*s); ctx.lineTo(0, -0.10*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-0.19*s, -0.10*s); ctx.lineTo(0.19*s, -0.10*s); ctx.stroke();
  var tx = [-0.19, -0.065, 0.065, 0.19];
  for (var i = 0; i < 4; i++){
    ctx.beginPath(); ctx.moveTo(tx[i]*s, -0.10*s); ctx.lineTo(tx[i]*s, -0.48*s); ctx.stroke();
  }
  ctx.strokeStyle = INK;
}
function gCoin(s){
  ctx.beginPath(); ctx.arc(0, 0, 0.36*s, 0, 6.2832); ctx.stroke();
  ctx.globalAlpha *= 0.45;
  ctx.beginPath(); ctx.arc(0, 0, 0.285*s, 0, 6.2832); ctx.stroke();
  ctx.globalAlpha /= 0.45;
  ctx.beginPath(); ctx.arc(0.06*s, -0.03*s, 0.13*s, 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-0.06*s, 0.16*s); ctx.lineTo(0.10*s, 0.10*s); ctx.stroke();
}
function gKey(s){
  ctx.beginPath(); ctx.arc(-0.24*s, 0, 0.17*s, 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-0.07*s, 0); ctx.lineTo(0.44*s, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.30*s, 0); ctx.lineTo(0.30*s, 0.18*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.44*s, 0); ctx.lineTo(0.44*s, 0.26*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.44*s, 0.13*s); ctx.lineTo(0.36*s, 0.13*s); ctx.stroke();
}
function gLeaf(s){
  ctx.beginPath();
  ctx.moveTo(0, -0.48*s);
  ctx.quadraticCurveTo(0.36*s, -0.08*s, 0, 0.48*s);
  ctx.quadraticCurveTo(-0.36*s, -0.08*s, 0, -0.48*s);
  ctx.fillStyle = LEAF; ctx.globalAlpha *= 0.8; ctx.fill(); ctx.globalAlpha /= 0.8;
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0.50*s); ctx.lineTo(0, -0.42*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0.10*s); ctx.lineTo(0.16*s, -0.08*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -0.12*s); ctx.lineTo(-0.17*s, -0.28*s); ctx.stroke();
}
function gRecord(s){
  ctx.beginPath(); ctx.arc(0, 0, 0.40*s, 0, 6.2832);
  ctx.fillStyle = "#100E0C"; ctx.fill(); ctx.stroke();
  ctx.globalAlpha *= 0.4;
  ctx.beginPath(); ctx.arc(0, 0, 0.31*s, 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 0.235*s, 0, 6.2832); ctx.stroke();
  ctx.globalAlpha /= 0.4;
  ctx.beginPath(); ctx.arc(0, 0, 0.10*s, 0, 6.2832); ctx.fillStyle = GOLD; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, 0.022*s, 0, 6.2832); ctx.fillStyle = BG; ctx.fill();
}
function gMarble(s){
  ctx.beginPath(); ctx.arc(0, 0, 0.21*s, 0, 6.2832);
  ctx.fillStyle = SILVER; ctx.globalAlpha *= 0.45; ctx.fill(); ctx.globalAlpha /= 0.45;
  ctx.stroke();
  ctx.beginPath(); ctx.arc(0.02*s, 0.01*s, 0.12*s, 0.6, 4.4); ctx.stroke();
  ctx.beginPath(); ctx.arc(-0.07*s, -0.08*s, 0.032*s, 0, 6.2832); ctx.fillStyle = INK; ctx.fill();
}
function gPostcard(s){
  ctx.strokeRect(-0.44*s, -0.29*s, 0.88*s, 0.58*s);
  ctx.strokeRect(0.24*s, -0.23*s, 0.15*s, 0.17*s);
  ctx.beginPath(); ctx.arc(0.315*s, -0.145*s, 0.032*s, 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.06*s, -0.20*s); ctx.lineTo(0.06*s, 0.20*s);
  ctx.globalAlpha *= 0.4; ctx.stroke(); ctx.globalAlpha /= 0.4;
  for (var r = 0; r < 2; r++){
    var y = (-0.06 + r * 0.15) * s;
    ctx.beginPath();
    for (var x = -0.38; x <= -0.12; x += 0.05){
      var yy = y + Math.sin((x + 0.38) * 22 + r * 2.0) * 0.018 * s;
      if (x === -0.38) ctx.moveTo(x*s, yy); else ctx.lineTo(x*s, yy);
    }
    ctx.stroke();
  }
}
function gButton(s){
  ctx.beginPath(); ctx.arc(0, 0, 0.27*s, 0, 6.2832);
  ctx.fillStyle = "#A68B5B"; ctx.globalAlpha *= 0.35; ctx.fill(); ctx.globalAlpha /= 0.35;
  ctx.stroke();
  ctx.globalAlpha *= 0.45;
  ctx.beginPath(); ctx.arc(0, 0, 0.195*s, 0, 6.2832); ctx.stroke();
  ctx.globalAlpha /= 0.45;
  var hp = [[-0.07,-0.07],[0.07,-0.07],[-0.07,0.07],[0.07,0.07]];
  ctx.fillStyle = INK;
  for (var i = 0; i < 4; i++){
    ctx.beginPath(); ctx.arc(hp[i][0]*s, hp[i][1]*s, 0.030*s, 0, 6.2832); ctx.fill();
  }
}
function gTicket(s){
  ctx.strokeRect(-0.45*s, -0.23*s, 0.90*s, 0.46*s);
  for (var d = 0; d < 5; d++){
    var y = (-0.18 + d * 0.09) * s;
    ctx.beginPath(); ctx.moveTo(0.26*s, y); ctx.lineTo(0.26*s, y + 0.045*s); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(-0.22*s, 0, 0.055*s, 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-0.38*s, 0.10*s); ctx.lineTo(0.12*s, 0.10*s);
  ctx.globalAlpha *= 0.5; ctx.stroke(); ctx.globalAlpha /= 0.5;
}
function gShell(s){
  ctx.beginPath(); ctx.arc(0, 0.06*s, 0.40*s, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-0.40*s, 0.10*s); ctx.lineTo(0, 0.42*s); ctx.lineTo(0.40*s, 0.10*s); ctx.stroke();
  var fa = [-0.30, -0.15, 0, 0.15, 0.30];
  for (var i = 0; i < 5; i++){
    ctx.beginPath(); ctx.moveTo(0, 0.42*s);
    ctx.lineTo(fa[i]*s, (0.06 - Math.cos(fa[i] * 2.4) * 0.30)*s); ctx.stroke();
  }
}
function gThimble(s){
  ctx.beginPath();
  ctx.moveTo(-0.27*s, 0.34*s);
  ctx.quadraticCurveTo(-0.27*s, -0.34*s, 0, -0.36*s);
  ctx.quadraticCurveTo(0.27*s, -0.34*s, 0.27*s, 0.34*s);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-0.29*s, 0.34*s); ctx.lineTo(0.29*s, 0.34*s); ctx.stroke();
  ctx.fillStyle = INK;
  for (var r = 0; r < 3; r++) for (var c = 0; c < 4; c++){
    ctx.beginPath();
    ctx.arc((-0.15 + c * 0.10 + (r % 2) * 0.05)*s, (-0.16 + r * 0.15)*s, 0.020*s, 0, 6.2832);
    ctx.fill();
  }
}
function gStamp(s){
  ctx.strokeRect(-0.27*s, -0.32*s, 0.54*s, 0.64*s);
  ctx.strokeRect(-0.20*s, -0.25*s, 0.40*s, 0.50*s);
  ctx.beginPath(); ctx.moveTo(-0.20*s, 0.12*s); ctx.lineTo(-0.06*s, -0.08*s);
  ctx.lineTo(0.03*s, 0.02*s); ctx.lineTo(0.12*s, -0.12*s); ctx.lineTo(0.20*s, 0.12*s); ctx.stroke();
  ctx.beginPath(); ctx.arc(0.10*s, -0.16*s, 0.035*s, 0, 6.2832); ctx.fillStyle = GOLD; ctx.fill();
}
function gFeather(s){
  ctx.beginPath();
  ctx.moveTo(0, 0.48*s);
  ctx.quadraticCurveTo(0.10*s, 0, 0.02*s, -0.48*s);
  ctx.stroke();
  for (var i = 0; i < 6; i++){
    var yy = (0.30 - i * 0.12) * s;
    ctx.beginPath(); ctx.moveTo(0.045*s, yy); ctx.lineTo(0.30*s, yy - 0.10*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0.045*s, yy); ctx.lineTo(-0.26*s, yy - 0.08*s); ctx.stroke();
  }
}
var GLYPH = { eclipse: gEclipse, fork: gFork, coin: gCoin, key: gKey, leaf: gLeaf,
              record: gRecord, marble: gMarble, postcard: gPostcard, button: gButton,
              ticket: gTicket, shell: gShell, thimble: gThimble, stamp: gStamp, feather: gFeather };

/* test hook: ?portal=N forces object N's portal open, mid-story at frame one */
var FORCE = -1, FM = /[?&]portal=(\d+)/.exec(location.search || "");
if (FM) FORCE = parseInt(FM[1], 10);
if (FORCE >= 0 && FORCE < objects.length){
  portal = { obj: objects[FORCE], openT: T0 - 10.4, closeT: -1 };
}

/* ---------- draw ---------- */
function drawField(t, gs){
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = SHEEN; ctx.fillRect(0, H * 0.78, W, H * 0.22);
  ctx.fillStyle = INK; ctx.globalAlpha = 0.07; ctx.fillRect(0, H * 0.78, W, 1); ctx.globalAlpha = 1;

  for (var i = 0; i < objects.length; i++){
    var o = objects[i];
    var x = o.fx * W, y = o.fy * H;
    var aIn = clamp((t - o.born) / 1.0, 0, 1);
    if (aIn <= 0) continue;
    var pulse = Math.sin(6.2832 * t / 5.2 + o.phase);
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = aIn;
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = Math.max(1.2, gs * 0.020);
    ctx.globalAlpha = aIn * (0.34 + 0.24 * pulse);
    ctx.beginPath(); ctx.arc(0, 0, gs * 0.62 * (1.10 + 0.10 * pulse), 0, 6.2832); ctx.stroke();
    if (dwellObj === o && !portal){
      var dp = clamp((t - dwellStart) / 2, 0, 1);
      ctx.globalAlpha = aIn * 0.9;
      ctx.lineWidth = Math.max(2, gs * 0.045);
      ctx.beginPath(); ctx.arc(0, 0, gs * 0.62 * 1.22, -Math.PI / 2, -Math.PI / 2 + dp * 6.2832); ctx.stroke();
    }
    ctx.globalAlpha = aIn;
    ctx.strokeStyle = INK; ctx.fillStyle = INK;
    ctx.lineWidth = Math.max(1.2, gs * 0.045);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    GLYPH[o.type](gs);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function draw(t){
  cv.style.width = W + "px"; cv.style.height = H + "px";
  var unit = Math.min(W, H);
  var gs = unit * (PHONE ? 0.13 : 0.11);

  drawField(t, gs);
  if (!portal) return;

  var o = portal.obj;
  var storyStart = portal.openT + 0.8;
  var dark = 0, ringR = 0, ringX = o.fx * W, ringY = o.fy * H;
  if (portal.closeT >= 0){
    dark = 0.97 * (1 - clamp((t - portal.closeT) / 0.6, 0, 1));
  } else if (t < storyStart){
    var q = clamp((t - portal.openT) / 0.8, 0, 1);
    dark = 0.97 * q;
    ringR = gs * 0.62 + (Math.max(W, H) * 0.75 - gs * 0.62) * (1 - Math.pow(1 - q, 3));
  } else {
    dark = 0.97;
  }
  if (dark <= 0) return;

  ctx.fillStyle = "#14120F";
  ctx.globalAlpha = dark;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  if (ringR > 0){
    ctx.strokeStyle = GOLD; ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.85 * clamp((t - portal.openT) / 0.8, 0, 1);
    ctx.beginPath(); ctx.arc(ringX, ringY, ringR, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
    return;
  }
  if (t < storyStart) return;

  var fadeAll = (portal.closeT >= 0) ? clamp(1 - (t - portal.closeT) / 0.6, 0, 1) : 1;

  /* the object, redrawn large, drifting */
  var bs = unit * 0.34;
  var cx = W * 0.5 + 5 * Math.sin(t * 0.40 + 1.0);
  var cy = H * 0.34 + 4 * Math.sin(t * 0.31);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(0.05 * Math.sin(t * 0.23 + o.phase));
  ctx.globalAlpha = fadeAll;
  ctx.strokeStyle = GOLD; ctx.lineWidth = 1.4;
  ctx.globalAlpha = fadeAll * 0.5;
  ctx.beginPath(); ctx.arc(0, 0, bs * 0.62, 0, 6.2832); ctx.stroke();
  ctx.globalAlpha = fadeAll;
  ctx.strokeStyle = INK; ctx.fillStyle = INK;
  ctx.lineWidth = Math.max(1.4, bs * 0.045);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  GLYPH[o.type](bs);
  ctx.restore();

  /* the story, one phrase at a time */
  var phrases = o.story;
  var fs = Math.round(unit * (PHONE ? 0.046 : 0.040));
  ctx.font = fs + "px 'Courier New', monospace";
  var maxw = 0;
  for (var i = 0; i < phrases.length; i++) maxw = Math.max(maxw, ctx.measureText(phrases[i]).width);
  if (maxw > W * 0.88){ fs = Math.floor(fs * (W * 0.88) / maxw); ctx.font = fs + "px 'Courier New', monospace"; }
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  var lh = fs * 1.55;
  var topY = H * 0.62;
  ctx.fillStyle = BONE;
  for (var p = 0; p < phrases.length; p++){
    var pa = clamp((t - (storyStart + p * 2.2)) / 0.5, 0, 1);
    if (pa <= 0) continue;
    ctx.globalAlpha = pa * fadeAll;
    ctx.fillText(phrases[p], W * 0.5, topY + p * lh + (1 - pa) * 4);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}

/* ---------- loop ---------- */
function tick(stamp){
  if (lastStamp < 0) lastStamp = stamp;
  baseClock += (stamp - lastStamp) / 1000;
  lastStamp = stamp;
  nowT = baseClock;

  /* linger: pointer resting inside an object's ring opens its portal */
  if (!portal && !dragging && ptr.inside){
    var gr = Math.min(W, H) * 0.11 * 0.78;
    var hov = hitObj(ptr.x, ptr.y, gr);
    if (hov){
      if (dwellObj !== hov){ dwellObj = hov; dwellStart = nowT; }
      else if (nowT - dwellStart >= 2) openPortal(hov);
    } else dwellObj = null;
  } else if (!portal) dwellObj = null;

  /* a story closes itself 3s after its last phrase lands */
  if (portal && portal.closeT < 0){
    var endT = portal.openT + 0.8 + portal.obj.story.length * 2.2 + 3.0;
    if (nowT >= endT) portal.closeT = nowT;
  }
  if (portal && portal.closeT >= 0 && nowT - portal.closeT >= 0.6) portal = null;

  draw(nowT);
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(tick);
}

/* ---------- pointer: hold = portal, drag = move, tap = contribute / close ---------- */
function pt(e){ return [e.clientX, e.clientY]; }
cv.addEventListener("pointerdown", function(e){
  var p = pt(e);
  ptr.x = p[0]; ptr.y = p[1]; ptr.inside = true; ptr.down = true;
  downX = p[0]; downY = p[1]; downClock = nowT; dragMoved = false; pressOpened = false;
  var gr = Math.min(W, H) * 0.11 * 0.78;
  downObj = portal ? null : hitObj(p[0], p[1], gr);
  dragging = null;
});
cv.addEventListener("pointermove", function(e){
  var p = pt(e);
  ptr.x = p[0]; ptr.y = p[1]; ptr.inside = true;
  if (portal && portal.obj === dwellObj) pressOpened = true;
  if (ptr.down && downObj && !portal){
    if (Math.abs(p[0] - downX) > 12 || Math.abs(p[1] - downY) > 12) dragging = downObj;
    if (dragging){
      dragMoved = true;
      dragging.fx = clamp(p[0] / W, 0.05, 0.95);
      dragging.fy = clamp(p[1] / H, 0.06, 0.94);
      dwellObj = null;
    }
  }
});
cv.addEventListener("pointerup", function(e){
  var p = pt(e);
  var wasDrag = dragMoved;
  ptr.down = false; dragging = null; downObj = null; dragMoved = false;
  if (wasDrag || pressOpened) return;
  if (nowT - downClock < 0.35 && Math.abs(p[0] - downX) < 8 && Math.abs(p[1] - downY) < 8){
    /* a tap */
    if (portal){ closePortal(); return; }
    var gr = Math.min(W, H) * 0.11 * 0.78;
    if (!hitObj(p[0], p[1], gr) && objects.length < MAXOBJ){
      var type = EXT[contribCount % EXT.length];
      objects.push({
        type: type,
        fx: clamp(p[0] / W, 0.05, 0.95), fy: clamp(p[1] / H, 0.06, 0.94),
        story: genStory(contribCount, type),
        phase: hash(3400 + contribCount * 29) * 6.2832,
        born: nowT, contrib: true
      });
      contribCount++;
    }
  }
});
cv.addEventListener("pointerleave", function(){
  ptr.inside = false; ptr.down = false; dragging = null; dwellObj = null;
});

/* synchronous first frame at the fixed phase, then the loop */
draw(T0);
if (typeof requestAnimationFrame === "function") requestAnimationFrame(tick);
})();
</script>
