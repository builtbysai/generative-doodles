<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Eleven and Thirteen</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4F1E8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  build();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function cross(ax, ay, bx, by) { return ax * by - ay * bx; }
function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ---- the mixed odd-fold field ---------------------------------------
// Eleven-point and thirteen-point stars share one nonsystematic
// field, hand-placed so no rectangular repeat can be found in it.
// Every star is drawn from Bonner's two-point construction: on
// each edge of the underlying polygon sit two contact points,
// symmetric about the midpoint, and the star's inner radius is set
// by their separation. The single parameter delta is that
// separation, scrubbed by dragging: negative delta spreads the
// points and the stars go blunt, positive draws them together
// and the stars sharpen, and the straps that join the stars
// re-route because their endpoints ride on the contact points.
var LAYOUT = [
  // fx, fy, radius (of min dimension), points, accent
  [0.15, 0.20, 0.115, 11], [0.55, 0.15, 0.095, 11], [0.87, 0.40, 0.120, 11],
  [0.36, 0.50, 0.100, 11], [0.70, 0.76, 0.115, 11], [0.13, 0.78, 0.090, 11],
  [0.38, 0.28, 0.100, 13], [0.76, 0.18, 0.105, 13], [0.16, 0.50, 0.105, 13],
  [0.60, 0.44, 0.125, 13], [0.89, 0.72, 0.095, 13], [0.40, 0.80, 0.110, 13]
];
var LAYOUT_P = [   // portrait: the same constellations re-dealt for a tall frame
  [0.22, 0.10, 0.130, 11], [0.72, 0.24, 0.115, 11], [0.25, 0.42, 0.120, 11],
  [0.75, 0.56, 0.125, 11], [0.22, 0.72, 0.115, 11], [0.70, 0.88, 0.120, 11],
  [0.74, 0.09, 0.120, 13], [0.26, 0.25, 0.125, 13], [0.72, 0.40, 0.110, 13],
  [0.24, 0.57, 0.120, 13], [0.74, 0.71, 0.115, 13], [0.28, 0.87, 0.110, 13]
];
var ACCENT = { 11: '#B03A2E', 13: '#1E3A5F' };
var stars = [], pairs = [];
var delta = 0.15, deltaTarget = 0.15, weaveReady = false, crossings = [];

function build() {
  stars = []; pairs = [];
  if (!W || !H) return;
  var m = Math.min(W, H);
  (PHONE ? LAYOUT_P : LAYOUT).forEach(function (s, i) {
    stars.push({ cx: s[0] * W, cy: s[1] * H, R: s[2] * m, n: s[3],
                 rot: -Math.PI / 2 + (hash(i * 7 + 2) - 0.5) * 0.35 });
  });
  stars.forEach(function (a, i) {
    stars.forEach(function (b, j) {
      if (j <= i) return;
      var d = Math.hypot(a.cx - b.cx, a.cy - b.cy);
      if (d < (a.R + b.R) * 2.55) pairs.push([i, j]);
    });
  });
  weaveReady = false;
}

function outlinePts(st, dl) {
  var q = 0.60 - 0.30 * dl;
  var rot = st.rot + dl * 0.10, pts = [], k, ang, rad;
  for (k = 0; k < 2 * st.n; k++) {
    ang = rot + k * Math.PI / st.n;
    rad = (k % 2 === 0) ? st.R : st.R * q;
    pts.push([st.cx + Math.cos(ang) * rad, st.cy + Math.sin(ang) * rad]);
  }
  return pts;
}
function radiusAt(pts, cx, cy, ang) {
  var dx = Math.cos(ang), dy = Math.sin(ang), best = Infinity, i, A, B, ex, ey, den, u, v;
  for (i = 0; i < pts.length; i++) {
    A = pts[i]; B = pts[(i + 1) % pts.length];
    ex = B[0] - A[0]; ey = B[1] - A[1];
    den = cross(dx, dy, ex, ey);
    if (Math.abs(den) < 1e-9) continue;
    u = cross(A[0] - cx, A[1] - cy, ex, ey) / den;
    v = cross(A[0] - cx, A[1] - cy, dx, dy) / den;
    if (u > 1e-6 && v >= -1e-9 && v <= 1 + 1e-9 && u < best) best = u;
  }
  return best;
}
// the straps, as segments between contact points on the two stars
function strapSegs(dl) {
  var outlines = stars.map(function (st) { return outlinePts(st, dl); });
  return pairs.map(function (pr) {
    var A = stars[pr[0]], B = stars[pr[1]];
    var ab = Math.atan2(B.cy - A.cy, B.cx - A.cx);
    var aAng = ab + dl * 0.45, bAng = ab + Math.PI - dl * 0.45;
    var ra = radiusAt(outlines[pr[0]], A.cx, A.cy, aAng) - 3;
    var rb = radiusAt(outlines[pr[1]], B.cx, B.cy, bAng) - 3;
    return { x1: A.cx + Math.cos(aAng) * ra, y1: A.cy + Math.sin(aAng) * ra,
             x2: B.cx + Math.cos(bAng) * rb, y2: B.cy + Math.sin(bAng) * rb,
             a: pr[0], b: pr[1], cross: [] };
  });
}
function segLen(s) { return Math.hypot(s.x2 - s.x1, s.y2 - s.y1); }
// the weave is computed once the field settles: crossings ordered
// along each strap, over/under alternating along the strand
function computeWeave(segs) {
  crossings = [];
  segs.forEach(function (s, si) { s.cross = []; });
  for (var i = 0; i < segs.length; i++) for (var j = i + 1; j < segs.length; j++) {
    var s1 = segs[i], s2 = segs[j];
    if (s1.a === s2.a || s1.a === s2.b || s1.b === s2.a || s1.b === s2.b) continue;
    var d1x = s1.x2 - s1.x1, d1y = s1.y2 - s1.y1;
    var d2x = s2.x2 - s2.x1, d2y = s2.y2 - s2.y1;
    var den = cross(d1x, d1y, d2x, d2y);
    if (Math.abs(den) < 1e-9) continue;
    var u = cross(s2.x1 - s1.x1, s2.y1 - s1.y1, d2x, d2y) / den;
    var v = cross(s2.x1 - s1.x1, s2.y1 - s1.y1, d1x, d1y) / den;
    if (u > 0.04 && u < 0.96 && v > 0.04 && v < 0.96) {
      var ci = crossings.length;
      crossings.push({ a: i, b: j, ua: u, ub: v });
      s1.cross.push(ci); s2.cross.push(ci);
    }
  }
  segs.forEach(function (s, si) {
    var arr = s.cross.map(function (ci) {
      var c = crossings[ci];
      return { ci: ci, u: (c.a === si) ? c.ua : c.ub };
    });
    arr.sort(function (p, q) { return p.u - q.u; });
    arr.forEach(function (e, ord) {
      if (crossings[e.ci].a === si) crossings[e.ci].ordA = ord;
      else crossings[e.ci].ordB = ord;
    });
  });
  crossings.forEach(function (c) {
    var aOver = (c.ordA % 2 === 0), bOver = (c.ordB % 2 === 0);
    c.overA = (aOver === bOver) ? true : aOver;
  });
}
function strokeRange(s, a, b) {
  var len = segLen(s);
  if (len === 0 || b - a <= 0.01) return;
  var ux = (s.x2 - s.x1) / len, uy = (s.y2 - s.y1) / len;
  ctx.beginPath();
  ctx.moveTo(s.x1 + ux * a, s.y1 + uy * a);
  ctx.lineTo(s.x1 + ux * b, s.y1 + uy * b);
  ctx.stroke();
}

function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#F4F1E8'; ctx.fillRect(0, 0, W, H);
  if (!stars.length) return;
  // ease toward the scrubbed offset; the field settles, no throw
  delta += (deltaTarget - delta) * 0.16;
  if (!dragging && Math.abs(deltaTarget - delta) < 0.0025) {
    delta = deltaTarget;
    if (!weaveReady) { computeWeave(strapSegs(delta)); weaveReady = true; }
  }
  var segs = strapSegs(delta);
  var lw = Math.max(6, Math.min(W, H) * 0.016);
  ctx.strokeStyle = '#1A1A1A';
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  if (weaveReady) {
    var gapHalf = lw * 0.62;
    segs.forEach(function (s, si) {
      // crossings from the settled computation ride on strap index
      var settled = strapSegsCached[si];
      var len = segLen(s), blocked = [];
      settled.cross.forEach(function (ci) {
        var c = crossings[ci];
        var under = c.overA ? segs[c.b] : segs[c.a];
        if (under !== s) return;
        var u = (c.a === si) ? c.ua : c.ub;
        blocked.push([u * len - gapHalf, u * len + gapHalf]);
      });
      blocked.sort(function (p, q) { return p[0] - q[0]; });
      var cur = 0;
      blocked.forEach(function (iv) {
        if (iv[0] > cur) strokeRange(s, cur, Math.min(iv[0], len));
        cur = Math.max(cur, iv[1]);
      });
      if (cur < len) strokeRange(s, cur, len);
    });
    crossings.forEach(function (c) {
      var over = segs[c.overA ? c.a : c.b];
      var len = segLen(over);
      var u = (c.overA ? c.ua : c.ub) * len;
      strokeRange(over, u - gapHalf * 1.35, u + gapHalf * 1.35);
    });
  } else {
    segs.forEach(function (s) {
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    });
  }
  // the stars, paper-filled over the straps
  stars.forEach(function (st) {
    var pts = outlinePts(st, delta);
    ctx.beginPath();
    pts.forEach(function (p, k) { if (k === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
    ctx.closePath();
    ctx.fillStyle = '#F4F1E8';
    ctx.fill();
    ctx.strokeStyle = '#1A1A1A';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    // the inner star, in the star's own accent ink
    var q = 0.60 - 0.30 * delta, rot = st.rot + delta * 0.10;
    ctx.beginPath();
    for (var k = 0; k < 2 * st.n; k++) {
      var ang = rot + k * Math.PI / st.n;
      var rad = ((k % 2 === 0) ? st.R : st.R * q) * 0.55;
      var x = st.cx + Math.cos(ang) * rad, y = st.cy + Math.sin(ang) * rad;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = ACCENT[st.n];
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = ACCENT[st.n];
    ctx.beginPath(); ctx.arc(st.cx, st.cy, 3, 0, Math.PI * 2); ctx.fill();
  });
  // hint
  ctx.fillStyle = 'rgba(26,26,26,0.5)';
  ctx.font = '12.5px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('drag to scrub the contact offset', W / 2, H - 16);
}

// strapSegs output cached alongside each settle for weave lookup
var strapSegsCached = [];
var _computeWeave = computeWeave;
computeWeave = function (segs) { strapSegsCached = segs; _computeWeave(segs); };

var dragging = false, startX = 0, startTarget = 0;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; startX = e.clientX; startTarget = deltaTarget;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  deltaTarget = clamp(startTarget + (e.clientX - startX) / (0.5 * Math.min(W, H)), -1, 1);
  weaveReady = false;
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('pointerup', endDrag);

resize();
draw(0);
function frame(ts) {
  draw(ts || 0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
