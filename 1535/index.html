<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gravel Walk</title>
<style>
  html, body { margin: 0; padding: 0; background: #26221e; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var LOOP = 120;
  var SEED = 1535000;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(SEED);
  function a4(v) { return Math.round(v * 10000) / 10000; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(w) { w = clamp(w, 0, 1); return w * w * (3 - 2 * w); }
  function mod(v, m) { var r = v % m; return r < 0 ? r + m : r; }

  // ---- field geometry -------------------------------------------------
  var W = 720, H = 720, fieldX = 0, fieldY = 0, fieldW = 720, fieldH = 720;
  var phone = false;
  function size() {
    var vw = 720, vh = 720;
    if (typeof window !== 'undefined') {
      if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
      else if (window.innerWidth) { vw = window.innerWidth; vh = window.innerHeight; }
    }
    W = vw; H = vh;
    var minDim = 1e9;
    if (typeof window !== 'undefined' && window.screen) {
      minDim = Math.min(window.screen.width, window.screen.height);
    }
    phone = (minDim < 700) || (H > W * 1.15 && minDim >= 700);
    if (phone) { fieldX = 0; fieldY = 0; fieldW = W; fieldH = H; }
    else {
      var side = Math.min(W, H);
      fieldX = (W - side) / 2; fieldY = (H - side) / 2; fieldW = side; fieldH = side;
    }
    canvas.width = W; canvas.height = H;
  }

  // ---- gravel objects (field fractions, seeded) -----------------------
  var MUTED = ['#4a453c', '#5a5348', '#3a352e'];
  var patches = [];
  for (var p = 0; p < 6; p++) {
    patches.push({ x: 0.12 + rand() * 0.76, y: 0.12 + rand() * 0.76 });
  }
  var objects = [];
  for (var i = 0; i < 150; i++) {
    var o;
    if (rand() < 0.7) {
      var pc = patches[Math.floor(rand() * patches.length)];
      var gx = (rand() + rand() + rand() - 1.5) * 0.16;
      var gy = (rand() + rand() + rand() - 1.5) * 0.16;
      o = { x: clamp(pc.x + gx, 0.05, 0.95), y: clamp(pc.y + gy, 0.05, 0.95) };
    } else {
      o = { x: 0.05 + rand() * 0.9, y: 0.05 + rand() * 0.9 };
    }
    o.type = Math.floor(rand() * 4); // 0 pebble, 1 disc, 2 line, 3 ring
    o.color = MUTED[Math.floor(rand() * MUTED.length)];
    o.s = 0.008 + rand() * 0.009;
    o.rot = rand() * Math.PI;
    objects.push(o);
  }

  // ---- wanderer path: summed sines, whole cycles over PATH_SPAN ------
  var PAUSES = [[20, 26], [55, 61], [90, 97]];
  var TOTAL_PAUSE = 0;
  for (var pi = 0; pi < PAUSES.length; pi++) TOTAL_PAUSE += PAUSES[pi][1] - PAUSES[pi][0];
  var PATH_SPAN = LOOP - TOTAL_PAUSE; // 101
  var PX = { a: [0.26, 0.10, 0.05], c: [1, 2, 3], p: [0.7, 2.1, 4.4] };
  var PY = { a: [0.20, 0.08, 0.04], c: [2, 3, 5], p: [1.3, 3.7, 0.2] };
  function sOf(u) {
    var s = u;
    for (var k = 0; k < PAUSES.length; k++) {
      var ps = PAUSES[k][0], pe = PAUSES[k][1];
      if (u > ps) s -= Math.min(u, pe) - ps;
    }
    return s;
  }
  function basePos(t) {
    var u = mod(t, LOOP);
    var s = sOf(u);
    var x = 0.5, y = 0.5;
    for (var k = 0; k < 3; k++) {
      x += PX.a[k] * Math.sin(2 * Math.PI * PX.c[k] * s / PATH_SPAN + PX.p[k]);
      y += PY.a[k] * Math.sin(2 * Math.PI * PY.c[k] * s / PATH_SPAN + PY.p[k]);
    }
    return { x: clamp(x, 0.08, 0.92), y: clamp(y, 0.08, 0.92) };
  }

  // ---- drag sessions (recorded events, closed-form) ------------------
  var sessions = [];
  var lastT = 0;
  function pointerAt(sess, t) {
    var pt = sess.pts[0];
    for (var i = 0; i < sess.pts.length; i++) {
      if (sess.pts[i].t <= t) pt = sess.pts[i]; else break;
    }
    return pt;
  }
  function dispPos(t) {
    var base = basePos(t);
    var sess = null;
    for (var i = sessions.length - 1; i >= 0; i--) {
      if (sessions[i].t0 <= t) { sess = sessions[i]; break; }
    }
    if (!sess) return base;
    if (sess.t1 === null || t <= sess.t1) {
      // dragging: ease from path position at grab to the pointer over the
      // session's duration (distance-scaled, so the wanderer wanders there
      // at a capped pace instead of gliding), then follow it
      var w = smooth((t - sess.t0) / sess.dur);
      var start = basePos(sess.t0);
      var pt = pointerAt(sess, t);
      return { x: start.x + (pt.x - start.x) * w, y: start.y + (pt.y - start.y) * w };
    }
    if (t - sess.t1 < 1.5) {
      // release: ease back to the scheduled path over 1.5 s
      var w2 = smooth((t - sess.t1) / 1.5);
      var rel = pointerAt(sess, sess.t1);
      return { x: rel.x + (base.x - rel.x) * w2, y: rel.y + (base.y - rel.y) * w2 };
    }
    return base;
  }
  function draggingAt(t) {
    for (var i = sessions.length - 1; i >= 0; i--) {
      if (sessions[i].t0 <= t && (sessions[i].t1 === null || t <= sessions[i].t1)) return sessions[i];
    }
    return null;
  }

  // ---- glow: closed-form over past displayed positions ---------------
  var GLOW_R = 0.10, HIST_N = 20, HIST_DT = 0.5;
  function glowOf(obj, t) {
    var g = 0;
    for (var k = 0; k <= HIST_N; k++) {
      var pk = dispPos(t - k * HIST_DT);
      var dx = obj.x - pk.x, dy = obj.y - pk.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var bump = Math.max(0, 1 - d / GLOW_R);
      // Slow decay (6 s scale): light lingers behind the wanderer, so some
      // object always carries light and the field is never fully dark.
      var w = Math.exp(-0.5 * k / 6);
      if (bump * w > g) g = bump * w;
    }
    var sess = draggingAt(t);
    if (sess) {
      var pt = pointerAt(sess, t);
      var dx2 = obj.x - pt.x, dy2 = obj.y - pt.y;
      var d2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
      var bump2 = Math.max(0, 1 - d2 / GLOW_R) * 0.9;
      if (bump2 > g) g = bump2;
    }
    return g;
  }

  // ---- pointer input --------------------------------------------------
  function toFrac(e) {
    size();
    return { x: (e.clientX - fieldX) / fieldW, y: (e.clientY - fieldY) / fieldH };
  }
  function onDown(e) {
    var f = toFrac(e);
    var start = basePos(lastT);
    var d0 = Math.sqrt((f.x - start.x) * (f.x - start.x) + (f.y - start.y) * (f.y - start.y));
    var dur = clamp(d0 / 0.12, 0.8, 6);
    sessions.push({ t0: lastT, t1: null, dur: dur, pts: [{ t: lastT, x: f.x, y: f.y }] });
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    var sess = sessions.length ? sessions[sessions.length - 1] : null;
    if (sess && sess.t1 === null) {
      var f = toFrac(e);
      sess.pts.push({ t: lastT, x: f.x, y: f.y });
    }
  }
  function onUp() {
    var sess = sessions.length ? sessions[sessions.length - 1] : null;
    if (sess && sess.t1 === null) sess.t1 = lastT;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', size);
    }
    if (window.addEventListener) window.addEventListener('resize', size);
  }

  // ---- draw -----------------------------------------------------------
  function draw(t) {
    size();
    lastT = t;
    var unit = Math.min(fieldW, fieldH);
    ctx.fillStyle = '#26221e';
    ctx.fillRect(0, 0, W, H);

    var wp = dispPos(t);
    var wx = fieldX + wp.x * fieldW, wy = fieldY + wp.y * fieldH;

    // faint trail: past displayed positions, oldest faintest
    var TRAIL_N = 16, TRAIL_DT = 0.6;
    for (var k = TRAIL_N; k >= 1; k--) {
      var tp = dispPos(t - k * TRAIL_DT);
      var tx = fieldX + tp.x * fieldW, ty = fieldY + tp.y * fieldH;
      var ta = a4(0.30 * (1 - k / (TRAIL_N + 1)));
      ctx.fillStyle = 'rgba(90,83,72,' + ta + ')';
      ctx.fillRect(tx - 2, ty - 2, 4, 4);
    }

    // gravel objects: muted base, amber overlay by glow
    var hookObjs = [];
    var litCount = 0;
    for (var i = 0; i < objects.length; i++) {
      var o = objects[i];
      var ox = fieldX + o.x * fieldW, oy = fieldY + o.y * fieldH;
      var g = glowOf(o, t);
      if (g > 0.15) litCount++;
      hookObjs.push({ x: o.x, y: o.y, glow: g });
      var r = o.s * unit;
      ctx.lineCap = 'round';
      ctx.lineWidth = Math.max(1, unit * 0.004);
      if (o.type === 0) {
        ctx.save();
        ctx.translate(ox, oy);
        ctx.rotate(o.rot);
        ctx.fillStyle = o.color;
        ctx.fillRect(-r, -r * 0.6, r * 2, r * 1.2);
        ctx.restore();
      } else if (o.type === 1) {
        ctx.fillStyle = o.color;
        ctx.beginPath();
        ctx.moveTo(ox + r, oy);
        ctx.arc(ox, oy, r, 0, Math.PI * 2);
        ctx.fill();
      } else if (o.type === 2) {
        ctx.strokeStyle = o.color;
        ctx.lineWidth = Math.max(1, unit * 0.005);
        ctx.beginPath();
        ctx.moveTo(ox - Math.cos(o.rot) * r * 1.6, oy - Math.sin(o.rot) * r * 1.6);
        ctx.lineTo(ox + Math.cos(o.rot) * r * 1.6, oy + Math.sin(o.rot) * r * 1.6);
        ctx.stroke();
      } else {
        ctx.strokeStyle = o.color;
        ctx.lineWidth = Math.max(1, unit * 0.004);
        ctx.beginPath();
        ctx.moveTo(ox + r, oy);
        ctx.arc(ox, oy, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (g > 0.01) {
        ctx.fillStyle = 'rgba(232,176,75,' + a4(g * 0.85) + ')';
        ctx.beginPath();
        ctx.moveTo(ox + r * 1.3, oy);
        ctx.arc(ox, oy, r * 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // wanderer: small bone torso-line glyph
    var u2 = unit * 0.035;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(2, unit * 0.006);
    ctx.strokeStyle = '#e0d6c0';
    ctx.beginPath();
    ctx.moveTo(wx, wy - u2);
    ctx.lineTo(wx, wy + u2);
    ctx.moveTo(wx, wy - u2 * 0.6);
    ctx.lineTo(wx - u2 * 0.8, wy - u2 * 0.2);
    ctx.moveTo(wx, wy - u2 * 0.6);
    ctx.lineTo(wx + u2 * 0.8, wy - u2 * 0.2);
    ctx.moveTo(wx, wy + u2);
    ctx.lineTo(wx - u2 * 0.55, wy + u2 * 1.9);
    ctx.moveTo(wx, wy + u2);
    ctx.lineTo(wx + u2 * 0.55, wy + u2 * 1.9);
    ctx.stroke();

    if (typeof window !== 'undefined') {
      var trail = [];
      for (var k2 = 1; k2 <= TRAIL_N; k2++) {
        var tp2 = dispPos(t - k2 * TRAIL_DT);
        trail.push({ x: tp2.x, y: tp2.y, age: k2 * TRAIL_DT });
      }
      window.__t35 = {
        wanderer: { x: wp.x, y: wp.y },
        trail: trail,
        objects: hookObjs,
        litCount: litCount,
        field: { x: fieldX, y: fieldY, w: fieldW, h: fieldH }
      };
    }
  }

  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    draw((ts - startT) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
