<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reality / Delusion — №1074</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050507; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette ----------
  var VOID = '#050507';
  var REAL = '#FFFFFF';
  var DEL_A = '#C9A06B';   // warm gold-brown (delusion body)
  var DEL_B = '#8A6B45';   // deep warm brown (delusion under-glow)
  var DEL_TEX = '#E8DCC8'; // texture density (grain)
  var SHIMMER = '#F2E9D8'; // midpoint warm-white

  var LOOP = 60;           // seconds, seamless
  var LAG = 2.4;           // delusion echo delay, seconds
  var TAU = Math.PI * 2;

  // ---------- field state ----------
  var seed = 1074;
  var nodes = [];    // {bx,by, ax,ay, kx,ky, px,py}
  var segs = [];     // {a, b} node indices
  var grain = [];    // {kind:'free',x,y,r,p} | {kind:'seg',s,u,r,p}

  function buildField(s) {
    var rnd = mulberry32(s);
    nodes = []; segs = []; grain = [];
    var G = 7, i, j, idx = [];
    for (j = 0; j < G; j++) {
      idx[j] = [];
      for (i = 0; i < G; i++) {
        var bx = 0.08 + 0.84 * (i / (G - 1)) + (rnd() - 0.5) * 0.03;
        var by = 0.08 + 0.84 * (j / (G - 1)) + (rnd() - 0.5) * 0.03;
        idx[j][i] = nodes.length;
        nodes.push({
          bx: bx, by: by,
          ax: 0.006 + rnd() * 0.013, ay: 0.006 + rnd() * 0.013,
          kx: 1 + Math.floor(rnd() * 3), ky: 1 + Math.floor(rnd() * 3),
          px: rnd() * TAU, py: rnd() * TAU
        });
      }
    }
    function seg(a, b) { segs.push({ a: a, b: b }); }
    for (j = 0; j < G; j++) {
      for (i = 0; i < G; i++) {
        if (i < G - 1) seg(idx[j][i], idx[j][i + 1]);
        if (j < G - 1) seg(idx[j][i], idx[j + 1][i]);
        if (i < G - 1 && j < G - 1 && rnd() < 0.38) seg(idx[j][i], idx[j + 1][i + 1]);
        if (i > 0 && j < G - 1 && rnd() < 0.16) seg(idx[j][i], idx[j + 1][i - 1]);
      }
    }
    // star hubs: a few nodes radiate to all 8 neighbours
    var hubs = [idx[1][1], idx[2][5], idx[5][3], idx[4][1]];
    var seen = {};
    segs.forEach(function (sg) { seen[sg.a < sg.b ? sg.a + '_' + sg.b : sg.b + '_' + sg.a] = true; });
    hubs.forEach(function (h) {
      var hn = nodes[h];
      nodes.forEach(function (n, ni) {
        if (ni === h) return;
        var dx = n.bx - hn.bx, dy = n.by - hn.by;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < 0.23) {
          var k = h < ni ? h + '_' + ni : ni + '_' + h;
          if (!seen[k]) { seen[k] = true; seg(h, ni); }
        }
      });
    });
    // grain: half free-floating, half sampled along segments (texture follows the field)
    var nFree = 900, nSeg = 1050, g;
    for (g = 0; g < nFree; g++) {
      grain.push({ kind: 0, x: rnd(), y: rnd(), r: 0.5 + rnd() * 1.3, p: rnd() * TAU, a: 0.25 + rnd() * 0.75 });
    }
    for (g = 0; g < nSeg; g++) {
      grain.push({ kind: 1, s: Math.floor(rnd() * segs.length), u: rnd(), r: 0.5 + rnd() * 1.5, p: rnd() * TAU, a: 0.3 + rnd() * 0.7 });
    }
  }

  function nodeAt(n, t) {
    return [
      n.bx + n.ax * Math.sin(TAU * n.kx * t / LOOP + n.px),
      n.by + n.ay * Math.cos(TAU * n.ky * t / LOOP + n.py)
    ];
  }

  // ---------- mix control ----------
  // Breathing: closed-form, period = LOOP, mix(0) = 0.5 exactly.
  function breathe(t) { return 0.5 + 0.38 * Math.sin(TAU * t / LOOP); }

  var dragging = false;
  var dragMix = 0.5;
  var evt = null; // {t: eventTime, v: value} — set/drag-release/snap event

  function mixAt(t) {
    if (dragging) return dragMix;
    if (!evt) return breathe(t);
    var u = (t - evt.t) / 3.5; // resume blend over 3.5 s
    if (u >= 1) return breathe(t);
    if (u < 0) u = 0;
    var s = u * u * (3 - 2 * u); // smoothstep
    var v = evt.v + s * (breathe(t) - breathe(evt.t));
    if (v < 0.03) v = 0.03;
    if (v > 0.97) v = 0.97;
    return v;
  }

  // ---------- viewport ----------
  var W = 720, H = 720, DPR = 1;
  function viewport() {
    var vv = window.visualViewport;
    var w = vv && vv.width ? vv.width : window.innerWidth;
    var h = vv && vv.height ? vv.height : window.innerHeight;
    return [w, h];
  }
  function fit() {
    var v = viewport();
    W = v[0]; H = v[1];
    DPR = window.devicePixelRatio || 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  function isPhone() {
    var sw = window.screen ? window.screen.width : W;
    var sh = window.screen ? window.screen.height : H;
    return Math.min(sw, sh) < 700 || H > W * 1.15;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(tNow()); });
  }
  window.addEventListener('resize', function () { fit(); draw(tNow()); });

  // ---------- audio (lazy, gesture-only) ----------
  var AC = null, gReal = null, gDel = null;
  function initAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    var Ctor = null;
    if (typeof window !== 'undefined') Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      var master = AC.createGain(); master.gain.value = 0.06; master.connect(AC.destination);
      var osc = AC.createOscillator(); osc.type = 'sine'; osc.frequency.value = 196;
      gReal = AC.createGain(); gReal.gain.value = 0.25;
      osc.connect(gReal); gReal.connect(master); osc.start();
      var len = 2 * AC.sampleRate;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      var r = mulberry32(99);
      for (var i = 0; i < len; i++) d[i] = r() * 2 - 1;
      var noise = AC.createBufferSource(); noise.buffer = buf; noise.loop = true;
      var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 640; bp.Q.value = 0.6;
      gDel = AC.createGain(); gDel.gain.value = 0.25;
      noise.connect(bp); bp.connect(gDel); gDel.connect(master); noise.start();
    } catch (e) { AC = null; }
  }
  function updateAudio(m) {
    if (!AC || !gReal || !gDel) return;
    var t = AC.currentTime;
    gReal.gain.setTargetAtTime((1 - m) * 0.5, t, 0.1);
    gDel.gain.setTargetAtTime(m * 0.5, t, 0.1);
  }

  // ---------- time ----------
  var startStamp = null;
  function tNow() {
    if (startStamp === null) return 0;
    return (performanceNow() - startStamp) / 1000;
  }
  function performanceNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return Date.now();
  }

  // ---------- drawing ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = VOID;
    ctx.fillRect(0, 0, W, H);

    var side = Math.min(W, H) * (isPhone() ? 0.98 : 0.94);
    var ox = (W - side) / 2, oy = (H - side) / 2;
    var lw = side / 720; // line-width unit
    var m = mixAt(t);
    var wReal = 1 - m, wDel = m;
    var shimW = 1 - Math.abs(m - 0.5) * 2; // 1 at the midpoint
    var td = ((t - LAG) % LOOP + LOOP) % LOOP;

    var posR = [], posD = [], i, p;
    for (i = 0; i < nodes.length; i++) posR.push(nodeAt(nodes[i], t));
    for (i = 0; i < nodes.length; i++) posD.push(nodeAt(nodes[i], td));

    function X(u) { return ox + u * side; }
    function Y(u) { return oy + u * side; }

    ctx.lineCap = 'round';

    // ---- DELUSION pass (underneath): same geometry, delayed phase,
    // ---- layered offset copies + grain = the rich reconstructed texture
    if (wDel > 0.01) {
      ctx.strokeStyle = DEL_B;
      ctx.globalAlpha = 0.24 * wDel;
      ctx.lineWidth = 6.8 * lw;
      ctx.beginPath();
      segs.forEach(function (sg) {
        ctx.moveTo(X(posD[sg.a][0]), Y(posD[sg.a][1]));
        ctx.lineTo(X(posD[sg.b][0]), Y(posD[sg.b][1]));
      });
      ctx.stroke();
      // double image: two warm copies offset opposite ways
      var off = 0.009 * side;
      ctx.strokeStyle = DEL_A;
      ctx.lineWidth = 3.0 * lw;
      ctx.globalAlpha = 0.32 * wDel;
      ctx.beginPath();
      segs.forEach(function (sg) {
        ctx.moveTo(X(posD[sg.a][0]) + off, Y(posD[sg.a][1]) - off * 0.6);
        ctx.lineTo(X(posD[sg.b][0]) + off, Y(posD[sg.b][1]) - off * 0.6);
      });
      ctx.stroke();
      ctx.beginPath();
      segs.forEach(function (sg) {
        ctx.moveTo(X(posD[sg.a][0]) - off, Y(posD[sg.a][1]) + off * 0.6);
        ctx.lineTo(X(posD[sg.b][0]) - off, Y(posD[sg.b][1]) + off * 0.6);
      });
      ctx.stroke();
      // warm node blooms
      ctx.fillStyle = DEL_A;
      posD.forEach(function (q) {
        ctx.globalAlpha = 0.30 * wDel;
        ctx.beginPath();
        ctx.arc(X(q[0]), Y(q[1]), 4.4 * lw, 0, TAU);
        ctx.fill();
      });
      // grain: texture density, shimmering — half tied to the delayed field
      grain.forEach(function (g) {
        var gx, gy;
        var jx = 0.0022 * Math.sin(TAU * t / LOOP * 2 + g.p);
        var jy = 0.0022 * Math.cos(TAU * t / LOOP * 3 + g.p * 1.7);
        if (g.kind === 0) { gx = g.x + jx; gy = g.y + jy; }
        else {
          var sg = segs[g.s];
          var a = posD[sg.a], b = posD[sg.b];
          gx = a[0] + (b[0] - a[0]) * g.u + jx;
          gy = a[1] + (b[1] - a[1]) * g.u + jy;
        }
        ctx.fillStyle = DEL_TEX;
        ctx.globalAlpha = 0.62 * wDel * g.a * (0.7 + 0.3 * Math.sin(TAU * t / LOOP + g.p));
        ctx.beginPath();
        ctx.arc(X(gx), Y(gy), g.r * lw, 0, TAU);
        ctx.fill();
      });
    }

    // ---- SHIMMER pass: warm-white double presence, peaks at the midpoint
    if (shimW > 0.02) {
      ctx.strokeStyle = SHIMMER;
      ctx.lineWidth = 1.7 * lw;
      segs.forEach(function (sg, si) {
        var fl = 0.72 + 0.28 * Math.sin(t * 6.3 + si * 1.93);
        ctx.globalAlpha = 0.34 * shimW * fl;
        ctx.beginPath();
        ctx.moveTo(X(posR[sg.a][0]), Y(posR[sg.a][1]));
        ctx.lineTo(X(posR[sg.b][0]), Y(posR[sg.b][1]));
        ctx.stroke();
      });
    }

    // ---- REAL pass (on top): sharp, thin, exact, at phase t
    if (wReal > 0.01) {
      ctx.strokeStyle = REAL;
      ctx.lineWidth = 1.1 * lw;
      ctx.globalAlpha = wReal;
      ctx.beginPath();
      segs.forEach(function (sg) {
        ctx.moveTo(X(posR[sg.a][0]), Y(posR[sg.a][1]));
        ctx.lineTo(X(posR[sg.b][0]), Y(posR[sg.b][1]));
      });
      ctx.stroke();
      ctx.fillStyle = REAL;
      posR.forEach(function (q) {
        ctx.globalAlpha = 0.9 * wReal;
        ctx.beginPath();
        ctx.arc(X(q[0]), Y(q[1]), 1.5 * lw, 0, TAU);
        ctx.fill();
      });
    }

    ctx.globalAlpha = 1;
    updateAudio(m);
  }

  // ---------- interaction ----------
  var downX = 0, downT = 0, moved = false, lastTapT = -10, lastTapClock = 0;

  function evPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: W };
    var cx = (typeof e.clientX === 'number') ? e.clientX : W / 2;
    return [(cx - r.left), r.width || W];
  }

  canvas.addEventListener('pointerdown', function (e) {
    initAudio();
    var p = evPos(e);
    downX = p[0]; downT = tNow(); moved = false;
    dragging = true;
    dragMix = Math.min(0.97, Math.max(0.03, p[0] / p[1]));
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = evPos(e);
    if (Math.abs(p[0] - downX) > 6) moved = true;
    dragMix = Math.min(0.97, Math.max(0.03, p[0] / p[1]));
  });
  function endPointer() {
    if (!dragging) return;
    dragging = false;
    var t = tNow();
    if (!moved && t - downT < 0.4) {
      // tap
      var nowC = performanceNow();
      if (nowC - lastTapClock < 350 && lastTapClock > 0) {
        // double-tap: new field
        seed = seed + 1;
        buildField(seed);
        evt = { t: t, v: 0.5 };
        lastTapClock = 0;
      } else {
        // tap: snap to the shimmer midpoint
        evt = { t: t, v: 0.5 };
        lastTapClock = nowC;
      }
    } else {
      // drag release: breathing resumes analytically from the released value
      evt = { t: t, v: dragMix };
    }
    draw(t);
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- run ----------
  buildField(seed);
  fit();
  draw(0); // deterministic frame one: fixed phase, mix exactly 0.5

  if (typeof requestAnimationFrame === 'function') {
    var loopFn = function (stamp) {
      if (startStamp === null) startStamp = stamp;
      draw((stamp - startStamp) / 1000);
      requestAnimationFrame(loopFn);
    };
    requestAnimationFrame(loopFn);
  }
})();
</script>
</body>
</html>
