<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№18 · Lissajous</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#07090c; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(190,230,238,0.40); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.85); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another lissajous</div>
<script>
'use strict';
// No18 Lissajous.
// A Lissajous curve drawn as a dotted trace instead of a line:
// thousands of points sampled along x = sin(a t + d), y = sin(b t)
// with a small integer ratio a:b, so the figure closes on itself.
// Dot radius pulses slowly with t, thickening and thinning the trace
// as it travels, and crossings glow denser simply because the path
// passes there more than once. Pale cyan on near-black. A seed is
// gated on its ratio and phase: some ratios collapse into a plain
// ellipse or a knot too tight to read.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '18', 10) || 18;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#07090c';
const RATIOS = [[3, 2], [4, 3], [5, 3], [5, 4], [7, 4], [7, 5], [8, 5]];

function compose(s) {
  const rnd = mulberry32(s);
  const [a, b] = RATIOS[(rnd() * RATIOS.length) | 0];
  const d = (0.15 + rnd() * 0.7) * (Math.PI / 2) * (rnd() < 0.5 ? 1 : -1) + Math.PI / 2;
  // degenerate phases make the figure collapse to a curve of zero area
  const sinD = Math.abs(Math.sin(d));
  return { a, b, d, ok: sinD > 0.35 };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2;
  const R = S * 0.44;

  const NPTS = 2800;
  ctx.fillStyle = '#cfeef4';
  for (let i = 0; i < NPTS; i++) {
    const t = (i / NPTS) * Math.PI * 2;
    const x = Math.sin(p.a * t + p.d);
    const y = Math.sin(p.b * t);
    const pulse = 0.55 + 0.45 * Math.sin(t * 3 + p.d);
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.arc(cx + x * R, cy + y * R, Math.max(0.5, S / 620 * pulse), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
