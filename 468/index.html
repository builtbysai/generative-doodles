<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One White Sheep</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #7CB342; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded RNG (mulberry32), fixed seed: all load-time layout derives from it.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(46856);

  var FIELD = '#7CB342';
  var WHITE = '#F5F2EA';
  var FACE = '#3A3A3A';
  var BLACK = '#141414';

  var LOOP = 45;          // seconds: one full ring turn per loop
  var PREROLL = 11;       // fixed first-frame phase: ring turned, bobs developed, white sheep mid-graze
  var N = 10;             // black sheep on the ring

  // Per-sheep seeded offsets: bob phase, bob speed, slight size jitter.
  var ring = [];
  var baseRot = rand() * Math.PI * 2;
  for (var i = 0; i < N; i++) {
    ring.push({
      phase: rand() * Math.PI * 2,
      speed: 1.25 + rand() * 0.75,
      size: 0.94 + rand() * 0.12
    });
  }

  // Interaction state, stored as offsets from frame center in units of min(W,H),
  // so the layout survives resizes untouched.
  var sheepOff = { x: 0, y: 0 };          // white sheep position (lags the pointer)
  var ringOff = { x: 0, y: 0 };           // ring center (springs after the white sheep)
  var ringVel = { x: 0, y: 0 };
  var pointerOff = { x: 0, y: 0 };
  var dragging = false;
  var alert = 0;                          // 0 = grazing, 1 = head up while dragged

  // One sheep, drawn facing +x with origin at body center. Unit scale:
  // body radius 30, total footprint about 88 wide, legs to y +30.
  // dip (0..1) lowers the head into a graze.
  function drawSheep(s, bodyColor, faceColor, dip) {
    ctx.save();
    ctx.scale(s, s);
    // legs
    ctx.fillStyle = faceColor;
    var legX = [-21, -9, 11, 22];
    for (var i = 0; i < 4; i++) {
      ctx.fillRect(legX[i] - 2.6, 10, 5.2, 20);
    }
    // tail
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.arc(-30, -5, 6.5, 0, Math.PI * 2);
    ctx.fill();
    // body: ellipse plus wool bumps along the top
    ctx.beginPath();
    ctx.ellipse(0, 0, 30, 21, 0, 0, Math.PI * 2);
    ctx.fill();
    var bumps = [[-19, -13, 9], [-7, -17, 10.5], [6, -17.5, 10.5], [19, -12, 8.5]];
    for (var j = 0; j < bumps.length; j++) {
      ctx.beginPath();
      ctx.arc(bumps[j][0], bumps[j][1], bumps[j][2], 0, Math.PI * 2);
      ctx.fill();
    }
    // head, pivoting at the neck so the graze reads as a dip, not a slide
    ctx.translate(27, -6);
    ctx.rotate(dip * 0.55);
    ctx.translate(dip * 2, dip * 13);
    ctx.fillStyle = faceColor;
    // ears
    ctx.beginPath();
    ctx.moveTo(2, -6);
    ctx.lineTo(-7, -13);
    ctx.lineTo(7, -11);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(11, -5);
    ctx.lineTo(7, -14);
    ctx.lineTo(16, -10);
    ctx.closePath();
    ctx.fill();
    // head
    ctx.beginPath();
    ctx.arc(9, 0, 10.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Graze cycle: 9 s, head down through the middle, eased so it dwells low.
  function grazeDip(t) {
    var g = ((t % 9) + 9) % 9 / 9;
    var d = (Math.sin(g * Math.PI * 2 - Math.PI / 2) + 1) / 2;
    return Math.pow(d, 1.6);
  }

  function draw(t, w, h) {
    var M = Math.min(w, h);
    var cx = w / 2, cy = h / 2;

    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, w, h);

    var R = 0.30 * M;                                // ring at 60% of the half-frame
    var sWhite = 0.25 * M / 88;                      // white sheep ~25% of frame
    var spacing = 2 * Math.PI * R / N;
    var sBlack = Math.min(sWhite * 0.92, spacing * 0.94 / 88) ;
    var rcx = cx + ringOff.x * M, rcy = cy + ringOff.y * M;
    var rot = baseRot + Math.PI * 2 * (t / LOOP);

    for (var i = 0; i < N; i++) {
      var sh = ring[i];
      var a = rot + i * Math.PI * 2 / N;
      var bob = Math.sin(t * sh.speed + sh.phase) * 3.2 * sBlack;
      var x = rcx + Math.cos(a) * R;
      var y = rcy + Math.sin(a) * R + bob;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a + Math.PI);                       // face inward, toward the white sheep
      drawSheep(sBlack * sh.size, BLACK, BLACK, 0);
      ctx.restore();
    }

    // The odd one out.
    var dip = grazeDip(t) * (1 - alert);
    ctx.save();
    ctx.translate(cx + sheepOff.x * M, cy + sheepOff.y * M);
    drawSheep(sWhite, WHITE, FACE, dip);
    ctx.restore();

    // Hint
    ctx.save();
    ctx.globalAlpha = 0.38;
    ctx.fillStyle = WHITE;
    ctx.font = '600 ' + Math.max(12, Math.round(M * 0.02)) + 'px system-ui, Arial, sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag', Math.max(14, M * 0.025), h - Math.max(12, M * 0.022));
    ctx.restore();
  }

  var W = 0, H = 0;
  function resize() {
    var vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    // Phone detection per house rules (field composition goes full-bleed either way).
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    canvas.__phone = Math.min(sw, sh) < 700 || H > W * 1.15;
    canvas.width = W;
    canvas.height = H;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  function frame(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    draw(t, W, H);
  }

  // Pointer: the white sheep follows with a lag; the ring re-centers on it.
  function toOffset(e) {
    var M = Math.min(W, H) || 1;
    return { x: (e.clientX - W / 2) / M, y: (e.clientY - H / 2) / M };
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    pointerOff = toOffset(e);
    if (e.preventDefault) e.preventDefault();
  });
  window.addEventListener('pointermove', function (e) {
    if (dragging) pointerOff = toOffset(e);
  });
  window.addEventListener('pointerup', function () { dragging = false; });
  window.addEventListener('pointercancel', function () { dragging = false; });

  // Synchronous first frame at the constant pre-roll phase.
  frame(PREROLL);

  if (typeof requestAnimationFrame === 'function') {
    var startStamp = null, lastTs = null;
    var tick = function (ts) {
      if (startStamp === null) { startStamp = ts; lastTs = ts; }
      var dt = Math.min(0.05, Math.max(0.0001, (ts - lastTs) / 1000));
      lastTs = ts;
      var t = PREROLL + (ts - startStamp) / 1000;

      // White sheep: exponential lag toward the pointer, home when released.
      var tx = dragging ? pointerOff.x : 0;
      var ty = dragging ? pointerOff.y : 0;
      var lag = 1 - Math.exp(-dt * 3.6);
      sheepOff.x += (tx - sheepOff.x) * lag;
      sheepOff.y += (ty - sheepOff.y) * lag;

      // Ring center: damped spring after the white sheep, so the ring
      // breaks and reforms around it.
      var K = 26, DAMP = 5.2;
      ringVel.x += (sheepOff.x - ringOff.x) * K * dt;
      ringVel.y += (sheepOff.y - ringOff.y) * K * dt;
      var decay = Math.exp(-DAMP * dt);
      ringVel.x *= decay; ringVel.y *= decay;
      ringOff.x += ringVel.x * dt;
      ringOff.y += ringVel.y * dt;

      // Head lifts while dragged, settles back to grazing on release.
      var aTarget = dragging ? 1 : 0;
      alert += (aTarget - alert) * (1 - Math.exp(-dt * 5));

      frame(t);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
