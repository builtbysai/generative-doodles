<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.200 Crush</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#08080A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.200 Crush (Amanda Willshire). Her twelve foot man for Can'd
// Aid, built entirely from bike parts: chainring hips and
// shoulders, spoke ribs, a chain spine, handlebar arms, pedal
// feet, and an open hopper for a torso, because he is a working
// recycling receptacle and art that takes your trash in. Tap
// anywhere and a can arcs from your finger into the hopper. Every
// fifth can fires the crush: the torso folds in, hips rotate, the
// cans burst to flecks, and he re-expands. Drag his arm to aim
// the next throw. His face is a headlamp bracket. No face.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#08080A', STEEL = '#5A6068', GREASE = '#17181B', GLINT = '#9AA0A8';
var INTERIOR = '#000000', CAN = '#C9CDD4', CANRED = '#C81E1E', CANBLUE = '#1E5AC8';
var W = 0, H = 0, phone = false;
var seed = 200200;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function smooth(a, b, x) { var k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); }

// ---- geometry --------------------------------------------------------------
function geom() {
  var fh = Math.min(H * 0.85, W * 1.55);   // height-led, but narrow screens cap it so the arms stay in frame
  var cx = W / 2;
  var top = H * 0.075;
  return {
    fh: fh, cx: cx, top: top,
    lampY: top + fh * 0.035,
    shoulderY: top + fh * 0.155,
    shoulderX: fh * 0.115,
    mouthY: top + fh * 0.185,
    hipY: top + fh * 0.52,
    hipX: fh * 0.082,
    kneeY: top + fh * 0.72,
    footY: top + fh * 0.955
  };
}

// ---- state ---------------------------------------------------------------------
var T = 0, lastNow = -1;
var canCount = 2;              // frame one: two cans already resting in the hopper
var flying = [];               // cans in the air
var flecks = [];               // crush debris
var crushT = -9;               // crush start time
var aim = 0.4;                 // toss arc bias from arm aim, 0..1
var armAng = { l: 0.5, r: 0.5 };  // current arm droop offsets (rad, outward positive)
var armTarget = { l: 0.5, r: 0.5 };
var hipSpin = 0;
var REST = [[-0.052, -0.012], [0.038, -0.020], [-0.005, -0.038], [0.062, -0.004]]; // hopper rest spots (fh units rel. mouth)

function hopperMouth(g) { return { x: g.cx, y: g.mouthY + (crushK() * g.fh * 0.045), w: g.fh * 0.185 }; }
function crushK() {
  var t = T - crushT;
  if (t < 0 || t > 1.05) return 0;
  if (t < 0.30) return smooth(0, 0.30, t);
  if (t < 0.55) return 1;
  return 1 - smooth(0.55, 1.05, t);
}
function toss(x, y) {
  var g = geom();
  var m = hopperMouth(g);
  var flight = 0.78 - aim * 0.18;
  flying.push({ x0: x, y0: y, x1: m.x + (rand() - 0.5) * m.w * 0.4, y1: m.y - 4, t: 0, T: flight, arc: g.fh * (0.10 + aim * 0.16), rot: rand() * 6.28, blue: rand() < 0.4 });
}
function landCan() {
  canCount++;
  if (canCount >= 5) {
    crushT = T;
    var g = geom();
    var m = hopperMouth(g);
    var cols = [CAN, CANRED, CANBLUE];
    for (var i = 0; i < 30; i++) {
      flecks.push({
        x: m.x + (rand() - 0.5) * m.w * 0.8, y: m.y - rand() * g.fh * 0.03,
        vx: (rand() - 0.5) * g.fh * 0.55, vy: -(0.25 + rand() * 0.5) * g.fh * 0.55,
        life: 0, max: 0.7 + rand() * 0.5, col: cols[Math.floor(rand() * 3)], s: 2 + rand() * 3.5
      });
    }
    canCount = 0;
  }
}

// ---- part glyphs ------------------------------------------------------------------
function chainring(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  var teeth = 14;
  for (var i = 0; i <= teeth * 2; i++) {
    var a = (i / (teeth * 2)) * 6.2832;
    var rr = (i % 2 === 0) ? r : r * 0.86;
    var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.fillStyle = STEEL;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.62, 0, 6.284);
  ctx.fillStyle = GREASE;
  ctx.fill();
  ctx.fillStyle = GLINT;
  for (var bIdx = 0; bIdx < 5; bIdx++) {
    var ba = bIdx / 5 * 6.2832;
    ctx.beginPath();
    ctx.arc(Math.cos(ba) * r * 0.40, Math.sin(ba) * r * 0.40, Math.max(1.2, r * 0.09), 0, 6.284);
    ctx.fill();
  }
  ctx.restore();
}
function chainCurve(x0, y0, x1, y1, bow) {
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo((x0 + x1) / 2 + bow, (y0 + y1) / 2, x1, y1);
  ctx.strokeStyle = GLINT;
  ctx.lineWidth = Math.max(1.4, H * 0.0022);
  ctx.setLineDash([5, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
}
function drawCan(x, y, s, rot, blue) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = CAN;
  ctx.fillRect(-s * 0.5, -s * 0.75, s, s * 1.5);
  ctx.fillStyle = blue ? CANBLUE : CANRED;
  ctx.fillRect(-s * 0.5, -s * 0.22, s, s * 0.44);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(-s * 0.5, -s * 0.75, s, s * 0.14);
  ctx.restore();
}

// ---- figure ---------------------------------------------------------------------------
function drawFigure(g, dt) {
  var ck = crushK();
  var sway = Math.sin(T * 6.2832 / 7) * 1;              // a single pixel of sway
  var shake = 0;
  var ct = T - crushT;
  if (ct > 0 && ct < 0.5) shake = (rand() - 0.5) * 5 * (1 - ct / 0.5);
  var ox = sway + shake, oy = (rand() - 0.5) * (shake ? 3 : 0);
  hipSpin += dt * ck * 9;
  ctx.save();
  ctx.translate(ox, oy);
  var hipMidY = g.hipY;
  // legs and feet (below the squash line)
  for (var s = -1; s <= 1; s += 2) {
    var hx = g.cx + s * g.hipX, kx = g.cx + s * g.fh * 0.105, fx = g.cx + s * g.fh * 0.125;
    ctx.strokeStyle = STEEL;
    ctx.lineWidth = Math.max(3, g.fh * 0.013);
    ctx.beginPath(); ctx.moveTo(hx, hipMidY); ctx.lineTo(kx, g.kneeY); ctx.lineTo(fx, g.footY - g.fh * 0.02); ctx.stroke();
    chainring(kx, g.kneeY, g.fh * 0.026, hipSpin * 0.6 * s);
    // pedal foot: a crank arm and a flat pedal
    ctx.strokeStyle = STEEL;
    ctx.lineWidth = Math.max(2, g.fh * 0.008);
    ctx.beginPath(); ctx.moveTo(fx, g.footY - g.fh * 0.02); ctx.lineTo(fx + s * g.fh * 0.03, g.footY); ctx.stroke();
    ctx.fillStyle = GREASE;
    ctx.fillRect(fx + s * g.fh * 0.03 - g.fh * 0.035, g.footY - g.fh * 0.006, g.fh * 0.07, g.fh * 0.012);
    chainring(hx, hipMidY, g.fh * 0.052, hipSpin * s);
  }
  // everything above the hips squashes toward the hip line in a crush
  ctx.translate(0, hipMidY);
  ctx.scale(1, 1 - 0.20 * ck);
  ctx.translate(0, -hipMidY);
  // chain spine behind the torso
  chainCurve(g.cx, g.mouthY - g.fh * 0.01, g.cx, hipMidY, g.fh * 0.012);
  // hopper torso: an open trapezoid bin
  var mw = g.fh * 0.185, bw2 = g.fh * 0.125;
  var my = g.mouthY, by = hipMidY - g.fh * 0.015;
  ctx.beginPath();
  ctx.moveTo(g.cx - mw, my);
  ctx.lineTo(g.cx + mw, my);
  ctx.lineTo(g.cx + bw2, by);
  ctx.lineTo(g.cx - bw2, by);
  ctx.closePath();
  ctx.fillStyle = GREASE;
  ctx.fill();
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = Math.max(2, g.fh * 0.007);
  ctx.stroke();
  // spoke ribs across the hopper front, folding inward in a crush
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = Math.max(1.4, g.fh * 0.004);
  for (var rib = -2; rib <= 2; rib++) {
    var rx = rib / 2;
    var topX = g.cx + rx * mw * 0.82;
    var botX = g.cx + rx * bw2 * 0.82 * (1 - 0.45 * ck);
    ctx.beginPath();
    ctx.moveTo(topX, my + g.fh * 0.03);
    ctx.quadraticCurveTo(g.cx + rx * mw * 0.5, (my + by) / 2, botX, by - g.fh * 0.02);
    ctx.stroke();
  }
  // hopper mouth: black interior, breathing rim
  var breathe = 1 + Math.sin(T * 6.2832 / 3.6) * 0.03;
  ctx.beginPath();
  ctx.ellipse(g.cx, my, mw * breathe, g.fh * 0.020 * breathe, 0, 0, 6.284);
  ctx.fillStyle = INTERIOR;
  ctx.fill();
  ctx.strokeStyle = GLINT;
  ctx.lineWidth = Math.max(1.6, g.fh * 0.005);
  ctx.stroke();
  // resting cans in the mouth
  var cs = g.fh * 0.020;
  for (var ci = 0; ci < canCount && ci < 4; ci++) {
    drawCan(g.cx + REST[ci][0] * g.fh, my + REST[ci][1] * g.fh, cs, (ci % 2 ? -0.16 : 0.13), ci % 3 === 2);
  }
  // shoulders and handlebar arms
  for (var s2 = -1; s2 <= 1; s2 += 2) {
    var shx = g.cx + s2 * g.shoulderX, shy = g.shoulderY + ck * g.fh * 0.01;
    chainring(shx, shy, g.fh * 0.046, hipSpin * 0.4 * s2);
    var ang = (s2 < 0 ? armAng.l : armAng.r);
    var ex = shx + s2 * g.fh * 0.115, ey = shy + g.fh * 0.15;
    var hx2 = shx + Math.sin(ang) * g.fh * 0.20 * s2 + s2 * g.fh * 0.075;
    var hy2 = shy + Math.cos(Math.abs(ang)) * g.fh * 0.27;
    ctx.strokeStyle = STEEL;
    ctx.lineWidth = Math.max(3, g.fh * 0.011);
    ctx.beginPath();
    ctx.moveTo(shx, shy);
    ctx.lineTo(ex, ey);
    ctx.lineTo(hx2, hy2);
    ctx.stroke();
    // handlebar grip curling back
    ctx.beginPath();
    ctx.moveTo(hx2, hy2);
    ctx.lineTo(hx2 - s2 * g.fh * 0.035, hy2 - g.fh * 0.016);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(hx2, hy2, Math.max(2, g.fh * 0.007), 0, 6.284);
    ctx.fillStyle = GLINT; ctx.fill();
  }
  // neck chain and the headlamp bracket that is his face
  chainCurve(g.cx, g.shoulderY - g.fh * 0.01, g.cx, g.lampY + g.fh * 0.02, 0);
  ctx.fillStyle = GREASE;
  ctx.fillRect(g.cx - g.fh * 0.030, g.lampY - g.fh * 0.016, g.fh * 0.060, g.fh * 0.030);
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = Math.max(1.6, g.fh * 0.005);
  ctx.strokeRect(g.cx - g.fh * 0.030, g.lampY - g.fh * 0.016, g.fh * 0.060, g.fh * 0.030);
  ctx.beginPath();
  ctx.arc(g.cx, g.lampY, g.fh * 0.0135, 0, 6.284);
  ctx.fillStyle = GLINT;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(g.cx - g.fh * 0.004, g.lampY - g.fh * 0.004, g.fh * 0.004, 0, 6.284);
  ctx.fillStyle = '#FFFFFF';
  ctx.fill();
  ctx.restore();
}

// ---- input --------------------------------------------------------------------------------
var downX = 0, downY = 0, downT = 0, dragArm = null;
function nearArm(x, y) {
  var g = geom();
  for (var s = -1; s <= 1; s += 2) {
    var shx = g.cx + s * g.shoulderX, shy = g.shoulderY;
    var hx2 = shx + s * g.fh * 0.19, hy2 = shy + g.fh * 0.235;
    if (Math.hypot(x - hx2, y - hy2) < g.fh * 0.09 || Math.hypot(x - shx, y - shy) < g.fh * 0.07) return s < 0 ? 'l' : 'r';
  }
  return null;
}
canvas.addEventListener('pointerdown', function (e) {
  downX = e.clientX; downY = e.clientY; downT = e.timeStamp || 0;
  dragArm = nearArm(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragArm) return;
  var g = geom();
  var s = dragArm === 'l' ? -1 : 1;
  var shx = g.cx + s * g.shoulderX, shy = g.shoulderY;
  var a = Math.atan2(e.clientX - shx, e.clientY - shy);   // droop measured from straight down
  armTarget[dragArm] = clamp(a * s, -0.9, 0.9);
  aim = clamp(0.3 + a * 0.5, 0, 1);   // a raised arm lobs the next can higher
});
function endPointer(e) {
  var moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  var quick = ((e.timeStamp || 0) - downT) < 400;
  if (!dragArm && moved < 10 && quick) toss(e.clientX, e.clientY);
  dragArm = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { dragArm = null; });

// ---- resize -----------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- draw ------------------------------------------------------------------------------------------------
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && now > 0) {
    dt = Math.min(0.05, (now - lastNow) / 1000);
    T += dt;
  }
  lastNow = now;
  for (var aKey in armAng) armAng[aKey] += (armTarget[aKey] - armAng[aKey]) * Math.min(1, dt * 8);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var g = geom();
  drawFigure(g, dt);
  // cans in flight
  for (var i = flying.length - 1; i >= 0; i--) {
    var f = flying[i];
    f.t += dt;
    var k = clamp(f.t / f.T, 0, 1);
    var x = lerp(f.x0, f.x1, k);
    var y = lerp(f.y0, f.y1, k) - Math.sin(k * Math.PI) * f.arc;
    drawCan(x, y, g.fh * 0.020, f.rot + k * 5, f.blue);
    if (k >= 1) { flying.splice(i, 1); landCan(); }
  }
  // crush flecks
  for (var j = flecks.length - 1; j >= 0; j--) {
    var p = flecks[j];
    p.life += dt;
    if (p.life > p.max) { flecks.splice(j, 1); continue; }
    p.vy += g.fh * 0.9 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = 1 - p.life / p.max;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s * 0.7);
    ctx.globalAlpha = 1;
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
