<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Any Song Has to Be Both</title>
<style>
  html, body { margin: 0; padding: 0; background: #8E8B82; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smootherstep(x) {
    x = clamp(x, 0, 1);
    return x * x * x * (x * (x * 6 - 15) + 10);
  }

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // interaction reseed stream (arc reseeds draw from this)
  var uiRng = mulberry32(833833);

  // ---------- palette (strict) ----------
  var MOOR = '#8E8B82';      // moorland grey
  var HEATHER = '#6E5A6B';   // heather
  var SEPIA = '#C9A96A';     // sepia line
  var BBLACK = '#0B0B0B';    // brutal black
  var NEON = '#E53B2E';      // brutal neon red
  var DUO = '#7A1A14';       // MERCY duotone red
  // ghost text: a parchment-grey mix of the sepia and the moorland grey
  // (both palette tones), drawn at low alpha. Mix computed once:
  var GHOST = 'rgb(172,154,118)';

  var REFRAIN = "I think I'm gonna die in this house";

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- QA hook (inert): ?seed=brutal renders frame one inside a
  // brutal phase so the slam blocks can be verified headlessly.
  var T_OFF = 0;
  if (typeof location !== 'undefined' && /seed=brutal/.test(location.search || '')) T_OFF = 14;

  // ---------- viewport sizing (Visual Viewport API) ----------
  function viewSize() {
    var w, h;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    return { w: w, h: h };
  }
  function isPhone(w, h) {
    var sw = 9999;
    if (window.screen) sw = Math.min(window.screen.width, window.screen.height);
    return sw < 700 || h > w * 1.15;
  }

  var W = 0, H = 0, DPR = 1, PHONE = false;
  var GEO = null;
  function resize() {
    var s = viewSize();
    W = Math.max(1, Math.round(s.w));
    H = Math.max(1, Math.round(s.h));
    DPR = window.devicePixelRatio || 1;
    PHONE = isPhone(W, H);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    buildScene();
  }
  function buildScene() {
    var minD = Math.min(W, H);
    // size the ghost type so the refrain overflows the frame and clips
    ctx.font = 'italic 300 100px Georgia, "Times New Roman", serif';
    var wAt100 = Math.max(1, ctx.measureText(REFRAIN).width);
    var targetW = (PHONE ? 1.12 : 1.32) * W;
    var textSize = 100 * targetW / wAt100;
    GEO = {
      minD: minD,
      textSize: textSize,
      textY: H * 0.40,
      lw: clamp(minD * 0.0035, 1.2, 3)
    };
  }

  // ---------- the two-register phase machine (closed form) ----------
  // State lives in anchors. An anchor records, at its time t: the phase
  // kind, how far into that phase we already are, the cycle index, when
  // the current cycle's elegant phase began, and the phase durations in
  // effect from that anchor on (a drag balance change appends an anchor;
  // the new durations govern from that moment, including the remainder
  // of the phase in progress). stateAt(t) walks forward from the last
  // anchor at or before t, so the phase at any t is a closed-form
  // function of the anchor list. No Date.now anywhere.
  //
  // Balance b in [-1, 1]: drag toward the top -> b rises -> elegant
  // lengthens, brutal shortens. Toward the bottom reverses it.
  function durationsFor(b) {
    return {
      eleg: clamp(20 + 10 * b, 10, 30),
      bru: clamp(6.5 - 3.5 * b, 3, 10)
    };
  }
  var d0 = durationsFor(0);
  var anchors = [{
    t: 0, kind: 'elegant', elapsed: 8, cycle: 0, cycleStart: -8,
    elegDur: d0.eleg, bruDur: d0.bru, balance: 0
  }];

  function stateAt(t) {
    var a = anchors[0], i;
    for (i = anchors.length - 1; i >= 0; i--) {
      if (anchors[i].t <= t) { a = anchors[i]; break; }
    }
    var kind = a.kind, el = a.elapsed, cyc = a.cycle, cs = a.cycleStart;
    var rem = t - a.t, walkT = a.t, guard = 0;
    while (guard++ < 10000) {
      var dur = (kind === 'elegant') ? a.elegDur : a.bruDur;
      if (el + rem < dur) { el += rem; rem = 0; break; }
      var step = dur - el;
      rem -= step; walkT += step; el = 0;
      if (kind === 'elegant') {
        kind = 'brutal';
      } else {
        kind = 'elegant';
        cyc++;
        cs = walkT;
      }
    }
    return {
      kind: kind, elapsed: el, cycle: cyc, cycleStart: cs,
      dur: (kind === 'elegant') ? a.elegDur : a.bruDur,
      elegDur: a.elegDur, bruDur: a.bruDur, balance: a.balance
    };
  }
  function pushAnchor(t, st, balance) {
    var d = durationsFor(balance);
    anchors.push({
      t: t, kind: st.kind, elapsed: st.elapsed, cycle: st.cycle,
      cycleStart: st.cycleStart, elegDur: d.eleg, bruDur: d.bru,
      balance: balance
    });
  }

  // arc reseeds from double-taps: a reseed governs every elegant cycle
  // whose start is at or after the tap.
  var SEED0 = 102001;
  var reseeds = [];
  function seedBaseAt(cycleStart) {
    var base = SEED0, i;
    for (i = 0; i < reseeds.length; i++) {
      if (reseeds[i].t <= cycleStart) base = reseeds[i].base;
    }
    return base;
  }

  // ---------- seeded shapes (unit space, rebuilt per draw) ----------
  function arcPoints(seed) {
    var rng = mulberry32(seed);
    var pts = [];
    var nSeg = 6;
    var x = -0.04, y = 0.30 + rng() * 0.10;
    pts.push([x, y]);
    for (var s = 0; s < nSeg; s++) {
      var x1 = x + 0.18 + rng() * 0.02;
      var y1 = 0.16 + rng() * 0.42;               // wander the upper field
      var c1x = x + 0.06 + rng() * 0.04;
      var c1y = y + (rng() - 0.5) * 0.44;          // cursive lift and dip
      var c2x = x1 - 0.06 - rng() * 0.04;
      var c2y = y1 + (rng() - 0.5) * 0.44;
      var steps = 48, k;
      for (k = 1; k <= steps; k++) {
        var u = k / steps, v = 1 - u;
        var px = v * v * v * x + 3 * v * v * u * c1x + 3 * v * u * u * c2x + u * u * u * x1;
        var py = v * v * v * y + 3 * v * v * u * c1y + 3 * v * u * u * c2y + u * u * u * y1;
        pts.push([px, py]);
      }
      x = x1; y = y1;
    }
    return pts;
  }

  function clangBlocks(seed) {
    var rng = mulberry32(seed);
    var count = 6 + Math.floor(rng() * 5);        // 6..10 blocks
    var cols = [BBLACK, NEON, BBLACK, DUO, NEON, BBLACK, NEON, DUO, BBLACK, NEON];
    var off = Math.floor(rng() * cols.length);
    var blocks = [];
    for (var i = 0; i < count; i++) {
      var bw = 0.22 + rng() * 0.40;
      var bh = 0.18 + rng() * 0.42;
      blocks.push({
        x: -0.04 + rng() * (1.08 - bw),
        y: -0.03 + rng() * (1.06 - bh),
        w: bw, h: bh,
        color: cols[(off + i) % cols.length],
        slamFrac: 0.05 + 0.62 * (i + 0.5) / count
      });
    }
    return blocks;
  }

  // ---------- piece clock (anchored to first rAF timestamp) ----------
  var clockStart = null, clockNow = 0;
  function pieceT() { return clockNow + T_OFF; }

  // ---------- audio: first tap only, lazy, guarded ----------
  // Elegant = a soft two-sine pad. Brutal = a filtered noise burst on
  // each block slam. Nothing autoplays; everything sits behind the
  // first pointer gesture, and the piece runs silently where there is
  // no AudioContext (the QA renderer included).
  var actx = null, audioLive = false, master = null, padGain = null;
  var noiseBuf = null;
  function startAudio() {
    if (audioLive) return;
    var AC = null;
    if (typeof AudioContext !== 'undefined') AC = AudioContext;
    else if (typeof webkitAudioContext !== 'undefined') AC = webkitAudioContext;
    if (!AC) return;
    try {
      actx = new AC();
      var comp = actx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.connect(actx.destination);
      master = actx.createGain();
      master.gain.value = 0.14;
      master.connect(comp);
      padGain = actx.createGain();
      padGain.gain.value = 0;
      padGain.connect(master);
      var freqs = [110, 164.81];
      for (var i = 0; i < freqs.length; i++) {
        var o = actx.createOscillator();
        o.type = 'sine';
        o.frequency.value = freqs[i];
        o.connect(padGain);
        o.start();
      }
      var len = Math.floor(actx.sampleRate * 0.25);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      var data = noiseBuf.getChannelData(0);
      for (var j = 0; j < len; j++) data[j] = Math.random() * 2 - 1;
      if (actx.state === 'suspended' && actx.resume) actx.resume();
      audioLive = true;
    } catch (err) {
      actx = null; audioLive = false;
    }
  }
  function burst(idx) {
    if (!audioLive || !actx || !noiseBuf) return;
    var t0 = actx.currentTime;
    var src = actx.createBufferSource();
    src.buffer = noiseBuf;
    var bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 650 + (idx % 3) * 260;
    bp.Q.value = 0.8;
    var g = actx.createGain();
    g.gain.setValueAtTime(0.85, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + 0.2);
  }
  // audio follows the closed-form state: pad up in elegant, cut dead in
  // brutal; one burst per newly slammed block.
  var lastKind = null, lastSlam = 0, lastCycle = -1;
  function audioFollow(st) {
    if (!audioLive || !actx) { lastKind = st.kind; lastSlam = slamCount(st); lastCycle = st.cycle; return; }
    var now = actx.currentTime;
    if (padGain) {
      if (st.kind === 'elegant') padGain.gain.setTargetAtTime(0.055, now, 0.45);
      else padGain.gain.setTargetAtTime(0, now, 0.03);
    }
    if (st.kind === 'brutal') {
      var sc = slamCount(st);
      if (lastKind === 'brutal' && st.cycle === lastCycle) {
        for (var i = lastSlam; i < sc; i++) burst(i);
      }
      lastSlam = sc;
    } else {
      lastSlam = 0;
    }
    lastKind = st.kind; lastCycle = st.cycle;
  }
  function slamCount(st) {
    if (st.kind !== 'brutal') return 0;
    var blocks = clangBlocks(seedBaseAt(st.cycleStart) + st.cycle * 7717);
    var n = 0;
    for (var i = 0; i < blocks.length; i++) {
      if (st.elapsed >= blocks[i].slamFrac * st.dur) n++;
    }
    return n;
  }

  // ---------- drawing ----------
  function drawElegant(st) {
    ctx.fillStyle = MOOR;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = HEATHER;
    ctx.fillRect(0, H * 2 / 3, W, H - H * 2 / 3);

    var p = st.elapsed / st.dur;

    // ghost refrain: large quiet type drifting through, clipped by the
    // frame edges (it is wider than the frame by construction)
    ctx.font = 'italic 300 ' + GEO.textSize + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = GHOST;
    ctx.fillText(REFRAIN, W * (0.78 - 0.56 * p), GEO.textY);
    ctx.globalAlpha = 1;

    // the cursive arc, drawn progressively across the phase
    var pts = arcPoints(seedBaseAt(st.cycleStart) + st.cycle * 1013);
    var drawP = smootherstep(p / 0.85);
    var n = Math.max(2, Math.floor(pts.length * drawP));
    ctx.strokeStyle = SEPIA;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.16;
    ctx.lineWidth = GEO.lw * 2.4;
    strokePts(pts, n);
    ctx.globalAlpha = 0.95;
    ctx.lineWidth = GEO.lw;
    strokePts(pts, n);
    ctx.globalAlpha = 1;
  }
  function strokePts(pts, n) {
    ctx.beginPath();
    for (var i = 0; i < n && i < pts.length; i++) {
      var X = pts[i][0] * W, Y = pts[i][1] * H;
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.stroke();
  }

  function drawBrutal(st) {
    // the cut: the elegant layer is simply gone. If the refrain was
    // mid-passage, it is interrupted mid-word — nothing of it remains.
    ctx.fillStyle = DUO;
    ctx.fillRect(0, 0, W, H);
    var blocks = clangBlocks(seedBaseAt(st.cycleStart) + st.cycle * 7717);
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (st.elapsed < b.slamFrac * st.dur) continue;   // not slammed yet
      ctx.fillStyle = b.color;                          // instant, no easing
      ctx.fillRect(b.x * W, b.y * H, b.w * W, b.h * H);
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var st = stateAt(t);
    if (st.kind === 'elegant') drawElegant(st); else drawBrutal(st);
    audioFollow(st);
  }

  // ---------- pointer: drag pushes the balance, double-tap reseeds ----
  var pDown = null, lastTapUp = -10;
  function evPos(e) { return { x: e.clientX || 0, y: e.clientY || 0 }; }

  canvas.addEventListener('pointerdown', function (e) {
    startAudio(); // first gesture starts the sound; never autoplayed
    var p = evPos(e);
    var st = stateAt(pieceT());
    pDown = { y: p.y, t: pieceT(), moved: false, balance: st.balance };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pDown) return;
    var p = evPos(e);
    if (Math.abs(p.y - pDown.y) > 6) pDown.moved = true;
  });
  function endPointer(e) {
    if (!pDown) return;
    var t = pieceT();
    var st = stateAt(t);
    if (pDown.moved) {
      var p = evPos(e);
      var b = clamp(pDown.balance + (pDown.y - p.y) / (H * 0.6), -1, 1);
      pushAnchor(t, st, b); // new durations govern from this moment
    } else if (t - pDown.t < 0.4) {
      if (t - lastTapUp < 0.35) {
        reseeds.push({ t: t, base: Math.floor(uiRng() * 1000000000) });
        lastTapUp = -10;
      } else {
        lastTapUp = t;
      }
    }
    pDown = null;
    draw(t);
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- run ----------
  resize();
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  draw(T_OFF); // frame one: synchronous, ~8 s into an elegant phase, silent

  if (typeof requestAnimationFrame === 'function') {
    var loop = function (ts) {
      if (clockStart === null) clockStart = ts;
      clockNow = (ts - clockStart) / 1000;
      draw(clockNow + T_OFF);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
