<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasta Monster</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #10181C; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var PASTA = '#F0B41C';   // pasta yellow
  var GROUND = '#10181C';  // near-black ground
  var INK = '#000000';     // eye black
  var RED = '#D83A2A';     // brow / mouth red
  var SUIT = '#1B63F0';    // waiter suit blue
  var SHOE = '#E63946';    // waiter shoe red
  var SKIN = '#F8F5F0';    // waiter skin

  var PHASE = 5.0;         // fixed pre-roll phase for frame one (eyes open)
  var LOOP = 16.0;         // master writhe loop, seconds
  var BLINK_PERIOD = 4.3;  // eye blink cycle, seconds
  var BASE_SEED = 506112;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ------------------------------------------------------------------
  // Scene, rebuilt from a seed. All layout is stored as fractions of
  // the square stage, so the seeded scene lands identically at every
  // size. The mound is a dome whose top boundary is yTop(x); it spills
  // past the left, right and bottom stage edges. The face always sits
  // in the upper-right quadrant of the mass.
  // ------------------------------------------------------------------
  var grain = [];      // static ground specks (drawn directly, no offscreen canvas)
  var rings = [];      // coiled strands clipped inside the dome
  var loose = [];      // loose strands, ends curling out past the dome edge
  var waiterPose = 0;  // 0 arms up, 1 arms out, 2 fleeing
  var faceJit = { x: 0, y: 0 };
  var seedIndex = 0;

  function yTop(x) {
    return 0.335 - 0.115 * Math.sin(Math.PI * Math.pow(Math.max(0, Math.min(1, x)), 0.9));
  }

  function buildScene(seed) {
    var rng = mulberry32(seed);
    var i, j;

    grain = [];
    var grainCols = ['#1B252B', '#0A0F12', '#232E34'];
    for (i = 0; i < 700; i++) {
      grain.push({
        x: rng(), y: rng(),
        s: 0.0015 + rng() * 0.0028,
        c: grainCols[Math.floor(rng() * 3)]
      });
    }

    // Coils: three centres inside the dome, rings stepping outward.
    var centres = [
      { x: 0.26, y: 0.60, max: 0.27 + rng() * 0.04 },
      { x: 0.50, y: 0.80, max: 0.25 + rng() * 0.04 },
      { x: 0.74, y: 0.64, max: 0.23 + rng() * 0.04 }
    ];
    rings = [];
    for (i = 0; i < centres.length; i++) {
      var step = 0.029 + rng() * 0.004;
      for (var r = 0.052; r < centres[i].max; r += step) {
        rings.push({
          cx: centres[i].x + (rng() - 0.5) * 0.02,
          cy: centres[i].y + (rng() - 0.5) * 0.02,
          r: r,
          squash: 0.80 + rng() * 0.06,
          wob1: rng() * Math.PI * 2,
          wob2: rng() * Math.PI * 2,
          speed: 1 + Math.floor(rng() * 2),        // integer cycles per LOOP
          phase: rng() * Math.PI * 2
        });
      }
    }

    // Loose strands: start inside the dome, run out past its boundary,
    // end in a curl. Curl direction flips per seed.
    var curlDir = rng() < 0.5 ? -1 : 1;
    loose = [];
    var nLoose = 12 + Math.floor(rng() * 7);       // 12-18
    for (i = 0; i < nLoose; i++) {
      var side = rng();
      var sx, sy, ex, ey;
      if (side < 0.55) {           // ends poking just out of the dome top
        sx = 0.08 + rng() * 0.84; sy = yTop(sx) + 0.05 + rng() * 0.13;
        ex = sx + (rng() - 0.5) * 0.12; ey = yTop(sx) - 0.015 - rng() * 0.03;
      } else if (side < 0.78) {    // out through the left edge
        sx = 0.10 + rng() * 0.22; sy = 0.45 + rng() * 0.45;
        ex = -0.03 - rng() * 0.03; ey = sy + (rng() - 0.5) * 0.2;
      } else {                     // out through the right edge
        sx = 0.68 + rng() * 0.22; sy = 0.45 + rng() * 0.45;
        ex = 1.03 + rng() * 0.03; ey = sy + (rng() - 0.5) * 0.2;
      }
      var mx = (sx + ex) / 2 + (rng() - 0.5) * 0.10;
      var my = (sy + ey) / 2 + (rng() - 0.5) * 0.10;
      loose.push({
        x0: sx, y0: sy, x1: mx, y1: my, x2: ex, y2: ey,
        curl: (0.020 + rng() * 0.022) * curlDir,
        speed: 1 + Math.floor(rng() * 2),
        phase: rng() * Math.PI * 2,
        w: 0.020 + rng() * 0.009
      });
    }

    faceJit = { x: (rng() - 0.5) * 0.03, y: (rng() - 0.5) * 0.02 };
    waiterPose = Math.floor(rng() * 3);
    if (seedIndex === 0) waiterPose = 0;           // first frame: arms raised
  }

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE); // deterministic frame after any resize
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  function domePath(S, ox, oy) {
    ctx.beginPath();
    ctx.moveTo(ox - 0.04 * S, oy + 1.04 * S);
    ctx.lineTo(ox - 0.04 * S, oy + yTop(0) * S);
    for (var x = 0; x <= 1.0001; x += 0.05) {
      ctx.lineTo(ox + x * S, oy + yTop(x) * S);
    }
    ctx.lineTo(ox + 1.04 * S, oy + yTop(1) * S);
    ctx.lineTo(ox + 1.04 * S, oy + 1.04 * S);
    ctx.closePath();
  }

  function drawRing(g, S, ox, oy, t) {
    var wob = 0.006 * Math.sin((t / LOOP) * Math.PI * 2 * g.speed + g.phase);
    var R = (g.r + wob) * S;
    ctx.beginPath();
    var steps = 40;
    for (var i = 0; i <= steps; i++) {
      var a = (i / steps) * Math.PI * 2;
      var rr = R * (1 + 0.055 * Math.sin(3 * a + g.wob1) + 0.04 * Math.sin(5 * a - g.wob2));
      var px = ox + g.cx * S + Math.cos(a) * rr;
      var py = oy + g.cy * S + Math.sin(a) * rr * g.squash;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  }

  function drawLoose(g, S, ox, oy, t) {
    var off = 0.010 * Math.sin((t / LOOP) * Math.PI * 2 * g.speed + g.phase);
    var x0 = ox + g.x0 * S, y0 = oy + g.y0 * S;
    var x1 = ox + (g.x1 + off) * S, y1 = oy + (g.y1 + off * 0.7) * S;
    var x2 = ox + g.x2 * S, y2 = oy + g.y2 * S;
    // curl: hook the end back around
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = (-dy / len) * g.curl * S, ny = (dx / len) * g.curl * S;
    var cxp = x2 + dx / len * g.curl * S * 0.4 + nx;
    var cyp = y2 + dy / len * g.curl * S * 0.4 + ny;
    var ex = x2 + nx * 1.4, ey = y2 + ny * 1.4;
    ctx.lineWidth = g.w * S;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(x1, y1, x2, y2);
    ctx.quadraticCurveTo(cxp, cyp, ex, ey);
    ctx.stroke();
  }

  function drawFace(S, ox, oy, t) {
    var fx = ox + (0.685 + faceJit.x) * S;
    var fy = oy + (0.375 + faceJit.y) * S;

    // clean patch of pasta over the coils, same yellow: erases the
    // strand gaps inside the face zone so the features read flat
    ctx.fillStyle = PASTA;
    ctx.beginPath();
    ctx.ellipse(fx, fy, 0.180 * S, 0.148 * S, 0, 0, Math.PI * 2);
    ctx.fill();

    // blink: eyes close briefly once per BLINK_PERIOD
    var bt = t % BLINK_PERIOD;
    var open = 1;
    if (bt < 0.16) {
      var k = bt / 0.16;
      open = 1 - Math.sin(k * Math.PI) * 0.92;
    }
    if (open < 0.08) open = 0.08;

    // eyes: two big black ovals
    ctx.fillStyle = INK;
    var eo = 0.052 * S;
    for (var e = -1; e <= 1; e += 2) {
      ctx.beginPath();
      ctx.ellipse(fx + e * eo, fy - 0.028 * S, 0.031 * S, 0.053 * S * open, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // red brow arcs
    ctx.strokeStyle = RED;
    ctx.lineWidth = 0.013 * S;
    ctx.lineCap = 'round';
    for (var b = -1; b <= 1; b += 2) {
      ctx.beginPath();
      ctx.arc(fx + b * eo, fy - 0.062 * S, 0.047 * S, Math.PI * 1.18, Math.PI * 1.86);
      ctx.stroke();
    }

    // toothy grin: red band, sawtooth lower edge
    var mw = 0.215 * S, mh = 0.058 * S;
    var mx = fx - mw / 2, my = fy + 0.062 * S;
    var teeth = 7;
    ctx.fillStyle = RED;
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.quadraticCurveTo(fx, my - 0.020 * S, mx + mw, my);
    for (var i = teeth; i >= 0; i--) {
      var tx = mx + (i / teeth) * mw;
      var ty = my + ((i % 2 === 0) ? mh : mh * 0.35);
      ctx.lineTo(tx, ty);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawWaiter(S, ox, oy, t) {
    // tiny figure, ~1/12 the mass height, bottom-right
    var h = 0.068 * S;
    var bx = ox + 0.905 * S;
    var by = oy + 0.995 * S;                 // feet line
    var tremble = 0.0018 * S * Math.sin(t * 47.0);

    ctx.save();
    ctx.translate(bx, by);
    if (waiterPose === 2) ctx.rotate(-0.28); // fleeing lean

    // legs
    ctx.strokeStyle = SUIT;
    ctx.lineWidth = 0.11 * h;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (waiterPose === 2) {
      ctx.moveTo(0, -0.30 * h); ctx.lineTo(-0.16 * h, -0.06 * h);
      ctx.moveTo(0, -0.30 * h); ctx.lineTo(0.20 * h, -0.14 * h);
    } else {
      ctx.moveTo(-0.07 * h, -0.30 * h); ctx.lineTo(-0.07 * h, -0.04 * h);
      ctx.moveTo(0.07 * h, -0.30 * h); ctx.lineTo(0.07 * h, -0.04 * h);
    }
    ctx.stroke();

    // shoes
    ctx.fillStyle = SHOE;
    if (waiterPose === 2) {
      ctx.fillRect(-0.24 * h, -0.09 * h, 0.17 * h, 0.07 * h);
      ctx.fillRect(0.13 * h, -0.17 * h, 0.17 * h, 0.07 * h);
    } else {
      ctx.fillRect(-0.15 * h, -0.055 * h, 0.17 * h, 0.06 * h);
      ctx.fillRect(0.0, -0.055 * h, 0.17 * h, 0.06 * h);
    }

    // torso
    ctx.fillStyle = SUIT;
    ctx.beginPath();
    ctx.moveTo(-0.17 * h, -0.30 * h);
    ctx.lineTo(0.17 * h, -0.30 * h);
    ctx.lineTo(0.13 * h, -0.62 * h);
    ctx.lineTo(-0.13 * h, -0.62 * h);
    ctx.closePath();
    ctx.fill();

    // arms, trembling
    ctx.strokeStyle = SUIT;
    ctx.lineWidth = 0.09 * h;
    ctx.beginPath();
    if (waiterPose === 0) {          // arms up
      ctx.moveTo(-0.13 * h, -0.58 * h); ctx.lineTo(-0.30 * h + tremble, -0.88 * h);
      ctx.moveTo(0.13 * h, -0.58 * h); ctx.lineTo(0.30 * h + tremble, -0.88 * h);
    } else if (waiterPose === 1) {   // arms out
      ctx.moveTo(-0.13 * h, -0.58 * h); ctx.lineTo(-0.36 * h + tremble, -0.55 * h);
      ctx.moveTo(0.13 * h, -0.58 * h); ctx.lineTo(0.36 * h + tremble, -0.55 * h);
    } else {                          // fleeing, arms back
      ctx.moveTo(-0.13 * h, -0.58 * h); ctx.lineTo(-0.34 * h + tremble, -0.38 * h);
      ctx.moveTo(0.13 * h, -0.58 * h); ctx.lineTo(-0.28 * h + tremble, -0.30 * h);
    }
    ctx.stroke();

    // hands
    ctx.fillStyle = SKIN;
    var hands = waiterPose === 0 ? [[-0.30, -0.88], [0.30, -0.88]]
      : waiterPose === 1 ? [[-0.36, -0.55], [0.36, -0.55]]
      : [[-0.34, -0.38], [-0.28, -0.30]];
    for (var i = 0; i < 2; i++) {
      ctx.beginPath();
      ctx.arc(hands[i][0] * h + tremble, hands[i][1] * h, 0.055 * h, 0, Math.PI * 2);
      ctx.fill();
    }

    // head
    ctx.beginPath();
    ctx.arc(0, -0.78 * h, 0.155 * h, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  var currentT = PHASE;

  function draw(t) {
    currentT = t;
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // square stage, centred; page ground is the near-black everywhere
    var S = Math.min(W, H);
    var ox = (W - S) / 2, oy = (H - S) / 2;

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // static grain specks on the ground
    for (var i = 0; i < grain.length; i++) {
      var g = grain[i];
      ctx.fillStyle = g.c;
      var gs = Math.max(1, g.s * S);
      ctx.fillRect(ox + g.x * S, oy + g.y * S, gs, gs);
    }

    // coiled strands, clipped to the dome
    ctx.save();
    domePath(S, ox, oy);
    ctx.clip();
    ctx.strokeStyle = PASTA;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 0.026 * S;
    for (var r = 0; r < rings.length; r++) drawRing(rings[r], S, ox, oy, t);
    ctx.restore();

    // loose strands spilling out of the mass
    ctx.strokeStyle = PASTA;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var l = 0; l < loose.length; l++) drawLoose(loose[l], S, ox, oy, t);

    drawFace(S, ox, oy, t);
    drawWaiter(S, ox, oy, t);
  }

  // double-tap reseeds the scene (never a page reload)
  var lastTapT = -10;
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function () {
      if (currentT - lastTapT < 0.35) {
        seedIndex++;
        buildScene(BASE_SEED + seedIndex * 7919);
        draw(currentT);
        lastTapT = -10;
      } else {
        lastTapT = currentT;
      }
    });
  }

  buildScene(BASE_SEED);
  resize();
  draw(PHASE);

  var startStamp = null;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (stamp) {
      if (startStamp === null) startStamp = stamp;
      var elapsed = (stamp - startStamp) / 1000;
      draw(PHASE + elapsed);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
