<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alley, Third Mint</title>
<style>
html, body { margin: 0; padding: 0; background: #F2F1EC; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = [242, 241, 236];
var INK = [25, 25, 32];
var SCRIBBLE = [51, 49, 44];
var SUN = [20, 20, 22];
var PHASE = 10.0;
var SEED = 1608001;
var VPX = 0.5, VPY = 0.44;
var WALL_TOP_Y = 0.16;
var SUNX = 0.5, SUNY = 0.33;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}

/* ---- drag: recorded samples only; displacement is a closed-form
   sum over samples, never frame-integrated state ---- */
var drags = [];
var dragging = false;
function recordDrag(x, y) {
  drags.push({ x: x, y: y, t: lastT });
  while (drags.length > 40) drags.shift();
}
function disp(x, y, t) {
  var dx = 0, dy = 0, i, d, dt, w, ddx, ddy, d2, fall, dist, m;
  for (i = 0; i < drags.length; i++) {
    d = drags[i];
    dt = t - d.t;
    if (dt < 0 || dt > 6) continue;
    w = Math.exp(-dt / 1.8);
    ddx = x - d.x; ddy = y - d.y;
    d2 = ddx * ddx + ddy * ddy;
    fall = Math.exp(-d2 / (2 * 0.11 * 0.11));
    if (fall < 0.01) continue;
    dist = Math.sqrt(d2) + 1e-4;
    m = 0.035 * w * fall;
    dx += (ddx / dist) * m;
    dy += (ddy / dist) * m - 0.25 * m;
  }
  var mag = Math.sqrt(dx * dx + dy * dy);
  if (mag > 0.05) { dx *= 0.05 / mag; dy *= 0.05 / mag; }
  return { dx: dx, dy: dy };
}

/* ---- seeded geometry: wobble baked in at load, never Math.random ---- */
function wobbleLine(pts, amp, rng) {
  var out = [], i, p;
  for (i = 0; i < pts.length; i++) {
    p = pts[i];
    out.push({ x: p.x + (rng() - 0.5) * amp, y: p.y + (rng() - 0.5) * amp });
  }
  return out;
}
/* sky: horizontal hatch, spacing tightening toward the horizon */
var SKY = (function () {
  var rng = mulberry32(SEED + 3);
  var lines = [], y = 0.006, ph, x0, x1, f, i, n, pts, sp;
  while (y < 0.435) {
    if (y <= WALL_TOP_Y) { x0 = 0.004; x1 = 0.996; }
    else { f = (y - WALL_TOP_Y) / (VPY - WALL_TOP_Y); x0 = 0.5 * f + 0.004; x1 = 1 - 0.5 * f - 0.004; }
    ph = rng() * TAU;
    n = 26;
    pts = [];
    for (i = 0; i <= n; i++) {
      pts.push({ x: x0 + (x1 - x0) * (i / n), y: y + 0.0012 * Math.sin(i * 0.9 + ph) + (rng() - 0.5) * 0.0009 });
    }
    lines.push({ pts: pts, y: y, phase: ph, alpha: 0.48 + 0.44 * (y / 0.44) });
    sp = 0.016 * (1 - 0.7 * Math.pow(y / 0.44, 1.5));
    y += sp;
  }
  return lines;
})();
/* walls: vertical scribble strokes, denser at the outer edges */
function genWall(side) {
  var rng = mulberry32(SEED + (side < 0 ? 11 : 23));
  var strokes = [], i, u, v, x, y, edge, len, ang, j, pts, px, py;
  for (i = 0; i < 780; i++) {
    u = rng(); v = rng();
    if (u + v > 1) { u = 1 - u; v = 1 - v; }
    /* triangle: (outer top) (outer bottom) VP */
    x = side < 0 ? u * 0 + v * 0.5 : 1 - v * 0.5;
    y = WALL_TOP_Y + u * (1 - WALL_TOP_Y) + v * (VPY - WALL_TOP_Y);
    if (side < 0) x = v * 0.5; else x = 1 - v * 0.5;
    edge = side < 0 ? (1 - x / 0.5) : ((x - 0.5) / 0.5);
    if (rng() > 0.3 + 0.7 * edge) continue;
    len = 0.02 + rng() * 0.05;
    ang = (rng() - 0.5) * 0.24;
    pts = [];
    for (j = 0; j <= 4; j++) {
      var k = j / 4 - 0.5;
      px = x + Math.sin(ang) * len * k + (rng() - 0.5) * 0.0016;
      py = y + Math.cos(ang) * len * k + (rng() - 0.5) * 0.0016;
      pts.push({ x: px, y: py });
    }
    strokes.push({ pts: pts, ink: rng() < 0.22, alpha: (0.42 + 0.42 * rng()) * (0.55 + 0.45 * edge) });
  }
  return strokes;
}
var WALL_L = genWall(-1), WALL_R = genWall(1);
/* wall boundary lines: wobbly etched perspective edges */
function edgeLine(x0, y0, x1, y1, seedOff) {
  var rng = mulberry32(SEED + seedOff);
  var pts = [], i, n = 22, ph = rng() * TAU;
  for (i = 0; i <= n; i++) {
    var k = i / n;
    pts.push({
      x: x0 + (x1 - x0) * k + 0.0016 * Math.sin(k * 9 + ph) + (rng() - 0.5) * 0.0012,
      y: y0 + (y1 - y0) * k + 0.0016 * Math.cos(k * 7 + ph) + (rng() - 0.5) * 0.0012
    });
  }
  return pts;
}
var EDGES = [
  edgeLine(0, WALL_TOP_Y, VPX, VPY, 31),
  edgeLine(1, WALL_TOP_Y, VPX, VPY, 37),
  edgeLine(0, 1, VPX, VPY, 41),
  edgeLine(1, 1, VPX, VPY, 43)
];
/* ground: converging lines from the vanishing point plus horizontal
   hatch denser near the vanishing point */
var GROUND_FAN = (function () {
  var rng = mulberry32(SEED + 53);
  var lines = [], bx, pts, i, n = 16, ph;
  for (bx = 0.02; bx <= 0.99; bx += 0.045) {
    ph = rng() * TAU;
    pts = [];
    for (i = 0; i <= n; i++) {
      var k = 0.08 + 0.92 * (i / n);
      pts.push({
        x: VPX + (bx - VPX) * k + 0.0014 * Math.sin(k * 8 + ph),
        y: VPY + (1 - VPY) * k + 0.0014 * Math.cos(k * 6 + ph)
      });
    }
    lines.push(pts);
  }
  return lines;
})();
var GROUND_H = (function () {
  var rng = mulberry32(SEED + 59);
  var lines = [], y = 0.49, ph, hw, x0, x1, i, n, pts, sp;
  while (y < 0.995) {
    hw = ((y - VPY) / (1 - VPY)) * 0.5;
    x0 = 0.5 - hw + 0.004; x1 = 0.5 + hw - 0.004;
    ph = rng() * TAU;
    n = 20;
    pts = [];
    for (i = 0; i <= n; i++) {
      pts.push({ x: x0 + (x1 - x0) * (i / n), y: y + 0.001 * Math.sin(i * 1.1 + ph) + (rng() - 0.5) * 0.0008 });
    }
    lines.push({ pts: pts, alpha: 0.42 - 0.22 * ((y - VPY) / (1 - VPY)) });
    sp = 0.008 + 0.028 * ((y - VPY) / (1 - VPY));
    y += sp;
  }
  return lines;
})();
/* cityscape: a band of hatched rectangles on the horizon */
var CITY = (function () {
  var rng = mulberry32(SEED + 67);
  var out = [], x = 0.26, w, top, cx, i, j, hy, pts, ph;
  while (x < 0.74) {
    w = 0.022 + rng() * 0.02;
    top = 0.40 + rng() * 0.055;
    cx = x + w / 2;
    if (Math.abs(cx - 0.5) < 0.09 && top < 0.415) top = 0.415 + rng() * 0.01;
    var rect = [
      { x: x, y: 0.485 }, { x: x, y: top },
      { x: x + w, y: top }, { x: x + w, y: 0.485 }
    ];
    rect = wobbleLine(rect, 0.0012, rng);
    var hatch = [];
    for (hy = top + 0.006; hy < 0.482; hy += 0.0055) {
      ph = rng() * TAU;
      pts = [];
      for (j = 0; j <= 8; j++) {
        pts.push({ x: x + 0.001 + w * (j / 8), y: hy + 0.0007 * Math.sin(j * 1.3 + ph) });
      }
      hatch.push(pts);
    }
    out.push({ rect: rect, hatch: hatch });
    x += w + 0.004 + rng() * 0.008;
  }
  return out;
})();
/* sun: dense concentric oval rings, no fill, the one fixed thing */
var SUN_RINGS = (function () {
  var rng = mulberry32(SEED + 71);
  var rings = [], rx, i, n = 44, ph, pts, a;
  for (rx = 0.008; rx <= 0.072; rx += 0.0026) {
    ph = rng() * TAU;
    pts = [];
    for (i = 0; i <= n; i++) {
      a = (i / n) * TAU;
      pts.push({
        x: SUNX + rx * Math.cos(a) + 0.0012 * Math.sin(a * 3 + ph),
        y: SUNY + rx * 0.74 * Math.sin(a) + 0.0012 * Math.cos(a * 3 + ph)
      });
    }
    rings.push(pts);
  }
  return rings;
})();

function strokePts(pts, rect, t, useDrag, color, alpha, lw, sy, pivotY) {
  if (alpha <= 0.005) return;
  if (sy === undefined) sy = 1;
  if (pivotY === undefined) pivotY = 0;
  ctx.strokeStyle = rgba(color, alpha);
  ctx.lineWidth = Math.max(1, lw);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  var i, p, d;
  for (i = 0; i < pts.length; i++) {
    p = pts[i];
    var px = rect.x + p.x * rect.w, py = rect.y + (pivotY + (p.y - pivotY) * sy) * rect.h;
    if (useDrag && drags.length) {
      d = disp(p.x, p.y, t);
      px += d.dx * rect.w; py += d.dy * rect.h;
    }
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = 'rgb(' + PAPER[0] + ',' + PAPER[1] + ',' + PAPER[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var rect = compRect();
  var u = rect.w / 100;
  var i, j, b, line, lw;
  var hasDrag = drags.length > 0;
  /* sky: horizontal hatch, breathing almost imperceptibly */
  for (i = 0; i < SKY.length; i++) {
    line = SKY[i];
    var shimmer = reduced ? 1 : 1 + 0.07 * Math.sin(TAU * t / 26 + line.phase);
    strokePts(line.pts, rect, t, hasDrag, INK, clamp(line.alpha * shimmer, 0, 1), 0.0011 * rect.w);
  }
  /* cityscape band on the horizon */
  for (i = 0; i < CITY.length; i++) {
    b = CITY[i];
    for (j = 0; j < b.hatch.length; j++) {
      strokePts(b.hatch[j], rect, t, hasDrag, INK, 0.75, 0.0009 * rect.w);
    }
    ctx.strokeStyle = rgba(INK, 0.9);
    ctx.lineWidth = Math.max(1, 0.0013 * rect.w);
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(rect.x + b.rect[0].x * rect.w, rect.y + b.rect[0].y * rect.h);
    for (j = 1; j < b.rect.length; j++) {
      ctx.lineTo(rect.x + b.rect[j].x * rect.w, rect.y + b.rect[j].y * rect.h);
    }
    ctx.closePath();
    ctx.stroke();
  }
  /* ground: fan lines and horizontal hatch */
  for (i = 0; i < GROUND_FAN.length; i++) {
    strokePts(GROUND_FAN[i], rect, t, hasDrag, INK, 0.3, 0.0009 * rect.w);
  }
  for (i = 0; i < GROUND_H.length; i++) {
    line = GROUND_H[i];
    strokePts(line.pts, rect, t, hasDrag, INK, line.alpha, 0.0009 * rect.w);
  }
  /* walls: vertical scribble */
  for (i = 0; i < WALL_L.length; i++) {
    line = WALL_L[i];
    strokePts(line.pts, rect, t, hasDrag, line.ink ? INK : SCRIBBLE, line.alpha, 0.0011 * rect.w);
  }
  for (i = 0; i < WALL_R.length; i++) {
    line = WALL_R[i];
    strokePts(line.pts, rect, t, hasDrag, line.ink ? INK : SCRIBBLE, line.alpha, 0.0011 * rect.w);
  }
  /* perspective edges, etched */
  for (i = 0; i < EDGES.length; i++) {
    strokePts(EDGES[i], rect, t, false, INK, 0.85, 0.0016 * rect.w);
  }
  /* sun: fixed concentric rings, never displaced, never moving;
     y-scaled so the oval stays round when the frame is not square */
  var sunSy = rect.w / rect.h;
  for (i = 0; i < SUN_RINGS.length; i++) {
    strokePts(SUN_RINGS[i], rect, t, false, SUN, 0.95, 0.0022 * rect.w, sunSy, SUNY);
  }
  /* title and date, as in the shipped siblings */
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba(INK, 0.78);
  ctx.fillText('Alley, Third Mint', rect.x + rect.w / 2, rect.y + Math.max(6, 0.016 * rect.h));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK, 0.6);
  ctx.fillText('2006 · 06 · 07', rect.x + rect.w / 2, rect.y + Math.max(6, 0.016 * rect.h) + titlePx + 5);
}

function toUnit(e) {
  var rect = compRect();
  var r = { left: 0, top: 0 };
  if (typeof canvas.getBoundingClientRect === 'function') r = canvas.getBoundingClientRect();
  var cx = (typeof e.clientX === 'number') ? e.clientX : 0;
  var cy = (typeof e.clientY === 'number') ? e.clientY : 0;
  return { x: clamp((cx - r.left - rect.x) / rect.w, -0.2, 1.2), y: clamp((cy - r.top - rect.y) / rect.h, -0.2, 1.2) };
}
function onDown(e) { dragging = true; var p = toUnit(e); recordDrag(p.x, p.y); }
function onMove(e) { if (!dragging) return; var p = toUnit(e); recordDrag(p.x, p.y); }
function onUp() { dragging = false; }
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointerleave', onUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
