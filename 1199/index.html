<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glitch School Lesson</title>
<style>
  html, body { margin: 0; padding: 0; background: #0C0C0E; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function () {
  'use strict';

  // ---------- deterministic hashes (seeded only; no Math.random) ----------
  function h2(a, b) {
    var x = ((a * 374761393 + b * 668265263) ^ 0x5bf03635) >>> 0;
    x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  var TAU = Math.PI * 2;

  // ---------- constants ----------
  var T0 = 20;                    // fixed first-frame phase: lesson 1 mid-demo
  var LESSON_DUR = 45;            // one lesson = 45 s
  var WIPE_DUR = 1.5;             // chalk-dust wipe between lessons
  var PERIOD = LESSON_DUR + WIPE_DUR;   // 46.5 s per lesson slot

  var COL = {
    board: '#0C0C0E', chalk: '#EDEDED',
    amber: '#FFB000', cyan: '#00E5FF', red: '#FF2B2B', dust: '#4A4A4E'
  };

  var APHORISMS = [
    'Glitch Art is the Art of Surprise',
    'Technology is a source of questions, not answers',
    'Value unexpected outcomes'
  ];

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var isPhone = false;
  if (typeof window !== 'undefined' && window.screen) {
    isPhone = Math.min(window.screen.width || 9999, window.screen.height || 9999) < 700;
  }
  function fit() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 1280);
    var h = vv ? vv.height : (window.innerHeight || 800);
    if (!isPhone && h > w * 1.15) isPhone = true; // aspect fallback
    DPR = Math.min((typeof window !== 'undefined' && window.devicePixelRatio) || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px';   // pin CSS size in fit/draw path
    canvas.style.height = h + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  fit();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(currentT()); });
    }
    window.addEventListener('resize', function () { fit(); draw(currentT()); });
  }

  function pieceNow() { return T0 + (performance.now() - startStamp) / 1000; }
  var startStamp = (typeof performance !== 'undefined') ? performance.now() : 0;
  function currentT() { return pieceNow(); }

  // ---------- layout ----------
  function marginX() { return W * 0.08; }
  function demoX() { return W * 0.08; }
  function demoW() { return W * 0.84; }
  function demoTop() { return H * 0.24; }
  function demoH() { return H * 0.72; }

  // ---------- small draw helpers (house arc rule: moveTo before each arc) ----------
  function dot(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }
  function arcPath(x, y, r, a0, a1) {
    ctx.beginPath();
    ctx.moveTo(x + r * Math.cos(a0), y + r * Math.sin(a0));
    ctx.arc(x, y, r, a0, a1);
  }

  // ---------- lesson clock ----------
  // lesson k occupies [k*PERIOD, k*PERIOD+45); the wipe [k*PERIOD+45, (k+1)*PERIOD)
  // belongs to the transition into lesson k+1, whose aphorism already types
  // during the wipe (typing clock starts at the wipe, runs 3 s).
  function lessonAt(t) { return Math.floor(t / PERIOD); }
  function lessonLocal(t) { return t - lessonAt(t) * PERIOD; }

  // ---------- aphorism (chalk, typed, per-letter jitter) ----------
  function drawAphorism(k, t) {
    var type = k % 3;
    var text = APHORISMS[type];
    var tag = 'LESSON ' + (type + 1);
    var tStart = k * PERIOD - (k > 0 ? WIPE_DUR : 0);   // typing begins in the wipe
    var typeAge = t - tStart;
    if (typeAge < 0) return;
    var shown = typeAge >= 3 ? text.length
      : Math.floor(clamp(typeAge / 3, 0, 1) * (text.length + 1));
    if (shown > text.length) shown = text.length;

    var f0 = H * 0.045;
    ctx.font = f0 + 'px "DejaVu Sans Mono", "Courier New", monospace';
    var charW = ctx.measureText('M').width;
    var totalChars = tag.length + 2 + text.length;
    var f = f0;
    if (charW * totalChars > W * 0.84) {
      f = f0 * (W * 0.84) / (charW * totalChars);
      ctx.font = f + 'px "DejaVu Sans Mono", "Courier New", monospace';
      charW = ctx.measureText('M').width;
    }
    var x0 = marginX();
    var yBase = H * 0.155;
    ctx.textBaseline = 'alphabetic';

    // tag, amber, always whole
    ctx.font = 'bold ' + f + 'px "DejaVu Sans Mono", "Courier New", monospace';
    ctx.fillStyle = COL.amber;
    var i;
    for (i = 0; i < tag.length; i++) {
      ctx.fillText(tag[i], x0 + i * charW, yBase + (h2(k * 91 + i, 41) - 0.5) * f * 0.10);
    }
    // aphorism, chalk, typed letter by letter
    ctx.font = f + 'px "DejaVu Sans Mono", "Courier New", monospace';
    ctx.fillStyle = COL.chalk;
    var ax = x0 + (tag.length + 2) * charW;
    for (i = 0; i < shown; i++) {
      ctx.fillText(text[i], ax + i * charW,
        yBase + (h2(k * 131 + i, 7) - 0.5) * f * 0.16);
    }
    // chalk block cursor at the typing head, while typing
    if (shown < text.length && Math.floor(t * 2.4) % 2 === 0) {
      ctx.globalAlpha = 0.55;
      ctx.fillRect(ax + shown * charW + 1, yBase - f * 0.78, charW * 0.72, f * 0.92);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- demo 1: pixel-sort horizon ----------
  var BANDS = [
    { c: '#152A44', f: 0.30 },   // deep blue
    { c: '#1E5A55', f: 0.52 },   // teal
    { c: '#FFB000', f: 0.585 },  // amber strip
    { c: '#E9DFC4', f: 0.64 },   // pale horizon
    { c: '#0D1220', f: 1.00 }    // dark ground
  ];
  // streaks hang from these boundaries: boundary idx -> {color, maxLen (frac of demoH)}
  var STREAKS = [
    { b: 0, c: '#2A4A73', max: 0.10 },
    { b: 1, c: '#1E5A55', max: 0.22 },
    { b: 2, c: '#FFB000', max: 0.34 },
    { b: 3, c: '#E9DFC4', max: 0.26 }
  ];
  function sortDepth(col, step) {
    var ph = step * 0.15;
    var wave = 0.5 + 0.5 * Math.sin(col * 0.13 - ph * 1.7);
    return clamp(0.15 + 0.75 * wave * (0.55 + 0.45 * h2(col, step)), 0, 1);
  }
  function drawSortHorizon(lt) {
    var x = demoX(), w = demoW(), y0 = demoTop(), hh = demoH();
    var i, j;
    // flat bands
    var prev = 0;
    for (i = 0; i < BANDS.length; i++) {
      ctx.fillStyle = BANDS[i].c;
      ctx.fillRect(x, y0 + prev * hh, w, (BANDS[i].f - prev) * hh + 1);
      prev = BANDS[i].f;
    }
    // sun disc on the horizon line
    var sunX = x + w * 0.62, sunY = y0 + hh * 0.64, sunR = hh * 0.085;
    ctx.fillStyle = '#F2E3B6';
    dot(sunX, sunY, sunR);
    ctx.fillStyle = COL.amber;
    dot(sunX, sunY, sunR * 0.55);
    // pixel-sort streaks, redrawn in 0.15 s steps
    var step = Math.floor(lt / 0.15);
    var colW = Math.max(3, Math.round(w / 220));
    var cols = Math.ceil(w / colW);
    for (i = 0; i < cols; i++) {
      var d = sortDepth(i, step);
      if (d < 0.18) continue;
      var cx = x + i * colW;
      for (j = 0; j < STREAKS.length; j++) {
        var st = STREAKS[j];
        var by = y0 + BANDS[st.b].f * hh;
        var len = d * st.max * hh * (0.45 + 0.55 * h2(i * 7 + j, step));
        if (len < 3) continue;
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = st.c;
        ctx.fillRect(cx, by, Math.max(1.5, colW * 0.62), len);
        ctx.globalAlpha = 0.85;
        ctx.fillRect(cx, by, Math.max(1.5, colW * 0.62), len * 0.4);
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---------- demo 2: the circle that refuses to close ----------
  function circleGeom(a) {
    // attempt a: hashed start + endpoint error in [-40deg, +25deg]
    var start = -Math.PI / 2 + (h2(a, 11) - 0.5) * 0.6;
    var err = (-40 + 65 * h2(a, 7)) * Math.PI / 180;
    return { start: start, span: TAU + err };
  }
  function drawUnclosing(lt) {
    var cx = W / 2, cy = demoTop() + demoH() * 0.52;
    var R = Math.min(demoH() * 0.34, demoW() * 0.30);
    var a = Math.floor(lt / 2.5);
    var i, g;
    // ghost attempts: the board remembers the failures
    for (i = Math.max(0, a - 5); i < a; i++) {
      g = circleGeom(i);
      ctx.globalAlpha = 0.12;
      ctx.strokeStyle = COL.chalk;
      ctx.lineWidth = 2;
      arcPath(cx, cy, R, g.start, g.start + g.span);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // current attempt
    g = circleGeom(a);
    ctx.strokeStyle = COL.chalk;
    ctx.lineWidth = 3;
    arcPath(cx, cy, R, g.start, g.start + g.span);
    ctx.stroke();
    // the true close point, faint
    var sx = cx + R * Math.cos(g.start), sy = cy + R * Math.sin(g.start);
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = COL.chalk;
    dot(sx, sy, 3);
    ctx.globalAlpha = 1;
    // endpoint: amber dot + red tick — the miss, marked
    var ea = g.start + g.span;
    var ex = cx + R * Math.cos(ea), ey = cy + R * Math.sin(ea);
    ctx.fillStyle = COL.amber;
    dot(ex, ey, 4.5);
    ctx.strokeStyle = COL.red;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx + (R - 11) * Math.cos(ea), cy + (R - 11) * Math.sin(ea));
    ctx.lineTo(cx + (R + 11) * Math.cos(ea), cy + (R + 11) * Math.sin(ea));
    ctx.stroke();
  }

  // ---------- demo 3: the moth ----------
  function mothPos(lt) {
    return {
      x: W / 2 + Math.sin(lt * 0.43 + 1.7) * demoW() * 0.36,
      y: demoTop() + demoH() * 0.5 + Math.sin(lt * 0.71) * demoH() * 0.30
    };
  }
  var ART_COLORS = [COL.amber, COL.cyan, COL.red, COL.chalk, COL.dust];
  var ART_GLYPHS = ['!', '<', '>', '/', '#', '%', '&', '?'];
  function drawArtifact(b, lt) {
    var born = b * 0.55;
    var age = lt - born;
    if (age < 0 || age >= 3) return;
    var p = mothPos(born);
    var type = Math.floor(h2(b, 3) * 5);
    var col = ART_COLORS[Math.floor(h2(b, 5) * ART_COLORS.length)];
    var size = (16 + h2(b, 9) * 26) * (demoH() / 560);
    var stepA = [1, 0.75, 0.5, 0.3, 0.15][Math.min(4, Math.floor(age / 3 * 5))];
    ctx.globalAlpha = stepA;
    var x = p.x + (h2(b, 13) - 0.5) * 30, y = p.y + (h2(b, 17) - 0.5) * 30;
    if (type === 0) {           // block
      ctx.fillStyle = col;
      ctx.fillRect(x - size / 2, y - size / 3, size, size * 0.66);
    } else if (type === 1) {    // tear line
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x - size, y);
      ctx.lineTo(x - size * 0.15, y);
      ctx.moveTo(x - size * 0.15, y - size * 0.22);
      ctx.lineTo(x + size, y - size * 0.22);
      ctx.stroke();
    } else if (type === 2) {    // RGB split rect
      ctx.lineWidth = 2;
      ctx.strokeStyle = COL.cyan;
      ctx.strokeRect(x - size / 2 - 4, y - size / 3, size, size * 0.66);
      ctx.strokeStyle = '#FF2BD1';
      ctx.strokeRect(x - size / 2 + 4, y - size / 3, size, size * 0.66);
      ctx.strokeStyle = COL.chalk;
      ctx.strokeRect(x - size / 2, y - size / 3, size, size * 0.66);
    } else if (type === 3) {    // static burst square
      var cell = size / 5, r, c2;
      for (r = 0; r < 5; r++) {
        for (c2 = 0; c2 < 5; c2++) {
          if (h2(b * 31 + r * 5 + c2, Math.floor(lt * 6)) > 0.45) {
            ctx.fillStyle = (r + c2) % 3 === 0 ? col : COL.chalk;
            ctx.fillRect(x - size / 2 + c2 * cell, y - size / 2 + r * cell, cell - 0.5, cell - 0.5);
          }
        }
      }
    } else {                    // stray glyph
      ctx.fillStyle = col;
      ctx.font = 'bold ' + size + 'px "DejaVu Sans Mono", "Courier New", monospace';
      ctx.textBaseline = 'middle';
      ctx.fillText(ART_GLYPHS[Math.floor(h2(b, 21) * ART_GLYPHS.length)], x - size * 0.3, y);
      ctx.textBaseline = 'alphabetic';
    }
    ctx.globalAlpha = 1;
  }
  function drawMoth(lt) {
    // artifacts first (under the moth), one per wingbeat, life 3 s
    var beats = Math.floor(lt / 0.55);
    for (var b = Math.max(1, beats - 8); b <= beats; b++) drawArtifact(b, lt);

    var p = mothPos(lt);
    var m = clamp(demoH() * 0.085, 20, 42);          // moth size unit
    var flap = Math.sin(lt * TAU / 0.55);            // one full flap per wingbeat (0.55 s), synced to artifact spawns
    var tilt = 0.35 * Math.sin(lt * 0.71 + 0.8);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(tilt);
    var s, wpts, i;
    // wings: fore + hind, each side; polygon points ride the flap
    for (s = -1; s <= 1; s += 2) {
      var lift = flap * m * 0.38;
      // forewing
      ctx.beginPath();
      wpts = [
        [s * m * 0.10, -m * 0.18],
        [s * m * 1.25, -m * 0.72 - lift],
        [s * m * 1.45, -m * 0.05 - lift * 0.4],
        [s * m * 0.35, m * 0.22]
      ];
      ctx.moveTo(wpts[0][0], wpts[0][1]);
      for (i = 1; i < wpts.length; i++) ctx.lineTo(wpts[i][0], wpts[i][1]);
      ctx.closePath();
      ctx.globalAlpha = 0.10;
      ctx.fillStyle = COL.chalk;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = COL.chalk;
      ctx.lineWidth = 2;
      ctx.stroke();
      // hindwing
      ctx.beginPath();
      wpts = [
        [s * m * 0.08, m * 0.16],
        [s * m * 0.95, m * 0.42 - lift * 0.5],
        [s * m * 0.72, m * 0.78],
        [s * m * 0.10, m * 0.52]
      ];
      ctx.moveTo(wpts[0][0], wpts[0][1]);
      for (i = 1; i < wpts.length; i++) ctx.lineTo(wpts[i][0], wpts[i][1]);
      ctx.closePath();
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = COL.chalk;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.stroke();
      // amber wing spots
      ctx.fillStyle = COL.amber;
      dot(s * m * 0.95, -m * 0.38 - lift * 0.8, m * 0.09);
      dot(s * m * 0.55, m * 0.48 - lift * 0.3, m * 0.07);
      // antenna
      ctx.strokeStyle = COL.chalk;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(s * m * 0.06, -m * 0.52);
      ctx.lineTo(s * m * 0.34, -m * 0.95 - lift * 0.2);
      ctx.stroke();
    }
    // body: pointed-ellipse polygon (no ctx.ellipse — house rule)
    ctx.beginPath();
    var bp = 12, bi, ba, br;
    for (bi = 0; bi <= bp; bi++) {
      ba = bi / bp * TAU;
      br = 1 - 0.25 * Math.abs(Math.sin(ba));
      var bx = Math.sin(ba) * m * 0.20 * br;
      var by = -Math.cos(ba) * m * 0.62;
      if (bi === 0) ctx.moveTo(bx, by); else ctx.lineTo(bx, by);
    }
    ctx.closePath();
    ctx.fillStyle = COL.chalk;
    ctx.fill();
    // head
    ctx.fillStyle = COL.chalk;
    dot(0, -m * 0.60, m * 0.16);
    ctx.fillStyle = COL.red;
    dot(-m * 0.06, -m * 0.62, m * 0.045);
    dot(m * 0.06, -m * 0.62, m * 0.045);
    ctx.restore();
  }

  // ---------- chalk-dust wipe ----------
  function drawWipe(k, wipeT) {
    // dust seeded by the outgoing lesson k; points burst outward and fade
    var prog = wipeT / WIPE_DUR;
    var n = 110, i;
    for (i = 0; i < n; i++) {
      var ox = W * (0.08 + 0.84 * h2(i, k * 3 + 1));
      var oy = H * (0.06 + 0.90 * h2(i, k * 3 + 2));
      var ang = h2(i, k * 3 + 3) * TAU;
      var dist = prog * (50 + h2(i, k * 3 + 4) * 190);
      var x = ox + Math.cos(ang) * dist;
      var y = oy + Math.sin(ang) * dist - prog * 14;
      var aStep = [1, 0.7, 0.45, 0.2][Math.min(3, Math.floor(prog * 4))];
      ctx.globalAlpha = aStep * 0.85;
      ctx.fillStyle = i % 4 === 0 ? COL.chalk : COL.dust;
      var sz = 1.5 + h2(i, k * 3 + 5) * 2.5;
      ctx.fillRect(x, y, sz, sz);
    }
    ctx.globalAlpha = 1;
    // a few horizontal smudge streaks, fading
    ctx.globalAlpha = (1 - prog) * 0.20;
    ctx.fillStyle = COL.dust;
    for (i = 0; i < 5; i++) {
      var sy = demoTop() + demoH() * h2(i, k * 7 + 6);
      ctx.fillRect(demoX(), sy, demoW() * (1 - prog) * (0.4 + 0.6 * h2(i, k * 7 + 8)), 2);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- chalk drag trail (the demo eats it) ----------
  var trail = [];   // {x, y, t} in piece time, cap 120
  var dragging = false;
  function recordPt(ev) {
    trail.push({ x: ev.clientX, y: ev.clientY, t: pieceNow() });
    if (trail.length > 120) trail.shift();
  }
  if (typeof window !== 'undefined' && canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (ev) { dragging = true; recordPt(ev); });
    canvas.addEventListener('pointermove', function (ev) { if (dragging) recordPt(ev); });
    var endDrag = function () { dragging = false; };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', endDrag);
  }
  function trailAlpha(age) {
    return [1, 0.75, 0.5, 0.25][Math.min(3, Math.floor(age / 4 * 4))];
  }
  function drawTrail(t, type, lt) {
    if (trail.length < 2) return;
    var i, p, age;
    // lesson 2 corruption: pull points near the circle toward its gap point
    var cx = W / 2, cy = demoTop() + demoH() * 0.52;
    var R = Math.min(demoH() * 0.34, demoW() * 0.30);
    var g = circleGeom(Math.floor(lt / 2.5));
    var gapX = cx + R * Math.cos(g.start + g.span), gapY = cy + R * Math.sin(g.start + g.span);
    function warped(p, idx) {
      var x = p.x + (h2(idx, Math.floor(t * 8)) - 0.5) * 2.2;   // chalk roughness
      var y = p.y + (h2(idx, Math.floor(t * 8) + 50) - 0.5) * 2.2;
      if (type === 1) {
        var dc = Math.hypot(x - cx, y - cy);
        var wgt = clamp(1 - Math.abs(dc - R) / 90, 0, 1) * 0.32;
        x += (gapX - x) * wgt;
        y += (gapY - y) * wgt;
      }
      return { x: x, y: y };
    }
    // main chalk line
    ctx.strokeStyle = COL.chalk;
    ctx.lineWidth = 2.4;
    for (i = 1; i < trail.length; i++) {
      p = trail[i];
      age = t - p.t;
      if (age > 4 || age < 0) continue;
      var p0 = trail[i - 1];
      if (t - p0.t > 4) continue;
      var a = warped(p0, i - 1), b = warped(p, i);
      ctx.globalAlpha = trailAlpha(age) * 0.9;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      // lesson 1 corruption: streaks hang from trail points inside sort columns
      if (type === 0 && p.x > demoX() && p.x < demoX() + demoW() &&
          p.y > demoTop() && p.y < demoTop() + demoH()) {
        var col = Math.floor((p.x - demoX()) / Math.max(3, Math.round(demoW() / 220)));
        var len = sortDepth(col, Math.floor(lt / 0.15)) * demoH() * 0.18;
        ctx.globalAlpha = trailAlpha(age) * 0.5;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x, b.y + len);
        ctx.stroke();
      }
      // lesson 3 corruption: RGB offset copies near live artifacts
      if (type === 2) {
        var beats = Math.floor(lt / 0.55), near = false, bb;
        for (bb = Math.max(1, beats - 8); bb <= beats && !near; bb++) {
          if (lt - bb * 0.55 >= 3) continue;
          var ap = mothPos(bb * 0.55);
          if (Math.hypot(p.x - ap.x, p.y - ap.y) < 55) near = true;
        }
        if (near) {
          ctx.globalAlpha = trailAlpha(age) * 0.45;
          ctx.strokeStyle = COL.cyan;
          ctx.beginPath();
          ctx.moveTo(a.x + 5, a.y - 3);
          ctx.lineTo(b.x + 5, b.y - 3);
          ctx.stroke();
          ctx.strokeStyle = '#FF2BD1';
          ctx.beginPath();
          ctx.moveTo(a.x - 5, a.y + 3);
          ctx.lineTo(b.x - 5, b.y + 3);
          ctx.stroke();
          ctx.strokeStyle = COL.chalk;
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- main draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = COL.board;
    ctx.fillRect(0, 0, W, H);

    var k = lessonAt(t);
    var lt = lessonLocal(t);
    var type = k % 3;

    if (lt < LESSON_DUR) {
      // lesson in session
      if (type === 0) drawSortHorizon(lt);
      else if (type === 1) drawUnclosing(lt);
      else drawMoth(lt);
      drawTrail(t, type, lt);
      drawAphorism(k, t);
    } else {
      // wipe: outgoing lesson's dust; incoming lesson's aphorism already typing
      drawWipe(k, lt - LESSON_DUR);
      drawTrail(t, (k + 1) % 3, 0);
      drawAphorism(k + 1, t);
    }
  }

  // ---------- run ----------
  draw(T0); // synchronous fixed-phase first frame
  if (typeof requestAnimationFrame === 'function') {
    var loopFn = function () {
      draw(pieceNow());
      requestAnimationFrame(loopFn);
    };
    requestAnimationFrame(loopFn);
  }
})();
</script>
