<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tactical Misuse Kit</title>
<style>
  html, body { margin: 0; padding: 0; background: #F0F0F0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded rng (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1163004);

  // ---------- palette ----------
  var PAGE = '#F0F0F0', CARD = '#FFFFFF', INK = '#141414', FAINT = '#8A8A8A';
  var BLUE = '#1877F2', ACID = '#B6FF00', WARN = '#FF2B2B';
  var SRCBG = '#0A0A0A', SRCFG = '#33FF66', BORDER = '#D9D9D9';

  // ---------- copy ----------
  var MANIFESTO = 'every interface is an argument; misuse is a reading.';
  var FEED_LABELS = [
    'because you paused: insurance',
    'people unlike you bought: fog',
    'your ex watched this: static',
    'trending in your building: soup',
    'since you blinked: mattresses',
    'for you, specifically: gravel',
    'your battery at 41%: chargers',
    'nearby and nervous: umbrellas',
    'because tuesday: more tuesday',
    'you deserve this: ads about ads',
    'your cart misses you: rope',
    'everyone is watching: paint dry'
  ];
  var FEED_THUMBS = ['#1877F2', '#FF2B6E', '#00FFC2', '#FFE14D', '#B388FF', '#FF9100'];
  var LIKE_NOTES = [
    'the count was yours',
    'engagement is extraction',
    'you liked it. it kept the change.',
    'attention, spent',
    'the button thanks you. the ledger too.'
  ];
  var SEARCH_QUERY = 'cheap flights tuesday';
  var SEARCH_LINES = ['characters: 21', 'words: 3', 'intent: harvested', 'results: 0'];
  var SRC_LINES = [
    ['// the feed is not broken.',
     '// it was built to keep you scrolling.',
     'feed.rank(by = your_dwell_time)'],
    ['// decline is a maze, not a choice.',
     'onDecline: banner.grow(); guilt++',
     '// dark pattern: the roach motel'],
    ['// the like was never for the author.',
     'score -= 7; // yours, not theirs',
     '// dark pattern: variable reward'],
    ['// you are the query\u2019s product.',
     'return metadata(query); // not results',
     '// dark pattern: quiet extraction'],
    ['// waiting is the one unmetered act.',
     'if (idle) fill(); // patience, unmonetized',
     '// dark pattern: none. this one rests.']
  ];
  var TITLES = ['FEED', 'CONSENT', 'LIKE', 'SEARCH', 'PROGRESS'];

  // ---------- time / state ----------
  var T0 = 8.0; // fixed first-frame phase (seconds)
  var state;
  function freshState(anchorT) {
    return {
      interactTimes: [anchorT],   // virtual interaction anchors the epoch
      lastInteract: anchorT,
      feedTarget: 0, feedOff: 0,
      declines: 0, accepted: false,
      likes: 0, lastLikeT: -100,
      searched: false, searchT: 0,
      openSrc: -1
    };
  }
  state = freshState(T0 - 6.0); // 6s idle at frame one -> progress at 18%

  function noteInteraction(t) {
    var arr = state.interactTimes;
    if (t - arr[arr.length - 1] > 0.25) arr.push(t);
    state.lastInteract = t;
  }
  function maybeReset(t) {
    if (t - state.lastInteract > 20) state = freshState(t);
  }
  function progressFill(t) {
    var arr = state.interactTimes, total = 0, prev = arr[0];
    for (var i = 1; i < arr.length; i++) {
      total += Math.max(0, arr[i] - prev - 1.5);
      prev = arr[i];
    }
    total += Math.max(0, t - prev - 1.5);
    return Math.min(1, 0.04 * total);
  }
  function score() { return Math.max(0, 100 - 7 * state.likes); }

  // ---------- canvas / view ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;
  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  if (!sw || !sh) { sw = window.innerWidth || 0; sh = window.innerHeight || 0; }
  var minScreen = Math.min(sw || 9999, sh || 9999);
  var isPhone = minScreen < 700 || (sh > sw * 1.15 && minScreen < 900);

  function fit() {
    W = viewW(); H = viewH();
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---------- layout ----------
  function layout() {
    var mx = isPhone ? 10 : Math.max(16, W * 0.05);
    var cw = Math.min(W - 2 * mx, 880);
    var x0 = (W - cw) / 2;
    var g = Math.max(6, H * 0.011);
    var mh = H * 0.062;
    var top = g + mh + g;
    var areaH = H - g - top;
    var gap = H * 0.012;
    var cardH = (areaH - 4 * gap) / 5;
    var cards = [];
    for (var i = 0; i < 5; i++) {
      cards.push({ x: x0, y: top + i * (cardH + gap), w: cw, h: cardH });
    }
    return { x0: x0, cw: cw, g: g, mh: mh, cards: cards, cardH: cardH };
  }
  function cardInner(c) {
    var pad = c.h * 0.09;
    var titleH = c.h * 0.235;
    return {
      pad: pad, titleH: titleH,
      x: c.x + pad, y: c.y + titleH,
      w: c.w - 2 * pad, h: c.y + c.h - pad - (c.y + titleH)
    };
  }

  // ---------- text helpers ----------
  var MONO = '"SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace';
  function setFont(px, bold) { ctx.font = (bold ? '700 ' : '400 ') + px.toFixed(1) + 'px ' + MONO; }
  function fitText(text, maxW, px, bold) {
    setFont(px, bold);
    if (ctx.measureText(text).width <= maxW) return text;
    var s = text;
    while (s.length > 1 && ctx.measureText(s + '\u2026').width > maxW) s = s.slice(0, -1);
    return s + '\u2026';
  }
  function fitPx(text, maxW, px, bold) {
    setFont(px, bold);
    while (px > 6 && ctx.measureText(text).width > maxW) { px -= 0.5; setFont(px, bold); }
    return px;
  }
  function drawText(text, x, y, px, color, bold, align) {
    setFont(px, bold);
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
  }
  function wrap2(text, maxW, px) {
    setFont(px, false);
    if (ctx.measureText(text).width <= maxW) return [text];
    var words = text.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var t = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = t;
      if (lines.length === 2) break;
    }
    if (lines.length < 2 && cur) lines.push(cur);
    if (lines.length === 2) {
      var joined = lines.join(' ');
      if (joined.length < text.length) lines[1] = fitText(lines[1] + '\u2026', maxW, px, false);
    }
    return lines;
  }
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  // ---------- hit regions (rebuilt each draw) ----------
  var hits = [];
  function addHit(kind, idx, x, y, w, h) { hits.push({ kind: kind, idx: idx, x: x, y: y, w: w, h: h }); }

  // ---------- toys ----------
  function drawFeed(c, inn, t) {
    var miniH = inn.h / 3;
    var off = state.feedOff;
    ctx.save();
    ctx.beginPath(); ctx.rect(inn.x, inn.y, inn.w, inn.h); ctx.clip();
    var base = Math.floor(off / miniH);
    var frac = off - base * miniH;
    for (var k = -1; k < 4; k++) {
      var idx = ((base + k) % FEED_LABELS.length + FEED_LABELS.length) % FEED_LABELS.length;
      var y = inn.y + k * miniH - frac;
      var th = inn.x, tw = miniH * 0.92;
      ctx.fillStyle = FEED_THUMBS[idx % FEED_THUMBS.length];
      ctx.fillRect(th, y + miniH * 0.14, tw, miniH * 0.72);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(th + tw * 0.18, y + miniH * 0.34, tw * 0.4, miniH * 0.1);
      ctx.fillRect(th + th * 0 + tw * 0.18, y + miniH * 0.55, tw * 0.28, miniH * 0.1);
      var lx = inn.x + tw + inn.w * 0.035;
      var lines = wrap2(FEED_LABELS[idx], inn.w - tw - inn.w * 0.05, inn.h * 0.115);
      for (var li = 0; li < lines.length; li++) {
        drawText(lines[li], lx, y + miniH * (0.36 + li * 0.27), inn.h * 0.115, INK, false);
      }
      ctx.fillStyle = '#E4E4E4';
      ctx.fillRect(inn.x, y + miniH - 0.5, inn.w, 1);
    }
    ctx.restore();
    ctx.strokeStyle = BORDER; ctx.lineWidth = 1;
    ctx.strokeRect(inn.x + 0.5, inn.y + 0.5, inn.w - 1, inn.h - 1);
    addHit('feed', 0, inn.x, inn.y, inn.w, inn.h);
  }

  function consentGeom(inn) {
    var base = inn.h * 0.52;
    var grow = state.declines * (H / 800) * 14;
    var bh = Math.min(base + grow, inn.h);
    return { base: base, bh: bh };
  }
  function drawConsent(c, inn, t) {
    if (state.accepted) {
      ctx.fillStyle = BLUE;
      ctx.fillRect(inn.x, inn.y, inn.w, inn.h * 0.3);
      drawText('noted.', inn.x + inn.w * 0.03, inn.y + inn.h * 0.15, inn.h * 0.13, '#FFFFFF', true);
      drawText('the banner keeps the receipt.', inn.x + inn.w * 0.03, inn.y + inn.h * 0.62, inn.h * 0.115, FAINT, false);
      return;
    }
    var geo = consentGeom(inn);
    var bh = geo.bh;
    ctx.fillStyle = '#EAF1FD';
    ctx.fillRect(inn.x, inn.y, inn.w, bh);
    ctx.strokeStyle = BORDER; ctx.strokeRect(inn.x + 0.5, inn.y + 0.5, inn.w - 1, bh - 1);
    var fs = inn.h * 0.115;
    drawText(fitText('we value your privacy (all of it).', inn.w * 0.94, fs, false),
             inn.x + inn.w * 0.03, inn.y + bh * 0.2, fs, INK, false);
    if (state.declines > 0) {
      drawText('declines: ' + state.declines, inn.x + inn.w * 0.03, inn.y + bh * 0.44, fs, WARN, true);
    }
    var btnH = Math.min(inn.h * 0.3, bh * 0.34);
    var btnY = inn.y + bh - btnH - bh * 0.08;
    var accW = inn.w * 0.3, decW = inn.w * 0.3;
    var accX = inn.x + inn.w * 0.03, decX = inn.x + inn.w - inn.w * 0.03 - decW;
    ctx.fillStyle = BLUE; ctx.fillRect(accX, btnY, accW, btnH);
    drawText('ACCEPT', accX + accW / 2, btnY + btnH / 2, fs, '#FFFFFF', true, 'center');
    addHit('accept', 1, accX, btnY, accW, btnH);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(decX, btnY, decW, btnH);
    ctx.strokeStyle = INK; ctx.strokeRect(decX + 0.5, btnY + 0.5, decW - 1, btnH - 1);
    var dFs = Math.max(6, fs * (1 - state.declines * 0.13));
    var dLabel = state.declines >= 6 ? '\u00B7' : (state.declines >= 3 ? 'no' : 'decline');
    drawText(dLabel, decX + decW / 2, btnY + btnH / 2, state.declines >= 3 ? fs : dFs, INK, true, 'center');
    addHit('decline', 1, decX, btnY, decW, btnH);
  }

  function drawHeart(cx, cy, s, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.85);
    ctx.bezierCurveTo(cx - s * 1.25, cy + s * 0.1, cx - s * 0.95, cy - s * 0.95, cx, cy - s * 0.3);
    ctx.bezierCurveTo(cx + s * 0.95, cy - s * 0.95, cx + s * 1.25, cy + s * 0.1, cx, cy + s * 0.85);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(1.5, s * 0.09); ctx.stroke(); }
  }
  function drawLike(c, inn, t) {
    var sc = score();
    var hs = inn.h * 0.3;
    var cx = inn.x + hs * 1.15, cy = inn.y + inn.h * 0.42;
    var flash = (t - state.lastLikeT) < 0.35 && state.likes > 0;
    var fill = sc <= 0 ? '#C9C9C9' : (flash ? ACID : '#FF2B6E');
    drawHeart(cx, cy, hs, fill, INK);
    addHit('like', 2, cx - hs * 1.3, cy - hs * 1.05, hs * 2.6, hs * 2.1);
    var tx = cx + hs * 1.75;
    drawText('your score: ' + sc, tx, inn.y + inn.h * 0.3, inn.h * 0.15, sc < 50 && sc > 0 ? WARN : INK, true);
    var note = sc <= 0 ? 'enough.' : (state.likes > 0 ? LIKE_NOTES[(state.likes - 1) % LIKE_NOTES.length] : 'tap the heart. it keeps the change.');
    drawText(fitText(note, inn.w - (tx - inn.x) - 4, inn.h * 0.115, false),
             tx, inn.y + inn.h * 0.62, inn.h * 0.115, FAINT, false);
    if (sc <= 0) drawText('enough', cx, cy, hs * 0.42, INK, true, 'center');
  }

  function drawSearch(c, inn, t) {
    var rowH = inn.h * 0.34;
    var btnW = inn.w * 0.24;
    var boxW = inn.w - btnW - inn.w * 0.03;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(inn.x, inn.y, boxW, rowH);
    ctx.strokeStyle = INK; ctx.lineWidth = 1.2;
    ctx.strokeRect(inn.x + 0.5, inn.y + 0.5, boxW - 1, rowH - 1);
    drawText(fitText(SEARCH_QUERY, boxW * 0.9, inn.h * 0.125, false),
             inn.x + boxW * 0.045, inn.y + rowH / 2, inn.h * 0.125, INK, false);
    var caretOn = Math.floor(t * 1.6) % 2 === 0;
    if (caretOn) {
      setFont(inn.h * 0.125, false);
      var qw = ctx.measureText(SEARCH_QUERY).width;
      ctx.fillStyle = BLUE;
      ctx.fillRect(inn.x + boxW * 0.045 + qw + 3, inn.y + rowH * 0.22, 2, rowH * 0.56);
    }
    var bx = inn.x + boxW + inn.w * 0.03;
    ctx.fillStyle = state.searched ? ACID : BLUE;
    ctx.fillRect(bx, inn.y, btnW, rowH);
    drawText('SEARCH', bx + btnW / 2, inn.y + rowH / 2, inn.h * 0.12,
             state.searched ? INK : '#FFFFFF', true, 'center');
    addHit('search', 3, bx, inn.y, btnW, rowH);
    if (state.searched) {
      for (var i = 0; i < SEARCH_LINES.length; i++) {
        if (t - state.searchT < 0.45 * (i + 1)) break;
        var ly = inn.y + rowH + inn.h * 0.19 + i * inn.h * 0.155;
        if (ly > inn.y + inn.h) break;
        drawText(SEARCH_LINES[i], inn.x + boxW * 0.045, ly, inn.h * 0.115,
                 i === 2 ? WARN : INK, i === 3);
      }
    } else {
      drawText('results are not the product here.',
               inn.x + boxW * 0.045, inn.y + rowH + inn.h * 0.3, inn.h * 0.115, FAINT, false);
    }
  }

  function drawProgress(c, inn, t) {
    var fill = progressFill(t);
    var filling = (t - state.lastInteract) > 1.5;
    drawText(filling ? 'it fills while you do nothing' : 'paused \u2014 you did something',
             inn.x, inn.y + inn.h * 0.18, inn.h * 0.125, filling ? INK : WARN, false);
    drawText(Math.round(fill * 100) + '%', inn.x + inn.w, inn.y + inn.h * 0.18,
             inn.h * 0.125, INK, true, 'right');
    var barY = inn.y + inn.h * 0.48, barH = inn.h * 0.3;
    ctx.fillStyle = '#E2E2E2'; ctx.fillRect(inn.x, barY, inn.w, barH);
    ctx.fillStyle = BLUE;
    if (fill > 0) ctx.fillRect(inn.x, barY, inn.w * fill, barH);
    ctx.strokeStyle = BORDER; ctx.strokeRect(inn.x + 0.5, barY + 0.5, inn.w - 1, barH - 1);
    addHit('progress', 4, inn.x, inn.y, inn.w, inn.h);
  }

  var TOY_DRAW = [drawFeed, drawConsent, drawLike, drawSearch, drawProgress];

  // ---------- frame ----------
  function draw(t) {
    fit();
    maybeReset(t);
    hits = [];
    var L = layout();
    ctx.fillStyle = PAGE;
    ctx.fillRect(0, 0, W, H);

    // manifesto strip
    ctx.fillStyle = SRCBG;
    ctx.fillRect(L.x0, L.g, L.cw, L.mh);
    var manPx = fitPx(MANIFESTO, L.cw * 0.94, L.mh * 0.34, false);
    drawText(MANIFESTO, L.x0 + L.cw / 2, L.g + L.mh / 2, manPx, '#F0F0F0', false, 'center');
    ctx.fillStyle = ACID;
    ctx.fillRect(L.x0, L.g + L.mh - 3, L.cw, 3);

    for (var i = 0; i < 5; i++) {
      var c = L.cards[i];
      ctx.fillStyle = CARD;
      ctx.fillRect(c.x, c.y, c.w, c.h);
      ctx.strokeStyle = BORDER; ctx.lineWidth = 1;
      ctx.strokeRect(c.x + 0.5, c.y + 0.5, c.w - 1, c.h - 1);
      var inn = cardInner(c);
      var titlePx = c.h * 0.105;
      drawText(TITLES[i], c.x + inn.pad, c.y + inn.titleH / 2, titlePx, INK, true);
      drawText((i + 1) + ' / 5', c.x + inn.pad + ctx.measureText(TITLES[i]).width + c.w * 0.05,
               c.y + inn.titleH / 2, titlePx, FAINT, false);
      // toggle
      var togLabel = state.openSrc === i ? 'hide the hack' : 'view the hack';
      setFont(titlePx, false);
      var tw = ctx.measureText(togLabel).width;
      var togX = c.x + c.w - inn.pad - tw, togY = c.y + inn.titleH / 2;
      if (state.openSrc === i) {
        ctx.fillStyle = ACID;
        ctx.fillRect(togX - 5, togY - titlePx * 0.85, tw + 10, titlePx * 1.7);
      }
      drawText(togLabel, togX, togY, titlePx, BLUE, false);
      ctx.fillStyle = BLUE;
      ctx.fillRect(togX, togY + titlePx * 0.72, tw, 1.5);
      addHit('toggle', i, togX - 5, togY - titlePx, tw + 10, titlePx * 2);

      TOY_DRAW[i](c, inn, t);

      // source overlay
      if (state.openSrc === i) {
        var oh = inn.h * 0.58, oy = c.y + c.h - inn.pad - oh;
        ctx.fillStyle = SRCBG;
        ctx.fillRect(inn.x, oy, inn.w, oh);
        var spx = oh * 0.17;
        for (var li = 0; li < SRC_LINES[i].length; li++) {
          drawText(fitText(SRC_LINES[i][li], inn.w * 0.94, spx, false),
                   inn.x + inn.w * 0.03, oy + oh * (0.24 + li * 0.26), spx, SRCFG, false);
        }
        addHit('srcblock', i, inn.x, oy, inn.w, oh);
      }
    }
  }

  // ---------- interaction ----------
  var drag = null;
  function evtPos(e) {
    var r = null;
    if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
    var x = e.clientX || 0, y = e.clientY || 0;
    if (r) { x -= r.left; y -= r.top; }
    return { x: x, y: y };
  }
  function hitAt(x, y) {
    for (var i = hits.length - 1; i >= 0; i--) {
      var h = hits[i];
      if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
    }
    return null;
  }
  var lastT = T0;
  function onDown(e) {
    var p = evtPos(e), h = hitAt(p.x, p.y);
    noteInteraction(lastT);
    drag = { x: p.x, y: p.y, t: lastT, hit: h, moved: false, feedStart: state.feedTarget };
    if (h && h.kind !== 'feed') applyTap(h);
  }
  function onMove(e) {
    if (!drag) return;
    var p = evtPos(e);
    var dy = p.y - drag.y;
    if (Math.abs(dy) > 4 || Math.abs(p.x - drag.x) > 4) {
      drag.moved = true;
      noteInteraction(lastT);
    }
    if (drag.hit && drag.hit.kind === 'feed') {
      var inn = cardInner(layout().cards[0]);
      var miniH = inn.h / 3;
      var total = FEED_LABELS.length * miniH;
      var nt = drag.feedStart - dy;
      state.feedTarget = ((nt % total) + total) % total;
    }
  }
  function onUp(e) {
    if (drag && !drag.moved && drag.hit && drag.hit.kind === 'feed') {
      // plain tap on feed: nothing (never click-to-reload)
    }
    drag = null;
  }
  function applyTap(h) {
    if (h.kind === 'toggle') {
      state.openSrc = state.openSrc === h.idx ? -1 : h.idx;
    } else if (h.kind === 'decline') {
      if (!state.accepted) state.declines++;
    } else if (h.kind === 'accept') {
      state.accepted = true;
    } else if (h.kind === 'like') {
      if (score() > 0) { state.likes++; state.lastLikeT = lastT; }
    } else if (h.kind === 'search') {
      state.searched = true; state.searchT = lastT;
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('wheel', function (e) {
      var p = evtPos(e), h = hitAt(p.x, p.y);
      if (h && h.kind === 'feed') {
        noteInteraction(lastT);
        var inn = cardInner(layout().cards[0]);
        var total = FEED_LABELS.length * (inn.h / 3);
        var nt = state.feedTarget + (e.deltaY || 0);
        state.feedTarget = ((nt % total) + total) % total;
        if (e.preventDefault) e.preventDefault();
      }
    });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  // ---------- run ----------
  draw(T0);
  var startStamp = null;
  function frame(stamp) {
    if (startStamp === null) startStamp = stamp;
    var t = T0 + (stamp - startStamp) / 1000;
    // ease feed offset toward target (view smoothing only)
    var dt = Math.min(0.05, t - lastT);
    var diff = state.feedTarget - state.feedOff;
    var total = 1; // shortest wrap handled below
    var L = layout();
    var inn = cardInner(L.cards[0]);
    total = FEED_LABELS.length * (inn.h / 3);
    if (Math.abs(diff) > total / 2) diff -= Math.sign(diff) * total;
    state.feedOff += diff * Math.min(1, dt * 9);
    if (Math.abs(diff) < 0.05) state.feedOff = state.feedTarget;
    state.feedOff = ((state.feedOff % total) + total) % total;
    lastT = t;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
