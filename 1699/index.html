<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forty-Two Lines</title>
<style>
html, body { margin: 0; padding: 0; background: #F2B705; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
/* Duotone sets, one per 45 seconds of a 3-minute cycle. Never more
   than two inks at once; the cycle owns the change, no UI. */
var PALETTES = [
  { ground: '#F2B705', ink: '#111111' },
  { ground: '#F4EFE3', ink: '#232B6B' },
  { ground: '#D9381E', ink: '#141210' },
  { ground: '#0F766E', ink: '#EFE9D8' }
];
var CYCLE = 180, FIRST_T = 0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function paletteAt(t) {
  var tc = ((t % CYCLE) + CYCLE) % CYCLE;
  return PALETTES[Math.floor(tc / 45) % 4];
}
/* KNOT: 42 lines of code draw the loops - begin */
var BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
function knotPoint(th, t) {
  var R = 1, r = 0.42, p = 2, q = 3;
  var cq = Math.cos(q * th), sq = Math.sin(q * th);
  var x = (R + r * cq) * Math.cos(p * th);
  var y = (R + r * cq) * Math.sin(p * th), z = r * sq;
  var a = 0.55 * Math.sin(0.011 * t + 1.3) + 0.25 * Math.sin(0.004 * t + 4.1);
  var b = 0.45 * Math.sin(0.009 * t + 2.6) + 0.30 * Math.sin(0.005 * t + 0.7);
  var ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
  var x1 = x * ca - z * sa, z1 = x * sa + z * ca;
  return [x1, y * cb - z1 * sb, y * sb + z1 * cb];
}
function drawKnot(t, pal) {
  var cx = VW / 2, cy = VH / 2;
  var sc = (isPhone ? 0.55 : 0.50) * Math.min(VW, VH), tube = sc * 0.16;
  var N = 720, i, pts = [], segs = [];
  for (i = 0; i < N; i++) pts.push(knotPoint(i / N * TAU, t));
  for (i = 0; i < N; i++) { var a = pts[i], b = pts[(i + 1) % N]; segs.push({ ax: cx + a[0] * sc, ay: cy + a[1] * sc, bx: cx + b[0] * sc, by: cy + b[1] * sc, z: (a[2] + b[2]) / 2 }); }
  /* painter's order: far tube first, near tube drawn over it */
  segs.sort(function (s1, s2) { return s1.z - s2.z; });
  ctx.lineCap = 'round'; ctx.strokeStyle = pal.ink;
  for (i = 0; i < N; i++) { var s = segs[i]; ctx.lineWidth = Math.max(2, tube * (1 + 0.10 * s.z / 0.42));
    ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by); ctx.stroke(); }
  /* halftone: ground-ink dots, ordered Bayer, shaded by the tube normal */
  ctx.fillStyle = pal.ground;
  for (i = 0; i < N; i += 2) {
    var s2 = segs[i], dx = s2.bx - s2.ax, dy = s2.by - s2.ay;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / len, ny = dx / len, mx = (s2.ax + s2.bx) / 2, my = (s2.ay + s2.by) / 2;
    for (var k = -4; k <= 4; k++) {
      var u = k / 5, px = mx + nx * u * tube / 2, py = my + ny * u * tube / 2;
      var nrm = Math.sqrt(Math.max(0, 1 - u * u));
      var shade = 0.5 + 0.5 * (-0.45 * nx * u - 0.60 * ny * u + 0.66 * nrm) + 0.08 * s2.z;
      var dark = 1 - clamp(shade, 0.05, 0.95);
      var gx = Math.floor(px / 7), gy = Math.floor(py / 7), th = BAYER[((gy % 4) + 4) % 4][((gx % 4) + 4) % 4] / 16;
      var shimmer = 0.05 * Math.sin(t * 0.9 + gx * 0.7 + gy * 1.3);
      if (dark + shimmer > th * 0.9) { ctx.beginPath(); ctx.arc(px, py, 0.7 + 2.3 * dark, 0, TAU); ctx.fill(); }
    }
  }
}
/* KNOT: end */
function drawPlates(pal) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Forty-Two Lines').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Forty-Two Lines').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 06').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = pal.ink;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = pal.ground;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = pal.ground;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Forty-Two Lines', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2006 · 09 · 06', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 26;
  ctx.fillStyle = pal.ink;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = pal.ground;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = pal.ground;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var budget = '42 lines of code';
  ctx.font = smallPx + 'px monospace';
  var budgetW = ctx.measureText(budget).width;
  var budgetPlateW = budgetW + 24;
  var budgetPlateH = smallPx + 14;
  var budgetPlateX = VW - budgetPlateW - 12;
  var budgetPlateY = VH - budgetPlateH - 26;
  ctx.fillStyle = pal.ink;
  ctx.fillRect(budgetPlateX, budgetPlateY, budgetPlateW, budgetPlateH);
  ctx.strokeStyle = pal.ground;
  ctx.lineWidth = 1;
  ctx.strokeRect(budgetPlateX + 0.5, budgetPlateY + 0.5, budgetPlateW - 1, budgetPlateH - 1);
  ctx.fillStyle = pal.ground;
  ctx.fillText(budget, budgetPlateX + 12, budgetPlateY + 7);
}
function draw(t) {
  size();
  var pal = paletteAt(t);
  if (typeof document !== 'undefined' && document.body) document.body.style.background = pal.ground;
  ctx.fillStyle = pal.ground;
  ctx.fillRect(0, 0, VW, VH);
  drawKnot(t, pal);
  drawPlates(pal);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    paletteAt: function (t) { return paletteAt(t); }
  };
}
/* ---- frame one: t = 0, golden yellow + black, knot at fixed seed-walk phase ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null, lastDrawn = -1;
draw(FIRST_T);
lastDrawn = FIRST_T;
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    if (clockT - lastDrawn >= 0.1) {
      draw(clockT);
      lastDrawn = clockT;
    }
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
