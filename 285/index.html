<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.285 Crater and Gloop</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B0C; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.285 Crater and Gloop (Sophia Golovanevskaya).
// A glossy black vessel skin seen so close that no vessel
// outline remains: golden-brown crater rings pock the black
// ground like coral or cells under a microscope, and
// silver-grey cracked streaks melt downward between them.
// The field is a slow-motion loop: the gold rings breathe
// and the silver streaks creep downward. Tapping replants a
// new crater and gloop constellation with the same grammar;
// double-tapping regrows the silver streaks only. No reload.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0B0B0C', GOLD = '#C98A3E', DEEP = '#8A5A24', SILVER = '#A9ABB2', SHADOW = '#6E7076';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0; // stored cover-fit transform, used by the pointer handlers
var T = 7.4, lastNow = -1, acc = 0; // clock offset so frame one is mid-breath, developed
var TICK = 1 / 60;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- the crater field ----------------------------------------------------------
// Crater cells are held purely as data. Their centres come
// from a seeded scatter with a relaxed minimum distance, so
// the layout reads like a Voronoi packing: each cell claims
// the ground around its centre and its rim radius is set
// from the distance to its nearest neighbour. Rim width and
// centre depth vary widely per cell, which is what keeps the
// field reading as glaze rather than leopard print: no two
// craters carry the same ring weight or the same dark heart.
// Each rim is a closed polyline with seeded radial jitter,
// squashed into a shallow ellipse and turned, so the rings
// are hand-made ovals, never stamped circles.
var craters = [];
var pocks = [];
var gloops = [];
var seed = 285023;
var streakSeed = 91407;

function buildCraters(s0) {
  var r = rng(s0);
  craters = [];
  pocks = [];
  gloops = [];
  var tries = 0;
  while (craters.length < 46 && tries < 900) {
    tries++;
    var x = -90 + r() * (DW + 180);
    var y = -90 + r() * (DH + 180);
    var ok = true;
    var nearest = 1e9;
    for (var i = 0; i < craters.length; i++) {
      var dx = craters[i].x - x, dy = craters[i].y - y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < nearest) nearest = d;
      if (d < 96) { ok = false; break; }
    }
    if (!ok) continue;
    var rad = nearest === 1e9 ? 52 + r() * 26 : Math.min(82, Math.max(30, nearest * (0.40 + r() * 0.16)));
    var harm = {
      a1: 0.02 + r() * 0.045, p1: r() * Math.PI * 2,
      a2: 0.01 + r() * 0.035, p2: r() * Math.PI * 2,
      a3: 0.004 + r() * 0.018, p3: r() * Math.PI * 2
    };
    var gl = [];
    var nGl = 2 + Math.floor(r() * 2);
    for (var g = 0; g < nGl; g++) {
      gl.push({
        ox: (r() - 0.62) * rad * 0.72,
        oy: (r() - 0.66) * rad * 0.58,
        w: rad * (0.30 + r() * 0.34),
        h: rad * (0.12 + r() * 0.14),
        rot: (r() - 0.5) * 0.9,
        a: 0.045 + r() * 0.065
      });
    }
    craters.push({
      x: x, y: y, rad: rad,
      rim: 2.6 + Math.pow(r(), 1.5) * 13.5,
      depth: 0.30 + r() * 0.66,
      squash: 0.74 + r() * 0.26,
      rot: r() * Math.PI,
      harm: harm,
      pitOx: (r() - 0.5) * rad * 0.4,
      pitOy: (r() - 0.5) * rad * 0.34,
      pitR: 0.14 + r() * 0.13,
      phase: r() * Math.PI * 2,
      rate: 0.16 + r() * 0.22,
      rimAlpha: 0.62 + r() * 0.33,
      gloop: gl
    });
  }
  // small satellite pocks fill the gaps between the big cells
  for (var p = 0; p < 90; p++) {
    var ph = {
      a1: 0.02 + r() * 0.05, p1: r() * Math.PI * 2,
      a2: 0.01 + r() * 0.04, p2: r() * Math.PI * 2,
      a3: 0.004 + r() * 0.02, p3: r() * Math.PI * 2
    };
    pocks.push({
      x: -40 + r() * (DW + 80),
      y: -40 + r() * (DH + 80),
      rad: 5 + Math.pow(r(), 1.7) * 14,
      rim: 1.4 + r() * 3.4,
      depth: 0.25 + r() * 0.6,
      squash: 0.76 + r() * 0.24,
      rot: r() * Math.PI,
      harm: ph,
      pitOx: 0, pitOy: 0, pitR: 0.2,
      phase: r() * Math.PI * 2,
      rate: 0.2 + r() * 0.3,
      rimAlpha: 0.4 + r() * 0.4,
      gloop: []
    });
  }
  // broad glossy sheen pools lying on the black skin itself
  for (var s = 0; s < 9; s++) {
    gloops.push({
      x: r() * DW, y: r() * DH,
      w: 90 + r() * 190, h: 26 + r() * 52,
      rot: (r() - 0.5) * 1.1,
      a: 0.028 + r() * 0.035,
      gold: r() < 0.55,
      phase: r() * Math.PI * 2
    });
  }
}

// ---- the silver streaks -----------------------------------------------------------
// Silver streaks are vertical crack polylines held as data:
// a jagged spine stepping downward, short crack branches off
// some nodes, and a melt displacement per node. On the loop
// each streak creeps downward and its nodes sway a little
// further sideways as the creep grows, like glaze softening.
// A shadow copy is drawn offset behind the bright core.
var streaks = [];
var streakBirth = 0;
function buildStreaks(s0) {
  var r = rng(s0);
  streaks = [];
  var n = 16 + Math.floor(r() * 5);
  for (var i = 0; i < n; i++) {
    var x = -20 + r() * (DW + 40);
    var y = -160 + r() * (DH - 120);
    var len = 150 + r() * 300;
    var steps = 8 + Math.floor(r() * 7);
    var pts = [];
    var cx = x;
    for (var k = 0; k <= steps; k++) {
      cx += (r() - 0.5) * 13;
      pts.push({
        x: cx,
        y: y + (len * k) / steps,
        melt: (r() - 0.5) * 15,
        branch: r() < 0.18 ? (r() < 0.5 ? -1 : 1) * (6 + r() * 9) : 0,
        branchDy: (r() - 0.5) * 16
      });
    }
    streaks.push({
      pts: pts,
      width: 1.1 + r() * 1.9,
      alpha: 0.34 + r() * 0.36,
      speed: 2.2 + r() * 3.4,
      phase: r() * Math.PI * 2
    });
  }
  streakBirth = T;
}
buildCraters(seed);
buildStreaks(streakSeed);
streakBirth = T - 10; // frame one opens with the streaks already grown

// ---- simulation ---------------------------------------------------------------------
function stepSim() { T += TICK; }

// ---- drawing ---------------------------------------------------------------------------
function ringPath(c, scale) {
  // smooth harmonic wobble, never a faceted polygon: three
  // seeded sine waves around the circle keep the rim a
  // hand-made oval with no straight stamped edges
  var n = 44;
  ctx.beginPath();
  for (var i = 0; i <= n; i++) {
    var a = (i % n) / n * Math.PI * 2;
    var wob = 1 + c.harm.a1 * Math.sin(3 * a + c.harm.p1) + c.harm.a2 * Math.sin(5 * a + c.harm.p2) + c.harm.a3 * Math.sin(8 * a + c.harm.p3);
    var rr = c.rad * scale * wob;
    var lx = Math.cos(a) * rr, ly = Math.sin(a) * rr * c.squash;
    var cs = Math.cos(c.rot), sn = Math.sin(c.rot);
    var px = c.x + lx * cs - ly * sn;
    var py = c.y + lx * sn + ly * cs;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function drawCrater(c) {
  var breathe = 1 + 0.045 * Math.sin(T * c.rate * Math.PI * 2 * 0.28 + c.phase);
  // soft deep halo where the glaze thickens around the cell
  ringPath(c, breathe * 1.18);
  ctx.fillStyle = rgba(DEEP, 0.07 + c.depth * 0.06);
  ctx.fill();
  // dark centre: a thin wash of deep gold, then the black
  // ground laid over it in proportion to this cell's own
  // depth, so the heart of the crater stays near black and
  // only the rim carries the colour
  ringPath(c, breathe * 0.94);
  ctx.fillStyle = rgba(DEEP, 0.30);
  ctx.fill();
  ringPath(c, breathe * 0.94);
  ctx.fillStyle = rgba(GROUND, 0.44 + c.depth * 0.38);
  ctx.fill();
  // the pit: one small dark hollow, offset from the centre,
  // instead of a concentric inner ring
  ctx.fillStyle = rgba(GROUND, 0.38 + c.depth * 0.3);
  ctx.beginPath();
  ctx.ellipse(c.x + c.pitOx, c.y + c.pitOy, c.rad * c.pitR, c.rad * c.pitR * c.squash, c.rot, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = rgba(DEEP, 0.22 + c.depth * 0.16);
  ctx.lineWidth = Math.max(1, c.rim * 0.2);
  ctx.stroke();
  // the raised bright rim itself, this cell's own width
  ringPath(c, breathe);
  ctx.strokeStyle = rgba(GOLD, c.rimAlpha * (0.88 + 0.12 * Math.sin(T * c.rate + c.phase)));
  ctx.lineWidth = c.rim;
  ctx.lineJoin = 'round';
  ctx.stroke();
  // a second, thinner gold pass just inside the rim crest
  ringPath(c, breathe * 0.90);
  ctx.strokeStyle = rgba(GOLD, 0.20 + c.rimAlpha * 0.18);
  ctx.lineWidth = Math.max(1, c.rim * 0.30);
  ctx.stroke();
  // gloop: layered translucent ellipse highlights only,
  // pooled toward the upper left of the crater floor
  for (var i = 0; i < c.gloop.length; i++) {
    var g = c.gloop[i];
    ctx.save();
    ctx.translate(c.x + g.ox * breathe, c.y + g.oy * breathe);
    ctx.rotate(g.rot);
    ctx.fillStyle = rgba(SILVER, g.a);
    ctx.beginPath();
    ctx.ellipse(0, 0, g.w * breathe, g.h * breathe, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(GOLD, g.a * 0.8);
    ctx.beginPath();
    ctx.ellipse(g.w * 0.14, g.h * 0.3, g.w * 0.62, g.h * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
function drawStreaks() {
  var age = T - streakBirth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var pass = 0; pass < 2; pass++) {
    for (var i = 0; i < streaks.length; i++) {
      var st = streaks[i];
      var creep = ((T * st.speed + st.phase * 13) % 64);
      var grow = Math.min(1, age / 2.5 + 0.55);
      ctx.strokeStyle = pass === 0 ? rgba(SHADOW, st.alpha * 0.55) : rgba(SILVER, st.alpha * (0.75 + 0.25 * Math.sin(T * 0.24 + st.phase)));
      ctx.lineWidth = pass === 0 ? st.width + 1.6 : st.width;
      var off = pass === 0 ? 3 : 0;
      ctx.beginPath();
      var count = Math.max(2, Math.floor(st.pts.length * grow));
      for (var k = 0; k < count; k++) {
        var p = st.pts[k];
        var sway = p.melt * (0.4 + creep / 90) + Math.sin(T * 0.3 + st.phase + k * 0.7) * 1.6;
        var px = p.x + sway + off, py = p.y + creep + off * 0.6;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      // crack branches off the spine, on the bright pass only
      if (pass === 1) {
        ctx.beginPath();
        for (var b = 1; b < count; b++) {
          var bp = st.pts[b];
          if (!bp.branch) continue;
          var bx = bp.x + bp.melt * (0.4 + creep / 90) + Math.sin(T * 0.3 + st.phase + b * 0.7) * 1.6;
          var by = bp.y + creep;
          ctx.moveTo(bx, by);
          ctx.lineTo(bx + bp.branch, by + 7 + bp.branchDy * 0.4);
        }
        ctx.stroke();
      }
    }
  }
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-90, -90, DW + 180, DH + 180);
  // broad gloop sheen pools on the black skin, layered
  // translucent ellipses, breathing very faintly
  for (var i = 0; i < gloops.length; i++) {
    var g = gloops[i];
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.rot);
    ctx.fillStyle = rgba(g.gold ? GOLD : SILVER, g.a * (0.85 + 0.15 * Math.sin(T * 0.2 + g.phase)));
    ctx.beginPath();
    ctx.ellipse(0, 0, g.w, g.h, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(g.gold ? GOLD : SILVER, g.a * 0.7);
    ctx.beginPath();
    ctx.ellipse(g.w * 0.1, g.h * 0.16, g.w * 0.58, g.h * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // silver streaks run behind the craters, so the gold cells
  // overlap them and the two systems read as interlaced
  drawStreaks();
  var i2;
  for (i2 = 0; i2 < craters.length; i2++) drawCrater(craters[i2]);
  for (i2 = 0; i2 < pocks.length; i2++) drawCrater(pocks[i2]);
  // a few streak tips melt visibly over the black between
  // craters near the bottom, drawn again at low alpha
  ctx.save();
  ctx.globalAlpha = 0.5;
  drawStreaks();
  ctx.restore();
}

// ---- resize ----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction: tap-reseed and double-tap regrow ---------------------------------------
// A single tap replants the whole constellation from the
// next seed. A double tap regrows only the silver streaks
// from a fresh streak seed, leaving the craters in place.
// The single tap waits a beat to see whether a second tap
// follows, so a double tap never replants first. Neither
// action ever reloads the page.
var lastTapAt = 0, pendingTap = null;
function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e); // design coords via the stored transform; the field replants as a whole
  void p;
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  if (lastTapAt && now - lastTapAt < 340) {
    if (pendingTap !== null && typeof clearTimeout === 'function') clearTimeout(pendingTap);
    pendingTap = null;
    lastTapAt = 0;
    streakSeed = (streakSeed * 1664525 + 1013904223) >>> 0;
    buildStreaks(streakSeed ^ 0x5EED);
    return;
  }
  lastTapAt = now;
  if (typeof setTimeout === 'function') {
    pendingTap = setTimeout(function () {
      pendingTap = null;
      lastTapAt = 0;
      seed = (seed * 1664525 + 1013904223) >>> 0;
      streakSeed = (streakSeed * 22695477 + 1) >>> 0;
      buildCraters(seed ^ 0xC0FFEE);
      buildStreaks(streakSeed ^ 0x5EED);
    }, 340);
  } else {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    buildCraters(seed ^ 0xC0FFEE);
  }
});

// ---- frame ----------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: the vessel skin fills the frame edge to edge
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
