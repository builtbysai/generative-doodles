<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>If the Quicksort Were Visible</title>
<style>
html, body { margin: 0; padding: 0; background: #F5EEDD; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var N = 96;
var OPS_PER_SEC = 60;
var HOLD = 2.5;
var FIRST_T = 4.0;
var PAPER = '#EFE9DC';
var SLATE = '#2B2F36';
var SIGNAL = '#C0392B';
var CREAM = '#F5EEDD';
var INK = '#1A1A1A';
var COBALT = '#2B4A8C';
var VERMILION = '#B33A2B';
var OCHRE = '#D9A021';
var TEAL = '#2E7D6B';
var PLATE = '#1e1c18';
var PLATE_LINE = 'rgba(217,160,33,0.55)';
var TITLE_INK = '#f3ead6';
var HINT_INK = '#e8c87a';
/* One quicksort, two renders. The same algorithm on the same data
   plays in both halves in sync: crude on the left, refined on the
   right. Each cycle re-shuffles and varies one element nobody
   parameterizes: the pivot wave speed, the pivot distance, or the
   coloring rule. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function shade(hex, f) {
  var c = hexRgb(hex);
  return [Math.min(255, Math.round(c[0] * f)), Math.min(255, Math.round(c[1] * f)), Math.min(255, Math.round(c[2] * f))];
}
var BAUHAUS = [COBALT, TEAL, OCHRE, VERMILION];
var DIST_NAMES = ['EDGE', 'MIDDLE', 'FAR'];
var RULE_NAMES = ['VALUE', 'SWAP AGE', 'DEPTH'];
/* ---- cycle config: kind rotates wave speed, pivot distance, color rule ---- */
function cycleConfig(c) {
  var kind = c % 3;
  var round = Math.floor(c / 3);
  if (kind === 0) {
    var speed = (round % 2 === 0) ? 0.7 : 2.6;
    return { kind: 0, label: 'PARAMETER: PIVOT WAVE SPEED ' + speed.toFixed(1), speed: speed, rule: 'VALUE' };
  }
  if (kind === 1) {
    var d = round % 3;
    return { kind: 1, label: 'PARAMETER: PIVOT DISTANCE ' + DIST_NAMES[d], dist: d, rule: 'VALUE' };
  }
  var r = round % 3;
  return { kind: 2, label: 'PARAMETER: COLOR RULE BY ' + RULE_NAMES[r], rule: RULE_NAMES[r] };
}
/* ---- pivot functions: all real, swappable, deterministic ---- */
function pivotWave(lo, hi, call, cfg) {
  var frac = 0.5 + 0.5 * Math.sin(call * cfg.speed);
  return lo + Math.round(frac * (hi - lo));
}
function pivotDist(lo, hi, call, cfg) {
  if (cfg.dist === 0) return lo;
  if (cfg.dist === 1) return lo + Math.floor((hi - lo) / 2);
  return hi;
}
function pivotMedian(arr, lo, hi) {
  var mid = lo + Math.floor((hi - lo) / 2);
  var a = arr[lo], b = arr[mid], d = arr[hi];
  if ((a - b) * (d - a) >= 0) return lo;
  if ((b - a) * (d - b) >= 0) return mid;
  return hi;
}
/* ---- seeded shuffle: the data is fixed per cycle, only the knob varies ---- */
function shuffled(c) {
  var rng = mulberry32(1681 + c * 7919);
  var arr = [], i, j, tmp;
  for (i = 0; i < N; i++) arr.push(i + 1);
  for (i = N - 1; i > 0; i--) {
    j = Math.floor(rng() * (i + 1));
    tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
/* ---- real quicksort (Lomuto), recorded as an op trace ---- */
function genTrace(c) {
  var cfg = cycleConfig(c);
  var arr = shuffled(c);
  var ops = [];
  var call = 0;
  function swap(i, j) {
    if (i === j) return;
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    ops.push({ t: 'swap', i: i, j: j });
  }
  function qs(lo, hi, depth) {
    if (lo >= hi) return;
    var p;
    if (cfg.kind === 0) p = pivotWave(lo, hi, call, cfg);
    else if (cfg.kind === 1) p = pivotDist(lo, hi, call, cfg);
    else p = pivotMedian(arr, lo, hi);
    call++;
    ops.push({ t: 'pivot', i: p, depth: depth });
    swap(p, hi);
    var i = lo, j;
    for (j = lo; j < hi; j++) {
      ops.push({ t: 'cmp', i: j, pivot: hi });
      if (arr[j] < arr[hi]) { swap(i, j); i++; }
    }
    swap(i, hi);
    ops.push({ t: 'part', lo: lo, hi: hi, p: i, depth: depth });
    qs(lo, i - 1, depth + 1);
    qs(i + 1, hi, depth + 1);
  }
  qs(0, N - 1, 0);
  return { cfg: cfg, init: shuffled(c), ops: ops };
}
var traceCache = {};
function getTrace(c) {
  if (!traceCache[c]) traceCache[c] = genTrace(c);
  return traceCache[c];
}
function cycleDuration(c) {
  return getTrace(c).ops.length / OPS_PER_SEC + HOLD;
}
/* ---- playback: pure function of t. Rebuild state from the trace. ---- */
function stateAt(t) {
  var el = t;
  if (el < 0) el = 0;
  var c = 0, dur = cycleDuration(0);
  while (el >= dur) { el -= dur; c++; dur = cycleDuration(c); }
  var tr = getTrace(c);
  var total = tr.ops.length;
  var opCount = Math.min(total, Math.floor(el * OPS_PER_SEC));
  var sorted = opCount >= total;
  var arr = tr.init.slice();
  var depthMap = [], swapAge = [], i;
  for (i = 0; i < N; i++) { depthMap.push(0); swapAge.push(9999); }
  var pivot = -1, pivotDepth = 0, cmp = 0, swp = 0, lastCmp = -1;
  var trails = [];
  for (i = 0; i < opCount; i++) {
    var op = tr.ops[i];
    if (op.t === 'pivot') { pivot = op.i; pivotDepth = op.depth; }
    else if (op.t === 'cmp') { cmp++; lastCmp = op.i; }
    else if (op.t === 'swap') {
      swp++;
      var vi = arr[op.i], vj = arr[op.j];
      var tmp = arr[op.i]; arr[op.i] = arr[op.j]; arr[op.j] = tmp;
      swapAge[op.i] = 0; swapAge[op.j] = 0;
      trails.push({ i: op.i, v: vj, op: i });
      trails.push({ i: op.j, v: vi, op: i });
    } else if (op.t === 'part') {
      var k;
      for (k = op.lo; k <= op.hi; k++) depthMap[k] = op.depth;
    }
    var s;
    for (s = 0; s < N; s++) if (swapAge[s] < 9999) swapAge[s]++;
  }
  for (i = 0; i < trails.length; i++) trails[i].age = opCount - 1 - trails[i].op;
  var fresh = [];
  for (i = trails.length - 1; i >= 0; i--) {
    if (trails[i].age < 24) fresh.push(trails[i]);
    if (fresh.length >= 24) break;
  }
  return {
    cycle: c, cfg: tr.cfg, arr: arr, pivot: pivot, pivotDepth: pivotDepth,
    cmp: cmp, swp: swp, lastCmp: lastCmp, depthMap: depthMap,
    swapAge: swapAge, trails: fresh, sorted: sorted, opCount: opCount,
    totalOps: total
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Plot geometry: two halves split by a vertical divider. On phones the
   plots go full-bleed to the viewport edges; on desktop they sit inset. */
function plotRect(half) {
  var m = isPhone ? 4 : 14;
  var top = isPhone ? 76 : 66;
  var bottom = isPhone ? 78 : 84;
  var div = VW / 2;
  if (half === 0) return { x: m, w: div - m - 2, y: top, h: VH - top - bottom };
  return { x: div + 2, w: VW - div - 2 - m, y: top, h: VH - top - bottom };
}
function barColor(st, i) {
  var rule = st.cfg.rule;
  if (rule === 'SWAP AGE') {
    var a = st.swapAge[i];
    if (a < 20) return VERMILION;
    if (a < 60) return OCHRE;
    if (a < 150) return TEAL;
    return COBALT;
  }
  if (rule === 'DEPTH') {
    var d = st.depthMap[i];
    if (d === 0) return COBALT;
    if (d === 1) return VERMILION;
    if (d === 2) return OCHRE;
    return TEAL;
  }
  var v = st.arr[i];
  if (v <= 24) return COBALT;
  if (v <= 48) return TEAL;
  if (v <= 72) return OCHRE;
  return VERMILION;
}
/* Left half: the crude first render. Thin bars, raw swaps, readouts. */
function drawCrude(st) {
  var f = plotRect(0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW / 2, VH);
  var bw = f.w / N;
  var i, x, h;
  for (i = 0; i < N; i++) {
    h = (st.arr[i] / N) * f.h;
    x = f.x + i * bw;
    ctx.fillStyle = (i === st.pivot) ? SIGNAL : SLATE;
    ctx.fillRect(x + 0.5, f.y + f.h - h, Math.max(1, bw - 1), h);
  }
  if (st.lastCmp >= 0 && !st.sorted) {
    var cx = f.x + st.lastCmp * bw;
    ctx.fillStyle = SIGNAL;
    ctx.fillRect(cx, f.y - 5, Math.max(1, bw - 1), 4);
  }
  var smallPx = isPhone ? 10 : 11;
  ctx.font = smallPx + 'px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = SLATE;
  var line1 = 'CMP ' + String(st.cmp).padStart(4, '0') + '  SWP ' + String(st.swp).padStart(4, '0');
  var line2 = st.sorted ? 'SORTED  N=' + N : 'PIVOT v=' + (st.pivot >= 0 ? st.arr[st.pivot] : '--') + ' @i=' + (st.pivot >= 0 ? st.pivot : '--') + '  DEPTH ' + st.pivotDepth;
  ctx.fillText(line1, f.x, f.y + f.h + 6);
  ctx.fillText(line2, f.x, f.y + f.h + 6 + smallPx + 3);
  /* half label sits just above the plot, hugging the divider so the
     title plate never covers it */
  ctx.textAlign = 'right';
  ctx.font = 'bold ' + smallPx + 'px monospace';
  ctx.fillText('CRUDE', VW / 2 - 8, f.y - 16);
}
/* Right half: the refined render. Slabs with isometric depth, swap
   trails, a glowing pivot. Same array, same op, same instant. */
function drawRefined(st) {
  var f = plotRect(1);
  ctx.fillStyle = CREAM;
  ctx.fillRect(VW / 2, 0, VW / 2, VH);
  var bw = f.w / N;
  var dep = isPhone ? 2 : 3;
  var i, x, h, col;
  /* swap trails: fading marks where swaps just happened */
  for (i = 0; i < st.trails.length; i++) {
    var tr = st.trails[i];
    var a = 1 - tr.age / 24;
    var th = (tr.v / N) * f.h;
    var tx = f.x + tr.i * bw;
    ctx.fillStyle = rgba(hexRgb(i % 2 ? TEAL : VERMILION), a * 0.55);
    ctx.fillRect(tx, f.y + f.h - th - 3, Math.max(1.5, bw - 1), 3);
  }
  for (i = 0; i < N; i++) {
    h = (st.arr[i] / N) * f.h;
    x = f.x + i * bw;
    col = barColor(st, i);
    var w = Math.max(1, bw - 1);
    /* pivot glow: flat nested rects, no gradient */
    if (i === st.pivot && !st.sorted) {
      ctx.fillStyle = rgba(hexRgb(VERMILION), 0.18);
      ctx.fillRect(x - 3, f.y + f.h - h - 3 - dep, w + 6, h + 6 + dep);
      ctx.fillStyle = rgba(hexRgb(VERMILION), 0.35);
      ctx.fillRect(x - 1.5, f.y + f.h - h - 1.5 - dep, w + 3, h + 3 + dep);
    }
    /* slab: front face, top face, right side face */
    ctx.fillStyle = col;
    ctx.fillRect(x, f.y + f.h - h, w, h);
    ctx.fillStyle = rgba(shade(col, 1.25), 1);
    ctx.beginPath();
    ctx.moveTo(x, f.y + f.h - h);
    ctx.lineTo(x + dep, f.y + f.h - h - dep);
    ctx.lineTo(x + w + dep, f.y + f.h - h - dep);
    ctx.lineTo(x + w, f.y + f.h - h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgba(shade(col, 0.62), 1);
    ctx.beginPath();
    ctx.moveTo(x + w, f.y + f.h - h);
    ctx.lineTo(x + w + dep, f.y + f.h - h - dep);
    ctx.lineTo(x + w + dep, f.y + f.h - dep);
    ctx.lineTo(x + w, f.y + f.h);
    ctx.closePath();
    ctx.fill();
    if (i === st.pivot && !st.sorted) {
      ctx.fillStyle = SIGNAL;
      ctx.fillRect(x, f.y + f.h - h - dep, w, 2);
    }
  }
  var smallPx = isPhone ? 10 : 11;
  ctx.font = smallPx + 'px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = INK;
  var line1 = st.sorted ? 'SORTED  N=' + N : 'CYCLE ' + (st.cycle + 1) + '  OP ' + st.opCount + '/' + st.totalOps;
  var line2 = 'RULE ' + st.cfg.rule;
  ctx.fillText(line1, f.x, f.y + f.h + 6);
  ctx.fillText(line2, f.x, f.y + f.h + 6 + smallPx + 3);
  /* half label hugs the divider; if the title plate crosses the
     divider (square thumbs), it docks at the far right instead */
  ctx.font = 'bold ' + smallPx + 'px monospace';
  var tm = titleMetrics();
  if (VW / 2 + 8 < 12 + tm.plateW) {
    ctx.textAlign = 'right';
    ctx.fillText('REFINED', VW - 8, f.y - 16);
  } else {
    ctx.textAlign = 'left';
    ctx.fillText('REFINED', VW / 2 + 8, f.y - 16);
  }
}
function titleMetrics() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('If the Quicksort Were Visible').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('If the Quicksort Were Visible').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 19').width;
  return { smallPx: smallPx, titlePx: titlePx, plateW: Math.max(titleW, dateW) + 28, plateH: titlePx + smallPx + 20 };
}
function drawPlates(st) {
  var tm = titleMetrics();
  var smallPx = tm.smallPx, titlePx = tm.titlePx;
  var plateW = tm.plateW, plateH = tm.plateH;
  var plateX = 12, plateY = 12;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('If the Quicksort Were Visible', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 19', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  /* caption: the parameterized element this cycle, centered on the divider */
  var capPx = isPhone ? 10 : 12;
  ctx.font = 'bold ' + capPx + 'px monospace';
  var capW = ctx.measureText(st.cfg.label).width;
  var capPlateW = capW + 24;
  var capPlateH = capPx + 14;
  var capX = Math.max(hintPlateX + hintPlateW + 8, (VW - capPlateW) / 2);
  if (capX + capPlateW > VW - 12) capX = VW - capPlateW - 12;
  var capY = VH - capPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(capX, capY, capPlateW, capPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(capX + 0.5, capY + 0.5, capPlateW - 1, capPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(st.cfg.label, capX + 12, capY + 7);
}
function draw(t) {
  size();
  var st = stateAt(t);
  drawCrude(st);
  drawRefined(st);
  /* the divider, drawn over both halves so it stays legible */
  ctx.fillStyle = INK;
  ctx.fillRect(VW / 2 - 1, 0, 2, VH);
  drawPlates(st);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    cycleLabel: function () { return stateAt(FIRST_T).cfg.label; },
    opCount: function () { return stateAt(FIRST_T).opCount; },
    barCount: function () { return N; },
    sortedCheck: function () {
      var tr = getTrace(0);
      var arr = tr.init.slice();
      var i;
      for (i = 0; i < tr.ops.length; i++) {
        var op = tr.ops[i];
        if (op.t === 'swap') { var tmp = arr[op.i]; arr[op.i] = arr[op.j]; arr[op.j] = tmp; }
      }
      for (i = 1; i < N; i++) if (arr[i] < arr[i - 1]) return false;
      return true;
    }
  };
}
/* ---- frame one: t = FIRST_T, cycle 0 mid-sort, fixed phase ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
