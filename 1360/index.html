<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ledger of Air</title>
<style>
  html, body { margin: 0; padding: 0; background: #EDE8DC; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var PAPER = '#EDE8DC';
  var GRAPHITE = '#2B2B2B';
  var SHIPRED = '#A63D2F';
  var COPPER = '#B87333';
  var ERASURE = '#0A0A0A';

  var SEED = 1360000;
  var K = 20;               // rows per scroll period
  var DRIFT = 4;            // px per second, downward
  var BAND_CREEP_SECONDS = 600; // band grows 12% -> 20% over first 10 min, then holds

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function mod(n, m) { return ((n % m) + m) % m; }

  var W = 0, H = 0, isPhone = false, colW = 92, rowH = 64, ncols = 0;
  var speckle = [];

  function size() {
    var vw, vh;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      vw = visualViewport.width; vh = visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth) {
      vw = window.innerWidth; vh = window.innerHeight;
    } else { vw = 1280; vh = 900; }
    W = Math.round(vw); H = Math.round(vh);
    canvas.width = W; canvas.height = H;
    var minScreen = 1e9;
    try {
      if (typeof window !== 'undefined' && window.screen) {
        minScreen = Math.min(window.screen.width, window.screen.height);
      }
    } catch (e) { /* no screen info; fall back to aspect */ }
    isPhone = (minScreen < 700) || (H > W * 1.15);
    colW = isPhone ? 56 : 92;
    rowH = isPhone ? 54 : 64;
    ncols = Math.max(4, Math.floor(W / colW));
    var r = mulberry32(1360999);
    speckle = [];
    for (var i = 0; i < 300; i++) {
      speckle.push([r() * W, r() * H, 0.03 + r() * 0.05]);
    }
  }
  size();
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', size);
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', size);
    }
  }

  // Row glyphs: pure function of absolute row index (mod K) and column slot.
  // Density rises with (a mod K): sparse at the top of the tile, dense at the
  // bottom, so frame one densifies downward and the pattern repeats exactly
  // every K rows, making the scroll seamless forever.
  function rowGlyphs(a) {
    var am = mod(a, K);
    var dens = 0.30 + 0.70 * (am / (K - 1));
    var r = mulberry32(SEED + am * 7919);
    var count = Math.round(ncols * dens);
    var slots = [];
    for (var c = 0; c < ncols; c++) slots.push(c);
    for (var i = slots.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var tmp = slots[i]; slots[i] = slots[j]; slots[j] = tmp;
    }
    var out = [];
    for (var k = 0; k < count; k++) {
      var col = slots[k];
      var type = Math.floor(r() * 6);
      var cr = r();
      var color = GRAPHITE;
      if (cr < 0.18) color = SHIPRED; else if (cr < 0.30) color = COPPER;
      out.push({
        x: (col + 0.5) * colW + (r() - 0.5) * 12,
        type: type, color: color,
        s: (isPhone ? 0.72 : 1) * (0.8 + r() * 0.5),
        phase: r()
      });
    }
    return out;
  }

  function drawGlyph(g, cx, cy, alpha) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(g.s, g.s);
    ctx.strokeStyle = g.color;
    ctx.fillStyle = g.color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var u = isPhone ? 13 : 17; // glyph unit
    if (g.type === 0) { // repeat sign: two bars + two dots
      ctx.beginPath(); ctx.moveTo(-u * 0.55, -u * 0.6); ctx.lineTo(-u * 0.55, u * 0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-u * 0.25, -u * 0.6); ctx.lineTo(-u * 0.25, u * 0.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(u * 0.25, -u * 0.25, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(u * 0.25, u * 0.25, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (g.type === 1) { // whole note: open oval
      ctx.beginPath(); ctx.ellipse(0, 0, u * 0.55, u * 0.38, -0.3, 0, Math.PI * 2); ctx.stroke();
    } else if (g.type === 2) { // quarter rest: zigzag squiggle
      ctx.beginPath();
      ctx.moveTo(-u * 0.3, -u * 0.7);
      ctx.lineTo(u * 0.3, -u * 0.3);
      ctx.lineTo(-u * 0.3, u * 0.1);
      ctx.lineTo(u * 0.35, u * 0.5);
      ctx.lineTo(-u * 0.1, u * 0.75);
      ctx.stroke();
    } else if (g.type === 3) { // ship silhouette: hull + mast, abstract
      ctx.beginPath();
      ctx.moveTo(-u * 0.7, 0);
      ctx.lineTo(u * 0.7, 0);
      ctx.lineTo(u * 0.45, u * 0.45);
      ctx.lineTo(-u * 0.45, u * 0.45);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -u * 0.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -u * 0.7); ctx.lineTo(u * 0.35, -u * 0.25); ctx.lineTo(0, -u * 0.25); ctx.closePath(); ctx.fill();
    } else if (g.type === 4) { // barbed line
      ctx.beginPath(); ctx.moveTo(-u * 0.7, 0); ctx.lineTo(u * 0.7, 0); ctx.stroke();
      var bx;
      for (var b = 0; b < 3; b++) {
        bx = -u * 0.4 + b * u * 0.4;
        ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + u * 0.18, -u * 0.35); ctx.stroke();
      }
    } else { // survey grid: 3x3 square
      ctx.strokeRect(-u * 0.45, -u * 0.45, u * 0.9, u * 0.9);
      ctx.beginPath(); ctx.moveTo(-u * 0.15, -u * 0.45); ctx.lineTo(-u * 0.15, u * 0.45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(u * 0.15, -u * 0.45); ctx.lineTo(u * 0.15, u * 0.45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-u * 0.45, -u * 0.15); ctx.lineTo(u * 0.45, -u * 0.15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-u * 0.45, u * 0.15); ctx.lineTo(u * 0.45, u * 0.15); ctx.stroke();
    }
    ctx.restore();
  }

  // User-drawn chronology lines: {pts: [[x,y]...], glyphs: [{x,y,ang,type,color,s}]}
  var userLines = [];
  var cur = null; // current drag: {pts: []}

  function glyphsAlong(pts, lineIndex) {
    var out = [];
    if (pts.length < 2) return out;
    var step = 46, acc = 0;
    for (var i = 1; i < pts.length; i++) {
      var x0 = pts[i - 1][0], y0 = pts[i - 1][1];
      var x1 = pts[i][0], y1 = pts[i][1];
      var dx = x1 - x0, dy = y1 - y0;
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len === 0) continue;
      var ang = Math.atan2(dy, dx);
      var d = step - acc;
      while (d < len) {
        var t = d / len;
        var r = mulberry32(SEED + 500000 + lineIndex * 7919 + out.length * 131);
        out.push({
          x: x0 + dx * t, y: y0 + dy * t, ang: ang,
          type: Math.floor(r() * 6),
          color: r() < 0.2 ? SHIPRED : (r() < 0.32 ? COPPER : GRAPHITE),
          s: (isPhone ? 0.72 : 1) * (0.8 + r() * 0.4)
        });
        d += step;
      }
      acc = (acc + len) % step;
    }
    return out;
  }

  // Gesture-gated drone: created ONLY inside a pointerdown gesture, never autoplay.
  var audioCtx = null, droneGain = null, droneFilter = null, droneOsc = [];
  function bandFrac(t) {
    return 0.12 + Math.min(0.08, (t / BAND_CREEP_SECONDS) * 0.08);
  }
  function droneStart(t) {
    try {
      if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
      if (!audioCtx) {
        var AC = (typeof AudioContext !== 'undefined') ? AudioContext : webkitAudioContext;
        audioCtx = new AC();
        droneFilter = audioCtx.createBiquadFilter();
        droneFilter.type = 'lowpass';
        droneFilter.frequency.value = 900;
        droneGain = audioCtx.createGain();
        droneGain.gain.value = 0;
        droneFilter.connect(droneGain);
        droneGain.connect(audioCtx.destination);
        [55, 55.6].forEach(function (f) {
          var o = audioCtx.createOscillator();
          o.type = 'sine'; o.frequency.value = f;
          o.connect(droneFilter); o.start();
          droneOsc.push(o);
        });
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var extra = bandFrac(t) - 0.12;
      droneFilter.frequency.setTargetAtTime(900 - (extra / 0.08) * 500, audioCtx.currentTime, 0.3);
      droneGain.gain.setTargetAtTime(0.04, audioCtx.currentTime, 0.2);
    } catch (e) { /* audio unavailable; piece stays silent */ }
  }
  function droneStop() {
    try {
      if (audioCtx && droneGain) {
        droneGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
      }
    } catch (e) { /* ignore */ }
  }

  var lastT = 0;
  function evtPos(e) {
    try {
      var r = canvas.getBoundingClientRect();
      if (r && typeof r.left === 'number') return [e.clientX - r.left, e.clientY - r.top];
    } catch (err) { /* fall through */ }
    return [e.clientX || 0, e.clientY || 0];
  }
  function onDown(e) {
    var p = evtPos(e);
    cur = { pts: [[p[0], p[1]]] };
    droneStart(lastT);
  }
  function onMove(e) {
    if (!cur) return;
    var p = evtPos(e);
    var x = p[0], y = p[1];
    var last = cur.pts[cur.pts.length - 1];
    var dx = x - last[0], dy = y - last[1];
    if (dx * dx + dy * dy >= 64) cur.pts.push([x, y]);
  }
  function onUp() {
    if (cur && cur.pts.length >= 2) {
      var line = { pts: cur.pts, glyphs: glyphsAlong(cur.pts, userLines.length) };
      userLines.push(line);
      if (userLines.length > 8) userLines.shift();
    }
    cur = null;
    droneStop();
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // paper speckle (precomputed, deterministic)
    ctx.fillStyle = GRAPHITE;
    for (var i = 0; i < speckle.length; i++) {
      ctx.globalAlpha = speckle[i][2];
      ctx.fillRect(speckle[i][0], speckle[i][1], 1.5, 1.5);
    }
    ctx.globalAlpha = 1;

    // Scrolling score: rows move downward with s; row identity from absolute
    // index, so the picture is exactly periodic in s with period K*rowH.
    var s = DRIFT * t;
    var period = K * rowH;
    var smod = mod(s, period);
    for (var ySlot = -rowH; ySlot < H + rowH; ySlot += rowH) {
      var a = Math.floor((ySlot - smod) / rowH);
      var y = a * rowH + smod;
      // y lands within one row of ySlot by construction; draw at y.
      var glyphs = rowGlyphs(a);
      for (var gi = 0; gi < glyphs.length; gi++) {
        var g = glyphs[gi];
        var breathe = 0.75 + 0.25 * (0.5 + 0.5 * Math.sin(2 * Math.PI * (t / 9 + g.phase)));
        drawGlyph(g, g.x, y + rowH * 0.5, breathe);
      }
    }

    // Erasure band: final 12% at frame one, creeping upward, never retreating.
    var bf = bandFrac(t);
    var bandTop = H * (1 - bf);
    ctx.globalAlpha = 1;
    ctx.fillStyle = ERASURE;
    ctx.fillRect(0, bandTop, W, H - bandTop);

    // User chronology lines (over the band so the drawn line stays visible).
    function drawLine(line) {
      ctx.save();
      ctx.strokeStyle = GRAPHITE;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(line.pts[0][0], line.pts[0][1]);
      for (var i = 1; i < line.pts.length; i++) ctx.lineTo(line.pts[i][0], line.pts[i][1]);
      ctx.globalAlpha = 0.8;
      ctx.stroke();
      ctx.restore();
      for (var gi = 0; gi < line.glyphs.length; gi++) {
        var g = line.glyphs[gi];
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.rotate(g.ang);
        drawGlyphAtOrigin({ type: g.type, color: g.color, s: g.s, phase: 0 });
        ctx.restore();
      }
      // terminal black band segment at the release point
      var n = line.pts.length;
      if (n >= 2) {
        var ex = line.pts[n - 1][0], ey = line.pts[n - 1][1];
        var px = line.pts[n - 2][0], py = line.pts[n - 2][1];
        var ang = Math.atan2(ey - py, ex - px);
        ctx.save();
        ctx.translate(ex, ey);
        ctx.rotate(ang);
        ctx.fillStyle = ERASURE;
        ctx.globalAlpha = 1;
        ctx.fillRect(-8, -13, 78, 26);
        ctx.restore();
      }
    }
    for (var li = 0; li < userLines.length; li++) drawLine(userLines[li]);
    if (cur && cur.pts.length >= 2) {
      drawLine({ pts: cur.pts, glyphs: glyphsAlong(cur.pts, userLines.length) });
    }
    ctx.globalAlpha = 1;
  }

  // Helper: draw a glyph centered at the current transform origin.
  function drawGlyphAtOrigin(g) {
    var u = isPhone ? 13 : 17;
    ctx.strokeStyle = g.color;
    ctx.fillStyle = g.color;
    ctx.globalAlpha = 0.95;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.scale(g.s, g.s);
    if (g.type === 0) {
      ctx.beginPath(); ctx.moveTo(-u * 0.55, -u * 0.6); ctx.lineTo(-u * 0.55, u * 0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-u * 0.25, -u * 0.6); ctx.lineTo(-u * 0.25, u * 0.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(u * 0.25, -u * 0.25, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(u * 0.25, u * 0.25, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (g.type === 1) {
      ctx.beginPath(); ctx.ellipse(0, 0, u * 0.55, u * 0.38, -0.3, 0, Math.PI * 2); ctx.stroke();
    } else if (g.type === 2) {
      ctx.beginPath();
      ctx.moveTo(-u * 0.3, -u * 0.7);
      ctx.lineTo(u * 0.3, -u * 0.3);
      ctx.lineTo(-u * 0.3, u * 0.1);
      ctx.lineTo(u * 0.35, u * 0.5);
      ctx.lineTo(-u * 0.1, u * 0.75);
      ctx.stroke();
    } else if (g.type === 3) {
      ctx.beginPath();
      ctx.moveTo(-u * 0.7, 0);
      ctx.lineTo(u * 0.7, 0);
      ctx.lineTo(u * 0.45, u * 0.45);
      ctx.lineTo(-u * 0.45, u * 0.45);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -u * 0.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -u * 0.7); ctx.lineTo(u * 0.35, -u * 0.25); ctx.lineTo(0, -u * 0.25); ctx.closePath(); ctx.fill();
    } else if (g.type === 4) {
      ctx.beginPath(); ctx.moveTo(-u * 0.7, 0); ctx.lineTo(u * 0.7, 0); ctx.stroke();
      var bx;
      for (var b = 0; b < 3; b++) {
        bx = -u * 0.4 + b * u * 0.4;
        ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + u * 0.18, -u * 0.35); ctx.stroke();
      }
    } else {
      ctx.strokeRect(-u * 0.45, -u * 0.45, u * 0.9, u * 0.9);
      ctx.beginPath(); ctx.moveTo(-u * 0.15, -u * 0.45); ctx.lineTo(-u * 0.15, u * 0.45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(u * 0.15, -u * 0.45); ctx.lineTo(u * 0.15, u * 0.45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-u * 0.45, -u * 0.15); ctx.lineTo(u * 0.45, -u * 0.15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-u * 0.45, u * 0.15); ctx.lineTo(u * 0.45, u * 0.15); ctx.stroke();
    }
  }

  // Frame one: synchronous fixed-phase draw. Clock starts only with the rAF loop.
  draw(0);
  var t0 = null;
  function loop(ts) {
    if (t0 === null) t0 = ts;
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
