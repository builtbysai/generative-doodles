<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№12 · Globe</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b0e; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(240,238,230,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.85); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another globe</div>
<script>
'use strict';
// No12 Globe.
// An icosphere drawn as wireframe only: an icosahedron subdivided
// once, its vertices pushed back onto the sphere, the unique edges
// projected in orthographic view. A seeded quarter of the edges are
// dropped, so the net is torn in places, and a few surviving edges
// are gold. Thin warm-white lines on near-black; the sphere is
// implied by its net, never filled (brief concept 12, triangle
// globe, as the brief words it: wireframe with edge dropout).

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '12', 10) || 12;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0b0b0e';

function icosphere() {
  const t = (1 + Math.sqrt(5)) / 2;
  let verts = [
    [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
    [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
    [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]
  ].map(v => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; });
  let faces = [
    [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
    [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
    [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
    [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
  ];
  const midCache = {};
  function midpoint(a, b) {
    const key = a < b ? a + '_' + b : b + '_' + a;
    if (midCache[key] !== undefined) return midCache[key];
    const va = verts[a], vb = verts[b];
    const m = [(va[0] + vb[0]) / 2, (va[1] + vb[1]) / 2, (va[2] + vb[2]) / 2];
    const l = Math.hypot(m[0], m[1], m[2]);
    verts.push([m[0] / l, m[1] / l, m[2] / l]);
    midCache[key] = verts.length - 1;
    return midCache[key];
  }
  const next = [];
  for (const f of faces) {
    const ab = midpoint(f[0], f[1]), bc = midpoint(f[1], f[2]), ca = midpoint(f[2], f[0]);
    next.push([f[0], ab, ca], [f[1], bc, ab], [f[2], ca, bc], [ab, bc, ca]);
  }
  faces = next;
  const edgeSet = new Set();
  const edges = [];
  for (const f of faces) {
    for (let e = 0; e < 3; e++) {
      const a = f[e], b = f[(e + 1) % 3];
      const key = a < b ? a + '_' + b : b + '_' + a;
      if (!edgeSet.has(key)) { edgeSet.add(key); edges.push([a, b]); }
    }
  }
  return { verts, edges };
}

function compose(s) {
  const rnd = mulberry32(s);
  return {
    ry: rnd() * Math.PI * 2,
    rx: (rnd() - 0.5) * 1.1,
    drop: 0.09 + rnd() * 0.10,
    gold: 0.025 + rnd() * 0.03,
    jr: rnd
  };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;
const GEO = icosphere();

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2;
  const R = S * 0.42;
  const cosY = Math.cos(p.ry), sinY = Math.sin(p.ry);
  const cosX = Math.cos(p.rx), sinX = Math.sin(p.rx);
  const proj = GEO.verts.map(v => {
    const x1 = v[0] * cosY + v[2] * sinY;
    const z1 = -v[0] * sinY + v[2] * cosY;
    const y2 = v[1] * cosX - z1 * sinX;
    const z2 = v[1] * sinX + z1 * cosX;
    return [cx + x1 * R, cy + y2 * R, z2];
  });

  const ernd = mulberry32((seed ^ 0x85ebca) >>> 0);
  ctx.lineWidth = Math.max(0.7, S / 950);
  for (const [a, b] of GEO.edges) {
    const roll = ernd();
    if (roll < p.drop) continue;
    const zAvg = (proj[a][2] + proj[b][2]) / 2;
    const back = zAvg < -0.15;
    if (roll > 1 - p.gold) {
      ctx.strokeStyle = 'rgba(212,175,55,0.9)';
    } else {
      ctx.strokeStyle = back ? 'rgba(240,238,230,0.16)' : 'rgba(240,238,230,0.75)';
    }
    ctx.beginPath();
    ctx.moveTo(proj[a][0], proj[a][1]);
    ctx.lineTo(proj[b][0], proj[b][1]);
    ctx.stroke();
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
