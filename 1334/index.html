<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shea Butter</title>
<style>
  html, body { margin: 0; padding: 0; background: #100F0E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG only; never Math.random, so every frame is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, S = 0, isPhone = false, currentT = 0, started = false, startMs = 0;
  var touches = [];   // {block, t0} touch-warmth events
  var spins = [];     // {block, a} cumulative drag-spin deltas

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : w;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : h;
    var minDim = Math.min(sw, sh);
    isPhone = minDim < 700 || (h > w * 1.15);
    S = Math.min(w, h);
  }

  // Paired-arc dot: its own path, moveTo first (node-canvas ellipse/arc quirk).
  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function blob(x, y, rx, ry, rot, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
    ctx.fill();
  }
  function smooth(a, b, x) {
    if (x <= a) return 0;
    if (x >= b) return 1;
    var u = (x - a) / (b - a);
    return u * u * (3 - 2 * u);
  }

  // ---- steel panel backdrop: a loose grid, never a solid wall ----
  var panels = (function () {
    var rnd = mulberry32(1334001);
    var list = [];
    var cols = 4, rows = 5;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        // Some cells stay empty so the grid reads loose, not a wall.
        if (rnd() < 0.22) continue;
        var shade = 22 + Math.floor(rnd() * 10);
        list.push({ c: c, r: r, shade: shade, wob: (rnd() - 0.5) * 0.06 });
      }
    }
    return list;
  })();

  // ---- shea blocks: 4 only, each a different scale, largest carries the bust ----
  var blocks = (function () {
    var rnd = mulberry32(1334002);
    var defs = [
      { fx: 0.30, fy: 0.30, w: 0.34, h: 0.30, bust: true,  phase: 0.00, depth: 1.00 },
      { fx: 0.72, fy: 0.24, w: 0.22, h: 0.18, bust: false, phase: 0.27, depth: 0.80 },
      { fx: 0.24, fy: 0.72, w: 0.26, h: 0.22, bust: false, phase: 0.55, depth: 0.90 },
      { fx: 0.72, fy: 0.70, w: 0.17, h: 0.15, bust: false, phase: 0.81, depth: 0.70 }
    ];
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      d.dents = [];
      for (var k = 0; k < 5; k++) {
        d.dents.push({ dx: (rnd() - 0.5) * 0.6, dy: (rnd() - 0.5) * 0.5, r: 0.05 + rnd() * 0.06 });
      }
      d.flecks = [];
      for (var f = 0; f < 14; f++) {
        d.flecks.push({ dx: (rnd() - 0.5) * 0.8, dy: (rnd() - 0.5) * 0.7, r: 0.012 + rnd() * 0.02 });
      }
    }
    return defs;
  })();

  // Melt cycle: slump -> pool -> re-rise, 40 s per block, seeded phase offsets.
  function melt(p) {
    // p in [0,1). Returns {sy, sx, pool} scale factors.
    var sy, sx, pool;
    if (p < 0.35) {
      var u = smooth(0, 0.35, p);
      sy = 1 - 0.15 * u; sx = 1 + 0.15 * u; pool = u * 0.4;
    } else if (p < 0.60) {
      var v = smooth(0.35, 0.60, p);
      sy = 0.85 - 0.07 * v; sx = 1.15 + 0.10 * v; pool = 0.4 + 0.6 * v;
    } else {
      var q = smooth(0.60, 1.0, p);
      sy = 0.78 + 0.22 * q; sx = 1.25 - 0.25 * q; pool = 1 - q;
    }
    return { sy: sy, sx: sx, pool: pool };
  }

  function warmthOf(bi, t) {
    var w = 0;
    for (var i = 0; i < touches.length; i++) {
      if (touches[i].block === bi) {
        var age = t - touches[i].t0;
        if (age >= 0) w = Math.max(w, Math.exp(-age / 6));
      }
    }
    return w;
  }
  function spinOf(bi) {
    var a = 0;
    for (var i = 0; i < spins.length; i++) {
      if (spins[i].block === bi) a += spins[i].a;
    }
    return a;
  }

  function blockGeom(b, t) {
    var bw = b.w * S * (isPhone ? 0.92 : 1);
    var bh = b.h * S * (isPhone ? 0.92 : 1);
    var x = b.fx * W, y = b.fy * H;
    var m = melt(((t / 40) + b.phase) % 1);
    return { x: x, y: y, w: bw * m.sx, h: bh * m.sy, pool: m.pool };
  }

  function drawBlock(bi, t) {
    var b = blocks[bi];
    var g = blockGeom(b, t);
    var warm = warmthOf(bi, t);
    var rot = spinOf(bi);
    var cx = g.x, cy = g.y;

    // Waxy glow: layered flat-alpha ellipses, never gradients.
    var glowA = 0.08 + 0.10 * warm + 0.04 * g.pool;
    blob(cx, cy, g.w * 0.78, g.h * 0.78, rot * 0.2, 'rgba(245,212,126,' + glowA.toFixed(3) + ')');
    blob(cx, cy, g.w * 0.62, g.h * 0.62, rot * 0.2, 'rgba(227,169,47,' + (glowA * 0.8).toFixed(3) + ')');

    // Pool spread at the base while pooled.
    if (g.pool > 0.05) {
      blob(cx, cy + g.h * 0.45, g.w * (0.45 + 0.20 * g.pool), g.h * 0.10 * g.pool + 2, 0, 'rgba(227,169,47,0.40)');
    }

    // Body: overlapping blobby ellipses, flat alpha.
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    blob(0, 0, g.w * 0.5, g.h * 0.5, 0.15, '#E3A92F');
    blob(-g.w * 0.22, -g.h * 0.08, g.w * 0.30, g.h * 0.32, -0.2, '#E3A92F');
    blob(g.w * 0.20, g.h * 0.10, g.w * 0.28, g.h * 0.30, 0.25, '#E3A92F');
    blob(0, g.h * 0.28, g.w * 0.42, g.h * 0.18, 0, '#8A5F1A');
    blob(-g.w * 0.18, -g.h * 0.22, g.w * 0.20, g.h * 0.14, 0.1, '#F5D47E');
    blob(g.w * 0.12, -g.h * 0.05, g.w * 0.10, g.h * 0.08, 0, '#F5D47E');
    // Thumb-print dents, carved into the surface.
    for (var i = 0; i < b.dents.length; i++) {
      var d = b.dents[i];
      dot(d.dx * g.w, d.dy * g.h, d.r * g.w * 0.45, 'rgba(110,74,20,0.50)');
    }
    // Touch dent: appears with warmth, then fills back in as warmth decays.
    if (warm > 0.03) {
      dot(g.w * 0.18, -g.h * 0.18, (6 + 10 * warm) * b.depth, 'rgba(110,74,20,' + (0.7 * warm).toFixed(3) + ')');
    }
    // Seeded flecks for rough-carved texture.
    for (var f = 0; f < b.flecks.length; f++) {
      var fl = b.flecks[f];
      dot(fl.dx * g.w, fl.dy * g.h, fl.r * S * 0.5, 'rgba(138,95,26,0.35)');
    }
    // Frozen drip mid-run on the block's flank.
    blob(g.w * 0.48, g.h * 0.10, g.w * 0.05, g.h * 0.22, 0.1, '#E3A92F');
    dot(g.w * 0.48, g.h * 0.34, g.w * 0.05, '#E3A92F');

    // The bust: cranium with brow ridge and nose hint, no eyes, ever.
    if (b.bust) {
      blob(0, -g.h * 0.62, g.w * 0.30, g.h * 0.30, 0, '#E3A92F');
      blob(0, -g.h * 0.70, g.w * 0.20, g.h * 0.10, 0, '#F5D47E');
      blob(0, -g.h * 0.58, g.w * 0.14, g.h * 0.035, 0, '#8A5F1A'); // brow ridge
      blob(g.w * 0.01, -g.h * 0.51, g.w * 0.03, g.h * 0.06, 0, '#8A5F1A'); // nose hint
    }
    ctx.restore();
  }

  // Idle drip: one detaches every 25 s from a seeded block, falls, fades before landing.
  function drawDrip(t) {
    var cycle = Math.floor(t / 25);
    var ct = t - cycle * 25;
    if (ct < 2 || ct > 8) return;
    var rnd = mulberry32(1334003 + cycle * 7919);
    var bi = Math.floor(rnd() * blocks.length);
    var g = blockGeom(blocks[bi], t);
    var u = (ct - 2) / 6;
    var y = g.y + g.h * 0.5 + u * u * S * 0.22;
    var a = u < 0.7 ? 0.9 : 0.9 * (1 - (u - 0.7) / 0.3);
    if (a <= 0) return;
    dot(g.x + g.w * 0.3, y, 4 * blocks[bi].depth, 'rgba(227,169,47,' + a.toFixed(3) + ')');
  }

  function draw(t) {
    currentT = t;
    ctx.fillStyle = '#100F0E';
    ctx.fillRect(0, 0, W, H);
    // Loose steel panel grid.
    var pw = W / 4, ph = H / 5;
    for (var i = 0; i < panels.length; i++) {
      var p = panels[i];
      var x = p.c * pw + pw * 0.06, y = p.r * ph + ph * 0.06;
      var w = pw * 0.88, h = ph * 0.88;
      ctx.fillStyle = 'rgb(' + p.shade + ',' + (p.shade - 1) + ',' + (p.shade - 2) + ')';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w, h);
    }
    // Blocks far-to-near by depth (smallest depth first).
    var order = [3, 1, 2, 0];
    for (var k = 0; k < order.length; k++) drawBlock(order[k], t);
    drawDrip(t);
  }

  function hitBlock(x, y) {
    var best = -1, bestD = 1e9;
    for (var i = 0; i < blocks.length; i++) {
      var g = blockGeom(blocks[i], currentT);
      var dx = (x - g.x) / (g.w * 0.6), dy = (y - g.y) / (g.h * 0.6);
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    return bestD < 1.44 ? best : -1;
  }

  var downBlock = -1, lastX = 0;
  function onDown(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX || 0) - r.left, y = (e.clientY || 0) - r.top;
    downBlock = hitBlock(x, y);
    lastX = x;
    if (downBlock >= 0) touches.push({ block: downBlock, t0: currentT });
  }
  function onMove(e) {
    if (downBlock < 0) return;
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX || 0) - r.left;
    spins.push({ block: downBlock, a: (x - lastX) * 0.005 });
    lastX = x;
  }
  function onUp() { downBlock = -1; }
  try {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  } catch (err) { /* QA renderer has no pointer events; mechanics verified by inspection */ }

  function onResize() { size(); draw(currentT); }
  try {
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
    window.addEventListener('resize', onResize);
  } catch (err) { /* ignore */ }

  size();
  draw(0); // frame one: exactly t = 0 via boot flag
  if (typeof requestAnimationFrame === 'function') {
    // The clock starts with the rAF loop; frame one was already drawn at t = 0 above.
    requestAnimationFrame(function (ms) {
      if (!started) { started = true; startMs = ms; }
      (function loop(m) {
        var t = (m - startMs) / 1000;
        draw(t);
        requestAnimationFrame(loop);
      })(ms);
    });
  }
})();
</script>
</body>
</html>
