<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Heart Balloon</title>
<style>
  html, body { margin: 0; padding: 0; background: #1A1A1A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, S = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function size() {
    var vw = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport.width : window.innerWidth;
    var vh = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport.height : window.innerHeight;
    W = vw; H = vh; S = Math.min(W, H);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var ground = '#1A1A1A';
    try { if (document.body) { document.body.style.background = ground; } } catch (e) {}
  }

  function isPhone() {
    var m = 99999;
    try {
      if (window.screen) { m = Math.min(window.screen.width, window.screen.height); }
    } catch (e) {}
    if (m < 700) return true;
    return H > W * 1.15;
  }

  // Seeded layout, fixed order, base seed only.
  function layout() {
    var rng = mulberry32(1327000);
    var objs = [];
    var defs = [
      { w: 0.16, h: 0.11, tone: '#CFCFCF', dx: -0.30, dy: -0.10 },
      { w: 0.12, h: 0.09, tone: '#9A9A9A', dx: -0.16, dy: -0.16 },
      { w: 0.10, h: 0.13, tone: '#6B6B6B', dx: 0.02, dy: -0.13 },
      { w: 0.14, h: 0.08, tone: '#CFCFCF', dx: 0.16, dy: -0.11 },
      { w: 0.11, h: 0.10, tone: '#9A9A9A', dx: 0.30, dy: -0.15 }
    ];
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      objs.push({
        w: d.w * W, h: d.h * H, tone: d.tone,
        dx: d.dx * W, dy: d.dy * H,
        ph: rng() * Math.PI * 2, sp: 0.6 + rng() * 0.6,
        tilt: (rng() - 0.5) * 0.22
      });
    }
    var cyl = { w: 0.07 * W, h: 0.16 * H, dx: 0.24 * W, dy: -0.20 * H, ph: rng() * Math.PI * 2 };
    var grainN = isPhone() ? 260 : 420;
    return { objs: objs, cyl: cyl, grainN: grainN };
  }

  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.32);
    ctx.bezierCurveTo(x - s * 1.05, y - s * 0.55, x - s * 0.45, y - s * 1.05, x, y - s * 0.35);
    ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.05, y - s * 0.55, x, y + s * 0.32);
    ctx.closePath();
  }

  function drawScene(t, L, alpha) {
    var cycle = Math.floor(t / 60);
    var lt = t - cycle * 60;
    var crng = mulberry32(1327000 + cycle * 7919);
    var escapeT = 38 + crng() * 4;
    var riseDur = 15;
    var fadeStart = 57;
    ctx.save();
    ctx.globalAlpha = alpha;

    // Doorbell-camera frame: wall above, driveway below.
    ctx.fillStyle = '#9A9A9A';
    ctx.fillRect(0, 0, W, H * 0.62);
    ctx.fillStyle = '#6B6B6B';
    ctx.fillRect(0, H * 0.62, W, H * 0.38);
    // Faint horizontal wall seams and driveway joints.
    ctx.fillStyle = 'rgba(46,46,46,0.35)';
    ctx.fillRect(0, H * 0.30, W, Math.max(1, H * 0.004));
    ctx.fillRect(0, H * 0.78, W, Math.max(1, H * 0.004));
    ctx.fillRect(W * 0.22, H * 0.62, Math.max(1, W * 0.003), H * 0.38);
    ctx.fillRect(W * 0.71, H * 0.62, Math.max(1, W * 0.003), H * 0.38);

    var trunkW = 0.56 * W, trunkH = 0.20 * H;
    var trunkX = W * 0.5, trunkY = H * 0.72;

    // Trunk: dark rectangle, lower-center, tilted slightly.
    ctx.save();
    ctx.translate(trunkX, trunkY);
    ctx.rotate(-0.05);
    ctx.fillStyle = '#2E2E2E';
    ctx.fillRect(-trunkW / 2, -trunkH / 2, trunkW, trunkH);
    ctx.fillStyle = 'rgba(207,207,207,0.25)';
    ctx.fillRect(-trunkW / 2, -trunkH / 2, trunkW, Math.max(1, trunkH * 0.06));
    ctx.restore();

    // Balloon anchor: cluster above the trunk's left-center.
    var bx = W * 0.44, by = trunkY - trunkH * 0.62;
    var bSize = 0.055 * S + 8;
    var riseP = 0;
    var attached = true;
    if (lt >= escapeT && lt < escapeT + riseDur) {
      var p = (lt - escapeT) / riseDur;
      var e = 1 - (1 - p) * (1 - p);
      riseP = p;
      attached = false;
      by = (trunkY - trunkH * 0.62) - e * (trunkY - trunkH * 0.62 + bSize * 1.6);
      bx = W * 0.44 + Math.sin(p * Math.PI * 2.5) * (0.02 * W);
    } else if (lt >= escapeT + riseDur) {
      attached = false;
      by = -bSize * 2;
    }

    // Hauled objects: small closed-form shifts, gray world keeps hauling.
    for (var i = 0; i < L.objs.length; i++) {
      var o = L.objs[i];
      var jx = Math.sin(t * o.sp + o.ph) * (0.006 * W);
      var jy = Math.cos(t * o.sp * 0.8 + o.ph) * (0.004 * H);
      ctx.save();
      ctx.translate(trunkX + o.dx + jx, trunkY + o.dy + jy);
      ctx.rotate(o.tilt);
      ctx.fillStyle = o.tone;
      ctx.fillRect(-o.w / 2, -o.h / 2, o.w, o.h);
      ctx.fillStyle = 'rgba(46,46,46,0.35)';
      ctx.fillRect(-o.w / 2, o.h / 2 - Math.max(1, o.h * 0.08), o.w, Math.max(1, o.h * 0.08));
      ctx.restore();
    }
    // Cylinder standing at the trunk's right: dark body so it reads against the wall.
    var cy = L.cyl;
    var cjx = Math.sin(t * 0.7 + cy.ph) * (0.005 * W);
    var cx = trunkX + cy.dx + cjx, cyy = trunkY + cy.dy;
    ctx.fillStyle = '#6B6B6B';
    ctx.fillRect(cx - cy.w / 2, cyy - cy.h / 2, cy.w, cy.h);
    ctx.strokeStyle = 'rgba(46,46,46,0.6)';
    ctx.lineWidth = Math.max(1, S * 0.0015);
    ctx.strokeRect(cx - cy.w / 2, cyy - cy.h / 2, cy.w, cy.h);
    ctx.beginPath();
    ctx.moveTo(cx, cyy - cy.h / 2);
    ctx.ellipse(cx, cyy - cy.h / 2, cy.w / 2, cy.w * 0.22, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#CFCFCF';
    ctx.fill();

    // Pink reflection on the trunk, fading as the balloon rises.
    if (attached || riseP < 0.5) {
      var ra = 0.30 * (attached ? 1 : (1 - riseP * 2));
      if (ra > 0) {
        ctx.save();
        ctx.translate(trunkX, trunkY);
        ctx.rotate(-0.05);
        ctx.globalAlpha = alpha * ra;
        ctx.fillStyle = '#C94F7C';
        ctx.beginPath();
        ctx.moveTo(bx - trunkX + 0, -trunkH / 2 + trunkH * 0.10);
        ctx.ellipse(bx - trunkX, -trunkH / 2 + trunkH * 0.12, bSize * 0.7, bSize * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // String: attached to the cluster while hauled, dangling once it slips.
    ctx.strokeStyle = '#E8E8E8';
    ctx.lineWidth = Math.max(1, S * 0.0015);
    ctx.beginPath();
    if (attached) {
      ctx.moveTo(bx, by + bSize * 0.35);
      ctx.lineTo(bx + Math.sin(t * 0.9) * 4, trunkY - trunkH * 0.55);
    } else if (riseP > 0 && riseP < 1) {
      ctx.moveTo(bx, by + bSize * 0.35);
      ctx.lineTo(bx + Math.sin(t * 1.4) * 8, by + bSize * 1.15);
    }
    ctx.stroke();

    // The heart balloon: the ONLY color in the scene.
    if (by > -bSize) {
      ctx.fillStyle = '#E91E63';
      heartPath(bx, by, bSize);
      ctx.fill();
    }

    // Film grain: closed-form seeded function of the quantized time index.
    var q = Math.floor(t * 12);
    var grng = mulberry32(1327000 + cycle * 7919 + q * 131);
    ctx.fillStyle = 'rgba(26,26,26,0.20)';
    for (var g = 0; g < L.grainN; g++) {
      var gx = grng() * W, gy = grng() * H;
      ctx.fillRect(gx, gy, 2, 2);
    }
    ctx.fillStyle = 'rgba(207,207,207,0.12)';
    for (var g2 = 0; g2 < L.grainN / 2; g2++) {
      var gx2 = grng() * W, gy2 = grng() * H;
      ctx.fillRect(gx2, gy2, 2, 2);
    }

    // Vignette as flat-alpha edge bands.
    ctx.fillStyle = 'rgba(26,26,26,0.30)';
    ctx.fillRect(0, 0, W, H * 0.07);
    ctx.fillRect(0, H * 0.93, W, H * 0.07);
    ctx.fillRect(0, 0, W * 0.05, H);
    ctx.fillRect(W * 0.95, 0, W * 0.05, H);

    // Faint timestamp-style corner mark.
    ctx.fillStyle = 'rgba(154,154,154,0.75)';
    ctx.font = Math.max(10, Math.round(S * 0.022)) + 'px monospace';
    ctx.fillText('REC', W * 0.03, H * 0.055);
    if (Math.floor(t * 1.5) % 2 === 0) {
      ctx.beginPath();
      ctx.moveTo(W * 0.03 + S * 0.075, H * 0.048);
      ctx.arc(W * 0.03 + S * 0.075, H * 0.048, Math.max(2, S * 0.006), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(154,154,154,0.75)';
      ctx.fill();
    }
    ctx.restore();
  }

  function draw(t) {
    size();
    var L = layout();
    var cycle = Math.floor(t / 60);
    var lt = t - cycle * 60;
    drawScene(t, L, 1);
    // Reset crossfade on the main canvas: next cycle's frame one fades in.
    if (lt >= 57) {
      var fa = (lt - 57) / 3;
      drawScene((cycle + 1) * 60, L, fa);
    }
  }

  var startTime = 0;
  var booted = false;
  function loop(now) {
    if (!booted) { startTime = now; booted = true; }
    var t = (now - startTime) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }

  size();
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
  function onResize() {
    var t = 0;
    if (booted && typeof performance !== 'undefined' && performance.now) {
      t = (performance.now() - startTime) / 1000;
    }
    draw(t);
  }
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
