<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Field, Thick Blocks</title>
<style>
html, body { margin: 0; padding: 0; background: #EFE6D4; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#EFE6D4';
var PLATE = '#2e2418';
var PLATE_LINE = 'rgba(201,143,45,0.55)';
var TITLE_INK = '#f3ead6';
var HINT_INK = '#e8c87a';
var FIRST_T = 6.0;
var GAP = 5;
var CELL = 96;
var MAX_BLOCKS = 4200;
var PRE_RUN = 1400;
var WALKERS = 14;
var CYCLE_SECS = 180;
/* The Fidenza engine running live. A flow field is seeded over the
   canvas from layered value noise; thick rounded rectangles are laid
   down along the streamlines, each one checked against a spatial
   hash so no two shapes ever touch or overlap. Turbulence is a slow
   parameter: the field breathes between calm parallel lanes and
   storm vortices. Every few minutes a new weighted palette swaps in
   and the field restarts with a fresh seed. Frame one is a fixed
   developed state: the field is pre-run for a fixed number of
   placements from a seeded RNG, so the first frame already shows
   blocks pouring along the lanes. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* Palettes sampled from weighted sets. */
var PALETTES = [
  { name: 'sand', colors: [[201, 143, 45], [166, 73, 43], [232, 217, 184]],
    weights: [0.45, 0.35, 0.20] },
  { name: 'cobalt', colors: [[43, 74, 140], [127, 163, 201], [221, 227, 228]],
    weights: [0.45, 0.35, 0.20] },
  { name: 'bone', colors: [[216, 205, 180], [31, 27, 22], [179, 58, 43]],
    weights: [0.40, 0.40, 0.20] }
];
function pickPalette(cycle) {
  /* Ordered cycle: sand-warm, then cobalt, then bone/black with red. */
  return PALETTES[cycle % PALETTES.length];
}
function pickColor(rng, pal) {
  var x = rng(), acc = 0, i;
  for (i = 0; i < pal.colors.length; i++) {
    acc += pal.weights[i];
    if (x <= acc) return pal.colors[i];
  }
  return pal.colors[0];
}
/* Layered value noise on a seeded grid. */
function makeNoise(seed, gw, gh) {
  var r = mulberry32(seed);
  var g = [], i, j;
  for (j = 0; j <= gh; j++) {
    g.push([]);
    for (i = 0; i <= gw; i++) g[j].push(r());
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  return function (x, y) {
    var fx = clamp(x, 0, 0.9999) * gw, fy = clamp(y, 0, 0.9999) * gh;
    var ix = Math.floor(fx), iy = Math.floor(fy);
    var tx = smooth(fx - ix), ty = smooth(fy - iy);
    var a = g[iy][ix], b = g[iy][ix + 1], c = g[iy + 1][ix], d = g[iy + 1][ix + 1];
    return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
  };
}
var noiseA = makeNoise(167201, 7, 7);
var noiseB = makeNoise(167202, 13, 13);
var noiseC = makeNoise(167203, 23, 23);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Turbulence breathes slowly between calm lanes and storm vortices. */
function turbulence(t) {
  return 0.5 + 0.5 * Math.sin(t * 0.045 + 1.3);
}
function fieldAngle(x, y, t) {
  var u = x / Math.max(VW, 1), v = y / Math.max(VH, 1);
  var n = 0.6 * noiseA(u, v) + 0.3 * noiseB(u, v) + 0.1 * noiseC(u, v);
  var base = (n - 0.5) * 1.2;
  var tau = turbulence(t);
  var swirl = tau * 0.9 * Math.sin(x * 0.006 + y * 0.005 + t * 0.03)
    + tau * 0.4 * Math.sin((x - y) * 0.004 - t * 0.02);
  return base + swirl;
}
/* ---- field state: blocks + spatial hash ---- */
var blocks = [];
var hash = {};
var simRng = null;
var palette = PALETTES[0];
var cycle = 0;
var cycleStart = FIRST_T;
var oldAlpha = 1;
var walkers = [];
var spawnAcc = 0;
function hashKey(cx, cy) { return cx + ':' + cy; }
function cellOf(x) { return Math.floor(x / CELL); }
function hashInsert(b) {
  var k = hashKey(cellOf(b.x), cellOf(b.y));
  if (!hash[k]) hash[k] = [];
  hash[k].push(b);
}
function rebuildHash() {
  hash = {};
  var i;
  for (i = 0; i < blocks.length; i++) hashInsert(blocks[i]);
}
/* Capsule collision: distance between centerline segments must clear
   the sum of half-widths plus the minimum gap. This lets parallel
   lanes pack side by side, which a bounding-circle check forbids. */
function segDist(ax, ay, bx, by, cx, cy, dx, dy) {
  function ptSeg(px, py, x1, y1, x2, y2) {
    var vx = x2 - x1, vy = y2 - y1;
    var len2 = vx * vx + vy * vy;
    var tt = len2 === 0 ? 0 : clamp(((px - x1) * vx + (py - y1) * vy) / len2, 0, 1);
    var qx = x1 + tt * vx, qy = y1 + tt * vy;
    var ex = px - qx, ey = py - qy;
    return Math.sqrt(ex * ex + ey * ey);
  }
  var ux = bx - ax, uy = by - ay, vx = dx - cx, vy = dy - cy;
  var den = ux * vy - uy * vx;
  if (Math.abs(den) < 1e-9) {
    return Math.min(ptSeg(ax, ay, cx, cy, dx, dy), ptSeg(bx, by, cx, cy, dx, dy),
      ptSeg(cx, cy, ax, ay, bx, by), ptSeg(dx, dy, ax, ay, bx, by));
  }
  var wx = ax - cx, wy = ay - cy;
  var s = (vx * wy - vy * wx) / den;
  var t = (ux * wy - uy * wx) / den;
  if (s >= 0 && s <= 1 && t >= 0 && t <= 1) return 0;
  return Math.min(ptSeg(ax, ay, cx, cy, dx, dy), ptSeg(bx, by, cx, cy, dx, dy),
    ptSeg(cx, cy, ax, ay, bx, by), ptSeg(dx, dy, ax, ay, bx, by));
}
function collides(x, y, ang, len, wid) {
  var hl = len / 2, ca = Math.cos(ang), sa = Math.sin(ang);
  var ax = x - hl * ca, ay = y - hl * sa, bx = x + hl * ca, by = y + hl * sa;
  var reach = len + wid + GAP;
  var cx = cellOf(x), cy = cellOf(y), i, j, k, list, m, b;
  for (i = cx - 1; i <= cx + 1; i++) {
    for (j = cy - 1; j <= cy + 1; j++) {
      list = hash[hashKey(i, j)];
      if (!list) continue;
      for (m = 0; m < list.length; m++) {
        b = list[m];
        var dx = b.x - x, dy = b.y - y;
        if (dx * dx + dy * dy > reach * reach) continue;
        var bhl = b.len / 2, bca = Math.cos(b.ang), bsa = Math.sin(b.ang);
        var d = segDist(ax, ay, bx, by,
          b.x - bhl * bca, b.y - bhl * bsa, b.x + bhl * bca, b.y + bhl * bsa);
        if (d < (wid + b.wid) / 2 + GAP) return true;
      }
    }
  }
  return false;
}
function margin() { return Math.max(24, Math.min(VW, VH) * 0.06); }
function inside(x, y) {
  var m = margin();
  return x > m && x < VW - m && y > m && y < VH - m;
}
/* Capsule blocks are drawn as a filled rect plus two end circles:
   exact, no stray chords from arc() subpath connections. */
function drawBlock(b) {
  var hl = b.len / 2, hw = b.wid / 2;
  var ca = Math.cos(b.ang), sa = Math.sin(b.ang);
  ctx.fillStyle = rgba(b.col, b.cy === cycle ? 1 : oldAlpha);
  ctx.beginPath();
  ctx.moveTo(b.x - hl * ca + hw * sa, b.y - hl * sa - hw * ca);
  ctx.lineTo(b.x + hl * ca + hw * sa, b.y + hl * sa - hw * ca);
  ctx.lineTo(b.x + hl * ca - hw * sa, b.y + hl * sa + hw * ca);
  ctx.lineTo(b.x - hl * ca - hw * sa, b.y - hl * sa + hw * ca);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(b.x + hl * ca + hw, b.y + hl * sa);
  ctx.arc(b.x + hl * ca, b.y + hl * sa, hw, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(b.x - hl * ca + hw, b.y - hl * sa);
  ctx.arc(b.x - hl * ca, b.y - hl * sa, hw, 0, TAU);
  ctx.fill();
}
function spawnWalker() {
  var m = margin();
  return {
    x: m + simRng() * (VW - 2 * m),
    y: m + simRng() * (VH - 2 * m),
    life: 40 + Math.floor(simRng() * 40)
  };
}
function stepWalker(w, t) {
  if (w.life <= 0 || blocks.length >= MAX_BLOCKS) return false;
  var ang0 = fieldAngle(w.x, w.y, t);
  var sc = clamp(Math.min(VW, VH) / 900, 0.6, 1.15);
  var k, ang, len, wid, bx, by;
  for (k = 0; k < 5; k++) {
    ang = ang0 + (simRng() - 0.5) * 0.6;
    len = (30 + simRng() * 26) * sc;
    wid = (12 + simRng() * 8) * sc;
    bx = w.x; by = w.y;
    if (inside(bx, by) && !collides(bx, by, ang, len, wid)) {
      var b = { x: bx, y: by, len: len, wid: wid, ang: ang, cy: cycle,
        col: pickColor(simRng, palette) };
      blocks.push(b);
      hashInsert(b);
      /* Advance past the block just laid plus clearance, so the
         next block on this streamline does not overlap it. */
      w.x = bx + Math.cos(ang) * (len * 0.92 + 40 * sc);
      w.y = by + Math.sin(ang) * (len * 0.92 + 40 * sc);
      w.life--;
      return true;
    }
  }
  /* No free space here: walk on without stamping so the walker
     roams to open ground instead of stalling forever. */
  w.x += Math.cos(ang0) * 30 * sc;
  w.y += Math.sin(ang0) * 30 * sc;
  w.life--;
  return false;
}
function resetField(c, t) {
  /* New cycle, new palette and seed, but the old field is NOT cut
     away: its blocks fade out over eight seconds while the new
     field grows in, a crossfade of intent rather than a cut. */
  cycle = c;
  cycleStart = t;
  palette = pickPalette(c);
  simRng = mulberry32(1672 + c * 7919);
  walkers = [];
  var i;
  for (i = 0; i < WALKERS; i++) walkers.push(spawnWalker());
}
function simulate(steps, t) {
  var placed = 0, guard = 0, i, stall = 0;
  while (placed < steps && guard < steps * 40) {
    guard++;
    var before = placed;
    var alive = false;
    for (i = 0; i < walkers.length; i++) {
      if (stepWalker(walkers[i], t)) { placed++; alive = true; }
    }
    /* Refresh spent or strayed walkers every round so the whole
       crew stays productive, not only after a dead round. */
    for (i = 0; i < walkers.length; i++) {
      if (walkers[i].life <= 0 || !inside(walkers[i].x, walkers[i].y)) {
        walkers[i] = spawnWalker();
      }
    }
    /* Field saturated: stop burning rounds on a full canvas. */
    if (placed === before) { stall++; if (stall >= 3) break; }
    else stall = 0;
    if (!alive && blocks.length >= MAX_BLOCKS) break;
  }
  return placed;
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Flow Field, Thick Blocks').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Flow Field, Thick Blocks').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 10').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Flow Field, Thick Blocks', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 10', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var c = Math.floor((t - FIRST_T) / CYCLE_SECS);
  if (c < 0) c = 0;
  if (c !== cycle) resetField(c, t);
  /* Fade the previous cycle's blocks out over eight seconds, then
     drop them from the field and the hash. */
  oldAlpha = clamp(1 - (t - cycleStart) / 8, 0, 1);
  if (oldAlpha <= 0 && blocks.length > 0) {
    var hasStale = false, kept = [], i;
    for (i = 0; i < blocks.length; i++) {
      if (blocks[i].cy === cycle) kept.push(blocks[i]);
      else hasStale = true;
    }
    if (hasStale) {
      blocks = kept;
      rebuildHash();
    }
  }
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var i;
  for (i = 0; i < blocks.length; i++) drawBlock(blocks[i]);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    blockCount: function () { return blocks.length; },
    simulate: function (n, t) { return simulate(n, t); },
    walkerStates: function () {
      return walkers.map(function (w) {
        return { life: w.life, x: Math.round(w.x), y: Math.round(w.y),
          inside: inside(w.x, w.y) };
      });
    },
    paletteName: function () { return palette.name; }
  };
}
/* ---- frame one: t = FIRST_T, a developed state ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
resetField(0, FIRST_T);
simulate(PRE_RUN, FIRST_T);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    spawnAcc += dt * 240;
    var n = Math.floor(spawnAcc);
    spawnAcc -= n;
    if (n > 0) simulate(n, clockT);
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
