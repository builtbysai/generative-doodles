<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Maze of Symmetries</title>
<style>
html, body { margin: 0; padding: 0; background: #1E4A4A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#1E4A4A';
var VERMILION = '#D9481F';
var MUSTARD = '#E8A820';
var CREAM = '#F2EAD8';
var SHADOW = '#2F5A3D';
var PLATE = '#123232';
var PLATE_LINE = 'rgba(232,168,32,0.55)';
var TITLE_INK = '#F2EAD8';
var HINT_INK = '#E8A820';
var N = 16;
var LAST = N - 1;
var FIRST_T = 26.0;
var STEP_DT = 0.07;
var MIRROR_DELAY = 0.12;
var CYCLE_SECS = 150;
var SPIRAL_COUNT = 2;
/* The Orbifold mechanism running live. A seeded walk grows a
   rectilinear maze from the top edge on a 16 by 16 lattice, and
   every step is mirrored across the whole frame by the active
   planar symmetry group, so one local decision becomes eight
   (or four) at once and the viewer watches the symmetry
   propagate. Mirrors fill in with a slight delay, so the pattern
   blooms outward from the entry edge. When the walk hits a dead
   end it folds back, and the retraced edge is drawn thicker, a
   trunk route the maze learned from a wrong turn. Where mirrored
   paths cross, a greek-key spiral knot appears. Every 150 seconds
   the symmetry group changes, p4m to cmm to p4, and the maze
   regrows under the new rules. The maze never completes; it grows,
   folds, and regrows. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* ---- planar symmetry group transforms on cell coords ---- */
function T_id(r, c) { return [r, c]; }
function T_tr(r, c) { return [c, r]; }
function T_r90(r, c) { return [LAST - c, r]; }
function T_r90tr(r, c) { return [LAST - r, c]; }
function T_r180(r, c) { return [LAST - r, LAST - c]; }
function T_r180tr(r, c) { return [LAST - c, LAST - r]; }
function T_r270(r, c) { return [c, LAST - r]; }
function T_r270tr(r, c) { return [r, LAST - c]; }
function T_fh(r, c) { return [r, LAST - c]; }
function T_fv(r, c) { return [LAST - r, c]; }
var GROUPS = [
  { name: 'p4m', transforms: [T_id, T_tr, T_r90, T_r90tr, T_r180, T_r180tr, T_r270, T_r270tr] },
  { name: 'cmm', transforms: [T_id, T_fh, T_fv, T_r180] },
  { name: 'p4', transforms: [T_id, T_r90, T_r180, T_r270] }
];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* ---- maze state for the active cycle ---- */
var curCycle = -1;
var group = GROUPS[0];
var steps = [];
var spirals = [];
var startCell = [0, 8];
function edgeKey(r1, c1, r2, c2) {
  if (r1 < r2 || (r1 === r2 && c1 < c2)) return r1 + ',' + c1 + '-' + r2 + ',' + c2;
  return r2 + ',' + c2 + '-' + r1 + ',' + c1;
}
function pickStepColor(rng) {
  var x = rng();
  if (x < 0.45) return VERMILION;
  if (x < 0.77) return MUSTARD;
  return CREAM;
}
function genMaze(rng) {
  var visited = [], r, c;
  for (r = 0; r < N; r++) { visited.push([]); for (c = 0; c < N; c++) visited[r].push(false); }
  var out = [];
  var edgeColor = {};
  var edgeShadow = {};
  var stack = [[startCell[0], startCell[1]]];
  visited[startCell[0]][startCell[1]] = true;
  while (stack.length) {
    var cur = stack[stack.length - 1];
    var r0 = cur[0], c0 = cur[1];
    var nbs = [];
    if (r0 > 0 && !visited[r0 - 1][c0]) nbs.push([r0 - 1, c0]);
    if (r0 < N - 1 && !visited[r0 + 1][c0]) nbs.push([r0 + 1, c0]);
    if (c0 > 0 && !visited[r0][c0 - 1]) nbs.push([r0, c0 - 1]);
    if (c0 < N - 1 && !visited[r0][c0 + 1]) nbs.push([r0, c0 + 1]);
    if (nbs.length) {
      var nb = nbs[Math.floor(rng() * nbs.length)];
      var key = edgeKey(r0, c0, nb[0], nb[1]);
      var col = pickStepColor(rng);
      edgeColor[key] = col;
      edgeShadow[key] = rng() < 0.12;
      out.push({ r1: r0, c1: c0, r2: nb[0], c2: nb[1], back: false, col: col, shadow: edgeShadow[key] });
      visited[nb[0]][nb[1]] = true;
      stack.push(nb);
    } else {
      stack.pop();
      if (stack.length) {
        var top = stack[stack.length - 1];
        var k2 = edgeKey(r0, c0, top[0], top[1]);
        out.push({ r1: r0, c1: c0, r2: top[0], c2: top[1], back: true,
          col: edgeColor[k2], shadow: edgeShadow[k2] });
      }
    }
  }
  return out;
}
function resetField(cycle) {
  group = GROUPS[cycle % GROUPS.length];
  var rng = mulberry32(1683 + cycle * 7919);
  steps = genMaze(rng);
  /* Greek-key spirals sit on junction cells where three or more
     path arms meet, chosen by the same seeded stream. */
  var degree = {}, i, s;
  for (i = 0; i < steps.length; i++) {
    s = steps[i];
    if (s.back) continue;
    degree[s.r1 + ',' + s.c1] = (degree[s.r1 + ',' + s.c1] || 0) + 1;
    degree[s.r2 + ',' + s.c2] = (degree[s.r2 + ',' + s.c2] || 0) + 1;
  }
  var junctions = [];
  for (var key in degree) {
    if (degree[key] >= 3) {
      var parts = key.split(',');
      junctions.push([parseInt(parts[0], 10), parseInt(parts[1], 10)]);
    }
  }
  for (i = junctions.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = junctions[i]; junctions[i] = junctions[j]; junctions[j] = tmp;
  }
  spirals = [];
  var take = Math.min(SPIRAL_COUNT, junctions.length);
  for (i = 0; i < take; i++) {
    var cell = junctions[i];
    var first = -1, k;
    for (k = 0; k < steps.length; k++) {
      var st = steps[k];
      if ((st.r1 === cell[0] && st.c1 === cell[1]) || (st.r2 === cell[0] && st.c2 === cell[1])) {
        first = k; break;
      }
    }
    if (first >= 0) spirals.push({ r: cell[0], c: cell[1], step: first });
  }
}
/* ---- geometry ---- */
var OX = 0, OY = 0, S = 0, CELL = 0;
function layout() {
  if (isPhone) {
    S = Math.min(VW, VH);
  } else {
    S = Math.min(VW, VH) * 0.94;
  }
  OX = (VW - S) / 2;
  OY = (VH - S) / 2;
  CELL = S / N;
}
function cellPoint(r, c) {
  return [OX + (c + 0.5) * CELL, OY + (r + 0.5) * CELL];
}
function strokeSeg(p1, p2, width, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(p1[0], p1[1]);
  ctx.lineTo(p2[0], p2[1]);
  ctx.stroke();
}
function drawStepImage(st, tr, t) {
  var a = tr(st.r1, st.c1);
  var b = tr(st.r2, st.c2);
  var p1 = cellPoint(a[0], a[1]);
  var p2 = cellPoint(b[0], b[1]);
  var w = st.back ? CELL * 0.62 : CELL * 0.40;
  if (st.shadow) {
    var off = CELL * 0.06;
    strokeSeg([p1[0] + off, p1[1] + off], [p2[0] + off, p2[1] + off], w, SHADOW);
  }
  strokeSeg(p1, p2, w, st.col);
}
function drawStubImage(tr, t) {
  /* Entry stub: the path enters from the frame edge into the
     start cell, and its mirrors enter from their own edges. */
  var a = tr(startCell[0], startCell[1]);
  var b = tr(startCell[0] - 1, startCell[1]);
  var p1 = cellPoint(a[0], a[1]);
  var p2 = cellPoint(b[0], b[1]);
  strokeSeg(p1, p2, CELL * 0.40, steps.length ? steps[0].col : VERMILION);
}
function spiralPoints(cx, cy, R, turns) {
  var pts = [];
  var total = Math.floor(turns * 16);
  var i, th, rr, dx, dy, m;
  for (i = 0; i <= total; i++) {
    th = (i / total) * turns * TAU;
    rr = R * (1 - (i / total) * 0.82);
    dx = Math.cos(th); dy = Math.sin(th);
    m = Math.max(Math.abs(dx), Math.abs(dy));
    if (m < 1e-6) m = 1;
    pts.push([cx + (dx / m) * rr, cy + (dy / m) * rr]);
  }
  return pts;
}
function drawSpiral(sp, tr) {
  var rc = tr(sp.r, sp.c);
  var ctr = cellPoint(rc[0], rc[1]);
  var pts = spiralPoints(ctr[0], ctr[1], CELL * 0.42, 2.5);
  var i;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = CELL * 0.16;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = CREAM;
  ctx.lineWidth = CELL * 0.07;
  ctx.stroke();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Maze of Symmetries').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Maze of Symmetries').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 21').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Maze of Symmetries', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 21', plateX + 14, plateY + 7 + titlePx + 3);
  /* Group plate, top right: the symmetry group in force. */
  var gName = group.name;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var gW = ctx.measureText(gName).width;
  ctx.font = smallPx + 'px monospace';
  var gSubW = ctx.measureText('planar group').width;
  var gPlateW = Math.max(gW, gSubW) + 28;
  var gPlateH = titlePx + smallPx + 20;
  var gPlateX = VW - gPlateW - 12, gPlateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(gPlateX, gPlateY, gPlateW, gPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(gPlateX + 0.5, gPlateY + 0.5, gPlateW - 1, gPlateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(gName, gPlateX + 14, gPlateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('planar group', gPlateX + 14, gPlateY + 7 + titlePx + 3);
  /* Hint plate, bottom left. */
  var hint = 'Watch only. The maze never finishes.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var c = Math.floor((t - FIRST_T) / CYCLE_SECS);
  if (c < 0) c = 0;
  if (c !== curCycle) { resetField(c); curCycle = c; }
  layout();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  ctx.beginPath();
  ctx.rect(OX, OY, S, S);
  ctx.clip();
  var trs = group.transforms;
  var i, k;
  /* Entry stubs, one per mirror, staggered like the steps. */
  for (i = 0; i < trs.length; i++) {
    if (i * MIRROR_DELAY <= t) drawStubImage(trs[i], t);
  }
  for (k = 0; k < steps.length; k++) {
    var base = k * STEP_DT;
    if (base > t) break;
    for (i = 0; i < trs.length; i++) {
      if (base + i * MIRROR_DELAY <= t) drawStepImage(steps[k], trs[i], t);
    }
  }
  /* Spirals are mirrored with the steps, so the knot pattern
     stays symmetric under the group; each image appears with
     the same stagger as its step images. */
  for (i = 0; i < spirals.length; i++) {
    var spBase = spirals[i].step * STEP_DT;
    if (spBase > t) continue;
    for (k = 0; k < trs.length; k++) {
      if (spBase + k * MIRROR_DELAY <= t) drawSpiral(spirals[i], trs[k]);
    }
  }
  ctx.restore();
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
/* ---- frame one: t = FIRST_T, a developed state ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
