<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-Willed Machine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #22392c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG, fixed seed: frame one is fully deterministic.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1812);

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  // Loop: 300 s. The press runs, misprints, the hand pins them,
  // the wall fills, then the loop restarts with an empty wall.
  var LOOP = 300;

  // Misprint schedule: fixed authored irregular table (seconds into loop).
  // kind: 'slip' = registration slip, 'band' = overprint band,
  // 'plaid' = blue-check fabric strip fed through instead of paper.
  var EVENTS = [
    { t: 18,  kind: 'slip'  },
    { t: 47,  kind: 'band'  },
    { t: 83,  kind: 'plaid' },
    { t: 121, kind: 'slip'  },
    { t: 158, kind: 'band'  },
    { t: 196, kind: 'plaid' },
    { t: 229, kind: 'slip'  },
    { t: 262, kind: 'band'  },
    { t: 289, kind: 'plaid' }
  ];
  var EVENT_DUR = 8;   // misprint visible travelling on the feed, seconds
  var HAND_DUR = 12;   // hand cycle after each event, seconds
  var HAND_DELAY = 4;  // hand starts this many seconds after the event

  var INK = ['#1e50c8', '#f0bd00', '#cf2a1e'];

  // Dash field: dense falling dashes of primary ink on the paper feed.
  // u = across the feed (0..1), v = along the feed (0..1).
  var DASHES = [];
  for (var i = 0; i < 260; i++) {
    DASHES.push({
      u: rnd(), v: rnd(),
      len: 5 + rnd() * 11,
      col: INK[Math.floor(rnd() * 3)],
      w: 1 + rnd() * 1.4,
      a: 0.55 + rnd() * 0.45
    });
  }

  // Wall slots: nine authored pin positions on the right-hand wall.
  var SLOTS = [];
  for (var s = 0; s < 9; s++) {
    SLOTS.push({
      cx: 0.10 + (s % 3) * 0.36,
      cy: 0.14 + Math.floor(s / 3) * 0.30,
      rot: (rnd() - 0.5) * 0.22,
      seed: rnd()
    });
  }

  // Mini dash pattern inside a pinned print, seeded per slot.
  function printDashes(slot, x, y, w, h) {
    var r2 = mulberry32(1812 + Math.floor(slot.seed * 100000));
    for (var k = 0; k < 26; k++) {
      var dx = x + 4 + r2() * (w - 8);
      var dy = y + 4 + r2() * (h - 8);
      ctx.strokeStyle = INK[Math.floor(r2() * 3)];
      ctx.globalAlpha = 0.8;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(dx, dy);
      ctx.lineTo(dx + 4 + r2() * 8, dy + (r2() - 0.5) * 3);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function alpha(v) {
    var a = Math.round(v * 10000) / 10000;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    return a;
  }

  function lerp(a, b, f) { return a + (b - a) * f; }

  // Which event's hand cycle is active at time t, or -1.
  function handEvent(t) {
    for (var e = 0; e < EVENTS.length; e++) {
      var s0 = EVENTS[e].t + HAND_DELAY;
      if (t >= s0 && t <= s0 + HAND_DUR) return e;
    }
    return -1;
  }

  // How many misprints are pinned on the wall at time t.
  function pinnedCount(t) {
    var n = 0;
    for (var e = 0; e < EVENTS.length; e++) {
      if (t > EVENTS[e].t + HAND_DELAY + HAND_DUR * 0.8) n++;
    }
    return n;
  }

  // Is a misprint segment travelling on the feed at time t? Returns event index or -1.
  function feedEvent(t) {
    for (var e = 0; e < EVENTS.length; e++) {
      if (t >= EVENTS[e].t && t <= EVENTS[e].t + EVENT_DUR) return e;
    }
    return -1;
  }

  function drawHand(x, y, ang, carrying, pw, ph) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    // Sleeve cuff at the wrist.
    ctx.fillStyle = '#232323';
    ctx.fillRect(-13, 14, 26, 22);
    ctx.fillStyle = '#161616';
    ctx.fillRect(-13, 14, 26, 4);
    // Palm.
    ctx.fillStyle = '#c99b78';
    ctx.beginPath();
    ctx.moveTo(-13, 16);
    ctx.lineTo(-13, -6);
    ctx.arc(0, -6, 13, Math.PI, 0);
    ctx.lineTo(13, 16);
    ctx.closePath();
    ctx.fill();
    // Fingers: four short capsules reaching up.
    for (var f = -1.5; f <= 1.5; f++) {
      var fx = f * 6.4;
      ctx.fillStyle = '#c99b78';
      ctx.beginPath();
      ctx.moveTo(fx - 2.6, -16);
      ctx.lineTo(fx - 2.6, -26);
      ctx.arc(fx, -26, 2.6, Math.PI, 0);
      ctx.lineTo(fx + 2.6, -16);
      ctx.closePath();
      ctx.fill();
    }
    // Thumb.
    ctx.fillStyle = '#c99b78';
    ctx.beginPath();
    ctx.moveTo(12, 2);
    ctx.lineTo(20, -8);
    ctx.arc(21, -9, 3, 0, Math.PI * 2);
    ctx.lineTo(13, 8);
    ctx.closePath();
    ctx.fill();
    // Carried misprint sheet held above the fingers.
    if (carrying) {
      ctx.fillStyle = '#f4f1e8';
      ctx.fillRect(-pw / 2, -30 - ph, pw, ph);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-pw / 2, -30 - ph, pw, ph);
      ctx.save();
      ctx.beginPath();
      ctx.rect(-pw / 2, -30 - ph, pw, ph);
      ctx.clip();
      var r3 = mulberry32(1812 + 77);
      for (var k = 0; k < 12; k++) {
        var dx = -pw / 2 + 3 + r3() * (pw - 6);
        var dy = -30 - ph + 3 + r3() * (ph - 6);
        ctx.strokeStyle = INK[Math.floor(r3() * 3)];
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(dx, dy);
        ctx.lineTo(dx + 5 + r3() * 6, dy);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function draw(t) {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var W = Math.max(1, Math.floor(vw));
    var H = Math.max(1, Math.floor(vh));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var isPhone = false;
    try {
      var sw = window.screen.width, sh = window.screen.height;
      var mn = Math.min(sw, sh);
      isPhone = mn < 700 || (H > W * 1.15);
    } catch (e) { isPhone = (H > W * 1.15); }

    var lt = t % LOOP; // loop-local time

    // Page ground: the workshop wall, dark industrial green.
    ctx.fillStyle = '#22392c';
    ctx.fillRect(0, 0, W, H);

    // Floor strip along the bottom.
    var fl = ctx.createLinearGradient(0, H * 0.86, 0, H);
    fl.addColorStop(0, '#1a2d22');
    fl.addColorStop(1, '#121f17');
    ctx.fillStyle = fl;
    ctx.fillRect(0, H * 0.86, W, H * 0.14);

    // ---- Pin-up wall, right-hand side ----
    var wallX = W * 0.68, wallY = H * 0.10, wallW = W * 0.30, wallH = H * 0.78;
    ctx.fillStyle = '#2e4a3a';
    ctx.fillRect(wallX, wallY, wallW, wallH);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(wallX, wallY, wallW, wallH);
    // Wall label, small and quiet, along the bottom edge of the panel.
    ctx.fillStyle = '#7d9a89';
    ctx.font = '10px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('K E P T   M I S T A K E S', wallX + 10, wallY + wallH - 10);

    // ---- Press, left two-thirds ----
    var px = W * 0.02, py = H * 0.08, pw = W * 0.62, ph = H * 0.86;
    // Press shadow on the floor.
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(px + 6, py + ph - 4, pw, 8);
    // Press body.
    var body = ctx.createLinearGradient(px, py, px + pw, py);
    body.addColorStop(0, '#1d3a28');
    body.addColorStop(1, '#142b1d');
    ctx.fillStyle = body;
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = '#0c1f13';
    ctx.lineWidth = 3;
    ctx.strokeRect(px, py, pw, ph);
    // Panel seams and bolts.
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px + pw * 0.5, py + 8);
    ctx.lineTo(px + pw * 0.5, py + ph - 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px + 8, py + ph * 0.30);
    ctx.lineTo(px + pw - 8, py + ph * 0.30);
    ctx.stroke();
    ctx.fillStyle = '#3a3f45';
    var bolts = [[px + 12, py + 12], [px + pw - 12, py + 12], [px + 12, py + ph - 12], [px + pw - 12, py + ph - 12]];
    for (var b = 0; b < bolts.length; b++) {
      ctx.beginPath();
      ctx.moveTo(bolts[b][0] + 3, bolts[b][1]);
      ctx.arc(bolts[b][0], bolts[b][1], 3, 0, Math.PI * 2);
      ctx.fill();
    }
    // Press plate, top right of the press body, clear of the feed.
    ctx.fillStyle = '#c8b06a';
    ctx.fillRect(px + pw * 0.60, py + 10, 74, 16);
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PRESS No. 5', px + pw * 0.60 + 37, py + 22);

    // Slip gauge: needle jumps while a misprint is on the feed.
    var gx = px + pw * 0.82, gy = py + ph * 0.16, gr = 26;
    ctx.fillStyle = '#e8e4d8';
    ctx.beginPath();
    ctx.moveTo(gx + gr, gy);
    ctx.arc(gx, gy, gr, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0c1f13';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(gx + gr, gy);
    ctx.arc(gx, gy, gr, 0, Math.PI * 2);
    ctx.stroke();
    var fe = feedEvent(lt);
    var needle = fe >= 0 ? 0.9 : -0.9 + Math.sin(lt * 0.35) * 0.12;
    ctx.strokeStyle = '#a01f16';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(gx, gy);
    ctx.lineTo(gx + Math.sin(needle) * (gr - 5), gy - Math.cos(needle) * (gr - 5));
    ctx.stroke();
    ctx.fillStyle = '#1a1a1a';
    ctx.font = '8px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('REGISTER', gx, gy + gr + 11);

    // ---- Paper feed, diagonal through the press ----
    var fx0 = px + pw * 0.16, fy0 = py - 6;
    var fx1 = px + pw * 0.86, fy1 = py + ph + 2;
    var fdx = fx1 - fx0, fdy = fy1 - fy0;
    var fLen = Math.sqrt(fdx * fdx + fdy * fdy);
    var fAng = Math.atan2(fdy, fdx);
    var fW = Math.min(W * 0.13, 150);

    ctx.save();
    ctx.translate(fx0, fy0);
    ctx.rotate(fAng);
    // Paper shadow, then the white sheet.
    ctx.fillStyle = 'rgba(0,0,0,0.30)';
    ctx.fillRect(3, -fW / 2 + 3, fLen, fW);
    ctx.fillStyle = '#f4f1e8';
    ctx.fillRect(0, -fW / 2, fLen, fW);
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0, -fW / 2, fLen, fW);

    // Falling dashes: dense primary ink, moving down the feed.
    var fall = (lt * 0.028) % 1;
    for (var d = 0; d < DASHES.length; d++) {
      var da = DASHES[d];
      var dv = da.v + fall;
      if (dv > 1) dv -= 1;
      var dx = dv * fLen;
      var dy = (da.u - 0.5) * fW * 0.86;
      ctx.strokeStyle = da.col;
      ctx.globalAlpha = alpha(da.a);
      ctx.lineWidth = da.w;
      ctx.beginPath();
      ctx.moveTo(dx, dy);
      ctx.lineTo(dx + da.len, dy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Misprint segment travelling down the feed.
    if (fe >= 0) {
      var ev = EVENTS[fe];
      var ef = (lt - ev.t) / EVENT_DUR; // 0..1 down the feed
      var segC = (0.12 + 0.76 * ef) * fLen;
      var segH = fLen * 0.085;
      var segA = ef < 0.1 ? ef / 0.1 : (ef > 0.9 ? (1 - ef) / 0.1 : 1);
      if (ev.kind === 'slip') {
        // Registration slip: dashes doubled, offset along the feed.
        ctx.save();
        ctx.globalAlpha = alpha(0.85 * segA);
        ctx.strokeStyle = '#cf2a1e';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(segC - segH, -fW / 2 + 4);
        ctx.lineTo(segC - segH, fW / 2 - 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(segC + segH, -fW / 2 + 4);
        ctx.lineTo(segC + segH, fW / 2 - 4);
        ctx.stroke();
        for (var s2 = 0; s2 < DASHES.length; s2++) {
          var db = DASHES[s2];
          var dv2 = db.v + fall;
          if (dv2 > 1) dv2 -= 1;
          var dx2 = dv2 * fLen;
          if (Math.abs(dx2 - segC) < segH) {
            var dy2 = (db.u - 0.5) * fW * 0.86;
            ctx.strokeStyle = db.col;
            ctx.lineWidth = db.w;
            ctx.beginPath();
            ctx.moveTo(dx2 + 9, dy2);
            ctx.lineTo(dx2 + 9 + db.len, dy2);
            ctx.stroke();
          }
        }
        ctx.restore();
      } else if (ev.kind === 'band') {
        // Overprint band: a dark doubled band across the paper.
        ctx.save();
        ctx.globalAlpha = alpha(0.55 * segA);
        ctx.fillStyle = '#1e50c8';
        ctx.fillRect(segC - segH, -fW / 2, segH * 2, fW);
        ctx.globalAlpha = alpha(0.35 * segA);
        ctx.fillStyle = '#cf2a1e';
        ctx.fillRect(segC - segH * 0.45, -fW / 2, segH * 0.9, fW);
        ctx.restore();
      } else {
        // Plaid strip: blue-check fabric fed through instead of paper.
        ctx.save();
        ctx.globalAlpha = alpha(segA);
        ctx.fillStyle = '#e9edf2';
        ctx.fillRect(segC - segH, -fW / 2, segH * 2, fW);
        ctx.strokeStyle = '#2a5cb8';
        ctx.lineWidth = 2;
        var step = 11;
        for (var gx2 = segC - segH; gx2 <= segC + segH; gx2 += step) {
          ctx.beginPath();
          ctx.moveTo(gx2, -fW / 2);
          ctx.lineTo(gx2, fW / 2);
          ctx.stroke();
        }
        for (var gy2 = -fW / 2; gy2 <= fW / 2; gy2 += step) {
          ctx.beginPath();
          ctx.moveTo(segC - segH, gy2);
          ctx.lineTo(segC + segH, gy2);
          ctx.stroke();
        }
        // The dash pattern lands on the weave, misaligned.
        for (var s3 = 0; s3 < DASHES.length; s3++) {
          var dc = DASHES[s3];
          var dv3 = dc.v + fall;
          if (dv3 > 1) dv3 -= 1;
          var dx3 = dv3 * fLen;
          if (Math.abs(dx3 - segC) < segH) {
            var dy3 = (dc.u - 0.5) * fW * 0.86 + 7;
            ctx.strokeStyle = dc.col;
            ctx.lineWidth = dc.w;
            ctx.beginPath();
            ctx.moveTo(dx3, dy3);
            ctx.lineTo(dx3 + dc.len, dy3);
            ctx.stroke();
          }
        }
        ctx.restore();
      }
    }
    ctx.restore();

    // Rollers where the feed enters and leaves the press.
    var rollers = [[fx0, fy0], [fx1, fy1]];
    for (var r = 0; r < rollers.length; r++) {
      ctx.fillStyle = '#3a3f45';
      ctx.beginPath();
      ctx.moveTo(rollers[r][0] + 16, rollers[r][1]);
      ctx.arc(rollers[r][0], rollers[r][1], 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#20242a';
      ctx.beginPath();
      ctx.moveTo(rollers[r][0] + 6, rollers[r][1]);
      ctx.arc(rollers[r][0], rollers[r][1], 6, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- Bin of good prints, bottom left ----
    var binX = px + pw * 0.04, binY = py + ph - 58, binW = 86, binH = 52;
    var sheets = Math.min(3, 1 + Math.floor(lt / 45));
    for (var sh = 0; sh < sheets; sh++) {
      ctx.save();
      ctx.translate(binX + binW / 2, binY + 4 - sh * 5);
      ctx.rotate((sh - 1) * 0.07);
      ctx.fillStyle = '#f4f1e8';
      ctx.fillRect(-30, -14, 60, 28);
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-30, -14, 60, 28);
      ctx.restore();
    }
    ctx.fillStyle = '#141414';
    ctx.beginPath();
    ctx.moveTo(binX, binY + 8);
    ctx.lineTo(binX + binW, binY + 8);
    ctx.lineTo(binX + binW - 8, binY + binH);
    ctx.lineTo(binX + 8, binY + binH);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#7d9a89';
    ctx.font = '9px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('G O O D   P R I N T S', binX + binW / 2, binY + binH + 13);

    // ---- Pinned misprints on the wall ----
    var pinW = Math.min(wallW * 0.26, 74);
    var pinH = pinW * 0.72;
    var pinned = pinnedCount(lt);
    for (var pi = 0; pi < pinned; pi++) {
      var sl = SLOTS[pi];
      var pcx = wallX + sl.cx * wallW;
      var pcy = wallY + sl.cy * wallH;
      ctx.save();
      ctx.translate(pcx, pcy);
      ctx.rotate(sl.rot);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(-pinW / 2 + 3, -pinH / 2 + 3, pinW, pinH);
      ctx.fillStyle = '#f4f1e8';
      ctx.fillRect(-pinW / 2, -pinH / 2, pinW, pinH);
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-pinW / 2, -pinH / 2, pinW, pinH);
      printDashes(sl, -pinW / 2, -pinH / 2, pinW, pinH);
      // Pin.
      ctx.fillStyle = '#a01f16';
      ctx.beginPath();
      ctx.moveTo(4, -pinH / 2 + 2);
      ctx.arc(0, -pinH / 2 + 2, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // ---- Operator's hand, on its scripted cycle ----
    var he = handEvent(lt);
    if (he >= 0) {
      var evH = EVENTS[he];
      var hp = (lt - (evH.t + HAND_DELAY)) / HAND_DUR; // 0..1
      var grabX = fx0 + fdx * 0.45, grabY = fy0 + fdy * 0.45;
      var slotH = SLOTS[he];
      var pinX = wallX + slotH.cx * wallW;
      var pinY = wallY + slotH.cy * wallH;
      var hx, hy, hang, carry;
      if (hp < 0.25) {
        // Rise from below to the misprint on the feed.
        var f0 = hp / 0.25;
        hx = lerp(grabX, grabX, f0);
        hy = lerp(H + 70, grabY, f0 * f0);
        hang = 0;
        carry = false;
      } else if (hp < 0.6) {
        // Carry the sheet diagonally to the wall.
        var f1 = (hp - 0.25) / 0.35;
        hx = lerp(grabX, pinX, f1);
        hy = lerp(grabY, pinY, f1) - Math.sin(f1 * Math.PI) * 26;
        hang = lerp(0, slotH.rot, f1);
        carry = true;
      } else if (hp < 0.8) {
        // Pinning: the hand sits just below the print, fingers up
        // against its bottom edge, holding it while the pin goes in.
        // The sheet is on the wall now, not in the hand.
        hx = pinX;
        hy = pinY + pinH / 2 + 16 + Math.sin(lt * 6) * 1.5;
        hang = slotH.rot;
        carry = false;
      } else {
        // Retreat down and out.
        var f2 = (hp - 0.8) / 0.2;
        hx = lerp(pinX, grabX, f2);
        hy = lerp(pinY, H + 70, f2 * f2);
        hang = 0;
        carry = false;
      }
      drawHand(hx, hy, hang, carry, pinW, pinH);
      // The print being pinned appears on the wall during the pin phase.
      if (hp >= 0.6 && hp < 0.8) {
        ctx.save();
        ctx.translate(pinX, pinY);
        ctx.rotate(slotH.rot);
        ctx.fillStyle = '#f4f1e8';
        ctx.fillRect(-pinW / 2, -pinH / 2, pinW, pinH);
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        ctx.strokeRect(-pinW / 2, -pinH / 2, pinW, pinH);
        printDashes(slotH, -pinW / 2, -pinH / 2, pinW, pinH);
        ctx.fillStyle = '#a01f16';
        ctx.beginPath();
        ctx.moveTo(4, -pinH / 2 + 2);
        ctx.arc(0, -pinH / 2 + 2, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ---- Title, date and hint plates, drawn on canvas ----
    ctx.textAlign = 'left';
    ctx.fillStyle = '#c8d2c6';
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.fillText('SELF-WILLED MACHINE', 16, 24);
    ctx.fillStyle = '#8fa392';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText('2006 · 12 · 28', 16, 42);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8fa392';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText('W A T C H   O N L Y', W / 2, H - 14);
  }

  function sizeAndDraw(t) { draw(t); }

  // One synchronous frame at load: fixed phase t = 60 s, early in the
  // loop, wall nearly empty (one misprint pinned, a second being pinned).
  sizeAndDraw(60);

  if (reduced) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = 60 + (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }

  function onResize() { draw(60); }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
