<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9061 · Underdrawing</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #171310; }
  #stage, #guide { position: fixed; inset: 0; display: block; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    text-align: center; color: rgba(232, 220, 196, 0.38);
    font: 12px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.14em; pointer-events: none; user-select: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.7);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<canvas id="guide"></canvas>
<div class="hint">watch it build · click to rebuild</div>
<script>
'use strict';
/* №9061 · Underdrawing
   After Hobbs on process and incompleteness: every finished piece hides the
   scaffolding it was built on. This one shows it, then paints over it. A
   pencil underdrawing (grid, guide circles, the raw flow field as ink lines)
   fades in first; then broad strokes follow the same field, each stroke laid
   as dozens of fine parallel lines with a noise push and pull, until the
   construction is buried under paint and only the finished field remains.
   The guides fade last. Click rebuilds from a new seed; ?still=1 jumps to
   the finished frame. */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9061', 10) || 9061;
const STILL = qs.get('still') === '1';

const stage = document.getElementById('stage');
const guide = document.getElementById('guide');
const bctx = stage.getContext('2d');
const gctx = guide.getContext('2d');
let W = 0, H = 0, S = 0, ox = 0, oy = 0;

function makeNoise(rnd) {
  const P = new Uint8Array(512);
  const p = [];
  for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
  const grad = [];
  for (let i = 0; i < 256; i++) grad.push(rnd() * 2 - 1);
  function val(ix, iy) { return grad[P[(P[ix & 255] + iy) & 255]]; }
  function noise2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = val(xi, yi), b = val(xi + 1, yi), c = val(xi, yi + 1), d = val(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  return function fbm(x, y, oct) {
    let s = 0, amp = 0.5, f = 1, norm = 0;
    for (let i = 0; i < oct; i++) { s += amp * noise2(x * f, y * f); norm += amp; amp *= 0.5; f *= 2.03; }
    return s / norm;
  };
}
function pickWeighted(rnd, pairs) {
  let r = rnd(), acc = 0;
  for (const [v, w] of pairs) { acc += w; if (r <= acc) return v; }
  return pairs[pairs.length - 1][0];
}
const TAU = Math.PI * 2;

// ---- build the whole piece from the seed (geometry only) ----
let jobs = [];      // {t0, t1, draw(frac), done}
let guideAlpha = 0;

function build() {
  jobs = [];
  const rnd = mulberry32(seed);
  const fbm = makeNoise(rnd);

  // the field: low frequency, sweeping; turbulence varies by seed
  const turb = pickWeighted(rnd, [[0.5, 0.25], [1.1, 0.5], [2.0, 0.25]]);
  const wob = rnd() * 10, fscale = 1.0 + rnd() * 0.5;
  function fieldAngle(x, y) {
    const wx = fbm(x * fscale + wob, y * fscale, 3);
    const wy = fbm(x * fscale, y * fscale + wob * 1.7, 3);
    return fbm(x * fscale * 2 + wx * 1.6, y * fscale * 2 + wy * 1.6, 3) * turb * Math.PI;
  }

  const M = S * 0.07;
  function walk(sx, sy, maxSteps, stepLen) {
    const pts = [[sx, sy]];
    let x = sx, y = sy, a = fieldAngle(x / S, y / S);
    for (let s = 0; s < maxSteps; s++) {
      a = a * 0.86 + fieldAngle(x / S, y / S) * 0.14;
      x += Math.cos(a) * stepLen; y += Math.sin(a) * stepLen;
      if (x < M || x > S - M || y < M || y > S - M) break;
      pts.push([x, y]);
    }
    return pts;
  }

  // ---- guides: pencil grid, circles, a diagonal ----
  gctx.setTransform(1, 0, 0, 1, 0, 0);
  gctx.clearRect(0, 0, guide.width, guide.height);
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  gctx.save();
  gctx.translate(ox, oy);
  gctx.strokeStyle = 'rgba(85,80,74,0.55)';
  gctx.lineWidth = 1;
  const gn = 9;
  for (let i = 1; i < gn; i++) {
    const g = (i / gn) * S;
    gctx.beginPath(); gctx.moveTo(g, M * 0.5); gctx.lineTo(g, S - M * 0.5); gctx.stroke();
    gctx.beginPath(); gctx.moveTo(M * 0.5, g); gctx.lineTo(S - M * 0.5, g); gctx.stroke();
  }
  for (let i = 0; i < 2; i++) {
    gctx.beginPath();
    gctx.arc(S * (0.3 + rnd() * 0.4), S * (0.3 + rnd() * 0.4), S * (0.12 + rnd() * 0.16), 0, TAU);
    gctx.stroke();
  }
  gctx.beginPath(); gctx.moveTo(M, S - M); gctx.lineTo(S - M, M); gctx.stroke();
  // tick marks along the bottom margin
  for (let i = 0; i <= 12; i++) {
    const tx = M + (i / 12) * (S - 2 * M);
    gctx.beginPath(); gctx.moveTo(tx, S - M * 0.55); gctx.lineTo(tx, S - M * 0.35); gctx.stroke();
  }
  gctx.restore();

  // ---- the drawing: ink field lines on a jittered grid ----
  const lines = [];
  const grid = 8;
  for (let j = 0; j < grid; j++) for (let i = 0; i < grid; i++) {
    const sx = M + ((i + 0.15 + rnd() * 0.7) / grid) * (S - 2 * M);
    const sy = M + ((j + 0.15 + rnd() * 0.7) / grid) * (S - 2 * M);
    const pts = walk(sx, sy, 130, S / 380);
    if (pts.length > 24) lines.push(pts);
  }
  lines.forEach((pts, i) => {
    const t0 = 1.1 + i * 0.028, t1 = t0 + 0.85;
    let drawn = 0;
    jobs.push({ t0, t1, draw(frac) {
      const target = Math.floor(frac * (pts.length - 1));
      if (target <= drawn) return;
      bctx.strokeStyle = 'rgba(59,51,42,0.6)';
      bctx.lineWidth = 1.1;
      bctx.lineCap = 'round';
      bctx.beginPath();
      bctx.moveTo(pts[drawn][0], pts[drawn][1]);
      for (let k = drawn + 1; k <= target; k++) bctx.lineTo(pts[k][0], pts[k][1]);
      bctx.stroke();
      drawn = target;
    }});
  });
  const linesEnd = 1.1 + lines.length * 0.028 + 0.85;

  // ---- the paint: broad strokes, each one many fine parallel lines ----
  const PAINT = [
    ['#9c3a28', 0.26], // madder
    ['#d1942f', 0.24], // ochre
    ['#6b4a2e', 0.20], // umber
    ['#4a5a68', 0.16], // slate
    ['#ddd2b4', 0.14], // bone
  ];
  const nStrokes = 30 + Math.floor(rnd() * 9);
  let st = Math.max(linesEnd + 0.25, 3.6);
  for (let i = 0; i < nStrokes; i++) {
    const sx = M + rnd() * (S - 2 * M), sy = M + rnd() * (S - 2 * M);
    const center = walk(sx, sy, 150, S / 420);
    if (center.length < 30) continue;
    const color = pickWeighted(rnd, PAINT);
    const sw = S * (0.04 + rnd() * 0.06); // stroke width
    const nLines = 60 + Math.floor(rnd() * 30);
    const alpha = 0.09 + rnd() * 0.07;
    // per-line wobble so the stroke breathes
    const wob1 = rnd() * 10, wob2 = rnd() * 10;
    const strokeLines = [];
    const C = center.length;
    for (let L = 0; L < nLines; L++) {
      const off = (L / (nLines - 1) - 0.5) * sw;
      // staggered line ends: ragged stroke edges, tapered at the sides
      const edgeTaper = 1 - Math.abs(off) / (sw * 0.5) * 0.55;
      const k0 = Math.floor(rnd() * C * 0.28 * edgeTaper);
      const k1 = Math.ceil(C - 1 - rnd() * C * 0.28 * edgeTaper);
      if (k1 - k0 < 8) continue;
      const lp = [];
      for (let k = k0; k <= k1; k++) {
        const p0 = center[Math.max(0, k - 1)], p1 = center[Math.min(C - 1, k + 1)];
        let nx = -(p1[1] - p0[1]), ny = (p1[0] - p0[0]);
        const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
        const w = (fbm(k * 0.05 + wob1, off * 0.02 + wob2, 2)) * sw * 0.18;
        lp.push([center[k][0] + nx * (off + w), center[k][1] + ny * (off + w)]);
      }
      strokeLines.push(lp);
    }
    if (strokeLines.length < 12) continue;
    const t0 = st, t1 = st + 0.55;
    st += 0.13;
    let drawnL = 0;
    jobs.push({ t0, t1, draw(frac) {
      const target = Math.floor(frac * strokeLines.length);
      if (target <= drawnL) return;
      bctx.strokeStyle = color;
      bctx.globalAlpha = alpha;
      bctx.lineWidth = 1.4;
      for (let L = drawnL; L < target; L++) {
        const lp = strokeLines[L];
        bctx.beginPath();
        bctx.moveTo(lp[0][0], lp[0][1]);
        for (let k = 1; k < lp.length; k++) bctx.lineTo(lp[k][0], lp[k][1]);
        bctx.stroke();
      }
      bctx.globalAlpha = 1;
      drawnL = target;
    }});
  }
  const paintEnd = st + 0.55;

  // ---- glaze: a few broad translucent washes to unify ----
  const washes = [pickWeighted(rnd, PAINT), pickWeighted(rnd, PAINT), '#e9e2d2'];
  washes.forEach((c, i) => {
    const t0 = paintEnd + 0.15 + i * 0.3, t1 = t0 + 0.35;
    const wx = M + rnd() * (S - 2 * M), wy = M + rnd() * (S - 2 * M);
    const wr = S * (0.2 + rnd() * 0.25);
    jobs.push({ t0, t1, draw(frac) {
      if (frac <= 0 || this.done) return;
      this.done = true;
      const g = bctx.createRadialGradient(wx, wy, 0, wx, wy, wr);
      g.addColorStop(0, c + '2e'); g.addColorStop(1, c + '00');
      bctx.fillStyle = g;
      bctx.fillRect(wx - wr, wy - wr, wr * 2, wr * 2);
    }});
  });
  const glazeEnd = paintEnd + 0.15 + washes.length * 0.3 + 0.35;

  // guide overlay timing
  const guideIn = [0.1, 1.2], guideOut = [glazeEnd + 0.3, glazeEnd + 1.4];
  jobs.guideIn = guideIn; jobs.guideOut = guideOut;
  jobs.end = guideOut[1] + 0.4;
}

function renderFrame(t) {
  // guides overlay alpha (content was drawn once in build(); just fade it)
  const [gi0, gi1] = jobs.guideIn, [go0, go1] = jobs.guideOut;
  let a = 0;
  if (t < gi0) a = 0;
  else if (t < gi1) a = (t - gi0) / (gi1 - gi0);
  else if (t < go0) a = 1;
  else if (t < go1) a = 1 - (t - go0) / (go1 - go0);
  else a = 0;
  guide.style.opacity = a.toFixed(3);

  for (const j of jobs) {
    if (t < j.t0) continue;
    const frac = Math.min(1, (t - j.t0) / (j.t1 - j.t0));
    j.draw(frac);
  }
}

let startT = 0, raf = 0;
function frame(now) {
  const t = (now - startT) / 1000;
  renderFrame(t);
  if (t < jobs.end) raf = requestAnimationFrame(frame);
}

function reset() {
  cancelAnimationFrame(raf);
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [stage, guide]) {
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    c.style.width = W + 'px'; c.style.height = H + 'px';
  }
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // wall + gesso ground (no lingering transform; jobs draw via renderFrame's wrapper)
  bctx.fillStyle = '#171310';
  bctx.fillRect(0, 0, W, H);
  S = Math.min(W, H) * 0.92;
  ox = (W - S) / 2; oy = (H - S) / 2;
  bctx.fillStyle = '#e9e2d2';
  bctx.fillRect(ox, oy, S, S);
  build();
  if (STILL) {
    renderFrame(1e9); // everything, guides faded
    guide.style.opacity = '0';
  } else {
    startT = performance.now();
    raf = requestAnimationFrame(frame);
  }
}

// The animation draws inside the clipped square: wrap job draws.
// Simpler: jobs draw in square coordinates; we re-apply transform per frame.
const _renderFrame = renderFrame;
renderFrame = function (t) {
  bctx.save();
  bctx.translate(ox, oy);
  bctx.beginPath(); bctx.rect(0, 0, S, S); bctx.clip();
  _renderFrame(t);
  bctx.restore();
};

window.addEventListener('resize', reset);
stage.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  reset();
});
guide.addEventListener('click', () => stage.dispatchEvent(new Event('click')));

reset();
</script>
</body>
</html>
