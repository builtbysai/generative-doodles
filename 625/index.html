<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nothing Ends, Everything Transforms</title>
<style>
  html, body { margin: 0; padding: 0; background: #0E0B08; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette (strict) ----------
  var GROUND = '#0E0B08';
  var AMBER  = '#E8B93B';   // night amber
  var SILVER = '#D9D4C5';   // moon silver
  var BLUE   = '#1E4D8C';   // deep blue
  var GREEN  = '#5C8A4D';   // leaf green
  var PINK   = '#E87B9C';   // bloom pink
  var EMBER  = '#C9562E';   // ember orange
  var ASH    = '#8E897C';   // silver desaturated toward the ground (ash only)

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mixHex(h1, h2, t) {
    var c1 = hexRgb(h1), c2 = hexRgb(h2);
    return 'rgb(' + Math.round(lerp(c1[0], c2[0], t)) + ',' +
                    Math.round(lerp(c1[1], c2[1], t)) + ',' +
                    Math.round(lerp(c1[2], c2[2], t)) + ')';
  }
  function rgbaOf(rgbStr, a) {
    return rgbStr.replace('rgb(', 'rgba(').replace(')', ',' + a + ')');
  }
  function smooth(t) { t = t < 0 ? 0 : (t > 1 ? 1 : t); return t * t * (3 - 2 * t); }
  function frac(x) { return x - Math.floor(x); }

  // ---------- phase keyframes ----------
  // phases: 0 seed, 1 shoots, 2 bloom, 3 fruit, 4 decay, 5 ash ; key 6 wraps to key 0
  // len/droop/fan in R units & multipliers; tipPetal/tipFruit 0..1; bodyS scale; desat 0..1; appA appendage alpha
  var KEYS = [
    { len: 0.06, droop: 0.00, fan: 0.55, petal: 0.00, fruit: 0.00, bodyS: 1.00, desat: 0.00, appA: 0.20 },
    { len: 0.55, droop: 0.05, fan: 0.78, petal: 0.00, fruit: 0.00, bodyS: 0.84, desat: 0.00, appA: 1.00 },
    { len: 0.88, droop: 0.03, fan: 1.06, petal: 1.00, fruit: 0.00, bodyS: 0.78, desat: 0.00, appA: 1.00 },
    { len: 0.80, droop: 0.32, fan: 0.95, petal: 0.15, fruit: 1.00, bodyS: 1.07, desat: 0.06, appA: 1.00 },
    { len: 0.70, droop: 0.50, fan: 0.80, petal: 0.00, fruit: 0.35, bodyS: 0.92, desat: 0.65, appA: 0.90 },
    { len: 0.62, droop: 0.56, fan: 0.75, petal: 0.00, fruit: 0.00, bodyS: 0.85, desat: 0.80, appA: 0.00 }
  ];
  function cycleParams(u) {
    var seg = Math.floor(u * 6) % 6;
    var f = smooth(frac(u * 6));
    var A = KEYS[seg], B = KEYS[(seg + 1) % 6], out = {};
    for (var k in A) out[k] = lerp(A[k], B[k], f);
    out.seg = seg; out.local = frac(u * 6);
    return out;
  }
  function cycColor(arr, u) {
    var seg = Math.floor(u * 6) % 6;
    var f = smooth(frac(u * 6));
    return mixHex(arr[seg], arr[(seg + 1) % 6], f);
  }

  // ---------- species ----------
  // Appendage: ang (rad, canvas coords, 0 = right, + = clockwise), fanRef, lenJit, curl, wMul
  function buildApps(seed, list) {
    var rng = mulberry32(seed);
    return list.map(function (d) {
      return {
        ang: d[0], fanRef: d[1],
        lenJit: 0.88 + rng() * 0.28,
        curl: (rng() - 0.5) * 0.55,
        wMul: 0.85 + rng() * 0.35,
        fruitCol: rng() < 0.5 ? AMBER : EMBER,
        jit: rng()
      };
    });
  }
  var DEG = Math.PI / 180;
  function fan(cxDeg, n, spreadDeg, extra) {
    var out = [];
    for (var i = 0; i < n; i++) {
      var a = (cxDeg + (n === 1 ? 0 : (i / (n - 1) - 0.5) * spreadDeg)) * DEG;
      out.push([a, cxDeg * DEG].concat(extra || []));
    }
    return out;
  }

  var SPECIES = [
    { // 0 PLANT: radial shoots biased upward, pink petals, amber/ember fruit
      name: 'plant', seed: 625001, bodyBase: 0.30, appWidth: 0.078, startK: 0.55,
      appColors:  [GREEN, GREEN, GREEN, GREEN, GREEN, GREEN],
      bodyColors: [AMBER, GREEN, GREEN, GREEN, GREEN, GREEN],
      petalColor: PINK, drawPetals: true, fruitScale: 1.0,
      apps: buildApps(625001,
        fan(-90, 8, 305).concat(fan(95, 3, 105)))
    },
    { // 1 BIRD: egg body, two feather wings + crest, silver feather tips, heavy body at "fruit"
      name: 'bird', seed: 625002, bodyBase: 0.30, appWidth: 0.075, startK: 0.45,
      appColors:  [AMBER, AMBER, AMBER, AMBER, AMBER, AMBER],
      bodyColors: [SILVER, SILVER, SILVER, SILVER, SILVER, SILVER],
      petalColor: SILVER, drawPetals: true, fruitScale: 0.0,
      apps: buildApps(625002,
        fan(178, 6, 105).concat(fan(2, 6, 105)).concat(fan(-90, 3, 44)))
    },
    { // 2 PINE: cone body, upward needle fan, amber pollen dots, ember mini-cones
      name: 'pine', seed: 625003, bodyBase: 0.32, appWidth: 0.030, startK: 0.40,
      appColors:  [GREEN, GREEN, GREEN, GREEN, GREEN, GREEN],
      bodyColors: [EMBER, EMBER, EMBER, EMBER, EMBER, EMBER],
      petalColor: AMBER, drawPetals: true, fruitScale: 0.8,
      apps: buildApps(625003, fan(-90, 13, 168))
    },
    { // 3 FISH: silver body, blue fin ribbons (tail fan, dorsal, pectorals), heavy belly at "fruit"
      name: 'fish', seed: 625004, bodyBase: 0.30, appWidth: 0.085, startK: 0.80,
      appColors:  [BLUE, BLUE, BLUE, BLUE, BLUE, BLUE],
      bodyColors: [SILVER, SILVER, SILVER, SILVER, SILVER, SILVER],
      petalColor: SILVER, drawPetals: true, fruitScale: 0.0,
      apps: buildApps(625004,
        fan(180, 4, 95).concat(fan(-90, 3, 60)).concat(fan(55, 1, 0)).concat(fan(125, 1, 0)))
    }
  ];

  // appendage curve in unit space (center 0,0 ; R = 1)
  function appCurve(app, P) {
    var ang = app.fanRef + (app.ang - app.fanRef) * P.fan;
    var L = (0.14 + P.len * app.lenJit);
    var sx = Math.cos(ang) * 0.16, sy = Math.sin(ang) * 0.16;
    var ex = Math.cos(ang) * L, ey = Math.sin(ang) * L + P.droop * 0.30 * (0.4 + 0.6 * Math.abs(Math.cos(ang)) + 0.4);
    var mx = (sx + ex) / 2, my = (sy + ey) / 2;
    var px = -Math.sin(ang), py = Math.cos(ang);
    var cxp = mx + px * app.curl * L * 0.35, cyp = my + py * app.curl * L * 0.35 + P.droop * 0.16;
    return { sx: sx, sy: sy, cx: cxp, cy: cyp, ex: ex, ey: ey };
  }
  function quadPt(c, t) {
    var s = 1 - t;
    return [s * s * c.sx + 2 * s * t * c.cx + t * t * c.ex,
            s * s * c.sy + 2 * s * t * c.cy + t * t * c.ey];
  }

  // ---------- ash particles per species (seeded layouts) ----------
  SPECIES.forEach(function (sp) {
    var rng = mulberry32(sp.seed + 77);
    var P = { len: KEYS[5].len, droop: KEYS[5].droop, fan: KEYS[5].fan };
    var parts = [];
    var i, app, c, t, p;
    for (i = 0; i < 72; i++) {           // from appendage curves
      app = sp.apps[i % sp.apps.length];
      c = appCurve(app, P);
      t = 0.55 + rng() * 0.45;
      p = quadPt(c, t);
      parts.push(makeParticle(rng, p[0], p[1]));
    }
    for (i = 0; i < 48; i++) {           // from the body disc
      var a = rng() * Math.PI * 2, r = Math.sqrt(rng()) * sp.bodyBase * 0.85;
      parts.push(makeParticle(rng, Math.cos(a) * r, Math.sin(a) * r));
    }
    sp.particles = parts;
    function makeParticle(rng, x, y) {
      var dl = Math.sqrt(x * x + y * y) || 0.001;
      var rot = (rng() - 0.5) * 1.0;
      var ca = Math.cos(rot), sa = Math.sin(rot);
      var dx = (x / dl) * ca - (y / dl) * sa, dy = (x / dl) * sa + (y / dl) * ca;
      var mag = 0.28 + rng() * 0.48;
      return {
        ox: x, oy: y,
        dx: dx * mag, dy: dy * mag - 0.10,
        r: 0.010 + rng() * 0.016,
        tw: rng() * Math.PI * 2
      };
    }
  });

  // ---------- sizing (Visual Viewport API) ----------
  var W = 0, H = 0;
  function resize() {
    var vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  function isPhone(w, h) {
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  // ---------- state ----------
  var U0 = 0.30;                 // frame one: species 1 (plant) at full bloom
  var CYCLE_S = 90;              // ~90 s per full cycle
  var elapsed = 0;               // anchored elapsed seconds (rAF clock)
  var uOff = 0;                  // tangential drag offset, in cycle units
  var speciesIdx = 0;
  var reseed = null;             // { start: elapsedSeconds, from: speciesIdx }
  var RESEED_S = 2.4;

  // QA hook: ?seed=ash | ashdrift | <number> forces the drawn cycle phase (production loads carry no query)
  var FORCED_U = null;
  try {
    var searchStr = (typeof location !== 'undefined' && location.search) ||
                    (window.location && window.location.search) || '';
    var sm = /[?&]seed=([^&]*)/.exec(searchStr);
    if (sm) {
      var sv = decodeURIComponent(sm[1]);
      if (sv === 'ash') FORCED_U = 0.96;
      else if (sv === 'ashdrift') FORCED_U = 0.875;
      else if (!isNaN(parseFloat(sv))) FORCED_U = parseFloat(sv);
    }
  } catch (e) { FORCED_U = null; }

  function currentU() {
    if (FORCED_U !== null) return FORCED_U;
    return frac(U0 + elapsed / CYCLE_S + uOff);
  }

  // ---------- drawing ----------
  function drawBody(sp, cx, cy, R, bodyS, alpha, desat, bodyCol) {
    var rb = R * sp.bodyBase * bodyS;
    var col = mixHex(rgbToHex(bodyCol), SILVER, desat * 0.45);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    if (sp.name === 'plant') {
      ctx.beginPath(); ctx.arc(cx, cy, rb, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = alpha * 0.4; ctx.strokeStyle = SILVER; ctx.lineWidth = Math.max(1, R * 0.006);
      ctx.beginPath(); ctx.arc(cx, cy, rb * 0.62, -0.4, Math.PI * 0.75); ctx.stroke();
    } else if (sp.name === 'bird') {
      ctx.beginPath(); ctx.ellipse(cx, cy, rb * 0.84, rb * 1.08, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = alpha * 0.35; ctx.strokeStyle = AMBER; ctx.lineWidth = Math.max(1, R * 0.007);
      ctx.beginPath(); ctx.ellipse(cx, cy, rb * 0.55, rb * 0.72, 0, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    } else if (sp.name === 'pine') {
      ctx.beginPath();
      ctx.moveTo(cx, cy - rb * 1.25);
      ctx.bezierCurveTo(cx + rb * 0.95, cy - rb * 0.45, cx + rb * 0.80, cy + rb * 0.55, cx, cy + rb * 0.95);
      ctx.bezierCurveTo(cx - rb * 0.80, cy + rb * 0.55, cx - rb * 0.95, cy - rb * 0.45, cx, cy - rb * 1.25);
      ctx.fill();
      ctx.globalAlpha = alpha * 0.55; ctx.strokeStyle = AMBER; ctx.lineWidth = Math.max(1, R * 0.008);
      for (var r = 0; r < 3; r++) {
        var yy = cy - rb * 0.35 + r * rb * 0.48, ww = rb * (0.52 + r * 0.16);
        ctx.beginPath(); ctx.arc(cx, yy, ww, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke();
      }
    } else { // fish
      var belly = (sp._belly || 0);
      ctx.beginPath(); ctx.ellipse(cx, cy + belly * R * 0.03, rb * 1.38, rb * (0.72 + belly * 0.30), 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = alpha * 0.45; ctx.fillStyle = BLUE;
      ctx.beginPath(); ctx.ellipse(cx - rb * 0.1, cy - rb * 0.34, rb * 1.05, rb * 0.30, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = alpha; ctx.fillStyle = GROUND;
      ctx.beginPath(); ctx.arc(cx + rb * 0.92, cy - rb * 0.14, Math.max(1.4, rb * 0.085), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  function rgbToHex(rgbStr) {
    var m = /(\d+),\s*(\d+),\s*(\d+)/.exec(rgbStr);
    if (!m) return SILVER;
    function h(v) { var s = parseInt(v, 10).toString(16); return s.length < 2 ? '0' + s : s; }
    return '#' + h(m[1]) + h(m[2]) + h(m[3]);
  }

  function drawAppendages(sp, cx, cy, R, P, u, alphaMul) {
    var appCol = mixHex(rgbToHex(cycColor(sp.appColors, u)), SILVER, P.desat * 0.55);
    var petalCol = mixHex(sp.petalColor, SILVER, P.desat * 0.55);
    for (var i = 0; i < sp.apps.length; i++) {
      var app = sp.apps[i];
      var c = appCurve(app, P);
      var steps = 8, pts = [], j, p;
      for (j = 0; j <= steps; j++) pts.push(quadPt(c, j / steps));
      // tapered ribbon
      var w0 = R * sp.appWidth * app.wMul;
      ctx.fillStyle = rgbaOf(appCol, alphaMul * P.appA);
      ctx.beginPath();
      for (j = 0; j <= steps; j++) {
        var t = j / steps;
        var q = pts[Math.min(steps, j + 1)], q0 = pts[Math.max(0, j - 1)];
        var tx = q[0] - q0[0], ty = q[1] - q0[1];
        var tl = Math.sqrt(tx * tx + ty * ty) || 1; tx /= tl; ty /= tl;
        var hw = (w0 * Math.pow(1 - t, 0.55) + R * 0.004) / 2;
        var X = cx + pts[j][0] * R, Y = cy + pts[j][1] * R;
        if (j === 0) ctx.moveTo(X - ty * hw, Y + tx * hw); else ctx.lineTo(X - ty * hw, Y + tx * hw);
      }
      for (j = steps; j >= 0; j--) {
        var t2 = j / steps;
        var q2 = pts[Math.min(steps, j + 1)], q02 = pts[Math.max(0, j - 1)];
        var tx2 = q2[0] - q02[0], ty2 = q2[1] - q02[1];
        var tl2 = Math.sqrt(tx2 * tx2 + ty2 * ty2) || 1; tx2 /= tl2; ty2 /= tl2;
        var hw2 = (w0 * Math.pow(1 - t2, 0.55) + R * 0.004) / 2;
        ctx.lineTo(cx + pts[j][0] * R + ty2 * hw2, cy + pts[j][1] * R - tx2 * hw2);
      }
      ctx.closePath(); ctx.fill();
      // tip ornaments at the curve end
      var tip = pts[steps], tan = pts[steps], tan0 = pts[steps - 2];
      var angT = Math.atan2(tan[1] - tan0[1], tan[0] - tan0[0]);
      var TX = cx + tip[0] * R, TY = cy + tip[1] * R;
      if (sp.drawPetals && P.petal > 0.02) {
        var pr = R * 0.105 * P.petal * (0.8 + app.jit * 0.4);
        ctx.fillStyle = rgbaOf(petalCol, alphaMul * P.petal);
        if (sp.name === 'plant') {   // a small three-petal cluster per flower head
          var offs = [0, -0.62, 0.62];
          for (var oi = 0; oi < 3; oi++) {
            ctx.save();
            ctx.translate(TX, TY); ctx.rotate(angT + offs[oi]);
            ctx.beginPath();
            ctx.ellipse(pr * 0.55, 0, pr * (oi === 0 ? 1 : 0.72), pr * 0.45 * (oi === 0 ? 1 : 0.72), 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        } else {
          ctx.save();
          ctx.translate(TX, TY); ctx.rotate(angT);
          ctx.beginPath(); ctx.ellipse(0, 0, pr, pr * (sp.name === 'pine' ? 0.5 : 0.45), 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
      }
      if (sp.fruitScale > 0 && P.fruit > 0.02) {
        var fr = R * 0.058 * P.fruit * sp.fruitScale * (0.8 + app.jit * 0.45);
        var FY = TY + fr * 0.9 + P.droop * R * 0.05;
        ctx.strokeStyle = rgbaOf(appCol, alphaMul * 0.8);
        ctx.lineWidth = Math.max(1, R * 0.006);
        ctx.beginPath(); ctx.moveTo(TX, TY); ctx.lineTo(TX, FY - fr * 0.6); ctx.stroke();
        var fCol = mixHex(app.fruitCol, SILVER, P.desat * 0.55);
        ctx.fillStyle = rgbaOf(fCol, alphaMul * Math.min(1, P.fruit + 0.25));
        ctx.beginPath();
        if (sp.name === 'pine') {  // mini-cone teardrop
          ctx.moveTo(TX, FY - fr * 1.1);
          ctx.quadraticCurveTo(TX + fr * 0.9, FY + fr * 0.2, TX, FY + fr * 0.95);
          ctx.quadraticCurveTo(TX - fr * 0.9, FY + fr * 0.2, TX, FY - fr * 1.1);
        } else {
          ctx.arc(TX, FY, fr, 0, Math.PI * 2);
        }
        ctx.fill();
      }
    }
  }

  function drawAsh(sp, cx, cy, R, spread, gather, alpha, twPhase) {
    if (alpha <= 0.01) return;
    ctx.fillStyle = ASH;
    for (var i = 0; i < sp.particles.length; i++) {
      var p = sp.particles[i];
      var x = p.ox + p.dx * spread, y = p.oy + p.dy * spread;
      x = lerp(x, 0, gather); y = lerp(y, 0, gather);
      var tw = 0.72 + 0.28 * Math.sin(twPhase + p.tw);
      ctx.globalAlpha = alpha * tw * (1 - gather * 0.25);
      ctx.beginPath();
      ctx.arc(cx + x * R, cy + y * R, Math.max(0.7, p.r * R * (1 - gather * 0.45)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawOrganism(sp, cx, cy, R, u, ashOverlay) {
    var P = cycleParams(u);
    var bodyCol = cycColor(sp.bodyColors, u);
    sp._belly = (sp.name === 'fish') ? Math.max(0, (P.bodyS - 1)) * 3.2 : 0;
    var bodyAlpha = 1, appAlpha = 1;
    var spread = 0, gather = 0, ashAlpha = 0;
    if (P.seg === 5) {
      var a = P.local;
      var dissolve = smooth(a / 0.30);
      var reform = smooth((a - 0.60) / 0.40);
      bodyAlpha = Math.max(1 - dissolve, reform);
      var bodyS = lerp(P.bodyS, KEYS[0].bodyS, reform);
      appAlpha = 1 - smooth(a / 0.25);
      spread = Math.pow(Math.sin(Math.PI * Math.min(a / 0.94, 1)), 1.15);
      gather = smooth((a - 0.55) / 0.42);
      ashAlpha = smooth((a - 0.04) / 0.26) * (1 - smooth((a - 0.90) / 0.10) * 0.35);
      drawAppendages(sp, cx, cy, R, P, u, appAlpha);
      drawAsh(sp, cx, cy, R, spread, gather, ashAlpha, u * Math.PI * 12);
      drawBody(sp, cx, cy, R, bodyS, bodyAlpha, lerp(P.desat, 0, reform), bodyCol);
      return;
    }
    if (ashOverlay && ashOverlay.amount > 0) {   // reseed dissolve of the old species
      var m = ashOverlay.amount;
      drawAppendages(sp, cx, cy, R, P, u, 1 - m);
      drawAsh(sp, cx, cy, R, 0.30 * m + (ashOverlay.spread || 0), ashOverlay.gather || 0, m, elapsed * 2.2);
      drawBody(sp, cx, cy, R, P.bodyS, 1 - m, P.desat, bodyCol);
      return;
    }
    drawAppendages(sp, cx, cy, R, P, u, 1);
    drawBody(sp, cx, cy, R, P.bodyS, 1, P.desat, bodyCol);
  }

  // ---------- orbit ring with paired markers ----------
  function drawRing(cx, cy, R, u) {
    var Rr = R * 1.34;
    ctx.strokeStyle = 'rgba(217,212,197,0.30)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, Rr, 0, Math.PI * 2); ctx.stroke();
    var rot = u * Math.PI * 2;
    var bases = [-Math.PI / 2, Math.PI / 6, Math.PI * 5 / 6];
    for (var k = 0; k < 3; k++) {
      var bob = Math.sin(u * Math.PI * 12 + k * 2.1) * R * 0.012;
      var aC = bases[k] + rot;
      drawPair(k, cx + Math.cos(aC) * (Rr + bob), cy + Math.sin(aC) * (Rr + bob), aC, R);
    }
  }
  function drawPair(k, x, y, aC, R) {
    var g = Math.max(4.5, R * 0.052);
    var off = g * 1.25;
    var tx = -Math.sin(aC), ty = Math.cos(aC);
    var x1 = x - tx * off, y1 = y - ty * off, x2 = x + tx * off, y2 = y + ty * off;
    ctx.save();
    if (k === 0) {           // moon pair: full disc + crescent
      ctx.fillStyle = SILVER;
      ctx.beginPath(); ctx.arc(x1, y1, g, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x2, y2, g, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = GROUND;
      ctx.beginPath(); ctx.arc(x2 + g * 0.45, y2 - g * 0.2, g * 0.82, 0, Math.PI * 2); ctx.fill();
    } else if (k === 1) {    // season pair: snow asterisk + green sprout
      ctx.strokeStyle = SILVER; ctx.lineWidth = Math.max(1, R * 0.006);
      for (var s = 0; s < 3; s++) {
        var aa = s * Math.PI / 3 + 0.3;
        ctx.beginPath();
        ctx.moveTo(x1 - Math.cos(aa) * g, y1 - Math.sin(aa) * g);
        ctx.lineTo(x1 + Math.cos(aa) * g, y1 + Math.sin(aa) * g);
        ctx.stroke();
      }
      ctx.strokeStyle = GREEN;
      ctx.beginPath(); ctx.moveTo(x2, y2 + g * 0.9); ctx.quadraticCurveTo(x2 + g * 0.2, y2, x2, y2 - g * 0.7); ctx.stroke();
      ctx.fillStyle = GREEN;
      ctx.beginPath(); ctx.ellipse(x2 - g * 0.45, y2 - g * 0.35, g * 0.5, g * 0.24, -0.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x2 + g * 0.45, y2 - g * 0.55, g * 0.5, g * 0.24, 0.6, 0, Math.PI * 2); ctx.fill();
    } else {                 // day/night pair: amber sun + blue night disc
      ctx.fillStyle = AMBER;
      ctx.beginPath(); ctx.arc(x1, y1, g * 0.72, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = AMBER; ctx.lineWidth = Math.max(1, R * 0.006);
      for (var r2 = 0; r2 < 8; r2++) {
        var ar = r2 * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(x1 + Math.cos(ar) * g * 0.9, y1 + Math.sin(ar) * g * 0.9);
        ctx.lineTo(x1 + Math.cos(ar) * g * 1.25, y1 + Math.sin(ar) * g * 1.25);
        ctx.stroke();
      }
      ctx.fillStyle = BLUE;
      ctx.beginPath(); ctx.arc(x2, y2, g * 0.85, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = SILVER; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x2, y2, g * 0.85, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var phone = isPhone(W, H);
    var R = Math.min(W, H) * (phone ? 0.30 : 0.28);
    var cx = W / 2, cy = H / 2;
    var u = currentU();
    drawRing(cx, cy, R, u);
    if (reseed && FORCED_U === null) {
      var rt = (elapsed - reseed.start) / RESEED_S;
      var oldSp = SPECIES[reseed.from], newSp = SPECIES[(reseed.from + 1) % SPECIES.length];
      var frozenU = reseed.u;
      if (rt < 0.34) {
        drawOrganism(oldSp, cx, cy, R, frozenU, { amount: smooth(rt / 0.34), spread: 0 });
      } else if (rt < 0.56) {
        var d = (rt - 0.34) / 0.22;
        drawAsh(oldSp, cx, cy, R, 0.30 + 0.55 * d, 0, 1, elapsed * 2.2);
      } else {
        var g2 = (rt - 0.56) / 0.44;
        drawAsh(oldSp, cx, cy, R, 0.85, smooth(g2), 1, elapsed * 2.2);
        var na = smooth((g2 - 0.45) / 0.55);
        if (na > 0) drawBody(newSp, cx, cy, R, KEYS[0].bodyS * (0.4 + 0.6 * na), na, 0, newSp.bodyColors[0]);
      }
    } else {
      drawOrganism(SPECIES[speciesIdx], cx, cy, R, u, null);
    }
  }

  // ---------- interaction ----------
  var pointers = {};
  var lastTap = null;
  function ptrAngle(e) {
    var r = canvas.getBoundingClientRect();
    var x = e.clientX - r.left - W / 2, y = e.clientY - r.top - H / 2;
    return Math.atan2(y, x);
  }
  function angDelta(a, b) {
    var d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  canvas.addEventListener('pointerdown', function (e) {
    pointers[e.pointerId] = { ang: ptrAngle(e), t: elapsed, moved: 0 };
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    var a = ptrAngle(e);
    var d = angDelta(a, p.ang);
    p.ang = a;
    p.moved += Math.abs(d);
    if (!reseed) uOff += d / (Math.PI * 2);   // clockwise stirs time forward, counter pulls it back
  });
  function endPointer(e) {
    var p = pointers[e.pointerId];
    delete pointers[e.pointerId];
    if (!p) return;
    var quick = (elapsed - p.t) < 0.35 && p.moved < 0.04;
    if (!quick) { lastTap = null; return; }
    if (lastTap !== null && (elapsed - lastTap) < 0.38) {
      lastTap = null;
      if (!reseed && FORCED_U === null) {
        reseed = { start: elapsed, from: speciesIdx, u: currentU() };
      }
    } else {
      lastTap = elapsed;
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- main loop (anchored elapsed clock) ----------
  resize();
  draw(); // synchronous first frame: plant at u = 0.30, full bloom
  if (typeof requestAnimationFrame === 'function') {
    var firstTs = null;
    var loop = function (ts) {
      if (firstTs === null) firstTs = ts;
      elapsed = (ts - firstTs) / 1000;
      if (reseed && (elapsed - reseed.start) / RESEED_S >= 1) {
        speciesIdx = (reseed.from + 1) % SPECIES.length;
        uOff = frac(0.03 - U0 - elapsed / CYCLE_S); // resume the new species at its seed phase
        reseed = null;
      }
      draw();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
