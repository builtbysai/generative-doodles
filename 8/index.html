<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№8 · Rain</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f0e9d8; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(74,62,42,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(240,233,216,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another rain</div>
<script>
'use strict';
// No8 Rain.
// Short vertical capsules falling in columns on cream, from the
// paper-ground camp of Hans's saves. Two seeded fields govern the
// fall: one sets each capsule's length, the other picks its color
// from a three-ink palette (indigo, ochre, charcoal). Where the
// length field runs high the rain stretches; where it sags the
// capsules shrink to dashes and the gaps widen. No two columns share
// a rhythm because the fields are sampled, never repeated (brief
// concept 8, capsule rain).

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '8', 10) || 8;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f0e9d8';
const INKS = ['#2b3a67', '#33302a', '#c98f2e'];   // indigo, charcoal, ochre

function compose(s) {
  const rnd = mulberry32(s);
  return {
    a1: 2.0 + rnd() * 2.0, a2: 3.0 + rnd() * 2.4,
    p1: rnd() * Math.PI * 2, p2: rnd() * Math.PI * 2, p3: rnd() * Math.PI * 2,
    c1: 1.6 + rnd() * 1.6, c2: 2.6 + rnd() * 2.0,
  };
}

function lenField(p, u, v) {
  return 0.5 + 0.34 * Math.sin(u * p.a1 * Math.PI * 2 + p.p1) * Math.sin(v * p.a2 * Math.PI + p.p2)
           + 0.16 * Math.sin((u + v) * 7.0 + p.p3);
}

function measure(p) {
  let mn = 1, mx = 0;
  for (let i = 0; i <= 20; i++) for (let j = 0; j <= 20; j++) {
    const f = lenField(p, i / 20, j / 20);
    if (f < mn) mn = f;
    if (f > mx) mx = f;
  }
  return mx - mn;
}

function buildPiece(baseSeed) {
  let best = null, bestScore = -1;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    const m = measure(p);
    if (m > bestScore) { bestScore = m; best = p; }
    if (m > 0.55) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;
  const unit = Math.min(RX, RY);

  const cols = 92;
  const colW = RX / cols;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1.2, unit / 300);
  const jrnd = mulberry32((seed ^ 0x1b56c4) >>> 0);
  for (let i = 0; i < cols; i++) {
    const u = (i + 0.5) / cols;
    let y = -jrnd() * unit * 0.03;
    while (y < RY) {
      const v = y / RY;
      const f = Math.max(0.08, lenField(p, u, Math.max(0, v)));
      const len = unit * 0.012 * (0.35 + f * 1.5);
      const cf = 0.5 + 0.5 * Math.sin(u * p.c1 * Math.PI * 2 + v * p.c2 * Math.PI + p.p3 * 2.0);
      const ci = cf < 0.42 ? 0 : (cf > 0.68 ? 2 : 1);
      ctx.strokeStyle = INKS[ci];
      ctx.globalAlpha = 0.82;
      ctx.beginPath();
      ctx.moveTo(ox + u * RX, oy + y);
      ctx.lineTo(ox + u * RX, oy + y + len);
      ctx.stroke();
      y += len + unit * 0.012 * (1.6 - f * 1.1) + jrnd() * unit * 0.004;
    }
  }
  ctx.globalAlpha = 1;
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
