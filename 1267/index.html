<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vacuum Topography</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #22242A; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded integer hash, deterministic, no Math.random anywhere.
  function hash(n) {
    var x = (n * 2654435761) >>> 0;
    x ^= x >>> 13; x = (x * 1274126177) >>> 0; x ^= x >>> 16;
    return (x >>> 0) / 4294967295;
  }

  var ALUM = '#B9BEC4', GRAPH = '#3B3D40', SHEEN = '#D8DDE2',
      SHADOW = '#22242A', SEAM = '#A03A2E';

  // Terrain profile: base undulation plus three object bumps (frame, shoe, book).
  // Objects live at fixed fractions of width so they read at any size.
  var OBJECTS = [
    { x: 0.20, w: 0.22, h: 0.26, kind: 'frame' },
    { x: 0.50, w: 0.26, h: 0.20, kind: 'shoe' },
    { x: 0.78, w: 0.20, h: 0.28, kind: 'book' }
  ];

  function baseHeight(u) {
    // u in [0,1] across the width. Gentle lumps, never generic noise.
    var h = 0.40
      + 0.06 * Math.sin(u * 5.1 + 0.7)
      + 0.04 * Math.sin(u * 11.3 + 2.1)
      + 0.02 * Math.sin(u * 23.7 + 4.4);
    for (var i = 0; i < OBJECTS.length; i++) {
      var o = OBJECTS[i];
      var d = (u - o.x) / o.w;
      h += o.h * Math.exp(-d * d * 2.0);
    }
    return h;
  }

  // Pack/seal/release cycle, 24 s, closed form over cycle time.
  // 0-6 s relaxed, 6-12 compress, 12-18 sealed hold, 18-24 spring release.
  function compressAt(t) {
    var c = t % 24;
    if (c < 6) return 0;
    if (c < 12) { var k = (c - 6) / 6; return k * k * (3 - 2 * k); }
    if (c < 18) return 1;
    var r = (c - 18) / 6;
    return Math.max(0, Math.cos(r * Math.PI * 0.5) * (1 + 0.18 * Math.sin(r * Math.PI * 3) * (1 - r)));
  }

  // Drag dimples: recorded drag list, closed form. Each drag is
  // {x (fraction), t0 (start), t1 (end), depth}. While dragging the dimple
  // deepens with dragged distance; after release it breathes back over 4 s.
  var drags = [];
  var cur = null;

  function dimpleAt(u, t) {
    var d = 0;
    for (var i = 0; i < drags.length; i++) {
      var g = drags[i];
      var dd = (u - g.x) / 0.09;
      var shape = Math.exp(-dd * dd * 2.5);
      var amp;
      if (t < g.t1) amp = g.depth * Math.min(1, (t - g.t0) / 0.4);
      else {
        var rt = (t - g.t1) / 4;
        amp = rt >= 1 ? 0 : g.depth * (1 - rt) * (1 + 0.25 * Math.sin(rt * Math.PI * 2));
      }
      d += amp * shape;
    }
    return Math.min(d, 0.85);
  }

  function profileHeight(u, t) {
    var h = baseHeight(u);
    var c = compressAt(t);
    // Compression presses the relief down along the vertical axis and
    // tightens the field slightly toward the middle.
    var uc = 0.5 + (u - 0.5) * (1 - 0.08 * c);
    h = baseHeight(uc) * (1 - 0.55 * c);
    h *= (1 - dimpleAt(u, t));
    return h;
  }

  function draw(t) {
    var vw = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport.width : window.innerWidth;
    var vh = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport.height : window.innerHeight;
    var W = Math.max(1, Math.round(vw)), H = Math.max(1, Math.round(vh));
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = SHADOW;
    ctx.fillRect(0, 0, W, H);

    // Low horizon: sky is the upper third, terrain the lower two-thirds.
    var horizon = H * 0.34;
    var terrH = H - horizon;
    var c = compressAt(t);

    // Terrain silhouette, as a reusable path.
    var N = 120;
    function terrainPath() {
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (var i = 0; i <= N; i++) {
        var u = i / N;
        var y = horizon + terrH * (1 - profileHeight(u, t));
        if (i === 0) ctx.lineTo(0, y); else ctx.lineTo(u * W, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
    }
    terrainPath();
    ctx.fillStyle = ALUM;
    ctx.fill();

    // Everything below is clipped to the terrain so sheen and wash never
    // float in the sky.
    ctx.save();
    terrainPath();
    ctx.clip();

    // Graphite wash: strata bands following the profile, flat alpha shapes.
    ctx.fillStyle = GRAPH;
    for (var s = 0; s < 4; s++) {
      var off = 0.10 + s * 0.20;
      ctx.globalAlpha = 0.16 + 0.05 * s;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (var j = 0; j <= N; j++) {
        var u2 = j / N;
        var y2 = horizon + terrH * (1 - profileHeight(u2, t) * (1 - off)) + off * terrH * 0.35;
        if (y2 > H) y2 = H;
        if (j === 0) ctx.lineTo(0, y2); else ctx.lineTo(u2 * W, y2);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Bag sheen: flat light alpha ellipses laid over the terrain.
    ctx.fillStyle = SHEEN;
    var sheens = [
      { x: 0.22, y: 0.62, rx: 0.20, ry: 0.05, a: 0.20 },
      { x: 0.58, y: 0.74, rx: 0.26, ry: 0.06, a: 0.16 },
      { x: 0.84, y: 0.58, rx: 0.14, ry: 0.04, a: 0.22 }
    ];
    for (var k = 0; k < sheens.length; k++) {
      var sh = sheens[k];
      ctx.globalAlpha = sh.a * (1 - 0.3 * c);
      ctx.beginPath();
      ctx.moveTo(sh.x * W + sh.rx * W, sh.y * H);
      ctx.ellipse(sh.x * W, sh.y * H, sh.rx * W, sh.ry * H, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // Packed objects, clipped to the terrain so they read as effects
    // pressed UNDER the bag surface, never floating above the crest.
    ctx.save();
    terrainPath();
    ctx.clip();
    for (var m = 0; m < OBJECTS.length; m++) {
      var o = OBJECTS[m];
      var cx = o.x * W;
      var top = horizon + terrH * (1 - profileHeight(o.x, t));
      var ow = o.w * W, oh = terrH * 0.16 * (1 - 0.4 * c);
      if (o.kind === 'frame') {
        var fy = top + oh * 0.25;
        ctx.strokeStyle = GRAPH; ctx.lineWidth = Math.max(2, W * 0.006);
        ctx.strokeRect(cx - ow * 0.5, fy - oh * 0.5, ow, oh);
        ctx.strokeStyle = SEAM; ctx.lineWidth = Math.max(1, W * 0.002);
        ctx.strokeRect(cx - ow * 0.32, fy - oh * 0.28, ow * 0.64, oh * 0.56);
        ctx.fillStyle = GRAPH;
        ctx.fillRect(cx - ow * 0.32, fy - oh * 0.28, ow * 0.64, Math.max(1, H * 0.004));
      } else if (o.kind === 'shoe') {
        // Flattened shoe in profile: sole along the crest, low upper.
        var sy = top + oh * 0.45;
        ctx.fillStyle = GRAPH;
        ctx.beginPath();
        ctx.moveTo(cx - ow * 0.5, sy);
        ctx.lineTo(cx + ow * 0.5, sy);
        ctx.lineTo(cx + ow * 0.5, sy - oh * 0.18);
        ctx.lineTo(cx + ow * 0.22, sy - oh * 0.55);
        ctx.lineTo(cx - ow * 0.10, sy - oh * 0.50);
        ctx.lineTo(cx - ow * 0.34, sy - oh * 0.22);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = SEAM;
        ctx.fillRect(cx - ow * 0.5, sy, ow, Math.max(1, H * 0.005));
      } else if (o.kind === 'book') {
        var by = top + oh * 0.30;
        ctx.fillStyle = GRAPH;
        ctx.fillRect(cx - ow * 0.5, by - oh * 0.5, ow, oh);
        ctx.fillStyle = ALUM;
        ctx.fillRect(cx - ow * 0.42, by - oh * 0.38, ow * 0.84, oh * 0.76);
        ctx.strokeStyle = GRAPH; ctx.lineWidth = Math.max(1, W * 0.002);
        ctx.beginPath();
        ctx.moveTo(cx - ow * 0.42, by - oh * 0.10);
        ctx.lineTo(cx + ow * 0.42, by - oh * 0.10);
        ctx.moveTo(cx - ow * 0.42, by + oh * 0.14);
        ctx.lineTo(cx + ow * 0.42, by + oh * 0.14);
        ctx.stroke();
        ctx.fillStyle = SEAM;
        ctx.fillRect(cx - ow * 0.5, by - oh * 0.5, Math.max(2, W * 0.004), oh);
      }
    }
    ctx.restore();

    // Vacuum-bag seams: one long red stitch along the terrain crest line.
    ctx.strokeStyle = SEAM; ctx.lineWidth = Math.max(1, W * 0.0025);
    ctx.setLineDash([Math.max(4, W * 0.008), Math.max(4, W * 0.008)]);
    ctx.beginPath();
    for (var p = 0; p <= N; p++) {
      var u3 = p / N;
      var y3 = horizon + terrH * (1 - profileHeight(u3, t)) + terrH * 0.03;
      if (p === 0) ctx.moveTo(0, y3); else ctx.lineTo(u3 * W, y3);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Pointer: drag compresses a region; release breathes back.
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    var x = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
    return (x - r.left) / Math.max(1, r.width);
  }
  var T0 = 0, started = false, startTime = 0;
  function now() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return Date.now() / 1000;
  }
  function pieceTime() { return started ? (now() - startTime) : 0; }

  function down(e) {
    var t = pieceTime();
    cur = { x: pos(e), t0: t, t1: t, depth: 0.3, dist: 0, lx: pos(e) };
    drags.push(cur);
    if (drags.length > 6) drags.shift();
  }
  function move(e) {
    if (!cur) return;
    var x = pos(e);
    cur.dist += Math.abs(x - cur.lx); cur.lx = x;
    cur.x = x;
    cur.depth = Math.min(0.7, 0.3 + cur.dist * 1.2);
    cur.t1 = pieceTime();
  }
  function up() {
    if (!cur) return;
    cur.t1 = pieceTime();
    cur = null;
  }
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);

  function frame() {
    if (!started) { started = true; startTime = now(); }
    draw(pieceTime());
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  }
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
