<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonlight Tube</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0B0D; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// Moonlight Tube (EXPANSION #90 spencer-finch, block 1)
// The colorimeter protocol at its most condensed. One horizontal
// fluorescent tube floats centered on near-black, holding the exact
// color of a full moon over Luna County, New Mexico: a high-CRI white
// core wrapped in nine translucent gel bands stepping warm amber
// through cool blue to pale violet. Its light spills softly onto the
// wall behind it. Below, one quiet caption line carries the
// measurement data: place, lunar phase day, derived kelvin. The tube
// breathes through a 28-day lunar cycle compressed into 28 seconds,
// full bright at the loop start, fading to a faint ghost at the new
// moon, never fully black, and back to full. Tap the tube and it
// snaps instantly to full moon, then the cycle resumes. The tube IS
// the moon: no stars, no desert, no photorealism.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  ground: '#0A0B0D',
  core: '#F4F1E6',
  amber: '#E8C37A',
  blue: '#9DB8D6',
  violet: '#C9B8E8',
  spill: '#1A1D24'
};

function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixRgb(a, b, f) {
  return [Math.round(a[0] + (b[0] - a[0]) * f),
          Math.round(a[1] + (b[1] - a[1]) * f),
          Math.round(a[2] + (b[2] - a[2]) * f)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}

var AMBER = hexRgb(COL.amber), BLUE = hexRgb(COL.blue), VIOLET = hexRgb(COL.violet);
var CORE = hexRgb(COL.core), GROUND = hexRgb(COL.ground), SPILL = hexRgb(COL.spill);

// Nine gel bands along the tube axis: bands 0..4 walk amber to blue,
// bands 4..8 walk blue to violet, band 4 is the cool blue anchor.
// Each band carries a small fixed seeded alpha jitter so the wrap
// reads hand-applied rather than printed.
var N_BANDS = 9;
var bandSeed = mulberry32(73609);
var BANDS = [];
for (var bi = 0; bi < N_BANDS; bi++) {
  var bf = bi / (N_BANDS - 1);
  var bc = bf <= 0.5 ? mixRgb(AMBER, BLUE, bf * 2) : mixRgb(BLUE, VIOLET, (bf - 0.5) * 2);
  BANDS.push({ rgb: bc, jit: 0.92 + bandSeed() * 0.16 });
}
// The glow tint is the plain average of the nine gels.
var GLOW = [0, 0, 0];
for (var gi = 0; gi < N_BANDS; gi++) {
  GLOW[0] += BANDS[gi].rgb[0]; GLOW[1] += BANDS[gi].rgb[1]; GLOW[2] += BANDS[gi].rgb[2];
}
GLOW = [Math.round(GLOW[0] / N_BANDS), Math.round(GLOW[1] / N_BANDS), Math.round(GLOW[2] / N_BANDS)];

var LOOP = 28;          // seconds: the 28-day cycle, compressed
var FLOOR = 0.08;       // the ghost never goes fully black
var K_FULL = 4200;      // kelvin at full moon
var K_NEW = 3750;       // kelvin at the ghost: dimmer reads cooler here

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var W = 0, H = 0, isPhone = false;
var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
var loopStarted = false;

var state = { cycleStart: 0 };

// QA hook: ?seed=tNN freezes the piece at loop second NN. Inert in
// the gallery, where no seed parameter is ever present.
var forcedT = -1;
(function () {
  try {
    var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(location.search || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (e) { /* no location in some shells */ }
})();

function nowSec() {
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp;
  return (now - startStamp) / 1000;
}

// Brightness is a closed-form function of loop phase: full at u=0,
// ghost at u=0.5, full again at u=1, so the loop closes seamlessly.
function brightness(u) {
  return FLOOR + (1 - FLOOR) * (0.5 + 0.5 * Math.cos(2 * Math.PI * u));
}

function rr(x, y, w, h, r) {
  if (r > w / 2) r = w / 2;
  if (r > h / 2) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function tubeGeom() {
  var base = Math.min(W, H);
  var tw = (isPhone ? base : W) * 0.70;
  var th = Math.max(14, base * 0.052);
  var cx = W / 2, cy = H * 0.44;
  return { x: cx - tw / 2, y: cy - th / 2, w: tw, h: th, cx: cx, cy: cy, base: base };
}

function draw(absT) {
  var ct = forcedT >= 0 ? forcedT : absT - state.cycleStart;
  if (ct < 0) ct = 0;
  var u = (ct % LOOP) / LOOP;
  var b = brightness(u);
  // A hair of mains shimmer, a pure function of cycle time.
  b = b * (1 + 0.008 * Math.sin(ct * 7.3) * b);

  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, 0, W, H);

  var g = tubeGeom();

  // Wall spill: layered flat rectangles of the spill tone, widest
  // and faintest first, scaling with brightness. No gradients.
  var spillSteps = 6;
  for (var si = spillSteps; si >= 1; si--) {
    var sf = si / spillSteps;
    ctx.fillStyle = rgba(SPILL, 0.16 * b * (1.15 - sf * 0.55));
    rr(g.cx - g.w * (0.60 + sf * 0.10), g.cy - g.h * (2.2 + sf * 2.6),
       g.w * (1.20 + sf * 0.20), g.h * (4.4 + sf * 5.2), g.h * (1.6 + sf * 1.8));
    ctx.fill();
  }
  // Gel glow hugging the tube: layered alpha of the averaged gel.
  for (var li = 3; li >= 1; li--) {
    ctx.fillStyle = rgba(GLOW, 0.05 * b * li);
    rr(g.x - g.h * li * 0.9, g.y - g.h * li * 0.9,
       g.w + g.h * li * 1.8, g.h + g.h * li * 1.8, g.h * (0.5 + li * 0.9));
    ctx.fill();
  }

  // The tube body: the moon-white core at alpha = brightness over
  // the dark ground, which dims it exactly like a dimming tube.
  rr(g.x, g.y, g.w, g.h, g.h / 2);
  ctx.fillStyle = rgba(mixRgb(GROUND, CORE, Math.max(b, 0.02)), 1);
  ctx.fill();

  // Nine flat gel bands clipped to the tube, each translucent so
  // the core burns through, all scaled by brightness.
  ctx.save();
  rr(g.x, g.y, g.w, g.h, g.h / 2);
  ctx.clip();
  var bw = g.w / N_BANDS;
  for (var k = 0; k < N_BANDS; k++) {
    ctx.fillStyle = rgba(BANDS[k].rgb, 0.52 * b * BANDS[k].jit);
    ctx.fillRect(g.x + k * bw - 0.5, g.y, bw + 1, g.h);
  }
  // A slim bright spine along the core, the filament line.
  ctx.fillStyle = rgba(CORE, 0.35 * b);
  ctx.fillRect(g.x, g.cy - g.h * 0.10, g.w, g.h * 0.20);
  ctx.restore();

  // Caption: the measurement data only. Place, lunar phase day,
  // derived kelvin. No calendar date, no clock.
  var day = Math.floor(u * 28);
  var kelvin = Math.round((K_NEW + (K_FULL - K_NEW) * ((b - FLOOR) / (1 - FLOOR))) / 10) * 10;
  var caption = 'LUNA COUNTY, NEW MEXICO  ·  DAY ' + day + '  ·  ' + kelvin + ' K';
  var fs = Math.max(10, Math.round(g.base * 0.021));
  ctx.font = fs + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = rgba(CORE, 0.34 + 0.30 * b);
  ctx.fillText(caption, g.cx, g.y + g.h * 3.1);
}

function resize() {
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = Math.round(vw);
  H = Math.round(vh);
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  if (forcedT >= 0) {
    draw(forcedT);
  } else if (loopStarted) {
    draw(nowSec());
  } else {
    draw(0);
  }
}

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (window.addEventListener) window.addEventListener('resize', resize);

if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    if (forcedT >= 0) return;
    var x = e.clientX, y = e.clientY;
    if (typeof x !== 'number' || typeof y !== 'number') return;
    // Tap the tube (generously): snap to full moon, resume cycle.
    var g = tubeGeom();
    if (x >= g.x - g.h && x <= g.x + g.w + g.h &&
        y >= g.y - g.h * 2.2 && y <= g.y + g.h * 3.2) {
      state.cycleStart = nowSec();
      draw(nowSec());
    }
  });
}

resize();

if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
  loopStarted = true;
  var loop = function () {
    draw(nowSec());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
