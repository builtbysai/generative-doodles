<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Finder of Wonders</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #d9d9d9; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- viewport (Visual Viewport API, with fallbacks) ----------
  var W = 0, H = 0, DPR = 1;
  function measure() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : (window.innerWidth || 800);
    var h = vv ? vv.height : (window.innerHeight || 800);
    W = Math.max(50, Math.round(w));
    H = Math.max(50, Math.round(h));
    DPR = Math.min(2, window.devicePixelRatio || 1);
  }
  function fit() {
    measure();
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); });
  }
  window.addEventListener('resize', function () { fit(); });
  window.addEventListener('orientationchange', function () { fit(); });

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : 0;
      var sh = window.screen ? window.screen.height : 0;
      var mn = Math.min(sw, sh);
      if (mn > 0 && mn < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- catalogue: 4 families x 3 subfolders, each a real generator ----------
  var FAMILIES = [
    { name: 'DOTS',     subs: ['Sparse', 'Drifting', 'Dense'] },
    { name: 'LINES',    subs: ['Threads', 'Crossings', 'Ribbons'] },
    { name: 'FIELDS',   subs: ['Dusk', 'Meadow', 'Mono'] },
    { name: 'CURRENTS', subs: ['Breeze', 'Rapids', 'Deep'] }
  ];
  var BASE_SEED = 20261117;
  var sel = { fam: 0, sub: 0 };           // frame one: DOTS / Sparse

  function worldSeed(fam, sub) {
    return (BASE_SEED + Math.imul(fam + 1, 100003) + Math.imul(sub + 1, 7919)) | 0;
  }

  // ---------- layout (shared by draw + hit-testing) ----------
  function layout() {
    var phone = isPhone();
    var tbH = phone ? 26 : 30;            // title bar height
    var sbW = phone ? 112 : 198;          // sidebar width
    var bcH = phone ? 24 : 28;            // breadcrumb bar height
    var rows = [];
    var y = tbH + (phone ? 20 : 24);      // below the WONDERS section header
    for (var i = 0; i < FAMILIES.length; i++) {
      rows.push({ type: 'folder', fam: i, x: 0, y: y, w: sbW, h: phone ? 25 : 27 });
      y += phone ? 25 : 27;
      if (i === sel.fam) {
        for (var j = 0; j < 3; j++) {
          rows.push({ type: 'sub', fam: i, sub: j, x: 0, y: y, w: sbW, h: phone ? 21 : 23 });
          y += phone ? 21 : 23;
        }
      }
    }
    return {
      phone: phone, tbH: tbH, sbW: sbW, bcH: bcH, rows: rows,
      pane: { x: sbW, y: tbH + bcH, w: W - sbW, h: H - tbH - bcH }
    };
  }

  // ---------- small path helpers (no roundRect dependency) ----------
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function folderIcon(x, y, s, body, tab) {
    // tiny drawn folder: back tab + body, s ~ width in px
    var w = s, h = s * 0.78;
    ctx.fillStyle = tab;
    ctx.fillRect(x, y, w * 0.45, h * 0.28);
    ctx.fillStyle = body;
    rrect(x, y + h * 0.18, w, h * 0.82, 1.5);
    ctx.fill();
  }

  // ---------- the four worlds (all closed-form in t, re-derived from seed) ----------
  function clipPane(R) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(R.x, R.y, R.w, R.h);
    ctx.clip();
  }

  function drawDots(R, t, sub) {
    var conf = [
      { n: 90,  pal: ['#5B7C99', '#7E97AC', '#42617D', '#97AABD'], amp: 0.030, sp: 0.7, rMax: 3.4 },
      { n: 180, pal: ['#8A7F72', '#A89A88', '#6E6257', '#BFB2A0'], amp: 0.055, sp: 1.5, rMax: 3.0 },
      { n: 430, pal: ['#2E7D6B', '#4C9A86', '#79B8A6', '#1F5D50'], amp: 0.022, sp: 0.9, rMax: 2.3 }
    ][sub];
    ctx.fillStyle = '#FBFBF9';
    ctx.fillRect(R.x, R.y, R.w, R.h);
    var rng = mulberry32(worldSeed(0, sub));
    var dots = [];
    for (var i = 0; i < conf.n; i++) {
      dots.push({
        bx: rng(), by: rng(), d: 0.25 + rng() * 0.75,
        p: rng() * Math.PI * 2, p2: rng() * Math.PI * 2,
        col: conf.pal[(rng() * conf.pal.length) | 0]
      });
    }
    dots.sort(function (a, b) { return a.d - b.d; });
    var sway = sub === 1 ? Math.sin(t * 0.07) * 0.018 : 0;
    for (var k = 0; k < dots.length; k++) {
      var o = dots[k];
      var fx = o.bx + Math.sin(t * 0.13 * conf.sp * (0.5 + o.d) + o.p) * conf.amp + sway;
      var fy = o.by + Math.cos(t * 0.10 * conf.sp * (0.5 + o.d) + o.p2) * conf.amp * 0.8;
      var x = R.x + fx * R.w, y = R.y + fy * R.h;
      ctx.globalAlpha = 0.30 + 0.70 * o.d;
      ctx.fillStyle = o.col;
      ctx.beginPath();
      ctx.arc(x, y, 0.8 + o.d * conf.rMax, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawLines(R, t, sub) {
    ctx.fillStyle = '#FAFAF7';
    ctx.fillRect(R.x, R.y, R.w, R.h);
    var rng = mulberry32(worldSeed(1, sub));
    var i, k, u;
    if (sub === 1) {
      // Crossings: two families of wavy lines weaving over/under each other
      var rows = 11, cols = 9;
      for (i = 0; i < rows; i++) {
        var by = rng(), ph = rng() * 6.28, amp = 6 + rng() * 12, fr = 2 + rng() * 2;
        ctx.strokeStyle = i % 2 ? '#37586E' : '#7A4A3A';
        ctx.globalAlpha = 0.55; ctx.lineWidth = 1.3;
        ctx.beginPath();
        for (k = 0; k <= 60; k++) {
          u = k / 60;
          var x = R.x + u * R.w;
          var y = R.y + by * R.h + Math.sin(u * Math.PI * fr + ph + t * 0.35) * amp;
          if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      for (i = 0; i < cols; i++) {
        var bx = rng(), ph2 = rng() * 6.28, amp2 = 6 + rng() * 12, fr2 = 2 + rng() * 2;
        ctx.strokeStyle = i % 2 ? '#7A4A3A' : '#37586E';
        ctx.globalAlpha = 0.55; ctx.lineWidth = 1.3;
        ctx.beginPath();
        for (k = 0; k <= 60; k++) {
          u = k / 60;
          var y2 = R.y + u * R.h;
          var x2 = R.x + bx * R.w + Math.cos(u * Math.PI * fr2 + ph2 + t * 0.30) * amp2;
          if (k === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      return;
    }
    // Threads / Ribbons: closed Lissajous loops that morph as t advances
    var conf = sub === 0
      ? { n: 26, lw: 1.1, alpha: 0.50, pal: ['#2F4858', '#33658A', '#758E4F', '#BC4B51'] }
      : { n: 9,  lw: 5.0, alpha: 0.26, pal: ['#5E548E', '#9F86C0', '#BE95C4', '#E0B1CB'] };
    for (i = 0; i < conf.n; i++) {
      var cx = R.x + (0.18 + rng() * 0.64) * R.w;
      var cy = R.y + (0.18 + rng() * 0.64) * R.h;
      var rx = (0.08 + rng() * 0.16) * R.w;
      var ry = (0.08 + rng() * 0.16) * R.h;
      var a = 1 + ((rng() * 3) | 0), b = 1 + ((rng() * 3) | 0);
      var d1 = rng() * Math.PI * 2, d2 = rng() * Math.PI * 2;
      var om = 0.10 + rng() * 0.22;
      ctx.strokeStyle = conf.pal[(rng() * conf.pal.length) | 0];
      ctx.globalAlpha = conf.alpha;
      ctx.lineWidth = conf.lw;
      ctx.beginPath();
      for (k = 0; k <= 72; k++) {
        var th = (k / 72) * Math.PI * 2;
        var px = cx + rx * Math.sin(a * th + d1 + t * om);
        var py = cy + ry * Math.sin(b * th + d2 + t * om * 0.6);
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawFields(R, t, sub) {
    var pal = [
      ['#2E2A4F', '#57406B', '#8A5A72', '#C97B5D', '#E8A15C', '#F2C185'],
      ['#DDE8C8', '#A8C686', '#6FA287', '#3E7C59', '#265C46', '#173F30'],
      ['#EDEDED', '#CFCFCF', '#AFAFAF', '#8A8A8A', '#5F5F5F', '#333333']
    ][sub];
    var rng = mulberry32(worldSeed(2, sub));
    var fr = [], acc = 0, i;
    for (i = 0; i < pal.length; i++) { var f = 0.10 + rng() * 0.14; fr.push(f); acc += f; }
    for (i = 0; i < pal.length; i++) fr[i] /= acc;
    var yTop = R.y;
    for (i = 0; i < pal.length; i++) {
      var breathe = Math.sin(t * 0.22 + i * 1.35) * R.h * 0.012;
      var yBot = (i === pal.length - 1) ? (R.y + R.h) : (R.y + (fr.slice(0, i + 1).reduce(function (s, v) { return s + v; }, 0)) * R.h + breathe);
      ctx.fillStyle = pal[i];
      ctx.fillRect(R.x, yTop, R.w, yBot - yTop + 1);
      yTop = yBot;
    }
  }

  function drawCurrents(R, t, sub) {
    var conf = [
      { bg: '#F7FAFA', pal: ['#1F7A8C', '#2A9D8F', '#57B8A2', '#155E6B'], curl: 1.4, sp: 0.6, n: 42, steps: 46 },
      { bg: '#FBF8F4', pal: ['#C1502E', '#E07A3F', '#D9A441', '#8C3B23'], curl: 2.6, sp: 1.3, n: 36, steps: 52 },
      { bg: '#10222E', pal: ['#7FD1E8', '#4FA8C9', '#BFE9F5', '#2E7FA3'], curl: 1.1, sp: 0.4, n: 40, steps: 50 }
    ][sub];
    ctx.fillStyle = conf.bg;
    ctx.fillRect(R.x, R.y, R.w, R.h);
    var rng = mulberry32(worldSeed(3, sub));
    var sc = Math.min(R.w, R.h) / 90;      // step length scales with pane
    for (var i = 0; i < conf.n; i++) {
      var x = R.x + rng() * R.w;
      var y = R.y + rng() * R.h;
      ctx.strokeStyle = conf.pal[(rng() * conf.pal.length) | 0];
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (var k = 0; k < conf.steps; k++) {
        var ang = conf.curl * Math.sin(x * 0.008 + t * 0.10 * conf.sp + i)
                + conf.curl * Math.cos(y * 0.006 - t * 0.07 * conf.sp)
                + 0.8 * Math.sin((x + y) * 0.003 + t * 0.05 * conf.sp);
        x += Math.cos(ang) * sc;
        y += Math.sin(ang) * sc;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  var WORLDS = [drawDots, drawLines, drawFields, drawCurrents];

  // ---------- draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';    // pin CSS size (house rule)
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var L = layout();
    var phone = L.phone;

    // window body
    ctx.fillStyle = '#ECECEC';
    ctx.fillRect(0, 0, W, H);

    // ----- title bar -----
    ctx.fillStyle = '#ECECEC';
    ctx.fillRect(0, 0, W, L.tbH);
    ctx.fillStyle = '#C9C9C9';
    ctx.fillRect(0, L.tbH - 1, W, 1);
    var cols = ['#FF5F57', '#FEBC2E', '#28C840'];
    for (var ci = 0; ci < 3; ci++) {
      ctx.fillStyle = cols[ci];
      ctx.beginPath();
      ctx.arc(16 + ci * 20, L.tbH / 2, phone ? 5 : 6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#555555';
    ctx.font = '600 ' + (phone ? 12 : 13) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Wonders', W / 2, L.tbH / 2 + 0.5);
    ctx.textAlign = 'left';

    // ----- sidebar -----
    ctx.fillStyle = '#F4F4F4';
    ctx.fillRect(0, L.tbH, L.sbW, H - L.tbH);
    ctx.fillStyle = '#D9D9D9';
    ctx.fillRect(L.sbW - 1, L.tbH, 1, H - L.tbH);
    ctx.fillStyle = '#8E8E93';
    ctx.font = '600 ' + (phone ? 9 : 10) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
    ctx.fillText('WONDERS', 12, L.tbH + (phone ? 11 : 13));

    for (var ri = 0; ri < L.rows.length; ri++) {
      var row = L.rows[ri];
      var isSel = (row.type === 'folder' && row.fam === sel.fam) ||
                  (row.type === 'sub' && row.fam === sel.fam && row.sub === sel.sub);
      if (isSel) {
        ctx.fillStyle = '#0A84FF';
        rrect(row.x + 5, row.y + 1.5, row.w - 10, row.h - 3, 5);
        ctx.fill();
      }
      var cyR = row.y + row.h / 2;
      if (row.type === 'folder') {
        // disclosure triangle (drawn, points right / down)
        ctx.fillStyle = isSel ? '#FFFFFF' : '#A0A0A5';
        ctx.beginPath();
        if (row.fam === sel.fam) {
          ctx.moveTo(row.x + 8, cyR - 2.5); ctx.lineTo(row.x + 13, cyR - 2.5); ctx.lineTo(row.x + 10.5, cyR + 2.5);
        } else {
          ctx.moveTo(row.x + 8.5, cyR - 4); ctx.lineTo(row.x + 8.5, cyR + 4); ctx.lineTo(row.x + 13, cyR);
        }
        ctx.closePath(); ctx.fill();
        folderIcon(row.x + 18, cyR - (phone ? 5.5 : 6), phone ? 13 : 15, '#79B5E0', '#5E9BCB');
        ctx.fillStyle = isSel ? '#FFFFFF' : '#333333';
        ctx.font = (phone ? '11px' : '12.5px') + ' system-ui, -apple-system, "Segoe UI", sans-serif';
        ctx.fillText(FAMILIES[row.fam].name, row.x + (phone ? 36 : 40), cyR + 0.5);
      } else {
        folderIcon(row.x + (phone ? 26 : 30), cyR - 4.5, phone ? 10 : 11.5, isSel ? '#BFD9F2' : '#A9CCE8', isSel ? '#9CC0E4' : '#8FB8DC');
        ctx.fillStyle = isSel ? '#FFFFFF' : '#444444';
        ctx.font = (phone ? '10.5px' : '11.5px') + ' system-ui, -apple-system, "Segoe UI", sans-serif';
        ctx.fillText(FAMILIES[row.fam].subs[row.sub], row.x + (phone ? 41 : 47), cyR + 0.5);
      }
    }

    // ----- breadcrumb -----
    var bcX = L.sbW;
    ctx.fillStyle = '#F7F7F7';
    ctx.fillRect(bcX, L.tbH, W - bcX, L.bcH);
    ctx.fillStyle = '#DEDEDE';
    ctx.fillRect(bcX, L.tbH + L.bcH - 1, W - bcX, 1);
    var bcY = L.tbH + L.bcH / 2 + 0.5;
    var seg = ['Wonders', FAMILIES[sel.fam].name, FAMILIES[sel.fam].subs[sel.sub]];
    ctx.font = (phone ? '10.5px' : '11.5px') + ' system-ui, -apple-system, "Segoe UI", sans-serif';
    var full = seg.join('  /  ');
    ctx.fillStyle = '#8E8E93';
    ctx.fillText(full, bcX + 12, bcY);
    var lastW = ctx.measureText(seg[2]).width;
    var fullW = ctx.measureText(full).width;
    ctx.fillStyle = '#333333';
    ctx.fillText(seg[2], bcX + 12 + (fullW - lastW), bcY);

    // ----- world pane -----
    clipPane(L.pane);
    WORLDS[sel.fam](L.pane, t, sel.sub);
    ctx.restore();
    ctx.strokeStyle = '#D9D9D9';
    ctx.strokeRect(L.pane.x + 0.5, L.pane.y + 0.5, L.pane.w - 1, L.pane.h - 1);
  }

  // ---------- interaction: tap navigates, nothing else ----------
  canvas.addEventListener('pointerdown', function (e) {
    var L = layout();
    var x = e.clientX, y = e.clientY;
    for (var i = 0; i < L.rows.length; i++) {
      var r = L.rows[i];
      if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) {
        if (r.type === 'folder') {
          if (r.fam !== sel.fam) { sel.fam = r.fam; sel.sub = 0; }
        } else {
          sel.sub = r.sub;
        }
        return;
      }
    }
  });

  // ---------- run: deterministic first frame, then guarded rAF ----------
  var PHASE = 7.3;                        // fixed phase: DOTS world already mid-drift
  fit();
  draw(PHASE);
  var t0 = null;
  function frame(ts) {
    if (t0 === null) t0 = ts;
    draw(PHASE + (ts - t0) / 1000);
    if (typeof window.requestAnimationFrame === 'function') {
      window.requestAnimationFrame(frame);
    }
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
