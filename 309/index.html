<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.309 Arcane Inventory</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#2A2018; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var SHELF='#2A2018', PARCH='#E8DCC3', INK='#1C1A16', GOLD='#C9A227';
var RUST='#8A4A2E', CELADON='#9DBEA3', COBALT='#2B5EA7', CREAM='#F2EAD8';
var DW=1280, DH=900, W=0, H=0, phone=false, S=1, OX=0, OY=0;
var T=0, lastNow=-1, acc=0, TICK=1/60;

// Exactly 5 vessel form definitions (asserted)
var FORMS=['cauldron','potion bottle','pumpkin jar','faceted gem box','wizard tower'];
if(FORMS.length!==5) throw new Error('Arcane Inventory needs exactly 5 vessel forms');

// Authored rotation: form index, glaze, rarity, usage, vignettes
var ISSUES=[
 {f:0,g:RUST, r:'Rarity: Scarce, faintly warm', u:'Usage: strictly for research', v:['Wizard: consulted it before dawn','Rogue: borrowed it, returned it','Warlock: denies knowing it at all']},
 {f:1,g:COBALT, r:'Rarity: One known bottling', u:'Usage: one drop, then stop', v:['Wizard: labelled it twice, still wary','Rogue: traded it for a quiet exit','Warlock: keeps it corked at all times']},
 {f:2,g:CELADON, r:'Rarity: Harvest issue only', u:'Usage: store small certainties', v:['Wizard: keeps spare keys inside it','Rogue: hid a map inside the lid','Warlock: whispers to it on Tuesdays']},
 {f:3,g:CREAM, r:'Rarity: Cut in a single batch', u:'Usage: hold light, not secrets', v:['Wizard: set it where the sun lands','Rogue: counted its facets twice','Warlock: refuses to open it indoors']},
 {f:4,g:RUST, r:'Rarity: Standing since records', u:'Usage: watch from a safe desk', v:['Wizard: takes notes from its window','Rogue: uses its shadow to slip past','Warlock: claims the top room already']},
 {f:0,g:COBALT, r:'Rarity: Second firing, rarer', u:'Usage: strictly for research', v:['Wizard: stirs it counter-clockwise','Rogue: warmed both hands on it','Warlock: signed the log, then left']},
 {f:1,g:CELADON, r:'Rarity: Mislabelled, now prized', u:'Usage: dilute before discussing', v:['Wizard: diluted it, discussed it anyway','Rogue: pocketed the spare cork','Warlock: hears fizzing after midnight']},
 {f:2,g:RUST, r:'Rarity: Ribbed, one of twelve', u:'Usage: seasonal rites only', v:['Wizard: marks the season by its weight','Rogue: rolled it once, very quietly','Warlock: plants a candle beside it']},
 {f:3,g:COBALT, r:'Rarity: Deep cut, cold to touch', u:'Usage: keep facets to the light', v:['Wizard: reads weather in its faces','Rogue: signalled with it from a roof','Warlock: will not look at it directly']},
 {f:4,g:CREAM, r:'Rarity: Tallest of the set', u:'Usage: one occupant, maximum', v:['Wizard: posted a tiny notice outside','Rogue: climbed it, regrets nothing','Warlock: pays it rent in riddles']},
 {f:0,g:CELADON, r:'Rarity: Pale and unhurried', u:'Usage: rest potions overnight', v:['Wizard: lets it cool before questions','Rogue: left it a thank-you note','Warlock: circles it once before bed']},
 {f:1,g:RUST, r:'Rarity: Corked under pressure', u:'Usage: shake only if certain', v:['Wizard: shook it once in 1941','Rogue: shakes it to check for coins','Warlock: already knows what is inside']}
];
if(ISSUES.length<9) throw new Error('need authored rotation');

// Exactly 3 vessels on shelf (asserted)
var slots=[
 {issue:0, plate:41, anim:-10, oldIssue:0, oldPlate:41},
 {issue:1, plate:42, anim:-10, oldIssue:1, oldPlate:42},
 {issue:2, plate:43, anim:-10, oldIssue:2, oldPlate:43}
];
if(slots.length!==3) throw new Error('Arcane Inventory needs exactly 3 vessels on shelf');
var nextIssue=3, nextPlate=44;
var panelIssue=0, panelStart=-99; // frame one fully typed
var SLOTX=[320,640,960], BASE=512;

function seeded(i,k){ var x=Math.sin(i*127.1+k*311.7)*43758.5453; return x-Math.floor(x); }
// dust motes
var MOTES=[]; for(var mi=0; mi<42; mi++){ MOTES.push({x:80+seeded(mi,1)*1120, y:90+seeded(mi,2)*560, r:1+seeded(mi,3)*2.2, p:seeded(mi,4)*6.28, s:0.3+seeded(mi,5)*0.7}); }

function drawVessel(form, glaze, cx, base, alpha){
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.translate(cx, base);
  // shadow ellipse
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0,6,88,14,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=glaze; ctx.strokeStyle=INK; ctx.lineWidth=5; ctx.lineJoin='round';
  ctx.beginPath();
  if(form===0){ // cauldron
    ctx.moveTo(-78,-118); ctx.bezierCurveTo(-92,-52,-62,-8,0,-6); ctx.bezierCurveTo(62,-8,92,-52,78,-118); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle=glaze; ctx.beginPath(); ctx.ellipse(0,-120,82,20,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#141010'; ctx.beginPath(); ctx.ellipse(0,-122,64,13,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=GOLD; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(0,-112,78,17,0,0.15,Math.PI-0.15); ctx.stroke();
    ctx.fillStyle=INK; ctx.fillRect(-58,-4,16,10); ctx.fillRect(42,-4,16,10);
  } else if(form===1){ // potion bottle
    ctx.moveTo(-52,-78); ctx.bezierCurveTo(-70,-30,-48,-6,0,-6); ctx.bezierCurveTo(48,-6,70,-30,52,-78); ctx.bezierCurveTo(38,-96,22,-100,20,-128); ctx.lineTo(-20,-128); ctx.bezierCurveTo(-22,-100,-38,-96,-52,-78); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#C9BBA8'; ctx.fillRect(-16,-162,32,36); ctx.strokeRect(-16,-162,32,36);
    ctx.strokeStyle=GOLD; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-20,-126); ctx.lineTo(20,-126); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(-22,-52,10,26,0.3,0,Math.PI*2); ctx.fill();
  } else if(form===2){ // pumpkin jar
    ctx.moveTo(0,-138); ctx.bezierCurveTo(70,-138,88,-92,78,-48); ctx.bezierCurveTo(68,-10,36,-4,0,-4); ctx.bezierCurveTo(-36,-4,-68,-10,-78,-48); ctx.bezierCurveTo(-88,-92,-70,-138,0,-138); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='rgba(28,26,22,0.55)'; ctx.lineWidth=3;
    [-48,-24,24,48].forEach(function(dx){ ctx.beginPath(); ctx.moveTo(dx*0.6,-132); ctx.bezierCurveTo(dx,-90,dx,-50,dx*0.55,-10); ctx.stroke(); });
    ctx.fillStyle='#5A4632'; ctx.fillRect(-8,-160,16,24); ctx.strokeRect(-8,-160,16,24);
    ctx.strokeStyle=GOLD; ctx.beginPath(); ctx.moveTo(-70,-108); ctx.quadraticCurveTo(0,-92,70,-108); ctx.stroke();
  } else if(form===3){ // faceted gem box
    ctx.moveTo(-76,-84); ctx.lineTo(76,-84); ctx.lineTo(62,-6); ctx.lineTo(-62,-6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-76,-84); ctx.lineTo(-38,-128); ctx.lineTo(38,-128); ctx.lineTo(76,-84); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='rgba(28,26,22,0.5)'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(0,-128); ctx.lineTo(0,-6); ctx.moveTo(-38,-128); ctx.lineTo(-20,-6); ctx.moveTo(38,-128); ctx.lineTo(20,-6); ctx.stroke();
    ctx.strokeStyle=GOLD; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-76,-84); ctx.lineTo(76,-84); ctx.stroke();
    ctx.fillStyle=GOLD; ctx.beginPath(); ctx.arc(0,-84,7,0,Math.PI*2); ctx.fill();
  } else { // wizard tower
    ctx.moveTo(-46,-128); ctx.lineTo(46,-128); ctx.lineTo(58,-6); ctx.lineTo(-58,-6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle=INK; ctx.beginPath(); ctx.moveTo(-62,-128); ctx.lineTo(0,-182); ctx.lineTo(62,-128); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle=GOLD; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-62,-128); ctx.lineTo(62,-128); ctx.stroke();
    ctx.fillStyle='#F2B45C'; ctx.fillRect(-10,-104,20,28); ctx.strokeRect(-10,-104,20,28);
    ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(0,-18,13,Math.PI,0); ctx.lineTo(13,-6); ctx.lineTo(-13,-6); ctx.closePath(); ctx.fill();
  }
  // gold sparkle enchantment marks
  ctx.fillStyle=GOLD;
  [[-92,-150],[94,-140],[86,-36]].forEach(function(p){ ctx.beginPath(); ctx.arc(p[0],p[1],3,0,Math.PI*2); ctx.fill(); });
  ctx.restore();
}

function plateText(issue, plate, cx){
  var it=ISSUES[issue];
  ctx.save();
  ctx.fillStyle=PARCH; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  ctx.fillRect(cx-132,532,264,118); ctx.strokeRect(cx-132,532,264,118);
  ctx.strokeStyle=GOLD; ctx.lineWidth=1.5; ctx.strokeRect(cx-126,538,252,106);
  ctx.fillStyle=INK; ctx.textAlign='center';
  ctx.font='bold 21px Georgia, "Times New Roman", serif';
  var nn=('00'+plate).slice(-3);
  ctx.fillText('Release #'+nn, cx, 566);
  ctx.font='15px Georgia, "Times New Roman", serif';
  ctx.fillText(it.r, cx, 596);
  ctx.fillText(it.u, cx, 622);
  ctx.restore();
}

function draw(){
  ctx.fillStyle=SHELF; ctx.fillRect(0,0,DW,DH);
  // back wall panel
  ctx.fillStyle='#332619'; ctx.fillRect(90,120,1100,420);
  ctx.strokeStyle='rgba(201,162,39,0.5)'; ctx.lineWidth=2; ctx.strokeRect(90,120,1100,420);
  // candle glow breathing, layered translucency, inside the shelf
  var br=0.5+0.5*Math.sin(T*0.9);
  for(var gi=0; gi<3; gi++){
    ctx.fillStyle='rgba(242,180,92,'+(0.05+0.03*br*(3-gi))+')';
    ctx.beginPath(); ctx.ellipse(150,485,26+gi*16,32+gi*20,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(1130,485,26+gi*16,32+gi*20,0,0,Math.PI*2); ctx.fill();
  }
  // shelf board
  ctx.fillStyle='#1E150E'; ctx.fillRect(70,512,1140,28);
  ctx.fillStyle=GOLD; ctx.fillRect(70,512,1140,3);
  // gold rule decoration only, no header text per spec
  ctx.fillStyle=GOLD; ctx.fillRect(520,150,240,2); ctx.fillRect(600,160,80,1);
  // dust motes
  ctx.fillStyle='rgba(232,220,195,0.55)';
  MOTES.forEach(function(m){
    var x=m.x+Math.sin(T*m.s+m.p)*18, y=m.y+Math.cos(T*m.s*0.7+m.p)*14 - ((T*6*m.s)%40);
    ctx.beginPath(); ctx.arc(x, ((y-70)%560)+70, m.r, 0, Math.PI*2); ctx.fill();
  });
  // vessels + plates
  for(var si=0; si<slots.length; si++){
    var sl=slots[si], cx=SLOTX[si], el=T-sl.anim;
    if(el>=0 && el<0.95){
      var e=el/0.95, ease=e*e*(3-2*e);
      // old eases off left
      drawVessel(ISSUES[sl.oldIssue].f, ISSUES[sl.oldIssue].g, cx-ease*300, BASE, 1-ease);
      // new slides in from right
      drawVessel(ISSUES[sl.issue].f, ISSUES[sl.issue].g, cx+(1-ease)*340, BASE, ease+0.15>1?1:ease+0.15);
      if(ease>0.5) plateText(sl.issue, sl.plate, cx); else plateText(sl.oldIssue, sl.oldPlate, cx);
    } else {
      drawVessel(ISSUES[sl.issue].f, ISSUES[sl.issue].g, cx, BASE, 1);
      plateText(sl.issue, sl.plate, cx);
    }
  }
  // Field Applications panel
  ctx.fillStyle=PARCH; ctx.fillRect(190,692,900,158);
  ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.strokeRect(190,692,900,158);
  ctx.strokeStyle=GOLD; ctx.lineWidth=1.5; ctx.strokeRect(196,698,888,146);
  ctx.fillStyle=GOLD; ctx.fillRect(560,714,160,2);
  ctx.fillStyle=INK;
  ctx.font='16px Georgia, "Times New Roman", serif'; ctx.textAlign='left';
  var vig=ISSUES[panelIssue].v;
  if(vig.length!==3) throw new Error('need exactly 3 vignettes');
  var total=vig[0].length+vig[1].length+vig[2].length;
  var reveal;
  if(panelStart<-50) reveal=total;
  else reveal=Math.min(total, Math.floor((T-panelStart)*42));
  var used=0;
  for(var vi=0; vi<3; vi++){
    var line=vig[vi], show=Math.max(0, Math.min(line.length, reveal-used));
    ctx.fillText(line.slice(0,show), 250, 762+vi*30);
    used+=line.length;
  }
}

function resize(){
  var vv=window.visualViewport;
  W=Math.round(vv?vv.width:window.innerWidth);
  H=Math.round(vv?vv.height:window.innerHeight);
  canvas.width=W; canvas.height=H;
  var sw=window.screen?window.screen.width:W, sh=window.screen?window.screen.height:H;
  phone=Math.min(sw,sh)<700 || H>W*1.15;
}
if(window.visualViewport&&window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize',resize);
window.addEventListener('resize',resize);
function toDesign(e){ var r=canvas.getBoundingClientRect(); return [((e.clientX-r.left)-OX)/S, ((e.clientY-r.top)-OY)/S]; }
canvas.addEventListener('pointerdown', function(e){
  var p=toDesign(e);
  for(var i=0;i<slots.length;i++){
    if(Math.abs(p[0]-SLOTX[i])<140 && p[1]>300 && p[1]<660){
      var sl=slots[i];
      if(T-sl.anim<1) return;
      sl.oldIssue=sl.issue; sl.oldPlate=sl.plate;
      sl.issue=nextIssue; sl.plate=nextPlate;
      nextIssue=(nextIssue+1)%ISSUES.length; nextPlate+=1;
      sl.anim=T;
      panelIssue=sl.issue; panelStart=T;
      return;
    }
  }
});
function frame(time){
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.fillStyle=SHELF; ctx.fillRect(0,0,W,H);
  S=Math.min(W/DW,H/DH); OX=(W-DW*S)/2; OY=(H-DH*S)/2;
  ctx.setTransform(S,0,0,S,OX,OY);
  var dt=0; if(lastNow>=0&&time>0) dt=Math.min(0.05,(time-lastNow)/1000); lastNow=time; acc+=dt;
  var guard=0; while(acc>=TICK&&guard<4){ T+=TICK; acc-=TICK; guard++; } if(guard===4) acc=0;
  draw();
  ctx.setTransform(1,0,0,1,0,0);
}
resize(); frame(0);
if(typeof requestAnimationFrame==='function'){ var loop=function(now){ frame(now); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
