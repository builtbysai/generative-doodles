<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.273 Crackle</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EDE7D8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.273 Crackle (Shupiwe Chongwe).
// After her naked-raku experiments: dark ceramic spheres and
// ovoids on a pale ground, each wrapped in its own voronoi
// crackle network in tan veining, dense where the piece cooled
// fast and sparse where it cooled slow. A tap re-fires the
// kiln: the networks regenerate with new densities and vein
// paths, crossfading with staggered timing per sphere, like
// cooling ceramic. The spheres themselves never move.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var BLACK = '#1C1A17', TAN = '#C9A876', GROUND = '#EDE7D8', SHADOW = '#A39A86';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 0, lastNow = -1; // frame one: the first firing is fully cooled and readable

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

// ---- voronoi crackle networks ---------------------------------------------------------
// A network is a list of segments in unit-circle space, stored
// as plain data and drawn directly each frame (no offscreen
// canvas). Seeds are scattered in the unit disc; each seed's
// cell is its seed polygon clipped by the perpendicular
// bisector against every other seed, and the cell edges that
// fall inside the disc become the veins. The cooling parameter
// sets the seed count, so dense networks cooled fast and
// sparse ones cooled slow.
function clipBisector(poly, ax, ay, bx, by) {
  // keep the side of the a/b bisector that is closer to a
  var mx = (ax + bx) / 2, my = (ay + by) / 2;
  var nx = bx - ax, ny = by - ay;
  var out = [];
  for (var i = 0; i < poly.length; i++) {
    var p = poly[i], q = poly[(i + 1) % poly.length];
    var dp = (p[0] - mx) * nx + (p[1] - my) * ny;
    var dq = (q[0] - mx) * nx + (q[1] - my) * ny;
    if (dp <= 0) out.push(p);
    if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)) {
      var f = dp / (dp - dq);
      out.push([p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f]);
    }
  }
  return out;
}
function makeVeins(seed, cool) {
  var r = rng(seed);
  var n = Math.round(9 + cool * 21); // about 11 to 29 cells
  var pts = [];
  var tries = 0;
  while (pts.length < n && tries < n * 60) {
    tries++;
    var a = r() * Math.PI * 2, rad = Math.sqrt(r()) * 0.96;
    var x = Math.cos(a) * rad, y = Math.sin(a) * rad;
    var ok = true;
    for (var k = 0; k < pts.length; k++) {
      var dx = pts[k][0] - x, dy = pts[k][1] - y;
      if (dx * dx + dy * dy < 0.012) { ok = false; break; }
    }
    if (ok) pts.push([x, y]);
  }
  var segs = [];
  for (var i = 0; i < pts.length; i++) {
    var poly = [[-1.15, -1.15], [1.15, -1.15], [1.15, 1.15], [-1.15, 1.15]];
    for (var j = 0; j < pts.length && poly.length; j++) {
      if (j === i) continue;
      poly = clipBisector(poly, pts[i][0], pts[i][1], pts[j][0], pts[j][1]);
    }
    for (var e = 0; e < poly.length; e++) {
      var p1 = poly[e], p2 = poly[(e + 1) % poly.length];
      var ex = p2[0] - p1[0], ey = p2[1] - p1[1];
      var len = Math.sqrt(ex * ex + ey * ey);
      if (len < 0.045) continue;
      var cxm = (p1[0] + p2[0]) / 2, cym = (p1[1] + p2[1]) / 2;
      if (cxm * cxm + cym * cym > 1.02) continue; // outside the body
      segs.push([p1[0], p1[1], p2[0], p2[1]]);
    }
  }
  return segs;
}

// ---- the eight spheres and ovoids -------------------------------------------------------
// Fixed positions scattered across the lower two-thirds, with
// generous pale space above. Each carries its own cooling
// parameter. cur is the network on show; nxt and fadeStart
// drive a re-fire crossfade, staggered by sphere index so the
// whole change takes about four seconds.
var FADE_LEN = 1.6, FADE_STEP = 0.34;
var spheres = [];
(function () {
  var defs = [
    { cx: 118, cy: 688, rx: 52, ry: 48, cool: 0.58 },
    { cx: 250, cy: 515, rx: 82, ry: 76, cool: 0.88 },
    { cx: 445, cy: 695, rx: 60, ry: 56, cool: 0.30 },
    { cx: 560, cy: 475, rx: 58, ry: 65, cool: 0.52 },
    { cx: 692, cy: 640, rx: 104, ry: 94, cool: 0.96 },
    { cx: 875, cy: 555, rx: 70, ry: 63, cool: 0.40 },
    { cx: 1035, cy: 700, rx: 58, ry: 54, cool: 0.72 },
    { cx: 1145, cy: 505, rx: 68, ry: 62, cool: 0.20 }
  ];
  for (var i = 0; i < defs.length; i++) {
    var d = defs[i];
    spheres.push({
      cx: d.cx, cy: d.cy, rx: d.rx, ry: d.ry, cool: d.cool,
      cur: makeVeins(27301 + i * 131, d.cool),
      nxt: null, fadeStart: -1
    });
  }
})();
var fireCount = 0;
function refire() {
  fireCount++;
  for (var i = 0; i < spheres.length; i++) {
    var sp = spheres[i];
    // settle any fade still running before starting the next
    if (sp.nxt) { sp.cur = sp.nxt; sp.nxt = null; }
    var r = rng(91823 + fireCount * 7919 + i * 104729);
    sp.cool = 0.16 + r() * 0.82; // a new cooling rate per sphere
    sp.nxt = makeVeins(40000 + fireCount * 31337 + i * 977, sp.cool);
    sp.fadeStart = T + i * FADE_STEP;
  }
}

function drawVeins(sp, segs, alpha) {
  if (alpha <= 0.003) return;
  ctx.beginPath();
  for (var i = 0; i < segs.length; i++) {
    var g = segs[i];
    ctx.moveTo(sp.cx + g[0] * sp.rx, sp.cy + g[1] * sp.ry);
    ctx.lineTo(sp.cx + g[2] * sp.rx, sp.cy + g[3] * sp.ry);
  }
  ctx.strokeStyle = rgba(TAN, alpha);
  ctx.lineWidth = 1.7;
  ctx.lineCap = 'round';
  ctx.stroke();
}

function draw() {
  // the pale ground fills the whole design frame
  ctx.fillStyle = GROUND;
  ctx.fillRect(-10, -10, DW + 20, DH + 20);
  for (var i = 0; i < spheres.length; i++) {
    var sp = spheres[i];
    // contact shadow: two flat ellipses in the shadow colour,
    // a wide faint one and a tighter stronger one, no blur
    ctx.fillStyle = rgba(SHADOW, 0.28);
    ctx.beginPath();
    ctx.ellipse(sp.cx + sp.rx * 0.06, sp.cy + sp.ry * 0.94, sp.rx * 1.02, sp.ry * 0.20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(SHADOW, 0.42);
    ctx.beginPath();
    ctx.ellipse(sp.cx + sp.rx * 0.04, sp.cy + sp.ry * 0.92, sp.rx * 0.78, sp.ry * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    // the black body
    ctx.fillStyle = BLACK;
    ctx.beginPath();
    ctx.ellipse(sp.cx, sp.cy, sp.rx, sp.ry, 0, 0, Math.PI * 2);
    ctx.fill();
    // everything on the body is clipped to the silhouette
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(sp.cx, sp.cy, sp.rx, sp.ry, 0, 0, Math.PI * 2);
    ctx.clip();
    // roundness: a soft wash of tan light high on the body and
    // a fainter bounce low on it, both in the vein colour
    ctx.fillStyle = rgba(TAN, 0.10);
    ctx.beginPath();
    ctx.ellipse(sp.cx - sp.rx * 0.34, sp.cy - sp.ry * 0.42, sp.rx * 0.42, sp.ry * 0.26, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(TAN, 0.05);
    ctx.beginPath();
    ctx.ellipse(sp.cx + sp.rx * 0.22, sp.cy + sp.ry * 0.58, sp.rx * 0.50, sp.ry * 0.24, 0.4, 0, Math.PI * 2);
    ctx.fill();
    // the crackle networks, crossfading old to new on a re-fire
    if (sp.nxt) {
      var p = smooth((T - sp.fadeStart) / FADE_LEN);
      drawVeins(sp, sp.cur, 0.92 * (1 - p));
      drawVeins(sp, sp.nxt, 0.92 * p);
      if (p >= 1) { sp.cur = sp.nxt; sp.nxt = null; sp.fadeStart = -1; }
    } else {
      drawVeins(sp, sp.cur, 0.92);
    }
    ctx.restore();
    // a highlight arc in crackle tan hugging the upper left rim
    ctx.strokeStyle = rgba(TAN, 0.30);
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.ellipse(sp.cx, sp.cy, sp.rx - 5, sp.ry - 5, 0, Math.PI * 1.08, Math.PI * 1.52);
    ctx.stroke();
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- tap to re-fire -----------------------------------------------------------------------
// A deliberate tap (press and release in much the same place,
// quickly) re-fires the kiln. Coordinates are converted to
// design space through the stored centred-fit transform, per
// house rules, even though the firing is position independent:
// any tap anywhere re-fires, and nothing ever reloads.
var downX = -1, downY = -1, downStamp = 0;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downStamp = e.timeStamp || 0;
  if (e.preventDefault) e.preventDefault();
});
window.addEventListener('pointerup', function (e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var dt = (e.timeStamp || 0) - downStamp;
  downX = -1; downY = -1;
  if (Math.sqrt(dx * dx + dy * dy) < 16 && dt < 700) refire();
});

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the pale ground is the page ground, so the
  // letterbox and the scene are one continuous field
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
