<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.316 Three-Part Registration</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EAD8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.316 Three-Part Registration (Coral Cockatoo).
// One large botanical composition in exactly three printable
// layers: vermilion blossom fills, teal leaf fills and a mustard
// monoline detail layer, on cream paper. The two fill layers are
// drawn with multiply blending so overlaps make new colours; the
// line layer draws last in source-over. Layers are data sets on
// ONE canvas only, no offscreen canvases, no text anywhere.
// Drag hit-tests the topmost layer under the pointer and drags
// that layer's data offset; on release the layer stays where it
// was left. Double-tap within 350ms snaps all offsets to zero
// with a short soft settle ease. Idle holds still. Frame one is
// in perfect registration.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F2EAD8', VERM = '#C73E1D', TEAL = '#2F7E7B', MUST = '#E0A437';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }

// ---- composition: exactly 1 composition, exactly 3 layers ------
var COMPOSITIONS = 1;
if (COMPOSITIONS !== 1) throw new Error('Three-Part Registration needs exactly 1 composition');
var LAYERS = ['blossom', 'leaf', 'line'];
if (LAYERS.length !== 3) throw new Error('Three-Part Registration needs exactly 3 layers');
var off = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];

// Blossom fills (layer 0, vermilion).
var BLOSSOMS = [
  { x: 640, y: 322, r: 104 },
  { x: 474, y: 424, r: 64 },
  { x: 806, y: 424, r: 68 },
  { x: 560, y: 528, r: 50 },
  { x: 722, y: 532, r: 46 }
];
(function () {
  var r = rng(31601), i, j;
  for (i = 0; i < BLOSSOMS.length; i++) {
    BLOSSOMS[i].lobes = [];
    for (j = 0; j < 10; j++) BLOSSOMS[i].lobes.push(0.82 + r() * 0.30);
  }
})();

// Leaf fills (layer 1, teal): lanceolate leaves.
var LEAVES = [
  { x: 408, y: 566, len: 190, wid: 54, ang: -0.62 },
  { x: 872, y: 566, len: 190, wid: 54, ang: Math.PI + 0.62 },
  { x: 468, y: 648, len: 168, wid: 48, ang: -0.18 },
  { x: 812, y: 648, len: 168, wid: 48, ang: Math.PI + 0.18 },
  { x: 536, y: 618, len: 150, wid: 42, ang: -1.05 },
  { x: 744, y: 618, len: 150, wid: 42, ang: Math.PI + 1.05 },
  { x: 640, y: 676, len: 138, wid: 40, ang: 1.45 },
  { x: 640, y: 188, len: 132, wid: 38, ang: -1.35 }
];

// Monoline detail (layer 2, mustard): stems as point paths.
var STEMS = [
  [{ x: 640, y: 782 }, { x: 636, y: 660 }, { x: 640, y: 540 }, { x: 640, y: 430 }, { x: 640, y: 322 }],
  [{ x: 640, y: 540 }, { x: 570, y: 480 }, { x: 474, y: 424 }],
  [{ x: 640, y: 540 }, { x: 716, y: 480 }, { x: 806, y: 424 }],
  [{ x: 640, y: 620 }, { x: 600, y: 576 }, { x: 560, y: 528 }],
  [{ x: 640, y: 620 }, { x: 684, y: 580 }, { x: 722, y: 532 }],
  [{ x: 636, y: 660 }, { x: 540, y: 640 }, { x: 468, y: 648 }],
  [{ x: 636, y: 660 }, { x: 740, y: 640 }, { x: 812, y: 648 }],
  [{ x: 640, y: 430 }, { x: 640, y: 310 }, { x: 640, y: 196 }]
];
// Authored bounds per layer, in design coords, for hit-testing.
var BOUNDS = [
  { x: 640, y: 420, r: 250 },
  { x: 640, y: 590, r: 300 },
  { x: 640, y: 480, r: 330 }
];

function blossomPath(b) {
  var i, a, rr, x, y, px, py, mx, my;
  ctx.beginPath();
  for (i = 0; i <= 10; i++) {
    a = (i % 10) / 10 * Math.PI * 2 - Math.PI / 2;
    rr = b.r * b.lobes[i % 10];
    x = b.x + Math.cos(a) * rr; y = b.y + Math.sin(a) * rr;
    if (i === 0) { ctx.moveTo(x, y); px = x; py = y; }
    else {
      mx = (px + x) / 2; my = (py + y) / 2;
      ctx.quadraticCurveTo(px, py, mx, my);
      if (i === 10) ctx.quadraticCurveTo(px, py, x, y);
      px = x; py = y;
    }
  }
  ctx.closePath();
}
function drawLeaf(l, ox, oy) {
  ctx.save();
  ctx.translate(l.x + ox, l.y + oy); ctx.rotate(l.ang);
  ctx.beginPath();
  ctx.moveTo(-l.len / 2, 0);
  ctx.quadraticCurveTo(-l.len * 0.1, -l.wid, l.len / 2, 0);
  ctx.quadraticCurveTo(-l.len * 0.1, l.wid, -l.len / 2, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, DW, DH);
  var i, j, b, l;
  // Layer 1: blossom fills, multiply.
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = VERM;
  for (i = 0; i < BLOSSOMS.length; i++) {
    b = BLOSSOMS[i];
    ctx.save(); ctx.translate(off[0].x, off[0].y);
    blossomPath(b); ctx.fill();
    ctx.restore();
  }
  // Layer 2: leaf fills, multiply.
  ctx.fillStyle = TEAL;
  for (i = 0; i < LEAVES.length; i++) drawLeaf(LEAVES[i], off[1].x, off[1].y);
  // Layer 3: monoline detail, source-over, drawn last.
  ctx.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.translate(off[2].x, off[2].y);
  st(MUST, 4);
  for (i = 0; i < STEMS.length; i++) {
    ctx.beginPath();
    for (j = 0; j < STEMS[i].length; j++) {
      if (j === 0) ctx.moveTo(STEMS[i][j].x, STEMS[i][j].y);
      else ctx.lineTo(STEMS[i][j].x, STEMS[i][j].y);
    }
    ctx.stroke();
  }
  // blossom rings, centres and radial stamen ticks
  for (i = 0; i < BLOSSOMS.length; i++) {
    b = BLOSSOMS[i];
    st(MUST, 3.5); circ(b.x, b.y, b.r + 10, false);
    ctx.fillStyle = MUST; circ(b.x, b.y, 7, true);
    st(MUST, 3);
    for (j = 0; j < 12; j++) {
      var a = j / 12 * Math.PI * 2 + i;
      ctx.beginPath();
      ctx.moveTo(b.x + Math.cos(a) * b.r * 0.28, b.y + Math.sin(a) * b.r * 0.28);
      ctx.lineTo(b.x + Math.cos(a) * b.r * 0.62, b.y + Math.sin(a) * b.r * 0.62);
      ctx.stroke();
      ctx.fillStyle = MUST;
      circ(b.x + Math.cos(a) * b.r * 0.70, b.y + Math.sin(a) * b.r * 0.70, 3.2, true);
    }
  }
  // leaf midribs and side veins
  for (i = 0; i < LEAVES.length; i++) {
    l = LEAVES[i];
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.ang);
    st(MUST, 3);
    ctx.beginPath(); ctx.moveTo(-l.len / 2, 0); ctx.lineTo(l.len / 2, 0); ctx.stroke();
    for (j = -2; j <= 2; j++) {
      if (j === 0) continue;
      ctx.beginPath();
      ctx.moveTo(j * l.len * 0.14, 0);
      ctx.lineTo(j * l.len * 0.14 + l.len * 0.10, (j > 0 ? -1 : -1) * l.wid * 0.42);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(j * l.len * 0.14, 0);
      ctx.lineTo(j * l.len * 0.14 + l.len * 0.10, l.wid * 0.42);
      ctx.stroke();
    }
    ctx.restore();
  }
  // small registration crosses at the corners of the composition
  st(MUST, 3);
  var marks = [[352, 150], [928, 150], [352, 800], [928, 800]], k;
  for (k = 0; k < marks.length; k++) {
    ctx.beginPath();
    ctx.moveTo(marks[k][0] - 14, marks[k][1]); ctx.lineTo(marks[k][0] + 14, marks[k][1]);
    ctx.moveTo(marks[k][0], marks[k][1] - 14); ctx.lineTo(marks[k][0], marks[k][1] + 14);
    ctx.stroke();
    circ(marks[k][0], marks[k][1], 9, false);
  }
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}

// ---- interaction -----------------------------------------------------
var drag = null;
var lastTapStamp = -10000;
var settle = null; // { t0, from: [{x,y}x3] }
function distSeg(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1, len2 = dx * dx + dy * dy || 1;
  var t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  var ex = x1 + t * dx - px, ey = y1 + t * dy - py;
  return Math.sqrt(ex * ex + ey * ey);
}
function hitLine(p) {
  var i, j, b, l;
  var x = p[0] - off[2].x, y = p[1] - off[2].y;
  for (i = 0; i < STEMS.length; i++) for (j = 0; j + 1 < STEMS[i].length; j++) {
    if (distSeg(x, y, STEMS[i][j].x, STEMS[i][j].y, STEMS[i][j + 1].x, STEMS[i][j + 1].y) < 26) return true;
  }
  for (i = 0; i < BLOSSOMS.length; i++) {
    b = BLOSSOMS[i];
    var d = Math.sqrt((x - b.x) * (x - b.x) + (y - b.y) * (y - b.y));
    if (Math.abs(d - (b.r + 10)) < 22 || d < b.r * 0.72) return true;
  }
  for (i = 0; i < LEAVES.length; i++) {
    l = LEAVES[i];
    var ca = Math.cos(-l.ang), sa = Math.sin(-l.ang);
    var lx = (x - l.x) * ca - (y - l.y) * sa, ly = (x - l.x) * sa + (y - l.y) * ca;
    if (Math.abs(ly) < 20 && lx > -l.len / 2 - 10 && lx < l.len / 2 + 10) return true;
  }
  return false;
}
function hitLeaf(p) {
  var i, l, ca, sa, lx, ly;
  var x = p[0] - off[1].x, y = p[1] - off[1].y;
  for (i = 0; i < LEAVES.length; i++) {
    l = LEAVES[i];
    ca = Math.cos(-l.ang); sa = Math.sin(-l.ang);
    lx = (x - l.x) * ca - (y - l.y) * sa; ly = (x - l.x) * sa + (y - l.y) * ca;
    var e = (lx * lx) / ((l.len / 2) * (l.len / 2)) + (ly * ly) / ((l.wid * 0.72) * (l.wid * 0.72));
    if (e <= 1) return true;
  }
  return false;
}
function hitBlossom(p) {
  var i, b, dx, dy;
  var x = p[0] - off[0].x, y = p[1] - off[0].y;
  for (i = 0; i < BLOSSOMS.length; i++) {
    b = BLOSSOMS[i]; dx = x - b.x; dy = y - b.y;
    if (dx * dx + dy * dy <= b.r * b.r * 1.15) return true;
  }
  return false;
}
function hitLayer(p) {
  // Topmost first: line layer, then leaf fills, then blossom fills.
  if (hitLine(p)) return 2;
  if (hitLeaf(p)) return 1;
  if (hitBlossom(p)) return 0;
  // Fall back to authored bounds, topmost first.
  var order = [2, 1, 0], k, dx, dy;
  for (k = 0; k < 3; k++) {
    var li = order[k];
    dx = p[0] - off[li].x - BOUNDS[li].x; dy = p[1] - off[li].y - BOUNDS[li].y;
    if (dx * dx + dy * dy <= BOUNDS[li].r * BOUNDS[li].r && li === 2) continue;
    if (dx * dx + dy * dy <= BOUNDS[li].r * BOUNDS[li].r) return li;
  }
  return -1;
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  settle = null;
  var p = toDesign(e);
  var li = hitLayer(p);
  drag = { layer: li, x: p[0], y: p[1], sx: p[0], sy: p[1], moved: 0, ox: li >= 0 ? off[li].x : 0, oy: li >= 0 ? off[li].y : 0, stamp: e.timeStamp || 0 };
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag || drag.layer < 0) return;
  var p = toDesign(e);
  drag.moved = Math.max(drag.moved, Math.abs(p[0] - drag.sx), Math.abs(p[1] - drag.sy));
  off[drag.layer].x = drag.ox + (p[0] - drag.sx);
  off[drag.layer].y = drag.oy + (p[1] - drag.sy);
});
canvas.addEventListener('pointerup', function (e) {
  if (drag && drag.moved < 9) {
    var stamp = e.timeStamp || 0;
    if (stamp - lastTapStamp <= 350 && lastTapStamp > -1000) {
      settle = { t0: T, dur: 0.5, from: [{ x: off[0].x, y: off[0].y }, { x: off[1].x, y: off[1].y }, { x: off[2].x, y: off[2].y }] };
      lastTapStamp = -10000;
    } else {
      lastTapStamp = stamp;
    }
  }
  drag = null;
});
canvas.addEventListener('pointercancel', function () { drag = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  if (settle) {
    var p = (T - settle.t0) / settle.dur;
    if (p >= 1) { off[0].x = 0; off[0].y = 0; off[1].x = 0; off[1].y = 0; off[2].x = 0; off[2].y = 0; settle = null; }
    else {
      var ease = 1 - Math.pow(1 - p, 3);
      // soft settle: a gentle overshoot-free ease with a small end cushion
      ease = ease * (0.92 + 0.08 * Math.sin(p * Math.PI));
      for (var i = 0; i < 3; i++) { off[i].x = settle.from[i].x * (1 - ease); off[i].y = settle.from[i].y * (1 - ease); }
    }
  }
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
