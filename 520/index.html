<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Città Blocks</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F7F2E4; overflow: hidden; }
  canvas { display: block; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (flat fills only, no gradients anywhere, ever)
  var VERMILION = '#E14E2B', SUNFLOWER = '#F2B705', PINK = '#E84393',
      VIOLET = '#8A5FB0', ORANGE = '#F05A1E', BLACK = '#141414',
      CREAM = '#F7F2E4';
  var BLOCK_COLORS = [VERMILION, ORANGE, PINK, VIOLET, SUNFLOWER, BLACK];
  var RAINBOW = [VERMILION, ORANGE, SUNFLOWER, PINK, VIOLET];
  var MORTAR = 0.012;                 // cream line between blocks
  var PHASE0 = 4.2;                   // constant first-frame loop phase

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var BASE_SEED = 520062;
  var seed = BASE_SEED;
  var layout = null;

  // ---- layout generation (seeded) ----
  function genBlocks(rng, n, hMin, hMax) {
    var raw = [], s = 0, i, w;
    for (i = 0; i < n; i++) { w = 0.7 + rng() * 0.6; raw.push(w); s += w; }
    var blocks = [], x = 0, prev = null;
    for (i = 0; i < n; i++) {
      w = raw[i] / s;                            // partition [0,1] exactly: tiles seamlessly
      var col, guard = 0;
      do { col = BLOCK_COLORS[Math.floor(rng() * BLOCK_COLORS.length)]; guard++; }
      while (col === prev && guard < 8);
      prev = col;
      blocks.push({
        x: x, w: w, h: hMin + rng() * (hMax - hMin),
        color: col, arch: false, archWin: false, pattern: null
      });
      x += w;
    }
    return blocks;
  }

  function buildLayout(s) {
    var rng = mulberry32(s);
    var layers = [
      { speed: 0.00055, blocks: genBlocks(rng, 4, 0.52, 0.74) },   // back
      { speed: 0.00105, blocks: genBlocks(rng, 4, 0.36, 0.58) },   // mid
      { speed: 0.00175, blocks: genBlocks(rng, 4, 0.18, 0.34) }    // front
    ];
    var all = [];
    var li, bi;
    for (li = 0; li < 3; li++) for (bi = 0; bi < layers[li].blocks.length; bi++)
      all.push(layers[li].blocks[bi]);

    // round-arch doorways: one per layer, on distinct blocks
    for (li = 0; li < 3; li++) {
      var lb = layers[li].blocks[Math.floor(rng() * layers[li].blocks.length)];
      lb.arch = true;
    }
    // round-arch windows: two more blocks
    var winPicks = 0, guard = 0;
    while (winPicks < 2 && guard < 40) {
      guard++;
      var wb = all[Math.floor(rng() * all.length)];
      if (!wb.archWin && wb.h > 0.24) { wb.archWin = true; winPicks++; }
    }
    // pattern fills inside exactly 4 blocks, never on ribbons
    var patNames = ['stripes', 'dots', 'waves', 'stripes'];
    var patPicks = 0; guard = 0;
    while (patPicks < 4 && guard < 60) {
      guard++;
      var pb = all[Math.floor(rng() * all.length)];
      if (!pb.pattern) { pb.pattern = patNames[patPicks]; patPicks++; }
    }
    // bridge diagonal in the mid layer: exact 45 degrees from a block top
    var mid = layers[1].blocks;
    var bk = Math.floor(rng() * (mid.length - 1));
    var bb = mid[bk];
    var run = 0.20 + rng() * 0.10;
    var bridge = {
      x1: bb.x + bb.w * 0.30, y1: 1 - bb.h,
      x2: bb.x + bb.w * 0.30 + run, y2: 1 - bb.h + run,
      color: rng() < 0.5 ? BLACK : VERMILION
    };
    // rainbow ribbons crossing the whole canvas
    var ribbons = [];
    var nRib = 2 + Math.floor(rng() * 2);         // 2-3
    for (var r = 0; r < nRib; r++) {
      var rot = Math.floor(rng() * RAINBOW.length);
      var cols = [];
      for (var k = 0; k < 5; k++) cols.push(RAINBOW[(rot + k) % RAINBOW.length]);
      ribbons.push({
        baseY: 0.14 + rng() * 0.68,
        amp: 0.04 + rng() * 0.06,
        waves: 1.0 + rng() * 0.9,
        phase: rng() * Math.PI * 2,
        cols: cols
      });
    }
    // the tiny figure walks the widest front block
    var front = layers[2].blocks, widest = 0;
    for (bi = 1; bi < front.length; bi++) if (front[bi].w > front[widest].w) widest = bi;
    return {
      layers: layers, bridge: bridge, bridgeLayer: 1,
      ribbons: ribbons, ledgeBlock: front[widest]
    };
  }
  layout = buildLayout(seed);

  // ---- sizing ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    if (sw < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw(simT);
  }

  // ---- drawing helpers (stage units, 0..1 square) ----
  function archPath(cx, baseY, aw, ah) {
    var r = aw / 2, topY = baseY - ah + r;
    ctx.beginPath();
    ctx.moveTo(cx - r, baseY);
    ctx.lineTo(cx - r, topY);
    ctx.arc(cx, topY, r, Math.PI, 0);
    ctx.lineTo(cx + r, baseY);
    ctx.closePath();
  }

  function drawPattern(b, bx) {
    var ink = (b.color === SUNFLOWER) ? BLACK : CREAM;
    var x0 = bx + MORTAR / 2, x1 = bx + b.w - MORTAR / 2;
    var y0 = 1 - b.h + MORTAR / 2, y1 = 1 - MORTAR / 2;
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
    ctx.strokeStyle = ink; ctx.fillStyle = ink;
    var i, x, y;
    if (b.pattern === 'stripes') {
      ctx.lineWidth = 0.007;
      for (y = y0 + 0.014; y < y1; y += 0.026) {
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      }
    } else if (b.pattern === 'dots') {
      var row = 0;
      for (y = y0 + 0.016; y < y1; y += 0.027, row++) {
        for (x = x0 + 0.016 + (row % 2) * 0.0135; x < x1; x += 0.027) {
          ctx.beginPath(); ctx.arc(x, y, 0.0055, 0, Math.PI * 2); ctx.fill();
        }
      }
    } else if (b.pattern === 'waves') {
      ctx.lineWidth = 0.005;
      for (y = y0 + 0.016; y < y1; y += 0.026) {
        ctx.beginPath();
        for (x = x0; x <= x1 + 0.001; x += 0.01) {
          var yy = y + Math.sin((x - x0) * 160) * 0.004;
          if (x === x0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawBlock(b, bx) {
    var top = 1 - b.h;
    ctx.fillStyle = b.color;
    ctx.fillRect(bx, top, b.w, b.h);
    ctx.strokeStyle = CREAM;                      // mortar line
    ctx.lineWidth = MORTAR;
    ctx.strokeRect(bx, top, b.w, b.h);
    if (b.pattern) drawPattern(b, bx);
    if (b.archWin) {
      var aw = Math.min(b.w * 0.34, 0.075), ah = aw * 1.45;
      ctx.fillStyle = CREAM;
      archPath(bx + b.w / 2, top + b.h * 0.52, aw, ah);
      ctx.fill();
    }
    if (b.arch) {
      var dw = Math.min(b.w * 0.44, 0.095), dh = Math.min(b.h * 0.6, dw * 1.7);
      ctx.fillStyle = CREAM;
      archPath(bx + b.w / 2, 1, dw, dh);
      ctx.fill();
    }
  }

  function drawLayer(L, off, t) {
    var shift, i;
    for (shift = -1; shift <= 1; shift++) {
      for (i = 0; i < L.blocks.length; i++) {
        var b = L.blocks[i], bx = b.x - off + shift;
        if (bx + b.w < 0 || bx > 1) continue;
        drawBlock(b, bx);
      }
    }
  }

  function drawBridge(off) {
    var br = layout.bridge;
    ctx.lineCap = 'butt';
    for (var shift = -1; shift <= 1; shift++) {
      ctx.strokeStyle = CREAM;                    // mortar outline lifts it off the blocks
      ctx.lineWidth = 0.042;
      ctx.beginPath();
      ctx.moveTo(br.x1 - off + shift, br.y1);
      ctx.lineTo(br.x2 - off + shift, br.y2);
      ctx.stroke();
      ctx.strokeStyle = br.color;
      ctx.lineWidth = 0.028;
      ctx.beginPath();
      ctx.moveTo(br.x1 - off + shift, br.y1);
      ctx.lineTo(br.x2 - off + shift, br.y2);
      ctx.stroke();
    }
    ctx.lineCap = 'round';
  }

  function drawRibbon(rb) {
    var widths = [0.054, 0.043, 0.033, 0.023, 0.013];
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (var k = 0; k < 5; k++) {
      ctx.strokeStyle = rb.cols[k];
      ctx.lineWidth = widths[k];
      ctx.beginPath();
      for (var x = 0; x <= 1.001; x += 0.02) {
        var y = rb.baseY + Math.sin(x * rb.waves * Math.PI * 2 + rb.phase) * rb.amp;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  function drawFigure(t, offFront) {
    var lb = layout.ledgeBlock;
    var fh = 0.042;                               // figure height, stage units
    var legLen = fh * 0.42, bodyLen = fh * 0.38, headR = fh * 0.17;
    var margin = 0.018;
    var span = lb.w - margin * 2 - 0.012;
    if (span < 0.02) span = 0.02;
    var cyc = (t / 30) % 2;                       // 30 s each way along the ledge
    var p = cyc < 1 ? cyc : 2 - cyc;
    var dir = cyc < 1 ? 1 : -1;
    var fx = lb.x - offFront + margin + p * span;
    var ledgeY = 1 - lb.h;
    var swing = Math.sin(t * 6.4) * legLen * 0.75;
    ctx.strokeStyle = BLACK;
    ctx.fillStyle = BLACK;
    ctx.lineCap = 'round';
    for (var shift = -1; shift <= 1; shift++) {
      var cx = fx + shift, hipY = ledgeY - legLen;
      if (cx < -0.05 || cx > 1.05) continue;
      ctx.lineWidth = fh * 0.13;                  // legs, two phases
      ctx.beginPath();
      ctx.moveTo(cx, hipY); ctx.lineTo(cx + swing, ledgeY);
      ctx.moveTo(cx, hipY); ctx.lineTo(cx - swing, ledgeY);
      ctx.stroke();
      ctx.lineWidth = fh * 0.30;                  // body
      ctx.beginPath();
      ctx.moveTo(cx, hipY); ctx.lineTo(cx, hipY - bodyLen);
      ctx.stroke();
      ctx.lineWidth = fh * 0.11;                  // arm, counter-swing
      ctx.beginPath();
      ctx.moveTo(cx, hipY - bodyLen * 0.85);
      ctx.lineTo(cx + dir * -swing * 0.8, hipY - bodyLen * 0.2);
      ctx.stroke();
      ctx.beginPath();                            // head: plain silhouette, no face
      ctx.arc(cx, hipY - bodyLen - headR, headR, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S, S);
    ctx.beginPath(); ctx.rect(0, 0, 1, 1); ctx.clip();
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, 1, 1);
    var offs = [], li;
    for (li = 0; li < 3; li++) offs.push((t * layout.layers[li].speed) % 1);
    for (li = 0; li < 3; li++) drawLayer(layout.layers[li], offs[li], t);
    drawBridge(offs[layout.bridgeLayer]);         // above the blocks so the diagonal reads
    for (var r = 0; r < layout.ribbons.length; r++) drawRibbon(layout.ribbons[r]);
    drawFigure(t, offs[2]);
    ctx.restore();
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  // ---- double-tap / double-click reseeds the city ----
  function reseed() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    layout = buildLayout(seed);
    draw(simT);
  }
  var lastUp = 0, lastX = 0, lastY = 0;
  canvas.addEventListener('pointerup', function (e) {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (now - lastUp < 350 && dx * dx + dy * dy < 900) reseed();
    lastUp = now; lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener('dblclick', function () { reseed(); });

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
