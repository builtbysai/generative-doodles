<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sempere Account</title>
<style>
html, body { margin: 0; padding: 0; background: #E8E2D6; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#E8E2D6';   /* warm grey ground */
var INK = '#23211E';
var GOLD = '#C2A15A';    /* dusty gold */
var SLATE = '#5A6E8C';   /* slate blue */
var GREY = '#B4AA97';    /* warm grey */
var ACCENTS = ['#B4552D', '#2F7A6E', '#6E5A8A']; /* rust, teal, plum */
var PAINT_S = 6;         /* one full read takes six seconds */
var SETTLE_S = 1.5;      /* split divider sweep after a read completes */
var PHASE0 = 3.6;        /* frame one: identity 0 sixty percent read */
var IDENTITIES = [
  /* Five invented demo identities. No real personal data. */
  { handle: 'alba-ruiz',   nums: [3, 17, 64],  tags: ['weaver', 'quiet'] },
  { handle: 'kofi-mensah', nums: [11, 5, 29],  tags: ['drummer', 'bright'] },
  { handle: 'yuki-tanaka', nums: [2, 23, 81],  tags: ['gardener', 'slow'] },
  { handle: 'nils-berg',   nums: [9, 31, 47],  tags: ['sailor', 'north'] },
  { handle: 'priya-nair',  nums: [5, 13, 97],  tags: ['coder', 'monsoon'] }
];
function fnv1a(s) {
  var h = 0x811c9dc5, i;
  for (i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function rgbStr(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
var PAPER_RGB = hexRgb(PAPER);
var INK_RGB = hexRgb(INK);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Square composition, centred, page ground the piece's own warm grey.
   On phones the square spans the full width; on desktop it is 96% of
   the smaller viewport dimension. The cell field fills the square
   edge to edge. */
function compRect() {
  var s = isPhone ? VW : Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- identity to parameter vector: pure function of the demo set ---- */
function pickWeighted(rng, palette, weights) {
  var r = rng(), acc = 0, i;
  for (i = 0; i < weights.length; i++) {
    acc += weights[i];
    if (r <= acc) return palette[i];
  }
  return palette[palette.length - 1];
}
function splitOnce(rng, x, y, w, h, out) {
  var vertical = w >= h;
  var ratio = 0.35 + rng() * 0.30;
  if (vertical) {
    var w1 = w * ratio;
    out.push({ x: x, y: y, w: w1, h: h, cx: x + w1 / 2, cy: y + h / 2 });
    out.push({ x: x + w1, y: y, w: w - w1, h: h, cx: x + w1 + (w - w1) / 2, cy: y + h / 2 });
  } else {
    var h1 = h * ratio;
    out.push({ x: x, y: y, w: w, h: h1, cx: x + w / 2, cy: y + h1 / 2 });
    out.push({ x: x, y: y + h1, w: w, h: h - h1, cx: x + w / 2, cy: y + h1 + (h - h1) / 2 });
  }
}
function subdivide(rng, x, y, w, h, depth, extraP, out) {
  if (depth === 0) {
    if (rng() < extraP && w > 0.10 && h > 0.10) {
      splitOnce(rng, x, y, w, h, out);
    } else {
      out.push({ x: x, y: y, w: w, h: h, cx: x + w / 2, cy: y + h / 2 });
    }
    return;
  }
  var vertical = w >= h ? rng() < 0.72 : rng() < 0.28;
  var ratio = 0.35 + rng() * 0.30;
  if (vertical) {
    var w1 = w * ratio;
    subdivide(rng, x, y, w1, h, depth - 1, extraP, out);
    subdivide(rng, x + w1, y, w - w1, h, depth - 1, extraP, out);
  } else {
    var h1 = h * ratio;
    subdivide(rng, x, y, w, h1, depth - 1, extraP, out);
    subdivide(rng, x, y + h1, w, h - h1, depth - 1, extraP, out);
  }
}
function buildParams(i) {
  var id = IDENTITIES[i];
  var key = id.handle + '|' + id.nums.join(',') + '|' + id.tags.join(',');
  var seed = fnv1a(key);
  var rng = mulberry32(seed);
  var depth = 4 + Math.floor(rng() * 3); /* subdivision depth 4..6 */
  var extraP = 0.15 + rng() * 0.25;      /* extra-split chance per leaf */
  var cells = [];
  subdivide(rng, 0, 0, 1, 1, depth, extraP, cells);
  /* Reading order: top to bottom, left to right. */
  cells.sort(function (a, b) { return (a.cy - b.cy) || (a.cx - b.cx); });
  var accent = Math.floor(rng() * 3);    /* 0 rust, 1 teal, 2 plum */
  var skew = 0.30 + rng() * 0.15;        /* accent weight in the palette */
  var base = [0.30, 0.30, 0.25, 0.05];   /* gold, slate, grey, ink */
  var scale = (1 - skew) / (base[0] + base[1] + base[2] + base[3]);
  var weights = [base[0] * scale, base[1] * scale, base[2] * scale, base[3] * scale, skew];
  var palette = [GOLD, SLATE, GREY, INK, ACCENTS[accent]];
  var ci;
  for (ci = 0; ci < cells.length; ci++) {
    cells[ci].fill = hexRgb(pickWeighted(rng, palette, weights));
    /* One cell in five carries a small inner mark: 0 dot, 1 tick, 2 ring. */
    cells[ci].mark = rng() < 0.2 ? Math.floor(rng() * 3) : -1;
  }
  var fanCount = 3 + Math.floor(rng() * 4); /* 3..6 fans */
  var fans = [], f;
  for (f = 0; f < fanCount; f++) {
    fans.push({
      x: 0.08 + rng() * 0.84,
      y: 0.08 + rng() * 0.84,
      base: rng() * TAU,
      spread: (40 + rng() * 80) * Math.PI / 180,
      rays: 10 + Math.floor(rng() * 27),   /* 10..36 rays per fan */
      radius: 0.20 + rng() * 0.30
    });
  }
  var glyphHash = fnv1a(key + ':glyph');
  var glyphCorner = glyphHash % 4;        /* 0 TL, 1 TR, 2 BL, 3 BR */
  var glyphType = (glyphHash >>> 3) % 6;  /* dedicated sub-hash so the
    demo set carries five distinct glyphs */
  /* Stroke list: cells first, then fan rays, then the glyph last. */
  var strokes = [], s, r;
  for (s = 0; s < cells.length; s++) strokes.push({ k: 'cell', c: cells[s] });
  var totalRays = 0;
  var accentRgb = hexRgb(ACCENTS[accent]);
  for (f = 0; f < fans.length; f++) {
    var fan = fans[f];
    for (r = 0; r < fan.rays; r++) {
      var ang = fan.base - fan.spread / 2 + (fan.spread * (r + 0.5)) / fan.rays;
      var len = fan.radius * (0.55 + 0.45 * rng());
      var rc = rng();
      var col = rc < 0.62 ? INK_RGB : (rc < 0.78 ? accentRgb : (rc < 0.90 ? hexRgb(GOLD) : hexRgb(SLATE)));
      strokes.push({
        k: 'ray',
        x0: fan.x, y0: fan.y,
        x1: fan.x + Math.cos(ang) * len, y1: fan.y + Math.sin(ang) * len,
        crgb: col, a: 0.35 + rng() * 0.30, w: 0.8 + rng() * 0.9
      });
      totalRays++;
    }
  }
  strokes.push({ k: 'glyph', corner: glyphCorner, type: glyphType });
  return {
    index: i, handle: id.handle, seed: seed, depth: depth,
    cellCount: cells.length, fanCount: fanCount, fans: fans,
    accent: accent, skew: skew, lineDensity: totalRays,
    glyphCorner: glyphCorner, glyphType: glyphType, strokes: strokes
  };
}
var PARAMS = [];
var pi;
for (pi = 0; pi < IDENTITIES.length; pi++) PARAMS.push(buildParams(pi));
/* ---- drawing ---- */
function drawCell(c, rect, S) {
  var x = rect.x + c.x * S, y = rect.y + c.y * S;
  var w = c.w * S, h = c.h * S;
  var gap = Math.max(1, Math.min(w, h) * 0.07);
  var ix = x + gap / 2, iy = y + gap / 2, iw = w - gap, ih = h - gap;
  ctx.fillStyle = rgbStr(c.fill);
  ctx.fillRect(ix, iy, iw, ih);
  ctx.strokeStyle = rgba(INK_RGB, 0.35);
  ctx.lineWidth = Math.max(1, S * 0.0015);
  ctx.strokeRect(ix, iy, iw, ih);
  var m = Math.min(iw, ih);
  if (c.mark === 0) {
    ctx.fillStyle = rgba(INK_RGB, 0.55);
    ctx.beginPath();
    ctx.moveTo(ix + iw / 2 + m * 0.08, iy + ih / 2);
    ctx.arc(ix + iw / 2, iy + ih / 2, m * 0.08, 0, TAU);
    ctx.fill();
  } else if (c.mark === 1) {
    ctx.strokeStyle = rgba(INK_RGB, 0.55);
    ctx.lineWidth = Math.max(1, S * 0.002);
    ctx.beginPath();
    ctx.moveTo(ix + iw * 0.3, iy + ih / 2);
    ctx.lineTo(ix + iw * 0.7, iy + ih / 2);
    ctx.stroke();
  } else if (c.mark === 2) {
    ctx.strokeStyle = rgba(INK_RGB, 0.5);
    ctx.lineWidth = Math.max(1, S * 0.0015);
    ctx.beginPath();
    ctx.moveTo(ix + iw / 2 + m * 0.12, iy + ih / 2);
    ctx.arc(ix + iw / 2, iy + ih / 2, m * 0.12, 0, TAU);
    ctx.stroke();
  }
}
function drawRay(st, rect, S) {
  ctx.strokeStyle = rgba(st.crgb, st.a);
  ctx.lineWidth = Math.max(0.75, st.w * (S / 720));
  ctx.beginPath();
  ctx.moveTo(rect.x + st.x0 * S, rect.y + st.y0 * S);
  ctx.lineTo(rect.x + st.x1 * S, rect.y + st.y1 * S);
  ctx.stroke();
}
function drawGlyph(p, rect, S) {
  var pos = [[0.04, 0.04], [0.96, 0.04], [0.04, 0.96], [0.96, 0.96]][p.glyphCorner];
  var cx = rect.x + pos[0] * S, cy = rect.y + pos[1] * S;
  var r = S * 0.026;
  var ac = hexRgb(ACCENTS[p.accent]);
  ctx.strokeStyle = rgbStr(ac);
  ctx.fillStyle = rgbStr(ac);
  ctx.lineWidth = Math.max(1.5, S * 0.0022);
  var t = p.glyphType;
  if (t === 0) { /* circle and cross */
    ctx.beginPath();
    ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
    ctx.stroke();
  } else if (t === 1) { /* triangle */
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.lineTo(cx + r, cy + r * 0.8);
    ctx.lineTo(cx - r, cy + r * 0.8);
    ctx.closePath();
    ctx.stroke();
  } else if (t === 2) { /* three dots in an L */
    var d = r * 0.55;
    var offs = [[-d, -d], [d, -d], [-d, d]];
    var k;
    for (k = 0; k < 3; k++) {
      ctx.beginPath();
      ctx.moveTo(cx + offs[k][0] + d * 0.28, cy + offs[k][1]);
      ctx.arc(cx + offs[k][0], cy + offs[k][1], d * 0.28, 0, TAU);
      ctx.fill();
    }
  } else if (t === 3) { /* arc and dot */
    ctx.beginPath();
    ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, -Math.PI * 0.75, Math.PI * 0.25); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.22, cy); ctx.arc(cx, cy, r * 0.22, 0, TAU); ctx.fill();
  } else if (t === 4) { /* square and diagonal */
    ctx.beginPath();
    ctx.strokeRect(cx - r, cy - r, 2 * r, 2 * r);
    ctx.beginPath();
    ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r); ctx.stroke();
  } else { /* two concentric circles */
    ctx.beginPath();
    ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.45, cy); ctx.arc(cx, cy, r * 0.45, 0, TAU); ctx.stroke();
  }
}
function drawPortrait(p, rect, progress) {
  var S = rect.w;
  /* Clip to the square: fan rays never escape onto the page ground. */
  ctx.save();
  ctx.beginPath(); ctx.rect(rect.x, rect.y, rect.w, rect.h); ctx.clip();
  var n = Math.floor(clamp(progress, 0, 1) * p.strokes.length);
  var i, st;
  for (i = 0; i < n; i++) {
    st = p.strokes[i];
    if (st.k === 'cell') drawCell(st.c, rect, S);
    else if (st.k === 'ray') drawRay(st, rect, S);
    else drawGlyph(p, rect, S);
  }
  ctx.restore();
}
function drawColophon(rect) {
  var titlePx = isPhone ? 17 : 20;
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var titleW = ctx.measureText('The Sempere Account').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 03').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = cxm - plateW / 2, plateY = rect.y + 10;
  ctx.fillStyle = PAPER;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Sempere Account', cxm, plateY + 7);
  ctx.fillStyle = rgba(INK_RGB, 0.75);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2006 · 07 · 03', cxm, plateY + 7 + titlePx + 3);
}
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  var cur = PARAMS[curIdx];
  var p = clamp((t - cycleStart) / PAINT_S, 0, 1);
  if (prevIdx < 0) {
    drawPortrait(cur, rect, p);
  } else if (t < cycleStart + PAINT_S) {
    /* Reading: previous portrait holds the left half, the new identity
       paints progressively into the right half. */
    var prev = PARAMS[prevIdx];
    var midX = rect.x + rect.w / 2;
    ctx.save();
    ctx.beginPath(); ctx.rect(rect.x, rect.y, rect.w / 2, rect.h); ctx.clip();
    drawPortrait(prev, rect, prevProgress);
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.rect(midX, rect.y, rect.w / 2, rect.h); ctx.clip();
    drawPortrait(cur, rect, p);
    ctx.restore();
    ctx.strokeStyle = rgba(INK_RGB, 0.8);
    ctx.lineWidth = Math.max(1.5, rect.w * 0.002);
    ctx.beginPath(); ctx.moveTo(midX, rect.y); ctx.lineTo(midX, rect.y + rect.h); ctx.stroke();
  } else if (t < cycleStart + PAINT_S + SETTLE_S) {
    /* Settle: the divider sweeps left and the new portrait takes the
       full frame. */
    var s = (t - cycleStart - PAINT_S) / SETTLE_S;
    s = s * s * (3 - 2 * s);
    var edge = rect.x + rect.w * 0.5 * (1 - s);
    var prev2 = PARAMS[prevIdx];
    ctx.save();
    ctx.beginPath(); ctx.rect(rect.x, rect.y, Math.max(0, edge - rect.x), rect.h); ctx.clip();
    drawPortrait(prev2, rect, prevProgress);
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.rect(edge, rect.y, rect.x + rect.w - edge, rect.h); ctx.clip();
    drawPortrait(cur, rect, 1);
    ctx.restore();
    if (s < 1) {
      ctx.strokeStyle = rgba(INK_RGB, 0.8);
      ctx.lineWidth = Math.max(1.5, rect.w * 0.002);
      ctx.beginPath(); ctx.moveTo(edge, rect.y); ctx.lineTo(edge, rect.y + rect.h); ctx.stroke();
    }
  } else {
    drawPortrait(cur, rect, 1);
  }
  drawColophon(rect);
}
/* ---- state ---- */
var curIdx = 0, prevIdx = -1, prevProgress = 1, cycleStart = 0;
function onTap() {
  if (reduced) {
    curIdx = (curIdx + 1) % IDENTITIES.length;
    prevIdx = -1; prevProgress = 1;
    cycleStart = lastT - PAINT_S;
    draw(lastT);
    return;
  }
  prevIdx = curIdx;
  prevProgress = clamp((lastT - cycleStart) / PAINT_S, 0, 1);
  curIdx = (curIdx + 1) % IDENTITIES.length;
  cycleStart = lastT;
  draw(lastT);
}
if (typeof canvas.addEventListener === 'function') canvas.addEventListener('pointerdown', onTap);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
/* Probe hook: parameter vectors, state, tap and forced-time draw. */
if (typeof window !== 'undefined') {
  window.__sempere = {
    identities: IDENTITIES,
    paramsFor: buildParams,
    params: PARAMS,
    state: function () { return { current: curIdx, prev: prevIdx, prevProgress: prevProgress, cycleStart: cycleStart, t: lastT }; },
    tap: onTap,
    drawAt: draw,
    PHASE0: PHASE0, PAINT_S: PAINT_S, SETTLE_S: SETTLE_S
  };
}
/* ---- frame one: fixed phase, identity 0 sixty percent read ---- */
size();
if (reduced) cycleStart = PHASE0 - PAINT_S;
draw(PHASE0);
if (!reduced) {
  var animT0 = PHASE0, startTs = null;
  (function loop(ts) {
    if (startTs === null) startTs = ts;
    var t = animT0 + (ts - startTs) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  });
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
