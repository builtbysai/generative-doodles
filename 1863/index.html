<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twenty-Six Little Deaths</title>
<style>
html, body { margin: 0; padding: 0; background: #C8A06B; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a kraft-paper world drawn in black pen and ink. One black
   umbrella opens at the start of each loop; beneath it, 26 tiny vignettes
   play in sequence, one per letter, each a small contained mechanism with
   its own little life: a bell shaken, a peach eaten, a tower clouded over,
   a bottle emptied. The umbrella closes when Z is done and the paper world
   resets for A again. The alphabet marches on its own; the viewer reads
   along. Watch only. */
var TAU = Math.PI * 2;
var GROUND = '#C8A06B';
var GROUND_LO = '#B98F57';
var GROUND_HI = '#D9B98A';
var PEACH = '#D08A4E';
var INK = '#1E1A16';
var UMBRELLA = '#141210';
var RED = '#A62B25';
var PLATE = '#F3E9D2';
var PLATE_LINE = 'rgba(30,26,22,0.35)';
var TITLE_INK = '#1E1A16';
var HINT_INK = '#5C4630';
var FRAME_T = 30.0;        /* fixed phase: letter M half played, umbrella open */
var PER_LETTER = 2.4;      /* seconds per vignette */
var LOOP_LEN = 26 * PER_LETTER;
var OPEN_T = 1.6;          /* umbrella opens in the first 1.6 s, closes in the last */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* seeded paper ticks: faint pen strokes scattered on the kraft ground */
var TICKS = (function () {
  var rng = mulberry32(1863), out = [], i;
  for (i = 0; i < 90; i++) {
    out.push({ x: rng(), y: rng(), a: rng() * TAU, l: 0.006 + rng() * 0.014 });
  }
  return out;
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function seg(x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function circ(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
  if (fill) ctx.fill(); else ctx.stroke();
}
function loopState(t) {
  var idx = Math.floor(t / PER_LETTER);
  if (idx > 25) idx = 25;
  var local = (t - idx * PER_LETTER) / PER_LETTER;
  var open = 1;
  if (t < OPEN_T) open = t / OPEN_T;
  else if (t > LOOP_LEN - OPEN_T) open = (LOOP_LEN - t) / OPEN_T;
  return { idx: idx, local: clamp(local, 0, 1), open: clamp(open, 0, 1) };
}
/* progress of vignette i: 0 idle, 1 done, in between while it plays */
function cellProgress(i, st) {
  if (i < st.idx) return 1;
  if (i > st.idx) return 0;
  return st.local;
}
/* ---- the umbrella, top center ---- */
function drawUmbrella(sc, st) {
  var fw = sc.w, fh = sc.h;
  var cx = sc.x + fw * 0.5;
  var cy = sc.y + fh * 0.185;
  var o = st.open;
  var rx = fw * 0.30 * (0.25 + 0.75 * o);
  var ry = fh * 0.075 * (0.35 + 0.65 * o);
  var apexY = cy - ry * 1.3;
  var handleY = sc.y + fh * 0.265;
  /* tip */
  ctx.strokeStyle = INK;
  ctx.lineWidth = Math.max(1.5, fw * 0.004);
  seg(cx, apexY - fh * 0.018, cx, apexY + fh * 0.004);
  /* canopy: one smooth dome with a scalloped lower edge */
  ctx.fillStyle = UMBRELLA;
  ctx.beginPath();
  ctx.moveTo(cx - rx, cy);
  ctx.quadraticCurveTo(cx, cy - ry * 2.6, cx + rx, cy);
  var n = 8, segW = rx * 2 / n, i, sx;
  for (i = 0; i < n; i++) {
    sx = cx + rx - i * segW;
    ctx.arc(sx - segW / 2, cy, segW / 2, 0, Math.PI, false);
  }
  ctx.closePath();
  ctx.fill();
  /* ribs, thin kraft lines from the apex to the scallops */
  ctx.strokeStyle = rgba(GROUND_HI, 0.5);
  ctx.lineWidth = Math.max(1, fw * 0.0018);
  var k;
  for (k = 1; k < 8; k++) {
    var fx = cx - rx + rx * 2 * k / 8;
    seg(cx, apexY + ry * 0.15, fx, cy - ry * 0.08);
  }
  /* tiny red bead at the tip */
  ctx.fillStyle = RED;
  circ(cx, apexY - fh * 0.02, Math.max(2, fw * 0.006), true);
  /* handle with a small hook at the bottom */
  ctx.strokeStyle = INK;
  ctx.lineWidth = Math.max(1.5, fw * 0.004);
  seg(cx, cy, cx, handleY);
  ctx.beginPath();
  ctx.moveTo(cx, handleY);
  ctx.arc(cx - fw * 0.012, handleY, fw * 0.012, 0, Math.PI, false);
  ctx.stroke();
}
/* ---- the march line: 26 ticks, red fill up to the active letter ---- */
function drawMarch(sc, st) {
  var fw = sc.w, fh = sc.h;
  var y = sc.y + fh * 0.295;
  var x0 = sc.x + fw * 0.03, x1 = sc.x + fw * 0.97;
  ctx.strokeStyle = rgba(INK, 0.55);
  ctx.lineWidth = Math.max(1, fw * 0.002);
  seg(x0, y, x1, y);
  var i, tx;
  for (i = 0; i < 26; i++) {
    tx = x0 + (x1 - x0) * (i + 0.5) / 26;
    ctx.strokeStyle = i <= st.idx ? RED : rgba(INK, 0.55);
    ctx.lineWidth = i === st.idx ? Math.max(2, fw * 0.004) : Math.max(1, fw * 0.002);
    seg(tx, y - fh * 0.008, tx, y + fh * 0.008);
  }
}
/* ---- the 26 vignettes. Each draws inside a cell centered at (cx, cy)
   with half-unit u. p is 0 idle, 1 done; t is global time for idle wobble. ---- */
function vBell(cx, cy, u, p, t, act) {
  var ang = 0;
  if (act) ang = Math.sin(p * 18) * 0.35 * (1 - p);
  else if (p >= 1) ang = 0.12;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, u * 0.06);
  ctx.beginPath(); ctx.moveTo(0, -u * 0.55);
  ctx.arc(0, -u * 0.1, u * 0.45, Math.PI, 0, false); ctx.stroke();
  seg(-u * 0.45, -u * 0.1, u * 0.45, -u * 0.1);
  seg(0, -u * 0.1, 0, u * 0.15);
  ctx.fillStyle = INK; circ(0, u * 0.28, u * 0.12, true);
  ctx.restore();
  if (act) {
    ctx.strokeStyle = rgba(INK, 0.7); ctx.lineWidth = Math.max(1, u * 0.04);
    seg(cx - u * 0.7, cy - u * 0.5, cx - u * 0.95, cy - u * 0.65);
    seg(cx + u * 0.7, cy - u * 0.5, cx + u * 0.95, cy - u * 0.65);
  }
}
function vPeach(cx, cy, u, p, t, act) {
  var r = u * 0.62;
  ctx.fillStyle = PEACH; ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, u * 0.05);
  circ(cx, cy, r, true);
  ctx.beginPath(); ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  seg(cx, cy - r, cx, cy - r * 0.35);
  ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.moveTo(cx, cy - r * 0.55);
  ctx.quadraticCurveTo(cx + u * 0.3, cy - r * 0.9, cx + u * 0.45, cy - r * 0.7);
  ctx.stroke();
  /* bites, eaten in one by one, in ground color */
  var bites = Math.floor(p * 4 + 0.001), i;
  var bx = [0.75, 0.95, 0.3, -0.55], by = [-0.45, 0.25, 0.85, 0.75];
  ctx.fillStyle = GROUND;
  for (i = 0; i < bites; i++) {
    circ(cx + bx[i] * r, cy + by[i] * r, r * 0.32, true);
  }
  if (p >= 1) {
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.moveTo(cx + u * 0.16, cy - u * 0.08);
    ctx.ellipse(cx, cy, u * 0.16, u * 0.22, 0.4, 0, TAU); ctx.fill();
  }
}
function vTower(cx, cy, u, p, t, act) {
  var w = u * 0.7, h = u * 1.15, x0 = cx - w / 2, y0 = cy + u * 0.6 - h;
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, u * 0.05);
  ctx.strokeRect(x0, y0, w, h);
  seg(x0, y0, x0 + w, y0);
  var i;
  for (i = 0; i < 3; i++) {
    ctx.fillStyle = INK;
    ctx.fillRect(x0 + w * (0.08 + i * 0.32), y0 - u * 0.14, w * 0.2, u * 0.14);
  }
  ctx.fillStyle = INK;
  ctx.fillRect(cx - u * 0.08, cy - u * 0.1, u * 0.16, u * 0.2);
  ctx.fillRect(cx - u * 0.08, cy + u * 0.2, u * 0.16, u * 0.2);
  /* cloud descends and thickens over the top */
  if (p > 0) {
    var cloudY = lerp(y0 - u * 0.7, y0 - u * 0.05, p);
    ctx.fillStyle = rgba(GROUND_HI, 0.55 + 0.45 * p);
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, u * 0.04);
    ctx.beginPath();
    ctx.moveTo(cx - u * 0.55, cloudY);
    ctx.arc(cx - u * 0.3, cloudY, u * 0.28, 0, TAU);
    ctx.moveTo(cx + u * 0.3, cloudY);
    ctx.arc(cx + u * 0.1, cloudY - u * 0.12, u * 0.32, 0, TAU);
    ctx.moveTo(cx + u * 0.55, cloudY);
    ctx.arc(cx + u * 0.35, cloudY, u * 0.24, 0, TAU);
    ctx.fill(); ctx.stroke();
  }
}
function vBottle(cx, cy, u, p, t, act) {
  var w = u * 0.55, h = u * 1.2, x0 = cx - w / 2, y0 = cy + u * 0.62 - h;
  var level = (1 - p) * h * 0.72;
  ctx.fillStyle = rgba(INK, 0.85);
  ctx.fillRect(x0, y0 + h - level, w, level);
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, u * 0.05);
  ctx.beginPath();
  ctx.moveTo(x0, y0 + h);
  ctx.lineTo(x0, y0 + h * 0.35);
  ctx.lineTo(x0 + w * 0.25, y0 + h * 0.18);
  ctx.lineTo(x0 + w * 0.25, y0);
  ctx.lineTo(x0 + w * 0.75, y0);
  ctx.lineTo(x0 + w * 0.75, y0 + h * 0.18);
  ctx.lineTo(x0 + w, y0 + h * 0.35);
  ctx.lineTo(x0 + w, y0 + h);
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = GROUND_HI;
  ctx.fillRect(x0 + w * 0.12, y0 + h * 0.5, w * 0.76, h * 0.22);
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, u * 0.04);
  ctx.strokeRect(x0 + w * 0.12, y0 + h * 0.5, w * 0.76, h * 0.22);
  seg(x0 + w * 0.12, y0 + h * 0.61, x0 + w * 0.88, y0 + h * 0.61);
  if (p >= 1) { ctx.fillStyle = INK; circ(cx + w * 0.7, cy + u * 0.75, u * 0.07, true); }
}
function vTap(cx, cy, u, p, t, act) {
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, u * 0.06);
  seg(cx - u * 0.7, cy - u * 0.5, cx + u * 0.7, cy - u * 0.5);
  seg(cx + u * 0.45, cy - u * 0.5, cx + u * 0.45, cy - u * 0.1);
  ctx.fillStyle = INK;
  ctx.fillRect(cx + u * 0.3, cy - u * 0.62, u * 0.3, u * 0.12);
  seg(cx + u * 0.45, cy - u * 0.62, cx + u * 0.45, cy - u * 0.85);
  ctx.fillStyle = INK; circ(cx + u * 0.45, cy - u * 0.88, u * 0.09, true);
  if (act || p >= 1) {
    var dy = act ? p * u * 0.9 : u * 0.9;
    var dr = u * (0.08 + 0.1 * Math.sin(p * Math.PI));
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.moveTo(cx + u * 0.45, cy - u * 0.02 + dy);
    ctx.ellipse(cx + u * 0.45, cy + u * 0.08 + dy, dr, dr * 1.4, 0, 0, TAU); ctx.fill();
  }
  if (p > 0.6) {
    ctx.strokeStyle = rgba(INK, 0.8); ctx.lineWidth = Math.max(1, u * 0.04);
    ctx.beginPath(); ctx.moveTo(cx + u * 0.45 - u * 0.4, cy + u * 0.95);
    ctx.ellipse(cx + u * 0.45, cy + u * 0.95, u * (0.15 + 0.35 * p), u * 0.1, 0, 0, TAU); ctx.stroke();
  }
}
function vKey(cx, cy, u, p, t, act) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(p * TAU * 2);
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, u * 0.06);
  circ(-u * 0.35, 0, u * 0.3, false);
  seg(-u * 0.05, 0, u * 0.75, 0);
  seg(u * 0.5, 0, u * 0.5, u * 0.28);
  seg(u * 0.68, 0, u * 0.68, u * 0.2);
  ctx.restore();
  /* spring coil tightens as the key turns */
  var cr = u * (0.55 - 0.2 * p);
  ctx.strokeStyle = rgba(INK, 0.7); ctx.lineWidth = Math.max(1, u * 0.04);
  ctx.beginPath(); ctx.moveTo(cx + cr, cy + u * 0.55);
  ctx.arc(cx, cy + u * 0.55, cr, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + cr * 0.6, cy + u * 0.55);
  ctx.arc(cx, cy + u * 0.55, cr * 0.6, 0, TAU); ctx.stroke();
}
function vCandle(cx, cy, u, p, t, act) {
  var h = u * 1.1 * (1 - p * 0.75), w = u * 0.3;
  var top = cy + u * 0.6 - h;
  ctx.fillStyle = PLATE; ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, u * 0.05);
  ctx.fillRect(cx - w / 2, top, w, h);
  ctx.strokeRect(cx - w / 2, top, w, h);
  seg(cx, top, cx, top - u * 0.18);
  var fl = act ? (0.75 + 0.25 * Math.sin(t * 9)) : (p >= 1 ? 0 : 0.9);
  if (fl > 0.05) {
    ctx.fillStyle = rgba(RED, 0.9 * fl);
    ctx.beginPath(); ctx.moveTo(cx, top - u * 0.55 * fl);
    ctx.quadraticCurveTo(cx + u * 0.16, top - u * 0.3, cx, top - u * 0.14);
    ctx.quadraticCurveTo(cx - u * 0.16, top - u * 0.3, cx, top - u * 0.55 * fl);
    ctx.fill();
  }
  if (p > 0.15) {
    ctx.fillStyle = rgba(PLATE, 0.9);
    ctx.beginPath(); ctx.moveTo(cx + u * 0.5, cy + u * 0.62);
    ctx.ellipse(cx, cy + u * 0.62, u * (0.2 + 0.45 * p), u * 0.12, 0, 0, TAU); ctx.fill();
  }
}
function vTop(cx, cy, u, p, t, act) {
  var slow = 1 - p * 0.85;
  var ang = act ? p * 20 * slow + t * 0.4 * slow : (p >= 1 ? 0.5 : 0);
  ctx.save(); ctx.translate(cx, cy);
  if (p >= 1) { ctx.rotate(Math.PI / 2); ctx.translate(0, u * 0.1); }
  else { ctx.rotate(Math.sin(ang) * 0.12 * (1 - p * 0.5)); }
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, u * 0.05);
  ctx.beginPath(); ctx.moveTo(cx - cx, -u * 0.7);
  ctx.lineTo(-u * 0.5, u * 0.35); ctx.lineTo(u * 0.5, u * 0.35); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -u * 0.7); ctx.lineTo(0, -u * 0.95); ctx.stroke();
  var i;
  for (i = 0; i < 3; i++) {
    var a2 = ang + i * TAU / 3;
    seg(Math.cos(a2) * u * 0.12, -u * 0.25 + Math.sin(a2) * u * 0.12,
        Math.cos(a2) * u * 0.4, u * 0.2 + Math.sin(a2) * u * 0.12);
  }
  ctx.restore();
  if (p >= 1) { seg(cx - u * 0.6, cy + u * 0.55, cx + u * 0.6, cy + u * 0.55); }
}
function vSeed(cx, cy, u, p, t, act) {
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, u * 0.05);
  ctx.beginPath(); ctx.moveTo(cx - u * 0.35, cy + u * 0.35);
  ctx.lineTo(cx + u * 0.35, cy + u * 0.35);
  ctx.lineTo(cx + u * 0.28, cy + u * 0.7);
  ctx.lineTo(cx - u * 0.28, cy + u * 0.7);
  ctx.closePath(); ctx.stroke();
  var grow = p < 0.6 ? p / 0.6 : 1 - (p - 0.6) / 0.4 * 0.55;
  var h = u * 0.85 * grow;
  var bend = p < 0.6 ? 0 : (p - 0.6) / 0.4 * u * 0.5;
  ctx.beginPath(); ctx.moveTo(cx, cy + u * 0.35);
  ctx.quadraticCurveTo(cx + bend * 0.4, cy + u * 0.35 - h * 0.6, cx + bend, cy + u * 0.35 - h);
  ctx.stroke();
  if (p > 0.25) {
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.moveTo(cx + bend - u * 0.3, cy + u * 0.35 - h * 0.55);
    ctx.ellipse(cx + bend - u * 0.2, cy + u * 0.35 - h * 0.55, u * 0.2, u * 0.09, -0.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + bend + u * 0.3, cy + u * 0.35 - h * 0.7);
    ctx.ellipse(cx + bend + u * 0.2, cy + u * 0.35 - h * 0.7, u * 0.2, u * 0.09, 0.5, 0, TAU); ctx.fill();
  }
  if (p < 0.15) { ctx.fillStyle = INK; circ(cx, cy + u * 0.3, u * 0.1, true); }
}
function vMatch(cx, cy, u, p, t, act) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.6);
  var charLen = p * u * 1.1;
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, u * 0.08);
  seg(-u * 0.6, 0, u * 0.6, 0);
  if (charLen > 0) {
    ctx.strokeStyle = UMBRELLA; ctx.lineWidth = Math.max(2.5, u * 0.1);
    seg(u * 0.6 - charLen, 0, u * 0.6, 0);
  }
  ctx.fillStyle = INK; circ(u * 0.68, 0, u * 0.1, true);
  ctx.restore();
  var fl = p < 0.5 ? p * 2 : (p < 0.85 ? 1 - (p - 0.5) / 0.35 * 0.6 : 0.4 * (1 - (p - 0.85) / 0.15));
  if (act && fl > 0.05) {
    var fx = cx + u * 0.62, fy = cy - u * 0.32;
    ctx.fillStyle = rgba(RED, 0.85 * fl);
    ctx.beginPath(); ctx.moveTo(fx, fy - u * 0.5 * fl);
    ctx.quadraticCurveTo(fx + u * 0.2, fy - u * 0.2, fx, fy);
    ctx.quadraticCurveTo(fx - u * 0.2, fy - u * 0.2, fx, fy - u * 0.5 * fl);
    ctx.fill();
  }
}
function vHourglass(cx, cy, u, p, t, act) {
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, u * 0.05);
  ctx.beginPath();
  ctx.moveTo(cx - u * 0.5, cy - u * 0.65);
  ctx.lineTo(cx + u * 0.5, cy - u * 0.65);
  ctx.lineTo(cx, cy);
  ctx.lineTo(cx + u * 0.5, cy + u * 0.65);
  ctx.lineTo(cx - u * 0.5, cy + u * 0.65);
  ctx.lineTo(cx, cy);
  ctx.closePath(); ctx.stroke();
  seg(cx - u * 0.55, cy - u * 0.65, cx + u * 0.55, cy - u * 0.65);
  seg(cx - u * 0.55, cy + u * 0.65, cx + u * 0.55, cy + u * 0.65);
  var topSand = (1 - p) * u * 0.5, botSand = p * u * 0.5;
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.moveTo(cx - u * 0.42, cy - u * 0.62);
  ctx.lineTo(cx + u * 0.42, cy - u * 0.62);
  ctx.lineTo(cx + u * 0.42 - topSand * 0.8, cy - u * 0.62 + topSand);
  ctx.lineTo(cx - u * 0.42 + topSand * 0.8, cy - u * 0.62 + topSand);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - u * 0.42, cy + u * 0.62);

  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Twenty-Six Little Deaths', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 17', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. The alphabet marches on its own.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var st = loopState(phaseT);
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* faint pen ticks on the kraft ground */
  ctx.strokeStyle = rgba(INK, 0.07);
  ctx.lineWidth = 1;
  var i;
  for (i = 0; i < TICKS.length; i++) {
    var tk = TICKS[i];
    var tx = sc.x + tk.x * sc.w, ty = sc.y + tk.y * sc.h;
    var tl = tk.l * Math.min(sc.w, sc.h);
    seg(tx, ty, tx + Math.cos(tk.a) * tl, ty + Math.sin(tk.a) * tl);
  }
  if (!isPhone) {
    ctx.strokeStyle = rgba(INK, 0.35);
    ctx.lineWidth = 1;
    ctx.strokeRect(sc.x + 0.5, sc.y + 0.5, sc.w - 1, sc.h - 1);
  }
  drawUmbrella(sc, st);
  drawMarch(sc, st);
  drawGrid(sc, st);
  drawPlates();
  void t;
}
/* ---- frame one: fixed phase t = 30.0 s, letter M half played, umbrella open ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % LOOP_LEN;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
