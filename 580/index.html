<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahora el Caballo</title>
<style>
  html, body { margin:0; padding:0; background:#F4EEDC; height:100%; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
'use strict';
var canvas = document.getElementById('piece');
var ctx = canvas.getContext('2d');

/* ---------- seeded RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rng = mulberry32(580070);

/* ---------- palette ---------- */
var INK = '#1A1A1A', PAPER = '#F4EEDC', WASH = '#B9B4A6', HORSE_BLUE = '#4A7AB8';
var THREAD = '#2A2320', ROSE = '#D9A08F', LIME = '#7ED321', YELLOW = '#F2C230';
var SKIN = '#C9B299';
var TONES = ['#8F8A7C','#7A7568','#A39E90','#6E6A5E','#98917F','#84796B','#5F5B52','#B0AA9C','#93826E','#767C74'];

/* ---------- stage ---------- */
var SW = 1000, SH = 720;
var PHASE0 = 0;
var lastT = PHASE0;

/* ---------- viewport ---------- */
var viewW = 0, viewH = 0, dpr = 1;
function isPhone(){
  var sw = (window.screen) ? Math.min(window.screen.width, window.screen.height) : 9999;
  if (sw < 700) return true;
  return viewH > viewW * 1.15;
}
function layout(){
  var s = isPhone() ? (viewW / SW) : Math.min(viewW / SW, viewH / SH);
  var w = SW * s, h = SH * s;
  return { s:s, x:(viewW - w) / 2, y:(viewH - h) / 2, w:w, h:h };
}
function resize(){
  var vv = window.visualViewport;
  viewW = vv ? vv.width : window.innerWidth;
  viewH = vv ? vv.height : window.innerHeight;
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw(lastT);
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

/* ---------- helpers ---------- */
function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); }
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function stitchStroke(){
  ctx.save();
  ctx.strokeStyle = THREAD; ctx.lineWidth = 3.4;
  ctx.setLineDash([11,8]); ctx.lineDashOffset = 0;
  ctx.stroke();
  ctx.restore();
}

/* ---------- colophon (sanctioned exception: real date at load) ---------- */
var DAYS = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
var MONTHS = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
var _now = new Date();
var COLOPHON = DAYS[_now.getDay()] + ' ' + _now.getDate() + ' DE ' + MONTHS[_now.getMonth()] + ' DE ' + _now.getFullYear() + '. ROSARIO';
var colJitter = [];
(function(){
  var jr = mulberry32(9157);
  for (var i = 0; i < COLOPHON.length; i++) colJitter.push({ dx:(jr()-0.5)*2.4, dy:(jr()-0.5)*3.0, rot:(jr()-0.5)*0.09 });
})();

/* ---------- state A crowd (generated once, seeded) ---------- */
var figures = [];
(function(){
  var rows = [
    { y:486, s:0.55, n:10 },
    { y:566, s:0.82, n:9 },
    { y:664, s:1.12, n:7 }
  ];
  for (var r = 0; r < rows.length; r++){
    for (var i = 0; i < rows[r].n; i++){
      var x = 30 + rng() * (SW - 60);
      if (r === 0 && x > 585 && x < 745) x = 300 + rng() * 200; /* keep the horse findable */
      figures.push({
        x:x, y:rows[r].y + (rng()-0.5)*10, s:rows[r].s * (0.92 + rng()*0.16),
        tone:TONES[Math.floor(rng()*TONES.length)],
        phase:rng()*Math.PI*2, speed:0.9 + rng()*1.1,
        walk: rng() > 0.45, hair: rng() > 0.4, skirt: rng() > 0.5
      });
    }
  }
})();
/* small horse in state A: body box for drawing + tapping */
var horseA = { x:668, base:490, w:96, h:58 };

/* cloth speckle for state B (precomputed, seeded) */
var speckles = [];
(function(){
  var sr = mulberry32(4242);
  for (var i = 0; i < 260; i++) speckles.push({ x:sr()*SW, y:sr()*SH, a:0.05 + sr()*0.08, l:3 + sr()*5, rot:sr()*Math.PI });
})();

/* ---------- state machine ---------- */
var START_STATE = 'A';
var state = START_STATE; /* A | toB | B | toA */
var transStart = 0;
var TRANS_DUR = 1.6;
var par = { x:0, y:0, tx:0, ty:0 };

/* ================= STATE A: crowded gouache plaza ================= */
function drawFigureA(f, t){
  var bob = Math.sin(t * f.speed + f.phase) * 2.0;
  var swing = f.walk ? Math.sin(t * f.speed * 2 + f.phase) * 6 : 0;
  ctx.save();
  ctx.translate(f.x, f.y + bob * 0.35);
  ctx.scale(f.s, f.s);
  ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  line(-5, -22, -5 + swing, 0);
  line( 5, -22,  5 - swing, 0);
  ctx.beginPath();
  if (f.skirt){
    ctx.moveTo(-6,-50); ctx.lineTo(6,-50); ctx.lineTo(12,-18); ctx.lineTo(-12,-18); ctx.closePath();
  } else {
    ctx.moveTo(-10,-50); ctx.lineTo(10,-50); ctx.lineTo(8,-20); ctx.lineTo(-8,-20); ctx.closePath();
  }
  ctx.fillStyle = f.tone; ctx.fill(); ctx.stroke();
  line(-9, -47, -14, -29 - swing * 0.5);
  line( 9, -47,  14, -29 + swing * 0.5);
  circle(0, -59, 7.6);
  ctx.fillStyle = SKIN; ctx.fill(); ctx.stroke();
  if (f.hair){
    ctx.beginPath(); ctx.arc(0, -61.5, 7.4, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath();
    ctx.fillStyle = INK; ctx.fill();
  }
  ctx.restore();
}
function drawHorseA(){
  var x = horseA.x, base = horseA.base;
  ctx.save();
  ctx.translate(x, base);
  ctx.fillStyle = 'rgba(26,26,26,0.10)';
  ctx.beginPath(); ctx.ellipse(0, 3, 52, 6, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.fillStyle = HORSE_BLUE;
  /* legs */
  var lx = [-30, -16, 22, 36];
  for (var i = 0; i < 4; i++){ rrect(lx[i]-3, -26, 6.5, 26, 3); ctx.fill(); ctx.stroke(); }
  /* tail */
  ctx.beginPath(); ctx.moveTo(-44,-46); ctx.quadraticCurveTo(-56,-30,-50,-8); ctx.stroke();
  /* body */
  ctx.beginPath(); ctx.ellipse(0, -40, 47, 17, 0, 0, Math.PI*2); ctx.fillStyle = HORSE_BLUE; ctx.fill(); ctx.stroke();
  /* neck + head */
  ctx.beginPath();
  ctx.moveTo(30,-50); ctx.lineTo(52,-66); ctx.lineTo(66,-60); ctx.lineTo(64,-50);
  ctx.lineTo(50,-46); ctx.lineTo(40,-34); ctx.closePath();
  ctx.fillStyle = HORSE_BLUE; ctx.fill(); ctx.stroke();
  /* ear + mane + eye */
  ctx.beginPath(); ctx.moveTo(50,-64); ctx.lineTo(53,-72); ctx.lineTo(57,-63); ctx.closePath();
  ctx.fillStyle = HORSE_BLUE; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(31,-51); ctx.quadraticCurveTo(40,-62,50,-65); ctx.stroke();
  circle(58, -57, 1.7); ctx.fillStyle = INK; ctx.fill();
  ctx.restore();
}
function drawA(t){
  /* sky + distant buildings (back layer) */
  ctx.save(); ctx.translate(par.x * 0.4, par.y * 0.4);
  ctx.fillStyle = PAPER; ctx.fillRect(-30, -30, SW + 60, SH + 60);
  ctx.fillStyle = WASH;
  var bx = [-20, 120, 285, 470, 640, 815, 950];
  var bh = [120, 165, 105, 150, 118, 158, 110];
  for (var i = 0; i < bx.length; i++){
    ctx.fillRect(bx[i], 300 - bh[i], 130, bh[i]);
    ctx.fillStyle = '#98917F'; ctx.fillRect(bx[i] - 4, 292 - bh[i], 138, 12); ctx.fillStyle = WASH;
    ctx.fillStyle = PAPER;
    for (var wy = 0; wy < 3; wy++) for (var wx = 0; wx < 3; wx++)
      if ((wx + wy + i) % 2 === 0) ctx.fillRect(bx[i] + 18 + wx * 38, 300 - bh[i] + 22 + wy * 38, 15, 20);
    ctx.fillStyle = WASH;
  }
  /* bunting */
  ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-20, 84); ctx.quadraticCurveTo(SW/2, 150, SW + 20, 78); ctx.stroke();
  var flagTones = ['#B9B4A6','#8F8A7C','#A39E90','#767C74','#98917F'];
  for (var f = 0; f < 13; f++){
    var u = (f + 0.5) / 13, fx = -20 + u * (SW + 40);
    var fy = (1-u)*(1-u)*84 + 2*(1-u)*u*150 + u*u*78;
    ctx.beginPath(); ctx.moveTo(fx - 11, fy); ctx.lineTo(fx + 11, fy + 2); ctx.lineTo(fx, fy + 26); ctx.closePath();
    ctx.fillStyle = flagTones[f % flagTones.length]; ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  /* plaza floor */
  ctx.fillStyle = '#D8D2C0'; ctx.fillRect(-30, 428, SW + 60, SH - 428 + 30);
  ctx.strokeStyle = 'rgba(26,26,26,0.16)'; ctx.lineWidth = 1.4;
  for (var gy = 470; gy < SH; gy += 44) line(-30, gy, SW + 30, gy + 6);
  /* stalls (mid layer) */
  ctx.save(); ctx.translate(par.x * 0.7, par.y * 0.7);
  var stalls = [ {x:96}, {x:330}, {x:806} ];
  for (var s2 = 0; s2 < stalls.length; s2++){
    var sx = stalls[s2].x;
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    line(sx, 388, sx, 486); line(sx + 118, 388, sx + 118, 486);
    for (var st = 0; st < 6; st++){
      ctx.beginPath();
      ctx.moveTo(sx - 10 + st * 24, 388); ctx.lineTo(sx + 2 + st * 24, 356);
      ctx.lineTo(sx + 14 + st * 24, 388); ctx.closePath();
      ctx.fillStyle = (st % 2 === 0) ? WASH : PAPER; ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#8F8A7C'; ctx.fillRect(sx - 4, 452, 126, 14);
    ctx.fillStyle = '#A39E90';
    for (var g = 0; g < 4; g++){ circle(sx + 18 + g * 28, 442, 7); ctx.fill(); }
  }
  ctx.restore();
  /* crowd + the small blue horse (front layer) */
  ctx.save(); ctx.translate(par.x, par.y);
  var sorted = figures.slice().sort(function(a,b){ return a.y - b.y; });
  var horseDrawn = false;
  for (var k = 0; k < sorted.length; k++){
    if (!horseDrawn && sorted[k].y > horseA.base + 6){ drawHorseA(); horseDrawn = true; }
    drawFigureA(sorted[k], t);
  }
  if (!horseDrawn) drawHorseA();
  ctx.restore();
  /* hint */
  ctx.fillStyle = 'rgba(26,26,26,0.45)';
  ctx.font = '600 19px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('tap', SW - 18, SH - 16);
  ctx.textAlign = 'left';
}

/* ================= STATE B: embroidered protagonist ================= */
var BANDS = [
  { h:96,  c:ROSE }, { h:44, c:PAPER }, { h:58, c:HORSE_BLUE }, { h:118, c:ROSE },
  { h:40, c:PAPER }, { h:92, c:ROSE }, { h:46, c:HORSE_BLUE }, { h:58, c:PAPER }, { h:104, c:ROSE }
];
function bigHorsePath(scaleY){
  /* body + neck + head as one appliqué silhouette, centered (500, baseline 566) */
  ctx.beginPath();
  ctx.moveTo(268, 386);
  ctx.bezierCurveTo(262, 330, 300, 296, 372, 288);   /* back */
  ctx.bezierCurveTo(440, 279, 520, 282, 566, 262);   /* toward shoulder */
  ctx.bezierCurveTo(596, 214, 626, 168, 668, 138);   /* neck up */
  ctx.lineTo(724, 158);                               /* forehead */
  ctx.lineTo(756, 216);                               /* muzzle front */
  ctx.quadraticCurveTo(758, 234, 738, 236);
  ctx.lineTo(688, 226);                               /* jaw */
  ctx.bezierCurveTo(664, 262, 646, 292, 640, 330);   /* throat/chest */
  ctx.bezierCurveTo(652, 372, 636, 402, 596, 410);   /* chest to belly */
  ctx.bezierCurveTo(520, 426, 400, 428, 330, 416);   /* belly */
  ctx.bezierCurveTo(292, 410, 272, 402, 268, 386);
  ctx.closePath();
}
function drawB(t){
  /* striped cloth ground */
  var y = 0, bi;
  for (bi = 0; bi < BANDS.length; bi++){
    ctx.fillStyle = BANDS[bi].c;
    ctx.fillRect(-30, y, SW + 60, BANDS[bi].h);
    y += BANDS[bi].h;
  }
  if (y < SH){ ctx.fillStyle = ROSE; ctx.fillRect(-30, y, SW + 60, SH - y); }
  /* fabric speckle */
  ctx.save();
  for (var sp = 0; sp < speckles.length; sp++){
    var s3 = speckles[sp];
    ctx.save(); ctx.translate(s3.x, s3.y); ctx.rotate(s3.rot);
    ctx.strokeStyle = 'rgba(42,35,32,' + s3.a.toFixed(3) + ')'; ctx.lineWidth = 1.3;
    line(-s3.l, 0, s3.l, 0);
    ctx.restore();
  }
  ctx.restore();
  /* stitched seams between bands */
  y = 0;
  ctx.save();
  ctx.strokeStyle = THREAD; ctx.lineWidth = 2.4; ctx.setLineDash([9,7]);
  for (bi = 0; bi < BANDS.length - 1; bi++){ y += BANDS[bi].h; line(-10, y, SW + 10, y); }
  ctx.restore();
  /* appliqué sun, top left */
  ctx.save(); ctx.translate(par.x * 0.4, par.y * 0.4);
  circle(96, 92, 34); ctx.fillStyle = YELLOW; ctx.fill(); stitchStrokePathOnly();
  ctx.strokeStyle = THREAD; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (var r2 = 0; r2 < 8; r2++){
    var a = r2 / 8 * Math.PI * 2;
    line(96 + Math.cos(a) * 44, 92 + Math.sin(a) * 44, 96 + Math.cos(a) * 58, 92 + Math.sin(a) * 58);
  }
  /* stitched stars */
  ctx.fillStyle = THREAD;
  var stars = [[300,70],[856,84],[916,190],[210,180]];
  for (var s4 = 0; s4 < stars.length; s4++) drawStar(stars[s4][0], stars[s4][1], 9);
  ctx.restore();
  /* the horse, large */
  ctx.save(); ctx.translate(par.x, par.y);
  var breathe = 1 + Math.sin(t * 0.9) * 0.004;
  ctx.translate(500, 350); ctx.scale(1, breathe); ctx.translate(-500, -350);
  /* ground shadow */
  ctx.fillStyle = 'rgba(42,35,32,0.13)';
  ctx.beginPath(); ctx.ellipse(498, 574, 268, 17, 0, 0, Math.PI*2); ctx.fill();
  /* tail (behind body) */
  ctx.strokeStyle = THREAD; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(272, 320);
  ctx.quadraticCurveTo(214 + Math.sin(t * 1.3) * 5, 400, 232, 500); ctx.stroke();
  ctx.lineWidth = 5;
  for (var ts = 0; ts < 5; ts++){
    ctx.strokeStyle = (ts % 2 === 0) ? LIME : YELLOW;
    ctx.beginPath(); ctx.moveTo(230 + ts * 3, 486 + ts * 4);
    ctx.quadraticCurveTo(222 + ts * 4, 522, 236 + ts * 5, 548); ctx.stroke();
  }
  /* far legs */
  ctx.fillStyle = HORSE_BLUE;
  var farLegs = [[330,404],[596,404]];
  for (var fl = 0; fl < farLegs.length; fl++){
    rrect(farLegs[fl][0], farLegs[fl][1], 27, 138, 11); ctx.fill(); stitchStrokePathOnly();
    ctx.fillStyle = THREAD; rrect(farLegs[fl][0] - 3, 528, 33, 20, 6); ctx.fill();
    ctx.fillStyle = HORSE_BLUE;
  }
  /* body silhouette */
  bigHorsePath(); ctx.fillStyle = HORSE_BLUE; ctx.fill(); stitchStrokePathOnly();
  /* near legs */
  var nearLegs = [[366,408],[556,408]];
  for (var nl = 0; nl < nearLegs.length; nl++){
    rrect(nearLegs[nl][0], nearLegs[nl][1], 30, 140, 12); ctx.fillStyle = HORSE_BLUE; ctx.fill(); stitchStrokePathOnly();
    ctx.fillStyle = THREAD; rrect(nearLegs[nl][0] - 3, 532, 36, 20, 6); ctx.fill();
  }
  /* cream chest patch */
  ctx.beginPath();
  ctx.moveTo(612, 318); ctx.bezierCurveTo(646, 330, 650, 372, 624, 404);
  ctx.bezierCurveTo(606, 380, 602, 348, 612, 318); ctx.closePath();
  ctx.fillStyle = PAPER; ctx.fill(); stitchStrokePathOnly();
  /* saddle blanket appliqué */
  rrect(398, 292, 168, 104, 14); ctx.fillStyle = ROSE; ctx.fill(); stitchStrokePathOnly();
  ctx.save();
  ctx.strokeStyle = PAPER; ctx.lineWidth = 2.6; ctx.setLineDash([7,6]);
  rrect(414, 308, 136, 72, 10); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = YELLOW;
  var dia = [[482,326],[448,352],[516,352],[482,378]];
  for (var dd = 0; dd < dia.length; dd++) drawStar(dia[dd][0], dia[dd][1], 8);
  /* decorative cross stitches on the body */
  ctx.strokeStyle = PAPER; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  var crosses = [[330,330],[356,368],[610,300],[352,300]];
  for (var cx = 0; cx < crosses.length; cx++){
    line(crosses[cx][0]-6, crosses[cx][1]-6, crosses[cx][0]+6, crosses[cx][1]+6);
    line(crosses[cx][0]-6, crosses[cx][1]+6, crosses[cx][0]+6, crosses[cx][1]-6);
  }
  /* ear */
  ctx.beginPath(); ctx.moveTo(652, 148); ctx.lineTo(664, 106); ctx.lineTo(684, 140); ctx.closePath();
  ctx.fillStyle = HORSE_BLUE; ctx.fill(); stitchStrokePathOnly();
  /* neon mane: strands of floss along the neck */
  ctx.lineCap = 'round';
  for (var m2 = 0; m2 < 15; m2++){
    var u2 = m2 / 14;
    var mx = 668 - u2 * 118 + Math.sin(t * 1.6 + m2) * 1.6;
    var my = 140 + u2 * 148;
    ctx.strokeStyle = (m2 % 2 === 0) ? LIME : YELLOW;
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(mx, my);
    ctx.quadraticCurveTo(mx - 22, my + 16, mx - 15, my + 40); ctx.stroke();
  }
  /* face: eye, nostril, mouth */
  circle(706, 182, 6); ctx.fillStyle = THREAD; ctx.fill();
  circle(708, 180, 2); ctx.fillStyle = PAPER; ctx.fill();
  ctx.strokeStyle = THREAD; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(736, 214, 5, 0.4, 2.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(700, 232); ctx.quadraticCurveTo(722, 238, 742, 230); ctx.stroke();
  ctx.restore();
  /* grass tufts + flowers along the bottom */
  ctx.save(); ctx.translate(par.x * 1.0, par.y * 1.0);
  ctx.lineCap = 'round';
  var tufts = [70, 150, 838, 922, 786];
  for (var tf = 0; tf < tufts.length; tf++){
    ctx.strokeStyle = LIME; ctx.lineWidth = 4.5;
    line(tufts[tf], 640, tufts[tf] - 7, 612);
    line(tufts[tf] + 9, 640, tufts[tf] + 10, 610);
    line(tufts[tf] + 18, 640, tufts[tf] + 26, 614);
  }
  var flowers = [[112, 618, ROSE], [880, 622, YELLOW], [238, 630, ROSE]];
  for (var fw = 0; fw < flowers.length; fw++){
    for (var pt = 0; pt < 5; pt++){
      var pa = pt / 5 * Math.PI * 2;
      circle(flowers[fw][0] + Math.cos(pa) * 8, flowers[fw][1] + Math.sin(pa) * 8, 6.5);
      ctx.fillStyle = flowers[fw][2]; ctx.fill();
    }
    circle(flowers[fw][0], flowers[fw][1], 4.5); ctx.fillStyle = THREAD; ctx.fill();
  }
  ctx.restore();
  /* colophon band */
  ctx.fillStyle = PAPER; ctx.fillRect(-30, SH - 66, SW + 60, 66);
  ctx.save();
  ctx.strokeStyle = THREAD; ctx.lineWidth = 2.4; ctx.setLineDash([9,7]);
  line(-10, SH - 66, SW + 10, SH - 66);
  line(-10, SH - 8, SW + 10, SH - 8);
  ctx.restore();
  drawColophon();
}
function stitchStrokePathOnly(){ stitchStroke(); }
function drawStar(x, y, r){
  ctx.beginPath();
  for (var i = 0; i < 10; i++){
    var ang = -Math.PI/2 + i * Math.PI / 5, rad = (i % 2 === 0) ? r : r * 0.45;
    var px = x + Math.cos(ang) * rad, py = y + Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}
function drawColophon(){
  ctx.save();
  ctx.font = '700 27px "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive';
  ctx.fillStyle = THREAD;
  var widths = [], total = 0, i, wch;
  for (i = 0; i < COLOPHON.length; i++){ wch = ctx.measureText(COLOPHON[i]).width; widths.push(wch); total += wch + 1.5; }
  var x = (SW - total) / 2, baseY = SH - 24;
  for (i = 0; i < COLOPHON.length; i++){
    var j = colJitter[i];
    ctx.save();
    ctx.translate(x + widths[i] / 2 + j.dx, baseY + j.dy);
    ctx.rotate(j.rot);
    ctx.textAlign = 'center';
    ctx.fillText(COLOPHON[i], 0, 0);
    ctx.restore();
    x += widths[i] + 1.5;
  }
  ctx.restore();
}

/* ================= dispatch + transition ================= */
function drawCurrent(t){
  if (state === 'A') drawA(t);
  else if (state === 'B') drawB(t);
  else {
    var target = (state === 'toB') ? 'B' : 'A';
    var p = Math.min(1, (t - transStart) / TRANS_DUR);
    if (p >= 1){
      state = target;
      drawCurrent(t);
      return;
    }
    var e = p * p * (3 - 2 * p);
    if (target === 'B') drawA(t); else drawB(t);
    ctx.save();
    ctx.beginPath();
    if (target === 'B') ctx.rect(0, 0, SW * e, SH); else ctx.rect(SW * (1 - e), 0, SW * e, SH);
    ctx.clip();
    if (target === 'B') drawB(t); else drawA(t);
    ctx.restore();
    /* stitch edge at the wipe boundary */
    var edgeX = (target === 'B') ? SW * e : SW * (1 - e);
    ctx.save();
    ctx.strokeStyle = THREAD; ctx.lineWidth = 3.4; ctx.setLineDash([12,9]);
    ctx.lineDashOffset = -t * 260;
    line(edgeX, -6, edgeX, SH + 6);
    ctx.restore();
    /* dashed sweep lines early in the transition */
    if (p < 0.55){
      ctx.save();
      ctx.globalAlpha = (0.55 - p) / 0.55 * 0.8;
      ctx.strokeStyle = THREAD; ctx.lineWidth = 2.6; ctx.setLineDash([14,10]);
      ctx.lineDashOffset = -t * 420;
      var sweepY = [150, 300, 450, 580];
      for (var sy = 0; sy < sweepY.length; sy++) line(-10, sweepY[sy], SW + 10, sweepY[sy]);
      ctx.restore();
    }
  }
}
function draw(t){
  lastT = t;
  canvas.style.width = viewW + 'px';
  canvas.style.height = viewH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, viewW, viewH);
  var L = layout();
  ctx.save();
  ctx.translate(L.x, L.y);
  ctx.scale(L.s, L.s);
  ctx.beginPath(); ctx.rect(0, 0, SW, SH); ctx.clip();
  par.x += (par.tx - par.x) * 0.08;
  par.y += (par.ty - par.y) * 0.08;
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, SW, SH);
  drawCurrent(t);
  ctx.restore();
}

/* ================= interaction ================= */
var pdown = null;
function toStage(cx, cy){
  var L = layout();
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left:0, top:0 };
  return { x: ((cx - r.left) - L.x) / L.s, y: ((cy - r.top) - L.y) / L.s };
}
function onDown(e){
  var p = toStage(e.clientX, e.clientY);
  pdown = { x:p.x, y:p.y, cx:e.clientX, cy:e.clientY, dragged:false, parX:par.tx, parY:par.ty };
}
function onMove(e){
  if (!pdown) return;
  var dx = e.clientX - pdown.cx, dy = e.clientY - pdown.cy;
  if (Math.abs(dx) + Math.abs(dy) > 10) pdown.dragged = true;
  if (pdown.dragged){
    var L = layout();
    par.tx = Math.max(-16, Math.min(16, pdown.parX + dx / L.s * 0.45));
    par.ty = Math.max(-10, Math.min(10, pdown.parY + dy / L.s * 0.45));
  }
}
function onUp(e){
  if (!pdown) return;
  var wasDrag = pdown.dragged;
  var p = toStage(e.clientX, e.clientY);
  pdown = null;
  par.tx = 0; par.ty = 0;
  if (wasDrag) return;
  if (state === 'A'){
    if (p.x > horseA.x - 62 && p.x < horseA.x + 76 && p.y > horseA.base - horseA.h - 26 && p.y < horseA.base + 14){
      state = 'toB'; transStart = lastT;
    }
  } else if (state === 'B'){
    state = 'toA'; transStart = lastT;
  }
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', function(){ pdown = null; par.tx = 0; par.ty = 0; });

/* ================= boot + loop ================= */
resize();
var startStamp = null;
function tick(now){
  if (startStamp === null) startStamp = now;
  draw(PHASE0 + (now - startStamp) / 1000);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
</script>
