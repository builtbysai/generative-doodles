<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1977 One Hard Source</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1977 One Hard Source, CR2 / PP1224, study #258 ciara-reddy.
  // Near-darkness. A single hard light throws one bright plane
  // into the frame: a white tank top, bare skin, a raised glass.
  // Everything else is shadow. Figures move through the light
  // mid-gesture, an arm thrown up, a head thrown back, and each
  // crossing flares the frame until the image nearly burns out,
  // then falls back into dark. The light is not illumination;
  // it is the figure's partner. Watch-only: the timing of the
  // crossings is the timing of the piece.
  var BLACK = '#050505';   // pitch black ground
  var WARM = '#fff4dd';    // blown warm white
  var GOLD = '#f2d28a';    // flare, pale gold
  var SKIN = '#f7d9b0';    // skin in hard highlight

  // Fixed-phase first frame: FIRST_T = 9.3 s. The cycle is 32 s.
  // At t = 9.3 the third figure is mid-crossing, arm thrown up,
  // flare about 0.65, so the first frame shows the bright plane
  // with a figure caught inside it, skin and tank top lit hard.
  var FIRST_T = 9.3;
  var CYCLE = 32;
  var SEED = 1977;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgba(r, g, b, a) {
    return 'rgba(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ',' + a4(a) + ')';
  }
  function mix(a, b, f) { return a + (b - a) * f; }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.planeW = W * 0.34;
    L.planeH = H * 0.80;
    L.planeX = (W - L.planeW) / 2;
    L.planeY = H * 0.10;
    L.floorY = H * 0.88;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Figures ---------------------------------------------------
  // Three figure agents on looping gesture cycles. Each sweeps
  // across the frame on its own period and phase; the arm rises
  // and the head throws back as the figure nears the light.
  // The source itself is never drawn as an object, only its
  // effect: the bright plane and the flare.
  var AGENTS = [
    { period: 13, phase: 0.00, amp: 0.40, size: 1.00, glass: true },
    { period: 17, phase: 0.31, amp: 0.38, size: 0.88, glass: false },
    { period: 11, phase: 0.62, amp: 0.41, size: 1.08, glass: true }
  ];

  function agentState(i, t) {
    var a = AGENTS[i];
    var u = ((t / a.period) + a.phase) % 1;
    var ang = u * Math.PI * 2;
    var cx = W / 2;
    var x = cx + Math.sin(ang) * W * a.amp;
    // Crossing factor: 1 when the figure is dead center in the
    // plane, falling off as it leaves the light.
    var d = Math.abs(x - cx) / (L.planeW * 0.5);
    var cross = Math.exp(-d * d * 1.6);
    // Gesture: arm thrown up and head thrown back peak at the
    // crossing, eased in and out over the sweep.
    var gest = smooth(1 - d * 0.9);
    var bob = Math.sin(ang * 2 + i * 2.1) * H * 0.012;
    var y = L.floorY + bob; // torso hem sits on the floor line
    return { x: x, y: y, size: a.size, cross: cross, gest: gest, glass: a.glass, idx: i };
  }

  // Flare: the sum of the crossings, plus a slow breathing of
  // the source itself. Exposure is keyed to the brightest
  // pixel, so a crossing pushes the frame toward white.
  function flareAt(t) {
    var f = 0.12 + 0.06 * Math.sin(t * 0.35);
    var i;
    for (i = 0; i < AGENTS.length; i++) {
      f += agentState(i, t).cross * 0.85;
    }
    return clamp(f, 0, 1.6);
  }
  function cycleState(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    return { p: p, flare: flareAt(t) };
  }

  // ---- Drawing ---------------------------------------------------
  function drawPlane(flare) {
    var i;
    // The bright plane: hard warm-white core with soft falloff
    // at its edges, built from layered translucent slabs so
    // the edge reads as light spilling, not a drawn rectangle.
    var core = 0.55 + 0.45 * clamp(flare, 0, 1);
    ctx.fillStyle = rgba(255, 244, 221, core);
    ctx.fillRect(L.planeX, L.planeY, L.planeW, L.planeH);
    for (i = 1; i <= 4; i++) {
      var pad = i * W * 0.012;
      ctx.fillStyle = rgba(255, 240, 210, a4(0.10 * (1 - i * 0.18) * (0.5 + 0.5 * flare)));
      ctx.fillRect(L.planeX - pad, L.planeY, L.planeW + pad * 2, L.planeH);
    }
  }

  function drawFigure(s, flare) {
    var u = s.size;
    var fw = W * 0.075 * u;      // torso half width
    var th = H * 0.26 * u;       // torso height
    var hx = s.x, hy = s.y - th - H * 0.045 * u; // head center
    var hr = W * 0.042 * u;
    // Light on the figure: in the plane the tank top and skin
    // blow out to warm white; in shadow the figure is a barely
    // visible dark shape, a few points lighter than the ground.
    var lit = s.cross;
    var skinR = mix(26, 247, lit), skinG = mix(24, 217, lit), skinB = mix(22, 176, lit);
    var topR = mix(30, 255, lit), topG = mix(28, 244, lit), topB = mix(26, 221, lit);
    var darkR = mix(14, 40, lit);

    // Raised arm: from the shoulder, thrown up as the gesture
    // peaks; the forearm angle follows the same gesture.
    var shX = s.x + fw * 0.8, shY = s.y - th * 0.92;
    var armAng = -Math.PI / 2 - 0.5 + s.gest * 0.9; // up, sweeping outward
    var armLen = H * 0.20 * u;
    var elX = shX + Math.cos(armAng) * armLen * 0.55;
    var elY = shY + Math.sin(armAng) * armLen * 0.55;
    var haX = elX + Math.cos(armAng - 0.35 + s.gest * 0.3) * armLen * 0.45;
    var haY = elY + Math.sin(armAng - 0.35 + s.gest * 0.3) * armLen * 0.45;

    ctx.lineCap = 'round';
    // Back arm, dimmer, hanging low and tucked to the body.
    ctx.strokeStyle = rgba(skinR, skinG, skinB, a4(0.30 + 0.45 * lit));
    ctx.lineWidth = Math.max(2, W * 0.010 * u);
    ctx.beginPath();
    ctx.moveTo(s.x - fw * 0.55, s.y - th * 0.9);
    ctx.lineTo(s.x - fw * 0.85, s.y - th * 0.55);
    ctx.stroke();

    // Tank top torso: a bright slab when lit, a barely-there
    // dark slab in shadow, so shadow figures stay in the dark.
    ctx.fillStyle = rgba(topR, topG, topB, a4(0.10 + 0.90 * lit));
    ctx.beginPath();
    ctx.moveTo(s.x - fw, s.y);
    ctx.lineTo(s.x - fw * 0.82, s.y - th);
    ctx.lineTo(s.x + fw * 0.82, s.y - th);
    ctx.lineTo(s.x + fw, s.y);
    ctx.closePath();
    ctx.fill();
    // Tank straps.
    ctx.strokeStyle = rgba(topR, topG, topB, a4(0.10 + 0.90 * lit));
    ctx.lineWidth = Math.max(2, W * 0.010 * u);
    ctx.beginPath();
    ctx.moveTo(s.x - fw * 0.62, s.y - th);
    ctx.lineTo(s.x - fw * 0.55, s.y - th - H * 0.02 * u);
    ctx.moveTo(s.x + fw * 0.62, s.y - th);
    ctx.lineTo(s.x + fw * 0.55, s.y - th - H * 0.02 * u);
    ctx.stroke();

    // Raised arm in hard highlight, with a pale gold rim.
    ctx.strokeStyle = rgba(skinR, skinG, skinB, a4(0.4 + 0.6 * lit));
    ctx.lineWidth = Math.max(2.5, W * 0.016 * u);
    ctx.beginPath();
    ctx.moveTo(shX, shY);
    ctx.lineTo(elX, elY);
    ctx.lineTo(haX, haY);
    ctx.stroke();

    // Head thrown back: the head circle shifts up and back with
    // the gesture, skin catching the light.
    var headX = hx - s.gest * W * 0.012 * u;
    var headY = hy - s.gest * H * 0.018 * u;
    ctx.fillStyle = rgba(skinR, skinG, skinB, a4(0.15 + 0.85 * lit));
    ctx.beginPath();
    ctx.moveTo(headX + hr, headY);
    ctx.arc(headX, headY, hr, 0, Math.PI * 2);
    ctx.fill();
    // Hair: a dark cap, darker than the skin even when lit.
    ctx.fillStyle = rgba(16, 14, 12, a4(0.85));
    ctx.beginPath();
    ctx.moveTo(headX - hr, headY - hr * 0.15);
    ctx.arc(headX, headY - hr * 0.1, hr * 1.02, Math.PI * 0.95, Math.PI * 2.05);
    ctx.closePath();
    ctx.fill();

    // Raised glass in the lifted hand: a small bright block
    // that glints hardest at the crossing.
    if (s.glass) {
      var gw = W * 0.020 * u, gh = H * 0.038 * u;
      var glint = clamp(s.cross * 1.2 + flare * 0.3, 0, 1);
      ctx.fillStyle = rgba(255, 250, 235, a4(0.25 + 0.75 * glint));
      ctx.fillRect(haX - gw / 2, haY - gh - H * 0.01 * u, gw, gh);
      ctx.fillStyle = rgba(242, 210, 138, a4(0.9 * glint));
      ctx.beginPath();
      ctx.moveTo(haX + gw * 0.4, haY - gh * 0.6);
      ctx.arc(haX + gw * 0.2, haY - gh * 0.5, Math.max(1.5, W * 0.006 * u), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBloom(cx, cy, flare) {
    // Flare bloom: one smooth radial falloff in pale gold from
    // wherever the plane is crossed, plus a warm core. A single
    // gradient, not rings, so no banding shows in the halo.
    var maxR = W * 0.55;
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
    g.addColorStop(0, rgba(242, 210, 138, a4(0.28 * flare)));
    g.addColorStop(0.4, rgba(242, 210, 138, a4(0.10 * flare)));
    g.addColorStop(1, rgba(242, 210, 138, 0));
    ctx.fillStyle = g;
    ctx.fillRect(cx - maxR, cy - maxR, maxR * 2, maxR * 2);
    var coreR = W * 0.10 * (0.5 + flare);
    ctx.fillStyle = rgba(255, 244, 221, a4(0.30 * clamp(flare, 0, 1)));
    ctx.beginPath();
    ctx.moveTo(cx + coreR, cy);
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var cs = cycleState(t);
    var flare = cs.flare;

    // Ground: pitch black. Nothing is lit evenly at any point.
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);

    // The bright plane always sits center.
    drawPlane(flare);

    // Figures, farthest first, each finding the light.
    var i, states = [];
    for (i = 0; i < AGENTS.length; i++) { states.push(agentState(i, t)); }
    states.sort(function (a, b) { return a.size - b.size; });
    for (i = 0; i < states.length; i++) { drawFigure(states[i], flare); }

    // Flare blooms outward from the brightest crossing.
    var best = states[0], bi;
    for (bi = 1; bi < states.length; bi++) {
      if (states[bi].cross > best.cross) { best = states[bi]; }
    }
    if (best.cross > 0.15) {
      drawBloom(best.x, best.y - H * 0.28 * best.size, best.cross * (0.6 + 0.4 * flare));
    }

    // Exposure wash: crossings push the whole frame toward
    // white, keyed to the brightest pixel. At peak flare the
    // image nearly burns out, then falls back into dark.
    var wash = clamp((flare - 0.55) * 0.85, 0, 0.62);
    if (wash > 0) {
      ctx.fillStyle = rgba(255, 246, 226, a4(wash));
      ctx.fillRect(0, 0, W, H);
    }

    // Grain: fixed-seed dots, the only texture in the dark.
    var rng = mulberry32(SEED * 13 + 5);
    for (i = 0; i < 220; i++) {
      var gx = rng() * W, gy = rng() * H;
      var gr = 0.7 + rng() * 1.3;
      ctx.fillStyle = rgba(200, 190, 170, a4(0.05 + rng() * 0.10));
      ctx.beginPath();
      ctx.moveTo(gx + gr, gy);
      ctx.arc(gx, gy, gr, 0, Math.PI * 2);
      ctx.fill();
    }

    // Caption, top left, and date; hint, bottom center.
    // The caption stays readable on black and on near-white.
    var cap = flare > 1.0 ? 'rgba(40,36,30,0.85)' : 'rgba(210,200,180,0.85)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = cap;
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1977 · One Hard Source', W * 0.04, H * 0.055);
    ctx.font = L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2007 · 06 · 11', W * 0.04, H * 0.055 + L.fsCap * 1.5);
    ctx.textAlign = 'center';
    ctx.fillStyle = cap;
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch bodies find the light.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1977 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1977 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return cycleState(t); },
      flare: function (t) { return cycleState(t).flare; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: figures sweep through the light on looping
  // gesture cycles; crossings flare the frame toward white and
  // it falls back into dark. Watch-only, no interaction.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
