<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hyperobject Acts</title>
<style>
  html, body { margin: 0; padding: 0; background: #070707; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- Hyperobject Acts — Antonio Roberts study AR6 (Hyperobject, 2022) ----------
  // A four-part climate-grief narrative (with Samiir Saunders) carried by
  // structure alone: one dark scanline field, four glitch regimes, hard cuts.
  //   Act 1 DENIAL       (0-5s)   almost clean, gray micro-tears
  //   Act 2 DESPAIR      (5-10s)  full databend chaos, pink/cyan
  //   Act 3 ACCEPTANCE   (10-15s) tears regularize into rhythmic green bands
  //   Act 4 DEFIANT HOPE (15-20s) bands lock into a rising yellow diagonal
  // Every row's state is a closed-form function of (act, row, actTime) from
  // seeded tables. No parameter ever blends across an act boundary: the act
  // index selects the regime, and the regime changes in one frame.

  var T0 = 12.4;                 // fixed phase: inside Act 3 (acceptance)
  var LOOP = 20, ACT_LEN = 5;
  var ROWS = 96;
  var BG = '#070707';
  var SCAN = '#141414';          // base scanline tone, present in every act
  var DENIAL_SHADES = ['#1E1E1E', '#242424', '#2A2A2A'];
  var GREEN_SHADES = ['#335C00', '#4F7D00', '#66A300', '#7CFF00'];
  var PINK = '#FF2E88', CYAN = '#00F0FF', HOPE = '#FFD800';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded rng + integer hash ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashN(a, b, c) {
    var h = Math.imul(a + 11, 0x8da6b343) ^ Math.imul(b + 7, 0xd8163841) ^ Math.imul(c + 3, 0xcb1ab31f);
    h = Math.imul(h ^ (h >>> 13), 0x165667b1);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  // ---------- row content: seeded flat runs per row (band structure, not dots) ----------
  var rowSegs = [];
  (function buildRows() {
    for (var r = 0; r < ROWS; r++) {
      var rng = mulberry32(1157000 + r * 131);
      var segs = [];
      var x = rng() * 0.08;
      var n = 2 + Math.floor(rng() * 4);
      for (var i = 0; i < n; i++) {
        var len = 0.05 + rng() * 0.22;
        if (x + len > 1) len = 1 - x;
        if (len <= 0.01) break;
        segs.push({ x: x, len: len, tone: 0.35 + rng() * 0.65 });
        x += len + 0.03 + rng() * 0.16;
        if (x >= 0.99) break;
      }
      if (!segs.length) segs.push({ x: 0.1, len: 0.3, tone: 0.6 });
      rowSegs.push(segs);
    }
  })();

  // ---------- Act 1: seeded micro-tear events (row, window, offset) ----------
  var denialEvents = [];
  (function buildDenial() {
    var rng = mulberry32(1157101);
    for (var i = 0; i < 16; i++) {
      denialEvents.push({
        row: Math.floor(rng() * ROWS),
        start: rng() * 4.4,
        dur: 0.25 + rng() * 0.6,
        off: (2 + rng() * 4) * (rng() > 0.5 ? 1 : -1)   // px at fw=1000 scale
      });
    }
  })();

  // ---------- Act 2: seeded burst rects ----------
  var bursts = [];
  (function buildBursts() {
    var rng = mulberry32(1157202);
    for (var i = 0; i < 26; i++) {
      bursts.push({
        x: rng() * 0.85,
        w: 0.04 + rng() * 0.13,
        row: Math.floor(rng() * (ROWS - 8)),
        span: 2 + Math.floor(rng() * 6),
        start: rng() * 4.5,
        dur: 0.15 + rng() * 0.4,
        color: rng() > 0.5 ? PINK : CYAN
      });
    }
  })();

  // ---------- viewport / sizing ----------
  var W = 0, H = 0, DPR = 1;
  function viewSize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 800);
    var h = vv ? vv.height : (window.innerHeight || 600);
    return { w: w, h: h };
  }
  function isPhone() {
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr && scr.width && scr.height) {
      if (Math.min(scr.width, scr.height) < 700) return true;
    }
    return H > W * 1.15;
  }
  function fit() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  fit();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', fit);
  }
  window.addEventListener('resize', fit);

  // ---------- rect batching (color|alpha -> flat rect list) ----------
  var batch = {};
  function pushRect(key, x, y, w, h) {
    if (w <= 0 || h <= 0) return;
    (batch[key] || (batch[key] = [])).push(x, y, w, h);
  }
  // one run in normalized field coords, wrapped at the field edges
  function pushRun(key, x0n, lenN, yPx, hPx, g) {
    var a = x0n % 1; if (a < 0) a += 1;
    var end = a + lenN;
    pushRect(key, g.ox + a * g.fw, yPx, Math.min(end, 1) * g.fw - a * g.fw, hPx);
    if (end > 1) pushRect(key, g.ox, yPx, (end - 1) * g.fw, hPx);
  }
  function flush() {
    for (var key in batch) {
      var cut = key.lastIndexOf('|');
      ctx.fillStyle = key.slice(0, cut);
      ctx.globalAlpha = parseFloat(key.slice(cut + 1));
      var a = batch[key];
      ctx.beginPath();
      for (var i = 0; i < a.length; i += 4) ctx.rect(a[i], a[i + 1], a[i + 2], a[i + 3]);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    batch = {};
  }

  // ---------- drawing ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // 16:9 field centered; phones take the field full-bleed
    var phone = isPhone();
    var fw, fh, ox, oy;
    if (phone) { fw = W; fh = H; ox = 0; oy = 0; }
    else {
      fw = Math.min(W, H * 16 / 9); fh = fw * 9 / 16;
      ox = (W - fw) / 2; oy = (H - fh) / 2;
    }
    var g = { ox: ox, fw: fw };
    var rowH = fh / ROWS;

    var loopT = ((t % LOOP) + LOOP) % LOOP;
    var act = Math.floor(loopT / ACT_LEN);       // 0..3, hard cut at boundaries
    var actTime = loopT - act * ACT_LEN;

    // base scanline field: one dim line per row, drifting slowly downward at
    // a constant rate keyed to loopT so it never resets at an act cut
    var drift = (loopT * 3) % rowH;
    var r, y, segs, s, seg;
    ctx.fillStyle = SCAN;
    ctx.beginPath();
    for (r = -1; r < ROWS; r++) ctx.rect(ox, oy + r * rowH + drift, fw, 1);
    ctx.fill();

    if (act === 0) {
      // ---- DENIAL: near-clean gray runs, a few seeded micro-tears ----
      var tearOff = {};
      for (var e = 0; e < denialEvents.length; e++) {
        var ev = denialEvents[e];
        if (actTime >= ev.start && actTime < ev.start + ev.dur) {
          tearOff[ev.row] = ev.off * fw / 1000;
        }
      }
      for (r = 0; r < ROWS; r++) {
        y = oy + r * rowH + drift;
        var offPx = tearOff[r] || 0;
        segs = rowSegs[r];
        for (s = 0; s < segs.length; s++) {
          seg = segs[s];
          var shade = DENIAL_SHADES[Math.min(2, Math.floor(seg.tone * 3))];
          pushRun(shade + '|1', seg.x + offPx / fw, seg.len, y + rowH * 0.18, rowH * 0.64, g);
        }
      }
    } else if (act === 1) {
      // ---- DESPAIR: per-row tears stepping every 0.2s, channel split, bursts ----
      var step = Math.floor(actTime / 0.2);
      for (r = 0; r < ROWS; r++) {
        y = oy + r * rowH + drift;
        var mag = hashN(2, r, step) * 0.55;
        var off = (hashN(21, r, step) > 0.5 ? 1 : -1) * mag;
        var split = 0.004 + hashN(22, r, step) * 0.011;
        var core = hashN(23, r, step) > 0.62;
        segs = rowSegs[r];
        for (s = 0; s < segs.length; s++) {
          seg = segs[s];
          pushRun(PINK + '|0.85', seg.x + off - split, seg.len, y + rowH * 0.18, rowH * 0.64, g);
          pushRun(CYAN + '|0.85', seg.x + off + split, seg.len, y + rowH * 0.18, rowH * 0.64, g);
          if (core) pushRun('#3A3A3A|0.8', seg.x + off, seg.len, y + rowH * 0.18, rowH * 0.64, g);
        }
      }
      for (var b = 0; b < bursts.length; b++) {
        var bu = bursts[b];
        if (actTime >= bu.start && actTime < bu.start + bu.dur) {
          pushRun(bu.color + '|0.95', bu.x, bu.w, oy + bu.row * rowH + drift, bu.span * rowH, g);
        }
      }
    } else if (act === 2) {
      // ---- ACCEPTANCE: one regular sine bends every row; stepped breathing ----
      var period = Math.PI * 2 / 14;      // one full wave per 14 rows
      var speed = 1.25;                   // rad/s travel
      var amp = 0.045;                    // normalized offset amplitude
      for (r = 0; r < ROWS; r++) {
        y = oy + r * rowH + drift;
        var offA = amp * Math.sin(r * period + actTime * speed);
        var breath = 0.5 + 0.5 * Math.sin(actTime * (Math.PI * 2 / ACT_LEN) - r * 0.33);
        segs = rowSegs[r];
        for (s = 0; s < segs.length; s++) {
          seg = segs[s];
          var lvl = Math.floor(((breath + seg.tone * 0.6) / 1.6) * 4);
          if (lvl > 3) lvl = 3; if (lvl < 0) lvl = 0;
          pushRun(GREEN_SHADES[lvl] + '|1', seg.x + offA, seg.len, y + rowH * 0.18, rowH * 0.64, g);
        }
      }
    } else {
      // ---- DEFIANT HOPE: a rising diagonal lattice of flat dashes, marching ----
      var dashLen = 0.055, dashPeriod = 0.09;
      for (r = 0; r < ROWS; r++) {
        y = oy + r * rowH + drift;
        var offH = (r * 0.012 + actTime * 0.06) % dashPeriod;
        var alpha = (r % 3 === 0) ? 0.5 : 1;
        for (var k = -1; k * dashPeriod < 1 + dashPeriod; k++) {
          pushRun(HOPE + '|' + alpha, k * dashPeriod + offH, dashLen, y + rowH * 0.19, rowH * 0.62, g);
        }
      }
    }

    flush();

    // field edge: one faint line under the field so the 16:9 stage reads
    ctx.fillStyle = '#1C1C1C';
    ctx.fillRect(ox, oy + fh, fw, 1);
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  function pieceT() {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    return T0 + (now - startStamp) / 1000;
  }
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(pieceT());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
