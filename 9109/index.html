<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№ 9109</title>
<!-- 9109-SPIDER-V1 -->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000000; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Morph state, reseeded on tap. All values are original, generated here.
  var morphSeed = 7.31;
  var hueShift = 0;
  var legPhase = [];
  for (var i = 0; i < 8; i++) legPhase.push(Math.random() * Math.PI * 2);

  function reseed() {
    morphSeed = Math.random() * 100;
    hueShift = Math.random() * 360;
    for (var i = 0; i < 8; i++) legPhase[i] = Math.random() * Math.PI * 2;
  }

  // Drag nudges rotation; tap reseeds morph.
  var rot = 0.6, rotVel = 0;
  var downX = 0, downY = 0, downT = 0, moved = 0, dragging = false;
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; moved = 0; downX = e.clientX; downY = e.clientY; downT = performance.now();
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - downX, dy = e.clientY - downY;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    rotVel += dx * 0.0018;
    downX = e.clientX; downY = e.clientY;
  });
  function endPointer(e) {
    if (!dragging) return;
    dragging = false;
    var dt = performance.now() - downT;
    if (moved < 12 && dt < 350) reseed();
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  function hsl(h, s, l, a) {
    return 'hsla(' + ((h % 360 + 360) % 360) + ',' + s + '%,' + l + '%,' + (a === undefined ? 1 : a) + ')';
  }

  // Body facets: centre plus ring vertices, morphed by slow sine noise.
  function bodyVertices(t) {
    var pts = [];
    var n = 9;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2;
      var r = 1 + 0.12 * Math.sin(t * 0.35 + morphSeed + i * 1.7) + 0.06 * Math.sin(t * 0.9 + i * 2.3);
      pts.push([Math.cos(a) * 62 * r, Math.sin(a) * 40 * r]);
    }
    return pts;
  }

  // One leg, in spider-local space. Returns its joint polyline.
  function legPoints(side, idx, t) {
    var attachX = side * 30;
    var attachY = -38 + idx * 25;
    var dirY = -0.95 + idx * 0.63;
    var base = Math.atan2(dirY, side * 1);
    var phase = legPhase[side < 0 ? idx + 4 : idx];
    var gait = Math.sin(t * 2.1 + phase);
    var gait2 = Math.sin(t * 2.1 + phase + 1.3);
    var a1 = base + gait * 0.22;
    var a2 = a1 + 0.55 + gait2 * 0.28;
    var a3 = a2 - 0.85 + gait * 0.30;
    var L1 = 52, L2 = 62, L3 = 52;
    var p0 = [attachX, attachY];
    var p1 = [p0[0] + Math.cos(a1) * L1, p0[1] + Math.sin(a1) * L1];
    var p2 = [p1[0] + Math.cos(a2) * L2, p1[1] + Math.sin(a2) * L2];
    var p3 = [p2[0] + Math.cos(a3) * L3, p2[1] + Math.sin(a3) * L3];
    return [p0, p1, p2, p3];
  }

  function pointOnPolyline(pts, u) {
    var lens = [], total = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1];
      var l = Math.sqrt(dx * dx + dy * dy); lens.push(l); total += l;
    }
    var d = u * total;
    for (var j = 0; j < lens.length; j++) {
      if (d <= lens[j] || j === lens.length - 1) {
        var f = lens[j] ? d / lens[j] : 0;
        return [pts[j][0] + (pts[j + 1][0] - pts[j][0]) * f, pts[j][1] + (pts[j + 1][1] - pts[j][1]) * f];
      }
      d -= lens[j];
    }
    return pts[pts.length - 1];
  }

  // Travelling nodes, one per leg.
  var nodes = [];
  for (var n = 0; n < 8; n++) nodes.push({ t: Math.random(), speed: 0.22 + Math.random() * 0.16, wait: Math.random() * 1.2 });

  var start = performance.now();
  function frame(now) {
    var t = (now - start) / 1000;
    rot += 0.07 / 60 + rotVel;
    rotVel *= 0.94;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    // Faint grid.
    ctx.strokeStyle = 'rgba(255,255,255,0.055)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var gx = (W / 2) % 52; gx < W; gx += 52) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
    for (var gy = (H / 2) % 52; gy < H; gy += 52) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
    ctx.stroke();

    var cx = W / 2, cy = H / 2;
    var scale = Math.min(W, H) / 620;
    if (scale > 1.15) scale = 1.15;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.rotate(rot);

    // Legs, drawn first so the body sits over their roots.
    var allLegs = [];
    for (var side = -1; side <= 1; side += 2) {
      for (var idx = 0; idx < 4; idx++) {
        var pts = legPoints(side, idx, t);
        allLegs.push(pts);
        ctx.strokeStyle = 'rgba(200,210,230,0.55)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (var k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
        ctx.stroke();
        // Joints.
        for (var j = 1; j < pts.length - 1; j++) {
          ctx.fillStyle = 'rgba(230,235,250,0.8)';
          ctx.beginPath(); ctx.arc(pts[j][0], pts[j][1], 3, 0, Math.PI * 2); ctx.fill();
        }
        // Tip.
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(pts[3][0], pts[3][1], 2.4, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Blocky faceted body.
    var verts = bodyVertices(t);
    var facetHues = [280, 345, 215, 145, 265, 10, 200, 160, 290];
    for (var f = 0; f < verts.length; f++) {
      var v1 = verts[f], v2 = verts[(f + 1) % verts.length];
      ctx.fillStyle = hsl(facetHues[f] + hueShift + Math.sin(t * 0.4 + f) * 18, 62, 52, 0.92);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(v1[0], v1[1]); ctx.lineTo(v2[0], v2[1]); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(verts[0][0], verts[0][1]);
    for (var v = 1; v < verts.length; v++) ctx.lineTo(verts[v][0], verts[v][1]);
    ctx.closePath(); ctx.stroke();

    // Head block, forward.
    ctx.fillStyle = hsl(215 + hueShift, 55, 48, 0.95);
    ctx.beginPath();
    ctx.moveTo(-18, -52); ctx.lineTo(18, -52); ctx.lineTo(26, -78); ctx.lineTo(-26, -78); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.2; ctx.stroke();

    // Travelling glowing nodes.
    for (var ni = 0; ni < nodes.length; ni++) {
      var node = nodes[ni];
      if (node.wait > 0) { node.wait -= 1 / 60; continue; }
      node.t += node.speed / 60;
      if (node.t >= 1) { node.t = 0; node.wait = 0.4 + Math.random() * 1.4; continue; }
      var pos = pointOnPolyline(allLegs[ni], node.t);
      var alpha = node.t < 0.15 ? node.t / 0.15 : 1 - Math.pow((node.t - 0.15) / 0.85, 2) * 0.85;
      ctx.save();
      ctx.shadowColor = hsl(190 + hueShift * 0.3, 90, 65, 1);
      ctx.shadowBlur = 14;
      ctx.fillStyle = hsl(185, 95, 72, Math.max(0, alpha));
      ctx.beginPath(); ctx.arc(pos[0], pos[1], 4.2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
