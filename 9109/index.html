<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№ 9109</title>
<!-- 9109-SPIDER-V2 -->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000000; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  // 19-second seamless loop. Everything periodic in p = (t mod 19)/19,
  // so p=0 and p=1 give the same pose. No walking, no ground contact,
  // no travel: the creature stays in the central third, tumbling,
  // bending, extending and folding in place.
  var LOOP = 19;
  var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
  var morphSeed = 0.7;
  var dragAngle = 0, dragVel = 0, downX = 0, downY = 0, moved = false;

  function onDown(e) { var p = e.touches ? e.touches[0] : e; downX = p.clientX; downY = p.clientY; moved = false; }
  function onMove(e) {
    var p = e.touches ? e.touches[0] : e;
    if (downX === null) return;
    var dx = p.clientX - downX;
    if (Math.abs(dx) > 4) moved = true;
    dragVel = dx * 0.0015; dragAngle += dragVel; downX = p.clientX; downY = p.clientY;
  }
  function onUp(e) { if (!moved) morphSeed = Math.random() * 6.283; downX = null; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive: true});
  canvas.addEventListener('touchmove', onMove, {passive: true});
  canvas.addEventListener('touchend', onUp);

  // Periodic keyframe interpolation over loop seconds, wrapped.
  function keyAt(keys, t) {
    // keys: [[time, value], ...] with first time 0 and last time LOOP, same value at both ends.
    var i, a, b, u, s;
    for (i = 0; i < keys.length - 1; i++) {
      if (t >= keys[i][0] && t <= keys[i + 1][0]) {
        a = keys[i]; b = keys[i + 1];
        u = (t - a[0]) / Math.max(0.001, b[0] - a[0]);
        s = u * u * (3 - 2 * u);
        return a[1] + (b[1] - a[1]) * s;
      }
    }
    return keys[0][1];
  }
  var EXT = [[0,0.38],[4,0.62],[6,0.38],[8.5,1.0],[11,0.78],[15,0.92],[19,0.38]];
  var ANG = [[0,0.15],[4,0.70],[6,0.30],[8.5,-0.20],[11,0.80],[15,0.70],[19,0.15]];
  var TILT = [[0,0],[4,0.30],[6,-0.20],[8.5,0.10],[11,0.35],[15,-0.25],[19,0]];

  function legPoints(rootX, rootY, baseAngle, len, wave, side, seed) {
    // 3-segment leg, forward kinematics. Wave bends joints in sequence,
    // so the tip swings in a curved arc, never steps point to point.
    var a1 = baseAngle + 0.38 * Math.sin(wave) + 0.12 * Math.sin(wave * 2 + seed);
    var a2 = a1 + (0.55 + 0.45 * Math.sin(wave - 1.1));
    var a3 = a2 + (0.35 + 0.45 * Math.sin(wave - 2.1));
    var l1 = len * 0.38, l2 = len * 0.34, l3 = len * 0.28;
    var p0 = [rootX, rootY];
    var p1 = [p0[0] + Math.cos(a1) * l1, p0[1] + Math.sin(a1) * l1];
    var p2 = [p1[0] + Math.cos(a2) * l2, p1[1] + Math.sin(a2) * l2];
    var p3 = [p2[0] + Math.cos(a3) * l3, p2[1] + Math.sin(a3) * l3];
    return [p0, p1, p2, p3];
  }
  function pointAlong(pts, s) {
    // s in [0,1] along the polyline, following its bends.
    var total = 0, seg = [], i, d;
    for (i = 0; i < pts.length - 1; i++) {
      d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
      seg.push(d); total += d;
    }
    var target = s * total;
    for (i = 0; i < seg.length; i++) {
      if (target <= seg[i] || i === seg.length - 1) {
        var u = seg[i] ? target / seg[i] : 0;
        return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * u,
                pts[i][1] + (pts[i + 1][1] - pts[i][1]) * u];
      }
      target -= seg[i];
    }
    return pts[pts.length - 1];
  }

  function frame(nowSec) {
    var t = nowSec - start;
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var p = lt / LOOP;
    dragAngle *= 0.96;
    var ext = keyAt(EXT, lt);
    var bodyAngle = keyAt(ANG, lt) + dragAngle;
    var tilt = keyAt(TILT, lt);
    var S = Math.min(W, H);
    var cx = W / 2 + Math.sin(p * 6.283) * S * 0.045;
    var cy = H / 2 + Math.cos(p * 6.283) * S * 0.035;

    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    // Faint grid.
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
    ctx.beginPath();
    var g;
    for (g = 0; g <= W; g += 44) { ctx.moveTo(g, 0); ctx.lineTo(g, H); }
    for (g = 0; g <= H; g += 44) { ctx.moveTo(0, g); ctx.lineTo(W, g); }
    ctx.stroke();

    // Body spine: 3 faceted blocks, bending at the middle.
    var bodyLen = S * 0.22 * (0.6 + 0.4 * ext);
    var segLen = bodyLen / 3;
    var bend = 0.45 * Math.sin(p * 6.283 * 2 + morphSeed) + tilt * 0.5;
    var spine = [];
    var ax = cx, ay = cy, a = bodyAngle;
    spine.push([ax, ay]);
    var si;
    for (si = 0; si < 3; si++) {
      var aa = a + (si === 0 ? 0 : bend * (si === 1 ? 0.6 : 1.0)) + tilt * 0.2;
      ax += Math.cos(aa) * segLen; ay += Math.sin(aa) * segLen;
      spine.push([ax, ay]);
      a = aa;
    }
    // Body nodes travelling along the spine, following its bend.
    var bn;
    for (bn = 0; bn < 3; bn++) {
      var bs = (((bn / 3) + 3 * p + 0.1 * Math.sin(p * 18.85 + morphSeed)) % 1 + 1) % 1;
      var bp = pointAlong(spine, bs);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(bp[0], bp[1], 3.2, 0, 6.283); ctx.fill();
    }
    // Faceted body blocks.
    var hues = [275, 210, 150];
    for (si = 0; si < 3; si++) {
      var mx = (spine[si][0] + spine[si + 1][0]) / 2;
      var my = (spine[si][1] + spine[si + 1][1]) / 2;
      var sa = Math.atan2(spine[si + 1][1] - spine[si][1], spine[si + 1][0] - spine[si][0]);
      var r = S * 0.055 * (1 + 0.18 * Math.sin(p * 12.566 + si * 1.7 + morphSeed));
      ctx.save(); ctx.translate(mx, my); ctx.rotate(sa);
      ctx.strokeStyle = 'hsl(' + hues[si] + ',70%,65%)'; ctx.lineWidth = 1.6;
      ctx.beginPath();
      var vi, vx, vy;
      for (vi = 0; vi <= 6; vi++) {
        var va = vi * 1.047 + 0.3 * Math.sin(p * 12.566 + morphSeed);
        vx = Math.cos(va) * r * 1.5; vy = Math.sin(va) * r * 0.85;
        if (vi === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
      }
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    }

    // Legs: 4 per side, wave front to back, opposite sides out of phase.
    // Wave completes 6 cycles per 19s loop, so it returns exactly at loop point.
    var side, li;
    for (side = -1; side <= 1; side += 2) {
      for (li = 0; li < 4; li++) {
        var root = spine[Math.min(3, li + 1)];
        // Root slides slightly along spine with extension, so legs spread/fold with body.
        var rx = root[0] + Math.cos(bodyAngle + side * 1.57) * S * 0.01;
        var ry = root[1] + Math.sin(bodyAngle + side * 1.57) * S * 0.01;
        var spread = side * (0.9 + li * 0.38);
        var baseAngle = bodyAngle + side * 1.57 + spread * 0.55 - 0.8 + li * 0.12;
        // Re-anchor: legs point outward from the spine, not along it.
        baseAngle = bodyAngle + side * (1.2 + li * 0.28) + (li - 1.5) * 0.18;
        var wave = p * 37.699 - li * 1.35 + (side < 0 ? 3.142 : 0);
        var legLen = S * (0.20 + 0.14 * ext) * (1 + 0.25 * Math.sin(wave - 1.0)) * (li === 3 ? 1.25 : 1);
        // Longest reach on the far legs at stretched phases comes from ext itself.
        var pts = legPoints(rx, ry, baseAngle, legLen, wave, side, morphSeed);
        ctx.strokeStyle = 'rgba(200,210,255,0.75)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        ctx.lineTo(pts[1][0], pts[1][1]); ctx.lineTo(pts[2][0], pts[2][1]); ctx.lineTo(pts[3][0], pts[3][1]);
        ctx.stroke();
        // Joints.
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        var ji;
        for (ji = 1; ji <= 2; ji++) { ctx.beginPath(); ctx.arc(pts[ji][0], pts[ji][1], 2, 0, 6.283); ctx.fill(); }
        // Nodes: outward only, 4 cycles per loop plus a periodic wobble that
        // returns to zero at loop point, so nodes return too. On a long leg
        // the same parametric speed is more pixels per second and wider spacing;
        // on a folded leg the curve itself bunches them.
        var ni;
        for (ni = 0; ni < 3; ni++) {
          var ns = (((ni / 3) + 4 * p + 0.12 * Math.sin(p * 18.85 + morphSeed + li)) % 1 + 1) % 1;
          var np = pointAlong(pts, ns);
          var linger = ns > 0.92 ? 0.9 : 0.55;
          ctx.fillStyle = 'rgba(255,230,120,' + linger + ')';
          ctx.beginPath(); ctx.arc(np[0], np[1], 3.4, 0, 6.283); ctx.fill();
        }
        // Tip node lingers.
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.beginPath(); ctx.arc(pts[3][0], pts[3][1], 3.8, 0, 6.283); ctx.fill();
      }
    }
  }

  function loop(nowMs) {
    frame(nowMs / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  else frame(start);
})();
</script>
</body>
</html>
