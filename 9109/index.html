<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>№ 9109</title>
<!-- 9109-CHAIN-V3 -->
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
// Keyframed phases over t mod 19. No steady spin, no walk cycle.
// Fields: dir (deg, chain direction), curve (total bend deg), spacing, scale, cx, cy, leg, face (0=edge square, 1=face ring)
const K=[
 [0,   -90, 12, 0.88, 1.00,  0, 0, 1.00, 0.00],
 [3,   -84, 18, 0.92, 1.00,  6,-4, 1.15, 0.15],
 [4,     2, 24, 1.02, 1.05,  2, 2, 1.20, 0.30],
 [5,    44, 30, 1.00, 1.02, -4, 4, 1.10, 0.35],
 [6.5,  28, 95, 0.58, 0.88,  0, 0, 0.70, 0.60],
 [7.5,   6,  8, 1.28, 1.12,  4,-2, 1.35, 0.25],
 [8,    18,-45, 1.22, 1.08,  0, 0, 1.25, 0.30],
 [9.3,  55,115, 0.95, 1.00, -2, 6, 0.95, 0.50],
 [11,  -42, 20, 0.70, 0.82,  6,-6, 0.75, 0.70],
 [13,   42, 25, 1.20, 1.10, -4, 2, 1.20, 0.35],
 [15,  -42, 30, 1.05, 1.00,  2,-2, 0.95, 0.60],
 [17,  -30, 60, 0.85, 0.92,  0, 4, 0.85, 0.85],
 [18.8,-72, 35, 0.78, 0.90, -2, 0, 0.80, 1.00],
 [19,  -90, 12, 0.88, 1.00,  0, 0, 1.00, 0.00]
];
function lerp(a,b,f){return a+(b-a)*f;}
function smooth(f){return f*f*(3-2*f);}
function phaseAt(t){
  // t in [0,19); wrap for block lag
  t=((t%19)+19)%19;
  for(let i=0;i<K.length-1;i++){
    const a=K[i],b=K[i+1];
    if(t>=a[0]&&t<=b[0]){
      let f=(t-a[0])/(b[0]-a[0]||1); f=smooth(f);
      const o={};
      for(let j=1;j<a.length;j++) o[['dir','curve','spacing','scale','cx','cy','leg','face'][j-1]]=lerp(a[j],b[j],f);
      return o;
    }
  }
  return {dir:-90,curve:12,spacing:0.88,scale:1,cx:0,cy:0,leg:1,face:0};
}
const PAL=[[168,85,247],[244,63,94],[59,130,246],[52,211,153],[251,191,36],[34,211,238],[232,121,249],[96,165,250],[167,139,250],[45,212,191]];
let hueShift=0, nudge=0, nudgeV=0, dragging=false, lastX=0;
addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;});
addEventListener('pointermove',e=>{if(dragging){nudgeV+=(e.clientX-lastX)*0.02;lastX=e.clientX;}});
addEventListener('pointerup',()=>{dragging=false;});
addEventListener('click',()=>{hueShift=(hueShift+1)%PAL.length;});
function draw(t){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  // Fixed grid: never pans, never zooms.
  ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;ctx.beginPath();
  const g=48;
  for(let x=0;x<=W;x+=g){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(let y=0;y<=H;y+=g){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();
  const cx=W/2, cy=H/2, unit=Math.min(W,H);
  nudge+=nudgeV; nudgeV*=0.94; nudge*=0.995;
  // Block-by-block propagation: leading block (i=0) moves first, each next block lags ~0.09s.
  const N=10, lag=0.09;
  const dirs=[], sp=[], sc=[];
  for(let i=0;i<N;i++){const p=phaseAt(t-i*lag); dirs.push(p.dir*Math.PI/180); sp.push(p.spacing); sc.push(p.scale);}
  const p0=phaseAt(t);
  const baseLen=unit*0.075*p0.scale;
  // Walk the spine, then re-centre on its centroid so the creature stays central.
  let pts=[{x:0,y:0}], ang=dirs[0];
  for(let i=0;i<N-1;i++){
    // Local direction blends the block's own phase with the chain curvature.
    const curveAt=phaseAt(t-i*lag).curve*Math.PI/180;
    const a=dirs[i]+curveAt*(i/(N-1)-0.5);
    const step=baseLen*sp[i]*1.02;
    pts.push({x:pts[i].x+Math.cos(a)*step, y:pts[i].y+Math.sin(a)*step});
  }
  let gx=0,gy=0; pts.forEach(p=>{gx+=p.x;gy+=p.y;}); gx/=N; gy/=N;
  const driftX=p0.cx*unit*0.01, driftY=p0.cy*unit*0.01;
  pts=pts.map(p=>({x:p.x-gx+cx+driftX, y:p.y-gy+cy+driftY}));
  // Legs: 8, attached at intervals along the chain, never at one torso.
  const legBlocks=[0,1,2,3,5,6,7,8];
  const legSides=[1,-1,1,-1,1,-1,1,-1];
  // Draw legs first (behind blocks), then blocks, then dots.
  const legGeom=[];
  for(let k=0;k<legBlocks.length;k++){
    const bi=legBlocks[k], side=legSides[k];
    const a=pts[bi];
    const pNow=phaseAt(t-bi*lag), pOld=phaseAt(t-bi*lag-0.35);
    // Overshoot: tip angle follows the change in its own block's direction.
    let dNow=pNow.dir, dOld=pOld.dir; let dd=((dNow-dOld+540)%360)-180;
    const over=dd*Math.PI/180;
    const curveNow=pNow.curve;
    // Outer side of a curl stays extended, inner side folds.
    const fold=Math.max(0.55,Math.min(1.35,1-0.30*side*Math.sign(curveNow)*Math.min(1,Math.abs(curveNow)/115)));
    const blockDir=dirs[bi];
    const baseA=blockDir+side*Math.PI/2;
    const L=unit*0.055*p0.scale*p0.leg*fold;
    const bend=(1-fold)*0.9+0.25; // folded legs bend more
    const a1=baseA+over*0.25;
    const a2=baseA+over*0.55+side*bend*0.55;
    const a3=baseA+over*0.90+side*bend*1.05;
    const j1={x:a.x+Math.cos(a1)*L, y:a.y+Math.sin(a1)*L};
    const j2={x:j1.x+Math.cos(a2)*L*0.95, y:j1.y+Math.sin(a2)*L*0.95};
    const tip={x:j2.x+Math.cos(a3)*L*0.9, y:j2.y+Math.sin(a3)*L*0.9};
    legGeom.push({a,j1,j2,tip,side,face:pNow.face,fold});
  }
  // Leg strokes
  legGeom.forEach((lg,idx)=>{
    const col=PAL[(idx+hueShift)%PAL.length];
    ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},0.85)`;ctx.lineWidth=Math.max(1,unit*0.003);ctx.lineCap='round';ctx.beginPath();
    ctx.moveTo(lg.a.x,lg.a.y);ctx.lineTo(lg.j1.x,lg.j1.y);ctx.lineTo(lg.j2.x,lg.j2.y);ctx.lineTo(lg.tip.x,lg.tip.y);ctx.stroke();
  });
  // Blocks: rectangles along the spine, gaps open and close with spacing.
  for(let i=0;i<N;i++){
    const a=pts[i];
    const next=pts[Math.min(N-1,i+1)], prev=pts[Math.max(0,i-1)];
    const angB=Math.atan2(next.y-prev.y,next.x-prev.x)+nudge*0.01;
    const len=baseLen*sp[i]*0.92, wid=baseLen*0.52;
    const col=PAL[(i+hueShift)%PAL.length];
    ctx.save();ctx.translate(a.x,a.y);ctx.rotate(angB);
    ctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},0.16)`;
    ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},0.95)`;ctx.lineWidth=Math.max(1,unit*0.0025);
    ctx.beginPath();ctx.rect(-len/2,-wid/2,len,wid);ctx.fill();ctx.stroke();
    // Inner wireframe lines
    ctx.strokeStyle=`rgba(255,255,255,0.35)`;ctx.lineWidth=1;ctx.beginPath();
    ctx.moveTo(-len/2,-wid/2);ctx.lineTo(len/2,wid/2);ctx.moveTo(len/2,-wid/2);ctx.lineTo(-len/2,wid/2);ctx.stroke();
    ctx.restore();
  }
  // Joint dots: ride the legs, spread when extended, bunch when folded.
  legGeom.forEach((lg,idx)=>{
    const col=PAL[(idx+hueShift)%PAL.length];
    const ptsD=[lg.a,lg.j1,lg.j2,lg.tip];
    // Midpoints add dots that bunch in projection when a leg folds.
    const mids=[{x:(lg.a.x+lg.j1.x)/2,y:(lg.a.y+lg.j1.y)/2},{x:(lg.j1.x+lg.j2.x)/2,y:(lg.j1.y+lg.j2.y)/2},{x:(lg.j2.x+lg.tip.x)/2,y:(lg.j2.y+lg.tip.y)/2}];
    ctx.fillStyle=`rgba(255,255,255,0.9)`;
    [...ptsD,...mids].forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.5,unit*0.004),0,Math.PI*2);ctx.fill();});
    // Tip frame: square/diamond edge-on, ring face-on, rotating with the leg.
    const face=lg.face, r=Math.max(4,unit*0.014);
    ctx.save();ctx.translate(lg.tip.x,lg.tip.y);
    if(face<0.5){ctx.globalAlpha=1-face*1.4;ctx.rotate(Math.atan2(lg.tip.y-lg.j2.y,lg.tip.x-lg.j2.x));ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},0.95)`;ctx.lineWidth=2;ctx.strokeRect(-r,-r,2*r,2*r);}
    if(face>0.15){ctx.globalAlpha=Math.min(1,(face-0.15)*1.6);ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},0.95)`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();}
    ctx.restore();ctx.globalAlpha=1;
  });
}
let t0=performance.now();
function frame(now){
  const t=((now-t0)/1000)%19;
  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
