<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>№ 9109</title>
<!-- 9109-IK-V5 -->
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,unit=800;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;unit=Math.min(W,H);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry((Math.random()*1e9)|0);
const TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function wrapAngle(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;}
function smooth(t){return t*t*(3-2*t);}
// Species are defined by structure, not by a timeline. Palettes are
// original values in the same colour family as the reference video.
const SPECIES=[
 {key:'arachnid',segs:3,pairsPerSeg:2,legSegs:[0,1,2],joints:3,legLen:1.00,reticle:'box',pal:['#b26bff','#e5486d','#5f9dff'],maxBend:0.62,gait:'coord'},
 {key:'myriapod',segs:13,pairsPerSeg:1,legSegs:null,joints:3,legLen:0.58,reticle:'circle',pal:['#4ade80','#38bdf8','#a3e635'],maxBend:0.48,gait:'coord'},
 {key:'mantis',segs:5,pairsPerSeg:1,legSegs:[0,1,2],joints:4,legLen:1.12,reticle:'diamond',pal:['#f472b6','#818cf8','#fb7185'],maxBend:0.58,gait:'coord'},
 {key:'centipede',segs:12,pairsPerSeg:1,legSegs:null,joints:3,legLen:0.62,reticle:'diamond',pal:['#22d3ee','#f59e0b','#a78bfa'],maxBend:0.52,gait:'wave'}
];
let sp,segLen,segW,joints,prevCenters,prevSegAngles,legs,head,vel,target,mode,modeTimer,patrolT,time=0,lastT=0,antennae=[];
let dragging=false,dragX=0,dragY=0,downX=0,downY=0,moved=0;
function buildSpecies(idx){
 sp=SPECIES[idx];
 const segBase = sp.key==='myriapod' ? 0.038 : 0.058;
 segLen=unit*segBase;
 segW=unit*(sp.key==='myriapod'?0.034:0.046);
 const n=sp.segs;
 joints=[];
 const cx=W/2,cy=H/2;
 for(let i=0;i<=n;i++) joints.push({x:cx-i*segLen,y:cy});
 prevCenters=[];
 prevSegAngles=[];
 for(let i=0;i<n;i++){prevCenters.push({x:cx-(i+0.5)*segLen,y:cy});prevSegAngles.push(0);}
 antennae=[{side:-1,ang:0.45,vel:0},{side:1,ang:-0.45,vel:0}];
 head={x:cx,y:cy,ang:0};
 vel={x:0,y:0};
 target={x:cx+unit*0.2,y:cy-unit*0.1};
 mode='patrol';modeTimer=7+rng()*4;patrolT=rng()*10;
 legs=[];
 const legReach=segLen*sp.legLen*2.6;
 for(let s=0;s<n;s++){
   const hasLeg = sp.legSegs ? sp.legSegs.includes(s) : true;
   if(!hasLeg) continue;
   const pairCount = sp.legSegs ? 1 : sp.pairsPerSeg;
   for(let p=0;p<pairCount;p++){
     const off = pairCount===2 ? (p===0?-0.28:0.28) : 0;
     for(const side of [-1,1]){
       const leg={seg:s,side:side,pair:p,off:off,reach:legReach,foot:{x:cx,y:cy},stepping:false,stepT:0,from:{x:cx,y:cy},to:{x:cx,y:cy},c1:{x:cx,y:cy},c2:{x:cx,y:cy},dur:0.35,neighbors:[]};
       legs.push(leg);
     }
   }
 }
 // Neighbour indices: opposite side of the same pair, and the same
 // side / same pair on an adjacent segment. Those legs must never
 // lift at the same time.
 legs.forEach((leg,idx)=>{
   legs.forEach((o,j)=>{
     if(j===idx) return;
     const opp = o.seg===leg.seg && o.pair===leg.pair && o.side===-leg.side;
     const adj = Math.abs(o.seg-leg.seg)===1 && o.pair===leg.pair && o.side===leg.side;
     if(opp||adj) leg.neighbors.push(j);
   });
   // Initial planted feet: at the rest offset, so no leg starts mid-step.
   const c=segCenter(leg.seg);
   const a=segAngle(leg.seg);
   const px=-Math.sin(a),py=Math.cos(a);
   leg.foot.x=c.x+px*leg.side*(segW/2+leg.reach*0.92);
   leg.foot.y=c.y+py*leg.side*(segW/2+leg.reach*0.92);
   leg.from={...leg.foot};leg.to={...leg.foot};
 });
}
function segCenter(i){return {x:(joints[i].x+joints[i+1].x)/2,y:(joints[i].y+joints[i+1].y)/2};}
function segAngle(i){return Math.atan2(joints[i+1].y-joints[i].y,joints[i+1].x-joints[i].x);}
function segWidth(i){const n=sp.segs;return segW*(0.62+0.48*Math.sin(Math.PI*(i+0.5)/n));}
function updateTarget(dt){
 if(dragging){target.x=dragX;target.y=dragY;return;}
 modeTimer-=dt;
 if(mode==='patrol'){
   patrolT+=dt;
   target.x=W/2+Math.cos(patrolT*0.23)*W*0.30;
   target.y=H/2+Math.sin(patrolT*0.46)*H*0.25;
   if(modeTimer<=0){
     mode='waypoint';
     target.x=W*0.14+rng()*W*0.72;
     target.y=H*0.14+rng()*H*0.72;
   }
 } else {
   const d=Math.hypot(target.x-head.x,target.y-head.y);
   if(d<50){mode='patrol';modeTimer=6+rng()*5;}
 }
}
function updateSpine(dt){
 // Head steering: desired velocity, clamped acceleration, arrival damping.
 const dx=target.x-head.x,dy=target.y-head.y;
 const dist=Math.hypot(dx,dy)||1;
 const maxSp=unit*0.17;
 let spScale=dist<150?dist/150:1;
 const desX=dx/dist*maxSp*spScale,desY=dy/dist*maxSp*spScale;
 const acc=unit*0.55;
 let sx=desX-vel.x,sy=desY-vel.y;
 const sm=Math.hypot(sx,sy);
 if(sm>acc){sx=sx/sm*acc;sy=sy/sm*acc;}
 vel.x+=sx*dt;vel.y+=sy*dt;
 const vm=Math.hypot(vel.x,vel.y);
 if(vm>maxSp*1.2){vel.x=vel.x/vm*maxSp*1.2;vel.y=vel.y/vm*maxSp*1.2;}
 // Serpentine sway is added to the effective velocity only, so the
 // path undulates without the steering state drifting.
 const vl=Math.hypot(vel.x,vel.y)||1;
 const px=-vel.y/vl,py=vel.x/vl;
 const sway=Math.sin(time*3.1)*unit*0.035;
 const ex=vel.x+px*sway,ey=vel.y+py*sway;
 head.x+=ex*dt;head.y+=ey*dt;
 head.x=clamp(head.x,20,W-20);head.y=clamp(head.y,20,H-20);
 head.ang=Math.atan2(ey,ex);
 // Spring antennae: each antenna is a damped spring chasing a head-relative
 // target angle. It lags on turns, overshoots, then settles, never keyframed.
 for(const ant of antennae){
   const want=head.ang+ant.side*0.55+Math.sin(time*2.0)*0.08;
   const diff=wrapAngle(want-ant.ang);
   ant.vel+=(diff*22-ant.vel*7)*dt;
   ant.ang+=ant.vel*dt;
 }
 // Follow the leader: each joint is pulled to segLen from its predecessor.
 joints[0].x=head.x;joints[0].y=head.y;
 for(let iter=0;iter<2;iter++){
   for(let i=1;i<joints.length;i++){
     let dx2=joints[i].x-joints[i-1].x,dy2=joints[i].y-joints[i-1].y;
     let d=Math.hypot(dx2,dy2);
     if(d<0.001){dx2=Math.cos(head.ang);dy2=Math.sin(head.ang);d=1;}
     joints[i].x=joints[i-1].x+dx2/d*segLen;
     joints[i].y=joints[i-1].y+dy2/d*segLen;
   }
   // Bend limit per joint: the outgoing direction may not turn
   // more than maxBend away from the incoming direction.
   for(let i=1;i<joints.length-1;i++){
     const ain=Math.atan2(joints[i].y-joints[i-1].y,joints[i].x-joints[i-1].x);
     const aout=Math.atan2(joints[i+1].y-joints[i].y,joints[i+1].x-joints[i].x);
     const diff=wrapAngle(aout-ain);
     const cl=clamp(diff,-sp.maxBend,sp.maxBend);
     if(Math.abs(diff-cl)>0.001){
       const na=ain+cl;
       joints[i+1].x=joints[i].x+Math.cos(na)*segLen;
       joints[i+1].y=joints[i].y+Math.sin(na)*segLen;
     }
   }
 }
}
function solveLeg(root,foot,lens,poleX,poleY){
 // FABRIK with a pole bias: middle joints are pulled toward the
 // outward pole after each pass, giving the leg its arch instead
 // of collapsing to a straight line. Root and foot stay exact.
 const n=lens.length;
 const pts=[{x:root.x,y:root.y}];
 const total=lens.reduce((a,b)=>a+b,0);
 for(let k=1;k<=n;k++){
   const f=k/n;
   pts.push({x:root.x+(foot.x-root.x)*f+poleX*total*0.22*Math.sin(Math.PI*f),
             y:root.y+(foot.y-root.y)*f+poleY*total*0.22*Math.sin(Math.PI*f)});
 }
 for(let it=0;it<3;it++){
   pts[n].x=foot.x;pts[n].y=foot.y;
   for(let k=n-1;k>=0;k--){
     const dx=pts[k].x-pts[k+1].x,dy=pts[k].y-pts[k+1].y;
     const d=Math.hypot(dx,dy)||1;
     pts[k].x=pts[k+1].x+dx/d*lens[k];
     pts[k].y=pts[k+1].y+dy/d*lens[k];
   }
   for(let k=1;k<n;k++){pts[k].x+=poleX*lens[k]*0.30;pts[k].y+=poleY*lens[k]*0.30;}
   pts[0].x=root.x;pts[0].y=root.y;
   for(let k=0;k<n;k++){
     const dx=pts[k+1].x-pts[k].x,dy=pts[k+1].y-pts[k].y;
     const d=Math.hypot(dx,dy)||1;
     pts[k+1].x=pts[k].x+dx/d*lens[k];
     pts[k+1].y=pts[k].y+dy/d*lens[k];
   }
   for(let k=1;k<n;k++){pts[k].x+=poleX*lens[k]*0.30;pts[k].y+=poleY*lens[k]*0.30;}
 }
 pts[n].x=foot.x;pts[n].y=foot.y;
 return pts;
}
function updateLegs(dt){
 legs.forEach((leg,idx)=>{
   const c=segCenter(leg.seg);
   const a=segAngle(leg.seg);
   const px=-Math.sin(a),py=Math.cos(a);
   const w=segWidth(leg.seg);
   const root={x:c.x+px*leg.side*(w/2*0.92)+Math.cos(a)*leg.off*segLen,
               y:c.y+py*leg.side*(w/2*0.92)+Math.sin(a)*leg.off*segLen};
   leg.root=root;
   const pv=prevCenters[leg.seg];
   let vx=(c.x-pv.x)/Math.max(dt,0.001),vy=(c.y-pv.y)/Math.max(dt,0.001);
   const vmag=Math.hypot(vx,vy);
   if(vmag>90){vx=vx/vmag*90;vy=vy/vmag*90;}
   // Rotational prediction: segment angular velocity, clamped, rotates the
   // ideal foot around the segment centre for a short look-ahead. During a
   // turn the outer leg therefore targets further ahead and the inner leg
   // targets less far ahead, so feet step into the turn instead of trailing it.
   const prevA=prevSegAngles[leg.seg]||0;
   let angVel=wrapAngle(a-prevA)/Math.max(dt,0.001);
   angVel=clamp(angVel,-2.5,2.5);
   const look=0.30,ca=Math.cos(angVel*look),sa=Math.sin(angVel*look);
   let ideal={x:root.x+px*leg.side*leg.reach+vx*0.22,
                y:root.y+py*leg.side*leg.reach+vy*0.22};
   const ix=ideal.x-c.x,iy=ideal.y-c.y;
   ideal={x:c.x+ix*ca-iy*sa,y:c.y+ix*sa+iy*ca};
   leg.ideal=ideal;
   if(leg.stepping){
     leg.stepT+=dt/leg.dur;
     if(leg.stepT>=1){
       leg.stepping=false;leg.foot.x=leg.to.x;leg.foot.y=leg.to.y;
     } else {
       // Cubic Bezier swing, not a parabola: control points carry lateral
       // clearance outward from the body, scaled to the step distance.
       const t=leg.stepT;
       const mt=1-t;
       leg.foot.x=mt*mt*mt*leg.from.x+3*mt*mt*t*leg.c1.x+3*mt*t*t*leg.c2.x+t*t*t*leg.to.x;
       leg.foot.y=mt*mt*mt*leg.from.y+3*mt*mt*t*leg.c1.y+3*mt*t*t*leg.c2.y+t*t*t*leg.to.y;
     }
   } else {
     const d=Math.hypot(leg.foot.x-ideal.x,leg.foot.y-ideal.y);
     // Panic override: over-stretched near max IK reach, crossed under the
     // body to the opposite side, or far beyond threshold. Steps immediately,
     // regardless of neighbour gait coordination.
     const maxReach=leg.reach*1.25;
     const rootDist=Math.hypot(leg.foot.x-root.x,leg.foot.y-root.y);
     const signedSide=((leg.foot.x-c.x)*px+(leg.foot.y-c.y)*py)*leg.side;
     const panic=rootDist>maxReach*0.92 || signedSide<-w*0.30 || d>leg.reach*0.90;
     let busy;
     if(sp.gait==='wave'){
       // Metachronal wave: a leg may start once a same-side neighbour has
       // passed the first part of its swing, so steps travel along the body
       // in sequence instead of firing together. Opposite side is offset.
       busy=leg.neighbors.some(j=>{
         const o=legs[j]; if(!o.stepping) return false;
         if(o.side===leg.side) return o.stepT<0.60;
         return o.stepT<0.30;
       });
     } else {
       busy=leg.neighbors.some(j=>legs[j].stepping);
     }
     if(d>leg.reach*0.38 && (!busy || panic)){
       leg.stepping=true;leg.stepT=0;
       leg.from={x:leg.foot.x,y:leg.foot.y};
       leg.to={x:ideal.x,y:ideal.y};
       leg.dur=panic?0.22:0.30+rng()*0.12;
       // Bezier controls: one third and two thirds along the step, pushed
       // outward from the body by clearance scaled to step distance.
       const sx=leg.to.x-leg.from.x,sy=leg.to.y-leg.from.y;
       const sd=Math.hypot(sx,sy)||1;
       const clear=clamp(sd*0.30,6,leg.reach*0.40);
       const ox=px*leg.side,oy=py*leg.side;
       leg.c1={x:leg.from.x+sx*0.33+ox*clear,y:leg.from.y+sy*0.33+oy*clear};
       leg.c2={x:leg.from.x+sx*0.67+ox*clear,y:leg.from.y+sy*0.67+oy*clear};
     }
   }
   const fr = sp.joints===3 ? [0.40,0.35,0.25] : [0.30,0.28,0.24,0.18];
   const total=leg.reach*1.25;
   const lens=fr.map(f=>f*total);
   leg.pts=solveLeg(root,leg.foot,lens,px*leg.side,py*leg.side);
 });
 for(let i=0;i<sp.segs;i++){prevCenters[i]=segCenter(i);prevSegAngles[i]=segAngle(i);}
}
function drawGrid(){
 ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;ctx.beginPath();
 const g=48;
 for(let x=0;x<=W;x+=g){ctx.moveTo(x,0);ctx.lineTo(x,H);}
 for(let y=0;y<=H;y+=g){ctx.moveTo(0,y);ctx.lineTo(W,y);}
 ctx.stroke();
}
function drawReticle(x,y,kind,r,col){
 ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.globalAlpha=0.75;ctx.lineWidth=1.2;
 if(kind==='box'){ctx.strokeRect(-r,-r,2*r,2*r);}
 else if(kind==='diamond'){ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r,0);ctx.lineTo(0,r);ctx.lineTo(-r,0);ctx.closePath();ctx.stroke();}
 else {ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();}
 ctx.restore();
}
function draw(){
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 drawGrid();
 // Spine conduit.
 ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;ctx.beginPath();
 joints.forEach((j,i)=>{if(i===0)ctx.moveTo(j.x,j.y);else ctx.lineTo(j.x,j.y);});
 ctx.stroke();
 // Spring antennae on the head segment, drawn as two short jointed feelers.
 if(antennae.length){
   const col=sp.pal[0];
   for(const ant of antennae){
     const bx=joints[0].x,by=joints[0].y;
     const a1=ant.ang,a2=ant.ang+ant.vel*0.08;
     const l1=segLen*0.55,l2=segLen*0.45;
     const mx=bx+Math.cos(a1)*l1,my=by+Math.sin(a1)*l1;
     const tx=mx+Math.cos(a2)*l2,ty=my+Math.sin(a2)*l2;
     ctx.strokeStyle=col;ctx.globalAlpha=0.85;ctx.lineWidth=1.4;ctx.beginPath();
     ctx.moveTo(bx,by);ctx.lineTo(mx,my);ctx.lineTo(tx,ty);ctx.stroke();ctx.globalAlpha=1;
     ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tx,ty,Math.max(1.5,segW*0.05),0,TAU);ctx.fill();
   }
 }
 // Leg hulls first (wide, faint), then leg strokes.
 legs.forEach((leg)=>{
   if(!leg.pts) return;
   const col=sp.pal[leg.seg%sp.pal.length];
   ctx.strokeStyle=col;ctx.globalAlpha=0.12;ctx.lineWidth=Math.max(4,segW*0.22);ctx.lineCap='round';ctx.beginPath();
   leg.pts.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});
   ctx.stroke();ctx.globalAlpha=1;
 });
 legs.forEach((leg)=>{
   if(!leg.pts) return;
   const col=sp.pal[leg.seg%sp.pal.length];
   ctx.strokeStyle=col;ctx.globalAlpha=0.9;ctx.lineWidth=1.6;ctx.lineCap='round';ctx.beginPath();
   leg.pts.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});
   ctx.stroke();ctx.globalAlpha=1;
   // Joint nodes.
   ctx.fillStyle='#fff';
   leg.pts.forEach((p,i)=>{if(i===0||i===leg.pts.length-1) return;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.5,segW*0.05),0,TAU);ctx.fill();});
   // Foot reticle and glowing tip.
   const tip=leg.pts[leg.pts.length-1];
   drawReticle(tip.x,tip.y,sp.reticle,Math.max(5,segW*0.16),col);
   ctx.fillStyle=col;ctx.globalAlpha=0.25;ctx.beginPath();ctx.arc(tip.x,tip.y,Math.max(6,segW*0.20),0,TAU);ctx.fill();ctx.globalAlpha=1;
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tip.x,tip.y,Math.max(1.5,segW*0.05),0,TAU);ctx.fill();
 });
 // Chassis segments: rectangular wireframe, pulsing circuit cells.
 for(let i=0;i<sp.segs;i++){
   const c=segCenter(i),a=segAngle(i),w=segWidth(i),len=segLen*1.08;
   const col=sp.pal[i%sp.pal.length];
   ctx.save();ctx.translate(c.x,c.y);ctx.rotate(a);
   ctx.strokeStyle=col;ctx.globalAlpha=0.95;ctx.lineWidth=1.5;
   ctx.strokeRect(-len/2,-w/2,len,w);
   ctx.globalAlpha=0.35;ctx.beginPath();ctx.moveTo(-len/2,0);ctx.lineTo(len/2,0);ctx.stroke();ctx.globalAlpha=1;
   const cells=2+(i%2);
   for(let k=0;k<cells;k++){
     const pulse=0.35+0.45*(0.5+0.5*Math.sin(time*2.5+i*1.3+k*2.1));
     ctx.globalAlpha=pulse;ctx.strokeStyle='#fff';ctx.lineWidth=1;
     const cx2=-len*0.28+k*(len*0.28);
     ctx.strokeRect(cx2-w*0.11,-w*0.22,w*0.22,w*0.44);
     ctx.globalAlpha=1;
   }
   ctx.restore();
   // Spine joint node.
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joints[i].x,joints[i].y,Math.max(2,segW*0.07),0,TAU);ctx.fill();
 }
}
function frame(now){
 const dt=Math.min(0.05,(now-lastT)/1000||0.016);
 lastT=now;time+=dt;
 updateTarget(dt);
 updateSpine(dt);
 updateLegs(dt);
 draw();
 requestAnimationFrame(frame);
}
buildSpecies(Math.floor(rng()*SPECIES.length));
addEventListener('pointerdown',e=>{dragging=true;downX=e.clientX;downY=e.clientY;dragX=e.clientX;dragY=e.clientY;moved=0;});
addEventListener('pointermove',e=>{if(dragging){moved=Math.max(moved,Math.hypot(e.clientX-downX,e.clientY-downY));dragX=e.clientX;dragY=e.clientY;}});
addEventListener('pointerup',()=>{
 if(dragging && moved<8){
   // Tap, not drag: reseed species and segments.
   rng=mulberry((Math.random()*1e9)|0);
   buildSpecies(Math.floor(rng()*SPECIES.length));
 }
 dragging=false;
});
requestAnimationFrame((t)=>{lastT=t;requestAnimationFrame(frame);});
</script>
</body>
</html>
