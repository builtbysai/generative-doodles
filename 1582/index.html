<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decomposed by Its Spheres</title>
<style>
html, body { margin: 0; padding: 0; background: #3E7A4E; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#3E7A4E';
var MATTE = '#F5F5F2';
var GLASS = '#9AC4E8';
var LOOP = 30;                       // seamless loop, seconds
var N = 12;                          // petals per ring, perfect radial symmetry
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, startT = null;

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }
// Separation envelope over one 30 s loop, pure function of phase:
// rise 0-0.28, hang apart 0.28-0.50, glide back 0.50-0.78, rest solid
// 0.78-1.00. s(0) = s(1) = 0 exactly, so the loop point is invisible.
function separation(u) {
  if (u < 0.28) return smooth(u / 0.28);
  if (u < 0.50) return 1;
  if (u < 0.78) return 1 - smooth((u - 0.50) / 0.28);
  return 0;
}
// One petal shard: a leaf-shaped lens along the +x axis, from r0 to r1,
// half-width w at mid-length. Drawn in a rotated frame so every petal is
// the same shape turned by its symmetry angle.
function petalPath(r0, r1, w) {
  var mid = (r0 + r1) / 2;
  ctx.beginPath();
  ctx.moveTo(r0, 0);
  ctx.quadraticCurveTo(mid, -w, r1, 0);
  ctx.quadraticCurveTo(mid, w, r0, 0);
  ctx.closePath();
}
function drawPetal(angle, off, r0, r1, w, glass, u) {
  ctx.save();
  ctx.translate(VW / 2, VH / 2);
  ctx.rotate(angle);
  ctx.translate(off, 0);
  petalPath(r0, r1, w);
  if (glass) {
    // Clear glass: faint blue tint fill, white rim, white highlight
    // streak along the upper edge.
    ctx.globalAlpha = Number((0.30).toFixed(4));
    ctx.fillStyle = GLASS;
    ctx.fill();
    ctx.globalAlpha = Number((0.65).toFixed(4));
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = Math.max(1, u * 0.004);
    ctx.stroke();
    ctx.globalAlpha = Number((0.85).toFixed(4));
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = Math.max(1, u * 0.010);
    ctx.beginPath();
    ctx.moveTo(r0 + (r1 - r0) * 0.18, -w * 0.42);
    ctx.quadraticCurveTo((r0 + r1) / 2, -w * 0.55, r1 * 0.93, -w * 0.10);
    ctx.stroke();
  } else {
    // Matte white shard with a hairline of ground green so neighbouring
    // petals stay legible where they overlap.
    ctx.globalAlpha = 1;
    ctx.fillStyle = MATTE;
    ctx.fill();
    ctx.globalAlpha = Number((0.45).toFixed(4));
    ctx.strokeStyle = GROUND;
    ctx.lineWidth = Math.max(1, u * 0.003);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}
function draw(t) {
  size();
  var minDim = Math.min(VW, VH);
  var u = minDim / 900;
  // Rosette diameter is ~75% of the frame's smaller side.
  var R = minDim * 0.375;
  var phase = ((t % LOOP) + LOOP) % LOOP;
  var s = separation(phase / LOOP);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var i, angle;
  // Inner ring: 12 shorter shards, offset by half a step so they nest
  // between the outer petals. Glass and matte alternate, opposite phase
  // to the outer ring.
  for (i = 0; i < N; i++) {
    angle = (i + 0.5) * TAU / N;
    drawPetal(angle, 0.055 * R * s, R * 0.10, R * 0.55, R * 0.115, (i % 2 === 1), u);
  }
  // Outer ring: 12 long shards. At rest their tips reach R; at full
  // separation they reach 1.10 R, then glide back.
  for (i = 0; i < N; i++) {
    angle = i * TAU / N;
    drawPetal(angle, 0.10 * R * s, R * 0.12, R, R * 0.155, (i % 2 === 0), u);
  }
  // Solid core: matte disc with a thin glass ring.
  ctx.beginPath();
  ctx.moveTo(VW / 2 + R * 0.10, VH / 2);
  ctx.arc(VW / 2, VH / 2, R * 0.10, 0, TAU);
  ctx.fillStyle = MATTE;
  ctx.fill();
  ctx.globalAlpha = Number((0.7).toFixed(4));
  ctx.strokeStyle = GLASS;
  ctx.lineWidth = Math.max(1, u * 0.008);
  ctx.beginPath();
  ctx.moveTo(VW / 2 + R * 0.125, VH / 2);
  ctx.arc(VW / 2, VH / 2, R * 0.125, 0, TAU);
  ctx.stroke();
  ctx.globalAlpha = 1;
  if (typeof window !== 'undefined') {
    window.__p1582 = {
      t: t, phase: phase, separation: s, phone: isPhone()
    };
    window.__draw1582 = draw;
  }
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = ((ts - startT) / 1000) % LOOP;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
