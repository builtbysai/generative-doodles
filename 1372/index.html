<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skytyped</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #C9D4D8; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // Seeded PRNG (mulberry32). Never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;
  var gusts = []; // recorded pointerdown gusts: {x, y, t}
  var booted = false;

  function viewportSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      w = window.innerWidth;
      h = window.innerHeight;
    } else {
      w = 1280; h = 900;
    }
    return { w: w, h: h };
  }

  function resize() {
    var s = viewportSize();
    W = s.w; H = s.h;
    canvas.width = W;
    canvas.height = H;
    // Pin canvas in draw(): style size in px (house rule).
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function isPhone() {
    if (typeof window !== 'undefined' && window.screen &&
        typeof window.screen.width === 'number') {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) return true;
    }
    return H > W * 1.15;
  }

  // ---- Seeded grid landscape (lower third) ----
  function gridLayout() {
    var rng = mulberry32(1372000 + 777);
    var blocks = [];
    var rows = [0.70, 0.82, 0.94];
    for (var r = 0; r < rows.length; r++) {
      var y = rows[r] * H;
      var x = -20;
      while (x < W + 40) {
        var bw = W * (0.03 + rng() * 0.05);
        var bh = H * (0.012 + rng() * 0.028);
        var ochre = rng() < 0.08;
        blocks.push({ x: x, y: y, w: bw, h: bh, ochre: ochre });
        x += bw + W * (0.012 + rng() * 0.03);
      }
    }
    var fences = [];
    for (var fx = W * 0.02; fx < W; fx += W / 38) {
      fences.push(fx + (rng() - 0.5) * W * 0.008);
    }
    return { blocks: blocks, fences: fences };
  }

  // ---- Seeded pseudo-script message along an arc ----
  // Mark types: 0 dash, 1 dot pair, 2 chevron, 3 arc, 4 tick, 5 cross,
  // 6 circle outline, 7 zigzag. Never letterforms, never readable words.
  function buildMessage(msgIndex) {
    var rng = mulberry32(1372000 + msgIndex * 7919);
    var count = 26;
    var phase = rng() * Math.PI * 2;
    var marks = [];
    for (var i = 0; i < count; i++) {
      var f = i / (count - 1);
      var x = W * (0.08 + 0.84 * f);
      var y = H * 0.30 - Math.sin(Math.PI * f) * H * 0.10
            + Math.sin(f * 5.2 + phase) * H * 0.02;
      marks.push({
        x: x, y: y,
        type: Math.floor(rng() * 8),
        size: Math.min(W, H) * (0.014 + rng() * 0.016),
        rot: (rng() - 0.5) * 0.9,
        ax: Math.cos(rng() * Math.PI * 2),
        ay: Math.sin(rng() * Math.PI * 2) - 0.4
      });
    }
    return marks;
  }

  function drawMark(m, alpha) {
    var s = m.size;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    ctx.strokeStyle = 'rgba(242,242,238,' + alpha.toFixed(3) + ')';
    ctx.lineWidth = Math.max(2, Math.min(W, H) * 0.004);
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (m.type === 0) { // dash
      ctx.moveTo(-s, 0); ctx.lineTo(s, 0);
    } else if (m.type === 1) { // dot pair
      ctx.moveTo(-s * 0.7, 0); ctx.lineTo(-s * 0.7, 0);
      ctx.moveTo(s * 0.7, 0); ctx.lineTo(s * 0.7, 0);
      ctx.lineWidth = Math.max(3, Math.min(W, H) * 0.008);
    } else if (m.type === 2) { // chevron
      ctx.moveTo(-s, s * 0.6); ctx.lineTo(0, -s * 0.6); ctx.lineTo(s, s * 0.6);
    } else if (m.type === 3) { // arc
      ctx.moveTo(-s, 0);
      ctx.arc(0, 0, s, Math.PI, 0);
    } else if (m.type === 4) { // tick
      ctx.moveTo(0, -s); ctx.lineTo(0, s);
    } else if (m.type === 5) { // cross
      ctx.moveTo(-s, 0); ctx.lineTo(s, 0);
      ctx.moveTo(0, -s); ctx.lineTo(0, s);
    } else if (m.type === 6) { // circle outline
      ctx.moveTo(s, 0);
      ctx.arc(0, 0, s, 0, Math.PI * 2);
    } else { // zigzag
      ctx.moveTo(-s, s * 0.5); ctx.lineTo(-s * 0.33, -s * 0.5);
      ctx.lineTo(s * 0.33, s * 0.5); ctx.lineTo(s, -s * 0.5);
    }
    ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    // t: piece time in seconds. Frame one = draw(0) via boot flag.
    // Cycle: 90 s. Phase-shifted +12 s so frame one is mid-draw.
    var ct = (t + 12) % 90;
    var msgIndex = Math.floor((t + 12) / 90);
    var marks = buildMessage(msgIndex);
    var grid = gridLayout();

    // Sky = the page.
    ctx.fillStyle = '#C9D4D8';
    ctx.fillRect(0, 0, W, H);

    // Lower third: faint ground wash, then grid.
    ctx.fillStyle = 'rgba(90,94,99,0.14)';
    ctx.fillRect(0, H * 0.667, W, H * 0.333);
    // Horizon line.
    ctx.fillStyle = '#2A2C2E';
    ctx.fillRect(0, H * 0.667, W, 2);
    // Fence lines (thin).
    ctx.strokeStyle = '#2A2C2E';
    ctx.lineWidth = 1;
    for (var fi = 0; fi < grid.fences.length; fi++) {
      var fx = grid.fences[fi];
      ctx.beginPath();
      ctx.moveTo(fx, H * 0.68);
      ctx.lineTo(fx, H * 0.99);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(0, H * 0.72); ctx.lineTo(W, H * 0.72);
    ctx.moveTo(0, H * 0.86); ctx.lineTo(W, H * 0.86);
    ctx.stroke();
    // Low blocks.
    for (var bi = 0; bi < grid.blocks.length; bi++) {
      var b = grid.blocks[bi];
      ctx.fillStyle = b.ochre ? '#B4762A' : '#5A5E63';
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }

    // Gust strength: closed-form sum over recorded gusts, exponential decay.
    var gustStrength = 0;
    for (var gi = 0; gi < gusts.length; gi++) {
      var age = t - gusts[gi].t;
      if (age >= 0) gustStrength += Math.exp(-age / 2.5);
    }
    if (gustStrength > 1.5) gustStrength = 1.5;

    // Trace phase: draw 0-30, hold 30-50, dissolve 50-90.
    var reveal, dissolve;
    if (ct < 30) { reveal = ct / 30; dissolve = 0; }
    else if (ct < 50) { reveal = 1; dissolve = 0; }
    else { reveal = 1; dissolve = (ct - 50) / 40; }
    // A gust scatters vapor faster: extra dissolve + scatter, decaying.
    var dissolveEff = dissolve + gustStrength * 0.2;
    if (dissolveEff > 1) dissolveEff = 1;

    var visible = Math.floor(reveal * marks.length);
    var lead = reveal * marks.length - visible;
    for (var mi = 0; mi < marks.length; mi++) {
      var alpha;
      if (mi < visible) alpha = 1;
      else if (mi === visible && reveal < 1) alpha = lead;
      else alpha = 0;
      if (alpha <= 0) continue;
      // Dissolve: fade + scatter drift (rising dissipation).
      var m = marks[mi];
      var sx = m.x + m.ax * dissolveEff * 34 + m.ax * gustStrength * 18;
      var sy = m.y + m.ay * dissolveEff * 26 - dissolveEff * 14
             + m.ay * gustStrength * 12;
      var a = alpha * (1 - dissolveEff) * (1 - 0.35 * Math.min(gustStrength, 1));
      if (a <= 0.01) continue;
      // Vapor halo: faint wide stroke beneath the crisp stroke.
      var saved = { x: m.x, y: m.y };
      m.x = sx; m.y = sy;
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.restore();
      // Halo pass (low alpha, wider line).
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(m.rot);
      ctx.strokeStyle = 'rgba(242,242,238,' + (a * 0.18).toFixed(3) + ')';
      ctx.lineWidth = Math.max(5, Math.min(W, H) * 0.012);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-m.size, 0); ctx.lineTo(m.size, 0);
      ctx.stroke();
      ctx.restore();
      drawMark(m, a);
      m.x = saved.x; m.y = saved.y;
    }

    // Pin canvas in draw() (house rule).
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function onPointer(e) {
    var x = (typeof e.clientX === 'number') ? e.clientX : W / 2;
    var y = (typeof e.clientY === 'number') ? e.clientY : H / 3;
    // Gust time: piece time is tracked via lastT.
    gusts.push({ x: x, y: y, t: lastT });
    if (gusts.length > 24) gusts.shift();
    // No replay, no save, no reload. The gust only scatters vapor.
  }

  var lastT = 0;
  var startTs = null;

  function loop(ts) {
    if (startTs === null) startTs = ts;
    lastT = (ts - startTs) / 1000;
    draw(lastT);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }

  resize();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onPointer);
  }

  // Boot: synchronous first frame at constant phase.
  draw(0);
  booted = true;
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
