<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segs, Marbled</title>
<style>
html, body { margin: 0; padding: 0; background: #FBF8F1; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#FBF8F1';
var ORANGE = [201, 106, 43];
var ORANGE2 = [217, 123, 51];
var PALE = [232, 196, 150];
var CREAM = [242, 230, 204];
var UMBER = [107, 66, 38];
var MAROON = [92, 31, 31];
var PLATE = '#FBF8F1';
var PLATE_LINE = 'rgba(107,66,38,0.55)';
var TITLE_INK = '#5C1F1F';
var HINT_INK = '#6B4226';
var FIRST_T = 60.0;
var ACCUM = 150.0;
var CYCLE_LEN = 210.0;
var SEGMENTS = 6500;
var VEINS = 10;
/* Circle segments sampled and layered in the thousands until the
   overlaps stop reading as shapes and start reading as stone.
   Strata banding comes from biasing each segment's radius and color
   by a slowly varying wavy spatial function of its vertical position,
   so agate-like orange and cream bands emerge from the overlap.
   Segments reveal on a fixed schedule: sparse arcs at t = 0, the
   phase change into marble around a minute in, full marble by 150 s,
   a hold, then a slow re-seed with a fresh seeded table every cycle.
   All tables come from a seeded RNG, so frame one (t = 60, strata
   already emerging) is a fixed developed state. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* Wavy band field: slowly varying spatial function of normalized y.
   drift is the slow scan of the stone slab. */
function bandAt(yN, drift) {
  return 0.5 + 0.5 * Math.sin(yN * TAU * 2.2 + 1.3 * Math.sin(yN * TAU * 0.9 + 0.7) + drift);
}
function bandColor(b, rng) {
  var j = rng();
  if (b < 0.22) return j < 0.6 ? CREAM : PALE;
  if (b < 0.45) return j < 0.5 ? ORANGE2 : PALE;
  if (b < 0.68) return j < 0.55 ? ORANGE : ORANGE2;
  if (b < 0.86) return j < 0.5 ? UMBER : ORANGE;
  return j < 0.6 ? MAROON : UMBER;
}
var segTable = [];
var veinTable = [];
var currentCycle = -1;
function buildTables(cycle) {
  var rng = mulberry32(1668 + cycle * 7919);
  var i, b;
  segTable = [];
  for (i = 0; i < SEGMENTS; i++) {
    var xN = -0.06 + rng() * 1.12;
    var yN = -0.06 + rng() * 1.12;
    b = bandAt(yN, 0);
    segTable.push({
      x: xN, y: yN,
      r: (0.05 + 0.09 * b) * (0.7 + rng() * 1.0),
      a0: rng() * TAU,
      span: 0.3 + rng() * 1.9,
      col: bandColor(b, rng),
      alpha: 0.07 + rng() * 0.11,
      w: 1.5 + rng() * 4.5,
      filled: rng() < 0.02,
      tr: ACCUM * Math.pow(rng(), 1.6)
    });
  }
  veinTable = [];
  for (i = 0; i < VEINS; i++) {
    veinTable.push({
      y0: (i + 0.35 + rng() * 0.3) / VEINS,
      phase: rng() * TAU,
      freq: 1.2 + rng() * 1.4,
      freq2: 2.6 + rng() * 2.0,
      amp: 0.012 + rng() * 0.016,
      col: rng() < 0.55 ? MAROON : UMBER,
      alpha: 0.04 + rng() * 0.04,
      w: 0.8 + rng() * 1.2,
      tr: 40 + rng() * 60
    });
  }
  currentCycle = cycle;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function drawSegments(accumT, drift, S) {
  var i, s, x, y;
  ctx.lineCap = 'round';
  for (i = 0; i < segTable.length; i++) {
    s = segTable[i];
    if (s.tr > accumT) continue;
    x = s.x * VW;
    y = s.y * VH;
    if (s.filled) {
      ctx.fillStyle = rgba(s.col, s.alpha * 0.5);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.arc(x, y, s.r * S * 0.45, s.a0, s.a0 + s.span);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.strokeStyle = rgba(s.col, s.alpha);
      ctx.lineWidth = s.w;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(s.a0) * s.r * S, y + Math.sin(s.a0) * s.r * S);
      ctx.arc(x, y, s.r * S, s.a0, s.a0 + s.span);
      ctx.stroke();
    }
  }
}
function drawVeins(accumT, drift) {
  var i, v, x, k, y;
  ctx.lineCap = 'round';
  for (i = 0; i < veinTable.length; i++) {
    v = veinTable[i];
    if (v.tr > accumT) continue;
    ctx.strokeStyle = rgba(v.col, v.alpha);
    ctx.lineWidth = v.w;
    ctx.beginPath();
    for (k = 0; k <= 48; k++) {
      x = -0.05 + (k / 48) * 1.1;
      y = (v.y0 + v.amp * Math.sin(x * TAU * v.freq + v.phase)
        + v.amp * 0.45 * Math.sin(x * TAU * v.freq2 + v.phase * 1.7)
        + drift * 0.06) * VH;
      if (k === 0) ctx.moveTo(x * VW, y); else ctx.lineTo(x * VW, y);
    }
    ctx.stroke();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Segs, Marbled').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Segs, Marbled').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 06').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Segs, Marbled', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 06', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var S = Math.min(VW, VH);
  var cycle = Math.floor(t / CYCLE_LEN);
  if (cycle !== currentCycle) buildTables(cycle);
  var localT = t - cycle * CYCLE_LEN;
  var accumT = localT < ACCUM ? localT : ACCUM;
  var drift = 0.0006 * t;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawSegments(accumT, drift, S);
  drawVeins(accumT, drift);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    segmentCount: function () { return SEGMENTS; }
  };
}
/* ---- frame one: t = FIRST_T, strata already emerging ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
