<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microshift Strips</title>
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- constants ----------
var DW = 800, DH = 1000;               // design space, 4:5 portrait logic
var PHASE0 = 3.7;                      // constant first-frame phase (seconds)
var SWAP_EVERY = 12, SWAP_DUR = 0.4;   // glyph swap cadence / slide duration
var BASE_SEED = 508004;
var GREEN = "#35A845", DARKG = "#1A3A1E", WHITE = "#FFFFFF", YELLOW = "#F2D800";
var LINEBLUE = "#2E9BDB";
var GROUNDS = [GREEN, DARKG, WHITE, YELLOW];
var CANON = ["kid", "chair", "lamp", "dog", "pizza", "coffee"];

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone() {
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  if (Math.min(sw, sh) < 700) return true;
  return H > W * 1.15;
}

// ---------- palettes per ground ----------
function palFor(ground) {
  if (ground === GREEN) return { ink: "#F2F0EA", dark: "#1A3A1E", red: "#E63946", blue: "#2E9BDB", yel: "#F2D800", skin: "#F2F0EA", leaf: "#F2D800" };
  if (ground === DARKG) return { ink: "#F2F0EA", dark: "#35A845", red: "#E63946", blue: "#2E9BDB", yel: "#F2D800", skin: "#F2F0EA", leaf: "#35A845" };
  if (ground === YELLOW) return { ink: "#1A3A1E", dark: "#1A3A1E", red: "#E63946", blue: "#2E9BDB", yel: "#F2F0EA", skin: "#F2F0EA", leaf: "#35A845" };
  return { ink: "#1A3A1E", dark: "#1A3A1E", red: "#E63946", blue: "#2E9BDB", yel: "#F2D800", skin: "#F2F0EA", leaf: "#35A845" };
}

// ---------- layout ----------
function buildLayout(seed, allowEight) {
  var rnd = mulberry32(seed);
  var n = allowEight ? 6 + Math.floor(rnd() * 3) : 6 + Math.floor(rnd() * 2);
  var center = Math.floor(n / 2);
  var i, j;
  // grounds: center always white, neighbours never equal
  var grounds = new Array(n);
  grounds[center] = WHITE;
  for (i = 0; i < n; i++) {
    if (i === center) continue;
    var prev = (i > 0) ? grounds[i - 1] : null;
    var g;
    do { g = GROUNDS[Math.floor(rnd() * GROUNDS.length)]; }
    while (g === prev || (i === center - 1 && g === WHITE) || (i === center + 1 && g === WHITE));
    grounds[i] = g;
  }
  // glyph assignment: worker fixed at center, canonical set shuffled into the rest
  var slots = [];
  for (i = 0; i < n; i++) if (i !== center) slots.push(i);
  var pool = CANON.slice();
  if (slots.length > pool.length) pool.push("sprout");
  for (i = pool.length - 1; i > 0; i--) { j = Math.floor(rnd() * (i + 1)); var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp; }
  var glyphs = new Array(n);
  glyphs[center] = "worker";
  for (i = 0; i < slots.length; i++) glyphs[slots[i]] = pool[i];
  // precomputed swap schedule (deterministic): pairs of non-center slots
  var pairs = [];
  for (i = 0; i < 96; i++) {
    var a = slots[Math.floor(rnd() * slots.length)];
    var b = slots[Math.floor(rnd() * slots.length)];
    if (a === b) b = slots[(slots.indexOf(b) + 1) % slots.length];
    pairs.push([a, b]);
  }
  // grain: precomputed seeded specks per strip (house adaptation, no offscreen canvas)
  var speckCount = isPhone() ? 55 : 90;
  var specks = [];
  for (i = 0; i < n; i++) {
    var arr = [];
    for (j = 0; j < speckCount; j++) {
      arr.push({ x: rnd(), y: rnd(), r: 0.8 + rnd() * 1.7, a: 0.04 + rnd() * 0.08, dark: rnd() < 0.5 });
    }
    specks.push(arr);
  }
  return { n: n, center: center, grounds: grounds, glyphs: glyphs, pairs: pairs, specks: specks, stripW: DW / n };
}

var seedIndex = 0;
var layout = buildLayout(BASE_SEED, false);

// glyph assignment at time t, plus any in-flight swap animation
function assignmentAt(t) {
  var cur = layout.glyphs.slice();
  var anim = null;
  var kMax = Math.floor(t / SWAP_EVERY);
  for (var k = 1; k <= kMax; k++) {
    var et = k * SWAP_EVERY;
    var pr = layout.pairs[(k - 1) % layout.pairs.length];
    if (t < et + SWAP_DUR) {
      anim = { a: pr[0], b: pr[1], p: (t - et) / SWAP_DUR, from: cur.slice() };
      break;
    }
    var tmp = cur[pr[0]]; cur[pr[0]] = cur[pr[1]]; cur[pr[1]] = tmp;
  }
  return { glyphs: cur, anim: anim };
}

// ---------- tiny draw helpers (local coords, origin at glyph centre) ----------
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fillStyle = fill; ctx.fill(); }
function ring(x, y, r, stroke, lw) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
function ell(x, y, rx, ry, fill, rot) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, 6.2832); ctx.fillStyle = fill; ctx.fill();
}
function ellRing(x, y, rx, ry, stroke, lw) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.2832); ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
function rect(x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
function line(x1, y1, x2, y2, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.stroke();
}
function poly(pts, fill) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function hairCap(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, Math.PI, 0); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
function head(x, y, r, pal) { circle(x, y, r, pal.skin); ring(x, y, r, pal.dark, 1.6); hairCap(x, y - r * 0.12, r * 0.98, pal.dark); }

// ---------- glyphs ----------
function gKid(t, pal, ph) {
  var bob = Math.sin(t * 1.4 + ph) * 1.5;
  ctx.save(); ctx.translate(0, bob);
  rect(-11, 28, 8, 21, pal.blue); rect(3, 28, 8, 21, pal.blue);
  ell(-7, 51, 7, 3.5, pal.red); ell(7, 51, 7, 3.5, pal.red);
  rect(-12, -22, 24, 30, pal.red);
  line(-12, -15, -25, 9, pal.red, 7); line(12, -15, 25, 9, pal.red, 7);
  head(0, -33, 11, pal);
  circle(0, 8, 27, "#F2F0EA"); ring(0, 8, 27, pal.blue, 3.5);
  line(0, -19, 0, -14, pal.dark, 2); line(27, 8, 22, 8, pal.dark, 2); line(-27, 8, -22, 8, pal.dark, 2); line(0, 35, 0, 30, pal.dark, 2);
  var ha = -2.2, ma = -t * 1.047 + 0.8;
  line(0, 8, Math.cos(ha) * 13, 8 + Math.sin(ha) * 13, pal.dark, 4);
  line(0, 8, Math.cos(ma) * 20, 8 + Math.sin(ma) * 20, pal.dark, 3);
  circle(0, 8, 3, pal.red);
  ctx.restore();
}

function gChair(t, pal, ph) {
  var bob = Math.sin(t * 1.3 + ph) * 2;
  ctx.save(); ctx.translate(0, bob);
  rect(-19, -36, 4, 66, pal.dark); rect(15, -36, 4, 66, pal.dark);
  rect(-21, 0, 42, 5, pal.dark);
  line(-17, 5, -21, 52, pal.dark, 4); line(17, 5, 21, 52, pal.dark, 4);
  rect(-19, 30, 38, 3.5, pal.dark);
  rect(-11, 5, 7, 20, pal.blue); rect(4, 5, 7, 20, pal.blue);
  ell(-7.5, 27, 6, 3, pal.red); ell(7.5, 27, 6, 3, pal.red);
  rect(-10, -16, 20, 22, pal.red);
  line(9, -8, 20, -10, pal.red, 6);
  rect(-23, -12, 46, 4.5, pal.dark);
  head(0, -27, 10.5, pal);
  ctx.restore();
}

function gLamp(t, pal, ph) {
  ctx.save(); ctx.translate(0, 50); ctx.rotate(Math.sin(t * 0.9 + ph) * 0.055); ctx.translate(0, -50);
  poly([[15, -15], [31, -13], [48, 36], [26, 36]], "rgba(242,216,0,0.30)");
  ell(0, 50, 20, 5, pal.dark);
  line(0, 50, -4, 4, pal.dark, 5); line(-4, 4, 14, -20, pal.dark, 5);
  circle(-4, 4, 3.5, pal.dark); circle(14, -20, 3.5, pal.dark);
  poly([[4, -31], [33, -27], [27, -8], [8, -10]], pal.red);
  circle(17, -12, 4, pal.yel);
  ctx.restore();
}

function gDog(t, pal, ph) {
  var bob = Math.sin(t * 1.8 + ph) * 1.6;
  ctx.save(); ctx.translate(0, bob);
  // walker
  line(-20, 8, -29, 50, pal.dark, 7); line(-20, 8, -6, 50, pal.dark, 7);
  rect(-26, -22, 11, 32, pal.blue);
  head(-20, -33, 9.5, pal);
  line(-16, -14, -2, -4, pal.blue, 6);
  line(-2, -4, 22, 9, pal.red, 2.5);
  // dog
  ell(26, 26, 17, 10.5, pal.ink);
  line(16, 34, 16, 47, pal.ink, 3.5); line(23, 35, 23, 47, pal.ink, 3.5);
  line(32, 35, 32, 47, pal.ink, 3.5); line(38, 34, 38, 47, pal.ink, 3.5);
  circle(41, 16, 8.5, pal.ink);
  ell(38, 10, 3.5, 6, pal.dark);
  ell(46, 19, 3.5, 3, pal.ink);
  line(35, 11, 37, 22, pal.red, 3.5);
  ctx.save(); ctx.translate(10, 20); ctx.rotate(Math.sin(t * 6 + ph) * 0.45 - 0.3);
  line(0, 0, -12, -8, pal.ink, 3.5); ctx.restore();
  ctx.restore();
}

function gWorker(t, pal, ph) {
  var B = LINEBLUE;
  ctx.strokeStyle = B; ctx.fillStyle = B;
  line(-34, 30, 34, 30, B, 3);
  // torso outline
  ctx.beginPath(); ctx.moveTo(-15, -8); ctx.lineTo(15, -8); ctx.lineTo(18, 30); ctx.moveTo(-15, -8); ctx.lineTo(-18, 30);
  ctx.lineWidth = 3.2; ctx.stroke();
  line(-14, -4, -22, 16, B, 3.2); line(14, -4, 22, 16, B, 3.2);
  // laptop
  ctx.beginPath(); ctx.rect(-17, 4, 34, 24); ctx.lineWidth = 3.2; ctx.stroke();
  ctx.beginPath(); ctx.rect(-12.5, 8.5, 25, 15); ctx.lineWidth = 1.8; ctx.stroke();
  // head
  ring(0, -24, 11, B, 3.2);
  ctx.beginPath(); ctx.arc(0, -24, 11, Math.PI * 1.08, Math.PI * 1.92); ctx.lineWidth = 4; ctx.stroke();
  circle(-4, -24, 1.6, B); circle(4, -24, 1.6, B);
  ctx.beginPath(); ctx.arc(0, -19, 4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.lineWidth = 2; ctx.stroke();
  // blinking cursor
  if (((t + ph) % 1) < 0.55) rect(3, 12, 4.5, 8, B);
}

function gPizza(t, pal, ph) {
  var press = 0.5 + 0.5 * Math.sin(t * 1.6 + ph);
  ctx.save(); ctx.translate(0, 30); ctx.scale(1, 1 - press * 0.10);
  ell(0, 0, 31, 11, "#F2F0EA"); ellRing(0, 0, 31, 11, pal.dark, 2);
  var dots = [[-16, -2], [-4, 3], [10, -3], [20, 2], [2, -5], [-22, 3]];
  for (var i = 0; i < dots.length; i++) circle(dots[i][0], dots[i][1], 2.6, pal.red);
  ctx.restore();
  var hy = -4 + press * 6;
  var sides = [-15, 15];
  for (var s = 0; s < 2; s++) {
    var x = sides[s];
    rect(x - 4, -54, 8, 32, pal.blue);
    ctx.save(); ctx.translate(x, hy + 8);
    ell(0, 0, 10, 12, pal.skin); ellRing(0, 0, 10, 12, pal.dark, 2);
    ell(s === 0 ? 9 : -9, 4, 4, 6, pal.skin);
    ctx.restore();
  }
}

function gCoffee(t, pal, ph) {
  ell(0, 34, 23, 4.5, pal.dark);
  poly([[-17, -8], [17, -8], [12, 28], [-12, 28]], pal.blue);
  rect(-15.5, 2, 31, 6, "#F2F0EA");
  ctx.beginPath(); ctx.arc(20, 8, 9, -1.2, 1.2); ctx.strokeStyle = pal.blue; ctx.lineWidth = 4; ctx.stroke();
  for (var i = 0; i < 2; i++) {
    var baseX = -7 + i * 14;
    var rise = ((t * 13 + i * 23) % 36);
    var al = Math.max(0, 1 - rise / 36) * 0.9;
    ctx.save(); ctx.globalAlpha = al; ctx.strokeStyle = pal.ink; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath();
    for (var yy = 0; yy <= 18; yy += 3) {
      var xx = baseX + Math.sin(yy * 0.35 + i * 2.1) * 2.5;
      var yv = -16 - rise - yy;
      if (yy === 0) ctx.moveTo(xx, yv); else ctx.lineTo(xx, yv);
    }
    ctx.stroke(); ctx.restore();
  }
}

function gSprout(t, pal, ph) {
  ctx.save(); ctx.translate(0, 10); ctx.rotate(Math.sin(t * 1.1 + ph) * 0.04); ctx.translate(0, -10);
  line(0, 10, 0, -16, pal.leaf, 3.5);
  ell(-9, -14, 9, 4, pal.leaf, -0.6); ell(9, -20, 9, 4, pal.leaf, 0.6); ell(0, -28, 4.5, 9, pal.leaf, 0);
  ctx.restore();
  poly([[-14, 16], [14, 16], [10, 42], [-10, 42]], pal.red);
  rect(-16, 10, 32, 7, pal.red);
  line(-16, 17, 16, 17, pal.dark, 2);
}

var GLYPHS = { kid: gKid, chair: gChair, lamp: gLamp, dog: gDog, worker: gWorker, pizza: gPizza, coffee: gCoffee, sprout: gSprout };

function drawGlyph(name, cx, cy, u, t, pal, ph) {
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(u, u);
  GLYPHS[name](t, pal, ph);
  ctx.restore();
}

// ---------- main draw ----------
function draw(t) {
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, W, H);
  var scale = Math.min(W / DW, H / DH);
  var ox = (W - DW * scale) / 2, oy = (H - DH * scale) / 2;
  ctx.save();
  ctx.translate(ox, oy); ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(0, 0, DW, DH); ctx.clip();
  var sw = layout.stripW;
  var asg = assignmentAt(t);
  for (var i = 0; i < layout.n; i++) {
    var x0 = i * sw;
    var ground = layout.grounds[i];
    ctx.fillStyle = ground;
    ctx.fillRect(x0, 0, sw + 0.5, DH);
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, 0, sw, DH); ctx.clip();
    // grain specks
    var sp = layout.specks[i];
    for (var j = 0; j < sp.length; j++) {
      var s = sp[j];
      ctx.fillStyle = s.dark ? "rgba(0,0,0," + s.a + ")" : "rgba(255,255,255," + s.a + ")";
      ctx.beginPath(); ctx.arc(x0 + s.x * sw, s.y * DH, s.r, 0, 6.2832); ctx.fill();
    }
    var pal = palFor(ground);
    var ph = i * 1.37;
    var u = sw / 100;
    var name = asg.glyphs[i];
    var anim = asg.anim;
    if (anim && (i === anim.a || i === anim.b)) {
      var ease = anim.p < 0.5 ? 2 * anim.p * anim.p : 1 - Math.pow(-2 * anim.p + 2, 2) / 2;
      var outName = anim.from[i];
      var inName = (i === anim.a) ? anim.from[anim.b] : anim.from[anim.a];
      drawGlyph(outName, x0 + sw / 2, DH / 2 + ease * DH, u, t, pal, ph);
      drawGlyph(inName, x0 + sw / 2, DH / 2 - (1 - ease) * DH, u, t, pal, ph);
    } else {
      drawGlyph(name, x0 + sw / 2, DH / 2, u, t, pal, ph);
    }
    ctx.restore();
  }
  ctx.restore();
}

// ---------- sizing / loop ----------
var startStamp = null;
function frame(ts) {
  if (startStamp === null) startStamp = ts;
  draw(PHASE0 + (ts - startStamp) / 1000);
  requestAnimationFrame(frame);
}
function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  draw(PHASE0 + (startStamp === null ? 0 : (performance.now() - startStamp) / 1000));
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
window.addEventListener("resize", resize);
resize();
draw(PHASE0);
if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);

// ---------- double-tap reseed ----------
var lastTap = 0, lastReseed = 0;
function reseed() {
  var now = performance.now();
  if (now - lastReseed < 400) return;
  lastReseed = now;
  seedIndex++;
  layout = buildLayout(BASE_SEED + seedIndex * 7919, true);
}
canvas.addEventListener("pointerup", function () {
  var now = performance.now();
  if (now - lastTap < 320) reseed();
  lastTap = now;
});
canvas.addEventListener("dblclick", reseed);
</script>
</body>
</html>
