<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Refugios Escondidos</title>
<style>
  html, body { margin: 0; padding: 0; background: #171A1F; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SEED = 638077;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette (strict, no more) ----------
  var CITY = '#23272E', ROOF = '#171A1F', AMBER = '#D8A94E',
      GLOW = '#E89B5A', BIRD = '#5EBF8A', WING = '#F2EDDA';

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function rgba(h, a) {
    var c = hexRgb(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function easeIO(x) { x = clamp01(x); return x * x * (3 - 2 * x); }
  function mod(n, m) { return ((n % m) + m) % m; }

  // ---------- viewport ----------
  var W = 0, H = 0, DPR = 1, phone = false, elapsedNow = 0;
  function fit() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    var smin = (window.screen && window.screen.width) ? Math.min(window.screen.width, window.screen.height) : 0;
    phone = smin ? (smin < 700) : (H > W * 1.15);
  }
  function onResize() { fit(); draw(elapsedNow); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  // ---------- city generation ----------
  // Block space: x in [0, BW), y in [0, 1] (0 top, 1 bottom). The visible
  // window is 1 unit wide; the block is 2 units and wraps toroidally.
  var BW = 2;
  var backBand = [], frontBand = [], refuges = [], order = [];
  var generation = 0;
  var itinRng = null;

  function genCity(gen) {
    var rng = mulberry32(SEED + gen * 7919);
    backBand = []; frontBand = []; refuges = [];
    var x, w, top, b, i, j;

    // back band: shorter, dimmer silhouettes
    x = -0.02;
    while (x < BW) {
      w = 0.06 + rng() * 0.10;
      top = 0.34 + rng() * 0.28;
      b = { x: x, w: w, top: top, lit: [] };
      var cols = Math.max(2, Math.floor(w / 0.02));
      var rows = Math.max(2, Math.floor((1 - top) / 0.045));
      for (i = 0; i < cols; i++) for (j = 0; j < rows; j++) {
        if (rng() < 0.02) b.lit.push([i, j]);
      }
      b.cols = cols; b.rows = rows;
      backBand.push(b);
      x += w + 0.004 + rng() * 0.016;
    }

    // front band: taller blocks with roofs, towers, antennae, lit windows
    x = -0.02;
    while (x < BW) {
      w = 0.09 + rng() * 0.14;
      top = 0.16 + rng() * 0.36;
      b = { x: x, w: w, top: top, lit: [], tower: false, antenna: false, ax: 0 };
      b.cols = Math.max(3, Math.floor(w / 0.02));
      b.rows = Math.max(3, Math.floor((1 - top) / 0.032));
      for (i = 0; i < b.cols; i++) for (j = 0; j < b.rows; j++) {
        if (rng() < 0.045) b.lit.push([i, j]);
      }
      if (w > 0.11 && rng() < 0.22) b.tower = true;
      else if (rng() < 0.30) { b.antenna = true; b.ax = x + w * (0.25 + rng() * 0.5); }
      frontBand.push(b);
      x += w + 0.008 + rng() * 0.022;
    }

    // exactly five refuges, spread across the block
    for (i = 0; i < 5; i++) {
      var slotX = (i + 0.5) * (BW / 5) + (rng() - 0.5) * 0.15;
      var kind = (i % 2 === 0) ? 'roof' : 'alley';
      var rx, ry;
      if (kind === 'roof') {
        // nearest front building: nestle at its roof edge
        var best = null, bd = 1e9;
        for (j = 0; j < frontBand.length; j++) {
          var c = frontBand[j].x + frontBand[j].w / 2;
          var d = Math.abs(c - slotX);
          if (d < bd) { bd = d; best = frontBand[j]; }
        }
        rx = best.x + best.w * (0.3 + rng() * 0.4);
        ry = best.top - 0.004;
      } else {
        // nearest gap between front buildings: down in the alley
        var bg = null, gd = 1e9;
        for (j = 0; j + 1 < frontBand.length; j++) {
          var g0 = frontBand[j].x + frontBand[j].w, g1 = frontBand[j + 1].x;
          var gc = (g0 + g1) / 2;
          var dd = Math.abs(gc - slotX);
          if (dd < gd) { gd = dd; bg = gc; }
        }
        rx = (bg === null) ? slotX : bg;
        ry = 0.78 + rng() * 0.07;
      }
      refuges.push({ x: mod(rx, BW), y: ry, kind: kind, phase: rng() * 6.283, flareStart: -10 });
    }

    // visiting order: seeded shuffle of the five refuges
    order = [0, 1, 2, 3, 4];
    for (i = order.length - 1; i > 0; i--) {
      j = Math.floor(rng() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    itinRng = mulberry32(SEED + 555 + gen * 104729);
  }

  // ---------- bird itinerary (state machine on the anchored clock) ----------
  var birdMode = 'hover';       // 'hover' | 'fly'
  var segStart = 0, segDur = 4;
  var curRef = 0, orderPos = 0, flightTarget = 0;
  var flyFrom = { x: 0, y: 0 }, flyTo = { x: 0, y: 0 }, flyC1 = { x: 0, y: 0 }, flyC2 = { x: 0, y: 0 };
  var facing = 1;

  function nextHoverDur() { return 3 + itinRng() * 2; }   // 3-5 s hovers

  function hoverPoint(idx) {
    var r = refuges[idx];
    return { x: r.x - 0.018, y: r.y - 0.038 };
  }
  function wobble(t) {
    return { x: Math.sin(t * 2.1) * 0.0035, y: Math.cos(t * 2.7) * 0.003 };
  }
  function birdPosAt(t) {
    if (birdMode === 'hover') {
      var hp = hoverPoint(curRef), w = wobble(t);
      // occasional dart toward the flower core, pulsing within the hover
      var ph = (t - segStart) / segDur;
      var dart = Math.pow(Math.max(0, Math.sin(ph * 12.566)), 8) * 0.012;
      return { x: hp.x + w.x + dart, y: hp.y + w.y + dart * 0.7 };
    }
    var u = easeIO((t - segStart) / segDur);
    var v = 1 - u;
    var px = v * v * v * flyFrom.x + 3 * v * v * u * flyC1.x + 3 * v * u * u * flyC2.x + u * u * u * flyTo.x;
    var py = v * v * v * flyFrom.y + 3 * v * v * u * flyC1.y + 3 * v * u * u * flyC2.y + u * u * u * flyTo.y;
    py += Math.sin(u * 9.42) * 0.004;
    return { x: px, y: py };
  }
  function unwrapNear(x, refX) {
    // choose the copy of x closest to refX so flights never take the long way
    var d = mod(x - refX, BW);
    if (d > BW / 2) d -= BW;
    return refX + d;
  }
  function startFlight(fromPos, targetIdx, t) {
    var hp = hoverPoint(targetIdx);
    var tx = unwrapNear(hp.x, fromPos.x), ty = hp.y;
    var dist = Math.abs(tx - fromPos.x) + Math.abs(ty - fromPos.y) * 0.6;
    var lift = Math.max(0.09, dist * 0.35);
    flyFrom = { x: fromPos.x, y: fromPos.y };
    flyTo = { x: tx, y: ty };
    flyC1 = { x: fromPos.x + (tx - fromPos.x) * 0.3, y: Math.min(fromPos.y, ty) - lift };
    flyC2 = { x: fromPos.x + (tx - fromPos.x) * 0.7, y: Math.min(fromPos.y, ty) - lift * 0.8 };
    flightTarget = targetIdx;
    facing = (tx >= fromPos.x) ? 1 : -1;
    birdMode = 'fly';
    segStart = t;
    segDur = Math.min(2.8, Math.max(0.6, 0.9 + dist * 1.1));
  }
  function syncBird(t) {
    var guard = 0;
    while (t >= segStart + segDur && guard++ < 60) {
      var endT = segStart + segDur;
      if (birdMode === 'hover') {
        orderPos = (orderPos + 1) % order.length;
        startFlight(birdPosAt(endT), order[orderPos], endT);
      } else {
        curRef = flightTarget;
        birdMode = 'hover';
        segStart = endT;
        segDur = nextHoverDur();
      }
    }
  }
  function resetBird(t) {
    orderPos = 0;
    curRef = order[0];
    birdMode = 'hover';
    segStart = t;
    segDur = nextHoverDur();
    facing = 1;
  }

  // ---------- interaction ----------
  var panX = 0;
  var pDown = null;       // {x, y, t, moved}
  var lastTap = null;     // {t}
  var pendingTap = null;  // {x, y, at}

  function refugeScreenPos(r) {
    // visible copy of a refuge for the current pan
    var best = null, bd = 1e9;
    for (var s = -BW; s <= BW; s += BW) {
      var sx = (r.x + s - panX) * W;
      if (sx > -80 && sx < W + 80) {
        var d = Math.abs(sx - W / 2);
        if (d < bd) { bd = d; best = { x: sx, y: r.y * H }; }
      }
    }
    return best;
  }
  function doTap(px, py, t) {
    var thr = Math.min(W, H) * 0.11;
    var hit = -1, hd = 1e9;
    for (var i = 0; i < refuges.length; i++) {
      var sp = refugeScreenPos(refuges[i]);
      if (!sp) continue;
      var d = Math.hypot(sp.x - px, sp.y - py);
      if (d < hd) { hd = d; hit = i; }
    }
    if (hit >= 0 && hd <= thr) {
      refuges[hit].flareStart = t;
      if (!(birdMode === 'hover' && curRef === hit)) {
        orderPos = order.indexOf(hit);
        startFlight(birdPosAt(t), hit, t);
      }
    }
  }
  function reseed(t) {
    generation++;
    genCity(generation);
    resetBird(t);
  }
  canvas.addEventListener('pointerdown', function (e) {
    pDown = { x: e.clientX, y: e.clientY, t: elapsedNow, moved: false };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pDown) return;
    var dx = e.clientX - pDown.x, dy = e.clientY - pDown.y;
    if (Math.hypot(dx, dy) > 8) pDown.moved = true;
    if (pDown.moved) {
      var lx = (pDown.lastX === undefined) ? pDown.x : pDown.lastX;
      panX = mod(panX - (e.clientX - lx) / W, BW);
    }
    pDown.lastX = e.clientX; pDown.lastY = e.clientY;
  });
  function onUp(e) {
    if (!pDown) return;
    var wasDrag = pDown.moved;
    var dur = elapsedNow - pDown.t;
    var ux = e.clientX, uy = e.clientY;
    pDown = null;
    if (wasDrag || dur > 0.6) return;
    // quick tap: check for double-tap first
    if (lastTap && (elapsedNow - lastTap.t) < 0.36) {
      lastTap = null; pendingTap = null;
      reseed(elapsedNow);
      return;
    }
    lastTap = { t: elapsedNow };
    pendingTap = { x: ux, y: uy, at: elapsedNow };
  }
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { pDown = null; });

  // ---------- drawing ----------
  function drawBuilding(b, shift, back) {
    var x0 = (b.x + shift - panX) * W;
    if (x0 > W + 4 || x0 + b.w * W < -4) return;
    var y0 = b.top * H;
    ctx.fillStyle = back ? rgba(CITY, 0.5) : CITY;
    ctx.fillRect(x0, y0, b.w * W, H - y0);
    if (!back) {
      ctx.fillStyle = ROOF;
      ctx.fillRect(x0, y0, b.w * W, Math.max(2, H * 0.012));   // roof line
    }
    // lit windows
    var cw = (b.w * W) / b.cols, ch = (H - y0) / b.rows;
    ctx.fillStyle = rgba(AMBER, back ? 0.45 : 0.9);
    for (var i = 0; i < b.lit.length; i++) {
      var cx = x0 + b.lit[i][0] * cw + cw * 0.28;
      var cy = y0 + b.lit[i][1] * ch + ch * 0.3;
      ctx.fillRect(cx, cy, Math.max(1.5, cw * 0.42), Math.max(1.5, ch * 0.38));
    }
    if (back) return;
    if (b.tower) {
      var tcx = x0 + b.w * W * 0.5, tw = Math.min(W * 0.032, b.w * W * 0.5), th = H * 0.038;
      ctx.strokeStyle = ROOF; ctx.lineWidth = Math.max(1.5, W * 0.0022);
      ctx.beginPath();
      ctx.moveTo(tcx - tw * 0.36, y0); ctx.lineTo(tcx - tw * 0.22, y0 - th);
      ctx.moveTo(tcx + tw * 0.36, y0); ctx.lineTo(tcx + tw * 0.22, y0 - th);
      ctx.stroke();
      ctx.fillStyle = CITY;
      ctx.fillRect(tcx - tw / 2, y0 - th - H * 0.034, tw, H * 0.034);
      ctx.strokeStyle = ROOF; ctx.lineWidth = Math.max(1, W * 0.0016);
      ctx.strokeRect(tcx - tw / 2, y0 - th - H * 0.034, tw, H * 0.034);
      ctx.fillStyle = ROOF;
      ctx.beginPath();   // cone roof
      ctx.moveTo(tcx - tw * 0.68, y0 - th - H * 0.034);
      ctx.lineTo(tcx + tw * 0.68, y0 - th - H * 0.034);
      ctx.lineTo(tcx, y0 - th - H * 0.034 - H * 0.026);
      ctx.closePath(); ctx.fill();
    }
    if (b.antenna) {
      var axp = (b.ax + shift - panX) * W;
      ctx.strokeStyle = CITY; ctx.lineWidth = Math.max(1, W * 0.0016);
      ctx.beginPath(); ctx.moveTo(axp, y0); ctx.lineTo(axp, y0 - H * 0.045); ctx.stroke();
      ctx.fillStyle = rgba(AMBER, 0.85);
      ctx.beginPath(); ctx.arc(axp, y0 - H * 0.048, Math.max(1.2, W * 0.002), 0, 6.2832); ctx.fill();
    }
  }

  function drawRefuge(r, shift, t) {
    var sx = (r.x + shift - panX) * W;
    if (sx < -90 || sx > W + 90) return;
    var sy = r.y * H;
    var md = Math.min(W, H);
    var fe = Math.max(0, 1 - (t - r.flareStart) / 2);       // flare envelope, ~2 s
    var breathe = 1 + 0.06 * Math.sin(t * 0.9 + r.phase);
    var R = md * 0.062 * breathe * (1 + 0.85 * fe);
    var boost = 1 + 0.9 * fe;
    ctx.fillStyle = rgba(GLOW, 0.10 * boost);
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, 6.2832); ctx.fill();
    ctx.fillStyle = rgba(GLOW, 0.15 * boost);
    ctx.beginPath(); ctx.arc(sx, sy, R * 0.62, 0, 6.2832); ctx.fill();
    ctx.fillStyle = rgba(GLOW, 0.26 * boost);
    ctx.beginPath(); ctx.arc(sx, sy, R * 0.34, 0, 6.2832); ctx.fill();
    // flower cluster at the core: five petals around a pale heart
    var pr = md * 0.0062;
    ctx.fillStyle = rgba(GLOW, 0.95);
    for (var i = 0; i < 5; i++) {
      var a = r.phase + i * 1.2566;
      ctx.beginPath();
      ctx.arc(sx + Math.cos(a) * pr * 1.5, sy + Math.sin(a) * pr * 1.5, pr, 0, 6.2832);
      ctx.fill();
    }
    ctx.fillStyle = rgba(WING, 0.95);
    ctx.beginPath(); ctx.arc(sx, sy, pr * 0.62, 0, 6.2832); ctx.fill();
  }

  function drawBird(t) {
    var p = birdPosAt(t);
    var md = Math.min(W, H);
    // toroidal relative position: visible only in the window's unit of the block
    var rel = mod(p.x - panX, BW);
    var sx;
    if (rel <= 1.06) sx = rel * W;
    else if (rel >= BW - 0.06) sx = (rel - BW) * W;
    else return;   // bird is in the hidden half of the block right now
    var sy = p.y * H;
    var L = md * 0.030;   // body length scale
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(facing, 1);
    // wings: figure-eight blur, two translucent ellipses beating in anti-phase
    var wa = Math.sin(t * 46) * 0.85;
    ctx.fillStyle = rgba(WING, 0.30);
    ctx.save();
    ctx.translate(-L * 0.05, -L * 0.18);
    ctx.rotate(-0.45 - wa);
    ctx.beginPath(); ctx.ellipse(0, -L * 0.34, L * 0.15, L * 0.42, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(-L * 0.05, -L * 0.18);
    ctx.rotate(-0.45 + wa);
    ctx.beginPath(); ctx.ellipse(0, -L * 0.34, L * 0.15, L * 0.42, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
    // tail fan
    ctx.fillStyle = rgba(BIRD, 0.8);
    ctx.beginPath();
    ctx.moveTo(-L * 0.4, 0);
    ctx.lineTo(-L * 1.05, -L * 0.30);
    ctx.lineTo(-L * 1.05, L * 0.30);
    ctx.closePath(); ctx.fill();
    // body
    ctx.fillStyle = BIRD;
    ctx.beginPath(); ctx.ellipse(0, 0, L * 0.55, L * 0.29, 0, 0, 6.2832); ctx.fill();
    // head + needle beak
    ctx.beginPath(); ctx.arc(L * 0.52, -L * 0.10, L * 0.21, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = BIRD; ctx.lineWidth = Math.max(1, L * 0.07);
    ctx.beginPath(); ctx.moveTo(L * 0.66, -L * 0.06); ctx.lineTo(L * 1.3, L * 0.05); ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    if (pendingTap && t > pendingTap.at + 0.36) {
      var pt = pendingTap; pendingTap = null;
      doTap(pt.x, pt.y, t);
    }
    syncBird(t);

    ctx.fillStyle = ROOF;
    ctx.fillRect(0, 0, W, H);

    var shifts = [-BW, 0, BW], s, i;
    for (s = 0; s < 3; s++) for (i = 0; i < backBand.length; i++) drawBuilding(backBand[i], shifts[s], true);
    for (s = 0; s < 3; s++) for (i = 0; i < frontBand.length; i++) drawBuilding(frontBand[i], shifts[s], false);
    for (s = 0; s < 3; s++) for (i = 0; i < refuges.length; i++) drawRefuge(refuges[i], shifts[s], t);
    drawBird(t);
  }

  // ---------- run ----------
  genCity(0);
  resetBird(0);
  fit();
  draw(0);
  var startTs = null;
  function frame(ts) {
    if (startTs === null) startTs = ts;
    elapsedNow = (ts - startTs) / 1000;
    draw(elapsedNow);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
