<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№638 The Bread Session</title>
<style>
  html, body { margin: 0; padding: 0; background: #b5b1a8; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1979 The Bread Session, CR4 / PP1226, study #258 ciara-reddy.
  // A bare room, concrete floor, a white radiator. A figure
  // crouches in profile wearing headphones, listening intently
  // to an absurd object on the floor: a loaf of bread with a
  // cable coming out of it, wired into the headphones. The
  // camera treats it like a product shot: straight, centered,
  // no wink. Tap to re-stage: the object swaps to a new absurd
  // pair (a shoe with a telephone cord, a melon with a guitar
  // lead), and the figure re-poses around it. The tap is the
  // art department re-dressing the set, never a reload.
  var WALL = '#b5b1a8';   // gray concrete wall, also the page ground
  var FLOOR = '#8d897f';  // concrete floor
  var FLOORD = '#7d796f'; // floor shadow tone
  var RAD = '#f2f0ec';    // white radiator
  var RADD = '#cfccc5';   // radiator shading
  var BREAD = '#a9713f';  // warm brown loaf
  var CRUST = '#7c4f27';  // loaf crust
  var SHOE = '#4a3428';   // shoe leather
  var SOLE = '#2a1e16';   // shoe sole
  var MELON = '#5d8a4a';  // melon green
  var MELOND = '#42632f'; // melon stripe
  var CABLE = '#1a1a1a';  // black cable
  var INK = '#2e2c28';    // caption and hint ink, dark on the light ground
  var CLOTH = '#333336';  // figure sweater
  var TROUS = '#2b2b2e';  // figure trousers
  var SKIN = '#c9a186';   // figure skin
  var DARK = '#1f1f22';   // shoes, headphone cups

  // Fixed-phase first frame: FIRST_T = 3 s. The idle cycle is
  // 12 s: a slow listening nod (6 s) and a breath (12 s), plus
  // a cable sway (4 s). At t = 3 the nod is at rest and the
  // breath is near its peak, so frame one shows the figure
  // settled into the listen, deadpan, fully committed.
  var FIRST_T = 3;
  var CYCLE = 12;
  var SEED = 1979;
  var TRANS_DUR = 0.8; // seconds for the re-pose after a tap

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // ?stage=<0|1|2> picks the staged object at load (bread,
  // shoe, melon), so a probe render can show each variant.
  // Read at load only.
  var probeT = null;
  var probeStage = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
    var mg = qs.match(/[?&]stage=([0-2])/);
    if (mg) { probeStage = parseInt(mg[1], 10); }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // The catalog of absurd pairs, in tap order: bread, shoe,
  // melon, then back to bread. Each entry re-poses the figure:
  // crouch height, lean, and head tilt.
  var POSES = [
    { crouch: 0.60, lean: 0.32, tilt: 0.10, label: 'bread' },
    { crouch: 0.90, lean: 0.48, tilt: 0.20, label: 'shoe' },
    { crouch: 0.35, lean: 0.22, tilt: 0.04, label: 'melon' }
  ];
  var stageIdx = (probeStage !== null) ? probeStage : 0;
  var trans = null; // { from: pose, start: t } while a re-pose is running

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgba(r, g, b, a) {
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.horizon = H * 0.60;
    L.objX = W * 0.56;
    L.objY = H * 0.875;
    L.floorY = H * 0.92; // where feet and object rest
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    // A centered interior scene: keep its square shape on every
    // screen. On phones the square sits centered on the page
    // ground, which is the wall color, so the room never
    // stretches and the composition stays a product shot.
    var side = Math.min(vw * 0.96, vh * 0.96, vw, vh);
    if (isPhone) {
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    } else {
      side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Current pose at virtual time t, easing through a re-pose
  // after a tap. Pure function of t and the tap history.
  function poseAt(t) {
    var to = POSES[stageIdx];
    if (!trans || t - trans.start >= TRANS_DUR) { return to; }
    var u = smooth((t - trans.start) / TRANS_DUR);
    return {
      crouch: lerp(trans.from.crouch, to.crouch, u),
      lean: lerp(trans.from.lean, to.lean, u),
      tilt: lerp(trans.from.tilt, to.tilt, u),
      label: to.label
    };
  }

  // ---- Room ------------------------------------------------------
  function drawRoom(t) {
    var i, x, y;
    var rng = mulberry32(SEED * 3 + 11);

    // Wall: flat concrete gray.
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, L.horizon);
    // Wall speckles, seeded, faint.
    for (i = 0; i < 130; i++) {
      x = rng() * W; y = rng() * L.horizon;
      var r = 0.6 + rng() * 1.6;
      ctx.fillStyle = rgba(90, 86, 78, 0.05 + rng() * 0.07);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    // Floor: darker concrete.
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, L.horizon, W, H - L.horizon);
    // Floor stains, large and faint.
    for (i = 0; i < 4; i++) {
      x = rng() * W; y = L.horizon + rng() * (H - L.horizon);
      var rx = W * (0.07 + rng() * 0.08), ry = H * (0.014 + rng() * 0.02);
      ctx.fillStyle = rgba(70, 66, 60, 0.04);
      ctx.beginPath();
      ctx.moveTo(x + rx, y);
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // Floor speckles.
    for (i = 0; i < 90; i++) {
      x = rng() * W; y = L.horizon + rng() * (H - L.horizon);
      var fr = 0.6 + rng() * 1.5;
      ctx.fillStyle = rgba(60, 56, 50, 0.05 + rng() * 0.07);
      ctx.beginPath();
      ctx.moveTo(x + fr, y);
      ctx.arc(x, y, fr, 0, Math.PI * 2);
      ctx.fill();
    }
    // Skirting board along the wall/floor junction.
    ctx.fillStyle = FLOORD;
    ctx.fillRect(0, L.horizon - H * 0.006, W, H * 0.012);
  }

  // ---- Radiator --------------------------------------------------
  // White panel on the back wall, right side, drawn straight
  // like a product shot: no tilt, no joke.
  function drawRadiator() {
    var x0 = W * 0.70, x1 = W * 0.93;
    var y0 = H * 0.16, y1 = H * 0.50;
    var i;
    ctx.fillStyle = RAD;
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    // Vertical ribs.
    ctx.strokeStyle = RADD;
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.beginPath();
    for (i = 1; i < 9; i++) {
      var rx = x0 + (x1 - x0) * i / 9;
      ctx.moveTo(rx, y0 + H * 0.01);
      ctx.lineTo(rx, y1 - H * 0.01);
    }
    ctx.stroke();
    // Top rail and bottom rail.
    ctx.fillStyle = RADD;
    ctx.fillRect(x0, y0, x1 - x0, H * 0.008);
    ctx.fillRect(x0, y1 - H * 0.008, x1 - x0, H * 0.008);
    // Valve knob at the lower left, with a short pipe down.
    ctx.fillStyle = '#8f8b83';
    ctx.fillRect(x0 - W * 0.012, y1 - H * 0.02, W * 0.012, H * 0.02);
    ctx.beginPath();
    ctx.moveTo(x0 - W * 0.006 + W * 0.010, y1 - H * 0.02);
    ctx.arc(x0 - W * 0.006, y1 - H * 0.02, W * 0.010, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#8f8b83';
    ctx.fillRect(x0 - W * 0.004, y1, W * 0.008, L.horizon - y1);
  }

  // ---- Objects ---------------------------------------------------
  // Each absurd object sits on the floor at (L.objX, L.objY)
  // and returns its cable anchor point (where the cable leaves
  // the object). All drawn flat and straight.
  function drawBread() {
    var cx = L.objX, cy = L.objY;
    var rx = W * 0.058, ry = H * 0.030;
    // Loaf body.
    ctx.fillStyle = BREAD;
    ctx.beginPath();
    ctx.moveTo(cx + rx, cy);
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    // Crust top: a darker cap arc.
    ctx.fillStyle = CRUST;
    ctx.beginPath();
    ctx.moveTo(cx - rx * 0.92, cy - ry * 0.18);
    ctx.ellipse(cx, cy - ry * 0.18, rx * 0.92, ry * 0.62, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    // Three slashes across the crust.
    ctx.strokeStyle = '#5e3a1c';
    ctx.lineWidth = Math.max(1.5, W * 0.003);
    ctx.beginPath();
    var i;
    for (i = -1; i <= 1; i++) {
      var sx = cx + i * rx * 0.42;
      ctx.moveTo(sx - rx * 0.14, cy - ry * 0.62);
      ctx.lineTo(sx + rx * 0.14, cy - ry * 0.30);
    }
    ctx.stroke();
    return { x: cx + rx * 0.55, y: cy - ry * 0.55 };
  }

  function drawShoe() {
    var cx = L.objX, cy = L.objY;
    var len = W * 0.115, hgt = H * 0.048;
    // Sole.
    ctx.fillStyle = SOLE;
    ctx.fillRect(cx - len / 2, cy + hgt * 0.55, len, H * 0.012);
    // Upper: heel left, toe right, ankle collar at the back.
    ctx.fillStyle = SHOE;
    ctx.beginPath();
    ctx.moveTo(cx - len / 2, cy + hgt * 0.55);
    ctx.lineTo(cx - len / 2, cy - hgt * 0.55);
    ctx.lineTo(cx - len * 0.28, cy - hgt * 0.62);
    ctx.lineTo(cx - len * 0.18, cy - hgt * 0.10);
    ctx.lineTo(cx + len * 0.28, cy + hgt * 0.28);
    ctx.lineTo(cx + len / 2, cy + hgt * 0.42);
    ctx.lineTo(cx + len / 2, cy + hgt * 0.55);
    ctx.closePath();
    ctx.fill();
    // Laces: three short diagonal lines.
    ctx.strokeStyle = '#c9b8a3';
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.beginPath();
    var i;
    for (i = 0; i < 3; i++) {
      var lx = cx - len * 0.10 + i * len * 0.09;
      ctx.moveTo(lx, cy - hgt * 0.02);
      ctx.lineTo(lx + len * 0.05, cy + hgt * 0.14);
    }
    ctx.stroke();
    return { x: cx - len * 0.28, y: cy - hgt * 0.62 };
  }

  function drawMelon() {
    var cx = L.objX, cy = L.objY;
    var rx = W * 0.052, ry = H * 0.040;
    // Melon body.
    ctx.fillStyle = MELON;
    ctx.beginPath();
    ctx.moveTo(cx + rx, cy);
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    // Stripes: three curved bands, clipped to the ellipse by
    // drawing them as short arcs inside the body.
    ctx.strokeStyle = MELOND;
    ctx.lineWidth = Math.max(1.5, W * 0.004);
    ctx.beginPath();
    var i;
    for (i = -1; i <= 1; i++) {
      var sx = cx + i * rx * 0.45;
      ctx.moveTo(sx, cy - ry * 0.82);
      ctx.quadraticCurveTo(sx + rx * 0.18, cy, sx, cy + ry * 0.82);
    }
    ctx.stroke();
    // Stem.
    ctx.strokeStyle = MELOND;
    ctx.lineWidth = Math.max(1.5, W * 0.004);
    ctx.beginPath();
    ctx.moveTo(cx, cy - ry);
    ctx.lineTo(cx + rx * 0.10, cy - ry - H * 0.012);
    ctx.stroke();
    return { x: cx + rx * 0.30, y: cy - ry * 0.70 };
  }

  // ---- Figure ----------------------------------------------------
  // Crouching figure in profile, facing right toward the
  // object. Thick-line limbs, flat fills, face deadpan: one
  // dot eye, one straight mouth, no expression, ever.
  // Returns the ear-cup point where the cable plugs in.
  function drawFigure(pose, t) {
    var nod = 0.03 * Math.sin(2 * Math.PI * t / 6);   // slow listening nod
    var breath = 1 + 0.012 * Math.sin(2 * Math.PI * t / 12);
    var tilt = pose.tilt + nod;

    var hipX = W * 0.235;
    var hipY = H * (0.66 + 0.14 * pose.crouch);
    var shoulderX = hipX + W * (0.085 + 0.05 * pose.lean);
    var shoulderY = hipY - H * (0.17 - 0.03 * pose.crouch);
    var headR = W * 0.048;
    var headX = shoulderX + W * 0.048;
    var headY = shoulderY - H * 0.048 + tilt * H * 0.06;
    // Squat: the front knee pushes forward and drops below the
    // hip, the shin runs down to a foot under the knee.
    var kneeX = hipX + W * 0.105;
    var kneeY = hipY + H * 0.05;
    var footX = kneeX - W * 0.012;
    var footY = L.floorY;
    var backKneeX = hipX - W * 0.06;
    var backKneeY = hipY + H * 0.05;
    var backFootX = hipX - W * 0.11;
    var backFootY = L.floorY;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Back leg: hip to back knee to back foot.
    ctx.strokeStyle = TROUS;
    ctx.lineWidth = W * 0.038;
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(backKneeX, backKneeY);
    ctx.lineTo(backFootX, backFootY);
    ctx.stroke();
    // Back shoe.
    ctx.fillStyle = DARK;
    ctx.fillRect(backFootX - W * 0.012, backFootY - H * 0.010, W * 0.045, H * 0.010);

    // Back arm: shoulder down to a hand resting on the back knee.
    ctx.strokeStyle = CLOTH;
    ctx.lineWidth = W * 0.030 * breath;
    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY);
    ctx.lineTo(hipX + W * 0.01, hipY - H * 0.02);
    ctx.lineTo(backKneeX + W * 0.01, backKneeY - H * 0.01);
    ctx.stroke();

    // Torso: hip to shoulder, breathing slightly.
    ctx.strokeStyle = CLOTH;
    ctx.lineWidth = W * 0.075 * breath;
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(shoulderX, shoulderY);
    ctx.stroke();

    // Front leg: hip to knee (up, forward) to foot flat on the floor.
    ctx.strokeStyle = TROUS;
    ctx.lineWidth = W * 0.040;
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(kneeX, kneeY);
    ctx.lineTo(footX, footY);
    ctx.stroke();
    // Front shoe.
    ctx.fillStyle = DARK;
    ctx.fillRect(footX - W * 0.012, footY - H * 0.010, W * 0.048, H * 0.010);

    // Head: circle in profile, nose bump to the right.
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(headX + headR, headY);
    ctx.arc(headX, headY, headR, 0, Math.PI * 2);
    ctx.fill();
    // Nose.
    ctx.beginPath();
    ctx.moveTo(headX + headR * 0.82, headY - headR * 0.10);
    ctx.lineTo(headX + headR * 1.18, headY + headR * 0.12);
    ctx.lineTo(headX + headR * 0.80, headY + headR * 0.28);
    ctx.closePath();
    ctx.fill();
    // Eye: one dot, looking right, no expression.
    ctx.fillStyle = INK;
    ctx.beginPath();
    var ex = headX + headR * 0.38, ey = headY - headR * 0.12;
    ctx.moveTo(ex + W * 0.004, ey);
    ctx.arc(ex, ey, W * 0.004, 0, Math.PI * 2);
    ctx.fill();
    // Mouth: one straight short line.
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.beginPath();
    ctx.moveTo(headX + headR * 0.30, headY + headR * 0.48);
    ctx.lineTo(headX + headR * 0.58, headY + headR * 0.48);
    ctx.stroke();

    // Headphones: band over the head, ear cup over the ear.
    var earX = headX - W * 0.006;
    var earY = headY + headR * 0.06;
    ctx.strokeStyle = CABLE;
    ctx.lineWidth = Math.max(2, W * 0.007);
    ctx.beginPath();
    ctx.moveTo(headX - headR * 0.92, headY - headR * 0.15);
    ctx.arc(headX, headY - headR * 0.05, headR * 1.02, Math.PI * 0.72, Math.PI * 1.95);
    ctx.stroke();
    ctx.fillStyle = DARK;
    ctx.beginPath();
    ctx.moveTo(earX + W * 0.020, earY);
    ctx.arc(earX, earY, W * 0.020, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#55555a';
    ctx.beginPath();
    ctx.moveTo(earX + W * 0.011, earY);
    ctx.arc(earX, earY, W * 0.011, 0, Math.PI * 2);
    ctx.fill();

    // Near arm: shoulder down and forward, hand open near the
    // floor, listening with the whole body.
    var handX = hipX + W * 0.17;
    var handY = L.floorY - H * 0.045;
    ctx.strokeStyle = CLOTH;
    ctx.lineWidth = W * 0.030 * breath;
    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY);
    ctx.lineTo(shoulderX + W * 0.055, shoulderY + H * 0.10);
    ctx.lineTo(handX, handY);
    ctx.stroke();
    // Hand: small skin circle.
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(handX + W * 0.011, handY);
    ctx.arc(handX, handY, W * 0.011, 0, Math.PI * 2);
    ctx.fill();

    return { x: earX, y: earY + W * 0.018 };
  }

  // ---- Cable -----------------------------------------------------
  // From the object to the ear cup. Bread gets a plain black
  // cable, the shoe a coiled telephone cord, the melon a thick
  // guitar lead with a plug. A slow sway keeps the line alive.
  function drawCable(anchor, ear, t) {
    var sway = W * 0.006 * Math.sin(2 * Math.PI * t / 4);
    var mx = (anchor.x + ear.x) / 2;
    var my = Math.max(anchor.y, ear.y) + H * 0.075 + sway;
    if (stageIdx === 1) {
      // Coiled cord: a sine wave along the sagging path.
      ctx.strokeStyle = CABLE;
      ctx.lineWidth = Math.max(1.5, W * 0.004);
      ctx.beginPath();
      var i, u, bx, by, px, py, dx, dy, nx, ny;
      for (i = 0; i <= 60; i++) {
        u = i / 60;
        bx = (1 - u) * (1 - u) * anchor.x + 2 * (1 - u) * u * mx + u * u * ear.x;
        by = (1 - u) * (1 - u) * anchor.y + 2 * (1 - u) * u * my + u * u * ear.y;
        dx = 2 * (1 - u) * (mx - anchor.x) + 2 * u * (ear.x - mx);
        dy = 2 * (1 - u) * (my - anchor.y) + 2 * u * (ear.y - my);
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        nx = -dy / len; ny = dx / len;
        var off = W * 0.005 * Math.sin(u * Math.PI * 16);
        px = bx + nx * off; py = by + ny * off;
        if (i === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
      }
      ctx.stroke();
    } else {
      ctx.strokeStyle = CABLE;
      ctx.lineWidth = stageIdx === 2 ? Math.max(2.5, W * 0.011) : Math.max(2, W * 0.006);
      ctx.beginPath();
      ctx.moveTo(anchor.x, anchor.y);
      ctx.quadraticCurveTo(mx, my, ear.x, ear.y);
      ctx.stroke();
      if (stageIdx === 2) {
        // Guitar plug at the melon end.
        var ang = Math.atan2(my - anchor.y, mx - anchor.x);
        ctx.save();
        ctx.translate(anchor.x, anchor.y);
        ctx.rotate(ang);
        ctx.fillStyle = '#3a3a3d';
        ctx.fillRect(-W * 0.004, -W * 0.006, W * 0.022, W * 0.012);
        ctx.restore();
      }
    }
  }

  // ---- Draw ------------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    drawRoom(t);
    drawRadiator();

    var pose = poseAt(t);

    // Soft shadows: the figure and the object rest on the floor.
    ctx.fillStyle = rgba(40, 36, 32, 0.12);
    ctx.beginPath();
    ctx.moveTo(W * 0.30 + W * 0.11, L.floorY);
    ctx.ellipse(W * 0.30, L.floorY, W * 0.11, H * 0.012, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(L.objX + W * 0.065, L.floorY);
    ctx.ellipse(L.objX, L.floorY, W * 0.065, H * 0.009, 0, 0, Math.PI * 2);
    ctx.fill();

    var anchor;
    if (stageIdx === 0) { anchor = drawBread(); }
    else if (stageIdx === 1) { anchor = drawShoe(); }
    else { anchor = drawMelon(); }

    var ear = drawFigure(pose, t);
    drawCable(anchor, ear, t);

    // Caption, top left; date, bottom left; hint, bottom center.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№638 · The Bread Session', W * 0.04, H * 0.055);
    ctx.font = L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2007 · 06 · 13', W * 0.04, H - L.fsHint * 1.1);
    ctx.textAlign = 'center';
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Tap to re-stage the set.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Tap re-stages the set: the object swaps to the next absurd
  // pair and the figure re-poses around it. Deterministic
  // cycle: bread, shoe, melon, bread. Never a reload.
  function onTap(e) {
    var t = lastT;
    var cur = poseAt(t);
    stageIdx = (stageIdx + 1) % 3;
    trans = { from: cur, start: t };
    draw(t);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onTap);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1979 exposes the stage, the pose, and the tap.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1979 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      stage: function () { return stageIdx; },
      label: function () { return POSES[stageIdx].label; },
      pose: function (t) { return poseAt(t); },
      tap: function (t) {
        var tt = (typeof t === 'number') ? t : lastT;
        var cur = poseAt(tt);
        stageIdx = (stageIdx + 1) % 3;
        trans = { from: cur, start: tt };
        draw(tt);
      },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: a slow listening nod and breath on a 12 s
  // cycle. Guarded so node-canvas QA (no requestAnimationFrame)
  // works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
