<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.355 Owl and Oak Damask</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1B2E45; }
  canvas { display:block; touch-action:none; cursor:grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.355 Owl and Oak Damask (betterloveart).
// After Suchita Prakash's "Midnight owl and oak leaves folk
// damask": a strict mirrored ogee lattice on midnight navy
// whose cells alternate two heraldic folk motifs, an owl
// with spread wings and an oak spray with acorns under a
// crescent moon. The lattice breathes at plus/minus 2
// percent on a 20s seamless loop; the owl eyes blink in one
// fixed sequence inside the same 20s, so frame 20s is
// pixel-identical to frame 0. Drag pans the oversized
// lattice; the explored position persists on release.
// Nothing here is runtime random: the lattice, the motif
// alternation and the blink order are all fixed data below.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#1B2E45', OCHRE = '#C9A26B', OLIVE = '#5F7335', BROWN = '#A67B4A';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 20;
if (LOOP !== 20) throw new Error('Owl and Oak loop must be 20s');
var TICK = 1 / 60;

// ---- world: lattice authored oversized, centred on 0,0 ----
var WW = 1900, WH = 1300; // world width / height

// ---- ogee lattice grid --------------------------------------
// Half-drop repeat: rows at y = 185*m, odd rows offset by
// 85 (DX/2). The offset depends on |m| only, so row -m
// mirrors row m exactly. A cell's motif is decided by
// (floor(|x| / DX) + |m|) mod 2, a function of |x| and |m|
// alone, so the alternation is closed under both mirrors
// (asserted below): the whole field is strictly
// mirror-symmetric on both axes by construction.
var DX = 170, DY = 185;
function rowOff(m) { return (Math.abs(m) % 2 === 1) ? 85 : 0; }
var CELLS = [];
for (var rm = -3; rm <= 3; rm++) {
  var off = rowOff(rm);
  for (var rk = -6; rk <= 6; rk++) {
    var cx = rk * DX + off;
    if (Math.abs(cx) > 940) continue;
    var u = Math.floor(Math.abs(cx) / DX);
    var type = ((u + Math.abs(rm)) % 2 === 0) ? 'owl' : 'oak';
    CELLS.push([cx, rm * DY, type]);
  }
}
var OWLS = [];
(function () {
  var map = {};
  for (var i = 0; i < CELLS.length; i++) map[CELLS[i][0] + ',' + CELLS[i][1]] = CELLS[i][2];
  for (var j = 0; j < CELLS.length; j++) {
    var c = CELLS[j];
    var mirrors = [[-c[0], c[1]], [c[0], -c[1]], [-c[0], -c[1]]];
    for (var q = 0; q < 3; q++) {
      if (map[mirrors[q][0] + ',' + mirrors[q][1]] !== c[2]) {
        throw new Error('damask not mirror-symmetric at cell ' + j);
      }
    }
    if (c[2] === 'owl') OWLS.push(j);
  }
  if (OWLS.length === 0) throw new Error('no owls in the damask');
})();
// Blink sequence: the owls blink one after another in
// their fixed cell order, one slot each, the slots tiling
// the 20s loop exactly. The owl in slot s starts its blink
// at s * (LOOP / owl count) and closes for 0.5s on a sine
// dip, so the sequence closes with the loop.
var BLINK_LEN = 0.5;
var SLOT_OF = {};
for (var si = 0; si < OWLS.length; si++) SLOT_OF[OWLS[si]] = si;
// Constant first-frame phase: the middle owl's slot plus
// half a blink, about 9.99s into the loop, so frame one is
// a developed breath (scale crossing 1.0) with exactly one
// owl mid-blink. Frame one is drawn synchronously at this
// constant; the rAF loop advances T from the same anchor
// in fixed ticks. Frame one never reads a wall clock.
var T = Math.floor(OWLS.length / 2) * (LOOP / OWLS.length) + BLINK_LEN / 2;
var lastNow = -1, acc = 0;

// ---- drawing: the ogee cell ---------------------------------
// One hand-authored ogee outline, symmetric on both axes
// by construction; the same routine stamps every cell.
function ogeePath(cx, cy) {
  var hw = 75, hh = 100;
  ctx.beginPath();
  ctx.moveTo(cx, cy - hh);
  ctx.bezierCurveTo(cx + 26, cy - 96, cx + 52, cy - 78, cx + 63, cy - 44);
  ctx.bezierCurveTo(cx + 72, cy - 16, cx + 70, cy + 14, cx + 58, cy + 42);
  ctx.bezierCurveTo(cx + 46, cy + 70, cx + 24, cy + 90, cx, cy + hh);
  ctx.bezierCurveTo(cx - 24, cy + 90, cx - 46, cy + 70, cx - 58, cy + 42);
  ctx.bezierCurveTo(cx - 70, cy + 14, cx - 72, cy - 16, cx - 63, cy - 44);
  ctx.bezierCurveTo(cx - 52, cy - 78, cx - 26, cy - 96, cx, cy - hh);
  ctx.closePath();
  ctx.stroke();
}
function nodeDiamond(x, y) {
  ctx.beginPath();
  ctx.moveTo(x, y - 7);
  ctx.lineTo(x + 5.5, y);
  ctx.lineTo(x, y + 7);
  ctx.lineTo(x - 5.5, y);
  ctx.closePath();
  ctx.stroke();
}

// ---- drawing: the owl ---------------------------------------
// Heraldic owl, authored bilaterally symmetric about its
// local vertical axis: spread wings, tail fan, round head
// with ear tufts, ringed eyes, small beak, belly scallops,
// perched on an oak branch. Flat fills in ochre with the
// navy ground as the incised detail colour.
function owlEye(ex, ey, open) {
  var r = 6.8;
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(ex, ey, 9.8, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = GROUND;
  ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2); ctx.fill();
  if (open < 0.995) {
    // eyelid: the face colour descends over the eye disc,
    // clipped to the disc, with a lash arc along its edge
    var lidY = ey - r + 2 * r * (1 - open);
    ctx.save();
    ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = OCHRE;
    ctx.fillRect(ex - r - 1, ey - r - 1, 2 * r + 2, lidY - (ey - r - 1));
    ctx.restore();
    var dy = lidY - ey;
    var rx = Math.sqrt(Math.max(0, r * r - dy * dy));
    if (rx > 0.5) {
      ctx.strokeStyle = GROUND;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(ex - rx, lidY);
      ctx.quadraticCurveTo(ex, lidY + 2.2, ex + rx, lidY);
      ctx.stroke();
    }
  }
}
function drawOwl(cx, cy, open) {
  ctx.save();
  ctx.translate(cx, cy);
  // perch branch, behind everything
  ctx.strokeStyle = BROWN;
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-42, 56);
  ctx.quadraticCurveTo(0, 68, 42, 56);
  ctx.stroke();
  ctx.fillStyle = OLIVE;
  leafPath(-34, 60, 15, 9, 0.7);
  leafPath(34, 60, 15, 9, -0.7);
  // tail fan
  ctx.fillStyle = OCHRE;
  ctx.beginPath();
  ctx.moveTo(-13, 28);
  ctx.lineTo(13, 28);
  ctx.lineTo(19, 52);
  ctx.quadraticCurveTo(0, 59, -19, 52);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-5, 33); ctx.lineTo(-8, 51);
  ctx.moveTo(0, 34); ctx.lineTo(0, 53);
  ctx.moveTo(5, 33); ctx.lineTo(8, 51);
  ctx.stroke();
  // spread wings
  for (var s = -1; s <= 1; s += 2) {
    ctx.fillStyle = OCHRE;
    ctx.beginPath();
    ctx.moveTo(s * 13, -6);
    ctx.bezierCurveTo(s * 30, -22, s * 46, -34, s * 62, -40);
    ctx.bezierCurveTo(s * 56, -16, s * 52, 2, s * 47, 20);
    ctx.quadraticCurveTo(s * 34, 23, s * 27, 8);
    ctx.quadraticCurveTo(s * 20, 19, s * 13, 5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = GROUND;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(s * 21, -3);
    ctx.quadraticCurveTo(s * 34, -9, s * 44, -25);
    ctx.moveTo(s * 19, 8);
    ctx.quadraticCurveTo(s * 30, 2, s * 38, -11);
    ctx.stroke();
  }
  // body
  ctx.fillStyle = OCHRE;
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.bezierCurveTo(16, -14, 21, 2, 20, 16);
  ctx.bezierCurveTo(19, 30, 12, 40, 0, 40);
  ctx.bezierCurveTo(-12, 40, -19, 30, -20, 16);
  ctx.bezierCurveTo(-21, 2, -16, -14, 0, -14);
  ctx.closePath();
  ctx.fill();
  // ear tufts and head
  ctx.beginPath();
  ctx.moveTo(-15, -38); ctx.lineTo(-20, -53); ctx.lineTo(-5, -43);
  ctx.closePath();
  ctx.moveTo(15, -38); ctx.lineTo(20, -53); ctx.lineTo(5, -43);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath(); ctx.arc(0, -26, 20, 0, Math.PI * 2); ctx.fill();
  // belly scallops
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = 1.6;
  var rows = [[16, [-9, 0, 9]], [25, [-4.5, 4.5]]];
  for (var ri = 0; ri < rows.length; ri++) {
    for (var ci = 0; ci < rows[ri][1].length; ci++) {
      ctx.beginPath();
      ctx.arc(rows[ri][1][ci], rows[ri][0], 4.2, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
    }
  }
  // eyes (blink via eyelid arcs) and beak
  owlEye(-9.5, -26, open);
  owlEye(9.5, -26, open);
  ctx.fillStyle = GROUND;
  ctx.beginPath();
  ctx.moveTo(-3.5, -19); ctx.lineTo(3.5, -19); ctx.lineTo(0, -13.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function openness(cellIdx, tm) {
  var slot = SLOT_OF[cellIdx];
  if (slot === undefined) return 1;
  var local = tm - slot * (LOOP / OWLS.length);
  if (local < 0 || local >= BLINK_LEN) return 1;
  var u = local / BLINK_LEN;
  return 1 - 0.88 * Math.pow(Math.sin(Math.PI * u), 1.5);
}

// ---- drawing: the oak spray ---------------------------------
// Lobed oak leaf along +x, lobes as paired quadratic bumps,
// symmetric about its own axis; pairs are replayed under a
// scale flip so each spray is bilaterally symmetric.
function leafPath(x, y, len, wid, ang) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  var L = len, W = wid;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(L * 0.18, -W * 0.52, L * 0.34, -W * 0.30);
  ctx.quadraticCurveTo(L * 0.42, -W * 0.58, L * 0.55, -W * 0.34);
  ctx.quadraticCurveTo(L * 0.66, -W * 0.55, L * 0.78, -W * 0.26);
  ctx.quadraticCurveTo(L * 0.92, -W * 0.30, L, 0);
  ctx.quadraticCurveTo(L * 0.92, W * 0.30, L * 0.78, W * 0.26);
  ctx.quadraticCurveTo(L * 0.66, W * 0.55, L * 0.55, W * 0.34);
  ctx.quadraticCurveTo(L * 0.42, W * 0.58, L * 0.34, W * 0.30);
  ctx.quadraticCurveTo(L * 0.18, W * 0.52, 0, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function crescent(cx, cy, r) {
  var dx = r * 0.42;
  var ri = Math.sqrt(dx * dx + r * r);
  ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI * 0.5, Math.PI * 1.5, false);
  ctx.arc(cx + dx, cy, ri, Math.atan2(-r, -dx), Math.atan2(r, -dx), true);
  ctx.closePath();
  ctx.fill();
}
function acorn(x, y) {
  ctx.strokeStyle = OLIVE;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y - 8);
  ctx.lineTo(x, y - 2);
  ctx.stroke();
  ctx.fillStyle = OCHRE;
  ctx.beginPath();
  ctx.arc(x, y, 6.5, 0, Math.PI, false);
  ctx.quadraticCurveTo(x - 4, y + 8, x, y + 11);
  ctx.quadraticCurveTo(x + 4, y + 8, x + 6.5, y);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = BROWN;
  ctx.beginPath();
  ctx.arc(x, y, 7, Math.PI, 0, false);
  ctx.closePath();
  ctx.fill();
}
function drawOak(cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);
  // crescent moon above
  ctx.fillStyle = OCHRE;
  crescent(0, -56, 12.5);
  // two sparkle diamonds flanking the moon
  for (var s = -1; s <= 1; s += 2) {
    ctx.beginPath();
    ctx.moveTo(s * 46, -40);
    ctx.lineTo(s * 50, -34);
    ctx.lineTo(s * 46, -28);
    ctx.lineTo(s * 42, -34);
    ctx.closePath();
    ctx.fill();
  }
  // stem
  ctx.strokeStyle = OLIVE;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 46);
  ctx.bezierCurveTo(-3, 20, 3, 0, 0, -28);
  ctx.stroke();
  // leaf pairs, replayed under a scale flip
  ctx.fillStyle = OLIVE;
  var tiers = [[22, 34], [2, 30], [-16, 25]];
  for (var ti = 0; ti < tiers.length; ti++) {
    for (var sd = -1; sd <= 1; sd += 2) {
      ctx.save();
      ctx.translate(0, tiers[ti][0]);
      ctx.scale(sd, 1);
      ctx.rotate(-0.62);
      leafPath(0, 0, tiers[ti][1], tiers[ti][1] * 0.42, 0);
      ctx.restore();
    }
  }
  // one upright leaf at the stem tip
  leafPath(0, -28, 22, 9.5, -Math.PI / 2);
  // acorn pair
  ctx.strokeStyle = OLIVE;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 32);
  ctx.quadraticCurveTo(-9, 34, -16, 38);
  ctx.moveTo(0, 32);
  ctx.quadraticCurveTo(9, 34, 16, 38);
  ctx.stroke();
  acorn(-17, 42);
  acorn(17, 42);
  ctx.restore();
}

// ---- view: drag pan state ------------------------------------
// Drag pans grab-style; the lattice is authored across a
// 1900x1300 world so it always covers the frame, the pan
// clamps against the breath-minimum scale, and the explored
// position persists on release. No snap home, no reload.
var panX = 0, panY = 0;
function breath(tm) { return 1 + 0.02 * Math.sin(2 * Math.PI * tm / LOOP); }
function clampPan() {
  var bMin = 0.98; // breath minimum, so the frame is covered at every phase
  var mx = Math.max(0, WW / 2 - (DW / 2) / bMin);
  var my = Math.max(0, WH / 2 - (DH / 2) / bMin);
  if (panX > mx) panX = mx; if (panX < -mx) panX = -mx;
  if (panY > my) panY = my; if (panY < -my) panY = -my;
}

function draw() {
  var tm = T % LOOP;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var b = breath(tm);
  ctx.save();
  ctx.translate(DW / 2, DH / 2);
  ctx.scale(b, b);
  ctx.translate(-panX, -panY);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  // node diamonds at the lattice joints (the 85 x 92.5 point
  // set with odd coordinate parity mirrors onto itself)
  ctx.strokeStyle = OLIVE;
  ctx.lineWidth = 1.6;
  for (var a = -11; a <= 11; a++) {
    for (var bb = -7; bb <= 7; bb++) {
      if (((a + bb) % 2 + 2) % 2 !== 1) continue;
      var nx = a * 85, ny = bb * 92.5;
      if (Math.abs(nx) > 940 || Math.abs(ny) > 650) continue;
      nodeDiamond(nx, ny);
    }
  }
  // ogee outlines
  ctx.strokeStyle = OLIVE;
  ctx.lineWidth = 2.4;
  for (var i = 0; i < CELLS.length; i++) ogeePath(CELLS[i][0], CELLS[i][1]);
  // motifs
  for (var j = 0; j < CELLS.length; j++) {
    var c = CELLS[j];
    if (c[2] === 'owl') drawOwl(c[0], c[1], openness(j, tm));
    else drawOak(c[0], c[1]);
  }
  ctx.restore();
}

// ---- sizing: full-bleed field, cover-fit ---------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag: pan with one pointer ------------------------------
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
var grab = null;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  grab = { x: p[0], y: p[1], panX: panX, panY: panY };
});
canvas.addEventListener('pointermove', function (e) {
  if (!grab) return;
  var p = toDesign(e);
  var b = Math.max(0.5, breath(T % LOOP));
  panX = grab.panX - (p[0] - grab.x) / b;
  panY = grab.panY - (p[1] - grab.y) / b;
  clampPan();
});
function endPointer() { grab = null; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
