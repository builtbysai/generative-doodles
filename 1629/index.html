<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotaru</title>
<style>
html, body { margin: 0; padding: 0; background: #050607; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#050607';
var SKY = '#040506';
var GLOW = '#E8F0C8';
var TRAIL = [58, 64, 48];
var SEED = 1629007;
var N_FLIES = 12;   /* asserted: about a dozen, not a swarm */
var PHASE = 1.2;     /* fixed frame-one time, seconds */
var SYNC_T = 11;     /* slow loose-synchrony wave, seconds */
var BREEZE_R = 220;  /* breeze reach, px */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function wrapPi(a) {
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  return a;
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var GLOW_RGB = hexRgb(GLOW);
var HALO_RGB = [240, 232, 196];  /* warm halo around the cool glow */
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Wide frame: the plane fills the lower two thirds. Desktop takes the
   whole viewport; on phones the wide field is a centred band, page
   ground the same near-black above and below. */
function compRect() {
  if (isPhone) {
    var h = VW * 0.78;
    return { x: 0, y: (VH - h) / 2, w: VW, h: h };
  }
  return { x: 0, y: 0, w: VW, h: VH };
}
/* ---- fireflies: seeded once per field, never re-seeded ---- */
var flies = [];
var fieldKey = '';
function buildFlies(rect) {
  var rng = mulberry32(SEED);
  var i;
  flies = [];
  for (i = 0; i < N_FLIES; i++) {
    var nx = 0.06 + 0.88 * rng();
    /* lower field: horizon sits at one third of the rect */
    var ny = 0.38 + 0.50 * rng();
    flies.push({
      nx: nx, ny: ny,
      ax1: 0.015 + 0.020 * rng(), ax2: 0.008 + 0.012 * rng(),
      ay1: 0.010 + 0.014 * rng(), ay2: 0.005 + 0.008 * rng(),
      t1: 7 + 6 * rng(), t2: 4 + 4 * rng(),
      p1: rng() * TAU, p2: rng() * TAU,
      q1: rng() * TAU, q2: rng() * TAU,
      period: 2.6 + 2.8 * rng(),       /* 2.6 to 5.4 s blink cycle */
      phase: rng() * TAU,
      cluster: i % 3,                  /* three loose-sync groups of four */
      bx: 0, by: 0,                    /* breeze displacement, decays */
      syncPull: 0                      /* phase nudge, decays, never forced */
    });
  }
}
/* Closed-form wander: a pure function of piece time, so trails and
   frame one are reproducible and the QA render matches the browser. */
function flyPos(f, rect, t) {
  var x = rect.x + f.nx * rect.w
    + f.ax1 * rect.w * Math.sin(TAU * t / f.t1 + f.p1)
    + f.ax2 * rect.w * Math.sin(TAU * t / f.t2 + f.p2)
    + f.bx;
  var y = rect.y + f.ny * rect.h
    + f.ay1 * rect.h * Math.sin(TAU * t / (f.t1 * 0.83) + f.q1)
    + f.ay2 * rect.h * Math.sin(TAU * t / (f.t2 * 0.71) + f.q2)
    + f.by;
  return { x: x, y: y };
}
function blinkArg(f, t) {
  /* per-agent blink plus a slow cluster wave: three or four flies
     drift into loose synchrony, then scatter again */
  var clusterPhase = f.cluster * 2.094;
  return TAU * t / f.period + f.phase
    + 0.5 * Math.sin(TAU * t / SYNC_T + clusterPhase)
    + f.syncPull;
}
function brightness(f, t) {
  var s = Math.sin(blinkArg(f, t));
  var b = 0.5 + 0.5 * s;
  /* blink between a dim floor and full glow, so every fly stays
     faintly visible and several read as lit at any moment */
  return 0.25 + 0.75 * b * b;
}
/* ---- breeze state: pointer velocity, decays when idle ---- */
var pointer = { x: 0, y: 0, vx: 0, vy: 0, down: false, lastX: 0, lastY: 0, lastMs: 0 };
function onDown(e) {
  pointer.down = true;
  pointer.x = e.clientX; pointer.y = e.clientY;
  pointer.lastX = e.clientX; pointer.lastY = e.clientY;
  pointer.lastMs = (typeof performance !== 'undefined') ? performance.now() : 0;
  pointer.vx = 0; pointer.vy = 0;
}
function onMove(e) {
  if (!pointer.down) return;
  var now = (typeof performance !== 'undefined') ? performance.now() : 0;
  var dt = Math.max(1, now - pointer.lastMs) / 1000;
  var vx = (e.clientX - pointer.lastX) / dt;
  var vy = (e.clientY - pointer.lastY) / dt;
  pointer.vx = 0.6 * pointer.vx + 0.4 * vx;
  pointer.vy = 0.6 * pointer.vy + 0.4 * vy;
  pointer.x = e.clientX; pointer.y = e.clientY;
  pointer.lastX = e.clientX; pointer.lastY = e.clientY;
  pointer.lastMs = now;
}
function onUp() {
  pointer.down = false;
  pointer.vx = 0; pointer.vy = 0;
}
function draw(t) {
  var dt = clamp(t - lastT, 0, 0.1);
  lastT = t;
  size();
  var rect = compRect();
  var key = Math.round(rect.w) + 'x' + Math.round(rect.h);
  if (key !== fieldKey) {
    buildFlies(rect);
    fieldKey = key;
  }
  var horizonY = rect.y + rect.h / 3;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* sky above the plane, a shade darker; horizon barely visible */
  ctx.fillStyle = SKY;
  ctx.fillRect(rect.x, rect.y, rect.w, horizonY - rect.y);
  ctx.fillStyle = rgba(GLOW_RGB, 0.10);
  ctx.fillRect(rect.x, horizonY, rect.w, 1);
  /* breeze: pointer velocity decays, flies forget the visitor */
  pointer.vx *= Math.exp(-dt / 0.15);
  pointer.vy *= Math.exp(-dt / 0.15);
  var speed = Math.sqrt(pointer.vx * pointer.vx + pointer.vy * pointer.vy);
  var i, k, f;
  if (pointer.down && speed > 20) {
    /* circular mean of the blink arguments near the pointer, so the
       breeze pulls their cycles together only while it passes */
    var sx = 0, sy = 0, nNear = 0;
    for (i = 0; i < flies.length; i++) {
      f = flies[i];
      var pos0 = flyPos(f, rect, t);
      var d0 = Math.sqrt((pos0.x - pointer.x) * (pos0.x - pointer.x) + (pos0.y - pointer.y) * (pos0.y - pointer.y));
      if (d0 < BREEZE_R) {
        var a0 = blinkArg(f, t);
        sx += Math.cos(a0); sy += Math.sin(a0); nNear++;
      }
    }
    var meanArg = nNear > 0 ? Math.atan2(sy, sx) : 0;
    for (i = 0; i < flies.length; i++) {
      f = flies[i];
      var pos = flyPos(f, rect, t);
      var d = Math.sqrt((pos.x - pointer.x) * (pos.x - pointer.x) + (pos.y - pointer.y) * (pos.y - pointer.y));
      if (d >= BREEZE_R) continue;
      var fall = 1 - d / BREEZE_R;
      f.bx += pointer.vx * fall * dt * 0.35;
      f.by += pointer.vy * fall * dt * 0.25;
      var cap = 60;
      var bl = Math.sqrt(f.bx * f.bx + f.by * f.by);
      if (bl > cap) { f.bx *= cap / bl; f.by *= cap / bl; }
      /* phase-pulling nudge toward the local mean, never a forced sync */
      f.syncPull += wrapPi(meanArg - blinkArg(f, t)) * 0.25 * fall;
    }
  }
  for (i = 0; i < flies.length; i++) {
    f = flies[i];
    /* breeze displacement and phase nudge decay on release */
    f.bx *= Math.exp(-dt / 1.4);
    f.by *= Math.exp(-dt / 1.4);
    f.syncPull *= Math.exp(-dt / 2.5);
    /* faint trail: past positions, closed-form, low alpha */
    for (k = 12; k >= 1; k--) {
      var tp = flyPos(f, rect, t - k * 0.09);
      var tb = brightness(f, t - k * 0.09);
      if (tb < 0.05) continue;
      ctx.fillStyle = rgba(TRAIL, 0.10 * (1 - k / 12) * tb);
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, 1.1, 0, TAU);
      ctx.fill();
    }
    /* glow: layered flat-alpha circles, no gradients, so the QA
       render matches the browser */
    var p = flyPos(f, rect, t);
    var b = brightness(f, t);
    if (b < 0.02) continue;
    var haloR = 11, midR = 5, coreR = 2.2;
    ctx.fillStyle = rgba(HALO_RGB, 0.08 * b);
    ctx.beginPath(); ctx.arc(p.x, p.y, haloR, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(GLOW_RGB, 0.22 * b);
    ctx.beginPath(); ctx.arc(p.x, p.y, midR, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(GLOW_RGB, 0.95 * b);
    ctx.beginPath(); ctx.arc(p.x, p.y, coreR, 0, TAU); ctx.fill();
  }
  /* Title block and hint sit on dark plates over the night plane. */
  var titlePx = isPhone ? 18 : 20;
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var titleW = ctx.measureText('Hotaru').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 06 · 28').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = cxm - plateW / 2, plateY = rect.y + 10;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.fillStyle = GLOW;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Hotaru', cxm, plateY + 8);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(GLOW_RGB, 0.75);
  ctx.fillText('2006 · 06 · 28', cxm, plateY + 8 + titlePx + 4);
  var hint = 'Drag to sweep a breeze through the fireflies.';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cxm - hintPlateW / 2;
  var hintPlateY = rect.y + rect.h - hintPlateH - 10;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.fillStyle = rgba(GLOW_RGB, 0.85);
  ctx.fillText(hint, cxm, hintPlateY + 7);
}
if (!reduced && typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('pointerleave', onUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
/* ---- frame one: fixed phase, several flies mid-blink ---- */
size();
var rect0 = compRect();
buildFlies(rect0);
fieldKey = Math.round(rect0.w) + 'x' + Math.round(rect0.h);
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
