<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carve</title>
<style>
html, body { margin: 0; padding: 0; background: #241207; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#241207';
var PLATE = '#1A0C04';
var PLATE_LINE = 'rgba(237,214,180,0.30)';
var TITLE_INK = '#F0D9A8';
var HINT_INK = 'rgba(240,217,168,0.75)';
/* weave palette: warm amber and rust on deep umber */
var WARP = ['#C98A2E', '#A34D1F', '#D9A441', '#8A3D16', '#B96F24', '#7A3410'];
var WEFT = ['#E0A94A', '#96501E', '#C07A28', '#6E2E0D'];
var CARVE_START = 6, CARVE_STEP = 6, CARVE_DUR = 5;
var N_HOLES = 26;
var REGROW_START = 190, REGROW_SPREAD = 40, REGROW_DUR = 10;
var CYCLE = 280;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(i, j) {
  var h = Math.imul(i + 1, 374761393) ^ Math.imul(j + 1, 668265263);
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* fixed opening state, seeded once: frame one always shows the same field */
var rng = mulberry32(1739);
var holes = [];
(function initHoles() {
  var i, gx, gy, tries = 0;
  while (holes.length < N_HOLES && tries < 4000) {
    tries++;
    gx = 0.06 + rng() * 0.88;
    gy = 0.08 + rng() * 0.84;
    var ok = true, j;
    for (j = 0; j < holes.length; j++) {
      var dx = (holes[j].x - gx) * 1.4, dy = holes[j].y - gy;
      if (dx * dx + dy * dy < 0.028) { ok = false; break; }
    }
    if (!ok) continue;
    holes.push({ x: gx, y: gy, r: 20 + rng() * 34, seed: rng() });
  }
})();
var speckles = [];
(function initSpeckles() {
  var i;
  for (i = 0; i < 1400; i++) {
    speckles.push({
      x: rng(), y: rng(),
      s: rng() < 0.7 ? 1 : 2,
      c: rng() < 0.5 ? '#E8B45C' : (rng() < 0.5 ? '#5C2A0C' : '#3A1C08'),
      a: 0.12 + rng() * 0.3
    });
  }
})();
var simTime = 60;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* hole state at time t: 0 = intact weave, 1 = fully carved void.
   Carving is one hole at a time on a slow schedule; regrowth starts
   from the corners and is slower still. Pure function of t. */
function holeAmount(i, t) {
  var start = CARVE_START + i * CARVE_STEP;
  var carved = clamp((t - start) / CARVE_DUR, 0, 1);
  carved = carved * carved * (3 - 2 * carved);
  if (t < REGROW_START || carved <= 0) return carved;
  var h = holes[i];
  var cx = h.x < 0.5 ? 0 : 1, cy = h.y < 0.5 ? 0 : 1;
  var dx = h.x - cx, dy = h.y - cy;
  var d = Math.sqrt(dx * dx + dy * dy) / Math.SQRT2;
  var rstart = REGROW_START + d * REGROW_SPREAD;
  var regrown = clamp((t - rstart) / REGROW_DUR, 0, 1);
  regrown = regrown * regrown * (3 - 2 * regrown);
  return carved * (1 - regrown);
}
function drawWeave() {
  var i, j;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* warp: vertical amber and rust threads, brightness from a hash */
  var step = isPhone ? 12 : 14;
  var cols = Math.ceil(VW / step) + 1;
  for (i = 0; i < cols; i++) {
    var v = hash2(i, 7);
    ctx.fillStyle = WARP[Math.floor(v * WARP.length)];
    ctx.globalAlpha = 0.55 + hash2(i, 3) * 0.4;
    ctx.fillRect(i * step, 0, step - 1, VH);
  }
  ctx.globalAlpha = 1;
  /* weft: horizontal bands crossing the warp, over-under by column */
  var rows = Math.ceil(VH / step) + 1;
  for (j = 0; j < rows; j++) {
    var wv = hash2(11, j);
    ctx.fillStyle = WEFT[Math.floor(wv * WEFT.length)];
    for (i = 0; i < cols; i++) {
      if ((i + j) % 2 === 0) {
        ctx.globalAlpha = 0.22 + hash2(i, j) * 0.22;
        ctx.fillRect(i * step, j * step, step - 1, step - 1);
      }
    }
  }
  ctx.globalAlpha = 1;
  /* fine diagonal hatch, a second layer of noise over the weave */
  ctx.strokeStyle = 'rgba(232,180,92,0.10)';
  ctx.lineWidth = 1;
  var diag = Math.ceil((VW + VH) / 46);
  ctx.beginPath();
  for (i = 0; i < diag; i++) {
    var ox = i * 46 - VH;
    ctx.moveTo(ox, 0);
    ctx.lineTo(ox + VH, VH);
  }
  ctx.stroke();
  /* speckle */
  for (i = 0; i < speckles.length; i++) {
    var s = speckles[i];
    ctx.globalAlpha = s.a;
    ctx.fillStyle = s.c;
    ctx.fillRect(s.x * VW, s.y * VH, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}
function drawHoles(t) {
  var i;
  var scale = clamp(Math.min(VW, VH) / 800, 0.5, 1.4);
  for (i = 0; i < holes.length; i++) {
    var amt = holeAmount(i, t);
    if (amt <= 0.001) continue;
    var h = holes[i];
    var r = h.r * scale * (0.25 + 0.75 * amt);
    var x = h.x * VW, y = h.y * VH;
    var a = amt;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,' + a.toFixed(4) + ')');
    g.addColorStop(0.55, 'rgba(0,0,0,' + a.toFixed(4) + ')');
    g.addColorStop(0.85, 'rgba(0,0,0,' + (a * 0.55).toFixed(4) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }
}
function draw() {
  size();
  drawWeave();
  drawHoles(simTime);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  while (titlePx > 9 && ctx.measureText('Carve').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  }
  var titleW = ctx.measureText('Carve').width;
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var dateW = ctx.measureText('2006 · 10 · 16').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  ctx.fillText('Carve', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 16', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. The weave is carved away, then quietly regrows.';
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function update(dt) {
  simTime += dt;
  if (simTime >= CYCLE) simTime -= CYCLE;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { simTime = t; draw(); },
    simTime: function () { return simTime; },
    holeAmount: function (i, t) { return holeAmount(i, t); }
  };
}
/* ---- frame one: fixed phase, simTime 60, nine holes already carved ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) { update(dt); draw(); }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
