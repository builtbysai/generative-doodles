<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.356 Swirl / Potager</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#6E2B5B; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.356 Swirl / Potager (betterloveart).
// A word-to-pattern machine honouring Suchita Prakash's 30-day
// prompt-word streak: each challenge day takes two arbitrary words,
// and the pair grows a finished pattern. The words are never drawn
// (they live in the piece title only). The engine is a fixed authored
// cycle of exactly 6 word pairs; each pair maps to one motif family,
// one container grammar and one of her three caption-grounded
// palettes, all held as JS data below. TAP advances to the next pair
// in the cycle; DOUBLE-TAP (350ms window) keeps the pair and advances
// its layout within a fixed per-pair layout table (3 layouts each).
// A single tap is held for the full 350ms window before it commits,
// so a double-tap never half-advances the pair. Idle, the current
// pattern drifts slowly on sinusoids that complete whole cycles in
// the 30s master loop (LOOP), so frame 30s is pixel-identical to
// frame 0 at rest. Flat colour only, one canvas, no text, no chrome.
// Determinism: the first frame is drawn synchronously at the constant
// phase T = 6.3 (pair 1, layout 1, mid-drift), never Date.now() minus
// an offset, and the animation advances from that anchor in fixed
// 1/60 ticks.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var LOOP = 30;
var TAU = Math.PI * 2;
var PAGE = '#6E2B5B';
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 6.3, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var PAL = null, DX = 0, DY = 0;

// ---- the three caption-grounded palettes, as data --------------
// Each entry: ground plus three ink slots (main, secondary, accent).
// Palette 2 is cobalt on white only, so all three ink slots are the
// white; motifs may also knock out details in the ground colour,
// which keeps those pieces inside cobalt and white alone.
var PALETTES = [
  { ground: '#6E2B5B', c0: '#E07B39', c1: '#4F7A45', c2: '#F5EEDC' }, // 1 beetroot / carrot / leaf / cream
  { ground: '#274C9B', c0: '#F7FAFF', c1: '#F7FAFF', c2: '#F7FAFF' }, // 2 cobalt / white
  { ground: '#E3C878', c0: '#7A93A6', c1: '#B96A4B', c2: '#F2E8D5' }  // 3 wheat / denim / clay / cream
];
if (PALETTES.length !== 3) throw new Error('Swirl / Potager needs exactly 3 palettes');

// ---- the authored cycle: exactly 6 word pairs -------------------
// The pair words are data for the engine's hash table; the mapping
// (family, grammar, palette index) is authored and fixed. Pair 1 is
// the title pair: family swirl, grammar damask, palette 1.
var PAIRS = [
  { w: ['Swirl', 'Potager'],   fam: 'swirl',   gram: 'damask',  pal: 0 },
  { w: ['Orbit', 'Reef'],      fam: 'orbit',   gram: 'lattice', pal: 1 },
  { w: ['Potager', 'Leonine'], fam: 'potager', gram: 'tile',    pal: 2 },
  { w: ['Reef', 'Swirl'],      fam: 'reef',    gram: 'stripe',  pal: 0 },
  { w: ['Leonine', 'Orbit'],   fam: 'leonine', gram: 'plaid',   pal: 2 },
  { w: ['Potager', 'Orbit'],   fam: 'potager', gram: 'damask',  pal: 1 }
];
if (PAIRS.length !== 6) throw new Error('the cycle needs exactly 6 word pairs');

// ---- fixed per-pair layout tables (3 layouts per pair) ----------
// cell: motif cell size multiplier. rot: motif rotation in radians.
// alt: variant flag (damask corner diamonds, flip phase). ph: drift
// phase offset. Layouts change arrangement only, never family,
// grammar or palette.
var LAYOUTS = [
  [ { cell: 1.00, rot: 0.00, alt: 1, ph: 0.0 }, { cell: 0.85, rot: 0.00, alt: 0, ph: 2.1 }, { cell: 1.18, rot: 0.00, alt: 1, ph: 4.2 } ],
  [ { cell: 1.00, rot: 0.10, alt: 0, ph: 1.0 }, { cell: 1.15, rot: -0.12, alt: 1, ph: 3.3 }, { cell: 0.88, rot: 0.22, alt: 0, ph: 5.1 } ],
  [ { cell: 1.00, rot: 0.00, alt: 0, ph: 0.6 }, { cell: 0.90, rot: 0.15, alt: 1, ph: 2.8 }, { cell: 1.12, rot: -0.15, alt: 0, ph: 4.9 } ],
  [ { cell: 1.00, rot: 0.08, alt: 1, ph: 1.7 }, { cell: 1.20, rot: 0.00, alt: 0, ph: 3.9 }, { cell: 0.86, rot: -0.20, alt: 1, ph: 0.2 } ],
  [ { cell: 1.00, rot: 0.00, alt: 0, ph: 2.4 }, { cell: 0.92, rot: 0.18, alt: 1, ph: 4.6 }, { cell: 1.16, rot: -0.08, alt: 0, ph: 1.2 } ],
  [ { cell: 1.00, rot: 0.00, alt: 1, ph: 3.0 }, { cell: 1.14, rot: 0.00, alt: 0, ph: 5.4 }, { cell: 0.87, rot: 0.00, alt: 1, ph: 0.9 } ]
];
(function () {
  var i;
  for (i = 0; i < PAIRS.length; i++) {
    if (!LAYOUTS[i] || LAYOUTS[i].length !== 3) throw new Error('pair ' + i + ' needs exactly 3 layouts');
    if (PAIRS[i].pal < 0 || PAIRS[i].pal > 2) throw new Error('pair ' + i + ' palette outside the three');
  }
})();

// ---- small path helpers -----------------------------------------
function starPath(cx, cy, spikes, outer, inner, rot) {
  var i, a, rad, x, y;
  ctx.beginPath();
  for (i = 0; i < spikes * 2; i++) {
    rad = (i % 2 === 0) ? outer : inner;
    a = rot + i * Math.PI / spikes - Math.PI / 2;
    x = cx + Math.cos(a) * rad;
    y = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function spiralPath(cx, cy, r0, r1, turns) {
  var steps = 46, i, f, a, rad;
  ctx.beginPath();
  for (i = 0; i <= steps; i++) {
    f = i / steps;
    a = f * turns * TAU;
    rad = r0 + (r1 - r0) * f;
    if (i === 0) ctx.moveTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    else ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
}
function dot(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
}

// ---- motif families ---------------------------------------------
// Each family is two stylised flat motifs drawn in unit space
// (radius about 0.85), using the live palette PAL plus ground
// knockouts. No letters, no literal word pictures.
function mSpiral() {
  ctx.strokeStyle = PAL.c0;
  ctx.lineWidth = 0.17;
  ctx.lineCap = 'round';
  spiralPath(0, 0, 0.07, 0.68, 2.75);
  ctx.stroke();
  ctx.fillStyle = PAL.c2;
  dot(0.66, -0.5, 0.085);
}
function mSnail() {
  ctx.fillStyle = PAL.c1;
  ctx.beginPath();
  ctx.moveTo(-0.66, 0.46);
  ctx.bezierCurveTo(-0.68, 0.22, -0.3, 0.3, 0.02, 0.3);
  ctx.bezierCurveTo(0.3, 0.3, 0.36, 0.08, 0.55, 0.06);
  ctx.bezierCurveTo(0.72, 0.04, 0.7, 0.32, 0.62, 0.46);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = PAL.c1;
  ctx.lineWidth = 0.07;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0.52, 0.05); ctx.lineTo(0.66, -0.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.42, 0.08); ctx.lineTo(0.46, -0.26); ctx.stroke();
  ctx.fillStyle = PAL.c2;
  dot(0.67, -0.33, 0.065);
  dot(0.47, -0.29, 0.055);
  ctx.strokeStyle = PAL.c0;
  ctx.lineWidth = 0.21;
  spiralPath(-0.14, -0.04, 0.05, 0.52, 2.6);
  ctx.stroke();
}
function mTomato() {
  ctx.fillStyle = PAL.c0;
  dot(0, 0.1, 0.6);
  ctx.fillStyle = PAL.c1;
  starPath(0, -0.42, 5, 0.3, 0.13, 0);
  ctx.fill();
  ctx.strokeStyle = PAL.c1;
  ctx.lineWidth = 0.09;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -0.5);
  ctx.quadraticCurveTo(0.05, -0.66, 0.16, -0.72);
  ctx.stroke();
  ctx.fillStyle = PAL.ground;
  dot(-0.22, -0.02, 0.05);
  dot(0.18, 0.3, 0.04);
}
function mCarrot() {
  var gx = [-0.24, 0, 0.24], i;
  ctx.strokeStyle = PAL.c1;
  ctx.lineWidth = 0.1;
  ctx.lineCap = 'round';
  for (i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(0, -0.26);
    ctx.quadraticCurveTo(gx[i] * 0.7, -0.52, gx[i] * 1.5, -0.76 + Math.abs(gx[i]) * 0.4);
    ctx.stroke();
  }
  ctx.fillStyle = PAL.c0;
  ctx.beginPath();
  ctx.moveTo(-0.34, -0.3);
  ctx.quadraticCurveTo(0, -0.44, 0.34, -0.3);
  ctx.quadraticCurveTo(0.3, 0.18, 0, 0.78);
  ctx.quadraticCurveTo(-0.3, 0.18, -0.34, -0.3);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = PAL.ground;
  ctx.lineWidth = 0.055;
  ctx.beginPath(); ctx.moveTo(-0.2, 0.04); ctx.lineTo(0.08, 0.04); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-0.1, 0.32); ctx.lineTo(0.14, 0.32); ctx.stroke();
}
function mPlanet() {
  ctx.save();
  ctx.rotate(-0.32);
  ctx.strokeStyle = PAL.c2;
  ctx.lineWidth = 0.09;
  ctx.beginPath();
  ctx.ellipse(0, 0, 0.86, 0.3, 0, 0, TAU);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = PAL.c0;
  dot(0, 0, 0.5);
  ctx.fillStyle = PAL.ground;
  dot(-0.16, -0.1, 0.07);
  dot(0.14, 0.16, 0.055);
  dot(0.2, -0.2, 0.04);
  ctx.save();
  ctx.rotate(-0.32);
  ctx.strokeStyle = PAL.c2;
  ctx.lineWidth = 0.09;
  ctx.beginPath();
  ctx.ellipse(0, 0, 0.86, 0.3, 0, Math.PI * 0.15, Math.PI * 0.85);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = PAL.c1;
  dot(0.68, -0.62, 0.09);
}
function mStar() {
  ctx.fillStyle = PAL.c2;
  starPath(0, 0, 8, 0.78, 0.34, 0);
  ctx.fill();
  ctx.fillStyle = PAL.c0;
  dot(0, 0, 0.3);
  ctx.fillStyle = PAL.ground;
  dot(-0.09, -0.06, 0.05);
  dot(0.1, 0.08, 0.04);
}
function mShell() {
  var i, a;
  ctx.fillStyle = PAL.c0;
  ctx.beginPath();
  ctx.moveTo(0, 0.42);
  ctx.arc(0, 0.42, 0.78, Math.PI, TAU);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = PAL.ground;
  ctx.lineWidth = 0.06;
  ctx.lineCap = 'round';
  for (i = 0; i < 6; i++) {
    a = -Math.PI / 2 + (i - 2.5) * 0.42;
    ctx.beginPath();
    ctx.moveTo(0, 0.42);
    ctx.lineTo(Math.cos(a) * 0.72, 0.42 + Math.sin(a) * 0.72);
    ctx.stroke();
  }
  ctx.fillStyle = PAL.c1;
  ctx.beginPath();
  ctx.moveTo(-0.34, 0.36);
  ctx.lineTo(0.34, 0.36);
  ctx.lineTo(0.3, 0.56);
  ctx.lineTo(-0.3, 0.56);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = PAL.c2;
  dot(0, 0.44, 0.09);
}
function mCoral() {
  var segs = [
    [0, 0.64, 0.02, 0.1, 0.14],
    [0.02, 0.12, -0.3, -0.28, 0.11],
    [-0.3, -0.28, -0.44, -0.56, 0.09],
    [0.02, 0.12, 0.34, -0.22, 0.11],
    [0.34, -0.22, 0.52, -0.48, 0.09],
    [0.02, 0.1, 0.06, -0.42, 0.1],
    [0.06, -0.42, -0.08, -0.66, 0.08]
  ];
  var tips = [[-0.44, -0.58], [0.52, -0.5], [-0.08, -0.68]];
  var i;
  ctx.strokeStyle = PAL.c1;
  ctx.lineCap = 'round';
  for (i = 0; i < segs.length; i++) {
    ctx.lineWidth = segs[i][4];
    ctx.beginPath();
    ctx.moveTo(segs[i][0], segs[i][1]);
    ctx.lineTo(segs[i][2], segs[i][3]);
    ctx.stroke();
  }
  ctx.fillStyle = PAL.c2;
  for (i = 0; i < tips.length; i++) dot(tips[i][0], tips[i][1], 0.075);
  ctx.fillStyle = PAL.c0;
  ctx.beginPath();
  ctx.ellipse(0, 0.68, 0.3, 0.12, 0, 0, TAU);
  ctx.fill();
}
function maneRays(count, inner, outerA, outerB) {
  var k, a;
  for (k = 0; k < count; k++) {
    a = k * TAU / count;
    var outer = (k % 2 === 0) ? outerA : outerB;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.17) * inner, Math.sin(a - 0.17) * inner);
    ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
    ctx.lineTo(Math.cos(a + 0.17) * inner, Math.sin(a + 0.17) * inner);
    ctx.closePath();
    ctx.fill();
  }
}
function mLion() {
  ctx.fillStyle = PAL.c0;
  maneRays(12, 0.4, 0.8, 0.66);
  dot(-0.32, -0.34, 0.14);
  dot(0.32, -0.34, 0.14);
  ctx.fillStyle = PAL.c2;
  dot(0, 0, 0.46);
  ctx.fillStyle = PAL.ground;
  dot(-0.17, -0.05, 0.055);
  dot(0.17, -0.05, 0.055);
  ctx.fillStyle = PAL.c1;
  ctx.beginPath();
  ctx.moveTo(-0.09, 0.1);
  ctx.lineTo(0.09, 0.1);
  ctx.lineTo(0, 0.22);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = PAL.ground;
  ctx.lineWidth = 0.04;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0.22);
  ctx.lineTo(0, 0.3);
  ctx.stroke();
}
function mMane() {
  ctx.fillStyle = PAL.c0;
  maneRays(10, 0.3, 0.82, 0.68);
  ctx.fillStyle = PAL.c1;
  dot(0, 0, 0.36);
  ctx.fillStyle = PAL.c2;
  dot(0, 0, 0.16);
}
var FAMILIES = {
  swirl: [mSpiral, mSnail],
  potager: [mTomato, mCarrot],
  orbit: [mPlanet, mStar],
  reef: [mShell, mCoral],
  leonine: [mLion, mMane]
};
(function () {
  var i;
  for (i = 0; i < PAIRS.length; i++) {
    if (!FAMILIES[PAIRS[i].fam]) throw new Error('pair ' + i + ' names an unknown family');
    if (['damask', 'lattice', 'tile', 'plaid', 'stripe'].indexOf(PAIRS[i].gram) < 0) {
      throw new Error('pair ' + i + ' names an unknown grammar');
    }
  }
})();

// ---- motif placement ---------------------------------------------
function placeMotif(fam, variant, x, y, r, rot, flipX, flipY) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(flipX ? -r : r, flipY ? -r : r);
  FAMILIES[fam][variant]();
  ctx.restore();
}
function parity(n) { return ((n % 2) + 2) % 2; }

// ---- container grammars ------------------------------------------
// Each grammar tiles the whole design field plus a margin, offset by
// the shared idle drift (DX, DY). Cell sizes are per-grammar bases
// scaled by the layout's cell multiplier.
var BASE = { damask: 215, lattice: 195, tile: 220, plaid: 240, stripe: 205 };

function gDamask(fam, lay) {
  var cell = BASE.damask * lay.cell;
  var r = cell * 0.36;
  var i, j, cx, cy;
  for (j = -2; j * cell < DH + cell * 2; j++) {
    for (i = -2; i * cell < DW + cell * 2; i++) {
      cx = i * cell + cell / 2 + DX;
      cy = j * cell + cell / 2 + DY;
      placeMotif(fam, parity(i + j), cx, cy, r, 0, parity(i) === 1, parity(j) === 1);
      if (lay.alt) {
        ctx.save();
        ctx.translate(i * cell + DX, j * cell + DY);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = PAL.c2;
        var d = cell * 0.075;
        ctx.fillRect(-d, -d, d * 2, d * 2);
        ctx.restore();
      }
    }
  }
}
function gLattice(fam, lay) {
  var cell = BASE.lattice * lay.cell;
  var pitch = cell * 0.86;
  var r = cell * 0.3;
  var i, j, cx, cy;
  ctx.strokeStyle = PAL.c1;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (j = -2; j * pitch < DH + cell * 2; j++) {
    for (i = -2; i * cell < DW + cell * 2; i++) {
      cx = i * cell + (parity(j) ? cell / 2 : 0) + DX;
      cy = j * pitch + DY;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + cell / 2, cy + pitch);
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx - cell / 2, cy + pitch);
      ctx.stroke();
    }
  }
  for (j = -2; j * pitch < DH + cell * 2; j++) {
    for (i = -2; i * cell < DW + cell * 2; i++) {
      cx = i * cell + (parity(j) ? cell / 2 : 0) + DX;
      cy = j * pitch + DY;
      placeMotif(fam, parity(i + j), cx, cy, r, lay.rot * (parity(i + j) ? 1 : -1), false, false);
    }
  }
}
function gTile(fam, lay) {
  var cell = BASE.tile * lay.cell;
  var r = cell * 0.33;
  var i, j, cx, cy;
  ctx.strokeStyle = PAL.c2;
  ctx.lineWidth = 2.5;
  for (j = -2; j * cell < DH + cell * 2; j++) {
    for (i = -2; i * cell < DW + cell * 2; i++) {
      cx = i * cell + cell / 2 + DX;
      cy = j * cell + cell / 2 + DY;
      ctx.strokeRect(cx - cell / 2 + 5, cy - cell / 2 + 5, cell - 10, cell - 10);
      placeMotif(fam, parity(i + j), cx, cy, r, lay.rot, false, false);
    }
  }
}
function gPlaid(fam, lay) {
  var cell = BASE.plaid * lay.cell;
  var bandW = cell * 0.52;
  var r = cell * 0.3;
  var i, j, bx, by;
  ctx.fillStyle = PAL.c0;
  for (i = -2; i * cell < DW + cell * 2; i++) {
    ctx.fillRect(i * cell + DX, -cell, bandW, DH + cell * 2);
  }
  ctx.fillStyle = PAL.c1;
  for (j = -2; j * cell < DH + cell * 2; j++) {
    ctx.fillRect(-cell, j * cell + DY, DW + cell * 2, bandW);
  }
  ctx.fillStyle = PAL.c2;
  for (j = -2; j * cell < DH + cell * 2; j++) {
    for (i = -2; i * cell < DW + cell * 2; i++) {
      ctx.fillRect(i * cell + DX, j * cell + DY, bandW, bandW);
    }
  }
  for (j = -2; j * cell < DH + cell * 2; j++) {
    for (i = -2; i * cell < DW + cell * 2; i++) {
      bx = i * cell + bandW / 2 + DX;
      by = j * cell + bandW / 2 + DY;
      placeMotif(fam, parity(i + j), bx, by, r, lay.rot * (parity(i) ? 1 : -1), false, false);
    }
  }
}
function gStripe(fam, lay) {
  var cell = BASE.stripe * lay.cell;
  var bandW = cell * 0.46;
  var r = cell * 0.28;
  var i, j, cx, cy;
  for (i = -2; i * cell < DW + cell * 2; i++) {
    ctx.fillStyle = PAL.c0;
    ctx.fillRect(i * cell + DX, -cell, bandW, DH + cell * 2);
    ctx.fillStyle = PAL.c1;
    ctx.fillRect(i * cell + bandW + cell * 0.08 + DX, -cell, cell * 0.09, DH + cell * 2);
  }
  for (j = -2; j * cell < DH + cell * 2; j++) {
    for (i = -2; i * cell < DW + cell * 2; i++) {
      cx = i * cell + cell * 0.76 + DX;
      cy = j * cell + cell / 2 + (parity(i) ? cell * 0.22 : 0) + DY;
      placeMotif(fam, parity(i + j), cx, cy, r, lay.rot, false, false);
    }
  }
}
var GRAMMARS = { damask: gDamask, lattice: gLattice, tile: gTile, plaid: gPlaid, stripe: gStripe };

// ---- state ---------------------------------------------------------
var pairIdx = 0;
var layoutPos = [0, 0, 0, 0, 0, 0];
var pendingCommit = -1; // piece-clock time at which a held tap commits
var lastTapUp = -10;
var downPos = null;

// ---- drawing -------------------------------------------------------
function draw() {
  var pair = PAIRS[pairIdx];
  var lay = LAYOUTS[pairIdx][layoutPos[pairIdx]];
  PAL = PALETTES[pair.pal];
  ctx.fillStyle = PAL.ground;
  ctx.fillRect(0, 0, DW, DH);
  var cyc = ((T % LOOP) + LOOP) % LOOP;
  var ph = TAU * cyc / LOOP;
  DX = 16 * Math.sin(ph + lay.ph);
  DY = 11 * Math.cos(ph + lay.ph * 0.7);
  GRAMMARS[pair.gram](pair.fam, lay);
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- tap: next pair. double-tap: same pair, next layout. ---------
// A tap is a press that barely moves. The first tap is held: it only
// commits (pair advance) once the 350ms double-tap window has fully
// passed inside the tick loop. A second tap landing inside the window
// cancels the held tap and advances the layout instead.
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  downPos = toDesign(e);
});
canvas.addEventListener('pointerup', function (e) {
  if (!downPos) return;
  var p = toDesign(e);
  var moved = Math.sqrt((p.x - downPos.x) * (p.x - downPos.x) + (p.y - downPos.y) * (p.y - downPos.y));
  downPos = null;
  if (moved > 14) return;
  if (pendingCommit >= 0 && T - lastTapUp <= 0.35) {
    pendingCommit = -1;
    lastTapUp = -10;
    layoutPos[pairIdx] = (layoutPos[pairIdx] + 1) % LAYOUTS[pairIdx].length;
  } else {
    pendingCommit = T + 0.35;
    lastTapUp = T;
  }
});
canvas.addEventListener('pointercancel', function () { downPos = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK;
    if (pendingCommit >= 0 && T >= pendingCommit) {
      pairIdx = (pairIdx + 1) % PAIRS.length;
      pendingCommit = -1;
    }
    acc -= TICK; guard++;
  }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
})();
</script>
