<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shadow Is the Piece</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0A0C; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0A0A0C';
var DIM = '#3A3A42';
var BRIGHT = '#F5F5F5';
var LOOP = 30;                     // slow autonomous rotation period, seconds
var PROJ_D = 2.2;                 // stereographic projection point height above object centre
var W_PERSP = 4;                   // 4D -> 3D perspective distance (gentle: keeps |y| well below PROJ_D)
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var seed = 1577;
// Tesseract: 16 vertices (±1,±1,±1,±1), 32 edges (pairs differing in one coordinate).
var V = [];
var E = [];
(function buildTesseract() {
  var i, b;
  for (i = 0; i < 16; i++) {
    V.push([(i & 1) ? 1 : -1, (i & 2) ? 1 : -1, (i & 4) ? 1 : -1, (i & 8) ? 1 : -1]);
  }
  for (i = 0; i < 16; i++) {
    for (b = 0; b < 4; b++) {
      var j = i ^ (1 << b);
      if (j > i) E.push([i, j]);
    }
  }
})();
var dragging = false, downX = 0, downY = 0;
var yawT = 0, pitchT = 0, yaw = 0, pitch = 0;   // drag targets and eased current values
var phase1 = 0, phase2 = 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
(function seedPhases() {
  var rnd = mulberry32(seed);
  // Small seeded phases: frame one is a near-axis-aligned tesseract, so
  // its shadow reads as a magnified nested-box shadow sitting below the
  // object instead of spiking up into the object's third. The 30s loop
  // still turns the solid through every orientation, folding the shadow.
  phase1 = rnd() * 0.35;
  phase2 = rnd() * 0.35;
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
// Rotate a 4D point in the plane of axes a,b by angle ang.
function rot4(p, a, b, ang) {
  var c = Math.cos(ang), s = Math.sin(ang);
  var u = p[a], v = p[b];
  p[a] = u * c - v * s;
  p[b] = u * s + v * c;
}
function clamp(v, lo, hi) {
  if (v < lo) return lo;
  if (v > hi) return hi;
  return v;
}
function draw(t) {
  lastT = t;
  size();
  var minDim = Math.min(VW, VH);
  var u = minDim / 900;
  // Ease the drag rotation toward its target; autonomous rotation is a
  // pure function of t, so frame one (t = 0, no drag) is fixed.
  yaw += (yawT - yaw) * 0.15;
  pitch += (pitchT - pitch) * 0.15;
  var a1 = TAU * t / LOOP + phase1;
  var a2 = TAU * t / LOOP + phase2;
  var cy = Math.cos(yaw), sy = Math.sin(yaw);
  var cx = Math.cos(pitch), sx = Math.sin(pitch);
  var i, e;
  // 4D rotation, 4D -> 3D perspective, then drag yaw/pitch in 3D.
  var P = [];   // 3D points after all rotation, object space, y up
  for (i = 0; i < 16; i++) {
    var p = [V[i][0], V[i][1], V[i][2], V[i][3]];
    rot4(p, 0, 3, a1);   // XW plane: the tesseract turning through itself
    rot4(p, 1, 2, a2);   // YZ plane
    var s = W_PERSP / (W_PERSP - p[3]);
    var x3 = p[0] * s, y3 = p[1] * s, z3 = p[2] * s;
    // Yaw about the vertical axis, then pitch about the horizontal axis.
    var x4 = x3 * cy + z3 * sy;
    var z4 = -x3 * sy + z3 * cy;
    var y4 = y3 * cx - z4 * sx;
    var z5 = y3 * sx + z4 * cx;
    P.push([x4, y4, z5]);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);

  // Shadow first: stereographic projection of every vertex from the fixed
  // point (0, PROJ_D, 0) straight down onto the ground plane y = 0.
  // scale = d / (d - y): vertices near the projection point magnify
  // many times, so the shadow sweeps and folds as the solid turns.
  var shCX = VW * 0.5;
  var shCY = VH * 0.66;
  var shS = minDim * 0.075;
  var S = [];   // projected plane points, screen coords
  var T = [];   // per-vertex projection factor
  for (i = 0; i < 16; i++) {
    var tf = PROJ_D / (PROJ_D - P[i][1]);
    T.push(tf);
    S.push([shCX + P[i][0] * tf * shS, shCY + P[i][2] * tf * shS]);
  }
  // Bright shadow: a soft wide pass under a crisp thin pass, alpha by
  // projected distance so near (magnified) edges burn brightest.
  var pass;
  for (pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = BRIGHT;
    ctx.lineWidth = (pass === 0 ? 3.2 : 1.2) * u;
    for (e = 0; e < E.length; e++) {
      var a = E[e][0], b = E[e][1];
      var r = (Math.abs(S[a][0] - shCX) + Math.abs(S[a][1] - shCY) +
               Math.abs(S[b][0] - shCX) + Math.abs(S[b][1] - shCY)) / (4 * shS);
      var al = clamp(1.15 - r * 0.055, 0.30, 1) * (pass === 0 ? 0.28 : 1);
      ctx.globalAlpha = Number(al.toFixed(4));
      ctx.beginPath();
      ctx.moveTo(S[a][0], S[a][1]);
      ctx.lineTo(S[b][0], S[b][1]);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // The object itself: dim grey wireframe in the upper third, for reference.
  var obCX = VW * 0.5;
  var obCY = VH * 0.20;
  var obS = minDim * 0.07;
  ctx.strokeStyle = DIM;
  ctx.globalAlpha = 0.8;
  ctx.lineWidth = 1 * u;
  for (e = 0; e < E.length; e++) {
    var p0 = P[E[e][0]], p1 = P[E[e][1]];
    ctx.beginPath();
    ctx.moveTo(obCX + p0[0] * obS, obCY - p0[1] * obS);
    ctx.lineTo(obCX + p1[0] * obS, obCY - p1[1] * obS);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Caption: title, formula date, drag cue. Bright chip, near-black text.
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'The Shadow Is the Piece  ·  2006 · 05 · 07  ·  Drag to turn the solid.';
  ctx.font = fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  var pad = Math.round(fs * 0.7);
  var bx = Math.round(fs * 0.8), by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  ctx.fillStyle = BRIGHT;
  ctx.fillRect(bx - pad, by, Math.ceil(tw) + 2 * pad, fs + 2 * pad);
  ctx.fillStyle = GROUND;
  ctx.textBaseline = 'top';
  ctx.fillText(label, bx, by + pad);
  if (typeof window !== 'undefined') {
    window.__p1577 = {
      t: t, seed: seed, vertices: V.length, edges: E.length,
      yaw: yaw, pitch: pitch, phone: isPhone()
    };
  }
}
function onDown(e) {
  dragging = true;
  downX = e.clientX; downY = e.clientY;
}
function onMove(e) {
  if (!dragging) return;
  // Drag rotates the solid directly under the finger; the shadow follows
  // the same rotated vertices, so it obeys the projection live.
  yawT += (e.clientX - downX) * 0.005;
  pitchT += (e.clientY - downY) * 0.005;
  downX = e.clientX; downY = e.clientY;
  draw(lastT);
}
function onUp() { dragging = false; }
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof document !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
