<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Notary</title>
<style>
  html, body { margin: 0; padding: 0; background: #2E4B3F; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// The Notary (EXPANSION #89 paul-ramirez-jonas, block 3)
// Alternative Facts (2017) rebuilt as a desk from above: felt green,
// a document at the left, a heavy notary stamp on a spring arm at the
// top, a silver coin in a dish at the right, an archive drawer slot
// along the bottom edge. The taps are the tolls. Tap the document and
// a seeded harmless lie types itself out. Tap the stamp and it slams
// TRUE across the lie in red; at the same moment the silver coin
// begins to gold-plate, a slow six-second chemical change with pale
// bubbles rising. Tap the dish when the plating finishes and two
// certification documents print: one slides into the archive drawer,
// one slides toward you. The drawer stack persists across cycles;
// tap it to flip through the filed lies. No text entry, no sparkle:
// the lies are seeded, the plating is a lerp, the fee is the coin.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  felt: '#2E4B3F',
  paper: '#F7F3E8',
  ink: '#1C1C1C',
  red: '#C0392B',
  silver: '#C0C5CE',
  gold: '#D4A017',
  bubble: '#F0D878'
};

var LIES = [
  'I was never late',
  'The fish was this big',
  'I read the whole book',
  'I did all my homework',
  'The dog ate it, truly',
  'I am not tired at all',
  'I won fair and square',
  'I never peeked once',
  'I was stuck in traffic',
  'I already paid you back',
  'I meant to call you',
  'It was like that when I got here'
];

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, isPhone = false;

// ---------------------------------------------------------------------------
// Timing. Every animated quantity is a closed-form function of the time
// since a recorded tap event; frame one is the blank desk at load.
// ---------------------------------------------------------------------------
var TYPE_DT = 0.085;   // seconds per typed character
var SLAM_DUR = 0.6;    // stamp down, hold, return
var SLAM_HIT = 0.16;   // impact moment inside the slam
var PLATE_DUR = 6.0;   // silver to gold
var PRINT_DUR = 2.4;   // slides 0..1.2, hold 1.2..2.4

// ---------------------------------------------------------------------------
// State machine. States: blank -> typing -> typed -> slamming ->
// plating -> plated -> printing -> blank (next lie, archive persists).
// ---------------------------------------------------------------------------
var baseSeed = 73089;
var lieOrder = [];
var liePos = 0;
var archive = [];      // filed lie strings, oldest first
var machine = { state: 'blank', t0: 0 };
var flipIndex = -1;    // -1 closed, else index into archive

function shuffledOrder(seed) {
  var rng = mulberry32(seed);
  var idx = [];
  for (var i = 0; i < LIES.length; i++) idx.push(i);
  for (var j = idx.length - 1; j > 0; j--) {
    var k = Math.floor(rng() * (j + 1));
    var tmp = idx[j]; idx[j] = idx[k]; idx[k] = tmp;
  }
  return idx;
}
lieOrder = shuffledOrder(baseSeed);
function currentLie() { return LIES[lieOrder[liePos % LIES.length]]; }
function advanceLie() {
  liePos += 1;
  if (liePos % LIES.length === 0) lieOrder = shuffledOrder(baseSeed + liePos);
}

// Bubbles: 40 seeded particles; each is a pure function of plating
// progress p, so the fizz is identical on every replay of the phase.
var bubbles = [];
(function () {
  var rng = mulberry32(baseSeed * 7 + 3);
  for (var i = 0; i < 40; i++) {
    bubbles.push({
      off: rng(),            // phase offset
      speed: 0.55 + rng() * 0.9,
      ang: rng() * Math.PI * 2,
      rad: 0.25 + rng() * 0.7,   // start radius as a share of coin radius
      size: 0.5 + rng() * 0.9
    });
  }
})();

// Inert QA hook: ?seed=tNN replays a scripted timeline (typing by 2 s,
// slam at 4 s, plating 4.6..10.6 s, print at 11.2 s) so forced states
// can be rendered headlessly. No effect in the gallery.
var forcedT = -1;
(function () {
  try {
    var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(location.search || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (e) { /* inert hook, QA only */ }
})();

// ---------------------------------------------------------------------------
// Layout. Fractions resolve per size; the phone layout stacks the desk
// vertically: document top, dish mid-frame, drawer along the bottom.
// ---------------------------------------------------------------------------
function layout() {
  var u = Math.min(W, H);
  if (isPhone) {
    return {
      doc: { x: W * 0.06, y: H * 0.09, w: W * 0.88, h: H * 0.33 },
      stampHover: { x: W * 0.5, y: H * 0.155 },
      dish: { x: W * 0.5, y: H * 0.60, rx: W * 0.30, ry: H * 0.028 },
      coinR: u * 0.085,
      drawer: { x: W * 0.10, y: H * 0.925, w: W * 0.80, h: H * 0.045 },
      u: u
    };
  }
  return {
    doc: { x: W * 0.06, y: H * 0.20, w: W * 0.40, h: H * 0.52 },
    stampHover: { x: W * 0.50, y: H * 0.19 },
    dish: { x: W * 0.78, y: H * 0.44, rx: W * 0.115, ry: H * 0.040 },
    coinR: u * 0.062,
    drawer: { x: W * 0.28, y: H * 0.915, w: W * 0.46, h: H * 0.05 },
    u: u
  };
}
function stackRect(L) {
  // The filed pile sits on the desk just above the drawer slot, left end.
  var sw = L.doc.w * 0.52, sh = L.doc.h * 0.30;
  return { x: L.drawer.x, y: L.drawer.y - sh - L.u * 0.018, w: sw, h: sh };
}

// ---------------------------------------------------------------------------
// Scene computation: given "now" (seconds since load), produce every
// phase value the renderer needs. Live mode reads the state machine;
// forced mode reads the scripted timeline.
// ---------------------------------------------------------------------------
function computeScene(now) {
  var sc = {
    typeCount: 0, stamped: false, plateP: 0, printP: -1,
    slamK: 0, shake: 0, lie: currentLie(), filed: archive.length
  };
  if (forcedT >= 0) {
    var t = forcedT;
    sc.lie = LIES[lieOrder[0]];
    var typeDur = sc.lie.length * TYPE_DT;
    if (t < 2 + typeDur) {
      sc.typeCount = Math.min(sc.lie.length, Math.floor(Math.max(0, t - 0.4) / TYPE_DT));
    } else { sc.typeCount = sc.lie.length; }
    if (t >= 4 && t < 4 + SLAM_DUR) sc.slamK = (t - 4) / SLAM_DUR;
    if (t >= 4 + SLAM_HIT) { sc.stamped = true; sc.shake = Math.max(0, 1 - (t - 4 - SLAM_HIT) / 0.35); }
    if (t >= 4.6) sc.plateP = Math.min(1, (t - 4.6) / PLATE_DUR);
    if (t >= 11.2) sc.printP = Math.min(1, (t - 11.2) / PRINT_DUR);
    if (sc.printP >= 0) sc.slamK = 0;
    return sc;
  }
  var dt = now - machine.t0;
  switch (machine.state) {
    case 'typing': {
      var n = Math.floor(dt / TYPE_DT);
      sc.typeCount = Math.min(sc.lie.length, n);
      if (n >= sc.lie.length) { machine.state = 'typed'; machine.t0 = now; }
      break;
    }
    case 'typed':
      sc.typeCount = sc.lie.length;
      break;
    case 'slamming': {
      sc.typeCount = sc.lie.length;
      var k = dt / SLAM_DUR;
      if (k >= 1) { machine.state = 'plating'; machine.t0 = now; sc.plateP = 0; }
      else {
        sc.slamK = k;
        if (dt >= SLAM_HIT) {
          sc.stamped = true;
          sc.shake = Math.max(0, 1 - (dt - SLAM_HIT) / 0.35);
        }
      }
      break;
    }
    case 'plating': {
      sc.typeCount = sc.lie.length;
      sc.stamped = true;
      sc.plateP = Math.min(1, dt / PLATE_DUR);
      if (dt >= PLATE_DUR) { machine.state = 'plated'; machine.t0 = now; sc.plateP = 1; }
      break;
    }
    case 'plated':
      sc.typeCount = sc.lie.length;
      sc.stamped = true;
      sc.plateP = 1;
      break;
    case 'printing': {
      sc.typeCount = sc.lie.length;
      sc.stamped = true;
      sc.plateP = 1;
      sc.printP = Math.min(1, dt / PRINT_DUR);
      if (dt >= PRINT_DUR) {
        archive.push(sc.lie);
        advanceLie();
        machine.state = 'blank'; machine.t0 = now;
        sc.typeCount = 0; sc.stamped = false; sc.plateP = 0; sc.printP = -1;
        sc.lie = currentLie(); sc.filed = archive.length;
      }
      break;
    }
  }
  return sc;
}

function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

function lerpColor(a, b, t) {
  function ch(h, i) { return parseInt(h.substr(i, 2), 16); }
  var r = Math.round(ch(a, 1) + (ch(b, 1) - ch(a, 1)) * t);
  var g = Math.round(ch(a, 3) + (ch(b, 3) - ch(a, 3)) * t);
  var bl = Math.round(ch(a, 5) + (ch(b, 5) - ch(a, 5)) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

// Slam curve: 0 at rest, 1 at full press. Down fast, brief hold, return.
function slamCurve(k) {
  if (k <= 0) return 0;
  if (k < SLAM_HIT / SLAM_DUR) { var d = k / (SLAM_HIT / SLAM_DUR); return d * d; }
  if (k < 0.45) return 1;
  var r = (k - 0.45) / 0.55;
  return 1 - easeOutCubic(r);
}

// ---------------------------------------------------------------------------
// Text helpers: word wrap in monospace, measured with the live context.
// ---------------------------------------------------------------------------
function wrapText(text, maxWidth, font) {
  ctx.font = font;
  var words = text.split(' ');
  var lines = [], line = '';
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = words[i]; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawTrueStamp(cx, cy, scale, alpha) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.21);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = COL.red;
  ctx.fillStyle = COL.red;
  var fs = 34 * scale;
  ctx.font = '700 ' + fs + 'px "Courier New", monospace';
  var tw = ctx.measureText('TRUE').width;
  var padX = 12 * scale, padY = 8 * scale;
  ctx.lineWidth = 3 * scale;
  ctx.strokeRect(-tw / 2 - padX, -fs / 2 - padY, tw + padX * 2, fs + padY * 2);
  ctx.lineWidth = 1.2 * scale;
  ctx.strokeRect(-tw / 2 - padX + 4 * scale, -fs / 2 - padY + 4 * scale, tw + padX * 2 - 8 * scale, fs + padY * 2 - 8 * scale);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('TRUE', 0, 1 * scale);
  ctx.restore();
}

function drawDocument(L, sc, now) {
  var d = L.doc;
  // paper shadow: ink at low alpha, offset down-right
  ctx.fillStyle = COL.ink;
  ctx.globalAlpha = 0.25;
  ctx.fillRect(d.x + L.u * 0.012, d.y + L.u * 0.014, d.w, d.h);
  ctx.globalAlpha = 1;
  ctx.fillStyle = COL.paper;
  ctx.fillRect(d.x, d.y, d.w, d.h);
  ctx.strokeStyle = COL.ink;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1;
  ctx.strokeRect(d.x + 0.5, d.y + 0.5, d.w - 1, d.h - 1);
  ctx.globalAlpha = 1;
  // faint ruled lines
  var fs = Math.max(13, L.u * 0.030);
  var lineH = fs * 1.5;
  var tx = d.x + d.w * 0.09, ty = d.y + d.h * 0.16;
  ctx.strokeStyle = COL.ink;
  ctx.globalAlpha = 0.10;
  ctx.beginPath();
  for (var r = 0; r < 4; r++) {
    var ly = ty + lineH * r + fs * 0.45;
    if (ly > d.y + d.h * 0.62) break;
    ctx.moveTo(tx, ly);
    ctx.lineTo(d.x + d.w * 0.91, ly);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
  // typed lie
  if (sc.typeCount > 0) {
    var shown = sc.lie.substring(0, sc.typeCount);
    var font = fs + 'px "Courier New", monospace';
    var lines = wrapText(shown, d.w * 0.82, font);
    ctx.font = font;
    ctx.fillStyle = COL.ink;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], tx, ty + lineH * i + fs);
    }
    // typewriter carriage block while the lie is still coming out
    if (sc.typeCount > 0 && sc.typeCount < sc.lie.length) {
      var last = lines[lines.length - 1] || '';
      var cw = ctx.measureText(last).width;
      if (Math.floor(now * 2.4) % 2 === 0) {
        ctx.fillRect(tx + cw + 3, ty + lineH * (lines.length - 1) + 2, fs * 0.55, fs * 0.9);
      }
    }
  }
  if (sc.stamped) {
    drawTrueStamp(d.x + d.w * 0.52, d.y + d.h * 0.68, Math.max(0.6, L.u * 0.0016), 0.88);
  }
}

function drawStamp(L, sc) {
  var hover = L.stampHover;
  var docC = { x: L.doc.x + L.doc.w * 0.52, y: L.doc.y + L.doc.h * 0.68 };
  var k = slamCurve(sc.slamK);
  var hx = hover.x + (docC.x - hover.x) * k;
  var hy = hover.y + (docC.y - hover.y) * k;
  var u = L.u;
  // spring arm: top bar, pivot, link down to the stamp body
  ctx.strokeStyle = COL.ink;
  ctx.fillStyle = COL.ink;
  var barY = H * 0.035;
  ctx.fillRect(W * 0.30, barY, W * 0.40, u * 0.016);
  ctx.beginPath();
  ctx.arc(hover.x, barY + u * 0.008, u * 0.016, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = u * 0.010;
  ctx.beginPath();
  ctx.moveTo(hover.x, barY + u * 0.008);
  ctx.lineTo(hx, hy - u * 0.118);
  ctx.stroke();
  // stamp body: knob, neck, head, base plate, thin red seal face
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(-0.10 + 0.10 * k);
  ctx.beginPath();
  ctx.arc(0, -u * 0.115, u * 0.028, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(-u * 0.011, -u * 0.115, u * 0.022, u * 0.058);
  ctx.fillRect(-u * 0.046, -u * 0.066, u * 0.092, u * 0.042);
  ctx.fillRect(-u * 0.058, -u * 0.024, u * 0.116, u * 0.019);
  ctx.fillStyle = COL.red;
  ctx.fillRect(-u * 0.058, -u * 0.005, u * 0.116, u * 0.005);
  ctx.restore();
}

function drawDishAndCoin(L, sc) {
  var d = L.dish;
  // dish
  ctx.fillStyle = COL.ink;
  ctx.globalAlpha = 0.30;
  ctx.beginPath();
  ctx.ellipse(d.x, d.y + L.u * 0.008, d.rx, d.ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = COL.silver;
  ctx.beginPath();
  ctx.ellipse(d.x, d.y, d.rx, d.ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = COL.ink;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(d.x, d.y, d.rx, d.ry, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 0.45;
  ctx.beginPath();
  ctx.ellipse(d.x, d.y, d.rx * 0.78, d.ry * 0.62, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // coin: silver lerping to gold, a slow chemical change, no sparkle
  var p = easeInOut(sc.plateP);
  var cr = L.coinR;
  var cy = d.y - cr * 0.30;
  ctx.fillStyle = lerpColor(COL.silver, COL.gold, p);
  ctx.beginPath();
  ctx.arc(d.x, cy, cr, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = COL.ink;
  ctx.globalAlpha = 0.40;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(d.x, cy, cr * 0.78, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // a plated rim creeps inward as the change completes
  if (p > 0) {
    ctx.strokeStyle = COL.gold;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(1.5, cr * 0.10);
    ctx.beginPath();
    ctx.arc(d.x, cy, cr - ctx.lineWidth / 2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // bubbles rise only while the plating is under way
  if (sc.plateP > 0 && sc.plateP < 1) {
    ctx.fillStyle = COL.bubble;
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      var ph = (sc.plateP * b.speed + b.off) % 1;
      var bx = d.x + Math.cos(b.ang) * cr * b.rad + Math.sin(ph * 9 + b.off * 20) * cr * 0.08;
      var by = cy + cr * 0.5 - ph * cr * 2.1;
      ctx.globalAlpha = Math.sin(ph * Math.PI) * 0.75;
      ctx.beginPath();
      ctx.arc(bx, by, Math.max(1, cr * 0.055 * b.size), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function drawDrawerAndStack(L, sc) {
  var dr = L.drawer;
  // slot
  ctx.fillStyle = COL.ink;
  ctx.globalAlpha = 0.85;
  ctx.fillRect(dr.x, dr.y, dr.w, dr.h);
  ctx.globalAlpha = 1;
  ctx.fillStyle = COL.paper;
  ctx.globalAlpha = 0.5;
  ctx.fillRect(dr.x + dr.w * 0.06, dr.y + dr.h * 0.42, dr.w * 0.88, Math.max(1.5, dr.h * 0.14));
  ctx.globalAlpha = 1;
  // filed stack: one sheet per archived document, capped visually
  var s = stackRect(L);
  var n = Math.min(sc.filed, 14);
  for (var i = 0; i < n; i++) {
    var ox = (i % 3 - 1) * L.u * 0.006;
    var oy = -i * L.u * 0.0075;
    ctx.fillStyle = COL.ink;
    ctx.globalAlpha = 0.18;
    ctx.fillRect(s.x + ox + 2, s.y + oy + 3, s.w, s.h);
    ctx.globalAlpha = 1;
    ctx.fillStyle = COL.paper;
    ctx.fillRect(s.x + ox, s.y + oy, s.w, s.h);
    ctx.strokeStyle = COL.ink;
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1;
    ctx.strokeRect(s.x + ox + 0.5, s.y + oy + 0.5, s.w - 1, s.h - 1);
    ctx.globalAlpha = 1;
  }
  if (n > 0) {
    // the newest filed sheet carries its mini TRUE
    var topY = s.y - (n - 1) * L.u * 0.0075;
    drawTrueStamp(s.x + s.w * 0.55, topY + s.h * 0.58, Math.max(0.22, L.u * 0.00055), 0.8);
  }
}

function drawPrintCopies(L, sc) {
  if (sc.printP < 0) return;
  var d = L.doc;
  var slide = easeInOut(clamp01(sc.printP / (1.2 / PRINT_DUR)));
  var dr = L.drawer;
  // both copies start as half-size duplicates on the document
  var sw = d.w * 0.55, sh = d.h * 0.55;
  // copy one: down to the drawer slot, shrinking as it is filed away
  var aW = sw + (d.w * 0.30 - sw) * slide;
  var aH = sh + (d.h * 0.30 - sh) * slide;
  var ax = d.x + (dr.x + dr.w * 0.5 - aW / 2 - d.x) * slide;
  var ay = d.y + (dr.y - aH * 0.30 - d.y) * slide;
  drawMiniDoc(ax, ay, aW, aH, sc, 1 - 0.55 * slide);
  // copy two: toward the viewer, growing as it slides into the open
  // desk below the document, coming to rest fully in frame
  var bW = sw + (d.w * 0.80 - sw) * slide;
  var bH = sh + (d.h * 0.80 - sh) * slide;
  var bx = d.x + (W * 0.60 - bW / 2 - d.x) * slide;
  var by = d.y + (H * 0.47 - d.y) * slide;
  drawMiniDoc(bx, by, bW, bH, sc, 1);
  // after the slides, both copies rest in place until the phase ends
}

function drawMiniDoc(x, y, w, h, sc, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = COL.paper;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = COL.ink;
  ctx.globalAlpha = alpha * 0.35;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.restore();
  var fs = Math.max(8, w * 0.072);
  var font = fs + 'px "Courier New", monospace';
  var lines = wrapText(sc.lie, w * 0.82, font);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = font;
  ctx.fillStyle = COL.ink;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  for (var i = 0; i < lines.length && i < 3; i++) {
    ctx.fillText(lines[i], x + w * 0.09, y + h * 0.16 + fs * 1.5 * i + fs);
  }
  ctx.restore();
  drawTrueStamp(x + w * 0.52, y + h * 0.68, Math.max(0.18, w * 0.0011), alpha * 0.88);
}

function drawFlipSheet(L) {
  if (flipIndex < 0 || archive.length === 0) return;
  var lie = archive[Math.min(flipIndex, archive.length - 1)];
  var w = Math.min(W * 0.72, L.u * 0.78), h = w * 0.66;
  var x = (W - w) / 2, y = (H - h) / 2;
  ctx.fillStyle = COL.ink;
  ctx.globalAlpha = 0.45;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.fillStyle = COL.paper;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = COL.ink;
  ctx.globalAlpha = 0.4;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.globalAlpha = 1;
  var fs = Math.max(14, w * 0.062);
  var font = fs + 'px "Courier New", monospace';
  var lines = wrapText(lie, w * 0.82, font);
  ctx.font = font;
  ctx.fillStyle = COL.ink;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  for (var i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], x + w * 0.09, y + h * 0.18 + fs * 1.5 * i + fs);
  }
  drawTrueStamp(x + w * 0.52, y + h * 0.68, Math.max(0.5, w * 0.0013), 0.88);
  // position dots: one per filed document, current filled
  var n = archive.length;
  var r = Math.max(2.5, L.u * 0.006);
  var totalW = n * r * 4;
  ctx.fillStyle = COL.ink;
  for (var j = 0; j < n; j++) {
    ctx.globalAlpha = (j === Math.min(flipIndex, n - 1)) ? 0.9 : 0.3;
    ctx.beginPath();
    ctx.arc(x + w / 2 - totalW / 2 + r * 2 + j * r * 4, y + h - r * 3.2, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var sc = computeScene(now);
  var L = layout();
  ctx.save();
  if (sc.shake > 0) {
    var sh = sc.shake * L.u * 0.006;
    ctx.translate(Math.sin(now * 91) * sh, Math.cos(now * 83) * sh * 0.7);
  }
  ctx.fillStyle = COL.felt;
  ctx.fillRect(-L.u * 0.03, -L.u * 0.03, W + L.u * 0.06, H + L.u * 0.06);
  drawDocument(L, sc, now);
  drawDishAndCoin(L, sc);
  drawDrawerAndStack(L, sc);
  if (sc.printP >= 0 && sc.printP < 1) drawPrintCopies(L, sc);
  drawStamp(L, sc);
  ctx.restore();
  if (forcedT < 0) drawFlipSheet(L);
}

// ---------------------------------------------------------------------------
// Input: the taps are the tolls. Order matters and is enforced by the
// state machine; out-of-turn taps do nothing.
// ---------------------------------------------------------------------------
function nowSec() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
}
var clockOrigin = nowSec();
function elapsedNow() { return nowSec() - clockOrigin; }

function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

function onTap(x, y) {
  if (forcedT >= 0) return;
  var L = layout();
  var now = elapsedNow();
  // flip view taps take precedence
  if (flipIndex >= 0) {
    var w = Math.min(W * 0.72, L.u * 0.78), h = w * 0.66;
    var sheet = { x: (W - w) / 2, y: (H - h) / 2, w: w, h: h };
    if (inRect(x, y, sheet)) {
      // walk back toward the oldest filing; past it, the view closes
      flipIndex -= 1;
      if (flipIndex < 0) flipIndex = -1;
    } else {
      flipIndex = -1;
    }
    draw(now);
    return;
  }
  // the stack tap opens the flip view on the newest filing
  var s = stackRect(L);
  var stackHit = { x: s.x - L.u * 0.01, y: s.y - L.u * 0.115, w: s.w + L.u * 0.02, h: s.h + L.u * 0.125 };
  if (archive.length > 0 && inRect(x, y, stackHit)) { flipIndex = archive.length - 1; draw(now); return; }
  switch (machine.state) {
    case 'blank':
      if (inRect(x, y, L.doc)) { machine.state = 'typing'; machine.t0 = now; }
      break;
    case 'typed': {
      var hv = L.stampHover;
      var dx = x - hv.x, dy = y - hv.y;
      var rr = L.u * 0.20;
      // generous hit area: the stamp head and its arm zone
      if (dx * dx + dy * dy < rr * rr || inRect(x, y, { x: hv.x - L.u * 0.10, y: 0, w: L.u * 0.20, h: hv.y + L.u * 0.05 })) {
        machine.state = 'slamming'; machine.t0 = now;
      }
      break;
    }
    case 'plated': {
      var d = L.dish;
      if (inRect(x, y, { x: d.x - d.rx, y: d.y - L.coinR * 1.6, w: d.rx * 2, h: d.ry + L.coinR * 1.8 })) {
        machine.state = 'printing'; machine.t0 = now;
      }
      break;
    }
  }
  draw(now);
}

function resize() {
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = vw; H = vh;
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  draw(elapsedNow());
}

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (window.addEventListener) window.addEventListener('resize', resize);

if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    var x = (e && typeof e.clientX === 'number') ? e.clientX : 0;
    var y = (e && typeof e.clientY === 'number') ? e.clientY : 0;
    onTap(x, y);
  });
}

// Frame one: synchronous draw of the blank desk at t=0 (deterministic;
// never derived from the live clock beyond the recorded origin).
resize();
draw(0);

if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    draw(forcedT >= 0 ? 0 : elapsedNow());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
