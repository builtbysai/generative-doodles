<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.328 Moonbeams</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1A1712; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.328 Moonbeams (meohmy_graphics).
// A dark field of scallop tiles on ink black, reusing the
// scallop geometry of No.321 Scallop Field: 8 columns by 6
// rows, exactly 48 tiles. Every tile holds exactly one cream
// moon with radiating gold and amber beams. Per tile the
// orientation is 0 or 180 degrees. The piece carries 4
// pre-authored orientation fields: alternating checkerboard
// (the default, because she could not choose), all aligned,
// column stripes and row stripes. No runtime random reseed
// exists anywhere. Idle is a 24s seamless loop: the beams
// sway slowly within their tiles, out of phase tile to tile
// like candlelight, and flicker gently in length on three
// whole cycles per loop, so frame 24s is identical to
// frame 0. A single tap flips only its own tile between
// aligned and alternating orientation with a soft settle,
// resolving after a 350ms window closes. A second tap
// inside that window is a double-tap: the pending flip is
// discarded and the field advances to the next authored
// field instead, so the two gestures never collide. All
// marks are data drawn each frame on one canvas.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var INK = '#1A1712', CREAM = '#EDE4CC', GOLD = '#D9A441', AMBER = '#E0A83E', GREEN = '#2E4038';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 24;
var T = 7.3, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }

// ---- field: exactly 48 tiles, exactly 1 moon per tile --------
var COLS = 8, ROWS = 6;
var TILES = [];
(function () {
  var r = rng(32801);
  var cw = DW / COLS, ch = DH / ROWS;
  for (var row = 0; row < ROWS; row++) {
    for (var col = 0; col < COLS; col++) {
      TILES.push({
        col: col, row: row,
        x: col * cw + cw / 2, y: row * ch + ch / 2,
        w: cw, h: ch,
        moons: 1,
        scale: 0.92 + r() * 0.14,
        phase: r() * Math.PI * 2,
        phase2: r() * Math.PI * 2,
        tapFlip: 0,
        dispFrom: 0, dispTo: 0, flipT0: -10
      });
    }
  }
})();
if (TILES.length !== 48) throw new Error('Moonbeams needs exactly 48 tiles');
(function () {
  var totalMoons = 0, i;
  for (i = 0; i < TILES.length; i++) {
    if (TILES[i].moons !== 1) throw new Error('Moonbeams needs exactly 1 moon per tile');
    totalMoons += TILES[i].moons;
  }
  if (totalMoons !== 48) throw new Error('Moonbeams moon count mismatch');
})();

// ---- 4 pre-authored orientation fields -----------------------
// Each field is 48 entries of 0 (aligned, 0 degrees) or 1
// (turned, 180 degrees), in the same row-major order as
// TILES. Field 0 is the default alternating checkerboard.
// Field 1 is all aligned. Field 2 alternates by column.
// Field 3 alternates by row. Nothing is authored at runtime.
var FIELDS = [];
(function () {
  var alt = [], aligned = [], cols = [], rows = [];
  var col, row, v;
  for (row = 0; row < ROWS; row++) {
    for (col = 0; col < COLS; col++) {
      alt.push((col + row) % 2);
      aligned.push(0);
      cols.push(col % 2);
      rows.push(row % 2);
    }
  }
  FIELDS = [alt, aligned, cols, rows];
})();
if (FIELDS.length !== 4) throw new Error('Moonbeams needs exactly 4 authored fields');
(function () {
  var fi, i, ones;
  var want = [24, 0, 24, 24];
  for (fi = 0; fi < FIELDS.length; fi++) {
    if (FIELDS[fi].length !== 48) throw new Error('Moonbeams field needs exactly 48 entries');
    ones = 0;
    for (i = 0; i < 48; i++) {
      if (FIELDS[fi][i] !== 0 && FIELDS[fi][i] !== 1) throw new Error('Moonbeams orientation must be 0 or 1');
      ones += FIELDS[fi][i];
    }
    if (ones !== want[fi]) throw new Error('Moonbeams field mix mismatch');
  }
})();
var fieldIdx = 0;
(function () {
  var i;
  for (i = 0; i < TILES.length; i++) {
    TILES[i].dispFrom = FIELDS[0][i] * 180;
    TILES[i].dispTo = FIELDS[0][i] * 180;
  }
})();

function targetAngle(tile, idx) {
  return (FIELDS[fieldIdx][idx] + tile.tapFlip) % 2 * 180;
}
function dispAngle(tile, t) {
  var p = (t - tile.flipT0) / 0.65;
  if (p >= 1) return tile.dispTo;
  if (p <= 0) return tile.dispFrom;
  var e = 1 - Math.pow(1 - p, 3);
  e = e * (0.94 + 0.06 * Math.sin(p * Math.PI));
  return tile.dispFrom + (tile.dispTo - tile.dispFrom) * e;
}
function startTurn(tile, idx, t) {
  var cur = dispAngle(tile, t);
  var want = targetAngle(tile, idx);
  var delta = ((want - ((cur % 360) + 360) % 360) % 360 + 360) % 360;
  if (delta === 0) { tile.dispFrom = cur; tile.dispTo = cur; tile.flipT0 = -10; return; }
  tile.dispFrom = cur;
  tile.dispTo = cur + delta;
  tile.flipT0 = t;
}
function advanceField() {
  fieldIdx = (fieldIdx + 1) % FIELDS.length;
  var i;
  for (i = 0; i < TILES.length; i++) startTurn(TILES[i], i, T);
}

// Scalloped disc, shared with No.321: a tile whose edge is
// sampled polar data, radius modulated around the rim.
function scallopPath(R, bumps, amp) {
  var i, steps = 96, a, rr, x, y;
  ctx.beginPath();
  for (i = 0; i <= steps; i++) {
    a = i / steps * Math.PI * 2;
    rr = R + amp * Math.cos(bumps * a);
    x = Math.cos(a) * rr; y = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawBeams(tile) {
  // Eight radiating tapered beams, drawn as narrow filled
  // triangles from just outside the moon to near the tile
  // rim. Beam 0, pointing up in local space, is the long
  // wide principal beam in amber; the rest alternate gold
  // and amber at two shorter lengths. The single principal
  // beam is what makes a 180 degree turn visible.
  var flick = 1 + 0.07 * Math.sin(Math.PI * 2 * 3 * T / LOOP + tile.phase2);
  var k, a, r0, r1, hw, ca, sa, px, py;
  for (k = 0; k < 8; k++) {
    a = k / 8 * Math.PI * 2 - Math.PI / 2;
    ca = Math.cos(a); sa = Math.sin(a);
    px = -sa; py = ca;
    if (k === 0) { r1 = 55 * flick; hw = 5.2; ctx.fillStyle = AMBER; }
    else if (k % 2 === 0) { r1 = 49 * flick; hw = 3.4; ctx.fillStyle = GOLD; }
    else { r1 = 43 * flick; hw = 3.0; ctx.fillStyle = k % 4 === 1 ? GOLD : AMBER; }
    r0 = 25;
    ctx.beginPath();
    ctx.moveTo(ca * r0 + px * hw, sa * r0 + py * hw);
    ctx.lineTo(ca * r0 - px * hw, sa * r0 - py * hw);
    ctx.lineTo(ca * r1, sa * r1);
    ctx.closePath();
    ctx.fill();
  }
}
function drawMoon() {
  // Cream moon: a filled circle plus crater arcs clustered
  // to the upper right, so the facing of the moon reads at
  // a glance and a 180 degree flip moves the cluster to
  // the lower left.
  ctx.fillStyle = CREAM;
  circ(0, 0, 23, true);
  st(GREEN, 1.9);
  circ(7.5, -6.5, 5.2, false);
  circ(12.5, 2.5, 3.4, false);
  circ(-2.5, -11.5, 3.0, false);
  ctx.beginPath();
  ctx.arc(3.5, 9.5, 4.6, Math.PI * 0.15, Math.PI * 1.05);
  ctx.stroke();
  ctx.fillStyle = GOLD;
  circ(7.5, -6.5, 1.7, true);
}

function draw() {
  ctx.fillStyle = INK;
  ctx.fillRect(0, 0, DW, DH);
  var i, tile, sway, orient;
  for (i = 0; i < TILES.length; i++) {
    tile = TILES[i];
    sway = 13 * Math.sin(Math.PI * 2 * T / LOOP + tile.phase);
    orient = dispAngle(tile, T);
    ctx.save();
    ctx.translate(tile.x, tile.y);
    ctx.scale(tile.scale, tile.scale);
    // Main scallop tile in deep green with an ink edge.
    ctx.fillStyle = GREEN;
    scallopPath(66, 12, 5); ctx.fill();
    st(INK, 2.4);
    scallopPath(66, 12, 5); ctx.stroke();
    // Inner ring line in candle amber.
    st(AMBER, 1.7);
    scallopPath(57, 12, 4); ctx.stroke();
    // Moon and beams turn together: the authored field
    // orientation plus any tap flip, settled, plus the
    // slow candlelight sway for this tile.
    ctx.save();
    ctx.rotate((orient + sway) * Math.PI / 180);
    drawBeams(tile);
    drawMoon();
    ctx.restore();
    ctx.restore();
  }
}

// ---- interaction: tap a tile, double-tap for next field ------
// Single taps resolve only after the 350ms window closes.
// A second tap inside the window is a double-tap: the
// pending flip is discarded and the orientation field
// advances instead, so the two gestures never collide.
var tap = null;
var pending = null, pendingTimer = null;
function nowMs() {
  if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') return performance.now();
  return Date.now();
}
function flipTileAt(p) {
  var col = Math.floor(p[0] / (DW / COLS));
  var row = Math.floor(p[1] / (DH / ROWS));
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
  var idx = row * COLS + col;
  var tile = TILES[idx];
  tile.tapFlip = tile.tapFlip === 0 ? 1 : 0;
  startTurn(tile, idx, T);
}
function clearPending() {
  if (pendingTimer !== null && typeof clearTimeout === 'function') clearTimeout(pendingTimer);
  pendingTimer = null; pending = null;
}
function onTapPoint(p) {
  var n = nowMs();
  if (pending && n - pending.at <= 350) {
    clearPending();
    advanceField();
    return;
  }
  if (pending) { var old = pending.p; clearPending(); flipTileAt(old); }
  pending = { p: p, at: n };
  if (typeof setTimeout === 'function') {
    pendingTimer = setTimeout(function () {
      if (pending) { var pp = pending.p; pending = null; pendingTimer = null; flipTileAt(pp); }
    }, 350);
  } else {
    var pp2 = pending.p; pending = null; flipTileAt(pp2);
  }
}
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  tap = { x: p[0], y: p[1], sx: p[0], sy: p[1], moved: 0 };
});
canvas.addEventListener('pointermove', function (e) {
  if (!tap) return;
  var p = toDesign(e);
  tap.moved = Math.max(tap.moved, Math.abs(p[0] - tap.sx), Math.abs(p[1] - tap.sy));
});
canvas.addEventListener('pointerup', function (e) {
  if (tap && tap.moved < 9) onTapPoint(toDesign(e));
  tap = null;
});
canvas.addEventListener('pointercancel', function () { tap = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = INK;
  ctx.fillRect(0, 0, W, H);
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
