<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.438 Five Women, One Pink Ground</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F6C9D4; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.438 Five Women, One Pink Ground
// (angelina_bambina_dsgn, EXPANSION #47, prompt ANG6).
// Her inclusive semicircle portraits: five women of
// varied ethnicities in a half-ring on a soft-pink
// flowered ground, each in ONE distinct patterned
// garment - yellow headscarf with an orange-green
// patterned top; black bob with a blue polka-dot
// shirt; glasses with a black top carrying pink
// florals; red hair with a flower crown and a
// light-blue oval-pattern top; black beret with a
// pink dotted top and a beaded necklace. Faces vary
// per woman (jaw, eyes, hair), dignified, never
// identical. The source piece's Women's Day cursive
// is EXCLUDED: no text of any kind anywhere.
// WATCH-ONLY 66s master loop, the LCM resolution:
// per-woman sway on a 6s period (11 whole cycles,
// per-woman phase offsets), flower-crown petal
// flutter on a 3s period (22 whole cycles), and one
// beaded-necklace swing event every 11s (6 per loop).
// TAP rotates the arc by exactly one position: each
// woman's authored pattern, skin, hair and accessory
// rotate WITH her, and five taps return the ring to
// frame one's order. Frame one is drawn synchronously
// at the constant phase T = 12.4s - mid-sway, the
// necklace mid-swing, the yellow-headscarf woman
// centred-forward. The clock is anchored there and
// advances in fixed 1/60 ticks, never from a wall
// clock. Flat colour only, one canvas, no offscreen
// canvas, no gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette (closed) -----------------------------------
// The specced hexes and nothing else. The red hair of
// the crown woman resolves to the set's only red-family
// hex, the floral pink #F06A8A; her freckles take the
// authored skin tone #C97B4A. Documented in process.md.
var GROUND = '#F6C9D4';   // soft-pink ground, page ground
var FPINK = '#F06A8A';    // floral pink, red hair, lips
var FORANGE = '#F5A623';  // floral orange, pattern, beads
var FBLUE = '#4A7AB5';     // floral blue, polka shirt, beads
var FGREEN = '#4E7A3A';    // floral green, leaves, pattern
var YELLOW = '#F2C230';   // headscarf, flower centres
var BLACK = '#2A2A2A';     // hair, black tops, glasses
var LBLUE = '#A8CBE8';     // oval top, polka dots
var SKINS = ['#E8A87C', '#8A4B2E', '#F5D7B8', '#C97B4A', '#F0C8A0'];

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 66;
if (LOOP !== 66) throw new Error('Five Women loop must be 66s');
if (LOOP / 6 !== 11 || LOOP / 3 !== 22 || LOOP / 11 !== 6)
  throw new Error('sway, flutter and necklace cadences must divide the loop');
var TICK = 1 / 60;
var T0 = 12.4;
var T = T0;

// ---- the arc slots --------------------------------------
// Five authored slots on a semicircle: x, y = the bust's
// bottom centre, s = scale. The centre slot sits lowest
// and largest (centred-forward); the sides step up and
// shrink. Draw order runs sides first, centre last.
var SLOTS = [
  { x: 188,  y: 742, s: 0.90 },
  { x: 408,  y: 816, s: 1.00 },
  { x: 640,  y: 862, s: 1.15 },
  { x: 872,  y: 816, s: 1.00 },
  { x: 1092, y: 742, s: 0.90 }
];
if (SLOTS.length !== 5) throw new Error('the ring must hold exactly 5 slots');
var DRAW_SEQ = [0, 4, 1, 3, 2];

// ---- the five women -------------------------------------
// Authored identities. kind drives hair/accessory and
// garment pattern modules; jaw and eyes vary per woman;
// ph = her sway phase offset (the only sway difference).
// ORDER lists which woman sits in slots 0..4 in frame
// one: the headscarf woman (0) centred-forward.
var WOMEN = [
  { kind: 'scarf',   skin: SKINS[3], jaw: 'wide',   eyes: 'closed', ph: 0.0 },
  { kind: 'bob',     skin: SKINS[2], jaw: 'narrow', eyes: 'dots',   ph: 1.3 },
  { kind: 'glasses', skin: SKINS[1], jaw: 'oval',   eyes: 'dots',   ph: 2.6 },
  { kind: 'crown',   skin: SKINS[4], jaw: 'heart',  eyes: 'lashes', ph: 3.9 },
  { kind: 'beret',   skin: SKINS[0], jaw: 'square', eyes: 'dots',   ph: 5.2 }
];
if (WOMEN.length !== 5) throw new Error('exactly 5 women');
var ORDER = [3, 1, 0, 2, 4];
if (ORDER.length !== 5 || ORDER[2] !== 0)
  throw new Error('frame one must centre the headscarf woman');
function posInOrder(w) { return ORDER.indexOf(w); }
function slotOf(w, r) {
  var s = (posInOrder(w) - r) % 5;
  return s < 0 ? s + 5 : s;
}

// ---- the ground flowers ---------------------------------
// Fixed authored table scattered behind the ring:
// x, y, s = size, c = petal colour, leaf = draw a green
// leaf pair under the bloom. Nothing blooms in the
// generous pink negative space above the ring.
var FLOWERS = [
  { x: 96,   y: 520, s: 17, c: FPINK,   leaf: 1 },
  { x: 150,  y: 640, s: 13, c: FORANGE, leaf: 0 },
  { x: 84,   y: 770, s: 15, c: FBLUE,   leaf: 1 },
  { x: 262,  y: 452, s: 12, c: FORANGE, leaf: 0 },
  { x: 300,  y: 560, s: 16, c: FPINK,   leaf: 1 },
  { x: 246,  y: 700, s: 12, c: FBLUE,   leaf: 0 },
  { x: 330,  y: 812, s: 15, c: FPINK,   leaf: 0 },
  { x: 452,  y: 470, s: 13, c: FBLUE,   leaf: 1 },
  { x: 500,  y: 596, s: 11, c: FORANGE, leaf: 0 },
  { x: 428,  y: 700, s: 14, c: FPINK,   leaf: 0 },
  { x: 560,  y: 452, s: 12, c: FPINK,   leaf: 0 },
  { x: 596,  y: 560, s: 10, c: FBLUE,   leaf: 1 },
  { x: 700,  y: 470, s: 13, c: FORANGE, leaf: 0 },
  { x: 668,  y: 612, s: 11, c: FPINK,   leaf: 0 },
  { x: 776,  y: 500, s: 12, c: FBLUE,   leaf: 1 },
  { x: 812,  y: 640, s: 14, c: FORANGE, leaf: 0 },
  { x: 884,  y: 452, s: 11, c: FPINK,   leaf: 0 },
  { x: 946,  y: 580, s: 15, c: FBLUE,   leaf: 1 },
  { x: 990,  y: 716, s: 12, c: FORANGE, leaf: 0 },
  { x: 1064, y: 486, s: 16, c: FPINK,   leaf: 0 },
  { x: 1130, y: 612, s: 13, c: FBLUE,   leaf: 1 },
  { x: 1184, y: 736, s: 15, c: FORANGE, leaf: 0 },
  { x: 540,  y: 836, s: 13, c: FBLUE,   leaf: 0 },
  { x: 742,  y: 842, s: 12, c: FPINK,   leaf: 1 },
  { x: 356,  y: 872, s: 11, c: FORANGE, leaf: 0 },
  { x: 936,  y: 868, s: 11, c: FBLUE,   leaf: 0 }
];
if (FLOWERS.length !== 26) throw new Error('ground flower table must hold exactly 26 blooms');

// The necklace: exactly 9 beads in a fixed colour cycle.
var BEADS = [FORANGE, FPINK, FBLUE, FORANGE, FPINK, FBLUE, FORANGE, FPINK, FBLUE];
if (BEADS.length !== 9) throw new Error('the necklace must hold exactly 9 beads');

// ---- state ----------------------------------------------
var rot = 0;                 // arc rotation, 0..4
var transTick = -1;          // -1 = settled; else ticks into the rotation
var TRANS_TICKS = 39;        // 0.65s of piece time
var fromPos = null;          // per-woman slot params at transition start
var lastNow = -1, acc = 0;

// QA hook via the renderer's query string (?seed=N):
// seed=N starts the piece settled at rotation N.
// Default play is unaffected.
var QS = (typeof location !== 'undefined' && location.search) || '';
var sm = QS.match(/seed=(\d)/);
if (sm) rot = clampInt(parseInt(sm[1], 10), 0, 4);
function clampInt(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---- small helpers --------------------------------------
function frac(v) { return v - Math.floor(v); }
function ell(x, y, rx, ry, rot, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function circ(x, y, r, col) { ell(x, y, r, r, 0, col); }
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function rr(x, y, w, h, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath(); ctx.fill();
}
function seg(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function arcStroke(x, y, r, a0, a1, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke();
}
function smooth(u) { return u * u * (3 - 2 * u); }

// ---- motion curves --------------------------------------
// Sway: gentle 2-degree rock on the 6s period, her own
// phase the only difference between women.
function swayAngle(w, lt) {
  return 0.0349 * Math.sin(Math.PI * 2 * (lt / 6) + WOMEN[w].ph);
}
// The necklace swing: ONE event every 11s - two
// oscillations under a decaying envelope, zero at each
// slot boundary, so frame one at T = 12.4s (1.4s into a
// slot) catches it mid-swing at about 13px.
function necklaceSwing(lt) {
  var p = frac(lt / 11);
  return 16 * Math.sin(Math.PI * 4 * p) * Math.pow(1 - p, 1.5);
}
// Crown petal flutter on the 3s period.
function flutter(lt, i) {
  return Math.sin(Math.PI * 2 * (lt / 3) + i * 0.9);
}

// ---- the ground -----------------------------------------
function drawFlower(x, y, s, col, leaf) {
  var i, a;
  if (leaf) {
    ell(x - s * 0.8, y + s * 0.55, s * 0.62, s * 0.3, 0.6, FGREEN);
    ell(x + s * 0.8, y + s * 55 / 100, s * 0.62, s * 0.3, -0.6, FGREEN);
  }
  for (i = 0; i < 5; i++) {
    a = i / 5 * Math.PI * 2 - Math.PI / 2;
    ell(x + Math.cos(a) * s * 0.58, y + Math.sin(a) * s * 0.58, s * 0.5, s * 0.32, a, col);
  }
  circ(x, y, s * 0.34, col === FORANGE ? FPINK : YELLOW);
}
function drawGround() {
  var i;
  for (i = 0; i < FLOWERS.length; i++) {
    var f = FLOWERS[i];
    drawFlower(f.x, f.y, f.s, f.c, f.leaf);
  }
}

// ---- a bust ----------------------------------------------
// Local space: origin at the bust's bottom centre, up
// is negative y. Torso to -198, neck above it, head
// centred at (0, -272).
function torsoPath() {
  ctx.beginPath();
  ctx.moveTo(-96, 0);
  ctx.quadraticCurveTo(-92, -80, -84, -168);
  ctx.quadraticCurveTo(-70, -196, -30, -198);
  ctx.lineTo(30, -198);
  ctx.quadraticCurveTo(70, -196, 84, -168);
  ctx.quadraticCurveTo(92, -80, 96, 0);
  ctx.closePath();
}
function drawPattern(w) {
  // Drawn inside the torso clip; base rect first.
  var i, j;
  if (w.kind === 'scarf') {
    rect(-100, -202, 200, 206, FORANGE);
    for (j = 0; j < 5; j++) for (i = 0; i < 5; i++) {
      var dx = -92 + i * 46 + (j % 2) * 23, dy = -184 + j * 44;
      ctx.save(); ctx.translate(dx, dy); ctx.rotate(Math.PI / 4);
      rect(-9, -9, 18, 18, FGREEN);
      ctx.restore();
    }
  } else if (w.kind === 'bob') {
    rect(-100, -202, 200, 206, FBLUE);
    for (j = 0; j < 5; j++) for (i = 0; i < 6; i++)
      circ(-84 + i * 34 + (j % 2) * 17, -180 + j * 42, 7, LBLUE);
  } else if (w.kind === 'glasses') {
    rect(-100, -202, 200, 206, BLACK);
    var pts = [[-70, -160], [-24, -176], [26, -158], [70, -172], [-48, -112],
               [4, -124], [58, -104], [-78, -64], [-16, -76], [38, -58], [78, -28], [-40, -26]];
    for (i = 0; i < pts.length; i++) {
      drawFlower(pts[i][0], pts[i][1], 10, FPINK, 1);
    }
  } else if (w.kind === 'crown') {
    rect(-100, -202, 200, 206, LBLUE);
    ctx.lineWidth = 5; ctx.strokeStyle = FBLUE;
    for (j = 0; j < 5; j++) for (i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.ellipse(-78 + i * 40 + (j % 2) * 20, -178 + j * 42, 13, 8.5, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  } else { // beret: pink dots on black
    rect(-100, -202, 200, 206, BLACK);
    for (j = 0; j < 5; j++) for (i = 0; i < 6; i++)
      circ(-84 + i * 34 + (j % 2) * 17, -180 + j * 42, 6, GROUND);
  }
}
function drawTorso(w) {
  ctx.save();
  torsoPath(); ctx.clip();
  drawPattern(w);
  ctx.restore();
  // Neckline V accent in her pattern's contrast colour.
  var acc = w.kind === 'bob' ? LBLUE : (w.kind === 'crown' ? FBLUE : (w.kind === 'scarf' ? FGREEN : FPINK));
  ctx.strokeStyle = acc; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-26, -196); ctx.lineTo(0, -176); ctx.lineTo(26, -196); ctx.stroke();
}
function drawFace(w) {
  // Jaw variants: the face silhouette itself differs.
  if (w.jaw === 'wide') ell(0, -272, 56, 62, 0, w.skin);
  else if (w.jaw === 'narrow') ell(0, -270, 46, 63, 0, w.skin);
  else if (w.jaw === 'oval') ell(0, -272, 51, 59, 0, w.skin);
  else if (w.jaw === 'heart') { ell(0, -276, 54, 56, 0, w.skin); ell(0, -226, 22, 16, 0, w.skin); }
  else rr(-50, -334, 100, 118, 30, w.skin); // square
  // Eyes.
  if (w.eyes === 'closed') {
    arcStroke(-22, -274, 8, Math.PI * 1.12, Math.PI * 1.88, 4, BLACK);
    arcStroke(22, -274, 8, Math.PI * 1.12, Math.PI * 1.88, 4, BLACK);
    arcStroke(-22, -292, 9, Math.PI * 1.15, Math.PI * 1.85, 3.5, BLACK);
    arcStroke(22, -292, 9, Math.PI * 1.15, Math.PI * 1.85, 3.5, BLACK);
  } else {
    circ(-20, -274, 4.2, BLACK);
    circ(20, -274, 4.2, BLACK);
    if (w.eyes === 'lashes' || w.kind === 'bob') {
      seg(-27, -282, -31, -287, 2.6, BLACK); seg(-14, -283, -15, -289, 2.6, BLACK);
      seg(27, -282, 31, -287, 2.6, BLACK); seg(14, -283, 15, -289, 2.6, BLACK);
    }
    var bw = w.kind === 'beret' ? 5.5 : 3.5;
    arcStroke(-20, -291, 10, Math.PI * 1.18, Math.PI * 1.82, bw, BLACK);
    arcStroke(20, -291, 10, Math.PI * 1.18, Math.PI * 1.82, bw, BLACK);
  }
  // Nose: a small mark, placed per woman.
  if (w.kind === 'bob') circ(1, -256, 2.2, BLACK);
  else if (w.kind !== 'scarf') seg(-1, -262, 2, -254, 2.6, BLACK);
  // Mouth: a calm smile; the bob woman wears pink lips.
  if (w.kind === 'bob') { ell(0, -238, 7.5, 4.2, 0, FPINK); }
  else arcStroke(0, -246, w.kind === 'beret' ? 12 : 9, Math.PI * 0.15, Math.PI * 0.85, 3.5, BLACK);
  // Freckles for the crown woman, in an authored skin tone.
  if (w.kind === 'crown') {
    var fr = [[-30, -252], [-20, -248], [-34, -244], [30, -252], [20, -248], [34, -244], [0, -250]];
    for (var i = 0; i < fr.length; i++) circ(fr[i][0], fr[i][1], 2, SKINS[3]);
  }
  // Blush ticks for the scarf woman.
  if (w.kind === 'scarf') { ell(-36, -248, 6, 3.6, 0, FPINK); ell(36, -248, 6, 3.6, 0, FPINK); }
}
function drawHairBack(w) {
  if (w.kind === 'bob') {
    rr(-60, -350, 120, 152, 48, BLACK);
  } else if (w.kind === 'glasses') {
    var puffs = [[0, -344, 26], [-28, -330, 22], [28, -330, 22], [-48, -306, 18],
                 [48, -306, 18], [-14, -352, 20], [16, -350, 19]];
    for (var i = 0; i < puffs.length; i++) circ(puffs[i][0], puffs[i][1], puffs[i][2], BLACK);
  } else if (w.kind === 'crown') {
    ell(0, -268, 63, 80, 0, FPINK);
    ell(-54, -214, 15, 36, 0.1, FPINK);
    ell(54, -214, 15, 36, -0.1, FPINK);
  } else if (w.kind === 'beret') {
    ell(-51, -222, 15, 42, 0.08, BLACK);
    ell(51, -222, 15, 42, -0.08, BLACK);
  }
}
function drawHairFront(w, lt) {
  var i, a, x, y;
  if (w.kind === 'scarf') {
    // The headscarf: side flaps framing the face, a
    // dome over the top of the head whose front edge
    // rides the forehead so the face stays open, a
    // dark fringe line along that edge, and the knot
    // tied under the chin with two tails on the chest.
    ctx.save(); ctx.translate(-60, -288); ctx.rotate(0.06);
    rr(-9, 0, 18, 92, 8, YELLOW); ctx.restore();
    ctx.save(); ctx.translate(60, -288); ctx.rotate(-0.06);
    rr(-9, 0, 18, 92, 8, YELLOW); ctx.restore();
    ctx.fillStyle = YELLOW;
    ctx.beginPath();
    ctx.moveTo(-63, -288);
    ctx.quadraticCurveTo(-65, -354, 0, -358);
    ctx.quadraticCurveTo(65, -354, 63, -288);
    ctx.quadraticCurveTo(0, -280, -63, -288);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = BLACK; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-57, -290); ctx.quadraticCurveTo(0, -282, 57, -290);
    ctx.stroke();
    ctx.save(); ctx.translate(-13, -200); ctx.rotate(0.14);
    rr(-8, 0, 16, 54, 7, YELLOW); ctx.restore();
    ctx.save(); ctx.translate(13, -200); ctx.rotate(-0.12);
    rr(-8, 0, 16, 48, 7, YELLOW); ctx.restore();
    circ(0, -202, 11, YELLOW);
    ctx.save(); ctx.translate(0, -202); ctx.rotate(Math.PI / 4);
    rect(-4.5, -4.5, 9, 9, FGREEN); ctx.restore();
  } else if (w.kind === 'bob') {
    // Straight fringe across the forehead, merging
    // into the bob drawn behind the face.
    ctx.fillStyle = BLACK;
    ctx.beginPath();
    ctx.moveTo(-47, -288);
    ctx.quadraticCurveTo(0, -302, 47, -288);
    ctx.lineTo(47, -350); ctx.lineTo(-47, -350);
    ctx.closePath(); ctx.fill();
  } else if (w.kind === 'crown') {
    // The flower crown: seven small blooms on an arc,
    // green leaves between them, petals fluttering on
    // the 3s period.
    for (i = 0; i < 7; i++) {
      a = Math.PI * (1.08 + 0.14 * i); // over the top of the head
      x = Math.cos(a) * 50; y = -300 + Math.sin(a) * 34;
      if (i % 2 === 0) ell(x + 8, y + 6, 8, 4, 0.7, FGREEN);
      var sc = 1 + 0.16 * flutter(lt, i);
      ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
      ctx.rotate(0.06 * flutter(lt, i + 3));
      var cols = [FORANGE, FPINK, FBLUE];
      drawFlower(0, 0, 9, cols[i % 3], 0);
      ctx.restore();
    }
  } else if (w.kind === 'beret') {
    // The beret: a tilted disc with a stem, worn over
    // the side hair.
    ctx.save(); ctx.translate(-6, -336); ctx.rotate(-0.12);
    ell(0, 0, 57, 20, 0, BLACK);
    ell(0, -6, 44, 15, 0, BLACK);
    ctx.restore();
    circ(-12, -356, 5, BLACK);
  }
}
function drawGlasses() {
  ctx.strokeStyle = BLACK; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(-22, -272, 21, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(22, -272, 21, 0, Math.PI * 2); ctx.stroke();
  seg(-1, -276, 1, -276, 5, BLACK);
  seg(-43, -276, -54, -280, 5, BLACK);
  seg(43, -276, 54, -280, 5, BLACK);
}
function drawNecklace(lt) {
  // Beads on a quadratic string from the neckline; the
  // control point rides the 11s swing.
  var sw = necklaceSwing(lt);
  var x0 = -30, y0 = -178, x1 = 30, y1 = -178, cxp = sw, cyp = -104;
  var i, t, mt, x, y;
  ctx.strokeStyle = BLACK; ctx.lineWidth = 2;
  ctx.beginPath();
  for (i = 0; i <= 20; i++) {
    t = i / 20; mt = 1 - t;
    x = mt * mt * x0 + 2 * mt * t * cxp + t * t * x1;
    y = mt * mt * y0 + 2 * mt * t * cyp + t * t * y1;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  for (i = 0; i < 9; i++) {
    t = (i + 0.5) / 9; mt = 1 - t;
    x = mt * mt * x0 + 2 * mt * t * cxp + t * t * x1;
    y = mt * mt * y0 + 2 * mt * t * cyp + t * t * y1;
    circ(x, y, 5.5, BEADS[i]);
  }
}
function drawBust(w, lt) {
  drawHairBack(w);
  rect(-15, -234, 30, 46, w.skin);            // neck
  drawTorso(w);
  drawFace(w);
  drawHairFront(w, lt);
  if (w.kind === 'glasses') drawGlasses();
  if (w.kind === 'beret') drawNecklace(lt);
}

// ---- ring geometry ---------------------------------------
// A woman's current slot params: her authored slot, or
// an interpolation across the rotation transition.
function currentPos(w) {
  var target = SLOTS[slotOf(w, rot)];
  if (transTick < 0 || !fromPos) return target;
  var u = smooth(Math.min(1, transTick / TRANS_TICKS));
  var f = fromPos[w];
  return {
    x: f.x + (target.x - f.x) * u,
    y: f.y + (target.y - f.y) * u,
    s: f.s + (target.s - f.s) * u
  };
}
function slotOfWomanNow(w) { return slotOf(w, rot); }

// ---- draw --------------------------------------------------
function draw() {
  var lt = T % LOOP;
  rect(-2400, -2400, DW + 4800, DH + 4800, GROUND);
  drawGround();
  var d, w, p;
  for (d = 0; d < DRAW_SEQ.length; d++) {
    // Find the woman whose target slot is DRAW_SEQ[d].
    for (w = 0; w < 5; w++) if (slotOfWomanNow(w) === DRAW_SEQ[d]) break;
    p = currentPos(w);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(swayAngle(w, lt));
    ctx.scale(p.s, p.s);
    drawBust(WOMEN[w], lt);
    ctx.restore();
  }
}

// ---- step ----------------------------------------------------
// Only the rotation transition has state; it advances
// on fixed ticks and lands exactly on the authored
// slot params.
function step() {
  if (transTick >= 0) {
    transTick++;
    if (transTick >= TRANS_TICKS) { transTick = -1; fromPos = null; }
  }
}

// ---- pointer: tap rotates the ring by one position ------------
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function () {
  var snap = [], w;
  for (w = 0; w < 5; w++) snap[w] = currentPos(w);
  fromPos = snap;
  rot = (rot + 1) % 5;
  transTick = 0;
});

// ---- sizing: centred fit, page ground in the ground pink ------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
