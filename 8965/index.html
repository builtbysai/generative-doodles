<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8470;8965 &middot; Mark the Seam</title>
<style>
  :root{ --paper:#f4eedd; --ink:#2e2a24; --ink-soft:#71665a; --brass:#a5762a; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--paper)}
  body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);
       -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
  #plate{position:absolute;top:14px;left:18px;pointer-events:none;user-select:none;
    font-size:13px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
  #plate b{color:var(--ink);font-weight:700}
  #foot{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:none;user-select:none;
    font-size:12px;letter-spacing:.1em;color:var(--ink-soft);text-align:center;white-space:nowrap}
  #foot b{color:var(--brass)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="plate"><b>&#8470;8965</b> &middot; Mark the Seam</div>
  <div id="foot">twelve pure fifths do not close &middot; <b>the comma is kept here</b></div>
</div>
<script>
"use strict";
/* Seed 265 "Mark the Seam": eleven near-pure fifths and one diminished
   fifth eating the whole Pythagorean comma. Twelve kite tiles are stacked
   by pure fifths around a center; the twelfth step overshoots the start by
   23.46 cents (7.04 degrees). Instead of smearing the error, the piece
   concentrates it in one brass seam wedge, stamped and named. The seam
   reads as craft, not a bug. */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromURL(){
  const m = /[?&]seed=(\d+)/.exec(location.search);
  return m ? (parseInt(m[1],10) >>> 0) : ((Math.random()*1e9)|0);
}
let SEED = seedFromURL();
let rnd = mulberry32(SEED);

// pure fifth = 701.955 cents; on the circle 1 cent = 0.3 degrees
const FIFTH_DEG = 701.955 * 0.3;       // 210.5865
const GAP_DEG = 12*FIFTH_DEG - 7*360;  // 7.038: the comma, concentrated
const TILES = 12;

const PALETTES = [
  {a:'#26355e', b:'#a8432a', line:'#f4eedd'},
  {a:'#1f4d3a', b:'#b0762a', line:'#f4eedd'},
  {a:'#4a2440', b:'#2a6d8a', line:'#f4eedd'}
];
let palIdx = 0;

let W=0,H=0,DPR=1, cx=0, cy=0, R=0;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx = W/2; cy = H*0.47;
  R = Math.min(W,H)*0.36;
}
window.addEventListener('resize', resize);

const D2R = Math.PI/180;
function ang(k){ return -90 + k*FIFTH_DEG; }  // degrees, tile k start
function P(aDeg, r){
  const a = aDeg*D2R;
  return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];
}

function kitePath(k, r0, r1, shrink){
  const a0 = ang(k)+shrink, a1 = ang(k+1)-shrink;
  const [x0,y0] = P(a0,r0), [x1,y1] = P(a0,r1);
  const [x2,y2] = P(a1,r1), [x3,y3] = P(a1,r0);
  ctx.beginPath();
  ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3);
  ctx.closePath();
}

function draw(now){
  const t = now/1000;
  ctx.fillStyle = '#f4eedd';
  ctx.fillRect(0,0,W,H);

  const pal = PALETTES[palIdx];
  const breathe = Math.sin(t*0.5)*2.2;   // the wheel breathes, the seam stays honest
  const r0 = R*0.30, r1 = R;

  // faint construction circle
  ctx.strokeStyle = 'rgba(46,42,36,0.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx,cy,r1,0,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,r0,0,7); ctx.stroke();

  // 12 tiles, pure-fifth steps; the 12th overshoots, leaving the gap
  for(let k=0;k<TILES;k++){
    kitePath(k+breathe/57.3*0, r0, r1, 0.55);
    ctx.fillStyle = k%2 ? pal.b : pal.a;
    ctx.fill();
    ctx.strokeStyle = pal.line; ctx.lineWidth = 1.2; ctx.stroke();
    // inner ornament: a thin radial line per tile
    const am = (ang(k)+ang(k+1))/2 * D2R;
    ctx.strokeStyle = 'rgba(244,238,221,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(am)*r0*1.12, cy+Math.sin(am)*r0*1.12);
    ctx.lineTo(cx+Math.cos(am)*r1*0.94, cy+Math.sin(am)*r1*0.94);
    ctx.stroke();
  }

  // THE SEAM: brass wedge filling the 7.04-degree gap, error concentrated
  const seamA0 = ang(12), seamA1 = ang(12)+GAP_DEG;
  const glow = 0.55+0.35*Math.sin(t*1.8);
  ctx.save();
  ctx.shadowColor = 'rgba(165,118,42,0.8)'; ctx.shadowBlur = 18*glow;
  ctx.fillStyle = '#a5762a';
  ctx.beginPath();
  const [sx0,sy0]=P(seamA0,r0), [sx1,sy1]=P(seamA0,r1*1.06);
  const [sx2,sy2]=P(seamA1,r1*1.06), [sx3,sy3]=P(seamA1,r0);
  ctx.moveTo(sx0,sy0); ctx.lineTo(sx1,sy1); ctx.lineTo(sx2,sy2); ctx.lineTo(sx3,sy3);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = '#2e2a24'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(sx0,sy0); ctx.lineTo(sx1,sy1); ctx.lineTo(sx2,sy2); ctx.lineTo(sx3,sy3);
  ctx.closePath(); ctx.stroke();

  // seam callout: the measure engraved along the brass wedge itself
  const midA = (seamA0+seamA1)/2;
  const midR = midA*D2R;
  const er = (r0+r1*1.06)/2;
  ctx.save();
  ctx.translate(cx+Math.cos(midR)*er, cy+Math.sin(midR)*er);
  ctx.rotate(midR+Math.PI/2);
  ctx.fillStyle = '#2e2a24';
  ctx.font = '700 '+Math.max(11,Math.min(15,R*0.05))+'px "Avenir Next","Segoe UI",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('23.46¢', 0, -8);
  ctx.font = '400 '+Math.max(9,Math.min(11,R*0.038))+'px "Avenir Next","Segoe UI",sans-serif';
  ctx.fillStyle = 'rgba(46,42,36,0.75)';
  ctx.fillText('S E A M', 0, 10);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';

  // center stamp
  ctx.fillStyle = '#f4eedd';
  ctx.beginPath(); ctx.arc(cx,cy,r0*0.72,0,7); ctx.fill();
  ctx.strokeStyle = '#2e2a24'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx,cy,r0*0.72,0,7); ctx.stroke();
  ctx.fillStyle = '#2e2a24';
  ctx.font = '600 '+Math.max(11,Math.min(14,r0*0.10))+'px "Avenir Next","Segoe UI",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('XII · V', cx, cy-2);
  ctx.fillStyle = '#71665a';
  ctx.font = '400 '+Math.max(9,Math.min(11,r0*0.08))+'px "Avenir Next","Segoe UI",sans-serif';
  ctx.fillText('fifths', cx, cy+Math.max(12,r0*0.12));

  requestAnimationFrame(draw);
}

canvas.addEventListener('pointerdown', ()=>{
  palIdx = (palIdx+1)%PALETTES.length;
  SEED = (Math.random()*1e9)|0;
  rnd = mulberry32(SEED);
});

resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
