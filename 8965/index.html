<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№ 8965 — Mark the Seam</title>
<!-- phantom-fill-8965 -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #141210;
    color: #e8e0d0;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    overflow: hidden;
  }
  svg#seam {
    position: fixed; inset: 0; margin: auto;
    width: min(100vw, 94vh); height: min(100vw, 94vh);
    display: block;
  }
  header {
    position: fixed; top: 28px; left: 32px; z-index: 2; pointer-events: none;
  }
  header .no {
    font-size: 11px; letter-spacing: .35em; text-transform: uppercase;
    color: #c9a24d; margin-bottom: 8px;
  }
  header h1 {
    font-size: 30px; font-weight: normal; letter-spacing: .02em; color: #f2ead8;
  }
  header .sub {
    margin-top: 8px; font-size: 13px; font-style: italic; color: #9a9081;
    max-width: 320px; line-height: 1.5;
  }
  footer {
    position: fixed; right: 32px; bottom: 24px; z-index: 2;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: #6f675a; pointer-events: none; text-align: right; line-height: 1.9;
  }
  footer b { color: #c9a24d; font-weight: normal; }
  @keyframes wedgeGlow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.82; }
  }
  .wedge { animation: wedgeGlow 4s ease-in-out infinite; }
  @media (max-width: 640px) {
    header { top: 18px; left: 20px; }
    header h1 { font-size: 23px; }
    header .sub { font-size: 12px; max-width: 230px; }
    footer { right: 20px; bottom: 16px; }
  }
</style>
</head>
<body>
<svg id="seam" viewBox="0 0 1000 1000" role="img"
  aria-label="Twelve pure fifths tiled as kites, the Pythagorean comma in one brass wedge."></svg>
<header>
  <div class="no">№ 8965</div>
  <h1>Mark the Seam</h1>
  <div class="sub">Twelve pure fifths tiled as kites overshoot seven octaves
  by 23.46 cents. The whole comma is concentrated into one brass wedge.</div>
</header>
<footer>
  <div>12 &times; 701.955&cent; = <b>8423.46&cent;</b></div>
  <div>7 octaves = 8400&cent; &middot; watch only</div>
</footer>
<script>
(function () {
  'use strict';
  // DRIVER: Twelve pure fifths (3:2) tiled as kites around a circle overshoot
  // seven octaves by the Pythagorean comma, 23.46 cents — and the entire
  // comma is concentrated into one brass wedge at the seam, shown true-scale
  // and magnified 24x below the ring.
  var SVGNS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('seam');

  function el(tag, attrs, parent) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }
  function text(x, y, s, attrs, parent) {
    var t = el('text', attrs || {}, parent);
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.textContent = s;
    return t;
  }
  function pt(cx, cy, r, deg) {
    var a = deg * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }

  // Circle of fifths: note reached after each fifth, cents from C.
  var NOTES = [
    ['C', 0], ['G', 701.96], ['D', 203.91], ['A', 905.87], ['E', 407.82],
    ['B', 1109.78], ['F\u266F', 611.73], ['C\u266F', 113.69], ['G\u266F', 815.64],
    ['D\u266F', 317.60], ['A\u266F', 1019.55], ['F', 521.51]
  ];
  var CX = 500, CY = 430, R1 = 108, RM = 208, R2 = 308;
  // Rotate so the seam kite (the 12th fifth, F -> C') sits at the top.
  var START = -75;

  for (var i = 0; i < 12; i++) {
    var mid = START + (i + 0.5) * 30;
    var a0 = mid - 13.5, a1 = mid + 13.5;
    var seam = (i === 11);
    var rOut = seam ? R2 + 16 : R2;
    var inner = pt(CX, CY, R1, mid);
    var side0 = pt(CX, CY, RM, a0);
    var outer = pt(CX, CY, rOut, mid);
    var side1 = pt(CX, CY, RM, a1);
    var kite = el('polygon', {
      points: [inner, side0, outer, side1].map(function (p) {
        return p[0].toFixed(1) + ',' + p[1].toFixed(1);
      }).join(' '),
      fill: seam ? '#c9a24d' : '#e8e0d0',
      stroke: '#141210', 'stroke-width': 2,
      'class': seam ? 'wedge' : ''
    });
    kite.setAttribute('fill-opacity', seam ? 1 : (0.92 - i * 0.012));

    // Note name outside the ring.
    var lp = pt(CX, CY, R2 + 42, mid);
    text(lp[0], lp[1], seam ? 'C\u2032' : NOTES[i][0], {
      fill: seam ? '#c9a24d' : '#e8e0d0',
      'font-size': seam ? 26 : 21, 'font-style': 'italic',
      'text-anchor': 'middle', 'dominant-baseline': 'middle'
    });
    // Cents inside the kite.
    var cp = pt(CX, CY, 185, mid);
    text(cp[0], cp[1], seam ? '+23.46\u00A2' : NOTES[i][1].toFixed(0) + '\u00A2', {
      fill: '#141210', 'font-size': 13,
      'text-anchor': 'middle', 'dominant-baseline': 'middle'
    });
  }

  // Centre medallion.
  el('circle', { cx: CX, cy: CY, r: 74, fill: '#141210', stroke: '#c9a24d', 'stroke-width': 1 });
  text(CX, CY - 14, '12 \u00D7 3 : 2', {
    fill: '#e8e0d0', 'font-size': 19, 'font-style': 'italic',
    'text-anchor': 'middle'
  });
  text(CX, CY + 10, '7 octaves', {
    fill: '#9a9081', 'font-size': 13, 'text-anchor': 'middle'
  });
  text(CX, CY + 30, '+ 23.46\u00A2', {
    fill: '#c9a24d', 'font-size': 14, 'text-anchor': 'middle'
  });

  // ---- True-scale bar: 8423.46 cents across 600 px ----
  var BX0 = 200, BW = 600, BY = 838;
  text(BX0, BY - 12, 'twelve pure fifths, true scale', {
    fill: '#9a9081', 'font-size': 12, 'font-style': 'italic'
  });
  var octW = BW * 8400 / 8423.46; // 598.3 px of ivory
  el('rect', { x: BX0, y: BY, width: octW, height: 10, fill: '#e8e0d0' });
  el('rect', { x: BX0 + octW, y: BY, width: BW - octW, height: 10, fill: '#c9a24d' });
  text(BX0, BY + 30, '8400\u00A2 \u00B7 seven octaves', { fill: '#9a9081', 'font-size': 11 });
  text(BX0 + BW, BY + 30, '8423.46\u00A2', {
    fill: '#c9a24d', 'font-size': 11, 'text-anchor': 'end'
  });

  // ---- Magnified seam: window 8330-8470 cents at 24x, 240 px wide ----
  var MX0 = 380, MW = 240, MY = 908, PX = MW / 140; // px per cent
  text(MX0, MY - 12, 'the seam, magnified 24\u00D7', {
    fill: '#9a9081', 'font-size': 12, 'font-style': 'italic'
  });
  // Ivory up to the octave line (8400), brass wedge to 8423.46, void after.
  el('rect', { x: MX0, y: MY, width: 70 * PX, height: 12, fill: '#e8e0d0' });
  el('rect', { x: MX0 + 70 * PX, y: MY, width: 23.46 * PX, height: 12, fill: '#c9a24d', 'class': 'wedge' });
  el('rect', {
    x: MX0 + 93.46 * PX, y: MY, width: 46.54 * PX, height: 12,
    fill: 'none', stroke: '#6f675a', 'stroke-width': 1, 'stroke-dasharray': '3 3'
  });
  // Ticks + labels.
  function tick(x, label, anchor, color) {
    el('line', { x1: x, y1: MY - 4, x2: x, y2: MY + 16, stroke: color || '#9a9081', 'stroke-width': 1 });
    text(x, MY + 32, label, {
      fill: color || '#9a9081', 'font-size': 11,
      'text-anchor': anchor || 'middle'
    });
  }
  tick(MX0 + 70 * PX, '8400\u00A2', 'end');
  el('line', { x1: MX0 + 93.46 * PX, y1: MY - 4, x2: MX0 + 93.46 * PX, y2: MY + 16, stroke: '#c9a24d', 'stroke-width': 1 });
  text(MX0 + 93.46 * PX + 4, MY + 32, '8423.46\u00A2', {
    fill: '#c9a24d', 'font-size': 11, 'text-anchor': 'start'
  });
  text(MX0 + 120, MY + 48, '23.46\u00A2 of comma \u00B7 then nothing \u2014 the circle never closes', {
    fill: '#6f675a', 'font-size': 11, 'text-anchor': 'middle', 'font-style': 'italic'
  });
})();
</script>
</body>
</html>
