<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The God of Water Fleas</title>
<style>
html, body { margin: 0; padding: 0; background: #DCDCDC; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#DCDCDC';
var INK = '#3A2E26';
var PILL = '#E6E6E6';
// Palette: rust (oldest) -> olive -> fresh green (newest tips).
var RUST = [138, 74, 43];
var OLIVE = [122, 122, 58];
var GREEN = [78, 122, 58];
var LOOP = 60;          // seconds per growth loop
var PHASE = 18;         // frame one is 18 s into the loop
var N = 4200;           // fired particles per loop
var RING_R = 0.24;      // seed ring radius, in units of S (square side)
var FIRE_R = 0.46;      // firing radius, in units of S
var MAX_R = 0.41;       // outer bound, in units of S (ring spans ~80% of frame)
var STICK = 0.0055;     // stick distance, in units of S
var SEED_RING = 120;    // dots on the seed ring

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Age color: stick order 0 -> rust, middle -> olive, newest -> fresh green.
function ageColor(f) {
  var a, b, u;
  if (f < 0.5) { a = RUST; b = OLIVE; u = f / 0.5; }
  else { a = OLIVE; b = GREEN; u = (f - 0.5) / 0.5; }
  var r = Math.round(a[0] + (b[0] - a[0]) * u);
  var g = Math.round(a[1] + (b[1] - a[1]) * u);
  var bl = Math.round(a[2] + (b[2] - a[2]) * u);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
// Deterministic colony for a seed. Pure function of seed only.
// Firing rhythm: angle doubles each step modulo 2PI (Poor Man's DLA).
// Each particle travels straight inward along its ray from FIRE_R and sticks
// at the first cluster point it comes within STICK of; with no hit it lands
// on the seed ring. Coordinates are normalized (units of S, center origin),
// so the colony is size-independent and resize-safe.
function buildColony(seed) {
  var rnd = mulberry32(seed);
  var pts = [];   // {x, y, s} s = radial parameter along its ray
  var i, k;
  for (i = 0; i < SEED_RING; i++) {
    var a0 = i * TAU / SEED_RING;
    pts.push({ x: Math.cos(a0) * RING_R, y: Math.sin(a0) * RING_R, s: RING_R });
  }
  var theta = rnd() * TAU;
  var stick2 = STICK * STICK;
  var prevTheta = null;
  for (k = 0; k < N; k++) {
    theta = theta * 2;
    if (theta >= TAU) theta = theta % TAU;
    // The doubling map dwells near angle 0: theta, 2*theta, 4*theta ...
    // stay inside one narrow wedge for several steps, and every particle
    // fired there sticks just past the last tip, drawing one straight spoke.
    // Skip a firing whose angle is within 0.02 rad of the previous kept
    // firing; the rhythm still advances (k keeps doubling) but the spoke
    // never forms.
    if (prevTheta !== null) {
      var dth = theta - prevTheta;
      while (dth > Math.PI) dth -= TAU;
      while (dth < -Math.PI) dth += TAU;
      if (Math.abs(dth) < 0.02) continue;
    }
    prevTheta = theta;
    var dx = Math.cos(theta), dy = Math.sin(theta);
    var best = -1;
    for (i = 0; i < pts.length; i++) {
      var p = pts[i];
      var s = p.x * dx + p.y * dy;      // projection of p onto the ray
      if (s <= 0 || s >= FIRE_R) continue;
      var perp2 = (p.x * p.x + p.y * p.y) - s * s;
      if (perp2 < 0) perp2 = 0;
      if (perp2 >= stick2) continue;
      var entry = s + Math.sqrt(stick2 - perp2);
      if (entry > best) best = entry;
    }
    var r = best < 0 ? RING_R : best;
    if (r < RING_R) r = RING_R;
    if (r > MAX_R) r = MAX_R;
    pts.push({ x: dx * r, y: dy * r, s: r });
  }
  return pts;
}

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0;
var seed = 815;                 // PP815
var colony = null, colonySeed = -1;
var startT = null;              // elapsed-time anchor (load or last tap)
var downX = 0, downY = 0, downT = 0;

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  var w = 0, h = 0;
  if (typeof window !== 'undefined' && window.screen) {
    w = window.screen.width; h = window.screen.height;
  }
  if (!w) { w = VW; h = VH; }
  if (Math.min(w, h) < 700) return true;
  return h > w * 1.15;
}
function draw(elapsed) {
  if (colonySeed !== seed) { colony = buildColony(seed); colonySeed = seed; }
  size();
  var loopT = (PHASE + elapsed) % LOOP;
  var S = Math.min(VW, VH);
  var cx = VW / 2, cy = VH / 2;
  var phone = isPhone();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  // Growth schedule: linear in loop time; frame one (loopT 18) shows 30%.
  var shown = Math.floor(colony.length * loopT / LOOP);
  if (shown < SEED_RING) shown = SEED_RING;
  var dot = Math.max(2, Math.round(S * 0.003));
  var half = dot / 2;
  var i, p, px, py;
  for (i = 0; i < shown; i++) {
    p = colony[i];
    px = cx + p.x * S;
    py = cy + p.y * S;
    // Age is relative to the colony as grown so far: the newest tips are
    // always fresh green, the seed ring always deep rust.
    ctx.fillStyle = ageColor(i / shown);
    ctx.fillRect(Math.round(px - half), Math.round(py - half), dot, dot);
  }
  // Caption: title, formula date, tap cue. Dark ink on the pale ground.
  var fs = Math.max(9, Math.round(S * 0.016));
  var label = 'The God of Water Fleas  ·  2006 · 04 · 28  ·  Tap to reseed the rhythm.';
  ctx.font = fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  var pad = Math.round(fs * 0.7);
  var bx = Math.round(fs * 0.8), by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  ctx.fillStyle = PILL;
  ctx.fillRect(bx - pad, by, Math.ceil(tw) + 2 * pad, fs + 2 * pad);
  ctx.fillStyle = INK;
  ctx.textBaseline = 'top';
  ctx.fillText(label, bx, by + pad);
  if (typeof window !== 'undefined') {
    window.__p1568 = {
      elapsed: elapsed, loopT: loopT, shown: shown, total: colony.length,
      seed: seed, S: S, phone: phone, cx: cx, cy: cy
    };
  }
}
function reseed() {
  // Next rhythm from a deterministic LCG chain, never Math.random().
  seed = (seed * 16807) % 2147483647;
  if (seed <= 0) seed += 2147483646;
  colonySeed = -1;
  startT = null;   // loop restarts from the tap; PHASE keeps the ring grown
  draw(0);
}
function onDown(e) {
  downX = e.clientX || 0; downY = e.clientY || 0; downT = 1;
}
function onUp(e) {
  if (!downT) return;
  downT = 0;
  var x = e.clientX || 0, y = e.clientY || 0;
  if (Math.abs(x - downX) < 12 && Math.abs(y - downY) < 12) reseed();
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointerup', onUp);
  }
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
