<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.413 Sax Bouquet</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFC0E8; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.413 Sax Bouquet (yeti-iglesias, EXPANSION #44).
// After Yeti Iglesias's figure-into-bouquet
// metamorphosis: a girl in profile in a red polka-dot
// dress plays a saxophone on flat pink, her body
// melting at the waist into green stems, and from the
// saxophone's bell bursts a bouquet - two cat heads,
// two-tone flowers, green leaves and white star
// sparkles filling the right half. Her signature
// hue-shifted 2-stop gradients take the set's house
// treatment: TWO FLAT TONES WITH A HARD DIAGONAL EDGE
// inside each flower, never a blend. WATCH-ONLY, one
// 40s seamless loop: the bouquet bloom is one full
// cycle per loop (scale 1.0 to 1.06 over 20s about the
// bell point, relaxing back over 20s), every petal
// sways on a period that divides the loop, the two
// cat heads blink at FIXED slots, and six music-note-
// shaped petals drift up from the bell and fade on a
// FIXED TABLE of whole-cycle schedules, recycled
// deterministically - nothing is random at runtime.
// The grain halo behind the bouquet is exactly 500
// fixed speckle dots (data, drawn every frame in
// table order), never a texture or filter. The only
// lettering is her hand-lettered "Yeti" signature,
// STROKE PATHS only, bottom right. Frame one is drawn
// at the constant phase T = 13.4s (bouquet mid-bloom,
// one note-petal mid-rise); the clock is anchored
// there and advances in fixed 1/60 ticks, never from
// a wall clock. Flat colour only, one canvas, no
// offscreen canvas, no gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Ground pink; skin warm, hair dark, dress red with
// white dots (the palette's white stands in for the
// prompt's cream dots); sax brown and brass; cats
// orange and black; flowers red/pink and
// orange/yellow; leaves green; sparkles white.
// Nothing else.
var PINK = '#FFC0E8';
var SKIN = '#C86A4A', HAIR = '#2A1A2A', RED = '#E63329', WHITE = '#FFFFFF';
var BROWN = '#5A2E1A', BRASS = '#F5A623';
var CORANGE = '#F26A1B', CBLACK = '#111111';
var FPINK = '#FF7BB3', FORANGE = '#FF9500', FYELLOW = '#FFE066';
var GREEN = '#2E7D4F';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 40;
if (LOOP !== 40) throw new Error('Sax Bouquet loop must be 40s');
var TICK = 1 / 60;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
function makeRng(seedStart) {
  var s = seedStart;
  return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// Grain halo: exactly 500 speckle dots in a soft disc
// behind the bouquet, asserted. White and flower-pink
// dots at flat alpha steps.
var HALO_CX = 890, HALO_CY = 390, HALO_R = 345;
var rngHalo = makeRng(413);
var HALO = [];
for (var hi = 0; hi < 500; hi++) {
  var ha = rngHalo() * Math.PI * 2;
  var hr = HALO_R * Math.sqrt(rngHalo());
  HALO.push({
    x: HALO_CX + Math.cos(ha) * hr,
    y: HALO_CY + Math.sin(ha) * hr * 0.92,
    r: 0.9 + rngHalo() * 1.8,
    pink: rngHalo() < 0.35,
    a: 0.10 + Math.floor(rngHalo() * 3) * 0.07
  });
}
if (HALO.length !== 500) throw new Error('grain halo must hold exactly 500 dots');

// Dress polka dots: exactly 26 fixed dots inside the
// dress region, clipped to the dress silhouette when
// drawn.
var rngDots = makeRng(4137);
var DRESSDOTS = [];
for (var di = 0; di < 26; di++) {
  DRESSDOTS.push({ x: 282 + rngDots() * 112, y: 420 + rngDots() * 128, r: 4.5 + rngDots() * 2.5 });
}
if (DRESSDOTS.length !== 26) throw new Error('dress dot count');

// ---- bouquet layout ------------------------------------
// The bell point is the anchor everything bursts from.
// Each element holds an authored offset from the
// anchor, a sway period (always a divisor of the 40s
// loop), a sway phase, a fixed rotation and a
// bloomScale that weights how far the group bloom
// pushes it radially.
var BELL = { x: 660, y: 384 };

// Flowers: scalloped discs, two flat tones with a hard
// diagonal edge. toneA / toneB / centre per the set
// gradient rule.
var FLOWERS = [
  { ox: 50,  oy: -110, R: 56, a: RED,     b: FPINK,   c: FYELLOW, per: 10, ph: 0.0, rot: 0.3,  bs: 1.0 },
  { ox: 180, oy: -180, R: 68, a: FORANGE, b: FYELLOW, c: RED,     per: 8,  ph: 1.7, rot: -0.4, bs: 1.1 },
  { ox: 320, oy: -40,  R: 52, a: RED,     b: FPINK,   c: FYELLOW, per: 20, ph: 3.1, rot: 0.8,  bs: 0.9 },
  { ox: 110, oy: -250, R: 60, a: FORANGE, b: FYELLOW, c: RED,     per: 5,  ph: 0.6, rot: -0.2, bs: 1.0 },
  { ox: 260, oy: -270, R: 46, a: RED,     b: FPINK,   c: FYELLOW, per: 10, ph: 4.4, rot: 0.5,  bs: 1.1 },
  { ox: 390, oy: -180, R: 54, a: FORANGE, b: FYELLOW, c: RED,     per: 8,  ph: 2.9, rot: -0.7, bs: 0.9 },
  { ox: 440, oy: -30,  R: 44, a: RED,     b: FPINK,   c: FYELLOW, per: 20, ph: 5.2, rot: 0.1,  bs: 1.0 },
  { ox: 20,  oy: -200, R: 40, a: FORANGE, b: FYELLOW, c: RED,     per: 40, ph: 1.2, rot: 0.9,  bs: 0.8 }
];
if (FLOWERS.length !== 8) throw new Error('bouquet must hold exactly 8 flowers');

// Cat heads: exactly two, orange and black. Each
// blinks at FIXED slots inside the loop (start times
// in seconds, 0.3s each, factor rises and falls as a
// sine within the slot, zero outside).
var CATS = [
  { ox: 160, oy: -285, r: 40, col: CORANGE, eye: HAIR,  per: 10, ph: 2.2, bs: 1.0, slots: [6.0, 26.0] },
  { ox: 335, oy: -295, r: 36, col: CBLACK,  eye: WHITE, per: 20, ph: 0.9, bs: 1.0, slots: [13.0, 33.0] }
];
if (CATS.length !== 2) throw new Error('bouquet must hold exactly 2 cat heads');

// Leaves: pointed blades on the bouquet stems.
var LEAVES = [
  { ox: 80,  oy: -50,  len: 52, rot: -0.6, per: 10, ph: 0.4, bs: 0.9 },
  { ox: 210, oy: -120, len: 58, rot: 0.4,  per: 8,  ph: 2.0, bs: 1.0 },
  { ox: 330, oy: -150, len: 50, rot: -0.3, per: 20, ph: 4.1, bs: 0.9 },
  { ox: 150, oy: -210, len: 55, rot: 0.7,  per: 5,  ph: 1.1, bs: 1.0 },
  { ox: 420, oy: -250, len: 48, rot: 0.2,  per: 10, ph: 5.6, bs: 1.1 },
  { ox: 430, oy: -95, len: 46, rot: -0.9, per: 40, ph: 3.3, bs: 0.8 },
  { ox: 180, oy: -95, len: 44, rot: 0.9,  per: 20, ph: 0.8, bs: 0.9 },
  { ox: 265, oy: -175, len: 42, rot: -0.5, per: 8,  ph: 4.9, bs: 1.0 },
  { ox: 355, oy: -95, len: 44, rot: 0.6,  per: 5,  ph: 2.4, bs: 0.9 }
];
if (LEAVES.length !== 9) throw new Error('bouquet must hold exactly 9 leaves');

// Sparkles: white 4-point stars seasoning the bouquet,
// twinkling on whole-cycle periods.
var SPARKS = [
  { ox: 100, oy: -160, r: 12, per: 5,  ph: 0.0 },
  { ox: 280, oy: -200, r: 10, per: 8,  ph: 1.3 },
  { ox: 400, oy: -300, r: 13, per: 10, ph: 2.6 },
  { ox: 460, oy: -120, r: 9,  per: 20, ph: 0.7 },
  { ox: 180, oy: -350, r: 10, per: 5,  ph: 3.9 },
  { ox: 360, oy: -40,  r: 11, per: 8,  ph: 5.1 },
  { ox: 40,  oy: -300, r: 9,  per: 10, ph: 4.2 },
  { ox: 240, oy: -90,  r: 8,  per: 20, ph: 2.2 }
];
if (SPARKS.length !== 8) throw new Error('bouquet must hold exactly 8 sparkles');

// ---- the note-petal table -------------------------------
// Six music-note-shaped petals drift up from the bell
// and fade. FIXED TABLE: each entry holds a period
// that divides the 40s loop, a phase, a rise height,
// a sideways drift, a size and a tone. Progress is
// purely a function of loop time, so the table
// recycles deterministically forever.
//   N1: period 20, phase 17.0 - mid-rise at frame one
//   N2: period 10, phase  3.0
//   N3: period 40, phase 22.0
//   N4: period  8, phase  5.0
//   N5: period 20, phase  6.0
//   N6: period 40, phase  2.0
var NOTES = [
  { per: 20, ph: 17.0, rise: 430, drift: -40,  size: 1.00, tone: WHITE },
  { per: 10, ph: 3.0,  rise: 300, drift: 60,   size: 0.80, tone: FPINK },
  { per: 40, ph: 22.0, rise: 520, drift: 120,  size: 1.15, tone: WHITE },
  { per: 8,  ph: 5.0,  rise: 240, drift: -80,  size: 0.70, tone: WHITE },
  { per: 20, ph: 6.0,  rise: 380, drift: 30,   size: 0.90, tone: FPINK },
  { per: 40, ph: 2.0,  rise: 480, drift: -120, size: 1.05, tone: WHITE }
];
if (NOTES.length !== 6) throw new Error('note-petal table must hold exactly 6 entries');

// Saxophone key dots: exactly 6 brass keys down the
// tube, as the prompt's flat 5-7 key dots allow.
var KEYS = [
  { x: 452, y: 415 }, { x: 478, y: 480 }, { x: 502, y: 535 },
  { x: 548, y: 570 }, { x: 592, y: 545 }, { x: 618, y: 478 }
];
if (KEYS.length !== 6) throw new Error('sax must hold exactly 6 key dots');

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function ellA(x, y, rx, ry, rot, color, alpha) {
  ctx.globalAlpha = alpha;
  ell(x, y, rx, ry, rot, color);
  ctx.globalAlpha = 1;
}
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function poly(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function starPath(cx, cy, rO, rI, rot) {
  ctx.beginPath();
  for (var i = 0; i < 8; i++) {
    var r = i % 2 === 0 ? rO : rI;
    var a = rot + i * Math.PI / 4 - Math.PI / 2;
    var X = cx + Math.cos(a) * r, Y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
}

// ---- piece recipes --------------------------------------
// A bouquet element's live position: its authored
// offset, pushed radially by the group bloom weighted
// by its own bloomScale, swung by its sway (period
// dividing the loop) around the bell anchor.
function bloomAt(lt) { return 1 + 0.03 * (1 - Math.cos(2 * Math.PI * lt / LOOP)); }
function elemPos(e, lt) {
  var rad = 1 + (bloomAt(lt) - 1) * e.bs;
  var sw = Math.sin(2 * Math.PI * lt / e.per + e.ph) * 0.045;
  var cs = Math.cos(sw), sn = Math.sin(sw);
  return {
    x: BELL.x + (e.ox * cs - e.oy * sn) * rad,
    y: BELL.y + (e.ox * sn + e.oy * cs) * rad,
    sw: sw
  };
}
function blinkAt(lt, slots) {
  for (var i = 0; i < slots.length; i++) {
    var d = lt - slots[i];
    if (d >= 0 && d <= 0.3) return Math.sin(Math.PI * d / 0.3);
  }
  return 0;
}

// Flower: a scalloped disc filled with tone A, then
// clipped and halved along a hard diagonal with
// tone B (the set gradient rule), then a centre.
function scallopPath(R) {
  ctx.beginPath();
  for (var i = 0; i <= 48; i++) {
    var a = i / 48 * Math.PI * 2;
    var r = R * (0.88 + 0.12 * Math.cos(6 * a));
    var X = Math.cos(a) * r, Y = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
}
function drawFlower(f, x, y, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  scallopPath(f.R);
  ctx.fillStyle = f.a; ctx.fill();
  ctx.save();
  scallopPath(f.R);
  ctx.clip();
  ctx.rotate(-0.6);
  ctx.fillStyle = f.b;
  ctx.fillRect(-f.R * 1.6, -f.R * 1.6, f.R * 3.2, f.R * 1.6);
  ctx.restore();
  ell(0, 0, f.R * 0.30, f.R * 0.30, 0, f.c);
  ell(0, 0, f.R * 0.13, f.R * 0.13, 0, f.a);
  ctx.restore();
}

// Leaf: a pointed blade with a centre vein.
function drawLeaf(l, x, y, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(l.len * 0.34, -l.len * 0.42, 0, -l.len);
  ctx.quadraticCurveTo(-l.len * 0.34, -l.len * 0.42, 0, 0);
  ctx.fill();
  seg(0, -4, 0, -l.len + 6, 2, PINK);
  ctx.restore();
}

// Cat head: circle, two triangle ears, two eyes that
// scale shut under the blink factor, a tiny nose.
function drawCat(c, x, y, rot, blink) {
  var r = c.r;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  poly(c.col, [-r * 0.78, -r * 0.48, -r * 0.62, -r * 1.12, -r * 0.18, -r * 0.82]);
  poly(c.col, [r * 0.78, -r * 0.48, r * 0.62, -r * 1.12, r * 0.18, -r * 0.82]);
  ell(0, 0, r, r * 0.94, 0, c.col);
  var eyeRy = r * 0.14 * (1 - blink * 0.88);
  ell(-r * 0.36, -r * 0.06, r * 0.10, Math.max(0.8, eyeRy), 0, c.eye);
  ell(r * 0.36, -r * 0.06, r * 0.10, Math.max(0.8, eyeRy), 0, c.eye);
  poly(FPINK, [-r * 0.11, r * 0.14, r * 0.11, r * 0.14, 0, r * 0.26]);
  ctx.strokeStyle = c.eye; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  ctx.moveTo(-r * 0.55, r * 0.10); ctx.lineTo(-r * 0.95, r * 0.02);
  ctx.moveTo(-r * 0.55, r * 0.24); ctx.lineTo(-r * 0.95, r * 0.26);
  ctx.moveTo(r * 0.55, r * 0.10); ctx.lineTo(r * 0.95, r * 0.02);
  ctx.moveTo(r * 0.55, r * 0.24); ctx.lineTo(r * 0.95, r * 0.26);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

// A music-note-shaped petal: an oval head, a stem up,
// a small flag at the top, drawn at the origin.
function drawNote(n, x, y, rot, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(n.size, n.size);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = n.tone;
  ctx.strokeStyle = n.tone;
  ctx.beginPath();
  ctx.ellipse(-6, 14, 11, 8, -0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(4, 12); ctx.lineTo(4, -26); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(4, -26);
  ctx.quadraticCurveTo(16, -22, 15, -10);
  ctx.quadraticCurveTo(10, -15, 4, -16);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

// Her hand-lettered signature: stroke paths only, no
// font text. Script "Yeti" with a flourish underline,
// drawn in a 120x48 box moved to the bottom right.
var SIG = [
  [[0, 2], [9, 15], [18, 2]],
  [[9, 15], [7, 30], [3, 40], [-2, 44]],
  [[25, 27], [29, 15], [34, 10], [39, 12], [37, 18], [31, 20], [28, 25], [34, 27], [42, 24]],
  [[58, 0], [56, 18], [57, 29], [62, 33]],
  [[49, 12], [67, 12]],
  [[79, 11], [77, 29]],
  [[-4, 46], [35, 50], [80, 47], [104, 44]]
];
function drawSignature() {
  ctx.save();
  ctx.translate(1136, 830);
  ctx.strokeStyle = HAIR; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (var i = 0; i < SIG.length; i++) {
    var st = SIG[i];
    ctx.beginPath();
    ctx.moveTo(st[0][0], st[0][1]);
    for (var j = 1; j < st.length; j++) ctx.lineTo(st[j][0], st[j][1]);
    ctx.stroke();
  }
  ell(80, 3, 2.4, 2.4, 0, HAIR);
  ctx.restore();
}

// ---- the scene ------------------------------------------
function drawScene(lt) {
  // Ground: flat pink, everywhere including margins.
  ctx.fillStyle = PINK;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);

  // Grain halo behind the bouquet: the 500 fixed
  // speckle dots alone, in table order - no flat lift
  // disc, so the halo's edge stays soft by speckle.
  for (var g = 0; g < HALO.length; g++) {
    var gd = HALO[g];
    if (gd.pink) ellA(gd.x, gd.y, gd.r, gd.r, 0, FPINK, gd.a);
    else ellA(gd.x, gd.y, gd.r, gd.r, 0, WHITE, gd.a);
  }

  // The girl's body melts at the waist into stems:
  // six green stems curve from the hem to the floor,
  // spreading as they fall.
  ctx.strokeStyle = GREEN; ctx.lineCap = 'round';
  var stemEnds = [[228, 902], [282, 902], [330, 902], [382, 902], [428, 902], [472, 902]];
  var stemSrc = [[284, 570], [302, 580], [320, 584], [340, 584], [358, 578], [378, 566]];
  for (var sm = 0; sm < 6; sm++) {
    ctx.lineWidth = 8.5 - sm % 2 * 1.5;
    ctx.beginPath();
    ctx.moveTo(stemSrc[sm][0], stemSrc[sm][1]);
    ctx.quadraticCurveTo(stemSrc[sm][0] + (stemEnds[sm][0] - stemSrc[sm][0]) * 0.2,
      (stemSrc[sm][1] + stemEnds[sm][1]) / 2, stemEnds[sm][0], stemEnds[sm][1]);
    ctx.stroke();
  }
  // Small leaves riding the stems.
  ctx.save(); ctx.translate(300, 700); ctx.rotate(-0.5);
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.quadraticCurveTo(13, -16, 0, -38); ctx.quadraticCurveTo(-13, -16, 0, 0); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(392, 742); ctx.rotate(0.6); ctx.scale(0.85, 0.85);
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.quadraticCurveTo(13, -16, 0, -38); ctx.quadraticCurveTo(-13, -16, 0, 0); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(414, 692); ctx.rotate(0.9); ctx.scale(0.7, 0.7);
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.quadraticCurveTo(13, -16, 0, -38); ctx.quadraticCurveTo(-13, -16, 0, 0); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(262, 776); ctx.rotate(-0.8); ctx.scale(0.75, 0.75);
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.quadraticCurveTo(13, -16, 0, -38); ctx.quadraticCurveTo(-13, -16, 0, 0); ctx.fill();
  ctx.restore();

  // Hair mass behind the head, falling to the shoulder,
  // with a bun.
  ell(243, 218, 34, 34, 0, HAIR);
  ell(296, 292, 80, 86, 0.15, HAIR);
  poly(HAIR, [238, 320, 286, 318, 282, 448, 246, 446]);

  // Neck and dress. The dress is a flat red torso
  // ending in a wavy five-point hem at the waist,
  // where the melting takes over.
  ell(326, 366, 12, 26, 0.08, SKIN);
  poly(SKIN, [313, 378, 339, 378, 354, 414, 298, 414]);
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.moveTo(268, 416);
  ctx.quadraticCurveTo(330, 392, 392, 416);
  ctx.lineTo(402, 520);
  ctx.lineTo(388, 566); ctx.lineTo(368, 540); ctx.lineTo(350, 580);
  ctx.lineTo(332, 546); ctx.lineTo(314, 582); ctx.lineTo(296, 548);
  ctx.lineTo(278, 570); ctx.lineTo(262, 524);
  ctx.closePath();
  ctx.fill();
  // Polka dots clipped to the dress silhouette.
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(268, 416);
  ctx.quadraticCurveTo(330, 392, 392, 416);
  ctx.lineTo(402, 520);
  ctx.lineTo(388, 566); ctx.lineTo(368, 540); ctx.lineTo(350, 580);
  ctx.lineTo(332, 546); ctx.lineTo(314, 582); ctx.lineTo(296, 548);
  ctx.lineTo(278, 570); ctx.lineTo(262, 524);
  ctx.closePath();
  ctx.clip();
  for (var dd = 0; dd < DRESSDOTS.length; dd++) {
    var dp = DRESSDOTS[dd];
    ell(dp.x, dp.y, dp.r, dp.r, 0, WHITE);
  }
  ctx.restore();

  // Head in profile: skin circle, a small nose bump on
  // the facing edge, closed eye, lips, blush.
  ell(324, 302, 58, 60, 0, SKIN);
  poly(SKIN, [372, 300, 388, 314, 370, 322]);
  ellA(342, 328, 10, 7, 0, FPINK, 0.45);
  ctx.strokeStyle = HAIR; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(336, 294);
  ctx.quadraticCurveTo(346, 301, 357, 295);
  ctx.stroke();
  seg(340, 300, 337, 305, 2, HAIR);
  seg(352, 299, 351, 305, 2, HAIR);
  ell(368, 332, 7, 4, 0.1, RED);
  // Hair cap over the crown, sweeping to a point.
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.moveTo(268, 330);
  ctx.quadraticCurveTo(258, 238, 322, 232);
  ctx.quadraticCurveTo(372, 236, 382, 282);
  ctx.quadraticCurveTo(352, 262, 330, 268);
  ctx.quadraticCurveTo(292, 276, 268, 330);
  ctx.closePath();
  ctx.fill();

  // Arm reaching forward to the saxophone, hand on the
  // tube; a second hand rests at the waist.
  seg(368, 448, 432, 498, 20, SKIN);
  seg(432, 498, 500, 516, 17, SKIN);
  ell(503, 517, 11, 11, 0, SKIN);
  seg(292, 452, 300, 522, 18, SKIN);
  ell(301, 528, 10, 10, 0, SKIN);

  // Saxophone: one curved flat tube from her mouth,
  // sweeping down and bowing back up to the bell.
  ctx.strokeStyle = BROWN; ctx.lineCap = 'round';
  ctx.lineWidth = 30;
  ctx.beginPath();
  ctx.moveTo(396, 326);
  ctx.bezierCurveTo(432, 384, 472, 472, 500, 540);
  ctx.bezierCurveTo(518, 592, 582, 594, 602, 540);
  ctx.bezierCurveTo(618, 494, 634, 442, 650, 402);
  ctx.stroke();
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(376, 316); ctx.lineTo(398, 327); ctx.stroke();
  // Brass keys down the tube.
  for (var k = 0; k < KEYS.length; k++) ell(KEYS[k].x, KEYS[k].y, 6.5, 6.5, 0, BRASS);
  // The bell: brass flare with a dark mouth, the point
  // the whole bouquet bursts from.
  ell(BELL.x, BELL.y, 52, 36, -0.45, BRASS);
  ell(BELL.x, BELL.y, 36, 23, -0.45, BROWN);

  // Bouquet stems from the bell to each flower and
  // leaf base, in the elements' live positions.
  var pos = {}, i2, e2, p2;
  for (i2 = 0; i2 < FLOWERS.length; i2++) pos['f' + i2] = elemPos(FLOWERS[i2], lt);
  for (i2 = 0; i2 < LEAVES.length; i2++) pos['l' + i2] = elemPos(LEAVES[i2], lt);
  for (i2 = 0; i2 < CATS.length; i2++) pos['c' + i2] = elemPos(CATS[i2], lt);
  ctx.strokeStyle = GREEN; ctx.lineWidth = 3.6; ctx.lineCap = 'round'; ctx.globalAlpha = 0.85;
  for (i2 = 0; i2 < FLOWERS.length; i2++) {
    p2 = pos['f' + i2];
    ctx.beginPath();
    ctx.moveTo(BELL.x, BELL.y);
    ctx.quadraticCurveTo((BELL.x + p2.x) / 2 + 10, (BELL.y + p2.y) / 2, p2.x, p2.y);
    ctx.stroke();
  }
  for (i2 = 0; i2 < LEAVES.length; i2++) {
    p2 = pos['l' + i2];
    ctx.beginPath();
    ctx.moveTo(BELL.x, BELL.y);
    ctx.quadraticCurveTo((BELL.x + p2.x) / 2 - 8, (BELL.y + p2.y) / 2, p2.x, p2.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Bouquet body: leaves under, flowers over, cats on
  // top, sparkles seasoning the whole burst.
  for (i2 = 0; i2 < LEAVES.length; i2++) {
    e2 = LEAVES[i2]; p2 = pos['l' + i2];
    drawLeaf(e2, p2.x, p2.y, e2.rot + p2.sw * 1.6);
  }
  for (i2 = 0; i2 < FLOWERS.length; i2++) {
    e2 = FLOWERS[i2]; p2 = pos['f' + i2];
    drawFlower(e2, p2.x, p2.y, e2.rot + p2.sw * 1.6);
  }
  for (i2 = 0; i2 < CATS.length; i2++) {
    e2 = CATS[i2]; p2 = pos['c' + i2];
    drawCat(e2, p2.x, p2.y, p2.sw * 1.2, blinkAt(lt, e2.slots));
  }
  for (i2 = 0; i2 < SPARKS.length; i2++) {
    e2 = SPARKS[i2];
    p2 = elemPos({ ox: e2.ox, oy: e2.oy, per: e2.per, ph: e2.ph, bs: 1.0 }, lt);
    var tw = 0.30 + 0.70 * (0.5 - 0.5 * Math.cos(2 * Math.PI * (lt + e2.ph) / e2.per));
    ctx.globalAlpha = tw;
    starPath(p2.x, p2.y, e2.r, e2.r * 0.30, p2.sw * 2);
    ctx.fillStyle = WHITE; ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Note-petals rising from the bell on the fixed
  // table, fading in and out across each traversal.
  for (i2 = 0; i2 < NOTES.length; i2++) {
    var n = NOTES[i2];
    var pr = ((lt + n.ph) % n.per) / n.per;
    var nx = BELL.x + 14 + n.drift * pr + Math.sin(pr * Math.PI * 2 + n.ph) * 16;
    var ny = BELL.y - 20 - n.rise * pr;
    var na = Math.pow(Math.sin(Math.PI * pr), 0.8);
    if (na > 0.01) drawNote(n, nx, ny, -0.3 + pr * 0.9, na * 0.92);
  }

  drawSignature();
}

function draw() { drawScene(T % LOOP); }

// ---- piece state ----------------------------------------
// Constant first-frame phase: T = 13.4s into the 40s
// loop (bouquet mid-bloom at scale ~1.045, note N1 at
// progress 0.52 mid-rise, black cat just past its
// first blink slot). The clock advances in fixed 1/60
// ticks from there, never from a wall clock.
var T = 13.4;
var lastNow = -1, acc = 0;

function step() { /* watch-only: no per-tick state */ }

// ---- sizing: full-bleed field ---------------------------
// Desktop and tablet take the cover fit. On phones the
// portrait crop of a cover fit would cut one pole of
// this two-pole composition (girl left, bouquet
// right) entirely, so phones take a width fit on the
// piece's own pink ground instead - the whole scene
// survives, small but complete, as in No.401's phone
// framing ruling.
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (phone) S = W / DW;
  else S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
