<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair Grid</title>
<style>
  html, body { margin: 0; padding: 0; background: #0D0D10; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var BG = '#0D0D10';
  var STRAND = '#4A4A52';
  var SHEEN = '#8E8E99';
  var KNOT = '#2A2A30';
  var GLINT = '#D8D8E0';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded RNG (mulberry32).
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var isPhone = false;
  if (typeof window !== 'undefined' && window.screen) {
    isPhone = Math.min(window.screen.width, window.screen.height) < 700;
  }

  var NW = isPhone ? 40 : 50;   // warp strands
  var NH = isPhone ? 44 : 52;   // weft strands
  var SAMPLES = 110;

  var epoch = 0;
  var weave = null;

  function buildWeave(ep) {
    var rng = mulberry32(0x9E3779B9 ^ (ep * 0x85EBCA6B + 710));
    var w = { knots: [], floats: {}, gaps: [], doubled: [], sheenSeed: [] };
    var i, j, k;

    // Knots at 12-20 random intersections (kept off the pinned top rows).
    var nKnots = 12 + Math.floor(rng() * 9);
    var used = {};
    for (k = 0; k < nKnots; k++) {
      var ki = 1 + Math.floor(rng() * (NW - 2));
      var kj = 3 + Math.floor(rng() * (NH - 5));
      var key = ki + ',' + kj;
      if (used[key]) { k--; continue; }
      used[key] = true;
      w.knots.push({ i: ki, j: kj, phase: rng() * Math.PI * 2, r: 3.5 + rng() * 1.3 });
    }

    // Floats: a warp strand rides over 3 consecutive weft crossings.
    var nFloats = 3 + Math.floor(rng() * 3);
    for (k = 0; k < nFloats; k++) {
      var fi = 1 + Math.floor(rng() * (NW - 2));
      var fj = 4 + Math.floor(rng() * (NH - 10));
      for (var d = 0; d < 3; d++) w.floats[fi + ',' + (fj + d)] = true;
    }

    // Gaps: a short run of a warp strand goes missing.
    var nGaps = 3 + Math.floor(rng() * 3);
    for (k = 0; k < nGaps; k++) {
      w.gaps.push({
        i: 1 + Math.floor(rng() * (NW - 2)),
        v0: 0.15 + rng() * 0.6,
        len: 0.03 + rng() * 0.05,
        warp: rng() < 0.7
      });
    }

    // Doubled strands: an extra thread runs alongside.
    var nDoubled = 2 + Math.floor(rng() * 2);
    for (k = 0; k < nDoubled; k++) {
      w.doubled.push({ i: 1 + Math.floor(rng() * (NW - 2)), off: 1.6 + rng() * 1.2 });
    }

    for (i = 0; i < NW; i++) w.sheenSeed.push(rng() * Math.PI * 2);
    return w;
  }

  var viewW = 0, viewH = 0, dpr = 1;

  function layout() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    viewW = vv ? vv.width : window.innerWidth;
    viewH = vv ? vv.height : window.innerHeight;
    if (!isPhone && viewH > viewW * 1.15) isPhone = true;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
  }

  // Wind displacement, closed form. Exactly zero at t = 0 for every point:
  // each travelling sine is differenced against its own t = 0 value.
  var W1 = (Math.PI * 2) / 12, W2 = (Math.PI * 2) / 8;
  function dispX(u, v, t, maxAmp) {
    var env = maxAmp * Math.pow(v, 1.5);
    var s1 = 4.2 * u + 2.6 * v;
    var s2 = 5.0 * u - 7.0 * v;
    return env * (0.65 * (Math.sin(s1 + W1 * t) - Math.sin(s1)) +
                  0.35 * (Math.sin(s2 - W2 * t) - Math.sin(s2)));
  }
  function dispY(u, v, t, maxAmp) {
    var env = maxAmp * 0.35 * Math.pow(v, 1.5);
    var s1 = 3.1 * u - 4.4 * v;
    var s2 = 6.3 * v + 1.7 * u;
    return env * (0.6 * (Math.sin(s1 - W1 * t) - Math.sin(s1)) +
                  0.4 * (Math.sin(s2 + W2 * t) - Math.sin(s2)));
  }

  function draw(t) {
    if (!weave) weave = buildWeave(epoch);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, viewW, viewH);

    var x0 = viewW * 0.06, y0 = viewH * 0.035;
    var tw = viewW * 0.88, th = viewH * 0.90;
    var maxAmp = Math.min(viewW, viewH) * 0.013;
    var sagMax = viewH * 0.028;
    var cellW = tw / (NW - 1), cellH = th / (NH - 1);
    var strandW = Math.max(1, Math.min(viewW, viewH) / 620);

    function pt(u, v) {
      var sag = sagMax * Math.sin(Math.PI * u) * (0.25 + 0.75 * v);
      return [
        x0 + u * tw + dispX(u, v, t, maxAmp),
        y0 + v * th + sag + dispY(u, v, t, maxAmp)
      ];
    }

    ctx.lineCap = 'round';

    // Pass 1: warp strands as full polylines.
    ctx.strokeStyle = STRAND;
    ctx.globalAlpha = 0.92;
    ctx.lineWidth = strandW;
    var i, j, s;
    for (i = 0; i < NW; i++) {
      var u = i / (NW - 1);
      ctx.beginPath();
      for (s = 0; s <= SAMPLES; s++) {
        var p = pt(u, s / SAMPLES);
        if (s === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
      }
      ctx.stroke();
    }
    // Doubled warp strands run alongside their partner.
    ctx.globalAlpha = 0.75;
    for (var d = 0; d < weave.doubled.length; d++) {
      var du = weave.doubled[d].i / (NW - 1);
      ctx.beginPath();
      for (s = 0; s <= SAMPLES; s++) {
        var dp = pt(du, s / SAMPLES);
        if (s === 0) ctx.moveTo(dp[0] + weave.doubled[d].off, dp[1]);
        else ctx.lineTo(dp[0] + weave.doubled[d].off, dp[1]);
      }
      ctx.stroke();
    }

    // Pass 2: weft strands as full polylines (weft sits on top for now).
    ctx.globalAlpha = 0.92;
    for (j = 0; j < NH; j++) {
      var v = j / (NH - 1);
      ctx.beginPath();
      for (s = 0; s <= SAMPLES; s++) {
        var q = pt(s / SAMPLES, v);
        if (s === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
      }
      ctx.stroke();
    }

    // Pass 3: plain-weave correction. At crossings where the warp belongs
    // on top (checkerboard parity, plus seeded floats), redraw a short
    // warp dash over the weft. This overdraw is what makes the weave read.
    ctx.globalAlpha = 0.98;
    ctx.lineWidth = strandW * 1.5;
    var dv = 0.42 / (NH - 1);
    for (i = 0; i < NW; i++) {
      var cu = i / (NW - 1);
      for (j = 0; j < NH; j++) {
        var warpTop = ((i + j) % 2 === 0) || weave.floats[i + ',' + j];
        if (!warpTop) continue;
        var cv = j / (NH - 1);
        var a = pt(cu, Math.max(0, cv - dv));
        var b = pt(cu, Math.min(1, cv + dv));
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.stroke();
      }
    }

    // Pass 4: gaps, where a thread goes missing for a short run.
    ctx.strokeStyle = BG;
    ctx.globalAlpha = 1;
    ctx.lineWidth = strandW * 2.4;
    for (var g = 0; g < weave.gaps.length; g++) {
      var gap = weave.gaps[g];
      if (gap.warp) {
        var gu = gap.i / (NW - 1);
        var ga = pt(gu, gap.v0), gb = pt(gu, gap.v0 + gap.len);
        ctx.beginPath(); ctx.moveTo(ga[0], ga[1]); ctx.lineTo(gb[0], gb[1]); ctx.stroke();
      } else {
        var gv = gap.i / (NH - 1);
        var gc = pt(gap.v0, gv), gd = pt(gap.v0 + gap.len, gv);
        ctx.beginPath(); ctx.moveTo(gc[0], gc[1]); ctx.lineTo(gd[0], gd[1]); ctx.stroke();
      }
    }
    ctx.strokeStyle = STRAND;

    // Pass 5: sheen. Where the travelling wave bends a warp strand most,
    // redraw that segment in the sheen tone with slope-scaled alpha.
    ctx.strokeStyle = SHEEN;
    ctx.lineWidth = strandW;
    for (i = 0; i < NW; i++) {
      var su = i / (NW - 1);
      var prev = pt(su, 0);
      var prevDisp = dispX(su, 0, t, maxAmp);
      for (s = 1; s <= SAMPLES; s++) {
        var sv = s / SAMPLES;
        var sp = pt(su, sv);
        var dNow = dispX(su, sv, t, maxAmp);
        var segLen = Math.max(1, Math.hypot(sp[0] - prev[0], sp[1] - prev[1]));
        var slope = Math.abs(dNow - prevDisp) / segLen;
        var aSheen = (slope - 0.10) * 1.5;
        if (aSheen > 0.04) {
          ctx.globalAlpha = Math.min(0.5, aSheen);
          ctx.beginPath();
          ctx.moveTo(prev[0], prev[1]);
          ctx.lineTo(sp[0], sp[1]);
          ctx.stroke();
        }
        prev = sp; prevDisp = dNow;
      }
    }

    // Pass 6: knots ride their crossing points; glints pulse slowly.
    for (var k = 0; k < weave.knots.length; k++) {
      var knot = weave.knots[k];
      var kp = pt(knot.i / (NW - 1), knot.j / (NH - 1));
      ctx.globalAlpha = 1;
      ctx.fillStyle = KNOT;
      ctx.beginPath();
      ctx.arc(kp[0], kp[1], knot.r, 0, Math.PI * 2);
      ctx.fill();
      var pulse = 0.5 + 0.5 * Math.sin(0.6 * t + knot.phase);
      ctx.globalAlpha = 0.25 + 0.55 * pulse * pulse;
      ctx.fillStyle = GLINT;
      ctx.beginPath();
      ctx.arc(kp[0] - knot.r * 0.3, kp[1] - knot.r * 0.3, 0.95, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function nowT() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - T0) / 1000;
    }
    return 0;
  }

  function frame() {
    draw(nowT());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  function resize() { layout(); draw(nowT()); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  // Tap reseeds the weave: next epoch, fresh knots and imperfections.
  function reseed() {
    epoch++;
    weave = buildWeave(epoch);
    T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    draw(0);
  }
  canvas.addEventListener('pointerdown', reseed);
  canvas.addEventListener('touchstart', reseed);

  layout();
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
