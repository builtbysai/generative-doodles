<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ant Atlas</title>
<style>
  html, body { margin: 0; padding: 0; background: #7EC8E3; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32, fixed seed) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(529064);

  // ---------- palette (NM1 spec) ----------
  var RED = '#D43A2B',       // ant red
      RED_D = '#A92C20',     // darker tone of the ant red (stripes, far legs, armor)
      GREEN = '#4E9A3D',     // leaf green
      YELLOW = '#F2B705',    // flower yellow
      SKY = '#7EC8E3',       // sky / page ground
      CREAM = '#F7F1E3',     // cream paper (cards, banner)
      INK = '#1A1A1A';       // label ink

  var PHASE0 = 1.4; // constant loop phase for frame one

  // ---------- precomputed scene data (all seeded, static) ----------
  // riso grain specks drawn directly each frame (no offscreen canvas in the QA renderer)
  var grain = [];
  for (var g = 0; g < 700; g++) {
    grain.push({ x: rng(), y: rng(), a: rng() * Math.PI, l: 2 + rng() * 4, dark: rng() < 0.5, al: 0.03 + rng() * 0.05 });
  }
  // flowers: x, y (stage), radius, petal colour
  var PETALS = [YELLOW, CREAM, RED, YELLOW, CREAM];
  var flowers = [];
  function addFlower(x, y, r) {
    flowers.push({ x: x, y: y, r: r, rot: rng() * Math.PI, col: PETALS[flowers.length % PETALS.length], stem: y > 0.75 });
  }
  addFlower(0.055, 0.055, 0.030); addFlower(0.945, 0.055, 0.030);      // top corners, in the sky
  addFlower(0.075, 0.455, 0.038); addFlower(0.048, 0.520, 0.026);     // left-middle cluster
  var fx;
  for (fx = 0.045; fx < 0.99; fx += 0.105) {                          // ground row along the meadow edge
    addFlower(fx + (rng() - 0.5) * 0.02, 0.800 + (rng() - 0.5) * 0.012, 0.020 + rng() * 0.013);
  }
  addFlower(0.060, 0.905, 0.046); addFlower(0.940, 0.905, 0.046);     // big corner blooms
  addFlower(0.150, 0.930, 0.030); addFlower(0.850, 0.930, 0.030);
  // ground scallops
  var scallops = [];
  for (var sx = 0.0; sx < 1.02; sx += 0.055) scallops.push({ x: sx, r: 0.034 + rng() * 0.010 });
  // title letter jitters (static, seeded)
  var titleJit = [];
  for (var tj = 0; tj < 8; tj++) titleJit.push({ dy: (rng() - 0.5) * 0.006, rot: (rng() - 0.5) * 0.07 });
  var TITLE_COLS = [RED, YELLOW, GREEN, INK, GREEN, RED, INK, YELLOW];

  // ---------- viewport / stage ----------
  var W = 0, H = 0, SX = 0, SY = 0, SS = 0; // stage origin + size (square)
  var isPhone = false;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SS = Math.min(w, h);
    SX = (w - SS) / 2; SY = (h - SS) / 2;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || h > w * 1.15;
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- drawing helpers (stage units) ----------
  function X(u) { return SX + u * SS; }
  function Y(u) { return SY + u * SS; }
  function line(x1, y1, x2, y2, wdt, col) {
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
  }
  function circ(x, y, r, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(X(x), Y(y), r * SS, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function ell(x, y, rx, ry, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(X(x), Y(y), rx * SS, ry * SS, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function rr(x, y, w, h, r) { // rounded-rect path in stage units
    ctx.beginPath();
    ctx.moveTo(X(x + r), Y(y));
    ctx.lineTo(X(x + w - r), Y(y)); ctx.arcTo(X(x + w), Y(y), X(x + w), Y(y + r), r * SS);
    ctx.lineTo(X(x + w), Y(y + h - r)); ctx.arcTo(X(x + w), Y(y + h), X(x + w - r), Y(y + h), r * SS);
    ctx.lineTo(X(x + r), Y(y + h)); ctx.arcTo(X(x), Y(y + h), X(x), Y(y + h - r), r * SS);
    ctx.lineTo(X(x), Y(y + r)); ctx.arcTo(X(x), Y(y), X(x + r), Y(y), r * SS);
    ctx.closePath();
  }

  // ---------- a flat flower ----------
  function drawFlower(f) {
    if (f.stem) line(f.x, f.y + f.r * 0.6, f.x + 0.004, 1.0, 0.006, GREEN);
    ctx.fillStyle = f.col;
    for (var p = 0; p < 6; p++) {
      var a = f.rot + p / 6 * Math.PI * 2;
      ctx.beginPath();
      ctx.ellipse(X(f.x + Math.cos(a) * f.r * 0.62), Y(f.y + Math.sin(a) * f.r * 0.62),
                  f.r * 0.52 * SS, f.r * 0.34 * SS, a, 0, Math.PI * 2);
      ctx.fill();
    }
    circ(f.x, f.y, f.r * 0.34, f.col === YELLOW ? RED : YELLOW);
  }

  // ---------- giant ant (local unit space: width 1, ground at y = +0.37) ----------
  function drawGiantAnt(t) {
    ctx.save();
    ctx.translate(X(0.5), Y(0.60));
    ctx.scale(SS * 0.54, SS * 0.54);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var w1 = Math.sin(t * 1.6) * 0.018, w2 = Math.sin(t * 1.6 + 0.6) * 0.028;
    var hips = [-0.03, 0.05, 0.12], knees = [-0.13, 0.05, 0.24], feet = [-0.20, 0.08, 0.33];
    var i;
    // far legs (darker tone), behind the body
    ctx.strokeStyle = RED_D;
    for (i = 0; i < 3; i++) {
      ctx.lineWidth = 0.019; ctx.beginPath();
      ctx.moveTo(hips[i] - 0.018, 0.045); ctx.lineTo(knees[i] - 0.018, -0.075); ctx.stroke();
      ctx.lineWidth = 0.012; ctx.beginPath();
      ctx.moveTo(knees[i] - 0.018, -0.075); ctx.lineTo(feet[i] - 0.018, 0.37); ctx.stroke();
    }
    // far antenna
    ctx.strokeStyle = RED_D; ctx.lineWidth = 0.011;
    ctx.beginPath(); ctx.moveTo(0.255, -0.115); ctx.lineTo(0.295 + w1 * 0.8, -0.215); ctx.lineTo(0.250 + w2 * 0.8, -0.315); ctx.stroke();
    // gaster with darker band stripes, clipped to the segment
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.ellipse(-0.27, 0.02, 0.20, 0.155, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.ellipse(-0.27, 0.02, 0.20, 0.155, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = RED_D;
    var bx;
    for (bx = -0.40; bx <= -0.16; bx += 0.085) ctx.fillRect(bx, -0.15, 0.034, 0.34);
    ctx.restore();
    // petiole nodes + thorax
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.arc(-0.048, 0.03, 0.028, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-0.012, 0.024, 0.024, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.06, 0.0, 0.115, 0.088, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0.175, -0.01, 0.030, 0, Math.PI * 2); ctx.fill();
    // head
    ctx.beginPath(); ctx.ellipse(0.27, -0.03, 0.105, 0.095, 0, 0, Math.PI * 2); ctx.fill();
    // near antenna (waves)
    ctx.strokeStyle = RED; ctx.lineWidth = 0.013;
    ctx.beginPath(); ctx.moveTo(0.315, -0.105); ctx.lineTo(0.375 + w1, -0.205); ctx.stroke();
    ctx.lineWidth = 0.009;
    ctx.beginPath(); ctx.moveTo(0.375 + w1, -0.205); ctx.lineTo(0.345 + w2, -0.315); ctx.stroke();
    // near legs
    ctx.strokeStyle = RED;
    for (i = 0; i < 3; i++) {
      ctx.lineWidth = 0.021; ctx.beginPath();
      ctx.moveTo(hips[i], 0.055); ctx.lineTo(knees[i], -0.07); ctx.stroke();
      ctx.lineWidth = 0.014; ctx.beginPath();
      ctx.moveTo(knees[i], -0.07); ctx.lineTo(feet[i], 0.37); ctx.stroke();
      ctx.lineWidth = 0.012; ctx.beginPath();
      ctx.moveTo(feet[i], 0.37); ctx.lineTo(feet[i] + 0.035, 0.37); ctx.stroke();
    }
    // friendly face: cream eye + ink pupil, smile, one mandible hook
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.arc(0.30, -0.055, 0.027, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(0.307, -0.058, 0.013, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 0.011;
    ctx.beginPath(); ctx.arc(0.315, -0.012, 0.032, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    ctx.strokeStyle = RED_D; ctx.lineWidth = 0.012;
    ctx.beginPath(); ctx.arc(0.362, 0.028, 0.026, Math.PI * 0.9, Math.PI * 1.7); ctx.stroke();
    ctx.restore();
  }

  // ---------- mini ant glyph (unit space: body length 1, feet near y = +0.32) ----------
  function miniAnt(cx, cy, s, opt) {
    opt = opt || {};
    ctx.save();
    ctx.translate(X(cx), Y(cy));
    ctx.scale(SS * s, SS * s);
    if (opt.flip) ctx.scale(-1, 1);
    ctx.lineCap = 'round';
    var col = opt.col || RED;
    // legs
    ctx.strokeStyle = col; ctx.lineWidth = 0.055;
    var lx = [-0.06, 0.04, 0.13], i;
    for (i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(lx[i], 0.06); ctx.lineTo(lx[i] - 0.05, 0.32); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(lx[i], 0.06); ctx.lineTo(lx[i] + 0.09, 0.32); ctx.stroke();
    }
    // segments
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(-0.27, 0.0, 0.20, 0.145, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.03, 0.0, 0.115, 0.085, 0, 0, Math.PI * 2); ctx.fill();
    // head (soldier: oversized + armored)
    var hs = opt.soldier ? 1.5 : 1.0;
    ctx.fillStyle = opt.soldier ? RED_D : col;
    ctx.beginPath(); ctx.ellipse(0.235, -0.02, 0.098 * hs, 0.09 * hs, 0, 0, Math.PI * 2); ctx.fill();
    if (opt.soldier) { // armor plates + mandible hooks
      ctx.strokeStyle = INK; ctx.lineWidth = 0.035;
      ctx.beginPath(); ctx.arc(0.235, -0.02, 0.115 * hs, Math.PI * 1.05, Math.PI * 1.55); ctx.stroke();
      ctx.beginPath(); ctx.arc(0.235, -0.02, 0.115 * hs, Math.PI * 1.55, Math.PI * 1.98); ctx.stroke();
      ctx.strokeStyle = RED_D; ctx.lineWidth = 0.045;
      ctx.beginPath(); ctx.arc(0.345, 0.045, 0.075, Math.PI * 0.85, Math.PI * 1.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(0.345, -0.085, 0.075, Math.PI * 0.4, Math.PI * 1.15); ctx.stroke();
    }
    // antennae
    ctx.strokeStyle = col; ctx.lineWidth = 0.04;
    ctx.beginPath(); ctx.moveTo(0.27, -0.09 * hs); ctx.lineTo(0.33, -0.20 * hs); ctx.lineTo(0.29, -0.30 * hs); ctx.stroke();
    // eye dot (not on the soldier: armor covers it)
    if (!opt.soldier) { ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(0.265, -0.035, 0.020, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  // ---------- specimen panels ----------
  var PANELS = [
    { x: 0.022, y: 0.125, rot: -0.020, lines: ['El soldado', 'blindado'], kind: 'soldier' },
    { x: 0.773, y: 0.125, rot: 0.015, lines: ['La cortadora', 'de hojas'], kind: 'leaf' },
    { x: 0.022, y: 0.575, rot: 0.025, lines: ['La marabunta'], kind: 'army' },
    { x: 0.773, y: 0.575, rot: -0.018, lines: ['Con zapatillas', 'y mochilas'], kind: 'riders' },
    { x: 0.773, y: 0.350, rot: 0.010, lines: ['Tres tallas,', 'una moneda'], kind: 'size' }
  ];
  var PW = 0.205, PH = 0.210;

  function panelArt(p, t) {
    var ax = p.x + 0.014, ay = p.y + 0.012, aw = PW - 0.028, ah = PH - 0.075; // art region
    var cx = ax + aw / 2;
    if (p.kind === 'soldier') {
      miniAnt(cx - 0.01, ay + ah * 0.44, 0.145, { soldier: true });
    } else if (p.kind === 'leaf') {
      var flut = Math.sin(t * 2.3) * 0.12;
      miniAnt(cx - 0.015, ay + ah * 0.52, 0.125, {});
      // the leaf sail, on a stem from the head, fluttering
      ctx.save();
      ctx.translate(X(cx + 0.028), Y(ay + ah * 0.30));
      ctx.rotate(-0.5 + flut);
      ctx.strokeStyle = GREEN; ctx.lineWidth = 0.005 * SS; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0.030 * SS); ctx.lineTo(0.006 * SS, -0.006 * SS); ctx.stroke();
      ctx.fillStyle = GREEN;
      ctx.beginPath(); ctx.ellipse(0.026 * SS, -0.020 * SS, 0.034 * SS, 0.020 * SS, -0.45, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (p.kind === 'army') {
      // a column of five tiny ants marching in place up the diagonal
      for (var i = 0; i < 5; i++) {
        var u = i / 4;
        var bob = Math.abs(Math.sin(t * 5 + i * 0.9)) * 0.006;
        miniAnt(ax + 0.022 + u * (aw - 0.045), ay + ah * 0.78 - u * ah * 0.42 - bob, 0.052, {});
      }
    } else if (p.kind === 'riders') {
      var acx = cx - 0.01, acy = ay + ah * 0.50;
      miniAnt(acx, acy, 0.135, {});
      // beetle riding the thorax: green shell, ink split line, head dot
      ell(acx + 0.002, acy - 0.030, 0.020, 0.0145, GREEN);
      line(acx - 0.017, acy - 0.033, acx + 0.020, acy - 0.033, 0.0022, INK);
      circ(acx + 0.0235, acy - 0.027, 0.006, INK);
      // mite riding the gaster: tiny cream oval with leg ticks
      ell(acx - 0.036, acy - 0.020, 0.0095, 0.007, CREAM);
      ctx.strokeStyle = INK; ctx.lineWidth = 0.0016 * SS;
      for (var mi = -1; mi <= 1; mi++) {
        line(acx - 0.036 + mi * 0.006, acy - 0.015, acx - 0.036 + mi * 0.009, acy - 0.010, 0.0016, INK);
      }
    } else if (p.kind === 'size') {
      var base = ay + ah * 0.92;
      line(ax + 0.006, base, ax + aw - 0.006, base, 0.0022, INK); // baseline with end ticks
      line(ax + 0.006, base - 0.006, ax + 0.006, base, 0.0022, INK);
      line(ax + aw - 0.006, base - 0.006, ax + aw - 0.006, base, 0.0022, INK);
      var sizes = [0.042, 0.062, 0.086], xs = [ax + 0.026, ax + 0.072, ax + 0.122];
      for (var si = 0; si < 3; si++) miniAnt(xs[si], base - 0.32 * sizes[si], sizes[si], {});
      // the coin, spinning slowly (squash cycle)
      var sq = 0.30 + 0.70 * Math.abs(Math.cos(t * 1.1));
      var coinX = ax + aw - 0.026, coinY = base - 0.034, coinR = 0.031;
      ctx.fillStyle = YELLOW;
      ctx.beginPath(); ctx.ellipse(X(coinX), Y(coinY), coinR * sq * SS, coinR * SS, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 0.0022 * SS;
      ctx.beginPath(); ctx.ellipse(X(coinX), Y(coinY), coinR * sq * SS, coinR * SS, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(X(coinX), Y(coinY), coinR * 0.62 * sq * SS, coinR * 0.62 * SS, 0, 0, Math.PI * 2); ctx.stroke();
      circ(coinX, coinY, 0.004, INK);
    }
  }

  function drawPanel(p, t) {
    ctx.save();
    ctx.translate(X(p.x + PW / 2), Y(p.y + PH / 2));
    ctx.rotate(p.rot);
    ctx.translate(-X(p.x + PW / 2), -Y(p.y + PH / 2));
    rr(p.x, p.y, PW, PH, 0.012);
    ctx.fillStyle = CREAM; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 0.0032 * SS; ctx.stroke();
    panelArt(p, t);
    // label lines, ink, centered
    ctx.fillStyle = INK;
    ctx.font = '700 ' + (0.0165 * SS) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    if (p.lines.length === 2) {
      ctx.fillText(p.lines[0], X(p.x + PW / 2), Y(p.y + PH - 0.034));
      ctx.fillText(p.lines[1], X(p.x + PW / 2), Y(p.y + PH - 0.0135));
    } else {
      ctx.fillText(p.lines[0], X(p.x + PW / 2), Y(p.y + PH - 0.020));
    }
    ctx.restore();
  }

  // ---------- title band: HORMIGAS, one colour per letter ----------
  function drawTitle() {
    rr(0.155, 0.016, 0.69, 0.090, 0.014);
    ctx.fillStyle = CREAM; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 0.0035 * SS; ctx.stroke();
    var word = 'HORMIGAS';
    ctx.font = '900 ' + (0.060 * SS) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (var i = 0; i < 8; i++) {
      var lx = 0.200 + i * 0.075 + 0.0375;
      ctx.save();
      ctx.translate(X(lx), Y(0.061 + titleJit[i].dy));
      ctx.rotate(titleJit[i].rot);
      ctx.fillStyle = TITLE_COLS[i];
      ctx.fillText(word[i], 0, 0);
      ctx.strokeStyle = INK; ctx.lineWidth = 0.0016 * SS;
      ctx.strokeText(word[i], 0, 0);
      ctx.restore();
    }
  }

  // ---------- main draw ----------
  function draw(t) {
    // pin canvas css size every frame (house rule)
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // page ground (sky) everywhere; the square stage sits centered on it
    ctx.fillStyle = SKY; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath(); ctx.rect(SX, SY, SS, SS); ctx.clip();

    // meadow ground band with a scalloped top edge
    ctx.fillStyle = GREEN;
    ctx.fillRect(X(0), Y(0.815), SS, 0.185 * SS);
    for (var si = 0; si < scallops.length; si++) circ(scallops[si].x, 0.815, scallops[si].r, GREEN);

    // flowers and foliage (behind the ant and the cards)
    for (var fi = 0; fi < flowers.length; fi++) drawFlower(flowers[fi]);

    // title band across the top tenth
    drawTitle();

    // the giant ant, center stage
    drawGiantAnt(t);

    // five specimen panels in a loose ring
    for (var pi = 0; pi < PANELS.length; pi++) drawPanel(PANELS[pi], t);

    // riso grain over everything (precomputed specks, drawn directly)
    for (var gi = 0; gi < grain.length; gi++) {
      var gr = grain[gi];
      ctx.strokeStyle = gr.dark ? 'rgba(26,26,26,' + gr.al + ')' : 'rgba(255,255,255,' + gr.al + ')';
      ctx.lineWidth = Math.max(1, 0.0013 * SS);
      ctx.beginPath();
      ctx.moveTo(X(gr.x), Y(gr.y));
      ctx.lineTo(X(gr.x + Math.cos(gr.a) * gr.l / 1080), Y(gr.y + Math.sin(gr.a) * gr.l / 1080));
      ctx.stroke();
    }

    ctx.restore();
  }

  // ---------- deterministic first frame + loop ----------
  draw(PHASE0);
  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    draw(PHASE0 + (now - startStamp) / 1000);
    window.requestAnimationFrame(frame);
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
