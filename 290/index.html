<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.290 Test Tiles</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#191512; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.290 Test Tiles (Sophia Golovanevskaya).
// A museum grid of glaze test tiles on a warm dark ground:
// exactly 4x5 = 20 square tiles, each running its own
// special-effects glaze micro-loop: crater blacks breathing,
// gloop greens creeping, lichen dot colonies pulsing, layered
// blues flowing in bands, gold fleck fields twinkling.
// Dragging swirls the tiles the pointer crosses, curl applied
// to their fields; double-tapping reseeds the whole grid with
// a new dominant glaze family from a deterministic cycle.
// Nothing ever reloads.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#191512', CRATER = '#141312', GLOOP = '#3E9E8E', LICHEN = '#7BA05B', BLUE = '#2E4EA3', GOLD = '#C98A3E';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0; // stored cover-fit transform, used by the pointer handlers and layout
var T = 11.3, lastNow = -1; // clock offset so frame one is mid-loop on every tile
var TAU = Math.PI * 2;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---- glaze families -------------------------------------------------------------
// Five families, in the deterministic double-tap cycle order.
// Each tile is an independent mini-scene: its marks are seeded
// data, drawn directly every frame, no offscreen canvas.
var FAMILIES = ['crater', 'gloop', 'lichen', 'blue', 'gold'];
var tiles = [];
var gridSeed = 290001;
var domIndex = 1; // frame one: gloop green is the dominant family

function buildTiles(seed, dom) {
  var r = rng(seed ^ 0x711E5);
  // the dominant family takes 8 tiles, the other four take 3 each
  var bag = [], f, k;
  for (k = 0; k < 8; k++) bag.push(FAMILIES[dom]);
  for (f = 0; f < FAMILIES.length; f++) {
    if (f === dom) continue;
    for (k = 0; k < 3; k++) bag.push(FAMILIES[f]);
  }
  // seeded shuffle, so the family layout is a fixed mosaic per seed
  for (var i = bag.length - 1; i > 0; i--) {
    var j = Math.floor(r() * (i + 1));
    var tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
  }
  tiles = [];
  for (var n = 0; n < bag.length; n++) {
    var tr = rng((seed + n * 7919 + 101) >>> 0);
    var tile = {
      type: bag[n],
      ph: n * 2.399 + tr() * 1.7, // staggered phases, golden-angle spread plus jitter
      baseA: 0.84 + tr() * 0.16,
      speed: 0.75 + tr() * 0.5,
      sw: 0, rot: 0, swDir: 1,
      craters: [], pores: [], blobs: [], drips: [], dots: [], bands: [], flecks: []
    };
    var m;
    if (tile.type === 'crater') {
      var nc = 8 + Math.floor(tr() * 3);
      for (m = 0; m < nc; m++) tile.craters.push({ x: 0.10 + tr() * 0.80, y: 0.10 + tr() * 0.80, rad: 0.055 + Math.pow(tr(), 1.3) * 0.105, ph: tr() * TAU, depth: 0.4 + tr() * 0.6 });
      for (m = 0; m < 16; m++) tile.pores.push({ x: tr(), y: tr(), rad: 0.010 + tr() * 0.020, ph: tr() * TAU });
    } else if (tile.type === 'gloop') {
      for (m = 0; m < 7; m++) tile.blobs.push({ x: 0.12 + tr() * 0.76, y: 0.12 + tr() * 0.76, rad: 0.10 + tr() * 0.13, ph: tr() * TAU, gold: tr() < 0.3 });
      for (m = 0; m < 5; m++) tile.drips.push({ x: 0.08 + tr() * 0.84, y0: tr() * 0.25, len: 0.20 + tr() * 0.32, w: 0.028 + tr() * 0.034, ph: tr() * TAU });
      for (m = 0; m < 10; m++) tile.dots.push({ x: tr(), y: tr(), rad: 0.010 + tr() * 0.018, ph: tr() * TAU });
    } else if (tile.type === 'lichen') {
      for (var c = 0; c < 5; c++) {
        var cx = 0.16 + tr() * 0.68, cy = 0.16 + tr() * 0.68;
        var nd = 8 + Math.floor(tr() * 3);
        for (m = 0; m < nd; m++) {
          var pick = tr();
          tile.dots.push({
            x: clamp(cx + (tr() * 2 - 1) * 0.15, 0.03, 0.97), y: clamp(cy + (tr() * 2 - 1) * 0.15, 0.03, 0.97),
            rad: 0.020 + tr() * 0.040, ph: tr() * TAU,
            col: pick < 0.38 ? GLOOP : (pick < 0.66 ? GOLD : (pick < 0.86 ? CRATER : BLUE)),
            a: 0.45 + tr() * 0.4
          });
        }
      }
      for (m = 0; m < 5; m++) tile.pores.push({ x: tr(), y: tr(), rad: 0.03 + tr() * 0.05, ph: tr() * TAU });
    } else if (tile.type === 'blue') {
      var bandCols = [GLOOP, GOLD, LICHEN, GLOOP, GOLD, BLUE];
      for (m = 0; m < 6; m++) tile.bands.push({ y: 0.08 + m * 0.165 + tr() * 0.05, th: 0.045 + tr() * 0.05, amp: 0.012 + tr() * 0.022, wl: 5 + tr() * 4, ph: tr() * TAU, col: bandCols[m], a: 0.20 + tr() * 0.20 });
      for (m = 0; m < 24; m++) tile.dots.push({ x: tr(), y: tr(), rad: 0.008 + tr() * 0.016, ph: tr() * TAU, col: tr() < 0.6 ? GOLD : GLOOP, a: 0.3 + tr() * 0.4 });
    } else { // gold fleck
      for (m = 0; m < 64; m++) tile.flecks.push({ x: tr(), y: tr(), rad: 0.008 + Math.pow(tr(), 1.6) * 0.024, ph: tr() * TAU, dash: tr() < 0.3, ang: tr() * Math.PI });
      for (m = 0; m < 6; m++) tile.flecks.push({ x: tr(), y: tr(), rad: 0.028 + tr() * 0.02, ph: tr() * TAU, dash: false, ang: 0 });
      for (m = 0; m < 8; m++) tile.dots.push({ x: tr(), y: tr(), rad: 0.010 + tr() * 0.016, ph: tr() * TAU, col: tr() < 0.55 ? LICHEN : GLOOP, a: 0.4 + tr() * 0.3 });
    }
    tiles.push(tile);
  }
  // asserted count: the grid is exactly 4x5 = 20 tiles, always
  if (tiles.length !== 20) throw new Error('Test Tiles: expected exactly 20 tiles, got ' + tiles.length);
}
buildTiles(gridSeed, domIndex);

// ---- layout -----------------------------------------------------------------------
// The grid is laid out over the visible design rect each frame,
// so the cover-fit crop never cuts a tile: 5 across by 4 down in
// landscape, 4 across by 5 down in portrait. Tiles are square,
// sized to the tighter axis; inter-tile gutters are one even
// measure everywhere, outer margins take up the slack.
var LAY = { x0: 0, y0: 0, s: 100, g: 14, cols: 5, rows: 4 };
function computeLayout() {
  var vx = -OX / S, vy = -OY / S, vw = W / S, vh = H / S;
  var cols = vw >= vh ? 5 : 4;
  var rows = vw >= vh ? 4 : 5;
  var gr = 0.14; // gutter as a fraction of tile size
  var s = Math.min(vw / (cols + (cols - 1) * gr), vh / (rows + (rows - 1) * gr));
  var g = s * gr;
  var gw = cols * s + (cols - 1) * g, gh = rows * s + (rows - 1) * g;
  LAY = { x0: vx + (vw - gw) / 2, y0: vy + (vh - gh) / 2, s: s, g: g, cols: cols, rows: rows };
  return LAY;
}
function tileRect(i) {
  var c = i % LAY.cols, rr = Math.floor(i / LAY.cols);
  return { x: LAY.x0 + c * (LAY.s + LAY.g), y: LAY.y0 + rr * (LAY.s + LAY.g), s: LAY.s };
}

// Swirl mapping: a mark at normalised (nx, ny) in a tile is
// rotated around the tile centre by the tile's accumulated
// swirl angle, stronger toward the rim, so a dragged tile's
// whole field churns instead of sliding.
function swirlPoint(tile, cx, cy, half, nx, ny) {
  var dx = (nx - 0.5) * 2 * half, dy = (ny - 0.5) * 2 * half;
  var d = Math.sqrt(dx * dx + dy * dy) / half; // 0 at centre, about 1.4 at corners
  var a = tile.rot * (0.35 + 0.85 * Math.min(1, d));
  if (a === 0) return [cx + dx, cy + dy];
  var ca = Math.cos(a), sa = Math.sin(a);
  return [cx + dx * ca - dy * sa, cy + dx * sa + dy * ca];
}

// ---- tile drawing -------------------------------------------------------------------
function drawTile(tile, rect) {
  var x = rect.x, y = rect.y, s = rect.s;
  var cx = x + s / 2, cy = y + s / 2, half = s / 2;
  var t = T * tile.speed + tile.ph;
  var i, p, q;

  // lift: a soft dark offset plate under the tile, flat colour only
  ctx.fillStyle = rgba(CRATER, 0.55);
  ctx.fillRect(x + s * 0.03, y + s * 0.04, s, s);

  // base glaze, held to the family colour
  if (tile.type === 'crater' || tile.type === 'gold') ctx.fillStyle = CRATER;
  else if (tile.type === 'gloop') ctx.fillStyle = rgba(GLOOP, tile.baseA);
  else if (tile.type === 'lichen') ctx.fillStyle = rgba(LICHEN, tile.baseA);
  else ctx.fillStyle = rgba(BLUE, tile.baseA);
  ctx.fillRect(x, y, s, s);

  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, s, s); ctx.clip();

  if (tile.type === 'crater') {
    // pores first, small gold-flecked pits in the black
    for (i = 0; i < tile.pores.length; i++) {
      p = tile.pores[i];
      q = swirlPoint(tile, cx, cy, half, p.x, p.y);
      ctx.fillStyle = rgba(GOLD, 0.20 + 0.14 * Math.sin(t * 0.7 + p.ph));
      ctx.beginPath(); ctx.arc(q[0], q[1], p.rad * s, 0, TAU); ctx.fill();
    }
    // craters breathe: a gold rim ring around a near-black floor
    // with one small offset pit, radius pulsing on its own phase
    for (i = 0; i < tile.craters.length; i++) {
      var cr = tile.craters[i];
      q = swirlPoint(tile, cx, cy, half, cr.x, cr.y);
      var br = cr.rad * s * (1 + 0.09 * Math.sin(t * 0.9 + cr.ph));
      ctx.fillStyle = rgba(GOLD, 0.16 + 0.10 * cr.depth);
      ctx.beginPath(); ctx.arc(q[0], q[1], br * 1.3, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba(GOLD, 0.38 + 0.42 * cr.depth);
      ctx.beginPath(); ctx.arc(q[0], q[1], br, 0, TAU); ctx.fill();
      ctx.fillStyle = CRATER;
      ctx.beginPath(); ctx.arc(q[0], q[1], br * 0.64, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba(GROUND, 0.9);
      ctx.beginPath(); ctx.arc(q[0] + br * 0.16, q[1] + br * 0.12, br * 0.26, 0, TAU); ctx.fill();
    }
  } else if (tile.type === 'gloop') {
    // drips creep: translucent lichen streaks whose length
    // swells and eases back on their own phases
    for (i = 0; i < tile.drips.length; i++) {
      var dr = tile.drips[i];
      var len = dr.len * (0.82 + 0.18 * Math.sin(t * 0.7 + dr.ph));
      ctx.strokeStyle = rgba(LICHEN, 0.5);
      ctx.lineWidth = dr.w * s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      var a1 = swirlPoint(tile, cx, cy, half, dr.x, dr.y0);
      var a2 = swirlPoint(tile, cx, cy, half, dr.x, dr.y0 + len);
      ctx.moveTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]);
      ctx.stroke();
    }
    // gloop pools: layered translucent blobs drifting a little
    // on sine paths, so the creep loops exactly
    for (i = 0; i < tile.blobs.length; i++) {
      var bl = tile.blobs[i];
      var bx = bl.x + 0.022 * Math.sin(t * 0.45 + bl.ph);
      var by = bl.y + 0.030 * Math.sin(t * 0.32 + bl.ph * 1.7);
      q = swirlPoint(tile, cx, cy, half, bx, by);
      ctx.fillStyle = bl.gold ? rgba(GOLD, 0.20) : rgba(LICHEN, 0.42);
      ctx.beginPath(); ctx.ellipse(q[0], q[1], bl.rad * s, bl.rad * s * 0.78, bl.ph, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba(CRATER, 0.14);
      ctx.beginPath(); ctx.ellipse(q[0] + bl.rad * s * 0.2, q[1] + bl.rad * s * 0.18, bl.rad * s * 0.55, bl.rad * s * 0.4, bl.ph, 0, TAU); ctx.fill();
    }
    for (i = 0; i < tile.dots.length; i++) {
      p = tile.dots[i];
      q = swirlPoint(tile, cx, cy, half, p.x, p.y);
      ctx.fillStyle = rgba(GOLD, 0.35 + 0.25 * Math.sin(t * 1.1 + p.ph));
      ctx.beginPath(); ctx.arc(q[0], q[1], p.rad * s, 0, TAU); ctx.fill();
    }
  } else if (tile.type === 'lichen') {
    // bare patches of warm ground showing through the crust
    for (i = 0; i < tile.pores.length; i++) {
      p = tile.pores[i];
      q = swirlPoint(tile, cx, cy, half, p.x, p.y);
      ctx.fillStyle = rgba(GROUND, 0.28);
      ctx.beginPath(); ctx.arc(q[0], q[1], p.rad * s, 0, TAU); ctx.fill();
    }
    // lichen colonies: clustered dots in the family colours,
    // each pulsing slowly on its own phase
    for (i = 0; i < tile.dots.length; i++) {
      var dt2 = tile.dots[i];
      q = swirlPoint(tile, cx, cy, half, dt2.x, dt2.y);
      ctx.fillStyle = rgba(dt2.col, dt2.a);
      ctx.beginPath(); ctx.arc(q[0], q[1], dt2.rad * s * (1 + 0.16 * Math.sin(t * 0.8 + dt2.ph)), 0, TAU); ctx.fill();
    }
  } else if (tile.type === 'blue') {
    // layered bands flow sideways: sampled wavy strokes whose
    // phase runs on the tile clock, clipped to the tile
    for (i = 0; i < tile.bands.length; i++) {
      var bd = tile.bands[i];
      ctx.strokeStyle = rgba(bd.col, bd.a);
      ctx.lineWidth = bd.th * s;
      ctx.beginPath();
      for (var k2 = 0; k2 <= 9; k2++) {
        var nx = k2 / 9;
        var ny = bd.y + bd.amp * Math.sin(nx * bd.wl + t * 0.6 + bd.ph);
        q = swirlPoint(tile, cx, cy, half, nx, ny);
        if (k2 === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
      }
      ctx.stroke();
    }
    for (i = 0; i < tile.dots.length; i++) {
      p = tile.dots[i];
      q = swirlPoint(tile, cx, cy, half, p.x, p.y);
      ctx.fillStyle = rgba(p.col, p.a * (0.6 + 0.4 * Math.sin(t * 1.2 + p.ph)));
      ctx.beginPath(); ctx.arc(q[0], q[1], p.rad * s, 0, TAU); ctx.fill();
    }
  } else { // gold fleck
    for (i = 0; i < tile.dots.length; i++) {
      p = tile.dots[i];
      q = swirlPoint(tile, cx, cy, half, p.x, p.y);
      ctx.fillStyle = rgba(p.col, p.a);
      ctx.beginPath(); ctx.arc(q[0], q[1], p.rad * s, 0, TAU); ctx.fill();
    }
    // flecks twinkle: alpha and size breathing on fast phases,
    // the dashes turning very slowly
    for (i = 0; i < tile.flecks.length; i++) {
      var fl = tile.flecks[i];
      q = swirlPoint(tile, cx, cy, half, fl.x, fl.y);
      var tw = 0.5 + 0.5 * Math.sin(t * 1.35 + fl.ph);
      ctx.fillStyle = rgba(GOLD, 0.25 + 0.60 * tw);
      if (fl.dash) {
        var aa = fl.ang + t * 0.15;
        var dx = Math.cos(aa) * fl.rad * s * 1.7, dy = Math.sin(aa) * fl.rad * s * 1.7;
        ctx.strokeStyle = rgba(GOLD, 0.25 + 0.60 * tw);
        ctx.lineWidth = Math.max(1, fl.rad * s * 0.8);
        ctx.beginPath(); ctx.moveTo(q[0] - dx, q[1] - dy); ctx.lineTo(q[0] + dx, q[1] + dy); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(q[0], q[1], fl.rad * s * (0.8 + 0.35 * tw), 0, TAU); ctx.fill();
      }
    }
  }

  ctx.restore();

  // tile edge: a fine line so each test tile reads as its own
  // object against the ground and its neighbours
  ctx.strokeStyle = (tile.type === 'crater' || tile.type === 'gold') ? rgba(GOLD, 0.32) : rgba(CRATER, 0.42);
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, s - 2, s - 2);
}

// ---- drawing --------------------------------------------------------------------------
function draw() {
  var vx = -OX / S, vy = -OY / S, vw = W / S, vh = H / S;
  ctx.fillStyle = GROUND;
  ctx.fillRect(vx - 60, vy - 60, vw + 120, vh + 120);
  computeLayout();
  for (var i = 0; i < tiles.length; i++) drawTile(tiles[i], tileRect(i));
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction: drag-disturb and double-tap reseed --------------------------------------
// Dragging applies curl to every tile the pointer crosses: the
// tile gains swirl in the direction the drag curls around its
// centre, and its field keeps churning while the swirl decays.
// A double tap (two taps within 340ms and 90 design px) reseeds
// the whole grid from the next seed and advances the dominant
// glaze family one step in its deterministic cycle. Neither
// action ever reloads the page.
var dragging = false, lastPX = 0, lastPY = 0, downAt = 0, downX = 0, downY = 0, lastDownAt = -10000, lastDownX = 0, lastDownY = 0;
function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function nowMs() {
  if (typeof performance !== 'undefined' && performance.now) return performance.now();
  return Date.now();
}
function disturb(px, py, dx, dy) {
  for (var i = 0; i < tiles.length; i++) {
    var r = tileRect(i);
    var cx = r.x + r.s / 2, cy = r.y + r.s / 2;
    var ddx = px - cx, ddy = py - cy;
    var dist = Math.sqrt(ddx * ddx + ddy * ddy);
    if (dist > r.s * 0.78) continue;
    var cross = dx * ddy - dy * ddx;
    tiles[i].swDir = cross >= 0 ? 1 : -1;
    tiles[i].sw = Math.min(2.6, tiles[i].sw + 0.55 + 0.35 * (1 - dist / (r.s * 0.78)));
  }
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  var now = nowMs();
  if (now - lastDownAt < 340 && Math.abs(p[0] - lastDownX) < 90 && Math.abs(p[1] - lastDownY) < 90) {
    lastDownAt = -10000;
    dragging = false;
    domIndex = (domIndex + 1) % FAMILIES.length;
    gridSeed = (gridSeed * 1664525 + 1013904223) >>> 0;
    buildTiles(gridSeed, domIndex);
    return;
  }
  lastDownAt = now; lastDownX = p[0]; lastDownY = p[1];
  dragging = true; downAt = now; downX = p[0]; downY = p[1];
  lastPX = p[0]; lastPY = p[1];
  disturb(p[0], p[1], 1, 0);
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dx = p[0] - lastPX, dy = p[1] - lastPY;
  if (dx !== 0 || dy !== 0) disturb(p[0], p[1], dx, dy);
  lastPX = p[0]; lastPY = p[1];
});
canvas.addEventListener('pointerup', function () { dragging = false; });
canvas.addEventListener('pointercancel', function () { dragging = false; });

// ---- frame ----------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: the field fills the frame edge to edge; the layout
  // is computed over the visible rect so no tile is ever cropped
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  computeLayout();
  if (dt > 0) {
    for (var i = 0; i < tiles.length; i++) {
      var tl = tiles[i];
      if (tl.sw > 0.001) {
        tl.rot += tl.sw * dt * 1.9 * tl.swDir;
        tl.sw *= Math.pow(0.30, dt);
      } else tl.sw = 0;
    }
  }
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
