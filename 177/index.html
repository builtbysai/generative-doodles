<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.177 Groovy Hyperbolic Field</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E0E12; }
  canvas { display:block; touch-action:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font:12px system-ui, sans-serif; color:#8A76B0; opacity:0.55;
    pointer-events:none; letter-spacing:0.04em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag to move the light</div>
<script>
(function () {
'use strict';
// No.177 Groovy Hyperbolic Field (Fathauer). A heightfield relief:
// exponential radial growth, angular grooves ridged like cactus ribs,
// a saddle term for negative curvature, shaded Lambertian against a
// light the viewer drags around. Idle, one growth ring pulses outward
// every 20 seconds. Rendered as a grid of small filled cells; only the
// lighting animates.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0;
var SHADOW = [30, 26, 46], LIT = [90, 74, 122], HI = [138, 118, 176];
var NX = 128;
var lightAz = -0.7, lightEl = 0.9;
var dragging = false, lastX = 0, lastY = 0;

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function heightAt(u, v, ph) {
  var r = Math.sqrt(u * u + v * v);
  var th = Math.atan2(v, u);
  var env = Math.exp(-0.85 * r);
  var groove = Math.pow(1 - Math.abs(Math.sin(13 * th + 0.7 * Math.sin(3 * th))), 1.4);
  groove = 0.55 + (groove - 0.55) * clamp01(r / 0.22); // calm the singular centre
  var ring = 0.80 + 0.20 * Math.sin(22 * r - ph);
  var saddle = 0.38 * (u * u - v * v) * Math.exp(-1.3 * r);
  return (0.22 + 1.15 * env) * groove * ring + saddle + 0.30 * env;
}

function mix(a, b, t) {
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' +
                  Math.round(a[1] + (b[1] - a[1]) * t) + ',' +
                  Math.round(a[2] + (b[2] - a[2]) * t) + ')';
}

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = '#0E0E12';
  ctx.fillRect(0, 0, W, H);
  var ph = (now / 20000) * Math.PI * 2; // one ring per 20s
  var S = Math.min(W, H) * 0.62;
  var cx = W * 0.44, cy = H * 0.46;
  var lx = Math.cos(lightEl) * Math.cos(lightAz);
  var ly = Math.cos(lightEl) * Math.sin(lightAz);
  var lz = Math.sin(lightEl);
  var ny = Math.max(2, Math.round(NX * H / W));
  var cw = W / NX, ch = H / ny;
  var du = (cw / S) * 1.6, dv = (ch / S) * 1.6;
  for (var j = 0; j < ny; j++) {
    var y = (j + 0.5) * ch;
    var v = (y - cy) / S;
    for (var i = 0; i < NX; i++) {
      var x = (i + 0.5) * cw;
      var u = (x - cx) / S;
      var hC = heightAt(u, v, ph);
      var gx = (heightAt(u + du, v, ph) - heightAt(u - du, v, ph)) / (2 * du);
      var gy = (heightAt(u, v + dv, ph) - heightAt(u, v - dv, ph)) / (2 * dv);
      var inv = 1 / Math.sqrt(gx * gx + gy * gy + 1);
      var diff = Math.max(0, (-gx * lx - gy * ly + lz) * inv);
      var col;
      if (diff < 0.55) col = mix(SHADOW, LIT, diff / 0.55);
      else col = mix(LIT, HI, Math.pow((diff - 0.55) / 0.45, 1.6));
      ctx.fillStyle = col;
      ctx.fillRect(i * cw - 0.5, j * ch - 0.5, cw + 1, ch + 1);
    }
  }
}

canvas.addEventListener('pointerdown', function (e) {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  lightAz += (e.clientX - lastX) * 0.01;
  lightEl += (e.clientY - lastY) * 0.008;
  if (lightEl < 0.25) lightEl = 0.25;
  if (lightEl > 1.35) lightEl = 1.35;
  lastX = e.clientX; lastY = e.clientY;
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', endDrag);

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
