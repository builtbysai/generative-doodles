<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three States</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #23262B;
    overflow: hidden;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // ------------------------------------------------------------------
  // Palette (strict). Everything drawn is one of these tones or a
  // blend of two of them.
  // ------------------------------------------------------------------
  var SILVER = [168, 184, 196];   // #A8B8C4 reflection band
  var HIGHLIGHT = [232, 236, 240]; // #E8ECF0 mirrored highlight
  var WARM = [232, 220, 196];     // #E8DCC4 transmission band
  var GRAPHITE = [35, 38, 43];    // #23262B absorption band
  var VIOLET = [58, 58, 74];      // #3A3A4A absorption undertone
  var IRIS_V = [122, 111, 168];   // #7A6FA8 transition line
  var IRIS_G = [216, 180, 106];   // #D8B46A transition line

  function mix(a, b, u) {
    return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(u) {
    u = clamp(u, 0, 1);
    return u * u * (3 - 2 * u);
  }
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }

  // Seeded RNG (mulberry32): all grain and background detail is
  // precomputed from this one stream at load.
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var z = s;
      z = Math.imul(z ^ (z >>> 15), z | 1);
      z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
      return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(7610193);

  // ------------------------------------------------------------------
  // Grain dots for the two iridescent seams: precomputed unit-space
  // offsets from a boundary, a specced color, a size and a shimmer
  // phase. They are drawn hugging boundary i at draw time, so they
  // follow the bands as the boundaries breathe and are dragged.
  // ------------------------------------------------------------------
  var GRAIN = [];
  for (var gi = 0; gi < 460; gi++) {
    GRAIN.push({
      band: rng() < 0.5 ? 0 : 1,
      dx: ((rng() * 2 - 1) + (rng() * 2 - 1)) * 0.0075,
      y: rng(),
      size: 0.8 + rng() * 1.7,
      gold: rng() < 0.45,
      base: 0.10 + rng() * 0.30,
      phase: rng() * Math.PI * 2
    });
  }
  // A few stray film-grain flecks inside the absorption band, so the
  // soot reads as a coating and not a flat fill.
  var SOOT = [];
  for (var si = 0; si < 130; si++) {
    SOOT.push({
      x: 0.68 + rng() * 0.31,
      y: rng(),
      size: 0.7 + rng() * 1.4,
      base: 0.05 + rng() * 0.12,
      phase: rng() * Math.PI * 2
    });
  }

  // ------------------------------------------------------------------
  // The background gallery, an analytic function of unit position.
  // Deliberately unfocused: every shape is a smooth falloff, no hard
  // edge anywhere. `clarity` scales how strongly the warm arch glow
  // reads (the transmission band's clearness).
  // ------------------------------------------------------------------
  function bgColor(u, v, clarity) {
    var c = mix(GRAPHITE, VIOLET, 0.22);
    // Far wall band, high up: a whisper of silver.
    var wall = smooth((v - 0.05) / 0.05) * (1 - smooth((v - 0.17) / 0.05));
    c = mix(c, SILVER, wall * 0.10);
    // The arch glow: an ellipse of warm light, the room's one event.
    var ax = (u - 0.60) / 0.21, ay = (v - 0.44) / 0.31;
    var glow = Math.exp(-(ax * ax + ay * ay) * 1.7);
    c = mix(c, WARM, glow * 0.52 * clarity);
    // A cooler core inside the arch.
    var cx2 = (u - 0.60) / 0.11, cy2 = (v - 0.44) / 0.17;
    var core = Math.exp(-(cx2 * cx2 + cy2 * cy2) * 1.6);
    c = mix(c, SILVER, core * 0.16 * clarity);
    // Two plinth silhouettes along the floor: read by their rim light.
    c = plinth(c, u, v, 0.55, 0.70, 0.80);
    c = plinth(c, u, v, 0.76, 0.87, 0.85);
    // Floor: a violet settling below the sight line.
    c = mix(c, VIOLET, smooth((v - 0.88) / 0.08) * 0.16);
    return c;
  }
  function plinth(c, u, v, x0, x1, top) {
    var inside = smooth((u - x0) / 0.02) * (1 - smooth((u - x1) / 0.02)) * smooth((v - top) / 0.02);
    c = mix(c, GRAPHITE, inside * 0.5);
    var rim = inside * Math.exp(-Math.pow((v - top - 0.012) / 0.010, 2));
    c = mix(c, SILVER, rim * 0.22);
    return c;
  }

  // ------------------------------------------------------------------
  // The three states, each an analytic color at (u, v).
  // ------------------------------------------------------------------
  function reflectionColor(u, v, streakDepth) {
    // Silver-blue, dimming toward the floor line.
    var c = mix(SILVER, GRAPHITE, 0.16 * v);
    // The mirrored arch: the room's glow flipped left-for-right and
    // thinned to a sheen.
    var ax = ((1 - u) - 0.60) / 0.21, ay = (v - 0.44) / 0.31;
    var glow = Math.exp(-(ax * ax + ay * ay) * 1.7);
    c = mix(c, HIGHLIGHT, glow * 0.20);
    // The bright mirrored streak: a diagonal of hard light, with a
    // fainter companion parallel to it.
    var d1 = (v - (0.72 - 0.55 * u)) / 0.045;
    var d2 = (v - (0.83 - 0.55 * u)) / 0.06;
    var s = Math.exp(-d1 * d1) + 0.35 * Math.exp(-d2 * d2);
    c = mix(c, HIGHLIGHT, clamp(s * streakDepth, 0, 1) * 0.9);
    return c;
  }
  function transmissionColor(u, v, clarity) {
    // The background itself, warmed: the one honest window.
    var c = bgColor(u, v, clarity);
    c = mix(c, WARM, 0.15);
    return c;
  }
  function absorptionColor(u, v) {
    // Graphite with a violet undertone, and only a ghost of the room.
    var c = mix(GRAPHITE, VIOLET, 0.38);
    var ghost = bgColor(u, v, 0.5);
    c = mix(c, ghost, 0.06);
    // A low violet sheen crawling down the soot.
    var sheen = Math.exp(-Math.pow((v - (0.25 + 0.35 * u)) / 0.16, 2));
    c = mix(c, VIOLET, sheen * 0.12);
    return c;
  }

  // ------------------------------------------------------------------
  // Band boundaries. Rest positions are the thirds; an idle 12 s
  // breathing cycle drifts them a little; a horizontal drag adds an
  // offset (boundary 1 takes it fully, boundary 2 at half rate, so
  // dragging right widens reflection and dragging left widens
  // transmission). On release the offset decays exponentially with
  // tau = 2.2 s, so the bands are home in about six seconds. All of
  // it is a closed-form function of the recorded drag events and t.
  // ------------------------------------------------------------------
  var REST1 = 0.34, REST2 = 0.67, BLEED = 0.045;
  var drag = null;        // {startX, startOffset, target}
  var release = null;     // {t, offset}
  var nowT = 0;

  function dragOffset(t) {
    if (drag) return drag.target;
    if (release) return release.offset * Math.exp(-(t - release.t) / 2.2);
    return 0;
  }
  function boundaries(t) {
    var off = dragOffset(t);
    var b1 = REST1 + 0.012 * Math.sin(2 * Math.PI * t / 12) + off;
    var b2 = REST2 + 0.010 * Math.sin(2 * Math.PI * t / 12 + 1.3) + off * 0.5;
    b1 = clamp(b1, 0.08, 0.62);
    b2 = clamp(b2, b1 + 0.12, 0.94);
    return [b1, b2];
  }

  function onDown(x) {
    var startOffset = dragOffset(nowT);
    release = null;
    drag = { startX: x, startOffset: startOffset, target: startOffset };
  }
  function onMove(x) {
    if (!drag || W <= 0) return;
    drag.target = clamp(drag.startOffset + (x - drag.startX) / W * 1.15, -0.30, 0.30);
  }
  function onUp() {
    if (!drag) return;
    release = { t: nowT, offset: drag.target };
    drag = null;
  }

  // ------------------------------------------------------------------
  // Sizing: Visual Viewport API, listeners on both it and window.
  // Phone detection via window.screen physical size, aspect fallback.
  // ------------------------------------------------------------------
  var W = 0, H = 0, DPR = 1;
  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }
  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  // ------------------------------------------------------------------
  // Draw. The pane is rendered as narrow vertical strips crossed by
  // horizontal rows: per column the three band weights come from
  // smoothstep masks across the bleed zone (stepped smooth masks, no
  // gradient fills, no filter blur), and per cell the three state
  // colors are blended by those weights. The seams then get their
  // iridescent line and grain on top.
  // ------------------------------------------------------------------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var b = boundaries(t);
    var b1 = b[0], b2 = b[1];
    var widthT = b2 - b1;
    var clarity = clamp(widthT / 0.33, 0.4, 1.3);
    var streakDepth = (0.78 + 0.45 * clamp((b1 - REST1) / 0.28, -0.4, 1)) *
      (0.93 + 0.07 * Math.sin(2 * Math.PI * t / 12));

    var cw = isPhone() ? 3 : 4;
    var rh = Math.max(6, Math.round(H / 120));
    var cols = Math.ceil(W / cw);
    var rows = Math.ceil(H / rh);

    for (var i = 0; i < cols; i++) {
      var u = (i + 0.5) / cols;
      var s1 = smooth((u - (b1 - BLEED)) / (2 * BLEED));
      var s2 = smooth((u - (b2 - BLEED)) / (2 * BLEED));
      var wRef = 1 - s1, wTr = s1 * (1 - s2), wAb = s2;
      var seam = Math.exp(-Math.pow((u - b1) / 0.006, 2)) + Math.exp(-Math.pow((u - b2) / 0.006, 2));
      var x = i * cw;
      for (var j = 0; j < rows; j++) {
        var v = (j + 0.5) / rows;
        var cr = reflectionColor(u, v, streakDepth);
        var ct = transmissionColor(u, v, clarity);
        var ca = absorptionColor(u, v);
        var c = [
          cr[0] * wRef + ct[0] * wTr + ca[0] * wAb,
          cr[1] * wRef + ct[1] * wTr + ca[1] * wAb,
          cr[2] * wRef + ct[2] * wTr + ca[2] * wAb
        ];
        if (seam > 0.003) {
          var sc = mix(IRIS_V, IRIS_G, 0.5 + 0.5 * Math.sin(v * 9.4 + u * 4.0));
          c = mix(c, sc, clamp(seam, 0, 1) * 0.7);
        }
        ctx.fillStyle = rgb(c);
        ctx.fillRect(x, j * rh, cw + 0.6, rh + 0.6);
      }
    }

    // Iridescent grain along the seams: seeded dots, shimmering.
    var gScale = Math.min(W, H) / 720;
    for (var k = 0; k < GRAIN.length; k++) {
      var g = GRAIN[k];
      var bx = (g.band === 0 ? b1 : b2) + g.dx;
      if (bx < 0 || bx > 1) continue;
      var a = g.base * (0.72 + 0.28 * Math.sin(2 * Math.PI * t / 2.7 + g.phase));
      ctx.fillStyle = rgb(mix(GRAPHITE, g.gold ? IRIS_G : IRIS_V, 1));
      ctx.globalAlpha = a;
      var gs = g.size * (0.8 + gScale);
      ctx.fillRect(bx * W - gs / 2, g.y * H - gs / 2, gs, gs);
    }
    ctx.globalAlpha = 1;

    // Soot flecks in the absorption band.
    for (var q = 0; q < SOOT.length; q++) {
      var sdot = SOOT[q];
      var sx = sdot.x + (b2 - REST2) * 0.35;
      var sa = sdot.base * (0.7 + 0.3 * Math.sin(2 * Math.PI * t / 3.4 + sdot.phase));
      ctx.fillStyle = rgb(VIOLET);
      ctx.globalAlpha = sa;
      var ss = sdot.size * (0.8 + gScale);
      ctx.fillRect(sx * W - ss / 2, sdot.y * H - ss / 2, ss, ss);
    }
    ctx.globalAlpha = 1;

    // Subtle frame edges at the pane boundary.
    ctx.strokeStyle = 'rgba(35,38,43,0.40)';
    ctx.lineWidth = 10;
    ctx.strokeRect(5, 5, W - 10, H - 10);
    ctx.strokeStyle = 'rgba(232,236,240,0.14)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(11, 11, W - 22, H - 22);

    if (document.body && document.body.style) document.body.style.background = '#23262B';
  }

  // ------------------------------------------------------------------
  // Pointer controls: horizontal drag only. A tap does nothing, by
  // the prompt's word: tap is not a control. Never a reload.
  // ------------------------------------------------------------------
  function evtX(e) {
    if (e.clientX !== undefined) return e.clientX;
    if (e.touches && e.touches.length) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
    return 0;
  }
  canvas.addEventListener('pointerdown', function (e) { onDown(evtX(e)); });
  window.addEventListener('pointermove', function (e) { onMove(evtX(e)); });
  window.addEventListener('pointerup', function () { onUp(); });
  window.addEventListener('pointercancel', function () { onUp(); });
  canvas.addEventListener('touchstart', function (e) { onDown(evtX(e)); }, { passive: true });
  window.addEventListener('touchmove', function (e) { onMove(evtX(e)); }, { passive: true });
  window.addEventListener('touchend', function () { onUp(); });

  // Inert QA hook (house convention): ?seed=tNN draws frame one at
  // cycle time NN seconds. Without the parameter the piece starts
  // at t = 0.
  var startT = 0;
  var searchStr = (window.location && window.location.search) ||
    (typeof location !== 'undefined' ? location.search : '') || '';
  var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(searchStr);
  if (m) startT = parseFloat(m[1]);

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(startT); });
  }
  window.addEventListener('resize', function () { resize(); draw(startT); });

  // Frame one: the synchronous draw at t = 0.
  nowT = startT;
  draw(startT);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts;
      nowT = startT + (ts - t0) / 1000;
      draw(nowT);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
