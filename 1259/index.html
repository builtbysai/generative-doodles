<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Making Time (Boredom Engine)</title>
<style>
  html, body { margin: 0; padding: 0; background: #43433F; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seed ----------
  var seedBase = 1259;
  try {
    var qs = (window.location && window.location.search) || '';
    var sm = /[?&]seed=(\d+)/.exec(qs);
    if (sm) seedBase = parseInt(sm[1], 10);
  } catch (e) {}

  function mix(n) {
    var x = (n | 0) ^ 0x9E3779B9;
    x = Math.imul(x ^ (x >>> 16), 0x21F0AAAD);
    x = Math.imul(x ^ (x >>> 15), 0x735A2D97);
    x = (x ^ (x >>> 15)) >>> 0;
    return x / 4294967296;
  }
  function H(a, b, c) {
    return mix((a * 374761393 + b * 668265263 + c * 1274126177 +
                seedBase * 974711) | 0);
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function clamp01(v) { return clamp(v, 0, 1); }
  function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  // ---------- palette ----------
  var GREY = '#8A8A86', PAPER_WHITE = '#ECE9E2', BRASS = '#A87F3F',
      BRASS_D = '#7A5C2A', SUIT = '#2A2A28', FORM = '#D8D2C2',
      SKIN = '#B8A88F', WALL_R = '#DDD9CF', FLOOR = '#6F6F6B',
      FLOOR_F = '#5B5B57', CEIL = '#43433F', PANEL = '#3C3C38';

  // ---------- gear train (teeth 12 / 8 / 16, exact mesh ratios) ----------
  var OM_A = Math.PI * 2 / 30;            // gear A: one rev per 30 s
  var OM_B = -OM_A * 12 / 8;              // meshed with A
  var OM_C = -OM_B * 8 / 16;              // meshed with B

  // ---------- state ----------
  var curT = 0;
  var gateOpen = false;
  var dropT = -1;
  var dropPos = null;
  var phoneDrag = null;                   // {dx, dy, x, y}
  var phoneReturn = null;                 // {x, y, t0}
  var downInfo = null;                    // {x, y, t, moved}
  var nudges = [null, null, null];        // per specialist {pt, fx, fy, x, y, face}
  var planeT = [];                        // piece-times of filed-form taps
  var ENTRY = [2, 9, 17];                 // performance-times specialists enter

  // ---------- layout (rebuilt on resize) ----------
  var W = 0, Hh = 0, DPR = 1, phone = false, U = 0;
  var L = null;                           // geometry
  var SPECS = [];                         // per-specialist script data

  function floorYAt(x) {
    // wall/floor boundary height at a given x (two wall planes)
    if (x <= L.cornerX) return lerp(0.78 * Hh, 0.70 * Hh, x / L.cornerX);
    return lerp(0.70 * Hh, 0.74 * Hh, (x - L.cornerX) / (W - L.cornerX));
  }

  function buildLayout() {
    U = Math.min(W, Hh);
    var cornerX = 0.60 * W;
    var clockX = 0.44 * W, clockY = 0.315 * Hh, R = 0.112 * U;
    var rA = 0.044 * U, rB = rA * 8 / 12, rC = rA * 16 / 12;
    var gearY = clockY + R + 0.062 * U;
    var gB = { x: clockX - 0.01 * W, y: gearY };
    var gA = { x: gB.x - (rA + rB), y: gearY };
    var gC = { x: gB.x + (rB + rC), y: gearY };
    var pw = clamp(0.09 * W, phone ? 52 : 44, 84);
    var ph = pw * 1.9;
    var bw = Math.max(0.17 * W, pw * 1.6), bh = Math.max(0.11 * Hh, ph * 0.74);
    L = {
      cornerX: cornerX,
      clockX: clockX, clockY: clockY, R: R,
      gearY: gearY,
      gears: [
        { x: gA.x, y: gA.y, teeth: 12, pr: rA, om: OM_A, ph: 0 },
        { x: gB.x, y: gB.y, teeth: 8,  pr: rB, om: OM_B, ph: Math.PI - Math.PI / 8 },
        { x: gC.x, y: gC.y, teeth: 16, pr: rC, om: OM_C, ph: Math.PI - Math.PI / 16 }
      ],
      panel: {
        x: gA.x - rA - 0.035 * U, y: clockY - R * 0.35,
        w: (gC.x + rC) - (gA.x - rA) + 0.07 * U,
        h: (gearY + rC + 0.030 * U) - (clockY - R * 0.35)
      },
      pend: { x: clockX, y: gearY + rC * 0.55, len: 0.15 * U, bob: 0.026 * U },
      box: { x: 0.045 * W, y: 0.055 * Hh, w: bw, h: bh },
      phoneC: { x: 0.50 * W, y: 0.68 * Hh },
      phoneW: pw, phoneH: ph,
      desk: { x: 0.055 * W, y: 0.745 * Hh, w: 0.20 * W },
      tray: { x: 0.615 * W, y: 0.695 * Hh },
      fh: 0.15 * Hh
    };
    L.boxPhone = { x: L.box.x + L.box.w * 0.34, y: L.box.y + L.box.h / 2 };
  }

  // ---------- specialist scripts (closed-form segment cycles) ----------
  function segWalk(segs, from, to, speed, carry) {
    var dx = to.x - from.x, dy = to.y - from.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    segs.push({ kind: 'walk', from: from, to: to, dur: Math.max(0.8, d / speed),
                carry: !!carry, distPx: d });
    return to;
  }
  function segAct(segs, kind, at, dur, face) {
    segs.push({ kind: kind, at: at, dur: dur, face: face });
    return at;
  }
  function finishSegs(segs) {
    var acc = 0, dropEnd = -1;
    for (var i = 0; i < segs.length; i++) {
      segs[i].start = acc; acc += segs[i].dur;
      if (segs[i].kind === 'drop') dropEnd = acc;
    }
    return { segs: segs, len: acc, dropEnd: dropEnd };
  }
  function buildScripts() {
    SPECS = [];
    var waits = [
      { x: 0.80 * W, y: 0.775 * Hh }, { x: 0.875 * W, y: 0.79 * Hh },
      { x: 0.715 * W, y: 0.79 * Hh }
    ];
    var clockS = { x: L.clockX - 0.06 * W, y: 0.82 * Hh };
    var stareS = { x: 0.845 * W, y: 0.735 * Hh };
    var deskS  = { x: 0.275 * W, y: 0.815 * Hh };
    var trayS  = { x: 0.58 * W, y: 0.815 * Hh };
    // ritual blocks: 0 = clock adjust, 1 = wall stare, 2 = file a form.
    // Each specialist runs the blocks in a rotated order so the three are
    // almost never standing on the same spot at the same time.
    function addBlock(segs, p, which, speed) {
      if (which === 0) {
        p = segWalk(segs, p, clockS, speed);
        p = segAct(segs, 'adjust', clockS, 4, 1);
      } else if (which === 1) {
        p = segWalk(segs, p, stareS, speed);
        p = segAct(segs, 'stare', stareS, 8, 1);
      } else {
        p = segWalk(segs, p, deskS, speed);
        p = segAct(segs, 'pickup', deskS, 2, -1);
        p = segWalk(segs, p, trayS, speed, true);
        p = segAct(segs, 'drop', trayS, 1.2, 1);
      }
      return p;
    }
    for (var i = 0; i < 3; i++) {
      var speed = (0.046 + 0.008 * H(i, 12, 0)) * W;
      var wait = waits[i];
      var order = [i % 3, (i + 1) % 3, (i + 2) % 3];
      // steady cycle
      var sn = [], p;
      p = segAct(sn, 'stand', wait, 5 + 4 * H(i, 11, 0), -1);
      for (var b = 0; b < 3; b++) p = addBlock(sn, p, order[b], speed);
      p = segWalk(sn, p, wait, speed);
      var steady = finishSegs(sn);
      // first cycle: entry walk from an edge, short stand, then the ritual loop
      var s0 = [];
      var edge = { x: (i % 2 === 0 ? -0.06 * W : 1.06 * W), y: wait.y };
      p = segWalk(s0, edge, wait, speed);
      p = segAct(s0, 'stand', wait, 3, -1);
      for (var b2 = 0; b2 < 3; b2++) p = addBlock(s0, p, order[b2], speed);
      p = segWalk(s0, p, wait, speed);
      var first = finishSegs(s0);
      SPECS.push({ entry: ENTRY[i], first: first, steady: steady });
    }
  }

  function segPose(seg, local) {
    if (seg.kind === 'walk') {
      var steps = Math.max(2, Math.round(seg.dur * 6));
      var sp = clamp01(Math.floor(clamp01(local / seg.dur) * steps) / steps);
      var x = lerp(seg.from.x, seg.to.x, sp), y = lerp(seg.from.y, seg.to.y, sp);
      var face = seg.face;
      if (face === undefined) face = (seg.to.x - seg.from.x) >= 0 ? 1 : -1;
      return { x: x, y: y, face: face, walking: sp < 1,
               phase: seg.distPx * sp * 0.055,
               holding: seg.carry, armUp: false, back: false };
    }
    var holding = false;
    if (seg.kind === 'pickup') holding = local > seg.dur / 2;
    if (seg.kind === 'drop') holding = local < seg.dur * 0.7;
    return { x: seg.at.x, y: seg.at.y, face: seg.face, walking: false, phase: 0,
             holding: holding, armUp: seg.kind === 'adjust',
             back: seg.kind === 'stare' };
  }
  function poseInSegs(set, lt) {
    var segs = set.segs;
    for (var i = 0; i < segs.length; i++) {
      if (lt < segs[i].start + segs[i].dur || i === segs.length - 1) {
        return segPose(segs[i], lt - segs[i].start);
      }
    }
    return segPose(segs[segs.length - 1], segs[segs.length - 1].dur);
  }
  function scriptPos(i, pt) {
    var s = SPECS[i];
    if (pt < s.entry) return null;
    var lt = pt - s.entry;
    if (lt < s.first.len) return poseInSegs(s.first, lt);
    return poseInSegs(s.steady, (lt - s.first.len) % s.steady.len);
  }
  function posAt(i, pt) {
    var base = scriptPos(i, pt);
    if (!base) return null;
    var n = nudges[i];
    if (!n || pt < n.pt) return base;
    var age = pt - n.pt;
    if (age < 2.5) {
      var steps = 15, sp = clamp01(Math.floor(clamp01(age / 2.5) * steps) / steps);
      var dx = n.x - n.fx, dy = n.y - n.fy;
      var d = Math.sqrt(dx * dx + dy * dy);
      return { x: lerp(n.fx, n.x, sp), y: lerp(n.fy, n.y, sp),
               face: dx >= 0 ? 1 : -1, walking: sp < 1, phase: d * sp * 0.055,
               holding: false, armUp: false, back: false };
    }
    if (age < 5) {
      return { x: n.x, y: n.y, face: n.face, walking: false, phase: 0,
               holding: false, armUp: false, back: false };
    }
    if (age < 6.5) {
      var st2 = 9, sq = clamp01(Math.floor(clamp01((age - 5) / 1.5) * st2) / st2);
      var dx2 = base.x - n.x, dy2 = base.y - n.y;
      var d2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
      return { x: lerp(n.x, base.x, sq), y: lerp(n.y, base.y, sq),
               face: dx2 >= 0 ? 1 : -1, walking: sq < 1, phase: d2 * sq * 0.055,
               holding: false, armUp: false, back: false };
    }
    return base;
  }
  function filedCount(pt) {
    var total = 0;
    for (var i = 0; i < 3; i++) {
      var s = SPECS[i], lt = pt - s.entry;
      if (lt < 0) continue;
      if (lt >= s.first.dropEnd) {
        total += 1;
        if (lt > s.first.len) {
          var rem = lt - s.first.len;
          total += Math.floor(rem / s.steady.len) +
                   (rem % s.steady.len >= s.steady.dropEnd ? 1 : 0);
        }
      }
    }
    return total;
  }

  // ---------- planes ----------
  function airborneCount(t) {
    var n = 0;
    for (var i = 0; i < planeT.length; i++) if (t - planeT[i] < 6) n++;
    return n;
  }
  function landedCount(t) {
    var n = 0;
    for (var i = 0; i < planeT.length; i++) if (t - planeT[i] >= 6) n++;
    return n;
  }

  // ---------- phone ----------
  function phonePosAt(t) {
    if (gateOpen) {
      if (t < dropT + 0.5) {
        var s = smooth((t - dropT) / 0.5);
        return { x: lerp(dropPos.x, L.boxPhone.x, s),
                 y: lerp(dropPos.y, L.boxPhone.y, s), scale: 1 - 0.4 * s };
      }
      return { x: L.boxPhone.x, y: L.boxPhone.y, scale: 0.6 };
    }
    if (phoneDrag) return { x: phoneDrag.x, y: phoneDrag.y, scale: 1 };
    if (phoneReturn && t < phoneReturn.t0 + 0.35) {
      var s2 = smooth((t - phoneReturn.t0) / 0.35);
      return { x: lerp(phoneReturn.x, L.phoneC.x, s2),
               y: lerp(phoneReturn.y, L.phoneC.y, s2), scale: 1 };
    }
    return { x: L.phoneC.x, y: L.phoneC.y, scale: 1 };
  }

  // ---------- drawing helpers ----------
  function poly(pts, fill, stroke, lw) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
  }
  function circle(x, y, r, fill, stroke, lw) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
  }
  function line(x1, y1, x2, y2, stroke, lw) {
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke();
  }
  function rrect(x, y, w, h, r, fill, stroke, lw) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r); ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h); ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r); ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
  }

  // ---------- room ----------
  function drawRoom() {
    ctx.fillStyle = CEIL; ctx.fillRect(0, 0, W, Hh);
    var cx = L.cornerX;
    poly([[0, 0.02 * Hh], [cx, 0.10 * Hh], [cx, 0.70 * Hh], [0, 0.78 * Hh]], PAPER_WHITE);
    poly([[cx, 0.10 * Hh], [W, 0.05 * Hh], [W, 0.74 * Hh], [cx, 0.70 * Hh]], WALL_R);
    poly([[0, 0.78 * Hh], [cx, 0.70 * Hh], [W, 0.74 * Hh], [W, Hh], [0, Hh]], FLOOR);
    // floor boards converging on the corner
    ctx.globalAlpha = 0.16;
    for (var i = 0; i <= 6; i++) {
      var bx = (i / 6) * W;
      line(bx, Hh, cx, 0.70 * Hh, '#43433F', 1);
    }
    ctx.globalAlpha = 1;
    line(0, 0.78 * Hh, cx, 0.70 * Hh, '#B9B5AA', 2);
    line(cx, 0.70 * Hh, W, 0.74 * Hh, '#B9B5AA', 2);
    line(cx, 0.10 * Hh, cx, 0.70 * Hh, '#CFC9BC', 2);
    // an empty frame on the right wall (something to stare at)
    var fx = 0.80 * W, fy = 0.30 * Hh, fw = (phone ? 0.20 : 0.115) * W, fh2 = 0.20 * Hh;
    ctx.strokeStyle = '#B9B5AA'; ctx.lineWidth = 5;
    ctx.strokeRect(fx, fy, fw, fh2);
    ctx.strokeStyle = 'rgba(42,42,40,0.25)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(fx + 6, fy + 6, fw - 12, fh2 - 12);
    // a wall label beside it
    ctx.fillStyle = '#CFC9BC';
    ctx.fillRect(fx + fw + 0.012 * W, fy + fh2 * 0.4, 0.028 * W, 0.045 * Hh);
  }
  function drawDesk() {
    var d = L.desk;
    ctx.fillStyle = '#4A4A46';
    ctx.fillRect(d.x, d.y, d.w, 0.016 * Hh);
    ctx.fillRect(d.x + 0.012 * W, d.y + 0.016 * Hh, 0.012 * W, 0.085 * Hh);
    ctx.fillRect(d.x + d.w - 0.024 * W, d.y + 0.016 * Hh, 0.012 * W, 0.085 * Hh);
    // a small stack of blank feedback forms waiting on the desk
    for (var i = 0; i < 3; i++) {
      ctx.fillStyle = FORM;
      ctx.fillRect(d.x + 0.02 * W + i * 2, d.y - 0.006 * Hh - i * 0.004 * Hh,
                   0.052 * W, 0.005 * Hh);
    }
  }
  function drawTray(stack) {
    var tr = L.tray;
    line(tr.x, tr.y + 0.012 * Hh, tr.x, floorYAt(tr.x) + 0.10 * Hh, '#2F2F2C', 4);
    ctx.fillStyle = BRASS_D;
    ctx.fillRect(tr.x - 0.045 * W, tr.y, 0.09 * W, 0.012 * Hh);
    var n = Math.min(stack, 14);
    for (var i = 0; i < n; i++) {
      ctx.fillStyle = FORM;
      var off = (H(i, 31, 0) - 0.5) * 0.008 * W;
      ctx.fillRect(tr.x - 0.032 * W + off, tr.y - (i + 1) * 0.0048 * Hh,
                   0.064 * W, 0.0038 * Hh);
    }
  }

  // ---------- clock contraption ----------
  function drawGear(g, ang) {
    var ro = g.pr * 1.20, rr = g.pr * 0.82, step = Math.PI * 2 / g.teeth;
    ctx.beginPath();
    for (var k = 0; k < g.teeth; k++) {
      var a = ang + k * step;
      var pts = [
        [g.x + rr * Math.cos(a), g.y + rr * Math.sin(a)],
        [g.x + ro * Math.cos(a + step * 0.25), g.y + ro * Math.sin(a + step * 0.25)],
        [g.x + ro * Math.cos(a + step * 0.55), g.y + ro * Math.sin(a + step * 0.55)],
        [g.x + rr * Math.cos(a + step * 0.80), g.y + rr * Math.sin(a + step * 0.80)]
      ];
      for (var j = 0; j < 4; j++) {
        if (k === 0 && j === 0) ctx.moveTo(pts[j][0], pts[j][1]);
        else ctx.lineTo(pts[j][0], pts[j][1]);
      }
    }
    ctx.closePath();
    ctx.fillStyle = BRASS; ctx.fill();
    ctx.strokeStyle = BRASS_D; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = BRASS_D; ctx.lineWidth = Math.max(2, g.pr * 0.20);
    ctx.beginPath();
    for (var s = 0; s < 4; s++) {
      var sa = ang + s * Math.PI / 2 + step / 2;
      ctx.moveTo(g.x, g.y);
      ctx.lineTo(g.x + rr * 0.95 * Math.cos(sa), g.y + rr * 0.95 * Math.sin(sa));
    }
    ctx.stroke();
    circle(g.x, g.y, g.pr * 0.30, SUIT);
    circle(g.x, g.y, g.pr * 0.10, BRASS_D);
  }
  function drawContraption(pt, running) {
    var cx = L.clockX, cy = L.clockY, R = L.R, pn = L.panel;
    // posts
    ctx.fillStyle = '#2F2F2C';
    ctx.fillRect(pn.x + 4, pn.y + pn.h, 0.012 * U, floorYAt(pn.x + 4) + 0.06 * Hh - (pn.y + pn.h));
    ctx.fillRect(pn.x + pn.w - 4 - 0.012 * U, pn.y + pn.h, 0.012 * U,
                 floorYAt(pn.x + pn.w) + 0.06 * Hh - (pn.y + pn.h));
    // back panel
    ctx.fillStyle = PANEL; ctx.fillRect(pn.x, pn.y, pn.w, pn.h);
    ctx.strokeStyle = SUIT; ctx.lineWidth = 2; ctx.strokeRect(pn.x, pn.y, pn.w, pn.h);
    ctx.fillStyle = BRASS;
    ctx.fillRect(pn.x + 5, pn.y + 5, 4, 4); ctx.fillRect(pn.x + pn.w - 9, pn.y + 5, 4, 4);
    ctx.fillRect(pn.x + 5, pn.y + pn.h - 9, 4, 4); ctx.fillRect(pn.x + pn.w - 9, pn.y + pn.h - 9, 4, 4);
    // pendulum
    var pa = running ? 0.38 * Math.sin(Math.PI * pt) : 0;
    var bx = L.pend.x + Math.sin(pa) * L.pend.len;
    var by = L.pend.y + Math.cos(pa) * L.pend.len;
    line(L.pend.x, L.pend.y, bx, by, BRASS_D, 3);
    circle(bx, by, L.pend.bob, BRASS, BRASS_D, 1.5);
    // gears
    for (var i = 0; i < 3; i++) {
      var g = L.gears[i];
      drawGear(g, g.ph + (running ? g.om * pt : 0));
    }
    // clock face
    circle(cx, cy, R, BRASS, BRASS_D, 2);
    circle(cx, cy, R * 0.86, '#F2EEE3');
    ctx.strokeStyle = SUIT; ctx.lineWidth = Math.max(1.5, R * 0.03);
    ctx.beginPath();
    for (var k = 0; k < 12; k++) {
      var ta = k * Math.PI / 6;
      ctx.moveTo(cx + R * 0.72 * Math.cos(ta), cy + R * 0.72 * Math.sin(ta));
      ctx.lineTo(cx + R * 0.82 * Math.cos(ta), cy + R * 0.82 * Math.sin(ta));
    }
    ctx.stroke();
    var mA = -Math.PI / 2 + Math.PI * 2 * ((pt / 60) % 1);
    var hA = -Math.PI / 2 + Math.PI * 2 * ((pt / 720) % 1);
    var sInt = Math.floor(pt), sFr = pt - sInt;
    var sA = -Math.PI / 2 + Math.PI * 2 * ((sInt % 60) / 60) +
             (running ? 0.06 * Math.exp(-4.5 * sFr) * Math.sin(sFr * 30) : 0);
    function hand(ang, len, wdt, col) {
      var dx = Math.cos(ang), dy = Math.sin(ang), px = -dy, py = dx;
      poly([[cx - dx * len * 0.16, cy - dy * len * 0.16],
            [cx + px * wdt, cy + py * wdt],
            [cx + dx * len, cy + dy * len],
            [cx - px * wdt, cy - py * wdt]], col);
    }
    hand(hA, R * 0.48, R * 0.055, SUIT);
    hand(mA, R * 0.72, R * 0.04, SUIT);
    line(cx - Math.cos(sA) * R * 0.18, cy - Math.sin(sA) * R * 0.18,
         cx + Math.cos(sA) * R * 0.80, cy + Math.sin(sA) * R * 0.80, BRASS, Math.max(1.5, R * 0.022));
    circle(cx, cy, R * 0.07, SUIT);
  }

  // ---------- specialists ----------
  function drawFigure(f) {
    var fh = L.fh;
    var bob = f.walking ? Math.abs(Math.sin(f.phase)) * 0.018 * fh : 0;
    var by = f.y - bob;
    var hipY = by - 0.52 * fh, shY = by - 0.88 * fh;
    var spread = f.walking ? Math.sin(f.phase) * 0.13 * fh : 0.018 * fh;
    ctx.lineCap = 'round';
    ctx.strokeStyle = SUIT; ctx.lineWidth = 0.085 * fh;
    ctx.beginPath();
    ctx.moveTo(f.x, hipY); ctx.lineTo(f.x + spread, by);
    ctx.moveTo(f.x, hipY); ctx.lineTo(f.x - spread, by);
    ctx.stroke();
    // torso
    poly([[f.x - 0.13 * fh, by - 0.48 * fh], [f.x + 0.13 * fh, by - 0.48 * fh],
          [f.x + 0.16 * fh, shY], [f.x - 0.16 * fh, shY]], SUIT);
    if (!f.back) {
      poly([[f.x - 0.055 * fh, shY + 0.01 * fh], [f.x + 0.055 * fh, shY + 0.01 * fh],
            [f.x, by - 0.56 * fh]], PAPER_WHITE);
    }
    // arm
    var shx = f.x + f.face * 0.13 * fh, shy = shY + 0.04 * fh;
    ctx.strokeStyle = SUIT; ctx.lineWidth = 0.07 * fh;
    ctx.beginPath();
    ctx.moveTo(shx, shy);
    if (f.armUp) ctx.lineTo(f.x + f.face * 0.36 * fh, shY - 0.30 * fh);
    else if (f.holding) ctx.lineTo(f.x + f.face * 0.24 * fh, by - 0.50 * fh);
    else ctx.lineTo(f.x + f.face * 0.10 * fh, by - 0.40 * fh);
    ctx.stroke();
    ctx.lineCap = 'butt';
    if (f.holding) {
      var hx = f.x + f.face * 0.26 * fh, hy = by - 0.56 * fh;
      ctx.fillStyle = FORM;
      ctx.fillRect(hx - 0.075 * fh, hy, 0.15 * fh, 0.11 * fh);
      ctx.strokeStyle = 'rgba(42,42,40,0.4)'; ctx.lineWidth = 1;
      ctx.strokeRect(hx - 0.075 * fh, hy, 0.15 * fh, 0.11 * fh);
    }
    // head
    var hr = 0.105 * fh, hcy = shY - 0.13 * fh;
    circle(f.x, hcy, hr, SKIN);
    ctx.beginPath();
    ctx.moveTo(f.x - hr, hcy);
    ctx.arc(f.x, hcy, hr, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = '#3A332A'; ctx.fill();
  }

  // ---------- planes ----------
  function drawPlanes(t) {
    var tr = L.tray;
    for (var i = 0; i < planeT.length; i++) {
      var age = t - planeT[i];
      if (age < 0 || age >= 6) continue;
      var p = age / 6;
      var x = lerp(0.04 * W, tr.x, p);
      var y = lerp(0.92 * Hh, tr.y - 0.01 * Hh, p) - Math.sin(p * Math.PI) * 0.17 * Hh +
              Math.sin(p * Math.PI * 4) * 0.008 * Hh;
      var s = 0.020 * U, tilt = Math.sin(p * Math.PI * 4) * 0.3;
      var c = Math.cos(tilt), sn = Math.sin(tilt);
      function rot(dx, dy) { return [x + dx * c - dy * sn, y + dx * sn + dy * c]; }
      var a = rot(s, 0), b = rot(-s, -s * 0.42), d = rot(-s * 0.2, s * 0.72);
      poly([a, b, d], FORM, 'rgba(42,42,40,0.35)', 1);
      line(x, y, b[0], b[1], 'rgba(42,42,40,0.35)', 1);
    }
  }

  // ---------- gate UI ----------
  function dashedRect(x, y, w, h) {
    ctx.strokeStyle = 'rgba(42,42,40,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath();
    var dash = 7, gap = 5, i, len;
    len = w;
    for (i = 0; i < len; i += dash + gap) { ctx.moveTo(x + i, y); ctx.lineTo(x + Math.min(i + dash, len), y); }
    for (i = 0; i < len; i += dash + gap) { ctx.moveTo(x + i, y + h); ctx.lineTo(x + Math.min(i + dash, len), y + h); }
    len = h;
    for (i = 0; i < len; i += dash + gap) { ctx.moveTo(x, y + i); ctx.lineTo(x, y + Math.min(i + dash, len)); }
    for (i = 0; i < len; i += dash + gap) { ctx.moveTo(x + w, y + i); ctx.lineTo(x + w, y + Math.min(i + dash, len)); }
    ctx.stroke();
  }
  function phoneGlyph(x, y, w, h) {
    rrect(x - w / 2, y - h / 2, w, h, w * 0.16, SUIT);
    ctx.fillStyle = FORM;
    ctx.fillRect(x - w * 0.36, y - h * 0.34, w * 0.72, h * 0.58);
    ctx.fillStyle = 'rgba(236,233,226,0.75)';
    ctx.fillRect(x - w * 0.16, y - h * 0.44, w * 0.32, h * 0.045);
    circle(x, y + h * 0.36, w * 0.09, 'rgba(236,233,226,0.75)');
  }
  function drawGateUI(t) {
    var b = L.box;
    dashedRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(42,42,40,0.85)';
    ctx.font = '600 ' + Math.max(10, 0.016 * U) + 'px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('PHONES', b.x + b.w / 2, b.y + b.h + 0.026 * Hh);
    var pp = phonePosAt(t);
    if (gateOpen) {
      phoneGlyph(pp.x, pp.y, L.phoneW * pp.scale, L.phoneH * pp.scale);
      if (t >= dropT + 0.5) {
        var tx = b.x + b.w * 0.70, ty = b.y + b.h / 2, s = Math.max(7, 0.013 * U);
        ctx.strokeStyle = BRASS; ctx.lineWidth = 3; ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(tx - s, ty);
        ctx.lineTo(tx - s * 0.3, ty + s * 0.75);
        ctx.lineTo(tx + s * 1.1, ty - s * 0.85);
        ctx.stroke();
        ctx.lineJoin = 'miter';
      }
      return;
    }
    // dashed arrow from phone toward the box (marching, seeded by t)
    if (!phoneDrag) {
      var sx = pp.x - L.phoneW * 0.42, sy = pp.y - L.phoneH * 0.48;
      var ex = b.x + b.w + 0.014 * W, ey = b.y + b.h * 0.72;
      var dx = ex - sx, dy = ey - sy, len = Math.sqrt(dx * dx + dy * dy);
      var ux = dx / len, uy = dy / len;
      ctx.strokeStyle = 'rgba(42,42,40,0.55)'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      var off = (t * 26) % 15;
      for (var d = off; d < len - 12; d += 15) {
        ctx.moveTo(sx + ux * d, sy + uy * d);
        ctx.lineTo(sx + ux * (d + 7), sy + uy * (d + 7));
      }
      ctx.stroke();
      var ah = 9;
      poly([[ex, ey],
            [ex - ux * ah - uy * ah * 0.55, ey - uy * ah + ux * ah * 0.55],
            [ex - ux * ah + uy * ah * 0.55, ey - uy * ah - ux * ah * 0.55]],
           'rgba(42,42,40,0.55)');
    }
    // pulsing outline, then the phone
    var pulse = (Math.sin(t * Math.PI * 2 / 2.2) + 1) / 2;
    rrect(pp.x - (L.phoneW * pp.scale) / 2 - 6 - pulse * 3,
          pp.y - (L.phoneH * pp.scale) / 2 - 6 - pulse * 3,
          L.phoneW * pp.scale + 12 + pulse * 6, L.phoneH * pp.scale + 12 + pulse * 6,
          12, null, 'rgba(168,127,63,' + (0.35 + 0.4 * pulse).toFixed(3) + ')', 2.5);
    phoneGlyph(pp.x, pp.y, L.phoneW * pp.scale, L.phoneH * pp.scale);
  }

  // ---------- surveillance dressing ----------
  function drawSurveillance(t) {
    // grey-green grade
    ctx.fillStyle = 'rgba(110,125,105,0.05)';
    ctx.fillRect(0, 0, W, Hh);
    // drifting scanline band
    var bandY = ((t * 0.03 * Hh) % (Hh * 1.3)) - 0.15 * Hh;
    ctx.fillStyle = 'rgba(255,255,255,0.028)';
    ctx.fillRect(0, bandY, W, 0.10 * Hh);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(0, bandY, W, 1.5);
    // corner brackets
    ctx.strokeStyle = 'rgba(236,233,226,0.45)'; ctx.lineWidth = 2;
    var m = 12, l = 22;
    ctx.beginPath();
    ctx.moveTo(m, m + l); ctx.lineTo(m, m); ctx.lineTo(m + l, m);
    ctx.moveTo(W - m - l, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, m + l);
    ctx.moveTo(W - m, Hh - m - l); ctx.lineTo(W - m, Hh - m); ctx.lineTo(W - m - l, Hh - m);
    ctx.moveTo(m + l, Hh - m); ctx.lineTo(m, Hh - m); ctx.lineTo(m, Hh - m - l);
    ctx.stroke();
    // REC counter (piece time, furniture of the fiction)
    var tt = Math.floor(t);
    var txt = 'REC ' + pad2(Math.floor(tt / 3600)) + ':' +
              pad2(Math.floor(tt / 60) % 60) + ':' + pad2(tt % 60);
    ctx.font = (phone ? '11px' : '13px') + ' monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    var tw = ctx.measureText ? ctx.measureText(txt).width : 95;
    ctx.fillStyle = 'rgba(236,233,226,0.9)';
    ctx.fillText(txt, W - 18, 30);
    var on = (t % 1.2) < 0.85;
    ctx.globalAlpha = on ? 1 : 0.2;
    circle(W - 18 - tw - 11, 25.5, 4, '#C23B2E');
    ctx.globalAlpha = 1;
  }

  // ---------- main draw ----------
  function draw(t) {
    curT = t;
    if (W === 0) resize();
    canvas.style.width = W + 'px';
    canvas.style.height = Hh + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var pt = gateOpen ? t - dropT : 0;
    drawRoom();
    drawDesk();
    drawTray(gateOpen ? filedCount(pt) + landedCount(t) : 0);
    drawContraption(pt, gateOpen);
    if (gateOpen) {
      var figs = [];
      for (var i = 0; i < 3; i++) {
        var f = posAt(i, pt);
        if (f) figs.push(f);
      }
      figs.sort(function (a, b) { return a.y - b.y; });
      for (var j = 0; j < figs.length; j++) drawFigure(figs[j]);
    }
    drawPlanes(t);
    drawSurveillance(t);
    drawGateUI(t);
  }

  // ---------- sizing ----------
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = w; Hh = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var sw = window.screen ? window.screen.width : w;
    var sh = window.screen ? window.screen.height : h;
    phone = Math.min(sw, sh) < 700 || h > w * 1.15;
    buildLayout();
    buildScripts();
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(curT); });
  }
  window.addEventListener('resize', function () { resize(); draw(curT); });

  // ---------- interaction ----------
  function evtPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = evtPos(e);
    downInfo = { x: p.x, y: p.y, t: curT, moved: false };
    if (!gateOpen) {
      var pp = phonePosAt(curT);
      if (Math.abs(p.x - pp.x) <= L.phoneW / 2 + 16 &&
          Math.abs(p.y - pp.y) <= L.phoneH / 2 + 16) {
        phoneDrag = { dx: p.x - pp.x, dy: p.y - pp.y, x: pp.x, y: pp.y };
      }
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = evtPos(e);
    if (phoneDrag) {
      phoneDrag.x = p.x - phoneDrag.dx;
      phoneDrag.y = p.y - phoneDrag.dy;
    }
    if (downInfo && Math.abs(p.x - downInfo.x) + Math.abs(p.y - downInfo.y) > 10) {
      downInfo.moved = true;
    }
  });
  function endPointer(e) {
    var p = evtPos(e);
    if (phoneDrag) {
      var cx = phoneDrag.x, cy = phoneDrag.y, b = L.box;
      if (cx >= b.x - 12 && cx <= b.x + b.w + 12 && cy >= b.y - 12 && cy <= b.y + b.h + 12) {
        gateOpen = true;
        dropT = curT;
        dropPos = { x: cx, y: cy };
        phoneReturn = null;
      } else {
        phoneReturn = { x: cx, y: cy, t0: curT };
      }
      phoneDrag = null;
      downInfo = null;
      return;
    }
    if (!gateOpen) { downInfo = null; return; }
    if (downInfo && !downInfo.moved && curT - downInfo.t < 0.45) {
      if (airborneCount(curT) < 3) planeT.push(curT);
    } else if (downInfo && downInfo.moved) {
      var pt = curT - dropT, best = -1, bestD = 1e18;
      for (var i = 0; i < 3; i++) {
        var f = posAt(i, pt);
        if (!f) continue;
        var d = (f.x - p.x) * (f.x - p.x) + (f.y - p.y) * (f.y - p.y);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0) {
        var cur = posAt(best, pt);
        nudges[best] = {
          pt: pt, fx: cur.x, fy: cur.y,
          x: clamp(p.x, 0.05 * W, 0.95 * W),
          y: clamp(p.y, 0.70 * Hh, 0.86 * Hh),
          face: cur.face
        };
      }
    }
    downInfo = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function () {
    if (phoneDrag) {
      phoneReturn = { x: phoneDrag.x, y: phoneDrag.y, t0: curT };
      phoneDrag = null;
    }
    downInfo = null;
  });

  // ---------- test handle (QA harness) ----------
  window.__makingTime = {
    draw: draw,
    state: function () {
      var pt = gateOpen ? curT - dropT : 0;
      var entered = 0;
      for (var i = 0; i < 3; i++) if (pt >= SPECS[i].entry && gateOpen) entered++;
      return {
        gateOpen: gateOpen,
        checked: gateOpen && curT >= dropT + 0.5,
        pt: pt,
        entered: entered,
        filed: gateOpen ? filedCount(pt) : 0,
        landed: landedCount(curT),
        airborne: airborneCount(curT),
        phone: phonePosAt(curT),
        gears: { teeth: [12, 8, 16], omA: OM_A, omB: OM_B, omC: OM_C },
        dropEnd0: SPECS.length ? SPECS[0].first.dropEnd : -1,
        len0: SPECS.length ? SPECS[0].first.len : -1,
        lenN: SPECS.length ? SPECS[0].steady.len : -1
      };
    }
  };

  // ---------- boot ----------
  resize();
  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    var startStamp = null;
    var loop = function (ts) {
      if (startStamp === null) startStamp = ts;
      draw((ts - startStamp) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
