<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.399 The Fox Lady</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#151312; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.399 The Fox Lady (galitskaya-illustration).
// After Anna Galitskaya's @yourfellowfox mascot: ONE
// fox (pointed ears, big brush tail, cream chest,
// round kidlit body) working six professions on
// near-black, in a FIXED AUTHORED SCENE TABLE in the
// prompt's order: librarian, baker, astronomer,
// gardener, cellist, ice-skater, asserted at load and
// cycling with no repeats until all six have shown,
// then wrapping. DOUBLE-TAP changes the scene: the
// fox walks off right on a 2s two-frame walk, the
// old scene's props fade, and the next fox walks in
// from the left while its props drop and fade in
// over 1s. Each scene rests on a 14s ambient loop:
// the tail sways on a 7s sine, an ear twitches at
// the fixed 5s and 11s slots, and exactly ONE prop
// animates per scene (book pages turn once per loop,
// tray steam curls, telescope tilts tracking an
// invisible star, watering can tips and pours dotted
// water, cello bow saws, skates glide in a small
// oval). Frame one is the librarian scene complete
// at the constant phase T = 5.3s, tail at full sway;
// the clock is anchored there and advances in fixed
// 1/60 ticks, never from a wall clock. Palette closed
// at the five specced hexes, flat or at flat alpha
// steps; the ground tone doubles as the face ink.
// No text anywhere. All star and spine data is baked
// from a fixed seed at load; no offscreen canvas, no
// gradients, no filters, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#151312', ORANGE = '#E07B39', CREAM = '#F5E8D0';
var GREEN = '#5C8A5A', STAR = '#F5F2EA';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 14;
if (LOOP !== 14) throw new Error('Fox Lady ambient loop must be 14s');
var TICK = 1 / 60;
var FOXY = 742; // ground line the fox stands on

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: star and book
// spine placements are baked from this at load and
// never change between frames or renders.
var seed = 399;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function ellA(x, y, rx, ry, rot, color, alpha) {
  ctx.globalAlpha = alpha;
  ell(x, y, rx, ry, rot, color);
  ctx.globalAlpha = 1;
}
function circ(x, y, r, color) { ell(x, y, r, r, 0, color); }
function circA(x, y, r, color, alpha) { ellA(x, y, r, r, 0, color, alpha); }
function dome(cx, cy, rx, ry, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx - rx, cy);
  ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, Math.PI * 2);
  ctx.closePath();
  ctx.fill();
}
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function segA(x1, y1, x2, y2, w, color, alpha) {
  ctx.globalAlpha = alpha;
  seg(x1, y1, x2, y2, w, color);
  ctx.globalAlpha = 1;
}
function curve(x1, y1, cx, cy, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
}
function traceBlob(pts, keepPath) {
  if (!keepPath) ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i + 5 < pts.length; i += 6) {
    ctx.bezierCurveTo(pts[i], pts[i + 1], pts[i + 2], pts[i + 3], pts[i + 4], pts[i + 5]);
  }
  ctx.closePath();
}
function blob(color, pts) {
  ctx.fillStyle = color;
  traceBlob(pts);
  ctx.fill();
}
function blobA(color, pts, alpha) {
  ctx.globalAlpha = alpha;
  blob(color, pts);
  ctx.globalAlpha = 1;
}
function poly(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i + 1 < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}
function ring(x, y, r, color, lw) {
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.ellipse(x, y, r, r, 0, 0, Math.PI * 2); ctx.stroke();
}
function ellS(x, y, rx, ry, color, lw, alpha) {
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- scene table ---------------------------------------
// Fixed authored order, the prompt's order. Exactly
// six scenes, asserted.
var SCENES = ['librarian', 'baker', 'astronomer', 'gardener', 'cellist', 'ice-skater'];
if (SCENES.length !== 6) throw new Error('Fox Lady needs exactly 6 scenes');
if (SCENES[0] !== 'librarian' || SCENES[5] !== 'ice-skater') throw new Error('scene order broken');

// Astronomer star field: 42 fixed stars.
var STARS = [];
for (var si = 0; si < 42; si++) {
  STARS.push({ x: 90 + rnd() * 1100, y: 60 + rnd() * 400, r: 1.6 + rnd() * 2.2, sp: rnd() < 0.3 });
}
if (STARS.length !== 42) throw new Error('star count broken');

// Librarian book spines: two banks flanking the fox,
// standing on the ground line, heights and colours
// baked from the seed.
var SPINE_COLS = [GREEN, CREAM, ORANGE, GREEN, ORANGE, CREAM];
var SPINES = [];
(function () {
  var x = 252;
  while (x < 428) {
    var w = 24 + rnd() * 16;
    SPINES.push({ x: x, w: w, h: 300 + rnd() * 150, c: SPINE_COLS[SPINES.length % 6] });
    x += w + 5;
  }
  x = 852;
  while (x < 1028) {
    var w2 = 24 + rnd() * 16;
    SPINES.push({ x: x, w: w2, h: 300 + rnd() * 150, c: SPINE_COLS[SPINES.length % 6] });
    x += w2 + 5;
  }
})();

// Gardener pots: two planted pots flanking the fox.
var POTS = [{ x: 428 }, { x: 852 }];

// ---- state ----------------------------------------------
// Constant first-frame phase: T = 5.3s into the 14s
// loop, librarian complete, tail at full sway.
var T = 5.3;
var lastNow = -1, acc = 0;
var sceneIdx = 0;
var mode = 'rest'; // 'rest' | 'out' | 'in'
var transT = 0;
var OUT_LEN = 2, IN_LEN = 2, WALK_DIST = 920;
var foxScale = 1.15;
var curWalkX = 0;

function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

function step() {
  if (mode === 'out') {
    transT += TICK;
    if (transT >= OUT_LEN) {
      sceneIdx = (sceneIdx + 1) % SCENES.length;
      mode = 'in';
      transT = 0;
    }
  } else if (mode === 'in') {
    transT += TICK;
    if (transT >= IN_LEN) { mode = 'rest'; transT = 0; }
  }
}

// Ear twitch: fixed slots at 5s and 11s of the loop,
// a 0.3s flick of the right ear.
function earTwitch(lt) {
  for (var i = 0; i < 2; i++) {
    var d = lt - (i === 0 ? 5 : 11);
    if (d >= 0 && d < 0.3) return Math.sin(d / 0.3 * Math.PI) * 0.16;
  }
  return 0;
}

// ---- the fox --------------------------------------------
// Local coords: origin at the ground point under the
// fox, y negative upward. One body recipe; the pose
// (legs) and overlay (arms, held props, hat, glasses)
// change per scene.
function drawLegs(kind, wf) {
  if (kind === 'seated') {
    seg(34, -122, 74, -42, 30, ORANGE);
    seg(-34, -122, -74, -42, 30, ORANGE);
    ell(84, -6, 29, 11, 0, ORANGE);
    ell(-84, -6, 29, 11, 0, ORANGE);
  } else if (kind === 'skate') {
    seg(20, -128, 26, -16, 28, ORANGE);
    seg(-30, -120, -90, -54, 28, ORANGE);
    ell(30, -7, 27, 10, 0, ORANGE);
    ell(-96, -47, 27, 10, 0, ORANGE);
    seg(4, 0, 58, 0, 3.5, CREAM);
    seg(-122, -40, -70, -40, 3.5, CREAM);
  } else if (kind === 'walk') {
    if (wf === 0) {
      seg(34, -128, 50, -14, 28, ORANGE);
      seg(-34, -128, -46, -26, 28, ORANGE);
      ell(56, -6, 27, 10, 0, ORANGE);
      ell(-50, -18, 27, 10, 0, ORANGE);
    } else {
      seg(34, -128, 12, -16, 28, ORANGE);
      seg(-34, -128, -12, -28, 28, ORANGE);
      ell(16, -8, 27, 10, 0, ORANGE);
      ell(-16, -20, 27, 10, 0, ORANGE);
    }
  } else { // stand
    seg(34, -128, 38, -14, 30, ORANGE);
    seg(-34, -128, -38, -14, 30, ORANGE);
    ell(46, -6, 27, 10, 0, ORANGE);
    ell(-46, -6, 27, 10, 0, ORANGE);
  }
}

function drawFoxBody(lt) {
  // Brush tail, swaying on a 7s sine around its hip
  // anchor, cream tip at the far end.
  ctx.save();
  ctx.translate(-78, -140);
  ctx.rotate(0.07 * Math.sin(Math.PI * 2 * lt / 7));
  ctx.translate(78, 140);
  blob(ORANGE, [-70, -182,
    -140, -198, -198, -170, -206, -128,
    -198, -90, -128, -82, -66, -104,
    -84, -128, -84, -156, -70, -182]);
  ell(-186, -127, 27, 20, 0.5, CREAM);
  ctx.restore();
  // Round body and cream chest.
  ell(0, -215, 108, 118, 0, ORANGE);
  ell(2, -196, 60, 86, 0, CREAM);
  // Head.
  circ(0, -385, 80, ORANGE);
  // Left ear.
  poly(ORANGE, [-60, -438, -32, -514, -6, -446]);
  poly(CREAM, [-46, -446, -33, -488, -20, -450]);
  // Right ear, with the fixed-slot twitch.
  ctx.save();
  ctx.translate(34, -440);
  ctx.rotate(earTwitch(lt));
  ctx.translate(-34, 440);
  poly(ORANGE, [6, -446, 32, -514, 60, -438]);
  poly(CREAM, [20, -450, 33, -488, 46, -446]);
  ctx.restore();
  // Face: cream muzzle, ground-tone nose and eyes.
  ell(0, -348, 42, 30, 0, CREAM);
  ell(0, -363, 11, 8, 0, GROUND);
  circ(-30, -392, 6.5, GROUND);
  circ(30, -392, 6.5, GROUND);
}

// Per-scene arms and held props, drawn over the body
// in fox-local coords.
function drawOverlay(name, lt) {
  if (name === 'librarian') {
    // Arms forward to an open book.
    seg(-66, -272, -52, -186, 24, ORANGE);
    seg(66, -272, 52, -186, 24, ORANGE);
    // Cover, then two cream pages.
    blob(GREEN, [0, -248,
      -52, -240, -92, -232, -96, -224,
      -92, -182, -50, -168, 0, -160,
      50, -168, 92, -182, 96, -224,
      92, -232, 52, -240, 0, -248]);
    poly(CREAM, [0, -240, -86, -226, -86, -178, 0, -166]);
    poly(CREAM, [0, -240, 86, -226, 86, -178, 0, -166]);
    segA(0, -238, 0, -168, 2.5, GROUND, 0.35);
    circ(-92, -192, 11, ORANGE);
    circ(92, -192, 11, ORANGE);
    // One page turn per loop, in the 6.5s-7.7s window:
    // a page sweeping across the spine.
    if (lt >= 6.5 && lt < 7.7) {
      var p = (lt - 6.5) / 1.2;
      var cx = Math.cos(p * Math.PI) * 84;
      ctx.fillStyle = CREAM; ctx.globalAlpha = 0.95;
      ctx.beginPath();
      ctx.moveTo(0, -240);
      ctx.quadraticCurveTo(cx * 0.6, -246, cx, -224);
      ctx.quadraticCurveTo(cx * 0.6, -196, 0, -166);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // Glasses: two cream rings and a bridge.
    ring(-31, -392, 23, CREAM, 5);
    ring(31, -392, 23, CREAM, 5);
    seg(-8, -394, 8, -394, 5, CREAM);
    seg(-54, -396, -76, -404, 5, CREAM);
    seg(54, -396, 76, -404, 5, CREAM);
  } else if (name === 'baker') {
    // Chef hat over the head.
    circ(-28, -446, 22, CREAM);
    circ(28, -446, 22, CREAM);
    dome(0, -438, 54, 36, CREAM);
    ell(0, -420, 56, 12, 0, CREAM);
    // Arms down to a green tray of rolls; the rolls
    // carry a faint ground-tone outline so the cream
    // stays readable against the cream chest.
    seg(-66, -272, -88, -150, 24, ORANGE);
    seg(66, -272, 88, -150, 24, ORANGE);
    ell(0, -140, 100, 16, 0, GREEN);
    ell(-48, -158, 21, 13, 0, CREAM);
    ell(0, -164, 22, 14, 0, CREAM);
    ell(48, -158, 21, 13, 0, CREAM);
    ellS(-48, -158, 21, 13, GROUND, 2, 0.28);
    ellS(0, -164, 22, 14, GROUND, 2, 0.28);
    ellS(48, -158, 21, 13, GROUND, 2, 0.28);
    segA(-55, -162, -41, -154, 3, ORANGE, 0.8);
    segA(-7, -168, 7, -160, 3, ORANGE, 0.8);
    segA(41, -162, 55, -154, 3, ORANGE, 0.8);
    circ(-97, -144, 11, ORANGE);
    circ(97, -144, 11, ORANGE);
    // Steam: three flat curls rising and fading.
    for (var k = 0; k < 3; k++) {
      var ph = (lt * 0.13 + k / 3) % 1;
      var sx = -52 + k * 52 + Math.sin(ph * 5 + k * 2) * 5;
      var sy = -192 - ph * 55;
      ctx.globalAlpha = 0.65 * (1 - ph);
      ctx.strokeStyle = STAR; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(sx, sy, 7, Math.PI * 0.2, Math.PI * 1.5);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  } else if (name === 'astronomer') {
    // Left arm rests; right arm reaches up toward
    // the telescope eyepiece.
    seg(-66, -272, -86, -168, 24, ORANGE);
    seg(66, -272, 104, -318, 24, ORANGE);
    circ(106, -320, 13, ORANGE);
  } else if (name === 'gardener') {
    seg(-66, -272, -86, -168, 24, ORANGE);
    seg(66, -272, 110, -176, 24, ORANGE);
    // Watering can at the right paw, tipping on the
    // pour envelope.
    var env = Math.pow(Math.max(0, Math.sin(Math.PI * 2 * lt / LOOP)), 2);
    ctx.save();
    ctx.translate(128, -140);
    ctx.rotate(-0.08 - 0.5 * env);
    ell(0, 0, 35, 27, 0, GREEN);
    seg(24, -8, 58, 10, 10, GREEN);
    circ(60, 12, 7, GREEN);
    curve(-8, -24, 8, -44, 26, -28, 7, GREEN);
    ctx.restore();
  } else if (name === 'cellist') {
    // Cello held at the right side, bow sawing on a
    // 2.8s cycle (five whole cycles per loop).
    ctx.save();
    ctx.translate(96, -128);
    ctx.rotate(0.30);
    ctx.scale(1.3, 1.3);
    ell(0, 0, 48, 44, 0, GREEN);
    ell(0, -58, 34, 31, 0, GREEN);
    seg(4, -80, 10, -122, 9, GREEN);
    circ(11, -128, 8, CREAM);
    segA(-14, -66, -14, 6, 2, STAR, 0.5);
    segA(16, -66, 16, 6, 2, STAR, 0.5);
    seg(-20, -18, 20, -18, 4, CREAM);
    ctx.restore();
    seg(84, -84, 88, -6, 4, CREAM); // endpin to the ground
    seg(58, -292, 148, -287, 24, ORANGE); // left arm up the neck
    circ(150, -285, 12, ORANGE);
    seg(66, -272, 58, -228, 24, ORANGE);   // right arm holds the bow
    circ(58, -226, 12, ORANGE);
    var bo = Math.sin(Math.PI * 2 * lt / 2.8) * 11;
    var bx = bo * 0.707, by = bo * 0.707;
    seg(30 + bx, -252 + by, 150 + bx, -138 + by, 4, CREAM);
  } else if (name === 'ice-skater') {
    // Trailing scarf, then arms out for balance.
    var sway = Math.sin(Math.PI * 2 * lt / 3.5) * 8;
    curve(-30, -318, -95, -300 + sway, -158, -272 + sway, 19, GREEN);
    seg(-158, -272 + sway, -172, -260 + sway, 6, GREEN);
    seg(-158, -272 + sway, -170, -284 + sway, 6, GREEN);
    seg(-78, -262, -124, -244, 24, ORANGE);
    seg(78, -262, 124, -244, 24, ORANGE);
    circ(-126, -243, 12, ORANGE);
    circ(126, -243, 12, ORANGE);
  }
}

// Standing props behind the fox, per scene. alpha and
// drop carry the assemble transition.
function drawBehind(name, lt, alpha, drop) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(0, drop);
  if (name === 'librarian') {
    for (var i = 0; i < SPINES.length; i++) {
      var sp = SPINES[i];
      ctx.fillStyle = sp.c;
      ctx.fillRect(sp.x, FOXY - sp.h, sp.w, sp.h);
      ell(sp.x + sp.w / 2, FOXY - sp.h, sp.w / 2, 7, 0, sp.c);
      ctx.globalAlpha = alpha * 0.3;
      ctx.fillStyle = GROUND;
      ctx.fillRect(sp.x + 3, FOXY - sp.h + 26, sp.w - 6, 7);
      ctx.globalAlpha = alpha;
    }
  } else if (name === 'astronomer') {
    for (var j = 0; j < STARS.length; j++) {
      var st = STARS[j];
      circA(st.x, st.y, st.r, STAR, alpha * 0.85);
      if (st.sp) {
        segA(st.x - st.r * 2.6, st.y, st.x + st.r * 2.6, st.y, 1.8, STAR, alpha * 0.6);
        segA(st.x, st.y - st.r * 2.6, st.x, st.y + st.r * 2.6, 1.8, STAR, alpha * 0.6);
      }
    }
    ctx.globalAlpha = alpha;
  } else if (name === 'gardener') {
    for (var q = 0; q < POTS.length; q++) {
      var px = POTS[q].x;
      poly(GREEN, [px - 30, FOXY - 46, px + 30, FOXY - 46, px + 22, FOXY, px - 22, FOXY]);
      ell(px - 18, FOXY - 62, 20, 15, -0.4, GREEN);
      ell(px + 16, FOXY - 66, 22, 16, 0.4, GREEN);
      ell(px, FOXY - 78, 18, 14, 0, GREEN);
    }
  } else if (name === 'ice-skater') {
    ellA(640, FOXY + 6, 335, 34, 0, STAR, alpha * 0.10);
    ctx.globalAlpha = alpha * 0.30;
    ctx.strokeStyle = STAR; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(640, FOXY + 6, 335, 34, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = alpha;
    poly(GREEN, [168, FOXY, 215, FOXY - 150, 262, FOXY]);
    poly(GREEN, [180, FOXY - 62, 215, FOXY - 196, 250, FOXY - 62]);
    poly(GREEN, [1018, FOXY, 1065, FOXY - 150, 1112, FOXY]);
    poly(GREEN, [1030, FOXY - 62, 1065, FOXY - 196, 1100, FOXY - 62]);
  }
  ctx.restore();
}

// Standing props in front of the fox, per scene.
function drawFront(name, lt, alpha) {
  if (name === 'astronomer') {
    // Telescope on its tripod, tilting slowly to
    // track an invisible star across the loop.
    ctx.save();
    ctx.globalAlpha = alpha;
    var px = 892, py = 618;
    seg(px - 6, py, px - 52, FOXY, 8, GREEN);
    seg(px + 6, py, px + 52, FOXY, 8, GREEN);
    seg(px, py, px, FOXY, 8, GREEN);
    ctx.translate(px, py);
    ctx.rotate(-0.62 + 0.10 * Math.sin(Math.PI * 2 * lt / LOOP));
    ctx.fillStyle = GREEN;
    ctx.fillRect(-118, -17, 196, 34);
    ell(-118, 0, 10, 17, 0, GREEN);
    ell(78, 0, 7, 20, 0, CREAM);
    ctx.fillRect(-140, -6, 24, 12);
    ctx.restore();
  } else if (name === 'gardener') {
    // Dotted water falling from the can spout while
    // the pour envelope is open.
    var env = Math.pow(Math.max(0, Math.sin(Math.PI * 2 * lt / LOOP)), 2);
    if (env > 0.25) {
      var spx = curWalkX + 640 + 190 * foxScale;
      var spy = FOXY - 128 * foxScale;
      for (var i = 0; i < 8; i++) {
        var p = (lt * 0.85 + i / 8) % 1;
        circA(spx + p * 48, spy + p * p * 100, 3.4, STAR, alpha * env * (1 - p * 0.55));
      }
    }
  }
}

function draw() {
  var lt = T % LOOP;
  var name = SCENES[sceneIdx];
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);

  // Camera state for this frame: walk offset, bob,
  // walk frame, prop assembly.
  var walkX = 0, bobY = 0, wf = -1, propAlpha = 1, propDrop = 0;
  if (mode === 'out') {
    var po = easeInOut(Math.min(1, transT / OUT_LEN));
    walkX = WALK_DIST * po;
    wf = Math.floor(transT * 4) % 2;
    bobY = wf === 1 ? -7 : 0;
    propAlpha = 1 - Math.min(1, transT / 1);
  } else if (mode === 'in') {
    var pi = easeInOut(Math.min(1, transT / IN_LEN));
    walkX = -WALK_DIST * (1 - pi);
    wf = Math.floor(transT * 4) % 2;
    bobY = wf === 1 ? -7 : 0;
    propAlpha = Math.min(1, transT / 1);
    propDrop = (1 - propAlpha) * -36;
  }
  // The ice-skater glides in a small oval at rest.
  var lean = 0;
  if (mode === 'rest' && name === 'ice-skater') {
    walkX += Math.cos(Math.PI * 2 * lt / LOOP) * 70;
    bobY += Math.sin(Math.PI * 2 * lt / 7) * 4;
    lean = 0.05 * Math.sin(Math.PI * 2 * lt / LOOP);
  }
  curWalkX = walkX;
  foxScale = phone ? 1.32 : 1.15;

  drawBehind(name, lt, propAlpha, propDrop);

  // Soft pool of light under the fox.
  ellA(640 + walkX, FOXY + 5, 155, 15, 0, STAR, 0.07);

  // The fox.
  var legs = 'stand';
  if (wf >= 0) legs = 'walk';
  else if (name === 'cellist') legs = 'seated';
  else if (name === 'ice-skater') legs = 'skate';
  ctx.save();
  ctx.translate(640 + walkX, FOXY + bobY);
  ctx.rotate(lean);
  ctx.scale(foxScale, foxScale);
  drawLegs(legs, wf);
  drawFoxBody(lt);
  drawOverlay(name, lt);
  ctx.restore();

  drawFront(name, lt, propAlpha);
}

// ---- pointer: double-tap changes the scene --------------
// A tap is a press and release close together in
// design space. Two taps within 0.4s of the piece
// clock send the fox off to the next profession in
// the table. The piece never reloads.
var downX = -1, downY = -1, downT = 0, lastTapT = -10;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved >= 28 || held >= 0.8) return;
  if (T - lastTapT < 0.4) {
    lastTapT = -10;
    if (mode === 'rest') { mode = 'out'; transT = 0; }
  } else {
    lastTapT = T;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; });

// ---- sizing: centred fit, page ground = ground tone ----
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
