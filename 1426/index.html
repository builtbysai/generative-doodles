<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Invisible Fifth Record</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1712; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1426000);
  // Static speckle field, precomputed once.
  var speckles = [];
  for (var s = 0; s < 90; s++) {
    speckles.push([rand(), rand(), 0.5 + rand() * 1.2]);
  }

  var W = 0, H = 0, isPhone = false;
  function size() {
    var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = Math.round(vw);
    canvas.height = Math.round(vh);
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || vh > vw * 1.15;
    if (document.body) document.body.style.background = '#1a1712';
  }
  size();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { size(); draw(clockT); });
    window.visualViewport.addEventListener('scroll', function () { size(); draw(clockT); });
  }
  window.addEventListener('resize', function () { size(); draw(clockT); });

  function a4(x) { return Math.round(x * 10000) / 10000; }

  // Disc state. Rates in rad/s; base rates differ so the interference breathes.
  var pop = { base: 0.55, rate: 0.55, phase: 0.0 };
  var aus = { base: -0.34, rate: -0.34, phase: 0.0 };
  var overlapAmp = 1; // smoothed toward target; 0 when either disc is stopped.

  function layout() {
    var m = Math.min(W, H);
    var R = Math.min(m * 0.36, W * 0.29);
    var sep = R * 1.32;
    return { R: R, cx1: W / 2 - sep / 2, cx2: W / 2 + sep / 2, cy: H / 2, sep: sep };
  }

  function draw(t) {
    var L = layout();
    var R = L.R, cx1 = L.cx1, cx2 = L.cy, cy = L.cy;
    cx2 = L.cx2;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#1a1712';
    ctx.fillRect(0, 0, W, H);

    // Static speckle (dim, so the overlap stays brightest).
    ctx.fillStyle = 'rgba(138,133,120,0.25)';
    for (var i = 0; i < speckles.length; i++) {
      var sp = speckles[i];
      ctx.fillRect(sp[0] * W, sp[1] * H, sp[2], sp[2]);
    }

    var ph1 = pop.phase + pop.rate * t;
    var ph2 = aus.phase + aus.rate * t;
    var phaseDiff = ph1 - ph2;

    // ---- Pop disc (left): bright radial motifs, slightly dimmed ----
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx1, cy, R, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = '#e84a6a';
    ctx.fillRect(cx1 - R, cy - R, R * 2, R * 2);
    // Radial spokes alternating pop pink / pop yellow.
    var spokes = 12;
    for (var k = 0; k < spokes; k++) {
      var ang = ph1 + (k * Math.PI * 2) / spokes;
      ctx.strokeStyle = (k % 2 === 0) ? '#f2c832' : '#c22a4e';
      ctx.lineWidth = Math.max(2, R * 0.05);
      ctx.beginPath();
      ctx.moveTo(cx1, cy);
      ctx.lineTo(cx1 + Math.cos(ang) * R, cy + Math.sin(ang) * R);
      ctx.stroke();
    }
    // Outer ring of dots.
    for (var d = 0; d < 16; d++) {
      var da = ph1 * 1.0 + (d * Math.PI * 2) / 16;
      var dx = cx1 + Math.cos(da) * R * 0.82;
      var dy = cy + Math.sin(da) * R * 0.82;
      ctx.fillStyle = (d % 2 === 0) ? '#f2c832' : '#e8e2d4';
      ctx.fillRect(dx - R * 0.03, dy - R * 0.03, R * 0.06, R * 0.06);
    }
    // Dim the disc body a touch so the overlap reads brightest.
    ctx.fillStyle = 'rgba(20,18,16,0.18)';
    ctx.fillRect(cx1 - R, cy - R, R * 2, R * 2);
    ctx.restore();
    // Disc rim.
    ctx.strokeStyle = '#e84a6a';
    ctx.lineWidth = Math.max(2, R * 0.02);
    ctx.beginPath();
    ctx.arc(cx1, cy, R, 0, Math.PI * 2);
    ctx.stroke();

    // ---- Austere disc (right): dark concentric / linear motifs ----
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx2, cy, R, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = '#26241f';
    ctx.fillRect(cx2 - R, cy - R, R * 2, R * 2);
    // Concentric rings in stone gray.
    for (var r = 1; r <= 6; r++) {
      ctx.strokeStyle = (r % 2 === 0) ? '#8a8578' : '#3a352e';
      ctx.lineWidth = Math.max(1.5, R * 0.02);
      ctx.beginPath();
      ctx.arc(cx2, cy, (r / 6) * R * 0.95, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Sparse linear bars rotating slowly with the disc.
    for (var b = 0; b < 4; b++) {
      var ba = ph2 + (b * Math.PI) / 2;
      ctx.strokeStyle = '#8a8578';
      ctx.lineWidth = Math.max(2, R * 0.025);
      ctx.beginPath();
      ctx.moveTo(cx2 + Math.cos(ba) * R * 0.15, cy + Math.sin(ba) * R * 0.15);
      ctx.lineTo(cx2 + Math.cos(ba) * R * 0.92, cy + Math.sin(ba) * R * 0.92);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(20,18,16,0.18)';
    ctx.fillRect(cx2 - R, cy - R, R * 2, R * 2);
    ctx.restore();
    ctx.strokeStyle = '#8a8578';
    ctx.lineWidth = Math.max(2, R * 0.02);
    ctx.beginPath();
    ctx.arc(cx2, cy, R, 0, Math.PI * 2);
    ctx.stroke();

    // ---- Overlap: the invisible fifth record ----
    // Amplitude: full only while BOTH discs turn; 0 when either is stopped.
    var target = (Math.abs(pop.rate) > 0.02 && Math.abs(aus.rate) > 0.02) ? 1 : 0;
    // Smooth toward target over ~0.8 s of piece time (closed form per frame).
    overlapAmp += (target - overlapAmp) * 0.06;
    if (overlapAmp < 0.01) overlapAmp = 0;
    if (overlapAmp > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx1, cy, R, 0, Math.PI * 2);
      ctx.clip();
      ctx.beginPath();
      ctx.arc(cx2, cy, R, 0, Math.PI * 2);
      ctx.clip();
      // Dark ground inside the lens so gold reads brightest.
      ctx.fillStyle = '#141210';
      ctx.fillRect(W / 2 - R, cy - R, R * 2, R * 2);
      // Moiré rings computed ONLY from the phase difference.
      var mx = W / 2;
      var rings = 14;
      for (var ri = 0; ri < rings; ri++) {
        var frac = ri / rings;
        // Ring radius breathes with the interference: beat between the two spins.
        var breathe = Math.sin(phaseDiff * 1.0 + frac * Math.PI * 2) * 0.5 + 0.5;
        var rr = (frac * 0.95 + 0.05) * R * (0.85 + 0.3 * breathe);
        var alpha = a4(0.25 + 0.75 * overlapAmp * (0.4 + 0.6 * breathe));
        ctx.strokeStyle = 'rgba(212,162,78,' + alpha + ')';
        ctx.lineWidth = Math.max(1.5, R * 0.022);
        ctx.beginPath();
        ctx.arc(mx, cy, rr, 0, Math.PI * 2);
        ctx.stroke();
      }
      // Beat spokes: sharp radial ticks whose count follows the phase difference.
      var tickCount = 24;
      for (var ti = 0; ti < tickCount; ti++) {
        var ta = (ti * Math.PI * 2) / tickCount + phaseDiff * 0.5;
        var talpha = a4(0.55 * overlapAmp * (0.5 + 0.5 * Math.cos(phaseDiff + ti)));
        if (talpha <= 0.02) continue;
        ctx.strokeStyle = 'rgba(212,162,78,' + talpha + ')';
        ctx.lineWidth = Math.max(1, R * 0.012);
        ctx.beginPath();
        ctx.moveTo(mx + Math.cos(ta) * R * 0.12, cy + Math.sin(ta) * R * 0.12);
        ctx.lineTo(mx + Math.cos(ta) * R * 0.95, cy + Math.sin(ta) * R * 0.95);
        ctx.stroke();
      }
      // Center pulse: a bright gold dot whose size follows the beat.
      var pulse = 0.5 + 0.5 * Math.sin(phaseDiff * 2.0);
      var pr = R * (0.05 + 0.05 * pulse) * overlapAmp;
      ctx.fillStyle = 'rgba(212,162,78,' + a4(0.95 * overlapAmp) + ')';
      ctx.fillRect(mx - pr, cy - pr, pr * 2, pr * 2);
      ctx.restore();
    }
  }

  // ---- Interaction: drag a disc to set its spin; gentle release stops it ----
  var drag = null;
  function discAt(x, y) {
    var L = layout();
    var d1 = Math.hypot(x - L.cx1, y - L.cy);
    var d2 = Math.hypot(x - L.cx2, y - L.cy);
    if (d1 <= L.R) return { disc: pop, cx: L.cx1, cy: L.cy };
    if (d2 <= L.R) return { disc: aus, cx: L.cx2, cy: L.cy };
    return null;
  }
  function angleOf(x, y, cx, cy) { return Math.atan2(y - cy, x - cx); }
  canvas.addEventListener('pointerdown', function (ev) {
    var hit = discAt(ev.clientX, ev.clientY);
    if (!hit) return;
    drag = {
      disc: hit.disc, cx: hit.cx, cy: hit.cy,
      lastAngle: angleOf(ev.clientX, ev.clientY, hit.cx, hit.cy),
      lastT: performance.now(), vel: 0, samples: []
    };
    canvas.setPointerCapture(ev.pointerId);
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    var now = performance.now();
    var a = angleOf(ev.clientX, ev.clientY, drag.cx, drag.cy);
    var da = a - drag.lastAngle;
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    var dt = Math.max(1, now - drag.lastT) / 1000;
    var v = da / dt;
    drag.samples.push(v);
    if (drag.samples.length > 5) drag.samples.shift();
    // Scrub: the disc follows the pointer angle directly.
    drag.disc.phase += da;
    drag.lastAngle = a;
    drag.lastT = now;
  });
  function endDrag() {
    if (!drag) return;
    var sum = 0;
    for (var i = 0; i < drag.samples.length; i++) sum += drag.samples[i];
    var avg = drag.samples.length ? sum / drag.samples.length : 0;
    // Gentle release (|v| < 0.25 rad/s) stops the disc — killing the fifth record.
    // A firm flick sets the new spin rate, clamped to a musical range.
    if (Math.abs(avg) < 0.25) {
      drag.disc.rate = 0;
    } else {
      drag.disc.rate = Math.max(-1.6, Math.min(1.6, avg));
    }
    drag.disc.phase = drag.disc.phase; // phase already scrubbed live
    drag = null;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---- Clock: frame one is draw(0); the loop starts the clock ----
  var clockT = 0;
  var booted = false;
  draw(0);
  booted = true;
  var startStamp = 0;
  function loop(stamp) {
    if (!startStamp) startStamp = stamp;
    clockT = (stamp - startStamp) / 1000;
    draw(clockT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
