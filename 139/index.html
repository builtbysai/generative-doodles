<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Twist Weave Screen</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E0E10; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  buildGrid();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

var PAPER = '#3A5A9C', SHADOW = '#24355F', HIGH = '#6E8FD4', BG = '#0E0E10';
var SQ2 = Math.SQRT2;
var TUNE = [1, SQ2, SQ2, 1];
var cols = [], rows = [];
function axis(total, unit) {
  var out = [], acc = 0, i = 0;
  while (acc < total + unit * 0.5) {
    var s = TUNE[i % 4] * unit;
    out.push({ start: acc, size: s, idx: i });
    acc += s; i++;
  }
  return out;
}
function buildGrid() {
  var unit = Math.max(W, H * 0.62) / 16.5;
  cols = axis(W, unit); rows = axis(H, unit);
}
function ease(x) { return x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x); }
function foldAt(t, d) {
  // 26s loop: ripple in [0,6], hold [6,9], ripple back inverted [9,15], rest [15,26]
  var start = d * 0.22, dur = 2.2;
  if (t < 9) return { f: ease((t - start) / dur), inv: false };
  if (t < 18) {
    var lt = t - 9;
    var f = 1 - ease((lt - start) / dur);
    var inv = lt > start + dur * 0.5;
    return { f: f, inv: inv };
  }
  return { f: 0, inv: true };
}
function poly(pts, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}
function drawTwist(cx, cy, s, f, inv) {
  var h = s / 2;
  var ang = (inv ? -1 : 1) * f * Math.PI / 4;
  var ir = h * 0.60;
  var corners = [[cx - h, cy - h], [cx + h, cy - h], [cx + h, cy + h], [cx - h, cy + h]];
  var inner = [];
  for (var k = 0; k < 4; k++) {
    var a = ang + Math.PI / 4 + k * Math.PI / 2;
    inner.push([cx + Math.cos(a) * ir * Math.SQRT2 * 0.7071, cy + Math.sin(a) * ir * Math.SQRT2 * 0.7071]);
  }
  poly(corners, PAPER);
  if (f > 0.04) {
    for (k = 0; k < 4; k++) {
      var mid = [(inner[k][0] + inner[(k + 1) % 4][0]) / 2, (inner[k][1] + inner[(k + 1) % 4][1]) / 2];
      var tri = [corners[k], corners[(k + 1) % 4], mid];
      poly(tri, ((k % 2 === 0) !== inv) ? HIGH : SHADOW);
    }
  }
  poly(inner, PAPER);
  ctx.strokeStyle = HIGH; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(inner[0][0], inner[0][1]);
  for (k = 1; k < 4; k++) ctx.lineTo(inner[k][0], inner[k][1]);
  ctx.closePath(); ctx.stroke();
  ctx.strokeStyle = SHADOW;
  for (k = 0; k < 4; k++) {
    ctx.beginPath();
    ctx.moveTo(corners[k][0], corners[k][1]);
    ctx.lineTo(inner[k][0], inner[k][1]);
    ctx.stroke();
  }
}
function drawRhomb(cx, cy, w, h, flip) {
  var pts = [[cx, cy - h / 2], [cx + w / 2, cy], [cx, cy + h / 2], [cx - w / 2, cy]];
  poly(pts, PAPER);
  var t1 = flip ? [pts[0], pts[1], [cx, cy]] : [pts[0], [cx, cy], pts[3]];
  var t2 = flip ? [pts[2], [cx, cy], pts[1]] : [pts[2], pts[3], [cx, cy]];
  poly(t1, HIGH); poly(t2, SHADOW);
  ctx.strokeStyle = SHADOW; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.stroke();
}
function draw(t) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  var gap = 1.5;
  for (var r = 0; r < rows.length; r++) {
    for (var c = 0; c < cols.length; c++) {
      var cw = TUNE[c % 4], ch = TUNE[r % 4];
      var x = cols[c].start, y = rows[r].start, s = cols[c].size, sh = rows[r].size;
      var cx = x + s / 2, cy = y + sh / 2;
      if (cw === SQ2 && ch === SQ2) {
        var st = foldAt(t, c + r);
        drawTwist(cx, cy, Math.min(s, sh) - gap * 2, st.f, st.inv);
      } else if (cw === 1 && ch === 1) {
        // negative space: leave the background showing, framed by a hairline of shadow
        ctx.strokeStyle = SHADOW; ctx.lineWidth = 1;
        ctx.strokeRect(x + gap, y + gap, s - gap * 2, sh - gap * 2);
      } else {
        drawRhomb(cx, cy, s - gap * 2, sh - gap * 2, (c + r) % 2 === 0);
      }
    }
  }
}
resize();
var T0 = Date.now() - 3400;
function frame() {
  var t = ((Date.now() - T0) / 1000) % 26;
  draw(t);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
draw(3.4);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
