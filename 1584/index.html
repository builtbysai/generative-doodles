<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Fish Grown From a Sine Wave and a Hash</title>
<style>
html, body { margin: 0; padding: 0; background: #03030A; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#03030A';
var CYAN = '#35D6E8';
var ICE = '#BFEFFF';
var DEEP = '#1E4FE0';
var GHOST = '#FFFFFF';
// Fixed loop phase for the synchronous first frame. The rAF loop is
// anchored as T0 + elapsed-since-load, so frame one is reproducible
// and the thumb byte-compares. T0 = 7.3 sits between sonar pulses and
// far from the ghost-flash window, so frame one holds exactly one fish.
var T0 = 7.3;
var PULSE_EVERY = 3.0;      // seconds between sonar pulses
var PULSE_LEN = 3.2;        // seconds a pulse ring lives
var GHOST_PERIOD = 50;      // ghost flash repeats every 50 s of loop time
var GHOST_START = 20;       // flash opens 20 s into each 50 s cycle
var GHOST_LEN = 1.6;        // seconds the ghost is visible
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, startT = null;
var seed = 1584;
var glitter = [];           // hash-scatter dots along the spine (seeded)
var placedW = 0, placedH = 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
// Seeded glitter: fixed positions along the spine, fixed twinkle phases.
// The hash is the scatter; the sine is the body.
function buildGlitter() {
  var rnd = mulberry32(seed);
  glitter = [];
  var i;
  for (i = 0; i < 30; i++) {
    glitter.push({
      xi: 0.06 + rnd() * 0.88,            // fraction along the body
      lat: (rnd() - 0.5) * 0.9,           // lateral offset, fraction of half-width
      r: 0.5 + rnd() * 1.6,               // radius factor
      ph: rnd() * TAU,                    // twinkle phase
      sp: 1.1 + rnd() * 1.3,              // twinkle speed
      col: rnd() < 0.45 ? CYAN : (rnd() < 0.75 ? ICE : GHOST)
    });
  }
  placedW = VW; placedH = VH;
}
// Fish centre at loop time t: a two-frequency Lissajous roam, so the
// path never repeats on a short cycle and the fish is never centred
// for long. Pure function of t, no accumulated state.
function fishPos(t) {
  return {
    x: VW * 0.5 + VW * 0.30 * Math.sin(0.021 * t + 1.1) + VW * 0.12 * Math.sin(0.047 * t + 2.6),
    y: VH * 0.5 + VH * 0.28 * Math.sin(0.017 * t + 0.4) + VH * 0.10 * Math.sin(0.053 * t + 3.9)
  };
}
// Heading from the path derivative (finite difference), bank from the
// turn rate: the fish leans into its turns.
function fishPose(t) {
  var p0 = fishPos(t - 0.6), p1 = fishPos(t + 0.6);
  var h0 = Math.atan2(fishPos(t + 0.6).y - fishPos(t - 0.6).y, fishPos(t + 0.6).x - fishPos(t - 0.6).x);
  var h1 = Math.atan2(fishPos(t + 1.8).y - fishPos(t + 0.6).y, fishPos(t + 1.8).x - fishPos(t + 0.6).x);
  var h2 = Math.atan2(fishPos(t - 0.6).y - fishPos(t - 1.8).y, fishPos(t - 0.6).x - fishPos(t - 1.8).x);
  var turn = h1 - h2;
  while (turn > Math.PI) turn -= TAU;
  while (turn < -Math.PI) turn += TAU;
  return { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2, heading: h0, bank: Math.max(-0.5, Math.min(0.5, turn * 0.55)) };
}
// Lateral offset of the body centreline at body fraction xi (0 tail,
// 1 head): a travelling sine wave, tapered at both ends so the wave
// itself is the body.
function wave(xi, t, L, ph) {
  var env = Math.pow(Math.sin(Math.PI * xi), 0.7);
  return 0.055 * L * Math.sin(TAU * 1.5 * xi - 2.6 * t + ph) * env;
}
// Half-width of the body at fraction xi.
function halfW(xi, L) {
  return 0.085 * L * Math.pow(Math.sin(Math.PI * xi), 0.65);
}
// One sine ribbon: a stroked travelling wave along the body axis,
// used for fins and the tail trail. Drawn as a filled thin ribbon so
// it tapers; no cartoon fins, only waves.
function ribbon(u0, u1, L, t, amp, wdt, color, alpha, ph, lift) {
  var N = 28, i, xi, u, yc, pts = [];
  for (i = 0; i <= N; i++) {
    xi = u0 + (u1 - u0) * i / N;
    u = (xi - 0.5) * L;
    yc = wave(xi, t, L, ph) + lift;
    pts.push([u, yc]);
  }
  ctx.globalAlpha = Number(alpha.toFixed(4));
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1] - wdt / 2);
  for (i = 1; i <= N; i++) ctx.lineTo(pts[i][0], pts[i][1] - wdt / 2);
  for (i = N; i >= 0; i--) ctx.lineTo(pts[i][0], pts[i][1] + wdt / 2);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}
// The fish, drawn in local coordinates: +u toward the head, origin at
// the centre. phase shifts the travelling wave (the ghost resamples
// the hash with a shifted phase). ghostMode draws only the white
// outline strokes, no fill.
function drawFish(x, y, heading, bank, L, t, phase, ghostMode) {
  var N = 48, i, xi, u, yc, hw;
  var up = [], dn = [];
  for (i = 0; i <= N; i++) {
    xi = i / N;
    u = (xi - 0.5) * L;
    yc = wave(xi, t, L, phase);
    hw = halfW(xi, L);
    up.push([u, yc - hw]);
    dn.push([u, yc + hw]);
  }
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(heading + bank * 0.35);
  // Bank: the body compresses slightly as it leans into a turn.
  ctx.scale(1, 1 - Math.abs(bank) * 0.18);
  ctx.globalCompositeOperation = 'lighter';
  if (!ghostMode) {
    // Body: deep-blue translucent ribbon, then a narrower cyan core.
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = DEEP;
    ctx.beginPath();
    ctx.moveTo(up[0][0], up[0][1]);
    for (i = 1; i <= N; i++) ctx.lineTo(up[i][0], up[i][1]);
    for (i = N; i >= 0; i--) ctx.lineTo(dn[i][0], dn[i][1]);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 0.32;
    ctx.fillStyle = CYAN;
    ctx.beginPath();
    for (i = 0; i <= N; i++) {
      xi = i / N; u = (xi - 0.5) * L;
      yc = wave(xi, t, L, phase);
      hw = halfW(xi, L) * 0.55;
      if (i === 0) ctx.moveTo(u, yc - hw); else ctx.lineTo(u, yc - hw);
    }
    for (i = N; i >= 0; i--) {
      xi = i / N; u = (xi - 0.5) * L;
      yc = wave(xi, t, L, phase);
      hw = halfW(xi, L) * 0.55;
      ctx.lineTo(u, yc + hw);
    }
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  // The spine and its two sister waves: three parallel sine strokes,
  // so the body reads as sine waves, not anatomy.
  var strokes = ghostMode
    ? [{ ph: phase, col: GHOST, a: 0.55, w: 1.6 }]
    : [
        { ph: phase, col: ICE, a: 0.85, w: 2.0 },
        { ph: phase + 0.7, col: CYAN, a: 0.30, w: 1.4 },
        { ph: phase - 0.7, col: CYAN, a: 0.30, w: 1.4 }
      ];
  var s, j;
  for (s = 0; s < strokes.length; s++) {
    ctx.globalAlpha = Number(strokes[s].a.toFixed(4));
    ctx.strokeStyle = strokes[s].col;
    ctx.lineWidth = strokes[s].w;
    ctx.beginPath();
    for (j = 0; j <= N; j++) {
      xi = j / N; u = (xi - 0.5) * L;
      yc = wave(xi, t, L, strokes[s].ph);
      if (j === 0) ctx.moveTo(u, yc); else ctx.lineTo(u, yc);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (!ghostMode) {
    // Dorsal ribbon above the mid-body, pectoral ribbons trailing from
    // the head, tail ribbon streaming behind: all sine waves.
    var u = Math.min(VW, VH) / 900;
    ribbon(0.30, 0.72, L, t, 0, 2.2 * u, CYAN, 0.35, phase + 0.4, -halfW(0.5, L) * 0.9);
    ribbon(0.78, 0.45, L, t, 0, 1.8 * u, ICE, 0.30, phase + 1.2, halfW(0.7, L) * 0.8);
    ribbon(0.78, 0.45, L, t, 0, 1.8 * u, ICE, 0.30, phase - 1.2, -halfW(0.7, L) * 0.8);
    // Tail trail: the wave continues past the tail, widening, curving
    // and fading, like a ribbon streaming behind the fish.
    var tail = [];
    for (i = 0; i <= 20; i++) {
      var f = i / 20;
      var tu = -L / 2 - f * 0.34 * L;
      var ty = wave(0.12, t - f * 1.1, L, phase) * (1 + f * 1.6);
      tail.push([tu, ty]);
    }
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 2.0 * u;
    ctx.beginPath();
    ctx.moveTo(tail[0][0], tail[0][1]);
    for (i = 1; i <= 20; i++) ctx.lineTo(tail[i][0], tail[i][1]);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // Hash-scatter glitter along the spine.
    var g, gx, gy, ga;
    for (g = 0; g < glitter.length; g++) {
      var d = glitter[g];
      gx = (d.xi - 0.5) * L;
      gy = wave(d.xi, t, L, phase) + d.lat * halfW(d.xi, L) * 0.8;
      ga = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(d.sp * t + d.ph));
      ctx.globalAlpha = Number(ga.toFixed(4));
      ctx.fillStyle = d.col;
      ctx.beginPath();
      ctx.moveTo(gx + d.r * u, gy);
      ctx.arc(gx, gy, d.r * u, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}
// Ghost alpha: a smooth 1.6 s flash opening 20 s into each 50 s cycle.
function ghostAlpha(t) {
  var g = t - Math.floor(t / GHOST_PERIOD) * GHOST_PERIOD;
  if (g < GHOST_START || g > GHOST_START + GHOST_LEN) return 0;
  return 0.55 * Math.sin(Math.PI * (g - GHOST_START) / GHOST_LEN);
}
function draw(t) {
  size();
  if (glitter.length === 0 || placedW !== VW || placedH !== VH) buildGlitter();
  var minDim = Math.min(VW, VH);
  var u = minDim / 900;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var pose = fishPose(t);
  var L = 0.25 * VW;
  // Sonar pulse: one ring per pulse, expanding and fading over PULSE_LEN.
  var age = t - Math.floor(t / PULSE_EVERY) * PULSE_EVERY;
  if (age < PULSE_LEN) {
    var f = age / PULSE_LEN;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Number((0.30 * (1 - f)).toFixed(4));
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 1.6 * u;
    ctx.beginPath();
    ctx.moveTo(pose.x + 0.30 * minDim * f + 1, pose.y);
    ctx.arc(pose.x, pose.y, 0.30 * minDim * f, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = Number((0.12 * (1 - f)).toFixed(4));
    ctx.strokeStyle = ICE;
    ctx.beginPath();
    ctx.moveTo(pose.x + 0.30 * minDim * f * 0.82 + 1, pose.y);
    ctx.arc(pose.x, pose.y, 0.30 * minDim * f * 0.82, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  // The ghost flashes inside the fish: same body, resampled hash
  // (shifted wave phase, slightly smaller, white only).
  var ga = ghostAlpha(t);
  if (ga > 0) {
    ctx.globalAlpha = Number(ga.toFixed(4));
    drawFish(pose.x, pose.y, pose.heading, pose.bank, L * 0.94, t, 0.35, true);
    ctx.globalAlpha = 1;
  }
  drawFish(pose.x, pose.y, pose.heading, pose.bank, L, t, 0, false);
  if (typeof window !== 'undefined') {
    window.__p1584 = { t: t, phone: isPhone(), ghost: ga, pulseAge: age, x: pose.x, y: pose.y };
  }
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
// Watch-only: no pointer interaction of any kind.
draw(T0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = T0 + (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
