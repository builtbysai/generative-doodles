<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madhur's Phulkari</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0806; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  /* Seeded PRNG only. No Math.random anywhere. */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(20261101);

  /* Deterministic per-step hash for the stop-motion jitter. */
  function h2(a, b) {
    var x = (Math.imul(a, 374761393) + Math.imul(b, 668265263)) | 0;
    x = Math.imul(x ^ (x >>> 13), 1274126177);
    return (((x ^ (x >>> 16)) >>> 0) / 4294967296);
  }

  var FW = 1600, FH = 900; /* design space: cinematic 16:9 film frame */
  var LOOP = 48;           /* 0-40 dim inward, 40-44 scrawl sweep, 44-48 redraw + restore */
  var W = 0, H = 0, isPhone = false;
  var curT = 0;            /* piece time of the last drawn frame */
  var drags = [];          /* recorded drag scrawls: {x, y, t, seed} */

  /* ---- phulkari cell field (seeded once) ---- */
  var cells = [];
  (function () {
    for (var gx = 80; gx <= 1520; gx += 80) {
      for (var gy = 80; gy <= 820; gy += 80) {
        var dist = Math.min(gx, FW - gx, gy, FH - gy);
        cells.push({
          x: gx + (rnd() - 0.5) * 8,
          y: gy + (rnd() - 0.5) * 8,
          type: Math.floor(rnd() * 4),
          rot: (rnd() - 0.5) * 0.5,
          dist: dist
        });
      }
    }
  })();

  /* ---- chalk figures: stroke polylines in frame coords ----
     Each figure: { strokes: [[x,y],...] (one stroke per polyline),
                    head: [x, y, r] or null, tears: [[x, y, r]] } */
  function figure(strokes, head, tears) {
    return { strokes: strokes, head: head || null, tears: tears || [] };
  }
  var figures = [
    /* the couple, left of center, heads bowed toward each other */
    figure([
      [[520, 544], [520, 640]], [[520, 640], [500, 670]], [[520, 640], [540, 670]],
      [[520, 570], [482, 610]], [[520, 570], [558, 600]]
    ], [520, 520, 24], [[504, 548, 7], [536, 550, 6]]),
    figure([
      [[615, 537], [615, 640]], [[615, 640], [595, 670]], [[615, 640], [635, 668]],
      [[615, 565], [577, 600]], [[615, 565], [650, 610]]
    ], [615, 515, 22], [[600, 542, 6], [630, 544, 7]]),
    /* marching figures, right side */
    figure([
      [[1010, 654], [1010, 690]], [[1010, 690], [994, 720]], [[1010, 690], [1028, 718]],
      [[1010, 668], [992, 688]], [[1010, 668], [1030, 682]]
    ], [1010, 640, 14], []),
    figure([
      [[1110, 649], [1110, 690]], [[1110, 690], [1092, 720]], [[1110, 690], [1130, 716]],
      [[1110, 664], [1090, 684]], [[1110, 664], [1132, 680]]
    ], [1110, 635, 14], []),
    figure([
      [[1215, 659], [1215, 690]], [[1215, 690], [1199, 720]], [[1215, 690], [1233, 717]],
      [[1215, 672], [1197, 690]], [[1215, 672], [1235, 686]]
    ], [1215, 645, 13], []),
    /* lone figure, far right, head bowed */
    figure([
      [[1420, 576], [1412, 640]], [[1412, 640], [1400, 662]], [[1412, 640], [1426, 660]],
      [[1418, 600], [1402, 632]], [[1418, 600], [1434, 630]]
    ], [1422, 560, 16], [])
  ];

  /* ---- scrawl sweep paths: noisy diagonals through the figure clusters ---- */
  function sweepPath(x0, y0, x1, y1, seed) {
    var r = mulberry32(seed);
    var pts = [];
    var n = 26;
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy);
    var nx = -dy / len, ny = dx / len;
    for (var i = 0; i <= n; i++) {
      var f = i / n;
      var off = (r() - 0.5) * 90 * Math.sin(f * Math.PI);
      pts.push([x0 + dx * f + nx * off, y0 + dy * f + ny * off]);
    }
    return pts;
  }
  var sweeps = [
    sweepPath(350, 420, 760, 770, 11),   /* through the couple */
    sweepPath(850, 450, 1360, 790, 23),  /* through the marchers */
    sweepPath(1200, 200, 1560, 700, 37), /* past the lone figure */
    sweepPath(100, 760, 520, 900, 51)    /* bottom-left flourish */
  ];

  /* ---- loop-phase helpers (all closed-form over piece time) ---- */
  function loopT(t) { return ((t % LOOP) + LOOP) % LOOP; }
  function cellBright(dist, lt) {
    if (lt < 40) {
      var front = (lt / 40) * 450;
      var f = (front - dist) / 60;
      if (f < 0) f = 0; if (f > 1) f = 1;
      return 1 - 0.85 * f;
    }
    if (lt < 44) return 0.15;
    return 0.15 + 0.85 * ((lt - 44) / 4);
  }
  function figFrac(lt) {
    if (lt < 44) return 1;
    return (lt - 44) / 4; /* figures draw themselves back in */
  }
  function scrawlAlpha(lt) {
    if (lt < 40) return 0;
    if (lt < 44) return 1;
    return 1 - (lt - 44) / 4;
  }
  function scrawlFrac(lt) {
    if (lt < 40) return 0;
    if (lt < 44) return (lt - 40) / 4;
    return 1;
  }

  function drawCell(c, bright) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    var r = 26;
    if (bright > 0.5) {
      ctx.strokeStyle = '#C96A3B';
      ctx.globalAlpha = 0.25 + 0.55 * bright;
    } else {
      ctx.strokeStyle = '#5A3A2E';
      ctx.globalAlpha = 0.55;
    }
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (c.type === 0) { /* diamond outline */
      ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath();
    } else if (c.type === 1) { /* X dashes */
      ctx.moveTo(-r * 0.7, -r * 0.7); ctx.lineTo(-r * 0.2, -r * 0.2);
      ctx.moveTo(r * 0.2, r * 0.2); ctx.lineTo(r * 0.7, r * 0.7);
      ctx.moveTo(r * 0.7, -r * 0.7); ctx.lineTo(r * 0.2, -r * 0.2);
      ctx.moveTo(-r * 0.2, r * 0.2); ctx.lineTo(-r * 0.7, r * 0.7);
    } else if (c.type === 2) { /* plus dashes */
      ctx.moveTo(0, -r); ctx.lineTo(0, -r * 0.3);
      ctx.moveTo(0, r * 0.3); ctx.lineTo(0, r);
      ctx.moveTo(-r, 0); ctx.lineTo(-r * 0.3, 0);
      ctx.moveTo(r * 0.3, 0); ctx.lineTo(r, 0);
    } else { /* small square with a dot */
      ctx.moveTo(-r * 0.55, -r * 0.55); ctx.lineTo(r * 0.55, -r * 0.55);
      ctx.lineTo(r * 0.55, r * 0.55); ctx.lineTo(-r * 0.55, r * 0.55); ctx.closePath();
    }
    ctx.stroke();
    if (c.type === 3) {
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath();
      ctx.moveTo(4, 0); ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    /* glow pass: wider, fainter repeat for bright cells */
    if (bright > 0.5) {
      ctx.globalAlpha = 0.10 * bright;
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFigure(fig, fi, t, frac) {
    var step = Math.floor(t * 8); /* stop-motion jitter, quantized */
    var dx = (h2(step, fi * 2) - 0.5) * 4;
    var dy = (h2(step, fi * 2 + 1) - 0.5) * 4;
    ctx.save();
    ctx.translate(dx, dy);
    ctx.strokeStyle = '#8E887C';
    ctx.fillStyle = '#8E887C';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var n = Math.round(frac * fig.strokes.length);
    for (var i = 0; i < n; i++) {
      var s = fig.strokes[i];
      ctx.beginPath();
      ctx.moveTo(s[0][0], s[0][1]);
      for (var j = 1; j < s.length; j++) ctx.lineTo(s[j][0], s[j][1]);
      ctx.stroke();
    }
    if (fig.head && frac >= 1) {
      ctx.beginPath();
      ctx.moveTo(fig.head[0] + fig.head[2], fig.head[1]);
      ctx.arc(fig.head[0], fig.head[1], fig.head[2], 0, Math.PI * 2);
      ctx.stroke();
    }
    if (frac >= 1) {
      for (var k = 0; k < fig.tears.length; k++) {
        var tr = fig.tears[k];
        /* black tear with a chalk outline, so it reads on near-black */
        ctx.beginPath();
        ctx.moveTo(tr[0], tr[1] - tr[2]);
        ctx.bezierCurveTo(tr[0] + tr[2], tr[1], tr[0] + tr[2] * 0.6, tr[1] + tr[2] * 1.6, tr[0], tr[1] + tr[2] * 2);
        ctx.bezierCurveTo(tr[0] - tr[2] * 0.6, tr[1] + tr[2] * 1.6, tr[0] - tr[2], tr[1], tr[0], tr[1] - tr[2]);
        ctx.closePath();
        ctx.fillStyle = '#000000';
        ctx.fill();
        ctx.strokeStyle = '#8E887C';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawSweep(pts, frac, alpha) {
    if (frac <= 0 || alpha <= 0) return;
    var count = Math.max(2, Math.floor(frac * pts.length));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#050404';
    ctx.lineWidth = 30;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < count; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(pts[0][0] + 14, pts[0][1] - 10);
    for (var j = 1; j < count; j++) ctx.lineTo(pts[j][0] + 14, pts[j][1] - 10);
    ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    curT = t;
    ctx.fillStyle = '#0A0806';
    ctx.fillRect(0, 0, W, H);
    var s = Math.min(W / FW, H / FH);
    var ox = (W - FW * s) / 2, oy = (H - FH * s) / 2;
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(s, s);
    ctx.fillStyle = '#0E0C0A';
    ctx.fillRect(0, 0, FW, FH);

    var lt = loopT(t);
    for (var i = 0; i < cells.length; i++) {
      drawCell(cells[i], cellBright(cells[i].dist, lt));
    }

    var frac = figFrac(lt);
    for (var f = 0; f < figures.length; f++) {
      drawFigure(figures[f], f, t, frac);
    }

    var sa = scrawlAlpha(lt), sf = scrawlFrac(lt);
    for (var w = 0; w < sweeps.length; w++) {
      drawSweep(sweeps[w], sf, sa);
    }

    /* drag-stirred scrawls: follow the drag briefly, then fade */
    for (var d = 0; d < drags.length; d++) {
      var age = t - drags[d].t;
      if (age < 0 || age > 4) continue;
      var a = Math.exp(-age / 1.5) * 0.9;
      var r = mulberry32(drags[d].seed);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = '#050404';
      ctx.lineWidth = 20;
      ctx.lineCap = 'round';
      ctx.beginPath();
      var bx = drags[d].x - 60, by = drags[d].y + 60;
      ctx.moveTo(bx, by);
      for (var p = 1; p <= 8; p++) {
        var pf = p / 8;
        ctx.lineTo(bx + 120 * pf + (r() - 0.5) * 30, by - 120 * pf + (r() - 0.5) * 30);
      }
      ctx.stroke();
      ctx.restore();
    }

    ctx.strokeStyle = 'rgba(142,136,124,0.18)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, FW - 2, FH - 2);
    ctx.restore();

    /* pin canvas element size (phone house rule) */
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function size() {
    var vw = window.innerWidth, vh = window.innerHeight;
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    }
    W = Math.round(vw); H = Math.round(vh);
    canvas.width = W; canvas.height = H;
    if (window.screen && window.screen.width && window.screen.height) {
      var mn = Math.min(window.screen.width, window.screen.height);
      isPhone = mn < 700;
    } else {
      isPhone = H > W * 1.15;
    }
    draw(0); /* frame one pinned to t = 0, boot-flag rule */
  }

  function toFrame(e) {
    var r = canvas.getBoundingClientRect();
    var s = Math.min(W / FW, H / FH);
    var ox = (W - FW * s) / 2, oy = (H - FH * s) / 2;
    return { x: (e.clientX - r.left - ox) / s, y: (e.clientY - r.top - oy) / s };
  }
  function onDrag(e) {
    var p = toFrame(e);
    if (p.x < -50 || p.x > FW + 50 || p.y < -50 || p.y > FH + 50) return;
    drags.push({ x: p.x, y: p.y, t: curT, seed: 1000 + drags.length * 17 });
    if (drags.length > 40) drags.shift();
  }
  canvas.addEventListener('pointerdown', onDrag);
  canvas.addEventListener('pointermove', function (e) {
    if (e.buttons) onDrag(e);
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', size);
  }
  window.addEventListener('resize', size);

  size(); /* synchronous first frame at t = 0 */

  /* rAF loop, plain declaration (no named-function-expression trap).
     The clock starts here, never inside frame one. */
  var startTime = 0;
  function loop() {
    var t = 0;
    if (typeof performance !== 'undefined' && performance.now) {
      t = (performance.now() - startTime) / 1000;
    }
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    if (typeof performance !== 'undefined' && performance.now) {
      startTime = performance.now();
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
