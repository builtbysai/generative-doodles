<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sábados a la Mañana</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAF7F0; overflow: hidden; }
  canvas { display: block; cursor: pointer; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var TAU = Math.PI * 2;
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

// ---------- palette (strict, clara-lagos block 6) ----------
var INK = "#1A1A1A";    // her loose black ink: cards, starters, sheet border
var PAPER = "#FAF7F0";  // page ground, table top, cards, sheet
var BLUE = "#3E6FA8";   // soft blue: ONE card border + her pencil, nothing else
var YELLOW = "#E8B93E"; // warm yellow: the kids' color, viewer marks ONLY

// ---------- canvas / viewport ----------
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone() {
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0) return mn < 700;
  return H > W * 1.15;
}

var grain = [];
function buildGrain() {
  // Paper speckle for the whole stage, fixed seed: identical every load.
  grain = [];
  var r = mulberry32(598001);
  for (var i = 0; i < 520; i++) {
    grain.push([r() * 1000, r() * 1000, 0.6 + r() * 1.1, 0.05 + r() * 0.07]);
  }
}

function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  buildGrain();
  draw(currentPhase());
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
}
window.addEventListener("resize", resize);

// ---------- animation clock ----------
// Frame one is drawn synchronously at PHASE0: the table set for Saturday,
// cards fanned, sheet blank, no game started. All animation (starter
// reveals, playback) is anchored to PHASE0 + elapsed since load;
// performance.now measures elapsed only, the wall clock is never consulted.
var PHASE0 = 0;
var startStamp = null;

function currentPhase() {
  if (startStamp === null) return PHASE0;
  var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  return PHASE0 + (now - startStamp) / 1000;
}

// ---------- stage transform (1000x1000 logical stage) ----------
function stageScale() { return Math.min(W, H) / 1000; }
function toStage(px, py) {
  var s = stageScale();
  return [(px - (W - 1000 * s) / 2) / s, (py - (H - 1000 * s) / 2) / s];
}

// ---------- hand-line helpers ----------
// Every drawn line is a precomputed wobbly polyline (seeded at build time),
// so the hand never changes its mind between frames. Animation only reveals.
function ptsLine(r, x1, y1, x2, y2, seg, wob) {
  var pts = [];
  for (var i = 0; i <= seg; i++) {
    var t = i / seg;
    var px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t;
    if (i > 0 && i < seg) { px += (r() - 0.5) * 2 * wob; py += (r() - 0.5) * 2 * wob; }
    pts.push([px, py]);
  }
  return pts;
}
function ptsQuad(r, x1, y1, cx, cy, x2, y2, seg, wob) {
  var pts = [];
  for (var i = 0; i <= seg; i++) {
    var t = i / seg, u = 1 - t;
    var px = u * u * x1 + 2 * u * t * cx + t * t * x2;
    var py = u * u * y1 + 2 * u * t * cy + t * t * y2;
    if (i > 0 && i < seg) { px += (r() - 0.5) * 2 * wob; py += (r() - 0.5) * 2 * wob; }
    pts.push([px, py]);
  }
  return pts;
}
function ptsArc(r, cx, cy, rad, a0, a1, seg, wob) {
  var pts = [];
  for (var i = 0; i <= seg; i++) {
    var t = i / seg, a = a0 + (a1 - a0) * t;
    var px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    px += (r() - 0.5) * 2 * wob; py += (r() - 0.5) * 2 * wob;
    pts.push([px, py]);
  }
  return pts;
}
function ptsCircle(r, cx, cy, rad, wob) { return ptsArc(r, cx, cy, rad, 0, TAU, 26, wob); }
function ptsRect(r, x, y, w, h, wob) {
  var p = [];
  var a = ptsLine(r, x, y, x + w, y, 8, wob), b = ptsLine(r, x + w, y, x + w, y + h, 7, wob),
      c = ptsLine(r, x + w, y + h, x, y + h, 8, wob), d = ptsLine(r, x, y + h, x, y, 5, wob);
  return p.concat(a, b.slice(1), c.slice(1), d.slice(1));
}
function strokePts(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function strokeLen(pts) {
  var L = 0;
  for (var i = 1; i < pts.length; i++) {
    var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
    L += Math.sqrt(dx * dx + dy * dy);
  }
  return L;
}
// Draw a polyline up to fraction frac of its total length.
function strokePartial(pts, frac) {
  if (frac >= 1) { strokePts(pts); return; }
  if (frac <= 0 || pts.length < 2) return;
  var total = strokeLen(pts), target = total * frac, acc = 0;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) {
    var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
    var seg = Math.sqrt(dx * dx + dy * dy);
    if (acc + seg <= target) { ctx.lineTo(pts[i][0], pts[i][1]); acc += seg; }
    else {
      var t = seg > 0 ? (target - acc) / seg : 0;
      ctx.lineTo(pts[i - 1][0] + dx * t, pts[i - 1][1] + dy * t);
      break;
    }
  }
  ctx.stroke();
}

// ---------- hand-lettered text ----------
// Letters are laid out one by one with seeded per-letter rotation and lift,
// so the lettering wobbles like hers and is identical every frame.
function handSeed(str) {
  var h = 598;
  for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h;
}
var HAND_FONT = '"Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive';
function handLine(text, x, y, size, color, align) {
  ctx.font = size + "px " + HAND_FONT;
  ctx.fillStyle = color;
  ctx.textBaseline = "middle";
  var widths = [], total = 0, i, w;
  for (i = 0; i < text.length; i++) { w = ctx.measureText(text[i]).width; widths.push(w); total += w; }
  var cx = align === "center" ? x - total / 2 : (align === "right" ? x - total : x);
  var r = mulberry32(handSeed(text));
  ctx.save();
  for (i = 0; i < text.length; i++) {
    var cw = widths[i];
    ctx.save();
    ctx.translate(cx + cw / 2, y + (r() - 0.5) * size * 0.08);
    ctx.rotate((r() - 0.5) * 0.07);
    ctx.fillText(text[i], -cw / 2, 0);
    ctx.restore();
    cx += cw;
  }
  ctx.restore();
}
function handBlock(text, cx, y, size, color, maxW, lineH) {
  // Word-wrap into centered hand-lettered lines; returns total height used.
  ctx.font = size + "px " + HAND_FONT;
  var words = text.split(" "), lines = [], cur = "";
  for (var i = 0; i < words.length; i++) {
    var test = cur ? cur + " " + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  for (var j = 0; j < lines.length; j++) handLine(lines[j], cx, y + j * lineH, size, color, "center");
  return lines.length * lineH;
}

// ---------- the game deck ----------
var GAMES = [
  { label: "El juego de Ramón", num: "1",
    prompt: "El juego de Ramón: dibujá el sábado del esqueleto." },
  { label: "Lo que vio la pelota", num: "2",
    prompt: "Inventá lo que vio la pelota arriba de la medianera." },
  { label: "La casa del gato", num: "3",
    prompt: "Dibujá tu casa como la ve el gato." },
  { label: "La cara que falta", num: "4",
    prompt: "Completá la cara que falta." },
  { label: "Un monstruo bueno", num: "5",
    prompt: "Un monstruo bueno que ayuda." }
];

// Starter drawings: ink stroke sets in sheet-local coords (origin = sheet
// center, x in [-225,225], y in [-160,160]). Built once, fixed seeds.
function buildStarters() {
  var S = [];
  var r, set;
  // 1. Skeleton waving, top-left of the sheet.
  r = mulberry32(598101); set = [];
  (function () {
    var cx = -140, cy = -95; // skull center
    set.push(ptsCircle(r, cx, cy, 17, 1.1));                                  // skull
    set.push(ptsLine(r, cx - 9, cy + 15, cx + 9, cy + 15, 3, 0.8));           // jaw
    set.push(ptsLine(r, cx - 5, cy + 5, cx - 5, cy + 8, 1, 0.4));             // eye L (short)
    set.push(ptsLine(r, cx + 5, cy + 5, cx + 5, cy + 8, 1, 0.4));             // eye R
    set.push(ptsLine(r, cx, cy + 17, cx, cy + 52, 5, 1.0));                   // spine
    for (var i = 0; i < 3; i++) {                                             // ribs
      var ry = cy + 26 + i * 9;
      set.push(ptsQuad(r, cx - 15, ry - 4, cx, ry + 7, cx + 15, ry - 4, 8, 0.9));
    }
    set.push(ptsLine(r, cx - 14, cy + 56, cx + 14, cy + 56, 4, 0.9));         // pelvis
    set.push(ptsLine(r, cx - 13, cy + 30, cx - 30, cy + 12, 4, 1.0));         // left arm down
    set.push(ptsLine(r, cx + 13, cy + 30, cx + 28, cy + 8, 4, 1.0));          // right arm up
    set.push(ptsLine(r, cx + 28, cy + 8, cx + 24, cy - 12, 4, 1.0));          // forearm waving
    set.push(ptsLine(r, cx + 24, cy - 12, cx + 19, cy - 17, 2, 0.7));         // hand flick 1
    set.push(ptsLine(r, cx + 24, cy - 12, cx + 29, cy - 18, 2, 0.7));         // hand flick 2
    set.push(ptsLine(r, cx - 7, cy + 56, cx - 13, cy + 92, 5, 1.0));          // left leg
    set.push(ptsLine(r, cx + 7, cy + 56, cx + 14, cy + 92, 5, 1.0));          // right leg
  })();
  S.push(set);
  // 2. Ball over a fence (la medianera), top-right of the sheet.
  r = mulberry32(598102); set = [];
  (function () {
    var y = -48; // fence top line
    set.push(ptsLine(r, 28, y, 212, y, 14, 1.1));                             // fence top
    set.push(ptsLine(r, 28, y + 34, 212, y + 34, 14, 1.1));                   // fence bottom
    for (var i = 0; i < 6; i++) {                                             // slats
      var x = 42 + i * 30;
      set.push(ptsLine(r, x, y - 6, x, y + 40, 4, 0.9));
    }
    set.push(ptsCircle(r, 96, y - 42, 15, 1.0));                              // the ball
    set.push(ptsQuad(r, 60, y - 20, 78, y - 44, 84, y - 34, 7, 0.8));         // ball patch arc
    set.push(ptsQuad(r, 128, y - 58, 152, y - 66, 176, y - 52, 8, 1.0));      // flight dots path
    set.push(ptsCircle(r, 150, y - 62, 2.2, 0.3));
    set.push(ptsCircle(r, 182, y - 50, 2.2, 0.3));
  })();
  S.push(set);
  // 3. House as the cat sees it + cat ears at the bottom edge, bottom-left.
  r = mulberry32(598103); set = [];
  (function () {
    var bx = -212, by = 128, bw = 150, bh = 96; // house box (low angle: wide base)
    set.push(ptsLine(r, bx, by, bx + bw, by, 10, 1.1));                       // base
    set.push(ptsLine(r, bx + 8, by, bx + 22, by - bh, 7, 1.1));               // left wall leaning in
    set.push(ptsLine(r, bx + bw - 8, by, bx + bw - 22, by - bh, 7, 1.1));     // right wall
    set.push(ptsLine(r, bx + 4, by - bh, bx + bw - 4, by - bh, 10, 1.1));     // eaves
    set.push(ptsLine(r, bx + 4, by - bh, bx + bw / 2, by - bh - 26, 7, 1.1)); // roof L
    set.push(ptsLine(r, bx + bw / 2, by - bh - 26, bx + bw - 4, by - bh, 7, 1.1)); // roof R
    set.push(ptsRect(r, bx + 62, by - 52, 26, 52, 0.9));                      // door
    set.push(ptsCircle(r, bx + 82, by - 26, 2.4, 0.3));                       // knob
    set.push(ptsRect(r, bx + 24, by - 74, 22, 20, 0.8));                      // window L
    set.push(ptsRect(r, bx + 104, by - 74, 22, 20, 0.8));                     // window R
    // cat ears peeking at the bottom edge of the starter's patch
    set.push(ptsLine(r, -168, 152, -156, 132, 3, 0.8));
    set.push(ptsLine(r, -156, 132, -144, 152, 3, 0.8));
    set.push(ptsLine(r, -128, 152, -116, 132, 3, 0.8));
    set.push(ptsLine(r, -116, 132, -104, 152, 3, 0.8));
    set.push(ptsQuad(r, -156, 152, -136, 144, -116, 152, 6, 0.8));            // top of cat head
  })();
  S.push(set);
  // 4. The face that is missing: head outline, one eye, nothing else. Center.
  r = mulberry32(598104); set = [];
  (function () {
    var cx = 8, cy = 2;
    set.push(ptsArc(r, cx, cy, 56, 0, TAU, 34, 1.2));                         // head
    set.push(ptsCircle(r, cx - 20, cy - 12, 6, 0.8));                         // the one eye
    set.push(ptsCircle(r, cx - 20, cy - 12, 1.8, 0.3));                       // pupil
    set.push(ptsQuad(r, cx - 30, cy - 30, cx - 20, cy - 36, cx - 10, cy - 29, 6, 0.8)); // brow
    set.push(ptsArc(r, cx, cy, 59, Math.PI * 1.18, Math.PI * 1.40, 8, 1.0)); // hair tuft
    set.push(ptsArc(r, cx, cy, 59, Math.PI * 1.60, Math.PI * 1.82, 8, 1.0)); // hair tuft 2
  })();
  S.push(set);
  // 5. A good monster who helps, holding a cup. Bottom-right.
  r = mulberry32(598105); set = [];
  (function () {
    var cx = 138, cy = 84;
    set.push(ptsCircle(r, cx, cy, 44, 1.2));                                  // round body
    set.push(ptsQuad(r, cx - 30, cy - 36, cx - 40, cy - 54, cx - 24, cy - 56, 6, 0.9)); // horn L
    set.push(ptsQuad(r, cx + 30, cy - 36, cx + 40, cy - 54, cx + 24, cy - 56, 6, 0.9)); // horn R
    set.push(ptsCircle(r, cx, cy - 14, 11, 0.9));                             // one big eye
    set.push(ptsCircle(r, cx, cy - 14, 3.4, 0.3));                            // pupil
    set.push(ptsQuad(r, cx - 16, cy + 8, cx, cy + 20, cx + 16, cy + 8, 8, 0.9)); // kind smile
    set.push(ptsLine(r, cx - 42, cy + 6, cx - 58, cy + 22, 4, 1.0));          // arm L
    set.push(ptsLine(r, cx + 42, cy + 6, cx + 56, cy + 16, 4, 1.0));          // arm R to cup
    set.push(ptsRect(r, cx + 50, cy + 14, 20, 15, 0.8));                      // the cup
    set.push(ptsArc(r, cx + 70, cy + 21, 6, -Math.PI / 2, Math.PI / 2, 7, 0.7)); // cup handle
    set.push(ptsQuad(r, cx + 54, cy + 8, cx + 60, cy + 2, cx + 66, cy + 8, 5, 0.7)); // steam
    set.push(ptsLine(r, cx - 16, cy + 43, cx - 16, cy + 54, 3, 0.8));         // foot L
    set.push(ptsLine(r, cx + 16, cy + 43, cx + 16, cy + 54, 3, 0.8));         // foot R
  })();
  S.push(set);
  return S;
}
var STARTERS = buildStarters();

// ---------- layout (stage coords) ----------
var TABLE = { x: 500, y: 568, r: 342 };
var SHEET = { x: 500, y: 568, w: 450, h: 320, rot: -0.021 }; // ~ -1.2 deg
var CARDS = [
  { gx: 243, gy: 336, rot: -0.30 },
  { gx: 488, gy: 224, rot: 0.03 },
  { gx: 757, gy: 336, rot: 0.30 },
  { gx: 799, gy: 740, rot: 0.42 },
  { gx: 201, gy: 740, rot: -0.42 }
];
var CARD_W = 176, CARD_H = 108;
var VER = { x: 500, y: 862, w: 124, h: 62, rot: 0.02 };
var cardOutline = [], verOutline = null, sheetOutline = null, pencilPts = [];
(function buildLayout() {
  var r = mulberry32(598200);
  for (var i = 0; i < CARDS.length; i++) {
    cardOutline.push(ptsRect(r, -CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H, 1.4));
  }
  verOutline = ptsRect(r, -VER.w / 2, -VER.h / 2, VER.w, VER.h, 1.2);
  sheetOutline = ptsRect(r, -SHEET.w / 2, -SHEET.h / 2, SHEET.w, SHEET.h, 1.6);
  var pr = mulberry32(598210);
  pencilPts = [
    ptsLine(pr, 208, 622, 252, 548, 8, 1.0),       // pencil body
    ptsLine(pr, 252, 548, 258, 532, 3, 0.8),       // wood cone
    ptsLine(pr, 208, 622, 202, 634, 3, 0.8)        // eraser end cap
  ];
})();

// ---------- session state (accumulates, never clears) ----------
// strokes: { pts (sheet-local), color, width, born, dur } in the order made.
var strokes = [];
var started = [false, false, false, false, false];
var activeGame = -1;
var drawing = null;      // current viewer stroke in progress (sheet-local pts)
var playback = null;     // { start, items: [{stroke, t0, dur}] }
var downInfo = null;     // { sx, sy, target, phase }

function strokeFrac(s, phase) {
  if (playback) return -1; // handled by playback renderer
  if (s.born === null) return 1;
  return clamp((phase - s.born) / s.dur, 0, 1);
}

function startGame(i, phase) {
  activeGame = i;
  if (started[i]) return;
  started[i] = true;
  var set = STARTERS[i];
  for (var j = 0; j < set.length; j++) {
    var pts = set[j];
    strokes.push({
      pts: pts, color: INK, width: 3.2,
      born: phase + j * 0.16, dur: clamp(strokeLen(pts) / 260, 0.22, 0.85)
    });
  }
}

function startPlayback(phase) {
  if (!strokes.length || playback) return;
  var items = [], t = 0;
  for (var i = 0; i < strokes.length; i++) {
    var d = clamp(strokeLen(strokes[i].pts) / 300, 0.14, 1.1);
    items.push({ stroke: strokes[i], t0: t, dur: d });
    t += d + 0.07;
  }
  playback = { start: phase, items: items, total: t };
}

// ---------- hit testing ----------
function hitCard(sx, sy) {
  for (var i = CARDS.length - 1; i >= 0; i--) {
    var c = CARDS[i], dx = sx - c.gx, dy = sy - c.gy;
    var ca = Math.cos(-c.rot), sa = Math.sin(-c.rot);
    var lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
    if (Math.abs(lx) <= CARD_W / 2 && Math.abs(ly) <= CARD_H / 2) return i;
  }
  return -1;
}
function hitVer(sx, sy) {
  var dx = sx - VER.x, dy = sy - VER.y;
  return Math.abs(dx) <= VER.w / 2 && Math.abs(dy) <= VER.h / 2;
}
function toSheetLocal(sx, sy) {
  var dx = sx - SHEET.x, dy = sy - SHEET.y;
  var ca = Math.cos(-SHEET.rot), sa = Math.sin(-SHEET.rot);
  return [dx * ca - dy * sa, dx * sa + dy * ca];
}
function inSheet(sx, sy) {
  var l = toSheetLocal(sx, sy);
  return Math.abs(l[0]) <= SHEET.w / 2 - 6 && Math.abs(l[1]) <= SHEET.h / 2 - 6;
}

// ---------- pointer interaction ----------
function evPos(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return toStage(e.clientX - rect.left, e.clientY - rect.top);
}
canvas.addEventListener("pointerdown", function (e) {
  var p = evPos(e), phase = currentPhase();
  var ci = hitCard(p[0], p[1]);
  var target = "none";
  if (ci >= 0) target = "card" + ci;
  else if (hitVer(p[0], p[1])) target = "ver";
  else if (inSheet(p[0], p[1])) target = "sheet";
  downInfo = { sx: p[0], sy: p[1], target: target, phase: phase };
  if (target === "sheet" && activeGame >= 0 && !playback) {
    var l = toSheetLocal(p[0], p[1]);
    drawing = [l];
    strokes.push({ pts: drawing, color: YELLOW, width: 5.5, born: null, dur: 0 });
  }
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
canvas.addEventListener("pointermove", function (e) {
  if (!drawing) return;
  var p = evPos(e);
  if (!inSheet(p[0], p[1])) return;
  var l = toSheetLocal(p[0], p[1]);
  var last = drawing[drawing.length - 1];
  var dx = l[0] - last[0], dy = l[1] - last[1];
  if (dx * dx + dy * dy > 4) drawing.push(l);
});
function endPointer(e) {
  var wasDrawing = !!drawing;
  drawing = null;
  if (!downInfo) return;
  var p = evPos(e), phase = currentPhase();
  var moved = Math.abs(p[0] - downInfo.sx) + Math.abs(p[1] - downInfo.sy);
  var quick = phase - downInfo.phase < 0.6;
  if (!wasDrawing && moved < 9 && quick) {
    if (downInfo.target.indexOf("card") === 0) {
      startGame(parseInt(downInfo.target.slice(4), 10), phase);
    } else if (downInfo.target === "ver") {
      startPlayback(phase);
    }
  }
  downInfo = null;
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", function () { drawing = null; downInfo = null; });

// ---------- drawing the scene ----------
function drawSheetStrokes(phase) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(-SHEET.w / 2 + 3, -SHEET.h / 2 + 3, SHEET.w - 6, SHEET.h - 6);
  ctx.clip();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  var i, s;
  if (playback) {
    var t = phase - playback.start;
    if (t >= playback.total) { playback = null; }
    else {
      for (i = 0; i < playback.items.length; i++) {
        var it = playback.items[i];
        var f = clamp((t - it.t0) / it.dur, 0, 1);
        if (f <= 0) continue;
        ctx.strokeStyle = it.stroke.color;
        ctx.lineWidth = it.stroke.width;
        strokePartial(it.stroke.pts, f);
      }
      ctx.restore();
      return;
    }
  }
  for (i = 0; i < strokes.length; i++) {
    s = strokes[i];
    var fr = strokeFrac(s, phase);
    if (fr <= 0) continue;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.width;
    strokePartial(s.pts, fr);
  }
  ctx.restore();
}

function draw(phase) {
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // page ground = the paper color everywhere
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  var s = stageScale();
  ctx.translate((W - 1000 * s) / 2, (H - 1000 * s) / 2);
  ctx.scale(s, s);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // paper grain
  ctx.fillStyle = INK;
  for (var i = 0; i < grain.length; i++) {
    ctx.globalAlpha = grain[i][3];
    ctx.fillRect(grain[i][0], grain[i][1], grain[i][2], grain[i][2]);
  }
  ctx.globalAlpha = 1;

  // title line (the brief's em dash is lettered as a comma, per house style)
  handLine("Sábados a la mañana, Club de historietas", 500, 62, 37, INK, "center");

  // active game's prompt, in her plainspoken voice
  if (activeGame >= 0) {
    handBlock(GAMES[activeGame].prompt, 500, 122, 24, INK, 760, 30);
  }

  // the round table: paper top, soft ink rim (two wobbly circles)
  var tr = mulberry32(598300);
  ctx.fillStyle = PAPER;
  ctx.beginPath();
  ctx.arc(TABLE.x, TABLE.y, TABLE.r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.85;
  ctx.lineWidth = 3.4;
  strokePts(ptsCircle(tr, TABLE.x, TABLE.y, TABLE.r, 1.6));
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = 1.6;
  strokePts(ptsCircle(tr, TABLE.x, TABLE.y, TABLE.r - 13, 1.4));
  ctx.globalAlpha = 1;

  // her pencil, on the table (soft blue, its one other spend)
  ctx.strokeStyle = BLUE;
  ctx.lineWidth = 5;
  strokePts(pencilPts[0]);
  ctx.lineWidth = 2.4;
  strokePts(pencilPts[1]);
  strokePts(pencilPts[2]);

  // the shared sheet
  ctx.save();
  ctx.translate(SHEET.x, SHEET.y);
  ctx.rotate(SHEET.rot);
  ctx.fillStyle = PAPER;
  ctx.beginPath();
  ctx.rect(-SHEET.w / 2, -SHEET.h / 2, SHEET.w, SHEET.h);
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.6;
  strokePts(sheetOutline);
  drawSheetStrokes(phase);
  ctx.restore();

  // "sin borrar", lettered small beside the sheet
  ctx.save();
  ctx.translate(355, 748);
  ctx.rotate(-0.06);
  handLine("sin borrar", 0, 0, 21, INK, "center");
  ctx.restore();

  // game cards fanned around the table edge
  for (var ci = 0; ci < CARDS.length; ci++) {
    var c = CARDS[ci];
    ctx.save();
    ctx.translate(c.gx, c.gy);
    ctx.rotate(c.rot);
    ctx.fillStyle = PAPER;
    ctx.beginPath();
    ctx.rect(-CARD_W / 2, -CARD_H / 2, CARD_W, CARD_H);
    ctx.fill();
    ctx.strokeStyle = ci === 2 ? BLUE : INK; // card 3 carries the blue border
    ctx.lineWidth = ci === activeGame ? 4 : 2.4;
    strokePts(cardOutline[ci]);
    handLine(GAMES[ci].num, -CARD_W / 2 + 20, -CARD_H / 2 + 20, 19, INK, "center");
    if (started[ci]) handLine("✓", CARD_W / 2 - 18, -CARD_H / 2 + 20, 17, INK, "center");
    handBlock(GAMES[ci].label, 0, 8, 21, INK, CARD_W - 26, 26);
    ctx.restore();
  }

  // the "ver" card: tap to watch the sheet draw itself back
  ctx.save();
  ctx.translate(VER.x, VER.y);
  ctx.rotate(VER.rot);
  ctx.fillStyle = PAPER;
  ctx.beginPath();
  ctx.rect(-VER.w / 2, -VER.h / 2, VER.w, VER.h);
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.4;
  strokePts(verOutline);
  handLine("ver", 0, 2, 26, INK, "center");
  ctx.restore();

  // hint
  ctx.globalAlpha = 0.5;
  handLine("tap · draw", 972, 968, 19, INK, "right");
  ctx.globalAlpha = 1;
}

// ---------- run ----------
resize();
if (typeof requestAnimationFrame === "function") {
  var rafLoop = function (ts) {
    if (startStamp === null) startStamp = ts;
    draw(PHASE0 + (ts - startStamp) / 1000);
    requestAnimationFrame(rafLoop);
  };
  requestAnimationFrame(rafLoop);
}
</script>
</body>
</html>
