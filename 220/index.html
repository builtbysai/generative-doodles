<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.220 Stitched Maps</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#E8E0D0; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.220 Stitched Maps (Kathy McTavish). A robotic longarm quilting
// machine stitches maps across muslin: precise indigo contour lines
// that follow a noise field, laid down stitch by dashed stitch from
// left to right. Over them a hand layer in madder, looser, jittered,
// dropping stitches and knotting where it crosses the machine work.
// When a map completes it holds, then crossfades into the next. The
// machine never stops. Watch only: the archive is the point.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#E8E0D0', MACHINE = '#1B3A6B', HAND = '#A63A2E';
var W = 0, H = 0, phone = false;
var seed = 220220;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
var T = 15, lastNow = -1; // frame one: machine layer done, hand layer under way

// ---- one map, precomputed as stitch lists in an abstract 1200x800 space ------------
var MW = 1200, MH = 800;
function makeMap(mseed) {
  var rand = rng(mseed);
  function hash2(ix, iy) {
    var n = Math.sin(ix * 127.1 + iy * 311.7 + mseed * 0.017) * 43758.5453;
    return n - Math.floor(n);
  }
  function vnoise(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x - ix, fy = y - iy;
    var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    var a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
    return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
  }
  function field(x, y) {
    return vnoise(x * 3.1, y * 3.1) * 0.55 + vnoise(x * 6.3 + 9, y * 6.3 + 4) * 0.30 + vnoise(x * 12.7 + 3, y * 12.7 + 8) * 0.15;
  }
  // -- machine layer: marching squares over a 48x32 lattice, segments
  //    chained into polylines, polylines resampled as running stitches
  var GX = 48, GY = 32, cw = MW / GX, chh = MH / GY;
  var vals = [];
  for (var j = 0; j <= GY; j++) { vals.push([]); for (var i = 0; i <= GX; i++) vals[j].push(field(i / GX, j / GY)); }
  var levels = [0.30, 0.40, 0.50, 0.60, 0.70];
  var segs = [];
  function edgePt(i, j, e) {
    // e: 0 top, 1 right, 2 bottom, 3 left of cell (i,j)
    var x0, y0, x1, y1, v0, v1;
    if (e === 0) { x0 = i * cw; y0 = j * chh; x1 = (i + 1) * cw; y1 = j * chh; v0 = vals[j][i]; v1 = vals[j][i + 1]; }
    if (e === 1) { x0 = (i + 1) * cw; y0 = j * chh; x1 = (i + 1) * cw; y1 = (j + 1) * chh; v0 = vals[j][i + 1]; v1 = vals[j + 1][i + 1]; }
    if (e === 2) { x0 = i * cw; y0 = (j + 1) * chh; x1 = (i + 1) * cw; y1 = (j + 1) * chh; v0 = vals[j + 1][i]; v1 = vals[j + 1][i + 1]; }
    if (e === 3) { x0 = i * cw; y0 = j * chh; x1 = i * cw; y1 = (j + 1) * chh; v0 = vals[j][i]; v1 = vals[j + 1][i]; }
    return { x0: x0, y0: y0, x1: x1, y1: y1, v0: v0, v1: v1 };
  }
  function cross(ep, lev) {
    var k = (lev - ep.v0) / ((ep.v1 - ep.v0) || 1e-9);
    k = clamp(k, 0, 1);
    return [lerp(ep.x0, ep.x1, k), lerp(ep.y0, ep.y1, k)];
  }
  for (var li = 0; li < levels.length; li++) {
    var lev = levels[li];
    for (var cj = 0; cj < GY; cj++) {
      for (var ci = 0; ci < GX; ci++) {
        var idx = 0;
        if (vals[cj][ci] > lev) idx |= 1;
        if (vals[cj][ci + 1] > lev) idx |= 2;
        if (vals[cj + 1][ci + 1] > lev) idx |= 4;
        if (vals[cj + 1][ci] > lev) idx |= 8;
        if (idx === 0 || idx === 15) continue;
        var pts = [cross(edgePt(ci, cj, 0), lev), cross(edgePt(ci, cj, 1), lev),
                   cross(edgePt(ci, cj, 2), lev), cross(edgePt(ci, cj, 3), lev)];
        var table = { 1: [3, 2], 2: [0, 1], 3: [3, 1], 4: [1, 2], 6: [0, 2], 7: [3, 0],
                      8: [0, 3], 9: [0, 2], 11: [1, 2], 12: [1, 3], 13: [0, 1], 14: [2, 3] };
        if (idx === 5) { segs.push([pts[3], pts[0]]); segs.push([pts[1], pts[2]]); }
        else if (idx === 10) { segs.push([pts[0], pts[1]]); segs.push([pts[2], pts[3]]); }
        else if (table[idx]) segs.push([pts[table[idx][0]], pts[table[idx][1]]]);
      }
    }
  }
  // chain segments into polylines by shared endpoints
  function key(p) { return Math.round(p[0] * 2) + ',' + Math.round(p[1] * 2); }
  var byKey = {};
  segs.forEach(function (s, si) {
    [key(s[0]), key(s[1])].forEach(function (k) {
      if (!byKey[k]) byKey[k] = [];
      byKey[k].push(si);
    });
  });
  var used = new Array(segs.length).fill(false);
  var polys = [];
  segs.forEach(function (s, si) {
    if (used[si]) return;
    used[si] = true;
    var line = [s[0], s[1]];
    var grew = true;
    while (grew) { // extend the tail
      grew = false;
      var tail = line[line.length - 1], cands = byKey[key(tail)] || [];
      for (var q = 0; q < cands.length; q++) {
        var cs = segs[cands[q]];
        if (used[cands[q]]) continue;
        if (key(cs[0]) === key(tail)) { line.push(cs[1]); used[cands[q]] = true; grew = true; break; }
        if (key(cs[1]) === key(tail)) { line.push(cs[0]); used[cands[q]] = true; grew = true; break; }
      }
    }
    grew = true;
    while (grew) { // extend the head
      grew = false;
      var head = line[0], cands2 = byKey[key(head)] || [];
      for (var q2 = 0; q2 < cands2.length; q2++) {
        var cs2 = segs[cands2[q2]];
        if (used[cands2[q2]]) continue;
        if (key(cs2[0]) === key(head)) { line.unshift(cs2[1]); used[cands2[q2]] = true; grew = true; break; }
        if (key(cs2[1]) === key(head)) { line.unshift(cs2[0]); used[cands2[q2]] = true; grew = true; break; }
      }
    }
    polys.push(line);
  });
  // resample a polyline into stitch segments along its arc length
  function stitchify(line, lenFn, gapFn, jitter) {
    var out = [];
    var acc = 0, draw = true, segLen = lenFn();
    for (var i = 1; i < line.length; i++) {
      var ax = line[i - 1][0], ay = line[i - 1][1], bx = line[i][0], by = line[i][1];
      var d = Math.hypot(bx - ax, by - ay);
      var pos = 0;
      while (pos < d) {
        var step = Math.min(segLen - acc, d - pos);
        var t0 = (pos) / d, t1 = (pos + step) / d;
        if (draw) {
          var jx = jitter ? (rand() - 0.5) * jitter : 0, jy = jitter ? (rand() - 0.5) * jitter : 0;
          out.push([lerp(ax, bx, t0) + jx, lerp(ay, by, t0) + jy, lerp(ax, bx, t1) + jx, lerp(ay, by, t1) + jy]);
        }
        pos += step; acc += step;
        if (acc >= segLen) { acc = 0; draw = !draw; segLen = draw ? lenFn() : gapFn(); }
      }
    }
    return out;
  }
  var machineSt = [];
  polys.forEach(function (line) {
    var st = stitchify(line, function () { return 11; }, function () { return 6; }, 0);
    for (var i = 0; i < st.length; i++) machineSt.push(st[i]);
  });
  machineSt.sort(function (a, b) { return (a[0] + a[2]) / 2 - (b[0] + b[2]) / 2; });
  // -- hand layer: jittered beziers, drop-stitches, knot clusters
  var handSt = [];
  var curves = [];
  var NC = 6;
  for (var c = 0; c < NC; c++) {
    var yBase = MH * (0.12 + 0.76 * (c + rand() * 0.7) / NC);
    var p0 = [-40, yBase + (rand() - 0.5) * 60];
    var p1 = [MW * (0.25 + rand() * 0.2), yBase + (rand() - 0.5) * 260];
    var p2 = [MW * (0.55 + rand() * 0.2), yBase + (rand() - 0.5) * 260];
    var p3 = [MW + 40, yBase + (rand() - 0.5) * 60];
    var pts = [];
    for (var s2 = 0; s2 <= 90; s2++) {
      var t = s2 / 90, mt = 1 - t;
      pts.push([
        mt * mt * mt * p0[0] + 3 * mt * mt * t * p1[0] + 3 * mt * t * t * p2[0] + t * t * t * p3[0],
        mt * mt * mt * p0[1] + 3 * mt * mt * t * p1[1] + 3 * mt * t * t * p2[1] + t * t * t * p3[1]
      ]);
    }
    curves.push(pts);
    var hs = stitchify(pts, function () { return 6 + rand() * 9; }, function () { return 3 + rand() * 5; }, 1.6);
    for (var h = 0; h < hs.length; h++) {
      handSt.push(hs[h]);
      if (rand() < 0.12) { // a dropped stitch: a short perpendicular tick
        var ex = hs[h][2], ey = hs[h][3];
        var ang = Math.atan2(hs[h][3] - hs[h][1], hs[h][2] - hs[h][0]) + Math.PI / 2;
        handSt.push([ex, ey, ex + Math.cos(ang) * 7, ey + Math.sin(ang) * 7]);
      }
    }
  }
  // knots: small dense scribbles where the hand worries a crossing
  for (var kn = 0; kn < 4; kn++) {
    var curve = curves[Math.floor(rand() * curves.length)];
    var kp = curve[Math.floor(rand() * curve.length)];
    for (var ks = 0; ks < 8; ks++) {
      var ka = rand() * 6.28, kl = 4 + rand() * 5;
      var kx = kp[0] + (rand() - 0.5) * 10, ky = kp[1] + (rand() - 0.5) * 10;
      handSt.push([kx, ky, kx + Math.cos(ka) * kl, ky + Math.sin(ka) * kl]);
    }
  }
  handSt.sort(function (a, b) { return (a[0] + a[2]) / 2 - (b[0] + b[2]) / 2; });
  return { machine: machineSt, hand: handSt };
}
var mapIx = 0;
var curMap = makeMap(seed), nextMap = makeMap(seed + 31337);

// ---- the loop: draw on, hold, crossfade -----------------------------------------------------
var CYCLE = 38, DRAW_LEN = 24, FADE_AT = 34;
function drawMap(map, mFrac, hFrac, alpha) {
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round';
  ctx.strokeStyle = MACHINE;
  ctx.lineWidth = 2.1;
  var n = Math.floor(map.machine.length * clamp(mFrac, 0, 1));
  ctx.beginPath();
  for (var i = 0; i < n; i++) {
    var s = map.machine[i];
    ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]);
  }
  ctx.stroke();
  ctx.strokeStyle = HAND;
  ctx.lineWidth = 2.3;
  var hn = Math.floor(map.hand.length * clamp(hFrac, 0, 1));
  ctx.beginPath();
  for (var j = 0; j < hn; j++) {
    var hs = map.hand[j];
    ctx.moveTo(hs[0], hs[1]); ctx.lineTo(hs[2], hs[3]);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var m = phone ? 14 : 34;
  var sc = Math.min((W - m * 2) / MW, (H - m * 2) / MH);
  var ox = (W - MW * sc) / 2, oy = (H - MH * sc) / 2;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(sc, sc);
  var p = T % CYCLE;
  if (p < FADE_AT) {
    var dp = clamp(p / DRAW_LEN, 0, 1);
    var mFrac = clamp(dp / 0.62, 0, 1);
    var hFrac = clamp((dp - 0.35) / 0.60, 0, 1);
    drawMap(curMap, mFrac, hFrac, 1);
  } else {
    var fk = (p - FADE_AT) / (CYCLE - FADE_AT);
    drawMap(curMap, 1, 1, 1 - fk);
    var ndp = fk * 0.25; // the next map is already under the needle
    drawMap(nextMap, clamp(ndp / 0.62, 0, 1), clamp((ndp - 0.35) / 0.60, 0, 1), fk);
  }
  ctx.restore();
}

// ---- resize --------------------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame ------------------------------------------------------------------------------------------------
var lastCycle = 0;
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  var cyc = Math.floor(T / CYCLE);
  if (cyc !== lastCycle) { // a fresh map rotates in
    lastCycle = cyc;
    curMap = nextMap;
    mapIx++;
    nextMap = makeMap(seed + 31337 + mapIx * 104729);
  }
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
