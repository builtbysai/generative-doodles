<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfisher</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #2B4A7A; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var SKY_TOP = '#2B4A7A';
  var SKY_LOW = '#101C38';
  var GROUND = '#0E1420';
  var STAR = '#FFFFFF';
  var SHIRT = '#D9261C';
  var PANTS = '#2B4A7A';
  var POLE = '#6B5B45';
  var NET = '#F5F2EA';
  var HAIR = '#A79B85'; // pale tint of the pole brown, for the child's light hair

  var PHASE = 13.0; // fixed pre-roll: star at twinkle peak, net centred mid-sway

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(465056);
  // seeded load-time micro-jitter so the arc does not feel stamped
  var jx = (rng() - 0.5) * 0.006;
  var jy = (rng() - 0.5) * 0.006;

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE); // deterministic frame after any resize
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  function draw(t) {
    if (!W || !H) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var phone = isPhone();
    var U = Math.min(W, H);
    // figure scale: 15% of frame height on wide screens, shape kept on phones
    var S = Math.min(H, W * 1.55);
    var horizonY = H * 0.70;

    // ---- sky: vertical gradient, deep blue down to the horizon band ----
    var sky = ctx.createLinearGradient(0, 0, 0, horizonY);
    sky.addColorStop(0, SKY_TOP);
    sky.addColorStop(1, SKY_LOW);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, horizonY + 1);

    // ---- ground: one flat dark band ----
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, horizonY, W, H - horizonY);

    // ---- the one star, upper-left quadrant ----
    var sx = W * 0.22, sy = H * 0.17;
    // twinkle: opacity 0.7 to 1 on a 5s cycle, peak exactly at the pre-roll phase
    var tw = 0.85 + 0.15 * Math.cos((t - PHASE) * (Math.PI * 2 / 5));
    var sparkK = Math.max(0, (tw - 0.82)) / 0.18; // sparkle only near the peak
    var smallBoost = phone ? 1.3 : 1.0;

    var glowR = 0.055 * U * smallBoost * (0.75 + 0.45 * sparkK);
    var glow = ctx.createRadialGradient(sx, sy, glowR * 0.05, sx, sy, glowR);
    glow.addColorStop(0, 'rgba(255,255,255,' + (0.30 * tw).toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sx, sy, glowR, 0, Math.PI * 2);
    ctx.fill();

    // 4-point sparkle at peak
    if (sparkK > 0.01) {
      var sl = 0.034 * U * smallBoost * sparkK;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.85 * tw * sparkK).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, 0.0022 * U);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sx, sy - sl); ctx.lineTo(sx, sy + sl);
      ctx.moveTo(sx - sl, sy); ctx.lineTo(sx + sl, sy);
      ctx.stroke();
    }
    // star core
    ctx.fillStyle = STAR;
    ctx.globalAlpha = tw;
    ctx.beginPath();
    ctx.arc(sx, sy, 0.0075 * U * smallBoost, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // ---- child geometry (lower right, seated on the horizon) ----
    var ch = 0.15 * S;                       // child height, ~15% of frame height
    var bx = W * 0.815;                      // butt / seat point x
    var seatY = horizonY;                    // sits on the horizon line
    var breath = Math.sin((t - PHASE) * (Math.PI * 2 / 8) + 1.3) * 0.006 * ch;
    var hipX = bx - 0.04 * ch, hipY = seatY - 0.26 * ch;
    var neckX = bx + 0.07 * ch, neckY = seatY - 0.80 * ch + breath;
    var headX = bx + 0.10 * ch, headY = seatY - 0.97 * ch + breath;
    var headR = 0.165 * ch;
    // hands grip the pole, forward and up from the shoulder
    var gripX = bx - 0.34 * ch, gripY = seatY - 0.55 * ch + breath;

    // ---- the pole: absurdly long, arcing across the whole frame ----
    // tip = pendulum pivot, just beneath the star
    var tipX = sx, tipY = sy + 0.055 * U;
    var buttX = gripX + 0.16 * ch, buttY = gripY + 0.10 * ch;
    var ctrlX = (gripX + tipX) / 2 + jx * U;
    var ctrlY = (gripY + tipY) / 2 - 0.085 * H + jy * U;
    ctx.strokeStyle = POLE;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1.6, 0.0055 * U);
    ctx.beginPath();
    ctx.moveTo(buttX, buttY);
    ctx.lineTo(gripX, gripY);
    ctx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
    ctx.stroke();

    // ---- net: hangs from the tip, pendulum sway, 8s period ----
    var sway = 0.38 * Math.sin((t - PHASE) * (Math.PI * 2 / 8)); // 0 at pre-roll: mid-sway
    var hangL = 0.075 * U;
    var netX = tipX + hangL * Math.sin(sway);
    var netY = tipY + hangL * Math.cos(sway);
    var rimRX = 0.046 * U * smallBoost, rimRY = 0.031 * U * smallBoost;

    // cord from tip to the rim's top
    ctx.strokeStyle = NET;
    ctx.lineWidth = Math.max(1, 0.0022 * U);
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(netX, netY - rimRY);
    ctx.stroke();

    // net bag: crosshatch clipped inside the rim ellipse
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(netX, netY, rimRX, rimRY, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.strokeStyle = 'rgba(245,242,234,0.75)';
    ctx.lineWidth = Math.max(0.7, 0.0013 * U);
    var step = 0.0115 * U;
    ctx.beginPath();
    for (var gx = netX - rimRX; gx <= netX + rimRX; gx += step) {
      ctx.moveTo(gx, netY - rimRY); ctx.lineTo(gx, netY + rimRY);
    }
    for (var gy = netY - rimRY; gy <= netY + rimRY; gy += step) {
      ctx.moveTo(netX - rimRX, gy); ctx.lineTo(netX + rimRX, gy);
    }
    ctx.stroke();
    ctx.restore();
    // rim
    ctx.strokeStyle = NET;
    ctx.lineWidth = Math.max(1.2, 0.0028 * U);
    ctx.beginPath();
    ctx.ellipse(netX, netY, rimRX, rimRY, 0, 0, Math.PI * 2);
    ctx.stroke();

    // ---- child: legs, torso, arms, head (drawn over the pole butt) ----
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // legs: blue pants, stretched out along the ground to the left
    ctx.strokeStyle = PANTS;
    ctx.lineWidth = 0.155 * ch;
    ctx.beginPath(); // far leg, a touch shorter and higher
    ctx.moveTo(hipX, hipY + 0.02 * ch);
    ctx.lineTo(bx - 0.52 * ch, seatY - 0.055 * ch);
    ctx.stroke();
    ctx.beginPath(); // near leg
    ctx.moveTo(hipX, hipY + 0.05 * ch);
    ctx.lineTo(bx - 0.64 * ch, seatY - 0.035 * ch);
    ctx.stroke();
    // shoes, in the pole brown
    ctx.fillStyle = POLE;
    ctx.beginPath();
    ctx.ellipse(bx - 0.55 * ch, seatY - 0.045 * ch, 0.055 * ch, 0.038 * ch, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(bx - 0.67 * ch, seatY - 0.028 * ch, 0.055 * ch, 0.038 * ch, 0, 0, Math.PI * 2);
    ctx.fill();

    // torso: red long-sleeve shirt, leaning slightly back
    ctx.strokeStyle = SHIRT;
    ctx.lineWidth = 0.335 * ch;
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(neckX, neckY);
    ctx.stroke();

    // arms: red sleeves reaching forward to the grip
    ctx.lineWidth = 0.115 * ch;
    ctx.beginPath();
    ctx.moveTo(neckX - 0.02 * ch, neckY + 0.10 * ch);
    ctx.lineTo(gripX + 0.05 * ch, gripY - 0.02 * ch);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(neckX - 0.01 * ch, neckY + 0.16 * ch);
    ctx.lineTo(gripX + 0.02 * ch, gripY + 0.05 * ch);
    ctx.stroke();
    // hands on the pole
    ctx.fillStyle = NET;
    ctx.beginPath();
    ctx.arc(gripX, gripY, 0.052 * ch, 0, Math.PI * 2);
    ctx.fill();

    // head: pale face, light hair as a cap over the top and back
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.arc(headX + 0.010 * ch, headY - 0.048 * ch, headR * 1.02, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = NET;
    ctx.beginPath();
    ctx.arc(headX - 0.032 * ch, headY + 0.038 * ch, headR * 0.92, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- run: watch-only, no interaction ----
  resize();
  draw(PHASE);

  var startStamp = null;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (stamp) {
      if (startStamp === null) startStamp = stamp;
      var elapsed = (stamp - startStamp) / 1000;
      draw(PHASE + elapsed);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
