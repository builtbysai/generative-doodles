<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Río y Llanto</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAF7F0; overflow: hidden; }
  canvas { display: block; cursor: grab; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var TAU = Math.PI * 2;
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

// ---------- palette (strict, three colors only, julia-barata block 6) ----------
var INK = "#1A1A1A";   // loose black ink: figure, tears, wash
var PAPER = "#FAF7F0"; // ground
var RED = "#D42B1E";   // the pain register only: wound shape + tear accents

// ---------- canvas / viewport ----------
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone() {
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0 && mn < 700) return true;
  return H > W * 1.15;
}

function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  draw(currentPhase());
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
}
window.addEventListener("resize", resize);

// ---------- animation clock ----------
// Frame one is drawn synchronously at PHASE0 with the mix centered.
// All motion is anchored to PHASE0 + elapsed since load; performance.now
// measures elapsed only, the wall clock is never consulted.
var PHASE0 = 0;
var startStamp = null;
var lastPhase = PHASE0;

function currentPhase() {
  if (startStamp === null) return PHASE0;
  var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  return PHASE0 + (now - startStamp) / 1000;
}

// ---------- the contradiction engine ----------
// Two registers, humor and dolor. Off the tap-beat they sum to 1 and the
// balance h is held inside [0.25, 0.75], so min(humor, dolor) >= 0.25 at
// all times: the opposite register can thin but never vanish. The resting
// point is separately clamped into [0.3, 0.7]. During the tap beat both
// registers pin to 1 at once: full laugh AND full cry for one beat.
var REST_MIN = 0.3, REST_MAX = 0.7;
var H_MIN = 0.25, H_MAX = 0.75;
var restH = 0.5;          // where the balance settles when released
var hCur = 0.5;           // displayed balance, eased toward its target
var drag = null;          // {startY, startH, moved}
var beatEnd = -1;         // phase at which the both-at-once beat ends

function targetH(phase) {
  if (drag && drag.moved) return drag.h;
  return clamp(restH + 0.05 * Math.sin(phase * 0.45), H_MIN, H_MAX);
}

// ---------- precomputed seeded marks (fixed at load, never re-rolled) ----------
var rng = mulberry32(590071);

// Diluted-ink wash: translucent blob clusters behind the figure. Drawn as
// layered ellipses of ink at low alpha; alpha scales with dolor.
var WASH = [];
(function () {
  var r = mulberry32(590101);
  for (var i = 0; i < 15; i++) {
    WASH.push({
      x: 500 + (r() - 0.5) * 430,
      y: 480 + (r() - 0.5) * 430,
      rx: 65 + r() * 120,
      ry: 50 + r() * 95,
      rot: (r() - 0.5) * 0.9,
      a: 0.04 + r() * 0.05
    });
  }
})();

// Wobble offsets for the hand-drawn head outline: a fixed jitter ring.
var HEAD_WOB = [];
(function () {
  var r = mulberry32(590202);
  for (var i = 0; i < 28; i++) HEAD_WOB.push((r() - 0.5) * 7);
})();

// Hair scribble strokes on top of the head.
var HAIR = [];
(function () {
  var r = mulberry32(590303);
  for (var i = 0; i < 6; i++) {
    HAIR.push({ a0: -2.5 + i * 0.28 + (r() - 0.5) * 0.1, len: 26 + r() * 22, bend: (r() - 0.5) * 18 });
  }
})();

// Tear streams: droplets cycle down each cheek. Every fourth droplet is a
// red accent; all others are ink. Fall offsets are fixed per droplet.
var TEARS = [];
(function () {
  var r = mulberry32(590404);
  for (var side = -1; side <= 1; side += 2) {
    for (var i = 0; i < 5; i++) {
      TEARS.push({
        side: side,
        off: r(),
        drift: (r() - 0.5) * 14,
        size: 9 + r() * 7,
        red: (i === 2)
      });
    }
  }
})();

// Motion lines (humor register): short strokes radiating by the head and
// around the duck. Length and alpha scale with humor.
var MOTION = [];
(function () {
  var r = mulberry32(590505);
  var spots = [
    { x: 322, y: 210, a: -0.5 }, { x: 306, y: 300, a: 0.1 }, { x: 330, y: 392, a: 0.6 },
    { x: 678, y: 210, a: -2.6 }, { x: 694, y: 300, a: 3.0 }, { x: 670, y: 392, a: 2.5 }
  ];
  for (var i = 0; i < spots.length; i++) {
    MOTION.push({ x: spots[i].x, y: spots[i].y, a: spots[i].a, len: 26 + r() * 16, gap: 8 + r() * 6 });
  }
})();

// ---------- drawing helpers (unit space: 1000 x 1000 stage) ----------
var U = 1, OX = 0, OY = 0;
function X(u) { return OX + u * U; }
function Y(u) { return OY + u * U; }
function line(x0, y0, x1, y1) {
  ctx.beginPath(); ctx.moveTo(X(x0), Y(y0)); ctx.lineTo(X(x1), Y(y1)); ctx.stroke();
}
function drop(x, y, s) {
  // one teardrop, point up
  ctx.beginPath();
  ctx.moveTo(X(x), Y(y - s));
  ctx.bezierCurveTo(X(x + s * 0.72), Y(y - s * 0.1), X(x + s * 0.55), Y(y + s * 0.62), X(x), Y(y + s * 0.68));
  ctx.bezierCurveTo(X(x - s * 0.55), Y(y + s * 0.62), X(x - s * 0.72), Y(y - s * 0.1), X(x), Y(y - s));
  ctx.fill();
}

function draw(phase) {
  if (!W || !H) return;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // --- ease the balance toward its target (dt from the anchored clock) ---
  var dt = clamp(phase - lastPhase, 0, 0.05);
  lastPhase = phase;
  var tgt = targetH(phase);
  hCur += (tgt - hCur) * Math.min(1, dt * 7 + (dt === 0 ? 1 : 0));
  if (dt === 0) hCur = tgt;

  var beat = phase < beatEnd;
  var humor = beat ? 1 : hCur;
  var dolor = beat ? 1 : 1 - hCur;
  var shake = beat ? Math.sin(phase * 55) * 4 : Math.sin(phase * 9) * 1.6 * humor;

  // --- stage transform: fit the 1000-unit stage, centered ---
  var S = Math.min(W, H);
  U = S / 1000;
  OX = (W - S) / 2;
  OY = (H - S) / 2;

  // ground
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // --- wash (dolor): diluted ink pooling behind everything ---
  for (var i = 0; i < WASH.length; i++) {
    var b = WASH[i];
    ctx.save();
    ctx.translate(X(b.x), Y(b.y));
    ctx.rotate(b.rot);
    ctx.globalAlpha = b.a * (0.30 + 0.95 * dolor);
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.ellipse(0, 0, b.rx * U, b.ry * U, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // ground shadow
  ctx.save();
  ctx.globalAlpha = 0.10 + 0.08 * dolor;
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.ellipse(X(505), Y(872), 235 * U, 30 * U, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(shake * U, 0);

  // --- legs and shoes ---
  ctx.strokeStyle = INK;
  ctx.lineWidth = 13 * U;
  line(462, 742, 448, 852);
  line(548, 742, 566, 852);
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(X(436), Y(862), 30 * U, 12 * U, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(X(580), Y(862), 30 * U, 12 * U, 0, 0, TAU); ctx.fill();

  // --- torso: one loose rounded body ---
  ctx.beginPath();
  ctx.moveTo(X(438), Y(432));
  ctx.bezierCurveTo(X(420), Y(560), X(428), Y(680), X(442), Y(758));
  ctx.bezierCurveTo(X(470), Y(776), X(545), Y(776), X(570), Y(758));
  ctx.bezierCurveTo(X(586), Y(668), X(592), Y(548), X(574), Y(432));
  ctx.bezierCurveTo(X(530), Y(408), X(482), Y(408), X(438), Y(432));
  ctx.closePath();
  ctx.fillStyle = PAPER;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 6.5 * U;
  ctx.stroke();

  // --- the wound (dolor, red): an irregular star-blob on the chest ---
  var wob = 1 + 0.05 * Math.sin(phase * 2.2);
  var wr = (30 + 26 * dolor) * wob;
  var wx = 452, wy = 566;
  ctx.beginPath();
  var spikes = 9;
  for (var k = 0; k <= spikes * 2; k++) {
    var ang = (k / (spikes * 2)) * TAU - 0.4;
    var rad = wr * (k % 2 === 0 ? 1 : 0.58) * (1 + 0.10 * Math.sin(k * 2.7 + 1.3));
    var px = wx + Math.cos(ang) * rad, py = wy + Math.sin(ang) * rad * 0.86;
    if (k === 0) ctx.moveTo(X(px), Y(py)); else ctx.lineTo(X(px), Y(py));
  }
  ctx.closePath();
  ctx.fillStyle = RED;
  ctx.globalAlpha = 0.55 + 0.45 * dolor;
  ctx.fill();
  ctx.globalAlpha = 1;
  // red drips below the wound, longer as dolor leads
  ctx.fillStyle = RED;
  drop(wx - 10, wy + wr * 0.9 + 16 + 14 * dolor, 8 + 3 * dolor);
  drop(wx + 14, wy + wr * 0.9 + 30 + 22 * dolor, 6 + 3 * dolor);

  // --- arms: left arm flung up laughing, right arm hanging heavy ---
  ctx.strokeStyle = INK;
  ctx.lineWidth = 12 * U;
  var wave = Math.sin(phase * 6.2) * (6 + 16 * humor);
  ctx.beginPath();
  ctx.moveTo(X(440), Y(470));
  ctx.quadraticCurveTo(X(372), Y(430), X(338), Y(352 + wave));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(X(572), Y(470));
  ctx.quadraticCurveTo(X(636), Y(540), X(628), Y(648 + 10 * dolor));
  ctx.stroke();
  // hands
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(X(336), Y(348 + wave), 11 * U, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(X(629), Y(656 + 10 * dolor), 11 * U, 0, TAU); ctx.fill();

  // --- head: wobbled ink circle ---
  var hx = 505, hy = 292, hr = 128;
  ctx.beginPath();
  for (var j = 0; j <= HEAD_WOB.length; j++) {
    var ha = (j / HEAD_WOB.length) * TAU;
    var hrad = hr + HEAD_WOB[j % HEAD_WOB.length];
    var hxP = hx + Math.cos(ha) * hrad, hyP = hy + Math.sin(ha) * hrad * 0.96;
    if (j === 0) ctx.moveTo(X(hxP), Y(hyP)); else ctx.lineTo(X(hxP), Y(hyP));
  }
  ctx.closePath();
  ctx.fillStyle = PAPER;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 6.5 * U;
  ctx.stroke();

  // hair scribbles
  ctx.lineWidth = 5 * U;
  for (var hI = 0; hI < HAIR.length; hI++) {
    var hs = HAIR[hI];
    var bx = hx + Math.cos(hs.a0) * hr * 0.92, by = hy + Math.sin(hs.a0) * hr * 0.9;
    ctx.beginPath();
    ctx.moveTo(X(bx), Y(by));
    ctx.quadraticCurveTo(
      X(bx + Math.cos(hs.a0) * hs.len * 0.5 + hs.bend), Y(by + Math.sin(hs.a0) * hs.len * 0.5 - 8),
      X(bx + Math.cos(hs.a0) * hs.len + hs.bend * 1.4), Y(by + Math.sin(hs.a0) * hs.len + 6));
    ctx.stroke();
  }

  // --- X eyes (the laugh) ---
  ctx.lineWidth = 7.5 * U;
  var ex = 26, ey = 24;
  var eyes = [[hx - 52, hy - 18], [hx + 52, hy - 18]];
  for (var e = 0; e < 2; e++) {
    var cxE = eyes[e][0], cyE = eyes[e][1];
    line(cxE - ex / 1.6, cyE - ey / 1.6, cxE + ex / 1.6, cyE + ey / 1.6);
    line(cxE - ex / 1.6, cyE + ey / 1.6, cxE + ex / 1.6, cyE - ey / 1.6);
  }

  // --- tears (dolor): streams cycling down both cheeks, red accents ---
  var tearAlpha = 0.30 + 0.70 * dolor;
  var tearLen = 66 + 120 * dolor;
  for (var tI = 0; tI < TEARS.length; tI++) {
    var td = TEARS[tI];
    var fall = ((phase * 0.55 + td.off) % 1);
    var ty = (hy + 6) + fall * tearLen;
    var tx = hx + td.side * 52 + td.drift * fall + Math.sin(fall * 5 + td.off * 9) * 3;
    var fade = Math.sin(fall * Math.PI);
    ctx.globalAlpha = tearAlpha * fade;
    ctx.fillStyle = td.red ? RED : INK;
    drop(tx, ty, td.size * (0.7 + 0.5 * dolor));
  }
  ctx.globalAlpha = 1;
  // cheek streaks: two fixed wet lines under each eye, thinning with humor
  ctx.strokeStyle = INK;
  ctx.lineWidth = 3.5 * U;
  ctx.globalAlpha = 0.25 + 0.55 * dolor;
  for (var sI = -1; sI <= 1; sI += 2) {
    line(hx + sI * 44, hy + 16, hx + sI * 47, hy + 16 + tearLen * 0.62);
    line(hx + sI * 62, hy + 14, hx + sI * 66, hy + 14 + tearLen * 0.45);
  }
  ctx.globalAlpha = 1;

  // --- the laughing mouth: wide open, always laughing ---
  var laugh = 0.55 + 0.45 * humor;
  var mw = 118 * laugh + 30, mh = 62 * laugh + 14;
  var mx = hx, my = hy + 58;
  ctx.beginPath();
  ctx.moveTo(X(mx - mw / 2), Y(my));
  ctx.quadraticCurveTo(X(mx), Y(my + mh * 2.05), X(mx + mw / 2), Y(my));
  ctx.quadraticCurveTo(X(mx), Y(my + mh * 0.42), X(mx - mw / 2), Y(my));
  ctx.closePath();
  ctx.fillStyle = INK;
  ctx.fill();
  // teeth strip along the top of the mouth
  ctx.beginPath();
  ctx.moveTo(X(mx - mw / 2 + 6), Y(my + 1));
  ctx.quadraticCurveTo(X(mx), Y(my + mh * 0.52), X(mx + mw / 2 - 6), Y(my + 1));
  ctx.quadraticCurveTo(X(mx), Y(my + mh * 0.20), X(mx - mw / 2 + 6), Y(my + 1));
  ctx.closePath();
  ctx.fillStyle = PAPER;
  ctx.fill();

  // --- motion lines (humor) ---
  ctx.strokeStyle = INK;
  ctx.lineWidth = 5.5 * U;
  for (var mI = 0; mI < MOTION.length; mI++) {
    var mo = MOTION[mI];
    var pulse = 0.7 + 0.3 * Math.sin(phase * 5 + mI * 1.7);
    var len = mo.len * (0.35 + 0.75 * humor) * pulse;
    ctx.globalAlpha = 0.25 + 0.75 * humor;
    line(mo.x + Math.cos(mo.a) * mo.gap, mo.y + Math.sin(mo.a) * mo.gap,
         mo.x + Math.cos(mo.a) * (mo.gap + len), mo.y + Math.sin(mo.a) * (mo.gap + len));
    line(mo.x + Math.cos(mo.a + 0.5) * mo.gap, mo.y + Math.sin(mo.a + 0.5) * mo.gap,
         mo.x + Math.cos(mo.a + 0.5) * (mo.gap + len * 0.7), mo.y + Math.sin(mo.a + 0.5) * (mo.gap + len * 0.7));
  }
  ctx.globalAlpha = 1;

  ctx.restore(); // un-shake

  // --- the rubber duck (humor): absurd prop at the figure's feet ---
  var bounce = Math.abs(Math.sin(phase * (2.2 + 2.6 * humor))) * (4 + 26 * humor);
  var squash = 1 - 0.10 * humor * Math.max(0, Math.sin(phase * (2.2 + 2.6 * humor) + 0.6));
  var dx = 668, dy = 838 - bounce;
  ctx.save();
  ctx.translate(X(dx), Y(dy + 26));
  ctx.scale(1, squash);
  ctx.translate(-X(dx), -Y(dy + 26));
  ctx.strokeStyle = INK;
  ctx.fillStyle = PAPER;
  ctx.lineWidth = 5.5 * U;
  // body
  ctx.beginPath();
  ctx.moveTo(X(dx - 46), Y(dy + 8));
  ctx.bezierCurveTo(X(dx - 48), Y(dy - 22), X(dx - 12), Y(dy - 30), X(dx + 14), Y(dy - 18));
  ctx.bezierCurveTo(X(dx + 44), Y(dy - 26), X(dx + 52), Y(dy - 6), X(dx + 40), Y(dy + 10));
  ctx.bezierCurveTo(X(dx + 18), Y(dy + 26), X(dx - 28), Y(dy + 26), X(dx - 46), Y(dy + 8));
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // tail flick
  ctx.beginPath();
  ctx.moveTo(X(dx - 42), Y(dy - 6));
  ctx.quadraticCurveTo(X(dx - 62), Y(dy - 20), X(dx - 56), Y(dy + 2));
  ctx.stroke();
  // head
  ctx.beginPath();
  ctx.arc(X(dx + 26), Y(dy - 34), 19 * U, 0, TAU);
  ctx.fill(); ctx.stroke();
  // beak: two ink wedges (no color: red belongs to pain alone)
  ctx.beginPath();
  ctx.moveTo(X(dx + 40), Y(dy - 38));
  ctx.lineTo(X(dx + 62), Y(dy - 31));
  ctx.lineTo(X(dx + 40), Y(dy - 26));
  ctx.closePath();
  ctx.fillStyle = INK;
  ctx.fill();
  // eye
  ctx.beginPath();
  ctx.arc(X(dx + 30), Y(dy - 38), 3.4 * U, 0, TAU);
  ctx.fill();
  ctx.restore();
  // duck motion ticks
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4.5 * U;
  ctx.globalAlpha = 0.2 + 0.8 * humor;
  line(dx - 66, dy - 34, dx - 80, dy - 48);
  line(dx - 58, dy - 12, dx - 78, dy - 16);
  ctx.globalAlpha = 1;

  // --- joke bubble (humor): hand-lettered "jajaja", upper left ---
  var bScale = 0.82 + 0.30 * humor;
  var bA = 0.45 + 0.55 * humor;
  var bcx = 196, bcy = 178;
  var bw = 118, bh = 56;
  ctx.save();
  ctx.translate(X(bcx), Y(bcy));
  ctx.scale(bScale * U, bScale * U);
  ctx.globalAlpha = bA;
  ctx.beginPath();
  ctx.moveTo(-bw + 16, -bh);
  ctx.bezierCurveTo(-bw - 14, -bh - 6, -bw - 16, bh - 20, -bw + 8, bh - 6);
  ctx.bezierCurveTo(-bw + 30, bh + 12, -30, bh + 8, -6, bh);
  ctx.lineTo(30, bh + 34);   // tail down toward the head
  ctx.lineTo(44, bh - 2);
  ctx.bezierCurveTo(80, bh + 8, bw + 12, bh - 8, bw + 8, -bh + 16);
  ctx.bezierCurveTo(bw + 4, -bh - 12, 40, -bh - 8, -bw + 16, -bh);
  ctx.closePath();
  ctx.fillStyle = PAPER;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 5.5 / bScale;
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.font = "700 52px 'Segoe Print', 'Comic Sans MS', 'Chalkboard SE', cursive";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.save();
  ctx.rotate(-0.045);
  ctx.fillText("jajaja", 0, 2);
  ctx.restore();
  ctx.restore();

  // --- hint ---
  ctx.globalAlpha = 0.42;
  ctx.fillStyle = INK;
  ctx.font = "500 " + Math.round(15 * U + 4) + "px sans-serif";
  ctx.textAlign = "right";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("drag · tap", W - 18, H - 16);
  ctx.globalAlpha = 1;
}

// ---------- interaction ----------
function evtPos(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cx = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0)) - r.left;
  var cy = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0)) - r.top;
  return { x: cx, y: cy };
}
function onDown(e) {
  var p = evtPos(e);
  drag = { startY: p.y, startH: hCur, h: hCur, moved: false, x: p.x, y: p.y };
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (!drag) return;
  var p = evtPos(e);
  var dy = drag.startY - p.y; // drag up: humor leads; drag down: dolor leads
  if (Math.abs(p.y - drag.startY) > 6 || Math.abs(p.x - drag.x) > 6) drag.moved = true;
  if (drag.moved) {
    drag.h = clamp(drag.startH + dy / (0.55 * (H || 1)), H_MIN, H_MAX);
  }
  if (e.preventDefault) e.preventDefault();
}
function onUp(e) {
  if (!drag) return;
  var p = evtPos(e);
  var phase = currentPhase();
  if (!drag.moved) {
    // tap: only on the figure (central body/head region in unit space)
    var S = Math.min(W, H);
    var ux = (p.x - (W - S) / 2) / (S / 1000);
    var uy = (p.y - (H - S) / 2) / (S / 1000);
    if (ux > 300 && ux < 720 && uy > 130 && uy < 800) {
      beatEnd = phase + 0.8;
    }
  } else {
    restH = clamp(drag.h, REST_MIN, REST_MAX);
  }
  drag = null;
}
if (canvas.addEventListener) {
  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", function () { drag = null; });
  canvas.addEventListener("mousedown", onDown);
  canvas.addEventListener("mousemove", onMove);
  canvas.addEventListener("mouseup", onUp);
  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp);
}

// ---------- boot ----------
resize();
if (typeof requestAnimationFrame !== "undefined") {
  if (startStamp === null) {
    startStamp = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  }
  var loop = function () {
    draw(currentPhase());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
