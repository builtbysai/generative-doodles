<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodal Rosettes</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d2b1f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
    font: 12px/1.4 system-ui, -apple-system, sans-serif; letter-spacing: 0.14em;
    color: #8fa89b; pointer-events: none; user-select: none;
  }
  .sound {
    position: fixed; right: 16px; bottom: 12px;
    font: 11px/1.4 system-ui, -apple-system, sans-serif; letter-spacing: 0.14em;
    color: #8fa89b; background: transparent; border: 1px solid #3a5a4a;
    padding: 5px 10px; cursor: pointer; border-radius: 2px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">WATCH ONLY</div>
<button class="sound" id="sound" type="button">SOUND OFF</button>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG, fixed seed: frame one is fully deterministic.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1825);

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  function alpha(v) {
    var a = Math.round(v * 10000) / 10000;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    return a;
  }

  // Rosette pool: seeded params for a 7x7 grid; the live layout draws the
  // first cols*rows of the pool in row-major order, so desktop (7x5) and
  // phone (5x7) both fill the field evenly with no clipping.
  var ROSETTES = [];
  for (var gi = 0; gi < 49; gi++) {
    var m = 3 + Math.floor(rnd() * 6);        // 3..8 lobes
    var n = 2 + Math.floor(rnd() * 5);        // 2..6 second wave
    if (n === m) n = (m % 6) + 2;
    ROSETTES.push({
      m: m, n: n,
      ph: rnd() * Math.PI * 2,
      off: rnd() * 20,                        // bloom offset within 20 s life
      size: 0.72 + rnd() * 0.42,
      rot: rnd() * Math.PI
    });
  }

  // Slow drift of the integer ratios: each wire steps to a neighbouring
  // ratio on a ~40 s cadence, so a rosette redraws itself gradually.
  function ratioAt(base, t, span) {
    var step = Math.floor(t / span);
    var frac = (t % span) / span;
    var from = base + (step % 3) - 1;
    var to = base + ((step + 1) % 3) - 1;
    if (from < 2) from = 2;
    if (to < 2) to = 2;
    return from + (to - from) * (0.5 - 0.5 * Math.cos(Math.PI * frac));
  }

  // Bloom envelope: 20 s life, bloom in, hold, dissolve. Never negative.
  function bloom(t, off) {
    var u = ((t + off) % 20) / 20;
    if (u < 0.25) return u / 0.25;
    if (u < 0.65) return 1;
    return 1 - (u - 0.65) / 0.35;
  }

  // Sync cycle: 90 s. Rosettes converge on one shared pattern during
  // seconds 64..76, then fracture back to their own ratios.
  function syncAmt(t) {
    var u = t % 90;
    if (u < 60) return 0;
    if (u < 64) return (u - 60) / 4;
    if (u < 72) return 1;
    if (u < 76) return 1 - (u - 72) / 4;
    return 0;
  }

  function drawRosette(cx, cy, R, m, n, ph, rot, col, aBase) {
    // Outer petal figure: nodal sum of two standing waves, drawn as a
    // polyline so every line reads as a vibration mode.
    var steps = 144;
    var i, th, r, x, y;
    for (var layer = 0; layer < 3; layer++) {
      var lr = R * (1 - layer * 0.24);
      var la = aBase * (0.85 - layer * 0.22);
      if (la <= 0.01) continue;
      ctx.beginPath();
      for (i = 0; i <= steps; i++) {
        th = (i / steps) * Math.PI * 2;
        var w1 = Math.cos(m * th + ph);
        var w2 = Math.cos(n * th - ph * 0.7);
        r = lr * (0.62 + 0.38 * (0.5 * w1 + 0.5 * w2));
        if (r < lr * 0.08) r = lr * 0.08;
        x = cx + Math.cos(th + rot) * r;
        y = cy + Math.sin(th + rot) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = col.replace('A', alpha(la));
      ctx.lineWidth = layer === 0 ? 1.6 : 1;
      ctx.stroke();
    }
    // Nodal ring: the circle where the two waves cancel.
    ctx.beginPath();
    ctx.moveTo(cx + R * 0.42, cy);
    ctx.arc(cx, cy, R * 0.42, 0, Math.PI * 2);
    ctx.strokeStyle = col.replace('A', alpha(aBase * 0.35));
    ctx.lineWidth = 1;
    ctx.stroke();
    // Radial nodal lines, m of them, faint.
    ctx.strokeStyle = col.replace('A', alpha(aBase * 0.30));
    ctx.lineWidth = 1;
    for (i = 0; i < m; i++) {
      var a = rot + (i / m) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * R * 0.18, cy + Math.sin(a) * R * 0.18);
      ctx.lineTo(cx + Math.cos(a) * R * 0.98, cy + Math.sin(a) * R * 0.98);
      ctx.stroke();
    }
    // Center node dot, drawn as paired arcs.
    ctx.beginPath();
    ctx.moveTo(cx + 2.5, cy);
    ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = col.replace('A', alpha(aBase * 0.9));
    ctx.fill();
  }

  function draw(t) {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var W = Math.max(1, Math.floor(vw));
    var H = Math.max(1, Math.floor(vh));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var isPhone = false;
    try {
      var sw = window.screen.width, sh = window.screen.height;
      var mn = Math.min(sw, sh);
      isPhone = mn < 700 || (H > W * 1.15);
    } catch (e) { isPhone = (H > W * 1.15); }

    // Deep green ground, the Elemental View cover.
    ctx.fillStyle = '#0d2b1f';
    ctx.fillRect(0, 0, W, H);
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.1, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(24,74,52,0.55)');
    vg.addColorStop(1, 'rgba(6,24,17,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // Faint grey witness grid.
    var grid = Math.min(W, H) / 9;
    ctx.strokeStyle = 'rgba(180,190,185,' + alpha(0.07) + ')';
    ctx.lineWidth = 1;
    var gx, gy;
    ctx.beginPath();
    for (gx = grid; gx < W; gx += grid) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
    for (gy = grid; gy < H; gy += grid) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
    ctx.stroke();

    // Field layout: full-bleed on both sizes. Center breathes open:
    // rosettes shrink toward the middle, dense and large at the edges.
    var cols = isPhone ? 5 : 7;
    var rows = isPhone ? 7 : 5;
    var cellW = W / cols, cellH = H / rows;
    var cell = Math.min(cellW, cellH);
    var sync = syncAmt(t);
    var liveCount = cols * rows;
    var bowed = Math.floor(t / 20) % liveCount;

    for (var i = 0; i < liveCount; i++) {
      var rs = ROSETTES[i];
      var gx = i % cols;
      var gy = Math.floor(i / cols);
      var cx = (gx + 0.5) * cellW;
      var cy = (gy + 0.5) * cellH;
      var dx = (cx - W / 2) / (W / 2);
      var dy = (cy - H / 2) / (H / 2);
      var dist = Math.sqrt(dx * dx + dy * dy);
      var open = 0.55 + 0.45 * Math.min(1, dist);
      var R = cell * 0.44 * rs.size * open;

      var bl = bloom(t, rs.off);
      if (bl <= 0.01) continue;
      var mNow = ratioAt(rs.m, t, 40);
      var nNow = ratioAt(rs.n, t + 13, 47);
      // Sync: converge on the shared pattern (m 6, n 4).
      mNow = mNow * (1 - sync) + 6 * sync;
      nNow = nNow * (1 - sync) + 4 * sync;
      var rot = rs.rot + t * 0.008 * (rs.m % 2 ? 1 : -1);
      var isBowed = (i === bowed);
      var col = isBowed ? 'rgba(232,201,138,A)' : 'rgba(244,246,240,A)';
      var aBase = 0.28 + 0.62 * bl;
      if (isBowed) aBase = Math.min(1, aBase + 0.15);
      drawRosette(cx, cy, R, Math.max(2, Math.round(mNow)), Math.max(2, Math.round(nNow)), rs.ph + t * 0.02, rot, col, aBase);
    }

    // Title and date plate, top-left on a dark backing so it reads over
    // the rosette field (parent fix round: the piece shipped without one).
    ctx.save();
    ctx.fillStyle = 'rgba(6,24,17,0.62)';
    ctx.fillRect(10, 10, 168, 48);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#dfe8dd';
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.fillText('NODAL ROSETTES', 20, 30);
    ctx.fillStyle = '#8fa89b';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText('2007 · 01 · 10', 20, 48);
    ctx.restore();
  }

  // One synchronous frame at load: t = 60 s, fixed phase, mid-cycle.
  draw(60);

  if (reduced) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = 60 + (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }

  function onResize() { draw(60); }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  // Sound toggle: lazy just-intonation drone, only inside the tap.
  // Default silent; watch-only piece, audio is opt-in.
  var audioCtx = null, droneNodes = null, soundOn = false;
  var btn = document.getElementById('sound');
  function setSound(on) {
    soundOn = on;
    btn.textContent = on ? 'SOUND ON' : 'SOUND OFF';
    try {
      if (on) {
        if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
        var AC = typeof AudioContext !== 'undefined' ? AudioContext : webkitAudioContext;
        if (!audioCtx) audioCtx = new AC();
        if (audioCtx.resume) audioCtx.resume();
        if (!droneNodes) {
          droneNodes = [];
          var base = 110;
          var ratios = [1, 1.5, 2, 2.5, 3];
          for (var i = 0; i < ratios.length; i++) {
            var osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = base * ratios[i];
            var g = audioCtx.createGain();
            g.gain.value = 0.04;
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.start();
            droneNodes.push({ osc: osc, g: g });
          }
        } else {
          for (var j = 0; j < droneNodes.length; j++) droneNodes[j].g.gain.value = 0.04;
        }
      } else if (droneNodes) {
        for (var k = 0; k < droneNodes.length; k++) droneNodes[k].g.gain.value = 0;
      }
    } catch (e) { /* audio unavailable: stay silent */ }
  }
  if (btn && btn.addEventListener) {
    btn.addEventListener('click', function () { setSound(!soundOn); });
  }
})();
</script>
</body>
</html>
