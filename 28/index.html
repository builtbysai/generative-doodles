<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№28 · Braids</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2ecdc; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(60,54,44,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(242,236,220,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another braids</div>
<script>
'use strict';
// No28 Braids.
// Three sine strands running down the page, phase-shifted by a
// third of a period, woven: the draw order of short segments
// alternates at every crossing so each strand passes over, then
// under, then over. The crossings are found from the strand math,
// not decoration: wherever two strands' order swaps, the segment
// order flips. Two strands are charcoal, the third, which weaves
// against both, is vermilion on cream.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '28', 10) || 28;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f2ecdc';
const INKS = ['#2e2a24', '#b3402a', '#2e2a24'];

function compose(s) {
  const rnd = mulberry32(s);
  return {
    waves: 2.2 + rnd() * 1.4,
    amp: 0.16 + rnd() * 0.08,      // of field width
    p0: rnd() * Math.PI * 2
  };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  const strandX = (k, v) => ox + RX * (0.5 + Math.sin(v * p.waves * Math.PI * 2 + p.p0 + k * (Math.PI * 2 / 3)) * p.amp);
  const SEG = 240;
  const lw = Math.max(1.4, Math.min(RX, RY) / 190);
  ctx.lineCap = 'round';
  // Draw in vertical slices; within each slice order strands by the
  // braid rule: the strand whose weave turn it is goes last (on top).
  for (let sIdx = 0; sIdx < SEG; sIdx++) {
    const v0 = sIdx / SEG, v1 = (sIdx + 1) / SEG;
    const vm = (v0 + v1) / 2;
    // crossing index from the first pair's relative phase
    const crossIdx = Math.floor((vm * p.waves * 2 + p.p0 / Math.PI) * 1.5);
    const order = [0, 1, 2].sort((a, b) => ((a + crossIdx) % 3) - ((b + crossIdx) % 3));
    for (const k of order) {
      ctx.strokeStyle = INKS[k];
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(strandX(k, v0), oy + v0 * RY);
      ctx.lineTo(strandX(k, v1), oy + v1 * RY);
      ctx.stroke();
      // ground-colored underlay gives the over-strand a clean break
      // at crossings: redrawn by later slices' strands on top.
    }
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
