<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nine Fields, Moving</title>
<style>
  html, body { margin: 0; padding: 0; background: #F4F1E8; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- palette ----------
  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  var PALETTE = ['#1B4FCE', '#E8431F', '#E8A013', '#0F7A52', '#1A1A1A', '#F4641A'].map(hexRgb);
  var GROUND = '#F4F1E8';
  var KNOCK = [196, 220, 247, 262, 294, 330, 349, 392, 440];

  function mix(a, b, k) {
    return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  }
  function css(c) { return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }
  function ease(p) { if (p <= 0) return 0; if (p >= 1) return 1; return p * p * (3 - 2 * p); }

  // ---------- canvas / view ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, phone = false;

  function viewSize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : ((typeof window !== 'undefined' && window.innerWidth) || 720);
    var h = vv ? vv.height : ((typeof window !== 'undefined' && window.innerHeight) || 720);
    return [w, h];
  }

  // ---------- world: nine fields, seeded keyframes ----------
  var SEED = 952113;
  var rngInit = mulberry32(SEED);
  var rngSched = mulberry32(SEED ^ 0x9e3779b9);

  var fields = [];
  for (var i = 0; i < 9; i++) {
    var ai = Math.floor(rngInit() * 6), bi;
    do { bi = Math.floor(rngInit() * 6); } while (bi === ai);
    fields.push({
      ai: ai, bi: bi,
      colA: PALETTE[ai].slice(), colB: PALETTE[bi].slice(),
      ang: rngInit() * Math.PI,
      off: rngInit() * 0.7 - 0.35,
      trans: null, drift: null
    });
  }

  function neighbors(fi) {
    var r = Math.floor(fi / 3), c = fi % 3, out = [];
    if (r > 0) out.push(fi - 3);
    if (r < 2) out.push(fi + 3);
    if (c > 0) out.push(fi - 1);
    if (c < 2) out.push(fi + 1);
    return out;
  }

  function commit(f) {
    if (f.trans) {
      f.colA = f.trans.toColA; f.colB = f.trans.toColB;
      f.ang = f.trans.toAng; f.off = f.trans.toOff;
      f.trans = null;
    }
    if (f.drift) {
      f.colA = f.drift.toColA; f.colB = f.drift.toColB;
      f.drift = null;
    }
  }

  // ---------- audio (lazy, guarded) ----------
  var AC = null;
  function ensureAudio() {
    if (AC) return;
    if (typeof window === 'undefined') return;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    try { AC = new Ctor(); } catch (e) { AC = null; }
  }
  function knock(fi) {
    if (!AC) return;
    var t = AC.currentTime;
    var f = KNOCK[fi];
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + 0.3);
    var o2 = AC.createOscillator(), g2 = AC.createGain();
    o2.type = 'square'; o2.frequency.value = f * 4;
    g2.gain.setValueAtTime(0.03, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    o2.connect(g2); g2.connect(AC.destination);
    o2.start(t); o2.stop(t + 0.04);
    // faint sympathetic shimmer
    var o3 = AC.createOscillator(), g3 = AC.createGain();
    o3.type = 'sine';
    o3.frequency.setValueAtTime(1240, t);
    o3.frequency.linearRampToValueAtTime(1560, t + 0.7);
    g3.gain.setValueAtTime(0.0001, t);
    g3.gain.linearRampToValueAtTime(0.015, t + 0.25);
    g3.gain.linearRampToValueAtTime(0.0001, t + 0.8);
    o3.connect(g3); g3.connect(AC.destination);
    o3.start(t); o3.stop(t + 0.85);
  }

  // ---------- resolution events ----------
  var busyUntil = 0;

  function fireResolution(time, fi, jump) {
    var f = fields[fi];
    commit(f);
    var sA, sB;
    if (jump !== null && jump !== undefined) { sA = jump; sB = jump; }
    else { sA = rngSched() < 0.5 ? -1 : 1; sB = rngSched() < 0.5 ? -1 : 1; }
    var nai = ((f.ai + sA) % 6 + 6) % 6;
    var nbi = ((f.bi + sB) % 6 + 6) % 6;
    if (nai === nbi) nbi = (nbi + 1) % 6;
    var nAng = f.ang + (rngSched() * 1.3 - 0.65);
    var nOff = rngSched() * 0.7 - 0.35;
    f.trans = {
      t0: time, dur: 2,
      fromColA: f.colA.slice(), toColA: PALETTE[nai].slice(),
      fromColB: f.colB.slice(), toColB: PALETTE[nbi].slice(),
      fromAng: f.ang, toAng: nAng,
      fromOff: f.off, toOff: nOff
    };
    f.ai = nai; f.bi = nbi;
    busyUntil = time + 2;
    var nb = neighbors(fi);
    for (var k = 0; k < nb.length; k++) {
      var g = fields[nb[k]];
      commit(g);
      g.drift = {
        t0: time, dur: 2,
        fromColA: g.colA.slice(), toColA: mix(g.colA, PALETTE[nai], 0.15),
        fromColB: g.colB.slice(), toColB: mix(g.colB, PALETTE[nbi], 0.15)
      };
    }
    knock(fi);
  }

  // ---------- schedule ----------
  var order = [], orderPos = 0;
  function newOrder() {
    order = [0, 1, 2, 3, 4, 5, 6, 7, 8];
    for (var i = 8; i > 0; i--) {
      var j = Math.floor(rngSched() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    orderPos = 0;
  }
  newOrder();
  var nextSchedTime = 8;
  var atelierQueue = [];

  function advance(t) {
    while (true) {
      var evTime, evField, evJump = null, isQueue = false;
      if (atelierQueue.length) {
        evTime = atelierQueue[0].time; evField = atelierQueue[0].field; evJump = atelierQueue[0].jump;
        isQueue = true;
      } else {
        if (orderPos >= 9) newOrder();
        evTime = nextSchedTime; evField = order[orderPos];
      }
      if (evTime > t) break;
      var start = Math.max(evTime, busyUntil);
      if (start > t) break;
      if (isQueue) { atelierQueue.shift(); }
      else { orderPos++; nextSchedTime = start + 8; }
      fireResolution(start, evField, evJump);
    }
  }

  // ---------- wind (drag) ----------
  var wind = { dragging: false, dx: 0, dy: 0, releasedAt: null, k0: 0, ang0: 0 };
  function windTilt(a, t) {
    var k = 0, la = 0;
    if (wind.dragging) {
      var d = Math.sqrt(wind.dx * wind.dx + wind.dy * wind.dy);
      if (d < 2) return 0;
      k = Math.min(1, d / (0.22 * Math.min(W, H)));
      la = Math.atan2(wind.dy, wind.dx);
    } else if (wind.releasedAt !== null) {
      var age = t - wind.releasedAt;
      if (age >= 1.5 || wind.k0 <= 0) return 0;
      var p = age / 1.5;
      k = wind.k0 * (1 - ease(p));
      la = wind.ang0;
    } else return 0;
    var lm = ((la % Math.PI) + Math.PI) % Math.PI;
    return 0.45 * k * Math.sin(2 * (lm - a));
  }

  // ---------- per-field state at time t ----------
  function fieldColors(f, t) {
    var cA = f.colA, cB = f.colB;
    if (f.trans) {
      var p = ease((t - f.trans.t0) / f.trans.dur);
      cA = mix(f.trans.fromColA, f.trans.toColA, p);
      cB = mix(f.trans.fromColB, f.trans.toColB, p);
    } else if (f.drift) {
      var q = ease((t - f.drift.t0) / f.drift.dur);
      cA = mix(f.drift.fromColA, f.drift.toColA, q);
      cB = mix(f.drift.fromColB, f.drift.toColB, q);
    }
    return [cA, cB];
  }
  function fieldEdge(f, t) {
    var ang = f.ang, off = f.off;
    if (f.trans) {
      var p = ease((t - f.trans.t0) / f.trans.dur);
      ang = f.trans.fromAng + (f.trans.toAng - f.trans.fromAng) * p;
      off = f.trans.fromOff + (f.trans.toOff - f.trans.fromOff) * p;
    }
    ang += windTilt(ang, t);
    return [ang, off];
  }

  // ---------- geometry ----------
  function layout() {
    var g = Math.max(6, Math.min(W, H) * 0.014);
    var cw = (W - 2 * g - 2 * g) / 3;
    var ch = (H - 2 * g - 2 * g) / 3;
    var rects = [];
    for (var r = 0; r < 3; r++) {
      for (var c = 0; c < 3; c++) {
        rects.push([g + c * (cw + g), g + r * (ch + g), cw, ch]);
      }
    }
    return { g: g, rects: rects };
  }

  function clipHalf(poly, nx, ny, d, keepPos) {
    var out = [];
    for (var i = 0; i < poly.length; i++) {
      var p = poly[i], q = poly[(i + 1) % poly.length];
      var sp = p[0] * nx + p[1] * ny - d;
      var sq = q[0] * nx + q[1] * ny - d;
      if (!keepPos) { sp = -sp; sq = -sq; }
      if (sp >= 0) out.push(p);
      if ((sp >= 0) !== (sq >= 0)) {
        var k = sp / (sp - sq);
        out.push([p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k]);
      }
    }
    return out;
  }

  function fillPoly(poly, cx, cy, color) {
    if (poly.length < 3) return;
    ctx.beginPath();
    ctx.moveTo(cx + poly[0][0], cy + poly[0][1]);
    for (var i = 1; i < poly.length; i++) ctx.lineTo(cx + poly[i][0], cy + poly[i][1]);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawField(rect, f, t) {
    var x = rect[0], y = rect[1], w = rect[2], h = rect[3];
    var cx = x + w / 2, cy = y + h / 2;
    var cols = fieldColors(f, t);
    var edge = fieldEdge(f, t);
    var ang = edge[0], off = edge[1];
    var nx = -Math.sin(ang), ny = Math.cos(ang);
    var ux = Math.cos(ang), uy = Math.sin(ang);
    var d = off * Math.min(w, h);
    var hw = w / 2, hh = h / 2;
    var rectPoly = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
    var polyA = clipHalf(rectPoly, nx, ny, d, true);
    var polyB = clipHalf(rectPoly, nx, ny, d, false);
    fillPoly(polyB, cx, cy, css(cols[1]));
    fillPoly(polyA, cx, cy, css(cols[0]));
    // overdraw: dividing line clipped to the rect
    var bx = nx * d, by = ny * d;
    var smin = -Infinity, smax = Infinity, ok = true;
    if (Math.abs(ux) < 1e-9) { if (Math.abs(bx) > hw) ok = false; }
    else {
      var s1 = (-hw - bx) / ux, s2 = (hw - bx) / ux;
      smin = Math.max(smin, Math.min(s1, s2)); smax = Math.min(smax, Math.max(s1, s2));
    }
    if (Math.abs(uy) < 1e-9) { if (Math.abs(by) > hh) ok = false; }
    else {
      var s3 = (-hh - by) / uy, s4 = (hh - by) / uy;
      smin = Math.max(smin, Math.min(s3, s4)); smax = Math.min(smax, Math.max(s3, s4));
    }
    if (ok && smax >= smin) {
      ctx.beginPath();
      ctx.moveTo(cx + bx + ux * smin, cy + by + uy * smin);
      ctx.lineTo(cx + bx + ux * smax, cy + by + uy * smax);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = Math.max(1.6, Math.min(W, H) * 0.0028);
      ctx.stroke();
    }
  }

  function draw(t) {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var lay = layout();
    for (var i = 0; i < 9; i++) drawField(lay.rects[i], fields[i], t);
  }

  // ---------- time ----------
  var T0 = 9.1; // frame one: first resolution (t=8) caught 1.1s into its 2s sweep
  var lastT = T0;
  function currentT() { return lastT; }
  var hasPerf = (typeof performance !== 'undefined' && typeof performance.now === 'function');
  var loadStamp = hasPerf ? performance.now() : 0;

  // ---------- interaction ----------
  function fieldAt(x, y) {
    var lay = layout();
    var best = 0, bd = Infinity;
    for (var i = 0; i < 9; i++) {
      var r = lay.rects[i];
      var cx = r[0] + r[2] / 2, cy = r[1] + r[3] / 2;
      var dd = (x - cx) * (x - cx) + (y - cy) * (y - cy);
      if (dd < bd) { bd = dd; best = i; }
    }
    return best;
  }

  var pendingTap = null;
  function handleTap(x, y) {
    var now = currentT();
    if (pendingTap && (now - pendingTap.time) < 0.35) {
      pendingTap = null;
      newAtelier();
      return;
    }
    pendingTap = { x: x, y: y, time: now };
  }
  function forceResolve(fi) {
    atelierQueue.length = 0;
    var start = Math.max(currentT(), busyUntil);
    fireResolution(start, fi, null);
    nextSchedTime = start + 8;
  }
  function newAtelier() {
    var jump = [2, 3, -2, -3][Math.floor(rngSched() * 4)];
    var ord = [0, 1, 2, 3, 4, 5, 6, 7, 8];
    for (var i = 8; i > 0; i--) {
      var j = Math.floor(rngSched() * (i + 1));
      var tmp = ord[i]; ord[i] = ord[j]; ord[j] = tmp;
    }
    var t0 = Math.max(currentT() + 0.3, busyUntil);
    atelierQueue.length = 0;
    for (var k = 0; k < 9; k++) atelierQueue.push({ time: t0 + k * 6, field: ord[k], jump: jump });
    nextSchedTime = t0 + 9 * 6 + 8;
  }

  var pDown = null;
  function posOf(e) {
    if (e && typeof e.clientX === 'number') return [e.clientX, e.clientY];
    return [0, 0];
  }
  function onDown(e) {
    ensureAudio();
    if (AC && AC.resume) { try { AC.resume(); } catch (err) {} }
    var p = posOf(e);
    pDown = { x: p[0], y: p[1], moved: false };
    wind.dragging = true; wind.dx = 0; wind.dy = 0; wind.releasedAt = null;
  }
  function onMove(e) {
    if (!pDown) return;
    var p = posOf(e);
    wind.dx = p[0] - pDown.x; wind.dy = p[1] - pDown.y;
    if (Math.sqrt(wind.dx * wind.dx + wind.dy * wind.dy) > 8) pDown.moved = true;
  }
  function onUp(e) {
    if (!pDown) return;
    var d = Math.sqrt(wind.dx * wind.dx + wind.dy * wind.dy);
    wind.dragging = false;
    wind.releasedAt = currentT();
    wind.k0 = Math.min(1, d / (0.22 * Math.min(W, H)));
    wind.ang0 = Math.atan2(wind.dy, wind.dx);
    var wasDrag = pDown.moved;
    var px = pDown.x, py = pDown.y;
    pDown = null;
    if (!wasDrag) handleTap(px, py);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---------- sizing ----------
  function resize() {
    var s = viewSize();
    W = s[0]; H = s[1];
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    var sw = null, sh = null;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width; sh = window.screen.height; }
    if (sw !== null && sh !== null && Math.min(sw, sh) < 700) phone = true;
    else phone = (H > W * 1.15);
    draw(currentT());
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // ---------- run ----------
  advance(T0);   // deterministic: fires the t=8 resolution, caught mid-sweep
  resize();      // sizes the canvas and draws frame one at exactly T0

  function frame() {
    var el = hasPerf ? (performance.now() - loadStamp) / 1000 : 0;
    var t = T0 + el;
    lastT = t;
    advance(t);
    if (pendingTap && (t - pendingTap.time) >= 0.35) {
      var pt = pendingTap; pendingTap = null;
      forceResolve(fieldAt(pt.x, pt.y));
    }
    draw(t);
    requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
