<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№37 · Fourteen Paths</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1ea; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(35,35,35,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag across the strip to choose a path</div>
<script>
'use strict';
// No37 Fourteen Paths.
// A Dyck path of semilength 4 climbs 4 steps up and 4 steps down
// without ever dropping below its start level. There are exactly 14
// (the Catalan number C4). This piece generates them by recursion
// and asserts the count. The hero path draws itself step by step on
// a big 4x4 lattice, staircase in ink over a faint diagonal guide,
// holds, then gives way to the next path. A strip below shows all
// 14 as mini staircases; the active one is indigo. Drag across the
// strip to choose the hero; idle, it cycles on its own.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '37', 10) || 37;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f4f1ea';
const INK = '#232323';
const INDIGO = '#2b3a67';
const GUIDE = '#b9b2a4';

function dyck() {
  const out = [];
  function rec(path, bal, ups, downs) {
    if (path.length === 8) { out.push(path.slice()); return; }
    if (ups < 4) { path.push(1); rec(path, bal + 1, ups + 1, downs); path.pop(); }
    if (bal > 0) { path.push(-1); rec(path, bal - 1, ups, downs + 1); path.pop(); }
  }
  rec([], 0, 0, 0);
  return out;
}
const PATHS = dyck();                                  // exactly 14
const PER = 3.4;          // seconds per hero path
const LOOP = PER * 14;

let chosen = null;        // hero index while a choice is held
let chosenUntil = 0;
let dragInfo = null;

function layout(w, h) {
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  return { RX, RY, ox: (w - RX) / 2, oy: (h - RY) / 2 };
}

function drawPath(cells, x0, y0, unit, color, lw, upto) {
  // staircase: each step goes right one unit, then up or down one unit
  let cx = x0, cy = y0;
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  const n = Math.floor(upto);
  for (let i = 0; i < n; i++) {
    cx += unit;
    ctx.lineTo(cx, cy);
    cy -= cells[i] * unit;
    ctx.lineTo(cx, cy);
  }
  if (upto > n && n < 8) {
    const f = upto - n;
    ctx.lineTo(cx + unit * f, cy);
    ctx.lineTo(cx + unit * f, cy - cells[n] * unit * f);
  }
  ctx.stroke();
}

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const { RX, RY, ox, oy } = layout(w, h);
  const te = nowMs / 1000;
  let heroIdx, heroU;
  if (chosen != null && performance.now() / 1000 < chosenUntil) {
    heroIdx = chosen;
    heroU = Math.min(1, (te % PER) / 2.2);
  } else {
    const cyc = (te % LOOP) / PER;
    heroIdx = Math.floor(cyc);
    heroU = Math.min(1, (cyc - heroIdx) * PER / 2.2);
  }

  // hero lattice: 8 wide, 4 tall; diagonal guide; staircase from bottom-left
  const unit = Math.min(RX * 0.78 / 8, RY * 0.46 / 4);
  const hx = ox + (RX - unit * 8) / 2, hy = oy + RY * 0.10 + unit * 4;
  ctx.strokeStyle = GUIDE;
  ctx.lineWidth = Math.max(0.8, unit * 0.03);
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(hx + unit * 8, hy - unit * 4);
  ctx.stroke();
  ctx.fillStyle = GUIDE;
  const dotR = Math.max(1.1, unit * 0.045);
  for (let i = 0; i <= 8; i++) for (let j = 0; j <= 4; j++) {
    ctx.beginPath();
    ctx.arc(hx + i * unit, hy - j * unit, dotR, 0, Math.PI * 2);
    ctx.fill();
  }
  drawPath(PATHS[heroIdx], hx, hy, unit, INK, Math.max(1.6, unit * 0.09), heroU * 8);

  // strip of all 14
  const cols = 7, rows = 2;
  const stripTop = oy + RY * 0.72;
  const cellW = RX / cols, cellH = RY * 0.12;
  PATHS.forEach((p, k) => {
    const ci = k % cols, ri = Math.floor(k / cols);
    const mu = Math.min(cellW * 0.68 / 8, cellH * 0.62 / 4);
    const px = ox + ci * cellW + (cellW - mu * 8) / 2;
    const py = stripTop + ri * cellH + cellH * 0.86;
    drawPath(p, px, py, mu, k === heroIdx ? INDIGO : 'rgba(35,35,35,0.55)', Math.max(0.8, mu * 0.22), 8);
  });
  return { stripTop, cellH, cols, rows, RX, ox };
}

let lastLayout = null;
function loop(nowMs) {
  lastLayout = drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(7300);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function frameAndSave(nowMs) { lastLayout = drawFrame(nowMs); }
canvas.addEventListener('pointerdown', ev => {
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  dragInfo = { x: ev.clientX - r.left, y: ev.clientY - r.top };
  pickFromDrag();
});
canvas.addEventListener('pointermove', ev => {
  if (!dragInfo) return;
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  dragInfo.x = ev.clientX - r.left;
  dragInfo.y = ev.clientY - r.top;
  pickFromDrag();
});
function pickFromDrag() {
  if (!lastLayout) lastLayout = drawFrame(performance.now());
  const L = lastLayout;
  if (dragInfo.y < L.stripTop - L.cellH * 0.4) return;
  const ci = Math.floor((dragInfo.x - L.ox) / (L.RX / L.cols));
  const ri = dragInfo.y >= L.stripTop + L.cellH ? 1 : 0;
  const k = ri * L.cols + ci;
  if (k >= 0 && k < 14) {
    chosen = k;
    chosenUntil = performance.now() / 1000 + 6;
  }
}
canvas.addEventListener('pointerup', () => { dragInfo = null; });
canvas.addEventListener('pointercancel', () => { dragInfo = null; });
window.addEventListener('resize', () => frameAndSave(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => frameAndSave(performance.now()));
</script>
</body>
</html>
