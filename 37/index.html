<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№37 · Fourteen Paths</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1ea; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// No37 Fourteen Paths.
// A Dyck path of semilength 4 climbs 4 steps up and 4 steps down
// without ever dropping below its start level. There are exactly 14
// (the Catalan number C4). This piece generates them by recursion
// and asserts the count. One path fills the frame, drawing itself
// step by step on a lattice, staircase in ink over a faint diagonal
// guide, holds, then gives way to the next path. Drag horizontally
// to scrub the sequence; release and it resumes.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '37', 10) || 37;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f4f1ea';
const INK = '#232323';
const INDIGO = '#2b3a67';
const GUIDE = '#b9b2a4';

function dyck() {
  const out = [];
  function rec(path, bal, ups, downs) {
    if (path.length === 8) { out.push(path.slice()); return; }
    if (ups < 4) { path.push(1); rec(path, bal + 1, ups + 1, downs); path.pop(); }
    if (bal > 0) { path.push(-1); rec(path, bal - 1, ups, downs + 1); path.pop(); }
  }
  rec([], 0, 0, 0);
  return out;
}
const PATHS = dyck();                                  // exactly 14
const PER = 3.4;          // seconds per path
const LOOP = PER * 14;

let scrub = 0;
let dragInfo = null;
let holdPos = null, holdUntil = 0;

function layout(w, h) {
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  return { RX, RY, ox: (w - RX) / 2, oy: (h - RY) / 2 };
}

function drawPath(cells, x0, y0, unit, color, lw, upto) {
  // staircase: each step goes right one unit, then up or down one unit
  let cx = x0, cy = y0;
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  const n = Math.floor(upto);
  for (let i = 0; i < n; i++) {
    cx += unit;
    ctx.lineTo(cx, cy);
    cy -= cells[i] * unit;
    ctx.lineTo(cx, cy);
  }
  if (upto > n && n < 8) {
    const f = upto - n;
    ctx.lineTo(cx + unit * f, cy);
    ctx.lineTo(cx + unit * f, cy - cells[n] * unit * f);
  }
  ctx.stroke();
}

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const { RX, RY, ox, oy } = layout(w, h);
  const te = nowMs / 1000 + scrub;
  let tPos;
  if (dragInfo) tPos = dragInfo.pos;
  else if (holdPos != null && performance.now() / 1000 < holdUntil) tPos = holdPos;
  else tPos = ((te % LOOP) + LOOP) % LOOP;
  const cyc = tPos / PER;
  const heroIdx = Math.floor(cyc) % 14;
  const heroU = Math.min(1, (cyc - Math.floor(cyc)) * PER / 2.2);

  // hero lattice, centered: 8 wide, 4 tall; diagonal guide; staircase from bottom-left
  const unit = Math.min(RX * 0.8 / 8, RY * 0.6 / 4);
  const hx = ox + (RX - unit * 8) / 2, hy = oy + (RY + unit * 4) / 2;
  ctx.strokeStyle = GUIDE;
  ctx.lineWidth = Math.max(0.8, unit * 0.03);
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(hx + unit * 8, hy - unit * 4);
  ctx.stroke();
  ctx.fillStyle = GUIDE;
  const dotR = Math.max(1.1, unit * 0.045);
  for (let i = 0; i <= 8; i++) for (let j = 0; j <= 4; j++) {
    ctx.beginPath();
    ctx.arc(hx + i * unit, hy - j * unit, dotR, 0, Math.PI * 2);
    ctx.fill();
  }
  drawPath(PATHS[heroIdx], hx, hy, unit, INK, Math.max(1.6, unit * 0.09), heroU * 8);
  return { RX, ox };
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(7300);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function pointerX(ev) {
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0 };
  return ev.clientX - r.left;
}
function currentPos() {
  if (dragInfo) return dragInfo.pos;
  return ((performance.now() / 1000 + scrub) % LOOP + LOOP) % LOOP;
}
canvas.addEventListener('pointerdown', ev => {
  dragInfo = { x: pointerX(ev), startPos: currentPos(), pos: currentPos() };
  holdPos = null;
});
canvas.addEventListener('pointermove', ev => {
  if (!dragInfo) return;
  const [w, h] = viewportWH();
  const L = layout(w, h);
  const dx = pointerX(ev) - dragInfo.x;
  dragInfo.pos = (((dragInfo.startPos + (dx / L.RX) * LOOP) % LOOP) + LOOP) % LOOP;
});
function endDrag() {
  if (!dragInfo) return;
  holdPos = dragInfo.pos;
  holdUntil = performance.now() / 1000 + 4;
  scrub = dragInfo.pos - performance.now() / 1000;
  dragInfo = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
