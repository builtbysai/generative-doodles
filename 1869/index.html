<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kreis, the Sonic Box</title>
<style>
html, body { margin: 0; padding: 0; background: #12100E; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: one system with two faces, negative and positive taking turns;
   the felt phenomenon is alternation itself, two voices trading the lead
   around a shared empty center. A warm classical form and a cool archtop
   form orbit the empty circle like a binary star; the lead glows faintly
   while the other dims to a listener, and when their paths cross at the
   circle's edge their outlines merge into noise for a moment, then part.
   The viewer follows the orbit. Watch only. */
var TAU = Math.PI * 2;
var GROUND = '#12100E';
var GROUND_HI = '#171512';
var CLASS_FILL = '#B57E3E';
var CLASS_EDGE = '#E0A95C';
var CLASS_DARK = '#5E3A1A';
var CLASS_GLOW = '#D9A45B';
var ARCH_FILL = '#5F7E96';
var ARCH_EDGE = '#8FB0C6';
var ARCH_DARK = '#2C3E4C';
var ARCH_GLOW = '#7FA3BC';
var CHALK = '#EDE6D6';
var STATIC = '#8A8A86';
var PLATE = '#1A1713';
var PLATE_LINE = 'rgba(237,230,214,0.22)';
var TITLE_INK = '#EDE6D6';
var HINT_INK = '#9A9184';
var FRAME_T = 18.0;        /* fixed phase: classical lower left and leading, archtop upper right */
var LOOP_LEN = 336.0;      /* seconds per full relative cycle (overlap recurs) */
var ORBIT_R = 0.28;        /* orbit radius, in field units */
var RING_R = 0.20;         /* shared empty circle radius, in field units */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* seeded static specks for the overlap noise burst: fixed positions */
var NOISE = (function () {
  var rng = mulberry32(1869), out = [], i;
  for (i = 0; i < 90; i++) {
    var a = rng() * TAU, r = Math.sqrt(rng());
    out.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, r: 0.6 + rng() * 1.6, a: 0.25 + rng() * 0.6 });
  }
  return out;
})();
/* seeded dust on the ground */
var DUST = (function () {
  var rng = mulberry32(18691), out = [], i;
  for (i = 0; i < 60; i++) {
    out.push({ x: rng(), y: rng(), r: 0.5 + rng() * 1.0, a: 0.03 + rng() * 0.05 });
  }
  return out;
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- orbital agents: pure closed-form functions of t ---- */
/* Classical: 48 s orbit with a slow speed wobble. Archtop: 56 s orbit with
   its own wobble, starting opposite. Their relative cycle is 336 s, so the
   two meet at the circle's edge once per loop and then re-separate. */
function angleClassical(t) {
  return TAU * t / 48 + 0.35 * Math.sin(TAU * t / 96);
}
function angleArchtop(t) {
  return Math.PI + TAU * t / 56 + 0.30 * Math.sin(TAU * t / 112 + 1.0);
}
/* The lead alternates every 24 s: classical leads the first half of each
   48 s solo cycle, archtop the second. */
function leadIsClassical(t) {
  return (t % 48) < 24;
}
function angDiff(a, b) {
  var d = a - b;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return d;
}
/* Guitar silhouette in local units (s = 1): body is a figure-eight outline,
   neck extends toward -y, headstock at the far end. Drawn with the neck
   pointing radially outward from the shared circle. */
function bodyPath(s) {
  ctx.beginPath();
  ctx.moveTo(0, -0.62 * s);
  ctx.bezierCurveTo(0.28 * s, -0.62 * s, 0.40 * s, -0.45 * s, 0.38 * s, -0.28 * s);
  ctx.bezierCurveTo(0.36 * s, -0.12 * s, 0.28 * s, -0.02 * s, 0.30 * s, 0.08 * s);
  ctx.bezierCurveTo(0.34 * s, 0.22 * s, 0.55 * s, 0.22 * s, 0.55 * s, 0.42 * s);
  ctx.bezierCurveTo(0.55 * s, 0.68 * s, 0.30 * s, 0.88 * s, 0, 0.88 * s);
  ctx.bezierCurveTo(-0.30 * s, 0.88 * s, -0.55 * s, 0.68 * s, -0.55 * s, 0.42 * s);
  ctx.bezierCurveTo(-0.55 * s, 0.22 * s, -0.34 * s, 0.22 * s, -0.30 * s, 0.08 * s);
  ctx.bezierCurveTo(-0.28 * s, -0.02 * s, -0.36 * s, -0.12 * s, -0.38 * s, -0.28 * s);
  ctx.bezierCurveTo(-0.40 * s, -0.45 * s, -0.28 * s, -0.62 * s, 0, -0.62 * s);
  ctx.closePath();
}
function drawGuitar(cx, cy, rot, s, fill, edge, dark, glow, lead, dim, noise) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  if (dim) ctx.globalAlpha = 0.55;
  /* lead glow: a faint halo around the playing form */
  if (lead && !noise) {
    var g = ctx.createRadialGradient(0, -0.3 * s, s * 0.2, 0, -0.3 * s, s * 2.4);
    g.addColorStop(0, rgba(glow, 0.28));
    g.addColorStop(1, rgba(glow, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(s * 2.4, -0.3 * s); ctx.arc(0, -0.3 * s, s * 2.4, 0, TAU); ctx.fill();
  }
  /* neck and headstock */
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(-0.09 * s, -0.60 * s);
  ctx.lineTo(0.09 * s, -0.60 * s);
  ctx.lineTo(0.07 * s, -1.55 * s);
  ctx.lineTo(-0.07 * s, -1.55 * s);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(-0.11 * s, -1.78 * s, 0.22 * s, 0.24 * s);
  /* body */
  bodyPath(s);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = noise ? rgba(STATIC, 0.9) : edge;
  ctx.lineWidth = Math.max(1, s * 0.03);
  ctx.stroke();
  /* sound hole */
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(0.13 * s, 0.18 * s);
  ctx.arc(0, 0.18 * s, 0.13 * s, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(CHALK, 0.5);
  ctx.lineWidth = Math.max(1, s * 0.012);
  ctx.stroke();
  /* strings: three lines from bridge to headstock */
  ctx.strokeStyle = rgba(CHALK, lead ? 0.55 : 0.35);
  ctx.lineWidth = Math.max(0.75, s * 0.008);
  var k;
  for (k = -1; k <= 1; k++) {
    ctx.beginPath();
    ctx.moveTo(k * 0.035 * s, 0.55 * s);
    ctx.lineTo(k * 0.025 * s, -1.72 * s);
    ctx.stroke();
  }
  /* frets across the neck */
  ctx.strokeStyle = rgba(dark, 0.8);
  ctx.lineWidth = Math.max(0.75, s * 0.01);
  var fy;
  for (fy = -0.85; fy > -1.55; fy -= 0.18) {
    ctx.beginPath();
    ctx.moveTo(-0.085 * s, fy * s);
    ctx.lineTo(0.085 * s, fy * s);
    ctx.stroke();
  }
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Kreis, the Sonic Box').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Kreis, the Sonic Box').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 23').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Kreis, the Sonic Box', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 23', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. Two voices trade the lead.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  var cx = sc.x + sc.w / 2, cy = sc.y + sc.h / 2;
  var U = Math.min(sc.w, sc.h) * 0.5 * (isPhone ? 1.3 : 1.0);
  var aC = angleClassical(t), aA = angleArchtop(t);
  var cPos = { x: cx + Math.cos(aC) * ORBIT_R * U, y: cy + Math.sin(aC) * ORBIT_R * U };
  var aPos = { x: cx + Math.cos(aA) * ORBIT_R * U, y: cy + Math.sin(aA) * ORBIT_R * U };
  var leadC = leadIsClassical(t);
  /* overlap: the forms meet when their angular separation closes */
  var dAng = Math.abs(angDiff(aC, aA));
  var overlap = 1 - clamp(dAng / 0.45, 0, 1);
  overlap = smooth(overlap);
  /* distance between the two form centers, for the noise burst center */
  var mx = (cPos.x + aPos.x) / 2, my = (cPos.y + aPos.y) / 2;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  if (!isPhone) {
    ctx.fillStyle = GROUND_HI;
    ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
    ctx.strokeStyle = rgba(CHALK, 0.08);
    ctx.lineWidth = 1;
    ctx.strokeRect(sc.x + 0.5, sc.y + 0.5, sc.w - 1, sc.h - 1);
  }
  var i;
  for (i = 0; i < DUST.length; i++) {
    var dp = DUST[i];
    ctx.fillStyle = rgba(CHALK, dp.a);
    ctx.beginPath();
    ctx.moveTo(sc.x + dp.x * sc.w + dp.r, sc.y + dp.y * sc.h);
    ctx.arc(sc.x + dp.x * sc.w, sc.y + dp.y * sc.h, dp.r, 0, TAU);
    ctx.fill();
  }
  /* the shared empty circle: a chalk ring, nothing inside */
  ctx.strokeStyle = rgba(CHALK, 0.85);
  ctx.lineWidth = Math.max(1.5, U * 0.006);
  ctx.beginPath();
  ctx.moveTo(cx + RING_R * U, cy);
  ctx.arc(cx, cy, RING_R * U, 0, TAU);
  ctx.stroke();
  ctx.strokeStyle = rgba(CHALK, 0.25);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx + RING_R * U * 0.86, cy);
  ctx.arc(cx, cy, RING_R * U * 0.86, 0, TAU);
  ctx.stroke();
  /* draw order is depth: the higher form (smaller y) is background */
  var cFirst = cPos.y < aPos.y;
  var sC = U * 0.125, sA = U * 0.115;
  var rotC = Math.atan2(Math.cos(aC), -Math.sin(aC));
  var rotA = Math.atan2(Math.cos(aA), -Math.sin(aA));
  var noisy = overlap > 0.05;
  function drawOne(first) {
    if (first) {
      drawGuitar(cPos.x, cPos.y, rotC, sC, CLASS_FILL, CLASS_EDGE, CLASS_DARK, CLASS_GLOW, leadC, !leadC, noisy);
    } else {
      drawGuitar(aPos.x, aPos.y, rotA, sA, ARCH_FILL, ARCH_EDGE, ARCH_DARK, ARCH_GLOW, !leadC, leadC, noisy);
    }
  }
  if (cFirst) { drawOne(true); drawOne(false); } else { drawOne(false); drawOne(true); }
  /* overlap noise burst: static gray specks where the outlines merge */
  if (overlap > 0) {
    var pulse = 0.7 + 0.3 * Math.sin(TAU * 2 * t);
    var nR = U * 0.13;
    for (i = 0; i < NOISE.length; i++) {
      var np = NOISE[i];
      ctx.fillStyle = rgba(STATIC, np.a * overlap * pulse);
      ctx.beginPath();
      ctx.moveTo(mx + np.x * nR + np.r, my + np.y * nR);
      ctx.arc(mx + np.x * nR, my + np.y * nR, np.r, 0, TAU);
      ctx.fill();
    }
  }
  drawPlates();
}
/* ---- frame one: fixed phase t = 18.0 s, classical lower left and leading, archtop upper right ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % LOOP_LEN;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
