<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№9050 · Tidepool Contours</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0e2a30; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  .cap {
    position: fixed; left: 18px; bottom: 14px;
    font: italic 13px Georgia, serif; color: #7fa3a8;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">№9050 · Tidepool Contours · click to drop a pebble</div>
<script>
// Tidepool Contours: a rock shelf at low tide, seen from above.
// Depth reads as bathymetric color bands; each pool breathes with
// slow ripple rings, and small shore crabs wander the wet rock.
// Click drops a pebble: expanding rings where it lands.

let seed = 7;
const qs = new URLSearchParams(location.search);
if (qs.get('seed')) seed = parseInt(qs.get('seed'), 10) >>> 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// bathymetric palette: deep to shallow
const BANDS = [
  [0.00, '#0a2027'],
  [0.18, '#0e2f36'],
  [0.34, '#134b4a'],
  [0.50, '#1a6a5e'],
  [0.64, '#2a8a6d'],
  [0.76, '#4da97e'],
  [0.86, '#8cc39a'],
  [0.94, '#c9dfae'],
  [1.00, '#e8e4c8']
];
function bandColor(t) {
  for (let i = 1; i < BANDS.length; i++) {
    if (t <= BANDS[i][0]) {
      const [t0, c0] = BANDS[i - 1], [t1, c1] = BANDS[i];
      const f = (t - t0) / (t1 - t0);
      const a = parseInt(c0.slice(1), 16), b = parseInt(c1.slice(1), 16);
      const r = Math.round(((a >> 16) + (((b >> 16) - (a >> 16)) * f)));
      const g = Math.round((((a >> 8) & 255) + ((((b >> 8) & 255) - ((a >> 8) & 255)) * f)));
      const bl = Math.round(((a & 255) + (((b & 255) - (a & 255)) * f)));
      return `rgb(${r},${g},${bl})`;
    }
  }
  return BANDS[BANDS.length - 1][1];
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;
let pools = [], crabs = [], ripples = [];
let rnd;

function buildField() {
  rnd = mulberry32(seed);
  pools = []; crabs = []; ripples = [];
  const n = 4 + ((rnd() * 3) | 0);
  for (let i = 0; i < n; i++) {
    const px = W * (0.12 + rnd() * 0.76);
    const py = H * (0.12 + rnd() * 0.76);
    const pr = Math.min(W, H) * (0.10 + rnd() * 0.13);
    const depth = 0.55 + rnd() * 0.45;
    const wob = [];
    const wl = 5 + ((rnd() * 4) | 0);
    for (let k = 0; k < wl; k++) wob.push(rnd() * Math.PI * 2);
    pools.push({ x: px, y: py, r: pr, depth, wob, phase: rnd() * Math.PI * 2 });
  }
  // crabs wander the rock between pools
  const nc = 5 + ((rnd() * 4) | 0);
  for (let i = 0; i < nc; i++) {
    crabs.push({
      x: rnd() * W, y: rnd() * H,
      a: rnd() * Math.PI * 2,
      sp: 12 + rnd() * 22,
      s: 2.5 + rnd() * 2.5,
      wt: rnd() * 10
    });
  }
}

// depth at (x,y): max over pools of depth * falloff, plus rock base
function depthAt(x, y) {
  let d = 0.06; // wet rock base
  for (const p of pools) {
    const dx = x - p.x, dy = y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > p.r * 1.6) continue;
    const ang = Math.atan2(dy, dx);
    let rr = p.r;
    for (let k = 0; k < p.wob.length; k++) {
      rr *= 1 + 0.10 * Math.sin(ang * (k + 2) + p.wob[k]);
    }
    const t = Math.max(0, 1 - dist / (rr * 1.6));
    d = Math.max(d, p.depth * t * t * (3 - 2 * t));
  }
  return Math.min(1, d);
}

let field = null, fw = 0, fh = 0;
function renderField() {
  // render depth bands to offscreen at low res, then draw scaled
  fw = Math.ceil(W / 6); fh = Math.ceil(H / 6);
  field = document.createElement('canvas');
  field.width = fw; field.height = fh;
  const fctx = field.getContext('2d');
  const img = fctx.createImageData(fw, fh);
  // quantize into bands for the bathymetric look
  const LEVELS = 9;
  for (let y = 0; y < fh; y++) {
    for (let x = 0; x < fw; x++) {
      const d = depthAt(x * 6, y * 6);
      const q = Math.floor(d * LEVELS) / LEVELS;
      const c = bandColor(Math.min(1, q + 0.02));
      const m = c.match(/\d+/g);
      const idx = (y * fw + x) * 4;
      img.data[idx] = +m[0]; img.data[idx + 1] = +m[1]; img.data[idx + 2] = +m[2];
      img.data[idx + 3] = 255;
    }
  }
  fctx.putImageData(img, 0, 0);
}

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildField();
  renderField();
}

let last = 0;
function frame(ts) {
  const t = ts / 1000;
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
  last = ts;

  // base field
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(field, 0, 0, W, H);

  // contour edge lines: redraw a few iso rings per pool for crispness
  ctx.lineWidth = 1;
  for (const p of pools) {
    for (let L = 1; L <= 4; L++) {
      const frac = L / 5;
      const rr = p.r * 1.6 * (1 - frac * 0.8);
      ctx.strokeStyle = 'rgba(232,228,200,0.28)';
      ctx.beginPath();
      const steps = 90;
      for (let s = 0; s <= steps; s++) {
        const ang = (s / steps) * Math.PI * 2;
        let rad = rr;
        for (let k = 0; k < p.wob.length; k++) {
          rad *= 1 + 0.10 * Math.sin(ang * (k + 2) + p.wob[k]);
        }
        const x = p.x + Math.cos(ang) * rad;
        const y = p.y + Math.sin(ang) * rad;
        if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // breathing ripple rings
    const rp = ((t * 0.25 + p.phase) % 1);
    const rrad = p.r * (0.3 + rp * 1.1);
    ctx.strokeStyle = `rgba(232,244,240,${(0.35 * (1 - rp)).toFixed(3)})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rrad, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  // pebble ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.age += dt;
    const k = r.age / 2.2;
    if (k >= 1) { ripples.splice(i, 1); continue; }
    for (let w = 0; w < 3; w++) {
      const ww = (k * 3 - w) / 3;
      if (ww < 0 || ww > 1) continue;
      ctx.strokeStyle = `rgba(235,248,245,${(0.5 * (1 - ww)).toFixed(3)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 6 + ww * 130, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // crabs
  ctx.fillStyle = '#d86a3a';
  for (const c of crabs) {
    c.wt += dt;
    // steer away from deep water, wander
    const d = depthAt(c.x, c.y);
    if (d > 0.35) c.a += dt * 3;
    c.a += Math.sin(c.wt * 0.7) * dt * 1.2;
    c.x += Math.cos(c.a) * c.sp * dt;
    c.y += Math.sin(c.a) * c.sp * dt;
    if (c.x < 0) c.x = W; if (c.x > W) c.x = 0;
    if (c.y < 0) c.y = H; if (c.y > H) c.y = 0;
    // sideways scuttle
    const sx = Math.cos(c.a + Math.PI / 2), sy = Math.sin(c.a + Math.PI / 2);
    const wig = Math.sin(c.wt * 14) * 1.5;
    ctx.beginPath();
    ctx.ellipse(c.x + sx * wig, c.y + sy * wig, c.s, c.s * 0.7, c.a, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(frame);
}

canvas.addEventListener('click', (e) => {
  ripples.push({ x: e.clientX, y: e.clientY, age: 0 });
  if (ripples.length > 8) ripples.shift();
});

resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
