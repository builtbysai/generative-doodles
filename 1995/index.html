<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1995 Leaking Light</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a0d06; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1995 Leaking Light, SN4 / PP1242, study #260 syd-nuku.
  // A mountain landscape in bare-tree silhouette over a red-orange
  // fog, with a blown-out light leak eating the left edge: overexposed
  // white-orange that bleeds into the trees, magenta at its rim. The
  // leak slowly blooms and recedes on its own cycle. Drag pulls the
  // leak across the image; the red-orange fog re-tints warm where the
  // leak passes, the trees stay black. A film accident, welcomed.
  var GROUND = '#2a0d06'; // page ground, dark burnt fog tone

  // Fixed-phase first frame: FIRST_T = 20 s. The cycle is 90 s: the
  // leak blooms and recedes on a slow sine. The bloom factor is
  // 0.75 + 0.25 * sin(2*pi*t/90 - 0.8727), so at t = 20 the factor is
  // 0.875, a mid-bloom moment with the leak at the left third, eating
  // a good bite of the trees but not the whole frame.
  var FIRST_T = 20;
  var CYCLE = 90;
  var BLOOM_PHASE = -0.8727;
  var SEED = 1995;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x) {
    var i = Math.floor(x), f = x - i;
    var u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }
  function fbm(x) {
    return vnoise(x) * 0.55 + vnoise(x * 2.13 + 7.7) * 0.30 + vnoise(x * 4.31 + 3.1) * 0.15;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function mix(a, b, f) {
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: tree black, fog red-orange, leak blown white with
  // magenta edges. The ridges step down from dark rust to near-black.
  var FOG_TOP = [228, 98, 40];
  var FOG_MID = [198, 66, 30];
  var FOG_LOW = [158, 46, 26];
  var RIDGE_FAR = [96, 30, 20];
  var RIDGE_MID = [54, 16, 12];
  var RIDGE_NEAR = [18, 7, 5];
  var TREE = [8, 4, 3];
  var WASH = [255, 146, 74];     // warm re-tint where the leak passes
  var LEAK_CORE = [255, 247, 236];
  var LEAK_WARM = [255, 214, 168];
  var LEAK_EDGE = [238, 74, 152]; // magenta rim
  var CAPTION = [255, 238, 220];

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Cycle -----------------------------------------------------
  // bloom 0.50..1.00 over the 90 s cycle. At FIRST_T = 20 the bloom
  // is 0.875: mid-bloom, the leak eating the left third.
  function bloom(t) {
    return 0.75 + 0.25 * Math.sin(2 * Math.PI * t / CYCLE + BLOOM_PHASE);
  }
  function leakRadius(t) {
    return W * 0.34 * bloom(t);
  }

  // ---- Leak position / drag --------------------------------------
  // Rest position is the left third, mid-height. Dragging holds the
  // leak at the pointer; on release it eases back to the rest
  // position over 2 s. All state is a pure function of the calls made
  // and the virtual clock, so probes are deterministic.
  var REST = { x: 0.30, y: 0.45 };
  var dragging = false;
  var dragPos = null;            // {x, y} stage fractions while dragging
  var releaseFrom = null;        // {x, y} at release
  var releaseT = null;           // virtual t at release
  function leakCenter(t) {
    if (dragging && dragPos) { return { x: dragPos.x, y: dragPos.y }; }
    if (releaseFrom !== null && releaseT !== null) {
      var k = smooth((t - releaseT) / 2);
      if (k >= 1) { releaseFrom = null; releaseT = null; return { x: REST.x, y: REST.y }; }
      return {
        x: releaseFrom.x + (REST.x - releaseFrom.x) * k,
        y: releaseFrom.y + (REST.y - releaseFrom.y) * k
      };
    }
    return { x: REST.x, y: REST.y };
  }

  // ---- Landscape -------------------------------------------------
  // Three ridges across the lower two-thirds, each a pure function of
  // x so the mountains never move. Ridge heights are stage fractions.
  var RIDGES = [
    { base: 0.48, amp: 0.05, off: 0.0, color: RIDGE_FAR },
    { base: 0.66, amp: 0.075, off: 4.7, color: RIDGE_MID },
    { base: 0.84, amp: 0.065, off: 9.3, color: RIDGE_NEAR }
  ];
  function ridgeY(r, xf) {
    return r.base + (fbm(xf * 3.1 + r.off) - 0.5) * 2 * r.amp;
  }
  function drawRidge(r) {
    ctx.fillStyle = rgb(r.color);
    ctx.beginPath();
    ctx.moveTo(-0.02 * W, 1.02 * H);
    ctx.lineTo(-0.02 * W, ridgeY(r, -0.02) * H);
    var x;
    for (x = 0; x <= 1.02; x += 0.02) {
      ctx.lineTo(x * W, ridgeY(r, x) * H);
    }
    ctx.lineTo(1.02 * W, 1.02 * H);
    ctx.closePath();
    ctx.fill();
  }

  // Bare trees: seeded recursive branches, black silhouettes rooted
  // on the mid and near ridges. Built once per size from the seed, so
  // the same trees appear at every t and every render.
  var TREES = null;
  function buildTrees() {
    var rng = mulberry32(SEED * 29 + 7);
    var list = [];
    var i, x, layer;
    for (i = 0; i < 11; i++) {
      x = 0.03 + rng() * 0.94;
      layer = (i % 3 === 0) ? 1 : 2; // a few on the mid ridge, most near
      list.push({
        x: x,
        layer: layer,
        h: 0.06 + rng() * 0.08,
        lean: (rng() - 0.5) * 0.35,
        seed: Math.floor(rng() * 100000)
      });
    }
    TREES = list;
  }
  function drawBranch(x, y, ang, len, depth, rng) {
    var ex = x + Math.cos(ang) * len;
    var ey = y + Math.sin(ang) * len;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    if (depth <= 0 || len < W * 0.004) { return; }
    var kids = 2 + (rng() < 0.4 ? 1 : 0);
    var i;
    for (i = 0; i < kids; i++) {
      var spread = (rng() - 0.5) * 1.1 + (i === 0 ? -0.55 : (i === 1 ? 0.55 : 0));
      drawBranch(ex, ey, ang + spread, len * (0.58 + rng() * 0.12), depth - 1, rng);
    }
  }
  function drawTrees() {
    if (!TREES) { buildTrees(); }
    var i, tr, rng, baseY, bx, by;
    ctx.strokeStyle = rgb(TREE);
    ctx.lineCap = 'round';
    for (i = 0; i < TREES.length; i++) {
      tr = TREES[i];
      rng = mulberry32(tr.seed);
      baseY = ridgeY(RIDGES[tr.layer], tr.x);
      bx = tr.x * W;
      by = baseY * H;
      ctx.lineWidth = Math.max(1.1, W * 0.004);
      drawBranch(bx, by, -Math.PI / 2 + tr.lean, tr.h * H, 5, rng);
    }
  }

  // ---- Fog -------------------------------------------------------
  function drawFog(t) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(FOG_TOP));
    g.addColorStop(0.45, rgb(FOG_MID));
    g.addColorStop(0.72, rgb(FOG_LOW));
    g.addColorStop(1, rgb(mix(FOG_LOW, RIDGE_NEAR, 0.35)));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Slow fog bands drifting across the sky, barely there.
    var i, bx, bw, by;
    for (i = 0; i < 3; i++) {
      bx = (0.15 + 0.35 * i + 0.03 * Math.sin(2 * Math.PI * t / (70 + i * 23) + i * 2.1)) * W;
      by = (0.16 + 0.13 * i) * H;
      bw = 0.55 * W;
      var bg = ctx.createRadialGradient(bx, by, 0, bx, by, bw / 2);
      bg.addColorStop(0, rgba([255, 170, 110], a4(0.10)));
      bg.addColorStop(1, rgba([255, 170, 110], 0));
      ctx.fillStyle = bg;
      // Fill the full gradient square so no hard rect edge shows.
      ctx.fillRect(bx - bw / 2, by - bw / 2, bw, bw);
    }
  }

  // Warm re-tint where the leak passes, laid under the trees so the
  // fog glows warm around the leak while the trees stay black.
  function drawWash(c, R) {
    var cx = c.x * W, cy = c.y * H, wr = R * 1.5;
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, wr);
    g.addColorStop(0, rgba(WASH, a4(0.42)));
    g.addColorStop(0.55, rgba(WASH, a4(0.18)));
    g.addColorStop(1, rgba(WASH, 0));
    ctx.fillStyle = g;
    ctx.fillRect(cx - wr, cy - wr, wr * 2, wr * 2);
  }

  // ---- The leak --------------------------------------------------
  // A soft radial mask, not a lens flare: a blown white-orange core
  // that fades out through a magenta rim. Drawn last, so it eats the
  // trees and the ridges where it covers them; nothing is drawn inside
  // the blown zone. The core is near-opaque, so no landscape detail
  // survives inside it.
  function drawLeak(c, R) {
    var cx = c.x * W, cy = c.y * H;
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    g.addColorStop(0, rgba(LEAK_CORE, a4(0.97)));
    g.addColorStop(0.42, rgba(LEAK_WARM, a4(0.95)));
    g.addColorStop(0.62, rgba(LEAK_WARM, a4(0.88)));
    g.addColorStop(0.78, rgba(LEAK_EDGE, a4(0.45)));
    g.addColorStop(0.90, rgba(LEAK_EDGE, a4(0.12)));
    g.addColorStop(1, rgba(LEAK_EDGE, 0));
    ctx.fillStyle = g;
    ctx.fillRect(cx - R, cy - R, R * 2, R * 2);

    // Hotter heart: a smaller core so the center reads truly blown.
    var hr = R * 0.42;
    var hg = ctx.createRadialGradient(cx, cy, 0, cx, cy, hr);
    hg.addColorStop(0, rgba([255, 252, 248], a4(0.95)));
    hg.addColorStop(0.7, rgba(LEAK_CORE, a4(0.55)));
    hg.addColorStop(1, rgba(LEAK_CORE, 0));
    ctx.fillStyle = hg;
    ctx.fillRect(cx - hr, cy - hr, hr * 2, hr * 2);
  }

  // ---- Captions --------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var c = leakCenter(t);
    var R = leakRadius(t);

    // Fog sky over the whole stage.
    drawFog(t);

    // Warm wash where the leak is, under the landscape.
    drawWash(c, R);

    // Ridges, far to near, across the lower two-thirds.
    drawRidge(RIDGES[0]);
    drawRidge(RIDGES[1]);
    drawRidge(RIDGES[2]);

    // Bare black trees on the mid and near ridges.
    drawTrees();

    // The leak eats the left edge, and the trees with it.
    drawLeak(c, R);

    // Title plate, top left, and the hint, bottom center. Pale cream
    // stays readable over the fog and over the dark ridges alike.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.85));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1995 · Leaking Light', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CAPTION, a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2007 · 06 · 29', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CAPTION, a4(0.8));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to pull the light leak across the frame.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // ---- Interaction -----------------------------------------------
  // Drag pulls the leak center; release eases it back to the cycle
  // position. Never click-to-reload.
  function pointerPos(e) {
    var r = null;
    try { r = canvas.getBoundingClientRect(); } catch (err) { r = null; }
    var px, py;
    if (r && r.width) {
      px = e.clientX - r.left; py = e.clientY - r.top;
    } else if (typeof e.offsetX === 'number') {
      px = e.offsetX; py = e.offsetY;
    } else {
      px = W / 2; py = H / 2;
    }
    return { x: clamp(px / W, 0, 1), y: clamp(py / H, 0, 1) };
  }
  function onDown(e) {
    dragging = true;
    dragPos = pointerPos(e);
    releaseFrom = null; releaseT = null;
    draw(lastT);
    if (e.preventDefault) { try { e.preventDefault(); } catch (err) {} }
  }
  function onMove(e) {
    if (!dragging) { return; }
    dragPos = pointerPos(e);
    draw(lastT);
    if (e.preventDefault) { try { e.preventDefault(); } catch (err) {} }
  }
  function onUp() {
    if (!dragging) { return; }
    dragging = false;
    releaseFrom = dragPos ? { x: dragPos.x, y: dragPos.y } : { x: REST.x, y: REST.y };
    dragPos = null;
    releaseT = lastT;
    draw(lastT);
  }
  try {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { TREES = null; resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { TREES = null; resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1995 exposes the cycle state and the drag state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1995 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      bloom: bloom,
      radius: function (t) { return leakRadius(t); },
      center: function (t) { return leakCenter(t); },
      dragTo: function (xf, yf) {
        dragging = true;
        dragPos = { x: clamp(xf, 0, 1), y: clamp(yf, 0, 1) };
        releaseFrom = null; releaseT = null;
      },
      release: function () {
        if (dragging) {
          releaseFrom = dragPos ? { x: dragPos.x, y: dragPos.y } : { x: REST.x, y: REST.y };
          dragPos = null; releaseT = lastT;
        }
        dragging = false;
      },
      isDragging: function () { return dragging; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  buildTrees();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the leak blooms and recedes over 90 s. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
