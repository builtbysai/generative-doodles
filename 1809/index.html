<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room as Score</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #43464a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG, fixed seed: frame one is fully deterministic.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1809);

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  // Camera loop: 120 s out and back along the chapel axis.
  // u = 0 at the entrance, u = 1 at the far apse. Frame one t = 60 s
  // sits at u = 1, the far end, where the 9 m niche wire is sounding.
  var LOOP = 120;
  function camU(t) {
    var ph = ((t % LOOP) + LOOP) % LOOP / LOOP;
    return ph < 0.5 ? ph * 2 : 2 - ph * 2;
  }

  // The three wires. Span in meters drives the shimmer law:
  // longer span -> slower, wider wave envelope; shorter span ->
  // quicker, tighter. center is where on the camera path the wire
  // sounds; width is the sounding window in u.
  var WIRES = [
    { span: 40, x0: 0.06, y0: 0.30, x1: 0.92, y1: 0.16, par: 0.08,
      center: 0.25, width: 0.14, waves: 1.5, omega: 0.6, amp: 6.0 },
    { span: 23, x0: 0.30, y0: 0.56, x1: 0.86, y1: 0.36, par: 0.06,
      center: 0.55, width: 0.13, waves: 2.5, omega: 1.1, amp: 4.0 },
    { span: 9,  x0: 0.62, y0: 0.64, x1: 0.88, y1: 0.52, par: 0.03,
      center: 0.90, width: 0.12, waves: 4.0, omega: 2.0, amp: 2.5 }
  ];

  // Dust motes: seeded positions and drift phases.
  var MOTES = [];
  for (var i = 0; i < 36; i++) {
    MOTES.push({
      x: rnd(), y: rnd(), r: 0.6 + rnd() * 1.4,
      a: 0.06 + rnd() * 0.16,
      px: rnd() * Math.PI * 2, py: rnd() * Math.PI * 2,
      sx: 0.004 + rnd() * 0.010, sy: 0.003 + rnd() * 0.008
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function alpha(v) {
    var a = Math.round(v * 10000) / 10000;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    return a;
  }

  var currentT = 60;

  function draw(t) {
    currentT = t;
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var W = Math.max(1, Math.floor(vw));
    var H = Math.max(1, Math.floor(vh));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var isPhone = false;
    try {
      var sw = window.screen.width, sh = window.screen.height;
      var mn = Math.min(sw, sh);
      isPhone = mn < 700 || (H > W * 1.15);
    } catch (e) { isPhone = (H > W * 1.15); }

    // Page ground is the piece's own background color on both sizes.
    ctx.fillStyle = '#43464a';
    ctx.fillRect(0, 0, W, H);

    // Field-like composition: full-bleed on phones, square on desktop.
    var rx, ry, rw, rh;
    if (isPhone) {
      rx = 0; ry = 0; rw = W; rh = H;
    } else {
      var s = Math.min(W, H) * 0.94;
      rw = s; rh = s;
      rx = (W - rw) / 2; ry = (H - rh) / 2;
    }

    var u = camU(t);
    var cx = rx + rw / 2;

    // Back wall (apse) grows as the camera advances down the axis.
    var bw = rw * (0.30 + 0.38 * u);
    var bh = rh * (0.34 + 0.40 * u);
    var bx0 = cx - bw / 2, bx1 = cx + bw / 2;
    var by0 = ry + rh * 0.46 - bh / 2, by1 = by0 + bh;
    var floorY = by1;

    // Ceiling: dark, top of frame down to the apse top.
    ctx.fillStyle = '#33353a';
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + rw, ry);
    ctx.lineTo(bx1, by0);
    ctx.lineTo(bx0, by0);
    ctx.closePath();
    ctx.fill();

    // Side walls: cool stone, slightly lighter toward the apse.
    var wl = ctx.createLinearGradient(rx, 0, bx0, 0);
    wl.addColorStop(0, '#4c4f54');
    wl.addColorStop(1, '#5b5f64');
    ctx.fillStyle = wl;
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(bx0, by0);
    ctx.lineTo(bx0, floorY);
    ctx.lineTo(rx, ry + rh);
    ctx.closePath();
    ctx.fill();

    var wr = ctx.createLinearGradient(rx + rw, 0, bx1, 0);
    wr.addColorStop(0, '#4c4f54');
    wr.addColorStop(1, '#5b5f64');
    ctx.fillStyle = wr;
    ctx.beginPath();
    ctx.moveTo(rx + rw, ry);
    ctx.lineTo(bx1, by0);
    ctx.lineTo(bx1, floorY);
    ctx.lineTo(rx + rw, ry + rh);
    ctx.closePath();
    ctx.fill();

    // Floor: darker stone, lighter toward the apse.
    var fl = ctx.createLinearGradient(0, floorY, 0, ry + rh);
    fl.addColorStop(0, '#4a4c50');
    fl.addColorStop(1, '#333437');
    ctx.fillStyle = fl;
    ctx.beginPath();
    ctx.moveTo(rx, ry + rh);
    ctx.lineTo(rx + rw, ry + rh);
    ctx.lineTo(bx1, floorY);
    ctx.lineTo(bx0, floorY);
    ctx.closePath();
    ctx.fill();

    // Floor joints: perspective lines converging on the apse.
    ctx.strokeStyle = 'rgba(0,0,0,' + alpha(0.16) + ')';
    ctx.lineWidth = 1;
    for (var j = -2; j <= 2; j++) {
      var fx0 = cx + j * rw * 0.22;
      var fx1 = cx + j * bw * 0.22;
      ctx.beginPath();
      ctx.moveTo(fx0, ry + rh);
      ctx.lineTo(fx1, floorY);
      ctx.stroke();
    }

    // Apse wall: cool grey, lighter toward the top.
    var wall = ctx.createLinearGradient(0, by0, 0, floorY);
    wall.addColorStop(0, '#666a6f');
    wall.addColorStop(1, '#4e5156');
    ctx.fillStyle = wall;
    ctx.fillRect(bx0, by0, bw, bh);

    // Round window high in the apse, pale daylight.
    var ocx = cx, ocy = by0 + bh * 0.22, orr = bw * 0.11;
    ctx.beginPath();
    ctx.moveTo(ocx + orr, ocy);
    ctx.arc(ocx, ocy, orr, 0, Math.PI * 2);
    ctx.fillStyle = '#20211f';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(ocx + orr * 0.82, ocy);
    ctx.arc(ocx, ocy, orr * 0.82, 0, Math.PI * 2);
    var og = ctx.createLinearGradient(ocx, ocy - orr, ocx, ocy + orr);
    og.addColorStop(0, '#eef2f4');
    og.addColorStop(1, '#c9d4d6');
    ctx.fillStyle = og;
    ctx.fill();
    // Oculus mullions.
    ctx.strokeStyle = '#20211f';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ocx - orr * 0.82, ocy);
    ctx.lineTo(ocx + orr * 0.82, ocy);
    ctx.moveTo(ocx, ocy - orr * 0.82);
    ctx.lineTo(ocx, ocy + orr * 0.82);
    ctx.stroke();

    // Two tall high windows flanking the apse.
    var winW = bw * 0.09, winH = bh * 0.34;
    var winY = by0 + bh * 0.10;
    var winL = bx0 + bw * 0.10, winR = bx1 - bw * 0.10 - winW;
    ctx.fillStyle = '#20211f';
    ctx.fillRect(winL - 3, winY - 3, winW + 6, winH + 6);
    ctx.fillRect(winR - 3, winY - 3, winW + 6, winH + 6);
    var wg = ctx.createLinearGradient(0, winY, 0, winY + winH);
    wg.addColorStop(0, '#e8eef0');
    wg.addColorStop(1, '#c3cfd2');
    ctx.fillStyle = wg;
    ctx.fillRect(winL, winY, winW, winH);
    ctx.fillRect(winR, winY, winW, winH);
    ctx.fillStyle = '#20211f';
    ctx.fillRect(winL + winW / 2 - 1, winY, 2, winH);
    ctx.fillRect(winR + winW / 2 - 1, winY, 2, winH);

    // Light shafts from the apse windows down to the floor.
    ctx.fillStyle = 'rgba(232,238,240,' + alpha(0.06) + ')';
    ctx.beginPath();
    ctx.moveTo(winL, winY + winH);
    ctx.lineTo(winL + winW, winY + winH);
    ctx.lineTo(winL + winW + rw * 0.10, floorY + rh * 0.08);
    ctx.lineTo(winL - rw * 0.04, floorY + rh * 0.08);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(winR, winY + winH);
    ctx.lineTo(winR + winW, winY + winH);
    ctx.lineTo(winR + winW + rw * 0.04, floorY + rh * 0.08);
    ctx.lineTo(winR - rw * 0.10, floorY + rh * 0.08);
    ctx.closePath();
    ctx.fill();

    // Pale daylight pools on the floor under the shafts.
    ctx.fillStyle = 'rgba(228,234,236,' + alpha(0.08) + ')';
    ctx.beginPath();
    ctx.moveTo(winL - rw * 0.04, floorY + rh * 0.02);
    ctx.lineTo(winL + winW + rw * 0.10, floorY + rh * 0.02);
    ctx.lineTo(winL + winW + rw * 0.13, floorY + rh * 0.08);
    ctx.lineTo(winL - rw * 0.07, floorY + rh * 0.08);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(winR - rw * 0.10, floorY + rh * 0.02);
    ctx.lineTo(winR + winW + rw * 0.04, floorY + rh * 0.02);
    ctx.lineTo(winR + winW + rw * 0.07, floorY + rh * 0.08);
    ctx.lineTo(winR - rw * 0.13, floorY + rh * 0.08);
    ctx.closePath();
    ctx.fill();

    // Apse arch line and floor seam.
    ctx.strokeStyle = 'rgba(0,0,0,' + alpha(0.20) + ')';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx0, by0, bw, bh);
    ctx.fillStyle = 'rgba(0,0,0,' + alpha(0.22) + ')';
    ctx.fillRect(rx, floorY - 1, rw, 1);

    // Dust motes drifting in the light shafts and across the room.
    for (var m = 0; m < MOTES.length; m++) {
      var mo = MOTES[m];
      var mx = rx + (mo.x + Math.sin(t * mo.sx + mo.px) * 0.02) * rw;
      var my = ry + (mo.y + Math.sin(t * mo.sy + mo.py) * 0.015) * rh;
      var inShaft = (mx > winL - rw * 0.06 && mx < winL + winW + rw * 0.12 && my > winY && my < floorY + rh * 0.08) ||
                    (mx > winR - rw * 0.12 && mx < winR + winW + rw * 0.06 && my > winY && my < floorY + rh * 0.08);
      ctx.beginPath();
      ctx.moveTo(mx + mo.r, my);
      ctx.arc(mx, my, mo.r, 0, Math.PI * 2);
      ctx.fillStyle = inShaft
        ? 'rgba(240,244,246,' + alpha(mo.a + 0.10) + ')'
        : 'rgba(200,205,210,' + alpha(mo.a) + ')';
      ctx.fill();
    }

    // The wires. Each sounds as the camera passes it: brightness and
    // shimmer envelope peak at the wire's center on the camera path.
    for (var wi = 0; wi < WIRES.length; wi++) {
      var wr2 = WIRES[wi];
      var shift = (u - 0.5) * wr2.par * rw;
      var ax = rx + wr2.x0 * rw + shift, ay = ry + wr2.y0 * rh;
      var bx = rx + wr2.x1 * rw + shift, by = ry + wr2.y1 * rh;
      var du = (u - wr2.center) / wr2.width;
      var env = Math.exp(-du * du);
      if (env < 0.01) env = 0;

      // Anchor plates and bolts where the wire meets stone.
      ctx.fillStyle = '#232527';
      ctx.fillRect(ax - 5, ay - 3, 10, 6);
      ctx.fillRect(bx - 5, by - 3, 10, 6);
      ctx.beginPath();
      ctx.moveTo(ax + 3, ay);
      ctx.arc(ax, ay, 3, 0, Math.PI * 2);
      ctx.moveTo(bx + 3, by);
      ctx.arc(bx, by, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#8a8f96';
      ctx.fill();

      // Shimmer: closed-form standing wave along the wire, amplitude
      // and glow scaled by the sounding envelope.
      var dx = bx - ax, dy = by - ay;
      var len = Math.sqrt(dx * dx + dy * dy);
      var nx = -dy / len, ny = dx / len;
      var N = 60;
      var pts = [];
      for (var s = 0; s <= N; s++) {
        var f = s / N;
        var off = wr2.amp * env * Math.sin(f * wr2.waves * Math.PI * 2 - wr2.omega * t);
        pts.push([ax + dx * f + nx * off, ay + dy * f + ny * off]);
      }
      // Warm glow pass on the sounding wire.
      if (env > 0.02) {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (var g = 1; g <= N; g++) ctx.lineTo(pts[g][0], pts[g][1]);
        ctx.strokeStyle = 'rgba(242,220,174,' + alpha(0.28 * env) + ')';
        ctx.lineWidth = 5;
        ctx.stroke();
      }
      // Core wire: silver, brightening warm as it sounds.
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var c = 1; c <= N; c++) ctx.lineTo(pts[c][0], pts[c][1]);
      var bright = Math.round(201 + 54 * env);
      ctx.strokeStyle = 'rgb(' + bright + ',' + Math.round(206 + 30 * env) + ',' + Math.round(212 + 6 * env) + ')';
      ctx.lineWidth = env > 0.02 ? 2 : 1.5;
      ctx.stroke();

      // Length marker plate at the first anchor.
      var mx2 = ax + 8, my2 = ay - 22;
      roundRect(mx2, my2, 46, 16, 3);
      ctx.fillStyle = 'rgba(30,32,34,' + alpha(0.85) + ')';
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,205,210,' + alpha(0.5) + ')';
      ctx.lineWidth = 1;
      roundRect(mx2, my2, 46, 16, 3);
      ctx.stroke();
      ctx.fillStyle = '#d7dbe0';
      ctx.font = '11px system-ui, sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(wr2.span + ' m', mx2 + 8, my2 + 9);
    }

    // Title, date and hint plates, drawn on canvas.
    ctx.fillStyle = '#d7dbe0';
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('ROOM AS SCORE', rx + 18, ry + rh - 44);
    ctx.fillStyle = '#9aa0a6';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText('2006 · 12 · 25', rx + 18, ry + rh - 28);
    ctx.fillStyle = '#7d8085';
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillText('WATCH ONLY', rx + 18, ry + rh - 14);
  }

  // One synchronous frame at load: t = 60 s, fixed phase.
  draw(60);

  if (reduced) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = 60 + (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }

  function onResize() { draw(currentT); }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
