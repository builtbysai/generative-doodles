<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.234 Slow Mathematics</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F7F4EC; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.234 Slow Mathematics (Matthew Kluber). After the 2026 work of
// that name and the 2012 untitled blues: the quietest Kluber. Thin
// black and light blue stripes on paper, the pattern split into two
// unequal sections, two fifths and three fifths, and a solid black
// band cutting across the bottom third. A single red line redraws
// itself continuously along the stripe boundaries, one edge at a
// time, a full pass every seventy five seconds: the slow
// mathematics of the piece made visible. A tap reseeds the line's
// path, crossfading to a new proof over one second; the page never
// reloads. Otherwise there is nothing to do but watch it draw.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var BLACK = '#141414', BLUE = '#9FD4E8', RED = '#E03131', PAPER = '#F7F4EC';
var W = 0, H = 0, phone = false;
var T = 0, lastNow = -1;
var PASS = 75; // seconds per full pass of the red line

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

var SEAM = 0.4;       // left section 2/5, right section 3/5
var BANDTOP = 2 / 3;  // stripes above, solid black band below

function genStripes(rnd) {
  var arr = [], y = 0, i = 0;
  while (y < BANDTOP) {
    var h = 0.014 + rnd() * 0.030;
    if (y + h > BANDTOP) h = BANDTOP - y;
    arr.push({ y: y, h: h, color: (i % 2 === 0) ? BLACK : BLUE });
    y += h; i++;
  }
  return arr;
}

function boundsOf(stripes) {
  var b = [0];
  for (var i = 0; i < stripes.length; i++) b.push(stripes[i].y + stripes[i].h);
  return b;
}

// one state = one seeded layout + one red proof path along its edges
function genState(seed, startT) {
  var rnd = mulberry32(seed);
  var sL = genStripes(rnd), sR = genStripes(rnd);
  var bL = boundsOf(sL), bR = boundsOf(sR);
  // path: start on a left-section edge, run right, stepping vertically
  // from edge to edge; cross the black band's top edge once on the way.
  var pts = [];
  var y = bL[1 + Math.floor(rnd() * (bL.length - 2))];
  var x = 0;
  pts.push([0, y]);
  var usedBandTop = false;
  while (x < 1) {
    var nx = Math.min(1, x + 0.08 + rnd() * 0.22);
    pts.push([nx, y]);
    if (nx >= 1) break;
    var bounds = (nx < SEAM) ? bL : bR;
    var ny;
    if (!usedBandTop && nx > 0.5) { ny = BANDTOP; usedBandTop = true; }
    else {
      ny = bounds[Math.floor(rnd() * bounds.length)];
      var guard = 0;
      while (ny === y && guard++ < 8) ny = bounds[Math.floor(rnd() * bounds.length)];
    }
    pts.push([nx, ny]);
    y = ny; x = nx;
  }
  return { stripesL: sL, stripesR: sR, pts: pts, startT: startT };
}

var seed = 7;
var state = genState(seed, -25); // frame one: the line a third of its pass in
var prevState = null, fadeStart = -10;

function panel() {
  var pw = W * (phone ? 1 : 0.94);
  var ph = pw / 2;
  if (ph > H * 0.94) { ph = H * 0.94; pw = ph * 2; }
  return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph };
}

function drawState(st, alpha) {
  var p = panel();
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
  ctx.fillStyle = PAPER;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  var i, s;
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, p.y, p.w * SEAM, p.h); ctx.clip();
  for (i = 0; i < st.stripesL.length; i++) {
    s = st.stripesL[i];
    ctx.fillStyle = s.color;
    ctx.fillRect(p.x, p.y + s.y * p.h, p.w, s.h * p.h + 1);
  }
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x + p.w * SEAM, p.y, p.w * (1 - SEAM), p.h); ctx.clip();
  for (i = 0; i < st.stripesR.length; i++) {
    s = st.stripesR[i];
    ctx.fillStyle = s.color;
    ctx.fillRect(p.x, p.y + s.y * p.h, p.w, s.h * p.h + 1);
  }
  ctx.restore();
  // the solid black band across the bottom third
  ctx.fillStyle = BLACK;
  ctx.fillRect(p.x, p.y + BANDTOP * p.h, p.w, (1 - BANDTOP) * p.h);
  // the red line, drawn up to the current point of its pass
  var frac = (((T - st.startT) % PASS) + PASS) % PASS / PASS;
  var pts = st.pts, px = [], cum = [0], total = 0;
  for (i = 0; i < pts.length; i++) px.push([p.x + pts[i][0] * p.w, p.y + pts[i][1] * p.h]);
  for (i = 1; i < px.length; i++) {
    total += Math.abs(px[i][0] - px[i - 1][0]) + Math.abs(px[i][1] - px[i - 1][1]);
    cum.push(total);
  }
  var target = frac * total;
  ctx.strokeStyle = RED;
  ctx.lineWidth = Math.max(1.6, p.h * 0.006);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(px[0][0], px[0][1]);
  for (i = 1; i < px.length; i++) {
    if (cum[i] <= target) { ctx.lineTo(px[i][0], px[i][1]); continue; }
    var segLen = cum[i] - cum[i - 1];
    var f = segLen > 0 ? (target - cum[i - 1]) / segLen : 0;
    ctx.lineTo(px[i - 1][0] + (px[i][0] - px[i - 1][0]) * f,
               px[i - 1][1] + (px[i][1] - px[i - 1][1]) * f);
    break;
  }
  ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  if (prevState && T - fadeStart < 1) {
    drawState(prevState, 1);
    drawState(state, Math.min(1, (T - fadeStart) / 1));
  } else {
    prevState = null;
    drawState(state, 1);
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- tap to reseed (never a reload) -------------------------------------------------------
var downT = 0, downX = 0, downY = 0;
canvas.addEventListener('pointerdown', function (e) {
  downT = performance.now(); downX = e.clientX; downY = e.clientY;
});
canvas.addEventListener('pointerup', function (e) {
  var dt = performance.now() - downT;
  var moved = Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
  if (dt < 500 && moved < 12) {
    prevState = state;
    seed = seed * 31 + 17;
    state = genState(seed, T);
    fadeStart = T;
  }
});

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
