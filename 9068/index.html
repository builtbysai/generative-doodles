<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9068 · Quarry</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#efe6cf; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(74,62,42,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(239,230,207,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another quarry</div>
<script>
'use strict';
// No9068 Quarry.
// A cut face read from above: nested irregular polygons, each one the
// bench line of the next cut down. Every level is a closed polygon whose
// radius is a low-harmonic wobble of angle, sampled at just ten vertices so every bench stays faceted, with the wobble phases shared
// loosely between neighbors, so benches roughly parallel each other
// without ever matching. Levels are filled from a mineral palette walked
// in small steps; a thin shadow line under each bench gives the stack
// its depth. The deepest polygon is a small dark pit. Composition is
// measured: the outer bench must be genuinely irregular (vertex radius
// ratio above 1.25) or the seed is rejected, because a regular polygon
// stack reads as a diagram, not a quarry.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9068', 10) || 9068;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const PALETTE = ['#e9dfc6', '#d9c08f', '#bf9257', '#a06a38', '#7c4f2c',
                 '#5d6157', '#3f574e', '#2b4238'];
const PIT = '#1e2420';
const SEAM = 'rgba(30,26,20,0.35)';
const SEG = 10;

function compose(s) {
  const rnd = mulberry32(s);
  const L = 20 + ((rnd() * 8) | 0);              // 20..27 benches
  const cxo = (rnd() - 0.5) * 0.06, cyo = (rnd() - 0.5) * 0.06;

  // Shared angular wobble: 2 and 3 harmonics, phases drift slowly by level.
  const A2 = 0.10 + rnd() * 0.10, A3 = 0.05 + rnd() * 0.06;
  const p2 = rnd() * Math.PI * 2, p3 = rnd() * Math.PI * 2;
  const drift = (rnd() - 0.5) * 1.2;

  // Radii: from 0.97 down to about 0.07, slightly uneven steps.
  const radii = new Float64Array(L);
  let r = 0.97;
  const stepBase = (0.97 - 0.07) / L;
  for (let i = 0; i < L; i++) { radii[i] = r; r -= stepBase * (0.75 + rnd() * 0.55); }

  const jit = 0.05 + rnd() * 0.05;
  const pts = [];
  for (let i = 0; i < L; i++) {
    const f = i / (L - 1);
    const q2 = p2 + drift * f + (rnd() - 0.5) * 2 * jit;
    const q3 = p3 - drift * 0.7 * f + (rnd() - 0.5) * 2 * jit;
    const ring = new Float64Array(SEG * 2);
    for (let k = 0; k < SEG; k++) {
      const t = (k / SEG) * Math.PI * 2;
      const rr = radii[i] * (1 + A2 * (1 - f * 0.45) * Math.sin(2 * t + q2) + A3 * Math.sin(3 * t + q3));
      ring[k * 2] = cxo + rr * Math.cos(t);
      ring[k * 2 + 1] = cyo + rr * Math.sin(t);
    }
    pts.push(ring);
  }

  // Irregularity of the outer bench: vertex radius ratio.
  let mn = Infinity, mx = -Infinity;
  for (let k = 0; k < SEG; k++) {
    const d = Math.hypot(pts[0][k * 2] - cxo, pts[0][k * 2 + 1] - cyo);
    if (d < mn) mn = d;
    if (d > mx) mx = d;
  }
  const irregularity = mx / mn;

  // Palette walk downward, no identical neighbors.
  const colors = [];
  let ci = (rnd() * 2) | 0;
  for (let i = 0; i < L; i++) {
    if (i > 0 && PALETTE[ci] === colors[i - 1]) ci = ci < PALETTE.length - 1 ? ci + 1 : ci - 1;
    colors.push(PALETTE[ci]);
    let step = ((rnd() * 3) | 0) - 1;
    if (rnd() < (i / L) * 0.3) step += 1;
    ci = Math.max(0, Math.min(PALETTE.length - 1, ci + step));
  }

  // Max extent for margin fitting.
  let maxExt = 0;
  for (let i = 0; i < L; i++) for (let k = 0; k < SEG; k++) {
    const e = Math.hypot(pts[i][k * 2], pts[i][k * 2 + 1]);
    if (e > maxExt) maxExt = e;
  }
  return { L, pts, colors, irregularity, maxExt };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best || p.irregularity > best.irregularity) best = p;
    if (p.irregularity > 1.25) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Portrait: the bone ground fills the viewport so the centered square
  // reads as a print on paper, not a tile adrift in black.
  ctx.fillStyle = '#efe6cf';
  ctx.fillRect(0, 0, w, h);
  const S = Math.min(w, h);
  const ox = (w - S) / 2, oy = (h - S) / 2;
  const cx = ox + S / 2, cy = oy + S / 2;

  if (!piece) piece = buildPiece(seed);
  const p = piece;
  const toX = (nx) => cx + nx * (S * 0.47) / p.maxExt;
  const toY = (ny) => cy + ny * (S * 0.47) / p.maxExt;

  // Ground: bone square.
  ctx.fillStyle = '#efe6cf';
  ctx.fillRect(ox, oy, S, S);
  ctx.save();
  ctx.beginPath(); ctx.rect(ox, oy, S, S); ctx.clip();

  for (let i = 0; i < p.L; i++) {
    const ring = p.pts[i];
    ctx.beginPath();
    for (let k = 0; k < SEG; k++) {
      const x = toX(ring[k * 2]), y = toY(ring[k * 2 + 1]);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = i === p.L - 1 ? PIT : p.colors[i];
    ctx.fill();
    ctx.strokeStyle = SEAM;
    ctx.lineWidth = Math.max(1, S / 900);
    ctx.stroke();
  }

  const rnd = mulberry32((seed ^ 0x27d4eb) >>> 0);
  for (let g = 0; g < 2000; g++) {
    const x = ox + rnd() * S, y = oy + rnd() * S;
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(30,26,20,0.05)' : 'rgba(240,233,214,0.04)';
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
