<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9068 Meridian · Generative Doodles</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#101318; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(214,222,232,0.38); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.7); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another meridian</div>
<script>
'use strict';
// No9068 Meridian.
// Meridians run top to bottom and bend around a few slow vortices,
// the way iron filings bend around magnets. Line tone follows how far
// each line strays: the strays burn warmer. Every seed is checked so
// the field has both calm lanes and at least one hard bend in it.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9068', 10) || 9068;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}

const ctx = canvas.getContext('2d');

const GROUND = '#101318';
const COOL = [182, 196, 210];   // calm line tone
const WARM = [214, 138, 84];    // strayed line tone

function compose(s) {
  const rnd = mulberry32(s);
  const K = 3 + ((rnd() * 3) | 0);              // 3..5 vortices
  const vort = [];
  for (let i = 0; i < K; i++) {
    vort.push({
      x: 0.15 + rnd() * 0.7,
      y: 0.15 + rnd() * 0.7,
      str: (0.16 + rnd() * 0.30) * (rnd() < 0.5 ? -1 : 1),
      rad: 0.10 + rnd() * 0.16
    });
  }
  return { vort, ok: true };
}

// Horizontal displacement of the meridian starting at x0, at height y.
// Smooth S-bend around each vortex: zero at its heart, pushing one way
// above and the other below, fading with distance. No kinks.
function displace(p, x0, y) {
  let dx = 0;
  for (const v of p.vort) {
    const ddx = x0 - v.x, ddy = y - v.y;
    const d2 = ddx * ddx + ddy * ddy;
    dx += v.str * (ddy / v.rad) * Math.exp(-d2 / (v.rad * v.rad));
  }
  return dx;
}

function buildPiece(baseSeed) {
  let best = null, bestScore = -1;
  for (let attempt = 0; attempt < 24; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    // Score: want a spread of displacements (calm lanes + hard bends).
    const rnd = mulberry32((baseSeed + attempt) >>> 0);
    let mx = 0;
    for (let i = 0; i < 40; i++) {
      const x0 = rnd();
      for (let k = 0; k <= 8; k++) mx = Math.max(mx, Math.abs(displace(p, x0, k / 8)));
    }
    if (mx > bestScore) { bestScore = mx; best = p; }
    if (mx > 0.16) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: use the physical screen size, not the viewport aspect.
  // The viewport can lie (desktop-site mode, pinch state, URL-bar flux)
  // but screen.width always reports the real device.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  ctx.save();
  ctx.beginPath(); ctx.rect(ox, oy, RX, RY); ctx.clip();

  const M = 110;                 // meridians
  const STEPS = 120;
  ctx.lineWidth = Math.max(1, RX / 640);
  for (let i = 0; i < M; i++) {
    const x0 = (i + 0.5) / M;
    let mx = 0;
    const pts = [];
    for (let k = 0; k <= STEPS; k++) {
      const y = k / STEPS;
      const dx = displace(p, x0, y);
      if (Math.abs(dx) > mx) mx = Math.abs(dx);
      pts.push([ox + (x0 + dx) * RX, oy + y * RY]);
    }
    const t = Math.min(1, mx / 0.22);
    const r = Math.round(COOL[0] + (WARM[0] - COOL[0]) * t);
    const g = Math.round(COOL[1] + (WARM[1] - COOL[1]) * t);
    const b = Math.round(COOL[2] + (WARM[2] - COOL[2]) * t);
    ctx.strokeStyle = `rgba(${r},${g},${b},${0.34 + t * 0.30})`;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.stroke();
  }

  // Restrained grain.
  const rnd = mulberry32((seed ^ 0x51ab3c) >>> 0);
  for (let g = 0; g < 2200; g++) {
    const x = ox + rnd() * RX, y = oy + rnd() * RY;
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(6,8,12,0.06)' : 'rgba(214,222,232,0.04)';
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
