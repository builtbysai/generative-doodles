<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.264 Winter Warrior</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#9AA0A3; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.264 Winter Warrior (Stanzin Tsepel). After his 2022
// bronze pair: a lone winter figure in heavy clothes and
// a big rounded fur hat, hands clasped, standing frontal
// on rough rock under a plain overcast sky. Monumental
// and still. Almost nothing moves: a slow breathing rise
// and fall over 30 seconds, and now and then a small
// wisp of breath fog. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var BRONZE = '#4A3220', HIGH = '#8A6B42', ROCK = '#55534E', SNOW = '#EDEFF0', SKY = '#9AA0A3';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var T = 5.0, lastNow = -1; // frame one: mid breath, one wisp just leaving

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- the rocky ground: a craggy displaced ridge line ---------------------------
var ridge = [];
(function () {
  var r = rng(26411);
  for (var x = 0; x <= DW; x += 32) ridge.push({ x: x, y: 716 + (r() - 0.5) * 26 - Math.max(0, 130 - Math.abs(x - 640)) * 0.12 });
})();
// snow patches settled on the rock
var patches = [];
(function () {
  var r = rng(26423);
  for (var i = 0; i < 16; i++) patches.push({ x: 40 + r() * (DW - 80), y: 742 + r() * 130, rx: 18 + r() * 46, ry: 4 + r() * 7, a: 0.35 + r() * 0.4 });
})();
// the bronze's rough surface: seeded flecks held per body part
function flecks(seed, n, xFn, yFn) {
  var r = rng(seed), out = [];
  for (var i = 0; i < n; i++) out.push({ x: xFn(r), y: yFn(r), s: 1 + r() * 2.6, a: 0.05 + r() * 0.1, lite: r() < 0.55 });
  return out;
}
var coatFlecks = flecks(26437, 210,
  function (r) { return (r() * 2 - 1) * 104; },
  function (r) { return -392 + r() * 245; });
var hatFlecks = flecks(26449, 60,
  function (r) { return (r() * 2 - 1) * 40; },
  function (r) { return -508 + r() * 34; });

// ---- the figure ------------------------------------------------------------------
// local space: origin at the feet, ground line y = 0, up is negative
function drawFigure() {
  var breath = 1 + 0.012 * Math.sin(T * Math.PI * 2 / 30);
  ctx.save();
  ctx.translate(640, 716);
  ctx.scale(1, breath);
  // legs and boots
  ctx.fillStyle = BRONZE;
  ctx.beginPath(); ctx.moveTo(-58, -152); ctx.lineTo(-13, -152); ctx.lineTo(-17, -14); ctx.lineTo(-63, -14); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13, -152); ctx.lineTo(58, -152); ctx.lineTo(63, -14); ctx.lineTo(17, -14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = mix(BRONZE, ROCK, 0.35);
  ctx.fillRect(-68, -16, 56, 16); ctx.fillRect(12, -16, 56, 16);
  // the great coat
  ctx.fillStyle = BRONZE;
  ctx.beginPath();
  ctx.moveTo(-102, -398);
  ctx.lineTo(102, -398);
  ctx.lineTo(126, -196);
  ctx.lineTo(112, -140);
  ctx.lineTo(-112, -140);
  ctx.lineTo(-126, -196);
  ctx.closePath(); ctx.fill();
  // shadow settles on the right half, a lit fold on the left
  ctx.fillStyle = rgba(ROCK, 0.16);
  ctx.beginPath(); ctx.moveTo(6, -398); ctx.lineTo(102, -398); ctx.lineTo(126, -196); ctx.lineTo(112, -140); ctx.lineTo(4, -140); ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(HIGH, 0.10);
  ctx.beginPath(); ctx.moveTo(-88, -390); ctx.lineTo(-58, -390); ctx.lineTo(-66, -160); ctx.lineTo(-96, -160); ctx.closePath(); ctx.fill();
  // arms running down to the clasp
  ctx.fillStyle = BRONZE;
  ctx.beginPath(); ctx.moveTo(-102, -392); ctx.lineTo(-76, -380); ctx.lineTo(-22, -252); ctx.lineTo(-44, -238); ctx.lineTo(-104, -330); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(102, -392); ctx.lineTo(76, -380); ctx.lineTo(22, -252); ctx.lineTo(44, -238); ctx.lineTo(104, -330); ctx.closePath(); ctx.fill();
  // clasped hands
  ctx.fillStyle = rgba(HIGH, 0.9);
  ctx.save(); ctx.translate(-9, -240); ctx.rotate(0.35);
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 10.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(10, -238); ctx.rotate(-0.3);
  ctx.beginPath(); ctx.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.strokeStyle = rgba(BRONZE, 0.8);
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0, -250); ctx.lineTo(1, -230); ctx.stroke();
  // the coat's rough bronze skin
  for (var i = 0; i < coatFlecks.length; i++) {
    var f = coatFlecks[i];
    ctx.fillStyle = f.lite ? rgba(HIGH, f.a) : rgba(ROCK, f.a);
    ctx.fillRect(f.x, f.y, f.s, f.s * 0.7);
  }
  // face, mostly in shadow under the hat
  ctx.fillStyle = mix(BRONZE, HIGH, 0.28);
  ctx.beginPath(); ctx.ellipse(0, -446, 29, 35, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(BRONZE, 0.55);
  ctx.beginPath(); ctx.ellipse(3, -430, 24, 18, 0, 0, Math.PI); ctx.fill(); // the jaw shadow
  // the big rounded fur hat
  ctx.fillStyle = mix(BRONZE, HIGH, 0.38);
  ctx.beginPath();
  ctx.moveTo(-46, -472);
  ctx.quadraticCurveTo(-48, -522, 0, -524);
  ctx.quadraticCurveTo(48, -522, 46, -472);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = BRONZE;
  ctx.fillRect(-49, -480, 98, 15); // the brim band
  for (var j = 0; j < hatFlecks.length; j++) {
    var hf = hatFlecks[j];
    ctx.fillStyle = hf.lite ? rgba(HIGH, hf.a + 0.04) : rgba(BRONZE, hf.a + 0.05);
    ctx.fillRect(hf.x, hf.y, hf.s, hf.s * 0.7);
  }
  // rim light down the right silhouette
  ctx.strokeStyle = rgba(HIGH, 0.75);
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(45, -478);
  ctx.quadraticCurveTo(52, -440, 40, -408);
  ctx.lineTo(104, -386);
  ctx.lineTo(124, -200);
  ctx.stroke();
  // a dusting of snow on hat and shoulders
  ctx.fillStyle = rgba(SNOW, 0.75);
  ctx.beginPath(); ctx.ellipse(-12, -520, 22, 5, -0.06, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-84, -400, 17, 4, 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(86, -398, 14, 3.6, -0.08, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---- breath fog --------------------------------------------------------------------
var wisps = [{ off: 0 }, { off: 3.3 }, { off: 6.6 }];
function drawWisps() {
  for (var i = 0; i < wisps.length; i++) {
    var age = (T + wisps[i].off) % 10;
    if (age > 4.2) continue;
    var a = 0.15 * (1 - age / 4.2);
    var cx = 674 + age * 17, cy = 258 - age * 8;
    ctx.fillStyle = rgba(SNOW, a);
    ctx.beginPath(); ctx.arc(cx, cy, 5 + age * 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 9 + age * 4, cy + 3, (5 + age * 6.5) * 0.66, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx - 8, cy + 4, (5 + age * 6.5) * 0.5, 0, Math.PI * 2); ctx.fill();
  }
}

function draw() {
  // plain overcast sky: two flat greys, no weather in it
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, DW, DH);
  ctx.fillStyle = rgba(ROCK, 0.13);
  ctx.fillRect(0, 545, DW, 190);
  // the craggy rock base
  ctx.fillStyle = ROCK;
  ctx.beginPath();
  ctx.moveTo(-10, DH + 10);
  ctx.lineTo(-10, ridge[0].y);
  for (var i = 0; i < ridge.length; i++) ctx.lineTo(ridge[i].x, ridge[i].y);
  ctx.lineTo(DW + 10, DH + 10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(BRONZE, 0.18);
  ctx.beginPath(); ctx.ellipse(640, 730, 185, 17, 0, 0, Math.PI * 2); ctx.fill(); // contact shadow
  for (var p = 0; p < patches.length; p++) {
    var pa = patches[p];
    ctx.fillStyle = rgba(SNOW, pa.a);
    ctx.beginPath(); ctx.ellipse(pa.x, pa.y, pa.rx, pa.ry, 0, 0, Math.PI * 2); ctx.fill();
  }
  drawFigure();
  drawWisps();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, H);
  // contain-fit: the figure keeps its shape, centred, on its own sky grey
  var S = Math.min(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
