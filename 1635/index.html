<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>String Theories</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EDE3; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F2EDE3';
var INK = '#2B2B28';
var RED = '#C8102E';
var SEED = 1635007;
/* Frame one is at t = 9 s into the migration cycle: the crossing field
   already holds formed moire, and the red accent is near its peak. */
var PHASE = 9;
/* Anchor migration breathes on slow LFOs with seeded periods of 40 to
   70 s; the crossing forms appear, dissolve, and reappear over roughly
   a 48 s breath. The red accent fades in and out on a 24 s cycle. */
var RED_S = 24;
var N_LEFT = 22, N_RIGHT = 22;
/* 240 straight strings, asserted below: 150 cross-cluster, 45 left
   intra-cluster, 45 right intra-cluster. 12 of the cross strings are
   the violent red accent. */
var N_CROSS = 150, N_INTRA = 45, N_ACCENT = 12;
var N_STRINGS = N_CROSS + N_INTRA + N_INTRA;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var INK_RGB = hexRgb(INK);
var RED_RGB = hexRgb(RED);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Landscape field: full-bleed on phones, a centred landscape band on
   desktop with the page ground the piece's own paper. */
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var h = VH * 0.80;
  var w = Math.min(VW * 0.94, h * 1.6);
  return { x: (VW - w) / 2, y: (VH - h) / 2, w: w, h: h };
}
/* ---- anchors: two loose clusters, left and right ---- */
function gauss3(rng) { return (rng() + rng() + rng()) / 3 - 0.5; }
var anchors = [];
(function buildAnchors() {
  var rng = mulberry32(SEED);
  var i;
  for (i = 0; i < N_LEFT + N_RIGHT; i++) {
    var left = i < N_LEFT;
    /* Clusters sit at different heights so the cross strings fan
       diagonally and cross at varied angles instead of running
       parallel: the centre becomes a real crossing field. */
    var cx = left ? 0.26 : 0.74;
    var cy = left ? 0.46 : 0.58;
    /* Uniform scatter so the clusters fill the band instead of
       bunching at their centres; the bulk of the strings then spans
       the full height of the field. */
    var spreadX = 0.12, spreadY = 0.32;
    anchors.push({
      bx: cx + (rng() * 2 - 1) * spreadX,
      by: cy + (rng() * 2 - 1) * spreadY,
      ax1: 0.010 + rng() * 0.018, px1: 40 + rng() * 30, ph1: rng() * TAU,
      ax2: 0.006 + rng() * 0.010, px2: 55 + rng() * 25, ph2: rng() * TAU,
      ay1: 0.015 + rng() * 0.025, py1: 42 + rng() * 28, qh1: rng() * TAU,
      ay2: 0.008 + rng() * 0.012, py2: 58 + rng() * 22, qh2: rng() * TAU,
      dx: 0, dy: 0, vx: 0, vy: 0
    });
  }
})();
/* ---- strings: straight segments between seeded anchor pairs ---- */
var strings = [];
(function buildStrings() {
  var rng = mulberry32(SEED + 77);
  var i, a, b;
  function add(aIdx, bIdx, accent) {
    strings.push({
      a: aIdx, b: bIdx,
      alpha: 0.14 + rng() * 0.16,
      slack: 0.5 + rng(),
      accent: accent
    });
  }
  for (i = 0; i < N_CROSS; i++) {
    add(Math.floor(rng() * N_LEFT), N_LEFT + Math.floor(rng() * N_RIGHT), i < N_ACCENT);
  }
  for (i = 0; i < N_INTRA; i++) {
    a = Math.floor(rng() * N_LEFT);
    b = Math.floor(rng() * N_LEFT);
    if (a === b) b = (b + 1) % N_LEFT;
    add(a, b, false);
  }
  for (i = 0; i < N_INTRA; i++) {
    a = N_LEFT + Math.floor(rng() * N_RIGHT);
    b = N_LEFT + Math.floor(rng() * N_RIGHT);
    if (a === b) b = N_LEFT + ((b - N_LEFT + 1) % N_RIGHT);
    add(a, b, false);
  }
})();
/* Anchor position in canvas pixels at time t: base plus slow LFO drift
   plus the spring displacement left by dragging. Pure function of t
   while nothing has been plucked, so frame one is reproducible. */
function anchorPos(i, t, rect) {
  var an = anchors[i];
  var x = an.bx + an.ax1 * Math.sin(TAU * t / an.px1 + an.ph1)
              + an.ax2 * Math.sin(TAU * t / an.px2 + an.ph2);
  var y = an.by + an.ay1 * Math.sin(TAU * t / an.py1 + an.qh1)
              + an.ay2 * Math.sin(TAU * t / an.py2 + an.qh2);
  return [rect.x + x * rect.w + an.dx, rect.y + y * rect.h + an.dy];
}
function redAlpha(t) {
  var c = 0.5 - 0.5 * Math.cos(TAU * t / RED_S);
  return 0.05 + 0.60 * Math.pow(c, 1.5);
}
/* ---- drag: pluck the field, springs relax it back ---- */
var dragging = false, lastPX = 0, lastPY = 0;
function pluck(px, py, dx, dy, rect) {
  var R = Math.max(120, Math.min(rect.w, rect.h) * 0.45);
  var i;
  for (i = 0; i < anchors.length; i++) {
    var p = anchorPos(i, lastT, rect);
    var ddx = p[0] - px, ddy = p[1] - py;
    var d = Math.sqrt(ddx * ddx + ddy * ddy);
    if (d >= R) continue;
    var fall = 1 - d / R;
    anchors[i].vx = clamp(anchors[i].vx + dx * fall * 3.0, -400, 400);
    anchors[i].vy = clamp(anchors[i].vy + dy * fall * 3.0, -400, 400);
  }
}
function springStep(dt) {
  var k = 14, c = 4.5, i, an;
  for (i = 0; i < anchors.length; i++) {
    an = anchors[i];
    an.vx += (-k * an.dx - c * an.vx) * dt;
    an.vy += (-k * an.dy - c * an.vy) * dt;
    an.dx = clamp(an.dx + an.vx * dt, -120, 120);
    an.dy = clamp(an.dy + an.vy * dt, -120, 120);
  }
}
function onPointerDown(e) {
  dragging = true;
  lastPX = e.clientX; lastPY = e.clientY;
}
function onPointerMove(e) {
  if (!dragging) return;
  var dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
  if (dx === 0 && dy === 0) return;
  pluck(e.clientX, e.clientY, dx, dy, compRect());
}
function onPointerUp() { dragging = false; }
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
/* ---- drawing: straight segments only, no curve calls anywhere ---- */
function drawStrings(t, rect) {
  var i, s, pa, pb, a;
  /* Charcoal strings under multiply: crossings accumulate toward black,
     so line density alone becomes form. */
  ctx.globalCompositeOperation = 'multiply';
  ctx.lineCap = 'butt';
  for (i = 0; i < strings.length; i++) {
    s = strings[i];
    if (s.accent) continue;
    pa = anchorPos(s.a, t, rect);
    pb = anchorPos(s.b, t, rect);
    a = s.alpha * (0.75 + 0.25 * s.slack);
    ctx.strokeStyle = rgba(INK_RGB, a);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(pa[0], pa[1]);
    ctx.lineTo(pb[0], pb[1]);
    ctx.stroke();
  }
  /* The violent red accent rides on top in source-over so it stays
     red, fading in and out on its 24 s cycle. */
  ctx.globalCompositeOperation = 'source-over';
  var ra = redAlpha(t);
  for (i = 0; i < strings.length; i++) {
    s = strings[i];
    if (!s.accent) continue;
    pa = anchorPos(s.a, t, rect);
    pb = anchorPos(s.b, t, rect);
    ctx.strokeStyle = rgba(RED_RGB, ra);
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(pa[0], pa[1]);
    ctx.lineTo(pb[0], pb[1]);
    ctx.stroke();
  }
  /* Anchor points as small flat squares, the pegs the strings hang on. */
  ctx.fillStyle = rgba(INK_RGB, 0.55);
  for (i = 0; i < anchors.length; i++) {
    pa = anchorPos(i, t, rect);
    ctx.fillRect(pa[0] - 1.5, pa[1] - 1.5, 3, 3);
  }
}
function drawText(rect) {
  var titlePx = isPhone ? 18 : 20;
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var titleW = ctx.measureText('String Theories').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 04').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = cxm - plateW / 2, plateY = rect.y + 10;
  ctx.fillStyle = PAPER;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.25);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('String Theories', cxm, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.75);
  ctx.fillText('2006 · 07 · 04', cxm, plateY + 7 + titlePx + 3);
  var hint = 'Drag to pluck the strings.';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cxm - hintPlateW / 2;
  var hintPlateY = rect.y + rect.h - hintPlateH - 10;
  ctx.fillStyle = PAPER;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.25);
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(INK_RGB, 0.85);
  ctx.fillText(hint, cxm, hintPlateY + 7);
}
var lastT = PHASE, prevTs = null;
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  if (!isPhone) {
    ctx.strokeStyle = rgba(INK_RGB, 0.35);
    ctx.lineWidth = 1;
    ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1);
  }
  drawStrings(t, rect);
  drawText(rect);
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only: counts, anchor positions,
   red-cycle value, and live spring displacement. */
if (typeof window !== 'undefined') {
  window.__probe = {
    stringCount: function () { return strings.length; },
    crossCount: function () { var n = 0, i; for (i = 0; i < strings.length; i++) if (strings[i].a < N_LEFT && strings[i].b >= N_LEFT) n++; return n; },
    accentCount: function () { var n = 0, i; for (i = 0; i < strings.length; i++) if (strings[i].accent) n++; return n; },
    anchor: function (i, t) { return anchorPos(i, t, compRect()); },
    anchorCount: function () { return anchors.length; },
    red: function (t) { return redAlpha(t); },
    disp: function (i) { var an = anchors[i]; return Math.sqrt(an.dx * an.dx + an.dy * an.dy); },
    maxDisp: function () { var m = 0, i; for (i = 0; i < anchors.length; i++) { var d = this.disp(i); if (d > m) m = d; } return m; },
    drawAt: function (t) { draw(t); },
    step: function (dt) { springStep(dt); }
  };
}
/* ---- frame one: fixed phase, fixed seed, no wall clock ---- */
size();
if (reduced) {
  draw(PHASE);
} else {
  draw(PHASE);
  if (typeof requestAnimationFrame !== 'undefined') {
    (function loop(ts) {
      if (prevTs === null) prevTs = ts;
      var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
      prevTs = ts;
      springStep(dt);
      var t = PHASE + (ts - (loop.t0 === undefined ? (loop.t0 = ts) : loop.t0)) / 1000;
      draw(t);
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
    })(0);
  }
}
</script>
</body>
</html>
