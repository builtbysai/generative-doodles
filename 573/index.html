<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario de Mi Vida</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#F5F0E0; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var INK = '#1A1A1A', PAPER = '#F5F0E0', WASH = '#A8A49A', PINK = '#E86A9A';

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rng = mulberry32(573069);

/* ---------- precomputed paper speckle (seeded data, drawn directly) ---------- */
var speckles = [];
for (var si = 0; si < 240; si++){
  speckles.push({ x: rng()*1000, y: rng()*1000, r: 0.8 + rng()*1.4, a: 0.03 + rng()*0.06, g: rng() < 0.5 });
}

/* ---------- geometry helpers ---------- */
function seg(x1,y1,x2,y2,n){ var p=[],i; for(i=0;i<=n;i++) p.push([x1+(x2-x1)*i/n, y1+(y2-y1)*i/n]); return p; }
function rectP(x,y,w,h){ return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]]; }
function circP(cx,cy,r,n){ var p=[],i,a; n=n||24; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function ellP(cx,cy,rx,ry,n){ var p=[],i,a; n=n||26; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); } return p; }
function wavyV(x,y1,y2,amp,per){ var p=[],y; for(y=y1;y<=y2;y+=8) p.push([x+Math.sin((y-y1)/per*Math.PI*2)*amp, y]); p.push([x+Math.sin((y2-y1)/per*Math.PI*2)*amp, y2]); return p; }
function wavyH(x1,x2,y,amp,per){ var p=[],x; for(x=x1;x<=x2;x+=8) p.push([x, y+Math.sin((x-x1)/per*Math.PI*2)*amp]); p.push([x2, y+Math.sin((x2-x1)/per*Math.PI*2)*amp]); return p; }
function leafP(bx,by,angDeg,len,wid){ var a=angDeg*Math.PI/180, dx=Math.cos(a), dy=Math.sin(a), px=-dy, py=dx, p=[],i,t,w; for(i=0;i<=6;i++){ t=i/6; w=Math.sin(t*Math.PI)*wid; p.push([bx+dx*len*t+px*w, by+dy*len*t+py*w]); } for(i=6;i>=0;i--){ t=i/6; w=Math.sin(t*Math.PI)*wid; p.push([bx+dx*len*t-px*w, by+dy*len*t-py*w]); } return p; }
function cat(){ var pts=[], a, b, k; for(k=0;k<arguments.length;k++){ a=arguments[k]; for(var i=0;i<a.length;i++) pts.push(a[i]); } return pts; }
function jit(pts, amt){ var out=[],i; for(i=0;i<pts.length;i++) out.push([pts[i][0]+(rng()*2-1)*amt, pts[i][1]+(rng()*2-1)*amt]); return out; }
function S(pts, o){ o = o || {}; var p = jit(pts, o.j !== undefined ? o.j : 1.3); var len=0,i; var n=p.length, lim = o.close ? n : n-1; for(i=1;i<=lim;i++){ var a=p[i-1], b=p[i%n]; len += Math.hypot(b[0]-a[0], b[1]-a[1]); } return { pts:p, w:o.w||3, fill:o.fill||null, close:!!o.close, len:len, curtain:!!o.curtain, tail:!!o.tail }; }

/* ---------- the room (stage 1000x1000) ---------- */
var WALL = { x:326, y:186, w:632, h:442 };           // back wall 326..958 x 186..628
var FL_Y = 628, FB_Y = 866;                          // floor front edge

var items = [];
function addItem(label, lx, ly, lsize, shadow, hit, strokes){
  var total=0,i; for(i=0;i<strokes.length;i++) total += strokes[i].len;
  items.push({ label:label, lx:lx, ly:ly, lsize:lsize, shadow:shadow||null, hit:hit||null,
               strokes:strokes, total:total, dur: Math.max(0.55, Math.min(1.5, total/1500)),
               dx:0, dy:0, checkStart:null });
}

/* 1 — el piso */
(function(){
  var fl = [[326,FL_Y],[958,FL_Y],[996,FB_Y],[288,FB_Y]];
  function lx(y){ return 326 - (y-FL_Y)*(38/238); } function rx(y){ return 958 + (y-FL_Y)*(38/238); }
  addItem('el piso', 862, 808, 25, null, null, [
    S(fl, { close:true, w:3.4 }),
    S(seg(lx(688),688, rx(688),688, 10)),
    S(seg(lx(748),748, rx(748),748, 10)),
    S(seg(lx(808),808, rx(808),808, 10)),
    S(seg(560,FL_Y, 552,748, 3), { w:2.2 }),
    S(seg(762,FL_Y, 770,748, 3), { w:2.2 })
  ]);
})();

/* 2 — las paredes */
(function(){
  addItem('las paredes', 344, 164, 25, null, null, [
    S(rectP(WALL.x, WALL.y, WALL.w, WALL.h), { close:true, w:3.4 }),
    S([[326,186],[288,238],[288,866],[326,628]], { close:true, w:3 }),
    S(seg(326,604, 958,604, 10), { w:2.4 }),
    S(rectP(398,258,118,94), { close:true, w:2.6 }),                                  // framed drawing on the wall
    S([[410,338],[438,300],[458,322],[478,292],[504,338]], { w:2.2 }),                // her mountains, inside the frame
    S(circP(486,282,7,14), { close:true, w:2 })
  ]);
})();

/* 3 — la cama */
(function(){
  addItem('la cama', 458, 700, 26, { cx:502, cy:652, rx:152, ry:15 }, { x:348, y:455, w:325, h:180 }, [
    S([[350,476],[398,468],[398,598],[350,606]], { close:true, w:3.2 }),              // headboard
    S(seg(366,472, 366,602, 3), { w:2.2 }), S(seg(382,470, 382,600, 3), { w:2.2 }),    // headboard slats
    S(seg(346,470, 402,462, 2), { w:3 }),
    S([[388,556],[634,556],[664,602],[402,602]], { close:true, w:3.2 }),              // mattress
    S([[402,532],[472,532],[480,556],[408,556]], { close:true, w:2.6 }),              // pillow
    S(wavyH(402,650,578,3,64), { w:2.4 }),                                            // blanket line
    S(seg(408,602, 408,622, 1), { w:3 }), S(seg(648,602, 648,622, 1), { w:3 })
  ]);
})();

/* 4 — la mesa */
(function(){
  var handle=[], i, a;
  for(i=0;i<=6;i++){ a=(-70 + i*140/6)*Math.PI/180; handle.push([856+Math.cos(a)*6, 584+Math.sin(a)*6]); }
  addItem('la mesa', 706, 760, 26, { cx:778, cy:726, rx:122, ry:13 }, { x:656, y:562, w:262, h:168 }, [
    S([[664,596],[888,596],[914,630],[690,630]], { close:true, w:3.2 }),              // top
    S(seg(716,630, 716,714, 2), { w:3 }), S(seg(878,630, 878,714, 2), { w:3 }),
    S(seg(716,688, 878,688, 4), { w:2.4 }),
    S([[732,574],[800,568],[802,592],[734,598]], { close:true, w:2.6 }),              // book
    S(seg(766,571, 768,595, 1), { w:2 }),
    S(rectP(826,572,26,24), { close:true, w:2.6 }),                                   // mug
    S(handle, { w:2.2 })
  ]);
})();

/* 5 — la planta */
(function(){
  addItem('la planta', 836, 540, 25, { cx:912, cy:722, rx:42, ry:8 }, { x:872, y:536, w:84, h:190 }, [
    S([[886,650],[940,650],[932,714],[894,714]], { close:true, w:3.2 }),              // pot
    S(seg(885,662, 941,662, 2), { w:2.2 }),
    S(seg(913,650, 898,598, 2), { w:2.6 }), S(seg(913,650, 914,586, 2), { w:2.6 }), S(seg(913,650, 930,602, 2), { w:2.6 }),
    S(leafP(898,598,-100,30,9), { close:true, w:2.4 }),
    S(leafP(914,584,-90,34,10), { close:true, w:2.4 }),
    S(leafP(930,602,-68,28,9), { close:true, w:2.4 }),
    S(leafP(905,622,-118,24,8), { close:true, w:2.2 }),
    S(leafP(923,624,-58,24,8), { close:true, w:2.2 })
  ]);
})();

/* 6 — la ventana */
(function(){
  var curtainPts = cat(
    seg(706,238, 788,238, 3),
    wavyV(788,238, 438,2.5,90).slice(1),
    (function(){ var p=wavyH(706,788,442,3,60); p.reverse(); return p.slice(1); })(),
    (function(){ var p=wavyV(706,238,442,2.5,90); p.reverse(); return p.slice(1); })()
  );
  addItem('la ventana', 706, 506, 25, null, { x:672, y:222, w:240, h:252 }, [
    S(rectP(694,248,196,216), { close:true, w:3.4 }),                                 // frame
    S(rectP(708,262,168,188), { close:true, w:2.4 }),                                 // inner frame
    S(seg(792,262, 792,450, 4), { w:2.4 }), S(seg(708,356, 876,356, 4), { w:2.4 }),    // mullions
    S(seg(676,234, 908,234, 6), { w:3 }),                                             // rod
    S(circP(670,234,5,12), { close:true, w:2.2 }), S(circP(914,234,5,12), { close:true, w:2.2 }),
    S(curtainPts, { close:true, w:3, fill:PAPER, curtain:true }),                     // curtain (the sway)
    S(wavyV(728,246, 436,2,80), { w:2, curtain:true }),
    S(wavyV(750,246, 436,2,80), { w:2, curtain:true }),
    S(wavyV(770,246, 436,2,80), { w:2, curtain:true }),
    S(seg(688,470, 896,470, 5), { w:2.6 })                                            // sill
  ]);
})();

/* 7 — el gato */
(function(){
  addItem('el gato', 350, 842, 25, { cx:400, cy:784, rx:50, ry:9 }, { x:344, y:648, w:152, h:142 }, [
    S(ellP(400,738,42,35), { close:true, w:3.2 }),                                    // body
    S(circP(400,690,24), { close:true, w:3.2 }),                                      // head
    S([[380,676],[386,654],[402,672]], { close:true, w:2.8 }),                        // ears
    S([[420,676],[414,654],[398,672]], { close:true, w:2.8 }),
    S(seg(390,691, 397,691, 1), { w:2.4 }), S(seg(403,691, 410,691, 1), { w:2.4 }),    // eyes
    S(seg(397,700, 403,700, 1), { w:2 }),
    S(seg(376,696, 356,692, 1), { w:1.8 }), S(seg(376,704, 357,706, 1), { w:1.8 }),    // whiskers
    S(seg(424,696, 444,692, 1), { w:1.8 }), S(seg(424,704, 443,706, 1), { w:1.8 }),
    S([[436,764],[462,772],[484,766],[492,744],[488,728]], { w:3.4, tail:true })       // the tail (it flicks)
  ]);
})();

/* 8 — mi ropa (her clothes on a chair; the dress is the one pink object) */
(function(){
  addItem('mi ropa', 554, 848, 25, { cx:608, cy:808, rx:64, ry:10 }, { x:540, y:642, w:142, h:170 }, [
    S(seg(568,664, 568,758, 2), { w:3.2 }), S(seg(652,664, 652,758, 2), { w:3.2 }),    // chair back posts
    S(seg(568,664, 652,664, 2), { w:3.2 }), S(seg(568,710, 652,710, 2), { w:2.6 }),    // rails
    S([[560,758],[660,758],[672,780],[548,780]], { close:true, w:3.2 }),              // seat
    S(seg(570,780, 570,804, 1), { w:3 }), S(seg(650,780, 650,804, 1), { w:3 }),
    S([[584,652],[636,652],[642,690],[650,726],[634,742],[620,722],[606,744],[592,724],[578,690]], { close:true, w:3, fill:PINK }), // her dress, pink
    S(rectP(586,738,52,20), { close:true, w:2.4 })                                    // folded shirt on the seat
  ]);
})();

/* 9 — mis zapatos */
(function(){
  function shoe(ox,oy){ return [[ox,oy+22],[ox,oy+8],[ox+6,oy],[ox+16,oy-3],[ox+24,oy+2],[ox+38,oy+8],[ox+50,oy+14],[ox+52,oy+22]]; }
  addItem('mis zapatos', 698, 850, 24, null, { x:692, y:782, w:128, h:48 }, [
    S(shoe(700,796), { close:true, w:3 }),
    S(seg(700,818, 752,818, 2), { w:2.2 }),
    S(shoe(762,802), { close:true, w:3 }),
    S(seg(762,824, 814,824, 2), { w:2.2 })
  ]);
})();

/* ---------- checklist (left margin) ---------- */
var ROW0 = 196, ROWH = 60;
var checkBoxes = [];
(function(){ var i; for(i=0;i<items.length;i++){ checkBoxes.push(jit(rectP(48, ROW0 + i*ROWH - 22, 24, 24), 1.1)); } })();

/* ---------- state ---------- */
var PHASE0 = 1.3;
var itemsDrawn = 0;
var drawingIdx = -1, drawingT0 = 0;
var ambientOn = false, ambientAmt = 0, phase = PHASE0;
var curT = 0, lastT = 0;

function tick(t){
  var dt = Math.min(0.05, Math.max(0, t - lastT)); lastT = t; curT = t;
  if (drawingIdx >= 0){
    var it = items[drawingIdx];
    if ((t - drawingT0) >= it.dur){
      it.checkStart = t; itemsDrawn++; drawingIdx = -1;
    }
  }
  var target = ambientOn ? 1 : 0;
  ambientAmt += (target - ambientAmt) * Math.min(1, dt*3.2);
  if (Math.abs(target - ambientAmt) < 0.002) ambientAmt = target;
  phase += dt * ambientAmt;
}

/* ---------- drawing ---------- */
function handFont(size, weight){ return 'italic ' + (weight||600) + ' ' + size + 'px "Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive,sans-serif'; }

function xformPts(st){
  var i, x, y, out=[];
  if (st.curtain){
    for(i=0;i<st.pts.length;i++){ x=st.pts[i][0]; y=st.pts[i][1];
      var k = Math.max(0, Math.min(1, (y-238)/205));
      out.push([x + Math.sin(phase*0.85 + (y-238)*0.004)*7*ambientAmt*k, y]); }
    return out;
  }
  if (st.tail){
    var ang = Math.sin(phase*2.3)*0.16*ambientAmt, cosA=Math.cos(ang), sinA=Math.sin(ang), px=436, py=764;
    for(i=0;i<st.pts.length;i++){ x=st.pts[i][0]-px; y=st.pts[i][1]-py; out.push([px + x*cosA - y*sinA, py + x*sinA + y*cosA]); }
    return out;
  }
  return st.pts;
}

function pathOf(pts, close){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function strokePartial(pts, close, budget){
  var n = pts.length, lim = close ? n : n-1, b = budget, i, a, c, dx, dy, L;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(i=1;i<=lim;i++){
    a = pts[i-1]; c = pts[i%n]; dx = c[0]-a[0]; dy = c[1]-a[1]; L = Math.hypot(dx,dy);
    if (b >= L){ ctx.lineTo(c[0], c[1]); b -= L; }
    else { var f = L ? b/L : 0; ctx.lineTo(a[0]+dx*f, a[1]+dy*f); b = 0; break; }
  }
  ctx.stroke();
  return b;
}

function drawItem(it, p){
  var i, st, pts, budget;
  ctx.save(); ctx.translate(it.dx, it.dy);
  if (it.shadow && p > 0){
    ctx.save(); ctx.globalAlpha = 0.4 * Math.min(1, p*1.6); ctx.fillStyle = WASH;
    ctx.beginPath(); ctx.ellipse(it.shadow.cx, it.shadow.cy, it.shadow.rx, it.shadow.ry, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
  budget = p * it.total;
  for(i=0;i<it.strokes.length;i++){
    st = it.strokes[i]; pts = xformPts(st);
    if (st.fill && p > 0.72){
      ctx.save(); ctx.globalAlpha = Math.min(1, (p-0.72)/0.28); ctx.fillStyle = st.fill;
      pathOf(pts, true); ctx.fill(); ctx.restore();
    }
    if (budget <= 0) continue;
    ctx.strokeStyle = INK; ctx.lineWidth = st.w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (budget >= st.len){ pathOf(pts, st.close); ctx.stroke(); budget -= st.len; }
    else { strokePartial(pts, st.close, budget); budget = 0; }
  }
  var la = Math.max(0, Math.min(1, (p - 0.8)/0.2));
  if (la > 0){
    ctx.save(); ctx.globalAlpha = la; ctx.fillStyle = INK;
    ctx.font = handFont(it.lsize, 600); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.translate(it.lx, it.ly); ctx.rotate(-0.015);
    ctx.fillText(it.label, 0, 0); ctx.restore();
  }
  ctx.restore();
}

function drawChecklist(t){
  var i, y, it, cp;
  ctx.fillStyle = INK; ctx.strokeStyle = INK;
  for(i=0;i<items.length;i++){
    it = items[i]; y = ROW0 + i*ROWH;
    ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    pathOf(checkBoxes[i], true); ctx.stroke();
    ctx.save(); ctx.font = handFont(25, 600); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.translate(88, y); ctx.rotate(i % 2 ? 0.012 : -0.012);
    ctx.fillText(it.label, 0, 0); ctx.restore();
    if (it.checkStart !== null){
      cp = Math.max(0, Math.min(1, (t - it.checkStart)/0.3));
      if (cp > 0){
        ctx.save(); ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        var pts = [[52, y-8],[60, y],[74, y-14]], tot = 0, b, j, a, c, L;
        for(j=1;j<3;j++) tot += Math.hypot(pts[j][0]-pts[j-1][0], pts[j][1]-pts[j-1][1]);
        b = cp * tot;
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for(j=1;j<3;j++){ a=pts[j-1]; c=pts[j]; L=Math.hypot(c[0]-a[0], c[1]-a[1]);
          if (b >= L){ ctx.lineTo(c[0], c[1]); b -= L; } else { var f=L?b/L:0; ctx.lineTo(a[0]+(c[0]-a[0])*f, a[1]+(c[1]-a[1])*f); break; } }
        ctx.stroke(); ctx.restore();
      }
    }
  }
}

var viewW = 300, viewH = 300, dpr = 1;
var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : { width:300, height:300 };
var isPhone = Math.min(scr.width, scr.height) < 700; // aspect fallback below only if screen lies
if (!isPhone && viewH > viewW * 1.15 && Math.min(viewW, viewH) < 700) isPhone = true;

function draw(){
  canvas.style.width = viewW + 'px'; canvas.style.height = viewH + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);
  var s = Math.min(viewW/1000, viewH/1000);
  var ox = (viewW - 1000*s)/2, oy = (viewH - 1000*s)/2;
  ctx.setTransform(dpr*s, 0, 0, dpr*s, dpr*ox, dpr*oy);
  var i;
  for(i=0;i<speckles.length;i++){ var sp = speckles[i]; ctx.save(); ctx.globalAlpha = sp.a; ctx.fillStyle = sp.g ? WASH : INK; ctx.fillRect(sp.x, sp.y, sp.r, sp.r); ctx.restore(); }
  // title, in her hand
  ctx.save(); ctx.fillStyle = INK; ctx.font = handFont(47, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.translate(520, 88); ctx.rotate(-0.014); ctx.fillText('inventario de mi vida', 0, 0); ctx.restore();
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  var sq = wavyH(338, 702, 110, 2.5, 90); ctx.beginPath(); ctx.moveTo(sq[0][0], sq[0][1]);
  for(i=1;i<sq.length;i++) ctx.lineTo(sq[i][0], sq[i][1]); ctx.stroke(); ctx.restore();
  drawChecklist(curT);
  for(i=0;i<items.length;i++){
    if (i < itemsDrawn) drawItem(items[i], 1);
    else if (i === drawingIdx) drawItem(items[i], Math.max(0, Math.min(1, (curT - drawingT0)/items[i].dur)));
  }
  // hint
  ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = INK; ctx.font = handFont(21, 600);
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.fillText('tap · drag', 972, 952); ctx.restore();
}

/* ---------- sizing (Visual Viewport API) ---------- */
function resize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  viewW = vv ? vv.width : window.innerWidth;
  viewH = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw();
}
if (typeof window !== 'undefined' && window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (typeof window !== 'undefined') window.addEventListener('resize', resize);

/* ---------- interaction: tap draws the next item; drag rearranges the things ---------- */
function toStage(e){
  var r = { left:0, top:0 };
  if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
  var cx = (e.clientX - r.left), cy = (e.clientY - r.top);
  var s = Math.min(viewW/1000, viewH/1000);
  return { x: (cx - (viewW - 1000*s)/2)/s, y: (cy - (viewH - 1000*s)/2)/s };
}
function hitItem(p){
  for (var i = items.length - 1; i >= 0; i--){
    var it = items[i];
    if (!it.hit || i >= itemsDrawn) continue;
    var h = it.hit;
    if (p.x >= h.x + it.dx && p.x <= h.x + it.dx + h.w && p.y >= h.y + it.dy && p.y <= h.y + it.dy + h.h) return i;
  }
  return -1;
}
var pdown = null;
canvas.addEventListener('pointerdown', function(e){
  var p = toStage(e);
  var idx = hitItem(p);
  pdown = { x:p.x, y:p.y, item: idx, moved:false,
            odx: idx >= 0 ? items[idx].dx : 0, ody: idx >= 0 ? items[idx].dy : 0 };
});
canvas.addEventListener('pointermove', function(e){
  if (!pdown || pdown.item < 0) return;
  var p = toStage(e), dx = p.x - pdown.x, dy = p.y - pdown.y;
  if (Math.abs(dx) > 7 || Math.abs(dy) > 7) pdown.moved = true;
  if (pdown.moved){
    var it = items[pdown.item];
    it.dx = Math.max(-46, Math.min(46, pdown.odx + dx));
    it.dy = Math.max(-46, Math.min(46, pdown.ody + dy));
    draw();
  }
});
function endPointer(e){
  if (!pdown) return;
  var wasDrag = pdown.moved;
  pdown = null;
  if (wasDrag) { draw(); return; }
  // a tap
  if (drawingIdx >= 0) return;                       // she draws deliberately; wait for the stroke
  if (itemsDrawn < items.length){ drawingIdx = itemsDrawn; drawingT0 = curT; }
  else ambientOn = !ambientOn;                       // inventory complete: tap toggles the gentle animation
  draw();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ pdown = null; });
if (typeof window !== 'undefined') window.addEventListener('pointerup', function(){ if (pdown && !pdown.moved) { /* tap handled on canvas */ } pdown = null; });

/* ---------- go: synchronous first frame at constant phase, then the loop ---------- */
resize();
var baseTs = null;
function loop(ts){
  if (baseTs === null){ baseTs = ts; lastT = 0; curT = 0; }
  tick((ts - baseTs)/1000);
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
</script>
</body>
