<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>A Century of Women</title>
<style>
  html, body { margin: 0; padding: 0; background: #171310; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Decade washes, 1910s through 2010s, in chronological order.
  var DECADES = [
    { wash: '#8A6F4D', hem: 0.92, hair: 0.45, prop: 'hat' },
    { wash: '#C9973B', hem: 0.55, hair: 0.30, prop: 'fan' },
    { wash: '#6B6B6B', hem: 0.88, hair: 0.55, prop: 'hat' },
    { wash: '#5A5A3A', hem: 0.62, hair: 0.60, prop: 'bag' },
    { wash: '#E8B4B8', hem: 0.72, hair: 0.70, prop: 'bag' },
    { wash: '#D97B2E', hem: 0.38, hair: 0.85, prop: 'shades' },
    { wash: '#6B4A2E', hem: 0.78, hair: 0.95, prop: 'bag' },
    { wash: '#2EA8A0', hem: 0.50, hair: 0.75, prop: 'shades' },
    { wash: '#5A4A6B', hem: 0.60, hair: 0.65, prop: 'cup' },
    { wash: '#B8B8C0', hem: 0.45, hair: 0.50, prop: 'phone' },
    { wash: '#E8A0A8', hem: 0.58, hair: 0.60, prop: 'cup' }
  ];
  var VOID = '#E4DED0';
  var RAIL = '#A67B4F';
  var INK = '#221F1A';
  var PAPER = '#EFE6D2';

  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var minDim = Math.min(window.screen.width, window.screen.height);
    phone = minDim < 700 || (H > W * 1.15);
  }

  // Interaction state, all closed-form over recorded events.
  var dragTotal = 0;       // accumulated horizontal drag pixels
  var dragStartX = 0, dragStartTotal = 0, downX = 0, downY = 0, downT = 0, moved = false;
  var enlarged = -1;       // frame index currently enlarged, or -1
  var enlargeStart = 0;    // piece time of tap

  function frameGeom() {
    var fw = phone ? 64 : 96;
    var fh = phone ? 104 : 150;
    var gap = phone ? 10 : 14;
    return { fw: fw, fh: fh, gap: gap, pitch: fw + gap, total: 100 * (fw + gap) - gap };
  }

  function offsetAt() {
    var g = frameGeom();
    var max = Math.max(0, g.total - W);
    var o = dragTotal;
    if (o < 0) o = 0;
    if (o > max) o = max;
    return o;
  }

  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  function rgba(hex, a) {
    var c = hexRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  // Parametric silhouette: abstract, no facial features, no identifiable person.
  function drawVignette(i, x, y, w, h) {
    var rng = mulberry32(1343000 + i * 7919);
    var d = DECADES[Math.min(10, Math.floor(i / 10))];
    var j1 = rng(), j2 = rng(), j3 = rng(), j4 = rng(), j5 = rng();
    var pose = Math.floor(j4 * 3); // 0 standing, 1 hand on hip, 2 stride
    var propSide = j5 < 0.5 ? -1 : 1;
    // Paper ground tinted with the decade wash.
    ctx.fillStyle = PAPER;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = rgba(d.wash, 0.28);
    ctx.fillRect(x, y, w, h);
    // Faint backdrop shape: a doorway arch, seeded per frame.
    ctx.fillStyle = rgba(d.wash, 0.35);
    var aw = w * (0.5 + j1 * 0.25);
    ctx.beginPath();
    ctx.moveTo(x + (w - aw) / 2, y + h);
    ctx.lineTo(x + (w - aw) / 2, y + h * 0.30);
    ctx.moveTo(x + (w - aw) / 2, y + h * 0.30);
    ctx.arc(x + w / 2, y + h * 0.30, aw / 2, Math.PI, 0);
    ctx.moveTo(x + (w + aw) / 2, y + h * 0.30);
    ctx.lineTo(x + (w + aw) / 2, y + h);
    ctx.closePath();
    ctx.fill();
    // Silhouette: head (featureless oval), torso, hemline, legs.
    var cx = x + w / 2 + (j2 - 0.5) * w * 0.08;
    var headR = w * (0.11 + j1 * 0.05);
    var headY = y + h * 0.30;
    var hem = d.hem + (j3 - 0.5) * 0.12;
    var shoulderY = headY + headR + h * 0.04;
    var hemY = y + h * hem;
    ctx.fillStyle = INK;
    // Hair volume by decade, with a seeded bun for some frames.
    var hairR = headR * (1 + d.hair * 0.7);
    ctx.beginPath();
    ctx.moveTo(cx, headY - hairR);
    ctx.arc(cx, headY - headR * 0.15, hairR, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    if (j4 > 0.6) {
      ctx.beginPath();
      ctx.moveTo(cx + hairR * 0.8, headY - headR * 0.3);
      ctx.arc(cx + hairR * 0.9, headY - headR * 0.2, headR * 0.45, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
    }
    // Head, featureless.
    ctx.fillStyle = '#3A332A';
    ctx.beginPath();
    ctx.moveTo(cx, headY - headR);
    ctx.arc(cx, headY, headR, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fill();
    // Torso trapezoid widening or narrowing to the hemline.
    var topW = w * (0.16 + j2 * 0.08), botW = w * (0.14 + hem * 0.24);
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(cx - topW, shoulderY);
    ctx.lineTo(cx + topW, shoulderY);
    ctx.lineTo(cx + botW, hemY);
    ctx.lineTo(cx - botW, hemY);
    ctx.closePath();
    ctx.fill();
    // Legs below the hemline; stride pose splays them.
    var legTop = hemY, legBot = y + h * 0.97;
    var spread = pose === 2 ? w * 0.10 : w * 0.02;
    ctx.fillRect(cx - w * 0.07 - spread, legTop, w * 0.05, legBot - legTop);
    ctx.fillRect(cx + w * 0.02 + spread, legTop, w * 0.05, legBot - legTop);
    // Arm: hand-on-hip pose draws one bent arm, stride pose one raised arm.
    if (pose === 1 || pose === 2) {
      ctx.strokeStyle = INK;
      ctx.lineWidth = Math.max(1.5, w * 0.03);
      ctx.beginPath();
      if (pose === 1) {
        ctx.moveTo(cx - topW, shoulderY + h * 0.03);
        ctx.lineTo(cx - topW - w * 0.08, shoulderY + h * 0.14);
        ctx.lineTo(cx - topW * 0.4, shoulderY + h * 0.18);
      } else {
        ctx.moveTo(cx + topW, shoulderY + h * 0.03);
        ctx.lineTo(cx + topW + w * 0.12, shoulderY - h * 0.06);
      }
      ctx.stroke();
    }
    // Era prop, abstract shape at the figure's side.
    var px = cx + propSide * w * (0.30 + j1 * 0.08), py = shoulderY + h * 0.12;
    ctx.fillStyle = d.wash;
    if (d.prop === 'hat') {
      ctx.beginPath();
      ctx.moveTo(px - w * 0.10, py);
      ctx.arc(px, py, w * 0.10, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(px - w * 0.16, py, w * 0.32, h * 0.015);
    } else if (d.prop === 'fan') {
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px - w * 0.10, py - h * 0.10);
      ctx.lineTo(px + w * 0.02, py - h * 0.12);
      ctx.lineTo(px + w * 0.10, py - h * 0.06);
      ctx.closePath();
      ctx.fill();
    } else if (d.prop === 'bag') {
      ctx.fillRect(px - w * 0.06, py, w * 0.14, h * 0.10);
      ctx.strokeStyle = d.wash;
      ctx.lineWidth = Math.max(1, w * 0.015);
      ctx.beginPath();
      ctx.moveTo(px - w * 0.04, py);
      ctx.arc(px + w * 0.01, py, w * 0.05, Math.PI, 0);
      ctx.stroke();
    } else if (d.prop === 'shades') {
      ctx.fillStyle = INK;
      ctx.fillRect(px - w * 0.09, py - h * 0.02, w * 0.08, h * 0.035);
      ctx.fillRect(px + w * 0.01, py - h * 0.02, w * 0.08, h * 0.035);
    } else if (d.prop === 'cup') {
      ctx.fillStyle = d.wash;
      ctx.fillRect(px - w * 0.04, py, w * 0.09, h * 0.09);
    } else if (d.prop === 'phone') {
      ctx.fillStyle = INK;
      ctx.fillRect(px - w * 0.03, py, w * 0.07, h * 0.11);
    }
    // The stripped slogan: pale hollow rectangle, identical position in every frame.
    ctx.fillStyle = VOID;
    ctx.fillRect(x + w * 0.08, y + h * 0.06, w * 0.84, h * 0.13);
    ctx.strokeStyle = rgba(d.wash, 0.5);
    ctx.lineWidth = Math.max(1, w * 0.012);
    ctx.strokeRect(x + w * 0.08, y + h * 0.06, w * 0.84, h * 0.13);
  }

  function drawFrame(i, x, y, w, h) {
    drawVignette(i, x, y, w, h);
    ctx.strokeStyle = '#0E0C09';
    ctx.lineWidth = Math.max(1.5, w * 0.03);
    ctx.strokeRect(x, y, w, h);
  }

  function draw(t) {
    size();
    var g = frameGeom();
    var off = offsetAt();
    // Ground.
    ctx.fillStyle = '#171310';
    ctx.fillRect(0, 0, W, H);
    // Year-tick light: a thin strip whose color is the wash of the frame at center.
    var centerIdx = Math.floor((off + W / 2) / g.pitch);
    if (centerIdx < 0) centerIdx = 0;
    if (centerIdx > 99) centerIdx = 99;
    var centerDec = DECADES[Math.min(10, Math.floor(centerIdx / 10))];
    ctx.fillStyle = rgba(centerDec.wash, 0.85);
    ctx.fillRect(0, 0, W, Math.max(3, H * 0.008));
    // Rail band.
    var railY = H * 0.5;
    var bandTop = railY - g.fh / 2 - (phone ? 14 : 20);
    var bandBot = railY + g.fh / 2 + (phone ? 14 : 20);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, bandTop, W, bandBot - bandTop);
    ctx.fillStyle = RAIL;
    ctx.fillRect(0, railY - 2, W, 4);
    // Decade tick marks on the rail, every tenth frame.
    for (var k = 0; k <= 10; k++) {
      var tx = k * 10 * g.pitch - off;
      if (tx >= -4 && tx <= W + 4) {
        ctx.fillStyle = RAIL;
        ctx.fillRect(tx - 1, railY - 10, 2, 20);
      }
    }
    // Frames, recycled to the viewport.
    var first = Math.floor(off / g.pitch);
    var last = Math.ceil((off + W) / g.pitch);
    for (var i = first; i <= last && i < 100; i++) {
      if (i < 0) continue;
      var fx = i * g.pitch - off;
      drawFrame(i, fx, railY - g.fh / 2, g.fw, g.fh);
    }
    // Enlarged frame overlay.
    if (enlarged >= 0) {
      var age = t - enlargeStart;
      var ein = Math.min(1, age / 0.4);
      var eout = 0;
      if (age > 4.6) eout = Math.min(1, (age - 4.6) / 0.4);
      if (age >= 5.0) { enlarged = -1; }
      else {
        var s = ein * (1 - eout);
        ctx.fillStyle = 'rgba(0,0,0,' + (0.72 * s) + ')';
        ctx.fillRect(0, 0, W, H);
        var ew = Math.min(W * 0.86, H * 0.62);
        var eh = ew * 1.55;
        if (eh > H * 0.86) { eh = H * 0.86; ew = eh / 1.55; }
        var ex = (W - ew) / 2, ey = (H - eh) / 2;
        var small = 0.15 + 0.85 * s;
        var bx = ex + (ew - ew * small) / 2, by = ey + (eh - eh * small) / 2;
        ctx.save();
        ctx.globalAlpha = s;
        drawVignette(enlarged, bx, by, ew * small, eh * small);
        ctx.strokeStyle = '#0E0C09';
        ctx.lineWidth = 3;
        ctx.strokeRect(bx, by, ew * small, eh * small);
        ctx.restore();
      }
    }
  }

  // Boot flag: frame one is drawn synchronously at exactly t = 0.
  var booted = false;
  var startMs = 0;
  function frame(now) {
    var t = booted ? (now - startMs) / 1000 : 0;
    draw(t);
  }
  function loop(now) {
    if (!booted) { booted = true; startMs = now; }
    frame(now);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }

  canvas.addEventListener('pointerdown', function (e) {
    downX = e.clientX; downY = e.clientY; downT = performance.now();
    dragStartX = e.clientX; dragStartTotal = dragTotal; moved = false;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (downT === 0) return;
    var dx = e.clientX - dragStartX;
    if (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4) moved = true;
    if (moved) dragTotal = dragStartTotal - dx;
  });
  canvas.addEventListener('pointerup', function (e) {
    if (downT === 0) return;
    var totalMove = Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
    if (totalMove < 12 && enlarged < 0) {
      // Tap: find the tapped frame.
      var g = frameGeom();
      var off = offsetAt();
      var railY = H * 0.5;
      var fy = railY - g.fh / 2;
      if (e.clientY >= fy && e.clientY <= fy + g.fh) {
        var idx = Math.floor((e.clientX + off) / g.pitch);
        if (idx >= 0 && idx < 100) {
          enlarged = idx;
          enlargeStart = booted ? (performance.now() - startMs) / 1000 : 0;
        }
      }
    }
    downT = 0;
  });

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(booted ? (performance.now() - startMs) / 1000 : 0); });
    }
    window.addEventListener('resize', function () { draw(booted ? (performance.now() - startMs) / 1000 : 0); });
  }

  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
