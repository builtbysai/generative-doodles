<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Séance Frames</title>
<style>
  html, body { margin: 0; padding: 0; background: #12100e; overflow: hidden; }
  canvas { display: block; background: #12100e; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // Séance Frames — adam-khalil AK5. Three figures from different centuries
  // gathered in one dim room, refusing to resolve into a single timeline.
  // No readable text anywhere except <title>. All motion is a closed-form
  // function of piece time and recorded drag events; nothing is integrated
  // frame by frame, so frame one is reproducible.

  // ---- seeded randomness (mulberry32), never Math.random ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Integer hash -> [0,1), deterministic for grain keyed by quantized time.
  function ih(n) {
    var x = n | 0;
    x = Math.imul(x ^ (x >>> 16), 2246822507);
    x = Math.imul(x ^ (x >>> 13), 3266489909);
    x ^= x >>> 16;
    return (x >>> 0) / 4294967296;
  }

  var SEED = 1388000;
  var ROOM = '#12100e';
  var SEPIA = '#b08d5f', VHS = '#3d5a80', DRONE = '#9dff57', CANDLE = '#e0962a';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, currentT = 0, startMs = null, booted = false;
  var dragEvents = []; // {fig, t} — nearest figure at pointerdown/move, for focus
  var dragging = false;

  function viewportSize() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return { w: w, h: h };
  }
  function isPhone(w, h) {
    var sw = 0, sh = 0;
    if (window.screen) { sw = window.screen.width; sh = window.screen.height; }
    if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
    return h > w * 1.15;
  }

  function resize() {
    var s = viewportSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    draw(currentT);
  }

  // ---- figures ----
  // Base positions around a loose circle, in unit coordinates (-1..1).
  var FIGS = [
    { bx: -0.52, by: 0.10, ph: 0.0, spd: 0.21, amp: 0.05, gest: 0.9, era: 0 },
    { bx: 0.00, by: -0.18, ph: 2.1, spd: 0.17, amp: 0.06, gest: 1.3, era: 1 },
    { bx: 0.52, by: 0.10, ph: 4.2, spd: 0.19, amp: 0.05, gest: 0.7, era: 2 }
  ];
  // Era grain styles: 0 daguerreotype (static dots), 1 VHS (tracking lines),
  // 2 drone (pixel blocks). Every 24 s the figures rotate era-grain, so the
  // swap is a scheduled exchange, never a random event.
  function eraOf(fig, t) {
    var cycle = Math.floor(t / 24);
    return (fig.era + cycle) % 3;
  }
  function eraColor(era) {
    return era === 0 ? SEPIA : (era === 1 ? VHS : DRONE);
  }

  function figPos(fig, t, cx, cy, R) {
    var dx = Math.sin(t * fig.spd + fig.ph) * fig.amp;
    var dy = Math.cos(t * fig.spd * 0.8 + fig.ph) * fig.amp * 0.6;
    return { x: cx + (fig.bx + dx) * R, y: cy + (fig.by + dy) * R };
  }
  function focusOf(figIdx, t) {
    var f = 0;
    for (var i = 0; i < dragEvents.length; i++) {
      var ev = dragEvents[i];
      if (ev.fig !== figIdx) continue;
      var dt = t - ev.t;
      if (dt < 0) continue;
      f += Math.exp(-dt / 2.5);
    }
    if (dragging && dragEvents.length && dragEvents[dragEvents.length - 1].fig === figIdx) f = Math.max(f, 1);
    return f > 1 ? 1 : f;
  }

  function drawFigure(x, y, s, color, era, t, fig, focus) {
    var sc = s * (0.95 + 0.22 * focus);
    var alpha = 0.55 + 0.45 * focus;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    // Body: simple robe trapezoid, head circle, gesturing arms, legs.
    var gest = Math.sin(t * fig.gest + fig.ph) * 0.45;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-34, -10); ctx.lineTo(34, -10); ctx.lineTo(26, 92); ctx.lineTo(-26, 92);
    ctx.closePath(); ctx.fill();
    // Head (moveTo before arc so arcs never connect to the previous subpath).
    ctx.beginPath(); ctx.moveTo(18, -52); ctx.arc(0, -52, 18, 0, Math.PI * 2); ctx.fill();
    // Legs.
    ctx.strokeStyle = color; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-12, 92); ctx.lineTo(-14, 128); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, 92); ctx.lineTo(14, 128); ctx.stroke();
    // Arms, one raised in gesture, one lowered.
    ctx.lineWidth = 10;
    var a1 = -0.9 + gest, a2 = 0.5 - gest * 0.5;
    ctx.beginPath(); ctx.moveTo(-30, 0);
    ctx.lineTo(-30 + Math.cos(a1) * 44, Math.sin(a1) * 44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30, 0);
    ctx.lineTo(30 + Math.cos(a2) * 44, Math.sin(a2) * 44); ctx.stroke();
    // Era grain, clipped to the figure's bounding box.
    ctx.save();
    ctx.beginPath(); ctx.rect(-52, -74, 104, 210); ctx.clip();
    drawGrain(era, t, fig);
    ctx.restore();
    ctx.restore();
  }

  function drawGrain(era, t, fig) {
    var seedBase = SEED + fig.era * 7919 + 101;
    if (era === 0) {
      // Daguerreotype: static dots, keyed by a slow 2 s quantum.
      var q = Math.floor(t / 2);
      for (var k = 0; k < 70; k++) {
        var gx = -52 + ih(seedBase + k * 17 + q * 3) * 104;
        var gy = -74 + ih(seedBase + k * 31 + q * 7) * 210;
        ctx.fillStyle = 'rgba(232,228,218,0.10)';
        ctx.fillRect(gx, gy, 2, 2);
      }
    } else if (era === 1) {
      // VHS: tracking lines drifting down, band jumps on a 0.33 s quantum.
      var q2 = Math.floor(t / 0.33);
      for (var l = 0; l < 4; l++) {
        var ly = -74 + ((ih(seedBase + l * 53 + q2 * 11) * 210 + t * 26) % 210);
        ctx.fillStyle = 'rgba(232,228,218,0.12)';
        ctx.fillRect(-52, ly, 104, 2);
      }
      var band = -74 + ih(seedBase + q2 * 29) * 210;
      ctx.fillStyle = 'rgba(232,228,218,0.08)';
      ctx.fillRect(-52, band, 104, 10);
    } else {
      // Drone feed: pixel blocks, re-keyed every 0.5 s.
      var q3 = Math.floor(t / 0.5);
      for (var bx = 0; bx < 13; bx++) {
        for (var by = 0; by < 26; by++) {
          if (ih(seedBase + bx * 131 + by * 17 + q3 * 7) > 0.62) {
            ctx.fillStyle = 'rgba(157,255,87,0.20)';
            ctx.fillRect(-52 + bx * 8, -74 + by * 8, 8, 8);
          }
        }
      }
    }
  }

  function draw(t) {
    currentT = t;
    if (!W || !H) { var s0 = viewportSize(); W = s0.w; H = s0.h; }
    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, W, H);
    var phone = isPhone(W, H);
    var cx = W / 2, cy = H / 2;
    var R = Math.min(W, H) * (phone ? 0.46 : 0.40);
    var s = Math.min(W, H) / 700;
    if (s < 0.35) s = 0.35;

    // Room: centered wall panel and floor band, flat fills only.
    ctx.fillStyle = '#1a1712';
    var rw = Math.min(W * 0.92, R * 3.1), rh = Math.min(H * 0.86, R * 2.6);
    ctx.fillRect(cx - rw / 2, cy - rh / 2, rw, rh);
    ctx.fillStyle = '#221e17';
    ctx.fillRect(cx - rw / 2, cy + rh * 0.18, rw, rh * 0.32);

    // Candle at the circle's center; flicker is a seeded envelope of
    // quantized 0.12 s time, never per-frame random.
    var q = Math.floor(t / 0.12);
    var flick = 0.86 + 0.14 * ih(SEED * 7 + q * 13) + 0.06 * Math.sin(t * 7.3);
    ctx.save();
    ctx.globalAlpha = 0.10 * flick;
    ctx.fillStyle = CANDLE;
    ctx.beginPath(); ctx.moveTo(cx + 70 * s, cy); ctx.arc(cx, cy, 70 * s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#e8e4da';
    ctx.fillRect(cx - 4 * s, cy + 6 * s, 8 * s, 26 * s);
    ctx.fillStyle = CANDLE;
    ctx.beginPath(); ctx.moveTo(cx + 9 * s * flick, cy - 22 * s);
    ctx.arc(cx, cy - 22 * s, 9 * s * flick, 0, Math.PI * 2); ctx.fill();

    // Figures, facing inward around the candle.
    for (var i = 0; i < FIGS.length; i++) {
      var fig = FIGS[i];
      var p = figPos(fig, t, cx, cy, R);
      var era = eraOf(fig, t);
      drawFigure(p.x, p.y, s, eraColor(era), era, t, fig, focusOf(i, t));
    }
  }

  function nearestFig(x, y, t) {
    var cx = W / 2, cy = H / 2;
    var R = Math.min(W, H) * 0.40;
    var best = 0, bestD = 1e18;
    for (var i = 0; i < FIGS.length; i++) {
      var p = figPos(FIGS[i], t, cx, cy, R);
      var d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      dragEvents.push({ fig: nearestFig(e.clientX, e.clientY, currentT), t: currentT });
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dragEvents.push({ fig: nearestFig(e.clientX, e.clientY, currentT), t: currentT });
    });
    canvas.addEventListener('pointerup', function () { dragging = false; });
    canvas.addEventListener('pointercancel', function () { dragging = false; });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', resize);
    if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
      visualViewport.addEventListener('resize', resize);
    }
  }

  // Frame one is drawn synchronously at a constant phase; the clock starts
  // only with the rAF loop.
  resize();
  draw(0);
  booted = true;
  function loop(ts) {
    if (startMs === null) startMs = ts;
    draw((ts - startMs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
