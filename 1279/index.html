<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wonder Women</title>
<style>
  html, body { margin: 0; padding: 0; background: #100E14; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;

  // Seeded PRNG (mulberry32, fixed seed): deterministic, no Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1279);

  var GROUND = '#232A4A';
  var SHADOW = '#100E14';
  var LED = '#FFD98A';
  var TONES = ['#C2185B', '#E8A020', '#0F7B8A', '#D97B8C'];

  // --- Sari fragment field: seeded jittered tiles, dark and dense ---
  var frags = [];
  function buildField() {
    frags = [];
    var r = mulberry32(79127);
    var cols = 14, rows = 9;
    var cw = W / cols, ch = H / rows;
    var shades = ['#232A4A', '#1D2340', '#283058', '#20264A', '#262E52', '#1A2038'];
    for (var j = 0; j < rows; j++) {
      for (var i = 0; i < cols; i++) {
        var x0 = i * cw, y0 = j * ch;
        var jx = (r() - 0.5) * cw * 0.22, jy = (r() - 0.5) * ch * 0.22;
        frags.push({
          x: x0 + jx, y: y0 + jy, w: cw * (1 + (r() - 0.5) * 0.12),
          h: ch * (1 + (r() - 0.5) * 0.12),
          c: shades[Math.floor(r() * shades.length)],
          dots: r() > 0.45, dotSeed: r() * 1000
        });
      }
    }
  }

  // --- Procession figures: loose, individual, seeded ---
  var figures = [];
  function buildFigures() {
    figures = [];
    var r = mulberry32(4381279);
    var n = 9;
    for (var i = 0; i < n; i++) {
      var s = 0.55 + r() * 0.75; // scale
      figures.push({
        x0: r() * (W + 400) - 200,
        y: H * (0.30 + r() * 0.45),
        s: s,
        speed: (10 + r() * 14) * (0.8 + s * 0.3), // px/s, varies per figure
        tone: TONES[Math.floor(r() * TONES.length)],
        arm: r(), // arm pose seed
        drape: r(), // sari drape seed
        bobF: 1.4 + r() * 0.9,
        bobP: r() * Math.PI * 2,
        legP: r() * Math.PI * 2
      });
    }
  }

  // --- LED dots: scattered, never on a grid ---
  var leds = [];
  function buildLeds() {
    leds = [];
    var r = mulberry32(91279);
    for (var i = 0; i < 42; i++) {
      leds.push({
        x: r() * W, y: r() * H,
        rad: 1.6 + r() * 2.2,
        ph: r() * Math.PI * 2,
        per: 3.2 + r() * 3.0
      });
    }
  }

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var minDim = Infinity;
    try {
      if (window.screen) {
        minDim = Math.min(window.screen.width, window.screen.height);
      }
    } catch (e) {}
    isPhone = (minDim < 700) || (H > W * 1.15);
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
    buildField();
    buildFigures();
    buildLeds();
  }

  function pin() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // --- Drag-dim state: closed-form over recorded events + t ---
  var pointer = { down: false, startY: 0, y: 0 };
  var lastRelease = null; // {t, dim}
  function dimAt(t) {
    if (pointer.down) {
      var dy = pointer.y - pointer.startY;
      if (dy <= 0) return 1;
      var d = 1 - dy * 0.004;
      return d < 0.12 ? 0.12 : d;
    }
    if (lastRelease) {
      var dt = t - lastRelease.t;
      if (dt < 0) dt = 0;
      return 1 - (1 - lastRelease.dim) * Math.exp(-dt / 0.9);
    }
    return 1;
  }
  function onDown(e) {
    var p = pos(e);
    pointer.down = true; pointer.startY = p.y; pointer.y = p.y;
  }
  function onMove(e) {
    if (!pointer.down) return;
    pointer.y = pos(e).y;
  }
  function onUp(e, t) {
    if (!pointer.down) return;
    var d = dimAt(t);
    pointer.down = false;
    lastRelease = { t: t, dim: d };
  }
  function pos(e) {
    var rect = canvas.getBoundingClientRect();
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0].clientY);
    return { x: cx - rect.left, y: cy - rect.top };
  }

  // --- Drawing helpers (flat shapes only; moveTo before every batched arc) ---
  function disc(x, y, r, color, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawFigure(f, t, dim) {
    var span = W + 400;
    var x = (((f.x0 + f.speed * t) % span) + span) % span - 200;
    var y = f.y + Math.sin(t * f.bobF + f.bobP) * 3 * f.s;
    var s = f.s;
    var legSwing = Math.sin(t * f.bobF * 2 + f.legP) * 8 * s;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = dim;
    ctx.fillStyle = f.tone;
    // Sari drape: trapezoid body, drape edge varies by seed
    var drapeShift = (f.drape - 0.5) * 22 * s;
    ctx.beginPath();
    ctx.moveTo(-16 * s, -52 * s);
    ctx.lineTo(16 * s, -52 * s);
    ctx.lineTo(26 * s + drapeShift, 30 * s);
    ctx.lineTo(-26 * s + drapeShift, 30 * s);
    ctx.closePath();
    ctx.fill();
    // Sari print: small dots on the drape
    var pr = mulberry32(Math.floor(f.drape * 100000) + 7);
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    for (var i = 0; i < 7; i++) {
      var dx = (-20 + pr() * 40) * s, dy = (-44 + pr() * 66) * s;
      ctx.beginPath();
      ctx.moveTo(dx + 2.2 * s, dy);
      ctx.arc(dx, dy, 2.2 * s, 0, Math.PI * 2);
      ctx.fill();
    }
    // Head
    ctx.fillStyle = f.tone;
    ctx.beginPath();
    ctx.moveTo(0 + 10 * s, -66 * s);
    ctx.arc(0, -66 * s, 10 * s, 0, Math.PI * 2);
    ctx.fill();
    // Arms: pose varies by seed, swinging gently
    var swing = Math.sin(t * f.bobF * 2 + f.legP) * 4 * s;
    var armA = f.arm;
    ctx.strokeStyle = f.tone;
    ctx.lineWidth = 5 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-14 * s, -46 * s);
    ctx.lineTo(-22 * s - armA * 6 * s, -20 * s + swing);
    ctx.moveTo(14 * s, -46 * s);
    ctx.lineTo(22 * s + (1 - armA) * 6 * s, -20 * s - swing);
    ctx.stroke();
    // Legs, walking
    ctx.beginPath();
    ctx.moveTo(-8 * s, 30 * s);
    ctx.lineTo(-10 * s + legSwing, 52 * s);
    ctx.moveTo(8 * s, 30 * s);
    ctx.lineTo(10 * s - legSwing, 52 * s);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    pin();
    // Ground: deep indigo shadow base
    ctx.fillStyle = SHADOW;
    ctx.fillRect(0, 0, W, H);
    var dim = dimAt(t);
    // Sari fragment field, dimmed with the figures (LEDs stay lit)
    ctx.globalAlpha = 0.35 + 0.65 * dim;
    for (var i = 0; i < frags.length; i++) {
      var fr = frags[i];
      ctx.fillStyle = fr.c;
      ctx.fillRect(fr.x, fr.y, fr.w, fr.h);
      if (fr.dots) {
        var dr = mulberry32(Math.floor(fr.dotSeed));
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        for (var k = 0; k < 4; k++) {
          var dx = fr.x + dr() * fr.w, dy = fr.y + dr() * fr.h;
          ctx.beginPath();
          ctx.moveTo(dx + 1.5, dy);
          ctx.arc(dx, dy, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;
    // Procession
    for (var j = 0; j < figures.length; j++) {
      drawFigure(figures[j], t, dim);
    }
    // LED dots: warm, pulsing in slow waves, never dimmed
    for (var m = 0; m < leds.length; m++) {
      var L = leds[m];
      var wave = 0.5 + 0.5 * Math.sin((2 * Math.PI * t) / L.per + L.ph + L.x * 0.002);
      var a = 0.45 + 0.55 * wave;
      disc(L.x, L.y, L.rad + 2.5 * wave, LED, 0.18 * a);
      disc(L.x, L.y, L.rad, LED, a);
    }
  }

  // --- Boot: synchronous first frame at EXACTLY t=0 (№343 rule) ---
  var booted = false;
  var T0 = 0;
  function now() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - T0) / 1000;
    }
    return 0;
  }
  function frame() {
    draw(now());
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(frame);
    }
  }

  if (typeof window !== 'undefined') {
    size();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(0); });
    }
    window.addEventListener('resize', function () { size(); draw(0); });
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', function () { onUp(null, now()); });
    canvas.addEventListener('pointercancel', function () { onUp(null, now()); });
    if (typeof performance !== 'undefined' && performance.now) {
      T0 = performance.now();
    }
    draw(0); // frame one: constant phase, boot flag
    booted = true;
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(frame);
    }
  }
})();
</script>
</body>
</html>
