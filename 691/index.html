<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Palabrarmas</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F2EDE3; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): paper, ink, and one accent per word.
  // VERDAD and FUEGO take blood red, AGUA and RIO take river blue,
  // TIERRA takes earth brown, MANO and LUNA stay ink. Nothing else.
  var PAPER = '#F2EDE3';
  var INK = '#1A1A1A';
  var RED = '#A83232';
  var BLUE = '#3E7C8C';
  var BROWN = '#5C3A21';

  var BASE_SEED = 691001;
  var N = 720;          // particles in every cloud
  var WORD_S = 12;      // seconds per word cycle
  var FORCE_T = -1;     // QA hook: -1 = live clock, else fixed elapsed seconds

  // QA seed hook: ?seed=tNN pins the elapsed time (used by the headless
  // renderer to inspect later phases).
  try {
    if (typeof location !== 'undefined' && location.search) {
      var qm = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(location.search);
      if (qm) FORCE_T = parseFloat(qm[1]);
    }
  } catch (e) { /* live mode */ }

  // Seeded RNG (mulberry32). Dissolve jitter, micro-shiver phases and
  // dot sizes come from this one stream, consumed once at init.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function smooth(u) { return u * u * (3 - 2 * u); }
  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }

  // ------------------------------------------------------------------
  // Authored stroke font. Each capital is a set of polylines on a
  // 5 x 7 grid (x right, y down, 0 top). The letters are the piece:
  // there is no fillText and no offscreen sampling anywhere, because
  // the QA renderer has neither document.createElement nor an
  // offscreen canvas. Words are laid out left to right with 1.7 units
  // of tracking.
  // ------------------------------------------------------------------
  var FONT = {
    A: [[[0, 7], [2.5, 0], [5, 7]], [[1.3, 4.7], [3.7, 4.7]]],
    D: [[[0, 0], [0, 7]],
        [[0, 0], [2.6, 0.2], [4.3, 1.4], [5, 3.5], [4.3, 5.6], [2.6, 6.8], [0, 7]]],
    E: [[[5, 0], [0, 0], [0, 7], [5, 7]], [[0, 3.5], [3.9, 3.5]]],
    F: [[[5, 0], [0, 0], [0, 7]], [[0, 3.5], [3.7, 3.5]]],
    G: [[[4.9, 1.7], [4.0, 0.5], [2.5, 0], [1.1, 0.4], [0.2, 1.9], [0, 3.5],
         [0.2, 5.1], [1.1, 6.6], [2.5, 7], [3.9, 6.7], [5, 5.3], [5, 3.9], [3.1, 3.9]]],
    I: [[[0.9, 0], [4.1, 0]], [[2.5, 0], [2.5, 7]], [[0.9, 7], [4.1, 7]]],
    L: [[[0, 0], [0, 7], [5, 7]]],
    M: [[[0, 7], [0, 0], [2.5, 3.8], [5, 0], [5, 7]]],
    N: [[[0, 7], [0, 0], [5, 7], [5, 0]]],
    O: (function () {
      var pts = [];
      for (var k = 0; k <= 20; k++) {
        var a = (k / 20) * Math.PI * 2;
        pts.push([2.5 + 2.5 * Math.cos(a), 3.5 + 3.5 * Math.sin(a)]);
      }
      return [pts];
    })(),
    R: [[[0, 7], [0, 0]],
        [[0, 0], [3.1, 0], [4.5, 0.9], [4.5, 2.5], [3.1, 3.5], [0, 3.5]],
        [[2.0, 3.5], [5, 7]]],
    T: [[[0, 0], [5, 0]], [[2.5, 0], [2.5, 7]]],
    U: [[[0, 0], [0, 4.6], [0.7, 6.2], [2.5, 7], [4.3, 6.2], [5, 4.6], [5, 0]]],
    V: [[[0, 0], [2.5, 7], [5, 0]]]
  };
  var TRACK = 1.7; // grid units between letters
  var CELL_W = 5, CELL_H = 7;

  // Catmull-Rom smoothing through anchor points, for the hand-drawn
  // object glyphs. Returns a dense polyline.
  function smoothPath(anchors, closed, subdiv) {
    var pts = anchors.slice();
    if (closed) { pts.push(anchors[0]); }
    var out = [];
    var n = pts.length;
    function P(i) {
      if (closed) {
        var m = anchors.length;
        return anchors[((i % m) + m) % m];
      }
      return pts[clamp(i, 0, n - 1)];
    }
    var segs = closed ? anchors.length : n - 1;
    for (var s = 0; s < segs; s++) {
      var p0 = P(s - 1), p1 = P(s), p2 = P(s + 1), p3 = P(s + 2);
      for (var k = 0; k < subdiv; k++) {
        var u = k / subdiv, u2 = u * u, u3 = u2 * u;
        out.push([
          0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
          0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)
        ]);
      }
    }
    out.push(closed ? anchors[0].slice() : pts[n - 1].slice());
    return out;
  }

  // Sample a set of polylines into exactly N points, evenly by arc
  // length across the whole set, then sort by polar angle around the
  // centroid so word cloud and object cloud pair up radially and the
  // morph gathers instead of crossing.
  function sampleLines(lines, count) {
    var segs = [], total = 0, i, j;
    for (i = 0; i < lines.length; i++) {
      var line = lines[i];
      for (j = 0; j + 1 < line.length; j++) {
        var dx = line[j + 1][0] - line[j][0], dy = line[j + 1][1] - line[j][1];
        var len = Math.hypot(dx, dy);
        if (len < 1e-9) continue;
        segs.push({ x0: line[j][0], y0: line[j][1], x1: line[j + 1][0], y1: line[j + 1][1], len: len, cum: total });
        total += len;
      }
    }
    var pts = [], si = 0;
    for (i = 0; i < count; i++) {
      var d = total * (i + 0.5) / count;
      while (si + 1 < segs.length && segs[si + 1].cum <= d) si++;
      var sg = segs[si];
      var u = clamp((d - sg.cum) / sg.len, 0, 1);
      pts.push([lerp(sg.x0, sg.x1, u), lerp(sg.y0, sg.y1, u)]);
    }
    var cx = 0, cy = 0;
    for (i = 0; i < pts.length; i++) { cx += pts[i][0]; cy += pts[i][1]; }
    cx /= pts.length; cy /= pts.length;
    pts.sort(function (a, b) {
      return Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx);
    });
    return pts;
  }

  // Word cloud: letter strokes offset per letter, recentered so the
  // word's grid box is centered on the origin. Returns {pts, wu} with
  // wu the word width in grid units.
  function wordCloud(word) {
    var lines = [];
    for (var i = 0; i < word.length; i++) {
      var strokes = FONT[word.charAt(i)];
      var ox = i * (CELL_W + TRACK);
      for (var s = 0; s < strokes.length; s++) {
        var line = [];
        for (var k = 0; k < strokes[s].length; k++) {
          line.push([strokes[s][k][0] + ox, strokes[s][k][1]]);
        }
        lines.push(line);
      }
    }
    var wu = word.length * CELL_W + (word.length - 1) * TRACK;
    var raw = sampleLines(lines, N);
    var pts = [];
    for (var j = 0; j < raw.length; j++) pts.push([raw[j][0] - wu / 2, raw[j][1] - CELL_H / 2]);
    return { pts: pts, wu: wu };
  }

  // ------------------------------------------------------------------
  // Object glyphs, authored point clouds in a [-1, 1] box, glyphic
  // and hand-drawn in spirit: an eye, a wave with a droplet, a hand,
  // a rooted mound, a meandering river, a flame, a crescent.
  // ------------------------------------------------------------------
  function circlePts(cx, cy, r, n) {
    var pts = [];
    for (var k = 0; k <= n; k++) {
      var a = (k / n) * Math.PI * 2;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    return pts;
  }
  function ellipsePts(cx, cy, rx, ry, n) {
    var pts = [];
    for (var k = 0; k <= n; k++) {
      var a = (k / n) * Math.PI * 2;
      pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
    }
    return pts;
  }

  function eyeLines() {
    var lines = [ellipsePts(0, 0, 0.95, 0.68, 56), circlePts(0, 0, 0.30, 28), circlePts(0, 0, 0.12, 14)];
    var lashA = [-2.75, -2.36, -1.97, -1.57, -1.18];
    for (var i = 0; i < lashA.length; i++) {
      var a = lashA[i];
      var bx = 0.95 * Math.cos(a), by = 0.68 * Math.sin(a);
      var dl = Math.hypot(bx, by) || 1;
      lines.push([[bx, by], [bx + (bx / dl) * 0.16, by + (by / dl) * 0.16]]);
    }
    return lines;
  }

  function aguaLines() {
    var lines = [];
    var rows = [[0.34, 0.3], [0.56, 1.4]];
    for (var r = 0; r < rows.length; r++) {
      var row = [];
      for (var k = 0; k <= 40; k++) {
        var x = -0.95 + (k / 40) * 1.9;
        row.push([x, rows[r][0] + 0.07 * Math.sin(5 * x + rows[r][1])]);
      }
      lines.push(row);
    }
    var drop = smoothPath(
      [[0, -0.60], [0.10, -0.32], [0.20, -0.08], [0.26, 0.14], [0.22, 0.34],
       [0.10, 0.46], [0, 0.49], [-0.10, 0.46], [-0.22, 0.34], [-0.26, 0.14],
       [-0.20, -0.08], [-0.10, -0.32]], true, 5);
    var dp = [];
    for (var i = 0; i < drop.length; i++) dp.push([drop[i][0] * 0.55, -0.28 + drop[i][1] * 0.55]);
    lines.push(dp);
    return lines;
  }

  function manoLines() {
    var anchors = [
      [-0.28, 1.00], [0.28, 1.00], [0.30, 0.15], [0.31, -0.26], [0.24, -0.37],
      [0.19, -0.30], [0.18, -0.02], [0.15, -0.52], [0.07, -0.61], [0.02, -0.52],
      [0.01, -0.04], [-0.03, -0.70], [-0.11, -0.79], [-0.15, -0.68], [-0.14, -0.04],
      [-0.18, -0.56], [-0.26, -0.63], [-0.29, -0.52], [-0.28, 0.06], [-0.52, -0.04],
      [-0.61, 0.10], [-0.52, 0.26], [-0.35, 0.36], [-0.30, 0.70]
    ];
    return [smoothPath(anchors, true, 5)];
  }

  function tierraLines() {
    var lines = [[[-1, 0.18], [1, 0.18]]];
    var mound = [];
    for (var k = 0; k <= 28; k++) {
      var a = Math.PI + (k / 28) * Math.PI;
      mound.push([0.58 * Math.cos(a), 0.18 + 0.62 * Math.sin(a)]);
    }
    lines.push(mound);
    var roots = [
      [[-0.30, 0.18], [-0.32, 0.38], [-0.38, 0.55]],
      [[-0.32, 0.38], [-0.24, 0.52]],
      [[-0.08, 0.19], [-0.06, 0.44], [-0.10, 0.62]],
      [[-0.06, 0.44], [0.03, 0.55]],
      [[0.14, 0.19], [0.16, 0.40], [0.12, 0.58]],
      [[0.16, 0.40], [0.24, 0.50]],
      [[0.34, 0.18], [0.37, 0.36], [0.43, 0.50]]
    ];
    for (var i = 0; i < roots.length; i++) lines.push(roots[i]);
    return lines;
  }

  function rioLines() {
    var lines = [];
    var offs = [0, -0.14, 0.14];
    for (var o = 0; o < offs.length; o++) {
      var line = [];
      for (var k = 0; k <= 44; k++) {
        var x = -1 + (k / 44) * 2;
        line.push([x, 0.30 * Math.sin(2.6 * x + 0.5) + offs[o]]);
      }
      lines.push(line);
    }
    return lines;
  }

  function fuegoLines() {
    var anchors = [
      [0.02, -0.78], [0.14, -0.42], [0.30, -0.16], [0.40, 0.14], [0.38, 0.42],
      [0.24, 0.64], [0, 0.72], [-0.24, 0.64], [-0.38, 0.42], [-0.40, 0.14],
      [-0.32, -0.12], [-0.18, -0.34], [-0.16, -0.52], [-0.05, -0.38]
    ];
    var outer = smoothPath(anchors, true, 5);
    var inner = [];
    for (var i = 0; i < anchors.length; i++) inner.push([anchors[i][0] * 0.45, anchors[i][1] * 0.45 + 0.16]);
    return [outer, smoothPath(inner, true, 5)];
  }

  function lunaLines() {
    var lines = [];
    var outer = [];
    for (var k = 0; k <= 36; k++) {
      var a = 0.96 + (k / 36) * (Math.PI * 2 - 1.92);
      outer.push([0.62 * Math.cos(a), 0.62 * Math.sin(a)]);
    }
    lines.push(outer);
    var inner = [];
    for (var k2 = 0; k2 <= 28; k2++) {
      var a2 = 1.34 + (k2 / 28) * (4.94 - 1.34);
      inner.push([0.24 + 0.50 * Math.cos(a2), 0.50 * Math.sin(a2)]);
    }
    lines.push(inner);
    return lines;
  }

  // The fixed word list, in cycle order, each with its accent and its
  // object glyph builder.
  var WORDS = [
    { w: 'VERDAD', accent: RED, obj: eyeLines },
    { w: 'AGUA', accent: BLUE, obj: aguaLines },
    { w: 'MANO', accent: INK, obj: manoLines },
    { w: 'TIERRA', accent: BROWN, obj: tierraLines },
    { w: 'RIO', accent: BLUE, obj: rioLines },
    { w: 'FUEGO', accent: RED, obj: fuegoLines },
    { w: 'LUNA', accent: INK, obj: lunaLines }
  ];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Precompute every cloud once: word clouds in centered grid units,
  // object clouds in the [-1, 1] glyph box. Pure data, so any frame is
  // a pure function of the anchored clock.
  var wordClouds = [], objClouds = [], wordWU = [], accentRgb = [];
  var INK_RGB = hexRgb(INK);
  (function buildClouds() {
    for (var i = 0; i < WORDS.length; i++) {
      var wc = wordCloud(WORDS[i].w);
      wordClouds.push(wc.pts);
      wordWU.push(wc.wu);
      objClouds.push(sampleLines(WORDS[i].obj(), N));
      accentRgb.push(hexRgb(WORDS[i].accent));
    }
  })();

  // Per-particle seeded data: dissolve direction and magnitude, a
  // micro-shiver phase, and a dot-size factor.
  var pDir = [], pMag = [], pPhase = [], pRad = [];
  (function buildParticles() {
    var rng = mulberry32(BASE_SEED);
    for (var i = 0; i < N; i++) {
      var a = rng() * Math.PI * 2;
      pDir.push([Math.cos(a), Math.sin(a)]);
      pMag.push(0.5 + rng() * 0.8);
      pPhase.push(rng());
      pRad.push(0.8 + rng() * 0.45);
    }
  })();

  // Tap-to-skip events: { t, d } on the anchored clock. The effective
  // cycle time at elapsed e is e plus the deltas of all taps at or
  // before e, which keeps draw() a pure function of elapsed.
  var taps = [];
  function offsetAt(e) {
    var s = 0;
    for (var i = 0; i < taps.length; i++) if (taps[i].t <= e) s += taps[i].d;
    return s;
  }

  var W = 0, H = 0, S = 0, isPhone = false;
  var lastElapsed = 0;

  // Morph state for a cycle phase u in [0, 1): shape 0 = word formed,
  // 1 = object formed, turb = dissolve turbulence envelope (0 in the
  // holds, a sine hump across each morph).
  function morphAt(u) {
    if (u < 0.27) return { shape: 0, turb: 0 };
    if (u < 0.50) { var s = (u - 0.27) / 0.23; return { shape: smooth(s), turb: Math.sin(Math.PI * s) }; }
    if (u < 0.73) return { shape: 1, turb: 0 };
    if (u < 0.96) { var s2 = (u - 0.73) / 0.23; return { shape: 1 - smooth(s2), turb: Math.sin(Math.PI * s2) }; }
    return { shape: 0, turb: 0 };
  }

  function draw(elapsed) {
    lastElapsed = elapsed;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.globalAlpha = 1;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    var te = elapsed + offsetAt(elapsed);
    var cyc = te / WORD_S;
    var wi = Math.floor(cyc) % WORDS.length;
    var u = cyc - Math.floor(cyc);
    var m = morphAt(u);

    // Layout: the word sits large in the middle band, scaled to fit
    // both the viewport width and a band height, so every word is the
    // same letter height and only its width breathes with its length.
    var scale = Math.min(0.9 * W / wordWU[wi], 0.38 * H / CELL_H);
    var letterH = CELL_H * scale;
    var cx = W / 2, cy = H / 2;
    var objHW = Math.min(wordWU[wi] * scale * 0.46, letterH * 2.1);
    var objHH = letterH * 1.05;
    var rBase = clamp(letterH * 0.017, 1.0, 3.4);
    var jAmp = letterH * 0.10;

    // Color: ink while the word holds, the accent takes over the
    // cloud as the object forms.
    var ac = accentRgb[wi];
    var cr = Math.round(lerp(INK_RGB[0], ac[0], m.shape));
    var cg = Math.round(lerp(INK_RGB[1], ac[1], m.shape));
    var cb = Math.round(lerp(INK_RGB[2], ac[2], m.shape));
    ctx.fillStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')';

    var wc = wordClouds[wi], oc = objClouds[wi];
    for (var i = 0; i < N; i++) {
      var wx = cx + wc[i][0] * scale, wy = cy + wc[i][1] * scale;
      var ox = cx + oc[i][0] * objHW, oy = cy + oc[i][1] * objHH;
      var px = lerp(wx, ox, m.shape) + pDir[i][0] * m.turb * jAmp * pMag[i];
      var py = lerp(wy, oy, m.shape) + pDir[i][1] * m.turb * jAmp * pMag[i];
      // A sub-pixel hand shiver, a pure phase function, keeps the
      // holds from reading as machine print.
      px += Math.sin(elapsed * 0.8 + pPhase[i] * 6.2832) * 0.4;
      py += Math.cos(elapsed * 0.66 + pPhase[i] * 9.4248) * 0.4;
      var r = rBase * pRad[i];
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ------------------------------------------------------------------
  // Interaction: watch-only loop; a tap skips to the next word by
  // recording the offset that lands the cycle on its next boundary.
  // ------------------------------------------------------------------
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function () {
      var e = lastElapsed;
      var te = e + offsetAt(e);
      var delta = (WORD_S - (te % WORD_S)) % WORD_S;
      if (delta > 0.001) {
        taps.push({ t: e, d: delta });
        if (taps.length > 200) taps.splice(0, taps.length - 200);
      }
    });
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    S = Math.min(W, H);
    if (window.screen) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = H > W * 1.15;
    }
    draw(lastElapsed);
  }

  resize();
  draw(FORCE_T >= 0 ? FORCE_T : 0);

  if (typeof window.requestAnimationFrame === 'function') {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var raf = function () {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : t0;
      draw(FORCE_T >= 0 ? FORCE_T : (now - t0) / 1000);
      window.requestAnimationFrame(raf);
    };
    window.requestAnimationFrame(raf);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener) window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
