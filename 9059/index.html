<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9059 · Crosscurrent</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #171310; }
  #stage { position: fixed; inset: 0; display: block; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    text-align: center; color: rgba(232, 220, 196, 0.38);
    font: 12px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.14em; pointer-events: none; user-select: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.7);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another current</div>
<script>
'use strict';
/* №9059 · Crosscurrent
   After Fidenza: a flow field as the base, thick shapes over it, collision
   checks so nothing overlaps, a probabilistic palette. The turn is my own:
   two families share one current on a mid-tone ground. Dark ink ribbons and
   pale carved ribbons ride the same field and interleave without touching,
   so the figure and the ground trade places as you look. Ribbon ends fray
   into strands. Turbulence, scale mix, and palette weights all come from
   the seed. Click mints a new current. */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9059', 10) || 9059;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  draw();
}
window.addEventListener('resize', resize);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  draw();
});

// value noise with fbm; seeded
function makeNoise(rnd) {
  const P = new Uint8Array(512);
  const p = [];
  for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
  const grad = [];
  for (let i = 0; i < 256; i++) grad.push(rnd() * 2 - 1);
  function val(ix, iy) {
    return grad[P[(P[ix & 255] + iy) & 255]];
  }
  function noise2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = val(xi, yi), b = val(xi + 1, yi), c = val(xi, yi + 1), d = val(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  return function fbm(x, y, oct) {
    let s = 0, amp = 0.5, f = 1, norm = 0;
    for (let i = 0; i < oct; i++) { s += amp * noise2(x * f, y * f); norm += amp; amp *= 0.5; f *= 2.03; }
    return s / norm; // ~[-1,1]
  };
}

function pickWeighted(rnd, pairs) {
  let r = rnd(), acc = 0;
  for (const [v, w] of pairs) { acc += w; if (r <= acc) return v; }
  return pairs[pairs.length - 1][0];
}

const TAU = Math.PI * 2;

function draw() {
  const rnd = mulberry32(seed);
  const fbm = makeNoise(rnd);

  // wall, darker than the print so the square reads as an object
  ctx.fillStyle = '#171310';
  ctx.fillRect(0, 0, W, H);

  const S = Math.min(W, H) * 0.92;
  const ox = (W - S) / 2, oy = (H - S) / 2;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.beginPath(); ctx.rect(0, 0, S, S); ctx.clip();

  // mid-tone ground: a tone both families can push against
  const ground = '#77694f';
  ctx.fillStyle = ground;
  ctx.fillRect(0, 0, S, S);

  // ---- the current: domain-warped flow field ----
  const turb = pickWeighted(rnd, [[0.12, 0.06], [0.65, 0.30], [1.45, 0.44], [2.6, 0.20]]);
  const wob = rnd() * 10;
  const fscale = 1.6 + rnd() * 1.2;
  function fieldAngle(x, y) { // x,y in 0..1
    const wx = fbm(x * fscale + wob, y * fscale, 3);
    const wy = fbm(x * fscale, y * fscale + wob * 1.7, 3);
    const n = fbm(x * fscale * 2 + wx * 1.8, y * fscale * 2 + wy * 1.8, 3);
    return n * turb * Math.PI;
  }

  // ---- palettes: two families, probabilistic ----
  const DARK = [
    ['#3a4048', 0.34], // wet slate
    ['#7e3f27', 0.26], // iron rust
    ['#424d33', 0.20], // deep moss
    ['#221d16', 0.20], // near-black umber
  ];
  const LIGHT = [
    ['#d9cfae', 0.40], // bone
    ['#c8a878', 0.35], // pale clay
    ['#a39c86', 0.25], // mist
  ];
  const FRAY_DARK = '#2b2620';
  const FRAY_LIGHT = '#e4d9bd';

  // ---- collision grid ----
  const GC = 72, cell = S / GC;
  const occ = new Int32Array(GC * GC).fill(-1);
  function markDisc(px, py, rad, id) {
    const r = Math.ceil(rad / cell);
    const cx = Math.floor(px / cell), cy = Math.floor(py / cell);
    for (let j = cy - r; j <= cy + r; j++) for (let i = cx - r; i <= cx + r; i++) {
      if (i < 0 || j < 0 || i >= GC || j >= GC) continue;
      const dx = (i + 0.5) * cell - px, dy = (j + 0.5) * cell - py;
      if (dx * dx + dy * dy <= rad * rad) occ[j * GC + i] = id;
    }
  }
  function hitsForeign(px, py, rad, id) {
    const r = Math.ceil(rad / cell);
    const cx = Math.floor(px / cell), cy = Math.floor(py / cell);
    for (let j = cy - r; j <= cy + r; j++) for (let i = cx - r; i <= cx + r; i++) {
      if (i < 0 || j < 0 || i >= GC || j >= GC) continue;
      const dx = (i + 0.5) * cell - px, dy = (j + 0.5) * cell - py;
      if (dx * dx + dy * dy <= rad * rad) {
        const o = occ[j * GC + i];
        if (o !== -1 && o !== id) return true;
      }
    }
    return false;
  }

  const M = S * 0.075; // margin: negative space is part of the piece
  const gap = S / 130;
  const step = S / 420;
  const maxSteps = 700;

  // scale classes: a few heroes, mostly standards, some fines
  function scaleClass() {
    return pickWeighted(rnd, [['hero', 0.12], ['std', 0.63], ['fine', 0.25]]);
  }
  const widths = { hero: S * 0.034, std: S * 0.019, fine: S * 0.0105 };

  let ribbonId = 0;
  const ribbons = [];

  // Two-sided walk, written plainly: grow forward, then backward.
  function growRibbon() {
    const cls = scaleClass();
    const w = widths[cls] * (0.85 + rnd() * 0.3);
    const id = ++ribbonId;
    const dark = rnd() < 0.55;
    const color = pickWeighted(rnd, dark ? DARK : LIGHT);
    const frayColor = dark ? FRAY_DARK : FRAY_LIGHT;
    const rad = w / 2 + gap;

    let sx = M + rnd() * (S - 2 * M);
    let sy = M + rnd() * (S - 2 * M);
    if (hitsForeign(sx, sy, rad, id)) return null;

    const fwd = [[sx, sy]];
    markDisc(sx, sy, rad, id);
    let x = sx, y = sy;
    let a = fieldAngle(x / S, y / S);
    for (let s = 0; s < maxSteps; s++) {
      a = a * 0.85 + fieldAngle(x / S, y / S) * 0.15;
      const nx = x + Math.cos(a) * step, ny = y + Math.sin(a) * step;
      if (nx < M || nx > S - M || ny < M || ny > S - M) break;
      if (hitsForeign(nx, ny, rad, id)) break;
      x = nx; y = ny; fwd.push([x, y]); markDisc(x, y, rad, id);
    }
    // backward from the seed point
    const bwd = [];
    x = sx; y = sy;
    a = fieldAngle(x / S, y / S) + Math.PI;
    for (let s = 0; s < maxSteps; s++) {
      a = a * 0.85 + (fieldAngle(x / S, y / S) + Math.PI) * 0.15;
      const nx = x + Math.cos(a) * step, ny = y + Math.sin(a) * step;
      if (nx < M || nx > S - M || ny < M || ny > S - M) break;
      if (hitsForeign(nx, ny, rad, id)) break;
      x = nx; y = ny; bwd.push([x, y]); markDisc(x, y, rad, id);
    }
    bwd.reverse();
    const pts = bwd.concat(fwd);
    // path length
    let len = 0;
    for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    // wide ribbons must earn their width with length: no tadpoles
    const minLen = S * (0.13 + (w / S) * 6);
    if (len < minLen || pts.length < 12) return null;
    return { pts, w, color, frayColor, dark, cls, len };
  }

  // lay ribbons until the square feels full; retry the whole field if it starves
  let attempts = 0;
  for (let guard = 0; guard < 4 && ribbons.length < 14; guard++) {
    occ.fill(-1); ribbons.length = 0; ribbonId = 0; attempts = 0;
    while (ribbons.length < 52 && attempts < 900) {
      attempts++;
      const r = growRibbon();
      if (r) ribbons.push(r);
    }
  }

  // heroes get drawn first (under), fines last (over)
  ribbons.sort((a, b) => (b.w - a.w));

  function strokeRibbon(r) {
    const pts = r.pts, n = pts.length;
    ctx.strokeStyle = r.color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const taperN = Math.max(2, Math.floor(n * 0.07));
    // draw in segments so the width can taper at the ends
    for (let i = 1; i < n; i++) {
      const t = Math.min(i, n - i) / taperN;
      const tw = r.w * (0.35 + 0.65 * Math.min(1, t));
      ctx.lineWidth = tw;
      ctx.beginPath();
      ctx.moveTo(pts[i - 1][0], pts[i - 1][1]);
      ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
    }
    // frayed tail: three thin strands wander off the end
    const end = pts[n - 1], prev = pts[n - 4];
    const baseA = Math.atan2(end[1] - prev[1], end[0] - prev[0]);
    ctx.strokeStyle = r.frayColor;
    for (let k = -1; k <= 1; k++) {
      const fa = baseA + k * 0.27 + (rnd() - 0.5) * 0.16;
      const fl = r.len * 0.085 * (0.7 + rnd() * 0.6);
      ctx.lineWidth = Math.max(1, r.w * 0.22);
      ctx.beginPath();
      ctx.moveTo(end[0], end[1]);
      ctx.quadraticCurveTo(
        end[0] + Math.cos(fa) * fl * 0.5, end[1] + Math.sin(fa) * fl * 0.5 + (rnd() - 0.5) * 6,
        end[0] + Math.cos(fa) * fl, end[1] + Math.sin(fa) * fl
      );
      ctx.stroke();
    }
  }

  for (const r of ribbons) strokeRibbon(r);

  // paper grain: restrained
  for (let i = 0; i < 3500; i++) {
    const gx = rnd() * S, gy = rnd() * S;
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(20,16,10,0.05)' : 'rgba(235,225,200,0.05)';
    ctx.fillRect(gx, gy, 1.4, 1.4);
  }

  ctx.restore();
}

resize();
</script>
</body>
</html>
