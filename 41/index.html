<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№41 · Light Orbit</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#050505; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,255,255,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to orbit</div>
<script>
'use strict';
// No41 Light Orbit (after mathiaskrissmer, prompt 6 via Bug).
// Three great circles of a sphere, drawn as if by a moving point of
// light. Each ring turns around a different axis at an integer rate,
// so the 28 second loop closes exactly. The glow is not a filter:
// each ring is stroked in three additive passes, wide and faint,
// medium, then a thin bright core. White on #050505, nothing else.
// Drag orbits the viewpoint; on release it eases back to the loop.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '41', 10) || 41;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#050505';
const LOOP = 28;
// ring r: plane tilt (ax, ay), spin cycles per loop
const RINGS = [
  { ax: 0.45, ay: 0.2, spin: 1 },
  { ax: 1.15, ay: -0.5, spin: -2 },
  { ax: -0.7, ay: 1.05, spin: 3 }
];
let viewDrag = { x: 0, y: 0 };
let viewEase = { x: 0, y: 0 };
let dragging = false;
let dragStart = null;

function rot(p, ax, ay, az) {
  let [x, y, z] = p;
  let c = Math.cos(ax), s = Math.sin(ax);
  [y, z] = [y * c - z * s, y * s + z * c];
  c = Math.cos(ay); s = Math.sin(ay);
  [x, z] = [x * c + z * s, -x * s + z * c];
  c = Math.cos(az); s = Math.sin(az);
  [x, y] = [x * c - y * s, x * s + y * c];
  return [x, y, z];
}

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const t = (nowMs / 1000) % LOOP;
  viewEase.x *= 0.985; viewEase.y *= 0.985;
  const vx = 0.5 + viewDrag.x + viewEase.x;
  const vy = 0.7 + viewDrag.y + viewEase.y;
  const cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) * 0.34;

  const passes = [
    { a: 0.08, lw: 0.030 },
    { a: 0.25, lw: 0.012 },
    { a: 0.7, lw: 0.0045 }
  ];
  ctx.globalCompositeOperation = 'lighter';
  for (const ring of RINGS) {
    const spinA = (t / LOOP) * Math.PI * 2 * ring.spin;
    const pts = [];
    for (let i = 0; i <= 128; i++) {
      const a = (i / 128) * Math.PI * 2;
      let p = [Math.cos(a), Math.sin(a), 0];
      p = rot(p, ring.ax, ring.ay, spinA);
      p = rot(p, vx, vy, 0);
      pts.push([cx + p[0] * R, cy + p[1] * R]);
    }
    for (const pass of passes) {
      ctx.strokeStyle = 'rgba(255,255,255,' + pass.a + ')';
      ctx.lineWidth = Math.max(0.7, R * pass.lw * 2);
      ctx.beginPath();
      pts.forEach(([x, y], i) => { if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  return {};
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(6500);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

canvas.addEventListener('pointerdown', ev => {
  dragging = true;
  dragStart = { x: ev.clientX, y: ev.clientY, vx: viewDrag.x, vy: viewDrag.y };
  viewEase = { x: 0, y: 0 };
});
canvas.addEventListener('pointermove', ev => {
  if (!dragging || !dragStart) return;
  const [w, h] = viewportWH();
  viewDrag.x = dragStart.vx + ((ev.clientY - dragStart.y) / h) * 2.4;
  viewDrag.y = dragStart.vy + ((ev.clientX - dragStart.x) / w) * 2.4;
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  viewEase = { x: viewDrag.x, y: viewDrag.y };
  viewDrag = { x: 0, y: 0 };
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
