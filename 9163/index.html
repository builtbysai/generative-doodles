<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e2ecf8">
<title>Snow and ice &mdash; Generative Doodle No.9163</title>
<style>
  html, body { margin: 0; height: 100%; background: #e2ecf8; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// Snow and ice &mdash; Generative Doodle No.9163
// Extracted from the Dragon backgrounds test bench Hans saved. Background only:
// no creatures. Drag to stamp footprints. Tap to switch between fire and frost; hold in fire mode to melt glowing holes.
// <!-- snow-and-ice-9163 -->
const cv = document.getElementById('c'), g = cv.getContext('2d');
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const rr = (a, b) => a + Math.random() * (b - a);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hash = (x, y, s = 0) => { const h = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return h - Math.floor(h); };
const vnoise = (x, y, s = 0) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash(xi, yi, s), hash(xi + 1, yi, s), u), lerp(hash(xi, yi + 1, s), hash(xi + 1, yi + 1, s), u), v); };
const fbm = (x, y, s = 0, o = 4) => { let a = 0.5, f = 1, t = 0, n = 0; for (let i = 0; i < o; i++) { t += a * vnoise(x * f, y * f, s + i * 7); n += a; a *= 0.5; f *= 2; } return t / n; };
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; };
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
function glowSprite(stops, size = 64) { const c = mkCanvas(size, size), x = c.getContext('2d'), r = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2); for (const [o, col] of stops) r.addColorStop(o, col); x.fillStyle = r; x.fillRect(0, 0, size, size); return c; }
const FLAME = glowSprite([[0, 'rgba(255,248,200,1)'], [0.25, 'rgba(255,190,70,.85)'], [0.6, 'rgba(255,100,20,.35)'], [1, 'rgba(200,40,0,0)']]);
const SMOKE = glowSprite([[0, 'rgba(90,84,78,.5)'], [0.6, 'rgba(90,84,78,.2)'], [1, 'rgba(90,84,78,0)']]);
const GLOW = glowSprite([[0, 'rgba(255,200,110,1)'], [0.35, 'rgba(255,140,50,.4)'], [1, 'rgba(255,90,20,0)']]);
const C = { W: 0, H: 0, dpr: 1, t: 0, u: 1, px: 0, py: 0, pin: false, down: false, pdx: 0, pdy: 0, moved: 0, click: null, mode: null, hot: [], steps: [], fireOn: false, shake: 0, walker: null, scene: null, wind: null, fireSprite: null, key: false, suppressFire: false, lastMove: 0 };
const AC = window.AudioContext || window.webkitAudioContext;
let audio = null, audioOn = false;
function unlockAudio() { if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (audio && audio.state === 'suspended') audio.resume(); }
function growl(vol = 0.5) {
  if (!audio) return; const t = audio.currentTime, o = audio.createOscillator(), o2 = audio.createOscillator(), f = audio.createBiquadFilter(), gn = audio.createGain(), lf = audio.createOscillator(), lg = audio.createGain();
  o.type = 'sawtooth'; o2.type = 'square'; o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.9); o2.frequency.setValueAtTime(35, t);
  f.type = 'lowpass'; f.frequency.setValueAtTime(420, t); f.frequency.exponentialRampToValueAtTime(120, t + 0.9);
  lf.frequency.value = 24; lg.gain.value = 0.35; lf.connect(lg); lg.connect(gn.gain);
  gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol * 0.5, t + 0.08); gn.gain.exponentialRampToValueAtTime(0.001, t + 1);
  o.connect(f); o2.connect(f); f.connect(gn); gn.connect(audio.destination); o.start(t); o2.start(t); lf.start(t); o.stop(t + 1.05); o2.stop(t + 1.05); lf.stop(t + 1.05);
}
function blip(freq = 660, dur = 0.15, vol = 0.12) {
  if (!audio) return; const t = audio.currentTime, o = audio.createOscillator(), gn = audio.createGain(); o.type = 'sine'; o.frequency.value = freq;
  gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(gn); gn.connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
}
// Audio is part of the original scenes (growl/blip). Created only on the
// first pointer gesture; suspended on tab hide, window blur, page close.
document.addEventListener('visibilitychange', () => { if (document.hidden && audio) audio.suspend(); });
addEventListener('blur', () => { if (audio) audio.suspend(); });
addEventListener('pagehide', () => { if (audio) audio.suspend(); });

// ---- presence shim: the dragon's movement brain, invisible ----
// The scenes were written around a dragon (walker): they steer it, stamp
// footprints from its path, and burn grass where its body passes. Here the
// presence follows the pointer (or wanders slowly when idle) and is never
// drawn. Its trail (P) is what flattens grass, parts fog and burns.
class Presence {
  constructor() { this.x = 0; this.y = 0; this.h = 0; this.v = 0; this.n = 26; this.P = []; this.style = { body: '#8a2c1c', belly: '#e0a850', line: '#2a0f0a', eye: '#ffd24a' }; this.hidden = false; this.awake = 1; this.sleepCurl = 0; this.speedK = 1; this.fireK = 0; this.dist = 0; this.stepSide = 1; this.phase = 0; }
  get sp() { return 13 * C.u; }
  reset(x, y) { this.x = x; this.y = y; this.h = 0; this.v = 0; this.P = Array.from({ length: this.n }, (_, i) => ({ x: x - i * 13, y })); }
  steer(dt, tx, ty, stop = 40 * C.u) {
    const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy), want = Math.atan2(dy, dx);
    let df = want - this.h; df = Math.atan2(Math.sin(df), Math.cos(df));
    const vmax = 250 * C.u * this.speedK, tv = d > stop ? vmax * clamp((d - stop) / (120 * C.u), 0.15, 1) : 0;
    this.v += (tv - this.v) * (1 - Math.exp(-dt * 4));
    const turn = clamp(3.6 * (0.5 + this.v / (vmax || 1)), 1.2, 5);
    this.h += clamp(df, -turn * dt, turn * dt);
    this.x += Math.cos(this.h) * this.v * dt; this.y += Math.sin(this.h) * this.v * dt;
    this.x = clamp(this.x, 0, C.W); this.y = clamp(this.y, 0, C.H);
    this.phase += this.v * dt / (22 * C.u); this.dist += this.v * dt;
    const stride = 26 * C.u;
    if (this.dist > stride) { this.dist -= stride; this.stepSide *= -1; C.steps.push({ x: this.x - Math.cos(this.h) * 40 * C.u, y: this.y - Math.sin(this.h) * 40 * C.u, a: this.h, side: this.stepSide }); }
    this.follow();
  }
  follow() {
    const P = this.P, sp = this.sp; if (!P.length) return; P[0].x = this.x; P[0].y = this.y;
    for (let i = 1; i < P.length; i++) { const a = P[i - 1], b = P[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1; b.x = a.x + dx / d * sp; b.y = a.y + dy / d * sp; }
  }
  wid(i) { return (Math.pow(1 - i / this.n, 0.8) * 8 + 1.2) * C.u * (i < 3 ? 1 + (3 - i) * 0.1 : 1); }
}

const fire = [];
function updateFire(dt) {
  const w = C.walker; C.hot.length = 0;
  if (C.fireOn && w && !w.hidden && w.awake > 0.5) {
    w.fireK = Math.min(1, (w.fireK || 0) + dt * 6);
    const n = 150 * dt * C.u + Math.random(); for (let i = 0; i < n && fire.length < 700; i++) {
      const a = w.h + (Math.random() + Math.random() - 1) * 0.13, sp = rr(300, 420) * C.u;
      fire.push({ x: w.x + Math.cos(w.h) * 16 * C.u, y: w.y + Math.sin(w.h) * 16 * C.u, vx: Math.cos(a) * sp + w.v * Math.cos(w.h) * 0.4, vy: Math.sin(a) * sp, age: 0, life: rr(0.45, 0.65), s: rr(6, 10) * C.u });
    }
  } else if (w) w.fireK = Math.max(0, (w.fireK || 0) - dt * 5);
  for (let i = fire.length - 1; i >= 0; i--) {
    const q = fire[i]; q.age += dt; if (q.age >= q.life) { fire[i] = fire[fire.length - 1]; fire.pop(); continue; }
    const f = q.age / q.life, dr = Math.exp(-dt * 2.4), turb = 90 * f * C.u;
    q.vx = q.vx * dr + (vnoise(q.x * 0.02 + C.t * 2, q.y * 0.02, 3) - 0.5) * turb * dt * 10 + (C.wind ? C.wind.x * dt * 40 : 0);
    q.vy = q.vy * dr + (vnoise(q.x * 0.02, q.y * 0.02 + C.t * 2, 9) - 0.5) * turb * dt * 10 - 30 * dt * C.u + (C.wind ? C.wind.y * dt * 40 : 0);
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (f < 0.75 && q.age > 0.03) C.hot.push({ x: q.x, y: q.y, r: q.s * (1 + f * 1.8), p: 1 - f });
  }
}
function drawFire(g, dark) {
  g.save(); g.globalCompositeOperation = dark ? 'lighter' : 'source-over';
  for (const q of fire) {
    const f = q.age / q.life, s = q.s * (0.8 + 2 * Math.pow(f, 0.8)); g.globalAlpha = (dark ? 0.5 : 0.7) * Math.min(1, f * 14) * Math.pow(1 - f, 0.7);
    g.drawImage(C.fireSprite || FLAME, q.x - s, q.y - s, s * 2, s * 2);
  }
  g.restore();
}
// Register the single scene for this piece.
const scene = def => { C.scene = def; };
(() => {
  const CS = 6; let gw, gh, m, heat, foot, rime, nz, small, sctx, imgd, flakes, ICE, water = 0;
  const mix = (a, b, t) => a + (b - a) * t;
  function build() {
    gw = Math.ceil(C.W / CS); gh = Math.ceil(C.H / CS); const n = gw * gh;
    m = new Float32Array(n); heat = new Float32Array(n); foot = new Float32Array(n); rime = new Float32Array(n); nz = new Float32Array(n);
    for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) nz[j * gw + i] = fbm(i * 0.07, j * 0.07, 8, 4) * 0.7 + Math.random() * 0.3;
    small = mkCanvas(gw, gh); sctx = small.getContext('2d'); imgd = sctx.createImageData(gw, gh);
    flakes = Array.from({ length: Math.round(C.W * C.H / 6000) }, () => ({ x: rr(0, C.W), y: rr(0, C.H), v: rr(18, 46), r: rr(0.8, 2.4), ph: Math.random() * 9 }));
  }
  ICE = glowSprite([[0, 'rgba(255,255,255,1)'], [0.3, 'rgba(190,235,255,.85)'], [0.65, 'rgba(100,180,240,.35)'], [1, 'rgba(60,120,220,0)']]);
  function stamp(x, y, rad, v) { const i0 = Math.max(0, (x - rad) / CS | 0), i1 = Math.min(gw - 1, (x + rad) / CS | 0), j0 = Math.max(0, (y - rad) / CS | 0), j1 = Math.min(gh - 1, (y + rad) / CS | 0);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) if (Math.hypot(i * CS - x, j * CS - y) < rad) foot[j * gw + i] = v; }
  scene({
    name: 'Snow and ice', desc: 'A frozen lake under snow. Footprints stay behind, fire melts glowing holes, and the water refreezes slowly. Frost breath does the opposite.',
    hint: 'Hold to breathe. Switch to Frost to heal the ice and fill your tracks.',
    modes: [{ id: 'fire', label: 'Fire dragon' }, { id: 'frost', label: 'Frost dragon' }],
    actions: [{ label: 'Fresh snow', run: () => build() }],
    stat: () => `open water ${water}%`,
    onMode(id) { C.fireSprite = id === 'frost' ? ICE : null; Object.assign(C.walker.style, id === 'frost' ? { body: '#3f6f9e', belly: '#d8f0ff', line: '#12263a', eye: '#bff3ff' } : { body: '#8a2c1c', belly: '#e0a850', line: '#2a0f0a', eye: '#ffd24a' }); },
    init() { build(); },
    update(dt) {
      for (const s of C.steps) { stamp(s.x + Math.cos(s.a + 1.57) * 7 * s.side, s.y + Math.sin(s.a + 1.57) * 7 * s.side, 8 * C.u, 1); }
      const frost = C.mode === 'frost';
      for (const h of C.hot) {
        const i0 = Math.max(0, (h.x - h.r) / CS | 0), i1 = Math.min(gw - 1, (h.x + h.r) / CS | 0), j0 = Math.max(0, (h.y - h.r) / CS | 0), j1 = Math.min(gh - 1, (h.y + h.r) / CS | 0);
        for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { const f = 1 - Math.hypot(i * CS - h.x, j * CS - h.y) / h.r; if (f <= 0) continue; const k = j * gw + i;
          if (frost) { m[k] = Math.max(0, m[k] - dt * 3 * f * h.p); foot[k] = Math.max(0, foot[k] - dt * 3 * f); rime[k] = Math.min(1, rime[k] + dt * 2.5 * f * h.p); }
          else { m[k] = Math.min(1, m[k] + dt * 2.2 * f * h.p); heat[k] = Math.max(heat[k], f * h.p); foot[k] = Math.max(0, foot[k] - dt * 2); rime[k] = 0; } }
      }
      const n = gw * gh; let wc = 0, ex = Math.exp(-dt * 2.6);
      for (let k = 0; k < n; k++) { if (heat[k] > 0) { heat[k] *= ex; if (heat[k] < 0.03) heat[k] = 0; } if (heat[k] < 0.1 && m[k] > 0) m[k] = Math.max(0, m[k] - dt / 22); if (foot[k] > 0) foot[k] = Math.max(0, foot[k] - dt / 50); if (rime[k] > 0) rime[k] = Math.max(0, rime[k] - dt / 18); if (m[k] > 0.6) wc++; }
      water = Math.round(wc / n * 100);
      for (const f of flakes) { f.y += f.v * dt; f.x += Math.sin(C.t * 0.8 + f.ph) * 14 * dt - 6 * dt; if (f.y > C.H + 4) { f.y = -4; f.x = rr(0, C.W); } if (f.x < -4) f.x = C.W + 4; }
    },
    draw(g) {
      const d = imgd.data;
      for (let k = 0, n = gw * gh; k < n; k++) {
        const nn = nz[k], mm = m[k], ft = foot[k], hh = heat[k], rm = rime[k];
        let r = 226 + nn * 24, gg = 236 + nn * 16, b = 248 + nn * 6;
        if (ft > 0) { const f = ft * 0.75; r = mix(r, 168, f); gg = mix(gg, 190, f); b = mix(b, 220, f); }
        if (rm > 0) { r = mix(r, 252, rm * 0.8); gg = mix(gg, 254, rm * 0.8); b = mix(b, 255, rm * 0.8); }
        if (mm > 0.02) { const t1 = sstep(0.03, 0.3, mm), t2 = sstep(0.28, 0.78, mm);
          r = mix(r, 196, t1); gg = mix(gg, 232, t1); b = mix(b, 246, t1); r = mix(r, 18 + nn * 12, t2); gg = mix(gg, 62 + nn * 18, t2); b = mix(b, 104 + nn * 20, t2); }
        if (hh > 0.02) { r += 255 * hh * 0.95; gg += 130 * hh; b += 10 * hh; }
        const o = k * 4; d[o] = r; d[o + 1] = gg; d[o + 2] = b; d[o + 3] = 255;
      }
      sctx.putImageData(imgd, 0, 0); g.imageSmoothingEnabled = true; g.drawImage(small, 0, 0, gw * CS, gh * CS);
      g.fillStyle = 'rgba(255,255,255,.9)'; for (const f of flakes) { g.beginPath(); g.arc(f.x, f.y, f.r * C.u, 0, TAU); g.fill(); }
    }
  });
})();
// Tap handler for this scene.
function onTap(x, y) { C.mode = C.mode === 'fire' ? 'frost' : 'fire'; C.scene.onMode(C.mode); }

// ---- harness: resize, pointer, tap, frame loop ----
function resize() {
  const dpr = C.dpr = Math.min(2, window.devicePixelRatio || 1);
  C.W = innerWidth; C.H = innerHeight; cv.width = C.W * dpr; cv.height = C.H * dpr; C.u = clamp(Math.min(C.W / 1100, C.H / 760), 0.62, 1.25);
  if (C.scene) C.scene.init();
}
addEventListener('resize', resize);

let downT = 0, downMoved = 0;
function setP(e) {
  const r = cv.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
  C.pdx = x - C.px; C.pdy = y - C.py; C.moved += Math.hypot(C.pdx, C.pdy);
  C.px = x; C.py = y; C.pin = true; C.lastMove = C.t;
  if (C.down) downMoved += Math.hypot(C.pdx, C.pdy);
}
cv.addEventListener('pointermove', setP);
cv.addEventListener('pointerdown', e => {
  unlockAudio(); setP(e); C.down = true; C.click = { x: C.px, y: C.py };
  downT = performance.now(); downMoved = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  C.scene && C.scene.onDown && C.scene.onDown(C.px, C.py);
});
const up = e => {
  C.down = false;
  C.scene && C.scene.onUp && C.scene.onUp();
  if (performance.now() - downT < 250 && downMoved < 10 && typeof onTap === 'function') onTap(C.px, C.py);
};
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', () => { if (!C.down) C.pin = false; });

let last = 0;
function frame(ts) {
  const dt = Math.min(0.033, last ? (ts - last) / 1000 : 0.016); last = ts; C.t += dt;
  const s = C.scene, w = C.walker;
  C.fireOn = C.down && !C.suppressFire && (!s.fireWhen || s.fireWhen());
  if (s.drive) s.drive(dt);
  else if (C.pin && C.t - (C.lastMove || 0) < 6) w.steer(dt, C.px, C.py);
  else w.steer(dt, C.W * (0.5 + 0.3 * Math.cos(C.t * 0.23)), C.H * (0.55 + 0.22 * Math.sin(C.t * 0.31)), 10);
  updateFire(dt); s.update(dt);
  C.click = null; C.steps.length = 0; C.moved = 0;
  g.setTransform(C.dpr, 0, 0, C.dpr, 0, 0);
  const sh = C.shake > 0.1 ? C.shake : 0;
  if (sh) g.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  C.shake *= Math.exp(-dt * 6);
  s.draw(g); drawFire(g, !!s.dark); s.drawTop && s.drawTop(g);
  requestAnimationFrame(frame);
}

C.walker = new Presence();
resize();
C.mode = C.scene.modes ? C.scene.modes[0].id : null;
C.walker.reset(C.W * 0.3, C.H * 0.6);
requestAnimationFrame(frame);

</script>
</body>
