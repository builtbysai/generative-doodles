<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Inside, Honored</title>
<style>
  html, body { margin: 0; padding: 0; background: #101013; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (strict: a real bench, amber on dark green) ----------
  var BENCH = '#101013';
  var BOARD = '#1B2A1E';
  var HEART = '#1E3324';
  var TRACE = '#D8A545';
  var PULSE = '#FFD97A';
  var CAP = '#2A2D36';
  var SILVER = '#9AA0AE';
  var RIBBON = '#3A3D46';
  var LED = '#FF3B30';

  // ---------- sim constants ----------
  var STEP = 1 / 120;          // fixed sim step, seconds
  var PREROLL = 2400;          // 20 s at 120 Hz: frame one lives here
  var BASE_SEED = 1029190;
  var TWO_PI = Math.PI * 2;

  var seed = BASE_SEED;
  var simTime = 0;

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1;
  var phoneNow = false;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function fit() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    if (vv && vv.width) { W = vv.width; H = vv.height; }
    else if (typeof window !== 'undefined' && window.innerWidth) { W = window.innerWidth; H = window.innerHeight; }
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var p = isPhone();
    if (p !== phoneNow) { phoneNow = p; build(seed); rebuildIndex(); }
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { fit(); draw(); });
    }
  }

  // ---------- device construction ----------
  // cells: array of components in grid order.
  // board: {kind:'board', cell, fx0,fy0,fx1,fy1 (fractions of cell),
  //         paths: [ {pts:[[fx,fy]..] in board fractions, cum:[..], len} ],
  //         theta, omega, prevMod, pulses:[{path, d0, speed}], heart:bool}
  // caps:  {kind:'caps', cell, items:[{fx,fy,r}]}
  // ribbon:{kind:'ribbon', cell, pts:[[fx,fy]..] spiral in cell fractions}
  var cells = [];
  var boards = [];       // references to board components (oscillators)
  var heartBoard = null;
  var cols = 4, rows = 3;

  function makeTrace(rng, w, h) {
    // random-walk Manhattan trace between seeded nodes, in board fractions.
    var nodes = [];
    var nn = 5 + Math.floor(rng() * 3); // 5..7 nodes
    var i;
    for (i = 0; i < nn; i++) {
      nodes.push([0.10 + rng() * 0.80, 0.12 + rng() * 0.76]);
    }
    var pts = [[nodes[0][0], nodes[0][1]]];
    for (i = 1; i < nn; i++) {
      var a = nodes[i - 1], b = nodes[i];
      var cx = a[0], cy = a[1];
      // walk: alternate horizontal / vertical legs with one mid jog
      var midx = cx + (b[0] - cx) * (0.35 + rng() * 0.3);
      pts.push([midx, cy]);
      pts.push([midx, b[1]]);
      pts.push([b[0], b[1]]);
      cx = b[0]; cy = b[1];
    }
    // cumulative lengths in fraction space
    var cum = [0], len = 0;
    for (i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      len += Math.sqrt(dx * dx + dy * dy);
      cum.push(len);
    }
    return { pts: pts, cum: cum, len: len, nodes: nodes };
  }

  function pointAt(path, d) {
    if (d <= 0) return path.pts[0];
    if (d >= path.len) return path.pts[path.pts.length - 1];
    var lo = 0, hi = path.cum.length - 1;
    while (lo < hi - 1) { var mid = (lo + hi) >> 1; if (path.cum[mid] <= d) lo = mid; else hi = mid; }
    var seg = path.cum[hi] - path.cum[lo];
    var t = seg > 0 ? (d - path.cum[lo]) / seg : 0;
    var a = path.pts[lo], b = path.pts[hi];
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  }

  function build(s) {
    var rng = mulberry32(s);
    var phone = isPhone();
    cols = phone ? 3 : 4;
    rows = phone ? 4 : 3;
    var n = cols * rows;
    var heartIdx = phone ? 4 : 5; // row 1, col 1: the center of the table
    cells = []; boards = []; heartBoard = null;

    // component kinds per cell, seeded shuffle around fixed anchors
    var kinds = [];
    var i;
    for (i = 0; i < n; i++) kinds.push('board');
    kinds[heartIdx] = 'heart';
    // two capacitor cells and one ribbon cell, chosen by seeded draw
    var free = [];
    for (i = 0; i < n; i++) if (i !== heartIdx) free.push(i);
    function take() { return free.splice(Math.floor(rng() * free.length), 1)[0]; }
    kinds[take()] = 'caps';
    kinds[take()] = 'caps';
    kinds[take()] = 'ribbon';

    for (i = 0; i < n; i++) {
      var kind = kinds[i];
      if (kind === 'board' || kind === 'heart') {
        var big = (kind === 'heart');
        var b = {
          kind: 'board', heart: big, cell: i,
          fx0: 0.10 + rng() * 0.06, fy0: 0.12 + rng() * 0.06,
          fx1: 0.90 - rng() * 0.06, fy1: 0.88 - rng() * 0.06,
          paths: [], pulses: [],
          theta: rng() * TWO_PI,
          omega: 0, prevMod: 0, flash: 0
        };
        if (big) { b.fx0 = 0.05; b.fy0 = 0.07; b.fx1 = 0.95; b.fy1 = 0.93; }
        b.paths.push(makeTrace(rng));
        if (big) b.paths.push(makeTrace(rng)); // the heart carries a second bus
        // rhythms: heart leads at the base rate, others detuned around it
        var base = TWO_PI * 0.42;
        b.omega = big ? base : base * (0.85 + rng() * 0.30);
        b.prevMod = b.theta % Math.PI;
        boards.push(b);
        if (big) heartBoard = b;
        cells.push(b);
      } else if (kind === 'caps') {
        var items = [];
        var nc = 3 + Math.floor(rng() * 2);
        for (var k = 0; k < nc; k++) {
          items.push({ fx: 0.22 + (k % 2) * 0.42 + rng() * 0.08, fy: 0.28 + Math.floor(k / 2) * 0.36 + rng() * 0.08, r: 0.11 + rng() * 0.035 });
        }
        cells.push({ kind: 'caps', cell: i, items: items });
      } else {
        // ribbon cable: a flat spiral, in cell fractions
        var sp = [], turns = 3.2, steps = 90;
        for (var q = 0; q <= steps; q++) {
          var u = q / steps, ang = u * turns * TWO_PI, rad = 0.07 + u * 0.30;
          sp.push([0.5 + Math.cos(ang) * rad * 1.25, 0.5 + Math.sin(ang) * rad]);
        }
        cells.push({ kind: 'ribbon', cell: i, pts: sp });
      }
    }
    simTime = 0;
  }

  // grid neighbors (indices) for Kuramoto coupling
  function neighbors(idx) {
    var c = idx % cols, r = Math.floor(idx / cols), out = [];
    if (c > 0) out.push(idx - 1);
    if (c < cols - 1) out.push(idx + 1);
    if (r > 0) out.push(idx - cols);
    if (r < rows - 1) out.push(idx + cols);
    return out;
  }
  var boardByCell = {};
  function rebuildIndex() {
    boardByCell = {};
    for (var i = 0; i < boards.length; i++) boardByCell[boards[i].cell] = boards[i];
  }

  // ---------- interaction state ----------
  var soloBoard = null, soloUntil = -1;
  var probe = null; // {x, y, until} in unit coords of the layout area
  var lastTapT = -10, lastTapCell = -1, downInfo = null;

  // ---------- audio (lazy, guarded) ----------
  var AC = null, lastTickAt = 0, lastShimmerAt = 0;
  function audio() {
    if (AC) return AC;
    var Ctor = null;
    if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
    else if (typeof window !== 'undefined' && window.webkitAudioContext) Ctor = window.webkitAudioContext;
    if (!Ctor) return null;
    try { AC = new Ctor(); } catch (e) { AC = null; }
    return AC;
  }
  function blip(freqA, freqB, dur, gain) {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freqA, t);
    o.frequency.exponentialRampToValueAtTime(freqB, t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function tickSound() {
    if (!AC) return; // sound only after a gesture has created the context
    var ac = AC;
    var now = ac.currentTime;
    if (now - lastTickAt < 0.04) return;
    lastTickAt = now;
    blip(1700, 1200, 0.035, 0.025);
  }
  function shimmerSound() {
    if (!AC) return;
    var ac = AC;
    var now = ac.currentTime;
    if (now - lastShimmerAt < 3) return;
    lastShimmerAt = now;
    blip(500, 1500, 0.7, 0.02);
    blip(750, 2250, 0.7, 0.012);
  }

  // ---------- simulation ----------
  var coherence = 0;

  function spawnPulse(b, pathIdx) {
    var path = b.paths[pathIdx || 0];
    b.pulses.push({ path: pathIdx || 0, d: 0, speed: path.len / 1.15 });
  }

  function step() {
    simTime += STEP;
    var i, j, b;
    // Kuramoto-style coupling: neighbors pull phases together, heart leads all.
    var K = 0.55, KH = 0.30;
    var dth = [];
    for (i = 0; i < boards.length; i++) {
      b = boards[i];
      var pull = 0;
      var nb = neighbors(b.cell);
      for (j = 0; j < nb.length; j++) {
        var o = boardByCell[nb[j]];
        if (o) pull += Math.sin(o.theta - b.theta);
      }
      if (nb.length) pull = pull / nb.length;
      var heartPull = heartBoard && heartBoard !== b ? Math.sin(heartBoard.theta - b.theta) : 0;
      dth.push(b.omega + K * pull + KH * heartPull);
    }
    var sx = 0, sy = 0;
    for (i = 0; i < boards.length; i++) {
      b = boards[i];
      b.theta += dth[i] * STEP;
      sx += Math.cos(b.theta); sy += Math.sin(b.theta);
      // spawn a pulse on each half-cycle crossing: the board speaks twice per period
      var mod = b.theta % Math.PI;
      if (mod < b.prevMod) { // wrapped
        spawnPulse(b, 0);
        if (b.heart) spawnPulse(b, 1);
        b.flash = 1;
      }
      b.prevMod = mod;
      if (b.flash > 0) b.flash = Math.max(0, b.flash - STEP * 1.4);
    }
    coherence = Math.sqrt(sx * sx + sy * sy) / boards.length;
    if (coherence > 0.86) shimmerSound();

    // advance pulses
    for (i = 0; i < boards.length; i++) {
      b = boards[i];
      for (j = b.pulses.length - 1; j >= 0; j--) {
        var p = b.pulses[j];
        p.d += p.speed * STEP;
        if (p.d >= b.paths[p.path].len) { b.pulses.splice(j, 1); tickSound(); }
      }
    }
    if (probe && simTime > probe.until) probe = null;
    if (soloBoard && simTime > soloUntil) soloBoard = null;
  }

  // ---------- layout ----------
  function layout() {
    var mx = Math.min(W, H) * 0.055;
    var x0 = mx, y0 = mx, w = W - mx * 2, h = H - mx * 2;
    return { x0: x0, y0: y0, w: w, h: h, cw: w / cols, ch: h / rows };
  }
  function cellRect(L, idx) {
    var c = idx % cols, r = Math.floor(idx / cols);
    return { x: L.x0 + c * L.cw, y: L.y0 + r * L.ch, w: L.cw, h: L.ch };
  }
  function boardRect(L, b) {
    var cr = cellRect(L, b.cell);
    return {
      x: cr.x + b.fx0 * cr.w, y: cr.y + b.fy0 * cr.h,
      w: (b.fx1 - b.fx0) * cr.w, h: (b.fy1 - b.fy0) * cr.h
    };
  }

  // ---------- drawing ----------
  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BENCH;
    ctx.fillRect(0, 0, W, H);
    var L = layout();
    var i, j, k;

    // agreement glow: boards brighten as their phase meets the heart's
    var heartTheta = heartBoard ? heartBoard.theta : 0;

    for (i = 0; i < cells.length; i++) {
      var comp = cells[i];
      var cr = cellRect(L, comp.cell);
      if (comp.kind === 'caps') {
        // lead lines between capacitors, quiet amber
        ctx.strokeStyle = TRACE; ctx.globalAlpha = 0.4; ctx.lineWidth = 1;
        ctx.beginPath();
        for (k = 0; k < comp.items.length; k++) {
          var it = comp.items[k];
          var px = cr.x + it.fx * cr.w, py = cr.y + it.fy * cr.h;
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
        for (k = 0; k < comp.items.length; k++) {
          var it2 = comp.items[k];
          var cx = cr.x + it2.fx * cr.w, cy = cr.y + it2.fy * cr.h, rr = it2.r * Math.min(cr.w, cr.h);
          ctx.globalAlpha = 1;
          ctx.fillStyle = CAP;
          ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TWO_PI); ctx.fill();
          ctx.fillStyle = SILVER;
          ctx.beginPath(); ctx.arc(cx, cy, rr * 0.62, 0, TWO_PI); ctx.fill();
          ctx.fillStyle = CAP;
          ctx.beginPath(); ctx.arc(cx, cy, rr * 0.2, 0, TWO_PI); ctx.fill();
        }
        ctx.globalAlpha = 1;
        continue;
      }
      if (comp.kind === 'ribbon') {
        ctx.strokeStyle = RIBBON; ctx.lineWidth = Math.max(2, Math.min(cr.w, cr.h) * 0.035);
        ctx.globalAlpha = 0.95; ctx.lineJoin = 'round';
        ctx.beginPath();
        for (k = 0; k < comp.pts.length; k++) {
          var sp = comp.pts[k];
          var sxp = cr.x + sp[0] * cr.w, syp = cr.y + sp[1] * cr.h;
          if (k === 0) ctx.moveTo(sxp, syp); else ctx.lineTo(sxp, syp);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
        continue;
      }
      // ---- a board ----
      var b = comp;
      var br = boardRect(L, b);
      var dim = (soloBoard && soloBoard !== b) ? 0.32 : 1;
      var agree = Math.pow(Math.max(0, Math.cos(b.theta - heartTheta)), 6);
      ctx.globalAlpha = dim;

      ctx.fillStyle = b.heart ? HEART : BOARD;
      ctx.fillRect(br.x, br.y, br.w, br.h);
      // agreement wash
      if (agree > 0.02) {
        ctx.fillStyle = PULSE; ctx.globalAlpha = dim * agree * 0.10;
        ctx.fillRect(br.x, br.y, br.w, br.h);
        ctx.globalAlpha = dim;
      }
      // edge + corner screws: the careful disassembly
      ctx.strokeStyle = TRACE; ctx.globalAlpha = dim * 0.35; ctx.lineWidth = 1;
      ctx.strokeRect(br.x + 0.5, br.y + 0.5, br.w - 1, br.h - 1);
      ctx.fillStyle = SILVER; ctx.globalAlpha = dim * 0.8;
      var sc = [[br.x + 5, br.y + 5], [br.x + br.w - 5, br.y + 5], [br.x + 5, br.y + br.h - 5], [br.x + br.w - 5, br.y + br.h - 5]];
      for (k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(sc[k][0], sc[k][1], 1.6, 0, TWO_PI); ctx.fill(); }
      ctx.globalAlpha = dim;

      // traces
      for (var pi = 0; pi < b.paths.length; pi++) {
        var path = b.paths[pi];
        ctx.strokeStyle = TRACE; ctx.globalAlpha = dim * 0.68; ctx.lineWidth = 1.2; ctx.lineJoin = 'round';
        ctx.beginPath();
        for (k = 0; k < path.pts.length; k++) {
          var pt = path.pts[k];
          var X = br.x + pt[0] * br.w, Y = br.y + pt[1] * br.h;
          if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
        }
        ctx.stroke();
        // lit segment under each pulse on this path
        for (j = 0; j < b.pulses.length; j++) {
          var pu = b.pulses[j];
          if (pu.path !== pi) continue;
          ctx.strokeStyle = PULSE; ctx.globalAlpha = dim * 0.95; ctx.lineWidth = 2.2;
          ctx.beginPath();
          var dA = Math.max(0, pu.d - path.len * 0.07), dB = Math.min(path.len, pu.d + path.len * 0.07);
          var segN = 6;
          for (var sg = 0; sg <= segN; sg++) {
            var pp = pointAt(path, dA + (dB - dA) * (sg / segN));
            var PX = br.x + pp[0] * br.w, PY = br.y + pp[1] * br.h;
            if (sg === 0) ctx.moveTo(PX, PY); else ctx.lineTo(PX, PY);
          }
          ctx.stroke();
        }
        // node dots where traces meet
        ctx.fillStyle = TRACE; ctx.globalAlpha = dim * 0.85;
        for (k = 0; k < path.nodes.length; k++) {
          var nd = path.nodes[k];
          ctx.beginPath(); ctx.arc(br.x + nd[0] * br.w, br.y + nd[1] * br.h, 1.8, 0, TWO_PI); ctx.fill();
        }
      }
      // pulses: bright dots with small halos
      for (j = 0; j < b.pulses.length; j++) {
        var pu2 = b.pulses[j];
        var pa = b.paths[pu2.path];
        var pos = pointAt(pa, pu2.d);
        var HX = br.x + pos[0] * br.w, HY = br.y + pos[1] * br.h;
        ctx.fillStyle = PULSE; ctx.globalAlpha = dim * 0.18;
        ctx.beginPath(); ctx.arc(HX, HY, 6, 0, TWO_PI); ctx.fill();
        ctx.globalAlpha = dim;
        ctx.beginPath(); ctx.arc(HX, HY, 2.4, 0, TWO_PI); ctx.fill();
      }
      // heart status LED: the leader, blinking with its own phase
      if (b.heart) {
        var ledOn = Math.max(Math.pow(Math.max(0, Math.cos(b.theta)), 3), b.flash * 0.9, 0.35);
        var lx = br.x + br.w - 13, ly = br.y + 13;
        ctx.fillStyle = LED; ctx.globalAlpha = 0.45 + 0.55 * ledOn;
        ctx.beginPath(); ctx.arc(lx, ly, 3.4, 0, TWO_PI); ctx.fill();
        if (ledOn > 0.25) {
          ctx.globalAlpha = (ledOn - 0.25) * 0.45;
          ctx.beginPath(); ctx.arc(lx, ly, 8, 0, TWO_PI); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      ctx.globalAlpha = 1;
    }

    // probe glow
    if (probe) {
      var L2 = layout();
      var gx = L2.x0 + probe.x * L2.w, gy = L2.y0 + probe.y * L2.h;
      ctx.fillStyle = PULSE; ctx.globalAlpha = 0.15;
      ctx.beginPath(); ctx.arc(gx, gy, 26, 0, TWO_PI); ctx.fill();
      ctx.globalAlpha = 0.35;
      ctx.beginPath(); ctx.arc(gx, gy, 12, 0, TWO_PI); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- pointer interaction ----------
  function toUnit(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX - rect.left), y = (e.clientY - rect.top);
    var L = layout();
    return { u: (x - L.x0) / L.w, v: (y - L.y0) / L.h, x: x, y: y };
  }
  function boardAt(u, v) {
    var L = layout();
    var c = Math.floor(u * cols), r = Math.floor(v * rows);
    if (c < 0 || r < 0 || c >= cols || r >= rows) return null;
    return boardByCell[r * cols + c] || null;
  }
  function onDown(e) {
    audio();
    var p = toUnit(e);
    downInfo = { u: p.u, v: p.v, t: simTime, moved: false };
    probeAt(p);
  }
  function onMove(e) {
    if (!downInfo) return;
    var p = toUnit(e);
    if (Math.abs(p.u - downInfo.u) > 0.02 || Math.abs(p.v - downInfo.v) > 0.02) downInfo.moved = true;
    if (downInfo.moved) probeAt(p);
  }
  function probeAt(p) {
    probe = { x: p.u, y: p.v, until: simTime + 0.9 };
    var b = boardAt(p.u, p.v);
    if (b) {
      // inject a pulse on the probed board and nudge its phase toward the heart
      spawnPulse(b, 0);
      if (heartBoard && b !== heartBoard) b.theta += 0.35 * Math.sin(heartBoard.theta - b.theta);
      b.flash = 1;
      blip(1300, 2400, 0.09, 0.04);
    }
  }
  function onUp(e) {
    if (!downInfo) return;
    var wasDrag = downInfo.moved;
    var p = toUnit(e);
    downInfo = null;
    if (wasDrag) return;
    // a tap
    var b = boardAt(p.u, p.v);
    var cellIdx = b ? b.cell : -1;
    if (simTime - lastTapT < 0.35 && cellIdx === lastTapCell) {
      // double tap: new device
      seed = (seed * 1664525 + 1013904223) >>> 0;
      build(seed); rebuildIndex();
      for (var i = 0; i < PREROLL; i++) step();
      lastTapT = -10; lastTapCell = -1;
      draw();
      return;
    }
    lastTapT = simTime; lastTapCell = cellIdx;
    if (b) { soloBoard = b; soloUntil = simTime + 8; }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { downInfo = null; });
  }

  // ---------- boot: pre-roll, frame one, live loop ----------
  fit();
  phoneNow = isPhone();
  build(seed);
  rebuildIndex();
  for (var s = 0; s < PREROLL; s++) step();
  draw();

  if (typeof requestAnimationFrame !== 'undefined') {
    var lastMs = null;
    var loop = function (ms) {
      if (lastMs === null) lastMs = ms;
      var elapsed = (ms - lastMs) / 1000;
      lastMs = ms;
      if (elapsed > 0.25) elapsed = 0.25;
      var steps = Math.floor(elapsed / STEP);
      if (steps > 30) steps = 30;
      for (var i = 0; i < steps; i++) step();
      draw();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
