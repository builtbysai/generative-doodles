<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№105 · Black Sand Drift</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D0B08; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(216,203,178,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to lean the creatures</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mixc(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function hashN(x,y){ const n=Math.sin(x*127.1+y*311.7)*43758.5453123; return n-Math.floor(n); }
function grainH(x,y,k){ let n=(x*374761393 + y*668265263 + k*974634211)|0; n=(n^(n>>13))|0; n=Math.imul(n,1274126177); return ((n^(n>>16))>>>0)/4294967295; }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi; const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf); const a=hashN(xi,yi), b=hashN(xi+1,yi), c=hashN(xi,yi+1), d=hashN(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }

// No.105 Black Sand Drift (after mulf, made.up.lifeforms section):
// software shader route, field sampled on a reduced grid (FIELD_CELL px)
// and drawn full-frame. The field is the prompt's domain-warped formula,
// credited here as given:  n1 = noise(V + P1);
//   n2 = noise(V*n1*n1m + P2);  n = noise(V*nm + P3*vec2(n1,n2))
// with seeded constants nm = 1.35, n1m = 1.20, field scale 1.55,
// P bases (0,0) / (5.3, 1.2) / (2.7, 6.1). P1/P2/P3 drift on wrapped
// sine time over the 20s loop. n is threshold-banded into sand, hide,
// rust and bone; a vertical bias keeps the creature mass in the lower
// two thirds with no horizon line. Per-cell grain goes on last.
const FIELD_CELL=7;
const LOOP=20;
const SAND=hexRGB('#0D0B08'), HIDE=hexRGB('#4A3B2C'), BONE=hexRGB('#D8CBB2'), RUST=hexRGB('#8A4A2E');
const NM=1.35, N1M=1.20;
let leanX=0, leanY=0, dragging=false, sx=0, sy=0, tx=0, ty=0;

function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h); const t=nowMs/1000;
  if(!dragging){ leanX*=0.95; leanY*=0.95; } // ease back after release
  const ph=2*Math.PI*t/LOOP;
  // warp vectors drifting on wrapped sine time; the fingertip shifts the warp centre
  const p1x=0.55*Math.sin(ph), p1y=0.55*(Math.cos(ph)-1);
  const p2x=5.3+0.45*Math.sin(ph*2+1.0), p2y=1.2+0.45*(Math.cos(ph*2+1.0)-1);
  const p3x=2.7+0.40*Math.sin(ph+2.2), p3y=6.1+0.40*(Math.cos(ph+2.2)-1);
  const cx=leanX*0.9, cy=leanY*0.9;
  const gk=Math.floor(t*7); // grain shimmer bucket, deterministic per frame time
  const cell=isPhone()?FIELD_CELL+2:FIELD_CELL, cols=Math.ceil(w/cell), rows=Math.ceil(h/cell), m=Math.min(w,h)/2;
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    const u=((i+0.5)*cell-w/2)/m, v=((j+0.5)*cell-h/2)/m;
    const vx=u*1.55+cx, vy=v*1.55+cy;
    const n1=vnoise(vx+p1x, vy+p1y);
    const n2=vnoise(vx*n1*N1M+p2x, vy*n1*N1M+p2y);
    let n=vnoise(vx*NM+p3x*n1, vy*NM+p3y*n2);
    n+=(vnoise(vx*3.1+9.4, vy*3.1+4.2)-0.5)*0.16; // detail term: breaks plateaus into ridges
    n+=v*0.16; // vertical bias: creature mass gathers in the lower two thirds
    let col;
    if(n<0.46) col=mixc(SAND, HIDE, smooth((n-0.38)/0.08)*0.6);
    else if(n<0.58) col=mixc(HIDE, RUST, smooth((n-0.49)/0.09)*0.65);
    else if(n<0.78) col=mixc(RUST, HIDE, smooth((n-0.58)/0.20)*0.55);
    else { const pk=smooth((n-0.78)/0.05)*(1-smooth((n-0.88)/0.05)); col=mixc(HIDE, BONE, pk*0.7); } // bone is a narrow ridge band; the highest cores fall back to hide
    const g=(grainH(i,j,gk)-0.5)*10; // fine grain over everything, added last
    ctx.fillStyle='rgb('+Math.round(clamp(col[0]+g,0,255))+','+Math.round(clamp(col[1]+g,0,255))+','+Math.round(clamp(col[2]+g,0,255))+')';
    ctx.fillRect(i*cell,j*cell,cell+1,cell+1);
  }
  return {};
}
function ptr(e){ const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{left:0,top:0}; return [e.clientX-r.left, e.clientY-r.top]; }
canvas.addEventListener('pointerdown',e=>{ dragging=true; const p=ptr(e); sx=p[0]; sy=p[1]; tx=p[0]; ty=p[1]; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; const p=ptr(e); tx=p[0]; ty=p[1]; const [w,h]=viewportWH(); leanX=clamp((tx-w/2)/(w*0.6),-1,1); leanY=clamp((ty-h/2)/(h*0.6),-1,1); });
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(11000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
