<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№845 Remix the Cassette Archive</title>
<style>
  html, body { margin: 0; padding: 0; background: #12201c; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №845 Remix the Cassette Archive, SN7 / PP1245, study #260 syd-nuku.
  // A magic-realist marsh at dusk, collaged fragments: stencilled title
  // text, Arabic script, four sea-and-umbrella panels, cassette shells
  // half-buried in reeds. Palette: marsh green gone blue, stencil black,
  // cassette-label orange, dusk gold. The marsh fills the frame; archive
  // fragments collage at odd scales. Reeds sway, fragments drift as if
  // in water, a tape spool turns. Drag scrubs a tape head across the
  // frame; fragments near the head rearrange and remix into new collage
  // orders, then settle. Study ref: M7 sonic-materialist short film.
  var GROUND = '#12201c'; // page ground, marsh green gone blue

  // Fixed-phase first frame: FIRST_T = 12 s. The cycle is 90 s: reeds
  // sway on 6-11 s periods, fragments drift on 34-72 s periods, the
  // turning spool makes one revolution per 24 s. At t = 12 the spool has
  // turned half a revolution, the reeds are mid-sway and every fragment
  // is visible, so the first frame shows the archive at rest in the
  // marsh, legible, never empty.
  var FIRST_T = 12;
  var CYCLE = 90;
  var SEED = 845;
  var SPOOL_PERIOD = 24; // seconds per revolution of the turning spool
  var DRAG_RADIUS = 0.30; // fraction of min(stageW, stageH)
  var SETTLE_DUR = 1.4; // seconds for a reshuffled fragment to settle
  var REMIX_COOLDOWN = 0.5; // seconds before a fragment can remix again

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x) {
    var i = Math.floor(x), f = x - i;
    var u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function lerp(a, b, f) { return a + (b - a) * f; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: marsh green gone blue, stencil black, cassette-label
  // orange, dusk gold.
  var SKY_TOP = [26, 58, 56];
  var SKY_MID = [58, 94, 82];
  var HORIZON = [201, 154, 74];
  var WATER = [24, 46, 42];
  var WATER_DEEP = [16, 32, 30];
  var REED = [52, 84, 62];
  var REED_DARK = [18, 38, 30];
  var REED_LIGHT = [74, 110, 78];
  var PAPER = [232, 224, 204];
  var PAPER_DIM = [214, 204, 182];
  var INK = [20, 18, 16];
  var ORANGE = [214, 110, 42];
  var ORANGE_DEEP = [178, 84, 30];
  var GOLD = [217, 164, 65];
  var GOLD_PALE = [232, 192, 106];
  var SEA = [46, 90, 94];
  var SEA_DARK = [30, 66, 70];
  var TEAL = [42, 110, 110];
  var TAPE_DARK = [23, 19, 15];
  var CAPTION = [232, 214, 170];

  // ---- Fragments -------------------------------------------------
  // Each fragment is a collaged archive scrap: base top-left position
  // and size in stage fractions, rotation, drift (slow water motion)
  // and remix state (drag-driven reshuffle with a settle animation).
  var rng = mulberry32(SEED * 31 + 7);
  function mkFrag(kind, x, y, w, h, rot, extra) {
    var f = {
      kind: kind, x: x, y: y, w: w, h: h, rot: rot,
      driftAmp: 0.004 + rng() * 0.005,
      driftPeriod: 34 + rng() * 38,
      driftPhase: rng() * Math.PI * 2,
      offX: 0, offY: 0, offRot: 0, // settled remix offsets
      remix: null, // {start, dur, fromX, fromY, toX, toY, fromR, toR}
      lastRemix: -10
    };
    if (extra) {
      for (var k in extra) { f[k] = extra[k]; }
    }
    return f;
  }
  var FRAGS = [
    mkFrag('title', 0.06, 0.08, 0.58, 0.19, -0.035),
    mkFrag('script', 0.70, 0.07, 0.25, 0.20, 0.05),
    mkFrag('sea', 0.08, 0.32, 0.17, 0.17, -0.04, { accent: 'orange' }),
    mkFrag('sea', 0.29, 0.28, 0.13, 0.13, 0.06, { accent: 'gold' }),
    mkFrag('sea', 0.47, 0.30, 0.20, 0.20, -0.02, { accent: 'black' }),
    mkFrag('sea', 0.72, 0.33, 0.15, 0.15, 0.05, { accent: 'teal' }),
    mkFrag('ribbon', 0.34, 0.52, 0.32, 0.09, 0.01),
    mkFrag('cassette', 0.50, 0.64, 0.36, 0.21, -0.06, { big: true }),
    mkFrag('cassette', 0.07, 0.72, 0.24, 0.14, 0.10, { big: false })
  ];
  // Draw order, bottom to top. Cassettes sit on top, half-buried by the
  // front reeds drawn after them.
  var ORDER = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  var dragSeq = 0;

  // Per-fragment seeded detail: script stroke control points, ribbon
  // path points, sea-panel wave offsets, cassette label lines.
  var DETAIL = [];
  (function () {
    var i, j;
    for (i = 0; i < FRAGS.length; i++) {
      var d = { bumps: [], dots: [], waves: [], lines: [] };
      var r2 = mulberry32(SEED * 101 + i * 17 + 3);
      for (j = 0; j < 12; j++) { d.bumps.push(r2() * 2 - 1); }
      for (j = 0; j < 9; j++) { d.dots.push([r2(), r2()]); }
      for (j = 0; j < 6; j++) { d.waves.push(r2() * 2 - 1); }
      for (j = 0; j < 3; j++) { d.lines.push(0.3 + r2() * 0.6); }
      DETAIL.push(d);
    }
  })();

  // ---- Reeds -----------------------------------------------------
  // Two layers: back reeds behind the fragments, front reeds in front
  // of them so the cassettes read as half-buried. Seeded at load.
  var BACK_REEDS = [], FRONT_REEDS = [];
  (function () {
    var r3 = mulberry32(SEED * 7 + 11);
    var i;
    for (i = 0; i < 30; i++) {
      BACK_REEDS.push({
        x: r3(), h: 0.10 + r3() * 0.12,
        period: 6 + r3() * 5, phase: r3() * Math.PI * 2,
        amp: 0.006 + r3() * 0.006, w: 1.4 + r3() * 1.2
      });
    }
    for (i = 0; i < 24; i++) {
      FRONT_REEDS.push({
        x: r3(), h: 0.22 + r3() * 0.20,
        period: 6 + r3() * 5, phase: r3() * Math.PI * 2,
        amp: 0.008 + r3() * 0.008, w: 2 + r3() * 1.6,
        head: r3() < 0.45
      });
    }
  })();

  // Water shimmer streaks: seeded positions, gold, alpha breathing.
  var STREAKS = [];
  (function () {
    var r4 = mulberry32(SEED * 13 + 29);
    var i;
    for (i = 0; i < 16; i++) {
      STREAKS.push({
        x: r4(), y: 0.58 + r4() * 0.37, len: 0.05 + r4() * 0.15,
        period: 9 + r4() * 20, phase: r4() * Math.PI * 2,
        maxA: 0.05 + r4() * 0.09
      });
    }
  })();

  // Distant reed silhouettes along the horizon, seeded.
  var HORIZON_REEDS = [];
  (function () {
    var r5 = mulberry32(SEED * 17 + 41);
    var i;
    for (i = 0; i < 64; i++) {
      HORIZON_REEDS.push({ x: r5(), h: 0.008 + r5() * 0.022 });
    }
  })();

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Cycle -----------------------------------------------------
  function spoolAngle(t) {
    return 2 * Math.PI * (t / SPOOL_PERIOD);
  }
  function driftOf(f, t) {
    return {
      x: f.driftAmp * Math.sin(2 * Math.PI * t / f.driftPeriod + f.driftPhase),
      y: f.driftAmp * 0.6 * Math.cos(2 * Math.PI * t / (f.driftPeriod * 1.3) + f.driftPhase)
    };
  }
  // Current remix offset for a fragment at time t. Pure function of
  // the fragment's remix record and t, so the settled arrangement is
  // deterministic given the same drag path.
  function remixOf(f, t) {
    if (reduced || !f.remix) { return { x: f.offX, y: f.offY, r: f.offRot }; }
    var p = (t - f.remix.start) / f.remix.dur;
    if (p >= 1) { return { x: f.offX, y: f.offY, r: f.offRot }; }
    if (p < 0) { p = 0; }
    var s = smooth(p);
    return {
      x: lerp(f.remix.fromX, f.remix.toX, s),
      y: lerp(f.remix.fromY, f.remix.toY, s),
      r: lerp(f.remix.fromR, f.remix.toR, s) + 0.05 * Math.sin(p * Math.PI * 2) * (1 - p)
    };
  }
  function fragCenter(f, t) {
    var d = driftOf(f, t), o = remixOf(f, t);
    return { x: (f.x + f.w / 2 + d.x + o.x) * W, y: (f.y + f.h / 2 + d.y + o.y) * H };
  }

  // ---- Marsh background ------------------------------------------
  function drawMarsh(t) {
    var hy = 0.55 * H;
    // Dusk sky: deep teal-green down to a gold band at the horizon.
    var sky = ctx.createLinearGradient(0, 0, 0, hy);
    sky.addColorStop(0, rgb(SKY_TOP));
    sky.addColorStop(0.62, rgb(SKY_MID));
    sky.addColorStop(1, rgb(HORIZON));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, hy + 1);
    // Water: dark blue-green, deepening toward the bottom.
    var wat = ctx.createLinearGradient(0, hy, 0, H);
    wat.addColorStop(0, rgb(WATER));
    wat.addColorStop(1, rgb(WATER_DEEP));
    ctx.fillStyle = wat;
    ctx.fillRect(0, hy, W, H - hy);

    // Dusk gold disc, half sunk at the horizon.
    var sx = 0.74 * W, sy = 0.53 * H, sr = 0.045 * Math.min(W, H);
    ctx.fillStyle = rgba(GOLD_PALE, a4(0.85));
    ctx.beginPath();
    ctx.moveTo(sx + sr, sy);
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
    // Gold reflection column under the disc.
    var rg = ctx.createLinearGradient(0, hy, 0, H);
    rg.addColorStop(0, rgba(GOLD, a4(0.14)));
    rg.addColorStop(1, rgba(GOLD, 0));
    ctx.fillStyle = rg;
    ctx.fillRect(sx - sr * 0.8, hy, sr * 1.6, H - hy);

    // Slow dark cloud streaks in the sky, flattened so they read as
    // streaks, not discs.
    var i, cx, cy, cw;
    ctx.fillStyle = rgba(INK, a4(0.08));
    for (i = 0; i < 4; i++) {
      cx = ((0.15 + i * 0.22) + 0.02 * Math.sin(2 * Math.PI * t / (60 + i * 17) + i)) * W;
      cy = (0.10 + i * 0.08) * H;
      cw = (0.14 + i * 0.03) * W;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1, 0.30);
      ctx.beginPath();
      ctx.moveTo(cw, 0);
      ctx.arc(0, 0, cw, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Distant reed silhouettes along the horizon.
    ctx.strokeStyle = rgba(REED_DARK, a4(0.85));
    ctx.lineWidth = Math.max(1, W * 0.0016);
    ctx.lineCap = 'round';
    for (i = 0; i < HORIZON_REEDS.length; i++) {
      var hr = HORIZON_REEDS[i];
      var hx = hr.x * W, hh = hr.h * H;
      ctx.beginPath();
      ctx.moveTo(hx, hy + 1);
      ctx.lineTo(hx + 0.001 * W, hy - hh);
      ctx.stroke();
    }

    // Water shimmer: gold streaks breathing slowly.
    for (i = 0; i < STREAKS.length; i++) {
      var st = STREAKS[i];
      var sa = st.maxA * (0.5 + 0.5 * Math.sin(2 * Math.PI * t / st.period + st.phase));
      if (sa <= 0.01) { continue; }
      ctx.strokeStyle = rgba(GOLD_PALE, a4(sa));
      ctx.lineWidth = Math.max(1, H * 0.0016);
      ctx.beginPath();
      ctx.moveTo(st.x * W, st.y * H);
      ctx.lineTo((st.x + st.len) * W, st.y * H);
      ctx.stroke();
    }
  }

  // ---- Reeds -----------------------------------------------------
  function drawReedLayer(list, t, color, front) {
    var i, r, bx, by, tipX, tipY, sway;
    for (i = 0; i < list.length; i++) {
      r = list[i];
      bx = r.x * W;
      by = H;
      sway = r.amp * W * Math.sin(2 * Math.PI * t / r.period + r.phase);
      tipX = bx + sway;
      tipY = H - r.h * H;
      ctx.strokeStyle = rgba(color, a4(front ? 0.92 : 0.75));
      ctx.lineWidth = Math.max(1, r.w);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(bx + sway * 0.4, by - r.h * H * 0.55, tipX, tipY);
      ctx.stroke();
      if (front && r.head) {
        var hr = Math.max(1.5, W * 0.004);
        ctx.fillStyle = rgba(REED_LIGHT, a4(0.85));
        ctx.beginPath();
        ctx.moveTo(tipX + hr, tipY);
        ctx.arc(tipX, tipY, hr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---- Fragment painters -----------------------------------------
  // All painters work in local coordinates centered on the fragment,
  // fw/fh in px. They must not depend on t except for the turning
  // spool in the cassette painter.
  function paperRect(fw, fh, shade) {
    ctx.fillStyle = rgba([0, 0, 0], a4(0.28));
    ctx.fillRect(-fw / 2 + fw * 0.012, -fh / 2 + fh * 0.015, fw, fh);
    ctx.fillStyle = rgb(shade);
    ctx.fillRect(-fw / 2, -fh / 2, fw, fh);
    ctx.strokeStyle = rgba(INK, a4(0.35));
    ctx.lineWidth = Math.max(1, fw * 0.004);
    ctx.strokeRect(-fw / 2, -fh / 2, fw, fh);
  }

  function drawTitle(f, t, fw, fh) {
    paperRect(fw, fh, PAPER);
    var lines = ['REMIX THE', 'CASSETTE ARCHIVE'];
    var fs = Math.min(fw * 0.082, fh * 0.36);
    ctx.fillStyle = rgb(INK);
    ctx.font = '700 ' + Math.round(fs) + 'px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    var i, li, line, adv, totalW, x0, y0;
    for (li = 0; li < 2; li++) {
      line = lines[li];
      adv = fs * 0.62;
      totalW = adv * line.length;
      x0 = -totalW / 2;
      y0 = (li === 0 ? -fh * 0.10 : fh * 0.30);
      for (i = 0; i < line.length; i++) {
        ctx.fillText(line[i], x0 + adv * (i + 0.5), y0);
      }
      // Stencil bridges: paper-colored bars cutting each line twice,
      // the classic stencil interruption.
      ctx.fillStyle = rgb(PAPER);
      ctx.fillRect(-totalW / 2, y0 - fs * 0.55, totalW, fs * 0.09);
      ctx.fillRect(-totalW / 2, y0 - fs * 0.20, totalW, fs * 0.09);
      ctx.fillStyle = rgb(INK);
    }
    ctx.textAlign = 'left';
  }

  function drawScript(f, t, fw, fh) {
    paperRect(fw, fh, PAPER_DIM);
    var d = DETAIL[FRAGS.indexOf(f)];
    var li, x, y, k, px, py;
    ctx.strokeStyle = rgba(INK, a4(0.85));
    ctx.fillStyle = rgba(INK, a4(0.85));
    ctx.lineCap = 'round';
    // Three lines of abstract script-like glyph strokes: wavy
    // connected baselines with dots, no legible words.
    for (li = 0; li < 3; li++) {
      y = -fh * 0.28 + li * fh * 0.26;
      ctx.lineWidth = Math.max(1, fw * 0.014);
      ctx.beginPath();
      ctx.moveTo(-fw * 0.40, y);
      for (k = 0; k < 6; k++) {
        px = -fw * 0.40 + (k + 1) * fw * 0.133;
        py = y + d.bumps[li * 4 + (k % 4)] * fh * 0.07;
        ctx.quadraticCurveTo(-fw * 0.40 + (k + 0.5) * fw * 0.133, y - fh * 0.09, px, py);
      }
      ctx.stroke();
      // Dots above and below the line, as script diacritics suggest.
      for (k = 0; k < 3; k++) {
        var dot = d.dots[li * 3 + k];
        var dx = -fw * 0.35 + dot[0] * fw * 0.7;
        var dy = y + (dot[1] < 0.5 ? -1 : 1) * fh * (0.10 + dot[1] * 0.06);
        var dr = Math.max(0.8, fw * 0.008);
        ctx.beginPath();
        ctx.moveTo(dx + dr, dy);
        ctx.arc(dx, dy, dr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // A torn corner: small paper-colored triangle over the edge.
    ctx.fillStyle = rgb(GROUND);
    ctx.beginPath();
    ctx.moveTo(fw / 2, -fh / 2);
    ctx.lineTo(fw / 2 - fw * 0.10, -fh / 2);
    ctx.lineTo(fw / 2, -fh / 2 + fh * 0.12);
    ctx.closePath();
    ctx.fill();
  }

  function drawSea(f, t, fw, fh) {
    paperRect(fw, fh, PAPER);
    var accent = f.accent;
    var skyC = [196, 206, 188], seaC = SEA;
    ctx.fillStyle = rgb(skyC);
    ctx.fillRect(-fw / 2, -fh / 2, fw, fh * 0.45);
    ctx.fillStyle = rgb(seaC);
    ctx.fillRect(-fw / 2, -fh / 2 + fh * 0.45, fw, fh * 0.55);
    // Horizon line and two wave strokes.
    ctx.strokeStyle = rgba(INK, a4(0.6));
    ctx.lineWidth = Math.max(1, fw * 0.008);
    ctx.beginPath();
    ctx.moveTo(-fw / 2, -fh * 0.05);
    ctx.lineTo(fw / 2, -fh * 0.05);
    ctx.stroke();
    var d = DETAIL[FRAGS.indexOf(f)];
    ctx.strokeStyle = rgba(PAPER, a4(0.55));
    ctx.lineWidth = Math.max(1, fw * 0.01);
    var wi;
    for (wi = 0; wi < 2; wi++) {
      var wy = fh * (0.18 + wi * 0.16);
      var woff = d.waves[wi] * fw * 0.08;
      ctx.beginPath();
      ctx.moveTo(-fw * 0.38 + woff, wy);
      ctx.quadraticCurveTo(woff, wy - fh * 0.03, fw * 0.38 + woff, wy);
      ctx.stroke();
    }
    // Umbrella: canopy semicircle, ribs, stick, sea reflection.
    var uc = (accent === 'orange') ? ORANGE : (accent === 'gold') ? GOLD :
             (accent === 'teal') ? TEAL : INK;
    var ux = 0, uy = -fh * 0.02, ur = fw * 0.24;
    ctx.fillStyle = rgb(uc);
    ctx.beginPath();
    ctx.moveTo(ux - ur, uy);
    ctx.arc(ux, uy, ur, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba(INK, a4(0.55));
    ctx.lineWidth = Math.max(1, fw * 0.008);
    var ri;
    for (ri = -1; ri <= 1; ri++) {
      ctx.beginPath();
      ctx.moveTo(ux, uy - ur);
      ctx.lineTo(ux + ri * ur * 0.85, uy);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(ux, uy - ur);
    ctx.lineTo(ux, uy + fh * 0.30);
    ctx.stroke();
    ctx.strokeStyle = rgba(uc, a4(0.5));
    ctx.beginPath();
    ctx.moveTo(ux, uy + fh * 0.32);
    ctx.lineTo(ux, uy + fh * 0.44);
    ctx.stroke();
  }

  function drawRibbon(f, t, fw, fh) {
    var d = DETAIL[FRAGS.indexOf(f)];
    // A loose curl of tape ribbon snaking across the marsh.
    ctx.strokeStyle = rgb(TAPE_DARK);
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(2, fh * 0.22);
    ctx.beginPath();
    ctx.moveTo(-fw * 0.48, fh * 0.10);
    ctx.quadraticCurveTo(-fw * 0.20, -fh * 0.45 + d.bumps[0] * fh * 0.1,
      fw * 0.05, fh * 0.05);
    ctx.quadraticCurveTo(fw * 0.28, fh * 0.45, fw * 0.48, -fh * 0.15);
    ctx.stroke();
    // Oxide side catching the dusk light along the same curl.
    ctx.strokeStyle = rgba(GOLD, a4(0.55));
    ctx.lineWidth = Math.max(1, fh * 0.06);
    ctx.beginPath();
    ctx.moveTo(-fw * 0.48, fh * 0.10 - fh * 0.08);
    ctx.quadraticCurveTo(-fw * 0.20, -fh * 0.53 + d.bumps[0] * fh * 0.1,
      fw * 0.05, fh * -0.03);
    ctx.quadraticCurveTo(fw * 0.28, fh * 0.37, fw * 0.48, -fh * 0.23);
    ctx.stroke();
    // A small curl at the far end.
    ctx.strokeStyle = rgb(TAPE_DARK);
    ctx.lineWidth = Math.max(1.5, fh * 0.14);
    ctx.beginPath();
    ctx.moveTo(fw * 0.48, -fh * 0.15);
    ctx.arc(fw * 0.44, -fh * 0.28, fh * 0.16, 0, Math.PI * 1.5);
    ctx.stroke();
  }

  var cassetteSpoolPos = null; // world px of the big cassette's spool
  var fragCX = 0, fragCY = 0, fragRot = 0; // current fragment transform
  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  function drawCassette(f, t, fw, fh) {
    // Soft water shadow under the shell.
    ctx.fillStyle = rgba([0, 0, 0], a4(0.30));
    ctx.beginPath();
    ctx.moveTo(fw * 0.48, fh * 0.42);
    ctx.arc(0, fh * 0.42, fw * 0.48, 0, Math.PI * 2);
    ctx.fill();
    // Shell: near-black rounded body.
    ctx.fillStyle = rgb([28, 26, 24]);
    roundedRect(-fw / 2, -fh / 2, fw, fh, fh * 0.12);
    ctx.fill();
    ctx.strokeStyle = rgba([0, 0, 0], a4(0.7));
    ctx.lineWidth = Math.max(1, fw * 0.005);
    ctx.stroke();
    // Orange label with abstract label lines.
    var lw = fw * 0.72, lh = fh * 0.34;
    ctx.fillStyle = rgb(ORANGE);
    ctx.fillRect(-lw / 2, -fh * 0.38, lw, lh);
    var d = DETAIL[FRAGS.indexOf(f)];
    ctx.strokeStyle = rgba(INK, a4(0.75));
    ctx.lineWidth = Math.max(1, fh * 0.03);
    var li;
    for (li = 0; li < 2; li++) {
      var ly = -fh * 0.30 + li * fh * 0.12;
      ctx.beginPath();
      ctx.moveTo(-lw / 2 + fw * 0.06, ly);
      ctx.lineTo(-lw / 2 + fw * 0.06 + lw * d.lines[li], ly);
      ctx.stroke();
    }
    // Tape window with two spools.
    var wy = fh * 0.16, wh = fh * 0.34;
    ctx.fillStyle = rgb([12, 11, 10]);
    roundedRect(-fw * 0.32, wy - wh / 2, fw * 0.64, wh, fh * 0.06);
    ctx.fill();
    var spoolR = fh * 0.115;
    var centers = [[-fw * 0.16, wy], [fw * 0.16, wy]];
    var si, ang, sp;
    for (si = 0; si < 2; si++) {
      var scx = centers[si][0], scy = centers[si][1];
      ctx.fillStyle = rgb([42, 38, 34]);
      ctx.beginPath();
      ctx.moveTo(scx + spoolR, scy);
      ctx.arc(scx, scy, spoolR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = rgba(GOLD_PALE, a4(0.6));
      ctx.lineWidth = Math.max(1, fw * 0.004);
      ctx.beginPath();
      ctx.moveTo(scx + spoolR, scy);
      ctx.arc(scx, scy, spoolR, 0, Math.PI * 2);
      ctx.stroke();
      // Spokes. The big cassette's left spool turns with the cycle;
      // the other spools counter-rotate slowly.
      if (f.big && si === 0) { ang = spoolAngle(t); }
      else { ang = -spoolAngle(t) * 0.7 + si; }
      ctx.strokeStyle = rgba(GOLD_PALE, a4(0.85));
      ctx.lineWidth = Math.max(1, fw * 0.006);
      for (sp = 0; sp < 3; sp++) {
        var a2 = ang + sp * Math.PI * 2 / 3;
        ctx.beginPath();
        ctx.moveTo(scx, scy);
        ctx.lineTo(scx + Math.cos(a2) * spoolR * 0.9, scy + Math.sin(a2) * spoolR * 0.9);
        ctx.stroke();
      }
      ctx.fillStyle = rgb(GOLD);
      ctx.beginPath();
      ctx.moveTo(scx + spoolR * 0.22, scy);
      ctx.arc(scx, scy, spoolR * 0.22, 0, Math.PI * 2);
      ctx.fill();
      if (f.big && si === 0) {
        // Record the turning spool's world position for the tape line,
        // using the fragment's current transform (drift + remix).
        var cosr = Math.cos(fragRot), sinr = Math.sin(fragRot);
        var lx = scx, ly = scy;
        var wx = fragCX + (lx * cosr - ly * sinr);
        var wy2 = fragCY + (lx * sinr + ly * cosr);
        cassetteSpoolPos = { x: wx, y: wy2 };
      }
    }
    // Corner screws.
    ctx.fillStyle = rgba(GOLD_PALE, a4(0.7));
    var ci, corners = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
    for (ci = 0; ci < 4; ci++) {
      var sx2 = corners[ci][0] * fw * 0.44, sy2 = corners[ci][1] * fh * 0.40;
      var sr2 = Math.max(1, fw * 0.008);
      ctx.beginPath();
      ctx.moveTo(sx2 + sr2, sy2);
      ctx.arc(sx2, sy2, sr2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFragment(f, t) {
    var d = driftOf(f, t), o = remixOf(f, t);
    var cx = (f.x + f.w / 2 + d.x + o.x) * W;
    var cy = (f.y + f.h / 2 + d.y + o.y) * H;
    var fw = f.w * W, fh = f.h * H;
    fragCX = cx; fragCY = cy; fragRot = f.rot + o.r;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(f.rot + o.r);
    if (f.kind === 'title') { drawTitle(f, t, fw, fh); }
    else if (f.kind === 'script') { drawScript(f, t, fw, fh); }
    else if (f.kind === 'sea') { drawSea(f, t, fw, fh); }
    else if (f.kind === 'ribbon') { drawRibbon(f, t, fw, fh); }
    else if (f.kind === 'cassette') { drawCassette(f, t, fw, fh); }
    ctx.restore();
  }

  // ---- Tape head and drag ----------------------------------------
  // The tape head rests on the big cassette's label and follows the
  // pointer while dragging. Fragments within DRAG_RADIUS of the head
  // reshuffle their collage order and offsets, then settle.
  var head = { x: 0.60, y: 0.72, dragging: false };
  function applyDrag(px, py, t) {
    head.x = px / W;
    head.y = py / H;
    var R = DRAG_RADIUS * Math.min(W, H);
    var affected = [];
    var i, f, c, dx, dy, dist;
    for (i = 0; i < FRAGS.length; i++) {
      f = FRAGS[i];
      c = fragCenter(f, t);
      dx = c.x - px; dy = c.y - py;
      dist = Math.sqrt(dx * dx + dy * dy);
      if (dist <= R) { affected.push(i); }
    }
    if (affected.length === 0) { return; }
    dragSeq++;
    // Rotate the affected fragments' slots in the draw order by one,
    // so the collage order remixes.
    var slots = [];
    for (i = 0; i < ORDER.length; i++) {
      if (affected.indexOf(ORDER[i]) >= 0) { slots.push(i); }
    }
    if (slots.length > 1) {
      var first = ORDER[slots[0]];
      for (i = 0; i < slots.length - 1; i++) {
        ORDER[slots[i]] = ORDER[slots[i + 1]];
      }
      ORDER[slots[slots.length - 1]] = first;
    }
    // New target offsets from a deterministic stream: same drag path
    // always remixes to the same arrangement.
    var rr = mulberry32(SEED * 7919 + dragSeq * 104729 + 17);
    for (i = 0; i < affected.length; i++) {
      f = FRAGS[affected[i]];
      if (t - f.lastRemix < REMIX_COOLDOWN) { continue; }
      var cur = remixOf(f, t);
      f.remix = {
        start: t, dur: SETTLE_DUR,
        fromX: cur.x, fromY: cur.y, fromR: cur.r,
        toX: (rr() * 2 - 1) * 0.035,
        toY: (rr() * 2 - 1) * 0.025,
        toR: (rr() * 2 - 1) * 0.08
      };
      f.offX = f.remix.toX;
      f.offY = f.remix.toY;
      f.offRot = f.remix.toR;
      f.lastRemix = t;
    }
  }
  function pointerPos(ev) {
    var x, y;
    if (typeof ev.offsetX === 'number' && typeof ev.offsetY === 'number') {
      x = ev.offsetX; y = ev.offsetY;
    } else if (typeof ev.clientX === 'number') {
      var r = { left: stageX, top: stageY };
      try {
        if (typeof canvas.getBoundingClientRect === 'function') {
          r = canvas.getBoundingClientRect();
        }
      } catch (e) {}
      x = ev.clientX - r.left; y = ev.clientY - r.top;
    } else { return null; }
    return { x: x, y: y };
  }
  function onPointerDown(ev) {
    var p = pointerPos(ev);
    if (!p) { return; }
    head.dragging = true;
    applyDrag(p.x, p.y, lastT);
    try { if (ev.preventDefault) { ev.preventDefault(); } } catch (e) {}
  }
  function onPointerMove(ev) {
    if (!head.dragging) { return; }
    var p = pointerPos(ev);
    if (!p) { return; }
    applyDrag(p.x, p.y, lastT);
    try { if (ev.preventDefault) { ev.preventDefault(); } } catch (e) {}
  }
  function onPointerUp() { head.dragging = false; }
  try {
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    canvas.addEventListener('pointerleave', onPointerUp);
  } catch (e) {}

  function drawHead(t) {
    var hx = head.x * W, hy = head.y * H;
    // While dragging, a thin tape line runs from the head to the
    // turning spool on the big cassette.
    if (head.dragging && cassetteSpoolPos) {
      ctx.strokeStyle = rgba(GOLD_PALE, a4(0.35));
      ctx.lineWidth = Math.max(1, W * 0.0016);
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(cassetteSpoolPos.x, cassetteSpoolPos.y);
      ctx.stroke();
    }
    var hw = Math.max(10, W * 0.055), hh = Math.max(5, H * 0.022);
    ctx.fillStyle = rgb([16, 15, 14]);
    ctx.fillRect(hx - hw / 2, hy - hh / 2, hw, hh);
    ctx.strokeStyle = rgba(GOLD_PALE, a4(0.7));
    ctx.lineWidth = Math.max(1, W * 0.0016);
    ctx.strokeRect(hx - hw / 2, hy - hh / 2, hw, hh);
    // Gold gap slit and a small orange dot: the head, not a cursor.
    ctx.strokeStyle = rgb(GOLD);
    ctx.lineWidth = Math.max(1, hh * 0.22);
    ctx.beginPath();
    ctx.moveTo(hx - hw * 0.18, hy);
    ctx.lineTo(hx + hw * 0.18, hy);
    ctx.stroke();
    ctx.fillStyle = rgb(ORANGE);
    ctx.beginPath();
    ctx.moveTo(hx + hw * 0.32, hy);
    ctx.arc(hx + hw * 0.32, hy, Math.max(1.2, hh * 0.18), 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- Captions --------------------------------------------------
  function drawCaptions() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.62));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№845 · Remix the Cassette Archive', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CAPTION, a4(0.45));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 05', W * 0.04, H * 0.055 + L.fsDate + 6);
    // Hint pill, bottom center.
    var hint = 'Drag to remix the archive.';
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width + L.fsHint * 1.6;
    var hh = L.fsHint * 2.1;
    var hx = (W - hw) / 2, hy = H - hh - L.fsHint * 0.7;
    ctx.fillStyle = rgba([10, 16, 14], a4(0.55));
    ctx.fillRect(hx, hy, hw, hh);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CAPTION, a4(0.85));
    ctx.fillText(hint, W / 2, hy + hh * 0.68);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    cassetteSpoolPos = null;

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawMarsh(t);
    drawReedLayer(BACK_REEDS, t, REED, false);
    var i;
    for (i = 0; i < ORDER.length; i++) {
      drawFragment(FRAGS[ORDER[i]], t);
    }
    drawReedLayer(FRONT_REEDS, t, REED_DARK, true);
    drawHead(t);
    drawCaptions();
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece845 exposes the cycle state, the collage order,
  // the remix offsets, and the drag entry point.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece845 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      spool: function (t) { return spoolAngle(t); },
      order: function () { return ORDER.slice(); },
      offsets: function (t) {
        var out = [], i;
        for (i = 0; i < FRAGS.length; i++) { out.push(remixOf(FRAGS[i], t)); }
        return out;
      },
      drag: function (x, y, t) { applyDrag(x, y, t); },
      head: function () { return { x: head.x, y: head.y, dragging: head.dragging }; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: reeds sway on 6-11 s periods, fragments drift on
  // 34-72 s periods, the spool turns once per 24 s, all inside a 90 s
  // ambient cycle. Guarded so node-canvas QA (no
  // requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
