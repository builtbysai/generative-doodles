<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiply-Exposed</title>
<style>
  html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict, nothing else — all tones are mixes of these three).
  var COL = {
    bg: '#141210',    // sepia-black
    bone: '#D8CFC0',  // bone
    red: '#8A1F1F'    // glyph red
  };

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32): fixed seed, fixed data ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(845006);

  // Ruin stripes behind the head: seeded vertical bars (x, width, weight)
  // in portrait units (fractions of u, origin at portrait centre).
  var STRIPES = [];
  (function () {
    var x = -0.30;
    while (x < 0.28) {
      var wdt = 0.012 + rng() * 0.030;
      STRIPES.push({ x: x, w: wdt, k: 0.35 + rng() * 0.65 });
      x += wdt + 0.006 + rng() * 0.026;
    }
  })();
  // Slight seeded rotation per exposure (kept tiny: registration drift only).
  var EXP_ROT = [];
  for (var ri = 0; ri < 4; ri++) EXP_ROT.push((rng() - 0.5) * 0.02);

  // ---------- colour mixing (tones are palette-internal mixes only) ----------
  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mixHex(a, b, f) {
    var A = hexRgb(a), B = hexRgb(b), i, v, out = '#';
    for (i = 0; i < 3; i++) {
      v = Math.round(A[i] + (B[i] - A[i]) * f);
      out += ('0' + v.toString(16)).slice(-2);
    }
    return out;
  }
  // Portrait tones: mixes from the sepia-black ground toward bone.
  var TONE = {
    stripe: mixHex(COL.bg, COL.bone, 0.30),
    skull: mixHex(COL.bg, COL.bone, 0.52),
    plane: mixHex(COL.bg, COL.bone, 0.68),
    brow: mixHex(COL.bg, COL.bone, 0.40),
    dark: mixHex(COL.bg, COL.bone, 0.13),   // sunglasses band, collar
    nose: mixHex(COL.bg, COL.bone, 0.60),
    chest: mixHex(COL.bg, COL.bone, 0.36),
    hand: mixHex(COL.bg, COL.bone, 0.78),
    line: mixHex(COL.bg, COL.bone, 0.22)
  };

  // ---------- sizing: Visual Viewport API ----------
  var W = 0, H = 0, DPR = 1;
  function resize() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  function isPhone() {
    var s = (typeof window !== 'undefined') ? window.screen : null;
    if (s && typeof s.width === 'number' && typeof s.height === 'number') {
      return Math.min(s.width, s.height) < 700;
    }
    return H > W * 1.15;
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    window.addEventListener('resize', resize);
  }
  resize();

  // ---------- exposure model ----------
  // Four exposures of one composition. Each breathes on its own slow sine:
  //   op_i(t) = 0.44 + 0.30 * sin(2*pi*t/T_i + phi_i + Phi_i(t))
  // Opacity stays inside [0.14, 0.74]: no exposure ever reaches full
  // strength, so the face never resolves to a single image.
  // Frame-one phases (t = 0): opacities 0.66 / 0.30 / 0.48 / 0.38 —
  // exposure 0 slightly leading, all four mid-breath.
  var EXP = [
    { T: 30, phi: 0.823, dx: 0.000, dy: 0.000, em: { stripe: 1.00, face: 1.00, dark: 1.00, hand: 1.00 } },
    { T: 38, phi: -0.486, dx: 0.012, dy: -0.006, em: { stripe: 1.45, face: 0.72, dark: 0.85, hand: 0.80 } },
    { T: 26, phi: 0.134, dx: -0.014, dy: 0.008, em: { stripe: 0.70, face: 0.88, dark: 1.45, hand: 1.30 } },
    { T: 34, phi: -0.201, dx: 0.006, dy: 0.014, em: { stripe: 0.55, face: 1.40, dark: 0.90, hand: 0.95 } }
  ];
  var OP_BASE = 0.44, OP_AMP = 0.30;

  function smootherstep(x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    return x * x * x * (x * (x * 6 - 15) + 10);
  }

  // Tap re-phasing: a tap advances the lead to the next exposure. The new
  // lead's phase offset Phi eases over 4 s so that exposure reaches its
  // breathing peak at tap+4 s. Events are recorded; Phi_i(t) is the closed
  // sum of eased deltas, so any frame is a pure function of (events, t).
  var tapEvents = []; // {tau, idx, delta}
  var leadIdx = 0;
  function phiOffset(i, t) {
    var s = 0;
    for (var k = 0; k < tapEvents.length; k++) {
      var ev = tapEvents[k];
      if (ev.idx === i && t > ev.tau) s += ev.delta * smootherstep((t - ev.tau) / 4);
    }
    return s;
  }
  function opacityAt(i, t) {
    var e = EXP[i];
    return OP_BASE + OP_AMP * Math.sin(2 * Math.PI * t / e.T + e.phi + phiOffset(i, t));
  }
  function onTap(t) {
    leadIdx = (leadIdx + 1) % EXP.length;
    var i = leadIdx, e = EXP[i];
    var at = t + 4; // the moment the new lead should peak
    var theta = 2 * Math.PI * at / e.T + e.phi + phiOffset(i, at);
    var target = Math.PI / 2 + 2 * Math.PI * Math.round((theta - Math.PI / 2) / (2 * Math.PI));
    var delta = target - theta;
    while (delta > Math.PI) delta -= 2 * Math.PI;
    while (delta < -Math.PI) delta += 2 * Math.PI;
    tapEvents.push({ tau: t, idx: i, delta: delta });
  }

  // ---------- the portrait (unit space: u = min(W,H), origin at centre) ----------
  function poly(pts, u) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0] * u, pts[0][1] * u);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * u, pts[i][1] * u);
    ctx.closePath();
    ctx.fill();
  }
  function part(group, em, fn) {
    ctx.save();
    ctx.globalAlpha *= Math.min(em[group], 1.6);
    fn();
    ctx.restore();
  }

  function drawPortrait(e, u) {
    var em = e.em;
    ctx.rotate(EXP_ROT[EXP.indexOf(e)]);

    // ruin stripes: vertical paint-stripped bars behind the head
    part('stripe', em, function () {
      ctx.fillStyle = TONE.stripe;
      for (var i = 0; i < STRIPES.length; i++) {
        var s = STRIPES[i];
        ctx.globalAlpha *= 1; // weight carried by per-stripe alpha below
        ctx.save();
        ctx.globalAlpha *= s.k;
        ctx.fillRect(s.x * u, -0.335 * u, s.w * u, 0.335 * u);
        ctx.restore();
      }
    });

    // shoulders / chest block
    part('face', em, function () {
      ctx.fillStyle = TONE.chest;
      poly([[-0.27, 0.335], [-0.235, 0.13], [-0.10, 0.085], [0.10, 0.085],
            [0.235, 0.13], [0.27, 0.335]], u);
    });
    // collar V (dark)
    part('dark', em, function () {
      ctx.fillStyle = TONE.dark;
      poly([[-0.085, 0.088], [0.085, 0.088], [0.0, 0.185]], u);
    });
    // neck
    part('face', em, function () {
      ctx.fillStyle = TONE.brow;
      ctx.fillRect(-0.045 * u, 0.045 * u, 0.09 * u, 0.05 * u);
    });

    // skull mass
    part('face', em, function () {
      ctx.fillStyle = TONE.skull;
      poly([[-0.125, -0.295], [0.095, -0.305], [0.145, -0.185], [0.128, -0.03],
            [0.055, 0.055], [-0.015, 0.068], [-0.095, 0.025], [-0.138, -0.105]], u);
    });
    // lit face plane (three-quarter turn: the right portion carries the light)
    part('face', em, function () {
      ctx.fillStyle = TONE.plane;
      poly([[0.005, -0.29], [0.098, -0.298], [0.14, -0.185], [0.124, -0.035],
            [0.055, 0.05], [0.012, 0.055], [0.02, -0.1], [0.005, -0.19]], u);
    });
    // brow plane
    part('face', em, function () {
      ctx.fillStyle = TONE.brow;
      poly([[-0.128, -0.235], [0.135, -0.245], [0.142, -0.185], [-0.132, -0.178]], u);
    });
    // sunglasses band: dark slab across the eyes, with a temple arm
    part('dark', em, function () {
      ctx.fillStyle = TONE.dark;
      ctx.save();
      ctx.translate(0.004 * u, -0.152 * u);
      ctx.rotate(-0.035);
      ctx.fillRect(-0.138 * u, -0.026 * u, 0.272 * u, 0.05 * u);
      ctx.restore();
      ctx.fillRect(-0.155 * u, -0.163 * u, 0.035 * u, 0.012 * u); // temple arm
    });
    // nose wedge
    part('face', em, function () {
      ctx.fillStyle = TONE.nose;
      poly([[0.098, -0.125], [0.158, -0.018], [0.068, -0.008]], u);
    });
    // mouth: one short dark line, off-centre
    part('dark', em, function () {
      ctx.strokeStyle = TONE.line;
      ctx.lineWidth = 0.011 * u;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0.028 * u, 0.032 * u);
      ctx.lineTo(0.088 * u, 0.028 * u);
      ctx.stroke();
    });
    // jaw shadow under the chin
    part('face', em, function () {
      ctx.fillStyle = TONE.brow;
      poly([[-0.06, 0.052], [0.055, 0.048], [0.03, 0.075], [-0.035, 0.078]], u);
    });

    // hand on heart: palm with four finger capsules, resting on the chest
    part('hand', em, function () {
      ctx.fillStyle = TONE.hand;
      ctx.save();
      ctx.translate(-0.088 * u, 0.205 * u);
      ctx.rotate(0.38);
      // fingers (four tapered capsules fanning up-left)
      var fx = [-0.030, -0.010, 0.010, 0.029];
      var fl = [0.062, 0.074, 0.070, 0.056];
      for (var i = 0; i < 4; i++) {
        ctx.save();
        ctx.translate(fx[i] * u, -0.028 * u);
        ctx.rotate((i - 1.5) * 0.07);
        ctx.beginPath();
        ctx.ellipse(0, -fl[i] * u / 2, 0.0085 * u, fl[i] * u / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      // palm
      ctx.beginPath();
      ctx.ellipse(0, 0.012 * u, 0.037 * u, 0.044 * u, 0, 0, Math.PI * 2);
      ctx.fill();
      // thumb
      ctx.save();
      ctx.translate(0.036 * u, 0.005 * u);
      ctx.rotate(-0.7);
      ctx.beginPath();
      ctx.ellipse(0, -0.016 * u, 0.008 * u, 0.024 * u, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.restore();
    });
  }

  // ---------- reliquary border: "MAGIC AND LOSS" on all four sides ----------
  var BORDER_TEXT = 'MAGIC AND LOSS \u00B7 ';
  function drawBorder(u) {
    var fs = 0.026 * u;
    ctx.fillStyle = COL.bone;
    ctx.globalAlpha = 0.82;
    ctx.font = '600 ' + fs + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'middle';
    var unit = ctx.measureText(BORDER_TEXT).width;
    var inset = 0.030 * u;
    var i, x, y;
    // top, left to right
    ctx.textAlign = 'left';
    for (x = inset; x < W - inset; x += unit) ctx.fillText(BORDER_TEXT, x, inset + fs * 0.1);
    // bottom, left to right
    for (x = inset; x < W - inset; x += unit) ctx.fillText(BORDER_TEXT, x, H - inset - fs * 0.1);
    // left side, bottom to top
    ctx.save();
    ctx.translate(inset + fs * 0.1, H - inset);
    ctx.rotate(-Math.PI / 2);
    for (y = 0; y < H - 2 * inset; y += unit) ctx.fillText(BORDER_TEXT, y, 0);
    ctx.restore();
    // right side, top to bottom
    ctx.save();
    ctx.translate(W - inset - fs * 0.1, inset);
    ctx.rotate(Math.PI / 2);
    for (y = 0; y < H - 2 * inset; y += unit) ctx.fillText(BORDER_TEXT, y, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
    void i;
  }

  // ---------- alchemical corner glyphs (red line marks, abstract) ----------
  function glyph(kind, x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = COL.red;
    ctx.lineWidth = Math.max(1.2, 0.0045 * s * 2);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var r = s / 2;
    ctx.beginPath();
    if (kind === 0) {          // fire: plain triangle
      ctx.moveTo(0, -r); ctx.lineTo(r * 0.9, r * 0.75); ctx.lineTo(-r * 0.9, r * 0.75); ctx.closePath();
    } else if (kind === 1) {   // earth: circle with cross
      ctx.arc(0, 0, r * 0.82, 0, Math.PI * 2);
      ctx.moveTo(-r * 0.82, 0); ctx.lineTo(r * 0.82, 0);
      ctx.moveTo(0, -r * 0.82); ctx.lineTo(0, r * 0.82);
    } else if (kind === 2) {   // sulfur: triangle over a cross
      ctx.moveTo(0, -r); ctx.lineTo(r * 0.78, r * 0.18); ctx.lineTo(-r * 0.78, r * 0.18); ctx.closePath();
      ctx.moveTo(-r * 0.5, r * 0.52); ctx.lineTo(r * 0.5, r * 0.52);
      ctx.moveTo(0, r * 0.24); ctx.lineTo(0, r);
    } else {                   // mercury: crescent over circle over cross
      ctx.arc(0, -r * 0.52, r * 0.34, Math.PI * 1.15, Math.PI * 1.85, false);
      ctx.moveTo(-r * 0.34, -r * 0.62); // crescent horns hint
      ctx.arc(0, r * 0.08, r * 0.36, 0, Math.PI * 2);
      ctx.moveTo(-r * 0.42, r * 0.72); ctx.lineTo(r * 0.42, r * 0.72);
      ctx.moveTo(0, r * 0.44); ctx.lineTo(0, r);
    }
    ctx.stroke();
    ctx.restore();
  }
  function drawGlyphs(u) {
    var s = 0.052 * u;
    var m = 0.078 * u; // inside the border band
    glyph(0, m, m, s);
    glyph(1, W - m, m, s);
    glyph(2, m, H - m, s);
    glyph(3, W - m, H - m, s);
  }

  // ---------- draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, W, H);

    var u = Math.min(W, H);
    var scale = isPhone() ? 0.92 : 1.0;

    // exposures, back to front; each breathes, none ever resolves
    for (var i = EXP.length - 1; i >= 0; i--) {
      var e = EXP[i];
      ctx.save();
      ctx.translate(W / 2 + e.dx * u, H / 2 + e.dy * u);
      ctx.scale(scale, scale);
      ctx.globalAlpha = opacityAt(i, t);
      drawPortrait(e, u);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    drawBorder(u);
    drawGlyphs(u);
  }

  // ---------- piece clock (never Date.now) ----------
  var startMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function nowT() {
    return (typeof performance !== 'undefined' && performance.now)
      ? (performance.now() - startMs) / 1000 : 0;
  }

  // tap / click: shift which exposure leads (slow re-phase, never snappy)
  function handleTap() { onTap(nowT()); }
  if (canvas.addEventListener) canvas.addEventListener('pointerdown', handleTap);

  draw(0);
  function frame() {
    draw(nowT());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
