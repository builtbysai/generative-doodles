<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.331 Singhay Chosgyal</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E0D0B; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.331 Singhay Chosgyal (arunima-dazess-wangchuk).
// A precise white line wrathful deity on a black ground, drawn
// with exactly 8 fold rotational symmetry. The deity is fixed
// path data: crown arcs, skulls, spiral eyes and fang triangles
// authored once per sector and mirrored or repeated around the
// ring, drawn every frame and never moving. Inside its disc a
// pigment field churns: blobs of red, yellow, green and black
// travel authored closed streamlines, clipped to the disc by a
// path clip on this one canvas. Each streamline is completed a
// whole number of times in the 36s loop, so the frame at 36s is
// pixel identical to frame 0, while the line work stays still.
// Watch only: there is no interaction at all.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0E0D0B', LINE = '#F2EDE2';
var RED = '#B3372B', YELLOW = '#D9A441', GREEN = '#4A6B4F', FBLACK = '#1A1815';
var DW = 1280, DH = 900;
var CX = 640, CY = 450, RDISC = 198;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 36;
var T = 9.0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }

// ---- iconography tables: exactly 8 sectors, asserted ---------
var SECTORS = 8;
var CROWN_RADII = [408, 392, 338];
var FANGS = [
  { base: 236, y0: 13, y1: 31, tipR: 214, tipY: 22 },
  { base: 236, y0: -31, y1: -13, tipR: 214, tipY: -22 }
];
var TICKS = [-27, -9, 9, 27];
if (SECTORS !== 8) throw new Error('Singhay Chosgyal needs exactly 8 sectors');
if (CROWN_RADII.length * SECTORS !== 24) throw new Error('Singhay Chosgyal needs 24 crown arcs');
if (FANGS.length * SECTORS !== 16) throw new Error('Singhay Chosgyal needs 16 fangs');

// ---- disc field: authored closed streamlines ------------------
// Each streamline is a closed wobbled ellipse inside the disc.
// circuits is a whole number: the number of full circuits its
// blobs complete in one 36s loop. wobFreq is a whole number, so
// the wobble closes on itself as well.
var STREAMS = [
  { cx: 0, cy: 0, rx: 178, ry: 150, rot: 0.3, wob: 0.05, wobFreq: 3, circuits: 1, band: RED },
  { cx: -18, cy: 10, rx: 148, ry: 172, rot: -0.5, wob: 0.06, wobFreq: 4, circuits: 1, band: YELLOW },
  { cx: 14, cy: -8, rx: 128, ry: 104, rot: 0.9, wob: 0.07, wobFreq: 3, circuits: 2, band: GREEN },
  { cx: -6, cy: 16, rx: 96, ry: 118, rot: 0.1, wob: 0.06, wobFreq: 5, circuits: 2, band: RED },
  { cx: 10, cy: 4, rx: 82, ry: 62, rot: -0.8, wob: 0.08, wobFreq: 4, circuits: 2, band: YELLOW },
  { cx: -12, cy: -12, rx: 52, ry: 68, rot: 0.6, wob: 0.07, wobFreq: 3, circuits: 3, band: GREEN },
  { cx: 4, cy: -2, rx: 34, ry: 26, rot: 0.0, wob: 0.09, wobFreq: 4, circuits: 3, band: RED }
];
var FIELD_COLS = [RED, YELLOW, GREEN, FBLACK, RED, GREEN, YELLOW, FBLACK];
var BLOBS = [];
(function () {
  var i, j, per = 6;
  for (i = 0; i < STREAMS.length; i++) {
    for (j = 0; j < per; j++) {
      BLOBS.push({
        s: i,
        ph: (j / per) + (i % 3) * 0.07,
        size: 13 + ((i * 7 + j * 11) % 5) * 3.2,
        col: FIELD_COLS[(i * 3 + j) % FIELD_COLS.length],
        sat: ((i + j) % 3) - 1
      });
    }
  }
})();
if (BLOBS.length !== 42) throw new Error('Singhay Chosgyal needs exactly 42 blobs');
(function () {
  var i, counts = {}, c;
  for (i = 0; i < BLOBS.length; i++) { counts[BLOBS[i].s] = (counts[BLOBS[i].s] || 0) + 1; }
  for (i = 0; i < STREAMS.length; i++) {
    c = STREAMS[i];
    if (counts[i] !== 6) throw new Error('Singhay Chosgyal needs 6 blobs per streamline');
    if (Math.round(c.circuits) !== c.circuits || c.circuits < 1) throw new Error('streamline circuits must be whole');
    if (Math.round(c.wobFreq) !== c.wobFreq) throw new Error('streamline wobble must close');
  }
})();

function streamPoint(sm, u) {
  var w = 1 + sm.wob * Math.sin(sm.wobFreq * u);
  var ex = Math.cos(u) * sm.rx * w, ey = Math.sin(u) * sm.ry * w;
  var cr = Math.cos(sm.rot), sr = Math.sin(sm.rot);
  return {
    x: CX + sm.cx + ex * cr - ey * sr,
    y: CY + sm.cy + ex * sr + ey * cr
  };
}

function drawField(t) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, RDISC, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = FBLACK;
  ctx.fillRect(CX - RDISC, CY - RDISC, RDISC * 2, RDISC * 2);
  var i, j, sm, u, p, q, blob, ang;
  // Streamline bands, drawn as closed paths along the same data.
  for (i = 0; i < STREAMS.length; i++) {
    sm = STREAMS[i];
    ctx.globalAlpha = 0.30;
    st(sm.band, 17 - i * 1.6);
    ctx.beginPath();
    for (j = 0; j <= 72; j++) {
      p = streamPoint(sm, (j / 72) * Math.PI * 2);
      if (j === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // Pigment blobs travelling the streamlines.
  var frac = t / LOOP;
  for (i = 0; i < BLOBS.length; i++) {
    blob = BLOBS[i];
    sm = STREAMS[blob.s];
    u = ((blob.ph + sm.circuits * frac) % 1) * Math.PI * 2;
    p = streamPoint(sm, u);
    q = streamPoint(sm, u + 0.04);
    ang = Math.atan2(q.y - p.y, q.x - p.x);
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(ang);
    ctx.fillStyle = blob.col;
    ctx.beginPath();
    ctx.ellipse(0, 0, blob.size * 1.65, blob.size * 0.72, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(blob.size * 0.55, blob.sat * blob.size * 0.5, blob.size * 0.55, blob.size * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// ---- deity line work: fixed path data, drawn unmoving ---------
function drawSpiralEye(x, y) {
  var i, a, r, px, py;
  st(LINE, 3.4);
  ctx.beginPath();
  for (i = 0; i <= 60; i++) {
    a = (i / 60) * Math.PI * 5.2;
    r = 2 + (i / 60) * 17;
    px = x + Math.cos(a) * r; py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  st(LINE, 3);
  ctx.beginPath(); ctx.arc(x, y, 30, -0.75, 0.75); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 38, -0.55, 0.55); ctx.stroke();
}

function drawSector() {
  var i, r, a;
  // Crown arcs for this sector.
  for (i = 0; i < CROWN_RADII.length; i++) {
    r = CROWN_RADII[i];
    st(LINE, i === 2 ? 2.4 : 3);
    ctx.beginPath(); ctx.arc(0, 0, r, -0.34, 0.34); ctx.stroke();
  }
  // Ring ticks on the inner boundary.
  st(LINE, 2.4);
  for (i = 0; i < TICKS.length; i++) {
    a = TICKS[i] * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 204, Math.sin(a) * 204);
    ctx.lineTo(Math.cos(a) * 216, Math.sin(a) * 216);
    ctx.stroke();
  }
  // Spiral eye on the sector bisector.
  drawSpiralEye(268, 0);
  // Fang triangles, mirrored about the bisector.
  ctx.fillStyle = LINE;
  for (i = 0; i < FANGS.length; i++) {
    ctx.beginPath();
    ctx.moveTo(FANGS[i].base, FANGS[i].y0);
    ctx.lineTo(FANGS[i].base, FANGS[i].y1);
    ctx.lineTo(FANGS[i].tipR, FANGS[i].tipY);
    ctx.closePath(); ctx.fill();
  }
  // Cheek strokes flanking the eye.
  st(LINE, 2.6);
  ctx.beginPath(); ctx.arc(0, 0, 292, -0.30, -0.12); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 292, 0.12, 0.30); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 244, -0.34, -0.16); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 244, 0.16, 0.34); ctx.stroke();
  // Jewel dots between eye and crown.
  ctx.fillStyle = LINE;
  circ(318, -14, 4.2, true);
  circ(318, 14, 4.2, true);
  // Skull on the crown ring, on the bisector.
  st(LINE, 3.2);
  circ(368, 0, 25, false);
  ctx.fillStyle = LINE;
  circ(376, -9, 4.6, true);
  circ(376, 9, 4.6, true);
  // Skull nose and teeth.
  st(LINE, 2.4);
  ctx.beginPath(); ctx.moveTo(382, 0); ctx.lineTo(374, -3.5); ctx.lineTo(374, 3.5); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(346, -11); ctx.lineTo(340, -11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(346, 0); ctx.lineTo(340, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(346, 11); ctx.lineTo(340, 11); ctx.stroke();
  // Flame petal at the sector edge.
  ctx.save();
  ctx.rotate(Math.PI / SECTORS);
  st(LINE, 2.6);
  ctx.beginPath();
  ctx.moveTo(322, 0);
  ctx.quadraticCurveTo(342, -10, 356, 0);
  ctx.quadraticCurveTo(342, 10, 322, 0);
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = LINE;
  circ(340, 0, 3.2, true);
  ctx.restore();
  // Radial spokes at the sector edges.
  st(LINE, 2.2);
  ctx.save();
  ctx.rotate(-Math.PI / SECTORS);
  ctx.beginPath(); ctx.moveTo(216, 0); ctx.lineTo(232, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(320, 0); ctx.lineTo(338, 0); ctx.stroke();
  ctx.restore();
}

function drawDeity() {
  var k;
  // Full boundary circles.
  st(LINE, 3.6); circ(CX, CY, RDISC + 2, false);
  st(LINE, 2.2); circ(CX, CY, 218, false);
  st(LINE, 2.6); circ(CX, CY, 320, false);
  st(LINE, 2.2); circ(CX, CY, 416, false);
  ctx.save();
  ctx.translate(CX, CY);
  for (k = 0; k < SECTORS; k++) {
    ctx.save();
    ctx.rotate(k * Math.PI * 2 / SECTORS);
    drawSector();
    ctx.restore();
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  drawField(T);
  drawDeity();
}

// ---- sizing: centred fit, page ground is the piece ground ----
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
