<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Red Dress</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1B2A4A; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  // Palette: the five prompt colors and nothing else. The venetian light is
  // the pale skin tone laid down at low alpha, so no sixth color appears.
  var BLUE = '#1B2A4A';    // interior deep blue
  var SHADOW = '#0E1830';  // deep shadow blue
  var SKIN = '#F2D8C9';    // pale skin, also the light
  var BLACK = '#0A0A0F';   // black
  var ACCENTS = ['#D9261C', '#D9A441', '#B8D93C']; // red, gold, acid green
  var accentIdx = 0;

  var LOOP = 60;      // one film-noir loop, seconds
  var PHASE0 = 18;    // fixed pre-roll: bars mid-drift, phone still, red dress

  // Seeded RNG (mulberry32). Used once, at load, to fix the phone's ring
  // point inside the loop. The ring point is a property of the seed, never
  // of Math.random, so every load and every QA render agree.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(461);
  var RING_T = 20 + rng() * 30; // ring starts somewhere in [20, 50) of the loop
  var RING_LEN = 0.5;           // the shiver lasts half a second

  // Tap reseeds the accent: red to gold to acid green and back.
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function () {
      accentIdx = (accentIdx + 1) % ACCENTS.length;
    });
  }

  function ell(x, y, rx, ry, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(rx, ry);
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  function rect(x, y, w, h) { ctx.fillRect(x, y, w, h); }
  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fill();
  }

  function drawRoom(S) {
    // wall
    ctx.fillStyle = BLUE; ctx.fillRect(0, 0, W, H);
    // tall shadow panel behind the figure, so the dress reads against dark
    ctx.fillStyle = SHADOW;
    rect(0.055 * W, 0.045 * H, 0.47 * W, 0.955 * H);
    // floor band and baseboard
    rect(0, 0.80 * H, W, 0.20 * H);
    ctx.fillStyle = BLACK;
    rect(0, 0.795 * H, W, Math.max(2, 0.006 * H));
    // window upper right, with venetian blinds: dark glass, slats in wall
    // blue, black frame. The slats sit at the same slant as the light bars.
    var wx = 0.585 * W, wy = 0.06 * H, ww = 0.375 * W, wh = 0.46 * H;
    ctx.fillStyle = BLACK;
    rect(wx - 0.012 * S, wy - 0.012 * S, ww + 0.024 * S, wh + 0.024 * S);
    ctx.fillStyle = SHADOW;
    rect(wx, wy, ww, wh);
    ctx.save();
    ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
    ctx.translate(wx + ww / 2, wy + wh / 2); ctx.rotate(-0.10); ctx.translate(-(wx + ww / 2), -(wy + wh / 2));
    ctx.fillStyle = BLUE;
    var slatP = 0.052 * S, slatH = 0.030 * S;
    for (var y = wy - slatP; y < wy + wh + slatP; y += slatP) {
      rect(wx - 0.05 * S, y, ww + 0.10 * S, slatH);
    }
    ctx.restore();
  }

  function drawTableAndPhone(S, jx) {
    var tx = 0.755 * W, topY = 0.685 * H;
    // cast shadow on the floor
    ctx.fillStyle = BLACK;
    ell(tx, 0.885 * H, 0.115 * S, 0.016 * S, 0);
    // pedestal table, black silhouette
    ctx.fillStyle = BLACK;
    ell(tx, topY, 0.105 * S, 0.016 * S, 0);
    poly([
      [tx - 0.012 * S, topY], [tx + 0.012 * S, topY],
      [tx + 0.020 * S, 0.878 * H], [tx - 0.020 * S, 0.878 * H]
    ]);
    ell(tx, 0.880 * H, 0.045 * S, 0.008 * S, 0);
    // telephone, black silhouette, shifted by the ring jitter
    var px = tx - 0.028 * S + jx, py = topY - 0.006 * S;
    // cord, drooping from the base to just under the table edge
    ctx.strokeStyle = BLACK; ctx.lineWidth = Math.max(1.5, 0.004 * S); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px + 0.045 * S, py - 0.010 * S);
    ctx.quadraticCurveTo(px + 0.088 * S, py + 0.016 * S, px + 0.068 * S, py + 0.034 * S);
    ctx.stroke();
    // base: a low trapezoid with a sloped top
    poly([
      [px - 0.048 * S, py], [px + 0.048 * S, py],
      [px + 0.034 * S, py - 0.026 * S], [px - 0.034 * S, py - 0.026 * S]
    ]);
    // dial, picked out in wall blue
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.arc(px, py - 0.012 * S, 0.011 * S, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(px, py - 0.012 * S, 0.004 * S, 0, Math.PI * 2); ctx.fill();
    // cradle posts and handset, sitting close over the base
    rect(px - 0.036 * S, py - 0.038 * S, 0.010 * S, 0.014 * S);
    rect(px + 0.026 * S, py - 0.038 * S, 0.010 * S, 0.014 * S);
    ctx.save();
    ctx.translate(px, py - 0.041 * S); ctx.rotate(-0.03);
    rect(-0.052 * S, -0.007 * S, 0.104 * S, 0.013 * S);
    ell(-0.052 * S, 0, 0.013 * S, 0.011 * S, 0);
    ell(0.052 * S, 0, 0.013 * S, 0.011 * S, 0);
    ctx.restore();
  }

  function drawFigure(S, sway) {
    var cx = PHONE ? 0.295 * W : 0.315 * W;
    var accent = ACCENTS[accentIdx];
    // cast shadow, stretching right along the floor
    ctx.fillStyle = BLACK;
    ell(cx + 0.075 * S, 0.972 * H, 0.150 * S, 0.014 * S, 0);
    var headCY = 0.150 * H, headR = 0.050 * S;
    var shoulderY = 0.238 * H, waistY = 0.452 * H, hemY = 0.968 * H;
    // hair fall behind everything: a black mass that will peek out beside
    // the head and neck once the face and dress are drawn over it
    ctx.fillStyle = BLACK;
    ell(cx - headR * 0.20, headCY + headR * 0.55, headR * 1.06, headR * 1.78, 0.06);
    // hem sway: one slow swing per loop, growing toward the hem
    var hemDx = sway * 0.020 * S;
    // skirt and bodice as one flat dress shape
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.moveTo(cx - 0.068 * S, shoulderY);                       // left shoulder
    ctx.quadraticCurveTo(cx - 0.052 * S, waistY, cx - 0.048 * S, waistY + 0.01 * S);
    ctx.quadraticCurveTo(cx - 0.105 * S, 0.72 * H, cx - 0.168 * S + hemDx, hemY);
    ctx.quadraticCurveTo(cx, hemY + 0.012 * S, cx + 0.168 * S + hemDx, hemY);
    ctx.quadraticCurveTo(cx + 0.105 * S, 0.72 * H, cx + 0.048 * S, waistY + 0.01 * S);
    ctx.quadraticCurveTo(cx + 0.052 * S, waistY, cx + 0.068 * S, shoulderY);
    ctx.quadraticCurveTo(cx, shoulderY - 0.018 * S, cx - 0.068 * S, shoulderY);
    ctx.fill();
    // black waist band
    ctx.fillStyle = BLACK;
    ctx.beginPath();
    ctx.moveTo(cx - 0.050 * S, waistY - 0.012 * S);
    ctx.lineTo(cx + 0.050 * S, waistY - 0.012 * S);
    ctx.lineTo(cx + 0.048 * S, waistY + 0.012 * S);
    ctx.lineTo(cx - 0.048 * S, waistY + 0.012 * S);
    ctx.closePath(); ctx.fill();
    // arms, pale and flat: left arm hangs along the skirt, right arm bent
    // with the hand resting at the waist
    ctx.fillStyle = SKIN;
    poly([
      [cx - 0.066 * S, shoulderY + 0.006 * S], [cx - 0.082 * S, shoulderY + 0.010 * S],
      [cx - 0.096 * S, 0.545 * H], [cx - 0.080 * S, 0.552 * H]
    ]);
    ell(cx - 0.089 * S, 0.560 * H, 0.011 * S, 0.016 * S, 0.15);
    poly([
      [cx + 0.064 * S, shoulderY + 0.006 * S], [cx + 0.080 * S, shoulderY + 0.010 * S],
      [cx + 0.088 * S, 0.360 * H], [cx + 0.058 * S, waistY - 0.018 * S],
      [cx + 0.046 * S, waistY - 0.030 * S], [cx + 0.070 * S, 0.368 * H]
    ]);
    ell(cx + 0.052 * S, waistY - 0.026 * S, 0.012 * S, 0.010 * S, 0);
    // neck and head
    ctx.fillStyle = SKIN;
    rect(cx - 0.016 * S, headCY + headR * 0.55, 0.032 * S, shoulderY - headCY - headR * 0.4);
    ell(cx, headCY, headR * 0.86, headR, 0);
    // hair cap: a side-swept fringe across the crown, face left clear below
    ctx.fillStyle = BLACK;
    ctx.beginPath();
    ctx.arc(cx, headCY - headR * 0.10, headR * 0.98, Math.PI * 0.92, Math.PI * 2.08);
    ctx.closePath(); ctx.fill();
    ell(cx + headR * 0.48, headCY - headR * 0.92, headR * 0.40, headR * 0.28, 0.5);
    // shoes, black tips under the hem
    poly([
      [cx - 0.052 * S + hemDx, hemY + 0.002 * S], [cx - 0.018 * S + hemDx, hemY + 0.002 * S],
      [cx - 0.014 * S + hemDx, hemY + 0.016 * S], [cx - 0.056 * S + hemDx, hemY + 0.016 * S]
    ]);
    poly([
      [cx + 0.020 * S + hemDx, hemY + 0.002 * S], [cx + 0.054 * S + hemDx, hemY + 0.002 * S],
      [cx + 0.058 * S + hemDx, hemY + 0.016 * S], [cx + 0.016 * S + hemDx, hemY + 0.016 * S]
    ]);
  }

  function drawLight(t, S) {
    // Venetian-blind light: soft gradient bars at a slight slant, drifting
    // one full band per loop so the motion cycles seamlessly. Drawn over
    // the whole scene, figure included, in the pale tone at low alpha.
    var P = 0.150 * S;                       // band period
    var off = ((t % LOOP) / LOOP) * P;       // drift within one period
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.rotate(-0.10); ctx.translate(-W / 2, -H / 2);
    var diag = W + H;
    for (var y = -diag / 2 - P + off; y < diag / 2 + P; y += P) {
      var g = ctx.createLinearGradient(0, y, 0, y + P * 0.66);
      g.addColorStop(0, 'rgba(242,216,201,0)');
      g.addColorStop(0.45, 'rgba(242,216,201,0.17)');
      g.addColorStop(1, 'rgba(242,216,201,0)');
      ctx.fillStyle = g;
      ctx.fillRect(-diag / 2, y, diag * 2, P * 0.66);
    }
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var S = Math.min(W, H);
    var lt = t % LOOP;
    // phone ring: 2px x-jitter for half a second at the seeded loop point
    var jx = 0;
    if (lt >= RING_T && lt < RING_T + RING_LEN) {
      jx = (Math.floor(lt * 20) % 2 === 0) ? 2 : -2;
    }
    // dress hem: one sway per loop
    var sway = Math.sin((lt / LOOP) * Math.PI * 2);
    drawRoom(S);
    drawTableAndPhone(S, jx);
    drawFigure(S, sway);
    drawLight(t, S);
  }

  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loopFn = function (now) {
      draw(PHASE0 + (now - start) / 1000);
      requestAnimationFrame(loopFn);
    };
    requestAnimationFrame(loopFn);
  }
})();
</script>
</body>
</html>
