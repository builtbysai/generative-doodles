<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recur, The Transcription</title>
<style>
html, body { margin: 0; padding: 0; background: #17191D; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#17191D';
var PLATE = '#101216';
var PLATE_LINE = 'rgba(232,236,240,0.30)';
var TITLE_INK = '#E8ECF0';
var HINT_INK = 'rgba(232,236,240,0.75)';
var COLD_GREY = [154, 163, 173];
var COLD_WHITE = [232, 236, 240];
var WARM_AMBER = [217, 147, 46];
var WARM_WOOD = [138, 90, 43];
var LOOP = 24;
var PHASE0 = 6;
var COLS = 30;
var ROWS = 15;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* deterministic per-cell hash: stable flicker, no Math.random anywhere */
function cellHash(cx, cy, step) {
  var h = (cx * 374761393 + cy * 668265263 + step * 2246822519) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return ((h >>> 0) / 4294967296);
}
function mix3(a, b, t) {
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}
function css(c, a) {
  return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* seeded per-cell base values: block height, arc bow, jitter phase */
var rng = mulberry32(1740);
var cells = [];
(function initCells() {
  var cx, cy;
  for (cy = 0; cy < ROWS; cy++) {
    for (cx = 0; cx < COLS; cx++) {
      cells.push({
        cx: cx, cy: cy,
        bh: 0.45 + rng() * 0.5,
        bow: 0.25 + rng() * 0.55,
        len: 0.7 + rng() * 0.3,
        cold: rng() < 0.45 ? COLD_WHITE : COLD_GREY,
        warm: rng() < 0.5 ? WARM_AMBER : WARM_WOOD,
        jit: rng() * TAU
      });
    }
  }
})();
var simTime = 0;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* field: full-bleed on phones, a centered square on desktop */
function field() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.94;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* sweep: slow triangular phase, 0 to 1 and back over LOOP seconds.
   Frame one sits at PHASE0 = 6s, sweep mid-frame, so blocks hold the
   left, arcs hold the right, and the middle band is mid-morph. */
function sweepAt(t) {
  var u = ((t + PHASE0) % LOOP) / LOOP;
  return u < 0.5 ? u * 2 : 2 - u * 2;
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var F = field();
  var cw = F.w / COLS, ch = F.h / ROWS;
  var sweep = sweepAt(simTime);
  var step = Math.floor((simTime + PHASE0) * 8);
  var i, cell, x, y, m, band;
  for (i = 0; i < cells.length; i++) {
    cell = cells[i];
    /* morph factor: 0 = block, 1 = arc; the sweep boundary crosses
       the field left to right and back, a soft band wide enough to
       show rects thinning into arcs as they meet */
    band = 0.16;
    m = clamp(((cell.cx + 0.5) / COLS - (sweep - band)) / (band * 2), 0, 1);
    m = m * m * (3 - 2 * m);
    x = F.x + cell.cx * cw;
    y = F.y + cell.cy * ch;
    var cxp = x + cw / 2, cyp = y + ch / 2;
    /* glitch flicker: constant repetition on the block side, easing
       to stillness as cells warm into arcs; driven by a pure function
       of cell and time step, so frame one is fixed */
    var flick = cellHash(cell.cx, cell.cy, step);
    var jx = (flick - 0.5) * cw * 0.28 * (1 - m);
    var jy = (cellHash(cell.cy, cell.cx, step + 7) - 0.5) * ch * 0.28 * (1 - m);
    var alpha = 0.55 + 0.45 * flick * (1 - m) + 0.45 * m;
    var col = mix3(cell.cold, cell.warm, m);
    if (m < 0.85) {
      /* the block: a glitch rect that thins and shortens as it warms */
      var bw = cw * (0.86 - 0.62 * m);
      var bh = ch * cell.bh * (1 - 0.55 * m);
      ctx.fillStyle = css(col, alpha);
      ctx.fillRect(cxp - bw / 2 + jx, cyp - bh / 2 + jy, bw, bh);
      /* a thin signal-white sliver rides the block edge while it lasts */
      if (m < 0.5) {
        ctx.fillStyle = css(COLD_WHITE, (0.5 - m) * 0.9);
        ctx.fillRect(cxp - bw / 2 + jx, cyp - bh / 2 + jy, Math.max(1, bw * 0.14), bh);
      }
    }
    if (m > 0.15) {
      /* the bowed arc: grows out of the block as the sweep passes,
         a smooth gesture in warm amber and wood brown */
      var aw = cw * cell.len * (0.5 + 0.9 * m);
      var ah = ch * cell.bow * (0.25 + 0.35 * m);
      var a0 = Math.PI * (1.25 + 0.25 * Math.sin(cell.jit));
      var a1 = Math.PI * (1.75 - 0.25 * Math.sin(cell.jit));
      ctx.strokeStyle = css(col, clamp(alpha, 0, 1));
      ctx.lineWidth = Math.max(1, ch * 0.10 * (0.6 + 0.4 * m));
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.ellipse(cxp, cyp + ah * 0.35, aw / 2, ah, 0, a0, a1, false);
      ctx.stroke();
    }
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  while (titlePx > 9 && ctx.measureText('Recur, The Transcription').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  }
  var titleW = ctx.measureText('Recur, The Transcription').width;
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var dateW = ctx.measureText('2006 · 10 · 17').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  ctx.fillText('Recur, The Transcription', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 17', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. The transcription sweeps and reverses.';
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { simTime = t; draw(); },
    sweepAt: sweepAt,
    simTime: function () { return simTime; }
  };
}
/* ---- frame one: fixed phase, sweep mid-frame, flicker step fixed ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) { simTime += dt; draw(); }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
