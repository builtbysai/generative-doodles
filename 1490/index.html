<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maso or Miso</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e0d0; overflow: hidden; }
  canvas { display: block; background: #e8e0d0; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (prompt only, no other color).
  var FIELD = '#e8e0d0';
  var SOFT = [74, 90, 122];      // muted blue #4a5a7a
  var SHARP = [193, 39, 45];     // scarlet #c1272d
  var TRACK = '#2a2a30';         // charcoal
  var THUMB = '#d9a441';         // gold
  var SKIN = '#f2ead8';

  var LOOP = 48; // seconds; drift period. Every sine period divides LOOP.
  var W = 0, H = 0;
  var geom = { trackL: 0, trackR: 0, trackY: 0, thumbR: 0 };

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mixColor(t) {
    var r = Math.round(lerp(SOFT[0], SHARP[0], t));
    var g = Math.round(lerp(SOFT[1], SHARP[1], t));
    var b = Math.round(lerp(SOFT[2], SHARP[2], t));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }

  // ---- Interaction state: closed-form over recorded drag events ----
  // Completed drags: {t0, t1, p}. Current drag: {t0, p} or null.
  var drags = [];
  var curDrag = null;

  function driftPhaseAt(t1, pHeld, dir) {
    var a = Math.asin(clamp(2 * pHeld - 1, -1, 1));
    return dir >= 0 ? a : (Math.PI - a);
  }
  function driftDirAt(t) {
    // Direction of the base drift at time t (sign of d/dt of base drift).
    return Math.cos(2 * Math.PI * (t % LOOP) / LOOP);
  }
  function pAt(t) {
    // Inside a drag interval (current or completed): held value.
    if (curDrag && t >= curDrag.t0) return curDrag.p;
    for (var i = drags.length - 1; i >= 0; i--) {
      var d = drags[i];
      if (t >= d.t0 && t <= d.t1) return d.p;
      if (t > d.t1) {
        // After this drag: drift continues from the held value, same direction
        // the drift had when the drag ended.
        var dir = d.dir;
        var ph = driftPhaseAt(d.t1, d.p, dir);
        return 0.5 + 0.5 * Math.sin(2 * Math.PI * (t - d.t1) / LOOP + ph);
      }
    }
    // No drag yet: base drift, loop-local so the loop closes exactly.
    var lt = t % LOOP;
    return 0.5 + 0.5 * Math.sin(2 * Math.PI * lt / LOOP);
  }

  function pointerPos(e) {
    var x = (typeof e.clientX === 'number') ? e.clientX : e.pageX;
    var y = (typeof e.clientY === 'number') ? e.clientY : e.pageY;
    if (typeof canvas.getBoundingClientRect === 'function') {
      var r = canvas.getBoundingClientRect();
      x -= r.left; y -= r.top;
    }
    return { x: x, y: y };
  }
  function onDown(x, y, t) {
    var dx = x - lerp(geom.trackL, geom.trackR, pAt(t));
    var dy = y - geom.trackY;
    var hit = Math.sqrt(dx * dx + dy * dy);
    if (hit <= Math.max(geom.thumbR * 2.5, 28) || (Math.abs(dy) <= 26 && x >= geom.trackL - 10 && x <= geom.trackR + 10)) {
      curDrag = { t0: t, p: clamp((x - geom.trackL) / (geom.trackR - geom.trackL), 0, 1) };
    }
  }
  function onMove(x, y, t) {
    if (!curDrag) return;
    curDrag.p = clamp((x - geom.trackL) / (geom.trackR - geom.trackL), 0, 1);
  }
  function onUp(x, y, t) {
    if (!curDrag) return;
    var dir = driftDirAt(t);
    drags.push({ t0: curDrag.t0, t1: t, p: curDrag.p, dir: dir });
    curDrag = null;
  }

  // ---- Drawing ----
  function dot(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackdropRow(s, groundY) {
    // Faint, still, small suited figures behind the main figure.
    // Sized from their row spacing so neighbours never merge into bands.
    ctx.fillStyle = 'rgba(42,42,48,0.35)';
    var n = 5;
    var spacing = W * 0.76 / (n - 1);
    var fw = spacing * 0.50, fh = fw * 2.3;
    for (var i = 0; i < n; i++) {
      var fx = W * (0.12 + 0.76 * i / (n - 1));
      ctx.fillRect(fx - fw / 2, groundY - fh, fw, fh);
      ctx.beginPath();
      ctx.moveTo(fx + fw * 0.30, groundY - fh - fw * 0.28);
      ctx.arc(fx, groundY - fh - fw * 0.28, fw * 0.30, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFigure(p, lt, cx, groundY, s) {
    var col = mixColor(p);
    // Figure unit capped so the head never clips the top edge:
    // figure extent above ground is ~7.7u; keep its top below 0.05H.
    var u = Math.min(s * 0.10, (groundY - 0.05 * H) / 7.9);
    var hipY = groundY - 2.6 * u;
    var torsoH = 3.4 * u, torsoW = 2.1 * u;
    var torsoTop = hipY - torsoH;
    // Head: bowed (soft) -> chin up (sharp); nod amplitude scales with (1-p).
    var nod = (1 - p) * 0.14 * u * Math.sin(2 * Math.PI * lt / 6);
    var headTilt = lerp(-0.30, 0.24, p);
    var headY = torsoTop - 0.85 * u + lerp(0.35, -0.22, p) * u + nod;
    var headR = 0.82 * u;
    // Legs.
    ctx.fillStyle = col;
    ctx.fillRect(cx - 0.62 * u, hipY, 0.52 * u, 2.6 * u);
    ctx.fillRect(cx + 0.10 * u, hipY, 0.52 * u, 2.6 * u);
    // Torso: rounded shoulders when soft, square when sharp.
    var rad = lerp(0.85 * u, 0.04 * u, p);
    ctx.beginPath();
    ctx.moveTo(cx - torsoW / 2, hipY);
    ctx.lineTo(cx - torsoW / 2, torsoTop + rad);
    ctx.arc(cx - torsoW / 2 + rad, torsoTop + rad, rad, Math.PI, Math.PI * 1.5);
    ctx.lineTo(cx + torsoW / 2 - rad, torsoTop);
    ctx.arc(cx + torsoW / 2 - rad, torsoTop + rad, rad, Math.PI * 1.5, 0);
    ctx.lineTo(cx + torsoW / 2, hipY);
    ctx.closePath();
    ctx.fill();
    // Arms: hang at sides (soft) -> raised, mimicking suited gestures (sharp).
    var armAng = lerp(0.26, 2.45, p); // from downward vertical, outward
    var shoulderY = torsoTop + 0.55 * u;
    var armLen = 2.5 * u;
    ctx.strokeStyle = col;
    ctx.lineWidth = 0.52 * u;
    ctx.lineCap = 'round';
    var sides = [-1, 1];
    for (var i = 0; i < 2; i++) {
      var sg = sides[i];
      var sx = cx + sg * (torsoW / 2 - 0.18 * u);
      var ex = sx + sg * Math.sin(armAng) * armLen;
      var ey = shoulderY + Math.cos(armAng) * armLen;
      ctx.beginPath();
      ctx.moveTo(sx, shoulderY);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      ctx.fillStyle = SKIN;
      dot(ex, ey, 0.30 * u);
      ctx.fillStyle = col;
    }
    // Head disc, tilted by headTilt (drawn as disc; tilt reads via mouth/eyes).
    ctx.fillStyle = SKIN;
    ctx.save();
    ctx.translate(cx, headY);
    ctx.rotate(headTilt);
    dot(0, 0, headR);
    // Eyes: two dots.
    ctx.fillStyle = TRACK;
    dot(-0.32 * u, -0.10 * u, 0.07 * u);
    dot(0.32 * u, -0.10 * u, 0.07 * u);
    // Mouth: small line (soft) -> laughing open arc (sharp).
    var open = p;
    if (open < 0.15) {
      ctx.fillRect(-0.28 * u, 0.34 * u, 0.56 * u, 0.07 * u);
    } else {
      ctx.beginPath();
      ctx.moveTo(-0.34 * u, 0.30 * u);
      ctx.arc(0, 0.30 * u, 0.34 * u, 0, Math.PI);
      ctx.closePath();
      ctx.fill();
      // Laugh reads as an open mouth: deepen with openness.
      ctx.fillRect(-0.34 * u, 0.30 * u, 0.68 * u, 0.05 * u);
    }
    ctx.restore();
  }

  function draw(t) {
    size();
    var lt = t % LOOP;
    var p = pAt(t);
    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);
    var s = Math.min(W, H);
    var cx = W / 2;
    var groundY = H * 0.70;
    drawBackdropRow(s, groundY);
    drawFigure(p, lt, cx, groundY, s);
    // Slider strip across the lower fifth.
    var trackL = W * 0.15, trackR = W * 0.85;
    var trackY = H * 0.87;
    var thumbR = Math.max(0.022 * s, 10);
    geom.trackL = trackL; geom.trackR = trackR; geom.trackY = trackY; geom.thumbR = thumbR;
    ctx.fillStyle = TRACK;
    ctx.fillRect(trackL, trackY - Math.max(0.006 * H, 3), trackR - trackL, Math.max(0.012 * H, 6));
    ctx.fillStyle = THUMB;
    dot(lerp(trackL, trackR, p), trackY, thumbR);
  }

  // Pointer wiring (browser). Coordinates map directly: canvas fills the viewport.
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      var pos = pointerPos(e);
      onDown(pos.x, pos.y, nowSeconds());
      if (e.preventDefault) e.preventDefault();
    });
    canvas.addEventListener('pointermove', function (e) {
      var pos = pointerPos(e);
      onMove(pos.x, pos.y, nowSeconds());
    });
    canvas.addEventListener('pointerup', function (e) {
      var pos = pointerPos(e);
      onUp(pos.x, pos.y, nowSeconds());
    });
  }

  var startTs = null;
  function nowSeconds() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return Date.now() / 1000;
  }
  function loop(ts) {
    if (startTs === null) startTs = ts;
    draw((ts - startTs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }

  // Probe hook for the QA harness (vm-isolated, node-canvas).
  if (typeof window !== 'undefined') {
    window.__piece = {
      drawAt: function (t) { draw(t); },
      down: function (x, y, t) { onDown(x, y, t); },
      move: function (x, y, t) { onMove(x, y, t); },
      up: function (x, y, t) { onUp(x, y, t); },
      pAt: pAt,
      geom: function () { return geom; }
    };
  }

  // Boot: synchronous fixed-phase first frame.
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
