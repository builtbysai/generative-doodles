<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost in the Code</title>
<style>
html, body { margin: 0; padding: 0; background: #B98F99; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
/* Palette: pink and magenta noise grounds; faces in desaturated
   grey-rose; eyes near-black with occasional green glints. */
var GROUND = '#C8A2AB';
var PAGE = '#B98F99';
var PLATE = '#D8B4BC';
var INK = '#2A1A1E';
var FACE_LIGHT = '#C2A2A6';
var FACE_MID = '#B08E93';
var FACE_DARK = '#9A787F';
var EYE = '#191012';
var GLINT = '#6FA860';
var BROW = '#6E4A52';
var MOUTH = '#5E3F46';
var NOISE_COLS = ['#B96A8A', '#A84E74', '#D9AEB8', '#8F7A82', '#C77E96', '#7A5A64'];
var SEEDS = [1642001, 1642007, 1642013, 1642021, 1642027, 1642033];
var GROUND_SEED = 1642000;
/* The face re-expresses on slow LFOs; frame one is at t = 10 s, a
   neutral, slightly wary reading, the face already assembled. A tap
   deals the next seed from the table and the new soul assembles over
   2.5 s. */
var PHASE = 10, TAP_BLEND = 2.5;
var N_GRAIN = 1800, N_BLOTCH = 60, CELL = 9, MOSAIC = 14;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function lerp(a, b, f) { return a + (b - a) * f; }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var FACE_LIGHT_RGB = hexRgb(FACE_LIGHT);
var FACE_MID_RGB = hexRgb(FACE_MID);
var FACE_DARK_RGB = hexRgb(FACE_DARK);
var EYE_RGB = hexRgb(EYE);
var GLINT_RGB = hexRgb(GLINT);
var BROW_RGB = hexRgb(BROW);
var MOUTH_RGB = hexRgb(MOUTH);
var NOISE_RGB = NOISE_COLS.map(hexRgb);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Portrait composition: full-bleed on phones; on desktop a tight
   portrait frame centred on the piece's own pink ground. */
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var h = Math.min(VW, VH) * 0.94;
  var w = h * 0.76;
  return { x: (VW - w) / 2, y: (VH - h) / 2, w: w, h: h };
}
/* ---- the hash is the person: personality vector from a seed ---- */
var specCache = {};
function buildSpec(seed) {
  var rng = mulberry32(seed);
  var spec = {
    eyeSep: 0.36 + rng() * 0.12,
    eyeY: -0.30 + rng() * 0.08,
    eyeSize: 0.13 + rng() * 0.07,
    browThick: 0.05 + rng() * 0.05,
    browTilt: -0.16 + rng() * 0.32,
    browY: 0.07 + rng() * 0.05,
    noseLen: 0.30 + rng() * 0.18,
    noseW: 0.05 + rng() * 0.04,
    mouthY: 0.38 + rng() * 0.12,
    mouthW: 0.34 + rng() * 0.18,
    mouthBase: -0.10 + rng() * 0.30,
    faceW: 0.88 + rng() * 0.12,
    faceH: 0.88 + rng() * 0.12,
    asym: rng() * 2 - 1,
    cheek: rng(),
    grainPhase: rng() * TAU,
    eyeJ: [rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1],
    browJ: rng() * 2 - 1
  };
  var grain = [], blotch = [], i;
  for (i = 0; i < N_GRAIN; i++) {
    grain.push({
      x: rng(), y: rng(),
      r: 0.5 + rng() * 1.3,
      ci: Math.floor(rng() * NOISE_RGB.length),
      a: 0.05 + rng() * 0.23
    });
  }
  for (i = 0; i < N_BLOTCH; i++) {
    blotch.push({
      x: rng(), y: rng(),
      rx: 0.02 + rng() * 0.06, ry: 0.015 + rng() * 0.05,
      ci: Math.floor(rng() * NOISE_RGB.length),
      a: 0.03 + rng() * 0.05
    });
  }
  spec.grain = grain;
  spec.blotch = blotch;
  return spec;
}
function specFor(seed) {
  if (!specCache[seed]) specCache[seed] = buildSpec(seed);
  return specCache[seed];
}
/* ---- the noise ground: blocky pink/magenta cells, seed-fixed ---- */
var groundCache = null;
function buildGround() {
  var rng = mulberry32(GROUND_SEED);
  var cells = [], i;
  for (i = 0; i < 9000; i++) {
    cells.push({
      x: rng(), y: rng(),
      ci: Math.floor(rng() * NOISE_RGB.length),
      a: 0.05 + rng() * 0.16
    });
  }
  return cells;
}
function drawGround(rect) {
  var i, c, gx, gy;
  if (!groundCache) groundCache = buildGround();
  ctx.fillStyle = GROUND;
  ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
  for (i = 0; i < groundCache.length; i++) {
    c = groundCache[i];
    gx = rect.x + c.x * rect.w;
    gy = rect.y + c.y * rect.h;
    ctx.fillStyle = rgba(NOISE_RGB[c.ci], c.a);
    ctx.fillRect(gx, gy, CELL + 1, CELL + 1);
  }
}
/* ---- expression: slow closed-form LFOs across feature weights ---- */
function expression(t) {
  return {
    smile: 0.5 + 0.5 * Math.sin(TAU * t / 26 + 0.7),
    brow: Math.sin(TAU * t / 31 + 2.1),
    eyeOpen: 0.8 + 0.2 * Math.sin(TAU * t / 19 + 4.0),
    mouthOpen: 0.6 + 0.4 * Math.sin(TAU * t / 23 + 1.2),
    glint: smooth((Math.sin(TAU * t / 17 + 1.9) - 0.55) / 0.35)
  };
}
/* Soft smudge: concentric blobs, never a clean outline. moveTo before
   every arc, per the node-canvas quirk. */
function blob(cx, cy, rx, ry, rot, fill) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot || 0);
  ctx.scale(rx, ry);
  ctx.beginPath();
  ctx.moveTo(1, 0);
  ctx.arc(0, 0, 1, 0, TAU);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.restore();
}
function drawFace(spec, rect, t, alpha) {
  var ex = expression(t);
  var cx = rect.x + rect.w * (0.5 + spec.asym * 0.02);
  var cy = rect.y + rect.h * 0.47;
  var rx = rect.w * 0.42 * spec.faceW;
  var ry = rect.h * 0.40 * spec.faceH;
  var i, g, b;
  ctx.save();
  ctx.globalAlpha = alpha;
  /* Face mass: a thin radial wash that dissolves into the noise at
     the edges, plus large soft blobs to break any clean outline, so
     the face is barely there rather than a clean oval. */
  var grad = ctx.createRadialGradient(cx, cy, ry * 0.1, cx, cy, ry * 1.05);
  grad.addColorStop(0, rgba(FACE_LIGHT_RGB, 0.62));
  grad.addColorStop(0.55, rgba(FACE_MID_RGB, 0.55));
  grad.addColorStop(0.85, rgba(FACE_DARK_RGB, 0.28));
  grad.addColorStop(1, rgba(FACE_DARK_RGB, 0));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(cx + rx, cy);
  ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU);
  ctx.fill();
  blob(cx - rx * 0.55, cy - ry * 0.30, rx * 0.42, ry * 0.34, 0.3, rgba(FACE_MID_RGB, 0.20));
  blob(cx + rx * 0.55, cy + ry * 0.25, rx * 0.40, ry * 0.36, -0.3, rgba(FACE_MID_RGB, 0.18));
  blob(cx, cy + ry * 0.55, rx * 0.45, ry * 0.28, 0, rgba(FACE_DARK_RGB, 0.14));
  blob(cx - rx * 0.75, cy + ry * 0.05, rx * 0.30, ry * 0.42, 0.5, rgba(FACE_MID_RGB, 0.16));
  blob(cx + rx * 0.70, cy - ry * 0.45, rx * 0.34, ry * 0.30, -0.4, rgba(FACE_LIGHT_RGB, 0.18));
  blob(cx, cy - ry * 0.70, rx * 0.50, ry * 0.26, 0, rgba(FACE_LIGHT_RGB, 0.14));
  /* Blobs straddling the face edge, so no clean oval outline survives. */
  blob(cx - rx * 0.98, cy - ry * 0.10, rx * 0.26, ry * 0.34, 0.7, rgba(FACE_MID_RGB, 0.20));
  blob(cx + rx * 0.96, cy + ry * 0.30, rx * 0.24, ry * 0.36, -0.6, rgba(FACE_MID_RGB, 0.18));
  blob(cx - rx * 0.60, cy + ry * 0.92, rx * 0.34, ry * 0.22, 0.2, rgba(FACE_DARK_RGB, 0.16));
  blob(cx + rx * 0.55, cy - ry * 0.88, rx * 0.30, ry * 0.24, -0.3, rgba(FACE_LIGHT_RGB, 0.16));
  /* Cheeks: faint rose shade, strength from the hash. */
  if (spec.cheek > 0.15) {
    blob(cx - rx * 0.52, cy + ry * 0.18, rx * 0.20, ry * 0.12, 0.2, rgba(FACE_DARK_RGB, 0.16 * spec.cheek));
    blob(cx + rx * 0.52, cy + ry * 0.18, rx * 0.20, ry * 0.12, -0.2, rgba(FACE_DARK_RGB, 0.16 * spec.cheek));
  }
  /* Eyes: dark smudges, three overlapping layers each, jittered so
     no two eyes match and no ring reads as a goggle. */
  var eyeY = cy + spec.eyeY * ry;
  var eyeDx = rx * spec.eyeSep;
  var eyeRx = rx * spec.eyeSize;
  var eyeRy = eyeRx * 0.55 * ex.eyeOpen;
  var sides = [-1, 1];
  for (i = 0; i < 2; i++) {
    var exx = cx + sides[i] * eyeDx + spec.asym * 2 + spec.eyeJ[i * 2] * eyeRx * 0.3;
    var eyy = eyeY + sides[i] * spec.asym * 1.5 + spec.eyeJ[i * 2 + 1] * eyeRy * 0.3;
    blob(exx, eyy, eyeRx * 1.25, eyeRy * 1.6, sides[i] * 0.12, rgba(EYE_RGB, 0.10));
    blob(exx + eyeRx * 0.08, eyy - eyeRy * 0.06, eyeRx * 0.95, eyeRy * 1.2, -sides[i] * 0.08, rgba(EYE_RGB, 0.24));
    blob(exx - eyeRx * 0.05, eyy + eyeRy * 0.05, eyeRx * 0.62, eyeRy * 0.85, sides[i] * 0.05, rgba(EYE_RGB, 0.52));
    /* Occasional green glint, on a slow deterministic pulse. */
    if (ex.glint > 0.02) {
      blob(exx + eyeRx * 0.25, eyy - eyeRy * 0.25, 2.2, 2.2, 0, rgba(GLINT_RGB, 0.75 * ex.glint));
    }
  }
  /* Brows: heavy flat masses above the eyes, tilted by hash and mood. */
  var browY = eyeY - spec.browY * ry + ex.brow * ry * 0.03;
  var browTilt = spec.browTilt + ex.brow * 0.10;
  for (i = 0; i < 2; i++) {
    var bxx = cx + sides[i] * eyeDx + spec.browJ * 2;
    blob(bxx, browY, eyeRx * 1.6, ry * spec.browThick * 0.55, sides[i] * browTilt, rgba(BROW_RGB, 0.30));
    blob(bxx, browY + ry * 0.008, eyeRx * 1.1, ry * spec.browThick * 0.4, sides[i] * browTilt, rgba(BROW_RGB, 0.24));
  }
  /* Nose: a suggestion only, three wide overlapping blobs merged into
     one soft diffuse wedge, never a capsule or three separate dots. */
  var noseTop = eyeY + ry * 0.10;
  var noseLen = spec.noseLen * ry;
  blob(cx + spec.asym * 2, noseTop + noseLen * 0.28, rx * spec.noseW * 1.7, noseLen * 0.34, 0.10, rgba(FACE_DARK_RGB, 0.16));
  blob(cx + spec.asym * 2, noseTop + noseLen * 0.55, rx * spec.noseW * 2.0, noseLen * 0.32, -0.08, rgba(FACE_DARK_RGB, 0.19));
  blob(cx + spec.asym * 2, noseTop + noseLen * 0.82, rx * spec.noseW * 2.2, noseLen * 0.22, 0, rgba(FACE_DARK_RGB, 0.17));
  /* Mouth: a blur whose curve and openness follow the slow cycle. */
  var mouthY = cy + spec.mouthY * ry;
  var mouthW = rx * spec.mouthW;
  var mouthH = ry * 0.055 * (0.5 + ex.mouthOpen);
  var curve = (spec.mouthBase + (ex.smile - 0.5) * 0.9) * mouthW * 0.35;
  blob(cx, mouthY, mouthW * 0.55, mouthH * 1.6, 0, rgba(MOUTH_RGB, 0.20));
  blob(cx, mouthY, mouthW * 0.42, mouthH, 0, rgba(MOUTH_RGB, 0.38));
  ctx.strokeStyle = rgba(MOUTH_RGB, 0.45);
  ctx.lineWidth = Math.max(1, mouthH * 0.5);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - mouthW * 0.42, mouthY);
  ctx.quadraticCurveTo(cx, mouthY + curve, cx + mouthW * 0.42, mouthY);
  ctx.stroke();
  /* Grain: drawn stipple from this soul's seed, heavy throughout. */
  for (i = 0; i < spec.grain.length; i++) {
    g = spec.grain[i];
    ctx.fillStyle = rgba(NOISE_RGB[g.ci], g.a);
    ctx.fillRect(rect.x + g.x * rect.w, rect.y + g.y * rect.h, g.r + 0.6, g.r + 0.6);
  }
  for (i = 0; i < spec.blotch.length; i++) {
    b = spec.blotch[i];
    blob(rect.x + b.x * rect.w, rect.y + b.y * rect.h, b.rx * rect.w, b.ry * rect.h, 0, rgba(NOISE_RGB[b.ci], b.a));
  }
  ctx.restore();
}
/* Pixelation pass: a coarse mosaic veil over the face, a render pass
   rather than a texture, seeded once per soul. */
var mosaicCache = {};
function drawMosaic(seed, rect, alpha) {
  var key = seed;
  var rng, cells, i, c;
  if (!mosaicCache[key]) {
    rng = mulberry32(seed + 77);
    cells = [];
    var cols = Math.ceil(1 / (MOSAIC / 800)) + 2;
    for (i = 0; i < 2600; i++) {
      cells.push({
        x: rng(), y: rng(),
        ci: Math.floor(rng() * NOISE_RGB.length),
        a: 0.02 + rng() * 0.05
      });
    }
    mosaicCache[key] = cells;
  }
  cells = mosaicCache[key];
  ctx.save();
  ctx.globalAlpha = alpha;
  for (i = 0; i < cells.length; i++) {
    c = cells[i];
    ctx.fillStyle = rgba(NOISE_RGB[c.ci], c.a);
    ctx.fillRect(rect.x + c.x * rect.w, rect.y + c.y * rect.h, MOSAIC + 1, MOSAIC + 1);
  }
  ctx.restore();
}
function drawText(rect) {
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  var titlePx = isPhone ? 16 : 20;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Ghost in the Code').width > rect.w - 40) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Ghost in the Code').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 11').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = cxm - plateW / 2, plateY = rect.y + 10;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(hexRgb(INK), 0.25);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Ghost in the Code', cxm, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(hexRgb(INK), 0.75);
  ctx.fillText('2006 · 07 · 11', cxm, plateY + 7 + titlePx + 3);
  var hint = 'Tap for a new soul.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cxm - hintPlateW / 2;
  var hintPlateY = rect.y + rect.h - hintPlateH - 10;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(hexRgb(INK), 0.25);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(hexRgb(INK), 0.85);
  ctx.fillText(hint, cxm, hintPlateY + 7);
}
/* ---- tap: perturb the hash, deal the next soul from the table ---- */
var seedIdx = 0, prevIdx = 0, tapT = -1e9;
function doTap(t) {
  prevIdx = seedIdx;
  seedIdx = (seedIdx + 1) % SEEDS.length;
  tapT = t;
}
function onPointerDown(e) {
  doTap(clockT);
  if (e && e.preventDefault) e.preventDefault();
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('mousedown', onPointerDown);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function draw(t) {
  size();
  var rect = compRect();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = PAGE;
  ctx.fillRect(0, 0, VW, VH);
  drawGround(rect);
  var k = smooth((t - tapT) / TAP_BLEND);
  if (k >= 1 || prevIdx === seedIdx) {
    drawFace(specFor(SEEDS[seedIdx]), rect, t, 1);
    drawMosaic(SEEDS[seedIdx], rect, 1);
  } else {
    drawFace(specFor(SEEDS[prevIdx]), rect, t, 1 - k);
    drawFace(specFor(SEEDS[seedIdx]), rect, t, k);
    drawMosaic(SEEDS[prevIdx], rect, 1 - k);
    drawMosaic(SEEDS[seedIdx], rect, k);
  }
  ctx.strokeStyle = rgba(hexRgb(INK), 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1);
  drawText(rect);
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    seedAt: function () { return SEEDS[seedIdx]; },
    expressionAt: function (t) { return expression(t); },
    tapAt: function (t) { doTap(t); },
    tapDone: function (t) { return smooth((t - tapT) / TAP_BLEND); },
    drawAt: function (t) { draw(t); }
  };
}
/* ---- frame one: fixed phase, fixed seed, no wall clock ---- */
size();
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
