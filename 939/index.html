<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelli Circolari: A Model of a Model</title>
<style>
  html, body { margin: 0; padding: 0; background: #F3E9E2; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- themes: one colour family each, nothing else ----------
  var THEMES = [
    { paper: '#F3E9E2', wash: ['#E0572F', '#B23A2E'], ink: '#3A231C', thread: '#E8B62D',
      words: ['memory', 'signal', 'the self', 'dream'],
      labels: ['a synapse', 'a signal', 'a loop of thought', 'a spark'] },
    { paper: '#E9EBF0', wash: ['#3B4B8C', '#2C3E70'], ink: '#232838', thread: '#E0572F',
      words: ['name', 'mirror', 'root', 'story'],
      labels: ['a root', 'a reflection', 'a seam', 'a name'] },
    { paper: '#F5EEDC', wash: ['#D9A441', '#B9770E'], ink: '#3A2E14', thread: '#3B4B8C',
      words: ['rhythm', 'measure', 'rest', 'return'],
      labels: ['a downbeat', 'a measure', 'a rest', 'a return'] },
    { paper: '#EDF0E4', wash: ['#7A9B6E', '#4E7245'], ink: '#24301F', thread: '#B23A2E',
      words: ['step', 'turn', 'weight', 'breath'],
      labels: ['a step', 'a turn', 'a weight shift', 'a breath'] }
  ];

  var LOOP = 79;        // per theme: 60 draw-in + 15 hold + 4 drain
  var PHASE0 = 36.5;    // frame one: red theme, washes bloomed, circle complete,
                        // about half the symbols in, first thread stitched across
  var GLYPHS = ['node', 'arc', 'spiral', 'cross', 'arrow', 'grid', 'rings', 'zigzag',
                'node', 'rings', 'arc', 'spiral'];
  var THREAD_WIN = [[28, 36], [48, 54], [54, 60]]; // stitch windows in phase seconds
  var WORD_POS = [0, 1, 6, 9]; // appearance positions carrying the words and labels:
                               // the first two are lettered by frame one, the rest arrive later

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  function rgba(hex, a) {
    var c = hexRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  // ---------- per-theme seeded model ----------
  function buildTheme(idx) {
    var rng = mulberry32(939100 + idx * 131);
    var th = THEMES[idx];
    var model = { washes: [], symbols: [], links: [], circleF: [], threads: [] };
    var i, j, k;

    // washes: 10 blobs, each 3 nested irregular polygons of flat alpha
    for (i = 0; i < 10; i++) {
      var blob = {
        fx: 0.04 + rng() * 0.92, fy: 0.04 + rng() * 0.92,
        rad: 0.26 + rng() * 0.30, tone: rng() < 0.5 ? 0 : 1,
        stir: 0.25 + rng() * 0.75, layers: []
      };
      var scales = [1, 0.7, 0.44], alphas = [0.09, 0.12, 0.15];
      for (k = 0; k < 3; k++) {
        var pts = [], baseA = rng() * Math.PI * 2;
        for (j = 0; j < 9; j++) {
          var ang = baseA + (j / 9) * Math.PI * 2;
          var rr = 0.76 + rng() * 0.36;
          pts.push({ x: Math.cos(ang) * rr * scales[k], y: Math.sin(ang) * rr * scales[k] });
        }
        blob.layers.push({ pts: pts, tone: k === 1 ? 1 - blob.tone : blob.tone, alpha: alphas[k] });
      }
      model.washes.push(blob);
    }

    // circle boundary wobble factors (64 points)
    var p1 = rng() * Math.PI * 2, p2 = rng() * Math.PI * 2;
    for (i = 0; i < 64; i++) {
      var a = (i / 64) * Math.PI * 2;
      model.circleF.push(1 + 0.011 * Math.sin(3 * a + p1) + 0.008 * Math.sin(7 * a + p2) + (rng() - 0.5) * 0.012);
    }

    // symbols: 12 placed inside the circle (unit-disk coords), min separation
    var placed = [], guard = 0;
    while (placed.length < 12 && guard < 4000) {
      guard++;
      var px = (rng() * 2 - 1) * 0.8, py = (rng() * 2 - 1) * 0.8;
      if (px * px + py * py > 0.64) continue;
      var ok = true;
      for (j = 0; j < placed.length; j++) {
        var dx = px - placed[j].x, dy = py - placed[j].y;
        if (dx * dx + dy * dy < 0.36 * 0.36) { ok = false; break; }
      }
      if (ok) placed.push({ x: px, y: py });
    }
    // appearance order: seeded shuffle; four spread positions in it carry the words and labels
    var order = [];
    for (i = 0; i < placed.length; i++) order.push(i);
    for (i = order.length - 1; i > 0; i--) {
      j = Math.floor(rng() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    for (i = 0; i < placed.length; i++) {
      var pos = order.indexOf(i);
      model.symbols.push({
        x: placed[i].x, y: placed[i].y,
        glyph: GLYPHS[i % GLYPHS.length],
        size: 0.10 + rng() * 0.07,
        rot: rng() * Math.PI * 2,
        tone: rng() < 0.55 ? -1 : (rng() < 0.5 ? 0 : 1),
        appear: 14 + pos * 4.0,
        word: WORD_POS.indexOf(pos) >= 0 ? th.words[WORD_POS.indexOf(pos)] : null,
        label: WORD_POS.indexOf(pos) >= 0 ? th.labels[WORD_POS.indexOf(pos)] : null,
        wordRot: (rng() - 0.5) * 0.1
      });
    }
    // connections: chain through appearance order, plus a few seeded extras
    var seen = {};
    function addLink(a2, b2) {
      if (a2 === b2) return;
      var key = Math.min(a2, b2) + '_' + Math.max(a2, b2);
      if (seen[key]) return;
      seen[key] = true;
      model.links.push({ a: a2, b: b2, bend: (rng() - 0.5) * 0.55 });
    }
    for (i = 0; i + 1 < order.length && i < 7; i++) addLink(order[i], order[i + 1]);
    for (i = 0; i < 3; i++) addLink(Math.floor(rng() * placed.length), Math.floor(rng() * placed.length));

    // threads: 3 seeded diagonals across the whole composition
    for (i = 0; i < 3; i++) {
      if (rng() < 0.5) {
        model.threads.push({ horiz: true, a: 0.14 + rng() * 0.72, b: 0.14 + rng() * 0.72 });
      } else {
        model.threads.push({ horiz: false, a: 0.14 + rng() * 0.72, b: 0.14 + rng() * 0.72 });
      }
    }
    return model;
  }
  var MODELS = [buildTheme(0), buildTheme(1), buildTheme(2), buildTheme(3)];

  // ---------- canvas / view ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function isPhone() {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    if (sw < 700) return true;
    return H > W * 1.15;
  }
  function resize() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    PHONE = isPhone();
    draw(lastT);
  }

  // ---------- interaction state (recorded events; drawing is a closed form of these) ----------
  var skips = [];            // double-tap times: jump to next theme
  var tapRead = null;        // {sym, t} latest symbol read
  var lastTapT = -100;
  var dragging = false, dragMoved = false;
  var dragStart = { x: 0, y: 0 }, dragCur = { x: 0, y: 0 }, downT = 0;
  var releaseInfo = null;    // {dx, dy, t}
  var lastT = 0;

  function effTime(t) {
    var adj = 0, i;
    for (i = 0; i < skips.length; i++) {
      if (skips[i] > t) break;
      var cur = skips[i] + PHASE0 + adj;
      var rem = cur % LOOP;
      adj += (rem === 0 ? 0 : LOOP - rem);
    }
    return t + PHASE0 + adj;
  }
  function clockNow() {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    return (now - startStamp) / 1000;
  }

  // ---------- audio (lazy, gesture-only, fully guarded) ----------
  var AC = null, noiseBuf = null;
  function ensureAudio() {
    if (AC) { if (AC.state === 'suspended' && AC.resume) AC.resume(); return; }
    var Ctor = (typeof window !== 'undefined') ? (window.AudioContext || window.webkitAudioContext) : null;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      var len = AC.sampleRate * 1.2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0), i;
      var r = mulberry32(939);
      for (i = 0; i < len; i++) d[i] = r() * 2 - 1;
      noiseBuf = buf;
    } catch (e) { AC = null; }
  }
  function noiseHit(dur, freq, gain, type) {
    if (!AC || !noiseBuf) return;
    try {
      var src = AC.createBufferSource(); src.buffer = noiseBuf;
      var f = AC.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = 0.9;
      var g = AC.createGain(), t = AC.currentTime;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(AC.destination);
      src.start(t); src.stop(t + dur + 0.05);
    } catch (e) {}
  }
  function tickHit() {
    if (!AC) return;
    try {
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
      o.type = 'square'; o.frequency.value = 1900;
      g.gain.setValueAtTime(0.015, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + 0.06);
    } catch (e) {}
  }
  function swellHit() { noiseHit(2.4, 220, 0.05, 'lowpass'); }
  function scratchHit() { noiseHit(0.28, 2600, 0.035, 'bandpass'); }

  // ---------- glyph drawing ----------
  function drawGlyph(g, s, col, lw) {
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var i, a, r;
    if (g === 'node') {
      ctx.beginPath(); ctx.arc(0, 0, s * 0.34, 0, Math.PI * 2); ctx.fill();
    } else if (g === 'arc') {
      ctx.beginPath(); ctx.arc(0, 0, s * 0.62, 0.3, 0.3 + 3.9); ctx.stroke();
    } else if (g === 'spiral') {
      ctx.beginPath();
      for (i = 0; i <= 40; i++) {
        a = (i / 40) * Math.PI * 5; r = s * 0.62 * (i / 40);
        var x = Math.cos(a) * r, y = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    } else if (g === 'cross') {
      ctx.beginPath();
      ctx.moveTo(-s * 0.55, 0); ctx.lineTo(s * 0.55, 0);
      ctx.moveTo(0, -s * 0.55); ctx.lineTo(0, s * 0.55);
      ctx.stroke();
    } else if (g === 'arrow') {
      ctx.beginPath();
      ctx.moveTo(-s * 0.6, 0); ctx.lineTo(s * 0.6, 0);
      ctx.moveTo(s * 0.6, 0); ctx.lineTo(s * 0.3, -s * 0.28);
      ctx.moveTo(s * 0.6, 0); ctx.lineTo(s * 0.3, s * 0.28);
      ctx.stroke();
    } else if (g === 'grid') {
      var q = s * 0.95;
      ctx.beginPath();
      ctx.rect(-q / 2, -q / 2, q, q);
      ctx.moveTo(-q / 6, -q / 2); ctx.lineTo(-q / 6, q / 2);
      ctx.moveTo(q / 6, -q / 2); ctx.lineTo(q / 6, q / 2);
      ctx.moveTo(-q / 2, -q / 6); ctx.lineTo(q / 2, -q / 6);
      ctx.moveTo(-q / 2, q / 6); ctx.lineTo(q / 2, q / 6);
      ctx.stroke();
    } else if (g === 'rings') {
      var rr = [0.2, 0.4, 0.62], k;
      for (k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(0, 0, s * rr[k], 0, Math.PI * 2); ctx.stroke(); }
    } else { // zigzag
      ctx.beginPath();
      for (i = 0; i <= 5; i++) {
        var zx = -s * 0.6 + (i / 5) * s * 1.2, zy = (i % 2 === 0 ? -1 : 1) * s * 0.3;
        if (i === 0) ctx.moveTo(zx, zy); else ctx.lineTo(zx, zy);
      }
      ctx.stroke();
    }
  }

  // ---------- main draw: pure function of t and recorded events ----------
  function draw(t) {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var e = effTime(t);
    var themeIdx = Math.floor(e / LOOP) % 4;
    var p = e % LOOP;
    var th = THEMES[themeIdx];
    var model = MODELS[themeIdx];

    if (typeof document !== 'undefined' && document.body && document.body.style) {
      document.body.style.background = th.paper;
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = th.paper;
    ctx.fillRect(0, 0, W, H);

    var minD = Math.min(W, H);
    var cx = W / 2, cy = H / 2, R = minD * 0.275;
    var contentK = p > 75 ? 1 - (p - 75) / 4 : 1;
    var lw = Math.max(1.1, minD * 0.0022);
    var i, j;

    // gridded paper at the margins only (outside the circle's frame)
    ctx.strokeStyle = rgba(th.ink, 0.08 * contentK);
    ctx.lineWidth = 1;
    var gs = minD / 18, gx, gy;
    ctx.beginPath();
    for (gx = gs; gx < W; gx += gs) {
      if (Math.abs(gx - cx) > R + 14) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
    }
    for (gy = gs; gy < H; gy += gs) {
      if (Math.abs(gy - cy) > R + 14) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
    }
    ctx.stroke();

    // stir offset for the washes (closed form over drag events)
    var stirX = 0, stirY = 0;
    if (dragging && dragMoved) { stirX = dragCur.x - dragStart.x; stirY = dragCur.y - dragStart.y; }
    else if (releaseInfo) {
      var age = t - releaseInfo.t;
      if (age < 4) { var dk = Math.exp(-age / 0.9); stirX = releaseInfo.dx * dk; stirY = releaseInfo.dy * dk; }
    }

    // washes: layered flat-alpha blobs, blooming in over the first seconds
    for (i = 0; i < model.washes.length; i++) {
      var b = model.washes[i];
      var bloom = clamp01((p - i * 0.8) / 6);
      if (bloom <= 0) continue;
      var bx = b.fx * W + stirX * b.stir, by = b.fy * H + stirY * b.stir, brad = b.rad * minD;
      for (j = 0; j < b.layers.length; j++) {
        var lay = b.layers[j];
        ctx.fillStyle = rgba(th.wash[lay.tone], lay.alpha * bloom * contentK);
        ctx.beginPath();
        for (var k = 0; k < lay.pts.length; k++) {
          var vx = bx + lay.pts[k].x * brad, vy = by + lay.pts[k].y * brad;
          if (k === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
        }
        ctx.closePath(); ctx.fill();
      }
    }

    // symbol pixel positions
    var S = [];
    for (i = 0; i < model.symbols.length; i++) {
      var sm = model.symbols[i];
      S.push({ x: cx + sm.x * R, y: cy + sm.y * R, s: sm.size * R, m: sm });
    }

    // connections: wobbled curves, drawn once both ends are in
    ctx.strokeStyle = rgba(th.ink, 0.5 * contentK);
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    for (i = 0; i < model.links.length; i++) {
      var lk = model.links[i];
      var A = S[lk.a], B = S[lk.b];
      var start = Math.max(A.m.appear, B.m.appear) + 0.6;
      var prog = clamp01((p - start) / 2.2);
      if (prog <= 0) continue;
      var mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      var dx = B.x - A.x, dy = B.y - A.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var ox = (-dy / len) * lk.bend * len * 0.3, oy = (dx / len) * lk.bend * len * 0.3;
      var steps = 24, upto = Math.max(2, Math.floor(steps * prog));
      ctx.beginPath();
      for (j = 0; j <= upto; j++) {
        var u = (j / steps) * prog;
        var qx = (1 - u) * (1 - u) * A.x + 2 * (1 - u) * u * (mx + ox) + u * u * B.x;
        var qy = (1 - u) * (1 - u) * A.y + 2 * (1 - u) * u * (my + oy) + u * u * B.y;
        if (j === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy);
      }
      ctx.stroke();
    }

    // the inner focus circle: hand-wobbled boundary, drawing itself in
    var cfrac = clamp01((p - 8) / 8);
    if (cfrac > 0) {
      ctx.strokeStyle = rgba(th.ink, 0.85 * contentK);
      ctx.lineWidth = Math.max(1.6, minD * 0.004);
      ctx.beginPath();
      var npts = 64, upto2 = Math.floor(npts * cfrac);
      for (i = 0; i <= upto2; i++) {
        var idx = i % npts, ang = (idx / npts) * Math.PI * 2;
        var rad = R * model.circleF[idx];
        var vx2 = cx + Math.cos(ang) * rad, vy2 = cy + Math.sin(ang) * rad;
        if (i === 0) ctx.moveTo(vx2, vy2); else ctx.lineTo(vx2, vy2);
      }
      if (cfrac >= 1) ctx.closePath();
      ctx.stroke();
    }

    // symbols, populating inward in seeded order
    var tapAge = tapRead ? t - tapRead.t : 99;
    for (i = 0; i < S.length; i++) {
      var it = S[i], sprog = clamp01((p - it.m.appear) / 1.4);
      if (sprog <= 0) continue;
      var pulse = 1;
      if (tapRead && tapRead.sym === i && tapAge < 3) {
        pulse = 1 + 0.3 * Math.sin(Math.min(tapAge / 0.5, 1) * Math.PI * 0.5) * (tapAge > 2.4 ? (3 - tapAge) / 0.6 : 1);
      }
      var col = it.m.tone < 0 ? th.ink : th.wash[it.m.tone];
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.m.rot);
      ctx.globalAlpha = sprog * contentK;
      drawGlyph(it.m.glyph, it.s * (0.7 + 0.3 * sprog) * pulse, col, lw);
      ctx.restore();
      ctx.globalAlpha = 1;

      // the theme's words, lettered small beside their symbols
      if (it.m.word) {
        var wprog = clamp01((p - it.m.appear - 0.5) / 1.2);
        if (wprog > 0) {
          ctx.save();
          ctx.translate(it.x + it.s * 0.15, it.y + it.s * 1.4);
          ctx.rotate(it.m.wordRot);
          ctx.font = '600 ' + Math.max(10, minD * 0.028) + 'px "Segoe Print","Bradley Hand","Comic Sans MS",cursive';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = rgba(th.ink, 0.9 * wprog * contentK);
          ctx.fillText(it.m.word, 0, 0);
          ctx.restore();
        }
      }
    }

    // threads: stitched diagonals crossing the whole composition
    ctx.strokeStyle = rgba(th.thread, 0.9 * contentK);
    ctx.lineWidth = Math.max(1.6, minD * 0.0032);
    ctx.lineCap = 'round';
    for (i = 0; i < model.threads.length; i++) {
      var td = model.threads[i], win = THREAD_WIN[i];
      var tprog = clamp01((p - win[0]) / (win[1] - win[0]));
      if (tprog <= 0) continue;
      var x1, y1, x2, y2;
      if (td.horiz) { x1 = -0.04 * W; y1 = td.a * H; x2 = 1.04 * W; y2 = td.b * H; }
      else { x1 = td.a * W; y1 = -0.04 * H; x2 = td.b * W; y2 = 1.04 * H; }
      var tdx = x2 - x1, tdy = y2 - y1, tlen = Math.sqrt(tdx * tdx + tdy * tdy);
      var ux = tdx / tlen, uy = tdy / tlen;
      var seg = minD * 0.014 + 4, gap = minD * 0.010 + 3, tick = minD * 0.008 + 2;
      var nSt = Math.floor(tlen / (seg + gap)), fSt = tprog * nSt;
      ctx.beginPath();
      for (j = 0; j < Math.ceil(fSt); j++) {
        var f0 = j * (seg + gap), f1 = Math.min(f0 + seg, f0 + seg * Math.min(1, fSt - j));
        if (f1 <= f0) continue;
        ctx.moveTo(x1 + ux * f0, y1 + uy * f0);
        ctx.lineTo(x1 + ux * f1, y1 + uy * f1);
        var cm = (f0 + f1) / 2;
        ctx.moveTo(x1 + ux * cm - uy * tick / 2, y1 + uy * cm + ux * tick / 2);
        ctx.lineTo(x1 + ux * cm + uy * tick / 2, y1 + uy * cm - ux * tick / 2);
      }
      ctx.stroke();
    }

    // tap label: the read symbol names itself for three seconds
    if (tapRead && tapAge < 3 && tapRead.theme === themeIdx) {
      var TS = S[tapRead.sym];
      if (TS && TS.m.label) {
        var la = Math.min(1, (3 - tapAge) / 0.5) * contentK;
        ctx.save();
        ctx.translate(TS.x, TS.y - TS.s * 1.55);
        ctx.font = '600 ' + Math.max(11, minD * 0.03) + 'px "Segoe Print","Bradley Hand","Comic Sans MS",cursive';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = rgba(th.ink, 0.92 * la);
        ctx.fillText(TS.m.label, 0, 0);
        ctx.strokeStyle = rgba(th.ink, 0.5 * la);
        ctx.lineWidth = 1;
        var tw = ctx.measureText(TS.m.label).width;
        ctx.beginPath();
        ctx.moveTo(-tw / 2, minD * 0.02);
        ctx.lineTo(tw / 2, minD * 0.02);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  // ---------- pointer interaction ----------
  function ptrPos(ev) {
    var r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', function (ev) {
    ensureAudio();
    var pos = ptrPos(ev);
    dragging = true; dragMoved = false;
    dragStart = pos; dragCur = pos; downT = clockNow();
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!dragging) return;
    dragCur = ptrPos(ev);
    var dx = dragCur.x - dragStart.x, dy = dragCur.y - dragStart.y;
    if (dx * dx + dy * dy > 36) dragMoved = true;
    if (dragMoved) draw(lastT);
  });
  canvas.addEventListener('pointerup', function (ev) {
    if (!dragging) return;
    dragging = false;
    var now = clockNow();
    if (dragMoved) {
      releaseInfo = { dx: dragCur.x - dragStart.x, dy: dragCur.y - dragStart.y, t: now };
      draw(lastT);
      return;
    }
    if (now - downT > 0.35) return;
    // a tap
    if (now - lastTapT < 0.34) {
      // double tap: next theme now
      skips.push(now);
      lastTapT = -100;
      tapRead = null;
      draw(lastT);
      return;
    }
    lastTapT = now;
    // hit test against the current theme's symbols
    var e = effTime(now);
    var themeIdx = Math.floor(e / LOOP) % 4;
    var model = MODELS[themeIdx];
    var minD = Math.min(W, H), cx = W / 2, cy = H / 2, R = minD * 0.275;
    var pos = ptrPos(ev), best = -1, bestD = 1e9;
    for (var i = 0; i < model.symbols.length; i++) {
      var sm = model.symbols[i];
      var sx = cx + sm.x * R, sy = cy + sm.y * R;
      var ddx = pos.x - sx, ddy = pos.y - sy, d2 = ddx * ddx + ddy * ddy;
      var thr = Math.max(sm.size * R, 26);
      if (d2 < thr * thr && d2 < bestD) { bestD = d2; best = i; }
    }
    if (best >= 0) {
      tapRead = { sym: best, t: now, theme: themeIdx };
      draw(lastT);
    }
  });
  canvas.addEventListener('pointercancel', function () {
    dragging = false; dragMoved = false;
  });

  // ---------- audio cues, driven by phase crossings in the live loop ----------
  var prevTheme = -1, prevSymCount = 0, prevStitch = 0;
  function audioCues(t) {
    if (!AC) return;
    var e = effTime(t);
    var themeIdx = Math.floor(e / LOOP) % 4;
    var p = e % LOOP;
    var model = MODELS[themeIdx];
    var i, sc = 0, st = 0;
    for (i = 0; i < model.symbols.length; i++) if (p >= model.symbols[i].appear) sc++;
    for (i = 0; i < model.threads.length; i++) st += clamp01((p - THREAD_WIN[i][0]) / (THREAD_WIN[i][1] - THREAD_WIN[i][0]));
    if (themeIdx !== prevTheme) { swellHit(); prevSymCount = 0; prevStitch = 0; }
    else {
      if (sc > prevSymCount) scratchHit();
      if (Math.floor(st * 40) > Math.floor(prevStitch * 40)) tickHit();
    }
    prevTheme = themeIdx; prevSymCount = sc; prevStitch = st;
  }

  // ---------- boot ----------
  var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', resize);
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  resize();
  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    var frame = function (now) {
      var t = (now - startStamp) / 1000;
      lastT = t;
      audioCues(t);
      draw(t);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
