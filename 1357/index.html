<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dingo Chorus</title>
<style>
  html, body { margin: 0; padding: 0; background: #14120f; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  // Dingo Chorus — №1357. No readable text except <title>. No gradients,
  // no shadowBlur, no Path2D, no offscreen canvas, no createElement, no
  // microphone. Audio only via lazily created, typeof-guarded WebAudio
  // inside a pointer gesture. No Math.random anywhere: mulberry32 only.
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, S = 0, isPhone = false, nowT = 0;
  var skulls = [];
  var pointerDown = false, pointerX = 0, pointerY = 0;
  var listenIdx = -1, releaseLean = 0, releaseT = -100;
  var audioCtx = null;

  function viewportSize() {
    var w, h;
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport && window.visualViewport.width) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return [w, h];
  }

  function buildLayout() {
    var dims = viewportSize();
    W = dims[0]; H = dims[1]; S = Math.min(W, H);
    var scrMin = 1e9;
    if (typeof window.screen !== 'undefined' && window.screen) {
      scrMin = Math.min(window.screen.width, window.screen.height);
    }
    isPhone = scrMin < 700 || H > W * 1.15;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    skulls = [];
    var vpX = 0.66 * W, vpY = 0.40 * H;
    var x0 = 0.13 * W, y0 = 0.90 * H;
    var x1 = 0.60 * W, y1 = 0.54 * H;
    for (var i = 0; i < 7; i++) {
      var d = i / 6;
      var rng = mulberry32(1357000 + i * 7919);
      var bx = x0 + (x1 - x0) * d;
      var by = y0 + (y1 - y0) * d;
      var scale = 1.0 + (0.30 - 1.0) * d;
      var pts = [];
      for (var k = 0; k < 10; k++) {
        pts.push(0.88 + rng() * 0.24);
      }
      var speck = [];
      for (var j = 0; j < 14; j++) {
        speck.push([rng(), rng(), rng()]);
      }
      skulls.push({
        i: i, d: d, bx: bx, by: by, scale: scale,
        h: 0.30 * S * scale, pts: pts, speck: speck,
        glow: (i === 1 || i === 4 || i === 5),
        headTilt: (rng() - 0.5) * 0.5
      });
    }
  }

  function ellipsePath(cx, cy, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  }

  function blobPath(cx, cy, rx, ry, pts) {
    ctx.beginPath();
    for (var k = 0; k < pts.length; k++) {
      var a = (k / pts.length) * Math.PI * 2 - Math.PI / 2;
      var px = cx + Math.cos(a) * rx * pts[k];
      var py = cy + Math.sin(a) * ry * pts[k];
      if (k === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
    }
    ctx.closePath();
  }

  // Ping-pong chorus order: 0..6..0, one skull per 30 s tick.
  function soundingAt(t) {
    if (t < 30) { return { idx: -1, age: -1 }; }
    var k = Math.floor(t / 30) - 1;
    var c = k % 12;
    var idx = c <= 6 ? c : 12 - c;
    var age = t - 30 * (k + 1);
    if (age > 5) { return { idx: -1, age: -1 }; }
    return { idx: idx, age: age };
  }

  function leanFor(sk, t) {
    if (pointerDown && listenIdx === sk.i) {
      return Math.max(-1, Math.min(1, (pointerX - sk.bx) / (0.12 * W))) * 0.18;
    }
    if (listenIdx === sk.i && releaseT >= 0) {
      return releaseLean * Math.exp(-(t - releaseT) / 1.2);
    }
    return 0;
  }

  function answerTone(idx, x) {
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') { return; }
    try {
      if (!audioCtx) {
        var AC = typeof AudioContext !== 'undefined' ? AudioContext : webkitAudioContext;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
      var osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = 70 + idx * 8;
      var g = audioCtx.createGain();
      var t0 = audioCtx.currentTime;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.2);
      var dest = g;
      if (typeof audioCtx.createStereoPanner !== 'undefined') {
        var p = audioCtx.createStereoPanner();
        p.pan.value = Math.max(-0.8, Math.min(0.8, (x / W) * 2 - 1));
        osc.connect(g); g.connect(p); dest = p;
      } else {
        osc.connect(g);
      }
      dest.connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + 1.3);
    } catch (e) { /* audio is a visitor-gesture extra; never break the visuals */ }
  }

  function nearestSkull(x) {
    var best = 0, bd = 1e18;
    for (var i = 0; i < skulls.length; i++) {
      var dd = Math.abs(skulls[i].bx - x);
      if (dd < bd) { bd = dd; best = i; }
    }
    return best;
  }

  function onDown(ev) {
    pointerDown = true;
    pointerX = ev.clientX; pointerY = ev.clientY;
    var ni = nearestSkull(pointerX);
    listenIdx = ni;
    answerTone(ni, pointerX);
  }
  function onMove(ev) {
    if (!pointerDown) { return; }
    pointerX = ev.clientX; pointerY = ev.clientY;
    var ni = nearestSkull(pointerX);
    if (ni !== listenIdx) { listenIdx = ni; answerTone(ni, pointerX); }
  }
  function onUp() {
    if (pointerDown && listenIdx >= 0) {
      releaseLean = Math.max(-1, Math.min(1, (pointerX - skulls[listenIdx].bx) / (0.12 * W))) * 0.18;
      releaseT = nowT;
    }
    pointerDown = false;
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function draw(t) {
    nowT = t;
    ctx.fillStyle = '#14120f';
    ctx.fillRect(0, 0, W, H);
    var vpX = 0.66 * W, vpY = 0.40 * H;
    var bw = 0.16 * W, bh = 0.22 * H;
    var bx0 = vpX - bw / 2, bx1 = vpX + bw / 2;
    var by0 = vpY - bh / 2, by1 = vpY + bh / 2;
    // Ceiling, walls, floor, back wall — flat fields only.
    ctx.fillStyle = '#1c1a17';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(bx0, by0); ctx.lineTo(bx1, by0); ctx.lineTo(W, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#232028';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(bx0, by0); ctx.lineTo(bx0, by1); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#26232a';
    ctx.beginPath();
    ctx.moveTo(W, 0); ctx.lineTo(bx1, by0); ctx.lineTo(bx1, by1); ctx.lineTo(W, H);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#171310';
    ctx.beginPath();
    ctx.moveTo(0, H); ctx.lineTo(bx0, by1); ctx.lineTo(bx1, by1); ctx.lineTo(W, H);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2e2b30';
    ctx.fillRect(bx0, by0, bw, bh);
    // Rivets along the wall seams (seeded, flat dots).
    var riv = mulberry32(1357999);
    ctx.fillStyle = '#4c5257';
    for (var r = 0; r < 26; r++) {
      var side = riv() < 0.5;
      var fy = riv();
      var rx, ry;
      if (side) { rx = bx0 * (1 - fy) + 0 * fy; ry = by0 + (H - by0) * fy; }
      else { rx = W - (W - bx1) * fy; ry = by0 + (H - by0) * fy; }
      ellipsePath(rx, ry, 2, 2); ctx.fill();
    }
    // High windows on the right wall (flat, receding).
    ctx.fillStyle = '#3a3630';
    for (var wi = 0; wi < 4; wi++) {
      var wd = wi / 3;
      var wwx = W - (W - bx1) * (1 - wd) - 0.10 * W * (1 - wd) - 0.02 * W;
      var wwy = by0 + (0.10 * H) * wd + 0.02 * H;
      var wwh = 0.10 * H * (1 - wd * 0.6) + 0.02 * H;
      var www = 0.05 * W * (1 - wd * 0.5) + 0.015 * W;
      ctx.fillRect(wwx, wwy, www, wwh);
    }
    var snd = soundingAt(t);
    // Shafts + skulls, far to near so nearer skulls overlap farther ones.
    for (var si = skulls.length - 1; si >= 0; si--) {
      var sk = skulls[si];
      var flare = 0;
      if (snd.idx === sk.i) { flare = 0.30 * Math.sin(Math.PI * snd.age / 5); }
      // Diagonal light shaft from high above down to the skull's floor point.
      ctx.fillStyle = 'rgba(232,176,75,' + (0.06 + flare).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(sk.bx - 0.06 * W - 0.035 * W * sk.scale, 0);
      ctx.lineTo(sk.bx - 0.06 * W + 0.035 * W * sk.scale, 0);
      ctx.lineTo(sk.bx + 0.07 * W * sk.scale, sk.by);
      ctx.lineTo(sk.bx - 0.07 * W * sk.scale, sk.by);
      ctx.closePath(); ctx.fill();
    }
    for (var sj = skulls.length - 1; sj >= 0; sj--) {
      var s2 = skulls[sj];
      // Ground shadow.
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ellipsePath(s2.bx, s2.by + 2, s2.h * 0.30, s2.h * 0.05); ctx.fill();
      ctx.save();
      ctx.translate(s2.bx, s2.by);
      ctx.rotate(leanFor(s2, t));
      ctx.translate(-s2.bx, -s2.by);
      var cx = s2.bx, cy = s2.by - s2.h * 0.55;
      // Vessel body: irregular seeded blob.
      ctx.fillStyle = '#6b5a4a';
      blobPath(cx, cy, s2.h * 0.30, s2.h * 0.42, s2.pts); ctx.fill();
      // Char shading on the lower body.
      ctx.fillStyle = 'rgba(62,54,48,0.35)';
      ctx.beginPath();
      ctx.moveTo(cx - s2.h * 0.28, cy + s2.h * 0.05);
      ctx.lineTo(cx + s2.h * 0.28, cy + s2.h * 0.05);
      ctx.lineTo(cx + s2.h * 0.22, cy + s2.h * 0.40);
      ctx.lineTo(cx - s2.h * 0.22, cy + s2.h * 0.40);
      ctx.closePath(); ctx.fill();
      // Speckle flecks.
      ctx.fillStyle = '#3e3630';
      for (var sp = 0; sp < s2.speck.length; sp++) {
        var f = s2.speck[sp];
        ellipsePath(cx + (f[0] - 0.5) * s2.h * 0.44, cy + (f[1] - 0.5) * s2.h * 0.66, 1.5, 1.5);
        ctx.fill();
      }
      // Chamber glow (idle faint, boosted while sounding or listened to).
      var glowA = 0.0;
      if (s2.glow) { glowA = 0.16; }
      if (snd.idx === s2.i) { glowA += 0.25 * Math.sin(Math.PI * snd.age / 5); }
      if (listenIdx === s2.i && pointerDown) { glowA += 0.20; }
      if (glowA > 0.01) {
        ctx.fillStyle = 'rgba(224,120,47,' + glowA.toFixed(3) + ')';
        ellipsePath(cx, cy + s2.h * 0.16, s2.h * 0.14, s2.h * 0.11); ctx.fill();
      }
      // Head bump: tilted ellipse embedded in the shoulder, aperture at its tip.
      var hx = cx + s2.headTilt * s2.h * 0.10;
      var hy = cy - s2.h * 0.38;
      ctx.fillStyle = '#6b5a4a';
      ellipsePath(hx, hy, s2.h * 0.16, s2.h * 0.12); ctx.fill();
      ctx.strokeStyle = 'rgba(62,54,48,0.6)';
      ctx.lineWidth = 1;
      ellipsePath(hx, hy, s2.h * 0.16, s2.h * 0.12); ctx.stroke();
      ctx.fillStyle = '#14120f';
      ellipsePath(hx + s2.h * 0.10, hy - s2.h * 0.02, s2.h * 0.035, s2.h * 0.03); ctx.fill();
      // Breath ripple rings while sounding.
      if (snd.idx === s2.i) {
        var age = snd.age;
        ctx.strokeStyle = 'rgba(232,176,75,' + ((1 - age / 5) * 0.5).toFixed(3) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(hx + s2.h * 0.10, hy - s2.h * 0.02, 20 + age * 55 * s2.scale, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(232,176,75,' + ((1 - age / 5) * 0.3).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(hx + s2.h * 0.10, hy - s2.h * 0.02, 10 + age * 35 * s2.scale, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function onResize() {
    buildLayout();
    draw(nowT);
  }
  if (typeof window.visualViewport !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  buildLayout();
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    var start = -1;
    function loop(ts) {
      if (start < 0) { start = ts; }
      draw((ts - start) / 1000);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
