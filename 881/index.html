<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hairball</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// No.881 Hairball - a living connectome. Monochrome: brightness is the only channel.

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(8810042);

// ---------- canvas / viewport ----------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 720, H = 720;
var isPhone = false;
function computeSize() {
  var w = W, h = H;
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.width) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (window.innerWidth) {
      w = window.innerWidth; h = window.innerHeight;
    }
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    isPhone = Math.min(sw, sh) < 700 || h > w * 1.15;
  }
  W = Math.max(200, Math.round(w)); H = Math.max(200, Math.round(h));
  var dpr = 1;
  if (typeof window !== 'undefined' && window.devicePixelRatio) dpr = Math.min(2, window.devicePixelRatio);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
computeSize();
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', function () { computeSize(); draw(simTime); });
  if (window.addEventListener) window.addEventListener('resize', function () { computeSize(); draw(simTime); });
}

// ---------- palette (strict) ----------
var COL_BG = '#000000';
var COL_REST = [58, 58, 58];      // #3A3A3A
var COL_FIRE = [255, 255, 255];   // #FFFFFF
var COL_EDGE = [42, 42, 42];      // #2A2A2A
var COL_EDGE_HI = [138, 138, 138]; // #8A8A8A
function mix(a, b, t) {
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' +
                  Math.round(a[1] + (b[1] - a[1]) * t) + ',' +
                  Math.round(a[2] + (b[2] - a[2]) * t) + ')';
}

// ---------- network construction (seeded) ----------
var N = 100;
var nodes = [];
for (var i = 0; i < N; i++) {
  var stray = rng() < 0.10;
  var rr = stray ? 0.36 + rng() * 0.13 : 0.30 * Math.pow(rng(), 0.55);
  nodes.push({
    ang: rng() * Math.PI * 2,
    rad: rr,                       // fraction of U from center
    stray: stray,
    prec: (rng() - 0.5) * 0.010,   // slow individual precession, rad/s
    wobA: 0.008 + rng() * 0.020,
    wob1: 0.05 + rng() * 0.16, wob2: 0.05 + rng() * 0.16,
    ph1: rng() * Math.PI * 2, ph2: rng() * Math.PI * 2,
    baseR: 0.0032 + rng() * 0.0024,
    degree: 0
  });
}
// pick the seeded heart node: a non-stray node nearest the center
var seedNode = 0, seedBest = 1e9;
for (var j = 0; j < N; j++) {
  if (!nodes[j].stray && nodes[j].rad < seedBest) { seedBest = nodes[j].rad; seedNode = j; }
}

// ---------- positions (closed form in t) ----------
var ROT_SPEED = 0.030; // rad/s, the whole ball slowly rotates
function nodePos(idx, t, out) {
  var nd = nodes[idx];
  var U = Math.min(W, H);
  var cx = W / 2, cy = H * 0.47;
  var a = nd.ang + ROT_SPEED * t + nd.prec * t;
  var x = Math.cos(a) * nd.rad * U + Math.cos(nd.wob1 * t + nd.ph1) * nd.wobA * U;
  var y = Math.sin(a) * nd.rad * U * 0.96 + Math.sin(nd.wob2 * t + nd.ph2) * nd.wobA * U;
  out.x = cx + x; out.y = cy + y;
}

// ---------- edges (dynamic, threshold distance) ----------
var EDGE_DIST = 0.155; // fraction of U
var MAX_EDGES = 650;
var posCache = [];
for (var p = 0; p < N; p++) posCache.push({ x: 0, y: 0 });
function computeEdges(t) {
  var U = Math.min(W, H), thr = EDGE_DIST * U, thr2 = thr * thr;
  for (var i2 = 0; i2 < N; i2++) nodePos(i2, t, posCache[i2]);
  var cell = thr, grid = {}, edges = [];
  function key(cx, cy) { return cx + ':' + cy; }
  for (var a2 = 0; a2 < N; a2++) {
    var gx = Math.floor(posCache[a2].x / cell), gy = Math.floor(posCache[a2].y / cell);
    for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++) {
      var list = grid[key(gx + dx, gy + dy)];
      if (!list) continue;
      for (var q = 0; q < list.length; q++) {
        var b = list[q];
        var ddx = posCache[a2].x - posCache[b].x, ddy = posCache[a2].y - posCache[b].y;
        if (ddx * ddx + ddy * ddy < thr2 && edges.length < MAX_EDGES) edges.push([b, a2]);
      }
    }
    var k = key(gx, gy);
    if (!grid[k]) grid[k] = [];
    grid[k].push(a2);
  }
  return edges;
}

// ---------- charge simulation (fixed timestep) ----------
// Charges are frame-integrated state advanced ONLY by stepSim() at DT steps
// from the seeded initial state plus recorded stimuli. Frame one is produced
// by pre-stepping the sim from t=-1.2 to t=0 at load, so it is reproducible.
var DT = 1 / 60;
var TAU = 0.95;              // charge decay time constant (rest in ~3 s)
var FIRE_THRESH = 0.70;      // crossing this upward triggers propagation
var PROP_GAIN = 0.52;        // charge handed to each neighbor on firing
var COUNT_THRESH = 0.58;     // counts as FIRING: above any single propagated pulse (max 0.52), so the counter reads nodes that truly fired, not the ripple passing through them
var charge = new Float32Array(N);
var refractory = new Float32Array(N);
var sleepUntil = new Float32Array(N); // per-node wake time after a silence
for (var su = 0; su < N; su++) sleepUntil[su] = -1e9;
var pending = [];            // {t, node, amt}
var stimuli = [];            // recorded external stimuli {t, node, amt}
var simTime = -1.2;          // the sim owns a seeded past; frame one is t=0
var silenceUntil = -1e9;
var firedEvents = [];        // drained by the audio layer: {node, charge}

// spontaneous firing schedule, pre-generated from the seed (rare)
var spont = [];
(function () {
  var t = 1.8;
  while (t < 3600) {
    spont.push({ t: t, node: Math.floor(rng() * N) });
    t += 2.6 + rng() * 3.8;
  }
})();
var spontIdx = 0;
// the seeded heartbeat: one node fired just before load (recorded in process.md)
stimuli.push({ t: -0.4, node: seedNode, amt: 1.0 });

function scheduleProp(fromIdx, tNow, edges) {
  for (var e = 0; e < edges.length; e++) {
    var a = edges[e][0], b = edges[e][1], other = -1;
    if (a === fromIdx) other = b; else if (b === fromIdx) other = a;
    if (other < 0) continue;
    var ddx = posCache[fromIdx].x - posCache[other].x;
    var ddy = posCache[fromIdx].y - posCache[other].y;
    var dist = Math.sqrt(ddx * ddx + ddy * ddy);
    var delay = 0.05 + 0.55 * (dist / (EDGE_DIST * Math.min(W, H)));
    pending.push({ t: tNow + delay, node: other, amt: PROP_GAIN * charge[fromIdx] });
  }
}
function stepSim(toT) {
  var edges = computeEdges(simTime);
  // degrees for audio pitch (recomputed as the ball drifts)
  for (var d = 0; d < N; d++) nodes[d].degree = 0;
  for (var e2 = 0; e2 < edges.length; e2++) { nodes[edges[e2][0]].degree++; nodes[edges[e2][1]].degree++; }
  while (simTime < toT - 1e-9) {
    var tNow = simTime + DT;
    var silenced = tNow < silenceUntil;
    // stimuli due
    for (var s = stimuli.length - 1; s >= 0; s--) {
      if (stimuli[s].t <= tNow) {
        if (!silenced && tNow >= sleepUntil[stimuli[s].node]) {
          pending.push({ t: Math.max(stimuli[s].t, tNow), node: stimuli[s].node, amt: stimuli[s].amt });
        }
        stimuli.splice(s, 1);
      }
    }
    // spontaneous schedule due
    while (spontIdx < spont.length && spont[spontIdx].t <= tNow) {
      if (!silenced && tNow >= sleepUntil[spont[spontIdx].node]) {
        pending.push({ t: tNow, node: spont[spontIdx].node, amt: 0.92 });
      }
      spontIdx++;
    }
    // decay
    var decay = Math.exp(-DT / TAU);
    for (var i3 = 0; i3 < N; i3++) {
      charge[i3] = silenced ? 0 : charge[i3] * decay;
      if (refractory[i3] > 0) refractory[i3] -= DT;
    }
    // deliveries
    var firedNow = [];
    for (var q2 = pending.length - 1; q2 >= 0; q2--) {
      if (pending[q2].t <= tNow) {
        var nd2 = pending[q2].node;
        if (!silenced && tNow >= sleepUntil[nd2]) {
          var before = charge[nd2];
          charge[nd2] = Math.min(1.25, charge[nd2] + pending[q2].amt);
          if (before < FIRE_THRESH && charge[nd2] >= FIRE_THRESH && refractory[nd2] <= 0) firedNow.push(nd2);
        }
        pending.splice(q2, 1);
      }
    }
    for (var f = 0; f < firedNow.length; f++) {
      refractory[firedNow[f]] = 1.1;
      scheduleProp(firedNow[f], tNow, edges);
      firedEvents.push({ node: firedNow[f], charge: charge[firedNow[f]] });
    }
    simTime = tNow;
  }
}
// pre-step: the seeded past that makes frame one what it is
stepSim(0);
simTime = 0;

// ---------- drawing ----------
function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var U = Math.min(W, H);
  ctx.fillStyle = COL_BG;
  ctx.fillRect(0, 0, W, H);
  var edges = computeEdges(t);
  // edges: barely there at rest, brighter while carrying a pulse
  ctx.lineWidth = Math.max(1, U * 0.0011);
  for (var e = 0; e < edges.length; e++) {
    var a = edges[e][0], b = edges[e][1];
    var pulse = Math.max(charge[a], charge[b]);
    var bt = Math.min(1, Math.max(0, (pulse - 0.18) / 0.82));
    ctx.strokeStyle = mix(COL_EDGE, COL_EDGE_HI, bt);
    ctx.globalAlpha = 0.35 + 0.65 * bt;
    ctx.beginPath();
    ctx.moveTo(posCache[a].x, posCache[a].y);
    ctx.lineTo(posCache[b].x, posCache[b].y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // nodes
  var firing = 0;
  for (var i = 0; i < N; i++) {
    var c = Math.min(1, charge[i]);
    if (charge[i] >= COUNT_THRESH) firing++;
    var r = U * nodes[i].baseR * (1 + 0.95 * c) * (isPhone ? 1.25 : 1);
    ctx.fillStyle = mix(COL_REST, COL_FIRE, c);
    ctx.beginPath();
    ctx.arc(posCache[i].x, posCache[i].y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  // readout: FIRING count + rest/activity meter (prompt-specced)
  var act = 0;
  for (var k = 0; k < N; k++) act += Math.min(1, charge[k]);
  act /= N;
  var fs = Math.max(10, Math.round(U * 0.016));
  ctx.font = fs + 'px monospace';
  ctx.fillStyle = '#8A8A8A';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('FIRING ' + firing, Math.round(U * 0.03), H - Math.round(U * 0.028));
  var mw = Math.round(U * 0.22), mh = Math.max(3, Math.round(U * 0.006));
  var mx = Math.round(W - U * 0.03 - mw), my = H - Math.round(U * 0.028) - mh;
  ctx.strokeStyle = '#2A2A2A';
  ctx.lineWidth = 1;
  ctx.strokeRect(mx + 0.5, my + 0.5, mw, mh);
  ctx.fillStyle = '#8A8A8A';
  ctx.fillRect(mx + 1, my + 1, Math.max(0, (mw - 2) * Math.min(1, act * 2.4)), mh - 2);
}

// ---------- audio (lazy, gesture-gated, guarded) ----------
var AC = null, thrumGain = null, voices = [];
function audioCtor() {
  if (typeof window === 'undefined') return null;
  return window.AudioContext || window.webkitAudioContext || null;
}
function ensureAudio() {
  if (AC) { if (AC.resume) AC.resume(); return; }
  var Ctor = audioCtor();
  if (!Ctor) return;
  try {
    AC = new Ctor();
    thrumGain = AC.createGain();
    thrumGain.gain.value = 0.0;
    var osc = AC.createOscillator();
    osc.type = 'sine'; osc.frequency.value = 52;
    var og = AC.createGain(); og.gain.value = 0.5;
    osc.connect(og); og.connect(thrumGain); thrumGain.connect(AC.destination);
    osc.start();
  } catch (e) { AC = null; }
}
function pip(nodeIdx, ch) {
  if (!AC) return;
  // cap 16 voices, steal the quietest
  voices = voices.filter(function (v) { return v.until > AC.currentTime; });
  if (voices.length >= 16) {
    var low = 0;
    for (var i = 1; i < voices.length; i++) if (voices[i].ch < voices[low].ch) low = i;
    try { voices[low].osc.stop(); } catch (e) {}
    voices.splice(low, 1);
  }
  try {
    var deg = nodes[nodeIdx].degree || 3;
    var freq = 240 + Math.min(14, deg) * 48 + (nodeIdx % 5) * 7;
    var o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
    var g = AC.createGain();
    var t0 = AC.currentTime;
    var peak = 0.028 + 0.05 * Math.min(1, ch);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + 0.2);
    voices.push({ osc: o, ch: ch, until: t0 + 0.2 });
  } catch (e) {}
}
function drainAudio() {
  if (!AC) { firedEvents.length = 0; return; }
  for (var i = 0; i < firedEvents.length; i++) pip(firedEvents[i].node, firedEvents[i].charge);
  firedEvents.length = 0;
  if (thrumGain) {
    var target = simTime < silenceUntil ? 0.0 : 0.016;
    thrumGain.gain.setTargetAtTime(target, AC.currentTime, 0.4);
  }
}

// ---------- interaction ----------
var startStamp = null;
function pieceNow() {
  if (startStamp === null) return simTime;
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  return (now - startStamp) / 1000;
}
var downInfo = null, lastTapT = -10, lastTapPos = null;
function toLocal(ev) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return { x: (ev.clientX || 0) - r.left, y: (ev.clientY || 0) - r.top };
}
function nearestNode(x, y) {
  var best = -1, bd = 1e18;
  for (var i = 0; i < N; i++) {
    var dx = posCache[i].x - x, dy = posCache[i].y - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
function stimulate(x, y, radius, amt) {
  var U = Math.min(W, H), r2 = radius * radius;
  for (var i = 0; i < N; i++) {
    var dx = posCache[i].x - x, dy = posCache[i].y - y, d2 = dx * dx + dy * dy;
    if (d2 < r2) {
      var fall = 1 - Math.sqrt(d2) / radius;
      stimuli.push({ t: simTime, node: i, amt: amt * (0.35 + 0.65 * fall) });
    }
  }
}
function doSilence() {
  silenceUntil = simTime + 4;
  for (var i = 0; i < N; i++) { charge[i] = 0; sleepUntil[i] = silenceUntil + rng() * 3.6; }
  pending.length = 0;
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (ev) {
    ensureAudio();
    var pt = toLocal(ev);
    downInfo = { x: pt.x, y: pt.y, t: pieceNow(), moved: 0, lastX: pt.x, lastY: pt.y, lastT: pieceNow() };
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!downInfo) return;
    var pt = toLocal(ev);
    var now = pieceNow();
    var dx = pt.x - downInfo.lastX, dy = pt.y - downInfo.lastY;
    var step = Math.sqrt(dx * dx + dy * dy);
    downInfo.moved += step;
    var dt = Math.max(0.008, now - downInfo.lastT);
    var speed = step / dt; // px per second
    var U = Math.min(W, H);
    var fast = Math.min(1, speed / (U * 1.6));
    // the electrode: gentle radius for slow drags, wide hot cascades for fast ones
    stimulate(pt.x, pt.y, U * (0.10 + 0.10 * fast), 0.5 + 0.75 * fast);
    downInfo.lastX = pt.x; downInfo.lastY = pt.y; downInfo.lastT = now;
  });
  canvas.addEventListener('pointerup', function (ev) {
    if (!downInfo) return;
    var pt = toLocal(ev);
    var now = pieceNow();
    if (downInfo.moved < Math.min(W, H) * 0.012 && now - downInfo.t < 0.3) {
      // tap
      if (now - lastTapT < 0.35 && lastTapPos && Math.abs(pt.x - lastTapPos.x) < 40 && Math.abs(pt.y - lastTapPos.y) < 40) {
        doSilence();
        lastTapT = -10;
      } else {
        var nn = nearestNode(pt.x, pt.y);
        if (nn >= 0) stimuli.push({ t: simTime, node: nn, amt: 1.05 });
        lastTapT = now; lastTapPos = pt;
      }
    }
    downInfo = null;
  });
  canvas.addEventListener('pointercancel', function () { downInfo = null; });
}

// ---------- main loop ----------
draw(0);
if (typeof requestAnimationFrame === 'function') {
  startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  var loop = function () {
    var t = pieceNow();
    if (t > simTime) { stepSim(Math.min(t, simTime + 0.25)); drainAudio(); }
    draw(simTime);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
