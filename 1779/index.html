<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuned to the Alcove</title>
<style>
html, body { margin: 0; padding: 0; background: #DCE2E5; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#DCE2E5'; /* pale winter sky; page ground matches the field */
var SKY = '#DCE2E5';
var SKY_BAND = '#D2DADD';
var BARK = '#211A14'; /* bark brown-black */
var BARK_HI = '#3B2E22';
var WIRE = '#B9BEC2'; /* thin silver wires */
var WIRE_HI = '#D5D9DB';
var NODE = '#FFF6E0'; /* warm white vibration nodes */
var NODE_GLOW = 'rgba(255,246,224,0.22)';
var GUST = 'rgba(255,255,255,0.12)'; /* bright band of moving air */
var PARTICLE = '#FFFFFF';
var FRAME_T = 60.0; /* fixed phase: middle string mid-vibration, nodes visible */
var CYCLE = 3600.0; /* seconds; one hour, the gusts repeat irregularly inside it */
/* Fixed authored gust births inside each hour; gaps 26, 17, 95, 90, 90, 90, 120,
   140, 140, 130, 170, 180, 150, 170, 180, 180, 170, 150, 180, 170, 180, 170, 180, 170, 150 s:
   irregular across the hour, never a visible period. Each gust names the strings it excites. */
var GUSTS = [
  { birth: 12, strength: 0.70, strings: [0, 1] },
  { birth: 38, strength: 1.00, strings: [1, 2] },
  { birth: 55, strength: 0.55, strings: [0] },
  { birth: 150, strength: 0.65, strings: [2] },
  { birth: 240, strength: 0.80, strings: [0, 1] },
  { birth: 330, strength: 0.50, strings: [1, 2] },
  { birth: 420, strength: 0.85, strings: [2] },
  { birth: 540, strength: 0.60, strings: [0, 2] },
  { birth: 680, strength: 1.00, strings: [1] },
  { birth: 820, strength: 0.75, strings: [0, 1, 2] },
  { birth: 950, strength: 0.50, strings: [2] },
  { birth: 1120, strength: 0.90, strings: [0] },
  { birth: 1300, strength: 0.65, strings: [1, 2] },
  { birth: 1450, strength: 1.00, strings: [1] },
  { birth: 1620, strength: 0.70, strings: [0, 2] },
  { birth: 1800, strength: 0.55, strings: [2] },
  { birth: 1980, strength: 0.85, strings: [0, 1] },
  { birth: 2150, strength: 0.60, strings: [1] },
  { birth: 2300, strength: 0.95, strings: [0, 2] },
  { birth: 2480, strength: 0.70, strings: [1, 2] },
  { birth: 2650, strength: 0.50, strings: [0] },
  { birth: 2830, strength: 0.80, strings: [1, 2] },
  { birth: 3000, strength: 0.65, strings: [0, 1] },
  { birth: 3180, strength: 0.90, strings: [2] },
  { birth: 3350, strength: 0.75, strings: [0, 1] },
  { birth: 3500, strength: 0.55, strings: [1] }
];
var BAND_T = 120.0; /* seconds for one gust band to cross the field */
var DECAY = 0.02; /* per second; strings ring down slowly after each excitation */
/* Three registers. fRes is the string's nominal resonant frequency in Hz;
   fVis is the slowed visual analogue so the standing wave reads on screen. */
var STRINGS = [
  { y: 0.28, n: 2, fVis: 0.42, fRes: 98, phase: 0.0 },
  { y: 0.50, n: 3, fVis: 0.55, fRes: 147, phase: 1.1 },
  { y: 0.72, n: 4, fVis: 0.68, fRes: 196, phase: 2.3 }
];
/* Fixed authored trunk table: fractions of the field. Trunks anchor left and right edges. */
var TRUNKS_L = [
  { x: 0.010, w: 0.032, lean: 0.006 },
  { x: 0.052, w: 0.022, lean: -0.004 },
  { x: 0.088, w: 0.015, lean: 0.003 }
];
var TRUNKS_R = [
  { x: 0.958, w: 0.032, lean: -0.006 },
  { x: 0.926, w: 0.022, lean: 0.004 },
  { x: 0.897, w: 0.015, lean: -0.003 }
];
var PLATE_INK = '#ffffff';
var PLATE_FILL = '#211A14';
var PLATE_LINE = 'rgba(255,255,255,0.45)';
var HINT_INK = '#ffffff';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
/* Seeded PRNG only; no Math.random, no Date.now anywhere in the script. */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(1779);
/* Fixed particle table: faint drifting motes of air, seeded once at load. */
var PARTICLES = [];
(function () {
  var i;
  for (i = 0; i < 80; i++) {
    PARTICLES.push({
      x: rng(), y: 0.06 + rng() * 0.88,
      r: 0.8 + rng() * 1.4, drift: 0.004 + rng() * 0.010, bob: rng() * TAU
    });
  }
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* Latest gust exciting string s at or before time t; searches back one cycle
   so a string is never unexcited. Closed-form function of piece time. */
function lastGust(s, t) {
  var tt = ((t % CYCLE) + CYCLE) % CYCLE;
  var i, g, best = null;
  for (i = 0; i < GUSTS.length; i++) {
    g = GUSTS[i];
    if (g.strings.indexOf(s) < 0) continue;
    if (g.birth <= tt && (!best || g.birth > best.birth)) best = g;
  }
  if (best) return { birth: best.birth, strength: best.strength, age: tt - best.birth };
  for (i = 0; i < GUSTS.length; i++) {
    g = GUSTS[i];
    if (g.strings.indexOf(s) < 0) continue;
    if (!best || g.birth > best.birth) best = g;
  }
  return { birth: best.birth, strength: best.strength, age: tt + CYCLE - best.birth };
}
/* Damped standing-wave envelope for string s at time t: 0..1. */
function stringEnv(s, t) {
  var lg = lastGust(s, t);
  return lg.strength * Math.exp(-DECAY * lg.age);
}
/* Standing-wave displacement (px) of string s at fraction u along it, time t. */
function stringDisp(s, t, u) {
  var st = STRINGS[s];
  var lg = lastGust(s, t);
  var env = lg.strength * Math.exp(-DECAY * lg.age);
  var amp = 0.028 * F.h * env;
  return amp * Math.sin(st.n * Math.PI * u) * Math.cos(TAU * st.fVis * lg.age + st.phase);
}
function drawSky() {
  ctx.fillStyle = SKY;
  ctx.fillRect(F.x, F.y, F.w, F.h);
  /* faint horizontal bands of colder air, fixed in the field */
  ctx.fillStyle = SKY_BAND;
  ctx.fillRect(F.x, F.y + 0.12 * F.h, F.w, 0.05 * F.h);
  ctx.fillRect(F.x, F.y + 0.58 * F.h, F.w, 0.04 * F.h);
  ctx.fillRect(F.x, F.y + 0.88 * F.h, F.w, 0.06 * F.h);
}
function drawTrunk(tr, side) {
  var x0 = F.x + tr.x * F.w;
  var w = tr.w * F.w;
  var lean = tr.lean * F.w;
  var topW = w * 0.72;
  ctx.fillStyle = BARK;
  ctx.beginPath();
  ctx.moveTo(x0 - w / 2, F.y + F.h);
  ctx.lineTo(x0 - topW / 2 + lean, F.y);
  ctx.lineTo(x0 + topW / 2 + lean, F.y);
  ctx.lineTo(x0 + w / 2, F.y + F.h);
  ctx.closePath();
  ctx.fill();
  /* bark strokes: a few thin verticals in a lighter brown-black */
  ctx.strokeStyle = BARK_HI;
  ctx.lineWidth = Math.max(1, 0.002 * F.w);
  var k, fx, lx;
  for (k = 0; k < 3; k++) {
    fx = -0.28 + k * 0.28;
    lx = lean * (0.5 + 0.5 * k);
    ctx.beginPath();
    ctx.moveTo(x0 + fx * w, F.y + F.h);
    ctx.lineTo(x0 + fx * topW + lx, F.y + 0.08 * F.h);
    ctx.stroke();
  }
}
function drawTrunks() {
  var i;
  for (i = 0; i < TRUNKS_L.length; i++) drawTrunk(TRUNKS_L[i], 'L');
  for (i = 0; i < TRUNKS_R.length; i++) drawTrunk(TRUNKS_R[i], 'R');
}
/* Gust bands: slow bright bands of moving air crossing left to right.
   A gust's band is on screen for BAND_T seconds after its birth. */
function drawGusts(t) {
  var tt = ((t % CYCLE) + CYCLE) % CYCLE;
  var i, g, age, u, cx, bw, a;
  for (i = 0; i < GUSTS.length; i++) {
    g = GUSTS[i];
    age = tt - g.birth;
    if (age < 0) age += CYCLE;
    if (age > BAND_T) continue;
    u = age / BAND_T;
    cx = F.x + u * F.w;
    bw = 0.09 * F.w;
    a = g.strength * (1 - 0.5 * u);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.16 * a).toFixed(4) + ')';
    ctx.fillRect(cx - bw / 2, F.y, bw, F.h);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.08 * a).toFixed(4) + ')';
    ctx.fillRect(cx - bw, F.y, bw / 2, F.h);
    ctx.fillRect(cx + bw / 2, F.y, bw / 2, F.h);
  }
}
function drawParticles(t) {
  var tt = ((t % CYCLE) + CYCLE) % CYCLE;
  var i, p, x, y, a, g, age, u, bx, d;
  for (i = 0; i < PARTICLES.length; i++) {
    p = PARTICLES[i];
    x = (p.x + p.drift * t) % 1;
    y = p.y + 0.006 * Math.sin(TAU * 0.05 * t + p.bob);
    /* brighten inside a gust band */
    a = 0.18;
    for (g = 0; g < GUSTS.length; g++) {
      age = tt - GUSTS[g].birth;
      if (age < 0) age += CYCLE;
      if (age > BAND_T) continue;
      u = age / BAND_T;
      bx = u;
      d = Math.abs(x - bx);
      if (d < 0.08) a = Math.max(a, 0.18 + 0.55 * GUSTS[g].strength * (1 - d / 0.08));
    }
    ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(4) + ')';
    ctx.beginPath();
    ctx.arc(F.x + x * F.w, F.y + y * F.h, p.r, 0, TAU);
    ctx.fill();
  }
}
function drawStrings(t) {
  var x0 = F.x + 0.13 * F.w;
  var x1 = F.x + 0.87 * F.w;
  var s, st, i, u, x, y, env;
  var steps = 120;
  for (s = 0; s < STRINGS.length; s++) {
    st = STRINGS[s];
    env = stringEnv(s, t);
    /* the wire itself, displaced into its standing wave */
    ctx.strokeStyle = WIRE;
    ctx.lineWidth = Math.max(1, 0.0022 * Math.min(F.w, F.h));
    ctx.beginPath();
    for (i = 0; i <= steps; i++) {
      u = i / steps;
      x = x0 + u * (x1 - x0);
      y = F.y + st.y * F.h + stringDisp(s, t, u);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    /* anchor dots where the wire meets the trunks */
    ctx.fillStyle = WIRE_HI;
    ctx.beginPath();
    ctx.arc(x0, F.y + st.y * F.h, Math.max(2, 0.004 * F.w), 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x1, F.y + st.y * F.h, Math.max(2, 0.004 * F.w), 0, TAU);
    ctx.fill();
    /* warm white harmonic nodes at the antinodes, brightness follows the envelope */
    if (env > 0.05) {
      var k, au, ax, ay, nr;
      for (k = 0; k < st.n; k++) {
        au = (k + 0.5) / st.n;
        ax = x0 + au * (x1 - x0);
        ay = F.y + st.y * F.h + stringDisp(s, t, au);
        nr = Math.max(2.5, 0.007 * Math.min(F.w, F.h)) * (0.5 + 0.5 * env);
        ctx.fillStyle = NODE_GLOW;
        ctx.beginPath();
        ctx.arc(ax, ay, nr * 3, 0, TAU);
        ctx.fill();
        ctx.fillStyle = NODE;
        ctx.beginPath();
        ctx.arc(ax, ay, nr, 0, TAU);
        ctx.fill();
      }
    }
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Tuned to the Alcove').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Tuned to the Alcove').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 25').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Tuned to the Alcove', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 25', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawSky();
  drawGusts(phaseT);
  drawParticles(phaseT);
  drawTrunks();
  drawStrings(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    stringEnv: function (s) { return stringEnv(s, phaseT); },
    lastGust: function (s) { return lastGust(s, phaseT); }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
