<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fold</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F2EEE6; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  // Strict palette: the stripe red, the stripe white, and the one shadow
  // tone the painted box is allowed. Nothing else.
  var RED = "#C02E24";
  var WHITE = "#F2EEE6";
  var SHADOW = "#8A2119";

  var BANDS = 16;                       // horizontal bands over the height
  var THETA_MAX = 65 * Math.PI / 180;   // the fold opens to 65 degrees
  var FOLD_FRAC = 0.30;                 // fold leg, of the smaller dimension
  var FOLD_FRAC_PHONE = 0.36;           // a touch larger on a phone frame

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 1e9;
    if (window.screen && typeof window.screen.width === "number") {
      sw = Math.min(window.screen.width, window.screen.height);
    }
    if (sw < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    DPR = window.devicePixelRatio || 1;
    W = Math.round(w);
    H = Math.round(h);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

  // ---- Fold geometry ----------------------------------------------------
  // The fold line runs from A on the right edge to B on the bottom edge;
  // C is the frame corner between them and T = (A, B, C) is the corner
  // triangle of painted canvas that lifts. The fold leg is fl px along
  // each edge, so the hinge AB sits at 45 degrees and the unit vectors
  // are exact: d along A->B is (-1, 1)/sqrt(2), and n, the in-plane
  // normal pointing toward C, is (1, 1)/sqrt(2).
  //
  // Two maps do all the work, and both are pure functions of the opening:
  //   reflect(P): mirror P across the hinge line. The revealed underside
  //     face at point P shows the front pattern of reflect(P), so on the
  //     hinge itself (where reflect(P) = P) the underside stripes agree
  //     with the flat field exactly: continuity across the fold is a
  //     property of the construction, not a hope.
  //   foldMap(P, cosT): rotate P about the hinge axis by the fold angle
  //     and project orthographically. Split v = P - A into its part along
  //     d (unchanged by the rotation) and its part along n (scaled by
  //     cos of the angle, the rest having swung out of the picture
  //     plane). At angle 0 this is the identity, so the closed flap
  //     redraws the flat pattern precisely.
  var SQ = Math.SQRT1_2;

  function foldGeom() {
    var fl = (isPhone() ? FOLD_FRAC_PHONE : FOLD_FRAC) * Math.min(W, H);
    return {
      fl: fl,
      A: [W, H - fl],
      B: [W - fl, H],
      C: [W, H],
      Cp: [W - fl, H - fl]   // C reflected across the hinge
    };
  }

  function reflect(P, g) {
    var vx = P[0] - g.A[0], vy = P[1] - g.A[1];
    var s = (vx + vy) * SQ;              // (P - A) . n
    return [P[0] - 2 * s * SQ, P[1] - 2 * s * SQ];
  }

  function foldMap(P, g, cosT) {
    var vx = P[0] - g.A[0], vy = P[1] - g.A[1];
    var par = (vy - vx) * SQ;            // (P - A) . d
    var per = (vx + vy) * SQ;            // (P - A) . n
    var px = par * -SQ + per * cosT * SQ;
    var py = par * SQ + per * cosT * SQ;
    return [g.A[0] + px, g.A[1] + py];
  }

  // ---- Polygon helpers --------------------------------------------------
  // Stripes on a face are drawn band by band: the face polygon is clipped
  // to each horizontal band strip (Sutherland-Hodgman against the two
  // half-planes y >= y0 and y <= y1), then filled with the band colour.
  // Strips are widened by half a pixel so neighbouring bands overlap
  // slightly and no hairline of ground can open between them.
  function clipHalf(poly, yEdge, keepBelow) {
    var out = [];
    if (!poly.length) return out;
    var prev = poly[poly.length - 1];
    var prevIn = keepBelow ? prev[1] <= yEdge : prev[1] >= yEdge;
    for (var i = 0; i < poly.length; i++) {
      var cur = poly[i];
      var curIn = keepBelow ? cur[1] <= yEdge : cur[1] >= yEdge;
      if (curIn !== prevIn) {
        var p = (yEdge - prev[1]) / (cur[1] - prev[1]);
        out.push([prev[0] + (cur[0] - prev[0]) * p, yEdge]);
      }
      if (curIn) out.push(cur);
      prev = cur; prevIn = curIn;
    }
    return out;
  }

  function clipStrip(poly, y0, y1) {
    return clipHalf(clipHalf(poly, y0, false), y1, true);
  }

  function fillPoly(poly) {
    if (poly.length < 3) return;
    ctx.beginPath();
    ctx.moveTo(poly[0][0], poly[0][1]);
    for (var i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
    ctx.closePath();
    ctx.fill();
  }

  function bandColor(i) { return i % 2 === 0 ? RED : WHITE; }

  // Draw the stripe pattern over a source polygon, mapping every clipped
  // band through mapFn into screen space.
  function drawStripedFace(srcPoly, mapFn) {
    var bh = H / BANDS;
    for (var i = 0; i < BANDS; i++) {
      var piece = clipStrip(srcPoly, i * bh - 0.5, (i + 1) * bh + 0.5);
      if (piece.length < 3) continue;
      var mapped = [];
      for (var j = 0; j < piece.length; j++) mapped.push(mapFn(piece[j]));
      ctx.fillStyle = bandColor(i);
      ctx.globalAlpha = 1;
      fillPoly(mapped);
    }
    ctx.globalAlpha = 1;
  }

  // ---- The opening: a closed-form function of the recorded drag ---------
  // A drag may start anywhere. Pulling toward the upper left (the way the
  // corner peels) opens the fold; pushing back closes it. Opening is
  // recorded as samples {t, o} on the piece's own timeline, seconds since
  // load, and the opening at any time is piecewise-linear between samples
  // with the last one held after release: the fold stays where it was
  // left, no snap, no spring. Frame one has no samples and opens at 0.
  var samples = [];
  var dragging = false;
  var dragStart = null;
  var currentT = 0;

  function openingAt(t) {
    if (!samples.length) return 0;
    if (t <= samples[0].t) return samples[0].o;
    if (t >= samples[samples.length - 1].t) return samples[samples.length - 1].o;
    for (var i = 1; i < samples.length; i++) {
      if (t < samples[i].t) {
        var p = (t - samples[i - 1].t) / Math.max(1e-6, samples[i].t - samples[i - 1].t);
        return samples[i - 1].o + (samples[i].o - samples[i - 1].o) * p;
      }
    }
    return samples[samples.length - 1].o;
  }

  function record(o) {
    samples.push({ t: currentT, o: clamp01(o) });
    if (samples.length > 4000) samples.splice(0, samples.length - 4000);
  }

  function pointerXY(e) {
    if (canvas.getBoundingClientRect) {
      var r = canvas.getBoundingClientRect();
      if (r && r.width) return [e.clientX - r.left, e.clientY - r.top];
    }
    return [e.clientX || 0, e.clientY || 0];
  }

  canvas.addEventListener("pointerdown", function (e) {
    var xy = pointerXY(e);
    dragging = true;
    dragStart = { x: xy[0], y: xy[1], o: openingAt(currentT) };
    record(dragStart.o);
    if (e.preventDefault) e.preventDefault();
    draw(currentT);
  });
  window.addEventListener("pointermove", function (e) {
    if (!dragging || !dragStart) return;
    var xy = pointerXY(e);
    var travel = ((dragStart.x - xy[0]) + (dragStart.y - xy[1])) / 2;
    record(dragStart.o + travel / (0.45 * Math.min(W, H)));
    draw(currentT);
  });
  window.addEventListener("pointerup", function () {
    dragging = false;
    dragStart = null;
  });
  window.addEventListener("pointercancel", function () {
    dragging = false;
    dragStart = null;
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () { resize(); draw(currentT); });
  }
  window.addEventListener("resize", function () { resize(); draw(currentT); });

  // ---- Drawing ----------------------------------------------------------
  function draw(t) {
    currentT = t;
    if (W === 0) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    // The flat field: even horizontal bands, wall to wall.
    var bh = H / BANDS;
    var i;
    for (i = 0; i < BANDS; i++) {
      ctx.fillStyle = bandColor(i);
      ctx.globalAlpha = 1;
      ctx.fillRect(0, i * bh, W, bh + 1);
    }

    var g = foldGeom();
    var o = openingAt(t);
    var T = [g.A, g.B, g.C];

    if (o > 0) {
      var cosT = Math.cos(o * THETA_MAX);

      // The revealed underside: the corner triangle, showing the front
      // pattern of its mirror image. Its stripes meet the field's
      // stripes exactly on the hinge and run mirrored beyond it.
      var Tp = [g.A, g.B, g.Cp];
      drawStripedFace(Tp, function (P) { return reflect(P, g); });

      // A breath of shade on the inner face, in the shadow tone only.
      ctx.fillStyle = SHADOW;
      ctx.globalAlpha = 0.14 * o;
      fillPoly(T);

      // The cast shadow of the raised corner, two layered passes of the
      // shadow tone, falling away from the hinge toward the corner.
      var Crot = foldMap(g.C, g, cosT);
      var offs = [[0.10, 0.16], [0.05, 0.22]];
      for (i = 0; i < offs.length; i++) {
        var ox = offs[i][0] * g.fl * o, oy = offs[i][0] * g.fl * o;
        ctx.fillStyle = SHADOW;
        ctx.globalAlpha = offs[i][1] * o;
        fillPoly([
          [g.A[0] + ox, g.A[1] + oy],
          [g.B[0] + ox, g.B[1] + oy],
          [Crot[0] + ox, Crot[1] + oy]
        ]);
      }

      // The flap itself: the corner's own stripes, folded. Continuous
      // with the field across the hinge by construction.
      drawStripedFace(T, function (P) { return foldMap(P, g, cosT); });

      // The raised free edges get one painted line each, so the flap
      // reads as a surface with an edge, not a smear.
      ctx.strokeStyle = SHADOW;
      ctx.lineWidth = Math.max(1, 0.004 * Math.min(W, H));
      ctx.globalAlpha = 0.45 * o;
      ctx.beginPath();
      ctx.moveTo(g.A[0], g.A[1]);
      ctx.lineTo(Crot[0], Crot[1]);
      ctx.lineTo(g.B[0], g.B[1]);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // The whisper when closed: a soft shadow strip just inside the hinge
    // and one hairline along the hinge itself. It fades as the real
    // shadow takes over.
    if (o < 1) {
      var wq = 0.055 * g.fl;
      ctx.fillStyle = SHADOW;
      ctx.globalAlpha = 0.16 * (1 - o);
      fillPoly([
        g.A, g.B,
        [g.B[0] - wq * SQ, g.B[1] - wq * SQ],
        [g.A[0] - wq * SQ, g.A[1] - wq * SQ]
      ]);
    }
    ctx.strokeStyle = SHADOW;
    ctx.globalAlpha = 0.38;
    ctx.lineWidth = Math.max(1, 0.0022 * Math.min(W, H));
    ctx.beginPath();
    ctx.moveTo(g.A[0], g.A[1]);
    ctx.lineTo(g.B[0], g.B[1]);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  resize();
  draw(0);

  // The loop is anchored at load: frame one is the synchronous draw above
  // with the fold closed, and later frames are elapsed-since-load on the
  // same timeline the drag samples are recorded against. Never a wall
  // clock.
  if (typeof requestAnimationFrame === "function") {
    var start = null;
    var tick = function (now) {
      if (start === null) start = now;
      draw((now - start) / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
