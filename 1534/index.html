<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Procession That Converges</title>
<style>
  html, body { margin: 0; padding: 0; background: #121014; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), seed 1534000. No unseeded randomness anywhere.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1534000);

  var LOOP = 180;
  var IN_DUR = 60, RING_DUR = 90, OUT_DUR = 22, WAIT_DUR = 8;
  var RING_START = 60, OUT_START = 150, WAIT_START = 172;
  var OMEGA = 2 * Math.PI / LOOP; // one full ring rotation per loop

  var W = 720, H = 720;
  var fieldX = 0, fieldY = 0, fieldW = 720, fieldH = 720;
  var phone = false;

  function size() {
    var vw = 720, vh = 720;
    if (typeof window !== 'undefined') {
      if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
      else if (window.innerWidth) { vw = window.innerWidth; vh = window.innerHeight; }
      if (window.screen) {
        var mn = Math.min(window.screen.width, window.screen.height);
        phone = mn < 700 || vh > vw * 1.15;
      }
    }
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    if (phone) { fieldX = 0; fieldY = 0; fieldW = W; fieldH = H; }
    else {
      var side = Math.min(W, H);
      fieldX = (W - side) / 2; fieldY = (H - side) / 2; fieldW = side; fieldH = side;
    }
  }

  // Five groups, one color each, never mixed. Start points are field fractions.
  var COLORS = ['#c98f3d', '#a34a2e', '#c9a86a', '#5a7a72', '#7a4a5a'];
  var STARTS = [
    { fx: 0.04, fy: 0.30, start: 0 },
    { fx: 0.30, fy: 0.04, start: 20 },
    { fx: 0.96, fy: 0.55, start: 40 },
    { fx: 0.65, fy: 0.96, start: 60 },
    { fx: 0.04, fy: 0.72, start: 80 }
  ];
  var PAUSES_IN = [
    [[0.25, 0.35], [0.60, 0.68]],
    [[0.20, 0.28], [0.55, 0.65]],
    [[0.30, 0.38], [0.62, 0.70]],
    [[0.22, 0.32], [0.58, 0.66]],
    [[0.28, 0.36], [0.64, 0.72]]
  ];
  var PAUSE_OUT = [[0.45, 0.55]];
  var groups = [];
  for (var gi = 0; gi < 5; gi++) {
    var cluster = [];
    for (var mi = 0; mi < 3; mi++) {
      cluster.push({ ox: (rand() - 0.5) * 2.4, oy: (rand() - 0.5) * 2.0 });
    }
    groups.push({
      color: COLORS[gi],
      sx: STARTS[gi].fx, sy: STARTS[gi].fy, start: STARTS[gi].start,
      slot: gi * 2 * Math.PI / 5,
      wob: 1.5 + rand() * 1.0,
      wamp: 0.04 + rand() * 0.02,
      pausesIn: PAUSES_IN[gi],
      cluster: cluster
    });
  }

  // ---- Drag logs (closed-form over recorded events) ----
  // Each session: { startT, moves: [[t, rate]], endT (null while open) }.
  var groupLogs = [[], [], [], [], []];
  var ringLog = [];
  var drag = null; // { kind: 'group'|'ring', gi, grabX, session }
  var lastT = 0;

  function adjAt(log, t) {
    var adj = 0;
    for (var s = 0; s < log.length; s++) {
      var ses = log[s];
      var pts = [{ t: ses.startT, r: 1 }];
      for (var m = 0; m < ses.moves.length; m++) pts.push({ t: ses.moves[m][0], r: ses.moves[m][1] });
      var endT = (ses.endT === null) ? t : ses.endT;
      pts.push({ t: endT, r: pts[pts.length - 1].r });
      for (var i = 0; i + 1 < pts.length; i++) {
        var a = pts[i].t, b = Math.min(pts[i + 1].t, t);
        if (b > a) adj += (pts[i].r - 1) * (b - a);
      }
    }
    return adj;
  }
  function ringOffset(t) { return OMEGA * adjAt(ringLog, t); }
  function tauOf(g, t) {
    var raw = t - g.start + adjAt(groupLogs[groups.indexOf(g)], t);
    var m = raw % LOOP;
    if (m < 0) m += LOOP;
    return m;
  }

  function pausedBefore(s, windows) {
    var p = 0, total = 0;
    for (var i = 0; i < windows.length; i++) {
      var a = windows[i][0], b = windows[i][1];
      total += b - a;
      if (s > a) p += Math.min(s, b) - a;
    }
    return { p: p, total: total };
  }
  function progWithPauses(s, windows) {
    var r = pausedBefore(s, windows);
    var p = (s - r.p) / (1 - r.total);
    if (p < 0) p = 0; if (p > 1) p = 1;
    return p * p * (3 - 2 * p); // smoothstep, keeps pause flats flat
  }


  // Winding path from A to B: straight lerp plus a perpendicular sine swell
  // that vanishes at both ends, so the path lands exactly on B.
  function pathPoint(ax, ay, bx, by, p, wob, wamp, shortSide) {
    var dx = bx - ax, dy = by - ay;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / len, ny = dx / len;
    var swell = Math.sin(p * 2 * Math.PI * wob) * Math.sin(Math.PI * p) * wamp * shortSide;
    return { x: ax + dx * p + nx * swell, y: ay + dy * p + ny * swell };
  }

  function groupPos(g, t, shortSide) {
    var cx = fieldX + fieldW / 2, cy = fieldY + fieldH / 2;
    var R = 0.11 * shortSide;
    var tau = tauOf(g, t);
    var off = ringOffset(t);
    if (tau < RING_START) {
      var p = progWithPauses(tau / IN_DUR, g.pausesIn);
      var ax = fieldX + g.sx * fieldW, ay = fieldY + g.sy * fieldH;
      var ea = g.slot + OMEGA * ((g.start + RING_START) % LOOP) + off;
      var bx = cx + R * Math.cos(ea), by = cy + R * Math.sin(ea);
      var pt = pathPoint(ax, ay, bx, by, p, g.wob, g.wamp, shortSide);
      return { x: pt.x, y: pt.y, phase: 'in', tau: tau };
    }
    if (tau < OUT_START) {
      var ang = g.slot + OMEGA * t + off;
      return { x: cx + R * Math.cos(ang), y: cy + R * Math.sin(ang), phase: 'ring', tau: tau };
    }
    if (tau < WAIT_START) {
      var q = progWithPauses((tau - OUT_START) / OUT_DUR, PAUSE_OUT);
      var sa = g.slot + OMEGA * ((g.start + OUT_START) % LOOP) + off;
      var ax2 = cx + R * Math.cos(sa), ay2 = cy + R * Math.sin(sa);
      var bx2 = fieldX + g.sx * fieldW, by2 = fieldY + g.sy * fieldH;
      var pt2 = pathPoint(ax2, ay2, bx2, by2, q, g.wob, g.wamp, shortSide);
      return { x: pt2.x, y: pt2.y, phase: 'out', tau: tau };
    }
    return { x: fieldX + g.sx * fieldW, y: fieldY + g.sy * fieldH, phase: 'wait', tau: tau };
  }

  function drawGlyph(x, y, u, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.5, u * 0.18);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y - u);
    ctx.lineTo(x, y + u);
    ctx.moveTo(x, y - u * 0.4);
    ctx.lineTo(x - u * 0.8, y + u * 0.1);
    ctx.moveTo(x, y - u * 0.4);
    ctx.lineTo(x + u * 0.8, y + u * 0.1);
    ctx.moveTo(x, y + u);
    ctx.lineTo(x - u * 0.55, y + u * 1.9);
    ctx.moveTo(x, y + u);
    ctx.lineTo(x + u * 0.55, y + u * 1.9);
    ctx.stroke();
  }

  function draw(t) {
    size();
    lastT = t;
    var shortSide = Math.min(fieldW, fieldH);
    var cx = fieldX + fieldW / 2, cy = fieldY + fieldH / 2;
    var R = 0.11 * shortSide;
    var off = ringOffset(t);
    var u = shortSide * 0.014;

    ctx.fillStyle = '#121014';
    ctx.fillRect(0, 0, W, H);

    // Faint winding paths, one per group, in and out.
    ctx.strokeStyle = '#2a2530';
    ctx.lineWidth = 1;
    ctx.lineCap = 'butt';
    for (var gi = 0; gi < groups.length; gi++) {
      var g = groups[gi];
      var ax = fieldX + g.sx * fieldW, ay = fieldY + g.sy * fieldH;
      var ea = g.slot + OMEGA * ((g.start + RING_START) % LOOP) + off;
      var bx = cx + R * Math.cos(ea), by = cy + R * Math.sin(ea);
      ctx.beginPath();
      for (var k = 0; k <= 48; k++) {
        var pt = pathPoint(ax, ay, bx, by, k / 48, g.wob, g.wamp, shortSide);
        if (k === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
      var sa = g.slot + OMEGA * ((g.start + OUT_START) % LOOP) + off;
      var ax2 = cx + R * Math.cos(sa), ay2 = cy + R * Math.sin(sa);
      ctx.beginPath();
      for (var k2 = 0; k2 <= 48; k2++) {
        var pt2 = pathPoint(ax2, ay2, ax, ay, k2 / 48, g.wob, g.wamp, shortSide);
        if (k2 === 0) ctx.moveTo(pt2.x, pt2.y); else ctx.lineTo(pt2.x, pt2.y);
      }
      ctx.stroke();
    }

    // Faint ring circle.
    ctx.strokeStyle = '#2a2530';
    ctx.lineWidth = 1;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(cx + R, cy);
    ctx.arc(cx, cy, R, 0, 2 * Math.PI);
    ctx.stroke();

    // Center point: small open circle, never moves.
    ctx.strokeStyle = '#e0d6c0';
    ctx.lineWidth = 2;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(cx + Math.max(4, shortSide * 0.008), cy);
    ctx.arc(cx, cy, Math.max(4, shortSide * 0.008), 0, 2 * Math.PI);
    ctx.stroke();

    // Groups.
    var hookGroups = [];
    for (var gj = 0; gj < groups.length; gj++) {
      var gg = groups[gj];
      var pos = groupPos(gg, t, shortSide);
      for (var mi = 0; mi < gg.cluster.length; mi++) {
        var o = gg.cluster[mi];
        drawGlyph(pos.x + o.ox * u, pos.y + o.oy * u, u, gg.color);
      }
      hookGroups.push({ x: pos.x, y: pos.y, phase: pos.phase, tau: pos.tau, color: gg.color });
    }

    if (typeof window !== 'undefined') {
      window.__t34 = {
        center: { x: cx, y: cy }, R: R,
        field: { x: fieldX, y: fieldY, w: fieldW, h: fieldH },
        ringOffset: off, groups: hookGroups
      };
    }
  }

  function toField(e) { return { x: e.clientX, y: e.clientY }; }

  function onDown(e) {
    size();
    var p = toField(e);
    var shortSide = Math.min(fieldW, fieldH);
    // Travelling groups first.
    for (var gi = 0; gi < groups.length; gi++) {
      var pos = groupPos(groups[gi], lastT, shortSide);
      if (pos.phase !== 'in' && pos.phase !== 'out') continue;
      var dx = p.x - pos.x, dy = p.y - pos.y;
      if (dx * dx + dy * dy <= 28 * 28) {
        var ses = { startT: lastT, moves: [], endT: null };
        groupLogs[gi].push(ses);
        drag = { kind: 'group', gi: gi, grabX: p.x, session: ses };
        if (e.preventDefault) e.preventDefault();
        return;
      }
    }
    // Ring band (covers ring-phase groups sitting on the ring).
    var cx = fieldX + fieldW / 2, cy = fieldY + fieldH / 2;
    var R = 0.11 * shortSide;
    var d = Math.sqrt((p.x - cx) * (p.x - cx) + (p.y - cy) * (p.y - cy));
    if (Math.abs(d - R) <= 28) {
      var ses2 = { startT: lastT, moves: [], endT: null };
      ringLog.push(ses2);
      drag = { kind: 'ring', grabX: p.x, session: ses2 };
      if (e.preventDefault) e.preventDefault();
      return;
    }
  }
  function onMove(e) {
    if (!drag) return;
    var p = toField(e);
    var rate = 1;
    var dd = p.x - drag.grabX;
    var r = dd / 300;
    if (r > 1.0) r = 1.0; if (r < -0.6) r = -0.6;
    rate = 1 + r;
    drag.session.moves.push([lastT, rate]);
  }
  function onUp() {
    if (!drag) return;
    drag.session.endT = lastT;
    drag = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', size);
    }
    window.addEventListener('resize', size);
  }

  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    draw((ts - startT) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
