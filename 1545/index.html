<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Channels, No Front Row</title>
<style>
html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var SEED = 1545000;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(SEED);

// Super-loop: 360 s. Panel durations are seeded picks from divisors of 360
// in [8, 30], so every panel closes exactly at t = LOOP. Each panel also
// carries a seeded phase offset, so no two panels share a beat and frame
// one shows every panel mid-motion.
var DIVISORS = [8, 9, 10, 12, 15, 18, 20, 24, 30];
var pool = DIVISORS.slice();
for (var si = pool.length - 1; si > 0; si--) {
  var sj = Math.floor(rand() * (si + 1));
  var tmp = pool[si]; pool[si] = pool[sj]; pool[sj] = tmp;
}
var DUR = [pool[0], pool[1], pool[2], pool[3]];
var OFF = [rand(), rand(), rand(), rand()];
var LOOP = 360;

var COLORS = ['#ddd3b8', '#c98f3d', '#a34a2e', '#7a9a92'];
var BG = '#141210';
var DIVC = '#3a352e';

// Seeded per-panel mark data (fixed for the life of the piece).
var DOTS = [];
for (var di = 0; di < 14; di++) {
  DOTS.push({
    x: 0.08 + rand() * 0.84, y: 0.10 + rand() * 0.80,
    ax: 0.02 + rand() * 0.05, ay: 0.02 + rand() * 0.05,
    px: rand() * 6.2832, py: rand() * 6.2832,
    kx: 1 + Math.floor(rand() * 3), ky: 1 + Math.floor(rand() * 3)
  });
}
var BARS = [];
for (var bi = 0; bi < 9; bi++) {
  BARS.push({ x: 0.08 + bi * 0.105, ph: rand() * 6.2832, k: 1 + Math.floor(rand() * 2) });
}
var RING_SPOKES = 8;
var LINE_PTS = [];
for (var li = 0; li < 7; li++) {
  LINE_PTS.push({ x: 0.08 + li * 0.14, y: 0.15 + rand() * 0.70 });
}

var W = 0, H = 0;
var lastT = 0;
var focus = -1; // panel index pressed, or -1
var divDrag = null; // 'V' | 'H' | null
var divX = 0, divY = 0; // current divider positions (pixels)
var divTargetX = 0, divTargetY = 0;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function phase(i, t) {
  var u = t % LOOP;
  if (u < 0) u += LOOP;
  var p = OFF[i] + u / DUR[i];
  return p - Math.floor(p);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  } else { vw = 720; vh = 720; }
  W = vw; H = vh;
  divTargetX = W / 2; divTargetY = H / 2;
  if (!divDrag) { divX = W / 2; divY = H / 2; }
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
function panelRect(i) {
  if (i === 0) return { x: 0, y: 0, w: divX, h: divY };
  if (i === 1) return { x: divX, y: 0, w: W - divX, h: divY };
  if (i === 2) return { x: 0, y: divY, w: divX, h: H - divY };
  return { x: divX, y: divY, w: W - divX, h: H - divY };
}
function panelAt(cx, cy) {
  if (cx < divX && cy < divY) return 0;
  if (cx >= divX && cy < divY) return 1;
  if (cx < divX && cy >= divY) return 2;
  return 3;
}
function onDown(e) {
  size();
  var cx = e.clientX, cy = e.clientY;
  var nearV = Math.abs(cx - divX) <= 14;
  var nearH = Math.abs(cy - divY) <= 14;
  if (nearV) { divDrag = 'V'; }
  else if (nearH) { divDrag = 'H'; }
  else { focus = panelAt(cx, cy); }
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (divDrag === 'V') {
    divX = clamp(e.clientX, 0.38 * W, 0.62 * W);
  } else if (divDrag === 'H') {
    divY = clamp(e.clientY, 0.38 * H, 0.62 * H);
  }
}
function onUp() {
  focus = -1;
  divDrag = null;
  divX = W / 2; divY = H / 2;
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', size);
  }
  if (window.addEventListener) window.addEventListener('resize', size);
}

function alphaFor(i) {
  if (focus < 0) return 1;
  return i === focus ? 1 : 0.45;
}
function round4(v) {
  return Math.round(v * 10000) / 10000;
}

function drawDots(rect, t) {
  var p = phase(0, t);
  var s = Math.min(rect.w, rect.h);
  ctx.fillStyle = COLORS[0];
  ctx.globalAlpha = round4(alphaFor(0));
  for (var i = 0; i < DOTS.length; i++) {
    var d = DOTS[i];
    var x = rect.x + (d.x + d.ax * Math.sin(6.2832 * p * d.kx + d.px)) * rect.w;
    var y = rect.y + (d.y + d.ay * Math.sin(6.2832 * p * d.ky + d.py)) * rect.h;
    var ds = Math.max(3, 0.022 * s);
    ctx.fillRect(x - ds / 2, y - ds / 2, ds, ds);
  }
  ctx.globalAlpha = 1;
}
function drawBars(rect, t) {
  var p = phase(1, t);
  var base = rect.y + rect.h * 0.5;
  ctx.fillStyle = COLORS[1];
  ctx.globalAlpha = round4(alphaFor(1));
  for (var i = 0; i < BARS.length; i++) {
    var b = BARS[i];
    var h = (0.5 + 0.5 * Math.sin(6.2832 * p * b.k + b.ph)) * rect.h * 0.78;
    var bw = rect.w * 0.055;
    var bx = rect.x + b.x * rect.w;
    ctx.fillRect(bx, base - h / 2, bw, h);
  }
  ctx.globalAlpha = 1;
}
function drawRing(rect, t) {
  var p = phase(2, t);
  var cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
  var r = Math.min(rect.w, rect.h) * 0.30;
  var ang = 6.2832 * p;
  ctx.strokeStyle = COLORS[2];
  ctx.lineWidth = Math.max(2, r * 0.10);
  ctx.lineCap = 'butt';
  ctx.globalAlpha = round4(alphaFor(2));
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.lineWidth = Math.max(2, r * 0.08);
  for (var i = 0; i < RING_SPOKES; i++) {
    var a = ang + i * 6.2832 / RING_SPOKES;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawLine(rect, t) {
  // Draw fraction: 0 -> 1 over the first half of the loop, 1 -> 0 over
  // the second half (the line draws itself, then erases itself).
  var p = phase(3, t);
  var f = p < 0.5 ? p * 2 : (1 - p) * 2;
  ctx.strokeStyle = COLORS[3];
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.globalAlpha = round4(alphaFor(3));
  var pts = [];
  for (var i = 0; i < LINE_PTS.length; i++) {
    pts.push({ x: rect.x + LINE_PTS[i].x * rect.w, y: rect.y + LINE_PTS[i].y * rect.h });
  }
  // Total polyline length, then walk f of it.
  var segs = [];
  var total = 0;
  for (var j = 0; j < pts.length - 1; j++) {
    var dx = pts[j + 1].x - pts[j].x, dy = pts[j + 1].y - pts[j].y;
    var len = Math.sqrt(dx * dx + dy * dy);
    segs.push(len);
    total += len;
  }
  var target = f * total;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  var acc = 0;
  for (var k = 0; k < segs.length; k++) {
    if (acc + segs[k] <= target) {
      ctx.lineTo(pts[k + 1].x, pts[k + 1].y);
      acc += segs[k];
    } else {
      var rem = target - acc;
      var frac = segs[k] > 0 ? rem / segs[k] : 0;
      ctx.lineTo(
        pts[k].x + (pts[k + 1].x - pts[k].x) * frac,
        pts[k].y + (pts[k + 1].y - pts[k].y) * frac
      );
      break;
    }
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function draw(t) {
  size();
  lastT = t;
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  drawDots(panelRect(0), t);
  drawBars(panelRect(1), t);
  drawRing(panelRect(2), t);
  drawLine(panelRect(3), t);
  // Dividers, drawn last so they read over the panels.
  ctx.fillStyle = DIVC;
  ctx.fillRect(divX - 1, 0, 2, H);
  ctx.fillRect(0, divY - 1, W, 2);

  if (typeof window !== 'undefined') {
    var dotPos = [];
    var r0 = panelRect(0);
    var p0 = phase(0, t);
    for (var i = 0; i < DOTS.length; i++) {
      var d = DOTS[i];
      dotPos.push({
        x: r0.x + (d.x + d.ax * Math.sin(6.2832 * p0 * d.kx + d.px)) * r0.w,
        y: r0.y + (d.y + d.ay * Math.sin(6.2832 * p0 * d.ky + d.py)) * r0.h
      });
    }
    window.__t45 = {
      loop: LOOP, durations: DUR, offsets: OFF,
      phases: [phase(0, t), phase(1, t), phase(2, t), phase(3, t)],
      rects: [panelRect(0), panelRect(1), panelRect(2), panelRect(3)],
      divX: divX, divY: divY, focus: focus, divDrag: divDrag,
      alphas: [alphaFor(0), alphaFor(1), alphaFor(2), alphaFor(3)],
      dots: dotPos, colors: COLORS, bg: BG, divColor: DIVC
    };
  }
}

var startT = null;
function loop(ts) {
  if (startT === null) startT = ts;
  draw((ts - startT) / 1000);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
draw(0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
