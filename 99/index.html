<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№99 · Blurr Field</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EFE8; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(20,18,16,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to shift the field</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

// No.99 Blurr Field: static monochrome pixel study, seeded PRNG "Blurr Field".
// Field exactly 48 rows by 64 columns (3,072 cells) of square pixels. A periodic value-noise
// field is computed at cell resolution, box-blurred for 2 passes, then quantized to exactly
// 7 tonal levels between white #F2EFE8 and black #141210. Hard pixel edges, no smoothing.
// STATIC decision (per spec default): no automatic motion. Dragging translates the sampled
// field offset over the same periodic field (no new seed); on release it eases back to the
// curated offset.
const ROWS=48, COLS=64, LEVELS=7;
const rng=mulberry(hashStr('Blurr Field'));
// periodic coarse lattice (wraps, so drag offsets can roam freely)
const LW=16, LH=12;
const lat=new Float32Array(LW*LH);
for(let i=0;i<LW*LH;i++) lat[i]=rng();
function noiseAt(u, v){ // u, v in cell units, periodic over COLS x ROWS
  const x=((u/COLS)*LW)%LW, y=((v/ROWS)*LH)%LH;
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const sx=xf*xf*(3-2*xf), sy=yf*yf*(3-2*yf);
  const w=(a,b)=>lat[(((b%LH)+LH)%LH)*LW + (((a%LW)+LW)%LW)];
  return (w(xi,yi)*(1-sx)+w(xi+1,yi)*sx)*(1-sy) + (w(xi,yi+1)*(1-sx)+w(xi+1,yi+1)*sx)*sy;
}
// build the field once: two octaves of noise, then box blur 2 passes
const FIELD=new Float32Array(COLS*ROWS);
for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
  FIELD[r*COLS+c]=0.72*noiseAt(c, r) + 0.28*noiseAt(c*2, r*2); // second octave at double frequency
}
function blurPass(src){
  const dst=new Float32Array(src.length);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    let s=0;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      const rr=(r+dr+ROWS)%ROWS, cc=(c+dc+COLS)%COLS;
      s+=src[rr*COLS+cc];
    }
    dst[r*COLS+c]=s/9;
  }
  return dst;
}
let blurred=blurPass(blurPass(FIELD));
// normalize to 0..1 once
let mn=1e9, mx=-1e9;
for(const v of blurred){ if(v<mn)mn=v; if(v>mx)mx=v; }
for(let i=0;i<blurred.length;i++) blurred[i]=(blurred[i]-mn)/(mx-mn);
// 7 fixed greys between #F2EFE8 and #141210
const GREYS=[];
for(let i=0;i<LEVELS;i++){
  const t=i/(LEVELS-1);
  const r=Math.round(242+(20-242)*t), g=Math.round(239+(18-239)*t), b=Math.round(232+(16-232)*t);
  GREYS.push('rgb('+r+','+g+','+b+')');
}
let dragging=false, offStart=[0,0], offCur=[0,0], lastPt=null, lastMs=null;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(!dragging && dt>0){ // ease back to the curated offset
    const f=Math.pow(0.03, dt);
    offCur[0]*=f; offCur[1]*=f;
    if(Math.abs(offCur[0])<0.02) offCur[0]=0;
    if(Math.abs(offCur[1])<0.02) offCur[1]=0;
  }
  ctx.fillStyle='#F2EFE8'; ctx.fillRect(0,0,w,h);
  // square pixels: the 64 by 48 block of cells stays square and centred on every screen
  const s=Math.min(w/COLS, h/ROWS);
  const bw=s*COLS, bh=s*ROWS;
  const ox=(w-bw)/2, oy=(h-bh)/2;
  const offX=offCur[0], offY=offCur[1];
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cc=((c+Math.round(offX))%COLS+COLS)%COLS;
      const rr=((r+Math.round(offY))%ROWS+ROWS)%ROWS;
      const v=blurred[rr*COLS+cc];
      const lvl=Math.min(LEVELS-1, Math.floor(v*LEVELS));
      ctx.fillStyle=GREYS[lvl];
      ctx.fillRect(ox+c*s, oy+r*s, s+0.5, s+0.5);
    }
  }
  if(ROWS*COLS!==3072) console.assert(false,'cells',ROWS*COLS);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; lastPt=[e.clientX,e.clientY]; offStart=[offCur[0],offCur[1]]; });
canvas.addEventListener('pointermove',e=>{
  if(!dragging||!lastPt) return;
  const [w,h]=viewportWH();
  const s=Math.min(w/COLS, h/ROWS);
  offCur[0]=offStart[0]+(e.clientX-lastPt[0])/s;
  offCur[1]=offStart[1]+(e.clientY-lastPt[1])/s;
});
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
