<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stone in the Stream</title>
<style>
html, body { margin: 0; padding: 0; background: #0B3B3E; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0B3B3E';
var TEAL_DEEP = '#0B3B3E';
var PLATE = '#05282B';
var PLATE_LINE = 'rgba(255,255,255,0.28)';
var TITLE_INK = '#FFFFFF';
var HINT_INK = '#9FD8D2';
var WHITE = '#FFFFFF';
var PERIOD = 24;
var FRAME_T = 0;
/* Frame one: fixed phase t = 0, stone at stage fractions (0.62, 0.55),
   radius 0.17 of the stage's short side. The stone is never drawn. */
var STONE_X = 0.62, STONE_Y = 0.55, STONE_R = 0.17;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1712);
/* ---- stone state (stage fractions); drag moves it, lines re-bend live ---- */
var stone = { x: STONE_X, y: STONE_Y };
var dragging = false;
/* ---- streamline set: upstream offsets clustered toward the stone so the
   lines bunch at its shoulders; y0 is recomputed per frame in draw() ---- */
var LINES = 110;
var lines = [];
var i;
for (i = 0; i < LINES; i++) {
  lines.push({
    a: 0.42 + rng() * 0.38,
    stipOff: rng(),                 /* phase offset for stipple marks along the line */
    stipEvery: 30 + rng() * 22,    /* px between stipple marks */
    hatchSeed: rng()               /* per-line seed for shoulder cross-hatch ticks */
  });
}
/* ---- shoulder cross-hatch ticks are drawn from the main lines in draw() ---- */
/* ---- sparse loose arcs drifting above the stone ---- */
var ARCS = 7;
var arcs = [];
for (i = 0; i < ARCS; i++) {
  arcs.push({
    x: 0.08 + rng() * 0.84,
    y: 0.05 + rng() * 0.13,
    len: 0.14 + rng() * 0.14,
    sag: (rng() - 0.5) * 0.02,
    a: 0.15 + rng() * 0.15,
    drift: 0.004 + rng() * 0.008,
    ph: rng() * TAU
  });
}
var phaseT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones (field-like piece) ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* Potential flow around a repelling disc: streamline for upstream offset y0.
   y = y0 + R^2 * y / (x^2 + y^2), solved by fixed-point iteration.
   Returns polyline points in stage coordinates, or null if the line would
   strike the disc (|y0| inside the gap). */
function streamline(st, cx, cy, R, y0, tilt) {
  if (Math.abs(y0) < R * 1.03) return null;
  var pts = [];
  var step = Math.max(4, st.w / 220);
  var u, v, k, d2;
  var ca = Math.cos(tilt || 0), sa = Math.sin(tilt || 0);
  for (u = -st.w * 0.6; u <= st.w * 0.6; u += step) {
    /* solve in the tilted (u along flow, v across) frame, then rotate back */
    v = y0;
    for (k = 0; k < 10; k++) {
      d2 = u * u + v * v;
      if (d2 < 1) d2 = 1;
      v = y0 + (R * R * v) / d2;
    }
    d2 = u * u + v * v;
    var uu = u, vv = v;
    if (d2 < R * R * 1.02) {
      /* push radially out of the void; streamlines never cross it */
      var d = Math.sqrt(d2) || 1;
      var s = (R * 1.02) / d;
      uu = u * s; vv = v * s;
    }
    var px = cx + uu * ca - vv * sa;
    var py = cy + uu * sa + vv * ca;
    pts.push([px, py]);
  }
  return pts;
}
function drawPolyline(pts) {
  var j;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
  ctx.stroke();
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var sw = st.w, sh = st.h;
  var cx = st.x + stone.x * sw, cy = st.y + stone.y * sh;
  var R = STONE_R * Math.min(sw, sh);
  var t = phaseT;
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, sw, sh);
  ctx.clip();
  var k, pts, j, x, y;
  /* ---- main streamlines: white hairlines, bending around the void ---- */
  ctx.lineCap = 'round';
  var Rfrac = R / sh;
  for (k = 0; k < lines.length; k++) {
    var ln = lines[k];
    /* upstream offset clustered toward the stone: pow < 1 packs lines at
       the shoulders, leaving generous calm zones at the field edges */
    var frac = (k + 0.5) / lines.length;
    var side = frac < 0.5 ? -1 : 1;
    var g = (frac < 0.5 ? 0.5 - frac : frac - 0.5) * 2;
    var y0 = side * (Rfrac * 1.04 + (0.58 - Rfrac * 1.04) * Math.pow(g, 0.65)) * sh;
    pts = streamline(st, cx, cy, R, y0, 0);
    if (!pts) continue;
    ctx.lineWidth = Math.max(0.6, sh * 0.0011);
    ctx.strokeStyle = rgba(WHITE, ln.a);
    drawPolyline(pts);
    /* tiny stipple dashes riding along the line, travelling slowly with time */
    var travel = (t * 6) % ln.stipEvery;
    var acc = ln.stipOff * ln.stipEvery + travel;
    for (j = 1; j < pts.length; j++) {
      var dx = pts[j][0] - pts[j - 1][0], dy = pts[j][1] - pts[j - 1][1];
      var seg = Math.sqrt(dx * dx + dy * dy);
      acc += seg;
      if (acc >= ln.stipEvery) {
        acc -= ln.stipEvery;
        var f = 1 - acc / seg;
        var mx = pts[j - 1][0] + dx * f, my = pts[j - 1][1] + dy * f;
        var nl = Math.sqrt(dx * dx + dy * dy) || 1;
        var nx = -dy / nl, ny = dx / nl; /* perpendicular unit */
        var tl = Math.max(2, sh * 0.0025);
        ctx.lineWidth = Math.max(0.6, sh * 0.001);
        ctx.strokeStyle = rgba(WHITE, Math.min(0.85, ln.a + 0.2));
        ctx.beginPath();
        ctx.moveTo(mx - nx * tl, my - ny * tl);
        ctx.lineTo(mx + nx * tl, my + ny * tl);
        ctx.stroke();
      }
      /* shoulder cross-hatch: short diagonal ticks where a line skirts
         the stone, crossing the flow at about 40 degrees */
      var mdx = pts[j][0] - cx, mdy = pts[j][1] - cy;
      var md = Math.sqrt(mdx * mdx + mdy * mdy);
      if (md > R * 1.06 && md < R * 1.7) {
        var hash = Math.abs(Math.sin(k * 127.1 + j * 311.7 + ln.hatchSeed * 57.3) * 43758.5453) % 1;
        if (hash < 0.16) {
          var hx = pts[j][0], hy = pts[j][1];
          var hl = Math.max(4, sh * 0.008);
          var ha = Math.atan2(dy, dx) + 0.7; /* ~40 degrees off the tangent */
          ctx.lineWidth = Math.max(0.6, sh * 0.0009);
          ctx.strokeStyle = rgba(WHITE, 0.45);
          ctx.beginPath();
          ctx.moveTo(hx - Math.cos(ha) * hl, hy - Math.sin(ha) * hl);
          ctx.lineTo(hx + Math.cos(ha) * hl, hy + Math.sin(ha) * hl);
          ctx.stroke();
        }
      }
    }
  }
  /* ---- sparse loose arcs drifting above ---- */
  for (k = 0; k < arcs.length; k++) {
    var ar = arcs[k];
    var ax = st.x + (ar.x + Math.sin(TAU * t / PERIOD + ar.ph) * ar.drift) * sw;
    var ay = st.y + ar.y * sh;
    var alen = ar.len * sw;
    var aseg = 16;
    ctx.lineWidth = Math.max(0.6, sh * 0.001);
    ctx.strokeStyle = rgba(WHITE, ar.a);
    ctx.beginPath();
    for (j = 0; j <= aseg; j++) {
      var u = j / aseg;
      var px = ax + (u - 0.5) * alen;
      var py = ay + ar.sag * sh * 4 * u * (1 - u);
      if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Stone in the Stream').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Stone in the Stream').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 19').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Stone in the Stream', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 19', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to move the stone.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
/* ---- drag interaction: the stone follows the pointer; the field re-bends ---- */
function pointerPos(ev) {
  var r = canvas.getBoundingClientRect();
  var cx = (ev.clientX - r.left) / (r.width || 1);
  var cy = (ev.clientY - r.top) / (r.height || 1);
  return [cx * VW, cy * VH];
}
function moveStone(ev) {
  var p = pointerPos(ev);
  var st = stageRect();
  var m = STONE_R * Math.min(st.w, st.h) * 1.25;
  stone.x = clamp((p[0] - st.x) / st.w, m / st.w, 1 - m / st.w);
  stone.y = clamp((p[1] - st.y) / st.h, m / st.h, 1 - m / st.h);
  draw();
}
if (typeof window !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (ev) {
    dragging = true;
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    moveStone(ev);
    if (ev.preventDefault) ev.preventDefault();
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (dragging) moveStone(ev);
  });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    stone: function () { var st = stageRect(); return [st.x + stone.x * st.w, st.y + stone.y * st.h]; },
    stoneRadius: function () { var st = stageRect(); return STONE_R * Math.min(st.w, st.h); },
    lineCount: function () { return LINES; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 0 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
