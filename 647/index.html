<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tramo Norte</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0C0F14; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): ground, three silhouette tones, snow, three accents.
  var GROUND = '#0C0F14';
  var TONES = ['#2E3A4A', '#3A3F45', '#232B36']; // ridge blue, massif gray, spire slate
  var SNOW = '#E8EDF2';
  var ACCENTS = ['#E8A33D', '#E89B7D', '#5C7A4D']; // amber, rose, moss

  var N_FOLIOS = 8;

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---- Archetype profile generators -------------------------------------
  // Each returns { pts: [[x, h]...] with h normalized (peak ~1), snowN,
  // peakX, craterX (or -1) }. All shapes are top profiles filled to the
  // bottom edge: the mountain is anchored to the foot of the folio.

  function noiseKnots(rng, n, lo, hi) {
    var k = [];
    for (var i = 0; i <= n; i++) k.push(lo + rng() * (hi - lo));
    return k;
  }
  function sampleKnots(k, x) {
    var f = x * (k.length - 1), i = Math.floor(f), fr = f - i;
    var t = (1 - Math.cos(fr * Math.PI)) / 2;
    return lerp(k[i], k[Math.min(i + 1, k.length - 1)], t);
  }
  function gauss(x, c, w) { var d = (x - c) / w; return Math.exp(-d * d); }

  function genProfile(kind, rng) {
    var N = 240, pts = [], i, x, h;
    var snowN = 0.7, peakX = 0.5, craterX = -1;
    if (kind === 'volcano' || kind === 'terraced') {
      var c = 0.5 + (rng() - 0.5) * 0.06;
      var hw = 0.40 + rng() * 0.06;
      var dip = 0.16 + rng() * 0.08, dipW = 0.030 + rng() * 0.012;
      var earOff = 0.085 + rng() * 0.025, earH = 0.20 + rng() * 0.10, earW = 0.026 + rng() * 0.012;
      var jit = noiseKnots(rng, 60, -0.012, 0.012);
      for (i = 0; i <= N; i++) {
        x = i / N;
        var t = Math.abs(x - c) / hw;
        h = t >= 1 ? 0 : Math.pow(1 - t, 0.92);
        if (kind === 'volcano') {
          h += earH * gauss(x, c - earOff, earW) + earH * 0.9 * gauss(x, c + earOff, earW);
        }
        h += sampleKnots(jit, x) * (h > 0.02 ? 1 : 0);
        if (kind === 'terraced') {
          var steps = 9;
          h = Math.floor(Math.max(0, h) * steps) / steps + 0.015;
        }
        h -= (kind === 'terraced' ? dip * 0.5 : dip) * gauss(x, c, dipW);
        pts.push([x, Math.max(0, h)]);
      }
      snowN = 0.70 + rng() * 0.06; peakX = c; craterX = c;
    } else if (kind === 'knife' || kind === 'sierra') {
      var nk = kind === 'knife' ? 20 : 9;
      var base = kind === 'knife' ? 0.42 : 0.34;
      var amp = kind === 'knife' ? 0.58 : 0.52;
      var knots = noiseKnots(rng, nk, 0, 1);
      var jit2 = noiseKnots(rng, 90, -0.02, 0.02);
      var best = -1;
      for (i = 0; i <= N; i++) {
        x = i / N;
        h = base + amp * sampleKnots(knots, x) + sampleKnots(jit2, x);
        pts.push([x, Math.max(0.02, h)]);
        if (h > best) { best = h; peakX = x; }
      }
      snowN = kind === 'knife' ? 0.88 : 0.90;
    } else if (kind === 'massif') {
      var peaks = [];
      var np = 3 + Math.floor(rng() * 2);
      for (i = 0; i < np; i++) {
        peaks.push({ c: 0.18 + rng() * 0.64, w: 0.16 + rng() * 0.15, h: 0.55 + rng() * 0.45 });
      }
      var jit3 = noiseKnots(rng, 70, -0.015, 0.015);
      var best2 = -1;
      for (i = 0; i <= N; i++) {
        x = i / N; h = 0.05;
        for (var p = 0; p < peaks.length; p++) h += peaks[p].h * gauss(x, peaks[p].c, peaks[p].w);
        h = Math.min(h, 1.02) + sampleKnots(jit3, x);
        pts.push([x, Math.max(0.02, h)]);
        if (h > best2) { best2 = h; peakX = x; }
      }
      snowN = 0.76 + rng() * 0.06;
    } else if (kind === 'spire' || kind === 'doublespire') {
      var towers = [{ c: 0.36 + rng() * 0.28, w: 0.085 + rng() * 0.045, h: 1.0 }];
      if (kind === 'doublespire') {
        var c2 = towers[0].c < 0.5 ? towers[0].c + 0.24 + rng() * 0.1 : towers[0].c - 0.24 - rng() * 0.1;
        towers.push({ c: clamp(c2, 0.14, 0.86), w: 0.075 + rng() * 0.04, h: 0.72 + rng() * 0.14 });
      }
      var jit4 = noiseKnots(rng, 120, -0.02, 0.02);
      for (i = 0; i <= N; i++) {
        x = i / N; h = 0.045 * gauss(x, 0.5, 0.55);
        for (var q = 0; q < towers.length; q++) {
          var tw = towers[q];
          var tt = Math.abs(x - tw.c) / tw.w;
          if (tt < 1) h = Math.max(h, tw.h * (1 - tt));
        }
        h += sampleKnots(jit4, x) * (h > 0.05 ? 1 : 0.2);
        pts.push([x, Math.max(0, h)]);
      }
      snowN = 0.52 + rng() * 0.08; peakX = towers[0].c;
    } else { // horn
      var hc = 0.44 + rng() * 0.1;
      var wL = 0.34 + rng() * 0.08, wR = 0.20 + rng() * 0.06;
      var jit5 = noiseKnots(rng, 80, -0.012, 0.012);
      for (i = 0; i <= N; i++) {
        x = i / N;
        if (x < hc) { var tl = (hc - x) / wL; h = tl >= 1 ? 0 : 1 - Math.pow(tl, 1.7); }
        else { var tr = (x - hc) / wR; h = tr >= 1 ? 0 : 1 - Math.pow(tr, 0.75); }
        h += sampleKnots(jit5, x) * (h > 0.03 ? 1 : 0);
        pts.push([x, Math.max(0, h)]);
      }
      snowN = 0.5 + rng() * 0.08; peakX = hc;
    }
    return { pts: pts, snowN: snowN, peakX: peakX, craterX: craterX };
  }

  // ---- Folio sequence ----------------------------------------------------
  var ARCH = ['volcano', 'knife', 'massif', 'spire', 'doublespire', 'terraced', 'sierra', 'horn'];
  // Accent usage per archetype: crater mark, snow-line glow, crest highlight.
  var ACCENT_USE = {
    volcano: 'crater', terraced: 'crater', horn: 'glow',
    massif: 'glow', doublespire: 'glow',
    knife: 'highlight', sierra: 'highlight', spire: 'highlight'
  };

  var genSeed = 647;
  var folios = [];

  function buildFolios() {
    var rng = mulberry32(genSeed * 1000 + 17);
    // Folio 1 is always the twin-eared volcano; the other seven archetypes
    // are shuffled in, so no two adjacent folios ever share an archetype
    // (all eight are distinct, wrap included).
    var rest = ARCH.slice(1);
    for (var i = rest.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = rest[i]; rest[i] = rest[j]; rest[j] = tmp;
    }
    var order = ['volcano'].concat(rest);
    folios = [];
    var toneOff = Math.floor(rng() * 3), accOff = Math.floor(rng() * 3);
    for (var f = 0; f < N_FOLIOS; f++) {
      var kind = order[f];
      var frng = mulberry32(genSeed * 1000 + f * 131 + 7);
      var prof = genProfile(kind, frng);
      var tone = TONES[(toneOff + f) % 3];
      var accent = ACCENTS[(accOff + f) % 3];
      // Micro-motion channels: two of shimmer / condor / wind, seeded.
      var pool = ['shimmer', 'condor', 'wind'];
      var ci = Math.floor(frng() * 3);
      var channels = [pool[ci], pool[(ci + 1 + Math.floor(frng() * 2)) % 3]];
      // Snow shimmer sparkles: seeded points inside the snow band.
      var sparkles = [];
      for (var s = 0; s < 14; s++) {
        var sx = frng();
        var si = Math.round(sx * (prof.pts.length - 1));
        var sh = prof.pts[si][1];
        if (sh > prof.snowN + 0.03) {
          sparkles.push({
            x: sx, h: prof.snowN + 0.03 + frng() * (sh - prof.snowN - 0.03),
            ph: frng() * Math.PI * 2, sp: 1.2 + frng() * 2.2
          });
        }
      }
      var winds = [];
      for (var wdi = 0; wdi < 2; wdi++) {
        winds.push({ ph: frng(), sp: 0.05 + frng() * 0.05, dy: 0.02 + frng() * 0.05, len: 0.05 + frng() * 0.05 });
      }
      folios.push({
        kind: kind, tone: tone, accent: accent, use: ACCENT_USE[kind],
        snowEdge: noiseKnots(frng, 26, -0.010, 0.010),
        pts: prof.pts, snowN: prof.snowN, peakX: prof.peakX, craterX: prof.craterX,
        peak: 0.40 + frng() * 0.24, // silhouette height as a fraction of H
        channels: channels, sparkles: sparkles, winds: winds,
        condorOff: frng() * 40, ticks: 2 + (f % 5)
      });
    }
  }

  // ---- Canvas / layout ---------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || H > W * 1.15;
  }

  // ---- Navigation state --------------------------------------------------
  var index = 0;          // current folio
  var slidePx = 0;        // live horizontal offset (drag or settle animation)
  var anim = null;        // { from, to, start, dur, dir } settle animation
  var dragging = false, dragStartX = 0, dragStartT = 0, lastTapT = -10, lastTapX = 0;

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function startSettle(to, dir, now) {
    anim = { from: slidePx, to: to, start: now, dur: 0.38, dir: dir };
  }

  // QA hook: ?seed=fN starts on folio N (inert without the query string).
  if (typeof location !== 'undefined' && location.search) {
    var fm = /seed=f(\d+)/.exec(location.search);
    if (fm) index = clamp(parseInt(fm[1], 10), 0, N_FOLIOS - 1);
  }

  // ---- Drawing -----------------------------------------------------------
  function drawCondor(cx, cy, s, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx - 0.10 * s, cy + 0.02 * s);
    ctx.lineTo(cx - 1.00 * s, cy - 0.16 * s);
    ctx.lineTo(cx - 1.04 * s, cy - 0.10 * s);
    ctx.lineTo(cx - 0.62 * s, cy + 0.045 * s);
    ctx.lineTo(cx - 0.30 * s, cy + 0.075 * s);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 0.10 * s, cy + 0.02 * s);
    ctx.lineTo(cx + 1.00 * s, cy - 0.16 * s);
    ctx.lineTo(cx + 1.04 * s, cy - 0.10 * s);
    ctx.lineTo(cx + 0.62 * s, cy + 0.045 * s);
    ctx.lineTo(cx + 0.30 * s, cy + 0.075 * s);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 0.05 * s, cy + 0.10 * s);
    ctx.lineTo(cx + 0.05 * s, cy + 0.10 * s);
    ctx.lineTo(cx + 0.11 * s, cy + 0.24 * s);
    ctx.lineTo(cx - 0.11 * s, cy + 0.24 * s);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx, cy + 0.04 * s, 0.11 * s, 0.20 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFolio(f, ox, t) {
    var peakPx = f.peak * H;
    function Y(h) { return H - h * peakPx; }
    // Silhouette
    ctx.fillStyle = f.tone;
    ctx.beginPath();
    ctx.moveTo(ox, H);
    for (var i = 0; i < f.pts.length; i++) {
      ctx.lineTo(ox + f.pts[i][0] * W, Y(f.pts[i][1]));
    }
    ctx.lineTo(ox + W, H);
    ctx.closePath();
    ctx.fill();
    // Snow cap: crest runs above the snow line, closed by a jagged
    // snow-line edge so the cap follows the silhouette exactly.
    ctx.fillStyle = SNOW;
    var inRun = false;
    for (var r = 0; r < f.pts.length; r++) {
      var ph = f.pts[r][1];
      if (ph > f.snowN) {
        if (!inRun) { ctx.beginPath(); ctx.moveTo(ox + f.pts[r][0] * W, Y(ph)); inRun = true; }
        else ctx.lineTo(ox + f.pts[r][0] * W, Y(ph));
      } else if (inRun) {
        // close the run back along the snow line with a seeded jagged edge
        for (var b = r - 1; b >= 0 && f.pts[b][1] > f.snowN; b--) {
          var jx = f.pts[b][0];
          ctx.lineTo(ox + jx * W, Y(f.snowN + sampleKnots(f.snowEdge, jx)));
        }
        ctx.closePath(); ctx.fill(); inRun = false;
      }
    }
    if (inRun) {
      for (var b2 = f.pts.length - 1; b2 >= 0 && f.pts[b2][1] > f.snowN; b2--) {
        var jx2 = f.pts[b2][0];
        ctx.lineTo(ox + jx2 * W, Y(f.snowN + sampleKnots(f.snowEdge, jx2)));
      }
      ctx.closePath(); ctx.fill();
    }
    // Accent, used sparingly.
    ctx.strokeStyle = f.accent;
    ctx.fillStyle = f.accent;
    if (f.use === 'crater' && f.craterX >= 0) {
      var ci = Math.round(f.craterX * (f.pts.length - 1));
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.ellipse(ox + f.craterX * W, Y(f.pts[ci][1]) + peakPx * 0.012, W * 0.012, peakPx * 0.011, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (f.use === 'glow') {
      // A faint strip on the rock just under the snow line, around the peak.
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 2;
      ctx.beginPath();
      var g0 = Math.max(0, f.peakX - 0.13), g1 = Math.min(1, f.peakX + 0.13), started = false;
      for (var g = 0; g < f.pts.length; g++) {
        var gx = f.pts[g][0];
        if (gx >= g0 && gx <= g1 && f.pts[g][1] > f.snowN) {
          var gy = Y(f.snowN + sampleKnots(f.snowEdge, gx) - 0.016);
          if (!started) { ctx.moveTo(ox + gx * W, gy); started = true; }
          else ctx.lineTo(ox + gx * W, gy);
        }
      }
      if (started) ctx.stroke();
      ctx.globalAlpha = 1;
    } else { // highlight: a short accent stroke tracing the peak's flank
      // on the bare rock just below the snow line.
      ctx.globalAlpha = 0.8;
      ctx.lineWidth = 2;
      ctx.beginPath();
      var pi = clamp(Math.round(f.peakX * (f.pts.length - 1)), 0, f.pts.length - 1);
      var dir = f.peakX < 0.5 ? 1 : -1;
      var hs = false, drawn = 0;
      for (var st = pi + dir; st >= 0 && st < f.pts.length && drawn < 60; st += dir) {
        var sh2 = f.pts[st][1];
        if (sh2 < f.snowN - 0.015 && sh2 > f.snowN - 0.30) {
          var sy = Y(sh2) + 3;
          if (!hs) { ctx.moveTo(ox + f.pts[st][0] * W, sy); hs = true; }
          else ctx.lineTo(ox + f.pts[st][0] * W, sy);
          drawn++;
        } else if (hs && sh2 <= f.snowN - 0.30) break;
      }
      if (hs) ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // Micro-motion channels.
    for (var c = 0; c < f.channels.length; c++) {
      var ch = f.channels[c];
      if (ch === 'shimmer') {
        ctx.fillStyle = SNOW;
        for (var s2 = 0; s2 < f.sparkles.length; s2++) {
          var sp = f.sparkles[s2];
          var a = Math.pow(Math.max(0, Math.sin(t * sp.sp + sp.ph)), 3);
          if (a > 0.04) {
            ctx.globalAlpha = a;
            ctx.fillRect(ox + sp.x * W - 1, Y(sp.h) - 1, 2, 2);
          }
        }
        ctx.globalAlpha = 1;
      } else if (ch === 'condor') {
        var local = (t + f.condorOff) % 40;
        if (local > 6 && local < 16) {
          var q = (local - 6) / 10;
          var cx = ox + (-0.08 + q * 1.16) * W;
          var cy = H * (0.20 - 0.04 * Math.sin(q * Math.PI));
          drawCondor(cx, cy, Math.min(W, H) * 0.055, f.tone === TONES[2] ? TONES[0] : f.tone);
        }
      } else if (ch === 'wind') {
        ctx.strokeStyle = SNOW;
        ctx.lineWidth = 1;
        for (var wd = 0; wd < f.winds.length; wd++) {
          var wn = f.winds[wd];
          var wx = ((t * wn.sp + wn.ph) % 1.3) - 0.15;
          var wi = clamp(Math.round(f.peakX * (f.pts.length - 1)), 0, f.pts.length - 1);
          var wy = Y(f.pts[wi][1]) - wn.dy * H;
          ctx.globalAlpha = 0.22;
          ctx.beginPath();
          ctx.moveTo(ox + wx * W, wy);
          ctx.quadraticCurveTo(ox + (wx + wn.len / 2) * W, wy - H * 0.006, ox + (wx + wn.len) * W, wy);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawTab(f, ox) {
    var tw = isPhone ? 54 : 68, th = isPhone ? 26 : 32;
    var tx = ox + W / 2 - tw / 2;
    ctx.fillStyle = TONES[2];
    ctx.fillRect(tx, 0, tw, th);
    ctx.strokeStyle = SNOW;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var i = 0; i < f.ticks; i++) {
      var lx = tx + tw * (i + 1) / (f.ticks + 1);
      ctx.moveTo(lx, th * 0.30);
      ctx.lineTo(lx, th * 0.72);
    }
    ctx.stroke();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // Settle animation progress, from the anchored clock.
    if (anim) {
      var p = clamp((t - anim.start) / anim.dur, 0, 1);
      slidePx = lerp(anim.from, anim.to, easeOut(p));
      if (p >= 1) {
        if (anim.dir !== 0) index = (index + anim.dir + N_FOLIOS) % N_FOLIOS;
        slidePx = 0;
        anim = null;
      }
    }
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var cur = folios[index];
    drawFolio(cur, slidePx, t);
    if (slidePx < -0.5) {
      drawFolio(folios[(index + 1) % N_FOLIOS], slidePx + W, t);
    } else if (slidePx > 0.5) {
      drawFolio(folios[(index - 1 + N_FOLIOS) % N_FOLIOS], slidePx - W, t);
    }
    // The tab parallaxes at a third of the slide speed.
    drawTab(cur, slidePx * 0.35);
    if (slidePx < -0.5) drawTab(folios[(index + 1) % N_FOLIOS], (slidePx + W) * 0.35);
    else if (slidePx > 0.5) drawTab(folios[(index - 1 + N_FOLIOS) % N_FOLIOS], (slidePx - W) * 0.35);
  }

  // ---- Clock: anchored elapsed seconds from rAF timestamps ----------------
  var t0 = null, elapsed = 0;
  function frame(ts) {
    if (t0 === null) t0 = ts;
    elapsed = (ts - t0) / 1000;
    draw(elapsed);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  // ---- Pointer: drag to turn the folio, double-tap to reseed -------------
  function evX(e) { return (typeof e.clientX === 'number') ? e.clientX : 0; }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragStartX = evX(e);
    dragStartT = elapsed;
    anim = null;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    slidePx = clamp(evX(e) - dragStartX, -W * 0.98, W * 0.98);
    draw(elapsed);
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!dragging) return;
    dragging = false;
    var dx = evX(e) - dragStartX;
    if (Math.abs(dx) < 10 && elapsed - dragStartT < 0.4) {
      // A tap: two within 0.35 s reseeds the whole sequence.
      if (elapsed - lastTapT < 0.35 && Math.abs(evX(e) - lastTapX) < 30) {
        genSeed = genSeed * 31 + 7;
        buildFolios();
        index = 0; slidePx = 0; anim = null;
        lastTapT = -10;
        draw(elapsed);
        return;
      }
      lastTapT = elapsed; lastTapX = evX(e);
      slidePx = 0;
      draw(elapsed);
      return;
    }
    if (slidePx < -70) startSettle(-W, 1, elapsed);
    else if (slidePx > 70) startSettle(W, -1, elapsed);
    else startSettle(0, 0, elapsed);
  });

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(elapsed); });
  }
  window.addEventListener('resize', function () { resize(); draw(elapsed); });

  buildFolios();
  resize();
  draw(0); // frame one: folio 1, the twin-eared volcano, synchronous
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
