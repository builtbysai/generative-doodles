<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№647 The Room's Own Light</title>
<style>
  html, body { margin: 0; padding: 0; background: #241608; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1988 The Room's Own Light, MC5 / PP1235, study #259 mateo-villanueva-brandt.
  // Four figures in a church hall under warm tungsten practicals: hymn-number
  // board, stained glass glow, wood. Group blocking held in the real room, no
  // stylization, no effects. Wide shot, figures across the middle band, hall
  // depth behind. The figures shift weight almost imperceptibly, dust drifts
  // in the light, the room breathes but nothing happens. Watch-only: this
  // register is restraint, and restraint cannot be prodded.
  var GROUND = '#241608'; // page ground, deep wood brown

  // Fixed-phase first frame: FIRST_T = 31 s. The cycle is 240 s: the tungsten
  // glow breathes on a slow cosine. At t = 31 every figure sits mid-shift
  // (sway sines about 0.6, -0.7, 0.4, -0.5), so the first frame shows the
  // group caught between one weight and the next, dust already in the light.
  var FIRST_T = 31;
  var CYCLE = 240;
  var SEED = 1988;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x) {
    var i = Math.floor(x), f = x - i;
    var u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }
  function fbm(x) {
    return vnoise(x) * 0.55 + vnoise(x * 2.13 + 7.7) * 0.30 + vnoise(x * 4.31 + 3.1) * 0.15;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function mix(a, b, f) {
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palettes: tungsten amber, deep wood brown, stained-glass jewels.
  var WOOD_DARK = [46, 28, 16];
  var WOOD = [74, 48, 28];
  var WOOD_MID = [96, 62, 36];
  var WOOD_LIGHT = [132, 86, 48];
  var FLOOR_DARK = [52, 32, 18];
  var FLOOR = [84, 54, 30];
  var FLOOR_LIGHT = [120, 78, 44];
  var AMBER = [255, 176, 84];
  var AMBER_DEEP = [214, 132, 48];
  var BULB = [255, 214, 150];
  var FIGURE = [34, 22, 14];
  var FIGURE_SOFT = [48, 32, 20];
  var CREAM = [250, 232, 200];
  var JEWELS = [
    [176, 38, 52],   // ruby
    [52, 84, 176],   // sapphire
    [46, 128, 84],   // emerald
    [216, 160, 48],  // gold
    [140, 52, 140]   // violet
  ];

  // Seeded jewel assignment per window pane, fixed for the piece.
  var paneRng = mulberry32(SEED * 7 + 3);
  var PANE_COLS = 3, PANE_ROWS = 5;
  var paneColors = [];
  (function () {
    var w, r;
    for (w = 0; w < 3; w++) {
      paneColors[w] = [];
      for (r = 0; r < PANE_ROWS; r++) {
        paneColors[w][r] = JEWELS[Math.floor(paneRng() * JEWELS.length)];
      }
    }
  })();

  // Figures: x fraction, height fraction, sway period, phase (chosen so
  // every figure is mid-shift at FIRST_T = 31), rim side facing the
  // nearest tungsten lamp (-1 left, +1 right).
  var FIGURES = [
    { x: 0.22, h: 0.185, period: 8.5, phase: 2.859, rim: -1 },
    { x: 0.40, h: 0.205, period: 10.0, phase: 3.312, rim: -1 },
    { x: 0.58, h: 0.175, period: 9.2, phase: 0.408, rim: 1 },
    { x: 0.76, h: 0.195, period: 11.0, phase: 4.806, rim: 1 }
  ];

  // Lamps: x fraction, shade y fraction.
  var LAMPS = [
    { x: 0.15, shadeY: 0.155 },
    { x: 0.85, shadeY: 0.155 }
  ];

  // Windows: x centre fraction, width fraction, top/bottom fractions.
  var WINDOWS = [
    { cx: 0.31, w: 0.125, top: 0.075, bot: 0.50 },
    { cx: 0.50, w: 0.125, top: 0.075, bot: 0.50 },
    { cx: 0.69, w: 0.125, top: 0.075, bot: 0.50 }
  ];

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.wallBot = H * 0.60;          // wall meets floor
    L.railY = H * 0.545;           // wainscot rail
    L.vpX = W * 0.5;               // vanishing point
    L.vpY = L.wallBot;
    L.boardX = W * 0.815;          // hymn-number board
    L.boardY = H * 0.345;
    L.boardW = W * 0.135;
    L.boardH = H * 0.165;
    L.feetY = H * 0.715;           // figures stand here
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Cycle -----------------------------------------------------
  // breathe 0.94..1.00, a slow cosine over CYCLE, so the tungsten
  // light swells and settles over four minutes. flicker is a
  // small sum of sines at 0.6 Hz and 1.7 Hz, far below 14 Hz.
  function cycleState(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    var breathe = 0.97 + 0.03 * Math.sin(2 * Math.PI * p / CYCLE + 0.5);
    var flicker = 1 + 0.025 * Math.sin(2 * Math.PI * 0.6 * t) +
      0.015 * Math.sin(2 * Math.PI * 1.7 * t + 1.0);
    return { breathe: breathe, flicker: flicker, glow: breathe * flicker };
  }

  function swayOf(fig, t) {
    return Math.sin(2 * Math.PI * t / fig.period + fig.phase);
  }

  // ---- Wall ------------------------------------------------------
  function drawWall(t, glow) {
    var g = ctx.createLinearGradient(0, 0, 0, L.wallBot);
    g.addColorStop(0, rgb(mix(WOOD_DARK, WOOD, 0.25)));
    g.addColorStop(0.6, rgb(WOOD));
    g.addColorStop(1, rgb(mix(WOOD, WOOD_DARK, 0.35)));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, L.wallBot + 1);

    // Ceiling shadow band across the top.
    ctx.fillStyle = rgba(WOOD_DARK, a4(0.55));
    ctx.fillRect(0, 0, W, H * 0.045);
    ctx.fillStyle = rgba(WOOD_LIGHT, a4(0.25));
    ctx.fillRect(0, H * 0.045, W, Math.max(1, H * 0.004));

    // Vertical wood panel seams, faint.
    var i, sx;
    ctx.strokeStyle = rgba(WOOD_DARK, a4(0.35));
    ctx.lineWidth = Math.max(1, W * 0.0012);
    for (i = 1; i < 13; i++) {
      sx = (i / 13) * W;
      ctx.beginPath();
      ctx.moveTo(sx, H * 0.05);
      ctx.lineTo(sx, L.railY);
      ctx.stroke();
    }

    // Wainscot rail.
    ctx.fillStyle = rgb(WOOD_MID);
    ctx.fillRect(0, L.railY, W, H * 0.018);
    ctx.fillStyle = rgba(WOOD_LIGHT, a4(0.35));
    ctx.fillRect(0, L.railY, W, Math.max(1, H * 0.003));
    ctx.fillStyle = rgba(WOOD_DARK, a4(0.4));
    ctx.fillRect(0, L.railY + H * 0.018, W, Math.max(1, H * 0.004));

    // Warm tungsten wash on the wall, stronger near the lamps.
    var li;
    for (li = 0; li < LAMPS.length; li++) {
      var lx = LAMPS[li].x * W, ly = LAMPS[li].shadeY * H;
      var wr = W * 0.30;
      var wg = ctx.createRadialGradient(lx, ly, 0, lx, ly, wr);
      wg.addColorStop(0, rgba(AMBER, a4(0.10 * glow)));
      wg.addColorStop(1, rgba(AMBER, 0));
      ctx.fillStyle = wg;
      ctx.fillRect(lx - wr, ly - wr, wr * 2, wr * 2);
    }
  }

  // ---- Stained glass windows -------------------------------------
  function windowPath(win) {
    var x0 = (win.cx - win.w / 2) * W, x1 = (win.cx + win.w / 2) * W;
    var top = win.top * H, bot = win.bot * H;
    var r = (x1 - x0) / 2;
    var spring = top + r;
    ctx.beginPath();
    ctx.moveTo(x0, bot);
    ctx.lineTo(x0, spring);
    ctx.arc((x0 + x1) / 2, spring, r, Math.PI, 0);
    ctx.lineTo(x1, bot);
    ctx.closePath();
  }

  function drawWindows(t, glow) {
    var wi, r, c, px, py, pw, ph;
    for (wi = 0; wi < WINDOWS.length; wi++) {
      var win = WINDOWS[wi];
      var x0 = (win.cx - win.w / 2) * W, x1 = (win.cx + win.w / 2) * W;
      var top = win.top * H, bot = win.bot * H;
      var ww = x1 - x0, wh = bot - top;

      // Soft jewel glow spilling onto the wall around the window.
      var gx = win.cx * W, gy = (top + bot) / 2;
      var gr = ww * 1.15;
      var gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      gg.addColorStop(0, rgba(paneColors[wi][2], a4(0.16 * glow)));
      gg.addColorStop(1, rgba(paneColors[wi][2], 0));
      ctx.fillStyle = gg;
      ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);

      // Frame.
      ctx.fillStyle = rgb(WOOD_DARK);
      windowPath(win);
      ctx.fill();

      // Panes, clipped to the arched window shape.
      ctx.save();
      windowPath(win);
      ctx.clip();
      pw = ww / PANE_COLS;
      ph = wh / PANE_ROWS;
      for (c = 0; c < PANE_COLS; c++) {
        for (r = 0; r < PANE_ROWS; r++) {
          var col = paneColors[wi][r];
          // Panes glow a little brighter near the lamps' warmth.
          ctx.fillStyle = rgb(mix(col, AMBER, 0.12 * glow));
          ctx.fillRect(x0 + c * pw + 1, top + r * ph + 1, pw - 2, ph - 2);
        }
      }
      // Mullions.
      ctx.fillStyle = rgb(WOOD_DARK);
      for (c = 1; c < PANE_COLS; c++) {
        ctx.fillRect(x0 + c * pw - W * 0.003, top, W * 0.006, wh);
      }
      for (r = 1; r < PANE_ROWS; r++) {
        ctx.fillRect(x0, top + r * ph - H * 0.002, ww, H * 0.004);
      }
      // Arch fan: a small rose of jewel wedges tucked up inside
      // the arched top, clear of the horizontal mullion below.
      var roseR = ww * 0.17;
      var cx = (x0 + x1) / 2, cy = top + ww * 0.30;
      for (var k = 0; k < 6; k++) {
        ctx.fillStyle = rgb(JEWELS[(wi + k) % JEWELS.length]);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, roseR, Math.PI + k * Math.PI / 6, Math.PI + (k + 1) * Math.PI / 6);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Sill.
      ctx.fillStyle = rgb(WOOD_MID);
      ctx.fillRect(x0 - W * 0.008, bot, ww + W * 0.016, H * 0.012);

      // Coloured light shaft from the window down to the floor.
      var shaftTop = bot;
      var shaftBot = L.wallBot + H * 0.10;
      var spread = ww * 0.55;
      ctx.fillStyle = rgba(paneColors[wi][1], a4(0.05 * glow));
      ctx.beginPath();
      ctx.moveTo(x0 + ww * 0.1, shaftTop);
      ctx.lineTo(x1 - ww * 0.1, shaftTop);
      ctx.lineTo(x1 + spread, shaftBot);
      ctx.lineTo(x0 - spread, shaftBot);
      ctx.closePath();
      ctx.fill();
    }
  }

  // ---- Hymn-number board -----------------------------------------
  function drawBoard() {
    var bx = L.boardX, by = L.boardY, bw = L.boardW, bh = L.boardH;
    // Frame and dark panel.
    ctx.fillStyle = rgb(WOOD_MID);
    ctx.fillRect(bx - W * 0.006, by - H * 0.008, bw + W * 0.012, bh + H * 0.016);
    ctx.fillStyle = rgb([26, 16, 10]);
    ctx.fillRect(bx, by, bw, bh);
    // Title and three hymn numbers, cream on dark.
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CREAM, a4(0.85));
    var fsTitle = Math.round(clamp(W * 0.013, 9, 13));
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('H Y M N S', bx + bw / 2, by + bh * 0.20);
    ctx.fillStyle = rgba(CREAM, a4(0.55));
    ctx.fillRect(bx + bw * 0.12, by + bh * 0.26, bw * 0.76, Math.max(1, H * 0.002));
    var fsNum = Math.round(clamp(W * 0.026, 14, 24));
    ctx.font = '600 ' + fsNum + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = rgba(CREAM, a4(0.92));
    var hymns = ['312', '458', '207'];
    var i;
    for (i = 0; i < 3; i++) {
      ctx.fillText(hymns[i], bx + bw / 2, by + bh * (0.46 + i * 0.20));
    }
    ctx.textAlign = 'left';
  }

  // ---- Floor -----------------------------------------------------
  function drawFloor(t, glow) {
    var g = ctx.createLinearGradient(0, L.wallBot, 0, H);
    g.addColorStop(0, rgb(FLOOR_DARK));
    g.addColorStop(0.5, rgb(FLOOR));
    g.addColorStop(1, rgb(FLOOR_LIGHT));
    ctx.fillStyle = g;
    ctx.fillRect(0, L.wallBot, W, H - L.wallBot);

    // Plank seams converging on the vanishing point.
    var i, bx;
    ctx.strokeStyle = rgba(WOOD_DARK, a4(0.45));
    ctx.lineWidth = Math.max(1, W * 0.001);
    for (i = -6; i <= 6; i++) {
      bx = L.vpX + i * W * 0.14;
      ctx.beginPath();
      ctx.moveTo(L.vpX + i * W * 0.012, L.vpY);
      ctx.lineTo(bx, H);
      ctx.stroke();
    }
    // Cross seams, spacing widening toward the viewer.
    var fy = L.wallBot, step = H * 0.018;
    ctx.strokeStyle = rgba(WOOD_DARK, a4(0.30));
    while (fy < H) {
      ctx.beginPath();
      ctx.moveTo(0, fy);
      ctx.lineTo(W, fy);
      ctx.stroke();
      fy += step;
      step *= 1.45;
    }

    // Warm pools of tungsten light on the floor, under the lamps.
    var li;
    for (li = 0; li < LAMPS.length; li++) {
      var lx = LAMPS[li].x * W;
      var py = H * 0.86, prx = W * 0.13, pry = H * 0.05;
      var pg = ctx.createRadialGradient(lx, py, 0, lx, py, prx);
      pg.addColorStop(0, rgba(AMBER, a4(0.16 * glow)));
      pg.addColorStop(1, rgba(AMBER, 0));
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.moveTo(lx + prx, py);
      ctx.ellipse(lx, py, prx, pry, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Jewel-tinted pools under the windows, stretched toward the viewer.
    var wi;
    for (wi = 0; wi < WINDOWS.length; wi++) {
      var win = WINDOWS[wi];
      var wx = win.cx * W;
      var wy = H * 0.78, wrx = W * 0.075, wry = H * 0.045;
      var wg2 = ctx.createRadialGradient(wx, wy, 0, wx, wy, wrx);
      wg2.addColorStop(0, rgba(paneColors[wi][1], a4(0.13 * glow)));
      wg2.addColorStop(1, rgba(paneColors[wi][1], 0));
      ctx.fillStyle = wg2;
      ctx.beginPath();
      ctx.moveTo(wx + wrx, wy);
      ctx.ellipse(wx, wy, wrx, wry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Tungsten pendants -----------------------------------------
  function drawLamps(t, glow) {
    var li;
    for (li = 0; li < LAMPS.length; li++) {
      var lamp = LAMPS[li];
      var lx = lamp.x * W, sy = lamp.shadeY * H;
      var shadeW = W * 0.055, shadeH = H * 0.028;

      // Glow halo around the shade.
      var hr = W * 0.075;
      var hg = ctx.createRadialGradient(lx, sy, 0, lx, sy, hr);
      hg.addColorStop(0, rgba(AMBER, a4(0.34 * glow)));
      hg.addColorStop(1, rgba(AMBER, 0));
      ctx.fillStyle = hg;
      ctx.fillRect(lx - hr, sy - hr, hr * 2, hr * 2);

      // Cord.
      ctx.strokeStyle = rgb(WOOD_DARK);
      ctx.lineWidth = Math.max(1, W * 0.002);
      ctx.beginPath();
      ctx.moveTo(lx, 0);
      ctx.lineTo(lx, sy - shadeH / 2);
      ctx.stroke();

      // Shade: a dark cone, warm underneath.
      ctx.fillStyle = rgb([30, 20, 12]);
      ctx.beginPath();
      ctx.moveTo(lx - shadeW * 0.28, sy - shadeH / 2);
      ctx.lineTo(lx + shadeW * 0.28, sy - shadeH / 2);
      ctx.lineTo(lx + shadeW / 2, sy + shadeH / 2);
      ctx.lineTo(lx - shadeW / 2, sy + shadeH / 2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = rgba(BULB, a4(0.95 * glow));
      ctx.beginPath();
      ctx.moveTo(lx + shadeW * 0.16, sy + shadeH * 0.42);
      ctx.ellipse(lx, sy + shadeH * 0.42, shadeW * 0.16, shadeH * 0.14, 0, 0, Math.PI * 2);
      ctx.fill();

      // Light cone falling to the floor, faint and warm.
      ctx.fillStyle = rgba(AMBER, a4(0.045 * glow));
      ctx.beginPath();
      ctx.moveTo(lx - shadeW * 0.30, sy + shadeH / 2);
      ctx.lineTo(lx + shadeW * 0.30, sy + shadeH / 2);
      ctx.lineTo(lx + W * 0.11, H * 0.88);
      ctx.lineTo(lx - W * 0.11, H * 0.88);
      ctx.closePath();
      ctx.fill();
    }
  }

  // ---- Figures ---------------------------------------------------
  // Soft shapes, never detailed: a rounded head, a long body that
  // widens at the shoulders and narrows to the feet. The figure
  // sways almost imperceptibly, shifting weight from one foot to
  // the other. A faint warm rim catches the side facing the
  // nearest tungsten lamp.
  function drawFigure(fig, t, glow) {
    var fx = fig.x * W + swayOf(fig, t) * W * 0.0022;
    var fy = L.feetY;
    var h = fig.h * H;
    var lean = 0.005 * swayOf(fig, t);
    var hw = h * 0.155; // half width at shoulders
    var headR = h * 0.085;

    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(lean);

    // Soft ground shadow.
    ctx.fillStyle = rgba([16, 10, 6], a4(0.45));
    ctx.beginPath();
    ctx.moveTo(hw * 1.15, -h * 0.005);
    ctx.ellipse(0, -h * 0.005, hw * 1.15, h * 0.02, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body: one filled path, shoulders to feet.
    ctx.fillStyle = rgb(FIGURE);
    ctx.beginPath();
    ctx.moveTo(-hw * 0.62, 0);                                   // left foot
    ctx.quadraticCurveTo(-hw * 0.95, -h * 0.42, -hw * 0.98, -h * 0.62); // left side up
    ctx.quadraticCurveTo(-hw * 1.0, -h * 0.80, -hw * 0.55, -h * 0.84);  // left shoulder
    ctx.quadraticCurveTo(0, -h * 0.88, hw * 0.55, -h * 0.84);           // across shoulders
    ctx.quadraticCurveTo(hw * 1.0, -h * 0.80, hw * 0.98, -h * 0.62);    // right shoulder
    ctx.quadraticCurveTo(hw * 0.95, -h * 0.42, hw * 0.62, 0);           // right side down
    ctx.closePath();
    ctx.fill();

    // Head: a soft dark circle, no face.
    ctx.fillStyle = rgb(FIGURE_SOFT);
    ctx.beginPath();
    ctx.moveTo(headR, -h * 0.88);
    ctx.arc(0, -h * 0.88, headR, 0, Math.PI * 2);
    ctx.fill();

    // Warm rim on the lamp-facing side.
    ctx.strokeStyle = rgba(AMBER, a4(0.30 * glow));
    ctx.lineWidth = Math.max(1, W * 0.0016);
    ctx.beginPath();
    if (fig.rim < 0) {
      ctx.moveTo(-hw * 0.55, -h * 0.84);
      ctx.quadraticCurveTo(-hw * 1.0, -h * 0.80, -hw * 0.98, -h * 0.62);
      ctx.quadraticCurveTo(-hw * 0.95, -h * 0.42, -hw * 0.62, -h * 0.02);
    } else {
      ctx.moveTo(hw * 0.55, -h * 0.84);
      ctx.quadraticCurveTo(hw * 1.0, -h * 0.80, hw * 0.98, -h * 0.62);
      ctx.quadraticCurveTo(hw * 0.95, -h * 0.42, hw * 0.62, -h * 0.02);
    }
    ctx.stroke();

    ctx.restore();
  }

  // ---- Dust ------------------------------------------------------
  // Motes drifting in the two tungsten cones and the middle
  // window shaft: slow noise drift, a slow fall that wraps,
  // alpha twinkling gently. Pure functions of t.
  function drawDust(t, glow) {
    var i;
    for (i = 0; i < 110; i++) {
      var shaft = i % 3;
      var sx, topY, botY, halfW;
      if (shaft === 0) {
        sx = LAMPS[0].x * W; topY = H * 0.19; botY = H * 0.88; halfW = W * 0.10;
      } else if (shaft === 1) {
        sx = LAMPS[1].x * W; topY = H * 0.19; botY = H * 0.88; halfW = W * 0.10;
      } else {
        sx = WINDOWS[1].cx * W; topY = H * 0.50; botY = H * 0.82; halfW = W * 0.09;
      }
      var fall = (hash1(i * 3.3) * (botY - topY) + t * (2.5 + hash1(i * 7.1) * 4.0)) % (botY - topY);
      var my = topY + fall;
      var spreadFrac = clamp((my - topY) / (botY - topY), 0, 1);
      var drift = (fbm(i * 1.7 + t * 0.05) - 0.5) * 2 * halfW * (0.3 + spreadFrac);
      var mx = sx + (hash1(i * 5.9) - 0.5) * 2 * halfW * (0.3 + spreadFrac) + drift;
      var mr = Math.max(0.7, W * (0.0009 + hash1(i * 11.7) * 0.0016));
      var tw = 0.5 + 0.5 * Math.sin(t * 0.8 + i * 2.3);
      var ma = 0.10 + 0.30 * tw;
      ctx.fillStyle = rgba(BULB, a4(ma * glow));
      ctx.beginPath();
      ctx.moveTo(mx + mr, my);
      ctx.arc(mx, my, mr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Captions --------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var cs = cycleState(t);
    var glow = cs.glow;

    // Ground is deep wood brown; the stage is the whole image.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawWall(t, glow);
    drawWindows(t, glow);
    drawFloor(t, glow);
    drawBoard();
    drawLamps(t, glow);

    var fi;
    for (fi = 0; fi < FIGURES.length; fi++) {
      drawFigure(FIGURES[fi], t, glow);
    }
    drawDust(t, glow);

    // Caption, top left, and the hint, bottom center. Cream
    // stays readable over the dark wood.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CREAM, a4(0.88));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№647 · The Room\'s Own Light', W * 0.04, H * 0.055);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CREAM, a4(0.92));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the room breathe.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer listeners. The piece is watched,
  // never driven.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1988 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1988 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return cycleState(t); },
      glow: function (t) { return cycleState(t).glow; },
      sway: function (i, t) { return swayOf(FIGURES[i], t); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the room breathes. Figures shift weight on
  // slow sines, dust drifts in the light, the tungsten glow
  // breathes over 240 s and flickers gently. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
