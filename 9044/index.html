<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9044 · Smoke</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #e9e2d0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; cursor: pointer; }
  .cap {
    position: fixed; left: 18px; bottom: 14px; pointer-events: none;
    color: #6b6250; font: italic 12.5px/1.5 Georgia, serif; opacity: 0.85;
  }
  .cap b { color: #3d382c; font-weight: normal; font-style: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap"><b>№9044 · Smoke</b>, one breath, made visible. Click for another.</div>
<script>
'use strict';
/*
  Smoke: a single column rising from a point low on the sheet, drawn as
  stacked translucent curls that widen, drift, and dissolve as they climb.
  Monochrome ink wash on warm paper. Nothing else.
*/

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '555555', 10) || 555555;
let rand = mulberry32(seed);

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const U = 1000; // virtual units, viewport-invariant

function fit() {
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const s = Math.min(window.innerWidth, window.innerHeight) * 0.94;
  cv.width = s * DPR; cv.height = s * DPR;
  cv.style.width = s + 'px'; cv.style.height = s + 'px';
  ctx.setTransform(cv.width / U, 0, 0, cv.width / U, 0, 0);
}
window.addEventListener('resize', () => { fit(); draw(); });

// value noise for organic wobble
function makeNoise(r) {
  const p = new Array(256);
  for (let i = 0; i < 256; i++) p[i] = r();
  return function (x) {
    const xi = Math.floor(x), xf = x - xi;
    const a = p[xi & 255], b = p[(xi + 1) & 255];
    const u = xf * xf * (3 - 2 * xf);
    return a + (b - a) * u;
  };
}

function puff(x, y, size, alpha) {
  // one soft billow: two offset radial gradients so no hard circle reads
  const off = size * 0.22;
  const blobs = [
    [x - off, y + off * 0.5, size, alpha],
    [x + off, y - off * 0.6, size * 0.82, alpha * 0.62]
  ];
  for (const b of blobs) {
    const g = ctx.createRadialGradient(b[0], b[1], 0, b[0], b[1], b[2]);
    const ic = 'rgba(58,52,44,';
    g.addColorStop(0, ic + b[3].toFixed(4) + ')');
    g.addColorStop(0.55, ic + (b[3] * 0.42).toFixed(4) + ')');
    g.addColorStop(1, ic + '0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b[0], b[1], b[2], 0, 7);
    ctx.fill();
  }
}

function draw() {
  rand = mulberry32(seed);
  const noise = makeNoise(rand);
  const R = (a, b) => a + rand() * (b - a);

  // ---- paper ----
  const paper = ctx.createLinearGradient(0, 0, U, U);
  paper.addColorStop(0, '#f3eee1');
  paper.addColorStop(0.6, '#efe8d6');
  paper.addColorStop(1, '#e9e1cc');
  ctx.fillStyle = paper;
  ctx.fillRect(0, 0, U, U);

  // ---- smoke column ----
  const srcX = U / 2 + R(-70, 70);   // source point, low on the sheet
  const srcY = 800;
  const topY = 150;                  // dissolves well before the top margin
  const swayA = R(80, 140);          // S-curve amplitude, clearly legible
  const swayF = R(0.9, 1.4);         // S-curve frequency
  const swayP = R(0, 6.28);          // S-curve phase
  const billowP = R(0, 6.28);        // billow rhythm phase
  const seedOff = R(0, 100);

  const pathX = (y) => {
    const t = (srcY - y) / (srcY - topY); // 0 at source, 1 at top
    return srcX + Math.sin(t * Math.PI * swayF + swayP) * swayA * t;
  };

  // puffs, top (old, faint) first so the young dense smoke draws over.
  // spacing grows with puff size so the overlap ratio stays roughly
  // constant; alpha falls faster than area grows, or the top turns to mud.
  let y = topY + R(0, 6);
  while (y < srcY) {
    const age = (srcY - y) / (srcY - topY); // 1 at source, 0 at top
    const rise = 1 - age;
    const size = (26 + 100 * Math.pow(rise, 0.9)) * R(0.85, 1.15);
    let alpha = 0.17 * Math.pow(age, 2.8);
    alpha *= 0.65 + 0.55 * (0.5 + 0.5 * Math.sin(y * 0.045 + billowP)); // billow rhythm
    alpha *= R(0.8, 1.2);
    const wander = (noise(y * 0.012 + seedOff) - 0.5) * 80 * rise;
    const x = pathX(y) + wander + R(-8, 8);
    if (alpha > 0.004) puff(x, y, size, Math.min(0.2, alpha));
    y += 6 + size * 0.22 + rand() * 4;
  }

  // young core: darker, tighter, low down where the smoke is born
  const coreTop = srcY - 250;
  for (let cy = srcY; cy > coreTop; cy -= 5 + rand() * 4) {
    const k = (srcY - cy) / (srcY - coreTop); // 0 at source, 1 at core top
    const x = pathX(cy) + (noise(cy * 0.03 + seedOff + 40) - 0.5) * 26 + R(-5, 5);
    const size = R(13, 24) * (1 - k * 0.35);
    const alpha = 0.20 * (1 - k) * R(0.75, 1.15);
    const g = ctx.createRadialGradient(x, cy, 0, x, cy, size);
    const ic = 'rgba(52,46,38,';
    g.addColorStop(0, ic + alpha.toFixed(4) + ')');
    g.addColorStop(0.6, ic + (alpha * 0.4).toFixed(4) + ')');
    g.addColorStop(1, ic + '0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, cy, size, 0, 7);
    ctx.fill();
  }

  // faint ember of the source: a small dark breath mark where it begins
  {
    const g = ctx.createRadialGradient(srcX, srcY, 0, srcX, srcY, 26);
    g.addColorStop(0, 'rgba(52,46,38,0.30)');
    g.addColorStop(0.6, 'rgba(52,46,38,0.10)');
    g.addColorStop(1, 'rgba(52,46,38,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(srcX, srcY, 26, 0, 7);
    ctx.fill();
  }

  // ---- wobbly plate frame ----
  ctx.strokeStyle = 'rgba(70,62,50,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const fr = 64, fw = 40;
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (U - 2 * fr) * t + (noise(t * 9.1) - 0.5) * 5;
    const y = fr + (noise(t * 7.3 + 40) - 0.5) * 5;
    s2 ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr + (noise(t * 8.2 + 80) - 0.5) * 5;
    const y = fr + (U - 2 * fr) * t + (noise(t * 6.1 + 120) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr - (U - 2 * fr) * t + (noise(t * 7.7 + 160) - 0.5) * 5;
    const y = U - fr + (noise(t * 9.4 + 200) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (noise(t * 6.6 + 240) - 0.5) * 5;
    const y = U - fr - (U - 2 * fr) * t + (noise(t * 8.8 + 280) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();

  // ---- grain ----
  const gr = mulberry32(seed + 5);
  ctx.fillStyle = 'rgba(60,52,40,1)';
  for (let i = 0; i < 5200; i++) {
    ctx.globalAlpha = 0.025 + gr() * 0.06;
    const r = 0.6 + gr() * 1.6;
    ctx.beginPath();
    ctx.arc(gr() * U, gr() * U, r, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- vignette ----
  const v = ctx.createRadialGradient(U / 2, U / 2, U * 0.32, U / 2, U / 2, U * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(40,30,18,0.16)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, U, U);
}

cv.addEventListener('click', () => {
  const s = 1000 + Math.floor(Math.random() * 900000);
  location.search = '?seed=' + s;
});

fit();
draw();
</script>
</body>
</html>
