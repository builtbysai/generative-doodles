<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Codax</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F5F5F5; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // No.811 "Codax" (EXPANSION #99 jacob-kassay, block 4 "Codax").
  // The henry codax device: one painting, a fictitious author.
  // A single square panel of one saturated flat color (this painting
  // is the violet one) on a white ground. The color never changes.
  // Drag horizontally to scrub the HAND: the surface treatment
  // crossfades from Hand A (enamel-smooth, nearly clean) to Hand B
  // (cloudy oxidized: cloud-mottle in mixes of the same violet, with
  // amber-brown oxidation creeping the edges). The painting is the
  // same; the author is not. Small signature bottom-right, as specced:
  // "h. codax". Nothing else is said, anywhere.

  var VIOLET = "#7B4FD6";      // this painting's one color
  var GROUND = "#F5F5F5";      // the white ground

  // ---- color helpers: every tone below is a mix of the specced hexes ----
  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(a, b, t) {
    var A = hexRGB(a), B = hexRGB(b);
    return "rgb(" + Math.round(A[0] + (B[0] - A[0]) * t) + "," +
                    Math.round(A[1] + (B[1] - A[1]) * t) + "," +
                    Math.round(A[2] + (B[2] - A[2]) * t) + ")";
  }
  var WHITE = "#FFFFFF", BLACK = "#000000";
  // Hand B mottle: the violet mixed toward white / toward black.
  var MOTTLE_LIGHT = mix(VIOLET, WHITE, 0.38);
  var MOTTLE_PALE  = mix(VIOLET, WHITE, 0.20);
  var MOTTLE_DEEP  = mix(VIOLET, BLACK, 0.28);
  var MOTTLE_DARK  = mix(VIOLET, BLACK, 0.45);
  // Edge oxidation: borrowed from the study's tarnish family
  // (the Kassay silver pieces' #8A5A2A -> #4A2E12), at low presence.
  var STAIN_A = "#8A5A2A", STAIN_B = "#4A2E12";
  // Signature ink: the violet darkened toward black, quiet.
  var SIG_INK = mix(VIOLET, BLACK, 0.52);
  // Float shadow + panel hairline: neutral mixes off the ground.
  var SHADOW = mix(GROUND, BLACK, 0.55);
  var HAIRLINE = mix(GROUND, BLACK, 0.16);

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var mn = Math.min(sw || 1e9, sh || 1e9);
    if (mn < 700) return true;
    var s = viewSize();
    return s.h > s.w * 1.15;
  }

  function viewSize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    return { w: w, h: h };
  }

  function resize() {
    var s = viewSize();
    DPR = window.devicePixelRatio || 1;
    W = Math.round(s.w);
    H = Math.round(s.h);
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
  }

  // The panel: one square, generous margins, sized off the smaller
  // frame dimension (sibling convention for centered squares).
  function panelGeom() {
    var side = Math.min(W, H) * (isPhone() ? 0.84 : 0.78);
    return { x: (W - side) / 2, y: (H - side) / 2, side: side };
  }

  // ---- seeded RNG (mulberry32) ----
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Hand B surface data: seeded once, in panel-normalized coords ----
  // (0..1 across the panel), so the same surface survives any resize.
  // Cloud patches: a center, a tone, and a rosette of overlapping flat
  // discs (no gradients anywhere in this house). Edge stains: rosettes
  // hugging one edge, amber-brown, creeping irregularly inward.
  var patches = [], stains = [], specks = [];
  (function buildSurface() {
    var rnd = mulberry32(811004);
    var tones = [MOTTLE_LIGHT, MOTTLE_PALE, MOTTLE_DEEP, MOTTLE_DARK];
    var weights = [0.30, 0.30, 0.24, 0.16];
    for (var i = 0; i < 46; i++) {
      var tone = tones[0], r = rnd(), acc = 0;
      for (var k = 0; k < tones.length; k++) { acc += weights[k]; if (r <= acc) { tone = tones[k]; break; } }
      var discs = [], nd = 4 + Math.floor(rnd() * 4);
      for (var d = 0; d < nd; d++) {
        discs.push({
          dx: (rnd() - 0.5) * 0.11, dy: (rnd() - 0.5) * 0.11,
          rr: 0.028 + rnd() * 0.062, a: 0.05 + rnd() * 0.10
        });
      }
      patches.push({ x: 0.03 + rnd() * 0.94, y: 0.03 + rnd() * 0.94, tone: tone, discs: discs });
    }
    // Oxidation: denser at top, bottom and left edges (the study's
    // creep pattern), sparse at the right.
    var edges = ["top", "bottom", "left", "top", "bottom", "left", "right"];
    for (var s = 0; s < 64; s++) {
      var edge = edges[Math.floor(rnd() * edges.length)];
      var along = rnd(), inw = Math.pow(rnd(), 1.8) * 0.085;
      var px, py;
      if (edge === "top") { px = along; py = inw; }
      else if (edge === "bottom") { px = along; py = 1 - inw; }
      else if (edge === "left") { px = inw; py = along; }
      else { px = 1 - inw; py = along; }
      var sdiscs = [], ns = 3 + Math.floor(rnd() * 3);
      for (var q = 0; q < ns; q++) {
        sdiscs.push({
          dx: (rnd() - 0.5) * 0.05, dy: (rnd() - 0.5) * 0.05,
          rr: 0.010 + rnd() * 0.030, a: 0.06 + rnd() * 0.13
        });
      }
      stains.push({ x: px, y: py, deep: rnd() < 0.42, discs: sdiscs });
    }
    // Hand A's faintest life: a breath of micro-specks in the enamel,
    // visible at hand 0 only if you stand very close.
    for (var m = 0; m < 260; m++) {
      specks.push({
        x: rnd(), y: rnd(), r: 0.0012 + rnd() * 0.0028,
        light: rnd() < 0.5, a: 0.02 + rnd() * 0.035
      });
    }
  })();

  // ---- interaction state: recorded samples, closed-form hand ----
  // events: list of {t, hand}. The hand at time t is the value of the
  // last sample at or before t (0 before any touch): a pure function
  // of the recorded list, held exactly where a drag leaves it.
  var events = [];
  var dragging = false, dragStartX = 0, dragStartHand = 0;

  function nowSec() {
    if (typeof performance !== "undefined" && performance.now) {
      return performance.now() / 1000;
    }
    return Date.now() / 1000;
  }
  var startT = nowSec();

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  function handAt(t) {
    var h = 0;
    for (var i = 0; i < events.length; i++) {
      if (events[i].t > t) break;
      h = events[i].hand;
    }
    return h;
  }

  function pointerX(e) {
    if (e.clientX !== undefined) return e.clientX;
    if (e.touches && e.touches.length) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
    return 0;
  }

  function onDown(e) {
    var t = nowSec() - startT;
    dragging = true;
    dragStartX = pointerX(e);
    dragStartHand = handAt(t);
    events.push({ t: t, hand: dragStartHand });
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var g = panelGeom();
    // A scrub across ~70% of the panel spans the whole hand range.
    var hand = clamp01(dragStartHand + (pointerX(e) - dragStartX) / (g.side * 0.7));
    events.push({ t: nowSec() - startT, hand: hand });
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() { dragging = false; }

  if (canvas.addEventListener) {
    canvas.addEventListener("pointerdown", onDown);
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
    canvas.addEventListener("touchstart", onDown, { passive: false });
    canvas.addEventListener("touchmove", onMove, { passive: false });
    canvas.addEventListener("touchend", onUp);
    canvas.addEventListener("mousedown", onDown);
    canvas.addEventListener("mousemove", onMove);
    canvas.addEventListener("mouseup", onUp);
  }

  function draw(t) {
    if (W === 0) resize();
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // Ground: the white the painting hangs on.
    ctx.globalAlpha = 1;
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var g = panelGeom();
    var hand = handAt(t);

    // Slight float shadow: layered flat offsets, no blur in this house.
    ctx.fillStyle = SHADOW;
    for (var si = 3; si >= 1; si--) {
      ctx.globalAlpha = 0.05;
      ctx.fillRect(g.x + si * 2.2, g.y + si * 3.0, g.side, g.side);
    }

    ctx.save();
    ctx.beginPath();
    ctx.rect(g.x, g.y, g.side, g.side);
    ctx.clip();

    // The field: one flat color. It never changes; only its surface does.
    ctx.globalAlpha = 1;
    ctx.fillStyle = VIOLET;
    ctx.fillRect(g.x, g.y, g.side, g.side);

    // Hand A's faintest life (always present, barely).
    for (var m = 0; m < specks.length; m++) {
      var sp = specks[m];
      ctx.globalAlpha = sp.a;
      ctx.fillStyle = sp.light ? MOTTLE_LIGHT : MOTTLE_DARK;
      ctx.beginPath();
      ctx.arc(g.x + sp.x * g.side, g.y + sp.y * g.side, Math.max(0.6, sp.r * g.side), 0, Math.PI * 2);
      ctx.fill();
    }

    // Hand B, scaled by the hand parameter: the cloudy oxidized surface.
    if (hand > 0) {
      var i, d, p;
      for (i = 0; i < patches.length; i++) {
        p = patches[i];
        ctx.fillStyle = p.tone;
        for (d = 0; d < p.discs.length; d++) {
          var pd = p.discs[d];
          ctx.globalAlpha = pd.a * hand;
          ctx.beginPath();
          ctx.arc(g.x + (p.x + pd.dx) * g.side, g.y + (p.y + pd.dy) * g.side,
                  pd.rr * g.side, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      for (i = 0; i < stains.length; i++) {
        var st = stains[i];
        ctx.fillStyle = st.deep ? STAIN_B : STAIN_A;
        for (d = 0; d < st.discs.length; d++) {
          var sd = st.discs[d];
          ctx.globalAlpha = sd.a * hand;
          ctx.beginPath();
          ctx.arc(g.x + (st.x + sd.dx) * g.side, g.y + (st.y + sd.dy) * g.side,
                  sd.rr * g.side, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // The signature: the one name either way. Quiet, small, bottom-right,
    // drawn over whatever surface the hand has made.
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = SIG_INK;
    var fs = Math.max(10, g.side * 0.030);
    ctx.font = "italic 600 " + fs + "px 'Segoe Script', 'Brush Script MT', cursive";
    ctx.textAlign = "right";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("h. codax", g.x + g.side * 0.965, g.y + g.side * 0.965);

    ctx.restore();

    // Hairline edge so the panel reads as a panel on the white.
    ctx.globalAlpha = 1;
    ctx.strokeStyle = HAIRLINE;
    ctx.lineWidth = 1;
    ctx.strokeRect(g.x + 0.5, g.y + 0.5, g.side - 1, g.side - 1);
    ctx.globalAlpha = 1;
  }

  resize();
  draw(0);

  if (typeof requestAnimationFrame === "function") {
    var loop = function () {
      draw(nowSec() - startT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  function onResize() { resize(); draw(nowSec() - startT); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", onResize);
  }
  window.addEventListener("resize", onResize);
})();
</script>
</body>
</html>
