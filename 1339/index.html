<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>White on White</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #FAFAF7; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, isPhone = false;
  function size() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.max(1, Math.round(w)); H = Math.max(1, Math.round(h));
    var minDim = 99999;
    try {
      if (window.screen) minDim = Math.min(window.screen.width, window.screen.height);
    } catch (e) { minDim = 99999; }
    isPhone = (minDim < 700) || (H > W * 1.15);
    canvas.width = W; canvas.height = H;
  }
  size();
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  // Layout, rebuilt from seeds on every resize (deterministic).
  var doc = null, crowd = [], glyphs = [], rules = [];
  function buildLayout() {
    var rng = mulberry32(1339000);
    var mx = isPhone ? W * 0.08 : W * 0.15;
    var my = isPhone ? H * 0.07 : H * 0.10;
    doc = { x: mx, y: my, w: W - mx * 2, h: H - my * 2 };
    // Ghost document: heading block + ruled lines + paragraph glyph rows.
    rules = [];
    var ry = doc.y + doc.h * 0.16;
    var step = Math.max(14, doc.h * 0.035);
    while (ry < doc.y + doc.h * 0.94) { rules.push(ry); ry += step; }
    glyphs = [];
    // Heading block: two short glyph rows.
    for (var hr = 0; hr < 2; hr++) {
      var gx = doc.x + doc.w * 0.08, gy = doc.y + doc.h * (0.05 + hr * 0.045);
      while (gx < doc.x + doc.w * (hr === 0 ? 0.55 : 0.42)) {
        var gl = 6 + rng() * 22;
        glyphs.push({ x: gx, y: gy, w: gl, h: 2.5 });
        gx += gl + 5 + rng() * 7;
      }
    }
    // Paragraph blocks: rows of pseudo-type dashes between ruled lines.
    var py = doc.y + doc.h * 0.20;
    while (py < doc.y + doc.h * 0.92) {
      var px = doc.x + doc.w * 0.08;
      var rowEnd = doc.x + doc.w * (0.92 - (rng() < 0.25 ? 0.18 : 0));
      while (px < rowEnd) {
        var pl = 4 + rng() * 16;
        glyphs.push({ x: px, y: py, w: pl, h: 2 });
        px += pl + 4 + rng() * 6;
      }
      py += step;
    }
    // Crowd: procedurally drawn figures, registered to the same document rect.
    crowd = [];
    var crng = mulberry32(1339001);
    var rows = 4;
    for (var r = 0; r < rows; r++) {
      var baseY = doc.y + doc.h * (0.30 + r * 0.17) + (crng() - 0.5) * doc.h * 0.02;
      var n = 9 + Math.floor(crng() * 4);
      for (var i = 0; i < n; i++) {
        var fx = doc.x + doc.w * (0.05 + (i + 0.5) / n * 0.90) + (crng() - 0.5) * doc.w * 0.045;
        var fh = doc.h * (0.10 + crng() * 0.06) * (1 - r * 0.08);
        crowd.push({
          x: fx, y: baseY, h: fh, w: fh * (0.36 + crng() * 0.16),
          coat: (crng() < 0.5) ? '#0D0C0B' : '#26241F',
          arm: crng() < 0.5, topW: 0.28 + crng() * 0.14
        });
      }
    }
  }
  buildLayout();

  // Flash state: closed-form functions of piece time and recorded events.
  var holds = []; // {start, end} in seconds; end = null while held
  var startTime = 0, booted = false;
  function nowSec() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return Date.now() / 1000;
  }
  // Reveal radius fraction 0..1 at piece time t.
  function revealAt(t) {
    var level = 0;
    for (var i = 0; i < holds.length; i++) {
      var hs = holds[i].start, he = holds[i].end;
      if (t < hs) continue;
      if (he === null || t <= he) {
        // Growing during hold: 0 -> 1 over 1.2 s.
        var g = Math.min(1, (t - hs) / 1.2);
        level = Math.max(level, g * g * (3 - 2 * g));
      } else {
        // Decay after release over 3 s.
        var d = (t - he) / 3;
        if (d < 1) level = Math.max(level, 1 - d * d * (3 - 2 * d));
      }
    }
    return level;
  }
  // Document ink factor: full at t=0; a slow re-ink cycle every 48 s.
  function inkAt(t) {
    var c = t % 48;
    if (c < 32) return 1;
    if (c < 40) return 1 - (c - 32) / 8 * 0.65;
    return 0.35 + (c - 40) / 8 * 0.65;
  }

  function draw(t) {
    var cx = W / 2, cy = H / 2;
    var maxR = Math.sqrt(W * W + H * H) / 2 + 20;
    // Ground.
    ctx.fillStyle = '#FAFAF7';
    ctx.fillRect(0, 0, W, H);
    // Panel edge: a hairline frame, same size as the sheet.
    ctx.strokeStyle = '#E9E6DD';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, W - 1, H - 1);

    var ink = inkAt(t);
    // Ghost document: heading block, ruled lines, paragraph glyph noise.
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(doc.x + doc.w * 0.06, doc.y + doc.h * 0.03, doc.w * 0.5, doc.h * 0.09);
    ctx.strokeStyle = 'rgba(241,239,233,' + (0.9 * ink).toFixed(3) + ')';
    ctx.lineWidth = 1;
    for (var ri = 0; ri < rules.length; ri++) {
      ctx.beginPath();
      ctx.moveTo(doc.x + doc.w * 0.06, rules[ri]);
      ctx.lineTo(doc.x + doc.w * 0.94, rules[ri]);
      ctx.stroke();
    }
    ctx.fillStyle = '#F1EFE9';
    for (var gi = 0; gi < glyphs.length; gi++) {
      var g = glyphs[gi];
      ctx.globalAlpha = 0.55 + 0.45 * ink;
      ctx.fillRect(g.x, g.y, g.w, g.h);
    }
    ctx.globalAlpha = 1;

    // Revealed layer, center-out, clipped to the flash mask.
    var rev = revealAt(t);
    if (rev > 0.001) {
      var R = rev * maxR;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx + R, cy);
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.clip();
      // Inverted crowd: light ground, dark featureless figures.
      ctx.fillStyle = '#F5F3EC';
      ctx.fillRect(doc.x, doc.y, doc.w, doc.h);
      for (var ci = 0; ci < crowd.length; ci++) {
        var f = crowd[ci];
        ctx.fillStyle = f.coat;
        // Body: trapezoid torso with varied shoulder width.
        ctx.beginPath();
        ctx.moveTo(f.x - f.w * 0.5, f.y);
        ctx.lineTo(f.x - f.w * f.topW, f.y - f.h * 0.72);
        ctx.lineTo(f.x + f.w * f.topW, f.y - f.h * 0.72);
        ctx.lineTo(f.x + f.w * 0.5, f.y);
        ctx.closePath();
        ctx.fill();
        // Head: featureless dark disc, set slightly above the torso so a
        // neck gap reads — never merged into a hood shape.
        ctx.beginPath();
        ctx.moveTo(f.x + f.w * 0.18, f.y - f.h * 0.82);
        ctx.arc(f.x, f.y - f.h * 0.82, f.w * 0.18, 0, Math.PI * 2);
        ctx.fill();
        // Raised arm on some figures: a thick diagonal bar from the shoulder.
        if (f.arm) {
          ctx.save();
          ctx.translate(f.x + f.w * f.topW, f.y - f.h * 0.70);
          ctx.rotate(-0.5);
          ctx.fillRect(0, -f.h * 0.28, Math.max(3, f.w * 0.14), f.h * 0.30);
          ctx.restore();
        }
      }
      // One red accent: a sign/flag held high near the crowd's upper right.
      var sx = doc.x + doc.w * 0.72, sy = doc.y + doc.h * 0.28;
      ctx.fillStyle = '#A83A2E';
      ctx.fillRect(sx, sy, Math.max(2, doc.w * 0.004), doc.h * 0.16);
      ctx.fillRect(sx, sy, doc.w * 0.09, doc.h * 0.05);
      ctx.restore();
      // Ember edge glow: layered flat-alpha rings at the mask boundary.
      ctx.fillStyle = 'rgba(232,160,76,0.10)';
      ctx.beginPath();
      ctx.moveTo(cx + R + 14, cy);
      ctx.arc(cx, cy, R + 14, 0, Math.PI * 2);
      ctx.arc(cx, cy, R, 0, Math.PI * 2, true);
      ctx.fill();
      ctx.fillStyle = 'rgba(232,160,76,0.14)';
      ctx.beginPath();
      ctx.moveTo(cx + R + 5, cy);
      ctx.arc(cx, cy, R + 5, 0, Math.PI * 2);
      ctx.arc(cx, cy, R, 0, Math.PI * 2, true);
      ctx.fill();
      // Overexposure core while fully revealed.
      if (rev > 0.9) {
        ctx.fillStyle = 'rgba(255,253,245,' + ((rev - 0.9) * 1.5).toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(cx + 46, cy);
        ctx.arc(cx, cy, 46, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Flash icon: small pulsing bolt shape, bottom-right, shapes only.
    var pulse = 0.55 + 0.45 * Math.sin(t * 2.1);
    var ix = W - (isPhone ? 56 : 72), iy = H - (isPhone ? 56 : 72);
    ctx.fillStyle = 'rgba(210,208,198,' + (0.35 + 0.45 * pulse).toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(ix + 10, iy - 16);
    ctx.lineTo(ix - 2, iy + 6);
    ctx.lineTo(ix + 6, iy + 6);
    ctx.lineTo(ix - 6, iy + 20);
    ctx.lineTo(ix + 10, iy - 4);
    ctx.lineTo(ix + 2, iy - 4);
    ctx.closePath();
    ctx.fill();

    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function onResize() {
    size();
    buildLayout();
    draw(booted ? (nowSec() - startTime) : 0);
  }

  // Tap and hold = flash. Drag disabled: only a press with no travel counts.
  var downPos = null, downHold = null;
  canvas.addEventListener('pointerdown', function (e) {
    downPos = { x: e.clientX, y: e.clientY };
    downHold = { start: nowSec() - startTime, end: null };
    holds.push(downHold);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (downPos && downHold) {
      var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
      if (dx * dx + dy * dy > 144) {
        // Travel means drag: cancel this flash.
        var idx = holds.indexOf(downHold);
        if (idx >= 0) holds.splice(idx, 1);
        downHold = null;
      }
    }
  });
  function endHold() {
    if (downHold) { downHold.end = nowSec() - startTime; downHold = null; }
    downPos = null;
  }
  canvas.addEventListener('pointerup', endHold);
  canvas.addEventListener('pointercancel', endHold);

  // Frame one: synchronous, exactly t = 0, via boot flag.
  draw(0);
  booted = true;
  startTime = nowSec();
  if (typeof requestAnimationFrame !== 'undefined') {
    (function loop() {
      draw(nowSec() - startTime);
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
