<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.203 Artificial Spirit</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0A0A0C; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.203 Artificial Spirit (Asia Ward). A creature sewn together
// from discards: a torso of worn fabric swatches, one leather
// patched leg, glass bead eyes, and one arm that clearly belonged
// to a different toy, stitched on anyway. The seams are the
// feature and are never hidden. It lives by the four toy verbs,
// jiggle, shuffle, squeak, recoil, on a state machine that cycles
// them in shuffled order over about twenty seconds. A drag on the
// creature makes it recoil from the contact point; a gentle drag
// nearby coaxes it to shuffle closer.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0A0A0C';
var FAB_A = '#6B5B4E', FAB_B = '#4E556B', PINK = '#A86B7E';
var LEATHER = '#5C3A21', EYE = '#C8D4DE', CATCH = '#FFFFFF', THREAD = '#D8CFA8';
var W = 0, H = 0, phone = false;
var seed = 203203;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function smooth(a, b, x) { var k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); }
function easeIO(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }

// ---- behaviour engine ---------------------------------------------------------------
// A timeline of verb states, deterministic functions of state time so
// frame one can open mid-shuffle with the parts still catching up.
var VERBS = ['jiggle', 'shuffle', 'squeak', 'recoil'];
var DUR = { idle: 2.4, jiggle: 3, shuffle: 2.6, squeak: 2.1, recoil: 2.4 };
var timeline = [];
(function buildTimeline() {
  var t = 0, bag = [];
  function nextVerb() {
    if (bag.length === 0) {
      bag = VERBS.slice();
      for (var i = bag.length - 1; i > 0; i--) {
        var j = (rand() * (i + 1)) | 0;
        var tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
      }
    }
    return bag.pop();
  }
  // frame one opens mid-shuffle, so seed the timeline by hand
  timeline.push({ name: 'shuffle', t0: -1.7, data: { dir: 1, fromX: -18, toX: 4 } });
  t = -1.7 + DUR.shuffle;
  for (var n = 0; n < 60; n++) {
    timeline.push({ name: 'idle', t0: t, data: {} });
    t += DUR.idle;
    var v = nextVerb();
    var d = {};
    if (v === 'shuffle') d = { dir: rand() < 0.5 ? -1 : 1 };
    if (v === 'recoil') { var a = rand() * 6.2832; d = { dx: Math.cos(a), dy: Math.sin(a) * 0.5 }; }
    timeline.push({ name: v, t0: t, data: d });
    t += DUR[v];
  }
})();
var T = 0, lastNow = -1;
var override = null;   // interaction state: {name, t0, data}
function stateAt(time) {
  if (override) {
    if (time - override.t0 < DUR[override.name]) return override;
    override = null;
  }
  for (var i = timeline.length - 1; i >= 0; i--) {
    if (timeline[i].t0 <= time) return timeline[i];
  }
  return timeline[0];
}
// root position as a deterministic walk - shuffle steps accumulate
function rootAt(time) {
  var x = 0, st = stateAt(time);
  for (var i = 0; i < timeline.length; i++) {
    var e = timeline[i];
    if (e.name !== 'shuffle') continue;
    if (e === st) break;
    if (e.t0 + DUR.shuffle <= time) x += e.data.dir ? e.data.dir * 20 * unit() : 0;
  }
  return x;
}
function scaleS() { return Math.min(W * 0.62, H * 0.545); }
function unit() { return scaleS() / 110; }

// ---- parts ---------------------------------------------------------------------------
// Creature space: origin at the creature's seat, y down, one unit ~ body size.
function partsAt(time) {
  var st = stateAt(time), lt = time - st.t0;
  var u = unit();
  var rootX = 0, rootY = 0;
  if (st.name === 'shuffle') {
    var k = easeIO(clamp(lt / DUR.shuffle, 0, 1));
    var from = st.data.fromX !== undefined ? st.data.fromX : rootAt(st.t0);
    var to = st.data.toX !== undefined ? st.data.toX : from + (st.data.dir || 1) * 20 * u;
    rootX = from + (to - from) * k;
    rootY = -Math.sin(clamp(lt / DUR.shuffle, 0, 1) * 3.1416) * 3 * u;
  } else if (st.name === 'recoil') {
    var dx = st.data.dx || 0.9, dy = st.data.dy || 0;
    var mag = 40 * u * Math.exp(-lt * 1.4) * Math.cos(Math.min(lt * 2.2, 1.6));
    rootX = dx * mag; rootY = dy * mag * 0.6;
  } else if (st.name === 'idle' || st.name === 'jiggle' || st.name === 'squeak') {
    rootX = st.data.fromX || 0;
  }
  function partLag(f) {
    // during a shuffle each part trails the root by its own fraction
    if (st.name === 'shuffle') {
      var kk = easeIO(clamp((lt - f * 0.55) / DUR.shuffle, 0, 1));
      var from2 = st.data.fromX !== undefined ? st.data.fromX : rootAt(st.t0);
      var to2 = st.data.toX !== undefined ? st.data.toX : from2 + (st.data.dir || 1) * 20 * u;
      return { x: from2 + (to2 - from2) * kk, y: rootY * (1 - f * 0.4) };
    }
    return { x: rootX, y: rootY };
  }
  var jig = st.name === 'jiggle' ? 1 : 0;
  function joff(ph, amp) {
    return jig ? { x: Math.sin(time * 31 + ph) * amp * u, y: Math.cos(time * 37 + ph * 1.7) * amp * u } : { x: 0, y: 0 };
  }
  var breathe = Math.sin(time * 1.4) * 1.5 * u;
  return {
    st: st, lt: lt,
    torso: partLag(0.15), head: partLag(0.45), armL: partLag(0.7),
    armR: partLag(0.3), legL: partLag(0.05), legR: partLag(0.1),
    jigTorso: joff(0, 2.2), jigHead: joff(2.1, 3.4), jigArmL: joff(4.0, 4.2),
    jigArmR: joff(5.3, 3.0), breathe: breathe
  };
}

// ---- input -----------------------------------------------------------------------------
var dragging = false;
function geom() { return { cx: W / 2, cy: H * 0.53, s: scaleS() }; }
canvas.addEventListener('pointerdown', function (e) {
  dragging = true;
  var g = geom();
  var dx = e.clientX - g.cx, dy = e.clientY - g.cy;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d < g.s * 1.15) {
    var a = Math.atan2(dy, dx);
    override = { name: 'recoil', t0: T, data: { dx: -Math.cos(a), dy: -Math.sin(a) } };
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var g = geom();
  var dx = e.clientX - g.cx, dy = e.clientY - g.cy;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d >= g.s * 1.15 && d < g.s * 2.1) {
    // a gentle drag nearby: shuffle a step toward the hand
    override = { name: 'shuffle', t0: T, data: { dir: dx >= 0 ? 1 : -1, fromX: 0, toX: clamp(dx * 0.14, -26 * unit(), 26 * unit()) } };
    dragging = false;
  } else if (d < g.s * 1.15 && !override) {
    var a = Math.atan2(dy, dx);
    override = { name: 'recoil', t0: T, data: { dx: -Math.cos(a), dy: -Math.sin(a) } };
  }
});
canvas.addEventListener('pointerup', function () { dragging = false; });
canvas.addEventListener('pointercancel', function () { dragging = false; });

// ---- resize --------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing the creature -------------------------------------------------------------------
function poly(pts, fill, seam) {
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (seam) {
    ctx.strokeStyle = THREAD;
    ctx.lineWidth = Math.max(1, unit() * 1.1);
    ctx.setLineDash([unit() * 5, unit() * 3.4]);
    ctx.globalAlpha = 0.85;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }
}
function blob(cx, cy, r, wob, fill, seam) {
  var pts = [];
  for (var i = 0; i < 14; i++) {
    var a = i / 14 * 6.2832;
    var rr = r * (1 + Math.sin(a * 3 + cx * 0.01) * wob);
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.94]);
  }
  poly(pts, fill, seam);
}
function draw(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) {
    dt = Math.min(0.05, (time - lastNow) / 1000);
    T += dt;
  }
  lastNow = time;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var g = geom();
  var u = unit();
  var P = partsAt(T);
  var cx = g.cx, cy = g.cy, s = g.s;
  function X(p, ox, oy, jx, jy) { return [cx + p.x + (ox + jx) * u, cy + p.y + (oy + jy) * u + P.breathe * 0.3]; }
  // ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.ellipse(cx + P.torso.x, cy + s * 0.58, s * 0.52, s * 0.075, 0, 0, 6.2832);
  ctx.fill();
  // legs first: one plain worn fabric, one with the leather patch
  var lp = X(P.legL, -34, 44, 0, 0);
  blob(lp[0], lp[1], s * 0.16, 0.05, FAB_B, true);
  var rp = X(P.legR, 36, 46, 0, 0);
  blob(rp[0], rp[1], s * 0.155, 0.05, FAB_A, true);
  // the leather patch, stitched onto the right leg
  poly([
    [rp[0] - s * 0.07, rp[1] - s * 0.05], [rp[0] + s * 0.075, rp[1] - s * 0.045],
    [rp[0] + s * 0.065, rp[1] + s * 0.07], [rp[0] - s * 0.06, rp[1] + s * 0.065]
  ], LEATHER, true);
  // the other toy's arm (right): longer, thinner, pink print, wrong on purpose
  var ar = X(P.armR, 52, -6, P.jigArmR.x, P.jigArmR.y);
  ctx.strokeStyle = PINK;
  ctx.lineWidth = s * 0.085;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + P.armR.x + 30 * u, cy + P.armR.y - 26 * u);
  ctx.quadraticCurveTo(ar[0], ar[1] - s * 0.1, ar[0] + s * 0.1, ar[1] + s * 0.16);
  ctx.stroke();
  ctx.strokeStyle = THREAD; ctx.lineWidth = Math.max(1, u * 1.1);
  ctx.setLineDash([u * 5, u * 3.4]); ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.arc(cx + P.armR.x + 30 * u, cy + P.armR.y - 26 * u, s * 0.075, 0, 6.2832);
  ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  // torso: two worn swatches seamed down the middle
  var tp = X(P.torso, 0, 6, P.jigTorso.x, P.jigTorso.y);
  blob(tp[0], tp[1], s * 0.34, 0.045, FAB_A, true);
  ctx.save();
  ctx.beginPath();
  ctx.rect(tp[0], tp[1] - s * 0.36, s * 0.4, s * 0.72);
  ctx.clip();
  blob(tp[0], tp[1], s * 0.34, 0.045, FAB_B, false);
  ctx.restore();
  ctx.strokeStyle = THREAD; ctx.lineWidth = Math.max(1, u * 1.1);
  ctx.setLineDash([u * 5, u * 3.4]); ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.moveTo(tp[0], tp[1] - s * 0.3);
  ctx.lineTo(tp[0], tp[1] + s * 0.3);
  ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  // faded print patch on the chest
  poly([
    [tp[0] - s * 0.2, tp[1] - s * 0.05], [tp[0] - s * 0.03, tp[1] - s * 0.1],
    [tp[0] - s * 0.02, tp[1] + s * 0.08], [tp[0] - s * 0.19, tp[1] + s * 0.11]
  ], PINK, true);
  // left arm: plain fabric, matches nothing either, but closer
  var al = X(P.armL, -52, 0, P.jigArmL.x, P.jigArmL.y);
  ctx.strokeStyle = FAB_B;
  ctx.lineWidth = s * 0.11;
  ctx.beginPath();
  ctx.moveTo(cx + P.armL.x - 28 * u, cy + P.armL.y - 24 * u);
  ctx.quadraticCurveTo(al[0], al[1] - s * 0.06, al[0] - s * 0.04, al[1] + s * 0.2);
  ctx.stroke();
  // head
  var hp = X(P.head, 2, -52, P.jigHead.x, P.jigHead.y);
  blob(hp[0], hp[1], s * 0.235, 0.06, FAB_B, true);
  // a pink ear flap from yet another toy
  poly([
    [hp[0] + s * 0.13, hp[1] - s * 0.16], [hp[0] + s * 0.26, hp[1] - s * 0.2],
    [hp[0] + s * 0.22, hp[1] - s * 0.02], [hp[0] + s * 0.12, hp[1] - s * 0.03]
  ], PINK, true);
  // glass bead eyes
  var eyes = [[-0.075, -0.03], [0.085, -0.035]];
  for (var ei = 0; ei < 2; ei++) {
    var ex = hp[0] + eyes[ei][0] * s, ey = hp[1] + eyes[ei][1] * s;
    var eg = ctx.createRadialGradient(ex - s * 0.02, ey - s * 0.02, s * 0.004, ex, ey, s * 0.037);
    eg.addColorStop(0, CATCH);
    eg.addColorStop(0.35, EYE);
    eg.addColorStop(1, '#5A6A74');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(ex, ey, s * 0.037, 0, 6.2832); ctx.fill();
    ctx.fillStyle = CATCH;
    ctx.beginPath(); ctx.arc(ex - s * 0.014, ey - s * 0.016, s * 0.009, 0, 6.2832); ctx.fill();
  }
  // stitched mouth: a small dashed arc, sewn shut crooked
  ctx.strokeStyle = THREAD; ctx.lineWidth = Math.max(1, u * 1.1);
  ctx.setLineDash([u * 4, u * 3]); ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.arc(hp[0] + s * 0.01, hp[1] + s * 0.05, s * 0.07, 0.35, 2.6);
  ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  // squeak: rings burst from the mouth while the verb runs
  if (P.st.name === 'squeak') {
    for (var qi = 0; qi < 3; qi++) {
      var qk = (P.lt / DUR.squeak + qi / 3) % 1;
      ctx.strokeStyle = 'rgba(232,228,218,' + (0.34 * (1 - qk)).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, u * 1.4 * (1 - qk));
      ctx.beginPath();
      ctx.arc(hp[0] + s * 0.01, hp[1] + s * 0.08, (0.1 + qk * 0.85) * s, 0, 6.2832);
      ctx.stroke();
    }
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
