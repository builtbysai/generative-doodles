<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ways + Means (Pedal-Powered City)</title>
<style>
  html, body { margin: 0; padding: 0; background: #101010; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- No.1228 "Ways + Means (Pedal-Powered City)" -- Leslie Supnet study block LS5 ----
  // After her 2015 16mm Toronto goodbye letter: a hand-drawn city symphony in
  // ink on film. The projection speed is the viewer's body: drag horizontally
  // to pedal. Fast pedalling ghosts the city into multiple exposures and
  // pixellation bursts; slow down and single drawn frames hold, trembling.
  // Release and the film eases back to a trembling standstill. No landmarks,
  // no smooth camera moves -- the hand-drawn tremble is always on.

  var INK = '#E8E2D4';       // ink drawings
  var BASE = '#101010';      // 16mm film base
  var RED = '#B03030';       // streetcar red
  var YEL = '#D8A020';       // construction yellow
  var RAIN = '#4A6A8A';      // rain blue
  var WARM = '#C07830';      // Ektachrome warmth

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;          // viewport CSS px
  var LW = 1280, LH = 800;   // logical drawing space
  var U = 800;               // size unit = min(LW, LH)
  var SCALE = 1;             // device px per logical px

  function isPhone(w, h) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    return sw < 700 || h > w * 1.15;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---- deterministic integer hash -> [0,1) ----
  function ihash(n) {
    n = n | 0;
    n = Math.imul(n ^ (n >>> 16), 2246822507);
    n = Math.imul(n ^ (n >>> 13), 3266489909);
    n = n ^ (n >>> 16);
    return (n >>> 0) / 4294967296;
  }

  // ---- seeded rng (mulberry32), generation only ----
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ================= city strip generation (data, drawn per frame) =================
  // Each layer is a repeating sequence of ink drawings laid out in world px
  // over one period. Items carry their own seed so the ink boil can jitter
  // every stroke per step. Vertical sizes are in U units; the ground line of
  // each layer is a fraction of LH resolved at draw time.

  var layers = null;   // {clouds, far, mid, near} each {period, items[]}
  var genU = 0;

  function genClouds(r) {
    var items = [], x = 40;
    var period = 3.0 * U;
    while (x < period) {
      items.push({ kind: 'cloud', x: x, w: (0.22 + r() * 0.30) * U, yF: 0.07 + r() * 0.20, seed: (r() * 1e9) | 0 });
      x += (0.30 + r() * 0.35) * U;
    }
    items.push({ kind: 'sun', x: 2.35 * U, w: 0.16 * U, yF: 0.10, seed: 777 });
    return { period: period, items: items };
  }

  function genFar(r) {
    var items = [], x = 0;
    var period = 2.2 * U;
    while (x < period) {
      var w = (0.12 + r() * 0.12) * U;
      items.push({ kind: 'fbuild', x: x, w: w, h: (0.15 + r() * 0.16) * U, seed: (r() * 1e9) | 0, roof: (r() * 3) | 0 });
      x += w + (0.015 + r() * 0.05) * U;
    }
    return { period: period, items: items };
  }

  function genMid(r) {
    var items = [], x = 0;
    var period = 2.6 * U;
    // a crane is planted at a fixed world x so frame one can frame it
    items.push({ kind: 'crane', x: 1.02 * U, w: 0.42 * U, h: 0.52 * U, seed: 4242 });
    while (x < period) {
      var w = (0.14 + r() * 0.15) * U;
      if (Math.abs(x + w / 2 - 1.02 * U) > 0.30 * U) {
        var b = { kind: 'mbuild', x: x, w: w, h: (0.20 + r() * 0.22) * U, seed: (r() * 1e9) | 0, top: (r() * 3) | 0 };
        b.blocks = blocksFor(b);
        items.push(b);
      }
      x += w + (0.02 + r() * 0.06) * U;
    }
    return { period: period, items: items };
  }

  // coarse block silhouette of a mid building, for pixellation bursts:
  // one filled column per 0.02U of width, top jittered by the building seed.
  function blocksFor(b) {
    var cols = [], cw = 0.02 * U, n = Math.max(2, Math.round(b.w / cw));
    for (var i = 0; i < n; i++) {
      var f = 0.82 + ihash(b.seed + i * 31) * 0.18;
      if (b.top === 1 && i === (n >> 1)) f = 1.12;              // centre tower bump
      if (b.top === 2) f *= 0.9 + 0.2 * (i / (n - 1));          // sloped top
      cols.push({ dx: i * cw, w: cw + 1, h: b.h * f });
    }
    return cols;
  }

  function genNear(r) {
    var items = [], x = 0;
    var period = 3.2 * U;
    // the streetcar lives at a fixed world x so frame one can frame it
    items.push({ kind: 'streetcar', x: 1.72 * U, w: 0.27 * U, h: 0.115 * U, seed: 9001 });
    var kinds = ['shop', 'tree', 'lamp', 'person', 'bike', 'shop', 'tree', 'person', 'hydrant', 'bike', 'person', 'shop'];
    var ki = 0;
    while (x < period) {
      var kind = kinds[ki % kinds.length]; ki++;
      var w = kind === 'shop' ? (0.20 + r() * 0.10) * U : (0.05 + r() * 0.05) * U;
      if (Math.abs(x + w / 2 - 1.72 * U) > 0.24 * U) {
        items.push({ kind: kind, x: x, w: w, h: (0.10 + r() * 0.07) * U, seed: (r() * 1e9) | 0, v: (r() * 4) | 0 });
      }
      x += w + (0.03 + r() * 0.07) * U;
    }
    return { period: period, items: items };
  }

  function generate() {
    layers = {
      clouds: genClouds(rng(12281)),
      far: genFar(rng(12282)),
      mid: genMid(rng(12283)),
      near: genNear(rng(12284))
    };
    genU = U;
  }

  // ================= pedal state =================
  // D = distance travelled (logical px). Frame one is D = D0 at rest, a fixed
  // scenic offset chosen so the red streetcar and a yellow crane share it.
  var D0 = 1.04 * U;
  var D = D0;
  var v = 0;                    // logical px / s
  var dragging = false;
  var lastPX = 0, lastPT = 0, lastMoveT = -10;

  function nowSec() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return Date.now() / 1000;
  }

  // fixed-timestep simulation step: exponential coast-down after release
  function stepSim(h) {
    if (!dragging) {
      v *= Math.exp(-h / 2.5);
      if (Math.abs(v) < 0.6) v = 0;
    } else if (nowSec() - lastMoveT > 0.12) {
      v *= Math.exp(-h / 0.3);   // finger held still: the film stops
      if (Math.abs(v) < 0.6) v = 0;
    }
    D += v * h;
  }

  function onDown(e) {
    dragging = true;
    lastPX = e.clientX; lastPT = nowSec(); lastMoveT = lastPT;
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var t = nowSec();
    var dt = t - lastPT;
    if (dt > 0.001) {
      var vInst = ((e.clientX - lastPX) / SCALE) / dt;
      v = clamp(0.6 * v + 0.4 * vInst, -2800, 2800);
      lastPX = e.clientX; lastPT = t; lastMoveT = t;
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  // ================= ink helpers =================
  function line(x1, y1, x2, y2) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function rectO(x, y, w, h) { ctx.strokeRect(x, y, w, h); }
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke(); }
  // per-item ink boil: deterministic jitter from item seed + step index
  function jit(seed, step, amp) { return (ihash(seed + step * 7919) - 0.5) * 2 * amp; }

  // ================= item drawings (local: x = screen left, gy = ground y) =================
  function drawCloud(it, x, step) {
    var y = it.yF * LH + jit(it.seed, step, 0.004 * U);
    var w = it.w, h = w * 0.24, n = 5;
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.75; ctx.lineWidth = Math.max(1.2, 0.0022 * U);
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (var i = 0; i < n; i++) {
      var cx = x + (i + 0.5) * (w / n);
      var cr = h * (0.7 + ihash(it.seed + i * 13) * 0.6);
      ctx.arc(cx, y, cr, 3.35, 6.10);
    }
    ctx.lineTo(x + w, y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawSun(it, x, step) {
    var y = it.yF * LH, r = it.w * 0.32, cx = x + it.w / 2;
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.8; ctx.lineWidth = Math.max(1.2, 0.0022 * U);
    circ(cx, y, r);
    for (var i = 0; i < 8; i++) {
      var a = i * 0.7854 + jit(it.seed, step, 0.02);
      line(cx + Math.cos(a) * r * 1.25, y + Math.sin(a) * r * 1.25,
           cx + Math.cos(a) * r * 1.7, y + Math.sin(a) * r * 1.7);
    }
    ctx.globalAlpha = 1;
  }

  function drawFarBuild(it, x, gy, step) {
    var top = gy - it.h, jx = jit(it.seed, step, 0.0016 * U);
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.1, 0.002 * U); ctx.globalAlpha = 0.55;
    rectO(x + jx, top, it.w, it.h);
    if (it.roof === 1) line(x + jx + it.w * 0.3, top, x + jx + it.w * 0.3, top - 0.03 * U);       // antenna
    if (it.roof === 2) rectO(x + jx + it.w * 0.35, top - 0.025 * U, it.w * 0.3, 0.025 * U);       // penthouse
    ctx.globalAlpha = 0.4;
    var cols = Math.max(2, (it.w / (0.035 * U)) | 0), rows = Math.max(2, (it.h / (0.045 * U)) | 0);
    for (var c = 0; c < cols; c++) for (var rw = 0; rw < rows; rw++) {
      if (ihash(it.seed + c * 57 + rw * 131) < 0.4) {
        ctx.fillStyle = INK;
        ctx.fillRect(x + jx + (c + 0.5) * (it.w / cols) - 0.004 * U, top + (rw + 0.5) * (it.h / rows) - 0.003 * U, 0.008 * U, 0.006 * U);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawMidBuild(it, x, gy, step, pixellated) {
    var top = gy - it.h, jx = jit(it.seed, step, 0.0016 * U);
    if (pixellated) {
      ctx.fillStyle = INK; ctx.globalAlpha = 0.88;
      for (var i = 0; i < it.blocks.length; i++) {
        var b = it.blocks[i];
        ctx.fillRect(x + jx + b.dx, gy - b.h, b.w, b.h);
      }
      ctx.globalAlpha = 1;
      return;
    }
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.3, 0.0024 * U); ctx.globalAlpha = 0.92;
    rectO(x + jx, top, it.w, it.h);
    if (it.top === 1) rectO(x + jx + it.w * 0.4, top - 0.035 * U, it.w * 0.2, 0.035 * U);         // water tower base
    if (it.top === 1) line(x + jx + it.w * 0.5, top - 0.035 * U, x + jx + it.w * 0.5, top - 0.055 * U);
    if (it.top === 2) line(x + jx, top + it.h * 0.18, x + jx + it.w, top);                        // sloped parapet echo
    line(x + jx, top + it.h * 0.06, x + jx + it.w, top + it.h * 0.06);                            // cornice
    var cols = Math.max(3, (it.w / (0.032 * U)) | 0), rows = Math.max(3, (it.h / (0.042 * U)) | 0);
    for (var c = 0; c < cols; c++) for (var rw = 0; rw < rows; rw++) {
      var hv = ihash(it.seed + c * 71 + rw * 149);
      var wx = x + jx + (c + 0.5) * (it.w / cols), wy = top + (rw + 0.5) * (it.h / rows);
      if (hv < 0.16) { ctx.fillStyle = YEL; ctx.globalAlpha = 0.85; ctx.fillRect(wx - 0.006 * U, wy - 0.005 * U, 0.012 * U, 0.010 * U); ctx.globalAlpha = 0.92; }
      else if (hv < 0.55) { ctx.strokeStyle = INK; ctx.globalAlpha = 0.5; rectO(wx - 0.006 * U, wy - 0.005 * U, 0.012 * U, 0.010 * U); ctx.globalAlpha = 0.92; }
    }
    ctx.globalAlpha = 1;
  }

  function drawCrane(it, x, gy, step, pixellated) {
    var top = gy - it.h, jx = jit(it.seed, step, 0.002 * U);
    ctx.strokeStyle = YEL; ctx.lineWidth = Math.max(1.6, 0.0032 * U); ctx.globalAlpha = 0.95;
    if (pixellated) {
      ctx.fillStyle = YEL;
      ctx.fillRect(x + jx + it.w * 0.28, top, 0.024 * U, it.h);                                   // mast column
      ctx.fillRect(x + jx, top, it.w, 0.024 * U);                                                 // jib row
      ctx.fillRect(x + jx + it.w * 0.78, top, 0.02 * U, it.h * 0.4);                              // hook drop
      ctx.globalAlpha = 1;
      return;
    }
    var mx = x + jx + it.w * 0.3;
    line(mx, gy, mx, top);                                                                        // mast
    line(mx - 0.012 * U, gy, mx - 0.012 * U, top + it.h * 0.3);
    line(mx + 0.012 * U, gy, mx + 0.012 * U, top + it.h * 0.3);
    line(x + jx, top, x + jx + it.w, top);                                                        // jib
    line(mx, top - 0.05 * U, mx, top);                                                            // apex post
    line(mx, top - 0.05 * U, x + jx + it.w, top);                                                 // tie to jib tip
    line(mx, top - 0.05 * U, x + jx, top);                                                        // tie to counter-jib
    line(x + jx, top, x + jx, top + 0.03 * U);                                                    // counterweight
    var hx = x + jx + it.w * 0.8 + jit(it.seed + 5, step, 0.004 * U);
    line(hx, top, hx, top + it.h * 0.42);                                                         // hook cable
    rectO(hx - 0.018 * U, top + it.h * 0.42, 0.036 * U, 0.028 * U);                               // load block
    ctx.globalAlpha = 1;
  }

  function drawShop(it, x, gy, step) {
    var top = gy - it.h, jx = jit(it.seed, step, 0.0016 * U);
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.3, 0.0024 * U); ctx.globalAlpha = 0.95;
    rectO(x + jx, top, it.w, it.h);
    var aw = top + it.h * 0.34;
    ctx.beginPath(); ctx.moveTo(x + jx, aw);
    var seg = 6; for (var i = 1; i <= seg; i++) ctx.lineTo(x + jx + (i * it.w) / seg, aw + ((i % 2) ? 0.012 * U : 0));
    ctx.stroke();                                                                                 // awning zigzag
    rectO(x + jx + it.w * 0.08, aw + 0.02 * U, it.w * 0.4, it.h * 0.55);                          // window
    rectO(x + jx + it.w * 0.68, aw + 0.02 * U, it.w * 0.2, it.h * 0.62);                          // door
    ctx.globalAlpha = 1;
  }

  function drawTree(it, x, gy, step) {
    var cx = x + it.w / 2 + jit(it.seed, step, 0.002 * U), th = it.h;
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.3, 0.0024 * U); ctx.globalAlpha = 0.9;
    line(cx, gy, cx, gy - th * 0.45);
    circ(cx, gy - th * 0.68, th * 0.30);
    circ(cx - th * 0.2, gy - th * 0.55, th * 0.2);
    circ(cx + th * 0.2, gy - th * 0.58, th * 0.22);
    ctx.globalAlpha = 1;
  }

  function drawLamp(it, x, gy, step) {
    var cx = x + it.w / 2 + jit(it.seed, step, 0.0016 * U), th = it.h * 1.15;
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.3, 0.0022 * U); ctx.globalAlpha = 0.9;
    line(cx, gy, cx, gy - th);
    line(cx, gy - th, cx + 0.03 * U, gy - th);
    circ(cx + 0.038 * U, gy - th + 0.006 * U, 0.008 * U);
    ctx.globalAlpha = 1;
  }

  function drawPerson(it, x, gy, step) {
    var cx = x + it.w / 2 + jit(it.seed, step, 0.002 * U), th = it.h * 0.62;
    var hip = gy - th * 0.52, head = gy - th;
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.3, 0.0024 * U); ctx.globalAlpha = 0.95;
    circ(cx, head + th * 0.09, th * 0.09);
    line(cx, head + th * 0.18, cx, hip);                                                          // torso
    var ph = (it.v % 2) ? 1 : -1;
    line(cx, hip, cx - 0.016 * U * ph, gy);                                                       // legs, stride by variant
    line(cx, hip, cx + 0.016 * U * ph, gy - th * 0.06);
    line(cx, gy - th * 0.68, cx - 0.014 * U * ph, gy - th * 0.4);                                 // arms
    line(cx, gy - th * 0.68, cx + 0.014 * U * ph, gy - th * 0.44);
    ctx.globalAlpha = 1;
  }

  function drawBike(it, x, gy, step) {
    var cx = x + it.w / 2 + jit(it.seed, step, 0.002 * U), wr = 0.017 * U;
    var wy = gy - wr, x1 = cx - 0.026 * U, x2 = cx + 0.026 * U;
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.3, 0.0022 * U); ctx.globalAlpha = 0.95;
    circ(x1, wy, wr); circ(x2, wy, wr);                                                           // wheels
    line(x1, wy, cx - 0.002 * U, wy - wr * 0.4);                                                  // frame
    line(x2, wy, cx - 0.002 * U, wy - wr * 0.4);
    line(cx - 0.002 * U, wy - wr * 0.4, cx + 0.012 * U, wy - wr * 1.5);                            // seat post up
    line(x2, wy, cx + 0.02 * U, wy - wr * 1.55);                                                  // fork to bars
    var ry = wy - wr * 2.6;
    circ(cx + 0.006 * U, ry, wr * 0.42);                                                          // rider head
    line(cx + 0.004 * U, ry + wr * 0.45, cx - 0.002 * U, wy - wr * 1.5);                          // rider torso
    line(cx - 0.002 * U, wy - wr * 1.5, cx + 0.018 * U, wy - wr * 1.55);                          // arm to bars
    line(cx - 0.002 * U, wy - wr * 1.5, cx + 0.006 * U, wy - wr * 0.5);                           // leg to pedal
    line(cx - 0.002 * U, wy - wr * 1.5, x1 + wr * 0.4, wy - wr * 0.6);                            // leg back
    ctx.globalAlpha = 1;
  }

  function drawHydrant(it, x, gy, step) {
    var cx = x + it.w / 2 + jit(it.seed, step, 0.0016 * U), th = it.h * 0.3;
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.3, 0.0022 * U); ctx.globalAlpha = 0.9;
    rectO(cx - 0.008 * U, gy - th, 0.016 * U, th);
    circ(cx, gy - th - 0.004 * U, 0.006 * U);
    line(cx - 0.014 * U, gy - th * 0.6, cx + 0.014 * U, gy - th * 0.6);
    ctx.globalAlpha = 1;
  }

  function drawStreetcar(it, x, gy, step) {
    var w = it.w, h = it.h, top = gy - h - 0.012 * U, jx = jit(it.seed, step, 0.0012 * U);
    x += jx;
    ctx.lineWidth = Math.max(1.5, 0.0028 * U);
    ctx.fillStyle = RED; ctx.globalAlpha = 0.92;
    ctx.fillRect(x, top, w, h);                                                                   // body
    ctx.globalAlpha = 1;
    ctx.strokeStyle = INK;
    rectO(x, top, w, h);
    ctx.beginPath(); ctx.moveTo(x + w * 0.06, top); ctx.lineTo(x + w * 0.2, top - 0.02 * U);
    ctx.lineTo(x + w * 0.8, top - 0.02 * U); ctx.lineTo(x + w * 0.94, top); ctx.stroke();          // roof
    line(x + w * 0.5, top - 0.02 * U, x + w * 0.42, top - 0.042 * U);                             // pantograph
    line(x + w * 0.42, top - 0.042 * U, x + w * 0.58, top - 0.042 * U);
    line(x + w * 0.58, top - 0.042 * U, x + w * 0.5, top - 0.02 * U);
    ctx.fillStyle = INK; ctx.globalAlpha = 0.9;
    for (var i = 0; i < 5; i++) ctx.fillRect(x + w * (0.08 + i * 0.18), top + h * 0.16, w * 0.11, h * 0.34); // windows
    ctx.globalAlpha = 1;
    ctx.strokeStyle = INK;
    line(x, top + h * 0.62, x + w, top + h * 0.62);                                               // side stripe
    ctx.fillStyle = BASE;
    ctx.fillRect(x + w * 0.12, top + h * 0.78, w * 0.16, h * 0.22);                               // bogies
    ctx.fillRect(x + w * 0.72, top + h * 0.78, w * 0.16, h * 0.22);
    circ(x + w * 0.2, gy - 0.004 * U, 0.009 * U);
    circ(x + w * 0.8, gy - 0.004 * U, 0.009 * U);
  }

  function drawNearItem(it, x, gy, step) {
    if (it.kind === 'shop') drawShop(it, x, gy, step);
    else if (it.kind === 'tree') drawTree(it, x, gy, step);
    else if (it.kind === 'lamp') drawLamp(it, x, gy, step);
    else if (it.kind === 'person') drawPerson(it, x, gy, step);
    else if (it.kind === 'bike') drawBike(it, x, gy, step);
    else if (it.kind === 'hydrant') drawHydrant(it, x, gy, step);
    else if (it.kind === 'streetcar') drawStreetcar(it, x, gy, step);
  }

  // draw one tiled layer: items repeat every period; offset in world px
  function drawTiled(layer, off, gy, step, mode) {
    var P = layer.period;
    var t0 = Math.floor(off / P) - 1, t1 = t0 + Math.ceil(LW / P) + 2;
    for (var t = t0; t <= t1; t++) {
      for (var i = 0; i < layer.items.length; i++) {
        var it = layer.items[i];
        var sx = it.x + t * P - off;
        if (sx + it.w < -20 || sx > LW + 20) continue;
        if (mode === 'cloud') { if (it.kind === 'sun') drawSun(it, sx, step); else drawCloud(it, sx, step); }
        else if (mode === 'far') drawFarBuild(it, sx, gy, step);
        else if (mode === 'mid') { if (it.kind === 'crane') drawCrane(it, sx, gy, step, false); else drawMidBuild(it, sx, gy, step, false); }
        else if (mode === 'midpix') { if (it.kind === 'crane') drawCrane(it, sx, gy, step, true); else drawMidBuild(it, sx, gy, step, true); }
        else if (mode === 'near') drawNearItem(it, sx, gy, step);
      }
    }
  }

  // ================= main draw =================
  function draw(elapsed) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (!layers) generate();

    var speed = Math.abs(v);
    var step = Math.floor(elapsed * (6 + Math.min(18, speed / 55)));   // boil/step rate rises with speed
    var Dq = Math.round(D / (0.004 * U)) * (0.004 * U);                // stepped distance: the film advances in frames
    var gFar = 0.46 * LH, gMid = 0.58 * LH, gNear = 0.72 * LH;

    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
    ctx.fillStyle = BASE;
    ctx.fillRect(0, 0, LW, LH);

    // gate weave: the whole frame shudders by a per-step hash offset
    var gx = jit(5150, step, 0.0025 * U), gy = jit(9241, step, 0.002 * U);
    ctx.save();
    ctx.translate(gx, gy);

    // clouds + sun (slowest layer)
    drawTiled(layers.clouds, Dq * 0.12, 0, step, 'cloud');

    // far blocks
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.3; ctx.lineWidth = Math.max(1, 0.0016 * U);
    line(-10, gFar, LW + 10, gFar);
    ctx.globalAlpha = 1;
    drawTiled(layers.far, Dq * 0.3, gFar, step, 'far');

    // multiple exposure: ghost passes of mid + near at high speed
    var ghost = speed > 240 ? clamp(v * 0.05, -0.14 * U, 0.14 * U) : 0;
    var pix = speed > 600;

    if (ghost) {
      ctx.globalAlpha = 0.30;
      drawTiled(layers.mid, Dq * 0.6 - ghost, gMid, step, pix ? 'midpix' : 'mid');
      drawTiled(layers.mid, Dq * 0.6 + ghost, gMid, step, pix ? 'midpix' : 'mid');
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.4; ctx.lineWidth = Math.max(1, 0.0018 * U);
    line(-10, gMid, LW + 10, gMid);
    ctx.globalAlpha = 1;
    drawTiled(layers.mid, Dq * 0.6, gMid, step, pix ? 'midpix' : 'mid');

    if (ghost) {
      ctx.globalAlpha = 0.30;
      drawTiled(layers.near, Dq - ghost, gNear, step, 'near');
      drawTiled(layers.near, Dq + ghost, gNear, step, 'near');
      ctx.globalAlpha = 1;
    }
    // street: ground line, rails, dashed centre line scrolling with the film
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.2, 0.0022 * U);
    ctx.globalAlpha = 0.85; line(-10, gNear, LW + 10, gNear);
    ctx.globalAlpha = 0.5;
    line(-10, gNear + 0.014 * U, LW + 10, gNear + 0.014 * U);
    line(-10, gNear + 0.026 * U, LW + 10, gNear + 0.026 * U);
    ctx.globalAlpha = 0.45;
    var dashOff = -(((Dq % (0.08 * U)) + 0.08 * U) % (0.08 * U));
    for (var dx = dashOff; dx < LW; dx += 0.08 * U) line(dx, gNear + 0.075 * U, dx + 0.04 * U, gNear + 0.075 * U);
    ctx.globalAlpha = 1;
    drawTiled(layers.near, Dq, gNear, step, 'near');

    // pavement scribbles below the street line, scrolling with the near layer
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.28; ctx.lineWidth = Math.max(1, 0.0016 * U);
    var pn = layers.near.period;
    for (var si = 0; si < 40; si++) {
      var wx = ihash(31337 + si * 17) * pn;
      var sx2 = wx - (Dq % pn); if (sx2 < -0.1 * U) sx2 += pn; if (sx2 > LW) continue;
      var sy = gNear + (0.05 + ihash(777 + si * 29) * 0.2) * LH * 0.5 + ihash(555 + si) * 0.03 * U;
      if (sy > LH - 4) continue;
      line(sx2, sy, sx2 + (0.02 + ihash(999 + si) * 0.04) * U, sy + jit(si, step, 0.002 * U));
    }
    ctx.globalAlpha = 1;

    // rain passages: a 10 s blue segment inside every 55 s, pedalled or not
    var cyc = elapsed % 55;
    var rainEnv = cyc >= 45 ? Math.sin((cyc - 45) / 10 * Math.PI) : 0;
    if (rainEnv > 0.01) {
      ctx.strokeStyle = RAIN; ctx.lineWidth = Math.max(1.1, 0.0018 * U);
      ctx.globalAlpha = 0.5 * rainEnv;
      var fall = (elapsed * 0.55 * U) % (LH + 0.1 * U);
      for (var ri = 0; ri < 90; ri++) {
        var rx = ihash(6001 + ri * 37) * (LW + 0.2 * U) - 0.1 * U;
        var ry = ihash(8001 + ri * 53) * (LH + 0.1 * U) + fall;
        if (ry > LH + 0.05 * U) ry -= LH + 0.1 * U;
        var rl = (0.03 + ihash(9001 + ri * 7) * 0.025) * U;
        line(rx, ry, rx - rl * 0.35, ry + rl);
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // sprocket-hole strip along the top: film transport, scrolls with D
    var sh = Math.max(18, 0.034 * LH);
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, LW, sh);
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.5; ctx.lineWidth = Math.max(1, 0.0016 * U);
    line(0, sh, LW, sh);
    ctx.globalAlpha = 0.85; ctx.fillStyle = INK;
    var holeW = 0.036 * U, holeH = sh * 0.55, pitch = 0.058 * U;
    var hoff = -(((Dq % pitch) + pitch) % pitch) + jit(3131, step, 0.0015 * U);
    for (var hx = hoff; hx < LW; hx += pitch) ctx.fillRect(hx, (sh - holeH) / 2, holeW, holeH);
    ctx.globalAlpha = 1;

    // Ektachrome warmth over everything; deepens as the pedalling quickens
    ctx.fillStyle = WARM;
    ctx.globalAlpha = 0.07 + Math.min(0.09, speed * 0.00004);
    ctx.fillRect(0, 0, LW, LH);
    ctx.globalAlpha = 1;

    // film grain: hashed speckle, re-rolled every step
    var n = clamp(Math.round(W * H / 2400), 200, 900);
    for (var gi = 0; gi < n; gi++) {
      var px = ihash(step * 100003 + gi * 131) * LW;
      var py = ihash(step * 200003 + gi * 197) * LH;
      if (ihash(step * 300003 + gi * 71) < 0.5) { ctx.fillStyle = '#000000'; ctx.globalAlpha = 0.16; }
      else { ctx.fillStyle = INK; ctx.globalAlpha = 0.09; }
      ctx.fillRect(px, py, Math.max(1, 0.0016 * U), Math.max(1, 0.0016 * U));
    }
    ctx.globalAlpha = 1;
  }

  // ================= sizing / loop =================
  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    W = w; H = h;
    LW = isPhone(w, h) ? 900 : 1280;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    SCALE = (w * dpr) / LW;
    LH = (h * dpr) / SCALE;
    U = Math.min(LW, LH);
    if (Math.abs(U - genU) > U * 0.05 || !layers) { generate(); D0 = 1.04 * U; if (D === 0) D = D0; }
  }

  var t0 = null, lastTs = null, acc = 0, elapsedNow = 0;
  function frame(ts) {
    var now = ts / 1000;
    if (t0 === null) { t0 = now; lastTs = now; }
    var dt = now - lastTs; lastTs = now;
    if (dt > 0.25) dt = 0.25;
    if (dt < 0) dt = 0;
    acc += dt;
    var h = 1 / 240;
    while (acc >= h) { stepSim(h); acc -= h; }
    elapsedNow = now - t0;
    draw(elapsedNow);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  resize();
  D = D0;
  draw(0);   // synchronous first frame: fixed phase, at rest, streetcar + crane framed
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(elapsedNow); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(elapsedNow); });
  }
})();
</script>
</body>
</html>
