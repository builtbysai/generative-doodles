<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Signal, Two Senses</title>
<style>
html, body { margin: 0; padding: 0; background: #0D0F14; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PHASE = 124.0;
var SEED = 1613007;
/* palette: room, etched line, signal accent at peaks only */
var ROOM = [13, 15, 20];
var LINE = [216, 216, 216];
var ACCENT = [232, 74, 30];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}

/* ---- one master signal: sum of 3 slow incommensurate oscillators ----
   Periods 40, 63 and 89 seconds. A pure function of piece time, so the
   drift never loops and frame one is byte-reproducible. */
var P1 = 40, P2 = 63, P3 = 89;
var A1 = 0.52, A2 = 0.31, A3 = 0.17;
var F1 = 0.7, F2 = 2.1, F3 = 4.4;
function signal(t) {
  return A1 * Math.sin(TAU * t / P1 + F1)
       + A2 * Math.sin(TAU * t / P2 + F2)
       + A3 * Math.sin(TAU * t / P3 + F3);
}
function signalDeriv(t) {
  return A1 * (TAU / P1) * Math.cos(TAU * t / P1 + F1)
       + A2 * (TAU / P2) * Math.cos(TAU * t / P2 + F2)
       + A3 * (TAU / P3) * Math.cos(TAU * t / P3 + F3);
}
/* signal range is about [-1, 1]; derivative range about [-0.13, 0.13] */
var DMAX = 0.13;

/* ---- stipple seeds: fixed table, one cluster per deep-tone column ---- */
var STIP = (function () {
  var rng = mulberry32(SEED);
  var pts = [], i;
  for (i = 0; i < 240; i++) {
    pts.push({ x: rng(), y: rng(), r: 0.5 + rng() * 1.1, a: 0.25 + rng() * 0.5 });
  }
  return pts;
})();

/* ---- audio: lazily created inside the tap gesture only ---- */
var audio = null;
function enableAudio() {
  if (audio) return;
  var AC = (typeof window !== 'undefined') &&
    (window.AudioContext || window.webkitAudioContext);
  if (!AC) return;
  try {
    var actx = new AC();
    var filter = actx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 800;
    filter.Q.value = 0.7;
    var gain = actx.createGain();
    gain.gain.value = 0;
    var o1 = actx.createOscillator();
    o1.type = 'sine';
    var o2 = actx.createOscillator();
    o2.type = 'triangle';
    o1.connect(filter); o2.connect(filter);
    filter.connect(gain); gain.connect(actx.destination);
    o1.start(); o2.start();
    audio = { ctx: actx, o1: o1, o2: o2, gain: gain, filter: filter };
  } catch (e) { audio = null; }
}
function updateAudio(t) {
  if (!audio) return;
  var s = signal(t), d = signalDeriv(t);
  var dn = clamp(d / DMAX, -1, 1);
  /* pitch from the signal derivative: a rising signal sings higher */
  var freq = 180 * Math.pow(2, dn * 0.9);
  var amp = clamp(Math.abs(s), 0, 1);
  var g = 0.015 + 0.085 * amp;
  var now = audio.ctx.currentTime;
  audio.o1.frequency.setTargetAtTime(freq, now, 0.4);
  audio.o2.frequency.setTargetAtTime(freq * 1.005, now, 0.4);
  audio.gain.gain.setTargetAtTime(g, now, 0.5);
}
function onTap() {
  enableAudio();
  draw(lastT);
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onTap);
  canvas.addEventListener('touchstart', onTap);
}

function label(text, cx, y, font, px, color, baseline) {
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = baseline;
  ctx.fillStyle = color;
  ctx.fillText(text, cx, y);
}

function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = rgb(ROOM);
  ctx.fillRect(0, 0, VW, VH);

  /* ---- layout: centered field ~80% of frame, notation strip below ---- */
  var fw = VW * 0.80;
  var fh = Math.min(VH * 0.52, fw * 0.62);
  var fx = (VW - fw) / 2;
  var fy = VH * 0.16;
  var stripH = Math.max(26, VH * 0.055);
  var stripY = fy + fh + Math.max(18, VH * 0.045);
  var stripW = fw;

  /* field frame: a single etched hairline */
  ctx.strokeStyle = rgba(LINE, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(fx + 0.5, fy + 0.5, fw - 1, fh - 1);

  /* ---- the drawing: hatch bands + stipple, read from the signal ----
     Horizontal axis is time: the right edge is now, the left edge is
     ~63 seconds ago. Each column reads the signal at its own moment:
     hatch density is the amplitude, hatch angle is the pitch. */
  var COLS = 84, ROWS = 7;
  var DT = 0.75; /* seconds per column: 84 columns cover 63 s */
  var cw = fw / COLS, rh = fh / ROWS;
  var i, r, k;
  /* keep the etched weather inside the field frame */
  ctx.save();
  ctx.beginPath();
  ctx.rect(fx, fy, fw, fh);
  ctx.clip();
  for (i = 0; i < COLS; i++) {
    var tau = t - (COLS - 1 - i) * DT;
    var s = signal(tau);
    var d = clamp(signalDeriv(tau) / DMAX, -1, 1);
    var amp = clamp(Math.abs(s), 0, 1);
    /* hatch angle: a steep etched diagonal, leaning with the tone.
       Level at zero derivative, swinging about 20 degrees either way
       as the signal rises or falls. */
    var ang = 1.05 + d * 0.35;
    var dx = Math.cos(ang), dy = Math.sin(ang);
    /* perpendicular, for spacing the strokes inside a cell */
    var nx = -dy, ny = dx;
    var peak = s > 0.82;
    var deep = s < -0.55;
    for (r = 0; r < ROWS; r++) {
      var cy = fy + (r + 0.5) * rh;
      /* density: 2 to 7 strokes per cell, growing with amplitude */
      var n = 2 + Math.floor(amp * 5.99);
      for (k = 0; k < n; k++) {
        var off = (k - (n - 1) / 2) * (cw * 0.34);
        var len = rh * 0.42;
        var cxp = fx + (i + 0.5) * cw + nx * off;
        var cyp = cy + ny * off;
        var x0 = cxp - dx * len, y0 = cyp - dy * len;
        var x1 = cxp + dx * len, y1 = cyp + dy * len;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        /* at a peak, only the middle stroke of each cell turns accent;
           the rest stay etched line, so the red stays sparing */
        var isAccent = peak && k === Math.floor(n / 2);
        ctx.strokeStyle = isAccent ? rgba(ACCENT, 0.9) : rgba(LINE, 0.30 + 0.50 * amp);
        ctx.lineWidth = isAccent ? 1.4 : 1;
        ctx.stroke();
      }
    }
    /* stipple clusters gather where the tone deepens */
    if (deep) {
      var cluster = Math.floor((0.55 + s * -1) * 6);
      for (k = 0; k < cluster; k++) {
        var p = STIP[(i * 7 + k * 13) % STIP.length];
        var px = fx + (i + p.x) * cw;
        var py = fy + p.y * fh;
        ctx.beginPath();
        ctx.arc(px, py, p.r, 0, TAU);
        ctx.fillStyle = rgba(LINE, p.a);
        ctx.fill();
      }
    }
  }
  ctx.restore();
  /* a single accent tick at the top edge marks each signal peak */
  for (i = 0; i < COLS; i++) {
    var tauP = t - (COLS - 1 - i) * DT;
    if (signal(tauP) > 0.82) {
      ctx.beginPath();
      ctx.moveTo(fx + (i + 0.5) * cw, fy - 7);
      ctx.lineTo(fx + (i + 0.5) * cw, fy - 2);
      ctx.strokeStyle = rgba(ACCENT, 0.9);
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }

  /* ---- notation strip: the signal's recent history as etched hatch ---- */
  var sy = stripY + stripH / 2;
  ctx.strokeStyle = rgba(LINE, 0.3);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(fx, stripY + stripH + 0.5);
  ctx.lineTo(fx + stripW, stripY + stripH + 0.5);
  ctx.stroke();
  var N = 160;
  ctx.beginPath();
  for (i = 0; i <= N; i++) {
    var tau2 = t - (N - i) * (DT * COLS / N);
    var sv = signal(tau2);
    var xx = fx + (i / N) * stripW;
    var yy = sy - sv * (stripH * 0.42);
    if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
  }
  ctx.strokeStyle = rgba(LINE, 0.75);
  ctx.lineWidth = 1.2;
  ctx.stroke();
  /* etched hatch ticks under the strip, one per peak in the window */
  for (i = 0; i <= N; i++) {
    var tau3 = t - (N - i) * (DT * COLS / N);
    if (signal(tau3) > 0.82) {
      var xx3 = fx + (i / N) * stripW;
      ctx.beginPath();
      ctx.moveTo(xx3, stripY + stripH - 6);
      ctx.lineTo(xx3, stripY + stripH);
      ctx.strokeStyle = rgba(ACCENT, 0.8);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
  /* now marker: a short etched tick at the strip's right edge */
  ctx.beginPath();
  ctx.moveTo(fx + stripW, stripY - 3);
  ctx.lineTo(fx + stripW, stripY + stripH + 3);
  ctx.strokeStyle = rgba(LINE, 0.6);
  ctx.lineWidth = 1;
  ctx.stroke();

  /* ---- labels ---- */
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  label('One Signal, Two Senses', VW / 2, Math.max(8, 0.03 * VH),
    'bold ' + titlePx + 'px monospace', titlePx, rgba(LINE, 0.9), 'top');
  label('2006 · 06 · 12', VW / 2, Math.max(8, 0.03 * VH) + titlePx + 6,
    smallPx + 'px monospace', smallPx, rgba(LINE, 0.6), 'top');
  label('Tap to enable sound.', VW / 2, VH - 12,
    smallPx + 'px monospace', smallPx, rgba(LINE, 0.65), 'bottom');

  updateAudio(t);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
