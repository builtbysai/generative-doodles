<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Broken Five</title>
<style>
  html, body { margin: 0; padding: 0; background: #8E8B82; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';

// Seeded PRNG only. No Math.random anywhere in this piece.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

var COL = {
  grout: '#8E8B82', black: '#171512', white: '#E4E0D6',
  cobalt: '#1E3A6E', terra: '#A34A2E', mirror: '#C9C4B8', oil: '#0F0E0C'
};
var FACE_COLORS = [COL.black, COL.white, COL.cobalt, COL.terra, COL.mirror];
var SHARD_COLORS = [COL.black, COL.white, COL.cobalt, COL.terra, COL.mirror];
var SHARD_WEIGHTS = [0.24, 0.24, 0.18, 0.18, 0.16];

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, cell = 60;
var shards = [], faces = [];
var drags = [];    // {x, y, dx, dy, t0}
var touches = [];  // {face, t0}
var startTs = null;
var booted = false;

function nowMs() {
  try {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
  } catch (e) {}
  return Date.now();
}

function pieceTime() {
  if (startTs === null) return 0;
  return Math.max(0, (nowMs() - startTs) / 1000);
}

function pick(rng, arr, weights) {
  var r = rng(), acc = 0;
  for (var i = 0; i < arr.length; i++) {
    acc += weights[i];
    if (r < acc) return arr[i];
  }
  return arr[arr.length - 1];
}

function centroid(pts) {
  var x = 0, y = 0;
  for (var i = 0; i < pts.length; i++) { x += pts[i][0]; y += pts[i][1]; }
  return [x / pts.length, y / pts.length];
}

function shrink(pts, f) {
  var c = centroid(pts), out = [];
  for (var i = 0; i < pts.length; i++) {
    out.push([c[0] + (pts[i][0] - c[0]) * f, c[1] + (pts[i][1] - c[1]) * f]);
  }
  return out;
}

function buildLayout() {
  var rng = mulberry32(1331000);
  var cols = 12, rows = 9;
  var cw = W / cols, ch = H / rows;
  cell = Math.min(cw, ch);
  // Jittered grid points; borders clamped to the field edges.
  var P = [];
  for (var j = 0; j <= rows; j++) {
    P[j] = [];
    for (var i = 0; i <= cols; i++) {
      var x = i * cw, y = j * ch;
      if (i > 0 && i < cols) x += (rng() - 0.5) * 0.30 * cw;
      if (j > 0 && j < rows) y += (rng() - 0.5) * 0.30 * ch;
      P[j][i] = [x, y];
    }
  }
  shards = [];
  var gap = 0.90; // shrink factor leaves thick grout lines
  for (var jj = 0; jj < rows; jj++) {
    for (var ii = 0; ii < cols; ii++) {
      var quad = [P[jj][ii], P[jj][ii + 1], P[jj + 1][ii + 1], P[jj + 1][ii]];
      var split = rng() < 0.35;
      var pieces = [];
      if (split) {
        if (rng() < 0.5) {
          pieces = [[quad[0], quad[1], quad[2]], [quad[0], quad[2], quad[3]]];
        } else {
          pieces = [[quad[0], quad[1], quad[3]], [quad[1], quad[2], quad[3]]];
        }
      } else {
        pieces = [quad];
      }
      for (var k = 0; k < pieces.length; k++) {
        var pts = shrink(pieces[k], gap);
        var c = centroid(pts);
        shards.push({
          pts: pts, c: c,
          color: pick(rng, SHARD_COLORS, SHARD_WEIGHTS),
          phase: rng() * Math.PI * 2,
          rotAmp: 0.02 + rng() * 0.035,
          cellI: ii, cellJ: jj
        });
      }
    }
  }
  // Five faces in the central band, each anchored to a shard of a
  // different base color. Anchor cells spread across the middle rows.
  var anchorCells = [[1, 4], [3, 3], [5, 4], [7, 3], [9, 4]];
  faces = [];
  for (var f = 0; f < 5; f++) {
    var ac = anchorCells[f];
    var anchor = null;
    for (var s = 0; s < shards.length; s++) {
      if (shards[s].cellI === ac[0] && shards[s].cellJ === ac[1]) { anchor = s; break; }
    }
    if (anchor === null) anchor = 0;
    shards[anchor].color = FACE_COLORS[f];
    shards[anchor].isAnchor = true;
    var ax = shards[anchor].c[0], ay = shards[anchor].c[1];
    var r = cell * 1.15;
    // Cluster: shards whose centroid falls near the anchor.
    var cluster = [];
    for (var s2 = 0; s2 < shards.length; s2++) {
      var dx = shards[s2].c[0] - ax, dy = shards[s2].c[1] - ay;
      if (Math.sqrt(dx * dx + dy * dy) < r * 1.7) cluster.push(s2);
    }
    // One shard of the cluster drops away on touch, then regrows.
    var drop = cluster.length > 1 ? cluster[Math.floor(rng() * cluster.length)] : anchor;
    // Gestural oil-stick bridging strokes around the face.
    var strokes = [];
    for (var st = 0; st < 3; st++) {
      var a0 = rng() * Math.PI * 2, len = r * (0.6 + rng() * 0.5);
      var sx = ax + Math.cos(a0) * r * 0.9, sy = ay + Math.sin(a0) * r * 0.9;
      var mx = sx + Math.cos(a0 + 0.5) * len * 0.5, my = sy + Math.sin(a0 + 0.5) * len * 0.5;
      var ex = sx + Math.cos(a0) * len, ey = sy + Math.sin(a0) * len;
      strokes.push([[sx, sy], [mx, my], [ex, ey]]);
    }
    faces.push({
      ax: ax, ay: ay, r: r, anchor: anchor, cluster: cluster, drop: drop,
      eyeType: f, mouthType: f, strokes: strokes
    });
  }
}

function drawShardPoly(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
}

function ellipseAt(x, y, rx, ry, rot) {
  ctx.beginPath();
  ctx.moveTo(x + rx, y);
  ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
  ctx.fill();
}

function dragOffset(shard, t) {
  var ox = 0, oy = 0;
  var R = cell * 2.5;
  for (var i = 0; i < drags.length; i++) {
    var d = drags[i], age = t - d.t0;
    if (age < 0) continue;
    var decay = Math.exp(-age / 2.5);
    var dx = shard.c[0] - d.x, dy = shard.c[1] - d.y;
    var w = Math.exp(-(dx * dx + dy * dy) / (2 * R * R));
    ox += d.dx * w * decay;
    oy += d.dy * w * decay;
  }
  return [ox, oy];
}

function draw(t) {
  ctx.fillStyle = COL.grout;
  ctx.fillRect(0, 0, W, H);

  // Per-face touch state, closed form over piece time.
  var faceFlash = [], faceDropScale = [];
  for (var f = 0; f < faces.length; f++) {
    faceFlash[f] = 0; faceDropScale[f] = 1;
  }
  for (var ti = 0; ti < touches.length; ti++) {
    var tc = touches[ti], age = t - tc.t0;
    if (age < 0) continue;
    if (age < 1.5) faceFlash[tc.face] = Math.max(faceFlash[tc.face], (1 - age / 1.5) * 0.6);
    if (age < 1) faceDropScale[tc.face] = Math.max(0, 1 - age);
    else if (age < 31) faceDropScale[tc.face] = (age - 1) / 30;
    else faceDropScale[tc.face] = 1;
  }

  // Shards: breathing rotation, drag settle, mirror glint.
  for (var s = 0; s < shards.length; s++) {
    var sh = shards[s];
    var off = dragOffset(sh, t);
    var cx = sh.c[0] + off[0], cy = sh.c[1] + off[1];
    var rot = sh.rotAmp * Math.sin((Math.PI * 2 * t) / 24 + sh.phase);
    var scale = 1;
    for (var f2 = 0; f2 < faces.length; f2++) {
      if (faces[f2].drop === s) scale = faceDropScale[f2];
    }
    if (scale <= 0.01) continue; // dropped shard: grout shows through
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    if (scale !== 1) ctx.scale(scale, scale);
    ctx.translate(-cx, -cy);
    var moved = [];
    for (var p = 0; p < sh.pts.length; p++) moved.push([sh.pts[p][0] + off[0], sh.pts[p][1] + off[1]]);
    ctx.fillStyle = sh.color;
    drawShardPoly(moved);
    // Mirror glint: traveling wave of flat-alpha diamonds.
    if (sh.color === COL.mirror) {
      var g = 0.5 + 0.5 * Math.sin((Math.PI * 2 * t) / 14 - s * 0.35);
      if (g > 0.55) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.28 * g).toFixed(3) + ')';
        var gs = cell * 0.16 * g;
        ctx.beginPath();
        ctx.moveTo(cx, cy - gs); ctx.lineTo(cx + gs * 0.6, cy);
        ctx.lineTo(cx, cy + gs); ctx.lineTo(cx - gs * 0.6, cy);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }

  // Face marks follow their displaced anchor shard, so faces re-form
  // from the new arrangement after a drag.
  for (var fi = 0; fi < faces.length; fi++) {
    var fa = faces[fi];
    var ash = shards[fa.anchor];
    var aoff = dragOffset(ash, t);
    var fx = fa.ax + aoff[0], fy = fa.ay + aoff[1], r = fa.r;
    ctx.fillStyle = COL.oil;
    ctx.strokeStyle = COL.oil;
    ctx.lineCap = 'round';
    // Eyes: abyss shapes, one construction per face.
    var ex = r * 0.38, ey = -r * 0.28, er = r * 0.20;
    if (fa.eyeType === 0) {
      ellipseAt(fx - ex, fy + ey, er, er * 1.25, 0);
      ellipseAt(fx + ex, fy + ey, er, er * 1.25, 0);
      ctx.fillStyle = COL.mirror;
      ellipseAt(fx - ex, fy + ey - er * 0.3, er * 0.18, er * 0.18, 0);
      ellipseAt(fx + ex, fy + ey - er * 0.3, er * 0.18, er * 0.18, 0);
      ctx.fillStyle = COL.oil;
    } else if (fa.eyeType === 1) {
      ellipseAt(fx - ex, fy + ey, er * 1.3, er * 1.5, 0);
      ctx.lineWidth = Math.max(2, r * 0.07);
      ctx.beginPath();
      ctx.moveTo(fx + ex - er, fy + ey + er); ctx.lineTo(fx + ex + er, fy + ey - er);
      ctx.stroke();
    } else if (fa.eyeType === 2) {
      ellipseAt(fx - ex, fy + ey, er * 1.4, er * 1.4, 0);
      ellipseAt(fx + ex, fy + ey, er * 0.55, er * 0.55, 0);
    } else if (fa.eyeType === 3) {
      ctx.lineWidth = Math.max(2, r * 0.09);
      ctx.beginPath();
      ctx.moveTo(fx - ex - er, fy + ey - er * 0.4); ctx.lineTo(fx - ex + er, fy + ey + er * 0.4);
      ctx.moveTo(fx + ex - er, fy + ey + er * 0.4); ctx.lineTo(fx + ex + er, fy + ey - er * 0.4);
      ctx.stroke();
    } else {
      ellipseAt(fx - ex, fy + ey, er, er * 1.2, 0);
      ctx.beginPath();
      ctx.ellipse(fx + ex, fy + ey, er * 0.9, er * 1.1, 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
    // Mouths: twisted oil-stick marks, one construction per face.
    var my = fy + r * 0.38;
    ctx.lineWidth = Math.max(2.5, r * 0.08);
    ctx.beginPath();
    if (fa.mouthType === 0) {
      ctx.moveTo(fx - r * 0.42, my);
      ctx.bezierCurveTo(fx - r * 0.15, my - r * 0.30, fx + r * 0.15, my + r * 0.30, fx + r * 0.42, my);
    } else if (fa.mouthType === 1) {
      ctx.moveTo(fx - r * 0.42, my);
      ctx.lineTo(fx - r * 0.21, my - r * 0.22); ctx.lineTo(fx, my + r * 0.10);
      ctx.lineTo(fx + r * 0.21, my - r * 0.22); ctx.lineTo(fx + r * 0.42, my);
    } else if (fa.mouthType === 2) {
      ctx.beginPath();
      ctx.ellipse(fx, my, r * 0.30, r * 0.22, 0.15, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
    } else if (fa.mouthType === 3) {
      ctx.moveTo(fx - r * 0.40, my - r * 0.15); ctx.lineTo(fx + r * 0.40, my + r * 0.15);
      ctx.moveTo(fx - r * 0.40, my + r * 0.20); ctx.lineTo(fx + r * 0.40, my - r * 0.05);
    } else {
      ctx.moveTo(fx - r * 0.42, my);
      ctx.quadraticCurveTo(fx - r * 0.14, my - r * 0.25, fx + r * 0.14, my + r * 0.05);
      ctx.quadraticCurveTo(fx + r * 0.28, my + r * 0.18, fx + r * 0.42, my - r * 0.10);
    }
    ctx.stroke();
    // Gestural oil-stick strokes bridging the gaps.
    ctx.lineWidth = Math.max(2, r * 0.05);
    for (var st2 = 0; st2 < fa.strokes.length; st2++) {
      var spts = fa.strokes[st2];
      ctx.beginPath();
      ctx.moveTo(spts[0][0] + aoff[0], spts[0][1] + aoff[1]);
      ctx.quadraticCurveTo(
        spts[1][0] + aoff[0], spts[1][1] + aoff[1],
        spts[2][0] + aoff[0], spts[2][1] + aoff[1]);
      ctx.stroke();
    }
    // Touch flash: mirror glint sweep over the face cluster.
    if (faceFlash[fi] > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + faceFlash[fi].toFixed(3) + ')';
      for (var ci = 0; ci < fa.cluster.length; ci++) {
        var cs = shards[fa.cluster[ci]];
        var coff = dragOffset(cs, t);
        var cmoved = [];
        for (var cp = 0; cp < cs.pts.length; cp++) {
          cmoved.push([cs.pts[cp][0] + coff[0], cs.pts[cp][1] + coff[1]]);
        }
        drawShardPoly(cmoved);
      }
    }
  }
}

function size() {
  var vw = 0, vh = 0;
  try {
    if (typeof window !== 'undefined' && window.visualViewport) {
      vw = window.visualViewport.width; vh = window.visualViewport.height;
    }
  } catch (e) {}
  if (!vw) {
    try { vw = window.innerWidth; vh = window.innerHeight; } catch (e2) {}
  }
  if (!vw) { vw = 1280; vh = 900; }
  W = vw; H = vh;
  canvas.width = Math.round(W);
  canvas.height = Math.round(H);
  canvas.style.width = Math.round(W) + 'px';
  canvas.style.height = Math.round(H) + 'px';
  buildLayout();
}

function resize() {
  size();
  draw(pieceTime());
}

try {
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  }
} catch (e) {}

var pDown = null;
function posOf(e) {
  var rect = canvas.getBoundingClientRect();
  return [e.clientX - rect.left, e.clientY - rect.top];
}
canvas.addEventListener('pointerdown', function (e) {
  pDown = { x: e.clientX, y: e.clientY, t: nowMs(), moved: false };
});
canvas.addEventListener('pointermove', function (e) {
  if (!pDown) return;
  if (Math.abs(e.clientX - pDown.x) + Math.abs(e.clientY - pDown.y) > 4) pDown.moved = true;
});
canvas.addEventListener('pointerup', function (e) {
  if (!pDown) return;
  var t = pieceTime();
  var dx = e.clientX - pDown.x, dy = e.clientY - pDown.y;
  var dt = nowMs() - pDown.t;
  var p = posOf(e);
  if (!pDown.moved && Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 400) {
    // Tap: touch a face, never a reload.
    var best = -1, bestD = 1e9;
    for (var f = 0; f < faces.length; f++) {
      var ddx = p[0] - faces[f].ax, ddy = p[1] - faces[f].ay;
      var d = Math.sqrt(ddx * ddx + ddy * ddy);
      if (d < faces[f].r * 1.8 && d < bestD) { best = f; bestD = d; }
    }
    if (best >= 0) touches.push({ face: best, t0: t });
  } else if (pDown.moved) {
    drags.push({ x: pDown.x, y: pDown.y, dx: dx, dy: dy, t0: t });
    if (drags.length > 24) drags.splice(0, drags.length - 24);
  }
  pDown = null;
});

// Frame one: synchronous, exactly t = 0, before any clock starts.
size();
draw(0);
booted = true;

if (typeof requestAnimationFrame !== 'undefined') {
  var loop = function (ts) {
    if (startTs === null) startTs = ts;
    var t = Math.max(0, (ts - startTs) / 1000);
    draw(t);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
