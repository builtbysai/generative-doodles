<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deaf Club</title>
<style>
  html, body { margin: 0; padding: 0; background: #100e0d; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1402000);
  function rr(v) { return Math.round(v * 10000) / 10000; } // node-canvas alpha quirk: no scientific notation
  function rgba(r, g, b, a) { return 'rgba(' + r + ',' + g + ',' + b + ',' + rr(a) + ')'; }

  var AMP_BLACK = '#1a1a18', STAGE_RED = '#b01e24', SIGN_WHITE = '#f2f0e8',
      GOLD = '#f5c542', BG = '#100e0d';
  var SKINS = ['#c89a72', '#8a5a3a', '#e8c4a0'];
  var W = 0, H = 0, phone = false;

  function isPhone() {
    var sw = (typeof window.screen !== 'undefined' && window.screen) ? Math.min(window.screen.width, window.screen.height) : 9999;
    if (sw < 700) return true;
    return H > W * 1.15;
  }
  function resize() {
    var vv = (typeof window.visualViewport !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W; canvas.height = H;
    phone = isPhone();
  }

  // Crowd: seeded once, two rows of flat signing silhouettes.
  var crowd = [];
  (function buildCrowd() {
    var rows = [
      { y: 0.64, n: 9, s: 0.052 },
      { y: 0.84, n: 11, s: 0.068 }
    ];
    for (var r = 0; r < rows.length; r++) {
      for (var i = 0; i < rows[r].n; i++) {
        var j = rnd();
        crowd.push({
          fx: (i + 0.5) / rows[r].n + (j - 0.5) * 0.03,
          fy: rows[r].y + (rnd() - 0.5) * 0.02,
          s: rows[r].s * (0.85 + rnd() * 0.3),
          skin: SKINS[Math.floor(rnd() * 3)],
          ph1: rnd(), ph2: rnd() + 0.5,
          per1: 1.6 + rnd() * 1.4, per2: 1.3 + rnd() * 1.2,
          bob: rnd()
        });
      }
    }
  })();

  var drags = []; // {x, y, t}
  var dragging = false;
  function recordDrag(x, y, t) {
    drags.push({ x: x, y: y, t: t });
    if (drags.length > 200) drags.splice(0, drags.length - 200);
  }
  function gainAt(x, y, t) {
    var g = 1, i, d;
    for (i = 0; i < drags.length; i++) {
      var age = t - drags[i].t;
      if (age < 0 || age > 8) continue;
      var dx = x - drags[i].x, dy = y - drags[i].y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var spread = 0.13 * Math.max(W, H);
      g += 2.5 * Math.exp(-age / 2.5) * Math.exp(-(dist * dist) / (spread * spread));
    }
    return g;
  }

  var BEAT = 0.5; // 120 BPM master clock, closed-form
  function circle(x, y, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  }
  function ring(x, y, r, lw, stroke) {
    if (r <= 0) return;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.lineWidth = lw;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  }

  function draw(t) {
    var u = Math.min(W, H);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // Back wall wash: two quiet dark panels, flat fills only.
    ctx.fillStyle = '#171412';
    ctx.fillRect(0, 0, W, H * 0.42);

    // Amp tower, upper center: three stacked black amps with red trim.
    var tw = W * 0.40, tx = (W - tw) / 2, top = H * 0.05, ah = H * 0.105;
    for (var a = 0; a < 3; a++) {
      var ay = top + a * ah;
      ctx.fillStyle = AMP_BLACK;
      ctx.fillRect(tx, ay, tw, ah - 3);
      ctx.fillStyle = STAGE_RED;
      ctx.fillRect(tx, ay, tw, 3);
      // Speaker cones: two per amp, flat circles with darker centers.
      var cy = ay + ah * 0.52, r1 = ah * 0.30, r2 = ah * 0.20;
      circle(tx + tw * 0.28, cy, r1, '#26221f');
      circle(tx + tw * 0.28, cy, r1 * 0.45, '#0d0c0b');
      circle(tx + tw * 0.72, cy, r2, '#26221f');
      circle(tx + tw * 0.72, cy, r2 * 0.45, '#0d0c0b');
      // Grille dots as filled rects.
      ctx.fillStyle = '#3a352f';
      var gx, gy;
      for (gx = 0; gx < 5; gx++) {
        for (gy = 0; gy < 2; gy++) {
          ctx.fillRect(tx + tw * 0.06 + gx * tw * 0.03, ay + ah * 0.18 + gy * ah * 0.16, 3, 3);
        }
      }
    }

    // Stage platform.
    ctx.fillStyle = STAGE_RED;
    ctx.fillRect(W * 0.14, H * 0.375, W * 0.72, H * 0.022);
    ctx.fillStyle = '#7d1419';
    ctx.fillRect(W * 0.14, H * 0.397, W * 0.72, H * 0.012);

    // Drum kit, stage front center. Kick envelope from the closed-form beat clock.
    var kx = W * 0.5, ky = H * 0.475, kr = u * 0.048;
    var beatIdx = Math.floor(t / BEAT);
    var beatAge = t - beatIdx * BEAT;
    var kickEnv = Math.exp(-beatAge / 0.18);
    var isKick = (beatIdx % 2 === 0);
    var skinR = kr * (1 + (isKick ? kickEnv * 0.12 : 0));
    // Cymbal stand + cymbal, right of kick.
    ctx.fillStyle = '#4a4a44';
    ctx.fillRect(W * 0.62, ky - u * 0.09, 2, u * 0.09);
    circle(W * 0.62, ky - u * 0.095, u * 0.028, GOLD);
    // Snare, left of kick.
    circle(W * 0.38, ky + u * 0.01, u * 0.032, '#8a8f94');
    circle(W * 0.38, ky + u * 0.01, u * 0.018, '#d8d2c4');
    // Kick drum: black shell, skin rippling on kick beats.
    circle(kx, ky, kr, '#0d0c0b');
    circle(kx, ky, skinR * 0.82, '#d8d2c4');
    circle(kx, ky, skinR * 0.30, '#1a1a18');
    // Snare shimmer: thin white ring on snare beats, expanding.
    if (!isKick) {
      var sAge = beatAge;
      ring(W * 0.38, ky + u * 0.01, u * 0.03 + sAge * u * 0.22, 2, rgba(242, 240, 232, 0.6 * (1 - sAge / 1.0)));
    }

    // Shockwaves: closed-form rings from the last few beats, radiating through the crowd.
    for (var k = beatIdx; k >= beatIdx - 2 && k >= 0; k--) {
      var age = t - k * BEAT;
      if (age < 0 || age > 1.2) continue;
      var fade = 1 - age / 1.2;
      var rad = age * Math.max(W, H) * 0.42;
      var kickBeat = (k % 2 === 0);
      if (kickBeat) {
        ring(kx, ky, rad, 3, rgba(245, 197, 66, 0.55 * fade));
        ring(kx, ky, rad * 0.72, 2, rgba(245, 197, 66, 0.30 * fade));
      } else {
        ring(W * 0.38, ky + u * 0.01, rad * 0.8, 2, rgba(242, 240, 232, 0.45 * fade));
      }
    }

    // Crowd: flat signing silhouettes, lower half. Hands loop pseudo-gestures only.
    for (var f = 0; f < crowd.length; f++) {
      var fig = crowd[f];
      var fx = fig.fx * W, fy = fig.fy * H, fs = fig.s * u;
      var gain = gainAt(fx, fy, t);
      var bob = Math.sin((t * 2 + fig.bob * 6.28)) * 0.4 + (isKick ? kickEnv * 2.2 * gain : 0);
      var by = fy + bob;
      // Torso.
      ctx.fillStyle = fig.skin;
      ctx.fillRect(fx - fs * 0.42, by - fs * 0.9, fs * 0.84, fs * 1.5);
      // Head.
      circle(fx, by - fs * 1.35, fs * 0.42, fig.skin);
      // Arms: looped pseudo-gesture arcs, amplitude scaled by local drag gain.
      var a1 = Math.sin(6.2831 * (t / fig.per1 + fig.ph1)) * 0.7 * gain;
      var a2 = Math.sin(6.2831 * (t / fig.per2 + fig.ph2)) * 0.7 * gain;
      var hx1 = fx - fs * 0.42 + Math.sin(a1 - 0.9) * fs * 1.05;
      var hy1 = by - fs * 0.85 + Math.cos(a1 - 0.9) * fs * 1.05;
      var hx2 = fx + fs * 0.42 + Math.sin(0.9 - a2) * fs * 1.05;
      var hy2 = by - fs * 0.85 + Math.cos(0.9 - a2) * fs * 1.05;
      ctx.strokeStyle = fig.skin;
      ctx.lineWidth = Math.max(2, fs * 0.16);
      ctx.beginPath();
      ctx.moveTo(fx - fs * 0.42, by - fs * 0.85);
      ctx.lineTo(hx1, hy1);
      ctx.moveTo(fx + fs * 0.42, by - fs * 0.85);
      ctx.lineTo(hx2, hy2);
      ctx.stroke();
      // Hands: sign-motion white dots (filled rects, node-canvas safe).
      ctx.fillStyle = SIGN_WHITE;
      ctx.fillRect(hx1 - fs * 0.14, hy1 - fs * 0.14, fs * 0.28, fs * 0.28);
      ctx.fillRect(hx2 - fs * 0.14, hy2 - fs * 0.14, fs * 0.28, fs * 0.28);
    }

    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // Interaction: drag across the crowd turns up the vibration locally.
  // Clock: anchored on the first rAF call (rAF timestamps are not epoch time).
  var anchor = null, elapsed = 0;
  function nowT() { return elapsed; }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    recordDrag(e.clientX, e.clientY, nowT());
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var last = drags[drags.length - 1];
    if (last && Math.abs(e.clientX - last.x) + Math.abs(e.clientY - last.y) < 8) return;
    recordDrag(e.clientX, e.clientY, nowT());
  });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });

  resize();
  if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  // Deterministic first frame: draw(0), clock starts only with the rAF loop.
  draw(0);
  function loop(ts) {
    if (anchor === null) anchor = ts;
    var t = (ts - anchor) / 1000;
    if (t < 0) t = 0;
    elapsed = t;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
