<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Recurrence</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a09; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(x, y) {
    var h = Math.imul(x * 374761393 + y * 668265263, 974634211) ^ 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash2(xi, yi), b = hash2(xi + 1, yi);
    var c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, oct) {
    var s = 0, amp = 0.5, f = 1;
    for (var i = 0; i < oct; i++) {
      s += amp * vnoise(x * f, y * f);
      amp *= 0.5; f *= 2.03;
    }
    return s;
  }

  var W = 0, H = 0, isPhone = false;
  var lastT = 0;
  function resize() {
    var vp = (typeof window.visualViewport !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vp ? vp.width : window.innerWidth;
    H = vp ? vp.height : window.innerHeight;
    var sw = (typeof window.screen !== 'undefined' && window.screen) ? window.screen.width : W;
    var sh = (typeof window.screen !== 'undefined' && window.screen) ? window.screen.height : H;
    var minDim = Math.min(sw, sh);
    isPhone = minDim < 700 || (H > W * 1.15 && minDim < 900);
    canvas.width = W; canvas.height = H;
    draw(lastT);
  }
  if (typeof window.visualViewport !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  // Palette (flat fills only).
  var GOLD = '#e0962a', AMBER = '#d4a24e', WATER = '#0e1a20',
      VOID = '#0a0a09', EMBER = '#a8321e', WATERLINE = '#274b57';

  // Drag: recorded samples {dx, t}; scrub decays with tau 4 s, clamped.
  var drags = [];
  var dragging = false, lastX = 0;
  function scrub(t) {
    var s = 0;
    for (var i = 0; i < drags.length; i++) {
      var dt = t - drags[i].t;
      if (dt >= 0) s += drags[i].dx * 0.06 * Math.exp(-dt / 4);
    }
    if (s > 25) s = 25; if (s < -25) s = -25;
    return s;
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX;
    lastX = e.clientX;
    if (dx !== 0) drags.push({ dx: dx, t: lastT });
  });
  function endDrag() { dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // Morph weights over the 60 s cycle: sphere [0,20), hand [20,40), water [40,60).
  // 4 s cross-dissolves at each boundary; the cycle closes exactly at 60 s.
  function smooth(a, b, x) {
    if (x <= a) return 0;
    if (x >= b) return 1;
    var u = (x - a) / (b - a);
    return u * u * (3 - 2 * u);
  }
  function weights(te) {
    var p = te - Math.floor(te / 60) * 60;
    var sph = 1 - smooth(16, 20, p);
    var hnd = smooth(16, 20, p) * (1 - smooth(36, 40, p));
    var wat = smooth(36, 40, p) * (1 - smooth(56, 60, p));
    sph += smooth(56, 60, p);
    if (sph > 1) sph = 1;
    return { s: sph, h: hnd, w: wat, p: p };
  }

  // Seeded sphere swirl dots (angle, radius fraction, size, shade).
  var sphereDots = [];
  (function () {
    var r = mulberry32(1395000);
    for (var i = 0; i < 700; i++) {
      sphereDots.push({
        a: r() * Math.PI * 2,
        rf: Math.sqrt(r()),
        sz: 1.5 + r() * 2.5,
        shade: Math.floor(r() * 3),
        seed: Math.floor(r() * 100000)
      });
    }
  })();

  // Seeded swirl strokes (spiral polylines across the sphere).
  var swirls = [];
  (function () {
    var r = mulberry32(1395000 + 7919);
    for (var i = 0; i < 36; i++) {
      swirls.push({
        a0: r() * Math.PI * 2,
        r0: 0.1 + r() * 0.5,
        turns: 0.6 + r() * 1.1,
        dir: r() < 0.5 ? 1 : -1,
        shade: Math.floor(r() * 3)
      });
    }
  })();

  // Falling grains: fingertip index, fall period, phase offset, size, sway.
  var grains = [];
  (function () {
    var r = mulberry32(1395000 + 2 * 7919);
    for (var i = 0; i < 48; i++) {
      grains.push({
        tip: Math.floor(r() * 4),
        period: 5 + r() * 3,
        off: r(),
        sz: 1.5 + r() * 2,
        sway: 0.5 + r() * 1.5,
        seed: Math.floor(r() * 100000)
      });
    }
  })();

  // Film grain dots: seeded per (dot, quantized 0.5 s index).
  var filmDots = [];
  (function () {
    var r = mulberry32(1395000 + 3 * 7919);
    for (var i = 0; i < 240; i++) {
      filmDots.push({ fx: r(), fy: r(), sz: 1 + r() });
    }
  })();

  function drawSphere(cx, cy, R, t, alpha) {
    if (alpha <= 0.01) return;
    // Cycle phase: all sphere motion is periodic in the 60 s cycle so the
    // loop closes exactly (one full swirl rotation per cycle, periodic
    // noise inputs via sin/cos of phase).
    var p = t - Math.floor(t / 60) * 60;
    var ph = p / 60 * Math.PI * 2;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = GOLD;
    ctx.fill();
    // Swirl strokes: spiral polylines, clipped to the sphere.
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.clip();
    var shades = [AMBER, EMBER, '#f2b95e'];
    for (var i = 0; i < swirls.length; i++) {
      var s = swirls[i];
      ctx.beginPath();
      var steps = 26;
      for (var k = 0; k <= steps; k++) {
        var u = k / steps;
        var rr = (s.r0 + u * 0.45) * R;
        var aa = s.a0 + s.dir * u * s.turns * Math.PI * 2 + ph;
        var nx = fbm(Math.cos(aa) * 2 + s.r0 * 7 + Math.sin(ph) * 0.8, Math.sin(aa) * 2 + Math.cos(ph) * 0.8, 2) - 0.5;
        var px = cx + Math.cos(aa) * rr + nx * R * 0.12;
        var py = cy + Math.sin(aa) * rr + nx * R * 0.12;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = shades[s.shade];
      ctx.lineWidth = Math.max(1, R * 0.012);
      ctx.globalAlpha = alpha * 0.85;
      ctx.stroke();
    }
    // Swirl dots: seeded positions rotated by a closed-form swirl of radius.
    ctx.globalAlpha = alpha;
    for (var j = 0; j < sphereDots.length; j++) {
      var d = sphereDots[j];
      var rot = d.a + (1 - d.rf) * 0.9 + ph;
      var rr2 = d.rf * R;
      var dx = cx + Math.cos(rot) * rr2;
      var dy = cy + Math.sin(rot) * rr2;
      var n = fbm(dx / R * 2 + d.seed * 0.001, dy / R * 2, 2);
      ctx.fillStyle = shades[d.shade];
      ctx.globalAlpha = alpha * (0.35 + 0.65 * n);
      ctx.fillRect(dx - d.sz / 2, dy - d.sz / 2, d.sz, d.sz);
    }
    ctx.restore();
    ctx.restore();
  }

  // Hand silhouette: palm polygon + 4 finger quads + thumb, grains fall from tips.
  // Returns fingertip positions (for grains) in frame coordinates.
  function drawHand(cx, cy, R, t, alpha) {
    if (alpha <= 0.01) return [];
    var scale = R / 100;
    var palmW = 46 * scale, palmH = 52 * scale;
    var top = cy - R * 0.55;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = AMBER;
    // Palm polygon.
    ctx.beginPath();
    ctx.moveTo(cx - palmW / 2, top + palmH);
    ctx.lineTo(cx - palmW / 2, top + palmH * 0.35);
    ctx.lineTo(cx - palmW * 0.28, top);
    ctx.lineTo(cx + palmW * 0.28, top);
    ctx.lineTo(cx + palmW / 2, top + palmH * 0.35);
    ctx.lineTo(cx + palmW / 2, top + palmH);
    ctx.closePath();
    ctx.fill();
    // Fingers: 4 tapered quads, slight fan, lengths vary.
    var tips = [];
    var fan = [-0.28, -0.09, 0.09, 0.28];
    var len = [34, 44, 42, 32];
    for (var i = 0; i < 4; i++) {
      var bx = cx + fan[i] * palmW;
      var fl = len[i] * scale;
      var tipX = bx + Math.sin(fan[i]) * fl;
      var tipY = top - fl * Math.cos(fan[i]);
      var wHalf = 7 * scale;
      ctx.beginPath();
      ctx.moveTo(bx - wHalf, top + 2);
      ctx.lineTo(bx + wHalf, top + 2);
      ctx.lineTo(tipX + wHalf * 0.55, tipY);
      ctx.lineTo(tipX - wHalf * 0.55, tipY);
      ctx.closePath();
      ctx.fill();
      tips.push({ x: tipX, y: tipY });
    }
    // Thumb: short quad off the palm's right side.
    ctx.beginPath();
    ctx.moveTo(cx + palmW / 2, top + palmH * 0.55);
    ctx.lineTo(cx + palmW / 2 + 20 * scale, top + palmH * 0.35);
    ctx.lineTo(cx + palmW / 2 + 16 * scale, top + palmH * 0.55);
    ctx.lineTo(cx + palmW / 2, top + palmH * 0.75);
    ctx.closePath();
    ctx.fill();
    // Wrist: short taper below the palm.
    ctx.beginPath();
    ctx.moveTo(cx - palmW * 0.32, top + palmH);
    ctx.lineTo(cx + palmW * 0.32, top + palmH);
    ctx.lineTo(cx + palmW * 0.22, top + palmH + 26 * scale);
    ctx.lineTo(cx - palmW * 0.22, top + palmH + 26 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    return tips;
  }

  function draw(tReal) {
    lastT = tReal;
    if (!W || !H) return;
    var te = tReal + scrub(tReal);
    var w = weights(te);
    var cx = W / 2, cy = H / 2;
    var R = Math.min(W, H) * 0.27;
    // Film-frame jitter: seeded function of quantized 0.25 s time, 1-2 px.
    // Wrapped mod 240 (60 s x 4) so the jitter closes exactly with the cycle.
    var q = Math.floor(te * 4) % 240;
    var jx = (hash2(q, 11) - 0.5) * 3;
    var jy = (hash2(q, 23) - 0.5) * 3;
    cx += jx; cy += jy;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = VOID;
    ctx.fillRect(0, 0, W, H);

    // Water state: dark band with ripple rings and wave lines, dead center.
    if (w.w > 0.01) {
      var ww = R * 2.3, wh = R * 0.85;
      ctx.save();
      ctx.globalAlpha = w.w;
      ctx.fillStyle = WATER;
      ctx.beginPath();
      ctx.ellipse(cx, cy + R * 0.15, ww / 2, wh / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      // Ripple rings from grain landings: periodic landings, closed-form age.
      var waterY = cy + R * 0.15;
      ctx.lineWidth = Math.max(1, R * 0.008);
      for (var gi = 0; gi < grains.length; gi++) {
        var g = grains[gi];
        var fallDur = g.period * 0.55;
        var cyc = Math.floor((te - g.off * g.period) / g.period);
        var landT = (cyc + g.off) * g.period + fallDur;
        var age = te - landT;
        if (age >= 0 && age < 2.5) {
          var lx = cx + (hash2(g.seed, 5) - 0.5) * ww * 0.7;
          ctx.globalAlpha = w.w * (1 - age / 2.5) * 0.8;
          ctx.strokeStyle = WATERLINE;
          ctx.beginPath();
          ctx.ellipse(lx, waterY, age * R * 0.28 + 2, age * R * 0.09 + 1, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      // Wave lines: sine lines perturbed by the shared noise field.
      ctx.globalAlpha = w.w * 0.7;
      ctx.strokeStyle = WATERLINE;
      for (var wl = 0; wl < 4; wl++) {
        var wy = cy + R * 0.15 + (wl - 1.5) * R * 0.16;
        ctx.beginPath();
        for (var x = cx - ww / 2; x <= cx + ww / 2; x += 8) {
          var n = fbm(x / R * 1.5, wl * 3.7 + te * 0.05, 2) - 0.5;
          var py = wy + Math.sin(x / R * 2.2 + te * 0.4 + wl) * R * 0.03 + n * R * 0.08;
          if (x === cx - ww / 2) ctx.moveTo(x, py); else ctx.lineTo(x, py);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    // Sphere state.
    drawSphere(cx, cy, R, te, w.s);

    // Hand state + falling grains.
    var tips = drawHand(cx, cy, R, te, w.h);
    if (w.h > 0.01 && tips.length === 4) {
      var fallTop = cy - R * 0.55;
      var waterY2 = cy + R * 0.15;
      var fallDist = waterY2 - fallTop;
      ctx.save();
      ctx.globalAlpha = w.h;
      ctx.fillStyle = AMBER;
      for (var k = 0; k < grains.length; k++) {
        var gr = grains[k];
        var tip = tips[gr.tip];
        var phase = ((te / gr.period + gr.off) % 1 + 1) % 1;
        var gy = tip.y + phase * fallDist;
        var gx = tip.x + Math.sin(te * 1.3 + gr.seed * 0.01) * gr.sway * 4;
        ctx.globalAlpha = w.h * (0.6 + 0.4 * Math.sin(phase * Math.PI));
        ctx.fillRect(gx - gr.sz / 2, gy - gr.sz / 2, gr.sz, gr.sz);
      }
      ctx.restore();
    }

    // Film grain: seeded dots keyed by (dot, quantized 0.5 s index).
    // Wrapped mod 120 (60 s x 2) so the grain closes exactly with the cycle.
    var qg = Math.floor(te * 2) % 120;
    ctx.save();
    ctx.fillStyle = '#e8e6dc';
    for (var di = 0; di < filmDots.length; di++) {
      var fd = filmDots[di];
      var gx2 = hash2(di, qg) * W;
      var gy2 = hash2(qg, di) * H;
      ctx.globalAlpha = 0.05;
      ctx.fillRect(gx2, gy2, fd.sz, fd.sz);
    }
    ctx.restore();
  }

  function loop(ts) {
    if (typeof startTime === 'undefined') return;
    var t = (ts - startTime) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  var startTime = 0;
  function startLoop(ts) {
    startTime = ts;
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }

  resize();
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(startLoop);
})();
</script>
</body>
</html>
