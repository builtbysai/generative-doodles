<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Del Mapocho al Plomo</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1A2233; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.678 "Del Mapocho al Plomo" (EXPANSION #82 clemente-mckay,
  // block 6). His HUELLA ANDINA cycle as a sounded ascent: one line,
  // the Mapocho itself, traverses the frame from the valley floor at
  // lower-left to Cerro El Plomo at 5400 m, upper-right. Dragging
  // along the line ascends; altitude drives a thin, airy soundscape
  // (river hiss below, wind rising, breath tones at the offering
  // waypoints, near-silence under a pulsing sun at the summit).
  // Release and the place holds, then drifts slowly back to the
  // valley over about twenty seconds. Audio is created lazily on
  // the first pointer press; without a gesture the piece is silent
  // and complete. The only words are the three altitude marks.

  var GREEN = '#4A5A3A';  // valley green
  var RIVER = '#3E7A8C';  // river
  var STONE = '#8A8378';  // stone
  var SNOW  = '#E8ECEF';  // snow
  var SKY   = '#1A2233';  // sky dusk
  var CLAY  = '#A4552F';  // offering clay

  var FW = 1.0, FH = 1.0;
  var BASE_SEED = 678001;
  var STEPS = 560;        // path resolution for projection + drawing
  var DRIFT = 20;         // seconds to drift back to the valley
  var PENTA = [293.66, 329.63, 392.0, 440.0, 523.25]; // D E G A C

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(a, b, v) { var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mixc(h1, h2, t) {
    var a = hexRGB(h1), b = hexRGB(h2);
    return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' +
      Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
  }

  // ------------------------------------------------------------------
  // THE TRAVERSE. Waypoints in composition space (x right, y down).
  // A Catmull-Rom spline runs through them: meandering river across
  // the valley floor, then switchbacks up to the peak. The arc-length
  // parameter s in [0,1] IS the altitude parameter (0 m to 5400 m).
  // ------------------------------------------------------------------
  var WAY = [
    [0.055, 0.845], [0.105, 0.815], [0.150, 0.852], [0.195, 0.818],
    [0.240, 0.800], [0.285, 0.832], [0.325, 0.795],
    [0.400, 0.760], [0.345, 0.700], [0.420, 0.648], [0.490, 0.680],
    [0.450, 0.600], [0.530, 0.555], [0.610, 0.585], [0.565, 0.500],
    [0.645, 0.455], [0.720, 0.480], [0.680, 0.405], [0.755, 0.360],
    [0.820, 0.385], [0.795, 0.315], [0.860, 0.262], [0.925, 0.205]
  ];
  var PATH = [];       // {x, y, cum} at uniform-ish steps
  var PATH_LEN = 0;
  (function buildPath() {
    var raw = [];
    var n = WAY.length;
    function pt(i) { return WAY[clamp(i, 0, n - 1)]; }
    var i, j;
    for (i = 0; i < n - 1; i++) {
      var p0 = pt(i - 1), p1 = pt(i), p2 = pt(i + 1), p3 = pt(i + 2);
      for (j = 0; j < 24; j++) {
        var u = j / 24, u2 = u * u, u3 = u2 * u;
        raw.push([
          0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
          0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)
        ]);
      }
    }
    raw.push([WAY[n - 1][0], WAY[n - 1][1]]);
    var cum = 0;
    for (i = 0; i < raw.length; i++) {
      if (i > 0) cum += Math.hypot(raw[i][0] - raw[i - 1][0], raw[i][1] - raw[i - 1][1]);
      PATH.push({ x: raw[i][0], y: raw[i][1], cum: cum });
    }
    PATH_LEN = cum;
    // Resample to STEPS points uniform in arc length.
    var uni = [];
    var seg = 0;
    for (i = 0; i <= STEPS; i++) {
      var target = PATH_LEN * i / STEPS;
      while (seg < PATH.length - 2 && PATH[seg + 1].cum < target) seg++;
      var a = PATH[seg], b = PATH[seg + 1];
      var span = Math.max(1e-6, b.cum - a.cum);
      var f = clamp((target - a.cum) / span, 0, 1);
      uni.push({ x: lerp(a.x, b.x, f), y: lerp(a.y, b.y, f), cum: target });
    }
    PATH = uni;
  })();
  function pathPoint(s) {
    var f = clamp(s, 0, 1) * STEPS;
    var i = Math.min(STEPS - 1, Math.floor(f));
    var r = f - i;
    return {
      x: lerp(PATH[i].x, PATH[i + 1].x, r),
      y: lerp(PATH[i].y, PATH[i + 1].y, r)
    };
  }
  function nearestS(cx, cy) {
    var best = 0, bd = Infinity;
    for (var i = 0; i <= STEPS; i += 2) {
      var dx = PATH[i].x - cx, dy = PATH[i].y - cy;
      var d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    var lo = Math.max(0, best - 2), hi = Math.min(STEPS, best + 2);
    for (var j = lo; j <= hi; j++) {
      var ex = PATH[j].x - cx, ey = PATH[j].y - cy;
      var dd = ex * ex + ey * ey;
      if (dd < bd) { bd = dd; best = j; }
    }
    return best / STEPS;
  }

  // Ridge silhouette the path climbs: a few fixed fractions across,
  // heights following the ascent with seeded jitter.
  var RIDGE = (function () {
    var rnd = mulberry32(BASE_SEED);
    var fr = [0, 0.10, 0.22, 0.34, 0.46, 0.58, 0.70, 0.80, 0.88, 0.945, 1];
    var ht = [0.845, 0.815, 0.795, 0.735, 0.660, 0.575, 0.480, 0.395, 0.300, 0.225, 0.165];
    var pts = [];
    for (var i = 0; i < fr.length; i++) {
      pts.push([fr[i], ht[i] + (i > 0 && i < fr.length - 1 ? (rnd() - 0.5) * 0.018 : 0)]);
    }
    return pts;
  })();
  function ridgeY(x) {
    for (var i = 0; i < RIDGE.length - 1; i++) {
      var a = RIDGE[i], b = RIDGE[i + 1];
      if (x >= a[0] && x <= b[0]) {
        var t = (x - a[0]) / Math.max(1e-6, b[0] - a[0]);
        return lerp(a[1], b[1], t * t * (3 - 2 * t));
      }
    }
    return RIDGE[RIDGE.length - 1][1];
  }

  // Waypoints for the figurine clusters: source, mid, summit.
  var WAYPOINTS = [0.03, 0.52, 0.985];
  // Textile bands at two crossings (s values), with seeded stripes.
  var TEXTILES = (function () {
    var rnd = mulberry32(BASE_SEED + 7);
    var defs = [{ s: 0.33, ang: -0.35 }, { s: 0.70, ang: 0.30 }];
    for (var i = 0; i < defs.length; i++) {
      defs[i].stripes = [];
      var acc = 0;
      while (acc < 1) {
        var wdt = 0.10 + rnd() * 0.20;
        defs[i].stripes.push({ o: acc, w: Math.min(wdt, 1 - acc), c: Math.floor(rnd() * 4) });
        acc += wdt;
      }
    }
    return defs;
  })();
  var TEX_COLORS = [CLAY, STONE, RIVER, SNOW];

  // ------------------------------------------------------------------
  // Audio. Lazily created on the first pointer press (autoplay
  // policy). One shared looping noise buffer feeds three layers:
  // river hiss (lowpass, strong in the valley), mid wind (bandpass
  // around 500 Hz, fades in through the middle heights), high wind
  // (bandpass around 1800 Hz, thin, at the summit). Discrete tones:
  // a soft pentatonic breath tone when the marker passes an
  // offering waypoint (rising edge), sparse quiet bird tones in the
  // valley (seeded schedule on the anchored clock). All gains stay
  // low: the loudest layer peaks at 0.06 master.
  // ------------------------------------------------------------------
  var audioCtx = null;
  var audioNodes = null;
  var audioTried = false;
  function unlockAudio() {
    if (audioTried) return;
    audioTried = true;
    try {
      var AC = (typeof window !== 'undefined') &&
        (window.AudioContext || window.webkitAudioContext);
      if (!AC) return;
      audioCtx = new AC();
      var sr = audioCtx.sampleRate;
      var len = Math.floor(sr * 2);
      var buffer = audioCtx.createBuffer(1, len, sr);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      var master = audioCtx.createGain();
      master.gain.value = 0.9;
      master.connect(audioCtx.destination);
      function layer(type, freq, q, g0) {
        var src = audioCtx.createBufferSource();
        src.buffer = buffer;
        src.loop = true;
        src.playbackRate.value = 0.85 + Math.random() * 0.3;
        var filt = audioCtx.createBiquadFilter();
        filt.type = type;
        filt.frequency.value = freq;
        filt.Q.value = q;
        var gain = audioCtx.createGain();
        gain.gain.value = g0;
        src.connect(filt); filt.connect(gain); gain.connect(master);
        src.start();
        return { filt: filt, gain: gain };
      }
      audioNodes = {
        master: master,
        river: layer('lowpass', 420, 0.4, 0.05),
        mid: layer('bandpass', 520, 0.7, 0.0),
        high: layer('bandpass', 1800, 1.1, 0.0)
      };
    } catch (err) { audioCtx = null; audioNodes = null; }
  }
  function breathTone(freq) {
    if (!audioCtx || !audioNodes) return;
    try {
      if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
      var t = audioCtx.currentTime;
      var dur = 1.6;
      var osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var og = audioCtx.createGain();
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(0.055, t + 0.35);
      og.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      var sr = audioCtx.sampleRate;
      var nlen = Math.floor(sr * dur);
      var nbuf = audioCtx.createBuffer(1, nlen, sr);
      var nd = nbuf.getChannelData(0);
      for (var i = 0; i < nlen; i++) nd[i] = Math.random() * 2 - 1;
      var nsrc = audioCtx.createBufferSource();
      nsrc.buffer = nbuf;
      var nf = audioCtx.createBiquadFilter();
      nf.type = 'bandpass';
      nf.frequency.value = freq * 2;
      nf.Q.value = 1.4;
      var ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.exponentialRampToValueAtTime(0.016, t + 0.3);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(og); og.connect(audioNodes.master);
      nsrc.connect(nf); nf.connect(ng); ng.connect(audioNodes.master);
      osc.start(t); osc.stop(t + dur);
      nsrc.start(t); nsrc.stop(t + dur);
    } catch (err) { /* tones are ornaments; never break the piece */ }
  }
  function birdTone() {
    if (!audioCtx || !audioNodes) return;
    try {
      if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
      var t = audioCtx.currentTime;
      var f0 = 1750 + Math.random() * 500;
      var osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(f0 * (1.15 + Math.random() * 0.2), t + 0.07);
      osc.frequency.exponentialRampToValueAtTime(f0 * 0.9, t + 0.16);
      var g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.018, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      osc.connect(g); g.connect(audioNodes.master);
      osc.start(t); osc.stop(t + 0.25);
    } catch (err) { /* ignore */ }
  }
  function updateAudio(alt) {
    if (!audioCtx || !audioNodes) return;
    try {
      if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
      var t = audioCtx.currentTime;
      var river = 0.055 * (1 - smooth(0.0, 0.45, alt));
      var mid = 0.045 * smooth(0.18, 0.5, alt) * (1 - smooth(0.62, 0.95, alt));
      var high = 0.026 * smooth(0.6, 1.0, alt);
      audioNodes.river.gain.gain.setTargetAtTime(river, t, 0.25);
      audioNodes.mid.gain.gain.setTargetAtTime(mid, t, 0.25);
      audioNodes.high.gain.gain.setTargetAtTime(high, t, 0.25);
      audioNodes.high.filt.frequency.setTargetAtTime(1600 + 700 * alt, t, 0.4);
    } catch (err) { /* ignore */ }
  }

  // ------------------------------------------------------------------
  // Canvas, sizing, house rules.
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var scale = 1, orgX = 0, orgY = 0;
  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr) isPhone = Math.min(scr.width, scr.height) < 700;
    else isPhone = h > w * 1.15;
    scale = Math.min(W / FW, H / FH);
    orgX = (W - FW * scale) / 2;
    orgY = (H - FH * scale) / 2;
  }
  function px(x) { return orgX + x * scale; }
  function py(y) { return orgY + y * scale; }
  function toComp(clientX, clientY) {
    return { x: (clientX - orgX) / scale, y: (clientY - orgY) / scale };
  }
  function dot(x, y, r, color, alpha) {
    if (alpha <= 0.004) return;
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(px(x), py(y), Math.max(0.5, r * scale), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // Scene drawing.
  // ------------------------------------------------------------------
  function drawTerrain() {
    // Slope fill: stone at partial alpha over the dusk sky.
    ctx.beginPath();
    ctx.moveTo(px(0), py(ridgeY(0)));
    var i;
    for (i = 1; i <= 40; i++) {
      var x = i / 40;
      ctx.lineTo(px(x), py(ridgeY(x)));
    }
    ctx.lineTo(px(1), py(1));
    ctx.lineTo(px(0), py(1));
    ctx.closePath();
    ctx.fillStyle = STONE;
    ctx.globalAlpha = 0.30;
    ctx.fill();
    ctx.globalAlpha = 1;
    // Valley band: a soft wash of green laid over the low stretch
    // only, feathering into the slope's stone well before the climb.
    for (i = 0; i < 30; i++) {
      var vx0 = i / 30 * 0.40, vx1 = vx0 + 0.40 / 30 * 1.6;
      ctx.beginPath();
      ctx.moveTo(px(vx0), py(ridgeY(vx0)));
      ctx.lineTo(px(vx1), py(ridgeY(vx1)));
      ctx.lineTo(px(vx1), py(1));
      ctx.lineTo(px(vx0), py(1));
      ctx.closePath();
      ctx.fillStyle = GREEN;
      var fadeIn = Math.min(1, i / 6);
      var fadeOut = 1 - smooth(0.5, 1.0, i / 30);
      ctx.globalAlpha = 0.19 * fadeIn * fadeOut;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Snow cap near the peak, hugging the ridge crest, its lower
    // edge feathered with a few tongues reaching down the face.
    var capTop = [[0.83, ridgeY(0.83)], [0.875, ridgeY(0.875)], [0.92, ridgeY(0.92)],
                  [0.96, ridgeY(0.96)], [1.0, ridgeY(1.0)]];
    var tongue = [0.070, 0.028, 0.085, 0.040, 0.095];
    ctx.beginPath();
    for (i = 0; i < capTop.length; i++) {
      if (i === 0) ctx.moveTo(px(capTop[i][0]), py(capTop[i][1]));
      else ctx.lineTo(px(capTop[i][0]), py(capTop[i][1]));
    }
    for (i = capTop.length - 1; i >= 0; i--) {
      ctx.lineTo(px(capTop[i][0]), py(capTop[i][1] + tongue[i]));
    }
    ctx.closePath();
    ctx.fillStyle = SNOW;
    ctx.globalAlpha = 0.88;
    ctx.fill();
    ctx.globalAlpha = 1;
    // Ridge crest line.
    ctx.strokeStyle = STONE;
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = Math.max(0.7, 0.0016 * scale);
    ctx.beginPath();
    ctx.moveTo(px(0), py(ridgeY(0)));
    for (i = 1; i <= 40; i++) {
      var cx = i / 40;
      ctx.lineTo(px(cx), py(ridgeY(cx)));
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function segColor(u) {
    // u along the whole line: river, then green bank, stone, snow.
    if (u < 0.24) return RIVER;
    if (u < 0.42) return mixc(RIVER, STONE, (u - 0.24) / 0.18);
    if (u < 0.78) return STONE;
    return mixc(STONE, SNOW, (u - 0.78) / 0.22);
  }
  function drawPath() {
    var SEG = 56;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var k = 0; k < SEG; k++) {
      var u0 = k / SEG, u1 = (k + 1) / SEG;
      ctx.strokeStyle = segColor((u0 + u1) / 2);
      ctx.globalAlpha = 0.95;
      ctx.lineWidth = Math.max(1.0, 0.0032 * scale);
      ctx.beginPath();
      for (var i = 0; i <= 10; i++) {
        var p = pathPoint(u0 + (u1 - u0) * i / 10);
        if (i === 0) ctx.moveTo(px(p.x), py(p.y)); else ctx.lineTo(px(p.x), py(p.y));
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function drawFootsteps() {
    // Paired dots trailing the route, offset perpendicular.
    ctx.fillStyle = STONE;
    for (var i = 0; i < 44; i++) {
      var s = 0.02 + 0.96 * i / 43;
      var p = pathPoint(s);
      var q = pathPoint(Math.min(1, s + 0.004));
      var dx = q.x - p.x, dy = q.y - p.y;
      var len = Math.max(1e-5, Math.hypot(dx, dy));
      var nx = -dy / len, ny = dx / len;
      var side = (i % 2 === 0) ? 1 : -1;
      var ox = nx * 0.0075 * side, oy = ny * 0.0075 * side + 0.006;
      ctx.globalAlpha = 0.38;
      ctx.beginPath();
      ctx.arc(px(p.x + ox), py(p.y + oy), Math.max(0.5, 0.0021 * scale), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawTextile(def) {
    var p = pathPoint(def.s);
    var cx = px(p.x), cy = py(p.y) + 0.026 * scale;
    var w = 0.052 * scale, h = 0.034 * scale;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(def.ang);
    var acc = 0;
    for (var i = 0; i < def.stripes.length; i++) {
      var st = def.stripes[i];
      ctx.fillStyle = TEX_COLORS[st.c];
      ctx.globalAlpha = 0.88;
      ctx.fillRect(-w / 2 + acc * w, -h / 2, st.w * w, h);
      acc += st.w;
    }
    // Woven cross-ticks.
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = SKY;
    for (var tx = -w / 2 + w * 0.08; tx < w / 2; tx += w * 0.16) {
      ctx.fillRect(tx, -h / 2, Math.max(0.6, w * 0.02), h);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  function drawFigurine(bx, by, u, flip) {
    // Tiny clay offering figure in local units: u = height.
    ctx.save();
    ctx.translate(px(bx), py(by));
    ctx.scale(flip * u * scale, u * scale);
    ctx.fillStyle = CLAY;
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); // head
    ctx.arc(0, -0.86, 0.16, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath(); // body: rounded trapezoid
    ctx.moveTo(-0.20, 0);
    ctx.lineTo(-0.15, -0.68);
    ctx.quadraticCurveTo(0, -0.80, 0.15, -0.68);
    ctx.lineTo(0.20, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = CLAY;
    ctx.globalAlpha = 0.95;
    ctx.lineWidth = 0.10;
    ctx.lineCap = 'round';
    ctx.beginPath(); // stub arms
    ctx.moveTo(-0.16, -0.55);
    ctx.lineTo(-0.32, -0.32);
    ctx.moveTo(0.16, -0.55);
    ctx.lineTo(0.32, -0.32);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  function drawFigurines(wi) {
    var s = WAYPOINTS[wi];
    var p = pathPoint(s);
    var n = wi === 1 ? 3 : 2;
    var u = wi === 2 ? 0.020 : 0.024;
    for (var i = 0; i < n; i++) {
      var fx = p.x - 0.016 + i * 0.0165;
      var fy = p.y - 0.004 - ((i % 2) * 0.003);
      drawFigurine(fx, fy, u, i % 2 === 0 ? 1 : -1);
    }
  }
  function drawSun(t, alt) {
    var p = pathPoint(1);
    var cx = p.x - 0.010, cy = p.y - 0.058;
    var near = smooth(0.75, 1.0, alt);
    var pulse = 1 + 0.10 * Math.sin(t * (Math.PI * 2 / 3.6)) * (0.35 + 0.65 * near);
    var r = 0.026 * pulse;
    ctx.strokeStyle = SNOW;
    ctx.globalAlpha = 0.30 + 0.30 * near;
    ctx.lineWidth = Math.max(0.7, 0.0014 * scale);
    ctx.beginPath();
    ctx.arc(px(cx), py(cy), (r + 0.011) * scale, 0, Math.PI * 2);
    ctx.stroke();
    dot(cx, cy, r, SNOW, 0.95);
  }
  // frameT is set from the clock value at the top of every draw(),
  // so all animation stays a pure function of that value.
  var frameT = 0;
  function drawMarker(alt) {
    var p = pathPoint(alt);
    var glow = 1 + 0.18 * Math.sin(frameT * 3.4);
    dot(p.x, p.y, 0.0105 * glow, SNOW, 0.22);
    dot(p.x, p.y, 0.0058, SNOW, 0.95);
    dot(p.x, p.y, 0.0024, CLAY, 1);
  }
  function drawAltMark(s, label, dxOff) {
    var p = pathPoint(s);
    ctx.fillStyle = SNOW;
    ctx.globalAlpha = 0.78;
    ctx.font = '500 ' + Math.max(9, Math.round(0.020 * scale)) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, px(p.x + dxOff), py(p.y + 0.038));
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // Ascent state. alt is driven entirely by recorded pointer events
  // plus the release time, evaluated on the anchored clock: while
  // dragging it tracks the pointer's path projection; after release
  // it holds for 2.5 s, then eases back to 0 over DRIFT seconds.
  // ------------------------------------------------------------------
  var mode = 'idle';           // 'idle' | 'drag' | 'hold'
  var dragAlt = 0;
  var releaseAlt = 0;
  var releaseTime = 0;
  function currentAlt(t) {
    if (mode === 'drag') return dragAlt;
    if (mode === 'hold') {
      var e = t - releaseTime;
      if (e < 2.5) return releaseAlt;
      var f = clamp((e - 2.5) / DRIFT, 0, 1);
      var ease = f * f * (3 - 2 * f);
      return releaseAlt * (1 - ease);
    }
    return 0;
  }

  // Waypoint pass detection (rising edge) for breath tones, and the
  // seeded valley bird schedule.
  var wasNear = [false, false, false];
  var lastBirdStep = -1;
  function onAlt(alt, t) {
    for (var i = 0; i < 3; i++) {
      var near = Math.abs(alt - WAYPOINTS[i]) < 0.012;
      if (near && !wasNear[i]) {
        var rndTone = mulberry32(BASE_SEED + i * 131 + Math.floor(t))();
        breathTone(PENTA[Math.floor(rndTone * PENTA.length) % PENTA.length]);
      }
      wasNear[i] = near;
    }
    if (alt < 0.22) {
      var step = Math.floor(t / 7);
      if (step !== lastBirdStep) {
        lastBirdStep = step;
        var rndBird = mulberry32(BASE_SEED + 999 + step)();
        if (rndBird < 0.45) birdTone();
      }
    }
  }

  // ------------------------------------------------------------------
  // Interaction.
  // ------------------------------------------------------------------
  function evPos(ev) {
    if (ev.clientX !== undefined) return { x: ev.clientX, y: ev.clientY };
    if (ev.touches && ev.touches.length) return { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
    if (ev.changedTouches && ev.changedTouches.length) return { x: ev.changedTouches[0].clientX, y: ev.changedTouches[0].clientY };
    return { x: 0, y: 0 };
  }
  function onDown(ev) {
    unlockAudio();
    var p = evPos(ev);
    var c = toComp(p.x, p.y);
    mode = 'drag';
    dragAlt = nearestS(clamp(c.x, 0, 1), clamp(c.y, 0, 1));
    if (ev.preventDefault) ev.preventDefault();
  }
  function onMove(ev) {
    if (mode !== 'drag') return;
    var p = evPos(ev);
    var c = toComp(p.x, p.y);
    dragAlt = nearestS(clamp(c.x, 0, 1), clamp(c.y, 0, 1));
  }
  function onUp() {
    if (mode !== 'drag') return;
    mode = 'hold';
    releaseAlt = dragAlt;
    releaseTime = elapsed();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('touchstart', onDown);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onUp);
    window.addEventListener('resize', function () { resize(); draw(); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
    }
  }

  // ------------------------------------------------------------------
  // Clock and main draw. Frame one is an explicit synchronous draw
  // at t = 0, altitude 0. Nothing reads Date.now().
  // ------------------------------------------------------------------
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - t0) / 1000;
    }
    return 0;
  }
  function draw(tOverride) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var t = (typeof tOverride === 'number') ? tOverride : elapsed();
    frameT = t;
    var alt = (typeof tOverride === 'number') ? 0 : currentAlt(t);
    ctx.fillStyle = SKY;
    ctx.fillRect(0, 0, W, H);
    drawTerrain();
    drawPath();
    drawFootsteps();
    for (var i = 0; i < TEXTILES.length; i++) drawTextile(TEXTILES[i]);
    for (var wpi = 0; wpi < 3; wpi++) drawFigurines(wpi);
    drawSun(t, alt);
    drawAltMark(0.0, '0 m', 0.012);
    drawAltMark(0.5, '2700 m', 0.0);
    drawAltMark(1.0, '5400 m', -0.028);
    drawMarker(alt);
    if (typeof tOverride !== 'number') {
      updateAudio(alt);
      onAlt(alt, t);
    }
  }

  // QA hook: ?seed=t<seconds> forces a fixed frame time (altitude
  // stays 0), so states can be rendered headlessly.
  var forcedT = -1;
  try {
    var m = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(
      (typeof location !== 'undefined' && location.search) || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (err) { forcedT = -1; }

  resize();
  draw(forcedT >= 0 ? forcedT : 0);
  if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
