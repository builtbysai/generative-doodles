<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№630 Small Figure, Huge Sea</title>
<style>
  html, body { margin: 0; padding: 0; background: #bdbfc2; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Small Figure, Huge Sea, TL4 / PP1218, study #257 theodora-laird.
  // A vast black-and-white coastline: slow heavy surf, spray
  // exploding off rocks, sky as one gray gradient. At the
  // waterline stands a single tiny human figure, barely taller
  // than the wavelets at her feet. The sea does everything; the
  // figure does almost nothing. Once per tide cycle she raises
  // one arm, holds it against the scale, and lowers it. That is
  // the whole performance. Watch-only.
  var SKYT = '#c4c6c9';  // sky top, pale gray
  var SKYB = '#9ea1a4';  // sky bottom, mid gray
  var SEA = '#6e7276';   // sea, mid gray
  var SEAD = '#565a5e';  // swell shadow gray
  var SEAL = '#82868a';  // swell light gray
  var FOAM = '#e9e9e6';  // foam, near white
  var SPRAY = '#f4f4f2'; // spray, white
  var ROCK = '#16181a';  // rocks, near black
  var ROCKL = '#2a2d30'; // rock highlight gray
  var FIG = '#141516';   // figure, dark silhouette
  var INK = '#1c1e20';   // text ink, near black
  var PILL = '#f2f2f0';  // hint pill, near white

  // Fixed-phase first frame: FIRST_T = 16 s. The tide cycle is
  // 24 s. The arm raise starts at phase 14, is fully raised by
  // phase 15, holds through phase 17, and is down again by
  // phase 18. At t = 16 the phase is 16, so the figure's arm is
  // fully raised and held against the scale. The swells are
  // mid-cycle, spray is bursting at the left rock line.
  var FIRST_T = 16;
  var SEED = 1971;
  var CYCLE = 24;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and fixed salts, so every frame is a pure
  // function of t.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  var L = {};
  function layout() {
    L.horizonY = H * 0.333;
    L.shoreY = H * 0.66;      // waterline, where the figure stands
    L.figX = W * 0.62;        // figure off-center right
    L.figH = H * 0.052;       // figure height: tiny, a scale marker
    L.rockLx = W * 0.17;      // left rock cluster, clear of the side text
    L.rockRx = W * 0.92;      // right rock cluster
    L.sideX = Math.max(14, W * 0.045);
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Tide cycle and the one gesture --------------------------
  // Arm raise: 0 = down at her side, 1 = fully raised.
  // Phase 14 to 15 rises, 15 to 17 holds, 17 to 18 lowers.
  function armRaise(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    if (p < 14 || p >= 18) { return 0; }
    if (p < 15) { return (p - 14) / 1; }
    if (p < 17) { return 1; }
    return (18 - p) / 1;
  }

  // ---- Sky ------------------------------------------------------
  function drawSky(t) {
    var g = ctx.createLinearGradient(0, 0, 0, L.horizonY);
    g.addColorStop(0, SKYT);
    g.addColorStop(1, SKYB);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, L.horizonY + 1);
    // One faint slow cloud band, barely darker than the sky.
    ctx.fillStyle = hexA(SEAD, a4(0.10));
    var cy = H * 0.16 + Math.sin(t * 0.05) * H * 0.01;
    ctx.beginPath();
    ctx.moveTo(0, cy);
    for (var x = 0; x <= W; x += 16) {
      ctx.lineTo(x, cy + Math.sin(x * 0.006 + t * 0.03) * H * 0.012);
    }
    ctx.lineTo(W, cy + H * 0.03);
    ctx.lineTo(0, cy + H * 0.03);
    ctx.closePath();
    ctx.fill();
  }

  // ---- Sea ------------------------------------------------------
  function drawSea(t) {
    ctx.fillStyle = SEA;
    ctx.fillRect(0, L.horizonY, W, H - L.horizonY);
    // Large slow swells: three filled sine bands, each a shade
    // darker or lighter than the sea, drifting on multi second
    // timescales. Amplitudes grow toward the shore.
    var bands = [
      { y0: 0.42, amp: 0.010, col: SEAL, al: 0.35, sp: 0.11, ph: 0.0 },
      { y0: 0.52, amp: 0.014, col: SEAD, al: 0.30, sp: 0.09, ph: 1.7 },
      { y0: 0.60, amp: 0.018, col: SEAL, al: 0.28, sp: 0.07, ph: 3.1 }
    ];
    var b, x;
    for (b = 0; b < bands.length; b++) {
      var bd = bands[b];
      var yBase = H * bd.y0;
      ctx.fillStyle = hexA(bd.col, a4(bd.al));
      ctx.beginPath();
      ctx.moveTo(0, yBase + Math.sin(t * bd.sp + bd.ph) * H * bd.amp);
      for (x = 0; x <= W; x += 14) {
        ctx.lineTo(x, yBase + Math.sin(x * 0.008 + t * bd.sp + bd.ph) * H * bd.amp);
      }
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();
    }
    // Crest lines: thin pale strokes riding the swell tops.
    ctx.strokeStyle = hexA(FOAM, a4(0.35));
    ctx.lineWidth = Math.max(1, H * 0.002);
    var c;
    for (c = 0; c < 3; c++) {
      var bd2 = bands[c];
      var yB = H * bd2.y0;
      ctx.beginPath();
      for (x = 0; x <= W; x += 14) {
        var yy = yB + Math.sin(x * 0.008 + t * bd2.sp + bd2.ph) * H * bd2.amp;
        if (x === 0) { ctx.moveTo(x, yy); } else { ctx.lineTo(x, yy); }
      }
      ctx.stroke();
    }
    // Breakers near the shore: two foam bands rolling in, their
    // edges ragged from a seeded offset per segment.
    var rng = mulberry32(SEED * 7 + 11);
    var br;
    for (br = 0; br < 2; br++) {
      var by = L.shoreY - H * (0.045 + br * 0.05) + Math.sin(t * 0.22 + br * 2.1) * H * 0.008;
      ctx.fillStyle = hexA(FOAM, a4(0.55 - br * 0.18));
      ctx.beginPath();
      ctx.moveTo(0, by);
      for (x = 0; x <= W; x += 20) {
        var jag = (rng() - 0.5) * H * 0.010;
        ctx.lineTo(x, by + Math.sin(x * 0.02 + t * 0.3 + br) * H * 0.006 + jag);
      }
      ctx.lineTo(W, by + H * 0.018);
      ctx.lineTo(0, by + H * 0.018);
      ctx.closePath();
      ctx.fill();
    }
    // Wet sand strip at the very bottom, darker, with a foam
    // edge creeping up and back with the tide.
    var tide = (Math.sin(t * Math.PI * 2 / CYCLE) + 1) / 2; // 0 to 1 over the cycle
    var sandY = H * 0.90 - tide * H * 0.05;
    ctx.fillStyle = hexA(SEAD, a4(0.55));
    ctx.fillRect(0, sandY, W, H - sandY);
    ctx.fillStyle = hexA(FOAM, a4(0.5));
    ctx.beginPath();
    ctx.moveTo(0, sandY);
    for (x = 0; x <= W; x += 18) {
      ctx.lineTo(x, sandY + Math.sin(x * 0.015 + t * 0.4) * H * 0.006);
    }
    ctx.lineTo(W, sandY + H * 0.008);
    ctx.lineTo(0, sandY + H * 0.008);
    ctx.closePath();
    ctx.fill();
  }

  // ---- Rocks ----------------------------------------------------
  function drawRock(cx, baseY, s, t, flip) {
    // Angular near-black cluster: three stacked facets with one
    // pale highlight edge where the spray catches it.
    ctx.fillStyle = ROCK;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.55, baseY);
    ctx.lineTo(cx - s * 0.42, baseY - s * 0.55);
    ctx.lineTo(cx - s * 0.10, baseY - s * 0.95);
    ctx.lineTo(cx + s * 0.22, baseY - s * 0.70);
    ctx.lineTo(cx + s * 0.50, baseY - s * 0.30);
    ctx.lineTo(cx + s * 0.55, baseY);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = ROCKL;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.10, baseY - s * 0.95);
    ctx.lineTo(cx + s * 0.22, baseY - s * 0.70);
    ctx.lineTo(cx + s * 0.05, baseY - s * 0.45);
    ctx.lineTo(cx - s * 0.18, baseY - s * 0.55);
    ctx.closePath();
    ctx.fill();
    // A second smaller boulder beside it.
    ctx.fillStyle = ROCK;
    var bx = flip ? cx + s * 0.75 : cx - s * 0.75;
    ctx.beginPath();
    ctx.moveTo(bx - s * 0.28, baseY);
    ctx.lineTo(bx - s * 0.20, baseY - s * 0.32);
    ctx.lineTo(bx + s * 0.05, baseY - s * 0.42);
    ctx.lineTo(bx + s * 0.26, baseY - s * 0.12);
    ctx.lineTo(bx + s * 0.28, baseY);
    ctx.closePath();
    ctx.fill();
  }

  function drawRocks(t) {
    var s = H * 0.075;
    drawRock(L.rockLx, L.shoreY + H * 0.02, s, t, true);
    drawRock(L.rockRx, L.shoreY + H * 0.03, s * 0.85, t, true);
  }

  // ---- Spray ----------------------------------------------------
  function drawSpray(t) {
    // Particle spray at the rock line: seeded droplets rise,
    // burst, and fall, a pure function of t. Droplets are paired
    // arcs with a moveTo before each arc, per the node-canvas
    // quirk note.
    var rocks = [
      { x: L.rockLx, y: L.shoreY - H * 0.05, n: 34 },
      { x: L.rockRx, y: L.shoreY - H * 0.04, n: 22 }
    ];
    var r, k;
    for (r = 0; r < rocks.length; r++) {
      var rk = rocks[r];
      for (k = 0; k < rk.n; k++) {
        var rng = mulberry32(SEED * 31 + r * 101 + k * 17);
        var spd = 0.25 + rng() * 0.45;      // rise speed
        var spread = (rng() - 0.5) * W * 0.10;
        var life = ((t * spd + rng()) % 1); // 0 rising, 1 spent
        var px = rk.x + spread * (0.4 + life * 0.8);
        var py = rk.y - life * H * (0.10 + rng() * 0.08) + Math.sin(life * 9 + k) * H * 0.004;
        var pr = Math.max(0.8, (1.6 + rng() * 2.2) * (1 - life * 0.6));
        var al = a4(0.85 * (1 - life));
        ctx.fillStyle = hexA(SPRAY, al);
        ctx.beginPath();
        ctx.moveTo(px + pr, py);
        ctx.arc(px, py, pr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // A low spray mist hugging the breaker line.
    ctx.fillStyle = hexA(SPRAY, a4(0.10 + 0.05 * Math.sin(t * 0.3)));
    ctx.fillRect(0, L.shoreY - H * 0.055, W, H * 0.03);
  }

  // ---- The figure -----------------------------------------------
  function drawFigure(t) {
    // A simple dark sprite, anonymous and unreadable: a round
    // head, a straight body, two legs, one arm that stays at her
    // side except for the single raise once per tide cycle. She
    // is barely taller than the wavelets at her feet, a scale
    // marker, never the subject.
    var h = L.figH;
    var x = L.figX;
    var feetY = L.shoreY + H * 0.012;
    var raise = armRaise(t);
    var lw = Math.max(1, h * 0.09);
    ctx.strokeStyle = FIG;
    ctx.fillStyle = FIG;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    // Legs.
    ctx.beginPath();
    ctx.moveTo(x, feetY - h * 0.38);
    ctx.lineTo(x - h * 0.07, feetY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, feetY - h * 0.38);
    ctx.lineTo(x + h * 0.07, feetY);
    ctx.stroke();
    // Body.
    ctx.beginPath();
    ctx.moveTo(x, feetY - h * 0.38);
    ctx.lineTo(x, feetY - h * 0.72);
    ctx.stroke();
    // Head.
    ctx.beginPath();
    ctx.moveTo(x + h * 0.075, feetY - h * 0.82);
    ctx.arc(x, feetY - h * 0.82, h * 0.075, 0, Math.PI * 2);
    ctx.fill();
    // Left arm, always at her side.
    ctx.beginPath();
    ctx.moveTo(x, feetY - h * 0.68);
    ctx.lineTo(x - h * 0.10, feetY - h * 0.42);
    ctx.stroke();
    // Right arm: at her side when raise is 0, lifted up and
    // out at an angle when raise is 1, interpolating between
    // the two, so the raised arm reads clearly apart from the
    // body even at this tiny scale.
    var ax = x + h * 0.10 * (1 - raise) + h * 0.45 * raise;
    var ay = feetY - h * 0.42 * (1 - raise) - h * 1.02 * raise;
    ctx.beginPath();
    ctx.moveTo(x, feetY - h * 0.68);
    ctx.lineTo(ax, ay);
    ctx.stroke();
    // Her reflection: a short dark smear on the wet sand.
    ctx.fillStyle = hexA(FIG, a4(0.35));
    ctx.fillRect(x - h * 0.06, feetY + 1, h * 0.12, h * 0.22);
  }

  // ---- Grain ----------------------------------------------------
  function drawGrain(t) {
    // Film grain: seeded specks, re-seeded 8 times a second, so
    // the grain shimmers at 8 Hz, under the 14 Hz ceiling.
    var rng = mulberry32(SEED * 3 + Math.floor(t * 8) * 977);
    var n = Math.floor(W * H / 9000);
    var i;
    for (i = 0; i < n; i++) {
      var gx = rng() * W;
      var gy = rng() * H;
      var light = rng() > 0.5;
      ctx.fillStyle = light ? hexA(SPRAY, a4(0.05)) : hexA(ROCK, a4(0.05));
      ctx.fillRect(gx, gy, 1.4, 1.4);
    }
    // Pushed contrast: a faint dark vignette at the corners.
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, hexA(ROCK, a4(0)));
    vg.addColorStop(1, hexA(ROCK, a4(0.18)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Page ground is the sky top gray; the stage is the coast.
    ctx.fillStyle = SKYT;
    ctx.fillRect(0, 0, W, H);

    drawSky(t);
    drawSea(t);
    drawRocks(t);
    drawSpray(t);
    drawFigure(t);
    drawGrain(t);

    // ---- Vertical side text along the left edge.
    var fsSide = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.save();
    ctx.translate(L.sideX + 2, H * 0.78);
    ctx.rotate(-Math.PI / 2);
    ctx.font = '600 ' + fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = hexA(INK, a4(0.78));
    ctx.fillText('S M A L L   F I G U R E ,   H U G E   S E A', 0, 0);
    ctx.font = fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = hexA(INK, a4(0.65));
    ctx.fillText('T L 4   ·   P P 1 2 1 8', 0, fsSide + 7);
    ctx.restore();

    // ---- Plates: title top-left, number and date below it.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Small Figure, Huge Sea', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, a4(0.85));
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№630 · 2007 · 06 · 05', 18, 18 + fsTitle * 0.8 + fsSub + 8);

    // ---- Hint, centered at the bottom, pale pill on the sand.
    var hint = 'Watch the tides.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(PILL, a4(0.92));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(INK, a4(0.35));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer interaction. The tides are the time
  // signature; the figure's single gesture is the only human
  // event. There is nothing to tap.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1971 exposes the tide state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1971 = {
      firstT: FIRST_T,
      arm: function (t) { return armRaise(t); },
      phase: function (t) { return ((t % CYCLE) + CYCLE) % CYCLE; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: swells roll, spray bursts, the tide creeps,
  // the figure raises her arm once per 24 s cycle. All motion
  // is on multi second timescales, grain at 8 Hz, well under
  // the 14 Hz ceiling. Guarded so node-canvas QA (no
  // requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
