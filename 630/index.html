<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Five Wanderers, One Night</title>
<style>
  html, body { margin: 0; padding: 0; background: #1A2440; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SEED = 630076;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette (strict) ----------
  var NIGHT = '#1A2440';        // night city / ground / streets
  var WARM = '#E8B93B';         // lit windows
  var RIVER = '#2B4D8C';        // river
  // Tone-family strengths of the palette hexes only (no new hues): block faces,
  // unlit windows, bridge deck and shadow cores are the same pigments at other
  // strengths, as in earlier pieces of this series.
  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function rgba(h, a) {
    var c = hexRgb(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  function shade(h, f) {
    var c = hexRgb(h);
    function cl(v) { return Math.max(0, Math.min(255, Math.round(v))); }
    return 'rgb(' + cl(c[0] * f) + ',' + cl(c[1] * f) + ',' + cl(c[2] * f) + ')';
  }
  function shadeA(h, f, a) {
    var c = hexRgb(h);
    function cl(v) { return Math.max(0, Math.min(255, Math.round(v))); }
    return 'rgba(' + cl(c[0] * f) + ',' + cl(c[1] * f) + ',' + cl(c[2] * f) + ',' + a + ')';
  }
  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  var BLOCK_A = shade(NIGHT, 1.28);
  var BLOCK_B = shade(NIGHT, 1.44);
  var BLOCK_LM = shade(NIGHT, 1.44);
  var BLOCK_TOWER = shade(NIGHT, 1.58);
  var UNLIT = shade(NIGHT, 0.70);
  var SHADOW = shade(NIGHT, 0.45);
  var RIVER_LT = shade(RIVER, 1.22);
  var CREAM = '#F5F1E8';

  // ---------- street grid (unit space) ----------
  // Street centerlines; building blocks sit in the cells between them.
  var SX = [], SY = [];
  for (var gi = 0; gi < 7; gi++) { SX.push(0.030 + gi * (0.94 / 6)); SY.push(0.030 + gi * (0.94 / 6)); }
  var HG = 0.0155;              // half street width (unit)
  function IX(i, j) { return [SX[i], SY[j]]; }

  // ---------- river ----------
  // Diagonal band across the lower third: line through RA->RB, half width RW.
  var RA = [0, 0.790], RB = [1, 0.600], RW = 0.046;
  var RDX = RB[0] - RA[0], RDY = RB[1] - RA[1];
  var RLEN = Math.sqrt(RDX * RDX + RDY * RDY);
  function riverDist(px, py) {
    // signed perpendicular distance to the river centerline
    return ((px - RA[0]) * RDY - (py - RA[1]) * RDX) / RLEN;
  }
  function riverCenterY(x) { return RA[1] + RDY * ((x - RA[0]) / RDX); }

  // ---------- building blocks (seeded, precomputed) ----------
  var blocks = [];
  (function buildBlocks() {
    var r = mulberry32(SEED + 11);
    for (var ci = 0; ci < 6; ci++) {
      for (var cj = 0; cj < 6; cj++) {
        var x0 = SX[ci] + HG, x1 = SX[ci + 1] - HG;
        var y0 = SY[cj] + HG, y1 = SY[cj + 1] - HG;
        var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
        if (Math.abs(riverDist(cx, cy)) < RW + 0.030) continue;   // river cell: water
        var kind = 'plain';
        if (ci === 1 && cj === 0) kind = 'cafe';
        else if (ci === 4 && cj === 1) kind = 'museum';
        else if (ci === 1 && cj === 5) kind = 'market';
        else if (ci === 5 && cj === 0) kind = 'tower';
        var wins = [];
        var wr = mulberry32(SEED + 100 + ci * 37 + cj * 911);
        var ncols = 4, nrows = 3;
        for (var a = 0; a < ncols; a++) {
          for (var b = 0; b < nrows; b++) {
            wins.push({
              fx: (a + 0.5) / ncols, fy: (b + 0.5) / nrows,
              lit: wr() < 0.44,
              ph: wr() * Math.PI * 2,
              sp: 0.5 + wr() * 0.9
            });
          }
        }
        blocks.push({
          x0: x0, y0: y0, x1: x1, y1: y1, kind: kind,
          tone: (kind === 'tower') ? BLOCK_TOWER :
                (kind !== 'plain') ? BLOCK_LM :
                (r() < 0.5 ? BLOCK_A : BLOCK_B),
          wins: wins
        });
      }
    }
  })();

  // river shimmer strokes (seeded, precomputed)
  var shimmers = [];
  (function buildShimmer() {
    var r = mulberry32(SEED + 77);
    for (var i = 0; i < 30; i++) {
      shimmers.push({
        t: 0.03 + r() * 0.94,
        off: (r() * 2 - 1) * RW * 0.72,
        len: 0.018 + r() * 0.030,
        ph: r() * Math.PI * 2,
        sp: 0.4 + r() * 0.6
      });
    }
  })();

  // ---------- wanderer routes ----------
  // Closed loops of street intersections; consecutive waypoints share a street
  // line, so every segment runs along a street. Positions are pure functions
  // of the global route-time rt: pos = pointAt(route, startS + speed * rt).
  function makeRoute(ijList) {
    var pts = [];
    for (var i = 0; i < ijList.length; i++) pts.push(IX(ijList[i][0], ijList[i][1]));
    var segs = [], total = 0;
    for (var k = 0; k < pts.length; k++) {
      var p = pts[k], q = pts[(k + 1) % pts.length];
      var len = Math.abs(q[0] - p[0]) + Math.abs(q[1] - p[1]);   // axis-aligned
      segs.push({ p: p, q: q, len: len, acc: total });
      total += len;
    }
    return { pts: pts, segs: segs, L: total };
  }
  function pointAt(route, s) {
    var L = route.L;
    s = ((s % L) + L) % L;
    for (var k = 0; k < route.segs.length; k++) {
      var sg = route.segs[k];
      if (s <= sg.acc + sg.len || k === route.segs.length - 1) {
        var f = sg.len > 0 ? (s - sg.acc) / sg.len : 0;
        if (f < 0) f = 0; if (f > 1) f = 1;
        return [sg.p[0] + (sg.q[0] - sg.p[0]) * f, sg.p[1] + (sg.q[1] - sg.p[1]) * f];
      }
    }
    return route.pts[0].slice();
  }
  function arcDistToPoint(route, target) {
    // arc length from route start to a point known to lie on the route
    for (var k = 0; k < route.segs.length; k++) {
      var sg = route.segs[k];
      var onX = Math.abs(sg.q[0] - sg.p[0]) < 1e-9;
      if (onX) {
        if (Math.abs(target[0] - sg.p[0]) < 1e-6 &&
            target[1] >= Math.min(sg.p[1], sg.q[1]) - 1e-9 &&
            target[1] <= Math.max(sg.p[1], sg.q[1]) + 1e-9) {
          return sg.acc + Math.abs(target[1] - sg.p[1]);
        }
      } else {
        if (Math.abs(target[1] - sg.p[1]) < 1e-6 &&
            target[0] >= Math.min(sg.p[0], sg.q[0]) - 1e-9 &&
            target[0] <= Math.max(sg.p[0], sg.q[0]) + 1e-9) {
          return sg.acc + Math.abs(target[0] - sg.p[0]);
        }
      }
    }
    return 0;
  }

  var WANDERERS = [
    { color: '#E8B93B', speed: 0.030, route: makeRoute([[1,1],[4,1],[4,3],[2,3],[2,2],[1,2]]),
      startPt: [0.400, SY[3]], stops: [[4,1],[2,3],[1,2]] },
    { color: '#E2725B', speed: 0.040, route: makeRoute([[3,1],[5,1],[5,3],[3,3],[3,2],[2,2],[2,1]]),
      startPt: IX(5, 1), stops: [[5,1],[5,3],[3,2]] },
    { color: '#6A9A5B', speed: 0.027, route: makeRoute([[3,2],[4,2],[4,3],[3,3],[3,6],[5,6],[5,5],[3,5]]),
      startPt: IX(4, 2), stops: [[3,3],[5,6],[3,5]] },
    { color: '#7A4E8C', speed: 0.046, route: makeRoute([[5,0],[6,0],[6,2],[5,2]]),
      startPt: IX(5, 0), stops: [[6,0],[6,2],[5,2]] },
    { color: '#F5F1E8', speed: 0.034, route: makeRoute([[0,3],[2,3],[2,4],[0,4]]),
      startPt: IX(0, 4), stops: [[0,3],[2,4],[0,4]] }
  ];
  for (var wi = 0; wi < WANDERERS.length; wi++) {
    WANDERERS[wi].startS = arcDistToPoint(WANDERERS[wi].route, WANDERERS[wi].startPt);
    WANDERERS[wi].stopPts = [];
    for (var si = 0; si < WANDERERS[wi].stops.length; si++) {
      WANDERERS[wi].stopPts.push(IX(WANDERERS[wi].stops[si][0], WANDERERS[wi].stops[si][1]));
    }
  }
  function wandererPos(w, rt) { return pointAt(w.route, w.startS + w.speed * rt); }

  // ---------- crossings (precomputed from route geometry) ----------
  // Every intersection between segments of two different routes, including
  // shared intersections and collinear overlaps (an overlap counts once, at
  // its midpoint). Each crossing knows its two wanderers; it pulses when
  // either of them is near.
  var crossings = [];
  (function buildCrossings() {
    function addCross(x, y, a, b) {
      for (var i = 0; i < crossings.length; i++) {
        var c = crossings[i];
        if (Math.abs(c.x - x) < 0.012 && Math.abs(c.y - y) < 0.012) {
          if (c.a !== a && c.a !== b) { /* third route: keep first pair */ }
          return;
        }
      }
      crossings.push({ x: x, y: y, a: a, b: b });
    }
    function segInt(p, q, r, s, a, b) {
      var pqH = Math.abs(q[1] - p[1]) < 1e-9;   // p->q horizontal
      var rsH = Math.abs(s[1] - r[1]) < 1e-9;
      var pLo, pHi, rLo, rHi;
      if (pqH && rsH) {
        if (Math.abs(p[1] - r[1]) > 1e-9) return;
        pLo = Math.min(p[0], q[0]); pHi = Math.max(p[0], q[0]);
        rLo = Math.min(r[0], s[0]); rHi = Math.max(r[0], s[0]);
        var lo = Math.max(pLo, rLo), hi = Math.min(pHi, rHi);
        if (lo <= hi + 1e-9) addCross((lo + hi) / 2, p[1], a, b);
        return;
      }
      if (!pqH && !rsH) {
        if (Math.abs(p[0] - r[0]) > 1e-9) return;
        pLo = Math.min(p[1], q[1]); pHi = Math.max(p[1], q[1]);
        rLo = Math.min(r[1], s[1]); rHi = Math.max(r[1], s[1]);
        var lo2 = Math.max(pLo, rLo), hi2 = Math.min(pHi, rHi);
        if (lo2 <= hi2 + 1e-9) addCross(p[0], (lo2 + hi2) / 2, a, b);
        return;
      }
      var hp = pqH ? p : r, hq = pqH ? q : s, vp = pqH ? r : p, vq = pqH ? s : q;
      var cx = vp[0], cy = hp[1];
      if (cx >= Math.min(hp[0], hq[0]) - 1e-9 && cx <= Math.max(hp[0], hq[0]) + 1e-9 &&
          cy >= Math.min(vp[1], vq[1]) - 1e-9 && cy <= Math.max(vp[1], vq[1]) + 1e-9) {
        addCross(cx, cy, a, b);
      }
    }
    for (var a = 0; a < WANDERERS.length; a++) {
      for (var b = a + 1; b < WANDERERS.length; b++) {
        var ra = WANDERERS[a].route, rb = WANDERERS[b].route;
        for (var i = 0; i < ra.segs.length; i++) {
          for (var j = 0; j < rb.segs.length; j++) {
            segInt(ra.segs[i].p, ra.segs[i].q, rb.segs[j].p, rb.segs[j].q, a, b);
          }
        }
      }
    }
  })();

  // ---------- sizing (Visual Viewport API) ----------
  var W = 0, H = 0, lastElapsed = 0;
  function resize() {
    var vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(lastElapsed);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  function isPhone(w, h) {
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }
  function X(u) { return u * W; }
  function Y(u) { return u * H; }

  // ---------- state ----------
  var rt = 0;                 // global route-time (seconds of route travel)
  var focus = -1;             // focused wanderer index, -1 none
  var focusAnim = 0;          // seconds since focus changed (thread draw-on)

  // ---------- drawing ----------
  function drawRiver(t) {
    // band polygon sampled along the centerline
    ctx.beginPath();
    var N = 24, i, px, py, d;
    for (i = 0; i <= N; i++) {
      var f = i / N;
      px = RA[0] + RDX * f; py = RA[1] + RDY * f;
      // perpendicular unit vector (RDX,RDY rotated): (-RDY, RDX)/RLEN
      var nx = -RDY / RLEN, ny = RDX / RLEN;
      if (i === 0) ctx.moveTo(X(px + nx * RW), Y(py + ny * RW));
      else ctx.lineTo(X(px + nx * RW), Y(py + ny * RW));
    }
    for (i = N; i >= 0; i--) {
      var f2 = i / N;
      px = RA[0] + RDX * f2; py = RA[1] + RDY * f2;
      var nx2 = -RDY / RLEN, ny2 = RDX / RLEN;
      ctx.lineTo(X(px - nx2 * RW), Y(py - ny2 * RW));
    }
    ctx.closePath();
    ctx.fillStyle = RIVER;
    ctx.fill();
    // shimmer strokes
    ctx.lineCap = 'round';
    for (i = 0; i < shimmers.length; i++) {
      var sm = shimmers[i];
      var bx = RA[0] + RDX * sm.t, by = RA[1] + RDY * sm.t;
      var ox = (-RDY / RLEN) * sm.off, oy = (RDX / RLEN) * sm.off;
      var a = 0.08 + 0.09 * (0.5 + 0.5 * Math.sin(t * sm.sp + sm.ph));
      ctx.strokeStyle = shadeA(RIVER, 1.5, a.toFixed(3));
      ctx.lineWidth = Math.max(1, H * 0.0016);
      ctx.beginPath();
      ctx.moveTo(X(bx + ox - RDX / RLEN * sm.len / 2), Y(by + oy - RDY / RLEN * sm.len / 2));
      ctx.lineTo(X(bx + ox + RDX / RLEN * sm.len / 2), Y(by + oy + RDY / RLEN * sm.len / 2));
      ctx.stroke();
    }
  }

  function drawBridge() {
    // deck over the river on street SX[3], drawn as a lighter strip + rails
    var bx = SX[3];
    var yc = riverCenterY(bx);
    var yTop = yc - RW * 1.55, yBot = yc + RW * 1.55;
    ctx.fillStyle = RIVER_LT;
    ctx.fillRect(X(bx - HG), Y(yTop), X(bx + HG) - X(bx - HG), Y(yBot) - Y(yTop));
    ctx.strokeStyle = rgba(WARM, 0.55);
    ctx.lineWidth = Math.max(1, H * 0.0018);
    ctx.beginPath();
    ctx.moveTo(X(bx - HG), Y(yTop)); ctx.lineTo(X(bx - HG), Y(yBot));
    ctx.moveTo(X(bx + HG), Y(yTop)); ctx.lineTo(X(bx + HG), Y(yBot));
    ctx.stroke();
    // lamp dots along the deck
    ctx.fillStyle = rgba(WARM, 0.85);
    for (var i = 0; i < 3; i++) {
      var ly = yTop + (yBot - yTop) * (0.2 + i * 0.3);
      ctx.beginPath(); ctx.arc(X(bx - HG), Y(ly), Math.max(1.2, H * 0.0022), 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(X(bx + HG), Y(ly), Math.max(1.2, H * 0.0022), 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawBlock(b, t) {
    var x = X(b.x0), y = Y(b.y0), w = X(b.x1) - x, h = Y(b.y1) - y;
    ctx.fillStyle = b.tone;
    ctx.fillRect(x, y, w, h);
    // windows
    var ww = w * 0.13, wh = h * 0.15;
    for (var i = 0; i < b.wins.length; i++) {
      var win = b.wins[i];
      var wx = x + win.fx * w - ww / 2, wy = y + win.fy * h - wh / 2;
      if (win.lit) {
        var tw = 0.62 + 0.30 * (0.5 + 0.5 * Math.sin(t * win.sp + win.ph));
        ctx.fillStyle = rgba(WARM, tw);
      } else {
        ctx.fillStyle = UNLIT;
        ctx.globalAlpha = 0.55;
      }
      ctx.fillRect(wx, wy, ww, wh);
      ctx.globalAlpha = 1;
    }
    // landmark details
    if (b.kind === 'cafe') {
      // striped awning at the base
      var ay = y + h * 0.76, ah = h * 0.16;
      ctx.fillStyle = rgba(WARM, 0.88);
      ctx.beginPath();
      ctx.moveTo(x + w * 0.14, ay); ctx.lineTo(x + w * 0.86, ay);
      ctx.lineTo(x + w * 0.78, ay + ah); ctx.lineTo(x + w * 0.22, ay + ah);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = rgba(NIGHT, 0.85);
      for (var sIdx = 0; sIdx < 3; sIdx++) {
        var sxp = x + w * (0.30 + sIdx * 0.16);
        ctx.beginPath();
        ctx.moveTo(sxp, ay); ctx.lineTo(sxp + w * 0.07, ay);
        ctx.lineTo(sxp + w * 0.055, ay + ah); ctx.lineTo(sxp + w * 0.015, ay + ah);
        ctx.closePath(); ctx.fill();
      }
    } else if (b.kind === 'museum') {
      // pediment + columns
      ctx.strokeStyle = rgba(WARM, 0.8);
      ctx.lineWidth = Math.max(1, h * 0.02);
      ctx.beginPath();
      ctx.moveTo(x + w * 0.14, y + h * 0.26);
      ctx.lineTo(x + w * 0.50, y + h * 0.10);
      ctx.lineTo(x + w * 0.86, y + h * 0.26);
      ctx.stroke();
      ctx.fillStyle = rgba(WARM, 0.55);
      for (var cIdx = 0; cIdx < 4; cIdx++) {
        ctx.fillRect(x + w * (0.20 + cIdx * 0.17), y + h * 0.30, w * 0.055, h * 0.56);
      }
      ctx.fillRect(x + w * 0.14, y + h * 0.86, w * 0.72, h * 0.045);
    } else if (b.kind === 'market') {
      // striped canopy across the top
      var cy0 = y + h * 0.10, chh = h * 0.20;
      var stripes = 6;
      for (var mIdx = 0; mIdx < stripes; mIdx++) {
        ctx.fillStyle = (mIdx % 2 === 0) ? rgba(WARM, 0.88) : rgba(NIGHT, 0.85);
        ctx.fillRect(x + w * 0.10 + (w * 0.80 / stripes) * mIdx, cy0, w * 0.80 / stripes, chh);
      }
      // scalloped lower edge
      ctx.fillStyle = rgba(WARM, 0.88);
      for (var sc = 0; sc < stripes; sc++) {
        ctx.beginPath();
        ctx.arc(x + w * 0.10 + (w * 0.80 / stripes) * (sc + 0.5), cy0 + chh, w * 0.80 / stripes / 2, 0, Math.PI);
        ctx.fill();
      }
    } else if (b.kind === 'tower') {
      // antenna with a warm tip
      ctx.strokeStyle = rgba(CREAM, 0.6);
      ctx.lineWidth = Math.max(1, w * 0.016);
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y);
      ctx.lineTo(x + w / 2, y - h * 0.30);
      ctx.stroke();
      ctx.fillStyle = rgba(WARM, 0.9);
      ctx.beginPath(); ctx.arc(x + w / 2, y - h * 0.32, Math.max(1.4, h * 0.035), 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawCrossings(t, positions) {
    var proxR = Math.max(60, Math.min(W, H) * 0.14);
    for (var i = 0; i < crossings.length; i++) {
      var c = crossings[i];
      var pa = positions[c.a], pb = positions[c.b];
      var da = Math.sqrt(Math.pow(X(pa[0]) - X(c.x), 2) + Math.pow(Y(pa[1]) - Y(c.y), 2));
      var db = Math.sqrt(Math.pow(X(pb[0]) - X(c.x), 2) + Math.pow(Y(pb[1]) - Y(c.y), 2));
      var prox = Math.max(clamp01(1 - da / proxR), clamp01(1 - db / proxR));
      var a = 0.05 + 0.50 * prox;
      var rr = (Math.min(W, H) * 0.008) * (1 + 0.25 * Math.sin(t * 1.4 + i * 1.7)) + prox * Math.min(W, H) * 0.004;
      ctx.strokeStyle = rgba(CREAM, a);
      ctx.lineWidth = Math.max(1, H * 0.0016);
      ctx.beginPath(); ctx.arc(X(c.x), Y(c.y), rr, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = rgba(CREAM, a * 0.9);
      ctx.beginPath(); ctx.arc(X(c.x), Y(c.y), Math.max(1, H * 0.0018), 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawRoutePartial(route, frac, color) {
    // polyline along the route up to frac of its length (corners kept exact)
    var target = route.L * clamp01(frac);
    ctx.beginPath();
    var start = pointAt(route, 0);
    ctx.moveTo(X(start[0]), Y(start[1]));
    var acc = 0;
    for (var k = 0; k < route.segs.length; k++) {
      var sg = route.segs[k];
      if (acc + sg.len <= target) {
        ctx.lineTo(X(sg.q[0]), Y(sg.q[1]));
        acc += sg.len;
      } else {
        var end = pointAt(route, target);
        ctx.lineTo(X(end[0]), Y(end[1]));
        break;
      }
    }
    ctx.strokeStyle = rgba(color, 0.28);
    ctx.lineWidth = Math.max(3, H * 0.007);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke();
    ctx.strokeStyle = rgba(color, 0.9);
    ctx.lineWidth = Math.max(1.4, H * 0.0022);
    ctx.stroke();
  }

  function drawWanderer(w, pos, dimmed, isFocused, scale) {
    var px = X(pos[0]), py = Y(pos[1]);
    var base = Math.min(W, H) * (isPhone(W, H) ? 0.016 : 0.0135) * scale;
    if (dimmed) {
      ctx.fillStyle = rgba(w.color, 0.05);
      ctx.beginPath(); ctx.arc(px, py, base * 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = SHADOW;
      ctx.beginPath(); ctx.arc(px, py, base * 0.62, 0, Math.PI * 2); ctx.fill();
      return;
    }
    // layered halo
    ctx.fillStyle = rgba(w.color, 0.10);
    ctx.beginPath(); ctx.arc(px, py, base * 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(w.color, 0.17);
    ctx.beginPath(); ctx.arc(px, py, base * 1.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(w.color, 0.28);
    ctx.beginPath(); ctx.arc(px, py, base * 1.0, 0, Math.PI * 2); ctx.fill();
    // core
    ctx.fillStyle = w.color;
    ctx.beginPath(); ctx.arc(px, py, base * 0.62, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(CREAM, 0.55);
    ctx.beginPath(); ctx.arc(px, py, base * 0.24, 0, Math.PI * 2); ctx.fill();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // ground = streets
    ctx.fillStyle = NIGHT;
    ctx.fillRect(0, 0, W, H);
    drawRiver(t);
    drawBridge();
    for (var i = 0; i < blocks.length; i++) drawBlock(blocks[i], t);

    var positions = [];
    for (i = 0; i < WANDERERS.length; i++) positions.push(wandererPos(WANDERERS[i], rt));

    drawCrossings(t, positions);

    if (focus >= 0) {
      var fw = WANDERERS[focus];
      var frac = clamp01(focusAnim / 1.2);
      var ease = 1 - Math.pow(1 - frac, 3);
      drawRoutePartial(fw.route, ease, fw.color);
      // stop rings, fading in as the thread completes
      var sa = clamp01((focusAnim - 0.7) / 0.6);
      if (sa > 0) {
        ctx.strokeStyle = rgba(fw.color, 0.85 * sa);
        ctx.lineWidth = Math.max(1.2, H * 0.002);
        for (var s2 = 0; s2 < fw.stopPts.length; s2++) {
          ctx.beginPath();
          ctx.arc(X(fw.stopPts[s2][0]), Y(fw.stopPts[s2][1]), Math.min(W, H) * 0.011, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    for (i = 0; i < WANDERERS.length; i++) {
      var dim = (focus >= 0 && i !== focus);
      drawWanderer(WANDERERS[i], positions[i], dim, i === focus, i === focus ? 1.2 : 1);
    }
  }

  // ---------- interaction ----------
  // TAP (quick, still press) on a wanderer toggles focus. Holding the press
  // beyond 0.30 s rewinds the night: route-time runs backward at 3x while
  // held, then resumes forward from there. A tap never rewinds.
  var downInfo = null;
  function positionsPx() {
    var out = [];
    for (var i = 0; i < WANDERERS.length; i++) {
      var p = wandererPos(WANDERERS[i], rt);
      out.push([X(p[0]), Y(p[1])]);
    }
    return out;
  }
  canvas.addEventListener('pointerdown', function (e) {
    downInfo = { x: e.clientX, y: e.clientY, t: lastElapsed };
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!downInfo) return;
    var heldFor = lastElapsed - downInfo.t;
    var moved = Math.sqrt(Math.pow(e.clientX - downInfo.x, 2) + Math.pow(e.clientY - downInfo.y, 2));
    downInfo = null;
    if (heldFor > 0.30 || moved > 14) return;   // it was a rewind hold, not a tap
    var pos = positionsPx();
    var thresh = Math.max(20, Math.min(W, H) * 0.032);
    var best = -1, bestD = thresh + 1;
    for (var i = 0; i < pos.length; i++) {
      var d = Math.sqrt(Math.pow(pos[i][0] - e.clientX, 2) + Math.pow(pos[i][1] - e.clientY, 2));
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best < 0) return;
    if (focus === best) focus = -1;
    else { focus = best; focusAnim = 0; }
  });
  canvas.addEventListener('pointercancel', function () { downInfo = null; });

  // ---------- clock / loop (anchored elapsed, rAF guarded) ----------
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var prevElapsed = 0;
  function frame() {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : t0;
    var elapsed = (now - t0) / 1000;
    var dt = Math.min(0.05, Math.max(0, elapsed - prevElapsed));
    prevElapsed = elapsed;
    lastElapsed = elapsed;
    var rewinding = downInfo && (elapsed - downInfo.t) > 0.30;
    rt += dt * (rewinding ? -3 : 1);
    if (focus >= 0) focusAnim += dt;
    draw(elapsed);
  }

  resize();
  draw(0); // synchronous first frame: route-time 0, seeded city, no focus
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () { frame(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
