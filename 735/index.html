<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Well</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0C; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var BG = "#0A0A0C";
  var PAPER = "#F5F1E6";
  var BAND = "#8A6544";
  var WATER = "#0E2A4A";
  var RIPPLE = "#4A7FB5";
  var COIN = "#D4A017";
  var INK = "#F5F5F0";
  var PLAQUE = "#14161C";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : 0;
      var sh = window.screen ? window.screen.height : 0;
      var mn = Math.min(sw, sh);
      if (mn > 0 && mn < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  window.addEventListener("resize", resize);
  resize();

  // mulberry32 seeded RNG: the single stream for all event parameters.
  var seed = 73500891;
  function rng() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function layout() {
    var phone = isPhone();
    var m = Math.min(W, H);
    var wellR = phone ? W * 0.36 : m * 0.27;
    var wellX = W / 2, wellY = H * 0.65;
    var cupTopW = (phone ? W * 0.17 : m * 0.115);
    var cupBotW = cupTopW * 0.74;
    var cupTop = H * 0.17;
    var cupH = H * 0.21;
    var rimRy = cupTopW * 0.20;
    var plaqueH = Math.max(40, H * 0.085);
    var plaqueY = H - plaqueH - H * 0.025;
    var gap = W * 0.03;
    var pw = (W - gap * 4) / 3;
    return {
      phone: phone, m: m,
      wellX: wellX, wellY: wellY, wellR: wellR,
      cupX: W / 2, cupTop: cupTop, cupBot: cupTop + cupH,
      cupTopW: cupTopW, cupBotW: cupBotW, rimRy: rimRy,
      plaqueY: plaqueY, plaqueH: plaqueH, plaqueW: pw, gap: gap
    };
  }

  // ---- Event state -------------------------------------------------------
  // Coins and ripples are recorded events. Every visual is a closed-form
  // function of (event time, current time); nothing integrates velocity.
  var coins = [];    // {t0, wobPhase, wobFreq, xOff, ledger, glintA, glintR, fallDur}
  var ripples = [];  // {t0, x, y, maxR, dur, small}
  var overlay = -1;  // ledger index shown as coin-icon field, or -1
  var counts = [0, 0, 0];
  var lastTick = [-10, -10, -10]; // time each ledger last ticked (stamp anim)

  var FALL_G = 2.6; // fall easing exponent scale, see coinY

  function ledgerFor(r) {
    if (r < 0.50) return 0; // DESIRING 50%
    if (r < 0.80) return 1; // SAVING 30%
    return 2;               // DONATING 20%
  }

  function dropCoin(t) {
    var L = layout();
    var ledger = ledgerFor(rng());
    var c = {
      t0: t,
      wobPhase: rng() * Math.PI * 2,
      wobFreq: 5 + rng() * 3,
      xOff: (rng() * 2 - 1) * L.cupBotW * 0.35,
      ledger: ledger,
      glintA: rng() * Math.PI * 2,
      glintR: Math.sqrt(rng()) * 0.82,
      fallDur: 0.95 + rng() * 0.25
    };
    coins.push(c);
    counts[ledger]++;
    lastTick[ledger] = t + c.fallDur;
    var gx = L.wellX + Math.cos(c.glintA) * c.glintR * L.wellR;
    var gy = L.wellY + Math.sin(c.glintA) * c.glintR * L.wellR;
    ripples.push({ t0: t + c.fallDur, x: gx, y: gy, maxR: L.wellR * 0.34, dur: 2.2, small: false });
  }

  function stirRipple(x, y, t) {
    var L = layout();
    ripples.push({ t0: t, x: x, y: y, maxR: L.wellR * 0.16, dur: 1.3, small: true });
  }

  // Coin vertical position: accelerating ease from above the cup rim to the
  // water point. u in [0,1]; y = y0 + (y1 - y0) * u^2 (gravity-like).
  function coinPos(c, t, L) {
    var u = (t - c.t0) / c.fallDur;
    if (u < 0) u = 0;
    if (u > 1) u = 1;
    var y0 = L.cupTop - L.m * 0.16;
    var gy = L.wellY + Math.sin(c.glintA) * c.glintR * L.wellR;
    var y = y0 + (gy - y0) * u * u;
    var wobAmp = L.cupBotW * 0.16 * (1 - u * 0.5);
    var gx = L.wellX + Math.cos(c.glintA) * c.glintR * L.wellR;
    var baseX = L.cupX + c.xOff + (gx - (L.cupX + c.xOff)) * u;
    var x = baseX + Math.sin((t - c.t0) * c.wobFreq + c.wobPhase) * wobAmp * (u < 1 ? 1 : 0);
    return { x: x, y: y, u: u };
  }

  // ---- Drawing -----------------------------------------------------------
  function draw(t) {
    var L = layout();
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // ground
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // well of water
    ctx.beginPath();
    ctx.arc(L.wellX, L.wellY, L.wellR, 0, Math.PI * 2);
    ctx.fillStyle = WATER;
    ctx.fill();

    // glints: one per landed coin, capped at the most recent 200
    var landed = [];
    for (var i = 0; i < coins.length; i++) {
      if (t >= coins[i].t0 + coins[i].fallDur) landed.push(coins[i]);
    }
    var show = landed.slice(Math.max(0, landed.length - 200));
    ctx.strokeStyle = COIN;
    ctx.lineWidth = Math.max(1, L.m * 0.0035);
    for (var g = 0; g < show.length; g++) {
      var gc = show[g];
      var ggx = L.wellX + Math.cos(gc.glintA) * gc.glintR * L.wellR;
      var ggy = L.wellY + Math.sin(gc.glintA) * gc.glintR * L.wellR;
      var gr = L.m * 0.012;
      ctx.globalAlpha = 0.75;
      ctx.beginPath();
      ctx.arc(ggx, ggy, gr, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // ripples, clipped to the well
    ctx.save();
    ctx.beginPath();
    ctx.arc(L.wellX, L.wellY, L.wellR, 0, Math.PI * 2);
    ctx.clip();
    ctx.strokeStyle = RIPPLE;
    for (var r = 0; r < ripples.length; r++) {
      var rp = ripples[r];
      var ru = (t - rp.t0) / rp.dur;
      if (ru < 0 || ru > 1) continue;
      var rr = rp.maxR * (0.15 + 0.85 * ru);
      ctx.globalAlpha = (rp.small ? 0.45 : 0.8) * (1 - ru);
      ctx.lineWidth = Math.max(1, L.m * 0.004 * (1 - ru * 0.5));
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rr, 0, Math.PI * 2);
      ctx.stroke();
      if (!rp.small) {
        ctx.globalAlpha = 0.35 * (1 - ru);
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rr * 0.62, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // falling coins (drawn before the cup so the walls hide them mid-passage)
    var cr = L.m * 0.021;
    for (var k = 0; k < coins.length; k++) {
      var cc = coins[k];
      if (t < cc.t0 || t >= cc.t0 + cc.fallDur) continue;
      var p = coinPos(cc, t, L);
      ctx.beginPath();
      ctx.arc(p.x, p.y, cr, 0, Math.PI * 2);
      ctx.fillStyle = COIN;
      ctx.fill();
    }

    drawCup(L);
    drawPlaques(L, t);
    if (overlay >= 0) drawOverlay(L, overlay);
  }

  function drawCup(L) {
    var x = L.cupX, top = L.cupTop, bot = L.cupBot;
    // walls: tapered body, paper fill
    ctx.beginPath();
    ctx.moveTo(x - L.cupTopW, top);
    ctx.lineTo(x - L.cupBotW, bot);
    ctx.lineTo(x + L.cupBotW, bot);
    ctx.lineTo(x + L.cupTopW, top);
    ctx.closePath();
    ctx.fillStyle = PAPER;
    ctx.fill();
    // brown band across the upper body
    var b0 = top + (bot - top) * 0.26, b1 = top + (bot - top) * 0.38;
    var bw0 = L.cupTopW + (L.cupBotW - L.cupTopW) * 0.26;
    var bw1 = L.cupTopW + (L.cupBotW - L.cupTopW) * 0.38;
    ctx.beginPath();
    ctx.moveTo(x - bw0, b0);
    ctx.lineTo(x + bw0, b0);
    ctx.lineTo(x + bw1, b1);
    ctx.lineTo(x - bw1, b1);
    ctx.closePath();
    ctx.fillStyle = BAND;
    ctx.fill();
    // top opening: dark interior ellipse (the cup is open)
    ctx.beginPath();
    ctx.ellipse(x, top, L.cupTopW, L.rimRy, 0, 0, Math.PI * 2);
    ctx.fillStyle = BG;
    ctx.fill();
    ctx.strokeStyle = PAPER;
    ctx.lineWidth = Math.max(1, L.m * 0.004);
    ctx.stroke();
    // bottom opening: rim only, interior shows what is behind (no bottom)
    ctx.beginPath();
    ctx.ellipse(x, bot, L.cupBotW, L.rimRy * (L.cupBotW / L.cupTopW), 0, 0, Math.PI);
    ctx.strokeStyle = PAPER;
    ctx.stroke();
  }

  var LABELS = ["DESIRING", "SAVING", "DONATING"];

  function plaqueRect(L, i) {
    return { x: L.gap + i * (L.plaqueW + L.gap), y: L.plaqueY, w: L.plaqueW, h: L.plaqueH };
  }

  function drawPlaques(L, t) {
    var fs = Math.max(10, L.m * 0.026);
    for (var i = 0; i < 3; i++) {
      var r = plaqueRect(L, i);
      // stamp pulse: scale bump in the 0.45 s after this ledger ticked
      var since = t - lastTick[i];
      var pulse = (since >= 0 && since < 0.45) ? 1 + 0.16 * Math.sin((since / 0.45) * Math.PI) : 1;
      ctx.save();
      ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
      ctx.scale(pulse, pulse);
      ctx.translate(-(r.x + r.w / 2), -(r.y + r.h / 2));
      ctx.fillStyle = PLAQUE;
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = INK;
      ctx.font = "600 " + fs + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(LABELS[i], r.x + r.w / 2, r.y + r.h * 0.34);
      ctx.font = "700 " + (fs * 1.25) + "px sans-serif";
      ctx.fillStyle = COIN;
      ctx.fillText(String(counts[i]), r.x + r.w / 2, r.y + r.h * 0.72);
      ctx.restore();
    }
  }

  function drawOverlay(L, idx) {
    var n = counts[idx];
    var panelW = Math.min(W * 0.86, L.m * 0.95);
    var perRow = Math.max(5, Math.floor(panelW / (L.m * 0.055)));
    var rows = Math.max(1, Math.ceil(Math.max(n, 1) / perRow));
    var cell = L.m * 0.055;
    var panelH = rows * cell + L.m * 0.05;
    var px = (W - panelW) / 2;
    var py = L.plaqueY - panelH - H * 0.02;
    ctx.fillStyle = PLAQUE;
    ctx.fillRect(px, py, panelW, panelH);
    ctx.fillStyle = COIN;
    var rad = L.m * 0.016;
    if (n === 0) {
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.arc(W / 2, py + panelH / 2, rad, 0, Math.PI * 2);
      ctx.strokeStyle = COIN;
      ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    }
    for (var i = 0; i < n; i++) {
      var cx = px + L.m * 0.025 + (i % perRow) * cell + cell / 2;
      var cy = py + L.m * 0.025 + Math.floor(i / perRow) * cell + cell / 2;
      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Interaction -------------------------------------------------------
  var startTime = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  function now() {
    return (((typeof performance !== "undefined" && performance.now) ? performance.now() : 0) - startTime) / 1000;
  }

  var pDown = null; // {x, y, t, moved, lastStir}
  function evtPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function inWell(x, y, L) {
    var dx = x - L.wellX, dy = y - L.wellY;
    return dx * dx + dy * dy <= L.wellR * L.wellR;
  }
  function plaqueAt(x, y, L) {
    for (var i = 0; i < 3; i++) {
      var r = plaqueRect(L, i);
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
    }
    return -1;
  }

  canvas.addEventListener("pointerdown", function (e) {
    var p = evtPos(e);
    pDown = { x: p.x, y: p.y, t: now(), moved: 0, lastStir: 0 };
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!pDown) return;
    var p = evtPos(e);
    var d = Math.abs(p.x - pDown.x) + Math.abs(p.y - pDown.y);
    if (d > pDown.moved) pDown.moved = d;
    var L = layout();
    var t = now();
    if (pDown.moved > 6 && inWell(p.x, p.y, L) && t - pDown.lastStir > 0.07) {
      stirRipple(p.x, p.y, t);
      pDown.lastStir = t;
    }
  });
  canvas.addEventListener("pointerup", function (e) {
    if (!pDown) return;
    var p = evtPos(e);
    var wasTap = pDown.moved <= 8 && (now() - pDown.t) < 0.6;
    pDown = null;
    if (!wasTap) return;
    var L = layout();
    var pi = plaqueAt(p.x, p.y, L);
    if (pi >= 0) {
      overlay = (overlay === pi) ? -1 : pi;
    } else if (overlay >= 0) {
      overlay = -1;
    } else {
      dropCoin(now());
    }
    draw(now());
  });
  canvas.addEventListener("pointercancel", function () { pDown = null; });

  // ---- Main loop ---------------------------------------------------------
  draw(0); // frame one: synchronous, t = 0, no events exist yet
  if (typeof requestAnimationFrame === "function") {
    var loop = function () {
      draw(now());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
