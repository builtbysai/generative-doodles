<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kabir's Cloth</title>
<style>
html,body{margin:0;padding:0;background:#2E2820;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var W=0,H=0,S=0,OX=0,OY=0,phone=false;
var geo=null,geoLoop=-1,curT=0;
var LOOP=28,WEAVE_END=5.5,HOLD_END=23;
var HANDS=[
  {color:'#2A2620',start:5.5,end:11.0,count:6,base:2.2,loose:1.0},
  {color:'#2E4A6B',start:11.0,end:15.5,count:7,base:2.0,loose:1.6},
  {color:'#8E3B2A',start:15.5,end:19.5,count:8,base:1.8,loose:2.4}
];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function buildFor(loop){
  var rnd=mulberry32(1293000+loop*7919);
  var g={deckle:[],flecks:[],washes:[],weave:[],hands:[[],[],[]],glint:null};
  var n=28,i,j;
  for(i=0;i<n;i++){
    var t=i/n*Math.PI*2;
    var edge=i<n/4?0:(i<n/2?1:(i<3*n/4?2:3));
    var f=i% (n/4)/(n/4);
    var x,y;
    if(edge===0){x=OX+f*S;y=OY+(rnd()-0.5)*S*0.016;}
    else if(edge===1){x=OX+S+(rnd()-0.5)*S*0.016;y=OY+f*S;}
    else if(edge===2){x=OX+S-f*S;y=OY+S+(rnd()-0.5)*S*0.016;}
    else{x=OX+(rnd()-0.5)*S*0.016;y=OY+S-f*S;}
    g.deckle.push([x,y]);
  }
  for(i=0;i<170;i++){
    g.flecks.push([OX+rnd()*S,OY+rnd()*S,(rnd()-0.5)*S*0.012,0.25+rnd()*0.5]);
  }
  for(i=0;i<7;i++){
    g.washes.push([OX+(0.1+rnd()*0.8)*S,OY+(0.1+rnd()*0.8)*S,(0.08+rnd()*0.14)*S,(0.06+rnd()*0.1)*S,0.05+rnd()*0.05]);
  }
  var lines=14;
  for(i=0;i<lines;i++){
    var y0=OY+S*(0.09+i*0.062);
    var pts=[];
    for(j=0;j<=16;j++){
      pts.push([OX+j/16*S, y0+(rnd()-0.5)*S*0.008 + Math.sin(j/16*Math.PI)*S*0.004]);
    }
    g.weave.push({pts:pts,start:i*0.25,dur:2.0});
  }
  for(var h=0;h<3;h++){
    var hand=HANDS[h];
    for(j=0;j<hand.count;j++){
      var px=OX+(0.08+rnd()*0.84)*S, py=OY+(0.12+rnd()*0.7)*S;
      var ang=(rnd()<0.5?1:-1)*(Math.PI/4)+(rnd()-0.5)*0.5;
      var pts2=[[px,py]], steps=42+((rnd()*20)|0);
      for(var k=0;k<steps;k++){
        ang+=(rnd()-0.5)*0.55*hand.loose;
        var st=S*0.016*(0.7+rnd()*0.6);
        px+=Math.cos(ang)*st; py+=Math.sin(ang)*st*0.7;
        if(px<OX+S*0.05){px=OX+S*0.05;ang=Math.PI-ang;}
        if(px>OX+S*0.95){px=OX+S*0.95;ang=Math.PI-ang;}
        if(py<OY+S*0.06){py=OY+S*0.06;ang=-ang;}
        if(py>OY+S*0.94){py=OY+S*0.94;ang=-ang;}
        pts2.push([px,py]);
      }
      for(var sm=0;sm<2;sm++){
        for(var si=1;si<pts2.length-1;si++){
          pts2[si][0]=(pts2[si-1][0]+pts2[si][0]*2+pts2[si+1][0])/4;
          pts2[si][1]=(pts2[si-1][1]+pts2[si][1]*2+pts2[si+1][1])/4;
        }
      }
      g.hands[h].push({pts:pts2,start:j*0.35,dur:1.6});
    }
  }
  var gc=rnd()<0.5?0:1, gx=OX+S*(gc===0?0.06:0.86), gy=OY+S*0.07;
  g.glint=[[gx,gy],[gx+S*0.028,gy+S*0.012],[gx+S*0.02,gy+S*0.038],[gx-S*0.006,gy+S*0.02]];
  geo=g; geoLoop=loop;
}
function polyline(pts,close){
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  if(close) ctx.closePath();
}
function dot(x,y,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
}
function draw(t){
  curT=t;
  var loop=Math.floor(t/LOOP), lt=t-loop*LOOP;
  if(loop!==geoLoop) buildFor(loop);
  var g=geo;
  ctx.globalAlpha=1;
  ctx.fillStyle='#2E2820';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.globalAlpha=0.35;
  ctx.fillStyle='#171310';
  ctx.save(); ctx.translate(S*0.012,S*0.014); polyline(g.deckle,true); ctx.fill(); ctx.restore();
  ctx.restore();
  ctx.fillStyle='#E9E2D0';
  polyline(g.deckle,true); ctx.fill();
  ctx.fillStyle='#D8CDB2';
  for(var i=0;i<g.washes.length;i++){
    var w=g.washes[i];
    ctx.globalAlpha=w[4];
    ctx.beginPath(); ctx.moveTo(w[0]+w[2],w[1]); ctx.arc(w[0],w[1],w[2],0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#CFC3A6';
  for(i=0;i<g.flecks.length;i++){
    var f=g.flecks[i];
    ctx.globalAlpha=f[3]*0.7;
    ctx.fillRect(f[0],f[1],Math.max(2,S*0.01),1);
  }
  ctx.globalAlpha=1;
  var shed=lt>=HOLD_END?1-(lt-HOLD_END)/(LOOP-HOLD_END):1;
  shed=clamp(shed,0,1);
  ctx.save();
  ctx.globalAlpha=shed;
  ctx.strokeStyle='#B0A68E';
  ctx.lineWidth=Math.max(1,S*0.0016);
  ctx.lineCap='round';
  for(i=0;i<g.weave.length;i++){
    var ln=g.weave[i];
    var p=clamp((lt-ln.start)/ln.dur,0,1);
    if(p<=0) continue;
    var n=Math.max(1,Math.floor(p*(ln.pts.length-1)));
    ctx.beginPath();
    ctx.moveTo(ln.pts[0][0],ln.pts[0][1]);
    for(var j=1;j<=n;j++) ctx.lineTo(ln.pts[j][0],ln.pts[j][1]);
    ctx.stroke();
  }
  for(var h=0;h<3;h++){
    var hand=HANDS[h];
    if(lt<hand.start) continue;
    ctx.strokeStyle=hand.color;
    ctx.lineCap='round';
    for(j=0;j<g.hands[h].length;j++){
      var sc=g.hands[h][j];
      var sp=clamp((lt-hand.start-sc.start)/sc.dur,0,1);
      if(sp<=0) continue;
      var m=Math.max(1,Math.floor(sp*(sc.pts.length-1)));
      for(var k=0;k<m;k++){
        ctx.lineWidth=hand.base*(0.55+0.75*Math.abs(Math.sin(k*0.7+j)));
        ctx.beginPath();
        ctx.moveTo(sc.pts[k][0],sc.pts[k][1]);
        ctx.lineTo(sc.pts[k+1][0],sc.pts[k+1][1]);
        ctx.stroke();
      }
    }
  }
  var ga=0;
  if(lt>=15.5&&lt<HOLD_END) ga=clamp((lt-15.5)/1.5,0,1);
  else if(lt>=HOLD_END) ga=shed;
  if(ga>0){
    ctx.globalAlpha=ga*0.85;
    ctx.fillStyle='#B8C4CC';
    polyline(g.glint,true); ctx.fill();
    ctx.globalAlpha=ga*0.5;
    ctx.strokeStyle='#E9E2D0';
    ctx.lineWidth=1;
    polyline(g.glint,true); ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha=0.55;
  ctx.strokeStyle='#B0A68E';
  ctx.lineWidth=1;
  polyline(g.deckle,true); ctx.stroke();
  ctx.globalAlpha=1;
}
function size(){
  var vw=(typeof window!=='undefined'&&window.visualViewport)?window.visualViewport.width:window.innerWidth;
  var vh=(typeof window!=='undefined'&&window.visualViewport)?window.visualViewport.height:window.innerHeight;
  W=vw;H=vh;
  canvas.width=W;canvas.height=H;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  var scr=(typeof window!=='undefined'&&window.screen)?window.screen:null;
  var minD=scr?Math.min(scr.width,scr.height):Math.min(W,H);
  phone=minD<700||H>W*1.15;
  S=Math.min(W,H)*(phone?0.92:0.86);
  OX=(W-S)/2;OY=(H-S)/2;
  geoLoop=-1;
  draw(curT);
}
size();
if(typeof window!=='undefined'){
  window.addEventListener('resize',size);
  if(window.visualViewport) window.visualViewport.addEventListener('resize',size);
}
draw(0);
var T0=null;
function loop(ts){
  if(T0===null) T0=ts;
  draw((ts-T0)/1000);
  if(typeof requestAnimationFrame!=='undefined') requestAnimationFrame(loop);
}
if(typeof requestAnimationFrame!=='undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
