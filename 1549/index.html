<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gathering, Not the Masterpiece</title>
<style>
html, body { margin: 0; padding: 0; background: #1c1814; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var TAU = Math.PI * 2;
var LOOP = 300;
var NM = 12;
var THRESH = 0.095;
var FIELD = '#1c1814';
var FLASH = '232,224,208';
var POOL = ['#d8cdb4', '#c98f3d', '#a34a2e', '#c9a86a', '#5a7a72', '#7a4a5a'];
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(1549000);
function a4(x) { return Math.round(x * 10000) / 10000; }
function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a4(a) + ')'; }
var POOL_RGB = [[216, 205, 180], [201, 143, 61], [163, 74, 46], [201, 168, 106], [90, 122, 114], [122, 74, 90]];
var FLASH_RGB = [232, 224, 208];
var shapeRng = mulberry32(1549001);
var shapeBag = ['dot', 'dot', 'dot', 'dot', 'bar', 'bar', 'bar', 'bar', 'ring', 'ring', 'ring', 'ring'];
for (var s = shapeBag.length - 1; s > 0; s--) {
  var q = Math.floor(shapeRng() * (s + 1));
  var tmp = shapeBag[s]; shapeBag[s] = shapeBag[q]; shapeBag[q] = tmp;
}
var marks = [];
for (var i = 0; i < NM; i++) {
  marks.push({
    a0: TAU * i / NM + (rng() - 0.5) * 0.12,
    rad: 0.30 + 0.14 * rng(),
    k: (rng() < 0.5 ? 1 : 2),
    shape: (rng(), shapeBag[i]),
    color: Math.floor(rng() * 6),
    pulse: [6, 12, 18][Math.floor(rng() * 3)],
    phi: rng() * TAU
  });
}
function posUnit(m, tau) {
  var ang = m.a0 + TAU * m.k * tau / LOOP;
  return [Math.cos(ang) * m.rad, Math.sin(ang) * m.rad];
}
function distUnit(i, j, tau) {
  var a = posUnit(marks[i], tau), b = posUnit(marks[j], tau);
  var dx = a[0] - b[0], dy = a[1] - b[1];
  return Math.sqrt(dx * dx + dy * dy);
}
var events = [];
var armed = {};
for (var i = 0; i < NM; i++) for (var j = i + 1; j < NM; j++) {
  armed[i + ':' + j] = distUnit(i, j, 0) >= THRESH;
}
var PROPS = ['color', 'shape', 'pulse'];
for (var t = 0.25; t < LOOP; t += 0.25) {
  for (var i = 0; i < NM; i++) for (var j = i + 1; j < NM; j++) {
    var key = i + ':' + j;
    var d = distUnit(i, j, t);
    if (armed[key] && d < THRESH) {
      events.push({ t: t, i: i, j: j, prop: PROPS[Math.floor(rng() * 3)], nc: Math.floor(rng() * 6) });
      armed[key] = false;
    } else if (!armed[key] && d > THRESH + 0.03) {
      armed[key] = true;
    }
  }
}
var dragEvents = [];
var dragCounter = 0;
var session = null;
var sessionCounter = 0;
var releases = {};
var lastT = 0;
var startT = null;
var VW = 720, VH = 720, S = 720;
function isPhone() {
  if (typeof window !== 'undefined' && window.screen) {
    var m = Math.min(window.screen.width, window.screen.height);
    if (m < 700) return true;
  }
  return VH > VW * 1.15;
}
function size() {
  var vw, vh;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  } else { vw = 720; vh = 720; }
  VW = vw; VH = vh; S = Math.min(VW, VH);
  canvas.width = VW; canvas.height = VH;
}
function schedState(tau) {
  var col = [], shp = [], pul = [];
  for (var i = 0; i < NM; i++) { col.push(marks[i].color); shp.push(marks[i].shape); pul.push(marks[i].pulse); }
  for (var e = 0; e < events.length; e++) {
    var ev = events[e];
    if (ev.t > tau) break;
    if (ev.prop === 'color') { var oc = col[ev.i]; col[ev.i] = col[ev.j]; col[ev.j] = ev.nc; }
    else if (ev.prop === 'shape') { var os = shp[ev.i]; shp[ev.i] = shp[ev.j]; shp[ev.j] = os; }
    else { var op = pul[ev.i]; pul[ev.i] = pul[ev.j]; pul[ev.j] = op; }
  }
  return { col: col, shp: shp, pul: pul };
}
function stateAt(t) {
  var loopIdx = Math.floor(t / LOOP);
  var tau = t - loopIdx * LOOP;
  var st = schedState(tau);
  for (var e = 0; e < dragEvents.length; e++) {
    var ev = dragEvents[e];
    if (ev.loopIdx !== loopIdx || ev.t > t) continue;
    if (ev.prop === 'color') { var oc = st.col[ev.i]; st.col[ev.i] = st.col[ev.j]; st.col[ev.j] = ev.nc; }
    else if (ev.prop === 'shape') { var os = st.shp[ev.i]; st.shp[ev.i] = st.shp[ev.j]; st.shp[ev.j] = os; }
    else { var op = st.pul[ev.i]; st.pul[ev.i] = st.pul[ev.j]; st.pul[ev.j] = op; }
  }
  return { loopIdx: loopIdx, tau: tau, col: st.col, shp: st.shp, pul: st.pul };
}
function smooth(u) { if (u <= 0) return 0; if (u >= 1) return 1; return u * u * (3 - 2 * u); }
function dispPos(i, t, st) {
  var u = posUnit(marks[i], st.tau);
  var px = VW / 2 + u[0] * S, py = VH / 2 + u[1] * S;
  if (session && session.mark === i) return [session.x, session.y];
  var rel = releases[i];
  if (rel && rel.loopIdx === st.loopIdx && t - rel.t < 2) {
    var w = smooth((t - rel.t) / 2);
    return [rel.pos[0] + (px - rel.pos[0]) * w, rel.pos[1] + (py - rel.pos[1]) * w];
  }
  return [px, py];
}
var hookMarks = [];
function publish(t, st) {
  hookMarks = [];
  for (var i = 0; i < NM; i++) {
    var p = dispPos(i, t, st);
    hookMarks.push({ x: p[0], y: p[1], color: st.col[i], shape: st.shp[i], pulse: st.pul[i], angle: marks[i].a0 + TAU * marks[i].k * st.tau / LOOP, rad: marks[i].rad });
  }
  if (typeof window !== 'undefined') {
    window.__p49 = { loop: LOOP, thresh: THRESH, count: NM, events: events, dragEvents: dragEvents, marks: hookMarks };
  }
}
function draw(t) {
  size();
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  var st = stateAt(t);
  ctx.fillStyle = FIELD;
  ctx.fillRect(0, 0, VW, VH);
  var cx = VW / 2, cy = VH / 2;
  for (var e = 0; e < events.length; e++) {
    var ev = events[e];
    var dt = st.tau - ev.t;
    if (dt >= 0 && dt < 1.2) {
      var pa = dispPos(ev.i, t, st), pb = dispPos(ev.j, t, st);
      ctx.fillStyle = rgba(FLASH_RGB, (1 - dt / 1.2) * 0.8);
      ctx.beginPath();
      ctx.moveTo((pa[0] + pb[0]) / 2 + 0.03 * S, (pa[1] + pb[1]) / 2);
      ctx.arc((pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2, 0.03 * S, 0, TAU);
      ctx.fill();
    }
  }
  for (var e = 0; e < dragEvents.length; e++) {
    var ev = dragEvents[e];
    if (ev.loopIdx !== st.loopIdx) continue;
    var dt = t - ev.t;
    if (dt >= 0 && dt < 1.2) {
      var pa = dispPos(ev.i, t, st), pb = dispPos(ev.j, t, st);
      ctx.fillStyle = rgba(FLASH_RGB, (1 - dt / 1.2) * 0.8);
      ctx.beginPath();
      ctx.moveTo((pa[0] + pb[0]) / 2 + 0.03 * S, (pa[1] + pb[1]) / 2);
      ctx.arc((pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2, 0.03 * S, 0, TAU);
      ctx.fill();
    }
  }
  for (var i = 0; i < NM; i++) {
    var p = dispPos(i, t, st);
    var sc = 1 + 0.15 * Math.sin(TAU * st.pul[i] * st.tau / LOOP + marks[i].phi);
    var rgb = POOL_RGB[st.col[i]];
    var ux = (p[0] - cx) / S, uy = (p[1] - cy) / S;
    var inward = Math.atan2(-uy, -ux);
    if (st.shp[i] === 'dot') {
      var ds = 0.02 * S * sc;
      ctx.fillStyle = POOL[st.col[i]];
      ctx.fillRect(p[0] - ds / 2, p[1] - ds / 2, ds, ds);
    } else if (st.shp[i] === 'bar') {
      var bl = 0.055 * S * sc, bw = 0.013 * S;
      ctx.save();
      ctx.translate(p[0], p[1]);
      ctx.rotate(inward);
      ctx.fillStyle = POOL[st.col[i]];
      ctx.fillRect(-bl / 2, -bw / 2, bl, bw);
      ctx.restore();
    } else {
      ctx.strokeStyle = POOL[st.col[i]];
      ctx.lineWidth = 0.005 * S;
      ctx.beginPath();
      ctx.moveTo(p[0] + 0.024 * S * sc, p[1]);
      ctx.arc(p[0], p[1], 0.024 * S * sc, 0, TAU);
      ctx.stroke();
    }
    void rgb;
  }
  publish(t, st);
}
function nearestMark(x, y) {
  var st = stateAt(lastT);
  var best = -1, bestD = 0.06 * S;
  for (var i = 0; i < NM; i++) {
    var p = dispPos(i, lastT, st);
    var dx = p[0] - x, dy = p[1] - y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}
function fireDragExchanges() {
  if (!session) return;
  var st = stateAt(lastT);
  var loopIdx = Math.floor(lastT / LOOP);
  for (var j = 0; j < NM; j++) {
    if (j === session.mark) continue;
    var p = dispPos(j, lastT, st);
    var dx = p[0] - session.x, dy = p[1] - session.y;
    if (Math.sqrt(dx * dx + dy * dy) < THRESH * S) {
      var seen = false;
      for (var e = 0; e < dragEvents.length; e++) {
        var ev = dragEvents[e];
        if (ev.sessionId === session.id && ((ev.i === session.mark && ev.j === j) || (ev.i === j && ev.j === session.mark))) { seen = true; break; }
      }
      if (!seen) {
        var prop = PROPS[dragCounter % 3];
        dragEvents.push({ loopIdx: loopIdx, t: lastT, i: session.mark, j: j, prop: prop, nc: (session.mark + j + dragCounter) % 6, sessionId: session.id });
        dragCounter++;
      }
    }
  }
}
canvas.addEventListener('pointerdown', function (e) {
  var m = nearestMark(e.clientX, e.clientY);
  if (m >= 0) {
    sessionCounter++;
    session = { id: sessionCounter, mark: m, x: e.clientX, y: e.clientY };
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!session) return;
  session.x = e.clientX; session.y = e.clientY;
  fireDragExchanges();
});
function endSession() {
  if (!session) return;
  releases[session.mark] = { loopIdx: Math.floor(lastT / LOOP), t: lastT, pos: [session.x, session.y] };
  session = null;
}
canvas.addEventListener('pointerup', endSession);
canvas.addEventListener('pointercancel', endSession);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  lastT = t;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
size();
draw(0);
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
