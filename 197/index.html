<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.197 Bike-Chain Fur</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#060606; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.197 Bike-Chain Fur (Amanda Willshire). Sassy the Sasquatch,
// eleven feet and eleven hundred pounds of her, wearing fur that is
// not fur at all: thousands of tiny interlocking chain links, combed
// in a direction field over her body mass, recycled bike chains from
// four states. Drag across her and the links part and ripple like
// disturbed chainmail, then settle back with heavy metallic lag.
// The scene darkens on a forty five second cycle, and at full dark
// her two blue eyes bloom. No face beyond the eyes.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#060606', LINK = '#1F2421', RIM = '#4A5050', EYE = '#38BDF8';
var W = 0, H = 0, phone = false;
var seed = 197197;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function smooth(a, b, x) { var k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); }

// ---- silhouette: union of ellipses in figure space ------------------
// fx is horizontal in units of figure height, fy runs 0 (top) to 1.
var PARTS = [
  [0, 0.100, 0.090, 0.084],      // head
  [0, 0.228, 0.190, 0.088],      // shoulders
  [0, 0.460, 0.168, 0.262],      // torso
  [-0.208, 0.470, 0.050, 0.212], // left arm
  [0.208, 0.470, 0.050, 0.212],  // right arm
  [0, 0.680, 0.152, 0.092],      // hips
  [-0.076, 0.832, 0.070, 0.156], // left leg
  [0.076, 0.832, 0.070, 0.156],  // right leg
  [-0.098, 0.972, 0.072, 0.028], // left foot
  [0.098, 0.972, 0.072, 0.028]   // right foot
];
function insideFig(fx, fy) {
  for (var i = 0; i < PARTS.length; i++) {
    var p = PARTS[i];
    var dx = (fx - p[0]) / p[2], dy = (fy - p[1]) / p[3];
    if (dx * dx + dy * dy <= 1) return true;
  }
  return false;
}
function figGeom() {
  var fh = H * 0.85;
  return { fh: fh, cx: W / 2, top: H * 0.065 };
}

// ---- link field -------------------------------------------------------
var links = [];
function buildLinks() {
  links = [];
  var g = figGeom();
  var s = g.fh / (phone ? 100 : 116);
  var L = s * 1.78, Wd = s * 1.04;
  var r = rng(seed ^ 0x9E3779B9);
  var row = 0;
  for (var y = g.top + s * 0.4; y < g.top + g.fh; y += s * 0.82, row++) {
    var xoff = (row % 2) ? s * 0.5 : 0;
    var col = 0;
    for (var x = g.cx - g.fh * 0.30 + xoff; x < g.cx + g.fh * 0.30; x += s, col++) {
      var fx = (x - g.cx) / g.fh, fy = (y - g.top) / g.fh;
      if (!insideFig(fx, fy)) continue;
      // comb direction: hangs downward, sweeping out from the spine,
      // with a slow wave so the combing reads hand-laid, not machined
      var vx = 0.55 * fx + 0.22 * Math.sin(fy * 9 + fx * 3.1);
      var vy = 1;
      // around the head the fur radiates off the skull before falling
      var hx = fx, hy = fy - 0.105;
      var hd = Math.sqrt(hx * hx + hy * hy);
      if (hd < 0.17) {
        var rad = Math.atan2(hy, hx);
        var rk = 1 - hd / 0.17;
        var rx = Math.cos(rad), ry = Math.sin(rad) * 0.6 + 0.55;
        vx = vx * (1 - rk) + rx * rk;
        vy = vy * (1 - rk) + ry * rk;
      }
      var ang = Math.atan2(vy, vx);
      links.push({
        x: x, y: y, ang: ang, L: L, Wd: Wd, par: (row + col) % 2,
        lit: r(), ox: 0, oy: 0, vx: 0, vy: 0
      });
    }
  }
}

// ---- darkness cycle ----------------------------------------------------
var T = 10, lastNow = -1;  // frame one: mid light, eyes faint
function darknessAt(t) {
  var p = (t % 45) / 45;
  if (p < 0.50) return 0;
  if (p < 0.65) return smooth(0.50, 0.65, p);
  if (p < 0.80) return 1;
  if (p < 0.95) return 1 - smooth(0.80, 0.95, p);
  return 0;
}

// ---- input: drag parts the fur ----------------------------------------
var dragging = false, lastPX = 0, lastPY = 0;
function disturb(px, py, mvx, mvy) {
  var g = figGeom();
  var R = g.fh * 0.10;
  for (var i = 0; i < links.length; i++) {
    var lk = links[i];
    var dx = lk.x + lk.ox - px, dy = lk.y + lk.oy - py;
    var d2 = dx * dx + dy * dy;
    if (d2 > R * R) continue;
    var d = Math.sqrt(d2) || 1;
    var fall = 1 - d / R;
    fall = fall * fall;
    // part: push radially away from the drag path, carried along the drag
    lk.vx += (dx / d * 0.85 + mvx * 0.55) * fall * 300;
    lk.vy += (dy / d * 0.85 + mvy * 0.55) * fall * 300;
  }
}
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; lastPX = e.clientX; lastPY = e.clientY;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var mvx = (e.clientX - lastPX), mvy = (e.clientY - lastPY);
  disturb(e.clientX, e.clientY, clamp(mvx, -30, 30), clamp(mvy, -30, 30));
  disturb((e.clientX + lastPX) / 2, (e.clientY + lastPY) / 2, clamp(mvx, -30, 30), clamp(mvy, -30, 30));
  lastPX = e.clientX; lastPY = e.clientY;
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- resize --------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
  buildLinks();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- draw ------------------------------------------------------------------
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && now > 0) {
    dt = Math.min(0.033, (now - lastNow) / 1000);
    T += dt;
  }
  lastNow = now;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var g = figGeom();
  // body mass: the silhouette in deep shadow under the links
  ctx.fillStyle = '#000000';
  ctx.globalAlpha = 0.55;
  for (var i = 0; i < PARTS.length; i++) {
    var p = PARTS[i];
    ctx.beginPath();
    ctx.ellipse(g.cx + p[0] * g.fh, g.top + p[1] * g.fh, p[2] * g.fh, p[3] * g.fh, 0, 0, 6.284);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // breathing: the whole field shifts a pixel or two on a 6s cycle
  var bx = Math.sin(T * 6.2832 / 6) * 1.3;
  var by = Math.cos(T * 6.2832 / 6) * 0.8;
  ctx.lineWidth = Math.max(1, g.fh * 0.0021);
  for (var j = 0; j < links.length; j++) {
    var lk = links[j];
    if (dt > 0) {
      // heavy spring home: stiff enough to return, loose enough to lag
      var ax = -lk.ox * 30 - lk.vx * 6;
      var ay = -lk.oy * 30 - lk.vy * 6;
      lk.vx += ax * dt; lk.vy += ay * dt;
      lk.ox += lk.vx * dt; lk.oy += lk.vy * dt;
    }
    var px = lk.x + lk.ox + bx, py = lk.y + lk.oy + by;
    var disp = Math.sqrt(lk.ox * lk.ox + lk.oy * lk.oy);
    // neighbouring links alternate orientation, the way chain links
    // interlock: one loop lies along the comb, the next across it
    var ga = lk.ang + (lk.par ? Math.PI / 2 : 0);
    var ca = Math.cos(ga), sa = Math.sin(ga);
    ctx.setTransform(ca, sa, -sa, ca, px, py);
    ctx.strokeStyle = LINK;
    ctx.beginPath();
    ctx.ellipse(0, 0, lk.L * 0.46, lk.Wd * 0.52, 0, 0, 6.284);
    ctx.stroke();
    // rim light: a partial arc on the loop's upper shoulder, brighter
    // where the fur is disturbed or the link was dealt a lit hand
    var litK = lk.lit * 0.75 + clamp(disp / 26, 0, 0.6);
    if (litK > 0.42) {
      ctx.strokeStyle = RIM;
      ctx.globalAlpha = clamp((litK - 0.42) * 1.6, 0, 0.95);
      ctx.beginPath();
      ctx.ellipse(0, 0, lk.L * 0.46, lk.Wd * 0.52, 0, Math.PI * 0.9, Math.PI * 1.65);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // the scene darkens; the eyes answer
  var dk = darknessAt(T);
  if (dk > 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + (dk * 0.52).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  var glow = 0.16 + 0.84 * dk;
  var ex = 0.033 * g.fh, ey = g.top + 0.105 * g.fh;
  for (var s = -1; s <= 1; s += 2) {
    var cxE = g.cx + s * ex;
    var gr = ctx.createRadialGradient(cxE, ey, 0, cxE, ey, (8 + 42 * dk) * (g.fh / 760));
    gr.addColorStop(0, 'rgba(56,189,248,' + (0.55 * glow).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(56,189,248,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(cxE - 60, ey - 60, 120, 120);
    ctx.beginPath();
    ctx.arc(cxE, ey, Math.max(1.6, g.fh * 0.0032), 0, 6.284);
    ctx.fillStyle = EYE;
    ctx.globalAlpha = 0.35 + 0.65 * dk;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
