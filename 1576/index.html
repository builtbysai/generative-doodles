<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sine, Quad, Cubic, Quint, Expo</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0B0E; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0B0B0E';
var WARM = '#F2EDE4';
var AMBER = '#D9A441';
var LOOP = 9;                      // pulse loop, seconds (shared; each easing paces it)
var DRIFT = 36;                    // camera drift period, seconds (linear, triangle wave)
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var seed = 1576;
// Five easing functions, each extruded as a physical ribbon inside a glass
// cube. The pulse travels along each ribbon at that ribbon's own easing
// rate: the motion IS the function. Sine is gentle, Expo slams the corner.
var FUNS = [
  { name: 'SINE',  variant: 'IN-OUT', ease: function (u) { return 0.5 - 0.5 * Math.cos(Math.PI * u); }, color: WARM },
  { name: 'QUAD',  variant: 'IN',     ease: function (u) { return u * u; }, color: WARM },
  { name: 'CUBIC', variant: 'OUT',    ease: function (u) { var v = 1 - u; return 1 - v * v * v; }, color: WARM },
  { name: 'QUINT', variant: 'IN',     ease: function (u) { return u * u * u * u * u; }, color: WARM },
  { name: 'EXPO',  variant: 'IN',     ease: function (u) { return u === 0 ? 0 : Math.pow(2, 10 * (u - 1)); }, color: AMBER }
];
var scrub = 0;                     // shared pulse-phase scrub, 0..1
var downX = 0, downScrub = 0, dragging = false;
var widths = [];                   // per-ribbon band width factor, seeded
var placedW = 0, placedH = 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
function build() {
  var rnd = mulberry32(seed);
  var i;
  widths = [];
  for (i = 0; i < FUNS.length; i++) widths.push(0.05 + rnd() * 0.02);
  placedW = VW; placedH = VH;
}
// Ribbon centreline point at parameter u inside the cube's front face.
function ribbonPoint(f, x0, x1, yBot, yTop, u) {
  return { x: x0 + u * (x1 - x0), y: yBot - f.ease(u) * (yBot - yTop) };
}
function drawRibbon(f, wi, x0, x1, yBot, yTop, bandW, phase) {
  var N = 48, k, u;
  var pts = [];
  for (k = 0; k <= N; k++) {
    u = k / N;
    pts.push(ribbonPoint(f, x0, x1, yBot, yTop, u));
  }
  // Swept band: quads along the centreline, offset by the curve normal.
  ctx.beginPath();
  var i, p, q, dx, dy, len, nx, ny;
  for (i = 0; i <= N; i++) {
    p = pts[i];
    q = pts[Math.min(i + 1, N)];
    var r = pts[Math.max(i - 1, 0)];
    dx = q.x - r.x; dy = q.y - r.y;
    len = Math.sqrt(dx * dx + dy * dy) || 1;
    nx = -dy / len * bandW / 2; ny = dx / len * bandW / 2;
    if (i === 0) ctx.moveTo(p.x + nx, p.y + ny);
    else ctx.lineTo(p.x + nx, p.y + ny);
  }
  for (i = N; i >= 0; i--) {
    p = pts[i];
    q = pts[Math.min(i + 1, N)];
    var r2 = pts[Math.max(i - 1, 0)];
    dx = q.x - r2.x; dy = q.y - r2.y;
    len = Math.sqrt(dx * dx + dy * dy) || 1;
    nx = -dy / len * bandW / 2; ny = dx / len * bandW / 2;
    ctx.lineTo(p.x - nx, p.y - ny);
  }
  ctx.closePath();
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = f.color;
  ctx.fill();
  ctx.globalAlpha = 1;
  // Pulse: a bright band whose position advances by the easing function.
  var s0 = Math.max(0, phase - 0.055), s1 = Math.min(1, phase + 0.055);
  var M = 10, j, uu;
  ctx.beginPath();
  for (j = 0; j <= M; j++) {
    uu = s0 + (s1 - s0) * j / M;
    p = ribbonPoint(f, x0, x1, yBot, yTop, uu);
    q = ribbonPoint(f, x0, x1, yBot, yTop, Math.min(uu + 0.01, 1));
    var r3 = ribbonPoint(f, x0, x1, yBot, yTop, Math.max(uu - 0.01, 0));
    dx = q.x - r3.x; dy = q.y - r3.y;
    len = Math.sqrt(dx * dx + dy * dy) || 1;
    nx = -dy / len * bandW * 0.75; ny = dx / len * bandW * 0.75;
    if (j === 0) ctx.moveTo(p.x + nx, p.y + ny);
    else ctx.lineTo(p.x + nx, p.y + ny);
  }
  for (j = M; j >= 0; j--) {
    uu = s0 + (s1 - s0) * j / M;
    p = ribbonPoint(f, x0, x1, yBot, yTop, uu);
    q = ribbonPoint(f, x0, x1, yBot, yTop, Math.min(uu + 0.01, 1));
    var r4 = ribbonPoint(f, x0, x1, yBot, yTop, Math.max(uu - 0.01, 0));
    dx = q.x - r4.x; dy = q.y - r4.y;
    len = Math.sqrt(dx * dx + dy * dy) || 1;
    nx = -dy / len * bandW * 0.75; ny = dx / len * bandW * 0.75;
    ctx.lineTo(p.x - nx, p.y - ny);
  }
  ctx.closePath();
  ctx.globalAlpha = 0.98;
  ctx.fillStyle = '#FFFFFF';
  ctx.fill();
  ctx.globalAlpha = 1;
  // Pulse head dot.
  var head = ribbonPoint(f, x0, x1, yBot, yTop, phase);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.moveTo(head.x + bandW * 0.55, head.y);
  ctx.arc(head.x, head.y, bandW * 0.55, 0, TAU);
  ctx.fill();
}
function drawCube(f, wi, cx, cy, s, phase) {
  var d = s * 0.17;                // glass depth offset, up-right
  var x0 = cx - s / 2, y0 = cy - s / 2, x1 = cx + s / 2, y1 = cy + s / 2;
  var u = Math.min(VW, VH) / 900;
  ctx.lineWidth = Math.max(1, 1.4 * u);
  // Back face (glass, faint).
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(x0 + d, y0 - d, s, s);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(242,237,228,0.22)';
  ctx.strokeRect(x0 + d, y0 - d, s, s);
  // Connecting edges.
  ctx.strokeStyle = 'rgba(242,237,228,0.30)';
  ctx.beginPath();
  ctx.moveTo(x0, y0); ctx.lineTo(x0 + d, y0 - d);
  ctx.moveTo(x1, y0); ctx.lineTo(x1 + d, y0 - d);
  ctx.moveTo(x0, y1); ctx.lineTo(x0 + d, y1 - d);
  ctx.moveTo(x1, y1); ctx.lineTo(x1 + d, y1 - d);
  ctx.stroke();
  // Ribbon inside the front face.
  var m = s * 0.15;
  var rx0 = x0 + m, rx1 = x1 - m, ryBot = y1 - m, ryTop = y0 + m;
  drawRibbon(f, wi, rx0, rx1, ryBot, ryTop, s * widths[wi], phase);
  // Front face: faint glass veil over the ribbon, then bright edges.
  ctx.globalAlpha = 0.04;
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(x0, y0, s, s);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(242,237,228,0.55)';
  ctx.strokeRect(x0, y0, s, s);
  // Labeled swatch bar under the cube: name + variant, ribbon color chip.
  var bh = Math.max(14, s * 0.17);
  var by = y1 + s * 0.07;
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = WARM;
  ctx.fillRect(x0, by, s, bh);
  ctx.globalAlpha = 1;
  ctx.fillStyle = f.color;
  ctx.fillRect(x0, by, Math.max(3, s * 0.045), bh);
  ctx.fillStyle = f.color;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  var label = f.name + ' · ' + f.variant;
  var fs = Math.max(8, Math.round(s * 0.082));
  ctx.font = fs + 'px sans-serif';
  while (fs > 7 && ctx.measureText(label).width > s - Math.max(6, s * 0.1)) {
    fs -= 1;
    ctx.font = fs + 'px sans-serif';
  }
  ctx.fillText(label, cx, by + bh / 2 + 0.5);
  ctx.textAlign = 'left';
}
function draw(t) {
  lastT = t;
  size();
  if (widths.length === 0 || placedW !== VW || placedH !== VH) build();
  var minDim = Math.min(VW, VH);
  var u = minDim / 900;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  // Camera drifts slowly along the row, linearly (triangle wave: linear
  // segments, no easing anywhere in the camera).
  var dt = (t / DRIFT) % 2;
  var drift = (dt < 1 ? dt : 2 - dt) - 0.5;   // -0.5 .. 0.5, linear
  var rowW = VW * 0.85;
  var gap = rowW * 0.022;
  var s = (rowW - 4 * gap) / 5;
  var driftPx = drift * s * 0.55;
  var cyBase = VH * 0.44;
  var arc = s * 0.22;
  var i;
  for (i = 0; i < FUNS.length; i++) {
    var cx = VW / 2 + (i - 2) * (s + gap) + driftPx;
    var cy = cyBase + arc * ((i - 2) * (i - 2) / 4);
    var stagger = i * 0.13;
    var ph = (t / LOOP + stagger + scrub) % 1;
    if (ph < 0) ph += 1;
    var pulseU = FUNS[i].ease(ph);   // pulse position advances by the easing
    drawCube(FUNS[i], i, cx, cy, s, pulseU);
  }
  // Caption: title, formula date, drag cue. Warm-white chip, near-black text.
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'Sine, Quad, Cubic, Quint, Expo  ·  2006 · 05 · 06  ·  Drag to scrub the pulses.';
  ctx.font = fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  if (tw > VW - 16) {
    label = 'Sine, Quad, Cubic, Quint, Expo  ·  Drag to scrub the pulses.';
    ctx.font = fs + 'px sans-serif';
    tw = ctx.measureText(label).width;
  }
  while (fs > 7 && tw > VW - 16) {
    fs -= 1;
    ctx.font = fs + 'px sans-serif';
    tw = ctx.measureText(label).width;
  }
  var pad = Math.round(fs * 0.7);
  var bx = Math.round(fs * 0.8), by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  ctx.fillStyle = WARM;
  ctx.fillRect(bx - pad, by, Math.ceil(tw) + 2 * pad, fs + 2 * pad);
  ctx.fillStyle = GROUND;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText(label, bx, by + pad);
  if (typeof window !== 'undefined') {
    window.__p1576 = {
      t: t, seed: seed, cubes: FUNS.length, scrub: scrub,
      drift: drift, phone: isPhone()
    };
  }
}
function onDown(e) {
  dragging = true;
  downX = e.clientX;
  downScrub = scrub;
}
function onMove(e) {
  if (!dragging) return;
  scrub = downScrub + (e.clientX - downX) / (VW * 0.6);
  scrub = scrub - Math.floor(scrub);
  draw(lastT);
}
function onUp() { dragging = false; }
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof document !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
