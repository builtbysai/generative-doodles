<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinity Dawn</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FDF6EF;
  }
  canvas {
    display: block;
    margin: 0;
    padding: 0;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Palette (strict): dawn, noon, dusk, floor-curve hint.
  var DAWN = [253, 246, 239]; // #FDF6EF
  var NOON = [255, 255, 255]; // #FFFFFF
  var DUSK = [246, 233, 216]; // #F6E9D8
  var FLOOR = [236, 229, 216]; // #ECE5D8

  // Color-temperature cycle: 80 s seamless loop, four 20 s legs.
  // dawn -> noon -> dusk -> noon -> dawn, so the temperature is
  // always drifting and never rests on a keyframe.
  var LOOP = 80;
  var KEYS = [DAWN, NOON, DUSK, NOON];

  function mix(a, b, u) {
    return [
      a[0] + (b[0] - a[0]) * u,
      a[1] + (b[1] - a[1]) * u,
      a[2] + (b[2] - a[2]) * u
    ];
  }

  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }

  // Closed-form field temperature at time t (seconds). Cosine-eased
  // interpolation between keyframes; at t = 0 this is exactly DAWN.
  function temperature(t) {
    var phase = ((t % LOOP) + LOOP) % LOOP;
    var leg = Math.floor(phase / 20);
    var u = (phase - leg * 20) / 20;
    var e = 0.5 - 0.5 * Math.cos(u * Math.PI);
    return mix(KEYS[leg], KEYS[(leg + 1) % KEYS.length], e);
  }

  // Seeded RNG (mulberry32) for the precomputed grain field.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var r = Math.imul(a ^ (a >>> 15), 1 | a);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Grain: fixed positions (fractions of the frame), fixed phase and
  // polarity per speck. Alpha is a closed-form shimmer of t, so the
  // field is deterministic at every instant, including t = 0.
  var GRAIN_COUNT = 5200;
  var grain = [];
  (function buildGrain() {
    var rnd = mulberry32(776001);
    for (var i = 0; i < GRAIN_COUNT; i++) {
      grain.push({
        x: rnd(),
        y: rnd(),
        phase: rnd() * Math.PI * 2,
        speed: 0.25 + rnd() * 0.55,
        dark: rnd() < 0.62
      });
    }
  })();

  var viewW = 0;
  var viewH = 0;
  var isPhone = false;

  function measure() {
    var vv = window.visualViewport;
    viewW = vv ? vv.width : window.innerWidth;
    viewH = vv ? vv.height : window.innerHeight;
    var sw = window.screen ? window.screen.width : viewW;
    var sh = window.screen ? window.screen.height : viewH;
    isPhone = Math.min(sw, sh) < 700 || viewH > viewW * 1.15;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw(t) {
    var w = viewW;
    var h = viewH;
    if (!w || !h) return;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    var temp = temperature(t);

    // Field: fine horizontal bands. Each band's color is the current
    // temperature mix; below the upper two-thirds a cosine-profiled
    // dip blends toward the floor hint, peaking at about 3 percent,
    // which reads as the coved floor curve of the infinity room.
    // No gradients anywhere: many thin flat bands read as continuous.
    var bandH = 2;
    var dipStart = h * 0.62;
    for (var y = 0; y < h; y += bandH) {
      var c = temp;
      if (y > dipStart) {
        var v = (y - dipStart) / (h - dipStart);
        var dip = 0.5 - 0.5 * Math.cos(v * Math.PI);
        c = mix(temp, FLOOR, dip * 0.25);
      }
      ctx.fillStyle = rgb(c);
      ctx.fillRect(0, y, w, bandH + 1);
    }

    // Floor-curve warmth: one large, very soft-edged warm shape laid
    // at the bottom at low alpha, built from nested flat ellipses so
    // it has no visible contour. It warms and cools with the cycle
    // because its alpha rides the red channel's distance from noon.
    var warmth = 1 - Math.abs(temp[0] - 255) / 9; // 0 at noon, ~1 at dawn/dusk ends
    var baseA = 0.010 + 0.006 * warmth;
    var cx = w * 0.5;
    var cy = h * 1.08;
    var layers = 7;
    for (var i = layers - 1; i >= 0; i--) {
      var f = (i + 1) / layers;
      ctx.fillStyle = 'rgba(236,229,216,' + (baseA * (1 - f * 0.55)).toFixed(4) + ')';
      ctx.beginPath();
      ctx.ellipse(cx, cy, w * 0.62 * f, h * 0.42 * f, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Grain dither: fixed specks at about 1 percent opacity, alpha
    // shimmering almost imperceptibly. The dither breaks up any
    // residual band steps so the field reads as lit air.
    var size = isPhone ? 1 : 1.4;
    for (var g = 0; g < GRAIN_COUNT; g++) {
      var p = grain[g];
      var a = 0.008 + 0.006 * (0.5 + 0.5 * Math.sin(t * p.speed + p.phase));
      ctx.fillStyle = p.dark
        ? 'rgba(236,229,216,' + a.toFixed(4) + ')'
        : 'rgba(255,255,255,' + a.toFixed(4) + ')';
      ctx.fillRect(p.x * w, p.y * h, size, size);
    }
  }

  function resize() {
    measure();
    draw(lastT);
  }

  var lastT = 0;
  measure();
  draw(0);

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  // Watch-only: no pointer interaction of any kind. The room is to
  // inhabit, not to operate.
  if (typeof window.requestAnimationFrame === 'function') {
    var start = null;
    var frame = function (ts) {
      if (start === null) start = ts;
      lastT = (ts - start) / 1000;
      draw(lastT);
      window.requestAnimationFrame(frame);
    };
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
