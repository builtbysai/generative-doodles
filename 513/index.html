<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island of Small Things</title>
<style>
  html, body { margin: 0; padding: 0; background: #F2285E; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var DW = 1080, DH = 1080;              // design stage, square logic
  var PHASE0 = 1.7;                      // constant first-frame loop phase, seconds
  var PINK = '#F2285E';
  var BLACK = '#161616';
  var SEA = '#2033B0';
  var YELLOW = '#F5C81C';
  var CREAM = '#F7F2E4';
  var MOTIF_COLORS = ['#E6392B', '#F0A02B', '#2AA6A0', '#F0608E', '#F2F2E4', '#8A5FB0'];
  var BASE_Y = 976;                      // silhouette base line, resting on the sea strip

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- hand-drawn stroke glyphs, unit box (x 0..1, y 0..1, y down) ----------
  function ellipsePts(cx, cy, rx, ry, n) {
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var a = (i / n) * Math.PI * 2;
      pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }
    return pts;
  }
  var GLYPHS = {
    A: [[[0, 1], [0.5, 0], [1, 1]], [[0.24, 0.64], [0.76, 0.64]]],
    B: [[[0.08, 1], [0.08, 0]], [[0.08, 0], [0.55, 0], [0.78, 0.1], [0.78, 0.32], [0.55, 0.47], [0.08, 0.47]], [[0.08, 0.47], [0.6, 0.47], [0.85, 0.58], [0.85, 0.85], [0.6, 1], [0.08, 1]]],
    C: [[[0.88, 0.18], [0.68, 0.03], [0.38, 0.02], [0.14, 0.2], [0.08, 0.5], [0.14, 0.8], [0.38, 0.98], [0.68, 0.97], [0.88, 0.82]]],
    D: [[[0.1, 1], [0.1, 0]], [[0.1, 0], [0.5, 0.01], [0.8, 0.18], [0.9, 0.5], [0.8, 0.82], [0.5, 0.99], [0.1, 1]]],
    E: [[[0.82, 0.02], [0.12, 0], [0.1, 0.5], [0.1, 1], [0.84, 0.97]], [[0.1, 0.5], [0.6, 0.5]]],
    F: [[[0.84, 0.02], [0.12, 0], [0.1, 1]], [[0.1, 0.5], [0.58, 0.5]]],
    G: [[[0.88, 0.2], [0.66, 0.03], [0.36, 0.03], [0.13, 0.22], [0.09, 0.52], [0.15, 0.8], [0.4, 0.97], [0.7, 0.96], [0.9, 0.78], [0.9, 0.56], [0.58, 0.56]]],
    H: [[[0.1, 0], [0.1, 1]], [[0.9, 0], [0.9, 1]], [[0.1, 0.5], [0.9, 0.5]]],
    I: [[[0.5, 0.04], [0.5, 0.96]], [[0.22, 0.02], [0.78, 0.02]], [[0.22, 0.98], [0.78, 0.98]]],
    J: [[[0.85, 0.02], [0.85, 0.72], [0.68, 0.94], [0.38, 0.98], [0.16, 0.84]]],
    K: [[[0.1, 0], [0.1, 1]], [[0.86, 0.02], [0.16, 0.56]], [[0.3, 0.42], [0.88, 1]]],
    L: [[[0.12, 0], [0.1, 1], [0.82, 0.97]]],
    M: [[[0.05, 1], [0.08, 0.02], [0.5, 0.52], [0.92, 0.02], [0.95, 1]]],
    N: [[[0.1, 1], [0.1, 0.02], [0.9, 0.98], [0.9, 0.02]]],
    O: [ellipsePts(0.5, 0.5, 0.42, 0.5, 16)],
    P: [[[0.1, 1], [0.1, 0]], [[0.1, 0.02], [0.58, 0], [0.84, 0.14], [0.84, 0.36], [0.58, 0.5], [0.1, 0.5]]],
    Q: [ellipsePts(0.48, 0.48, 0.4, 0.48, 16), [[0.58, 0.72], [0.98, 1.04]]],
    R: [[[0.1, 1], [0.1, 0]], [[0.1, 0.02], [0.58, 0], [0.84, 0.14], [0.84, 0.36], [0.58, 0.5], [0.1, 0.5]], [[0.48, 0.5], [0.9, 1]]],
    S: [[[0.86, 0.16], [0.64, 0.03], [0.34, 0.04], [0.14, 0.2], [0.18, 0.4], [0.44, 0.52], [0.74, 0.6], [0.86, 0.76], [0.72, 0.94], [0.4, 0.98], [0.14, 0.86]]],
    T: [[[0.04, 0.03], [0.96, 0.03]], [[0.5, 0.03], [0.5, 1]]],
    U: [[[0.08, 0.02], [0.1, 0.68], [0.26, 0.92], [0.52, 1], [0.78, 0.92], [0.9, 0.66], [0.92, 0.02]]],
    V: [[[0.04, 0.02], [0.5, 0.98], [0.96, 0.02]]],
    X: [[[0.08, 0.02], [0.92, 0.98]], [[0.92, 0.02], [0.08, 0.98]]],
    Y: [[[0.05, 0.02], [0.5, 0.44], [0.95, 0.02]], [[0.5, 0.44], [0.5, 1]]],
    Z: [[[0.06, 0.03], [0.94, 0.03], [0.08, 0.97], [0.95, 0.97]]]
  };

  // invented three-word phrases only, never real words
  var PHRASES = [
    ['EHI', 'LAGGIU', 'BASTE'],
    ['OMI', 'LAGGIU', 'BASTU'],
    ['UMA', 'LAGUMA', 'BASTI'],
    ['ILO', 'LAGGIU', 'BASTE']
  ];
  var THEMES = [
    ['bottle', 'cup', 'fork', 'star'],
    ['shell', 'fish', 'star', 'ball'],
    ['flower', 'ball', 'cup', 'shell'],
    ['bottle', 'flower', 'fish', 'spoon', 'star', 'cup']
  ];
  var THEME_NAMES = ['table things', 'sea things', 'garden things', 'mixed small things'];
  var TYPE_NAMES = ['island', 'whale', 'mountain'];

  // ---------- scene ----------
  var seed = 513062;
  try {
    var sm = /[?&]seed=(\d+)/.exec(location.search || '');
    if (sm) seed = parseInt(sm[1], 10) >>> 0;
  } catch (e) { /* fixed seed stands */ }

  function insideMargin(circles, x, y, m) {
    for (var i = 0; i < circles.length; i++) {
      var c = circles[i], dx = x - c.x, dy = y - c.y;
      if (Math.sqrt(dx * dx + dy * dy) < c.r - m) return true;
    }
    return false;
  }
  function contourY(circles, x) {
    var best = null;
    for (var i = 0; i < circles.length; i++) {
      var c = circles[i], dx = x - c.x;
      if (Math.abs(dx) < c.r) {
        var y = c.y - Math.sqrt(c.r * c.r - dx * dx);
        if (best === null || y < best) best = y;
      }
    }
    return best;
  }

  var scene = null;
  function buildScene(s) {
    var rng = mulberry32(s);
    var type = Math.floor(rng() * 3);
    var j = function (v, amt) { return v + (rng() - 0.5) * 2 * amt; };
    var circles = [];
    var defs;
    if (type === 0) {          // island: wide mound with humps
      defs = [[220, 860, 165], [370, 850, 235], [550, 845, 275], [725, 850, 220], [860, 865, 155],
              [460, 715, 165], [635, 725, 150], [545, 620, 130]];
    } else if (type === 1) {   // whale: long body, rising tail
      defs = [[320, 800, 195], [500, 790, 215], [665, 800, 180], [790, 745, 120], [862, 665, 82],
              [895, 610, 55], [845, 598, 50], [430, 700, 140]];
    } else {                   // mountain: stacked peak
      defs = [[230, 880, 160], [400, 875, 185], [570, 875, 190], [740, 878, 175], [870, 885, 145],
              [455, 745, 155], [620, 750, 145], [540, 600, 150], [540, 478, 96]];
    }
    for (var i = 0; i < defs.length; i++) {
      circles.push({ x: j(defs[i][0], 16), y: j(defs[i][1], 12), r: j(defs[i][2], 14) });
    }

    var phrase = PHRASES[Math.floor(rng() * PHRASES.length)];
    var themeIdx = Math.floor(rng() * THEMES.length);
    var theme = THEMES[themeIdx];

    // phrase lettering: per-letter jitter, specks, auto-fit width
    var letters = [];
    var adv = 74, wordGap = 46, capH = 76, letterW = 56;
    var totalW = 0;
    for (var wI = 0; wI < phrase.length; wI++) totalW += phrase[wI].length * adv + (wI ? wordGap : 0);
    var fit = Math.min(1, 940 / totalW);
    var lx = (DW - totalW * fit) / 2;
    for (var wi = 0; wi < phrase.length; wi++) {
      if (wi) lx += wordGap * fit;
      var word = phrase[wi];
      for (var li = 0; li < word.length; li++) {
        var specks = [];
        for (var sp = 0; sp < 3; sp++) specks.push({ dx: rng() * letterW, dy: rng() * capH, l: 3 + rng() * 5, a: rng() * Math.PI });
        letters.push({
          ch: word[li], x: lx, y: 168 + (rng() - 0.5) * 10,
          rot: (rng() - 0.5) * 0.13, w: letterW * fit, h: capH * fit, specks: specks
        });
        lx += adv * fit;
      }
    }

    // motifs: jittered grid inside the silhouette, no two adjacent the same color
    var motifs = [];
    var cell = 84;
    var cols = Math.ceil(DW / cell), rows = Math.ceil(BASE_Y / cell);
    var gridCol = {};
    for (var gy = 0; gy < rows; gy++) {
      for (var gx = 0; gx < cols; gx++) {
        var mx = gx * cell + cell / 2 + (rng() - 0.5) * 40;
        var my = gy * cell + cell / 2 + (rng() - 0.5) * 40;
        if (my > BASE_Y - 26) continue;
        if (!insideMargin(circles, mx, my, 20)) continue;
        var leftC = gridCol[(gx - 1) + ':' + gy], upC = gridCol[gx + ':' + (gy - 1)];
        var ci, tries = 0;
        do { ci = Math.floor(rng() * MOTIF_COLORS.length); tries++; } while ((ci === leftC || ci === upC) && tries < 9);
        if (ci === leftC || ci === upC) ci = (Math.max(leftC || 0, upC || 0) + 1 + Math.floor(rng() * 4)) % MOTIF_COLORS.length;
        gridCol[gx + ':' + gy] = ci;
        motifs.push({
          x: mx, y: my, s: 9 + rng() * 10, rot: (rng() - 0.5) * 1.0,
          type: theme[Math.floor(rng() * theme.length)], color: MOTIF_COLORS[ci],
          ph: rng() * Math.PI * 2, sp: 0.35 + rng() * 0.4
        });
      }
    }
    // top-up scatter so the density rule (40+) always holds
    var attempts = 0;
    while (motifs.length < 54 && attempts < 600) {
      attempts++;
      var tx = 150 + rng() * 780, ty = 400 + rng() * 540;
      if (!insideMargin(circles, tx, ty, 20)) continue;
      var okNear = true, nearC = -1, nearD = 1e9;
      for (var mi = 0; mi < motifs.length; mi++) {
        var ddx = motifs[mi].x - tx, ddy = motifs[mi].y - ty, dd = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dd < 50) okNear = false;
        if (dd < nearD) { nearD = dd; nearC = MOTIF_COLORS.indexOf(motifs[mi].color); }
      }
      if (!okNear) continue;
      var tci = Math.floor(rng() * MOTIF_COLORS.length);
      if (tci === nearC) tci = (tci + 1 + Math.floor(rng() * 4)) % MOTIF_COLORS.length;
      motifs.push({
        x: tx, y: ty, s: 9 + rng() * 10, rot: (rng() - 0.5) * 1.0,
        type: theme[Math.floor(rng() * theme.length)], color: MOTIF_COLORS[tci],
        ph: rng() * Math.PI * 2, sp: 0.35 + rng() * 0.4
      });
    }

    // creatures: perched on the highest bumps of the top contour
    var sorted = circles.slice().sort(function (a, b) { return (a.y - a.r) - (b.y - b.r); });
    var creatures = [];
    for (var ci2 = 0; ci2 < sorted.length && creatures.length < 3; ci2++) {
      var cxp = sorted[ci2].x + (rng() - 0.5) * 30;
      var separated = true;
      for (var cj = 0; cj < creatures.length; cj++) if (Math.abs(creatures[cj].x - cxp) < 150) separated = false;
      if (!separated) continue;
      var cyTop = contourY(circles, cxp);
      if (cyTop === null || cyTop > 900) continue;
      creatures.push({ x: cxp, topY: cyTop, sc: 0.9 + rng() * 0.25, ph: rng() * Math.PI * 2 });
    }

    // crayon textures: precomputed speck arrays, drawn directly each frame
    function speckSet(n, y0, y1, colsArr) {
      var arr = [];
      for (var k = 0; k < n; k++) {
        arr.push({ x: rng() * DW, y: y0 + rng() * (y1 - y0), l: 4 + rng() * 8, a: (rng() - 0.5) * 0.9, c: colsArr[Math.floor(rng() * colsArr.length)] });
      }
      return arr;
    }
    var groundSpecks = speckSet(430, 0, DH, ['rgba(0,0,0,0.055)', 'rgba(255,255,255,0.07)', 'rgba(120,10,45,0.15)']);
    var grainSpecks = speckSet(250, 380, BASE_Y, ['rgba(255,255,255,0.05)', 'rgba(0,0,0,0.30)', 'rgba(70,70,70,0.22)']);
    var seaSpecks = speckSet(120, BASE_Y + 6, DH - 8, ['rgba(255,255,255,0.10)', 'rgba(90,130,255,0.35)', 'rgba(0,0,0,0.12)']);

    return {
      typeName: TYPE_NAMES[type], themeName: THEME_NAMES[themeIdx], phrase: phrase,
      circles: circles, letters: letters, motifs: motifs, creatures: creatures,
      groundSpecks: groundSpecks, grainSpecks: grainSpecks, seaSpecks: seaSpecks
    };
  }
  scene = buildScene(seed);

  // ---------- viewport ----------
  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    }
    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
    return [w, h];
  }
  function isPhone() {
    var sz = viewSize(), w = sz[0], h = sz[1];
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  // ---------- motif glyphs (centered on 0,0; s = half-extent) ----------
  function drawMotif(m) {
    var s = m.s;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    ctx.fillStyle = m.color;
    ctx.strokeStyle = m.color;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    switch (m.type) {
      case 'bottle':
        ctx.beginPath();
        ctx.moveTo(-0.16 * s, -s); ctx.lineTo(0.16 * s, -s); ctx.lineTo(0.16 * s, -0.45 * s);
        ctx.quadraticCurveTo(0.16 * s, -0.1 * s, 0.5 * s, 0.05 * s);
        ctx.lineTo(0.5 * s, 0.8 * s); ctx.quadraticCurveTo(0.5 * s, s, 0.3 * s, s);
        ctx.lineTo(-0.3 * s, s); ctx.quadraticCurveTo(-0.5 * s, s, -0.5 * s, 0.8 * s);
        ctx.lineTo(-0.5 * s, 0.05 * s); ctx.quadraticCurveTo(-0.16 * s, -0.1 * s, -0.16 * s, -0.45 * s);
        ctx.closePath(); ctx.fill();
        break;
      case 'cup':
        ctx.beginPath();
        ctx.moveTo(-0.7 * s, -0.5 * s); ctx.lineTo(0.7 * s, -0.5 * s); ctx.lineTo(0.5 * s, 0.7 * s);
        ctx.quadraticCurveTo(0, 0.88 * s, -0.5 * s, 0.7 * s);
        ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.lineWidth = 0.18 * s;
        ctx.arc(0.78 * s, 0.05 * s, 0.34 * s, -Math.PI / 2.2, Math.PI / 2.2);
        ctx.stroke();
        break;
      case 'fork':
        ctx.lineWidth = 0.17 * s;
        ctx.beginPath();
        ctx.moveTo(-0.4 * s, -0.95 * s); ctx.lineTo(-0.4 * s, -0.15 * s);
        ctx.moveTo(0, -0.95 * s); ctx.lineTo(0, -0.15 * s);
        ctx.moveTo(0.4 * s, -0.95 * s); ctx.lineTo(0.4 * s, -0.15 * s);
        ctx.moveTo(-0.4 * s, -0.15 * s); ctx.lineTo(0.4 * s, -0.15 * s);
        ctx.moveTo(0, -0.15 * s); ctx.lineTo(0, 0.95 * s);
        ctx.stroke();
        break;
      case 'spoon':
        ctx.beginPath(); ctx.ellipse(0, -0.35 * s, 0.42 * s, 0.55 * s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 0.17 * s;
        ctx.beginPath(); ctx.moveTo(0, 0.1 * s); ctx.lineTo(0, 0.95 * s); ctx.stroke();
        break;
      case 'shell':
        ctx.lineWidth = 0.21 * s;
        ctx.beginPath();
        var steps = 42, maxA = Math.PI * 4.4;
        for (var i = 0; i <= steps; i++) {
          var a = (i / steps) * maxA, r = 0.1 * s + (a / maxA) * 0.85 * s;
          var px = Math.cos(a) * r, py = Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
        break;
      case 'flower':
        for (var p = 0; p < 5; p++) {
          var pa = (p / 5) * Math.PI * 2 - Math.PI / 2;
          ctx.beginPath(); ctx.arc(Math.cos(pa) * 0.55 * s, Math.sin(pa) * 0.55 * s, 0.42 * s, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = BLACK;
        ctx.beginPath(); ctx.arc(0, 0, 0.3 * s, 0, Math.PI * 2); ctx.fill();
        break;
      case 'ball':
        ctx.beginPath(); ctx.arc(0, 0, 0.95 * s, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(22,22,22,0.35)'; ctx.lineWidth = 0.14 * s;
        ctx.beginPath(); ctx.ellipse(0, 0, 0.95 * s, 0.4 * s, 0.5, 0, Math.PI * 2); ctx.stroke();
        break;
      case 'star':
        ctx.beginPath();
        for (var q = 0; q < 10; q++) {
          var qa = (q / 10) * Math.PI * 2 - Math.PI / 2, qr = (q % 2 === 0) ? s : 0.45 * s;
          var qx = Math.cos(qa) * qr, qy = Math.sin(qa) * qr;
          if (q === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy);
        }
        ctx.closePath(); ctx.fill();
        break;
      case 'fish':
        ctx.beginPath(); ctx.ellipse(-0.12 * s, 0, 0.78 * s, 0.55 * s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0.55 * s, 0); ctx.lineTo(1.1 * s, -0.55 * s); ctx.lineTo(1.1 * s, 0.55 * s);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = BLACK;
        ctx.beginPath(); ctx.arc(-0.42 * s, -0.12 * s, 0.13 * s, 0, Math.PI * 2); ctx.fill();
        break;
    }
    ctx.restore();
  }

  // ---------- phrase lettering ----------
  function strokeGlyph(ch, x, y, w, h) {
    var strokes = GLYPHS[ch];
    if (!strokes) return;
    for (var i = 0; i < strokes.length; i++) {
      var st = strokes[i];
      ctx.beginPath();
      for (var k = 0; k < st.length; k++) {
        var px = x + st[k][0] * w, py = y + st[k][1] * h;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }
  function drawPhrase() {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var i = 0; i < scene.letters.length; i++) {
      var L = scene.letters[i];
      ctx.save();
      ctx.translate(L.x + L.w / 2, L.y + L.h / 2);
      ctx.rotate(L.rot);
      ctx.translate(-L.w / 2, -L.h / 2);
      ctx.strokeStyle = YELLOW;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = L.h * 0.17;
      strokeGlyph(L.ch, 2, 2, L.w, L.h);
      ctx.globalAlpha = 1;
      ctx.lineWidth = L.h * 0.115;
      strokeGlyph(L.ch, 0, 0, L.w, L.h);
      ctx.lineWidth = 2.2;
      ctx.globalAlpha = 0.5;
      for (var sp = 0; sp < L.specks.length; sp++) {
        var sk = L.specks[sp];
        ctx.beginPath();
        ctx.moveTo(sk.dx, sk.dy);
        ctx.lineTo(sk.dx + Math.cos(sk.a) * sk.l, sk.dy + Math.sin(sk.a) * sk.l);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- creature: her two-dot face grammar, nothing more ----------
  function drawCreature(cr, t) {
    var bob = Math.sin(t * 0.9 + cr.ph) * 5;
    var cx = cr.x, cy = cr.topY - 24 * cr.sc + bob;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(cr.sc, cr.sc);
    ctx.fillStyle = CREAM;
    ctx.strokeStyle = BLACK;
    ctx.beginPath(); ctx.ellipse(0, 0, 31, 25, 0, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3; ctx.stroke();
    // feet
    ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-16, 24); ctx.lineTo(-8, 24);
    ctx.moveTo(8, 24); ctx.lineTo(16, 24);
    ctx.stroke();
    // two dot eyes + one bent-line mouth
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(-11, -6, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -6, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-7, 5); ctx.lineTo(0, 9); ctx.lineTo(7, 4);
    ctx.stroke();
    ctx.restore();
  }

  function speckStroke(arr) {
    ctx.lineCap = 'round';
    ctx.lineWidth = 2.2;
    for (var i = 0; i < arr.length; i++) {
      var sk = arr[i];
      ctx.strokeStyle = sk.c;
      ctx.beginPath();
      ctx.moveTo(sk.x, sk.y);
      ctx.lineTo(sk.x + Math.cos(sk.a) * sk.l, sk.y + Math.sin(sk.a) * sk.l);
      ctx.stroke();
    }
  }

  function silhouettePath() {
    ctx.beginPath();
    for (var i = 0; i < scene.circles.length; i++) {
      var c = scene.circles[i];
      ctx.moveTo(c.x + c.r, c.y);
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    }
  }

  // ---------- main draw ----------
  function draw(t) {
    var sz = viewSize(), w = sz[0], h = sz[1];
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var phone = isPhone(); // square stage fit keeps the composition shape on phones
    void phone;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = PINK;
    ctx.fillRect(0, 0, w, h);

    var s = Math.min(w / DW, h / DH);
    var ox = (w - DW * s) / 2, oy = (h - DH * s) / 2;
    ctx.setTransform(s, 0, 0, s, ox, oy);

    // crayon-textured pink ground
    ctx.fillStyle = PINK;
    ctx.fillRect(0, 0, DW, DH);
    speckStroke(scene.groundSpecks);

    // sea strip the island sits on
    ctx.fillStyle = SEA;
    ctx.fillRect(0, BASE_Y, DW, DH - BASE_Y);
    speckStroke(scene.seaSpecks);

    // hand-lettered invented phrase, upper third
    drawPhrase();

    // silhouette: flat black mass with a clean base line on the strip
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, DW, BASE_Y + 1); ctx.clip();
    silhouettePath();
    ctx.fillStyle = BLACK;
    ctx.fill();
    // pastel grain inside the mass
    silhouettePath();
    ctx.clip();
    speckStroke(scene.grainSpecks);
    // motifs, drifting a few pixels on slow sine phases, never spilling out
    for (var i = 0; i < scene.motifs.length; i++) {
      var m = scene.motifs[i];
      var drifted = {
        x: m.x + Math.sin(t * m.sp + m.ph) * 4,
        y: m.y + Math.cos(t * m.sp * 0.8 + m.ph) * 3,
        s: m.s, rot: m.rot, type: m.type, color: m.color
      };
      drawMotif(drifted);
    }
    ctx.restore();

    // cream creatures riding the top contour
    for (var ci = 0; ci < scene.creatures.length; ci++) drawCreature(scene.creatures[ci], t);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  // ---------- interaction: double-tap reseeds ----------
  function reseed() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    scene = buildScene(seed);
    draw(PHASE0 + elapsed);
  }
  var lastTap = -1;
  canvas.addEventListener('pointerdown', function (ev) {
    var now = ev && typeof ev.timeStamp === 'number' ? ev.timeStamp : 0;
    if (lastTap >= 0 && now - lastTap < 350) { lastTap = -1; reseed(); }
    else lastTap = now;
  });
  canvas.addEventListener('dblclick', function () { lastTap = -1; reseed(); });

  // ---------- resize + loop ----------
  var elapsed = 0;
  function onResize() { draw(PHASE0 + elapsed); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    window.addEventListener('resize', onResize);
  }

  draw(PHASE0); // synchronous deterministic first frame

  var startStamp = null;
  function tick(now) {
    if (startStamp === null) startStamp = now;
    elapsed = (now - startStamp) / 1000;
    draw(PHASE0 + elapsed);
    requestAnimationFrame(tick);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
})();
</script>
</body>
</html>
