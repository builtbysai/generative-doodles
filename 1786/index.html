<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fifty Drawings While Listening</title>
<style>
html, body { margin: 0; padding: 0; background: #171310; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#171310';
var TABLE_DARK = '#100d0a';
var TABLE_LITE = '#1e1813';
var CARD = '#f7f3ea';
var CARD_EDGE = 'rgba(0,0,0,0.35)';
var INK = '#67788c'; /* warm grey-blue ink */
var RUST = '#9c4a24'; /* rust-brown box lettering */
var BOX = '#2a1f16';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, card 6 mid-draw, 5 cards done */
var CARD_DUR = 10.0; /* seconds per card */
var PRELUDE = 5.0; /* seconds the box is glimpsed before card 1 starts */
var TOTAL_CARDS = 50;
var CYCLE = TOTAL_CARDS * CARD_DUR; /* 500 s; vocabulary reshuffles each cycle */
var SEED = 1786;
var PLATE_FILL = '#fbf8f1';
var PLATE_LINE = 'rgba(0,0,0,0.28)';
var PLATE_INK = '#2b2b28';
var HINT_INK = '#2b2b28';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
var L = {}; /* layout: active card, stack, done pile, box */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
  var aw, ah, acx, acy;
  if (isPhone) {
    aw = 0.82 * F.w; ah = aw / 1.4;
    acx = F.x + 0.50 * F.w; acy = F.y + 0.46 * F.h;
    L.stack = { x: F.x + 0.17 * F.w, y: F.y + 0.19 * F.h, w: 0.32 * aw, h: 0.32 * aw / 1.4 };
    L.done = { x: F.x + 0.83 * F.w, y: F.y + 0.83 * F.h, w: 0.32 * aw, h: 0.32 * aw / 1.4, step: 0.16 };
  } else {
    aw = 0.58 * F.w; ah = aw / 1.4;
    acx = F.x + 0.47 * F.w; acy = F.y + 0.52 * F.h;
    L.stack = { x: F.x + 0.085 * F.w, y: F.y + 0.50 * F.h, w: 0.30 * aw, h: 0.30 * aw / 1.4 };
    L.done = { x: F.x + 0.915 * F.w, y: F.y + 0.50 * F.h, w: 0.30 * aw, h: 0.30 * aw / 1.4, step: 0.15 };
  }
  L.active = { x: acx, y: acy, w: aw, h: ah, rot: -0.012 };
  L.boxW = Math.min(320, 0.38 * F.w); L.boxH = 46;
}
/* Piece clock: card k (0-based) runs from PRELUDE + k*CARD_DUR.
   Returns { prelude, cycle, k, u } with u the fraction through the card. */
function clock(t) {
  var since = t - PRELUDE;
  if (since < 0) return { prelude: true, cycle: 0, k: 0, u: 0 };
  var cycle = Math.floor(since / CYCLE);
  var tt = since - cycle * CYCLE;
  var k = Math.floor(tt / CARD_DUR);
  return { prelude: false, cycle: cycle, k: k, u: tt / CARD_DUR - k };
}
function cardCount(t) { return clock(t).k; } /* cards finished = index of active card */
/* Gesture vocabulary for one card: fixed authored table from a seeded stream.
   Each stroke: start, direction, length, wave amplitude/frequency/phase, max width. */
var CARD_CACHE = {};
function cardTable(k, cycle) {
  var key = cycle + ':' + k;
  if (CARD_CACHE[key]) return CARD_CACHE[key];
  var rng = mulberry32(SEED * 7919 + cycle * 131 + k * 104729 + 13);
  var nS = 5 + Math.floor(rng() * 5);
  var strokes = [];
  var s;
  for (s = 0; s < nS; s++) {
    strokes.push({
      x0: 0.12 + rng() * 0.55,
      y0: 0.16 + rng() * 0.68,
      th: (rng() * 2 - 1) * 0.6,
      len: 0.28 + rng() * 0.34,
      amp: 0.03 + rng() * 0.05,
      freq: 2 + Math.floor(rng() * 3),
      ph: rng() * TAU,
      wMax: 0.006 + rng() * 0.010
    });
  }
  var tab = { nS: nS, strokes: strokes };
  CARD_CACHE[key] = tab;
  return tab;
}
/* Point on stroke s at parameter q (0..1), in card-local coords. */
function strokePoint(st, q) {
  var along = q * st.len;
  var perp = st.amp * Math.sin(st.freq * TAU * q + st.ph) * Math.sin(Math.PI * q);
  var c = Math.cos(st.th), sn = Math.sin(st.th);
  return {
    x: st.x0 + c * along - sn * perp,
    y: st.y0 + sn * along + c * perp,
    w: st.wMax * (0.30 + 0.70 * Math.pow(Math.sin(Math.PI * q), 1.2)) *
       (0.85 + 0.30 * Math.sin(q * 17 + st.ph))
  };
}
/* Draw one stroke up to progress p (0..1) in the current transform. */
function drawStroke(st, p, cardW) {
  if (p <= 0) return;
  var NSEG = 48;
  var i, q, pt, prev = null;
  /* wet-ink halo pass, then the core pass */
  var pass;
  for (pass = 0; pass < 2; pass++) {
    prev = null;
    for (i = 0; i <= NSEG; i++) {
      q = (i / NSEG) * p;
      pt = strokePoint(st, q);
      var px = pt.x * cardW, py = pt.y * cardW / 1.4;
      if (prev) {
        ctx.strokeStyle = pass === 0 ? rgba(INK, 0.16) : rgba(INK, 0.92);
        ctx.lineWidth = Math.max(0.6, pt.w * cardW * (pass === 0 ? 2.3 : 1));
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(px, py);
        ctx.stroke();
      }
      prev = { x: px, y: py };
    }
  }
}
/* Draw a card (white, with its strokes up to progress u) centred at (cx, cy),
   size w x h, rotated rot. u = 1 draws the finished card. */
function drawCard(cx, cy, w, h, rot, k, cycle, u) {
  var tab = cardTable(k, cycle);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = Math.max(6, 0.03 * w);
  ctx.shadowOffsetY = Math.max(3, 0.015 * w);
  ctx.fillStyle = CARD;
  ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.strokeStyle = CARD_EDGE;
  ctx.lineWidth = 1;
  ctx.strokeRect(-w / 2 + 0.5, -h / 2 + 0.5, w - 1, h - 1);
  /* strokes live in card-local 0..w space, so shift the origin to the corner;
     clip to the card so no gesture runs off the paper */
  ctx.translate(-w / 2, -h / 2);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, w, h);
  ctx.clip();
  /* strokes, drawn in order; stroke s runs during u in [s/nS, (s+1)/nS] */
  var s, p;
  for (s = 0; s < tab.nS; s++) {
    p = clamp(u * tab.nS - s, 0, 1);
    if (p > 0) drawStroke(tab.strokes[s], p, w);
  }
  ctx.restore();
  ctx.restore();
}
/* The brush tip at the current drawing point, in card-local coords. */
function drawBrush(cx, cy, w, h, rot, k, cycle, u) {
  var tab = cardTable(k, cycle);
  var s = Math.floor(u * tab.nS);
  if (s >= tab.nS) s = tab.nS - 1;
  var p = clamp(u * tab.nS - s, 0, 1);
  if (p <= 0.02 || p >= 1) return;
  var pt = strokePoint(tab.strokes[s], p);
  var lx = (pt.x - 0.5) * w, ly = (pt.y - 0.5) * h;
  var bx = cx + lx * Math.cos(rot) - ly * Math.sin(rot);
  var by = cy + lx * Math.sin(rot) + ly * Math.cos(rot);
  var hx = bx - 0.45 * w * 0.09, hy = by - 0.86 * w * 0.09;
  ctx.save();
  ctx.strokeStyle = '#3a2a1e';
  ctx.lineWidth = Math.max(2, 0.012 * w);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(bx, by);
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.ellipse(bx, by, Math.max(2, pt.w * w * 0.9), Math.max(1.5, pt.w * w * 0.55), -0.6, 0, TAU);
  ctx.fill();
  ctx.restore();
}
function drawStack(t) {
  var clk = clock(t);
  var remaining = TOTAL_CARDS - clk.k - (clk.prelude ? 0 : 1);
  if (remaining < 0) remaining = 0;
  var st = L.stack;
  var layers = Math.min(remaining, 12);
  var i;
  ctx.save();
  ctx.translate(st.x, st.y);
  for (i = layers - 1; i >= 0; i--) {
    ctx.fillStyle = i === 0 ? CARD : '#e9e4d6';
    ctx.fillRect(-st.w / 2 - i * 1.6, -st.h / 2 - i * 1.6, st.w, st.h);
    ctx.strokeStyle = CARD_EDGE;
    ctx.lineWidth = 1;
    ctx.strokeRect(-st.w / 2 - i * 1.6 + 0.5, -st.h / 2 - i * 1.6 + 0.5, st.w - 1, st.h - 1);
  }
  ctx.restore();
  /* faint count pencilled beside the stack */
  ctx.save();
  ctx.fillStyle = 'rgba(247,243,234,0.55)';
  ctx.font = (isPhone ? 11 : 13) + 'px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(remaining + ' left', st.x - st.w / 2, st.y + st.h / 2 + 18);
  ctx.restore();
}
function drawDonePile(t) {
  var clk = clock(t);
  var done = clk.prelude ? 0 : clk.k;
  if (done <= 0) return;
  var dn = L.done;
  var i;
  for (i = 0; i < done; i++) {
    var off = (i - (done - 1) / 2);
    var cx = dn.x + off * dn.w * 0.10;
    var cy = dn.y + off * dn.h * 0.16;
    drawCard(cx, cy, dn.w, dn.h, off * dn.step, i, clk.cycle, 1);
  }
}
function drawBox(t) {
  /* rust-brown box lettering, glimpsed at the start; at frame one only a
     bare box edge peeks over the top edge (lettering draws only while the
     box is actually revealed, so no clipped text ever shows). Closed form
     of piece time. */
  var reveal = clamp(1 - t / PRELUDE, 0, 1);
  var visible = 12 + 34 * reveal;
  var bw = L.boxW, bh = L.boxH;
  var bx = VW - bw - 16, by = visible - bh;
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(-0.03);
  ctx.fillStyle = BOX;
  ctx.fillRect(0, 0, bw, bh);
  ctx.strokeStyle = 'rgba(156,74,36,0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, bw - 1, bh - 1);
  if (reveal > 0.25) {
    ctx.fillStyle = RUST;
    ctx.font = 'bold ' + (isPhone ? 12 : 14) + 'px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('FIFTY DRAWINGS', 12, bh - 12);
  }
  ctx.restore();
}
function drawTable(t) {
  var grad = ctx.createRadialGradient(F.x + F.w / 2, F.y + F.h / 2, 0,
    F.x + F.w / 2, F.y + F.h / 2, Math.max(F.w, F.h) * 0.75);
  grad.addColorStop(0, TABLE_LITE);
  grad.addColorStop(1, TABLE_DARK);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, VW, VH);
  /* faint table grain, fixed seeded dots */
  var rng = mulberry32(SEED);
  var i;
  ctx.fillStyle = 'rgba(247,243,234,0.03)';
  for (i = 0; i < 240; i++) {
    var gx = rng() * VW, gy = rng() * VH, gr = 0.8 + rng() * 1.8;
    ctx.beginPath();
    ctx.arc(gx, gy, gr, 0, TAU);
    ctx.fill();
  }
}
function drawActive(t) {
  var clk = clock(t);
  if (clk.prelude) return;
  var a = L.active;
  /* slide forward from the stack during the first 1.5 s of the card */
  var sp = clamp(clk.u * CARD_DUR / 1.5, 0, 1);
  var e = 1 - Math.pow(1 - sp, 3);
  var sx = L.stack.x + (a.x - L.stack.x) * e;
  var sy = L.stack.y + (a.y - L.stack.y) * e;
  var sw = L.stack.w + (a.w - L.stack.w) * e;
  var sh = L.stack.h + (a.h - L.stack.h) * e;
  drawCard(sx, sy, sw, sh, a.rot * e, clk.k, clk.cycle, clk.u);
  if (sp >= 1) drawBrush(a.x, a.y, a.w, a.h, a.rot, clk.k, clk.cycle, clk.u);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Fifty Drawings While Listening').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Fifty Drawings While Listening').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 02').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Fifty Drawings While Listening', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 02', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  drawTable(phaseT);
  drawStack(phaseT);
  drawDonePile(phaseT);
  drawActive(phaseT);
  drawBox(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    cardIndex: function () { return clock(phaseT).k; },
    cardU: function () { return clock(phaseT).u; },
    doneCount: function () { return cardCount(phaseT); }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
