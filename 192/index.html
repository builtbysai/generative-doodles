<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.192 Smash Frame</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0C0C0E; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.192 Smash Frame (Eugene Sargent, Smashography). Three targets
// hang in a dark studio: a water balloon, a powder egg, a piece of
// fruit. Tap one and the bat swings; at the instant of contact time
// dilates to two percent for three seconds while a thin white diagram
// draws itself over the frozen physics (shock rings, force vectors,
// fracture maps, particles suspended mid-flight). Then time releases,
// the mess falls, settles, and a fresh target fades in. Drag aims.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0C0C0E', CYAN = '#35F0FF', POWDER = '#F5F2EA';
var ORANGE = '#E8832A', WOOD = '#8A6B45';
var W = 0, H = 0, phone = false;
var seed = 192192;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }

// ---- targets ---------------------------------------------------------
var KINDS = ['balloon', 'egg', 'fruit'];
var XFR = [0.29, 0.51, 0.73];
var targets = [];
function makeTarget(i) {
  return {
    kind: KINDS[i], xf: XFR[i], phase: rand() * 6.28,
    state: 'whole', alpha: 1, stateT: 0,
    particles: [], hitDir: { x: 1, y: 0 }, impact: { x: 0, y: 0 }
  };
}
for (var ti = 0; ti < 3; ti++) targets.push(makeTarget(ti));
function tPos(t) {
  return { x: t.xf * W, y: H * 0.40 + Math.sin(T * 0.6 + t.phase) * 3 };
}
function tR() { return clamp(Math.min(W, H) * 0.062, 24, 58); }

// ---- bat ---------------------------------------------------------------
var bat = { aim: 1, angle: 0, len: 300, busy: false, phase: 'idle', phaseT: 0, target: -1 };
function batPivot() {
  return phone ? { x: W * 0.20, y: H * 0.83 } : { x: W * 0.15, y: H * 0.82 };
}
function batLenFor(i) {
  var p = batPivot(), tp = tPos(targets[i]);
  var dx = tp.x - p.x, dy = tp.y - p.y;
  return Math.sqrt(dx * dx + dy * dy) + tR() * 0.05;
}
function strikeAngle(i) {
  var p = batPivot(), tp = tPos(targets[i]);
  return Math.atan2(tp.y - p.y, tp.x - p.x);
}
function cockedAngle(i) { return strikeAngle(i) - 0.5; }

// ---- time ---------------------------------------------------------------
var T = 0, lastNow = -1, timeScale = 1, lastAct = -100;

function spawnParticles(t) {
  var tp = tPos(t), R = tR();
  var hd = t.hitDir;
  t.impact = { x: tp.x - hd.x * R * 0.55, y: tp.y - hd.y * R * 0.55 };
  var ps = [], i, a, sp;
  if (t.kind === 'balloon') {
    for (i = 0; i < 30; i++) {
      a = rand() * 6.283; sp = 40 + rand() * 240;
      ps.push({ x: t.impact.x + Math.cos(a) * R * 0.3, y: t.impact.y + Math.sin(a) * R * 0.3,
        vx: Math.cos(a) * sp + hd.x * 130, vy: Math.sin(a) * sp + hd.y * 130 - 40,
        r: 1.5 + rand() * 2.6, col: CYAN, kind: 'drop' });
    }
  } else if (t.kind === 'egg') {
    for (i = 0; i < 16; i++) {
      a = (i / 16) * 6.283 + rand() * 0.3; sp = 70 + rand() * 230;
      ps.push({ x: tp.x, y: tp.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: 3 + rand() * 5, col: POWDER, kind: 'shard', rot: rand() * 6.28 });
    }
    for (i = 0; i < 22; i++) {
      a = rand() * 6.283; sp = 18 + rand() * 110;
      ps.push({ x: tp.x + Math.cos(a) * R * 0.4, y: tp.y + Math.sin(a) * R * 0.4,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 1.2 + rand() * 2.2,
        col: POWDER, kind: 'puff' });
    }
  } else {
    for (i = 0; i < 14; i++) {
      a = rand() * 6.283; sp = 50 + rand() * 200;
      ps.push({ x: t.impact.x, y: t.impact.y, vx: Math.cos(a) * sp + hd.x * 90,
        vy: Math.sin(a) * sp - 30, r: 1.6 + rand() * 2.6, col: ORANGE, kind: 'drop' });
    }
    for (i = 0; i < 10; i++) {
      a = rand() * 6.283; sp = 40 + rand() * 150;
      ps.push({ x: tp.x, y: tp.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: 2 + rand() * 1.6, col: POWDER, kind: 'seed' });
    }
  }
  t.particles = ps;
}

function startSwing(i) {
  bat.busy = true; bat.phase = 'swing'; bat.phaseT = 0; bat.target = i;
  bat.aim = i; lastAct = T;
}

// ---- input ---------------------------------------------------------------
var dragAim = null;
function nearestTarget(x) {
  var best = 0, bd = 1e9;
  for (var i = 0; i < 3; i++) {
    var d = Math.abs(targets[i].xf * W - x);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
canvas.addEventListener('pointerdown', function (e) { dragAim = e.clientX; });
canvas.addEventListener('pointermove', function (e) {
  if (dragAim === null) return;
  dragAim = e.clientX;
  bat.aim = nearestTarget(e.clientX);
});
canvas.addEventListener('pointerup', function (e) {
  var wasDrag = dragAim !== null && Math.abs(e.clientX - dragAim) > 26;
  dragAim = null;
  if (wasDrag) { bat.aim = nearestTarget(e.clientX); lastAct = T; return; }
  // tap: hit a target?
  for (var i = 0; i < 3; i++) {
    var tp = tPos(targets[i]);
    var dx = e.clientX - tp.x, dy = e.clientY - tp.y;
    if (dx * dx + dy * dy < Math.pow(tR() * 1.6, 2)) {
      if (!bat.busy && targets[i].state === 'whole') startSwing(i);
      else bat.aim = i;
      return;
    }
  }
  bat.aim = nearestTarget(e.clientX);
  lastAct = T;
});
canvas.addEventListener('pointercancel', function () { dragAim = null; });

// ---- resize ----------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing helpers ---------------------------------------------------------
function whiteA(a) { return 'rgba(245,242,234,' + a + ')'; }
function arrow(x, y, ang, len) {
  var ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey);
  ctx.moveTo(ex, ey); ctx.lineTo(ex - Math.cos(ang - 0.42) * 9, ey - Math.sin(ang - 0.42) * 9);
  ctx.moveTo(ex, ey); ctx.lineTo(ex - Math.cos(ang + 0.42) * 9, ey - Math.sin(ang + 0.42) * 9);
  ctx.stroke();
}

function drawWhole(t, tp, R) {
  ctx.save();
  ctx.globalAlpha = t.alpha;
  // suspension string
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(tp.x, -4); ctx.lineTo(tp.x, tp.y - R * 0.98); ctx.stroke();
  if (t.kind === 'balloon') {
    ctx.beginPath(); ctx.ellipse(tp.x, tp.y, R * 0.82, R, 0, 0, 6.284);
    ctx.fillStyle = 'rgba(53,240,255,0.36)'; ctx.fill();
    ctx.strokeStyle = 'rgba(53,240,255,0.85)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(tp.x - R * 0.3, tp.y - R * 0.34, R * 0.2, R * 0.32, -0.5, 0, 6.284);
    ctx.fillStyle = 'rgba(255,255,255,0.20)'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tp.x - 4, tp.y + R); ctx.lineTo(tp.x + 4, tp.y + R); ctx.lineTo(tp.x, tp.y + R + 7);
    ctx.closePath(); ctx.fillStyle = 'rgba(53,240,255,0.7)'; ctx.fill();
  } else if (t.kind === 'egg') {
    ctx.beginPath(); ctx.ellipse(tp.x, tp.y, R * 0.78, R * 0.98, 0, 0, 6.284);
    ctx.fillStyle = POWDER; ctx.globalAlpha = t.alpha * 0.94; ctx.fill();
    ctx.globalAlpha = t.alpha;
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(tp.x - R * 0.24, tp.y - R * 0.3, R * 0.18, R * 0.3, -0.4, 0, 6.284);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(tp.x, tp.y, R * 0.92, 0, 6.284);
    ctx.fillStyle = ORANGE; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = WOOD;
    ctx.fillRect(tp.x - 2, tp.y - R * 0.92 - 8, 4, 9);
    ctx.beginPath(); ctx.ellipse(tp.x - R * 0.3, tp.y - R * 0.32, R * 0.2, R * 0.13, -0.6, 0, 6.284);
    ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fill();
  }
  ctx.restore();
}

function drawDeformed(t, tp, R, k) {
  // k: 1 frozen, relaxes toward 0.35 in the aftermath
  var hd = t.hitDir, ip = t.impact;
  ctx.save();
  if (t.kind === 'balloon') {
    var cx = tp.x + hd.x * R * 0.22 * k, cy = tp.y + hd.y * R * 0.22 * k;
    var ha = Math.atan2(hd.y, hd.x);
    ctx.beginPath();
    for (var i = 0; i <= 40; i++) {
      var a = (i / 40) * 6.283;
      var d = a - ha; while (d > 3.142) d -= 6.283; while (d < -3.142) d += 6.283;
      var rr = R * (0.9 + 0.55 * k * Math.exp(-(d * d) / 0.55) - 0.18 * k * Math.exp(-Math.pow(d - 3.14, 2) / 0.8));
      var px = cx + Math.cos(a) * rr * 0.92, py = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(53,240,255,0.30)'; ctx.fill();
    ctx.strokeStyle = 'rgba(53,240,255,0.85)'; ctx.lineWidth = 1.5; ctx.stroke();
  } else if (t.kind === 'egg') {
    var off = R * 0.30 * k;
    ctx.fillStyle = POWDER;
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(tp.x - off, tp.y - off * 0.4, R * 0.62, R * 0.8, -0.5, 0, 6.284); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(tp.x + off, tp.y + off * 0.4, R * 0.62, R * 0.8, -0.5, 0, 6.284); ctx.fill(); ctx.stroke();
    for (var j = 0; j < 14; j++) {
      var a2 = (j / 14) * 6.283 + 0.2;
      ctx.beginPath();
      ctx.arc(tp.x + Math.cos(a2) * R * 0.55, tp.y + Math.sin(a2) * R * 0.55, 1.6, 0, 6.284);
      ctx.fillStyle = 'rgba(245,242,234,0.8)'; ctx.fill();
    }
  } else {
    var ia = Math.atan2(ip.y - tp.y, ip.x - tp.x);
    ctx.beginPath();
    for (var m = 0; m <= 44; m++) {
      var a3 = (m / 44) * 6.283;
      var d3 = a3 - ia; while (d3 > 3.142) d3 -= 6.283; while (d3 < -3.142) d3 += 6.283;
      var rr3 = R * 0.92 * (1 - 0.36 * k * Math.exp(-(d3 * d3) / 0.30));
      var qx = tp.x + Math.cos(a3) * rr3, qy = tp.y + Math.sin(a3) * rr3;
      if (m === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy);
    }
    ctx.closePath();
    ctx.fillStyle = ORANGE; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.moveTo(ip.x, ip.y);
    ctx.lineTo(tp.x + R * 0.4, tp.y - R * 0.3);
    ctx.moveTo(ip.x, ip.y);
    ctx.lineTo(tp.x + R * 0.2, tp.y + R * 0.5);
    ctx.stroke();
  }
  ctx.restore();
}

function drawDiagram(t, tp, R, p) {
  var ip = t.impact, hd = t.hitDir;
  var ha = Math.atan2(hd.y, hd.x);
  ctx.save();
  ctx.strokeStyle = whiteA(0.7); ctx.lineWidth = 1;
  // shock rings
  for (var k = 0; k < 3; k++) {
    var rp = p * 1.25 - k * 0.24;
    if (rp <= 0) continue;
    ctx.globalAlpha = clamp(0.6 * (1 - rp / 1.3), 0, 0.6);
    ctx.beginPath(); ctx.arc(ip.x, ip.y, R * (0.5 + rp * 2.4), 0, 6.284); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // force vectors, drawn progressively
  var vlen = R * (0.6 + p * 1.7);
  ctx.strokeStyle = whiteA(0.7 * clamp(p * 3, 0, 1));
  if (p > 0.06) arrow(ip.x, ip.y, ha, vlen);
  if (p > 0.3) { arrow(tp.x, tp.y, ha - 0.75, vlen * 0.55); arrow(tp.x, tp.y, ha + 0.75, vlen * 0.55); }
  if (p > 0.5) { arrow(tp.x, tp.y, ha - 1.6, vlen * 0.4); arrow(tp.x, tp.y, ha + 1.6, vlen * 0.4); }
  // fracture map
  ctx.strokeStyle = whiteA(0.55 * clamp(p * 2.4, 0, 1));
  if (t.kind === 'egg') {
    for (var j = 0; j < 7; j++) {
      var a = (j / 7) * 6.283 + 0.3, L = R * (0.3 + p * 0.85);
      ctx.beginPath(); ctx.moveTo(tp.x, tp.y);
      ctx.lineTo(tp.x + Math.cos(a + 0.14) * L * 0.55, tp.y + Math.sin(a + 0.14) * L * 0.55);
      ctx.lineTo(tp.x + Math.cos(a) * L, tp.y + Math.sin(a) * L);
      ctx.stroke();
    }
  } else if (t.kind === 'balloon') {
    for (var q = 0; q < 3; q++) {
      ctx.beginPath();
      ctx.ellipse(tp.x + hd.x * R * 0.22, tp.y + hd.y * R * 0.22, R * (1.02 + q * 0.17) * (0.4 + p * 0.6), R * (1.1 + q * 0.17) * (0.4 + p * 0.6), 0, 0, 6.284);
      ctx.stroke();
    }
  } else {
    for (var s = 0; s < 3; s++) {
      ctx.beginPath(); ctx.arc(ip.x, ip.y, R * (0.2 + s * 0.22) * (0.4 + p * 0.6), ha - 1.2, ha + 1.2); ctx.stroke();
    }
    for (var s2 = 0; s2 < 5; s2++) {
      var a2 = ha - 1.1 + s2 * 0.55;
      ctx.beginPath();
      ctx.moveTo(ip.x + Math.cos(a2) * R * 0.16, ip.y + Math.sin(a2) * R * 0.16);
      ctx.lineTo(ip.x + Math.cos(a2) * R * (0.4 + p * 0.5), ip.y + Math.sin(a2) * R * (0.4 + p * 0.5));
      ctx.stroke();
    }
  }
  // measurement ticks
  if (p > 0.55) {
    ctx.strokeStyle = whiteA(0.5);
    var rr = R * 2.0;
    var pts = [[ip.x - rr, ip.y], [ip.x + rr, ip.y], [ip.x, ip.y - rr], [ip.x, ip.y + rr]];
    for (var n = 0; n < 4; n++) {
      ctx.beginPath();
      ctx.moveTo(pts[n][0] - 5, pts[n][1]); ctx.lineTo(pts[n][0] + 5, pts[n][1]);
      ctx.moveTo(pts[n][0], pts[n][1] - 5); ctx.lineTo(pts[n][0], pts[n][1] + 5);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawParticles(t, mode, p) {
  var floorY = H * 0.93;
  ctx.save();
  for (var i = 0; i < t.particles.length; i++) {
    var q = t.particles[i];
    var x, y;
    if (mode === 'freeze') {
      var creep = 0.055 * (1 - Math.pow(1 - p, 2));
      x = q.x + q.vx * creep; y = q.y + q.vy * creep;
      // velocity whisker, diagram style
      ctx.strokeStyle = whiteA(0.35);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.lineTo(x + q.vx * 0.09, y + q.vy * 0.09); ctx.stroke();
    } else {
      x = q.x; y = q.y;
    }
    ctx.fillStyle = q.col;
    if (q.kind === 'shard') {
      ctx.save(); ctx.translate(x, y); ctx.rotate(q.rot || 0);
      ctx.globalAlpha = 0.92;
      ctx.beginPath(); ctx.moveTo(-q.r, q.r * 0.6); ctx.lineTo(q.r, 0); ctx.lineTo(-q.r * 0.4, -q.r * 0.7);
      ctx.closePath(); ctx.fill(); ctx.restore();
    } else if (q.kind === 'seed') {
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.ellipse(x, y, q.r, q.r * 0.6, 0.6, 0, 6.284); ctx.fill();
    } else if (q.kind === 'puff') {
      ctx.globalAlpha = 0.35;
      ctx.beginPath(); ctx.arc(x, y, q.r * 1.7, 0, 6.284); ctx.fill();
    } else {
      ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc(x, y, q.r, 0, 6.284); ctx.fill();
    }
  }
  ctx.restore();
}

function drawRemnant(t) {
  var tp = tPos(t), R = tR(), floorY = H * 0.93;
  ctx.save();
  ctx.globalAlpha = 0.85;
  if (t.kind === 'balloon') {
    ctx.fillStyle = 'rgba(53,240,255,0.45)';
    ctx.beginPath();
    ctx.moveTo(tp.x - R * 0.5, floorY);
    ctx.quadraticCurveTo(tp.x - R * 0.2, floorY - R * 0.3, tp.x + R * 0.08, floorY - R * 0.12);
    ctx.quadraticCurveTo(tp.x + R * 0.3, floorY - R * 0.26, tp.x + R * 0.52, floorY);
    ctx.closePath(); ctx.fill();
  } else if (t.kind === 'egg') {
    ctx.fillStyle = POWDER;
    ctx.beginPath(); ctx.ellipse(tp.x - R * 0.3, floorY - 3, R * 0.42, R * 0.2, 0, 3.14, 6.284); ctx.fill();
    ctx.beginPath(); ctx.ellipse(tp.x + R * 0.34, floorY - 3, R * 0.38, R * 0.18, 0, 3.14, 6.284); ctx.fill();
  } else {
    ctx.fillStyle = ORANGE;
    ctx.beginPath(); ctx.ellipse(tp.x - R * 0.26, floorY - 2, R * 0.44, R * 0.22, 0, 3.14, 6.284); ctx.fill();
    ctx.beginPath(); ctx.ellipse(tp.x + R * 0.3, floorY - 2, R * 0.4, R * 0.2, 0, 3.14, 6.284); ctx.fill();
  }
  ctx.restore();
}

function drawBat() {
  var p = batPivot(), L = bat.len;
  var hw = clamp(L * 0.017, 7, 13);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(bat.angle);
  ctx.beginPath();
  ctx.moveTo(-8, -3.5);
  ctx.lineTo(L * 0.30, -hw * 0.45);
  ctx.lineTo(L * 0.93, -hw);
  ctx.quadraticCurveTo(L * 1.01, 0, L * 0.93, hw);
  ctx.lineTo(L * 0.30, hw * 0.45);
  ctx.lineTo(-8, 3.5);
  ctx.closePath();
  ctx.fillStyle = WOOD; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.moveTo(L * 0.34, -hw * 0.4); ctx.lineTo(L * 0.9, -hw * 0.8); ctx.stroke();
  ctx.beginPath(); ctx.arc(-10, 0, 5, 0, 6.284);
  ctx.fillStyle = '#6E5638'; ctx.fill();
  ctx.restore();
}

// ---- simulation ------------------------------------------------------------
function step(dt) {
  // bat phases run on real time
  if (bat.busy) {
    bat.phaseT += dt;
    if (bat.phase === 'swing' && bat.phaseT >= 0.4) {
      var t = targets[bat.target];
      var p = batPivot(), tp = tPos(t);
      var dx = tp.x - p.x, dy = tp.y - p.y, m = Math.sqrt(dx * dx + dy * dy);
      t.hitDir = { x: dx / m, y: dy / m };
      spawnParticles(t);
      t.state = 'hit'; t.stateT = 0;
      bat.phase = 'freeze'; bat.phaseT = 0;
    } else if (bat.phase === 'freeze' && bat.phaseT >= 3.0) {
      bat.phase = 'aftermath'; bat.phaseT = 0;
      targets[bat.target].state = 'after'; targets[bat.target].stateT = 0;
    } else if (bat.phase === 'aftermath' && bat.phaseT >= 1.1) {
      bat.phase = 'settle'; bat.phaseT = 0;
      targets[bat.target].state = 'settled'; targets[bat.target].stateT = 0;
    } else if (bat.phase === 'settle' && bat.phaseT >= 4.0) {
      bat.busy = false; bat.phase = 'idle';
      var t2 = targets[bat.target];
      t2.state = 'respawn'; t2.stateT = 0; t2.particles = [];
      bat.target = -1;
    }
  }
  // timeScale easing
  var tsT = (bat.busy && bat.phase === 'freeze') ? 0.02 : 1;
  timeScale += (tsT - timeScale) * Math.min(1, dt * 7);
  // target timers
  for (var i = 0; i < 3; i++) {
    var t3 = targets[i];
    t3.stateT += dt;
    if (t3.state === 'after') {
      var sdt = dt * timeScale, fl = H * 0.93;
      for (var j = 0; j < t3.particles.length; j++) {
        var q = t3.particles[j];
        q.vy += 1500 * sdt * (Math.min(W, H) / 900);
        q.x += q.vx * sdt; q.y += q.vy * sdt;
        if (q.kind === 'shard') q.rot += sdt * 4;
        if (q.y > fl - q.r) { q.y = fl - q.r; q.vy = 0; q.vx *= 0.8; }
      }
    }
    if (t3.state === 'respawn') {
      t3.alpha = clamp(t3.stateT / 1.2, 0, 1);
      if (t3.stateT >= 1.2) { t3.state = 'whole'; t3.alpha = 1; }
    }
  }
  // rare self-demonstration after long idleness
  if (!bat.busy && T - lastAct > 45) {
    var cand = [];
    for (var k = 0; k < 3; k++) if (targets[k].state === 'whole') cand.push(k);
    if (cand.length) startSwing(cand[Math.floor(rand() * cand.length)]);
    lastAct = T;
  }
  // bat angle
  var targetAngle;
  if (bat.busy && bat.phase === 'swing') {
    var k2 = clamp(bat.phaseT / 0.4, 0, 1);
    targetAngle = lerp(cockedAngle(bat.target), strikeAngle(bat.target), k2 * k2);
  } else if (bat.busy && (bat.phase === 'freeze')) {
    targetAngle = strikeAngle(bat.target) + Math.sin(T * 80) * 0.004;
  } else if (bat.busy) {
    targetAngle = lerp(strikeAngle(bat.target), cockedAngle(bat.aim), clamp(bat.phaseT / 0.9, 0, 1));
  } else {
    targetAngle = cockedAngle(bat.aim);
  }
  bat.angle += (targetAngle - bat.angle) * Math.min(1, dt * 14);
  var wantLen = batLenFor(bat.busy ? bat.target : bat.aim);
  bat.len += (wantLen - bat.len) * Math.min(1, dt * 6);
}

// ---- draw ---------------------------------------------------------------------
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && now > 0) {
    var dt = Math.min(0.05, (now - lastNow) / 1000);
    T += dt;
    step(dt);
  }
  lastNow = now;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // studio floor line
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fillRect(0, H * 0.93, W, 1);
  var R = tR();
  for (var i = 0; i < 3; i++) {
    var t = targets[i], tp = tPos(t);
    if (t.state === 'whole' || t.state === 'respawn') drawWhole(t, tp, R);
    else if (t.state === 'hit') {
      var p = clamp(bat.phaseT / 3, 0, 1);
      drawDeformed(t, tp, R, 1);
      drawParticles(t, 'freeze', p);
      drawDiagram(t, tp, R, p);
    } else if (t.state === 'after') {
      drawDeformed(t, tp, R, 0.4);
      drawParticles(t, 'live', 0);
    } else if (t.state === 'settled') {
      drawRemnant(t);
      drawParticles(t, 'live', 0);
    }
  }
  drawBat();
}

resize();
bat.angle = cockedAngle(1);
bat.len = batLenFor(1);
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
