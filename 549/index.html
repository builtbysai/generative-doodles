<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where the Smile Isn't</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #111111; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict, nothing else. Flat fills only, no gradients.
  var INK = '#111111', YELLOW = '#FFD400', PINK = '#F0438F', CYAN = '#00AEEF',
      GREEN = '#2AA37A', RED = '#E63B2E', WHITE = '#FFFFFF';

  var PHASE0 = 1.3;     // constant first-frame phase
  var ROT_PERIOD = 20;  // seconds per full smiley rotation

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(549066);

  // ---- layout (1080 x 1080 design space): 4 cols x 3 rows, loose grid ----
  var COLS = 4, ROWS = 3, CW = 1080 / COLS, CH = 1080 / ROWS; // 270 x 360

  // Object indices, row-major:
  //   0 can     1 plant   2 kebab   3 balloon
  //   4 duck    5 cup     6 doorway 7 palm
  //   8 shoe    9 radio  10 fish   11 house
  // Eligible smiley hosts: never the duck (4), never a face-bearing object.
  // The fish (10) is drawn with an eye, and the house (11) reads as a face
  // (two windows, one door), so both are excluded too: 9 eligible hosts.
  var ELIGIBLE = [0, 1, 2, 3, 5, 6, 7, 8, 9];

  // Smiley anchor points in each object's local coords (centred on 0,0),
  // always on a non-face spot: the tendril, the spit stack, the knot...
  var ANCHORS = {
    0: [0, 58],      // can: low on the body
    1: [-51, -61],   // plant: the curling tendril tip
    2: [30, 2],      // kebab: side of the meat stack
    3: [0, 26],      // balloon: the string knot
    5: [-22, 12],    // cup: front of the cup
    6: [0, -30],     // doorway: upper door panel
    7: [28, -38],    // palm: under the crown
    8: [-32, 6],     // shoe: plain part of the upper
    9: [33, -13]     // radio: the dial
  };
  var SMILEY_R = { 0: 20, 1: 19, 2: 20, 3: 17, 5: 19, 6: 19, 7: 18, 8: 19, 9: 17 };

  function pickHosts() {
    var pool = ELIGIBLE.slice();
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    return pool.slice(0, 3);
  }
  function sameSet(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (b.indexOf(a[i]) < 0) return false;
    return true;
  }

  // ---- smiley state: initial deal comes first off the seed stream ----
  var hosts = pickHosts();
  var rotOff = [rng() * Math.PI * 2, rng() * Math.PI * 2, rng() * Math.PI * 2];
  var popStart = -100; // long ago: no pop in frame one

  // ---- per-object seeded parameters, fixed forever ----
  var OBJS = [];
  for (var i = 0; i < 12; i++) {
    OBJS.push({
      scale: 0.92 + rng() * 0.16,
      bobAmp: 5 + rng() * 3.5,
      bobPeriod: 12 + Math.floor(rng() * 4) * 2, // 12, 14, 16 or 18 s
      bobPhase: rng() * Math.PI * 2
    });
  }

  // ---- small canvas helpers ----
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function fillStroke(fill, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
  }

  // ---- the twelve objects, drawn centred on (0,0) ----
  function drawCan() {
    rr(-34, -80, 68, 160, 10); fillStroke(CYAN, 7);
    ctx.fillStyle = PINK; ctx.fillRect(-34, -24, 68, 30);
    ctx.fillStyle = WHITE; ctx.fillRect(-34, 36, 68, 13);
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-34, -24); ctx.lineTo(34, -24);
    ctx.moveTo(-34, 6); ctx.lineTo(34, 6);
    ctx.moveTo(-34, 36); ctx.lineTo(34, 36);
    ctx.stroke();
    ell(0, -80, 34, 11); fillStroke(WHITE, 6);
    ell(0, -80, 16, 5); fillStroke(CYAN, 4);
  }

  function leaf(x, y, len, ang) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    ell(0, 0, len, len * 0.36); fillStroke(GREEN, 5);
    ctx.restore();
  }
  function drawPlant() {
    ctx.strokeStyle = GREEN; ctx.lineCap = 'round';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(0, 6); ctx.quadraticCurveTo(4, -30, 0, -64);
    ctx.moveTo(-6, 6); ctx.quadraticCurveTo(-26, -18, -40, -44);
    ctx.moveTo(6, 6); ctx.quadraticCurveTo(24, -22, 34, -50);
    ctx.stroke();
    ctx.lineWidth = 6; // the curling tendril
    ctx.beginPath(); ctx.arc(-48, -52, 9, 0.3, 4.4); ctx.stroke();
    leaf(0, -72, 36, -1.2);
    leaf(-45, -52, 30, -2.6);
    leaf(39, -58, 30, -0.5);
    leaf(-17, -40, 26, -1.9);
    leaf(19, -32, 26, -1.1);
    // pot
    ctx.beginPath();
    ctx.moveTo(-40, 20); ctx.lineTo(40, 20); ctx.lineTo(30, 86); ctx.lineTo(-30, 86);
    ctx.closePath(); fillStroke(RED, 7);
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-35, 52); ctx.lineTo(35, 52); ctx.stroke();
    rr(-48, -2, 96, 22, 6); fillStroke(RED, 7);
  }

  function drawKebab() {
    ctx.fillStyle = WHITE; ctx.fillRect(-3.5, -102, 7, 182);
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.strokeRect(-3.5, -102, 7, 182);
    circ(0, -110, 9); fillStroke(RED, 5);
    for (var k = 0; k < 8; k++) {
      var y = -82 + k * 19.5;
      var w = 62 - Math.abs(k - 3.5) * 3;
      ell(0, y, w / 2, 14); fillStroke(k % 2 ? PINK : RED, 5);
    }
    circ(0, 88, 6); fillStroke(RED, 4);
  }

  function drawBalloon() {
    ctx.strokeStyle = WHITE; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 34);
    ctx.quadraticCurveTo(-12, 58, 0, 72);
    ctx.quadraticCurveTo(12, 86, 2, 104);
    ctx.stroke();
    ell(0, -46, 57, 68); fillStroke(PINK, 7);
    ctx.save();
    ctx.translate(-21, -76); ctx.rotate(-0.42);
    ell(0, 0, 11, 19); ctx.fillStyle = WHITE; ctx.fill();
    ctx.restore();
    ctx.beginPath();
    ctx.moveTo(-10, 18); ctx.lineTo(10, 18); ctx.lineTo(0, 34);
    ctx.closePath(); fillStroke(PINK, 6);
  }

  function drawDuck() {
    ctx.beginPath();
    ctx.moveTo(48, -6); ctx.lineTo(80, -28); ctx.lineTo(76, 10);
    ctx.closePath(); fillStroke(CYAN, 6);
    ell(0, 12, 63, 42); fillStroke(CYAN, 7);
    ctx.save();
    ctx.translate(4, 14); ctx.rotate(-0.15);
    ell(0, 0, 33, 20); fillStroke(WHITE, 5);
    ctx.restore();
    circ(-42, -32, 28); fillStroke(CYAN, 7);
    ell(-72, -28, 17, 10); fillStroke(RED, 5);
    circ(-48, -38, 4.5); ctx.fillStyle = INK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-16, 54); ctx.lineTo(-16, 65);
    ctx.moveTo(14, 54); ctx.lineTo(14, 65);
    ctx.stroke();
  }

  function drawCup() {
    ell(0, 68, 64, 13); fillStroke(CYAN, 6);
    ctx.beginPath();
    ctx.arc(52, -2, 22, -1.15, 1.15);
    ctx.arc(52, -2, 10, 1.15, -1.15, true);
    ctx.closePath(); fillStroke(WHITE, 5);
    ctx.beginPath();
    ctx.moveTo(-46, -32); ctx.lineTo(46, -32); ctx.lineTo(37, 54); ctx.lineTo(-37, 54);
    ctx.closePath(); fillStroke(WHITE, 7);
    ell(0, -32, 46, 12); fillStroke(RED, 5);
    ctx.strokeStyle = WHITE; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-14, -52); ctx.quadraticCurveTo(-20, -66, -13, -80);
    ctx.moveTo(12, -52); ctx.quadraticCurveTo(6, -66, 13, -80);
    ctx.stroke();
  }

  function drawDoorway() {
    rr(-52, -84, 104, 176, 4); fillStroke(GREEN, 7);
    rr(-36, -68, 72, 144, 3); fillStroke(PINK, 6);
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.rect(-24, -52, 48, 44); ctx.stroke();
    rr(-58, -102, 116, 18, 5); fillStroke(WHITE, 6);
    rr(-64, 92, 128, 14, 4); fillStroke(WHITE, 6);
    circ(22, 8, 6.5); fillStroke(WHITE, 4);
  }

  function drawPalm() {
    ctx.lineCap = 'round';
    ctx.strokeStyle = GREEN; ctx.lineWidth = 16;
    ctx.beginPath();
    ctx.moveTo(0, 96); ctx.quadraticCurveTo(-16, 36, 4, -8);
    ctx.stroke();
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(4, -8); ctx.quadraticCurveTo(-30, -44, -66, -46);
    ctx.moveTo(4, -8); ctx.quadraticCurveTo(-24, -58, -40, -72);
    ctx.moveTo(4, -8); ctx.quadraticCurveTo(2, -52, 6, -84);
    ctx.moveTo(4, -8); ctx.quadraticCurveTo(28, -56, 46, -68);
    ctx.moveTo(4, -8); ctx.quadraticCurveTo(38, -40, 68, -34);
    ctx.stroke();
    circ(-6, 2, 10); fillStroke(RED, 5);
    circ(15, 6, 9); fillStroke(RED, 5);
  }

  function drawShoe() {
    ctx.beginPath();
    ctx.moveTo(-74, 42); ctx.lineTo(-74, -4);
    ctx.quadraticCurveTo(-74, -27, -45, -29);
    ctx.lineTo(-8, -29);
    ctx.quadraticCurveTo(8, -29, 20, -8);
    ctx.lineTo(66, 28);
    ctx.quadraticCurveTo(78, 34, 78, 42);
    ctx.closePath(); fillStroke(PINK, 7);
    ctx.strokeStyle = WHITE; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(27, 0); ctx.lineTo(39, -11);
    ctx.moveTo(40, 9); ctx.lineTo(52, -2);
    ctx.moveTo(53, 18); ctx.lineTo(65, 7);
    ctx.stroke();
    rr(-74, 42, 152, 17, 8); fillStroke(WHITE, 7);
  }

  function drawRadio() {
    ctx.strokeStyle = WHITE; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-50, -38); ctx.lineTo(-84, -90); ctx.stroke();
    circ(-86, -92, 6); fillStroke(WHITE, 4);
    rr(-66, -40, 132, 86, 12); fillStroke(RED, 7);
    circ(-34, 3, 24); fillStroke(WHITE, 6);
    circ(-34, 3, 13); fillStroke(CYAN, 4);
    circ(-34, 3, 4); ctx.fillStyle = INK; ctx.fill();
    rr(12, -24, 42, 22, 4); fillStroke(WHITE, 5);
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(18, -8); ctx.lineTo(46, -18); ctx.stroke();
    circ(22, 28, 8); fillStroke(CYAN, 5);
    circ(46, 28, 8); fillStroke(CYAN, 5);
    ctx.fillStyle = INK;
    ctx.fillRect(-52, 46, 16, 8);
    ctx.fillRect(36, 46, 16, 8);
  }

  function drawFish() {
    ctx.beginPath();
    ctx.moveTo(-50, 0); ctx.lineTo(-94, -34);
    ctx.quadraticCurveTo(-80, 0, -94, 34);
    ctx.closePath(); fillStroke(PINK, 6);
    ell(0, 0, 66, 37); fillStroke(CYAN, 7);
    ell(8, 15, 42, 15); ctx.fillStyle = WHITE; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-8, -32); ctx.lineTo(-26, -52); ctx.lineTo(14, -35);
    ctx.closePath(); fillStroke(PINK, 5);
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(20, -24); ctx.quadraticCurveTo(8, 0, 20, 24);
    ctx.stroke();
    circ(40, -9, 5.5); ctx.fillStyle = INK; ctx.fill();
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(58, 10); ctx.quadraticCurveTo(64, 6, 65, 1);
    ctx.stroke();
  }

  function drawHouse() {
    rr(32, -66, 17, 30, 2); fillStroke(PINK, 6);
    ctx.beginPath();
    ctx.moveTo(-72, -14); ctx.lineTo(72, -14); ctx.lineTo(0, -74);
    ctx.closePath(); fillStroke(RED, 7);
    rr(-56, -14, 112, 78, 2); fillStroke(WHITE, 7);
    rr(-42, 0, 24, 24, 3); fillStroke(CYAN, 5);
    rr(18, 0, 24, 24, 3); fillStroke(CYAN, 5);
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-30, 0); ctx.lineTo(-30, 24);
    ctx.moveTo(-42, 12); ctx.lineTo(-18, 12);
    ctx.moveTo(30, 0); ctx.lineTo(30, 24);
    ctx.moveTo(18, 12); ctx.lineTo(42, 12);
    ctx.stroke();
    rr(-12, 16, 24, 48, 3); fillStroke(CYAN, 5);
    circ(6, 42, 3); ctx.fillStyle = INK; ctx.fill();
    rr(-70, 64, 140, 11, 4); fillStroke(GREEN, 6);
  }

  var DRAW = [drawCan, drawPlant, drawKebab, drawBalloon, drawDuck, drawCup,
              drawDoorway, drawPalm, drawShoe, drawRadio, drawFish, drawHouse];

  // ---- the smiley decal: always the same. Two dot eyes, one arc mouth. ----
  function popScale(t) {
    var u = (t - popStart) / 0.3;
    if (u < 0 || u >= 1) return 1;
    if (u < 0.55) return 0.25 + (u / 0.55) * 0.93;   // up to 1.18
    return 1.18 - ((u - 0.55) / 0.45) * 0.18;        // settle to 1.0
  }
  function drawSmiley(x, y, r, rot, pop) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(pop, pop);
    circ(0, 0, r); fillStroke(YELLOW, 5);
    ctx.fillStyle = INK;
    circ(-r * 0.36, -r * 0.14, r * 0.11); ctx.fill();
    circ(r * 0.36, -r * 0.14, r * 0.11); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, r * 0.05, r * 0.5, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);
    ctx.lineJoin = 'round';

    for (var i = 0; i < 12; i++) {
      var o = OBJS[i];
      var cx = (i % COLS) * CW + CW / 2;
      var cy = Math.floor(i / COLS) * CH + CH / 2;
      var bobY = o.bobAmp * Math.sin(2 * Math.PI * t / o.bobPeriod + o.bobPhase);
      ctx.save();
      ctx.translate(cx, cy + bobY);
      ctx.scale(o.scale * 1.22, o.scale * 1.22);
      DRAW[i]();
      var hi = hosts.indexOf(i);
      if (hi >= 0) {
        var rot = rotOff[hi] + 2 * Math.PI * t / ROT_PERIOD;
        drawSmiley(ANCHORS[i][0], ANCHORS[i][1], SMILEY_R[i], rot, popScale(t));
      }
      ctx.restore();
    }

    // hint
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = CYAN;
    ctx.font = '26px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('tap', 1062, 1064);
    ctx.restore();

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground is black) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      // the grid keeps its shape and spans the full phone width
      S = W;
      OX = 0; OY = (H - S) / 2;
    } else {
      S = Math.min(W, H);
      OX = (W - S) / 2; OY = (H - S) / 2;
    }
    draw(simT);
  }

  // ---- tap: the three smileys migrate to three new random eligible hosts ----
  var lastTapStamp = -1;
  function onTap(e) {
    if (e.timeStamp !== undefined && e.timeStamp - lastTapStamp < 400) return;
    lastTapStamp = e.timeStamp || 0;
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var px = (e.clientX - rect.left - OX) / S * 1080;
    var py = (e.clientY - rect.top - OY) / S * 1080;
    if (px < 0 || px >= 1080 || py < 0 || py >= 1080) return;
    var next = pickHosts();
    var guard = 0;
    while (sameSet(next, hosts) && guard < 8) { next = pickHosts(); guard++; }
    hosts = next;
    rotOff = [rng() * Math.PI * 2, rng() * Math.PI * 2, rng() * Math.PI * 2];
    popStart = simT;
    draw(simT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onTap);
    canvas.addEventListener('touchstart', onTap);
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
