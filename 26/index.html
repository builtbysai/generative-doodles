<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№26 · Fan</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0c; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(245,240,228,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.85); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another fan</div>
<script>
'use strict';
// No26 Fan.
// All lines share one origin at a corner of the field. Their other
// ends land on the two far edges, spaced by a seeded easing curve, so
// the fan crowds toward one edge and opens toward the other. Two
// chords cross the fan at seeded heights and every fan line stops at
// the lower chord or restarts past it, cutting the fan into bands.
// Warm white on near-black; the crossing chords are gold.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '26', 10) || 26;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0a0a0c';

function compose(s) {
  const rnd = mulberry32(s);
  return {
    corner: (rnd() * 4) | 0,
    ease: 0.55 + rnd() * 0.9,          // spacing exponent along the edges
    band1: 0.30 + rnd() * 0.18,
    band2: 0.62 + rnd() * 0.18,
    count: 90 + ((rnd() * 40) | 0)
  };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // origin corner and the two far edges (endpoints travel edge A then edge B)
  const corners = [[0, 0], [1, 0], [1, 1], [0, 1]];
  const [ocx, ocy] = corners[p.corner];
  const oxp = ox + ocx * RX, oyp = oy + ocy * RY;
  // far edges: the two edges not touching the origin corner, parameterized as one path
  function farPoint(t) {
    // t in 0..1 walks the two far edges via the far corner
    const far = corners[(p.corner + 2) % 4];
    const a = corners[(p.corner + 1) % 4];
    const b = corners[(p.corner + 3) % 4];
    // choose the neighbor edges: from origin, far edges are (a-far) and (far-b)
    if (t < 0.5) {
      const u = t * 2;
      return [ox + (a[0] + (far[0] - a[0]) * u) * RX, oy + (a[1] + (far[1] - a[1]) * u) * RY];
    }
    const u = (t - 0.5) * 2;
    return [ox + (far[0] + (b[0] - far[0]) * u) * RX, oy + (far[1] + (b[1] - far[1]) * u) * RY];
  }

  ctx.lineWidth = Math.max(0.7, Math.min(RX, RY) / 1100);
  // fan lines, cut into bands by radius fractions of their own length
  for (let i = 0; i <= p.count; i++) {
    const t = Math.pow(i / p.count, p.ease);
    const [ex, ey] = farPoint(t);
    ctx.strokeStyle = 'rgba(245,240,228,0.5)';
    ctx.beginPath();
    ctx.moveTo(oxp + (ex - oxp) * 0.0, oyp + (ey - oyp) * 0.0);
    ctx.lineTo(oxp + (ex - oxp) * p.band1, oyp + (ey - oyp) * p.band1);
    ctx.moveTo(oxp + (ex - oxp) * (p.band1 + 0.015), oyp + (ey - oyp) * (p.band1 + 0.015));
    ctx.lineTo(oxp + (ex - oxp) * p.band2, oyp + (ey - oyp) * p.band2);
    ctx.moveTo(oxp + (ex - oxp) * (p.band2 + 0.015), oyp + (ey - oyp) * (p.band2 + 0.015));
    ctx.lineTo(ex, ey);
    ctx.stroke();
  }
  // band chords in gold: arcs of constant fraction are not straight; draw
  // the two polylines through the band boundaries instead
  ctx.strokeStyle = 'rgba(212,175,55,0.9)';
  ctx.lineWidth = Math.max(0.9, Math.min(RX, RY) / 800);
  for (const band of [p.band1, p.band2]) {
    ctx.beginPath();
    for (let i = 0; i <= 60; i++) {
      const t = Math.pow(i / 60, p.ease);
      const [ex, ey] = farPoint(t);
      const x = oxp + (ex - oxp) * band, y = oyp + (ey - oyp) * band;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
