<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.238 Honest Signals</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#141414; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.238 Honest Signals (James Woodfill). After the Contingent
// Flag Forms and the Semaphore pieces: ninety six flags on thin
// steel poles, white and signal red, each holding one of four
// orientations. A seeded message propagates through the field as a
// wave of flips; then noise creeps in, spurious flips rising until
// the pattern is unreadable, until a call and response sweep
// re-asserts the honest signal and the floor resets. The signal
// is abstract, no letters. Tap reseeds the message, nothing else.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#141414';
var WHITE = '#F5F5F2', RED = '#D92B1F', STEEL = '#777777';
var COLS = 12, ROWS = 8; // 96 flags, exact
var LOOP = 84;           // seconds per message cycle
var W = 0, H = 0, phone = false;
var T = 0, lastNow = -1;
var baseSeed = 20260906;
var epoch = -44;         // frame one: 44s into the cycle, noise already creeping

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashI(n) {
  var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return Math.floor((s - Math.floor(s)) * 100000);
}

// The message is blocky, not random: flags in a 3x2 block share an
// orientation derived from the cycle seed, so the field reads as a
// pattern. Colour follows the orientation and block parity.
function targetOri(cyc, c, r) {
  var bx = Math.floor(c / 3), by = Math.floor(r / 2);
  return (hashI(baseSeed + cyc * 977 + bx * 131 + by * 57) + (c % 2)) % 4;
}
function targetCol(cyc, c, r) {
  var bx = Math.floor(c / 3), by = Math.floor(r / 2);
  return (targetOri(cyc, c, r) + bx + by) % 2;
}

// Per flag, the cycle's events are deterministic: one propagation
// flip, up to two noise flips (biased later as the noise ramps),
// one sweep flip back to the honest orientation.
function flagState(cyc, c, r, tc) {
  var tgt = targetOri(cyc, c, r);
  var ori = targetOri(cyc - 1, c, r);
  var events = [];
  var rng = mulberry32(baseSeed + cyc * 7919 + c * 131 + r * 17);
  var colFrac = COLS <= 1 ? 0 : c / (COLS - 1);
  events.push({ t: 1 + colFrac * 15 + rng() * 0.8, ori: tgt });
  for (var k = 0; k < 2; k++) {
    var nt = 34 + 28 * Math.sqrt(rng());
    var nori = (hashI(baseSeed + cyc * 331 + c * 71 + r * 13 + k * 7) % 4);
    events.push({ t: nt, ori: nori });
  }
  events.push({ t: 62 + colFrac * 14 + rng() * 0.8, ori: tgt });
  events.sort(function (a, b) { return a.t - b.t; });
  var ang = ori * 90, found = false;
  for (var i = 0; i < events.length; i++) {
    var e = events[i];
    if (tc < e.t) break;
    if (tc - e.t < 0.2) {
      var f = (tc - e.t) / 0.2;
      f = f * f * (3 - 2 * f);
      ang = ang + (e.ori * 90 - ang) * f;
      found = true;
      break;
    }
    ang = e.ori * 90;
    found = true;
  }
  return { ang: ang, col: targetCol(cyc, c, r) };
}

function panelRect() {
  var pw = W * (phone ? 1 : 0.96);
  var ph = pw * 2 / 3;
  if (ph > H * 0.94) { ph = H * 0.94; pw = ph * 1.5; }
  return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph };
}

function drawFlag(cx, topY, baseY, angDeg, colIdx, s) {
  // pole, full length, with a mounting plate at the base
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = 2.2 * s;
  ctx.beginPath();
  ctx.moveTo(cx, topY);
  ctx.lineTo(cx, baseY);
  ctx.stroke();
  ctx.fillStyle = STEEL;
  ctx.fillRect(cx - 11 * s, baseY - 3 * s, 22 * s, 3.5 * s);
  // semaphore arm and pennant, rotating about the pole head
  var a = angDeg * Math.PI / 180;
  var ex = cx + 31 * s * Math.sin(a), ey = topY - 31 * s * Math.cos(a);
  ctx.strokeStyle = colIdx ? RED : WHITE;
  ctx.lineWidth = 3 * s;
  ctx.beginPath();
  ctx.moveTo(cx, topY);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  var px = Math.cos(a), py = Math.sin(a);
  ctx.fillStyle = colIdx ? RED : WHITE;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex - 15 * s * Math.sin(a) + 7 * s * px, ey + 15 * s * Math.cos(a) + 7 * s * py);
  ctx.lineTo(ex - 15 * s * Math.sin(a) - 7 * s * px, ey + 15 * s * Math.cos(a) - 7 * s * py);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, topY, 3 * s, 0, Math.PI * 2);
  ctx.fillStyle = STEEL;
  ctx.fill();
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var p = panelRect(), s = p.w / 1200;
  var rel = T - epoch;
  var cyc = Math.floor(rel / LOOP);
  var tc = rel - cyc * LOOP;
  var cellW = (p.w - 140 * s) / COLS, cellH = (p.h - 170 * s) / ROWS;
  var baseY = p.y + p.h - 28 * s;
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var cx = p.x + 70 * s + cellW * (c + 0.5);
      var topY = p.y + 58 * s + cellH * r + 14 * s;
      var st = flagState(cyc, c, r, tc);
      drawFlag(cx, topY, baseY, st.ang, st.col, s);
    }
  }
}

// ---- interaction: tap reseeds the message only -------------------------------------------
canvas.addEventListener('pointerdown', function () {
  baseSeed = (Math.random() * 1000000000) | 0;
  epoch = T;
});

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
