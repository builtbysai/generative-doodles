<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.351 Tweed Field</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#12100D; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.351 Tweed Field (emibeebuzz).
// After Emi Bee's painted "fluffy tweed" and "chunky,
// puffy tweed" textures for the Dark Academia collection:
// a full-bleed woven field of thousands of short thread
// strokes laid in visible rows in three yarn colours on
// near-black, a slow sheen band travelling across the
// weave, and two bone motifs, a moth and a crescent moon,
// drifting half-buried in the cloth. Watch-only.
//
// The prompt's tech called for the threads to be drawn
// once to an offscreen layer; the house one-canvas rule
// forbids that, so the threads are JS data, built once
// from a fixed seed table and stroked directly every
// frame on the single visible canvas. No gradients, no
// shadowBlur, no filters, no offscreen canvas. The sheen
// is layered translucency only: three stepped flat-alpha
// bands of the palette bone colour, never a gradient.
//
// Woven structure is the concept: even rows run warp
// (near-horizontal), odd rows run weft (near-vertical),
// each thread's angle and jitter coming from the fixed
// table, so the field reads as cloth rows, not noise.
//
// Counts are asserted in code: exactly TWO motifs (one
// moth upper-left, one crescent moon lower-right) and a
// thread count in the thousands. Motion is one 32s
// seamless master loop: the sheen band crosses the frame
// once per loop, off-frame at both ends of the cycle, and
// each motif rides sinusoids with a whole number of
// cycles per loop, so frame 32s is pixel-identical to
// frame 0. Frame one is drawn at a CONSTANT phase
// (T_OFFSET seconds into the loop), never from a wall
// clock, so the thumbnail reproduces byte-identically;
// the live loop advances from that same anchor.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#12100D';
var YARNS = ['#6B5B4C', '#8C7B66', '#A89B82'];
var BONE = '#E8DCC8';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var CYCLE = 32;               // seconds, seamless master loop

// ---- fixed seed table --------------------------------------
// One deterministic generator, seeded once. All layout
// data is built from it at load and never changes.
function makeRng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
var rng = makeRng(3511207);
function rr(a, b) { return a + rng() * (b - a); }

// ---- threads: thousands of short strokes in woven rows -----
// Warp rows (even) run near-horizontal, weft rows (odd)
// near-vertical. Each thread is a centre point on a
// jittered grid plus a half-vector (dx, dy) and a yarn
// index, precomputed once so a frame is just strokes.
var threads = [];
(function buildThreads() {
  var rowStep = 15, colStep = 17;
  var row, col, x, y;
  var rows = 0;
  for (y = -rowStep; y < DH + rowStep; y += rowStep, rows++) {
    var warp = (rows % 2 === 0);
    for (x = -colStep; x < DW + colStep; x += colStep) {
      var jx = x + rr(-4.5, 4.5), jy = y + rr(-3.5, 3.5);
      var base = warp ? 0 : Math.PI / 2;
      var ang = base + rr(-0.17, 0.17);
      var len = rr(12.5, 19);
      var pick = rng();
      threads.push({
        x: jx, y: jy,
        dx: Math.cos(ang) * len / 2, dy: Math.sin(ang) * len / 2,
        c: pick < 0.40 ? 0 : (pick < 0.75 ? 1 : 2),
        row: rows
      });
    }
  }
})();
if (threads.length < 3000) throw new Error('Tweed Field needs thousands of threads, got ' + threads.length);

// ---- motifs: exactly two ------------------------------------
// Fixed parametric paths in bone. The moth sits upper-left,
// the crescent moon lower-right; both drift on sinusoids
// with whole cycles per loop (cx, cy are cycle counts).
var MOTIFS = [
  { kind: 'moth', x: 302, y: 238, ax: 30, ay: 20, px: 0.6, py: 2.4, cx: 1, cy: 1, bury: 92, core: 0.52 },
  { kind: 'moon', x: 972, y: 648, ax: 22, ay: 15, px: 3.4, py: 1.1, cx: 1, cy: 1, bury: 66, core: 0 }
];
if (MOTIFS.length !== 2) throw new Error('Tweed Field needs exactly two motifs');

function motifPos(m, ph) {
  return {
    x: m.x + m.ax * Math.sin(Math.PI * 2 * m.cx * ph + m.px),
    y: m.y + m.ay * Math.sin(Math.PI * 2 * m.cy * ph + m.py)
  };
}

function drawMoth(x, y, ph) {
  // Wing spread breathes twice per loop (whole cycles).
  var spread = 1 + 0.07 * Math.sin(Math.PI * 2 * 2 * ph + 0.9);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1.3, 1.3);
  ctx.translate(-x, -y);
  ctx.fillStyle = BONE;
  ctx.strokeStyle = BONE;
  ctx.lineCap = 'round';
  var side;
  for (side = -1; side <= 1; side += 2) {
    // forewing: swept up and out to a pointed tip
    ctx.beginPath();
    ctx.moveTo(x + side * 3, y - 14);
    ctx.quadraticCurveTo(x + side * 30, y - 34, x + side * 56 * spread, y - 26);
    ctx.quadraticCurveTo(x + side * 50, y - 6, x + side * 30, y + 2);
    ctx.quadraticCurveTo(x + side * 14, y + 6, x + side * 5, y + 2);
    ctx.closePath();
    ctx.fill();
    // hindwing: a rounded fan below the forewing
    ctx.beginPath();
    ctx.moveTo(x + side * 5, y + 4);
    ctx.quadraticCurveTo(x + side * 26, y + 2, x + side * 36 * spread, y + 12);
    ctx.quadraticCurveTo(x + side * 30, y + 28, x + side * 12, y + 24);
    ctx.quadraticCurveTo(x + side * 4, y + 18, x + side * 3, y + 10);
    ctx.closePath();
    ctx.fill();
  }
  // body
  ctx.beginPath();
  ctx.ellipse(x, y + 1, 8, 23, 0, 0, Math.PI * 2);
  ctx.fill();
  // head
  ctx.beginPath();
  ctx.arc(x, y - 17, 6, 0, Math.PI * 2);
  ctx.fill();
  // antennae
  ctx.lineWidth = 2.6;
  for (side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.moveTo(x + side * 2, y - 21);
    ctx.quadraticCurveTo(x + side * 12, y - 34, x + side * 26 * spread, y - 38);
    ctx.stroke();
  }
  ctx.restore();
}

function drawMoon(x, y) {
  ctx.fillStyle = BONE;
  ctx.beginPath();
  ctx.arc(x, y, 35, 0, Math.PI * 2);
  ctx.fill();
  // carve the crescent with the ground colour
  ctx.fillStyle = GROUND;
  ctx.beginPath();
  ctx.arc(x + 14, y - 9, 30, 0, Math.PI * 2);
  ctx.fill();
}

// ---- drawing ---------------------------------------------------
function strokeThreads(list) {
  var c, i, t;
  ctx.lineWidth = 5.6;
  ctx.lineCap = 'round';
  for (c = 0; c < 3; c++) {
    ctx.strokeStyle = YARNS[c];
    ctx.beginPath();
    for (i = 0; i < list.length; i++) {
      t = list[i];
      if (t.c !== c) continue;
      ctx.moveTo(t.x - t.dx, t.y - t.dy);
      ctx.lineTo(t.x + t.dx, t.y + t.dy);
    }
    ctx.stroke();
  }
}

function draw(t) {
  var ph = (t % CYCLE) / CYCLE;
  var i, m, p;

  // the woven field, stroked directly every frame
  strokeThreads(threads);

  // sheen: a diagonal band of three stepped flat-alpha
  // bone washes crossing the frame once per loop, fully
  // off-frame at both ends of the cycle so the seam holds
  var cx = -340 + (DW + 680) * ph;
  var tilt = 0.45;
  var ux = Math.sin(tilt), uy = Math.cos(tilt);
  var nx = Math.cos(tilt), ny = -Math.sin(tilt);
  var L = 980;
  var steps = [[168, 0.07], [112, 0.09], [54, 0.13]];
  ctx.fillStyle = BONE;
  for (i = 0; i < steps.length; i++) {
    var h = steps[i][0];
    ctx.globalAlpha = steps[i][1];
    ctx.beginPath();
    ctx.moveTo(cx - ux * L - nx * h, DH / 2 - uy * L - ny * h);
    ctx.lineTo(cx + ux * L - nx * h, DH / 2 + uy * L - ny * h);
    ctx.lineTo(cx + ux * L + nx * h, DH / 2 + uy * L + ny * h);
    ctx.lineTo(cx - ux * L + nx * h, DH / 2 - uy * L + ny * h);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // the two motifs at their drifted positions
  var pos = [];
  for (i = 0; i < MOTIFS.length; i++) {
    m = MOTIFS[i];
    p = motifPos(m, ph);
    pos.push(p);
    if (m.kind === 'moth') drawMoth(p.x, p.y, ph); else drawMoon(p.x, p.y);
  }

  // half-buried: every fourth row's threads near a motif
  // are woven back over it, so the motifs sit in the
  // cloth, not on it. Each motif keeps a clear core (the
  // moth's silhouette stays whole); the weave crosses
  // only its outer band.
  var over = [];
  for (i = 0; i < threads.length; i++) {
    var th = threads[i];
    if (th.row % 4 !== 0) continue;
    for (var j = 0; j < MOTIFS.length; j++) {
      var dx = th.x - pos[j].x, dy = th.y - pos[j].y;
      var d2 = dx * dx + dy * dy;
      var inner = MOTIFS[j].bury * MOTIFS[j].core;
      if (d2 < MOTIFS[j].bury * MOTIFS[j].bury && d2 > inner * inner) { over.push(th); break; }
    }
  }
  strokeThreads(over);
}

// ---- state -----------------------------------------------------
// Frame one starts developed: exactly 11s into the 32s
// cycle, sheen mid-travel and both motifs mid-drift.
// Drawn at this fixed phase, never from a wall clock.
var T_OFFSET = 11;

// ---- frame -------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Full-bleed field composition: cover-fit on every
  // screen, phones included, page ground in the piece's
  // own near-black so any edge reads as cloth dark.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  draw(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(T_OFFSET);
if (typeof requestAnimationFrame === 'function') {
  var loadMs = Date.now();
  var loop = function () {
    frame(T_OFFSET + (Date.now() - loadMs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
