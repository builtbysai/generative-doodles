<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.293 Kokeshi Stack</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FBF3E4; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.293 Kokeshi Stack (Ruby Waters).
// A tall kokeshi figure dead centre: a big flattened-sphere
// moon-face head with a black bob, arched closed eyes,
// vermilion blush circles and small red lips, on a long cone
// body built from a seeded stack of pattern bands (stripe
// stack, lotus, dotted yellow, chrysanthemum field, teal
// waves), no two adjacent bands alike. A tiny painted Mt
// Fuji sits at the base and occasionally breathes a small
// white puff of cloud. The whole figure sways like a weeble
// on a 3 degree pendulum around its weighted bottom, on a
// 30 second seamless loop. Watch-only: no pointer handling
// at all, and nothing ever reloads.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CREAM = '#FBF3E4', INK = '#141414', BLUSH = '#D23A2A',
    PINK = '#F5C9C5', YELLOW = '#E8B93B', TEAL = '#3E8E7E',
    LOTUS = '#D94F3D', LEAF = '#4E9A51';
var DW = 1280, DH = 900;
var CX = 640, ANCHOR_Y = 828;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 0.7, lastNow = -1, acc = 0; // frame one: sway already off-centre by about a degree
var TICK = 1 / 60;
var LOOP = 30;

function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }

// ---- band stack: seeded choice, exactly 4-5 bands, no duplicates adjacent ----
// Band types: 0 stripe stack, 1 lotus, 2 dotted yellow,
// 3 chrysanthemum field, 4 teal waves.
var bands = [];
(function () {
  var r = rng(293413);
  var count = 4 + Math.floor(r() * 2); // 4 or 5
  var prev = -1;
  for (var i = 0; i < count; i++) {
    var b = Math.floor(r() * 5);
    while (b === prev) b = Math.floor(r() * 5);
    bands.push(b);
    prev = b;
  }
})();

// ---- body geometry ------------------------------------------------------------------
// Trapezoid cone: narrow at the neck, wide at the weighted base.
var BODY_TOP = 386, BODY_BOT = 808;
var TOP_HW = 92, BOT_HW = 215;
function halfW(y) {
  return TOP_HW + (BOT_HW - TOP_HW) * (y - BODY_TOP) / (BODY_BOT - BODY_TOP);
}
function bodyPath() {
  ctx.beginPath();
  ctx.moveTo(CX - TOP_HW, BODY_TOP + 6);
  ctx.quadraticCurveTo(CX - TOP_HW - 4, BODY_TOP, CX - TOP_HW + 22, BODY_TOP);
  ctx.lineTo(CX + TOP_HW - 22, BODY_TOP);
  ctx.quadraticCurveTo(CX + TOP_HW + 4, BODY_TOP, CX + TOP_HW, BODY_TOP + 6);
  ctx.lineTo(CX + BOT_HW - 16, BODY_BOT - 14);
  ctx.quadraticCurveTo(CX + BOT_HW, BODY_BOT, CX + BOT_HW - 30, BODY_BOT);
  ctx.lineTo(CX - BOT_HW + 30, BODY_BOT);
  ctx.quadraticCurveTo(CX - BOT_HW, BODY_BOT, CX - BOT_HW + 16, BODY_BOT - 14);
  ctx.closePath();
}

// ---- band painters (each clipped to its band slice of the body) ----------------------
function drawStripes(y0, y1) {
  var cols = [INK, PINK, BLUSH, PINK, INK, LOTUS];
  var n = cols.length;
  var h = (y1 - y0) / n;
  for (var i = 0; i < n; i++) {
    ctx.fillStyle = cols[i];
    ctx.fillRect(CX - BOT_HW - 10, y0 + i * h, (BOT_HW + 10) * 2, h + 1);
  }
}
function petal(x, y, len, wid, ang, col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.ellipse(0, -len / 2, wid, len / 2, 0, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.restore();
}
function drawLotus(y0, y1) {
  ctx.fillStyle = CREAM;
  ctx.fillRect(CX - BOT_HW - 10, y0, (BOT_HW + 10) * 2, y1 - y0);
  var cy = (y0 + y1) / 2 + (y1 - y0) * 0.14;
  // leaves first, low at the sides of the blossom
  petal(CX - 52, cy + 10, 52, 15, -1.15, LEAF);
  petal(CX + 52, cy + 10, 52, 15, 1.15, LEAF);
  petal(CX - 30, cy + 14, 44, 13, -0.55, LEAF);
  petal(CX + 30, cy + 14, 44, 13, 0.55, LEAF);
  // blossom: five vermilion petals fanned over a centre petal
  petal(CX - 34, cy + 8, 46, 14, -0.85, LOTUS);
  petal(CX + 34, cy + 8, 46, 14, 0.85, LOTUS);
  petal(CX - 18, cy + 6, 54, 15, -0.42, LOTUS);
  petal(CX + 18, cy + 6, 54, 15, 0.42, LOTUS);
  petal(CX, cy + 4, 58, 16, 0, LOTUS);
  ctx.beginPath();
  ctx.arc(CX, cy + 8, 7, 0, Math.PI * 2);
  ctx.fillStyle = YELLOW;
  ctx.fill();
  // small side buds, kept inside the cone edge
  petal(CX - 102, cy + 2, 28, 9, -0.3, LOTUS);
  petal(CX + 102, cy + 2, 28, 9, 0.3, LOTUS);
}
function drawDots(y0, y1) {
  ctx.fillStyle = YELLOW;
  ctx.fillRect(CX - BOT_HW - 10, y0, (BOT_HW + 10) * 2, y1 - y0);
  ctx.fillStyle = INK;
  var spacing = 46, rowH = 34;
  var rows = Math.ceil((y1 - y0) / rowH);
  for (var rI = 0; rI <= rows; rI++) {
    var y = y0 + 12 + rI * rowH;
    if (y > y1 - 6) break;
    var off = (rI % 2) * spacing / 2;
    for (var x = CX - BOT_HW + 6 + off; x < CX + BOT_HW; x += spacing) {
      ctx.beginPath();
      ctx.arc(x, y, 8.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}
function drawChrysField(y0, y1) {
  ctx.fillStyle = PINK;
  ctx.fillRect(CX - BOT_HW - 10, y0, (BOT_HW + 10) * 2, y1 - y0);
  var cy = (y0 + y1) / 2;
  var xs = [CX - 118, CX, CX + 118];
  for (var i = 0; i < xs.length; i++) {
    // twelve petals radiating from the flower centre
    for (var k = 0; k < 12; k++) {
      var a = k / 12 * Math.PI * 2;
      ctx.save();
      ctx.translate(xs[i], cy);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(0, -21, 7.5, 21, 0, 0, Math.PI * 2);
      ctx.fillStyle = BLUSH;
      ctx.fill();
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(xs[i], cy, 8, 0, Math.PI * 2);
    ctx.fillStyle = YELLOW;
    ctx.fill();
  }
}
function drawWaves(y0, y1) {
  ctx.fillStyle = TEAL;
  ctx.fillRect(CX - BOT_HW - 10, y0, (BOT_HW + 10) * 2, y1 - y0);
  ctx.strokeStyle = CREAM;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  var rad = 26, rowH = 24;
  var rows = Math.ceil((y1 - y0) / rowH);
  for (var rI = 0; rI <= rows; rI++) {
    var y = y0 + 16 + rI * rowH;
    if (y > y1 + rad) break;
    var off = (rI % 2) * rad;
    for (var x = CX - BOT_HW - rad + off; x < CX + BOT_HW + rad; x += rad * 2) {
      ctx.beginPath();
      ctx.arc(x, y, rad, Math.PI, Math.PI * 2);
      ctx.stroke();
    }
  }
}
var bandPainters = [drawStripes, drawLotus, drawDots, drawChrysField, drawWaves];

// ---- Mt Fuji, painted at the base ------------------------------------------------------
// Fuji geometry is shared so the cloud puff can anchor at the summit.
var FUJI_CX = CX, FUJI_BASE = 782, FUJI_TOP = 706, FUJI_HW = 78;
function fujiSummitY(x) {
  var u = Math.abs(x - FUJI_CX) / FUJI_HW; // 0 at centre, 1 at base corners
  return FUJI_BASE - (FUJI_BASE - FUJI_TOP) * Math.pow(1 - u, 1.35);
}
function drawFuji() {
  // silhouette: a broad cone with gently concave slopes
  ctx.beginPath();
  ctx.moveTo(FUJI_CX - FUJI_HW, FUJI_BASE);
  ctx.quadraticCurveTo(FUJI_CX - FUJI_HW * 0.42, FUJI_TOP + 26, FUJI_CX - 17, FUJI_TOP + 4);
  ctx.lineTo(FUJI_CX + 17, FUJI_TOP + 4);
  ctx.quadraticCurveTo(FUJI_CX + FUJI_HW * 0.42, FUJI_TOP + 26, FUJI_CX + FUJI_HW, FUJI_BASE);
  ctx.closePath();
  ctx.save();
  ctx.clip();
  // horizontal painted strata: snow cap, orange middle, yellow foot
  ctx.fillStyle = LOTUS;
  ctx.fillRect(FUJI_CX - FUJI_HW - 4, FUJI_TOP + 22, (FUJI_HW + 4) * 2, 17);
  ctx.fillStyle = YELLOW;
  ctx.fillRect(FUJI_CX - FUJI_HW - 4, FUJI_TOP + 39, (FUJI_HW + 4) * 2, FUJI_BASE - FUJI_TOP);
  ctx.fillStyle = CREAM;
  ctx.fillRect(FUJI_CX - FUJI_HW - 4, FUJI_TOP - 4, (FUJI_HW + 4) * 2, 26);
  // jagged snow edge
  ctx.beginPath();
  ctx.moveTo(FUJI_CX - 30, FUJI_TOP + 20);
  ctx.lineTo(FUJI_CX - 16, FUJI_TOP + 27);
  ctx.lineTo(FUJI_CX - 4, FUJI_TOP + 19);
  ctx.lineTo(FUJI_CX + 8, FUJI_TOP + 27);
  ctx.lineTo(FUJI_CX + 20, FUJI_TOP + 20);
  ctx.lineTo(FUJI_CX + 30, FUJI_TOP + 25);
  ctx.lineTo(FUJI_CX + 30, FUJI_TOP + 12);
  ctx.lineTo(FUJI_CX - 30, FUJI_TOP + 12);
  ctx.closePath();
  ctx.fillStyle = CREAM;
  ctx.fill();
  // red dots scattered on the yellow foot
  ctx.fillStyle = BLUSH;
  var dotPos = [[-46, 766], [-18, 774], [12, 768], [42, 775], [-30, 756], [28, 757], [0, 762]];
  for (var i = 0; i < dotPos.length; i++) {
    ctx.beginPath();
    ctx.arc(FUJI_CX + dotPos[i][0], dotPos[i][1], 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(FUJI_CX - FUJI_HW, FUJI_BASE);
  ctx.quadraticCurveTo(FUJI_CX - FUJI_HW * 0.42, FUJI_TOP + 26, FUJI_CX - 17, FUJI_TOP + 4);
  ctx.lineTo(FUJI_CX + 17, FUJI_TOP + 4);
  ctx.quadraticCurveTo(FUJI_CX + FUJI_HW * 0.42, FUJI_TOP + 26, FUJI_CX + FUJI_HW, FUJI_BASE);
  ctx.closePath();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4.5;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

// ---- cloud puff: one breath per loop, reseeded per loop integer ------------------------
function drawPuff() {
  var loopT = T % LOOP;
  var start = 19, dur = 5.5;
  if (loopT < start || loopT > start + dur) return;
  var p = (loopT - start) / dur; // 0 to 1 over the breath
  var loopIdx = Math.floor(T / LOOP);
  var r = rng(293900 + loopIdx * 77);
  var sx = FUJI_CX, sy = FUJI_TOP - 4;
  ctx.save();
  for (var i = 0; i < 5; i++) {
    var ox = (r() - 0.5) * 26, oy = r() * 8, delay = r() * 0.25, grow = 0.7 + r() * 0.6;
    var q = clamp((p - delay) / (1 - delay), 0, 1);
    if (q <= 0) continue;
    var rad = (6 + 26 * q) * grow;
    var cxp = sx + ox + q * 20 * (i % 2 === 0 ? 1 : -0.6);
    var cyp = sy - q * 44 - oy * q;
    ctx.globalAlpha = 0.85 * (1 - q) * (q < 0.15 ? q / 0.15 : 1);
    ctx.beginPath();
    ctx.arc(cxp, cyp, rad, 0, Math.PI * 2);
    ctx.fillStyle = CREAM;
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---- head --------------------------------------------------------------------------------
var HEAD_CY = 236, HAIR_RX = 178, HAIR_RY = 150;
function drawHead() {
  // bob hair: a black flattened sphere behind the face
  ctx.beginPath();
  ctx.ellipse(CX, HEAD_CY - 8, HAIR_RX, HAIR_RY, 0, 0, Math.PI * 2);
  ctx.fillStyle = INK;
  ctx.fill();
  // side locks falling past the cheeks, wide and blunt like a bob cut
  ctx.fillRect(CX - HAIR_RX + 2, HEAD_CY - 30, 48, 106);
  ctx.fillRect(CX + HAIR_RX - 50, HEAD_CY - 30, 48, 106);
  ctx.beginPath();
  ctx.ellipse(CX - HAIR_RX + 26, HEAD_CY + 76, 24, 11, 0, 0, Math.PI * 2);
  ctx.ellipse(CX + HAIR_RX - 26, HEAD_CY + 76, 24, 11, 0, 0, Math.PI * 2);
  ctx.fillStyle = INK;
  ctx.fill();
  // moon face: cream flattened ellipse set into the bob
  ctx.beginPath();
  ctx.ellipse(CX, HEAD_CY + 26, 138, 112, 0, 0, Math.PI * 2);
  ctx.fillStyle = CREAM;
  ctx.fill();
  // fringe line: a shallow black arc where the bob meets the forehead
  ctx.beginPath();
  ctx.ellipse(CX, HEAD_CY + 26, 138, 112, 0, Math.PI * 1.12, Math.PI * 1.88);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 5;
  ctx.stroke();
  // small vermilion hair ornament at the side of the fringe
  ctx.beginPath();
  ctx.arc(CX + 104, HEAD_CY - 62, 9, 0, Math.PI * 2);
  ctx.fillStyle = BLUSH;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(CX + 104, HEAD_CY - 62, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = YELLOW;
  ctx.fill();
  // arched closed eyes: two downward arcs, fixed grammar
  ctx.strokeStyle = INK;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  var eyeY = HEAD_CY + 22;
  ctx.beginPath();
  ctx.arc(CX - 52, eyeY, 24, Math.PI * 1.12, Math.PI * 1.88);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(CX + 52, eyeY, 24, Math.PI * 1.12, Math.PI * 1.88);
  ctx.stroke();
  // thin brow arcs above
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(CX - 52, eyeY - 26, 26, Math.PI * 1.18, Math.PI * 1.82);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(CX + 52, eyeY - 26, 26, Math.PI * 1.18, Math.PI * 1.82);
  ctx.stroke();
  // blush: solid vermilion circles on the cheeks
  ctx.beginPath();
  ctx.arc(CX - 84, HEAD_CY + 58, 15, 0, Math.PI * 2);
  ctx.fillStyle = BLUSH;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(CX + 84, HEAD_CY + 58, 15, 0, Math.PI * 2);
  ctx.fillStyle = BLUSH;
  ctx.fill();
  // tiny nose: a short vertical stroke
  ctx.strokeStyle = INK;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(CX, HEAD_CY + 44);
  ctx.lineTo(CX, HEAD_CY + 54);
  ctx.stroke();
  // small red lips
  ctx.beginPath();
  ctx.ellipse(CX, HEAD_CY + 74, 13, 7, 0, 0, Math.PI * 2);
  ctx.fillStyle = BLUSH;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(CX, HEAD_CY + 71, 8, 4, 0, 0, Math.PI * 2);
  ctx.fillStyle = LOTUS;
  ctx.fill();
}

// ---- drawing -------------------------------------------------------------------------------
function stepSim() { T += TICK; }
function draw() {
  ctx.fillStyle = CREAM;
  ctx.fillRect(-80, -80, DW + 160, DH + 160);
  // weeble sway: 3 degree pendulum around the bottom anchor,
  // three full swings inside the 30 second loop
  var ang = 3 * Math.PI / 180 * Math.sin(T * Math.PI * 2 / 10);
  ctx.save();
  ctx.translate(CX, ANCHOR_Y);
  ctx.rotate(ang);
  ctx.translate(-CX, -ANCHOR_Y);

  // neck
  ctx.fillStyle = CREAM;
  ctx.fillRect(CX - 30, 356, 60, 44);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4;
  ctx.strokeRect(CX - 30, 356, 60, 44);

  // body: base cream, then the band stack clipped to the cone
  bodyPath();
  ctx.fillStyle = CREAM;
  ctx.fill();
  ctx.save();
  bodyPath();
  ctx.clip();
  var bandH = (BODY_BOT - BODY_TOP) / bands.length;
  for (var i = 0; i < bands.length; i++) {
    var y0 = BODY_TOP + i * bandH, y1 = y0 + bandH;
    ctx.save();
    ctx.beginPath();
    ctx.rect(CX - BOT_HW - 12, y0, (BOT_HW + 12) * 2, bandH + 1);
    ctx.clip();
    bandPainters[bands[i]](y0, y1);
    ctx.restore();
    // thin black rule between bands
    if (i > 0) {
      ctx.fillStyle = INK;
      ctx.fillRect(CX - BOT_HW - 12, y0 - 2, (BOT_HW + 12) * 2, 4);
    }
  }
  ctx.restore();
  bodyPath();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 6;
  ctx.lineJoin = 'round';
  ctx.stroke();
  // collar V at the neck of the cone
  ctx.beginPath();
  ctx.moveTo(CX - 44, BODY_TOP + 2);
  ctx.lineTo(CX, BODY_TOP + 34);
  ctx.lineTo(CX + 44, BODY_TOP + 2);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 5;
  ctx.stroke();

  // painted Fuji at the base, and its breath of cloud
  drawFuji();
  drawPuff();

  // head last, above the neck line
  drawHead();
  ctx.restore();
}

// ---- resize ----------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame -------------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = CREAM;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the shaped figure keeps its proportions,
  // centred, with the page ground in the piece ground colour
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
