<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1970 Adumbration</title>
<style>
  html, body { margin: 0; padding: 0; background: #070716; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Adumbration, TL3 / PP1217, study #257 theodora-laird.
  // Two fields held at once and never resolved. Below, a slow
  // dark sub field: vast low waves you feel more than see,
  // moving at body speed. Above, a fine bright top field:
  // granular detail, tiny bright events like rain on a surface,
  // fast and intricate. The boundary sits at one third down, so
  // the sub field occupies two thirds and the top field one
  // third. Occasionally a low crest throws a bright pink spray
  // across the boundary and both fields shiver. Drag vertically
  // to lean toward a pole; on release the system pulls back to
  // the held opposition. Resolution is refused. Visual only,
  // no audio.
  var SUB0 = '#070716';   // deepest indigo-black
  var SUB1 = '#0d0d24';
  var SUB2 = '#131330';
  var SUB3 = '#1b1b42';
  var SUB4 = '#232352';   // lightest sub band
  var TOP = '#efede7';    // near-white grain field
  var INK = '#14142a';    // ink, near black indigo
  var PAPER = '#f7f5ef';  // bright grain white
  var PINK = '#ff2e88';   // crossing events, hot pink
  var PINKS = '#ff7ab8';  // pink soft
  var CREAM = '#efe6d0';  // hint pill

  // Fixed-phase first frame: FIRST_T = 8 s. At t = 8 the fields
  // are in held opposition with no crossing event in flight:
  // the first event lands near t = 23.3 and the next near
  // t = 50. The low modes are mid-swell and the grain is at
  // full held density.
  var FIRST_T = 8;
  var SEED = 1970;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and fixed salts, so every frame is a pure
  // function of t and the lean state.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // Lean: +1 is the sub pole (drag down), -1 is the detail pole
  // (drag up), 0 is the held opposition. Drag sets the target;
  // release returns the target to 0 and the lean drifts back.
  var lean = 0, targetLean = 0, dragging = false;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function hexMix(h1, h2, f) {
    var r1 = parseInt(h1.slice(1, 3), 16), g1 = parseInt(h1.slice(3, 5), 16), b1 = parseInt(h1.slice(5, 7), 16);
    var r2 = parseInt(h2.slice(1, 3), 16), g2 = parseInt(h2.slice(3, 5), 16), b2 = parseInt(h2.slice(5, 7), 16);
    var r = Math.round(r1 + (r2 - r1) * f), g = Math.round(g1 + (g2 - g1) * f), b = Math.round(b1 + (b2 - b1) * f);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  var L = {};
  function layout() {
    // Boundary at one third down: top field one third, sub field
    // two thirds, after her frequency map.
    L.boundaryY = H / 3;
    L.subH = H - L.boundaryY;
    L.sideX = Math.max(14, W * 0.045);
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Low field: three large slow modes ----------------------
  // Wavelengths in units of W, frequencies 0.05 to 0.11 Hz,
  // amplitudes as fractions of H. Body speed, well under the
  // 14 Hz ceiling.
  var MODES = [
    { lam: 1.4, f: 0.05, a: 0.055, ph: 0.9 },
    { lam: 0.62, f: 0.08, a: 0.038, ph: 2.4 },
    { lam: 0.34, f: 0.11, a: 0.022, ph: 4.4 }
  ];
  function waveY(x, t, speedF, phaseShift) {
    var y = 0, i;
    for (i = 0; i < MODES.length; i++) {
      var mo = MODES[i];
      y += mo.a * Math.sin(2 * Math.PI * (x / (mo.lam * W)) + 2 * Math.PI * mo.f * t * speedF + mo.ph + phaseShift);
    }
    return y * H;
  }

  // ---- Crossing events ----------------------------------------
  // Crest function: the same three modes summed at a fixed
  // point. When it crosses 0.50 upward, a low crest throws a
  // bright spray across the boundary. Events are precomputed
  // to t = 600 s; each carries a seeded horizontal position.
  function crest(t) {
    return 0.5 * Math.sin(2 * Math.PI * 0.043 * t + 0.7)
         + 0.3 * Math.sin(2 * Math.PI * 0.071 * t + 2.1)
         + 0.2 * Math.sin(2 * Math.PI * 0.113 * t + 4.0);
  }
  var EVENTS = [];
  (function () {
    var rng = mulberry32(SEED * 31 + 7);
    var prev = crest(0), t = 0.02;
    while (t <= 600) {
      var c = crest(t);
      if (prev < 0.50 && c >= 0.50) {
        EVENTS.push({ t: t, fx: 0.15 + 0.7 * rng() });
      }
      prev = c; t += 0.02;
    }
  })();
  function activeEvents(t) {
    var out = [], i;
    for (i = 0; i < EVENTS.length; i++) {
      var age = t - EVENTS[i].t;
      if (age >= 0 && age < 3) { out.push({ idx: i, e: EVENTS[i], age: age }); }
    }
    return out;
  }
  function shiverAt(t) {
    var s = 0, i;
    for (i = 0; i < EVENTS.length; i++) {
      var age = t - EVENTS[i].t;
      if (age >= 0 && age < 3) { s += Math.exp(-age / 0.9); }
    }
    return s;
  }

  // ---- Sub field ----------------------------------------------
  function drawSub(t, subF, speedF, shiver) {
    var by = L.boundaryY, subH = L.subH;
    ctx.fillStyle = SUB0;
    ctx.fillRect(0, by, W, subH);
    // Four wave bands, lightest at the top, darkest at the
    // bottom. Each band is drawn from its own wave line down to
    // the bottom, so the bands stack into depth. Leaning to the
    // sub pole deepens the bands toward SUB0; leaning to the
    // detail pole flattens them toward the mid indigo.
    var bandCols = [SUB4, SUB3, SUB2, SUB1];
    var bandBase = [0.10, 0.30, 0.50, 0.72];
    var deep = lean > 0 ? clamp(0.28 * lean, 0, 0.28) : 0;
    var flat = lean < 0 ? clamp(-0.30 * lean, 0, 0.30) : 0;
    var k, x;
    var step = Math.max(6, Math.round(W / 160));
    for (k = 0; k < 4; k++) {
      var col = bandCols[k];
      if (deep > 0) { col = hexMix(col, SUB0, deep); }
      if (flat > 0) { col = hexMix(col, SUB2, flat); }
      var baseY = by + bandBase[k] * subH;
      var ampF = subF * (1 + k * 0.12) * (1 + 0.15 * shiver);
      var phShift = k * 0.35;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0, baseY + waveY(0, t, speedF, phShift) * ampF);
      for (x = step; x <= W; x += step) {
        ctx.lineTo(x, baseY + waveY(x, t, speedF, phShift) * ampF);
      }
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();
    }
    // A faint crest glow along the topmost band line, so the
    // slow swell reads even where the bands are dark.
    ctx.strokeStyle = hexA(SUB4, a4(0.35 * subF));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, by + bandBase[0] * subH + waveY(0, t, speedF, 0) * subF);
    for (x = step; x <= W; x += step) {
      ctx.lineTo(x, by + bandBase[0] * subH + waveY(x, t, speedF, 0) * subF);
    }
    ctx.stroke();
  }

  // ---- Top field: granular detail -----------------------------
  function drawTop(t, detailF, shiver) {
    var by = L.boundaryY;
    ctx.fillStyle = TOP;
    ctx.fillRect(0, 0, W, by);
    var detailA = clamp(0.55 + 0.45 * detailF, 0.3, 1.1);
    var drawN = Math.floor(320 * clamp(detailF, 0.25, 1.3));
    // Grain: 320 seeded particles, each jittering on its own
    // fast small orbit, 0.7 to 2.8 Hz. Bright white and dark
    // ink specks on the near-white ground. The count and the
    // alpha both follow the detail pole, so the field thins
    // when the sub pole is leaned toward.
    var rng = mulberry32(SEED * 7 + 11);
    var i;
    for (i = 0; i < 320; i++) {
      var px = rng() * W, py = rng() * by;
      var sz = 0.8 + rng() * 1.6;
      var fr = 0.7 + rng() * 2.1;
      var ph = rng() * Math.PI * 2;
      var jx = Math.sin(2 * Math.PI * fr * t + ph) * (1.5 + rng() * 3) * (1 + 0.6 * shiver);
      var jy = Math.cos(2 * Math.PI * fr * 0.83 * t + ph) * (1 + rng() * 2.5) * (1 + 0.6 * shiver);
      var bright = rng() < 0.55;
      var a = (0.18 + rng() * 0.55) * detailA;
      if (i >= drawN || a <= 0.03) { continue; }
      ctx.fillStyle = bright ? hexA(PAPER, a4(a)) : hexA(INK, a4(a));
      ctx.fillRect(px + jx, py + jy, sz, sz);
    }
    // Rain streaks: short vertical falls, seeded, wrapping
    // down the top field at 8 to 20 px per second.
    var rng2 = mulberry32(SEED * 13 + 5);
    ctx.lineWidth = 1;
    for (i = 0; i < 36; i++) {
      var sx = rng2() * W;
      var sy0 = rng2() * by;
      var slen = 6 + rng2() * 12;
      var spd = 8 + rng2() * 12;
      var sa = (0.10 + rng2() * 0.20) * detailA;
      var sy = (sy0 + spd * t) % by;
      if (sa <= 0.03) { continue; }
      ctx.strokeStyle = hexA(INK, a4(sa));
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx, Math.min(by, sy + slen));
      ctx.stroke();
    }
  }

  // ---- Boundary and crossing bursts ---------------------------
  function drawBoundary(t, act) {
    var by = L.boundaryY;
    // Soft glow, then the line itself.
    ctx.strokeStyle = hexA('#8a8aa8', a4(0.12));
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, by);
    ctx.lineTo(W, by);
    ctx.stroke();
    ctx.strokeStyle = hexA('#8a8aa8', a4(0.55));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, by);
    ctx.lineTo(W, by);
    ctx.stroke();
    // Crossing bursts: a pink spray thrown up into the top
    // field, a pink glow below the boundary, and a hot segment
    // on the line itself. Each burst lives 2.5 s.
    var scaleW = W / 800;
    var j;
    for (j = 0; j < act.length; j++) {
      var ev = act[j].e, age = act[j].age;
      if (age >= 2.5) { continue; }
      var p = age / 2.5;
      var ex = ev.fx * W;
      var rng = mulberry32(SEED * 101 + act[j].idx * 7919);
      var d;
      // Glow in the sub field, under the boundary.
      var gr = (20 + p * 60) * scaleW;
      ctx.fillStyle = hexA(PINK, a4((1 - p) * 0.22));
      ctx.beginPath();
      ctx.moveTo(ex + gr, by + 14 * scaleW);
      ctx.arc(ex, by + 14 * scaleW, gr, 0, Math.PI * 2);
      ctx.fill();
      // Spray up into the top field.
      for (d = 0; d < 26; d++) {
        var ang = Math.PI * (1.05 + rng() * 0.9);
        var dist = p * (20 + rng() * 70) * scaleW;
        var dx = ex + Math.cos(ang) * dist;
        var dy = by + Math.sin(ang) * dist;
        var ds = 1.5 + rng() * 1.5;
        ctx.fillStyle = hexA(PINK, a4((1 - p) * 0.95));
        ctx.fillRect(dx, dy, ds, ds);
      }
      // A few pink drops thrown down into the sub field.
      for (d = 0; d < 8; d++) {
        var ang2 = rng() * Math.PI;
        var dist2 = p * (12 + rng() * 40) * scaleW;
        var dx2 = ex + Math.cos(ang2) * dist2;
        var dy2 = by + Math.abs(Math.sin(ang2)) * dist2;
        ctx.fillStyle = hexA(PINKS, a4((1 - p) * 0.7));
        ctx.fillRect(dx2, dy2, 1.5, 1.5);
      }
      // Hot segment on the boundary line.
      ctx.strokeStyle = hexA(PINK, a4((1 - p) * 0.7));
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ex - 40 * scaleW, by);
      ctx.lineTo(ex + 40 * scaleW, by);
      ctx.stroke();
    }
  }

  // ---- Lean gauge, right edge ---------------------------------
  function drawGauge() {
    var gx = W - 16;
    var gy0 = H * 0.22, gy1 = H * 0.78;
    var gmid = (gy0 + gy1) / 2;
    var by = L.boundaryY;
    // Two-tone track: ink over the bright top field, near-white
    // over the dark sub field, so it reads in both.
    ctx.lineWidth = 2;
    ctx.strokeStyle = hexA(INK, a4(0.3));
    ctx.beginPath();
    ctx.moveTo(gx, gy0);
    ctx.lineTo(gx, by);
    ctx.stroke();
    ctx.strokeStyle = hexA(PAPER, a4(0.35));
    ctx.beginPath();
    ctx.moveTo(gx, by);
    ctx.lineTo(gx, gy1);
    ctx.stroke();
    var my = gmid - lean * (gy1 - gy0) / 2;
    ctx.fillStyle = PINK;
    ctx.beginPath();
    ctx.moveTo(gx + 5, my);
    ctx.arc(gx, my, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = '600 9px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(INK, a4(0.6));
    ctx.fillText('DETAIL', gx - 10, gy0 + 3);
    ctx.fillStyle = hexA(PAPER, a4(0.6));
    ctx.fillText('SUB', gx - 10, gy1 + 3);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Coupling: lean rebalances amplitude and speed. Drag down
    // (lean +1) deepens and slows the sub field while the top
    // field thins; drag up (lean -1) sharpens and quickens the
    // detail field while the sub recedes. The middle state is
    // never the point; the poles are.
    var subF = clamp(1 + 0.4 * lean, 0.6, 1.4);
    var speedF = clamp(1 - 0.3 * lean, 0.7, 1.3);
    var detailF = clamp(1 - 0.5 * lean, 0.3, 1.5);
    var shiver = shiverAt(t);
    var act = activeEvents(t);

    // Page ground is the deep indigo-black; the stage is the
    // two fields.
    ctx.fillStyle = SUB0;
    ctx.fillRect(0, 0, W, H);

    drawTop(t, detailF, shiver);
    drawSub(t, subF, speedF, shiver);
    drawBoundary(t, act);
    drawGauge();

    // ---- Vertical side text along the left edge, in the sub
    // field.
    var fsSide = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.save();
    ctx.translate(L.sideX + 2, H * 0.72);
    ctx.rotate(-Math.PI / 2);
    ctx.font = '600 ' + fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = hexA(PAPER, a4(0.5));
    ctx.fillText('A D U M B R A T I O N', 0, 0);
    ctx.font = fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = hexA(PAPER, a4(0.4));
    ctx.fillText('T L 3   ·   P P 1 2 1 7', 0, fsSide + 7);
    ctx.restore();

    // ---- Plates: title top-left over the bright field, number
    // and date below it.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Adumbration', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, a4(0.85));
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1970 · 2007 · 06 · 04', 18, 18 + fsTitle * 0.8 + fsSub + 8);

    // ---- Hint, centered at the bottom, cream pill on the dark
    // sub field.
    var hint = 'Drag to lean toward a pole.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(CREAM, a4(0.92));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(INK, a4(0.35));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // ---- Vertical drag ------------------------------------------
  // Drag down leans toward the sub pole, drag up toward the
  // detail pole. Release returns the target to the held
  // opposition; the lean drifts back instead of snapping.
  // Never click-to-reload: a tap does nothing.
  var dragStartY = 0, dragStartLean = 0;
  function pointerY(ev) {
    if (ev && typeof ev.clientY === 'number') { return ev.clientY; }
    return 0;
  }
  function onDown(ev) {
    dragging = true;
    dragStartY = pointerY(ev);
    dragStartLean = lean;
    if (ev && ev.preventDefault) { ev.preventDefault(); }
  }
  function onMove(ev) {
    if (!dragging) { return; }
    var dy = pointerY(ev) - dragStartY;
    targetLean = clamp(dragStartLean + dy / (H * 0.45), -1, 1);
    if (ev && ev.preventDefault) { ev.preventDefault(); }
  }
  function onUp() {
    dragging = false;
    targetLean = 0;
  }
  try {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1970 exposes the lean and event state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1970 = {
      firstT: FIRST_T,
      lean: function () { return lean; },
      setLean: function (v) { lean = clamp(v, -1, 1); targetLean = lean; dragging = false; },
      crest: function (t) { return crest(t); },
      events: function () { return EVENTS.map(function (e) { return e.t; }); },
      eventCount: function (t) { var n = 0, i; for (i = 0; i < EVENTS.length; i++) { if (EVENTS[i].t <= t) { n++; } } return n; },
      activeEvents: function (t) { return activeEvents(t).length; },
      shiver: function (t) { return shiverAt(t); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the low modes swell at body speed, the grain
  // jitters fast, rain falls, and crossing events throw pink
  // spray across the boundary every so often. All motion is on
  // multi second timescales except the small grain jitter at
  // 0.7 to 2.8 Hz, well under the 14 Hz ceiling. The lean
  // eases toward its target and drifts back to the held
  // opposition on release. Guarded so node-canvas QA (no
  // requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var lastNow = start;
    var loop = function (now) {
      var dt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000));
      lastNow = now;
      var tau = dragging ? 0.35 : 2.5;
      lean += (targetLean - lean) * (1 - Math.exp(-dt / tau));
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
