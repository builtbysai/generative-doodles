<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Loving Processing Must Get Over It</title>
<style>
html, body { margin: 0; padding: 0; background: #0D0B14; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0D0B14';
var WARM = '#F2EDE4';
var AMBER = '#D9A441';
var TEAL = '#2E7D74';
var LOOP = 24;                     // slow drift period, seconds
var RINGS_PER_ORB = 16;            // concentric flat discs per orb
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var seed = 1575;
// The poor-man's stack: six transparent layers, each holding flat circles
// and each blurred by a different radius. Blur is built from concentric
// low-alpha rings, never ctx.filter and never a shader: the stack IS the
// blur. Drag scales every layer's blur radius live.
var layers = [];                   // {blur, orbs:[{x,y,r,color,shadow,phase,phase2,drift}]}
var dragFactor = 1;
var downY = 0, downFactor = 1, dragging = false;
var placedW = 0, placedH = 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
// Orb centers live in the central ~65% of the frame, in unit coordinates;
// sizes are fractions of minDim so the bloom scales with the viewport.
function buildLayers() {
  var rnd = mulberry32(seed);
  var blurs = [0.5, 0.7, 1.0, 1.3, 1.7, 2.2];
  var counts = [3, 3, 2, 2, 2, 2];
  layers = [];
  var li, oi;
  for (li = 0; li < 6; li++) {
    var orbs = [];
    for (oi = 0; oi < counts[li]; oi++) {
      var roll = rnd();
      var color = roll < 0.62 ? WARM : (roll < 0.85 ? AMBER : WARM);
      var shadow = rnd() < 0.45 ? TEAL : AMBER;
      var ang = rnd() * TAU;
      var dist = Math.sqrt(rnd()) * 0.22;
      orbs.push({
        x: 0.5 + Math.cos(ang) * dist,
        y: 0.5 + Math.sin(ang) * dist,
        r: 0.035 + rnd() * 0.055,
        color: color,
        shadow: shadow,
        phase: rnd() * TAU,
        phase2: rnd() * TAU,
        drift: 0.006 + rnd() * 0.010
      });
    }
    layers.push({ blur: blurs[li], orbs: orbs });
  }
  placedW = VW; placedH = VH;
}
// One orb as a soft halo: concentric flat discs, outermost faintest,
// innermost brightest, drawn additively. The spread B is the blur radius
// of this layer times the live drag factor. At rest the halo is wide
// enough that no hard edge survives.
function drawOrb(cx, cy, r, color, B, tint, ox, oy, aMul) {
  var k;
  for (k = 0; k < RINGS_PER_ORB; k++) {
    var f = k / (RINGS_PER_ORB - 1);      // 0 outer, 1 inner
    var rad = r * (1 + B * (1 - f));
    var a = 0.045 * (0.25 + 0.75 * f) * aMul;
    ctx.globalAlpha = Number(a.toFixed(4));
    ctx.fillStyle = tint || color;
    ctx.beginPath();
    ctx.moveTo(cx + ox + rad, cy + oy);
    ctx.arc(cx + ox, cy + oy, rad, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function draw(t) {
  lastT = t;
  size();
  if (layers.length === 0 || placedW !== VW || placedH !== VH) buildLayers();
  var minDim = Math.min(VW, VH);
  var u = minDim / 900;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  // Additive composite: overlapping halos brighten into a cloudy mass.
  ctx.globalCompositeOperation = 'lighter';
  var li, oi;
  for (li = 0; li < layers.length; li++) {
    var layer = layers[li];
    var B = layer.blur * dragFactor;
    for (oi = 0; oi < layer.orbs.length; oi++) {
      var o = layer.orbs[oi];
      // Slow drift on a Lissajous pair, whole cycles of the loop.
      var dx = Math.sin(TAU * t / LOOP + o.phase) * o.drift * minDim;
      var dy = Math.cos(TAU * t / LOOP * 0.75 + o.phase2) * o.drift * minDim;
      var cx = o.x * VW + dx;
      var cy = o.y * VH + dy;
      var r = o.r * minDim;
      // Colored shadow: the same stack tinted, offset a few px, underneath,
      // at half strength so it reads as a faint colored edge, not a wash.
      drawOrb(cx, cy, r, o.color, B, o.shadow, 4 * u, 3 * u, 0.5);
      drawOrb(cx, cy, r, o.color, B, null, 0, 0, 1);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  // Caption: title, formula date, drag cue. Warm-white chip, near-black text.
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'My Loving Processing Must Get Over It  ·  2006 · 05 · 05  ·  Drag up to blur, down to sharpen.';
  ctx.font = fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  var pad = Math.round(fs * 0.7);
  var bx = Math.round(fs * 0.8), by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  ctx.fillStyle = WARM;
  ctx.fillRect(bx - pad, by, Math.ceil(tw) + 2 * pad, fs + 2 * pad);
  ctx.fillStyle = GROUND;
  ctx.textBaseline = 'top';
  ctx.fillText(label, bx, by + pad);
  if (typeof window !== 'undefined') {
    var total = 0;
    for (var q = 0; q < layers.length; q++) total += layers[q].orbs.length;
    window.__p1575 = {
      t: t, seed: seed, layers: layers.length, orbs: total,
      dragFactor: dragFactor, phone: isPhone()
    };
  }
}
function clampFactor(v) {
  if (v < 0.3) return 0.3;
  if (v > 3.5) return 3.5;
  return v;
}
function onDown(e) {
  dragging = true;
  downY = e.clientY;
  downFactor = dragFactor;
}
function onMove(e) {
  if (!dragging) return;
  // Drag up: defocus into fog. Drag down: sharpen toward flat circles.
  dragFactor = clampFactor(downFactor + (downY - e.clientY) / 220);
  draw(lastT);
}
function onUp() { dragging = false; }
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof document !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
