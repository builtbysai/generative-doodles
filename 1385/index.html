<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Recruitment Station</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #141210; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- seeded PRNG (mulberry32), never Math.random ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var SEED = 1385000;
  function hash2(a, b) {
    var h = (a * 374761393 + b * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (((h ^ (h >>> 16)) >>> 0) / 4294967296);
  }

  // ---- palette ----
  var RED = '#b01e24';
  var RED_DARK = '#7a1418';
  var NYLON = '#e4dfd2';
  var GLOW = '#3fa7d6';
  var TABLE = '#6b6b66';
  var TABLE_DARK = '#4c4c48';
  var GROUND = '#141210';
  var SCREEN = '#0e2733';

  // ---- viewport / sizing ----
  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.round(w); H = Math.round(h);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    if (typeof document !== 'undefined' && document.body) {
      document.body.style.background = GROUND;
    }
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : W;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : H;
    var minDim = Math.min(sw, sh);
    phone = minDim < 700 || H > W * 1.15;
  }
  size();
  var clockT = 0;
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(clockT); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { size(); draw(clockT); });
    }
  }

  // ---- pseudo-script glyphs (drawn shapes only, never text) ----
  function glyph(gkind, x, y, s, color, lw) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = lw || Math.max(1, s * 0.12);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    if (gkind === 0) { // chevron
      ctx.moveTo(x - s * 0.5, y - s * 0.4); ctx.lineTo(x, y + s * 0.4); ctx.lineTo(x + s * 0.5, y - s * 0.4);
    } else if (gkind === 1) { // triangle outline
      ctx.moveTo(x, y - s * 0.5); ctx.lineTo(x + s * 0.5, y + s * 0.4); ctx.lineTo(x - s * 0.5, y + s * 0.4); ctx.closePath();
    } else if (gkind === 2) { // cross
      ctx.moveTo(x - s * 0.5, y); ctx.lineTo(x + s * 0.5, y);
      ctx.moveTo(x, y - s * 0.5); ctx.lineTo(x, y + s * 0.5);
    } else if (gkind === 3) { // arc + dot
      ctx.arc(x, y, s * 0.45, Math.PI * 0.9, Math.PI * 2.1);
      ctx.moveTo(x + s * 0.7, y + s * 0.7); ctx.arc(x + s * 0.7, y + s * 0.7, s * 0.12, 0, Math.PI * 2);
    } else if (gkind === 4) { // zigzag
      ctx.moveTo(x - s * 0.5, y + s * 0.3); ctx.lineTo(x - s * 0.17, y - s * 0.3);
      ctx.lineTo(x + s * 0.17, y + s * 0.3); ctx.lineTo(x + s * 0.5, y - s * 0.3);
    } else if (gkind === 5) { // hook
      ctx.moveTo(x - s * 0.4, y - s * 0.5); ctx.lineTo(x - s * 0.4, y + s * 0.2);
      ctx.arc(x, y + s * 0.2, s * 0.4, Math.PI, Math.PI * 2, true);
    } else if (gkind === 6) { // bar + dot pair
      ctx.moveTo(x - s * 0.5, y); ctx.lineTo(x + s * 0.5, y);
      ctx.moveTo(x - s * 0.2, y - s * 0.6); ctx.arc(x - s * 0.2, y - s * 0.6, s * 0.11, 0, Math.PI * 2);
      ctx.moveTo(x + s * 0.2, y - s * 0.6); ctx.arc(x + s * 0.2, y - s * 0.6, s * 0.11, 0, Math.PI * 2);
    } else { // loop with tail
      ctx.arc(x, y - s * 0.1, s * 0.35, 0, Math.PI * 2);
      ctx.moveTo(x + s * 0.35, y + s * 0.2); ctx.lineTo(x + s * 0.6, y + s * 0.6);
    }
    ctx.stroke();
  }
  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- shared seeded glyph streams ----
  function streamKind(stream, i) {
    return Math.floor(hash2(SEED + stream * 977, i) * 8);
  }

  // ---- drag smear state (recorded samples only) ----
  var smears = []; // {x, y, dx, t}
  var dragging = false, lastX = 0, lastY = 0;
  function smearOffset(gx, gy, t) {
    var ox = 0, oy = 0;
    var sig = Math.max(30, W * 0.08);
    for (var i = 0; i < smears.length; i++) {
      var sm = smears[i];
      var age = t - sm.t;
      if (age < 0 || age > 6) continue;
      var dx = gx - sm.x, dy = gy - sm.y;
      var wgt = Math.exp(-(dx * dx + dy * dy) / (2 * sig * sig)) * Math.exp(-age / 3);
      ox += sm.dx * wgt * 0.9;
      oy += sm.dy * wgt * 0.25;
    }
    var cap = Math.max(12, W * 0.05);
    if (ox > cap) ox = cap; if (ox < -cap) ox = -cap;
    if (oy > cap * 0.4) oy = cap * 0.4; if (oy < -cap * 0.4) oy = -cap * 0.4;
    return { x: ox, y: oy };
  }
  function onDown(e) {
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
  }
  function onMove(e) {
    if (!dragging) return;
    var x = e.clientX, y = e.clientY;
    var winTop = 0, winBot = H * 0.28;
    if (y >= winTop && y <= winBot) {
      smears.push({ x: x, y: y, dx: x - lastX, dy: y - lastY, t: clockT });
      if (smears.length > 400) smears.splice(0, smears.length - 400);
    }
    lastX = x; lastY = y;
  }
  function onUp() { dragging = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---- layout (fractions of W/H, same composition at all sizes) ----
  function layout() {
    var winH = H * 0.28;
    var tableTop = H * 0.66, tableBot = H * 0.84;
    var monH = H * 0.15, monY = tableTop - monH - H * 0.015;
    var monW = Math.min(W * 0.17, 230);
    var gap = W * 0.03;
    var totalW = monW * 4 + gap * 3;
    var monX0 = (W - totalW) / 2;
    return { winH: winH, tableTop: tableTop, tableBot: tableBot, monH: monH, monY: monY, monW: monW, gap: gap, monX0: monX0 };
  }

  function draw(t) {
    clockT = t;
    var L = layout();
    // ground
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // ---- red-tinted window, top band ----
    ctx.fillStyle = RED;
    ctx.fillRect(0, 0, W, L.winH);
    ctx.fillStyle = 'rgba(20, 8, 8, 0.35)';
    ctx.fillRect(0, 0, W, L.winH);
    // window frame + mullions
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, L.winH - Math.max(4, H * 0.008), W, Math.max(4, H * 0.008));
    for (var mx = 1; mx < 4; mx++) {
      ctx.fillRect((W / 4) * mx - 2, 0, 4, L.winH);
    }
    // vinyl slogan glyphs (off-white), smeared by recorded drags
    var sloganN = phone ? 5 : 7;
    var sSize = Math.min(W * 0.055, L.winH * 0.42);
    var sGap = W * 0.11;
    var sX0 = W / 2 - (sGap * (sloganN - 1)) / 2;
    var sY = L.winH * 0.52;
    for (var gi = 0; gi < sloganN; gi++) {
      var gx = sX0 + gi * sGap;
      var off = smearOffset(gx, sY, t);
      glyph(streamKind(11, gi), gx + off.x, sY + off.y, sSize, NYLON, Math.max(2, sSize * 0.14));
    }
    // faint second slogan row, smaller, for depth
    ctx.globalAlpha = 0.35;
    for (var gi2 = 0; gi2 < sloganN; gi2++) {
      var gx2 = sX0 + gi2 * sGap + sGap * 0.5;
      if (gx2 > W - sGap * 0.5) continue;
      var off2 = smearOffset(gx2, sY + sSize * 1.1, t);
      glyph(streamKind(23, gi2), gx2 + off2.x, sY + sSize * 1.1 + off2.y, sSize * 0.55, NYLON, Math.max(1, sSize * 0.08));
    }
    ctx.globalAlpha = 1;

    // ---- banner side walls with slow ripple + nylon weave ----
    var wallTop = L.winH, wallBot = L.tableTop;
    var wallW = W * 0.15;
    function bannerWall(x0, flip) {
      ctx.fillStyle = RED_DARK;
      ctx.beginPath();
      ctx.moveTo(x0, wallTop);
      ctx.lineTo(x0 + (flip ? -wallW : wallW), wallTop);
      var steps = 24;
      for (var s = 0; s <= steps; s++) {
        var yy = wallTop + (wallBot - wallTop) * (s / steps);
        var wave = Math.sin(yy * 0.05 + t * 0.8 + (flip ? 2 : 0)) * Math.max(2, H * 0.006);
        var xx = x0 + (flip ? -wallW : wallW) + (flip ? -wave : wave);
        ctx.lineTo(xx, yy);
      }
      ctx.lineTo(x0, wallBot);
      ctx.closePath();
      ctx.fill();
      // weave: seeded dots
      var step = Math.max(10, W * 0.012);
      for (var wy = wallTop + step / 2; wy < wallBot; wy += step) {
        for (var wx = Math.min(x0, x0 + (flip ? -wallW : wallW)) + step / 2; wx < Math.max(x0, x0 + (flip ? -wallW : wallW)); wx += step) {
          if (hash2(SEED + 41, Math.floor(wx) * 7 + Math.floor(wy) * 13) < 0.5) {
            dot(wx, wy, Math.max(1, step * 0.08), 'rgba(228, 223, 210, 0.10)');
          }
        }
      }
    }
    bannerWall(0, false);
    bannerWall(W, true);

    // center mid-zone: faint vertical seams on near-black
    ctx.fillStyle = 'rgba(228, 223, 210, 0.05)';
    ctx.fillRect(W * 0.30, wallTop, 1, wallBot - wallTop);
    ctx.fillRect(W * 0.70, wallTop, 1, wallBot - wallTop);

    // ---- monitors in a row, on the table ----
    for (var m = 0; m < 4; m++) {
      var mx0 = L.monX0 + m * (L.monW + L.gap);
      // frame
      ctx.fillStyle = GROUND;
      ctx.fillRect(mx0 - 3, L.monY - 3, L.monW + 6, L.monH + 6);
      ctx.fillStyle = SCREEN;
      ctx.fillRect(mx0, L.monY, L.monW, L.monH);
      // flicker dropout, seeded on quantized time
      var q = Math.floor(t / 0.12);
      var dim = hash2(SEED + 500 + m * 31, q) < 0.08;
      ctx.save();
      ctx.beginPath();
      ctx.rect(mx0, L.monY, L.monW, L.monH);
      ctx.clip();
      // 3 rows of scrolling pseudo-script glyphs from the shared stream
      var rows = 3;
      for (var r = 0; r < rows; r++) {
        var rY = L.monY + L.monH * (0.24 + r * 0.28);
        var speed = (10 + m * 3 + r * 5) * (r % 2 === 0 ? 1 : -1);
        var cellW = L.monW / 8;
        var off = ((t * speed) % (cellW * 8) + cellW * 8) % (cellW * 8);
        for (var ci = -1; ci < 9; ci++) {
          var idx = Math.floor(hash2(SEED + 900 + m * 53 + r * 17, ci) * 1000) % 64;
          var cx = mx0 + ci * cellW - off + cellW / 2;
          if (cx < mx0 - cellW || cx > mx0 + L.monW + cellW) continue;
          glyph(streamKind(70 + m * 7 + r, idx), cx, rY, Math.min(cellW * 0.7, L.monH * 0.20), GLOW, Math.max(1, cellW * 0.08));
        }
      }
      // manifesto frame flash: every 4 s a band sweeps the screen
      var cycle = t % 4;
      if (cycle < 0.4) {
        ctx.fillStyle = 'rgba(63, 167, 214, 0.18)';
        ctx.fillRect(mx0, L.monY + (cycle / 0.4) * L.monH - 4, L.monW, 8);
      }
      ctx.restore();
      if (dim) {
        ctx.fillStyle = 'rgba(14, 39, 51, 0.55)';
        ctx.fillRect(mx0, L.monY, L.monW, L.monH);
      }
      // stand
      ctx.fillStyle = TABLE_DARK;
      ctx.fillRect(mx0 + L.monW / 2 - 2, L.monY + L.monH, 4, H * 0.015);
    }

    // ---- folding table ----
    ctx.fillStyle = TABLE;
    ctx.fillRect(0, L.tableTop, W, L.tableBot - L.tableTop);
    ctx.fillStyle = TABLE_DARK;
    ctx.fillRect(0, L.tableTop, W, Math.max(3, H * 0.006));
    // pamphlets: off-white rects with tiny glyph lines
    var pamN = phone ? 4 : 6;
    for (var p = 0; p < pamN; p++) {
      var pr = mulberry32(SEED + 3000 + p * 7919);
      var pw = W * 0.09, ph = (L.tableBot - L.tableTop) * 0.55;
      var px = W * 0.06 + p * ((W * 0.88 - pw) / Math.max(1, pamN - 1));
      var py = L.tableTop + (L.tableBot - L.tableTop) * 0.22 + (pr() - 0.5) * H * 0.02;
      ctx.save();
      ctx.translate(px + pw / 2, py + ph / 2);
      ctx.rotate((pr() - 0.5) * 0.3);
      ctx.fillStyle = NYLON;
      ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
      ctx.fillStyle = RED;
      ctx.fillRect(-pw / 2, -ph / 2, pw, ph * 0.18);
      ctx.restore();
      for (var li = 0; li < 3; li++) {
        glyph(streamKind(120 + p, li), px + pw * (0.25 + li * 0.25), py + ph * (0.45 + li * 0.18), Math.min(pw * 0.18, ph * 0.22), TABLE_DARK, 1);
      }
    }

    // ---- blinking bottom strip (visual only, never a button) ----
    var stripY = H * 0.90, stripH = Math.max(14, H * 0.045);
    ctx.fillStyle = RED;
    ctx.fillRect(0, stripY, W, stripH);
    var blinkOn = Math.floor(t * 1.4) % 2 === 0;
    ctx.globalAlpha = blinkOn ? 1 : 0.25;
    var stripN = Math.floor(W / (W * 0.055));
    for (var si = 0; si < stripN; si++) {
      var sx = (W / stripN) * (si + 0.5);
      glyph(streamKind(200, si), sx, stripY + stripH / 2, stripH * 0.42, NYLON, Math.max(1, stripH * 0.08));
    }
    ctx.globalAlpha = 1;
  }

  // ---- boot: frame one = draw(0), clock starts with the rAF loop ----
  draw(0);
  var startTs = null;
  function loop(ts) {
    if (startTs === null) startTs = ts;
    clockT = (ts - startTs) / 1000;
    draw(clockT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
