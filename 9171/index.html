<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Line, Four Backs — №9171</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #241f1b;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
  }
  #stage {
    position: relative;
    display: block;
    cursor: pointer;
  }
  #caption {
    margin-top: 18px;
    text-align: center;
    color: #8a7f74;
    user-select: none;
  }
  #caption .t {
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #b3a89c;
  }
  #caption .s {
    margin-top: 5px;
    font-size: 12px;
    font-style: italic;
    letter-spacing: 0.04em;
    color: #6f655b;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="caption">
  <div class="t">One line, four backs</div>
  <div class="s">after Santiago Sierra, Salamanca, 2000 &mdash; tap to reseed</div>
</div>
<script>
(function () {
  "use strict";

  // Driver: one line, tattooed in segments across four separate backs.
  // It reads as a single line only while the four bodies hold the same
  // line. Each body breathes on its own slow cycle, so the segments
  // drift out of alignment and the line breaks, then restores.
  //
  // The line is permanent: it is drawn in full from the first frame.
  // Tap reseeds the arrangement (widths, gaps, tones, line height,
  // breathing phases). Nothing else moves.

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");

  var GROUND_TOP = "#2b2420";
  var GROUND_BOT = "#1e1916";
  var LINE_COLOR = "#120e0c";
  var TONES = ["#c9a184", "#b98d6e", "#d4af8f", "#a87a5a", "#c39a7c", "#bd9574"];

  var W = 0, H = 0, DPR = 1;
  var seed = 0;
  var bodies = [];   // {x, w, h, tone, lineFrac, amp, period, phase}
  var lineBaseY = 0; // shared baseline y of the line at rest (canvas px)
  var clockT = 0;    // seconds, advanced by rAF; settable for tests
  var lastNow = null;
  var frozen = false;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    // Canvas: landscape frame, fitted to the viewport with margins.
    var maxW = Math.min(vw - 32, 920);
    var maxH = vh - 120;
    var w = maxW, h = Math.round(w * 0.72);
    if (h > maxH) { h = maxH; w = Math.round(h / 0.72); }
    W = w; H = h;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build(seed);
  }

  function build(s) {
    seed = s;
    var rnd = mulberry32(seed);
    bodies = [];
    var n = 4;
    var formH = H * 0.50;
    var formTop = H * 0.22;
    // Total row width ~84% of canvas; widths and gaps seeded.
    var rowW = W * 0.84;
    var rowX = (W - rowW) / 2;
    var gapMin = Math.max(6, W * 0.008), gapMax = Math.max(14, W * 0.03);
    var gaps = [];
    var gapSum = 0;
    for (var g = 0; g < n - 1; g++) {
      var gp = gapMin + rnd() * (gapMax - gapMin);
      gaps.push(gp); gapSum += gp;
    }
    var wBase = (rowW - gapSum) / n;
    var tones = TONES.slice();
    // Shuffle tones deterministically.
    for (var i = tones.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = tones[i]; tones[i] = tones[j]; tones[j] = tmp;
    }
    // One shared line height: the line is one gesture at one height.
    var lineFrac = 0.30 + rnd() * 0.08;
    lineBaseY = formTop + formH * lineFrac;
    var x = rowX;
    for (var b = 0; b < n; b++) {
      var w = wBase * (0.88 + rnd() * 0.24);
      bodies.push({
        x: x, w: w, h: formH, top: formTop,
        tone: tones[b],
        amp: 4 + rnd() * 3,            // px of vertical drift
        period: 6 + rnd() * 3.5,       // seconds per breath
        phase: rnd() * Math.PI * 2
      });
      x += w + (b < n - 1 ? gaps[b] : 0);
    }
    draw();
  }

  // Vertical offset of a body at time t. Zero for every body at t = 0,
  // so the four segments are exactly aligned at rest.
  function offsetAt(b, t) {
    return b.amp * (Math.sin(2 * Math.PI * t / b.period + b.phase) - Math.sin(b.phase));
  }

  // Back silhouette, seen from behind: a near-flat shoulder line with
  // a shallow neck dip at centre top, sides tapering to the waist,
  // bottom cropped.
  function backPath(x, y, w, h) {
    ctx.beginPath();
    ctx.moveTo(x + w * 0.02, y + h * 0.12);
    ctx.bezierCurveTo(x + w * 0.02, y + h * 0.03, x + w * 0.08, y + h * 0.012, x + w * 0.18, y + h * 0.010);
    ctx.bezierCurveTo(x + w * 0.30, y + h * 0.008, x + w * 0.42, y + h * 0.010, x + w * 0.50, y + h * 0.026);
    ctx.bezierCurveTo(x + w * 0.58, y + h * 0.010, x + w * 0.70, y + h * 0.008, x + w * 0.82, y + h * 0.010);
    ctx.bezierCurveTo(x + w * 0.92, y + h * 0.012, x + w * 0.98, y + h * 0.03, x + w * 0.98, y + h * 0.12);
    ctx.bezierCurveTo(x + w * 0.98, y + h * 0.45, x + w * 0.93, y + h * 0.75, x + w * 0.91, y + h);
    ctx.lineTo(x + w * 0.09, y + h);
    ctx.bezierCurveTo(x + w * 0.07, y + h * 0.75, x + w * 0.02, y + h * 0.45, x + w * 0.02, y + h * 0.12);
    ctx.closePath();
  }

  function draw() {
    // Ground.
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, GROUND_TOP);
    grad.addColorStop(1, GROUND_BOT);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Soft floor shadow under the row.
    var shadowY = bodies.length ? bodies[0].top + bodies[0].h + 10 : H * 0.85;
    var sg = ctx.createRadialGradient(W / 2, shadowY, 10, W / 2, shadowY, W * 0.42);
    sg.addColorStop(0, "rgba(0,0,0,0.35)");
    sg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = sg;
    ctx.fillRect(W * 0.05, shadowY - 14, W * 0.9, 30);

    for (var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      var oy = offsetAt(b, clockT);
      var y = b.top + oy;

      // Skin with a faint vertical falloff for form.
      backPath(b.x, y, b.w, b.h);
      var bg = ctx.createLinearGradient(0, y, 0, y + b.h);
      bg.addColorStop(0, lighten(b.tone, 0.10));
      bg.addColorStop(0.55, b.tone);
      bg.addColorStop(1, lighten(b.tone, -0.10));
      ctx.fillStyle = bg;
      ctx.fill();

      // The line segment, tattooed on this back: it moves with the body.
      ctx.save();
      backPath(b.x, y, b.w, b.h);
      ctx.clip();
      ctx.fillStyle = LINE_COLOR;
      var ly = lineBaseY + oy;
      ctx.fillRect(b.x, ly - 1.25, b.w, 2.5);
      ctx.restore();
    }
  }

  function lighten(hex, amt) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, bl = n & 255;
    function f(v) {
      if (amt >= 0) return Math.round(v + (255 - v) * amt);
      return Math.round(v * (1 + amt));
    }
    return "rgb(" + f(r) + "," + f(g) + "," + f(bl) + ")";
  }

  function frame(now) {
    if (lastNow === null) lastNow = now;
    var dt = (now - lastNow) / 1000;
    lastNow = now;
    if (!frozen) {
      clockT += Math.min(dt, 0.1);
      draw();
    }
    requestAnimationFrame(frame);
  }

  function reseed() {
    clockT = 0;
    build((Math.random() * 1e9) | 0);
  }

  canvas.addEventListener("click", reseed);
  canvas.addEventListener("touchend", function (e) { e.preventDefault(); reseed(); }, { passive: false });
  window.addEventListener("resize", layout);

  // Test hooks.
  window.__piece = {
    bodies: function () {
      return bodies.map(function (b) {
        return {
          x: b.x, w: b.w, h: b.h, top: b.top,
          amp: b.amp, period: b.period, phase: b.phase,
          segmentY: lineBaseY + offsetAt(b, clockT)
        };
      });
    },
    spreadAt: function (t) {
      var ys = bodies.map(function (b) { return lineBaseY + offsetAt(b, t); });
      return Math.max.apply(null, ys) - Math.min.apply(null, ys);
    },
    setTime: function (t) { clockT = t; frozen = true; draw(); },
    resume: function () { frozen = false; lastNow = null; },
    reseed: reseed,
    seed: function () { return seed; },
    size: function () { return { w: W, h: H }; }
  };

  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
