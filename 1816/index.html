<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Unfretted String</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0B0D; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var FRAME_T = 30.0; /* fixed phase: t = 30 s, node 1/3 held, two pale blue rings alive */
var CYCLE = 60.0; /* node cycle: 20 s per node, 1/2 then 1/3 then 1/4, then repeat */
var DWELL = 20.0;
var SLIDE = 3.0; /* seconds at the end of each dwell spent sliding to the next node */
var RING_BLOOM = 4.0; /* seconds between ring births */
var RING_LIFE = 9.0; /* seconds a ring lives */
var STROKE_PERIOD = 4.0; /* seconds per full bow stroke (down then up) */
var ROOM = '#0B0B0D'; /* deep black room, also the page ground */
var WIRE = '#B9BDC4'; /* bare steel grey */
var ANCHOR = '#3A3D42';
var ANCHOR_EDGE = '#6A6E75';
var BOW_WOOD = '#8A5A33'; /* warm bow-wood brown */
var BOW_DARK = '#5C3A1E';
var FROG = '#2E2118';
var HAIR = '#D8CDB8';
var GLOW = '#E8C86A';
var PLATE_FILL = '#101014';
var PLATE_LINE = 'rgba(185,189,196,0.28)';
var PLATE_INK = '#E8E6E0';
/* ---- just-intonation overtone table ----
   Harmonic n, ratio n/1, nodal fraction 1/n, max ring radius as a
   fraction of field width, ring hue. The node cycle uses n = 2, 3, 4;
   the full table is the lookup every ring is drawn from. */
var HARMONICS = {
  1: { ratio: '1/1', radius: 0.34, hue: '#D9A441' }, /* brassy gold */
  2: { ratio: '2/1', radius: 0.28, hue: '#E3C078' }, /* gold-pale */
  3: { ratio: '3/1', radius: 0.22, hue: '#A9C6DE' }, /* pale blue */
  4: { ratio: '4/1', radius: 0.17, hue: '#B87333' }, /* copper */
  5: { ratio: '5/1', radius: 0.13, hue: '#D99A6C' }, /* pale copper */
  6: { ratio: '6/1', radius: 0.10, hue: '#7FA3C4' }  /* steel blue */
};
var NODES = [2, 3, 4]; /* nodal fractions 1/2, 1/3, 1/4 in a fixed cycle */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth01(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* Wire geometry: the wire spans 0.06 to 0.94 of the field width at
   0.52 of the field height. It never shortens and never moves. */
function wireX0() { return F.x + 0.06 * F.w; }
function wireX1() { return F.x + 0.94 * F.w; }
function wireLen() { return wireX1() - wireX0(); }
function wireY() { return F.y + 0.52 * F.h; }
/* Node cycle: dwell d holds node NODES[d] for DWELL - SLIDE seconds,
   then slides to the next node over SLIDE seconds with a smoothstep.
   Returns the nodal fraction 1/n at time t. */
function nodeFrac(t) {
  var ph = ((t % CYCLE) + CYCLE) % CYCLE;
  var d = Math.floor(ph / DWELL);
  var within = ph - d * DWELL;
  var cur = NODES[d % 3];
  var nxt = NODES[(d + 1) % 3];
  var f0 = 1 / cur, f1 = 1 / nxt;
  if (within < DWELL - SLIDE) return f0;
  return f0 + (f1 - f0) * smooth01((within - (DWELL - SLIDE)) / SLIDE);
}
/* Harmonic sounding at time t: the node of the dwell containing t. */
function nodeAt(t) {
  var ph = ((t % CYCLE) + CYCLE) % CYCLE;
  return NODES[Math.floor(ph / DWELL) % 3];
}
function contactX(t) { return wireX0() + nodeFrac(t) * wireLen(); }
function drawWire(t) {
  var wy = wireY();
  var x0 = wireX0(), x1 = wireX1();
  var vibAmp = 0.002 * F.h; /* faint standing shimmer, zero at the anchors */
  ctx.strokeStyle = WIRE;
  ctx.lineWidth = Math.max(1.2, F.w * 0.0022);
  ctx.beginPath();
  var x;
  for (x = x0; x <= x1; x += 6) {
    var u = (x - x0) / wireLen();
    var yy = wy + vibAmp * Math.sin(Math.PI * u) * Math.sin(TAU * u * 3 + TAU * t / 2);
    if (x === x0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
  }
  ctx.stroke();
  /* anchors: small dark steel blocks pinning both ends */
  var aw = Math.max(6, F.w * 0.012), ah = Math.max(10, F.h * 0.02);
  ctx.fillStyle = ANCHOR;
  ctx.fillRect(x0 - aw / 2, wy - ah / 2, aw, ah);
  ctx.fillRect(x1 - aw / 2, wy - ah / 2, aw, ah);
  ctx.strokeStyle = ANCHOR_EDGE;
  ctx.lineWidth = 1;
  ctx.strokeRect(x0 - aw / 2 + 0.5, wy - ah / 2 + 0.5, aw - 1, ah - 1);
  ctx.strokeRect(x1 - aw / 2 + 0.5, wy - ah / 2 + 0.5, aw - 1, ah - 1);
}
function drawBow(t) {
  var wy = wireY();
  var cx = contactX(t);
  /* bow axis: 15 degrees off vertical, tip leaning left, butt down right */
  var ux = -Math.sin(Math.PI / 12), uy = -Math.cos(Math.PI / 12);
  var vx = -uy, vy = ux; /* perpendicular, pointing right and slightly up */
  var L = 0.55 * F.h;
  var s = 0.045 * F.h * Math.sin(TAU * t / STROKE_PERIOD); /* rhythmic stroke */
  var bx = cx + s * ux, by = wy + s * uy; /* stroke shifts the whole bow along its axis */
  var hOff = 0.012 * F.h; /* hair to stick gap */
  var tipX = bx + 0.38 * L * ux, tipY = by + 0.38 * L * uy;
  var buttX = bx - 0.62 * L * ux, buttY = by - 0.62 * L * uy;
  /* hair: pale line through the contact point, crossing the wire */
  ctx.strokeStyle = HAIR;
  ctx.lineWidth = Math.max(1, F.w * 0.0016);
  ctx.beginPath();
  ctx.moveTo(buttX, buttY);
  ctx.lineTo(tipX, tipY);
  ctx.stroke();
  /* stick: warm bow wood, offset to the right of the hair */
  var sx0 = buttX + vx * hOff, sy0 = buttY + vy * hOff;
  var sx1 = tipX + vx * hOff, sy1 = tipY + vy * hOff;
  ctx.strokeStyle = BOW_WOOD;
  ctx.lineWidth = Math.max(3, F.w * 0.005);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sx0, sy0);
  ctx.lineTo(sx1, sy1);
  ctx.stroke();
  ctx.lineCap = 'butt';
  /* frog: small dark block at the butt end of the stick */
  var fw = Math.max(5, F.w * 0.008), fl = Math.max(14, F.h * 0.022);
  var fcx = sx0 + ux * fl * 0.5, fcy = sy0 + uy * fl * 0.5;
  ctx.save();
  ctx.translate(fcx, fcy);
  ctx.rotate(Math.atan2(uy, ux));
  ctx.fillStyle = FROG;
  ctx.fillRect(-fl / 2, -fw / 2, fl, fw);
  ctx.restore();
  /* tip cap: tiny pale cap at the top end of the stick */
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.arc(sx1, sy1, Math.max(2, F.w * 0.0022), 0, TAU);
  ctx.fill();
  /* contact glow where the hair meets the wire */
  ctx.fillStyle = rgba(GLOW, 0.45);
  ctx.beginPath();
  ctx.arc(cx, wy, Math.max(4, F.w * 0.008), 0, TAU);
  ctx.fill();
  ctx.fillStyle = rgba('#FFF6DC', 0.9);
  ctx.beginPath();
  ctx.arc(cx, wy, Math.max(1.5, F.w * 0.002), 0, TAU);
  ctx.fill();
}
function drawRings(t) {
  var wy = wireY();
  var k0 = Math.floor((t - RING_LIFE) / RING_BLOOM) + 1;
  var k1 = Math.floor(t / RING_BLOOM);
  var k;
  for (k = k0; k <= k1; k++) {
    var b = k * RING_BLOOM; /* birth time */
    var age = t - b;
    if (age < 0 || age >= RING_LIFE) continue;
    var frac = age / RING_LIFE;
    var n = nodeAt(b); /* harmonic sounding when this ring was born */
    var h = HARMONICS[n];
    var bx = wireX0() + (1 / n) * wireLen(); /* contact point at birth */
    var maxR = h.radius * F.w;
    var rad = maxR * Math.pow(frac, 0.75);
    var cy = wy - 0.12 * F.h * frac; /* rings rise as they expand */
    var al = 0.55 * (1 - frac) * Math.min(1, age / 0.6);
    if (rad < 1 || al <= 0.01) continue;
    ctx.strokeStyle = rgba(h.hue, al);
    ctx.lineWidth = Math.max(1, F.w * 0.002);
    ctx.beginPath();
    ctx.ellipse(bx, cy, rad, rad, 0, 0, TAU);
    ctx.stroke();
    /* fainter inner echo trailing the main ring */
    var rad2 = rad * 0.72;
    if (rad2 >= 1) {
      ctx.strokeStyle = rgba(h.hue, al * 0.35);
      ctx.beginPath();
      ctx.ellipse(bx, cy, rad2, rad2, 0, 0, TAU);
      ctx.stroke();
    }
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Unfretted String').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Unfretted String').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 01').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Unfretted String', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2007 · 01 · 01', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, VW, VH);
  drawWire(phaseT);
  drawRings(phaseT);
  drawBow(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    nodeAt: nodeAt,
    nodeFrac: nodeFrac,
    contactX: contactX,
    ringsAt: function (t) {
      var out = [], k;
      var k0 = Math.floor((t - RING_LIFE) / RING_BLOOM) + 1;
      var k1 = Math.floor(t / RING_BLOOM);
      for (k = k0; k <= k1; k++) {
        var b = k * RING_BLOOM;
        var age = t - b;
        if (age >= 0 && age < RING_LIFE) out.push({ birth: b, age: age, harmonic: nodeAt(b) });
      }
      return out;
    }
  };
}
/* ---- frame one: fixed phase t = 30 s ----
   No wall clock is read for frame one. Input does nothing by design:
   no pointer or keyboard handlers are registered, so nothing the
   viewer does shortens, frets, or retunes anything. The fundamental
   never moves: the wire is drawn at the same place at every t. */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  /* True time: phase is computed from a wall-clock start captured after
     the fixed first frame, so dropped frames never lose time. */
  var startMs = Date.now();
  (function loop() {
    function step() {
      phaseT = FRAME_T + (Date.now() - startMs) / 1000;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
