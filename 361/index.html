<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.361 Goldline Poppies</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E1216; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.361 Goldline Poppies (jmarie.creates).
// After Julianne Haness's best seller "Dramatic Deco
// Poppies" (golden colorway): oversized flat poppy
// heads at wallpaper scale, deep teal petals with
// every edge traced in a thin flat gold contour, on a
// near-black ground. The flowers ARE the field: a
// half-drop repeat of heads a third of the frame wide,
// stems barely visible in the gaps. Watch-only slow
// bloom pulse: each head opens and closes by a few
// degrees on whole cycles inside one 24s loop, phases
// offset per head from its lattice position, so frame
// 24s is pixel-identical to frame 0. Drag pans the
// oversized repeat (clamped, position persists).
// Double-tap flips between exactly two authored
// colourways: teal petals with gold contours, and the
// golden inversion, gold petals with teal contours,
// same ground. The gold is a flat colour, never a
// metallic gradient or shine. All placement is a
// fixed seeded table, never runtime random.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette: three flat colours, two colourways ------------
var TEAL = '#2E7E7B', GOLD = '#C9A24B', GROUND = '#0E1216';
var COLORWAYS = [
  { fill: TEAL, line: GOLD },
  { fill: GOLD, line: TEAL }
];
if (COLORWAYS.length !== 2) throw new Error('Goldline Poppies needs exactly two colourways');
var cwIdx = 0;

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 24;              // seconds, seamless master loop
if (LOOP !== 24) throw new Error('Goldline Poppies loop must be 24s');
var TICK = 1 / 60;
// Frame one starts developed: exactly 9.4s into the
// 24s cycle, the bloom pulse mid-swell. Drawn at this
// fixed phase, never from a wall clock, so the
// thumbnail reproduces byte-identically; the live
// loop advances from that same anchor.
var T_OFFSET = 9.4;
var T = T_OFFSET;

// ---- deterministic seed table ---------------------------------
function makeRng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
var rng = makeRng(3610127);

// ---- the half-drop lattice ------------------------------------
// Heads are R*2 across (about 1/3 of frame width).
// Columns step 400, rows step 300, odd columns dropped
// half a row. The lattice is authored oversized so the
// drag pan (clamped to PANX/PANY) never uncovers an
// edge. Per-head rotation, scale, lobe counts and
// pulse phase come from the seeded table below.
var R = 213;
var DX = 400, DY = 300;
var PANX = 260, PANY = 180;
var HEADS = [];
(function buildHeads() {
  var col, row;
  for (col = -2; col <= 5; col++) {
    for (row = -2; row <= 5; row++) {
      HEADS.push({
        x: col * DX,
        y: row * DY + (Math.abs(col) % 2 === 1 ? DY / 2 : 0),
        rot: rng() * Math.PI * 2,
        sc: 0.92 + rng() * 0.16,
        back: 5,
        front: 4,
        ph: (col * 1.7 + row * 2.3) % (Math.PI * 2)
      });
    }
  }
})();
if (HEADS.length !== 64) throw new Error('Goldline Poppies needs 64 heads, got ' + HEADS.length);

// ---- one scalloped petal ---------------------------------------
// Petal along +x from the flower centre: length L, max
// half-width Wd. The edge is three scalloped lobes per
// side (quadratic bumps), the ruffled poppy silhouette.
// Fill flat, then stroke the gold contour; an inner
// contour line at 0.7 scale gives the deco double line.
function petalPath(L, Wd) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(L * 0.14, Wd * 0.66, L * 0.34, Wd * 0.55);
  ctx.quadraticCurveTo(L * 0.48, Wd * 0.94, L * 0.64, Wd * 0.72);
  ctx.quadraticCurveTo(L * 0.80, Wd * 1.00, L * 0.97, Wd * 0.30);
  ctx.quadraticCurveTo(L * 1.04, Wd * 0.08, L * 0.99, 0);
  ctx.quadraticCurveTo(L * 1.04, -Wd * 0.08, L * 0.97, -Wd * 0.30);
  ctx.quadraticCurveTo(L * 0.80, -Wd * 1.00, L * 0.64, -Wd * 0.72);
  ctx.quadraticCurveTo(L * 0.48, -Wd * 0.94, L * 0.34, -Wd * 0.55);
  ctx.quadraticCurveTo(L * 0.14, -Wd * 0.66, 0, 0);
  ctx.closePath();
}
function drawPetal(L, Wd, fill, line) {
  petalPath(L, Wd);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = line;
  ctx.lineWidth = 2.6;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.save();
  ctx.scale(0.7, 0.7);
  petalPath(L, Wd);
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.restore();
}

// ---- one poppy head ---------------------------------------------
// open is the pulse offset in radians: petals rotate
// around the centre by +/- open, alternating, and the
// whole head swells a touch. Back layer of wide lobes,
// front layer smaller, then the ground-colour heart
// ringed with gold stamens.
function drawHead(h, open, swell, fill, line) {
  var i, a;
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.rotate(h.rot);
  ctx.scale(h.sc * swell, h.sc * swell);
  // stem stub, barely visible behind the head
  ctx.strokeStyle = fill;
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, R * 0.2);
  ctx.quadraticCurveTo(R * 0.18, R * 0.7, R * 0.05, R * 1.25);
  ctx.stroke();
  // back petals
  for (i = 0; i < h.back; i++) {
    a = (i / h.back) * Math.PI * 2 + (i % 2 === 0 ? open : -open);
    ctx.save();
    ctx.rotate(a);
    drawPetal(R, R * 0.52, fill, line);
    ctx.restore();
  }
  // front petals
  for (i = 0; i < h.front; i++) {
    a = (i / h.front) * Math.PI * 2 + Math.PI / h.back + (i % 2 === 0 ? -open : open) * 1.4;
    ctx.save();
    ctx.rotate(a);
    drawPetal(R * 0.66, R * 0.36, fill, line);
    ctx.restore();
  }
  // heart: ground disc, stamen ticks, seed dots
  ctx.fillStyle = GROUND;
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.17, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = line;
  ctx.lineWidth = 2.2;
  for (i = 0; i < 12; i++) {
    a = (i / 12) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * R * 0.10, Math.sin(a) * R * 0.10);
    ctx.lineTo(Math.cos(a) * R * 0.155, Math.sin(a) * R * 0.155);
    ctx.stroke();
  }
  ctx.fillStyle = line;
  for (i = 0; i < 7; i++) {
    a = (i / 7) * Math.PI * 2 + 0.4;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * R * 0.055, Math.sin(a) * R * 0.055, R * 0.016, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ---- drawing ------------------------------------------------------
var panX = 0, panY = 0;
function draw(t) {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-PANX - R * 2, -PANY - R * 2, DW + (PANX + R * 2) * 2, DH + (PANY + R * 2) * 2);
  var cw = COLORWAYS[cwIdx];
  var ph = (t % LOOP) / LOOP;
  var i, h, s;
  ctx.save();
  ctx.translate(panX, panY);
  for (i = 0; i < HEADS.length; i++) {
    h = HEADS[i];
    if (h.x + panX < -R * 1.6 || h.x + panX > DW + R * 1.6) continue;
    if (h.y + panY < -R * 1.6 || h.y + panY > DH + R * 1.6) continue;
    s = Math.sin(Math.PI * 2 * ph + h.ph);
    drawHead(h, 0.055 * s, 1 + 0.03 * s, cw.fill, cw.line);
  }
  ctx.restore();
}

// ---- interaction: drag pans, double-tap flips colourway ---------
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function clampPan() {
  if (panX > PANX) panX = PANX; if (panX < -PANX) panX = -PANX;
  if (panY > PANY) panY = PANY; if (panY < -PANY) panY = -PANY;
}
var drag = null, downAt = 0, downXY = null, lastTapMs = -10000;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  drag = { x: p[0], y: p[1], panX: panX, panY: panY, moved: 0 };
  downAt = Date.now();
  downXY = p;
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var p = toDesign(e);
  panX = drag.panX + (p[0] - drag.x);
  panY = drag.panY + (p[1] - drag.y);
  clampPan();
  drag.moved = Math.max(drag.moved, Math.abs(p[0] - drag.x) + Math.abs(p[1] - drag.y));
});
canvas.addEventListener('pointerup', function (e) {
  if (!drag) return;
  var now = Date.now();
  if (drag.moved < 14 && now - downAt < 400) {
    if (now - lastTapMs < 350) {
      cwIdx = (cwIdx + 1) % COLORWAYS.length;
      lastTapMs = -10000;
    } else {
      lastTapMs = now;
    }
  }
  drag = null; downXY = null;
});
canvas.addEventListener('pointercancel', function () { drag = null; downXY = null; });

// ---- sizing: full-bleed field, cover-fit ---------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame ---------------------------------------------------------
var lastNow = -1, acc = 0;
function frame(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var dt = 0;
  if (lastNow >= 0 && now > 0) dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
