<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Arms, One Rock</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #ece8dc; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  // Seeded PRNG (mulberry32), seed 1416000 + index*7919, never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1416000);

  // Palette
  var ROOM = '#ece8dc', ARM = '#c8352a', ARMSH = '#8f231c';
  var STONE = '#8a8578', NOTCH = '#4a463c', POLISH = '#c9c4b4', FLOOR = '#b8b2a2';

  // Phone detection: window.screen physical size, aspect fallback only.
  function isPhone() {
    try {
      var s = window.screen;
      if (s && s.width && s.height) return Math.min(s.width, s.height) < 700;
    } catch (e) {}
    return H > W * 1.15;
  }

  function sizeCanvas() {
    var vw = W, vh = H;
    try {
      if (typeof visualViewport !== 'undefined' && visualViewport) {
        vw = visualViewport.width; vh = visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    W = vw; H = vh;
    canvas.width = Math.round(W); canvas.height = Math.round(H);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  sizeCanvas();
  try {
    if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
      visualViewport.addEventListener('resize', sizeCanvas);
    }
  } catch (e) {}
  window.addEventListener('resize', sizeCanvas);

  // Seeded stone outline: 14 vertices around a rough blob, fixed once.
  var stoneVerts = [];
  (function () {
    var i, a, r;
    for (i = 0; i < 14; i++) {
      a = (i / 14) * Math.PI * 2;
      r = 0.86 + rnd() * 0.28;
      stoneVerts.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
  })();
  // Seeded surface speckle, fixed once.
  var speckle = [];
  (function () {
    var i;
    for (i = 0; i < 90; i++) {
      var a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 0.92;
      speckle.push([Math.cos(a) * r, Math.sin(a) * r, 2 + rnd() * 3]);
    }
  })();

  function round4(x) {
    return Math.round(x * 10000) / 10000;
  }

  // ---- Interaction: recorded drag events, closed-form over (t, events) ----
  // Each drag record: { t0, arm ('left'|'right'), mag }.
  // Rate multiplier for an arm at time t: 1 + sum of boosts decaying tau 6s.
  var drags = [];
  var dragState = null;

  function armBoost(arm, t) {
    var b = 0, i, d;
    for (i = 0; i < drags.length; i++) {
      d = drags[i];
      if (d.arm === arm && t >= d.t0) b += d.mag * Math.exp(-(t - d.t0) / 6);
    }
    return b;
  }
  // Effective waver phase: base phase + accumulated boost integral, closed-form.
  // Integral of mag*exp(-(u-t0)/6) from t0 to t = mag*6*(1-exp(-(t-t0)/6)).
  function waverPhase(t) {
    var ph = (t / 3.2) * Math.PI * 2, i, d;
    for (i = 0; i < drags.length; i++) {
      d = drags[i];
      if (d.arm === 'left' && t >= d.t0) {
        ph += d.mag * 6 * (1 - Math.exp(-(t - d.t0) / 6)) * Math.PI * 2 / 3.2;
      }
    }
    return ph;
  }
  // Pointer steadiness: drags on the right arm raise polish rate, decaying tau 8s.
  function polishRate(t) {
    var r = 1, i, d;
    for (i = 0; i < drags.length; i++) {
      d = drags[i];
      if (d.arm === 'right' && t >= d.t0) r += d.mag * Math.exp(-(t - d.t0) / 8);
    }
    return r;
  }
  // Polish amount: base growth * t, plus closed-form boost integrals.
  function polishAmt(t) {
    var p = t * 0.004, i, d;
    for (i = 0; i < drags.length; i++) {
      d = drags[i];
      if (d.arm === 'right' && t >= d.t0) p += d.mag * 8 * (1 - Math.exp(-(t - d.t0) / 8)) * 0.004;
    }
    return Math.min(p, 1);
  }
  // Notch depth: one tap per waver cycle; depth grows with completed taps.
  function notchAmt(t) {
    var taps = waverPhase(t) / (Math.PI * 2);
    return Math.min(taps * 0.055, 1);
  }

  function armPoint(e) {
    var r;
    try { r = canvas.getBoundingClientRect(); } catch (err) { r = { left: 0, top: 0 }; }
    var x = (e.clientX !== undefined ? e.clientX : e.touches[0].clientX) - r.left;
    var y = (e.clientY !== undefined ? e.clientY : e.touches[0].clientY) - r.top;
    return [x, y];
  }
  function onDown(e) {
    var p = armPoint(e);
    var cx = W / 2, cy = H / 2;
    // Nearest arm: left arm occupies the left half, right arm the right half.
    var arm = p[0] < cx ? 'left' : 'right';
    dragState = { arm: arm, x: p[0], y: p[1], moved: 0 };
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragState) return;
    var p = armPoint(e);
    dragState.moved += Math.abs(p[0] - dragState.x) + Math.abs(p[1] - dragState.y);
    dragState.x = p[0]; dragState.y = p[1];
  }
  function onUp(e) {
    if (!dragState) return;
    // A real drag (not a tap) registers a rhythm boost proportional to distance.
    var mag = Math.min(dragState.moved / 240, 1.5);
    if (mag > 0.15) drags.push({ t0: nowT, arm: dragState.arm, mag: mag });
    dragState = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---- Drawing ----
  function drawStone(cx, cy, R, t) {
    var i, v, x, y;
    // Base blob.
    ctx.beginPath();
    for (i = 0; i <= stoneVerts.length; i++) {
      v = stoneVerts[i % stoneVerts.length];
      x = cx + v[0] * R; y = cy + v[1] * R * 0.82;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = STONE;
    ctx.fill();
    // Speckle.
    var s;
    for (i = 0; i < speckle.length; i++) {
      s = speckle[i];
      ctx.fillStyle = 'rgba(74,70,60,' + round4(0.25) + ')';
      ctx.fillRect(cx + s[0] * R - s[2] / 2, cy + s[1] * R * 0.82 - s[2] / 2, s[2], s[2]);
    }
    // Notch on the left flank: dark wedge deepening with notchAmt.
    var n = notchAmt(t);
    if (n > 0.01) {
      var nd = n * R * 0.42;
      ctx.beginPath();
      ctx.moveTo(cx - R * 0.92, cy - R * 0.30);
      ctx.lineTo(cx - R * 0.92 + nd, cy + R * 0.05);
      ctx.lineTo(cx - R * 0.92, cy + R * 0.42);
      ctx.closePath();
      ctx.fillStyle = NOTCH;
      ctx.fill();
      // Notch inner shadow lines.
      ctx.strokeStyle = NOTCH;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - R * 0.92 + nd * 0.5, cy - R * 0.10);
      ctx.lineTo(cx - R * 0.92 + nd * 0.8, cy + R * 0.18);
      ctx.stroke();
    }
    // Polish on the right flank: pale overlay growing with polishAmt.
    var p = polishAmt(t);
    if (p > 0.01) {
      ctx.beginPath();
      ctx.moveTo(cx + R * 0.30, cy - R * 0.55);
      ctx.lineTo(cx + R * 0.95, cy - R * 0.20);
      ctx.lineTo(cx + R * 0.95, cy + R * 0.45);
      ctx.lineTo(cx + R * 0.30, cy + R * 0.55);
      ctx.closePath();
      ctx.fillStyle = 'rgba(201,196,180,' + round4(0.15 + p * 0.65) + ')';
      ctx.fill();
    }
  }

  function drawArm(side, t) {
    var cx = W / 2, cy = H / 2;
    var R = Math.min(W, H) * 0.30;
    var baseY = cy - R * 0.10;
    var reach = Math.min(W * 0.42, R * 2.6);
    var tipX, tipY, midX, midY, width;
    if (side === 'left') {
      // Waver: taps in a steady rhythm, inflate/deflate envelope.
      var ph = waverPhase(t);
      var cyc = Math.sin(ph);
      var tap = Math.max(0, Math.sin(ph * 2)); // two taps per cycle feel
      var inflate = 1 + 0.18 * Math.sin(ph * 0.5);
      width = R * 0.16 * inflate;
      tipX = cx - R * 1.25 + Math.sin(ph * 0.5) * R * 0.06;
      tipY = baseY - R * 0.12 + cyc * R * 0.22 - tap * R * 0.05;
      midX = (0 + tipX) / 2; midY = (baseY + tipY) / 2 - R * 0.18;
      // Shadow.
      ctx.strokeStyle = ARMSH;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, baseY + R * 0.10);
      ctx.quadraticCurveTo(midX, midY + R * 0.10, tipX, tipY + R * 0.10);
      ctx.stroke();
      // Arm.
      ctx.strokeStyle = ARM;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(0, baseY);
      ctx.quadraticCurveTo(midX, midY, tipX, tipY);
      ctx.stroke();
      // Tapping fingertip: small pad at the tip.
      ctx.fillStyle = ARM;
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.arc(tipX, tipY, width * 0.55, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Pointer: holds and trembles, steadier after a right-arm drag.
      var boost = armBoost('right', t);
      var trem = R * 0.035 / (1 + boost * 0.7);
      var sway = Math.sin(t * 0.9) * trem + Math.sin(t * 2.7) * trem * 0.4;
      tipX = cx + R * 1.25;
      tipY = baseY - R * 0.05 + sway;
      midX = (W + tipX) / 2; midY = (baseY + tipY) / 2 + R * 0.10;
      width = R * 0.14;
      // Shadow.
      ctx.strokeStyle = ARMSH;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(W, baseY + R * 0.10);
      ctx.quadraticCurveTo(midX, midY + R * 0.10, tipX, tipY + R * 0.10);
      ctx.stroke();
      // Arm.
      ctx.strokeStyle = ARM;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(W, baseY);
      ctx.quadraticCurveTo(midX, midY, tipX, tipY);
      ctx.stroke();
      // Single pointing finger: tapered extension toward the stone.
      ctx.strokeStyle = ARM;
      ctx.lineWidth = width * 0.45;
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.lineTo(tipX - R * 0.12, tipY + sway * 0.5);
      ctx.stroke();
      ctx.fillStyle = ARM;
      ctx.beginPath();
      ctx.moveTo(tipX - R * 0.12, tipY + sway * 0.5);
      ctx.arc(tipX - R * 0.12, tipY + sway * 0.5, width * 0.28, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  var nowT = 0;
  var booted = false;
  function draw(t) {
    nowT = t;
    var cx = W / 2, cy = H / 2;
    var R = Math.min(W, H) * 0.30;
    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, W, H);
    // Floor line around the room.
    ctx.strokeStyle = FLOOR;
    ctx.lineWidth = 2;
    ctx.strokeRect(R * 0.25, R * 0.25, W - R * 0.5, H - R * 0.5);
    drawArm('left', t);
    drawArm('right', t);
    drawStone(cx, cy, R, t);
    // Page ground for centered pieces: body background matches the room.
    try {
      if (typeof document !== 'undefined' && document.body && document.body.style) {
        document.body.style.background = ROOM;
      }
    } catch (e) {}
  }

  // Frame one is draw(0) via boot flag; the clock starts with the rAF loop.
  draw(0);
  booted = true;
  var startTime = 0;
  var started = false;
  function loop(ts) {
    if (!started) { started = true; startTime = ts; }
    var t = (ts - startTime) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
