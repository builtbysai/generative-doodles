<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ledger</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#000000';
var INK = '#f2f2f2';
var DIM = 'rgba(242,242,242,0.55)';
var FRAME_T = 60.0; /* fixed phase: column mid-scroll at frame one */
var PHASE = 36.0; /* px; at t=60 the LINE_012 entry sits 30 px above the center line */
var ENTRY_SECONDS = 30.0; /* seconds per entry height: one entry height every 30 s */
var BLOOM_RADIUS = 1.6; /* bloom zone, in entry heights from the center line */
var PLATE_BG = 'rgba(255,255,255,0.07)';
var PLATE_LINE = 'rgba(255,255,255,0.18)';
var PLATE_INK = '#e8e8e8';
var HINT_INK = '#b8b8b8';
/* Fixed authored entry table: year, catalog number, title.
   LINE catalog entries in the spirit of the label; never fetched live. */
var ENTRIES = [
  { year: '2000', cat: 'LINE_001', title: 'Surface, After Rain' },
  { year: '2001', cat: 'LINE_002', title: 'A Field of Silence' },
  { year: '2001', cat: 'LINE_003', title: 'Slow Arc' },
  { year: '2002', cat: 'LINE_004', title: 'The Vanishing Point' },
  { year: '2002', cat: 'LINE_005', title: 'Winter, Unfolded' },
  { year: '2003', cat: 'LINE_006', title: 'Two Tones' },
  { year: '2003', cat: 'LINE_007', title: 'A Room of Air' },
  { year: '2004', cat: 'LINE_008', title: 'The Long Tone' },
  { year: '2004', cat: 'LINE_009', title: 'Small Hours' },
  { year: '2005', cat: 'LINE_010', title: 'A Quiet Geometry' },
  { year: '2006', cat: 'LINE_011', title: 'The Listening Room' },
  { year: '2006', cat: 'LINE_012', title: 'Almost Nothing' }
];
/* Bloom palette: monochrome white most entries, occasional icy or pink. */
var BLOOM_WHITE = '#ffffff';
var BLOOM_ICY = '#bcd8ea';
var BLOOM_PINK = '#eec3d3';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function smoothstep(u) { return u * u * (3 - 2 * u); }
/* Seeded hash of an entry's catalog string; picks its bloom color. */
function entryHash(e) {
  var s = e.cat + e.title, h = 2166136261, i;
  for (i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h;
}
function bloomColor(e) {
  var m = entryHash(e) % 5;
  if (m === 0) return { hex: BLOOM_PINK, maxA: 0.14 };
  if (m === 1) return { hex: BLOOM_ICY, maxA: 0.16 };
  return { hex: BLOOM_WHITE, maxA: 0.10 };
}
/* Bloom alpha as a closed-form function of distance from the center line. */
function bloomAlpha(e, d, entryH) {
  var u = clamp(1 - d / (BLOOM_RADIUS * entryH), 0, 1);
  return bloomColor(e).maxA * smoothstep(u);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
function entryH() { return isPhone ? 40 : 48; }
function scrollY(t) { return (entryH() / ENTRY_SECONDS) * t + PHASE; }
/* Plate geometry, shared by the clip band and the plate drawing, so the
   column can never render beneath either plate. */
function plateRects() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Ledger').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Ledger').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 20').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var hintW = ctx.measureText('Watch only.').width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  return {
    smallPx: smallPx, titlePx: titlePx,
    title: { x: 12, y: 12, w: plateW, h: plateH },
    hint: { x: 12, y: VH - hintPlateH - 12, w: hintPlateW, h: hintPlateH }
  };
}
function drawColumn() {
  var pr = plateRects();
  var clipTop = pr.title.y + pr.title.h;
  var clipBot = pr.hint.y;
  /* Clip the column (entries, blooms, center rule, edge fades) to the band
     between the title plate's bottom edge and the hint plate's top edge,
     on all sizes, so no entry or bloom band ever renders beneath a plate. */
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, clipTop, VW, clipBot - clipTop);
  ctx.clip();
  var eh = entryH();
  var colW = isPhone ? VW - 32 : Math.min(VW * 0.66, 620);
  var colX = F.x + (F.w - colW) / 2;
  var centerY = F.y + F.h / 2;
  var sy = scrollY(phaseT);
  var entryPx = isPhone ? 12 : 13;
  ctx.font = entryPx + 'px monospace';
  /* shrink the entry font only if the longest line would overflow the column */
  var longest = '';
  var i;
  for (i = 0; i < ENTRIES.length; i++) {
    var s = ENTRIES[i].year + '  ' + ENTRIES[i].cat + '  ' + ENTRIES[i].title;
    if (s.length > longest.length) longest = s;
  }
  while (entryPx > 9 && ctx.measureText(longest).width > colW) {
    entryPx -= 1;
    ctx.font = entryPx + 'px monospace';
  }
  var kMin = Math.floor((sy - eh) / eh) - 1;
  var kMax = Math.ceil((sy + VH) / eh) + 1;
  var k, e, y, cy, d, a, bc;
  for (k = kMin; k <= kMax; k++) {
    e = ENTRIES[((k % ENTRIES.length) + ENTRIES.length) % ENTRIES.length];
    y = k * eh - sy;
    cy = y + eh / 2;
    if (cy < F.y - eh || cy > F.y + F.h + eh) continue;
    d = Math.abs(cy - centerY);
    a = bloomAlpha(e, d, eh);
    if (a > 0.0005) {
      bc = bloomColor(e);
      ctx.fillStyle = rgba(bc.hex, a);
      ctx.fillRect(colX - 14, y + eh * 0.04, colW + 28, eh * 0.92);
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = DIM;
    ctx.fillText(e.year + '  ' + e.cat + '  ', colX, cy);
    var headW = ctx.measureText(e.year + '  ' + e.cat + '  ').width;
    ctx.fillStyle = INK;
    ctx.fillText(e.title, colX + headW, cy);
  }
  /* faint center rule: the line each entry blooms across */
  ctx.fillStyle = 'rgba(242,242,242,0.10)';
  ctx.fillRect(F.x, centerY - 0.5, F.w, 1);
  /* soft fade at the clip-band edges so entries drift in and out */
  var fade = 80;
  var gTop = ctx.createLinearGradient(0, clipTop, 0, clipTop + fade);
  gTop.addColorStop(0, 'rgba(0,0,0,1)');
  gTop.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gTop;
  ctx.fillRect(F.x, clipTop, F.w, fade);
  var gBot = ctx.createLinearGradient(0, clipBot - fade, 0, clipBot);
  gBot.addColorStop(0, 'rgba(0,0,0,0)');
  gBot.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = gBot;
  ctx.fillRect(F.x, clipBot - fade, F.w, fade);
  ctx.restore();
}
function drawPlates() {
  var pr = plateRects();
  var smallPx = pr.smallPx;
  var titlePx = pr.titlePx;
  var plateW = pr.title.w;
  var plateH = pr.title.h;
  var plateX = pr.title.x, plateY = pr.title.y;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = PLATE_BG;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Ledger', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 20', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  var hintPlateW = pr.hint.w;
  var hintPlateH = pr.hint.h;
  var hintPlateX = pr.hint.x;
  var hintPlateY = pr.hint.y;
  ctx.fillStyle = PLATE_BG;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawColumn();
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    scrollY: function () { return +scrollY(phaseT).toFixed(2); }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
