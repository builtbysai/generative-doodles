<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.218 If/Then</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#08090B; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.218 If/Then (David Bowen). Two identical small machines, angular
// two-segment arms on round bases, each with a single camera eye,
// courting across the dark on a strict if/then grammar. If the eye
// cone finds the other, then a thin green annotation box snaps around
// it, labelled "mate" with a climbing confidence. If confidence passes
// sixty, they approach. If the arm tips come within eighty pixels,
// they hold, confidence spiking to ninety seven, then retreat fast,
// rest, and seek again. Every completed courtship raises a hidden
// familiarity, and the next approach comes a little closer. Drag a
// machine aside and it re-orients and resumes seeking.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#08090B', BODY = '#3A3A3E', ACCENT = '#5A5A60', EYE = '#1A1A1A', GLINT = '#FFFFFF', BOX = '#35D461';
var W = 0, H = 0, phone = false, unit = 600;
var T = 13, lastNow = -1; // frame one: mid-courtship, approach under way

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function angDiff(a, b) {
  var d = (a - b) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}

// ---- the machines ------------------------------------------------------------------
function makeMachine(side) {
  return {
    side: side,               // -1 left/top, +1 right/bottom
    anchor: { x: 0, y: 0 },   // home base position
    pos: { x: 0, y: 0 },      // current base position
    face: side < 0 ? 0 : Math.PI, // turret / eye direction
    conf: 0, detected: false, grabbed: false
  };
}
var A = makeMachine(-1), B = makeMachine(1);
var phase = 'approach', phaseT = 0, familiarity = 0.3;
A.conf = 74; B.conf = 71;
function anchors() {
  if (phone) {
    A.anchor.x = W * 0.5; A.anchor.y = H * 0.28;
    B.anchor.x = W * 0.5; B.anchor.y = H * 0.72;
  } else {
    A.anchor.x = W * 0.22; A.anchor.y = H * 0.55;
    B.anchor.x = W * 0.78; B.anchor.y = H * 0.55;
  }
}
function baseSep() { return Math.hypot(B.anchor.x - A.anchor.x, B.anchor.y - A.anchor.y); }
function reach() { return unit * 0.145; }        // L1 + L2, roughly
function approachSep() {
  var r = reach();
  return clamp(80 + 2 * r * 0.98 - familiarity * 40, unit * 0.30, baseSep() * 0.86);
}
var placed = false;
function placeInitial() {
  anchors();
  var mx = (A.anchor.x + B.anchor.x) / 2, my = (A.anchor.y + B.anchor.y) / 2;
  var sep = baseSep() * 0.55; // frame one: already partway in
  var dx = (B.anchor.x - A.anchor.x) / baseSep(), dy = (B.anchor.y - A.anchor.y) / baseSep();
  A.pos.x = mx - dx * sep / 2; A.pos.y = my - dy * sep / 2;
  B.pos.x = mx + dx * sep / 2; B.pos.y = my + dy * sep / 2;
  A.face = Math.atan2(dy, dx); B.face = Math.atan2(-dy, -dx);
  placed = true;
}

// ---- behaviour ----------------------------------------------------------------------
function updateMachine(M, P, dt) {
  var bearing = Math.atan2(P.pos.y - M.pos.y, P.pos.x - M.pos.x);
  // detection: is the partner inside the 60 degree eye cone?
  M.detected = Math.abs(angDiff(M.face, bearing)) < Math.PI / 6;
  // turret: track the partner when detected, sweep slowly when not
  var want = bearing;
  if (!M.detected && phase === 'seek') want = bearing + Math.sin(T * 0.45 + M.side * 1.7) * 0.85;
  var turn = angDiff(want, M.face);
  var rate = phase === 'retreat' ? 2.6 : 1.1;
  M.face += clamp(turn, -rate * dt, rate * dt);
  // confidence eases toward the state's target
  var target;
  if (phase === 'almost') target = 97;
  else if (phase === 'approach') target = 88;
  else if (phase === 'retreat') target = 40;
  else if (phase === 'rest') target = 25;
  else target = M.detected ? 62 : 18; // seek: climbs only while the gaze holds
  M.conf += (target - M.conf) * Math.min(1, dt * (phase === 'retreat' ? 3.2 : 1.4));
}
function step(dt) {
  phaseT += dt;
  updateMachine(A, B, dt);
  updateMachine(B, A, dt);
  var mx = (A.anchor.x + B.anchor.x) / 2, my = (A.anchor.y + B.anchor.y) / 2;
  var curSep = Math.hypot(B.pos.x - A.pos.x, B.pos.y - A.pos.y);
  var dx = 1, dy = 0;
  if (curSep > 1) { dx = (B.pos.x - A.pos.x) / curSep; dy = (B.pos.y - A.pos.y) / curSep; }
  var wantSep = baseSep(), speed = 1.6;
  if (phase === 'approach' || phase === 'almost') { wantSep = approachSep(); speed = 1.1; }
  if (phase === 'retreat') speed = 5.0;
  if (!A.grabbed && !B.grabbed) {
    var k = 1 - Math.exp(-dt * speed);
    var ns = lerp(curSep, wantSep, k);
    A.pos.x = mx - dx * ns / 2; A.pos.y = my - dy * ns / 2;
    B.pos.x = mx + dx * ns / 2; B.pos.y = my + dy * ns / 2;
  }
  // arm-tip distance, both arms reaching for the partner's turret
  var r = reach() * 0.98;
  var tipSep = Math.max(0, curSep - 2 * r);
  // the if/then grammar
  if (phase === 'seek' && A.conf > 60 && B.conf > 60) { phase = 'approach'; phaseT = 0; }
  else if (phase === 'approach' && tipSep < 80) { phase = 'almost'; phaseT = 0; }
  else if (phase === 'almost' && phaseT >= 1.5) { phase = 'retreat'; phaseT = 0; }
  else if (phase === 'retreat' && phaseT >= 1.0) { phase = 'rest'; phaseT = 0; familiarity = Math.min(1, familiarity + 0.1); }
  else if (phase === 'rest' && phaseT >= 2.0) { phase = 'seek'; phaseT = 0; }
}

// ---- drawing ---------------------------------------------------------------------------
function ik(sx, sy, tx, ty, a, b, bendUp) {
  var dx = tx - sx, dy = ty - sy;
  var d = Math.min(Math.hypot(dx, dy), (a + b) * 0.999);
  var ang = Math.atan2(dy, dx);
  var cosE = clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1);
  var ea = ang + (bendUp ? -1 : 1) * Math.acos(cosE);
  var ex = sx + Math.cos(ea) * a, ey = sy + Math.sin(ea) * a;
  var ta = Math.atan2(ty - ey, tx - ex);
  return { ex: ex, ey: ey, tx: ex + Math.cos(ta) * b, ty: ey + Math.sin(ta) * b };
}
function armTarget(M, P) {
  // the hand reaches for the partner's turret; how far it dares
  // depends on the phase of the courtship
  var d = Math.hypot(P.pos.x - M.pos.x, P.pos.y - M.pos.y) || 1;
  var ux = (P.pos.x - M.pos.x) / d, uy = (P.pos.y - M.pos.y) / d;
  var gap;
  if (phase === 'approach' || phase === 'almost') gap = unit * 0.028;
  else if (phase === 'retreat') gap = d * 0.55;
  else gap = d * 0.62; // seek / rest: a half-hearted reach
  return { x: P.pos.x - ux * gap, y: P.pos.y - uy * gap };
}
function drawMachine(M, P) {
  var r = unit * 0.052;                       // base radius
  var sx = M.pos.x, sy = M.pos.y - r * 0.55;  // shoulder, on its post
  var L = unit * 0.0725;
  var tgt = armTarget(M, P);
  var arm = ik(sx, sy, tgt.x, tgt.y, L, L, true);
  ctx.lineCap = 'round';
  // the round base first, so post, arm and turret sit on top of it
  ctx.fillStyle = BODY; ctx.strokeStyle = ACCENT; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(M.pos.x, M.pos.y, r, 0, 6.284); ctx.fill(); ctx.stroke();
  ctx.fillStyle = ACCENT;
  ctx.beginPath(); ctx.arc(M.pos.x, M.pos.y, r * 0.30, 0, 6.284); ctx.fill();
  // post
  ctx.strokeStyle = BODY; ctx.lineWidth = r * 0.42;
  ctx.beginPath(); ctx.moveTo(M.pos.x, M.pos.y); ctx.lineTo(sx, sy); ctx.stroke();
  // arm segments, drawn from shoulder to a small hand
  ctx.strokeStyle = BODY; ctx.lineWidth = Math.max(2.5, unit * 0.0075);
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(arm.ex, arm.ey); ctx.lineTo(arm.tx, arm.ty); ctx.stroke();
  // joints
  ctx.fillStyle = ACCENT;
  ctx.beginPath(); ctx.arc(arm.ex, arm.ey, Math.max(2, unit * 0.006), 0, 6.284); ctx.fill();
  ctx.beginPath(); ctx.arc(arm.tx, arm.ty, Math.max(1.8, unit * 0.005), 0, 6.284); ctx.fill();
  // turret head at the shoulder, carrying the camera eye
  ctx.fillStyle = BODY; ctx.strokeStyle = ACCENT; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(sx, sy, r * 0.46, 0, 6.284); ctx.fill(); ctx.stroke();
  var exx = sx + Math.cos(M.face) * r * 0.26, eyy = sy + Math.sin(M.face) * r * 0.26;
  ctx.fillStyle = EYE;
  ctx.beginPath(); ctx.arc(exx, eyy, r * 0.20, 0, 6.284); ctx.fill();
  ctx.fillStyle = GLINT;
  ctx.beginPath(); ctx.arc(exx - r * 0.07, eyy - r * 0.07, r * 0.06, 0, 6.284); ctx.fill();
}
function drawAnnotation(M, P) {
  if (!M.detected) return;
  if (phase !== 'seek' && phase !== 'approach' && phase !== 'almost') return;
  var half = unit * 0.135;
  var x = P.pos.x - half, y = P.pos.y - half * 1.18;
  var w = half * 2, h = half * 2.1;
  ctx.strokeStyle = BOX; ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = BOX;
  ctx.font = Math.max(10, unit * 0.016) + 'px monospace';
  ctx.fillText('mate ' + Math.round(M.conf) + '%', x + 2, y - 6);
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  drawMachine(A, B);
  drawMachine(B, A);
  drawAnnotation(A, B);
  drawAnnotation(B, A);
}

// ---- input: drag a machine aside -------------------------------------------------------
var dragM = null;
function evtPos(e) {
  var r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = evtPos(e);
  var dA = Math.hypot(p.x - A.pos.x, p.y - A.pos.y);
  var dB = Math.hypot(p.x - B.pos.x, p.y - B.pos.y);
  if (Math.min(dA, dB) < unit * 0.11) {
    dragM = dA <= dB ? A : B;
    dragM.grabbed = true;
    dragM.pos.x = p.x; dragM.pos.y = p.y;
    dragM.anchor.x = p.x; dragM.anchor.y = p.y;
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragM) return;
  var p = evtPos(e);
  var m = unit * 0.08;
  p.x = clamp(p.x, m, W - m); p.y = clamp(p.y, m, H - m);
  dragM.pos.x = p.x; dragM.pos.y = p.y;
  dragM.anchor.x = p.x; dragM.anchor.y = p.y;
});
function endDragM() { if (dragM) dragM.grabbed = false; dragM = null; }
canvas.addEventListener('pointerup', endDragM);
canvas.addEventListener('pointercancel', endDragM);

// ---- resize --------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  unit = Math.min(W, H);
  if (!placed) placeInitial();
  else anchors();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame -----------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  step(dt);
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
