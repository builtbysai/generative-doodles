<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One More Day</title>
<style>
html, body { margin: 0; padding: 0; background: #FFFFFF; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#FFFFFF';
var PLATE = '#17120F';
var PLATE_LINE = 'rgba(217,30,30,0.55)';
var TITLE_INK = '#FFFFFF';
var HINT_INK = '#E8A49A';
var RED = '#D91E1E';
var BLUE = '#1E40AF';
var BLACK = '#17120F';
var WHITE = '#FFFFFF';
var PERIOD = 12;
var FRAME_T = 4.2;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1711);
/* ---- seeded particle system: burst along two diagonal streaks ---- */
var N = 1800;
var parts = [];
var i;
for (i = 0; i < N; i++) {
  var diag = rng() < 0.5 ? Math.PI / 4 : -Math.PI / 4;
  var dir = rng() < 0.5 ? 0 : Math.PI;
  var ang = diag + dir + (rng() - 0.5) * 0.42;
  if (rng() < 0.08) ang = rng() * TAU; /* small isotropic minority for fullness */
  var cr = rng();
  var col = cr < 0.30 ? RED : (cr < 0.60 ? BLUE : (cr < 0.82 ? BLACK : WHITE));
  parts.push({
    ang: ang,
    maxR: 0.08 + Math.pow(rng(), 0.8) * 0.95, /* fraction of stage half-diagonal */
    tau: 0.5 + rng() * 1.3,                    /* burst time constant, seconds */
    r: 0.0022 + rng() * 0.0042,                /* dot radius, fraction of stage height */
    col: col,
    a: 0.55 + rng() * 0.45,
    pAmp: (rng() - 0.5) * 0.05,                /* perpendicular settle drift, fraction of stage height */
    pPer: 5 + rng() * 7,
    pPh: rng() * TAU
  });
}
/* ---- faint diagonal streak lanes crossing the whole field ---- */
var LANES = 16;
var lanes = [];
for (i = 0; i < LANES; i++) {
  var base = rng() < 0.5 ? Math.PI / 4 : -Math.PI / 4;
  lanes.push({
    ang: base + (rng() - 0.5) * 0.10,
    off: (rng() - 0.5) * 1.1,                  /* perpendicular offset, fraction of stage width */
    col: rng() < 0.5 ? BLUE : BLACK,
    a: 0.04 + rng() * 0.05
  });
}
/* ---- directional anchor strokes radiating from the burst origin ---- */
var anchors = [];
var anchorAngles = [Math.PI / 4, -Math.PI / 4, 3 * Math.PI / 4, -3 * Math.PI / 4, Math.PI / 4 + 0.10, -Math.PI / 4 - 0.08];
for (i = 0; i < anchorAngles.length; i++) {
  anchors.push({
    ang: anchorAngles[i],
    len: 0.55 + rng() * 0.40,                  /* fraction of stage half-diagonal */
    col: i % 3 === 0 ? RED : (i % 3 === 1 ? BLUE : BLACK),
    a: 0.12 + rng() * 0.06,
    w: 1.5 + rng() * 1.5
  });
}
/* burst origin, slightly off-center, in stage fractions */
var OX = 0.44, OY = 0.52;
var phaseT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* loop envelope: 0 at t=0, full by t=0.3, fades to 0 by t=11.7, so the wrap is seamless */
function env(t) {
  var a = smooth(clamp(t / 0.3, 0, 1));
  var b = 1 - smooth(clamp((t - 8.2) / 3.5, 0, 1));
  return a * b;
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var sw = st.w, sh = st.h;
  var ox = st.x + OX * sw, oy = st.y + OY * sh;
  var halfDiag = 0.5 * Math.sqrt(sw * sw + sh * sh);
  var t = phaseT;
  var e = env(t);
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, sw, sh);
  ctx.clip();
  var k, p, x, y, d, a;
  /* ---- faint streak lanes ---- */
  for (k = 0; k < lanes.length; k++) {
    var ln = lanes[k];
    var ca = Math.cos(ln.ang), sa = Math.sin(ln.ang);
    var px = -sa, py = ca; /* perpendicular unit */
    var cx = ox + px * ln.off * sw, cy = oy + py * ln.off * sw;
    var L = halfDiag * 1.4;
    ctx.beginPath();
    ctx.moveTo(cx - ca * L, cy - sa * L);
    ctx.lineTo(cx + ca * L, cy + sa * L);
    ctx.lineWidth = Math.max(0.75, sh * 0.001);
    ctx.strokeStyle = rgba(ln.col, e * ln.a);
    ctx.stroke();
  }
  /* ---- anchor strokes from the origin ---- */
  for (k = 0; k < anchors.length; k++) {
    var an = anchors[k];
    var ac = Math.cos(an.ang), as = Math.sin(an.ang);
    var al = an.len * halfDiag;
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox + ac * al, oy + as * al);
    ctx.lineWidth = Math.max(1, sh * 0.0016 * an.w);
    ctx.strokeStyle = rgba(an.col, e * an.a);
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  /* ---- dots: colored first, white last so white discs punch through overlaps ---- */
  var pass;
  for (pass = 0; pass < 2; pass++) {
    for (k = 0; k < parts.length; k++) {
      p = parts[k];
      var isWhite = p.col === WHITE;
      if ((pass === 0 && isWhite) || (pass === 1 && !isWhite)) continue;
      d = p.maxR * halfDiag * (1 - Math.exp(-t / p.tau));
      var perp = p.pAmp * sh * Math.sin(TAU * t / p.pPer + p.pPh);
      x = ox + Math.cos(p.ang) * d - Math.sin(p.ang) * perp;
      y = oy + Math.sin(p.ang) * d + Math.cos(p.ang) * perp;
      a = e * p.a;
      if (a <= 0.002) continue;
      var r = p.r * sh;
      ctx.fillStyle = rgba(p.col, a);
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
      if (isWhite) {
        /* thin dark rim keeps white dots legible on the white field; still the four palette colors */
        ctx.strokeStyle = rgba(BLACK, a * 0.30);
        ctx.lineWidth = Math.max(0.5, r * 0.18);
        ctx.strokeRect(x - r, y - r, r * 2, r * 2);
      }
    }
  }
  /* ---- origin mark: small black core with a red ring, legible at mid-burst ---- */
  var coreR = Math.max(2, sh * 0.006);
  ctx.fillStyle = rgba(BLACK, e * 0.9);
  ctx.fillRect(ox - coreR, oy - coreR, coreR * 2, coreR * 2);
  ctx.strokeStyle = rgba(RED, e * 0.8);
  ctx.lineWidth = Math.max(1, sh * 0.0015);
  ctx.strokeRect(ox - coreR * 2.4, oy - coreR * 2.4, coreR * 4.8, coreR * 4.8);
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('One More Day').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('One More Day').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 18').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('One More Day', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 18', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    particleCount: function () { return N; },
    envAt: function (t) { return env(t); },
    origin: function () { var st = stageRect(); return [st.x + OX * st.w, st.y + OY * st.h]; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed pre-roll t = 4.2s, mid-burst ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
