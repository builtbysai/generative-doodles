<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№120 · Monolith Study</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EEE2; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(34,34,30,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to trade garden for stone</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function smooth(u){ u=clamp(u,0,1); return u*u*(3-2*u); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// No.120 Monolith Study (after Zancan's garden-versus-monolith duality): two
// generative regimes trade places on a slow 25 second cycle. The garden is a
// dense line thicket grown from root points; the monolith is one massive dark
// slab, slightly off centre, described by sparse paper contour lines. The
// change is always a dissolve, never a wipe or a cut. Horizontal drag scrubs
// the blend by hand; on release the offset eases out and the timer resumes.
// Palette: paper #F2EEE2, garden ink #22221E, slab #14130F, contour #F2EEE2,
// one accent, oxide red #A03A22, used sparingly in both regimes.
const PAPER='#F2EEE2', GINK='#22221E', SLAB='#14130F', RED='#A03A22';
const rng=mulberry32(120120);
const CAP=16000, MAXTIPS=52;
let W=0, H=0, roots=[], tips=[], segs=[], simT=0;
let dragging=false, dragX0=0, dragOff0=0, dragOff=0, frame=0;

function spawnTip(x,y,ang,acc,life){ tips.push({x:x,y:y,ang:ang,acc:acc,age:0,life:life,homeX:x}); }
function stepLen(){ return Math.max(2.2, Math.min(W,H)*0.0048); }
function lifeSteps(){ return Math.round((0.55+rng()*0.65)*(H/stepLen())); }
function seedRoots(){
  roots=[W*0.26, W*0.52, W*0.74];
  tips=[]; segs=[];
  for(let i=0;i<22;i++){
    const rx=roots[i%roots.length]+(rng()-0.5)*W*0.05;
    spawnTip(rx, H+4, -Math.PI/2+(rng()-0.5)*0.55, rng()<0.05, lifeSteps());
  }
}
function growStep(){
  simT+=0.016;
  const sl=stepLen();
  const born=[];
  for(let i=tips.length-1;i>=0;i--){
    const tp=tips[i];
    const nx=tp.x+Math.cos(tp.ang)*sl;
    const ny=tp.y+Math.sin(tp.ang)*sl;
    segs.push({x1:tp.x,y1:tp.y,x2:nx,y2:ny,acc:tp.acc});
    tp.x=nx; tp.y=ny; tp.age++;
    tp.ang+=(rng()-0.5)*0.32 + Math.sin(tp.x*0.008+simT*0.7)*0.03;
    const up=-Math.PI/2;
    let d=up-tp.ang; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    tp.ang+=d*0.05;
    tp.ang+=clamp((tp.homeX-tp.x)*0.0004,-0.018,0.018);
    if(rng()<0.05 && tips.length+born.length<MAXTIPS){
      const side=rng()<0.5?-1:1;
      born.push({x:tp.x,y:tp.y,ang:tp.ang+side*(0.30+rng()*0.25),acc:tp.acc,age:0,life:Math.round(lifeSteps()*0.7),homeX:tp.homeX});
    }
    if(tp.age>tp.life || tp.y<-24 || tp.x<-24 || tp.x>W+24){
      tips.splice(i,1);
      if(tips.length<26){
        const rx=roots[Math.floor(rng()*roots.length)]+(rng()-0.5)*W*0.05;
        spawnTip(rx, H+4, -Math.PI/2+(rng()-0.5)*0.55, rng()<0.05, lifeSteps());
      }
    }
  }
  for(let b=0;b<born.length;b++) tips.push(born[b]);
  if(segs.length>CAP) segs.splice(0, segs.length-CAP);
}
const BUCKET_ALPHA=[0.55,0.63,0.70,0.77,0.83,0.89,0.93,0.97];
const DEPTH_ALPHA=[0.62,0.84,1.0]; // tips (top) lightest, roots (bottom) full weight
function drawGarden(alphaScale){
  const total=segs.length;
  if(!total||alphaScale<=0.003) return;
  ctx.lineWidth=1;
  for(let c=0;c<2;c++){
    for(let b=0;b<8;b++){
      const lo=Math.floor(total*b/8), hi=Math.floor(total*(b+1)/8);
      for(let d=0;d<3;d++){
        ctx.beginPath();
        for(let i=lo;i<hi;i++){
          const s=segs[i];
          if((s.acc?1:0)!==c) continue;
          const db=s.y1<H*0.4?0:(s.y1<H*0.75?1:2);
          if(db!==d) continue;
          ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2);
        }
        ctx.strokeStyle=c?RED:GINK;
        ctx.globalAlpha=BUCKET_ALPHA[b]*DEPTH_ALPHA[d]*alphaScale;
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha=1;
}
function slabPath(inset){
  const S=Math.min(W,H);
  const cx=W*0.545, cy=H*0.47;
  const mw=S*0.46, mh=S*0.58, skew=S*0.03;
  const x0=cx-mw/2+inset, x1=cx+mw/2-inset;
  const y0=cy-mh/2+inset*1.2, y1=cy+mh/2-inset*1.2;
  ctx.beginPath();
  ctx.moveTo(x0+skew*(inset===0?1:1), y0);
  ctx.lineTo(x1+skew, y0);
  ctx.lineTo(x1, y1);
  ctx.lineTo(x0, y1);
  ctx.closePath();
}
function drawMonolith(blend,t){
  if(blend<=0.003) return;
  slabPath(0);
  ctx.fillStyle=SLAB; ctx.globalAlpha=blend;
  ctx.fill();
  ctx.lineWidth=1;
  for(let k=1;k<=13;k++){
    const wob=Math.sin(t*0.8+k*0.7)*1.6;
    slabPath(k*8+wob);
    ctx.strokeStyle=(k===6)?RED:PAPER;
    ctx.globalAlpha=blend*(k===6?0.75:Math.max(0.06,0.5-k*0.032));
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function cycleBlend(tSec){
  const u=((tSec%25)+25)%25;
  if(u<8.5) return 0;
  if(u<12.5) return smooth((u-8.5)/4);
  if(u<21) return 1;
  return 1-smooth((u-21)/4);
}
let lastMs=null;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(w!==W||h!==H){ W=w; H=h; seedRoots(); const pre=Math.min(Math.ceil(H/stepLen()*1.2), Math.ceil(CAP*0.85/MAXTIPS)); for(let s=0;s<pre;s++) growStep(); }
  if(!dragging && dragOff!==0){ dragOff*=Math.pow(0.03,dt); if(Math.abs(dragOff)<0.003) dragOff=0; }
  frame++;
  if(frame%2===0) growStep();
  const t=nowMs/1000;
  const blend=clamp(cycleBlend(t)+dragOff,0,1);
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,w,h);
  drawGarden(1-blend);
  drawMonolith(blend,t);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; dragX0=e.clientX; dragOff0=dragOff; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; const [w]=viewportWH(); dragOff=clamp(dragOff0+(e.clientX-dragX0)/w*1.8,-1,1); });
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
// First frame is drawn mid-dissolve (10.6s into the cycle) so the staged frame
// shows both regimes trading places, which is the subject of the piece.
drawFrame(10600);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
