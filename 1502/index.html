<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing Discarded</title>
<style>
  html, body { margin: 0; padding: 0; background: #6b4a3a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (prompt only, no other color).
  var WALNUT = '#6b4a3a', CREAM = '#e8e0d0', SLATE = '#4a5a7a', CHARCOAL = '#2a2a30';
  var GOLD = '#d9a441', TEAL = '#2e6f6a', BRICK = '#a8674a', GREY = '#b8bcc0';

  // Seeded PRNG (mulberry32, seed 1502000). Used only for fixed speckle
  // positions generated once at load, never per frame.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1502000);
  var speckles = [];
  for (var s = 0; s < 60; s++) {
    speckles.push([rnd(), rnd(), rnd()]);
  }

  var LOOP = 48;      // full return loop, seconds
  var CROSS = 16;     // one figure crossing, seconds (3 crossings per loop)
  var W = 0, H = 0, U = 0, isPhone = false;
  var startT = null;
  var curT = 0;

  function viewportSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        window.visualViewport.width && window.visualViewport.height) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return [w, h];
  }
  function detectPhone(w, h) {
    var minDim = 1e9;
    if (typeof window !== 'undefined' && window.screen &&
        window.screen.width && window.screen.height) {
      minDim = Math.min(window.screen.width, window.screen.height);
    }
    if (minDim < 700) return true;
    return h > w * 1.15;
  }
  function resize() {
    var wh = viewportSize();
    W = wh[0]; H = wh[1]; U = Math.min(W, H);
    isPhone = detectPhone(W, H);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) {
      window.addEventListener('resize', resize);
    }
  }
  resize();

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function a4(v) { return Math.round(v * 10000) / 10000; }
  function rect(x, y, w, h, col) {
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w, h);
  }
  // A dot as its own path: moveTo first, then arc (node-canvas quirk).
  function dot(cx, cy, r, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(cx + r, cy);
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function disc(cx, cy, r, col) { dot(cx, cy, r, col); }

  // ---- Layout (pure functions of W, H) ----
  function panelRect() {
    var ph = isPhone ? H * 0.50 : H * 0.62;
    var pw;
    if (isPhone) {
      // Leave room for the side fringe strips plus a margin, so no strip
      // clips at the frame edge on narrow phones.
      var sz0 = stripSize(), gap0 = U * 0.03;
      pw = W - 2 * (sz0.w + gap0) - W * 0.04;
    } else {
      pw = W * 0.62;
    }
    return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph };
  }
  // Four offcuts: 0 doorway (top), 1 hand (right), 2 window (bottom), 3 road (left).
  var OFFCOLORS = [GOLD, TEAL, BRICK, GREY];
  function stripSize() {
    // Fringe strip size, from min dimension so it fits phone margins.
    return { w: U * 0.17, h: U * 0.115 };
  }
  function fringeRect(i) {
    var P = panelRect(), sz = stripSize(), gap = U * 0.03;
    if (i === 0) return { x: P.x + (P.w - sz.w) / 2, y: P.y - sz.h - gap, w: sz.w, h: sz.h };
    if (i === 1) return { x: P.x + P.w + gap, y: P.y + (P.h - sz.h) / 2, w: sz.w, h: sz.h };
    if (i === 2) return { x: P.x + (P.w - sz.w) / 2, y: P.y + P.h + gap, w: sz.w, h: sz.h };
    return { x: P.x - sz.w - gap, y: P.y + (P.h - sz.h) / 2, w: sz.w, h: sz.h };
  }
  function inRect(i) {
    // Where a strip plays inside the panel: upper-middle area, above the
    // figure's path, enlarged but never the main scene.
    var P = panelRect(), sz = stripSize();
    var w = sz.w * 1.45, h = sz.h * 1.45;
    return { x: P.x + (P.w - w) / 2, y: P.y + P.h * 0.14, w: w, h: h };
  }
  function lerpRect(a, b, t) {
    return {
      x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t,
      w: a.w + (b.w - a.w) * t, h: a.h + (b.h - a.h) * t
    };
  }

  // ---- Offcut schedule (loop-local time only) ----
  function crossingOf(lt) { return Math.floor(lt / CROSS); }
  function activeOffcut(lt) { return crossingOf(lt) % 4; }
  function schedS(i, t) {
    var lt = ((t % LOOP) + LOOP) % LOOP;
    if (activeOffcut(lt) !== i) return 0;
    var p = lt - crossingOf(lt) * CROSS; // 0..16 within the crossing
    if (p < 2) return smooth(p / 2);
    if (p < 8) return 1;
    if (p < 10) return 1 - smooth((p - 8) / 2);
    return 0;
  }

  // ---- Drag state: closed-form over the recorded event list ----
  var drags = [];       // completed drags: {i, downT, upT, sEnd}
  var activeDrag = null; // {i, downT, sDrag}
  function guestFor(i, t) {
    for (var k = drags.length - 1; k >= 0; k--) {
      var d = drags[k];
      if (d.i === i && d.guest && t >= d.upT && t < d.upT + 4.5) return d;
    }
    return null;
  }
  function dismissFor(i, t) {
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var k = crossingOf(lt);
    for (var j = drags.length - 1; j >= 0; j--) {
      var d = drags[j];
      if (d.i === i && d.dismissCrossing === k) return d;
    }
    return null;
  }
  function offcutS(i, t) {
    if (activeDrag && activeDrag.i === i) return activeDrag.sDrag;
    var g = guestFor(i, t);
    if (g) {
      if (t < g.upT + 3) return 1;
      var e = smooth((t - (g.upT + 3)) / 1.5);
      return (1 - e) * 1 + e * schedS(i, t);
    }
    if (dismissFor(i, t)) return 0;
    // Decay from the most recent completed ordinary drag toward schedule.
    for (var k = drags.length - 1; k >= 0; k--) {
      var d = drags[k];
      if (d.i === i && !d.guest && d.dismissCrossing === undefined && t >= d.upT) {
        var decay = Math.exp(-(t - d.upT) / 0.4);
        return schedS(i, t) + (d.sEnd - schedS(i, d.upT)) * decay;
      }
    }
    return schedS(i, t);
  }
  function offcutRectAt(i, t) {
    return lerpRect(fringeRect(i), inRect(i), offcutS(i, t));
  }

  // ---- Figure ----
  function figureX(lt) {
    var P = panelRect();
    var p = (lt % CROSS) / CROSS;
    return P.x + P.w * 0.10 + (P.w * 0.80) * p;
  }
  function figureY(lt) {
    var P = panelRect();
    var bob = Math.sin(2 * Math.PI * ((lt % CROSS) / 4)) * U * 0.004;
    return P.y + P.h * 0.78 + bob;
  }

  // ---- Motifs (palette only, no text) ----
  function drawMotif(i, r) {
    var col = OFFCOLORS[i];
    rect(r.x, r.y, r.w, r.h, col);
    // Thin charcoal edge so the strip reads on walnut and cream alike.
    ctx.strokeStyle = CHARCOAL; ctx.lineWidth = Math.max(1, U * 0.003);
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    if (i === 0) {
      // Doorway: charcoal frame, cream interior, walnut dot handle.
      var fw = r.w * 0.10;
      rect(r.x + r.w * 0.18, r.y + r.h * 0.16, fw, r.h * 0.68, CHARCOAL);
      rect(r.x + r.w * 0.82 - fw, r.y + r.h * 0.16, fw, r.h * 0.68, CHARCOAL);
      rect(r.x + r.w * 0.18, r.y + r.h * 0.16, r.w * 0.64, fw, CHARCOAL);
      rect(r.x + r.w * 0.28, r.y + r.h * 0.26, r.w * 0.44, r.h * 0.58, CREAM);
      dot(r.x + r.w * 0.66, r.y + r.h * 0.55, Math.max(2, r.w * 0.03), WALNUT);
    } else if (i === 1) {
      // Hand: cream palm disc, four finger rects, charcoal wrist.
      var cx = r.x + r.w * 0.5, cy = r.y + r.h * 0.58;
      disc(cx, cy, r.w * 0.16, CREAM);
      for (var f = 0; f < 4; f++) {
        rect(cx - r.w * 0.15 + f * r.w * 0.085, r.y + r.h * 0.14, r.w * 0.055, r.h * 0.30, CREAM);
      }
      rect(cx - r.w * 0.06, r.y + r.h * 0.72, r.w * 0.12, r.h * 0.20, CHARCOAL);
    } else if (i === 2) {
      // Window: charcoal frame, cream panes, charcoal cross.
      rect(r.x + r.w * 0.14, r.y + r.h * 0.14, r.w * 0.72, r.h * 0.72, CHARCOAL);
      rect(r.x + r.w * 0.20, r.y + r.h * 0.20, r.w * 0.60, r.h * 0.60, CREAM);
      rect(r.x + r.w * 0.47, r.y + r.h * 0.20, r.w * 0.06, r.h * 0.60, CHARCOAL);
      rect(r.x + r.w * 0.20, r.y + r.h * 0.47, r.w * 0.60, r.h * 0.06, CHARCOAL);
    } else {
      // Road: charcoal diagonal band with cream dashes.
      var band = r.h * 0.30, y0 = r.y + r.h * 0.35;
      ctx.fillStyle = CHARCOAL;
      ctx.beginPath();
      ctx.moveTo(r.x, y0 + band);
      ctx.lineTo(r.x + r.w, y0);
      ctx.lineTo(r.x + r.w, y0 + band);
      ctx.lineTo(r.x, y0 + band * 2);
      ctx.closePath(); ctx.fill();
      for (var d = 0; d < 4; d++) {
        rect(r.x + r.w * (0.12 + d * 0.22), y0 + band * 0.55, r.w * 0.10, Math.max(2, r.h * 0.08), CREAM);
      }
    }
  }

  function draw(t) {
    curT = t;
    resize();
    var lt = ((t % LOOP) + LOOP) % LOOP;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var P = panelRect();

    // Table: walnut ground, full frame, with seeded speckle flecks.
    rect(0, 0, W, H, WALNUT);
    ctx.fillStyle = CHARCOAL;
    for (var s = 0; s < speckles.length; s++) {
      var sp = speckles[s];
      ctx.globalAlpha = a4(0.05 + sp[2] * 0.06);
      ctx.fillRect(sp[0] * W, sp[1] * H, 2, 2);
    }
    ctx.globalAlpha = 1;

    // Central panel: cream room.
    rect(P.x, P.y, P.w, P.h, CREAM);
    ctx.strokeStyle = CHARCOAL; ctx.lineWidth = Math.max(1, U * 0.003);
    ctx.strokeRect(P.x + 0.5, P.y + 0.5, P.w - 1, P.h - 1);
    // Room: slate floor band, charcoal wall cabinet (upper left, clear of
    // the figure's path), slate wall window (upper right, U-sized so it
    // never turns into a tall slit on portrait phones).
    rect(P.x, P.y + P.h * 0.78, P.w, P.h * 0.22, SLATE);
    rect(P.x + P.w * 0.06, P.y + P.h * 0.28, U * 0.11, U * 0.10, CHARCOAL);
    var winW = U * 0.09, winH = U * 0.14;
    var winX = P.x + P.w - winW - P.w * 0.06, winY = P.y + P.h * 0.14;
    rect(winX, winY, winW, winH, SLATE);
    ctx.strokeStyle = CHARCOAL; ctx.lineWidth = Math.max(1, U * 0.003);
    ctx.strokeRect(winX + 0.5, winY + 0.5, winW - 1, winH - 1);

    // Crossing figure: small, abstract, slate with charcoal head.
    var fx = figureX(lt), fy = figureY(lt);
    var fw = U * 0.045, fh = U * 0.11;
    rect(fx - fw * 0.28, fy - fh, fw * 0.56, fh * 0.62, SLATE); // torso
    rect(fx - fw * 0.28, fy - fh * 0.38, fw * 0.24, fh * 0.38, CHARCOAL); // leg L
    rect(fx + fw * 0.04, fy - fh * 0.38, fw * 0.24, fh * 0.38, CHARCOAL); // leg R
    disc(fx, fy - fh - U * 0.018, U * 0.018, CHARCOAL); // head
    rect(fx + fw * 0.10, fy - fh * 0.72, fw * 0.42, U * 0.008, SLATE); // arm

    // Offcut strips: fringe first, then in-play order by slide amount so
    // the most-entered strip paints last.
    var order = [0, 1, 2, 3];
    order.sort(function (a, b) { return offcutS(a, t) - offcutS(b, t); });
    for (var k = 0; k < 4; k++) {
      var i = order[k];
      drawMotif(i, offcutRectAt(i, t));
    }
  }

  // ---- Pointer: drag maps pointer position to an offcut's state ----
  function pointerPos(e) {
    if (typeof e.offsetX === 'number' && typeof e.offsetY === 'number') {
      return { x: e.offsetX, y: e.offsetY };
    }
    return { x: e.clientX || 0, y: e.clientY || 0 };
  }
  function hitOffcut(x, y, t) {
    for (var i = 0; i < 4; i++) {
      var r = offcutRectAt(i, t);
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
    }
    return -1;
  }
  function dragSFromPoint(i, x, y) {
    var f = fringeRect(i), p = inRect(i);
    var fx = f.x + f.w / 2, fy = f.y + f.h / 2;
    var px = p.x + p.w / 2, py = p.y + p.h / 2;
    var dx = px - fx, dy = py - fy;
    var len2 = dx * dx + dy * dy;
    if (len2 === 0) return 0;
    var s = ((x - fx) * dx + (y - fy) * dy) / len2;
    return clamp(s, 0, 1);
  }
  function onDown(e) {
    var pos = pointerPos(e);
    var i = hitOffcut(pos.x, pos.y, curT);
    if (i >= 0) {
      activeDrag = { i: i, downT: curT, sDrag: dragSFromPoint(i, pos.x, pos.y) };
    }
  }
  function onMove(e) {
    if (!activeDrag) return;
    var pos = pointerPos(e);
    activeDrag.sDrag = dragSFromPoint(activeDrag.i, pos.x, pos.y);
  }
  function onUp(e) {
    if (!activeDrag) return;
    var d = activeDrag; activeDrag = null;
    var sEnd = d.sDrag;
    var rec = { i: d.i, downT: d.downT, upT: curT, sEnd: sEnd };
    // Dragged in early while scheduled fringe: it plays, then returns.
    if (sEnd >= 0.7 && schedS(d.i, curT) < 0.5) rec.guest = true;
    // Dragged away while scheduled in-play: sent back to the fringe for
    // the rest of this crossing.
    if (sEnd <= 0.3 && schedS(d.i, curT) > 0.5) {
      rec.dismissCrossing = crossingOf(((curT % LOOP) + LOOP) % LOOP);
    }
    drags.push(rec);
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);

  // First frame: fixed phase, drawn synchronously at load.
  draw(0);

  function loop(ts) {
    if (startT === null) startT = ts;
    draw((ts - startT) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  // Probe surface (used only by the QA harness, never drawn).
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw, loop: loop,
      offcutS: offcutS, schedS: schedS,
      activeOffcut: function (t) { return activeOffcut(((t % LOOP) + LOOP) % LOOP); },
      figureX: function (t) { return figureX(((t % LOOP) + LOOP) % LOOP); },
      offcutRect: function (i) { return offcutRectAt(i, curT); },
      fringeRect: fringeRect, inRect: inRect, panelRect: panelRect,
      LOOP: LOOP, CROSS: CROSS
    };
  }
})();
</script>
</body>
</html>
