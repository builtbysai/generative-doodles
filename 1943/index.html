<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1943 The Organ Diary</title>
<style>
  html, body { margin: 0; padding: 0; background: #201d18; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // The Organ Diary, KD8 / PP1190, study #253 kit-downes.
  // A travel diary that turns its own pages. Each spread is one named
  // organ in one city, drawn as a console sketch with its fault list
  // in red pencil. The diary advances on its own slow clock; each
  // spread's fault is visibly at work in the sketch, and the previous
  // spread's fault keeps sputtering across the page turn. When the
  // last organ is reached the diary closes and rests; it never loops
  // back to the start.
  var PAPER = '#f2ead6';    // diary paper cream, Gruneberg spread
  var PAPER_BASEL = '#e8eae4'; // Basel, cool
  var PAPER_LAURENS = '#e9e8e1'; // Laurenskerk, cool slate cream
  var PAPER_COLOGNE = '#f6e4bd'; // Cologne, warm
  var INK = '#241f18';     // console sketches
  var INK_SOFT = '#4a4238'; // secondary ink
  var RED = '#b23a2a';     // faults, red pencil
  var RED_SOFT = '#c65a48';
  var BLACK = '#141210';   // city and organ names, bold black
  var GREY = '#8a8172';    // a pipe dropped out
  var COVER = '#2e3a30';   // closed diary cover, deep green cloth
  var COVER_INK = '#f2ead6';
  var GROUND = '#201d18';  // page ground outside the diary

  // Timeline, seconds. Each spread shows for 14 s, then a 3 s page
  // curl. Spread 3 is the last: its turn is the closing of the diary
  // (65 to 68 s), then the closed diary rests, forever.
  var SPREAD_DUR = 14, CURL_DUR = 3, CYCLE = 17;
  var CLOSE_START = 65, CLOSED_AT = 68;

  // Fixed-phase first frame: FIRST_T = 7 s. At t = 7 the diary is
  // mid first spread (Gruneberg), the mixture rank mid sputter, and
  // no page is turning, so frame one shows the diary open and alive.
  var FIRST_T = 7;

  // Seeded PRNG, mulberry32. Fresh instances per draw from the piece
  // number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Deterministic hash in [0, 1) from an integer, for fault switching.
  function hash01(n) {
    var h = Math.imul(n | 0, 2654435761) ^ 1943;
    h = Math.imul(h ^ (h >>> 13), 0x5bd1e995);
    h ^= h >>> 15;
    return ((h >>> 0) % 10000) / 10000;
  }

  // QA probe params from location.search: ?seed= varies the paper
  // flecks, ?sx= and ?sy= place a small red pencil probe mark.
  var seedBase = 1943, probeX = -1, probeY = -1;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m;
    m = qs.match(/[?&]seed=(-?\d+)/);
    if (m) { seedBase = parseInt(m[1], 10) || 1943; }
    m = qs.match(/[?&]sx=([0-9.]+)/);
    if (m) { probeX = parseFloat(m[1]); }
    m = qs.match(/[?&]sy=([0-9.]+)/);
    if (m) { probeY = parseFloat(m[1]); }
  } catch (e) {}

  // The four spreads. Only the organs named in the prompt. Dates are
  // diary-entry dates staged from the gallery date, day one 8 May.
  // No builders' names appear anywhere: none were named in the prompt.
  var SPREADS = [
    {
      organ: 'Grüneberg', date: '8 May 2007', paper: PAPER, tint: 'neutral cream',
      faults: ['broken mixture', 'rank drops out, then returns', 'sputter, then silence, then return'],
      note: 'the mixture sputters, then returns, as if nothing happened.',
      still: ''
    },
    {
      organ: 'Stadtcasino Basel', date: '9 May 2007', paper: PAPER_BASEL, tint: 'Basel cool',
      faults: ['wind pressure games', 'bellows breathe unevenly', 'pitch wavers with the wind'],
      note: 'the wind wavers; the pipes follow.',
      still: 'still: the mixture sputters on.'
    },
    {
      organ: 'Laurenskerk', date: '10 May 2007', paper: PAPER_LAURENS, tint: 'cool slate',
      faults: ['the 4-manual leviathan', 'keys ripple down the top manual', 'four manuals, one breath'],
      note: 'four manuals, one leviathan, and the keys keep rippling.',
      still: 'still: the wind wavers.'
    },
    {
      organ: 'Cologne Dom', date: '11 May 2007', paper: PAPER_COLOGNE, tint: 'Cologne warm',
      faults: ['the most magical environment', 'the room itself sings', 'shimmer in the stone'],
      note: 'the most magical environment, and the diary rests here.',
      still: 'still: the keys ripple.'
    }
  ];

  // Seeded pipe heights, fixed at load. Nothing here depends on t.
  var PIPE_H = [];
  (function buildSeeded() {
    var rng = mulberry32(seedBase);
    var i;
    for (i = 0; i < 9; i++) { PIPE_H.push(0.45 + rng() * 0.55); }
  })();

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var dragging = false, downX = 0, downY = 0, lastDragX = 0;
  var lastT = FIRST_T;
  var skipTotal = 0; // seconds skipped by early page turns (drag)

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  // Layout, recomputed in resize() and read by draw().
  var L = {};
  function layout() {
    var headerH = Math.round(H * 0.09);
    var hintH = Math.round(H * 0.05);
    var dx0 = Math.round(W * 0.03), dx1 = Math.round(W * 0.97);
    var dy0 = headerH + 8, dy1 = H - hintH - 6;
    var spineX = (dx0 + dx1) / 2;
    L = {
      headerH: headerH, hintH: hintH,
      dx0: dx0, dx1: dx1, dy0: dy0, dy1: dy1, spineX: spineX,
      diaryW: dx1 - dx0, diaryH: dy1 - dy0
    };
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
    layout();
  }

  // ---- Timeline. te is the effective diary time (raw t plus skips).
  function spreadAt(te) {
    if (te >= CLOSED_AT) { return { phase: 'closed', spread: 3, p: 1 }; }
    if (te >= CLOSE_START) { return { phase: 'close', spread: 3, p: (te - CLOSE_START) / (CLOSED_AT - CLOSE_START) }; }
    var i = Math.floor(te / CYCLE);
    var within = te - i * CYCLE;
    if (within < SPREAD_DUR) { return { phase: 'show', spread: i, p: within / SPREAD_DUR }; }
    return { phase: 'curl', spread: i, next: i + 1, p: (within - SPREAD_DUR) / CURL_DUR };
  }

  // ---- Paper flecks, seeded per spread, still.
  function drawFlecks(spread, x0, y0, w, h) {
    var rng = mulberry32(seedBase * 10 + spread * 131);
    var i;
    for (i = 0; i < 34; i++) {
      var fx = x0 + rng() * w, fy = y0 + rng() * h;
      ctx.fillStyle = hexA(INK, a4(0.03 + rng() * 0.04));
      ctx.beginPath(); ctx.moveTo(fx + 1.2, fy); ctx.arc(fx, fy, 0.6 + rng() * 0.9, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---- Small helpers for hand-drawn ink.
  function inkRect(x, y, w, h, fill) {
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w, h);
  }
  function inkLine(x0, y0, x1, y1, color, lw) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  // A hand-drawn red pencil ellipse: two slightly offset arcs.
  function redEllipse(cx, cy, rx, ry, seed, alpha) {
    var rng = mulberry32(seed);
    var j1 = (rng() - 0.5) * rx * 0.08, j2 = (rng() - 0.5) * ry * 0.08;
    ctx.strokeStyle = hexA(RED, a4(alpha));
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cx + rx + j1, cy); ctx.ellipse(cx + j1, cy + j2, rx, ry, 0.03, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = hexA(RED_SOFT, a4(alpha * 0.7));
    ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(cx + rx * 0.96 - j1, cy + 1); ctx.ellipse(cx - j1, cy - j2, rx * 0.96, ry * 0.97, -0.02, 0, Math.PI * 2); ctx.stroke();
  }
  function redX(cx, cy, r) {
    ctx.strokeStyle = hexA(RED, 0.9);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
    ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
    ctx.stroke();
  }
  // Word wrap for note lines.
  function wrapLines(text, maxW) {
    var words = text.split(' ');
    var lines = [], cur = '';
    var i;
    for (i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else { cur = test; }
    }
    if (cur) { lines.push(cur); }
    return lines;
  }

  // ---- Sketch 0: Gruneberg. Console with a mixture rank that sputters.
  // The mixture pipes drop out at irregular intervals, 3 Hz switching.
  function drawGruneberg(t, r) {
    var x = r.x, y = r.y, w = r.w, h = r.h;
    var caseY = y + h * 0.42, caseH = h * 0.30;
    // Organ case.
    ctx.fillStyle = hexA(INK, 0.06);
    ctx.fillRect(x + w * 0.06, caseY, w * 0.88, caseH);
    ctx.strokeStyle = hexA(INK, 0.85);
    ctx.lineWidth = 1.6;
    ctx.strokeRect(x + w * 0.06, caseY, w * 0.88, caseH);
    // Pipe ranks above the case: 9 pipes, the middle three the mixture.
    var i, px, ph, pw = w * 0.055, gap = w * 0.095;
    for (i = 0; i < 9; i++) {
      px = x + w * 0.10 + i * gap;
      var isMix = (i >= 3 && i <= 5);
      var baseH = h * 0.34 * PIPE_H[i];
      if (isMix) {
        // Sputter: each mixture pipe drops out on its own 3 Hz hash.
        var off = hash01(Math.floor(t * 3) * 17 + i * 11 + 5) < 0.38;
        if (off) {
          ctx.fillStyle = hexA(GREY, 0.75);
          ctx.fillRect(px, caseY - baseH * 0.55, pw, baseH * 0.55);
          redX(px + pw / 2, caseY - baseH * 0.55 - 7, 4);
          continue;
        }
        // Lit mixture pipe, with a red flicker dot at its foot.
        var fl = 0.5 + 0.5 * Math.sin(t * 6 + i * 2.2);
        ctx.fillStyle = INK;
        ctx.fillRect(px, caseY - baseH, pw, baseH);
        ctx.fillStyle = hexA(RED, a4(0.35 + 0.45 * fl));
        ctx.beginPath(); ctx.moveTo(px + pw / 2 + 2.5, caseY - 3); ctx.arc(px + pw / 2, caseY - 3, 2.5, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = INK;
        ctx.fillRect(px, caseY - baseH, pw, baseH);
      }
      // Pipe mouths.
      ctx.fillStyle = hexA(INK, 0.8);
      ctx.fillRect(px, caseY - baseH, pw, 2.5);
    }
    // Red pencil circle around the mixture rank, fitted to the pipes.
    var mixL = x + w * 0.10 + 3 * gap, mixR = x + w * 0.10 + 5 * gap + pw;
    var mixTop = caseY;
    for (i = 3; i <= 5; i++) {
      var topJ = caseY - h * 0.34 * PIPE_H[i];
      if (topJ < mixTop) { mixTop = topJ; }
    }
    redEllipse((mixL + mixR) / 2, (mixTop + caseY) / 2, (mixR - mixL) / 2 + 12, (caseY - mixTop) / 2 + 14, 194301, 0.85);
    // Keyboard: two rows of keys at the case front.
    var kbY = caseY + caseH * 0.55, kbH = caseH * 0.32, kw = w * 0.80 / 7;
    var k;
    for (k = 0; k < 7; k++) {
      ctx.fillStyle = '#f7f2e4';
      ctx.fillRect(x + w * 0.10 + k * kw, kbY, kw - 1, kbH);
      ctx.strokeStyle = hexA(INK, 0.6);
      ctx.lineWidth = 1;
      ctx.strokeRect(x + w * 0.10 + k * kw, kbY, kw - 1, kbH);
    }
    var blackAt = [0, 1, 3, 4, 5];
    for (k = 0; k < blackAt.length; k++) {
      var bx = x + w * 0.10 + (blackAt[k] + 1) * kw - kw * 0.28;
      ctx.fillStyle = INK;
      ctx.fillRect(bx, kbY, kw * 0.55, kbH * 0.6);
    }
    // One key held down, slowly, by the sputter's rhythm.
    var held = Math.floor(t * 1.5) % 7;
    ctx.fillStyle = hexA(INK, 0.35);
    ctx.fillRect(x + w * 0.10 + held * kw, kbY + 2, kw - 1, kbH - 2);
  }

  // ---- Sketch 1: Stadtcasino Basel. Bellows breathe; the wind wavers.
  function drawBasel(t, r) {
    var x = r.x, y = r.y, w = r.w, h = r.h;
    var chestY = y + h * 0.38, chestH = h * 0.10;
    // Bellows at the bottom: a box whose height breathes slowly, with
    // zigzag folds inside, like a concertina opening and closing.
    var breath = 0.5 + 0.5 * Math.sin(t * 0.45);
    var belTop = y + h * 0.70;
    var belH = h * 0.09 + breath * h * 0.05;
    var belBot = belTop + belH;
    ctx.fillStyle = hexA(INK, 0.06);
    ctx.fillRect(x + w * 0.14, belTop, w * 0.72, belH);
    ctx.strokeStyle = hexA(INK, 0.85);
    ctx.lineWidth = 1.6;
    ctx.strokeRect(x + w * 0.14, belTop, w * 0.72, belH);
    // Zigzag folds: three shallow Vs across the box.
    var f;
    ctx.strokeStyle = hexA(INK, 0.55);
    ctx.lineWidth = 1.2;
    for (f = 1; f <= 3; f++) {
      var fy = belTop + belH * f / 4;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.14, fy);
      ctx.lineTo(x + w * 0.50, fy + 5);
      ctx.lineTo(x + w * 0.86, fy);
      ctx.stroke();
    }
    // Wind chest.
    ctx.fillStyle = hexA(INK, 0.06);
    ctx.fillRect(x + w * 0.10, chestY, w * 0.80, chestH);
    ctx.strokeStyle = hexA(INK, 0.85);
    ctx.lineWidth = 1.6;
    ctx.strokeRect(x + w * 0.10, chestY, w * 0.80, chestH);
    // Pipes above the chest: heights waver with the wind.
    var waver = 0.5 + 0.5 * Math.sin(t * 0.23);
    var i, px, pw = w * 0.06, gapX = w * 0.115;
    for (i = 0; i < 7; i++) {
      px = x + w * 0.12 + i * gapX;
      var wob = Math.sin(t * 0.9 + i * 1.3) * h * 0.035 * (0.4 + 0.6 * waver);
      var ph = h * 0.30 * PIPE_H[i] + wob;
      ctx.fillStyle = INK;
      ctx.fillRect(px, chestY - ph, pw, ph);
      ctx.fillStyle = hexA(INK, 0.8);
      ctx.fillRect(px, chestY - ph, pw, 2.5);
    }
    // Red pencil pressure wave, a smooth line riding just above the
    // tallest pipe top, swelling with the wind.
    var maxH = 0;
    for (i = 0; i < 7; i++) { if (PIPE_H[i] > maxH) { maxH = PIPE_H[i]; } }
    ctx.strokeStyle = hexA(RED, 0.85);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    var wx;
    for (wx = 0; wx <= 40; wx++) {
      var fx = x + w * 0.10 + (wx / 40) * w * 0.80;
      var wy = chestY - h * 0.30 * maxH - 10 + Math.sin(fx * 0.05 + t * 1.1) * 3 * (0.5 + waver);
      if (wx === 0) { ctx.moveTo(fx, wy); } else { ctx.lineTo(fx, wy); }
    }
    ctx.stroke();
    // Red circle around the bellows, the fault's home, fitted to the box.
    redEllipse(x + w * 0.50, (belTop + belBot) / 2, w * 0.40, belH / 2 + 12, 194302, 0.8);
  }

  // ---- Sketch 2: Laurenskerk. Four manuals; a ripple runs the top one.
  function drawLaurenskerk(t, r) {
    var x = r.x, y = r.y, w = r.w, h = r.h;
    // Tall pipe tower behind the manuals.
    var i, px, pw = w * 0.06, gapX = w * 0.115;
    for (i = 0; i < 7; i++) {
      px = x + w * 0.12 + i * gapX;
      var ph = h * 0.30 * PIPE_H[i];
      ctx.fillStyle = hexA(INK, 0.9);
      ctx.fillRect(px, y + h * 0.30 - ph, pw, ph);
    }
    inkLine(x + w * 0.08, y + h * 0.30, x + w * 0.92, y + h * 0.30, hexA(INK, 0.7), 1.4);
    // Four stacked manuals.
    var manY0 = y + h * 0.36, manH = h * 0.085, manGap = h * 0.035;
    var m, k, kw = w * 0.80 / 10;
    for (m = 0; m < 4; m++) {
      var my = manY0 + m * (manH + manGap);
      ctx.fillStyle = hexA(INK, 0.05);
      ctx.fillRect(x + w * 0.10, my, w * 0.80, manH);
      for (k = 0; k < 10; k++) {
        var depressed = false;
        if (m === 0) {
          // The ripple: a wave of depressed keys travels the top manual.
          depressed = Math.sin(t * 1.3 - k * 0.55) > 0.55;
        } else if (m === 1) {
          depressed = Math.sin(t * 1.3 - k * 0.55 - 1.2) > 0.75;
        }
        var kx = x + w * 0.10 + k * kw;
        ctx.fillStyle = depressed ? hexA(INK, 0.45) : '#f7f2e4';
        ctx.fillRect(kx, my + (depressed ? 2 : 0), kw - 1, manH - (depressed ? 2 : 0));
        ctx.strokeStyle = hexA(INK, 0.6);
        ctx.lineWidth = 1;
        ctx.strokeRect(kx, my, kw - 1, manH);
      }
      // Black keys on each manual.
      var blackAt = [0, 1, 3, 4, 5, 6, 8];
      for (k = 0; k < blackAt.length; k++) {
        var bx = x + w * 0.10 + (blackAt[k] + 1) * kw - kw * 0.3;
        ctx.fillStyle = INK;
        ctx.fillRect(bx, my, kw * 0.55, manH * 0.58);
      }
    }
    // Red bracket down the left of the stack, and a circle on the top manual.
    ctx.strokeStyle = hexA(RED, 0.85);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.06, manY0 - 4);
    ctx.lineTo(x + w * 0.03, manY0 - 4);
    ctx.lineTo(x + w * 0.03, manY0 + 4 * manH + 3 * manGap + 4);
    ctx.lineTo(x + w * 0.06, manY0 + 4 * manH + 3 * manGap + 4);
    ctx.stroke();
    redEllipse(x + w * 0.50, manY0 + manH / 2, w * 0.42, manH * 0.95, 194303, 0.8);
    // Pedal board, a quiet row at the bottom.
    var pedY = manY0 + 4 * manH + 3 * manGap + h * 0.05;
    for (k = 0; k < 9; k++) {
      ctx.fillStyle = hexA(INK, 0.75);
      ctx.fillRect(x + w * 0.14 + k * w * 0.082, pedY, w * 0.05, h * 0.03);
    }
  }

  // ---- Sketch 3: Cologne Dom. Tall facade, rose window, slow shimmer.
  function drawCologne(t, r) {
    var x = r.x, y = r.y, w = r.w, h = r.h;
    var roseCx = x + w * 0.50, roseCy = y + h * 0.20, roseR = w * 0.16;
    // Shimmer halo behind the rose window, breathing slowly.
    var shimmer = 0.5 + 0.5 * Math.sin(t * 0.4);
    var k;
    for (k = 0; k < 3; k++) {
      ctx.fillStyle = hexA('#d99a2b', a4(0.05 + 0.05 * shimmer * (1 - k * 0.25)));
      ctx.beginPath(); ctx.moveTo(roseCx + roseR * (1.25 + k * 0.35), roseCy); ctx.arc(roseCx, roseCy, roseR * (1.25 + k * 0.35), 0, Math.PI * 2); ctx.fill();
    }
    // Rose window: circle with eight spokes.
    ctx.strokeStyle = hexA(INK, 0.9);
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(roseCx + roseR, roseCy); ctx.arc(roseCx, roseCy, roseR, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.2;
    var s;
    for (s = 0; s < 8; s++) {
      var a = s * Math.PI / 4 + 0.2;
      inkLine(roseCx, roseCy, roseCx + Math.cos(a) * roseR, roseCy + Math.sin(a) * roseR, hexA(INK, 0.75), 1.2);
    }
    ctx.fillStyle = hexA(INK, 0.85);
    ctx.beginPath(); ctx.moveTo(roseCx + 3, roseCy); ctx.arc(roseCx, roseCy, 3, 0, Math.PI * 2); ctx.fill();
    // Red sparkle at the rose window, the magic made visible.
    var sp = 0.5 + 0.5 * Math.sin(t * 0.9);
    ctx.strokeStyle = hexA(RED, a4(0.5 + 0.4 * sp));
    ctx.lineWidth = 1.6;
    var sx = roseCx + roseR * 0.85, sy = roseCy - roseR * 0.8;
    ctx.beginPath();
    ctx.moveTo(sx - 6, sy); ctx.lineTo(sx + 6, sy);
    ctx.moveTo(sx, sy - 6); ctx.lineTo(sx, sy + 6);
    ctx.stroke();
    // Pointed arch frame.
    var archY = y + h * 0.36;
    ctx.strokeStyle = hexA(INK, 0.9);
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.10, y + h * 0.88);
    ctx.lineTo(x + w * 0.10, archY + h * 0.10);
    ctx.quadraticCurveTo(x + w * 0.10, archY, x + w * 0.50, archY - h * 0.06);
    ctx.quadraticCurveTo(x + w * 0.90, archY, x + w * 0.90, archY + h * 0.10);
    ctx.lineTo(x + w * 0.90, y + h * 0.88);
    ctx.stroke();
    // Facade pipes inside the arch, wavering almost imperceptibly.
    var i, px, pw = w * 0.06, gapX = w * 0.115;
    for (i = 0; i < 7; i++) {
      var waver = Math.sin(t * 0.7 + i * 1.1) * 1.6;
      px = x + w * 0.12 + i * gapX + waver;
      var ph = h * 0.42 * PIPE_H[i];
      var topY = y + h * 0.86 - ph;
      ctx.fillStyle = INK;
      ctx.fillRect(px, topY, pw, ph);
      ctx.fillStyle = hexA(INK, 0.8);
      ctx.fillRect(px, topY, pw, 2.5);
      // A glint that slides down the tallest pipes.
      if (i === 3 || i === 4) {
        var gl = ((t * 0.12 + i * 0.3) % 1);
        ctx.fillStyle = hexA('#f7f2e4', a4(0.5 * (1 - gl)));
        ctx.fillRect(px + 1, topY + gl * ph * 0.7, pw - 2, 3);
      }
    }
  }

  var SKETCHES = [drawGruneberg, drawBasel, drawLaurenskerk, drawCologne];

  // ---- Fault echo: for the first 2 s of a new spread, a faint red
  // scribble of the previous spread's fault lingers in the margin,
  // so the old fault is still sputtering as the new page opens.
  function drawFaultEcho(prev, age, r) {
    if (age >= 2) { return; }
    var alpha = 0.5 * (1 - age / 2);
    var ex = r.x + r.w * 0.82, ey = r.y + 8;
    ctx.strokeStyle = hexA(RED, a4(alpha));
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    if (prev === 0) {
      // Two small red crosses, the dropped mixture pipes.
      ctx.moveTo(ex - 4, ey - 4); ctx.lineTo(ex + 4, ey + 4);
      ctx.moveTo(ex + 4, ey - 4); ctx.lineTo(ex - 4, ey + 4);
      ctx.moveTo(ex + 12, ey - 4); ctx.lineTo(ex + 20, ey + 4);
      ctx.moveTo(ex + 20, ey - 4); ctx.lineTo(ex + 12, ey + 4);
    } else if (prev === 1) {
      // A wavy pressure line.
      var wx;
      for (wx = 0; wx <= 20; wx++) {
        var fx = ex + wx, fy = ey + Math.sin(wx * 0.4) * 3;
        if (wx === 0) { ctx.moveTo(fx, fy); } else { ctx.lineTo(fx, fy); }
      }
    } else {
      // Ripple ticks.
      var tx;
      for (tx = 0; tx < 4; tx++) {
        ctx.moveTo(ex + tx * 6, ey + 4 - tx);
        ctx.lineTo(ex + tx * 6, ey - 4 - tx);
      }
    }
    ctx.stroke();
  }

  // ---- One spread: left page sketch, right page fault list and notes.
  function drawSpread(i, t, te) {
    var sp = SPREADS[i];
    var dx0 = L.dx0, dx1 = L.dx1, dy0 = L.dy0, dy1 = L.dy1;
    var spineX = L.spineX;
    var pad = Math.max(8, Math.round(W * 0.018));

    // Paper.
    ctx.fillStyle = sp.paper;
    ctx.fillRect(dx0, dy0, L.diaryW, L.diaryH);
    // Page edge shadow at the spine.
    var grad = ctx.createLinearGradient(spineX - 14, 0, spineX + 14, 0);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.5, 'rgba(0,0,0,0.10)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(spineX - 14, dy0, 28, L.diaryH);
    // Outer diary border.
    ctx.strokeStyle = hexA(INK, 0.55);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(dx0 + 0.5, dy0 + 0.5, L.diaryW - 1, L.diaryH - 1);
    // Spine line.
    inkLine(spineX, dy0, spineX, dy1, hexA(INK, 0.35), 1);
    drawFlecks(i, dx0, dy0, L.diaryW, L.diaryH);

    var fsName = Math.round(17 * clamp(W / 560, 0.8, 1.15));
    var fsFault = Math.round(13.5 * clamp(W / 560, 0.8, 1.1));
    var fsNote = Math.round(12.5 * clamp(W / 560, 0.8, 1.1));
    var fsDate = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsTiny = Math.round(10.5 * clamp(W / 560, 0.85, 1.1));

    // ---- Left page: date line, then the console sketch.
    var lx0 = dx0 + pad, lx1 = spineX - pad;
    var lw = lx1 - lx0;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = hexA(RED, 0.9);
    ctx.font = 'italic ' + fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(sp.date, lx0, dy0 + 8 + fsDate);
    ctx.fillStyle = hexA(INK_SOFT, 0.8);
    ctx.font = fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('spread ' + (i + 1) + ' of 4', lx0, dy1 - 10);
    var sketchRect = { x: lx0, y: dy0 + 14 + fsDate + 8, w: lw, h: dy1 - (dy0 + 14 + fsDate + 8) - 26 };
    SKETCHES[i](t, sketchRect);
    // Fault echo from the previous spread, first 2 s only.
    if (i > 0) {
      var age = te - i * CYCLE;
      drawFaultEcho(i - 1, age, sketchRect);
    }

    // ---- Right page: organ name in bold black, faults in red pencil.
    var rx0 = spineX + pad, rx1 = dx1 - pad;
    var rw = rx1 - rx0;
    var ry = dy0 + 10;
    ctx.fillStyle = BLACK;
    var nameFs = fsName;
    ctx.font = '700 ' + nameFs + 'px Georgia, "Times New Roman", serif';
    while (ctx.measureText(sp.organ).width > rw && nameFs > 11) {
      nameFs -= 1;
      ctx.font = '700 ' + nameFs + 'px Georgia, "Times New Roman", serif';
    }
    ctx.fillText(sp.organ, rx0, ry + nameFs);
    ry += nameFs + 10;
    inkLine(rx0, ry, rx1, ry, hexA(INK, 0.4), 1);
    ry += 8;
    ctx.fillStyle = hexA(RED, 0.92);
    ctx.font = 'italic ' + fsFault + 'px Georgia, "Times New Roman", serif';
    var f;
    for (f = 0; f < sp.faults.length; f++) {
      ctx.fillText(sp.faults[f], rx0, ry + fsFault);
      ry += fsFault + 7;
    }
    ry += 6;
    ctx.fillStyle = hexA(INK, 0.85);
    ctx.font = 'italic ' + fsNote + 'px Georgia, "Times New Roman", serif';
    var noteLines = wrapLines(sp.note, rw);
    for (f = 0; f < noteLines.length; f++) {
      ctx.fillText(noteLines[f], rx0, ry + fsNote);
      ry += fsNote + 5;
    }
    // The previous fault, still at work, noted in red at the foot.
    if (sp.still) {
      ry += 8;
      ctx.fillStyle = hexA(RED, 0.85);
      ctx.font = 'italic ' + fsNote + 'px Georgia, "Times New Roman", serif';
      var stillLines = wrapLines(sp.still, rw);
      for (f = 0; f < stillLines.length; f++) {
        ctx.fillText(stillLines[f], rx0, ry + fsNote);
        ry += fsNote + 5;
      }
    }
    // Three-organ crawl map on the last spread: three dots, one route.
    if (i === 3) {
      var mapY = dy1 - 78;
      ctx.strokeStyle = hexA(INK, 0.7);
      ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(rx0 + 12, mapY + 34);
      ctx.lineTo(rx0 + rw * 0.5, mapY + 12);
      ctx.lineTo(rx1 - 12, mapY + 30);
      ctx.stroke();
      ctx.setLineDash([]);
      var dots = [[12, 34], [rw * 0.5, 12], [rw - 12, 30]];
      var d;
      for (d = 0; d < dots.length; d++) {
        ctx.fillStyle = INK;
        ctx.beginPath(); ctx.moveTo(rx0 + dots[d][0] + 4, mapY + dots[d][1]); ctx.arc(rx0 + dots[d][0], mapY + dots[d][1], 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f7f2e4';
        ctx.beginPath(); ctx.moveTo(rx0 + dots[d][0] + 1.5, mapY + dots[d][1]); ctx.arc(rx0 + dots[d][0], mapY + dots[d][1], 1.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = hexA(RED, 0.9);
      ctx.font = 'italic ' + fsDate + 'px Georgia, "Times New Roman", serif';
      ctx.fillText('three-organ crawl', rx0, mapY + 58);
    }
    // Page tint label, tiny, bottom right of the right page.
    ctx.fillStyle = hexA(INK_SOFT, 0.7);
    ctx.font = fsTiny + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'right';
    ctx.fillText(sp.tint, rx1, dy1 - 10);
    ctx.textAlign = 'left';
  }

  // ---- The closed diary cover.
  function drawCover(p) {
    var dx0 = L.dx0, dx1 = L.dx1, dy0 = L.dy0, dy1 = L.dy1;
    var coverX = lerp(dx1, dx0, p);
    ctx.fillStyle = COVER;
    ctx.fillRect(coverX, dy0, dx1 - coverX, L.diaryH);
    if (p > 0.55) {
      var alpha = clamp((p - 0.55) / 0.45, 0, 1);
      var cx = (coverX + dx1) / 2;
      var fsTitle = Math.round(24 * clamp(W / 560, 0.8, 1.15));
      var fsSub = Math.round(fsTitle * 0.55);
      ctx.textAlign = 'center';
      ctx.fillStyle = hexA(COVER_INK, a4(alpha));
      ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
      ctx.fillText('The Organ Diary', cx, dy0 + L.diaryH * 0.42);
      ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
      ctx.fillText('№1943 · 2007 · 05 · 08', cx, dy0 + L.diaryH * 0.42 + fsSub + 12);
      ctx.font = 'italic ' + Math.round(fsSub * 0.8) + 'px Georgia, "Times New Roman", serif';
      ctx.fillText('four organs, four faults', cx, dy0 + L.diaryH * 0.42 + fsSub * 2 + 22);
      // A small red pencil mark on the cover, the diary's own seal.
      ctx.strokeStyle = hexA(RED, a4(0.8 * alpha));
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(cx - 14, dy0 + L.diaryH * 0.62);
      ctx.lineTo(cx + 14, dy0 + L.diaryH * 0.62);
      ctx.moveTo(cx, dy0 + L.diaryH * 0.62 - 8);
      ctx.lineTo(cx, dy0 + L.diaryH * 0.62 + 8);
      ctx.stroke();
      ctx.textAlign = 'left';
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var te = t + skipTotal;
    lastT = t;

    var st = spreadAt(te);
    // Ground: the current spread's paper, or the cover green when closed.
    ctx.fillStyle = st.phase === 'closed' ? COVER : SPREADS[st.spread].paper;
    if (st.phase === 'curl') { ctx.fillStyle = SPREADS[st.next].paper; }
    ctx.fillRect(0, 0, W, H);
    // Soft shadow around the diary block.
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(L.dx0 + 4, L.dy0 + 5, L.diaryW, L.diaryH);

    // ---- Plates: title top-left, number and date, tagline top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    var fsTick = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = st.phase === 'closed' ? COVER_INK : INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Organ Diary', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(st.phase === 'closed' ? COVER_INK : INK, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1943 · 2007 · 05 · 08', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(st.phase === 'closed' ? COVER_INK : INK, 0.6);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('four organs, four faults', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.textAlign = 'left';

    // ---- The diary itself.
    if (st.phase === 'show') {
      drawSpread(st.spread, t, te);
    } else if (st.phase === 'curl') {
      // Incoming spread underneath, fully drawn with its fault at work.
      drawSpread(st.next, t, te);
      // Outgoing spread, clipped to the narrowing leaf.
      var p = st.p;
      if (p < 0.5) {
        var q = p / 0.5;
        var curlX = lerp(L.dx1, L.spineX, q);
        ctx.save();
        ctx.beginPath();
        ctx.rect(L.spineX, L.dy0, Math.max(0, curlX - L.spineX), L.diaryH);
        ctx.clip();
        drawSpread(st.spread, t, te);
        ctx.restore();
        // Curl shadow on the incoming page, just past the leaf edge.
        var sh = ctx.createLinearGradient(curlX, 0, curlX + 34, 0);
        sh.addColorStop(0, 'rgba(0,0,0,0.28)');
        sh.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sh;
        ctx.fillRect(curlX, L.dy0, 34, L.diaryH);
        // The leaf edge itself, a bright paper line.
        inkLine(curlX, L.dy0, curlX, L.dy1, hexA('#fbf6e8', 0.9), 2);
      } else {
        // The leaf settles onto the left page: the same content, with
        // a moving soft shadow, reads as the page coming to rest.
        var q2 = (p - 0.5) / 0.5;
        var setX = lerp(L.spineX, L.dx0, q2);
        var sh2 = ctx.createLinearGradient(setX - 26, 0, setX, 0);
        sh2.addColorStop(0, 'rgba(0,0,0,0)');
        sh2.addColorStop(1, 'rgba(0,0,0,0.22)');
        ctx.fillStyle = sh2;
        ctx.fillRect(setX - 26, L.dy0, 26, L.diaryH);
        inkLine(setX, L.dy0, setX, L.dy1, hexA('#fbf6e8', 0.7), 1.5);
      }
    } else if (st.phase === 'close') {
      drawSpread(3, t, te);
      drawCover(st.p);
    } else {
      drawCover(1);
    }

    // ---- Hint, centered at the bottom.
    ctx.fillStyle = hexA(st.phase === 'closed' ? COVER_INK : INK, 0.85);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fsTick * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(st.phase === 'closed' ? 'The diary is closed; it rests here.' : 'Watch the diary turn; drag to turn a page early.', W / 2, H - 16);
    ctx.textAlign = 'left';

    // ---- QA probe mark, only when ?sx= and ?sy= are given.
    if (probeX >= 0 && probeY >= 0) {
      var px = probeX * W, py = probeY * H;
      ctx.strokeStyle = hexA(RED, 0.9);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px + 9, py); ctx.arc(px, py, 9, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(px - 4, py); ctx.lineTo(px + 4, py);
      ctx.moveTo(px, py - 4); ctx.lineTo(px, py + 4);
      ctx.stroke();
    }
  }

  function perfT() { return lastT; }

  // Drag: a leftward drag turns the page early. It never changes what
  // is on the pages, and it never turns the diary back.
  function advancePage() {
    var teNow = lastT + skipTotal;
    var st = spreadAt(teNow);
    var target = -1;
    if (st.phase === 'show') {
      target = (st.spread < 3) ? (st.spread * CYCLE + SPREAD_DUR) : CLOSE_START;
    } else if (st.phase === 'curl') {
      target = (st.spread + 1) * CYCLE;
    } else if (st.phase === 'close') {
      target = CLOSED_AT;
    }
    if (target < 0) { return; }
    skipTotal += target - teNow;
    draw(reduced ? FIRST_T : perfT());
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      try { if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) { canvas.setPointerCapture(e.pointerId); } } catch (err) {}
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      var rect = { left: 0, top: 0 };
      try { rect = canvas.getBoundingClientRect(); } catch (e2) {}
      downX = e.clientX - rect.left;
      downY = e.clientY - rect.top;
      lastDragX = downX;
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      var rect = { left: 0, top: 0 };
      try { rect = canvas.getBoundingClientRect(); } catch (e2) {}
      lastDragX = e.clientX - rect.left;
    });
    window.addEventListener('pointerup', function () {
      if (dragging && (lastDragX - downX) < -50) { advancePage(); }
      dragging = false;
    });
    window.addEventListener('pointercancel', function () { dragging = false; });
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock, and
  // window.__piece1943 exposes the timeline for probes.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1943 = {
      spreadAt: spreadAt,
      redraw: function (t) { draw(t); },
      advancePage: advancePage,
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop: the diary turns on its own slow clock. All motion is
  // slow, well under the 14 Hz ceiling. Guarded so node-canvas QA
  // (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
