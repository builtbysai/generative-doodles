<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.431 First Light</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1B2340; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.431 First Light (yaelhofri, EXPANSION #46).
// After Yael Hofri's Menorah Magic mechanism: a brass
// menorah on deep indigo night, its nine candles
// lighting one by one, each flame a small warm halo.
// Ceremonial and quiet, not decorative. No other
// objects, no garnish, no text.
//
// The lighting ceremony IS the loop: a 36s master
// loop. The nine candles light one at a time at fixed
// 1.2s staggers from the loop start (the shamash
// first, then the eight branch candles left to
// right); each grows ember -> full flame over 1.2s,
// so all nine are fully alight by 10.8s. Each flame
// blooms a halo of 3 stepped flat-alpha concentric
// discs (the prompt's radial glow rendered flat, per
// the house rule). Once lit, all nine sway together
// on 2s cycles (18 per loop), each flame flickering
// on two sine phases whose periods divide the loop.
// At the seam the flames go dark and the ceremony
// begins again. DOUBLE-TAP replays the ceremony from
// dark immediately, on the piece clock. WATCH-ONLY
// apart from that one gesture.
//
// Frame one is drawn at the constant phase T = 9.0s,
// mid-ceremony: seven candles fully lit, the eighth
// at half growth, the ninth still dark. The clock is
// anchored there and advances in fixed 1/60 ticks,
// never from a wall clock, so the thumbnail
// reproduces byte-identically. Flat colour only, one
// canvas, no offscreen canvas, no shadowBlur, no
// gradients.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Deep indigo night, brass and its shadow, flame and
// its pale core, halo amber, the dark table, ember.
// Nothing else.
var NIGHT = '#1B2340', BRASS = '#C9A24B', SHADOW = '#8A6A2E';
var FLAME = '#FFC83D', CORE = '#FFF3D6', HALO = '#F5A623';
var TABLE = '#2A1F3D', EMBER = '#F08C3C';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 36;
if (LOOP !== 36) throw new Error('First Light loop must be 36s');
var TICK = 1 / 60;
var TABLE_Y = 780;
var CX = 640;

// QA probes via the house seed pattern: ?seed=dark
// starts at the ceremony's first moment and ?seed=lit
// starts with all nine candles lit and swaying, so
// both ends of the loop can be render-checked. The
// shipped default is mid-ceremony at T_OFF = 9.0s.
var seedStr = (typeof location !== 'undefined' && location.search) ? location.search : '';
var T_OFF = 9.0;
if (seedStr.indexOf('dark') >= 0) T_OFF = 0.4;
if (seedStr.indexOf('lit') >= 0) T_OFF = 20.0;

// ---- small draw helpers ---------------------------------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function circ(x, y, r, fill, alpha) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) {
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    ctx.fillStyle = fill; ctx.fill();
    ctx.restore();
  }
}
function ell(x, y, rx, ry, fill, alpha) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) {
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    ctx.fillStyle = fill; ctx.fill();
    ctx.restore();
  }
}
function line(x0, y0, x1, y1, col, lw) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function smooth(p) { return p * p * (3 - 2 * p); }
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// ---- the nine candles ------------------------------------
// Candle 0 is the shamash, raised at the centre of the
// stem. Candles 1-8 are the branch candles, left to
// right. slot is the ceremony moment each candle
// begins to light; growth runs 1.2s, so the last
// candle (slot 9.6) is fully alight at 10.8s.
var GROW = 1.2, STAGGER = 1.2;
var CANDLES = [
  { x: CX,       cupY: 268, shamash: true,  slot: 0.0, phi: 0.0, psi: 0.6 },
  { x: CX - 384, cupY: 316, shamash: false, slot: 1.2, phi: 0.9, psi: 2.3 },
  { x: CX - 288, cupY: 316, shamash: false, slot: 2.4, phi: 1.8, psi: 4.0 },
  { x: CX - 192, cupY: 316, shamash: false, slot: 3.6, phi: 2.7, psi: 5.7 },
  { x: CX - 96,  cupY: 316, shamash: false, slot: 4.8, phi: 3.6, psi: 7.4 },
  { x: CX + 96,  cupY: 316, shamash: false, slot: 6.0, phi: 4.5, psi: 9.1 },
  { x: CX + 192, cupY: 316, shamash: false, slot: 7.2, phi: 5.4, psi: 10.8 },
  { x: CX + 288, cupY: 316, shamash: false, slot: 8.4, phi: 6.3, psi: 12.5 },
  { x: CX + 384, cupY: 316, shamash: false, slot: 9.6, phi: 7.2, psi: 14.2 }
];
if (CANDLES.length !== 9) throw new Error('First Light needs exactly nine candles');
for (var ci = 0; ci < 9; ci++) {
  if (Math.abs(CANDLES[ci].slot - ci * STAGGER) > 1e-9) throw new Error('candle slots must stagger 1.2s');
}
// Each flame stands on a short cream candle stick in a
// brass cup. flameBase is the wick tip the flame grows
// from: cup rim minus stick height.
function flameBase(c) { return c.cupY - 42; }

// per-candle state read from the loop phase
function growth(c, ph) {
  return smooth(clamp01((ph - c.slot) / GROW));
}
function swayOf(c, ph) {
  // one sway cycle every 2s, phase fixed per flame
  return Math.sin(Math.PI * 2 * ph / 2 + c.phi);
}
function flickOf(c, ph) {
  // 2-phase flicker: the 2s sway phase plus a 1.2s
  // phase; both periods divide the 36s loop exactly.
  return 1 + 0.045 * Math.sin(Math.PI * 2 * ph / 2 + c.phi) +
             0.032 * Math.sin(Math.PI * 2 * ph / 1.2 + c.psi);
}

// ---- the menorah ------------------------------------------
function branchPath(s, k) {
  // one branch arc: from its cup down and in to the
  // stem. s is -1 (left) or +1 (right), k is 1..4 from
  // the centre out. Outer branches meet the stem lower,
  // so the four arcs nest.
  var cupX = CX + s * 96 * k, cupY = 322;
  var endY = 498 + k * 15;
  ctx.beginPath();
  ctx.moveTo(cupX, cupY);
  ctx.bezierCurveTo(cupX, 452, CX + s * 44, 428 + k * 12, CX, endY);
}
function drawBranches() {
  var s, k;
  // shadow pass, offset down-right
  ctx.save();
  ctx.translate(3, 4);
  ctx.strokeStyle = SHADOW; ctx.lineWidth = 15; ctx.lineCap = 'round';
  for (s = -1; s <= 1; s += 2) for (k = 1; k <= 4; k++) { branchPath(s, k); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = BRASS; ctx.lineWidth = 11; ctx.lineCap = 'round';
  for (s = -1; s <= 1; s += 2) for (k = 1; k <= 4; k++) { branchPath(s, k); ctx.stroke(); }
}
function drawStemAndBase() {
  // soft contact shadow on the table
  ell(CX, TABLE_Y + 8, 196, 14, NIGHT, 0.5);
  // stem, from the shamash cup down to the base dome
  ctx.fillStyle = BRASS;
  rr(CX - 13, 274, 26, 472, 9); ctx.fill();
  // two quiet shadow rings on the stem
  ctx.fillStyle = SHADOW;
  ctx.save(); ctx.globalAlpha = 0.55;
  ctx.fillRect(CX - 13, 516, 26, 5);
  ctx.fillRect(CX - 13, 690, 26, 5);
  ctx.restore();
  // stem knob
  circ(CX, 622, 22, BRASS);
  ctx.beginPath(); ctx.arc(CX, 622, 22, 0, Math.PI * 2);
  ctx.strokeStyle = SHADOW; ctx.lineWidth = 3; ctx.stroke();
  circ(CX, 622, 6, SHADOW);
  // base: dome over a stepped foot
  ctx.fillStyle = BRASS;
  ctx.beginPath(); ctx.arc(CX, 746, 36, Math.PI, 0); ctx.closePath(); ctx.fill();
  rr(CX - 112, 744, 224, 18, 6); ctx.fill();
  rr(CX - 152, 762, 304, 18, 6); ctx.fill();
  // shadow line under the foot's top step
  ctx.fillStyle = SHADOW;
  ctx.save(); ctx.globalAlpha = 0.5;
  ctx.fillRect(CX - 112, 758, 224, 4);
  ctx.restore();
}
function drawCupAndStick(c) {
  var x = c.x, cupY = c.cupY;
  // cup: a small brass bowl on the branch end (or, for
  // the shamash, on the stem top)
  ctx.fillStyle = SHADOW;
  ctx.beginPath();
  ctx.moveTo(x - 16, cupY - 4); ctx.lineTo(x + 16, cupY - 4);
  ctx.lineTo(x + 10, cupY + 12); ctx.lineTo(x - 10, cupY + 12);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = BRASS;
  ctx.beginPath();
  ctx.moveTo(x - 16, cupY - 8); ctx.lineTo(x + 16, cupY - 8);
  ctx.lineTo(x + 10, cupY + 8); ctx.lineTo(x - 10, cupY + 8);
  ctx.closePath(); ctx.fill();
  ell(x, cupY - 8, 16, 4.5, BRASS);
  // candle stick: cream, from the cup up to the wick
  ctx.fillStyle = CORE;
  rr(x - 5.5, flameBase(c) + 4, 11, cupY - 8 - flameBase(c) - 2, 3); ctx.fill();
  // wick
  line(x, flameBase(c) + 5, x, flameBase(c), SHADOW, 2.5);
}

// ---- halos and flames --------------------------------------
var HALO_STEPS = 3;
if (HALO_STEPS !== 3) throw new Error('halos are 3 stepped discs');
function drawHalo(c, ph) {
  var g = growth(c, ph);
  if (g <= 0) return;
  var fb = flameBase(c);
  var hx = c.x + swayOf(c, ph) * 1.6 * g;
  var hy = fb - 26 * g;
  // 3 stepped flat-alpha discs, widest faintest
  circ(hx, hy, 66 * g, HALO, 0.05);
  circ(hx, hy, 45 * g, HALO, 0.09);
  circ(hx, hy, 28 * g, HALO, 0.14);
}
function drawFlame(c, ph) {
  var g = growth(c, ph);
  var fb = flameBase(c);
  if (g <= 0) return;
  // ember stage: a small ember dot at the wick while
  // the flame is still growing in
  if (g < 0.45) {
    circ(c.x, fb - 2, 2.5 + 4 * g, EMBER, 0.35 + 0.65 * g);
  }
  if (g < 0.12) return;
  var h = 50 * g * flickOf(c, ph);
  var w = 22 * g;
  var tipX = c.x + swayOf(c, ph) * 3.4 * g;
  // outer flame: a teardrop leaning with the sway
  ctx.beginPath();
  ctx.moveTo(c.x - w / 2, fb);
  ctx.bezierCurveTo(c.x - w / 2, fb - h * 0.38, tipX - w * 0.16, fb - h * 0.72, tipX, fb - h);
  ctx.bezierCurveTo(tipX + w * 0.16, fb - h * 0.72, c.x + w / 2, fb - h * 0.38, c.x + w / 2, fb);
  ctx.closePath();
  ctx.fillStyle = FLAME; ctx.fill();
  // pale core, the same teardrop at half scale
  var ch = h * 0.52, cw = w * 0.5;
  var ctipX = c.x + (tipX - c.x) * 0.5;
  ctx.beginPath();
  ctx.moveTo(c.x - cw / 2, fb - 2);
  ctx.bezierCurveTo(c.x - cw / 2, fb - 2 - ch * 0.38, ctipX - cw * 0.16, fb - 2 - ch * 0.72, ctipX, fb - 2 - ch);
  ctx.bezierCurveTo(ctipX + cw * 0.16, fb - 2 - ch * 0.72, c.x + cw / 2, fb - 2 - ch * 0.38, c.x + cw / 2, fb - 2);
  ctx.closePath();
  ctx.fillStyle = CORE; ctx.fill();
}

// ---- draw ---------------------------------------------------
function draw() {
  var ph = T % LOOP;
  // night over the whole design space, then the table.
  // Both fills run far past the design edges so the
  // letterbox on a tall phone stays night above and
  // table below, with no seam.
  ctx.fillStyle = NIGHT;
  ctx.fillRect(-2000, -2000, DW + 4000, DH + 4000);
  ctx.fillStyle = TABLE;
  ctx.fillRect(-2000, TABLE_Y, DW + 4000, DH - TABLE_Y + 4000);
  line(-2000, TABLE_Y, DW + 2000, TABLE_Y, SHADOW, 3);
  // halos first, so the brass stands in front of the glow
  for (var i = 0; i < 9; i++) drawHalo(CANDLES[i], ph);
  drawBranches();
  drawStemAndBase();
  for (var j = 0; j < 9; j++) drawCupAndStick(CANDLES[j]);
  for (var k = 0; k < 9; k++) drawFlame(CANDLES[k], ph);
}

// ---- step -----------------------------------------------------
function step() { /* state is a pure function of T plus tap history */ }

// ---- pointer: double-tap replays the ceremony -----------------
// Tap timing uses the piece clock, as elsewhere in the
// lane, so interaction never touches a wall clock. A
// replay rewinds T to the loop seam, so the phase is 0
// and the candles are dark again.
var downX = -1, downY = -1, downT = 0;
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved >= 28 || held >= 0.8) return;
  var ddx = p.x - lastTapX, ddy = p.y - lastTapY;
  if (T - lastTapT <= 0.45 && Math.sqrt(ddx * ddx + ddy * ddy) < 90) {
    T = T - (T % LOOP);
    lastTapT = -10;
  } else {
    lastTapT = T; lastTapX = p.x; lastTapY = p.y;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; });

// ---- sizing: CENTRED fit ---------------------------------------
// The menorah keeps its shape at any size; the page
// ground is the night indigo, so the letterbox bands
// read as more night.
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- clock -------------------------------------------------------
// T starts at the constant phase T_OFF and advances in
// fixed 1/60 ticks; frame one is drawn synchronously at
// T_OFF exactly, so the thumbnail reproduces
// byte-identically from the shipped script.
var T = T_OFF, acc = 0, lastNow = -1;
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // page ground: the night indigo across the whole canvas
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = NIGHT;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
