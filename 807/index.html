<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>A to Dot to Ring</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F4F2EC; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // No.807 "A to Dot to Ring" (EXPANSION #98 olivier-mosset, PP8).
  // Mosset's 1965-66 reduction in three panels: the letter A (1965),
  // the black dot, the centered black ring (1966). Three square panels
  // side by side on one continuous strip, black on white, hairline
  // dividers, hard edges: the decisions stay separate, nothing morphs.
  // Drag sideways to scrub the strip; the view rests on the ring and
  // eases slowly back to the ring after any drag that ends elsewhere.

  var INK = "#141414";        // the one black
  var GROUND = "#F4F2EC";     // the one white
  // Divider: a hairline mix of the two, 30% ink over the ground.
  var DIVIDER = "rgba(20,20,20,0.30)";

  var REST = 2;               // rest scroll position: the ring panel
  var SMIN = 0, SMAX = 2;     // scroll range in panel units (A .. ring)
  var TAU = 0.8;              // return-to-ring settle constant (s)

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var mn = Math.min(sw || 1e9, sh || 1e9);
    if (mn < 700) return true;
    var s = viewSize();
    return s.h > s.w * 1.15;
  }

  function viewSize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    return { w: w, h: h };
  }

  function resize() {
    var s = viewSize();
    DPR = window.devicePixelRatio || 1;
    W = Math.round(s.w);
    H = Math.round(s.h);
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
  }

  // Panel side: the strip is three squares of this side, adjacent.
  // Sized off the frame's smaller dimension so roughly one panel
  // fills the view and the neighbours' slivers hint the strip runs on.
  function panelSide() {
    return Math.min(W, H) * (isPhone() ? 0.84 : 0.78);
  }

  // ---- interaction state: recorded samples, closed-form scroll ----
  // events: list of {type:'grab'|'move'|'release', t, x, base, s}
  // scrollAt(t) is a pure function of this list and t.
  var events = [];
  var dragging = false;

  function nowSec() {
    if (typeof performance !== "undefined" && performance.now) {
      return performance.now() / 1000;
    }
    return Date.now() / 1000;
  }
  var startT = nowSec();

  function clampScroll(s) {
    return s < SMIN ? SMIN : (s > SMAX ? SMAX : s);
  }

  // Critically damped settle toward the ring: monotone, no overshoot,
  // no bounce. The reduction re-asks itself, then the ring re-asserts.
  function settle(from, u) {
    if (u <= 0) return from;
    var k = 1 + u / TAU;
    return REST + (from - REST) * k * Math.exp(-u / TAU);
  }

  function grabIndex(i) {
    for (var j = i; j >= 0; j--) if (events[j].type === "grab") return j;
    return 0;
  }

  function scrollAt(t) {
    var s = REST;             // resting on the ring before any touch
    var mode = "rest";        // rest | drag | settle
    var relT = 0, relFrom = REST;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.t > t) break;
      if (e.type === "grab") {
        // grab freezes whatever the settle had reached at that instant
        s = (mode === "settle") ? settle(relFrom, e.t - relT) : s;
        mode = "drag";
        e.base = s;
      } else if (e.type === "move") {
        if (mode === "drag") {
          var grab = events[grabIndex(i)];
          // content follows the pointer 1:1: dragging left carries
          // the strip left and the later panels come into view
          s = clampScroll(grab.base - (e.x - grab.x) / panelSide());
          e.s = s;
        }
      } else if (e.type === "release") {
        if (mode === "drag") {
          mode = "settle";
          relT = e.t; relFrom = s;
        }
      }
    }
    if (mode === "settle") return settle(relFrom, t - relT);
    return s;
  }

  function pointerX(ev) {
    if (ev.touches && ev.touches.length) return ev.touches[0].clientX;
    if (ev.changedTouches && ev.changedTouches.length) return ev.changedTouches[0].clientX;
    return ev.clientX;
  }

  function onDown(ev) {
    events.push({ type: "grab", t: nowSec() - startT, x: pointerX(ev) });
    dragging = true;
    if (ev.preventDefault) ev.preventDefault();
  }
  function onMove(ev) {
    if (!dragging) return;
    events.push({ type: "move", t: nowSec() - startT, x: pointerX(ev) });
    if (ev.preventDefault) ev.preventDefault();
  }
  function onUp(ev) {
    if (!dragging) return;
    events.push({ type: "release", t: nowSec() - startT, x: pointerX(ev) });
    dragging = false;
    if (ev.preventDefault) ev.preventDefault();
  }

  if (canvas.addEventListener) {
    canvas.addEventListener("pointerdown", onDown);
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
    canvas.addEventListener("touchstart", onDown, { passive: false });
    canvas.addEventListener("touchmove", onMove, { passive: false });
    canvas.addEventListener("touchend", onUp, { passive: false });
    canvas.addEventListener("mousedown", onDown);
    canvas.addEventListener("mousemove", onMove);
    canvas.addEventListener("mouseup", onUp);
  }

  // ---- drawing ----

  function draw(t) {
    if (W === 0) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var S = panelSide();
    var cy = H / 2;
    var top = cy - S / 2;
    var s = scrollAt(t);

    // Panel i centre: frame centre when the scroll position equals i.
    function panelCX(i) { return W / 2 + (i - s) * S; }

    // Hairline edges: the left edge of each panel and the strip's
    // closing right edge, spanning the strip's height. Where they
    // cross the frame they mark the joins between the decisions.
    ctx.strokeStyle = DIVIDER;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 0; i <= 3; i++) {
      var ex = panelCX(i) - S / 2;
      if (ex < -1 || ex > W + 1) continue;
      ctx.moveTo(Math.round(ex) + 0.5, top);
      ctx.lineTo(Math.round(ex) + 0.5, top + S);
    }
    ctx.stroke();

    ctx.fillStyle = INK;
    ctx.strokeStyle = INK;

    // Panel 1 (scroll 0): the letter A, 1965. Bold grotesk, the one
    // piece of text in the piece because the prompt makes it the motif.
    var ax = panelCX(0);
    if (ax > -S && ax < W + S) {
      ctx.font = "700 " + Math.round(S * 0.58) + "px 'Helvetica Neue', Helvetica, Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("A", ax, cy + S * 0.03);
    }

    // Panel 2 (scroll 1): the dot. A filled circle, modest diameter.
    var dx = panelCX(1);
    if (dx > -S && dx < W + S) {
      ctx.beginPath();
      ctx.arc(dx, cy, S * 0.10, 0, Math.PI * 2);
      ctx.fill();
    }

    // Panel 3 (scroll 2): the ring, 1966. An outline, stroke 3.3%
    // of the panel side, the study's administrative measure.
    var rx = panelCX(2);
    if (rx > -S && rx < W + S) {
      ctx.beginPath();
      ctx.arc(rx, cy, S * 0.31, 0, Math.PI * 2);
      ctx.lineWidth = S * 0.033;
      ctx.stroke();
    }
  }

  function frame() {
    draw(nowSec() - startT);
    if (typeof requestAnimationFrame === "function") {
      requestAnimationFrame(frame);
    }
  }

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", function () { resize(); draw(nowSec() - startT); });
  }
  window.addEventListener("resize", function () { resize(); draw(nowSec() - startT); });

  // Frame one: the synchronous draw at t = 0, resting on the ring.
  draw(0);
  if (typeof requestAnimationFrame === "function") {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
