<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rigid Body</title>
<style>
  html, body { margin: 0; padding: 0; background: #070708; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (strict) ----------
  var STAGE = '#070708';
  var BARS = '#3A3D44';       // human view: matte aluminum
  var DOME_H = '#D8DADE';     // human view: plain unlit domes
  var DOME_M = '#FFFFFF';     // machine view: domes burning hot
  var WIRE = '#FF2E2E';       // machine view: wireframe constellations
  var PATH = '#1A2E4A';       // machine view: the cart's implied path
  var SPLIT = '#16171B';

  var LOOP = 48;              // seconds, seamless; the cart cycle is the loop
  var T0 = 13;                // frame one phase: cart mid-transit, right of center
  var FLARE_DUR = 0.7;
  var BASE_SEED = 1042203;

  var seed = BASE_SEED;
  var frames = [];            // 4 standing + 1 cart frame (index 4)
  var tapFlares = [];         // recorded events {obj, t0}
  var pieceT = T0;

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720;
  var phoneNow = false;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function fit() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    if (vv && vv.width) { W = vv.width; H = vv.height; }
    else if (typeof window !== 'undefined' && window.innerWidth) { W = window.innerWidth; H = window.innerHeight; }
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    phoneNow = isPhone();
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(pieceT); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { fit(); draw(pieceT); });
    }
  }

  // ---------- the inventory ----------
  // Seven domes per frame, fixed local positions (fractions of frame w/h,
  // origin at the frame's top-left): four corners, both side midpoints,
  // top-center. Small seeded jitter per build; the set never changes shape.
  var DOME_LOCAL = [
    { x: 0.0, y: 0.0 }, { x: 0.5, y: 0.0 }, { x: 1.0, y: 0.0 },
    { x: 1.0, y: 0.5 }, { x: 1.0, y: 1.0 }, { x: 0.0, y: 1.0 },
    { x: 0.0, y: 0.5 }
  ];
  // perimeter order for the wireframe loop
  var DOME_LOOP = [0, 1, 2, 3, 4, 5, 6];

  function buildInventory(s) {
    var rng = mulberry32(s);
    frames = [];
    var centers = [0.17, 0.39, 0.61, 0.83];
    for (var i = 0; i < 4; i++) {
      var jx = (rng() - 0.5) * 0.012;
      var jw = (rng() - 0.5) * 0.008;
      var jh = (rng() - 0.5) * 0.02;
      var domes = [];
      for (var d = 0; d < DOME_LOCAL.length; d++) {
        domes.push({
          x: DOME_LOCAL[d].x + (rng() - 0.5) * 0.03,
          y: DOME_LOCAL[d].y + (rng() - 0.5) * 0.03
        });
      }
      frames.push({
        cart: false,
        cx: centers[i] + jx, base: 0.80,
        w: 0.13 + jw, h: 0.52 + jh,
        domes: domes
      });
    }
    // the cart frame: same construction, riding the platform lane
    var cdomes = [];
    for (var d2 = 0; d2 < DOME_LOCAL.length; d2++) {
      cdomes.push({
        x: DOME_LOCAL[d2].x + (rng() - 0.5) * 0.03,
        y: DOME_LOCAL[d2].y + (rng() - 0.5) * 0.03
      });
    }
    frames.push({
      cart: true,
      cx: 0.5, base: 0.878,
      w: 0.115, h: 0.42,
      domes: cdomes
    });
  }

  // The cart ferries its frame across the stage and back: a triangle wave,
  // constant velocity, hard reversals, one full cycle per 48 s loop.
  // Phase offset 6 s puts the cart at world x = 0.698 at frame one (t = 13):
  // mid-transit on the outbound leg, right of center in both views.
  var CART_MIN = 0.16, CART_MAX = 0.84, CART_PHASE = 6;
  function cartX(t) {
    var u = (((t + CART_PHASE) % LOOP) + LOOP) % LOOP / LOOP;
    var tri = u < 0.5 ? u * 2 : 2 - u * 2;
    return CART_MIN + (CART_MAX - CART_MIN) * tri;
  }
  function cartDir(t) {
    var u = (((t + CART_PHASE) % LOOP) + LOOP) % LOOP / LOOP;
    return u < 0.5 ? 1 : -1;
  }

  // One shared scene state per instant: each frame's rect in world coords.
  // Both views draw from this same array, so sync is structural.
  function sceneAt(t) {
    var out = [];
    for (var i = 0; i < frames.length; i++) {
      var f = frames[i];
      var cx = f.cart ? cartX(t) : f.cx;
      out.push({
        x: cx - f.w / 2, y: f.base - f.h, w: f.w, h: f.h,
        cart: f.cart, domes: f.domes
      });
    }
    return out;
  }
  function domeWorld(rect, d) {
    return { x: rect.x + d.x * rect.w, y: rect.y + d.y * rect.h };
  }

  // ---------- flares (tap events only; the mocap locking on) ----------
  function flareEnvFor(objIdx, t) {
    var env = 0;
    for (var i = 0; i < tapFlares.length; i++) {
      if (tapFlares[i].obj !== objIdx) continue;
      var u = (t - tapFlares[i].t0) / FLARE_DUR;
      if (u >= 0 && u <= 1) env = Math.max(env, Math.pow(Math.sin(Math.PI * u), 2));
    }
    return env;
  }

  // ---------- interaction state ----------
  var pointer = { down: false, wx: 0, wy: 0, inRight: false };
  var downInfo = null;
  var lastTap = { t: -10, x: 0, y: 0 };

  // ---------- audio (lazy, guarded; first gesture only) ----------
  var AC = null, glideNodes = null, lastTickSlot = -1;
  function audio() {
    if (AC) return AC;
    var Ctor = null;
    if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
    else if (typeof window !== 'undefined' && window.webkitAudioContext) Ctor = window.webkitAudioContext;
    if (!Ctor) return null;
    try { AC = new Ctor(); } catch (e) { AC = null; }
    if (AC) startBed();
    return AC;
  }
  function startBed() {
    try {
      // human side: near-silence, a faint room tone
      var g = AC.createGain(); g.gain.value = 0.0032;
      var o1 = AC.createOscillator(); o1.type = 'sine'; o1.frequency.value = 52;
      var o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = 52.6;
      o1.connect(g); o2.connect(g); g.connect(AC.destination);
      o1.start(); o2.start();
      // the cart: a low electric glide, always rolling while sound lives
      var gg = AC.createGain(); gg.gain.value = 0.005;
      var og = AC.createOscillator(); og.type = 'triangle'; og.frequency.value = 64;
      og.connect(gg); gg.connect(AC.destination);
      og.start();
      glideNodes = { osc: og, gain: gg };
    } catch (e) { glideNodes = null; }
  }
  function blip(freq, dur, gain, type) {
    if (!AC) return;
    try {
      var t = AC.currentTime;
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* silent */ }
  }
  function tick() { blip(2300, 0.04, 0.010, 'square'); }
  function chime() { blip(1174, 0.28, 0.03); blip(1760, 0.34, 0.02); }
  function audioEvents(t) {
    if (!AC) return;
    // machine side: soft locking ticks, one per frame in rotation
    var slot = Math.floor(t / 2.4);
    if (slot !== lastTickSlot) { lastTickSlot = slot; tick(); }
    if (glideNodes) {
      try {
        glideNodes.osc.frequency.value = 64 + cartDir(t) * 3;
      } catch (e) { /* silent */ }
    }
  }

  // ---------- view mapping ----------
  // World is the unit square. Each half shows the whole scene, fit-centered.
  function viewMap(half) { // half: 0 left (human), 1 right (machine)
    var hw = W / 2;
    var s = Math.min(hw, H) * 0.94;
    return { ox: half * hw + hw / 2, oy: H / 2, s: s };
  }
  function toPx(vm, wx, wy) {
    return { x: vm.ox + (wx - 0.5) * vm.s, y: vm.oy + (wy - 0.5) * vm.s };
  }
  function clipHalf(vm) {
    ctx.beginPath(); ctx.rect(vm.ox - (W / 2) / 2, 0, W / 2, H); ctx.clip();
  }

  var FLOOR_Y = 0.80;   // standing frames' floor line
  var LANE_Y = 0.90;    // cart lane floor

  // ---------- human view: matte bars, plain domes, calm ----------
  function drawHuman(vm, scene) {
    ctx.save();
    clipHalf(vm);
    // floor lines
    ctx.strokeStyle = SPLIT; ctx.globalAlpha = 1; ctx.lineWidth = 1.5;
    var f0 = toPx(vm, 0.03, FLOOR_Y), f1 = toPx(vm, 0.97, FLOOR_Y);
    ctx.beginPath(); ctx.moveTo(f0.x, f0.y); ctx.lineTo(f1.x, f1.y); ctx.stroke();
    var l0 = toPx(vm, 0.03, LANE_Y), l1 = toPx(vm, 0.97, LANE_Y);
    ctx.beginPath(); ctx.moveTo(l0.x, l0.y); ctx.lineTo(l1.x, l1.y); ctx.stroke();
    for (var i = 0; i < scene.length; i++) {
      var r = scene[i];
      var tl = toPx(vm, r.x, r.y), br = toPx(vm, r.x + r.w, r.y + r.h);
      var bw = Math.max(2.5, 0.016 * vm.s); // bar thickness
      ctx.fillStyle = BARS; ctx.globalAlpha = 0.95;
      if (r.cart) {
        // the platform: a low bar with two wheels, the frame riding on it
        var pw = r.w * 1.45;
        var pcx = (tl.x + br.x) / 2;
        var platY = br.y; // frame base = platform top
        ctx.fillRect(pcx - pw / 2, platY, pw, Math.max(3, 0.02 * vm.s));
        var wr = Math.max(2.5, 0.011 * vm.s);
        ctx.beginPath(); ctx.arc(pcx - pw * 0.32, platY + Math.max(3, 0.02 * vm.s) + wr * 0.7, wr, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(pcx + pw * 0.32, platY + Math.max(3, 0.02 * vm.s) + wr * 0.7, wr, 0, Math.PI * 2); ctx.fill();
      }
      // the frame: four matte bars
      ctx.fillRect(tl.x, tl.y, br.x - tl.x, bw);              // top
      ctx.fillRect(tl.x, br.y - bw, br.x - tl.x, bw);         // bottom
      ctx.fillRect(tl.x, tl.y, bw, br.y - tl.y);              // left
      ctx.fillRect(br.x - bw, tl.y, bw, br.y - tl.y);         // right
      // the domes: plain, unlit
      ctx.fillStyle = DOME_H; ctx.globalAlpha = 0.9;
      var dr = Math.max(2.2, 0.009 * vm.s);
      for (var d = 0; d < r.domes.length; d++) {
        var dw = domeWorld(r, r.domes[d]);
        var dp = toPx(vm, dw.x, dw.y);
        ctx.beginPath(); ctx.arc(dp.x, dp.y, dr, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---------- machine view: burning domes, red wireframes ----------
  function drawMachine(vm, scene, t) {
    ctx.save();
    clipHalf(vm);
    // the cart's implied path, tinted along its lane
    var p0 = toPx(vm, CART_MIN - 0.10, LANE_Y - 0.028), p1 = toPx(vm, CART_MAX + 0.10, LANE_Y + 0.012);
    ctx.fillStyle = PATH; ctx.globalAlpha = 0.55;
    ctx.fillRect(p0.x, p0.y, p1.x - p0.x, p1.y - p0.y);
    ctx.globalAlpha = 1;
    // floor lines, barely there
    ctx.strokeStyle = SPLIT; ctx.lineWidth = 1.5;
    var f0 = toPx(vm, 0.03, FLOOR_Y), f1 = toPx(vm, 0.97, FLOOR_Y);
    ctx.beginPath(); ctx.moveTo(f0.x, f0.y); ctx.lineTo(f1.x, f1.y); ctx.stroke();
    for (var i = 0; i < scene.length; i++) {
      var r = scene[i];
      // occlusion: domes hidden under the finger on this side
      var hidden = [], hiddenCount = 0;
      for (var d = 0; d < r.domes.length; d++) {
        var dw0 = domeWorld(r, r.domes[d]);
        var hid = false;
        if (pointer.down && pointer.inRight) {
          var dx = dw0.x - pointer.wx, dy = dw0.y - pointer.wy;
          if (dx * dx + dy * dy < 0.085 * 0.085) hid = true;
        }
        hidden.push(hid);
        if (hid) hiddenCount++;
      }
      // a rigid body that loses most of its domes wobbles, then re-locks
      var wob = null;
      if (hiddenCount * 2 > r.domes.length) {
        wob = { x: 0.006 * Math.sin(t * 41 + i * 7), y: 0.006 * Math.cos(t * 47 + i * 3) };
      }
      var pts = [];
      for (var d2 = 0; d2 < r.domes.length; d2++) {
        var dw1 = domeWorld(r, r.domes[d2]);
        if (wob) { dw1 = { x: dw1.x + wob.x, y: dw1.y + wob.y }; }
        pts.push({ p: toPx(vm, dw1.x, dw1.y), hid: hidden[d2] });
      }
      var tl = pts[0].p, brc = pts[4].p;
      if (wob) { /* corners already carry the wobble through the dome points */ }
      // wireframe: the rectangle the system reads, through its domes
      ctx.strokeStyle = WIRE; ctx.globalAlpha = 0.8;
      ctx.lineWidth = Math.max(1.6, 0.005 * vm.s);
      ctx.beginPath();
      for (var k = 0; k < DOME_LOOP.length; k++) {
        var a = pts[DOME_LOOP[k]], b = pts[DOME_LOOP[(k + 1) % DOME_LOOP.length]];
        if (a.hid || b.hid) continue;
        ctx.moveTo(a.p.x, a.p.y); ctx.lineTo(b.p.x, b.p.y);
      }
      ctx.stroke();
      // the cart reads as a constellation in transit: its platform wire
      if (r.cart) {
        var pc = toPx(vm, (wob ? cartX(t) + wob.x : cartX(t)), LANE_Y);
        var pw2 = r.w * 1.45 * vm.s;
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.moveTo(pc.x - pw2 / 2, pc.y - 0.022 * vm.s);
        ctx.lineTo(pc.x + pw2 / 2, pc.y - 0.022 * vm.s);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // the domes: burning, layered-alpha halo (no gradients)
      var env = flareEnvFor(i, t);
      for (var d3 = 0; d3 < pts.length; d3++) {
        if (pts[d3].hid) continue;
        var p = pts[d3].p;
        var rBase = Math.max(2.2, vm.s * 0.0085) * (1 + env * 1.0);
        ctx.fillStyle = WIRE; ctx.globalAlpha = 0.28 + env * 0.3;
        ctx.beginPath(); ctx.arc(p.x, p.y, rBase * 2.7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = DOME_M; ctx.globalAlpha = 0.30 + env * 0.35;
        ctx.beginPath(); ctx.arc(p.x, p.y, rBase * 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1; ctx.fillStyle = DOME_M;
        ctx.beginPath(); ctx.arc(p.x, p.y, rBase, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = WIRE; ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.arc(p.x, p.y, rBase * 0.36, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    pieceT = t;
    ctx.fillStyle = STAGE;
    ctx.fillRect(0, 0, W, H);
    // one shared scene state for both audiences: sync is structural
    var scene = sceneAt(t);
    drawHuman(viewMap(0), scene);
    drawMachine(viewMap(1), scene, t);
    // the split
    ctx.fillStyle = SPLIT;
    ctx.fillRect(W / 2 - 1, 0, 2, H);
  }

  // ---------- pointer ----------
  function eventWorld(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    var half = cx >= W / 2 ? 1 : 0;
    var vm = viewMap(half);
    return {
      half: half,
      wx: 0.5 + (cx - vm.ox) / vm.s,
      wy: 0.5 + (cy - vm.oy) / vm.s,
      cx: cx, cy: cy
    };
  }
  function onDown(e) {
    audio();
    var p = eventWorld(e);
    downInfo = { x: p.cx, y: p.cy, t: pieceT, moved: false };
    pointer.down = true; pointer.inRight = p.half === 1;
    pointer.wx = p.wx; pointer.wy = p.wy;
    draw(pieceT);
  }
  function onMove(e) {
    if (!pointer.down) return;
    var p = eventWorld(e);
    if (downInfo && (Math.abs(p.cx - downInfo.x) > 8 || Math.abs(p.cy - downInfo.y) > 8)) downInfo.moved = true;
    pointer.inRight = p.half === 1;
    pointer.wx = p.wx; pointer.wy = p.wy;
    draw(pieceT);
  }
  function onUp(e) {
    var wasDrag = downInfo && downInfo.moved;
    pointer.down = false;
    if (downInfo && !wasDrag) {
      var p = eventWorld(e);
      var now = pieceT;
      if (now - lastTap.t < 0.35) {
        // double tap: new frames
        seed = (seed * 1664525 + 1013904223) >>> 0;
        tapFlares = [];
        buildInventory(seed);
        lastTap.t = -10;
      } else {
        // tap: flare the nearest frame's constellation (either half works:
        // both halves map to the same shared scene)
        var scene = sceneAt(now);
        var best = -1, bd = 1e9;
        for (var i = 0; i < scene.length; i++) {
          var r = scene[i];
          var ccx = r.x + r.w / 2, ccy = r.y + r.h / 2;
          var dx = ccx - p.wx, dy = ccy - p.wy;
          var d = dx * dx + dy * dy;
          if (d < bd) { bd = d; best = i; }
        }
        if (best >= 0) { tapFlares.push({ obj: best, t0: now }); if (AC) chime(); }
        lastTap.t = now; lastTap.x = p.cx; lastTap.y = p.cy;
      }
    }
    downInfo = null;
    draw(pieceT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { pointer.down = false; downInfo = null; draw(pieceT); });
  }

  // ---------- boot: frame one, then the loop ----------
  fit();
  buildInventory(seed);
  draw(T0);

  if (typeof requestAnimationFrame !== 'undefined') {
    var startStamp = null;
    var loopFn = function (ms) {
      if (startStamp === null) startStamp = ms;
      var t = T0 + (ms - startStamp) / 1000;
      audioEvents(t);
      draw(t);
      requestAnimationFrame(loopFn);
    };
    requestAnimationFrame(loopFn);
  }
})();
</script>
</body>
</html>
