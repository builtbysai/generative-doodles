<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un Lobo le Canta a la Luna</title>
<style>
  html, body { margin: 0; padding: 0; background: #1B2430; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // ---------- palette (strict) ----------
  var INK = "#1B2430";   // night ink: sky and ground
  var BONE = "#EDE6D2";  // moon bone
  var MBLUE = "#27405E"; // mountain blue
  var BLACK = "#14110D"; // wolf black / ant black
  var RUST = "#B4572E";  // construction rust, lesson only

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(640077);

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  // ---------- viewport (Visual Viewport API) ----------
  var W = 0, H = 0, phone = false;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : Math.min(w, h);
    phone = (sw < 700) || (h > w * 1.15);
  }
  window.addEventListener("resize", resize);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", resize);
  }
  resize();

  var HORIZON_F = 0.68; // horizon line height, fraction of H

  // ---------- precomputed seeded geometry (fractions, wobble 1-3%) ----------

  // moon outline wobble: 48 radius factors, +-1.5%
  var moonWob = [];
  for (var i = 0; i < 48; i++) moonWob.push(1 + (rng() - 0.5) * 0.03);

  // mountain range: triangles with bases on the horizon.
  // Heights are fractions of the SMALLER dimension, so phones do not
  // stretch the triangles into spires.
  function makeRange(count, hMin, hMax) {
    var out = [];
    var cursor = -0.06;
    for (var k = 0; k < count; k++) {
      var wf = 0.24 + rng() * 0.16;
      var ax = cursor + wf * (0.34 + rng() * 0.32) + (rng() - 0.5) * 0.012;
      var hf = hMin + rng() * (hMax - hMin);
      out.push({ bx0: cursor, bx1: cursor + wf, ax: ax, hf: hf });
      cursor += wf * (0.72 + rng() * 0.2);
    }
    return out;
  }
  var farRange = makeRange(5, 0.18, 0.30);
  var nearRange = makeRange(5, 0.24, 0.38);

  // foreground ridge: low wide mound with a level crest the wolf stands on,
  // slight vertex jitter
  var ridgePts = [
    [0.05, 0.905], [0.16, 0.80], [0.26, 0.745], [0.40, 0.745], [0.50, 0.80], [0.63, 0.905],
    [0.63, 0.94], [0.05, 0.94]
  ].map(function (p) {
    return [p[0] + (rng() - 0.5) * 0.006, p[1] + (rng() - 0.5) * 0.005];
  });

  // wolf silhouette parts, local units (y down, origin at ground under body).
  // Points carry a small seeded jitter (about 1-2% of body length).
  function J(pts, amt) {
    return pts.map(function (p) {
      return [p[0] + (rng() - 0.5) * amt, p[1] + (rng() - 0.5) * amt];
    });
  }
  var wolfLegs = [
    J([[-31, -26], [-25, -26], [-26, 0], [-32, 0]], 1.2),
    J([[-23, -26], [-17, -26], [-18, 0], [-24, 0]], 1.2),
    J([[21, -26], [27, -26], [28, 0], [22, 0]], 1.2),
    J([[29, -26], [35, -26], [36, 0], [30, 0]], 1.2)
  ];
  var wolfTail = J([[-36, -42], [-47, -33], [-53, -15], [-54, -5], [-47, -4], [-42, -18], [-33, -29]], 1.6);
  var wolfBody = J([[-37, -41], [-18, -47], [12, -47], [31, -42], [37, -33], [30, -25], [-2, -22], [-29, -24], [-37, -31]], 1.6);
  var wolfNeck = J([[22, -43], [35, -57], [47, -50], [40, -28], [24, -30]], 1.4);
  var wolfHead = J([[40, -54], [43, -66], [52, -71], [63, -68], [82, -60], [83, -57], [70, -56], [76, -49], [63, -48], [52, -47], [43, -46]], 1.2);
  var wolfEars = [
    J([[45, -67], [48, -79], [54, -69]], 1.0),
    J([[55, -70], [60, -80], [62, -68]], 1.0)
  ];

  // ants: seeded start, direction, march speed (fraction of line per second)
  var ants = [];
  for (var a = 0; a < 8; a++) {
    ants.push({
      x0: rng(),
      dir: rng() < 0.8 ? 1 : -1,
      sp: 0.008 + rng() * 0.02,
      ph: rng() * 6.283,
      imp: [] // drag impulses: {t0, dv}
    });
  }
  var IMP_TAU = 0.8; // impulse decay time constant, seconds

  function antX(ant, t) {
    var x = ant.x0 + ant.dir * ant.sp * t;
    for (var j = 0; j < ant.imp.length; j++) {
      var im = ant.imp[j];
      if (t > im.t0) x += im.dv * IMP_TAU * (1 - Math.exp(-(t - im.t0) / IMP_TAU));
    }
    x = x % 1; if (x < 0) x += 1;
    return x;
  }

  // ---------- lesson (construction geometry) ----------
  var tapStart = -100;
  var FORCE_LESSON = (typeof location !== "undefined") && /seed=lesson/.test(location.search || "");

  function evalLesson(start, t) {
    var lt = t - start;
    if (lt < 0 || lt > 9) return null;
    var p = Math.min(1, lt / 3);              // draw-on over 3 s
    var al;
    if (lt < 3) al = Math.min(1, lt / 0.6);   // fade in fast while drawing
    else if (lt < 7) al = 1;                  // hold 4 s
    else al = 1 - (lt - 7) / 2;               // fade out over 2 s
    return { p: p, a: Math.max(0, Math.min(1, al)) };
  }

  function lessonState(t) {
    if (FORCE_LESSON) t = 35.5; // grid lesson mid-hold, for QA renders only
    var best = { p: 0, a: 0 };
    var cyc = Math.floor(t / 40);
    var starts = [31 + 40 * cyc, 31 + 40 * (cyc - 1), tapStart];
    for (var s = 0; s < starts.length; s++) {
      var r = evalLesson(starts[s], t);
      if (r && (r.a > best.a || (r.a === best.a && r.p > best.p))) best = r;
    }
    return best;
  }

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  // ---------- drawing helpers ----------
  function poly(pts, fx, fy) {
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var x = pts[i][0] * fx, y = pts[i][1] * fy;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }
  function polyPx(pts) {
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    ctx.closePath();
    ctx.fill();
  }
  function mountainPx(m, hy, minD) {
    return [[m.bx0 * W, hy], [m.ax * W, hy - m.hf * minD], [m.bx1 * W, hy]];
  }
  function marker(x, y, r) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - r * 2, y); ctx.lineTo(x + r * 2, y);
    ctx.moveTo(x, y - r * 2); ctx.lineTo(x, y + r * 2);
    ctx.stroke();
  }

  // ---------- main draw ----------
  var nowT = 0;
  function draw(t) {
    nowT = t;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    var minD = Math.min(W, H);
    var hy = HORIZON_F * H;

    // sky and ground
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W, H);

    // moon, with faint layered glow (no shadowBlur)
    var mx = (phone ? 0.74 : 0.78) * W;
    var my = 0.20 * H;
    var mr = 0.088 * minD;
    var pulse = 1 + 0.04 * Math.sin(t * 6.2832 / 11);
    ctx.fillStyle = BONE;
    for (var g = 7; g >= 1; g--) {
      var gf = (8 - g) / 7;
      ctx.globalAlpha = 0.055 * Math.pow(gf, 1.5); // outer edges fade to nothing
      ctx.beginPath();
      ctx.arc(mx, my, mr * (1 + 0.16 * g * g * 0.36) * pulse, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.beginPath();
    for (var i = 0; i < 48; i++) {
      var ang = i / 48 * 6.2832;
      var rr = mr * moonWob[i];
      var px = mx + Math.cos(ang) * rr, py = my + Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    // mountains: far range softer, near range full
    ctx.fillStyle = MBLUE;
    ctx.globalAlpha = 0.55;
    farRange.forEach(function (m) { polyPx(mountainPx(m, hy, minD)); });
    ctx.globalAlpha = 1;
    nearRange.forEach(function (m) { polyPx(mountainPx(m, hy, minD)); });

    // horizon line: thin, bone, straight
    ctx.strokeStyle = BONE;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(1.2, minD * 0.0022);
    ctx.beginPath();
    ctx.moveTo(0.03 * W, hy);
    ctx.lineTo(0.97 * W, hy);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // foreground ridge
    ctx.fillStyle = BLACK;
    poly(ridgePts, W, H);

    // wolf on the ridge, breathing (chest rises on the anchored clock)
    var breath = Math.sin(t * 6.2832 / 5.2);
    var ws = minD / 470;
    var wx = 0.33 * W, wy = 0.747 * H; // feet planted on the ridge crest
    ctx.save();
    ctx.translate(wx, wy);
    ctx.scale(ws * (1 + 0.006 * breath), ws * (1 + 0.02 * breath));
    ctx.fillStyle = BLACK;
    wolfLegs.forEach(function (leg) { poly(leg, 1, 1); });
    poly(wolfTail, 1, 1);
    poly(wolfBody, 1, 1);
    poly(wolfNeck, 1, 1);
    poly(wolfHead, 1, 1);
    wolfEars.forEach(function (ear) { poly(ear, 1, 1); });
    ctx.restore();

    // ants marching on the horizon line (they never leave it)
    var as = Math.max(0.8, Math.min(1.9, minD / 460));
    ctx.strokeStyle = BLACK;
    ctx.fillStyle = BLACK;
    ctx.lineWidth = Math.max(0.8, as * 0.8);
    ants.forEach(function (ant) {
      var xf = antX(ant, t);
      var x = (0.03 + 0.94 * xf) * W;
      var bob = Math.sin(t * 10 + ant.ph) * 0.4 * as;
      var cy = hy - 2.6 * as + bob;
      var d = ant.dir;
      // legs
      ctx.beginPath();
      for (var l = -1; l <= 1; l++) {
        ctx.moveTo(x + l * 2.2 * as, cy + 1.2 * as);
        ctx.lineTo(x + l * 2.2 * as - 1.4 * as, hy + 0.6);
        ctx.moveTo(x + l * 2.2 * as, cy + 1.2 * as);
        ctx.lineTo(x + l * 2.2 * as + 1.4 * as, hy + 0.6);
      }
      ctx.stroke();
      // body: two dots
      ctx.beginPath(); ctx.arc(x - d * 2.6 * as, cy, 2.3 * as, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(x + d * 2.2 * as, cy - 0.5 * as, 1.7 * as, 0, 6.2832); ctx.fill();
      // antennae
      ctx.beginPath();
      ctx.moveTo(x + d * 3.4 * as, cy - 1.4 * as);
      ctx.lineTo(x + d * 5.2 * as, cy - 3.4 * as);
      ctx.moveTo(x + d * 3.2 * as, cy - 1.2 * as);
      ctx.lineTo(x + d * 4.6 * as, cy - 3.8 * as);
      ctx.stroke();
    });

    // lesson overlay: faint construction geometry, rust, about 15% opacity
    var ls = lessonState(t);
    if (ls.a > 0.003) {
      ctx.save();
      ctx.globalAlpha = 0.15 * ls.a;
      ctx.strokeStyle = RUST;
      ctx.fillStyle = RUST;
      ctx.lineWidth = Math.max(1, minD * 0.0018);
      ctx.setLineDash([5, 4]);

      // moon guide circle with center marker and radius line
      var mp = clamp01(ls.p * 1.5);
      if (mp > 0) {
        ctx.beginPath();
        ctx.arc(mx, my, mr * 1.18, -1.5708, -1.5708 + mp * 6.2832);
        ctx.stroke();
        if (mp > 0.45) {
          ctx.beginPath();
          ctx.moveTo(mx, my);
          ctx.lineTo(mx + Math.cos(-0.7) * mr * 1.18 * Math.min(1, (mp - 0.45) / 0.4), my + Math.sin(-0.7) * mr * 1.18 * Math.min(1, (mp - 0.45) / 0.4));
          ctx.stroke();
        }
        if (mp > 0.8) marker(mx, my, Math.max(2, minD * 0.004));
      }

      // mountain construction: apex to base corners, point markers
      for (var mi = 0; mi < Math.min(4, nearRange.length); mi++) {
        var m = nearRange[mi];
        var lp = clamp01(ls.p * 1.6 - mi * 0.15);
        if (lp <= 0) continue;
        var axp = m.ax * W, ayp = hy - m.hf * minD;
        var lx = m.bx0 * W, rx = m.bx1 * W;
        ctx.beginPath();
        ctx.moveTo(axp, ayp);
        ctx.lineTo(axp + (lx - axp) * lp, ayp + (hy - ayp) * lp);
        ctx.moveTo(axp, ayp);
        ctx.lineTo(axp + (rx - axp) * lp, ayp + (hy - ayp) * lp);
        ctx.stroke();
        marker(axp, ayp, Math.max(1.8, minD * 0.0035));
        if (lp > 0.7) {
          marker(lx, hy, Math.max(1.8, minD * 0.0035));
          marker(rx, hy, Math.max(1.8, minD * 0.0035));
        }
      }

      // horizon doubled line: proves the straightness
      var hp = clamp01(ls.p * 1.6 - 0.3);
      if (hp > 0) {
        ctx.beginPath();
        ctx.moveTo(0.03 * W, hy - 7);
        ctx.lineTo(0.03 * W + hp * 0.94 * W, hy - 7);
        ctx.stroke();
        if (hp > 0.9) {
          marker(0.03 * W, hy - 7, Math.max(1.8, minD * 0.0035));
          marker(0.97 * W, hy - 7, Math.max(1.8, minD * 0.0035));
        }
      }
      ctx.restore();
    }
  }

  // ---------- interaction ----------
  var downAt = null, downX = 0, downY = 0, lastX = null;
  function evPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
  }
  canvas.addEventListener("pointerdown", function (e) {
    var p = evPos(e);
    downAt = nowT; downX = p.x; downY = p.y; lastX = p.x;
  });
  canvas.addEventListener("pointermove", function (e) {
    if (downAt === null || lastX === null) return;
    var p = evPos(e);
    var dx = p.x - lastX;
    lastX = p.x;
    if (Math.abs(dx) < 1) return;
    // stir the ants: lateral impulse along the line, near the drag path
    var dv = (dx / Math.max(1, W)) * 6;
    if (dv > 0.6) dv = 0.6; if (dv < -0.6) dv = -0.6;
    ants.forEach(function (ant) {
      var ax = (0.03 + 0.94 * antX(ant, nowT)) * W;
      var dist = Math.abs(ax - p.x);
      if (dist < 0.18 * W) {
        ant.imp.push({ t0: nowT, dv: dv * (1 - dist / (0.18 * W)) });
        if (ant.imp.length > 6) ant.imp.shift();
      }
    });
  });
  function endPointer(e) {
    if (downAt === null) { lastX = null; return; }
    var p = evPos(e);
    var quick = (nowT - downAt) < 0.35;
    var still = Math.abs(p.x - downX) < 12 && Math.abs(p.y - downY) < 12;
    if (quick && still) {
      // tap: trigger the lesson on demand (ignored while one is showing)
      if (lessonState(nowT).a <= 0.003) tapStart = nowT;
    }
    downAt = null; lastX = null;
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  // ---------- run ----------
  draw(0); // synchronous first frame at fixed phase
  if (typeof requestAnimationFrame === "function") {
    var startTs = null;
    var frame = function (ts) {
      if (startTs === null) startTs = ts;
      draw((ts - startTs) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
