<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1981 The Shadow In Frame</title>
<style>
  html, body { margin: 0; padding: 0; background: #1d4a4e; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1981 The Shadow In Frame, CR6 / PP1228, study #258 ciara-reddy.
  // An overhead shot: a figure floats in still water among rocks,
  // everything composed. Then the long shadow of the person holding
  // the camera crosses the frame diagonally, over the water, the
  // rocks, the figure's edge, and leaves. The image is about being
  // inside the thing you are making. Drag re-aims the light: the
  // sun angle shifts and the photographer's shadow swings across
  // the scene on your hand. Release and it settles back into its
  // slow automatic crossing.
  var GROUND = '#1d4a4e'; // page ground, the water's own deep teal
  var SKIN = '#d9a583';
  var SKIN_D = '#b98a68';
  var HAIR = '#2b2118';
  var SUIT = '#173a3f';
  var SUIT_L = '#2a5a5e';

  // Fixed-phase first frame: FIRST_T = 11 s of a 30 s cycle.
  // The shadow crosses from the lower edge to the upper edge
  // over the full cycle; at t = 11 it is mid-crossing, centred
  // over the lower water and rocks, clear of the figure's face.
  var FIRST_T = 11;
  var CYCLE = 30;
  var SEED = 1981;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load;
  // ?seed= is an alias (the render tool passes its probe as
  // ?seed=). ?sx=<degrees> sets the light angle offset at load.
  var probeT = null, probeSx = 0;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
    var mx = qs.match(/[?&]sx=(-?[0-9.]+)/);
    if (mx) { probeSx = parseFloat(mx[1]); }
  } catch (e) {}

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; }
  function lerp(a, b, u) { return a + (b - a) * u; }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // Light angle: the automatic crossing runs at angle 0 (shadow
  // axis about -35 degrees). Dragging re-aims the source within
  // a small arc, swinging the shadow; on release the angle eases
  // back to 0 and the automatic crossing resumes.
  var lightAngle = probeSx * Math.PI / 180; // radians, drag offset
  var targetAngle = lightAngle;
  var dragging = false;
  var lastX = 0, lastY = 0;

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    // Figure geometry, in stage fractions. The figure floats
    // diagonally, head upper right, feet lower left; the face
    // sits well clear of the shadow's first-frame position.
    L.fx = W * 0.60; L.fy = H * 0.36;   // head centre
    L.headR = W * 0.052;
    L.bodyAng = 2.49;                  // head-to-feet direction, down-left
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Shadow centre travels the diagonal from the lower edge to
  // the upper edge over one cycle. u = 0 is off-frame below,
  // u = 1 is off-frame above.
  function shadowState(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    var u = p / CYCLE;
    // The diagonal is offset perpendicular (down-right) so the
    // shadow's centre passes below the figure's face: it crosses
    // the torso and legs, and only grazes the face's edge.
    var cx = lerp(W * 0.02, W * 0.98, u) + W * 0.10;
    var cy = lerp(H * 1.12, H * -0.12, u) + H * 0.08;
    return { p: p, u: u, cx: cx, cy: cy };
  }

  // ---- Water -----------------------------------------------------
  function drawWater(t) {
    var i, x, y;
    // Deep teal field with slow, subtle vertical light bands.
    var bands = 18;
    for (i = 0; i < bands; i++) {
      var bx = (W / bands) * i;
      var v = 0.5 + 0.5 * Math.sin(i * 1.7 + 1.3);
      var r = Math.round(30 + v * 6);
      var g = Math.round(76 + v * 8);
      var b = Math.round(80 + v * 7);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.fillRect(bx, 0, W / bands + 1, H);
    }
    // Sunlit caustic rings drifting slowly, thin and faint.
    ctx.lineWidth = Math.max(1, W * 0.0016);
    for (i = 0; i < 12; i++) {
      var ax = hash1(i * 3 + 1) * W;
      var ay = hash1(i * 5 + 2) * H;
      var ar = W * (0.03 + hash1(i * 7 + 3) * 0.06);
      var drift = Math.sin(t * 0.12 + i * 1.9) * W * 0.012;
      ctx.strokeStyle = 'rgba(190,225,210,' + a4(0.08 + 0.05 * hash1(i * 11 + 4)) + ')';
      ctx.beginPath();
      ctx.moveTo(ax + drift + ar, ay);
      ctx.arc(ax + drift, ay, ar, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Fine ripple rings around the figure's torso, few and faint.
    var tc = [L.fx + Math.cos(L.bodyAng) * L.headR * 3.0, L.fy + Math.sin(L.bodyAng) * L.headR * 3.0];
    for (i = 0; i < 3; i++) {
      var rr = W * (0.13 + i * 0.045) + Math.sin(t * 0.5 + i) * W * 0.004;
      ctx.strokeStyle = 'rgba(210,235,225,' + a4(0.12 - i * 0.03) + ')';
      ctx.lineWidth = Math.max(1, W * 0.0016);
      ctx.beginPath();
      ctx.moveTo(tc[0] + rr, tc[1]);
      ctx.arc(tc[0], tc[1], rr, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // ---- Rocks -----------------------------------------------------
  function drawRocks() {
    var rng = mulberry32(SEED * 13 + 5);
    var i;
    for (i = 0; i < 16; i++) {
      var rx = rng() * W;
      var ry = rng() * H;
      // Keep the figure's head and torso clear of rocks.
      var dx = rx - L.fx, dy = ry - (L.fy + H * 0.10);
      if (dx * dx + dy * dy < Math.pow(W * 0.24, 2)) { continue; }
      var rw = W * (0.03 + rng() * 0.055);
      var rh = rw * (0.55 + rng() * 0.35);
      var rot = rng() * Math.PI;
      var shade = 0.32 + rng() * 0.22;
      var g = Math.round(70 + shade * 90);
      ctx.save();
      ctx.translate(rx, ry);
      ctx.rotate(rot);
      ctx.fillStyle = 'rgb(' + g + ',' + Math.round(g * 0.92) + ',' + Math.round(g * 0.82) + ')';
      ctx.beginPath();
      ctx.moveTo(rw, 0);
      ctx.ellipse(0, 0, rw, rh, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(220,225,210,' + a4(0.18) + ')';
      ctx.beginPath();
      ctx.moveTo(rw * 0.7, -rh * 0.3);
      ctx.ellipse(-rw * 0.15, -rh * 0.25, rw * 0.55, rh * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ---- Figure ----------------------------------------------------
  // Overhead portrait: head with dark hair fanned in the water,
  // shoulders, torso in a dark suit, arms out, legs together,
  // drifting slightly with the water.
  function drawFigure(t) {
    var bob = Math.sin(t * 0.4) * H * 0.004;
    var fx = L.fx, fy = L.fy + bob;
    var ang = L.bodyAng;
    var ux = Math.cos(ang), uy = Math.sin(ang); // head-to-feet
    var px = -uy, py = ux;                      // across the body
    var R = L.headR;
    function pt(along, across) {
      return [fx + ux * along + px * across, fy + uy * along + py * across];
    }
    var i;
    // Hair fanned behind the head in the water, away from the body.
    ctx.fillStyle = HAIR;
    var hairAng = L.bodyAng + Math.PI; // behind the head
    for (i = 0; i < 7; i++) {
      var ha = hairAng + (i - 3) * 0.34;
      var hx = fx + Math.cos(ha) * R * 1.25;
      var hy = fy + Math.sin(ha) * R * 1.25;
      var hr = R * (0.24 + 0.08 * hash1(i * 7 + 9));
      ctx.beginPath();
      ctx.moveTo(hx + hr, hy);
      ctx.arc(hx, hy, hr, 0, Math.PI * 2);
      ctx.fill();
    }
    // Legs, together, skin.
    ctx.strokeStyle = SKIN;
    ctx.lineCap = 'round';
    ctx.lineWidth = R * 0.62;
    var hip = pt(R * 4.6, 0);
    var knee = pt(R * 7.2, 0);
    var foot = pt(R * 9.4, 0);
    ctx.beginPath();
    ctx.moveTo(hip[0], hip[1]);
    ctx.lineTo(knee[0], knee[1]);
    ctx.lineTo(foot[0], foot[1]);
    ctx.stroke();
    // Feet.
    ctx.fillStyle = SKIN_D;
    var f1 = pt(R * 9.7, -R * 0.28), f2 = pt(R * 9.7, R * 0.28);
    ctx.beginPath();
    ctx.moveTo(f1[0] + R * 0.3, f1[1]);
    ctx.arc(f1[0], f1[1], R * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(f2[0] + R * 0.3, f2[1]);
    ctx.arc(f2[0], f2[1], R * 0.3, 0, Math.PI * 2);
    ctx.fill();
    // Arms out to the sides, skin.
    ctx.strokeStyle = SKIN;
    ctx.lineWidth = R * 0.5;
    var shL = pt(R * 2.0, -R * 1.1), shR = pt(R * 2.0, R * 1.1);
    var hL = pt(R * 2.6, -R * 3.0), hR = pt(R * 2.6, R * 3.0);
    ctx.beginPath();
    ctx.moveTo(shL[0], shL[1]);
    ctx.lineTo(hL[0], hL[1]);
    ctx.moveTo(shR[0], shR[1]);
    ctx.lineTo(hR[0], hR[1]);
    ctx.stroke();
    // Torso, dark suit, a rounded capsule from shoulders to hips.
    ctx.fillStyle = SUIT;
    var s0 = pt(R * 1.2, 0), s1 = pt(R * 4.8, 0);
    ctx.strokeStyle = SUIT;
    ctx.lineWidth = R * 2.1;
    ctx.beginPath();
    ctx.moveTo(s0[0], s0[1]);
    ctx.lineTo(s1[0], s1[1]);
    ctx.stroke();
    // Suit strap highlight.
    ctx.strokeStyle = SUIT_L;
    ctx.lineWidth = R * 0.28;
    ctx.beginPath();
    ctx.moveTo(pt(R * 1.6, -R * 0.5)[0], pt(R * 1.6, -R * 0.5)[1]);
    ctx.lineTo(pt(R * 4.4, -R * 0.5)[0], pt(R * 4.4, -R * 0.5)[1]);
    ctx.stroke();
    // Head: skin circle, hair cap on the upper side, closed eyes
    // as two short dashes across the face.
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(fx + R, fy);
    ctx.arc(fx, fy, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.moveTo(fx + R, fy);
    ctx.arc(fx, fy, R * 1.02, Math.PI * 0.95, Math.PI * 2.05);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = Math.max(1, R * 0.07);
    ctx.beginPath();
    ctx.moveTo(pt(-R * 0.25, -R * 0.47)[0], pt(-R * 0.25, -R * 0.47)[1]);
    ctx.lineTo(pt(-R * 0.25, -R * 0.23)[0], pt(-R * 0.25, -R * 0.23)[1]);
    ctx.moveTo(pt(-R * 0.25, R * 0.23)[0], pt(-R * 0.25, R * 0.23)[1]);
    ctx.lineTo(pt(-R * 0.25, R * 0.47)[0], pt(-R * 0.25, R * 0.47)[1]);
    ctx.stroke();
  }

  // ---- Photographer's shadow -------------------------------------
  // The rig's own shadow: head, shoulders, arms holding a camera
  // box, stretched along the light axis. Drawn as separate simple
  // shapes (circle, round-capped strokes, camera rect) so the
  // silhouette reads as a person holding a camera, not a block.
  // Three passes at growing scale and falling alpha keep the
  // edges soft, in soft dark gray, semi-transparent at the edges.
  // It is a signature, not an erasure: it never sits on the face
  // except for the brief moment its path crosses it mid-cycle.
  function shadowPass(cx, cy, ang, s, alpha) {
    // Local coordinates: +x along the light axis (head to camera),
    // +y across. s scales the whole silhouette.
    var u = W * 0.055 * s; // unit
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.fillStyle = 'rgba(28,30,34,' + a4(alpha) + ')';
    ctx.strokeStyle = 'rgba(28,30,34,' + a4(alpha) + ')';
    ctx.lineCap = 'round';
    // Head.
    ctx.beginPath();
    ctx.moveTo(-u * 2.4 + u * 0.85, 0);
    ctx.arc(-u * 2.4, 0, u * 0.85, 0, Math.PI * 2);
    ctx.fill();
    // Torso, a round-capped stroke from shoulders to hips.
    ctx.lineWidth = u * 2.0;
    ctx.beginPath();
    ctx.moveTo(-u * 1.6, 0);
    ctx.lineTo(u * 1.4, 0);
    ctx.stroke();
    // Arms reaching forward to the camera box, converging.
    ctx.lineWidth = u * 0.65;
    ctx.beginPath();
    ctx.moveTo(-u * 0.4, -u * 0.8);
    ctx.lineTo(u * 4.3, -u * 0.9);
    ctx.moveTo(-u * 0.4, u * 0.8);
    ctx.lineTo(u * 4.3, u * 0.9);
    ctx.stroke();
    // Camera box at the far end, with a lens dot.
    ctx.fillRect(u * 4.2, -u * 1.1, u * 1.5, u * 2.2);
    ctx.beginPath();
    ctx.moveTo(u * 6.4, 0);
    ctx.arc(u * 5.9, 0, u * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function drawShadow(t) {
    var st = shadowState(t);
    var ang = -0.61 + lightAngle; // about -35 degrees, swung by drag
    var passes = [
      { s: 1.25, a: 0.09 },
      { s: 1.10, a: 0.15 },
      { s: 1.00, a: 0.28 }
    ];
    var i;
    for (i = 0; i < passes.length; i++) {
      shadowPass(st.cx, st.cy, ang, passes[i].s, passes[i].a);
    }
  }

  function draw(t) {
    lastT = t;
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawWater(t);
    drawRocks();
    drawFigure(t);
    drawShadow(t);

    // Caption top left, hint bottom centre. Light text on the
    // deep teal water; the hint sits over open water.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(228,240,232,' + a4(0.88) + ')';
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1981 · The Shadow In Frame', W * 0.04, H * 0.055);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(228,240,232,' + a4(0.92) + ')';
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to move the light.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Drag re-aims the light: horizontal drag swings the shadow
  // angle within a small arc. On release the angle eases back
  // to the automatic crossing. Pointer only, never click to reload.
  function onDown(e) {
    dragging = true;
    lastX = (e && typeof e.clientX === 'number') ? e.clientX : 0;
    lastY = (e && typeof e.clientY === 'number') ? e.clientY : 0;
  }
  function onMove(e) {
    if (!dragging) { return; }
    var x = (e && typeof e.clientX === 'number') ? e.clientX : lastX;
    var dx = x - lastX;
    lastX = x;
    lastY = (e && typeof e.clientY === 'number') ? e.clientY : lastY;
    targetAngle = clamp(targetAngle + dx * 0.004, -0.5, 0.5);
    lightAngle = targetAngle;
    if (reduced) { draw(lastT); }
  }
  function onUp() {
    dragging = false;
    targetAngle = 0;
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('pointerleave', onUp);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1981 exposes cycle state and the light angle.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1981 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return shadowState(t); },
      light: function () { return lightAngle; },
      setLight: function (a) { lightAngle = a; targetAngle = a; draw(lastT); },
      drag: function (dx) { targetAngle = clamp(targetAngle + dx, -0.5, 0.5); lightAngle = targetAngle; },
      release: function () { targetAngle = 0; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the shadow crosses on a 30 s cycle. Drag swings
  // the light angle at once; on release the angle eases back to
  // 0. Guarded so node-canvas QA works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      if (!dragging) {
        lightAngle += (0 - lightAngle) * 0.03;
        targetAngle = lightAngle;
      }
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
