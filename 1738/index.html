<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seed Intervals</title>
<style>
html, body { margin: 0; padding: 0; background: #FFFFFF; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#FFFFFF';
var SNOW = '#FFFFFF';
var INK = '#16181C';
var BLUE = '#8FB4D2';
var PLATE = '#FFFFFF';
var PLATE_LINE = 'rgba(22,24,28,0.22)';
var TITLE_INK = '#16181C';
var HINT_INK = 'rgba(22,24,28,0.65)';
var START_T = 16;
var FIRST_REMOVAL = 34;
var REMOVAL_EVERY = 13;
var FADE_OUT = 2.5;
var FADE_IN = 1.2;
var BASE_PERIOD = 3.4;
var RATIOS = [0.75, 1, 1.25, 1.5, 2, 2.5, 3];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* seeded once: every mark, its place, its clock and its arrival are fixed */
var rng = mulberry32(1738);
var marks = [];
var nextBorn = 0.9;
function makeMark() {
  var x = 0, y = 0, ok = false, tries = 0, i, dx, dy;
  while (!ok && tries < 300) {
    tries++;
    x = 0.06 + rng() * 0.88;
    y = 0.08 + rng() * 0.84;
    ok = true;
    for (i = 0; i < marks.length; i++) {
      dx = marks[i].x - x; dy = marks[i].y - y;
      if (dx * dx + dy * dy < 0.085 * 0.085) { ok = false; break; }
    }
  }
  var m = {
    x: x, y: y,
    period: RATIOS[Math.floor(rng() * RATIOS.length)] * BASE_PERIOD,
    phase0: rng(),
    sizeUnit: 0.0055 + rng() * 0.005,
    born: nextBorn
  };
  marks.push(m);
  nextBorn += 1.1 + rng() * 1.4;
  return m;
}
function ensureMarksUpTo(t) {
  while (nextBorn <= t) makeMark();
}
/* state at time t is a pure function of t: arrivals on their own clocks,
   and a slow subtractive pass that carves away the oldest mark every 13 s
   starting at t = 34, fading it out over 2.5 s */
function stateAt(t) {
  ensureMarksUpTo(t);
  var removed = {};
  var rt = FIRST_REMOVAL;
  while (rt <= t) {
    var oldest = -1, oldestBorn = Infinity, i;
    for (i = 0; i < marks.length; i++) {
      if (marks[i].born <= rt && removed[i] === undefined && marks[i].born < oldestBorn) {
        oldestBorn = marks[i].born; oldest = i;
      }
    }
    if (oldest < 0) break;
    removed[oldest] = rt;
    rt += REMOVAL_EVERY;
  }
  var list = [], mostRecent = -1, mostBorn = -Infinity, i;
  for (i = 0; i < marks.length; i++) {
    var m = marks[i];
    if (m.born > t) continue;
    var a = clamp((t - m.born) / FADE_IN, 0, 1);
    if (removed[i] !== undefined) {
      if (t >= removed[i] + FADE_OUT) continue;
      a *= 1 - (t - removed[i]) / FADE_OUT;
    }
    if (a <= 0.01) continue;
    list.push({ idx: i, mark: m, alpha: a });
    if (m.born > mostBorn) { mostBorn = m.born; mostRecent = i; }
  }
  return { list: list, mostRecent: mostRecent };
}
function phaseOf(m, t) {
  var p = (t - m.born) / m.period + m.phase0;
  return p - Math.floor(p);
}
var simTime = START_T;
var dragging = null;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* field: full-bleed on phones, a centered square on desktop.
   Ground and field are the same snow, so the square has no visible seam. */
function field() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var side = Math.min(VW, VH);
  return { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
}
function markXY(F, m) {
  return { x: F.x + m.x * F.w, y: F.y + m.y * F.h };
}
function markRadius(m, F, pulse) {
  var r = Math.max(2.4, m.sizeUnit * Math.min(F.w, F.h));
  return r * (0.9 + 0.25 * pulse);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var F = field();
  ctx.fillStyle = SNOW;
  ctx.fillRect(F.x, F.y, F.w, F.h);
  var st = stateAt(simTime);
  var i, e, m, p, pulse, bright, r, xy;
  for (i = 0; i < st.list.length; i++) {
    e = st.list[i]; m = e.mark;
    p = phaseOf(m, simTime);
    pulse = 0.5 + 0.5 * Math.cos(TAU * p);
    bright = 0.32 + 0.68 * pulse * pulse;
    xy = markXY(F, m);
    r = markRadius(m, F, pulse);
    if (e.idx === st.mostRecent) {
      /* the most recent mark is pale winter blue, with a faint halo */
      ctx.fillStyle = rgba(BLUE, 0.22 * e.alpha);
      ctx.beginPath(); ctx.arc(xy.x, xy.y, r * 2.6, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba(BLUE, clamp(0.7 + 0.3 * pulse * pulse, 0, 1) * e.alpha);
      ctx.beginPath(); ctx.arc(xy.x, xy.y, r * 1.2, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = rgba(INK, bright * e.alpha);
      ctx.beginPath(); ctx.arc(xy.x, xy.y, r, 0, TAU); ctx.fill();
    }
  }
  /* the mark being retuned wears a thin ring whose size follows its period */
  if (dragging) {
    var dm = marks[dragging.idx];
    var dxy = markXY(F, dm);
    var dp = phaseOf(dm, simTime);
    var dpulse = 0.5 + 0.5 * Math.cos(TAU * dp);
    var dr = markRadius(dm, F, dpulse);
    ctx.strokeStyle = rgba(INK, 0.35);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(dxy.x, dxy.y, dr + 8 + dm.period * 1.2, 0, TAU);
    ctx.stroke();
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  while (titlePx > 9 && ctx.measureText('Seed Intervals').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  }
  var titleW = ctx.measureText('Seed Intervals').width;
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var dateW = ctx.measureText('2006 · 10 · 15').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  ctx.fillText('Seed Intervals', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 15', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag a mark to retune its interval.';
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
/* drag retunes one mark's interval: horizontal drag stretches or
   compresses its period, keeping the pulse phase continuous */
function nearestMark(px, py) {
  var F = field();
  var st = stateAt(simTime);
  var best = -1, bestD = 48, i, xy, d;
  for (i = 0; i < st.list.length; i++) {
    xy = markXY(F, st.list[i].mark);
    d = Math.sqrt((xy.x - px) * (xy.x - px) + (xy.y - py) * (xy.y - py));
    if (d < bestD) { bestD = d; best = st.list[i].idx; }
  }
  return best;
}
function onDown(e) {
  var px = e.clientX, py = e.clientY;
  var idx = nearestMark(px, py);
  if (idx >= 0) {
    dragging = { idx: idx, startX: px, startPeriod: marks[idx].period };
    if (e.preventDefault) e.preventDefault();
    draw();
  }
}
function onMove(e) {
  if (!dragging) return;
  var m = marks[dragging.idx];
  var dx = e.clientX - dragging.startX;
  var newPeriod = clamp(dragging.startPeriod * (1 + dx / 260), 1.2, 14);
  /* keep the pulse where it is while the clock changes underneath it */
  var p = phaseOf(m, simTime);
  m.period = newPeriod;
  m.phase0 = p - (simTime - m.born) / m.period;
  draw();
}
function onUp() {
  if (dragging) { dragging = null; draw(); }
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { simTime = t; draw(); },
    markCount: function () { return stateAt(simTime).list.length; },
    mostRecent: function () { return stateAt(simTime).mostRecent; },
    simTime: function () { return simTime; }
  };
}
/* ---- frame one: fixed phase, simTime 16, nine marks already present ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) { simTime += dt; draw(); }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
