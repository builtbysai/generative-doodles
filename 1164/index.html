<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sneakers Decryptor</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0F0A; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- Sneakers Decryptor — Nick Briz study NB5 ----------
  // After Briz's Sneakrypt (2021): a functioning terminal encryptor wearing
  // 1992-movie hacker chrome — "there's usually no technical reason why
  // these tools can't look this cool in real life." This is a real tool,
  // not a picture of one: type plaintext and get cipher blocks; switch to
  // DECRYPT, enter the hex with the same key showing in the key matrix,
  // and the plaintext comes back. The cipher is the documented fallback —
  // a keystream XOR (WebCrypto's AES-GCM is async and absent from the QA
  // renderer): keystream = mulberry32 seeded by an FNV-1a hash of the key,
  // one byte per character. It genuinely round-trips; the round-trip is
  // verified in node and recorded in process.md. Everything is drawn on
  // one canvas in monospace. All client-side; the page makes no network
  // calls of any kind.

  var T0 = 2.35;               // fixed phase for the deterministic first frame

  var BG = '#0A0F0A';
  var PHOS = '#33FF66';
  var AMBER = '#FFB000';
  var RED = '#FF4444';
  var GLYPH_CELL = '#1E3A1E';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ==CIPHER CORE START==
  // Self-contained cipher core (extracted and round-trip-tested in node).
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }
  var KEY_CHARSET = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!#%*+-=?';
  function generateKey(len, gen) {
    var rng = mulberry32(hashStr('SNK1:' + len + ':' + gen));
    var k = '';
    for (var i = 0; i < len; i++) {
      k += KEY_CHARSET[Math.floor(rng() * KEY_CHARSET.length)];
    }
    return k;
  }
  function keystreamByte(rng) { return Math.floor(rng() * 256); }
  function encryptText(plain, key) {
    var rng = mulberry32(hashStr(key));
    var hex = '';
    for (var i = 0; i < plain.length; i++) {
      var b = (plain.charCodeAt(i) & 0xff) ^ keystreamByte(rng);
      var s = b.toString(16).toUpperCase();
      hex += (s.length < 2 ? '0' + s : s);
    }
    return hex;
  }
  function decryptHex(hex, key) {
    var clean = hex.replace(/[^0-9a-fA-F]/g, '');
    var rng = mulberry32(hashStr(key));
    var out = '';
    for (var i = 0; i + 2 <= clean.length; i += 2) {
      var b = parseInt(clean.substr(i, 2), 16) ^ keystreamByte(rng);
      out += String.fromCharCode(b);
    }
    return out;
  }
  // ==CIPHER CORE END==

  function hexOf(str) {
    var out = '';
    for (var i = 0; i < str.length; i++) {
      var s = (str.charCodeAt(i) & 0xff).toString(16).toUpperCase();
      out += (s.length < 2 ? '0' + s : s);
    }
    return out;
  }
  function groupHex(hex) {
    // blocks of 8 bytes = 16 hex chars
    var blocks = [];
    for (var i = 0; i < hex.length; i += 16) blocks.push(hex.substr(i, 16));
    return blocks;
  }

  // ---------- state ----------
  var state = {
    mode: 'encrypt',                          // 'encrypt' | 'decrypt'
    plain: 'meet at the marina at midnight',  // demo state, typed already
    cipherHex: '',
    keyLen: 16,
    keyGen: 0,
    key: '',
    focused: false,
    lastEditT: -1e9,                          // demo state counts as long settled
    dragging: false,
    sliderChanged: false
  };
  function regenKey() {
    state.key = generateKey(state.keyLen, state.keyGen);
    state.cipherHex = encryptText(state.plain, state.key);
  }
  regenKey();

  function inputText() {
    return state.mode === 'encrypt' ? state.plain : state.cipherHex;
  }
  function hexIsValid(hex) {
    var rest = hex.replace(/[0-9a-fA-F\s]/g, '');
    if (rest.length > 0) return false;
    var clean = hex.replace(/[^0-9a-fA-F]/g, '');
    return clean.length % 2 === 0;
  }
  function outputString() {
    if (state.mode === 'encrypt') return groupHex(state.cipherHex).join('  ');
    if (!state.cipherHex) return '';
    return decryptHex(state.cipherHex, state.key);
  }

  // ---------- seeded decorative tables (closed-form, built once) ----------
  var GLYPHS = ['░', '▒', '▓', '█'];
  var bannerPat = [];
  (function () {
    var rng = mulberry32(1164001);
    for (var i = 0; i < 400; i++) bannerPat.push(Math.floor(rng() * 4));
  })();
  var flickerTab = [];
  (function () {
    var rng = mulberry32(1164002);
    var steps = [1.0, 1.0, 0.99, 1.0, 0.98, 1.0, 0.99, 1.0, 1.0, 0.97, 1.0, 0.99, 1.0, 1.0, 0.98, 1.0];
    for (var i = 0; i < 16; i++) flickerTab.push(steps[Math.floor(rng() * steps.length)]);
  })();

  // ---------- viewport / sizing ----------
  var W = 0, H = 0, DPR = 1;
  function viewSize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 800);
    var h = vv ? vv.height : (window.innerHeight || 600);
    return { w: w, h: h };
  }
  function isPhone() {
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr && scr.width && scr.height) {
      if (Math.min(scr.width, scr.height) < 700) return true;
    }
    return H > W * 1.15;
  }
  function fit() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  fit();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', fit);
  }
  window.addEventListener('resize', fit);

  // ---------- time ----------
  function nowSec() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : Date.now() / 1000;
  }
  var startStamp = nowSec();
  function pieceT() { return T0 + (nowSec() - startStamp); }

  // ---------- layout (recomputed per draw, kept for pointer handlers) ----------
  var GL = null;
  function computeLayout() {
    var phone = isPhone();
    var fs = Math.max(10, Math.min(20, Math.floor(W / 52)));
    if (phone) fs = Math.max(10, Math.min(13, Math.floor(W / 34)));
    ctx.font = 'bold ' + fs + 'px "Courier New", Courier, monospace';
    var cw = ctx.measureText('M').width;
    var lh = Math.round(fs * 1.4);
    var pad = Math.max(10, cw * 1.5);
    var x0 = pad;
    var availW = W - pad * 2;
    var cols = Math.max(24, Math.floor(availW / cw));
    return {
      phone: phone, fs: fs, cw: cw, lh: lh, pad: pad, x0: x0,
      availW: availW, cols: cols, regions: {}
    };
  }

  function wrapChars(str, maxChars) {
    var lines = [];
    if (str.length === 0) return [''];
    for (var i = 0; i < str.length; i += maxChars) lines.push(str.substr(i, maxChars));
    return lines;
  }
  function wrapTokens(str, maxChars) {
    var toks = str.split('  ');
    var lines = [], cur = '';
    for (var i = 0; i < toks.length; i++) {
      var t = toks[i];
      if (cur === '') cur = t;
      else if (cur.length + 2 + t.length <= maxChars) cur += '  ' + t;
      else { lines.push(cur); cur = t; }
    }
    if (cur !== '' || lines.length === 0) lines.push(cur);
    return lines;
  }

  function text(str, x, y, color, alpha) {
    ctx.globalAlpha = (alpha === undefined) ? 1 : alpha;
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
    ctx.globalAlpha = 1;
  }
  // draw a line at the current font, shrinking the font until it fits maxW
  function textFit(str, x, y, color, alpha, baseFs, maxW) {
    var size = baseFs;
    ctx.font = 'bold ' + size + 'px "Courier New", Courier, monospace';
    while (size > 7 && ctx.measureText(str).width > maxW) {
      size -= 1;
      ctx.font = 'bold ' + size + 'px "Courier New", Courier, monospace';
    }
    text(str, x, y, color, alpha);
    ctx.font = 'bold ' + baseFs + 'px "Courier New", Courier, monospace';
  }

  // ---------- draw ----------
  function draw(T) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var L = computeLayout();
    GL = L;
    var fs = L.fs, cw = L.cw, lh = L.lh, x0 = L.x0, cols = L.cols;
    var maxChars = cols - 2;
    ctx.textBaseline = 'top';

    // total content height, to center the terminal block vertically
    var inLines = wrapChars('> ' + inputText(), maxChars).length;
    var outFull = outputString();
    var revealN = state.lastEditT < -1e8 ? outFull.length
      : Math.min(outFull.length, Math.floor((T - state.lastEditT) / 0.03) + 1);
    var outShown = outFull.substr(0, Math.max(0, revealN));
    var outLines = state.mode === 'encrypt' ? wrapTokens(outShown, maxChars) : wrapChars(outShown, maxChars);
    var keyRows = Math.ceil(state.keyLen / Math.max(8, Math.floor(L.availW / (cw * 1.7))));
    var totalLines = 3 + 1 + 1 + 1 + 1 + inLines + 1 + Math.max(1, outLines.length) + 2 + 1 + 1 + keyRows + 1;
    var y = Math.max(L.pad * 0.6, (H - totalLines * lh) / 2);

    // ----- banner: glyph strips around a big title -----
    ctx.font = 'bold ' + fs + 'px "Courier New", Courier, monospace';
    var strip = '';
    var stripCols = Math.floor(L.availW / cw);
    for (var i = 0; i < stripCols; i++) strip += GLYPHS[bannerPat[i % bannerPat.length]];
    text(strip, x0, y, PHOS, 0.4);
    y += lh;
    ctx.font = 'bold ' + Math.round(fs * 1.7) + 'px "Courier New", Courier, monospace';
    text('▓▒░ SNEAKERS DECRYPTOR ░▒▓', x0, y, PHOS, 1);
    ctx.font = 'bold ' + fs + 'px "Courier New", Courier, monospace';
    y += Math.round(lh * 1.5);
    text(strip, x0, y, PHOS, 0.4);
    y += lh;

    // ----- amber warning -----
    textFit('NO NETWORK. NO ACCOUNTS. YOUR TEXT NEVER LEAVES THIS PAGE.', x0, y, AMBER, 1, fs, L.availW);
    y += lh;
    ctx.fillStyle = GLYPH_CELL;
    ctx.fillRect(x0, y + 2, L.availW, 2);
    y += Math.round(lh * 0.7);

    // ----- mode line -----
    var modeY = y;
    var encLabel = ' ENCRYPT ';
    var decLabel = ' DECRYPT ';
    var mx = x0;
    text('MODE:', mx, y, PHOS, 0.65);
    mx += 6 * cw;
    if (state.mode === 'encrypt') {
      ctx.fillStyle = PHOS; ctx.fillRect(mx, y - 1, encLabel.length * cw, lh - 2);
      text(encLabel, mx, y, BG, 1);
    } else {
      text(encLabel, mx, y, PHOS, 0.75);
    }
    L.regions.modeEnc = { x: mx, y: y - 2, w: encLabel.length * cw, h: lh };
    mx += (encLabel.length + 2) * cw;
    if (state.mode === 'decrypt') {
      ctx.fillStyle = PHOS; ctx.fillRect(mx, y - 1, decLabel.length * cw, lh - 2);
      text(decLabel, mx, y, BG, 1);
    } else {
      text(decLabel, mx, y, PHOS, 0.75);
    }
    L.regions.modeDec = { x: mx, y: y - 2, w: decLabel.length * cw, h: lh };
    y += lh;

    // ----- input -----
    text(state.mode === 'encrypt' ? 'PLAINTEXT >>' : 'CIPHER HEX >>', x0, y, PHOS, 0.65);
    y += lh;
    var boxY = y;
    var boxH = inLines * lh + Math.round(lh * 0.35);
    ctx.strokeStyle = GLYPH_CELL;
    ctx.lineWidth = 2;
    ctx.strokeRect(x0, boxY, L.availW, boxH);
    ctx.lineWidth = 1;
    var inWrapped = wrapChars('> ' + inputText(), maxChars);
    for (var li = 0; li < inWrapped.length; li++) {
      text(inWrapped[li], x0 + cw, boxY + Math.round(lh * 0.18) + li * lh, PHOS, 1);
    }
    // block cursor at the end of the input
    var lastLine = inWrapped[inWrapped.length - 1];
    var curX = x0 + cw + lastLine.length * cw;
    var curY = boxY + Math.round(lh * 0.18) + (inWrapped.length - 1) * lh;
    var blinkOn = Math.floor(T * 1.6) % 2 === 0;
    if (state.focused && blinkOn) {
      ctx.fillStyle = PHOS;
      ctx.fillRect(curX + 1, curY, cw - 1, fs + 2);
    } else {
      ctx.strokeStyle = PHOS;
      ctx.globalAlpha = state.focused ? 0.8 : 0.4;
      ctx.strokeRect(curX + 1, curY, cw - 1, fs + 2);
      ctx.globalAlpha = 1;
    }
    L.regions.input = { x: x0, y: boxY, w: L.availW, h: boxH };
    y = boxY + boxH + Math.round(lh * 0.4);

    // ----- output -----
    text(state.mode === 'encrypt' ? 'CIPHER BLOCKS >>' : 'RECOVERED PLAINTEXT >>', x0, y, PHOS, 0.65);
    y += lh;
    if (outShown === '' && state.mode === 'decrypt') {
      text('(awaiting hex)', x0 + cw, y, PHOS, 0.45);
      y += lh;
    } else {
      for (var oi = 0; oi < outLines.length; oi++) {
        text(outLines[oi], x0 + cw, y + oi * lh, PHOS, 1);
      }
      y += Math.max(1, outLines.length) * lh;
    }
    if (state.mode === 'decrypt' && !hexIsValid(state.cipherHex)) {
      text('!! INVALID HEX — CHECK INPUT', x0 + cw, y, RED, 1);
      y += lh;
    }

    // ----- signal slider -----
    y += Math.round(lh * 0.3);
    var sliderY = y;
    text('SIGNAL', x0, sliderY, PHOS, 0.65);
    var trackX0 = x0 + 8 * cw;
    var trackX1 = Math.min(x0 + 36 * cw, x0 + L.availW - 12 * cw);
    var trackY = sliderY + Math.round(lh * 0.42);
    ctx.fillStyle = GLYPH_CELL;
    ctx.fillRect(trackX0, trackY, trackX1 - trackX0, 3);
    for (var tk = 0; tk <= 8; tk++) {
      ctx.fillRect(trackX0 + (trackX1 - trackX0) * tk / 8, trackY - 3, 2, 9);
    }
    var frac = (state.keyLen - 8) / 24;
    var handleX = trackX0 + frac * (trackX1 - trackX0);
    ctx.fillStyle = PHOS;
    ctx.fillRect(handleX - cw * 0.55, sliderY + 1, cw * 1.1, lh - 2);
    text('KEY LEN ' + state.keyLen, trackX1 + 2 * cw, sliderY, PHOS, 1);
    L.regions.slider = { x: trackX0 - cw, y: sliderY - 2, w: (trackX1 - trackX0) + 2 * cw, h: lh + 4, tx0: trackX0, tx1: trackX1 };
    y += lh;

    // ----- key line + key matrix -----
    textFit('KEY (HEX): ' + hexOf(state.key), x0, y, PHOS, 0.55, fs, L.availW);
    y += lh;
    text('KEY MATRIX', x0, y, PHOS, 0.65);
    y += lh;
    var cellW = cw * 1.7, cellH = lh * 1.1;
    var perRow = Math.max(8, Math.floor(L.availW / cellW));
    var matY = y;
    for (var ki = 0; ki < state.key.length; ki++) {
      var cxp = x0 + (ki % perRow) * cellW;
      var cyp = matY + Math.floor(ki / perRow) * (cellH + 3);
      ctx.fillStyle = GLYPH_CELL;
      ctx.fillRect(cxp, cyp, cellW - 3, cellH);
      var b = state.key.charCodeAt(ki) & 0xff;
      var g = GLYPHS[Math.min(3, Math.floor(b / 64))];
      ctx.fillStyle = PHOS;
      ctx.globalAlpha = 0.55 + 0.45 * ((b % 64) / 63);
      ctx.fillText(g, cxp + (cellW - 3 - cw) / 2, cyp + Math.round((cellH - fs) / 2));
      ctx.globalAlpha = 1;
    }
    L.regions.matrix = { x: x0, y: matY, w: L.availW, h: keyRows * (cellH + 3) };
    y = matY + keyRows * (cellH + 3) + Math.round(lh * 0.4);

    // ----- footer hint -----
    textFit('TAP INPUT TO TYPE · TAP MODE TO SWITCH · TAP KEY MATRIX TO RE-ROLL KEY', x0, y, PHOS, 0.4, fs, L.availW);

    // ----- CRT: flicker + scanlines -----
    var bright = flickerTab[Math.floor(T * 9) % 16];
    if (bright < 1) {
      ctx.fillStyle = 'rgba(0,0,0,' + (1 - bright).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    for (var sy = 0; sy < H; sy += 3) ctx.fillRect(0, sy, W, 1);
  }

  // ---------- interaction ----------
  function inRect(r, x, y) { return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
  function eventPos(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: cx - rect.left, y: cy - rect.top };
  }
  function sliderLenAt(x) {
    var r = GL.regions.slider;
    var f = (x - r.tx0) / (r.tx1 - r.tx0);
    f = Math.max(0, Math.min(1, f));
    return 8 + Math.round(f * 24);
  }
  function onDown(e) {
    if (!GL) return;
    var p = eventPos(e);
    if (inRect(GL.regions.modeEnc, p.x, p.y)) { setMode('encrypt'); return; }
    if (inRect(GL.regions.modeDec, p.x, p.y)) { setMode('decrypt'); return; }
    if (inRect(GL.regions.slider, p.x, p.y)) {
      state.dragging = true;
      state.sliderChanged = false;
      var nl = sliderLenAt(p.x);
      if (nl !== state.keyLen) { state.keyLen = nl; state.sliderChanged = true; regenKey(); state.lastEditT = pieceT(); }
      state.focused = false;
      draw(pieceT());
      return;
    }
    if (inRect(GL.regions.matrix, p.x, p.y)) {
      state.keyGen++;
      regenKey();
      state.lastEditT = pieceT();
      draw(pieceT());
      return;
    }
    state.focused = true;
    draw(pieceT());
  }
  function onMove(e) {
    if (!state.dragging || !GL) return;
    var p = eventPos(e);
    var nl = sliderLenAt(p.x);
    if (nl !== state.keyLen) {
      state.keyLen = nl;
      state.sliderChanged = true;
      regenKey();
      state.lastEditT = pieceT();
      draw(pieceT());
    }
  }
  function onUp() {
    if (state.dragging && state.sliderChanged) {
      state.keyGen++;               // a fresh key at the new length
      regenKey();
      state.lastEditT = pieceT();
      draw(pieceT());
    }
    state.dragging = false;
  }
  function setMode(m) {
    if (state.mode !== m) {
      state.mode = m;
      state.lastEditT = pieceT();
    }
    state.focused = true;
    draw(pieceT());
  }
  function onKey(e) {
    if (!state.focused) return;
    var t = pieceT();
    if (e.key === 'Backspace') {
      if (state.mode === 'encrypt') state.plain = state.plain.slice(0, -1);
      else state.cipherHex = state.cipherHex.slice(0, -1);
      state.lastEditT = t;
      if (e.preventDefault) e.preventDefault();
    } else if (e.key && e.key.length === 1) {
      if (state.mode === 'encrypt') {
        if (state.plain.length < 240) state.plain += e.key;
      } else {
        if (/[0-9a-fA-F\s]/.test(e.key) && state.cipherHex.length < 480) state.cipherHex += e.key.toUpperCase();
      }
      state.lastEditT = t;
      if (e.preventDefault) e.preventDefault();
    } else {
      return;
    }
    if (state.mode === 'encrypt') state.cipherHex = encryptText(state.plain, state.key);
    draw(t);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
  }
  window.addEventListener('keydown', onKey);

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(pieceT());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
