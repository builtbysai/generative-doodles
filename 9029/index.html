<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8470;9029 &middot; Proved Unison</title>
<style>
  :root{ --ink:#101319; --paper:#f2ead8; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ink)}
  body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--paper);
       -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
  #plate{position:absolute;top:14px;left:18px;pointer-events:none;user-select:none;
    font-size:13px;letter-spacing:.14em;color:rgba(242,234,216,.62);text-transform:uppercase}
  #plate b{color:var(--paper);font-weight:700}
  #rule{position:absolute;top:36px;left:18px;pointer-events:none;user-select:none;
    font-size:11px;letter-spacing:.08em;color:rgba(242,234,216,.38)}
  #prog{position:absolute;left:0;bottom:0;height:3px;background:rgba(242,234,216,.85);width:0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="plate"><b>&#8470;9029</b> &middot; Proved Unison</div>
  <div id="rule">24 voices &middot; entries at k&middot;log&#8322;(j) &middot; one landing</div>
  <div id="prog"></div>
</div>
<script>
"use strict";
/* Seed 262 "Proved Unison": a visual canon. 24 streams enter on the
   closed-form schedule entry_j = K*log2(j), each accelerating on its own
   curve, and all 24 land at the right edge at exactly the same instant.
   The synchronism is exact by construction, not staged: every stream maps
   its entry time to x=0 and the cycle end to x=W, so the unison is proved
   by the equation. */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const prog = document.getElementById('prog');

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromURL(){
  const m = /[?&]seed=(\d+)/.exec(location.search);
  return m ? (parseInt(m[1],10) >>> 0) : ((Math.random()*1e9)|0);
}
let SEED = seedFromURL();
let rnd = mulberry32(SEED);

const VOICES = 24;
const CYCLE = 48;          // seconds of canon before the unison hold
const HOLD = 4.2;          // seconds of held unison
const TRAIL = 46;          // trail points per voice

const PALETTES = [
  ['#ff5a3c','#ff8a3c','#ffc23c','#ffe98a'],
  ['#3ce8ff','#3ca8ff','#8e7bff','#d0a6ff'],
  ['#a4ff3c','#3cffb0','#3ce8ff','#fff06a'],
  ['#ff6a9e','#ff9e6a','#ffd23c','#fff6d8']
];
const INK = '#101319';

let W=0, H=0, DPR=1;
let pal, gamma, Kentry, entries, heads, trails, ticks, t0, cycleCount;

function hexRGB(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function mix(a,b,f){
  const A=hexRGB(a), B=hexRGB(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*f)+','+Math.round(A[1]+(B[1]-A[1])*f)+','+Math.round(A[2]+(B[2]-A[2])*f)+')';
}
function laneColor(i){
  const n = pal.length-1, x = i/(VOICES-1)*n, k = Math.min(n-1, Math.floor(x));
  return mix(pal[k], pal[k+1], x-k);
}

function newCycle(){
  rnd = mulberry32(SEED + cycleCount*7919);
  pal = PALETTES[(rnd()*PALETTES.length)|0];
  gamma = 1.15 + rnd()*0.4;
  Kentry = (CYCLE*0.45)/Math.log2(VOICES);
  entries = [];
  for(let j=1;j<=VOICES;j++) entries.push(Kentry*Math.log2(j));
  heads = new Array(VOICES).fill(null);
  trails = [];
  ticks = [];
  for(let j=0;j<VOICES;j++){ trails.push([]); ticks.push({acc:0, pts:[]}); }
  t0 = performance.now()/1000;
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

function laneY(i){ return (i+0.5)*H/VOICES; }

function draw(now){
  const t = now - t0;
  const dt = Math.min(0.05, (now - (draw.last||now))/1000);
  draw.last = now;
  ctx.fillStyle = INK;
  ctx.fillRect(0,0,W,H);

  const laneH = H/VOICES;
  const cycT = t % (CYCLE+HOLD);
  const inHold = cycT >= CYCLE;

  // lane separators, very faint
  ctx.strokeStyle = 'rgba(242,234,216,0.055)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=1;i<VOICES;i++){ ctx.moveTo(0,i*laneH); ctx.lineTo(W,i*laneH); }
  ctx.stroke();

  // entry ticks along the bottom edge
  ctx.fillStyle = 'rgba(242,234,216,0.35)';
  for(let j=0;j<VOICES;j++){
    const x = entries[j]/CYCLE*W;
    ctx.fillRect(x, H-16, 1.5, 7);
  }

  for(let j=0;j<VOICES;j++){
    const e = entries[j], y = laneY(j), col = laneColor(j);
    const tr = trails[j], tk = ticks[j];
    if(cycT < e){
      // waiting: dim origin dot
      ctx.fillStyle = 'rgba(242,234,216,0.16)';
      ctx.beginPath(); ctx.arc(10, y, 2, 0, 7); ctx.fill();
      continue;
    }
    const tt = inHold ? CYCLE : cycT;
    const ph = Math.pow((tt-e)/(CYCLE-e), gamma);
    const x = Math.min(W, ph*W);

    // each stream leaves ticks of its own accelerating clock: the lane's history
    if(!inHold){
      tk.acc += dt;
      if(tk.acc >= 0.85){
        tk.acc = 0;
        tk.pts.push({x:x, y:y});
        if(tk.pts.length > 60) tk.pts.shift();
      }
    }
    ctx.fillStyle = col;
    for(const p of tk.pts){
      ctx.globalAlpha = 0.42;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // trail
    tr.push({x:x, y:y});
    if(tr.length > TRAIL) tr.shift();
    for(let k=1;k<tr.length;k++){
      const f = k/tr.length;
      ctx.strokeStyle = col;
      ctx.globalAlpha = f*f*0.6;
      ctx.lineWidth = 1.2 + f*3.6;
      ctx.beginPath();
      ctx.moveTo(tr[k-1].x, tr[k-1].y);
      ctx.lineTo(tr[k].x, tr[k].y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // head comet
    const pulse = 0.75 + 0.25*Math.sin(now*6 + j*0.7);
    ctx.save();
    ctx.shadowColor = col; ctx.shadowBlur = 16*pulse;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, 3.2+2.6*pulse, 0, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(x, y, 1.5, 0, 7); ctx.fill();

    // entry bloom
    if(cycT - e < 1.4 && !inHold){
      const f = 1-(cycT-e)/1.4;
      ctx.strokeStyle = col; ctx.globalAlpha = f*0.8; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(10, y, 4+(1-f)*26, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // the unison: every head is exactly at x=W
  if(inHold){
    const ht = cycT - CYCLE;
    const fade = ht < 0.6 ? ht/0.6 : Math.max(0, 1-(ht-0.6)/(HOLD-0.6));
    const g = ctx.createLinearGradient(W-90,0,W,0);
    g.addColorStop(0,'rgba(255,246,216,0)');
    g.addColorStop(1,'rgba(255,246,216,'+(0.85*fade)+')');
    ctx.fillStyle = g;
    ctx.fillRect(W-90,0,90,H);
    ctx.fillStyle = 'rgba(255,250,230,'+(0.9*fade)+')';
    ctx.fillRect(W-3,0,3,H);
    // label
    ctx.globalAlpha = fade;
    ctx.fillStyle = '#fff6d8';
    ctx.font = '600 '+Math.max(15,Math.min(26,W*0.024))+'px "Avenir Next","Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.save();
    ctx.shadowColor = '#ffd23c'; ctx.shadowBlur = 22;
    ctx.fillText('U N I S O N', W/2, H*0.5 - 8);
    ctx.restore();
    ctx.font = '400 '+Math.max(11,Math.min(15,W*0.014))+'px "Avenir Next","Segoe UI",sans-serif';
    ctx.fillStyle = 'rgba(242,234,216,0.85)';
    ctx.fillText('twenty-four voices · one landing', W/2, H*0.5 + 22);
    ctx.globalAlpha = 1;
  }

  prog.style.width = (Math.min(cycT,CYCLE)/CYCLE*100).toFixed(2)+'%';

  if(t >= CYCLE+HOLD){
    cycleCount++;
    newCycle();
  }
  requestAnimationFrame(drawT);
}
function drawT(ts){ draw(ts/1000); }

canvas.addEventListener('pointerdown', ()=>{
  SEED = (Math.random()*1e9)|0;
  cycleCount = 0;
  newCycle();
});

resize();
cycleCount = 0;
newCycle();
requestAnimationFrame(drawT);
</script>
</body>
</html>
