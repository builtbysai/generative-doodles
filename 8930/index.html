<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silent Score</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0908;
  }
  body { position: fixed; inset: 0; }
  #stage { position: fixed; inset: 0; cursor: pointer; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 46%, rgba(0,0,0,0.55) 100%);
  }
  .caption {
    position: fixed; left: 0; right: 0;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; user-select: none;
    font-family: Georgia, "Times New Roman", serif;
    color: #cbbfa8; padding: 0 20px;
  }
  .caption .no {
    display: block; font-size: 10px; letter-spacing: 0.42em; text-indent: 0.42em;
    color: #6f6353; margin-bottom: 7px; font-family: Verdana, sans-serif;
  }
  .caption h1 {
    margin: 0 0 6px; font-size: 21px; font-weight: 400; letter-spacing: 0.14em;
    text-indent: 0.14em; color: #e9dfc9;
  }
  .caption p { margin: 0; font-size: 12.5px; line-height: 1.65; color: #9d9078; font-style: italic; }
  .caption p .bpm { color: #e0b36a; font-style: normal; font-family: Verdana, sans-serif; font-size: 11px; letter-spacing: 0.08em; }
  .caption p .hint { display: block; font-style: normal; font-family: Verdana, sans-serif; font-size: 10px; letter-spacing: 0.06em; color: #6f6353; margin-top: 5px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="vignette"></div>
<div class="caption">
  <span class="no">№8930</span>
  <h1>SILENT SCORE</h1>
  <p>A song nobody hears, played anyway.<br>
  <span class="bpm" id="bpmtag">-- BPM, GHOST BASS</span>, nothing plugged in.<br>
  <span class="hint">tap anywhere for a new song &nbsp;·&nbsp; <span id="seedtag"></span></span></p>
</div>
<script>
"use strict";
/* ============================================================
   SILENT SCORE
   A polar waveform ring driven by a parametric "ghost track",
   summed sines on a seeded song. No audio element anywhere in
   the page: the track exists only as numbers. A real rolling
   average beat detector listens to the ghost bass and fires a
   pulse every time the bass crosses its own average, so every
   pulse lands exactly on the hidden BPM grid.
   ============================================================ */

// ---------- seeded RNG ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- ghost song synthesis ----------
function makeSong(seed) {
  const rnd = mulberry32(seed);
  const pick = arr => arr[Math.floor(rnd() * arr.length)];

  const bpm = 84 + Math.floor(rnd() * 21) * 2;      // 84..126, even numbers
  const beat = 60 / bpm;
  const L = 16 * beat;                              // one loop = 4 bars of 4

  // kick: four on the floor, seeded accent map
  const accent = [1.0];
  for (let i = 1; i < 16; i++) accent.push(i % 4 === 0 ? 0.95 : 0.62 + rnd() * 0.28);
  const fKick = 48 + rnd() * 26;                    // sub thump "frequency"

  // ghost off-beat note: a little syncopation that must NOT trigger the detector
  const ghost16 = Math.floor(rnd() * 16);

  // bassline: 8th-note semitone pattern over the loop, some steps rest
  const bassRoot = 55 + rnd() * 22;
  const scale = [0, 0, 3, 5, 7, 10, 12, 12];
  const bassline = [];
  for (let i = 0; i < 32; i++) {
    bassline.push(rnd() < 0.30 ? null : pick(scale));
  }

  // pad: three slow partials with drifting levels
  const pad = [];
  for (let i = 0; i < 3; i++) {
    pad.push({
      f: 110 * Math.pow(2, (pick([0, 3, 5, 7, 10]) + rnd() * 2) / 12),
      a: 0.25 + rnd() * 0.3,
      ph: rnd() * Math.PI * 2,
      drift: 0.5 + rnd() * 1.2,                     // drift cycles per loop
      dph: rnd() * Math.PI * 2
    });
  }

  // melody: a few sparse blips, seeded times and pitches
  const blips = [];
  const nBlips = 4 + Math.floor(rnd() * 5);
  for (let i = 0; i < nBlips; i++) {
    blips.push({
      t: rnd() * L,
      f: 330 * Math.pow(2, pick([0, 2, 3, 5, 7, 9, 10, 12]) / 12),
      a: 0.30 + rnd() * 0.35,
      w: 0.09 + rnd() * 0.16                        // blip width in seconds
    });
  }

  // ---- the ghost bass: the only signal the detector may hear ----
  function bassAt(t) {
    let v = 0;
    const bi = Math.floor(t / beat);
    const lt = t - bi * beat;
    if (lt >= 0 && lt < 0.28) {                     // kick envelope
      const env = Math.exp(-lt * 26);
      v += accent[bi % 16] * env * Math.sin(2 * Math.PI * fKick * lt) * 1.15;
    }
    const gbi = Math.floor(t / (beat / 2));         // 8th-note grid
    const glt = t - gbi * (beat / 2);
    if (glt >= 0 && glt < 0.22) {
      if (gbi % 2 === 1 && (gbi % 16) === ghost16) {
        const env = Math.exp(-glt * 30);            // ghost note: audible, not a "beat"
        v += 0.34 * env * Math.sin(2 * Math.PI * fKick * 1.5 * glt);
      }
      const st = bassline[gbi % 32];
      if (st !== null && !(gbi % 2 === 0)) {        // bassline lives between kicks
        const f = bassRoot * Math.pow(2, st / 12);
        v += 0.22 * Math.exp(-glt * 20) * Math.sin(2 * Math.PI * f * glt);
      }
    }
    return v;
  }

  // ---- envelopes: the visible "score" of the ghost track ----
  // The ring is drawn from these (0..1), not from the raw carriers,
  // so it reads as performed music: thumps, groove, swell, blips.
  function kickEnvAt(t) {
    const bi = Math.round(t / beat);                   // symmetric hill centered on the beat
    const d = t - bi * beat;
    const w = 0.060;
    return accent[(((bi % 16) + 16) % 16)] * Math.exp(-(d * d) / (2 * w * w));
  }
  function bassEnvAt(t) {
    const e8 = Math.round(t / (beat / 2));             // symmetric hills on the 8th grid
    const d = t - e8 * (beat / 2);
    const w = 0.045;
    const idx16 = ((e8 % 16) + 16) % 16;
    const idx32 = ((e8 % 32) + 32) % 32;
    let v = 0;
    if (e8 % 2 === 1 && idx16 === ghost16) v += 0.55 * Math.exp(-(d * d) / (2 * w * w));
    if (bassline[idx32] !== null && !(e8 % 2 === 0)) {
      v += 0.5 * Math.exp(-(d * d) / (2 * w * w));
    }
    return Math.min(1, v);
  }
  function padEnvAt(t) {
    let v = 0;
    for (const p of pad) {
      v += p.a * (0.55 + 0.45 * Math.sin(2 * Math.PI * p.drift * (t / L) + p.dph));
    }
    return Math.min(1, v);
  }
  function melEnvAt(t) {
    let v = 0;
    for (const b of blips) {
      let dt = t - b.t;
      if (dt < -L / 2) dt += L;
      if (dt > L / 2) dt -= L;
      if (Math.abs(dt) < 0.6) v += b.a * Math.exp(-(dt * dt) / (2 * b.w * b.w));
    }
    return Math.min(1, v);
  }
  // one number, 0..~1.2: the whole unheard song as a score
  function scoreAt(t) {
    t = ((t % L) + L) % L;
    return 0.62 * kickEnvAt(t) + 0.22 * bassEnvAt(t)
         + 0.16 * padEnvAt(t) + 0.20 * melEnvAt(t);
  }

  function padAt(t) {
    let v = 0;
    for (const p of pad) {
      const lvl = 0.55 + 0.45 * Math.sin(2 * Math.PI * p.drift * (t / L) + p.dph);
      v += p.a * lvl * Math.sin(2 * Math.PI * p.f * t + p.ph);
    }
    return v;
  }

  function melAt(t) {
    let v = 0;
    for (const b of blips) {
      let dt = t - b.t;
      if (dt < -L / 2) dt += L;
      if (dt > L / 2) dt -= L;
      if (Math.abs(dt) < 0.5) {
        v += b.a * Math.exp(-(dt * dt) / (2 * b.w * b.w)) * Math.sin(2 * Math.PI * b.f * dt);
      }
    }
    return v;
  }

  // the full ghost track (what the ring shows); bass is 55% of the mix
  function ghostAt(t) {
    t = ((t % L) + L) % L;
    return 0.55 * bassAt(t) + 0.27 * padAt(t) + 0.18 * melAt(t);
  }

  return { seed, bpm, beat, L, bassAt, ghostAt, scoreAt };
}

// ---------- palettes: bone waveform, one ember accent, warm dark ground ----------
const PALETTES = [
  { bg: "#0b0908", bone: "233,223,201", accent: "#e0a458", dim: "111,99,83" },
  { bg: "#0a0b10", bone: "226,231,240", accent: "#8fb8e8", dim: "96,104,120" },
  { bg: "#0d0906", bone: "238,228,210", accent: "#d97b4f", dim: "120,102,80" },
  { bg: "#080b0a", bone: "224,234,226", accent: "#9fd0a8", dim: "92,108,98" }
];

// ---------- state ----------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const bpmtag = document.getElementById("bpmtag");
const seedtag = document.getElementById("seedtag");

let song, pal, pulses = [], kickGlow = 0, lastFire = -10;
let eFast = 0, eSlow = 0, beatFlash = 0;
let W = 0, H = 0, DPR = 1, R0 = 0, cx = 0, cy = 0;

const params = new URLSearchParams(location.search);
const seedFromURL = parseInt(params.get("seed"), 10);
const DEFAULT_SEED = 893006;

function newSong(seed, pushURL) {
  song = makeSong(seed);
  const rnd = mulberry32(seed ^ 0x9e37);
  pal = PALETTES[Math.floor(rnd() * PALETTES.length)];
  document.body.style.background = pal.bg;
  pulses = []; kickGlow = 0; eFast = 0; eSlow = 0; lastFire = -10;
  bpmtag.textContent = song.bpm + " BPM, GHOST BASS";
  seedtag.textContent = "seed " + seed;
  if (pushURL) {
    const u = new URL(location.href);
    u.searchParams.set("seed", String(seed));
    history.replaceState(null, "", u);
  }
}
newSong(Number.isFinite(seedFromURL) ? seedFromURL : DEFAULT_SEED, false);

stage.addEventListener("pointerdown", () => {
  newSong(1000 + Math.floor(Math.random() * 900000), true);
});

// ---------- sizing ----------
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W / 2;
  cy = H / 2 - Math.min(H * 0.05, 34);
  R0 = Math.min(W, H) * 0.375;
}
window.addEventListener("resize", resize);
resize();

// ---------- beat detector: honest rolling average on the ghost bass ----------
function detectBeat(dt, now) {
  const t = now % song.L;
  const energy = song.bassAt(t) ** 2;
  const aF = 1 - Math.exp(-dt * 55);                       // fast envelope follower
  const aS = 1 - Math.exp(-dt / (1.5 * song.beat));        // rolling average, ~1.5 beats
  eFast += aF * (energy - eFast);
  eSlow += aS * (energy - eSlow);
  const baseline = Math.max(eSlow, 1e-6);
  if (eFast > baseline * 1.55 && now - lastFire > 0.55 * song.beat) {
    lastFire = now;
    return true;
  }
  return false;
}

// ---------- drawing ----------
const N = 720;  // ring samples

function ringPoint(theta, loopT) {
  const s = song.scoreAt(loopT);
  const r = R0 * (1 + 0.22 * s);
  return [cx + r * Math.cos(theta), cy + r * Math.sin(theta)];
}

function strokePath(seg, style, width, glow, glowColor) {
  ctx.save();
  ctx.strokeStyle = style;
  ctx.lineWidth = width;
  ctx.lineJoin = "round";
  if (glow > 0) { ctx.shadowBlur = glow; ctx.shadowColor = glowColor; }
  ctx.beginPath();
  for (let i = 0; i < seg.length; i++) {
    const p = seg[i];
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
  ctx.restore();
}

function frame(nowMs) {
  const now = nowMs / 1000;
  const dt = Math.min(0.05, now - (frame.prev || now));
  frame.prev = now;
  const beat = song.beat, L = song.L;

  if (detectBeat(dt, now)) {
    kickGlow = 1;
    beatFlash = 1;
    pulses.push({ t0: now });
    if (pulses.length > 12) pulses.shift();
  }
  kickGlow *= Math.exp(-dt * 7);
  beatFlash *= Math.exp(-dt * 5);
  pulses = pulses.filter(p => now - p.t0 < 0.9);

  ctx.clearRect(0, 0, W, H);

  const pNow = now % L;                                // playhead loop-time
  const thNow = -Math.PI / 2 + (pNow / L) * Math.PI * 2;

  // one hairline circle: the staff the score is written on
  ctx.save();
  ctx.strokeStyle = "rgba(" + pal.dim + ",0.22)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // the whole loop of the song, drawn faint
  const loop = [];
  for (let i = 0; i <= N; i++) {
    const th = -Math.PI / 2 + (i / N) * Math.PI * 2;
    loop.push(ringPoint(th, (i / N) * L));
  }
  strokePath(loop, "rgba(" + pal.bone + ",0.42)", 1.2, 0);

  // the recent past, bright: the part being "played" right now
  const trailLen = 1.35 * beat;
  const seg = [];
  const STEPS = 160;
  for (let i = 0; i <= STEPS; i++) {
    let lt = pNow - trailLen + (i / STEPS) * trailLen;
    lt = ((lt % L) + L) % L;
    const th = -Math.PI / 2 + (lt / L) * Math.PI * 2;
    seg.push(ringPoint(th, lt));
  }
  const bone = "rgba(" + pal.bone + ",";
  strokePath(seg, bone + "1)", 2.6, 18, "rgba(" + pal.accent + ",0.85)");

  // playhead
  const hp = ringPoint(thNow, pNow);
  ctx.save();
  ctx.fillStyle = "rgba(" + pal.accent + ",1)";
  ctx.shadowBlur = 16; ctx.shadowColor = "rgba(" + pal.accent + ",0.9)";
  ctx.beginPath(); ctx.arc(hp[0], hp[1], 4.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // beat beads: the hidden grid, faint until struck
  for (let b = 0; b < 16; b++) {
    const lt = b * beat;
    const th = -Math.PI / 2 + (lt / L) * Math.PI * 2;
    const p = ringPoint(th, lt);
    let dlt = pNow - lt; dlt = ((dlt % L) + L) % L;
    const struck = Math.min(1, Math.max(0, 1 - dlt / 0.35));
    const r = 2.6 + 3.6 * struck;
    // short tick outward from the ring at each beat
    const tr = R0 * 1.26;
    const tx = cx + tr * Math.cos(th), ty = cy + tr * Math.sin(th);
    ctx.save();
    ctx.strokeStyle = struck > 0.02
      ? "rgba(" + pal.accent + "," + (0.4 + 0.6 * struck).toFixed(3) + ")"
      : "rgba(" + pal.dim + ",0.45)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx + R0 * 1.235 * Math.cos(th), cy + R0 * 1.235 * Math.sin(th));
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.restore();
    ctx.save();
    if (struck > 0.02) { ctx.shadowBlur = 14; ctx.shadowColor = "rgba(" + pal.accent + ",0.9)"; }
    ctx.fillStyle = struck > 0.02
      ? "rgba(" + pal.accent + "," + (0.4 + 0.6 * struck).toFixed(3) + ")"
      : "rgba(" + pal.dim + ",0.6)";
    ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // beat pulses: tight expanding ripples fired by the detector
  for (const p of pulses) {
    const age = now - p.t0;
    const k = age / 0.9;
    const rr = R0 * (1.04 + age * 0.5);
    ctx.save();
    ctx.strokeStyle = "rgba(" + pal.accent + "," + (0.65 * (1 - k)).toFixed(3) + ")";
    ctx.lineWidth = 3 * (1 - k) + 0.5;
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // kick swell: the whole ring breathes on the detected beat
  if (kickGlow > 0.01) {
    ctx.save();
    ctx.strokeStyle = "rgba(" + pal.accent + "," + (0.35 * kickGlow).toFixed(3) + ")";
    ctx.lineWidth = 1.5;
    const rr = R0 * (1 + 0.22 + 0.04 * kickGlow);
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // bpm tag flares on the beat
  bpmtag.style.color = beatFlash > 0.4 ? "#f4d9a0" : "";
  bpmtag.style.textShadow = beatFlash > 0.4 ? "0 0 14px rgba(224,163,88,0.8)" : "";

  if (!frame.frozen) requestAnimationFrame(frame);
}

if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  // still frame: draw once at a mid-loop instant so the ring reads as a score
  frame.frozen = true;
  frame(12000);
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
