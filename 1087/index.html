<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Third Rail</title>
<style>
  html, body { margin: 0; padding: 0; background: #060608; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var PHASE = 10; // fixed first-frame phase: wall mid-drift, LED in its ON half-second
  var LOOP = 30;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var vw = 0, vh = 0, dpr = 1;
  var curT = PHASE;

  function isPhone() {
    try {
      var s = window.screen;
      if (s && Math.min(s.width, s.height) < 700) return true;
    } catch (e) {}
    return vh > vw * 1.15;
  }

  // Wall drift, closed-form: triangular wave over the 30 s loop, constant
  // freight speed (never eased). Returns -1..1.
  function driftAt(t) {
    var u = (((t % LOOP) + LOOP) % LOOP) / LOOP;
    return u < 0.5 ? -1 + 4 * u : 3 - 4 * u;
  }

  // True catenary through (x0,y0)-(x1,y1) in canvas coords (y down).
  // Curve: y(x) = C - a*cosh((x-h)/a); for a given a, h and C are solved
  // exactly from the endpoints; a itself is bisected so the midpoint sag
  // (canvas distance below the chord) equals sagTarget. Deterministic.
  function solveHC(a, x0, y0, x1, y1) {
    var dx = x1 - x0;
    var sh = Math.sinh(dx / (2 * a));
    var arg = -(y1 - y0) / (2 * a * sh);
    var h = (x0 + x1) / 2 - a * Math.asinh(arg);
    var C = y0 + a * Math.cosh((x0 - h) / a);
    return { h: h, C: C };
  }
  function catY(a, hc, x) {
    var v = (x - hc.h) / a;
    if (v > 50) v = 50; else if (v < -50) v = -50;
    return hc.C - a * Math.cosh(v);
  }
  function drawCatenary(x0, y0, x1, y1, sagTarget) {
    if (Math.abs(x1 - x0) < 0.75) x1 = x0 + 0.75;
    var mx = (x0 + x1) / 2, chordMidY = (y0 + y1) / 2;
    var lo = 0.6, hi = 20000, a = hi;
    for (var i = 0; i < 48; i++) {
      a = (lo + hi) / 2;
      var hc = solveHC(a, x0, y0, x1, y1);
      var sag = catY(a, hc, mx) - chordMidY;
      if (sag > sagTarget) lo = a; else hi = a;
    }
    a = (lo + hi) / 2;
    var sol = solveHC(a, x0, y0, x1, y1);
    var SEG = 28;
    ctx.beginPath();
    for (var k = 0; k <= SEG; k++) {
      var x = x0 + (x1 - x0) * (k / SEG);
      var y = catY(a, sol, x);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function draw(t) {
    if (!vw || !vh) return;
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';

    // backstage black, full-bleed; page ground is the same black
    ctx.fillStyle = '#060608';
    ctx.fillRect(0, 0, vw, vh);

    // square stage, centered
    var S = Math.min(vw, vh);
    var ox = (vw - S) / 2, oy = (vh - S) / 2;
    var phone = isPhone();
    var lw = Math.max(1, S * 0.0016);

    // ---- geometry anchors (fractions of S) ----
    var railY = oy + S * 0.15;
    var wallW = S * 0.34, wallH = S * 0.30;
    var wallTop = oy + S * 0.52;
    var wallCx = ox + S * 0.5 + driftAt(t) * S * 0.02; // freight drift, ~2 px/s
    var wallX = wallCx - wallW / 2;

    // ---- the wall (drawn first where cables overlap its top edge) ----
    ctx.fillStyle = '#101016';
    ctx.fillRect(wallX, wallTop, wallW, wallH);
    ctx.strokeStyle = '#3A3F4A';
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1;
    ctx.strokeRect(wallX, wallTop, wallW, wallH);
    ctx.globalAlpha = 1;
    // dim projected sphere on the wall face: layered flat-alpha discs
    var sx = wallCx, sy = wallTop + wallH * 0.45, sr = S * 0.085;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#1E3A5C';
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(sx, sy, sr * 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // ---- ceiling rail: two chords + ties, full width at 15% ----
    ctx.strokeStyle = '#3A3F4A';
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(1, S * 0.0022);
    ctx.beginPath();
    ctx.moveTo(ox + S * 0.02, railY);
    ctx.lineTo(ox + S * 0.98, railY);
    ctx.stroke();
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(ox + S * 0.02, railY + S * 0.014);
    ctx.lineTo(ox + S * 0.98, railY + S * 0.014);
    ctx.stroke();
    ctx.globalAlpha = 0.4;
    for (var ti = 0; ti <= 10; ti++) {
      var tx = ox + S * (0.02 + 0.096 * ti);
      ctx.beginPath();
      ctx.moveTo(tx, railY);
      ctx.lineTo(tx, railY + S * 0.014);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // roller blocks at the thirds (fixed) — small trolleys riding the rail
    ctx.fillStyle = '#3A3F4A';
    [1 / 3, 2 / 3].forEach(function (f) {
      var bx = ox + S * f;
      ctx.fillRect(bx - S * 0.023, railY - S * 0.011, S * 0.046, S * 0.022);
    });
    // wall trolley blocks: follow the wall along the rail
    [0.1, 0.9].forEach(function (f) {
      var bx = wallX + wallW * f;
      ctx.fillRect(bx - S * 0.016, railY - S * 0.009, S * 0.032, S * 0.018);
    });

    // ---- pulleys on the rail + cable bundle down to the wall ----
    var railAnchors = [0.30, 0.43, 0.57, 0.70];
    var wallAttach = [0.08, 0.36, 0.64, 0.92];
    var sags = [0.026, 0.017, 0.017, 0.026];
    // pulleys
    ctx.strokeStyle = '#3A3F4A';
    ctx.lineWidth = lw;
    railAnchors.forEach(function (f) {
      var px = ox + S * f;
      ctx.beginPath();
      ctx.moveTo(px, railY + S * 0.014);
      ctx.lineTo(px, railY + S * 0.028);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(px, railY + S * 0.036, S * 0.008, 0, Math.PI * 2);
      ctx.stroke();
    });
    // cables: true catenaries, re-derived each frame from the wall position
    ctx.strokeStyle = '#5C6672';
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = lw;
    for (var ci = 0; ci < 4; ci++) {
      var ax = ox + S * railAnchors[ci];
      var ay = railY + S * 0.044;
      var wx = wallX + wallW * wallAttach[ci];
      drawCatenary(ax, ay, wx, wallTop, S * sags[ci]);
    }
    ctx.globalAlpha = 1;

    // ---- winch drum, lower-left: grooved, rotating slowly ----
    var dx = ox + S * 0.16, dy = oy + S * 0.80, dr = S * 0.055;
    // cable from drum up toward the rail
    ctx.strokeStyle = '#5C6672';
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(dx, dy - dr);
    ctx.lineTo(dx, railY + S * 0.014);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#3A3F4A';
    [1, 0.78, 0.56, 0.34].forEach(function (f) {
      ctx.beginPath();
      ctx.arc(dx, dy, dr * f, 0, Math.PI * 2);
      ctx.stroke();
    });
    // spokes: 2 full revolutions per 30 s loop, so the loop closes seamlessly
    var th = (t / LOOP) * Math.PI * 4;
    ctx.globalAlpha = 0.8;
    for (var sp = 0; sp < 3; sp++) {
      var ang = th + sp * (Math.PI * 2 / 3);
      ctx.beginPath();
      ctx.moveTo(dx, dy);
      ctx.lineTo(dx + Math.cos(ang) * dr * 0.92, dy + Math.sin(ang) * dr * 0.92);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#3A3F4A';
    ctx.beginPath(); ctx.arc(dx, dy, S * 0.006, 0, Math.PI * 2); ctx.fill();

    // ---- motor-drive test unit, lower-right, with the one green LED ----
    var ux = ox + S * 0.76, uy = oy + S * 0.76, uw = S * 0.15, uh = S * 0.09;
    ctx.fillStyle = '#0C0C10';
    ctx.fillRect(ux, uy, uw, uh);
    ctx.strokeStyle = '#3A3F4A';
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = 1;
    ctx.strokeRect(ux, uy, uw, uh);
    ctx.globalAlpha = 1;
    // vent slits on the unit
    ctx.strokeStyle = '#3A3F4A';
    ctx.globalAlpha = 0.5;
    for (var vi = 0; vi < 3; vi++) {
      var vy = uy + uh * (0.45 + 0.16 * vi);
      ctx.beginPath();
      ctx.moveTo(ux + uw * 0.12, vy);
      ctx.lineTo(ux + uw * 0.62, vy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // LED: 1 Hz square wave, on for the first half of each second
    var ledOn = (((t % 1) + 1) % 1) < 0.5;
    var lx = ux + uw * 0.82, ly = uy + uh * 0.30, lr = S * 0.006;
    if (ledOn) {
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#4ADE80';
      ctx.beginPath(); ctx.arc(lx, ly, lr * 2.3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(lx, ly, lr, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = '#4ADE80';
      ctx.beginPath(); ctx.arc(lx, ly, lr, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ---- tiny mono labels, corners and units ----
    ctx.fillStyle = '#4A5568';
    ctx.font = Math.max(9, S * (phone ? 0.02 : 0.017)) + 'px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('MOTOR DRIVE UNIT', ux, uy - S * 0.014);
    ctx.fillText('OSC>MODBUS', ux, uy + uh + S * 0.026);
    ctx.fillText('200N', dx + dr + S * 0.012, dy + S * 0.006);

    curT = t;
  }

  function resize() {
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    } else {
      vw = window.innerWidth;
      vh = window.innerHeight;
    }
    dpr = window.devicePixelRatio || 1;
    if (dpr > 2) dpr = 2;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(curT);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener) window.addEventListener('resize', resize);

  resize();
  draw(PHASE);

  // motion loop: anchored at the fixed phase, elapsed time only
  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var loop = function (now) {
      if (t0 === null) t0 = now;
      draw(PHASE + (now - t0) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
