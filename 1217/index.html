<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Windshield Baby</title>
<style>
  html, body { margin: 0; padding: 0; background: #0F380F; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- №1217 "Windshield Baby" — Clint Enns study block CE2 ----
  // An ordinary street through a simulated Gameboy Camera: 160x144 logical
  // pixels, four greens only, 4 fps with dropped frames, hard exposure snaps,
  // drag-pan in 8-pixel chunks. Faces are 4-pixel smears; nothing happens;
  // the ordinariness is the dehumanization.

  var T0 = 9.3;                // fixed phase of the synchronous first frame (seconds)

  // The ONLY colors in the piece. Index = shade 0..3, darkest to lightest.
  var PAL = ['#0F380F', '#306230', '#8BAC0F', '#9BBC0F'];

  var VW = 160, VH = 144;      // Gameboy Camera view, logical pixels
  var WORLD = 320;             // the street is twice as wide as the view

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;

  function isPhone(w, h) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    return sw < 700 || h > w * 1.15;
  }

  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    W = w; H = h;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lastSig = '';
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(nowT()); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(nowT()); });
  }

  // ---- deterministic hash (seeded, no Math.random anywhere) ----
  function hash(n) {
    n = Math.imul(n ^ (n >>> 16), 2246822507);
    n = Math.imul(n ^ (n >>> 13), 3266489909);
    n = n ^ (n >>> 16);
    return (n >>> 0) / 4294967296;
  }
  function hash2(a, b) { return hash(a * 374761393 + b * 668265263); }

  // ---- frame stepping: 4 fps, ~12% of frames dropped (repeated) ----
  function dropped(raw) { return hash(raw * 7919 + 13) < 0.12; }
  var dropCum = [0];           // dropCum[i] = number of dropped frames in [0, i)
  function effIdx(raw) {
    while (dropCum.length <= raw) {
      var i = dropCum.length - 1;
      dropCum.push(dropCum[i] + (dropped(i) ? 1 : 0));
    }
    return raw - dropCum[raw];
  }

  // ---- exposure snaps: every 6-10 s the camera hunts for light ----
  var snapFrames = [];         // raw frame index where each snap starts
  (function () {
    var f = 22;                // first snap ~5.5 s in
    for (var k = 0; k < 512; k++) {
      snapFrames.push(f);
      f += 24 + Math.floor(hash(k * 31 + 7) * 16);   // +6..10 s at 4 fps
    }
  })();
  function snapShift(raw) {
    for (var k = 0; k < snapFrames.length; k++) {
      if (raw >= snapFrames[k] && raw < snapFrames[k] + 2) {
        return (k % 4 === 3) ? -1 : 1;   // one snap in four hunts the other way
      }
      if (snapFrames[k] > raw) break;
    }
    return 0;
  }

  // ---- the street: buildings precomputed across the 320-wide world ----
  var buildings = [];
  (function () {
    var x = 0, bi = 0;
    while (x < WORLD) {
      var wdt = 24 + Math.floor(hash(bi * 17 + 3) * 28);
      var hgt = 34 + Math.floor(hash(bi * 29 + 5) * 40);
      buildings.push({ x: x, w: wdt, top: 88 - hgt, seed: bi });
      x += wdt; bi++;
    }
  })();

  // world shade buffer, stamped fresh per effective frame
  var grid = new Uint8Array(VH * WORLD);
  function put(wx, y, shade) {
    wx = ((wx % WORLD) + WORLD) % WORLD;
    if (y >= 0 && y < VH) grid[y * WORLD + wx] = shade;
  }
  function rect(wx, y, w, h, shade) {
    for (var yy = y; yy < y + h; yy++)
      for (var xx = 0; xx < w; xx++) put(wx + xx, yy, shade);
  }

  function stampScene(f) {
    var x, y, i;
    // sky: mid green with sparse dither speckle
    for (y = 0; y < 88; y++)
      for (x = 0; x < WORLD; x++) {
        var hv = hash2(x, y);
        grid[y * WORLD + x] = hv < 0.02 ? 3 : (hv > 0.985 ? 1 : 2);
      }
    // sun block + two blocky clouds (drift 1 px per 4 frames)
    rect(268, 8, 10, 10, 3);
    var cd = Math.floor(f / 4);
    rect(30 + cd % 60, 12, 22, 5, 3); rect(36 + cd % 60, 8, 10, 4, 3);
    rect(190 + cd % 40, 20, 16, 4, 3); rect(195 + cd % 40, 17, 7, 3, 3);

    // buildings: dark bodies, hashed windows
    for (i = 0; i < buildings.length; i++) {
      var b = buildings[i];
      rect(b.x, b.top, b.w, 88 - b.top, 1);
      rect(b.x, b.top, b.w, 1, 0);                       // roof line
      for (var wy = b.top + 4; wy < 82; wy += 8) {
        for (var wx = b.x + 3; wx < b.x + b.w - 3; wx += 6) {
          var lit = hash2(b.seed * 101 + wx, wy);
          var sh = lit > 0.86 ? 3 : (lit > 0.55 ? 2 : 0);
          rect(wx, wy, 3, 4, sh);
        }
      }
    }

    // sidewalk + road + curb
    rect(0, 88, WORLD, 12, 2);
    rect(0, 100, WORLD, 40, 0);
    rect(0, 140, WORLD, 4, 1);
    // lane dashes between the two car lanes
    for (x = 0; x < WORLD; x += 16) rect(x, 118, 8, 2, 1);
    // crosswalk: zebra stripes at world x 62..98
    for (x = 62; x <= 94; x += 9) rect(x, 101, 5, 38, 3);

    // traffic light at world x 104 (pole on the sidewalk, box over the road edge)
    rect(104, 62, 2, 38, 0);
    rect(102, 48, 6, 15, 0);
    var phase = f % 28;
    rect(104, 50, 2, 2, phase >= 15 ? 3 : 1);           // top lamp
    rect(104, 54, 2, 2, (phase >= 12 && phase < 15) ? 2 : 1); // middle lamp
    rect(104, 58, 2, 2, phase < 12 ? 3 : 1);            // bottom lamp

    // cars: blocks with darker windows, wrapped around the street
    drawCar(mod(f * 2 + 40, 360) - 20, 104, f);         // lane 1, rightward
    drawCar(mod(300 - f * 3, 360) - 20, 124, f);        // lane 2, leftward, faster

    // pedestrians: two crossing on the crosswalk, one walking the sidewalk
    drawPed(70, crossY(f, 0), f);
    drawPed(84, crossY(f, 30), f + 5);
    drawPed(mod(f + 60, WORLD), 88, f);                 // sidewalk walker

    function mod(v, m) { return ((v % m) + m) % m; }
    function crossY(fr, off) {
      var ph = mod(fr + off, 88);
      var d = ph < 44 ? ph : 87 - ph;
      return 88 + Math.floor(d * 38 / 44);              // head y: far sidewalk to near curb
    }
    function drawCar(cx, cy, fr) {
      rect(cx, cy + 3, 26, 7, 2);                       // body
      rect(cx + 6, cy, 13, 4, 2);                       // cabin
      rect(cx + 8, cy + 1, 4, 2, 1);                    // windows, darker
      rect(cx + 14, cy + 1, 4, 2, 1);
      rect(cx + 3, cy + 10, 5, 3, 1);                   // wheels
      rect(cx + 18, cy + 10, 5, 3, 1);
      rect(cx + 24, cy + 5, 2, 2, 3);                   // headlight block
    }
    function drawPed(px, hy, fr) {
      var bob = fr % 2;
      rect(px + 1, hy + bob, 4, 4, 0);                  // head: a 4-pixel smear
      rect(px, hy + 4 + bob, 6, 5, 1);                  // torso
      if (fr % 2 === 0) { rect(px, hy + 9, 2, 5, 0); rect(px + 4, hy + 9, 2, 4, 0); }
      else { rect(px, hy + 9, 2, 4, 0); rect(px + 4, hy + 9, 2, 5, 0); }
    }
  }

  // ---- frame counter: 3x5 pixel font, shade 3 on a shade 0 patch ----
  var GLYPH = {
    'F': [7, 4, 6, 4, 4], '0': [7, 5, 5, 5, 7], '1': [2, 6, 2, 2, 7],
    '2': [7, 1, 7, 4, 7], '3': [7, 1, 7, 1, 7], '4': [5, 5, 7, 1, 1],
    '5': [7, 4, 7, 1, 7], '6': [7, 4, 7, 5, 7], '7': [7, 1, 2, 2, 2],
    '8': [7, 5, 7, 5, 7], '9': [7, 5, 7, 1, 7]
  };

  // ---- camera pan: drag in hard 8-px chunks, wraps at the street's edge ----
  var camX = 0;
  var dragStartX = 0, dragStartCam = 0, dragging = false;

  function cellSize() {
    return Math.max(1, Math.floor(Math.min(W / VW, H / VH)));
  }

  function nowMs() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return Date.now();
  }
  var startWall = nowMs();
  function nowT() { return T0 + (nowMs() - startWall) / 1000; }

  var lastSig = '';
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var raw = Math.floor(t * 4);
    var f = effIdx(raw);
    var shift = snapShift(raw);
    var sig = raw + '|' + camX + '|' + W + 'x' + H;
    if (sig === lastSig) return;
    lastSig = sig;

    stampScene(f);

    var cell = cellSize();
    var vw = cell * VW, vh = cell * VH;
    var ox = Math.floor((W - vw) / 2), oy = Math.floor((H - vh) / 2);

    ctx.fillStyle = PAL[0];
    ctx.fillRect(0, 0, W, H);

    // render the view window out of the world grid, run-length encoded per row
    for (var y = 0; y < VH; y++) {
      var runShade = -1, runStart = 0;
      for (var vx = 0; vx <= VW; vx++) {
        var sh = -2;
        if (vx < VW) {
          sh = grid[y * WORLD + ((vx + camX) % WORLD)] + shift;
          if (sh < 0) sh = 0; if (sh > 3) sh = 3;
        }
        if (sh !== runShade) {
          if (runShade >= 0) {
            ctx.fillStyle = PAL[runShade];
            ctx.fillRect(ox + runStart * cell, oy + y * cell, (vx - runStart) * cell, cell);
          }
          runShade = sh; runStart = vx;
        }
      }
    }

    // frame counter patch, bottom-right of the view
    var label = 'F' + f;
    var tw = label.length * 4 - 1;
    var pw = tw + 4, ph = 9;
    var px0 = VW - pw - 1, py0 = VH - ph - 1;
    ctx.fillStyle = PAL[0];
    ctx.fillRect(ox + px0 * cell, oy + py0 * cell, pw * cell, ph * cell);
    ctx.fillStyle = PAL[3];
    for (var ci = 0; ci < label.length; ci++) {
      var g = GLYPH[label[ci]];
      for (var gy = 0; gy < 5; gy++)
        for (var gx = 0; gx < 3; gx++)
          if (g[gy] & (4 >> gx)) {
            ctx.fillRect(ox + (px0 + 2 + ci * 4 + gx) * cell, oy + (py0 + 2 + gy) * cell, cell, cell);
          }
    }
  }

  // ---- pointer: pan jumps in 8-logical-pixel chunks, never smooth ----
  function ptrX(e) { return (e && typeof e.clientX === 'number') ? e.clientX : 0; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true; dragStartX = ptrX(e); dragStartCam = camX;
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var cell = cellSize();
      var chunks = Math.round(((ptrX(e) - dragStartX) / cell) / 8);
      var nx = ((dragStartCam + chunks * 8) % 160 + 160) % 160;
      if (nx !== camX) { camX = nx; lastSig = ''; draw(nowT()); }
    });
    canvas.addEventListener('pointerup', function () { dragging = false; });
    canvas.addEventListener('pointercancel', function () { dragging = false; });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerup', function () { dragging = false; });
  }

  resize();
  draw(T0);   // synchronous fixed-phase first frame

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(nowT());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
