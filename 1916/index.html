<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1916 Choir of One</title>
<style>
  html, body { margin: 0; padding: 0; background: #171019; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var BG = '#171019';        // deep plum-black ground, page ground too
  var BG_SOFT = '#221625';   // faint lift behind the braid
  var COPPER = '#c97b4a';    // voice lines, warm copper
  var COPPER_LT = '#e0a06a'; // brighter copper for the original voice
  var ROSE = '#d98a94';      // voice lines, rose
  var ROSE_DK = '#b45a68';   // deeper rose for later copies
  var UMBER = '#5a3a22';     // bass line, deep umber
  var UMBER_LT = '#7a5230';  // bass highlight
  var FRINGE_A = '#a8d8c8';  // iridescent fringe, pale green
  var FRINGE_B = '#c9b8e8';  // iridescent fringe, pale violet
  var FRINGE_C = '#e8d28a';  // iridescent fringe, pale gold
  var INK = '#f2e6da';       // title and hint, warm off-white
  var INK_SOFT = '#b9a394';  // date line, muted warm grey

  // Fixed-phase first frame: t = 38 s. The duet braid has tightened and
  // three vocal copies have been born (at 16, 24 and 32 s), so four voice
  // lines braid above the bass with iridescent fringes where copies nearly
  // coincide. Frame one is byte-reproducible: every line, fringe and wisp
  // is a pure function of t.
  var FIRST_T = 38;

  // Timeline: 60 s cycle. The duet braids alone for the first 16 s; then
  // a new vocal copy is born every 8 s (16, 24, 32, 40, 48), each slightly
  // off-pitch, drifting toward the chord but never arriving.
  var CYCLE = 60;
  var BIRTHS = [16, 24, 32, 40, 48];
  var VOICE_COLORS = [COPPER_LT, ROSE, COPPER, ROSE_DK, '#d97b8a'];

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Score geometry: the timeline runs left to right across the stage.
  // The bass line sits along the bottom third; the voice braid lives
  // above it; the multiplying spectra rise like smoke toward the top.
  function geom() {
    var m = W * 0.07;
    return {
      x0: m, x1: W - m,
      bassY: H * 0.74,
      braidY: H * 0.47,
      braidAmp: H * 0.085,
      topY: H * 0.10
    };
  }

  // How many vocal copies exist at time t (1 = the original voice alone).
  function voiceCount(t) {
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    var n = 1;
    for (var i = 0; i < BIRTHS.length; i++) {
      if (ph >= BIRTHS[i]) { n++; }
    }
    return n;
  }

  // Micro-tuning offset of copy i at time t, in px at unit scale.
  // Each copy is born off-pitch and drifts toward the chord, but a
  // residual detune floor keeps it from ever arriving at unison.
  function detune(i, t) {
    if (i === 0) { return 0; }
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    var age = ph - BIRTHS[i - 1];
    if (age < 0) { return 0; }
    var dir = (i % 2 === 0) ? 1 : -1;
    var start = (14 + hash(i * 7 + 3) * 10) * dir;
    var floor = (4.5 + hash(i * 11 + 5) * 2.5) * dir;
    return floor + (start - floor) * Math.exp(-age / 9);
  }

  // The voice braid: two seed lines (voice and its counterpoint partner)
  // braiding around each other, tightening as the cycle runs.
  function voiceY(g, i, x, t) {
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    var u = (x - g.x0) / (g.x1 - g.x0); // 0..1 along the timeline
    var tight = 0.55 + 0.45 * clamp(ph / 20, 0, 1); // braid tightens over 20 s
    var wave = Math.sin(u * Math.PI * 5.2 + t * 0.55 + i * 1.1) * g.braidAmp * tight;
    var slow = Math.sin(u * Math.PI * 2.1 - t * 0.22 + i * 2.4) * g.braidAmp * 0.55;
    var rise = -u * u * H * 0.05; // the spectra rise like smoke to the right
    return g.braidY + wave + slow + rise + detune(i, t) * (H / 720);
  }

  // The bass: one dark line along the bottom third, slow and steady,
  // holding the stacked structure up.
  function bassY(g, x, t) {
    var u = (x - g.x0) / (g.x1 - g.x0);
    return g.bassY
      + Math.sin(u * Math.PI * 3.0 + t * 0.30) * H * 0.020
      + Math.sin(u * Math.PI * 7.0 - t * 0.18) * H * 0.008;
  }

  // A thin iridescent fringe between two voice lines, drawn where they
  // nearly coincide: the shimmer of two copies almost in tune.
  function drawFringes(g, t, count) {
    var step = Math.max(2, (g.x1 - g.x0) / 240);
    var FR = [FRINGE_A, FRINGE_B, FRINGE_C];
    for (var i = 0; i < count - 1; i++) {
      ctx.strokeStyle = hexA(FR[i % 3], 0.5);
      ctx.lineWidth = Math.max(0.8, H * 0.0016);
      ctx.beginPath();
      var started = false;
      for (var x = g.x0; x <= g.x1; x += step) {
        var y1 = voiceY(g, i, x, t);
        var y2 = voiceY(g, i + 1, x, t);
        var gap = Math.abs(y2 - y1);
        if (gap < H * 0.016) {
          var my = (y1 + y2) / 2;
          if (!started) { ctx.moveTo(x, my); started = true; }
          else { ctx.lineTo(x, my); }
        } else {
          started = false;
        }
      }
      ctx.stroke();
    }
  }

  // Faint smoke wisps rising above the braid, one per voice, drifting
  // upward and fading: the multiplying spectra leaving the score.
  function drawSmoke(g, t, count) {
    for (var i = 0; i < count; i++) {
      for (var j = 0; j < 2; j++) {
        var sx = g.x0 + (g.x1 - g.x0) * (0.15 + hash(i * 13 + j * 29 + 2) * 0.70);
        var sway = Math.sin(t * 0.25 + i * 1.7 + j * 2.1) * W * 0.015;
        var top = g.topY + hash(i * 5 + j * 3 + 1) * H * 0.08;
        var bot = g.braidY - g.braidAmp * 0.8;
        var segs = 8;
        for (var k = 0; k < segs; k++) {
          var f0 = k / segs, f1 = (k + 1) / segs;
          var y0 = lerp(bot, top, f0), y1 = lerp(bot, top, f1);
          var a = 0.16 * (1 - f0) * (0.7 + 0.3 * Math.sin(t * 0.4 + i * 2.0 + j + k * 0.6));
          if (a <= 0.01) { continue; }
          ctx.strokeStyle = hexA(i % 2 === 0 ? ROSE : COPPER, a4(a));
          ctx.lineWidth = Math.max(1, H * 0.0035 * (1 - f0 * 0.5));
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(sx + sway * f0, y0);
          ctx.lineTo(sx + sway * f1, y1);
          ctx.stroke();
        }
      }
    }
  }

  // Birth marks: a small open ring where each new copy enters the score,
  // at the timeline position of its birth second.
  function drawBirths(g, t, count) {
    for (var i = 1; i < count; i++) {
      var bx = g.x0 + (g.x1 - g.x0) * (BIRTHS[i - 1] / CYCLE);
      var by = voiceY(g, i, bx, t);
      var r = Math.max(3, H * 0.008);
      ctx.strokeStyle = hexA(VOICE_COLORS[i], 0.75);
      ctx.lineWidth = Math.max(1, H * 0.002);
      ctx.beginPath(); ctx.moveTo(bx + r, by); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = hexA(VOICE_COLORS[i], 0.9);
      ctx.beginPath(); ctx.moveTo(bx + r * 0.28, by); ctx.arc(bx, by, r * 0.28, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var g = geom();
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    var count = voiceCount(t);

    // Faint score ground behind the braid.
    ctx.fillStyle = hexA(BG_SOFT, 0.55);
    ctx.fillRect(g.x0, g.braidY - g.braidAmp * 1.7, g.x1 - g.x0, g.braidAmp * 3.4);

    // Staff hairlines, barely there, marking the score.
    ctx.strokeStyle = hexA(INK_SOFT, 0.14);
    ctx.lineWidth = 1;
    for (var s = -1; s <= 1; s++) {
      var sy = g.braidY + s * g.braidAmp * 1.1;
      ctx.beginPath(); ctx.moveTo(g.x0, sy); ctx.lineTo(g.x1, sy); ctx.stroke();
    }

    drawSmoke(g, t, count);

    // The bass: one dark line along the bottom third, drawn thick with a
    // lighter core, holding the whole stacked structure up.
    var step = Math.max(2, (g.x1 - g.x0) / 300);
    ctx.strokeStyle = hexA(UMBER, 0.95);
    ctx.lineWidth = Math.max(3, H * 0.011);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var x = g.x0; x <= g.x1; x += step) {
      var by = bassY(g, x, t);
      if (x === g.x0) { ctx.moveTo(x, by); } else { ctx.lineTo(x, by); }
    }
    ctx.stroke();
    ctx.strokeStyle = hexA(UMBER_LT, 0.6);
    ctx.lineWidth = Math.max(1, H * 0.003);
    ctx.beginPath();
    for (var bx2 = g.x0; bx2 <= g.x1; bx2 += step) {
      var by2 = bassY(g, bx2, t) - H * 0.004;
      if (bx2 === g.x0) { ctx.moveTo(bx2, by2); } else { ctx.lineTo(bx2, by2); }
    }
    ctx.stroke();

    // Bass pulse dots under the line, one per beat of the slow bass.
    for (var b = 0; b < 8; b++) {
      var px = g.x0 + (g.x1 - g.x0) * (b + 0.5) / 8;
      var py = bassY(g, px, t) + H * 0.028;
      var pulse = 0.35 + 0.30 * Math.sin(t * 0.9 + b * 1.3);
      ctx.fillStyle = hexA(UMBER_LT, a4(clamp(pulse, 0.05, 0.7)));
      ctx.beginPath(); ctx.moveTo(px + H * 0.005, py); ctx.arc(px, py, H * 0.005, 0, Math.PI * 2); ctx.fill();
    }

    // The voices: the original spans the whole timeline; each copy enters
    // at its birth position and braids rightward from there, fading in
    // over its first two seconds.
    for (var i = 0; i < count; i++) {
      var startX = i === 0 ? g.x0 : g.x0 + (g.x1 - g.x0) * (BIRTHS[i - 1] / CYCLE);
      var age = i === 0 ? 99 : ph - BIRTHS[i - 1];
      var fade = i === 0 ? 1 : clamp(age / 2, 0, 1);
      ctx.strokeStyle = hexA(VOICE_COLORS[i], a4(0.92 * fade));
      ctx.lineWidth = Math.max(1.6, H * (i === 0 ? 0.0045 : 0.0035));
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      var first = true;
      for (var vx = startX; vx <= g.x1; vx += step) {
        var vy = voiceY(g, i, vx, t);
        if (first) { ctx.moveTo(vx, vy); first = false; }
        else { ctx.lineTo(vx, vy); }
      }
      ctx.stroke();
    }

    drawFringes(g, t, count);
    drawBirths(g, t, count);

    // Copy tally, small caps top-right: how many voices are singing.
    var fsT = Math.round(clamp(W / 34, 11, 16));
    ctx.fillStyle = hexA(INK_SOFT, 0.95);
    ctx.font = '600 ' + fsT + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(count === 1 ? 'ONE VOICE' : count + ' VOICES', W - 18, 34);
    ctx.textAlign = 'left';

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Choir of One', 18, 34);
    ctx.fillStyle = INK_SOFT;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1916 · 2007 · 04 · 11', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(INK_SOFT, 0.9);
    ctx.textAlign = 'center';
    var hint = 'Watch one voice multiply over the detuned bass, never quite arriving at unison.';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    if (W < 560) {
      ctx.fillText('Watch one voice multiply over the detuned bass,', W / 2, H - 34);
      ctx.fillText('never quite arriving at unison.', W / 2, H - 16);
    } else {
      ctx.fillText(hint, W / 2, H - 20);
    }
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs under 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
