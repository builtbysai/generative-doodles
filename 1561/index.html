<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Mother's Compiler</title>
<style>
html, body { margin: 0; padding: 0; background: #14100e; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var HALF_PI = Math.PI / 2;
var BG = [20, 16, 14];
var COLORS = [
  [46, 125, 116],
  [232, 138, 160],
  [228, 185, 60],
  [198, 59, 42]
];
var GRID = 14;
var NT = GRID * GRID;
var WAVE_PERIOD = 20;
var WAVE_DUR = 0.45;
var WAVE_CROSS = 1.2;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function smooth(p) {
  if (p <= 0) return 0;
  if (p >= 1) return 1;
  return p * p * (3 - 2 * p);
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
var rng = mulberry32(1561000);
var colorIdx = [];
for (var ci = 0; ci < 4; ci++) {
  for (var cj = 0; cj < NT / 4; cj++) colorIdx.push(ci);
}
for (var sh = colorIdx.length - 1; sh > 0; sh--) {
  var sj = Math.floor(rng() * (sh + 1));
  var tmp = colorIdx[sh]; colorIdx[sh] = colorIdx[sj]; colorIdx[sj] = tmp;
}
var baseRot = [], subRot = [], breakKind = [], breakPts = [];
for (var ti = 0; ti < NT; ti++) {
  baseRot.push(Math.floor(rng() * 4));
  var sr = [];
  for (var q = 0; q < 4; q++) sr.push(Math.floor(rng() * 4));
  subRot.push(sr);
  var br = rng();
  var kind = 0;
  if (br >= 0.88 && br < 0.94) kind = 1;
  else if (br >= 0.94) kind = 2;
  breakKind.push(kind);
  var pts = [];
  if (kind === 1) {
    for (var t3 = 0; t3 < 3; t3++) {
      pts.push([0.18 + rng() * 0.64, 0.18 + rng() * 0.64, 0.10 + rng() * 0.10, rng() * TAU]);
    }
  } else if (kind === 2) {
    for (var d5 = 0; d5 < 5; d5++) {
      pts.push([0.16 + rng() * 0.68, 0.16 + rng() * 0.68, 0.05 + rng() * 0.05]);
    }
  }
  breakPts.push(pts);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var dragEvents = [];
var dragging = false, lastPX = 0, lastPY = 0;
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function gridGeo() {
  var minDim = Math.min(VW, VH);
  var m = 0.02 * minDim;
  var gs = minDim - 2 * m;
  var s = gs / GRID;
  return { minDim: minDim, m: m, gs: gs, s: s, ox: (VW - gs) / 2, oy: (VH - gs) / 2 };
}
function waveOrigin(k) {
  var r2 = mulberry32(1561000 + k * 7919);
  return { x: 0.15 + r2() * 0.7, y: 0.15 + r2() * 0.7 };
}
function maxDistFrom(g, fx, fy) {
  var px = g.ox + fx * g.gs, py = g.oy + fy * g.gs;
  var d1 = Math.hypot(px - g.ox, py - g.oy);
  var d2 = Math.hypot(px - (g.ox + g.gs), py - g.oy);
  var d3 = Math.hypot(px - g.ox, py - (g.oy + g.gs));
  var d4 = Math.hypot(px - (g.ox + g.gs), py - (g.oy + g.gs));
  return Math.max(d1, d2, d3, d4);
}
function stepsAt(i, t, g) {
  var row = Math.floor(i / GRID), col = i % GRID;
  var cx = g.ox + (col + 0.5) * g.s, cy = g.oy + (row + 0.5) * g.s;
  var speed = (g.gs * Math.SQRT2) / WAVE_CROSS;
  var steps = baseRot[i];
  for (var e = 0; e < dragEvents.length; e++) {
    var ev = dragEvents[e];
    var d = Math.hypot(cx - ev.x, cy - ev.y);
    var arr = ev.t + d / speed;
    steps += smooth((t - arr) / WAVE_DUR);
  }
  var nW = Math.floor(t / WAVE_PERIOD);
  for (var k = 1; k <= nW; k++) {
    var tk = k * WAVE_PERIOD;
    var o = waveOrigin(k);
    var maxD = maxDistFrom(g, o.x, o.y);
    if (t >= tk + maxD / speed + WAVE_DUR) {
      steps += 1;
    } else if (t > tk) {
      var oxp = g.ox + o.x * g.gs, oyp = g.oy + o.y * g.gs;
      var dd = Math.hypot(cx - oxp, cy - oyp);
      steps += smooth((t - (tk + dd / speed)) / WAVE_DUR);
      break;
    } else {
      break;
    }
  }
  return steps;
}
function autoSettled(t, g) {
  var speed = (g.gs * Math.SQRT2) / WAVE_CROSS;
  var nW = Math.floor(t / WAVE_PERIOD);
  var settled = 0;
  for (var k = 1; k <= nW; k++) {
    var tk = k * WAVE_PERIOD;
    var o = waveOrigin(k);
    var maxD = maxDistFrom(g, o.x, o.y);
    if (t >= tk + maxD / speed + WAVE_DUR) settled++;
    else break;
  }
  return settled;
}
function drawTileArcs(s, col) {
  var u = s / 2;
  var lw = u * 0.34;
  ctx.strokeStyle = rgb(col);
  ctx.lineWidth = lw;
  ctx.lineCap = 'butt';
  for (var q = 0; q < 4; q++) {
    var sx = (q % 2) * u - s / 2, sy = Math.floor(q / 2) * u - s / 2;
    var r = subRot[curTile][q];
    var cx, cy, a0, a1;
    if (r === 0) { cx = sx; cy = sy; a0 = 0; a1 = HALF_PI; }
    else if (r === 1) { cx = sx + u; cy = sy; a0 = HALF_PI; a1 = Math.PI; }
    else if (r === 2) { cx = sx + u; cy = sy + u; a0 = Math.PI; a1 = Math.PI * 1.5; }
    else { cx = sx; cy = sy + u; a0 = Math.PI * 1.5; a1 = TAU; }
    ctx.beginPath();
    ctx.moveTo(cx + u * Math.cos(a0), cy + u * Math.sin(a0));
    ctx.arc(cx, cy, u, a0, a1);
    ctx.stroke();
  }
}
function drawTileBreak(s, col, kind, pts) {
  ctx.fillStyle = rgb(col);
  if (kind === 1) {
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      var px = (p[0] - 0.5) * s, py = (p[1] - 0.5) * s, r = p[2] * s, a = p[3];
      ctx.beginPath();
      ctx.moveTo(px + r * Math.cos(a), py + r * Math.sin(a));
      ctx.lineTo(px + r * Math.cos(a + TAU / 3), py + r * Math.sin(a + TAU / 3));
      ctx.lineTo(px + r * Math.cos(a + 2 * TAU / 3), py + r * Math.sin(a + 2 * TAU / 3));
      ctx.closePath();
      ctx.fill();
    }
  } else {
    for (var j = 0; j < pts.length; j++) {
      var q2 = pts[j];
      ctx.beginPath();
      ctx.moveTo((q2[0] - 0.5) * s + q2[2] * s, (q2[1] - 0.5) * s);
      ctx.arc((q2[0] - 0.5) * s, (q2[1] - 0.5) * s, q2[2] * s, 0, TAU);
      ctx.fill();
    }
  }
}
var curTile = 0;
function publishHook(g, rots) {
  if (typeof window !== 'undefined') {
    window.__p1561 = {
      grid: g, rotations: rots.slice(),
      dragEvents: dragEvents.length,
      autoSettled: autoSettled(lastT, g),
      colorCounts: [49, 49, 49, 49],
      breakCounts: [0, 0, 0]
    };
    for (var i = 0; i < NT; i++) window.__p1561.breakCounts[breakKind[i]]++;
  }
}
function draw(t) {
  lastT = t;
  size();
  var g = gridGeo();
  ctx.fillStyle = rgb(BG);
  ctx.fillRect(0, 0, VW, VH);
  var rots = [];
  for (var i = 0; i < NT; i++) {
    var row = Math.floor(i / GRID), col = i % GRID;
    var cx = g.ox + (col + 0.5) * g.s, cy = g.oy + (row + 0.5) * g.s;
    var steps = stepsAt(i, t, g);
    rots.push(steps);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(steps * HALF_PI);
    curTile = i;
    var colr = COLORS[colorIdx[i]];
    if (breakKind[i] === 0) drawTileArcs(g.s, colr);
    else drawTileBreak(g.s, colr, breakKind[i], breakPts[i]);
    ctx.restore();
  }
  publishHook(g, rots);
}
function recordEvent(x, y) {
  if (dragEvents.length < 1000) dragEvents.push({ t: lastT, x: x, y: y });
}
function onDown(e) {
  dragging = true;
  lastPX = e.clientX; lastPY = e.clientY;
  recordEvent(e.clientX, e.clientY);
}
function onMove(e) {
  if (!dragging) return;
  var dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  if (Math.hypot(dx, dy) >= 50) {
    lastPX = e.clientX; lastPY = e.clientY;
    recordEvent(e.clientX, e.clientY);
  }
}
function onUp(e) {
  dragging = false;
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
