<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wabi Sabi Engine</title>
<style>
html, body { margin: 0; padding: 0; background: #F5F1E6; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F5F1E6';
var INK = '#1A1A18';
var MAGENTA = '#B03060';
var GREEN = '#3F7A4E';
var GREY = '#8A8578';
var SEED = 1643001;
/* Frame one is t = 0: the plop, the splatter field and the first
   calligraphic masses are already on the paper. Nothing here reads

var N_STREAKS = 90, N_DOTS = 60, N_MASSES = 3, STROKES_PER_MASS = 3;
function mulberry32(a) {

    a |= 0; a = (a + 0x6D2B79F5) | 0;

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function lerpRgb(a, b, f) {
  return [Math.round(a[0] + (b[0] - a[0]) * f), Math.round(a[1] + (b[1] - a[1]) * f), Math.round(a[2] + (b[2] - a[2]) * f)];
}
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var PAPER_RGB = hexRgb(PAPER);
var INK_RGB = hexRgb(INK);
var MAGENTA_RGB = hexRgb(MAGENTA);
var GREEN_RGB = hexRgb(GREEN);
var GREY_RGB = hexRgb(GREY);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;

}

  var vw = 0, vh = 0;

    vw = window.innerWidth; vh = window.innerHeight;

  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';

/* ---- seeded build: plop, splatter, calligraphic masses ---- */
var PLOP = { x: 0.38, y: 0.40 };

  { x: 0.48, y: 0.52 },
  { x: 0.22, y: 0.62 }

      off: (j - 1) * width * 0.38 + (rng() - 0.5) * width * 0.25,
      wFac: 0.55 + rng() * 0.35,

      x1: PLOP.x + Math.cos(a) * 0.008, y1: PLOP.y + Math.sin(a) * 0.008,
      x2: PLOP.x + Math.cos(a) * len, y2: PLOP.y + Math.sin(a) * len,
      w: 0.5 + rng() * 1.6,
      alpha: 0.15 + rng() * 0.45

  }
  for (i = 0; i < N_DOTS; i++) {
    var da = rng() * TAU;
    var dr = (rng() + rng()) / 2;
    var dist = Math.pow(dr, 1.4) * 0.20;
    dots.push({
      x: PLOP.x + Math.cos(da) * dist,
      y: PLOP.y + Math.sin(da) * dist,
      r: 0.002 + rng() * 0.010,
      alpha: 0.20 + rng() * 0.55

  }
  for (m = 0; m < N_MASSES; m++) {
    var mc = MASS_CENTERS[m];
    var strokes = [];
    for (s = 0; s < STROKES_PER_MASS; s++) {
      var ang = rng() * TAU;
      var sx = mc.x + (rng() - 0.5) * 0.10;
      var sy = mc.y + (rng() - 0.5) * 0.10;
      strokes.push(genStroke(rng, sx, sy, ang, 0.10 + rng() * 0.12, 0.014 + rng() * 0.010));
    }
    /* Ink pool: a low-alpha irregular blob under the mass. */
    var pool = [], k;
    for (k = 0; k < 14; k++) {
      var pa = (k / 14) * TAU;
      var pr = 0.025 + rng() * 0.025;
      pool.push({ x: mc.x + Math.cos(pa) * pr, y: mc.y + Math.sin(pa) * pr });
    }
    masses.push({ cx: mc.x, cy: mc.y, strokes: strokes, pool: pool, phase: rng() * TAU });

}
var FIELD = buildField(SEED);
/* ---- runtime edit state: viewer strokes, washes, responses ---- */
var userStrokes = [];   /* { segs, phase } in field units */
var userBursts = [];    /* { x, y, streaks, dots } in field units */
var washes = [];        /* { x, y, r, born } in field units */
var responses = [];     /* { strokes, pool, phase, born } answer masses */
var massDrift = [];     /* per mass { dx, dy, from, to } in px */
var editCount = 0;
var i;
for (i = 0; i < N_MASSES; i++) massDrift.push({ dx: 0, dy: 0, from: 0, to: 0 });
var clockT = PHASE;
var drawing = false, curPts = [], lastMoveT = -1, washedThisHold = false;
var downX = 0, downY = 0;
function fieldPoint(e) {
  var rect = compRect();
  var px = 0, py = 0;
  if (typeof e.offsetX === 'number') { px = e.offsetX; py = e.offsetY; }
  else if (typeof e.clientX === 'number' && canvas.getBoundingClientRect) {
    var b = canvas.getBoundingClientRect();
    px = e.clientX - b.left; py = e.clientY - b.top;

function burstAt(fx, fy, seed) {
  var rng = mulberry32(seed);

  for (i = 0; i < 10; i++) {
    var a = rng() * TAU;
    var len = 0.01 + rng() * 0.06;
    streaks.push({
      x1: fx, y1: fy,
      x2: fx + Math.cos(a) * len, y2: fy + Math.sin(a) * len,
      w: 0.5 + rng() * 1.2, alpha: 0.2 + rng() * 0.4

  }
  for (i = 0; i < 6; i++) {
    var da = rng() * TAU, dd = rng() * 0.05;
    dots.push({ x: fx + Math.cos(da) * dd, y: fy + Math.sin(da) * dd, r: 0.002 + rng() * 0.006, alpha: 0.3 + rng() * 0.4 });

/* Balance pass: after each edit the system re-weights the negative

    var s0 = userStrokes[u].segs[0];

    strokes.push(genStroke(rng, qx + (rng() - 0.5) * 0.06, qy + (rng() - 0.5) * 0.06, rng() * TAU, 0.07 + rng() * 0.06, 0.010 + rng() * 0.006));

function onPointerDown(e) {

  lastMoveT = clockT;
  washedThisHold = false;

function onPointerMove(e) {

  canvas.addEventListener('pointerleave', onPointerUp);
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mouseup', onPointerUp);
}
if (typeof window !== 'undefined') {

  if (window.addEventListener) window.addEventListener('resize', size);
}
/* ---- drawing ---- */
function drawDot(cx, cy, r) {
  ctx.beginPath();

  ctx.arc(cx, cy, r, 0, TAU);

function strandColor(kind, t, phase) {
  if (kind === 1) {

    var f2 = 0.5 + 0.5 * Math.sin(TAU * t / 120 + phase + 1.3);

function draw(t) {

  for (i = 0; i < FIELD.dots.length; i++) {
    var dt = FIELD.dots[i];
    var pulse = 0.85 + 0.15 * Math.sin(TAU * t / 11 + dt.x * 40);
    ctx.fillStyle = rgba(GREY_RGB, dt.alpha * pulse);
    drawDot(rect.x + dt.x * rect.w, rect.y + dt.y * rect.h, Math.max(0.7, dt.r * rect.w));
    ctx.fill();
  }
  /* Authored masses, drifting toward the rebalanced positions. */
  for (i = 0; i < FIELD.masses.length; i++) {
    var m = FIELD.masses[i];
    var dr = massDrift[i];
    var prog = dr.to > dr.from ? smooth((t - dr.from) / (dr.to - dr.from)) : 1;
    var mdx = dr.dx * prog, mdy = dr.dy * prog;
    drawPool(m.pool, rect, 0.05, mdx, mdy);
    drawStrokeSet(m.strokes, rect, t, 1, mdx, mdy);
  }
  /* Viewer plop bursts: every gesture is another brush plop. */
  for (i = 0; i < userBursts.length; i++) {
    var b = userBursts[i];
    for (j = 0; j < b.streaks.length; j++) {
      var bs = b.streaks[j];
      ctx.strokeStyle = rgba(GREY_RGB, bs.alpha);
      ctx.lineWidth = Math.max(0.5, bs.w * rect.w / 720);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(rect.x + bs.x1 * rect.w, rect.y + bs.y1 * rect.h);
      ctx.lineTo(rect.x + bs.x2 * rect.w, rect.y + bs.y2 * rect.h);
      ctx.stroke();
    }
    for (j = 0; j < b.dots.length; j++) {
      var bd = b.dots[j];
      ctx.fillStyle = rgba(GREY_RGB, bd.alpha);
      drawDot(rect.x + bd.x * rect.w, rect.y + bd.y * rect.h, Math.max(0.7, bd.r * rect.w));
      ctx.fill();
    }
  }
  /* Viewer strokes, in the same bristled simulation. */
  for (i = 0; i < userStrokes.length; i++) {
    var us = userStrokes[i];
    drawStrokeSet([us], rect, t, 1, 0, 0);
  }
  /* The stroke being drawn right now. */
  if (drawing && curPts.length > 1) {
    ctx.strokeStyle = rgba(INK_RGB, 0.85);
    ctx.lineWidth = Math.max(1, 0.014 * rect.w / 1);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(rect.x + curPts[0].x * rect.w, rect.y + curPts[0].y * rect.h);
    for (i = 1; i < curPts.length; i++) {
      ctx.lineTo(rect.x + curPts[i].x * rect.w, rect.y + curPts[i].y * rect.h);
    }
    ctx.stroke();
  }
  /* Answering masses fade in where the blank was emptiest. */
  for (i = 0; i < responses.length; i++) {
    var rp = responses[i];
    var fade = smooth((t - rp.born) / 1.5);
    drawPool(rp.pool, rect, 0.05 * fade, 0, 0);
    drawStrokeSet(rp.strokes, rect, t, fade, 0, 0);
  }
  ctx.restore();
  if (!isPhone) {
    ctx.strokeStyle = rgba(INK_RGB, 0.35);
    ctx.lineWidth = 1;
    ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1);
  }
  drawText(rect);
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    streakCount: function () { return N_STREAKS; },
    dotCount: function () { return N_DOTS; },
    massCount: function () { return N_MASSES; },
    strokesPerMass: function () { return STROKES_PER_MASS; },
    plop: function () { return [PLOP.x, PLOP.y]; },
    userStrokeCount: function () { return userStrokes.length; },
    responseCount: function () { return responses.length; },
    washCount: function () { return washes.length; },
    simulateEdit: function (x, y) {
      editCount++;
      userBursts.push(burstAt(x, y, SEED + editCount * 131));
      var rng = mulberry32(SEED + editCount * 57 + 5);
      var pts = [];
      var k;
      for (k = 0; k <= 8; k++) pts.push({ x: x + k * 0.012, y: y + Math.sin(k * 0.9) * 0.02 });
      var segs = [], i, j;
      for (i = 0; i < pts.length - 1; i++) {
        var p0 = pts[i], p1 = pts[i + 1];
        var dx = p1.x - p0.x, dy = p1.y - p0.y;
        var dl = Math.sqrt(dx * dx + dy * dy) || 1;
        var px = -dy / dl, py = dx / dl;
        var w = 0.016;
        for (j = 0; j < 3; j++) {
          var off = (j - 1) * w * 0.38;
          segs.push({ x1: p0.x + px * off, y1: p0.y + py * off, x2: p1.x + px * off, y2: p1.y + py * off, w: 5, kind: j === 1 ? 1 : 0, alpha: 0.8 });
        }
      }
      userStrokes.push({ segs: segs, phase: rng() * TAU });
      balancePass();
    },
    drawAt: function (t) { draw(t); }
  };
}
/* ---- frame one: fixed phase, fixed seed, no wall clock ---- */
size();
var prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
