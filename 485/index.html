<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novilunio</title>
<style>
  html, body { margin: 0; padding: 0; background: #0E3B34; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (Giulia Dall'Ara nocturnal register, per brief)
  var TEAL = '#0E3B34';
  var TEAL_DARK = '#0A2E29';
  var CORAL = '#E4573D';
  var CORAL_DARK = '#C7432C';
  var LAV = '#B388C9';
  var LAV_DEEP = '#7C5CA8';
  var LAV_DARK = '#5E4390';
  var PALE = '#E8D98A';
  var CREAM = '#F0D5B8';
  var MOON_PALE = '#D9CBE8';
  var PAPER = '#FFF6E0';

  var LOOP = 40;           // seconds, full seamless loop
  var FIXED_PHASE = 13.0;  // constant first frame: fronds mid-sway, moon glow mid-cycle

  // Seeded RNG (mulberry32, fixed seed)
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Precomputed seeded dry-brush texture: short strokes and dots, drawn
  // identically every frame. Coordinates live in the 1000x750 design space.
  var brush = [];
  (function buildBrush() {
    var rnd = mulberry32(485013);
    var cols = ['240,213,184', '179,136,201', '232,217,138', '4,26,22', '255,246,224'];
    for (var i = 0; i < 1050; i++) {
      brush.push({
        x: rnd() * 1000, y: rnd() * 750,
        len: 4 + rnd() * 15,
        ang: (rnd() - 0.5) * 0.9,
        w: 0.8 + rnd() * 1.9,
        a: 0.03 + rnd() * 0.06,
        c: cols[Math.floor(rnd() * cols.length)],
        dot: rnd() > 0.72
      });
    }
  })();

  // Seeded frond fans: geometry fixed at build time; only the sway angle
  // is animated, and its period (20s) divides the 40s loop.
  var fans = [];
  (function buildFans() {
    var rnd = mulberry32(485777);
    var defs = [
      { bx: 8,   by: 742, a0: -1.42, a1: -0.42, n: 7, l0: 330, l1: 450 },
      { bx: 992, by: 742, a0: -2.72, a1: -1.72, n: 7, l0: 330, l1: 450 },
      { bx: 6,   by: 96,  a0: -0.30, a1: 0.72,  n: 5, l0: 240, l1: 330 },
      { bx: 994, by: 268, a0: 2.55,  a1: 3.45,  n: 5, l0: 230, l1: 320 },
      { bx: 500, by: 748, a0: -1.85, a1: -1.30, n: 5, l0: 210, l1: 290 }
    ];
    var cols = [LAV_DARK, LAV_DEEP, LAV_DARK, PALE, LAV_DEEP, LAV_DARK, LAV_DEEP];
    for (var f = 0; f < defs.length; f++) {
      var d = defs[f], blades = [];
      for (var i = 0; i < d.n; i++) {
        var t = d.n === 1 ? 0.5 : i / (d.n - 1);
        blades.push({
          ang: d.a0 + (d.a1 - d.a0) * t,
          len: d.l0 + (d.l1 - d.l0) * (0.45 + 0.55 * Math.sin(t * Math.PI)) * (0.9 + rnd() * 0.2),
          wid: 24 + rnd() * 11,
          bend: (rnd() - 0.5) * 0.35,
          col: cols[Math.floor(rnd() * cols.length)],
          ph: rnd() * Math.PI * 2
        });
      }
      fans.push({ bx: d.bx, by: d.by, blades: blades });
    }
  })();

  var vw = 300, vh = 300, dpr = 1, isPhone = false;

  function resize() {
    var vv = window.visualViewport;
    vw = vv ? vv.width : window.innerWidth;
    vh = vv ? vv.height : window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    if (window.screen && window.screen.width && window.screen.height) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = vh > vw * 1.15;
    }
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  // One tapered blade from a corner base, swaying by angOff radians.
  function blade(bx, by, b, angOff) {
    var a = b.ang + angOff;
    var dx = Math.cos(a), dy = Math.sin(a);
    var px = -dy, py = dx;
    var tipX = bx + dx * b.len + px * b.bend * b.len;
    var tipY = by + dy * b.len + py * b.bend * b.len;
    var midX = bx + dx * b.len * 0.52 + px * b.bend * b.len * 0.4;
    var midY = by + dy * b.len * 0.52 + py * b.bend * b.len * 0.4;
    var hw = b.wid / 2;
    ctx.fillStyle = b.col;
    ctx.beginPath();
    ctx.moveTo(bx + px * hw, by + py * hw);
    ctx.quadraticCurveTo(midX + px * hw * 0.55, midY + py * hw * 0.55, tipX, tipY);
    ctx.quadraticCurveTo(midX - px * hw * 0.55, midY - py * hw * 0.55, bx - px * hw, by - py * hw);
    ctx.closePath();
    ctx.fill();
    // Centre rib
    ctx.strokeStyle = 'rgba(10,40,34,0.28)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(midX, midY, tipX, tipY);
    ctx.stroke();
  }

  // Limb segment: a round-capped stroke. Two segments at shrinking widths
  // read as one tapered limb.
  function seg(x1, y1, x2, y2, w, col) {
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function torsoPath() {
    ctx.beginPath();
    ctx.moveTo(-0.34, -0.05);
    ctx.bezierCurveTo(-0.15, -0.155, 0.08, -0.165, 0.27, -0.075);
    ctx.bezierCurveTo(0.37, -0.02, 0.34, 0.05, 0.23, 0.085);
    ctx.bezierCurveTo(0.04, 0.135, -0.16, 0.125, -0.30, 0.045);
    ctx.bezierCurveTo(-0.385, 0.005, -0.385, -0.02, -0.34, -0.05);
    ctx.closePath();
  }

  // One languid reclining figure in local units (length 1), head to the
  // left, legs extended to the right. Faces blank. bend shifts the knees.
  function drawFigure(cx, cy, len, rot, bend) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.scale(len, len);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // Grounding shadow under the body
    ctx.fillStyle = 'rgba(4,26,22,0.35)';
    ctx.beginPath();
    ctx.ellipse(0.06, 0.20, 0.52, 0.065, 0, 0, Math.PI * 2);
    ctx.fill();

    // Far leg: lavender shadow pass offset down, then dark coral
    seg(0.16, 0.05, 0.36, 0.105 + bend, 0.115, LAV);
    seg(0.36, 0.105 + bend, 0.52, 0.055 + bend, 0.085, LAV);
    seg(0.16, 0.02, 0.36, 0.075 + bend, 0.095, CORAL_DARK);
    seg(0.36, 0.075 + bend, 0.53, 0.02 + bend, 0.062, CORAL_DARK);

    // Far arm, resting forward
    seg(-0.24, 0.0, -0.08, 0.115, 0.065, CORAL_DARK);
    seg(-0.08, 0.115, 0.07, 0.085, 0.048, CORAL_DARK);

    // Torso: lavender shadow mass offset down, coral mass on top, so a
    // lavender rim holds along the lower edge.
    ctx.save();
    ctx.translate(0, 0.038);
    ctx.fillStyle = LAV;
    torsoPath();
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = CORAL;
    torsoPath();
    ctx.fill();

    // Near leg, extended and relaxed over the hip
    seg(0.20, 0.08, 0.42, 0.15 + bend, 0.135, LAV);
    seg(0.42, 0.15 + bend, 0.575, 0.09 + bend, 0.10, LAV);
    seg(0.20, 0.05, 0.42, 0.12 + bend, 0.115, CORAL);
    seg(0.42, 0.12 + bend, 0.585, 0.055 + bend, 0.072, CORAL);

    // Near arm, draped along the front
    seg(-0.27, 0.03, -0.13, 0.15, 0.078, CORAL);
    seg(-0.13, 0.15, 0.05, 0.125, 0.055, CORAL);

    // Neck and head: cream, blank face, lavender hair cap behind.
    seg(-0.365, -0.04, -0.29, -0.03, 0.075, CREAM);
    ctx.fillStyle = LAV;
    ctx.beginPath();
    ctx.arc(-0.435, -0.095, 0.084, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = CREAM;
    ctx.beginPath();
    ctx.arc(-0.415, -0.075, 0.088, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function frameRect(x, y, w, h, inner) {
    ctx.fillStyle = 'rgba(4,26,22,0.45)';
    ctx.fillRect(x + 5, y + 6, w, h);
    ctx.fillStyle = LAV;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = inner;
    ctx.fillRect(x + 7, y + 7, w - 14, h - 14);
  }

  function drawFish(cx, cy, s) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.fillStyle = CORAL;
    ctx.beginPath();
    ctx.ellipse(0, 0, 30, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(26, 0); ctx.lineTo(44, -13); ctx.lineTo(44, 13); ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-6, -11); ctx.lineTo(6, -22); ctx.lineTo(12, -10); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = TEAL;
    ctx.beginPath();
    ctx.arc(-16, -3, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(14,59,52,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(2, 0, 9, -1.1, 1.1);
    ctx.stroke();
    ctx.restore();
  }

  function drawBook(cx, cy, s) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.fillStyle = CORAL;
    ctx.beginPath();
    ctx.moveTo(0, -20); ctx.lineTo(34, -26); ctx.lineTo(34, 16); ctx.lineTo(0, 24);
    ctx.lineTo(-34, 16); ctx.lineTo(-34, -26); ctx.lineTo(0, -20); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = PAPER;
    ctx.beginPath();
    ctx.moveTo(0, -16); ctx.lineTo(29, -21); ctx.lineTo(29, 12); ctx.lineTo(0, 19); ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -16); ctx.lineTo(-29, -21); ctx.lineTo(-29, 12); ctx.lineTo(0, 19); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(14,59,52,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -16); ctx.lineTo(0, 19);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(14,59,52,0.35)';
    ctx.lineWidth = 1.6;
    for (var i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-24, -12 + i * 9); ctx.lineTo(-6, -8 + i * 9);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(6, -8 + i * 9); ctx.lineTo(24, -12 + i * 9);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTeapot(cx, cy, s) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.fillStyle = CREAM;
    ctx.beginPath();
    ctx.ellipse(0, 6, 26, 18, 0, 0, Math.PI * 2);
    ctx.fill();
    // Spout
    ctx.beginPath();
    ctx.moveTo(-22, 0); ctx.lineTo(-38, -10); ctx.lineTo(-34, 4); ctx.lineTo(-20, 10);
    ctx.closePath();
    ctx.fill();
    // Lid and knob
    ctx.beginPath();
    ctx.ellipse(0, -11, 13, 5, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -17, 3.4, 0, Math.PI * 2);
    ctx.fill();
    // Handle
    ctx.strokeStyle = CREAM;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(29, 4, 11, -1.2, 1.2);
    ctx.stroke();
    // Base line
    ctx.fillStyle = CORAL;
    ctx.fillRect(-18, 23, 36, 4);
    ctx.restore();
  }

  function draw(p) {
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Page ground: the dark teal, everywhere.
    ctx.fillStyle = TEAL;
    ctx.fillRect(0, 0, vw, vh);

    // Design space 1000x750, fitted and centred so the composition keeps
    // its shape on any screen, phones included.
    var sc = Math.min(vw / 1000, vh / 750);
    var ox = (vw - 1000 * sc) / 2;
    var oy = (vh - 750 * sc) / 2;
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(sc, sc);

    // Night ground inside the design frame
    ctx.fillStyle = TEAL;
    ctx.fillRect(0, 0, 1000, 750);

    // Fronds fanning from the corners, behind everything.
    // Sway period 20s, divides the 40s loop.
    var swayBase = Math.sin((p / 20) * Math.PI * 2);
    for (var f = 0; f < fans.length; f++) {
      var fan = fans[f];
      for (var i = 0; i < fan.blades.length; i++) {
        var b = fan.blades[i];
        var off = Math.sin((p / 20) * Math.PI * 2 + b.ph) * 0.028 + swayBase * 0.008;
        blade(fan.bx, fan.by, b, off);
      }
    }

    // Crescent moon, top-right. Glow breathes on a 20s cycle.
    var glow = 0.5 + 0.5 * Math.sin((p / 20) * Math.PI * 2);
    ctx.fillStyle = 'rgba(232,217,138,' + (0.10 + 0.13 * glow).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(852, 96, 66 + 10 * glow, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = MOON_PALE;
    ctx.beginPath();
    ctx.arc(852, 96, 45, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = TEAL;
    ctx.beginPath();
    ctx.arc(872, 84, 40, 0, Math.PI * 2);
    ctx.fill();

    // Mini framed scenes floating in the top third.
    frameRect(148, 60, 140, 100, PALE);
    drawFish(218, 110, 1.0);
    frameRect(382, 38, 122, 92, CREAM);
    drawBook(443, 84, 0.92);
    frameRect(592, 74, 114, 88, LAV_DEEP);
    drawTeapot(649, 118, 0.95);

    // Three reclining figures along a descending diagonal. Still.
    drawFigure(268, 428, 355, -0.30, 0.0);
    drawFigure(512, 498, 380, -0.26, 0.035);
    drawFigure(742, 556, 335, -0.29, -0.02);

    // Scallop band along the bottom edge.
    ctx.fillStyle = TEAL_DARK;
    ctx.fillRect(0, 714, 1000, 36);
    var scallopCols = [LAV, PALE, CORAL, CREAM];
    for (var sx = 0; sx <= 19; sx++) {
      ctx.fillStyle = scallopCols[sx % 4];
      ctx.beginPath();
      ctx.arc(25 + sx * 50, 714, 25, Math.PI, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
    }

    // Dry-brush texture overlay, precomputed and identical every frame.
    ctx.lineCap = 'round';
    for (var k = 0; k < brush.length; k++) {
      var g = brush[k];
      ctx.strokeStyle = 'rgba(' + g.c + ',' + g.a.toFixed(3) + ')';
      ctx.fillStyle = 'rgba(' + g.c + ',' + g.a.toFixed(3) + ')';
      if (g.dot) {
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.w, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.lineWidth = g.w;
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.lineTo(g.x + Math.cos(g.ang) * g.len, g.y + Math.sin(g.ang) * g.len);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  // One synchronous first frame at the constant loop phase.
  draw(FIXED_PHASE);

  // Anchored animation: fixed offset plus elapsed, never a wall clock date.
  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var tick = function (ts) {
      if (t0 === null) t0 = ts;
      var elapsed = (ts - t0) / 1000;
      draw((FIXED_PHASE + elapsed) % LOOP);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
