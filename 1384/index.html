<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive Prison</title>
<style>
  html, body { margin: 0; padding: 0; background: #141312; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // Archive Prison — adam-khalil AK1. No readable words on screen; labels are
  // drawn pseudo-script glyphs only. Fully silent: no AudioContext anywhere.
  // Determinism: frame one = draw(0) via a boot flag; the rAF clock starts
  // only once the loop runs. All randomness is mulberry32, never Math.random.
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function isPhone() {
    var s = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (s && s.width && s.height) {
      return Math.min(s.width, s.height) < 700;
    }
    return H > W * 1.15;
  }

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.max(1, Math.floor(w));
    H = Math.max(1, Math.floor(h));
    canvas.width = W;
    canvas.height = H;
  }

  // ---- seeded layout -------------------------------------------------------
  var COLS = 4, ROWS = 5, N = COLS * ROWS;
  var cells = [];
  (function buildCells() {
    for (var i = 0; i < N; i++) {
      var r = mulberry32(1384000 + i * 7919);
      var type = Math.floor(r() * 5); // 0 gem, 1 spiral, 2 ring, 3 shards, 4 vessel
      var pts = [];
      var np = 5 + Math.floor(r() * 4);
      for (var k = 0; k < np; k++) {
        pts.push({ a: (k / np) * Math.PI * 2 + r() * 0.5, d: 0.55 + r() * 0.45 });
      }
      cells.push({
        type: type, pts: pts,
        breathePeriod: 2.2 + r() * 2.6, breathePhase: r() * Math.PI * 2,
        glowPhase: r() * Math.PI * 2,
        red: r() < 0.3, // blood-red seal dot on some drawers
        glyphSeed: 1384000 + i * 7919 + 77,
        grainSeed: 1384000 + i * 7919 + 131
      });
    }
  })();

  // ---- irregular open/slam pulse schedule (seeded, closed-form) ------------
  // Events: cumulative seeded gaps of 3.2–6.4 s; each event opens one drawer
  // (attack 0.4 s, hold 1.0 s, slam 0.3 s). Piece time is phase-shifted +0.8 s
  // so frame one already shows a drawer cracked open.
  var events = [];
  (function buildEvents() {
    var r = mulberry32(1384000 + 99991);
    var t = -0.5, idx = Math.floor(r() * N);
    for (var e = 0; e < 40; e++) {
      events.push({ start: t, drawer: idx });
      t += 3.2 + r() * 3.2;
      idx = (idx + 1 + Math.floor(r() * (N - 1))) % N;
    }
  })();
  function openEnvelope(tt, drawer) {
    for (var e = 0; e < events.length; e++) {
      var ev = events[e];
      if (tt >= ev.start && tt < ev.start + 1.7 && ev.drawer === drawer) {
        var d = tt - ev.start;
        if (d < 0.4) return d / 0.4;            // crack open
        if (d < 1.4) return 1;                  // hold
        return 1 - (d - 1.4) / 0.3;             // slam shut
      }
    }
    return 0;
  }

  // ---- drag state (recorded events only, closed-form decay) ---------------
  var drags = []; // {drawer, pull, releasedAt}
  var active = null; // {drawer, startY, pull}
  function drawerAt(x, y) {
    var m = isPhone() ? 6 : 10;
    var gw = W - m * 2, gh = H - m * 2;
    var cw = gw / COLS, ch = gh / ROWS;
    var cx = Math.floor((x - m) / cw), cy = Math.floor((y - m) / ch);
    if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) return -1;
    return cy * COLS + cx;
  }
  function dragPull(tt, drawer) {
    var p = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      if (d.drawer !== drawer) continue;
      if (d.releasedAt === null) p += d.pull;
      else {
        var dt = tt - d.releasedAt;
        if (dt < 6) p += d.pull * Math.exp(-dt / 1.2); // snap-shut decay
      }
    }
    return Math.max(0, Math.min(1, p));
  }
  function onDown(e) {
    var x = e.clientX, y = e.clientY;
    var d = drawerAt(x, y);
    if (d < 0) return;
    active = { drawer: d, startY: y, pull: 0 };
    drags.push({ drawer: d, pull: 0, releasedAt: null, ref: active });
  }
  function onMove(e) {
    if (!active) return;
    var dy = e.clientY - active.startY;
    active.pull = Math.max(0, Math.min(1, dy / 120));
    for (var i = 0; i < drags.length; i++) {
      if (drags[i].ref === active) drags[i].pull = active.pull;
    }
  }
  function onUp(tt) {
    if (!active) return;
    for (var i = 0; i < drags.length; i++) {
      if (drags[i].ref === active) drags[i].releasedAt = tt;
    }
    active = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', function () { onUp(pieceTime); });

  // ---- pseudo-script glyphs (drawn shapes, never text) --------------------
  function glyph(g, x, y, s, col) {
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(1, s * 0.12);
    var r = mulberry32(g);
    var kind = Math.floor(r() * 6);
    ctx.beginPath();
    if (kind === 0) { // chevron
      ctx.moveTo(x - s * 0.4, y + s * 0.3); ctx.lineTo(x, y - s * 0.3); ctx.lineTo(x + s * 0.4, y + s * 0.3);
    } else if (kind === 1) { // triangle outline
      ctx.moveTo(x, y - s * 0.4); ctx.lineTo(x + s * 0.4, y + s * 0.35); ctx.lineTo(x - s * 0.4, y + s * 0.35); ctx.closePath();
    } else if (kind === 2) { // cross
      ctx.moveTo(x - s * 0.35, y); ctx.lineTo(x + s * 0.35, y);
      ctx.moveTo(x, y - s * 0.35); ctx.lineTo(x, y + s * 0.35);
    } else if (kind === 3) { // arc + dot
      ctx.arc(x, y, s * 0.35, Math.PI * 0.9, Math.PI * 2.1);
      ctx.moveTo(x + s * 0.5, y + s * 0.4); ctx.arc(x + s * 0.5, y + s * 0.4, s * 0.09, 0, Math.PI * 2);
    } else if (kind === 4) { // hook
      ctx.moveTo(x - s * 0.3, y - s * 0.4); ctx.lineTo(x - s * 0.3, y + s * 0.2);
      ctx.arc(x, y + s * 0.2, s * 0.3, Math.PI, 0, true);
    } else { // dot pair + tick
      ctx.moveTo(x - s * 0.4, y - s * 0.3); ctx.lineTo(x + s * 0.1, y + s * 0.3);
      ctx.moveTo(x + s * 0.3, y - s * 0.1); ctx.arc(x + s * 0.3, y - s * 0.1, s * 0.08, 0, Math.PI * 2);
    }
    ctx.stroke();
  }

  // ---- object drawing ------------------------------------------------------
  function drawObject(cell, cx, cy, rad, tt) {
    var breathe = 1 + 0.07 * Math.sin((Math.PI * 2 * tt) / cell.breathePeriod + cell.breathePhase);
    var glow = 0.10 + 0.08 * (0.5 + 0.5 * Math.sin((Math.PI * 2 * tt) / (cell.breathePeriod * 0.9) + cell.glowPhase));
    // flat-alpha halo (no gradients)
    ctx.fillStyle = 'rgba(224,150,42,' + glow.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(cx, cy, rad * 1.35 * breathe, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e0962a';
    var rr = rad * breathe;
    ctx.beginPath();
    if (cell.type === 0) { // faceted gem
      for (var k = 0; k < cell.pts.length; k++) {
        var p = cell.pts[k];
        var px = cx + Math.cos(p.a) * rr * p.d, py = cy + Math.sin(p.a) * rr * p.d;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(20,19,18,0.55)'; ctx.lineWidth = Math.max(1, rad * 0.05);
      ctx.beginPath(); ctx.moveTo(cx, cy);
      for (var j = 0; j < cell.pts.length; j++) {
        var q = cell.pts[j];
        ctx.lineTo(cx + Math.cos(q.a) * rr * q.d, cy + Math.sin(q.a) * rr * q.d);
      }
      ctx.stroke();
    } else if (cell.type === 1) { // spiral
      ctx.arc(cx, cy, rr * 0.9, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#141312'; ctx.lineWidth = Math.max(1, rad * 0.09);
      ctx.beginPath();
      for (var a = 0; a <= Math.PI * 4; a += 0.25) {
        var sr = (a / (Math.PI * 4)) * rr * 0.85;
        var sx = cx + Math.cos(a) * sr, sy = cy + Math.sin(a) * sr;
        if (a === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
    } else if (cell.type === 2) { // ring
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#141312';
      ctx.beginPath(); ctx.arc(cx, cy, rr * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e0962a';
      ctx.beginPath(); ctx.arc(cx, cy, rr * 0.28, 0, Math.PI * 2); ctx.fill();
    } else if (cell.type === 3) { // shard cluster
      for (var s2 = 0; s2 < cell.pts.length; s2++) {
        var sp = cell.pts[s2];
        var ox = Math.cos(sp.a) * rr * 0.45, oy = Math.sin(sp.a) * rr * 0.45;
        ctx.beginPath();
        ctx.moveTo(cx + ox, cy + oy - rr * 0.35 * sp.d);
        ctx.lineTo(cx + ox + rr * 0.3, cy + oy + rr * 0.3);
        ctx.lineTo(cx + ox - rr * 0.3, cy + oy + rr * 0.3);
        ctx.closePath(); ctx.fill();
      }
    } else { // vessel
      ctx.beginPath();
      ctx.moveTo(cx - rr * 0.55, cy - rr * 0.7);
      ctx.lineTo(cx + rr * 0.55, cy - rr * 0.7);
      ctx.lineTo(cx + rr * 0.4, cy + rr * 0.7);
      ctx.lineTo(cx - rr * 0.4, cy + rr * 0.7);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#141312';
      ctx.fillRect(cx - rr * 0.55, cy - rr * 0.78, rr * 1.1, rr * 0.14);
    }
  }

  // ---- frame ---------------------------------------------------------------
  var pieceTime = 0;
  var booted = false;
  function draw(t) {
    var tt = t + 0.8; // phase shift: frame one already shows a drawer cracked open
    // cold hallway light from above: flat-alpha band, seeded flicker by quantized time
    ctx.fillStyle = '#141312'; ctx.fillRect(0, 0, W, H);
    var q = Math.floor(tt / 0.12);
    var fr = mulberry32(1384000 + q * 7919)();
    ctx.fillStyle = 'rgba(232,232,226,' + (0.05 + 0.03 * fr).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, Math.max(1, H * 0.12));

    var m = isPhone() ? 6 : 10;
    var gw = W - m * 2, gh = H - m * 2;
    var cw = gw / COLS, ch = gh / ROWS;
    for (var i = 0; i < N; i++) {
      var col = i % COLS, row = Math.floor(i / COLS);
      var x = m + col * cw, y = m + row * ch;
      var cell = cells[i];
      // clip the drawer to its cell: a slid face must read as sliding down
      // inside its slot, never bleeding glyphs into the drawer below
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, cw, ch); ctx.clip();
      var open = openEnvelope(tt, i);
      var pull = dragPull(t, i);
      var slide = Math.max(open, pull) * ch * 0.22; // drawer front slides down
      // cabinet frame
      ctx.fillStyle = '#4a4d52'; ctx.fillRect(x, y, cw, ch);
      // drawer face (slides down when open / pulled)
      ctx.fillStyle = '#9a9a94'; ctx.fillRect(x + 2, y + 2 + slide, cw - 4, ch - 4);
      // dark gap revealed above the slid face
      if (slide > 0.5) {
        ctx.fillStyle = '#141312'; ctx.fillRect(x + 2, y + 2, cw - 4, slide);
        ctx.fillStyle = 'rgba(168,20,20,0.5)'; ctx.fillRect(x + 2, y + 2 + slide - 2, cw - 4, 2);
      }
      // vitrine window
      var vx = x + cw * 0.18, vy = y + 2 + slide + ch * 0.10;
      var vw = cw * 0.64, vh = ch * 0.52;
      ctx.fillStyle = '#141312'; ctx.fillRect(vx, vy, vw, vh);
      ctx.strokeStyle = '#e8e8e2'; ctx.lineWidth = 1;
      ctx.strokeRect(vx + 0.5, vy + 0.5, vw - 1, vh - 1);
      var rad = Math.min(vw, vh) * 0.32;
      drawObject(cell, vx + vw / 2, vy + vh / 2, rad, tt);
      // strain: when open, object pushes — stronger pulse ring
      if (open > 0.05) {
        ctx.strokeStyle = 'rgba(224,150,42,' + (0.25 * open).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(vx + vw / 2, vy + vh / 2, rad * (1.5 + 0.2 * open), 0, Math.PI * 2); ctx.stroke();
      }
      // label plate with pseudo-script glyphs (never text)
      var lx = x + cw * 0.18, ly = y + 2 + slide + ch * 0.70;
      ctx.fillStyle = '#e8e8e2'; ctx.fillRect(lx, ly, cw * 0.64, Math.max(10, ch * 0.12));
      var gs = Math.max(6, ch * 0.09);
      for (var g = 0; g < 4; g++) {
        glyph(cell.glyphSeed + g * 13, lx + cw * 0.10 + g * cw * 0.14, ly + ch * 0.06, gs, '#4a4d52');
      }
      // blood-red seal dot on some drawers
      if (cell.red) {
        ctx.fillStyle = '#a81414';
        ctx.beginPath(); ctx.arc(x + cw - 10, y + 10 + slide, 4, 0, Math.PI * 2); ctx.fill();
      }
      // static seeded grain dots inside the vitrine
      var gr = mulberry32(cell.grainSeed);
      ctx.fillStyle = 'rgba(232,232,226,0.10)';
      for (var d = 0; d < 14; d++) {
        ctx.fillRect(vx + gr() * vw, vy + gr() * vh, 1.5, 1.5);
      }
      ctx.restore();
    }
    // pin canvas size every draw (house rule)
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  var firstTs = 0;
  function loop(ts) {
    if (!booted) { booted = true; firstTs = ts; }
    pieceTime = (ts - firstTs) / 1000;
    draw(pieceTime);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }

  size();
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', size);
    var vv = window.visualViewport;
    if (vv) vv.addEventListener('resize', size);
  }
  draw(0); // synchronous first frame at constant phase
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
