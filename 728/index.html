<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Key</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B1026; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var NIGHT = '#0B1026';     // night city ground
  var BLOCK = '#141B3D';     // city blocks, kiosk body
  var BRASS = '#C9A227';     // keys, door frames
  var BRASS_D = '#7A5E1A';   // key dark edge
  var DOOR = '#2A3358';      // door panels
  var PAPER = '#F5F1E6';     // ledger paper, reveal interiors, label chips
  var INK = '#1A1A1A';       // ledger ink
  var FIGURE = '#F5F5F0';    // citizen silhouettes, key highlight

  // ---------- authored content (specced text: ledger reasons, site labels) ----------
  var REASONS = [
    'for the nurse who works nights',
    'because he waited his turn',
    'for the kid on the corner',
    'she asked so politely',
    'for the poet downstairs',
    'because doors should open',
    'for the new neighbor',
    'he carried her groceries',
    'for the night watchman',
    'because it was her birthday',
    'for the baker up at dawn',
    'she promised to pass it on',
    'for the gardener on floor three',
    'because he fixed the lock',
    'for the singer in the stairwell',
    'no reason, just because'
  ];
  var RELAY_LINES = [
    'passed hand to hand',
    'given onward at the corner',
    'shared with a neighbor',
    'relayed, as promised'
  ];
  var SITES = [
    ['a garden gate', 'mind the roses'],
    ['a museum door', 'the quiet wing'],
    ['an ice-cream counter', 'first scoop free'],
    ['a bathroom', 'the good one'],
    ['a rooftop stair', 'pigeon views'],
    ['a library nook', 'the warm corner'],
    ['a bakery back door', 'smell of dawn'],
    ['a locker room', 'locker twelve'],
    ['a boiler room', 'it hums below'],
    ['a chapel side door', 'candles lit'],
    ['a pool gate', 'after hours'],
    ['a stage door', 'break a leg'],
    ['a fire escape', 'city lookout'],
    ['a pantry', 'jam on the top shelf'],
    ['a greenhouse', 'tomatoes in winter'],
    ['a record shop', 'the listening booth'],
    ['a barber shop', 'one chair free'],
    ['a pharmacy window', 'open all night'],
    ['a school gym', 'echoes of games'],
    ['a post office', 'last mail at six'],
    ['a subway booth', 'the warm tunnel'],
    ['a clock tower', 'mind the bells'],
    ['a wine cellar', 'cool and quiet'],
    ['a nursery', 'naps in progress']
  ];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var viewW = 0, viewH = 0, isPhone = false;
  var currentT = 0;

  // ---------- inert QA hook: ?seed=tNN forces the draw time ----------
  var forcedT = -1;
  (function () {
    try {
      var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(location.search || '');
      if (m) forcedT = parseFloat(m[1]);
    } catch (e) { /* inert hook, QA only */ }
  })();

  // ---------- seeded RNG ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function smoothstep(a, b, x) {
    var s = clamp((x - a) / (b - a), 0, 1);
    return s * s * (3 - 2 * s);
  }
  function lerp(a, b, s) { return a + (b - a) * s; }

  // ---------- world (all seeded choices are size-independent indices) ----------
  var COLS = 6, ROWS = 6;
  var NCIT = 7;
  var worldRng = mulberry32(0x728EED);
  // plaza cells: bottom row, two center cells (kiosk stands there)
  function isPlaza(cx, cy) { return cy === ROWS - 1 && (cx === 2 || cx === 3); }

  var doorCells = [];   // 24 of the non-plaza cells, seeded order
  (function () {
    var cells = [];
    for (var cy = 0; cy < ROWS; cy++) for (var cx = 0; cx < COLS; cx++) {
      if (!isPlaza(cx, cy)) cells.push(cy * COLS + cx);
    }
    // seeded shuffle, take 24
    for (var i = cells.length - 1; i > 0; i--) {
      var j = Math.floor(worldRng() * (i + 1));
      var tmp = cells[i]; cells[i] = cells[j]; cells[j] = tmp;
    }
    doorCells = cells.slice(0, 24);
  })();

  var doors = doorCells.map(function (cell, i) {
    return {
      cell: cell,
      cx: cell % COLS,
      cy: Math.floor(cell / COLS),
      site: SITES[i % SITES.length],
      open: false,
      openP: 0,        // swing progress 0..1 (time-derived during animation)
      jiggleT: -99
    };
  });

  var citizens = [];
  (function () {
    for (var i = 0; i < NCIT; i++) {
      citizens.push({
        gx: 0.7 + worldRng() * (COLS - 1.4),   // home point in grid units
        gy: 0.7 + worldRng() * (ROWS - 1.9),
        ax: 0.25 + worldRng() * 0.45,          // wander amplitude, grid units
        ay: 0.22 + worldRng() * 0.4,
        k1: 1 + Math.floor(worldRng() * 3),    // integer freqs over PERIOD
        k2: 1 + Math.floor(worldRng() * 3),
        p1: worldRng() * Math.PI * 2,
        p2: worldRng() * Math.PI * 2
      });
    }
  })();
  var PERIOD = 90; // wander loop seconds; integer freqs close it exactly

  function citizenPos(c, t) {
    var u = (t % PERIOD) / PERIOD;
    return {
      x: c.gx + c.ax * Math.sin(2 * Math.PI * (c.k1 * u) + c.p1),
      y: c.gy + c.ay * Math.sin(2 * Math.PI * (c.k2 * u) + c.p2)
    };
  }

  // ---------- event state (runtime; frame one has none of it) ----------
  var keys = [];        // {state:'tray'|'drag'|'held'|'busy', holder, dx, dy, busyKind}
  var ledger = [];      // {text, t}
  var contentRng = mulberry32(0x1ED6E2);  // reason picks, relay picks (runtime stream)
  var openAnim = null;  // {door, key, t0}
  var relayAnim = null; // {key, from, to, t0}
  var nextRelayAt = 15 + contentRng() * 10;

  function mintKey() {
    var trayCount = 0;
    for (var i = 0; i < keys.length; i++) if (keys[i].state === 'tray') trayCount++;
    if (trayCount >= 3) return;
    keys.push({ state: 'tray', holder: -1, dx: 0, dy: 0 });
  }
  mintKey(); // frame one: one key ready at the kiosk

  function addLedger(text, t) {
    ledger.push({ text: text, t: t });
    if (ledger.length > 16) ledger.splice(0, ledger.length - 16);
  }

  function holders() {
    var out = [];
    for (var i = 0; i < citizens.length; i++) {
      for (var k = 0; k < keys.length; k++) {
        if (keys[k].state === 'held' && keys[k].holder === i) { out.push(i); break; }
      }
    }
    return out;
  }
  function keyOf(citIdx) {
    for (var k = 0; k < keys.length; k++) {
      if ((keys[k].state === 'held' || keys[k].state === 'busy') && keys[k].holder === citIdx) return keys[k];
    }
    return null;
  }

  // ---------- layout (recomputed on resize) ----------
  var L = null;
  function layout() {
    var ledgerW = isPhone ? Math.max(100, viewW * 0.30)
                          : clamp(viewW * 0.20, 180, 250);
    var cityW = viewW - ledgerW;
    var mx = 14, my = 14;
    var gw = cityW - mx - 10, gh = viewH - my - 12;
    var cw = gw / COLS, ch = gh / ROWS;
    var doorW = Math.min(cw * 0.36, 34), doorH = Math.min(ch * 0.52, 52);
    var kioskW = Math.min(cw * 2.1, 210), kioskH = Math.min(ch * 1.05, 104);
    L = {
      ledgerX: cityW, ledgerW: ledgerW,
      mx: mx, my: my, cw: cw, ch: ch,
      doorW: doorW, doorH: doorH,
      kiosk: {
        cx: mx + gw / 2,
        base: viewH - 12,
        w: kioskW, h: kioskH
      },
      figS: clamp(Math.min(cw, ch) / 46, 0.75, 1.25),
      fontLedger: isPhone ? 9 : 11,
      fontSite: isPhone ? 8.5 : 10
    };
  }
  function cellRect(cx, cy) {
    return { x: L.mx + cx * L.cw, y: L.my + cy * L.ch, w: L.cw, h: L.ch };
  }
  function doorRect(d) {
    var r = cellRect(d.cx, d.cy);
    return {
      x: r.x + (r.w - L.doorW) / 2,
      y: r.y + (r.h - L.doorH) / 2,
      w: L.doorW, h: L.doorH
    };
  }
  function citizenPx(c, t) {
    var g = citizenPos(c, t);
    return { x: L.mx + g.x * L.cw, y: L.my + g.y * L.ch };
  }

  // ---------- drawing helpers ----------
  function drawKey(x, y, s, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle || 0);
    ctx.lineCap = 'round';
    // dark edge underlay
    ctx.strokeStyle = BRASS_D;
    ctx.lineWidth = 4.6 * s;
    ctx.beginPath(); ctx.arc(-9 * s, 0, 5 * s, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4 * s, 0); ctx.lineTo(13 * s, 0); ctx.stroke();
    // brass body
    ctx.strokeStyle = BRASS;
    ctx.lineWidth = 3 * s;
    ctx.beginPath(); ctx.arc(-9 * s, 0, 5 * s, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4 * s, 0); ctx.lineTo(13 * s, 0); ctx.stroke();
    // teeth
    ctx.lineWidth = 2.6 * s;
    ctx.beginPath();
    ctx.moveTo(9 * s, 1 * s); ctx.lineTo(9 * s, 6 * s);
    ctx.moveTo(13 * s, 1 * s); ctx.lineTo(13 * s, 8 * s);
    ctx.stroke();
    // one highlight line along the shaft
    ctx.strokeStyle = FIGURE;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1 * s;
    ctx.beginPath(); ctx.moveTo(-3 * s, -1.6 * s); ctx.lineTo(12 * s, -1.6 * s); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawCitizen(x, y, s, t, idx) {
    var bob = Math.sin(t * 2 + idx * 1.7) * 0.8;
    ctx.fillStyle = FIGURE;
    ctx.beginPath(); ctx.arc(x, y - 9 * s + bob, 4.6 * s, 0, Math.PI * 2); ctx.fill();
    // body: rounded shoulders tapering down
    ctx.beginPath();
    ctx.moveTo(x - 5.6 * s, y + 10 * s);
    ctx.quadraticCurveTo(x - 5.8 * s, y - 3 * s + bob, x, y - 3.4 * s + bob);
    ctx.quadraticCurveTo(x + 5.8 * s, y - 3 * s + bob, x + 5.6 * s, y + 10 * s);
    ctx.closePath(); ctx.fill();
  }

  function wrapText(text, maxW, font) {
    ctx.font = font;
    var words = text.split(' ');
    var lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }

  // ---------- the draw ----------
  function draw(t) {
    currentT = t;
    if (!viewW || !viewH || !L) return;
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.fillStyle = NIGHT;
    ctx.fillRect(0, 0, viewW, viewH);

    var i, j, r, d;

    // blocks
    ctx.fillStyle = BLOCK;
    for (var cy = 0; cy < ROWS; cy++) for (var cx = 0; cx < COLS; cx++) {
      if (isPlaza(cx, cy)) continue;
      r = cellRect(cx, cy);
      ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
    }

    // doors
    for (i = 0; i < doors.length; i++) {
      d = doors[i];
      var dr = doorRect(d);
      var p = d.open ? 1 : 0;
      if (openAnim && openAnim.door === d) {
        p = smoothstep(0.45, 1.3, t - openAnim.t0);
      }
      var jx = 0;
      if (!d.open && t - d.jiggleT < 0.5) {
        jx = Math.sin((t - d.jiggleT) * 40) * 1.4 * (1 - (t - d.jiggleT) / 0.5);
      }
      ctx.save();
      ctx.translate(jx, 0);
      if (p > 0) {
        // revealed interior
        ctx.fillStyle = PAPER;
        ctx.fillRect(dr.x, dr.y, dr.w, dr.h);
      }
      // frame
      ctx.strokeStyle = BRASS;
      ctx.lineWidth = 2;
      ctx.strokeRect(dr.x - 2, dr.y - 2, dr.w + 4, dr.h + 4);
      // panel: hinged at left, swings to a skewed quad as p grows
      var cosA = Math.cos(p * Math.PI * 0.42);
      var skew = dr.h * 0.10 * p;
      ctx.fillStyle = DOOR;
      ctx.beginPath();
      ctx.moveTo(dr.x, dr.y);
      ctx.lineTo(dr.x + dr.w * cosA, dr.y + skew);
      ctx.lineTo(dr.x + dr.w * cosA, dr.y + dr.h - skew);
      ctx.lineTo(dr.x, dr.y + dr.h);
      ctx.closePath(); ctx.fill();
      // knob (rides the free edge)
      if (p < 0.85) {
        ctx.fillStyle = BRASS;
        ctx.beginPath();
        ctx.arc(dr.x + dr.w * cosA - 3.5, dr.y + dr.h / 2, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // site label chip once the swing is well open
      if (p > 0.55) {
        var a = smoothstep(0.55, 0.95, p);
        var fontS = L.fontSite + 'px sans-serif';
        ctx.font = fontS;
        var tw = Math.max(ctx.measureText(d.site[0]).width, ctx.measureText(d.site[1]).width);
        var chipW = tw + 10, chipH = L.fontSite * 2 + 12;
        var chipX = dr.x + dr.w + 7;
        if (chipX + chipW > L.ledgerX - 4) chipX = dr.x - chipW - 7;
        var chipY = clamp(dr.y + dr.h / 2 - chipH / 2, 4, viewH - chipH - 4);
        ctx.globalAlpha = a;
        ctx.fillStyle = PAPER;
        ctx.fillRect(chipX, chipY, chipW, chipH);
        ctx.fillStyle = INK;
        ctx.textBaseline = 'top';
        ctx.fillText(d.site[0], chipX + 5, chipY + 4);
        ctx.fillText(d.site[1], chipX + 5, chipY + 4 + L.fontSite + 2);
        ctx.globalAlpha = 1;
      }
    }

    // kiosk
    var K = L.kiosk;
    ctx.fillStyle = BLOCK;
    ctx.fillRect(K.cx - K.w / 2, K.base - K.h, K.w, K.h);           // booth body
    ctx.fillStyle = BRASS;
    ctx.fillRect(K.cx - K.w / 2 - 6, K.base - K.h - 7, K.w + 12, 5); // roof trim
    ctx.fillRect(K.cx - K.w / 2, K.base - K.h * 0.42, K.w, 4);       // counter line
    // tray keys on the counter
    var tray = [];
    for (i = 0; i < keys.length; i++) if (keys[i].state === 'tray') tray.push(keys[i]);
    for (j = 0; j < tray.length; j++) {
      var slotX = K.cx + (j - (tray.length - 1) / 2) * 36;
      drawKey(slotX, K.base - K.h * 0.42 - 9, 0.9, -0.12);
    }

    // citizens
    var pos = [];
    for (i = 0; i < citizens.length; i++) {
      pos.push(citizenPx(citizens[i], t));
      drawCitizen(pos[i].x, pos[i].y, L.figS, t, i);
    }

    // held keys (small, at the holder's side, gentle bob)
    for (i = 0; i < keys.length; i++) {
      var key = keys[i];
      if (key.state === 'held') {
        var hp = pos[key.holder];
        drawKey(hp.x + 11 * L.figS, hp.y + 4 * L.figS + Math.sin(t * 2 + key.holder) * 0.8, 0.55, 0.5);
      }
    }

    // relay flight
    if (relayAnim) {
      var rp = clamp((t - relayAnim.t0) / 1.1, 0, 1);
      var from = pos[relayAnim.from], to = pos[relayAnim.to];
      var rx = lerp(from.x, to.x, rp);
      var ry = lerp(from.y, to.y, rp) - Math.sin(rp * Math.PI) * 22;
      drawKey(rx + 11 * L.figS, ry, 0.55, 0.5 + rp * 0.6);
    }

    // door-opening flight
    if (openAnim) {
      var ok = openAnim.key;
      var oDoor = openAnim.door;
      var oPos = pos[ok.holder];
      var oRect = doorRect(oDoor);
      var ot = t - openAnim.t0;
      var kx, ky;
      if (ot < 0.45) {
        var s1 = smoothstep(0, 0.45, ot);
        kx = lerp(oPos.x + 11 * L.figS, oRect.x + oRect.w / 2, s1);
        ky = lerp(oPos.y + 4 * L.figS, oRect.y + oRect.h / 2, s1);
      } else if (ot < 1.55) {
        kx = oRect.x + oRect.w / 2; ky = oRect.y + oRect.h / 2;
      } else {
        var s2 = smoothstep(1.55, 2.0, ot);
        kx = lerp(oRect.x + oRect.w / 2, oPos.x + 11 * L.figS, s2);
        ky = lerp(oRect.y + oRect.h / 2, oPos.y + 4 * L.figS, s2);
      }
      drawKey(kx, ky, 0.7, 0.3);
    }

    // dragged key (drawn last among keys, full size)
    for (i = 0; i < keys.length; i++) {
      if (keys[i].state === 'drag') drawKey(keys[i].dx, keys[i].dy, 1.05, 0.15);
    }

    // ledger strip
    ctx.fillStyle = PAPER;
    ctx.fillRect(L.ledgerX, 0, L.ledgerW, viewH);
    ctx.fillStyle = BRASS_D;
    ctx.fillRect(L.ledgerX, 0, 2, viewH);
    var fontL = L.fontLedger + 'px sans-serif';
    var maxTextW = L.ledgerW - 18;
    var ly = 12;
    ctx.textBaseline = 'top';
    // newest at the bottom; oldest shown fades
    var shown = ledger.slice(-14);
    for (i = 0; i < shown.length; i++) {
      var rankFromNewest = shown.length - 1 - i;
      var alpha = clamp(1 - rankFromNewest * 0.055, 0.35, 1);
      var lines = wrapText(shown[i].text, maxTextW, fontL);
      ctx.globalAlpha = alpha;
      // key bullet
      drawKey(L.ledgerX + 9, ly + L.fontLedger * 0.5, 0.28, 0.4);
      ctx.fillStyle = INK;
      ctx.font = fontL;
      for (j = 0; j < lines.length; j++) {
        ctx.fillText(lines[j], L.ledgerX + 15, ly + j * (L.fontLedger + 2));
      }
      ly += lines.length * (L.fontLedger + 2) + 7;
      if (ly > viewH - 20) break;
    }
    ctx.globalAlpha = 1;
  }

  // ---------- runtime event processing (driven by the rAF loop only) ----------
  function processEvents(t) {
    // finish door opening
    if (openAnim && t - openAnim.t0 >= 2.0) {
      openAnim.door.open = true;
      openAnim.key.state = 'held';
      openAnim = null;
    }
    // finish relay flight
    if (relayAnim && t - relayAnim.t0 >= 1.1) {
      relayAnim.key.holder = relayAnim.to;
      relayAnim.key.state = 'held';
      addLedger(RELAY_LINES[Math.floor(contentRng() * RELAY_LINES.length)], t);
      relayAnim = null;
      nextRelayAt = t + 13 + contentRng() * 14;
    }
    // schedule a relay: a holder passes a key onward on their own
    if (!relayAnim && !openAnim && t >= nextRelayAt) {
      var hs = holders();
      var free = [];
      for (var i = 0; i < citizens.length; i++) if (hs.indexOf(i) < 0) free.push(i);
      if (hs.length && free.length) {
        var giver = hs[Math.floor(contentRng() * hs.length)];
        var recv = free[Math.floor(contentRng() * free.length)];
        var k = keyOf(giver);
        if (k && k.state === 'held') {
          k.state = 'busy';
          relayAnim = { key: k, from: giver, to: recv, t0: t };
        }
      }
      if (!relayAnim) nextRelayAt = t + 6 + contentRng() * 8;
    }
  }

  // ---------- interaction ----------
  var dragKey = null;
  var downInfo = null; // {x, y, door, onKiosk}

  function evtPos(e) {
    var x, y;
    if (typeof e.offsetX === 'number') { x = e.offsetX; y = e.offsetY; }
    else {
      var rect = canvas.getBoundingClientRect();
      x = e.clientX - rect.left; y = e.clientY - rect.top;
    }
    return { x: x, y: y };
  }
  function trayKeyPos(idx, count) {
    var K = L.kiosk;
    return { x: K.cx + (idx - (count - 1) / 2) * 36, y: K.base - K.h * 0.42 - 9 };
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (!L) return;
    var p = evtPos(e);
    // grab a tray key?
    var tray = [];
    for (var i = 0; i < keys.length; i++) if (keys[i].state === 'tray') tray.push(keys[i]);
    for (var j = 0; j < tray.length; j++) {
      var kp = trayKeyPos(j, tray.length);
      if (Math.abs(p.x - kp.x) < 26 && Math.abs(p.y - kp.y) < 20) {
        tray[j].state = 'drag';
        tray[j].dx = p.x; tray[j].dy = p.y;
        dragKey = tray[j];
        return;
      }
    }
    // door tap target?
    var hitDoor = null;
    for (var d = 0; d < doors.length; d++) {
      var dr = doorRect(doors[d]);
      if (p.x > dr.x - 6 && p.x < dr.x + dr.w + 6 && p.y > dr.y - 6 && p.y < dr.y + dr.h + 6) {
        hitDoor = doors[d]; break;
      }
    }
    var K = L.kiosk;
    var onKiosk = p.x > K.cx - K.w / 2 - 6 && p.x < K.cx + K.w / 2 + 6 &&
                  p.y > K.base - K.h - 10 && p.y < K.base + 4;
    downInfo = { x: p.x, y: p.y, door: hitDoor, onKiosk: onKiosk };
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!dragKey) return;
    var p = evtPos(e);
    dragKey.dx = p.x; dragKey.dy = p.y;
  });

  function endDrag(e) {
    var p = evtPos(e);
    if (dragKey) {
      // bestow on the nearest citizen within reach
      var best = -1, bestD = 40;
      for (var i = 0; i < citizens.length; i++) {
        var cp = citizenPx(citizens[i], currentT);
        var dd = Math.hypot(cp.x - p.x, cp.y - p.y);
        if (dd < bestD) { bestD = dd; best = i; }
      }
      if (best >= 0) {
        dragKey.state = 'held';
        dragKey.holder = best;
        addLedger(REASONS[Math.floor(contentRng() * REASONS.length)], currentT);
      } else {
        dragKey.state = 'tray';
      }
      dragKey = null;
      return;
    }
    if (downInfo) {
      var moved = Math.hypot(p.x - downInfo.x, p.y - downInfo.y);
      if (moved < 8) {
        if (downInfo.door) tryOpen(downInfo.door);
        else if (downInfo.onKiosk) mintKey();
      }
      downInfo = null;
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', function () {
    if (dragKey) { dragKey.state = 'tray'; dragKey = null; }
    downInfo = null;
  });

  function tryOpen(door) {
    if (door.open || openAnim || relayAnim) return;
    // nearest citizen holding a free key
    var dr = doorRect(door);
    var dcx = dr.x + dr.w / 2, dcy = dr.y + dr.h / 2;
    var best = -1, bestD = Infinity;
    for (var i = 0; i < citizens.length; i++) {
      var k = keyOf(i);
      if (!k || k.state !== 'held') continue;
      var cp = citizenPx(citizens[i], currentT);
      var dd = Math.hypot(cp.x - dcx, cp.y - dcy);
      if (dd < bestD) { bestD = dd; best = i; }
    }
    if (best < 0) { door.jiggleT = currentT; return; }
    var key = keyOf(best);
    key.state = 'busy';
    openAnim = { door: door, key: key, t0: currentT };
  }

  // ---------- sizing ----------
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    viewW = Math.max(1, Math.floor(w));
    viewH = Math.max(1, Math.floor(h));
    canvas.width = viewW;
    canvas.height = viewH;
    var sw = (window.screen && window.screen.width) || 9999;
    var sh = (window.screen && window.screen.height) || 9999;
    isPhone = Math.min(sw, sh) < 700 || viewH > viewW * 1.15;
    layout();
    draw(forcedT >= 0 ? forcedT : currentT);
  }

  // ---------- boot + loop ----------
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    var t = (ts - startStamp) / 1000;
    processEvents(t);
    draw(t);
    requestAnimationFrame(frame);
  }

  function onResize() { resize(); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  resize();
  draw(forcedT >= 0 ? forcedT : 0); // frame one: synchronous, t = 0, never clock-derived

  if (forcedT < 0 && typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
