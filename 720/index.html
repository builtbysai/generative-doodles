<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unknown Script</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0C; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// Unknown Script (EXPANSION #88 okazzsp, block 1)
// An 8x8 field of 64 invented glyphs on black. Every glyph is assembled
// from one fixed part kit: 4 rounded-rectangle strokes (the top, right,
// bottom and left bones of the glyph box) and 4 dots at the corners.
// A glyph is a bitmask over those 8 parts. A slow wave travels the grid
// and each visited cell flips exactly one bit, so the script appears to
// rewrite itself, one stroke or dot at a time. No two cells ever share
// a glyph. The masks stay abstract: no letters, no digits, no symbols.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  bg: '#0A0A0C',
  tones: ['#FF3B30', '#FF9500', '#FFD60A', '#2DD4BF', '#22D3EE', '#F5F5F0']
};

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, isPhone = false;
var CYCLE = 40;      // seconds per full rewrite cycle
var FADE = 0.35;     // seconds a flipped part takes to fade in or out
var GRID = 8;
var CELLS = GRID * GRID;

// Part-kit layout. Bits 0..3 are the edge strokes of the glyph box
// (0 top, 1 right, 2 bottom, 3 left). Bits 4..7 are the corner dots
// (4 top-left, 5 top-right, 6 bottom-right, 7 bottom-left).
function partCount(mask) {
  var n = 0;
  for (var i = 0; i < 8; i++) if (mask & (1 << i)) n++;
  return n;
}
// A mask is admissible only if it cannot read as a character:
// - between two and six parts;
// - never all four strokes: a closed frame reads as O / 0, dots or not;
// - never exactly three strokes: the open boxes read as U / C and kin;
// - a bare parallel stroke pair with no dots reads as an equals sign;
// - a dots-only sign needs at least three dots to stay a cluster.
function admissible(mask) {
  var n = partCount(mask);
  if (n < 2 || n > 6) return false;
  var strokes = mask & 0x0F;
  var dots = (mask >> 4) & 0x0F;
  var sc = partCount(strokes);
  if (sc === 4 || sc === 3) return false;
  if (dots === 0 && (strokes === 0x05 || strokes === 0x0A)) return false;
  if (sc === 0 && partCount(dots) < 3) return false;
  return true;
}

// ---------------------------------------------------------------------------
// Cycle state. Frame one is cycle 0 at t=0, drawn synchronously. Taps and
// cycle rollovers only ever re-anchor the epoch; the whole field (initial
// masks, tones, mutation schedule) is a closed-form function of the seed.
// ---------------------------------------------------------------------------
var baseSeed = 72088;
var cycleIndex = 0;
var epochStart = 0; // performance.now() timestamp of cycle start
var forcedT = -1;
(function () {
  try {
    var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(location.search || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (e) { /* inert hook, QA only */ }
})();

// Build one cycle from a seed: 64 unique initial masks, one tone per
// cell, and a precomputed mutation schedule. The schedule is produced
// by simulating the travelling wave: cells are visited in diagonal
// sweep order (row + col), pass after pass, and each visit flips the
// first bit (in a seeded order) whose result stays admissible and is
// not already present anywhere in the field.
function cycleParams(seed) {
  var rng = mulberry32(seed);
  var i, j;

  // Initial field: 64 distinct admissible masks.
  var masks = [];
  var used = {};
  while (masks.length < CELLS) {
    var cand = 0;
    for (i = 0; i < 8; i++) if (rng() < 0.45) cand |= (1 << i);
    if (!admissible(cand) || used[cand]) continue;
    used[cand] = true;
    masks.push(cand);
  }

  // One tone per cell, seeded from the six-tone palette.
  var tones = [];
  for (i = 0; i < CELLS; i++) tones.push(Math.floor(rng() * COL.tones.length));

  // Visit order: diagonal wave with seeded jitter, repeated in passes.
  var order = [];
  for (i = 0; i < CELLS; i++) order.push(i);
  order.sort(function (a, b) {
    var da = (Math.floor(a / GRID) + (a % GRID)) + rng() * 0.9;
    var db = (Math.floor(b / GRID) + (b % GRID)) + rng() * 0.9;
    return da - db;
  });

  // Simulate the mutations against a working copy of the field.
  var work = masks.slice();
  var inField = {};
  for (i = 0; i < CELLS; i++) inField[work[i]] = true;
  var events = []; // {t, cell, bit}
  var passes = 3;
  var totalVisits = passes * CELLS;
  for (var v = 0; v < totalVisits; v++) {
    var cell = order[v % CELLS];
    var bits = [0, 1, 2, 3, 4, 5, 6, 7];
    for (i = bits.length - 1; i > 0; i--) {
      j = Math.floor(rng() * (i + 1));
      var tmp = bits[i]; bits[i] = bits[j]; bits[j] = tmp;
    }
    var flipped = -1;
    for (i = 0; i < 8; i++) {
      var next = work[cell] ^ (1 << bits[i]);
      if (next === work[cell]) continue;
      if (!admissible(next) || inField[next]) continue;
      flipped = bits[i];
      break;
    }
    if (flipped < 0) continue;
    delete inField[work[cell]];
    work[cell] = work[cell] ^ (1 << flipped);
    inField[work[cell]] = true;
    var et = (v + 1) / (totalVisits + 1) * (CYCLE - 2) + 1 + (rng() - 0.5) * 0.3;
    events.push({ t: et, cell: cell, bit: flipped });
  }
  events.sort(function (a, b) { return a.t - b.t; });

  // Per-cell event lists for the draw loop.
  var byCell = [];
  for (i = 0; i < CELLS; i++) byCell.push([]);
  for (i = 0; i < events.length; i++) byCell[events[i].cell].push(events[i]);

  return { masks: masks, tones: tones, byCell: byCell };
}

// State of one glyph part (bit) in one cell at time t: returns its
// alpha, 0..1. Parts are step functions of the precomputed schedule;
// the most recent flip eases over FADE seconds.
function partAlpha(p, cell, bit, t) {
  var evs = p.byCell[cell];
  var on = (p.masks[cell] & (1 << bit)) !== 0;
  var lastFlip = -1;
  for (var i = 0; i < evs.length; i++) {
    if (evs[i].t > t) break;
    if (evs[i].bit === bit) { on = !on; lastFlip = evs[i].t; }
  }
  if (lastFlip < 0) return on ? 1 : 0;
  var f = (t - lastFlip) / FADE;
  if (f >= 1) return on ? 1 : 0;
  return on ? f : 1 - f;
}

function drawGlyph(cx, cy, g, p, cell, t) {
  var half = g / 2;
  var th = g * 0.15;              // stroke thickness
  var dotR = g * 0.095;           // corner dot radius
  ctx.fillStyle = COL.tones[p.tones[cell]];
  ctx.strokeStyle = COL.tones[p.tones[cell]];
  var bit, a;

  // Strokes: thick lines with round caps along each box edge read as
  // rounded-rectangle bones.
  ctx.lineCap = 'round';
  ctx.lineWidth = th;
  var edges = [
    [-half, -half, half, -half],  // top
    [half, -half, half, half],    // right
    [half, half, -half, half],    // bottom
    [-half, half, -half, -half]   // left
  ];
  for (bit = 0; bit < 4; bit++) {
    a = partAlpha(p, cell, bit, t);
    if (a <= 0.01) continue;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.moveTo(cx + edges[bit][0], cy + edges[bit][1]);
    ctx.lineTo(cx + edges[bit][2], cy + edges[bit][3]);
    ctx.stroke();
    ctx.restore();
  }

  // Dots at the four corners.
  var corners = [
    [-half, -half], [half, -half], [half, half], [-half, half]
  ];
  for (bit = 4; bit < 8; bit++) {
    a = partAlpha(p, cell, bit, t);
    if (a <= 0.01) continue;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(cx + corners[bit - 4][0], cy + corners[bit - 4][1], dotR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function draw(t) {
  if (W === 0 || H === 0) return;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);

  var p = cycleParams(baseSeed + cycleIndex * 101);

  // Square field centered in the frame, even margins.
  var S = Math.min(W, H);
  var ox = (W - S) / 2, oy = (H - S) / 2;
  var margin = S * 0.055;
  var cellSize = (S - margin * 2) / GRID;
  var g = cellSize * 0.62;

  for (var r = 0; r < GRID; r++) {
    for (var c = 0; c < GRID; c++) {
      var cell = r * GRID + c;
      var cx = ox + margin + cellSize * (c + 0.5);
      var cy = oy + margin + cellSize * (r + 0.5);
      drawGlyph(cx, cy, g, p, cell, t);
    }
  }
}

// ---------------------------------------------------------------------------
// Sizing and main loop.
// ---------------------------------------------------------------------------
function resize() {
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = Math.round(vw);
  H = Math.round(vh);
  canvas.width = W;
  canvas.height = H;
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  // Before the loop starts, every draw is frame one at exactly t=0.
  draw(forcedT >= 0 ? forcedT : (loopStarted ? currentT() : 0));
}

var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
epochStart = startStamp;
function currentT() {
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp;
  var t = (now - epochStart) / 1000;
  if (t >= CYCLE) {
    var adv = Math.floor(t / CYCLE);
    cycleIndex += adv;
    epochStart += adv * CYCLE * 1000;
    t -= adv * CYCLE;
  }
  return t;
}

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (window.addEventListener) window.addEventListener('resize', resize);

// TAP reseeds: a fresh set of 64 glyphs.
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function () {
    cycleIndex += 1;
    epochStart = (typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp;
    draw(0);
  });
}

// Frame one: synchronous draw at cycle t=0 (never clock-derived).
resize();

var loopStarted = false;
if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    loopStarted = true;
    if (forcedT < 0) draw(currentT());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
