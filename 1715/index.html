<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stipple Rosette</title>
<style>
html, body { margin: 0; padding: 0; background: #F5EEE2; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F5EEE2';
var SEPIA = '#4A3226';
var BRICK = '#A23B2E';
var PLATE = '#4A3226';
var PLATE_LINE = 'rgba(162,59,46,0.55)';
var TITLE_INK = '#F5EEE2';
var HINT_INK = '#D08A7A';
var PERIOD = 60;
var FRAME_T = 0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1715);
/* ---- rosette geometry: 12 petals, hand-cut irregularity, seeded ---- */
var NPET = 12;
var petals = [];
var i, j;
for (i = 0; i < NPET; i++) {
  petals.push({
    jitter: (rng() - 0.5) * 0.10,          /* angular jitter, radians */
    len: 0.94 + rng() * 0.12,              /* length factor */
    wid: 0.88 + rng() * 0.24,              /* width factor */
    ink: i % 2 === 0 ? BRICK : SEPIA       /* stipple ink alternates, outline stays brick */
  });
}
/* ---- stipple fill per petal: density is the tone, denser toward the base ---- */
var DOT_R = 0.0016; /* dot radius, fraction of stage height */
for (i = 0; i < NPET; i++) {
  var dots = [];
  var u, v, wHalf, dens;
  for (u = 0.04; u <= 0.98; u += 0.028) {
    wHalf = Math.pow(Math.sin(Math.PI * u), 0.8) * 0.5;
    dens = 0.18 + 0.82 * (1 - u);          /* dense at base, sparse at tip */
    for (v = -wHalf; v <= wHalf; v += 0.045) {
      if (rng() < dens) dots.push([u, v + (rng() - 0.5) * 0.012]);
    }
  }
  petals[i].dots = dots;
}
/* ---- sepia star knot: five rotated dotted loops, fixed ---- */
var KNOT_LOOPS = 5;
var knotDots = [];
for (i = 0; i < KNOT_LOOPS; i++) {
  var rot = i * (Math.PI / KNOT_LOOPS) + (rng() - 0.5) * 0.08;
  var pts = [];
  var k;
  for (k = 0; k <= 10; k++) {
    var a = rot + k * TAU / 5;
    var rr = (k % 2 === 0) ? 1.0 : 0.42;
    pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
  }
  for (k = 0; k < pts.length - 1; k++) {
    var steps = 26;
    for (j = 0; j < steps; j++) {
      var s = j / steps;
      knotDots.push([
        pts[k][0] + (pts[k + 1][0] - pts[k][0]) * s,
        pts[k][1] + (pts[k + 1][1] - pts[k][1]) * s
      ]);
    }
  }
}
var phaseT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: centered square, keeps its shape on phones too; ground is the piece ground ---- */
function stageRect() {
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var sw = st.w, sh = st.h;
  var cx = st.x + sw / 2, cy = st.y + sh / 2;
  var t = phaseT;
  var rot = TAU * (t / PERIOD); /* ring turns once per 60 s; frame one t = 0, rotation 0 */
  var R0 = 0.085 * sh;          /* petal base radius (knot sits inside) */
  var L = 0.155 * sh;           /* petal length */
  var W = 0.052 * sh;           /* petal half-width scale */
  var KNOT_R = 0.062 * sh;      /* knot radius */
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, sw, sh);
  ctx.clip();
  var p, d, a, x, y, u, v, wHalf;
  /* ---- petal ring (rotates) ---- */
  for (p = 0; p < NPET; p++) {
    var pet = petals[p];
    var ang = rot + p * TAU / NPET + pet.jitter;
    var ca = Math.cos(ang), sa = Math.sin(ang);
    var len = L * pet.len, wid = W * pet.wid;
    /* outline: closed petal curve, base at R0, tip at R0 + len */
    var bx = cx + ca * R0, by = cy + sa * R0;
    var tx = cx + ca * (R0 + len), ty = cy + sa * (R0 + len);
    var mx = cx + ca * (R0 + len * 0.55), my = cy + sa * (R0 + len * 0.55);
    var px = -sa, py = ca;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(mx + px * wid, my + py * wid, tx, ty);
    ctx.quadraticCurveTo(mx - px * wid, my - py * wid, bx, by);
    ctx.closePath();
    ctx.strokeStyle = BRICK;
    ctx.lineWidth = Math.max(1, sh * 0.0016);
    ctx.stroke();
    /* stipple fill: density carries the shading, denser toward the base */
    ctx.fillStyle = pet.ink;
    for (d = 0; d < pet.dots.length; d++) {
      u = pet.dots[d][0]; v = pet.dots[d][1];
      wHalf = Math.pow(Math.sin(Math.PI * u), 0.8) * wid;
      var ax = R0 + u * len;
      var lx = ax, ly = v * wHalf * 0.9; /* 0.45 * wid max: stays inside the outline, whose max half-width is 0.5 * wid */
      x = cx + ca * lx - sa * ly;
      y = cy + sa * lx + ca * ly;
      var r = DOT_R * sh;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
  }
  /* ---- sepia star knot (fixed, never rotates) ---- */
  ctx.fillStyle = SEPIA;
  for (d = 0; d < knotDots.length; d++) {
    x = cx + knotDots[d][0] * KNOT_R;
    y = cy + knotDots[d][1] * KNOT_R;
    var kr = Math.max(0.9, sh * 0.0014);
    ctx.fillRect(x - kr, y - kr, kr * 2, kr * 2);
  }
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Stipple Rosette').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Stipple Rosette').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 22').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Stipple Rosette', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 22', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    petalCount: function () { return NPET; },
    knotDotCount: function () { return knotDots.length; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 0, ring rotation 0, knot fixed ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
