<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var TAU = Math.PI * 2;
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// ---------- palette (strict, clara-lagos block 3) ----------
var INK = "#1A1A1A";    // loose black ink
var PAPER = "#F5F0E6";  // notebook cream
var BLUE = "#3E6FA8";   // soft blue, the mother's apron only
var WOOD = "#8A6B4F";   // the table

// ---------- canvas / viewport ----------
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone() {
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0) return mn < 700;
  return H > W * 1.15;
}

function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  buildGrain();
  draw(currentPhase());
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
}
window.addEventListener("resize", resize);

// ---------- animation clock ----------
// Frame one is drawn synchronously at PHASE0: panels 1-2 drawn, panel 3
// begun, margin notes and caption in place, the waiting cycle at its start.
// All motion is anchored to PHASE0 + elapsed since load; performance.now
// measures elapsed only, the wall clock is never consulted.
var PHASE0 = 0;
var startStamp = null;

function currentPhase() {
  if (startStamp === null) return PHASE0;
  var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  return PHASE0 + (now - startStamp) / 1000;
}

// ---------- hand-line helpers ----------
// Every visible line is a precomputed wobbly polyline (seeded at load), so
// the hand never changes its mind between frames. Animation only reveals.
function ptsLine(r, x1, y1, x2, y2, seg, wob) {
  var pts = [];
  for (var i = 0; i <= seg; i++) {
    var t = i / seg;
    var px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t;
    if (i > 0 && i < seg) { px += (r() - 0.5) * 2 * wob; py += (r() - 0.5) * 2 * wob; }
    pts.push([px, py]);
  }
  return pts;
}
function ptsQuad(r, x1, y1, cx, cy, x2, y2, seg, wob) {
  var pts = [];
  for (var i = 0; i <= seg; i++) {
    var t = i / seg, u = 1 - t;
    var px = u * u * x1 + 2 * u * t * cx + t * t * x2;
    var py = u * u * y1 + 2 * u * t * cy + t * t * y2;
    if (i > 0 && i < seg) { px += (r() - 0.5) * 2 * wob; py += (r() - 0.5) * 2 * wob; }
    pts.push([px, py]);
  }
  return pts;
}
function ptsCircle(r, cx, cy, rad, wob) {
  var pts = [], n = 18;
  for (var i = 0; i <= n; i++) {
    var a = (i / n) * TAU;
    var rr = rad + (r() - 0.5) * 2 * wob;
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 1.04]);
  }
  return pts;
}
function ptsArc(r, cx, cy, rad, a0, a1, seg, wob) {
  var pts = [];
  for (var i = 0; i <= seg; i++) {
    var a = a0 + (a1 - a0) * (i / seg);
    var rr = rad + (r() - 0.5) * 2 * wob;
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  return pts;
}
function ptsRect(r, x, y, w, h, wob) {
  var pts = [];
  function side(x1, y1, x2, y2) {
    var s = ptsLine(r, x1, y1, x2, y2, 5, wob);
    for (var i = 0; i < s.length; i++) pts.push(s[i]);
  }
  side(x, y, x + w, y); side(x + w, y, x + w, y + h);
  side(x + w, y + h, x, y + h); side(x, y + h, x, y);
  return pts;
}
function pathOf(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
}
function strokePts(pts, frac, color, width, alpha) {
  if (frac <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  if (frac >= 1) {
    pathOf(pts);
  } else {
    // walk the polyline up to frac of its total length
    var total = 0, i, d;
    var cum = [0];
    for (i = 1; i < pts.length; i++) {
      d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      total += d; cum.push(total);
    }
    var target = total * frac;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i < pts.length; i++) {
      if (cum[i] <= target) { ctx.lineTo(pts[i][0], pts[i][1]); continue; }
      var t = (target - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
      ctx.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t,
                 pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t);
      break;
    }
  }
  ctx.stroke();
  ctx.restore();
}
function fillPath(pts, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  pathOf(pts);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function dot(x, y, r, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
  ctx.restore();
}
var HAND_FONT = '"Segoe Script","Bradley Hand","Comic Sans MS",cursive';
function handText(text, x, y, size, rot, align, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.font = size + "px " + HAND_FONT;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.globalAlpha = alpha == null ? 0.88 : alpha;
  ctx.fillStyle = INK;
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

  function Q(x1, y1, cx, cy, x2, y2, w) { P2.push(S(ptsQuad(rng, ox + x1, oy + y1, ox + cx, oy + cy, ox + x2, oy + y2, 8, 1.1), w)); }
  function C(cx, cy, r, w) { P2.push(S(ptsCircle(rng, ox + cx, oy + cy, r, 1.0), w)); }
  // Emi

  P2.push(S(ptsArc(rng, ox + 102, oy + 56, 14, Math.PI * 1.1, Math.PI * 1.6, 5, 1.0), 2.2)); // hair scribble
  P2.push(S(ptsArc(rng, ox + 102, oy + 56, 14, Math.PI * 1.55, Math.PI * 1.95, 5, 1.0), 2.2));

  L(92, 80, 70, 100, 2.4); L(112, 80, 132, 98, 2.4);     // arms reaching to the bundle

    Q(bx, by, bx + Math.cos(a) * len * 0.5 - px * wHalf, by + Math.sin(a) * len * 0.5 - py * wHalf, tx, ty, 2);

  C(38, 118, 10, 2.2);                                  // cat head
  P2.push(S(ptsLine(rng, ox + 31, oy + 111, ox + 33, oy + 100, 3, 0.8), 2.2));
  P2.push(S(ptsLine(rng, ox + 33, oy + 100, ox + 38, oy + 109, 3, 0.8), 2.2)); // the one ear

  L(168, 114, 156, 100, 2.2); L(156, 100, 216, 100, 2.2); L(216, 100, 228, 114, 2.2); // open lid
  // ground
  L(10, 150, 262, 150, 2.2);
})();
var P2_DOTS = [[98, 56], [107, 56], [35, 117], [42, 117]];

var P3_BASE = [];
(function () {

var P3_GROUND_FRAC = 0.55;

  { t0: 9.6, dur: 1.1, s: S(ptsLine(rng, PANELS[2].x + 78, PANELS[2].y + 84, PANELS[2].x + 54, PANELS[2].y + 106, 5, 1.1), 2.4) },

];

// ----- margin waiting-doodles: cup, cat, leaf, star -----
function doodleStrokes(kind, cx, cy) {
  var r = mulberry32(595300 + cx * 7 + cy);
  var out = [];
  function L(x1, y1, x2, y2) { out.push(S(ptsLine(r, cx + x1, cy + y1, cx + x2, cy + y2, 4, 0.9), 2.2)); }

  function C(ccx, ccy, rad) { out.push(S(ptsCircle(r, cx + ccx, cy + ccy, rad, 0.9), 2.2)); }
  if (kind === "cup") {
    L(-14, -6, 14, -6); L(14, -6, 11, 12); L(11, 12, -11, 12); L(-11, 12, -14, -6);
    out.push(S(ptsArc(r, cx + 16, cy + 3, 6, -1.2, 1.2, 6, 0.7), 2));

    }
    out.push(S(pts, 2.2));
  }
  return out;
}
var DOODLE_SLOTS = [ // notebook-local centers

// ---------- the wooden table (device space, rebuilt per resize) ----------
var GRAIN = [], KNOTS = [];
function buildGrain() {
  GRAIN = []; KNOTS = [];
  if (W <= 0 || H <= 0) return;
  var r = mulberry32(595900);
  for (var y = 14; y < H + 40; y += 30 + r() * 26) {
    var amp = 1.5 + r() * 2.6, per = 140 + r() * 160, ph = r() * TAU;
    var pts = [];
    for (var x = -10; x <= W + 10; x += 26) {
      pts.push([x, y + Math.sin(x / per * TAU + ph) * amp + (r() - 0.5) * 1.2]);
    }
    GRAIN.push({ pts: pts, a: 0.05 + r() * 0.07, w: 1 + r() * 1.6 });
  }
  for (var k = 0; k < 5; k++) {
    KNOTS.push({ x: r() * W, y: r() * H, rx: 9 + r() * 13, ry: 4.5 + r() * 5 });
  }
}

// ---------- pointer: tap the page, drag to tip ----------
var pDown = null;
function toLocal(cx, cy) {
  var rect = canvas.getBoundingClientRect();
  var dx = (cx - rect.left) - W / 2, dy = (cy - rect.top) - H / 2;
  var s = stageScale();
  var sx = dx / s + NBCX, sy2 = dy / s + NBCY;
  var th = BASE_ROT + tip * Math.PI / 180;
  var cos = Math.cos(-th), sin = Math.sin(-th);
  var lx = sx - NBCX, ly = sy2 - NBCY;
  return [lx * cos - ly * sin + NBW / 2, lx * sin + ly * cos + NBH / 2];
}
function stageScale() {
  if (isPhone()) return W / SW;
  return Math.min(W / SW, H / SH);
}
function onDown(e) {
  var p = toLocal(e.clientX, e.clientY);
  pDown = { x: e.clientX, y: e.clientY, lx: p[0], ly: p[1], moved: false };
}
function onMove(e) {
  if (!pDown) return;
  var dx = e.clientX - pDown.x, dy = e.clientY - pDown.y;
  if (Math.abs(dx) + Math.abs(dy) > 7) pDown.moved = true;
  if (pDown.moved) tipTarget = clamp(dx / 90, -1, 1) * 3.5;
}
function onUp(e) {
  if (!pDown) return;
  if (!pDown.moved) {
    var lx = pDown.lx, ly = pDown.ly;
    if (lx >= 0 && lx <= NBW && ly >= 0 && ly <= NBH) {
      var used = {};
      AUTO_DOODLES.forEach(function (d) { used[d.slot] = true; });
      tapDoodles.forEach(function (d) { used[d.slot] = true; });
      for (var i = 4; i < DOODLES.length; i++) {
        if (!used[i]) { tapDoodles.push({ slot: i, startPhase: currentPhase() }); break; }
      }
    }
  }
  pDown = null;
  tipTarget = 0;
  draw(currentPhase());
}
if (canvas.addEventListener) {
  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);
}

// ---------- draw ----------
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function strokeSet(set) {
  for (var i = 0; i < set.length; i++) strokePts(set[i].pts, 1, set[i].color, set[i].w, set[i].alpha);
}

function draw(phase) {
  if (W <= 0 || H <= 0) return;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // the table fills the frame, edge to edge
  ctx.fillStyle = WOOD;
  ctx.fillRect(0, 0, W, H);
  var gi;
  for (gi = 0; gi < GRAIN.length; gi++) {
    strokePts(GRAIN[gi].pts, 1, INK, GRAIN[gi].w, GRAIN[gi].a);
  }
  for (gi = 0; gi < KNOTS.length; gi++) {
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.ellipse(KNOTS[gi].x, KNOTS[gi].y, KNOTS[gi].rx, KNOTS[gi].ry, 0.3, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  // ease the tip toward its target (drag feel; frame one has tip = 0)
  tip += (tipTarget - tip) * 0.16;

  var s = stageScale();
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(s, s);
  ctx.translate(-NBCX, -NBCY);

  // soft shadow under the notebook
  ctx.save();
  ctx.translate(NBCX + 14, NBCY + 18);
  ctx.rotate(BASE_ROT);
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = INK;
  roundRectPath(-NBW / 2, -NBH / 2, NBW, NBH, 12);
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(NBCX + 7, NBCY + 9);
  ctx.rotate(BASE_ROT);
  ctx.globalAlpha = 0.14;
  ctx.fillStyle = INK;
  roundRectPath(-NBW / 2, -NBH / 2, NBW, NBH, 12);
  ctx.fill();
  ctx.restore();

  // the notebook itself
  ctx.save();
  ctx.translate(NBCX, NBCY);
  ctx.rotate(BASE_ROT + tip * Math.PI / 180);
  ctx.translate(-NBW / 2, -NBH / 2);

  ctx.fillStyle = PAPER;
  roundRectPath(0, 0, NBW, NBH, 10);
  ctx.fill();
  // center-fold shading of the open spread
  ctx.save();
  ctx.globalAlpha = 0.028; ctx.fillStyle = INK;
  ctx.fillRect(NBW / 2 - 18, 6, 18, NBH - 12);
  ctx.globalAlpha = 0.018;
  ctx.fillRect(NBW / 2, 6, 22, NBH - 12);
  ctx.restore();
  // page speckles
  for (gi = 0; gi < SPECKS.length; gi++) dot(SPECKS[gi][0], SPECKS[gi][1], SPECKS[gi][2], INK, 0.05);

  // spiral binding: holes, then the wire rings looping out to the left
  for (gi = 0; gi < SPIRAL_Y.length; gi++) {
    dot(27, SPIRAL_Y[gi], 4.6, INK, 0.32);
    dot(27, SPIRAL_Y[gi], 2.0, PAPER, 0.9);
  }
  ctx.save();
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.8;
  ctx.lineWidth = 3;
  for (gi = 0; gi < SPIRAL_Y.length; gi++) {
    ctx.beginPath();
    ctx.ellipse(11, SPIRAL_Y[gi], 17, 8.5, -0.18, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();

  // waiting-notes in the margins
  handText("sala de espera", 168, 56, 16.5, -0.03, "left");
  handText("plaza", 700, 56, 16.5, 0.025, "right");
  handText("café", 776, 306, 16.5, -Math.PI / 2 + 0.06, "center");
  handText("Emi", PANELS[1].x + 16, PANELS[1].y + 24, 12.5, -0.04, "left", 0.75);

  // the strip: borders
  strokeSet(BORDERS);
  // panel 1, complete: apron first (fill), then ink, then face dots
  fillPath(APRON.poly, BLUE, 0.92);
  strokeSet(APRON.straps);
  strokePts(APRON.poly.concat([APRON.poly[0]]), 1, INK, 2.2, 1);
  strokeSet(P1);
  P1_DOTS.forEach(function (d) { dot(PANELS[0].x + d[0], PANELS[0].y + d[1], 1.7, INK, 1); });
  strokePts(ptsArcCacheSmile1(), 1, INK, 2, 1);
  // panel 2, mostly drawn
  strokeSet(P2);
  strokePts(P2_SHOE.pts, P2_SHOE_FRAC, P2_SHOE.color, P2_SHOE.w, 1);
  P2_DOTS.forEach(function (d) { dot(PANELS[1].x + d[0], PANELS[1].y + d[1], 1.5, INK, 1); });
  handText("para guardar", PANELS[1].x + 164, PANELS[1].y + 156, 12.5, -0.02, "left", 0.8);
  // panel 3, begun: base strokes + the begun ground line
  strokeSet(P3_BASE);
  strokePts(P3_GROUND.pts, P3_GROUND_FRAC, P3_GROUND.color, P3_GROUND.w, 1);
  // panel 3, strokes arriving with the waiting cycle
  var cyc = phase % CYCLE;
  for (gi = 0; gi < P3_ANIM.length; gi++) {
    var a = P3_ANIM[gi];
    var f = clamp((cyc - a.t0) / a.dur, 0, 1);
    if (f > 0) strokePts(a.s.pts, f, a.s.color, a.s.w, 1);
  }
  // panel 4 stays blank. The strip never finishes.

  // her caption, under the strip
  handText("Dibujo mientras espero. Dibujo para atesorar.", 431, 478, 20, -0.006, "center", 0.9);

  // margin doodles: the waiting cycle grows the first four slots;
  // taps on the page start new ones in the remaining slots
  for (gi = 0; gi < AUTO_DOODLES.length; gi++) {
    drawDoodle(DOODLES[AUTO_DOODLES[gi].slot], cyc, AUTO_DOODLES[gi].t0);
  }
  for (gi = 0; gi < tapDoodles.length; gi++) {
    drawDoodle(DOODLES[tapDoodles[gi].slot], phase, tapDoodles[gi].startPhase);
  }

  ctx.restore(); // notebook
  ctx.restore(); // stage

  // hint, small on the table
  ctx.save();
  ctx.font = "12px sans-serif";
  ctx.textAlign = "right";
  ctx.textBaseline = "bottom";
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = PAPER;
  ctx.fillText("tap · drag", W - 14, H - 10);
  ctx.restore();
}
// mother's smile, precomputed once (kept out of the stroke list for clarity)
var _smile1 = null;
function ptsArcCacheSmile1() {
  if (!_smile1) {
    var r = mulberry32(595777);
    _smile1 = ptsArc(r, PANELS[0].x + 88, PANELS[0].y + 58, 5.5, Math.PI * 0.25, Math.PI * 0.75, 6, 0.6);
  }
  return _smile1;
}

// ---------- run ----------
resize();
startStamp = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
(function frame() {
  draw(currentPhase());
  if (typeof requestAnimationFrame !== "undefined") requestAnimationFrame(frame);
})();
</script>
</body>
</html>
