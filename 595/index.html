<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten Sines</title>
<style>
html, body { margin: 0; padding: 0; background: #EFEDE8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: ten tall white towers stand in a bare gallery, each holding one
   pure sine tone. The tones sit close enough that slow beating drifts
   through the room like weather, and the beating shows only as a faint
   shimmer in the air between towers. The viewer only watches. */
var TAU = Math.PI * 2;
var WALL = '#EFEDE8';
var CEIL_TOP = '#B0AEA9';
var CEIL_BOT = '#C2C0BB';
var FLOOR = '#CFCDC8';
var FLOOR_FAR = '#D8D6D1';
var TOWER_FRONT = '#F7F5F0';
var TOWER_SIDE = '#DBD8D1';
var TOWER_LINE = 'rgba(60,58,54,0.18)';
var SEAM = 'rgba(60,58,54,0.28)';
var CABLE = '#17161A';
var PLATE = '#101013';
var PLATE_LINE = 'rgba(237,237,232,0.30)';
var TITLE_INK = '#EDEDE8';
var HINT_INK = '#9AA3AD';
var FRAME_T = 60.0;        /* fixed phase: towers 4-6 shimmer brightest */
var EYE = 1.6;             /* viewer eye height, metres */
var CEIL_H = 4.5;          /* concrete ceiling height, metres */
var FAR_WALL = 24;         /* far wall distance, metres */
/* tower layout: x lateral, z depth (m), h height, w width, f pitch (Hz) */
var TOWERS = [
  { x: -1.3, z: 4.5,  h: 3.4, w: 0.62, d: 0.50, f: 220.00 },
  { x:  1.5, z: 4.8,  h: 3.1, w: 0.55, d: 0.46, f: 220.07 },
  { x: -2.9, z: 7.2,  h: 3.6, w: 0.70, d: 0.54, f: 220.13 },
  { x:  0.1, z: 7.0,  h: 2.9, w: 0.50, d: 0.44, f: 220.22 },
  { x:  3.1, z: 7.5,  h: 3.3, w: 0.60, d: 0.48, f: 220.28 },
  { x: -1.2, z: 10.2, h: 3.5, w: 0.66, d: 0.52, f: 220.37 },
  { x:  1.9, z: 10.5, h: 3.0, w: 0.52, d: 0.44, f: 220.45 },
  { x: -2.5, z: 13.8, h: 3.2, w: 0.58, d: 0.46, f: 220.54 },
  { x:  1.2, z: 13.5, h: 3.6, w: 0.68, d: 0.54, f: 220.62 },
  { x: -0.9, z: 17.5, h: 3.0, w: 0.60, d: 0.48, f: 220.71 }
];
/* shimmer zones: spatially neighbouring tower pairs */
var PAIRS = [[0,2],[0,3],[1,3],[1,4],[2,5],[3,5],[3,6],[4,6],[5,7],[5,8],[6,8],[7,9],[8,9]];
/* cable path: snakes through the tower bases, front-left to centre */
var CABLE_PATH = [0, 2, 5, 7, 9, 8, 6, 4, 1, 3];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1845);
var phaseT = FRAME_T;
/* ---- shimmer zones: beat period and phase per neighbouring pair ---- */
var SHIMMER = [];
(function () {
  var i, a, b, P;
  for (i = 0; i < PAIRS.length; i++) {
    a = TOWERS[PAIRS[i][0]];
    b = TOWERS[PAIRS[i][1]];
    P = 1 / Math.abs(a.f - b.f);
    SHIMMER.push({
      a: PAIRS[i][0], b: PAIRS[i][1], period: P,
      ph: rng() * TAU, ph2: rng() * TAU
    });
  }
})();
/* ---- cable sag: one seeded lateral offset per cable segment ---- */
var CABLE_SAG = [];
(function () {
  var i;
  for (i = 0; i < CABLE_PATH.length - 1; i++) {
    CABLE_SAG.push((rng() - 0.5) * 1.1);
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function sceneRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* perspective: focal length in px, horizon at eye level */
function focal(sc) {
  var aspect = clamp(sc.w / sc.h, 0.55, 1.0);
  return sc.h * 1.05 * aspect;
}
function horizonY(sc) { return sc.y + sc.h * 0.46; }
function proj(sc, x, y, z, F, hz) {
  /* phones narrow the formation laterally so all ten towers stay in frame */
  var xe = isPhone ? x * 0.75 : x;
  return {
    x: sc.x + sc.w / 2 + xe * F / z,
    y: hz - (y - EYE) * F / z
  };
}
function drawRoom(sc, F, hz) {
  var ceilY = hz - (CEIL_H - EYE) * F / FAR_WALL;
  var g = ctx.createLinearGradient(0, sc.y, 0, ceilY);
  g.addColorStop(0, CEIL_TOP);
  g.addColorStop(1, CEIL_BOT);
  ctx.fillStyle = g;
  ctx.fillRect(sc.x, sc.y, sc.w, Math.max(0, ceilY - sc.y));
  /* wall */
  ctx.fillStyle = WALL;
  ctx.fillRect(sc.x, ceilY, sc.w, hz - ceilY);
  /* floor: light at the far wall, deeper toward the viewer */
  var fg = ctx.createLinearGradient(0, hz, 0, sc.y + sc.h);
  fg.addColorStop(0, FLOOR_FAR);
  fg.addColorStop(1, FLOOR);
  ctx.fillStyle = fg;
  ctx.fillRect(sc.x, hz, sc.w, sc.y + sc.h - hz);
  /* seams: ceiling meets wall, wall meets floor */
  ctx.strokeStyle = SEAM;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sc.x, ceilY + 0.5);
  ctx.lineTo(sc.x + sc.w, ceilY + 0.5);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(60,58,54,0.16)';
  ctx.beginPath();
  ctx.moveTo(sc.x, hz + 0.5);
  ctx.lineTo(sc.x + sc.w, hz + 0.5);
  ctx.stroke();
}
function drawShadow(sc, tw, F, hz) {
  var p = proj(sc, tw.x, 0, tw.z, F, hz);
  var rx = tw.w * F / tw.z * 0.85;
  var ry = rx * 0.22;
  var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rx);
  g.addColorStop(0, 'rgba(40,38,34,0.10)');
  g.addColorStop(1, 'rgba(40,38,34,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(p.x - rx, p.y);
  ctx.ellipse(p.x, p.y, rx, ry, 0, 0, TAU);
  ctx.fill();
}
function drawTower(sc, tw, F, hz) {
  var hw = tw.w / 2;
  var fl = proj(sc, tw.x - hw, 0, tw.z, F, hz);
  var fr = proj(sc, tw.x + hw, 0, tw.z, F, hz);
  var tl = proj(sc, tw.x - hw, tw.h, tw.z, F, hz);
  var tr = proj(sc, tw.x + hw, tw.h, tw.z, F, hz);
  var cx = sc.x + sc.w / 2;
  var midX = (fl.x + fr.x) / 2;
  /* inner side face: the face toward the centre of view */
  var side = midX < cx ? 1 : -1;
  var bx = tw.x + side * hw;
  var bl = proj(sc, bx, 0, tw.z + tw.d, F, hz);
  var bt = proj(sc, bx, tw.h, tw.z + tw.d, F, hz);
  var fx = side > 0 ? fr : fl;
  var tx = side > 0 ? tr : tl;
  ctx.fillStyle = TOWER_SIDE;
  ctx.beginPath();
  ctx.moveTo(fx.x, fx.y);
  ctx.lineTo(bl.x, bl.y);
  ctx.lineTo(bt.x, bt.y);
  ctx.lineTo(tx.x, tx.y);
  ctx.closePath();
  ctx.fill();
  /* top faces are never visible: every tower is taller than eye height,
     so the viewer looks up at them; no top face is drawn. */
  /* front face */
  ctx.fillStyle = TOWER_FRONT;
  ctx.fillRect(fl.x, tl.y, fr.x - fl.x, fl.y - tl.y);
  ctx.strokeStyle = TOWER_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(fl.x + 0.5, tl.y + 0.5, fr.x - fl.x - 1, fl.y - tl.y - 1);
}
function shimmerAlpha(s, t) {
  var b = 0.5 + 0.5 * Math.cos(TAU * t / s.period + s.ph);
  return 0.03 + 0.13 * b;
}
function drawShimmer(sc, t, F, hz) {
  var i, s, A, B, mx, mz, drift, p, dist, rx, ry, a, g;
  for (i = 0; i < SHIMMER.length; i++) {
    s = SHIMMER[i];
    A = TOWERS[s.a];
    B = TOWERS[s.b];
    mx = (A.x + B.x) / 2;
    mz = (A.z + B.z) / 2;
    drift = 0.14 * Math.sin(TAU * t / 53 + s.ph2);
    p = proj(sc, mx + drift, 1.9, mz, F, hz);
    dist = Math.sqrt((A.x - B.x) * (A.x - B.x) + (A.z - B.z) * (A.z - B.z));
    rx = dist * F / mz * 0.42;
    ry = rx * 1.7;
    a = shimmerAlpha(s, t);
    /* gradient is created inside the transformed state, centred on the
       ellipse, so the veil sits exactly between the two towers */
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(rx / Math.max(rx, ry), ry / Math.max(rx, ry));
    g = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(rx, ry));
    g.addColorStop(0, 'rgba(226,214,196,' + a.toFixed(4) + ')');
    g.addColorStop(1, 'rgba(226,214,196,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(Math.max(rx, ry), 0);
    ctx.arc(0, 0, Math.max(rx, ry), 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}
function drawCable(sc, F, hz) {
  var i, a, b, p0, p1, mx, mz, sag, cx, cy, lw;
  ctx.strokeStyle = CABLE;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (i = 0; i < CABLE_PATH.length - 1; i++) {
    a = TOWERS[CABLE_PATH[i]];
    b = TOWERS[CABLE_PATH[i + 1]];
    p0 = proj(sc, a.x, 0, a.z, F, hz);
    p1 = proj(sc, b.x, 0, b.z, F, hz);
    mx = (a.x + b.x) / 2 + CABLE_SAG[i];
    mz = (a.z + b.z) / 2 + 0.4;
    cx = sc.x + sc.w / 2 + mx * F / mz;
    cy = hz - (0 - EYE) * F / mz;
    lw = clamp(15 / ((a.z + b.z) / 2), 1, 3.5);
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.quadraticCurveTo(cx, cy, p1.x, p1.y);
    ctx.stroke();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Ten Sines').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Ten Sines').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 30').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Ten Sines', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 30', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = sceneRect();
  var t = phaseT;
  var F = focal(sc);
  var hz = horizonY(sc);
  ctx.fillStyle = WALL;
  ctx.fillRect(0, 0, VW, VH);
  drawRoom(sc, F, hz);
  drawShimmer(sc, t, F, hz);
  drawCable(sc, F, hz);
  var order = TOWERS.slice().sort(function (a, b) { return b.z - a.z; });
  var i;
  for (i = 0; i < order.length; i++) drawShadow(sc, order[i], F, hz);
  for (i = 0; i < order.length; i++) drawTower(sc, order[i], F, hz);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    shimmerAt: function (t) {
      var out = [], i;
      for (i = 0; i < SHIMMER.length; i++) {
        out.push([SHIMMER[i].a, SHIMMER[i].b, shimmerAlpha(SHIMMER[i], t)]);
      }
      return out;
    },
    towerCount: TOWERS.length
  };
}
/* ---- frame one: fixed phase t = 60.0 s, towers 4-6 shimmer brightest ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
