<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№874 The Slow Release</title>
<style>
  html, body { margin: 0; padding: 0; background: #141210; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №874 The Slow Release, SOA4 / PP1274, study #264 sheldon-omar-abba.
  // The driver, as a felt phenomenon: a feed where each frame
  // arrives with two dates, shot in 2019 and released in 2025.
  // The images age in the dark and surface like letters. The
  // delay is the medium. Nothing here can be skipped ahead to;
  // the release cadence is measured in the fiction of years,
  // compressed to minutes, and each frame carries its own
  // memory-color while the date pair sits in quiet white beneath.
  // Watch-only; skipping ahead would collapse the delay.
  // Visual-only: no WebAudio, no autoplay audio, per the Franke rule.
  var GROUND = '#141210'; // page ground, dark archive room

  // Fixed-phase first frame: FIRST_T = 3 s into a 60 s cycle.
  // Five frames, 12 s each. Each frame crossfades in over 3 s,
  // holds, then yields to the next. At FIRST_T the first frame
  // is fully in. The crossfade is the slowest motion in the
  // piece, about 0.08 Hz, far below the 14 Hz safety limit by
  // construction. All motion is a function of cycle phase, so
  // the frame at FIRST_T + 60 equals the frame at FIRST_T.
  var FIRST_T = 3;
  var CYCLE = 60;
  var SLOT = 12;
  var FADE = 3;
  var SEED = 874;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function ellipse(x, y, rx, ry) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  }

  // ---- The archive queue -------------------------------------------
  // Five frames, oldest first. Every frame states both dates
  // openly: shot in 2019, released in 2025. Each carries its own
  // memory-color. Older frames carry more visible dust: the
  // earliest shot has the most, the latest the least.
  var FRAMES = [
    { shot: '2019 · 02', rel: '2025 · 01', tone: [198, 152, 92],  dust: 110, scene: 0, name: 'The Window' },
    { shot: '2019 · 05', rel: '2025 · 04', tone: [94, 150, 148], dust: 88,  scene: 1, name: 'The Street' },
    { shot: '2019 · 07', rel: '2025 · 06', tone: [168, 122, 118], dust: 70,  scene: 2, name: 'The Garden' },
    { shot: '2019 · 09', rel: '2025 · 09', tone: [118, 132, 150], dust: 50,  scene: 3, name: 'The Sea' },
    { shot: '2019 · 12', rel: '2025 · 12', tone: [188, 138, 96],  dust: 32,  scene: 4, name: 'The Table' }
  ];

  // ---- Fixed dust tables, one per frame -----------------------------
  var dustRng = mulberry32(SEED * 41 + 11);
  var DUST = [];
  var di, dj;
  for (di = 0; di < FRAMES.length; di++) {
    var arr = [];
    for (dj = 0; dj < FRAMES[di].dust; dj++) {
      arr.push({
        x: dustRng(), y: dustRng(),
        r: 0.0012 + dustRng() * 0.0032,
        a: 0.05 + dustRng() * 0.22,
        warm: dustRng() > 0.5
      });
    }
    // A few long scratches on the older frames only.
    var scr = [];
    var nScr = di < 2 ? 3 : (di < 4 ? 2 : 1);
    for (dj = 0; dj < nScr; dj++) {
      scr.push({
        x: dustRng(), y: dustRng(),
        len: 0.08 + dustRng() * 0.22,
        ang: (dustRng() - 0.5) * 0.9,
        a: 0.05 + dustRng() * 0.08
      });
    }
    DUST.push({ specks: arr, scratches: scr });
  }
  // ---- Fixed garden flowers, sea glints, street windows ------------
  var flRng = mulberry32(SEED * 13 + 5);
  var FLOWERS = [];
  for (dj = 0; dj < 26; dj++) {
    FLOWERS.push({
      x: flRng(), y: 0.55 + flRng() * 0.38,
      r: 0.008 + flRng() * 0.014,
      c: [[214, 120, 130], [232, 196, 120], [238, 232, 220], [190, 90, 110]][Math.floor(flRng() * 4)]
    });
  }
  var GLINTS = [];
  for (dj = 0; dj < 18; dj++) {
    GLINTS.push({ x: flRng(), y: 0.55 + flRng() * 0.4, len: 0.03 + flRng() * 0.09 });
  }
  // Windows sit on the two building faces only, never in the sky:
  // left block x 0.04-0.42, right block x 0.58-0.92, y 0.54-0.82.
  var WINDOWS = [];
  for (dj = 0; dj < 14; dj++) {
    var left = dj % 2 === 0;
    WINDOWS.push({
      x: left ? 0.05 + flRng() * 0.33 : 0.59 + flRng() * 0.31,
      y: 0.54 + flRng() * 0.26,
      w: 0.03 + flRng() * 0.03, h: 0.05 + flRng() * 0.06,
      lit: flRng() > 0.45
    });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsPair = Math.round(clamp(W * 0.019, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    // Field-like composition: full-bleed on phones, square on desktop.
    if (isPhone) {
      W = vw; H = vh;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      W = side; H = side;
    }
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.style.left = ((vw - W) / 2) + 'px';
    canvas.style.top = ((vh - H) / 2) + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Cycle state ---------------------------------------------------
  function cycleAt(t) {
    var p = (((t % CYCLE) + CYCLE) % CYCLE);
    var slot = Math.floor(p / SLOT);
    var u = (p - slot * SLOT) / SLOT; // 0..1 inside the slot
    var fade = smooth((p - slot * SLOT) / FADE); // 0..1 over the first 3 s
    return { p: p, slot: slot, prev: (slot + FRAMES.length - 1) % FRAMES.length, fade: fade, u: u };
  }

  // ---- The five remembered scenes, drawn inside the print -----------
  // u is slot progress, used only for slow drift well under 1 Hz.
  function drawScene(i, x, y, w, h, u) {
    var m = Math.min(w, h);
    var g, k;
    if (i === 0) {
      // The Window: sepia room, a bright window, a chair in profile.
      g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, rgb([214, 178, 128]));
      g.addColorStop(1, rgb([150, 108, 66]));
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
      var drift = Math.sin(u * Math.PI * 2) * w * 0.008;
      ctx.fillStyle = rgb([244, 230, 196]);
      ctx.fillRect(x + w * 0.30 + drift, y + h * 0.12, w * 0.40, h * 0.58);
      ctx.fillStyle = rgb([176, 196, 210]);
      ctx.fillRect(x + w * 0.34 + drift, y + h * 0.16, w * 0.32, h * 0.50);
      ctx.strokeStyle = rgba([90, 62, 34], a4(0.8));
      ctx.lineWidth = Math.max(1.5, m * 0.012);
      ctx.beginPath();
      ctx.moveTo(x + w * 0.50 + drift, y + h * 0.16);
      ctx.lineTo(x + w * 0.50 + drift, y + h * 0.66);
      ctx.moveTo(x + w * 0.34 + drift, y + h * 0.41);
      ctx.lineTo(x + w * 0.66 + drift, y + h * 0.41);
      ctx.stroke();
      ctx.fillStyle = rgb([96, 64, 36]);
      ctx.fillRect(x + w * 0.28 + drift, y + h * 0.70, w * 0.44, h * 0.03);
      // Chair in profile, facing the light: back rises above the
      // seat, seat spans to the right, two legs reach the floor.
      ctx.fillStyle = rgb([70, 46, 26]);
      ctx.fillRect(x + w * 0.72, y + h * 0.56, w * 0.025, h * 0.40);
      ctx.fillRect(x + w * 0.72, y + h * 0.72, w * 0.17, h * 0.025);
      ctx.fillRect(x + w * 0.74, y + h * 0.74, w * 0.02, h * 0.20);
      ctx.fillRect(x + w * 0.85, y + h * 0.74, w * 0.02, h * 0.20);
    } else if (i === 1) {
      // The Street: teal dusk, lit windows, one lamp, one walker.
      g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, rgb([52, 92, 96]));
      g.addColorStop(0.62, rgb([96, 118, 110]));
      g.addColorStop(1, rgb([198, 150, 92]));
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = rgb([38, 52, 54]);
      ctx.fillRect(x, y + h * 0.52, w * 0.46, h * 0.48);
      ctx.fillRect(x + w * 0.54, y + h * 0.44, w * 0.46, h * 0.56);
      for (k = 0; k < WINDOWS.length; k++) {
        ctx.fillStyle = WINDOWS[k].lit ? rgb([240, 200, 110]) : rgb([26, 38, 40]);
        ctx.fillRect(x + WINDOWS[k].x * w, y + WINDOWS[k].y * h,
          WINDOWS[k].w * w, WINDOWS[k].h * h);
      }
      ctx.fillStyle = rgb([30, 34, 34]);
      ctx.fillRect(x, y + h * 0.86, w, h * 0.14);
      // Lamp glow, breathing slowly.
      var glowA = 0.5 + 0.18 * Math.sin(u * Math.PI * 2);
      var lg = ctx.createRadialGradient(x + w * 0.78, y + h * 0.42, 0,
        x + w * 0.78, y + h * 0.42, w * 0.22);
      lg.addColorStop(0, rgba([244, 208, 120], a4(glowA)));
      lg.addColorStop(1, rgba([244, 208, 120], 0));
      ctx.fillStyle = lg;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = rgb([24, 28, 28]);
      ctx.fillRect(x + w * 0.775, y + h * 0.42, w * 0.01, h * 0.44);
      circle(x + w * 0.78, y + h * 0.41, m * 0.02);
      ctx.fillStyle = rgb([244, 208, 120]);
      ctx.fill();
      // Walker, mid-step, small against the buildings.
      var wx = x + w * (0.30 + 0.04 * Math.sin(u * Math.PI));
      ctx.fillStyle = rgb([22, 24, 24]);
      circle(wx, y + h * 0.76, m * 0.028);
      ctx.fill();
      ctx.fillRect(wx - w * 0.012, y + h * 0.78, w * 0.024, h * 0.08);
      ctx.strokeStyle = rgb([22, 24, 24]);
      ctx.lineWidth = Math.max(1.5, m * 0.012);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(wx, y + h * 0.86);
      ctx.lineTo(wx - w * 0.02, y + h * 0.96);
      ctx.moveTo(wx, y + h * 0.86);
      ctx.lineTo(wx + w * 0.02, y + h * 0.95);
      ctx.stroke();
    } else if (i === 2) {
      // The Garden: rose hedge bands, a path, flowers, one tree.
      g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, rgb([196, 178, 150]));
      g.addColorStop(0.5, rgb([128, 138, 96]));
      g.addColorStop(1, rgb([74, 92, 62]));
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = rgb([110, 126, 84]);
      ctx.fillRect(x, y + h * 0.52, w, h * 0.48);
      ctx.fillStyle = rgb([196, 172, 128]);
      ctx.beginPath();
      ctx.moveTo(x + w * 0.44, y + h);
      ctx.lineTo(x + w * 0.48, y + h * 0.55);
      ctx.lineTo(x + w * 0.56, y + h * 0.55);
      ctx.lineTo(x + w * 0.62, y + h);
      ctx.closePath();
      ctx.fill();
      // Tree, swaying almost imperceptibly.
      var sway = Math.sin(u * Math.PI * 2) * w * 0.006;
      ctx.fillStyle = rgb([58, 66, 40]);
      ctx.fillRect(x + w * 0.16 + sway, y + h * 0.30, w * 0.02, h * 0.30);
      ctx.fillStyle = rgb([84, 104, 62]);
      circle(x + w * 0.17 + sway, y + h * 0.26, m * 0.11);
      ctx.fill();
      circle(x + w * 0.12 + sway, y + h * 0.34, m * 0.07);
      ctx.fill();
      circle(x + w * 0.22 + sway, y + h * 0.34, m * 0.07);
      ctx.fill();
      for (k = 0; k < FLOWERS.length; k++) {
        ctx.fillStyle = rgb(FLOWERS[k].c);
        circle(x + FLOWERS[k].x * w, y + FLOWERS[k].y * h, FLOWERS[k].r * m);
        ctx.fill();
      }
    } else if (i === 3) {
      // The Sea: blue grey sky, low sun, a boat, glints on the water.
      g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, rgb([150, 164, 178]));
      g.addColorStop(0.48, rgb([190, 186, 170]));
      g.addColorStop(0.52, rgb([110, 128, 142]));
      g.addColorStop(1, rgb([62, 76, 90]));
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = rgb([238, 214, 160]);
      circle(x + w * 0.62, y + h * 0.44, m * 0.055);
      ctx.fill();
      var sg = ctx.createRadialGradient(x + w * 0.62, y + h * 0.44, 0,
        x + w * 0.62, y + h * 0.44, w * 0.3);
      sg.addColorStop(0, rgba([238, 214, 160], a4(0.45)));
      sg.addColorStop(1, rgba([238, 214, 160], 0));
      ctx.fillStyle = sg;
      ctx.fillRect(x, y, w, h);
      // Boat, rocking slowly.
      var bx = x + w * 0.30;
      var by = y + h * (0.56 + 0.008 * Math.sin(u * Math.PI * 2));
      ctx.fillStyle = rgb([40, 44, 48]);
      ctx.beginPath();
      ctx.moveTo(bx - w * 0.07, by);
      ctx.lineTo(bx + w * 0.07, by);
      ctx.lineTo(bx + w * 0.04, by + h * 0.05);
      ctx.lineTo(bx - w * 0.04, by + h * 0.05);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = rgb([40, 44, 48]);
      ctx.lineWidth = Math.max(1.5, m * 0.008);
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx, by - h * 0.10);
      ctx.stroke();
      ctx.fillStyle = rgb([226, 220, 206]);
      ctx.beginPath();
      ctx.moveTo(bx, by - h * 0.10);
      ctx.lineTo(bx + w * 0.05, by - h * 0.02);
      ctx.lineTo(bx, by - h * 0.02);
      ctx.closePath();
      ctx.fill();
      // Glints, drifting with the water.
      ctx.strokeStyle = rgba([238, 220, 180], a4(0.55));
      ctx.lineWidth = Math.max(1, m * 0.006);
      for (k = 0; k < GLINTS.length; k++) {
        var gx = x + (GLINTS[k].x + 0.02 * Math.sin(u * Math.PI * 2 + k)) * w;
        ctx.beginPath();
        ctx.moveTo(gx - GLINTS[k].len * w / 2, y + GLINTS[k].y * h);
        ctx.lineTo(gx + GLINTS[k].len * w / 2, y + GLINTS[k].y * h);
        ctx.stroke();
      }
    } else {
      // The Table: warm interior, letters on a table, a cup, a shaft of light.
      g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, rgb([168, 124, 84]));
      g.addColorStop(1, rgb([104, 70, 44]));
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
      var lg2 = ctx.createLinearGradient(x + w * 0.1, y, x + w * 0.55, y);
      lg2.addColorStop(0, rgba([244, 226, 180], a4(0.35)));
      lg2.addColorStop(1, rgba([244, 226, 180], 0));
      ctx.fillStyle = lg2;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = rgb([132, 92, 56]);
      ctx.fillRect(x, y + h * 0.68, w, h * 0.32);
      // Letters, fanned like a small hand of mail.
      var lx = x + w * 0.30, ly = y + h * 0.60;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(-0.10 + 0.01 * Math.sin(u * Math.PI * 2));
      ctx.fillStyle = rgb([238, 230, 214]);
      ctx.fillRect(-w * 0.14, -h * 0.08, w * 0.28, h * 0.16);
      ctx.strokeStyle = rgba([90, 70, 50], a4(0.7));
      ctx.lineWidth = Math.max(1, m * 0.006);
      ctx.beginPath();
      ctx.moveTo(-w * 0.10, -h * 0.03);
      ctx.lineTo(w * 0.08, -h * 0.03);
      ctx.moveTo(-w * 0.10, h * 0.01);
      ctx.lineTo(w * 0.05, h * 0.01);
      ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.translate(lx + w * 0.10, ly + h * 0.04);
      ctx.rotate(0.12);
      ctx.fillStyle = rgb([226, 214, 192]);
      ctx.fillRect(-w * 0.13, -h * 0.07, w * 0.26, h * 0.14);
      ctx.restore();
      // Cup, steam curling slowly.
      ctx.fillStyle = rgb([52, 60, 64]);
      ctx.fillRect(x + w * 0.70, y + h * 0.52, w * 0.09, h * 0.14);
      ellipse(x + w * 0.745, y + h * 0.52, w * 0.045, h * 0.012);
      ctx.fill();
      ctx.strokeStyle = rgba([238, 230, 214], a4(0.35 + 0.15 * Math.sin(u * Math.PI * 2)));
      ctx.lineWidth = Math.max(1, m * 0.006);
      ctx.beginPath();
      ctx.moveTo(x + w * 0.745, y + h * 0.48);
      ctx.bezierCurveTo(x + w * 0.72, y + h * 0.42, x + w * 0.77, y + h * 0.38, x + w * 0.745, y + h * 0.32);
      ctx.stroke();
    }
  }

  // ---- Dust and age: specks, scratches, memory wash, vignette ------
  function drawAge(i, x, y, w, h) {
    var m = Math.min(w, h);
    var d = DUST[i], k, s;
    for (k = 0; k < d.specks.length; k++) {
      s = d.specks[k];
      ctx.fillStyle = s.warm ? rgba([240, 228, 200], a4(s.a)) : rgba([220, 222, 226], a4(s.a));
      circle(x + s.x * w, y + s.y * h, s.r * m);
      ctx.fill();
    }
    ctx.strokeStyle = rgba([232, 228, 218], a4(0.08));
    ctx.lineWidth = Math.max(1, m * 0.003);
    for (k = 0; k < d.scratches.length; k++) {
      s = d.scratches[k];
      ctx.save();
      ctx.translate(x + s.x * w, y + s.y * h);
      ctx.rotate(s.ang);
      ctx.globalAlpha = a4(s.a);
      ctx.beginPath();
      ctx.moveTo(-s.len * w / 2, 0);
      ctx.lineTo(s.len * w / 2, 0);
      ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    // Memory wash: the frame's own color, thin over the image.
    ctx.fillStyle = rgba(FRAMES[i].tone, a4(0.10));
    ctx.fillRect(x, y, w, h);
    // Vignette: the dark the image aged in, closing at the edges.
    var vg = ctx.createRadialGradient(x + w / 2, y + h / 2, Math.min(w, h) * 0.35,
      x + w / 2, y + h / 2, Math.max(w, h) * 0.75);
    vg.addColorStop(0, rgba([0, 0, 0], 0));
    vg.addColorStop(1, rgba([10, 8, 6], a4(0.42)));
    ctx.fillStyle = vg;
    ctx.fillRect(x, y, w, h);
  }

  // ---- One frame of the feed: print, dates, caption, hint -----------
  function drawFrame(i, alpha, u) {
    // Print: white border, image inside, the print plus its date
    // pair centered vertically as one block on the dark ground.
    var pw = Math.min(W * 0.88, H * 0.66);
    var ph = pw * 0.72;
    var px = (W - pw) / 2;
    var blockH = ph + L.fsPair * 2.1 + L.fsPair + 6 + H * 0.06;
    var py = (H - blockH) / 2;
    var border = Math.max(6, Math.min(W, H) * 0.014);
    var ix = px + border, iy = py + border;
    var iw = pw - border * 2, ih = ph - border * 2;

    ctx.save();
    ctx.globalAlpha = a4(alpha);
    ctx.fillStyle = rgb([238, 234, 226]);
    ctx.fillRect(px, py, pw, ph);
    // Soft shadow under the print, so it sits on the dark ground.
    ctx.fillStyle = rgba([0, 0, 0], a4(0.35));
    ctx.fillRect(px + 4, py + ph + 2, pw, 6);
    drawScene(i, ix, iy, iw, ih, u);
    drawAge(i, ix, iy, iw, ih);
    ctx.restore();

    // Date pair: small fixed element beneath the print, in quiet white.
    // It crossfades with its frame, so the dates never claim the wrong image.
    var dx = px;
    var dy = py + ph + L.fsPair * 2.1;
    ctx.save();
    ctx.globalAlpha = a4(alpha);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba([232, 228, 220], a4(0.85));
    ctx.font = '600 ' + L.fsPair + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('SHOT ' + FRAMES[i].shot, dx, dy);
    ctx.fillStyle = rgba([232, 228, 220], a4(0.55));
    ctx.font = L.fsPair + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('RELEASED ' + FRAMES[i].rel, dx, dy + L.fsPair + 6);
    ctx.restore();

    // Frame name, right-aligned with the print, same quiet register.
    ctx.save();
    ctx.globalAlpha = a4(alpha * 0.6);
    ctx.textAlign = 'right';
    ctx.fillStyle = rgba([232, 228, 220], a4(0.8));
    ctx.font = 'italic ' + L.fsPair + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(FRAMES[i].name, px + pw, dy);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  // ---- Caption plate and hint --------------------------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba([238, 234, 226], a4(0.9));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№874 · The Slow Release', W * 0.04, H * 0.045);
    ctx.fillStyle = rgba([238, 234, 226], a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 06 · 03', W * 0.04, H * 0.045 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba([238, 234, 226], a4(0.75));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the slow release.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var c = cycleAt(t);
    // Previous frame holds underneath; the incoming frame
    // crossfades over it for the first 3 s of each 12 s slot.
    drawFrame(c.prev, 1 - c.fade, c.u);
    if (c.fade > 0) { drawFrame(c.slot, c.fade, c.u); }
    drawText();
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece874 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece874 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      slot: SLOT,
      fade: FADE,
      frames: FRAMES,
      cycleAt: function (t) { return cycleAt(t); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 60 s cycle, closed-form. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
