<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Chosen Watcher</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05070C; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1114 "The Chosen Watcher" — Markus Kison study block MK3.
   A dark field of 1,200 seeded particles in three parallax depths. On a
   25 s cycle a soft spotlight beam sweeps the field, locks onto ONE
   particle (thin gold ring #FFD166), and the field's parallax origin
   eases over 3 s to the chosen one — being watched changes the geometry
   of everything else. Hold 8 s, release 3 s, rest, repeat. Fully
   autonomous; the pointer only nudges the parallax a little.
   Everything is a closed-form function of piece time t; frame one is a
   fixed phase inside the first hold, so the thumb is reproducible. */

var TAU = Math.PI * 2;

/* ---------- seeded rng (determinism: no Math.random, no wall clock) ------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var SEED = 1114466;
(function () {
  var m = /[?&]seed=(\d+)/.exec((typeof location !== 'undefined' && location.search) || '');
  if (m) SEED = parseInt(m[1], 10) >>> 0;
})();
var rand = mulberry32(SEED);

/* ---------- palette ------------------------------------------------------ */
var COL = {
  ground: '#05070C',
  field: '#080A11',
  gold: [255, 209, 102],        // #FFD166
  beam: [255, 214, 140],
  coreHot: [255, 243, 214],
  layerCol: [
    [168, 194, 226],            // far
    [201, 221, 246],            // mid
    [236, 244, 255]             // near
  ],
  layerAlpha: [0.34, 0.55, 0.85],
  layerSize: [1.5, 2.2, 3.0],
  layerPar: [0.014, 0.032, 0.060]   // parallax factor per depth layer
};
function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

/* ---------- particles ---------------------------------------------------- */
var LOOP = 25;                  // seconds per watch cycle
var N = 1200;
var COUNTS = [620, 380, 200];   // far / mid / near
var particles = [];
for (var li = 0; li < 3; li++) {
  for (var i = 0; i < COUNTS[li]; i++) {
    particles.push({
      layer: li,
      bx: 0.03 + rand() * 0.94,
      by: 0.03 + rand() * 0.94,
      ax: 0.008 + rand() * 0.013,
      ay: 0.008 + rand() * 0.013,
      fx: 1 + Math.floor(rand() * 2),       // whole cycles per loop: drift closes
      fy: 1 + Math.floor(rand() * 2),
      px: rand() * TAU,
      py: rand() * TAU,
      tw: 1 + Math.floor(rand() * 3),       // twinkle cycles per loop
      tp: rand() * TAU
    });
  }
}
/* the chosen one is always drawn from the mid/near layers, so the ring reads */
var candidates = [];
for (var ci = 0; ci < N; ci++) if (particles[ci].layer >= 1) candidates.push(ci);
function chosenIndex(cycle) {
  var h = mulberry32((SEED ^ Math.imul(cycle + 1, 0x9E3779B9)) >>> 0)();
  return candidates[Math.floor(h * candidates.length) % candidates.length];
}
/* unshifted position (base + drift) in stage-normalised coords */
function basePos(p, t) {
  return [p.bx + p.ax * Math.sin(TAU * p.fx * t / LOOP + p.px),
          p.by + p.ay * Math.sin(TAU * p.fy * t / LOOP + p.py)];
}

/* ---------- cycle state machine (closed form in t) ----------------------- */
/* sweep 0-6 · lock 6-9 (origin eases over 3 s) · hold 9-17 · release 17-20 · rest 20-25 */
function smoother(u) { return u * u * u * (u * (u * 6 - 15) + 10); }
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

var CENTER = [0.5, 0.5];
function cycleState(t) {
  var cycle = Math.floor(t / LOOP);
  var tc = t - cycle * LOOP;
  var chIdx = chosenIndex(cycle);
  var chBase = basePos(particles[chIdx], t);
  var origin = [CENTER[0], CENTER[1]];
  var ring = 0, beamA = 0, stage = 'rest';
  if (tc < 6) {
    stage = 'sweep';
    beamA = clamp01(tc / 1.0);
  } else if (tc < 9) {
    stage = 'lock';
    var u = smoother((tc - 6) / 3);
    origin = [CENTER[0] + (chBase[0] - CENTER[0]) * u,
              CENTER[1] + (chBase[1] - CENTER[1]) * u];
    ring = u; beamA = 1;
  } else if (tc < 17) {
    stage = 'hold';
    origin = chBase;
    ring = 1; beamA = 1;
  } else if (tc < 20) {
    stage = 'release';
    var u2 = smoother((tc - 17) / 3);
    var atRelease = basePos(particles[chIdx], cycle * LOOP + 17);
    origin = [atRelease[0] + (CENTER[0] - atRelease[0]) * u2,
              atRelease[1] + (CENTER[1] - atRelease[1]) * u2];
    ring = 1 - u2; beamA = 1 - u2;
  }
  return { cycle: cycle, tc: tc, stage: stage, chIdx: chIdx, chBase: chBase,
           origin: origin, ring: ring, beamA: beamA };
}

/* drawn position of particle p given the effective parallax origin */
function drawnPos(p, t, oEff) {
  var b = basePos(p, t), f = COL.layerPar[p.layer];
  return [b[0] + (oEff[0] - CENTER[0]) * f,
          b[1] + (oEff[1] - CENTER[1]) * f];
}

/* ---------- pointer nudge (recorded events; closed-form weight) ---------- */
var lastPointer = null;         // {x, y, t} in stage-normalised coords + piece time
function nudgeAt(t) {
  if (!lastPointer) return [0, 0];
  var age = t - lastPointer.t;
  if (age < 0 || age > 2.2) return [0, 0];
  var w = 0.30 * (1 - age / 2.2);
  return [(lastPointer.x - CENTER[0]) * w, (lastPointer.y - CENTER[1]) * w];
}

/* ---------- canvas / viewport -------------------------------------------- */
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var vw = 300, vh = 300, dpr = 1, phone = false;
var T = 13.0;                   // piece clock; frame one = fixed phase, mid-hold

function fit() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  vw = vv ? vv.width : (window.innerWidth || 300);
  vh = vv ? vv.height : (window.innerHeight || 300);
  dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
  var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : vw;
  var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : vh;
  phone = (Math.min(sw, sh) < 700) || (vh > vw * 1.15);
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(); });
  }
  window.addEventListener('resize', function () { fit(); draw(); });
}
fit();

/* stage: square on desktop, full-bleed field on phones */
function stage() {
  if (phone) return { w: vw, h: vh, ox: 0, oy: 0 };
  var S = Math.min(vw, vh);
  return { w: S, h: S, ox: (vw - S) / 2, oy: (vh - S) / 2 };
}
function toScreen(st, x, y) { return [st.ox + x * st.w, st.oy + y * st.h]; }
function toNorm(st, sx, sy) {
  return [Math.max(0, Math.min(1, (sx - st.ox) / st.w)),
          Math.max(0, Math.min(1, (sy - st.oy) / st.h))];
}

/* ---------- draw ---------------------------------------------------------- */
var APEX = [0.16, -0.02];       // spotlight origin, just above the top edge
var WEDGES = [                  // stacked translucent wedges, no gradients
  [0.170, 0.028],
  [0.115, 0.050],
  [0.068, 0.082],
  [0.034, 0.120]
];
function wedge(apexPx, ang, half, len, alpha) {
  var c = Math.cos(ang), s = Math.sin(ang);
  var lx = -s, ly = c;
  var x1 = apexPx[0] + (c * Math.cos(half) - lx * Math.sin(half)) * len;
  var y1 = apexPx[1] + (s * Math.cos(half) - ly * Math.sin(half)) * len;
  var x2 = apexPx[0] + (c * Math.cos(-half) - lx * Math.sin(-half)) * len;
  var y2 = apexPx[1] + (s * Math.cos(-half) - ly * Math.sin(-half)) * len;
  ctx.fillStyle = rgba(COL.beam, alpha);
  ctx.beginPath();
  ctx.moveTo(apexPx[0], apexPx[1]);
  ctx.lineTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.closePath();
  ctx.fill();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  var st = stage();
  var t = T;
  var cs = cycleState(t);
  var nud = nudgeAt(t);
  var oEff = [cs.origin[0] + nud[0], cs.origin[1] + nud[1]];

  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, 0, vw, vh);
  ctx.fillStyle = COL.field;
  ctx.fillRect(st.ox, st.oy, st.w, st.h);

  var apexPx = toScreen(st, APEX[0], APEX[1]);
  var chP = particles[cs.chIdx];
  var chDrawn = drawnPos(chP, t, oEff);
  var chPx = toScreen(st, chDrawn[0], chDrawn[1]);

  /* beam: searching sweep, then resting on the chosen one */
  if (cs.beamA > 0.003) {
    var ang;
    if (cs.stage === 'sweep') {
      var ref = drawnPos(chP, t, [CENTER[0] + nud[0], CENTER[1] + nud[1]]);
      var refPx = toScreen(st, ref[0], ref[1]);
      var thC = Math.atan2(refPx[1] - apexPx[1], refPx[0] - apexPx[0]);
      var sp = cs.tc / 6;
      ang = thC + 0.85 * Math.sin(TAU * 2.0 * sp + 0.7) * Math.pow(1 - sp, 1.5);
    } else {
      ang = Math.atan2(chPx[1] - apexPx[1], chPx[0] - apexPx[0]);
    }
    var len = Math.sqrt(st.w * st.w + st.h * st.h) * 1.45;
    for (var wI = 0; wI < WEDGES.length; wI++) {
      wedge(apexPx, ang, WEDGES[wI][0], len, WEDGES[wI][1] * cs.beamA);
    }
  }

  /* particle field */
  var sizeMul = phone ? 1.2 : 1;
  for (var i = 0; i < N; i++) {
    var p = particles[i];
    var dp = drawnPos(p, t, oEff);
    var sPx = toScreen(st, dp[0], dp[1]);
    if (sPx[0] < st.ox - 4 || sPx[0] > st.ox + st.w + 4 ||
        sPx[1] < st.oy - 4 || sPx[1] > st.oy + st.h + 4) continue;
    var tw = 0.8 + 0.2 * Math.sin(TAU * p.tw * t / LOOP + p.tp);
    var sz = COL.layerSize[p.layer] * sizeMul;
    ctx.fillStyle = rgba(COL.layerCol[p.layer], COL.layerAlpha[p.layer] * tw);
    ctx.fillRect(sPx[0] - sz / 2, sPx[1] - sz / 2, sz, sz);
  }

  /* the chosen one: bright core + thin gold ring */
  if (cs.ring > 0.003) {
    var cr = Math.max(2.4, Math.min(st.w, st.h) * 0.0042) * sizeMul;
    ctx.fillStyle = rgba(COL.gold, 0.10 * cs.ring);
    ctx.beginPath(); ctx.arc(chPx[0], chPx[1], cr * 3.1, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(COL.gold, 0.16 * cs.ring);
    ctx.beginPath(); ctx.arc(chPx[0], chPx[1], cr * 1.9, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(COL.coreHot, 0.97 * cs.ring + 0.03);
    ctx.beginPath(); ctx.arc(chPx[0], chPx[1], cr, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(COL.gold, 0.95 * cs.ring);
    ctx.lineWidth = Math.max(1.2, Math.min(st.w, st.h) * 0.0021);
    ctx.beginPath(); ctx.arc(chPx[0], chPx[1], cr + Math.max(5, Math.min(st.w, st.h) * 0.008), 0, TAU); ctx.stroke();
  }
}

/* ---------- interaction: the pointer only nudges the parallax ------------ */
function evPos(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [e.clientX - r.left, e.clientY - r.top];
}
function notePointer(e) {
  var st = stage(), s = evPos(e);
  var n = toNorm(st, s[0], s[1]);
  lastPointer = { x: n[0], y: n[1], t: T };
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointermove', notePointer);
  canvas.addEventListener('mousemove', notePointer);
  canvas.addEventListener('pointerleave', function () { lastPointer = null; });
  canvas.addEventListener('mouseleave', function () { lastPointer = null; });
}

/* ---------- main loop ------------------------------------------------------ */
/* Sound: none. The piece ships fully silent by design; the watching is the
   whole event and needs no hush under it. */
draw();
var lastTs = -1;
function frame(ts) {
  if (lastTs < 0) lastTs = ts - (T - 13.0) * 1000;
  T = 13.0 + (ts - lastTs) / 1000;
  draw();
  requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
</script>
</body>
</html>
