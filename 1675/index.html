<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incomplete Control Study</title>
<style>
html, body { margin: 0; padding: 0; background: #EFE6D4; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#EFE6D4';
var TILE = '#E9DEC6';
var INDIGO = '#2B4A8C';
var RUST = '#A6492B';
var CHARCOAL = '#33302B';
var WRONG = '#6A8A4A';
var PLATE = '#2e2418';
var PLATE_LINE = 'rgba(201,143,45,0.55)';
var TITLE_INK = '#f3ead6';
var HINT_INK = '#e8c87a';
var FIRST_T = 8.0;
var CYCLE_SECS = 60;
var COLS = 8, ROWS = 8;
var SHAPES = ['disc', 'square', 'ring', 'triangle', 'bar'];
var COLORS = [INDIGO, INDIGO, RUST, RUST, CHARCOAL, CHARCOAL];
/* An orderly grid that remembers its flaw: strict cells, one
   characteristic bug (a slipped column, a few misplaced cells, a
   stuttered value), slowly corrected and then creeping back. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* ---- deterministic cell table, fixed seed, built once ---- */
var cells = [];
var displaced = {};
var shearCol = 0, stutterRow = 0, stutterCol = 0;
(function buildTable() {
  var rng = mulberry32(1675);
  var i, r, c;
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS; c++) {
      cells.push({
        r: r, c: c,
        shape: SHAPES[Math.floor(rng() * SHAPES.length)],
        color: COLORS[Math.floor(rng() * COLORS.length)]
      });
    }
  }
  /* The bug's signature, chosen once from the same seed: five
     misplaced cells with fixed offset directions, one column that
     shears, one three cell run that stutters a single value. */
  var picked = 0;
  while (picked < 5) {
    i = Math.floor(rng() * cells.length);
    if (displaced[i]) continue;
    displaced[i] = {
      dx: (rng() - 0.5) * 0.9,
      dy: (rng() - 0.5) * 0.9
    };
    picked++;
  }
  shearCol = 2 + Math.floor(rng() * 4);
  stutterRow = Math.floor(rng() * ROWS);
  stutterCol = Math.floor(rng() * (COLS - 2));
  /* Keep the stutter cluster and the shear column out of the
     displaced set so each bug event stays readable. */
  for (i = 0; i < cells.length; i++) {
    if (cells[i].c === shearCol) delete displaced[i];
    if (cells[i].r === stutterRow && cells[i].c >= stutterCol &&
        cells[i].c <= stutterCol + 2) delete displaced[i];
  }
})();
function cellAt(r, c) { return cells[r * COLS + c]; }
/* ---- bug episode schedule: seeded per cycle, irregular ---- */
function episodesForCycle(cy) {
  var eps = [];
  if (cy === 0) {
    /* Frame one sits one second into this episode: the grid is in
       perfect order except the flaw just beginning. */
    eps.push({ start: 7.0, dur: 9.0, peak: 1.0 });
    eps.push({ start: 26.0, dur: 7.0, peak: 0.85 });
    eps.push({ start: 44.0, dur: 10.0, peak: 0.95 });
    return eps;
  }
  var rng = mulberry32(167500 + cy * 7919);
  var count = rng() < 0.66 ? 3 : 2;
  var start = 6 + rng() * 5, i;
  for (i = 0; i < count; i++) {
    eps.push({ start: start, dur: 6 + rng() * 5, peak: 0.7 + rng() * 0.3 });
    start += 13 + rng() * 8;
  }
  return eps;
}
function bugState(t) {
  var cy = Math.floor(t / CYCLE_SECS);
  var phase = t - cy * CYCLE_SECS;
  var eps = episodesForCycle(cy);
  var level = 0, flash = 0, i, e, u, ramp;
  for (i = 0; i < eps.length; i++) {
    e = eps[i];
    if (phase < e.start || phase > e.start + e.dur) continue;
    u = (phase - e.start) / e.dur;
    ramp = smooth(clamp(u / 0.25, 0, 1)) * smooth(clamp((1 - u) / 0.25, 0, 1));
    if (e.peak * ramp > level) level = e.peak * ramp;
    /* The greenish flash lives in the first 2 seconds of an
       episode, fading out so the eye catches the break. */
    if (phase - e.start < 2.0) {
      flash = Math.max(flash, 1.0 * (1 - (phase - e.start) / 2.0));
    }
  }
  return { level: level, flash: flash, phase: phase, cycle: cy };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function gridGeom() {
  var side = Math.min(VW, VH) * 0.8;
  var x0 = (VW - side) / 2, y0 = (VH - side) / 2;
  var gap = Math.max(2, side * 0.006);
  var cell = (side - gap * (COLS - 1)) / COLS;
  return { x0: x0, y0: y0, gap: gap, cell: cell };
}
function drawGlyph(shape, cx, cy, s, color) {
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  if (shape === 'disc') {
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.5, cy);
    ctx.arc(cx, cy, s * 0.5, 0, TAU);
    ctx.fill();
  } else if (shape === 'square') {
    ctx.fillRect(cx - s * 0.42, cy - s * 0.42, s * 0.84, s * 0.84);
  } else if (shape === 'ring') {
    ctx.lineWidth = Math.max(2, s * 0.14);
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.42, cy);
    ctx.arc(cx, cy, s * 0.42, 0, TAU);
    ctx.stroke();
  } else if (shape === 'triangle') {
    ctx.beginPath();
    ctx.moveTo(cx, cy - s * 0.48);
    ctx.lineTo(cx + s * 0.46, cy + s * 0.38);
    ctx.lineTo(cx - s * 0.46, cy + s * 0.38);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.fillRect(cx - s * 0.46, cy - s * 0.11, s * 0.92, s * 0.22);
  }
}
function drawCell(cell, gx, gy, g, level, flash, stutterS, reveal) {
  var x = g.x0 + cell.c * (g.cell + g.gap);
  var y = g.y0 + cell.r * (g.cell + g.gap);
  ctx.globalAlpha = reveal;
  ctx.fillStyle = TILE;
  ctx.fillRect(x, y, g.cell, g.cell);
  var cx = x + g.cell / 2, cy = y + g.cell / 2;
  var s = g.cell * 0.58;
  /* The stutter cluster crossfades to one repeated value as the
     bug grows, then back as the grid corrects itself. */
  var inStutter = cell.r === stutterRow && cell.c >= stutterCol &&
    cell.c <= stutterCol + 2;
  if (inStutter && stutterS > 0) {
    var first = cellAt(stutterRow, stutterCol);
    ctx.globalAlpha = reveal * (1 - stutterS);
    drawGlyph(cell.shape, cx, cy, s, cell.color);
    ctx.globalAlpha = reveal * stutterS;
    drawGlyph(first.shape, cx, cy, s, first.color);
    ctx.globalAlpha = reveal;
  } else {
    drawGlyph(cell.shape, cx, cy, s, cell.color);
  }
  ctx.globalAlpha = 1;
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Incomplete Control Study').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Incomplete Control Study').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 13').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Incomplete Control Study', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 13', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var bs = bugState(t);
  var level = bs.level, flash = bs.flash, phase = bs.phase;
  var stutterS = smooth(clamp((level - 0.35) / 0.35, 0, 1));
  var g = gridGeom();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var i, cell, reveal, idx;
  /* Pass one: the orderly grid. Bug cells are skipped here and
     drawn in pass two, so they overlap their neighbours. */
  for (i = 0; i < cells.length; i++) {
    cell = cells[i];
    if (displaced[i] || cell.c === shearCol) continue;
    idx = cell.r * COLS + cell.c;
    reveal = clamp((phase - 0.15 - idx * 0.045) / 0.3, 0, 1);
    drawCell(cell, 0, 0, g, level, flash, stutterS, reveal);
  }
  /* Pass two: the flaw. Displaced cells land off their tile and
     the shear column slips sideways, more the further down it goes. */
  for (i = 0; i < cells.length; i++) {
    cell = cells[i];
    var ox = 0, oy = 0, isBug = false;
    if (displaced[i]) {
      ox = displaced[i].dx * g.cell * level;
      oy = displaced[i].dy * g.cell * level;
      isBug = true;
    } else if (cell.c === shearCol) {
      ox = level * g.cell * 0.45 * (cell.r / (ROWS - 1));
      isBug = true;
    }
    if (!isBug) continue;
    idx = cell.r * COLS + cell.c;
    reveal = clamp((phase - 0.15 - idx * 0.045) / 0.3, 0, 1);
    var x = g.x0 + cell.c * (g.cell + g.gap) + ox;
    var y = g.y0 + cell.r * (g.cell + g.gap) + oy;
    ctx.globalAlpha = reveal;
    ctx.fillStyle = TILE;
    ctx.fillRect(x, y, g.cell, g.cell);
    var cx = x + g.cell / 2, cy = y + g.cell / 2;
    var s = g.cell * 0.58;
    ctx.globalAlpha = reveal;
    drawGlyph(cell.shape, cx, cy, s, cell.color);
    if (flash > 0) {
      /* The greenish flash marks the moment of breakage: the
         wrong hue is laid over the cell, then fades. */
      ctx.globalAlpha = reveal * flash;
      drawGlyph(cell.shape, cx, cy, s, WRONG);
    }
    ctx.globalAlpha = 1;
  }
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    bugState: function (t) { return bugState(t); },
    shearCol: function () { return shearCol; },
    stutter: function () { return { row: stutterRow, col: stutterCol }; },
    displacedCount: function () { return Object.keys(displaced).length; }
  };
}
/* ---- frame one: t = FIRST_T, grid ordered, flaw beginning ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
