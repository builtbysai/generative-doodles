<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailer for a Film That Doesn't Exist</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0c10; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 720, H = 720;

function size() {
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;

// Seeded PRNG (mulberry32), seed 1537000. All schedule variation comes from

function mulberry32(a) {

var GROUND = '#0d0c10';
var BONE = '#ddd3b8', RED = '#b33324', OCHRE = '#c98f3d', TEAL = '#5a7a72', SILVER = '#d8d8d8';

// ---- drawing helpers: explicit canvas state in every branch ----

// Each panel: id, family (for formal rhyme), colors (1-2, never all at once),

  P(4, 'line', [RED], true, 'medium', function (cx, cy, S) {

  P(5, 'line', [OCHRE], true, 'sparse', function (cx, cy, S) {
    polyline([[cx - S * 0.38, cy + S * 0.10], [cx - S * 0.19, cy - S * 0.14], [cx, cy + S * 0.10],

  P(6, 'line', [BONE], false, 'crowded', function (cx, cy, S) {

  P(7, 'line', [RED], false, 'sparse', function (cx, cy, S) {

    polyline([[cx, cy - S * 0.16], [cx, cy + S * 0.16]], S * 0.05, RED, 'butt');
    polyline([[cx - S * 0.38, cy - S * 0.30], [cx - S * 0.22, cy - S * 0.30]], S * 0.04, RED, 'butt');

  P(8, 'grid', [BONE], true, 'medium', function (cx, cy, S) {
    var cell = S * 0.20, x0 = cx - cell * 1.5, y0 = cy - cell * 1.5;
    for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) {

  P(9, 'grid', [SILVER, TEAL], false, 'medium', function (cx, cy, S) {
    var w = S * 0.72, x0 = cx - w / 2, y0 = cy - w / 2;
    rect(x0, y0, w, w, SILVER);

    bar(cx - S * 0.02, y0, S * 0.04, w, SILVER);
    bar(x0, cy - S * 0.02, w, S * 0.04, SILVER);
    disc(cx - w * 0.25, cy - w * 0.25, S * 0.10, TEAL);
    rect(cx + w * 0.08, cy + w * 0.08, S * 0.18, S * 0.18, TEAL);
  }),
  P(10, 'grid', [BONE, SILVER], true, 'crowded', function (cx, cy, S) {
    var cell = S * 0.13, x0 = cx - cell * 3, y0 = cy - cell * 3;
    for (var r = 0; r < 6; r++) for (var c = 0; c < 6; c++) {
      if ((r + c) % 2 === 0) rect(x0 + c * cell, y0 + r * cell, cell, cell, BONE);
    }
  }),
  P(11, 'dot', [OCHRE], true, 'crowded', function (cx, cy, S) {
    var seeds = [0.11, 0.37, 0.62, 0.85, 0.23, 0.51, 0.78, 0.44, 0.69, 0.31, 0.92, 0.57];
    for (var i = 0; i < 12; i++) {
      var x = cx - S * 0.38 + seeds[i] * S * 0.76;
      var y = cy - S * 0.38 + seeds[(i * 5 + 2) % 12] * S * 0.76;
      disc(x, y, S * 0.045, OCHRE);
    }
  }),
  P(12, 'dot', [SILVER], false, 'sparse', function (cx, cy, S) {
    for (var i = 0; i < 5; i++) disc(cx - S * 0.32 + i * S * 0.16, cy, S * 0.05, SILVER);
  }),
  P(13, 'shape', [RED], true, 'medium', function (cx, cy, S) {
    for (var i = 0; i < 3; i++) {
      var y = cy - S * 0.26 + i * S * 0.26, w = S * (0.42 - i * 0.10);
      ctx.fillStyle = RED;
      ctx.beginPath();
      ctx.moveTo(cx - w / 2, y + S * 0.10);
      ctx.lineTo(cx, y - S * 0.10);
      ctx.lineTo(cx + w / 2, y + S * 0.10);
      ctx.closePath();
      ctx.fill();
    }
  }),
  P(14, 'circle', [TEAL], false, 'sparse', function (cx, cy, S) {
    ctx.strokeStyle = TEAL; ctx.lineWidth = S * 0.06; ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(cx + S * 0.30, cy);
    ctx.arc(cx, cy, S * 0.30, -0.6, 2.2);
    ctx.stroke();
  }),
  P(15, 'line', [OCHRE], false, 'medium', function (cx, cy, S) {
    for (var i = 0; i < 4; i++) bar(cx - S * 0.36, cy - S * 0.27 + i * S * 0.18, S * (0.30 + 0.12 * i), S * 0.07, OCHRE);
  }),
  P(16, 'circle', [RED], true, 'crowded', function (cx, cy, S) {
    var offs = [[-0.24, -0.20], [0.22, -0.24], [-0.26, 0.22], [0.24, 0.20], [0, 0]];
    for (var i = 0; i < 5; i++) ring(cx + offs[i][0] * S, cy + offs[i][1] * S, S * 0.13, S * 0.035, RED);
  }),
  P(17, 'grid', [BONE], false, 'crowded', function (cx, cy, S) {
    for (var r = 0; r < 5; r++) for (var c = 0; c < 5; c++) {
      if ((r * 5 + c) % 3 !== 1) disc(cx - S * 0.32 + c * S * 0.16, cy - S * 0.32 + r * S * 0.16, S * 0.035, BONE);
    }
  }),
  P(18, 'line', [TEAL], false, 'crowded', function (cx, cy, S) {
    for (var i = 0; i < 4; i++) {
      var y = cy - S * 0.30 + i * S * 0.20;
      polyline([[cx - S * 0.38, y], [cx - S * 0.19, y - S * 0.10], [cx, y], [cx + S * 0.19, y - S * 0.10], [cx + S * 0.38, y]], S * 0.03, TEAL, 'round');
    }
  }),
  P(19, 'circle', [BONE, OCHRE], true, 'medium', function (cx, cy, S) {
    disc(cx - S * 0.14, cy, S * 0.22, BONE);
    disc(cx + S * 0.14, cy, S * 0.22, OCHRE);
  }),
  P(20, 'line', [SILVER], false, 'sparse', function (cx, cy, S) {
    bar(cx - S * 0.34, cy - S * 0.03, S * 0.68, S * 0.06, SILVER);
    bar(cx - S * 0.03, cy - S * 0.34, S * 0.06, S * 0.68, SILVER);
  }),
  P(21, 'grid', [TEAL, SILVER], true, 'crowded', function (cx, cy, S) {
    var cell = S * 0.22, x0 = cx - cell * 1.5, y0 = cy - cell * 1.5;
    for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) {
      ctx.strokeStyle = TEAL; ctx.lineWidth = S * 0.03; ctx.lineCap = 'butt';
      ctx.strokeRect(x0 + c * cell + cell * 0.08, y0 + r * cell + cell * 0.08, cell * 0.84, cell * 0.84);
      if ((r + c) % 2 === 0) disc(x0 + c * cell + cell * 0.5, y0 + r * cell + cell * 0.5, S * 0.05, SILVER);
    }
  }),
  P(22, 'dot', [RED], true, 'medium', function (cx, cy, S) {
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4;
      disc(cx + Math.cos(a) * S * 0.30, cy + Math.sin(a) * S * 0.30, S * 0.055, RED);
    }
  }),
  P(23, 'shape', [OCHRE], false, 'sparse', function (cx, cy, S) {
    ctx.strokeStyle = OCHRE; ctx.lineWidth = S * 0.05; ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy - S * 0.30);
    ctx.lineTo(cx + S * 0.30, cy + S * 0.26);
    ctx.lineTo(cx - S * 0.30, cy + S * 0.26);
    ctx.closePath();
    ctx.stroke();

function byId(id) { return PANELS[id]; }
function rhymes(a, b) {
  if (a.family === b.family) return true;
  if (a.colors.length === 2 && b.colors.length === 2 &&
      a.colors[0] === b.colors[1] && a.colors[1] === b.colors[0]) return true;
  return false;
}
function pickSeeded(arr) { return arr[Math.floor(rng() * arr.length)]; }

// ---- schedule: 2 cycles x 24 panels, each cycle a seeded permutation biased

// a 6-8 s hold-break every 12th cut. LOOP = total duration, so the schedule
// is exactly periodic and t=LOOP equals t=0.
var PHRASE = ['quick', 'quick', 'hold', 'quick', 'hold', 'long'];
function durFor(slot) {
  if (slot === 'quick') return 0.4 + rng() * 0.5;
  if (slot === 'hold') return 1.0 + rng() * 0.8;
  return 1.9 + rng() * 0.6;

  var remaining = PANELS.map(function (p) { return p.id; });
  var order = [];

  remaining.splice(remaining.indexOf(first), 1);
  order.push(first);
  while (remaining.length > 0) {
    var prev = byId(order[order.length - 1]);
    var wantRhyme = rng() < 0.5;
    var pool = remaining.filter(function (id) {
      var p = byId(id);
      return wantRhyme ? rhymes(prev, p) : (p.bright !== prev.bright);

    if (pool.length === 0) {
      pool = remaining.filter(function (id) {
        var p = byId(id);
        return wantRhyme ? (p.bright !== prev.bright) : rhymes(prev, p);

    if (pool.length === 0) pool = remaining.slice();
    var next = pickSeeded(pool);
    remaining.splice(remaining.indexOf(next), 1);

  var t = 0, cutIndex = 0;
  for (var c = 0; c < 2; c++) {
    var order = buildCycle();
    CYCLES.push(order);
    for (var i = 0; i < order.length; i++) {
      var dur;
      if (cutIndex % 12 === 11) dur = 6 + rng() * 2;
      else dur = durFor(PHRASE[cutIndex % PHRASE.length]);
      CUTS.push({ panel: order[i], start: t, dur: dur });

var LOOP = CUTS[CUTS.length - 1].start + CUTS[CUTS.length - 1].dur;

  for (var i = 0; i < CUTS.length; i++) {

// ---- interaction: closed-form over recorded events ----

var steps = []; // {time, dir}
var holding = false, holdStart = 0, holdFrozen = 0, downX = 0, downY = 0, movedX = 0;

  var s = 0;
  for (var i = 0; i < holds.length; i++) {
    var h = holds[i];
    if (h.start > t) continue;
    s += (h.end === null ? t : Math.min(h.end, t)) - h.start;

  var s = 0;
  for (var i = 0; i < steps.length; i++) if (steps[i].time <= t) s += steps[i].dir;
  return s;

  if (e.preventDefault) e.preventDefault();

  var t = lastT;
  holding = false;
