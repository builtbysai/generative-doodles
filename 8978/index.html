<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mud Map — No.8978</title>
<!-- phantom-fill-8978 -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#141210; }
  canvas { display:block; width:100vw; height:100dvh; cursor:pointer; }
  .hud {
    position:fixed; top:18px; left:22px; pointer-events:none; user-select:none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color:#e8e4da;
  }
  .hud h1 { font-size:12px; font-weight:400; letter-spacing:.34em; text-transform:uppercase; }
  .hud .zones { margin-top:12px; font-size:10px; letter-spacing:.16em; line-height:2; opacity:.75; }
  .hud .zones b { color:#e0684f; font-weight:400; }
  .hud .counts { margin-top:10px; font-size:10px; letter-spacing:.16em; opacity:.55; }
  .hud .counts span { color:#f5f1e6; opacity:1; }
  .label {
    position:fixed; left:0; right:0; bottom:0; padding:14px 22px 16px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color:#e8e4da; pointer-events:none; user-select:none;
    font-size:11px; letter-spacing:.18em;
  }
  .label .t { text-transform:uppercase; letter-spacing:.28em; opacity:.85; }
  .label .n { opacity:.45; }
  @media (max-width:640px) {
    .hud { top:12px; left:14px; }
    .hud .zones { font-size:9px; line-height:1.9; }
    .label { padding:12px 14px 14px; font-size:10px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <h1>Mud Map</h1>
  <div class="zones">
    A &middot; 28&deg;&ndash;58&deg; &middot; <b>DEAD</b><br>
    B &middot; 148&deg;&ndash;182&deg; &middot; <b>DEAD</b><br>
    C &middot; 288&deg;&ndash;322&deg; &middot; <b>DEAD</b>
  </div>
  <div class="counts">TRAPPED <span id="nTrap">–</span> &nbsp; ESCAPED <span id="nEsc">–</span> &nbsp; FREE <span id="nFree">–</span></div>
</div>
<div class="label"><span class="t">Mud Map</span><span class="n">No. 8978 &middot; click to scatter again</span></div>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const nTrap = document.getElementById('nTrap');
  const nEsc = document.getElementById('nEsc');
  const nFree = document.getElementById('nFree');

  // Three dead zones on the hue wheel: angular ranges, marked dead.
  const ZONES = [
    { letter: 'A', a0: 28,  a1: 58  },
    { letter: 'B', a0: 148, a1: 182 },
    { letter: 'C', a0: 288, a1: 322 }
  ];
  const N_DOTS = 110;
  const ESC_DUR = 1400;   // ms per escape
  const STAGGER = 35;     // ms between escapes

  let W, H, dpr, CX, CY, R;
  let wheel = null;   // offscreen: static wheel + mud zones
  let trails = null;  // offscreen: completed escape arcs
  let tctx = null;
  let dots = [];
  let scatter = 0;
  let startTime = 0;

  function rad(h) { return (h - 90) * Math.PI / 180; }
  function inZone(h) {
    for (const z of ZONES) if (h >= z.a0 && h <= z.a1) return z;
    return null;
  }
  // Nearest exit angle for a trapped hue: closest zone edge, pushed 4° clear.
  function exitAngle(h, z) {
    return (h - z.a0) < (z.a1 - h) ? z.a0 - 4 : z.a1 + 4;
  }
  function pt(angleDeg, r) {
    const a = rad(angleDeg);
    return [CX + Math.cos(a) * r, CY + Math.sin(a) * r];
  }

  function buildWheel() {
    wheel = document.createElement('canvas');
    wheel.width = W * dpr; wheel.height = H * dpr;
    const w = wheel.getContext('2d');
    w.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Hue disc: 720 wedges, 0° red at top, clockwise.
    for (let h = 0; h < 360; h += 0.5) {
      w.beginPath();
      w.moveTo(CX, CY);
      w.arc(CX, CY, R, rad(h), rad(h + 0.5) + 0.001);
      w.closePath();
      w.fillStyle = 'hsl(' + h + ',62%,52%)';
      w.fill();
    }
    // Guide rings + rim.
    w.strokeStyle = 'rgba(20,18,16,0.35)';
    w.lineWidth = 1;
    [0.3, 0.6, 0.9].forEach(function (f) {
      w.beginPath(); w.arc(CX, CY, R * f, 0, Math.PI * 2); w.stroke();
    });
    w.strokeStyle = 'rgba(232,228,218,0.55)';
    w.beginPath(); w.arc(CX, CY, R + 0.5, 0, Math.PI * 2); w.stroke();
    // Degree ticks + labels every 30°.
    w.fillStyle = 'rgba(232,228,218,0.6)';
    w.font = '10px ui-monospace, Menlo, monospace';
    w.textAlign = 'center'; w.textBaseline = 'middle';
    for (let h = 0; h < 360; h += 30) {
      const a = rad(h);
      w.strokeStyle = 'rgba(232,228,218,0.5)';
      w.beginPath();
      w.moveTo(CX + Math.cos(a) * (R + 4), CY + Math.sin(a) * (R + 4));
      w.lineTo(CX + Math.cos(a) * (R + 11), CY + Math.sin(a) * (R + 11));
      w.stroke();
      w.fillText(h + '°', CX + Math.cos(a) * (R + 26), CY + Math.sin(a) * (R + 26));
    }

    // Mud zones: dead wedges, hatched, labelled.
    ZONES.forEach(function (z) {
      w.save();
      w.beginPath();
      w.moveTo(CX, CY);
      w.arc(CX, CY, R, rad(z.a0), rad(z.a1));
      w.closePath();
      w.fillStyle = '#6b5a41';
      w.fill();
      w.clip();
      w.strokeStyle = 'rgba(20,18,16,0.5)';
      w.lineWidth = 1;
      for (let d = -R * 2; d < R * 2; d += 9) {
        w.beginPath();
        w.moveTo(CX + d, CY - R);
        w.lineTo(CX + d + R, CY + R);
        w.stroke();
      }
      w.restore();
      // Dashed zone edges.
      w.strokeStyle = 'rgba(232,228,218,0.7)';
      w.setLineDash([4, 4]);
      [z.a0, z.a1].forEach(function (h) {
        const p = pt(h, R);
        w.beginPath(); w.moveTo(CX, CY); w.lineTo(p[0], p[1]); w.stroke();
      });
      w.setLineDash([]);
      // DEAD label along the arc, zone letter near the rim.
      const mid = (z.a0 + z.a1) / 2;
      const lp = pt(mid, R * 0.62);
      // Tangent rotation, flipped in the lower half so the word stays readable.
      let rot = rad(mid) + Math.PI / 2;
      if (Math.sin(rad(mid)) > 0) rot += Math.PI;
      w.save();
      w.translate(lp[0], lp[1]);
      w.rotate(rot);
      w.fillStyle = 'rgba(245,241,230,0.9)';
      w.font = '11px ui-monospace, Menlo, monospace';
      w.textAlign = 'center'; w.textBaseline = 'middle';
      w.fillText('D E A D', 0, 0);
      w.restore();
      const zp = pt(mid, R * 0.9);
      w.fillStyle = 'rgba(245,241,230,0.9)';
      w.font = 'bold 13px ui-monospace, Menlo, monospace';
      w.fillText(z.letter, zp[0], zp[1]);
    });

    trails = document.createElement('canvas');
    trails.width = W * dpr; trails.height = H * dpr;
    tctx = trails.getContext('2d');
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function qbez(p0, p1, p2, t) {
    const u = 1 - t;
    return [
      u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0],
      u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]
    ];
  }

  function scatterDots() {
    scatter++;
    dots = [];
    let trapped = 0;
    for (let i = 0; i < N_DOTS; i++) {
      const h = Math.random() * 360;
      const r = R * (0.12 + Math.random() * 0.8);
      const zone = inZone(h);
      const d = { h: h, r: r, pos: pt(h, r), zone: zone, done: false };
      if (zone) {
        trapped++;
        const exit = exitAngle(h, zone);
        d.end = pt(exit, R * 0.985);
        // Control point: midpoint of dot->rim, bent sideways and nudged
        // outward — each arc curves its own way but stays inside the wheel.
        const mx = (d.pos[0] + d.end[0]) / 2;
        const my = (d.pos[1] + d.end[1]) / 2;
        const dx = d.end[0] - d.pos[0], dy = d.end[1] - d.pos[1];
        const dist = Math.hypot(dx, dy) || 1;
        const side = Math.random() < 0.5 ? -1 : 1;
        const bend = 0.3 + Math.random() * 0.25;
        const mr = Math.hypot(mx - CX, my - CY) || 1;
        d.ctrl = [
          mx + (-dy / dist) * side * dist * bend + ((mx - CX) / mr) * dist * 0.12,
          my + (dx / dist) * side * dist * bend + ((my - CY) / mr) * dist * 0.12
        ];
        d.delay = trapped * STAGGER;
      }
      dots.push(d);
    }
    // Clear old trails; the new map starts blank.
    tctx.clearRect(0, 0, W, H);
    startTime = performance.now();
    nTrap.textContent = trapped;
    nFree.textContent = N_DOTS - trapped;
    nEsc.textContent = 0;
    updateState();
  }

  function updateState() {
    const escaped = dots.filter(function (d) { return d.zone && d.done; }).length;
    const trapped = dots.filter(function (d) { return d.zone; }).length;
    window.__mud = { scatter: scatter, trapped: trapped,
                     escaped: escaped, free: N_DOTS - trapped };
  }

  function drawArc(c, d, t, alpha) {
    c.strokeStyle = 'hsla(' + d.h + ',85%,65%,' + alpha + ')';
    c.lineWidth = 1.4;
    c.beginPath();
    const steps = 24;
    for (let i = 0; i <= steps; i++) {
      const p = qbez(d.pos, d.ctrl, d.end, t * i / steps);
      if (i === 0) c.moveTo(p[0], p[1]); else c.lineTo(p[0], p[1]);
    }
    c.stroke();
  }

  function frame(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#141210';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(wheel, 0, 0, W, H);
    ctx.drawImage(trails, 0, 0, W, H);

    let changed = false;
    const elapsed = now - startTime;
    for (const d of dots) {
      if (!d.zone) {
        // Free colour: sits bright on the wheel.
        ctx.fillStyle = 'hsl(' + d.h + ',85%,62%)';
        ctx.beginPath(); ctx.arc(d.pos[0], d.pos[1], 3.6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(20,18,16,0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(d.pos[0], d.pos[1], 3.6, 0, Math.PI * 2); ctx.stroke();
        continue;
      }
      const t = Math.max(0, Math.min(1, (elapsed - d.delay) / ESC_DUR));
      if (t >= 1) {
        if (!d.done) {
          d.done = true;
          drawArc(tctx, d, 1, 0.35); // the escape stays on the map
          nEsc.textContent = Number(nEsc.textContent) + 1;
          changed = true;
        }
        ctx.fillStyle = 'hsl(' + d.h + ',90%,64%)';
        ctx.beginPath(); ctx.arc(d.end[0], d.end[1], 4.4, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(245,241,230,0.85)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(d.end[0], d.end[1], 4.4, 0, Math.PI * 2); ctx.stroke();
      } else if (t > 0) {
        drawArc(ctx, d, t, 0.8);
        const p = qbez(d.pos, d.ctrl, d.end, t);
        ctx.fillStyle = 'hsl(' + d.h + ',90%,64%)';
        ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, Math.PI * 2); ctx.fill();
      } else {
        // Still trapped: dim dot ringed in the mud.
        ctx.fillStyle = 'hsla(' + d.h + ',70%,55%,0.85)';
        ctx.beginPath(); ctx.arc(d.pos[0], d.pos[1], 3.4, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(245,241,230,0.6)';
        ctx.setLineDash([2, 2]);
        ctx.beginPath(); ctx.arc(d.pos[0], d.pos[1], 6.5, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    if (changed) updateState();
    requestAnimationFrame(frame);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    CX = W / 2; CY = H / 2 + 6;
    R = Math.min(W * 0.42, H * 0.36);
    buildWheel();
    scatterDots();
  }
  let rsT;
  window.addEventListener('resize', function () {
    clearTimeout(rsT);
    rsT = setTimeout(resize, 150);
  });

  canvas.addEventListener('click', scatterDots);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); scatterDots(); }
  });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
