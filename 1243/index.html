<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scream but Not Cry</title>
<style>
  html, body { margin:0; padding:0; background:#D8C8A4; overflow:hidden; height:100%; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- seeded hash (all variation derives from this) ---------- */
function hash(n){
  var i = (n|0) ^ 0x9E3779B9;
  i = Math.imul(i ^ (i>>>16), 0x21F0AAAD);
  i = Math.imul(i ^ (i>>>15), 0x735A2D97);
  i = i ^ (i>>>15);
  return (i>>>0) / 4294967296;
}
function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
function lerp(a,b,k){ return a+(b-a)*k; }

/* ---------- palette ---------- */
var PLAYA = '#D8C8A4', FLAG = '#F2EFE6', FLAG_SH = '#E8E3D1',
    FLAME = '#E86A2C', EMBER = '#C23B2E', SCORCH = '#1A1712',
    SKY = '#9FC2D8', RAIN = '#8A8D94';

/* ---------- constants ---------- */
var T0 = 24;              // fixed first-frame phase (seconds into the piece)
var CYCLE = 90;           // 90-second loop
var COLS = 14, ROWS = 9;  // flag grid

/* ---------- viewport / sizing ---------- */
var W = 800, H = 600, isPhone = false;
function measure(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  var w = vv ? vv.width : (window.innerWidth || 800);
  var h = vv ? vv.height : (window.innerHeight || 600);
  var sw = 9999, sh = 9999;
  if (window.screen){ sw = window.screen.width || 9999; sh = window.screen.height || 9999; }
  isPhone = (Math.min(sw, sh) < 700) || (h > w * 1.15);
  W = w; H = h;
  canvas.width = W; canvas.height = H;
}
if (window.visualViewport && window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize', measure);
}
window.addEventListener('resize', measure);
measure();

/* ---------- scream state: closed-form walk over hold events ---------- */
var holds = [];        // [{start, end}] in piece time; end = Infinity while held
var holding = false;

function screamState(t){
  // Walk segments; S rises at 1/1.2 per sec while held (cap 1),
  // decays at 1/3 per sec when released (floor 0).
  // Returns {S, intS} with intS = integral of S from 0..t (exact, piecewise).
  var S = 0, intS = 0, cur = 0;
  var bounds = [0, t];
  for (var k = 0; k < holds.length; k++){
    if (holds[k].start > 0 && holds[k].start < t) bounds.push(holds[k].start);
    if (isFinite(holds[k].end) && holds[k].end > 0 && holds[k].end < t) bounds.push(holds[k].end);
  }
  bounds.sort(function(a,b){ return a-b; });
  function heldAt(x){
    for (var k = 0; k < holds.length; k++){
      if (x >= holds[k].start && x < holds[k].end) return true;
    }
    return false;
  }
  for (var b = 0; b < bounds.length - 1; b++){
    var tA = bounds[b], tB = bounds[b+1];
    var held = heldAt((tA + tB) / 2);
    var rem = tB - tA;
    while (rem > 1e-9){
      var slope = held ? (1/1.2) : -(1/3);
      var step = rem;
      if (held && S + slope*step > 1) step = (1 - S) / slope;
      if (!held && S + slope*step < 0) step = S / (1/3);
      var S2 = clamp(S + slope*step, 0, 1);
      intS += 0.5 * (S + S2) * step;
      S = S2;
      rem -= step;
      if (step <= 1e-9) break;
      // after hitting a cap/floor, S stays flat for the rest of this sub-segment
      if ((held && S >= 1) || (!held && S <= 0)){
        intS += S * rem;
        rem = 0;
      }
    }
    cur = tB;
  }
  return { S: S, intS: intS };
}

/* ---------- burn model ---------- */
function burnFrac(t){
  var cycStart = Math.floor(t / CYCLE) * CYCLE;
  var cyc = t - cycStart;
  var base = 0.55 * Math.pow(cyc / CYCLE, 0.8);       // ~0.19 at t=24, 0.55 at cycle end
  var extra = 0.10 * (screamState(t).intS - screamState(cycStart).intS);
  return clamp(base + extra, 0, 0.82);
}
function colBurn(c, bf){
  // ragged per-column line: two hash octaves so neighbouring columns differ hard
  return bf * (0.70 + 0.42 * hash(c * 7 + 3) + 0.20 * hash(c * 23 + 11));
}

/* ---------- drawing ---------- */
function pointInFlag(c, r, t, S, ph){
  // grid point (c: 0..COLS left->right, r: 0..ROWS top->bottom)
  var poleX = isPhone ? W * 0.16 : W * 0.33;
  var flagW = isPhone ? W * 0.78 : W * 0.46;
  var flagX = poleX + 3, flagY = H * 0.16, flagH = H * 0.30;
  var u = c / COLS, v = r / ROWS;
  var Wd = 0.35 + 0.65 * S;                            // wind level
  var amp = (H * 0.006 + H * 0.030 * Wd) * u;          // hoist edge stays put
  var dy = Math.sin(c * 0.85 - ph * 2.3 + r * 0.38) * amp
         + Math.sin(c * 0.41 - ph * 1.35 + r * 0.12) * amp * 0.55;
  var dx = Math.sin(r * 0.85 + ph * 1.6 + c * 0.22) * amp * 0.28;
  return { x: flagX + u * flagW + dx, y: flagY + v * flagH + dy };
}

function draw(t){
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var cyc = t % CYCLE;
  var st = screamState(t);
  var S = st.S;
  var Wd = 0.35 + 0.65 * S;                            // wind
  var F = 0.5 + 1.1 * S;                               // flame level
  var ph = t + 0.9 * st.intS;                          // ripple phase (scream whips it)
  var bf = burnFrac(t);
  var horizon = H * 0.62;

  /* sky */
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, horizon + 1);

  /* distant mountains: two flat ridge bands */
  ctx.fillStyle = '#9DB3BC';
  ctx.beginPath(); ctx.moveTo(0, horizon);
  for (var mx = 0; mx <= 10; mx++){
    ctx.lineTo(W * mx / 10, horizon - H * (0.03 + 0.05 * hash(mx * 31 + 7)));
  }
  ctx.lineTo(W, horizon); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#B3A488';
  ctx.beginPath(); ctx.moveTo(0, horizon);
  for (var nx = 0; nx <= 10; nx++){
    ctx.lineTo(W * nx / 10, horizon - H * (0.008 + 0.022 * hash(nx * 17 + 101)));
  }
  ctx.lineTo(W, horizon); ctx.closePath(); ctx.fill();

  /* playa */
  ctx.fillStyle = PLAYA;
  ctx.fillRect(0, horizon, W, H - horizon);
  ctx.fillStyle = 'rgba(90,70,40,0.10)';
  for (var p = 0; p < 130; p++){
    var px = hash(p * 3 + 11) * W, py = horizon + hash(p * 5 + 23) * (H - horizon);
    ctx.fillRect(px, py, 2.5, 1.6);
  }
  ctx.fillStyle = 'rgba(255,250,235,0.13)';
  for (var q = 0; q < 70; q++){
    ctx.fillRect(hash(q * 7 + 41) * W, horizon + hash(q * 13 + 53) * (H - horizon), 2, 1.4);
  }

  /* rock trails: fade in over [0,60), erased by the rain */
  var trailA = 0.55 * clamp(cyc / 60, 0, 1);
  if (cyc >= 70) trailA *= 1 - clamp((cyc - 70) / 6, 0, 1);
  if (cyc >= 80) trailA = 0;

  /* rocks (mid-ground) */
  var rocks = [
    { fx: 0.14, fy: 0.685, s: 15 }, { fx: 0.66, fy: 0.705, s: 20 },
    { fx: 0.82, fy: 0.672, s: 12 }, { fx: 0.38, fy: 0.725, s: 17 }
  ];
  for (var ri = 0; ri < rocks.length; ri++){
    var rk = rocks[ri], rx = rk.fx * W, ry = rk.fy * H, rs = rk.s * (isPhone ? 0.8 : 1);
    if (trailA > 0.01){
      ctx.strokeStyle = 'rgba(239,229,204,' + (trailA * 0.8).toFixed(3) + ')';
      ctx.lineWidth = rs * 0.85;
      ctx.beginPath();
      ctx.moveTo(rx - rs * 0.3, ry + rs * 0.25);
      ctx.quadraticCurveTo(rx - rs * 3.2, ry + rs * (0.5 + 0.3 * hash(ri * 19)),
                           rx - rs * (5.2 + 1.6 * hash(ri * 29 + 5)), ry + rs * (0.35 + 0.4 * hash(ri * 7 + 2)));
      ctx.stroke();
      ctx.strokeStyle = 'rgba(216,200,164,' + (trailA * 0.9).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(rx - rs * 0.3, ry + rs * 0.25);
      ctx.quadraticCurveTo(rx - rs * 3.2, ry + rs * (0.5 + 0.3 * hash(ri * 19)),
                           rx - rs * (5.2 + 1.6 * hash(ri * 29 + 5)), ry + rs * (0.35 + 0.4 * hash(ri * 7 + 2)));
      ctx.stroke();
    }
    ctx.fillStyle = '#6B5B45';
    ctx.beginPath();
    var rn = 7;
    for (var rv = 0; rv <= rn; rv++){
      var ra = (rv / rn) * Math.PI * 2;
      var rr = rs * (0.75 + 0.4 * hash(ri * 43 + rv * 3));
      var vx = rx + Math.cos(ra) * rr, vy2 = ry + Math.sin(ra) * rr * 0.62;
      if (rv === 0) ctx.moveTo(vx, vy2); else ctx.lineTo(vx, vy2);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(26,23,18,0.35)';
    ctx.beginPath();
    ctx.moveTo(rx - rs * 0.8, ry + rs * 0.5);
    ctx.lineTo(rx + rs * 0.8, ry + rs * 0.5);
    ctx.lineTo(rx + rs * 0.45, ry + rs * 0.72);
    ctx.lineTo(rx - rs * 0.45, ry + rs * 0.72);
    ctx.closePath(); ctx.fill();
  }

  /* flagpole */
  var poleX = isPhone ? W * 0.16 : W * 0.33;
  var poleTop = H * 0.145, poleBot = H * 0.80;
  ctx.strokeStyle = '#3A3630';
  ctx.lineWidth = Math.max(3, W * 0.004);
  ctx.beginPath(); ctx.moveTo(poleX, poleTop); ctx.lineTo(poleX, poleBot); ctx.stroke();
  ctx.fillStyle = '#3A3630';
  ctx.beginPath(); ctx.moveTo(poleX - 6, poleBot); ctx.lineTo(poleX + 6, poleBot);
  ctx.lineTo(poleX + 3, poleBot + 5); ctx.lineTo(poleX - 3, poleBot + 5); ctx.closePath(); ctx.fill();

  /* flag grid points */
  var pts = [];
  for (var c = 0; c <= COLS; c++){
    pts.push([]);
    for (var r = 0; r <= ROWS; r++) pts[c].push(pointInFlag(c, r, t, S, ph));
  }
  function quadRaw(a, b, d, e){
    // inflate ~0.7px around the centroid so cell seams never show sky through
    var cx = (a.x + b.x + d.x + e.x) / 4, cy = (a.y + b.y + d.y + e.y) / 4;
    function inf(p){ var dx = p.x - cx, dy = p.y - cy, L = Math.sqrt(dx * dx + dy * dy) || 1; return { x: p.x + dx / L * 0.7, y: p.y + dy / L * 0.7 }; }
    var A = inf(a), B = inf(b), D = inf(d), E = inf(e);
    ctx.beginPath();
    ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(D.x, D.y); ctx.lineTo(E.x, E.y);
    ctx.closePath(); ctx.fill();
  }
  function quad(c, r){ quadRaw(pts[c][r], pts[c + 1][r], pts[c + 1][r + 1], pts[c][r + 1]); }
  function biteQuad(c, r, k){
    // scorch bite: only the lower k of the cell, k measured from its bottom edge
    var a = pts[c][r], b = pts[c + 1][r], d = pts[c + 1][r + 1], e = pts[c][r + 1];
    var la = { x: lerp(e.x, a.x, k), y: lerp(e.y, a.y, k) };
    var lb = { x: lerp(d.x, b.x, k), y: lerp(d.y, b.y, k) };
    quadRaw(la, lb, d, e);
  }
  /* flag cells: gone below the burn line, charred at it, white above */
  for (var cc = 0; cc < COLS; cc++){
    var bcol = colBurn(cc, bf);
    for (var rr = 0; rr < ROWS; rr++){
      var fb = (ROWS - 1 - rr) / ROWS;      // cell bottom, as fraction up from flag bottom
      var ft = (ROWS - rr) / ROWS;          // cell top
      if (ft <= bcol) continue;             // consumed
      var fold = Math.sin(cc * 0.85 - ph * 2.3 + rr * 0.38);
      ctx.fillStyle = fold > 0 ? FLAG : FLAG_SH;
      quad(cc, rr);
      var dAbove = fb - bcol;
      if (dAbove < 0.045){
        /* at the line: full char, two scorch tones */
        ctx.fillStyle = hash(cc * 37 + rr * 11) < 0.5 ? SCORCH : '#241C14';
        quad(cc, rr);
        if (hash(cc * 91 + rr * 13 + 7) < 0.6){
          ctx.fillStyle = 'rgba(232,106,44,0.5)';
          var cp = pts[cc][rr];
          ctx.fillRect(cp.x + hash(cc * 31 + rr) * 8, cp.y + hash(rr * 17 + cc) * 6, 2.4, 2);
        }
      } else if (dAbove < 0.17 && hash(cc * 57 + rr * 19 + 3) < (0.17 - dAbove) / 0.17 * 0.85){
        /* ragged bite marks reaching up from the line */
        ctx.fillStyle = hash(cc * 41 + rr * 7) < 0.5 ? SCORCH : '#241C14';
        biteQuad(cc, rr, 0.35 + 0.55 * hash(cc * 13 + rr * 29));
      }
    }
  }

  /* finial */
  ctx.fillStyle = '#3A3630';
  ctx.beginPath();
  ctx.moveTo(poleX, poleTop - H * 0.018);
  ctx.lineTo(poleX + 4, poleTop + 2); ctx.lineTo(poleX - 4, poleTop + 2);
  ctx.closePath(); ctx.fill();

  /* flames along the burn line */
  var flick = Math.floor(t * 7);
  for (var fc = 0; fc < COLS; fc++){
    var fb2 = colBurn(fc, bf);
    if (fb2 <= 0.015) continue;
    if (hash(fc * 7 + flick * 3 + 5) < 0.18) continue;   // gaps in the flame front
    var rowF = ROWS * (1 - fb2);
    var r0 = Math.floor(rowF), frac = rowF - r0;
    if (r0 < 0 || r0 >= ROWS) continue;
    var pA = pts[fc][r0], pB = pts[fc + 1][r0], pA2 = pts[fc][r0 + 1], pB2 = pts[fc + 1][r0 + 1];
    var jo = (hash(fc * 19 + flick) - 0.5) * 0.44;       // tongue centre wanders in its column
    var bx = lerp(lerp(pA.x, pA2.x, frac), lerp(pB.x, pB2.x, frac), 0.5 + jo);
    var by = lerp(lerp(pA.y, pA2.y, frac), lerp(pB.y, pB2.y, frac), 0.5 + jo);
    var cw = Math.abs(pB.x - pA.x) * (0.62 + 0.5 * hash(fc * 29 + flick * 11));
    var fh = (H * 0.016 + H * 0.034 * F) * (0.32 + 1.35 * hash(fc * 13 + flick * 7 + 1));
    ctx.fillStyle = FLAME;
    ctx.beginPath();
    ctx.moveTo(bx - cw * 0.5, by + 2);
    ctx.lineTo(bx - cw * 0.12, by - fh * 0.55);
    ctx.lineTo(bx + cw * 0.08, by - fh);
    ctx.lineTo(bx + cw * 0.3, by - fh * 0.4);
    ctx.lineTo(bx + cw * 0.5, by + 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = EMBER;
    ctx.beginPath();
    ctx.moveTo(bx - cw * 0.26, by + 1);
    ctx.lineTo(bx, by - fh * 0.55);
    ctx.lineTo(bx + cw * 0.26, by + 1);
    ctx.closePath(); ctx.fill();
  }

  /* embers lifting off the line */
  var nEmb = Math.round(6 + 22 * F);
  for (var ei = 0; ei < nEmb; ei++){
    var per = 2.2 + 2.8 * hash(ei * 3 + 77);
    var age = (t * (0.8 + 0.5 * hash(ei * 11 + 3)) + hash(ei * 5 + 19) * 7) % per;
    var ecol = Math.floor(hash(ei * 23 + 31) * COLS);
    var eb = colBurn(ecol, bf);
    if (eb <= 0.02) continue;
    var erow = ROWS * (1 - eb);
    var er0 = clamp(Math.floor(erow), 0, ROWS - 1), efrac = clamp(erow - er0, 0, 1);
    var ep1 = pts[ecol][er0], ep2 = pts[ecol][er0 + 1];
    var ex = lerp(ep1.x, ep2.x, efrac) + Math.sin(age * 3 + ei) * 5 + age * 7 * Wd;
    var ey = lerp(ep1.y, ep2.y, efrac) - age * (26 + 34 * hash(ei * 7 + 43));
    var ea = clamp(1 - age / per, 0, 1) * 0.9;
    ctx.fillStyle = (ei % 3 === 0) ? 'rgba(232,106,44,' + ea.toFixed(3) + ')' : 'rgba(194,59,46,' + ea.toFixed(3) + ')';
    ctx.fillRect(ex, ey, 2.6, 2.6);
  }

  /* rain: grey wash + streaks, cycle [70,80) — erases the trails, nothing else */
  if (cyc >= 70 && cyc < 80){
    var rw = cyc < 72 ? (cyc - 70) / 2 : (cyc > 78 ? (80 - cyc) / 2 : 1);
    ctx.fillStyle = 'rgba(138,141,148,' + (0.34 * rw).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(70,74,80,' + (0.5 * rw).toFixed(3) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (var si = 0; si < 90; si++){
      var sx = ((hash(si * 3 + 5) * (W + 120) + t * 130 * (0.7 + hash(si))) % (W + 120)) - 60;
      var sy = (hash(si * 7 + 9) * H + t * 520 * (0.7 + hash(si * 13))) % (H + 40) - 20;
      ctx.moveTo(sx, sy); ctx.lineTo(sx - 5, sy + 13);
    }
    ctx.stroke();
  }
}

/* ---------- time: fixed-phase first frame, then anchored elapsed ---------- */
var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
function nowSec(){
  var n = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  return (n - startStamp) / 1000;
}
function pieceTime(){ return T0 + nowSec(); }

draw(T0);   // synchronous deterministic first frame
if (typeof requestAnimationFrame === 'function'){
  var loop = function(){
    draw(pieceTime());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

/* ---------- scream input: press-and-hold anywhere ---------- */
function evDown(){
  if (holding) return;
  holding = true;
  holds.push({ start: pieceTime(), end: Infinity });
}
function evUp(){
  if (!holding) return;
  holding = false;
  for (var k = holds.length - 1; k >= 0; k--){
    if (!isFinite(holds[k].end)){ holds[k].end = pieceTime(); break; }
  }
}
canvas.addEventListener('pointerdown', evDown);
window.addEventListener('pointerup', evUp);
window.addEventListener('pointercancel', evUp);
canvas.addEventListener('touchstart', function(e){ e.preventDefault(); evDown(); }, { passive: false });
window.addEventListener('touchend', evUp);
})();
</script>
</body>
</html>
