<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lurkin' Hard</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0B0D; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.1244 "Lurkin' Hard" - Adan De La Garza study block ADG5.
  // Someone else's abandoned camera roll, zine-flipped: procedural found
  // snapshots with amateur wrongness (blur, red-eye, light leaks, a thumb),
  // sprocket-holed like 35mm film, every 8th frame blank leader, and a
  // garbage-bag counter that never decreases.

  var T0 = 10;              // fixed first-frame phase (piece seconds)
  var DUR = 4.5;            // seconds per frame (never longer than 6)
  var FLIP = 0.45;          // zine-flip transition, seconds
  var BASE_SALT = 1244;

  var AMBER = '#C9A86A';    // film-leader amber
  var SPROCKET = '#F5F2E9'; // sprocket white
  var SEPIA = '#C4A87E';    // snapshot sepia
  var LEAK = '#B06A8A';     // light-leak magenta
  var REDEYE = '#C23B2E';   // red-eye red
  var BAG = '#0B0B0D';      // bag black
  var SKIN = '#C89A78';     // the thumb

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- deterministic hash ----------
  function ihash(a, b) {
    var x = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ 0x9E3779B9;
    x = Math.imul(x ^ (x >>> 13), 1274126177);
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }
  function mod8(n) { return ((n % 8) + 8) % 8; }

  // ---------- roll state (events only; frame one has none) ----------
  var salt = 0;             // double-tap reseed count
  var curIdx = 2;           // settled frame at T0 (the pool)
  var trans = null;         // {from,to,start,dir} while flipping
  var nextAuto = 13.5;      // piece-time of next auto flip
  var lastT = T0;

  // ---------- per-frame generation ----------
  // type by index%8: 0 dog, 1 party, 2 pool, 3 cake, 4 landscape,
  // 5 interior, 6 thumb-frame, 7 BLANK leader.
  function frameSpec(idx) {
    var s = salt * 131;
    var type = mod8(idx);
    var f = {
      type: type,
      tilt: (ihash(idx, 901 + s) - 0.5) * 0.07 * (ihash(idx, 902 + s) < 0.55 ? 1 : 0),
      blur: ihash(idx, 903 + s) < 0.38,
      blowout: ihash(idx, 904 + s) < 0.34,
      leak: ihash(idx, 905 + s) < 0.45 ? (ihash(idx, 906 + s) < 0.5 ? 'tr' : 'bl') : null,
      redeye: ihash(idx, 907 + s) < 0.5,
      thumb: ihash(idx, 908 + s) < 0.3,
      thumbCorner: Math.floor(ihash(idx, 909 + s) * 4),
      seed: idx * 7 + s
    };
    if (type === 3) f.thumb = true;      // the thumb is mandatory at least once per roll
    if (type === 0) f.blur = true;       // the dog is always blurry
    if (type === 7) { f.thumb = false; f.blur = false; f.blowout = false; f.leak = null; }
    return f;
  }

  // ---------- unit-space drawing helpers ----------
  function R(x, y, w, h, c, a) {
    ctx.globalAlpha = a === undefined ? 1 : a;
    ctx.fillStyle = c;
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 1;
  }
  function P(pts, c, a) {
    ctx.globalAlpha = a === undefined ? 1 : a;
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  function C(x, y, r, c, a) { // circle: own path, moveTo first (house arc discipline)
    ctx.globalAlpha = a === undefined ? 1 : a;
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  function L(x1, y1, x2, y2, c, w, a) {
    ctx.globalAlpha = a === undefined ? 1 : a;
    ctx.strokeStyle = c;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function blob(cx, cy, r, seed, c, a) { // irregular thumb-ish blob
    var pts = [];
    var n = 11;
    for (var i = 0; i < n; i++) {
      var ang = (i / n) * Math.PI * 2;
      var rr = r * (0.78 + ihash(seed, 300 + i) * 0.4);
      pts.push([cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr * 0.88]);
    }
    P(pts, c, a);
  }

  // ---------- scenes (unit space 0..1 x 0..1) ----------
  function sceneDog(f) {
    R(0, 0, 1, 0.62, '#D8BE93');
    R(0, 0.62, 1, 0.38, '#A8895E');
    C(0.84, 0.16, 0.07, '#EED9A8', 0.9);
    L(0, 0.34, 1, 0.34, '#8A6F47', 0.008);
    L(0, 0.44, 1, 0.44, '#8A6F47', 0.008);
    for (var i = 0; i < 7; i++) L(0.06 + i * 0.15, 0.28, 0.06 + i * 0.15, 0.5, '#8A6F47', 0.01);
    // the dog
    var dc = '#6E5643';
    ctx.save();
    ctx.translate(0.47, 0.56); ctx.scale(1, 0.6);
    C(0, 0, 0.17, dc);
    ctx.restore();
    R(0.36, 0.60, 0.035, 0.16, dc); R(0.42, 0.60, 0.035, 0.16, dc);
    R(0.52, 0.60, 0.035, 0.16, dc); R(0.58, 0.60, 0.035, 0.16, dc);
    C(0.635, 0.47, 0.078, dc);
    P([[0.60, 0.41], [0.655, 0.395], [0.65, 0.47]], '#543F2C');
    R(0.685, 0.475, 0.055, 0.028, '#543F2C');
    L(0.315, 0.52, 0.25, 0.42, dc, 0.02);
    R(0.575, 0.50, 0.028, 0.075, '#B04A3A', 0.9); // collar
    if (f.redeye) { C(0.648, 0.462, 0.011, REDEYE); C(0.622, 0.462, 0.011, REDEYE); }
    for (var g = 0; g < 16; g++) {
      var gx = ihash(f.seed, 400 + g), gy = 0.66 + ihash(f.seed, 420 + g) * 0.3;
      L(gx, gy, gx + 0.008, gy - 0.03, '#7A5F36', 0.005);
    }
  }

  function sceneParty(f) {
    R(0, 0, 1, 0.72, '#4A3B2E');
    R(0, 0.72, 1, 0.28, '#3A2C20');
    // bunting
    var cols = ['#C4A87E', '#C9A86A', '#B06A8A'];
    for (var sIdx = 0; sIdx < 2; sIdx++) {
      var by = 0.07 + sIdx * 0.09;
      for (var i = 0; i < 9; i++) {
        var x0 = i / 9, x1 = (i + 1) / 9, xm = (x0 + x1) / 2;
        var sag = by + 0.045;
        L(x0, by + (i % 2) * 0.004, xm, sag, '#2E2118', 0.005);
        L(xm, sag, x1, by + ((i + 1) % 2) * 0.004, '#2E2118', 0.005);
        P([[xm - 0.026, sag], [xm + 0.026, sag], [xm, sag + 0.055]], cols[(i + sIdx) % 3], 0.9);
      }
    }
    // table + cups
    R(0.18, 0.64, 0.64, 0.035, '#8A6F47');
    R(0.24, 0.585, 0.03, 0.055, '#E8DCC2'); R(0.47, 0.575, 0.034, 0.065, '#B06A8A');
    R(0.70, 0.59, 0.03, 0.05, '#E8DCC2');
    // figures
    var fx = [0.16, 0.36, 0.60, 0.82];
    for (var j = 0; j < 4; j++) {
      var px = fx[j] + (ihash(f.seed, 430 + j) - 0.5) * 0.03;
      var ph = 0.40 + ihash(f.seed, 440 + j) * 0.05;
      P([[px - 0.055, 0.98], [px + 0.055, 0.98], [px + 0.038, ph + 0.09], [px - 0.038, ph + 0.09]], '#241A12');
      C(px, ph, 0.048, '#241A12');
      if (f.redeye) { C(px - 0.016, ph - 0.005, 0.009, REDEYE); C(px + 0.016, ph - 0.005, 0.009, REDEYE); }
    }
  }

  function scenePool(f) {
    R(0, 0, 1, 0.20, '#6E5568');            // dusk sky bands
    R(0, 0.20, 1, 0.12, '#9A6A5E');
    R(0, 0.32, 1, 0.11, '#C98A5A');
    R(0.06, 0.17, 0.88, 0.25, '#453248');    // motel block
    for (var i = 0; i < 5; i++) {
      var lit = i !== 2;
      R(0.12 + i * 0.17, 0.235, 0.075, 0.10, lit ? '#E8C87A' : '#2E2430', lit ? 0.95 : 1);
    }
    R(0.06, 0.155, 0.88, 0.018, '#2E2430');
    R(0, 0.42, 1, 0.09, '#B09A72');         // deck
    R(0.11, 0.51, 0.78, 0.37, '#8A7A5C');   // pool rim
    R(0.135, 0.535, 0.73, 0.32, '#7E968C'); // water
    R(0.17, 0.60, 0.42, 0.022, '#9AB5A8', 0.55);
    R(0.30, 0.70, 0.50, 0.02, '#9AB5A8', 0.4);
    R(0.20, 0.80, 0.34, 0.018, '#9AB5A8', 0.45);
    L(0.135, 0.695, 0.865, 0.695, '#5F7A6E', 0.006); // lane line
    R(0.76, 0.465, 0.17, 0.02, '#D8CDB4');  // diving board
    R(0.90, 0.485, 0.02, 0.05, '#8A7A5C');
    // figure at the edge
    C(0.185, 0.375, 0.026, '#241A20');
    R(0.172, 0.40, 0.026, 0.115, '#241A20');
    // scraggly palm
    L(0.055, 0.51, 0.05, 0.36, '#3A2C20', 0.012);
    for (var p = 0; p < 5; p++) {
      var a = -0.4 - p * 0.42;
      L(0.05, 0.36, 0.05 + Math.cos(a) * 0.085, 0.36 + Math.sin(a) * 0.06, '#3A2C20', 0.008);
    }
  }

  function sceneCake(f) {
    R(0, 0, 1, 0.68, '#D5BE93');
    R(0, 0.68, 1, 0.32, '#8A6F47');
    R(0.10, 0.665, 0.80, 0.03, '#6E5643');  // table top
    // startled figure behind
    C(0.17, 0.40, 0.05, '#54382A');
    P([[0.125, 0.98], [0.215, 0.98], [0.20, 0.46], [0.14, 0.46]], '#54382A');
    L(0.145, 0.50, 0.075, 0.36, '#54382A', 0.016);
    L(0.195, 0.50, 0.265, 0.35, '#54382A', 0.016);
    // cake: bottom layer steady
    R(0.40, 0.545, 0.26, 0.12, '#E8DCC2');
    R(0.40, 0.545, 0.26, 0.022, '#B06A8A', 0.75);
    // mid layer slid off, tilted
    ctx.save();
    ctx.translate(0.565, 0.50); ctx.rotate(0.16);
    R(-0.10, -0.045, 0.20, 0.09, '#E8DCC2');
    R(-0.10, -0.045, 0.20, 0.018, '#B06A8A', 0.75);
    ctx.restore();
    // top layer fallen on the table
    ctx.save();
    ctx.translate(0.755, 0.635); ctx.rotate(-0.5);
    R(-0.075, -0.035, 0.15, 0.07, '#E8DCC2');
    ctx.restore();
    // candles: standing, leaning, fallen
    var cx = [0.45, 0.52, 0.60];
    for (var i = 0; i < 3; i++) {
      L(cx[i], 0.545, cx[i] + (i - 1) * 0.008, 0.475, '#E8E2D4', 0.009);
      C(cx[i] + (i - 1) * 0.008, 0.462, 0.011, '#E8862C');
    }
    L(0.70, 0.662, 0.775, 0.662, '#E8E2D4', 0.009);
    C(0.782, 0.655, 0.010, '#E8862C');
    // icing smear on the table
    P([[0.63, 0.668], [0.74, 0.668], [0.70, 0.685], [0.65, 0.685]], '#E8DCC2', 0.8);
  }

  function sceneLandscape(f) {
    R(0, 0, 1, 0.55, '#DCC79C');
    C(0.20, 0.16, 0.06, '#EED9A8', 0.95);
    P([[0, 0.42], [0.22, 0.30], [0.45, 0.40], [0.68, 0.31], [1, 0.43], [1, 0.62], [0, 0.62]], '#A8895E');
    P([[0, 0.52], [0.30, 0.44], [0.58, 0.53], [1, 0.46], [1, 1], [0, 1]], '#8A6F47');
    P([[0.44, 1], [0.485, 0.60], [0.525, 0.60], [0.58, 1]], '#6E5A40'); // road
    L(0.487, 0.97, 0.503, 0.64, '#E8DCC2', 0.008);
    // lopsided signpost
    L(0.80, 0.86, 0.80, 0.55, '#543F2C', 0.014);
    ctx.save();
    ctx.translate(0.80, 0.585); ctx.rotate(-0.09);
    R(-0.085, -0.026, 0.17, 0.052, '#C4A87E');
    ctx.restore();
    blob(0.13, 0.60, 0.05, f.seed + 5, '#7A5F36', 0.9);
    blob(0.90, 0.66, 0.065, f.seed + 9, '#7A5F36', 0.9);
  }

  function sceneInterior(f) {
    R(0, 0, 1, 0.70, '#B89A6E');
    R(0, 0.70, 1, 0.30, '#8A6F47');
    R(0.07, 0.12, 0.24, 0.34, '#E8D9AE');   // window light
    L(0.19, 0.12, 0.19, 0.46, '#6E5643', 0.01);
    L(0.07, 0.29, 0.31, 0.29, '#6E5643', 0.01);
    // crooked picture
    ctx.save();
    ctx.translate(0.55, 0.24); ctx.rotate(0.07);
    R(-0.09, -0.07, 0.18, 0.14, '#E8DCC2');
    blob(0, 0.01, 0.045, f.seed + 21, '#7A8699', 0.9);
    ctx.restore();
    // couch
    R(0.30, 0.60, 0.46, 0.20, '#7A4A3A');
    R(0.27, 0.52, 0.10, 0.28, '#6E4234');
    R(0.73, 0.52, 0.10, 0.28, '#6E4234');
    L(0.45, 0.62, 0.45, 0.79, '#5F382C', 0.008);
    L(0.61, 0.62, 0.61, 0.79, '#5F382C', 0.008);
    // cat asleep on the couch
    ctx.save();
    ctx.translate(0.565, 0.575); ctx.scale(1, 0.55);
    C(0, 0, 0.055, '#2E2118');
    ctx.restore();
    C(0.618, 0.545, 0.024, '#2E2118');
    P([[0.612, 0.528], [0.606, 0.512], [0.622, 0.522]], '#2E2118');
    // lamp
    L(0.90, 0.80, 0.90, 0.42, '#543F2C', 0.01);
    P([[0.845, 0.42], [0.955, 0.42], [0.925, 0.30], [0.875, 0.30]], '#E3C447', 0.85);
  }

  function sceneThumbFrame(f) {
    R(0, 0, 1, 0.45, '#9A8A76');            // dim street behind the thumb
    R(0, 0.45, 1, 0.55, '#77685A');
    R(0.60, 0.10, 0.16, 0.35, '#6E5F52');
    R(0.80, 0.16, 0.14, 0.29, '#6E5F52');
    R(0.645, 0.16, 0.03, 0.05, '#C9A86A', 0.7);
    L(0, 0.45, 1, 0.45, '#57493C', 0.01);
    // the thumb itself, huge, from bottom-left
    blob(0.26, 0.98, 0.52, f.seed + 31, SKIN, 1);
    ctx.save();
    ctx.translate(0.335, 0.60); ctx.rotate(0.5); ctx.scale(1, 1.5);
    C(0, 0, 0.075, '#DDB894', 0.95);        // thumbnail
    ctx.restore();
    L(0.10, 0.86, 0.30, 0.80, '#A87A58', 0.008); // knuckle creases
    L(0.13, 0.92, 0.33, 0.87, '#A87A58', 0.008);
  }

  function drawScene(f) {
    switch (f.type) {
      case 0: sceneDog(f); break;
      case 1: sceneParty(f); break;
      case 2: scenePool(f); break;
      case 3: sceneCake(f); break;
      case 4: sceneLandscape(f); break;
      case 5: sceneInterior(f); break;
      case 6: sceneThumbFrame(f); break;
      default: break;
    }
  }

  // ---------- one photo frame, drawn at device rect (x,y,w,h) ----------
  function drawPhoto(idx, x, y, w, h) {
    var f = frameSpec(idx);
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    if (f.type === 7) {
      // blank leader: amber, faint streaks, speckle
      R(x, y, w, h, AMBER);
      ctx.save();
      ctx.translate(x, y); ctx.scale(w, h);
      for (var st = 0; st < 6; st++) {
        R(ihash(idx, 500 + st), 0, 0.012, 1, '#8A6F47', 0.06);
      }
      for (var sp = 0; sp < 26; sp++) {
        R(ihash(idx, 520 + sp), ihash(idx, 540 + sp), 0.006, 0.006, '#5F4A2E', 0.10);
      }
      ctx.restore();
      ctx.restore();
      return;
    }
    ctx.translate(x, y);
    // crooked horizon: rotate scene a touch, scaled up to cover corners
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(f.tilt);
    ctx.scale(1.07, 1.07);
    ctx.translate(-w / 2, -h / 2);
    ctx.scale(w, h);
    drawScene(f);
    if (f.blur) { // motion blur: offset ghost redraw of the whole scene
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.translate(0.012, -0.005);
      drawScene(f);
      ctx.restore();
    }
    ctx.restore();
    // flat unit-space overlays
    ctx.save();
    ctx.scale(w, h);
    if (f.leak === 'tr') P([[1, 0], [0.52, 0], [1, 0.5]], LEAK, 0.32);
    if (f.leak === 'bl') P([[0, 1], [0, 0.55], [0.45, 1]], AMBER, 0.30);
    if (f.blowout) blob(0.30 + ihash(idx, 910 + salt * 131) * 0.4, 0.26, 0.20, idx + salt, '#FFFFFF', 0.38);
    if (f.thumb && f.type !== 6) {
      var corners = [[0.02, 0.98], [0.98, 0.98], [0.02, 0.02], [0.98, 0.02]];
      var cn = corners[f.thumbCorner];
      blob(cn[0], cn[1], 0.30, idx * 3 + salt, SKIN, 0.96);
      L(cn[0] + (cn[0] < 0.5 ? 0.05 : -0.13), cn[1] + (cn[1] < 0.5 ? 0.05 : -0.05),
        cn[0] + (cn[0] < 0.5 ? 0.16 : -0.05), cn[1] + (cn[1] < 0.5 ? 0.03 : -0.10), '#A87A58', 0.006);
    }
    // vignette corners + grain
    P([[0, 0], [0.16, 0], [0, 0.16]], '#000000', 0.10);
    P([[1, 0], [0.84, 0], [1, 0.16]], '#000000', 0.10);
    P([[0, 1], [0.16, 1], [0, 0.84]], '#000000', 0.10);
    P([[1, 1], [0.84, 1], [1, 0.84]], '#000000', 0.10);
    for (var g = 0; g < 34; g++) {
      R(ihash(idx, 600 + g), ihash(idx, 640 + g), 0.005, 0.007, '#2E2118', 0.07);
    }
    ctx.restore();
    ctx.restore();
  }

  // ---------- layout ----------
  function isPhone(W, H) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width, window.screen.height);
    }
    return sw < 700 || H > W * 1.15;
  }
  function layout(W, H) {
    var phone = isPhone(W, H);
    var fw = phone ? W * 0.94 : Math.min(W * 0.86, H * 1.02);
    var fh = fw / 1.5;
    var bandH = Math.max(14, fh * 0.15);
    var fx = (W - fw) / 2;
    var totalH = fh + bandH * 2;
    var fy = (H - totalH) / 2 + bandH;
    return { phone: phone, fw: fw, fh: fh, bandH: bandH, fx: fx, fy: fy, W: W, H: H };
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  function drawChrome(Lay, dispIdx) {
    // sprocket bands
    ctx.fillStyle = '#14120E';
    ctx.fillRect(Lay.fx - 6, Lay.fy - Lay.bandH, Lay.fw + 12, Lay.bandH);
    ctx.fillRect(Lay.fx - 6, Lay.fy + Lay.fh, Lay.fw + 12, Lay.bandH);
    var hw = Math.max(16, Lay.fw * 0.035), hh = Lay.bandH * 0.52;
    var n = Math.max(6, Math.floor(Lay.fw / (hw * 1.9)));
    var step = Lay.fw / n;
    ctx.fillStyle = SPROCKET;
    for (var i = 0; i < n; i++) {
      var hx = Lay.fx + i * step + (step - hw) / 2;
      rrect(hx, Lay.fy - Lay.bandH + (Lay.bandH - hh) / 2, hw, hh, 3); ctx.fill();
      rrect(hx, Lay.fy + Lay.fh + (Lay.bandH - hh) / 2, hw, hh, 3); ctx.fill();
    }
    // frame number (film-edge print), bottom-left in the leader margin
    var fs = Math.max(11, Math.min(20, Lay.W * 0.016));
    ctx.fillStyle = AMBER;
    ctx.font = fs + 'px "Courier New", monospace';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    var label = String(((dispIdx % 64) + 64) % 64).padStart(2, '0') + (mod8(dispIdx) % 2 ? 'A' : '');
    ctx.fillText(label, Lay.fx, Lay.fy + Lay.fh + Lay.bandH + 8);
    // the counter: never decreases, never changes
    ctx.textAlign = 'right';
    ctx.fillText('garbage bag: 214 rolls unprocessed', Lay.fx + Lay.fw, Lay.fy + Lay.fh + Lay.bandH + 8);
    ctx.textAlign = 'left';
  }

  // ---------- state update + main draw ----------
  function update(rt) {
    if (trans) {
      if (rt >= trans.start + FLIP) {
        curIdx = trans.to;
        trans = null;
        nextAuto = rt + DUR;
      }
    }
    if (!trans && rt >= nextAuto) {
      trans = { from: curIdx, to: curIdx + 1, start: nextAuto, dir: 1 };
      if (rt >= trans.start + FLIP) { curIdx = trans.to; trans = null; nextAuto = rt + DUR; }
    }
  }
  function draw(rt) {
    lastT = rt;
    update(rt);
    var W = canvas.width, H = canvas.height;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var Lay = layout(W, H);
    ctx.fillStyle = BAG;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath();
    ctx.rect(Lay.fx, Lay.fy, Lay.fw, Lay.fh);
    ctx.clip();
    if (trans) {
      var p = Math.min(1, Math.max(0, (rt - trans.start) / FLIP));
      p = Math.floor(p * 6) / 6; // stepped at ~13fps of the flip
      var e = p * p * (3 - 2 * p);
      var travel = (Lay.fw + 26) * trans.dir;
      var sk = Math.sin(p * Math.PI) * 0.09 * trans.dir;
      ctx.save();
      ctx.transform(1, 0, -sk, 1, sk * (Lay.fy + Lay.fh / 2), 0);
      drawPhoto(trans.from, Lay.fx - e * travel, Lay.fy, Lay.fw, Lay.fh);
      ctx.restore();
      ctx.save();
      ctx.transform(1, 0, sk, 1, -sk * (Lay.fy + Lay.fh / 2), 0);
      drawPhoto(trans.to, Lay.fx + (1 - e) * travel, Lay.fy, Lay.fw, Lay.fh);
      ctx.restore();
      // seam shadow
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      var seamX = trans.dir > 0 ? Lay.fx + (1 - e) * travel - 3 : Lay.fx - e * travel + Lay.fw - 3;
      ctx.fillRect(seamX, Lay.fy, 6, Lay.fh);
    } else {
      drawPhoto(curIdx, Lay.fx, Lay.fy, Lay.fw, Lay.fh);
    }
    ctx.restore();
    drawChrome(Lay, trans ? trans.to : curIdx);
  }

  // ---------- sizing ----------
  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 720; h = 720; }
    canvas.width = Math.round(w);
    canvas.height = Math.round(h);
    draw(lastT);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // ---------- interaction: swipe flips the zine; double-tap reseeds ----------
  var downPos = null, lastTapT = -1e9, lastTapPos = null;
  function pieceNow() { return lastT; }
  function toLocal(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    return r;
  }
  function flipTo(to, dir) {
    var now = pieceNow();
    if (trans) { curIdx = trans.to; trans = null; }
    trans = { from: curIdx, to: to, start: now, dir: dir };
    nextAuto = now + FLIP + DUR;
  }
  canvas.addEventListener('pointerdown', function (e) { downPos = toLocal(e); });
  canvas.addEventListener('pointerup', function (e) {
    if (!downPos) return;
    var up = toLocal(e);
    var dx = up.x - downPos.x;
    var now = pieceNow();
    if (Math.abs(dx) >= 45) {
      if (dx < 0) flipTo((trans ? trans.to : curIdx) + 1, 1);
      else flipTo((trans ? trans.to : curIdx) - 1, -1);
      lastTapPos = null;
    } else {
      if (lastTapPos && now - lastTapT < 0.45 && Math.abs(up.x - lastTapPos.x) < 44 && Math.abs(up.y - lastTapPos.y) < 44) {
        salt++;
        lastTapT = -1e9; lastTapPos = null;
      } else { lastTapT = now; lastTapPos = up; }
    }
    downPos = null;
  });

  // ---------- run ----------
  resize();
  draw(T0);
  var startStamp = null;
  function loop(now) {
    if (startStamp === null) startStamp = now;
    draw(T0 + (now - startStamp) / 1000);
    requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
