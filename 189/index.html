<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.189 Crank Cut</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#111114; }
  canvas { display:block; touch-action:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font:12px system-ui, sans-serif; color:#9A9AA2; opacity:0.5;
    pointer-events:none; letter-spacing:0.04em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tap to change the rate</div>
<script>
(function () {
'use strict';
// No.189 Crank Cut (Eugene Sargent). His fabrication rig, drawn
// alongside its product: a crankshaft turns at exactly the correct
// rate, one revolution per steel coil, the coils stacking into a
// Double Triamond of interlocking triangular rings in front of a
// dark gyroid silhouette. At 45 seconds the cutting stops and
// hexastix rods slide through the gyroid's hexagonal holes until
// the two sculptures interlock; then everything dissolves back to
// the bare rig. Tap toggles between the working rate and a slow
// inspection rate; the crank never varies otherwise.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#111114', STEEL = '#B9BEC7', HOT = '#FF7A1A', IRON = '#4A4E55', FLAME = '#FFD166', GHOST = '#1C1D22';
var W = 0, H = 0, phone = false;
var seed = 189189;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function ease(k) { return k * k * (3 - 2 * k); }

// ---- ring geometry: rounded triangle as a sampled closed polyline --
function ringPoints(cx, cy, R, rot) {
  var V = [];
  for (var k = 0; k < 3; k++) {
    var a = rot + k * Math.PI * 2 / 3 - Math.PI / 2;
    V.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
  }
  var pts = [], cr = 0.26;
  for (k = 0; k < 3; k++) {
    var prev = V[(k + 2) % 3], cur = V[k], next = V[(k + 1) % 3];
    var a1 = [cur[0] + (prev[0] - cur[0]) * cr, cur[1] + (prev[1] - cur[1]) * cr];
    var b1 = [cur[0] + (next[0] - cur[0]) * cr, cur[1] + (next[1] - cur[1]) * cr];
    // corner arc (quadratic, control at the vertex)
    for (var s2 = 0; s2 < 6; s2++) {
      var t = s2 / 6, u = 1 - t;
      pts.push([u * u * a1[0] + 2 * u * t * cur[0] + t * t * b1[0],
                u * u * a1[1] + 2 * u * t * cur[1] + t * t * b1[1]]);
    }
    // straight run to the next corner's start
    var na = [next[0] + (cur[0] - next[0]) * cr, next[1] + (cur[1] - next[1]) * cr];
    for (var s3 = 1; s3 <= 8; s3++) {
      var t2 = s3 / 8;
      pts.push([b1[0] + (na[0] - b1[0]) * t2, b1[1] + (na[1] - b1[1]) * t2]);
    }
  }
  return pts;
}
function strokePts(pts, frac, closeIt) {
  var n = pts.length, m = Math.max(2, Math.floor(frac * n));
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < m; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (closeIt && frac >= 1) ctx.closePath();
  ctx.stroke();
  return pts[Math.min(m - 1, n - 1)];
}

// ---- gyroid ghost: perforated silhouette field -----------------------
var ghostCells = [];
function buildGhost() {
  ghostCells = [];
  var step = Math.max(16, Math.min(W, H) * 0.026);
  for (var y = step / 2; y < H; y += step) {
    for (var x = step / 2; x < W; x += step) {
      var f = Math.sin(x * 0.016) * Math.cos(y * 0.019) + Math.sin(y * 0.010 + 1.3) * Math.cos(x * 0.012 + 0.5);
      if (Math.abs(f) < 0.17) ghostCells.push([x, y, step * 0.96]);
    }
  }
}

// ---- layout ------------------------------------------------------------
var slots = [], holes = [], ringR = 40;
function layout() {
  ringR = Math.min(W, H) * 0.075;
  var fx = W * 0.665, fy = H * 0.44;
  var offs = [[0, 0], [1.55, 0], [-1.55, 0], [0.78, 1.34], [-0.78, 1.34], [0.78, -1.34], [-0.78, -1.34]];
  slots = offs.map(function (o, i) {
    return { x: fx + o[0] * ringR, y: fy + o[1] * ringR, rot: (i % 2 ? Math.PI : 0) + (i * 0.35) };
  });
  holes = [];
  for (var k = 0; k < 4; k++) {
    holes.push({ x: fx + (k - 1.5) * ringR * 1.45, y: fy + (k % 2 ? 1 : -1) * ringR * 2.6 });
  }
}
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
  layout();
  buildGhost();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction: tap toggles the rate --------------------------------
var speed = 1, downX = 0, downY = 0, downAt = 0;
canvas.addEventListener('pointerdown', function (e) { downX = e.clientX; downY = e.clientY; downAt = e.timeStamp; });
canvas.addEventListener('pointerup', function (e) {
  var moved = Math.sqrt((e.clientX - downX) * (e.clientX - downX) + (e.clientY - downY) * (e.clientY - downY));
  if (moved < 8 && e.timeStamp - downAt < 350) speed = speed === 1 ? 0.25 : 1;
});

// ---- draw ---------------------------------------------------------------
var rigT = 33, lastNow = -1; // frame one: mid production, five rings laid, sixth half cut
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && now > 0) rigT += Math.min(0.05, (now - lastNow) / 1000) * speed;
  lastNow = now;
  var rt = rigT % 60;
  var theta = rigT * Math.PI * 2 / 6; // one revolution per 6 rig seconds

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  // gyroid ghost behind everything
  ctx.fillStyle = GHOST;
  for (var gi = 0; gi < ghostCells.length; gi++) {
    var gc = ghostCells[gi];
    ctx.fillRect(gc[0] - gc[2] / 2, gc[1] - gc[2] / 2, gc[2], gc[2]);
  }

  // field fade for the dissolve
  var fieldA = rt < 57.5 ? 1 : clamp(1 - (rt - 57.5) / 2.5, 0, 1);

  // hexagonal holes punched in the ghost
  for (var hk = 0; hk < holes.length; hk++) {
    var hp = holes[hk], hr = ringR * 0.42;
    ctx.beginPath();
    for (var hv = 0; hv < 6; hv++) {
      var ha = hv * Math.PI / 3 + Math.PI / 6;
      var hx = hp.x + hr * Math.cos(ha), hy = hp.y + hr * Math.sin(ha);
      if (hv === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
    }
    ctx.closePath();
    ctx.fillStyle = GROUND;
    ctx.fill();
    ctx.strokeStyle = GHOST;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // hexastix rods, 45s to 53s, one by one
  if (rt >= 45 && fieldA > 0) {
    var rodLen = W * 0.44, rodH = Math.max(5, Math.min(W, H) * 0.011);
    for (var rk = 0; rk < holes.length; rk++) {
      var rp = clamp((rt - 45 - rk * 2) / 1.6, 0, 1);
      if (rp <= 0) continue;
      var h = holes[rk];
      var tipX = W + 30 - ease(rp) * (W + 30 - (h.x - rodLen * 0.30));
      ctx.globalAlpha = fieldA;
      ctx.fillStyle = STEEL;
      ctx.fillRect(tipX, h.y - rodH / 2, rodLen, rodH);
      // hexagon cap at the leading end
      ctx.fillStyle = IRON;
      ctx.beginPath();
      for (var cv = 0; cv < 6; cv++) {
        var ca = cv * Math.PI / 3;
        var cxp = tipX + rodH * 0.9 * Math.cos(ca), cyp = h.y + rodH * 0.9 * Math.sin(ca);
        if (cv === 0) ctx.moveTo(cxp, cyp); else ctx.lineTo(cxp, cyp);
      }
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // settled and travelling rings
  var completed = rt < 45 ? Math.floor(rt / 6) : 7;
  var chute = { x: W * 0.165, y: H * 0.80 };
  ctx.lineJoin = 'round';
  for (var si = 0; si < completed && si < slots.length; si++) {
    var slot = slots[si], pts = ringPoints(slot.x, slot.y, ringR, slot.rot);
    var age = rt - (si + 1) * 6;
    var px = slot.x, py = slot.y, alpha = fieldA;
    // the just finished ring travels from the chute to its slot
    if (age >= 0 && age < 0.5 && rt < 45) {
      var ek = ease(age / 0.5);
      px = chute.x + (slot.x - chute.x) * ek;
      py = chute.y + (slot.y - chute.y) * ek;
      pts = ringPoints(px, py, ringR, slot.rot);
    }
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = STEEL;
    ctx.lineWidth = ringR * 0.30;
    strokePts(pts, 1, true);
    if (age >= 0 && age < 1 && rt < 45) {
      ctx.globalAlpha = alpha * (1 - age);
      ctx.strokeStyle = HOT;
      ctx.lineWidth = ringR * 0.13;
      strokePts(pts, 1, true);
    }
    ctx.globalAlpha = 1;
  }

  // the rig: posts and crossbar
  ctx.fillStyle = IRON;
  ctx.fillRect(W * 0.055, H * 0.22, Math.max(4, W * 0.008), H * 0.66);
  ctx.fillRect(W * 0.30, H * 0.22, Math.max(4, W * 0.008), H * 0.40);
  ctx.fillRect(W * 0.055, H * 0.22, W * 0.253, Math.max(4, H * 0.009));
  // pipe feed
  ctx.strokeStyle = IRON;
  ctx.lineWidth = Math.max(8, Math.min(W, H) * 0.017);
  ctx.beginPath();
  ctx.moveTo(-6, H * 0.315);
  ctx.lineTo(W * 0.315, H * 0.315);
  ctx.stroke();
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = Math.max(2.5, Math.min(W, H) * 0.005);
  ctx.beginPath();
  ctx.moveTo(-6, H * 0.315 - Math.max(4, Math.min(W, H) * 0.008));
  ctx.lineTo(W * 0.315, H * 0.315 - Math.max(4, Math.min(W, H) * 0.008));
  ctx.stroke();

  // crank wheel
  var wcx = W * 0.165, wcy = H * 0.55, wr = Math.min(W, H) * 0.088;
  ctx.strokeStyle = IRON;
  ctx.lineWidth = Math.max(4, Math.min(W, H) * 0.010);
  ctx.beginPath();
  ctx.arc(wcx, wcy, wr, 0, Math.PI * 2);
  ctx.stroke();
  for (var sp = 0; sp < 3; sp++) {
    var sa = theta + sp * Math.PI * 2 / 3;
    ctx.beginPath();
    ctx.moveTo(wcx, wcy);
    ctx.lineTo(wcx + wr * Math.cos(sa), wcy + wr * Math.sin(sa));
    ctx.stroke();
  }
  var pinA = theta;
  var pinX = wcx + wr * 0.68 * Math.cos(pinA), pinY = wcy + wr * 0.68 * Math.sin(pinA);
  // connecting rod to the torch carriage
  var carX = wcx + Math.cos(theta) * wr * 0.62;
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = Math.max(3, Math.min(W, H) * 0.006);
  ctx.beginPath();
  ctx.moveTo(pinX, pinY);
  ctx.lineTo(carX, H * 0.315);
  ctx.stroke();
  ctx.fillStyle = STEEL;
  ctx.beginPath();
  ctx.arc(pinX, pinY, Math.max(3.5, Math.min(W, H) * 0.008), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = IRON;
  ctx.beginPath();
  ctx.arc(wcx, wcy, Math.max(4, Math.min(W, H) * 0.009), 0, Math.PI * 2);
  ctx.fill();
  // torch on the carriage, flame at the pipe
  ctx.fillStyle = IRON;
  ctx.fillRect(carX - Math.max(4, Math.min(W, H) * 0.007), H * 0.248, Math.max(8, Math.min(W, H) * 0.014), H * 0.058);
  var flick = 0.85 + 0.3 * Math.sin(rigT * 31) * Math.sin(rigT * 17.3);
  var fl = Math.min(W, H) * 0.027 * flick;
  ctx.fillStyle = FLAME;
  ctx.beginPath();
  ctx.moveTo(carX - fl * 0.32, H * 0.307);
  ctx.lineTo(carX + fl * 0.32, H * 0.307);
  ctx.lineTo(carX, H * 0.307 + fl);
  ctx.closePath();
  ctx.fill();
  if (rt < 45) {
    ctx.fillStyle = HOT;
    ctx.globalAlpha = 0.55 + 0.3 * Math.sin(rigT * 23);
    ctx.beginPath();
    ctx.arc(carX, H * 0.315, Math.max(2.5, Math.min(W, H) * 0.005), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // chute stand and the ring being cut
  ctx.fillStyle = IRON;
  ctx.fillRect(chute.x - Math.max(2, W * 0.002), chute.y + ringR * 0.8, Math.max(4, W * 0.005), H * 0.09);
  if (rt < 45 && fieldA > 0) {
    var prog = (rt % 6) / 6;
    var justDone = (rt % 6) < 0.5 && completed > 0;
    if (!justDone) {
      var fpts = ringPoints(chute.x, chute.y, ringR, 0.4);
      ctx.globalAlpha = fieldA;
      ctx.strokeStyle = STEEL;
      ctx.lineWidth = ringR * 0.30;
      var head = strokePts(fpts, Math.max(0.02, prog), false);
      // hot cut at the leading edge, cooling behind it
      ctx.strokeStyle = HOT;
      ctx.lineWidth = ringR * 0.13;
      var tail = Math.max(0, prog - 0.14);
      ctx.beginPath();
      var n = fpts.length, startI = Math.floor(tail * n), endI = Math.floor(prog * n);
      if (endI > startI) {
        ctx.moveTo(fpts[startI][0], fpts[startI][1]);
        for (var hi = startI + 1; hi <= endI && hi < n; hi++) ctx.lineTo(fpts[hi][0], fpts[hi][1]);
        ctx.stroke();
      }
      ctx.fillStyle = HOT;
      ctx.beginPath();
      ctx.arc(head[0], head[1], ringR * 0.10, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
