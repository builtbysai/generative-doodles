<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9093 · Gossamer</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a0c; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var cloth = null;
  var COLS = 44, ROWS = 30;

  function build() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var spacing = Math.min(W, H) / 30;
    var ox = (W - spacing * (COLS - 1)) / 2;
    var oy = H * 0.10;
    cloth = {
      px: new Float32Array(COLS * ROWS),
      py: new Float32Array(COLS * ROWS),
      ox: new Float32Array(COLS * ROWS),
      oy: new Float32Array(COLS * ROWS),
      pinned: new Uint8Array(COLS * ROWS),
      spacing: spacing
    };
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var i = r * COLS + c;
        var x = ox + c * spacing, y = oy + r * spacing;
        cloth.px[i] = x; cloth.py[i] = y;
        cloth.ox[i] = x; cloth.oy[i] = y;
        if (r === 0) cloth.pinned[i] = 1;
      }
    }
  }

  var pointer = { x: -9999, y: -9999, dx: 0, dy: 0, down: false, lx: 0, ly: 0 };

  function onMove(x, y) {
    if (pointer.lx === 0 && pointer.ly === 0) { pointer.lx = x; pointer.ly = y; }
    pointer.dx = x - pointer.lx; pointer.dy = y - pointer.ly;
    pointer.lx = x; pointer.ly = y;
    pointer.x = x; pointer.y = y;
  }
  canvas.addEventListener('pointerdown', function (e) {
    pointer.down = true; pointer.lx = e.clientX; pointer.ly = e.clientY;
    onMove(e.clientX, e.clientY);
    // pluck: sharp impulse under the finger
    disturb(e.clientX, e.clientY, 14, 260);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
  function release(e) {
    pointer.down = false; pointer.dx = 0; pointer.dy = 0;
    pointer.x = -9999; pointer.y = -9999; pointer.lx = 0; pointer.ly = 0;
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  function disturb(cx, cy, radius, strength) {
    var r2 = radius * radius;
    for (var i = 0; i < COLS * ROWS; i++) {
      var dx = cloth.px[i] - cx, dy = cloth.py[i] - cy;
      var d2 = dx * dx + dy * dy;
      if (d2 < r2 && d2 > 1) {
        var d = Math.sqrt(d2);
        var f = (1 - d / radius) * strength / d;
        cloth.px[i] += dx * f * 0.05;
        cloth.py[i] += dy * f * 0.05;
      }
    }
  }

  function step(t) {
    var i, r, c;
    var damp = 0.985;
    var grav = 0.22;
    // slow wind field, never still
    for (r = 0; r < ROWS; r++) {
      for (c = 0; c < COLS; c++) {
        i = r * COLS + c;
        if (cloth.pinned[i]) continue;
        var x = cloth.px[i], y = cloth.py[i];
        var vx = (x - cloth.ox[i]) * damp;
        var vy = (y - cloth.oy[i]) * damp;
        cloth.ox[i] = x; cloth.oy[i] = y;
        var wx = Math.sin(y * 0.012 + t * 0.0011) * Math.cos(x * 0.006 - t * 0.0007);
        var wy = Math.cos(x * 0.009 + t * 0.0009) * 0.6 - 0.25;
        var wind = 0.55 + 0.45 * Math.sin(t * 0.0004 + r * 0.11);
        cloth.px[i] = x + vx + wx * wind * 0.5;
        cloth.py[i] = y + vy + grav + wy * wind * 0.35;
      }
    }
    // drag force
    if (pointer.down || (pointer.x > -9000)) {
      var rad = Math.min(W, H) * 0.16, r2 = rad * rad;
      for (i = 0; i < COLS * ROWS; i++) {
        if (cloth.pinned[i]) continue;
        var dx = cloth.px[i] - pointer.x, dy = cloth.py[i] - pointer.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < r2) {
          var d = Math.sqrt(d2) || 1;
          var pull = (1 - d / rad);
          cloth.px[i] += (pointer.dx * 1.6 * pull) + (-dx / d) * pull * 1.2;
          cloth.py[i] += (pointer.dy * 1.6 * pull) + (-dy / d) * pull * 1.2;
        }
      }
    }
    // constraints
    var s = cloth.spacing;
    for (var k = 0; k < 3; k++) {
      for (r = 0; r < ROWS; r++) {
        for (c = 0; c < COLS; c++) {
          i = r * COLS + c;
          if (c < COLS - 1) satisfy(i, i + 1, s);
          if (r < ROWS - 1) satisfy(i, i + COLS, s);
        }
      }
    }
    function satisfy(a, b, rest) {
      var dx = cloth.px[b] - cloth.px[a], dy = cloth.py[b] - cloth.py[a];
      var d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      var diff = (d - rest) / d;
      var pa = cloth.pinned[a], pb = cloth.pinned[b];
      if (pa && pb) return;
      if (pa) { cloth.px[b] -= dx * diff; cloth.py[b] -= dy * diff; }
      else if (pb) { cloth.px[a] += dx * diff; cloth.py[a] += dy * diff; }
      else {
        var ox = dx * diff * 0.5, oy = dy * diff * 0.5;
        cloth.px[a] += ox; cloth.py[a] += oy;
        cloth.px[b] -= ox; cloth.py[b] -= oy;
      }
    }
  }

  function draw() {
    ctx.fillStyle = '#0a0a0c';
    ctx.fillRect(0, 0, W, H);
    var s = cloth.spacing;
    // billow shading: lines brighten where cloth stretches
    ctx.lineWidth = 1;
    ctx.beginPath();
    var segs = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var i = r * COLS + c;
        if (c < COLS - 1) segs.push([i, i + 1]);
        if (r < ROWS - 1) segs.push([i, i + COLS]);
      }
    }
    // two passes: deep shadow threads, then lit threads
    ctx.strokeStyle = 'rgba(120, 84, 32, 0.35)';
    ctx.beginPath();
    for (var q = 0; q < segs.length; q++) {
      var a = segs[q][0], b = segs[q][1];
      ctx.moveTo(cloth.px[a], cloth.py[a]);
      ctx.lineTo(cloth.px[b], cloth.py[b]);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(232, 180, 92, 0.5)';
    ctx.beginPath();
    for (q = 0; q < segs.length; q += 2) {
      a = segs[q][0]; b = segs[q][1];
      var dx = cloth.px[b] - cloth.px[a], dy = cloth.py[b] - cloth.py[a];
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > s * 1.02) { ctx.moveTo(cloth.px[a], cloth.py[a]); ctx.lineTo(cloth.px[b], cloth.py[b]); }
    }
    ctx.stroke();
    // gilded hem along the free edge
    ctx.strokeStyle = 'rgba(245, 214, 150, 0.85)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var c = 0; c < COLS; c++) {
      var j = (ROWS - 1) * COLS + c;
      if (c === 0) ctx.moveTo(cloth.px[j], cloth.py[j]);
      else ctx.lineTo(cloth.px[j], cloth.py[j]);
    }
    ctx.stroke();
  }

  var last = 0;
  function frame(now) {
    if (now - last > 100) last = now;
    var n = 0;
    while (last < now && n < 3) { step(last); last += 16.7; n++; }
    pointer.dx *= 0.8; pointer.dy *= 0.8;
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', build);
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
