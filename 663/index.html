<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Centauresa</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1A1410; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): dusk ridge, ember sky, low dark, herd sienna and
  // ochre, rider line bone. The two middle sky tones are flat steps mixed
  // between the ember and the dark endpoints of the palette.
  var EMBER = '#C96A3A';
  var EMBER_MID = '#A34E26';
  var EMBER_LOW = '#6E3B1E';
  var EMBER_DEEP = '#3A2415';
  var RIDGE = '#2B2622';
  var LOWDARK = '#1A1410';
  var SIENNA = '#8A4A2B';
  var OCHRE = '#C98F3D';
  var BONE = '#EDE4D0';

  // QA hook: ?seed=t<seconds> forces a fixed anchored time (used only by
  // the offline renderer; the live piece runs on the anchored clock).
  var FORCE_T = -1;
  if (typeof location !== 'undefined' && location.search) {
    var sm = location.search.match(/seed=t(\d+(?:\.\d+)?)/);
    if (sm) FORCE_T = parseFloat(sm[1]);
  }

  // Seeded RNG (mulberry32).
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ------------------------------------------------------------------
  // Herd: 10 horses as one merged stain-mass. Each horse is a set of
  // flat irregular blotches (body, neck, head, legs) in sienna/ochre;
  // neighbours share the same two tones at full alpha, so where masses
  // touch they merge into a single breathing herd, no outlines, no
  // sprites. Blotch shapes are seeded once and fixed; only the anchor
  // moves, as a pure phase function of the anchored clock.
  // Local units: horse faces +x, origin at the back line centre.
  // ------------------------------------------------------------------
  // [x, y, r, pass, squash]: pass 0: barrel/tail mass; pass 1: neck,
  // head and legs, drawn after every barrel so no head is orphaned
  // behind a neighbour's body.
  var BLOB_DEF = [
    // barrel and back (pass 0)
    [-0.52, -0.02, 0.150, 0, 0.80], [-0.40, 0.00, 0.170, 0, 0.80],
    [-0.27, 0.015, 0.185, 0, 0.80], [-0.13, 0.02, 0.200, 0, 0.80],
    [0.01, 0.015, 0.205, 0, 0.80], [0.15, 0.005, 0.195, 0, 0.80],
    [0.28, -0.005, 0.175, 0, 0.80], [0.40, -0.02, 0.150, 0, 0.80],
    // belly (pass 0)
    [-0.30, 0.11, 0.155, 0, 0.80], [-0.12, 0.135, 0.170, 0, 0.80],
    [0.06, 0.14, 0.170, 0, 0.80], [0.24, 0.115, 0.150, 0, 0.80],
    [0.36, 0.08, 0.125, 0, 0.80],
    // tail mass (pass 0)
    [-0.58, 0.06, 0.095, 0, 0.95], [-0.60, 0.16, 0.075, 0, 1.05],
    [-0.59, 0.26, 0.060, 0, 1.05],
    // neck chain and head (pass 1)
    [0.46, -0.06, 0.125, 1, 0.92], [0.52, -0.13, 0.115, 1, 0.92],
    [0.58, -0.20, 0.105, 1, 0.92], [0.64, -0.26, 0.095, 1, 0.92],
    [0.70, -0.31, 0.085, 1, 0.92], [0.78, -0.285, 0.060, 1, 0.92],
    [0.755, -0.25, 0.050, 1, 0.92],
    // legs (pass 1, mostly sunk behind the ridge crest)
    [0.33, 0.22, 0.060, 1, 1.15], [0.35, 0.34, 0.050, 1, 1.15],
    [0.36, 0.45, 0.045, 1, 1.15], [0.05, 0.24, 0.055, 1, 1.15],
    [0.03, 0.38, 0.045, 1, 1.15], [-0.35, 0.22, 0.060, 1, 1.15],
    [-0.38, 0.34, 0.050, 1, 1.15], [-0.39, 0.45, 0.045, 1, 1.15]
  ];

  var horses = [];
  (function buildHerd() {
    var rng = mulberry32(663001);
    for (var i = 0; i < 10; i++) {
      var blobs = [];
      for (var j = 0; j < BLOB_DEF.length; j++) {
        var d = BLOB_DEF[j];
        var shape = [];
        for (var k = 0; k < 9; k++) shape.push(0.70 + rng() * 0.60);
        blobs.push({
          x: d[0] + (rng() - 0.5) * 0.04,
          y: d[1] + (rng() - 0.5) * 0.03,
          r: d[2] * (d[3] === 1 ? 1.12 : 1) * (0.88 + rng() * 0.28),
          pass: d[3],
          squash: d[4],
          shape: shape,
          ochre: rng() < (d[3] === 1 ? 0.15 : 0.32)
        });
      }
      horses.push({
        x0: -0.15 + (i / 10) * 1.25 + (rng() - 0.5) * 0.08,
        v: 0.010 + rng() * 0.006,
        surgePh: rng() * Math.PI * 2,
        backDrop: 0.04 + rng() * 0.07,
        scale: 0.225 + rng() * 0.115,
        bobPh: rng() * Math.PI * 2,
        baseOchre: i % 2 === 0,
        blobs: blobs
      });
    }
  })();

  // Ridge crest: seeded sum of sines, fixed for the piece.
  var crestCoef = [];
  (function buildCrest() {
    var rng = mulberry32(663002);
    for (var i = 0; i < 5; i++) {
      crestCoef.push({ f: 1.5 + rng() * 5.5, a: 0.004 + rng() * 0.009, p: rng() * Math.PI * 2 });
    }
  })();
  function crestY(xf, H) {
    var y = 0.665 * H;
    for (var i = 0; i < crestCoef.length; i++) {
      var c = crestCoef[i];
      y += Math.sin(xf * c.f * Math.PI * 2 + c.p) * c.a * H;
    }
    return y;
  }

  // ------------------------------------------------------------------
  // The rider: one continuous bone line. A moving point rides a
  // procedural gallop course (figure-eight with rearing arcs) or, while
  // dragged, follows the pointer; a spring gives the follow its
  // momentum. Every fixed step the point is recorded into a trail;
  // trail segments fade out over 6 s, so exactly one continuous visible
  // length exists at any time. At the head of the trail a single-stroke
  // horse-and-rider figure is drawn: she is the line, always riding.
  // ------------------------------------------------------------------
  var LOOP_S = 26;               // gallop course period
  var U0 = -0.9;                 // course phase at t = 0 (entering, left)
  var TRAIL_FADE_S = 6;          // visible trail length in seconds
  var DT = 1 / 60;               // fixed simulation step

  function gallopPoint(tau, W, H) {
    var u = (tau / LOOP_S) * Math.PI * 2 + U0;
    var cx = isPhone ? 0.52 : 0.5, amp = isPhone ? 0.27 : 0.31;
    var x = cx * W + amp * W * Math.sin(u);
    var y = 0.55 * H - 0.077 * H * Math.sin(2 * u) + 0.03 * H * Math.sin(3 * u + 1.3);
    // Rearing arcs: two narrow lifts per loop, leaning back as she rises.
    var lift = 0;
    for (var i = 0; i < 2; i++) {
      var c = i === 0 ? 2.2 : 5.3;
      var d = u - c;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      lift += Math.exp(-(d * d) / (0.35 * 0.35));
    }
    y -= 0.085 * H * lift;
    x -= 0.021 * H * lift;
    // Gallop bob.
    y += 0.006 * H * Math.sin(tau * 8.5);
    return [x, y];
  }

  var sim = null;
  function newSim(W, H) {
    var p = gallopPoint(-1.2, W, H);
    return {
      t: -1.2, x: p[0], y: p[1], vx: 0, vy: 0,
      tilt: 0, facing: 1,
      trail: [],           // {x, y, t}
      events: [],          // recorded pointer events {type, t, x, y}
      evIdx: 0,
      dragging: false, dragX: 0, dragY: 0,
      relT: -10, relX: 0, relY: 0   // release anchor for the blend home
    };
  }

  function simStep(s, W, H) {
    var tNext = s.t + DT;
    // Consume recorded pointer events up to tNext.
    while (s.evIdx < s.events.length && s.events[s.evIdx].t <= tNext) {
      var ev = s.events[s.evIdx++];
      if (ev.type === 'down') {
        s.dragging = true; s.dragX = ev.x; s.dragY = ev.y;
      } else if (ev.type === 'move') {
        if (s.dragging) { s.dragX = ev.x; s.dragY = ev.y; }
      } else if (ev.type === 'up') {
        if (s.dragging) {
          s.dragging = false;
          s.relT = tNext;
          var g = gallopPoint(tNext, W, H);
          s.relX = s.x - g[0]; s.relY = s.y - g[1];
        }
      }
    }
    // Target: the pointer while dragging, else the gallop course plus
    // a decaying offset after a release, so she rejoins her own course
    // without the line ever lifting.
    var tx, ty;
    if (s.dragging) {
      tx = s.dragX; ty = s.dragY;
    } else {
      var g2 = gallopPoint(tNext, W, H);
      var decay = Math.exp(-(tNext - s.relT) / 2.5);
      if (tNext - s.relT > 12) decay = 0;
      tx = g2[0] + s.relX * decay;
      ty = g2[1] + s.relY * decay;
    }
    // Momentum spring toward the target.
    var K = 26, C = 9.2;
    s.vx += (K * (tx - s.x) - C * s.vx) * DT;
    s.vy += (K * (ty - s.y) - C * s.vy) * DT;
    s.x += s.vx * DT;
    s.y += s.vy * DT;
    s.t = tNext;
    // Figure orientation: pitch from the velocity, mirror when the
    // course wheels back (hysteresis so she does not flicker).
    var sp = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
    if (sp > 1) {
      // Pitch follows the velocity but is clamped near level and
      // smoothed slowly: a line figure reads best near upright, and
      // the gallop and the rearing live in the position, not the roll.
      var want = clamp(Math.atan2(s.vy, Math.abs(s.vx)), -0.35, 0.35);
      s.tilt += (want - s.tilt) * Math.min(1, DT * 3);
      if (s.vx > 0.15 * sp) s.facing = 1;
      else if (s.vx < -0.15 * sp) s.facing = -1;
    }
    s.trail.push({ x: s.x, y: s.y, t: s.t });
    while (s.trail.length > 2 && s.trail[0].t < s.t - TRAIL_FADE_S - 0.6) s.trail.shift();
  }

  function advanceSim(s, toT, W, H) {
    var guard = 0;
    while (s.t < toT - 1e-9 && guard < 2400) { simStep(s, W, H); guard++; }
  }

  // The rider figure as ONE unbroken stroke, local units (faces +x,
  // origin at the mount's back centre): a single contour that runs
  // around the mount's body and finishes up the woman's back, over
  // her head, and out along her arm to the rein.
  var FIGURE = [
    // One contour, no retraces: a true silhouette run clockwise from
    // the muzzle, under the body (foreleg spike, belly, hind leg V,
    // buttock, tail, croup, back), with the woman as a detour along
    // the back (her back, head, arm to the rein and back, her leg
    // down the flank), then up the shoulder to the withers, crest,
    // ear and face, ending at the muzzle where it began. She is
    // seated throughout.
    [0.62, -0.30], [0.54, -0.22], [0.44, -0.16], [0.36, -0.06],
    [0.33, 0.02], [0.34, 0.16], [0.335, 0.24], [0.33, 0.34],
    [0.35, 0.40], [0.29, 0.40], [0.29, 0.33], [0.27, 0.18],
    [0.18, 0.15], [0.00, 0.16], [-0.18, 0.15],
    [-0.30, 0.37], [-0.24, 0.37], [-0.22, 0.15], [-0.34, 0.12],
    [-0.48, 0.03], [-0.54, -0.08], [-0.46, -0.17], [-0.28, -0.19],
    [-0.13, -0.33], [-0.10, -0.46], [-0.03, -0.51], [0.03, -0.44],
    [0.02, -0.34], [0.13, -0.29], [0.24, -0.27], [0.04, -0.24],
    [0.13, -0.13], [0.16, -0.04], [0.11, 0.09], [0.14, -0.06],
    [0.16, -0.17], [0.28, -0.26], [0.42, -0.38], [0.45, -0.46],
    [0.50, -0.38], [0.58, -0.33], [0.63, -0.31]
  ];

  // ------------------------------------------------------------------
  // Canvas + layout
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var lastElapsed = 0;

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (window.screen && window.screen.width) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = H > W * 1.15;
    }
    sim = newSim(W, H);
    draw(lastElapsed);
  }

  function drawBlob(cx, cy, r, shape, squash) {
    ctx.beginPath();
    var n = shape.length, i, a, b, mx, my;
    var pts = [];
    for (i = 0; i < n; i++) {
      var th = (i / n) * Math.PI * 2;
      pts.push([cx + Math.cos(th) * r * shape[i], cy + Math.sin(th) * r * shape[i] * squash]);
    }
    for (i = 0; i < n; i++) {
      a = pts[i]; b = pts[(i + 1) % n];
      mx = (a[0] + b[0]) / 2; my = (a[1] + b[1]) / 2;
      if (i === 0) ctx.moveTo(mx, my);
      var nx = pts[(i + 2) % n];
      ctx.quadraticCurveTo(b[0], b[1], (b[0] + nx[0]) / 2, (b[1] + nx[1]) / 2);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawHerd(t) {
    var i, j, h, b, pass;
    // Recent trail points are the wake the herd flows around.
    var wake = [];
    if (sim) {
      for (i = sim.trail.length - 1; i >= 0 && sim.t - sim.trail[i].t < 1.2; i--) {
        wake.push(sim.trail[i]);
      }
    }
    var range = 1.7 * W;
    // Two passes: every barrel first, then every neck, head and leg,
    // so each head stays joined to its own neck above the mass.
    for (pass = 0; pass < 2; pass++) {
      for (i = 0; i < horses.length; i++) {
        h = horses[i];
        var fx = ((h.x0 + h.v * t + 0.015 * Math.sin(0.11 * t + h.surgePh)) % 1.7 + 1.7) % 1.7;
        var ax = -0.2 * W + (fx / 1.7) * range;
        var ay = crestY(ax / W, H) - h.backDrop * H + Math.sin(0.9 * t + h.bobPh) * 0.004 * H;
        var hs = h.scale * H;
        for (j = 0; j < h.blobs.length; j++) {
          b = h.blobs[j];
          if (b.pass !== pass) continue;
          var bx = ax + b.x * hs, by = ay + b.y * hs;
          // Wake deflection: blobs near the rider's recent line part
          // gently and settle back as the line ages away.
          for (var wI = 0; wI < wake.length; wI++) {
            var wp = wake[wI];
            var dx = bx - wp.x, dy = by - wp.y;
            var d2 = dx * dx + dy * dy;
            var R = 0.09 * H;
            if (d2 < R * R && d2 > 1) {
              var d = Math.sqrt(d2);
              var fall = (1 - d / R) * (1 - (sim.t - wp.t) / 1.2);
              var push = fall * 0.03 * H / d;
              bx += dx * push; by += dy * push;
            }
          }
          ctx.fillStyle = (b.ochre !== h.baseOchre) ? OCHRE : SIENNA;
          drawBlob(bx, by, b.r * hs, b.shape, b.squash);
        }
      }
    }
  }

  function drawTrailAndRider() {
    if (!sim || sim.trail.length < 2) return;
    var headW = 0.0052 * H, tailW = 0.0018 * H;
    var NB = 24;
    ctx.strokeStyle = BONE;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Bucket the trail by age so the one line tapers and fades as a
    // single continuous stroke, oldest segments vanishing at 6 s.
    for (var b = NB - 1; b >= 0; b--) {
      var ageLo = (b / NB) * TRAIL_FADE_S, ageHi = ((b + 1) / NB) * TRAIL_FADE_S;
      ctx.beginPath();
      var started = false, any = false;
      for (var i = 0; i < sim.trail.length; i++) {
        var p = sim.trail[i];
        var age = sim.t - p.t;
        if (age >= ageLo && age < ageHi + DT) {
          if (!started) { ctx.moveTo(p.x, p.y); started = true; }
          else ctx.lineTo(p.x, p.y);
          any = true;
        }
      }
      if (any) {
        var midAge = (ageLo + ageHi) / 2;
        ctx.globalAlpha = clamp(1 - midAge / TRAIL_FADE_S, 0, 1);
        ctx.lineWidth = lerp(headW, tailW, midAge / TRAIL_FADE_S);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    // The figure at the head: one unbroken stroke, drawn as a smooth
    // flowing curve through the figure points (midpoint quadratics),
    // so the line reads as a single gesture, not a wireframe.
    var f = (isPhone ? 0.13 : 0.20) * H;
    ctx.save();
    ctx.translate(sim.x, sim.y);
    ctx.rotate(sim.tilt);
    ctx.scale(sim.facing * f, f);
    ctx.beginPath();
    var nF = FIGURE.length;
    ctx.moveTo(FIGURE[0][0], FIGURE[0][1]);
    for (var k = 1; k < nF - 1; k++) {
      var mx = (FIGURE[k][0] + FIGURE[k + 1][0]) / 2;
      var my = (FIGURE[k][1] + FIGURE[k + 1][1]) / 2;
      ctx.quadraticCurveTo(FIGURE[k][0], FIGURE[k][1], mx, my);
    }
    ctx.lineTo(FIGURE[nF - 1][0], FIGURE[nF - 1][1]);
    ctx.lineWidth = (0.0058 * H) / f;
    ctx.strokeStyle = BONE;
    ctx.stroke();
    ctx.restore();
  }

  function draw(elapsed) {
    lastElapsed = elapsed;
    var t = FORCE_T >= 0 ? FORCE_T : elapsed;
    if (!sim) sim = newSim(W, H);
    advanceSim(sim, t, W, H);

    // Low dark ground, then flat ember sky bands.
    ctx.fillStyle = LOWDARK;
    ctx.fillRect(0, 0, W, H);
    var bands = [
      [0.00, 0.26, EMBER], [0.26, 0.40, EMBER_MID],
      [0.40, 0.52, EMBER_LOW], [0.52, 0.64, EMBER_DEEP]
    ];
    for (var i = 0; i < bands.length; i++) {
      ctx.fillStyle = bands[i][2];
      ctx.fillRect(0, bands[i][0] * H, W, (bands[i][1] - bands[i][0]) * H + 1);
    }

    drawHerd(t);

    // Ridge silhouette over the herd's legs, crest irregular.
    ctx.fillStyle = RIDGE;
    ctx.beginPath();
    ctx.moveTo(0, crestY(0, H));
    for (var x = 0; x <= W; x += Math.max(8, W / 90)) {
      ctx.lineTo(x, crestY(x / W, H));
    }
    ctx.lineTo(W, crestY(1, H));
    ctx.lineTo(W, 0.97 * H);
    ctx.lineTo(0, 0.97 * H);
    ctx.closePath();
    ctx.fill();

    drawTrailAndRider();
    ctx.globalAlpha = 1;
  }

  // Pointer: the one piece where drag belongs. Events are recorded
  // with anchored times and replayed inside the fixed-step sim, so the
  // line never lifts and the state stays deterministic.
  function pointerPos(e) {
    var px = 0, py = 0;
    if (typeof canvas.getBoundingClientRect === 'function') {
      var r = canvas.getBoundingClientRect();
      px = (e.clientX - r.left) * (r.width ? W / r.width : 1);
      py = (e.clientY - r.top) * (r.height ? H / r.height : 1);
    } else {
      px = e.clientX; py = e.clientY;
    }
    return [px, py];
  }
  function record(type) {
    return function (e) {
      if (!sim) return;
      if (e && e.preventDefault) e.preventDefault();
      var p = pointerPos(e);
      sim.events.push({ type: type, t: lastElapsed, x: p[0], y: p[1] });
    };
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', record('down'));
    canvas.addEventListener('pointermove', record('move'));
    canvas.addEventListener('pointerup', record('up'));
    canvas.addEventListener('pointercancel', record('up'));
  }

  // ------------------------------------------------------------------
  resize();
  draw(FORCE_T >= 0 ? FORCE_T : 0);

  if (typeof window.requestAnimationFrame === 'function') {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var raf = function () {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : t0;
      draw((now - t0) / 1000);
      window.requestAnimationFrame(raf);
    };
    window.requestAnimationFrame(raf);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
