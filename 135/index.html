<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№135 · Spider Diamonds</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#060608; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(200,204,212,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to turn the cluster</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

// No.135 Spider Diamonds: five crystalline gem-spiders (faceted octahedron
// bodies, eight thin legs each) drifting in a dark void. A slow pulse of
// light travels from the largest gem outward through the cluster.
const VOID='#060608';
const CHROME=[200,204,212], CYAN=[90,242,255], MAG=[255,62,181], TIP=[232,255,71];
const LOOP=18, W2=Math.PI*2/LOOP;
const GEMS=[
  {p:[-0.55, 0.10, 0.60], R:1.00, spin:1, tilt:0.35, rank:0, ph:0.0},
  {p:[ 1.15,-0.78,-0.70], R:0.46, spin:2, tilt:-0.3, rank:1, ph:1.7},
  {p:[-1.38,-0.98,-0.90], R:0.42, spin:-1, tilt:0.5, rank:2, ph:3.1},
  {p:[ 1.32, 0.88,-1.20], R:0.38, spin:1, tilt:-0.5, rank:3, ph:4.4},
  {p:[ 0.15, 1.18,-1.60], R:0.33, spin:2, tilt:0.25, rank:4, ph:5.6}
];
const PENTA=[523.25, 587.33, 659.25, 783.99, 880.0];
let timeVal=4.5, lastMs=null, lastNowS=0;
let dragging=false, dragLastX=0, dragLastY=0, cRotY=0.4, cRotX=-0.15;
let flareI=-1, flareT=-99, audioCtx=null;
let screenGems=[]; // for tap picking: {x, y, r, i}

function rotYv(v,a){ const c=Math.cos(a), s=Math.sin(a); return [v[0]*c+v[2]*s, v[1], -v[0]*s+v[2]*c]; }
function rotXv(v,a){ const c=Math.cos(a), s=Math.sin(a); return [v[0], v[1]*c-v[2]*s, v[1]*s+v[2]*c]; }
function mixc(a, b, k){ return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k]; }
function css(c, s){ return 'rgb('+Math.round(clamp(c[0]*s,0,255))+','+Math.round(clamp(c[1]*s,0,255))+','+Math.round(clamp(c[2]*s,0,255))+')'; }

function gemWorld(g, pt){
  // drifted, cluster-rotated center
  const dx=0.16*Math.sin(pt*W2+g.ph), dy=0.12*Math.cos(pt*W2*1.0+g.ph*1.3);
  let c=[g.p[0]+dx, g.p[1]+dy, g.p[2]];
  c=rotYv(rotXv(c, cRotX), cRotY);
  return c;
}
function drawGem(g, gi, pt, S, cxp, cyp, bright){
  const R=g.R;
  const spin=pt*W2*g.spin + g.ph;
  // local octahedron verts
  const eq=[];
  for(let k=0;k<4;k++){ const a=Math.PI/4 + k*Math.PI/2; eq.push([Math.cos(a)*0.74*R, 0, Math.sin(a)*0.74*R]); }
  let verts=[[0,R,0],[0,-R,0]].concat(eq);
  // orient: spin Y, tilt X, cluster rotation
  verts=verts.map(v=>rotYv(rotXv(rotYv(v, spin), g.tilt), 0));
  verts=verts.map(v=>rotYv(rotXv(v, cRotX), cRotY));
  const center=gemWorld(g, pt);
  const F=5.5;
  function proj(v){
    const wx=center[0]+v[0], wy=center[1]+v[1], wz=center[2]+v[2];
    const p=F/(F-wz);
    return {x:cxp+wx*S*p, y:cyp-wy*S*p, z:wz, p};
  }
  const pv=verts.map(proj);
  const perspC=F/(F-center[2]);
  screenGems.push({x:cxp+center[0]*S*perspC, y:cyp-center[1]*S*perspC, r:R*S*perspC*1.35, i:gi});
  // legs: 8 around the equator
  const legs=[];
  for(let k=0;k<8;k++){
    const a=k*Math.PI/4 + Math.PI/8;
    const flex=Math.sin(pt*W2*3 + k*1.7 + g.ph)*0.06*R;
    const att=[Math.cos(a)*0.70*R, 0, Math.sin(a)*0.70*R];
    const dir=[Math.cos(a), 0, Math.sin(a)];
    const knee=[att[0]+dir[0]*0.55*R, 0.38*R+flex, att[2]+dir[2]*0.55*R];
    const foot=[knee[0]+dir[0]*0.52*R, -0.55*R-flex*0.6, knee[2]+dir[2]*0.52*R];
    let pts=[att, knee, foot].map(v=>rotYv(rotXv(rotYv(v, spin), g.tilt), 0));
    pts=pts.map(v=>rotYv(rotXv(v, cRotX), cRotY));
    const pp=pts.map(proj);
    legs.push({pp, z:(pp[0].z+pp[2].z)/2, k});
  }
  const legShade=0.62*bright;
  function drawLeg(lg){
    ctx.strokeStyle=css(CHROME, legShade);
    ctx.lineWidth=Math.max(1.2, R*S*perspC*0.045);
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(lg.pp[0].x, lg.pp[0].y); ctx.lineTo(lg.pp[1].x, lg.pp[1].y); ctx.lineTo(lg.pp[2].x, lg.pp[2].y); ctx.stroke();
    const tip = (gi===0 && (lg.k===1 || lg.k===4 || lg.k===6));
    ctx.fillStyle = tip ? css(TIP, 0.95*bright) : css(CHROME, legShade);
    ctx.beginPath(); ctx.arc(lg.pp[2].x, lg.pp[2].y, Math.max(1.4, R*S*perspC*0.035), 0, Math.PI*2); ctx.fill();
  }
  for(const lg of legs) if(lg.z<=center[2]) drawLeg(lg);
  // faces: upper (0, eq k, eq k+1), lower (1, eq k+1, eq k); eq verts are pv[2..5]
  const faces=[];
  for(let k=0;k<4;k++){
    const a=pv[2+k], b=pv[2+(k+1)%4];
    faces.push({idx:[0, 2+k, 2+(k+1)%4], z:(pv[0].z+a.z+b.z)/3});
    faces.push({idx:[1, 2+(k+1)%4, 2+k], z:(pv[1].z+a.z+b.z)/3});
  }
  faces.sort((f1,f2)=>f1.z-f2.z);
  const L=[-0.45, 0.8, 0.6]; const ll=Math.hypot(L[0],L[1],L[2]); const Ln=[L[0]/ll, L[1]/ll, L[2]/ll];
  for(const f of faces){
    const A=verts[f.idx[0]], B=verts[f.idx[1]], C=verts[f.idx[2]];
    const ux=B[0]-A[0], uy=B[1]-A[1], uz=B[2]-A[2];
    const vx=C[0]-A[0], vy=C[1]-A[1], vz=C[2]-A[2];
    let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    const nl=Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;
    // orient normal outward from gem center
    const mx=(A[0]+B[0]+C[0])/3, my=(A[1]+B[1]+C[1])/3, mz=(A[2]+B[2]+C[2])/3;
    if(nx*mx+ny*my+nz*mz<0){ nx=-nx; ny=-ny; nz=-nz; }
    const diff=Math.max(0, nx*Ln[0]+ny*Ln[1]+nz*Ln[2]);
    const grazing=1-Math.abs(nz); // view is roughly +z in world space
    let col=mixc(CHROME, CHROME, 0);
    let shade=(0.30+0.75*diff)*bright;
    if(grazing>0.62){
      const fringe=mixc(MAG, CYAN, clamp((nx+1)/2, 0, 1));
      col=mixc(col, fringe, clamp((grazing-0.62)/0.38, 0, 1)*0.85);
    }
    ctx.fillStyle=css(col, shade);
    ctx.beginPath();
    ctx.moveTo(pv[f.idx[0]].x, pv[f.idx[0]].y);
    ctx.lineTo(pv[f.idx[1]].x, pv[f.idx[1]].y);
    ctx.lineTo(pv[f.idx[2]].x, pv[f.idx[2]].y);
    ctx.closePath(); ctx.fill();
  }
  for(const lg of legs) if(lg.z>center[2]) drawLeg(lg);
}

function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const nowS=nowMs/1000; lastNowS=nowS;
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(!dragging) timeVal+=dt;
  const pt=((timeVal%LOOP)+LOOP)%LOOP;
  ctx.fillStyle=VOID; ctx.fillRect(0,0,w,h);
  const S=Math.min(w,h)*0.5/2.6;
  screenGems=[];
  const pulseC=(pt/LOOP)*5.5-0.75;
  const order=GEMS.map((g,i)=>({g, i, c:gemWorld(g, pt)})).sort((a,b)=>a.c[2]-b.c[2]);
  for(const o of order){
    let bright=0.72+0.55*Math.exp(-Math.pow(o.g.rank-pulseC,2)/0.8);
    if(o.i===flareI) bright+=1.25*Math.exp(-(nowS-flareT)*2.2);
    drawGem(o.g, o.i, pt, S, w/2, h/2, bright);
  }
}
function frame(nowMs){ drawFrame(nowMs); }
function ptr(e){ return [e.clientX, e.clientY]; }
function gemTone(i){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    if(!audioCtx) audioCtx=new AC();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const t0=audioCtx.currentTime;
    const osc=audioCtx.createOscillator(), gn=audioCtx.createGain();
    osc.type='sine'; osc.frequency.value=PENTA[i%PENTA.length];
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.exponentialRampToValueAtTime(0.07, t0+0.03);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0+1.2);
    osc.connect(gn); gn.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+1.25);
  }catch(err){ /* audio is garnish; the piece runs silently without it */ }
}
canvas.addEventListener('pointerdown',e=>{
  const [x,y]=ptr(e);
  // tap a gem: nearest screen gem within its radius flares
  let best=-1, bd=1e9;
  for(const sg of screenGems){ const d=Math.hypot(x-sg.x, y-sg.y); if(d<sg.r && d<bd){ bd=d; best=sg.i; } }
  if(best>=0){ flareI=best; flareT=lastNowS; gemTone(best); frame(performance.now()); return; }
  dragging=true; dragLastX=x; dragLastY=y;
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const [x,y]=ptr(e);
  cRotY+=(x-dragLastX)*0.005;
  cRotX=clamp(cRotX+(y-dragLastY)*0.005, -1.0, 1.0);
  dragLastX=x; dragLastY=y; frame(performance.now());
});
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);
function loop(nowMs){ frame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
frame(0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>frame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>frame(performance.now()));
</script>
</body>
</html>
