<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H-Emitters, Iteration 49</title>
<style>
html, body { margin: 0; padding: 0; background: #04050a; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#04050a';
var CYAN = [64, 224, 255];
var GOLD = [255, 205, 110];
var WHITE = [255, 255, 255];
var PLATE = '#eef6fa';
var INK = '#0a1a22';
/* Two drifting wave sources sum into a field, and matter condenses
   only where the sum peaks. Frame one is at t = 6 s: the rings are
   developed and the dot lattice is already breathing. */
var PHASE = 6;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* ---- two emitters, authored positions, slow orbits ----
   One high, one low, off-center; the interference band crosses the
   middle third. Wavelengths differ slightly so the lattice never
   repeats the same moire. */
var sources = [
  { bx: 0.30, by: 0.28, ox: 0.055, oy: 0.045, s1: 0.045, s2: 0.060,
    p1: 0.7, p2: 2.1, lam: 0.105, w: 1.00, ph: 0.3, amp: 1 },
  { bx: 0.70, by: 0.74, ox: 0.060, oy: 0.050, s1: 0.050, s2: 0.038,
    p1: 2.6, p2: 0.4, lam: 0.125, w: 0.80, ph: 1.9, amp: 1 }
];
function sourcePos(s, t) {
  return {
    x: (s.bx + s.ox * Math.sin(s.s1 * t + s.p1)) * VW,
    y: (s.by + s.oy * Math.cos(s.s2 * t + s.p2)) * VH
  };
}
/* ---- summed sinusoidal field on a coarse grid ----
   S = sum of the two source waves; brightness = |S|^2. Dots are
   drawn only at real local maxima of the brightness above threshold. */
var grid = { cs: 13, nx: 0, ny: 0, s: [], b: [] };
var dots = [];
var THRESH = 2.0; /* S^2; S peaks at 2 where the waves fully agree */
function computeField(t) {
  var cs = isPhone ? 15 : 13;
  grid.cs = cs;
  var minDim = Math.min(VW, VH);
  var nx = Math.ceil(VW / cs) + 2, ny = Math.ceil(VH / cs) + 2;
  grid.nx = nx; grid.ny = ny;
  var s = new Array(nx * ny), b = new Array(nx * ny);
  var i, j, x, y, k, sp, dx, dy, d, v;
  var k1 = TAU / (sources[0].lam * minDim);
  var k2 = TAU / (sources[1].lam * minDim);
  var p1 = sourcePos(sources[0], t), p2 = sourcePos(sources[1], t);
  for (j = 0; j < ny; j++) {
    y = (j - 1) * cs + cs / 2;
    for (i = 0; i < nx; i++) {
      x = (i - 1) * cs + cs / 2;
      dx = x - p1.x; dy = y - p1.y;
      d = Math.sqrt(dx * dx + dy * dy);
      v = sources[0].amp * Math.sin(k1 * d - sources[0].w * t + sources[0].ph);
      dx = x - p2.x; dy = y - p2.y;
      d = Math.sqrt(dx * dx + dy * dy);
      v += sources[1].amp * Math.sin(k2 * d - sources[1].w * t + sources[1].ph);
      s[j * nx + i] = v;
      b[j * nx + i] = v * v;
    }
  }
  grid.s = s; grid.b = b;
  /* Real constructive maxima: brightness above threshold and no
     brighter neighbour in the 8-neighbourhood. */
  dots = [];
  var idx, ni, nj, nb, isMax;
  for (j = 1; j < ny - 1; j++) {
    for (i = 1; i < nx - 1; i++) {
      idx = j * nx + i;
      if (b[idx] <= THRESH) continue;
      isMax = true;
      for (nj = -1; nj <= 1 && isMax; nj++) {
        for (ni = -1; ni <= 1; ni++) {
          if (ni === 0 && nj === 0) continue;
          nb = b[(j + nj) * nx + i + ni];
          if (nb > b[idx]) { isMax = false; break; }
        }
      }
      if (isMax) dots.push({ x: (i - 1) * cs + cs / 2, y: (j - 1) * cs + cs / 2, b: b[idx] });
    }
  }
}
function drawDisc(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
}
function drawRings(t) {
  var minDim = Math.min(VW, VH);
  var maxR = Math.sqrt(VW * VW + VH * VH);
  var s, sp, k, n, r, a;
  ctx.lineWidth = 1;
  for (s = 0; s < sources.length; s++) {
    sp = sourcePos(sources[s], t);
    k = TAU / (sources[s].lam * minDim);
    /* Crest radii: k*r - w*t + ph = 2*pi*n. Rings keep emitting:
       the phase term advances with t so crests travel outward. */
    n = 0;
    for (;;) {
      r = (TAU * n + sources[s].w * t - sources[s].ph) / k;
      if (r > maxR) break;
      if (r > 0) {
        a = 0.20 * Math.pow(1 - r / maxR, 1.5) + 0.02;
        ctx.strokeStyle = rgba(CYAN, a);
        ctx.beginPath();
        ctx.moveTo(sp.x + r, sp.y);
        ctx.arc(sp.x, sp.y, r, 0, TAU);
        ctx.stroke();
      }
      n++;
    }
  }
}
function drawDots() {
  var scale = clamp(Math.min(VW, VH) / 900, 0.6, 1.2);
  var d, f, r, col, i;
  for (i = 0; i < dots.length; i++) {
    d = dots[i];
    f = smooth((d.b - THRESH) / (4 - THRESH));
    r = (1.4 + 3.0 * f) * scale;
    /* Near-white gold, whiter as the peak strengthens. */
    col = [Math.round(255), Math.round(205 + 50 * f), Math.round(110 + 145 * f)];
    ctx.fillStyle = rgba(col, 0.55 + 0.45 * f);
    drawDisc(d.x, d.y, r);
    ctx.fill();
    if (f > 0.55) {
      ctx.fillStyle = rgba(WHITE, 0.35 * f);
      drawDisc(d.x, d.y, r * 0.45);
      ctx.fill();
    }
  }
}
function drawEmitters(t) {
  var s, sp, glowR = clamp(Math.min(VW, VH) * 0.02, 10, 18);
  for (s = 0; s < sources.length; s++) {
    sp = sourcePos(sources[s], t);
    ctx.fillStyle = rgba(CYAN, 0.10);
    drawDisc(sp.x, sp.y, glowR * 2.4);
    ctx.fill();
    ctx.fillStyle = rgba(CYAN, 0.85);
    drawDisc(sp.x, sp.y, 4.5);
    ctx.fill();
    ctx.fillStyle = rgba(WHITE, 0.95);
    drawDisc(sp.x, sp.y, 1.8);
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  var title = 'H-Emitters, Iteration 49';
  var date = '2006 · 07 · 17';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(title).width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(title).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText(date).width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(title, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = INK;
  ctx.fillText(date, plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag an emitter to reshape the field.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  computeField(t);
  ctx.globalCompositeOperation = 'lighter';
  drawRings(t);
  drawDots();
  drawEmitters(t);
  ctx.globalCompositeOperation = 'source-over';
  drawPlates();
}
/* ---- drag an emitter: the field recomputes live around it ---- */
var dragging = -1;
function pointerXY(e) {
  var x = 0, y = 0;
  if (e) {
    if (typeof e.clientX === 'number') { x = e.clientX; y = e.clientY; }
    else if (typeof e.pageX === 'number') { x = e.pageX; y = e.pageY; }
  }
  return { x: x, y: y };
}
function nearestEmitter(px, py) {
  var t = clockT, best = -1, bestD = 1e9, s, sp, dx, dy, d;
  var reach = isPhone ? 48 : 36;
  for (s = 0; s < sources.length; s++) {
    sp = sourcePos(sources[s], t);
    dx = px - sp.x; dy = py - sp.y;
    d = Math.sqrt(dx * dx + dy * dy);
    if (d < reach && d < bestD) { best = s; bestD = d; }
  }
  return best;
}
function moveEmitter(s, px, py, t) {
  var nx = clamp(px / VW, 0.05, 0.95), ny = clamp(py / VH, 0.05, 0.95);
  sources[s].bx = nx - sources[s].ox * Math.sin(sources[s].s1 * t + sources[s].p1);
  sources[s].by = ny - sources[s].oy * Math.cos(sources[s].s2 * t + sources[s].p2);
  sources[s].bx = clamp(sources[s].bx, 0.02, 0.98);
  sources[s].by = clamp(sources[s].by, 0.02, 0.98);
}
function onDown(e) {
  var p = pointerXY(e);
  dragging = nearestEmitter(p.x, p.y);
  if (dragging >= 0) {
    if (e && e.preventDefault) e.preventDefault();
    if (canvas.setPointerCapture && e && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  }
}
function onMove(e) {
  if (dragging < 0) return;
  var p = pointerXY(e);
  moveEmitter(dragging, p.x, p.y, clockT);
  if (e && e.preventDefault) e.preventDefault();
}
function onUp() { dragging = -1; }
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    dotCount: function () { return dots.length; },
    fieldMax: function () {
      var m = 0, i; for (i = 0; i < grid.b.length; i++) if (grid.b[i] > m) m = grid.b[i];
      return m;
    },
    emitter: function (i) { var p = sourcePos(sources[i], clockT); return { x: p.x, y: p.y }; },
    dragEmitter: function (i, nx, ny) { moveEmitter(i, nx * VW, ny * VH, clockT); },
    dragging: function () { return dragging; }
  };
}
/* ---- frame one: fixed phase, fixed seeds, no wall clock ---- */
size();
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
