<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everything Wrong the Right Way</title>
<style>
  html, body { margin:0; padding:0; background:#0D0D0F; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
/* №1181 — Everything Wrong the Right Way (Jason Soliday SD6, I ♥ PRESETS)
   A choreographed preset-abuse loop. Three panels (VOX / VID / DRUM) run
   at their presets for 8 bars; at bar 9 (index 8) the WRONG light flashes
   and every control slams to a seeded absurd extreme in 4 hard beat steps;
   bars 10-12 (index 9-11) run fully wrong; bar 13 (index 12) RESET slams
   everything back with a white flash. The ONLY interaction: tapping the
   RESET button re-anchors the cycle at bar 1 with the same flash.
   No dragging, no audio — the visitor-driven sibling is №1169. */

// ---------- seeded RNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash01(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}

// ---------- constants ----------
var BG='#0D0D0F', PANEL='#1A1A1E', TRIM='#2E2E34', INK='#E8E8E8';
var KNOB='#E8E8E8', POINTER='#FF2B6E', TRACK='#00FFC2';
var RED='#FF3B30', REDFIELD='#330B0B', DIM='#6A6A72';
var BPM=150, BEAT=60/BPM, BAR=BEAT*4, CYCLE=BAR*13; // bar = 1.6s, cycle 20.8s
var T0=BAR*10+BAR*0.35; // frame one: inside bar 11 (index 10), wrongness full

// ---------- control definitions: [name, preset%, extreme%] ----------
var PANELS=[
 { id:'VOX', accent:'#FF2B6E', presetName:'SPREADSHEET-04',
   knobs:[['RATE',50,400],['PITCH',25,-80]],
   sliders:[['GATE',65,400],['DECAY',35,-45]] },
 { id:'VID', accent:'#00FFC2', presetName:'GIFLOOP-11',
   knobs:[['FRAMES',40,-100],['DITHER',55,385]],
   sliders:[['SPLIT',20,400],['JITTER',30,-70]] },
 { id:'DRUM', accent:'#FFE14D', presetName:'CASIO-BENT-02',
   knobs:[['DENSITY',60,400],['SCATTER',15,330]],
   sliders:[['STUTTER',45,-90],['GHOST',10,400]] }
];
function ctrlVal(c,w){ return c[1]+(c[2]-c[1])*w; }
function frac(v){ var f=(v+100)/500; return f<0?0:(f>1?1:f); }

// seeded per-viewport tables
var bassPattern=[], dropSeed=[], addSeed=[];
for(var i=0;i<16;i++){ bassPattern.push(0.15+0.8*hash01(100+i*3)); dropSeed.push(hash01(200+i*7)); addSeed.push(hash01(300+i*11)); }
var drumSeed=[], drumPh=[];
for(var j=0;j<64;j++){ drumSeed.push(hash01(400+j*13)); drumPh.push(hash01(500+j*17)); }
var BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

// ---------- canvas / view ----------
var canvas=document.getElementById('cv');
var ctx=canvas.getContext('2d');
var W=0,H=0,phone=false;
function viewW(){ var vv=window.visualViewport; return vv?vv.width:window.innerWidth; }
function viewH(){ var vv=window.visualViewport; return vv?vv.height:window.innerHeight; }
function fit(){
  W=viewW(); H=viewH();
  var sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0;
  phone=(Math.min(sw,sh)<700)||(H>W*1.15);
  canvas.width=W; canvas.height=H;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
}
if(window.visualViewport&&window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize',function(){fit();draw(now());});
window.addEventListener('resize',function(){fit();draw(now());});

// ---------- clock / interaction state ----------
var startStamp=null, anchor=0, flashAt=-10; // anchor = piece-time of cycle start
function now(){
  var t=(typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000;
  if(startStamp===null) startStamp=t;
  return T0+(t-startStamp);
}
function resetGeom(){ var mx=Math.round(W*0.03); return {x:mx,y:Math.round(H*0.855),w:W-2*mx,h:Math.round(H*0.115)}; }
function onTap(x,y){
  var r=resetGeom();
  if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){
    var t=now(); anchor=t; flashAt=t; draw(t);
  }
}
if(canvas.addEventListener){
  canvas.addEventListener('pointerdown',function(e){ onTap(e.clientX,e.clientY); });
  canvas.addEventListener('touchstart',function(e){ if(e.touches&&e.touches[0]) onTap(e.touches[0].clientX,e.touches[0].clientY); });
}

// ---------- wrongness ----------
function wrongness(ct){
  var bar=Math.floor(ct/BAR);
  if(bar<8) return 0;
  if(bar===8){ var beat=Math.floor((ct-bar*BAR)/BEAT); return (beat+1)*0.25; }
  if(bar<12) return 1;
  return 0;
}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawKnob(cx,cy,r,c,w){
  var v=ctrlVal(c,w), a=(-135+270*frac(v))*Math.PI/180;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=KNOB; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=TRIM; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.sin(a)*r*0.78, cy-Math.cos(a)*r*0.78);
  ctx.lineWidth=Math.max(2,r*0.16); ctx.strokeStyle=POINTER; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,r*0.14,0,Math.PI*2); ctx.fillStyle='#111114'; ctx.fill();
  ctx.fillStyle=DIM; ctx.font='600 '+Math.round(r*0.52)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(c[0],cx,cy+r+2);
  ctx.fillStyle=INK; ctx.font='700 '+Math.round(r*0.58)+'px monospace';
  ctx.fillText(Math.round(v)+'%',cx,cy+r+2+Math.round(r*0.6));
}
function drawSlider(x,y,w,c,val){
  var v=ctrlVal(c,val), f=frac(v);
  ctx.fillStyle=DIM; ctx.font='600 10px monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(c[0],x,y-8);
  ctx.fillStyle='#0E3A32'; ctx.fillRect(x,y-2,w,4);
  ctx.fillStyle=TRACK; ctx.fillRect(x,y-2,w*f,4);
  ctx.fillStyle=INK; ctx.fillRect(x+w*f-3,y-7,6,14);
  ctx.font='700 11px monospace'; ctx.textAlign='right';
  ctx.fillText(Math.round(v)+'%',x+w,y-8);
}

// ---------- viewports ----------
function drawVox(x,y,w,h,p,vals,ct,wg){
  // 16 stepped blocks, seeded bassline; heights invert with wrongness
  var step=Math.floor(ct/(BEAT/2))%16;
  var gate=Math.max(0.12,Math.min(1,vals[2]/100));
  var bw=w/16;
  for(var i=0;i<16;i++){
    var lvl=bassPattern[i];
    lvl=lvl*(1-wg)+(1-lvl)*wg; // invert as wrongness rises
    if(dropSeed[i]<wg*0.45) lvl=0.03;
    if(addSeed[i]<wg*0.35) lvl=0.97;
    var bh=Math.max(2,lvl*(h-14)), bx=x+i*bw+1, bwid=(bw-2)*gate;
    ctx.fillStyle=(i===step)?'#FFFFFF':p.accent;
    ctx.globalAlpha=(i===step)?1:0.85;
    ctx.fillRect(bx,y+h-bh,bwid,bh);
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle=TRIM; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}
function shapePath(kind,cx,cy,R,rot){
  var i,px,py;
  ctx.beginPath();
  if(kind===0){ // star
    for(i=0;i<10;i++){ var a=rot+i*Math.PI/5, rad=(i%2===0)?R:R*0.45; px=cx+Math.cos(a)*rad; py=cy+Math.sin(a)*rad; if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
    ctx.closePath();
  } else if(kind===1){ // ring
    ctx.arc(cx,cy,R,0,Math.PI*2); ctx.arc(cx,cy,R*0.55,0,Math.PI*2,true);
  } else if(kind===2){ // zigzag
    for(i=0;i<=6;i++){ px=cx-R+ (2*R)*(i/6); py=cy+((i%2===0)?-1:1)*R*0.55; if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  } else { // diamond
    ctx.moveTo(cx,cy-R); ctx.lineTo(cx+R*0.7,cy); ctx.lineTo(cx,cy+R); ctx.lineTo(cx-R*0.7,cy); ctx.closePath();
  }
}
function drawVid(x,y,w,h,p,vals,ct,wg){
  var order=wg<0.5?[0,1,2,3]:[2,0,3,1]; // frame order scrambles when wrong
  var f=order[Math.floor(ct/(BEAT/2))%4];
  var kind=f;
  var cx=x+w/2, cy=y+h/2, R=Math.min(w,h)*0.34;
  var rot=f*Math.PI/2 + wg*vals[3]*0.01; // JITTER extreme spins it
  var off=wg*8, dith=Math.max(0,Math.min(1,vals[1]/100));
  var passes=wg>0?[['#FF2B6E',-off],['#FFE14D',off],['#00FFC2',0]]:[['#00FFC2',0]];
  for(var k=0;k<passes.length;k++){
    ctx.save();
    ctx.globalAlpha=wg>0?0.75:0.9;
    shapePath(kind,cx+passes[k][1],cy,R,rot);
    ctx.fillStyle=passes[k][0];
    ctx.fill(kind===1?'evenodd':'nonzero');
    ctx.clip(kind===1?'evenodd':'nonzero');
    ctx.fillStyle='#0D0D0F';
    var s=7;
    for(var gy=y+2;gy<y+h;gy+=s) for(var gx=x+2;gx<x+w;gx+=s){
      if(BAYER[Math.floor(gy/s)%4][Math.floor(gx/s)%4]/16<dith*0.55) ctx.fillRect(gx,gy,2.4,2.4);
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle=TRIM; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}
function drawDrum(x,y,w,h,p,vals,ct,wg){
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  var cols=8, rows=8, s=Math.min(w/cols,h/rows);
  var ox=x+(w-s*cols)/2, oy=y+(h-s*rows)/2;
  var dens=Math.max(0,Math.min(1,vals[0]/100));
  var scat=wg*(vals[1]/100), ghost=wg*Math.max(0,Math.min(1,vals[3]/100));
  var col=Math.floor(ct/(BEAT/2))%cols;
  ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fillRect(ox+col*s,oy,s,s*rows);
  for(var rI=0;rI<rows;rI++) for(var cI=0;cI<cols;cI++){
    var idx=rI*cols+cI, sd=drumSeed[idx];
    if(sd>dens) continue;
    var blink=wg>0.4&&(Math.floor(ct*8+drumPh[idx]*8)%3===0);
    if(blink) continue;
    var dx=(hash01(idx*3.3)-0.5)*2*scat*s*0.9, dy=(hash01(idx*7.7)-0.5)*2*scat*s*0.9;
    var px=ox+cI*s+s/2+dx, py=oy+rI*s+s/2+dy, rad=s*0.26;
    ctx.beginPath(); ctx.moveTo(px+rad,py); ctx.arc(px,py,rad,0,Math.PI*2);
    ctx.fillStyle=(cI===col)?'#FFFFFF':p.accent; ctx.fill();
    if(ghost>0&&hash01(idx*5.1)<ghost*0.8){
      ctx.beginPath(); var gx=px+ (hash01(idx*9.3)-0.5)*s*2, gy=py+(hash01(idx*4.7)-0.5)*s*2;
      ctx.moveTo(gx+rad*0.6,gy); ctx.arc(gx,gy,rad*0.6,0,Math.PI*2);
      ctx.globalAlpha=0.35; ctx.fillStyle=p.accent; ctx.fill(); ctx.globalAlpha=1;
    }
  }
  ctx.restore();
  ctx.strokeStyle=TRIM; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}

// ---------- main draw ----------
function draw(t){
  var ct=((t-anchor)%CYCLE+CYCLE)%CYCLE;
  var wg=wrongness(ct);
  var bar=Math.floor(ct/BAR);
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  var mx=Math.round(W*0.03);

  // header: WRONG light centered, bar counter right
  var lampX=W/2-34, lampY=Math.round(H*0.062), lampR=Math.max(9,Math.round(H*0.016));
  var lampOn=(bar===8)?(Math.floor(ct*4)%2===0):(bar>=9&&bar<12);
  ctx.beginPath(); ctx.arc(lampX,lampY,lampR,0,Math.PI*2);
  ctx.fillStyle=lampOn?RED:'#3A1512'; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=TRIM; ctx.stroke();
  ctx.fillStyle=lampOn?RED:DIM; ctx.font='700 '+Math.round(lampR*1.25)+'px monospace';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('WRONG',lampX+lampR+8,lampY+1);
  ctx.fillStyle=DIM; ctx.font='600 12px monospace'; ctx.textAlign='right';
  ctx.fillText('BAR '+(bar+1)+' / 13',W-mx,lampY+1);
  ctx.textAlign='left';
  if(phone){ ctx.font='600 10px monospace'; }
  ctx.fillText(phone?'EVERYTHING WRONG':'EVERYTHING WRONG THE RIGHT WAY',mx,lampY+1);

  // panels
  var pTop=Math.round(H*0.115), pBot=Math.round(H*0.835);
  var rects=[], i;
  if(!phone){
    var gap=14, pw=(W-2*mx-gap*2)/3;
    for(i=0;i<3;i++) rects.push({x:mx+i*(pw+gap),y:pTop,w:pw,h:pBot-pTop});
  } else {
    var ph3=(pBot-pTop-16)/3;
    for(i=0;i<3;i++) rects.push({x:mx,y:pTop+i*(ph3+8),w:W-2*mx,h:ph3});
  }
  for(i=0;i<3;i++){
    var P=PANELS[i], R=rects[i];
    rr(R.x,R.y,R.w,R.h,8); ctx.fillStyle=PANEL; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle=TRIM; ctx.stroke();
    var pad=12, iw=R.w-pad*2;
    // header
    ctx.fillStyle=P.accent; ctx.font='700 17px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(P.id,R.x+pad,R.y+9);
    ctx.font='600 10px monospace'; ctx.textAlign='right'; ctx.fillStyle=DIM;
    ctx.fillText('PRESET',R.x+R.w-pad,R.y+8);
    ctx.fillStyle=INK; ctx.font='700 12px monospace';
    ctx.fillText(P.presetName,R.x+R.w-pad,R.y+20);
    ctx.textAlign='left';
    // viewport
    var zoneH=R.h-42, vpY=R.y+42, vpH=Math.round(zoneH*(phone?0.34:0.44));
    ctx.fillStyle='#101013'; ctx.fillRect(R.x+pad,vpY,iw,vpH);
    var vals=[ctrlVal(P.knobs[0],wg),ctrlVal(P.knobs[1],wg),ctrlVal(P.sliders[0],wg),ctrlVal(P.sliders[1],wg)];
    if(i===0) drawVox(R.x+pad,vpY,iw,vpH,P,vals,ct,wg);
    if(i===1) drawVid(R.x+pad,vpY,iw,vpH,P,vals,ct,wg);
    if(i===2) drawDrum(R.x+pad,vpY,iw,vpH,P,vals,ct,wg);
    // knobs
    var ctrlH=zoneH-vpH, kR=Math.max(12,Math.min(26,ctrlH*0.16));
    var kY=vpY+vpH+kR+5;
    drawKnob(R.x+pad+iw*0.27,kY,kR,P.knobs[0],wg);
    drawKnob(R.x+pad+iw*0.73,kY,kR,P.knobs[1],wg);
    // sliders
    var sY=kY+kR+Math.round(kR*0.62)+16;
    drawSlider(R.x+pad,sY,iw,P.sliders[0],wg);
    drawSlider(R.x+pad,sY+Math.min(30,ctrlH*0.24),iw,P.sliders[1],wg);
  }

  // RESET button
  var rg=resetGeom();
  rr(rg.x,rg.y,rg.w,rg.h,10); ctx.fillStyle=REDFIELD; ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle=RED; ctx.stroke();
  ctx.fillStyle=RED; ctx.font='700 '+Math.round(rg.h*0.34)+'px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('RESET',rg.x+rg.w/2,rg.y+rg.h/2+1);

  // reset flash (bar 13 slam + tap slam)
  var sinceReset=ct-BAR*12;
  if((sinceReset>=0&&sinceReset<0.08)||(t-flashAt>=0&&t-flashAt<0.08)){
    ctx.globalAlpha=0.85; ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

fit();
draw(now());
if(typeof requestAnimationFrame==='function'){
  (function loop(){ draw(now()); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
