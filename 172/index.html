<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No.172 Spiral Bloom Tessellation</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #101014; overflow: hidden; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 14px;
    text-align: center; font: 13px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #E8E4D8; opacity: 0.7; pointer-events: none; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tap for a new spiral field</div>
<script>
'use strict';
// No.172 Spiral Bloom Tessellation. Kite tiles on a twisted polar
// grid: S spiral boundary curves and geometrically growing rings
// divide the panel into kite quads (plus a fan of triangles at the
// centre). In unwrapped (spiral, ring) coordinates the cells form a
// plain cylinder grid, so the adjacency graph is bipartite and a BFS
// two-colouring in lapis and bone always exists. The cycle: tiles
// assemble from the centre, hold, then knot strands trace the tile
// edges with computed over/under gaps at every vertex, the plain
// outlines fade to exactly zero, and the woven design holds. A tap
// reseeds a new arrangement.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var LAPIS = '#2E6BE6', BONE = '#E8E4D8', GROUND = '#101014';
var W = 0, H = 0;
var T = 21000, OFFSET = 16000;
var seed = 20240702;
(function () {
  var m = /seed=(\d+)/.exec(location.search || '');
  if (m) seed = parseInt(m[1], 10) >>> 0;
})();
var reseedAt = -1; // performance timestamp of last tap reseed

function rng(seedIn) {
  var a = seedIn >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function isPhone() {
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  return Math.min(sw, sh) < 700 || H > W * 1.15;
}

// ---------- field construction (unit panel coords, centre 0.5,0.5) --
var F = null;
function buildField(seedIn) {
  var rand = rng(seedIn);
  var S = [8, 10, 12][Math.floor(rand() * 3)];       // arms, always even
  var dir = rand() < 0.5 ? 1 : -1;
  var rho = 1.32 + rand() * 0.13;                    // ring growth
  var twist = 0.5 + rand() * 0.35;                   // cells of twist per ring
  var th0 = rand() * Math.PI * 2;
  var swap = rand() < 0.5;
  var r0 = 0.045, rMax = 0.78;
  var alpha = dir * twist * (2 * Math.PI / S) / Math.log(rho);
  var radii = [r0];
  while (radii[radii.length - 1] < rMax) radii.push(radii[radii.length - 1] * rho);
  var K = radii.length - 1; // tile rings 0..K-1

  function vtx(k, j) {
    var r = radii[k];
    var th = th0 + dir * 2 * Math.PI * (j % S) / S + alpha * Math.log(r / r0);
    return [0.5 + r * Math.cos(th), 0.5 + r * Math.sin(th)];
  }
  function ptOnSpiral(j, r) {
    var th = th0 + dir * 2 * Math.PI * (j % S) / S + alpha * Math.log(r / r0);
    return [0.5 + r * Math.cos(th), 0.5 + r * Math.sin(th)];
  }
  function ptOnCircle(k, j, f) { // f in (0,1) across cell j at ring k
    var r = radii[k];
    var th = th0 + dir * 2 * Math.PI * (j + f) / S + alpha * Math.log(r / r0);
    return [0.5 + r * Math.cos(th), 0.5 + r * Math.sin(th)];
  }

  var tiles = []; // {pts, ring, j, tri, col, order}
  var i, j, k;
  for (j = 0; j < S; j++) { // centre fan triangles
    tiles.push({ pts: [[0.5, 0.5], vtx(0, j), vtx(0, j + 1)], ring: -1, j: j, tri: true, order: j });
  }
  for (k = 0; k < K; k++) {
    for (j = 0; j < S; j++) {
      var pts = [], s, f;
      for (s = 0; s <= 3; s++) { // up spiral j
        var rA = r0 * Math.pow(rho, k + s / 3);
        pts.push(ptOnSpiral(j, rA));
      }
      for (s = 1; s <= 3; s++) pts.push(ptOnCircle(k + 1, j, s / 3)); // outer arc
      for (s = 2; s >= 0; s--) { // down spiral j+1
        var rB = r0 * Math.pow(rho, k + s / 3);
        pts.push(ptOnSpiral(j + 1, rB));
      }
      for (s = 2; s >= 1; s--) pts.push(ptOnCircle(k, j, s / 3)); // inner arc back
      tiles.push({ pts: pts, ring: k, j: j, tri: false, order: S + k * S + j });
    }
  }

  // adjacency + BFS two-colouring on the actual edge graph
  function key(ring, j) { return ring + ':' + ((j % S + S) % S); }
  var byKey = {};
  tiles.forEach(function (t, idx) { byKey[key(t.ring, t.j)] = idx; });
  var adj = tiles.map(function () { return []; });
  function link(a, b) { if (a !== undefined && b !== undefined) { adj[a].push(b); adj[b].push(a); } }
  tiles.forEach(function (t, idx) {
    var r = t.ring, jj = t.j;
    link(idx, byKey[key(r, jj + 1)]);
    link(idx, byKey[key(r, jj - 1)]);
    if (r === -1) link(idx, byKey[key(0, jj)]);
    else {
      link(idx, byKey[key(r + 1, jj)]);
      link(idx, byKey[key(r - 1, jj)]);
    }
  });
  var col = new Array(tiles.length).fill(-1);
  col[0] = 0;
  var queue = [0];
  while (queue.length) {
    var cur = queue.shift();
    for (i = 0; i < adj[cur].length; i++) {
      var nb = adj[cur][i];
      if (col[nb] === -1) { col[nb] = 1 - col[cur]; queue.push(nb); }
    }
  }
  tiles.forEach(function (t, idx) {
    var c = col[idx] === -1 ? (t.ring + t.j) % 2 : col[idx];
    if (swap) c = 1 - c;
    t.fill = c === 0 ? LAPIS : BONE;
    // centroid for the assembly pop
    var cx = 0, cy = 0;
    t.pts.forEach(function (p) { cx += p[0]; cy += p[1]; });
    t.cx = cx / t.pts.length; t.cy = cy / t.pts.length;
  });

  // knot strands: spirals, circles, spokes. Each strand: point list
  // plus trim intervals (arc-length ranges skipped where it passes
  // under at a vertex).
  function strandFrom(pts) {
    var cum = [0];
    for (i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
    }
    return { pts: pts, cum: cum, len: cum[cum.length - 1], trims: [], delay: 0 };
  }
  function addTrim(st, sAt, half) {
    st.trims.push([Math.max(0, sAt - half), Math.min(st.len, sAt + half)]);
  }
  var strands = [], spirals = [], circles = [], spokes = [];
  for (j = 0; j < S; j++) {
    var sp = [], steps = K * 4;
    for (i = 0; i <= steps; i++) sp.push(ptOnSpiral(j, r0 * Math.pow(rho, K * i / steps)));
    var stS = strandFrom(sp); stS.delay = 0.03 * (j / S);
    spirals.push(stS); strands.push(stS);
    var sk = strandFrom([[0.5, 0.5], vtx(0, j)]);
    spokes.push(sk); strands.push(sk);
  }
  for (k = 1; k < K; k++) {
    var cp = [], seg = S * 4;
    for (i = 0; i <= seg; i++) {
      var th = th0 + dir * 2 * Math.PI * i / seg + alpha * Math.log(radii[k] / r0);
      cp.push([0.5 + radii[k] * Math.cos(th), 0.5 + radii[k] * Math.sin(th)]);
    }
    var stC = strandFrom(cp); stC.delay = 0.05 + 0.12 * (k / K);
    circles.push(stC); strands.push(stC);
  }
  // over/under at each vertex V(k,j), k=1..K-1: parity (j+k) picks
  // the over strand; the under strand is trimmed around the vertex.
  function arcAt(st, x, y) { // arc length of closest point on strand
    var best = 0, bd = 1e9;
    for (i = 0; i < st.pts.length; i++) {
      var dx = st.pts[i][0] - x, dy = st.pts[i][1] - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = st.cum[i]; }
    }
    return best;
  }
  var gapHalf = 0.5 * (2 * Math.PI * r0 / S) * 1.15;
  for (k = 1; k < K; k++) {
    gapHalf = 0.5 * (2 * Math.PI * radii[k] / S) * 0.17;
    for (j = 0; j < S; j++) {
      var v = vtx(k, j);
      var sSp = arcAt(spirals[j], v[0], v[1]);
      var sCi = arcAt(circles[k - 1], v[0], v[1]);
      if ((j + k) % 2 === 0) addTrim(circles[k - 1], sCi, gapHalf);
      else addTrim(spirals[j], sSp, gapHalf);
    }
  }
  strands.forEach(function (st) { // merge trims
    st.trims.sort(function (a, b) { return a[0] - b[0]; });
    var merged = [];
    st.trims.forEach(function (iv) {
      var last = merged[merged.length - 1];
      if (last && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]);
      else merged.push([iv[0], iv[1]]);
    });
    st.trims = merged;
  });

  return { tiles: tiles, strands: strands, N: tiles.length };
}
F = buildField(seed);

// ---------- layout -----------------------------------------------------
var panel = { x: 0, y: 0, s: 100 };
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var side = isPhone() ? Math.min(W * 0.97, H * 0.8) : Math.min(W, H) * 0.92;
  panel.s = side;
  panel.x = (W - side) / 2;
  panel.y = (H - side) / 2;
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function easeOut(k) { return 1 - Math.pow(1 - k, 3); }
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function PX(p) { return [panel.x + p[0] * panel.s, panel.y + p[1] * panel.s]; }

function drawStrand(st, upto) {
  // draw strand points up to arc length `upto`, skipping trims
  var pts = st.pts, cum = st.cum, i;
  var segs = [], cur = null, prevS = 0;
  function inTrim(s) {
    for (var q = 0; q < st.trims.length; q++)
      if (s >= st.trims[q][0] && s <= st.trims[q][1]) return true;
    return false;
  }
  for (i = 0; i < pts.length; i++) {
    var s = cum[i];
    if (s > upto) break;
    if (inTrim(s)) { cur = null; continue; }
    if (!cur) { cur = [pts[i]]; segs.push(cur); }
    else cur.push(pts[i]);
    prevS = s;
  }
  // partial segment toward the next point
  if (i < pts.length && upto > prevS && cur) {
    var f = (upto - prevS) / (cum[i] - prevS || 1);
    cur.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f,
              pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f]);
  }
  for (var q = 0; q < segs.length; q++) {
    if (segs[q].length < 2) continue;
    ctx.beginPath();
    segs[q].forEach(function (p, ix) {
      var w = PX(p);
      if (ix === 0) ctx.moveTo(w[0], w[1]); else ctx.lineTo(w[0], w[1]);
    });
    ctx.stroke();
  }
}

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var t = reseedAt >= 0 ? (now - reseedAt) % T : (now + OFFSET) % T;
  var ts = t / 1000;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  // phases: assemble 0-2, hold 2-8, knot 8-11, outline fade 11-13, hold 13-21
  var outlineA = 1, knotP = 0;
  if (ts >= 8 && ts < 11) knotP = (ts - 8) / 3;
  else if (ts >= 11) knotP = 1;
  if (ts >= 11 && ts < 13) outlineA = 1 - (ts - 11) / 2;
  else if (ts >= 13) outlineA = 0;

  ctx.save();
  ctx.beginPath();
  ctx.rect(panel.x, panel.y, panel.s, panel.s);
  ctx.clip();

  var lw = Math.max(1.6, panel.s * 0.0038);
  var i, j;
  for (i = 0; i < F.tiles.length; i++) {
    var tl = F.tiles[i];
    var a = 1, sc = 1;
    if (ts < 2) {
      var lt = tl.order / F.N * 1.55;
      a = clamp01((ts - lt) / 0.4);
      if (a <= 0) continue;
      sc = 0.55 + 0.45 * easeOut(a);
    }
    ctx.globalAlpha = a;
    ctx.beginPath();
    tl.pts.forEach(function (p, ix) {
      var x = tl.cx + (p[0] - tl.cx) * sc, y = tl.cy + (p[1] - tl.cy) * sc;
      var w = PX([x, y]);
      if (ix === 0) ctx.moveTo(w[0], w[1]); else ctx.lineTo(w[0], w[1]);
    });
    ctx.closePath();
    ctx.fillStyle = tl.fill;
    ctx.fill();
    if (outlineA > 0) {
      ctx.globalAlpha = a * outlineA;
      ctx.strokeStyle = GROUND;
      ctx.lineWidth = lw;
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  if (knotP > 0) {
    ctx.strokeStyle = GROUND;
    ctx.lineWidth = Math.max(2.2, panel.s * 0.0058);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (j = 0; j < F.strands.length; j++) {
      var st = F.strands[j];
      var f = clamp01((knotP * 1.18 - st.delay) / 0.82);
      if (f <= 0) continue;
      drawStrand(st, st.len * f);
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function reseed(now) {
  seed = (seed * 1103515245 + 12345 + (now | 0)) >>> 0;
  F = buildField(seed);
  reseedAt = now;
}
canvas.addEventListener('pointerdown', function (e) {
  reseed(e.timeStamp || 0);
});

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
