<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№57 · Spirograph Knot</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2eee6; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(24,24,24,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to shift the pen</div>
<script>
'use strict';
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '57', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }

let dragD=null, relAt=-1e9, relD=0;
function curvePoint(R,r,d,ang,scale,rot){
  const x=(R-r)*Math.cos(ang)+d*Math.cos((R-r)/r*ang);
  const y=(R-r)*Math.sin(ang)-d*Math.sin((R-r)/r*ang);
  const c=Math.cos(rot), s=Math.sin(rot);
  return [x*c-y*s, x*s+y*c];
}
// simpler direct draw (closed when (R-r)/r rational; use total angle = 2PI * r/gcd style via LCM approach: use period 2PI*3 for r=3,R=5 etc.)
function drawHypo(R,r,d,frac,scale,cx,cy,rot,color){
  const period=Math.PI*2*r; // closes for integer R,r
  const steps=2400, n=Math.floor(frac*steps);
  if(n<2) return;
  ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.beginPath();
  let tip=null;
  for(let i=0;i<=n;i++){
    const ang=i/steps*period;
    let x=(R-r)*Math.cos(ang)+d*Math.cos((R-r)/r*ang);
    let y=(R-r)*Math.sin(ang)-d*Math.sin((R-r)/r*ang);
    const c=Math.cos(rot), s=Math.sin(rot);
    const X=x*c-y*s, Y=x*s+y*c;
    const px=cx+X*scale, py=cy+Y*scale;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    tip=[px,py];
  }
  ctx.stroke();
  return tip;
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#f2eee6'; ctx.fillRect(0,0,w,h);
  const total=12, t=(nowMs/1000)%total, cyc=Math.floor((nowMs/1000)/total);
  const rot=cyc*0.15;
  const cx=w/2, cy=h/2;
  const dOff=(dragD!==null?dragD:0);
  let tip=null;
  if(t<6){
    const scale=Math.min(w,h)*0.85/ (2*( (5-3)+2.2+dOff ));
    tip=drawHypo(5,3,2.2+dOff, smooth(Math.min(1,t/5.5)), scale, cx, cy, rot, '#181818');
    if(t>5.5){ /* hold */ }
  } else {
    const scale1=Math.min(w,h)*0.85/(2*((5-3)+2.2+dOff));
    drawHypo(5,3,2.2+dOff,1,scale1,cx,cy,rot,'#b9b4a6');
    const scale2=Math.min(w,h)*0.85/(2*((7-5)+3+dOff));
    tip=drawHypo(7,5,3+dOff, smooth(Math.min(1,(t-6)/5.5)), scale2, cx, cy, rot+0.3, '#3b4bd0');
  }
  return {};
}

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(9000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);

let dragOn57=false;
canvas.addEventListener('pointerdown',ev=>{dragOn57=true; const [w,h]=viewportWH(); dragD=((ev.clientX-w/2)/Math.max(1,w))*2;});
canvas.addEventListener('pointermove',ev=>{ if(!dragOn57) return; const [w,h]=viewportWH(); dragD=Math.max(-1.5,Math.min(1.5,(ev.clientX-w/2)/Math.max(1,w)*2)); });
function endDrag57(){ dragOn57=false; dragD=null; }
canvas.addEventListener('pointerup',endDrag57); canvas.addEventListener('pointercancel',endDrag57);

window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
