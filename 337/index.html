<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.337 Cutter Stack</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4EFE3; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.337 Cutter Stack (myclayco).
// After their Animal/Bird stack cutters: one hand-authored
// closed bird profile (beak notch, tail flick, a slight
// human wobble baked into every control point) rendered as
// exactly 7 concentric outlines at a x1.5 geometric size
// progression, centred on paper, stroke only, no fill. The
// fourth (middle) outline is Sculpey teal, the other six
// are ink. Watch-only: a 20s seamless breathing loop. The
// bezier handles oscillate with phase offsets from a fixed
// seed table held as JS data, never runtime noise, and
// every oscillation completes whole sine cycles in 20s,
// so frame 20s is pixel-identical to frame 0. All marks
// are drawn directly each frame on one canvas: no offscreen
// canvas, no gradients, no shadowBlur, no filters.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F4EFE3', INK = '#1C1A17', TEAL = '#2E8B8B';
var DW = 1280, DH = 900;
var LOOP = 20;              // seconds, seamless
var CLOCK0 = 6.4;           // offset clock: frame one is mid-breath
var TAU = Math.PI * 2;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;

// ---- the one hand-authored bird profile ----------------------
// Anchor points in local units, y down, bird facing right.
// The beak notch (index 1) cuts back in between the beak
// tip (0) and the lower beak (2); the tail flick is the
// pointed tip at index 10. Coordinates are deliberately a
// little irregular: the human wobble is authored in, not
// smoothed away.
var PROFILE = [
  [ 1.03, -0.16],   // 0 beak tip
  [ 0.86, -0.04],   // 1 beak notch
  [ 0.98,  0.08],   // 2 lower beak
  [ 0.81,  0.30],   // 3 throat
  [ 0.62,  0.60],   // 4 breast
  [ 0.16,  0.80],   // 5 belly front
  [-0.28,  0.83],   // 6 belly
  [-0.58,  0.70],   // 7 belly back
  [-0.74,  0.40],   // 8 vent
  [-0.84,  0.10],   // 9 tail under (underside of the tail root)
  [-1.00, -0.28],   // 10 tail tip (the flick)
  [-0.78, -0.16],   // 11 tail top (top side of the tail root)
  [-0.52, -0.42],   // 12 back lower
  [-0.12, -0.62],   // 13 back
  [ 0.32, -0.76],   // 14 crown
  [ 0.63, -0.65],   // 15 forehead
  [ 0.85, -0.38]    // 16 face
];
var NP = PROFILE.length;
// Per-anchor handle tension for the Catmull-Rom to bezier
// conversion. Low tension keeps a point crisp: the notch
// and the tail tip stay pointed, the rest of the bird
// stays round.
var TENSION = [
  0.10, 0.03, 0.12, 0.17, 0.17, 0.17, 0.17, 0.17, 0.14,
  0.10, 0.07, 0.10, 0.14, 0.17, 0.17, 0.16, 0.14
];
// Fixed seed table, one row per control point, held as JS
// data: static jitter (jx, jy), anchor wobble (amp, whole
// cycles per loop, phase), handle wobble (amp, whole cycles
// per loop, phase). Cycles are integers 1 to 3, so every
// offset returns exactly to its start at the loop seam.
var SEED = [
  [ 0.012, -0.008, 0.010, 1, 0.4, 0.020, 2, 1.1],
  [-0.006,  0.010, 0.006, 2, 2.2, 0.010, 3, 0.3],
  [ 0.008,  0.014, 0.009, 1, 4.0, 0.018, 1, 2.6],
  [-0.014,  0.006, 0.014, 2, 1.3, 0.026, 2, 5.1],
  [ 0.005, -0.012, 0.016, 1, 5.3, 0.030, 1, 3.9],
  [ 0.016,  0.004, 0.012, 2, 0.9, 0.024, 3, 1.8],
  [-0.010,  0.016, 0.015, 1, 2.7, 0.028, 2, 0.6],
  [-0.004, -0.006, 0.011, 2, 3.6, 0.022, 1, 4.4],
  [ 0.014,  0.010, 0.013, 1, 1.9, 0.027, 2, 2.9],
  [-0.016, -0.002, 0.010, 2, 5.8, 0.020, 3, 5.6],
  [ 0.006, -0.016, 0.008, 1, 3.1, 0.014, 2, 1.4],
  [ 0.010,  0.012, 0.012, 2, 0.2, 0.023, 1, 0.9],
  [-0.008,  0.008, 0.014, 1, 4.7, 0.029, 2, 3.3],
  [ 0.002, -0.014, 0.016, 2, 2.9, 0.031, 3, 2.1],
  [-0.012, -0.010, 0.013, 1, 0.7, 0.025, 1, 5.9],
  [ 0.009,  0.006, 0.011, 2, 4.4, 0.021, 2, 0.1],
  [-0.005, -0.012, 0.009, 1, 5.6, 0.017, 3, 4.9]
];
if (SEED.length !== NP || TENSION.length !== NP) throw new Error('Cutter Stack seed tables must match the profile');

// Base points: profile re-centred on its own bounding box,
// static jitter applied once. The breathing is layered on
// top of these every frame.
var BASE = [];
(function () {
  var mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity;
  var i, p;
  for (i = 0; i < NP; i++) {
    p = PROFILE[i];
    if (p[0] < mnx) mnx = p[0];
    if (p[0] > mxx) mxx = p[0];
    if (p[1] < mny) mny = p[1];
    if (p[1] > mxy) mxy = p[1];
  }
  var cx = (mnx + mxx) / 2, cy = (mny + mxy) / 2;
  for (i = 0; i < NP; i++) {
    BASE.push([PROFILE[i][0] - cx + SEED[i][0], PROFILE[i][1] - cy + SEED[i][1]]);
  }
})();

// ---- the stack: exactly 7 scales, x1.5 progression -----------
// Unit size U chosen so the largest outline (factor 1.5^3)
// spans about 730 design px wide at rest and stays inside
// the frame at maximum breath.
var U = 103;
var SCALES = [];
(function () {
  for (var k = 0; k < 7; k++) SCALES.push(Math.pow(1.5, k - 3));
})();
if (SCALES.length !== 7) throw new Error('Cutter Stack needs exactly 7 outlines');
for (var q = 1; q < SCALES.length; q++) {
  if (Math.abs(SCALES[q] / SCALES[q - 1] - 1.5) > 1e-9) throw new Error('Cutter Stack progression must be x1.5');
}
var MIDDLE = 3;   // the fourth outline carries the teal

// Wobbled anchors and handles for one instant of the loop,
// in local units. Anchor wobble is an elliptical sine from
// the seed table; handles come from Catmull-Rom over the
// wobbled anchors, then take their own seeded offset.
var anch = [], hout = [], hin = [];
function pose(tau) {
  var i, s, a;
  for (i = 0; i < NP; i++) {
    s = SEED[i];
    a = TAU * s[3] * tau / LOOP + s[4];
    anch[i] = [
      BASE[i][0] + s[2] * Math.sin(a),
      BASE[i][1] + s[2] * 0.8 * Math.cos(a)
    ];
  }
  for (i = 0; i < NP; i++) {
    s = SEED[i];
    var pv = anch[(i + NP - 1) % NP], nx = anch[(i + 1) % NP];
    var dx = (nx[0] - pv[0]) * TENSION[i], dy = (nx[1] - pv[1]) * TENSION[i];
    a = TAU * s[6] * tau / LOOP + s[7];
    var hx = s[5] * Math.sin(a), hy = s[5] * 0.8 * Math.cos(a);
    hout[i] = [anch[i][0] + dx + hx, anch[i][1] + dy + hy];
    hin[i] = [anch[i][0] - dx + hx, anch[i][1] - dy + hy];
  }
}

function drawStack(tau) {
  pose(tau);
  // One whole breath cycle per loop: the press and release.
  var breath = 1 + 0.02 * Math.sin(TAU * tau / LOOP);
  var cx = DW / 2, cy = DH / 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (var k = 0; k < SCALES.length; k++) {
    var f = U * SCALES[k] * breath;
    ctx.strokeStyle = (k === MIDDLE) ? TEAL : INK;
    ctx.lineWidth = 1.4 + (2.03 * f) * 0.0055;
    ctx.beginPath();
    ctx.moveTo(cx + anch[0][0] * f, cy + anch[0][1] * f);
    for (var i = 0; i < NP; i++) {
      var j = (i + 1) % NP;
      ctx.bezierCurveTo(
        cx + hout[i][0] * f, cy + hout[i][1] * f,
        cx + hin[j][0] * f, cy + hin[j][1] * f,
        cx + anch[j][0] * f, cy + anch[j][1] * f
      );
    }
    ctx.closePath();
    ctx.stroke();
  }
}

function draw(tau) {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, DW, DH);
  drawStack(tau);
}

// ---- sizing, frame, loop --------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Centred fit: the shaped composition keeps its shape at
  // any aspect, and the page ground is the paper colour.
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var tau = (((time || 0) / 1000) + CLOCK0) % LOOP;
  draw(tau);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
