<!DOCTYPE html>
<!-- NOT-THE-SAME-MAN-9115 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Not the Same Man</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f121b; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: default; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* №9115 "Not the Same Man" — core driver logic (no DOM).
 * Driver: every full bank-to-bank crossing exchanges matter. The stepper
 * deposits flecks of its own pigment into the river and absorbs the river's
 * pigment into itself. After N crossings neither keeps its original
 * composition. Tap on the stepper resets it ("a new man"); the river keeps
 * its history.
 */
const CrossingPiece = (() => {
  const ORIG_STEPPER = [233, 214, 184]; // bone / ochre
  const ORIG_RIVER = [23, 63, 71];      // deep teal-ink
  const DEPOSIT_PER_CROSSING = 12;
  const ABSORB = 0.22;  // stepper lerps toward river pigment per crossing
  const STAIN = 0.06;   // river lerps toward stepper pigment per crossing
  const FLECK_LIFE = 25; // seconds
  const DRIFT_MIN = 18, DRIFT_MAX = 42; // px/s downstream (+x)

  function lerp(a, b, t) { return a + (b - a) * t; }
  function mix(c1, c2, t) {
    return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  }
  function dist(c1, c2) {
    const d0 = c1[0] - c2[0], d1 = c1[1] - c2[1], d2 = c1[2] - c2[2];
    return Math.sqrt(d0 * d0 + d1 * d1 + d2 * d2);
  }
  function css(c, a) {
    const r = Math.round(c[0]), g = Math.round(c[1]), b = Math.round(c[2]);
    return a === undefined ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${a})`;
  }

  function createState(W, H, rng) {
    rng = rng || Math.random;
    const riverTop = H * 0.40, riverBottom = H * 0.60;
    return {
      W, H, time: 0, rng,
      riverTop, riverBottom, bankMargin: 34,
      stepper: { x: W * 0.5, y: H * 0.22, r: 26, pigment: ORIG_STEPPER.slice() },
      riverPigment: ORIG_RIVER.slice(),
      flecks: [], // {x,y,vx,vy,age,life,color:[r,g,b],kind:'deposit'}
      crossings: 0,
      depositedTotal: 0,
      absorbedUnits: 0,
      lastBank: 'upper',
      enteredWater: false,
      inWaterPath: [],
    };
  }

  function sideOf(st, y) {
    if (y < st.riverTop - st.bankMargin) return 'upper';
    if (y > st.riverBottom + st.bankMargin) return 'lower';
    return 'water';
  }

  function spawnDeposit(st, x, y, color) {
    const rng = st.rng;
    st.flecks.push({
      x, y,
      vx: DRIFT_MIN + rng() * (DRIFT_MAX - DRIFT_MIN),
      vy: (rng() - 0.5) * 8,
      age: 0,
      life: FLECK_LIFE * (0.8 + 0.4 * rng()),
      color: color.slice(),
      kind: 'deposit',
      w: 2.5 + rng() * 2.5,
    });
  }

  function completeCrossing(st) {
    const stepperBefore = st.stepper.pigment.slice();
    const riverBefore = st.riverPigment.slice();
    // Deposit exactly DEPOSIT_PER_CROSSING flecks along the water path.
    const path = st.inWaterPath.length ? st.inWaterPath : [{ x: st.stepper.x, y: st.stepper.y }];
    for (let i = 0; i < DEPOSIT_PER_CROSSING; i++) {
      const p = path[Math.floor((i * (path.length - 1)) / (DEPOSIT_PER_CROSSING - 1))];
      const jx = (st.rng() - 0.5) * 10, jy = (st.rng() - 0.5) * 10;
      spawnDeposit(st, p.x + jx, p.y + jy, stepperBefore);
    }
    st.depositedTotal += DEPOSIT_PER_CROSSING;
    // Bidirectional exchange, computed from pre-crossing values.
    st.stepper.pigment = mix(stepperBefore, riverBefore, ABSORB);
    st.riverPigment = mix(riverBefore, stepperBefore, STAIN);
    st.crossings += 1;
    st.absorbedUnits += 1;
  }

  // Move the stepper (called by drag). Runs the crossing state machine.
  function moveStepper(st, x, y) {
    const s0 = sideOf(st, st.stepper.y);
    st.stepper.x = Math.max(st.stepper.r, Math.min(st.W - st.stepper.r, x));
    st.stepper.y = Math.max(st.stepper.r, Math.min(st.H - st.stepper.r, y));
    const s1 = sideOf(st, st.stepper.y);
    if (s1 === 'water') {
      st.enteredWater = true;
      const last = st.inWaterPath[st.inWaterPath.length - 1];
      if (!last || Math.hypot(st.stepper.x - last.x, st.stepper.y - last.y) > 6) {
        st.inWaterPath.push({ x: st.stepper.x, y: st.stepper.y });
      }
    } else {
      // Reached a bank.
      if (st.enteredWater && st.lastBank && s1 !== st.lastBank && s0 !== s1) {
        completeCrossing(st);
      }
      st.lastBank = s1;
      st.enteredWater = false;
      st.inWaterPath = [];
    }
  }

  // Tap on the stepper: a new man. River keeps its history.
  function tapReset(st) {
    st.stepper.pigment = ORIG_STEPPER.slice();
    st.absorbedUnits = 0;
  }

  function update(st, dt) {
    st.time += dt;
    for (let i = st.flecks.length - 1; i >= 0; i--) {
      const f = st.flecks[i];
      f.age += dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.age >= f.life || f.x > st.W + 24) st.flecks.splice(i, 1);
    }
  }

  function depositCount(st) {
    let n = 0;
    for (const f of st.flecks) if (f.kind === 'deposit') n++;
    return n;
  }

  return {
    createState, moveStepper, tapReset, update, depositCount,
    sideOf, mix, dist, css,
    ORIG_STEPPER, ORIG_RIVER,
    DEPOSIT_PER_CROSSING, ABSORB, STAIN,
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = CrossingPiece;

</script>
<script>
(() => {
  const CP = CrossingPiece;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const BANK = [15, 18, 27];
  let W = 0, H = 0, DPR = 1;
  let st = null;
  let streaks = [];
  let wake = []; // visual-only particles (not counted): {x,y,vx,vy,age,life,color}
  let bankSpeck = null;

  function seedSpeckle() {
    bankSpeck = document.createElement('canvas');
    bankSpeck.width = Math.max(1, W); bankSpeck.height = Math.max(1, H);
    const g = bankSpeck.getContext('2d');
    let s = 1234567;
    const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    for (let i = 0; i < W * H / 380; i++) {
      const x = rnd() * W, y = rnd() * H;
      const inRiver = y > st.riverTop && y < st.riverBottom;
      if (inRiver) continue;
      g.fillStyle = `rgba(255,255,255,${0.015 + rnd() * 0.03})`;
      g.fillRect(x, y, 1.4, 1.4);
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const keepPig = st ? st.stepper.pigment.slice() : null;
    const keepRiver = st ? st.riverPigment.slice() : null;
    st = CP.createState(W, H);
    if (keepPig) { st.stepper.pigment = keepPig; st.riverPigment = keepRiver; }
    streaks = [];
    for (let i = 0; i < 46; i++) {
      streaks.push({ x: Math.random() * W, y: st.riverTop + Math.random() * (st.riverBottom - st.riverTop), len: 40 + Math.random() * 120, sp: 14 + Math.random() * 30 });
    }
    seedSpeckle();
  }
  window.addEventListener('resize', resize);

  // ---- pointer: drag the stepper across; tap the stepper for a new man ----
  let dragging = false, downT = 0, downX = 0, downY = 0, downOnStepper = false;
  function evPos(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left), (e.clientY - r.top)];
  }
  canvas.addEventListener('pointerdown', (e) => {
    const [x, y] = evPos(e);
    const d = Math.hypot(x - st.stepper.x, y - st.stepper.y);
    downT = performance.now(); downX = x; downY = y;
    downOnStepper = d < st.stepper.r * 1.7;
    if (downOnStepper) { dragging = true; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; }
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const [x, y] = evPos(e);
    CP.moveStepper(st, x, y);
    const side = CP.sideOf(st, st.stepper.y);
    if (side === 'water') {
      for (let i = 0; i < 2; i++) {
        wake.push({ x: st.stepper.x + (Math.random() - 0.5) * 30, y: st.stepper.y + (Math.random() - 0.5) * 30,
          vx: 24 + Math.random() * 30, vy: (Math.random() - 0.5) * 14,
          age: 0, life: 1.1, color: CP.mix(st.stepper.pigment, st.riverPigment, 0.5) });
      }
    }
  });
  canvas.addEventListener('pointerup', (e) => {
    const [x, y] = evPos(e);
    const dt = performance.now() - downT;
    const moved = Math.hypot(x - downX, y - downY);
    if (downOnStepper && dt < 300 && moved < 12) CP.tapReset(st); // a new man
    dragging = false; downOnStepper = false; canvas.style.cursor = 'default';
  });
  canvas.addEventListener('pointercancel', () => { dragging = false; downOnStepper = false; });

  function drawFleck(f) {
    const a = Math.max(0, 1 - f.age / f.life);
    ctx.fillStyle = CP.css(f.color, 0.85 * a);
    ctx.beginPath();
    ctx.ellipse(f.x, f.y, f.w || 3, (f.w || 3) * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    CP.update(st, dt);
    // wake decay (visual only)
    for (let i = wake.length - 1; i >= 0; i--) {
      const p = wake[i]; p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.age >= p.life) wake.splice(i, 1);
    }
    for (const s of streaks) { s.x += s.sp * dt; if (s.x - s.len > W) { s.x = -s.len; s.y = st.riverTop + Math.random() * (st.riverBottom - st.riverTop); } }

    // banks
    ctx.fillStyle = CP.css(BANK);
    ctx.fillRect(0, 0, W, st.riverTop);
    ctx.fillRect(0, st.riverBottom, W, H - st.riverBottom);
    if (bankSpeck) ctx.drawImage(bankSpeck, 0, 0, W, H);
    // river
    const rc = st.riverPigment;
    ctx.fillStyle = CP.css([rc[0] * 0.55, rc[1] * 0.55, rc[2] * 0.55]);
    ctx.fillRect(0, st.riverTop, W, st.riverBottom - st.riverTop);
    // current streaks
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    for (const s of streaks) {
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + s.len, s.y); ctx.stroke();
    }
    // deposits + wake
    for (const f of st.flecks) drawFleck(f);
    for (const p of wake) {
      const a = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = CP.css(p.color, 0.5 * a);
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2); ctx.fill();
    }
    // stepper (render-only bob; state untouched)
    const bob = dragging ? 0 : Math.sin(st.time * 1.4) * 1.6;
    const sx = st.stepper.x, sy = st.stepper.y + bob, r = st.stepper.r;
    const rim = CP.mix(st.stepper.pigment, [8, 10, 14], 0.45);
    ctx.fillStyle = CP.css(st.stepper.pigment);
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = CP.css(rim); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.stroke();
    // crossings tally: small marks on the lower bank
    ctx.fillStyle = 'rgba(233,214,184,0.35)';
    for (let i = 0; i < Math.min(st.crossings, 40); i++) {
      ctx.fillRect(14 + i * 9, H - 18, 5, 8);
    }
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
  window.__piece9115 = { get state() { return st; }, CP };
})();
</script>
</body>
</html>
