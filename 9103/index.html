<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9103 · Mikado</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #17100b; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .ui {
    position: fixed; z-index: 3; color: #eadfc8;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-user-select: none; user-select: none;
  }
  #hud {
    top: 0; left: 0; right: 0; display: flex; align-items: flex-start;
    gap: 10px; padding: 12px 14px; pointer-events: none; flex-wrap: wrap;
  }
  .chip {
    background: rgba(16, 10, 6, 0.62); border: 1px solid rgba(234, 223, 200, 0.16);
    border-radius: 6px; padding: 7px 11px; font-size: 12px; line-height: 1.45;
    pointer-events: auto; backdrop-filter: blur(3px);
  }
  #titleChip { font-size: 13px; letter-spacing: 0.06em; }
  #titleChip b { color: #f0c169; font-weight: 600; }
  #statusChip { flex: 1 1 220px; text-align: center; color: #f3e9d2; }
  #statusChip .turn { color: #f0c169; }
  button {
    background: rgba(46, 30, 16, 0.85); color: #eadfc8; border: 1px solid rgba(234, 223, 200, 0.28);
    font: inherit; font-size: 12px; border-radius: 6px; padding: 7px 11px; cursor: pointer;
  }
  button:hover { background: rgba(74, 48, 24, 0.9); border-color: rgba(240, 193, 105, 0.6); }
  button.active { border-color: #f0c169; color: #f0c169; }
  #hint {
    left: 0; right: 0; bottom: 10px; text-align: center; font-size: 11.5px;
    color: rgba(234, 223, 200, 0.55); pointer-events: none; padding: 0 12px;
  }
  @media (max-width: 640px) { #hint { display: none; } #statusChip { order: 5; flex-basis: 100%; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="hud">
  <div class="chip" id="titleChip"><b>№9103 · MIKADO</b><br><span id="subLine">41 sticks · 170 points</span></div>
  <div class="chip" id="statusChip">Dropping the bundle…</div>
  <div class="chip" id="scoreChip">—</div>
  <div class="chip" style="display:flex; gap:6px;">
    <button id="btnDrop">New drop</button>
    <button id="btnMode">Solo</button>
    <button id="btnSound">Sound on</button>
    <button id="btnView">Reset view</button>
  </div>
</div>
<div class="ui" id="hint">Pull a stick along its own length, or grab an end and swing it around the stick lying across it — the crossing point is what the pile feels. Pinch or scroll to zoom into a cluster.</div>
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // №9103 · MIKADO — pick-up sticks, rebuilt from how the real game
  // is actually played (v2).
  //
  // The set (classic Mikado, 41 sticks, 170 points — Wikipedia,
  // "Mikado (game)"):
  //   1 × Mikado   blue spiral                        20 pts
  //   5 × Mandarin yellow/black, wide + end stripes   10 pts
  //   5 × Bonzen   orange, five stripes                5 pts
  //  15 × Samurai  green, three stripes                3 pts
  //  15 × Kuli     red, two stripes                    2 pts
  //
  // What the research changed (Wikipedia; Planet Finska's rules;
  // blinky.games' rules/strategy analysis; Our Pastimes):
  //  * THE DROP. A real drop is a fist of upright sticks opened on
  //    the table: they fan out radially and settle into a circular
  //    jumble a good deal wider than a stick is long — a loose disc
  //    with perimeter sticks lying clear ("cost nothing to take"),
  //    a denser core, and the odd loner. Some drops land as a tight
  //    "nest" instead. v1 dropped a knot; v2 drops the fan.
  //  * THE MOVES. Players pull a stick straight along its own
  //    length (either direction — "most pinned sticks are pinned
  //    one way only, check both ends"), press a tip so the far end
  //    lifts, and roll sticks free. In top-down terms: a stick lying
  //    across yours is a FULCRUM. Grab an end and your stick rotates
  //    around the crossing instead of ploughing through it. The
  //    disturbance law is unchanged and honest — a stick resting on
  //    yours feels the travel of the geometric crossing point, and
  //    sliding along your own axis moves no crossing at all — but
  //    motion is now constraint-driven, so the pivot emerges from
  //    the physics instead of being scripted.
  //  * THE HELPER. By the classic rule (Wikipedia, Planet Finska,
  //    Our Pastimes) a won Mikado — Mandarin in the simplified rule
  //    — may be used as a tool on later pulls. The digital
  //    translation shipped by other Mikado games: the holder steadies
  //    the pile with it, so one slip per turn is forgiven. That is
  //    the version here, stated openly in the UI.
  //  * READ THE HEAP. The pile is a stack: last dropped lies on top.
  //    Stress tints show which sticks carry your stick and how close
  //    they are to rolling; pinch/scroll zoom exists so a dense
  //    cluster can be read and worked at phone scale. A small
  //    tremor deadzone + friction deadband means a shaky hand is
  //    not a fault — only real movement is.
  // ---------------------------------------------------------------

  var RANKS = [
    { name: "Mikado",   pts: 20, count: 1,  wood: ["#6e4520", "#a9743a", "#59371a"], band: "spiral",  col: "#27418f" },
    { name: "Mandarin", pts: 10, count: 5,  wood: ["#8a5426", "#c98f45", "#74431e"], band: "mandarin", col: "#e8b91f" },
    { name: "Bonzen",   pts: 5,  count: 5,  wood: ["#8a5426", "#cf9a4e", "#74431e"], band: "five",    col: "#e0701a" },
    { name: "Samurai",  pts: 3,  count: 15, wood: ["#96602c", "#d8a659", "#7d4e22"], band: "three",   col: "#2e8b3a" },
    { name: "Kuli",     pts: 2,  count: 15, wood: ["#9c6832", "#e0b06a", "#835624"], band: "two",     col: "#c22f22" }
  ];
  var STICK_LEN = 1.0;          // world units; the camera scales the table
  var HALF_W = 0.0105;          // stick half-width in world units
  var TOTAL_PTS = 170;

  var qs = new URLSearchParams(location.search);
  var seedParam = qs.get("debug");
  var stateParam = qs.get("state");

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(seedParam ? (parseInt(seedParam, 10) || 1) : (Math.random() * 1e9) | 0);

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  // ---------------- geometry ----------------
  function segInt(p1, p2, p3, p4) {
    var d1x = p2.x - p1.x, d1y = p2.y - p1.y, d2x = p4.x - p3.x, d2y = p4.y - p3.y;
    var den = d1x * d2y - d1y * d2x;
    if (Math.abs(den) < 1e-12) return null;
    var t = ((p3.x - p1.x) * d2y - (p3.y - p1.y) * d2x) / den;
    var u = ((p3.x - p1.x) * d1y - (p3.y - p1.y) * d1x) / den;
    if (t < 0.015 || t > 0.985 || u < 0.015 || u > 0.985) return null;
    return { x: p1.x + t * d1x, y: p1.y + t * d1y, t: t, u: u };
  }
  function ptSegDist(px, py, a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var L2 = dx * dx + dy * dy;
    var t = L2 > 0 ? ((px - a.x) * dx + (py - a.y) * dy) / L2 : 0;
    t = clamp(t, 0, 1);
    var x = a.x + t * dx, y = a.y + t * dy;
    return { d: Math.hypot(px - x, py - y), t: t, x: x, y: y };
  }
  function segSegDist(a, b, c, d) {
    if (segIntRaw(a, b, c, d)) return 0;
    return Math.min(
      ptSegDist(a.x, a.y, c, d).d, ptSegDist(b.x, b.y, c, d).d,
      ptSegDist(c.x, c.y, a, b).d, ptSegDist(d.x, d.y, a, b).d);
  }
  function segIntRaw(p1, p2, p3, p4) {
    function s(ax, ay, bx, by, cx, cy) { return (bx - ax) * (cy - ay) - (by - ay) * (cx - ax); }
    var d1 = s(p3.x, p3.y, p4.x, p4.y, p1.x, p1.y), d2 = s(p3.x, p3.y, p4.x, p4.y, p2.x, p2.y);
    var d3 = s(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y), d4 = s(p1.x, p1.y, p2.x, p2.y, p4.x, p4.y);
    return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
  }

  // ---------------- audio: quiet wooden ticks ----------------
  var AC = null, masterGain = null, soundOn = true;
  function audio() {
    if (AC) { if (AC.state === "suspended") AC.resume(); return AC; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = AC.createGain(); masterGain.gain.value = 0.5; masterGain.connect(AC.destination);
    } catch (e) { AC = null; }
    return AC;
  }
  function tick(vol, freq, dur) {
    if (!soundOn || !audio()) return;
    var t = AC.currentTime;
    var nb = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
    var ch = nb.getChannelData(0);
    for (var i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    var src = AC.createBufferSource(); src.buffer = nb;
    var bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = 5;
    var g = AC.createGain(); g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(masterGain); src.start(t);
    var o = AC.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(freq * 0.62, t);
    o.frequency.exponentialRampToValueAtTime(freq * 0.3, t + dur);
    var og = AC.createGain(); og.gain.setValueAtTime(vol * 0.5, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(og); og.connect(masterGain); o.start(t); o.stop(t + dur + 0.02);
  }
  function tickSound() { tick(0.16, 1500 + Math.random() * 700, 0.05); }
  function settleSound() { tick(0.10, 900 + Math.random() * 300, 0.06); }
  function collectSound() { tick(0.14, 1200, 0.05); setTimeout(function () { tick(0.14, 1750, 0.06); }, 70); }
  function faultSound() {
    if (!soundOn || !audio()) return;
    var t = AC.currentTime;
    var nb = AC.createBuffer(1, AC.sampleRate * 0.14, AC.sampleRate);
    var ch = nb.getChannelData(0);
    for (var i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    var src = AC.createBufferSource(); src.buffer = nb;
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500;
    var g = AC.createGain(); g.gain.setValueAtTime(0.30, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    src.connect(lp); lp.connect(g); g.connect(masterGain); src.start(t);
    tick(0.12, 500, 0.09);
  }

  // ---------------- game state ----------------
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var statusEl = document.getElementById("statusChip");
  var scoreEl = document.getElementById("scoreChip");
  var subEl = document.getElementById("subLine");

  var sticks = [];            // all 41, in drop order (index = height)
  var mode = "solo";           // "solo" | "2p"
  var players = [
    { score: 0, taken: [], holdsHelper: false, helperReady: false },
    { score: 0, taken: [], holdsHelper: false, helperReady: false }
  ];
  var current = 0;             // current player index
  var soloFaults = 0;
  var streak = 0;              // consecutive clean pulls (current player / solo run)
  var floaters = [];           // {x, y, text, gold, t0} world-space score popups
  var gameOver = false;
  var busy = false;            // an animation owns the table
  var grabbed = null;          // stick being dragged
  var grabId = null;           // pointer id that owns the grab
  var pointer = { x: 0, y: 0, down: false };   // raw pointer, world units
  var smX = 0, smY = 0;        // smoothed pointer (tremor-filtered), world units
  var contacts = [];           // grabbed stick's contacts: {other, isLoader, acc, x, y}
  var faultFX = null;          // {stick, t0}
  var bannerUntil = 0;
  // camera: (cx, cy) = screen px of the view centre; s = px per world unit;
  // (ox, oy) = world point shown at the centre. Home: ox=oy=0, s=baseS.
  var view = { cx: 0, cy: 0, s: 400, baseS: 400, ox: 0, oy: 0 };
  var trayRects = [null, null];
  var DPR = 1, W = 0, H = 0;
  var dropStart = 0;

  function stickEnds(s) {
    var c = Math.cos(s.ang), n = Math.sin(s.ang), hl = s.len / 2;
    return {
      a: { x: s.cx - c * hl, y: s.cy - n * hl },
      b: { x: s.cx + c * hl, y: s.cy + n * hl },
      ux: c, uy: n
    };
  }
  function screenOf(x, y) {
    return [view.cx + (x - view.ox) * view.s, view.cy + (y - view.oy) * view.s];
  }
  function worldAt(px, py) {
    return { x: view.ox + (px - view.cx) / view.s, y: view.oy + (py - view.cy) / view.s };
  }

  function newDrop() {
    sticks = [];
    players = [
      { score: 0, taken: [], holdsHelper: false, helperReady: false },
      { score: 0, taken: [], holdsHelper: false, helperReady: false }
    ];
    current = 0; soloFaults = 0; streak = 0; floaters = [];
    gameOver = false; grabbed = null; grabId = null; contacts = [];
    faultFX = null;
    var bag = [];
    RANKS.forEach(function (r, ri) { for (var i = 0; i < r.count; i++) bag.push(ri); });
    // shuffle the bag: the drop order is the stack order
    for (var i = bag.length - 1; i > 0; i--) {
      var j = (rng() * (i + 1)) | 0, tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
    }
    // THE FAN: a fist of upright sticks opened on the table. Centres
    // scatter over a wide ellipse (~1.6 units across the long axis),
    // angles fan radially with a wild minority, a few loners land on
    // the perimeter lying clear. ~38% of drops tighten into a nest.
    var nest = rng() < 0.38;
    var R = nest ? 0.20 : 0.30;
    var bundleAng = rng() * Math.PI * 2;
    bag.forEach(function (ri, idx) {
      var loner = rng() < 0.14;
      var rr = Math.pow(rng(), 1.35) * R + (loner ? 0.10 + rng() * 0.08 : 0);
      var th = rng() * Math.PI * 2;
      var pick = rng();
      var ang;
      if (pick < 0.45) ang = th + Math.PI / 2 + (rng() - 0.5) * 1.5;   // tangential fan
      else if (pick < 0.75) ang = th + (rng() - 0.5) * 1.5;           // radial spoke
      else ang = rng() * Math.PI * 2;                                 // wild
      var s = {
        id: idx, rank: RANKS[ri], rankIdx: ri,
        cx: Math.cos(th) * rr, cy: Math.sin(th) * rr * 0.8,
        ang: ang,
        len: STICK_LEN, lenScale: 1,
        tol: 0.020 * (0.85 + rng() * 0.45),
        disturb: 0,
        state: "pile",
        dropDelay: idx * 16,
        fromCx: (rng() - 0.5) * 0.06, fromCy: (rng() - 0.5) * 0.05,
        fromAng: bundleAng + (rng() - 0.5) * 0.35,
        anim: null, trayPlayer: -1, traySlot: -1
      };
      s.finalCx = s.cx; s.finalCy = s.cy; s.finalAng = s.ang;
      sticks.push(s);
    });
    buildGraph();
    busy = true;
    dropStart = performance.now();
    setStatus(mode === "2p" ? "<span class='turn'>Player 1</span> to move" : "Your pile. Take it apart.");
    updateScore();
  }

  // loads[id] = sticks resting ON id; supports[id] = sticks id rests on.
  // Both carry the crossing point: loads judge faults, supports are rails.
  var loads = [], supports = [];
  function buildGraph() {
    loads = sticks.map(function () { return []; });
    supports = sticks.map(function () { return []; });
    var pile = sticks.filter(function (s) { return s.state === "pile" || s.state === "grab"; });
    for (var i = 0; i < pile.length; i++) {
      for (var j = i + 1; j < pile.length; j++) {
        var A = pile[i], B = pile[j];   // pile[] is in drop order: B lies on A
        var ea = stickEnds(A), eb = stickEnds(B);
        var hit = segInt(ea.a, ea.b, eb.a, eb.b);
        if (hit) {
          loads[A.id].push({ other: B.id, x: hit.x, y: hit.y });
          supports[B.id].push({ other: A.id, x: hit.x, y: hit.y });
        }
      }
    }
  }
  function loadersOf(id) { return loads[id] || []; }
  function supportsOf(id) { return supports[id] || []; }

  function pileCount() {
    return sticks.filter(function (s) { return s.state === "pile" || s.state === "grab"; }).length;
  }

  // ---------------- turns, faults, collecting ----------------
  function setStatus(html) { statusEl.innerHTML = html; }
  function updateScore() {
    var left = pileCount();
    var inPile = sticks.filter(function (s) { return s.state === "pile" || s.state === "grab"; })
      .reduce(function (a, s) { return a + s.rank.pts; }, 0);
    subEl.textContent = left + " sticks on the table · " + inPile + " points in the pile";
    var tail = "";
    if (streak >= 2) tail += " · Streak ×" + streak;
    if (players[current].helperReady) tail += " · <span style='color:#f0c169'>Helper ready</span>";
    else if (players[current].holdsHelper) tail += " · Helper held";
    if (mode === "solo") {
      scoreEl.innerHTML = "Score <b style='color:#f0c169'>" + players[0].score + "</b> · " +
        players[0].taken.length + " sticks · Faults " + soloFaults + tail;
    } else {
      scoreEl.innerHTML =
        "<span style='" + (current === 0 ? "color:#f0c169" : "") + "'>P1 <b>" + players[0].score + "</b></span> · " +
        "<span style='" + (current === 1 ? "color:#f0c169" : "") + "'>P2 <b>" + players[1].score + "</b></span>" + tail;
    }
  }
  function addFloater(x, y, text, gold) {
    floaters.push({ x: x, y: y, text: text, gold: !!gold, t0: performance.now() });
    if (floaters.length > 6) floaters.shift();
  }

  function returnGrabbed() {
    if (!grabbed) return;
    grabbed.anim = {
      kind: "return", t0: performance.now(), dur: 300,
      fromCx: grabbed.cx, fromCy: grabbed.cy, fromAng: grabbed.ang,
      toCx: grabbed.startCx, toCy: grabbed.startCy, toAng: grabbed.startAng
    };
    grabbed.state = "return";
    grabbed = null; grabId = null;
  }

  function fault(loader) {
    // THE HELPER: a held Mikado/Mandarin steadies the pile — one slip
    // per turn (2P) or per drop (solo) is forgiven. The loader wobbles
    // but does not roll; the pile is unchanged; the turn stands.
    if (players[current].helperReady) {
      players[current].helperReady = false;
      faultSound();
      var perp = loader.ang + Math.PI / 2;
      loader.anim = {
        kind: "wobble", t0: performance.now(), dur: 400,
        fromCx: loader.cx, fromCy: loader.cy, fromAng: loader.ang,
        dx: Math.cos(perp) * 0.007, dy: Math.sin(perp) * 0.007, dAng: 0.025
      };
      returnGrabbed();
      contacts = [];
      sticks.forEach(function (s) { s.disturb = 0; });
      busy = true;
      setStatus("Your helper stick steadied the " + loader.rank.name.toLowerCase() +
        " — that slip is forgiven. Once per " + (mode === "2p" ? "turn" : "drop") + ".");
      updateScore();
      return;
    }
    faultSound();
    faultFX = { stick: loader, t0: performance.now() };
    streak = 0;
    var perp2 = loader.ang + Math.PI / 2;
    var dir = (rng() - 0.5) > 0 ? 1 : -1;
    var dist = 0.010 + rng() * 0.008;
    loader.anim = {
      kind: "roll", t0: performance.now(), dur: 340,
      fromCx: loader.cx, fromCy: loader.cy, fromAng: loader.ang,
      toCx: loader.cx + Math.cos(perp2) * dist * dir,
      toCy: loader.cy + Math.sin(perp2) * dist * dir,
      toAng: loader.ang + (0.04 + rng() * 0.05) * dir
    };
    loader.state = "roll";
    returnGrabbed();
    contacts = [];
    sticks.forEach(function (s) { s.disturb = 0; });
    busy = true;
    if (mode === "solo") {
      soloFaults++;
      setStatus("It moved — the " + loader.rank.name.toLowerCase() + " rolled. Fault " + soloFaults + ".");
    } else {
      setStatus("It moved — the " + loader.rank.name.toLowerCase() + " rolled. Turn over.");
      current = 1 - current;
      players[current].helperReady = players[current].holdsHelper;
      bannerUntil = performance.now() + 1600;
      setTimeout(function () {
        if (!gameOver) setStatus("<span class='turn'>Player " + (current + 1) + "</span> to move");
      }, 1650);
    }
    updateScore();
  }

  function collect(stick) {
    collectSound();
    stick.state = "collect";
    stick.trayPlayer = current;
    stick.traySlot = players[current].taken.length;
    players[current].taken.push(stick.id);
    players[current].score += stick.rank.pts;
    streak++;
    addFloater(stick.cx, stick.cy, "+" + stick.rank.pts, stick.rankIdx <= 1);
    if (streak >= 3) addFloater(stick.cx, stick.cy - 0.10, "STREAK ×" + streak, true);
    var target = traySlot(current, stick.traySlot);
    stick.anim = {
      kind: "collect", t0: performance.now(), dur: 430,
      fromCx: stick.cx, fromCy: stick.cy, fromAng: stick.ang, fromScale: 1,
      toCx: target.x, toCy: target.y, toAng: target.ang, toScale: target.scale
    };
    // sticks that were resting on it settle a breath as the support leaves
    loadersOf(stick.id).forEach(function (L) {
      var other = sticks[L.other];
      if (other.state !== "pile") return;
      other.anim = {
        kind: "settle", t0: performance.now() + 60, dur: 260,
        fromCx: other.cx, fromCy: other.cy, fromAng: other.ang,
        toCx: other.cx + (L.x - other.cx) * 0.05,
        toCy: other.cy + (L.y - other.cy) * 0.05,
        toAng: other.ang + (rng() - 0.5) * 0.02
      };
      other.state = "settle";
    });
    grabbed = null; grabId = null; contacts = [];
    sticks.forEach(function (s) { s.disturb = 0; });

    var gainedHelper = false;
    if (stick.rankIdx <= 1 && !players[current].holdsHelper) {
      players[current].holdsHelper = true;
      players[current].helperReady = true;
      gainedHelper = true;
    }
    if (gainedHelper) {
      setStatus("The " + stick.rank.name.toLowerCase() + " is yours (+" + stick.rank.pts + ") — and it works as a " +
        "<b style='color:#f0c169'>helper</b>: it steadies the pile, one slip per " +
        (mode === "2p" ? "turn" : "drop") + " forgiven.");
    } else {
      setStatus("Clean. The " + stick.rank.name.toLowerCase() + " is yours (+" + stick.rank.pts + ")." +

  }

  function endCheck() {
    if (pileCount() === 0 && !gameOver) {

          soloFaults + " fault" + (soloFaults === 1 ? "" : "s") + ". New drop to play again.");
      } else {
        var w = players[0].score === players[1].score ? "A draw" :
          (players[0].score > players[1].score ? "Player 1 wins" : "Player 2 wins");
        setStatus("<b style='color:#f0c169'>" + w + "</b> — " + players[0].score + " to " + players[1].score + ". New drop to play again.");
      }

  // ---------------- layout & camera ----------------
  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var zoom = view.baseS ? view.s / view.baseS : 1;
    var landscape = W >= H * 0.92;
    if (landscape) {
      view.baseS = Math.min(W * 0.36, H * 0.60);
      view.cx = W * 0.40; view.cy = H * 0.54;
      trayRects[0] = { x: W * 0.755, y: H * 0.13, w: W * 0.225, h: H * 0.36 };
      trayRects[1] = { x: W * 0.755, y: H * 0.545, w: W * 0.225, h: H * 0.36 };
    } else {
      view.baseS = Math.min(W * 0.47, H * 0.30);
      view.cx = W * 0.5; view.cy = H * 0.42;
      trayRects[0] = { x: W * 0.04, y: H * 0.70, w: W * 0.44, h: H * 0.26 };
      trayRects[1] = { x: W * 0.52, y: H * 0.70, w: W * 0.44, h: H * 0.26 };
    }
    view.s = view.baseS * clamp(zoom, 0.7, 3.4);
  }
  function clampPan() {
    view.ox = clamp(view.ox, -1.0, 1.0);
    view.oy = clamp(view.oy, -1.0, 1.0);
  }
  function camHome() {
    view.ox = 0; view.oy = 0; view.s = view.baseS;
  }
  function zoomAt(mx, my, factor) {
    var w = worldAt(mx, my);
    view.s = clamp(view.s * factor, view.baseS * 0.7, view.baseS * 3.4);
    view.ox = w.x - (mx - view.cx) / view.s;
    view.oy = w.y - (my - view.cy) / view.s;
    clampPan();
  }
  function traySlot(player, slot) {
    var r = trayRects[player];
    var cols = 3;
    var colW = (r.w - 16) / cols, rowH = clamp((r.h - 50) / 14, 8, 24);
    var col = slot % cols, row = Math.floor(slot / cols);
    var px = r.x + 10 + col * colW + colW / 2;
    var py = r.y + 46 + row * rowH;
    var w = worldAt(px, py);
    return { x: w.x, y: w.y, ang: (slot % 2 ? 0.045 : -0.045), scale: (colW * 0.92) / view.s };
  }
  window.addEventListener("resize", layout);

  // ---------------- pointer: grab, pan, pinch ----------------
  var pointersDown = new Map();   // id -> {x, y} screen px
  var panDrag = null;             // {id, lastX, lastY}
  var pinch = null;               // {d, wx, wy} start distance + anchored world point
  var suppressUntilAllUp = false;
  var spaceDown = false;
  window.addEventListener("keydown", function (e) { if (e.code === "Space") spaceDown = true; });
  window.addEventListener("keyup", function (e) { if (e.code === "Space") spaceDown = false; });

  function pickStick(w) {
    var best = null, bestD = 1e9;
    for (var i = sticks.length - 1; i >= 0; i--) {
      var s = sticks[i];
      if (s.state !== "pile") continue;
      var e = stickEnds(s);
      var r = ptSegDist(w.x, w.y, e.a, e.b);
      var grabR = Math.max(HALF_W * 2.2, 30 / view.s);   // generous, screen-constant
      if (r.d < grabR && r.d < bestD) { bestD = r.d; best = { stick: s, t: r.t }; }
    }

  }

  function beginGrab(pick, id) {
    var s = pick.stick;
    grabbed = s; grabId = id;
    s.state = "grab";

    var e = stickEnds(s);
    s.startAx = e.a.x; s.startAy = e.a.y; s.startBx = e.b.x; s.startBy = e.b.y;
    s.grabT = pick.t; s.angVel = 0;

    sticks.forEach(function (o) { o.disturb = 0; });

    loadersOf(s.id).forEach(function (L) {
      var other = sticks[L.other];
      if (other.state !== "pile") return;

      contacts.push({ other: other, isLoader: true, acc: 0, x: hit ? hit.x : L.x, y: hit ? hit.y : L.y });
    });
    supportsOf(s.id).forEach(function (L) {
      var other = sticks[L.other];
      if (other.state !== "pile") return;
      var hit = segInt(e.a, e.b, stickEnds(other).a, stickEnds(other).b);

  canvas.addEventListener("pointerdown", function (e) {
    audio();

    if (pointersDown.size === 2) {
      // second finger: camera takes over; a held stick is set back, no fault
      if (grabbed) { releasePointer(true); }
      panDrag = null;
      var pts = Array.from(pointersDown.values());
      var mx = (pts[0].x + pts[1].x) / 2, my = (pts[0].y + pts[1].y) / 2;
      var w = worldAt(mx, my);

      var pts = Array.from(pointersDown.values());
      var mx = (pts[0].x + pts[1].x) / 2, my = (pts[0].y + pts[1].y) / 2;
      var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;

  canvas.addEventListener("wheel", function (e) {

  }, { passive: false });
  canvas.addEventListener("dblclick", function () { camHome(); });

  function releasePointer(silent) {
    pointer.down = false;

    sticks.forEach(function (o) { o.disturb = 0; });
    contacts = [];

    if (!silent) settleSound();
  }

  // one physics step of the grabbed stick + disturbance accounting.
  //
  // Motion is constraint-driven. The desired grab-point displacement is
  // split along the stick's own axis and across it:
  //   * the axial part is a pure slide — no crossing moves, ever;
  //   * the cross-axis part becomes ROTATION ABOUT THE ANCHOR (the
  //     load-weighted average of the LOADER crossings — the pins) plus a small
  //     damped push-through. Swinging an end around the stick lying
  //     across yours is the real game's lever move, and here it falls
  //     out of the geometry.
  // A loader then feels only (a) the travel of its crossing point and
  // (b) a small coupling when it sits at the anchor and the stick
  // rotates beneath it. With no contacts at all the stick is free:
  // v1's spring + torque.
  function stepGrab() {

    var gx = e.a.x + (e.b.x - e.a.x) * s.grabT;
    var gy = e.a.y + (e.b.y - e.a.y) * s.grabT;

    if (errLen < dz) { errX = 0; errY = 0; }
    else { var sc = (errLen - dz) / errLen; errX *= sc; errY *= sc; }

    var dLen = Math.hypot(dX, dY), maxStep = 0.034;
    if (dLen > maxStep) { dX *= maxStep / dLen; dY *= maxStep / dLen; }

    var hasLoader = false;
    for (var ci = 0; ci < contacts.length; ci++) if (contacts[ci].isLoader) { hasLoader = true; break; }
    if (contacts.length && hasLoader) {
      var dAx = dX * ux + dY * uy;            // signed axial component
      var dPr = dX * nx + dY * ny;            // signed cross-axis component
      // The anchor is the pin: the load-weighted average of the LOADER
      // crossings only. What a stick rests ON is a surface, not a pin —
      // it can swing around the stick lying across it while sliding over
      // the ones beneath. Averaging the supports in put the pivot in the
      // middle of the stick and dragged every crossing (playtest: a clean
      // 0.1 rad swing around the fulcrum faulted). With two or more
      // loaders the average sits between the pins, and swinging then
      // honestly disturbs both.
      var ax = 0, ay = 0, aw = 0;
      contacts.forEach(function (c) {
        if (!c.isLoader) return;
        ax += c.x * 2; ay += c.y * 2; aw += 2;
      });
      ax /= aw; ay /= aw;
      var lever = (gx - ax) * ux + (gy - ay) * uy;
      var dth = 0;
      if (Math.abs(lever) > 0.10) dth = clamp(dPr / lever, -0.055, 0.055);
      if (dth) {
        var cs = Math.cos(dth), sn = Math.sin(dth);
        var rx = s.cx - ax, ry = s.cy - ay;
        s.cx = ax + rx * cs - ry * sn;
        s.cy = ay + rx * sn + ry * cs;
        s.ang += dth;
        contacts.forEach(function (c) {
          if (c.isLoader && Math.hypot(c.x - ax, c.y - ay) < 0.04) c.acc += Math.abs(dth) * 0.02;
        });
      }
      var rotShare = clamp(Math.abs(lever) / 0.45, 0, 1);
      var push = dPr * (1 - rotShare) * 0.22;
      s.cx += ux * dAx + nx * push;
      s.cy += uy * dAx + ny * push;
      s.angVel = 0;
    } else {
      s.cx += dX; s.cy += dY;
      var eN = stickEnds(s);
      var g2x = eN.a.x + (eN.b.x - eN.a.x) * s.grabT;
      var g2y = eN.a.y + (eN.b.y - eN.a.y) * s.grabT;
      var rx2 = g2x - s.cx, ry2 = g2y - s.cy;
      var torque = (rx2 * errY - ry2 * errX) / (rx2 * rx2 + ry2 * ry2 + 0.015);
      s.angVel = clamp((s.angVel || 0) * 0.72 + torque * 0.045, -0.04, 0.04);
      s.ang += s.angVel;
    }

    // disturbance: travel of each loader's crossing point since last step
    var e2 = stickEnds(s);
    var faulted = null;
    for (var i = contacts.length - 1; i >= 0; i--) {
      var c = contacts[i];
      if (c.other.state !== "pile") { contacts.splice(i, 1); continue; }
      var eo = stickEnds(c.other);
      var hit = segInt(e2.a, e2.b, eo.a, eo.b);
      if (!hit) { contacts.splice(i, 1); continue; }   // slipped out from under it
      if (c.isLoader) {
        var moved = Math.hypot(hit.x - c.x, hit.y - c.y);
        c.acc += moved < 0.0006 ? moved * 0.25 : moved;   // friction deadband
        c.other.disturb = Math.max(c.other.disturb, c.acc);

    if (faulted) { fault(faulted); return; }

    // clear? the whole segment must be free of every other pile stick —
    // and the stick must actually have travelled, not just been touched
    var movedTotal = Math.max(
      Math.hypot(s.cx - s.startCx, s.cy - s.startCy),
      Math.hypot(e2.a.x - s.startAx, e2.a.y - s.startAy),
      Math.hypot(e2.b.x - s.startBx, e2.b.y - s.startBy));
    if (movedTotal < 0.05) return;
    var clear = true;
    for (var k = 0; k < sticks.length; k++) {
      var o = sticks[k];
      if (o === s || o.state !== "pile") continue;
      var eo2 = stickEnds(o);
      if (segSegDist(e2.a, e2.b, eo2.a, eo2.b) < HALF_W * 2 + 0.006) { clear = false; break; }
    }
    if (clear) collect(s);
  }

  // ---------------- animations ----------------
  function stepAnims(now) {
    var any = false;
    sticks.forEach(function (s) {
      if (!s.anim) return;
      var a = s.anim;
      var t = clamp((now - a.t0) / a.dur, 0, 1);
      if (a.kind === "wobble") {
        var wob = Math.sin(t * Math.PI);
        s.cx = a.fromCx + a.dx * wob;
        s.cy = a.fromCy + a.dy * wob;
        s.ang = a.fromAng + a.dAng * wob;
        if (t < 1) { any = true; return; }
        s.anim = null; s.state = "pile";
        return;
      }
      var k = a.kind === "collect" ? easeInOut(t) : easeOut(t);
      s.cx = lerp(a.fromCx, a.toCx, k);
      s.cy = lerp(a.fromCy, a.toCy, k);
      s.ang = lerp(a.fromAng, a.toAng, k);
      if (a.kind === "collect") s.lenScale = lerp(a.fromScale, a.toScale, k);
      if (t < 1) { any = true; return; }

      if (a.kind === "collect") { s.state = "tray"; s.lenScale = a.toScale; buildGraph(); }
      else if (a.kind === "roll" || a.kind === "return" || a.kind === "settle") {

      }

    });

    if (dropStart) {
      var dt = now - dropStart;
      var done = true;
      sticks.forEach(function (s) {
        var lt = clamp((dt - s.dropDelay) / 460, 0, 1);
        if (lt < 1) done = false;
        var k = easeOut(lt);
        s.cx = lerp(s.fromCx, s.finalCx, k);
        s.cy = lerp(s.fromCy - 0.05 * (1 - k), s.finalCy, k);
        s.ang = lerp(s.fromAng, s.finalAng, k);
      });

      else any = true;
    }
    if (!any && !grabbed) {
      if (busy) { busy = false; endCheck(); }
    }
  }

  // ---------------- rendering ----------------
  function toPx(x, y) { return screenOf(x, y); }

  function drawTable(now) {
    var g = ctx.createRadialGradient(view.cx, view.cy, 40, view.cx, view.cy, Math.max(W, H) * 0.75);
    g.addColorStop(0, "#3d2716");
    g.addColorStop(0.55, "#2b1a0e");
    g.addColorStop(1, "#17100b");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(0,0,0,0.20)";
    ctx.lineWidth = 1.5;
    var seamGap = Math.max(90, H / 7);
    for (var y = seamGap * 0.5; y < H; y += seamGap) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.strokeStyle = "rgba(255,205,140,0.045)";
    for (var i = 0; i < 26; i++) {
      var gy = ((i * 197.3) % H), gx = (i * 311.7) % W;
      ctx.beginPath(); ctx.moveTo(gx, gy);
      ctx.bezierCurveTo(gx + 60, gy + 3, gx + 120, gy - 3, gx + 190, gy + 1);
      ctx.stroke();
    }
    // soft pool of light over the pile (follows the camera)
    var pc = screenOf(0, 0);
    var pool = ctx.createRadialGradient(pc[0], pc[1], 10, pc[0], pc[1], view.s * 0.95);
    pool.addColorStop(0, "rgba(255,214,150,0.10)");
    pool.addColorStop(1, "rgba(255,214,150,0)");
    ctx.fillStyle = pool;
    ctx.fillRect(pc[0] - view.s, pc[1] - view.s, view.s * 2, view.s * 2);
  }

  function stickPath(s, liftPx) {
    var e = stickEnds(s);
    var len = s.len * s.lenScale;
    var c = screenOf(s.cx, s.cy);
    var cxp = c[0], cyp = c[1];
    var ux = e.ux, uy = e.uy, nx = -uy, ny = ux;
    var hl = len * view.s / 2, hw = HALF_W * view.s * (s.lenScale < 1 ? 0.9 : 1);
    var prof = [[0, 0], [0.05, 0.62], [0.14, 0.92], [0.5, 1], [0.86, 0.92], [0.95, 0.62], [1, 0]];
    ctx.beginPath();
    var i, t, wdt, px, py;
    for (i = 0; i < prof.length; i++) {
      t = prof[i][0]; wdt = prof[i][1] * hw;
      px = cxp + ux * (t - 0.5) * 2 * hl + nx * wdt;
      py = cyp + uy * (t - 0.5) * 2 * hl + ny * wdt + (liftPx || 0);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    for (i = prof.length - 1; i >= 0; i--) {
      t = prof[i][0]; wdt = prof[i][1] * hw;
      px = cxp + ux * (t - 0.5) * 2 * hl - nx * wdt;
      py = cyp + uy * (t - 0.5) * 2 * hl - ny * wdt + (liftPx || 0);
      ctx.lineTo(px, py);
    }
    ctx.closePath();

  function widthAt(t) {
    var prof = [[0, 0], [0.05, 0.62], [0.14, 0.92], [0.5, 1], [0.86, 0.92], [0.95, 0.62], [1, 0]];
    for (var i = 1; i < prof.length; i++) {
      if (t <= prof[i][0]) {

    ctx.lineTo(x1 + geo.nx * w1, y1 + geo.ny * w1);

  function drawBands(s, geo) {
    var kind = s.rank.band, col = s.rank.col;

        ctx.beginPath();
        var ax = geo.cxp + geo.ux * (t - 0.5) * 2 * geo.hl, ay = geo.cyp + geo.uy * (t - 0.5) * 2 * geo.hl;
        var bx2 = geo.cxp + geo.ux * (t + 0.045 - 0.5) * 2 * geo.hl, by2 = geo.cyp + geo.uy * (t + 0.045 - 0.5) * 2 * geo.hl;
        ctx.moveTo(ax - geo.nx * wdt, ay - geo.ny * wdt);
        ctx.lineTo(bx2 + geo.nx * wdt, by2 + geo.ny * wdt);
        ctx.stroke();
      }
    } else if (kind === "mandarin") {
      bandRect(geo, 0.435, 0.565, "#e8b91f");
      bandRect(geo, 0.435, 0.462, "#191919"); bandRect(geo, 0.538, 0.565, "#191919");
      bandRect(geo, 0.07, 0.105, "#191919"); bandRect(geo, 0.895, 0.93, "#191919");
      bandRect(geo, 0.115, 0.135, "#e8b91f"); bandRect(geo, 0.865, 0.885, "#e8b91f");
    } else if (kind === "five") {
      [0.26, 0.395, 0.53, 0.665, 0.80].forEach(function (t) { bandRect(geo, t - 0.026, t + 0.026, col); });
    } else if (kind === "three") {
      [0.30, 0.50, 0.70].forEach(function (t) { bandRect(geo, t - 0.03, t + 0.03, col); });
    } else if (kind === "two") {
      [0.32, 0.68].forEach(function (t) { bandRect(geo, t - 0.03, t + 0.03, col); });
    }
  }

  function drawStick(s, now) {
    var lifted = s.state === "grab";
    var heightIdx = s.state === "tray" ? 1 : s.id;
    var shOff = 2.5 + heightIdx * 0.14 + (lifted ? 7 : 0);
    var shAlpha = 0.26 + (lifted ? 0.10 : 0);
    // tremble: a loader close to rolling shakes almost imperceptibly
    var tremble = 0;
    if (grabbed && s.state === "pile" && s.disturb > 0.001) {
      var ratio0 = clamp(s.disturb / s.tol, 0, 1);
      if (ratio0 > 0.55) tremble = (ratio0 - 0.55) * 1.6;
    }
    ctx.save();
    if (tremble) ctx.translate((Math.random() - 0.5) * 2 * tremble, (Math.random() - 0.5) * 2 * tremble);
    // shadow
    ctx.save();
    ctx.translate(shOff, shOff * 1.35);
    stickPath(s, 0);
    ctx.fillStyle = "rgba(8,4,2," + shAlpha + ")";
    ctx.fill();
    ctx.restore();
    // body
    var geo = stickPath(s, 0);
    var grd = ctx.createLinearGradient(geo.cxp - geo.nx * geo.hw, geo.cyp - geo.ny * geo.hw,
      geo.cxp + geo.nx * geo.hw, geo.cyp + geo.ny * geo.hw);
    grd.addColorStop(0, s.rank.wood[0]);
    grd.addColorStop(0.5, s.rank.wood[1]);
    grd.addColorStop(1, s.rank.wood[2]);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = "rgba(50,28,8,0.6)";
    ctx.lineWidth = 0.8;
    ctx.stroke();
    // centre sheen
    ctx.save();
    stickPath(s, 0); ctx.clip();
    ctx.strokeStyle = "rgba(255,240,210,0.20)";
    ctx.lineWidth = Math.max(1, geo.hw * 0.34);
    ctx.beginPath();
    ctx.moveTo(geo.cxp - geo.ux * geo.hl * 0.92 - geo.nx * geo.hw * 0.34, geo.cyp - geo.uy * geo.hl * 0.92 - geo.ny * geo.hw * 0.34);
    ctx.lineTo(geo.cxp + geo.ux * geo.hl * 0.92 - geo.nx * geo.hw * 0.34, geo.cyp + geo.uy * geo.hl * 0.92 - geo.ny * geo.hw * 0.34);
    ctx.stroke();
    ctx.restore();
    drawBands(s, geo);
    if (lifted) {
      stickPath(s, 0);
      ctx.fillStyle = "rgba(255,244,214,0.07)";
      ctx.fill();
    }
    // stress tint: sticks resting on the grabbed stick show their load
    if (grabbed && s.state === "pile" && s.disturb > 0.001) {
      var ratio = clamp(s.disturb / s.tol, 0, 1);
      stickPath(s, 0);
      ctx.fillStyle = "rgba(255,64,26," + (0.08 + 0.40 * ratio) + ")";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,120,70," + (0.25 + 0.55 * ratio) + ")";
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    // fault flash ring
    if (faultFX && faultFX.stick === s) {
      var age = (now - faultFX.t0) / 700;
      if (age < 1) {
        var e = stickEnds(s);
        var c = toPx((e.a.x + e.b.x) / 2, (e.a.y + e.b.y) / 2);
        ctx.strokeStyle = "rgba(255,70,40," + (0.75 * (1 - age)) + ")";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(c[0], c[1], (0.12 + age * 0.16) * view.s, (0.05 + age * 0.07) * view.s, s.ang, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawTrays(now) {
    for (var p = 0; p < 2; p++) {
      if (mode === "solo" && p === 1) continue;
      var r = trayRects[p];
      ctx.fillStyle = "rgba(12,7,4,0.55)";
      ctx.strokeStyle = p === current && mode === "2p" ? "rgba(240,193,105,0.55)" : "rgba(234,223,200,0.14)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(r.x, r.y, r.w, r.h, 8);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = p === current || mode === "solo" ? "#f0c169" : "rgba(234,223,200,0.6)";
      ctx.font = "600 11px 'IBM Plex Mono', ui-monospace, monospace";
      ctx.fillText(mode === "solo" ? "YOUR TRAY" : "PLAYER " + (p + 1), r.x + 10, r.y + 18);
      ctx.fillStyle = "rgba(234,223,200,0.85)";
      ctx.font = "11px 'IBM Plex Mono', ui-monospace, monospace";
      var extra = players[p].holdsHelper ? " · helper" : "";
      ctx.fillText(players[p].score + " pts · " + players[p].taken.length + " sticks" + extra, r.x + 10, r.y + 33);
    }
  }

  function drawFloaters(now) {
    ctx.textAlign = "center";
    for (var i = floaters.length - 1; i >= 0; i--) {
      var f = floaters[i];
      var age = (now - f.t0) / 950;
      if (age >= 1) { floaters.splice(i, 1); continue; }
      var p = screenOf(f.x, f.y - age * 0.085);
      ctx.fillStyle = f.gold
        ? "rgba(240,193,105," + (0.95 * (1 - age)) + ")"
        : "rgba(243,233,210," + (0.9 * (1 - age)) + ")";
      ctx.font = (f.gold ? "700 " : "600 ") + Math.round(clamp(view.s * 0.055, 12, 17)) + "px 'IBM Plex Mono', ui-monospace, monospace";
      ctx.fillText(f.text, p[0], p[1]);
    }
    ctx.textAlign = "left";
  }

  function draw(now) {
    drawTable(now);
    drawTrays(now);
    // tray sticks ride the camera: their home is a screen-space tray
    sticks.forEach(function (s) {
      if (s.state === "tray" && !s.anim && s.trayPlayer >= 0) {
        var t = traySlot(s.trayPlayer, s.traySlot);
        s.cx = t.x; s.cy = t.y; s.ang = t.ang; s.lenScale = t.scale;
      }
    });
    var ordered = sticks.slice().sort(function (a, b) {
      function key(s) {
        if (s.state === "grab") return 1e6;
        if (s.state === "collect") return 9e5;
        if (s.state === "tray") return 2e5 + s.id;
        return s.id;
      }
      return key(a) - key(b);
    });
    ordered.forEach(function (s) { drawStick(s, now); });
    drawFloaters(now);
    if (gameOver) {
      ctx.fillStyle = "rgba(10,5,2,0.45)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#f3e9d2";
      ctx.font = "600 " + Math.round(Math.min(W, H) * 0.045) + "px 'IBM Plex Mono', ui-monospace, monospace";
      ctx.textAlign = "center";
      var line = mode === "solo" ? "Pile cleared — " + players[0].score + " points" :
        (players[0].score === players[1].score ? "A draw — " + players[0].score + " all" :
          (players[0].score > players[1].score ? "Player 1 wins " : "Player 2 wins ") +
          Math.max(players[0].score, players[1].score) + " to " + Math.min(players[0].score, players[1].score));
      ctx.fillText(line, W / 2, H * 0.46);
      ctx.font = "12px 'IBM Plex Mono', ui-monospace, monospace";
      ctx.fillStyle = "rgba(234,223,200,0.7)";
      ctx.fillText("Press New drop to play again", W / 2, H * 0.46 + 26);
      ctx.textAlign = "left";
    }
    if (bannerUntil && now < bannerUntil && mode === "2p" && !gameOver) {
      var a = clamp((bannerUntil - now) / 1600, 0, 1);
      ctx.fillStyle = "rgba(240,193,105," + (0.9 * Math.min(1, a * 2)) + ")";
      ctx.font = "600 15px 'IBM Plex Mono', ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText("PLAYER " + (current + 1) + " TO MOVE", W / 2, H * 0.30);
      ctx.textAlign = "left";
    }
  }

  var frozenPose = !!stateParam;
  function frame(now) {
    if (grabbed && grabbed.state === "grab" && !frozenPose) stepGrab();
    stepAnims(now);
    draw(now);
    requestAnimationFrame(frame);
  }

  // ---------------- controls ----------------
  document.getElementById("btnDrop").addEventListener("click", function () { audio(); newDrop(); });
  var btnMode = document.getElementById("btnMode");
  btnMode.addEventListener("click", function () {
    mode = mode === "solo" ? "2p" : "solo";
    btnMode.textContent = mode === "solo" ? "Solo" : "2 players";
    btnMode.classList.toggle("active", mode === "2p");
    newDrop();
  });
  var btnSound = document.getElementById("btnSound");
  btnSound.addEventListener("click", function () {
    soundOn = !soundOn;
    btnSound.textContent = soundOn ? "Sound on" : "Muted";
    btnSound.classList.toggle("active", !soundOn);
    if (soundOn) { audio(); tickSound(); }
  });
  document.getElementById("btnView").addEventListener("click", function () { camHome(); });

  // ---------------- debug / screenshot states ----------------
  function settleDropInstantly() {
    sticks.forEach(function (s) { s.cx = s.finalCx; s.cy = s.finalCy; s.ang = s.finalAng; });
    dropStart = 0; busy = false;
    buildGraph();
  }
  function setupDisturbed() {
    // pick a stick near the top of the pile carrying a readable load,
    // and heave it sideways — its loaders light up with stress
    var best = null, bestScore = -1;
    sticks.forEach(function (s) {
      var n = loadersOf(s.id).length;
      if (n < 2 || n > 9) return;
      var score = s.id * 2 + n;   // prefer higher in the stack, well loaded
      if (score > bestScore) { bestScore = score; best = s; }
    });
    if (!best) sticks.forEach(function (s) {
      if (loadersOf(s.id).length > bestScore) { bestScore = loadersOf(s.id).length; best = s; }
    });
    if (!best) return;
    grabbed = best;
    best.state = "grab";
    best.startCx = best.cx; best.startCy = best.cy; best.startAng = best.ang;
    var e = stickEnds(best);
    best.startAx = e.a.x; best.startAy = e.a.y; best.startBx = e.b.x; best.startBy = e.b.y;
    best.grabT = 0.5; best.angVel = 0;
    var perp = best.ang + Math.PI / 2;
    best.cx += Math.cos(perp) * 0.06;
    best.cy += Math.sin(perp) * 0.06;
    best.ang += 0.13;
    pointer.x = best.cx + Math.cos(perp) * 0.05;
    pointer.y = best.cy + Math.sin(perp) * 0.05;
    smX = pointer.x; smY = pointer.y;
    pointer.down = true;
    contacts = loadersOf(best.id).map(function (L, i) {
      var loader = sticks[L.other];
      loader.disturb = loader.tol * (0.55 + 0.13 * (i % 3));
      var hit = segInt(stickEnds(best).a, stickEnds(best).b, stickEnds(loader).a, stickEnds(loader).b);
      return { other: loader, isLoader: true, acc: loader.disturb, x: hit ? hit.x : L.x, y: hit ? hit.y : L.y };
    });
    setStatus("That sideways heave is exactly how a fault happens — watch the loaded sticks glow.");
    updateScore();
  }
  function setupPivot() {
    // pose the lever move: a stick grabbed near one end, swung ~24°
    // around the crossing of the stick lying across it
    var best = null, bestCross = null;
    sticks.forEach(function (s) {
      var ls = loadersOf(s.id);
      if (ls.length < 1 || ls.length > 3 || best) return;
      var e = stickEnds(s);
      for (var i = 0; i < ls.length; i++) {
        var hit = segInt(e.a, e.b, stickEnds(sticks[ls[i].other]).a, stickEnds(sticks[ls[i].other]).b);
        if (hit && hit.t > 0.28 && hit.t < 0.72) { best = s; bestCross = { L: ls[i], hit: hit }; break; }
      }
    });
    if (!best) { setupDisturbed(); return; }
    var loader = sticks[bestCross.L.other];
    grabbed = best;
    best.state = "grab";
    best.startCx = best.cx; best.startCy = best.cy; best.startAng = best.ang;
    var e0 = stickEnds(best);
    best.startAx = e0.a.x; best.startAy = e0.a.y; best.startBx = e0.b.x; best.startBy = e0.b.y;
    // grab the end farther from the fulcrum; swing the free end outward
    best.grabT = bestCross.hit.t < 0.5 ? 0.93 : 0.07;
    var P = { x: bestCross.hit.x, y: bestCross.hit.y };
    var farEnd = bestCross.hit.t < 0.5 ? e0.a : e0.b;
    var sign = 1;
    [1, -1].forEach(function (sg) {
      var a = 0.42 * sg;
      var cs = Math.cos(a), sn = Math.sin(a);
      var fx = P.x + (farEnd.x - P.x) * cs - (farEnd.y - P.y) * sn;
      var fy = P.y + (farEnd.x - P.x) * sn + (farEnd.y - P.y) * cs;
      var cur = Math.hypot(farEnd.x, farEnd.y);
      if (Math.hypot(fx, fy) > cur) sign = sg;
    });
    var dth = 0.42 * sign;
    var cs2 = Math.cos(dth), sn2 = Math.sin(dth);
    var rx = best.cx - P.x, ry = best.cy - P.y;
    best.cx = P.x + rx * cs2 - ry * sn2;
    best.cy = P.y + rx * sn2 + ry * cs2;
    best.ang += dth;
    var e1 = stickEnds(best);
    var gp = { x: e1.a.x + (e1.b.x - e1.a.x) * best.grabT, y: e1.a.y + (e1.b.y - e1.a.y) * best.grabT };
    pointer.x = gp.x; pointer.y = gp.y; smX = gp.x; smY = gp.y; pointer.down = true;
    loader.disturb = loader.tol * 0.55;
    contacts = loadersOf(best.id).map(function (L) {
      var o = sticks[L.other];
      var hit = segInt(e1.a, e1.b, stickEnds(o).a, stickEnds(o).b);
      return { other: o, isLoader: true, acc: o === loader ? o.disturb : 0, x: hit ? hit.x : L.x, y: hit ? hit.y : L.y };
    });
    setStatus("The pivot: swing a stick around the one lying across it, then slip it out along its length.");
    updateScore();
  }
  function setupCluster() {
    // camera into the densest knot, so the cluster can be read
    var best = null, bestN = -1;
    sticks.forEach(function (s) {
      var n = loadersOf(s.id).length + supportsOf(s.id).length;
      if (n > bestN) { bestN = n; best = s; }
    });
    if (best) {
      view.ox = best.cx; view.oy = best.cy;
      view.s = view.baseS * 2.3;
    }
    setStatus("Zoomed into the knot. Pinch or scroll to move back out.");
  }

  layout();
  newDrop();
  if (seedParam) {
    // test hook (only with ?debug=): lets a headless driver play real drags
    window.__mikado = {
      get sticks() { return sticks; }, get players() { return players; },
      view: view,
      loads: function () { return loads; },
      supports: function () { return supports; },
      screenOf: function (x, y) { return screenOf(x, y); },
      worldAt: function (px, py) { return worldAt(px, py); },
      endsOf: function (id) {
        var e = stickEnds(sticks[id]);
        return { a: screenOf(e.a.x, e.a.y), b: screenOf(e.b.x, e.b.y), c: screenOf(sticks[id].cx, sticks[id].cy) };
      },
      pickAt: function (wx, wy) { var p = pickStick({ x: wx, y: wy }); return p ? p.stick.id : null; },
      crossingsOf: function (id) {
        var out = [];
        loadersOf(id).forEach(function (L) { out.push({ other: L.other, isLoader: true, x: L.x, y: L.y }); });
        supportsOf(id).forEach(function (L) { out.push({ other: L.other, isLoader: false, x: L.x, y: L.y }); });
        return out;
      },
      camHome: camHome,
      state: function () {
        return {
          busy: busy, gameOver: gameOver, faults: soloFaults, mode: mode, current: current,
          streak: streak,
          helperReady: players[current].helperReady, holdsHelper: players[current].holdsHelper,
          grabbedId: grabbed ? grabbed.id : null,
          pile: pileCount(),
          zoom: view.s / view.baseS,
          status: statusEl.textContent
        };
      }
    };
  }
  if (stateParam) {
    settleDropInstantly();
    if (stateParam === "disturbed") setupDisturbed();
    else if (stateParam === "pivot") setupPivot();
    else if (stateParam === "cluster") setupCluster();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
