<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9103 · Mikado</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #17100b; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .ui {
    position: fixed; z-index: 3; color: #eadfc8;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-user-select: none; user-select: none;
  }
  #hud {
    top: 0; left: 0; right: 0; display: flex; align-items: flex-start;
    gap: 10px; padding: 12px 14px; pointer-events: none; flex-wrap: wrap;
  }
  .chip {
    background: rgba(16, 10, 6, 0.62); border: 1px solid rgba(234, 223, 200, 0.16);
    border-radius: 6px; padding: 7px 11px; font-size: 12px; line-height: 1.45;
    pointer-events: auto; backdrop-filter: blur(3px);
  }
  #titleChip { font-size: 13px; letter-spacing: 0.06em; }
  #titleChip b { color: #f0c169; font-weight: 600; }
  #statusChip { flex: 1 1 220px; text-align: center; color: #f3e9d2; }
  #statusChip .turn { color: #f0c169; }
  button {
    background: rgba(46, 30, 16, 0.85); color: #eadfc8; border: 1px solid rgba(234, 223, 200, 0.28);
    font: inherit; font-size: 12px; border-radius: 6px; padding: 7px 11px; cursor: pointer;
  }
  button:hover { background: rgba(74, 48, 24, 0.9); border-color: rgba(240, 193, 105, 0.6); }
  button.active { border-color: #f0c169; color: #f0c169; }
  #hint {
    left: 0; right: 0; bottom: 10px; text-align: center; font-size: 11.5px;
    color: rgba(234, 223, 200, 0.55); pointer-events: none; padding: 0 12px;
  }
  @media (max-width: 640px) { #hint { display: none; } #statusChip { order: 5; flex-basis: 100%; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="hud">
  <div class="chip" id="titleChip"><b>№9103 · MIKADO</b><br><span id="subLine">41 sticks · 170 points</span></div>
  <div class="chip" id="statusChip">Dropping the bundle…</div>
  <div class="chip" id="scoreChip">—</div>
  <div class="chip" style="display:flex; gap:6px;">
    <button id="btnDrop">New drop</button>
    <button id="btnMode">Solo</button>
    <button id="btnSound">Sound on</button>
  </div>
</div>
<div class="ui" id="hint">Drag a stick out along its own length — the crossing point is what the sticks above feel. If one rolls, that is a fault.</div>
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // №9103 · MIKADO — pick-up sticks, with the real physics of the game.
  //
  // The set (classic Mikado, 41 sticks, 170 points total — Wikipedia,
  // "Mikado (game)"):
  //   1 × Mikado   blue spiral                        20 pts
  //   5 × Mandarin yellow/black, wide + end stripes   10 pts
  //   5 × Bonzen   orange, five stripes                5 pts
  //  15 × Samurai  green, three stripes                3 pts
  //  15 × Kuli     red, two stripes                    2 pts
  //
  // The mechanic: a stick later in the drop rests ON every earlier
  // stick it crosses. While you drag a stick, each stick resting on
  // it feels the movement of the GEOMETRIC CROSSING POINT between
  // them. Slide your stick along its own axis and the crossing point
  // in space does not move — nothing is disturbed, the skilled pull.
  // Drag sideways or twist, the crossing point travels, disturbance
  // accumulates, and past a stick's tolerance it visibly rolls: a
  // fault. Your stick goes back, in 2P the turn passes, solo a fault
  // is counted. Free a stick's segment from every other and it lifts
  // away to your tray.
  // ---------------------------------------------------------------

  var RANKS = [
    { name: "Mikado",   pts: 20, count: 1,  wood: ["#6e4520", "#a9743a", "#59371a"], band: "spiral",  col: "#27418f" },
    { name: "Mandarin", pts: 10, count: 5,  wood: ["#8a5426", "#c98f45", "#74431e"], band: "mandarin", col: "#e8b91f" },
    { name: "Bonzen",   pts: 5,  count: 5,  wood: ["#8a5426", "#cf9a4e", "#74431e"], band: "five",    col: "#e0701a" },
    { name: "Samurai",  pts: 3,  count: 15, wood: ["#96602c", "#d8a659", "#7d4e22"], band: "three",   col: "#2e8b3a" },
    { name: "Kuli",     pts: 2,  count: 15, wood: ["#9c6832", "#e0b06a", "#835624"], band: "two",     col: "#c22f22" }
  ];
  var STICK_LEN = 1.0;          // world units; the table is scaled to fit
  var HALF_W = 0.0105;          // stick half-width in world units
  var TOTAL_PTS = 170;

  var qs = new URLSearchParams(location.search);
  var seedParam = qs.get("debug");
  var stateParam = qs.get("state");

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(seedParam ? (parseInt(seedParam, 10) || 1) : (Math.random() * 1e9) | 0);

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  // ---------------- geometry ----------------
  function segInt(p1, p2, p3, p4) {
    var d1x = p2.x - p1.x, d1y = p2.y - p1.y, d2x = p4.x - p3.x, d2y = p4.y - p3.y;
    var den = d1x * d2y - d1y * d2x;
    if (Math.abs(den) < 1e-12) return null;
    var t = ((p3.x - p1.x) * d2y - (p3.y - p1.y) * d2x) / den;
    var u = ((p3.x - p1.x) * d1y - (p3.y - p1.y) * d1x) / den;
    if (t < 0.015 || t > 0.985 || u < 0.015 || u > 0.985) return null;
    return { x: p1.x + t * d1x, y: p1.y + t * d1y, t: t, u: u };
  }
  function ptSegDist(px, py, a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var L2 = dx * dx + dy * dy;
    var t = L2 > 0 ? ((px - a.x) * dx + (py - a.y) * dy) / L2 : 0;
    t = clamp(t, 0, 1);
    var x = a.x + t * dx, y = a.y + t * dy;
    return { d: Math.hypot(px - x, py - y), t: t, x: x, y: y };
  }
  function segSegDist(a, b, c, d) {
    if (segIntRaw(a, b, c, d)) return 0;
    return Math.min(
      ptSegDist(a.x, a.y, c, d).d, ptSegDist(b.x, b.y, c, d).d,
      ptSegDist(c.x, c.y, a, b).d, ptSegDist(d.x, d.y, a, b).d);
  }
  function segIntRaw(p1, p2, p3, p4) {
    function s(ax, ay, bx, by, cx, cy) { return (bx - ax) * (cy - ay) - (by - ay) * (cx - ax); }
    var d1 = s(p3.x, p3.y, p4.x, p4.y, p1.x, p1.y), d2 = s(p3.x, p3.y, p4.x, p4.y, p2.x, p2.y);
    var d3 = s(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y), d4 = s(p1.x, p1.y, p2.x, p2.y, p4.x, p4.y);
    return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
  }

  // ---------------- audio: quiet wooden ticks ----------------
  var AC = null, masterGain = null, soundOn = true;
  function audio() {
    if (AC) { if (AC.state === "suspended") AC.resume(); return AC; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = AC.createGain(); masterGain.gain.value = 0.5; masterGain.connect(AC.destination);
    } catch (e) { AC = null; }
    return AC;
  }
  function tick(vol, freq, dur) {
    if (!soundOn || !audio()) return;
    var t = AC.currentTime;
    var nb = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
    var ch = nb.getChannelData(0);
    for (var i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    var src = AC.createBufferSource(); src.buffer = nb;
    var bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = 5;
    var g = AC.createGain(); g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(masterGain); src.start(t);
    var o = AC.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(freq * 0.62, t);
    o.frequency.exponentialRampToValueAtTime(freq * 0.3, t + dur);
    var og = AC.createGain(); og.gain.setValueAtTime(vol * 0.5, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(og); og.connect(masterGain); o.start(t); o.stop(t + dur + 0.02);
  }
  function tickSound() { tick(0.16, 1500 + Math.random() * 700, 0.05); }
  function settleSound() { tick(0.10, 900 + Math.random() * 300, 0.06); }
  function collectSound() { tick(0.14, 1200, 0.05); setTimeout(function () { tick(0.14, 1750, 0.06); }, 70); }
  function faultSound() {
    if (!soundOn || !audio()) return;
    var t = AC.currentTime;
    var nb = AC.createBuffer(1, AC.sampleRate * 0.14, AC.sampleRate);
    var ch = nb.getChannelData(0);
    for (var i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    var src = AC.createBufferSource(); src.buffer = nb;
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500;
    var g = AC.createGain(); g.gain.setValueAtTime(0.30, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    src.connect(lp); lp.connect(g); g.connect(masterGain); src.start(t);
    tick(0.12, 500, 0.09);
  }

  // ---------------- game state ----------------
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var statusEl = document.getElementById("statusChip");
  var scoreEl = document.getElementById("scoreChip");
  var subEl = document.getElementById("subLine");

  var sticks = [];            // all 41, in drop order (index = height)
  var mode = "solo";           // "solo" | "2p"
  var players = [
    { score: 0, taken: [] },
    { score: 0, taken: [] }
  ];
  var current = 0;             // current player index
  var soloFaults = 0;
  var gameOver = false;
  var busy = false;            // an animation owns the table
  var grabbed = null;          // stick being dragged
  var pointer = { x: 0, y: 0, down: false };   // world units
  var contacts = [];           // active contacts of the grabbed stick: {loader, prevX, prevY}
  var faultFX = null;          // {stick, t0}
  var bannerUntil = 0;
  var view = { cx: 0, cy: 0, s: 400 };
  var trayRects = [null, null];
  var DPR = 1, W = 0, H = 0;

  function stickEnds(s) {
    var c = Math.cos(s.ang), n = Math.sin(s.ang), hl = s.len / 2;
    return {
      a: { x: s.cx - c * hl, y: s.cy - n * hl },
      b: { x: s.cx + c * hl, y: s.cy + n * hl },
      ux: c, uy: n
    };
  }

  function newDrop() {
    sticks = [];
    players = [{ score: 0, taken: [] }, { score: 0, taken: [] }];
    current = 0; soloFaults = 0; gameOver = false; grabbed = null; contacts = [];
    faultFX = null;
    var bag = [];
    RANKS.forEach(function (r, ri) { for (var i = 0; i < r.count; i++) bag.push(ri); });
    // shuffle the bag: the drop order is the stack order
    for (var i = bag.length - 1; i > 0; i--) {
      var j = (rng() * (i + 1)) | 0, tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
    }
    var baseAng = rng() * Math.PI * 2;
    bag.forEach(function (ri, idx) {
      // scatter: centres cluster near the drop point, angles fan wide
      var rr = Math.pow(rng(), 1.6) * 0.16;
      var th = rng() * Math.PI * 2;
      var s = {
        id: idx, rank: RANKS[ri], rankIdx: ri,
        cx: Math.cos(th) * rr, cy: Math.sin(th) * rr * 0.82,
        ang: baseAng + (rng() - 0.5) * 2.4 + (rng() - 0.5) * 0.9,
        len: STICK_LEN, lenScale: 1,
        tol: 0.014 * (0.85 + rng() * 0.45),
        disturb: 0,
        state: "pile",
        dropDelay: idx * 14,
        fromCx: 0, fromCy: 0, fromAng: baseAng + (rng() - 0.5) * 0.2,
        anim: null
      };
      s.finalCx = s.cx; s.finalCy = s.cy; s.finalAng = s.ang;
      sticks.push(s);
    });
    buildGraph();
    busy = true;
    dropStart = performance.now();
    setStatus(mode === "2p" ? "<span class='turn'>Player 1</span> to move" : "Your pile. Take it apart.");
    updateScore();
  }

  // builds loads[] for every stick: entries {other, x, y} = sticks resting on it
  var loads = [];
  function buildGraph() {
    loads = sticks.map(function () { return []; });
    var pile = sticks.filter(function (s) { return s.state === "pile" || s.state === "grab"; });
    for (var i = 0; i < pile.length; i++) {
      for (var j = i + 1; j < pile.length; j++) {
        var A = pile[i], B = pile[j];   // pile[] is in drop order: B lies on A
        var ea = stickEnds(A), eb = stickEnds(B);
        var hit = segInt(ea.a, ea.b, eb.a, eb.b);
        if (hit) loads[A.id].push({ other: B.id, x: hit.x, y: hit.y });
      }
    }
  }
  function loadersOf(id) { return loads[id] || []; }

  function pileCount() {
    return sticks.filter(function (s) { return s.state === "pile" || s.state === "grab"; }).length;
  }

  // ---------------- turns, faults, collecting ----------------
  var dropStart = 0;
  function setStatus(html) { statusEl.innerHTML = html; }
  function updateScore() {
    var left = pileCount();
    var inPile = sticks.filter(function (s) { return s.state === "pile" || s.state === "grab"; })
      .reduce(function (a, s) { return a + s.rank.pts; }, 0);
    subEl.textContent = left + " sticks on the table · " + inPile + " points in the pile";
    if (mode === "solo") {
      scoreEl.innerHTML = "Score <b style='color:#f0c169'>" + players[0].score + "</b> · " +
        players[0].taken.length + " sticks · Faults " + soloFaults;
    } else {
      scoreEl.innerHTML =
        "<span style='" + (current === 0 ? "color:#f0c169" : "") + "'>P1 <b>" + players[0].score + "</b></span> · " +
        "<span style='" + (current === 1 ? "color:#f0c169" : "") + "'>P2 <b>" + players[1].score + "</b></span>";
    }
  }

  function fault(loader) {
    faultSound();
    faultFX = { stick: loader, t0: performance.now() };
    var perp = loader.ang + Math.PI / 2;
    var dir = (rng() - 0.5) > 0 ? 1 : -1;
    var dist = 0.010 + rng() * 0.008;
    loader.anim = {
      kind: "roll", t0: performance.now(), dur: 340,
      fromCx: loader.cx, fromCy: loader.cy, fromAng: loader.ang,
      toCx: loader.cx + Math.cos(perp) * dist * dir,
      toCy: loader.cy + Math.sin(perp) * dist * dir,
      toAng: loader.ang + (0.04 + rng() * 0.05) * dir
    };
    loader.state = "roll";
    if (grabbed) {
      grabbed.anim = {
        kind: "return", t0: performance.now(), dur: 300,
        fromCx: grabbed.cx, fromCy: grabbed.cy, fromAng: grabbed.ang,
        toCx: grabbed.startCx, toCy: grabbed.startCy, toAng: grabbed.startAng
      };
      grabbed.state = "return";
      grabbed = null;
    }
    contacts = [];
    sticks.forEach(function (s) { s.disturb = 0; });
    busy = true;
    if (mode === "solo") {
      soloFaults++;
      setStatus("It moved — the " + loader.rank.name.toLowerCase() + " rolled. Fault " + soloFaults + ".");
    } else {
      setStatus("It moved — the " + loader.rank.name.toLowerCase() + " rolled. Turn over.");
      current = 1 - current;
      bannerUntil = performance.now() + 1600;
      setTimeout(function () {
        if (!gameOver) setStatus("<span class='turn'>Player " + (current + 1) + "</span> to move");
      }, 1650);
    }
    updateScore();
  }

  function collect(stick) {
    collectSound();
    stick.state = "collect";
    var slot = players[current].taken.length;
    players[current].taken.push(stick.id);
    players[current].score += stick.rank.pts;
    var target = traySlot(current, slot);
    stick.anim = {
      kind: "collect", t0: performance.now(), dur: 430,
      fromCx: stick.cx, fromCy: stick.cy, fromAng: stick.ang, fromScale: 1,
      toCx: target.x, toCy: target.y, toAng: target.ang, toScale: target.scale
    };
    // sticks that were resting on it settle a breath as the support leaves
    loadersOf(stick.id).forEach(function (L) {
      var other = sticks[L.other];
      if (other.state !== "pile") return;
      other.anim = {
        kind: "settle", t0: performance.now() + 60, dur: 260,
        fromCx: other.cx, fromCy: other.cy, fromAng: other.ang,
        toCx: other.cx + (L.x - other.cx) * 0.05,
        toCy: other.cy + (L.y - other.cy) * 0.05,
        toAng: other.ang + (rng() - 0.5) * 0.02
      };
      other.state = "settle";
    });
    grabbed = null; contacts = [];
    sticks.forEach(function (s) { s.disturb = 0; });
    busy = true;
    setStatus("Clean. The " + stick.rank.name.toLowerCase() + " is yours (+" + stick.rank.pts + ")." +
      (mode === "2p" ? " Go again." : ""));
    updateScore();
  }

  function endCheck() {
    if (pileCount() === 0 && !gameOver) {
      gameOver = true;
      if (mode === "solo") {
        setStatus("Pile cleared. <b style='color:#f0c169'>" + players[0].score + " points</b>, " +
          soloFaults + " fault" + (soloFaults === 1 ? "" : "s") + ". New drop to play again.");
      } else {
        var w = players[0].score === players[1].score ? "A draw" :
          (players[0].score > players[1].score ? "Player 1 wins" : "Player 2 wins");
        setStatus("<b style='color:#f0c169'>" + w + "</b> — " + players[0].score + " to " + players[1].score + ". New drop to play again.");
      }
      updateScore();
    }
  }

  // ---------------- layout ----------------
  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var landscape = W >= H * 0.92;
    if (landscape) {
      view.s = Math.min(H * 0.72, W * 0.52);
      view.cx = W * 0.42; view.cy = H * 0.53;
      trayRects[0] = { x: W * 0.755, y: H * 0.13, w: W * 0.225, h: H * 0.36 };
      trayRects[1] = { x: W * 0.755, y: H * 0.545, w: W * 0.225, h: H * 0.36 };
    } else {
      view.s = Math.min(W * 0.86, H * 0.47);
      view.cx = W * 0.5; view.cy = H * 0.44;
      trayRects[0] = { x: W * 0.04, y: H * 0.70, w: W * 0.44, h: H * 0.26 };
      trayRects[1] = { x: W * 0.52, y: H * 0.70, w: W * 0.44, h: H * 0.26 };
    }
  }
  function traySlot(player, slot) {
    var r = trayRects[player];
    var cols = 3;
    var colW = (r.w - 16) / cols, rowH = clamp((r.h - 50) / 14, 8, 24);
    var col = slot % cols, row = Math.floor(slot / cols);
    // convert tray slot centre (screen px) into world units relative to pile centre
    var px = r.x + 10 + col * colW + colW / 2;
    var py = r.y + 46 + row * rowH;
    return { x: (px - view.cx) / view.s, y: (py - view.cy) / view.s, ang: (slot % 2 ? 0.045 : -0.045), scale: (colW * 0.92) / view.s };
  }
  window.addEventListener("resize", layout);

  // ---------------- pointer / dragging ----------------
  function toWorld(e) {
    return { x: (e.clientX - view.cx) / view.s, y: (e.clientY - view.cy) / view.s };
  }
  function pickStick(w) {
    var best = null, bestD = 1e9;
    for (var i = sticks.length - 1; i >= 0; i--) {
      var s = sticks[i];
      if (s.state !== "pile") continue;
      var e = stickEnds(s);
      var r = ptSegDist(w.x, w.y, e.a, e.b);
      var grabR = Math.max(HALF_W * 2.4, 26 / view.s);
      if (r.d < grabR && r.d < bestD) { bestD = r.d; best = { stick: s, t: r.t }; }
    }
    return best;
  }

  canvas.addEventListener("pointerdown", function (e) {
    audio();
    if (busy || gameOver || grabbed) return;
    var w = toWorld(e);
    pointer.x = w.x; pointer.y = w.y; pointer.down = true;
    var pick = pickStick(w);
    if (!pick) return;
    var s = pick.stick;
    grabbed = s;
    s.state = "grab";
    s.startCx = s.cx; s.startCy = s.cy; s.startAng = s.ang;
    s.grabT = pick.t; s.angVel = 0;
    sticks.forEach(function (o) { o.disturb = 0; });
    contacts = loadersOf(s.id).map(function (L) {
      return { loader: sticks[L.other], prevX: L.x, prevY: L.y };
    }).filter(function (c) { return c.loader.state === "pile"; });
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", function (e) {
    var w = toWorld(e);
    pointer.x = w.x; pointer.y = w.y;
  });
  function releasePointer() {
    pointer.down = false;
    if (!grabbed) return;
    var s = grabbed; grabbed = null; contacts = [];
    s.anim = {
      kind: "return", t0: performance.now(), dur: 280,
      fromCx: s.cx, fromCy: s.cy, fromAng: s.ang,
      toCx: s.startCx, toCy: s.startCy, toAng: s.startAng
    };
    s.state = "return";
    sticks.forEach(function (o) { o.disturb = 0; });
    busy = true;
    settleSound();
  }
  canvas.addEventListener("pointerup", releasePointer);
  canvas.addEventListener("pointercancel", releasePointer);

  // one physics step of the grabbed stick + disturbance accounting
  function stepGrab() {
    var s = grabbed;
    if (!s) return;
    var e = stickEnds(s);
    var gx = e.a.x + (e.b.x - e.a.x) * s.grabT;
    var gy = e.a.y + (e.b.y - e.a.y) * s.grabT;
    var errX = pointer.x - gx, errY = pointer.y - gy;
    // spring: the grab point is pulled toward the pointer, heavy-wood lag
    var pull = 0.36;
    s.cx += errX * pull; s.cy += errY * pull;
    // torque: the stick swings from its grab point; grabbing near an end
    // pivots it, grabbing the middle slides it clean
    var rx = gx - s.cx, ry = gy - s.cy;
    var torque = (rx * errY - ry * errX) / (rx * rx + ry * ry + 0.015);
    s.angVel = clamp((s.angVel || 0) * 0.72 + torque * 0.045, -0.04, 0.04);
    s.ang += s.angVel;
    // disturbance: movement of the geometric crossing point per contact
    var e2 = stickEnds(s);
    var faulted = null;
    for (var i = contacts.length - 1; i >= 0; i--) {
      var c = contacts[i];
      if (c.loader.state !== "pile") { contacts.splice(i, 1); continue; }
      var el = stickEnds(c.loader);
      var hit = segInt(e2.a, e2.b, el.a, el.b);
      if (!hit) { contacts.splice(i, 1); continue; }   // slid out from under it
      var moved = Math.hypot(hit.x - c.prevX, hit.y - c.prevY);
      c.loader.disturb += moved;
      c.prevX = hit.x; c.prevY = hit.y;
      if (c.loader.disturb > c.loader.tol && !faulted) faulted = c.loader;
    }
    if (faulted) { fault(faulted); return; }
    // clear? the whole segment must be free of every other pile stick —
    // and the stick must actually have travelled, not just been touched
    if (Math.hypot(s.cx - s.startCx, s.cy - s.startCy) < 0.04) return;
    var clear = true;
    for (var k = 0; k < sticks.length; k++) {
      var o = sticks[k];
      if (o === s || o.state !== "pile") continue;
      var eo = stickEnds(o);
      if (segSegDist(e2.a, e2.b, eo.a, eo.b) < HALF_W * 2 + 0.006) { clear = false; break; }
    }
    if (clear) collect(s);
  }

  // ---------------- animations ----------------
  function stepAnims(now) {
    var any = false;
    sticks.forEach(function (s) {
      if (!s.anim) return;
      var a = s.anim;
      var t = clamp((now - a.t0) / a.dur, 0, 1);
      var k = a.kind === "collect" ? easeInOut(t) : easeOut(t);
      s.cx = lerp(a.fromCx, a.toCx, k);
      s.cy = lerp(a.fromCy, a.toCy, k);
      s.ang = lerp(a.fromAng, a.toAng, k);
      if (a.kind === "collect") s.lenScale = lerp(a.fromScale, a.toScale, k);
      if (t < 1) { any = true; return; }
      s.anim = null;
      if (a.kind === "collect") { s.state = "tray"; s.lenScale = a.toScale; buildGraph(); }
      else if (a.kind === "roll" || a.kind === "return" || a.kind === "settle") {
        s.state = "pile";
        buildGraph();
      }
      if (a.kind === "return") settleSound();
    });
    // drop-in animation
    if (dropStart) {
      var dt = now - dropStart;
      var done = true;
      sticks.forEach(function (s) {
        var lt = clamp((dt - s.dropDelay) / 420, 0, 1);
        if (lt < 1) done = false;
        var k = easeOut(lt);
        s.cx = lerp(s.fromCx, s.finalCx, k);
        s.cy = lerp(s.fromCy - 0.06 * (1 - k), s.finalCy, k);
        s.ang = lerp(s.fromAng, s.finalAng, k);
      });
      if (done) dropStart = 0;
      else any = true;
    }
    if (!any && !grabbed) {
      if (busy) { busy = false; endCheck(); }
    }
  }

  // ---------------- rendering ----------------
  function toPx(x, y) { return [view.cx + x * view.s, view.cy + y * view.s]; }

  function drawTable(now) {
    var g = ctx.createRadialGradient(view.cx, view.cy, 40, view.cx, view.cy, Math.max(W, H) * 0.75);
    g.addColorStop(0, "#3d2716");
    g.addColorStop(0.55, "#2b1a0e");
    g.addColorStop(1, "#17100b");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // plank seams + grain, subtle
    ctx.strokeStyle = "rgba(0,0,0,0.20)";
    ctx.lineWidth = 1.5;
    var seamGap = Math.max(90, H / 7);
    for (var y = seamGap * 0.5; y < H; y += seamGap) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.strokeStyle = "rgba(255,205,140,0.045)";
    for (var i = 0; i < 26; i++) {
      var gy = ((i * 197.3) % H), gx = (i * 311.7) % W;
      ctx.beginPath(); ctx.moveTo(gx, gy);
      ctx.bezierCurveTo(gx + 60, gy + 3, gx + 120, gy - 3, gx + 190, gy + 1);
      ctx.stroke();
    }
    // soft pool of light on the play area
    var pool = ctx.createRadialGradient(view.cx, view.cy, 10, view.cx, view.cy, view.s * 0.78);
    pool.addColorStop(0, "rgba(255,214,150,0.10)");
    pool.addColorStop(1, "rgba(255,214,150,0)");
    ctx.fillStyle = pool;
    ctx.fillRect(view.cx - view.s, view.cy - view.s, view.s * 2, view.s * 2);
  }

  function stickPath(s, liftPx) {
    var e = stickEnds(s);
    var len = s.len * s.lenScale;
    var cxp = view.cx + s.cx * view.s, cyp = view.cy + s.cy * view.s;
    var ux = e.ux, uy = e.uy, nx = -uy, ny = ux;
    var hl = len * view.s / 2, hw = HALF_W * view.s * (s.lenScale < 1 ? 0.9 : 1);
    var prof = [[0, 0], [0.05, 0.62], [0.14, 0.92], [0.5, 1], [0.86, 0.92], [0.95, 0.62], [1, 0]];
    ctx.beginPath();
    var i, t, wdt, px, py;
    for (i = 0; i < prof.length; i++) {
      t = prof[i][0]; wdt = prof[i][1] * hw;
      px = cxp + ux * (t - 0.5) * 2 * hl + nx * wdt;
      py = cyp + uy * (t - 0.5) * 2 * hl + ny * wdt + (liftPx || 0);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    for (i = prof.length - 1; i >= 0; i--) {
      t = prof[i][0]; wdt = prof[i][1] * hw;
      px = cxp + ux * (t - 0.5) * 2 * hl - nx * wdt;
      py = cyp + uy * (t - 0.5) * 2 * hl - ny * wdt + (liftPx || 0);
      ctx.lineTo(px, py);
    }
    ctx.closePath();
    return { cxp: cxp, cyp: cyp + (liftPx || 0), ux: ux, uy: uy, nx: nx, ny: ny, hl: hl, hw: hw };
  }
  function widthAt(t) {
    var prof = [[0, 0], [0.05, 0.62], [0.14, 0.92], [0.5, 1], [0.86, 0.92], [0.95, 0.62], [1, 0]];
    for (var i = 1; i < prof.length; i++) {
      if (t <= prof[i][0]) {
        var f = (t - prof[i - 1][0]) / (prof[i][0] - prof[i - 1][0]);
        return lerp(prof[i - 1][1], prof[i][1], f);
      }
    }
    return 0;
  }
  function bandRect(geo, t0, t1, col) {
    var x0 = geo.cxp + geo.ux * (t0 - 0.5) * 2 * geo.hl, y0 = geo.cyp + geo.uy * (t0 - 0.5) * 2 * geo.hl;
    var x1 = geo.cxp + geo.ux * (t1 - 0.5) * 2 * geo.hl, y1 = geo.cyp + geo.uy * (t1 - 0.5) * 2 * geo.hl;
    var w0 = widthAt(t0) * geo.hw * 0.98, w1 = widthAt(t1) * geo.hw * 0.98;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x0 + geo.nx * w0, y0 + geo.ny * w0);
    ctx.lineTo(x1 + geo.nx * w1, y1 + geo.ny * w1);
    ctx.lineTo(x1 - geo.nx * w1, y1 - geo.ny * w1);
    ctx.lineTo(x0 - geo.nx * w0, y0 - geo.ny * w0);
    ctx.closePath(); ctx.fill();
  }
  function drawBands(s, geo) {
    var kind = s.rank.band, col = s.rank.col;
    if (kind === "spiral") {
      ctx.strokeStyle = col; ctx.lineCap = "round";
      for (var t = 0.06; t < 0.94; t += 0.055) {
        var wdt = widthAt(t) * geo.hw * 0.8;
        ctx.lineWidth = Math.max(1.4, geo.hw * 0.55);
        ctx.beginPath();
        var ax = geo.cxp + geo.ux * (t - 0.5) * 2 * geo.hl, ay = geo.cyp + geo.uy * (t - 0.5) * 2 * geo.hl;
        var bx2 = geo.cxp + geo.ux * (t + 0.045 - 0.5) * 2 * geo.hl, by2 = geo.cyp + geo.uy * (t + 0.045 - 0.5) * 2 * geo.hl;
        ctx.moveTo(ax - geo.nx * wdt, ay - geo.ny * wdt);
        ctx.lineTo(bx2 + geo.nx * wdt, by2 + geo.ny * wdt);
        ctx.stroke();
      }
    } else if (kind === "mandarin") {
      bandRect(geo, 0.435, 0.565, "#e8b91f");
      bandRect(geo, 0.435, 0.462, "#191919"); bandRect(geo, 0.538, 0.565, "#191919");
      bandRect(geo, 0.07, 0.105, "#191919"); bandRect(geo, 0.895, 0.93, "#191919");
      bandRect(geo, 0.115, 0.135, "#e8b91f"); bandRect(geo, 0.865, 0.885, "#e8b91f");
    } else if (kind === "five") {
      [0.26, 0.395, 0.53, 0.665, 0.80].forEach(function (t) { bandRect(geo, t - 0.026, t + 0.026, col); });
    } else if (kind === "three") {
      [0.30, 0.50, 0.70].forEach(function (t) { bandRect(geo, t - 0.03, t + 0.03, col); });
    } else if (kind === "two") {
      [0.32, 0.68].forEach(function (t) { bandRect(geo, t - 0.03, t + 0.03, col); });
    }
  }

  function drawStick(s, now) {
    var lifted = s.state === "grab";
    var heightIdx = s.state === "tray" ? 1 : s.id;
    var shOff = 2.5 + heightIdx * 0.14 + (lifted ? 7 : 0);
    var shAlpha = 0.26 + (lifted ? 0.10 : 0);
    // shadow
    ctx.save();
    ctx.translate(shOff, shOff * 1.35);
    stickPath(s, 0);
    ctx.fillStyle = "rgba(8,4,2," + shAlpha + ")";
    ctx.fill();
    ctx.restore();
    // body
    var geo = stickPath(s, 0);
    var grd = ctx.createLinearGradient(geo.cxp - geo.nx * geo.hw, geo.cyp - geo.ny * geo.hw,
      geo.cxp + geo.nx * geo.hw, geo.cyp + geo.ny * geo.hw);
    grd.addColorStop(0, s.rank.wood[0]);
    grd.addColorStop(0.5, s.rank.wood[1]);
    grd.addColorStop(1, s.rank.wood[2]);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = "rgba(50,28,8,0.6)";
    ctx.lineWidth = 0.8;
    ctx.stroke();
    // centre sheen
    ctx.save();
    stickPath(s, 0); ctx.clip();
    ctx.strokeStyle = "rgba(255,240,210,0.20)";
    ctx.lineWidth = Math.max(1, geo.hw * 0.34);
    ctx.beginPath();
    ctx.moveTo(geo.cxp - geo.ux * geo.hl * 0.92 - geo.nx * geo.hw * 0.34, geo.cyp - geo.uy * geo.hl * 0.92 - geo.ny * geo.hw * 0.34);
    ctx.lineTo(geo.cxp + geo.ux * geo.hl * 0.92 - geo.nx * geo.hw * 0.34, geo.cyp + geo.uy * geo.hl * 0.92 - geo.ny * geo.hw * 0.34);
    ctx.stroke();
    ctx.restore();
    drawBands(s, geo);
    if (lifted) {
      stickPath(s, 0);
      ctx.fillStyle = "rgba(255,244,214,0.07)";
      ctx.fill();
    }
    // stress tint: sticks resting on the grabbed stick show their load
    if (grabbed && s.state === "pile" && s.disturb > 0.001) {
      var ratio = clamp(s.disturb / s.tol, 0, 1);
      stickPath(s, 0);
      ctx.fillStyle = "rgba(255,64,26," + (0.08 + 0.40 * ratio) + ")";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,120,70," + (0.25 + 0.55 * ratio) + ")";
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    // fault flash ring
    if (faultFX && faultFX.stick === s) {
      var age = (now - faultFX.t0) / 700;
      if (age < 1) {
        var e = stickEnds(s);
        var c = toPx((e.a.x + e.b.x) / 2, (e.a.y + e.b.y) / 2);
        ctx.strokeStyle = "rgba(255,70,40," + (0.75 * (1 - age)) + ")";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(c[0], c[1], (0.12 + age * 0.16) * view.s, (0.05 + age * 0.07) * view.s, s.ang, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function drawTrays(now) {
    for (var p = 0; p < 2; p++) {
      if (mode === "solo" && p === 1) continue;
      var r = trayRects[p];
      ctx.fillStyle = "rgba(12,7,4,0.55)";
      ctx.strokeStyle = p === current && mode === "2p" ? "rgba(240,193,105,0.55)" : "rgba(234,223,200,0.14)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(r.x, r.y, r.w, r.h, 8);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = p === current || mode === "solo" ? "#f0c169" : "rgba(234,223,200,0.6)";
      ctx.font = "600 11px 'IBM Plex Mono', ui-monospace, monospace";
      ctx.fillText(mode === "solo" ? "YOUR TRAY" : "PLAYER " + (p + 1), r.x + 10, r.y + 18);
      ctx.fillStyle = "rgba(234,223,200,0.85)";
      ctx.font = "11px 'IBM Plex Mono', ui-monospace, monospace";
      ctx.fillText(players[p].score + " pts · " + players[p].taken.length + " sticks", r.x + 10, r.y + 33);
    }
  }

  function draw(now) {
    drawTable(now);
    drawTrays(now);
    // pile sticks in drop order, grabbed stick and animating sticks last
    var ordered = sticks.slice().sort(function (a, b) {
      function key(s) {
        if (s.state === "grab") return 1e6;
        if (s.state === "collect") return 9e5;
        if (s.state === "tray") return 2e5 + s.id;
        return s.id;
      }
      return key(a) - key(b);
    });
    ordered.forEach(function (s) { drawStick(s, now); });
    if (gameOver) {
      ctx.fillStyle = "rgba(10,5,2,0.45)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#f3e9d2";
      ctx.font = "600 " + Math.round(Math.min(W, H) * 0.045) + "px 'IBM Plex Mono', ui-monospace, monospace";
      ctx.textAlign = "center";
      var line = mode === "solo" ? "Pile cleared — " + players[0].score + " points" :
        (players[0].score === players[1].score ? "A draw — " + players[0].score + " all" :
          (players[0].score > players[1].score ? "Player 1 wins " : "Player 2 wins ") +
          Math.max(players[0].score, players[1].score) + " to " + Math.min(players[0].score, players[1].score));
      ctx.fillText(line, W / 2, H * 0.46);
      ctx.font = "12px 'IBM Plex Mono', ui-monospace, monospace";
      ctx.fillStyle = "rgba(234,223,200,0.7)";
      ctx.fillText("Press New drop to play again", W / 2, H * 0.46 + 26);
      ctx.textAlign = "left";
    }
    // turn banner flash in 2P
    if (bannerUntil && now < bannerUntil && mode === "2p" && !gameOver) {
      var a = clamp((bannerUntil - now) / 1600, 0, 1);
      ctx.fillStyle = "rgba(240,193,105," + (0.9 * Math.min(1, a * 2)) + ")";
      ctx.font = "600 15px 'IBM Plex Mono', ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText("PLAYER " + (current + 1) + " TO MOVE", view.cx, view.cy - view.s * 0.62);
      ctx.textAlign = "left";
    }
  }

  var frozenPose = stateParam === "disturbed";
  function frame(now) {
    if (grabbed && grabbed.state === "grab" && !frozenPose) stepGrab();
    stepAnims(now);
    draw(now);
    requestAnimationFrame(frame);
  }

  // ---------------- controls ----------------
  document.getElementById("btnDrop").addEventListener("click", function () { audio(); newDrop(); });
  var btnMode = document.getElementById("btnMode");
  btnMode.addEventListener("click", function () {
    mode = mode === "solo" ? "2p" : "solo";
    btnMode.textContent = mode === "solo" ? "Solo" : "2 players";
    btnMode.classList.toggle("active", mode === "2p");
    newDrop();
  });
  var btnSound = document.getElementById("btnSound");
  btnSound.addEventListener("click", function () {
    soundOn = !soundOn;
    btnSound.textContent = soundOn ? "Sound on" : "Muted";
    btnSound.classList.toggle("active", !soundOn);
    if (soundOn) { audio(); tickSound(); }
  });

  // ---------------- debug / screenshot states ----------------
  function setupDisturbed() {
    // pick a stick near the top of the pile carrying a readable load,
    // and heave it sideways — its loaders light up with stress
    var best = null, bestScore = -1;
    sticks.forEach(function (s) {
      var n = loadersOf(s.id).length;
      if (n < 2 || n > 9) return;
      var score = s.id * 2 + n;   // prefer higher in the stack, well loaded
      if (score > bestScore) { bestScore = score; best = s; }
    });
    if (!best) sticks.forEach(function (s) {
      if (loadersOf(s.id).length > bestScore) { bestScore = loadersOf(s.id).length; best = s; }
    });
    if (!best) return;
    grabbed = best;
    best.state = "grab";
    best.startCx = best.cx; best.startCy = best.cy; best.startAng = best.ang;
    best.grabT = 0.5; best.angVel = 0;
    var perp = best.ang + Math.PI / 2;
    best.cx += Math.cos(perp) * 0.06;
    best.cy += Math.sin(perp) * 0.06;
    best.ang += 0.13;
    pointer.x = best.cx + Math.cos(perp) * 0.05;
    pointer.y = best.cy + Math.sin(perp) * 0.05;
    pointer.down = true;
    contacts = loadersOf(best.id).map(function (L, i) {
      var loader = sticks[L.other];
      loader.disturb = loader.tol * (0.55 + 0.13 * (i % 3));
      return { loader: loader, prevX: L.x, prevY: L.y };
    });
    setStatus("That sideways heave is exactly how a fault happens — watch the loaded sticks glow.");
    updateScore();
  }

  layout();
  newDrop();
  if (seedParam) {
    // test hook (only with ?debug=): lets a headless driver play real drags
    window.__mikado = {
      get sticks() { return sticks; }, get players() { return players; },
      view: view, loads: function () { return loads; },
      state: function () {
        return {
          busy: busy, gameOver: gameOver, faults: soloFaults, mode: mode, current: current,
          grabbedId: grabbed ? grabbed.id : null,
          pile: pileCount(),
          status: statusEl.textContent
        };
      }
    };
  }
  if (stateParam === "disturbed") {
    // skip the drop-in animation and pose the disturbed scene
    sticks.forEach(function (s) { s.cx = s.finalCx; s.cy = s.finalCy; s.ang = s.finalAng; });
    dropStart = 0; busy = false;
    buildGraph();
    setupDisturbed();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
