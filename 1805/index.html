<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send In Sounds</title>
<style>
html, body { margin: 0; padding: 0; background: #060a12; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var FRAME_T = 60.0; /* fixed phase: t = 60 s */
var GROUND_TOP = '#0A1220'; /* deep blue-black, upper field */
var GROUND_LOW = '#05080F'; /* deep blue-black, lower field */
var DRIFT_A = '#7A8BA3'; /* ambient drifter slate blue */
var DRIFT_B = '#5E7089'; /* ambient drifter, deeper slate */
var TRACE_A = '#93A3B8'; /* absorbed trace, cool slate */
var TRACE_B = '#6E7F9C'; /* absorbed trace, deeper slate */
var TRACE_C = '#AAB6C8'; /* absorbed trace, palest slate */
var PALE = '#DFE8F2'; /* the live mark while it is being drawn */
var ZONE_LINE = '#8B9BB5'; /* thin line marking the input zone */
var PLATE_FILL = '#05080F';
var PLATE_LINE = 'rgba(139,155,181,0.30)';
var PLATE_INK = '#C7D2E0';
var HINT_INK = '#C7D2E0';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + clamp(a, 0, 1).toFixed(4) + ')';
}
function smooth01(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
/* ---- seeded anonymous traces (past contributions, identity gone) ----
   Each trace is a random walk made at seed time, then stretched,
   folded and cooled. Birth times are negative, so at frame one the
   traces are already old: faint, settled, unrecognizable. */
var TRACES = [];
function makeTrace(rng, birthT, tone, peak) {
  var cx = 0.08 + rng() * 0.84;
  var cy = 0.08 + rng() * 0.76;
  var n = 8 + Math.floor(rng() * 7);
  var pts = [];
  var x = cx, y = cy, i;
  for (i = 0; i < n; i++) {
    pts.push([x, y]);
    x += (rng() - 0.5) * 0.16;
    y += (rng() - 0.5) * 0.10;
    x = clamp(x, 0.02, 0.98);
    y = clamp(y, 0.02, 0.98);
  }
  return {
    pts: pts, cx: cx, cy: cy,
    stretch: 1.6 + rng() * 0.8, /* time-stretch: pulled wide */
    folds: 3, /* layer-fold: drawn three times, offset */
    tone: tone, peak: peak,
    birthT: birthT,
    driftP: 90 + rng() * 90, /* slow drift period, seconds */
    driftA: 0.01 + rng() * 0.02, /* drift amplitude, field fraction */
    driftPh: rng() * TAU
  };
}
(function buildTraces() {
  var rng = mulberry32(1805);
  var tones = [TRACE_A, TRACE_B, TRACE_C];
  var i;
  for (i = 0; i < 12; i++) {
    var age = 120 + rng() * 900; /* born 2 to 17 minutes before frame one */
    TRACES.push(makeTrace(rng, -age, tones[i % 3], 0.10 + rng() * 0.08));
  }
  /* Returning visits carry more anonymous traces: only a count is kept,
     never a mark. Guarded; the QA harness has no localStorage. */
  var extra = 0;
  try {
    if (typeof localStorage !== 'undefined' && localStorage) {
      var raw = localStorage.getItem('send-in-sounds-count');
      if (raw) extra = clamp(parseInt(raw, 10) || 0, 0, 12);
    }
  } catch (e) { extra = 0; }
  for (i = 0; i < extra; i++) {
    var r2 = mulberry32(1805 + 1000 + i);
    TRACES.push(makeTrace(r2, -(600 + i * 240), TRACE_B, 0.08));
  }
})();
/* ---- ambient drifters: slow shapes, closed-form motion only ---- */
var DRIFTERS = [];
(function buildDrifters() {
  var rng = mulberry32(91805);
  var i;
  for (i = 0; i < 16; i++) {
    DRIFTERS.push({
      cx: 0.05 + rng() * 0.90,
      cy: 0.05 + rng() * 0.90,
      rx: 0.02 + rng() * 0.06,
      ry: 0.012 + rng() * 0.035,
      rot: rng() * Math.PI,
      tone: rng() > 0.5 ? DRIFT_A : DRIFT_B,
      alpha: 0.05 + rng() * 0.07,
      pX: 48 + rng() * 72, /* drift periods, seconds: nothing fast */
      pY: 60 + rng() * 84,
      phX: rng() * TAU,
      phY: rng() * TAU,
      ampX: 0.01 + rng() * 0.025,
      ampY: 0.008 + rng() * 0.02,
      pulseP: 14 + rng() * 18, /* slow pulse, always under 14 Hz by far */
      pulsePh: rng() * TAU,
      ring: rng() > 0.6 /* some drifters are thin rings, not filled blobs */
    });
  }
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
var ZONE = { x: 0, y: 0, w: 0, h: 0 }; /* one-time input zone, lower right */
var given = false; /* the one contribution has been made */
var drawing = false;
var livePts = []; /* the mark while it is being drawn, field coords */
var zoneAlpha = 1; /* fades to 0 after the contribution is absorbed */
var zoneGoneT = -1; /* phase time the zone started fading, -1 while open */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
  var zw = isPhone ? F.w * 0.34 : F.w * 0.22;
  var zh = isPhone ? F.h * 0.13 : F.h * 0.16;
  var m = isPhone ? 14 : 18;
  ZONE = { x: F.x + F.w - zw - m, y: F.y + F.h - zh - m, w: zw, h: zh };
}
/* trace alpha: decays from its peak toward a faint floor over 240 s,
   then holds. Old traces never vanish entirely; the field keeps them. */
function traceAlpha(tr, t) {
  var age = t - tr.birthT;
  var floor = 0.10;
  var a = floor + (tr.peak - floor) * Math.exp(-Math.max(age, 0) / 240);
  return clamp(a, 0, 1);
}
function drawTrace(tr, t) {
  var a = traceAlpha(tr, t);
  if (a <= 0.005) return;
  var dx = Math.sin(TAU * t / tr.driftP + tr.driftPh) * tr.driftA * F.w;
  var dy = Math.cos(TAU * t / (tr.driftP * 1.3) + tr.driftPh) * tr.driftA * F.h * 0.6;
  var f, i, px, py;
  for (f = 0; f < tr.folds; f++) {
    var off = (f - 1) * Math.max(2, F.w * 0.004);
    var fa = a * (f === 1 ? 1 : 0.45); /* middle fold strongest */
    ctx.strokeStyle = rgba(tr.tone, fa);
    ctx.lineWidth = Math.max(1, F.w * 0.0022) * (f === 1 ? 1 : 1.8);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (i = 0; i < tr.pts.length; i++) {
      px = F.x + (tr.cx + (tr.pts[i][0] - tr.cx) * tr.stretch) * F.w + dx + off;
      py = F.y + tr.pts[i][1] * F.h + dy + off * 0.6;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
}
function drawDrifter(d, t) {
  var cx = F.x + (d.cx + Math.sin(TAU * t / d.pX + d.phX) * d.ampX) * F.w;
  var cy = F.y + (d.cy + Math.cos(TAU * t / d.pY + d.phY) * d.ampY) * F.h;
  var pulse = 0.75 + 0.25 * Math.sin(TAU * t / d.pulseP + d.pulsePh);
  var rx = d.rx * F.w * pulse;
  var ry = d.ry * F.h * pulse;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(d.rot);
  if (d.ring) {
    ctx.strokeStyle = rgba(d.tone, d.alpha);
    ctx.lineWidth = Math.max(1, F.w * 0.0016);
    ctx.beginPath();
    ctx.moveTo(rx, 0);
    ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
    ctx.stroke();
  } else {
    ctx.fillStyle = rgba(d.tone, d.alpha);
    ctx.beginPath();
    ctx.moveTo(rx, 0);
    ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}
function drawField(t) {
  var g = ctx.createLinearGradient(0, F.y, 0, F.y + F.h);
  g.addColorStop(0, GROUND_TOP);
  g.addColorStop(1, GROUND_LOW);
  ctx.fillStyle = g;
  ctx.fillRect(F.x, F.y, F.w, F.h);
  ctx.save();
  ctx.beginPath();
  ctx.rect(F.x, F.y, F.w, F.h);
  ctx.clip();
  var i;
  for (i = 0; i < DRIFTERS.length; i++) drawDrifter(DRIFTERS[i], t);
  for (i = 0; i < TRACES.length; i++) drawTrace(TRACES[i], t);
  ctx.restore();
}
function drawLiveMark() {
  if (livePts.length < 2) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(ZONE.x, ZONE.y, ZONE.w, ZONE.h);
  ctx.clip();
  ctx.strokeStyle = rgba(PALE, 0.85);
  ctx.lineWidth = Math.max(1.5, F.w * 0.003);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  var i;
  for (i = 0; i < livePts.length; i++) {
    var px = F.x + livePts[i][0] * F.w;
    var py = F.y + livePts[i][1] * F.h;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
}
function drawZone(t) {
  if (zoneGoneT >= 0) {
    zoneAlpha = clamp(1 - (t - zoneGoneT) / 2, 0, 1);
  }
  if (zoneAlpha <= 0.005) return;
  ctx.strokeStyle = rgba(ZONE_LINE, 0.55 * zoneAlpha);
  ctx.lineWidth = 1;
  ctx.strokeRect(ZONE.x + 0.5, ZONE.y + 0.5, ZONE.w - 1, ZONE.h - 1);
  ctx.fillStyle = rgba(ZONE_LINE, 0.75 * zoneAlpha);
  ctx.font = (isPhone ? 10 : 11) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('draw once', ZONE.x + ZONE.w / 2, ZONE.y + ZONE.h / 2);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Send In Sounds').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Send In Sounds').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 21').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Send In Sounds', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 21', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Draw once; the field keeps only the echo.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = '#060A12';
  ctx.fillRect(0, 0, VW, VH);
  drawField(phaseT);
  drawLiveMark();
  drawZone(phaseT);
  drawPlates();
}
/* ---- the one contribution: take, transform, absorb ----
   On release the live mark is never drawn again. Its points are
   re-centred, stretched wide, folded into three offset layers, cooled
   to uniform slate, and added to the field as an anonymous trace with
   its own long decay. The zone then fades away. No undo, no replay. */
function inZone(x, y) {
  return x >= ZONE.x && x <= ZONE.x + ZONE.w && y >= ZONE.y && y <= ZONE.y + ZONE.h;
}
function toField(e) {
  var rect = { left: 0, top: 0 };
  try { if (canvas.getBoundingClientRect) rect = canvas.getBoundingClientRect(); } catch (err) { rect = { left: 0, top: 0 }; }
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function absorbMark() {
  if (livePts.length < 2) { livePts = []; return; }
  var i, sx = 0, sy = 0;
  for (i = 0; i < livePts.length; i++) { sx += livePts[i][0]; sy += livePts[i][1]; }
  var cx = sx / livePts.length, cy = sy / livePts.length;
  var pts = [];
  for (i = 0; i < livePts.length; i++) {
    /* time-stretch: pulled wide around its own centre */
    pts.push([cx + (livePts[i][0] - cx) * 2.2, livePts[i][1]]);
  }
  TRACES.push({
    pts: pts, cx: cx, cy: cy,
    stretch: 1.0, /* already stretched above */
    folds: 3, tone: TRACE_A, peak: 0.32,
    birthT: phaseT,
    driftP: 120, driftA: 0.012, driftPh: phaseT
  });
  livePts = [];
  given = true;
  zoneGoneT = phaseT;
  try {
    if (typeof localStorage !== 'undefined' && localStorage) {
      var raw = localStorage.getItem('send-in-sounds-count');
      var n = raw ? (parseInt(raw, 10) || 0) : 0;
      localStorage.setItem('send-in-sounds-count', String(n + 1));
    }
  } catch (e) { /* anonymous count only; a failed store changes nothing */ }
}
function onDown(e) {
  if (given || drawing) return;
  var p = toField(e);
  if (!inZone(p.x, p.y)) return;
  drawing = true;
  livePts = [[(p.x - F.x) / F.w, (p.y - F.y) / F.h]];
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (!drawing) return;
  var p = toField(e);
  livePts.push([clamp((p.x - F.x) / F.w, 0, 1), clamp((p.y - F.y) / F.h, 0, 1)]);
  if (livePts.length > 400) livePts.shift();
  if (e.preventDefault) e.preventDefault();
}
function onUp(e) {
  if (!drawing) return;
  drawing = false;
  absorbMark();
  if (e.preventDefault) e.preventDefault();
}
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    traceCount: function () { return TRACES.length; },
    traceAlpha: traceAlpha,
    zone: function () { return ZONE; },
    given: function () { return given; }
  };
}
/* ---- frame one: fixed phase t = 60 s ----
   No wall clock is read for frame one. The field is already dense
   with twelve old anonymous traces; the input zone sits open in the
   lower right corner, waiting for the one mark. */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  var startMs = Date.now();
  (function loop() {
    function step() {
      phaseT = FRAME_T + (Date.now() - startMs) / 1000;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
