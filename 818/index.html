<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hidden Singers</title>
<style>
  html, body { margin: 0; padding: 0; background: #08080A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var BG = '#08080A';
  var STRING = '#D8D2C0';
  var GHOST = '#F2EEE2';

  var LOOP = 36;        // seconds, seamless
  var PHASE0 = 27;      // frame one sits in the choir hold (26-30s)
  var NMIN = 2, NMAX = 16;

  var W = 0, H = 0, phone = false;
  var phase = PHASE0;

  function ss(a, b, x) {
    var t = (x - a) / (b - a);
    if (t < 0) t = 0; if (t > 1) t = 1;
    return t * t * (3 - 2 * t);
  }

  // Reference sum for normalisation: all partials at gain 1, fully risen.
  var REF = 0;
  for (var n = NMIN; n <= NMAX; n++) REF += 1 / Math.pow(n, 1.1);

  // Composite profile, raw (before normalisation): the rectified partial
  // envelopes summed, grouped by the third partial's own envelope so the
  // mass gathers into broad presences instead of two n=2 domes.
  function rawProfile(u, amps) {
    var s = 0;
    for (var i = 0; i < amps.length; i++) {
      var n = NMIN + i;
      s += amps[i] * Math.abs(Math.sin(n * Math.PI * u));
    }
    var env = 0.58 + 0.42 * Math.abs(Math.sin(3 * Math.PI * u));
    return s * env;
  }

  // Static normaliser: the maximum of the full-gain profile, sampled
  // once at load (deterministic constant).
  var NORM = 0;
  (function () {
    var full = [];
    for (var i = 0; i < NMAX - NMIN + 1; i++) full.push(Math.pow(NMIN + i, -1.1));
    for (var j = 0; j <= 1200; j++) {
      var v = rawProfile(j / 1200, full);
      if (v > NORM) NORM = v;
    }
  })();

  // Amplitude of partial n at loop time t (closed form).
  function partialAmp(n, t) {
    var w = 1 / Math.pow(n, 1.1);
    // Strum excitation: present at the strike, decays through 0-3s.
    var strum = 0.38 * Math.exp(-t / 1.05);
    // Sequential rise of partials 2..16 across 3-12s.
    var start = 3 + (n - NMIN) * (9 / (NMAX - NMIN));
    var rise = ss(start, start + 2.5, t);
    // Gain climb while the figures form, 12-26s.
    var gain = 0.55 + 0.45 * ss(12, 26, t);
    var a = w * Math.max(strum, rise * gain);
    return a;
  }

  // Global fade: quick bloom at the strike, long fade 30-36s.
  function masterFade(t) {
    var f = ss(0, 0.45, t);
    if (t > 30) f *= 1 - ss(30, 35.2, t);
    return f;
  }

  // Figure formation factor, 12-26s.
  function formFactor(t) { return ss(12, 26, t); }

  // Composite standing-wave profile: lobes where the partial envelopes
  // reinforce, necks where they cancel. The figures are this sum and
  // nothing else.
  function profileAt(u, t, amps) {
    return rawProfile(u, amps) / NORM;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var sw = (window.screen && window.screen.width) ? Math.min(window.screen.width, window.screen.height) : 9999;
    phone = (sw < 700) || (h > w * 1.15);
    draw(phase);
  }

  function draw(t) {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var F = masterFade(t);
    if (F <= 0.001) return;
    var form = formFactor(t);

    var stringY = H * (phone ? 0.68 : 0.70);
    var maxH = H * (phone ? 0.46 : 0.52);
    var M = 260;

    var amps = [];
    for (var n = NMIN; n <= NMAX; n++) amps.push(partialAmp(n, t));

    // --- Individual partial arcs (thin early, thickening with gain) ---
    var arcAlpha = (1 - form * 0.72) * F;
    if (arcAlpha > 0.01) {
      for (var i = 0; i < amps.length; i++) {
        var nn = NMIN + i;
        var aN = amps[i] / REF; // normalised height fraction
        if (aN < 0.004) continue;
        ctx.beginPath();
        for (var j = 0; j <= M; j++) {
          var u = j / M;
          var y = stringY - aN * maxH * Math.abs(Math.sin(nn * Math.PI * u));
          var x = u * W;
          if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = GHOST;
        ctx.globalAlpha = arcAlpha * (0.05 + 0.11 * Math.min(1, aN * 6));
        ctx.lineWidth = 1 + 3 * form * Math.min(1, aN * 5);
        ctx.stroke();
      }
    }

    // --- Composite silhouette: the summed wave gathered into figures ---
    // The continuous envelope sum reads as one landscape mass, so the
    // formed silhouette is quantised into NCELL figure cells along x.
    // Each cell keeps the envelope sum as its height source, multiplied
    // by a raised window that falls to zero at the cell boundaries: the
    // mass separates into distinct standing presences with real gaps
    // down to (or near) the string between them, each form narrower
    // than tall, its top gently domed by the window. Nested scaled
    // copies of the same windowed profile give each figure a denser
    // core. No strata, no seams: nothing horizontal is drawn.
    if (form > 0.01) {
      var NCELL = 8;
      function figProfile(u) {
        var v = (u * NCELL) % 1;
        var w = Math.pow(Math.sin(Math.PI * v), 0.8);
        return profileAt(u, t, amps) * w;
      }
      function figPath(scale) {
        ctx.beginPath();
        ctx.moveTo(0, stringY);
        for (var j2 = 0; j2 <= M; j2++) {
          var u2 = j2 / M;
          var y2 = stringY - figProfile(u2) * maxH * scale;
          ctx.lineTo(u2 * W, y2);
        }
        ctx.lineTo(W, stringY);
        ctx.closePath();
      }
      ctx.fillStyle = GHOST;
      ctx.globalAlpha = 0.12 * form * F;
      figPath(1.0);
      ctx.fill();
      ctx.globalAlpha = 0.10 * form * F;
      figPath(0.80);
      ctx.fill();
      ctx.globalAlpha = 0.10 * form * F;
      figPath(0.60);
      ctx.fill();
      // Top edge of the windowed profile: a brighter defining line.
      ctx.beginPath();
      for (var j3 = 0; j3 <= M; j3++) {
        var u3 = j3 / M;
        var y3 = stringY - figProfile(u3) * maxH;
        if (j3 === 0) ctx.moveTo(u3 * W, y3); else ctx.lineTo(u3 * W, y3);
      }
      ctx.strokeStyle = GHOST;
      ctx.globalAlpha = 0.34 * form * F;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    // --- The string itself: thick low E, blooming at the strike ---
    var strumEnv = Math.exp(-t / 1.15);
    var vib = (2.6 * strumEnv + 0.5) * Math.sin(Math.PI * 0.5); // base displacement scale
    function stringPath() {
      ctx.beginPath();
      for (var j4 = 0; j4 <= 120; j4++) {
        var u4 = j4 / 120;
        var y4 = stringY - Math.sin(Math.PI * u4) * vib * Math.sin(2 * Math.PI * (t / 3.2)) * 0.6;
        if (j4 === 0) ctx.moveTo(u4 * W, y4); else ctx.lineTo(u4 * W, y4);
      }
    }
    ctx.globalAlpha = (0.10 + 0.12 * strumEnv) * F;
    ctx.strokeStyle = STRING;
    ctx.lineWidth = 13;
    stringPath(); ctx.stroke();
    ctx.globalAlpha = (0.30 + 0.28 * strumEnv) * F;
    ctx.lineWidth = 7;
    stringPath(); ctx.stroke();
    ctx.globalAlpha = (0.95) * F;
    ctx.lineWidth = 4;
    stringPath(); ctx.stroke();

    ctx.globalAlpha = 1;
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();
  draw(PHASE0);

  if (typeof requestAnimationFrame === 'function') {
    var startTs = null;
    var tick = function (ts) {
      if (startTs === null) startTs = ts;
      phase = (PHASE0 + (ts - startTs) / 1000) % LOOP;
      draw(phase);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
