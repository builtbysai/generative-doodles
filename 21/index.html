<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№21 · Ticks</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0c; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(245,240,228,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.85); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another ticks</div>
<script>
'use strict';
// No21 Ticks.
// A clock face with no hands and no numbers: concentric rings of tick
// marks, each tick a short radial line whose length is set by one
// angular wave per ring, so every ring breathes at its own rate and
// the waves interfere where they align. Ticks never touch; the rings
// are read from the gaps as much as the marks. Warm white on
// near-black, with every ring's longest tick in gold.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '21', 10) || 21;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0a0a0c';

function compose(s) {
  const rnd = mulberry32(s);
  const rings = [];
  const n = 9 + ((rnd() * 3) | 0);
  for (let i = 0; i < n; i++) {
    rings.push({
      k: 2 + ((rnd() * 6) | 0),
      ph: rnd() * Math.PI * 2,
      count: 36 + i * 10 + ((rnd() * 8) | 0)
    });
  }
  return { rings };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2;
  const R = S * 0.46;
  const ringGap = R / p.rings.length;
  ctx.lineWidth = Math.max(0.8, S / 800);
  ctx.lineCap = 'round';

  p.rings.forEach((ring, ri) => {
    const rMid = ringGap * (ri + 0.5);
    // find this ring's peak angle for the gold tick
    let peakA = 0, peakV = -1;
    for (let i = 0; i < ring.count; i++) {
      const a = (i / ring.count) * Math.PI * 2;
      const v = 0.5 + 0.5 * Math.sin(a * ring.k + ring.ph);
      if (v > peakV) { peakV = v; peakA = a; }
    }
    for (let i = 0; i < ring.count; i++) {
      const a = (i / ring.count) * Math.PI * 2;
      const v = 0.5 + 0.5 * Math.sin(a * ring.k + ring.ph);
      const len = ringGap * (0.18 + v * 0.62);
      const gold = Math.abs(a - peakA) < (Math.PI * 2 / ring.count) * 0.6;
      ctx.strokeStyle = gold ? 'rgba(212,175,55,0.95)' : 'rgba(245,240,228,0.72)';
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (rMid - len / 2), cy + Math.sin(a) * (rMid - len / 2));
      ctx.lineTo(cx + Math.cos(a) * (rMid + len / 2), cy + Math.sin(a) * (rMid + len / 2));
      ctx.stroke();
    }
  });
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
