<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.206 Instant Life</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#04070A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.206 Instant Life (Asia Ward). Sammy the Sea Monkey at
// sixteen feet: a monumental brine shrimp of heat welded PETG
// membrane over a segmented body, far too big for the frame. The
// frame is only a window. It swims upside down, the way brine
// shrimp do, belly and eleven paddling leg pairs toward the top,
// head entering from the upper left, tail fan trailing to the
// lower right. The window pans slowly along the whole animal on
// a forty second loop, head to tail and back; drag to slide the
// window yourself, and on release the slow pan takes it again.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#04070A';
var MEMB = 'rgba(168,204,216,0.40)', SEAM = 'rgba(232,244,248,0.70)';
var BODY = '#14333E', LEGC = '#2E6A7A', CLASP = '#3E8A9C';
var EYEC = '#0A0A0A', GLINT = '#FFFFFF';
var W = 0, H = 0, phone = false;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// ---- the animal, in world space ------------------------------------------------
// World: x runs 0 (snout) to WORLD (tail tip); the spine falls
// gently from upper left to lower right. Units are fractions of
// the world height unit U, resolved per frame.
var NSEG = 15;
function spine(x) {
  // x in world units (0..3); returns y in same units: the head
  // rides high at the left, the tail trails down to the lower right
  return 0.46 + x * 0.11 + Math.sin(x * 1.4) * 0.04;
}
function bodyR(x) {
  var t = clamp(x / 3, 0, 1);
  return 0.34 * (0.55 + 0.45 * Math.sin(Math.min(1, t * 1.25) * 3.1416)) * (1 - t * 0.18);
}
var T = 13, lastNow = -1;    // frame one: a mid-body window
var camX = -1, camDir = 1;   // resolved on first frame
var camVel = 0, dragging = false, lastPX = 0, lastPY = 0;
function worldW() { return W * 3; }
function U() { return H * 1.0; }
function autoSpeed() { return (worldW() - W) / 20; }   // one traverse per 20s, 40s the round trip

// ---- input: drag slides the window -------------------------------------------------
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; lastPX = e.clientX; lastPY = e.clientY; camVel = 0;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
  // drag up toward the head, down toward the tail; sideways works too
  var d = Math.abs(dy) > Math.abs(dx) ? -dy : -dx;
  camX = clamp(camX + d, 0, Math.max(0, worldW() - W));
  camVel = d * 30;
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- resize ----------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
  if (camX < 0) camX = (worldW() - W) * 0.42;
  camX = clamp(camX, 0, Math.max(0, worldW() - W));
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- draw ---------------------------------------------------------------------------------------
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && now > 0) {
    dt = Math.min(0.05, (now - lastNow) / 1000);
    T += dt;
  }
  lastNow = now;
  var WW = worldW(), u = U();
  if (camX < 0) camX = (WW - W) * 0.42;
  if (dt > 0 && !dragging) {
    camVel *= Math.pow(0.4, dt);
    camX += (camDir * autoSpeed() + camVel) * dt;
    if (camX > WW - W) { camX = WW - W; camDir = -1; camVel = 0; }
    if (camX < 0) { camX = 0; camDir = 1; camVel = 0; }
  }
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // world to screen: world x in [0, WW] maps through the window;
  // world spine units are in "body units" bu = WW/3 across
  var bu = WW / 3;
  function sx(wxBu) { return wxBu * bu - camX; }
  function sy(wyBu) { return wyBu * u; }
  var rip = function (wxBu) { return Math.sin(wxBu * 6.0 - T * 2.0) * 0.012; };
  var i, xBu, p;
  // tail fan at the far end
  var tx = 2.84, ty = spine(tx);
  ctx.fillStyle = LEGC;
  for (var sgn = -1; sgn <= 1; sgn += 2) {
    ctx.beginPath();
    var b0 = [sx(tx), sy(ty)];
    var t1 = [sx(tx + 0.09), sy(ty + 0.12 * sgn - 0.03)];
    var t2 = [sx(tx + 0.15), sy(ty + 0.24 * sgn - 0.01)];
    var t3 = [sx(tx + 0.05), sy(ty + 0.08 * sgn)];
    ctx.moveTo(b0[0], b0[1]);
    ctx.lineTo(t1[0], t1[1]);
    ctx.lineTo(t2[0], t2[1]);
    ctx.lineTo(t3[0], t3[1]);
    ctx.closePath();
    ctx.fill();
  }
  // eleven leg pairs on stalks along the belly (the top side:
  // brine shrimp swim upside down), paddling in a traveling wave
  ctx.strokeStyle = LEGC;
  ctx.lineCap = 'round';
  for (var li = 0; li < 11; li++) {
    var lx = 0.52 + li * 0.185;
    var ly = spine(lx) - bodyR(lx) * 0.92;
    var pad = Math.sin(T * 2.6 - li * 0.62);
    var hx = sx(lx), hy = sy(ly);
    var fx = sx(lx + 0.05 + pad * 0.045), fy = sy(ly - 0.26 - Math.abs(pad) * 0.02);
    ctx.lineWidth = Math.max(1.6, u * 0.013);
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.quadraticCurveTo(sx(lx + 0.01), sy(ly - 0.14), fx, fy);
    ctx.stroke();
    // the paddle leaf at the end of the stalk
    ctx.fillStyle = LEGC;
    ctx.beginPath();
    ctx.ellipse(fx, fy, u * 0.024, u * 0.052, pad * 0.3, 0, 6.2832);
    ctx.fill();
  }
  // the segmented trunk: overlapping slabs along the spine
  for (i = NSEG - 1; i >= 0; i--) {
    xBu = 0.18 + (i / (NSEG - 1)) * 2.72;
    var cyW = spine(xBu) + rip(xBu);
    ctx.fillStyle = BODY;
    ctx.beginPath();
    ctx.ellipse(sx(xBu), sy(cyW), bodyR(xBu) * u * 0.62, bodyR(xBu) * u, 0.12, 0, 6.2832);
    ctx.fill();
  }
  // the head: a broader slab at the front
  var hxBu = 0.16, hyW = spine(hxBu) + rip(hxBu);
  ctx.fillStyle = BODY;
  ctx.beginPath();
  ctx.ellipse(sx(hxBu), sy(hyW), u * 0.17, u * 0.235, 0.12, 0, 6.2832);
  ctx.fill();
  // eyestalks: two flexible stalks reaching up-forward, compound eyes
  for (var es = -1; es <= 1; es += 2) {
    var sway = Math.sin(T * 1.1 + es * 1.3) * 0.03;
    var eb = [sx(hxBu - 0.02), sy(hyW - 0.16)];
    var et = [sx(hxBu - 0.10 + sway), sy(hyW - 0.40 + es * 0.05)];
    ctx.strokeStyle = LEGC;
    ctx.lineWidth = Math.max(1.6, u * 0.014);
    ctx.beginPath();
    ctx.moveTo(eb[0], eb[1]);
    ctx.quadraticCurveTo(sx(hxBu - 0.08 + sway), sy(hyW - 0.30), et[0], et[1]);
    ctx.stroke();
    ctx.fillStyle = EYEC;
    ctx.beginPath();
    ctx.arc(et[0], et[1], u * 0.045, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = GLINT;
    ctx.beginPath();
    ctx.arc(et[0] - u * 0.014, et[1] - u * 0.016, u * 0.011, 0, 6.2832);
    ctx.fill();
  }
  // the claspers: two large hooks under the head, opening and closing
  var open = 0.5 + 0.5 * Math.sin(T * 0.9);
  ctx.strokeStyle = CLASP;
  ctx.lineWidth = Math.max(2, u * 0.022);
  for (var cs = -1; cs <= 1; cs += 2) {
    var cb = [sx(hxBu + 0.05), sy(hyW + 0.13)];
    var cm = [sx(hxBu - 0.06 + cs * 0.02), sy(hyW + 0.32)];
    var ct = [sx(hxBu - 0.17 + cs * 0.04 - open * 0.04), sy(hyW + 0.28 - open * 0.05)];
    ctx.beginPath();
    ctx.moveTo(cb[0], cb[1]);
    ctx.quadraticCurveTo(cm[0], cm[1], ct[0], ct[1]);
    ctx.stroke();
  }
  // membrane: one long skin over the trunk, seams at every joint
  ctx.beginPath();
  var topPts = [], botPts = [];
  for (i = 0; i <= 40; i++) {
    xBu = 0.02 + (i / 40) * 2.94;
    var yw = spine(xBu) + rip(xBu);
    var rw = bodyR(xBu) + 0.035;
    topPts.push([sx(xBu), sy(yw - rw)]);
    botPts.push([sx(xBu), sy(yw + rw)]);
  }
  for (i = 0; i < topPts.length; i++) {
    if (i === 0) ctx.moveTo(topPts[i][0], topPts[i][1]); else ctx.lineTo(topPts[i][0], topPts[i][1]);
  }
  for (i = botPts.length - 1; i >= 0; i--) ctx.lineTo(botPts[i][0], botPts[i][1]);
  ctx.closePath();
  ctx.fillStyle = MEMB;
  ctx.fill();
  ctx.strokeStyle = SEAM;
  ctx.lineWidth = Math.max(1.2, u * 0.009);
  ctx.stroke();
  // weld seams: bright arcs across the skin at the segment joints
  ctx.strokeStyle = SEAM;
  for (i = 1; i < NSEG; i++) {
    xBu = 0.18 + (i / (NSEG - 1)) * 2.72 - 0.09;
    var jw = spine(xBu) + rip(xBu);
    var jr = bodyR(xBu) + 0.035;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(sx(xBu), sy(jw - jr));
    ctx.lineTo(sx(xBu), sy(jw + jr));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
