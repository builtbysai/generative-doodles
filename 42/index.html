<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№42 · Katalog 217D</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#050505; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,255,255,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to scrub the phase</div>
<script>
'use strict';
// No42 Katalog 217D (after mathiaskrissmer, prompt 7 via Bug).
// Fourteen concentric tracks on black, driven by a 14-character
// binary string generated from the piece's seed (mulberry32, seed
// 42): regenerate until at least 4 characters are I. Each I track
// carries one luminous arc of seeded length (40 to 160 degrees) at
// a seeded phase; each 0 track stays dark. Exactly one I track is
// the accent, flat acid cyan, no glow passes on it. Track speeds
// rise with radius in integer cycles per 30 second loop, so the
// loop closes exactly. The binary string is the piece's caption,
// set small under the field. Drag scrubs the rotation phase.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '42', 10) || 42;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#050505';
const CYAN = '#00e5ff';
const LOOP = 30;

function generate(s) {
  let rnd = mulberry32(s);
  let bits;
  do {
    bits = Array.from({ length: 14 }, () => (rnd() < 0.5 ? 1 : 0));
  } while (bits.reduce((a, b) => a + b, 0) < 4);
  rnd = mulberry32(s * 7 + 1);
  const arcs = bits.map(b => b ? {
    len: (40 + rnd() * 120) * Math.PI / 180,
    phase: rnd() * Math.PI * 2
  } : null);
  const iTracks = bits.map((b, i) => b ? i : -1).filter(i => i >= 0);
  const accent = iTracks[(rnd() * iTracks.length) | 0];
  return { bits, arcs, accent };
}
const GEN = generate(seed);
const CYCLES = GEN.bits.map((_, i) => Math.ceil((i + 1) / 3));   // rises with radius

let scrub = 0;
let dragInfo = null;
let holdPos = null, holdUntil = 0;

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  let tPos;
  if (dragInfo) tPos = dragInfo.pos;
  else if (holdPos != null && performance.now() / 1000 < holdUntil) tPos = holdPos;
  else tPos = ((nowMs / 1000 + scrub) % LOOP + LOOP) % LOOP;

  const cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) * 0.40;
  const stepR = R / 14.5;

  GEN.bits.forEach((b, i) => {
    if (!b) return;
    const r = stepR * (i + 1.2);
    const arc = GEN.arcs[i];
    const rot = (tPos / LOOP) * Math.PI * 2 * CYCLES[i];
    const wob = Math.sin((tPos / LOOP) * Math.PI * 2 * 3 + i) * 0.03 * r;
    const start = arc.phase + rot;
    if (i === GEN.accent) {
      ctx.strokeStyle = CYAN;
      ctx.lineWidth = Math.max(1, stepR * 0.16);
      ctx.beginPath();
      ctx.arc(cx, cy, r + wob, start, start + arc.len);
      ctx.stroke();
    } else {
      const passes = [
        { a: 0.08, lw: 0.42 }, { a: 0.25, lw: 0.2 }, { a: 0.7, lw: 0.09 }
      ];
      ctx.globalCompositeOperation = 'lighter';
      for (const pass of passes) {
        ctx.strokeStyle = 'rgba(255,255,255,' + pass.a + ')';
        ctx.lineWidth = Math.max(0.7, stepR * pass.lw);
        ctx.beginPath();
        ctx.arc(cx, cy, r + wob, start, start + arc.len);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  });

  // caption: the binary string
  const str = GEN.bits.map(b => b ? 'I' : '0').join('');
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = Math.max(10, Math.min(w, h) * 0.016) + 'px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(str.split('').join(' '), cx, cy + R + Math.min(w, h) * 0.062);
  return {};
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(4200);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function pointerX(ev) {
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0 };
  return ev.clientX - r.left;
}
function currentPos() {
  if (dragInfo) return dragInfo.pos;
  return ((performance.now() / 1000 + scrub) % LOOP + LOOP) % LOOP;
}
canvas.addEventListener('pointerdown', ev => {
  dragInfo = { x: pointerX(ev), startPos: currentPos(), pos: currentPos() };
  holdPos = null;
});
canvas.addEventListener('pointermove', ev => {
  if (!dragInfo) return;
  const [w, h] = viewportWH();
  const dx = pointerX(ev) - dragInfo.x;
  dragInfo.pos = (((dragInfo.startPos + (dx / Math.min(w, h)) * LOOP) % LOOP) + LOOP) % LOOP;
});
function endDrag() {
  if (!dragInfo) return;
  holdPos = dragInfo.pos;
  holdUntil = performance.now() / 1000 + 4;
  scrub = dragInfo.pos - performance.now() / 1000;
  dragInfo = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
