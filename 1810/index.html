<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tunes Blown by the Wind</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #86939e; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG, fixed seed: frame one is fully deterministic.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1810);

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  function alpha(v) {
    var a = Math.round(v * 10000) / 10000;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    return a;
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(a, b, x) {
    var u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }

  // Fixed authored weather table. Cycle 300 s. Gusts are irregular and
  // minutes apart; long quiet intervals are deliberate. Frame one at
  // t = 60 s sits in a quiet interval: no gust, no sun break.
  // [start second in cycle, duration seconds, strength]
  var CYCLE = 300;
  var GUSTS = [[118, 11, 0.9], [167, 9, 0.75], [233, 13, 1.0], [281, 8, 0.65]];
  var SUN = [[204, 7], [262, 5]];

  function envelopeAt(table, t, withStrength) {
    var c = ((t % CYCLE) + CYCLE) % CYCLE;
    var best = 0, bestStart = -1;
    for (var i = 0; i < table.length; i++) {
      var s = table[i][0], d = table[i][1];
      if (c >= s && c <= s + d) {
        var u = (c - s) / d;
        var e = smooth(0, 0.25, u) * (1 - smooth(0.65, 1, u));
        var v = withStrength ? e * table[i][2] : e;
        if (v > best) { best = v; bestStart = s; }
      }
    }
    return { env: best, start: bestStart, cyc: c };
  }

  // Clouds: seeded soft ellipses drifting very slowly.
  var CLOUDS = [];
  for (var i = 0; i < 7; i++) {
    CLOUDS.push({
      x: rnd(), y: 0.06 + rnd() * 0.42, w: 0.16 + rnd() * 0.22,
      h: 0.025 + rnd() * 0.035, a: 0.05 + rnd() * 0.07,
      drift: 0.0004 + rnd() * 0.0005
    });
  }
  // Distant city blocks along the horizon, out of focus.
  var CITY = [];
  for (var i = 0; i < 12; i++) {
    CITY.push({ x: rnd(), w: 0.02 + rnd() * 0.05, h: 0.008 + rnd() * 0.022 });
  }
  // Grass tufts on the hill.
  var TUFTS = [];
  for (var i = 0; i < 26; i++) {
    TUFTS.push({ x: rnd(), y: 0.87 + rnd() * 0.11, h: 0.006 + rnd() * 0.012, lean: (rnd() - 0.5) * 0.01 });
  }

  // Wire ratios 6:8:9:12. Anchor x is solved at draw time by bisection so
  // each wire's true length (aspect-corrected) matches its ratio exactly.
  var RATIOS = [6, 8, 9, 12];
  var WIRE_U = 0.068;
  var MX = 0.16;      // mast x, scene fraction
  var WIRE_Y = 0.45;  // wire attachment height on the mast crossarm
  function groundY(x) { return 0.885 - 0.03 * x; }

  // Tins and chimes hang from two cables that run from the mast down to
  // wooden pegs on the hill. Each hanging piece is placed by its fraction
  // along its cable, so its string meets the cable exactly. Swing is zero
  // when the gust envelope is zero, so at frame one everything hangs dead.
  var CABLE_A = { x0: 0.16, y0: 0.52, x1: 0.72, y1: 0.8634 };
  var CABLE_B = { x0: 0.16, y0: 0.60, x1: 0.60, y1: 0.8670 };
  function cablePoint(c, f) {
    return { x: c.x0 + (c.x1 - c.x0) * f, y: c.y0 + (c.y1 - c.y0) * f };
  }
  function hanging(f, period, phase, marble) {
    return { f: f, period: period, phase: phase, marble: marble };
  }
  var TINS_A = [
    hanging(0.25, 1.7, rnd() * 6.28, false),
    hanging(0.43, 1.9, rnd() * 6.28, true),
    hanging(0.61, 1.6, rnd() * 6.28, false)
  ];
  var CHIMES_B = [
    hanging(0.32, 2.1, rnd() * 6.28, false),
    hanging(0.50, 1.8, rnd() * 6.28, false)
  ];
  var TIN_B = hanging(0.68, 2.0, rnd() * 6.28, true);
  // Chime tube lengths, seeded once.
  var TUBES = [];
  for (var i = 0; i < 4; i++) TUBES.push(0.030 + rnd() * 0.018);

  function drawTin(x, y, s, ang, marble, t, gust) {
    // x, y is the cable attachment point; the tin swings as a pendulum.
    var L = 26 * s;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.strokeStyle = 'rgba(60,64,66,0.9)';
    ctx.lineWidth = Math.max(1, 1.2 * s);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, L);
    ctx.stroke();
    var w = 17 * s, h = 23 * s;
    var g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, '#9aa0a4');
    g.addColorStop(0.35, '#c9ced1');
    g.addColorStop(0.65, '#b4b9bd');
    g.addColorStop(1, '#878d91');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-w / 2 + 2, L);
    ctx.lineTo(w / 2 - 2, L);
    ctx.lineTo(w / 2, L + h - 2);
    ctx.lineTo(-w / 2, L + h - 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(40,44,46,0.55)';
    ctx.lineWidth = Math.max(1, 1 * s);
    ctx.beginPath();
    ctx.moveTo(-w / 2, L + 2);
    ctx.lineTo(w / 2, L + 2);
    ctx.stroke();
    // Open top rim; marbles inside rattle visibly during a gust.
    ctx.fillStyle = 'rgba(30,33,35,0.85)';
    ctx.beginPath();
    ctx.moveTo(-w / 2 + 1, L);
    ctx.lineTo(w / 2 - 1, L);
    ctx.lineTo(w / 2 - 2, L + 3);
    ctx.lineTo(-w / 2 + 2, L + 3);
    ctx.closePath();
    ctx.fill();
    if (marble) {
      for (var m = 0; m < 2; m++) {
        var jx = (m === 0 ? -w * 0.18 : w * 0.16) +
          gust.env * 1.6 * s * Math.sin(t * 9 + m * 2.1 + gust.start);
        var jy = L + 1.5 + gust.env * 1.1 * s * Math.cos(t * 11 + m * 3.7);
        ctx.beginPath();
        ctx.moveTo(jx + 2.2 * s, jy);
        ctx.arc(jx, jy, 2.2 * s, 0, Math.PI * 2);
        ctx.fillStyle = m === 0 ? '#d8d2c4' : '#8a97a3';
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawChimes(x, y, s, ang, rh) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.strokeStyle = 'rgba(60,64,66,0.9)';
    ctx.lineWidth = Math.max(1, 1.2 * s);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 20 * s);
    ctx.stroke();
    // Small crossbar the tubes hang from.
    ctx.fillStyle = '#6b5a44';
    ctx.fillRect(-14 * s, 20 * s, 28 * s, 2.5 * s);
    for (var i = 0; i < 4; i++) {
      var tx = (-10.5 + i * 7) * s;
      var tl = TUBES[i] * rh;
      var tg = ctx.createLinearGradient(tx - 1.5 * s, 0, tx + 1.5 * s, 0);
      tg.addColorStop(0, '#a8a294');
      tg.addColorStop(0.5, '#d9d2bd');
      tg.addColorStop(1, '#97907c');
      ctx.fillStyle = tg;
      ctx.fillRect(tx - 1.5 * s, 22.5 * s, 3 * s, tl);
    }
    ctx.restore();
  }

  function drawCube(x, y, s) {
    // Wooden cube resonator, weathered brown, drawn as a small cube.
    var w = 15 * s;
    ctx.fillStyle = '#7a5c3e';
    ctx.fillRect(x - w / 2, y - w, w, w);
    ctx.fillStyle = '#8d6d49';
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y - w);
    ctx.lineTo(x - w / 2 + w * 0.35, y - w - w * 0.35);
    ctx.lineTo(x + w / 2 + w * 0.35, y - w - w * 0.35);
    ctx.lineTo(x + w / 2, y - w);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#5d452e';
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y - w);
    ctx.lineTo(x + w / 2 + w * 0.35, y - w - w * 0.35);
    ctx.lineTo(x + w / 2 + w * 0.35, y - w * 0.35);
    ctx.lineTo(x + w / 2, y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,22,14,0.5)';
    ctx.lineWidth = Math.max(1, 1 * s);
    ctx.strokeRect(x - w / 2, y - w, w, w);
  }

  function draw(t) {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var W = Math.max(1, Math.floor(vw));
    var H = Math.max(1, Math.floor(vh));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var isPhone = false;
    try {
      var sw = window.screen.width, sh = window.screen.height;
      var mn = Math.min(sw, sh);
      isPhone = mn < 700 || (H > W * 1.15);
    } catch (e) { isPhone = (H > W * 1.15); }

    // Page ground is the piece's own sky color on both sizes.
    ctx.fillStyle = '#86939e';
    ctx.fillRect(0, 0, W, H);

    // Wide 16:9 scene, centered on both sizes: the wire fan needs a wide
    // frame, so on phones the scene keeps its shape, letterboxed in sky.
    var rw = Math.min(W * 0.96, H * 0.96 * 16 / 9);
    var rh = rw * 9 / 16;
    var rx = (W - rw) / 2;
    var ry = (H - rh) / 2;
    var s = rw / 1000; // scale: scene is 1000 units wide
    var A = rh / rw;   // aspect, for true wire lengths
    function X(u) { return rx + u * rw; }
    function Y(v) { return ry + v * rh; }

    var gust = envelopeAt(GUSTS, t, true);
    var sun = envelopeAt(SUN, t, false);

    // Sky: overcast blue-grey, lighter toward the horizon.
    var sky = ctx.createLinearGradient(0, ry, 0, ry + rh * 0.80);
    sky.addColorStop(0, '#7e8b96');
    sky.addColorStop(0.55, '#939fa7');
    sky.addColorStop(1, '#b0b9bd');
    ctx.fillStyle = sky;
    ctx.fillRect(rx, ry, rw, rh * 0.80);

    // Brief sun break: a soft warm glow upper right, warming the sky.
    if (sun.env > 0) {
      var sg = ctx.createRadialGradient(X(0.80), Y(0.16), 0, X(0.80), Y(0.16), rw * 0.28);
      sg.addColorStop(0, 'rgba(255,224,170,' + alpha(0.20 * sun.env) + ')');
      sg.addColorStop(1, 'rgba(255,224,170,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(rx, ry, rw, rh * 0.80);
    }

    // Clouds, drifting almost imperceptibly.
    for (var c = 0; c < CLOUDS.length; c++) {
      var cl = CLOUDS[c];
      var cx = (((cl.x + t * cl.drift) % 1.15) + 1.15) % 1.15 - 0.07;
      ctx.fillStyle = 'rgba(226,231,233,' + alpha(cl.a) + ')';
      ctx.beginPath();
      ctx.moveTo(X(cx) + cl.w * rw, Y(cl.y));
      ctx.ellipse(X(cx), Y(cl.y), cl.w * rw / 2, cl.h * rh, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(X(cx + cl.w * 0.18) + cl.w * rw * 0.35, Y(cl.y - cl.h * 0.5));
      ctx.ellipse(X(cx + cl.w * 0.18), Y(cl.y - cl.h * 0.5), cl.w * rw * 0.35, cl.h * rh * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Distant sea, pale and flat, with a faint out-of-focus city below.
    ctx.fillStyle = '#a7b2b6';
    ctx.fillRect(rx, Y(0.80), rw, rh * 0.06);
    ctx.fillStyle = 'rgba(255,255,255,' + alpha(0.10) + ')';
    ctx.fillRect(rx, Y(0.80), rw, 2);
    for (var ci = 0; ci < CITY.length; ci++) {
      var cb = CITY[ci];
      ctx.fillStyle = 'rgba(110,125,132,' + alpha(0.20) + ')';
      ctx.fillRect(X(cb.x), Y(0.80 - cb.h), cb.w * rw, cb.h * rh);
    }
    // Sea streaks.
    ctx.strokeStyle = 'rgba(255,255,255,' + alpha(0.08) + ')';
    ctx.lineWidth = 1;
    for (var sk = 0; sk < 5; sk++) {
      var sy = Y(0.815 + sk * 0.008);
      ctx.beginPath();
      ctx.moveTo(X(0.02 + sk * 0.03), sy);
      ctx.lineTo(X(0.30 + sk * 0.10), sy);
      ctx.stroke();
    }

    // The hill: muted green-grey slope, darker toward the bottom.
    var hill = ctx.createLinearGradient(0, Y(0.855), 0, ry + rh);
    hill.addColorStop(0, '#5d665c');
    hill.addColorStop(1, '#454d43');
    ctx.fillStyle = hill;
    ctx.beginPath();
    ctx.moveTo(rx, Y(groundY(0)));
    ctx.quadraticCurveTo(X(0.5), Y(0.868), X(1), Y(groundY(1)));
    ctx.lineTo(rx + rw, ry + rh);
    ctx.lineTo(rx, ry + rh);
    ctx.closePath();
    ctx.fill();
    // Grass tufts.
    ctx.strokeStyle = 'rgba(20,26,20,' + alpha(0.35) + ')';
    ctx.lineWidth = 1;
    for (var tf = 0; tf < TUFTS.length; tf++) {
      var tu = TUFTS[tf];
      ctx.beginPath();
      ctx.moveTo(X(tu.x), Y(tu.y));
      ctx.lineTo(X(tu.x + tu.lean), Y(tu.y - tu.h));
      ctx.stroke();
    }

    // Mast: dark silhouette, off-center left. The pole continues above the
    // wire crossarm to an antenna tip; the four wires attach at the
    // crossarm (y = 0.45) so their 6:8:9:12 lengths fit the frame.
    var mastBaseY = Y(groundY(MX));
    var mastTopY = Y(0.10);
    var poleW = 11 * s;
    ctx.fillStyle = '#23282b';
    ctx.beginPath();
    ctx.moveTo(X(MX) - poleW / 2, mastBaseY);
    ctx.lineTo(X(MX) - poleW * 0.22, mastTopY);
    ctx.lineTo(X(MX) + poleW * 0.22, mastTopY);
    ctx.lineTo(X(MX) + poleW / 2, mastBaseY);
    ctx.closePath();
    ctx.fill();
    // Crossarm at the wire attachment height.
    ctx.fillRect(X(MX) - 26 * s, Y(WIRE_Y) - 2.5 * s, 52 * s, 5 * s);
    // Small crossbar and antenna tip near the top.
    ctx.fillRect(X(MX) - 14 * s, Y(0.16) - 2 * s, 28 * s, 4 * s);
    ctx.fillRect(X(MX) - 1.5 * s, Y(0.07), 3 * s, Y(0.10) - Y(0.07));
    // Mast base plate.
    ctx.fillStyle = '#1b1f22';
    ctx.fillRect(X(MX) - 16 * s, mastBaseY - 3 * s, 32 * s, 3 * s);

    // Wire anchors, solved so true lengths are exactly 6:8:9:12.
    var anchors = [];
    for (var wi = 0; wi < RATIOS.length; wi++) {
      var target = RATIOS[wi] * WIRE_U;
      var lo = 0, hi = 1.2, mid = 0;
      for (var it = 0; it < 50; it++) {
        mid = (lo + hi) / 2;
        var ax = MX + mid;
        var dy = (groundY(ax) - WIRE_Y) * A;
        var len = Math.sqrt(mid * mid + dy * dy);
        if (len < target) lo = mid; else hi = mid;
      }
      anchors.push(MX + (lo + hi) / 2);
    }

    // Four wires, fanning down to the right to the wooden cubes.
    var attachX = X(MX), attachY = Y(WIRE_Y);
    for (var w = 0; w < RATIOS.length; w++) {
      var axp = X(anchors[w]);
      var ayp = Y(groundY(anchors[w]));
      var amp = gust.env * (RATIOS[w] / 12) * 4 * s;
      var phase = gust.start >= 0 ? (t - gust.start) : t;
      var segs = 26;
      ctx.beginPath();
      ctx.moveTo(attachX, attachY);
      for (var sg2 = 1; sg2 <= segs; sg2++) {
        var f = sg2 / segs;
        var px = attachX + (axp - attachX) * f;
        var py = attachY + (ayp - attachY) * f;
        // Perpendicular offset: faint traveling shimmer, zero when quiet.
        var dxn = (axp - attachX), dyn = (ayp - attachY);
        var dl = Math.sqrt(dxn * dxn + dyn * dyn) || 1;
        var off = amp * Math.sin(2 * Math.PI * 3 * f - 5 * phase);
        ctx.lineTo(px + (-dyn / dl) * off, py + (dxn / dl) * off);
      }
      ctx.strokeStyle = 'rgba(205,209,212,' + alpha(0.85) + ')';
      ctx.lineWidth = Math.max(1, 1.4 * s);
      ctx.stroke();
      // Faint glow on the wire while the gust moves it.
      if (gust.env > 0) {
        ctx.strokeStyle = 'rgba(230,220,190,' + alpha(0.22 * gust.env) + ')';
        ctx.lineWidth = Math.max(1, 3 * s);
        ctx.stroke();
      }
      drawCube(axp, ayp, s);
    }

    // Chime cables: two straight cables from the mast down to wooden
    // pegs on the hill, tins and chimes clustered mid-frame against
    // the sky. Each cable ends at a peg, never mid-air.
    function cable(c) {
      ctx.strokeStyle = 'rgba(50,54,56,0.85)';
      ctx.lineWidth = Math.max(1, 1.1 * s);
      ctx.beginPath();
      ctx.moveTo(X(c.x0), Y(c.y0));
      ctx.lineTo(X(c.x1), Y(c.y1));
      ctx.stroke();
      // Wooden peg where the cable meets the hill.
      ctx.fillStyle = '#6b5a44';
      ctx.fillRect(X(c.x1) - 2.5 * s, Y(c.y1) - 10 * s, 5 * s, 10 * s);
    }
    cable(CABLE_A);
    cable(CABLE_B);

    function swingAngle(h, gustNow) {
      if (gustNow.env <= 0 || gustNow.start < 0) return 0;
      var ph = (gustNow.cyc - gustNow.start);
      return gustNow.env * 0.30 * Math.sin(2 * Math.PI * ph / h.period + h.phase);
    }
    function chimeAngle(h, gustNow) {
      if (gustNow.env <= 0 || gustNow.start < 0) return 0;
      var ph = (gustNow.cyc - gustNow.start);
      return gustNow.env * 0.12 * Math.sin(2 * Math.PI * ph / h.period + h.phase);
    }
    for (var ta = 0; ta < TINS_A.length; ta++) {
      var tinA = TINS_A[ta];
      var pa = cablePoint(CABLE_A, tinA.f);
      drawTin(X(pa.x), Y(pa.y), s, swingAngle(tinA, gust), tinA.marble, t, gust);
    }
    for (var ch = 0; ch < CHIMES_B.length; ch++) {
      var chm = CHIMES_B[ch];
      var pb = cablePoint(CABLE_B, chm.f);
      drawChimes(X(pb.x), Y(pb.y), s, chimeAngle(chm, gust), rh);
    }
    var pbn = cablePoint(CABLE_B, TIN_B.f);
    drawTin(X(pbn.x), Y(pbn.y), s, swingAngle(TIN_B, gust), TIN_B.marble, t, gust);

    // Sun-break warmth over the whole scene, briefly.
    if (sun.env > 0) {
      ctx.fillStyle = 'rgba(255,214,150,' + alpha(0.08 * sun.env) + ')';
      ctx.fillRect(rx, ry, rw, rh);
    }

    // Plates on canvas: title, formula date, hint.
    ctx.fillStyle = 'rgba(235,238,240,0.85)';
    ctx.font = '600 ' + Math.max(11, 13 * s) + 'px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('Tunes Blown by the Wind', rx + 14, ry + rh - 34);
    ctx.font = Math.max(10, 11 * s) + 'px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(235,238,240,0.70)';
    ctx.fillText('2006 · 12 · 26', rx + 14, ry + rh - 18);
    ctx.fillStyle = 'rgba(235,238,240,0.55)';
    ctx.fillText('WATCH ONLY', rx + 14, ry + rh - 6);
    void isPhone;
  }

  // One synchronous frame at load: t = 60 s, fixed phase, quiet interval.
  draw(60);

  if (reduced) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = 60 + (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }

  function onResize() { draw(60); }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
