<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Refusal</title>
<style>
  html, body { margin: 0; padding: 0; background: #6E4426; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  // Seeded PRNG (mulberry32). No Math.random anywhere in this piece.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var FLOOR = '#6E4426';
  var FLOOR_DARK = '#4A2C17';
  var MAPLE = '#B98F5E';
  var GRAIN = '#7A5A34';
  var PAPER = '#E8E2D4';
  var SHADOW = '#2A1E12';
  var CLOTHS = ['#5E2420', '#C9A227', '#3A4148']; // oxblood, ochre, slate

  // Stack order: permutation of the three cloth colors, top to bottom.
  // Double-tap advances the reseed index; order comes from a seeded stream.
  function makeOrder(seedIndex) {
    var rnd = mulberry32(1316000 + seedIndex * 7919);
    var idx = [0, 1, 2];
    var i, j, tmp;
    for (i = 2; i > 0; i--) {
      j = Math.floor(rnd() * (i + 1));
      tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }
    return [CLOTHS[idx[0]], CLOTHS[idx[1]], CLOTHS[idx[2]]];
  }

  // Maple grain: seeded wavy lines plus knots. Fixed seed: the block is the
  // same object in every loop; only the book order reseeds.
  function makeGrain() {
    var rnd = mulberry32(1316);
    var lines = [];
    var i, k, pts;
    for (i = 0; i < 26; i++) {
      pts = [];
      for (k = 0; k <= 10; k++) {
        pts.push((rnd() - 0.5) * 0.10); // wander fraction of block depth
      }
      lines.push({
        y: 0.04 + (i / 25) * 0.92,       // fraction down the block
        amp: 0.006 + rnd() * 0.012,      // wander amplitude, fraction of S
        alpha: 0.18 + rnd() * 0.28,
        width: 0.8 + rnd() * 1.1,
        pts: pts
      });
    }
    return {
      lines: lines,
      knots: [
        { x: 0.30, y: 0.32, r: 0.030 },
        { x: 0.68, y: 0.62, r: 0.022 },
        { x: 0.52, y: 0.80, r: 0.018 }
      ]
    };
  }

  // Floor scuffs: faint darker flecks, fixed seed.
  function makeScuffs() {
    var rnd = mulberry32(13161);
    var out = [];
    var i;
    for (i = 0; i < 60; i++) {
      out.push({
        x: rnd(), y: rnd(),
        len: 0.004 + rnd() * 0.012,
        ang: rnd() * Math.PI,
        alpha: 0.05 + rnd() * 0.08
      });
    }
    return out;
  }

  var grain = makeGrain();
  var scuffs = makeScuffs();
  var reseedIndex = 0;
  var order = makeOrder(0);
  var lastTapT = -1e9;

  function onTap(tNow) {
    // Double-tap rotates which book is on top (reseed the stack order).
    if (tNow - lastTapT < 0.4) {
      reseedIndex += 1;
      order = makeOrder(reseedIndex);
      lastTapT = -1e9;
    } else {
      lastTapT = tNow;
    }
  }

  function size() {
    var vw = window.innerWidth, vh = window.innerHeight;
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    }
    W = vw; H = vh;
    var dpr = 1;
    if (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) {
      dpr = window.devicePixelRatio;
    }
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (document.body && document.body.style) {
      document.body.style.background = FLOOR;
    }
  }

  function isPhone() {
    var sw = 0, sh = 0;
    if (window.screen) { sw = window.screen.width; sh = window.screen.height; }
    if (sw > 0 && sh > 0) { return Math.min(sw, sh) < 700; }
    return H > W * 1.15;
  }

  // Square panel: centered square on desktop, full-bleed on phones.
  // Page ground is the floor color either way, so the panel edge never shows.
  function panel() {
    var S, px, py;
    if (isPhone()) {
      S = Math.min(W, H);
      px = (W - S) / 2;
      py = (H - S) / 2;
      // On a tall phone the square sits centered; floor fills the rest.
      return { S: S, px: px, py: py };
    }
    S = Math.min(W, H);
    px = (W - S) / 2;
    py = (H - S) / 2;
    return { S: S, px: px, py: py };
  }

  function drawRect(x, y, w, h, fill) {
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w, h);
  }

  function drawBook(bx, by, bw, bd, cloth, S) {
    // Cloth cover.
    drawRect(bx, by, bw, bd, cloth);
    // Spine edge, top side, flipped away: a darker blank band, no lettering.
    drawRect(bx, by, bw, Math.max(2, S * 0.008), 'rgba(0,0,0,0.28)');
    // Fore-edge pages: thin cream strip along the right edge.
    drawRect(bx + bw - S * 0.012, by + S * 0.006, S * 0.012, bd - S * 0.012, PAPER);
    // Faint cloth flecks, seeded by position (deterministic, no PRNG call).
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    var i, fx, fy;
    for (i = 0; i < 12; i++) {
      fx = bx + bw * (0.08 + 0.84 * ((i * 37 % 100) / 100));
      fy = by + bd * (0.12 + 0.76 * ((i * 53 % 100) / 100));
      ctx.fillRect(fx, fy, Math.max(1, S * 0.002), Math.max(1, S * 0.002));
    }
  }

  function draw(t) {
    var p = panel();
    var S = p.S, px = p.px, py = p.py;
    var i;

    // Floor.
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = FLOOR;
    ctx.fillRect(px, py, S, S);
    // Faint plank seams across the panel.
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (i = 1; i < 5; i++) {
      ctx.fillRect(px, py + (S * i) / 5, S, Math.max(1, S * 0.0015));
    }
    // Scuffs.
    for (i = 0; i < scuffs.length; i++) {
      var sc = scuffs[i];
      ctx.strokeStyle = 'rgba(42,30,18,' + sc.alpha.toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, S * 0.0012);
      ctx.beginPath();
      ctx.moveTo(px + sc.x * S, py + sc.y * S);
      ctx.lineTo(
        px + sc.x * S + Math.cos(sc.ang) * sc.len * S,
        py + sc.y * S + Math.sin(sc.ang) * sc.len * S
      );
      ctx.stroke();
    }

    // Raking light: full 360 degree rotation over a 2-minute loop.
    // Shadow direction swings with it; the block never moves, never reveals.
    var theta = (Math.PI * 2 * t) / 120;
    var sx = Math.cos(theta), sy = Math.sin(theta);

    // Stack geometry: three covers, lower books peeking at the edges.
    // Stack center sits slightly below the middle of the panel.
    var cx = px + S * 0.5;
    var cy = py + S * 0.56;
    var bw = S * 0.54, bd = S * 0.40;
    var offs = [
      { dx: 0, dy: 0 },
      { dx: -S * 0.012, dy: S * 0.010 },
      { dx: S * 0.030, dy: -S * 0.012 }
    ];
    // Books in order: bottom (order[2]) to top (order[0]).
    var layers = [
      { x: cx - bw / 2 + offs[2].dx, y: cy - bd / 2 + offs[2].dy, c: order[2] },
      { x: cx - bw / 2 + offs[1].dx, y: cy - bd / 2 + offs[1].dy, c: order[1] },
      { x: cx - bw / 2 + offs[0].dx, y: cy - bd / 2 + offs[0].dy, c: order[0] }
    ];

    // Stack shadows, one per book, swinging with the light.
    var shLen = S * 0.030;
    ctx.fillStyle = 'rgba(42,30,18,0.32)';
    for (i = 0; i < 3; i++) {
      ctx.fillRect(
        layers[i].x + sx * shLen, layers[i].y + sy * shLen, bw, bd
      );
    }

    // Bottom book first.
    drawBook(layers[0].x, layers[0].y, bw, bd, layers[0].c, S);
    drawBook(layers[1].x, layers[1].y, bw, bd, layers[1].c, S);
    drawBook(layers[2].x, layers[2].y, bw, bd, layers[2].c, S);

    // Dog-ear: folded triangle at the bottom book's bottom-right corner.
    // Drawn last so it sits in the bottom book's visible right strip
    // (0.030S wide), peeking out from under the stack above it.
    var ex = layers[0].x + bw, ey = layers[0].y + bd;
    var ear = S * 0.030;
    ctx.fillStyle = PAPER;
    ctx.beginPath();
    ctx.moveTo(ex, ey - ear);
    ctx.lineTo(ex, ey);
    ctx.lineTo(ex - ear, ey);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(42,30,18,0.45)';
    ctx.lineWidth = Math.max(1, S * 0.0015);
    ctx.beginPath();
    ctx.moveTo(ex - ear * 0.25, ey - ear * 0.75);
    ctx.lineTo(ex - ear * 0.75, ey - ear * 0.25);
    ctx.stroke();

    // Maple block: 45% of the top book's area, dominating the stack.
    var top = layers[2];
    var mw = bw * 0.67, md = bd * 0.67;
    var mx = top.x + (bw - mw) / 2;
    var my = top.y + (bd - md) / 2;

    // Block shadow falling on the top book.
    var bsh = S * 0.018;
    ctx.fillStyle = 'rgba(42,30,18,0.40)';
    ctx.fillRect(mx + sx * bsh, my + sy * bsh, mw, md);

    // Block body.
    drawRect(mx, my, mw, md, MAPLE);
    // Dense, unreadable grain: seeded wavy lines across the block.
    var g, k, gx, gy;
    for (i = 0; i < grain.lines.length; i++) {
      g = grain.lines[i];
      ctx.strokeStyle = 'rgba(122,90,52,' + g.alpha.toFixed(3) + ')';
      ctx.lineWidth = g.width;
      ctx.beginPath();
      for (k = 0; k <= 10; k++) {
        gx = mx + (k / 10) * mw;
        gy = my + g.y * md + g.pts[k] * md * g.amp * 40;
        if (k === 0) { ctx.moveTo(gx, gy); }
        else { ctx.lineTo(gx, gy); }
      }
      ctx.stroke();
    }
    // Knots: small dark ellipse outlines, each its own path.
    for (i = 0; i < grain.knots.length; i++) {
      var kn = grain.knots[i];
      ctx.strokeStyle = 'rgba(122,90,52,0.55)';
      ctx.lineWidth = Math.max(1, S * 0.0015);
      ctx.beginPath();
      ctx.ellipse(mx + kn.x * mw, my + kn.y * md, kn.r * S, kn.r * S * 0.7, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Block edge: darker bevel line.
    ctx.strokeStyle = 'rgba(74,44,23,0.55)';
    ctx.lineWidth = Math.max(1, S * 0.002);
    ctx.strokeRect(mx, my, mw, md);

    // Raking highlight: thin cream strip on the edge facing the light.
    ctx.fillStyle = 'rgba(240,235,221,0.20)';
    var hw = Math.max(2, S * 0.006);
    if (Math.abs(sx) >= Math.abs(sy)) {
      if (sx > 0) {
        // Shadow falls right, light comes from the left: lit left edge.
        ctx.fillRect(mx, my, hw, md);
      } else {
        ctx.fillRect(mx + mw - hw, my, hw, md);
      }
    } else {
      if (sy > 0) {
        ctx.fillRect(mx, my, mw, hw);
      } else {
        ctx.fillRect(mx, my + md - hw, mw, hw);
      }
    }
  }

  var booted = false;
  var startT = 0;

  function loop(ts) {
    var t = (ts - startT) / 1000;
    if (t < 0) { t = 0; }
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }

  function boot() {
    size();
    if (!booted) {
      booted = true;
      draw(0); // Frame one: exactly t = 0, deterministic.
    }
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(function (ts) {
        startT = ts;
        loop(ts);
      });
    }
  }

  function onResize() {
    size();
    if (!booted) { draw(0); }
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
  canvas.addEventListener('pointerdown', function () {
    var tNow = 0;
    if (typeof performance !== 'undefined' && performance.now) {
      tNow = performance.now() / 1000;
    }
    onTap(tNow);
  });

  boot();
})();
</script>
</body>
</html>
