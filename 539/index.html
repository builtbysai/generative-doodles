<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Half-Shadow</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #111111; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (strict, flat fills only, no gradients, no soft edges anywhere).
  var BLACK = '#111111', MINT = '#9FD8CB', SALMON = '#E8A08C';
  var DOG = '#F2C94C', LIT = '#EFD9C4', SHADE = '#8A8A8A', TITLE = '#F2D06B';

  var PHASE0 = 2.4; // constant first-frame phase (s): noon split, dogs mid-idle

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(539065);

  // ---- layout (1080 x 1080 design space) ----
  var STREET_Y = 790;               // mint street plane: y 790..1080
  var FACES = [
    { cx: 165, cy: 282 },
    { cx: 540, cy: 282 },
    { cx: 915, cy: 282 }
  ];
  var FACE_HW = 186, FACE_HH = 302; // half width / half height of each mask

  // ---- seeded street dressing: scattered papers ----
  var papers = [];
  var paperSpots = [
    { x: 128, y: 1000 }, { x: 330, y: 1036 }, { x: 566, y: 1012 },
    { x: 742, y: 1040 }, { x: 986, y: 996 }
  ];
  for (var i = 0; i < paperSpots.length; i++) {
    papers.push({
      x: paperSpots[i].x, y: paperSpots[i].y,
      rot: (rng() - 0.5) * 1.5,
      w: 44 + rng() * 16, h: 30 + rng() * 10,
      col: i % 2 ? LIT : SALMON
    });
  }

  // ---- one mask face, split by a HARD vertical shadow line ----
  // frac: shadow covers the left frac of the face width (0.30 morning,
  // 0.50 noon, 0.70 evening). Edge is a clipped rect: always hard.
  function facePath(cx, cy) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - FACE_HH);
    ctx.bezierCurveTo(cx + 130, cy - FACE_HH, cx + FACE_HW, cy - 150, cx + FACE_HW, cy - 20);
    ctx.bezierCurveTo(cx + FACE_HW, cy + 130, cx + 130, cy + 245, cx + 62, cy + 282);
    ctx.bezierCurveTo(cx + 30, cy + FACE_HH, cx - 30, cy + FACE_HH, cx - 62, cy + 282);
    ctx.bezierCurveTo(cx - 130, cy + 245, cx - FACE_HW, cy + 130, cx - FACE_HW, cy - 20);
    ctx.bezierCurveTo(cx - FACE_HW, cy - 150, cx - 130, cy - FACE_HH, cx, cy - FACE_HH);
    ctx.closePath();
  }

  function drawFace(f, frac) {
    facePath(f.cx, f.cy);
    ctx.fillStyle = LIT;
    ctx.fill();
    // the shadow half: same path clipped, one flat rect, hard edge
    var splitX = f.cx - FACE_HW + frac * FACE_HW * 2;
    ctx.save();
    facePath(f.cx, f.cy);
    ctx.clip();
    ctx.fillStyle = SHADE;
    ctx.fillRect(f.cx - FACE_HW - 4, f.cy - FACE_HH - 4, (splitX - (f.cx - FACE_HW)) + 4, FACE_HH * 2 + 8);
    ctx.restore();
    // symbol-face: dot eyes and a line mouth, present at all times
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(f.cx - 58, f.cy - 28, 10, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(f.cx + 58, f.cy - 28, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(f.cx - 34, f.cy + 74);
    ctx.lineTo(f.cx + 34, f.cy + 74);
    ctx.stroke();
  }

  // ---- the title: "Chacales" as traced brush-script strokes, not a font ----
  // Glyph boxes: 120 wide, baseline at y=130, ascenders to y~8, descenders to y~165.
  var GLYPHS = {
    C: [[[100, 38], [74, 14], [42, 16], [24, 44], [22, 80], [36, 112], [66, 128], [96, 116], [106, 92]]],
    h: [[[30, 12], [28, 62], [28, 130]], [[28, 88], [40, 58], [62, 46], [84, 54], [90, 82], [90, 130]]],
    a: [[[84, 54], [56, 40], [32, 56], [28, 88], [40, 114], [66, 122], [84, 106], [86, 80], [87, 128], [99, 136]]],
    c: [[[86, 52], [62, 40], [40, 50], [30, 76], [36, 104], [58, 120], [84, 110]]],
    l: [[[40, 132], [52, 74], [60, 22], [72, 8], [82, 20], [72, 78], [62, 132], [80, 140]]],
    e: [[[36, 92], [58, 50], [78, 42], [88, 56], [76, 80], [48, 94], [34, 100], [40, 118], [62, 128], [86, 118]]],
    s: [[[88, 50], [64, 40], [44, 50], [42, 68], [58, 82], [80, 94], [84, 110], [66, 126], [40, 124], [28, 110]]]
  };
  var TITLE_WORD = 'Chacales';
  var titleWidths = [];
  for (i = 0; i < TITLE_WORD.length; i++) titleWidths.push(23 + rng() * 6); // seeded brush weight per letter

  function strokePts(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var j = 1; j < pts.length - 1; j++) {
      var mx = (pts[j][0] + pts[j + 1][0]) / 2;
      var my = (pts[j][1] + pts[j + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[j][0], pts[j][1], mx, my);
    }
    ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
    ctx.stroke();
  }

  function drawTitle() {
    var adv = 104, sc = 1.06;
    var totalW = adv * (TITLE_WORD.length - 1) + 120 * sc;
    var x0 = (1080 - totalW) / 2;
    ctx.strokeStyle = TITLE;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var k = 0; k < TITLE_WORD.length; k++) {
      var lx = x0 + k * adv;
      var cxL = lx + 60 * sc;
      var u = cxL / 1080;
      var baseY = 676 - 54 * Math.sin(Math.PI * u);       // the arc
      var ang = Math.atan(-54 * Math.PI * Math.cos(Math.PI * u) / 1080);
      ctx.save();
      ctx.translate(lx, baseY);
      ctx.rotate(ang);
      ctx.scale(sc, sc);
      ctx.translate(0, -130);
      ctx.lineWidth = titleWidths[k] / sc;
      var strokes = GLYPHS[TITLE_WORD[k]];
      for (var s2 = 0; s2 < strokes.length; s2++) strokePts(strokes[s2]);
      ctx.restore();
    }
  }

  // ---- one stray dog: parametric quadruped with an idle cycle ----
  // Local space: facing right, ground at y=0, body ~110 long, head top ~-78.
  function drawDog(o) {
    // o: {x, groundY, s, phase, scratch}
    var sway = Math.sin(o.phase * 0.8) * 3;
    var bob = Math.sin(o.phase * 1.6) * 1.4;
    ctx.save();
    ctx.translate(o.x, o.groundY);
    ctx.scale(o.s, o.s);
    // flat black shadow pool
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.ellipse(0, 4, 82, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.translate(sway, bob);
    ctx.strokeStyle = DOG;
    ctx.fillStyle = DOG;
    ctx.lineCap = 'round';
    // tail, wagging a little
    var wag = Math.sin(o.phase * 2.2) * 0.14;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-50, -46);
    ctx.quadraticCurveTo(-66, -58, -62 + wag * 30, -76);
    ctx.stroke();
    // legs: three planted, the hind leg of the scratcher lifts and works
    ctx.lineWidth = 8.5;
    var planted = [[-38, -30, -40, 0], [-26, -30, -24, 0], [30, -30, 28, 0]];
    for (var li = 0; li < planted.length; li++) {
      ctx.beginPath();
      ctx.moveTo(planted[li][0], planted[li][1]);
      ctx.lineTo(planted[li][2], planted[li][3]);
      ctx.stroke();
    }
    if (o.scratch) {
      // scratch envelope: bursts, gated by a slow raised sine
      var env = Math.pow(Math.max(0, Math.sin(o.phase * 0.55)), 3);
      var kick = Math.sin(o.phase * 21) * 0.55 * env;
      ctx.save();
      ctx.translate(42, -30);
      ctx.rotate(-0.7 - kick);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(4, 30); ctx.stroke();
      ctx.restore();
      if (env < 0.05) { // between bursts the leg is down
        ctx.beginPath(); ctx.moveTo(42, -30); ctx.lineTo(44, 0); ctx.stroke();
      }
    } else {
      ctx.beginPath(); ctx.moveTo(42, -30); ctx.lineTo(44, 0); ctx.stroke();
    }
    // body
    ctx.beginPath();
    ctx.ellipse(0, -44, 56, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    // head
    ctx.beginPath(); ctx.arc(56, -58, 19, 0, Math.PI * 2); ctx.fill();
    // snout
    ctx.beginPath();
    ctx.moveTo(66, -66); ctx.lineTo(84, -58); ctx.lineTo(84, -50); ctx.lineTo(66, -50);
    ctx.closePath(); ctx.fill();
    // nose + eye
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(83, -56, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(60, -62, 3.2, 0, Math.PI * 2); ctx.fill();
    // floppy black ear
    ctx.beginPath();
    ctx.ellipse(46, -52, 7.5, 15, 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ---- the street: mint plane, salmon curb, dogs, can, papers ----
  function drawStreet(t) {
    // salmon curb line along the far edge
    ctx.fillStyle = SALMON;
    ctx.fillRect(0, STREET_Y - 9, 1080, 9);
    // mint street plane
    ctx.fillStyle = MINT;
    ctx.fillRect(0, STREET_Y, 1080, 1080 - STREET_Y);
    // papers, each in its own small black pool
    for (var j = 0; j < papers.length; j++) {
      var p = papers[j];
      ctx.fillStyle = BLACK;
      ctx.beginPath(); ctx.ellipse(p.x + 5, p.y + 9, p.w * 0.62, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    // the tipped-over can, on its side in a black pool
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.ellipse(252, 968, 58, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.translate(252, 944);
    ctx.rotate(1.62);
    ctx.fillStyle = SALMON;
    ctx.fillRect(-36, -22, 72, 44);
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.ellipse(0, -22, 36, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = SALMON;
    ctx.beginPath(); ctx.ellipse(0, -22, 24, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // three stray dogs, idling; the middle one scratches
    drawDog({ x: 428, groundY: 972, s: 1.0, phase: t + 0.0, scratch: false });
    drawDog({ x: 660, groundY: 1006, s: 1.18, phase: t + 2.3, scratch: true });
    drawDog({ x: 884, groundY: 968, s: 0.92, phase: t + 4.1, scratch: false });
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground is the black) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;
  var tod = 0.5, targetTod = 0.5; // time of day: 0 morning, 0.5 noon, 1 evening

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw(simT);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    // the street first, so the title can arc over its top edge
    drawStreet(t);

    // the three faces, one shared hard split, sliding in sync
    var frac = 0.30 + tod * 0.40; // 0.30 morning, 0.50 noon, 0.70 evening
    for (var f = 0; f < FACES.length; f++) drawFace(FACES[f], frac);

    // the title, arcing across the boundary
    drawTitle();

    // hint, subtle, bottom-right corner
    ctx.fillStyle = SHADE;
    ctx.globalAlpha = 0.65;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.font = (isPhone() ? '24px' : '22px') + ' Georgia, serif';
    ctx.fillText('drag', 1058, 1058);
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  // ---- drag: horizontal drag is the time of day; drag-only, no tap, no reload ----
  var dragging = false;
  function pointerDesignX(e) {
    var rect = canvas.getBoundingClientRect();
    return (e.clientX - rect.left - OX) / (S / 1080);
  }
  function onDown(e) {
    dragging = true;
    targetTod = Math.max(0, Math.min(1, pointerDesignX(e) / 1080));
  }
  function onMove(e) {
    if (!dragging) return;
    targetTod = Math.max(0, Math.min(1, pointerDesignX(e) / 1080));
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  canvas.addEventListener('touchstart', function (e) { if (e.touches && e.touches[0]) onDown(e.touches[0]); }, { passive: true });
  canvas.addEventListener('touchmove', function (e) { if (e.touches && e.touches[0]) onMove(e.touches[0]); }, { passive: true });
  canvas.addEventListener('touchend', onUp);

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    tod += (targetTod - tod) * 0.16;
    if (Math.abs(targetTod - tod) < 0.001) tod = targetTod;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
