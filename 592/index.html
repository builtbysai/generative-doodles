<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Caja de Remedios</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #C8A97E; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.592 "Caja de Remedios" — EXPANSION #71 julia-barata, block 8.
   Drawn on whatever there was: medicine box, hospital napkin, cream tube,
   textbook page. The urgent ink drawing re-renders fast on every switch. */

var INK = '#1A1A1A', RED = '#D42B1E', GHOST = '#9A968C';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- seeded RNG ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- viewport ---------- */
var vw = 300, vh = 300, dpr = 1;
function isPhone(){
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0) return mn < 700;
  return vh > vw * 1.15;
}
function resize(){
  var vv = window.visualViewport;
  vw = vv ? vv.width : window.innerWidth;
  vh = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);
resize();

/* ---------- precomputed support textures (stage coords 0..1000) ---------- */
function ghostTextBlock(rng, x, y, w, lines, lh, alpha){
  var out = [];
  for (var i = 0; i < lines; i++){
    var lw = w * (0.55 + rng() * 0.45);
    if (i === lines - 1) lw = w * (0.3 + rng() * 0.3);
    out.push({ k:'bar', x:x, y:y + i * lh, w:lw, h:lh * 0.38, a:alpha * (0.7 + rng() * 0.5) });
  }
  return out;
}
function buildSupports(){
  var S = [];
  /* 1 — medicine box */
  (function(){
    var rng = mulberry32(592001), sh = [];
    sh.push({ k:'fill', c:'#C8A97E' });
    /* cardboard mottling */
    for (var i = 0; i < 260; i++) sh.push({ k:'dot', x:rng()*1000, y:rng()*1000, r:1+rng()*3.2, c: rng()<0.5 ? '#BFA071' : '#D2B586', a:0.35 });
    /* box seams + tape */
    sh.push({ k:'line', x1:0, y1:118, x2:1000, y2:112, w:3, c:'#A8895C', a:0.8 });
    sh.push({ k:'line', x1:0, y1:884, x2:1000, y2:890, w:3, c:'#A8895C', a:0.8 });
    sh.push({ k:'rect', x:430, y:96, w:150, h:44, c:'#E4D9BC', a:0.55 });           /* tape strip */
    sh.push({ k:'rect', x:60, y:852, w:170, h:40, c:'#E4D9BC', a:0.45 });            /* tape strip */
    /* printed brand block (illegible bars) */
    sh = sh.concat(ghostTextBlock(rng, 70, 170, 330, 3, 30, 0.85));
    sh.push({ k:'rectO', x:64, y:150, w:350, h:130, wdt:3, c:GHOST, a:0.7 });
    /* dosage grid, lower right, clear of the window */
    var gx = 724, gy = 486, cw = 52, ch = 34, r, c2;
    for (r = 0; r < 4; r++) for (c2 = 0; c2 < 4; c2++)
      sh.push({ k:'rectO', x:gx + c2*cw, y:gy + r*ch, w:cw, h:ch, wdt:2, c:GHOST, a:0.55 });
    sh = sh.concat(ghostTextBlock(rng, 724, 452, 200, 1, 24, 0.8));
    for (r = 0; r < 4; r++) if (rng() < 0.7) sh.push({ k:'x', x:gx + Math.floor(rng()*4)*cw + cw/2, y:gy + r*ch + ch/2, s:9, c:GHOST, a:0.8 });
    /* instructions column, right side */
    sh = sh.concat(ghostTextBlock(rng, 640, 640, 300, 7, 26, 0.7));
    /* barcode-ish ghost */
    for (i = 0; i < 26; i++) sh.push({ k:'bar', x:70 + i*7, y:700, w:2 + rng()*3, h:64, a:0.6 });
    sh = sh.concat(ghostTextBlock(rng, 70, 620, 200, 2, 26, 0.7));
    /* creases + scuffs */
    sh.push({ k:'line', x1:120, y1:0, x2:180, y2:1000, w:2, c:'#A8895C', a:0.5 });
    sh.push({ k:'line', x1:880, y1:0, x2:830, y2:1000, w:2, c:'#A8895C', a:0.45 });
    sh.push({ k:'line', x1:0, y1:520, x2:1000, y2:500, w:1.6, c:'#B99B68', a:0.5 });
    S.push({ name:'caja de remedios, 2016', shapes:sh });
  })();
  /* 2 — hospital napkin */
  (function(){
    var rng = mulberry32(592002), sh = [];
    sh.push({ k:'fill', c:'#F2EDE2' });
    for (var i = 0; i < 160; i++) sh.push({ k:'dot', x:rng()*1000, y:rng()*1000, r:1+rng()*2.4, c:'#E7E0CF', a:0.5 });
    /* crease fan */
    var cx = 500, cy = 480, a;
    for (i = 0; i < 9; i++){ a = (i / 9) * Math.PI * 2 + 0.3;
      sh.push({ k:'line', x1:cx, y1:cy, x2:cx + Math.cos(a)*760, y2:cy + Math.sin(a)*760, w:2, c:'#D8D0BC', a:0.65 });
      sh.push({ k:'line', x1:cx, y1:cy, x2:cx + Math.cos(a+0.06)*760, y2:cy + Math.sin(a+0.06)*760, w:1, c:'#FFFFFF', a:0.7 });
    }
    sh.push({ k:'line', x1:0, y1:250, x2:1000, y2:236, w:2.4, c:'#D8D0BC', a:0.6 });
    sh.push({ k:'line', x1:0, y1:770, x2:1000, y2:786, w:2.4, c:'#D8D0BC', a:0.6 });
    /* embossed border + faint stamp */
    sh.push({ k:'rectO', x:36, y:36, w:928, h:928, wdt:3, c:'#DDD5C2', a:0.8 });
    sh.push({ k:'rectO', x:52, y:52, w:896, h:896, wdt:1.4, c:'#DDD5C2', a:0.7 });
    sh.push({ k:'circO', x:838, y:150, r:56, wdt:3, c:GHOST, a:0.35 });
    sh = sh.concat(ghostTextBlock(rng, 770, 128, 130, 2, 20, 0.3));
    /* thin spots / stains */
    sh.push({ k:'dot', x:210, y:830, r:34, c:'#E9DFC8', a:0.5 });
    sh.push({ k:'dot', x:790, y:700, r:22, c:'#E9DFC8', a:0.45 });
    S.push({ name:'servilleta de hospital, 2016', shapes:sh });
  })();
  /* 3 — flattened cream tube */
  (function(){
    var rng = mulberry32(592003), sh = [];
    sh.push({ k:'fill', c:'#EDEAE2' });
    for (var i = 0; i < 140; i++) sh.push({ k:'dot', x:rng()*1000, y:rng()*1000, r:1+rng()*2.4, c:'#E0DCD0', a:0.5 });
    /* crimped top edge */
    for (i = 0; i < 24; i++) sh.push({ k:'line', x1:30 + i*40, y1:24, x2:44 + i*40, y2:86, w:3, c:'#CFCABD', a:0.85 });
    sh.push({ k:'line', x1:0, y1:92, x2:1000, y2:88, w:3, c:'#C4BEAE', a:0.9 });
    /* flattened folds running down */
    sh.push({ k:'line', x1:180, y1:100, x2:230, y2:1000, w:3, c:'#DCD8CC', a:0.8 });
    sh.push({ k:'line', x1:196, y1:100, x2:246, y2:1000, w:1.4, c:'#FFFFFF', a:0.8 });
    sh.push({ k:'line', x1:760, y1:100, x2:712, y2:1000, w:3, c:'#DCD8CC', a:0.8 });
    sh.push({ k:'line', x1:520, y1:100, x2:540, y2:1000, w:2, c:'#E2DED2', a:0.7 });
    /* label ghost */
    sh.push({ k:'rectO', x:300, y:210, w:400, h:300, wdt:3, c:GHOST, a:0.4 });
    sh = sh.concat(ghostTextBlock(rng, 340, 250, 320, 2, 34, 0.4));
    sh = sh.concat(ghostTextBlock(rng, 340, 350, 320, 5, 26, 0.35));
    sh.push({ k:'circO', x:500, y:600, r:52, wdt:3, c:GHOST, a:0.35 });
    sh = sh.concat(ghostTextBlock(rng, 330, 700, 340, 4, 26, 0.32));
    /* cap end smear at bottom */
    sh.push({ k:'rect', x:392, y:918, w:216, h:56, c:'#DDD9CE', a:0.8 });
    for (i = 0; i < 10; i++) sh.push({ k:'line', x1:404 + i*21, y1:922, x2:404 + i*21, y2:970, w:2.4, c:'#C9C4B4', a:0.8 });
    S.push({ name:'tubo de crema, 2019', shapes:sh });
  })();
  /* 4 — textbook page */
  (function(){
    var rng = mulberry32(592004), sh = [];
    sh.push({ k:'fill', c:'#E8E4D2' });
    for (var i = 0; i < 170; i++) sh.push({ k:'dot', x:rng()*1000, y:rng()*1000, r:1+rng()*2.2, c:'#DAD4BC', a:0.5 });
    /* two text columns */
    sh = sh.concat(ghostTextBlock(rng, 70, 130, 380, 12, 30, 0.5));
    sh = sh.concat(ghostTextBlock(rng, 540, 130, 390, 6, 30, 0.5));
    sh = sh.concat(ghostTextBlock(rng, 70, 560, 380, 10, 30, 0.45));
    /* skeleton-ish diagram ghost, right lower */
    var dx = 730, dy = 470;
    sh.push({ k:'circO', x:dx, y:dy, r:30, wdt:3, c:GHOST, a:0.5 });
    sh.push({ k:'line', x1:dx, y1:dy+32, x2:dx, y2:dy+170, w:4, c:GHOST, a:0.5 });
    for (i = 0; i < 4; i++){ sh.push({ k:'line', x1:dx-44, y1:dy+60+i*28, x2:dx+44, y2:dy+60+i*28, w:3, c:GHOST, a:0.45 }); }
    sh.push({ k:'line', x1:dx, y1:dy+70, x2:dx-78, y2:dy+140, w:4, c:GHOST, a:0.5 });
    sh.push({ k:'line', x1:dx, y1:dy+70, x2:dx+78, y2:dy+140, w:4, c:GHOST, a:0.5 });
    sh.push({ k:'line', x1:dx, y1:dy+170, x2:dx-52, y2:dy+300, w:4, c:GHOST, a:0.5 });
    sh.push({ k:'line', x1:dx, y1:dy+170, x2:dx+52, y2:dy+300, w:4, c:GHOST, a:0.5 });
    sh.push({ k:'rectO', x:600, y:400, w:330, h:380, wdt:2, c:GHOST, a:0.45 });
    /* chart lines bottom-left under text */
    sh.push({ k:'line', x1:80, y1:920, x2:430, y2:920, w:2.4, c:GHOST, a:0.55 });
    sh.push({ k:'line', x1:80, y1:840, x2:80, y2:920, w:2.4, c:GHOST, a:0.55 });
    var px = 80, py = 905;
    for (i = 0; i < 6; i++){ var nx = px + 56, ny = 905 - rng()*62; sh.push({ k:'line', x1:px, y1:py, x2:nx, y2:ny, w:2.4, c:GHOST, a:0.55 }); px = nx; py = ny; }
    /* page number + dog-ear */
    sh = sh.concat(ghostTextBlock(rng, 470, 948, 60, 1, 22, 0.6));
    sh.push({ k:'tri', x1:1000, y1:0, x2:1000, y2:74, x3:926, y3:0, c:'#DAD4BC', a:0.9 });
    sh.push({ k:'line', x1:926, y1:0, x2:1000, y2:74, w:2, c:'#C6BEA2', a:0.8 });
    S.push({ name:'página de manual, 2019', shapes:sh });
  })();
  return S;
}
var supports = buildSupports();

/* ---------- the drawing: stroke list ---------- */
/* each stroke: pts [[x,y]...], w width, c color. Built once, seeded wobble. */
function buildDrawing(){
  var rng = mulberry32(592100), st = [];
  function wob(pts, amt){
    return pts.map(function(p, i){
      if (i === 0 || i === pts.length - 1) return [p[0], p[1]];
      return [p[0] + (rng()-0.5)*amt, p[1] + (rng()-0.5)*amt];
    });
  }
  function line(x1,y1,x2,y2,w,c,seg){
    seg = seg || 4; var pts = [];
    for (var i = 0; i <= seg; i++) pts.push([x1 + (x2-x1)*i/seg, y1 + (y2-y1)*i/seg]);
    st.push({ pts: wob(pts, 5), w:w, c:c || INK });
  }
  function curve(cx, cy, r, a0, a1, w, c, n){
    n = n || 14; var pts = [];
    for (var i = 0; i <= n; i++){ var a = a0 + (a1-a0)*i/n; pts.push([cx + Math.cos(a)*r, cy + Math.sin(a)*r]); }
    st.push({ pts: wob(pts, 4), w:w, c:c || INK });
  }
  function path(pts, w, c){ st.push({ pts: wob(pts, 5), w:w, c:c || INK }); }

  /* hospital window behind (drawn first) */
  line(560, 170, 880, 170, 6); line(880, 170, 880, 470, 6); line(880, 470, 560, 470, 6); line(560, 470, 560, 170, 6);
  line(720, 170, 720, 470, 4); line(560, 320, 880, 320, 4);
  /* venetian blind slats, top-left pane */
  line(584, 208, 690, 196, 3); line(584, 240, 690, 228, 3); line(584, 272, 690, 260, 3);
  line(770, 200, 846, 300, 3);                          /* cord hanging in the right pane */
  curve(846, 308, 8, 0, Math.PI*2, 3);
  /* windowsill plant, right end of the sill */
  line(800, 470, 800, 434, 3.4); curve(790, 426, 12, Math.PI*0.9, Math.PI*1.9, 3); curve(812, 424, 12, Math.PI*1.1, Math.PI*0.2, 3);

  /* pregnant self-avatar, in profile facing left, belly proud */
  curve(400, 268, 40, 0, Math.PI*2, 5.4);                /* head */
  curve(368, 234, 14, Math.PI*1.05, Math.PI*1.95, 4);   /* hair bun sweep */
  line(392, 306, 384, 366, 5.4);                        /* neck to chest */
  path([[384,366],[336,424],[312,492],[334,562],[388,606]], 5.6);  /* the belly, one committed curve */
  line(424, 312, 432, 420, 5.4);                        /* her back, right side */
  line(432, 420, 438, 606, 5.4);
  line(388, 606, 440, 606, 4.4);                        /* hem */
  line(392, 606, 384, 800, 5.4);                        /* front leg */
  line(384, 800, 366, 806, 5.4);                        /* foot */
  line(436, 606, 456, 800, 5.4);                        /* back leg */
  line(456, 800, 478, 804, 5.4);                        /* foot */
  path([[382,392],[330,468],[348,556]], 5);             /* arm down the belly, hand under it */
  line(420, 396, 488, 448, 5);                          /* other arm akimbo */
  line(488, 448, 446, 516, 5);
  curve(380, 272, 4, 0, Math.PI*2, 3);                  /* eye dot */
  line(364, 290, 384, 287, 3);                          /* mouth, flat, no nonsense */

  /* suitcase at her feet — the one red thing */
  st.push({ pts: wob([[520,690],[700,690],[700,806],[520,806],[520,690]], 4), w:6, c:RED });
  line(578, 690, 578, 652, 5, RED); line(578, 652, 642, 652, 5, RED); line(642, 652, 642, 690, 5, RED);
  line(560, 690, 560, 806, 3.4, RED); line(660, 690, 660, 806, 3.4, RED);
  line(520, 748, 700, 748, 3, RED);

  /* ground scuffs, fast and urgent */
  line(240, 812, 780, 806, 3);
  line(300, 830, 520, 826, 2.4);
  line(600, 828, 760, 832, 2.4);
  /* motion ticks by the hand — she draws fast */
  path([[300,470],[272,458]], 3); path([[306,502],[276,500]], 3); path([[500,430],[528,416]], 3);
  /* lengths */
  var total = 0;
  st.forEach(function(s){
    var L = 0;
    for (var i = 1; i < s.pts.length; i++){ var dx = s.pts[i][0]-s.pts[i-1][0], dy = s.pts[i][1]-s.pts[i-1][1]; L += Math.sqrt(dx*dx+dy*dy); }
    s.len = L; total += L;
  });
  return { strokes: st, total: total };
}
var drawing = buildDrawing();

/* ---------- state ---------- */
var PHASE0 = 0;                 /* frame one: complete drawing, support 0 */
var supIdx = 0;
var drawStart = -1e9;           /* elapsed time the current redraw began; frame one = long past */
var DRAW_MS = 3000;
var fadeFrom = -1, fadeStart = 0, FADE_MS = 320;
var tiltX = 0, tiltY = 0, tiltVX = 0, tiltVY = 0;
var dragging = false, dragMoved = 0, downX = 0, downY = 0, lastX = 0, lastY = 0, downT = 0;

/* ---------- shape painters ---------- */
function paintShape(s){
  ctx.globalAlpha = (s.a == null ? 1 : s.a);
  if (s.k === 'fill'){ ctx.fillStyle = s.c; ctx.fillRect(-80, -80, 1160, 1160); }
  else if (s.k === 'dot'){ ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); }
  else if (s.k === 'bar'){ ctx.fillStyle = GHOST; ctx.fillRect(s.x, s.y, s.w, s.h); }
  else if (s.k === 'rect'){ ctx.fillStyle = s.c; ctx.fillRect(s.x, s.y, s.w, s.h); }
  else if (s.k === 'rectO'){ ctx.strokeStyle = s.c; ctx.lineWidth = s.wdt; ctx.strokeRect(s.x, s.y, s.w, s.h); }
  else if (s.k === 'circO'){ ctx.strokeStyle = s.c; ctx.lineWidth = s.wdt; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.stroke(); }
  else if (s.k === 'tri'){ ctx.fillStyle = s.c; ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.lineTo(s.x3, s.y3); ctx.closePath(); ctx.fill(); }
  else if (s.k === 'x'){ ctx.strokeStyle = s.c; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(s.x-s.s, s.y-s.s); ctx.lineTo(s.x+s.s, s.y+s.s); ctx.moveTo(s.x+s.s, s.y-s.s); ctx.lineTo(s.x-s.s, s.y+s.s); ctx.stroke(); }
  else if (s.k === 'line'){ ctx.strokeStyle = s.c; ctx.lineWidth = s.w; ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function paintSupport(idx){ var sh = supports[idx].shapes; for (var i = 0; i < sh.length; i++) paintShape(sh[i]); }

function paintDrawing(progress){
  var budget = drawing.total * progress;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (var i = 0; i < drawing.strokes.length; i++){
    var s = drawing.strokes[i];
    if (budget <= 0) break;
    ctx.strokeStyle = s.c; ctx.lineWidth = s.w;
    ctx.beginPath(); ctx.moveTo(s.pts[0][0], s.pts[0][1]);
    var left = budget;
    for (var j = 1; j < s.pts.length; j++){
      var dx = s.pts[j][0]-s.pts[j-1][0], dy = s.pts[j][1]-s.pts[j-1][1];
      var d = Math.sqrt(dx*dx+dy*dy);
      if (left >= d){ ctx.lineTo(s.pts[j][0], s.pts[j][1]); left -= d; }
      else { var f = d > 0 ? left/d : 0; ctx.lineTo(s.pts[j-1][0]+dx*f, s.pts[j-1][1]+dy*f); left = 0; break; }
    }
    ctx.stroke();
    budget -= s.len;
  }
}

var NOTE_FONT = '"Segoe Print","Bradley Hand","Comic Sans MS",cursive';
var noteBox = { x:0, y:0, w:0, h:0 };
function paintNote(scale){
  var txt = supports[supIdx].name;
  var fs = isPhone() ? 30 : 27;
  ctx.font = fs + 'px ' + NOTE_FONT;
  var tw = ctx.measureText(txt).width;
  var pad = 14, bw = tw + pad*2, bh = fs + pad*1.5;
  var bx = 1000 - bw - 26, by = 1000 - bh - 24;
  noteBox = { x:bx, y:by, w:bw, h:bh };
  /* the note is lettered on a torn scrap, taped at the top */
  ctx.save();
  ctx.translate(bx + bw/2, by + bh/2); ctx.rotate(-0.012);
  ctx.globalAlpha = 0.30; ctx.fillStyle = '#F4EDD8';
  ctx.fillRect(-bw/2, -bh/2, bw, bh);
  ctx.globalAlpha = 1;
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, 0, 3);
  ctx.globalAlpha = 0.55; ctx.fillStyle = '#EFE8D2';
  ctx.fillRect(-42, -bh/2 - 6, 84, 14);
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------- main draw ---------- */
function draw(now){
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#C8A97E';
  ctx.fillRect(0, 0, vw, vh);
  var scale = Math.min(vw, vh) / 1000;
  var ox = (vw - 1000 * scale) / 2, oy = (vh - 1000 * scale) / 2;
  ctx.translate(ox, oy); ctx.scale(scale, scale);
  /* tilt: rotate a touch + light shift on the creases */
  ctx.translate(500, 500);
  ctx.rotate(tiltX * 0.05);
  ctx.translate(tiltY * 9, tiltX * 7);
  ctx.translate(-500, -500);
  /* support(s) */
  var elapsed = now;
  if (fadeFrom >= 0){
    paintSupport(fadeFrom);
    var fp = Math.min(1, (elapsed - fadeStart) / FADE_MS);
    ctx.globalAlpha = fp;
    paintSupport(supIdx);
    ctx.globalAlpha = 1;
    if (fp >= 1) fadeFrom = -1;
  } else {
    paintSupport(supIdx);
  }
  /* light sheen that follows tilt (reads on creases) */
  if (Math.abs(tiltX) + Math.abs(tiltY) > 0.01){
    ctx.fillStyle = '#FFFFFF';
    ctx.globalAlpha = 0.05 * Math.min(1, Math.abs(tiltY) + Math.abs(tiltX));
    ctx.fillRect(-80 + tiltY * 120, -80, 1160, 1160);
    ctx.globalAlpha = 1;
  }
  /* drawing, fast stroke-by-stroke after a switch; complete at rest */
  var dp = Math.min(1, (elapsed - drawStart) / DRAW_MS);
  paintDrawing(dp < 1 ? (dp * 1.15 - dp * dp * 0.15) : 1);
  paintNote(scale);
}

var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
function frame(){
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() - t0 : PHASE0;
  /* spring the tilt home */
  if (!dragging){
    tiltVX += (-tiltX * 0.12 - tiltVX * 0.22);
    tiltVY += (-tiltY * 0.12 - tiltVY * 0.22);
    tiltX += tiltVX; tiltY += tiltVY;
    if (Math.abs(tiltX) < 0.0005 && Math.abs(tiltVX) < 0.0005) { tiltX = 0; tiltVX = 0; }
    if (Math.abs(tiltY) < 0.0005 && Math.abs(tiltVY) < 0.0005) { tiltY = 0; tiltVY = 0; }
  }
  draw(PHASE0 + now);
}
draw(PHASE0);   /* synchronous first frame: box + complete drawing */
if (typeof requestAnimationFrame === 'function'){
  var loop = function(){ frame(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

/* ---------- interaction ---------- */
function toStage(px, py){
  var scale = Math.min(vw, vh) / 1000;
  return [ (px - (vw - 1000*scale)/2) / scale, (py - (vh - 1000*scale)/2) / scale ];
}
function nowMs(){ return (typeof performance !== 'undefined' && performance.now) ? performance.now() - t0 : 0; }
canvas.addEventListener('pointerdown', function(e){
  dragging = true; dragMoved = 0;
  downX = lastX = e.clientX; downY = lastY = e.clientY; downT = nowMs();
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch(_){} }
});
canvas.addEventListener('pointermove', function(e){
  if (!dragging) return;
  var dx = e.clientX - lastX, dy = e.clientY - lastY;
  dragMoved += Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
  lastX = e.clientX; lastY = e.clientY;
  var scale = Math.min(vw, vh) / 1000;
  tiltY = Math.max(-1, Math.min(1, tiltY + dx / (scale * 260)));
  tiltX = Math.max(-1, Math.min(1, tiltX + dy / (scale * 260)));
  tiltVX = 0; tiltVY = 0;
  if (typeof requestAnimationFrame !== 'function') frame();
});
function endPointer(e){
  if (!dragging) return;
  dragging = false;
  var quick = nowMs() - downT < 400;
  if (quick && dragMoved < 14){
    var p = toStage(e.clientX, e.clientY);
    if (p[0] >= noteBox.x - 10 && p[0] <= noteBox.x + noteBox.w + 10 &&
        p[1] >= noteBox.y - 10 && p[1] <= noteBox.y + noteBox.h + 10){
      fadeFrom = supIdx;
      supIdx = (supIdx + 1) % supports.length;
      fadeStart = nowMs();
      drawStart = nowMs() + 60;   /* ground lands, then the hand rushes in */
      if (typeof requestAnimationFrame !== 'function') frame();
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ dragging = false; });
</script>
