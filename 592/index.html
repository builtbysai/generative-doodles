<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frequency Generators</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #070708; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  #soundBtn {
    position: fixed; top: 12px; right: 12px; z-index: 2;
    font: 11px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.14em;
    color: #39ff6a; background: rgba(5, 8, 5, 0.72);
    border: 1px solid rgba(57, 255, 106, 0.45); border-radius: 3px;
    padding: 8px 10px; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="soundBtn" type="button">SOUND OFF</button>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG, fixed seed: frame one is fully deterministic.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1832);

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  function alpha(v) {
    var a = Math.round(v * 10000) / 10000;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    return a;
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }

  // The sequencer: a 9.7 s pattern cycle, six strings, irregular hit
  // offsets inside each cycle. No 4/4 grid anywhere; intervals wander.
  // Two hits are rolls: rapid triple strikes that blur the striker.
  var P = 9.7;
  var HITS = [
    [0.4, 3.1, 6.8],
    [1.2, 4.6, 8.3],
    [0.9, 2.7, 5.9, 8.8],
    [1.8, 5.2],
    [0.6, 3.9, 7.4],
    [2.4, 6.2, 9.1]
  ];
  function isRoll(s, off) {
    return (s === 2 && off === 5.9) || (s === 4 && off === 3.9);
  }
  // All events in [t - w, t + w]: { s, tk, roll }.
  function eventsNear(t, w) {
    var out = [];
    var c0 = Math.floor((t - w) / P) - 1;
    var c1 = Math.floor((t + w) / P) + 1;
    for (var c = c0; c <= c1; c++) {
      for (var s = 0; s < 6; s++) {
        for (var j = 0; j < HITS[s].length; j++) {
          var tk = c * P + HITS[s][j];
          if (tk >= t - w && tk <= t + w) {
            out.push({ s: s, tk: tk, roll: isRoll(s, HITS[s][j]) });
          }
        }
      }
    }
    return out;
  }
  function recentStrike(s, t) {
    var evs = eventsNear(t, 12);
    var best = null;
    for (var i = 0; i < evs.length; i++) {
      if (evs[i].s === s && evs[i].tk <= t && (!best || evs[i].tk > best.tk)) best = evs[i];
    }
    return best;
  }
  function nextStrike(s, t) {
    var evs = eventsNear(t, 12);
    var best = null;
    for (var i = 0; i < evs.length; i++) {
      if (evs[i].s === s && evs[i].tk >= t && (!best || evs[i].tk < best.tk)) best = evs[i];
    }
    return best;
  }

  // Seeded dust motes drifting over the body.
  var MOTES = [];
  for (var i = 0; i < 22; i++) {
    MOTES.push({
      x: rnd(), y: rnd(), r: 0.6 + rnd() * 1.2,
      a: 0.03 + rnd() * 0.08,
      px: rnd() * Math.PI * 2, py: rnd() * Math.PI * 2,
      sx: 0.003 + rnd() * 0.006, sy: 0.002 + rnd() * 0.004
    });
  }
  // Seeded faint scratches on the matte body.
  var SCRATCH = [];
  for (var i = 0; i < 9; i++) {
    SCRATCH.push({ x: rnd(), y: rnd(), len: 0.03 + rnd() * 0.09, ang: (rnd() - 0.5) * 1.2, a: 0.03 + rnd() * 0.05 });
  }

  var tNow = 60.7;

  // String geometry in rotated guitar space: unit S = room side.
  // Six strings run from the headstock (left) to the bridge (right).
  var STRING_Y = [-0.088, -0.053, -0.018, 0.018, 0.053, 0.088];
  var NECK_X = -0.44, BRIDGE_X = 0.16, STRIKE_X = 0.015;

  function draw(t) {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var W = Math.max(1, Math.floor(vw));
    var H = Math.max(1, Math.floor(vh));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var isPhone = false;
    try {
      var sw = window.screen.width, sh = window.screen.height;
      var mn = Math.min(sw, sh);
      isPhone = mn < 700 || (H > W * 1.15);
    } catch (e) { isPhone = (H > W * 1.15); }

    // Page ground is the piece's own background color on both sizes.
    ctx.fillStyle = '#070708';
    ctx.fillRect(0, 0, W, H);

    // Room rect: full-bleed on phones, centered square on desktop.
    var rw, rh, rx, ry;
    if (isPhone) {
      rx = 0; ry = 0; rw = W; rh = H;
    } else {
      rw = Math.min(W * 0.92, H * 0.92);
      rh = rw;
      rx = (W - rw) / 2;
      ry = (H - rh) / 2;
    }
    var S = Math.min(rw, rh);
    var u = S / 800;
    var cx = rx + rw / 2, cy = ry + rh / 2;

    // Ground: near-black, faintly warm toward the upper right.
    var gnd = ctx.createLinearGradient(rx, ry + rh, rx + rw, ry);
    gnd.addColorStop(0, '#070708');
    gnd.addColorStop(1, '#0e0d0c');
    ctx.fillStyle = gnd;
    ctx.fillRect(rx, ry, rw, rh);

    // ---- Guitar, rotated so the headstock sits lower left ----
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.61);
    ctx.scale(1.12, 1.12);

    // Soft shadow under the body.
    ctx.fillStyle = 'rgba(0,0,0,' + alpha(0.5) + ')';
    ctx.beginPath();
    ctx.moveTo(0.10 * S + 8 * u, 0.16 * S + 10 * u);
    ctx.ellipse(0.24 * S + 8 * u, 0.02 * S + 10 * u, 0.21 * S, 0.17 * S, 0, 0, Math.PI * 2);
    ctx.fill();

    // Neck: matte black, tapering toward the headstock.
    ctx.fillStyle = '#101012';
    ctx.beginPath();
    ctx.moveTo(-0.46 * S, -0.075 * S);
    ctx.lineTo(0.06 * S, -0.105 * S);
    ctx.lineTo(0.06 * S, 0.105 * S);
    ctx.lineTo(-0.46 * S, 0.075 * S);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(200,200,210,' + alpha(0.10) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Frets: thin steel lines across the neck.
    ctx.strokeStyle = 'rgba(154,160,168,' + alpha(0.35) + ')';
    ctx.lineWidth = 1.2;
    var fretX = [-0.40, -0.33, -0.265, -0.205, -0.15, -0.10, -0.055, -0.015];
    for (var fi = 0; fi < fretX.length; fi++) {
      var fx = fretX[fi] * S;
      var fw = 0.075 * S + (fx / S + 0.46) * 0.06 * S;
      ctx.beginPath();
      ctx.moveTo(fx, -fw);
      ctx.lineTo(fx, fw);
      ctx.stroke();
    }

    // Headstock: wider matte black slab at the lower left end.
    ctx.fillStyle = '#0c0c0e';
    ctx.beginPath();
    ctx.moveTo(-0.46 * S, -0.105 * S);
    ctx.lineTo(-0.335 * S, -0.125 * S);
    ctx.lineTo(-0.335 * S, 0.125 * S);
    ctx.lineTo(-0.46 * S, 0.105 * S);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(200,200,210,' + alpha(0.12) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Tuning pegs: six small brass posts along the headstock edges.
    for (var pg = 0; pg < 3; pg++) {
      var px = (-0.435 + pg * 0.045) * S;
      ctx.fillStyle = '#b08d3e';
      ctx.beginPath();
      ctx.moveTo(px + 3 * u, -0.125 * S);
      ctx.arc(px, -0.125 * S, 3 * u, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(px + 3 * u, 0.125 * S);
      ctx.arc(px, 0.125 * S, 3 * u, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#8a6f2e';
      ctx.fillRect(px - 1 * u, -0.125 * S - 7 * u, 2 * u, 7 * u);
      ctx.fillRect(px - 1 * u, 0.125 * S, 2 * u, 7 * u);
    }

    // Body: matte black, a wide rounded shape at the upper right.
    var body = ctx.createRadialGradient(0.20 * S, -0.03 * S, 10, 0.24 * S, 0.02 * S, 0.24 * S);
    body.addColorStop(0, '#1a1a1d');
    body.addColorStop(0.6, '#111214');
    body.addColorStop(1, '#0a0a0c');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(0.24 * S + 0.21 * S, 0.02 * S);
    ctx.ellipse(0.24 * S, 0.02 * S, 0.21 * S, 0.165 * S, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(220,220,230,' + alpha(0.14) + ')';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // Sound hole: dark ring with a brass inner edge.
    ctx.fillStyle = '#050506';
    ctx.beginPath();
    ctx.moveTo(0.155 * S + 0.048 * S, 0.01 * S);
    ctx.ellipse(0.155 * S, 0.01 * S, 0.048 * S, 0.048 * S, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#b08d3e';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(176,141,62,' + alpha(0.35) + ')';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0.155 * S + 0.056 * S, 0.01 * S);
    ctx.ellipse(0.155 * S, 0.01 * S, 0.056 * S, 0.056 * S, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Bridge: a low dark bar the strings run over.
    ctx.fillStyle = '#161617';
    ctx.fillRect(BRIDGE_X * S - 0.008 * S, -0.115 * S, 0.016 * S, 0.23 * S);
    ctx.fillStyle = 'rgba(220,220,230,' + alpha(0.10) + ')';
    ctx.fillRect(BRIDGE_X * S - 0.008 * S, -0.115 * S, 0.002 * S, 0.23 * S);

    // Mechanical fingers: small brass blocks rising from below the neck,
    // one under each string, the machine's fretting hand. Each is short
    // and clearly separate, with a slim dark rail behind the row.
    ctx.fillStyle = '#1c1a14';
    ctx.fillRect(-0.026 * S, -0.095 * S, 0.012 * S, 0.19 * S);
    for (var mf = 0; mf < 6; mf++) {
      var fy = STRING_Y[mf] * S;
      var fx = -0.02 * S;
      ctx.fillStyle = '#c9a227';
      ctx.fillRect(fx - 0.004 * S, fy + 0.004 * S, 0.008 * S, 0.020 * S);
      ctx.fillStyle = 'rgba(232,217,160,' + alpha(0.5) + ')';
      ctx.fillRect(fx - 0.004 * S, fy + 0.004 * S, 0.008 * S, 0.002 * S);
    }

    // Harmonic blooms: thin pale-gold lines rising above the body from
    // each recently struck string, taller and brighter just after a hit.
    for (var hb = 0; hb < 6; hb++) {
      var rsb = recentStrike(hb, t);
      if (!rsb) continue;
      var ageB = t - rsb.tk;
      if (ageB > 5) continue;
      var envB = Math.exp(-ageB / 1.4) * (rsb.roll ? 1.3 : 1);
      if (envB < 0.05) continue;
      var by = STRING_Y[hb] * S;
      var bx = (0.14 + hb * 0.018) * S;
      var bh = (0.05 + 0.09 * envB) * S;
      ctx.strokeStyle = 'rgba(242,227,176,' + alpha(0.55 * envB) + ')';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(bx, by - 0.01 * S);
      ctx.lineTo(bx, by - bh);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(242,227,176,' + alpha(0.22 * envB) + ')';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(bx + 0.012 * S, by - 0.008 * S);
      ctx.lineTo(bx + 0.012 * S, by - bh * 0.6);
      ctx.stroke();
    }
    // Warm bloom glow over the body just after any strike.
    var anyRs = recentStrike(5, t) || recentStrike(2, t) || recentStrike(0, t);
    if (anyRs && (t - anyRs.tk) < 2.5) {
      var gEnv = Math.exp(-(t - anyRs.tk) / 0.9);
      var bg = ctx.createRadialGradient(0.22 * S, 0, 0, 0.22 * S, 0, 0.26 * S);
      bg.addColorStop(0, 'rgba(232,217,160,' + alpha(0.10 * gEnv) + ')');
      bg.addColorStop(1, 'rgba(232,217,160,0)');
      ctx.fillStyle = bg;
      ctx.fillRect(-0.05 * S, -0.27 * S, 0.55 * S, 0.54 * S);
    }

    // The six strings: steel grey lines with a struck displacement wave,
    // a quick decaying oscillation after each hit, still between hits.
    var SEG = 90;
    for (var si = 0; si < 6; si++) {
      var sy = STRING_Y[si] * S;
      var rsi = recentStrike(si, t);
      var age = rsi ? (t - rsi.tk) : 99;
      var env = (age < 5) ? Math.exp(-age / 0.9) : 0;
      var amp = (rsi && rsi.roll ? 9 : 5.5) * u * env;
      var x0 = NECK_X * S, x1 = (BRIDGE_X + 0.02) * S;
      for (var sg = 0; sg < SEG; sg++) {
        var s0 = sg / SEG, s1 = (sg + 1) / SEG;
        var sm = (s0 + s1) / 2;
        // Standing envelope: zero at nut and bridge, full near the strike.
        var shape = Math.sin(Math.PI * sm);
        var near = Math.exp(-Math.abs(sm - 0.62) / 0.30);
        var wave = amp * (0.35 * shape + 0.65 * near) *
          Math.sin(2 * Math.PI * (sm * 3) - age * 16 + si * 0.9);
        var y0 = sy + amp * (0.35 * Math.sin(Math.PI * s0) + 0.65 * Math.exp(-Math.abs(s0 - 0.62) / 0.30)) *
          Math.sin(2 * Math.PI * (s0 * 3) - age * 16 + si * 0.9);
        var y1 = sy + amp * (0.35 * Math.sin(Math.PI * s1) + 0.65 * Math.exp(-Math.abs(s1 - 0.62) / 0.30)) *
          Math.sin(2 * Math.PI * (s1 * 3) - age * 16 + si * 0.9);
        var bright = 0.55 + env * 0.45 * (0.5 + 0.5 * Math.sin(2 * Math.PI * (sm * 3) - age * 16));
        ctx.strokeStyle = 'rgba(154,160,168,' + alpha(0.75 * bright) + ')';
        ctx.lineWidth = si < 3 ? 1.6 : 1.2;
        ctx.beginPath();
        ctx.moveTo(x0 + (x1 - x0) * s0, y0);
        ctx.lineTo(x0 + (x1 - x0) * s1, y1);
        ctx.stroke();
      }
      // Steel hairline just above each string.
      ctx.strokeStyle = 'rgba(225,230,235,' + alpha(0.20 + env * 0.25) + ')';
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(x0, sy - 1.4 * u);
      ctx.lineTo(x1, sy - 1.4 * u);
      ctx.stroke();
    }

    // Solenoid strikers: brass rectangles hovering above each string at
    // the strike point. Each dips just before its hit, rebounds after,
    // and blurs into ghosts on a roll.
    for (var st = 0; st < 6; st++) {
      var sty = STRING_Y[st] * S;
      var sx = STRIKE_X * S;
      var nxs = nextStrike(st, t);
      var rss = recentStrike(st, t);
      var dip = 0;
      if (nxs && (nxs.tk - t) < 0.45) {
        dip = 12 * u * smooth(1 - (nxs.tk - t) / 0.45);
      }
      if (rss && (t - rss.tk) < 0.6) {
        dip -= 6 * u * (1 - (t - rss.tk) / 0.6);
      }
      var hover = 11 * u;
      var wdt = 0.012 * S, hgt = 0.016 * S;
      var isRollNow = (rss && rss.roll && (t - rss.tk) < 0.9) ||
        (nxs && nxs.roll && (nxs.tk - t) < 0.45);
      // Solenoid housing: a slim dark rail above the strikers.
      // (Drawn once per striker would overpaint; handled below.)
      if (isRollNow) {
        // Blurred triple ghost while the roll runs.
        for (var gh = -1; gh <= 1; gh++) {
          ctx.fillStyle = 'rgba(201,162,39,' + alpha(0.28) + ')';
          ctx.fillRect(sx - wdt / 2 + gh * 2.5 * u, sty - hover - hgt + dip + gh * 3 * u, wdt, hgt);
        }
      }
      ctx.fillStyle = '#c9a227';
      ctx.fillRect(sx - wdt / 2, sty - hover - hgt + dip, wdt, hgt);
      ctx.fillStyle = '#8a6f2e';
      ctx.fillRect(sx - wdt / 2, sty - hover - hgt + dip, wdt, 0.004 * S);
      ctx.fillStyle = 'rgba(232,217,160,' + alpha(0.65) + ')';
      ctx.fillRect(sx - wdt / 2 + 1.5 * u, sty - hover - hgt + dip + 2 * u, 2 * u, hgt - 4 * u);
      // Striker tip touching toward the string at the plunge.
      ctx.fillStyle = '#e8d9a0';
      ctx.fillRect(sx - 1.5 * u, sty - hover - hgt + dip + hgt - 2 * u, 3 * u, 2 * u);
    }
    // Solenoid rail: one slim dark bar spanning all six strikers.
    ctx.fillStyle = '#1c1c1f';
    ctx.fillRect(STRIKE_X * S - 0.016 * S, -0.115 * S - 0.032 * S, 0.032 * S, 0.006 * S);
    ctx.fillStyle = 'rgba(176,141,62,' + alpha(0.5) + ')';
    ctx.fillRect(STRIKE_X * S - 0.016 * S, -0.115 * S - 0.032 * S, 0.032 * S, 0.0015 * S);

    // Seeded scratches on the matte body.
    for (var sc = 0; sc < SCRATCH.length; sc++) {
      var scr = SCRATCH[sc];
      var scx = (0.10 + scr.x * 0.28) * S, scy = (-0.10 + scr.y * 0.22) * S;
      ctx.strokeStyle = 'rgba(220,220,230,' + alpha(scr.a) + ')';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(scx, scy);
      ctx.lineTo(scx + Math.cos(scr.ang) * scr.len * S, scy + Math.sin(scr.ang) * scr.len * S);
      ctx.stroke();
    }

    // Dust motes drifting over the body.
    for (var m = 0; m < MOTES.length; m++) {
      var mo = MOTES[m];
      var mx = (0.02 + mo.x * 0.42) * S + Math.sin(t * mo.sx + mo.px) * 0.008 * S;
      var my = (-0.14 + mo.y * 0.30) * S + Math.sin(t * mo.sy + mo.py) * 0.006 * S;
      ctx.beginPath();
      ctx.moveTo(mx + mo.r, my);
      ctx.arc(mx, my, mo.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(240,225,180,' + alpha(mo.a) + ')';
      ctx.fill();
    }

    ctx.restore();

    // ---- Pattern readout: a paper-roll strip along the bottom fifth ----
    var stripY = ry + rh * 0.8, stripH = rh * 0.2;
    ctx.fillStyle = '#050805';
    ctx.fillRect(rx, stripY, rw, stripH);
    ctx.fillStyle = 'rgba(57,255,106,' + alpha(0.35) + ')';
    ctx.fillRect(rx, stripY, rw, 1);
    // Advancing ticks: every sequencer event in a 16 s window around t,
    // mapped across the strip, irregular spacing, never a grid.
    var evs = eventsNear(t, 8);
    var win = 16;
    for (var e = 0; e < evs.length; e++) {
      var ex = rx + ((evs[e].tk - (t - 8)) / win) * rw;
      var ey = stripY + stripH * (0.22 + evs[e].s * 0.10);
      var recent = evs[e].tk <= t && (t - evs[e].tk) < 1.5;
      ctx.fillStyle = 'rgba(57,255,106,' + alpha(recent ? 0.95 : 0.45) + ')';
      ctx.beginPath();
      ctx.moveTo(ex + 2.5 * u, ey);
      ctx.arc(ex, ey, 2.5 * u, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(57,255,106,' + alpha(recent ? 0.7 : 0.25) + ')';
      ctx.fillRect(ex - 0.5, stripY + stripH * 0.14, 1, stripH * 0.72);
    }
    // Playhead: the machine's now, center of the roll.
    ctx.fillStyle = 'rgba(57,255,106,' + alpha(0.85) + ')';
    ctx.fillRect(rx + rw / 2 - 1, stripY, 2, stripH);
    // Readout labels, phosphor green.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#39ff6a';
    ctx.font = '600 11px system-ui, -apple-system, sans-serif';
    ctx.fillText('KS1 EUCLID 3 5 4 2 3 3', rx + rw * 0.03, stripY + stripH * 0.30);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(57,255,106,' + alpha(0.75) + ')';
    ctx.font = '11px system-ui, -apple-system, sans-serif';
    ctx.fillText('WATCH ONLY', rx + rw * 0.97, stripY + stripH * 0.30);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(57,255,106,' + alpha(0.45) + ')';
    ctx.font = '10px system-ui, -apple-system, sans-serif';
    ctx.fillText('SOLENOID ROLL 2 4', rx + rw * 0.03, stripY + stripH * 0.88);

    // Plates on canvas: title, date, hint.
    ctx.textAlign = 'left';
    ctx.fillStyle = '#c8c4b8';
    ctx.font = '600 13px system-ui, -apple-system, sans-serif';
    ctx.fillText('FREQUENCY GENERATORS', rx + rw * 0.04, ry + rh * 0.055);
    ctx.fillStyle = '#8a8578';
    ctx.font = '11px system-ui, -apple-system, sans-serif';
    ctx.fillText('2007 · 01 · 17', rx + rw * 0.04, ry + rh * 0.055 + 16);
  }

  // One synchronous frame at load: t = 60.7, fixed phase. The low E
  // string was struck 0.1 s ago, so it shivers and blooms; the D string
  // is 0.2 s from its next hit, its striker already plunging.
  draw(60.7);
  tNow = 60.7;

  function onResize() { draw(tNow); }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  // Sound is optional and off by default; the visuals carry the piece.
  // Audio starts only from the button, never on load.
  var audioOn = false;
  var actx = null, master = null;
  var btn = null;
  try { btn = document.getElementById('soundBtn'); } catch (e) { btn = null; }
  var audioStart = 0, audioT0 = 60.7;
  var nextK = [];
  var FREQS = [82.41, 110.0, 146.83, 196.0, 246.94, 329.63];

  function pluck(when, s, roll) {
    if (!actx || !master) return;
    var partials = [1, 2.02, 2.94, 4.2];
    var hits = roll ? [0, 0.14, 0.28] : [0];
    for (var h = 0; h < hits.length; h++) {
      var wh = when + hits[h];
      for (var q = 0; q < partials.length; q++) {
        var osc = actx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = FREQS[s] * partials[q] * (1 + (s - 2.5) * 0.0015);
        var g = actx.createGain();
        var peak = 0.14 / (q + 1) / (h + 1);
        g.gain.setValueAtTime(0, wh);
        g.gain.linearRampToValueAtTime(peak, wh + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, wh + 1.8);
        osc.connect(g);
        g.connect(master);
        osc.start(wh);
        osc.stop(wh + 1.9);
      }
    }
  }

  function scheduleAudio() {
    if (!audioOn || !actx) return;
    var now = actx.currentTime;
    var elapsed = now - audioStart;
    var horizon = elapsed + 1.5;
    var evs = eventsNear(audioT0 + elapsed, 2);
    for (var i = 0; i < evs.length; i++) {
      var rel = (evs[i].tk - audioT0) - elapsed;
      if (rel >= -0.05 && rel < 1.5) {
        pluck(now + Math.max(rel, 0), evs[i].s, evs[i].roll);
      }
    }
  }

  function toggleSound() {
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
    if (!audioOn) {
      try {
        var AC = (typeof AudioContext !== 'undefined') ? AudioContext : webkitAudioContext;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = 0;
        master.connect(actx.destination);
        master.gain.linearRampToValueAtTime(0.16, actx.currentTime + 2);
        audioStart = actx.currentTime;
        audioOn = true;
        if (btn) btn.textContent = 'SOUND ON';
        setInterval(scheduleAudio, 400);
      } catch (e) { audioOn = false; }
    } else {
      audioOn = false;
      try { if (actx) actx.close(); } catch (e) {}
      actx = null;
      master = null;
      if (btn) btn.textContent = 'SOUND OFF';
    }
  }

  if (btn && btn.addEventListener) {
    btn.addEventListener('click', toggleSound);
  }

  if (reduced) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    tNow = 60.7 + (ts - start) / 1000;
    draw(tNow);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
