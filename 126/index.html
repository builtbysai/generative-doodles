<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№126 · 512 Characters</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D0D10; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(230,223,206,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag the world to scrub time</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

// No.126 512 Characters: a raymarched SDF landscape whose ENTIRE generator is the
// string below. The segments join into the formula; the joined string is eval'd
// once and is the only ray function the piece ever calls. The code strip shows
// the joined string character for character, with its live count.
const SEG=[
"(x,y,t,s)=>{let z=.1,b=0;",
"for(let i=0;i<26;i++){",
"let X=x*z*.8,Y=1.55+y*z,Z=2*z+t*1.5,",
"H=Math.sin(X*.85+s)*Math.cos(Z*.55-t*.45)+.65*Math.sin(X*1.9-t*.6)*Math.sin(Z*1.25+s*.7),",
"D=Y-H-1.05;",
"if(D<.03){b=Math.max(0,1-z/11)*(.4+.6*Math.abs(Math.sin(X*1.3+Z*1.05+s)));break}",
"z+=Math.max(.07,D*.5);if(z>12)break}",
"return b}"
];
const FORMULA=SEG.join('');
const ray=eval(FORMULA);
const COUNT=FORMULA.length+'/512';
const GROUND='#0D0D10', BONE='#E6DFCE', GREEN='#7BA05B', GREEN_HI='#C4E39A';
const MONO='Menlo, Consolas, "DejaVu Sans Mono", monospace';
let seedPhase=1.7, timeVal=3.2, lastMs=null;
let dragging=false, dragZone='world', dragLastX=0, dragLastY=0, activeTerm=-1, lastTapMs=-9999, tapX=0, tapY=0;

function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(!dragging) timeVal+=dt*0.55;
  const t=timeVal, s=seedPhase;
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,w,h);
  const worldH=Math.round(h*0.8);
  // --- the world: raymarch the formula per cell, bone on near-black ---
  const cell=w>900?6:(w>500?5:4);
  const cw=Math.ceil(w/cell), chh=Math.ceil(worldH/cell);
  const aspect=w/worldH;
  ctx.fillStyle=BONE;
  for(let j=0;j<chh;j++){
    const ny=1-((j+0.5)/chh)*2;
    for(let i=0;i<cw;i++){
      const nx=((i+0.5)/cw*2-1)*aspect;
      const b=ray(nx,ny,t,s);
      if(b<=0.03) continue;
      const q=Math.round(b*7)/7; // quantised levels, hatch not blur
      ctx.globalAlpha=0.12+0.88*q;
      ctx.fillRect(i*cell,j*cell,cell,cell-1); // unfilled row inside the cell = hatch gap
    }
  }
  ctx.globalAlpha=1;
  // --- hairline rule ---
  ctx.fillStyle='rgba(230,223,206,0.28)';
  ctx.fillRect(0,worldH,w,1);
  // --- the code strip: the formula itself, live ---
  const stripTop=worldH+1, stripH=h-stripTop;
  const fs=clamp(Math.floor(w/105),10,13);
  ctx.font=fs+'px '+MONO;
  const charW=ctx.measureText('M').width||fs*0.6;
  const lineH=Math.round(fs*1.45);
  const padX=Math.max(10,Math.round(w*0.02));
  const cols=Math.max(10,Math.floor((w-padX*2)/charW));
  const totalLines=Math.ceil(FORMULA.length/cols)+1; // +1 for the count line
  let topY=stripTop+Math.max(6,(stripH-totalLines*lineH)/2)+fs;
  // term character ranges
  const ranges=[]; { let a=0; for(const sg of SEG){ ranges.push([a,a+sg.length]); a+=sg.length; } }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  for(let li=0; li<Math.ceil(FORMULA.length/cols); li++){
    const start=li*cols, y=topY+li*lineH;
    if(li===Math.ceil(FORMULA.length/cols)-1){
      // final line carries the count after the formula text
      const tail=FORMULA.slice(start,start+cols);
      drawSegLine(tail,start,padX,y,ranges);
      const cx=padX+(tail.length+3)*charW;
      ctx.fillStyle=GREEN; ctx.globalAlpha=0.95;
      ctx.fillText(COUNT,cx,y);
      ctx.globalAlpha=1;
    } else {
      drawSegLine(FORMULA.slice(start,start+cols),start,padX,y,ranges);
    }
  }
  function drawSegLine(text,start,px,y,ranges){
    // draw the line segment by segment so the active term can glow on its own
    let pos=0;
    while(pos<text.length){
      const gIdx=start+pos;
      let ti=0; while(ti<ranges.length-1 && gIdx>=ranges[ti][1]) ti++;
      const segEnd=Math.min(text.length, ranges[ti][1]-start);
      const chunk=text.slice(pos,segEnd);
      if(ti===activeTerm){ ctx.save(); ctx.shadowColor=GREEN_HI; ctx.shadowBlur=7; ctx.fillStyle=GREEN_HI; }
      else { ctx.fillStyle=GREEN; ctx.globalAlpha=0.82; }
      ctx.fillText(chunk,px+pos*charW,y);
      if(ti===activeTerm) ctx.restore(); else ctx.globalAlpha=1;
      pos=segEnd;
    }
  }
  return { worldH, fs, charW, lineH, padX, cols, topY };
}
let lastLayout=null;
function frame(nowMs){ lastLayout=drawFrame(nowMs); return lastLayout; }

function ptr(e){ return [e.clientX, e.clientY]; }
canvas.addEventListener('pointerdown',e=>{
  const [x,y]=ptr(e); const [w,h]=viewportWH();
  const now=performance.now();
  if(now-lastTapMs<320 && Math.abs(x-tapX)<28 && Math.abs(y-tapY)<28){
    seedPhase=1+Math.random()*6; activeTerm=-1; lastTapMs=-9999; // double-tap reseeds
    frame(now); return;
  }
  lastTapMs=now; tapX=x; tapY=y;
  dragging=true; dragLastX=x; dragLastY=y;
  dragZone = y>h*0.8 ? 'code' : 'world';
  if(dragZone==='code') highlightAt(x,y);
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const [x,y]=ptr(e);
  if(dragZone==='world'){ timeVal += (x-dragLastX)*0.012; }
  else highlightAt(x,y);
  dragLastX=x; dragLastY=y;
});
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function highlightAt(x,y){
  // nearest formula term to the fingertip, by character position in the strip
  if(!lastLayout) return;
  const L=lastLayout;
  const col=clamp(Math.round((x-L.padX)/L.charW),0,L.cols-1);
  const row=clamp(Math.round((y-(L.topY-L.fs))/L.lineH),0,Math.ceil(FORMULA.length/L.cols)-1);
  const idx=clamp(row*L.cols+col,0,FORMULA.length-1);
  let a=0; activeTerm=SEG.length-1;
  for(let i=0;i<SEG.length;i++){ if(idx<a+SEG[i].length){ activeTerm=i; break; } a+=SEG[i].length; }
  frame(performance.now());
}

function loop(nowMs){ frame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
frame(3200);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>frame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>frame(performance.now()));
</script>
</body>
</html>
