<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Emblem Almond Ring</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D0D0F; }
  canvas { display:block; touch-action:none; }
  .hint { position:fixed; left:0; right:0; bottom:14px; text-align:center;
    font:12px/1.4 monospace; color:#8f8a7c; letter-spacing:0.08em; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">drag to flip the rows</div>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// three curated layouts: checker, striped, all-positive
var PATTERNS = [
  function (r, c) { return (r + c) % 2 === 1; },
  function (r, c) { return r % 2 === 1; },
  function (r, c) { return false; }
];
var patIdx = 0;
var rowState = [0, 0, 0, 0, 0];   // committed flip parity per row
var rowAnim = [0, 0, 0, 0, 0];    // animated flip position per row (follows rowState)

function almond(cx, cy, len, wid, ang, seamStroke) {
  var ca = Math.cos(ang), sa = Math.sin(ang);
  function pt(x, y) { return [cx + x * ca - y * sa, cy + x * sa + y * ca]; }
  var tip1 = pt(len / 2, 0), tip2 = pt(-len / 2, 0), c1 = pt(0, wid), c2 = pt(0, -wid);
  ctx.beginPath();
  ctx.moveTo(tip1[0], tip1[1]);
  ctx.quadraticCurveTo(c1[0], c1[1], tip2[0], tip2[1]);
  ctx.quadraticCurveTo(c2[0], c2[1], tip1[0], tip1[1]);
  ctx.closePath(); ctx.fill();
  if (seamStroke) ctx.stroke();
}
function drawModule(cx, cy, u, negative, mirror) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(mirror, 1);
  var fill = negative ? '#1A1A1C' : '#EFE8D6';
  ctx.fillStyle = fill;
  ctx.strokeStyle = '#CFC5AC'; ctx.lineWidth = Math.max(1, u * 0.016);
  // the {8/2} Emblem: two squares, one turned 45 degrees, never rotated
  var hs = u * 0.29;
  ctx.beginPath(); ctx.rect(-hs, -hs, hs * 2, hs * 2); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.rotate(Math.PI / 4);
  ctx.beginPath(); ctx.rect(-hs, -hs, hs * 2, hs * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
  // four cardinal crosses
  var cd = u * 0.40, al = u * 0.085, at = u * 0.027;
  var dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  for (var i = 0; i < 4; i++) {
    var d = dirs[i], px = d[0] * cd, py = d[1] * cd;
    ctx.beginPath();
    if (d[0] === 0) { ctx.rect(px - at, py - al, at * 2, al * 2); ctx.rect(px - al, py - at, al * 2, at * 2); }
    else { ctx.rect(px - al, py - at, al * 2, at * 2); ctx.rect(px - at, py - al, at * 2, al * 2); }
    ctx.fill();
    if (negative) ctx.stroke();
  }
  // four almonds on the diagonals
  for (var j = 0; j < 4; j++) {
    var ang = Math.PI / 4 + j * Math.PI / 2;
    almond(Math.cos(ang) * cd, Math.sin(ang) * cd, u * 0.21, u * 0.115, negative ? ang + Math.PI / 2 : ang, negative);
  }
  // the square hole: a void, not decoration
  var hh = u * 0.085;
  ctx.fillStyle = negative ? '#EFE8D6' : '#1A1A1C';
  ctx.beginPath(); ctx.rect(-hh, -hh, hh * 2, hh * 2); ctx.fill();
  ctx.restore();
}
function gridPositions() {
  // silver tune gaps [1, sqrt2, sqrt2, 1]
  var gaps = [1, Math.SQRT2, Math.SQRT2, 1];
  var total = gaps[0] + gaps[1] + gaps[2] + gaps[3];
  var span = 0.70 * Math.min(W, H);
  var u0 = span / total;
  var offs = [0], acc = 0;
  for (var i = 0; i < 4; i++) { acc += gaps[i] * u0; offs.push(acc); }
  var centered = offs.map(function (v) { return v - span / 2; });
  return { pos: centered, u0: u0, span: span };
}
function draw() {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#0D0D0F'; ctx.fillRect(0, 0, W, H);
  var g = gridPositions();
  var cx = W / 2, cy = H / 2;
  var u = g.u0 * 1.24;
  for (var r = 0; r < 5; r++) {
    var anim = rowAnim[r];
    var mirror = Math.cos(Math.PI * anim);
    if (Math.abs(mirror) < 0.02) mirror = 0.02;
    for (var cix = 0; cix < 5; cix++) {
      var baseNeg = PATTERNS[patIdx](r, cix);
      var neg = (anim > 0.5) ? !baseNeg : baseNeg;
      drawModule(cx + g.pos[cix], cy + g.pos[r], u, neg, mirror);
    }
  }
}
var drag = null, lastTap = { t: 0, x: 0, y: 0 }, dragAcc = 0, flipCursor = 0;
canvas.addEventListener('pointerdown', function (e) {
  var now = Date.now();
  if (now - lastTap.t < 320 && Math.abs(e.clientX - lastTap.x) < 44 && Math.abs(e.clientY - lastTap.y) < 44) {
    patIdx = (patIdx + 1) % PATTERNS.length;
    rowState = [0, 0, 0, 0, 0]; flipCursor = 0;
    lastTap.t = 0; drag = null;
    return;
  }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
  drag = { x: e.clientX };
  dragAcc = 0;
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  dragAcc += e.clientX - drag.x;
  drag = { x: e.clientX };
  while (dragAcc > 85 && flipCursor < 5) { rowState[flipCursor] = rowState[flipCursor] ? 0 : 1; flipCursor++; dragAcc -= 85; }
  while (dragAcc < -85 && flipCursor > 0) { flipCursor--; rowState[flipCursor] = rowState[flipCursor] ? 0 : 1; dragAcc += 85; }
});
function endDrag() { drag = null; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

resize();
draw();
function frame() {
  for (var r = 0; r < 5; r++) rowAnim[r] += (rowState[r] - rowAnim[r]) * 0.16;
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
