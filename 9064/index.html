<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9064 · Grainfield</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#141210; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,220,196,0.38); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.7); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another field</div>
<script>
'use strict';
/*
Grainfield, a stipple study. No lines anywhere. About 25000 dots are seeded
inside generous margins, then advected step by step along a domain warped flow
field built from seeded value noise. Each dot is drawn as a trail of stipple
marks along its travelled path, so the field paints itself: dots linger where
the field converges, and bands and eddies emerge from dot density alone;
nothing is drawn except the dots themselves. Dot size encodes local field
divergence: compression zones grow large dots, expansion zones shrink to
pinpricks. Curvature accumulated along each travelled path lifts the
brightness of dots that passed through strong turning. Warm sepia dots on a
dark umber ground. Every seed is checked for real density contrast, and weak
fields are re-seeded internally until structure emerges.
*/
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const TAU = Math.PI * 2;
const G = 200;          // field grid resolution
const N = 25000;        // dots in final render
const NCHECK = 6000;    // dots used for the structure check
const K = 180;          // advection steps
const MARGIN = 0.075;   // dot margin, unit space
const RMIN = 0.00085, RMAX = 0.0030; // dot radius range, unit space

function hash2(x, y, s){
  let h = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(s|0, 2246822519);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  h ^= h>>>16;
  return (h>>>0) / 4294967296;
}
function vnoise(x, y, s){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash2(xi,yi,s), b = hash2(xi+1,yi,s), c = hash2(xi,yi+1,s), d = hash2(xi+1,yi+1,s);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}
function fbm(x, y, s){
  let v = 0, amp = 0.5, f = 1;
  for(let o = 0; o < 3; o++){ v += amp * vnoise(x*f, y*f, s + o*101); f *= 2.03; amp *= 0.5; }
  return v / 0.875;
}

function buildField(seed){
  const rand = mulberry32(seed);
  const sA = (rand()*1e9)|0, sB = (rand()*1e9)|0, sC = (rand()*1e9)|0, sD = (rand()*1e9)|0, sE = (rand()*1e9)|0;
  const freq = 3.0 + rand()*3.0;
  const warp = 0.9 + rand()*1.6;
  const conv = 0.22 + rand()*0.45;
  const ox = rand()*40, oy = rand()*40;
  const vx = new Float32Array(G*G), vy = new Float32Array(G*G);
  const e = 0.0035;
  for(let j = 0; j < G; j++){
    const y = j/(G-1);
    for(let i = 0; i < G; i++){
      const x = i/(G-1);
      const qx = fbm(x*freq+ox, y*freq+oy, sA) - 0.5;
      const qy = fbm(x*freq+ox+13.7, y*freq+oy+7.1, sB) - 0.5;
      const wx = x + warp*qx*0.5, wy = y + warp*qy*0.5;
      const ang = TAU * fbm(wx*freq+ox*1.7+5.2, wy*freq+oy*1.7+1.3, sC);
      let dx = Math.cos(ang), dy = Math.sin(ang);
      const gx = (fbm((x+e)*freq+ox+3.3, y*freq+oy+9.9, sD) - fbm((x-e)*freq+ox+3.3, y*freq+oy+9.9, sD)) / (2*e);
      const gy = (fbm(x*freq+ox+3.3, (y+e)*freq+oy+9.9, sD) - fbm(x*freq+ox+3.3, (y-e)*freq+oy+9.9, sD)) / (2*e);
      const gm = Math.sqrt(gx*gx + gy*gy);
      const kk = conv / (1 + gm*0.09);
      dx += -gx*kk*0.10;
      dy += -gy*kk*0.10;
      const spd = 0.45 + 0.55*fbm(x*freq*0.7+ox+21.4, y*freq*0.7+oy+17.9, sE);
      vx[j*G+i] = dx*spd; vy[j*G+i] = dy*spd;
    }
  }
  const div = new Float32Array(G*G);
  const h = 1/(G-1);
  for(let j = 0; j < G; j++){
    for(let i = 0; i < G; i++){
      const il = i>0 ? i-1 : i, ir = i<G-1 ? i+1 : i;
      const ju = j>0 ? j-1 : j, jd = j<G-1 ? j+1 : j;
      div[j*G+i] = (vx[j*G+ir]-vx[j*G+il])/((ir-il)*h) + (vy[jd*G+i]-vy[ju*G+i])/((jd-ju)*h);
    }
  }
  const sorted = Array.from(div).sort((a,b)=>a-b);
  const p5 = sorted[Math.floor(sorted.length*0.05)];
  const maxNeg = Math.max(0.5, -p5);
  return { vx, vy, div, maxNeg };
}

const _sv = { x:0, y:0 };
function sampleVec(F, x, y){
  const gx = Math.min(G-1.001, Math.max(0, x*(G-1)));
  const gy = Math.min(G-1.001, Math.max(0, y*(G-1)));
  const i = Math.floor(gx), j = Math.floor(gy);
  const fx = gx-i, fy = gy-j;
  const i00 = j*G+i, i10 = i00+1, i01 = i00+G, i11 = i01+1;
  _sv.x = F.vx[i00]*(1-fx)*(1-fy) + F.vx[i10]*fx*(1-fy) + F.vx[i01]*(1-fx)*fy + F.vx[i11]*fx*fy;
  _sv.y = F.vy[i00]*(1-fx)*(1-fy) + F.vy[i10]*fx*(1-fy) + F.vy[i01]*(1-fx)*fy + F.vy[i11]*fx*fy;
  return _sv;
}
function sampleDiv(F, x, y){
  const gx = Math.min(G-1.001, Math.max(0, x*(G-1)));
  const gy = Math.min(G-1.001, Math.max(0, y*(G-1)));
  const i = Math.floor(gx), j = Math.floor(gy);
  const fx = gx-i, fy = gy-j;
  const i00 = j*G+i, i10 = i00+1, i01 = i00+G, i11 = i01+1;
  return F.div[i00]*(1-fx)*(1-fy) + F.div[i10]*fx*(1-fy) + F.div[i01]*(1-fx)*fy + F.div[i11]*fx*fy;
}

function advect(seed, F, n, trails){
  const rand = mulberry32((seed ^ 0x5bd1e995)|0);
  const jr = mulberry32((seed ^ 0x9e3779b9)|0);
  const xs = new Float32Array(n), ys = new Float32Array(n);
  const curv = new Float32Array(n), prevA = new Float32Array(n);
  const T = trails ? 15 : 0;
  const tx = trails ? new Float32Array(n*T) : null;
  const ty = trails ? new Float32Array(n*T) : null;
  const step0 = trails ? Math.floor(K/T) : 0;
  for(let k = 0; k < n; k++){
    xs[k] = MARGIN + rand()*(1-2*MARGIN);
    ys[k] = MARGIN + rand()*(1-2*MARGIN);
    sampleVec(F, xs[k], ys[k]);
    prevA[k] = Math.atan2(_sv.y, _sv.x);
  }
  const dt = 0.0042;
  const lo = MARGIN, hi = 1-MARGIN;
  for(let s = 0; s < K; s++){
    for(let k = 0; k < n; k++){
      sampleVec(F, xs[k], ys[k]);
      let vx = _sv.x, vy = _sv.y;
      const bw = 0.10;
      const dl = xs[k]-lo, dr = hi-xs[k], db = ys[k]-lo, dtp = hi-ys[k];
      if(vx < 0 && dl < bw) vx *= dl/bw; else if(vx > 0 && dr < bw) vx *= dr/bw;
      if(vy < 0 && db < bw) vy *= db/bw; else if(vy > 0 && dtp < bw) vy *= dtp/bw;
      const mb = 0.12, push = 0.30;
      if(dl < mb) vx += push*(1-dl/mb);
      if(dr < mb) vx -= push*(1-dr/mb);
      if(db < mb) vy += push*(1-db/mb);
      if(dtp < mb) vy -= push*(1-dtp/mb);
      const sp = Math.sqrt(vx*vx + vy*vy);
      const a = Math.atan2(vy, vx);
      let d = a - prevA[k];
      d = Math.atan2(Math.sin(d), Math.cos(d));
      curv[k] += d < 0 ? -d : d;
      prevA[k] = a;
      const step = dt / (0.35 + sp);
      let nx = xs[k] + vx*step, ny = ys[k] + vy*step;
      nx += (jr()+jr()+jr()-1.5)*0.0032;
      ny += (jr()+jr()+jr()-1.5)*0.0032;
      if(nx < lo) nx = lo + (lo-nx)*0.4; else if(nx > hi) nx = hi - (nx-hi)*0.4;
      if(ny < lo) ny = lo + (lo-ny)*0.4; else if(ny > hi) ny = hi - (ny-hi)*0.4;
      xs[k] = nx; ys[k] = ny;
      if(trails && (s+1) % step0 === 0){
        const ti = Math.min(T-1, Math.floor((s+1)/step0)-1);
        tx[k*T+ti] = nx; ty[k*T+ti] = ny;
      }
    }
  }
  return { xs, ys, curv, tx, ty, T };
}

function densityContrast(dots){
  const B = 18, cells = new Uint16Array(B*B);
  const span = 1 - 2*MARGIN;
  const n = dots.xs.length;
  for(let k = 0; k < n; k++){
    let bi = Math.floor((dots.xs[k]-MARGIN)/span*B);
    let bj = Math.floor((dots.ys[k]-MARGIN)/span*B);
    if(bi < 0) bi = 0; else if(bi >= B) bi = B-1;
    if(bj < 0) bj = 0; else if(bj >= B) bj = B-1;
    cells[bj*B+bi]++;
  }
  const sorted = Array.from(cells).sort((a,b)=>b-a);
  const topN = Math.max(1, Math.floor(B*B*0.1));
  let top = 0;
  for(let i = 0; i < topN; i++) top += sorted[i];
  const mean = n/(B*B);
  return (top/topN)/mean;
}

function build(seed){
  let best = null;
  for(let attempt = 0; attempt < 8; attempt++){
    const aseed = (seed + attempt*7919)|0;
    const F = buildField(aseed);
    const chk = advect(aseed, F, NCHECK);
    const c = densityContrast(chk);
    if(!best || c > best.contrast) best = { F, contrast:c, aseed };
    if(c >= 3.0) break;
  }
  const dots = advect(best.aseed, best.F, N, true);
  const rand = mulberry32((best.aseed ^ 0x27d4eb2d)|0);
  const rr = new Float32Array(N), aa = new Float32Array(N), cc = new Uint8Array(N);
  const tones = 4;
  for(let k = 0; k < N; k++){
    const dv = sampleDiv(best.F, dots.xs[k], dots.ys[k]);
    const t = Math.min(1, Math.max(0, -dv / best.F.maxNeg));
    rr[k] = RMIN + (RMAX-RMIN)*Math.pow(t, 0.8);
    const cn = Math.min(1, dots.curv[k]/18);
    aa[k] = 0.34 + 0.48*cn + rand()*0.12;
    cc[k] = (rand()*tones)|0;
  }
  const order = new Uint32Array(N);
  for(let k = 0; k < N; k++) order[k] = k;
  order.sort((a,b)=>rr[b]-rr[a]);
  window.__contrast = best.contrast;
  return { dots, rr, aa, cc, order, contrast:best.contrast, aseed:best.aseed };
}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9064', 10) || 9064;
let model = null;
let W = 0, H = 0;

const TONES = ['#e3cd9c', '#d9b57e', '#c69a5f', '#ecdcb2'];

function render(){
  const cv = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#141210';
  ctx.fillRect(0, 0, W, H);
  const S = Math.min(W, H), ox = (W-S)/2, oy = (H-S)/2;
  ctx.fillStyle = '#181310';
  ctx.fillRect(ox, oy, S, S);
  const vg = ctx.createRadialGradient(ox+S/2, oy+S/2, S*0.32, ox+S/2, oy+S/2, S*0.74);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(10,6,3,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(ox, oy, S, S);
  const { dots, rr, aa, cc, order } = model;
  const T = dots.T;
  for(let q = 0; q < N; q++){
    const k = order[q];
    ctx.globalAlpha = aa[k];
    ctx.fillStyle = TONES[cc[k]];
    const r = Math.max(0.5, rr[k]*S*0.8);
    const base = k*T;
    for(let t = 0; t < T; t++){
      const px = ox + dots.tx[base+t]*S, py = oy + dots.ty[base+t]*S;
      ctx.fillRect(px - r/2, py - r/2, r, r);
    }
  }
  ctx.globalAlpha = 1;
  window.__ready = true;
}

function resize(){
  [W, H] = viewportWH();
  render();
}

let rT = null;
window.addEventListener('resize', ()=>{ clearTimeout(rT); rT = setTimeout(resize, 150); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', ()=>{ clearTimeout(rT); rT = setTimeout(resize, 150); });
document.getElementById('stage').addEventListener('click', ()=>{
  seed = (Math.random()*1e9)|0;
  history.replaceState(null, '', '?seed='+seed);
  window.__ready = false;
  model = build(seed);
  render();
});

model = build(seed);
resize();
</script>
</body>
</html>
