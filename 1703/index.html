<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Droste Bloom</title>
<style>
html, body { margin: 0; padding: 0; background: #150A13; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#150A13';
var PLATE = '#241019';
var PLATE_LINE = 'rgba(242,165,148,0.45)';
var TITLE_INK = '#F6D9CE';
var HINT_INK = '#E8B7A8';
var K = 0.52;
var LEVELS = 10;
var ZOOM_PERIOD = 24;
var BREATH_PERIOD = 9;
var BREATH_AMP = 0.035;
var FILL = '#E98A7E';
var FILL_ALPHA = 0.15;
var GLOW = '#F6C9A8';
var GLOW_ALPHA = 0.10;
var BODY_ALPHA = 0.12;
var RIM_COLS = ['#F2A594', '#E8A85C', '#C9B8F0', '#F6D9CE'];
var RIM_ALPHA = 0.45;
var IRID = ['#BFE8E0', '#C9B8F0', '#F0D9A0'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* seeded iridescent arc segments around the blob edge */
var rng = mulberry32(1703);
var arcs = [];
var ai;
for (ai = 0; ai < 5; ai++) {
  arcs.push({
    a0: rng() * TAU,
    span: 0.5 + rng() * 0.45,
    col: IRID[ai % IRID.length],
    al: 0.30 + rng() * 0.25
  });
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- organic blob path, radius modulated by fixed harmonics ---- */
function blobPath(cx, cy, r) {
  var seg, th, rr;
  ctx.beginPath();
  for (seg = 0; seg <= 96; seg++) {
    th = seg / 96 * TAU;
    rr = r * (1 + 0.07 * Math.sin(3 * th + 1.3) + 0.045 * Math.sin(5 * th + 4.1) + 0.03 * Math.sin(2 * th + 2.6));
    if (seg === 0) ctx.moveTo(cx + rr * Math.cos(th), cy + rr * Math.sin(th));
    else ctx.lineTo(cx + rr * Math.cos(th), cy + rr * Math.sin(th));
  }
  ctx.closePath();
}
/* ---- alpha of the outermost level: fades to 0 as its rim leaves the blob ---- */
function outerFade(z) {
  var t = Math.pow(K, -z);
  var u = clamp((t - 1) / (1 / K - 1), 0, 1);
  return 1 - smooth(u);
}
var zoomPhase = 0, breathScale = 1;
var focus = { x: 0, y: 0 }, focusTarget = { x: 0, y: 0 };
var dragging = false;
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var cx = st.x + st.w / 2, cy = st.y + st.h / 2;
  var R = Math.min(st.w, st.h) * 0.37 * breathScale;
  var z = zoomPhase;
  var i, s, ox, oy, lvlA, lw;
  /* soft halo behind the blob, layered translucent ellipses */
  var haloCols = ['#E87E8A', '#E8A85C', '#F2A594'];
  var haloAl = [0.045, 0.06, 0.08];
  var haloSc = [1.55, 1.30, 1.08];
  var hi;
  for (hi = 0; hi < 3; hi++) {
    ctx.fillStyle = rgba(haloCols[hi], haloAl[hi]);
    ctx.beginPath();
    ctx.ellipse(cx, cy, R * haloSc[hi], R * haloSc[hi] * 0.96, 0, 0, TAU);
    ctx.fill();
  }
  /* body fill: a stable translucent presence so the edge never empties mid-cycle */
  blobPath(cx, cy, R);
  ctx.fillStyle = rgba(FILL, BODY_ALPHA);
  ctx.fill();
  /* recursion levels, clipped to the blob outline */
  ctx.save();
  blobPath(cx, cy, R);
  ctx.clip();
  for (i = 0; i < LEVELS; i++) {
    s = R * Math.pow(K, i - z);
    if (s < 0.75) continue;
    ox = focus.x * (1 - Math.pow(K, i));
    oy = focus.y * (1 - Math.pow(K, i));
    lvlA = 1;
    if (i === 0) lvlA = outerFade(z);
    if (i === LEVELS - 1) lvlA = z;
    if (lvlA <= 0.001) continue;
    /* warm core glow, a smaller copy of the blob inside this level */
    blobPath(cx + ox, cy + oy, s * 0.55);
    ctx.fillStyle = rgba(GLOW, GLOW_ALPHA * lvlA);
    ctx.fill();
    /* the level itself */
    blobPath(cx + ox, cy + oy, s);
    ctx.fillStyle = rgba(FILL, FILL_ALPHA * lvlA);
    ctx.fill();
    /* rim ring, the visible recursion marker */
    lw = Math.max(0.75, s * 0.012);
    ctx.lineWidth = lw;
    ctx.strokeStyle = rgba(RIM_COLS[i % RIM_COLS.length], RIM_ALPHA * lvlA);
    ctx.stroke();
  }
  ctx.restore();
  /* blob edge: soft peach rim plus seeded iridescent arc hints that hug the edge */
  blobPath(cx, cy, R);
  ctx.lineWidth = Math.max(1.5, R * 0.006);
  ctx.strokeStyle = rgba('#F2A594', 0.55);
  ctx.stroke();
  var a, th, rr;
  for (a = 0; a < arcs.length; a++) {
    ctx.beginPath();
    for (th = arcs[a].a0; th <= arcs[a].a0 + arcs[a].span; th += 0.02) {
      rr = R * (1 + 0.07 * Math.sin(3 * th + 1.3) + 0.045 * Math.sin(5 * th + 4.1) + 0.03 * Math.sin(2 * th + 2.6));
      if (th === arcs[a].a0) ctx.moveTo(cx + rr * Math.cos(th), cy + rr * Math.sin(th));
      else ctx.lineTo(cx + rr * Math.cos(th), cy + rr * Math.sin(th));
    }
    ctx.lineWidth = Math.max(1.5, R * 0.008);
    ctx.strokeStyle = rgba(arcs[a].col, arcs[a].al);
    ctx.stroke();
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Droste Bloom').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Droste Bloom').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 10').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Droste Bloom', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 10', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to move the recursion focus.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function onPointer(x, y, down) {
  var st = stageRect();
  var cx = st.x + st.w / 2, cy = st.y + st.h / 2;
  var R = Math.min(st.w, st.h) * 0.37;
  var dx = x - cx, dy = y - cy;
  var d = Math.sqrt(dx * dx + dy * dy);
  var maxOff = R * 0.30;
  if (d > maxOff) { dx *= maxOff / d; dy *= maxOff / d; }
  focusTarget.x = dx; focusTarget.y = dy;
  if (down) dragging = true;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (zz, fx, fy) {
      zoomPhase = zz; breathScale = 1;
      focus.x = fx || 0; focus.y = fy || 0;
      focusTarget.x = focus.x; focusTarget.y = focus.y;
      draw();
    },
    levelsAt: function (zz) {
      var st = stageRect();
      var R = Math.min(st.w, st.h) * 0.37;
      var n = 0, ii, ss, aa;
      for (ii = 0; ii < LEVELS; ii++) {
        ss = R * Math.pow(K, ii - zz);
        aa = 1;
        if (ii === 0) aa = outerFade(zz);
        if (ii === LEVELS - 1) aa = zz;
        if (ss > 4 && aa > 0.03) n++;
      }
      return n;
    },
    zoomPhase: function () { return zoomPhase; }
  };
}
/* ---- frame one: zoom phase 0, breath at scale 1, focus centered ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) { onPointer(e.clientX, e.clientY, true); });
  canvas.addEventListener('pointermove', function (e) { if (dragging) onPointer(e.clientX, e.clientY, false); });
  canvas.addEventListener('pointerup', function () { dragging = false; focusTarget.x = 0; focusTarget.y = 0; });
  canvas.addEventListener('pointercancel', function () { dragging = false; focusTarget.x = 0; focusTarget.y = 0; });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    var prevTs = null, t0 = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      zoomPhase = (clockT / ZOOM_PERIOD) % 1;
      breathScale = 1 + BREATH_AMP * Math.sin(TAU * clockT / BREATH_PERIOD);
      var rate = dragging ? 5 : 0.3;
      var k2 = 1 - Math.exp(-rate * dt);
      focus.x += (focusTarget.x - focus.x) * k2;
      focus.y += (focusTarget.y - focus.y) * k2;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })(0);
}
</script>
</body>
</html>
