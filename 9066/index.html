<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9066 · Undertow</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#141210; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(236,229,211,0.38); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.7); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another undertow</div>
<script>
'use strict';
// No9066 Undertow.
// A still: concentric ink rings on bone, disturbed by a slow rotating flow
// field. Each ring's radius is wobbled by low-frequency angular lobes whose
// phase rotates with radius (a shear), so neighboring rings lean against
// each other, crowd together and merge into dark interference bands in some
// sectors while staying clean and separate in others. The subject is the
// interference itself: where the field piles rings up, ink gathers into
// bands; where it pulls them apart, the ground breathes through. One
// vermilion ring, placed by the seed in a calm mid-radius sector, is the
// single note that is not teal. Every seed is composition-checked: the build
// measures ring crowding and retries with derived seeds until at least three
// sustained interference zones are present, and the vermilion ring is moved
// to the cleanest mid-radius gap so it sings instead of clashing.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9066', 10) || 9066;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}

const ctx = canvas.getContext('2d');

const BONE = '#f1e9d6';
const TEAL = [31, 78, 74];
const VERM = [179, 64, 42];

const TH = 720; // angular samples per ring

// Compose one candidate piece from a seed. Returns geometry in normalized
// units plus measured interference zones and the vermilion ring index.
function compose(s) {
  const rnd = mulberry32(s);
  const R = 64 + ((rnd() * 24) | 0);          // 64..87 rings
  const cxo = (rnd() - 0.5) * 0.05;           // global center offset, x
  const cyo = (rnd() - 0.5) * 0.05;           // global center offset, y
  const driftAmp = 0.003 + rnd() * 0.006;     // per-ring center drift
  const driftF = 0.4 + rnd() * 0.5;
  const driftP = rnd() * Math.PI * 2;

  // Low-frequency lobe amplitudes (never higher than 5 lobes: water, not static)
  const A2 = 0.060 + rnd() * 0.055;
  const A3 = 0.034 + rnd() * 0.036;
  const A5 = 0.012 + rnd() * 0.018;
  const p2 = rnd() * Math.PI * 2, p3 = rnd() * Math.PI * 2, p5 = rnd() * Math.PI * 2;

  // Rotational shear: lobe pattern turns by this much (radians) across the
  // full radius stack, so rings lean and shear against their neighbors.
  const totalTurn = (0.55 + rnd() * 0.85) * Math.PI * 2 * (rnd() < 0.5 ? 1 : -1);
  const jit = 0.06 + rnd() * 0.07;             // per-ring phase jitter

  // Slightly irregular ring spacing
  const radii = new Float64Array(R);
  const gaps = new Float64Array(R - 1);
  let r = 0.24;
  for (let i = 0; i < R; i++) {
    radii[i] = r;
    if (i < R - 1) {
      gaps[i] = 0.014 + rnd() * 0.010;
      r += gaps[i];
    }
  }

  const j2 = new Float64Array(R), j3 = new Float64Array(R), j5 = new Float64Array(R);
  for (let i = 0; i < R; i++) {
    j2[i] = (rnd() - 0.5) * 2 * jit;
    j3[i] = (rnd() - 0.5) * 2 * jit;
    j5[i] = (rnd() - 0.5) * 2 * jit;
  }

  const meanGap = gaps.reduce((a, b) => a + b, 0) / gaps.length;
  const crowThresh = meanGap * 0.52;

  // Sample every ring: radius(theta)
  const rad = new Float64Array(R * TH);
  const twoPi = Math.PI * 2;
  for (let i = 0; i < R; i++) {
    const ri = radii[i];
    const f = i / (R - 1);
    const q2 = p2 + totalTurn * f + j2[i];
    const q3 = p3 + totalTurn * 1.7 * f + j3[i];
    const q5 = p5 - totalTurn * 0.8 * f + j5[i];
    for (let k = 0; k < TH; k++) {
      const t = (k / TH) * twoPi;
      const m = A2 * Math.sin(2 * t + q2) + A3 * Math.sin(3 * t + q3) + A5 * Math.sin(5 * t + q5);
      rad[i * TH + k] = ri * (1 + m);
    }
  }

  // Measure interference: adjacent-ring gaps below threshold over sustained arcs
  let zones = 0;
  const minRun = 22; // ~11 degrees sustained
  for (let i = 0; i < R - 1; i++) {
    let run = 0;
    for (let k = 0; k < TH; k++) {
      const g = rad[(i + 1) * TH + k] - rad[i * TH + k];
      if (g < crowThresh) { run++; }
      else { if (run >= minRun) zones++; run = 0; }
    }
    if (run >= minRun) zones++;
  }

  // Vermilion ring: mid radius, moved to the cleanest gap so it sings.
  const lo = Math.floor(R * 0.34), hi = Math.floor(R * 0.66);
  let verm = lo + ((rnd() * (hi - lo)) | 0);
  let bestClean = -1;
  for (let v = lo; v <= hi; v++) {
    let clean = 0;
    for (let k = 0; k < TH; k += 4) {
      const g = rad[v * TH + k] - rad[(v - 1) * TH + k];
      if (g > meanGap * 0.72) clean++;
    }
    if (clean > bestClean) { bestClean = clean; verm = v; }
  }
  const cleanVermilion = bestClean / (TH / 4) > 0.55;

  // Max extent for margin fitting (modulation + offsets included)
  let maxExt = 0;
  for (let i = 0; i < R; i++) {
    const dx = cxo + driftAmp * Math.sin(i * driftF + driftP);
    const dy = cyo + driftAmp * Math.cos(i * driftF * 0.8 + driftP * 1.3);
    for (let k = 0; k < TH; k += 2) {
      const rr = rad[i * TH + k];
      const t = (k / TH) * twoPi;
      const x = rr * Math.cos(t) + dx, y = rr * Math.sin(t) + dy;
      const e = Math.hypot(x, y);
      if (e > maxExt) maxExt = e;
    }
  }

  return { R, radii, rad, gaps, meanGap, zones, verm, cleanVermilion,
           cxo, cyo, driftAmp, driftF, driftP, maxExt };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const s = (baseSeed + attempt * 0x9E3779B9) >>> 0;
    const p = compose(s);
    if (!best || p.zones > best.zones) best = p;
    if (p.zones >= 3 && p.cleanVermilion) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Page bg; letterbox the square bone composition
  ctx.fillStyle = '#141210';
  ctx.fillRect(0, 0, w, h);
  const S = Math.min(w, h);
  const ox = (w - S) / 2, oy = (h - S) / 2;
  const cx = ox + S / 2, cy = oy + S / 2;

  ctx.fillStyle = BONE;
  ctx.fillRect(ox, oy, S, S);

  if (!piece) piece = buildPiece(seed);
  const p = piece;
  const margin = S * 0.105;
  const scale = (S / 2 - margin) / p.maxExt;
  const lineW = Math.max(1, S / 950);

  const twoPi = Math.PI * 2;
  const toX = (nx) => cx + nx * scale;
  const toY = (ny) => cy + ny * scale;

  // Teal rings: thin, translucent, so crowded sectors gather into dark bands
  ctx.strokeStyle = 'rgba(' + TEAL[0] + ',' + TEAL[1] + ',' + TEAL[2] + ',0.66)';
  ctx.lineWidth = lineW;
  ctx.lineJoin = 'round';
  for (let i = 0; i < p.R; i++) {
    if (i === p.verm) continue;
    const dx = p.cxo + p.driftAmp * Math.sin(i * p.driftF + p.driftP);
    const dy = p.cyo + p.driftAmp * Math.cos(i * p.driftF * 0.8 + p.driftP * 1.3);
    ctx.beginPath();
    for (let k = 0; k <= TH; k++) {
      const kk = k % TH;
      const rr = p.rad[i * TH + kk];
      const t = (kk / TH) * twoPi;
      const x = toX(rr * Math.cos(t) + dx);
      const y = toY(rr * Math.sin(t) + dy);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  // The single vermilion ring, drawn last so it sits on top
  ctx.strokeStyle = 'rgba(' + VERM[0] + ',' + VERM[1] + ',' + VERM[2] + ',0.96)';
  ctx.lineWidth = lineW * 1.7;
  {
    const i = p.verm;
    const dx = p.cxo + p.driftAmp * Math.sin(i * p.driftF + p.driftP);
    const dy = p.cyo + p.driftAmp * Math.cos(i * p.driftF * 0.8 + p.driftP * 1.3);
    ctx.beginPath();
    for (let k = 0; k <= TH; k++) {
      const kk = k % TH;
      const rr = p.rad[i * TH + kk];
      const t = (kk / TH) * twoPi;
      const x = toX(rr * Math.cos(t) + dx);
      const y = toY(rr * Math.sin(t) + dy);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  // Restrained grain
  const rnd = mulberry32((seed ^ 0x51ab3f) >>> 0);
  const n = 2600;
  for (let g = 0; g < n; g++) {
    const x = ox + rnd() * S, y = oy + rnd() * S;
    if (rnd() < 0.6) {
      ctx.fillStyle = 'rgba(' + TEAL[0] + ',' + TEAL[1] + ',' + TEAL[2] + ',0.055)';
    } else {
      ctx.fillStyle = 'rgba(90,74,52,0.05)';
    }
    ctx.fillRect(x, y, 1, 1);
  }
}

function redraw() {
  piece = buildPiece(seed);
  draw();
}

window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});

draw();
</script>
</body>
</html>
