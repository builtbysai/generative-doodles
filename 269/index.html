<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.269 Bedforms</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#6E4630; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.269 Bedforms (Shupiwe Chongwe). A sediment field of
// ripples in warm clay browns, geology reading as skin,
// organised by one diagonal flow. The field is a slow
// viscoelastic solid: dragging presses dents into it like
// a hand into wet clay; dents relax over about fifteen
// seconds but never fully, a memory layer keeps a fifth
// of each one. A few vessel silhouettes sit half buried
// at the edges. Drag to press the clay.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var MOIST = '#6E4630', DRY = '#A67B52', SHADOW = '#4A2E1E', GREEN = '#4E7A4E', SALT = '#F5F2EA';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var VX0 = 0, VY0 = 0, VX1 = DW, VY1 = DH;
var T = 10, lastNow = -1; // frame one: the seeded dent already partly relaxed

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// ---- flow geometry ---------------------------------------------------------------
// One diagonal direction organises every ripple: crests run
// along u, stacked along the normal n.
var A = 0.42;
var UX = Math.cos(A), UY = Math.sin(A);
var NX = -Math.sin(A), NY = Math.cos(A);

// ---- dents ------------------------------------------------------------------------
// A dent keeps a fifth of its depth forever (the memory
// floor) and relaxes exponentially toward it over ~15s.
var dents = [{ x: 630, y: 628, born: 1, depth: 88, r: 195 }]; // frame one: low centre, age 9s
function dentDepth(d) {
  var age = Math.max(0, T - d.born);
  return d.depth * (0.2 + 0.8 * Math.exp(-age / 4.5));
}
function addDent(x, y) {
  dents.push({ x: x, y: y, born: T, depth: 34, r: 180 });
  if (dents.length > 26) dents.splice(1, 1); // keep the seeded dent, drop the oldest touch
}
var breath = 1;
function displace(x, y, out) {
  var px = 0, py = 0;
  for (var i = 0; i < dents.length; i++) {
    var d = dents[i];
    var dx = x - d.x, dy = y - d.y;
    var d2 = dx * dx + dy * dy;
    if (d2 >= d.r * d.r) continue;
    var dist = Math.sqrt(d2);
    var sg = d.r * 0.46; // a tighter gaussian falloff, so the bend is local and reads
    var f = Math.exp(-d2 / (2 * sg * sg));
    var eff = dentDepth(d) * breath * f;
    px += NX * eff + (dist > 1 ? (dx / dist) * eff * 0.45 * (dist / d.r) : 0);
    py += NY * eff + (dist > 1 ? (dy / dist) * eff * 0.45 * (dist / d.r) : 0);
  }
  out.x = x + px; out.y = y + py;
}

// ---- ripples ------------------------------------------------------------------------
var ripples = [];
(function () {
  var r = rng(26911);
  var off = -534;
  for (var i = 0; i < 110; i++) {
    var gaps = [];
    for (var g = 0; g < 64; g++) gaps.push(r());
    ripples.push({
      off: off, phase: r() * Math.PI * 2, amp: 3.6 + r() * 3.4,
      freq: (Math.PI * 2) / (105 + r() * 60), w: 4.2 + r() * 2.8,
      a: 0.5 + r() * 0.38, gaps: gaps, seed: r() * 10
    });
    off += 12.3 + (r() - 0.5) * 3.4;
  }
})();
// broad tonal patches under the ripples, in the palette only
var patches = [];
(function () {
  var r = rng(26923);
  for (var i = 0; i < 9; i++) patches.push({
    x: r() * DW, y: r() * DH, rx: 190 + r() * 300, ry: 42 + r() * 60,
    dark: r() > 0.5, a: 0.04 + r() * 0.05
  });
})();
// sparse salt flecks
var flecks = [];
(function () {
  var r = rng(26937);
  for (var i = 0; i < 135; i++) flecks.push({ x: r() * DW, y: r() * DH, s: 0.9 + r() * 1.9, a: 0.18 + r() * 0.4 });
})();

var P = { x: 0, y: 0 };
function drawRipples() {
  ctx.lineCap = 'round';
  for (var i = 0; i < ripples.length; i++) {
    var rp = ripples[i];
    ctx.strokeStyle = rgba(i % 2 ? SHADOW : DRY, rp.a);
    ctx.lineWidth = rp.w;
    ctx.beginPath();
    var started = false;
    var gi = 0;
    for (var t = -60; t <= 1600; t += 26, gi++) {
      var wave = Math.sin(t * rp.freq + rp.phase) * rp.amp
               + Math.sin(t * rp.freq * 0.37 + rp.phase * 1.7) * rp.amp * 0.45;
      var bx = NX * (rp.off + wave) + UX * t;
      var by = NY * (rp.off + wave) + UY * t;
      displace(bx, by, P);
      if (rp.gaps[gi % rp.gaps.length] < 0.07) { started = false; continue; } // a break in the crest
      if (!started) { ctx.moveTo(P.x, P.y); started = true; } else ctx.lineTo(P.x, P.y);
    }
    ctx.stroke();
  }
}

// ---- vessels -------------------------------------------------------------------------
function drawVessel(cx, cy, r, moss) {
  var rimY = cy - r * 0.38, rimRx = r * 0.52, rimRy = r * 0.16;
  // body: a dark bulb silhouette
  ctx.fillStyle = rgba(SHADOW, 0.94);
  ctx.beginPath();
  ctx.moveTo(cx - rimRx, rimY);
  ctx.bezierCurveTo(cx - r * 0.98, cy - r * 0.02, cx - r * 0.9, cy + r * 0.42, cx - r * 0.36, cy + r * 0.58);
  ctx.bezierCurveTo(cx - r * 0.12, cy + r * 0.68, cx + r * 0.12, cy + r * 0.68, cx + r * 0.36, cy + r * 0.58);
  ctx.bezierCurveTo(cx + r * 0.9, cy + r * 0.42, cx + r * 0.98, cy - r * 0.02, cx + rimRx, rimY);
  ctx.closePath(); ctx.fill();
  // a dry sediment sheen down one side
  ctx.strokeStyle = rgba(DRY, 0.34);
  ctx.lineWidth = r * 0.07;
  ctx.beginPath();
  ctx.moveTo(cx - rimRx * 0.82, rimY + r * 0.1);
  ctx.bezierCurveTo(cx - r * 0.78, cy + r * 0.14, cx - r * 0.66, cy + r * 0.34, cx - r * 0.34, cy + r * 0.5);
  ctx.stroke();
  // mouth and rim
  ctx.fillStyle = rgba(SHADOW, 1);
  ctx.beginPath(); ctx.ellipse(cx, rimY, rimRx, rimRy, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(MOIST, 0.85);
  ctx.beginPath(); ctx.ellipse(cx, rimY, rimRx * 0.72, rimRy * 0.62, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = rgba(DRY, 0.55);
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.ellipse(cx, rimY, rimRx, rimRy, 0, 0, Math.PI * 2); ctx.stroke();
  if (moss) { // the green lives only here: a thin moss line along this rim
    ctx.strokeStyle = rgba(GREEN, 0.95);
    ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.ellipse(cx, rimY, rimRx * 0.97, rimRy * 0.97, 0, Math.PI * 1.08, Math.PI * 1.82); ctx.stroke();
  }
  // the burial mound: sediment heaped in front of the base
  ctx.fillStyle = rgba(MOIST, 1);
  ctx.beginPath(); ctx.ellipse(cx, cy + r * 0.56, r * 0.84, r * 0.17, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(DRY, 0.16);
  ctx.beginPath(); ctx.ellipse(cx, cy + r * 0.53, r * 0.6, r * 0.10, 0, 0, Math.PI * 2); ctx.fill();
}

function draw() {
  breath = 1 + 0.13 * Math.sin(T * Math.PI * 2 / 40);
  ctx.fillStyle = MOIST;
  ctx.fillRect(-700, -700, DW + 1400, DH + 1400);
  for (var i = 0; i < patches.length; i++) {
    var p = patches[i];
    ctx.fillStyle = rgba(p.dark ? SHADOW : DRY, p.a);
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx, p.ry, A, 0, Math.PI * 2); ctx.fill();
  }
  // the shallow shading of each dent, layered translucency under the ripples
  for (var k = 0; k < dents.length; k++) {
    var dd = dents[k];
    var sh = Math.min(1, dentDepth(dd) / 34);
    ctx.fillStyle = rgba(SHADOW, 0.10 * sh);
    ctx.beginPath(); ctx.arc(dd.x, dd.y, dd.r * 0.62, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(SHADOW, 0.11 * sh);
    ctx.beginPath(); ctx.arc(dd.x, dd.y, dd.r * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(DRY, 0.07 * sh);
    ctx.beginPath(); ctx.arc(dd.x - NX * 14, dd.y - NY * 14, dd.r * 0.30, 0, Math.PI * 2); ctx.fill();
  }
  drawRipples();
  for (var f = 0; f < flecks.length; f++) {
    var fl = flecks[f];
    displace(fl.x, fl.y, P);
    ctx.fillStyle = rgba(SALT, fl.a);
    ctx.fillRect(P.x, P.y, fl.s, fl.s);
  }
  // vessels half buried at the left, right and lower edges of the view
  drawVessel(VX0 + 12, VY0 + (VY1 - VY0) * 0.52, 80, false);
  drawVessel(VX1 - 10, VY0 + (VY1 - VY0) * 0.30, 64, false);
  drawVessel(VX0 + (VX1 - VX0) * 0.70, VY1 - 4, 90, true);
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag: press the clay -----------------------------------------------------------------
var dragging = false, lastDX = 0, lastDY = 0;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
function pressAt(x, y) { addDent(x, y); lastDX = x; lastDY = y; }
canvas.addEventListener('pointerdown', function (e) {
  dragging = true;
  var p = toDesign(e);
  pressAt(p.x, p.y);
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dx = p.x - lastDX, dy = p.y - lastDY;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var steps = Math.floor(dist / 36); // dents throttled by distance along the path
  for (var i = 1; i <= steps; i++) addDent(lastDX + dx * i / (steps + 1), lastDY + dy * i / (steps + 1));
  if (steps > 0) { lastDX = p.x; lastDY = p.y; }
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- frame ----------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = MOIST;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: the ripple field fills the frame edge to edge
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  VX0 = -OX / S; VY0 = -OY / S; VX1 = VX0 + W / S; VY1 = VY0 + H / S;
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
