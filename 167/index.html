    for (j = 0; j < tl.pts.length; j++) {
      p = tl.pts[j];
      var x = ox + p[0] * unit, y = oy + p[1] * unit;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
  ctx.stroke();
  ctx.beginPath();
  for (i = 0; i < tiles.length; i++) {
    if (tiles[i].orange) continue;
    starPath(ox + tiles[i].cx * unit, oy + tiles[i].cy * unit, tiles[i].th);
  }
  ctx.stroke();
  // orange tiles: outline and star, pulsing faintly
  ctx.strokeStyle = 'rgba(255,92,31,' + (0.82 + 0.18 * pulse).toFixed(3) + ')';
  ctx.beginPath();
  for (i = 0; i < tiles.length; i++) {
    var to = tiles[i];
    if (!to.orange) continue;
    for (j = 0; j < to.pts.length; j++) {
      p = to.pts[j];
      var x2 = ox + p[0] * unit, y2 = oy + p[1] * unit;
      if (j === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
    }
    ctx.closePath();
  }
  ctx.stroke();
  ctx.beginPath();
  for (i = 0; i < tiles.length; i++) {
    if (!tiles[i].orange) continue;
    starPath(ox + tiles[i].cx * unit, oy + tiles[i].cy * unit, tiles[i].th);
  }
  ctx.stroke();
  ctx.restore();
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
