<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scallop Trim</title>
<style>
  html, body { margin: 0; padding: 0; background: #0E2A24; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; cursor: grab; }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
(function () {
  'use strict';

  var GROUND = '#0E2A24';
  var LAV = '#B9A8E0';
  var RUST = '#C8431F';
  var SAGE = '#9DC49A';
  var CREAM = '#F4EBD3';

  var BASE_SEED = 48317;
  var currentSeed = BASE_SEED;
  var seedCount = 0;

  var canvas = document.getElementById('piece');
  var ctx = canvas.getContext('2d');

  var viewW = 720;
  var viewH = 720;
  var dpr = 1;
  var isPhone = false;

  var scrollOffset = 0;
  var seedParity = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function rngForIndex(idx, salt) {
    var s = (currentSeed ^ Math.imul((idx + 101) | 0, 2654435761) ^ Math.imul(salt | 0, 974634531)) >>> 0;
    return mulberry32(s);
  }

  function applySeed() {
    var r = mulberry32(currentSeed);
    seedParity = r() < 0.5 ? 0 : 1;
  }

  function detectPhone(w, h) {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
      sw = window.screen.width; sh = window.screen.height;
      return Math.min(sw, sh) < 700;
    }
    return h > w * 1.15;
  }

  function resize() {
    var w = 720, h = 720;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
      dpr = window.devicePixelRatio ? window.devicePixelRatio : 1;
      if (dpr < 1) dpr = 1;
      if (dpr > 2) dpr = 2;
    }
    viewW = Math.max(200, Math.round(w));
    viewH = Math.max(200, Math.round(h));
    isPhone = detectPhone(viewW, viewH);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    draw();
  }

  // Seeded function of scallop index: strict two colour alternation whose
  // starting colour is set by the seed. Consistent for any integer index,
  // positive or negative, so the band revealed by scrolling never changes.
  function scallopColor(idx) {
    var parity = ((idx % 2) + 2) % 2;
    return (parity ^ seedParity) === 0 ? LAV : RUST;
  }
  function oppositeColor(idx) {
    return scallopColor(idx) === LAV ? RUST : LAV;
  }

  // ---- botanical glyph library (parametric, seeded per glyph index) ----
  function glyphLeaf(cx, baseY, hh, r) {
    ctx.strokeStyle = SAGE; ctx.fillStyle = SAGE;
    ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, baseY); ctx.lineTo(cx, baseY - hh); ctx.stroke();
    var pairs = 3;
    for (var i = 0; i < pairs; i++) {
      var t = 0.3 + i * 0.26;
      var y = baseY - hh * t;
      var len = hh * 0.34 * (1 - t * 0.45);
      var ang = 0.72;
      for (var s = -1; s <= 1; s += 2) {
        var ex = cx + s * Math.cos(ang) * len * 0.0 + s * len * 0.82;
        var ey = y - len * 0.52;
        ctx.beginPath();
        ctx.ellipse(cx + s * len * 0.42, y - len * 0.26, len * 0.46, len * 0.19, s * -0.62, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.beginPath(); ctx.arc(cx, baseY - hh - 3, 3.2, 0, Math.PI * 2); ctx.fill();
  }

  function glyphCoral(cx, baseY, hh, r) {
    ctx.strokeStyle = SAGE; ctx.fillStyle = SAGE;
    ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    function branch(x, y, ang, len, depth) {
      if (depth <= 0 || len < 5) {
        ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI * 2); ctx.fill();
        return;
      }
      var ex = x + Math.sin(ang) * len;
      var ey = y - Math.cos(ang) * len;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
      branch(ex, ey, ang - 0.46, len * 0.68, depth - 1);
      branch(ex, ey, ang + 0.42, len * 0.68, depth - 1);
    }
    branch(cx, baseY, (r() - 0.5) * 0.2, hh * 0.42, 3);
  }

  function glyphFern(cx, baseY, hh, r) {
    ctx.strokeStyle = SAGE; ctx.fillStyle = SAGE;
    ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, baseY);
    ctx.quadraticCurveTo(cx + hh * 0.10, baseY - hh * 0.55, cx + hh * 0.22, baseY - hh);
    ctx.stroke();
    for (var i = 0; i < 6; i++) {
      var t = 0.14 + i * 0.14;
      var bx = cx + hh * 0.22 * t * t + hh * 0.06 * t;
      var by = baseY - hh * t;
      var len = hh * 0.30 * (1 - t * 0.55);
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - len, by - len * 0.38); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + len * 0.72, by - len * 0.30); ctx.stroke();
    }
  }

  function glyphBud(cx, baseY, hh, r) {
    ctx.strokeStyle = SAGE; ctx.fillStyle = SAGE;
    ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, baseY); ctx.lineTo(cx, baseY - hh * 0.52); ctx.stroke();
    var cy = baseY - hh * 0.72;
    var pr = hh * 0.20;
    for (var i = 0; i < 5; i++) {
      var a = -Math.PI / 2 + (i - 2) * 0.62;
      ctx.beginPath();
      ctx.ellipse(cx + Math.cos(a) * pr * 0.72, cy + Math.sin(a) * pr * 0.72, pr * 0.52, pr * 0.30, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.arc(cx, cy, 3.0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = SAGE;
    ctx.beginPath();
    ctx.ellipse(cx - pr * 0.48, baseY - hh * 0.28, pr * 0.55, pr * 0.22, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + pr * 0.48, baseY - hh * 0.38, pr * 0.55, pr * 0.22, 0.6, 0, Math.PI * 2); ctx.fill();
  }

  function glyphBlades(cx, baseY, hh, r) {
    ctx.strokeStyle = SAGE;
    ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for (var i = -2; i <= 2; i++) {
      var lean = i * 0.16 + (r() - 0.5) * 0.08;
      var bh = hh * (0.62 + 0.34 * (1 - Math.abs(i) / 3));
      ctx.beginPath();
      ctx.moveTo(cx + i * 6, baseY);
      ctx.quadraticCurveTo(cx + i * 6 + lean * bh * 0.4, baseY - bh * 0.6, cx + i * 6 + lean * bh, baseY - bh);
      ctx.stroke();
    }
    ctx.fillStyle = SAGE;
    ctx.beginPath(); ctx.arc(cx, baseY - hh * 0.30, 2.4, 0, Math.PI * 2); ctx.fill();
  }

  function drawGlyphStrip(stripH) {
    var spacing = isPhone ? 56 : 74;
    var count = Math.ceil(viewW / spacing) + 1;
    var baseY = stripH - 6;
    for (var g = 0; g < count; g++) {
      var r = rngForIndex(g, 7);
      var type = Math.floor(r() * 5);
      var hh = stripH * (0.52 + r() * 0.36);
      var cx = g * spacing + spacing * 0.5 + (r() - 0.5) * 10;
      if (type === 0) glyphLeaf(cx, baseY, hh, r);
      else if (type === 1) glyphCoral(cx, baseY, hh, r);
      else if (type === 2) glyphFern(cx, baseY, hh, r);
      else if (type === 3) glyphBud(cx, baseY, hh, r);
      else glyphBlades(cx, baseY, hh, r);
    }
    // low sage ground line the glyphs peek over
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = SAGE; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, stripH - 0.5); ctx.lineTo(viewW, stripH - 0.5); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // One row of uniform solid semicircles. World position of scallop idx is
  // idx * diam + offset, so screen x = world x - scrollOffset: the colour is
  // always scallopColor(idx), however far the band has been dragged.
  function drawScallopRow(centerY, diam, offset, up, useOpposite, withDots) {
    var r = diam / 2;
    var startIdx = Math.floor((scrollOffset - offset) / diam) - 1;
    var steps = Math.ceil(viewW / diam) + 3;
    for (var k = 0; k < steps; k++) {
      var idx = startIdx + k;
      var cx = idx * diam + offset - scrollOffset + r;
      ctx.fillStyle = useOpposite ? oppositeColor(idx) : scallopColor(idx);
      ctx.beginPath();
      if (up) ctx.arc(cx, centerY, r - 1.5, Math.PI, Math.PI * 2);
      else ctx.arc(cx, centerY, r - 1.5, 0, Math.PI);
      ctx.closePath(); ctx.fill();
      if (withDots) {
        ctx.fillStyle = CREAM;
        ctx.beginPath();
        ctx.arc(cx, centerY + r * 0.55, Math.max(2.2, diam * 0.045), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawBand() {
    var rawSw = Math.min(viewW / (isPhone ? 5 : 11), viewH * 0.14);
    var sw = Math.round(Math.max(52, Math.min(118, rawSw)));
    var mainR = sw / 2;
    var smallD = sw / 2;
    var smallR = smallD / 2;

    var topY = Math.round(viewH * 0.43);
    var rowAY = topY + 3;
    var rowBY = rowAY + mainR;
    var smallBase = rowBY + mainR + smallR;
    var bottomY = Math.round(smallBase + 3);

    // two stacked rows of solid hanging scallops, second row staggered
    drawScallopRow(rowAY, sw, 0, false, false, true);
    drawScallopRow(rowBY, sw, sw / 2, false, false, true);
    // small upward scallops sitting on the lower rule, staggered again
    drawScallopRow(smallBase, smallD, sw / 4, true, true, false);

    // thin cream rules above and below the band
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, topY - 2, viewW, 3);
    ctx.fillRect(0, bottomY, viewW, 3);
  }

  function draw() {
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, viewW, viewH);

    var stripH = Math.round(viewH * 0.20);
    drawGlyphStrip(stripH);
    drawBand();

    ctx.globalAlpha = 0.38;
    ctx.fillStyle = CREAM;
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag', viewW - 14, viewH - 12);
    ctx.globalAlpha = 1;
  }

  function reseed() {
    seedCount += 1;
    currentSeed = (BASE_SEED + Math.imul(seedCount, 7919)) >>> 0;
    applySeed();
    scrollOffset = 0;
    draw();
  }

  // ---- interaction: drag to scroll, double tap to reseed ----
  var dragging = false;
  var lastX = 0;
  var dragMoved = 0;
  var lastTapTime = -10000;
  var lastTapX = 0;
  var lastTapY = 0;

  function posX(e) { return (typeof e.clientX === 'number') ? e.clientX : viewW / 2; }
  function posY(e) { return (typeof e.clientY === 'number') ? e.clientY : viewH / 2; }

  function onDown(e) {
    dragging = true; dragMoved = 0; lastX = posX(e);
  }
  function onMove(e) {
    if (!dragging) return;
    var x = posX(e);
    var dx = x - lastX;
    lastX = x;
    dragMoved += Math.abs(dx);
    scrollOffset -= dx;
    draw();
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var t = (typeof e.timeStamp === 'number') ? e.timeStamp : 0;
    var x = posX(e), y = posY(e);
    if (dragMoved < 6) {
      if (t - lastTapTime < 350 && Math.abs(x - lastTapX) < 32 && Math.abs(y - lastTapY) < 32) {
        lastTapTime = -10000;
        reseed();
        return;
      }
      lastTapTime = t; lastTapX = x; lastTapY = y;
    }
    draw();
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
    canvas.addEventListener('dblclick', function () { reseed(); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }

  applySeed();
  scrollOffset = 0;
  resize();

  function loop() {
    draw();
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
