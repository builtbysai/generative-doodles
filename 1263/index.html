<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tooth or Dare</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #EFEAE0; overflow: hidden; }
  canvas { display: block; background: #EFEAE0; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- viewport (Visual Viewport API, never window.innerWidth alone) ----
  var W = 0, H = 0, SCALE = 1, OX = 0, OY = 0;
  var SW = 1000, SH = 700; // scene space
  function resize() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
    SCALE = Math.min(W / SW, H / SH);
    OX = (W - SW * SCALE) / 2;
    OY = (H - SH * SCALE) / 2;
  }
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  function pin() {
    canvas.style.width = Math.round(W) + 'px';
    canvas.style.height = Math.round(H) + 'px';
  }

  // ---- phone detection (window.screen physical size, aspect fallback) ----
  function isPhone() {
    var s = window.screen;
    var minDim = Math.min(s.width, s.height);
    if (minDim < 700) return true;
    return H > W * 1.15;
  }

  // ---- helpers (node-canvas safe: moveTo before every batched arc) ----
  function dot(x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function ellipse(x, y, rx, ry, color) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function poly(pts, color) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
  function line(x1, y1, x2, y2, color, w) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // ---- state: closed-form functions of recorded events and t ----
  // feeds: {t0, from ('L'|'R'), type, outcome ('success'|'drop'|null), t1}
  var feeds = [];
  var dragIntervals = []; // {start, end|null} in piece time, only during flights
  var dragOpen = null;
  var T0 = 0; // piece clock starts with first frame
  var started = false;
  var startMs = 0;

  function nowSec() {
    if (!started) return 0;
    return (Date.now() - startMs) / 1000;
  }

  var MORSELS = [
    { c: '#7A3B4F', r: 13 }, // berry
    { c: '#6B7A3F', r: 12 }, // olive
    { c: '#C97B2D', r: 14 }, // carrot round
    { c: '#D9B87A', r: 13 }  // bread bit
  ];
  var FLIGHT = 1.8, MOUTH_DUR = 1.4, DROP_DUR = 2.2;
  var WOBBLE0 = 20, WOBBLE_OK = 7;

  function leanAt(t) {
    var l = 0;
    for (var i = 0; i < feeds.length; i++) {
      var f = feeds[i];
      if (f.outcome && t >= f.t1) l += (f.outcome === 'success' ? 1 : -1);
    }
    if (l > 6) l = 6;
    if (l < -2) l = -2;
    return l;
  }

  // total pointer-down time during flights, up to time t (closed form)
  function steadyAt(t) {
    var s = 0;
    for (var i = 0; i < dragIntervals.length; i++) {
      var d = dragIntervals[i];
      var end = (d.end === null) ? t : Math.min(d.end, t);
      if (end > d.start) s += end - d.start;
    }
    return s;
  }

  function activeFlight(t) {
    for (var i = feeds.length - 1; i >= 0; i--) {
      var f = feeds[i];
      if (t >= f.t0 && t < f.t0 + FLIGHT) return f;
    }
    return null;
  }

  function resolvedFeed(t) {
    // most recent feed whose outcome animation is still playing
    for (var i = feeds.length - 1; i >= 0; i--) {
      var f = feeds[i];
      if (f.outcome && t >= f.t1 && t < f.t1 + (f.outcome === 'success' ? MOUTH_DUR : DROP_DUR)) return f;
    }
    return null;
  }

  // figure geometry; lean shifts each figure toward center, tilts head
  function figs(t) {
    var L = leanAt(t);
    var bob = Math.sin(t * 0.8) * 1.5;
    return {
      L: L,
      left: { x: 300 + L * 12, headY: 232 + bob, tilt: L * 0.03, skin: '#E8C9A8', hair: '#3A332A', shirt: '#B0603F', pants: '#5A5A52' },
      right: { x: 700 - L * 12, headY: 232 - bob, tilt: -L * 0.03, skin: '#D9B48F', hair: '#2E2A26', shirt: '#7A8A6A', pants: '#4A4A44' }
    };
  }

  var TABLE_Y = 480, PLATE = { x: 500, y: 462 };

  function drawFigure(f, dir, t) {
    // dir: +1 faces right (left figure), -1 faces left (right figure)
    // All body coordinates are absolute scene coordinates; only the head
    // uses a local transform (translate + tilt), so no outer translate here.
    var x = f.x, hy = f.headY;
    // legs / seated lower body (behind table)
    poly([[x - 52, 560], [x + 52, 560], [x + 40, 470], [x - 40, 470]], f.pants);
    // torso
    poly([[x - 58, 470], [x + 58, 470], [x + 44, 330], [x - 44, 330]], f.shirt);
    // collar paper edge
    poly([[x - 30, 330], [x + 30, 330], [x + 14, 352], [x - 14, 352]], '#EFEAE0');
    // neck joining head to torso (overlaps head bottom so nothing floats)
    poly([[x - 16, 270], [x + 16, 270], [x + 16, 336], [x - 16, 336]], f.skin);
    // arm reaching toward the table center
    var ax = x + dir * 110, ay = 430;
    line(x + dir * 30, 360, ax, ay, f.shirt, 26);
    dot(ax, ay, 13, f.skin);
    // neck + head
    ctx.save();
    ctx.translate(x, hy);
    ctx.rotate(f.tilt * dir);
    // hair cap (flat collage shape)
    poly([[-46, -58], [46, -58], [52, -6], [30, -34], [-10, -22], [-34, -40], [-50, -10]], f.hair);
    ellipse(0, 0, 46, 52, f.skin);
    // hair side sweep redrawn over top of head
    poly([[-46, -52], [46, -52], [50, -14], [26, -38], [-8, -26], [-30, -44], [-48, -16]], f.hair);
    // eye (single dot, profile-ish calm)
    dot(dir * 16, -6, 4, '#2E2A26');
    // brow line
    line(dir * 2, -22, dir * 30, -20, '#2E2A26', 3);
    ctx.restore();
  }

  function drawMouth(f, dir, open) {
    // open: 0 closed .. 1 fully open; cheek retractor stretches with open
    var x = f.x, hy = f.headY;
    var mx = x + dir * 34, my = hy + 26;
    var stretch = open * 14;
    // steel retractor hooks pulling the mouth corners
    line(mx - 12 - stretch, my - 2, mx - 26 - stretch, my - 10, '#9AA0A8', 3);
    line(mx + 12 + stretch, my - 2, mx + 26 + stretch, my - 10, '#9AA0A8', 3);
    dot(mx - 26 - stretch, my - 10, 3, '#9AA0A8');
    dot(mx + 26 + stretch, my - 10, 3, '#9AA0A8');
    if (open > 0.02) {
      ellipse(mx, my + 2, 12 + stretch * 0.5, 3 + open * 12, '#6B3A2E');
    } else {
      line(mx - 12, my, mx + 12, my, '#6B3A2E', 3);
    }
  }

  function drawMorsel(x, y, type, rot) {
    var m = MORSELS[type % MORSELS.length];
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    dot(0, 0, m.r, m.c);
    dot(-m.r * 0.3, -m.r * 0.3, m.r * 0.28, 'rgba(255,255,255,0.35)');
    ctx.restore();
  }

  function draw(t) {
    pin();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#EFEAE0';
    ctx.fillRect(0, 0, W, H);
    ctx.setTransform(SCALE, 0, 0, SCALE, OX, OY);

    var F = figs(t);
    var flight = activeFlight(t);
    var resolved = resolvedFeed(t);

    // floor line
    line(60, 600, 940, 600, '#D8D2C4', 2);

    drawFigure(F.left, 1, t);
    drawFigure(F.right, -1, t);

    // table
    poly([[190, TABLE_Y], [810, TABLE_Y], [810, TABLE_Y + 26], [190, TABLE_Y + 26]], '#8A6B4F');
    line(240, TABLE_Y + 26, 240, 600, '#8A6B4F', 14);
    line(760, TABLE_Y + 26, 760, 600, '#8A6B4F', 14);

    // shared plate with morsels (one fewer per completed feed, restocked each feed cycle visually by count)
    ellipse(PLATE.x, PLATE.y, 74, 20, '#F5F1E8');
    ellipse(PLATE.x, PLATE.y, 58, 14, '#E4DCCB');
    var eaten = feeds.length;
    var plateCount = 4 - (eaten % 4);
    for (var i = 0; i < plateCount; i++) {
      var px = PLATE.x - 36 + i * 24, py = PLATE.y - 4 + (i % 2) * 6;
      if (!flight || feeds[feeds.length - 1] !== flight) drawMorsel(px, py, (eaten + i) % 4, 0);
      else if (i < plateCount - 1) drawMorsel(px, py, (eaten + i) % 4, 0);
    }

    // mouths (receiver mouth opens during success animation)
    var mouthOpenL = 0, mouthOpenR = 0;
    if (resolved && resolved.outcome === 'success') {
      var mt = (t - resolved.t1) / MOUTH_DUR;
      var open = Math.sin(Math.min(mt, 1) * Math.PI);
      if (resolved.from === 'L') mouthOpenR = open; else mouthOpenL = open;
    }
    drawMouth(F.left, 1, mouthOpenL);
    drawMouth(F.right, -1, mouthOpenR);

    // flight morsel
    if (flight) {
      var u = (t - flight.t0) / FLIGHT;
      var fromF = flight.from === 'L' ? F.left : F.right;
      var toF = flight.from === 'L' ? F.right : F.left;
      var toDir = flight.from === 'L' ? -1 : 1;
      var sx = PLATE.x + (flight.from === 'L' ? -40 : 40), sy = PLATE.y - 10;
      var ex = toF.x + toDir * 34, ey = toF.headY + 28;
      var cx = (sx + ex) / 2, cy = Math.min(sy, ey) - 150;
      var bx = (1 - u) * (1 - u) * sx + 2 * (1 - u) * u * cx + u * u * ex;
      var by = (1 - u) * (1 - u) * sy + 2 * (1 - u) * u * cy + u * u * ey;
      var amp = WOBBLE0 * Math.exp(-steadyAt(t) * 1.5);
      var perp = Math.sin(u * Math.PI * 6) * amp;
      drawMorsel(bx + perp * 0.3, by + perp, flight.type, u * 4);
    }

    // drop animation: morsel falls from receiver mouth, splats on the table
    if (resolved && resolved.outcome === 'drop') {
      var dt = t - resolved.t1;
      var toF2 = resolved.from === 'L' ? F.right : F.left;
      var toDir2 = resolved.from === 'L' ? -1 : 1;
      var dx = toF2.x + toDir2 * 34, dy = toF2.headY + 28;
      if (dt < 0.5) {
        var fall = dt / 0.5;
        drawMorsel(dx, dy + fall * fall * 170, resolved.type, fall * 6);
      } else {
        var fade = Math.max(0, 1 - (dt - 0.5) / 1.7);
        ctx.save();
        ctx.globalAlpha = fade;
        ellipse(dx, TABLE_Y + 4, 20, 6, MORSELS[resolved.type % MORSELS.length].c);
        ctx.restore();
      }
    }
  }

  // resolve flights whose time has come (deterministic from event list + t)
  function resolve(t) {
    for (var i = 0; i < feeds.length; i++) {
      var f = feeds[i];
      if (!f.outcome && t >= f.t0 + FLIGHT) {
        var amp = WOBBLE0 * Math.exp(-steadyAt(f.t0 + FLIGHT) * 1.5);
        f.outcome = (amp < WOBBLE_OK) ? 'success' : 'drop';
        f.t1 = f.t0 + FLIGHT;
      }
    }
  }

  function toScene(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    return { x: (clientX - rect.left - OX) / SCALE, y: (clientY - rect.top - OY) / SCALE };
  }

  function hitFigure(p, t) {
    var F = figs(t);
    function near(f) {
      var dx = p.x - f.x, dy = p.y - f.headY;
      if (dx * dx + dy * dy < 90 * 90) return true;
      if (Math.abs(p.x - f.x) < 62 && p.y > 330 && p.y < 560) return true;
      return false;
    }
    if (near(F.left)) return 'L';
    if (near(F.right)) return 'R';
    return null;
  }

  canvas.addEventListener('pointerdown', function (e) {
    var t = nowSec();
    var p = toScene(e.clientX, e.clientY);
    if (!activeFlight(t)) {
      var who = hitFigure(p, t);
      if (who) {
        feeds.push({ t0: t, from: who, type: feeds.length % 4, outcome: null, t1: 0 });
      }
    }
    if (activeFlight(t)) {
      dragOpen = { start: t, end: null };
      dragIntervals.push(dragOpen);
    }
  });
  function endDrag() {
    if (dragOpen) { dragOpen.end = nowSec(); dragOpen = null; }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---- run ----
  function frame() {
    var t = nowSec();
    resolve(t);
    draw(t);
  }
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    startMs = Date.now();
    started = true;
    (function loop() {
      frame();
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
