<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>A Stranger's Cornea</title>
<style>
  html, body { margin: 0; padding: 0; background: #050608; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict: five tones, mixes only between them) ----------
  var EYE_BLACK = [5, 6, 8];        // #050608
  var TEAL      = [30, 78, 90];     // #1E4E5A cornea-teal
  var AMBER     = [201, 150, 46];   // #C9962E iris-amber
  var DUST      = [138, 111, 58];   // #8A6F3A dust-gold
  var SAGE      = [58, 74, 58];     // #3A4A3A field sage
  var BG        = '#050608';

  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function mix(a, b, k) {
    return [Math.round(a[0] + (b[0] - a[0]) * k),
            Math.round(a[1] + (b[1] - a[1]) * k),
            Math.round(a[2] + (b[2] - a[2]) * k)];
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function smootherstep(x) { x = clamp01(x); return x * x * x * (x * (x * 6 - 15) + 10); }

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- layout ----------
  var W = 0, H = 0, DPR = 1, S = 1, isPhone = false;

  function viewSize() {
    var vv = window.visualViewport;
    if (vv && vv.width) return { w: vv.width, h: vv.height };
    return { w: window.innerWidth || 0, h: window.innerHeight || 0 };
  }

  function layout() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var sw = (window.screen && window.screen.width) ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || H > W * 1.15;
    S = Math.min(W, H) || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---------- the landscape: parametric shapes, drawn through a warp ----------
  // Every scene element is a point list; drawScene(warp) plots each point
  // through warp(x, y) -> [x, y]. Identity warp = the plain landscape.
  // A lens warp displaces points radially inside the disc, so the same
  // shapes bend. No offscreen canvas anywhere.

  var rng = mulberry32(856017);

  // Hills: four layers, horizon near 60 percent. Each is a sum of sines.
  var hills = [];
  (function () {
    var base = [0.50, 0.565, 0.635, 0.715];
    var sageMix = [0.30, 0.50, 0.72, 1.0];
    for (var i = 0; i < 4; i++) {
      hills.push({
        baseY: base[i],
        mixK: sageMix[i],
        a1: 0.016 + rng() * 0.014, f1: 1.4 + rng() * 1.2, p1: rng() * 6.283,
        a2: 0.008 + rng() * 0.008, f2: 3.4 + rng() * 2.2, p2: rng() * 6.283
      });
    }
  })();

  function hillY(h, u, t) {
    // u in [0,1] across the width. Breathing: amplitude swells very slowly.
    var br = 1 + 0.05 * Math.sin(t * 0.041 + h.p1);
    return H * h.baseY + H * br * (h.a1 * Math.sin(u * h.f1 * 6.283 + h.p1) +
                                   h.a2 * Math.sin(u * h.f2 * 6.283 + h.p2));
  }

  // Trees: simple forms standing on hill layers 2 and 3 (0-based 1 and 2).
  var trees = [];
  (function () {
    var spots = [
      { u: 0.13, layer: 2, s: 1.0 }, { u: 0.31, layer: 1, s: 0.8 },
      { u: 0.46, layer: 2, s: 1.25 }, { u: 0.58, layer: 1, s: 0.65 },
      { u: 0.70, layer: 2, s: 0.9 }, { u: 0.86, layer: 1, s: 1.05 },
      { u: 0.93, layer: 2, s: 0.7 }
    ];
    for (var i = 0; i < spots.length; i++) {
      trees.push({ u: spots[i].u, layer: spots[i].layer, s: spots[i].s, jit: rng() * 6.283 });
    }
  })();

  // Dust-gold motes: seeded homes, slow closed-form drift.
  var dust = [];
  (function () {
    for (var i = 0; i < 42; i++) {
      dust.push({
        x: rng(), y: 0.06 + rng() * 0.8,
        sp: 0.004 + rng() * 0.010, ph: rng() * 6.283,
        r: 0.8 + rng() * 1.6, a: 0.25 + rng() * 0.5
      });
    }
  })();

  var sunPos = { u: 0.78, v: 0.27, r: 0.052 }; // fraction of S for radius

  function poly(pts, fill) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    if (fill) ctx.fill(); else ctx.stroke();
  }

  // Subdivide a polygon's edges so the lens warp can bend them.
  function subdiv(pts, n) {
    var out = [];
    for (var i = 0; i < pts.length; i++) {
      var a = pts[i], b = pts[(i + 1) % pts.length];
      for (var j = 0; j < n; j++) {
        out.push([a[0] + (b[0] - a[0]) * (j / n), a[1] + (b[1] - a[1]) * (j / n)]);
      }
    }
    return out;
  }

  function treePoints(tr, t, warp) {
    var x = tr.u * W;
    var baseY = hillY(hills[tr.layer], tr.u, t);
    var hgt = S * 0.085 * tr.s;
    var wid = S * 0.016 * tr.s;
    // trunk + two-tier canopy, built in scene space, then warped point-wise.
    var raw = [
      [x - wid * 0.32, baseY], [x - wid * 0.20, baseY - hgt * 0.45],
      [x - wid * 1.55, baseY - hgt * 0.45], [x - wid * 0.85, baseY - hgt * 0.72],
      [x - wid * 1.30, baseY - hgt * 0.72], [x, baseY - hgt * 1.05],
      [x + wid * 1.30, baseY - hgt * 0.72], [x + wid * 0.85, baseY - hgt * 0.72],
      [x + wid * 1.55, baseY - hgt * 0.45], [x + wid * 0.20, baseY - hgt * 0.45],
      [x + wid * 0.32, baseY]
    ];
    var pts = subdiv(raw, 3);
    var out = [];
    for (var i = 0; i < pts.length; i++) out.push(warp(pts[i][0], pts[i][1]));
    return out;
  }

  function drawScene(t, warp) {
    // sky / field ground
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // sun disc (dense polygon so the warp bends it too)
    var sr = sunPos.r * S * (1 + 0.012 * Math.sin(t * 0.05));
    var sunPts = [];
    var SEG = 48;
    for (var i = 0; i < SEG; i++) {
      var a = (i / SEG) * 6.2832;
      sunPts.push(warp(sunPos.u * W + Math.cos(a) * sr, sunPos.v * H + Math.sin(a) * sr));
    }
    ctx.fillStyle = rgba(AMBER, 0.92);
    poly(sunPts, true);

    // hills, back to front, with their trees after each layer
    var step = Math.max(4, Math.round(W / 180));
    for (var li = 0; li < hills.length; li++) {
      var h = hills[li];
      var pts = [];
      for (var x = 0; x <= W; x += step) pts.push(warp(x, hillY(h, x / W, t)));
      pts.push(warp(W, H)); pts.push(warp(0, H));
      ctx.fillStyle = rgba(mix(EYE_BLACK, SAGE, h.mixK), 1);
      poly(pts, true);
      for (var ti = 0; ti < trees.length; ti++) {
        if (trees[ti].layer !== li) continue;
        ctx.fillStyle = rgba(mix(EYE_BLACK, SAGE, Math.min(1, h.mixK + 0.18)), 1);
        poly(treePoints(trees[ti], t, warp), true);
      }
    }

    // dust motes
    for (var di = 0; di < dust.length; di++) {
      var d = dust[di];
      var dx = ((d.x + t * d.sp) % 1) * W;
      var dy = (d.y + 0.018 * Math.sin(t * 0.11 + d.ph)) * H;
      var p = warp(dx, dy);
      ctx.fillStyle = rgba(DUST, d.a * (0.7 + 0.3 * Math.sin(t * 0.23 + d.ph * 2)));
      ctx.beginPath();
      ctx.arc(p[0], p[1], d.r * (S / 720 + 0.4), 0, 6.2832);
      ctx.fill();
    }
  }

  // ---------- the two borrowed lenses ----------
  // Two identities (orbit + warp character). Two slots (what you see and
  // grab). A tap swaps which identity each slot carries; the warp swaps
  // with it, so each loan bends differently.
  var LOAN_SECONDS = 600; // ten minutes

  var identities = [
    { cx: 0.335, cy: 0.46, ax: 0.055, ay: 0.075, px: 97, py: 131, amp: 0.34 },
    { cx: 0.665, cy: 0.40, ax: 0.065, ay: 0.060, px: 149, py: 83, amp: -0.27 }
  ];

  function orbitPos(idn, t) {
    return {
      x: W * (idn.cx + idn.ax * Math.sin(t * 6.2832 / idn.px)),
      y: H * (idn.cy + idn.ay * Math.sin(t * 6.2832 / idn.py + 1.7))
    };
  }

  // ---------- interaction record ----------
  var drags = [];   // { slot, downT, upT, pts:[{t,x,y}], grabDX, grabDY, relDX, relDY }
  var swaps = [];   // effective times of completed tap-swaps
  var pendingTap = null; // { upT, deadline }
  var loanStart = 0;
  var curDrag = null;
  var downInfo = null;

  function identityIndex(slot, t) {
    var n = 0;
    for (var i = 0; i < swaps.length; i++) if (swaps[i] <= t) n++;
    return (slot + n) % 2;
  }

  // Slot state (position + warp amp) under a given swap parity, at time t.
  function slotStateWithParity(slot, parity, t) {
    var idn = identities[(slot + parity) % 2];
    var pos = orbitPos(idn, t);
    // drag influence belongs to the slot (the lens your hand took)
    for (var i = drags.length - 1; i >= 0; i--) {
      var d = drags[i];
      if (d.slot !== slot || t < d.downT) continue;
      if (d.upT === null || t <= d.upT) {
        var pts = d.pts;
        if (t <= pts[0].t) return { x: pts[0].x + d.grabDX, y: pts[0].y + d.grabDY, amp: idn.amp };
        for (var j = pts.length - 1; j >= 0; j--) {
          if (pts[j].t <= t) {
            if (j === pts.length - 1) return { x: pts[j].x + d.grabDX, y: pts[j].y + d.grabDY, amp: idn.amp };
            var a = pts[j], b = pts[j + 1];
            var k = (t - a.t) / Math.max(1e-6, b.t - a.t);
            return { x: a.x + (b.x - a.x) * k + d.grabDX, y: a.y + (b.y - a.y) * k + d.grabDY, amp: idn.amp };
          }
        }
        return { x: pts[0].x + d.grabDX, y: pts[0].y + d.grabDY, amp: idn.amp };
      }
      // released: drift back to the orbit, delta measured at release
      var kk = Math.exp(-(t - d.upT) / 1.4);
      return { x: pos.x + d.relDX * kk, y: pos.y + d.relDY * kk, amp: idn.amp };
    }
    return { x: pos.x, y: pos.y, amp: idn.amp };
  }

  function slotState(slot, t) {
    var n = 0, lastSwap = -1;
    for (var i = 0; i < swaps.length; i++) if (swaps[i] <= t) { n++; lastSwap = swaps[i]; }
    var parity = n % 2;
    var cur = slotStateWithParity(slot, parity, t);
    // ease across the most recent swap for 0.8 s (the blink)
    if (lastSwap >= 0 && t - lastSwap < 0.8) {
      var before = slotStateWithParity(slot, (parity + 1) % 2, t);
      var k = smootherstep((t - lastSwap) / 0.8);
      return {
        x: before.x + (cur.x - before.x) * k,
        y: before.y + (cur.y - before.y) * k,
        amp: before.amp + (cur.amp - before.amp) * k
      };
    }
    return cur;
  }

  function lensRadius() { return S * (isPhone ? 0.185 : 0.165); }

  function loanAlpha(t) {
    var age = t - loanStart;
    if (age <= LOAN_SECONDS - 60) return 1;
    if (age >= LOAN_SECONDS) return 0;
    return 1 - smootherstep((age - (LOAN_SECONDS - 60)) / 60);
  }

  function makeWarp(cx, cy, r, amp) {
    return function (x, y) {
      var dx = x - cx, dy = y - cy;
      var d2 = (dx * dx + dy * dy) / (r * r);
      if (d2 >= 1 || amp === 0) return [x, y];
      var s = 1 + amp * (1 - d2);
      return [cx + dx * s, cy + dy * s];
    };
  }

  function identityWarp(x, y) { return [x, y]; }

  // ---------- draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    drawScene(t, identityWarp);

    var r = lensRadius();
    var la = loanAlpha(t);
    var age = t - loanStart;
    var loanK = Math.min(1, Math.max(0, age / LOAN_SECONDS));

    for (var slot = 0; slot < 2; slot++) {
      if (la <= 0.003) break;
      var st = slotState(slot, t);
      var warp = makeWarp(st.x, st.y, r, st.amp * la);
      ctx.save();
      ctx.beginPath();
      ctx.arc(st.x, st.y, r, 0, 6.2832);
      ctx.clip();
      ctx.globalAlpha = la;
      drawScene(t, warp);
      // the cornea's own faint teal body
      ctx.fillStyle = rgba(TEAL, 0.10);
      ctx.fillRect(st.x - r, st.y - r, r * 2, r * 2);
      ctx.restore();

      // soft edge: two flat rings instead of a blur
      ctx.strokeStyle = rgba(TEAL, 0.28 * la);
      ctx.lineWidth = Math.max(1, S * 0.006);
      ctx.beginPath(); ctx.arc(st.x, st.y, r * 0.985, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = rgba(TEAL, 0.65 * la);
      ctx.lineWidth = Math.max(1, S * 0.0035);
      ctx.beginPath(); ctx.arc(st.x, st.y, r, 0, 6.2832); ctx.stroke();

      // the loan ring: thins as the loan runs down
      var ringW = (S * 0.0045) * (1 - loanK * 0.82);
      if (ringW > 0.15) {
        ctx.strokeStyle = rgba(DUST, (0.55 - loanK * 0.22) * la);
        ctx.lineWidth = ringW;
        ctx.beginPath();
        ctx.arc(st.x, st.y, r + S * 0.018 + ringW, 0, 6.2832);
        ctx.stroke();
      }
    }
  }

  // ---------- time ----------
  function nowSec() { return performance.now() / 1000; }
  var T0 = nowSec();
  function tick() {
    var t = nowSec() - T0;
    // commit a pending tap-swap once its deadline passes without a second tap
    if (pendingTap && t >= pendingTap.deadline) { swaps.push(pendingTap.deadline); pendingTap = null; }
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
  }

  // ---------- pointer handling ----------
  function evtPos(e) {
    var rct = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: cx - rct.left, y: cy - rct.top };
  }

  function nearestSlot(p, t) {
    var best = 0, bd = Infinity;
    for (var s = 0; s < 2; s++) {
      var st = slotState(s, t);
      var dx = p.x - st.x, dy = p.y - st.y;
      var d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = s; }
    }
    return best;
  }

  function onDown(e) {
    var t = nowSec() - T0;
    var p = evtPos(e);
    // a second quick down after a tap = double-tap: new loan, no swap
    if (pendingTap && t - pendingTap.upT < 0.35) {
      // remove the two micro-drags (this down's predecessor tap's drag too)
      drags = drags.filter(function (d) { return d.downT < pendingTap.downT - 0.001 || d.downT > pendingTap.upT; });
      pendingTap = null;
      loanStart = t;
      downInfo = { t: t, x: p.x, y: p.y, dbl: true };
      curDrag = null;
      return;
    }
    if (pendingTap && t >= pendingTap.deadline) { swaps.push(pendingTap.deadline); pendingTap = null; }
    var slot = nearestSlot(p, t);
    var st = slotState(slot, t);
    curDrag = { slot: slot, downT: t, upT: null, pts: [{ t: t, x: p.x, y: p.y }], grabDX: st.x - p.x, grabDY: st.y - p.y, relDX: 0, relDY: 0 };
    drags.push(curDrag);
    downInfo = { t: t, x: p.x, y: p.y, dbl: false };
    if (e.preventDefault) e.preventDefault();
  }

  function onMove(e) {
    if (!curDrag) return;
    var t = nowSec() - T0;
    var p = evtPos(e);
    var last = curDrag.pts[curDrag.pts.length - 1];
    if (Math.abs(p.x - last.x) + Math.abs(p.y - last.y) < 1.5) return;
    curDrag.pts.push({ t: t, x: p.x, y: p.y });
    if (e.preventDefault) e.preventDefault();
  }

  function onUp(e) {
    var t = nowSec() - T0;
    if (pendingTap && t >= pendingTap.deadline) { swaps.push(pendingTap.deadline); pendingTap = null; }
    if (curDrag) {
      curDrag.upT = t;
      var end = curDrag.pts[curDrag.pts.length - 1];
      var idn = identities[identityIndex(curDrag.slot, t)];
      var orb = orbitPos(idn, t);
      curDrag.relDX = (end.x + curDrag.grabDX) - orb.x;
      curDrag.relDY = (end.y + curDrag.grabDY) - orb.y;
      // tap? short and nearly still
      var moved = 0;
      for (var i = 1; i < curDrag.pts.length; i++) {
        moved += Math.abs(curDrag.pts[i].x - curDrag.pts[i - 1].x) + Math.abs(curDrag.pts[i].y - curDrag.pts[i - 1].y);
      }
      if (t - curDrag.downT < 0.3 && moved < 12) {
        pendingTap = { upT: t, downT: curDrag.downT, deadline: t + 0.35 };
      }
      curDrag = null;
    }
    if (e && e.preventDefault) e.preventDefault();
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', function () {}, { passive: true });
  }
  function onResize() { layout(); draw(nowSec() - T0); }
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', onResize);
  if (window.addEventListener) window.addEventListener('resize', onResize);

  layout();
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
})();
</script>
</body>
</html>
