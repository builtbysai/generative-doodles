<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№856 Mismatch Engine</title>
<style>
  html, body { margin: 0; padding: 0; background: #26304e; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №856 Mismatch Engine, CK2 / PP1256, study #262 colton-kempf.
  // One sound hovers between two versions of the same figure and
  // can never quite land on either.
  //
  // Split frame, two procedural panels. Left: tidal flats at dusk,
  // a lone figure waving, slow tide shimmer, rose and dusk blue.
  // Right: a grey street memorial, the same figure at the same
  // scale among candles and flowers, crowd suggested as soft dark
  // shapes. Both panels loop on closed-form cycles but out of
  // phase. A thin vertical hairline, the audio cursor, slides
  // between the panels. DRAG horizontally shifts the offset
  // between image and sound. Near-alignment feels tender; wide
  // offset feels haunted. The offset never reaches perfect sync:
  // the phase difference clamps to a small nonzero minimum.
  // Audio is visual-only in this gallery (no real WebAudio; the
  // cursor IS the sound), per the Franke audio rule.
  var GROUND = '#26304e'; // page ground, the dusk blue

  // Fixed-phase first frame: FIRST_T = 15 s into a 120 s cycle.
  // Wave, flicker, tide and the cursor's loop drift are all
  // closed-form functions of t, so frame one is deterministic.
  // Drag adds an offset; on release it eases back to the loop.
  var FIRST_T = 15;
  var CYCLE = 120;
  var WAVE_PERIOD = 6; // figure's wave cycle, seconds
  var SEED = 856;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: dusk blue and rose against grey street tones.
  var DUSK_TOP = [38, 48, 78];
  var DUSK_MID = [74, 82, 122];
  var ROSE_HORIZON = [214, 138, 122];
  var ROSE_LIGHT = [232, 168, 150];
  var FLAT_WET = [140, 120, 130];
  var FLAT_WATER = [92, 104, 138];
  var SHIMMER = [238, 196, 176];
  var FIGURE_DUSK = [26, 28, 44];
  var FIGURE_STREET = [58, 58, 64];
  var FIGURE_GLOW = [214, 138, 122];
  var WALL_TOP = [88, 88, 94];
  var WALL_LOW = [112, 110, 114];
  var PAVE = [70, 70, 74];
  var PAVE_DARK = [56, 56, 60];
  var CROWD = [44, 44, 48];
  var CANDLE_WAX = [232, 222, 200];
  var FLAME = [252, 196, 110];
  var FLAME_GLOW = [250, 180, 90];
  var FLOWER_ROSE = [198, 110, 122];
  var FLOWER_PALE = [220, 160, 150];
  var CURSOR = [246, 226, 214];
  var CAPTION = [238, 228, 222];
  var HINT = [238, 228, 222];
  var VEIL_GREY = [128, 128, 132];
  var WARM_TINT = [232, 165, 143];
  var DIVIDER = [240, 230, 220];

  // ---- Fixed tide table: 6 shimmer lines on the flats --------------
  var tideRng = mulberry32(SEED * 13 + 5);
  var TIDE = [];
  var ti;
  for (ti = 0; ti < 6; ti++) {
    TIDE.push({
      y: 0.64 + ti * 0.055,
      ph: tideRng() * Math.PI * 2,
      len: 0.30 + tideRng() * 0.55,
      cx: 0.08 + tideRng() * 0.30
    });
  }

  // ---- Fixed candle table: 7 candles at the memorial ---------------
  var candleRng = mulberry32(SEED * 29 + 11);
  var CANDLES = [];
  var ci;
  for (ci = 0; ci < 7; ci++) {
    CANDLES.push({
      x: 0.565 + ci * 0.058 + (candleRng() - 0.5) * 0.02,
      y: 0.845 + (candleRng() - 0.5) * 0.02,
      h: 0.028 + candleRng() * 0.022,
      ph: candleRng() * Math.PI * 2
    });
  }

  // ---- Fixed crowd table: 4 soft dark shapes behind the figure -----
  var crowdRng = mulberry32(SEED * 7 + 3);
  var CROWD_SHAPES = [];
  var cr;
  for (cr = 0; cr < 4; cr++) {
    CROWD_SHAPES.push({
      x: 0.58 + cr * 0.09 + (crowdRng() - 0.5) * 0.03,
      w: 0.022 + crowdRng() * 0.012,
      h: 0.09 + crowdRng() * 0.04,
      ph: crowdRng() * Math.PI * 2
    });
  }

  // ---- Fixed flower clusters near the candles -----------------------
  var flowerRng = mulberry32(SEED * 41 + 7);
  var FLOWERS = [];
  var fi;
  for (fi = 0; fi < 3; fi++) {
    FLOWERS.push({
      x: 0.60 + fi * 0.13 + (flowerRng() - 0.5) * 0.04,
      y: 0.885 + (flowerRng() - 0.5) * 0.015,
      n: 4 + Math.floor(flowerRng() * 3),
      ph: flowerRng() * Math.PI * 2
    });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function X(f) { return f * W; }
  function Y(f) { return f * H; }

  // ---- Offset model: the sound drifting between the panels ----------
  // Loop drift: the sound's resting offset wanders slowly over the
  // 120 s cycle. Drag adds to it; release eases back to the loop.
  var dragX = 0; // in offset units, [-1, 1]
  var dragging = false;
  function loopOff(t) {
    return 0.30 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE + 1.2);
  }
  function offset(t) {
    return clamp(loopOff(t) + dragX, -1, 1);
  }
  // Phase difference between the two panels, in wave cycles.
  // Never zero: the sound never lands in perfect sync.
  function phaseDiff(t) {
    return clamp(Math.abs(offset(t)), 0.06, 1) * 0.5;
  }
  // Time shift applied to the right panel, in seconds of wave time.
  function tShift(t) {
    return phaseDiff(t) * WAVE_PERIOD;
  }
  function cursorX(t) {
    return clamp(0.5 + 0.38 * offset(t), 0.06, 0.94);
  }
  // The panel the sound has left behind: sound drifting right
  // leaves the left panel behind, and vice versa.
  function veil(t) {
    var o = offset(t);
    var side = o > 0 ? 'left' : (o < 0 ? 'right' : 'none');
    return { side: side, alpha: a4(0.42 * Math.abs(o)) };
  }
  // Faint warm tint when the offset is near zero: almost right.
  function warmAlpha(t) {
    var o = Math.abs(offset(t));
    return o < 0.18 ? a4(0.10 * (1 - o / 0.18)) : 0;
  }

  // ---- The figure: abstract silhouette, same scale in both panels --
  // phaseShiftSeconds shifts this figure's wave out of phase.
  // No face, no detail: head, torso, legs, one waving arm.
  function drawFigure(cx, groundY, h, t, shiftS, body) {
    var w = 2 * Math.PI * (t - FIRST_T - shiftS) / WAVE_PERIOD;
    var theta = 0.75 + 0.42 * Math.sin(w); // waving arm angle from vertical
    var headR = h * 0.085;
    var headY = groundY - h * 0.88;
    ctx.fillStyle = rgb(body);
    ctx.strokeStyle = rgb(body);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Head.
    ctx.beginPath();
    ctx.moveTo(cx + headR, headY);
    ctx.arc(cx, headY, headR, 0, Math.PI * 2);
    ctx.fill();
    // Torso: shoulders to hips.
    ctx.beginPath();
    ctx.moveTo(cx - h * 0.075, groundY - h * 0.70);
    ctx.quadraticCurveTo(cx - h * 0.085, groundY - h * 0.52, cx - h * 0.06, groundY - h * 0.38);
    ctx.lineTo(cx + h * 0.06, groundY - h * 0.38);
    ctx.quadraticCurveTo(cx + h * 0.085, groundY - h * 0.52, cx + h * 0.075, groundY - h * 0.70);
    ctx.closePath();
    ctx.fill();
    // Legs, slight stance.
    ctx.lineWidth = Math.max(2, h * 0.042);
    ctx.beginPath();
    ctx.moveTo(cx - h * 0.03, groundY - h * 0.38);
    ctx.lineTo(cx - h * 0.055, groundY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + h * 0.03, groundY - h * 0.38);
    ctx.lineTo(cx + h * 0.065, groundY);
    ctx.stroke();
    // Resting arm, down and slightly out.
    ctx.beginPath();
    ctx.moveTo(cx - h * 0.07, groundY - h * 0.68);
    ctx.lineTo(cx - h * 0.115, groundY - h * 0.44);
    ctx.stroke();
    // Waving arm: raised to the side, oscillating with the wave.
    var shX = cx + h * 0.07, shY = groundY - h * 0.68;
    var armL = h * 0.34;
    var handX = shX + Math.sin(theta) * armL;
    var handY = shY - Math.cos(theta) * armL;
    ctx.beginPath();
    ctx.moveTo(shX, shY);
    ctx.lineTo(handX, handY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(handX + headR * 0.45, handY);
    ctx.arc(handX, handY, headR * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }
  function waveAngle(t, shiftS) {
    return 0.75 + 0.42 * Math.sin(2 * Math.PI * (t - FIRST_T - shiftS) / WAVE_PERIOD);
  }

  // ---- Left panel: tidal flats at dusk -------------------------------
  function drawLeft(t) {
    var x0 = 0, x1 = W / 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x0, 0, x1 - x0, H);
    ctx.clip();
    // Sky: dusk blue down to a rose horizon.
    var sky = ctx.createLinearGradient(0, 0, 0, Y(0.60));
    sky.addColorStop(0, rgb(DUSK_TOP));
    sky.addColorStop(0.55, rgb(DUSK_MID));
    sky.addColorStop(1, rgb(ROSE_HORIZON));
    ctx.fillStyle = sky;
    ctx.fillRect(x0, 0, x1 - x0, Y(0.60));
    // Horizon glow band.
    var hg = ctx.createLinearGradient(0, Y(0.52), 0, Y(0.64));
    hg.addColorStop(0, rgba(ROSE_LIGHT, 0));
    hg.addColorStop(0.5, rgba(ROSE_LIGHT, a4(0.35)));
    hg.addColorStop(1, rgba(ROSE_LIGHT, 0));
    ctx.fillStyle = hg;
    ctx.fillRect(x0, Y(0.52), x1 - x0, Y(0.12));
    // Flats: wet rose-grey sand down to dark water.
    var flats = ctx.createLinearGradient(0, Y(0.60), 0, H);
    flats.addColorStop(0, rgb(FLAT_WET));
    flats.addColorStop(1, rgb(FLAT_WATER));
    ctx.fillStyle = flats;
    ctx.fillRect(x0, Y(0.60), x1 - x0, H - Y(0.60));
    // Tide shimmer: slow horizontal lines drifting on the flats.
    var i, s, a, dx;
    for (i = 0; i < TIDE.length; i++) {
      s = TIDE[i];
      a = 0.10 + 0.14 * (0.5 + 0.5 * Math.sin(2 * Math.PI * (t - FIRST_T) / 9 + s.ph));
      dx = X(0.02) * Math.sin(2 * Math.PI * (t - FIRST_T) / 23 + s.ph);
      ctx.strokeStyle = rgba(SHIMMER, a4(a));
      ctx.lineWidth = Math.max(1, H * 0.002);
      ctx.beginPath();
      ctx.moveTo(X(s.cx) + dx, Y(s.y));
      ctx.lineTo(X(s.cx + s.len) + dx, Y(s.y));
      ctx.stroke();
    }
    // Soft rose glow behind the figure, like low sun on the flats.
    var fg = ctx.createRadialGradient(X(0.25), Y(0.72), 0, X(0.25), Y(0.72), W * 0.16);
    fg.addColorStop(0, rgba(FIGURE_GLOW, a4(0.20)));
    fg.addColorStop(1, rgba(FIGURE_GLOW, 0));
    ctx.fillStyle = fg;
    ctx.fillRect(X(0.09), Y(0.56), W * 0.32, H * 0.32);
    // Figure on the flats, waving on the loop's own phase.
    var figH = H * 0.24, figX = X(0.25), figY = Y(0.80);
    drawFigure(figX, figY, figH, t, 0, FIGURE_DUSK);
    // Reflection in the wet flats, wobbling with the tide.
    ctx.save();
    ctx.globalAlpha = a4(0.13);
    var wob = X(0.004) * Math.sin(2 * Math.PI * (t - FIRST_T) / 7 + 0.8);
    ctx.translate(figX + wob, figY);
    ctx.scale(1, -0.5);
    ctx.translate(-figX, -figY);
    drawFigure(figX, figY, figH, t, 0, FIGURE_DUSK);
    ctx.restore();
    ctx.restore();
  }

  // ---- Right panel: grey street memorial -----------------------------
  function drawRight(t) {
    var x0 = W / 2, x1 = W;
    var shift = tShift(t);
    ctx.save();
    ctx.beginPath();
    ctx.rect(x0, 0, x1 - x0, H);
    ctx.clip();
    // Wall above, pavement below.
    var wall = ctx.createLinearGradient(0, 0, 0, Y(0.55));
    wall.addColorStop(0, rgb(WALL_TOP));
    wall.addColorStop(1, rgb(WALL_LOW));
    ctx.fillStyle = wall;
    ctx.fillRect(x0, 0, x1 - x0, Y(0.55));
    var pave = ctx.createLinearGradient(0, Y(0.55), 0, H);
    pave.addColorStop(0, rgb(PAVE));
    pave.addColorStop(1, rgb(PAVE_DARK));
    ctx.fillStyle = pave;
    ctx.fillRect(x0, Y(0.55), x1 - x0, H - Y(0.55));
    // Faint streetlight glow, top right.
    var lg = ctx.createRadialGradient(X(0.88), Y(0.10), 0, X(0.88), Y(0.10), W * 0.22);
    lg.addColorStop(0, rgba([200, 200, 210], a4(0.10)));
    lg.addColorStop(1, rgba([200, 200, 210], 0));
    ctx.fillStyle = lg;
    ctx.fillRect(x0, 0, x1 - x0, Y(0.32));
    // Crowd: soft dark head-and-shoulders silhouettes standing on
    // the pavement behind the figure, swaying slowly on the right
    // panel's shifted phase.
    var i, c;
    for (i = 0; i < CROWD_SHAPES.length; i++) {
      c = CROWD_SHAPES[i];
      var sway = X(0.006) * Math.sin(2 * Math.PI * (t - FIRST_T - shift) / 11 + c.ph);
      var px = X(c.x) + sway;
      ctx.fillStyle = rgba(CROWD, a4(0.38));
      // Shoulders: a low dome rising from the pavement.
      ctx.beginPath();
      ctx.moveTo(px + X(c.w), Y(0.68));
      ctx.ellipse(px, Y(0.68) - Y(c.h) / 2, X(c.w), Y(c.h) / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      // Head above the shoulders, touching the shoulder top.
      ctx.beginPath();
      ctx.moveTo(px + W * 0.012, Y(0.68) - Y(c.h) - H * 0.006);
      ctx.arc(px, Y(0.68) - Y(c.h) - H * 0.006, W * 0.012, 0, Math.PI * 2);
      ctx.fill();
    }
    // The same figure, same scale, waving out of phase.
    var figH = H * 0.24, figX = X(0.75), figY = Y(0.80);
    drawFigure(figX, figY, figH, t, shift, FIGURE_STREET);
    // Candles: warm glows flickering on the shifted phase.
    for (i = 0; i < CANDLES.length; i++) {
      var cd = CANDLES[i];
      var flick = 0.55 + 0.30 * Math.sin(2 * Math.PI * (t - FIRST_T - shift) / 3.7 + cd.ph)
        + 0.15 * Math.sin(2 * Math.PI * (t - FIRST_T - shift) / 1.9 + cd.ph * 2.7);
      flick = clamp(flick, 0.25, 1);
      var fx = X(cd.x), fy = Y(cd.y), fh = H * cd.h;
      var glow = ctx.createRadialGradient(fx, fy - fh, 0, fx, fy - fh, W * 0.035);
      glow.addColorStop(0, rgba(FLAME_GLOW, a4(0.55 * flick)));
      glow.addColorStop(1, rgba(FLAME_GLOW, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(fx - W * 0.035, fy - fh - W * 0.035, W * 0.07, W * 0.07);
      ctx.fillStyle = rgb(CANDLE_WAX);
      ctx.fillRect(fx - W * 0.004, fy - fh * 0.55, W * 0.008, fh * 0.55);
      ctx.fillStyle = rgba(FLAME, a4(flick));
      ctx.beginPath();
      ctx.moveTo(fx + W * 0.004, fy - fh);
      ctx.ellipse(fx, fy - fh - H * 0.006, W * 0.004, H * 0.007, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // Flowers: small rose clusters at the base of the memorial.
    for (i = 0; i < FLOWERS.length; i++) {
      var fl = FLOWERS[i];
      var j;
      for (j = 0; j < fl.n; j++) {
        var ang = fl.ph + j * 2.4;
        var px = X(fl.x) + Math.cos(ang) * W * 0.012;
        var py = Y(fl.y) + Math.sin(ang) * H * 0.006;
        ctx.fillStyle = rgb(j % 2 === 0 ? FLOWER_ROSE : FLOWER_PALE);
        ctx.beginPath();
        ctx.moveTo(px + W * 0.004, py);
        ctx.arc(px, py, W * 0.004, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // ---- Divider, veils, warm tint, cursor -----------------------------
  function drawDivider() {
    ctx.fillStyle = rgba(DIVIDER, a4(0.45));
    ctx.fillRect(W / 2 - 0.5, 0, 1, H);
  }
  function drawVeils(t) {
    var v = veil(t);
    if (v.side === 'none' || v.alpha < 0.01) { return; }
    var x0 = v.side === 'left' ? 0 : W / 2;
    // Grey veil desaturates and softens the left-behind panel.
    ctx.fillStyle = rgba(VEIL_GREY, a4(v.alpha));
    ctx.fillRect(x0, 0, W / 2, H);
    // Softened edges: layered translucent strokes along the
    // panel's outer edge, suggesting blur.
    var eg = ctx.createLinearGradient(x0, 0, x0 + W * 0.05, 0);
    eg.addColorStop(0, rgba(VEIL_GREY, a4(v.alpha * 0.6)));
    eg.addColorStop(1, rgba(VEIL_GREY, 0));
    ctx.fillStyle = eg;
    ctx.fillRect(x0, 0, W * 0.05, H);
    var eg2 = ctx.createLinearGradient(x0 + W / 2, 0, x0 + W * 0.45, 0);
    eg2.addColorStop(0, rgba(VEIL_GREY, a4(v.alpha * 0.6)));
    eg2.addColorStop(1, rgba(VEIL_GREY, 0));
    ctx.fillStyle = eg2;
    ctx.fillRect(x0 + W * 0.45, 0, W * 0.05, H);
  }
  function drawCursor(t) {
    var cx = X(cursorX(t));
    ctx.strokeStyle = rgba(CURSOR, a4(0.9));
    ctx.lineWidth = Math.max(1.2, W * 0.0015);
    ctx.beginPath();
    ctx.moveTo(cx, 0);
    ctx.lineTo(cx, H);
    ctx.stroke();
    // Small head on the hairline at the horizon line.
    ctx.fillStyle = rgba(CURSOR, a4(0.95));
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.006, Y(0.60));
    ctx.arc(cx, Y(0.60), W * 0.006, 0, Math.PI * 2);
    ctx.fill();
    // Short ticks at the top and bottom ends.
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.008, Y(0.02));
    ctx.lineTo(cx + W * 0.008, Y(0.02));
    ctx.moveTo(cx - W * 0.008, H - Y(0.02));
    ctx.lineTo(cx + W * 0.008, H - Y(0.02));
    ctx.stroke();
  }

  // ---- Caption and hint, in the template's place ----------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.9));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№856 · Mismatch Engine', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CAPTION, a4(0.65));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 16', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(HINT, a4(0.9));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to shift the sound.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawLeft(t);
    drawRight(t);
    drawDivider();
    drawVeils(t);
    var wa = warmAlpha(t);
    if (wa > 0) {
      ctx.fillStyle = rgba(WARM_TINT, a4(wa));
      ctx.fillRect(0, 0, W, H);
    }
    drawCursor(t);
    drawText();
  }

  // ---- Drag: shifts the offset between image and sound ---------------
  // Pointer x maps to a desired cursor position; dragX is the
  // difference from the loop's own offset at that moment.
  function pointerPos(e) {
    var rect = { left: stageX, top: stageY };
    try { rect = canvas.getBoundingClientRect(); } catch (err) {}
    var cx = (e.clientX - rect.left) / (rect.width || W);
    var cy = (e.clientY - rect.top) / (rect.height || H);
    return { x: clamp(cx, 0, 1), y: clamp(cy, 0, 1) };
  }
  function applyDrag(p) {
    var oDesired = clamp((p.x - 0.5) / 0.38, -1, 1);
    dragX = clamp(oDesired - loopOff(lastT), -1, 1);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      try { if (e && typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      dragging = true;
      applyDrag(pointerPos(e));
      draw(lastT);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      applyDrag(pointerPos(e));
      draw(lastT);
    });
    var endDrag = function () {
      if (!dragging) { return; }
      dragging = false;
      // Release: the loop eases dragX back to zero.
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', endDrag);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // Ease step: dragX decays back to zero after release. Called by
  // the animation loop and exposed for QA.
  function easeStep(dt) {
    var k = Math.exp(-dt / 0.9);
    dragX *= k;
  }

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece856 exposes offset, cursor, phase and drag state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece856 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      wavePeriod: WAVE_PERIOD,
      loopOff: function (t) { return loopOff(t); },
      offset: function (t) { return offset(t); },
      phaseDiff: function (t) { return phaseDiff(t); },
      tShift: function (t) { return tShift(t); },
      cursor: function (t) { return cursorX(t); },
      veil: function (t) { return veil(t); },
      warm: function (t) { return warmAlpha(t); },
      waveLeft: function (t) { return waveAngle(t, 0); },
      waveRight: function (t) { return waveAngle(t, tShift(t)); },
      candle: function (i, t) {
        var cd = CANDLES[i];
        var shift = tShift(t);
        var flick = 0.55 + 0.30 * Math.sin(2 * Math.PI * (t - FIRST_T - shift) / 3.7 + cd.ph)
          + 0.15 * Math.sin(2 * Math.PI * (t - FIRST_T - shift) / 1.9 + cd.ph * 2.7);
        return clamp(flick, 0.25, 1);
      },
      drag: function (dx) { dragX = clamp(dx, -1, 1); },
      release: function () { dragging = false; },
      ease: function (dt) { easeStep(dt); },
      dragOffset: function () { return dragX; },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 120 s cycle, closed-form. The drag offset eases
  // back to zero after release. Guarded so node-canvas QA (no
  // requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var prevNow = start;
    requestAnimationFrame(function loop(now) {
      var dt = (now - prevNow) / 1000;
      prevNow = now;
      var t = FIRST_T + (now - start) / 1000;
      if (!dragging) { easeStep(dt); }
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
