<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoke Detector Choir</title>
<style>
  html, body { margin:0; padding:0; background:#101114; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
/* №1185 — Smoke Detector Choir (Jeff Kolar JK2, after Smoke Detector, 2015)
   A 6x4 grid of ceiling smoke detectors seen from below. Each beeps on its
   own misaligned period (3-9s): LED flash + a thin amber ring. Neighbors
   blink faintly in sympathy. Once per 90s loop, detectors (2,2) and (4,3)
   accidentally phase-lock for 12s (shared beeps at loop 52/56/60), then
   drift apart. Dragging a hand-shadow over a detector mutes its next beep.
   Silent by design — the beeps are drawn, not heard.
   Frame one is fixed at piece-time 56.12s: 0.12s after the locked pair's
   shared 56s beep, so both LEDs burn and twin rings are expanding. */

// ---------- seeded RNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

// ---------- constants ----------
var CEIL='#101114', SEAM='#1A1A1E', DISK='#E8E6E0', RIM='#A9A49A', GROOVE='#C9C4B8', DOT='#B4AFA3';
var LED_OFF='#5A1A1A', LED_ON='#FF2B2B', SYMP='#FF7B7B', RING='#FFB300', CAPTION='#6A6A70';
var COLS=6, ROWS=4, N=24, LOOP=90;
var LOCK_A=7, LOCK_B=15;              // (2,2) and (4,3), 1-based col,row -> index row*6+col
var LOCK_T0=52, LOCK_T1=64, SHARED=[52,56,60];
var SEED=1185065;
var T0=56.12;                          // fixed first-frame phase, inside the lock window

// ---------- schedules: period 3-9s in 0.25 steps, phase in [0, period) ----------
var PER=[], PHASE=[];
(function(){
  var rng=mulberry32(SEED);
  for(var i=0;i<N;i++){
    var p=3+0.25*Math.floor(rng()*25);
    PER.push(p); PHASE.push(rng()*p);
  }
})();

// last own-schedule beep at loop-time <= lt, as a loop-time (may be negative:
// a beep late in the previous loop, expressed as loop-time - 90)
function ownLastLoop(i, lt){
  var P=PER[i], ph=PHASE[i];
  if(lt>=ph) return ph+Math.floor((lt-ph)/P)*P;
  var kMax=Math.ceil((LOOP-ph)/P)-1;
  return ph+kMax*P-LOOP;
}
function loopTimeOf(t){ var l=t%LOOP; return l<0?l+LOOP:l; }
function isLockIdx(i){ return i===LOCK_A||i===LOCK_B; }

// ---------- covers (hand-shadow mutes), recorded in absolute piece-time ----------
var covers=[]; // {i, t}
function beepMuted(i, bt){
  for(var k=0;k<covers.length;k++){
    var c=covers[k];
    if(c.i===i && bt>=c.t && bt<=c.t+1.0) return true;
  }
  return false;
}
function coveredDim(i, t){
  for(var k=0;k<covers.length;k++){
    var c=covers[k];
    if(c.i===i && t-c.t>=0 && t-c.t<1.5) return true;
  }
  return false;
}

// largest unmuted beep time <= t for detector i (absolute piece-time)
function lastBeep(i, t){
  var loopBase=Math.floor(t/LOOP)*LOOP, lt=t-loopBase;
  var cands=[], k, b, m, v;
  b=loopBase+ownLastLoop(i, lt);
  for(k=0;k<5;k++){
    var ltb=loopTimeOf(b);
    if(!(isLockIdx(i) && ltb>=LOCK_T0 && ltb<LOCK_T1)) cands.push(b); // own beeps inside the lock window never happened
    b-=PER[i];
  }
  if(isLockIdx(i)){
    for(m=0;m<2;m++){
      var base=(Math.floor(t/LOOP)-m)*LOOP;
      for(v=0;v<SHARED.length;v++){
        var bt=base+SHARED[v];
        if(bt<=t) cands.push(bt);
      }
    }
  }
  cands.sort(function(x,y){return y-x;});
  for(k=0;k<cands.length;k++) if(!beepMuted(i, cands[k])) return cands[k];
  return -1e9;
}
function neighbors(i){
  var c=i%COLS, r=Math.floor(i/COLS), out=[];
  if(c>0) out.push(i-1);
  if(c<COLS-1) out.push(i+1);
  if(r>0) out.push(i-COLS);
  if(r<ROWS-1) out.push(i+COLS);
  return out;
}

// ---------- canvas / view ----------
var canvas=document.getElementById('cv');
var ctx=canvas.getContext('2d');
var W=0,H=0,phone=false,cellW=0,cellH=0,mX=0,mY=0,diskR=0,centers=[];
function viewW(){ var vv=window.visualViewport; return vv?vv.width:window.innerWidth; }
function viewH(){ var vv=window.visualViewport; return vv?vv.height:window.innerHeight; }
function fit(){
  W=viewW(); H=viewH();
  var sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0;
  phone=(Math.min(sw,sh)<700)||(H>W*1.15);
  canvas.width=W; canvas.height=H;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  mX=W*0.12; mY=H*0.12;
  cellW=(W-2*mX)/COLS; cellH=(H-2*mY)/ROWS;
  diskR=Math.min(0.03*W, 0.36*Math.min(cellW,cellH));
  centers=[];
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++)
    centers.push({x:mX+(c+0.5)*cellW, y:mY+(r+0.5)*cellH});
}
if(window.visualViewport&&window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize',function(){fit();draw(now());});
window.addEventListener('resize',function(){fit();draw(now());});

// ---------- clock ----------
var startStamp=null;
function now(){
  var t=(typeof performance!=='undefined'&&performance.now)?performance.now()/1000:Date.now()/1000;
  if(startStamp===null) startStamp=t;
  return T0+(t-startStamp);
}

// ---------- interaction: drag = hand-shadow cover ----------
var shadow=null; // {x, y} while dragging
function handlePoint(x, y){
  var t=now();
  shadow={x:x, y:y};
  covers=covers.filter(function(c){ return t-c.t<4; });
  for(var i=0;i<N;i++){
    var dx=x-centers[i].x, dy=y-centers[i].y;
    if(dx*dx+dy*dy<=Math.pow(diskR*1.25,2)){
      var recent=false;
      for(var k=0;k<covers.length;k++) if(covers[k].i===i && t-covers[k].t<1.2) recent=true;
      if(!recent) covers.push({i:i, t:t});
    }
  }
}
function endPoint(){ shadow=null; }
function evtXY(e){ return {x:(typeof e.clientX==='number'?e.clientX:0), y:(typeof e.clientY==='number'?e.clientY:0)}; }
var dragging=false;
canvas.addEventListener('pointerdown',function(e){ dragging=true; var p=evtXY(e); handlePoint(p.x,p.y); });
canvas.addEventListener('pointermove',function(e){ if(dragging){ var p=evtXY(e); handlePoint(p.x,p.y); } });
window.addEventListener('pointerup',function(){ dragging=false; endPoint(); });
canvas.addEventListener('mousedown',function(e){ dragging=true; var p=evtXY(e); handlePoint(p.x,p.y); });
canvas.addEventListener('mousemove',function(e){ if(dragging){ var p=evtXY(e); handlePoint(p.x,p.y); } });
window.addEventListener('mouseup',function(){ dragging=false; endPoint(); });

// ---------- draw ----------
function circle(x, y, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arc(x, y, r, 0, Math.PI*2);
}
function draw(t){
  var lt=loopTimeOf(t);
  ctx.globalAlpha=1;
  ctx.fillStyle=CEIL;
  ctx.fillRect(0,0,W,H);

  // ceiling panel seams
  ctx.strokeStyle=SEAM;
  ctx.lineWidth=1;
  var k;
  for(k=0;k<=COLS;k++){
    var sx=mX+k*cellW;
    ctx.beginPath(); ctx.moveTo(sx, mY*0.5); ctx.lineTo(sx, H-mY*0.5); ctx.stroke();
  }
  for(k=0;k<=ROWS;k++){
    var sy=mY+k*cellH;
    ctx.beginPath(); ctx.moveTo(mX*0.5, sy); ctx.lineTo(W-mX*0.5, sy); ctx.stroke();
  }

  // beep ages for the whole choir
  var ages=[], i, j;
  for(i=0;i<N;i++) ages.push(t-lastBeep(i, t));

  // sound-rings (under the disks they emanate from)
  ctx.strokeStyle=RING;
  for(i=0;i<N;i++){
    var a=ages[i];
    if(a<1.6){
      var step=Math.min(4, Math.floor(a/1.6*5));
      ctx.globalAlpha=0.6*(1-step/5);
      ctx.lineWidth=Math.max(1, diskR*0.055);
      circle(centers[i].x, centers[i].y, diskR*(1+5*a/1.6));
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1;

  // disks: plain rim + center dot, no branding
  for(i=0;i<N;i++){
    var cx=centers[i].x, cy=centers[i].y;
    ctx.globalAlpha=coveredDim(i, t)?0.55:1;
    ctx.fillStyle=DISK;
    circle(cx, cy, diskR); ctx.fill();
    ctx.strokeStyle=RIM;
    ctx.lineWidth=Math.max(1, diskR*0.05);
    circle(cx, cy, diskR); ctx.stroke();
    ctx.strokeStyle=GROOVE;
    ctx.lineWidth=Math.max(1, diskR*0.035);
    circle(cx, cy, diskR*0.7); ctx.stroke();
    ctx.fillStyle=DOT;
    circle(cx, cy, diskR*0.15); ctx.fill();
  }
  ctx.globalAlpha=1;

  // LEDs: on at a beep, faint pink in sympathy with a beeping neighbor
  var ledR=Math.max(1.5, diskR*0.085), ledOff=diskR*0.46;
  for(i=0;i<N;i++){
    var lx=centers[i].x+ledOff, ly=centers[i].y+ledOff;
    if(ages[i]<0.18){
      ctx.globalAlpha=1;
      ctx.fillStyle=LED_ON;
    } else {
      var symp=false, nb=neighbors(i);
      for(j=0;j<nb.length;j++) if(ages[nb[j]]<0.3) symp=true;
      if(symp){
        ctx.globalAlpha=0.25;
        ctx.fillStyle=SYMP;
      } else {
        ctx.globalAlpha=1;
        ctx.fillStyle=LED_OFF;
      }
    }
    circle(lx, ly, ledR); ctx.fill();
  }
  ctx.globalAlpha=1;

  // hand-shadow while dragging: flat alpha ellipses, no blur
  if(shadow){
    var sr=diskR*1.25;
    ctx.fillStyle='#000000';
    ctx.globalAlpha=0.05;
    ctx.beginPath(); ctx.ellipse(shadow.x, shadow.y, sr*1.9, sr*1.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.06;
    ctx.beginPath(); ctx.ellipse(shadow.x, shadow.y, sr*1.3, sr*1.02, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.07;
    ctx.beginPath(); ctx.ellipse(shadow.x, shadow.y, sr*0.8, sr*0.62, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  // phase-lock caption, only while the accident holds
  if(lt>=LOCK_T0 && lt<LOCK_T1){
    ctx.fillStyle=CAPTION;
    ctx.font=Math.max(11, Math.round(W*0.011))+'px monospace';
    ctx.textAlign='center';
    ctx.fillText('phase lock', W/2, H-mY*0.45);
  }
}

// ---------- run ----------
fit();
draw(now());
function frame(){
  draw(now());
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}
if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
</script>
</body>
</html>
