<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All'alba</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #141B33; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ---------- palette (strict) ----------
var NIGHT = '#141B33'; // night indigo
var VIOLET = '#3A2E5C'; // pre-dawn violet
var ROSE = '#E89B7D'; // dawn rose
var GOLD = '#E8B93B'; // daybreak gold
var SILK = '#C9B896'; // cocoon silk
var WING = '#EDE6D2'; // moth wing

// ---------- seeded rng (placement only) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, x) {
  var t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixHex(h1, h2, t) {
  var a = hexRgb(h1), b = hexRgb(h2);
  return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
}
function shade(h, f) { // same pigment, darker strength (silhouettes)
  var a = hexRgb(h);
  return 'rgb(' + Math.round(a[0] * f) + ',' + Math.round(a[1] * f) + ',' + Math.round(a[2] * f) + ')';
}
function rgba(h, al) {
  var a = hexRgb(h);
  return 'rgba(' + a[0] + ',' + a[1] + ',' + a[2] + ',' + al + ')';
}

// ---------- cycle ----------
// One fixed composition; only the hour changes. Cycle 75 s.
var CYCLE_S = 75;
var phaseOffset = 0; // tap adds an offset so the phase jumps to dawn start

function phaseAt(elapsed) {
  var p = (elapsed / CYCLE_S + phaseOffset) % 1;
  return p < 0 ? p + 1 : p;
}

// Sky keyframes: {p, top, mid, bot} stops of the vertical gradient.
var SKY_KEYS = [
  { p: 0.00, top: NIGHT, mid: NIGHT, bot: NIGHT },
  { p: 0.30, top: NIGHT, mid: NIGHT, bot: NIGHT },
  { p: 0.38, top: NIGHT, mid: NIGHT, bot: VIOLET },
  { p: 0.52, top: VIOLET, mid: ROSE, bot: GOLD },
  { p: 0.66, top: VIOLET, mid: ROSE, bot: GOLD },
  { p: 0.78, top: NIGHT, mid: VIOLET, bot: VIOLET },
  { p: 0.90, top: NIGHT, mid: NIGHT, bot: NIGHT },
  { p: 1.00, top: NIGHT, mid: NIGHT, bot: NIGHT }
];
function skyStops(p) {
  for (var i = 0; i < SKY_KEYS.length - 1; i++) {
    var a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
    if (p >= a.p && p <= b.p) {
      var t = (p - a.p) / Math.max(1e-6, b.p - a.p);
      return { top: mixHex(a.top, b.top, t), mid: mixHex(a.mid, b.mid, t), bot: mixHex(a.bot, b.bot, t) };
    }
  }
  var last = SKY_KEYS[SKY_KEYS.length - 1];
  return { top: last.top, mid: last.mid, bot: last.bot };
}

// Phase-driven amounts (all pure functions of the cycle phase).
function starAlpha(p) { return 1 - smooth(0.30, 0.44, p) * 0.92 + smooth(0.78, 0.92, p) * 0.92 * smooth(0.30, 0.44, p); }
function dawnAmount(p) { return smooth(0.42, 0.58, p) * (1 - smooth(0.70, 0.86, p)); }
function flowerCurl(p, i) {
  var open = smooth(0.44 + i * 0.022, 0.56 + i * 0.022, p);
  var close = 1 - smooth(0.70, 0.85, p);
  return open * close; // 0 = curled bud, 1 = fully unrolled
}
function cocoonOpen(p) { return smooth(0.50, 0.57, p) * (1 - smooth(0.80, 0.86, p)); }
function mothEmerge(p) { return smooth(0.53, 0.60, p) * (1 - smooth(0.74, 0.80, p)); }

// ---------- canvas ----------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, lastElapsed = 0;

function viewSize() {
  var vv = window.visualViewport;
  var w = vv && vv.width ? vv.width : window.innerWidth;
  var h = vv && vv.height ? vv.height : window.innerHeight;
  return { w: w, h: h };
}
function isPhone() {
  var sw = 9999, sh = 9999;
  if (window.screen) { sw = window.screen.width || 9999; sh = window.screen.height || 9999; }
  if (Math.min(sw, sh) < 700) return true;
  return H > W * 1.15 && W < 700;
}
function resize() {
  var s = viewSize();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = s.w; H = s.h;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(lastElapsed);
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
window.addEventListener('resize', resize);

// ---------- fixed scene data (seeded placement, identical every loop) ----------
var SEED = 635077;
var rng = mulberry32(SEED);
var stars = [];
for (var si = 0; si < 120; si++) {
  stars.push({ x: rng(), y: rng() * 0.52, r: 0.6 + rng() * 1.5, tw: rng() * 6.283 });
}
var grass = [];
for (var gi = 0; gi < 110; gi++) {
  grass.push({ x: rng(), h: 0.5 + rng() * 0.9, lean: (rng() - 0.5) * 0.7, w: 1 + rng() * 1.2 });
}
// Five flowers, lower right: base x (frac of W), stem height (frac of H), head size, petal count.
var flowers = [];
var flowerSeed = mulberry32(SEED + 7);
for (var fi = 0; fi < 5; fi++) {
  flowers.push({
    bx: 0.625 + fi * 0.072 + (flowerSeed() - 0.5) * 0.014,
    stem: 0.11 + flowerSeed() * 0.08,
    size: 0.033 + flowerSeed() * 0.012,
    petals: 6,
    lean: (flowerSeed() - 0.5) * 0.05
  });
}
// Two fireflies, seeded home points near the ground.
var fireflies = [
  { hx: 0.30, hy: 0.635, ph: 0.0 },
  { hx: 0.58, hy: 0.655, ph: 2.4 }
];

// ---------- geometry helpers ----------
function horizonY() { return H * 0.68; }
function branchPoint(t) {
  // Bare branch: quadratic curve entering upper left, ending upper right-center.
  var x0 = -0.03 * W, y0 = 0.085 * H, cx = 0.26 * W, cy = 0.115 * H, x1 = 0.63 * W, y1 = 0.205 * H;
  var mt = 1 - t;
  return { x: mt * mt * x0 + 2 * mt * t * cx + t * t * x1, y: mt * mt * y0 + 2 * mt * t * cy + t * t * y1 };
}
var COCOON_T = 0.66; // where the cocoon hangs on the branch

// ---------- draw pieces ----------
function drawSky(p) {
  var hy = horizonY();
  var st = skyStops(p);
  var g = ctx.createLinearGradient(0, 0, 0, hy);
  g.addColorStop(0, st.top);
  g.addColorStop(0.68, st.mid);
  g.addColorStop(1, st.bot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, hy + 1);
  // ground band: night indigo at a darker strength, warms at the rim at dawn
  ctx.fillStyle = shade(NIGHT, 0.5);
  ctx.fillRect(0, hy, W, H - hy);
  var d = dawnAmount(p);
  if (d > 0.01) {
    ctx.fillStyle = rgba(GOLD, 0.20 * d);
    ctx.fillRect(0, hy - 1, W, 2.5);
    ctx.fillStyle = rgba(ROSE, 0.10 * d);
    ctx.fillRect(0, hy - 4, W, 3);
  }
}
function drawStars(p, elapsed) {
  var a = starAlpha(p);
  if (a <= 0.02) return;
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var tw = 0.7 + 0.3 * Math.sin(elapsed * 0.9 + s.tw);
    ctx.fillStyle = rgba(WING, a * tw * 0.9);
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, 6.2832);
    ctx.fill();
  }
}
function drawBranch() {
  ctx.strokeStyle = shade(NIGHT, 0.42);
  ctx.lineCap = 'round';
  var steps = 24, prev = branchPoint(0);
  for (var i = 1; i <= steps; i++) {
    var pt = branchPoint(i / steps);
    ctx.lineWidth = (1 - (i / steps)) * Math.min(W, H) * 0.016 + 1.2;
    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(pt.x, pt.y);
    ctx.stroke();
    prev = pt;
  }
  // two bare twigs
  ctx.lineWidth = Math.min(W, H) * 0.006 + 0.8;
  var t1 = branchPoint(0.30);
  ctx.beginPath(); ctx.moveTo(t1.x, t1.y); ctx.quadraticCurveTo(t1.x + W * 0.03, t1.y - H * 0.045, t1.x + W * 0.065, t1.y - H * 0.06); ctx.stroke();
  var t2 = branchPoint(0.88);
  ctx.beginPath(); ctx.moveTo(t2.x, t2.y); ctx.quadraticCurveTo(t2.x + W * 0.02, t2.y - H * 0.03, t2.x + W * 0.045, t2.y - H * 0.055); ctx.stroke();
}
function drawGrass(p) {
  var hy = horizonY();
  ctx.strokeStyle = shade(NIGHT, 0.38);
  ctx.lineCap = 'round';
  for (var i = 0; i < grass.length; i++) {
    var g = grass[i];
    var x = g.x * W, bh = g.h * H * 0.028;
    ctx.lineWidth = g.w;
    ctx.beginPath();
    ctx.moveTo(x, hy + 2);
    ctx.quadraticCurveTo(x + g.lean * 6, hy - bh * 0.6, x + g.lean * 12, hy - bh);
    ctx.stroke();
  }
}
function petalPath(cx, cy, baseAng, len, wid, curl) {
  // Parametric petal: spine bends as it unrolls; outline from width profile.
  var steps = 8, spine = [], i, s, ang, px, py;
  ang = baseAng; px = cx; py = cy;
  spine.push({ x: px, y: py, a: ang });
  var seg = len / steps;
  for (i = 1; i <= steps; i++) {
    s = i / steps;
    ang = baseAng + (1 - curl) * 1.9 * s; // curled: tip sweeps back toward vertical bud
    px += Math.cos(ang) * seg;
    py += Math.sin(ang) * seg;
    spine.push({ x: px, y: py, a: ang });
  }
  ctx.beginPath();
  for (i = 0; i <= steps; i++) {
    s = i / steps;
    var wdt = wid * Math.sin(Math.PI * Math.pow(s, 0.75)) * (0.35 + 0.65 * curl) + 0.4;
    var nx = Math.cos(spine[i].a - Math.PI / 2), ny = Math.sin(spine[i].a - Math.PI / 2);
    var lx = spine[i].x + nx * wdt / 2, ly = spine[i].y + ny * wdt / 2;
    if (i === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
  }
  for (i = steps; i >= 0; i--) {
    s = i / steps;
    var wdt2 = wid * Math.sin(Math.PI * Math.pow(s, 0.75)) * (0.35 + 0.65 * curl) + 0.4;
    var nx2 = Math.cos(spine[i].a - Math.PI / 2), ny2 = Math.sin(spine[i].a - Math.PI / 2);
    ctx.lineTo(spine[i].x - nx2 * wdt2 / 2, spine[i].y - ny2 * wdt2 / 2);
  }
  ctx.closePath();
}
function drawFlowers(p) {
  var hy = horizonY();
  var u = Math.min(W, H);
  for (var i = 0; i < flowers.length; i++) {
    var f = flowers[i];
    var bx = f.bx * W, by = hy + H * 0.015;
    var hx = bx + f.lean * W, hyy = by - f.stem * H;
    // stem
    ctx.strokeStyle = shade(NIGHT, 0.40);
    ctx.lineWidth = Math.max(1.4, u * 0.004);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx + f.lean * W * 0.3, by - f.stem * H * 0.55, hx, hyy);
    ctx.stroke();
    // small leaf
    ctx.fillStyle = shade(NIGHT, 0.40);
    ctx.beginPath();
    ctx.ellipse(bx + f.lean * W * 0.35, by - f.stem * H * 0.45, u * 0.012, u * 0.005, -0.6, 0, 6.2832);
    ctx.fill();
    // petals: bud points up and curled; open fans radially
    var curl = flowerCurl(p, i);
    var size = f.size * u * (0.82 + 0.18 * curl);
    for (var k = 0; k < f.petals; k++) {
      var openAng = -Math.PI / 2 + (k / f.petals) * Math.PI * 2;
      var budAng = -Math.PI / 2 + (k - (f.petals - 1) / 2) * 0.16;
      var ang = lerp(budAng, openAng, curl);
      ctx.fillStyle = rgba(ROSE, 0.96);
      petalPath(hx, hyy, ang, size, size * 0.62, curl);
      ctx.fill();
    }
    // heart of the flower
    ctx.fillStyle = GOLD;
    ctx.beginPath();
    ctx.arc(hx, hyy, Math.max(1.2, size * 0.16), 0, 6.2832);
    ctx.fill();
  }
}
function drawCocoonAndMoth(p, elapsed) {
  var u = Math.min(W, H);
  var bp = branchPoint(COCOON_T);
  var threadLen = H * 0.035;
  var topX = bp.x, topY = bp.y + 2;
  var cw = u * 0.052, chh = u * 0.088; // cocoon width/height
  var cxp = topX, cyp = topY + threadLen + chh / 2;
  // thread
  ctx.strokeStyle = rgba(SILK, 0.8);
  ctx.lineWidth = Math.max(1, u * 0.0022);
  ctx.beginPath(); ctx.moveTo(topX, topY); ctx.lineTo(cxp, cyp - chh / 2); ctx.stroke();
  var open = cocoonOpen(p);
  // shell halves rotate apart around the top attachment
  function half(side) {
    ctx.save();
    ctx.translate(cxp, cyp - chh / 2);
    ctx.rotate(side * open * 0.65);
    ctx.fillStyle = SILK;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(side * cw * 0.62, chh * 0.18, side * cw * 0.55, chh * 0.72, 0, chh);
    ctx.bezierCurveTo(side * cw * 0.10, chh * 0.62, side * cw * 0.08, chh * 0.25, 0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba(NIGHT, 0.25);
    ctx.lineWidth = Math.max(0.7, u * 0.0016);
    ctx.beginPath();
    ctx.moveTo(side * cw * 0.06, chh * 0.30);
    ctx.quadraticCurveTo(side * cw * 0.34, chh * 0.42, side * cw * 0.10, chh * 0.80);
    ctx.stroke();
    ctx.restore();
  }
  half(-1); half(1);
  // moth
  var e = mothEmerge(p);
  if (e > 0.01) {
    // emerges from the cocoon mouth, rises to a perch on the branch right of the cocoon
    var perch = branchPoint(COCOON_T + 0.13);
    var mx = lerp(cxp, perch.x, e);
    var my = lerp(cyp + chh * 0.15, perch.y - u * 0.018, e);
    var scale = 0.55 + 0.45 * e;
    // wing flap: two full flaps during p in [0.585, 0.65], then settled open
    var flap = 0;
    if (p > 0.585 && p < 0.65) {
      var ft = (p - 0.585) / 0.065;
      flap = Math.sin(ft * Math.PI * 4) * (1 - ft * 0.35);
    }
    var spread = (0.95 - 0.45 * Math.abs(flap)) * (0.35 + 0.65 * e);
    var lift = flap * 0.55;
    var wlen = u * 0.052 * scale, wwid = u * 0.026 * scale;
    ctx.fillStyle = WING;
    // left wing
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(-spread + lift);
    ctx.beginPath(); ctx.ellipse(-wlen * 0.52, 0, wlen * 0.55, wwid * 0.55, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
    // right wing
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(spread - lift);
    ctx.beginPath(); ctx.ellipse(wlen * 0.52, 0, wlen * 0.55, wwid * 0.55, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
    // body
    ctx.fillStyle = SILK;
    ctx.beginPath();
    ctx.ellipse(mx, my, u * 0.006 * scale + 1, u * 0.013 * scale + 1, 0, 0, 6.2832);
    ctx.fill();
  }
}
function drawBirds(p, elapsed) {
  var bt = (p - 0.60) / 0.10;
  if (bt <= 0 || bt >= 1) return;
  var u = Math.min(W, H);
  ctx.strokeStyle = shade(NIGHT, 0.45);
  ctx.lineWidth = Math.max(1.2, u * 0.0035);
  ctx.lineCap = 'round';
  for (var i = 0; i < 3; i++) {
    var bx = lerp(-0.06, 1.06, bt) * W - i * W * 0.055;
    var by = (0.16 + i * 0.045) * H + Math.sin(bt * 9 + i * 1.7) * H * 0.006;
    var s = u * (0.016 - i * 0.0025);
    var flapA = Math.sin(elapsed * 5.2 + i * 1.3) * 0.35;
    ctx.beginPath();
    ctx.moveTo(bx - s, by + s * 0.4 * (0.5 + flapA));
    ctx.quadraticCurveTo(bx - s * 0.3, by - s * 0.35, bx, by);
    ctx.quadraticCurveTo(bx + s * 0.3, by - s * 0.35, bx + s, by + s * 0.4 * (0.5 - flapA));
    ctx.stroke();
  }
}
function drawFireflies(p, elapsed) {
  // full at night (frame one), out for dawn and daybreak, back late in the return
  var gate = p < 0.5 ? (1 - smooth(0.28, 0.44, p)) : smooth(0.84, 0.97, p);
  if (gate <= 0.02) return;
  for (var i = 0; i < fireflies.length; i++) {
    var f = fireflies[i];
    var x = (f.hx + 0.02 * Math.sin(elapsed * 0.23 + f.ph)) * W;
    var y = (f.hy + 0.008 * Math.sin(elapsed * 0.31 + f.ph * 2.0)) * H;
    var pulse = 0.55 + 0.45 * Math.sin(elapsed * 1.4 + f.ph * 3.1);
    var a = gate * pulse;
    ctx.fillStyle = rgba(GOLD, 0.16 * a);
    ctx.beginPath(); ctx.arc(x, y, 7, 0, 6.2832); ctx.fill();
    ctx.fillStyle = rgba(GOLD, 0.30 * a);
    ctx.beginPath(); ctx.arc(x, y, 3.4, 0, 6.2832); ctx.fill();
    ctx.fillStyle = rgba(GOLD, 0.9 * a);
    ctx.beginPath(); ctx.arc(x, y, 1.5, 0, 6.2832); ctx.fill();
  }
}

// ---------- main draw ----------
function draw(elapsed) {
  lastElapsed = elapsed;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var p = phaseAt(elapsed);
  drawSky(p);
  drawStars(p, elapsed);
  drawBirds(p, elapsed);
  drawBranch();
  drawCocoonAndMoth(p, elapsed);
  drawGrass(p);
  drawFlowers(p);
  drawFireflies(p, elapsed);
}

// ---------- interaction: tap forces one immediate dawn ----------
function forceDawn() {
  var p = phaseAt(lastElapsed);
  if (p > 0.40 && p < 0.86) return; // already in/after dawn; let it run
  var cur = (lastElapsed / CYCLE_S + phaseOffset) % 1;
  phaseOffset += (0.42 - cur);
}
var downAt = 0, downX = 0, downY = 0;
function onDown(x, y) { downAt = lastElapsed; downX = x; downY = y; }
function onUp(x, y) {
  var dt = lastElapsed - downAt;
  var dx = x - downX, dy = y - downY;
  if (dt < 0.6 && Math.sqrt(dx * dx + dy * dy) < 24) forceDawn();
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (ev) { onDown(ev.clientX || 0, ev.clientY || 0); });
  canvas.addEventListener('pointerup', function (ev) { onUp(ev.clientX || 0, ev.clientY || 0); });
  canvas.addEventListener('touchstart', function (ev) { if (ev.touches && ev.touches[0]) onDown(ev.touches[0].clientX, ev.touches[0].clientY); }, { passive: true });
  canvas.addEventListener('touchend', function (ev) { if (ev.changedTouches && ev.changedTouches[0]) onUp(ev.changedTouches[0].clientX, ev.changedTouches[0].clientY); });
}

// QA hook: ?seed=dawn forces the dawn state in throwaway renders.
var forcedPhase = null;
if (typeof location !== 'undefined' && location.search && location.search.indexOf('dawn') >= 0) {
  forcedPhase = 0.60;
}

// ---------- run ----------
resize();
draw(0);
if (forcedPhase !== null) {
  phaseOffset = forcedPhase; // phase 0.60 at elapsed 0
  draw(0);
}
if (typeof requestAnimationFrame === 'function') {
  var t0 = null;
  var loop = function (ts) {
    if (t0 === null) t0 = ts;
    draw((ts - t0) / 1000);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
