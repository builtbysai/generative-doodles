<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Box</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EDE3; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F2EDE3';
var KRAFT = '#C9A06B';
var KRAFT_DARK = '#A97F4E';
var KRAFT_LIGHT = '#DDBB8A';
var MOTOR = '#1A1712';
var MOTOR_TICK = '#F2EDE3';
var BAND_LINE = '#B9B2A4';
var WHISKER = '#4A453C';
var WHISKER_SOFT = '#8A857C';
var PLATE = '#E9E2D2';
var PLATE_LINE = 'rgba(169,127,78,0.7)';
var TITLE_INK = '#2E2417';
var HINT_INK = '#6B5636';
var FRAME_T = 60.0;
var UNIT_N = 48;
var SIGMA = 0.09;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1751);
var phaseT = FRAME_T;
/* ---- layout, all in fractions of the viewport so the piece scales.
   The band runs at ear height (0.52 of the height) between the two
   boxes anchored at the left and right margins. ---- */
var BAND_Y = 0.52;
var BOX_MARGIN = 0.018;
function boxW() { return clamp(0.075 * VW, 34, 96); }
function boxH() { return boxW() * 1.45; }
function bandX0() { return BOX_MARGIN * VW + boxW() + Math.max(10, 0.02 * VW); }
function bandX1() { return VW - BOX_MARGIN * VW - boxW() - Math.max(10, 0.02 * VW); }
function bandY() { return BAND_Y * VH; }
/* ---- the listener lives inside the band, never outside it.
   It starts centered; drag retargets it and the value eases toward
   the target. Listener position is a fraction of the band. ---- */
var listener = 0.5;
var listenerTarget = 0.5;
function listenerX() { return bandX0() + listener * (bandX1() - bandX0()); }
function listenerXAt(frac) { return bandX0() + frac * (bandX1() - bandX0()); }
/* ---- whisker units: 48 units along the band, seeded jitter in
   position, phase, frequency and length. Tick phase is a closed-form
   function of piece time, so frame one is fixed. ---- */
var UNITS = [];
(function () {
  var i;
  for (i = 0; i < UNIT_N; i++) {
    UNITS.push({
      u: (i + 0.5) / UNIT_N + (rng() - 0.5) * (0.7 / UNIT_N),
      phase: rng() * TAU,
      freq: 5.5 + rng() * 3.5,
      len: 0.65 + rng() * 0.7,
      up: rng() < 0.5
    });
  }
})();
/* intensity falloff around the listener: 1.0 at the listener,
   0.5259 at one sigma, 0.2637 at two sigma, 0.25 floor at the edges */
function intensityAt(frac) {
  var d = (frac - listener) / SIGMA;
  return 0.25 + 0.75 * Math.exp(-d * d);
}
function unitX(un) { return bandX0() + clamp(un.u, 0, 1) * (bandX1() - bandX0()); }
function unitAngle(un, t) {
  return Math.sin(TAU * (un.freq * t) + un.phase) * (0.35 + 0.65 * intensityAt(un.u));
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function drawBand(t) {
  var s = Math.min(VW, VH);
  var bx0 = bandX0(), bx1 = bandX1(), by = bandY();
  var i, un, x, inten, len, ang, x1, y1, a;
  ctx.strokeStyle = BAND_LINE;
  ctx.lineWidth = Math.max(s * 0.002, 1);
  ctx.beginPath();
  ctx.moveTo(bx0, by);
  ctx.lineTo(bx1, by);
  ctx.stroke();
  for (i = 0; i < UNITS.length; i++) {
    un = UNITS[i];
    x = unitX(un);
    inten = intensityAt(un.u);
    len = (13 + 15 * un.len) * (s / 900) * (0.55 + 0.45 * inten);
    len = Math.max(len, 6);
    ang = unitAngle(un, t);
    a = 0.34 + 0.61 * inten;
    ctx.strokeStyle = inten > 0.6 ? rgba(WHISKER, a) : rgba(WHISKER_SOFT, a);
    ctx.lineWidth = Math.max(s * 0.0022, 0.9);
    x1 = x + Math.sin(ang) * len;
    y1 = by + (un.up ? -1 : 1) * Math.cos(ang) * len;
    ctx.beginPath();
    ctx.moveTo(x, by);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    ctx.fillStyle = rgba(WHISKER, 0.35 + 0.55 * inten);
    ctx.beginPath();
    ctx.moveTo(x + Math.max(s * 0.0022, 0.9), by);
    ctx.arc(x, by, Math.max(s * 0.0022, 0.9), 0, TAU);
    ctx.fill();
  }
}
function drawBox(side, t) {
  var s = Math.min(VW, VH);
  var w = boxW(), h = boxH();
  var x = side < 0 ? BOX_MARGIN * VW : VW - BOX_MARGIN * VW - w;
  var y = bandY() - h / 2;
  var grad = ctx.createLinearGradient(x, y, x + w, y);
  grad.addColorStop(0, KRAFT_LIGHT);
  grad.addColorStop(0.5, KRAFT);
  grad.addColorStop(1, KRAFT_DARK);
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = rgba(KRAFT_DARK, 0.8);
  ctx.lineWidth = Math.max(s * 0.002, 1);
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  /* tape strip across the top of the box */
  ctx.fillStyle = rgba(KRAFT_DARK, 0.35);
  ctx.fillRect(x, y, w, Math.max(3, h * 0.07));
  /* the motor: a small black disc whose tick runs on the band edge phase */
  var edgePhase = side < 0 ? unitAngle(UNITS[0], t) : unitAngle(UNITS[UNIT_N - 1], t);
  var mcx = x + w / 2, mcy = y + h * 0.58;
  var mr = Math.max(w * 0.26, 7);
  ctx.fillStyle = MOTOR;
  ctx.beginPath();
  ctx.moveTo(mcx + mr, mcy);
  ctx.arc(mcx, mcy, mr, 0, TAU);
  ctx.fill();
  var tx = mcx + Math.sin(edgePhase * 2.2) * mr * 0.75;
  var ty = mcy - Math.cos(edgePhase * 2.2) * mr * 0.75;
  ctx.strokeStyle = MOTOR_TICK;
  ctx.lineWidth = Math.max(1.5, mr * 0.14);
  ctx.beginPath();
  ctx.moveTo(mcx, mcy);
  ctx.lineTo(tx, ty);
  ctx.stroke();
  /* motor mount: two tiny screws */
  ctx.fillStyle = rgba(MOTOR, 0.85);
  ctx.beginPath();
  ctx.moveTo(x + w * 0.22 + 1.5, y + h * 0.88);
  ctx.arc(x + w * 0.22, y + h * 0.88, 1.5, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + w * 0.78 + 1.5, y + h * 0.88);
  ctx.arc(x + w * 0.78, y + h * 0.88, 1.5, 0, TAU);
  ctx.fill();
}
function drawListener() {
  var s = Math.min(VW, VH);
  var x = listenerX(), y = bandY();
  var r = Math.max(s * 0.012, 5);
  ctx.strokeStyle = rgba(WHISKER, 0.55);
  ctx.lineWidth = Math.max(s * 0.002, 1);
  ctx.beginPath();
  ctx.moveTo(x + r * 1.9, y);
  ctx.arc(x, y, r * 1.9, 0, TAU);
  ctx.stroke();
  ctx.fillStyle = WHISKER;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
  ctx.fillStyle = GROUND;
  ctx.beginPath();
  ctx.moveTo(x + r * 0.42, y);
  ctx.arc(x, y, r * 0.42, 0, TAU);
  ctx.fill();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Beat Box').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Beat Box').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 28').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Beat Box', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 28', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to shift the listening point.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawBand(phaseT);
  drawBox(-1, phaseT);
  drawBox(1, phaseT);
  drawListener();
  drawPlates();
}
function setTargetFromEvent(e) {
  var rect = { left: 0, top: 0 };
  try { rect = canvas.getBoundingClientRect(); } catch (err) { rect = { left: 0, top: 0 }; }
  var cx = (e.clientX - rect.left);
  var frac = (cx - bandX0()) / (bandX1() - bandX0());
  listenerTarget = clamp(frac, 0.04, 0.96);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    unitCount: function () { return UNITS.length; },
    listener: function () { return listener; },
    listenerTarget: function () { return listenerTarget; },
    setListener: function (f) { listener = clamp(f, 0.04, 0.96); listenerTarget = listener; },
    dragTo: function (f) { listenerTarget = clamp(f, 0.04, 0.96); },
    easeStep: function () { listener += (listenerTarget - listener) * 0.2; return listener; },
    intensityAt: function (f) { return intensityAt(f); },
    bandEnds: function () { return [bandX0(), bandX1(), bandY()]; },
    boxRects: function () {
      var w = boxW(), h = boxH();
      return [
        [BOX_MARGIN * VW, bandY() - h / 2, w, h],
        [VW - BOX_MARGIN * VW - w, bandY() - h / 2, w, h]
      ];
    },
    unitAngle: function (i, t) { return unitAngle(UNITS[i], t); },
    phaseT: function () { return phaseT; }
  };
}
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) { setTargetFromEvent(e); });
  canvas.addEventListener('pointermove', function (e) {
    if (e.buttons) setTargetFromEvent(e);
  });
}
/* ---- frame one: fixed phase t = 60.0 s, listener centered ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      listener += (listenerTarget - listener) * Math.min(1, dt * 7);
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
