<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Happens Next</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FAF6EE; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Margins + invader palette (strict). Flat fills only, no gradients.
  var MARGIN = '#FAF6EE';
  var CAT = '#111111', EYE = '#FFD400';
  var RABBIT = '#F0438F';
  var DOOR = '#0E3B36', GLOW = '#FF5A1F';
  var BALLOON = '#FFD400';
  var INK = '#111111';            // invader outlines + the painting's frame line
  var SMOKE = '#CFC7B4';          // warm gray, door smoke only
  var HINT = '#C4B998';

  var PHASE0 = 12;                // constant first-frame phase: every entrance finished
  var ENTRY = 2;                  // seconds per entrance slide
  var STAGGER = 0.55;             // seconds between entrances

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---- layout (1080 x 1080 design space) ----
  // Painting: 756 wide (70% of the stage), centred. Warm-white margins around it.
  var PX = 162, PY = 270, PW = 756, PH = 540;

  // Invader marks (final resting positions, design coords) and offstage starts.
  var MARKS = {
    cat:     { x: 88,  y: 622, sx: -170, sy: 622 },   // pads in from the left edge
    rabbit:  { x: 992, y: 646, sx: 1250, sy: 646 },   // hops in from the right edge
    door:    { x: 700, y: 270, sx: 700,  sy: -60 },   // drops into the top margin, base on the frame
    balloon: { x: 348, y: 908, sx: 348,  sy: 1260 }   // floats up from below the frame
  };
  var TYPES = ['cat', 'rabbit', 'door', 'balloon'];

  // ---- generated state: one classic + 3-4 invaders per seed ----
  var seed = 552066;
  var state = null;

  function generate(s) {
    var rng = mulberry32(s);
    var classic = Math.floor(rng() * 3);              // 0 seascape, 1 interior, 2 street
    var count = 3 + Math.floor(rng() * 2);            // 3 or 4 invaders
    var pool = TYPES.slice();
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    var invaders = [];
    for (var k = 0; k < count; k++) {
      invaders.push({
        type: pool[k],
        delay: k * STAGGER,
        ph: rng() * Math.PI * 2,
        ph2: rng() * Math.PI * 2
      });
    }
    return { classic: classic, invaders: invaders };
  }
  state = generate(seed);

  // ---- small helpers ----
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
  function rect(x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
  function circ(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  function ell(x, y, rx, ry, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
  function poly(pts, fill) {
    ctx.fillStyle = fill; ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath(); ctx.fill();
  }
  function strokePath(pts, close, color, lw) {
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    if (close) ctx.closePath();
    ctx.stroke();
  }

  // ================= THE CLASSICS (flat homage, never animated) =================

  function girl(x, y, s, dress, hair) {
    // standing figure, side of the shore: head, hair cap, triangle dress
    circ(x, y - 62 * s, 11 * s, '#D9B08C');
    ctx.fillStyle = hair; ctx.beginPath();
    ctx.arc(x, y - 64 * s, 11.5 * s, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
    poly([x, y - 54 * s, x - 27 * s, y + 16 * s, x + 27 * s, y + 16 * s], dress);
    rect(x - 14 * s, y + 16 * s, 6 * s, 16 * s, '#D9B08C');
    rect(x + 8 * s, y + 16 * s, 6 * s, 16 * s, '#D9B08C');
  }

  function classicSeascape() {
    rect(0, 0, PW, 300, '#C9D4D2');                       // pale sky
    circ(618, 82, 34, '#E4E7DC');                         // flat pale sun
    rect(0, 240, PW, 170, '#7E97A3');                     // sea
    rect(0, 268, PW, 20, '#A9BCC0');                      // light streaks on the water
    rect(0, 322, PW, 12, '#93A9AE');
    poly([0, 410, PW, 378, PW, PH, 0, PH], '#D9C9A3');    // shore
    ell(96, 432, 62, 17, '#6E7276');                      // rocks
    ell(648, 404, 48, 13, '#6E7276');
    girl(302, 356, 1.15, '#B0765F', '#6B5138');            // two girls on the shore
    girl(438, 366, 1.05, '#E3DCC8', '#54432E');
    poly([470, 330, 496, 330, 490, 352, 476, 352], '#9A7B4F'); // her basket
  }

  function classicInterior() {
    rect(0, 0, PW, PH, '#D8C49A');                        // warm wall
    rect(0, 380, PW, 160, '#A98F66');                     // floor
    poly([60, 380, 300, 380, 384, PH, 120, PH], '#C4AB7C'); // flat light patch
    rect(60, 60, 190, 260, '#8A6F4D');                    // window frame
    rect(76, 76, 158, 228, '#EDE4C4');                    // panes
    rect(147, 76, 10, 228, '#8A6F4D');
    rect(76, 178, 158, 10, '#8A6F4D');
    rect(470, 70, 200, 150, '#C9B489');                   // wall map
    rect(482, 82, 176, 126, '#D8C49A');
    rect(500, 104, 90, 8, '#A68F5F');
    rect(500, 128, 130, 8, '#A68F5F');
    rect(500, 152, 70, 8, '#A68F5F');
    // standing figure reading a letter
    circ(330, 218, 13, '#D9B08C');
    ctx.fillStyle = '#F2EEE2'; ctx.beginPath();
    ctx.arc(330, 214, 13.5, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();   // white cap
    poly([330, 232, 306, 300, 354, 300], '#4A5E7E');     // blue bodice
    poly([306, 300, 354, 300, 368, 384, 292, 384], '#BE9A3C'); // ochre skirt
    rect(352, 262, 26, 18, '#F2EEE2');                    // the letter
    // table with a jug
    rect(392, 330, 250, 24, '#7A4A3A');
    rect(404, 354, 14, 60, '#7A4A3A');
    rect(616, 354, 14, 60, '#7A4A3A');
    rect(470, 300, 22, 30, '#EDE8DA');
    poly([470, 300, 492, 300, 481, 288], '#EDE8DA');
  }

  function classicStreet() {
    rect(0, 0, PW, 120, '#A9715A');                       // upper building
    var wx, i;
    for (i = 0; i < 6; i++) { wx = 36 + i * 122; rect(wx, 30, 46, 58, '#5E4A42'); }
    rect(0, 120, PW, 16, '#8A5A48');                      // cornice
    for (i = 0; i < 12; i++) rect(i * 63, 136, 63, 26, i % 2 ? '#7C8B74' : '#B7BFA9'); // awning stripes
    rect(0, 162, PW, 238, '#5F7A72');                     // storefront
    for (i = 0; i < 3; i++) {                             // big glass panes
      wx = 36 + i * 196;
      rect(wx, 186, 168, 168, '#87A398');
      rect(wx, 316, 168, 38, '#42554E');                 // counter silhouette
    }
    circ(306, 250, 9, '#E4D9B0');                         // lamps inside the glass
    circ(502, 250, 9, '#E4D9B0');
    rect(648, 186, 72, 214, '#4C4238');                   // door
    rect(660, 200, 48, 60, '#87A398');
    rect(0, 400, PW, 60, '#B9B2A4');                      // sidewalk
    rect(0, 460, PW, 80, '#7E7A72');                      // street
    // one figure on the sidewalk
    circ(528, 330, 12, '#D9B08C');
    rect(510, 312, 36, 8, '#3A3532');                     // hat brim
    rect(516, 294, 24, 20, '#3A3532');                    // hat crown
    poly([528, 344, 506, 344, 512, 448, 544, 448, 550, 344], '#4A4440'); // long coat
  }

  var CLASSICS = [classicSeascape, classicInterior, classicStreet];

  // ================= THE INVADERS (her cast, acid palette, outlined) =================

  function drawCat(x, y, t, ph) {
    ctx.save(); ctx.translate(x, y);
    ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.lineCap = 'round';
    // tail: base at the rear, tip flicks on a slow sine with a faster tremble
    var flick = Math.sin(t * 1.8 + ph) * 16 + Math.sin(t * 5.3 + ph) * 4;
    ctx.strokeStyle = CAT; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(-44, 40);
    ctx.quadraticCurveTo(-86, 44, -84, 2 + flick); ctx.stroke();
    // body: haunch + chest, sitting side-on
    ell(-6, 16, 48, 37, CAT);
    ell(26, 4, 30, 43, CAT);
    // front leg + paw
    ctx.strokeStyle = CAT; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(32, 24); ctx.lineTo(48, 48); ctx.stroke();
    ell(56, 51, 13, 6, CAT);
    // head + ears
    circ(42, -40, 25, CAT);
    poly([24, -58, 30, -84, 46, -62], CAT);
    poly([48, -63, 62, -84, 66, -56], CAT);
    // eyes: the only colour on the cat
    circ(37, -42, 3.4, EYE);
    circ(55, -42, 3.4, EYE);
    ctx.restore();
  }

  function drawRabbit(x, y, t, ph) {
    ctx.save(); ctx.translate(x, y);
    ctx.lineWidth = 4; ctx.strokeStyle = INK;
    // ears: one steady, one twitching (brief pulses on a slow gate)
    var gate = Math.pow(Math.max(0, Math.sin(t * 0.9 + ph)), 24);
    var twitch = gate * Math.sin(t * 34) * 0.12;
    ctx.save(); ctx.translate(-44, -34); ctx.rotate(-0.22);
    ell(0, -26, 9, 30, RABBIT); ctx.beginPath(); ctx.ellipse(0, -26, 9, 30, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.translate(-28, -36); ctx.rotate(0.14 + twitch);
    ell(0, -26, 9, 30, RABBIT); ctx.beginPath(); ctx.ellipse(0, -26, 9, 30, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    // body + head, facing left
    ell(8, 14, 47, 34, RABBIT); ctx.beginPath(); ctx.ellipse(8, 14, 47, 34, 0, 0, Math.PI * 2); ctx.stroke();
    circ(-38, -16, 24, RABBIT); ctx.beginPath(); ctx.arc(-38, -16, 24, 0, Math.PI * 2); ctx.stroke();
    circ(50, 2, 11, RABBIT);                              // tail puff
    ell(16, 47, 21, 7, RABBIT); ctx.beginPath(); ctx.ellipse(16, 47, 21, 7, 0, 0, Math.PI * 2); ctx.stroke(); // foot
    circ(-47, -19, 3.6, INK);                             // eye
    circ(-61, -9, 2.6, INK);                              // nose
    ctx.restore();
  }

  function drawDoor(x, y, t, ph) {
    // origin at the base of the door (it stands on the frame's top edge)
    ctx.save(); ctx.translate(x, y);
    ctx.lineWidth = 4; ctx.strokeStyle = INK;
    rect(-46, -150, 92, 150, DOOR); ctx.strokeRect(-46, -150, 92, 150);
    rect(-34, -138, 68, 138, GLOW);                       // the lit inside
    poly([-34, -138, 12, -126, 12, 0, -34, 0], DOOR);     // panel ajar
    strokePath([-34, -138, 12, -126, 12, 0, -34, 0], true, INK, 4);
    circ(2, -66, 4, GLOW);                                // knob
    rect(-56, 0, 112, 8, DOOR);                           // step
    // smoke: flat puffs rising on a loop, sideways wobble
    for (var i = 0; i < 4; i++) {
      var cyc = ((t * 20 + i * 26 + ph * 10) % 104);
      var px = Math.sin((t * 1.4 + i * 1.7 + ph)) * 7;
      ell(px, -158 - cyc, 6 + cyc * 0.09, 5 + cyc * 0.07, SMOKE);
    }
    ctx.restore();
  }

  function drawBalloon(x, y, t, ph) {
    var bob = Math.sin(t * 1.25 + ph) * 7;
    ctx.save(); ctx.translate(x, y + bob);
    ctx.lineWidth = 4; ctx.strokeStyle = INK;
    ell(0, 0, 46, 56, BALLOON); ctx.beginPath(); ctx.ellipse(0, 0, 46, 56, 0, 0, Math.PI * 2); ctx.stroke();
    // smiley: two dot eyes, one arc mouth
    circ(-15, -12, 4, INK);
    circ(15, -12, 4, INK);
    ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 2, 20, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
    poly([-8, 56, 8, 56, 0, 70], BALLOON); strokePath([-8, 56, 8, 56, 0, 70], true, INK, 3);
    // string, swaying
    var sway = Math.sin(t * 1.6 + ph) * 8;
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 70);
    ctx.quadraticCurveTo(sway, 92, sway * 0.4, 116); ctx.stroke();
    ctx.restore();
  }

  var DRAWERS = { cat: drawCat, rabbit: drawRabbit, door: drawDoor, balloon: drawBalloon };

  function invaderPos(inv, t) {
    var m = MARKS[inv.type];
    var p = clamp01((t - inv.delay) / ENTRY);
    var e = easeOut(p);
    var x = m.sx + (m.x - m.sx) * e;
    var y = m.sy + (m.y - m.sy) * e;
    if (inv.type === 'rabbit' && p < 1) {
      y -= Math.abs(Math.sin(p * Math.PI * 4)) * 30 * (1 - p * 0.4);  // hop arc on the way in
    }
    if (inv.type === 'balloon' && p < 1) {
      x += Math.sin(p * Math.PI * 3 + inv.ph) * 10 * (1 - p);          // drift as it rises
    }
    return { x: x, y: y };
  }

  // ================= FRAME =================

  var viewW = 0, viewH = 0, dpr = 1;
  var isPhone = false;

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    viewW = w; viewH = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    var sw = (window.screen && window.screen.width) ? Math.min(window.screen.width, window.screen.height) : 0;
    isPhone = sw ? (sw < 700) : (h > w * 1.15);
  }

  function draw(t) {
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rect(0, 0, viewW, viewH, MARGIN);
    var s = Math.min(viewW, viewH) / 1080;
    var ox = (viewW - 1080 * s) / 2, oy = (viewH - 1080 * s) / 2;
    ctx.translate(ox, oy); ctx.scale(s, s);

    // the painting, clipped, untouched by everything else
    ctx.save();
    ctx.translate(PX, PY);
    ctx.beginPath(); ctx.rect(0, 0, PW, PH); ctx.clip();
    CLASSICS[state.classic]();
    ctx.restore();
    ctx.lineWidth = 5; ctx.strokeStyle = INK;
    ctx.strokeRect(PX, PY, PW, PH);

    // the invasion, at the margins
    for (var i = 0; i < state.invaders.length; i++) {
      var inv = state.invaders[i];
      var pos = invaderPos(inv, t);
      DRAWERS[inv.type](pos.x, pos.y, t, inv.ph);
    }

    // hint
    ctx.fillStyle = HINT;
    ctx.font = (isPhone ? 30 : 26) + 'px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('tap', 1052, 1050);
  }

  // ================= RUN =================

  var pendingRestart = false;   // set by a tap: the clock restarts on the next frame

  function reseed() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    state = generate(seed);
    pendingRestart = true;
  }
  canvas.addEventListener('pointerdown', reseed);
  canvas.addEventListener('touchstart', reseed);

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(PHASE0); });
  }
  window.addEventListener('resize', function () { resize(); draw(PHASE0); });

  resize();
  draw(PHASE0);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts - PHASE0 * 1000;   // continue from the first frame's phase
      if (pendingRestart) { t0 = ts; pendingRestart = false; }
      draw((ts - t0) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
