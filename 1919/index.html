<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1919 Sea of Low Tones</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0e24; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var BG = '#0a0e24';        // abyssal indigo ground, page ground too
  var DEEP = '#04060d';      // near-black, the depths below the lowest swell
  var TEAL = '#0d4f5c';      // wave pressure, deep teal
  var TEAL_MID = '#14606e';  // mid wave body
  var TEAL_LT = '#1b7d8a';   // crest light
  var SILVER = '#c9ced6';    // harmonic filaments
  var SILVER_LT = '#e8ebef'; // bright filament core
  var PAPER = '#d9d2c0';     // liner-note sediment, faded paper white
  var INK = '#dfe3ea';       // title and hint
  var INK_SOFT = '#8f97ad';  // date line, muted blue-grey

  // Fixed-phase first frame: t = 31 s. A swell is mid-crossing on the
  // third band with silver filaments riding its crest, and the harmonic
  // plucked at 26 s is five seconds into its ring, still bright, already
  // being swallowed by the next wave. Sediment lines drift in the depths.
  // Frame one is byte-reproducible: every wave, filament, ping and
  // sediment line is a pure function of t.
  var FIRST_T = 31;

  // Timeline: 60 s cycle. Harmonic pings are plucked at fixed seconds
  // (7, 26, 45) at fixed positions, then decay and are swallowed.
  var CYCLE = 60;
  var PINGS = [
    { t: 7,  x: 0.30, y: 0.30 },
    { t: 26, x: 0.62, y: 0.48 },
    { t: 45, x: 0.44, y: 0.66 }
  ];

  // Sediment: short original liner-note-like fragments, half-buried in
  // the depths, scrolling with the current. No real lyrics.
  var SEDIMENT = [
    { text: 'the tuning was never written down', y: 0.24, speed: 7,  alpha: 0.10, size: 1.00 },
    { text: 'four strings, five tunings, one room', y: 0.40, speed: 10, alpha: 0.08, size: 0.92 },
    { text: 'the low end holds the floor', y: 0.55, speed: 6,  alpha: 0.11, size: 1.05 },
    { text: 'a note left ringing in the stairwell', y: 0.70, speed: 9,  alpha: 0.07, size: 0.88 },
    { text: 'gatefold, second pressing, still warm', y: 0.86, speed: 8,  alpha: 0.09, size: 0.95 },
    { text: 'the bass arrives before the song', y: 0.94, speed: 11, alpha: 0.06, size: 0.85 },
    { text: 'tuned by ear, in the dark', y: 0.32, speed: 12, alpha: 0.06, size: 0.85 }
  ];

  // Five swell bands, back to front. Each band is a slow sine field:
  // two long waves drifting at different slow rates, so the sets roll
  // left to right and never repeat exactly within a cycle.
  var BANDS = [
    { base: 0.16, amp: 0.030, k1: 2.1, w1: 0.16, k2: 4.6, w2: 0.11, ph: 0.0, fill: 0.10 },
    { base: 0.32, amp: 0.038, k1: 1.8, w1: 0.13, k2: 4.1, w2: 0.09, ph: 1.7, fill: 0.12 },
    { base: 0.48, amp: 0.046, k1: 2.3, w1: 0.15, k2: 5.0, w2: 0.10, ph: 3.4, fill: 0.14 },
    { base: 0.64, amp: 0.052, k1: 1.9, w1: 0.12, k2: 4.4, w2: 0.08, ph: 5.1, fill: 0.17 },
    { base: 0.80, amp: 0.058, k1: 2.2, w1: 0.14, k2: 4.8, w2: 0.09, ph: 2.2, fill: 0.20 }
  ];

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Height of the swell surface for band b at horizontal position x,
  // time t. Two long sines: the slow sub-bass swell and its riding wave.
  function bandY(b, x, t) {
    var u = x / W; // 0..1 across the frame
    var y = b.base * H
      + Math.sin(u * Math.PI * b.k1 - t * b.w1 + b.ph) * b.amp * H
      + Math.sin(u * Math.PI * b.k2 - t * b.w2 + b.ph * 2.3) * b.amp * H * 0.45;
    return y;
  }

  // Local slope of a band at x, used to light the filaments where the
  // wave is steepest near its crest.
  function bandSlope(b, x, t) {
    var e = Math.max(2, W * 0.004);
    return (bandY(b, x + e, t) - bandY(b, x - e, t)) / (2 * e);
  }

  // Liner-note sediment: faint fragments drifting left to right with the
  // current, wrapping around the frame, half-buried in the depths.
  function drawSediment(t) {
    ctx.textBaseline = 'alphabetic';
    for (var i = 0; i < SEDIMENT.length; i++) {
      var s = SEDIMENT[i];
      var fs = Math.round(clamp(W / 46, 11, 17) * s.size);
      ctx.font = 'italic ' + fs + 'px Georgia, "Times New Roman", serif';
      var tw = ctx.measureText(s.text).width;
      var span = W + tw + 240;
      var x = ((hash(i * 17 + 5) * span + s.speed * t) % span) - tw - 120;
      var y = s.y * H + Math.sin(t * 0.10 + i * 2.2) * H * 0.006;
      ctx.fillStyle = hexA(PAPER, a4(s.alpha));
      ctx.fillText(s.text, x, y);
    }
  }

  // One swell band: a pressure body filled down to the bottom of the
  // frame in deep teal, then its crest line, then silver filaments
  // riding the crest where the wave is steepest.
  function drawBand(b, t) {
    var step = Math.max(2, W / 260);
    var xs = [];
    var ys = [];
    for (var x = 0; x <= W; x += step) {
      xs.push(x); ys.push(bandY(b, x, t));
    }
    xs.push(W); ys.push(bandY(b, W, t));

    // Pressure body: fill from the surface down, deepening toward the
    // bottom of the frame.
    ctx.fillStyle = hexA(TEAL, a4(b.fill));
    ctx.beginPath();
    ctx.moveTo(0, ys[0]);
    for (var i = 1; i < xs.length; i++) { ctx.lineTo(xs[i], ys[i]); }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();

    // Crest line in lighter teal.
    ctx.strokeStyle = hexA(TEAL_LT, 0.55);
    ctx.lineWidth = Math.max(1.2, H * 0.0022);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var j = 0; j < xs.length; j++) {
      if (j === 0) { ctx.moveTo(xs[j], ys[j]); }
      else { ctx.lineTo(xs[j], ys[j]); }
    }
    ctx.stroke();

    // Filaments: thin silver threads where the surface is near its crest
    ctx.lineCap = 'round';
    var started = false;
    ctx.beginPath();
    for (var k = 0; k < xs.length; k++) {
      var prox = clamp((b.base * H - ys[k]) / (b.amp * H * 1.35), 0, 1);
      var sl = bandSlope(b, xs[k], t);
      if (prox > 0.55 && sl < 0.02) {
        var fy = ys[k] - Math.max(1.5, H * 0.003);
        if (!started) {
          ctx.strokeStyle = hexA(SILVER, a4(0.25 + 0.6 * prox));
          ctx.lineWidth = Math.max(0.8, H * 0.0016);
          ctx.beginPath();
          ctx.moveTo(xs[k], fy);
          started = true;
        } else {
          ctx.lineTo(xs[k], fy);
        }
      } else {
        if (started) { ctx.stroke(); started = false; }
      }
    }
    if (started) { ctx.stroke(); }
  }

  // Harmonic pings: a single upper-register harmonic plucked at a fixed
  // second, ringing out as an expanding silver ring that decays and is
  // swallowed by the next wave.
  function drawPings(t) {
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    for (var i = 0; i < PINGS.length; i++) {
      var p = PINGS[i];
      var age = ph - p.t;
      if (age < 0 || age > 14) { continue; }
      var px = p.x * W;
      var py = p.y * H + Math.sin(px / W * Math.PI * 2.1 - t * 0.15) * H * 0.02;
      var r = age * H * 0.022;
      var a = 0.85 * Math.exp(-age / 5.5);
      if (a <= 0.01) { continue; }
      ctx.strokeStyle = hexA(SILVER_LT, a4(a));
      ctx.lineWidth = Math.max(1, H * 0.0028 * (1 - age / 20));
      ctx.beginPath(); ctx.moveTo(px + r, py); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.stroke();
      // The pluck point itself, a bright dot fading with the ring.
      var pr = Math.max(2, H * 0.006 * (1 - age / 16));
      ctx.fillStyle = hexA(SILVER_LT, a4(a));
      ctx.beginPath(); ctx.moveTo(px + pr, py); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Abyssal indigo ground, deepening to near-black at the bottom.
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = hexA(DEEP, 0.55);
    ctx.fillRect(0, H * 0.62, W, H * 0.38);

    drawSediment(t);

    // Swell bands back to front; each later band buries the sediment
    // and filaments beneath it a little deeper.
    for (var i = 0; i < BANDS.length; i++) {
      drawBand(BANDS[i], t);
    }

    drawPings(t);

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Sea of Low Tones', 18, 34);
    ctx.fillStyle = INK_SOFT;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1919 · 2007 · 04 · 14', 18, 34 + fs2 + 8);

    // Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK_SOFT, 0.9);
    ctx.textAlign = 'center';
    var hint = 'Watch the swells roll and the harmonics ring out over them.';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    if (W < 560) {
      ctx.fillText('Watch the swells roll and the harmonics', W / 2, H - 34);
      ctx.fillText('ring out over them.', W / 2, H - 16);
    } else {
      ctx.fillText(hint, W / 2, H - 20);
    }
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs under 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
