<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Always Changing</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #8A8D90;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Strict palette. Nothing else is ever drawn; shading is done by
  // layering these tones at partial alpha, never by inventing new hues.
  var STONE = [138, 141, 144];   // #8A8D90
  var WATER = [127, 184, 201];   // #7FB8C9
  var FOAM  = [238, 246, 248];   // #EEF6F8
  var BOUG1 = [194, 46, 107];    // #C22E6B
  var BOUG2 = [216, 74, 90];     // #D84A5A
  var AZAL1 = [232, 106, 154];   // #E86A9A
  var AZAL2 = [216, 64, 122];    // #D8407A
  var RUST  = [122, 74, 51];     // #7A4A33
  var SKY   = [175, 200, 232];   // #AFC8E8
  var GREEN = [62, 107, 74];     // #3E6B4A

  function cl(v) { return Math.max(0, Math.min(255, Math.round(v))); }
  function rgba(c, a) { return 'rgba(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ',' + a + ')'; }
  function rgb(c) { return 'rgb(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ')'; }
  function lerp(a, b, u) { return a + (b - a) * u; }

  // Seeded RNG (mulberry32). One stream builds the whole garden once.
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var z = s;
      z = Math.imul(z ^ (z >>> 15), z | 1);
      z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
      return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Season -------------------------------------------------------------
  // Pure function of the local DATE at day resolution: the month's bloom
  // anchor, blended toward the next month by day-of-month. No other Date
  // fields are read anywhere in the piece.
  var BLOOM_BY_MONTH = [0.05, 0.10, 0.45, 1.00, 0.95, 0.60, 0.50, 0.45, 0.35, 0.25, 0.12, 0.05]; // Jan..Dec
  var now = new Date();
  var curMonth = now.getMonth();
  var curDay = now.getDate();
  var searchStr = '';
  try {
    searchStr = (window.location && window.location.search) ||
      (typeof location !== 'undefined' ? location.search : '') || '';
  } catch (e) { searchStr = ''; }
  var forceMonth = /[?&]seed=month(\d{1,2})/.exec(searchStr);
  if (forceMonth) { curMonth = Math.max(0, Math.min(11, parseInt(forceMonth[1], 10) - 1)); curDay = 15; }
  var bloom = lerp(
    BLOOM_BY_MONTH[curMonth],
    BLOOM_BY_MONTH[(curMonth + 1) % 12],
    Math.max(0, Math.min(1, (curDay - 1) / 30))
  );

  // ---- Garden layout (unit space, built once from the seed) ---------------
  var rng = mulberry32(75812031);

  // Stream path: upper-left to the bowl pool at lower-right.
  var P0 = { x: 0.05, y: 0.07 };
  var P1 = { x: 0.74, y: 0.72 };
  var DX = P1.x - P0.x, DY = P1.y - P0.y;
  var PLEN = Math.sqrt(DX * DX + DY * DY);
  var UX = DX / PLEN, UY = DY / PLEN;      // downstream unit vector
  var NX = -UY, NY = UX;                   // channel normal
  var STEPS = 9;
  var CHW = 0.085;                          // channel half width (unit)

  function pathPoint(p, lane) {
    return {
      x: P0.x + DX * p + NX * lane,
      y: P0.y + DY * p + NY * lane
    };
  }

  // Planted banks: soft green masses flanking the stream (seeded ellipses).
  var banks = [];
  for (var bi = 0; bi < 26; bi++) {
    var bp = 0.04 + rng() * 0.92;
    var side = rng() < 0.5 ? -1 : 1;
    var off = CHW + 0.05 + rng() * 0.13;
    var c = pathPoint(bp, side * off);
    banks.push({ x: c.x, y: c.y, rx: 0.05 + rng() * 0.09, ry: 0.03 + rng() * 0.05, a: 0.05 + rng() * 0.08 });
  }
  // Lower-left and upper-right ground planting, away from the stream.
  for (var gi = 0; gi < 10; gi++) {
    banks.push({
      x: 0.04 + rng() * 0.30, y: 0.55 + rng() * 0.40,
      rx: 0.05 + rng() * 0.08, ry: 0.03 + rng() * 0.05, a: 0.04 + rng() * 0.06
    });
  }

  // Bowers: rebar arc fans in both top corners with bougainvillea clusters.
  function makeBower(cx, cy, flip) {
    var arcs = [];
    for (var i = 0; i < 5; i++) {
      arcs.push({ r: 0.055 + i * 0.026, w: 1.6 + rng() * 1.2 });
    }
    var blobs = [];
    for (var j = 0; j < 130; j++) {
      var ang = (0.08 + rng() * 0.84) * Math.PI;         // lower half fan
      var rad = 0.045 + Math.pow(rng(), 0.7) * 0.155;
      blobs.push({
        x: cx + Math.cos(ang) * rad * flip,
        y: cy + Math.sin(ang) * rad * 0.82,
        r: 0.006 + rng() * 0.011,
        tone: rng() < 0.55 ? BOUG1 : BOUG2,
        a: 0.35 + rng() * 0.5
      });
    }
    return { cx: cx, cy: cy, flip: flip, arcs: arcs, blobs: blobs };
  }
  var bowers = [makeBower(0.055, 0.015, 1), makeBower(0.945, 0.015, -1)];

  // Pool and azalea maze: three interlocking rings.
  var POOL = { x: 0.76, y: 0.76, r: 0.185 };
  var maze = (function () {
    var rings = [];
    var mr = 0.082;
    for (var i = 0; i < 3; i++) {
      var a = -Math.PI / 2 + i * (Math.PI * 2 / 3);
      rings.push({ x: POOL.x + Math.cos(a) * mr * 0.52, y: POOL.y + Math.sin(a) * mr * 0.52, r: mr });
    }
    var dots = [];
    for (var k = 0; k < 240; k++) {
      var ring = rings[k % 3];
      var th = rng() * Math.PI * 2;
      var rr = ring.r * (0.86 + rng() * 0.28);
      dots.push({
        x: ring.x + Math.cos(th) * rr,
        y: ring.y + Math.sin(th) * rr,
        r: 0.005 + rng() * 0.008,
        tone: rng() < 0.5 ? AZAL1 : AZAL2,
        keep: rng()                          // per-dot bloom threshold
      });
    }
    return { rings: rings, dots: dots };
  })();

  // Water particles: closed-form paths. Each particle owns a period and a
  // phase; progress is a pure function of t, so any frame is reproducible
  // and the combined flow effectively never repeats (periods are long and
  // mutually incommensurate).
  var particles = [];
  for (var pi = 0; pi < 240; pi++) {
    particles.push({
      lane: (rng() * 2 - 1) * CHW * 0.78,
      period: 7 + rng() * 9 + (pi % 7) * 1.37,
      phase: rng(),
      size: 0.0022 + rng() * 0.0032,
      wob: rng() * Math.PI * 2
    });
  }
  // Splash motes anchored at step edges: short periodic bursts.
  var splashes = [];
  for (var si = 1; si < STEPS; si++) {
    for (var sj = 0; sj < 7; sj++) {
      splashes.push({
        step: si,
        lane: (rng() * 2 - 1) * CHW * 0.8,
        period: 1.6 + rng() * 2.6,
        phase: rng(),
        dir: rng() * Math.PI * 2,
        reach: 0.008 + rng() * 0.02,
        size: 0.0016 + rng() * 0.0024
      });
    }
  }
  // Pool ripple rings.
  var ripples = [];
  for (var ri = 0; ri < 5; ri++) {
    ripples.push({ period: 6 + ri * 1.93, phase: rng(), max: 0.55 + rng() * 0.4 });
  }

  // ---- Dam (drag upstream) -------------------------------------------------
  // Recorded pointer events only; frame one has none. While held, upstream
  // progress compresses toward the dam line (water pools). On release a
  // short surge envelope speeds the backed-up reach, then flow is normal.
  var dam = { active: false, p: 0.5, downT: 0, upT: -10 };
  var lastT = 0;

  function progressOf(x, y, W, H) {
    var ux = x / W - P0.x, uy = y / H - P0.y;
    return Math.max(0, Math.min(1, (ux * DX + uy * DY) / (PLEN * PLEN)));
  }

  function damWarp(p, t) {
    var k = 0;
    if (dam.active) k = Math.min(1, (t - dam.downT) / 0.6);
    else if (t - dam.upT < 3) k = Math.max(0, 1 - (t - dam.upT) / 0.8);
    if (k > 0 && p < dam.p) {
      return dam.p - (dam.p - p) * (1 - 0.5 * k);
    }
    if (!dam.active && t - dam.upT < 3 && p < dam.p + 0.25) {
      var s = Math.exp(-(t - dam.upT) / 0.9) * 0.05 * Math.max(0, 1 - Math.abs(p - dam.p) / 0.25);
      return p + s;
    }
    return p;
  }

  // ---- Sizing ---------------------------------------------------------------
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  function X(u) { return u * W; }
  function Y(u) { return u * H; }
  function S(u) { return u * Math.min(W, H); }

  // ---- Draw ------------------------------------------------------------------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    lastT = t;

    // Ground: stone, with the pale sky wash breathing down from the top.
    ctx.fillStyle = rgb(STONE);
    ctx.fillRect(0, 0, W, H);
    for (var wb = 0; wb < 7; wb++) {
      ctx.fillStyle = rgba(SKY, 0.05);
      ctx.fillRect(0, 0, W, H * 0.42 * (1 - wb / 7));
    }

    // Planted banks.
    for (var b = 0; b < banks.length; b++) {
      var bk = banks[b];
      ctx.beginPath();
      ctx.ellipse(X(bk.x), Y(bk.y), X(bk.rx), Y(bk.ry), 0, 0, Math.PI * 2);
      ctx.fillStyle = rgba(GREEN, bk.a);
      ctx.fill();
    }

    // Chadar steps: for each step, a shaded tread quad and a riser band at
    // its downhill edge. Stone value comes from layered palette tones:
    // sky-wash lightens treads, green-grey deepens risers and side walls.
    var i, pA, pB, c1, c2, c3, c4;
    // Channel bed side walls (underlay, slightly wider than the water).
    ctx.beginPath();
    c1 = pathPoint(0, -CHW * 1.25); c2 = pathPoint(0, CHW * 1.25);
    c3 = pathPoint(1, CHW * 1.25); c4 = pathPoint(1, -CHW * 1.25);
    ctx.moveTo(X(c1.x), Y(c1.y)); ctx.lineTo(X(c2.x), Y(c2.y));
    ctx.lineTo(X(c3.x), Y(c3.y)); ctx.lineTo(X(c4.x), Y(c4.y));
    ctx.closePath();
    ctx.fillStyle = rgba(GREEN, 0.20);
    ctx.fill();
    ctx.fillStyle = rgba(STONE, 0.35);
    ctx.fill();

    for (i = 0; i < STEPS; i++) {
      pA = i / STEPS; pB = (i + 1) / STEPS;
      c1 = pathPoint(pA, -CHW); c2 = pathPoint(pA, CHW);
      c3 = pathPoint(pB, CHW); c4 = pathPoint(pB, -CHW);
      ctx.beginPath();
      ctx.moveTo(X(c1.x), Y(c1.y)); ctx.lineTo(X(c2.x), Y(c2.y));
      ctx.lineTo(X(c3.x), Y(c3.y)); ctx.lineTo(X(c4.x), Y(c4.y));
      ctx.closePath();
      // Bed: water over stone, lightened tread wash.
      ctx.fillStyle = rgba(WATER, 0.34);
      ctx.fill();
      ctx.fillStyle = rgba(SKY, i % 2 === 0 ? 0.10 : 0.05);
      ctx.fill();
      // Riser: the drop face at the downhill edge of the step.
      var rp = pB - 0.16 / STEPS;
      var r1 = pathPoint(rp, -CHW), r2 = pathPoint(rp, CHW);
      ctx.beginPath();
      ctx.moveTo(X(r1.x), Y(r1.y)); ctx.lineTo(X(r2.x), Y(r2.y));
      ctx.lineTo(X(c3.x), Y(c3.y)); ctx.lineTo(X(c4.x), Y(c4.y));
      ctx.closePath();
      ctx.fillStyle = rgba(GREEN, 0.22);
      ctx.fill();
      ctx.fillStyle = rgba(FOAM, 0.13);
      ctx.fill();
      // Step edge line: foam catching the drop.
      ctx.beginPath();
      ctx.moveTo(X(c4.x), Y(c4.y)); ctx.lineTo(X(c3.x), Y(c3.y));
      ctx.strokeStyle = rgba(FOAM, 0.35);
      ctx.lineWidth = Math.max(1, S(0.0022));
      ctx.stroke();
    }

    // Splash motes at the step edges: periodic bursts, closed-form in t.
    for (var s2 = 0; s2 < splashes.length; s2++) {
      var sp = splashes[s2];
      var u = ((t / sp.period + sp.phase) % 1 + 1) % 1;
      var base = pathPoint(sp.step / STEPS, sp.lane);
      var ox = Math.cos(sp.dir) * sp.reach * u;
      var oy = Math.sin(sp.dir) * sp.reach * u - 0.012 * u * (1 - u) * 4 * 0.3;
      ctx.beginPath();
      ctx.arc(X(base.x + ox), Y(base.y + oy), S(sp.size) * (0.7 + u), 0, Math.PI * 2);
      ctx.fillStyle = rgba(FOAM, 0.75 * (1 - u));
      ctx.fill();
    }

    // Flowing water particles: brighten as they cross each step drop.
    for (var q = 0; q < particles.length; q++) {
      var pt = particles[q];
      var raw = ((t / pt.period + pt.phase) % 1 + 1) % 1;
      var p = damWarp(raw, t);
      var wobble = Math.sin(t * 0.9 + pt.wob) * CHW * 0.05;
      var pos = pathPoint(p, pt.lane + wobble);
      var stepFrac = (p * STEPS) % 1;
      var dropGlow = stepFrac > 0.86 ? (stepFrac - 0.86) / 0.14 : 0;
      ctx.beginPath();
      ctx.arc(X(pos.x), Y(pos.y), S(pt.size) * (1 + dropGlow * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = rgba(WATER, 0.55);
      ctx.fill();
      if (dropGlow > 0.05) {
        ctx.beginPath();
        ctx.arc(X(pos.x), Y(pos.y), S(pt.size) * 0.8, 0, Math.PI * 2);
        ctx.fillStyle = rgba(FOAM, 0.65 * dropGlow);
        ctx.fill();
      }
    }

    // Bowl pool.
    ctx.beginPath();
    ctx.ellipse(X(POOL.x), Y(POOL.y), X(POOL.r), Y(POOL.r) * 0.86, 0, 0, Math.PI * 2);
    ctx.fillStyle = rgba(WATER, 0.5);
    ctx.fill();
    ctx.fillStyle = rgba(SKY, 0.12);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(X(POOL.x), Y(POOL.y), X(POOL.r), Y(POOL.r) * 0.86, 0, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(STONE, 0.9);
    ctx.lineWidth = Math.max(1.5, S(0.004));
    ctx.stroke();

    // Ripples on the pool.
    for (var r2 = 0; r2 < ripples.length; r2++) {
      var rp2 = ripples[r2];
      var ru = ((t / rp2.period + rp2.phase) % 1 + 1) % 1;
      ctx.beginPath();
      ctx.ellipse(X(POOL.x), Y(POOL.y), X(POOL.r) * rp2.max * ru, Y(POOL.r) * 0.86 * rp2.max * ru, 0, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(FOAM, 0.28 * (1 - ru));
      ctx.lineWidth = Math.max(1, S(0.0018));
      ctx.stroke();
    }

    // Azalea maze: green structure rings always; bloom dots appear per
    // dot when the season's bloom factor passes the dot's threshold.
    for (var m = 0; m < maze.rings.length; m++) {
      var ring = maze.rings[m];
      ctx.beginPath();
      ctx.arc(X(ring.x), Y(ring.y), S(ring.r), 0, Math.PI * 2);
      ctx.strokeStyle = rgba(GREEN, 0.85);
      ctx.lineWidth = Math.max(2, S(0.007));
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(X(ring.x), Y(ring.y), S(ring.r), 0, Math.PI * 2);
      ctx.strokeStyle = rgba(STONE, 0.25);
      ctx.lineWidth = Math.max(1, S(0.0025));
      ctx.stroke();
    }
    for (var d = 0; d < maze.dots.length; d++) {
      var dt = maze.dots[d];
      var vis = (bloom - dt.keep * 0.85) / 0.15;
      if (vis <= 0) continue;
      vis = Math.min(1, vis);
      ctx.beginPath();
      ctx.arc(X(dt.x), Y(dt.y), S(dt.r) * (0.45 + 0.55 * bloom), 0, Math.PI * 2);
      ctx.fillStyle = rgba(dt.tone, 0.75 * vis);
      ctx.fill();
    }
    // Winter-bare hint: a few stone-tone buds on the rings when bloom is low.
    if (bloom < 0.2) {
      for (var d2 = 0; d2 < maze.dots.length; d2 += 6) {
        var bd = maze.dots[d2];
        ctx.beginPath();
        ctx.arc(X(bd.x), Y(bd.y), S(bd.r) * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = rgba(RUST, 0.35);
        ctx.fill();
      }
    }

    // Bowers: rebar arcs, then bougainvillea.
    for (var bw = 0; bw < bowers.length; bw++) {
      var bo = bowers[bw];
      for (var a2 = 0; a2 < bo.arcs.length; a2++) {
        var arc = bo.arcs[a2];
        ctx.beginPath();
        ctx.ellipse(X(bo.cx), Y(bo.cy), X(arc.r), Y(arc.r) * 0.82, 0, 0, Math.PI);
        ctx.strokeStyle = rgba(RUST, 0.8);
        ctx.lineWidth = Math.max(1, S(0.0028));
        ctx.stroke();
      }
      for (var bb = 0; bb < bo.blobs.length; bb++) {
        var bl = bo.blobs[bb];
        ctx.beginPath();
        ctx.arc(X(bl.x), Y(bl.y), S(bl.r), 0, Math.PI * 2);
        ctx.fillStyle = rgba(bl.tone, bl.a);
        ctx.fill();
      }
    }

    if (typeof document !== 'undefined' && document.body && document.body.style) {
      document.body.style.background = rgb(STONE);
    }
  }

  // Inert QA hook (house convention): ?seed=tNN draws at loop time NN;
  // ?seed=monthN forces the season month. Without it, t starts at 0 and
  // the season is today's.
  var startT = 0;
  var tm = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(searchStr);
  if (tm) startT = parseFloat(tm[1]);

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(startT); });
  }
  window.addEventListener('resize', function () { resize(); draw(startT); });

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (ev) {
      dam.active = true;
      dam.downT = lastT;
      dam.p = progressOf(ev.clientX || 0, ev.clientY || 0, W, H);
    });
    canvas.addEventListener('pointermove', function (ev) {
      if (dam.active) dam.p = progressOf(ev.clientX || 0, ev.clientY || 0, W, H);
    });
    var release = function () {
      if (dam.active) { dam.active = false; dam.upT = lastT; }
    };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    canvas.addEventListener('pointerleave', release);
  }

  // Frame one: the synchronous draw at t = 0, in today's season.
  draw(startT);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts;
      draw(startT + (ts - t0) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
