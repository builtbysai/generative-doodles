<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athanor's Verbal Score</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0B0D; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  var GROUND = '#0B0B0D';
  var PARCH = '#EDE4D3';
  var RED = '#C8102E';
  var INK = '#1A1A1E';
  var BURN_LEN = 6.0;

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');

  // Seeded RNG (mulberry32)
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var PHRASE_TEXTS = ['a flurry of notes', 'the choir enters', 'let it ring'];
  var KINDS = ['flurry', 'choir', 'ring'];

  // Drift + particle seeds, all fixed at load from one seeded stream.
  var rng = mulberry32(823100);
  var phrases = [];
  var i, j;
  for (i = 0; i < 3; i++) {
    var baseFX = [0.30, 0.66, 0.44][i];
    var baseFY = [0.30, 0.52, 0.74][i];
    phrases.push({
      text: PHRASE_TEXTS[i],
      kind: KINDS[i],
      baseFX: baseFX,
      baseFY: baseFY,
      ampFX: 0.045 + rng() * 0.03,
      ampFY: 0.035 + rng() * 0.025,
      w1: 0.05 + rng() * 0.03,
      w2: 0.037 + rng() * 0.026,
      p1: rng() * Math.PI * 2,
      p2: rng() * Math.PI * 2,
      bounds: null
    });
  }

  // Per-phrase texture particle seeds (fixed, deterministic).
  var flurryParts = [];
  var prng = mulberry32(823201);
  for (i = 0; i < 52; i++) {
    flurryParts.push({
      ang: prng() * Math.PI * 2,
      spd: 0.25 + prng() * 0.95,
      delay: prng() * 0.55,
      len: 0.5 + prng() * 0.9,
      spin: (prng() - 0.5) * 2.4,
      size: 0.7 + prng() * 0.8
    });
  }
  var choirArcs = [];
  var crng = mulberry32(823202);
  for (i = 0; i < 6; i++) {
    choirArcs.push({ delay: i * 0.11 + crng() * 0.05, wob: (crng() - 0.5) * 0.14 });
  }
  var ringWaves = [];
  var rrng = mulberry32(823203);
  for (i = 0; i < 5; i++) {
    ringWaves.push({ delay: i * 0.16 + rrng() * 0.05 });
  }

  // Recorded burn events: { phrase, t0, samples: [{dt, ox, oy}] }
  // ox/oy are smear offsets relative to the phrase anchor at sample time.
  var burns = [];

  var W = 0, H = 0, DPR = 1, fontPx = 28;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return H > W * 1.15;
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 300);
    var h = vv ? vv.height : (window.innerHeight || 300);
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    fontPx = Math.max(15, Math.min(34, Math.min(W, H) * (isPhone() ? 0.055 : 0.042)));
  }

  function phrasePos(ph, t) {
    var x = (ph.baseFX + ph.ampFX * Math.sin(ph.w1 * t * Math.PI * 2 + ph.p1)) * W;
    var y = (ph.baseFY + ph.ampFY * Math.sin(ph.w2 * t * Math.PI * 2 + ph.p2)) * H;
    return { x: x, y: y };
  }

  function clampToFrame(ph, pos) {
    ctx.font = font();
    var tw = ctx.measureText(ph.text).width;
    var hw = tw / 2 + 10;
    var hh = fontPx * 0.9 + 10;
    var x = Math.max(hw, Math.min(W - hw, pos.x));
    var y = Math.max(hh, Math.min(H - hh, pos.y));
    ph.bounds = { x0: x - hw, y0: y - hh, x1: x + hw, y1: y + hh };
    return { x: x, y: y };
  }

  function font() {
    return 'italic 400 ' + fontPx.toFixed(1) + 'px Georgia, "Times New Roman", serif';
  }

  function mixToRed(parch, amt) {
    // parchment (237,228,211) to red (200,16,46), closed-form per amt
    var r = Math.round(237 + (200 - 237) * amt);
    var g = Math.round(228 + (16 - 228) * amt);
    var b = Math.round(211 + (46 - 211) * amt);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function activeBurn(idx, t) {
    for (var k = burns.length - 1; k >= 0; k--) {
      if (burns[k].phrase === idx && t - burns[k].t0 >= 0 && t - burns[k].t0 < BURN_LEN) return burns[k];
    }
    return null;
  }

  function smearOffset(burn, age) {
    var s = burn.samples;
    if (!s.length) return { x: 0, y: 0 };
    if (age <= s[0].dt) return { x: s[0].ox, y: s[0].oy };
    for (var k = 1; k < s.length; k++) {
      if (age <= s[k].dt) {
        var a = s[k - 1], b = s[k];
        var f = (age - a.dt) / Math.max(0.0001, b.dt - a.dt);
        return { x: a.ox + (b.ox - a.ox) * f, y: a.oy + (b.oy - a.oy) * f };
      }
    }
    var last = s[s.length - 1];
    return { x: last.ox, y: last.oy };
  }

  // Texture: flurry of notes. Red emission particles (dots with short stems).
  function drawFlurry(cx, cy, age, scale) {
    var life = age / BURN_LEN;
    for (var k = 0; k < flurryParts.length; k++) {
      var p = flurryParts[k];
      var la = age - p.delay * BURN_LEN * 0.5;
      if (la < 0) continue;
      var lt = la / (BURN_LEN * 0.75);
      if (lt > 1) continue;
      var dist = p.spd * scale * 3.4 * Math.pow(lt, 0.72) * fontPx * 2.2;
      var ang = p.ang + p.spin * lt * 0.6;
      var x = cx + Math.cos(ang) * dist;
      var y = cy + Math.sin(ang) * dist * 0.72 - lt * fontPx * 0.7;
      var a = (1 - lt) * (0.35 + 0.65 * (1 - life)) ;
      if (a <= 0.01) continue;
      ctx.save();
      ctx.globalAlpha = Math.min(1, a);
      ctx.strokeStyle = RED;
      ctx.fillStyle = RED;
      ctx.lineWidth = Math.max(1, fontPx * 0.05 * p.size);
      var r = fontPx * 0.11 * p.size;
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 0.72, -0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + r * 0.85, y - r * 0.4);
      ctx.lineTo(x + r * 0.85, y - r * 0.4 - fontPx * 0.34 * p.len);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Texture: choir. Stacked arcs rising above the phrase; ink arcs with a
  // red under-stroke so the edges read lit by the flare.
  function drawChoir(cx, cy, age, scale) {
    for (var k = 0; k < choirArcs.length; k++) {
      var arc = choirArcs[k];
      var la = (age / BURN_LEN) - arc.delay;
      if (la < 0 || la > 1) continue;
      var grow = 1 - Math.pow(1 - Math.min(1, la * 1.6), 3);
      var fade = la < 0.7 ? 1 : 1 - (la - 0.7) / 0.3;
      var r = (0.55 + k * 0.34) * fontPx * 1.55 * grow * scale;
      var yOff = -fontPx * (0.55 + k * 0.16) - grow * fontPx * 0.22;
      var wob = arc.wob;
      ctx.save();
      ctx.globalAlpha = 0.9 * fade;
      ctx.lineWidth = Math.max(1.4, fontPx * 0.10);
      ctx.strokeStyle = RED;
      ctx.beginPath();
      ctx.ellipse(cx, cy + yOff, r, r * (0.52 + wob * 0.2), 0, Math.PI * 1.08, Math.PI * 1.92);
      ctx.stroke();
      ctx.lineWidth = Math.max(1, fontPx * 0.065);
      ctx.strokeStyle = INK;
      ctx.beginPath();
      ctx.ellipse(cx, cy + yOff, r, r * (0.52 + wob * 0.2), 0, Math.PI * 1.08, Math.PI * 1.92);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Texture: ring. Expanding concentric circles; ink stroke over a red
  // under-stroke, same lit-edge treatment as the choir arcs.
  function drawRing(cx, cy, age, scale) {
    for (var k = 0; k < ringWaves.length; k++) {
      var wv = ringWaves[k];
      var la = (age / BURN_LEN) - wv.delay;
      if (la < 0 || la > 1) continue;
      var r = la * fontPx * 5.2 * scale;
      var fade = 1 - la;
      ctx.save();
      ctx.globalAlpha = 0.9 * fade;
      ctx.lineWidth = Math.max(1.4, fontPx * 0.10 * (1 - la * 0.5));
      ctx.strokeStyle = RED;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r, r * 0.82, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = Math.max(1, fontPx * 0.062 * (1 - la * 0.5));
      ctx.strokeStyle = INK;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r, r * 0.82, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    ctx.font = font();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (var i2 = 0; i2 < phrases.length; i2++) {
      var ph = phrases[i2];
      var pos = clampToFrame(ph, phrasePos(ph, t));
      var burn = activeBurn(i2, t);
      if (burn) {
        var age = t - burn.t0;
        var off = smearOffset(burn, age);
        var ex = pos.x + off.x;
        var ey = pos.y + off.y;
        var scale = isPhone() ? 0.8 : 1;
        if (ph.kind === 'flurry') drawFlurry(ex, ey, age, scale);
        else if (ph.kind === 'choir') drawChoir(ex, ey, age, scale);
        else drawRing(ex, ey, age, scale);
        var heat = Math.max(0, 1 - age / BURN_LEN);
        var flick = 0.85 + 0.15 * Math.sin(age * 9.0 + i2 * 1.7);
        ctx.fillStyle = mixToRed(PARCH, heat * flick);
      } else {
        ctx.fillStyle = PARCH;
      }
      ctx.fillText(ph.text, pos.x, pos.y);
    }
  }

  // Pointer interaction: tap ignites, drag smears a burning phrase.
  var startT = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function now() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - startT) / 1000;
    }
    return 0;
  }

  var dragPhrase = -1;

  function hitIndex(x, y) {
    for (var k = phrases.length - 1; k >= 0; k--) {
      var b = phrases[k].bounds;
      if (b && x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1) return k;
    }
    return -1;
  }

  function evPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', function (e) {
    var p = evPos(e);
    var idx = hitIndex(p.x, p.y);
    dragPhrase = -1;
    if (idx < 0) return;
    var t = now();
    var burn = activeBurn(idx, t);
    if (!burn) {
      burn = { phrase: idx, t0: t, samples: [] };
      burns.push(burn);
    }
    dragPhrase = idx;
    var pos = phrases[idx].bounds;
    burn.samples.push({ dt: t - burn.t0, ox: 0, oy: 0 });
    if (pos) { /* anchor recorded at zero offset at the grab */ }
  });

  canvas.addEventListener('pointermove', function (e) {
    if (dragPhrase < 0) return;
    var t = now();
    var burn = activeBurn(dragPhrase, t);
    if (!burn) { dragPhrase = -1; return; }
    var p = evPos(e);
    var anchor = phrasePos(phrases[dragPhrase], t);
    burn.samples.push({ dt: t - burn.t0, ox: p.x - anchor.x, oy: p.y - anchor.y });
    if (burn.samples.length > 240) burn.samples.shift();
  });

  function endDrag() { dragPhrase = -1; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  function frame() {
    draw(now());
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(frame);
    }
  }

  resize();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    window.addEventListener('resize', resize);
  }
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
