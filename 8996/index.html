<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№8996 · Still Life — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14110c;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 620px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #d9a441; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #f1e7d0;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .caption { margin-top: 3vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer { margin-top: 2vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #d9a441; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№8996</span> · Still Life</h1>
  <p>Two to four vessels seated on a low table, drawn flat with long shadows.
  One accent pot per arrangement, and the horizon never lands in the same
  place twice. <b>Click the piece for a new seating.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<div class="caption" id="cap"></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 899601;
const TAU = Math.PI * 2;
const VU = 1000;
let ctx;

function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function hexRgb(h){
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mix(h1, h2, t){
  const a = hexRgb(h1), b = hexRgb(h2);
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;
}
function rgba(h, a){
  const c = hexRgb(h);
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
function hslToHex(h, s, l){
  s /= 100; l /= 100;
  const k = (n) => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const to = (x) => Math.round(x * 255).toString(16).padStart(2, "0");
  return `#${to(f(0))}${to(f(8))}${to(f(4))}`;
}

function setupCanvas(){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = stage.clientWidth;
  const K = S / VU;
  canvas.width = S * dpr; canvas.height = S * dpr;
  ctx = canvas.getContext("2d");
  ctx.setTransform(dpr * K, 0, 0, dpr * K, 0, 0);
}

// ---- vessel profiles: Catmull-Rom through seeded stations ----
function profileStations(rnd){
  const foot = 0.36 + rnd() * 0.12;
  const belly = 0.92 + rnd() * 0.16;
  const bellyT = 0.30 + rnd() * 0.24;
  const shoulder = 0.66 + rnd() * 0.16;
  const neck = 0.30 + rnd() * 0.18;
  const mouth = neck * (1.06 + rnd() * 0.22);
  return [
    [0.00, foot],
    [0.05, foot * 1.05],
    [bellyT * 0.55, belly * 0.84],
    [bellyT, belly],
    [bellyT + (0.82 - bellyT) * 0.55, shoulder],
    [0.87, neck],
    [0.95, neck * 1.04],
    [1.00, mouth]
  ];
}
function sampleProfile(st, h){
  // uniform Catmull-Rom through stations, returns [[r, y], ...] base->mouth
  const pts = [];
  const P = (i) => st[clamp(i, 0, st.length - 1)];
  for (let s = 0; s < st.length - 1; s++){
    const p0 = P(s - 1), p1 = P(s), p2 = P(s + 1), p3 = P(s + 2);
    const steps = 8;
    for (let k = 0; k < steps; k++){
      const t = k / steps, t2 = t * t, t3 = t2 * t;
      const r = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t +
        (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 +
        (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
      const tt = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t +
        (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 +
        (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
      pts.push([Math.max(0.02, r), clamp(tt, 0, 1) * h]);
    }
  }
  pts.push([st[st.length - 1][1], h]);
  return pts;
}
function traceVessel(cx, baseY, pts){
  ctx.beginPath();
  pts.forEach(([r, y], i) => {
    const X = cx + r, Y = baseY - y;
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  });
  const [rm] = pts[pts.length - 1];
  ctx.lineTo(cx - rm, baseY - pts[pts.length - 1][1]);
  for (let i = pts.length - 1; i >= 0; i--){
    ctx.lineTo(cx - pts[i][0], baseY - pts[i][1]);
  }
  ctx.closePath();
}

function drawShadow(cx, baseY, baseW, h, rnd){
  const dirx = 1, diry = 0.30;
  const len = h * (0.85 + rnd() * 0.55);
  const w0 = baseW * 0.95;
  // long soft shadow: two layered quads fading along the light direction
  for (const [wScale, alpha] of [[1.0, 0.16], [0.62, 0.14]]){
    const g = ctx.createLinearGradient(cx, baseY, cx + dirx * len, baseY + diry * len);
    g.addColorStop(0, `rgba(74,58,38,${alpha})`);
    g.addColorStop(1, "rgba(74,58,38,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx - w0 * 0.5 * wScale, baseY - 4);
    ctx.lineTo(cx + w0 * 0.5 * wScale, baseY - 4);
    ctx.lineTo(cx + w0 * 0.5 * wScale + dirx * len, baseY - 4 + diry * len + w0 * 0.28 * wScale);
    ctx.lineTo(cx - w0 * 0.5 * wScale + dirx * len, baseY - 4 + diry * len - w0 * 0.28 * wScale);
    ctx.closePath();
    ctx.fill();
  }
  // contact shadow
  ctx.fillStyle = "rgba(52,40,26,0.28)";
  ctx.beginPath();
  ctx.ellipse(cx, baseY - 2, baseW * 0.72, baseW * 0.20, 0, 0, TAU);
  ctx.fill();
}

function drawVessel(v){
  const { cx, baseY, h, pts, color, bands, stems } = v;
  const mouthR = pts[pts.length - 1][0];
  drawShadow(cx, baseY, pts[0][0] * 2, h, v.rnd);
  // body
  traceVessel(cx, baseY, pts);
  const g = ctx.createLinearGradient(0, baseY - h, 0, baseY);
  g.addColorStop(0, mix(color, "#ffffff", 0.16));
  g.addColorStop(0.55, color);
  g.addColorStop(1, mix(color, "#201812", 0.28));
  ctx.fillStyle = g;
  ctx.fill();
  // clipped decoration: highlight, shade, bands
  ctx.save();
  traceVessel(cx, baseY, pts);
  ctx.clip();
  ctx.fillStyle = "rgba(255,252,240,0.13)";
  const hw = mouthR * 2.6;
  ctx.fillRect(cx - mouthR * 2.2, baseY - h, hw, h);
  const sg = ctx.createLinearGradient(cx + mouthR * 0.4, 0, cx + mouthR * 2.4, 0);
  sg.addColorStop(0, "rgba(20,12,8,0)");
  sg.addColorStop(1, "rgba(20,12,8,0.16)");
  ctx.fillStyle = sg;
  ctx.fillRect(cx - mouthR * 3, baseY - h, mouthR * 6, h);
  for (const b of bands){
    ctx.fillStyle = b.color;
    ctx.fillRect(cx - mouthR * 3, baseY - h * b.t - b.w / 2, mouthR * 6, b.w);
  }
  ctx.restore();
  // mouth: dark opening inside a body-colored lip
  ctx.fillStyle = mix(color, "#14100c", 0.78);
  ctx.beginPath();
  ctx.ellipse(cx, baseY - h, mouthR * 0.80, mouthR * 0.80 * 0.30, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = mix(color, "#201812", 0.35);
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(cx, baseY - h, mouthR * 0.97, mouthR * 0.97 * 0.30, 0, 0, TAU);
  ctx.stroke();
  // base line
  ctx.strokeStyle = "rgba(30,22,14,0.35)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - pts[0][0], baseY - 1);
  ctx.lineTo(cx + pts[0][0], baseY - 1);
  ctx.stroke();
  // stems with leaves, emerging from inside the mouth
  for (const s of stems){
    const p0x = cx + s.x0, p0y = baseY - h + 10;
    const cx1 = cx + s.x0 + s.bend * 0.5, cy1 = baseY - h - s.len * 0.6;
    const p1x = cx + s.x0 + s.bend, p1y = baseY - h - s.len;
    const qpt = (t) => {
      const u = 1 - t;
      return [u * u * p0x + 2 * u * t * cx1 + t * t * p1x,
              u * u * p0y + 2 * u * t * cy1 + t * t * p1y];
    };
    ctx.strokeStyle = "#5d6b45";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(p0x, p0y);
    ctx.quadraticCurveTo(cx1, cy1, p1x, p1y);
    ctx.stroke();
    for (const lf of s.leaves){
      const [lx, ly] = qpt(lf.t);
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(lf.ang);
      ctx.fillStyle = "#6f7a52";
      ctx.beginPath();
      ctx.ellipse(0, 0, lf.len, lf.len * 0.38, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawPlinth(v){
  const w = v.pts[0][0] * 2 * 1.9, h = v.plinthH;
  const x0 = v.cx - w / 2, y0 = v.tableY - h;
  ctx.fillStyle = mix("#d9c8a4", "#4a3d2c", 0.22);
  ctx.fillRect(x0, y0, w, h);
  ctx.fillStyle = "rgba(255,250,238,0.35)";
  ctx.fillRect(x0, y0, w, 5);
  ctx.fillStyle = "rgba(40,30,18,0.25)";
  ctx.fillRect(x0, y0 + h - 6, w, 6);
  // its shadow, short and soft
  ctx.fillStyle = "rgba(74,58,38,0.14)";
  ctx.beginPath();
  ctx.ellipse(v.cx + w * 0.28, v.tableY - 2, w * 0.62, 10, 0, 0, TAU);
  ctx.fill();
}

function render(){
  const rnd = mulberry32(seed);
  setupCanvas();

  const WALL = "#f1e7d0", TABLE = "#e3d2ac";
  ctx.fillStyle = WALL;
  ctx.fillRect(0, 0, VU, VU);
  // faint light bloom upper-left on the wall
  const bloom = ctx.createRadialGradient(240, 200, 20, 240, 200, 620);
  bloom.addColorStop(0, "rgba(255,252,240,0.10)");
  bloom.addColorStop(1, "rgba(255,252,240,0)");
  ctx.fillStyle = bloom;
  ctx.fillRect(0, 0, VU, VU);

  const horizonY = 360 + rnd() * 200;
  ctx.fillStyle = TABLE;
  ctx.fillRect(0, horizonY, VU, VU - horizonY);
  ctx.fillStyle = "rgba(96,74,46,0.45)";
  ctx.fillRect(0, horizonY - 2, VU, 4);

  // palettes
  const vibrant = rnd() < 0.5;
  const quietNat = ["#b06a42", "#8a8f6a", "#c99a4a", "#6d7a80", "#a85638", "#97855e"];
  const accentNat = ["#31437a", "#b53a26"][(rnd() * 2) | 0];
  const hueA = rnd() * 360, hueB = (hueA + 55 + rnd() * 75) % 360;
  const accentHue = (hueA + 180) % 360;

  const n = 2 + ((rnd() * 3) | 0);
  const slotX0 = 150, slotX1 = 850, slotW = (slotX1 - slotX0) / n;
  const accentIdx = (rnd() * n) | 0;
  const tallSlot = Math.round((n - 1) * (rnd() < 0.5 ? 0.36 : 0.64));
  const plinthIdx = rnd() < 0.55 ? (rnd() * n) | 0 : -1;

  const vessels = [];
  for (let i = 0; i < n; i++){
    const vrnd = mulberry32((seed ^ (0x9e37 + i * 7919)) >>> 0);
    const onPlinth = i === plinthIdx;
    const plinthH = onPlinth ? 42 + vrnd() * 46 : 0;
    const baseTopY = horizonY - plinthH;             // vessel base sits here
    const maxHH = Math.max(150, baseTopY - 70);      // headroom for the mouth
    const st = profileStations(vrnd);
    const maxR = Math.max(...st.map(s => s[1]));
    const hRaw = 200 + vrnd() * 190 * (i === tallSlot ? 1.18 : 1.0);
    const h = Math.min(hRaw, maxHH / 1.12);
    const halfW = Math.min(maxR * h * 0.62, slotW / 2 - 34);
    const scale = halfW / (maxR * h * 0.62);
    const hh = h * (0.55 + 0.45 * scale) * (i === tallSlot ? 1.12 : 1.0);
    const pts = sampleProfile(st, 1).map(([r, y]) => [r * halfW / maxR, y * hh]);
    const cx = slotX0 + slotW * (i + 0.5) + (vrnd() - 0.5) * slotW * 0.22;
    const baseY = horizonY;
    const isAccent = i === accentIdx;
    let color;
    if (vibrant){
      const hh2 = isAccent ? accentHue : hueA + (hueB - hueA) * vrnd();
      const hue = ((hh2 % 360) + 360) % 360;
      color = hslToHex(hue, isAccent ? 62 : 42 + vrnd() * 22, isAccent ? 44 : 46 + vrnd() * 16);
    } else {
      color = isAccent ? accentNat : quietNat[(vrnd() * quietNat.length) | 0];
    }
    const bands = [];
    if (vrnd() < 0.55){
      const nb = 1 + ((vrnd() * 2) | 0);
      for (let b = 0; b < nb; b++){
        bands.push({
          t: 0.30 + vrnd() * 0.45,
          w: 7 + vrnd() * 12,
          color: vrnd() < 0.5 ? "rgba(30,22,14,0.30)" : "rgba(255,250,238,0.35)"
        });
      }
    }
    const mouthR0 = pts[pts.length - 1][0];
    const stems = [];
    if (!onPlinth && vrnd() < 0.4 && mouthR0 > halfW * 0.28){
      const ns = 2 + ((vrnd() * 2) | 0);
      for (let s = 0; s < ns; s++){
        const leaves = [];
        const nl = 3 + ((vrnd() * 3) | 0);
        for (let l = 0; l < nl; l++){
          leaves.push({
            t: 0.45 + vrnd() * 0.5,
            ang: (l % 2 ? 1 : -1) * (0.55 + vrnd() * 0.55),
            len: 8 + vrnd() * 8
          });
        }
        stems.push({
          x0: (vrnd() - 0.5) * mouthR0 * 0.8,
          bend: (vrnd() - 0.5) * 130,
          len: Math.min(90 + vrnd() * 110, Math.max(60, baseTopY - hh - 50)),
          leaves
        });
      }
    }
    vessels.push({ cx, baseY: onPlinth ? baseY - plinthH : baseY, tableY: baseY, h: hh, pts, color, bands, stems, rnd: vrnd, plinthH, onPlinth });
  }

  // plinths first (behind vessels), then vessels back-to-front by height
  for (const v of vessels) if (v.onPlinth) drawPlinth(v);
  vessels.sort((a, b) => b.h - a.h);
  for (const v of vessels) drawVessel(v);

  // paper grain + vignette
  const grnd = mulberry32(seed ^ 0x3f2a);
  for (let i = 0; i < 1400; i++){
    const x = grnd() * VU, y = grnd() * VU, r = 2 + grnd() * 10;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, grnd() < 0.5 ? "rgba(120,95,55,0.030)" : "rgba(255,253,244,0.034)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const vg = ctx.createRadialGradient(500, 500, 360, 500, 500, 800);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(60,45,25,0.13)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VU, VU);

  const names = ["two", "three", "four"];
  document.getElementById("cap").textContent =
    `${names[n - 2]} vessels · ${vibrant ? "vibrant" : "natural"} palette · click to rearrange`;
}

window.addEventListener("resize", render);
document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  render();
});
render();
</script>
</body>
</html>
