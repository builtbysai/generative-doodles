<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.244 Cocktail at Midnight</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0A0A0A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.244 Cocktail at Midnight (Avantika Bawa). After Cocktail
// #ff0080, Philomath Oregon 2013: a single hot pink scaffold
// frame standing in a dark storefront window at night, three
// bays wide, four tall. A slow wave of brightness travels
// across the bays over fifteen seconds, full pink to dim and
// back, and the glass below throws faint mirrored streaks of
// the lower frame. Flat colour throughout: no glow, no
// signage, no neon cliche. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var HOT = '#FF0080', DIM = '#8A0F45', GLASS = '#F4EDE0', GROUND = '#0A0A0A';
var W = 0, H = 0, phone = false;
var T = 3.75, lastNow = -1; // frame one: wave at the left, right bays dimming

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}

var COLX = [200, 400, 600, 800];
var ROWY = [170, 320, 470, 620, 770];
var BASE = 790; // glass line the reflection mirrors across

// Node and edge system, built once.
var EDGES = [];
(function () {
  function mc(x1, x2) { return ((x1 + x2) / 2 - 200) / 200; }
  var r, c;
  for (r = 0; r < ROWY.length; r++)
    for (c = 0; c < 3; c++)
      EDGES.push({ x1: COLX[c], y1: ROWY[r], x2: COLX[c + 1], y2: ROWY[r], mc: mc(COLX[c], COLX[c + 1]) });
  for (c = 0; c < COLX.length; c++)
    for (r = 0; r < 4; r++)
      EDGES.push({ x1: COLX[c], y1: ROWY[r], x2: COLX[c], y2: ROWY[r + 1], mc: mc(COLX[c], COLX[c]) });
  for (c = 0; c < 3; c++)
    for (r = 0; r < 4; r++) {
      if ((c + r) % 2 === 0)
        EDGES.push({ x1: COLX[c], y1: ROWY[r], x2: COLX[c + 1], y2: ROWY[r + 1], mc: mc(COLX[c], COLX[c + 1]) });
      else
        EDGES.push({ x1: COLX[c + 1], y1: ROWY[r], x2: COLX[c], y2: ROWY[r + 1], mc: mc(COLX[c], COLX[c + 1]) });
    }
})();

function bright(mc, t) {
  return 0.5 + 0.5 * Math.sin(2 * Math.PI * t / 15 - 0.85 * mc);
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var s = Math.min(W, H) * 0.99 / 1000;
  ctx.save();
  ctx.translate((W - 1000 * s) / 2, (H - 1000 * s) / 2);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.rect(0, 0, 1000, 1000);
  ctx.clip();

  // storefront glass, cropped by the frame: pane outline and
  // mullions at five percent, barely there
  ctx.strokeStyle = 'rgba(244,237,224,0.05)';
  ctx.lineWidth = 2;
  ctx.strokeRect(70, 70, 860, 730);
  ctx.beginPath();
  ctx.moveTo(200, 70); ctx.lineTo(200, 800);
  ctx.moveTo(800, 70); ctx.lineTo(800, 800);
  ctx.moveTo(70, 170); ctx.lineTo(930, 170);
  ctx.stroke();

  ctx.lineCap = 'round';

  // reflections first: mirrored copies of the lower frame in
  // glass colour, three stacked passes for the vertical smear,
  // alpha shimmering per edge
  for (var i = 0; i < EDGES.length; i++) {
    var e = EDGES[i];
    var ry1 = 2 * BASE - e.y1, ry2 = 2 * BASE - e.y2;
    if (Math.max(ry1, ry2) > 1005) continue;
    var shim = 0.7 + 0.3 * Math.sin(0.8 * T + i * 1.7);
    for (var p = 0; p < 3; p++) {
      ctx.strokeStyle = 'rgba(244,237,224,' + (0.04 * shim).toFixed(3) + ')';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(e.x1, ry1 + p * 5);
      ctx.lineTo(e.x2, ry2 + p * 5);
      ctx.stroke();
    }
  }
  // faint vertical streaks under the standards
  ctx.strokeStyle = 'rgba(244,237,224,0.05)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (var c = 0; c < COLX.length; c++) {
    var len = 50 + 26 * Math.sin(T * 0.6 + c * 1.9);
    ctx.moveTo(COLX[c], 806);
    ctx.lineTo(COLX[c], 806 + len);
  }
  ctx.stroke();

  // the scaffold itself: every edge coloured by the wave at its
  // midpoint, dim pink to hot pink
  ctx.lineWidth = 7;
  for (var j = 0; j < EDGES.length; j++) {
    var ed = EDGES[j];
    ctx.strokeStyle = mix(DIM, HOT, bright(ed.mc, T));
    ctx.beginPath();
    ctx.moveTo(ed.x1, ed.y1);
    ctx.lineTo(ed.x2, ed.y2);
    ctx.stroke();
  }
  // couplers
  for (var cc = 0; cc < COLX.length; cc++) {
    for (var rr = 0; rr < ROWY.length; rr++) {
      ctx.fillStyle = mix(DIM, HOT, bright((COLX[cc] - 200) / 200, T));
      ctx.beginPath();
      ctx.arc(COLX[cc], ROWY[rr], 7.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
