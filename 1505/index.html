<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Voice Is Never Heard Alone</title>
<style>
html, body { margin: 0; padding: 0; background: #2a2a30; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var FIELD = '#2a2a30';
  var GOLD = [217, 164, 65];
  var TEAL = [46, 111, 106];
  var CREAM = [232, 224, 208];
  var GREY = [184, 188, 192];
  var LOOP = 48;
  var SEP_PERIOD = 24;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1505000);
  var PHASE0 = rng() * Math.PI * 2;

  function a4(x) { return Math.round(x * 10000) / 10000; }
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a4(a) + ')'; }
  function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }

  function viewportSize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return { w: w, h: h };
  }
  function sizeCanvas() {
    var s = viewportSize();
    canvas.width = s.w;
    canvas.height = s.h;
    canvas.style.width = s.w + 'px';
    canvas.style.height = s.h + 'px';
  }

  var currentT = 0;
  var activeDrag = null;   // { yDown, curY, uDown, midDown }
  var lastDrag = null;     // { offset, tUp }

  function offsetFrom(drag) {
    var away = Math.abs(drag.curY - drag.midDown) - Math.abs(drag.yDown - drag.midDown);
    return clamp(away * 0.35, -0.08 * drag.uDown, 0.12 * drag.uDown);
  }
  function currentOffset(t) {
    if (activeDrag) { return offsetFrom(activeDrag); }
    if (lastDrag) {
      if (t <= lastDrag.tUp) { return lastDrag.offset; }
      return lastDrag.offset * Math.exp(-(t - lastDrag.tUp) / 2);
    }
    return 0;
  }

  function draw() {
    var W = canvas.width, H = canvas.height;
    var U = Math.min(W, H);
    var midY = 0.5 * H;
    var lt = ((currentT % LOOP) + LOOP) % LOOP;
    var sepBase = 0.12 * U - 0.10 * U * Math.cos(2 * Math.PI * lt / SEP_PERIOD);
    var sep = clamp(sepBase + currentOffset(currentT), 0.015 * U, 0.30 * U);
    var sepNorm = clamp((sep - 0.02 * U) / (0.20 * U), 0, 1);
    var lineAlpha = 0.55 + 0.45 * (1 - sepNorm);
    var glowAlpha = 0.30 * (1 - sepNorm);
    var greyAlpha = 0.25 * sepNorm;
    var waveAmp = 0.018 * U;
    var waveLen = 0.38 * W;
    var lw = Math.max(2.5, 0.007 * U);

    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    function pathPoints(center) {
      var pts = [];
      var x;
      for (x = 0; x <= W; x += 6) {
        pts.push([x, center + waveAmp * Math.sin(2 * Math.PI * x / waveLen + PHASE0)]);
      }
      pts.push([W, center + waveAmp * Math.sin(2 * Math.PI * W / waveLen + PHASE0)]);
      return pts;
    }
    function trace(pts) {
      var i;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (i = 1; i < pts.length; i++) { ctx.lineTo(pts[i][0], pts[i][1]); }
    }

    var goldPts = pathPoints(midY - sep / 2);
    var tealPts = pathPoints(midY + sep / 2);

    // Interval glow: one flat-alpha band between the two lines, never a gradient.
    var i;
    ctx.beginPath();
    ctx.moveTo(goldPts[0][0], goldPts[0][1]);
    for (i = 1; i < goldPts.length; i++) { ctx.lineTo(goldPts[i][0], goldPts[i][1]); }
    for (i = tealPts.length - 1; i >= 0; i--) { ctx.lineTo(tealPts[i][0], tealPts[i][1]); }
    ctx.closePath();
    ctx.fillStyle = rgba(CREAM, glowAlpha);
    ctx.fill();

    // Distant-state grey underlines, growing as the lines drift apart.
    ctx.lineWidth = lw;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(GREY, greyAlpha);
    trace(goldPts); ctx.stroke();
    trace(tealPts); ctx.stroke();

    // The two voices, sharing one dimming factor: neither ever fades alone.
    ctx.strokeStyle = rgba(GOLD, lineAlpha);
    trace(goldPts); ctx.stroke();
    ctx.strokeStyle = rgba(TEAL, lineAlpha);
    trace(tealPts); ctx.stroke();

    lastDraw = { sep: sep, sepNorm: sepNorm, glowAlpha: glowAlpha, lineAlpha: lineAlpha, offset: currentOffset(currentT) };
  }
  var lastDraw = null;

  function drawAt(t) { currentT = t; draw(); }

  function onDown(x, y) {
    var U = Math.min(canvas.width, canvas.height);
    activeDrag = { yDown: y, curY: y, uDown: U, midDown: 0.5 * canvas.height };
  }
  function onMove(x, y) { if (activeDrag) { activeDrag.curY = y; } }
  function onUp() {
    if (activeDrag) {
      lastDrag = { offset: offsetFrom(activeDrag), tUp: currentT };
      activeDrag = null;
    }
  }

  canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY); });
  canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
  canvas.addEventListener('pointerup', function (e) { onUp(); });
  canvas.addEventListener('pointercancel', function (e) { onUp(); });

  function onResize() { sizeCanvas(); draw(); }
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', onResize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
  }

  if (typeof window !== 'undefined') {
    window.__piece = {
      drawAt: drawAt,
      down: onDown, move: onMove, up: onUp,
      state: function () { return lastDraw; }
    };
  }

  sizeCanvas();
  drawAt(0);

  var startTime = null;
  function loop(ts) {
    if (startTime === null) { startTime = ts; }
    currentT = (ts - startTime) / 1000;
    draw();
    if (typeof requestAnimationFrame !== 'undefined') { requestAnimationFrame(loop); }
  }
  if (typeof requestAnimationFrame !== 'undefined') { requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
