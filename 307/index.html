<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.307 Scrying Cauldron</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#141010; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.307 Scrying Cauldron (Xanthe Caesia).
// A squat dark cauldron with a jagged flame rim and exactly two
// glowing cutout vents, staged on dark wood with a tea-light
// low-left and dried gypsophila at frame right. Inside, a black
// scrying liquid holds seeded fragment shards, slow concentric
// ripples and exactly five vision drifts per 60s idle loop.
// Drag across the liquid to stir it; tap the rim for one gold
// fleck glint travelling the jagged lip. No WebGL, no offscreen
// canvas, one canvas only, no text anywhere.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var BODY = '#241A14', RUST = '#8A4A2E', SPECK = '#C9BBA8';
var INTERIOR = '#0A0806', WOOD = '#3A2E22', CANDLE = '#F2B45C';
var NIGHT = '#141010';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 6, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- seeded rng (static data generation only) -----------------------
function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }

// ---- geometry --------------------------------------------------------
var CX = 640, RIMY = 322, RIMRX = 212, RIMRY = 46;
var TOPY = 326, BOTY = 662;
var LIQX = CX, LIQY = 324, LIQRX = 178, LIQRY = 38;
function halfW(t) { return 200 + 62 * Math.sin(t * Math.PI) - 42 * t * t; }
function bodyPath() {
  var i, t, y;
  ctx.beginPath();
  ctx.moveTo(CX - halfW(0), TOPY);
  for (i = 1; i <= 24; i++) { t = i / 24; y = TOPY + t * (BOTY - TOPY); ctx.lineTo(CX - halfW(t), y); }
  ctx.lineTo(CX + halfW(1), BOTY);
  for (i = 23; i >= 0; i--) { t = i / 24; y = TOPY + t * (BOTY - TOPY); ctx.lineTo(CX + halfW(t), y); }
  ctx.closePath();
}

// Jagged flame rim: high frequency seeded displacement, never smooth.
var rimRand = rng(30711);
var RIM = [];
(function () {
  var i, a, jag, rad, spike;
  for (i = 0; i < 96; i++) {
    a = (i / 96) * Math.PI * 2;
    jag = (rimRand() - 0.5) * 15;
    rad = 1 + (rimRand() - 0.5) * 0.07;
    spike = Math.sin(a) < 0 ? rimRand() * rimRand() * 26 : rimRand() * 5;
    RIM.push({
      x: CX + Math.cos(a) * RIMRX * rad + jag * 0.4,
      y: RIMY + Math.sin(a) * RIMRY * rad - spike,
      a: a
    });
  }
})();
function rimPointAt(frac) {
  var f = ((frac % 1) + 1) % 1, pos = f * RIM.length;
  var i0 = Math.floor(pos) % RIM.length, i1 = (i0 + 1) % RIM.length, u = pos - Math.floor(pos);
  return { x: RIM[i0].x + (RIM[i1].x - RIM[i0].x) * u, y: RIM[i0].y + (RIM[i1].y - RIM[i0].y) * u };
}

// Cutout vents: exactly 2, asserted.
var VENTS = [
  { x: CX - 82, y: 516, r: 19 },
  { x: CX + 82, y: 516, r: 19 }
];
if (VENTS.length !== 2) throw new Error('Scrying Cauldron needs exactly 2 cutout vents');

// Vision drifts: exactly 5, one per 12s beat of the 60s loop, asserted.
var VISIONS = [];
(function () {
  var v, i, r;
  for (v = 0; v < 5; v++) {
    r = rng(4100 + v * 137);
    var cluster = [];
    for (i = 0; i < 7; i++) {
      cluster.push({
        dx: (r() - 0.5) * 92, dy: (r() - 0.5) * 15,
        sz: 5 + r() * 13, rot: r() * Math.PI * 2,
        wob: 0.6 + r() * 1.8, warm: r() > 0.45
      });
    }
    VISIONS.push(cluster);
  }
})();
if (VISIONS.length !== 5) throw new Error('Scrying Cauldron needs exactly 5 vision drifts');

// Liquid shards: seeded fragment paths.
var SHARDS = [];
(function () {
  var r = rng(90210), i, j, pts;
  for (i = 0; i < 30; i++) {
    pts = [];
    var n = 5, base = 0.55 + r() * 0.6;
    for (j = 0; j < n; j++) pts.push(0.45 + r() * 0.85);
    SHARDS.push({
      ang: r() * Math.PI * 2, frac: Math.sqrt(r()) * 0.88,
      sz: 6 + r() * 15, rot: r() * Math.PI * 2, pts: pts, n: n, base: base,
      warm: r() > 0.62, pale: r() > 0.5, spin: 0.5 + r()
    });
  }
})();

// Mottle patches and speckle over the glaze, seeded.
var MOTTLE = [], SPECKLES = [];
(function () {
  var r = rng(5150), i, t, y, hw;
  for (i = 0; i < 46; i++) {
    t = r(); y = TOPY + 18 + t * (BOTY - TOPY - 30); hw = halfW(t) - 14;
    MOTTLE.push({ x: CX + (r() * 2 - 1) * hw * 0.92, y: y, rx: 9 + r() * 30, ry: 6 + r() * 16, a: 0.05 + r() * 0.13 });
  }
  for (i = 0; i < 380; i++) {
    t = r(); y = TOPY + 10 + t * (BOTY - TOPY - 16); hw = halfW(t) - 8;
    SPECKLES.push({ x: CX + (r() * 2 - 1) * hw * 0.96, y: y, r: 0.7 + r() * 1.7, a: 0.25 + r() * 0.55 });
  }
})();

// Wood grain lines, seeded.
var GRAIN = [];
(function () {
  var r = rng(777), i, j, pts;
  for (i = 0; i < 15; i++) {
    pts = [];
    var y0 = 668 + i * 15 + r() * 7;
    for (j = 0; j <= 8; j++) pts.push({ x: j * 160, y: y0 + (r() - 0.5) * 6 });
    GRAIN.push({ pts: pts, a: 0.10 + r() * 0.16, dark: r() > 0.4 });
  }
})();

// Gypsophila sprigs at frame right, seeded.
var SPRIGS = [];
(function () {
  var r = rng(31415), i, j;
  for (i = 0; i < 6; i++) {
    var bx = 1036 + (r() - 0.5) * 36, lean = -110 + i * 44 + (r() - 0.5) * 26;
    var topY = 392 + r() * 80, blossoms = [];
    for (j = 0; j < 20; j++) {
      var tt = 0.42 + 0.58 * r();
      blossoms.push({
        x: bx + lean * tt * tt + (r() - 0.5) * 44 * tt,
        y: 676 - (676 - topY) * tt + (r() - 0.5) * 20,
        r: 2.0 + r() * 3.2, a: 0.35 + r() * 0.5
      });
    }
    SPRIGS.push({ bx: bx, lean: lean, topY: topY, blossoms: blossoms });
  }
})();

// ---- flicker: seeded envelope, integer cycles per 60s so it loops ---
function flicker(t) {
  var p = t * Math.PI * 2 / 60;
  var v = 0.55 * Math.sin(p * 47 + 0.7) + 0.30 * Math.sin(p * 83 + 2.1) + 0.22 * Math.sin(p * 131 + 4.0) + 0.12 * Math.sin(p * 7 + 1.2);
  return 0.78 + v * 0.20; // roughly 0.58 .. 0.98
}

// ---- interaction state ----------------------------------------------
var swirlAngle = 0, swirlVel = 0;
var glintT0 = -9;
var drag = null;

function shardPath(cx, cy, sz, rot, pts, n, base) {
  var j, a, rr;
  ctx.beginPath();
  for (j = 0; j < n; j++) {
    a = rot + (j / n) * Math.PI * 2;
    rr = sz * base * pts[j];
    if (j === 0) ctx.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.42);
    else ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.42);
  }
  ctx.closePath();
}

// ---- drawing ---------------------------------------------------------
function drawWood() {
  ctx.fillStyle = WOOD;
  ctx.fillRect(0, 648, DW, DH - 648);
  var i, j;
  for (i = 0; i < GRAIN.length; i++) {
    ctx.globalAlpha = GRAIN[i].a;
    st(GRAIN[i].dark ? NIGHT : SPECK, 2);
    ctx.beginPath();
    for (j = 0; j < GRAIN[i].pts.length; j++) {
      if (j === 0) ctx.moveTo(GRAIN[i].pts[j].x, GRAIN[i].pts[j].y);
      else ctx.lineTo(GRAIN[i].pts[j].x, GRAIN[i].pts[j].y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // back edge of the table
  ctx.globalAlpha = 0.5; st(NIGHT, 3);
  ctx.beginPath(); ctx.moveTo(0, 648); ctx.lineTo(DW, 648); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawGypsophila() {
  var i, j, b;
  for (i = 0; i < SPRIGS.length; i++) {
    var s = SPRIGS[i];
    ctx.globalAlpha = 0.42; st(SPECK, 2.2);
    ctx.beginPath(); ctx.moveTo(s.bx, 680);
    ctx.quadraticCurveTo(s.bx + s.lean * 0.25, 540, s.bx + s.lean, s.topY); ctx.stroke();
    ctx.globalAlpha = 1;
    for (j = 0; j < s.blossoms.length; j++) {
      b = s.blossoms[j];
      ctx.globalAlpha = b.a * 0.8;
      ctx.fillStyle = SPECK;
      circ(b.x, b.y, b.r, true);
      circ(b.x - b.r * 1.7, b.y + b.r * 0.5, b.r * 0.66, true);
      circ(b.x + b.r * 1.6, b.y - b.r * 0.4, b.r * 0.6, true);
    }
  }
  ctx.globalAlpha = 1;
}

function drawCandle(fl) {
  var x = 248, baseY = 676;
  // warm glow, layered translucency only
  var k, rr;
  for (k = 9; k >= 1; k--) {
    ctx.globalAlpha = 0.016 * fl + 0.004;
    ctx.fillStyle = CANDLE;
    circ(x, baseY - 58, k * 16 * (0.9 + fl * 0.18), true);
  }
  ctx.globalAlpha = 1;
  // holder: a small dark tea-light cup
  ctx.beginPath();
  ctx.moveTo(x - 38, baseY - 26); ctx.lineTo(x + 38, baseY - 26);
  ctx.lineTo(x + 30, baseY); ctx.lineTo(x - 30, baseY);
  ctx.closePath();
  ctx.fillStyle = BODY; ctx.fill();
  st(RUST, 2.5); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x, baseY - 26, 38, 9, 0, 0, Math.PI * 2);
  ctx.fillStyle = RUST; ctx.fill();
  ctx.beginPath(); ctx.ellipse(x, baseY - 27, 30, 6.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = CANDLE; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;
  // flame: teardrop that leans and stretches with the flicker envelope
  var fh = 44 * (0.82 + fl * 0.30), lean = (fl - 0.78) * 16, fx = x, fy = baseY - 30;
  ctx.globalAlpha = 0.30 * fl; ctx.fillStyle = CANDLE;
  ctx.beginPath(); ctx.ellipse(fx + lean * 0.5, fy - fh * 0.52, 15 * (0.8 + fl * 0.3), fh * 0.58, lean * 0.01, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.95;
  ctx.beginPath();
  ctx.moveTo(fx - 8.5, fy - 6);
  ctx.quadraticCurveTo(fx - 9, fy - fh * 0.55, fx + lean, fy - fh);
  ctx.quadraticCurveTo(fx + 9 + lean * 0.4, fy - fh * 0.55, fx + 8.5, fy - 6);
  ctx.quadraticCurveTo(fx, fy + 2, fx - 8.5, fy - 6);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  // wick
  st(INTERIOR, 2.4);
  ctx.beginPath(); ctx.moveTo(fx, fy - 2); ctx.lineTo(fx, fy - 10); ctx.stroke();
}

function drawLiquid(fl) {
  // interior well
  ctx.beginPath(); ctx.ellipse(LIQX, LIQY, RIMRX - 6, RIMRY + 3, 0, 0, Math.PI * 2);
  ctx.fillStyle = INTERIOR; ctx.fill();
  // liquid disc, clipped for everything inside
  ctx.save();
  ctx.beginPath(); ctx.ellipse(LIQX, LIQY, LIQRX, LIQRY, 0, 0, Math.PI * 2);
  ctx.fillStyle = INTERIOR; ctx.fill();
  ctx.clip();
  // faint warm wash from the candle side
  ctx.globalAlpha = 0.10 * fl + 0.03; ctx.fillStyle = CANDLE;
  ctx.beginPath(); ctx.ellipse(LIQX - LIQRX * 0.45, LIQY, LIQRX * 0.62, LIQRY * 1.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // concentric ripples
  var i, ph, rx, ry;
  for (i = 0; i < 5; i++) {
    ph = ((T * 0.055 + i / 5) % 1);
    rx = 8 + ph * (LIQRX - 10); ry = 2 + ph * (LIQRY - 3);
    ctx.globalAlpha = (1 - ph) * 0.20;
    st(i % 2 ? SPECK : CANDLE, 1.8);
    ctx.beginPath(); ctx.ellipse(LIQX, LIQY, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // seeded fragment shards, swirled by idle drift plus the stir
  var s, a, fr, sx, sy;
  for (i = 0; i < SHARDS.length; i++) {
    s = SHARDS[i];
    a = s.ang + swirlAngle * (0.35 + s.frac * 0.9) + T * 0.018 * s.spin;
    fr = s.frac;
    sx = LIQX + Math.cos(a) * fr * (LIQRX - 14);
    sy = LIQY + Math.sin(a) * fr * (LIQRY - 5);
    ctx.globalAlpha = s.pale ? 0.20 : 0.13;
    ctx.fillStyle = s.warm ? CANDLE : (s.pale ? SPECK : RUST);
    shardPath(sx, sy, s.sz, s.rot + swirlAngle * 0.6 + T * 0.03 * s.spin, s.pts, s.n, s.base);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // the vision for this 12s beat drifts across the disc
  var lt = T % 60, beat = Math.floor(lt / 12), prog = (lt - beat * 12) / 12;
  var cluster = VISIONS[beat];
  var vx = LIQX + (prog * 2 - 1) * LIQRX * 0.58;
  var vy = LIQY + Math.sin(prog * Math.PI) * -4 + (beat % 2 ? 3 : -2);
  var va = Math.sin(prog * Math.PI) * 0.72;
  var c;
  for (i = 0; i < cluster.length; i++) {
    c = cluster[i];
    ctx.globalAlpha = va * (0.35 + 0.3 * Math.sin(T * 0.7 + i));
    if (ctx.globalAlpha < 0.02) ctx.globalAlpha = 0.02;
    ctx.fillStyle = c.warm ? CANDLE : SPECK;
    shardPath(vx + c.dx, vy + c.dy + Math.sin(T * 0.5 + i * 1.7) * c.wob, c.sz, c.rot + prog * 1.2, [0.8, 1, 0.7, 0.95, 0.6], 5, 0.8);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // inner rim shadow line
  ctx.globalAlpha = 0.6; st(INTERIOR, 3);
  ctx.beginPath(); ctx.ellipse(LIQX, LIQY, LIQRX, LIQRY, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawCauldron(fl) {
  // contact shadow on the wood
  ctx.globalAlpha = 0.42; ctx.fillStyle = NIGHT;
  ctx.beginPath(); ctx.ellipse(CX, BOTY + 12, 252, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // body
  bodyPath();
  ctx.fillStyle = BODY; ctx.fill();
  // rust mottling, clipped to the body
  ctx.save(); bodyPath(); ctx.clip();
  var i;
  for (i = 0; i < MOTTLE.length; i++) {
    ctx.globalAlpha = MOTTLE[i].a; ctx.fillStyle = RUST;
    ctx.beginPath(); ctx.ellipse(MOTTLE[i].x, MOTTLE[i].y, MOTTLE[i].rx, MOTTLE[i].ry, 0.3, 0, Math.PI * 2); ctx.fill();
  }
  // glossy sheen down the left belly
  ctx.globalAlpha = 0.05; ctx.fillStyle = SPECK;
  ctx.beginPath(); ctx.ellipse(CX - 128, 486, 30, 118, 0.16, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.03;
  ctx.beginPath(); ctx.ellipse(CX + 142, 500, 30, 96, -0.14, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // speckle
  for (i = 0; i < SPECKLES.length; i++) {
    ctx.globalAlpha = SPECKLES[i].a; ctx.fillStyle = SPECK;
    circ(SPECKLES[i].x, SPECKLES[i].y, SPECKLES[i].r, true);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // body outline
  bodyPath(); st(NIGHT, 3.5); ctx.stroke();
  // vents: dark holes breathing a warm glow in phase with the candle
  var v, glowA = 0.16 + 0.5 * Math.max(0, fl - 0.55);
  for (i = 0; i < VENTS.length; i++) {
    v = VENTS[i];
    ctx.globalAlpha = glowA * 0.35; ctx.fillStyle = CANDLE;
    circ(v.x, v.y, v.r * 2.05, true);
    ctx.globalAlpha = glowA * 0.55;
    circ(v.x, v.y, v.r * 1.45, true);
    ctx.globalAlpha = 1;
    ctx.fillStyle = INTERIOR; circ(v.x, v.y, v.r, true);
    ctx.globalAlpha = 0.75 * glowA + 0.25; ctx.fillStyle = CANDLE;
    circ(v.x, v.y, v.r * 0.52, true);
    ctx.globalAlpha = 1;
    st(NIGHT, 2.5); circ(v.x, v.y, v.r, false);
  }
  // liquid before the rim lip so the lip overlaps its edge
  drawLiquid(fl);
  // jagged flame rim: thick broken lip following the seeded points
  ctx.beginPath();
  for (i = 0; i <= RIM.length; i++) {
    var p = RIM[i % RIM.length];
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  st(BODY, 11); ctx.stroke();
  st(RUST, 3); ctx.globalAlpha = 0.55; ctx.stroke(); ctx.globalAlpha = 1;
  // speckled flecks on the lip
  var sr = rng(6161);
  ctx.fillStyle = SPECK;
  for (i = 0; i < 60; i++) {
    var rp = RIM[Math.floor(sr() * RIM.length)];
    ctx.globalAlpha = 0.3 + sr() * 0.5;
    circ(rp.x + (sr() - 0.5) * 8, rp.y + (sr() - 0.5) * 8, 0.8 + sr() * 1.6, true);
  }
  ctx.globalAlpha = 1;
  // gold fleck glint travelling the jagged lip after a rim tap
  var ga = T - glintT0;
  if (ga >= 0 && ga < 1.4) {
    var gp = ga / 1.4, pos = rimPointAt(gp);
    var fade = Math.sin(gp * Math.PI);
    ctx.globalAlpha = fade * 0.30; ctx.fillStyle = CANDLE; circ(pos.x, pos.y, 17, true);
    ctx.globalAlpha = fade * 0.65; circ(pos.x, pos.y, 8, true);
    ctx.globalAlpha = fade; circ(pos.x, pos.y, 3.4, true);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  var fl = flicker(T);
  ctx.fillStyle = NIGHT;
  ctx.fillRect(0, 0, DW, DH);
  drawWood();
  drawGypsophila();
  drawCandle(fl);
  drawCauldron(fl);
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function inLiquid(p) {
  var dx = (p[0] - LIQX) / (LIQRX + 16), dy = (p[1] - LIQY) / (LIQRY + 18);
  return dx * dx + dy * dy <= 1;
}
function nearRim(p) {
  var dx = (p[0] - CX) / RIMRX, dy = (p[1] - RIMY) / (RIMRY + 26);
  var d = dx * dx + dy * dy;
  return d > 0.35 && d < 1.9;
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  drag = { x: p[0], y: p[1], sx: p[0], sy: p[1], moved: 0, stir: inLiquid(p), rim: nearRim(p) };
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var p = toDesign(e), dx = p[0] - drag.x, dy = p[1] - drag.y;
  drag.moved = Math.max(drag.moved, Math.abs(p[0] - drag.sx), Math.abs(p[1] - drag.sy));
  if (drag.stir) {
    // stir direction follows the drag across the disc
    var cxv = p[0] - LIQX, cyv = (p[1] - LIQY) * (LIQRX / LIQRY);
    var tang = (-cyv * dx + cxv * dy * (LIQRX / LIQRY));
    swirlVel += tang * 0.000045 + dx * 0.0016;
    if (swirlVel > 5) swirlVel = 5;
    if (swirlVel < -5) swirlVel = -5;
  }
  drag.x = p[0]; drag.y = p[1];
});
canvas.addEventListener('pointerup', function (e) {
  if (drag && drag.moved < 9) {
    var p = toDesign(e);
    if (nearRim(p) || drag.rim) glintT0 = T;
  }
  drag = null;
});
canvas.addEventListener('pointercancel', function () { drag = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = NIGHT;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK; acc -= TICK; guard++;
    swirlAngle += swirlVel * TICK;
    swirlVel *= Math.exp(-1.15 * TICK);
    if (Math.abs(swirlVel) < 0.001) swirlVel = 0;
  }
  if (guard === 4) acc = 0;
