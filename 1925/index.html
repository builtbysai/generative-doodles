<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1925 Facades</title>
<style>
  html, body { margin: 0; padding: 0; background: #232120; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/lauren-kinsella.md does not exist in the repo, so these
  // hex values are chosen from the prompt's own color names.
  var BG = '#232120';        // dark church stone, page ground too
  var STONE = '#4a4642';     // church stone grey, blocks and figures
  var STONE_LT = '#6b655e';  // lighter stone, arch and floor line
  var STONE_DK = '#1b1917';  // deep shadow stone
  var CREAM = '#efe6d0';     // candle-wax cream, title and candle
  var CREAM_DIM = '#c9bfa9'; // dim cream, date line and hint
  var BLUE = '#8fb4d6';      // tablet glow, cool blue
  var BLUE_DK = '#1d2f42';   // tablet screen, dark blue
  var BLUE_GLOW = '#5d89b0'; // tablet glow halo
  var ROSE = '#b98a8f';      // first stave, muted rose
  var SAGE = '#8a9a7b';      // second stave, sage
  var OCHRE = '#c19a4b';     // third stave, ochre
  var SLATE = '#6b7d8c';     // fourth stave, slate
  var STAVES = [ROSE, SAGE, OCHRE, SLATE];

  // Fixed-phase first frame: t = 30 s. At t = 30 the four ribbons are
  // mid-braid above the semicircle: the rose and ochre staves cross near
  // the top of the arch in crisp written runs, while the sage and slate
  // staves loosen into improvised curves below them. Frame one is
  // byte-reproducible: every point is a pure function of t and the
  // seeded PRNG.
  var FIRST_T = 30;

  // Seeded PRNG, mulberry32. A fresh instance is built per draw from the
  // piece number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Four seated figures in a semicircle. Outer figures sit slightly
  // higher (further back); the two inner figures sit lower, nearer the
  // viewer. No faces: heads are plain cream-grey rounds, bodies are
  // simple seated robes with a stole in the figure's stave color.
  var FIG_X = [0.17, 0.38, 0.62, 0.83];
  var FIG_Y = [0.70, 0.735, 0.735, 0.70]; // base y, fraction of H

  function figureGeom(i) {
    var x = FIG_X[i] * W;
    var baseY = FIG_Y[i] * H;
    var headR = Math.max(9, W * 0.036);
    var headY = baseY - H * 0.098;
    var shoulderY = baseY - H * 0.075;
    var shoulderW = W * 0.085;
    return { x: x, baseY: baseY, headR: headR, headY: headY, shoulderY: shoulderY, shoulderW: shoulderW };
  }

  // Tablet held by figure i: a small glowing blue rectangle tilted
  // toward the circle's center, resting just above the lap.
  function tabletGeom(i) {
    var g = figureGeom(i);
    var tilt = (g.x < W / 2) ? 0.22 : -0.22;
    var tw = Math.max(30, W * 0.075);
    var th = Math.max(18, H * 0.032);
    var tx = g.x - tw / 2 + (g.x < W / 2 ? W * 0.012 : -W * 0.012);
    var ty = g.baseY - H * 0.062;
    return { x: tx, y: ty, w: tw, h: th, tilt: tilt, cx: tx + tw / 2, cy: ty };
  }

  // Braid geometry. Each stave rises from its tablet, drifts toward the
  // center, then braids: x follows a slow sine in y with a per-voice
  // phase, so the four staves cross pairwise as they rise. The braid
  // advances slowly with t (about one crossing every 20 s), well under
  // the 14 Hz ceiling.
  function braidTopY() { return H * 0.16; }
  function braidPoint(i, y, t) {
    var tab = tabletGeom(i);
    var topY = braidTopY();
    var rise = clamp((tab.cy - y) / (tab.cy - topY), 0, 1);
    var blend = Math.pow(rise, 0.7);
    var amp = W * 0.155;
    var wave = 2 * Math.PI * (tab.cy - y) / (H * 0.17);
    var phase = i * Math.PI / 2 + t * 0.11;
    var braidX = W / 2 + amp * Math.sin(wave + phase);
    var x = lerp(tab.cx, braidX, blend);
    return { x: x, y: y, rise: rise };
  }

  // Written or improvised at this point on stave i: the flag alternates
  // along the stave and drifts slowly with t, so written crispness
  // dissolves into improvised looseness and is re-notated further up.
  function isWritten(i, y, t) {
    var tab = tabletGeom(i);
    var s = (tab.cy - y) / (H * 0.055) + i * 1.7 + t * 0.05;
    return Math.sin(s) > 0;
  }

  function drawStone(rng) {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    // Stone block seams, faint and seeded, in the upper half.
    ctx.strokeStyle = hexA(STONE_LT, 0.16);
    ctx.lineWidth = Math.max(1, H * 0.0012);
    var rows = 5;
    for (var r = 0; r < rows; r++) {
      var y = H * (0.10 + r * 0.085);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      var off = rng() * W * 0.2;
      for (var x = off; x < W; x += W * 0.22) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + H * 0.085); ctx.stroke();
      }
    }
    // A tall round arch framing the braid, stone grey on dark stone.
    var cx = W / 2;
    var archW = W * 0.42, archTop = H * 0.10, archBase = H * 0.60;
    ctx.strokeStyle = hexA(STONE_LT, 0.35);
    ctx.lineWidth = Math.max(2, H * 0.004);
    ctx.beginPath();
    ctx.moveTo(cx - archW, archBase);
    ctx.lineTo(cx - archW, archTop + archW * 0.55);
    ctx.moveTo(cx + archW, archBase);
    ctx.lineTo(cx + archW, archTop + archW * 0.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - archW, archTop + archW * 0.55);
    ctx.arc(cx, archTop + archW * 0.55, archW, Math.PI, 0);
    ctx.stroke();
    // Floor: a slightly lighter stone band where the figures sit.
    ctx.fillStyle = '#2e2b28';
    ctx.fillRect(0, H * 0.74, W, H * 0.26);
    ctx.strokeStyle = hexA(STONE_LT, 0.25);
    ctx.lineWidth = Math.max(1, H * 0.0016);
    ctx.beginPath(); ctx.moveTo(0, H * 0.74); ctx.lineTo(W, H * 0.74); ctx.stroke();
    // A faint stone circle on the floor around the candle, and two faint
    // floor seams, so the still lower room does not read as empty black.
    ctx.strokeStyle = hexA(STONE_LT, 0.14);
    ctx.lineWidth = Math.max(1, H * 0.0012);
    ctx.beginPath();
    ctx.moveTo(W / 2 + W * 0.32, H * 0.74); ctx.arc(W / 2, H * 0.74, W * 0.32, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, H * 0.86); ctx.lineTo(W, H * 0.86); ctx.stroke();
  }

  function drawFigure(i) {
    var g = figureGeom(i);
    var color = STAVES[i];
    // Neck, so the head meets the robe instead of floating above it.
    ctx.fillStyle = '#8f887c';
    ctx.fillRect(g.x - g.headR * 0.32, g.headY + g.headR * 0.55, g.headR * 0.64, H * 0.03);
    // Seated robe: a simple trapezoid widening to the base, stone grey.
    ctx.fillStyle = (i % 2 === 0) ? STONE : '#3a3633';
    ctx.beginPath();
    ctx.moveTo(g.x - g.shoulderW * 0.62, g.shoulderY);
    ctx.lineTo(g.x + g.shoulderW * 0.62, g.shoulderY);
    ctx.lineTo(g.x + g.shoulderW * 0.95, g.baseY);
    ctx.lineTo(g.x - g.shoulderW * 0.95, g.baseY);
    ctx.closePath();
    ctx.fill();
    // Stole in the figure's stave color, a band across the shoulders.
    ctx.strokeStyle = hexA(color, 0.9);
    ctx.lineWidth = Math.max(3, H * 0.008);
    ctx.beginPath();
    ctx.moveTo(g.x - g.shoulderW * 0.5, g.shoulderY + H * 0.012);
    ctx.lineTo(g.x + g.shoulderW * 0.5, g.shoulderY + H * 0.012);
    ctx.stroke();
    // Head: a plain round, no face. A cream veil arc over the top.
    ctx.fillStyle = '#8f887c';
    ctx.beginPath(); ctx.moveTo(g.x + g.headR, g.headY); ctx.arc(g.x, g.headY, g.headR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(CREAM, 0.55);
    ctx.lineWidth = Math.max(1.5, H * 0.003);
    ctx.beginPath();
    ctx.moveTo(g.x - g.headR * 0.95, g.headY - g.headR * 0.25);
    ctx.arc(g.x, g.headY, g.headR * 0.95, Math.PI * 1.08, Math.PI * 1.92);
    ctx.stroke();
    // Arms: two short lines from shoulders down to the tablet.
    var tab = tabletGeom(i);
    ctx.strokeStyle = hexA('#3a3633', 1);
    ctx.lineWidth = Math.max(4, H * 0.009);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(g.x - g.shoulderW * 0.45, g.shoulderY + H * 0.01);
    ctx.lineTo(tab.cx - tab.w * 0.28, tab.y + tab.h * 0.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(g.x + g.shoulderW * 0.45, g.shoulderY + H * 0.01);
    ctx.lineTo(tab.cx + tab.w * 0.28, tab.y + tab.h * 0.5);
    ctx.stroke();
  }

  function drawTablet(i) {
    var tab = tabletGeom(i);
    // Cool blue glow halo behind the tablet.
    ctx.fillStyle = hexA(BLUE_GLOW, 0.12);
    ctx.fillRect(tab.x - 4, tab.y - 4, tab.w + 8, tab.h + 8);
    ctx.save();
    ctx.translate(tab.cx, tab.y + tab.h / 2);
    ctx.rotate(tab.tilt);
    ctx.fillStyle = BLUE_DK;
    ctx.fillRect(-tab.w / 2, -tab.h / 2, tab.w, tab.h);
    ctx.strokeStyle = hexA(BLUE, 0.9);
    ctx.lineWidth = Math.max(1, H * 0.0018);
    ctx.strokeRect(-tab.w / 2, -tab.h / 2, tab.w, tab.h);
    // Glowing lines of notation on the screen.
    ctx.strokeStyle = hexA(BLUE, 0.75);
    ctx.lineWidth = Math.max(1, H * 0.0016);
    for (var l = 0; l < 3; l++) {
      var ly = -tab.h / 2 + tab.h * (0.28 + l * 0.24);
      ctx.beginPath();
      ctx.moveTo(-tab.w / 2 + 4, ly);
      ctx.lineTo(tab.w / 2 - 4 - l * 5, ly);
      ctx.stroke();
    }
    ctx.restore();
  }

  // One stave: a ribbon whose stiffness follows the written/improv flag.
  // Written stretches are drawn as straight crisp segments with small
  // note heads; improvised stretches get an extra loose wiggle and are
  // drawn as hand-drawn curves with loose curls instead of notation.
  function drawStave(i, t) {
    var color = STAVES[i];
    var tab = tabletGeom(i);
    var topY = braidTopY();
    var n = 90;
    var dy = (tab.cy - topY) / n;
    var lw = Math.max(4, H * 0.010);
    ctx.lineCap = 'round';
    for (var s = 0; s < n; s++) {
      var y0 = tab.cy - s * dy;
      var y1 = tab.cy - (s + 1) * dy;
      var p0 = braidPoint(i, y0, t);
      var p1 = braidPoint(i, y1, t);
      var written = isWritten(i, (y0 + y1) / 2, t);
      var x0 = p0.x, x1 = p1.x;
      if (!written) {
        var wig = Math.sin(y0 * 0.09 + i * 3.1 + t * 0.30) * W * 0.008;
        x0 += wig; x1 += Math.sin(y1 * 0.09 + i * 3.1 + t * 0.30) * W * 0.008;
      }
      ctx.strokeStyle = hexA(color, written ? 0.95 : 0.8);
      ctx.lineWidth = written ? lw : lw * 0.8;
      ctx.beginPath();
      if (written) {
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
      } else {
        var mx = (x0 + x1) / 2 + Math.sin(y0 * 0.11 + i * 2.0 + t * 0.25) * W * 0.006;
        var my = (y0 + y1) / 2;
        ctx.moveTo(x0, y0);
        ctx.quadraticCurveTo(mx, my, x1, y1);
      }
      ctx.stroke();
    }
    // Notation on written stretches, loose curls on improvised ones.
    for (var k = 0; k < 14; k++) {
      var u = 0.06 + k * 0.068;
      var y = tab.cy - u * (tab.cy - topY);
      var p = braidPoint(i, y, t);
      if (isWritten(i, y, t)) {
        var r = Math.max(2, H * 0.0035);
        ctx.fillStyle = hexA(color, 0.95);
        ctx.beginPath(); ctx.moveTo(p.x + r, p.y); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = hexA(color, 0.95);
        ctx.lineWidth = Math.max(1, H * 0.0016);
        ctx.beginPath();
        ctx.moveTo(p.x + r, p.y);
        ctx.lineTo(p.x + r, p.y - H * 0.018);
        ctx.stroke();
      } else {
        ctx.strokeStyle = hexA(color, 0.7);
        ctx.lineWidth = Math.max(1, H * 0.0016);
        ctx.beginPath();
        ctx.moveTo(p.x - W * 0.008, p.y);
        ctx.quadraticCurveTo(p.x, p.y - H * 0.012, p.x + W * 0.008, p.y - H * 0.002);
        ctx.stroke();
      }
    }
  }

  // The unlit candle at the exact center of the lower edge: a cream
  // body on a small dish, a short dark wick, no flame, no glow.
  function drawCandle() {
    var cx = W / 2;
    var baseY = H - 36;
    var cw = Math.max(12, W * 0.022);
    var ch = Math.max(22, H * 0.036);
    // Dish.
    ctx.fillStyle = hexA(STONE_LT, 0.8);
    ctx.beginPath();
    ctx.moveTo(cx - cw, baseY);
    ctx.lineTo(cx + cw, baseY);
    ctx.lineTo(cx + cw * 0.7, baseY + 4);
    ctx.lineTo(cx - cw * 0.7, baseY + 4);
    ctx.closePath();
    ctx.fill();
    // Wax body.
    ctx.fillStyle = CREAM;
    ctx.fillRect(cx - cw / 2, baseY - ch, cw, ch);
    // A drip of wax down the left side.
    ctx.fillStyle = hexA(CREAM, 0.9);
    ctx.fillRect(cx - cw / 2, baseY - ch * 0.55, Math.max(2, cw * 0.18), ch * 0.35);
    // Wick: short, dark, unlit, with a tiny curl.
    ctx.strokeStyle = '#2a2118';
    ctx.lineWidth = Math.max(1.5, H * 0.0025);
    ctx.beginPath();
    ctx.moveTo(cx, baseY - ch);
    ctx.quadraticCurveTo(cx + 2, baseY - ch - 5, cx + 4, baseY - ch - 6);
    ctx.stroke();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // One fresh seeded PRNG per draw keeps every frame reproducible.
    var rng = mulberry32(1925);

    drawStone(rng);
    // Braid first, so the staves rise from behind the tablets and pass
    // behind the figures instead of crossing their faces.
    var order = [0, 3, 1, 2];
    for (var k = 0; k < 4; k++) { drawStave(order[k], t); }
    for (var i = 0; i < 4; i++) { drawFigure(i); }
    for (var j = 0; j < 4; j++) { drawTablet(j); }
    drawCandle();

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = CREAM;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Facades', 18, 34);
    ctx.fillStyle = CREAM_DIM;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1925 · 2007 · 04 · 20', 18, 34 + fs2 + 8);

    // Hint, centered at the bottom, below the candle dish.
    ctx.fillStyle = hexA(CREAM_DIM, 0.9);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the braid form.', W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - t0) / 1000;
    }
    return 0;
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T + elapsed()); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T + elapsed()); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no interaction, no click-to-reload, no audio. All motion
  // runs under 1 Hz, well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
