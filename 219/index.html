<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.219 Machine Quartet</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#DDD5C2; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.219 Machine Quartet (Kathy McTavish). Four machines draw on
// warm paper in counterpoint, pens never lifting: a jittered random
// walk, a Lissajous figure, a curl-noise drift, a slow decaying orbit.
// Every twenty seconds or so a convergence pulls all four toward one
// invisible point for five seconds, the lines braiding together, then
// releases them back to their own rules. Old ink fades over a minute
// so the braid never clutters. Drag near a thread and it abandons its
// rule to follow your hand for three seconds, then rejoins.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#DDD5C2';
var W = 0, H = 0, phone = false, unit = 600, scale = 1;
var seed = 219219;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
var T = 0, lastNow = -1;

// ---- value noise (for the curl thread) -------------------------------------------------
function hash2(ix, iy) {
  var n = Math.sin(ix * 127.1 + iy * 311.7 + seed * 0.013) * 43758.5453;
  return n - Math.floor(n);
}
function vnoise(x, y) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  var a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}
function curlAngle(x, y, t) {
  return vnoise(x * 0.0042 + t * 0.020, y * 0.0042) * 12.6 + vnoise(x * 0.0016 - t * 0.008, y * 0.0016) * 6.3;
}

// ---- the four threads ---------------------------------------------------------------------
var CYCLE = 22, EVENT_AT = 17, EVENT_LEN = 5; // convergence grammar
var attractor = { x: 0, y: 0 }, lastCycle = -1;
var threads = [];
function makeThread(kind, color, sx, sy) {
  var th = { kind: kind, color: color, x: sx, y: sy, pts: [], rand: rng(seed + kind * 331),
             heading: rand() * 6.28, ph1: rand() * 6.28, ph2: rand() * 6.28,
             cx: sx, cy: sy, ocx: sx, ocy: sy, orad: 100, oang: rand() * 6.28,
             ocyc: rand() * 20, offA: kind * 1.7, ovr: null };
  threads.push(th);
  return th;
}
function threadVelocity(th, dt) {
  var vx = 0, vy = 0;
  if (th.kind === 0) {          // jittered random walk
    th.heading += (th.rand() - 0.5) * 3.4 * dt;
    vx = Math.cos(th.heading) * 58; vy = Math.sin(th.heading) * 58;
  } else if (th.kind === 1) {   // Lissajous around a roaming centre
    var cx = W / 2 + Math.sin(T * 0.045 + 1.0) * W * 0.17;
    var cy = H / 2 + Math.cos(T * 0.034) * H * 0.16;
    var tx = cx + Math.sin(T * 0.31 + th.ph1) * W * 0.26;
    var ty = cy + Math.sin(T * 0.43 + th.ph2) * H * 0.30;
    vx = (tx - th.x) * 2.0; vy = (ty - th.y) * 2.0;
  } else if (th.kind === 2) {   // curl-noise drift
    var a = curlAngle(th.x, th.y, T);
    vx = Math.cos(a) * 52; vy = Math.sin(a) * 52;
  } else {                      // slow decaying orbit, then a fresh centre
    th.ocyc += dt;
    var frac = (th.ocyc % 26) / 26;
    if (frac < 0.004 && th.ocyc > 1) { th.ocx = W * (0.25 + th.rand() * 0.5); th.ocy = H * (0.25 + th.rand() * 0.5); th.orad = unit * (0.16 + th.rand() * 0.14); }
    var r = th.orad * (1 - 0.72 * frac);
    th.oang += dt * 0.55;
    var ox = th.ocx + Math.cos(th.oang) * r, oy = th.ocy + Math.sin(th.oang) * r * 0.78;
    vx = (ox - th.x) * 2.4; vy = (oy - th.y) * 2.4;
  }
  // soft margin: the paper has edges, the machines respect them
  var m = unit * 0.07;
  if (th.x < m) vx += (m - th.x) * 3.2;
  if (th.x > W - m) vx -= (th.x - (W - m)) * 3.2;
  if (th.y < m) vy += (m - th.y) * 3.2;
  if (th.y > H - m) vy -= (th.y - (H - m)) * 3.2;
  return { x: vx * scale, y: vy * scale };
}
function stepThreads(dt) {
  T += dt;
  // convergence scheduler: one unison event per cycle
  var cyc = Math.floor(T / CYCLE), ct = T - cyc * CYCLE;
  var s = 0;
  if (ct >= EVENT_AT && ct < EVENT_AT + EVENT_LEN) {
    if (cyc !== lastCycle) {
      lastCycle = cyc;
      attractor.x = W * (0.3 + rand() * 0.4);
      attractor.y = H * (0.3 + rand() * 0.4);
    }
    var u = (ct - EVENT_AT) / EVENT_LEN;
    s = smooth(u / 0.25) * (1 - smooth((u - 0.75) / 0.25));
  }
  var sigma = unit * 0.40;
  for (var i = 0; i < threads.length; i++) {
    var th = threads[i];
    var v = threadVelocity(th, dt);
    th.x += v.x * dt; th.y += v.y * dt;
    if (s > 0) { // the pull: gaussian weight by distance to the attractor
      var px = attractor.x + Math.cos(th.offA) * unit * 0.016;
      var py = attractor.y + Math.sin(th.offA) * unit * 0.016;
      var d = Math.hypot(th.x - px, th.y - py);
      var g = Math.exp(-(d * d) / (2 * sigma * sigma));
      var kk = Math.min(1, s * g * dt * 3.4);
      th.x = lerp(th.x, px, kk); th.y = lerp(th.y, py, kk);
    }
    if (th.ovr) { // a hand is disturbing this thread, or just let go
      var ok = th.ovr.held ? 0.38 : 0.10 * Math.max(0, (th.ovr.until - T) / 3);
      th.x = lerp(th.x, th.ovr.x, ok); th.y = lerp(th.y, th.ovr.y, ok);
      if (!th.ovr.held && T >= th.ovr.until) th.ovr = null;
    }
    th.x = clamp(th.x, 4, W - 4); th.y = clamp(th.y, 4, H - 4);
    th.pts.push({ x: th.x, y: th.y, t: T });
    while (th.pts.length && T - th.pts[0].t > 62) th.pts.shift();
  }
}

// ---- drawing ---------------------------------------------------------------------------------
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var i = 0; i < threads.length; i++) {
    var th = threads[i], pts = th.pts;
    ctx.strokeStyle = th.color;
    // stroke in age runs so one path never mixes two fades
    var runStart = 0;
    for (var j = 1; j <= pts.length; j++) {
      var endRun = j === pts.length || Math.floor((T - pts[j].t) / 6) !== Math.floor((T - pts[runStart].t) / 6);
      if (endRun) {
        var midAge = T - pts[Math.floor((runStart + j - 1) / 2)].t;
        ctx.globalAlpha = clamp(1.05 - midAge / 60, 0.05, 1);
        ctx.beginPath();
        ctx.moveTo(pts[runStart].x, pts[runStart].y);
        for (var q = runStart + 1; q < j; q++) ctx.lineTo(pts[q].x, pts[q].y);
        ctx.stroke();
        runStart = j;
      }
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = th.color;
    ctx.beginPath(); ctx.arc(th.x, th.y, 2.6, 0, 6.284); ctx.fill();
  }
}

// ---- input: disturb the nearest thread ----------------------------------------------------------
var dragTh = null;
function evtPos(e) {
  var r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = evtPos(e), best = null, bd = 1e9;
  for (var i = 0; i < threads.length; i++) {
    var d = Math.hypot(threads[i].x - p.x, threads[i].y - p.y);
    if (d < bd) { bd = d; best = threads[i]; }
  }
  dragTh = best;
  if (dragTh) dragTh.ovr = { x: p.x, y: p.y, held: true, until: 0 };
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragTh) return;
  var p = evtPos(e);
  dragTh.ovr.x = p.x; dragTh.ovr.y = p.y;
});
function endDragTh() {
  if (dragTh && dragTh.ovr) { dragTh.ovr.held = false; dragTh.ovr.until = T + 3; }
  dragTh = null;
}
canvas.addEventListener('pointerup', endDragTh);
canvas.addEventListener('pointercancel', endDragTh);

// ---- resize ------------------------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  unit = Math.min(W, H);
  scale = clamp(unit / 900, 0.45, 1.2);
  for (var i = 0; i < threads.length; i++) {
    threads[i].x = clamp(threads[i].x, 4, W - 4);
    threads[i].y = clamp(threads[i].y, 4, H - 4);
  }
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame ------------------------------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  if (dt > 0) { // advance in fixed small steps so fast frames stay smooth
    var steps = Math.max(1, Math.round(dt / (1 / 60)));
    for (var s = 0; s < steps; s++) stepThreads(dt / steps);
  }
  draw();
}
makeThread(0, '#2B3A67', 0, 0);
makeThread(1, '#A63A2E', 0, 0);
makeThread(2, '#C98A2E', 0, 0);
makeThread(3, '#4A5240', 0, 0);
resize();
// starting posts, then a fifty five second pre-run: the paper opens
// with four developed wanderings, two braids already in the tails
threads[0].x = W * 0.24; threads[0].y = H * 0.30;
threads[1].x = W * 0.62; threads[1].y = H * 0.42;
threads[2].x = W * 0.40; threads[2].y = H * 0.66;
threads[3].x = W * 0.72; threads[3].y = H * 0.70;
threads[3].ocx = W * 0.66; threads[3].ocy = H * 0.62; threads[3].orad = unit * 0.22;
for (var pr = 0; pr < 55 * 30; pr++) stepThreads(1 / 30);
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
