<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№33 · Ten Ways In</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1ea; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// No33 Ten Ways In (after ruuddotorg, via Bug's ig-artist-study prompts).
// Four items can be paired up in exactly 10 ways (the involutions of
// 4 elements: leave everything single, make one pair, or make two).
// This piece enumerates all 10 by recursion at load and asserts the
// count. One panel fills the frame: 4 dots on a line (two filled,
// two open, the split fixed) with the pairing drawn as shallow
// indigo arcs above the line. The sequence walks involution to
// involution; the arcs lift, cross, and settle into the next one,
// and after the last the cycle resets. Arcs are drawn by presence:
// every possible pair has a presence value, and morphing
// interpolates presences, so arcs grow, shrink, and cross smoothly.
// Drag horizontally to scrub the sequence. Ground #f4f1ea, ink
// #1a1a1a, arcs indigo #2b3a67.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '33', 10) || 33;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f4f1ea';
const INK = '#1a1a1a';
const INDIGO = '#2b3a67';

// Enumerate involutions of [0,1,2,3]: recursion over the first free item.
function involutions() {
  const out = [];
  function rec(free, pairs) {
    if (!free.length) { out.push(pairs.slice()); return; }
    const i = free[0];
    rec(free.slice(1), pairs);                       // i stays single
    for (let k = 1; k < free.length; k++) {
      const j = free[k];
      const rest = free.filter(x => x !== i && x !== j);
      pairs.push([i, j]);
      rec(rest, pairs);
      pairs.pop();
    }
  }
  rec([0, 1, 2, 3], []);
  return out;
}
const INVOLUTIONS = involutions();                    // exactly 10
const PAIRS = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
function presence(inv) {
  const v = [0,0,0,0,0,0];
  for (const [a, b] of inv) v[PAIRS.findIndex(([x, y]) => x === a && y === b)] = 1;
  return v;
}
const PRES = INVOLUTIONS.map(presence);
const VISIT = 1.5;          // seconds per panel visit
const LOOP = VISIT * 10 + 1.2;   // visits + reset beat

let scrub = 0;
let dragInfo = null;
let holdPos = null, holdUntil = 0;

function layout(w, h) {
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  return { RX, RY, ox: (w - RX) / 2, oy: (h - RY) / 2 };
}

const FILLED = [true, false, true, false];

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const { RX, RY, ox, oy } = layout(w, h);
  let tPos;
  if (dragInfo) tPos = dragInfo.pos;
  else if (holdPos != null && performance.now() / 1000 < holdUntil) tPos = holdPos;
  else tPos = ((nowMs / 1000 + scrub) % LOOP + LOOP) % LOOP;

  // single centered panel: which involution we are morphing from,
  // and how far into the morph
  const k = Math.floor(tPos / VISIT) % 10;
  const visitStart = k * VISIT;
  let mix = 0;   // 0 = own involution, 1 = next involution
  if (tPos >= visitStart) {
    const into = tPos - visitStart;
    if (into < VISIT * 0.8) {
      const u = into / (VISIT * 0.8);
      mix = u * u * (3 - 2 * u);
    } else mix = 1;
  }
  const from = PRES[k], to = PRES[(k + 1) % 10];

  const size = Math.min(RX, RY) * 0.7;
  const px = ox + (RX - size) / 2, py = oy + (RY - size) / 2;
  const lineY = py + size * 0.62;
  const span = size * 0.66;
  const x0 = px + (size - span) / 2;
  const xs = [0, 1, 2, 3].map(i => x0 + span * (i / 3));
  const dotR = size * 0.05;
  const lift = mix > 0 && mix < 1 ? Math.sin(mix * Math.PI) * size * 0.1 : 0;

  // arcs
  PAIRS.forEach(([a, b], pi) => {
    const pv = from[pi] + (to[pi] - from[pi]) * mix;
    if (pv <= 0.02) return;
    const hgt = size * 0.34 * (0.35 + 0.65 * pv) * (0.55 + 0.45 * (b - a) / 1.6);
    ctx.strokeStyle = 'rgba(43,58,103,' + (0.25 + 0.75 * pv).toFixed(3) + ')';
    ctx.lineWidth = Math.max(0.9, size * 0.016);
    ctx.beginPath();
    ctx.moveTo(xs[a], lineY);
    ctx.quadraticCurveTo((xs[a] + xs[b]) / 2, lineY - hgt * 2 - lift, xs[b], lineY);
    ctx.stroke();
  });

  // baseline
  ctx.strokeStyle = 'rgba(26,26,26,0.25)';
  ctx.lineWidth = Math.max(0.7, dotR * 0.16);
  ctx.beginPath();
  ctx.moveTo(x0 - span * 0.08, lineY);
  ctx.lineTo(x0 + span * 1.08, lineY);
  ctx.stroke();

  // dots
  xs.forEach((x, di) => {
    ctx.beginPath();
    ctx.arc(x, lineY, dotR, 0, Math.PI * 2);
    if (FILLED[di]) { ctx.fillStyle = INK; ctx.fill(); }
    else { ctx.fillStyle = GROUND; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = Math.max(0.8, dotR * 0.3); ctx.stroke(); }
  });

  return { RX, ox };
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(2900);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function pointerX(ev) {
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0 };
  return ev.clientX - r.left;
}
function currentPos() {
  if (dragInfo) return dragInfo.pos;
  return ((performance.now() / 1000 + scrub) % LOOP + LOOP) % LOOP;
}
canvas.addEventListener('pointerdown', ev => {
  dragInfo = { x: pointerX(ev), startPos: currentPos(), pos: currentPos() };
  holdPos = null;
});
canvas.addEventListener('pointermove', ev => {
  if (!dragInfo) return;
  const [w, h] = viewportWH();
  const L = layout(w, h);
  const dx = pointerX(ev) - dragInfo.x;
  dragInfo.pos = (((dragInfo.startPos + (dx / L.RX) * LOOP) % LOOP) + LOOP) % LOOP;
});
function endDrag() {
  if (!dragInfo) return;
  holdPos = dragInfo.pos;
  holdUntil = performance.now() / 1000 + 4;
  scrub = dragInfo.pos - performance.now() / 1000;
  dragInfo = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
