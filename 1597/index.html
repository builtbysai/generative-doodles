<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History Is Continuous</title>
<style>
html, body { margin: 0; padding: 0; background: #FAFAF7; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = [250, 250, 247];
var MAGENTA = [216, 58, 140];
var VIOLET = [122, 63, 209];
var BLUE = [42, 78, 232];
var GREEN = [78, 154, 81];
var AMBER = [232, 160, 58];
var INK = [51, 48, 46];
var PALETTE = [MAGENTA, VIOLET, BLUE, GREEN, AMBER];
var PHASE = 20.0;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function u() { return Math.min(VW, VH) / 100; }

/* Crowd grid: ~2000 seeded figures, laid out fresh per layout so the count
   stays in the 1500-2500 band on both square and tall screens. */
function gridFor(comp) {
  var cols = 48;
  var rows = Math.round(cols * comp.h / comp.w);
  var total = cols * rows;
  if (total > 2500) {
    var f = Math.sqrt(2500 / total);
    cols = Math.max(20, Math.floor(cols * f));
    rows = Math.max(20, Math.floor(rows * f));
  }
  return { cols: cols, rows: rows };
}
function figureSeed(i, j) {
  return 1597000 + i * 104729 + j * 7919;
}
/* One gestural contour figure, drawn at (x, y) with height h.
   Head arc, torso curve, arm and leg hints, all hand-jittered strokes,
   never fills. Every glyph differs: lean, limb pose, arc span and jitter
   all come from the figure's own seed. */
function drawFigure(x, y, h, rng) {
  var lean = (rng() - 0.5) * 0.22 * h;
  var headR = h * (0.10 + rng() * 0.035);
  var headY = y - h * 0.36;
  var headX = x + lean * 0.4;
  var a0 = -Math.PI * (0.15 + rng() * 0.35);
  var a1 = Math.PI * (0.85 + rng() * 0.45);
  var jit = h * 0.03;
  var i, px, py;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  /* head arc */
  ctx.beginPath();
  var nA = 7;
  for (i = 0; i <= nA; i++) {
    var a = a0 + (a1 - a0) * (i / nA);
    px = headX + Math.cos(a) * headR + (rng() - 0.5) * 2 * jit;
    py = headY + Math.sin(a) * headR + (rng() - 0.5) * 2 * jit;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  /* torso curve, head to hip */
  var shoulderY = y - h * 0.22;
  var hipY = y + h * 0.16;
  var bow = (rng() - 0.5) * 0.10 * h;
  ctx.beginPath();
  var nT = 5;
  for (i = 0; i <= nT; i++) {
    var t = i / nT;
    px = x + lean * t + Math.sin(t * Math.PI) * bow + (rng() - 0.5) * 2 * jit;
    py = shoulderY + (hipY - shoulderY) * t + (rng() - 0.5) * 2 * jit;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  /* arms: two short strokes from the shoulder, pose varies by seed */
  var armMode = Math.floor(rng() * 3);
  var shoulderX = x + lean * 0.1;
  var armLen = h * (0.16 + rng() * 0.08);
  var sides = [-1, 1];
  for (var s = 0; s < 2; s++) {
    var side = sides[s];
    var dx, dy;
    if (armMode === 0) { dx = side * armLen * 0.7; dy = armLen * 0.55; }
    else if (armMode === 1) { dx = side * armLen * 0.85; dy = -armLen * 0.25; }
    else { dx = side * armLen * 0.45; dy = armLen * 0.9; }
    ctx.beginPath();
    ctx.moveTo(shoulderX + (rng() - 0.5) * jit, shoulderY + (rng() - 0.5) * jit);
    ctx.lineTo(shoulderX + dx * 0.6 + (rng() - 0.5) * 2 * jit, shoulderY + dy * 0.6 + (rng() - 0.5) * 2 * jit);
    ctx.lineTo(shoulderX + dx + (rng() - 0.5) * 2 * jit, shoulderY + dy + (rng() - 0.5) * 2 * jit);
    ctx.stroke();
  }
  /* legs: two strokes from the hip, stride varies by seed */
  var hipX = x + lean;
  var legLen = h * (0.30 + rng() * 0.06);
  for (var l = 0; l < 2; l++) {
    var lside = l === 0 ? -1 : 1;
    var stride = (rng() - 0.5) * 0.16 * h;
    ctx.beginPath();
    ctx.moveTo(hipX + (rng() - 0.5) * jit, hipY + (rng() - 0.5) * jit);
    ctx.lineTo(hipX + lside * h * 0.05 + stride * 0.5 + (rng() - 0.5) * 2 * jit, hipY + legLen * 0.55 + (rng() - 0.5) * 2 * jit);
    ctx.lineTo(hipX + lside * h * 0.06 + stride + (rng() - 0.5) * 2 * jit, hipY + legLen + (rng() - 0.5) * 2 * jit);
    ctx.stroke();
  }
}
function draw(t) {
  size();
  ctx.fillStyle = 'rgb(' + GROUND[0] + ',' + GROUND[1] + ',' + GROUND[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var comp = compRect();
  var grid = gridFor(comp);
  var cellW = comp.w / grid.cols;
  var cellH = comp.h / grid.rows;
  var figH = Math.min(cellH * 1.30, 0.03 * VH);
  var lw = Math.max(0.9, 0.10 * u());
  var dt = t - PHASE;
  /* whole-field drift: ~0.5% of frame, period ~2 minutes, zero at frame one */
  var driftX = Math.sin(dt * 0.05) * 0.005 * comp.w;
  var driftY = Math.cos(dt * 0.043) * 0.003 * comp.h;
  ctx.save();
  ctx.beginPath();
  ctx.rect(comp.x, comp.y, comp.w, comp.h);
  ctx.clip();
  var j, i;
  for (j = 0; j < grid.rows; j++) {
    for (i = 0; i < grid.cols; i++) {
      var rng = mulberry32(figureSeed(i, j));
      var roll = rng();
      var color = PALETTE[Math.floor(roll * 5) % 5];
      var jx = (rng() - 0.5) * cellW * 1.0;
      var jy = (rng() - 0.5) * cellH * 1.0;
      var scale = 0.85 + rng() * 0.30;
      var phase = rng() * TAU;
      var sway = Math.sin(dt * 0.15 + phase) * 0.6;
      var bx = comp.x + (i + 0.5) * cellW + jx + driftX + sway;
      var by = comp.y + (j + 0.5) * cellH + jy + driftY + sway * 0.4;
      /* edge wrap: figures drifting out re-enter on the opposite edge */
      bx = comp.x + (((bx - comp.x) % comp.w) + comp.w) % comp.w;
      by = comp.y + (((by - comp.y) % comp.h) + comp.h) % comp.h;
      ctx.strokeStyle = rgba(color, 0.85);
      ctx.lineWidth = lw;
      drawFigure(bx, by, Math.min(figH * scale, 0.03 * VH), rng);
    }
  }
  ctx.restore();
  /* copy: soft white ground behind each line so it reads over the crowd */
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  var cx = comp.x + comp.w / 2;
  var topY = comp.y + Math.max(6, 0.012 * comp.h);
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var tw = ctx.measureText('History Is Continuous').width;
  ctx.fillStyle = rgba(GROUND, 0.78);
  ctx.fillRect(cx - tw / 2 - 8, topY - 3, tw + 16, titlePx + 6);
  ctx.fillStyle = rgba(INK, 0.72);
  ctx.fillText('History Is Continuous', cx, topY);
  ctx.font = smallPx + 'px monospace';
  var dw = ctx.measureText('2006 · 05 · 27').width;
  ctx.fillStyle = rgba(GROUND, 0.78);
  ctx.fillRect(cx - dw / 2 - 8, topY + titlePx + 4, dw + 16, smallPx + 4);
  ctx.fillStyle = rgba(INK, 0.55);
  ctx.fillText('2006 · 05 · 27', cx, topY + titlePx + 5);
  var hint = 'Watch only. The crowd breathes.';
  var hw = ctx.measureText(hint).width;
  var hy = comp.y + comp.h - smallPx - 10;
  ctx.fillStyle = rgba(GROUND, 0.78);
  ctx.fillRect(cx - hw / 2 - 8, hy - 3, hw + 16, smallPx + 6);
  ctx.fillStyle = rgba(INK, 0.6);
  ctx.fillText(hint, cx, hy);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
