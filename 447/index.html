<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Radiant Still Life</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1E8A9B; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  // deterministic PRNG (mulberry32, fixed seed)
  function RNG(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var PHASE0 = 1.5; // constant first-frame loop phase (seconds); never Date.now()

  // paper grain field (data, drawn directly each frame)
  var grain = [];
  (function () {
    var r = RNG(447001);
    for (var i = 0; i < 900; i++) {
      grain.push({ x: r(), y: r(), s: 0.6 + r() * 1.6, a: 0.02 + r() * 0.06, lite: r() > 0.5 });
    }
  })();

  // exactly 24 dashed rays: base angle, length fraction, dash/gap scale
  var rays = [];
  (function () {
    var r = RNG(447002);
    for (var i = 0; i < 24; i++) {
      rays.push({
        a: i * Math.PI / 12 + (r() - 0.5) * 0.10,
        len: 0.30 + r() * 0.24,
        dash: 0.55 + r() * 0.6,
        gap: 0.55 + r() * 0.6,
        w: 0.006 + r() * 0.008
      });
    }
  })();

  // exactly 20 bokeh orbs: base position, radius (diameter 8-60px at 720 scale),
  // lissajous drift, colour, alpha, stir weight; first 10 behind glass, last 10 in front
  var ORB_COLORS = ['#E94F7A', '#F5D90A', '#7FE0D4', '#B48AE0', '#F2F2F2'];
  var orbs = [];
  (function () {
    var r = RNG(447003);
    for (var i = 0; i < 20; i++) {
      var nearGlass = i >= 4 && i < 10; // a few orbs sit close to the glass
      orbs.push({
        x: nearGlass ? 0.5 + (r() - 0.5) * 0.45 : r(),
        y: nearGlass ? 0.55 + (r() - 0.5) * 0.45 : r(),
        rad: (8 + r() * 52) / 2,
        wx: 0.10 + r() * 0.12,
        wy: 0.08 + r() * 0.12,
        px: r() * Math.PI * 2,
        py: r() * Math.PI * 2,
        amp: 0.02 + r() * 0.03,
        col: ORB_COLORS[Math.floor(r() * ORB_COLORS.length)],
        a: 0.35 + r() * 0.45,
        w: 0.3 + r() * 0.7
      });
    }
  })();

  // drag stir state (zero at load, so the first frame is fixed)
  var stirX = 0, stirY = 0, dragging = false, lastX = 0, lastY = 0;

  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function drawOrb(o, t, S, sc) {
    var ox = o.x * W + Math.sin(t * o.wx + o.px) * W * o.amp + stirX * o.w;
    var oy = o.y * H + Math.sin(t * o.wy + o.py) * H * o.amp + stirY * o.w;
    var rr = o.rad * sc;
    var g = ctx.createRadialGradient(ox, oy, 0, ox, oy, rr);
    g.addColorStop(0, hexA(o.col, o.a));
    g.addColorStop(0.7, hexA(o.col, o.a * 0.55));
    g.addColorStop(1, hexA(o.col, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ox, oy, rr, 0, Math.PI * 2); ctx.fill();
  }

  function drawGlass(cx, cy, S) {
    var glassH = 0.60 * S;
    var topY = cy - glassH * 0.52;
    var bowlBottom = cy - glassH * 0.10;
    var footY = cy + glassH * 0.48;
    var bw = 0.46 * S;   // bowl top width
    var sw = 0.05 * S;   // stem width
    var fw = 0.22 * S;   // foot width

    // stem and foot (behind the bowl)
    ctx.fillStyle = '#7A2E0E';
    ctx.fillRect(cx - sw * 0.5, bowlBottom, sw, footY - bowlBottom - S * 0.012);
    ctx.beginPath(); ctx.ellipse(cx, footY - S * 0.006, fw * 0.5, S * 0.012, 0, 0, Math.PI * 2); ctx.fill();

    // bowl: wide coupe triangle with a soft curve
    var g = ctx.createLinearGradient(cx - bw * 0.5, 0, cx + bw * 0.5, 0);
    g.addColorStop(0, '#E2571B');
    g.addColorStop(0.55, '#E2571B');
    g.addColorStop(1, '#7A2E0E');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx - bw * 0.5, topY);
    ctx.quadraticCurveTo(cx - bw * 0.28, topY + (bowlBottom - topY) * 0.55, cx, bowlBottom);
    ctx.quadraticCurveTo(cx + bw * 0.28, topY + (bowlBottom - topY) * 0.55, cx + bw * 0.5, topY);
    ctx.closePath(); ctx.fill();

    // rim line and gloss highlight
    ctx.strokeStyle = 'rgba(122,46,14,0.85)';
    ctx.lineWidth = Math.max(1, S * 0.004);
    ctx.beginPath(); ctx.moveTo(cx - bw * 0.5, topY); ctx.lineTo(cx + bw * 0.5, topY); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(cx - bw * 0.26, topY + (bowlBottom - topY) * 0.42, bw * 0.045, (bowlBottom - topY) * 0.22, -0.35, 0, Math.PI * 2);
    ctx.fill();
    // dark shading wedge on the lower right of the bowl
    ctx.fillStyle = 'rgba(122,46,14,0.35)';
    ctx.beginPath();
    ctx.moveTo(cx + bw * 0.5, topY);
    ctx.quadraticCurveTo(cx + bw * 0.28, topY + (bowlBottom - topY) * 0.55, cx, bowlBottom);
    ctx.lineTo(cx + bw * 0.12, topY + (bowlBottom - topY) * 0.30);
    ctx.closePath(); ctx.fill();
  }

  function drawEye(cx, ey, S, t) {
    var eyeW = 0.12 * S;
    // blink every 9s: 0.5s calm, brief scaleY collapse; open at PHASE0
    var p = t % 9;
    var blink = 1;
    if (p < 0.5) blink = 1 - Math.sin(Math.PI * p / 0.5) * 0.93;
    var bob = Math.sin(t * 0.5) * S * 0.006;
    var y = ey + bob;
    var rx = eyeW * 0.5, ry = eyeW * 0.30 * blink;
    ctx.fillStyle = '#F5F0E6';
    ctx.beginPath(); ctx.ellipse(cx, y, rx, Math.max(ry, eyeW * 0.02), 0, 0, Math.PI * 2); ctx.fill();
    if (blink > 0.25) {
      var ir = eyeW * 0.17 * Math.min(1, blink + 0.3);
      ctx.fillStyle = '#2E6B4A';
      ctx.beginPath(); ctx.arc(cx, y, ir, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#12241C';
      ctx.beginPath(); ctx.arc(cx, y, ir * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(cx - ir * 0.3, y - ir * 0.3, ir * 0.16, 0, Math.PI * 2); ctx.fill();
    }
    // lid line keeps the eye calm and graphic when open
    ctx.strokeStyle = 'rgba(18,36,28,0.55)';
    ctx.lineWidth = Math.max(1, S * 0.003);
    ctx.beginPath(); ctx.ellipse(cx, y, rx, Math.max(ry, eyeW * 0.02), 0, Math.PI, Math.PI * 2); ctx.stroke();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // ground: turquoise with a soft central lift
    ctx.fillStyle = '#1E8A9B';
    ctx.fillRect(0, 0, W, H);
    var vg = ctx.createRadialGradient(W / 2, H * 0.52, 0, W / 2, H * 0.52, Math.max(W, H) * 0.72);
    vg.addColorStop(0, 'rgba(255,255,255,0.08)');
    vg.addColorStop(1, 'rgba(10,60,70,0.22)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    var S = Math.min(W, H);
    var sc = S / 720; // orb radii are authored at 720 scale
    var cx = W / 2, cy = H * 0.56;
    // rays rotate 2 degrees per 10s, emanating from behind the glass
    var rot = t * (2 * Math.PI / 180) / 10;
    ctx.save();
    ctx.strokeStyle = '#3AA6A0';
    ctx.lineCap = 'round';
    for (var i = 0; i < rays.length; i++) {
      var ry = rays[i];
      var a = ry.a + rot;
      var r0 = S * 0.10, r1 = S * ry.len;
      ctx.lineWidth = Math.max(1, S * ry.w);
      ctx.setLineDash([S * 0.018 * ry.dash, S * 0.018 * ry.gap]);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.restore();
    ctx.setLineDash([]);

    // stir decays back to the orbits (spring-back); zero on the first frame
    stirX *= 0.94; stirY *= 0.94;

    for (var b = 0; b < 10; b++) drawOrb(orbs[b], t, S, sc);
    drawGlass(cx, cy, S);
    for (var f = 10; f < 20; f++) drawOrb(orbs[f], t, S, sc);
    drawEye(cx, H * 0.10, S, t);

    // paper-grain overlay, drawn directly each frame
    for (var g2 = 0; g2 < grain.length; g2++) {
      var p = grain[g2];
      ctx.fillStyle = p.lite ? 'rgba(255,255,255,' + p.a + ')' : 'rgba(8,50,58,' + p.a + ')';
      ctx.fillRect(p.x * W, p.y * H, p.s, p.s);
    }
  }

  // interaction: drag stirs the orb field; orbs spring back on release.
  // No click action of any kind; watch-only ambient mode with no pointer.
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    stirX += dx * 0.35; stirY += dy * 0.35;
    if (stirX > 120) stirX = 120; if (stirX < -120) stirX = -120;
    if (stirY > 120) stirY = 120; if (stirY < -120) stirY = -120;
  });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });

  var currentT = PHASE0;
  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      currentT = PHASE0 + (now - start) / 1000;
      draw(currentT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
