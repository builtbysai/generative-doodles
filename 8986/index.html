<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№8986 · Chord and Arc, Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0e0f13;
    color: #d8d4c8;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 3vmin 16px 4vmin;
  }
  header { text-align: center; max-width: 640px; margin-bottom: 2.5vmin; }
  header .kicker {
    font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #7d7a6e; margin-bottom: 10px;
  }
  header h1 { font-size: 24px; font-weight: normal; margin-bottom: 8px; }
  header h1 .num { color: #e0a458; }
  header p { color: #8b8778; font-size: 13.5px; line-height: 1.65; font-style: italic; }
  header p b { color: #cfc9b6; font-weight: normal; }
  #stage {
    width: min(96vw, 1120px);
    aspect-ratio: 2 / 1;
    background: #131419;
    box-shadow: 0 18px 60px rgba(0,0,0,0.6);
    cursor: pointer;
    position: relative;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #seedtag {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px;
    font-size: 11px; letter-spacing: 0.18em; color: rgba(216,212,200,0.42);
    font-style: italic; pointer-events: none; white-space: nowrap;
  }
  footer { margin-top: 2.5vmin; color: #5f5b50; font-size: 12.5px; font-style: italic; }
  footer a { color: #e0a458; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№8986</span> · Chord and Arc</h1>
  <p>One anchor pair, one sample count, two weathers. Left: the samples walk
  the straight chord. Right: the same samples ride curved arcs.
  <b>Click the piece for new weather.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas><div id="seedtag"></div></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// ---- seeded PRNG (mulberry32) ----
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 898620;

const TAU = Math.PI * 2;
const VW = 1280, VH = 640, HW = 640; // virtual canvas, one half per 640px

const DRY = [ // left palette: sunbleached ambers
  [122, 74, 30], [196, 128, 52], [232, 172, 92], [250, 214, 150], [255, 240, 208]
];
const WET = [ // right palette: monsoon blues
  [34, 74, 104], [52, 116, 158], [96, 178, 214], [150, 220, 244], [222, 246, 255]
];
const ANCHOR = "#e4572e";

function gauss(rnd){
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

// ---- model: one anchor pair, one sample count, one t-distribution ----
function buildModel(s){
  const rnd = mulberry32(s);
  const m = 120;
  const A = { x: m + rnd() * 80,  y: VH * 0.5 + (rnd() - 0.5) * 300 };
  const B = { x: HW - m - rnd() * 80, y: VH * 0.5 + (rnd() - 0.5) * 300 };
  const N = 400 + Math.floor(rnd() * 160);
  // sample parameter t in [0,1]: mixture of clusters plus a uniform base
  const K = 3 + Math.floor(rnd() * 3);
  const clusters = [];
  for (let k = 0; k < K; k++){
    clusters.push({ mu: 0.08 + rnd() * 0.84, sig: 0.03 + rnd() * 0.09,
                    w: 0.5 + rnd() });
  }
  const wSum = clusters.reduce((a, c) => a + c.w, 0);
  const tVals = [];
  for (let i = 0; i < N; i++){
    let t;
    if (rnd() < 0.22){ t = rnd(); }
    else {
      let pick = rnd() * wSum, c = clusters[0];
      for (const cc of clusters){ pick -= cc.w; if (pick <= 0){ c = cc; break; } }
      t = c.mu + gauss(rnd) * c.sig;
    }
    tVals.push(clamp(t, 0, 1));
  }
  // arc family for the right half: a one-sided fan of arcs off the chord,
  // shallow to deep, leaning toward whichever side has room, bulge scaled
  // to the chord length and the available space so arcs never clip
  const J = 5 + Math.floor(rnd() * 4);
  const L0 = Math.hypot(B.x - A.x, B.y - A.y);
  const dx0 = (B.x - A.x) / L0, dy0 = (B.y - A.y) / L0;
  const nnx = -dy0, nny = dx0;
  const MX = (A.x + B.x) / 2, MY = (A.y + B.y) / 2;
  function roomAlong(sx, sy){
    let best = Infinity;
    const bx0 = 48, bx1 = HW - 48, by0 = 48, by1 = VH - 48;
    if (sx > 1e-6) best = Math.min(best, (bx1 - MX) / sx);
    else if (sx < -1e-6) best = Math.min(best, (bx0 - MX) / sx);
    if (sy > 1e-6) best = Math.min(best, (by1 - MY) / sy);
    else if (sy < -1e-6) best = Math.min(best, (by0 - MY) / sy);
    return best;
  }
  const flip = roomAlong(nnx, nny) >= roomAlong(-nnx, -nny) ? 1 : -1;
  const room = roomAlong(flip * nnx, flip * nny);
  const Bmax = Math.min(L0 * (0.30 + rnd() * 0.45), room * 0.72);
  const arcs = [];
  for (let j = 0; j < J; j++){
    const f = J === 1 ? 1 : j / (J - 1);
    arcs.push(flip * Bmax * (0.30 + 0.70 * f) * (0.85 + rnd() * 0.30));
  }
  return { A, B, N, tVals, arcs, flip };
}

// quadratic bezier point + tangent for arc with sagitta b at t=0.5
function bez(A, C, B, t){
  const u = 1 - t;
  return {
    x: u*u*A.x + 2*u*t*C.x + t*t*B.x,
    y: u*u*A.y + 2*u*t*C.y + t*t*B.y
  };
}
function bezTan(A, C, B, t){
  const u = 1 - t;
  return { x: 2*u*(C.x - A.x) + 2*t*(B.x - C.x),
           y: 2*u*(C.y - A.y) + 2*t*(B.y - C.y) };
}

function layoutHalf(model, rnd, arcSide){
  // arcSide false: straight chord; true: arcs
  const { A, B, tVals, arcs } = model;
  const dx = B.x - A.x, dy = B.y - A.y;
  const L = Math.hypot(dx, dy);
  const nx = -dy / L, ny = dx / L; // chord normal
  const pts = [];
  if (!arcSide){
    for (const t of tVals){
      const off = gauss(rnd) * 15;
      pts.push({ x: A.x + dx * t + nx * off, y: A.y + dy * t + ny * off });
    }
  } else {
    // choose an arc per sample, weighted by arc length so density per unit
    // of curve stays roughly constant (deep arcs are longer curves)
    const J = arcs.length;
    const w = arcs.map(b => 1 + 3 * (b / L) * (b / L));
    const wSum = w.reduce((a, b) => a + b, 0);
    for (const t of tVals){
      let pick = rnd() * wSum, j = 0;
      for (; j < J; j++){ pick -= w[j]; if (pick <= 0) break; }
      j = Math.min(j, J - 1);
      const b = arcs[j];
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      const C = { x: mx + nx * 2 * b, y: my + ny * 2 * b }; // sagitta b at t=.5
      const p = bez(A, C, B, t);
      const tn = bezTan(A, C, B, t);
      const tl = Math.hypot(tn.x, tn.y) || 1;
      const off = gauss(rnd) * 12;
      pts.push({ x: p.x + (-tn.y / tl) * off, y: p.y + (tn.x / tl) * off });
    }
  }
  return pts;
}

// local density via neighbor counts, normalized with sqrt compression
function densities(pts){
  const R = 46, R2 = R * R;
  const n = pts.length;
  const counts = new Float32Array(n);
  let max = 1;
  for (let i = 0; i < n; i++){
    let c = 0;
    const pi = pts[i];
    for (let j = 0; j < n; j++){
      if (i === j) continue;
      const dx = pts[j].x - pi.x, dy = pts[j].y - pi.y;
      if (dx * dx + dy * dy < R2) c++;
    }
    counts[i] = c;
    if (c > max) max = c;
  }
  const d = new Float32Array(n);
  for (let i = 0; i < n; i++) d[i] = Math.sqrt(counts[i] / max);
  return d;
}

function pickStop(pal, d, rnd){
  const f = clamp(d * (pal.length - 1) + (rnd() - 0.5) * 1.2, 0, pal.length - 1);
  const i0 = Math.floor(f), i1 = Math.min(i0 + 1, pal.length - 1), fr = f - i0;
  const a = pal[i0], b = pal[i1];
  return [a[0] + (b[0]-a[0]) * fr, a[1] + (b[1]-a[1]) * fr, a[2] + (b[2]-a[2]) * fr]
    .map(v => Math.round(v)).join(",");
}

function disc(ctx, x, y, r, col, alpha){
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, "rgba(" + col + "," + alpha.toFixed(3) + ")");
  g.addColorStop(0.55, "rgba(" + col + "," + (alpha * 0.5).toFixed(3) + ")");
  g.addColorStop(1, "rgba(" + col + ",0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}

function drawAnchor(ctx, x, y){
  ctx.strokeStyle = ANCHOR; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.stroke();
  ctx.fillStyle = ANCHOR;
  ctx.beginPath(); ctx.arc(x, y, 3.2, 0, TAU); ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - 17, y); ctx.lineTo(x - 11, y);
  ctx.moveTo(x + 11, y); ctx.lineTo(x + 17, y);
  ctx.moveTo(x, y - 17); ctx.lineTo(x, y - 11);
  ctx.moveTo(x, y + 11); ctx.lineTo(x, y + 17);
  ctx.stroke();
}

function render(s){
  const canvas = document.getElementById("c");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = VW * dpr; canvas.height = VH * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const model = buildModel(s);
  const { A, B, arcs } = model;
  const dx = B.x - A.x, dy = B.y - A.y;
  const L = Math.hypot(dx, dy);
  const nx = -dy / L, ny = dx / L;

  ctx.fillStyle = "#131419";
  ctx.fillRect(0, 0, VW, VH);

  const halves = [
    { ox: 0,   arcSide: false, pal: DRY, label: "CHORD", hair: "232,172,92" },
    { ox: HW,  arcSide: true,  pal: WET, label: "ARC",   hair: "96,178,214" }
  ];

  for (const half of halves){
    const rnd = mulberry32(s * 7919 + (half.arcSide ? 104729 : 1299709));
    ctx.save();
    ctx.translate(half.ox, 0);

    // construction hairlines: chord, or the arc family
    ctx.lineWidth = 1.2;
    if (!half.arcSide){
      ctx.strokeStyle = "rgba(" + half.hair + ",0.20)";
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    } else {
      // ghost of the chord, so the bend reads against the straight path
      ctx.strokeStyle = "rgba(" + half.hair + ",0.10)";
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
      arcs.forEach((b, j) => {
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
        const C = { x: mx + nx * 2 * b, y: my + ny * 2 * b };
        ctx.strokeStyle = "rgba(" + half.hair + "," +
          (0.06 + 0.08 * (j / Math.max(arcs.length - 1, 1))).toFixed(3) + ")";
        ctx.beginPath();
        for (let i = 0; i <= 60; i++){
          const p = bez(A, C, B, i / 60);
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
      });
    }

    // samples, sized and lit by local density
    const pts = layoutHalf(model, rnd, half.arcSide);
    const dens = densities(pts);
    const order = pts.map((_, i) => i).sort((a, b) => dens[a] - dens[b]);
    for (const i of order){
      const p = pts[i], d = dens[i];
      const r = 5 + 24 * d * (0.85 + rnd() * 0.3);
      const col = pickStop(half.pal, d, rnd);
      const alpha = 0.30 + 0.62 * d;
      disc(ctx, p.x, p.y, r, col, alpha);
    }

    // anchors, identical in both halves: the kinship mark
    drawAnchor(ctx, A.x, A.y);
    drawAnchor(ctx, B.x, B.y);

    // half label, hand letterspaced
    ctx.fillStyle = "rgba(216,212,200,0.38)";
    ctx.font = "600 13px Georgia, serif";
    ctx.textAlign = "left";
    const chars = half.label.split("");
    const widths = chars.map(ch => ctx.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0) + 5 * (chars.length - 1);
    let cx = half.arcSide ? HW - 24 - total : 24;
    chars.forEach((ch, i) => { ctx.fillText(ch, cx, VH - 22); cx += widths[i] + 5; });

    ctx.restore();
  }

  // center divider
  ctx.fillStyle = "rgba(216,212,200,0.16)";
  ctx.fillRect(HW - 0.75, 28, 1.5, VH - 56);

  document.getElementById("seedtag").textContent = "seed " + s;
}

render(seed);

document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  render(seed);
});
</script>
</body>
</html>
