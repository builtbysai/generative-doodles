<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№39 · Pendulum Web</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#141a2e; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,240,246,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to set the release</div>
<script>
'use strict';
// No39 Pendulum Web.
// A double pendulum, integrated with a fixed timestep so every run
// of the piece is reproducible. Its tip leaves a single fading
// trace: a woven web that builds for about one cycle, fades, and
// redraws. The arm and bobs stay visible in warm white, the pivot
// is gold, the trace pale cyan on deep indigo. Drag left or right
// to set the release angle of the first arm; on release the piece
// lets go from that angle and keeps looping.

// Double pendulum state: th1, w1, th2, w2. m1 = m2 = 1, L1 = L2 = 1, g = 9.81.
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '39', 10) || 39;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#141a2e';
const TRACE = '#a8d8e8';
const WARM = '#f2ede3';
const GOLD = '#c9a227';

const DT = 1 / 240;
const CYCLE_STEPS = 240 * 16;      // ~16s of sim per cycle
let releaseAngle = 2.35;           // radians, first arm
let state = null;
let trail = [];                    // tip positions in sim units
let stepsDone = 0;

function resetSim(angle) {
  state = { th1: angle, w1: 0, th2: angle * 0.82 + 0.35, w2: 0 };
  trail = [];
  stepsDone = 0;
}
function stepSim() {
  const { th1, w1, th2, w2 } = state;
  const m1 = 1, m2 = 1, L1 = 1, L2 = 1, g = 9.81;
  const d = th1 - th2;
  const den = 2 * m1 + m2 - m2 * Math.cos(2 * d);
  const a1 = (-g * (2 * m1 + m2) * Math.sin(th1) - m2 * g * Math.sin(th1 - 2 * th2)
    - 2 * Math.sin(d) * m2 * (w2 * w2 * L2 + w1 * w1 * L1 * Math.cos(d))) / (L1 * den);
  const a2 = (2 * Math.sin(d) * (w1 * w1 * L1 * (m1 + m2) + g * (m1 + m2) * Math.cos(th1)
    + w2 * w2 * L2 * m2 * Math.cos(d))) / (L2 * den);
  state.w1 += a1 * DT;
  state.w2 += a2 * DT;
  state.th1 += state.w1 * DT;
  state.th2 += state.w2 * DT;
  const x = Math.sin(state.th1) * L1 + Math.sin(state.th2) * L2;
  const y = Math.cos(state.th1) * L1 + Math.cos(state.th2) * L2;
  trail.push([x, y]);
  if (trail.length > CYCLE_STEPS) trail.shift();
  stepsDone++;
}
resetSim(releaseAngle);
// pre-roll so the first painted frame already holds a web (deterministic)
for (let i = 0; i < 240 * 7; i++) stepSim();

let lastNow = null;
let dragging = false;
let dragAngle = null;

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  // advance the sim by real elapsed time, fixed steps only
  if (lastNow == null) lastNow = nowMs;
  let elapsed = Math.min(0.06, (nowMs - lastNow) / 1000);
  lastNow = nowMs;
  if (!dragging && elapsed > 0) {
    let n = Math.round(elapsed / DT);
    while (n-- > 0) stepSim();
    if (stepsDone > CYCLE_STEPS * 1.6) resetSim(releaseAngle), prerollShort();
  }

  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2 - S * 0.04;
  const scale = S * 0.21;

  // cycle fade: the whole web fades in its last stretch before reset
  const fade = stepsDone > CYCLE_STEPS * 1.35
    ? Math.max(0.05, 1 - (stepsDone - CYCLE_STEPS * 1.35) / (CYCLE_STEPS * 0.25))
    : 1;

  // trace: single polyline, older segments fainter
  const N = trail.length;
  if (N > 2) {
    ctx.lineWidth = Math.max(0.8, S * 0.0016);
    const chunk = 60;
    for (let s = 0; s < N - 1; s += chunk) {
      const age = s / N;
      ctx.strokeStyle = 'rgba(168,216,232,' + (0.05 + 0.5 * age * fade).toFixed(3) + ')';
      ctx.beginPath();
      for (let i = s; i <= Math.min(N - 1, s + chunk); i++) {
        const X = cx + trail[i][0] * scale, Y = cy + trail[i][1] * scale;
        if (i === s) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
      ctx.stroke();
    }
  }

  // arm and bobs (or the dragged release pose)
  let th1 = state.th1, th2 = state.th2;
  if (dragging && dragAngle != null) { th1 = dragAngle; th2 = dragAngle * 0.82 + 0.35; }
  const jx = cx + Math.sin(th1) * scale, jy = cy + Math.cos(th1) * scale;
  const tx = jx + Math.sin(th2) * scale, ty = jy + Math.cos(th2) * scale;
  ctx.strokeStyle = WARM;
  ctx.lineWidth = Math.max(1.1, S * 0.003);
  ctx.beginPath();
  ctx.moveTo(cx, cy); ctx.lineTo(jx, jy); ctx.lineTo(tx, ty);
  ctx.stroke();
  ctx.fillStyle = GOLD;
  ctx.beginPath(); ctx.arc(cx, cy, Math.max(2, S * 0.008), 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = WARM;
  ctx.beginPath(); ctx.arc(jx, jy, Math.max(2.4, S * 0.01), 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(tx, ty, Math.max(2.4, S * 0.01), 0, Math.PI * 2); ctx.fill();

  return { cx, cy };
}
function prerollShort() { for (let i = 0; i < 240 * 2; i++) stepSim(); }

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

canvas.addEventListener('pointerdown', ev => {
  dragging = true;
  dragAngle = releaseAngle;
});
canvas.addEventListener('pointermove', ev => {
  if (!dragging) return;
  const [w, h] = viewportWH();
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  const x = ev.clientX - r.left, y = ev.clientY - r.top;
  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2 - S * 0.04;
  dragAngle = Math.atan2(x - cx, y - cy);   // angle from straight-down, like th
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  if (dragAngle != null) {
    releaseAngle = dragAngle;
    resetSim(releaseAngle);
    prerollShort();
    lastNow = null;
  }
  dragAngle = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
