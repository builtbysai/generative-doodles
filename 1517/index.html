<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Disappearing Patrol</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #d8cdb4; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var LOOP = 120;
var SEED = 1517000;
var NIGHT_START = 40;
var NIGHT_END = 42;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rnd = mulberry32(SEED);

function r4(a) {
  return Math.round(a * 10000) / 10000;
}

// Nine figure-marks, seeded positions, sorted left to right.
// Disappearance runs left to right (rank 0 first); reappearance runs
// right to left, so the first mark back fades in at the far (right) edge.
var marks = [];
for (var i = 0; i < 9; i++) {
  var fx = 0.07 + 0.86 * (i / 8) + (rnd() - 0.5) * 0.04;
  var fy = 0.40 + rnd() * 0.42;
  marks.push({ id: i, fx: fx, fy: fy, phase: rnd() * Math.PI * 2, rFac: 0.8 + rnd() * 0.5 });
}
marks.sort(function (a, b) { return a.fx - b.fx; });
for (var k = 0; k < marks.length; k++) {
  marks[k].rank = k;
  marks[k].d = 6 * (k + 1);          // disappearance fade starts, loop-local
  marks[k].f = 60 + 6 * (8 - k);     // fade-in starts, loop-local
}
var striations = [];
for (var s = 0; s < 6; s++) {
  striations.push(0.38 + rnd() * 0.55);
}

function size() {
  var w, h;
  var vv = null;
  try { vv = window.visualViewport; } catch (e) { vv = null; }
  if (vv && vv.width && vv.height) { w = vv.width; h = vv.height; }
  else if (typeof window !== 'undefined' && window.innerWidth && window.innerHeight) { w = window.innerWidth; h = window.innerHeight; }
  else { w = 720; h = 720; }
  return { w: w, h: h };
}

function isPhone(w, h) {
  var minDim = null;
  try {
    if (window.screen && window.screen.width && window.screen.height) {
      minDim = Math.min(window.screen.width, window.screen.height);
    }
  } catch (e) { minDim = null; }
  if (minDim !== null) return minDim < 700;
  return h > w * 1.15;
}

function loopLocalOf(t) { return ((t % LOOP) + LOOP) % LOOP; }
function loopStartOf(t) { return Math.floor(t / LOOP) * LOOP; }

// Drag sessions: { mark: id, start: piece-time seconds, end: seconds or null }.
// Drags never carry across a loop boundary: sessions from an earlier loop
// are ignored when computing the current loop's disappearance times.
var sessions = [];
var activeSession = null;

function markState(mark, t) {
  var ll = loopLocalOf(t);
  var ls = loopStartOf(t);
  var fade = mark.d;
  var held = false;
  for (var i = 0; i < sessions.length; i++) {
    var s = sessions[i];
    if (s.mark !== mark.id) continue;
    var sLocal = s.start - ls;
    if (sLocal < 0) continue;
    if (sLocal >= fade + 2) break;
    if (s.end === null) { held = true; break; }
    var eLocal = s.end - ls;
    if (eLocal <= fade) fade += (eLocal - sLocal);
    else fade = eLocal;
  }
  var a;
  if (held) a = 1;
  else if (ll < fade) a = 1;
  else if (ll < fade + 2) a = 1 - (ll - fade) / 2;
  else if (ll < mark.f) a = 0;
  else if (ll < mark.f + 2) a = (ll - mark.f) / 2;
  else a = 1;
  return { alpha: a, held: held, fade: fade };
}

function markXY(mark, t, W, H) {
  var ll = loopLocalOf(t);
  var bob = 1.5 * Math.sin(2 * Math.PI * ll / 12 + mark.phase);
  return { x: mark.fx * W, y: mark.fy * H + bob };
}

var currentT = 0;

function draw(t) {
  currentT = t;
  var s = size();
  var W = s.w, H = s.h;
  var phone = isPhone(W, H);
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var ll = loopLocalOf(t);
  var night = ll >= NIGHT_START && ll < NIGHT_END;
  var horizon = Math.round(H * 0.30);

  if (night) {
    ctx.fillStyle = '#5a7a4a';
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = '#d8cdb4';
    ctx.fillRect(0, 0, W, horizon);
    ctx.fillStyle = '#b8a06a';
    ctx.fillRect(0, horizon, W, H - horizon);
    ctx.fillStyle = 'rgba(106,90,68,0.5)';
    ctx.fillRect(0, horizon, W, 1);
    ctx.fillStyle = 'rgba(106,90,68,0.12)';
    for (var i = 0; i < striations.length; i++) {
      ctx.fillRect(0, Math.round(striations[i] * H), W, 1);
    }
  }

  var minDim = Math.min(W, H);
  var baseR = Math.max(4, 0.0085 * minDim);
  for (var m = 0; m < marks.length; m++) {
    var mark = marks[m];
    var st = markState(mark, t);
    if (st.alpha <= 0) continue;
    var a = r4(st.alpha);
    var pos = markXY(mark, t, W, H);
    var r = baseR * mark.rFac;
    // Short shadow: a flat bar offset down-right from the dot.
    if (night) {
      ctx.fillStyle = 'rgba(34,32,28,' + r4(a * 0.35) + ')';
    } else {
      ctx.fillStyle = 'rgba(106,90,68,' + r4(a * 0.5) + ')';
    }
    ctx.fillRect(pos.x + 2, pos.y + r + 1, r * 1.6, 2);
    // The mark itself: one own-beginPath arc per dot.
    ctx.beginPath();
    ctx.moveTo(pos.x + r, pos.y);
    ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
    if (night) {
      if (a >= 1) ctx.fillStyle = '#d8cdb4';
      else ctx.fillStyle = 'rgba(216,205,180,' + a + ')';
    } else {
      if (a >= 1) ctx.fillStyle = '#22201c';
      else ctx.fillStyle = 'rgba(34,32,28,' + a + ')';
    }
    ctx.fill();
  }
  void phone;
}

function pointerPos(e) {
  if (typeof e.clientX === 'number' && typeof e.clientY === 'number') {
    return { x: e.clientX, y: e.clientY };
  }
  return { x: e.offsetX || 0, y: e.offsetY || 0 };
}

function onDown(e) {
  var p = pointerPos(e);
  var W = canvas.width, H = canvas.height;
  var grabR = Math.max(18, 0.036 * Math.min(W, H));
  var best = null, bestD = 1e9;
  for (var m = 0; m < marks.length; m++) {
    var mark = marks[m];
    var st = markState(mark, currentT);
    if (st.alpha <= 0.02) continue;
    var pos = markXY(mark, currentT, W, H);
    var dx = p.x - pos.x, dy = p.y - pos.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < bestD) { bestD = d; best = mark; }
  }
  // A drag is a hold, not a move: the mark stays where it is, and its
  // disappearance waits while the drag is active.
  if (best && bestD <= grabR) {
    var sess = { mark: best.id, start: currentT, end: null };
    sessions.push(sess);
    activeSession = sess;
  }
}

function onUp(e) {
  if (activeSession) {
    activeSession.end = currentT;
    activeSession = null;
  }
}

function onMove(e) {
  // Hold only; the mark does not follow the pointer.
}

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('pointermove', onMove);

function onResize() { draw(currentT); }
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('resize', onResize);
  try {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
  } catch (e) {}
}

// Probe-only hook (invisible, no visual effect): lets the QA probe read
// mark layout and per-mark state without reimplementing the schedule.
if (typeof window !== 'undefined') {
  window.__t17 = {
    LOOP: LOOP,
    marks: marks,
    stateAt: function (t, id) {
      for (var i = 0; i < marks.length; i++) {
        if (marks[i].id === id) return markState(marks[i], t);
      }
      return null;
    },
    nightAt: function (t) {
      var ll = loopLocalOf(t);
      return ll >= NIGHT_START && ll < NIGHT_END;
    }
  };
}

var startTime = null;
function loop(ts) {
  if (startTime === null) startTime = ts;
  var t = (ts - startTime) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
draw(0);
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
