<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Door, Three States</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FFC81A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (strict, nothing else): yellow ground, dark teal masses, blue
  // closed doors, flat orange glow inside open doors, white smoke, the black
  // cat, its yellow eyes, the green bush. Flat fills only, no gradients.
  var GROUND = '#FFC81A', MASS = '#0E3B36', DOORBLUE = '#1B6FD6',
      GLOW = '#FF5A1F', SMOKE = '#FFFFFF', INK = '#111111',
      EYE = '#FFD400', BUSH = '#1E8A6B';

  var PHASE0 = 3.7;     // constant first-frame phase (seconds into the loops)
  var SMOKE_LOOP = 6;   // seconds for one full smoke rise
  var WIPE_T = 0.35;    // seconds for a door state-change wipe

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(547066);

  // ---- masses: dark domes, walls and hills (1080 design space) ----
  // Drawn back to front; each is filled and given a heavy black top outline
  // in her manner so overlapping masses stay distinct inside the one colour.
  function massPath(kind, a, b, c, d) {
    ctx.beginPath();
    if (kind === 'dome') {           // a = cx, b = baseY, c = r
      ctx.moveTo(a - c, 1080);
      ctx.lineTo(a - c, b);
      ctx.arc(a, b, c, Math.PI, 0);
      ctx.lineTo(a + c, 1080);
    } else if (kind === 'wall') {    // a = x0, b = x1, c = topY, d = arch lift
      ctx.moveTo(a, 1080);
      ctx.lineTo(a, c + d);
      ctx.quadraticCurveTo((a + b) / 2, c - d, b, c + d);
      ctx.lineTo(b, 1080);
    } else {                         // hill: a = x0, b = ctrlX, c = ctrlY, d = endX/endY packed
      ctx.moveTo(a, 1080);
      ctx.quadraticCurveTo(b, c, d[0], d[1]);
      ctx.lineTo(d[0], 1080);
    }
    ctx.closePath();
  }
  var MASSES = [
    { kind: 'dome', v: [206, 806, 236] },
    { kind: 'wall', v: [396, 644, 636, 70] },
    { kind: 'dome', v: [720, 836, 172] },
    { kind: 'hill', v: [612, 866, 612, [1110, 892]] },
    { kind: 'dome', v: [330, 1080, 162] },
    { kind: 'wall', v: [776, 960, 884, 62] }
  ];

  // ---- doors: one per mass, a state machine each ----
  // state 0 = CLOSED (flat blue), 1 = OPEN (ajar, orange inside),
  // 2 = SMOKING (open + white plume). Doors never move or resize.
  var DOORS = [
    { cx: 206, bottom: 1006, w: 48, h: 78 },
    { cx: 520, bottom: 1016, w: 46, h: 74 },
    { cx: 720, bottom: 1002, w: 46, h: 72 },
    { cx: 1022, bottom: 1028, w: 44, h: 68 },
    { cx: 330, bottom: 1074, w: 44, h: 66 },
    { cx: 868, bottom: 1070, w: 44, h: 66 }
  ];
  // Seeded initial states: a shuffled [closed, open, smoking] x2, so frame
  // one always shows a mix of all three states.
  var stateBag = [0, 1, 2, 0, 1, 2];
  for (var i = stateBag.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = stateBag[i]; stateBag[i] = stateBag[j]; stateBag[j] = tmp;
  }
  for (i = 0; i < DOORS.length; i++) {
    var d = DOORS[i];
    d.state = stateBag[i];
    d.prev = stateBag[i];
    d.animStart = -10;
    d.smokePhase = rng();                       // plume offset per door
    d.jitter = [];
    for (var k = 0; k < 7; k++) d.jitter.push(0.82 + rng() * 0.36);
  }

  function doorPath(d) {
    var x0 = d.cx - d.w / 2, x1 = d.cx + d.w / 2, yb = d.bottom, yt = yb - d.h;
    ctx.beginPath();
    ctx.moveTo(x0, yb);
    ctx.lineTo(x0, yt + d.w / 2);
    ctx.arc(d.cx, yt + d.w / 2, d.w / 2, Math.PI, 0);
    ctx.lineTo(x1, yb);
    ctx.closePath();
  }

  function drawDoorState(d, state) {
    var x0 = d.cx - d.w / 2, yb = d.bottom, yt = yb - d.h;
    if (state === 0) {
      doorPath(d);
      ctx.fillStyle = DOORBLUE; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
      // knob
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(d.cx + d.w * 0.28, yb - d.h * 0.45, 3.4, 0, Math.PI * 2); ctx.fill();
    } else {
      // open doorway: flat glow inside, blue panel ajar on its left hinge
      doorPath(d);
      ctx.fillStyle = GLOW; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
      ctx.fillStyle = DOORBLUE;
      ctx.beginPath();
      ctx.moveTo(x0, yb);
      ctx.lineTo(x0, yt + 5);
      ctx.lineTo(x0 + d.w * 0.52, yt + 13);
      ctx.lineTo(x0 + d.w * 0.52, yb);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(x0 + d.w * 0.42, yb - d.h * 0.45, 3.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawDoor(d, t) {
    var p = Math.min(1, Math.max(0, (t - d.animStart) / WIPE_T));
    if (p >= 1 || d.prev === d.state) {
      drawDoorState(d, d.state);
      return p >= 1 ? 1 : p;
    }
    // flat wipe: old state holds the left of the doorway, new state sweeps in
    var x0 = d.cx - d.w / 2, yt = d.bottom - d.h - 4;
    var split = x0 + d.w * p;
    ctx.save();
    ctx.beginPath(); ctx.rect(x0 - 4, yt, d.w * p + 4, d.h + 8); ctx.clip();
    drawDoorState(d, d.state);
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.rect(split, yt, d.w * (1 - p) + 4, d.h + 8); ctx.clip();
    drawDoorState(d, d.prev);
    ctx.restore();
    return p;
  }

  // ---- smoke: stacked flat white ellipses rising with wrap-around ----
  function drawPlume(d, t, amount) {
    if (amount <= 0) return;
    var topY = d.bottom - d.h;
    var N = 7, plumeH = 195;
    ctx.fillStyle = SMOKE;
    for (var k = 0; k < N; k++) {
      var ph = (t / SMOKE_LOOP + d.smokePhase + k / N) % 1;
      var r = (9 + ph * 27) * d.jitter[k] * (0.35 + 0.65 * amount);
      var x = d.cx + Math.sin(ph * 5 + d.smokePhase * 9) * 7 + wind * ph * 115;
      var y = topY - 6 - ph * plumeH;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.18, r * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- the sleeping cat on the first dome ----
  function drawCat(t) {
    // 2-frame breathing bob: the body scale toggles on a slow step
    var bob = (Math.floor(t / 1.6) % 2 === 0) ? 1 : 1.03;
    ctx.save();
    ctx.translate(206, 576);
    ctx.scale(1.3, 1.3);
    ctx.fillStyle = INK;
    ctx.save();
    ctx.scale(1, bob);
    ctx.beginPath(); ctx.ellipse(0, -13, 48, 21, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // tail curled around the front
    ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(26, -8, 17, 0.4, 2.4); ctx.stroke();
    // head resting on the dome
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(-46, -20, 17, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-58, -32); ctx.lineTo(-54, -46); ctx.lineTo(-46, -34); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-42, -35); ctx.lineTo(-34, -47); ctx.lineTo(-31, -32); ctx.closePath(); ctx.fill();
    // closed eye: one thin yellow arc
    ctx.strokeStyle = EYE; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(-50, -20, 6, 0.25, Math.PI - 0.25); ctx.stroke();
    ctx.restore();
  }

  // ---- the bush growing over the wall ----
  var BUSH_DOTS = [
    [520, 646, 31], [487, 659, 22], [553, 659, 22], [503, 634, 20], [537, 634, 20]
  ];
  function drawBush(t) {
    ctx.save();
    ctx.translate(520, 680);
    ctx.rotate(wind * 0.15 + Math.sin(t * 0.9) * 0.02);
    ctx.translate(-520, -680);
    ctx.fillStyle = BUSH;
    for (var i = 0; i < BUSH_DOTS.length; i++) {
      ctx.beginPath();
      ctx.arc(BUSH_DOTS[i][0], BUSH_DOTS[i][1], BUSH_DOTS[i][2], 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---- scene ----
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    for (var i = 0; i < MASSES.length; i++) {
      var m = MASSES[i];
      massPath(m.kind, m.v[0], m.v[1], m.v[2], m.v[3]);
      ctx.fillStyle = MASS; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
    }

    drawBush(t);
    drawCat(t);

    var wipeP = [];
    for (i = 0; i < DOORS.length; i++) wipeP[i] = drawDoor(DOORS[i], t);
    // plumes last so smoke pours over whatever stands behind the door
    for (i = 0; i < DOORS.length; i++) {
      var d = DOORS[i];
      var amt = 0;
      if (d.state === 2) amt = (d.prev === 2 || wipeP[i] >= 1) ? 1 : wipeP[i];
      else if (d.prev === 2 && wipeP[i] < 1) amt = 1 - wipeP[i];
      drawPlume(d, t, amt);
    }

    // hint
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = GROUND;
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('tap', 1052, 1050);
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  // ---- interaction: tap cycles a door; horizontal drag is wind ----
  var wind = 0, windTarget = 0;
  var pDown = null;

  function toDesign(e) {
    return [
      (e.clientX - OX) * 1080 / S,
      (e.clientY - OY) * 1080 / S
    ];
  }

  function cycleDoorAt(x, y) {
    for (var i = DOORS.length - 1; i >= 0; i--) {
      var d = DOORS[i];
      if (x >= d.cx - d.w / 2 - 16 && x <= d.cx + d.w / 2 + 16 &&
          y >= d.bottom - d.h - 16 && y <= d.bottom + 12) {
        d.prev = d.state;
        d.state = (d.state + 1) % 3;
        d.animStart = simT;
        return;
      }
    }
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      var p = toDesign(e);
      pDown = { x: p[0], y: p[1], sx: e.clientX, t: simT, moved: false };
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!pDown) return;
      var dx = e.clientX - pDown.sx;
      if (Math.abs(dx) > 8) pDown.moved = true;
      if (pDown.moved) {
        windTarget = Math.max(-1, Math.min(1, dx / (0.35 * S)));
      }
    });
    canvas.addEventListener('pointerup', function (e) {
      if (!pDown) return;
      if (!pDown.moved && simT - pDown.t < 0.6) {
        var p = toDesign(e);
        cycleDoorAt(p[0], p[1]);
      }
      pDown = null;
      windTarget = 0;
    });
    canvas.addEventListener('pointercancel', function () {
      pDown = null;
      windTarget = 0;
    });
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground is the yellow) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      // the landscape keeps its shape and spans the full phone width;
      // the yellow ground fills the rest, so the letterbox is invisible
      S = W;
      OX = 0; OY = (H - S) / 2;
    } else {
      S = Math.min(W, H);
      OX = (W - S) / 2; OY = (H - S) / 2;
    }
    draw(simT);
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null, lastStamp = null;
  function frame(ts) {
    if (startStamp === null) { startStamp = ts; lastStamp = ts; }
    simT = PHASE0 + (ts - startStamp) / 1000;
    var dt = Math.min(0.05, (ts - lastStamp) / 1000);
    lastStamp = ts;
    wind += (windTarget - wind) * Math.min(1, dt * 6);
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
