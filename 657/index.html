<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mancha Primero</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EDE4D0; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.657 "Mancha Primero" (EXPANSION #80 angela-leible, block 1).
  // Her doctrine in code: la mancha primero, el dibujo despues.
  // First the stain grows, unscripted. Then the drawing finds an animal
  // in it. The stain is always generated first and the animal is only
  // ever discovered inside it, never drawn first.

  // Palette (strict, nothing else).
  var PAPER = '#EDE4D0';
  var OCHRE = '#C98F3D';
  var SIENNA = '#8A4A2B';
  var IRON = '#2B2622';
  var GOLD = '#E3B95B';
  var CHARCOAL = '#1A1A1A';
  var STAIN_COLORS = [OCHRE, SIENNA, IRON];

  // Composition space: FW x FH abstract units, mapped onto the viewport
  // with generous paper margins. The stain lives center-left by default.
  var FW = 1.6, FH = 1.0;
  var HOME_X = 0.60, HOME_Y = 0.52;
  var RMAX = 0.30; // stain reach, in FH units

  // The 40 s cycle: stain grows 20 s, the finding traces 10 s, the found
  // animal holds 6 s, fade 4 s, then a new stain (new seed per cycle).
  var CYCLE = 40, GROW_T = 20, FIND_T = 10, HOLD_T = 6;
  // Frame one is drawn at a constant phase 0.8 s into the cycle, so the
  // first frame shows the stain at ~4% growth, exactly as specced. The
  // phase is a constant, never derived from Date.now().
  var PHASE0 = 0.8;

  var BASE_SEED = 657001;

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ------------------------------------------------------------------
  // STAIN GENERATION (per cycle, precomputed as data)
  // Dozens of diffusion walkers wander out from the seed point and
  // deposit flat blotches (wobbly polygons, no gradients). Blotches are
  // stored in deposit order with a birth fraction, so the growth phase
  // is a pure function of cycle time: draw every blotch with birth < g.
  // ------------------------------------------------------------------
  function genStain(seed, cx, cy) {
    var rng = mulberry32(seed);
    var WALKERS = 24;
    var walkers = [], i, j;
    for (i = 0; i < WALKERS; i++) {
      walkers.push({
        x: cx + (rng() - 0.5) * 0.06,
        y: cy + (rng() - 0.5) * 0.06,
        dir: rng() * Math.PI * 2,
        steps: 9 + Math.floor(rng() * 7),
        speed: 0.016 + rng() * 0.014
      });
    }
    var blotches = [];
    var maxSteps = 0;
    for (i = 0; i < WALKERS; i++) if (walkers[i].steps > maxSteps) maxSteps = walkers[i].steps;
    for (var s = 0; s < maxSteps; s++) {
      for (i = 0; i < WALKERS; i++) {
        var wk = walkers[i];
        if (s >= wk.steps) continue;
        wk.dir += (rng() - 0.5) * 1.1;
        var nx = wk.x + Math.cos(wk.dir) * wk.speed + (cx - wk.x) * 0.012;
        var ny = wk.y + Math.sin(wk.dir) * wk.speed + (cy - wk.y) * 0.012;
        var dx = nx - cx, dy = ny - cy;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > RMAX) { // steer home: the mass stays one body
          nx = cx + dx / dist * RMAX * 0.98;
          ny = cy + dy / dist * RMAX * 0.98;
          wk.dir = Math.atan2(cy - ny, cx - nx) + (rng() - 0.5) * 0.8;
          dist = RMAX * 0.98;
        }
        wk.x = nx; wk.y = ny;
        var q = clamp(dist / RMAX, 0, 1);
        var r = clamp(0.034 * (1.18 - q * 0.55) * (0.7 + rng() * 0.7), 0.010, 0.062);
        // Iron black gathers at the dense core, sienna mid, ochre wide.
        var pBlack = 0.36 - 0.24 * q, pSienna = 0.30;
        var roll = rng();
        var col = roll < pBlack ? 2 : (roll < pBlack + pSienna ? 1 : 0);
        // Wobbly blotch outline: 8 vertices, radial jitter, precomputed.
        var verts = [];
        var baseA = rng() * Math.PI * 2;
        for (j = 0; j < 8; j++) {
          var a = baseA + j / 8 * Math.PI * 2 + (rng() - 0.5) * 0.3;
          var rf = 0.72 + rng() * 0.5;
          verts.push([Math.cos(a) * rf, Math.sin(a) * rf]);
        }
        blotches.push({ x: wk.x, y: wk.y, r: r, col: col, verts: verts, birth: 0 });
      }
    }
    var N = blotches.length;
    for (i = 0; i < N; i++) {
      blotches[i].birth = clamp(i / (N - 1) + (rng() - 0.5) * 0.02, 0, 1);
    }
    // Gold dust: a few specks settle inside existing blotches.
    var specks = [];
    var nSpeck = 12 + Math.floor(rng() * 5);
    for (i = 0; i < nSpeck; i++) {
      var host = blotches[Math.floor(rng() * N)];
      specks.push({
        x: host.x + (rng() - 0.5) * host.r * 1.1,
        y: host.y + (rng() - 0.5) * host.r * 1.1,
        r: 0.0035 + rng() * 0.005,
        birth: clamp(host.birth + 0.01, 0, 1)
      });
    }

    // ---- Largest connected component (union-find over overlaps) ----
    var parent = new Int32Array(N);
    for (i = 0; i < N; i++) parent[i] = i;
    function find(a) { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; }
    for (i = 0; i < N; i++) {
      for (j = i + 1; j < N; j++) {
        var bx = blotches[i].x - blotches[j].x, by = blotches[i].y - blotches[j].y;
        var rr = (blotches[i].r + blotches[j].r) * 0.92;
        if (bx * bx + by * by < rr * rr) {
          var ra = find(i), rb = find(j);
          if (ra !== rb) parent[ra] = rb;
        }
      }
    }
    var compArea = {}, compList = {};
    for (i = 0; i < N; i++) {
      var root = find(i);
      compArea[root] = (compArea[root] || 0) + blotches[i].r * blotches[i].r;
      (compList[root] = compList[root] || []).push(i);
    }
    var bestRoot = -1, bestArea = -1;
    for (var key in compArea) if (compArea[key] > bestArea) { bestArea = compArea[key]; bestRoot = +key; }
    var comp = compList[bestRoot];

    // Area-weighted centroid of the main mass.
    var ccx = 0, ccy = 0, wsum = 0;
    for (i = 0; i < comp.length; i++) {
      var b = blotches[comp[i]], wgt = b.r * b.r;
      ccx += b.x * wgt; ccy += b.y * wgt; wsum += wgt;
    }
    ccx /= wsum; ccy /= wsum;

    // ---- Outline: radial boundary trace over the union of discs ----
    // For K rays from the centroid, take the outermost disc exit along
    // the ray; radius-smoothing then turns the star-convex trace into a
    // blobby organic edge. One closed polyline, ready to be re-drawn as
    // a single confident stroke.
    var K = 160, radii = new Float64Array(K);
    for (i = 0; i < K; i++) {
      var th = i / K * Math.PI * 2, ux = Math.cos(th), uy = Math.sin(th);
      var tMax = 0.02;
      for (j = 0; j < comp.length; j++) {
        var bb = blotches[comp[j]];
        var ex = bb.x - ccx, ey = bb.y - ccy;
        var proj = ex * ux + ey * uy;
        var perp2 = ex * ex + ey * ey - proj * proj;
        var disc = bb.r * bb.r - perp2;
        if (disc < 0) continue;
        var t = proj + Math.sqrt(disc);
        if (t > tMax) tMax = t;
      }
      radii[i] = tMax;
    }
    for (var pass = 0; pass < 2; pass++) {
      var sm = new Float64Array(K);
      for (i = 0; i < K; i++) {
        var acc = 0;
        for (j = -3; j <= 3; j++) acc += radii[(i + j + K) % K];
        sm[i] = acc / 7;
      }
      radii = sm;
    }
    var outline = [];
    for (i = 0; i < K; i++) {
      outline.push([ccx + Math.cos(i / K * Math.PI * 2) * radii[i],
                    ccy + Math.sin(i / K * Math.PI * 2) * radii[i]]);
    }
    outline.cum = cumLengths(outline, true);

    // ---- Features and the finding (template correlation) ----
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (i = 0; i < K; i++) {
      if (outline[i][0] < minX) minX = outline[i][0];
      if (outline[i][0] > maxX) maxX = outline[i][0];
      if (outline[i][1] < minY) minY = outline[i][1];
      if (outline[i][1] > maxY) maxY = outline[i][1];
    }
    var bw = maxX - minX, bh = maxY - minY;
    var aspect = bw / Math.max(bh, 0.001);
    var meanR = 0, sdR = 0;
    for (i = 0; i < K; i++) meanR += radii[i];
    meanR /= K;
    for (i = 0; i < K; i++) sdR += (radii[i] - meanR) * (radii[i] - meanR);
    sdR = Math.sqrt(sdR / K);
    var peaks = 0;
    for (i = 0; i < K; i++) {
      var prev = radii[(i - 1 + K) % K], cur = radii[i], next = radii[(i + 1) % K];
      if (cur > prev && cur >= next && cur > meanR + 0.5 * sdR) peaks++;
    }
    var belowArea = 0;
    for (i = 0; i < comp.length; i++) {
      var bb2 = blotches[comp[i]];
      if (bb2.y > ccy) belowArea += bb2.r * bb2.r;
    }
    var belowFrac = belowArea / bestArea;
    // Facing: the end (left/right) with the longer reach holds the head.
    var reachR = 0, reachL = 0;
    for (i = 0; i < K; i++) {
      var cth = Math.cos(i / K * Math.PI * 2);
      if (cth > 0.7 && radii[i] > reachR) reachR = radii[i];
      if (cth < -0.7 && radii[i] > reachL) reachL = radii[i];
    }
    var facing = reachR >= reachL ? 1 : -1;

    // Deterministic heuristic correlation of outline features to the
    // four procedural templates. Documented in process.md.
    var score = { snake: 0, condor: 0, horse: 0, eagle: 0 };
    score.snake = clamp((aspect - 1.35) * 2.2, -1, 2) + (0.5 - Math.abs(belowFrac - 0.5)) * 0.4;
    score.condor = (peaks >= 3 ? 0.9 : 0.3) + (aspect >= 1.1 && aspect <= 1.7 ? 0.5 : 0) + (belowFrac < 0.48 ? 0.3 : 0);
    score.horse = (belowFrac > 0.54 ? 0.8 : 0.2) + (aspect >= 1.05 && aspect <= 1.45 ? 0.5 : 0) + (peaks <= 3 ? 0.2 : 0);
    score.eagle = (aspect < 1.1 ? 0.9 : 0.15) + (peaks >= 2 ? 0.3 : 0);
    var template = 'horse', bestScore = -1e9;
    var order = ['horse', 'condor', 'eagle', 'snake'];
    for (i = 0; i < order.length; i++) {
      if (score[order[i]] > bestScore) { bestScore = score[order[i]]; template = order[i]; }
    }

    var fit = { bcx: (minX + maxX) / 2, bcy: (minY + maxY) / 2, bw: bw, bh: bh, facing: facing, ccx: ccx, ccy: ccy, radii: radii, K: K };
    var inner = buildInner(template, fit);

    return {
      blotches: blotches, specks: specks, outline: outline,
      centroid: [ccx, ccy], template: template,
      strokes: inner.strokes, eye: inner.eye
    };
  }

  function cumLengths(pts, closed) {
    var cum = [0], total = 0, i;
    var n = pts.length, m = closed ? n : n - 1;
    for (i = 0; i < m; i++) {
      var a = pts[i], b = pts[(i + 1) % n];
      total += Math.sqrt((b[0] - a[0]) * (b[0] - a[0]) + (b[1] - a[1]) * (b[1] - a[1]));
      cum.push(total);
    }
    return { cum: cum, total: total };
  }

  // ------------------------------------------------------------------
  // INNER FINDING STROKES. Each template is a small kit of polylines in
  // local coords (u: -1..1 toward the head, v: -1..1, negative = up),
  // fitted onto the stain's bbox and pulled inside the outline, so the
  // charcoal finds the animal inside THIS stain, whatever its shape.
  // ------------------------------------------------------------------
  var TEMPLATES = {
    horse: {
      eye: [0.70, -0.28],
      strokes: [
        [[-0.72, -0.18], [-0.30, -0.30], [0.15, -0.32], [0.45, -0.26]],   // back
        [[0.42, -0.26], [0.62, -0.42], [0.80, -0.34], [0.84, -0.16]],     // neck and head
        [[0.84, -0.16], [0.66, -0.06], [0.55, -0.12]],                    // jaw
        [[-0.55, 0.22], [-0.10, 0.32], [0.38, 0.24]],                    // belly
        [[0.34, 0.26], [0.38, 0.55], [0.40, 0.78]],                      // front leg
        [[-0.48, 0.24], [-0.52, 0.55], [-0.50, 0.78]]                    // back leg
      ]
    },
    condor: {
      eye: [0.03, -0.20],
      strokes: [
        [[-0.06, -0.02], [-0.45, -0.22], [-0.85, -0.30]],                 // left wing spine
        [[0.06, -0.02], [0.45, -0.22], [0.85, -0.30]],                    // right wing spine
        [[-0.42, -0.21], [-0.48, -0.02]], [[-0.65, -0.26], [-0.70, -0.04]], [[-0.85, -0.30], [-0.88, -0.10]], // left feathers
        [[0.42, -0.21], [0.48, -0.02]], [[0.65, -0.26], [0.70, -0.04]], [[0.85, -0.30], [0.88, -0.10]],       // right feathers
        [[0, -0.28], [0.0, 0.05], [0.02, 0.34]],                          // body
        [[-0.16, 0.44], [0, 0.34], [0.16, 0.44]]                          // tail fan
      ]
    },
    eagle: {
      eye: [0.05, -0.16],
      strokes: [
        [[-0.05, 0.0], [-0.45, 0.02], [-0.82, 0.16]],                     // left wing, swept
        [[0.05, 0.0], [0.45, 0.02], [0.82, 0.16]],                        // right wing, swept
        [[-0.45, 0.03], [-0.52, 0.22]], [[-0.68, 0.10], [-0.74, 0.28]],   // left feathers
        [[0.45, 0.03], [0.52, 0.22]], [[0.68, 0.10], [0.74, 0.28]],       // right feathers
        [[0.02, -0.22], [0.10, -0.12], [0.17, -0.17]],                    // hooked beak
        [[0, -0.05], [0.0, 0.16], [0.01, 0.30]],                          // body
        [[0, 0.30], [-0.14, 0.48]], [[0, 0.30], [0.14, 0.48]]             // tail
      ]
    },
    snake: {
      eye: [0.86, -0.02],
      strokes: [
        [[-0.90, 0.10], [-0.60, -0.12], [-0.30, 0.12], [0.0, -0.12], [0.30, 0.12], [0.55, -0.06], [0.75, -0.02]], // spine wave
        [[0.75, -0.02], [0.90, -0.08], [0.97, 0.02], [0.86, 0.10]],       // head wedge
        [[0.97, 0.02], [1.02, 0.0]],                                      // tongue tick
        [[-0.50, -0.10], [-0.48, 0.12]], [[0.0, -0.14], [0.02, 0.10]], [[0.45, -0.08], [0.47, 0.12]] // belly ticks
      ]
    }
  };

  function buildInner(template, fit) {
    var kit = TEMPLATES[template];
    function mapPt(p) {
      var x = fit.bcx + fit.facing * p[0] * fit.bw / 2 * 0.94;
      var y = fit.bcy + p[1] * fit.bh / 2 * 0.94;
      // Pull inside the outline: never let the finding leave the body.
      var dx = x - fit.ccx, dy = y - fit.ccy;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > 1e-6) {
        var th = Math.atan2(dy, dx);
        var idx = ((Math.round(th / (Math.PI * 2) * fit.K) % fit.K) + fit.K) % fit.K;
        var rOut = fit.radii[idx];
        if (d > rOut * 0.93) {
          var s = rOut * 0.88 / d;
          x = fit.ccx + dx * s; y = fit.ccy + dy * s;
        }
      }
      return [x, y];
    }
    var strokes = [];
    for (var i = 0; i < kit.strokes.length; i++) {
      var pts = [];
      for (var j = 0; j < kit.strokes[i].length; j++) pts.push(mapPt(kit.strokes[i][j]));
      var cl = cumLengths(pts, false);
      strokes.push({ pts: pts, cum: cl.cum, total: cl.total });
    }
    return { strokes: strokes, eye: mapPt(kit.eye) };
  }

  // ------------------------------------------------------------------
  // SEGMENTS. The piece runs as a list of segments; each segment starts
  // a fresh cycle clock at a recorded anchored time, with its own seed
  // base and stain center. Taps and double-taps append segments. All
  // state is a function of (seed, anchored time, recorded events).
  // ------------------------------------------------------------------
  var segments = [{ t0: 0, seedBase: BASE_SEED, cx: HOME_X, cy: HOME_Y, id: 0 }];
  var tapSerial = 0;
  var cacheKey = '', cacheData = null;

  function cycleData(seg, cycleIdx) {
    var key = seg.id + ':' + cycleIdx;
    if (key === cacheKey && cacheData) return cacheData;
    var seed = (seg.seedBase + cycleIdx * 1013) | 0;
    cacheData = genStain(seed, seg.cx, seg.cy);
    cacheKey = key;
    return cacheData;
  }

  // QA hook: location.search "seed=tNN" freezes the local cycle clock at
  // NN seconds (cycle 0 of the home segment); "seed=found" = t33.
  var forcedT = -1;
  try {
    var qs = String((typeof location !== 'undefined' && location.search) || '');
    var mt = /[?&]seed=t(\d+)/.exec(qs);
    if (mt) forcedT = parseInt(mt[1], 10);
    else if (/[?&]seed=found/.test(qs)) forcedT = 33;
  } catch (e) { forcedT = -1; }

  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - t0) / 1000;
    return 0;
  }

  // ------------------------------------------------------------------
  // Layout (Visual Viewport API, resize listeners on both)
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var scale = 1, orgX = 0, orgY = 0;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr) isPhone = Math.min(scr.width, scr.height) < 700;
    else isPhone = h > w * 1.15;
    scale = Math.min(W / FW, H / FH) * 0.97;
    orgX = (W - FW * scale) / 2;
    orgY = (H - FH * scale) / 2;
  }
  function px(x) { return orgX + x * scale; }
  function py(y) { return orgY + y * scale; }

  // ------------------------------------------------------------------
  // Drawing helpers
  // ------------------------------------------------------------------
  // Draw a polyline up to fraction frac of its arc length, with a
  // pressure profile: the stroke swells mid-way and tapers at the ends,
  // like one confident hand-drawn line.
  function drawPartial(pts, cum, total, frac, baseW, closed) {
    if (frac <= 0 || total <= 0) return;
    var target = total * clamp(frac, 0, 1);
    var n = pts.length, m = closed ? n : n - 1;
    ctx.strokeStyle = CHARCOAL;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var drawn = 0;
    for (var i = 0; i < m; i++) {
      var a = pts[i], b = pts[(i + 1) % n];
      var segLen = cum[i + 1] - cum[i];
      if (segLen <= 0) continue;
      var remain = target - drawn;
      if (remain <= 0) break;
      var f = Math.min(1, remain / segLen);
      var ex = a[0] + (b[0] - a[0]) * f, ey = a[1] + (b[1] - a[1]) * f;
      var sMid = (drawn + segLen * f / 2) / total;
      ctx.lineWidth = Math.max(0.6, baseW * (0.7 + 0.5 * Math.sin(Math.PI * clamp(sMid, 0, 1))));
      ctx.beginPath();
      ctx.moveTo(px(a[0]), py(a[1]));
      ctx.lineTo(px(ex), py(ey));
      ctx.stroke();
      drawn += segLen * f;
    }
  }

  function drawStainGroup(data, lt) {
    var g, alpha = 1, breath = 1;
    if (lt < GROW_T) {
      g = lt / GROW_T;
      alpha = Math.min(1, lt / 0.6);
    } else {
      g = 1;
    }
    if (lt >= GROW_T + FIND_T + HOLD_T) {
      alpha = 1 - (lt - GROW_T - FIND_T - HOLD_T) / (CYCLE - GROW_T - FIND_T - HOLD_T);
    }
    if (lt >= GROW_T + FIND_T && lt < GROW_T + FIND_T + HOLD_T) {
      breath = 1 + 0.01 * Math.sin(Math.PI * 2 * (lt - GROW_T - FIND_T) / HOLD_T);
    }
    var cxp = px(data.centroid[0]), cyp = py(data.centroid[1]);
    ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    if (breath !== 1) {
      ctx.translate(cxp, cyp);
      ctx.scale(breath, breath);
      ctx.translate(-cxp, -cyp);
    }
    // Blotches, in deposit order, each scaling in as it is born.
    var bl = data.blotches, i, j;
    for (i = 0; i < bl.length; i++) {
      var b = bl[i];
      if (b.birth >= g) continue;
      var grow = clamp((g - b.birth) / 0.025, 0, 1);
      grow = Math.sqrt(grow);
      var rr = b.r * grow * scale;
      ctx.fillStyle = STAIN_COLORS[b.col];
      // Flat fill, but traced as a curve through the vertex midpoints so
      // the blotch edge reads as wet ink, not a cut polygon.
      var nv = b.verts.length, pts = [];
      for (j = 0; j < nv; j++) pts.push([px(b.x) + b.verts[j][0] * rr, py(b.y) + b.verts[j][1] * rr]);
      ctx.beginPath();
      var mx = (pts[nv - 1][0] + pts[0][0]) / 2, my = (pts[nv - 1][1] + pts[0][1]) / 2;
      ctx.moveTo(mx, my);
      for (j = 0; j < nv; j++) {
        var p = pts[j], q = pts[(j + 1) % nv];
        ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
      }
      ctx.closePath();
      ctx.fill();
    }
    // Gold dust specks.
    ctx.fillStyle = GOLD;
    for (i = 0; i < data.specks.length; i++) {
      var sp = data.specks[i];
      if (sp.birth >= g) continue;
      ctx.beginPath();
      ctx.arc(px(sp.x), py(sp.y), Math.max(0.6, sp.r * scale), 0, Math.PI * 2);
      ctx.fill();
    }
    // The finding.
    if (lt >= GROW_T) {
      var p2 = clamp((lt - GROW_T) / FIND_T, 0, 1);
      var baseW = 0.0058 * scale;
      drawPartial(data.outline, data.outline.cum.cum, data.outline.cum.total, p2 / 0.55, baseW, true);
      var nSt = data.strokes.length;
      for (i = 0; i < nSt; i++) {
        var w0 = 0.55 + 0.42 * (i / nSt), w1 = 0.55 + 0.42 * ((i + 1) / nSt);
        var sf = clamp((p2 - w0) / (w1 - w0), 0, 1);
        var st = data.strokes[i];
        drawPartial(st.pts, st.cum, st.total, sf, baseW * 0.8, false);
      }
      // The eye appears as the finding begins its inner strokes.
      if (p2 >= 0.56) {
        ctx.fillStyle = CHARCOAL;
        ctx.beginPath();
        ctx.arc(px(data.eye[0]), py(data.eye[1]), Math.max(0.9, 0.0075 * scale), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function draw(nowOverride) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    var seg, lt, cyc;
    if (forcedT >= 0) {
      seg = segments[0];
      lt = forcedT % CYCLE;
      cyc = Math.floor(forcedT / CYCLE);
    } else {
      // The synchronous first frame passes an explicit 0 so frame one is
      // always the constant phase, never a live-clock reading.
      var t = (typeof nowOverride === 'number') ? nowOverride : elapsed();
      seg = segments[segments.length - 1];
      var ct = (t - seg.t0) + PHASE0;
      if (ct < 0) ct = 0;
      cyc = Math.floor(ct / CYCLE);
      lt = ct - cyc * CYCLE;
    }
    drawStainGroup(cycleData(seg, cyc), lt);
  }

  // ------------------------------------------------------------------
  // Interaction: tap seeds a new stain at the tap point; double-tap
  // reseeds everything. Events are recorded with anchored times.
  // ------------------------------------------------------------------
  var downX = 0, downY = 0, lastTapT = -10, lastTapX = 0, lastTapY = 0, pendingTap = null;

  function pointerPos(e) {
    if (e && typeof e.clientX === 'number') {
      var r = null;
      try { r = canvas.getBoundingClientRect(); } catch (err) { r = null; }
      return [e.clientX - (r ? r.left : 0), e.clientY - (r ? r.top : 0)];
    }
    return [0, 0];
  }
  function toComposition(p) {
    return [(p[0] - orgX) / scale, (p[1] - orgY) / scale];
  }
  function startSegment(cxU, cyU, familyJump) {
    tapSerial++;
    var seedBase = familyJump
      ? (BASE_SEED + 500000 + tapSerial * 7919) | 0
      : (BASE_SEED + tapSerial * 7919) | 0;
    segments.push({
      t0: elapsed(), seedBase: seedBase,
      cx: clamp(cxU, 0.30, FW - 0.30), cy: clamp(cyU, 0.28, 0.74),
      id: tapSerial
    });
    if (segments.length > 12) segments.splice(1, segments.length - 12);
    cacheKey = ''; cacheData = null;
  }
  function onDown(e) {
    var p = pointerPos(e);
    downX = p[0]; downY = p[1];
  }
  function onUp(e) {
    var p = pointerPos(e);
    var dx = p[0] - downX, dy = p[1] - downY;
    if (dx * dx + dy * dy > 100) return; // a drag, not a tap
    var now = elapsed();
    var ddx = p[0] - lastTapX, ddy = p[1] - lastTapY;
    if (now - lastTapT < 0.35 && ddx * ddx + ddy * ddy < 1600) {
      if (pendingTap !== null && typeof clearTimeout !== 'undefined') clearTimeout(pendingTap);
      pendingTap = null;
      lastTapT = -10;
      startSegment(HOME_X, HOME_Y, true);
      draw();
      return;
    }
    lastTapT = now; lastTapX = p[0]; lastTapY = p[1];
    var u = toComposition(p);
    if (typeof setTimeout !== 'undefined') {
      pendingTap = setTimeout(function () {
        pendingTap = null;
        startSegment(u[0], u[1], false);
        draw();
      }, 320);
    } else {
      startSegment(u[0], u[1], false);
    }
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointerup', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
    }
  }

  resize();
  draw(0); // frame one: synchronous draw at the constant phase

  if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
