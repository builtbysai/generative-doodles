<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measured Like a Body</title>
<style>
  html, body { margin: 0; padding: 0; background: #EFE7D3; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var PAPER = '#EFE7D3';
  var CUT = '#B23A2E';       // dotted cutting lines
  var GRAIN = '#2E2A24';     // grain arrows
  var MARK = '#3B4B8C';      // notches, drill holes
  var INK = '#23211C';       // annotations, names, title strip
  var PIN = '#D9A441';       // pin dots
  var SEAM = '#8A8578';      // seam allowance
  var BASE_SEED = 943000;
  var LOOP = 72;             // 60 measure + 10 hold + 2 lift
  var MEASURE = 60;
  var PHASE0 = 46;           // frame one: relationship ~ m=0.767 measured

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function easeOut(v) { v = clamp01(v); return 1 - (1 - v) * (1 - v); }

  // ---------- subjects ----------
  // Layout positions are fractions of the cutting-table field.
  var SUBJECTS = [
    {
      title: 'a relationship, measured',
      pieces: [
        { name: 'the first year', ann: 'patience 14',            x: 0.27, y: 0.29, r: 0.27, rot: -0.35, annAng: -2.55 },
        { name: 'the argument',   ann: 'attention span \u2014',  x: 0.70, y: 0.27, r: 0.24, rot: 0.50,  annAng: -0.55 },
        { name: 'the repair',     ann: 'trust, in cm: all of it', x: 0.34, y: 0.65, r: 0.25, rot: 0.15, annAng: 2.75 },
        { name: 'the long summer', ann: 'warmth 3 layers',       x: 0.70, y: 0.64, r: 0.27, rot: -0.80, annAng: 0.45 }
      ],
      // annotation write-in order: patience, trust, attention, warmth
      annOrder: [0, 2, 1, 3]
    },
    {
      title: 'an AI, measured',
      pieces: [
        { name: 'the training',      ann: 'temperature 0.7',      x: 0.27, y: 0.29, r: 0.28, rot: 0.30,  annAng: -2.60 },
        { name: 'the context window', ann: 'attention span 128k', x: 0.70, y: 0.27, r: 0.24, rot: -0.45, annAng: -0.50 },
        { name: 'the refusal',       ann: 'patience: unmeasured', x: 0.33, y: 0.65, r: 0.24, rot: -0.15, annAng: 2.80 },
        { name: 'the hallucination', ann: 'humility \u2014',      x: 0.70, y: 0.64, r: 0.27, rot: 0.85,  annAng: 0.50 }
      ],
      annOrder: [0, 1, 2, 3]
    },
    {
      title: 'a painting, measured',
      pieces: [
        { name: 'the first sketch',  ann: 'ultramarine 40g',      x: 0.27, y: 0.29, r: 0.26, rot: -0.55, annAng: -2.50 },
        { name: 'the underpainting', ann: 'light: one window',    x: 0.70, y: 0.27, r: 0.25, rot: 0.40,  annAng: -0.60 },
        { name: 'the glaze',         ann: 'patience 14 (again)',  x: 0.35, y: 0.65, r: 0.23, rot: 0.70,  annAng: 2.85 },
        { name: 'the varnish day',   ann: 'cracks \u2014',        x: 0.70, y: 0.64, r: 0.27, rot: -0.25, annAng: 0.40 }
      ],
      annOrder: [0, 1, 2, 3]
    },
    {
      title: 'a week, measured',
      pieces: [
        { name: 'monday',        ann: 'meetings 23',              x: 0.27, y: 0.29, r: 0.25, rot: 0.10,  annAng: -2.65 },
        { name: 'the middle',    ann: 'coffee 0.4 l daily',       x: 0.70, y: 0.27, r: 0.26, rot: -0.70, annAng: -0.45 },
        { name: 'friday feeling', ann: 'sleep, total: not enough', x: 0.34, y: 0.65, r: 0.26, rot: -0.40, annAng: 2.70 },
        { name: 'the weekend',   ann: 'hope \u2014',               x: 0.70, y: 0.64, r: 0.27, rot: 0.55,  annAng: 0.55 }
      ],
      annOrder: [0, 1, 2, 3]
    }
  ];
  var PIN_SPOTS = [
    { x: 0.30, y: 0.34 }, { x: 0.66, y: 0.22 }, { x: 0.40, y: 0.62 },
    { x: 0.76, y: 0.60 }, { x: 0.52, y: 0.44 }
  ];

  // ---------- model ----------
  // A piece model: wobbled closed outline (unit space, radius ~1 around origin),
  // resampled to N points with cumulative arc length, plus marks and text jitter.
  function buildPiece(def, rng) {
    var NV = 9;
    var verts = [];
    var i, a, rr;
    for (i = 0; i < NV; i++) {
      a = (i / NV) * Math.PI * 2;
      rr = 0.78 + rng() * 0.38;
      verts.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr * (0.82 + rng() * 0.22) });
    }
    // closed Catmull-Rom -> dense outline
    var N = 150;
    var pts = [];
    function cr(p0, p1, p2, p3, t) {
      var t2 = t * t, t3 = t2 * t;
      return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
    }
    var seg = Math.floor(N / NV);
    for (i = 0; i < NV; i++) {
      var p0 = verts[(i + NV - 1) % NV], p1 = verts[i], p2 = verts[(i + 1) % NV], p3 = verts[(i + 2) % NV];
      for (var j = 0; j < seg; j++) {
        var t = j / seg;
        pts.push({ x: cr(p0.x, p1.x, p2.x, p3.x, t), y: cr(p0.y, p1.y, p2.y, p3.y, t) });
      }
    }
    while (pts.length > N) pts.pop();
    while (pts.length < N) pts.push(pts[pts.length - 1]);
    // cumulative lengths
    var cum = [0];
    for (i = 1; i <= N; i++) {
      var q = pts[i % N], p = pts[i - 1];
      cum.push(cum[i - 1] + Math.sqrt((q.x - p.x) * (q.x - p.x) + (q.y - p.y) * (q.y - p.y)));
    }
    var total = cum[N];
    // grain axis: direction of the longest vertex chord
    var best = 0, bang = def.rot;
    for (i = 0; i < NV; i++) {
      for (var k = i + 1; k < NV; k++) {
        var dx = verts[k].x - verts[i].x, dy = verts[k].y - verts[i].y;
        var d = dx * dx + dy * dy;
        if (d > best) { best = d; bang = Math.atan2(dy, dx); }
      }
    }
    // marks: notches on edges + drill holes inside
    var marks = [];
    var nNotch = 2 + Math.floor(rng() * 2);
    for (i = 0; i < nNotch; i++) marks.push({ kind: 'notch', s: rng() * 0.92 + 0.04 });
    var nHole = 1 + Math.floor(rng() * 2);
    for (i = 0; i < nHole; i++) {
      a = rng() * Math.PI * 2; rr = 0.25 + rng() * 0.4;
      marks.push({ kind: 'hole', x: Math.cos(a) * rr, y: Math.sin(a) * rr });
    }
    return {
      def: def, pts: pts, cum: cum, total: total, axis: bang,
      marks: marks,
      nameJit: jitterFor(def.name, rng),
      annJit: jitterFor(def.ann, rng)
    };
  }
  function jitterFor(str, rng) {
    var out = [];
    for (var i = 0; i < str.length; i++) out.push({ dx: (rng() - 0.5) * 0.14, dy: (rng() - 0.5) * 0.22, rot: (rng() - 0.5) * 0.15 });
    return out;
  }
  function buildSubject(idx) {
    var rng = mulberry32(BASE_SEED + idx * 7919);
    var def = SUBJECTS[idx];
    var pieces = [];
    for (var i = 0; i < def.pieces.length; i++) pieces.push(buildPiece(def.pieces[i], rng));
    var pins = [];
    for (var j = 0; j < PIN_SPOTS.length; j++) pins.push({ x: PIN_SPOTS[j].x, y: PIN_SPOTS[j].y });
    return { def: def, pieces: pieces, pins: pins, titleJit: jitterFor(def.title, rng) };
  }
  var MODELS = [buildSubject(0), buildSubject(1), buildSubject(2), buildSubject(3)];

  // outline point at arc-length fraction s (unit space)
  function pointAt(model, s) {
    var target = (((s % 1) + 1) % 1) * model.total;
    var cum = model.cum, pts = model.pts, N = pts.length;
    var lo = 0, hi = N;
    while (lo < hi - 1) { var mid = (lo + hi) >> 1; if (cum[mid] <= target) lo = mid; else hi = mid; }
    var span = cum[lo + 1] - cum[lo] || 1;
    var f = (target - cum[lo]) / span;
    var p = pts[lo % N], q = pts[(lo + 1) % N];
    return { x: p.x + (q.x - p.x) * f, y: p.y + (q.y - p.y) * f };
  }

  // ---------- events / state ----------
  // All interaction state is rebuilt closed-form from the recorded event list.
  var events = [];            // {type:'subject'|'pin'|'cut', t, pin, dx, dy, subj}
  var gradeBySubject = [{}, {}, {}, {}];  // derived cache, rebuilt in stateAt
  var dragLive = null;        // {pin, dx, dy} while a drag is in flight

  function stateAt(T) {
    var subj = 0, start = 0;
    var grades = [{}, {}, {}, {}];
    var cuts = [];
    var sorted = events.slice().sort(function (a, b) { return a.t - b.t; });
    var ei = 0;
    // walk segments: auto cycles + subject events, in time order
    var guard = 0;
    while (guard++ < 10000) {
      var nextAuto = start + LOOP;
      var ev = (ei < sorted.length) ? sorted[ei] : null;
      if (ev && ev.t <= T && ev.t < nextAuto) {
        if (ev.type === 'subject') { subj = (subj + 1) % 4; start = ev.t; }
        else if (ev.type === 'pin') { grades[subj][ev.pin] = { dx: ev.dx, dy: ev.dy }; }
        else if (ev.type === 'cut') { cuts.push({ t: ev.t, start: start }); }
        ei++;
      } else if (nextAuto <= T) {
        subj = (subj + 1) % 4; start = nextAuto;
      } else break;
    }
    // events exactly at/after T within the current segment do not apply;
    // events between the last processed point and T were handled above.
    var local = T - start;
    var cutAmp = 0;
    for (var i = 0; i < cuts.length; i++) {
      if (cuts[i].start === start) {
        var s = T - cuts[i].t;
        if (s >= 0 && s <= 2) cutAmp = Math.max(cutAmp, Math.sin(Math.PI * s / 2));
      }
    }
    return { subj: subj, local: local, grades: grades[subj], cutAmp: cutAmp };
  }

  // measure-stage progress helpers (m in [0,1])
  function cutFrac(m, i) { return clamp01((m - i * 0.07) / 0.62); }
  function seamFrac(m, i) { return clamp01((m - 0.06 - i * 0.07) / 0.58); }
  function arrowFrac(m, i) { return clamp01((m - 0.40 - i * 0.03) / 0.10); }
  function annFrac(m, orderIdx) { return clamp01((m - (0.55 + orderIdx * 0.09)) / 0.06); }
  function pinFrac(m, j) { return clamp01((m - (0.70 + j * 0.045)) / 0.03); }

  // ---------- audio (lazy, gesture-only) ----------
  var AC = null, audioOn = false;
  function ensureAudio() {
    if (audioOn) return;
    try {
      if (typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext)) {
        var Ctor = window.AudioContext || window.webkitAudioContext;
        AC = new Ctor();
        audioOn = true;
      }
    } catch (e) { AC = null; }
  }
  function blip(freq, dur, gain, type) {
    if (!audioOn || !AC) return;
    try {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(gain, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + dur);
    } catch (e) {}
  }
  function tick() { blip(2400 + Math.random() * 800, 0.03, 0.015, 'square'); }
  function prick() { blip(3200, 0.05, 0.03, 'square'); }
  function snip() { blip(900, 0.07, 0.04, 'sawtooth'); setTimeout(function () { blip(700, 0.07, 0.04, 'sawtooth'); }, 90); }

  // ---------- canvas / sizing ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, phone = false;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 300);
    var h = vv ? vv.height : (window.innerHeight || 300);
    W = Math.max(200, Math.floor(w)); H = Math.max(200, Math.floor(h));
    canvas.width = W; canvas.height = H;
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
    if (window.addEventListener) window.addEventListener('resize', resize);
  }
  resize();

  // ---------- drawing ----------
  function field() {
    return { x0: W * 0.055, y0: H * 0.045, x1: W * 0.945, y1: H * 0.885 };
  }
  function drawJitteredText(str, jit, x, y, font, color, align, maxFrac) {
    ctx.font = font; ctx.fillStyle = color;
    var n = str.length;
    if (typeof maxFrac === 'number') n = Math.floor(clamp01(maxFrac) * str.length);
    if (n <= 0) return;
    var widths = [], total = 0, i;
    for (i = 0; i < n; i++) { var wd = ctx.measureText(str[i]).width; widths.push(wd); total += wd; }
    var cx = x;
    if (align === 'center') cx = x - total / 2;
    else if (align === 'right') cx = x - total;
    ctx.textBaseline = 'middle';
    for (i = 0; i < n; i++) {
      var jt = jit[i % jit.length];
      ctx.save();
      ctx.translate(cx + widths[i] / 2 + jt.dx * 10, y + jt.dy * 10);
      ctx.rotate(jt.rot);
      ctx.textAlign = 'center';
      ctx.fillText(str[i], 0, 0);
      ctx.restore();
      cx += widths[i];
    }
  }

  function draw(T) {
    var st = stateAt(T);
    var model = MODELS[st.subj];
    var def = model.def;
    var local = st.local;
    var m, lift = 0, alpha = 1;
    if (local < MEASURE) m = local / MEASURE;
    else if (local < MEASURE + 10) m = 1;
    else { var lt = (local - MEASURE - 10) / 2; lift = Math.sin(Math.PI * clamp01(lt)); m = 1; alpha = 1 - 0.55 * lift; }

    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var F = field();
    var FW = F.x1 - F.x0, FH = F.y1 - F.y0;
    var u = Math.min(W, H);
    var liftY = -lift * 0.014 * u;

    // pattern centroid (field coords) for the cut-apart move
    var cenX = 0, cenY = 0, i, j;
    for (i = 0; i < def.pieces.length; i++) { cenX += def.pieces[i].x; cenY += def.pieces[i].y; }
    cenX /= def.pieces.length; cenY /= def.pieces.length;

    // grade state for this subject (pin positions in field fractions)
    var grades = st.grades;
    if (dragLive) grades = shallowCopyGrades(grades, dragLive);

    ctx.save();
    ctx.globalAlpha = alpha;

    // ----- pieces -----
    var pieceScreen = [];
    for (i = 0; i < model.pieces.length; i++) {
      var pm = model.pieces[i];
      var pd = pm.def;
      var cx = F.x0 + pd.x * FW, cy = F.y0 + pd.y * FH + liftY;
      var scale = pd.r * Math.min(FW, FH);
      // cut-apart offset: away from centroid
      var cdx = (pd.x - cenX), cdy = (pd.y - cenY);
      var clen = Math.sqrt(cdx * cdx + cdy * cdy) || 1;
      var cutOff = st.cutAmp * 14;
      cx += (cdx / clen) * cutOff; cy += (cdy / clen) * cutOff;
      pieceScreen.push({ cx: cx, cy: cy, scale: scale });

      // transform: unit point -> graded screen point
      var tf = makeTransform(cx, cy, scale, pm, grades, F, u);
      drawPiece(pm, i, m, tf, u);
    }

    // ----- piece names (lettered on the piece, as on real cartamodelli) -----
    var nameFont = '600 ' + Math.max(11, Math.round(u * 0.027)) + 'px "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive';
    for (i = 0; i < model.pieces.length; i++) {
      var ps = pieceScreen[i];
      var nf = clamp01((m - 0.30 - i * 0.03) / 0.10);
      if (nf > 0) {
        ctx.save(); ctx.globalAlpha = alpha * nf;
        drawJitteredText(model.pieces[i].def.name, model.pieces[i].nameJit,
          ps.cx, ps.cy - ps.scale * 0.52, nameFont, INK, 'center', 1);
        ctx.restore();
      }
    }

    // ----- annotations (write-in order per subject) -----
    var annFont = Math.max(10, Math.round(u * 0.024)) + 'px "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive';
    for (var oi = 0; oi < def.annOrder.length; oi++) {
      var pi = def.annOrder[oi];
      var af = annFrac(m, oi);
      if (af <= 0) continue;
      var pdef = def.pieces[pi];
      var psc = pieceScreen[pi];
      var ax, ay, al;
      if (phone) {
        // no side margins on a phone table: letter the measurement on the piece itself
        ax = psc.cx; ay = psc.cy + psc.scale * 0.58; al = 'center';
      } else {
        ax = psc.cx + Math.cos(pdef.annAng) * (psc.scale * 1.14 + u * 0.02);
        ay = psc.cy + Math.sin(pdef.annAng) * (psc.scale * 1.02 + u * 0.02);
        al = Math.cos(pdef.annAng) > 0.3 ? 'left' : (Math.cos(pdef.annAng) < -0.3 ? 'right' : 'center');
      }
      // keep the whole string on the table: measure and clamp the anchor
      ctx.font = annFont;
      var tw = ctx.measureText(pdef.ann).width;
      if (al === 'left') ax = clamp(ax, W * 0.03, Math.max(W * 0.03, W - tw - W * 0.02));
      else if (al === 'right') ax = clamp(ax, Math.min(W * 0.97, tw + W * 0.02), W * 0.97);
      else ax = clamp(ax, tw / 2 + W * 0.02, W - tw / 2 - W * 0.02);
      ay = clamp(ay, H * 0.055, H * 0.875);
      drawJitteredText(pdef.ann, model.pieces[pi].annJit, ax, ay, annFont, INK, al, af);
    }

    // ----- pins -----
    for (j = 0; j < model.pins.length; j++) {
      var pf = pinFrac(m, j);
      var gx = 0, gy = 0;
      if (grades[j]) { gx = grades[j].dx; gy = grades[j].dy; }
      var px = F.x0 + model.pins[j].x * FW + gx;
      var py = F.y0 + model.pins[j].y * FH + gy + liftY;
      if (pf > 0) {
        var dropY = (1 - easeOut(pf)) * -0.05 * u;
        ctx.save(); ctx.globalAlpha = alpha * clamp01(pf * 1.5);
        ctx.fillStyle = PIN;
        ctx.beginPath(); ctx.arc(px, py + dropY, Math.max(4, u * 0.010), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = INK;
        ctx.beginPath(); ctx.arc(px, py + dropY, Math.max(1.4, u * 0.0032), 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();

    // ----- title strip -----
    var stripY = H * 0.945;
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.55; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W * 0.06, H * 0.905); ctx.lineTo(W * 0.94, H * 0.905); ctx.stroke();
    ctx.globalAlpha = 1;
    var titleFont = '600 ' + Math.max(13, Math.round(u * 0.032)) + 'px "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive';
    drawJitteredText(def.title, model.titleJit, W / 2, stripY, titleFont, INK, 'center', 1);

    return { m: m, subj: st.subj, annChars: annCharCount(model, m), pinsDown: pinsDownCount(m) };
  }

  function shallowCopyGrades(grades, live) {
    var out = {};
    for (var k in grades) out[k] = grades[k];
    out[live.pin] = { dx: live.dx, dy: live.dy };
    return out;
  }

  // Piece transform factory: applies re-grade (scale pieces around moved pins).
  function makeTransform(cx, cy, scale, pm, grades, F, u) {
    // combined grade factor for this piece: pins pull their neighbourhood
    return function (ux, uy) {
      var fx = (cx - F.x0) / (F.x1 - F.x0), fy = (cy - F.y0) / (F.y1 - F.y0);
      var px = cx + ux * scale, py = cy + uy * scale;
      for (var j = 0; j < PIN_SPOTS.length; j++) {
        var g = grades[j];
        if (!g) continue;
        var pinFx = PIN_SPOTS[j].x + g.dx / (F.x1 - F.x0);
        var pinFy = PIN_SPOTS[j].y + g.dy / (F.y1 - F.y0);
        var dFrac = Math.sqrt((fx - pinFx) * (fx - pinFx) + (fy - pinFy) * (fy - pinFy));
        var wgt = 1.2 - clamp01(dFrac / 0.7);
        if (wgt <= 0) continue;
        var disp = Math.sqrt(g.dx * g.dx + g.dy * g.dy);
        var strength = Math.min(0.45, disp / (0.35 * u));
        var f = 1 + strength * 0.8 * wgt;
        var pinSx = F.x0 + pinFx * (F.x1 - F.x0), pinSy = F.y0 + pinFy * (F.y1 - F.y0);
        px = pinSx + (px - pinSx) * f;
        py = pinSy + (py - pinSy) * f;
      }
      return { x: px, y: py };
    };
  }

  function outlinePath(tf, pm, frac, inset) {
    // returns array of screen points along the (optionally inset) outline
    var cnt = Math.max(2, Math.floor(frac * pm.pts.length));
    var out = [];
    for (var i = 0; i < cnt; i++) {
      var p = pm.pts[i];
      var x = p.x, y = p.y;
      if (inset) { x *= 0.90; y *= 0.90; }
      out.push(tf(x, y));
    }
    return out;
  }

  function drawPiece(pm, idx, m, tf, u) {
    var i, p, q;
    // seam allowance: dashed offset outline
    var sf = seamFrac(m, idx);
    if (sf > 0) {
      var sp = outlinePath(tf, pm, sf, true);
      ctx.strokeStyle = SEAM; ctx.lineWidth = 1.1;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      for (i = 0; i < sp.length; i++) { if (i === 0) ctx.moveTo(sp[i].x, sp[i].y); else ctx.lineTo(sp[i].x, sp[i].y); }
      if (sf >= 1) ctx.closePath();
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // cutting line: dotted red, dots laid by arc length
    var cf = cutFrac(m, idx);
    if (cf > 0) {
      var spacing = 0.055; // unit-space arc length between dots
      var totalDots = Math.floor(pm.total / spacing);
      var nd = Math.floor(cf * totalDots);
      ctx.fillStyle = CUT;
      var r = Math.max(1.3, u * 0.0028);
      for (i = 0; i < nd; i++) {
        p = pointAt(pm, (i * spacing) / pm.total);
        q = tf(p.x, p.y);
        ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    // grain arrow along the long axis
    var af = arrowFrac(m, idx);
    if (af > 0) {
      var ax = Math.cos(pm.axis), ay = Math.sin(pm.axis);
      var L = 0.66;
      var tail = tf(-ax * L, -ay * L);
      var headFull = { x: ax * L, y: ay * L };
      var head = tf(-ax * L + (headFull.x + ax * L) * af, -ay * L + (headFull.y + ay * L) * af);
      ctx.strokeStyle = GRAIN; ctx.lineWidth = Math.max(1.2, u * 0.0022);
      ctx.beginPath(); ctx.moveTo(tail.x, tail.y); ctx.lineTo(head.x, head.y); ctx.stroke();
      // arrowheads at both ends (head end scales in with af)
      drawArrowHead(tail, { x: -ax, y: -ay }, u, 1);
      if (af > 0.8) drawArrowHead(head, { x: ax, y: ay }, u, (af - 0.8) / 0.2);
    }
    // marks: notches + drill holes, staggered in
    for (i = 0; i < pm.marks.length; i++) {
      var th = 0.48 + (idx * 3 + i) * 0.011;
      var mf = clamp01((m - th) / 0.012);
      if (mf <= 0) continue;
      var mk = pm.marks[i];
      ctx.save(); ctx.globalAlpha = mf;
      if (mk.kind === 'notch') {
        var bp = pointAt(pm, mk.s);
        var cen = tf(0, 0);
        var bq = tf(bp.x, bp.y);
        var nx = bq.x - cen.x, ny = bq.y - cen.y;
        var nl = Math.sqrt(nx * nx + ny * ny) || 1; nx /= nl; ny /= nl;
        var tx = -ny, ty = nx;
        var sz = Math.max(4, u * 0.011) * mf, hw = Math.max(2.6, u * 0.006);
        ctx.fillStyle = MARK;
        ctx.beginPath();
        ctx.moveTo(bq.x + tx * hw, bq.y + ty * hw);
        ctx.lineTo(bq.x - tx * hw, bq.y - ty * hw);
        ctx.lineTo(bq.x + nx * sz, bq.y + ny * sz);
        ctx.closePath(); ctx.fill();
      } else {
        var hq = tf(mk.x, mk.y);
        ctx.strokeStyle = MARK; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(hq.x, hq.y, Math.max(2.2, u * 0.005) * mf + 0.6, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
  }
  function drawArrowHead(tip, dir, u, s) {
    var sz = Math.max(4, u * 0.012) * s;
    var px = -dir.y, py = dir.x;
    ctx.fillStyle = GRAIN;
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(tip.x - dir.x * sz + px * sz * 0.42, tip.y - dir.y * sz + py * sz * 0.42);
    ctx.lineTo(tip.x - dir.x * sz - px * sz * 0.42, tip.y - dir.y * sz - py * sz * 0.42);
    ctx.closePath(); ctx.fill();
  }

  function annCharCount(model, m) {
    var n = 0, def = model.def;
    for (var oi = 0; oi < def.annOrder.length; oi++) {
      var pi = def.annOrder[oi];
      n += Math.floor(annFrac(m, oi) * def.pieces[pi].ann.length);
    }
    return n;
  }
  function pinsDownCount(m) {
    var n = 0;
    for (var j = 0; j < PIN_SPOTS.length; j++) if (pinFrac(m, j) >= 1) n++;
    return n;
  }

  // ---------- clock ----------
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - t0) / 1000;
    return 0;
  }
  function pieceTime() { return PHASE0 + elapsed(); }

  var lastStats = draw(PHASE0); // frame one: synchronous, fixed phase

  if (typeof requestAnimationFrame === 'function') {
    var loopFn = function () {
      var stats = draw(pieceTime());
      if (audioOn) {
        if (stats.annChars > lastStats.annChars) tick();
        if (stats.pinsDown > lastStats.pinsDown) prick();
      }
      lastStats = stats;
      requestAnimationFrame(loopFn);
    };
    requestAnimationFrame(loopFn);
  }

  // ---------- interaction ----------
  var downInfo = null, lastTapT = -10, lastTapX = 0, lastTapY = 0, pendingTapTimer = null;

  function evtPos(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  function nearestPin(x, y, T) {
    var st = stateAt(T);
    var model = MODELS[st.subj];
    var F = field();
    var best = -1, bestD = 0.07 * Math.min(W, H);
    for (var j = 0; j < model.pins.length; j++) {
      var g = st.grades[j];
      var px = F.x0 + model.pins[j].x * (F.x1 - F.x0) + (g ? g.dx : 0);
      var py = F.y0 + model.pins[j].y * (F.y1 - F.y0) + (g ? g.dy : 0);
      var d = Math.sqrt((x - px) * (x - px) + (y - py) * (y - py));
      if (d < bestD) { bestD = d; best = j; }
    }
    return best;
  }
  function onDown(e) {
    ensureAudio();
    if (AC && AC.resume) { try { AC.resume(); } catch (err) {} }
    var p = evtPos(e);
    var T = pieceTime();
    var pin = nearestPin(p.x, p.y, T);
    downInfo = { x: p.x, y: p.y, t: T, pin: pin, moved: false };
    if (pin >= 0) {
      var st = stateAt(T);
      var g = st.grades[pin];
      dragLive = { pin: pin, dx: g ? g.dx : 0, dy: g ? g.dy : 0 };
      downInfo.baseDx = dragLive.dx; downInfo.baseDy = dragLive.dy;
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!downInfo) return;
    var p = evtPos(e);
    if (Math.abs(p.x - downInfo.x) + Math.abs(p.y - downInfo.y) > 6) downInfo.moved = true;
    if (downInfo.pin >= 0 && dragLive) {
      dragLive.dx = clamp(downInfo.baseDx + (p.x - downInfo.x), -W * 0.3, W * 0.3);
      dragLive.dy = clamp(downInfo.baseDy + (p.y - downInfo.y), -H * 0.3, H * 0.3);
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!downInfo) return;
    var p = evtPos(e);
    var T = pieceTime();
    var wasDrag = downInfo.pin >= 0 && downInfo.moved;
    if (wasDrag && dragLive) {
      events.push({ type: 'pin', t: T, pin: downInfo.pin, dx: dragLive.dx, dy: dragLive.dy });
    } else if (!downInfo.moved) {
      // tap (or double-tap)
      var dt = T - lastTapT;
      var dd = Math.sqrt((p.x - lastTapX) * (p.x - lastTapX) + (p.y - lastTapY) * (p.y - lastTapY));
      if (dt < 0.38 && dd < 40) {
        if (pendingTapTimer) { clearTimeout(pendingTapTimer); pendingTapTimer = null; }
        events.push({ type: 'cut', t: T });
        snip();
        lastTapT = -10;
      } else {
        lastTapT = T; lastTapX = p.x; lastTapY = p.y;
        var tapT = T;
        if (typeof setTimeout === 'function') {
          pendingTapTimer = setTimeout(function () {
            events.push({ type: 'subject', t: tapT + 0.38 });
            pendingTapTimer = null;
          }, 380);
        } else {
          events.push({ type: 'subject', t: tapT });
        }
      }
    }
    downInfo = null; dragLive = null;
    if (e.preventDefault) e.preventDefault();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
  }
})();
</script>
</body>
</html>
