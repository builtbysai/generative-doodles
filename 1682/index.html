<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Structure, Eleven Palettes</title>
<style>
html, body { margin: 0; padding: 0; background: #E9DFC8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var FIRST_T = 0;
var HOLD = 4;
var PALETTE_COUNT = 11;
var PLATE = '#26221c';
var PLATE_LINE = 'rgba(201,143,45,0.55)';
var TITLE_INK = '#f3ead6';
var HINT_INK = '#e8c87a';
/* The palette is the mechanism. One subdivision city is built once,
   frozen mid-build at a dense state, and held absolutely still while
   eleven palettes cut through it one at a time. The geometry never
   moves a pixel between swaps: same tree, same leaves, same heights,
   same per-leaf color slot. Only the dressing changes, so the viewer
   feels the SAME object become a different place eleven times. The
   swaps are instant cuts, not fades: the shock of the swap is the
   point. Ten sets are hand-built and named; the eleventh is a
   procedurally random-noise set, generated once from a fixed seed so
   the piece stays deterministic, and it lands last in each cycle as
   the contrast beat that shows why Golid keeps color away from
   randomness. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgbStr(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function shade(c, f) {
  return [clamp(Math.round(c[0] * f), 0, 255),
    clamp(Math.round(c[1] * f), 0, 255),
    clamp(Math.round(c[2] * f), 0, 255)];
}
/* Layered value noise on a seeded grid, for the Dark Plum red clusters. */
function makeNoise(seed, gw, gh) {
  var r = mulberry32(seed);
  var g = [], i, j;
  for (j = 0; j <= gh; j++) {
    g.push([]);
    for (i = 0; i <= gw; i++) g[j].push(r());
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  return function (x, y) {
    var fx = clamp(x, 0, 0.9999) * gw, fy = clamp(y, 0, 0.9999) * gh;
    var ix = Math.floor(fx), iy = Math.floor(fy);
    var tx = smooth(fx - ix), ty = smooth(fy - iy);
    var a = g[iy][ix], b = g[iy][ix + 1], c = g[iy + 1][ix], d = g[iy + 1][ix + 1];
    return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
  };
}
var clusterNoise = makeNoise(168207, 5, 5);
/* Eleven palettes as named, curated objects. The random set is built
   once from a fixed seed: random in character, deterministic in fact. */
var PALETTES = [
  { name: 'Mustard and Red', kind: 'hand-built', ground: [233, 223, 200],
    colors: [[217, 160, 33], [179, 58, 43], [242, 235, 218]] },
  { name: 'Rose and Maroon', kind: 'hand-built', ground: [242, 234, 216],
    colors: [[217, 123, 123], [122, 42, 53], [232, 207, 200]] },
  { name: 'Purple and Yellow', kind: 'hand-built', ground: [91, 184, 176],
    colors: [[107, 78, 142], [232, 180, 37], [43, 74, 140], [242, 234, 216]] },
  { name: 'Monaco colorway', kind: 'hand-built', ground: [239, 233, 220],
    colors: [[23, 128, 122], [95, 168, 96], [122, 46, 82], [20, 82, 79]] },
  { name: 'Block Work', kind: 'hand-built', ground: [242, 240, 235],
    colors: [[22, 21, 19], [255, 255, 255], [138, 135, 127]] },
  { name: 'Pastel 3D', kind: 'hand-built', ground: [246, 241, 231],
    colors: [[242, 196, 199], [183, 211, 232], [196, 227, 210],
      [217, 200, 232], [245, 227, 168]] },
  { name: 'Blueprint', kind: 'hand-built', ground: [216, 212, 200],
    colors: [[43, 108, 176], [217, 160, 168], [224, 123, 57], [90, 42, 53]] },
  { name: 'Dark Plum', kind: 'hand-built', ground: [46, 26, 46],
    clusterRed: [192, 57, 43],
    colors: [[92, 46, 82], [62, 33, 64], [201, 168, 196]] },
  { name: 'Arctic', kind: 'hand-built', ground: [232, 238, 242],
    colors: [[168, 200, 220], [255, 255, 255], [74, 90, 106], [43, 74, 107]] },
  { name: 'Vermilion Field', kind: 'hand-built', ground: [242, 234, 216],
    colors: [[217, 72, 31], [232, 168, 32], [43, 122, 110], [43, 43, 38]] },
  { name: 'Random Noise', kind: 'random', ground: [232, 228, 218],
    colors: null }
];
(function buildRandomPalette() {
  var r = mulberry32(168210), cols = [], i;
  for (i = 0; i < 5; i++) {
    cols.push([Math.floor(r() * 256), Math.floor(r() * 256),
      Math.floor(r() * 256)]);
  }
  PALETTES[10].colors = cols;
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* ---- the fixed structure: one subdivision tree, built once ---- */
var treeRng = mulberry32(1682);
var leaves = [];
function pushLeaf(x, y, w, h) {
  leaves.push({
    x: x, y: y, w: w, h: h,
    u: treeRng(),
    hz: 0.2 + treeRng() * 0.8,
    n: clusterNoise(x + w / 2, y + h / 2)
  });
}
function splitRect(x, y, w, h, depth) {
  var minW = 0.045, minH = 0.045;
  var canV = w >= minW * 2, canH = h >= minH * 2;
  if (depth >= 11 || (!canV && !canH)) { pushLeaf(x, y, w, h); return; }
  if (depth >= 5 && treeRng() < 0.18) { pushLeaf(x, y, w, h); return; }
  var vertical;
  if (canV && canH) vertical = (w > h) ? treeRng() < 0.7 : treeRng() < 0.3;
  else vertical = canV;
  var f = 0.35 + treeRng() * 0.3;
  if (vertical) {
    splitRect(x, y, w * f, h, depth + 1);
    splitRect(x + w * f, y, w * (1 - f), h, depth + 1);
  } else {
    splitRect(x, y, w, h * f, depth + 1);
    splitRect(x, y + h * f, w, h * (1 - f), depth + 1);
  }
}
splitRect(0, 0, 1, 1, 0);
/* Painter order: back to front by x + y, so a nearer block's shallow
   extrusion paints over the block behind it. */
leaves.sort(function (a, b) { return (a.x + a.y) - (b.x + b.y); });
function colorFor(leaf, pal) {
  if (pal.clusterRed && leaf.n > 0.62) return pal.clusterRed;
  var cols = pal.colors;
  return cols[Math.floor(leaf.u * cols.length) % cols.length];
}
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function drawBlock(l, F, pal) {
  var x = F.x + l.x * F.w, y = F.y + l.y * F.h;
  var w = l.w * F.w, h = l.h * F.h;
  var g = Math.max(1, Math.min(F.w, F.h) * 0.0022);
  x += g; y += g; w -= 2 * g; h -= 2 * g;
  if (w <= 0.5 || h <= 0.5) return;
  var hz = l.hz * Math.min(F.w, F.h) * 0.016;
  var ox = hz * 0.5, oy = hz;
  var c = colorFor(l, pal);
  ctx.fillStyle = rgbStr(c);
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = rgbStr(shade(c, 1.22));
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + ox, y - oy);
  ctx.lineTo(x + w + ox, y - oy);
  ctx.lineTo(x + w, y);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = rgbStr(shade(c, 0.6));
  ctx.beginPath();
  ctx.moveTo(x + w, y);
  ctx.lineTo(x + w + ox, y - oy);
  ctx.lineTo(x + w + ox, y + h - oy);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
  ctx.fill();
}
function paletteIndexAt(t) {
  var i = Math.floor((t - FIRST_T) / HOLD);
  if (i < 0) i = 0;
  return i % PALETTE_COUNT;
}
function drawPlates(pal, idx) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('One Structure, Eleven Palettes').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('One Structure, Eleven Palettes').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 20').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('One Structure, Eleven Palettes', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 20', plateX + 14, plateY + 7 + titlePx + 3);
  var line1 = (idx + 1) + ' · ' + pal.name;
  var line2 = pal.kind + ' · palette ' + (idx + 1) + ' of 11';
  ctx.font = smallPx + 'px monospace';
  var palW = Math.max(ctx.measureText(line1).width, ctx.measureText(line2).width);
  var palPlateW = palW + 28;
  var palPlateH = smallPx * 2 + 20;
  var palX = 12, palY = VH - palPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(palX, palY, palPlateW, palPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(palX + 0.5, palY + 0.5, palPlateW - 1, palPlateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.fillText(line1, palX + 14, palY + 7);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(line2, palX + 14, palY + 7 + smallPx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintX = VW - hintPlateW - 12;
  var hintY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintX, hintY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintX + 0.5, hintY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintX + 12, hintY + 7);
}
function draw(t) {
  size();
  var idx = paletteIndexAt(t);
  var pal = PALETTES[idx];
  var F = fieldRect();
  ctx.fillStyle = rgbStr(pal.ground);
  ctx.fillRect(0, 0, VW, VH);
  var i;
  for (i = 0; i < leaves.length; i++) drawBlock(leaves[i], F, pal);
  drawPlates(pal, idx);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    leafCount: function () { return leaves.length; },
    paletteName: function (t) { return PALETTES[paletteIndexAt(t)].name; },
    paletteIndex: function (t) { return paletteIndexAt(t); }
  };
}
/* ---- frame one: t = FIRST_T, palette 1 of 11, Mustard and Red ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
