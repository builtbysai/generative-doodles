<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closed Circle of Worship</title>
<style>
  html, body { margin: 0; padding: 0; background: #0D0C0A; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1229 "Closed Circle of Worship" - Leslie Supnet study LS6.
   Three chalk rings turning in stepped polyrhythm (12 / 8 / 5) on aged
   black paper, sigils redrawing between the rings, a still void at the
   center. Strokes only. Silent. Seeded hashes only, never the JS random source. */

var T0 = 26;                 /* fixed first-frame phase, seconds */
var PAPER = '#0D0C0A';
var CHALK = '#E5D9BE';
var RED   = '#8E2323';
var SULFUR= '#D8A020';
var BLUE  = '#2E3E5A';
var TAU = Math.PI * 2;

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0;

/* ---------- seeded hash ---------- */
function ihash(a, b, c) {
  var x = (a * 374761393 + b * 668265263 + c * 2246822519) | 0;
  x = (x ^ (x >>> 13)) | 0;
  x = Math.imul(x, 1274126177);
  x = (x ^ (x >>> 16)) >>> 0;
  return x / 4294967296;
}

/* ---------- sizing: Visual Viewport API ---------- */
function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function isPhone() {
  var s = window.screen;
  if (s && Math.min(s.width, s.height) < 700) return true;
  return H > W * 1.15;
}
window.addEventListener('resize', function () { resize(); draw(pieceNow()); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceNow()); });
resize();

function layout() {
  var R = Math.min(W, H) * 0.5 * (isPhone() ? 0.96 : 0.94);
  return { cx: W / 2, cy: H / 2, R: R };
}

/* ---------- time ---------- */
var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
function pieceNow() {
  if (typeof performance === 'undefined' || !performance.now) return T0;
  return T0 + (performance.now() - startStamp) / 1000;
}

/* ---------- interaction state ---------- */
var sigilSalt = 0;           /* incremented by double-tap */
var drag = null;             /* {startAng, base, offset} while held on the outer ring */
var releaseAnim = null;      /* {t, from} snap-back after release */
var lastDownAt = -10;

function outerOffsetAt(t) {
  if (drag) return drag.offset;
  if (releaseAnim) {
    var k = Math.floor((t - releaseAnim.t) / 0.15);
    if (k >= 3) return 0;
    if (k < 0) k = 0;
    return releaseAnim.from * (3 - k) / 3;
  }
  return 0;
}
function wrapPi(a) {
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  return a;
}
function pointerAngle(e) {
  var L = layout();
  var x = (e.clientX !== undefined ? e.clientX : 0) - L.cx;
  var y = (e.clientY !== undefined ? e.clientY : 0) - L.cy;
  return { ang: Math.atan2(y, x), rad: Math.sqrt(x * x + y * y), R: L.R };
}
canvas.addEventListener('pointerdown', function (e) {
  var now = pieceNow();
  if (now - lastDownAt < 0.35) { sigilSalt += 1; }   /* double-tap: redraw the sigils */
  lastDownAt = now;
  var p = pointerAngle(e);
  if (p.rad > 0.76 * p.R && p.rad < 1.04 * p.R) {
    drag = { startAng: p.ang, base: outerOffsetAt(now), offset: outerOffsetAt(now) };
    releaseAnim = null;
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var p = pointerAngle(e);
  drag.offset = wrapPi(drag.base + wrapPi(p.ang - drag.startAng));
});
function endDrag() {
  if (!drag) return;
  releaseAnim = { t: pieceNow(), from: drag.offset };
  drag = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ---------- stepped ring angles ---------- */
/* Step index is a pure function of t; the first 0.05 s of each step the
   drawing sits +1.5 degrees past its mark - the drawn-frame snap. */
function ringAngle(t, stepDur, steps) {
  var idx = Math.floor(t / stepDur);
  var phase = t - idx * stepDur;
  var over = phase < 0.05 ? (1.5 * Math.PI / 180) : 0;
  return idx * (TAU / steps) + over;
}

/* ---------- hand-drawn stroke helpers ---------- */
/* Every vertex is perturbed by a hash of (seed, boil, vertex): the lines
   boil at the step rate, never flow. One beginPath per shape. */
function jpt(seed, boil, i, x, y, amp) {
  return [x + (ihash(seed, boil, i * 2) - 0.5) * 2 * amp,
          y + (ihash(seed, boil, i * 2 + 1) - 0.5) * 2 * amp];
}
function jline(seed, boil, pts, amp) {
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    var p = jpt(seed, boil, i, pts[i][0], pts[i][1], amp);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
}
function jring(seed, boil, r, seg) {
  ctx.beginPath();
  for (var i = 0; i <= seg; i++) {
    var a = i / seg * TAU;
    var p = jpt(seed, boil, i, Math.cos(a) * r, Math.sin(a) * r, r * 0.006 + 0.5);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
}

/* ---------- units (local frame: +y points outward, +x tangential) ---------- */
function drawPyramid(seed, boil, s, color) {
  ctx.strokeStyle = color;
  var h = s * 1.05, b = s * 0.62;
  jline(seed, boil, [[0, h], [-b, -h * 0.55], [b, -h * 0.55], [0, h]], s * 0.045);
  jline(seed + 5, boil, [[-b * 0.62, -h * 0.08], [b * 0.62, -h * 0.08]], s * 0.04);
  jline(seed + 9, boil, [[-b * 0.34, h * 0.34], [b * 0.34, h * 0.34]], s * 0.04);
}
function drawCrescent(seed, boil, s, color) {
  ctx.strokeStyle = color;
  /* True two-circle crescent: outer circle radius s; bite circle radius
     0.78s offset +0.34s outward. Cusps computed from the intersection,
     so both arcs meet exactly. Body bulges inward, horns point outward. */
  var d = 0.34 * s, r2 = 0.78 * s;
  var cy = (s * s - r2 * r2 + d * d) / (2 * d);
  var cxp = Math.sqrt(Math.max(0, s * s - cy * cy));
  var aR = Math.atan2(cy, cxp), aL = Math.atan2(cy, -cxp);
  var pts = [], i, a;
  for (i = 0; i <= 16; i++) {           /* outer arc: left cusp, the long way through -y, to right cusp */
    a = aL + (i / 16) * (aR + TAU - aL);
    pts.push([Math.cos(a) * s, Math.sin(a) * s]);
  }
  var bR = Math.atan2(cy - d, cxp), bL = Math.atan2(cy - d, -cxp);
  var sweep = TAU - (bL - bR);
  for (i = 1; i <= 12; i++) {           /* bite arc: right cusp down through the bite bottom to left cusp */
    a = bR - (i / 12) * sweep;
    pts.push([Math.cos(a) * r2, d + Math.sin(a) * r2]);
  }
  jline(seed, boil, pts, s * 0.04);
}
function drawEye(seed, boil, s, irisColor) {
  var pts = [], i;
  for (i = 0; i <= 8; i++) {            /* upper lid */
    var x = -s + i * (2 * s / 8);
    pts.push([x, Math.sin(i / 8 * Math.PI) * s * 0.52]);
  }
  jline(seed, boil, pts, s * 0.04);
  pts = [];
  for (i = 0; i <= 8; i++) {            /* lower lid, shallower */
    var x2 = -s + i * (2 * s / 8);
    pts.push([x2, -Math.sin(i / 8 * Math.PI) * s * 0.30]);
  }
  jline(seed + 3, boil, pts, s * 0.04);
  ctx.strokeStyle = irisColor;
  ctx.beginPath();                      /* iris */
  for (i = 0; i <= 12; i++) {
    var a = i / 12 * TAU;
    var p = jpt(seed + 7, boil, i, Math.cos(a) * s * 0.30, Math.sin(a) * s * 0.30, s * 0.03);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
  ctx.beginPath();                      /* pupil: small stroked circle */
  for (i = 0; i <= 8; i++) {
    var a2 = i / 8 * TAU;
    var p2 = jpt(seed + 11, boil, i, Math.cos(a2) * s * 0.10, Math.sin(a2) * s * 0.10, s * 0.02);
    if (i === 0) ctx.moveTo(p2[0], p2[1]); else ctx.lineTo(p2[0], p2[1]);
  }
  ctx.stroke();
}
/* Abstracted goat profile: a horn spiral, a brow bar, an angular jaw and a
   beard zigzag. Pure ritual geometry - no animal is depicted. */
function drawGoatMotif(seed, boil, s, color) {
  ctx.strokeStyle = color;
  var pts = [], i, a, r;
  for (i = 0; i <= 12; i++) {           /* horn curve: tightening arc */
    a = (200 + i * (360 / 12)) * Math.PI / 180;
    r = s * (0.52 - i * 0.030);
    pts.push([Math.cos(a) * r - s * 0.05, Math.sin(a) * r + s * 0.28]);
  }
  jline(seed, boil, pts, s * 0.035);
  jline(seed + 4, boil, [[-s * 0.48, s * 0.02], [s * 0.34, s * 0.20], [s * 0.46, s * 0.02]], s * 0.035); /* brow + ear tick */
  jline(seed + 8, boil, [[s * 0.34, s * 0.20], [s * 0.44, -s * 0.22], [s * 0.06, -s * 0.52], [-s * 0.30, -s * 0.44]], s * 0.035); /* jaw */
  jline(seed + 12, boil, [[-s * 0.02, -s * 0.50], [s * 0.06, -s * 0.66], [s * 0.14, -s * 0.50]], s * 0.03); /* beard zigzag */
}
function drawSigil(seed, boil, cs) {
  /* seeded random walk inside the cell, steered back when it strays */
  var pts = [[0, 0]], x = 0, y = 0, ang = ihash(seed, boil, 99) * TAU;
  for (var i = 0; i < 9; i++) {
    ang += (ihash(seed, boil, i) - 0.5) * 1.9;
    var len = cs * (0.24 + ihash(seed, boil, i + 40) * 0.16);
    x += Math.cos(ang) * len;
    y += Math.sin(ang) * len;
    var d = Math.sqrt(x * x + y * y);
    if (d > cs * 0.85) { x *= (cs * 0.85) / d; y *= (cs * 0.85) / d; ang += Math.PI * 0.8; }
    pts.push([x, y]);
  }
  jline(seed, boil, pts, cs * 0.05);
  /* a cross-tick at the walk's end, like a signature mark */
  var e = pts[pts.length - 1];
  jline(seed + 21, boil, [[e[0] - cs * 0.10, e[1]], [e[0] + cs * 0.10, e[1]]], cs * 0.04);
}

/* ---------- the drawing ---------- */
function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var L = layout(), cx = L.cx, cy = L.cy, R = L.R;
  var boil = Math.floor(t * 2);

  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  /* aged paper: faint seeded speckle and fibre flecks, static hash field */
  var i, x, y;
  for (i = 0; i < 420; i++) {
    x = ihash(i, 7, 1) * W; y = ihash(i, 7, 2) * H;
    ctx.fillStyle = ihash(i, 7, 3) > 0.5 ? 'rgba(229,217,190,0.05)' : 'rgba(0,0,0,0.16)';
    ctx.fillRect(x, y, 1.4, 1.4);
  }

  var rOuter = R * 0.885, rSigil = R * 0.715, rMid = R * 0.565, rInner = R * 0.385, rVoid = R * 0.235;
  ctx.lineWidth = Math.max(1.1, R * 0.0035);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  ctx.save();
  ctx.translate(cx, cy);

  /* faint band dividers */
  ctx.strokeStyle = 'rgba(229,217,190,0.20)';
  ctx.lineWidth = Math.max(0.8, R * 0.0018);
  var divs = [0.985, 0.795, 0.645, 0.475, 0.295];
  for (i = 0; i < divs.length; i++) jring(900 + i * 13, boil, R * divs[i], 64);
  ctx.lineWidth = Math.max(1.1, R * 0.0035);

  /* --- OUTER RING: 12 steps / 60 s, pyramids + crescents alternating --- */
  var aOuter = ringAngle(t, 5, 12) + outerOffsetAt(t);
  for (i = 0; i < 12; i++) {
    var a = aOuter + i * TAU / 12;
    ctx.save();
    ctx.translate(Math.cos(a) * rOuter, Math.sin(a) * rOuter);
    ctx.rotate(a - Math.PI / 2);         /* local +y points outward, +x tangential */
    var col = (i === 0) ? RED : CHALK;
    if (i % 2 === 0) drawPyramid(100 + i * 17, boil, R * 0.085, col);
    else drawCrescent(100 + i * 17, boil, R * 0.080, col);
    ctx.restore();
  }
  /* sulfur tick marks on the outer band, one per step position */
  ctx.strokeStyle = SULFUR;
  for (i = 0; i < 12; i++) {
    var ta = aOuter + i * TAU / 12;
    jline(700 + i, boil, [[Math.cos(ta) * R * 0.955, Math.sin(ta) * R * 0.955],
                          [Math.cos(ta) * R * 0.985, Math.sin(ta) * R * 0.985]], 0.6);
  }

  /* --- SIGIL BAND: 10 sigils, walk index = floor(outerStep/8) + salt --- */
  var outerStep = Math.floor(t / 5);
  var walk = Math.floor(outerStep / 8) + sigilSalt;
  ctx.strokeStyle = SULFUR;
  ctx.lineWidth = Math.max(1.0, R * 0.0028);
  for (i = 0; i < 10; i++) {
    var sa = i * TAU / 10 + outerStep * (TAU / 24); /* sigils drift at half the outer ring's rate, stepped */
    ctx.save();
    ctx.translate(Math.cos(sa) * rSigil, Math.sin(sa) * rSigil);
    ctx.rotate(sa - Math.PI / 2);
    if (i === 3) ctx.strokeStyle = RED; else ctx.strokeStyle = SULFUR;
    drawSigil(300 + i * 31, walk, R * 0.082);
    ctx.restore();
  }
  ctx.lineWidth = Math.max(1.1, R * 0.0035);

  /* --- MIDDLE RING: 8 steps / 60 s, eyes in deep blue only --- */
  var aMid = ringAngle(t, 7.5, 8);
  for (i = 0; i < 8; i++) {
    var ma = aMid + i * TAU / 8;
    ctx.save();
    ctx.translate(Math.cos(ma) * rMid, Math.sin(ma) * rMid);
    ctx.rotate(ma - Math.PI / 2);
    ctx.strokeStyle = BLUE;
    drawEye(500 + i * 19, boil, R * 0.072, (i === 0) ? RED : BLUE);
    ctx.restore();
  }

  /* --- INNER RING: 5 steps / 60 s, abstracted goat-profile motifs --- */
  var aInner = ringAngle(t, 12, 5);
  for (i = 0; i < 5; i++) {
    var ia = aInner + i * TAU / 5;
    ctx.save();
    ctx.translate(Math.cos(ia) * rInner, Math.sin(ia) * rInner);
    ctx.rotate(ia - Math.PI / 2);
    drawGoatMotif(600 + i * 23, boil, R * 0.088, (i === 0) ? RED : CHALK);
    ctx.restore();
  }

  /* --- THE VOID: paper disc, double chalk boundary, nothing inside --- */
  ctx.beginPath();
  ctx.arc(0, 0, rVoid, 0, TAU);
  ctx.fillStyle = PAPER;
  ctx.fill();
  ctx.strokeStyle = CHALK;
  jring(950, boil, rVoid, 56);
  ctx.strokeStyle = 'rgba(229,217,190,0.55)';
  jring(977, boil, rVoid * 0.93, 56);

  ctx.restore();
}

/* ---------- run ---------- */
draw(T0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    draw(pieceNow());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
