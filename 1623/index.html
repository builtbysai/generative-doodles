<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WCC 214</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EFE6; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F2EFE6';
var INK = '#2B4C7E';
var DIM = '#6B6A63';
var PHASE = 1.0;
var FADE_S = 0.8;
var WEEK_S = 604800; /* one week, in seconds: the drift period */
var SEED = 1623007;
var STORE_KEY = 'doodle-1623';
/* Week epoch: Monday 2026-11-02 00:00 UTC. Week 214 is the week of this
   build; later weeks advance one per calendar week from this anchor. */
var EPOCH_MS = Date.UTC(2026, 10, 2, 0, 0, 0);
var WEEK_MS = 7 * 86400000;
var DAY_MS = 86400000;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
/* Deterministic hash for hand jitter: pure function of position, so the
   jitter is identical on every frame and every render. */
function hash2(i, j, k) {
  var s = Math.sin(i * 127.1 + j * 311.7 + k * 74.7) * 43758.5453;
  return s - Math.floor(s);
}

/* ---- constraints: the header is a contract ---- */
var CONSTRAINTS = [
  { label: 'NO NOISE, HAND-DRAWN ONLY', ink: '#2B4C7E', gen: 'contour' },
  { label: 'ONLY CIRCLES', ink: '#B3402A', gen: 'circles' },
  { label: 'ONE COLOR', ink: '#2E5B3E', gen: 'grid' },
  { label: 'VERA MOLNAR GRIDS', ink: '#5B2E5E', gen: 'molnar' },
  { label: 'NO STRAIGHT LINES', ink: '#222222', gen: 'wobbly' }
];
function constraintFor(week) {
  var idx = ((week - 214) % 5 + 5) % 5;
  return CONSTRAINTS[idx];
}
function calendarWeek() {
  var w = 214 + Math.floor((Date.now() - EPOCH_MS) / WEEK_MS);
  return w < 214 ? 214 : w;
}
function daysLeft() {
  var d = Math.floor((Date.now() - EPOCH_MS) / DAY_MS);
  if (d < 0) d = 0;
  return 7 - (d % 7);
}
function urlWeek() {
  try {
    if (typeof location === 'undefined' || !location.search) return 0;
    var m = location.search.match(/[?&]week=(\d+)/);
    if (!m) return 0;
    var w = parseInt(m[1], 10);
    return (w >= 214 && w < 1000) ? w : 0;
  } catch (e) { return 0; }
}
function loadStoredWeek() {
  if (typeof localStorage === 'undefined') return 0;
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return 0;
    var st = JSON.parse(raw);
    return (st && typeof st.week === 'number') ? st.week : 0;
  } catch (e) { return 0; }
}
function saveWeek(w) {
  if (typeof localStorage === 'undefined') return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ week: w })); } catch (e) { /* storage unavailable: week still advances in memory */ }
}
function effectiveWeek() {
  var uw = urlWeek();
  if (uw) return uw;
  var cal = calendarWeek();
  var stored = loadStoredWeek();
  return (stored >= cal && stored > 0) ? stored : cal;
}

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Centered square sheet; on phones the sheet is the full viewport. */
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.86;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* Header strip at the top of the sheet; the composition fills the rest. */
function headerRect(rect) {
  if (isPhone) return { x: rect.x, y: 56, w: rect.w, h: 66 };
  var hh = Math.max(76, rect.h * 0.12);
  return { x: rect.x, y: rect.y, w: rect.w, h: hh };
}
function fieldRect(rect, head) {
  if (isPhone) {
    return { x: rect.x, y: head.y + head.h, w: rect.w, h: VH - 40 - (head.y + head.h) };
  }
  return { x: rect.x, y: head.y + head.h, w: rect.w, h: rect.y + rect.h - (head.y + head.h) };
}

/* ---- per-week parameters: pure seeded functions of the week index ---- */
var paramCache = {};
function genParams(week) {
  if (paramCache[week]) return paramCache[week];
  var c = constraintFor(week);
  var rng = mulberry32((SEED + week * 7919) >>> 0);
  var p = { c: c, ink: hexRgb(c.ink) };
  var i, j;
  if (c.gen === 'contour') {
    p.ph = [rng() * TAU, rng() * TAU, rng() * TAU, rng() * TAU];
    p.levels = [];
    for (i = 0; i < 7; i++) p.levels.push(-1.8 + i * 0.6);
  } else if (c.gen === 'circles') {
    p.circles = [];
    var tries = 0;
    while (p.circles.length < 64 && tries < 600) {
      tries++;
      var cc = { fx: 0.06 + rng() * 0.88, fy: 0.06 + rng() * 0.88, fr: 0.02 + rng() * 0.065, fill: rng() < 0.35 };
      var ok = true;
      for (j = 0; j < p.circles.length; j++) {
        var o = p.circles[j];
        var dx = (cc.fx - o.fx), dy = (cc.fy - o.fy);
        var dd = Math.sqrt(dx * dx + dy * dy);
        if (dd < cc.fr + o.fr + 0.012) { ok = false; break; }
      }
      if (ok) p.circles.push(cc);
    }
  } else if (c.gen === 'grid') {
    p.cells = [];
    for (i = 0; i < 81; i++) {
      p.cells.push({
        skip: rng() < 0.12,
        jx: (rng() - 0.5) * 0.24, jy: (rng() - 0.5) * 0.24,
        s: 0.78 + rng() * 0.22, rot: (rng() - 0.5) * 0.12,
        a: 0.25 + rng() * 0.70
      });
    }
  } else if (c.gen === 'molnar') {
    p.pts = [];
    for (j = 0; j < 11; j++) {
      p.pts.push([]);
      for (i = 0; i < 11; i++) {
        p.pts[j].push({ dx: (rng() - 0.5) * 0.5, dy: (rng() - 0.5) * 0.5 });
      }
    }
    p.squares = [];
    for (i = 0; i < 3; i++) {
      p.squares.push({ cx: Math.floor(rng() * 9), cy: Math.floor(rng() * 9), rot: (rng() - 0.5) * 1.2 });
    }
  } else if (c.gen === 'wobbly') {
    p.cx = 0.5 + (rng() - 0.5) * 0.2;
    p.cy = 0.5 + (rng() - 0.5) * 0.2;
    p.rings = [];
    for (i = 0; i < 5; i++) {
      p.rings.push({ r: 0.09 + i * 0.0675, ph: [rng() * TAU, rng() * TAU, rng() * TAU] });
    }
    p.curves = [];
    for (i = 0; i < 4; i++) {
      p.curves.push({ x0: 0.25 + rng() * 0.5, y0: 0.25 + rng() * 0.5, ang: rng() * TAU, len: 0.18 + rng() * 0.14, ph: [rng() * TAU, rng() * TAU] });
    }
  }
  paramCache[week] = p;
  return p;
}

/* ---- generators: each one obeys its own constraint ---- */
function drift(t) { return Math.sin(TAU * t / WEEK_S); }

function drawContour(p, f, t, alphaMul) {
  var NX = 48, NY = 48, li, i, j;
  var du = 0.02 * drift(t), dv = 0.015 * Math.cos(TAU * t / WEEK_S);
  var vals = [], u, v;
  for (j = 0; j <= NY; j++) {
    vals.push([]);
    for (i = 0; i <= NX; i++) {
      u = i / NX + du; v = j / NY + dv;
      vals[j].push(
        Math.sin(TAU * (1.3 * u + 0.4 * v) + p.ph[0]) +
        0.7 * Math.sin(TAU * (0.6 * u - 1.1 * v) + p.ph[1]) +
        0.5 * Math.sin(TAU * (1.7 * u + 1.7 * v) + p.ph[2]) +
        0.35 * Math.sin(TAU * (2.3 * u - 0.9 * v) + p.ph[3])
      );
    }
  }
  var cw = f.w / NX, ch = f.h / NY;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (li = 0; li < p.levels.length; li++) {
    var L = p.levels[li];
    var segs = [];
    for (j = 0; j < NY; j++) {
      for (i = 0; i < NX; i++) {
        var va = vals[j][i], vb = vals[j][i + 1], vc = vals[j + 1][i + 1], vd = vals[j + 1][i];
        var idx = (va > L ? 8 : 0) + (vb > L ? 4 : 0) + (vc > L ? 2 : 0) + (vd > L ? 1 : 0);
        if (idx === 0 || idx === 15) continue;
        var x0 = f.x + i * cw, y0 = f.y + j * ch;
        function edgePt(a, b, xa, ya, xb, yb) {
          var k = (L - a) / (b - a);
          if (k < 0) k = 0; if (k > 1) k = 1;
          return { x: xa + (xb - xa) * k, y: ya + (yb - ya) * k };
        }
        var top = edgePt(va, vb, x0, y0, x0 + cw, y0);
        var right = edgePt(vb, vc, x0 + cw, y0, x0 + cw, y0 + ch);
        var bottom = edgePt(vd, vc, x0, y0 + ch, x0 + cw, y0 + ch);
        var left = edgePt(va, vd, x0, y0, x0, y0 + ch);
        var pairs = [];
        if (idx === 1 || idx === 14) pairs.push([left, bottom]);
        else if (idx === 2 || idx === 13) pairs.push([bottom, right]);
        else if (idx === 3 || idx === 12) pairs.push([left, right]);
        else if (idx === 4 || idx === 11) pairs.push([top, right]);
        else if (idx === 6 || idx === 9) pairs.push([top, bottom]);
        else if (idx === 7 || idx === 8) pairs.push([top, left]);
        else if (idx === 5) { pairs.push([top, left]); pairs.push([bottom, right]); }
        else if (idx === 10) { pairs.push([top, right]); pairs.push([bottom, left]); }
        var q;
        for (q = 0; q < pairs.length; q++) {
          var a2 = pairs[q][0], b2 = pairs[q][1];
          var jx1 = (hash2(i, j, li * 4 + q) - 0.5) * 2.4;
          var jy1 = (hash2(j, i, li * 4 + q + 1) - 0.5) * 2.4;
          var jx2 = (hash2(i, j, li * 4 + q + 2) - 0.5) * 2.4;
          var jy2 = (hash2(j, i, li * 4 + q + 3) - 0.5) * 2.4;
          segs.push([a2.x + jx1, a2.y + jy1, b2.x + jx2, b2.y + jy2]);
        }
      }
    }
    /* Main pass, then a faint offset pass: the hand-drawn double stroke. */
    var pass, s;
    for (pass = 0; pass < 2; pass++) {
      ctx.beginPath();
      for (s = 0; s < segs.length; s++) {
        var sg = segs[s];
        var ox = pass === 0 ? 0 : 0.9, oy = pass === 0 ? 0 : -0.7;
        ctx.moveTo(sg[0] + ox, sg[1] + oy);
        ctx.lineTo(sg[2] + ox, sg[3] + oy);
      }
      ctx.strokeStyle = rgba(p.ink, (pass === 0 ? 0.85 : 0.35) * alphaMul);
      ctx.lineWidth = Math.max(1, f.w * 0.0022);
      ctx.stroke();
    }
  }
}

function drawCircles(p, f, t, alphaMul) {
  var m = Math.min(f.w, f.h);
  var scale = 1 + 0.02 * drift(t);
  var i, cc;
  ctx.lineCap = 'round';
  for (i = 0; i < p.circles.length; i++) {
    cc = p.circles[i];
    var cx = f.x + cc.fx * f.w, cy = f.y + cc.fy * f.h, r = cc.fr * m * scale;
    ctx.beginPath();
    ctx.moveTo(cx + r, cy);
    ctx.arc(cx, cy, r, 0, TAU);
    if (cc.fill) {
      ctx.fillStyle = rgba(p.ink, 0.10 * alphaMul);
      ctx.fill();
    }
    ctx.strokeStyle = rgba(p.ink, 0.85 * alphaMul);
    ctx.lineWidth = Math.max(1, f.w * 0.002);
    ctx.stroke();
  }
}

function drawGrid(p, f, t, alphaMul) {
  var n = 9, cw = f.w / n, ch = f.h / n, i, cell;
  var dr = 0.01 * drift(t);
  for (i = 0; i < 81; i++) {
    cell = p.cells[i];
    if (cell.skip) continue;
    var col = i % n, row = Math.floor(i / n);
    var cx = f.x + (col + 0.5 + cell.jx) * cw;
    var cy = f.y + (row + 0.5 + cell.jy) * ch;
    var s = Math.min(cw, ch) * cell.s;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(cell.rot + dr);
    ctx.fillStyle = rgba(p.ink, cell.a * alphaMul);
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.restore();
  }
}

function drawMolnar(p, f, t, alphaMul) {
  var n = 10, cw = f.w / n, ch = f.h / n, i, j;
  var ds = 1 + 0.05 * drift(t);
  function pt(i2, j2) {
    var d = p.pts[j2][i2];
    return { x: f.x + (i2 * cw + d.dx * cw * ds), y: f.y + (j2 * ch + d.dy * ch * ds) };
  }
  ctx.strokeStyle = rgba(p.ink, 0.85 * alphaMul);
  ctx.lineWidth = Math.max(1, f.w * 0.002);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (j = 0; j <= n; j++) {
    ctx.beginPath();
    for (i = 0; i <= n; i++) {
      var q = pt(i, j);
      if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
    }
    ctx.stroke();
  }
  for (i = 0; i <= n; i++) {
    ctx.beginPath();
    for (j = 0; j <= n; j++) {
      var q2 = pt(i, j);
      if (j === 0) ctx.moveTo(q2.x, q2.y); else ctx.lineTo(q2.x, q2.y);
    }
    ctx.stroke();
  }
  for (i = 0; i < p.squares.length; i++) {
    var sq = p.squares[i];
    var a = pt(sq.cx, sq.cy), b = pt(sq.cx + 1, sq.cy), cc2 = pt(sq.cx + 1, sq.cy + 1), d2 = pt(sq.cx, sq.cy + 1);
    var mx = (a.x + b.x + cc2.x + d2.x) / 4, my = (a.y + b.y + cc2.y + d2.y) / 4;
    var s = Math.min(cw, ch) * 0.55;
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(sq.rot);
    ctx.strokeStyle = rgba(p.ink, 0.9 * alphaMul);
    ctx.lineWidth = Math.max(1.2, f.w * 0.0024);
    ctx.strokeRect(-s / 2, -s / 2, s, s);
    ctx.restore();
  }
}

function drawWobbly(p, f, t, alphaMul) {
  var m = Math.min(f.w, f.h);
  var cx = f.x + p.cx * f.w, cy = f.y + p.cy * f.h;
  var ph = 0.15 * drift(t);
  ctx.strokeStyle = rgba(p.ink, 0.85 * alphaMul);
  ctx.lineWidth = Math.max(1, f.w * 0.0022);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  var i, k;
  for (i = 0; i < p.rings.length; i++) {
    var rg = p.rings[i];
    var SEG = 72;
    ctx.beginPath();
    for (k = 0; k <= SEG; k++) {
      var ang = (k / SEG) * TAU;
      var rr = rg.r * (1 + 0.12 * Math.sin(3 * ang + rg.ph[0] + ph) + 0.08 * Math.sin(5 * ang + rg.ph[1] + ph) + 0.05 * Math.sin(8 * ang + rg.ph[2] + ph));
      var px = cx + rr * f.w * Math.cos(ang), py = cy + rr * f.h * Math.sin(ang);
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  for (i = 0; i < p.curves.length; i++) {
    var cv = p.curves[i];
    var x0 = f.x + cv.x0 * f.w, y0 = f.y + cv.y0 * f.h;
    var SEG2 = 48;
    ctx.beginPath();
    for (k = 0; k <= SEG2; k++) {
      var kk = k / SEG2;
      var along = kk * cv.len * m;
      var wob = 0.015 * m * Math.sin(2 * kk * TAU + cv.ph[0]) + 0.008 * m * Math.sin(5 * kk * TAU + cv.ph[1]);
      var px2 = x0 + Math.cos(cv.ang) * along - Math.sin(cv.ang) * wob;
      var py2 = y0 + Math.sin(cv.ang) * along + Math.cos(cv.ang) * wob;
      if (k === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.stroke();
  }
}

function drawWeek(week, f, t, alphaMul) {
  var p = genParams(week);
  ctx.save();
  if (p.c.gen === 'contour') drawContour(p, f, t, alphaMul);
  else if (p.c.gen === 'circles') drawCircles(p, f, t, alphaMul);
  else if (p.c.gen === 'grid') drawGrid(p, f, t, alphaMul);
  else if (p.c.gen === 'molnar') drawMolnar(p, f, t, alphaMul);
  else drawWobbly(p, f, t, alphaMul);
  ctx.restore();
}

/* Hand-drawn wobbly rule under the header: straight in no week. */
function drawRule(x0, x1, y, week, alphaMul) {
  var rng = mulberry32((SEED + week * 7919 + 5) >>> 0);
  var ph = rng() * TAU;
  ctx.beginPath();
  var SEG = 40, k;
  for (k = 0; k <= SEG; k++) {
    var px = x0 + (x1 - x0) * (k / SEG);
    var py = y + 1.2 * Math.sin(3 * (k / SEG) * TAU + ph);
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.strokeStyle = rgba(hexRgb(INK), 0.5 * alphaMul);
  ctx.lineWidth = 1;
  ctx.stroke();
}

var curWeek = effectiveWeek();
var prevWeek = null;
var fadeStart = -1e9;

function onTap() {
  prevWeek = curWeek;
  curWeek = curWeek + 1;
  fadeStart = lastT;
  saveWeek(curWeek);
  draw(lastT);
}

function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  var head = headerRect(rect);
  var f = fieldRect(rect, head);
  var titlePx = isPhone ? 16 : 18;
  var smallPx = isPhone ? 11 : 12;
  var titleY, dateY, hintY;
  if (isPhone) {
    titleY = 14;
    dateY = 14 + titlePx + 4;
    hintY = VH - smallPx - 12;
  } else {
    titleY = rect.y - titlePx - smallPx - 10;
    dateY = rect.y - smallPx - 6;
    hintY = rect.y + rect.h + 12;
  }
  /* Title and formula date. */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = INK;
  ctx.fillText('WCC 214', rect.x + rect.w / 2, titleY);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(hexRgb(INK), 0.65);
  ctx.fillText('2006 · 06 · 22', rect.x + rect.w / 2, dateY);
  /* Header strip: week, constraint, days remaining. */
  var c = constraintFor(curWeek);
  var cxm = rect.x + rect.w / 2;
  var weekPx = isPhone ? 16 : 19;
  var conPx = isPhone ? 11 : 13;
  var dayPx = isPhone ? 11 : 12;
  var hy = head.y + (isPhone ? 6 : 10);
  ctx.font = 'bold ' + weekPx + 'px monospace';
  ctx.fillStyle = c.ink;
  ctx.fillText('WEEK ' + curWeek, cxm, hy);
  hy += weekPx + 5;
  ctx.font = conPx + 'px monospace';
  ctx.fillStyle = INK;
  ctx.fillText(c.label, cxm, hy);
  hy += conPx + 4;
  var dl = daysLeft();
  ctx.font = dayPx + 'px monospace';
  ctx.fillStyle = rgba(hexRgb(DIM), 0.9);
  ctx.fillText(dl === 1 ? '1 DAY LEFT' : dl + ' DAYS LEFT', cxm, hy);
  drawRule(rect.x + rect.w * 0.08, rect.x + rect.w * 0.92, head.y + head.h - 6, curWeek, 1);
  /* Composition, clipped to the field, edge to edge. */
  ctx.save();
  ctx.beginPath();
  ctx.rect(f.x, f.y, f.w, f.h);
  ctx.clip();
  var pr = clamp((t - fadeStart) / FADE_S, 0, 1);
  var sp = smooth(pr);
  if (prevWeek !== null && pr < 1) {
    drawWeek(prevWeek, f, t, 1 - sp);
  }
  drawWeek(curWeek, f, t, sp);
  ctx.restore();
  /* Hint. */
  ctx.textAlign = 'center';
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(hexRgb(INK), 0.7);
  ctx.fillText("Tap for next week's constraint.", rect.x + rect.w / 2, hintY);
}
if (typeof canvas.addEventListener === 'function') canvas.addEventListener('pointerdown', onTap);
