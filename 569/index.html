<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una Libreta de Salas de Espera</title>
<style>
  html, body { margin:0; padding:0; background:#F4EEDC; height:100%; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var INK = '#1A1A1A', PAPER = '#F4EEDC', GREY = '#B9B4A6';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ---------------- data ---------------- */
  var NOTES = [
    'Retiro 14:20',
    'hospital',
    'se durmió',
    'espera larga',
    'zapatos blancos',
    'turno 47',
    'ojos cerrados'
  ];
  var NV = NOTES.length;

  /* ---------------- state ---------------- */
  var vw = 0, vh = 0, dpr = 1;
  var offset = 0;          // strip scroll offset in px (<= small positive)
  var vel = 0;             // inertia velocity px/s
  var selected = -1;       // tapped vignette index, -1 none
  var lift = 0;            // 0..1 lift animation for the selected vignette
  var dragging = false, dragMoved = 0, lastX = 0, downX = 0, downT = 0;
  var startTime = -1, lastTick = -1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return vh > vw * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    vw = vv ? vv.width : window.innerWidth;
    vh = vv ? vv.height : window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    clampOffset();
    draw(0);
  }

  /* ---------------- layout ---------------- */
  // design space per vignette: 250 wide x 360 tall
  function layout() {
    var phone = isPhone();
    var vigH = clamp(vh * (phone ? 0.56 : 0.54), 290, 440);
    var s = vigH / 360;
    var vigW = 250 * s;
    var contentW = vigW * NV;
    var stripTop = (vh - vigH) / 2 - vh * 0.045;
    return { s: s, vigW: vigW, vigH: vigH, contentW: contentW, stripTop: stripTop };
  }
  function clampOffset() {
    var L = layout();
    if (L.contentW <= vw) { offset = (vw - L.contentW) / 2; vel = 0; return; }
    var min = vw - L.contentW - 24, max = 24;
    if (offset < min) { offset = min; vel = 0; }
    if (offset > max) { offset = max; vel = 0; }
  }

  /* ---------------- drawing helpers ---------------- */
  function line(x1, y1, x2, y2) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }

  // hand-lettered text: per-letter seeded jitter, deterministic
  function handText(text, cx, y, size, seedExtra) {
    ctx.save();
    ctx.fillStyle = INK;
    ctx.strokeStyle = INK;
    ctx.font = 'italic 600 ' + size + 'px "Segoe Print","Bradley Hand","Comic Sans MS",cursive';
    ctx.textBaseline = 'middle';
    var widths = [], total = 0, i, w;
    for (i = 0; i < text.length; i++) {
      w = ctx.measureText(text[i]).width;
      widths.push(w); total += w + size * 0.04;
    }
    total -= size * 0.04;
    var x = cx - total / 2;
    var seed = hashStr(text) ^ (seedExtra | 0);
    for (i = 0; i < text.length; i++) {
      var r = mulberry32(seed + i * 7919);
      var jx = (r() - 0.5) * size * 0.09;
      var jy = (r() - 0.5) * size * 0.14;
      var rot = (r() - 0.5) * 0.11;
      ctx.save();
      ctx.translate(x + widths[i] / 2 + jx, y + jy);
      ctx.rotate(rot);
      ctx.fillText(text[i], -widths[i] / 2, 0);
      ctx.restore();
      x += widths[i] + size * 0.04;
    }
    ctx.restore();
  }

  /* ------- figures (design coords, ground GY=308, chair seat SY=234) ------- */
  var GY = 308;

  function chair(cx, seatY) {
    ctx.save();
    ctx.fillStyle = GREY;
    rr(cx - 33, seatY - 76, 66, 72, 11); ctx.fill();      // backrest
    rr(cx - 38, seatY - 5, 76, 12, 5); ctx.fill();       // seat
    ctx.fillRect(cx - 33, seatY + 7, 7, GY - seatY - 7);  // legs
    ctx.fillRect(cx + 26, seatY + 7, 7, GY - seatY - 7);
    ctx.restore();
  }

  function head(x, y, r, hair, eyes) {
    ctx.save();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    circle(x, y, r); ctx.stroke();
    // face: two dots and a line, her economy
    ctx.fillStyle = INK;
    if (eyes === 'closed') {
      line(x - r * 0.52, y + r * 0.05, x - r * 0.18, y + r * 0.05);
      line(x + r * 0.18, y + r * 0.05, x + r * 0.52, y + r * 0.05);
    } else if (eyes === 'down') {
      ctx.beginPath(); ctx.arc(x - r * 0.34, y + r * 0.16, 1.7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * 0.34, y + r * 0.16, 1.7, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(x - r * 0.34, y, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * 0.34, y, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    line(x - r * 0.22, y + r * 0.52, x + r * 0.22, y + r * 0.52); // mouth
    // hair
    if (hair === 'bald') {
      ctx.beginPath(); ctx.arc(x - r * 0.92, y + r * 0.1, r * 0.3, Math.PI * 0.4, Math.PI * 1.2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + r * 0.92, y + r * 0.1, r * 0.3, -Math.PI * 0.2, Math.PI * 0.6); ctx.stroke();
    } else if (hair === 'bun') {
      circle(x, y - r - 4, 6); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, r, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
    } else if (hair === 'short') {
      ctx.beginPath(); ctx.arc(x, y - r * 0.12, r * 0.94, Math.PI * 1.02, Math.PI * 1.98); ctx.stroke();
    } else if (hair === 'long') {
      ctx.beginPath(); ctx.arc(x, y - r * 0.12, r * 0.94, Math.PI * 1.02, Math.PI * 1.98); ctx.stroke();
      line(x - r * 0.95, y - r * 0.1, x - r * 1.0, y + r * 1.5);
      line(x + r * 0.95, y - r * 0.1, x + r * 1.0, y + r * 1.5);
    } else if (hair === 'spiky') {
      for (var k = -2; k <= 2; k++) line(x + k * r * 0.32, y - r * 0.85, x + k * r * 0.4, y - r * 1.25);
    }
    ctx.restore();
  }

  function seatedLegs(hipX, hipY, spread) {
    // thigh forward, shin down, shoe
    ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    var kx1 = hipX - spread, kx2 = hipX + spread;
    line(hipX - 6, hipY, kx1, hipY + 6);
    line(kx1, hipY + 6, kx1 + 2, GY - 4);
    line(kx1 - 3, GY - 2, kx1 + 13, GY - 2);
    line(hipX + 6, hipY, kx2, hipY + 6);
    line(kx2, hipY + 6, kx2 + 2, GY - 4);
    line(kx2 - 3, GY - 2, kx2 + 13, GY - 2);
    ctx.restore();
  }

  /* ------- scenes, drawn in local 250x360 space ------- */
  function scene0() { // old man with a newspaper
    var cx = 125, SY = 234;
    chair(cx, SY);
    ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    seatedLegs(cx, SY, 30);
    line(cx, 118, cx, SY); // torso
    head(cx, 97, 17, 'bald', 'down');
    // newspaper held in front
    ctx.fillStyle = PAPER; rr(84, 148, 82, 68, 3); ctx.fill(); ctx.stroke();
    line(125, 152, 125, 212);
    line(92, 166, 117, 166); line(92, 178, 117, 178); line(92, 190, 117, 190);
    line(133, 166, 158, 166); line(133, 178, 158, 178); line(133, 190, 158, 190);
    line(cx - 4, 122, 88, 158); line(cx + 4, 122, 162, 158); // arms to paper
    ctx.restore();
  }

  function scene1() { // woman, handbag on her lap
    var cx = 125, SY = 234;
    chair(cx, SY);
    ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    seatedLegs(cx, SY, 22);
    line(cx, 116, cx, SY);
    head(cx, 95, 16, 'bun', 'open');
    // bag on lap
    ctx.fillStyle = PAPER;
    ctx.beginPath();
    ctx.moveTo(97, 200); ctx.lineTo(153, 200); ctx.lineTo(147, 246); ctx.lineTo(103, 246); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, 200, 13, Math.PI, Math.PI * 2); ctx.stroke(); // handle
    line(cx - 3, 124, 104, 202); line(cx + 3, 124, 146, 202); // arms resting on bag
    ctx.restore();
  }

  function scene2() { // child asleep on a bag, chairs behind
    chair(72, 226); chair(178, 226);
    ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // big bag on the floor
    ctx.fillStyle = PAPER; rr(56, 252, 138, 54, 16); ctx.fill(); ctx.stroke();
    line(78, 252, 86, 306); line(172, 252, 164, 306); // strap seams
    // child curled on top of the bag
    ctx.beginPath();
    ctx.moveTo(96, 250);
    ctx.quadraticCurveTo(128, 232, 160, 246);
    ctx.quadraticCurveTo(178, 253, 186, 250);
    ctx.stroke();
    line(160, 246, 176, 262); line(176, 262, 188, 258); // tucked legs
    head(88, 240, 13, 'spiky', 'closed'); // head resting at the low end
    line(98, 246, 116, 252); // small arm draped
    ctx.restore();
  }

  function scene3() { // standing man, hands in pockets
    var cx = 125;
    ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    head(cx, 82, 16, 'short', 'open');
    line(cx, 102, cx, 208); // torso
    line(cx - 2, 118, 100, 158); line(100, 158, 117, 203); // arm into pocket
    line(cx + 2, 118, 150, 158); line(150, 158, 133, 203);
    line(cx - 4, 208, 110, GY - 4); line(110 - 3, GY - 2, 110 + 13, GY - 2); // legs
    line(cx + 4, 208, 142, GY - 4); line(142 - 3, GY - 2, 142 + 13, GY - 2);
    ctx.restore();
  }

  function scene4() { // a nurse's shoes passing (legs only, mid-stride)
    ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    line(58, 118, 196, 118); // crop line: the rest of her is out of frame
    // back leg, planted
    line(102, 118, 96, 208); line(96, 208, 82, 296);
    ctx.fillStyle = PAPER;
    ctx.beginPath(); // shoe
    ctx.moveTo(66, 296); ctx.lineTo(84, 296); ctx.lineTo(88, 306); ctx.lineTo(60, 306); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // front leg, mid-step, heel lifted
    line(152, 118, 162, 204); line(162, 204, 182, 282);
    ctx.beginPath();
    ctx.moveTo(172, 282); ctx.lineTo(190, 286); ctx.lineTo(196, 296); ctx.lineTo(170, 294); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // ID badge dangling from the crop line
    line(178, 118, 174, 158);
    rr(164, 158, 20, 26, 3); ctx.stroke();
    circle(174, 168, 3); ctx.stroke();
    // small motion arcs by the shoes
    ctx.beginPath(); ctx.arc(52, 292, 9, Math.PI * 0.3, Math.PI * 1.1); ctx.stroke();
    ctx.beginPath(); ctx.arc(206, 276, 9, Math.PI * 1.2, Math.PI * 1.9); ctx.stroke();
    ctx.restore();
  }

  function scene5() { // woman holding up her ticket
    var cx = 122, SY = 234;
    chair(cx, SY);
    ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    seatedLegs(cx, SY, 24);
    line(cx, 116, cx, SY);
    head(cx, 95, 16, 'long', 'open');
    line(cx - 3, 124, 100, 176); line(100, 176, 116, 208); // left arm to lap
    line(cx + 3, 124, 152, 142); line(152, 142, 164, 106); // right arm raised
    ctx.fillStyle = PAPER; rr(154, 78, 26, 32, 2); ctx.fill(); ctx.stroke(); // ticket
    line(159, 88, 175, 88); line(159, 96, 175, 96);
    ctx.restore();
  }

  function scene6() { // old woman, cane beside her, eyes closed
    var cx = 118, SY = 234;
    chair(cx, SY);
    ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    seatedLegs(cx, SY, 26);
    line(cx, 122, cx + 3, SY); // torso, slight bow
    head(cx + 4, 102, 16, 'bun', 'closed');
    line(cx, 130, 104, 196); line(104, 196, 126, 210); // hands folded in lap
    line(cx + 2, 130, 138, 196); line(138, 196, 126, 210);
    // cane leaning against the chair
    line(176, 188, 186, GY - 2);
    ctx.beginPath(); ctx.arc(172, 182, 7, Math.PI * 0.9, Math.PI * 2.05); ctx.stroke();
    ctx.restore();
  }

  var SCENES = [scene0, scene1, scene2, scene3, scene4, scene5, scene6];

  /* ---------------- main draw ---------------- */
  function draw(phase) {
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, vw, vh);

    var L = layout();
    var top = L.stripTop, bottom = top + L.vigH;

    // leporello band rules
    ctx.save();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.55;
    line(0, top, vw, top);
    line(0, bottom, vw, bottom);
    ctx.restore();

    // vignettes
    for (var i = 0; i < NV; i++) {
      var x0 = offset + i * L.vigW;
      if (x0 + L.vigW < -20 || x0 > vw + 20) continue;
      var liftPx = (i === selected) ? -11 * lift : 0;
      ctx.save();
      ctx.translate(x0, top + liftPx);
      ctx.scale(L.s, L.s);
      // fold line between vignettes
      if (i > 0) {
        ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 1.1; ctx.globalAlpha = 0.16;
        line(0, 14, 0, 346); ctx.restore();
      }
      // ground line
      ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.75;
      line(14, GY + 3, 236, GY + 3); ctx.restore();
      ctx.strokeStyle = INK;
      SCENES[i]();
      handText(NOTES[i], 125, 340, 19, 1000 + i);
      ctx.restore();
      if (i === selected && lift > 0.3) {
        ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.globalAlpha = 0.65 * lift;
        line(x0 + 18, bottom + 8, x0 + L.vigW - 18, bottom + 8); ctx.restore();
      }
    }

    // annotation card for the tapped vignette
    if (selected >= 0) {
      var cardW = Math.min(430, vw * 0.84), cardH = 62;
      var cardX = (vw - cardW) / 2, cardY = bottom + 22;
      ctx.save(); ctx.globalAlpha = lift;
      ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
      rr(cardX, cardY, cardW, cardH, 6); ctx.fill(); ctx.stroke();
      ctx.restore();
      if (lift > 0.5) {
        ctx.save(); ctx.globalAlpha = (lift - 0.5) * 2;
        handText(NOTES[selected], vw / 2, cardY + cardH / 2 + 1, 30, 5000 + selected);
        ctx.restore();
      }
    }

    // hint
    ctx.save();
    ctx.fillStyle = INK; ctx.globalAlpha = 0.48;
    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag · tap', vw - 14, vh - 12);
    ctx.restore();
  }

  /* ---------------- interaction ---------------- */
  function pointerX(e) { return e.clientX; }

  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; dragMoved = 0;
    downX = lastX = pointerX(e);
    downT = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    vel = 0;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var x = pointerX(e);
    var dx = x - lastX;
    lastX = x;
    dragMoved += Math.abs(dx);
    offset += dx;
    clampOffset();
    draw(0);
  });
  function endPointer(e) {
    if (!dragging) return;
    dragging = false;
    var x = pointerX(e);
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (dragMoved < 7 && now - downT < 500) {
      // tap: hit-test vignette
      var L = layout();
      var idx = Math.floor((x - offset) / L.vigW);
      if (idx >= 0 && idx < NV) { selected = idx; }
    }
    // otherwise vel (smoothed during pointermove) carries the strip with inertia
    draw(0);
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function () { dragging = false; });

  // track velocity while dragging (px per second, smoothed)
  var lastMoveT = 0, lastMoveX = 0;
  canvas.addEventListener('pointermove', function (e) {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (lastMoveT > 0 && now > lastMoveT) {
      var v = (pointerX(e) - lastMoveX) / ((now - lastMoveT) / 1000);
      vel = vel * 0.6 + v * 0.4;
    }
    lastMoveT = now; lastMoveX = pointerX(e);
  });

  /* ---------------- loop (guarded) ---------------- */
  var PHASE0 = 0;
  function tick(tms) {
    if (startTime < 0) { startTime = tms; lastTick = tms; }
    var dt = Math.min(0.05, (tms - lastTick) / 1000);
    lastTick = tms;
    var phase = PHASE0 + (tms - startTime) / 1000;
    var dirty = false;
    if (!dragging && Math.abs(vel) > 4) {
      offset += vel * dt;
      vel *= Math.pow(0.06, dt); // soft decay
      if (Math.abs(vel) <= 4) vel = 0;
      clampOffset();
      dirty = true;
    }
    var target = selected >= 0 ? 1 : 0;
    if (Math.abs(lift - target) > 0.002) {
      lift += (target - lift) * Math.min(1, dt * 9);
      if (Math.abs(lift - target) <= 0.002) lift = target;
      dirty = true;
    }
    if (dirty) draw(phase);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(tick);
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  resize(); // also draws frame one synchronously at offset 0
  draw(PHASE0);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(tick);
})();
</script>
</body>
</html>
