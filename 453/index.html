<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Glitch Pastoral</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#8A6F5C; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  function RNG(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var SEPIA = '#8A6F5C', SHADE = '#5C4632', SUN = '#B5542F';
  var ROSE = '#C08080', OCHRE = '#C8A040', FIG = '#3A2E24';
  var CYAN = '#00E5FF', MAGENTA = '#FF2AFF';
  var PHASE0 = 1.5;

  // Mountain ridge points per stratum, fixed seeded.
  var ridges = [];
  (function () {
    var r = RNG(453001);
    for (var layer = 0; layer < 4; layer++) {
      var pts = [];
      for (var i = 0; i <= 12; i++) pts.push(0.30 + r() * 0.45);
      ridges.push(pts);
    }
  })();

  // Glitch storm schedule: first storm at t=22s, then fixed intervals
  // cycling 35, 35, 40, 30 seconds. Each storm lasts 2s.
  var STORM_STARTS = [];
  (function () {
    var intervals = [35, 35, 40, 30];
    var s = 22, k = 0;
    while (s < 20000) { STORM_STARTS.push(s); s += intervals[k % 4]; k++; }
  })();
  // Fixed band sets per storm (y fraction of square, height fraction, offset, direction).
  var BANDSETS = [
    [{ y: 0.30, h: 0.05, off: 0.030, dir: 1 }, { y: 0.52, h: 0.04, off: 0.022, dir: -1 }, { y: 0.68, h: 0.06, off: 0.036, dir: 1 }],
    [{ y: 0.22, h: 0.04, off: 0.026, dir: -1 }, { y: 0.44, h: 0.07, off: 0.034, dir: 1 }, { y: 0.60, h: 0.04, off: 0.020, dir: -1 }, { y: 0.78, h: 0.05, off: 0.030, dir: 1 }],
    [{ y: 0.36, h: 0.06, off: 0.038, dir: 1 }, { y: 0.55, h: 0.05, off: 0.024, dir: -1 }, { y: 0.72, h: 0.04, off: 0.028, dir: 1 }, { y: 0.84, h: 0.03, off: 0.018, dir: -1 }, { y: 0.26, h: 0.03, off: 0.020, dir: 1 }]
  ];
  function stormAt(t) {
    for (var i = 0; i < STORM_STARTS.length; i++) {
      var st = STORM_STARTS[i];
      if (t >= st && t < st + 2) return { index: i, p: (t - st) / 2 };
      if (st > t) break;
    }
    return null;
  }

  function squareRect() {
    var S = Math.min(W, H);
    return { x: (W - S) / 2, y: (H - S) / 2, s: S };
  }

  // Draws the whole valley scene in square coordinates. xoff shifts the
  // drawing horizontally (used data-only for glitch bands; 0 when calm).
  function drawScene(t, sq, xoff) {
    var sx = sq.x, sy = sq.y, S = sq.s;
    ctx.save();
    ctx.translate(xoff, 0);
    // rust sun, centered in the top third, about 30% of frame width
    ctx.fillStyle = SUN;
    ctx.beginPath(); ctx.arc(sx + S * 0.5, sy + S * 0.28, S * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(181,84,47,0.35)'; ctx.lineWidth = S * 0.012;
    ctx.beginPath(); ctx.arc(sx + S * 0.5, sy + S * 0.28, S * 0.175, 0, Math.PI * 2); ctx.stroke();
    // mountain strata, horizontal layers with jagged ridges
    var shades = ['#6E563E', '#5C4632', '#4E3A28', '#42301F'];
    var bases = [0.46, 0.58, 0.70, 0.82];
    for (var layer = 0; layer < 4; layer++) {
      ctx.fillStyle = shades[layer];
      ctx.beginPath();
      ctx.moveTo(sx, sy + S);
      ctx.lineTo(sx, sy + S * bases[layer]);
      for (var i = 0; i <= 12; i++) {
        ctx.lineTo(sx + (i / 12) * S, sy + S * bases[layer] - ridges[layer][i] * S * 0.06);
      }
      ctx.lineTo(sx + S, sy + S);
      ctx.closePath(); ctx.fill();
    }
    // foreground meadow
    ctx.fillStyle = '#7A5F45';
    ctx.fillRect(sx, sy + S * 0.86, S, S * 0.14);
    // grass sway and flower bob, bottom-left cluster
    var flowers = [
      { fx: 0.10, c: ROSE }, { fx: 0.16, c: OCHRE }, { fx: 0.22, c: ROSE },
      { fx: 0.28, c: OCHRE }, { fx: 0.14, c: ROSE }, { fx: 0.24, c: ROSE }
    ];
    for (var f = 0; f < flowers.length; f++) {
      var fl = flowers[f];
      var fx = sx + fl.fx * S;
      var sway = Math.sin(t * 1.2 + f * 1.3) * S * 0.006;
      var fy = sy + S * 0.90;
      ctx.strokeStyle = '#3E5A2E'; ctx.lineWidth = Math.max(1.5, S * 0.003);
      ctx.beginPath(); ctx.moveTo(fx, sy + S * 0.97); ctx.lineTo(fx + sway, fy); ctx.stroke();
      ctx.fillStyle = fl.c;
      for (var p = 0; p < 5; p++) {
        var pa = p * Math.PI * 2 / 5;
        ctx.beginPath(); ctx.arc(fx + sway + Math.cos(pa) * S * 0.012, fy + Math.sin(pa) * S * 0.012, S * 0.011, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#E8C84A';
      ctx.beginPath(); ctx.arc(fx + sway, fy, S * 0.007, 0, Math.PI * 2); ctx.fill();
    }
    // grass strokes across the meadow
    ctx.strokeStyle = '#3E5A2E'; ctx.lineWidth = Math.max(1, S * 0.002);
    for (var g0 = 0; g0 < 24; g0++) {
      var gx = sx + (g0 / 24) * S + Math.sin(t + g0) * S * 0.003;
      ctx.beginPath(); ctx.moveTo(gx, sy + S * 0.97); ctx.lineTo(gx + Math.sin(t * 1.5 + g0) * S * 0.004, sy + S * 0.94); ctx.stroke();
    }
    // the lone figure from behind, small, on rocks at the lower-right third
    var rx = sx + S * 0.70, ry = sy + S * 0.80;
    ctx.fillStyle = FIG;
    ctx.beginPath();
    ctx.moveTo(rx - S * 0.06, ry + S * 0.05); ctx.lineTo(rx + S * 0.06, ry + S * 0.05);
    ctx.lineTo(rx + S * 0.04, ry - S * 0.02); ctx.lineTo(rx - S * 0.04, ry - S * 0.02);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(rx, ry - S * 0.075, S * 0.020, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(rx - S * 0.012, ry - S * 0.055, S * 0.024, S * 0.05);
    ctx.strokeStyle = FIG; ctx.lineWidth = Math.max(1.5, S * 0.006); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(rx - S * 0.008, ry); ctx.lineTo(rx - S * 0.012, ry + S * 0.05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx + S * 0.008, ry); ctx.lineTo(rx + S * 0.012, ry + S * 0.05); ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // page ground takes the sepia ground; the valley keeps its square shape
    ctx.fillStyle = SEPIA;
    ctx.fillRect(0, 0, W, H);
    var sq = squareRect();
    ctx.save();
    ctx.beginPath(); ctx.rect(sq.x, sq.y, sq.s, sq.s); ctx.clip();
    ctx.fillStyle = SEPIA;
    ctx.fillRect(sq.x, sq.y, sq.s, sq.s);
    drawScene(t, sq, 0);
    ctx.restore();

    // glitch storm: redraw the scene clipped to each band rect with a
    // horizontal offset, then stroke cyan/magenta edge lines. No offscreen
    // canvas anywhere. Outside storms the frame is the calm frame exactly.
    var storm = stormAt(t);
    if (storm) {
      var bands = BANDSETS[storm.index % BANDSETS.length];
      var sweep = Math.sin(storm.p * Math.PI);
      for (var bi = 0; bi < bands.length; bi++) {
        var bd = bands[bi];
        var by = sq.y + bd.y * sq.s, bh = bd.h * sq.s;
        var off = bd.dir * sweep * bd.off * sq.s;
        ctx.save();
        ctx.beginPath(); ctx.rect(sq.x, by, sq.s, bh); ctx.clip();
        drawScene(t, sq, off);
        ctx.restore();
        ctx.lineWidth = Math.max(1, sq.s * 0.002);
        ctx.strokeStyle = CYAN;
        ctx.beginPath(); ctx.moveTo(sq.x, by); ctx.lineTo(sq.x + sq.s, by); ctx.stroke();
        ctx.strokeStyle = MAGENTA;
        ctx.beginPath(); ctx.moveTo(sq.x, by + bh); ctx.lineTo(sq.x + sq.s, by + bh); ctx.stroke();
      }
    }
  }

  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    var loop = function (now) {
      draw(PHASE0 + (now - start) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
