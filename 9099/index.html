<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9099 · Linkwork III</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #e9e2d0; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // Third study after Hans's forged wall sculpture, rebuilt from the chain:
  // crisp rectangular links flowing horizontally along a meandering course,
  // each passing alternately over and under its neighbours like a real
  // chain, bronze and blackened steel. A slow ripple travels the chain's
  // length once per loop, which closes seamlessly, forever.
  var LOOP = 16000;
  var WALL = '#e9e2d0';
  var BRONZE = ['#a87f45', '#b78f52', '#96702f'];
  var DARK = ['#26221d', '#2e2924', '#1e1b17'];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, S = 0;
  var seed = 20261021;
  var frames = [], grain = null;

  function mulberry(s) {
    var a = s >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // superellipse centerline point, local coords (n=6: crisp forged rectangle)
  function sePoint(f, t) {
    var e = 2 / 6;
    var c = Math.cos(t), s = Math.sin(t);
    return [
      f.w / 2 * Math.sign(c) * Math.pow(Math.abs(c), e),
      f.h / 2 * Math.sign(s) * Math.pow(Math.abs(s), e)
    ];
  }

  // hand-hammered radial wobble along the band
  function wobble(f, t) {
    return f.band * (f.a1 * Math.sin(f.f1 * t + f.p1) + f.a2 * Math.sin(f.f2 * t + f.p2));
  }

  function centerline(f, N) {
    var pts = [], i, p, t;
    for (i = 0; i < N; i++) {
      t = (i / N) * Math.PI * 2;
      p = sePoint(f, t);
      pts.push({ t: t, x: p[0], y: p[1] });
    }
    // normals from neighbours, then wobble along them
    for (i = 0; i < N; i++) {
      var a = pts[(i - 1 + N) % N], b = pts[(i + 1) % N], q = pts[i];
      var dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
      var nx = -dy / L, ny = dx / L;
      var d = wobble(f, q.t);
      q.x += nx * d; q.y += ny * d;
      q.nx = nx; q.ny = ny;
    }
    return pts;
  }

  function toWorld(f, p) {
    var c = Math.cos(f.rot), s = Math.sin(f.rot);
    return [f.x + p.x * c - p.y * s, f.y + p.x * s + p.y * c];
  }

  function ringPaths(f) {
    var N = 72, cl = centerline(f, N), i, q, wpt;
    var outer = new Path2D(), inner = new Path2D(), ring = new Path2D();
    var ox = [], oy = [], ix = [], iy = [];
    for (i = 0; i < N; i++) {
      q = cl[i];
      var bw = f.band * (1 + 0.38 * Math.sin(f.f3 * q.t + f.p3)); // forged taper
      wpt = toWorld(f, { x: q.x + q.nx * bw / 2, y: q.y + q.ny * bw / 2 });
      ox.push(wpt[0]); oy.push(wpt[1]);
      wpt = toWorld(f, { x: q.x - q.nx * bw / 2, y: q.y - q.ny * bw / 2 });
      ix.push(wpt[0]); iy.push(wpt[1]);
    }
    function trace(path, xs, ys) {
      path.moveTo(xs[0], ys[0]);
      for (var k = 1; k < N; k++) {
        var mx = (xs[k - 1] + xs[k]) / 2, my = (ys[k - 1] + ys[k]) / 2;
        path.quadraticCurveTo(xs[k - 1], ys[k - 1], mx, my);
      }
      path.quadraticCurveTo(xs[N - 1], ys[N - 1], (xs[N - 1] + xs[0]) / 2, (ys[N - 1] + ys[0]) / 2);
      path.quadraticCurveTo(xs[0], ys[0], xs[0], ys[0]);
      path.closePath();
    }
    trace(outer, ox, oy);
    trace(inner, ix, iy);
    trace(ring, ox, oy);
    // inner contour into the same path for evenodd fill
    ring.moveTo(ix[0], iy[0]);
    for (var k = 1; k < N; k++) {
      var mx2 = (ix[k - 1] + ix[k]) / 2, my2 = (iy[k - 1] + iy[k]) / 2;
      ring.quadraticCurveTo(ix[k - 1], iy[k - 1], mx2, my2);
    }
    ring.quadraticCurveTo(ix[N - 1], iy[N - 1], (ix[N - 1] + ix[0]) / 2, (iy[N - 1] + iy[0]) / 2);
    ring.quadraticCurveTo(ix[0], iy[0], ix[0], iy[0]);
    ring.closePath();
    return { ring: ring, outer: outer, inner: inner, cl: cl };
  }

  function build() {
    var R = mulberry(seed);
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    S = Math.min(W, H);
    frames = [];
    // the chain: links flow horizontally along a meandering course,
    // each turned ~90 degrees from its neighbours, interlocked
    var nL = 17, i;
    var x0 = W * 0.06, x1 = W * 0.94;
    var A = H * 0.13, waves = 2, ph = R() * 6.283;
    for (i = 0; i < nL; i++) {
      var t = i / (nL - 1);
      var x = x0 + t * (x1 - x0);
      var y = H * 0.5 + A * Math.sin(t * Math.PI * 2 * waves + ph);
      var dx = (x1 - x0) / (nL - 1);
      var dy = A * Math.PI * 2 * waves / (nL - 1) * Math.cos(t * Math.PI * 2 * waves + ph);
      var tang = Math.atan2(dy, dx);
      var L = W * 0.145 * (0.88 + R() * 0.28);
      var bronze = (i % 2 === 0) ? R() < 0.55 : R() < 0.4;
      var pal = bronze ? BRONZE : DARK;
      var f = {
        x: x, y: y, bx: x, by: y,
        w: L, h: L * (0.62 + R() * 0.14),
        rot: tang + (i % 2 ? Math.PI / 2 : 0) + (R() - 0.5) * 0.22,
        brot: 0,
        band: S * (0.030 + R() * 0.014),
        col: pal[(R() * pal.length) | 0],
        bronze: bronze, idx: i, nL: nL,
        f1: 2 + ((R() * 3) | 0), p1: R() * 6.283, a1: 0.03 + R() * 0.04,
        f2: 5 + ((R() * 4) | 0), p2: R() * 6.283, a2: 0.012 + R() * 0.02,
        f3: 2 + ((R() * 2) | 0), p3: R() * 6.283, // band taper
        seedDimple: (R() * 1e9) | 0
      };
      f.paths = ringPaths(f);
      f.brot = f.rot;
      frames.push(f);
    }
    // a few small satellite links caught in the chain's bends
    for (var sN = 0; sN < 5; sN++) {
      var li = 2 + ((R() * (nL - 4)) | 0);
      var host = frames[li];
      var sL = W * 0.07 * (0.8 + R() * 0.4);
      var sbronze = R() < 0.5;
      var spal = sbronze ? BRONZE : DARK;
      var sf = {
        x: host.x + (R() - 0.5) * W * 0.1, y: host.y + (R() - 0.5) * H * 0.16,
        bx: 0, by: 0,
        w: sL, h: sL * 0.7, rot: R() * 3.14, brot: 0,
        band: S * 0.024, col: spal[(R() * spal.length) | 0],
        bronze: sbronze, idx: -1, nL: nL,
        f1: 3, p1: R() * 6.283, a1: 0.04, f2: 6, p2: R() * 6.283, a2: 0.02,
        f3: 2, p3: R() * 6.283, seedDimple: (R() * 1e9) | 0
      };
      sf.bx = sf.x; sf.by = sf.y; sf.brot = sf.rot;
      sf.paths = ringPaths(sf);
      frames.push(sf);
    }

    // plaster grain, drawn once
    grain = document.createElement('canvas');
    grain.width = Math.max(2, Math.floor(W / 2));
    grain.height = Math.max(2, Math.floor(H / 2));
    var g = grain.getContext('2d'), gr = mulberry(seed + 7), d;
    for (d = 0; d < 2200; d++) {
      g.fillStyle = 'rgba(120,104,70,' + (0.02 + gr() * 0.05).toFixed(3) + ')';
      var sz = 0.6 + gr() * 1.8;
      g.fillRect(gr() * grain.width, gr() * grain.height, sz, sz);
    }
  }

  function drawFrame(f, R) {
    var p = f.paths, m = Math.max(f.w, f.h);
    // contact shadow
    ctx.save();
    ctx.shadowColor = 'rgba(52,38,18,0.38)';
    ctx.shadowBlur = S * 0.035;
    ctx.shadowOffsetX = S * 0.010;
    ctx.shadowOffsetY = S * 0.018;
    ctx.fillStyle = '#000';
    ctx.fill(p.ring, 'evenodd');
    ctx.restore();

    // base metal
    ctx.fillStyle = f.col;
    ctx.fill(p.ring, 'evenodd');

    ctx.save();
    ctx.clip(p.ring, 'evenodd');
    // hammered dimples
    var dr = mulberry(f.seedDimple), k, t, q, wpt, rr;
    for (k = 0; k < 130; k++) {
      t = dr() * Math.PI * 2;
      q = sePoint(f, t);
      var d = wobble(f, t) + (dr() - 0.5) * f.band * 0.7;
      wpt = toWorld(f, { x: q.x, y: q.y });
      // push toward band interior randomly
      wpt[0] += Math.cos(t * 3) * d * 0.3; wpt[1] += Math.sin(t * 3) * d * 0.3;
      rr = f.band * (0.18 + dr() * 0.3);
      ctx.beginPath();
      ctx.ellipse(wpt[0], wpt[1], rr, rr * (0.5 + dr() * 0.5), dr() * 3.14, 0, 6.283);
      ctx.fillStyle = dr() < 0.5
        ? 'rgba(0,0,0,' + (0.05 + dr() * 0.10).toFixed(3) + ')'
        : 'rgba(255,246,225,' + (0.04 + dr() * 0.08).toFixed(3) + ')';
      ctx.fill();
    }
    // patina bloom on blackened steel
    if (!f.bronze) {
      for (k = 0; k < 46; k++) {
        t = dr() * Math.PI * 2;
        q = sePoint(f, t);
        wpt = toWorld(f, { x: q.x + (dr() - 0.5) * f.band, y: q.y + (dr() - 0.5) * f.band });
        ctx.beginPath();
        ctx.arc(wpt[0], wpt[1], 0.8 + dr() * 2.2, 0, 6.283);
        ctx.fillStyle = 'rgba(178,186,168,' + (0.05 + dr() * 0.10).toFixed(3) + ')';
        ctx.fill();
      }
    }
    // brushed satin lines on bronze, along the link's length (inside clip)
    if (f.bronze) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.lineWidth = 1;
      for (k = 0; k < 42; k++) {
        var ly = (dr() - 0.5) * f.h;
        ctx.beginPath();
        ctx.moveTo(-f.w / 2, ly);
        ctx.lineTo(f.w / 2, ly);
        ctx.strokeStyle = dr() < 0.5
          ? 'rgba(255,240,210,' + (0.03 + dr() * 0.05).toFixed(3) + ')'
          : 'rgba(70,40,12,' + (0.03 + dr() * 0.05).toFixed(3) + ')';
        ctx.stroke();
      }
      ctx.restore();
    }
    // directional light across the metal
    var lg2 = ctx.createLinearGradient(f.x - m / 2, f.y - m / 2, f.x + m / 2, f.y + m / 2);
    lg2.addColorStop(0, 'rgba(255,244,220,0.20)');
    lg2.addColorStop(0.5, 'rgba(255,244,220,0)');
    lg2.addColorStop(1, 'rgba(24,12,4,0.24)');
    ctx.fillStyle = lg2;
    ctx.fillRect(f.x - m, f.y - m, m * 2, m * 2);
    ctx.restore();

    // forged edge definition
    ctx.strokeStyle = 'rgba(255,248,230,0.16)';
    ctx.lineWidth = Math.max(1, S * 0.002);
    ctx.stroke(p.outer);
    ctx.strokeStyle = 'rgba(0,0,0,0.28)';
    ctx.stroke(p.inner);
    void R;
  }

  function drawLink(f, R, a) {
    // ripple traveling the chain's length; satellites bob gently on their own
    var ph, wdx, wdy, wrot;
    if (f.idx >= 0) {
      ph = (f.idx / f.nL) * Math.PI * 4 - a * 2;
      var amp = S * 0.007;
      wdx = Math.cos(f.brot + Math.PI / 2) * amp * Math.sin(ph);
      wdy = Math.sin(f.brot + Math.PI / 2) * amp * Math.sin(ph);
      wrot = 0.035 * Math.sin(ph + 1.2);
    } else {
      ph = a * 0.7 + f.bx;
      wdx = Math.cos(ph) * S * 0.003;
      wdy = Math.sin(ph * 1.3) * S * 0.003;
      wrot = 0.02 * Math.sin(ph);
    }
    ctx.save();
    ctx.translate(f.bx + wdx, f.by + wdy);
    ctx.rotate(wrot);
    ctx.translate(-f.bx, -f.by);
    drawFrame(f, R);
    ctx.restore();
  }

  function draw(now) {
    var lt = (now % LOOP) / LOOP;
    var a = lt * Math.PI * 2;
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(grain, 0, 0, W, H);

    var R = mulberry(seed + 31), i, f;
    // chain interlock: odd links + satellites pass under, even links over
    for (i = 0; i < frames.length; i++) {
      f = frames[i];
      if (f.idx < 0 || f.idx % 2 === 1) drawLink(f, R, a);
    }
    for (i = 0; i < frames.length; i++) {
      f = frames[i];
      if (f.idx >= 0 && f.idx % 2 === 0) drawLink(f, R, a);
    }

    // slow light sweep, once per loop
    var sx = (-0.35 + 1.7 * lt) * W;
    var sg = ctx.createLinearGradient(sx - S * 0.3, 0, sx + S * 0.3, H * 0.25);
    sg.addColorStop(0, 'rgba(255,252,240,0)');
    sg.addColorStop(0.5, 'rgba(255,252,240,0.16)');
    sg.addColorStop(1, 'rgba(255,252,240,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, W, H);

    // faint vignette
    var vg = ctx.createRadialGradient(W / 2, H / 2, S * 0.35, W / 2, H / 2, S * 0.95);
    vg.addColorStop(0, 'rgba(60,45,20,0)');
    vg.addColorStop(1, 'rgba(60,45,20,0.14)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  var lastTap = 0;
  canvas.addEventListener('pointerdown', function () {
    var now = performance.now();
    if (now - lastTap < 350) {
      seed = (Math.random() * 1e9) | 0;
      build();
    }
    lastTap = now;
  });

  window.addEventListener('resize', build);
  build();
  (function frame(now) {
    draw(now || 0);
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
