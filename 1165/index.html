<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mavuel</title>
<style>
  html, body { margin: 0; padding: 0; background: #1A1033; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- Mavuel — Nick Briz study NB6 ----------
  // After Briz's Mavuel 11th (2025), a generative remix that never loops:
  // an improvisation engine leans on a simple melody a little harder every
  // second until, minutes in, the tune is somewhere else entirely. The
  // melody here is ORIGINAL (a plain C-major arpeggio, I-vi-IV-V) — not a
  // note of Avril 14th is reproduced. One seeded event function,
  // eventAt(k), is the whole piece: the score draws from it and the audio
  // scheduler plays from it, so picture and sound can never disagree.
  // Deviation D(t) = 0.95 * (1 - exp(-t/240)) grows monotonically with
  // playing time: at 1 minute D is about 0.21 (a semitone's wobble), at
  // 5 minutes about 0.68 (the melody is unrecognizable), and it never
  // resets inside a session — so no two passes, and no two moments,
  // are ever the same performance. Starts on first tap; tap the score
  // to reseed the deviation path; the transport pauses (which also
  // freezes deviation — paused time does not count).

  var BG = '#1A1033';
  var GOLD = '#FFD500';
  var CYAN = '#00F0FF';
  var STAFF = '#3A2A5E';
  var STAFF_DIM = '#57468A';
  var GLOW = '#FFFFFF';
  var LBL = '#9A8FD0';

  // stepped gold -> cyan table (24 steps), precomputed hex
  function lerpHex(a, b, t) {
    var ar = parseInt(a.slice(1, 3), 16), ag = parseInt(a.slice(3, 5), 16), ab = parseInt(a.slice(5, 7), 16);
    var br = parseInt(b.slice(1, 3), 16), bg = parseInt(b.slice(3, 5), 16), bb = parseInt(b.slice(5, 7), 16);
    function h(v) { var s = Math.round(v).toString(16); return s.length < 2 ? '0' + s : s; }
    return '#' + h(ar + (br - ar) * t) + h(ag + (bg - ag) * t) + h(ab + (bb - ab) * t);
  }
  var DEVCOLORS = [];
  for (var ci = 0; ci < 24; ci++) DEVCOLORS.push(lerpHex(GOLD, CYAN, ci / 23));
  function devColor(d) { return DEVCOLORS[Math.max(0, Math.min(23, Math.round(d * 23)))]; }

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }

  // ---------- the music ----------
  var BPM = 92;
  var STEP = 60 / BPM / 2;               // eighth notes: ~0.326 s
  var CHORDS = [                          // I - vi - IV - V in C major
    { root: 60, tones: [60, 64, 67] },    // C
    { root: 57, tones: [57, 60, 64] },    // Am
    { root: 53, tones: [53, 57, 60] },    // F
    { root: 55, tones: [55, 59, 62] }     // G
  ];
  var ARP = [ [0, 0], [2, 0], [1, 0], [2, 0], [0, 1], [2, 0], [1, 0], [2, 0] ];

  function devAt(t) { return 0.95 * (1 - Math.exp(-t / 240)); }

  var seed = 7;

  // arpeggio event k: pure function of (seed, k)
  function eventAt(k) {
    var bar = Math.floor(k / 8), st = k % 8;
    var ch = CHORDS[bar % 4];
    var baseT = k * STEP;
    var baseP = ch.tones[ARP[st][0]] + 12 * ARP[st][1];
    var D = devAt(baseT);
    var rng = mulberry32(hashStr('MV' + seed + ':' + k));
    var rP = rng(), rT = rng(), rD = rng();
    var semi = Math.round((rP * 2 - 1) * D * 5);
    var tOff = (rT * 2 - 1) * D * 0.16;
    var dropped = rD < D * 0.20;
    var dev = Math.max(0, Math.min(1, 0.25 * D + 0.75 * Math.min(1, Math.abs(semi) / 4 + Math.abs(tOff) / 0.16 * 0.4)));
    return { t: baseT + tOff, midi: baseP + semi, dev: dev, dropped: dropped, bass: false, len: STEP * 2.2 };
  }
  // bass event per bar: the chord root, an octave down, deviating less
  function bassAt(bar) {
    var ch = CHORDS[bar % 4];
    var baseT = bar * 8 * STEP;
    var D = devAt(baseT);
    var rng = mulberry32(hashStr('MVB' + seed + ':' + bar));
    var rP = rng(), rT = rng();
    var semi = Math.round((rP * 2 - 1) * D * 3);
    var tOff = (rT * 2 - 1) * D * 0.08;
    var dev = Math.max(0, Math.min(1, 0.25 * D + 0.75 * Math.min(1, Math.abs(semi) / 3)));
    return { t: baseT + tOff, midi: ch.root - 12 + semi, dev: dev, dropped: false, bass: true, len: STEP * 6 };
  }

  // diatonic staff position (white-key index; chromatic notes sit at halves)
  var PC2DIA = [0, 0.5, 1, 1.5, 2, 3, 3.5, 4, 4.5, 5, 5.5, 6];
  function dia(midi) { return Math.floor(midi / 12) * 7 + PC2DIA[midi % 12]; }

  // ---------- session state ----------
  var started = false, playing = false;
  var elapsedBase = 0, playStamp = 0;
  function clockNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return Date.now() / 1000;
  }
  function sessionNow() { return playing ? elapsedBase + (clockNow() - playStamp) : elapsedBase; }

  // ---------- audio (lazy, gesture-only, fully guarded) ----------
  var actx = null, master = null, schedTimer = null, nextK = 0, nextBar = 0;
  function audioCtor() {
    if (typeof window === 'undefined') return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    return (typeof AC === 'function') ? AC : null;
  }
  function startAudio() {
    var AC = audioCtor();
    if (!AC || actx) return;
    try {
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.55;
      master.connect(actx.destination);
    } catch (e) { actx = null; master = null; }
  }
  function pluck(ev, when) {
    if (!actx || !master) return;
    var freq = 440 * Math.pow(2, (ev.midi - 69) / 12);
    var t0 = Math.max(when, actx.currentTime);
    var dur = ev.bass ? 2.4 : 1.15;
    var vol = ev.bass ? 0.16 : 0.20;
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    var o1 = actx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = freq;
    var o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
    var g2 = actx.createGain(); g2.gain.value = 0.32;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    o1.start(t0); o2.start(t0); o1.stop(t0 + dur + 0.05); o2.stop(t0 + dur + 0.05);
  }
  function schedule() {
    if (!actx) return;
    var ahead = sessionNow() + 0.28;
    for (var guard = 0; guard < 64; guard++) {
      var a = eventAt(nextK), b = bassAt(nextBar);
      var ev = a.t <= b.t ? a : b;
      if (ev.t > ahead) break;
      if (ev === a) nextK++; else nextBar++;
      if (!ev.dropped) pluck(ev, actx.currentTime + (ev.t - sessionNow()));
    }
  }
  function startScheduler() {
    if (!actx || schedTimer !== null || typeof setInterval !== 'function') return;
    nextK = Math.max(0, Math.floor(sessionNow() / STEP));
    nextBar = Math.max(0, Math.floor(sessionNow() / (8 * STEP)));
    schedTimer = setInterval(schedule, 90);
  }
  function stopScheduler() {
    if (schedTimer !== null && typeof clearInterval === 'function') clearInterval(schedTimer);
    schedTimer = null;
  }

  function startSession() {
    started = true; playing = true;
    elapsedBase = 0; playStamp = clockNow();
    startAudio();
    if (actx && actx.resume) actx.resume();
    startScheduler();
  }
  function togglePlay() {
    if (!started) { startSession(); return; }
    if (playing) {
      elapsedBase = sessionNow(); playing = false;
      stopScheduler();
      if (actx && actx.suspend) actx.suspend();
    } else {
      playing = true; playStamp = clockNow();
      if (actx && actx.resume) actx.resume();
      startScheduler();
    }
  }
  function reseed() {
    seed = (seed * 31 + 17) % 100000;
    elapsedBase = 0;
    if (playing) playStamp = clockNow();
    if (actx) { nextK = 0; nextBar = 0; }
  }

  // ---------- view / canvas ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function viewW() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    if (vv && vv.width) return vv.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    if (vv && vv.height) return vv.height;
    return window.innerHeight || 800;
  }
  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw || 9999, sh || 9999);
    if (mn < 700) return true;
    return H > W * 1.15;
  }
  function fit() {
    W = viewW(); H = viewH();
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { fit(); draw(); });
  }

  // faint dusk stars, static per size (seeded by index, normalized coords)
  function drawStars(phone) {
    var rng = mulberry32(1165);
    ctx.fillStyle = STAFF_DIM;
    for (var i = 0; i < 90; i++) {
      var x = rng() * W, y = rng() * H, r = rng() < 0.85 ? 1 : 1.6;
      ctx.globalAlpha = 0.16 + rng() * 0.22;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawDot(x, y, r) {
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.25, r * 0.88, -0.28, 0, 6.2832);
    ctx.fill();
  }

  function draw(now) {
    fit();
    var phone = isPhone();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    drawStars(phone);

    var marginX = phone ? 16 : 36;
    var D = started ? devAt(now) : 0;

    // ----- deviation arc meter across the top -----
    var arcR = Math.min(W, H) * (phone ? 0.105 : 0.115);
    var arcCx = W / 2, arcCy = H * 0.155;
    ctx.fillStyle = LBL;
    ctx.font = (phone ? 10 : 11) + 'px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('d e v i a t i o n', arcCx, Math.max(12, arcCy - arcR - 8));
    ctx.lineWidth = phone ? 4 : 5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = STAFF;
    ctx.beginPath(); ctx.arc(arcCx, arcCy, arcR, Math.PI, 2 * Math.PI); ctx.stroke();
    if (D > 0.003) {
      ctx.strokeStyle = devColor(D);
      ctx.beginPath(); ctx.arc(arcCx, arcCy, arcR, Math.PI, Math.PI + Math.PI * D); ctx.stroke();
    }
    ctx.lineCap = 'butt';

    // ----- reseed affordance, score's top-right corner -----
    ctx.fillStyle = LBL;
    ctx.font = (phone ? 11 : 12) + 'px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('reseed', W - marginX, Math.max(14, arcCy - arcR * 0.35));
    ctx.textAlign = 'center';

    // ----- staves: two systems in the center band -----
    var lineGap = phone ? 8 : 10;
    var sysTop = H * (phone ? 0.27 : 0.30);
    var trebleBottomY = sysTop + 4 * lineGap;
    var bassTop = trebleBottomY + (phone ? 36 : 48);
    var bassBottomY = bassTop + 4 * lineGap;
    var x0 = marginX, x1 = W - marginX;
    ctx.strokeStyle = STAFF;
    ctx.lineWidth = 1;
    var li, y;
    for (li = 0; li < 5; li++) {
      y = sysTop + li * lineGap;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      y = bassTop + li * lineGap;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    }
    // grand-staff connector at the left
    ctx.beginPath(); ctx.moveTo(x0, sysTop); ctx.lineTo(x0, bassBottomY); ctx.stroke();

    function yFor(ev) {
      if (ev.midi >= 60) return trebleBottomY - (dia(ev.midi) - dia(64)) * (lineGap / 2);
      return bassBottomY - (dia(ev.midi) - dia(43)) * (lineGap / 2);
    }

    // ----- playhead -----
    var pps = phone ? 84 : 120;
    var playX = x0 + (x1 - x0) * 0.32;
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.moveTo(playX, sysTop - 16); ctx.lineTo(playX, bassBottomY + 16); ctx.stroke();

    // ----- notes from the event stream -----
    var tPast = playX / pps, tFut = (W - playX) / pps;
    var kMin = Math.max(0, Math.floor((now - tPast) / STEP) - 2);
    var kMax = Math.ceil((now + tFut) / STEP) + 2;
    var noteR = phone ? 4.4 : 5.4;
    var evs = [];
    for (var k = kMin; k <= kMax; k++) { var e1 = eventAt(k); if (!e1.dropped) evs.push(e1); }
    var barMin = Math.max(0, Math.floor((now - tPast) / (8 * STEP)) - 1);
    var barMax = Math.ceil((now + tFut) / (8 * STEP)) + 1;
    for (var b = barMin; b <= barMax; b++) evs.push(bassAt(b));

    var nowEv = null;
    for (var i = 0; i < evs.length; i++) {
      var ev = evs[i];
      if (ev.t > now + tFut || ev.t < now - tPast) continue;
      if (started && ev.t <= now && now - ev.t < STEP * 0.95) { if (!nowEv || ev.t > nowEv.t) nowEv = ev; }
    }
    // halo under the now-playing note
    if (nowEv) {
      var hx = playX + (nowEv.t - now) * pps;
      ctx.fillStyle = 'rgba(255,255,255,0.30)';
      ctx.beginPath(); ctx.ellipse(hx, yFor(nowEv), noteR * 2.3, noteR * 1.7, -0.28, 0, 6.2832); ctx.fill();
    }
    for (var j = 0; j < evs.length; j++) {
      var ev2 = evs[j];
      if (ev2.t > now + tFut || ev2.t < now - tPast) continue;
      var nx = playX + (ev2.t - now) * pps;
      ctx.fillStyle = devColor(ev2.dev);
      drawDot(nx, yFor(ev2), ev2.bass ? noteR * 1.08 : noteR);
    }
    if (nowEv) {
      ctx.strokeStyle = GLOW;
      ctx.lineWidth = 1.4;
      var wx = playX + (nowEv.t - now) * pps, wy = yFor(nowEv);
      ctx.beginPath(); ctx.ellipse(wx, wy, noteR * 1.45, noteR * 1.05, -0.28, 0, 6.2832); ctx.stroke();
    }

    // ----- transport, bottom center -----
    var btnY = H - (phone ? 46 : 56), btnR = phone ? 22 : 26;
    ctx.strokeStyle = STAFF_DIM;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(W / 2, btnY, btnR, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = GLOW;
    if (playing) {
      var bw = phone ? 4 : 5, bh = phone ? 11 : 13;
      ctx.fillRect(W / 2 - bw - 2.5, btnY - bh, bw, bh * 2);
      ctx.fillRect(W / 2 + 2.5, btnY - bh, bw, bh * 2);
    } else {
      var tw = phone ? 11 : 13;
      ctx.beginPath();
      ctx.moveTo(W / 2 - tw * 0.55, btnY - tw);
      ctx.lineTo(W / 2 + tw * 0.85, btnY);
      ctx.lineTo(W / 2 - tw * 0.55, btnY + tw);
      ctx.closePath(); ctx.fill();
    }

    // ----- tap to begin (pre-start only) -----
    if (!started) {
      ctx.fillStyle = GOLD;
      ctx.font = (phone ? 14 : 16) + 'px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('tap to begin', W / 2, btnY - btnR - 16);
    }
  }

  // ---------- interaction ----------
  function hitTransport(x, y) {
    var phone = isPhone();
    var btnY = H - (phone ? 46 : 56), btnR = (phone ? 22 : 26) + 10;
    var dx = x - W / 2, dy = y - btnY;
    return dx * dx + dy * dy < btnR * btnR;
  }
  function hitReseed(x, y) {
    var phone = isPhone();
    var marginX = phone ? 16 : 36;
    return x > W - marginX - 76 && y < H * 0.16;
  }
  function onTap(x, y) {
    if (!started) { startSession(); draw(sessionNow()); return; }
    if (hitTransport(x, y)) { togglePlay(); draw(sessionNow()); return; }
    if (hitReseed(x, y)) { reseed(); draw(sessionNow()); return; }
    reseed(); draw(sessionNow());   // tap the score = reseed the deviation path
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { onTap(e.clientX || 0, e.clientY || 0); });
    canvas.addEventListener('touchstart', function (e) {
      if (e && e.touches && e.touches[0]) onTap(e.touches[0].clientX, e.touches[0].clientY);
    });
    canvas.addEventListener('mousedown', function (e) { onTap(e.clientX || 0, e.clientY || 0); });
  }

  // ---------- run: synchronous fixed first frame, then guarded rAF ----------
  draw(0);

  function loop() {
    if (started) draw(sessionNow());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
