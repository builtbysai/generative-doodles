<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fenway Speaks</title>
<style>
  html, body { margin: 0; padding: 0; background: #0D0D0D; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var BLACK = '#0D0D0D';
  var HER = '#DCD8CE';    // her white, thin type
  var HIM = '#8A8A90';    // Bergamot grey, heavier type
  var INK = '#1A1A1A';    // moustache ink
  var CHIP = '#E4DFD2';   // paper chip

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded RNG (mulberry32).
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- The script: six paired exchanges, written for this piece. ----
  // She observes, flat. He footnotes, pompous, and contradicts her.
  // They never agree. The last pairs turn melancholic; he stays straight.
  var PAIRS = [
    {
      her: 'The ferry was late again. I watched it come in through the fog, very slowly, like it was thinking it over.',
      him: 'Correction. Fog is not weather. Fog is the harbor declining to comment. I have consulted the harbor.'
    },
    {
      her: 'My neighbor has a dog that barks at exactly six in the morning. The dog has never once been wrong.',
      him: 'The dog is wrong. The dog is early. We are all early. The dog merely admits it first.'
    },
    {
      her: 'I bought a plant for the windowsill. The label said it would outlive me. I found that comforting.',
      him: 'The label is a salesman. Plants outlive everyone. That is not comfort. That is scheduling.'
    },
    {
      her: 'On the radio a man said the city is getting quieter. I turned the radio off to listen.',
      him: 'You cannot audit silence with the radio off. You can only join it. I join it professionally.'
    },
    {
      her: 'I keep a list of everything I have lost. It is the most complete document I own.',
      him: 'I also keep a list. Mine is shorter. I lost the list.'
    },
    {
      her: 'Late at night the trains sound farther away than they are. I like that the distance lies a little.',
      him: 'The distance is not lying. The night is simply larger than the map. Even my voice gets lost in it. Even mine.'
    }
  ];

  // Bergamot's unscripted asides (tap).
  var ASIDES = [
    'A footnote. I appear only in footnotes now.',
    'For the record. There is no record.',
    'Let the transcript show that I nodded gravely.',
    'I would like it noted that I object to the quiet.',
    'An interjection, formally submitted, then withdrawn.'
  ];

  var PAIR_DUR = 9.5;         // one pair every ~9 s
  var BEAT = 0.9;             // the pause between her line and his
  var HER_CPS = 30;           // typewriter rates, chars per second
  var HIS_CPS = 26;
  var ASIDE_DUR = 4.6;        // an aside holds the lower register this long
  var TOTAL = PAIR_DUR * PAIRS.length;

  function herDur(p) { return p.her.length / HER_CPS; }

  // Frame one anchor: pair one, her line complete, his line part typed.
  var ANCHOR = herDur(PAIRS[0]) + BEAT + 1.6;

  // ---- Script clock: closed-form segments driven by recorded events. ----
  var order = [0, 1, 2, 3, 4, 5];
  var reseedCount = 0;
  var baseScript = ANCHOR, baseReal = 0;
  var dragging = false, dragScript = ANCHOR;
  var asides = [];            // {real: t, idx: n}
  var asideCounter = 0;
  var lastTapT = -10;

  var startMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function nowT() {
    return (typeof performance !== 'undefined' && performance.now) ? (performance.now() - startMs) / 1000 : 0;
  }

  function scriptPos(t) {
    return dragging ? dragScript : baseScript + (t - baseReal);
  }

  function shuffledOrder() {
    var rng = mulberry32(850104 + reseedCount * 7919);
    var a = [0, 1, 2, 3, 4, 5];
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // ---- Interaction (recorded events only; state stays a function of them). ----
  var down = false;
  var downX = 0, downT = 0, downScript = ANCHOR, moved = false;

  function evtX(e) {
    if (e && typeof e.clientX === 'number') return e.clientX;
    if (e && e.touches && e.touches[0]) return e.touches[0].clientX;
    if (e && e.changedTouches && e.changedTouches[0]) return e.changedTouches[0].clientX;
    return 0;
  }

  function onDown(e) {
    var t = nowT();
    down = true;
    downX = evtX(e);
    downT = t;
    downScript = scriptPos(t);
    moved = false;
    dragging = false;
  }

  function onMove(e) {
    if (!down) return;
    if (dragging || Math.abs(evtX(e) - downX) > 6) {
      var v = viewport();
      dragging = true;
      moved = true;
      dragScript = downScript + ((evtX(e) - downX) / Math.max(1, v.w)) * TOTAL;
    }
  }

  function onUp(e) {
    if (!down) return;
    down = false;
    var t = nowT();
    if (dragging) {
      baseScript = dragScript;
      baseReal = t;
      dragging = false;
      moved = false;
      return;
    }
    if (t - downT <= 0.45) {
      // a tap
      if (t - lastTapT <= 0.35) {
        // double-tap: reseed (reshuffle the pair order)
        reseedCount += 1;
        order = shuffledOrder();
        asides = [];
        lastTapT = -10;
      } else {
        asides.push({ real: t, idx: asideCounter % ASIDES.length });
        asideCounter += 1;
        lastTapT = t;
      }
    }
    moved = false;
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('touchstart', onDown);
    canvas.addEventListener('touchmove', onMove);
    canvas.addEventListener('touchend', onUp);
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
  }

  // ---- Layout helpers ----
  function viewport() {
    var vv = window.visualViewport;
    var w = vv && vv.width ? vv.width : window.innerWidth;
    var h = vv && vv.height ? vv.height : window.innerHeight;
    return { w: w, h: h };
  }

  function resize() {
    var v = viewport();
    canvas.width = v.w;
    canvas.height = v.h;
  }

  function wrap(text, maxW) {
    var words = text.split(' ');
    var lines = [];
    var cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width <= maxW || !cur) {
        cur = test;
      } else {
        lines.push(cur);
        cur = words[i];
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // Draw wrapped lines, revealing only the first `budget` characters.
  function drawRevealed(lines, budget, x, firstBaseline, lh) {
    var left = budget;
    ctx.textBaseline = 'alphabetic';
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var show = Math.max(0, Math.min(line.length, left));
      if (show > 0) ctx.fillText(line.substring(0, show), x, firstBaseline + i * lh);
      left -= line.length + 1; // the joining space
      if (left <= 0 && i > 0) { /* remaining lines empty */ }
    }
  }

  // Moustache twitch: live for 0.6 s after Bergamot starts typing.
  function twitch(x) {
    if (x < 0 || x > 0.6) return 0;
    return Math.sin(x * 38) * (1 - x / 0.6);
  }

  function draw(t) {
    var v = viewport();
    var W = v.w, H = v.h;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var scr = window.screen || { width: W, height: H };
    var isPhone = (Math.min(scr.width, scr.height) < 700) || (H > W * 1.15);

    ctx.globalAlpha = 1;
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);

    var divideY = H * 0.5;
    var maxW = isPhone ? W * 0.88 : Math.min(W * 0.80, 860);
    var x0 = (W - maxW) / 2;

    var herSize = isPhone ? Math.max(15, W * 0.046) : Math.max(17, Math.min(24, W * 0.021));
    var hisSize = herSize * 1.18;
    var herLH = herSize * 1.5;
    var hisLH = hisSize * 1.5;

    // ---- script state (closed form in the recorded events and t) ----
    var sp = scriptPos(t);
    var spn = ((sp % TOTAL) + TOTAL) % TOTAL;
    var slot = Math.floor(spn / PAIR_DUR);
    var local = spn - slot * PAIR_DUR;
    var pair = PAIRS[order[slot]];
    var hDur = herDur(pair);
    var hisStart = hDur + BEAT;

    var herChars = Math.floor(Math.max(0, Math.min(1, local / hDur)) * pair.her.length);
    var hisChars = Math.floor(Math.max(0, (local - hisStart) * HIS_CPS));
    if (hisChars > pair.him.length) hisChars = pair.him.length;

    // An active aside overrides the lower register.
    var aside = null;
    for (var i = asides.length - 1; i >= 0; i--) {
      var age = t - asides[i].real;
      if (age >= 0 && age < ASIDE_DUR) { aside = { text: ASIDES[asides[i].idx], age: age }; break; }
    }

    var chipW = Math.max(104, Math.min(176, 0.19 * Math.min(W, H)));
    var chipH = chipW * 0.44;
    var chipGap = chipH * 0.5 + Math.max(14, H * 0.03);

    // ---- her register (thin white, upper) ----
    ctx.font = '300 ' + herSize + 'px system-ui, sans-serif';
    ctx.fillStyle = HER;
    var herLines = wrap(pair.her, maxW);
    var herTop = divideY - chipGap - herLines.length * herLH;
    drawRevealed(herLines, herChars, x0, herTop + herSize, herLH);

    // ---- his register (heavy grey, lower) ----
    ctx.font = '700 ' + hisSize + 'px system-ui, sans-serif';
    ctx.fillStyle = HIM;
    var lowText = aside ? aside.text : pair.him;
    var lowChars = aside
      ? Math.floor(Math.min(1, aside.age * HIS_CPS / lowText.length) * lowText.length)
      : hisChars;
    var hisLines = wrap(lowText, maxW);
    drawRevealed(hisLines, lowChars, x0, divideY + chipGap + hisSize, hisLH);

    // ---- the dividing line ----
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = HIM;
    ctx.fillRect(W * 0.06, divideY - 0.5, W * 0.88, 1);
    ctx.globalAlpha = 1;

    // ---- the moustache chip, centered on the divide ----
    var tw = aside ? twitch(aside.age) : twitch(local - hisStart);
    var cx = W / 2;
    var cy = divideY + tw * 2.2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tw * 0.03);
    ctx.fillStyle = CHIP;
    ctx.fillRect(-chipW / 2, -chipH / 2, chipW, chipH);
    // two black strokes: the moustache
    ctx.strokeStyle = INK;
    ctx.lineWidth = chipH * 0.17;
    ctx.lineCap = 'round';
    var mw = chipW * 0.34, droop = chipH * 0.30;
    ctx.beginPath();
    ctx.moveTo(-2, -chipH * 0.12);
    ctx.quadraticCurveTo(-mw * 0.50, droop, -mw, -chipH * 0.10);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(2, -chipH * 0.12);
    ctx.quadraticCurveTo(mw * 0.50, droop, mw, -chipH * 0.10);
    ctx.stroke();
    ctx.restore();
  }

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(0); });
  }
  window.addEventListener('resize', function () { resize(); draw(0); });

  // Frame one: synchronous, fixed phase (pair one mid-reveal).
  draw(0);

  if (typeof requestAnimationFrame === 'function') {
    var loop = function (now) {
      var t = (typeof now === 'number') ? (now - startMs) / 1000 : 0;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
