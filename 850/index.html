<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№850 Moonflower Collage</title>
<style>
  html, body { margin: 0; padding: 0; background: #101d40; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Moonflower Collage, IA4 / PP1250, study #261 iso-attrill.
  // A flat 2D figure in a pink dress stands on a face-crescent
  // moon against an illustrated navy starfield, a rounded serif
  // title arcing above. Drag slides the figure along the
  // crescent; the moon tilts to follow. Stars twinkle; the
  // moon's face slowly changes expression on a 60 s cycle
  // (smile, sleepy, surprised). No 3D, no gradients, no audio.
  var NAVY = '#101d40';    // deep navy, sky and page ground
  var NAVY_HAIR = '#243a6e'; // figure's hair, a lighter navy
  var CREAM = '#f6ead0';    // cream moon and figure's skin
  var CREAM_DIM = '#e3d2ac'; // moon craters, a dimmer cream
  var PINK = '#f191ac';     // pink dress
  var PINK_DARK = '#d9738f'; // dress hem and waist
  var PINK_LIGHT = '#f7b7c6'; // dress highlight
  var STAR = '#fbf8ef';     // star white and title

  // Fixed-phase first frame: FIRST_T = 10 s. At t = 10 the
  // figure stands partway along the lower arc (angle about
  // 108 degrees), the moon tilts about 6 degrees toward her,
  // and the moon wears its smile expression. Cycle 60 s.
  var FIRST_T = 10;
  var CYCLE = 60;
  var WALK_PERIOD = 48;     // figure's slow walk along the arc
  var SEED = 850;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at
  // load. Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and a fixed salt, so every frame is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function lerp(a, b, f) { return a + (b - a) * f; }
  function smooth(f) { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); }
  function deg2rad(d) { return d * Math.PI / 180; }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    // Centered geometric composition: a square stage on every
    // screen, the page ground the piece's own navy.
    var side = isPhone ? Math.min(vw, vh) : Math.min(vw * 0.8, vh * 0.92);
    stageW = side; stageH = side;
    stageX = (vw - side) / 2; stageY = (vh - side) / 2;
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Geometry, in normalized stage units. Moon center, radius,
  // and the arc the figure walks (angles in canvas degrees,
  // 90 is straight down).
  var MCX = 0.5, MCY = 0.54, MR = 0.30;
  var ARC_MIN = 52, ARC_MAX = 128;

  // The starfield: fixed authored table from the seeded PRNG.
  // Stars keep clear of the moon disc and of the title arc
  // band above it, so the moon and the title read clean.
  var STARS = (function () {
    var rng = mulberry32(SEED);
    var list = [], guard = 0;
    while (list.length < 46 && guard < 600) {
      guard++;
      var x = 0.04 + rng() * 0.92;
      var y = 0.05 + rng() * 0.90;
      var dx = x - MCX, dy = y - MCY;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < 0.36) { continue; }
      if (d < 0.45) {
        var ang = Math.atan2(dy, dx) * 180 / Math.PI;
        if (ang < -20 && ang > -160) { continue; }
      }
      list.push({
        x: x, y: y,
        r: 0.0016 + rng() * 0.0022,
        period: 2.2 + rng() * 2.6,
        phase: rng() * Math.PI * 2,
        bright: list.length < 6
      });
    }
    return list;
  })();

  function starAlpha(s, t) {
    return 0.5 + 0.4 * Math.sin((2 * Math.PI * t) / s.period + s.phase);
  }

  // The figure's walk: a closed-form stroll along the lower
  // arc, phase-shifted so FIRST_T lands her partway along it
  // with the moon mid-tilt.
  function baseAngle(t) {
    return 90 + 26 * Math.sin((2 * Math.PI * (t - 4)) / WALK_PERIOD);
  }

  // Drag state. While dragging, the figure sits at the dragged
  // arc angle. On release, the offset from the loop path eases
  // back to zero over 4 s (smoothstep), a closed-form function
  // of piece time after the release.
  var drag = { active: false, angle: 0, releaseT: -100, releaseOff: 0 };

  function figureAngle(t) {
    if (drag.active) { return drag.angle; }
    var base = baseAngle(t);
    if (drag.releaseT >= 0) {
      var k = (t - drag.releaseT) / 4;
      if (k >= 0 && k < 1) {
        return base + drag.releaseOff * (1 - smooth(k));
      }
    }
    return base;
  }

  // The moon tilts to follow the figure: a third of her arc
  // offset from straight down, about 9 degrees at the ends.
  function tiltRad(t) {
    return deg2rad((figureAngle(t) - 90) * 0.35);
  }

  // The moon's expression: a 60 s cycle, three expressions of
  // 20 s each (smile, sleepy, surprised), blending into the
  // next over the last 4 s of each block. Each expression is a
  // vector [eyeOpen, mouthSmile, browLift]; mouthSmile +1 is a
  // full smile, -1 an open surprised mouth.
  var EXPRESSIONS = [
    [0.05, 1.0, 0.0],    // smile
    [0.45, 0.05, -0.35], // sleepy
    [1.0, -1.0, 0.6]     // surprised
  ];
  function expressionAt(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    var i = Math.floor(p / 20) % 3;
    var next = (i + 1) % 3;
    var m = smooth((p % 20 - 16) / 4);
    var a = EXPRESSIONS[i], b = EXPRESSIONS[next];
    return [
      lerp(a[0], b[0], m),
      lerp(a[1], b[1], m),
      lerp(a[2], b[2], m)
    ];
  }

  // The starfield. Small stars are dots; the six bright ones
  // get a four-point sparkle cross.
  function drawStars(t) {
    var i, s, px, py, r, al;
    for (i = 0; i < STARS.length; i++) {
      s = STARS[i];
      px = s.x * W; py = s.y * H;
      r = s.r * Math.min(W, H);
      al = starAlpha(s, t);
      if (s.bright) {
        var arm = r * 4.2;
        ctx.strokeStyle = hexA(STAR, a4(al * 0.9));
        ctx.lineWidth = Math.max(1, r * 0.9);
        ctx.beginPath(); ctx.moveTo(px - arm, py); ctx.lineTo(px + arm, py); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px, py - arm); ctx.lineTo(px, py + arm); ctx.stroke();
        ctx.fillStyle = hexA(STAR, a4(al));
        ctx.beginPath(); ctx.moveTo(px + r * 1.4, py); ctx.arc(px, py, r * 1.4, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = hexA(STAR, a4(al));
        ctx.beginPath(); ctx.moveTo(px + r, py); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // The arced title, prompt-required artwork text: one short
  // word, rounded serif, arced above the moon. The only
  // in-piece text.
  function drawTitle() {
    var word = 'MOONFLOWER';
    var cx = MCX * W, cy = MCY * H;
    var Rt = 0.42 * Math.min(W, H);
    var fs = Math.round(0.052 * Math.min(W, H));
    ctx.fillStyle = STAR;
    ctx.font = '700 ' + fs + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var span = 118, start = -90 - span / 2;
    var i, a, px, py;
    for (i = 0; i < word.length; i++) {
      a = deg2rad(start + (span * i) / (word.length - 1));
      px = cx + Math.cos(a) * Rt;
      py = cy + Math.sin(a) * Rt;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(a + Math.PI / 2);
      ctx.fillText(word.charAt(i), 0, 0);
      ctx.restore();
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // The moon's face, drawn in the moon frame at the wide left
  // lobe. Eyes, brows, nose, mouth and blush all follow the
  // expression vector; everything is a closed-form function
  // of piece time.
  function drawFace(t) {
    var fx = -0.155 * W, fy = 0.075 * H;
    var ex = 0.021 * W, ey = -0.011 * H;
    var e = expressionAt(t);
    var eyeOpen = e[0], mouthSmile = e[1], browLift = e[2];
    var i, sx;

    // Blush, faint pink on both cheeks.
    ctx.fillStyle = hexA(PINK, a4(0.45));
    for (i = 0; i < 2; i++) {
      sx = (i === 0) ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(fx + sx * 0.030 * W + 0.006 * W, fy + 0.013 * H);
      ctx.arc(fx + sx * 0.030 * W, fy + 0.013 * H, 0.006 * W, 0, Math.PI * 2);
      ctx.fill();
    }

    // Brows: short strokes above the eyes, lifting or drooping
    // with the expression.
    ctx.strokeStyle = NAVY_HAIR;
    ctx.lineWidth = Math.max(1.5, 0.0035 * W);
    ctx.lineCap = 'round';
    for (i = 0; i < 2; i++) {
      sx = (i === 0) ? -1 : 1;
      var bx = fx + sx * ex, by = fy + ey - 0.013 * H - browLift * 0.006 * H;
      ctx.beginPath();
      ctx.moveTo(bx - 0.008 * W, by + browLift * 0.002 * H);
      ctx.lineTo(bx + 0.008 * W, by - browLift * 0.002 * H);
      ctx.stroke();
    }

    // Eyes: navy ellipses whose height is the openness; nearly
    // shut they read as happy closed eyes, wide open as
    // surprise. A cream glint sits in each open eye.
    for (i = 0; i < 2; i++) {
      sx = (i === 0) ? -1 : 1;
      var exx = fx + sx * ex, exy = fy + ey;
      var ry = lerp(0.0012, 0.0085, eyeOpen) * W;
      ctx.fillStyle = NAVY_HAIR;
      ctx.beginPath();
      ctx.ellipse(exx, exy, 0.0068 * W, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      if (eyeOpen > 0.55) {
        ctx.fillStyle = hexA(STAR, a4(0.9));
        ctx.beginPath();
        ctx.moveTo(exx + 0.002 * W + 0.0018 * W, exy - 0.002 * W);
        ctx.arc(exx + 0.002 * W, exy - 0.002 * W, 0.0018 * W, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Nose: one small quiet curve.
    ctx.strokeStyle = NAVY_HAIR;
    ctx.lineWidth = Math.max(1.2, 0.0028 * W);
    ctx.beginPath();
    ctx.moveTo(fx + 0.002 * W, fy + 0.002 * H);
    ctx.quadraticCurveTo(fx + 0.007 * W, fy + 0.006 * H, fx + 0.003 * W, fy + 0.013 * H);
    ctx.stroke();

    // Mouth: a smile arc while mouthSmile is positive, an open
    // oval once it goes negative.
    if (mouthSmile >= 0) {
      ctx.strokeStyle = NAVY_HAIR;
      ctx.lineWidth = Math.max(1.5, 0.0032 * W);
      ctx.beginPath();
      ctx.moveTo(fx - 0.012 * W, fy + 0.020 * H);
      ctx.quadraticCurveTo(fx, fy + (0.020 + 0.011 * mouthSmile) * H, fx + 0.012 * W, fy + 0.020 * H);
      ctx.stroke();
    } else {
      ctx.fillStyle = NAVY_HAIR;
      ctx.beginPath();
      ctx.ellipse(fx, fy + 0.021 * H, 0.006 * W, 0.008 * (-mouthSmile) * W, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // The crescent moon: a cream disc with a navy disc carved
  // out of its upper right, clipped to the disc so no navy
  // overdraw touches the starfield. Three dim craters and the
  // face sit on the wide left lobe.
  function drawMoon(t) {
    var R = MR * Math.min(W, H);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(R, 0); ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = CREAM;
    ctx.fillRect(-R, -R, 2 * R, 2 * R);
    ctx.fillStyle = NAVY;
    ctx.beginPath();
    ctx.moveTo(0.52 * R + 0.86 * R, -0.10 * R);
    ctx.arc(0.52 * R, -0.10 * R, 0.86 * R, 0, Math.PI * 2);
    ctx.fill();
    // Craters, dimmer cream dots on the lobe.
    ctx.fillStyle = CREAM_DIM;
    var craters = [[-0.42, -0.28, 0.045], [-0.18, -0.52, 0.032], [-0.55, 0.18, 0.028]];
    var i;
    for (i = 0; i < craters.length; i++) {
      ctx.beginPath();
      ctx.moveTo(craters[i][0] * R + craters[i][2] * R, craters[i][1] * R);
      ctx.arc(craters[i][0] * R, craters[i][1] * R, craters[i][2] * R, 0, Math.PI * 2);
      ctx.fill();
    }
    drawFace(t);
    ctx.restore();
  }

  // The figure, drawn in the moon frame at her arc angle,
  // standing on the crescent's lower curve with her local up
  // along the radius. Flat collage: pink A-line dress, cream
  // head and limbs, navy bob hair, one arm raised holding a
  // small white moonflower.
  function drawFigure(t) {
    var S = Math.min(W, H);
    var R = MR * S;
    var a = deg2rad(figureAngle(t));
    var fx = Math.cos(a) * R, fy = Math.sin(a) * R;
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(a - Math.PI / 2);

    // Legs and shoes.
    ctx.strokeStyle = CREAM;
    ctx.lineWidth = Math.max(1.5, 0.004 * S);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-0.007 * S, -0.004 * S); ctx.lineTo(-0.007 * S, -0.020 * S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0.007 * S, -0.004 * S); ctx.lineTo(0.007 * S, -0.020 * S); ctx.stroke();
    ctx.fillStyle = PINK_DARK;
    ctx.beginPath(); ctx.ellipse(-0.008 * S, -0.003 * S, 0.007 * S, 0.0035 * S, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.008 * S, -0.003 * S, 0.007 * S, 0.0035 * S, 0, 0, Math.PI * 2); ctx.fill();

    // Dress: A-line, pink, with a darker hem and waist line
    // and a light bodice highlight.
    ctx.fillStyle = PINK;
    ctx.beginPath();
    ctx.moveTo(-0.016 * S, -0.104 * S);
    ctx.lineTo(0.016 * S, -0.104 * S);
    ctx.lineTo(0.038 * S, -0.018 * S);
    ctx.lineTo(-0.038 * S, -0.018 * S);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = PINK_LIGHT;
    ctx.beginPath();
    ctx.moveTo(-0.016 * S, -0.104 * S);
    ctx.lineTo(-0.002 * S, -0.104 * S);
    ctx.lineTo(-0.012 * S, -0.018 * S);
    ctx.lineTo(-0.038 * S, -0.018 * S);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = PINK_DARK;
    ctx.lineWidth = Math.max(1.2, 0.0025 * S);
    ctx.beginPath(); ctx.moveTo(-0.038 * S, -0.018 * S); ctx.lineTo(0.038 * S, -0.018 * S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.024 * S, -0.072 * S); ctx.lineTo(0.024 * S, -0.072 * S); ctx.stroke();

    // Left arm resting along the dress.
    ctx.strokeStyle = CREAM;
    ctx.lineWidth = Math.max(1.5, 0.004 * S);
    ctx.beginPath(); ctx.moveTo(-0.016 * S, -0.098 * S); ctx.lineTo(-0.026 * S, -0.058 * S); ctx.stroke();

    // Right arm raised, holding a small white moonflower.
    ctx.beginPath(); ctx.moveTo(0.016 * S, -0.098 * S); ctx.lineTo(0.036 * S, -0.138 * S); ctx.stroke();
    var hx = 0.038 * S, hy = -0.142 * S, p;
    ctx.fillStyle = STAR;
    for (p = 0; p < 5; p++) {
      var pa = (p / 5) * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(hx + Math.cos(pa) * 0.008 * S + 0.0035 * S, hy + Math.sin(pa) * 0.008 * S);
      ctx.arc(hx + Math.cos(pa) * 0.008 * S, hy + Math.sin(pa) * 0.008 * S, 0.0035 * S, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.moveTo(hx + 0.003 * S, hy); ctx.arc(hx, hy, 0.003 * S, 0, Math.PI * 2); ctx.fill();

    // Neck and head, cream; navy bob hair with a pink flower.
    ctx.fillStyle = CREAM;
    ctx.fillRect(-0.004 * S, -0.118 * S, 0.008 * S, 0.012 * S);
    ctx.beginPath(); ctx.moveTo(0.016 * S, -0.128 * S); ctx.arc(0, -0.128 * S, 0.016 * S, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = NAVY_HAIR;
    ctx.beginPath(); ctx.moveTo(0.017 * S, -0.130 * S); ctx.arc(0, -0.130 * S, 0.017 * S, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
    ctx.fillRect(-0.017 * S, -0.130 * S, 0.004 * S, 0.016 * S);
    ctx.fillRect(0.013 * S, -0.130 * S, 0.004 * S, 0.016 * S);
    ctx.fillStyle = PINK;
    ctx.beginPath(); ctx.moveTo(0.013 * S + 0.003 * S, -0.140 * S); ctx.arc(0.013 * S, -0.140 * S, 0.003 * S, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Flat navy sky.
    ctx.fillStyle = NAVY;
    ctx.fillRect(0, 0, W, H);

    drawStars(t);
    drawTitle();

    // Moon and figure share one rotated frame: the moon tilts
    // to follow the figure, and the figure rides its arc.
    ctx.save();
    ctx.translate(MCX * W, MCY * H);
    ctx.rotate(tiltRad(t));
    drawMoon(t);
    drawFigure(t);
    ctx.restore();

    // Caption, top left, and the hint, bottom center, in the
    // template's place: star white on the navy ground. The
    // arced MOONFLOWER title is separate artwork above the moon.
    var fsCap = Math.round(clamp(W * 0.020, 11, 15));
    var fsDate = Math.round(clamp(W * 0.016, 9, 12));
    var fsHint = Math.round(clamp(W * 0.022, 12, 16));
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = a4(0.8);
    ctx.fillStyle = STAR;
    ctx.font = '600 ' + fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№850 · Moonflower Collage', W * 0.04, H * 0.055);
    ctx.globalAlpha = a4(0.6);
    ctx.font = fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 10', W * 0.04, H * 0.055 + fsDate + 6);
    ctx.textAlign = 'center';
    ctx.globalAlpha = a4(0.85);
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to slide the figure along the moon.', W / 2, H - fsHint * 0.9);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  function canvasPos(e) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (err) {}
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function pointerAngle(nx, ny) {
    var cx = MCX * W, cy = MCY * H;
    var a = Math.atan2(ny - cy, nx - cx) * 180 / Math.PI;
    if (a < 0) { a += 360; }
    return clamp(a, ARC_MIN, ARC_MAX);
  }

  function pointerNearFigure(nx, ny) {
    var S = Math.min(W, H);
    var a = deg2rad(figureAngle(lastT));
    var fx = MCX * W + Math.cos(a) * MR * S;
    var fy = MCY * H + Math.sin(a) * MR * S;
    var dx = nx - fx, dy = ny - fy;
    return Math.sqrt(dx * dx + dy * dy) < 0.11 * S;
  }

  function pointerOnCrescent(nx, ny) {
    var S = Math.min(W, H);
    var dx = nx - MCX * W, dy = ny - MCY * H;
    var r = Math.sqrt(dx * dx + dy * dy) / (MR * S);
    if (r < 0.8 || r > 1.25) { return false; }
    var a = Math.atan2(dy, dx) * 180 / Math.PI;
    if (a < 0) { a += 360; }
    return a >= ARC_MIN - 6 && a <= ARC_MAX + 6;
  }

  function beginDrag(e) {
    var p = canvasPos(e);
    if (!pointerNearFigure(p.x, p.y) && !pointerOnCrescent(p.x, p.y)) { return false; }
    drag.active = true;
    drag.angle = pointerAngle(p.x, p.y);
    drag.releaseT = -100;
    drag.releaseOff = 0;
    return true;
  }

  function endDrag() {
    if (!drag.active) { return; }
    drag.active = false;
    drag.releaseT = lastT;
    drag.releaseOff = drag.angle - baseAngle(lastT);
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      if (beginDrag(e)) {
        try { if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) { canvas.setPointerCapture(e.pointerId); } } catch (err) {}
        try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
        draw(reduced ? FIRST_T : lastT);
      }
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('pointermove', function (e) {
      if (!drag.active) { return; }
      var p = canvasPos(e);
      drag.angle = pointerAngle(p.x, p.y);
      draw(reduced ? FIRST_T : lastT);
    });
    window.addEventListener('pointerup', function () {
      if (!drag.active) { return; }
      endDrag();
      draw(reduced ? FIRST_T : lastT);
    });
    window.addEventListener('pointercancel', function () {
      if (!drag.active) { return; }
      endDrag();
    });
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece850 exposes the loop path, drag state, tilt,
  // expression, and star twinkle for probes.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece850 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      baseAngle: baseAngle,
      figureAngle: figureAngle,
      tiltRad: tiltRad,
      expressionAt: expressionAt,
      starAlpha: function (i, t) { return starAlpha(STARS[i], t); },
      starCount: function () { return STARS.length; },
      dragToAngle: function (a) { drag.active = true; drag.angle = clamp(a, ARC_MIN, ARC_MAX); drag.releaseT = -100; drag.releaseOff = 0; },
      releaseAt: function (t) { drag.active = false; drag.releaseT = t; drag.releaseOff = drag.angle - baseAngle(t); },
      dragging: function () { return drag.active; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the figure strolls the arc on a 48 s period,
  // stars twinkle on 2-5 s periods, the moon's expression turns
  // on a 60 s cycle, all well under the 14 Hz ceiling.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
