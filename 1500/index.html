<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silence Full of History</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e0d0; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var LOOP = 60;
  var CREAM = '#e8e0d0', DUST = '#b8bcc0', GREEN = '#2f4636', WALNUT = '#6b4a3a',
      SLATE = '#4a5a7a', BRICK = '#a8674a', CHARCOAL = '#2a2a30', GOLD = '#d9a441';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1500000);

  function size() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 1280; h = 900; }
    return { w: w, h: h };
  }

  // Seeded tree placements, as fractions of the frame, kept off the road band
  // and away from the house corner and the centre frame.
  var trees = [];
  (function () {
    var spots = [
      [0.10, 0.30, 1.0], [0.22, 0.55, 0.8], [0.30, 0.22, 1.1], [0.52, 0.88, 0.9],
      [0.55, 0.35, 1.0], [0.62, 0.78, 0.85], [0.38, 0.88, 0.9], [0.80, 0.55, 1.0],
      [0.15, 0.72, 0.85], [0.68, 0.25, 0.9]
    ];
    for (var i = 0; i < spots.length; i++) {
      trees.push({ x: spots[i][0], y: spots[i][1], s: spots[i][2] * (0.85 + rnd() * 0.3) });
    }
  })();

  var FIG_COLORS = [SLATE, BRICK, CHARCOAL, SLATE];
  // Figures sit along the road's lower edge, small, never centre frame.
  var FIG_T = [0.18, 0.32, 0.46, 0.60];

  function roadGeom(W, H) {
    // The road ends inside the house footprint so it never pokes past the roof.
    var x0 = 0.02 * W, y0 = 0.94 * H, x1 = 0.80 * W, y1 = 0.20 * H;
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy);
    return { x0: x0, y0: y0, x1: x1, y1: y1, ux: dx / len, uy: dy / len, len: len,
             width: Math.max(10, 0.11 * Math.min(W, H)) };
  }
  function roadPoint(g, t, off) {
    // point at fraction t along the road, offset perpendicular by off px
    var px = -g.uy, py = g.ux;
    return { x: g.x0 + g.ux * g.len * t + px * off, y: g.y0 + g.uy * g.len * t + py * off };
  }

  function tintAt(lt) {
    // Piecewise-linear in loop-local time; exactly 0 at lt=0 and lt=60.
    // Visit 1 (10-22) lifts tint to 0.15; it eases to 0.12 by 30;
    // visit 2 (30-42) lifts it to 0.30; it decays to 0 by 60.
    if (lt < 10) return 0;
    if (lt < 19) return 0.15 * (lt - 10) / 9;
    if (lt < 22) return 0.15;
    if (lt < 30) return 0.15 - 0.03 * (lt - 22) / 8;
    if (lt < 39) return 0.12 + 0.18 * (lt - 30) / 9;
    if (lt < 42) return 0.30;
    return 0.30 * (1 - (lt - 42) / 18);
  }

  function figAlphaAt(lt) {
    // Two visit windows: appear / gesture / fade. 0 outside both.
    var a = 0;
    function win(t0, t1, t2, t3) {
      if (lt < t0 || lt >= t3) return 0;
      if (lt < t1) return (lt - t0) / (t1 - t0);
      if (lt < t2) return 1;
      return 1 - (lt - t2) / (t3 - t2);
    }
    a = Math.max(a, win(10, 13, 19, 22));
    a = Math.max(a, win(30, 33, 39, 42));
    return a;
  }

  function r4(x) { return Math.round(x * 10000) / 10000; }

  function drawScene(lt, W, H) {
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var u = Math.min(W, H);
    var g = roadGeom(W, H);
    var tint = tintAt(lt);
    var fa = figAlphaAt(lt);

    // Field
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, W, H);

    // Road: diagonal band, lower left to upper right
    ctx.strokeStyle = DUST;
    ctx.lineWidth = g.width;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(g.x0, g.y0);
    ctx.lineTo(g.x1, g.y1);
    ctx.stroke();

    // After-image tint on the road: faint gold wash, never a gradient
    if (tint > 0) {
      ctx.strokeStyle = 'rgba(217,164,65,' + r4(tint * 0.45) + ')';
      ctx.lineWidth = g.width;
      ctx.beginPath();
      ctx.moveTo(g.x0, g.y0);
      ctx.lineTo(g.x1, g.y1);
      ctx.stroke();
    }

    // Trees: deep green canopies on trunks, flanking the road
    for (var i = 0; i < trees.length; i++) {
      var t = trees[i];
      var tx = t.x * W, ty = t.y * H, ts = t.s * 0.055 * u;
      ctx.fillStyle = WALNUT;
      ctx.fillRect(tx - ts * 0.08, ty, ts * 0.16, ts * 0.7);
      ctx.fillStyle = GREEN;
      ctx.beginPath();
      ctx.moveTo(tx, ty - ts * 0.9);
      ctx.arc(tx, ty - ts * 0.9, ts * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }

    // House and empty porch, upper right, sized from the min dimension so
    // it never clips on portrait phones.
    var hw = 0.30 * u, hh = 0.24 * u;
    var hx = W - hw - 0.03 * W, hy = 0.06 * H;
    ctx.fillStyle = CREAM;
    ctx.strokeStyle = WALNUT;
    ctx.lineWidth = Math.max(2, 0.004 * u);
    ctx.beginPath();
    ctx.rect(hx, hy, hw, hh);
    ctx.fill();
    ctx.stroke();
    // Roof
    ctx.fillStyle = WALNUT;
    ctx.beginPath();
    ctx.moveTo(hx - hw * 0.06, hy);
    ctx.lineTo(hx + hw * 0.5, hy - hh * 0.45);
    ctx.lineTo(hx + hw * 1.06, hy);
    ctx.closePath();
    ctx.fill();
    // Porch platform and posts, empty
    ctx.fillStyle = WALNUT;
    ctx.fillRect(hx - hw * 0.02, hy + hh, hw * 1.04, hh * 0.10);
    ctx.fillRect(hx + hw * 0.05, hy + hh * 0.45, hw * 0.06, hh * 0.65);
    ctx.fillRect(hx + hw * 0.89, hy + hh * 0.45, hw * 0.06, hh * 0.65);

    // Seated figures along the road's edge, small, never centre frame
    if (fa > 0) {
      var a = r4(fa);
      for (var f = 0; f < 4; f++) {
        var p = roadPoint(g, FIG_T[f], g.width * 0.95);
        var fs = 0.055 * u;
        var col = FIG_COLORS[f];
        // Bench line under the figure
        ctx.fillStyle = WALNUT;
        ctx.globalAlpha = a;
        ctx.fillRect(p.x - fs * 0.9, p.y + fs * 1.15, fs * 1.8, fs * 0.12);
        // Torso
        ctx.fillStyle = col;
        ctx.fillRect(p.x - fs * 0.45, p.y, fs * 0.9, fs * 1.1);
        // Head
        ctx.fillStyle = CREAM;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - fs * 0.35);
        ctx.arc(p.x, p.y - fs * 0.35, fs * 0.38, 0, Math.PI * 2);
        ctx.fill();
        // Dot eye, facing the road (never at the viewer)
        ctx.fillStyle = CHARCOAL;
        ctx.fillRect(p.x + fs * 0.08, p.y - fs * 0.38, Math.max(2, fs * 0.07), Math.max(2, fs * 0.07));
        // Mouth-line opening and closing on a 3 s period (divides the loop)
        var mw = fs * (0.10 + 0.14 * (0.5 + 0.5 * Math.sin(2 * Math.PI * lt / 3 + f)));
        ctx.fillStyle = CHARCOAL;
        ctx.fillRect(p.x - mw / 2, p.y - fs * 0.18, mw, Math.max(1.5, fs * 0.05));
        // Hands moving: two small discs swaying on a 2 s period (divides the loop)
        var sway = Math.sin(2 * Math.PI * lt / 2 + f * 0.9) * fs * 0.22;
        ctx.fillStyle = CREAM;
        ctx.beginPath();
        ctx.moveTo(p.x - fs * 0.55, p.y + fs * 0.45 + sway);
        ctx.arc(p.x - fs * 0.55, p.y + fs * 0.45 + sway, fs * 0.14, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(p.x + fs * 0.55, p.y + fs * 0.45 - sway);
        ctx.arc(p.x + fs * 0.55, p.y + fs * 0.45 - sway, fs * 0.14, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---- interaction: drag along the road scrubs the tint/visit phase ----
  var anchor = 0;      // effectiveTime = elapsed + anchor (mod LOOP)
  var dragging = false, downX = 0, downT = 0, lastElapsed = 0;
  var curW = 0, curH = 0;

  function elapsedNow() { return lastElapsed; }

  function distToRoad(x, y, W, H) {
    var g = roadGeom(W, H);
    var dx = g.x1 - g.x0, dy = g.y1 - g.y0;
    var len2 = dx * dx + dy * dy;
    var t = ((x - g.x0) * dx + (y - g.y0) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    var cx = g.x0 + dx * t, cy = g.y0 + dy * t;
    return Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy));
  }

  function onDown(e) {
    var s = size(); curW = s.w; curH = s.h;
    var x = (e.clientX !== undefined) ? e.clientX : 0;
    var y = (e.clientY !== undefined) ? e.clientY : 0;
    // Only drags starting near the road scrub; other drags are ignored.
    if (distToRoad(x, y, curW, curH) > 0.16 * Math.min(curW, curH)) return;
    dragging = true; downX = x;
    downT = (((elapsedNow() + anchor) % LOOP) + LOOP) % LOOP;
  }
  function onMove(e) {
    if (!dragging) return;
    var x = (e.clientX !== undefined) ? e.clientX : 0;
    var dx = x - downX;
    var scrub = downT + (dx / curW) * LOOP;
    scrub = ((scrub % LOOP) + LOOP) % LOOP;
    anchor = scrub - elapsedNow();
  }
  function onUp() { dragging = false; }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  function drawAt(effT) {
    var s = size();
    var lt = (((effT % LOOP) + LOOP) % LOOP);
    drawScene(lt, s.w, s.h);
    return { lt: lt, tint: tintAt(lt), figAlpha: figAlphaAt(lt) };
  }

  // Boot: frame one = draw(0), constant phase.
  drawAt(0);

  if (typeof window !== 'undefined') {
    window.__piece = {
      drawAt: drawAt,
      tintAt: tintAt,
      figAlphaAt: figAlphaAt,
      loop: LOOP,
      handlers: { down: onDown, move: onMove, up: onUp },
      setElapsed: function (v) { lastElapsed = v; },
      getAnchor: function () { return anchor; }
    };
  }

  // rAF loop, plain function declaration, typeof-guarded.
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var elapsed = (ts - start) / 1000;
    lastElapsed = elapsed;
    drawAt(elapsed + anchor);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
