<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stacked Steel</title>
<style>
  html, body { margin: 0; padding: 0; background: #0E0D0C; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), the only source of variation. No unseeded randomness.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1332000);

  // Sizing: Visual Viewport API first, window size as fallback.
  var W = 0, H = 0, S = 1, phone = false;
  function size() {
    var vw = window.innerWidth, vh = window.innerHeight;
    try {
      if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
    } catch (e) {}
    W = vw; H = vh;
    canvas.width = Math.round(vw); canvas.height = Math.round(vh);
    canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
    var sw = 9999, sh = 9999;
    try {
      if (window.screen) { sw = window.screen.width; sh = window.screen.height; }
    } catch (e) {}
    var minDim = Math.min(sw, sh);
    phone = (minDim < 700) || (vh > vw * 1.15);
    S = Math.min(W, H);
  }
  size();
  try {
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', size);
      window.visualViewport.addEventListener('scroll', size);
    }
  } catch (e) {}
  try { window.addEventListener('resize', size); } catch (e) {}

  // ---- Seeded layout -------------------------------------------------------
  // Six stacked cagelike boxes, slightly offset, never perfectly aligned.
  var NBOX = 6;
  var boxOff = [];   // horizontal offset per box, in units of S
  var boxWob = [];   // slight width wobble per box
  for (var i = 0; i < NBOX; i++) {
    boxOff.push((rng() - 0.5) * 0.055);
    boxWob.push(0.94 + rng() * 0.12);
  }
  // Plants spill from exactly two boxes: box 1 and box 4.
  // Leaves: per-box arrays of seeded leaves along cascading stems.
  function makeLeaves(n, seed) {
    var r = mulberry32(seed), arr = [];
    for (var k = 0; k < n; k++) {
      arr.push({
        along: 0.12 + r() * 0.85,      // position down the stem
        side: r() < 0.5 ? -1 : 1,
        off: r() * 60,                 // phase offset in the 60s growth cycle
        len: 0.16 + r() * 0.14,        // leaf length, units of box height
        hue: 0
      });
    }
    return arr;
  }
  var leaves1 = makeLeaves(9, 1332101);
  var leaves4 = makeLeaves(9, 1332104);
  // Shea blocks: {box, x, y, w, h} in box-local fractions, computed at draw time.
  var sheaHits = [];   // {t, block} touch events on shea blocks
  var blockRects = []; // last drawn shea rects, for hit testing: {x,y,w,h,idx}

  // ---- Interaction state: closed-form functions of recorded events and t ----
  var dragSegs = [];   // {t, dx, dy} committed drag deltas
  var dragging = false, lastX = 0, lastY = 0, dragStartX = 0, dragStartY = 0;
  var liveDX = 0, liveDY = 0;
  function rotOffset(t) {
    var v = liveDX * 0.005;
    for (var i = 0; i < dragSegs.length; i++) {
      var age = t - dragSegs[i].t;
      if (age >= 0) v += dragSegs[i].dx * 0.005 * Math.exp(-age / 2.5);
    }
    return Math.max(-0.6, Math.min(0.6, v));
  }
  function climbOffset(t) {
    var v = liveDY * 0.5;
    for (var i = 0; i < dragSegs.length; i++) {
      var age = t - dragSegs[i].t;
      if (age >= 0) v += dragSegs[i].dy * 0.5 * Math.exp(-age / 2.5);
    }
    return Math.max(-90, Math.min(90, v));
  }
  function slumpFor(block, t) {
    var s = 0;
    for (var i = 0; i < sheaHits.length; i++) {
      if (sheaHits[i].block !== block) continue;
      var age = t - sheaHits[i].t;
      if (age >= 0 && age <= 4) s += Math.sin((age / 4) * Math.PI);
    }
    return Math.min(1, s);
  }
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = pos(e);
    dragging = true; lastX = p.x; lastY = p.y;
    dragStartX = p.x; dragStartY = p.y; liveDX = 0; liveDY = 0;
    // Touch a shea block: it softens, then re-forms.
    for (var i = 0; i < blockRects.length; i++) {
      var b = blockRects[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
        sheaHits.push({ t: pieceNow, block: b.idx });
      }
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = pos(e);
    var dx = p.x - lastX, dy = p.y - lastY;
    lastX = p.x; lastY = p.y;
    dragSegs.push({ t: pieceNow, dx: dx, dy: dy });
    liveDX = p.x - dragStartX; liveDY = p.y - dragStartY;
  });
  function endDrag() { dragging = false; liveDX = 0; liveDY = 0; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  var pieceNow = 0;

  // ---- Drawing helpers ------------------------------------------------------
  function rect(x, y, w, h, fill) {
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w, h);
  }
  function dot(x, y, r, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function ellipse(x, y, rx, ry, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function poly(pts, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
  }
  function line(x1, y1, x2, y2, w, stroke) {
    ctx.strokeStyle = stroke; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  // Books: vertical dark-cloth spines, color and pattern only, never text.
  function drawBooks(x, y, w, h, seed) {
    var r = mulberry32(seed);
    var cols = ['#2A2620', '#3E2F23', '#1F3A2E', '#2A2620', '#3E2F23'];
    var n = 4 + Math.floor(r() * 3);
    var bw = w / n;
    for (var i = 0; i < n; i++) {
      var bx = x + i * bw;
      rect(bx + 1, y, bw - 2, h, cols[Math.floor(r() * cols.length)]);
      // spine bands, pattern only
      rect(bx + 1, y + h * 0.18, bw - 2, Math.max(1, h * 0.03), '#00000055');
      rect(bx + 1, y + h * 0.72, bw - 2, Math.max(1, h * 0.03), '#00000055');
    }
  }

  // Shea block: glowing yellow rounded mass, flat-alpha glow layers (no gradient).
  function drawShea(x, y, w, h, slump, idx) {
    var sq = 1 - 0.28 * slump;      // slump: shorter, wider
    var cx = x + w / 2, cy = y + h / 2;
    var gw = w * (1 + 0.18 * slump), gh = h * sq;
    ellipse(cx, cy, gw * 0.95, gh * 1.05, 'rgba(232,185,60,0.10)');
    ellipse(cx, cy, gw * 0.75, gh * 0.85, 'rgba(232,185,60,0.16)');
    ellipse(cx, cy, gw * 0.58, gh * 0.62, 'rgba(245,212,126,0.20)');
    // body
    var bx = cx - gw / 2, by = y + h - gh;
    rect(bx, by + gh * 0.15, gw, gh * 0.85, '#E8B93C');
    ellipse(cx, by + gh * 0.15, gw / 2, gh * 0.18, '#E8B93C');
    // thumb-print dents
    dot(bx + gw * 0.3, by + gh * 0.5, Math.max(2, gw * 0.05), '#8A5F1A');
    dot(bx + gw * 0.68, by + gh * 0.62, Math.max(2, gw * 0.04), '#8A5F1A');
    // drip frozen mid-run
    rect(bx + gw * 0.78, by + gh * 0.4, Math.max(1.5, gw * 0.05), gh * 0.45, '#E3A92F');
    blockRects.push({ x: bx, y: by, w: gw, h: gh, idx: idx });
  }

  // Shea bust: rough carved head, brow ridge and nose hint only, no eyes.
  function drawBust(x, y, w, h, slump) {
    var cx = x + w / 2;
    var gh = h * (1 - 0.22 * slump), gw = w * (1 + 0.12 * slump);
    ellipse(cx, y + h * 0.52, gw * 0.62, gh * 0.55, 'rgba(232,185,60,0.12)');
    ellipse(cx, y + h * 0.52, gw * 0.45, gh * 0.40, 'rgba(245,212,126,0.18)');
    // cranium + jaw, rough carved planes
    ellipse(cx, y + h * 0.42, gw * 0.34, gh * 0.30, '#E8B93C');
    poly([[cx - gw * 0.30, y + h * 0.55], [cx + gw * 0.30, y + h * 0.55],
          [cx + gw * 0.20, y + h * 0.88], [cx - gw * 0.20, y + h * 0.88]], '#E3A92F');
    // brow ridge + nose hint, deliberately featureless otherwise
    rect(cx - gw * 0.24, y + h * 0.38, gw * 0.48, Math.max(2, h * 0.05), '#8A5F1A');
    poly([[cx - gw * 0.05, y + h * 0.45], [cx + gw * 0.05, y + h * 0.45],
          [cx + gw * 0.02, y + h * 0.62], [cx - gw * 0.02, y + h * 0.62]], '#8A5F1A');
    // shoulders / base block
    rect(cx - gw * 0.42, y + h * 0.86, gw * 0.84, h * 0.14, '#E8B93C');
    blockRects.push({ x: cx - gw * 0.42, y: y + h * 0.10, w: gw * 0.84, h: h * 0.90, idx: 99 });
  }

  // Cascading plant: stems from a clay pot, leaves growing, drooping, replaced.
  // Growth cycle 60 s, closed-form per leaf: age = (t + off) mod 60.
  function drawPlant(px, py, pw, ph, leaves, t) {
    // clay pot
    poly([[px - pw * 0.42, py], [px + pw * 0.42, py],
          [px + pw * 0.32, py + ph * 0.34], [px - pw * 0.32, py + ph * 0.34]], '#7A4A30');
    rect(px - pw * 0.46, py - ph * 0.06, pw * 0.92, ph * 0.08, '#7A4A30');
    // stems + leaves
    for (var i = 0; i < leaves.length; i++) {
      var L = leaves[i];
      var age = (t + L.off) % 60;
      var grow = Math.min(1, age / 20);            // unfurl over 20 s
      if (grow <= 0) continue;
      var droop = age > 40 ? (age - 40) / 20 : 0;  // droop, then replaced at 60
      var stemLen = ph * (0.9 + L.along * 0.9) * grow;
      var sx = px + L.side * pw * 0.18;
      var ex = sx + L.side * pw * (0.55 + L.along * 0.3);
      var ey = py + ph * 0.30 + stemLen * 0.9 + droop * ph * 0.25;
      line(sx, py + ph * 0.28, ex, ey, Math.max(1, pw * 0.03), '#3E5C2E');
      // leaf: paired arcs, moveTo before each arc
      var lx = ex, ly = ey, lr = pw * L.len * grow;
      var droopAng = droop * 1.1 * L.side;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(droopAng);
      ctx.fillStyle = '#3E5C2E';
      ctx.beginPath();
      ctx.moveTo(lr, 0);
      ctx.ellipse(0, 0, lr, lr * 0.38, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawRadio(x, y, w, h) {
    rect(x, y, w, h, '#1F1C1A');
    rect(x + w * 0.08, y + h * 0.12, w * 0.84, h * 0.30, '#2E2A24');
    dot(x + w * 0.22, y + h * 0.27, Math.max(2, w * 0.05), '#B8B4AA');
    dot(x + w * 0.45, y + h * 0.27, Math.max(2, w * 0.05), '#B8B4AA');
    // speaker dots
    for (var i = 0; i < 3; i++)
      for (var j = 0; j < 3; j++)
        dot(x + w * (0.20 + i * 0.28), y + h * (0.55 + j * 0.16), Math.max(1.5, w * 0.03), '#5A6A70');
    line(x + w * 0.80, y + h * 0.05, x + w * 0.95, y - h * 0.18, Math.max(1, w * 0.02), '#B8B4AA');
  }

  // ---- Main draw: frame one is draw(0), the clock starts with the rAF loop --
  function draw(t) {
    pieceNow = t;
    blockRects = [];
    ctx.clearRect(0, 0, W, H);
    rect(0, 0, W, H, '#0E0D0C');

    var rot = rotOffset(t);
    var climb = climbOffset(t);
    var cx = W / 2;
    // Tower geometry: 6 boxes, portrait tower centered.
    var boxH = Math.min(H * 0.135, S * 0.16);
    var boxW = Math.min(W * 0.52, S * 0.52);
    if (phone) boxW = Math.min(W * 0.72, S * 0.72);
    var gap = boxH * 0.10;
    var totalH = NBOX * boxH + (NBOX - 1) * gap;
    var topY = (H - totalH) / 2 + climb;

    // Ground shadow under the totem
    ellipse(cx, topY + totalH + boxH * 0.28, boxW * 0.62, boxH * 0.10, 'rgba(0,0,0,0.55)');
    ellipse(cx, topY + totalH + boxH * 0.28, boxW * 0.40, boxH * 0.06, 'rgba(0,0,0,0.40)');

    // Watering lines run through the tower (thin, top to bottom).
    var wlX = cx - boxW * 0.38;
    line(wlX, topY - boxH * 0.1, wlX, topY + totalH, Math.max(1, S * 0.002), '#5A6A70');
    line(cx + boxW * 0.40, topY - boxH * 0.1, cx + boxW * 0.40, topY + totalH, Math.max(1, S * 0.002), '#5A6A70');

    // Watering drip: one drop falls through the tower every 40 s (closed-form).
    var dripPhase = t % 40;
    var dropY = topY - boxH * 0.1 + (dripPhase / 40) * (totalH + boxH * 0.2);
    var dropX = wlX;
    line(dropX, dropY - boxH * 0.22, dropX, dropY, Math.max(1, S * 0.002), 'rgba(90,106,112,0.7)');
    dot(dropX, dropY, Math.max(2, S * 0.006), '#5A6A70');

    // Boxes drawn bottom-up so upper cages overlap lower ones slightly.
    for (var b = 0; b < NBOX; b++) {
      var by = topY + (NBOX - 1 - b) * (boxH + gap);
      var bx = cx - (boxW * boxWob[b]) / 2 + boxOff[b] * S + Math.sin(rot + b * 0.3) * S * 0.02;
      var bw = boxW * boxWob[b] * (1 - Math.abs(rot) * 0.04);
      var bh = boxH;
      // side face hint for the rotation (pseudo-3D depth)
      if (rot > 0.02) rect(bx + bw, by + bh * 0.06, Math.max(2, bw * 0.03), bh * 0.88, '#0B0A09');
      if (rot < -0.02) rect(bx - Math.max(2, bw * 0.03), by + bh * 0.06, Math.max(2, bw * 0.03), bh * 0.88, '#0B0A09');
      // cage frame: matte black bars
      var bar = Math.max(2, S * 0.008);
      rect(bx, by, bw, bar, '#161514');
      rect(bx, by + bh - bar, bw, bar, '#161514');
      rect(bx, by, bar, bh, '#161514');
      rect(bx + bw - bar, by, bar, bh, '#161514');
      // cage grid: vertical + horizontal bars
      var vBars = 5;
      for (var v = 1; v < vBars; v++) rect(bx + (bw * v) / vBars, by, Math.max(1, bar * 0.5), bh, '#161514');
      rect(bx, by + bh * 0.5, bw, Math.max(1, bar * 0.5), '#161514');
      // inner floor line
      line(bx, by + bh - bar, bx + bw, by + bh - bar, Math.max(1, bar * 0.5), '#2A2620');

      var ix = bx + bar * 2, iy = by + bar * 2, iw = bw - bar * 4, ih = bh - bar * 4;
      if (b === 5) {
        // Near the top: ONLY the shea-butter bust.
        drawBust(ix + iw * 0.22, iy + ih * 0.04, iw * 0.56, ih * 0.92, slumpFor(99, t));
      } else if (b === 4) {
        // Clay pot + cascading plant, plus books.
        drawBooks(ix, iy + ih * 0.55, iw * 0.42, ih * 0.42, 1332401);
        drawPlant(ix + iw * 0.72, iy + ih * 0.02, iw * 0.24, ih * 0.55, leaves4, t);
      } else if (b === 3) {
        // Shea butter blocks.
        drawShea(ix + iw * 0.08, iy + ih * 0.30, iw * 0.34, ih * 0.55, slumpFor(0, t), 0);
        drawShea(ix + iw * 0.54, iy + ih * 0.22, iw * 0.30, ih * 0.48, slumpFor(1, t), 1);
      } else if (b === 2) {
        // Books + small radio.
        drawBooks(ix, iy + ih * 0.30, iw * 0.52, ih * 0.62, 1332202);
        drawRadio(ix + iw * 0.60, iy + ih * 0.35, iw * 0.34, ih * 0.55);
      } else if (b === 1) {
        // Clay pot + cascading plant.
        drawPlant(ix + iw * 0.30, iy + ih * 0.02, iw * 0.26, ih * 0.55, leaves1, t);
        drawBooks(ix + iw * 0.62, iy + ih * 0.45, iw * 0.34, ih * 0.50, 1332101);
      } else {
        // Bottom: books row.
        drawBooks(ix, iy + ih * 0.25, iw, ih * 0.68, 1332000);
      }
    }
  }

  // Frame one, synchronously, at exactly t = 0.
  draw(0);

  // The clock starts with the rAF loop.
  if (typeof requestAnimationFrame === 'function') {
    var start = null;
    (function loop(ts) {
      if (start === null) start = ts;
      var el = (ts - start) / 1000;
      if (document.hidden !== true) draw(el);
      requestAnimationFrame(loop);
    });
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
