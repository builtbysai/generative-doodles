<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Input</title>
<style>
html, body { margin: 0; padding: 0; background: #050508; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BG = [5, 5, 8];
var GRID = [30, 42, 78];
var AMBER = [232, 169, 58];
var HOT = [255, 245, 224];
var RED = [217, 40, 58];
var ASH = [58, 58, 64];
var PHASE = 64.0;
var BUILD_END = 58.0;
var VIRUS_SPEED = 0.45;
var AGENT_CAP = 6;
var DARKNESS = 3.0;
var VIRUS_CAP = 40.0;
var SCALE_DEG = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
var SLOTS = [];
(function () {
  var r, c;
  for (r = 0; r < 3; r++) {
    for (c = 0; c < 9; c++) SLOTS.push({ x: -1.50 + c * 0.375, z: -0.70 + r * 0.60 });
  }
})();
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var drags = [];
var dragId = 1000;
var dragging = false;
var lastDragX = 0, lastDragY = 0;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function minDim() { return Math.min(VW, VH); }
function scaleF() { return minDim() / 900 + 0.4; }
function segmentSchedule(seg) {
  var rng = mulberry32(1591000 + seg * 104729);
  var order = [];
  var i;
  for (i = 0; i < SLOTS.length; i++) order.push(i);
  for (i = order.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  var notes = [];
  var t = 0.0, degIdx = 4, n = 0;
  while (t < BUILD_END) {
    var step = -2 + Math.floor(rng() * 5);
    degIdx = Math.max(0, Math.min(10, degIdx + step));
    notes.push({ time: t, slot: order[n % order.length], deg: SCALE_DEG[degIdx], vel: 0.45 + rng() * 0.55 });
    n++;
    t += 0.8 + rng() * 0.9;
    if (rng() < 0.12) t += 0.8 + rng() * 0.8;
  }
  if (notes.length > 0) {
    notes[0].slot = 13;
    notes[0].deg = 0;
    notes[0].vel = 0.45;
  }
  return { notes: notes, order: order };
}
function towerHeight(deg) { return 0.18 + (deg / 24) * 0.55; }
function ghostTowers(sched) {
  var bySlot = {};
  for (var i = 0; i < sched.notes.length; i++) {
    var n = sched.notes[i];
    bySlot[n.slot] = { id: n.slot, x: SLOTS[n.slot].x, z: SLOTS[n.slot].z, h: towerHeight(n.deg), vel: n.vel, birth: n.time };
  }
  var out = [];
  for (var k in bySlot) out.push(bySlot[k]);
  return out;
}
function towersAt(sg, ct, t) {
  var bySlot = {};
  var notes = sg.sched.notes;
  for (var i = 0; i < notes.length; i++) {
    var n = notes[i];
    if (n.time > ct) break;
    bySlot[n.slot] = { id: n.slot, x: SLOTS[n.slot].x, z: SLOTS[n.slot].z, h: towerHeight(n.deg), vel: n.vel, birth: n.time };
  }
  var out = [];
  for (var k in bySlot) out.push(bySlot[k]);
  for (var d = 0; d < drags.length; d++) {
    var dr = drags[d];
    if (dr.birth >= sg.start && dr.birth <= t) {
      out.push({ id: dr.id, x: dr.x, z: dr.z, h: dr.h, vel: dr.vel, birth: dr.birth - sg.start });
    }
  }
  return out;
}
function simulateVirus(towers, tStart, seed, tNow) {
  var byId = {};
  var live = {};
  var claimed = {};
  var i;
  for (i = 0; i < towers.length; i++) {
    byId[towers[i].id] = towers[i];
    live[towers[i].id] = true;
  }
  var eats = [], flights = [];
  var inFlight = [];
  var events = [];
  function dist(ax, az, bx, bz) {
    var dx = bx - ax, dz = bz - az;
    return Math.sqrt(dx * dx + dz * dz);
  }
  function tallestAt(te) {
    var best = null;
    for (var q = 0; q < towers.length; q++) {
      var tw = towers[q];
      if (!live[tw.id] || claimed[tw.id]) continue;
      if (tw.birth > te) continue;
      if (!best || tw.h > best.h || (tw.h === best.h && tw.id < best.id)) best = tw;
    }
    return best;
  }
  function spawnAgents(fromX, fromZ, fromH, te) {
    var spawned = 0;
    while (inFlight.length < AGENT_CAP) {
      var tgt = tallestAt(te);
      if (!tgt) break;
      claimed[tgt.id] = true;
      var d = dist(fromX, fromZ, tgt.x, tgt.z);
      var arr = te + Math.max(0.4, d / VIRUS_SPEED);
      var ag = { fx: fromX, fz: fromZ, tx: tgt.x, tz: tgt.z, fh: fromH, th: tgt.h, spawnT: te, arrivalT: arr, target: tgt.id };
      flights.push(ag);
      inFlight.push(ag);
      events.push({ time: arr, kind: 'arrive', agent: ag });
      spawned++;
      if (spawned >= 2) break;
    }
  }
  var pz = tallestAt(tStart);
  var collapse = tStart;
  if (!pz) return { eats: eats, flights: flights, collapse: collapse };
  claimed[pz.id] = true;
  events.push({ time: tStart + 1.2, kind: 'eat', id: pz.id, x: pz.x, z: pz.z, h: pz.h });
  var guard = 0;
  while (events.length > 0 && guard < 500) {
    guard++;
    var ei = 0;
    for (var e = 1; e < events.length; e++) if (events[e].time < events[ei].time) ei = e;
    var ev = events.splice(ei, 1)[0];
    if (ev.time > tNow) break;
    if (ev.time > tStart + VIRUS_CAP) {
      for (var id in live) {
        if (live[id]) { eats.push({ id: +id, time: tStart + VIRUS_CAP }); live[id] = false; }
      }
      collapse = tStart + VIRUS_CAP;
      break;
    }
    var tid = ev.kind === 'eat' ? ev.id : ev.agent.target;
    var tx = ev.kind === 'eat' ? ev.x : ev.agent.tx;
    var tz = ev.kind === 'eat' ? ev.z : ev.agent.tz;
    var th = ev.kind === 'eat' ? ev.h : ev.agent.th;
    if (!live[tid]) continue;
    live[tid] = false;
    eats.push({ id: tid, time: ev.time });
    collapse = ev.time;
    if (ev.kind === 'arrive') {
      var ix = inFlight.indexOf(ev.agent);
      if (ix >= 0) inFlight.splice(ix, 1);
    }
    var anyLive = false;
    for (var lid in live) if (live[lid]) { anyLive = true; break; }
    if (!anyLive) break;
    spawnAgents(tx, tz, th, ev.time);
  }
  return { eats: eats, flights: flights, collapse: collapse };
}
var segCache = [];
function segmentAt(t) {
  var start = 0;
  for (var s = 0; ; s++) {
    var sg = segCache[s];
    if (!sg) {
      var sched = segmentSchedule(s);
      var gt = ghostTowers(sched);
      var vir = simulateVirus(gt, BUILD_END, 1591000 + s * 7919, Infinity);
      sg = { index: s, start: start, sched: sched, collapse: vir.collapse, end: vir.collapse + DARKNESS };
      segCache[s] = sg;
    }
    if (t < sg.start + sg.end) return sg;
    start = sg.start + sg.end;
  }
}
function proj(x, y, z, A, horizonY, S) {
  var ca = Math.cos(A), sa = Math.sin(A);
  var xr = x * ca - z * sa;
  var zr = x * sa + z * ca;
  var s = S / (2.6 + zr * 0.5);
  return { x: VW / 2 + xr * s, y: horizonY - (y + zr * 0.45) * s };
}
function drawGrid(A, horizonY, S, alpha) {
  if (alpha <= 0.005) return;
  ctx.strokeStyle = rgba(GRID, alpha);
  ctx.lineWidth = 1.0 * scaleF();
  ctx.beginPath();
  var gx, gz;
  for (gx = -1.65; gx <= 1.651; gx += 0.33) {
    var p0 = proj(gx, 0, -1.15, A, horizonY, S), p1 = proj(gx, 0, 1.15, A, horizonY, S);
    ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
  }
  for (gz = -1.15; gz <= 1.151; gz += 0.23) {
    var q0 = proj(-1.65, 0, gz, A, horizonY, S), q1 = proj(1.65, 0, gz, A, horizonY, S);
    ctx.moveTo(q0.x, q0.y); ctx.lineTo(q1.x, q1.y);
  }
  ctx.stroke();
}
function drawBox(x, z, h, A, horizonY, S, edgeColor, edgeAlpha, topColor, topAlpha, lw, spine) {
  var w2 = 0.075, d2 = 0.075;
  var x0 = x - w2, x1 = x + w2, z0 = z - d2, z1 = z + d2;
  var b0 = proj(x0, 0, z0, A, horizonY, S), b1 = proj(x1, 0, z0, A, horizonY, S),
      b2 = proj(x1, 0, z1, A, horizonY, S), b3 = proj(x0, 0, z1, A, horizonY, S);
  var t0 = proj(x0, h, z0, A, horizonY, S), t1 = proj(x1, h, z0, A, horizonY, S),
      t2 = proj(x1, h, z1, A, horizonY, S), t3 = proj(x0, h, z1, A, horizonY, S);
  ctx.strokeStyle = rgba(edgeColor, edgeAlpha);
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(b0.x, b0.y); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(b3.x, b3.y); ctx.closePath();
  ctx.moveTo(b0.x, b0.y); ctx.lineTo(t0.x, t0.y);
  ctx.moveTo(b1.x, b1.y); ctx.lineTo(t1.x, t1.y);
  ctx.moveTo(b2.x, b2.y); ctx.lineTo(t2.x, t2.y);
  ctx.moveTo(b3.x, b3.y); ctx.lineTo(t3.x, t3.y);
  ctx.stroke();
  if (topColor) {
    ctx.strokeStyle = rgba(topColor, topAlpha);
    ctx.lineWidth = lw * 0.8;
    ctx.beginPath();
    ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y); ctx.closePath();
    if (spine) {
      var bc = proj(x, 0, z, A, horizonY, S), tc = proj(x, h, z, A, horizonY, S);
      ctx.moveTo(bc.x, bc.y); ctx.lineTo(tc.x, tc.y);
    }
    ctx.stroke();
    var tc2 = proj(x, h, z, A, horizonY, S);
    ctx.fillStyle = rgba(topColor, 0.9);
    ctx.fillRect(tc2.x - 1.5 * scaleF(), tc2.y - 1.5 * scaleF(), 3 * scaleF(), 3 * scaleF());
  }
}
function drawTowerBox(tw, ct, A, horizonY, S) {
  var grow = Math.min(1, (ct - tw.birth) / 0.7);
  if (grow <= 0) return;
  var e = 1 - (1 - grow) * (1 - grow);
  var h = tw.h * e;
  if (h <= 0.004) return;
  var breathe = 0.88 + 0.12 * Math.sin(ct * 1.3 + tw.id * 1.7);
  var alpha = (0.45 + 0.50 * tw.vel) * breathe;
  var lw = 1.5 * scaleF() * (isPhone ? 1.3 : 1.0);
  drawBox(tw.x, tw.z, h, A, horizonY, S, AMBER, alpha, HOT, 0.85 * breathe, lw, true);
}
function drawStub(tw, A, horizonY, S) {
  var lw = 1.3 * scaleF() * (isPhone ? 1.3 : 1.0);
  drawBox(tw.x, tw.z, 0.07, A, horizonY, S, ASH, 0.85, null, 0, lw, false);
}
function drawAgentDot(x, y, r, alpha) {
  if (alpha <= 0.01) return;
  ctx.fillStyle = rgba(RED, alpha);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
}
function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = 'rgb(' + BG[0] + ',' + BG[1] + ',' + BG[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var sg = segmentAt(t);
  var ct = t - sg.start;
  var A = 0.22 + 0.004 * t;
  var horizonY = VH * 0.60;
  var S = minDim() * 0.70;
  var dark = ct >= sg.collapse;
  var gridAlpha = dark ? 0.32 * Math.max(0, 1 - (ct - sg.collapse) / 1.0) : 0.32;
  drawGrid(A, horizonY, S, gridAlpha);
  if (dark) return;
  var towers = towersAt(sg, ct, t);
  var stubbed = {};
  var flights = [];
  if (ct >= BUILD_END) {
    var vir = simulateVirus(towers, BUILD_END, 1591000 + sg.index * 7919, ct);
    for (var e = 0; e < vir.eats.length; e++) stubbed[vir.eats[e].id] = vir.eats[e].time;
    flights = vir.flights;
    if (ct < BUILD_END + 1.2) {
      var pz = null;
      for (var pi = 0; pi < towers.length; pi++) {
        var twp = towers[pi];
        if (twp.birth > BUILD_END) continue;
        if (!pz || twp.h > pz.h || (twp.h === pz.h && twp.id < pz.id)) pz = twp;
      }
      if (pz) {
        var pTop = proj(pz.x, pz.h, pz.z, A, horizonY, S);
        drawAgentDot(pTop.x, pTop.y, 5 * scaleF(), 0.25 + 0.65 * ((ct - BUILD_END) / 1.2));
      }
    }
  }
  for (var i = 0; i < towers.length; i++) {
    var tw = towers[i];
    if (stubbed[tw.id] !== undefined) {
      drawStub(tw, A, horizonY, S);
      var eatAge = ct - stubbed[tw.id];
      if (eatAge < 2) {
        var sTop = proj(tw.x, 0.07, tw.z, A, horizonY, S);
        drawAgentDot(sTop.x, sTop.y, 3 * scaleF(), 0.9 * (1 - eatAge / 2));
      }
    } else {
      drawTowerBox(tw, ct, A, horizonY, S);
    }
  }
  for (var f = 0; f < flights.length; f++) {
    var fl = flights[f];
    if (ct < fl.spawnT || ct >= fl.arrivalT) continue;
    var pr = (ct - fl.spawnT) / (fl.arrivalT - fl.spawnT);
    for (var tr = 3; tr >= 0; tr--) {
      var pp = pr - tr * 0.05;
      if (pp < 0) continue;
      var tx2 = fl.fx + (fl.tx - fl.fx) * pp;
      var tz2 = fl.fz + (fl.tz - fl.fz) * pp;
      var ty = (fl.fh + (fl.th - fl.fh) * pp) * 0.8;
      var tp = proj(tx2, ty, tz2, A, horizonY, S);
      var ta = tr === 0 ? 0.95 : (0.55 - tr * 0.15);
      drawAgentDot(tp.x, tp.y, (tr === 0 ? 4.2 : 2.6) * scaleF(), ta);
    }
  }
}
function spawnDragTower(e) {
  var fx = e.clientX / VW, fy = e.clientY / VH;
  var gx = (fx - 0.5) * 3.0;
  var gz = 0.10;
  var degRaw = Math.round((1 - fy) * 24);
  var deg = SCALE_DEG[0], bd = 99;
  for (var i = 0; i < SCALE_DEG.length; i++) {
    var d = Math.abs(SCALE_DEG[i] - degRaw);
    if (d < bd) { bd = d; deg = SCALE_DEG[i]; }
  }
  var h = towerHeight(deg);
  var vel = 0.5 + (1 - fy) * 0.5;
  if (vel > 1) vel = 1;
  drags.push({ id: dragId++, x: gx, z: gz, h: h, vel: vel, birth: lastT });
  if (drags.length > 40) drags.shift();
}
function onPointerDown(e) {
  dragging = true;
  lastDragX = e.clientX; lastDragY = e.clientY;
  spawnDragTower(e);
}
function onPointerMove(e) {
  if (!dragging) return;
  if (Math.abs(e.clientY - lastDragY) > 14 || Math.abs(e.clientX - lastDragX) > 26) {
    lastDragX = e.clientX; lastDragY = e.clientY;
    spawnDragTower(e);
  }
}
function onPointerUp(e) { dragging = false; }
canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
var startT = null;
function loop(ts) {
  if (startT === null) startT = ts;
  var t = PHASE + (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
