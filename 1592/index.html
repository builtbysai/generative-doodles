<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where the Field Concentrates</title>
<style>
html, body { margin: 0; padding: 0; background: #060609; overflow: hidden; }
canvas { display: block; position: absolute; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BG = [6, 6, 9];
var CYAN = [58, 232, 240];
var MAGENTA = [232, 58, 168];
var GOLD = [232, 179, 58];
var WHITE = [245, 240, 232];
var GREY = [150, 150, 160];
var PALETTE = [CYAN, MAGENTA, GOLD, WHITE];
var PHASE = 12.0;
var DT = 1 / 60;
var NP = 800;
var TRAIL = 20;
var TRAIL_STRIDE = 2;
var GRID_N = 20;
var LOOP_N = 8;
var GATHER = 2.0, HOLD = 20.0, DISSOLVE = 3.0;
var LIFE = GATHER + HOLD + DISSOLVE;
var SPAWN_AT = 6.0;
var MARGIN = 0.13;
var SEED = 1592;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, CW = 0, CH = 0, OX = 0, OY = 0, isPhone = false;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
  if (isPhone) {
    CW = VW; CH = VH; OX = 0; OY = 0;
  } else {
    var side = Math.min(VW, VH);
    CW = side; CH = side; OX = (VW - side) / 2; OY = (VH - side) / 2;
  }
  canvas.width = CW; canvas.height = CH;
  canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
  canvas.style.left = OX + 'px'; canvas.style.top = OY + 'px';
}
function scaleF() { return Math.min(CW, CH) / 900 + 0.4; }
// Closed-form analytic flow field: layered sines, no noise tables.
function fieldAngle(u, v, t) {
  return 0.9 * Math.sin(TAU * (1.3 * u + 0.7 * v) + 0.35 * t)
       + 0.7 * Math.sin(TAU * (0.6 * u - 1.1 * v) - 0.22 * t + 1.7)
       + 0.5 * Math.sin(TAU * (2.1 * u - 0.4 * v) + 0.5 * t + 4.0)
       + 0.35 * Math.sin(TAU * (0.3 * u + 2.3 * v) - 0.13 * t + 2.2);
}
function dirAt(u, v, t) {
  var a = fieldAngle(u, v, t);
  return { x: Math.cos(a), y: Math.sin(a) };
}
// Local curvature of the field: how fast the direction vector turns.
function curvatureAt(u, v, t) {
  var e = 0.02;
  var dE = dirAt(u + e, v, t), dW = dirAt(u - e, v, t);
  var dN = dirAt(u, v - e, t), dS = dirAt(u, v + e, t);
  var gx = (dE.x - dW.x) / (2 * e), gy = (dE.y - dW.y) / (2 * e);
  var hx = (dS.x - dN.x) / (2 * e), hy = (dS.y - dN.y) / (2 * e);
  return Math.sqrt(gx * gx + gy * gy + hx * hx + hy * hy);
}
// ---- simulation state (all seeded, fixed-step, deterministic) ----
var rng = mulberry32(SEED);
var particles = [];
var grid = [];
var loops = [];
var simTime = 0;
var stepCount = 0;
var initialSpawnDone = false;
var respawnCounter = 0;
var i, k;
for (i = 0; i < GRID_N * GRID_N; i++) grid.push(0);
for (i = 0; i < NP; i++) {
  var p = {
    u: rng(), v: rng(),
    sp: 0.038 + rng() * 0.024,
    c: i % 4,
    trail: []
  };
  for (k = 0; k < TRAIL; k++) p.trail.push({ u: p.u, v: p.v });
  particles.push(p);
}
function cellIndex(u, v) {
  var cx = Math.floor(u * GRID_N), cy = Math.floor(v * GRID_N);
  if (cx < 0) cx = 0; if (cx >= GRID_N) cx = GRID_N - 1;
  if (cy < 0) cy = 0; if (cy >= GRID_N) cy = GRID_N - 1;
  return cy * GRID_N + cx;
}
function cellCenter(idx) {
  var cx = idx % GRID_N, cy = Math.floor(idx / GRID_N);
  return { u: (cx + 0.5) / GRID_N, v: (cy + 0.5) / GRID_N };
}
// Pick the strongest curvature cell not too close to existing loops or the edge.
// This is the live field measurement that seeds every loop: never a timer,
// never a random position.
function pickSeed(exclude) {
  var order = [];
  for (var i2 = 0; i2 < GRID_N * GRID_N; i2++) order.push(i2);
  order.sort(function (a, b) {
    if (grid[b] !== grid[a]) return grid[b] - grid[a];
    return a - b;
  });
  for (var o = 0; o < order.length; o++) {
    var cc = cellCenter(order[o]);
    if (cc.u < MARGIN || cc.u > 1 - MARGIN || cc.v < MARGIN || cc.v > 1 - MARGIN) continue;
    var ok = true;
    for (var e = 0; e < exclude.length; e++) {
      var du = cc.u - exclude[e].u, dv = cc.v - exclude[e].v;
      if (du * du + dv * dv < 0.16 * 0.16) { ok = false; break; }
    }
    if (!ok) continue;
    var jr = mulberry32(SEED + 511 + respawnCounter * 7919 + o * 104729);
    return { u: cc.u + (jr() - 0.5) * 0.03, v: cc.v + (jr() - 0.5) * 0.03 };
  }
  return { u: 0.5, v: 0.5 };
}
function makeLoop(seedPos, birth, idx) {
  var lr = mulberry32(SEED + 100003 + idx * 7919 + respawnCounter * 104729);
  var wob = [];
  for (var q = 0; q < 48; q++) wob.push(lr() * 2 - 1);
  return {
    u: seedPos.u, v: seedPos.v,
    birth: birth,
    rings: 3 + Math.floor(lr() * 3),
    c: Math.floor(lr() * 4),
    seed: Math.floor(lr() * 100000),
    wob: wob,
    lenFrac: 0.085 + lr() * 0.01
  };
}
function stepOnce() {
  var t = simTime;
  var i2, p, d;
  for (i2 = 0; i2 < NP; i2++) {
    p = particles[i2];
    d = dirAt(p.u, p.v, t);
    p.u += d.x * p.sp * DT;
    p.v += d.y * p.sp * DT;
    var wrapped = false;
    if (p.u < 0) { p.u += 1; wrapped = true; }
    if (p.u >= 1) { p.u -= 1; wrapped = true; }
    if (p.v < 0) { p.v += 1; wrapped = true; }
    if (p.v >= 1) { p.v -= 1; wrapped = true; }
    if (wrapped) {
      // A wrapped particle must not draw a seam-crossing line: restart its trail here.
      for (var wk = 0; wk < p.trail.length; wk++) p.trail[wk] = { u: p.u, v: p.v };
    }
    if (stepCount % TRAIL_STRIDE === 0) {
      p.trail.push({ u: p.u, v: p.v });
      if (p.trail.length > TRAIL) p.trail.shift();
    }
  }
  if (stepCount % 4 === 0) {
    for (i2 = 0; i2 < NP; i2++) {
      p = particles[i2];
      grid[cellIndex(p.u, p.v)] += curvatureAt(p.u, p.v, t);
    }
  }
  for (i2 = 0; i2 < grid.length; i2++) grid[i2] *= 0.998;
  // Drift loops slowly along the field; keep them inside the margin.
  for (i2 = 0; i2 < loops.length; i2++) {
    var lp = loops[i2];
    d = dirAt(lp.u, lp.v, t);
    lp.u += d.x * 0.004 * DT;
    lp.v += d.y * 0.004 * DT;
    if (lp.u < MARGIN) lp.u = MARGIN; if (lp.u > 1 - MARGIN) lp.u = 1 - MARGIN;
    if (lp.v < MARGIN) lp.v = MARGIN; if (lp.v > 1 - MARGIN) lp.v = 1 - MARGIN;
  }
  if (!initialSpawnDone && simTime >= SPAWN_AT) {
    initialSpawnDone = true;
    for (var li = 0; li < LOOP_N; li++) {
      var s = pickSeed(loops);
      loops.push(makeLoop(s, 3.0 - li * 1.5, li));
    }
  } else if (initialSpawnDone) {
    for (var lj = 0; lj < loops.length; lj++) {
      var age = simTime - loops[lj].birth;
      if (age > LIFE) {
        respawnCounter++;
        var others = [];
        for (var m = 0; m < loops.length; m++) if (m !== lj) others.push(loops[m]);
        var ns = pickSeed(others);
        loops[lj] = makeLoop(ns, simTime, lj);
      }
    }
  }
  simTime += DT;
  stepCount++;
}
function advanceTo(t) {
  var n = Math.round((t - simTime) / DT);
  if (n < 0) n = 0;
  for (var s = 0; s < n; s++) stepOnce();
}
// ---- drawing ----
function drawTrail(p) {
  var col = PALETTE[p.c];
  ctx.strokeStyle = rgba(col, 0.5);
  ctx.lineWidth = 1.0 * scaleF();
  ctx.beginPath();
  var first = true;
  for (var i2 = 0; i2 < p.trail.length; i2++) {
    var x = p.trail[i2].u * CW, y = p.trail[i2].v * CH;
    if (first) { ctx.moveTo(x, y); first = false; }
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}
// Stadium-shaped ring: two semicircular caps joined by straight runs,
// every outline point hand-jittered from the loop's seeded wobble table.
function strokeCapsule(cx, cy, L, R, ang, wob, t, seed, alpha, lw, col) {
  var half = L / 2 - R;
  var ca = Math.cos(ang), sa = Math.sin(ang);
  var N = 48;
  ctx.strokeStyle = rgba(col, alpha);
  ctx.lineWidth = lw;
  ctx.beginPath();
  for (var i2 = 0; i2 <= N; i2++) {
    var phi = (i2 % N) / N * TAU;
    var cp = Math.cos(phi), sp = Math.sin(phi);
    var lx, ly;
    if (cp >= 0) { lx = half + R * cp; ly = R * sp; }
    else { lx = -half + R * cp; ly = R * sp; }
    var w = wob[i2 % N] * 1.6 * scaleF() + 0.5 * Math.sin(t * 0.9 + i2 * 0.7 + seed) * scaleF();
    lx += cp * w; ly += sp * w;
    var x = cx + lx * ca - ly * sa;
    var y = cy + lx * sa + ly * ca;
    if (i2 === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
}
function drawLoop(lp, t) {
  var age = t - lp.birth;
  if (age < 0 || age > LIFE) return;
  var alpha, scale;
  if (age < GATHER) {
    var g = age / GATHER;
    var e = g * g * (3 - 2 * g);
    alpha = e; scale = 0.3 + 0.7 * e;
  } else if (age < GATHER + HOLD) {
    alpha = 1; scale = 1;
  } else {
    var d = (age - GATHER - HOLD) / DISSOLVE;
    alpha = 1 - d; scale = 1 + 0.1 * d;
  }
  if (alpha <= 0.01) return;
  var cx = lp.u * CW, cy = lp.v * CH;
  var ang = fieldAngle(lp.u, lp.v, t);
  var L = lp.lenFrac * CW * scale;
  var R = 0.30 * L;
  var col = PALETTE[lp.c];
  for (var pass = 0; pass < 2; pass++) {
    for (var rk = lp.rings - 1; rk >= 0; rk--) {
      var s = 1 - rk * 0.15;
      var ra = alpha * (0.95 - rk * 0.16);
      if (pass === 0) {
        strokeCapsule(cx, cy, L * s, R * s, ang, lp.wob, t, lp.seed, ra * 0.22, 3.4 * scaleF(), col);
      } else {
        strokeCapsule(cx, cy, L * s, R * s, ang, lp.wob, t, lp.seed, ra, 1.1 * scaleF(), col);
      }
    }
  }
}
function drawText() {
  var titlePx = isPhone ? 12 : 15;
  var hintPx = isPhone ? 10 : 12;
  ctx.textBaseline = 'top';
  ctx.font = titlePx + 'px monospace';
  ctx.fillStyle = rgba(WHITE, 0.8);
  ctx.fillText('Where the Field Concentrates', isPhone ? 10 : 16, isPhone ? 10 : 16);
  ctx.fillStyle = rgba(GREY, 0.85);
  var dateStr = '2006 · 05 · 22';
  var dw = ctx.measureText(dateStr).width;
  ctx.fillText(dateStr, CW - dw - (isPhone ? 10 : 16), isPhone ? 10 : 16);
  ctx.font = hintPx + 'px monospace';
  ctx.fillStyle = rgba(GREY, 0.8);
  ctx.fillText('Watch only.', isPhone ? 10 : 16, CH - hintPx - (isPhone ? 10 : 14));
}
function draw(t) {
  advanceTo(t);
  size();
  ctx.fillStyle = 'rgb(' + BG[0] + ',' + BG[1] + ',' + BG[2] + ')';
  ctx.fillRect(0, 0, CW, CH);
  var i2;
  for (i2 = 0; i2 < NP; i2++) drawTrail(particles[i2]);
  for (i2 = 0; i2 < loops.length; i2++) drawLoop(loops[i2], t);
  drawText();
}
var reduced = false;
if (typeof window !== 'undefined' && typeof window.matchMedia === 'function') {
  reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  var startSim = simTime;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
