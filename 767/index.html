<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standing Wall</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #F7F8F8;
    overflow: hidden;
  }
  canvas {
    display: block;
    cursor: grab;
    touch-action: none;
  }
  canvas:active {
    cursor: grabbing;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Strict palette (Larry Bell, Venice Fog family). Nothing outside these
  // anchors is ever drawn; every other color in the piece is a mix, tint,
  // or multiply computed from them and recorded in process.md.
  var SEASALT   = [216, 212, 200];  // #D8D4C8 Sea Salt mist
  var LAPIS     = [46, 74, 122];    // #2E4A7A lapis
  var FRENCH    = [61, 111, 168];   // #3D6FA8 French blue
  var BLIZZARD  = [185, 208, 220];  // #B9D0DC True Blizzard
  var ZINC      = [142, 148, 153];  // #8E9499 zinc
  var CORNFLOWER = [111, 143, 200]; // #6F8FC8 Cornflower

  function lerp(a, b, u) { return a + (b - a) * u; }

  function mix(c1, c2, u) {
    return [lerp(c1[0], c2[0], u), lerp(c1[1], c2[1], u), lerp(c1[2], c2[2], u)];
  }

  function tint(c, u) { // lerp toward white
    return [lerp(c[0], 255, u), lerp(c[1], 255, u), lerp(c[2], 255, u)];
  }

  function mul() { // multiply blend of any number of colors, per channel
    var r = 255, g = 255, b = 255, i, c;
    for (i = 0; i < arguments.length; i++) {
      c = arguments[i];
      r = r * c[0] / 255; g = g * c[1] / 255; b = b * c[2] / 255;
    }
    return [r, g, b];
  }

  function cl(v) { return Math.max(0, Math.min(255, Math.round(v))); }

  function rgbString(c, a) {
    if (typeof a === 'number') {
      return 'rgba(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ',' + a + ')';
    }
    return 'rgb(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ')';
  }

  // Room colors: derived from the mist/Blizzard family only.
  var FAMILY = mix(SEASALT, BLIZZARD, 0.5);
  var ROOM = tint(FAMILY, 0.85);   // near-white gallery wall
  var FLOORC = tint(FAMILY, 0.66); // floor a step deeper than the wall

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---- World -------------------------------------------------------------
  // Three laminated glass panes standing on the floor (y = 0), arranged as
  // a shallow zigzag wall. Each pane: center (x, z), width, yaw, laminate.
  var PANE_H = 3.0;
  var PANES = [
    { cx: -1.02, cz: 0.28, w: 1.95, yaw: 20 * Math.PI / 180, lam: SEASALT },
    { cx: 0.12, cz: -0.02, w: 1.95, yaw: -7 * Math.PI / 180, lam: LAPIS },
    { cx: 1.24, cz: -0.32, w: 1.95, yaw: 16 * Math.PI / 180, lam: FRENCH }
  ];

  // Fixed light: azimuth -38 deg, elevation 52 deg. The light never moves;
  // only the viewer orbits.
  var LIGHT = (function () {
    var az = -38 * Math.PI / 180, el = 52 * Math.PI / 180;
    return [Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)];
  })();

  var CAM_D = 7.6;
  var CAM_Y = 0.9;
  var TARGET = [0.1, 1.75, 0];

  function paneCorners(p) {
    var ux = Math.cos(p.yaw), uz = -Math.sin(p.yaw);
    var hw = p.w / 2;
    var x0 = p.cx - hw * ux, z0 = p.cz - hw * uz;
    var x1 = p.cx + hw * ux, z1 = p.cz + hw * uz;
    return [
      [x0, 0, z0], [x1, 0, z1], [x1, PANE_H, z1], [x0, PANE_H, z0]
    ];
  }

  function paneNormal(p) {
    return [Math.sin(p.yaw), 0, Math.cos(p.yaw)];
  }

  // Thin-film approximation: the interference phase is a sine of the
  // incidence term (pane normal against the half-vector of light and
  // view). Positive phase shifts the laminate toward Cornflower, negative
  // toward Blizzard, never more than 20 percent: a tint, not a recolor.
  function tintedLaminate(p, idx, camPos) {
    var n = paneNormal(p);
    var vx = camPos[0] - p.cx, vy = camPos[1] - PANE_H / 2, vz = camPos[2] - p.cz;
    var vl = Math.sqrt(vx * vx + vy * vy + vz * vz);
    var hx = LIGHT[0] + vx / vl, hy = LIGHT[1] + vy / vl, hz = LIGHT[2] + vz / vl;
    var hl = Math.sqrt(hx * hx + hy * hy + hz * hz);
    var cosT = (n[0] * hx + n[2] * hz) / hl;
    var s = Math.sin(cosT * 4.2 + idx * 1.1);
    if (s > 0) return mix(p.lam, CORNFLOWER, 0.20 * s);
    return mix(p.lam, BLIZZARD, -0.20 * s);
  }

  // ---- Orbit state -------------------------------------------------------
  // theta(t) = dragPart(t) + idle drift. Every term is a closed-form
  // function of recorded pointer samples and t, so any frame, including
  // frame one, is reproducible exactly.
  var IDLE_AMP = 10 * Math.PI / 180;  // +-10 degrees
  var IDLE_PERIOD = 60;               // seconds
  var LAM_INERTIA = 1.6;              // inertia decay rate
  var THETA_MAX = 1.15;               // drag clamp, radians

  var mode = 'idle';                  // 'idle' | 'drag' | 'inertia'
  var dragTDown = 0, dragXDown = 0, dragBase = 0, dragCur = 0;
  var lastX = 0, lastTX = 0, lastVel = 0;
  var relT = 0, relPart = 0, relVel = 0;

  function clockT() {
    var n = (typeof performance !== 'undefined' && performance.now)
      ? performance.now() : 0;
    return n / 1000;
  }
  var clock0 = clockT();
  var startT = 0;

  function eventT() { return startT + (clockT() - clock0); }

  function clampTheta(v) {
    return Math.max(-THETA_MAX, Math.min(THETA_MAX, v));
  }

  function dragPartAt(t) {
    if (mode === 'drag') return dragCur;
    if (mode === 'inertia') {
      return relPart + (relVel / LAM_INERTIA) *
        (1 - Math.exp(-LAM_INERTIA * Math.max(0, t - relT)));
    }
    return 0;
  }

  function thetaAt(t) {
    return dragPartAt(t) + IDLE_AMP * Math.sin(2 * Math.PI * t / IDLE_PERIOD);
  }

  function pointerX(ev) {
    if (typeof ev.clientX === 'number') return ev.clientX;
    if (ev.touches && ev.touches.length) return ev.touches[0].clientX;
    return 0;
  }

  canvas.addEventListener('pointerdown', function (ev) {
    var t = eventT();
    dragBase = dragPartAt(t);
    dragCur = dragBase;
    dragTDown = t;
    dragXDown = pointerX(ev);
    lastX = dragXDown; lastTX = t; lastVel = 0;
    mode = 'drag';
    if (canvas.setPointerCapture && ev.pointerId !== undefined) {
      try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    }
  });

  canvas.addEventListener('pointermove', function (ev) {
    if (mode !== 'drag') return;
    var t = eventT();
    var x = pointerX(ev);
    dragCur = clampTheta(dragBase + (x - dragXDown) * 0.002);
    if (t > lastTX) {
      var v = ((x - lastX) * 0.002) / (t - lastTX);
      lastVel = Math.max(-2.5, Math.min(2.5, v));
    }
    lastX = x; lastTX = t;
  });

  function endDrag() {
    if (mode !== 'drag') return;
    var t = eventT();
    relT = t;
    relPart = dragCur;
    relVel = lastVel;
    // Clamp so the inertia asymptote stays inside the drag range.
    var asym = relPart + relVel / LAM_INERTIA;
    if (asym > THETA_MAX) relVel = (THETA_MAX - relPart) * LAM_INERTIA;
    if (asym < -THETA_MAX) relVel = (-THETA_MAX - relPart) * LAM_INERTIA;
    mode = 'inertia';
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', endDrag);

  // ---- Projection --------------------------------------------------------
  function camera(theta) {
    var pos = [CAM_D * Math.sin(theta), CAM_Y, CAM_D * Math.cos(theta)];
    var fx = TARGET[0] - pos[0], fy = TARGET[1] - pos[1], fz = TARGET[2] - pos[2];
    var fl = Math.sqrt(fx * fx + fy * fy + fz * fz);
    var fwd = [fx / fl, fy / fl, fz / fl];
    // right = cross(fwd, worldUp) = (-fwd.z, 0, fwd.x)
    var r = [-fwd[2], 0, fwd[0]];
    var rl = Math.sqrt(r[0] * r[0] + r[2] * r[2]);
    r = [r[0] / rl, 0, r[2] / rl];
    // up = cross(right, fwd)
    var up = [
      r[1] * fwd[2] - r[2] * fwd[1],
      r[2] * fwd[0] - r[0] * fwd[2],
      r[0] * fwd[1] - r[1] * fwd[0]
    ];
    return { pos: pos, fwd: fwd, right: r, up: up };
  }

  function project(cam, f, p) {
    var dx = p[0] - cam.pos[0], dy = p[1] - cam.pos[1], dz = p[2] - cam.pos[2];
    var vx = dx * cam.right[0] + dy * cam.right[1] + dz * cam.right[2];
    var vy = dx * cam.up[0] + dy * cam.up[1] + dz * cam.up[2];
    var vz = dx * cam.fwd[0] + dy * cam.fwd[1] + dz * cam.fwd[2];
    if (vz < 0.05) vz = 0.05;
    return [W / 2 + f * vx / vz, H / 2 - f * vy / vz];
  }

  // ---- Convex polygon intersection (Sutherland-Hodgman) ------------------
  function signedArea(poly) {
    var a = 0, i, j;
    for (i = 0; i < poly.length; i++) {
      j = (i + 1) % poly.length;
      a += poly[i][0] * poly[j][1] - poly[j][0] * poly[i][1];
    }
    return a / 2;
  }

  function clipPoly(subject, clip) {
    if (!subject.length || !clip.length) return [];
    var orient = signedArea(clip) >= 0 ? 1 : -1;
    var out = subject.slice();
    for (var e = 0; e < clip.length; e++) {
      var a = clip[e], b = clip[(e + 1) % clip.length];
      var inp = out; out = [];
      if (!inp.length) break;
      for (var i = 0; i < inp.length; i++) {
        var p = inp[i], q = inp[(i + 1) % inp.length];
        var cp = orient * ((b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]));
        var cq = orient * ((b[0] - a[0]) * (q[1] - a[1]) - (b[1] - a[1]) * (q[0] - a[0]));
        var inpIn = cp >= -1e-9, qIn = cq >= -1e-9;
        if (inpIn) out.push(p);
        if (inpIn !== qIn) {
          var u = cp / (cp - cq);
          out.push([p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u]);
        }
      }
    }
    return out;
  }

  function pathPoly(poly) {
    ctx.beginPath();
    ctx.moveTo(poly[0][0], poly[0][1]);
    for (var i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
    ctx.closePath();
  }

  function fillPoly(poly, color, alpha) {
    if (poly.length < 3) return;
    pathPoly(poly);
    ctx.fillStyle = rgbString(color, alpha);
    ctx.fill();
  }

  // Point at pane-local (s along width 0..1, v up 0..1), in world coords.
  function panePoint(p, s, v) {
    var ux = Math.cos(p.yaw), uz = -Math.sin(p.yaw);
    var lx = (s - 0.5) * p.w;
    return [p.cx + lx * ux, v * PANE_H, p.cz + lx * uz];
  }

  // ---- Draw ---------------------------------------------------------------
  function draw(t) {
    if (!W || !H) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var theta = thetaAt(t);
    var cam = camera(theta);
    var f = 1.45 * Math.min(W, H);

    // Room wall.
    ctx.fillStyle = rgbString(ROOM);
    ctx.fillRect(0, 0, W, H);

    // Floor: polygon whose top edge is the projected horizon line (two far
    // floor points), bottom corners at the screen's lower corners.
    var gx = cam.pos[0], gz = cam.pos[2];
    var fhx = cam.fwd[0], fhz = cam.fwd[2];
    var fhl = Math.sqrt(fhx * fhx + fhz * fhz);
    fhx /= fhl; fhz /= fhl;
    var rx = cam.right[0], rz = cam.right[2];
    var farL = project(cam, f, [gx - rx * 40 + fhx * 45, 0, gz - rz * 40 + fhz * 45]);
    var farR = project(cam, f, [gx + rx * 40 + fhx * 45, 0, gz + rz * 40 + fhz * 45]);
    ctx.beginPath();
    ctx.moveTo(farL[0], farL[1]);
    ctx.lineTo(farR[0], farR[1]);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = rgbString(FLOORC);
    ctx.fill();
    // Horizon line.
    ctx.beginPath();
    ctx.moveTo(farL[0], farL[1]);
    ctx.lineTo(farR[0], farR[1]);
    ctx.strokeStyle = rgbString(ZINC, 0.22);
    ctx.lineWidth = 1;
    ctx.stroke();

    // Panes: world corners, screen quads, tinted laminates.
    var quads = [], lams = [], i, j, k;
    for (i = 0; i < PANES.length; i++) {
      var corners = paneCorners(PANES[i]);
      var q = [];
      for (j = 0; j < 4; j++) q.push(project(cam, f, corners[j]));
      quads.push(q);
      lams.push(tintedLaminate(PANES[i], i, cam.pos));
    }

    // Floor shadows: each pane's footprint swept away from the fixed
    // light, filled with the dominant pane hue (lapis) in two soft passes.
    var shOff = [-LIGHT[0] * (PANE_H / LIGHT[1]) * 0.8, -LIGHT[2] * (PANE_H / LIGHT[1]) * 0.8];
    for (i = 0; i < PANES.length; i++) {
      var b0 = panePoint(PANES[i], 0, 0), b1 = panePoint(PANES[i], 1, 0);
      var sp = [
        project(cam, f, b0),
        project(cam, f, b1),
        project(cam, f, [b1[0] + shOff[0], 0, b1[2] + shOff[1]]),
        project(cam, f, [b0[0] + shOff[0], 0, b0[2] + shOff[1]])
      ];
      fillPoly(sp, LAPIS, 0.13);
      var sp2 = [
        sp[0], sp[1],
        project(cam, f, [b1[0] + shOff[0] * 0.5, 0, b1[2] + shOff[1] * 0.5]),
        project(cam, f, [b0[0] + shOff[0] * 0.5, 0, b0[2] + shOff[1] * 0.5])
      ];
      fillPoly(sp2, LAPIS, 0.10);
    }

    // Single-pane regions: room light multiplied through one laminate.
    for (i = 0; i < PANES.length; i++) {
      fillPoly(quads[i], mul(ROOM, lams[i]));
    }

    // Pairwise overlaps: exact multiply of room through both laminates.
    var pairPolys = [[null, null, null], [null, null, null], [null, null, null]];
    for (i = 0; i < PANES.length; i++) {
      for (j = i + 1; j < PANES.length; j++) {
        var inter = clipPoly(quads[i], quads[j]);
        pairPolys[i][j] = inter;
        fillPoly(inter, mul(ROOM, lams[i], lams[j]));
      }
    }

    // Triple overlap, if the orbit brings all three together.
    if (pairPolys[0][1] && pairPolys[0][1].length) {
      var tri = clipPoly(pairPolys[0][1], quads[2]);
      fillPoly(tri, mul(ROOM, lams[0], lams[1], lams[2]));
    }

    // Glass dressing, clipped per pane, drawn after the overlap fills:
    // a foot strip (contact shading), a head strip (lit top face of the
    // laminate), and a faint diagonal-free sheen band whose position
    // follows the viewing angle. All alphas are small, so the exact
    // overlap colors underneath stay legible.
    for (i = 0; i < PANES.length; i++) {
      var p = PANES[i];
      ctx.save();
      pathPoly(quads[i]);
      ctx.clip();
      var foot = [panePoint(p, 0, 0), panePoint(p, 1, 0), panePoint(p, 1, 0.14), panePoint(p, 0, 0.14)];
      var footS = [];
      for (j = 0; j < 4; j++) footS.push(project(cam, f, foot[j]));
      fillPoly(footS, ZINC, 0.08);
      var head = [panePoint(p, 0, 0.94), panePoint(p, 1, 0.94), panePoint(p, 1, 1), panePoint(p, 0, 1)];
      var headS = [];
      for (j = 0; j < 4; j++) headS.push(project(cam, f, head[j]));
      fillPoly(headS, [255, 255, 255], 0.08);
      var sheenC = 0.5 + 0.30 * Math.sin(theta * 1.7 + i * 0.9);
      var sh0 = Math.max(0, sheenC - 0.07), sh1 = Math.min(1, sheenC + 0.07);
      var sheen = [panePoint(p, sh0, 0), panePoint(p, sh1, 0), panePoint(p, sh1, 1), panePoint(p, sh0, 1)];
      var sheenS = [];
      for (j = 0; j < 4; j++) sheenS.push(project(cam, f, sheen[j]));
      fillPoly(sheenS, [255, 255, 255], 0.055);
      ctx.restore();
    }

    // Edges: zinc keylines so the pale mist pane stays defined against
    // the white room, and a lighter top edge per pane.
    for (i = 0; i < PANES.length; i++) {
      pathPoly(quads[i]);
      ctx.strokeStyle = rgbString(ZINC, 0.38);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(quads[i][3][0], quads[i][3][1]);
      ctx.lineTo(quads[i][2][0], quads[i][2][1]);
      ctx.strokeStyle = rgbString(tint(lams[i], 0.45), 0.65);
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // Inert QA hook (house convention): ?seed=tNN draws frame one at loop
  // time NN seconds. Without the parameter the piece starts at t = 0.
  var searchStr = (window.location && window.location.search) ||
    (typeof location !== 'undefined' ? location.search : '') || '';
  var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(searchStr);
  if (m) startT = parseFloat(m[1]);

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(startT); });
  }
  window.addEventListener('resize', function () { resize(); draw(startT); });

  // Frame one: the synchronous draw at t = startT (0 in normal viewing:
  // orbit angle 0, wall at rest, two overlap zones showing).
  draw(startT);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts;
      draw(startT + (ts - t0) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
