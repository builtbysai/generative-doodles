<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Band Dissolved into Wine</title>
<style>
  html, body { margin: 0; padding: 0; background: #26241f; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1429000);

  // Per-bottle seeded jitter, fixed at load.
  var ROWS = 25, COLS = 20, NB = ROWS * COLS;
  var jitX = [], jitW = [];
  for (var bi = 0; bi < NB; bi++) {
    jitX.push((rng() - 0.5) * 0.30);
    jitW.push(0.92 + rng() * 0.16);
  }

  var W = 0, H = 0, U = 1, PHONE = false;
  function size() {
    var vv = null;
    if (typeof window !== 'undefined' && window.visualViewport) vv = window.visualViewport;
    if (vv) { W = vv.width; H = vv.height; }
    else if (typeof window !== 'undefined') { W = window.innerWidth; H = window.innerHeight; }
    canvas.width = W; canvas.height = H;
    U = Math.min(W, H) / 720;
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width; sh = window.screen.height; }
    PHONE = (sw > 0 && sh > 0 && Math.min(sw, sh) < 700) || (H > W * 1.15);
    if (typeof document !== 'undefined' && document.body) document.body.style.background = '#26241f';
  }
  size();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener)
      window.visualViewport.addEventListener('resize', size);
    if (window.addEventListener) window.addEventListener('resize', size);
  }

  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  var BG = hexRgb('#26241f');
  // Mix a color toward the dark background by f (0 = full color, 1 = background).
  function mix(hex, f) {
    var c = hexRgb(hex);
    var r = Math.round(BG[0] + (c[0] - BG[0]) * (1 - f));
    var g = Math.round(BG[1] + (c[1] - BG[1]) * (1 - f));
    var b = Math.round(BG[2] + (c[2] - BG[2]) * (1 - f));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function rgba(hex, a) {
    var c = hexRgb(hex);
    var aa = Math.round(a * 10000) / 10000;
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + aa + ')';
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

  // Table geometry: far edge narrow at top, near edge wide at bottom.
  function rowGeom(r) {
    var p = r / (ROWS - 1);
    var y = H * (0.22 + 0.70 * Math.pow(p, 1.35));
    var halfW = W * (0.155 + 0.325 * p);
    return { p: p, y: y, halfW: halfW, step: (2 * halfW) / COLS };
  }
  // Bottle index fills near rows first: i = (ROWS-1-r)*COLS + j.
  function bottleGeom(i) {
    var r = ROWS - 1 - Math.floor(i / COLS);
    var j = i % COLS;
    var g = rowGeom(r);
    var w = g.step * 0.60 * jitW[i];
    var h = w * 2.0;
    var x = W / 2 + (j - (COLS - 1) / 2) * g.step + jitX[i] * w;
    return { r: r, j: j, p: g.p, x: x, y: g.y, w: w, h: h };
  }

  // Schedule: bottle i starts filling at t = i*0.8s, fills over 20s.
  function scheduleFill(i, t) {
    return clamp((t - i * 0.8) / 20, 0, 0.95);
  }
  // Dissolve progress: 0 while the first bottles fill, 1 once 200 bottles have started.
  function dissolveAt(t) {
    return clamp(Math.floor(t / 0.8) / 200, 0, 1);
  }

  // Interaction state: recorded events only, closed-form over t.
  var pours = {};   // bottle index -> { firstFill, total }
  var frags = [];   // {x0,y0,vx,vy,type,birth}
  var active = null; // {bottle, lx, ly}
  function px(e) { return (e.offsetX !== undefined ? e.offsetX : e.clientX); }
  function py(e) { return (e.offsetY !== undefined ? e.offsetY : e.clientY); }
  function nearestBottle(x, y) {
    var best = -1, bestD = 1e9;
    for (var i = 0; i < NB; i++) {
      var g = bottleGeom(i);
      var dx = x - g.x, dy = y - (g.y - g.h * 0.6);
      var d = dx * dx + dy * dy;
      var th = Math.max(g.w * 1.2, 24);
      if (d < th * th && d < bestD) { bestD = d; best = i; }
    }
    return best;
  }
  function onDown(e) {
    var b = nearestBottle(px(e), py(e));
    if (b >= 0) active = { bottle: b, lx: px(e), ly: py(e) };
  }
  function onMove(e) {
    if (!active) return;
    var x = px(e), y = py(e);
    var dist = Math.abs(x - active.lx) + Math.abs(y - active.ly);
    active.lx = x; active.ly = y;
    if (dist <= 0) return;
    var b = active.bottle;
    var g = bottleGeom(b);
    if (!pours[b]) pours[b] = { firstFill: currentFill(b, lastT), total: 0 };
    var room = pours[b].firstFill - pours[b].total - 0.05;
    var amt = Math.min(dist * 0.004, Math.max(room, 0));
    if (amt <= 0) return;
    pours[b].total += amt;
    var types = ['feather', 'note', 'sequin'];
    frags.push({
      x0: g.x, y0: g.y - g.h * 1.1,
      vx: (x - g.x) * 0.4, vy: -30,
      type: types[frags.length % 3], birth: lastT
    });
    if (frags.length > 60) frags.splice(0, frags.length - 60);
  }
  function onUp() { active = null; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);

  var lastT = 0;
  function currentFill(i, t) {
    if (pours[i]) return Math.max(pours[i].firstFill - pours[i].total, 0.05);
    return scheduleFill(i, t);
  }

  function drawBottle(i, t) {
    var g = bottleGeom(i);
    var fade = (1 - g.p) * 0.7; // far end fades into dark
    var fill = currentFill(i, t);
    var bx = g.x - g.w / 2, by = g.y - g.h;
    // Glass body.
    ctx.fillStyle = mix('#c8d4b8', fade);
    ctx.fillRect(bx, by, g.w, g.h);
    // Wine fill, rising from the bottom.
    if (fill > 0.01) {
      ctx.fillStyle = mix('#e8d48a', fade);
      ctx.fillRect(bx, g.y - g.h * fill, g.w, g.h * fill);
    }
    // Neck.
    var nw = g.w * 0.36, nh = g.h * 0.25;
    ctx.fillStyle = mix('#c8d4b8', fade);
    ctx.fillRect(g.x - nw / 2, by - nh, nw, nh);
    // Glint.
    ctx.fillStyle = rgba('#f2efe8', 0.25 + 0.25 * Math.sin(t * 2 + i));
    ctx.fillRect(bx + g.w * 0.18, by + g.h * 0.15, Math.max(1, g.w * 0.12), g.h * 0.5);
  }

  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = '#26241f';
    ctx.fillRect(0, 0, W, H);

    // Table trapezoid, far narrow at top, near wide at bottom.
    ctx.fillStyle = '#6a5138';
    ctx.beginPath();
    ctx.moveTo(W / 2 - W * 0.155, H * 0.20);
    ctx.lineTo(W / 2 + W * 0.155, H * 0.20);
    ctx.lineTo(W / 2 + W * 0.48, H * 0.97);
    ctx.lineTo(W / 2 - W * 0.48, H * 0.97);
    ctx.closePath();
    ctx.fill();
    // Table edge line.
    ctx.fillStyle = '#4a3626';
    ctx.fillRect(W / 2 - W * 0.48, H * 0.965, W * 0.96, Math.max(2, 3 * U));

    // Bottles, far rows first so near rows overlap.
    for (var r = 0; r < ROWS; r++) {
      for (var j = 0; j < COLS; j++) {
        var i = (ROWS - 1 - r) * COLS + j;
        drawBottle(i, t);
      }
    }

    // Feather landing marks: one per 12 s cycle, in the bottle that started that cycle.
    var cycles = Math.floor(t / 12);
    for (var k = 0; k < cycles; k++) {
      var bi = k * 15;
      if (bi >= NB) break;
      var g = bottleGeom(bi);
      ctx.fillStyle = '#e8e2d4';
      ctx.fillRect(g.x - g.w * 0.2, g.y - g.h * 0.6, g.w * 0.4, Math.max(1, g.h * 0.08));
    }

    // Drifting feather: from the costume down into the current bottle.
    var cur = Math.min(NB - 1, Math.floor(t / 0.8));
    var cg = bottleGeom(cur);
    var cx0 = W * 0.80, cy0 = H * 0.70;
    var ph = (t % 12) / 12;
    var fx = lerp(cx0, cg.x, smooth(ph));
    var fy = lerp(cy0, cg.y - cg.h * 1.2, smooth(ph)) - Math.sin(ph * Math.PI) * 40 * U;
    ctx.fillStyle = '#e8e2d4';
    ctx.beginPath();
    ctx.ellipse(fx, fy, Math.max(2, 7 * U), Math.max(1, 3 * U), -0.5, 0, Math.PI * 2);
    ctx.fill();

    var diss = dissolveAt(t);

    // Guitar, left: body + neck thinning into a bottle neck as it dissolves.
    var gx = W * 0.20, gy = H * 0.82, gr = 90 * U;
    ctx.fillStyle = '#1a1712';
    ctx.beginPath();
    ctx.arc(gx, gy, gr, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(gx + gr * 0.55, gy - gr * 0.75, gr * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e8d48a';
    ctx.beginPath();
    ctx.arc(gx, gy, gr * 0.22, 0, Math.PI * 2);
    ctx.fill();
    var nw0 = 26 * U, nw1 = lerp(26 * U, 8 * U, diss);
    var tipX = gx + 150 * U, tipY = gy - 120 * U;
    ctx.fillStyle = '#1a1712';
    ctx.beginPath();
    ctx.moveTo(gx + gr * 0.4, gy - gr * 0.9 - nw0 / 2);
    ctx.lineTo(tipX, tipY - nw1 / 2);
    ctx.lineTo(tipX, tipY + nw1 / 2);
    ctx.lineTo(gx + gr * 0.4, gy - gr * 0.9 + nw0 / 2);
    ctx.closePath();
    ctx.fill();
    // Guitar strings, fading as the neck thins.
    ctx.fillStyle = rgba('#e8e2d4', 0.7 * (1 - diss * 0.8));
    ctx.fillRect(gx - gr * 0.5, gy - gr * 0.15, 170 * U, Math.max(1, 1.5 * U));

    // Drum, center-left: head clouding like wine in glass.
    var dx = W * 0.42, dy = H * 0.86, dr = 70 * U;
    ctx.fillStyle = '#ece8dc';
    ctx.beginPath();
    ctx.arc(dx, dy, dr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba('#e8d48a', 0.85 * diss);
    ctx.beginPath();
    ctx.arc(dx, dy, dr * 0.92, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a1712';
    ctx.lineWidth = Math.max(2, 4 * U);
    ctx.beginPath();
    ctx.arc(dx, dy, dr, 0, Math.PI * 2);
    ctx.stroke();

    // Microphone, center-right: fading as it dissolves.
    var mx = W * 0.60, my = H * 0.82;
    ctx.fillStyle = rgba('#1a1712', 1 - diss * 0.6);
    ctx.fillRect(mx - Math.max(1, 2 * U), my, Math.max(2, 4 * U), 60 * U);
    ctx.beginPath();
    ctx.arc(mx, my - 10 * U, 22 * U, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba('#e8d48a', 0.8 * (1 - diss * 0.5));
    ctx.fillRect(mx - 14 * U, my - 24 * U, 28 * U, Math.max(1, 3 * U));

    // Costume, right: dress shape + feather plume, thinning with dissolve.
    var kx = W * 0.80, ky = H * 0.80;
    ctx.fillStyle = rgba('#e6ddc8', 1 - diss * 0.5);
    ctx.beginPath();
    ctx.moveTo(kx - 30 * U, ky - 60 * U);
    ctx.lineTo(kx + 30 * U, ky - 60 * U);
    ctx.lineTo(kx + 55 * U, ky + 50 * U);
    ctx.lineTo(kx - 55 * U, ky + 50 * U);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgba('#e8e2d4', 1 - diss * 0.4);
    ctx.beginPath();
    ctx.ellipse(kx, ky - 75 * U, 26 * U, 10 * U, -0.4, 0, Math.PI * 2);
    ctx.fill();

    // The count, printed once, small, on a front-bottle label (prompt-specced).
    var lg = bottleGeom(10);
    var lw = lg.w * 1.5, lh = Math.max(10, lg.h * 0.22);
    ctx.fillStyle = '#ece8dc';
    ctx.fillRect(lg.x - lw / 2, lg.y - lg.h * 0.55 - lh / 2, lw, lh);
    ctx.fillStyle = '#26241f';
    ctx.font = '700 ' + Math.max(9, Math.round(11 * U)) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('500', lg.x, lg.y - lg.h * 0.55);

    // Poured fragments, closed-form over recorded drag events.
    for (var f = 0; f < frags.length; f++) {
      var fr = frags[f];
      var age = t - fr.birth;
      var s = Math.min(age, 1.2);
      var px2 = fr.x0 + fr.vx * s;
      var py2 = fr.y0 + fr.vy * s + 30 * s * s;
      if (fr.type === 'feather') {
        ctx.fillStyle = '#e8e2d4';
        ctx.beginPath();
        ctx.ellipse(px2, py2, Math.max(2, 5 * U), Math.max(1, 2 * U), -0.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (fr.type === 'note') {
        ctx.fillStyle = '#e8d48a';
        ctx.fillRect(px2 - 3 * U, py2 - 3 * U, 6 * U, 6 * U);
      } else {
        ctx.fillStyle = '#d4a24e';
        ctx.fillRect(px2 - 2 * U, py2 - 2 * U, 4 * U, 4 * U);
      }
    }
  }

  // Frame one is a constant phase: draw(0) at load, clock starts with the rAF loop.
  draw(0);
  var t0 = null;
  function loop(ts) {
    if (t0 === null) t0 = ts;
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
