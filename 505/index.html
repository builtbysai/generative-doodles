<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cracking Monument</title>
<style>
  html, body { margin: 0; padding: 0; background: #4A1C66; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var VIOLET = '#4A1C66';
  var ORANGE = '#E07B00';
  var MARBLE = '#F2F0EA';
  var INK = '#2A0F3A';

  var PHASE0 = 4.0; // constant loop phase for the synchronous first frame

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- layout ------------------------------------------------------------
  // Stage is a 1080 x 1080 square, letterboxed into the viewport.
  var BASE_CIRCLES = [
    { x: 540, y: 185, r: 92 },   // head
    { x: 540, y: 300, r: 105 },  // chest top
    { x: 505, y: 420, r: 125 },  // chest
    { x: 560, y: 545, r: 118 },  // belly / hips
    { x: 395, y: 360, r: 78 },   // left shoulder mass
    { x: 672, y: 372, r: 80 },   // right shoulder mass
    { x: 452, y: 600, r: 72 },   // standing thigh, foot on plinth top (y=672)
    { x: 640, y: 590, r: 66 }    // broken stump, other leg is the fragment
  ];

  var layout = null;

  function insideBody(circles, x, y, margin) {
    for (var i = 0; i < circles.length; i++) {
      var c = circles[i];
      var dx = x - c.x, dy = y - c.y;
      if (dx * dx + dy * dy < (c.r - margin) * (c.r - margin)) return true;
    }
    return false;
  }

  function makeCrack(rng, circles) {
    for (var attempt = 0; attempt < 24; attempt++) {
      var host = circles[1 + Math.floor(rng() * 5)]; // torso/shoulder hosts
      var a0 = rng() * Math.PI * 2;
      var sx = host.x + Math.cos(a0) * host.r * 0.35;
      var sy = host.y + Math.sin(a0) * host.r * 0.35;
      if (!insideBody(circles, sx, sy, 14)) continue;
      var pts = [{ x: sx, y: sy }];
      var ang = rng() * Math.PI * 2;
      var segs = 3 + Math.floor(rng() * 3); // 3-5 segments
      var ok = true;
      for (var s = 0; s < segs; s++) {
        var len = 46 + rng() * 52;
        var placed = false;
        for (var tries = 0; tries < 6; tries++) {
          var nx = pts[pts.length - 1].x + Math.cos(ang) * len;
          var ny = pts[pts.length - 1].y + Math.sin(ang) * len;
          if (insideBody(circles, nx, ny, 10) && ny < 652) {
            pts.push({ x: nx, y: ny });
            placed = true;
            break;
          }
          ang += 0.7;
        }
        if (!placed) { ok = false; break; }
        ang += (rng() - 0.5) * 1.3;
      }
      if (ok && pts.length >= 4) {
        return { pts: pts, phase: rng() * Math.PI * 2, speed: 0.25 + rng() * 0.3 };
      }
    }
    // fallback: short crack pinned in the chest circle
    var c0 = circles[2];
    return {
      pts: [
        { x: c0.x - 40, y: c0.y - 50 }, { x: c0.x + 5, y: c0.y - 5 },
        { x: c0.x - 18, y: c0.y + 42 }, { x: c0.x + 30, y: c0.y + 78 }
      ],
      phase: 0.8, speed: 0.3
    };
  }

  function buildLayout(seed) {
    var rng = mulberry32(seed);
    var circles = BASE_CIRCLES.map(function (c) {
      return {
        x: c.x + (rng() - 0.5) * 18,
        y: c.y + (rng() - 0.5) * 14,
        r: c.r * (0.96 + rng() * 0.08)
      };
    });
    var cracks = [];
    var nCracks = 5 + Math.floor(rng() * 2); // 5-6 cracks
    for (var i = 0; i < nCracks; i++) cracks.push(makeCrack(rng, circles));

    // newsprint line blocks on the plinth: rows of column line lengths
    var news = [];
    for (var col = 0; col < 4; col++) {
      var colLines = [];
      var rows = 5;
      for (var r = 0; r < rows; r++) colLines.push(0.55 + rng() * 0.42);
      news.push(colLines);
    }

    return {
      circles: circles,
      cracks: cracks,
      news: news,
      prop: Math.floor(rng() * 3), // 0 cup, 1 shoe, 2 wheel (shipped seed rolls the wheel)
      fragX: 742 + (rng() - 0.5) * 30,
      fragPhase: rng() * Math.PI * 2
    };
  }

  var seed = 50561;
  layout = buildLayout(seed);

  // ---- drawing -----------------------------------------------------------
  function drawBody(circles) {
    ctx.beginPath();
    for (var i = 0; i < circles.length; i++) {
      var c = circles[i];
      ctx.moveTo(c.x + c.r, c.y);
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    }
    ctx.fillStyle = MARBLE;
    ctx.fill();
  }

  function drawCrackPath(pts, frac) {
    // total length
    var total = 0, i;
    var lens = [];
    for (i = 1; i < pts.length; i++) {
      var dx = pts[i].x - pts[i - 1].x, dy = pts[i].y - pts[i - 1].y;
      var l = Math.sqrt(dx * dx + dy * dy);
      lens.push(l); total += l;
    }
    var target = total * frac;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    var acc = 0;
    for (i = 1; i < pts.length; i++) {
      if (acc + lens[i - 1] <= target) {
        ctx.lineTo(pts[i].x, pts[i].y);
        acc += lens[i - 1];
      } else {
        var k = (target - acc) / lens[i - 1];
        ctx.lineTo(
          pts[i - 1].x + (pts[i].x - pts[i - 1].x) * k,
          pts[i - 1].y + (pts[i].y - pts[i - 1].y) * k
        );
        break;
      }
    }
    ctx.strokeStyle = INK;
    ctx.lineWidth = 5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function drawGridFloor() {
    ctx.fillStyle = ORANGE;
    ctx.fillRect(0, 756, 1080, 1080 - 756);
    ctx.strokeStyle = VIOLET;
    ctx.lineWidth = 2;
    ctx.beginPath();
    var p;
    for (p = 0; p <= 1080; p += 18) {
      ctx.moveTo(p + 0.5, 756); ctx.lineTo(p + 0.5, 1080);
    }
    for (p = 756; p <= 1080; p += 18) {
      ctx.moveTo(0, p + 0.5); ctx.lineTo(1080, p + 0.5);
    }
    ctx.stroke();
  }

  function drawPlinth(news) {
    ctx.fillStyle = MARBLE;
    ctx.fillRect(240, 670, 600, 46);  // upper slab, top at figure feet
    ctx.fillRect(190, 716, 700, 70);  // lower slab
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3;
    ctx.strokeRect(240, 670, 600, 46);
    ctx.strokeRect(190, 716, 700, 70);
    // glyph-like newsprint columns on the lower slab face
    ctx.strokeStyle = INK;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 5;
    ctx.lineCap = 'butt';
    var colW = 700 / 4;
    for (var col = 0; col < 4; col++) {
      var x0 = 190 + col * colW + 16;
      var maxLen = colW - 32;
      for (var r = 0; r < 5; r++) {
        var y = 732 + r * 11;
        if (y > 778) break;
        ctx.beginPath();
        ctx.moveTo(x0, y);
        ctx.lineTo(x0 + maxLen * news[col][r], y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawProp(kind, x, y) {
    ctx.strokeStyle = INK;
    ctx.fillStyle = INK;
    ctx.lineWidth = 5;
    if (kind === 2) {
      // bicycle wheel, squashed flat under the fragment
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(1, 0.72);
      ctx.beginPath(); ctx.arc(0, 0, 27, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 3;
      for (var i = 0; i < 3; i++) {
        var a = i * Math.PI * 2 / 3 + 0.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * 25, Math.sin(a) * 25);
        ctx.stroke();
      }
      ctx.restore();
    } else if (kind === 0) {
      // cup
      ctx.beginPath();
      ctx.moveTo(x - 22, y - 16);
      ctx.lineTo(x + 22, y - 16);
      ctx.lineTo(x + 15, y + 18);
      ctx.lineTo(x - 15, y + 18);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath(); ctx.arc(x + 27, y - 2, 9, -Math.PI / 2, Math.PI / 2); ctx.stroke();
    } else {
      // shoe
      ctx.beginPath();
      ctx.moveTo(x - 28, y + 14);
      ctx.lineTo(x - 28, y - 8);
      ctx.quadraticCurveTo(x - 4, y - 2, x + 16, y + 6);
      ctx.quadraticCurveTo(x + 30, y + 10, x + 28, y + 14);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 30, y + 18); ctx.lineTo(x + 30, y + 18); ctx.stroke();
    }
  }

  function drawFragment(t) {
    var fx = layout.fragX, fy = 908;
    var ang = 0.06 * Math.sin(t * 0.8 + layout.fragPhase);
    // crushed prop first, sticking out from under the fragment
    drawProp(layout.prop, fx + 6, fy + 52);
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(48, 0); ctx.arc(0, 0, 48, 0, Math.PI * 2);
    ctx.moveTo(30, 26); ctx.arc(30, 26, 33, 0, Math.PI * 2);
    ctx.fillStyle = MARBLE;
    ctx.fill();
    // a crack across the fragment
    ctx.beginPath();
    ctx.moveTo(-38, -18);
    ctx.lineTo(-8, 2);
    ctx.lineTo(-20, 26);
    ctx.lineTo(8, 40);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    var vv0 = window.visualViewport;
    var cssW = vv0 ? vv0.width : window.innerWidth;
    var cssH = vv0 ? vv0.height : window.innerHeight;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    var w = canvas.width, h = canvas.height;
    ctx.fillStyle = VIOLET;
    ctx.fillRect(0, 0, w, h);
    var s = Math.min(w, h) / 1080;
    var ox = (w - 1080 * s) / 2, oy = (h - 1080 * s) / 2;
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.rect(0, 0, 1080, 1080);
    ctx.clip();

    drawGridFloor();
    drawPlinth(layout.news);
    drawFragment(t);
    drawBody(layout.circles);
    for (var i = 0; i < layout.cracks.length; i++) {
      var cr = layout.cracks[i];
      var g = 0.8 + 0.2 * (0.5 + 0.5 * Math.sin(t * cr.speed + cr.phase));
      drawCrackPath(cr.pts, g);
    }

    ctx.restore();
  }

  // ---- sizing ------------------------------------------------------------
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    draw(currentT);
  }

  // phone detection per house rule (screen physical size, aspect fallback)
  var isPhone = (function () {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0 && minDim < 700) return true;
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return h > w * 1.15;
  })();
  void isPhone; // composition is a centered square stage at every size

  window.addEventListener('resize', resize);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }

  // ---- interaction: double-tap reseeds ------------------------------------
  var lastTap = 0;
  function onTap() {
    var now = performanceNow();
    if (now - lastTap < 320) {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      layout = buildLayout(seed);
      draw(currentT);
      lastTap = 0;
    } else {
      lastTap = now;
    }
  }
  function performanceNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return lastTap + 1000; // renderer fallback: never triggers a reseed
  }
  if (canvas.addEventListener) canvas.addEventListener('pointerdown', onTap);

  // ---- loop ----------------------------------------------------------------
  var currentT = PHASE0;
  resize(); // synchronous first frame at the constant phase
  draw(PHASE0);

  if (typeof requestAnimationFrame === 'function') {
    var startStamp = null;
    var frame = function (ts) {
      if (startStamp === null) startStamp = ts;
      currentT = PHASE0 + (ts - startStamp) / 1000;
      draw(currentT);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
