<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dune Hatches</title>
<style>
html, body { margin: 0; padding: 0; background: #F6F0DF; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F6F0DF';
var PLATE = '#17120F';
var PLATE_LINE = 'rgba(232,93,61,0.55)';
var TITLE_INK = '#F6F0DF';
var HINT_INK = '#E8A49A';
var TEAL = '#0E7C7B';
var TEAL_DEEP = '#0A5E5D';
var CORAL = '#E85D3D';
var CREAM = '#F6F0DF';
var PERIOD = 16;
var FRAME_T = 3.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1716);
var phaseT = FRAME_T;
/* ---- spine: quadratic Bezier, diagonal from lower-left edge to upper-right edge ---- */
var P0 = { x: 0.02, y: 0.84 };
var P2 = { x: 0.98, y: 0.16 };
/* control point flexes with piece time; flex is a closed-form function of phaseT */
function spineCtrl(t) {
  var f = Math.sin(TAU * t / PERIOD);
  var f2 = Math.sin(TAU * t / PERIOD + 1.3);
  return { x: 0.50 + 0.06 * f2, y: 0.52 + 0.16 * f };
}
function spinePoint(u, t) {
  var c = spineCtrl(t);
  var a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, d = u * u;
  return { x: a * P0.x + b * c.x + d * P2.x, y: a * P0.y + b * c.y + d * P2.y };
}
function spineTangent(u, t) {
  var c = spineCtrl(t);
  var dx = 2 * (1 - u) * (c.x - P0.x) + 2 * u * (P2.x - c.x);
  var dy = 2 * (1 - u) * (c.y - P0.y) + 2 * u * (P2.y - c.y);
  var m = Math.sqrt(dx * dx + dy * dy) || 1;
  return { x: dx / m, y: dy / m };
}
/* ---- seeded hatch parameters only; every hatch position is recomputed each frame ---- */
var HATCHES = 2400;
var hatches = [];
var i;
for (i = 0; i < HATCHES; i++) {
  var denseSide = rng() < 0.74; /* dense below the spine, sparse above */
  var f = denseSide ? Math.pow(rng(), 1.3) : 0.25 + Math.pow(rng(), 1.4) * 0.75;
  hatches.push({
    u: rng(),
    side: denseSide ? 1 : -1,
    f: f,                                   /* distance from spine, 0 near, 1 far */
    jit: (rng() - 0.5) * 0.30,              /* dash angle jitter, radians */
    len: 0.55 + rng() * 0.45,               /* length factor */
    a: 0.45 + rng() * 0.5,                  /* alpha */
    dot: rng() < 0.22                       /* tiny dotted noise rides this dash */
  });
}
/* ---- coral arcs: three long curves arcing high over the fan ---- */
var ARCS = 3;
var arcs = [];
for (i = 0; i < ARCS; i++) {
  arcs.push({
    x0: 0.04 + rng() * 0.10,
    y0: 0.30 + i * 0.16 + rng() * 0.04,
    x2: 0.86 + rng() * 0.10,
    y2: 0.06 + i * 0.10 + rng() * 0.04,
    cx: 0.48 + (rng() - 0.5) * 0.10,
    cy: -0.16 - i * 0.10 - rng() * 0.06,     /* control point above the frame */
    w: 1.6 + rng() * 1.2,
    a: 0.55 + rng() * 0.30,
    ph: rng() * TAU
  });
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var sw = st.w, sh = st.h;
  var t = phaseT;
  var maxD = sh * 0.42; /* farthest hatch reach from the spine */
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, sw, sh);
  ctx.clip();
  var k, h, sp, tg, nx, ny, px, py, dx, dy, len, al;
  /* ---- coral arcs first, so the dash fan overlaps their lower ends ---- */
  for (k = 0; k < ARCS; k++) {
    var ar = arcs[k];
    var sway = 0.03 * Math.sin(TAU * t / PERIOD + ar.ph);
    var ax0 = st.x + ar.x0 * sw, ay0 = st.y + ar.y0 * sh;
    var ax2 = st.x + ar.x2 * sw, ay2 = st.y + ar.y2 * sh;
    var acx = st.x + (ar.cx + sway) * sw, acy = st.y + (ar.cy + sway * 0.6) * sh;
    ctx.beginPath();
    ctx.moveTo(ax0, ay0);
    ctx.quadraticCurveTo(acx, acy, ax2, ay2);
    ctx.lineWidth = Math.max(1.2, sh * 0.0022 * ar.w);
    ctx.strokeStyle = rgba(CORAL, ar.a);
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  /* ---- the spine itself: a slightly heavier teal curve ---- */
  var c0 = spineCtrl(t);
  ctx.beginPath();
  ctx.moveTo(st.x + P0.x * sw, st.y + P0.y * sh);
  ctx.quadraticCurveTo(st.x + c0.x * sw, st.y + c0.y * sh, st.x + P2.x * sw, st.y + P2.y * sh);
  ctx.lineWidth = Math.max(1.5, sh * 0.003);
  ctx.strokeStyle = rgba(TEAL_DEEP, 0.9);
  ctx.lineCap = 'round';
  ctx.stroke();
  /* ---- hatches: short dashes perpendicular to the spine, pure function of spine shape ---- */
  ctx.lineCap = 'round';
  for (k = 0; k < hatches.length; k++) {
    h = hatches[k];
    sp = spinePoint(h.u, t);
    tg = spineTangent(h.u, t);
    nx = -tg.y; ny = tg.x; /* spine normal */
    var d = h.f * maxD;
    px = st.x + sp.x * sw + nx * d * h.side;
    py = st.y + sp.y * sh + ny * d * h.side;
    /* dash runs along the normal, jittered; length and alpha thin out with distance */
    var ang = Math.atan2(ny, nx) + h.jit;
    len = (sh * 0.016 * h.len) * (1 - 0.55 * h.f);
    al = h.a * (1 - 0.45 * h.f);
    if (al <= 0.01) continue;
    dx = Math.cos(ang) * len / 2; dy = Math.sin(ang) * len / 2;
    ctx.beginPath();
    ctx.moveTo(px - dx, py - dy);
    ctx.lineTo(px + dx, py + dy);
    ctx.lineWidth = Math.max(0.8, sh * 0.0016);
    ctx.strokeStyle = rgba(h.f > 0.85 ? TEAL_DEEP : TEAL, al);
    ctx.stroke();
    if (h.dot) {
      var dr = Math.max(0.7, sh * 0.0011);
      ctx.fillStyle = rgba(TEAL_DEEP, al * 0.8);
      ctx.fillRect(px + dx - dr, py + dy - dr, dr * 2, dr * 2);
    }
  }
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Dune Hatches').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Dune Hatches').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 23').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Dune Hatches', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 23', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    hatchCount: function () { return HATCHES; },
    spineCtrl: function (t) { return spineCtrl(t); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 3.0s of a 16s period, spine near full flex ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
