<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flag</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1C1A16; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
try { if (typeof document !== 'undefined' && document.body){ document.body.style.background = '#1C1A16'; } } catch (e) {}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

var PAGE = '#E4DCC8', SHADE = '#CFC4A8', DASH = '#8A8272',
    VERMILION = '#B03A2E', BAR = '#3A3A3E', GROUND = '#1C1A16';

var W = 0, H = 0;
function size(){
  var vw = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport.width : window.innerWidth;
  var vh = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport.height : window.innerHeight;
  W = vw; H = vh;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
size();
var currentT = 0;
if (typeof window !== 'undefined'){
  if (window.visualViewport && window.visualViewport.addEventListener){ window.visualViewport.addEventListener('resize', function(){ size(); draw(currentT); }); }
  if (window.addEventListener){ window.addEventListener('resize', function(){ size(); draw(currentT); }); }
}

/* Wall geometry: 4x3 grid of pages filling ~80% of frame. */
function wallGeom(){
  var wallW = 0.8 * W, wallH = 0.8 * H;
  var wx = (W - wallW) / 2, wy = (H - wallH) / 2;
  var g = Math.max(6, W * 0.012);
  var pw = (wallW - 3 * g) / 4, ph = (wallH - 2 * g) / 3;
  return { wx: wx, wy: wy, wallW: wallW, wallH: wallH, g: g, pw: pw, ph: ph };
}
function pageRect(i, gm){
  var col = i % 4, row = Math.floor(i / 4);
  return { x: gm.wx + col * (gm.pw + gm.g), y: gm.wy + row * (gm.ph + gm.g), w: gm.pw, h: gm.ph };
}

/* One page: flat paper, shade strip, ~14 rows of pseudo-text dashes.
   Dashes only, varying lengths, never letterforms. Seeded per page,
   so the layout is identical on every draw at a given geometry. */
function drawPage(i, gm){
  var r = pageRect(i, gm);
  ctx.fillStyle = PAGE;
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = SHADE;
  ctx.fillRect(r.x, r.y + r.h - 3, r.w, 3);
  var rng = mulberry32(1350000 + i * 7919);
  var my = r.h * 0.06, rowH = (r.h - 2 * my) / 14;
  var dashH = Math.max(2, r.h * 0.008);
  ctx.fillStyle = DASH;
  for (var row = 0; row < 14; row++){
    var y = r.y + my + row * rowH + rowH * 0.3;
    var cx = r.x + r.w * 0.08;
    if (rng() < 0.3){ cx += r.w * 0.15 * rng(); }
    var right = r.x + r.w * 0.92;
    if (rng() < 0.10){
      var len0 = r.w * (0.08 + rng() * 0.25);
      ctx.fillRect(cx, y, Math.min(len0, right - cx), dashH);
      continue;
    }
    var guard = 0;
    while (cx < right && guard++ < 12){
      var len = r.w * (0.05 + rng() * 0.20);
      if (cx + len > right){ len = right - cx; }
      ctx.fillRect(cx, y, len, dashH);
      cx += len + r.w * (0.02 + rng() * 0.06);
      if (rng() < 0.08){ break; }
    }
  }
}

/* Emblem: 2-3 distinct primitives from a family of 6 invented marks,
   seeded by pass variant. Flat vermilion, never a real symbol. */
function drawEmblem(cx, cy, s, variant){
  var rng = mulberry32(1351000 + variant * 7919);
  var pool = [0, 1, 2, 3, 4, 5];
  var count = 2 + Math.floor(rng() * 2);
  var picked = [];
  for (var k = 0; k < count; k++){
    var j = Math.floor(rng() * pool.length);
    picked.push(pool.splice(j, 1)[0]);
  }
  var r = s * 0.30;
  ctx.fillStyle = VERMILION;
  ctx.strokeStyle = VERMILION;
  ctx.lineWidth = s * 0.09;
  for (var p = 0; p < picked.length; p++){
    var prim = picked[p];
    if (prim === 0){
      ctx.beginPath();
      ctx.moveTo(cx + r, cy);
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
    } else if (prim === 1){
      ctx.fillRect(cx - s * 0.36, cy - s * 0.05, s * 0.72, s * 0.10);
    } else if (prim === 2){
      var gap = s * 0.08;
      ctx.beginPath();
      ctx.moveTo(cx - r, cy - gap / 2);
      ctx.arc(cx, cy - gap / 2, r, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - r, cy + gap / 2);
      ctx.arc(cx, cy + gap / 2, r, 0, Math.PI);
      ctx.closePath();
      ctx.fill();
    } else if (prim === 3){
      ctx.fillRect(cx - s * 0.05, cy - s * 0.36, s * 0.10, s * 0.72);
    } else if (prim === 4){
      ctx.beginPath();
      ctx.moveTo(cx + r * Math.cos(-0.35 * Math.PI), cy + r * Math.sin(-0.35 * Math.PI));
      ctx.arc(cx, cy, r, -0.35 * Math.PI, 0.35 * Math.PI);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + r * Math.cos(0.65 * Math.PI), cy + r * Math.sin(0.65 * Math.PI));
      ctx.arc(cx, cy, r, 0.65 * Math.PI, 1.35 * Math.PI);
      ctx.stroke();
    } else if (prim === 5){
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-s * 0.36, -s * 0.05, s * 0.72, s * 0.10);
      ctx.restore();
    }
  }
}

function easeInOut(t){ return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }

/* Loop state machine, a pure function of piece time + recorded taps.
   Cycle (25 s): full 4 -> pass 3 -> dwell 1 -> hold 5 -> regen 8 -> rest 4.
   A tap outside a pass starts an early pass with a fresh emblem variant. */
var DUR = { full: 4, pass: 3, dwell: 1, hold: 5, regen: 8, rest: 4 };
var NEXT = { full: 'pass', pass: 'dwell', dwell: 'hold', hold: 'regen', regen: 'rest', rest: 'full' };
var taps = [];

function simulate(t){
  var state = 'full', stateStart = 0, variant = -1, passCount = 0, ti = 0;
  for (;;){
    var stateEnd = stateStart + DUR[state];
    var tap = (ti < taps.length) ? taps[ti] : null;
    if (tap !== null && tap <= t && tap < stateEnd){
      ti++;
      if (state === 'pass'){ continue; }
      state = 'pass'; stateStart = tap; variant = passCount; passCount++;
      continue;
    }
    if (t < stateEnd){ return { state: state, stateStart: stateStart, variant: variant }; }
    var ns = NEXT[state];
    if (ns === 'pass'){ variant = passCount; passCount++; }
    state = ns; stateStart = stateEnd;
  }
}

function draw(t){
  currentT = t;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var gm = wallGeom();
  for (var i = 0; i < 12; i++){ drawPage(i, gm); }
  var sim = simulate(t);
  if (sim.variant < 0){ return; }
  if (sim.state === 'full' || sim.state === 'rest'){ return; }
  var ew = 2 * gm.pw + gm.g, cx = W / 2, cy = H / 2;
  var barH = Math.max(12, H * 0.02);
  if (sim.state === 'pass'){
    var prog = clamp01((t - sim.stateStart) / 3);
    var barY = gm.wy - barH + (gm.wallH + barH) * prog;
    var clipBottom = barY + barH;
    ctx.save();
    ctx.beginPath();
    ctx.rect(gm.wx, gm.wy, gm.wallW, Math.max(0, clipBottom - gm.wy));
    ctx.clip();
    drawEmblem(cx, cy, ew, sim.variant);
    ctx.restore();
    ctx.fillStyle = BAR;
    ctx.fillRect(gm.wx - gm.g, barY, gm.wallW + 2 * gm.g, barH);
  } else if (sim.state === 'dwell'){
    drawEmblem(cx, cy, ew, sim.variant);
    ctx.fillStyle = BAR;
    ctx.fillRect(gm.wx - gm.g, gm.wy + gm.wallH - barH, gm.wallW + 2 * gm.g, barH);
  } else if (sim.state === 'hold'){
    drawEmblem(cx, cy, ew, sim.variant);
  } else if (sim.state === 'regen'){
    drawEmblem(cx, cy, ew, sim.variant);
    for (var p = 0; p < 12; p++){
      var startP = sim.stateStart + (p / 11) * 3;
      var pr = clamp01((t - startP) / 5);
      if (pr <= 0){ continue; }
      ctx.save();
      ctx.globalAlpha = easeInOut(pr);
      drawPage(p, gm);
      ctx.restore();
    }
  }
}

/* Tap = early squeegee pass. Tap vs drag separated by 12 px. */
var downPos = null;
function onDown(ev){
  downPos = { x: ev.clientX, y: ev.clientY };
}
function onUp(ev){
  if (!downPos){ return; }
  var dx = ev.clientX - downPos.x, dy = ev.clientY - downPos.y;
  downPos = null;
  if (Math.sqrt(dx * dx + dy * dy) < 12){ taps.push(currentT); draw(currentT); }
}
if (canvas.addEventListener){
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function(){ downPos = null; });
}

/* Frame one: boot flag, exactly t = 0, pages full. */
var booted = false;
function frame(t){
  if (!booted){ booted = true; draw(0); return; }
  draw(t);
}
frame(0);
var startEpoch = 0;
function loop(ts){
  var t = (ts - startEpoch) / 1000;
  frame(t);
  if (typeof requestAnimationFrame === 'function'){ requestAnimationFrame(loop); }
}
if (typeof requestAnimationFrame === 'function'){
  requestAnimationFrame(function(ts){ startEpoch = ts; requestAnimationFrame(loop); });
}
})();
</script>
</body>
</html>
