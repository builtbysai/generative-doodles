<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Emotional Machine — №1103</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #07080C;
    overflow: hidden;
  }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette ----------
  var ROOM = [7, 8, 12];          // #07080C
  var SHY  = [26, 42, 74];        // #1A2A4A
  var VIOLET = [122, 92, 255];    // #7A5CFF
  var TEAL   = [61, 245, 192];    // #3DF5C0
  var WASH = [58, 46, 95];        // #3A2E5F

  function lerp(a, b, t) { return a + (b - a) * t; }
  function mix3(c1, c2, t) {
    return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  }
  function rgba(c, a) {
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a.toFixed(3) + ')';
  }
  function smoothstep(a, b, x) {
    var t = (x - a) / (b - a);
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    return t * t * (3 - 2 * t);
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var viewW = 720, viewH = 720, dpr = 1;

  function measure() {
    var w, h;
    if (window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    viewW = Math.max(50, Math.round(w));
    viewH = Math.max(50, Math.round(h));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
  }
  measure();
  if (window.visualViewport) window.visualViewport.addEventListener('resize', measure);
  window.addEventListener('resize', measure);

  function isPhone() {
    if (window.screen) {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m > 0 && m < 700) return true;
    }
    return viewH > viewW * 1.15;
  }

  // ---------- simulation ----------
  var N = 500;
  var DT = 1 / 60;
  var LOOP = 60;               // autonomous visitor loop, seconds
  var PREROLL_SECONDS = 20;    // fixed synchronous pre-roll

  var rand = mulberry32(1103);
  var px = new Float32Array(N), py = new Float32Array(N);
  var vx = new Float32Array(N), vy = new Float32Array(N);
  var seedI = new Float32Array(N);   // per-particle seed: warm hue + size + phase
  var warmI = new Float32Array(N);   // per-particle local warmth 0..1
  var proxI = new Float32Array(N);   // per-particle visitor proximity 0..1 (for draw)
  var warmCol = [];                  // precomputed warm colour per particle
  for (var i = 0; i < N; i++) {
    px[i] = rand(); py[i] = rand();
    vx[i] = 0; vy[i] = 0;
    seedI[i] = rand();
    warmI[i] = 0;
    warmCol.push(mix3(VIOLET, TEAL, seedI[i]));
  }

  var simT = 0;        // total simulated seconds
  var warmth = 0;      // global warmth W in [0,1]

  // pointer state (the real visitor)
  var ptr = { active: false, x: 0.5, y: 0.5, pres: 0 };

  // autonomous visitor: closed Lissajous path on the 60 s loop + presence windows
  function autoVisitor(lt) {
    var ph = (lt / LOOP) * Math.PI * 2;
    return {
      x: 0.5 + 0.30 * Math.sin(2 * ph + 1.3),
      y: 0.5 + 0.28 * Math.sin(3 * ph + 4.1)
    };
  }
  function autoPresence(lt) {
    // enters at 2 s, fully present 8–32 s, leaves by 38 s, absent until loop end
    return smoothstep(2, 8, lt) * (1 - smoothstep(32, 38, lt));
  }

  function step() {
    var lt = simT % LOOP;
    var av = autoVisitor(lt);
    var aPres = autoPresence(lt);

    // pointer presence eases in / out
    ptr.pres += ((ptr.active ? 1 : 0) - ptr.pres) * Math.min(1, DT * 1.8);
    if (ptr.pres < 0.001 && !ptr.active) ptr.pres = 0;

    // effective visitor: the pointer while it is the stronger presence
    var visX, visY, pe;
    if (ptr.pres > aPres) { visX = ptr.x; visY = ptr.y; pe = ptr.pres; }
    else                  { visX = av.x;  visY = av.y;  pe = aPres; }

    // global warmth: +0.02/s while a visitor is present, −0.008/s absent
    warmth += (pe * 0.020 - (1 - pe) * 0.008) * DT;
    if (warmth < 0) warmth = 0;
    if (warmth > 1) warmth = 1;

    var aspect = viewW / viewH;
    var attBase = pe * (0.030 + 0.100 * warmth);
    var tanBase = pe * warmth * 0.105;

    for (var i = 0; i < N; i++) {
      var x = px[i], y = py[i];
      var sd = seedI[i];

      // baseline curl-ish drift (smooth seeded field, slowly evolving)
      var fx = Math.sin(y * 6.0 + simT * 0.11 + sd * 12.0) * 0.012;
      var fy = Math.cos(x * 5.0 - simT * 0.09 + sd * 9.0) * 0.012;

      // vector to visitor (aspect-corrected)
      var dx = (visX - x) * aspect, dy = visY - y;
      var d2 = dx * dx + dy * dy;
      var d = Math.sqrt(d2) + 1e-5;
      var fall = 1 / (1 + (d / 0.18) * (d / 0.18));

      if (pe > 0.01) {
        var ux = dx / d, uy = dy / d;
        fx += ux * attBase * fall;          // notice / gather
        fy += uy * attBase * fall;
        fx += -uy * tanBase * fall;         // spiral organisation (tangential)
        fy += ux * tanBase * fall;
      }

      // soft containment so the nebula keeps filling the frame
      fx += (0.5 - x) * 0.004;
      fy += (0.5 - y) * 0.004;

      vx[i] = (vx[i] + fx * DT) * (1 - 0.6 * DT);
      vy[i] = (vy[i] + fy * DT) * (1 - 0.6 * DT);

      // speed clamp
      var sp2 = vx[i] * vx[i] + vy[i] * vy[i];
      var MAXS = 0.12;
      if (sp2 > MAXS * MAXS) {
        var s = MAXS / Math.sqrt(sp2);
        vx[i] *= s; vy[i] *= s;
      }

      px[i] = x + vx[i] * DT;
      py[i] = y + vy[i] * DT;

    // local warmth: rises near the visitor, decays slowly elsewhere (forgetting)
      var infl = pe * Math.max(0, 1 - d / 0.34);
      proxI[i] = infl;
      warmI[i] += (infl * 0.16 - (1 - infl) * 0.012) * DT;
      if (warmI[i] < 0) warmI[i] = 0;
      if (warmI[i] > 1) warmI[i] = 1;
    }

    simT += DT;

    // expose for draw
    drawState.visX = visX; drawState.visY = visY; drawState.pe = pe;
  }

  var drawState = { visX: 0.5, visY: 0.5, pe: 0 };

  // fixed synchronous pre-roll: frame one is a developed, deterministic state
  var preSteps = Math.round(PREROLL_SECONDS / DT);
  for (var s = 0; s < preSteps; s++) step();

  // ---------- draw ----------
  function draw() {
    // pin canvas CSS size (house rule: high-DPR phones)
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';

    var W = canvas.width, H = canvas.height;
    var scale = Math.min(W, H) / 720;

    ctx.fillStyle = rgba(ROOM, 1);
    ctx.fillRect(0, 0, W, H);

    // room wash follows warmth
    var washA = 0.2 * (0.25 + 0.75 * warmth);
    if (washA > 0.003) {
      ctx.fillStyle = rgba(WASH, washA);
      ctx.fillRect(0, 0, W, H);
    }

    // particles: soft dots, two flat-alpha layers
    for (var i = 0; i < N; i++) {
      // accumulated warmth, global floor, and the instant "notice" near the visitor
      var eff = Math.max(warmI[i], warmth * 0.35, proxI[i] * 0.6);
      var col = mix3(SHY, warmCol[i], eff);
      var a = 0.52 + 0.46 * eff;
      var r = (1.7 + seedI[i] * 2.2) * (0.8 + 0.45 * eff) * scale * (isPhone() ? 1.15 : 1);
      var cx = px[i] * W, cy = py[i] * H;
      ctx.fillStyle = rgba(col, a * 0.16);
      ctx.beginPath(); ctx.arc(cx, cy, r * 2.4, 0, 6.2831853); ctx.fill();
      ctx.fillStyle = rgba(col, a);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2831853); ctx.fill();
    }

    // visitor dot: small, bright, layered glow
    var pe = drawState.pe;
    if (pe > 0.02) {
      var vxPx = drawState.visX * W, vyPx = drawState.visY * H;
      var vr = 3.2 * (Math.min(W, H) / 720);
      ctx.fillStyle = rgba([255, 255, 255], 0.10 * pe);
      ctx.beginPath(); ctx.arc(vxPx, vyPx, vr * 5.5, 0, 6.2831853); ctx.fill();
      ctx.fillStyle = rgba([255, 255, 255], 0.22 * pe);
      ctx.beginPath(); ctx.arc(vxPx, vyPx, vr * 2.8, 0, 6.2831853); ctx.fill();
      ctx.fillStyle = rgba([255, 255, 255], 0.95 * pe);
      ctx.beginPath(); ctx.arc(vxPx, vyPx, vr, 0, 6.2831853); ctx.fill();
    }
  }

  draw(); // synchronous first frame (fixed phase: after the fixed pre-roll)

  // ---------- live loop (guarded: QA renderer has no rAF) ----------
  if (typeof requestAnimationFrame === 'function') {
    var last = null, acc = 0;
    var frame = function (ts) {
      if (last === null) last = ts;
      var el = (ts - last) / 1000;
      last = ts;
      if (el > 0.1) el = 0.1;
      acc += el;
      var n = 0;
      while (acc >= DT && n < 8) { step(); acc -= DT; n++; }
      draw();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // ---------- pointer: drag is the piece ----------
  function setPtr(e) {
    var rect = canvas.getBoundingClientRect();
    var w = rect.width || viewW, h = rect.height || viewH;
    ptr.x = Math.min(1, Math.max(0, (e.clientX - rect.left) / w));
    ptr.y = Math.min(1, Math.max(0, (e.clientY - rect.top) / h));
  }
  canvas.addEventListener('pointerdown', function (e) {
    ptr.active = true; setPtr(e);
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (ptr.active) setPtr(e);
  });
  function release() { ptr.active = false; }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', release);
})();
</script>
</body>
</html>
