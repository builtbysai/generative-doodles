<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1922 Language of Ghosts</title>
<style>
  html, body { margin: 0; padding: 0; background: #070b18; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/lauren-kinsella.md does not exist in the repo, so these
  // hex values are chosen from the prompt's own color names.
  var BG = '#070b18';        // stage blue-black ground, page ground too
  var DEEP = '#04060f';      // near-black, the back of the stage
  var PAPER = '#8f8a7d';     // poet's text, faded newsprint grey
  var PAPER_LT = '#ece9dd';  // a touched word, brightened by the veil
  var SMOKE = '#d8d6e2';     // ghost veil, pale smoke white
  var VIOLET = '#7d6fa8';    // ghost veil, dim violet
  var VIOLET_DEEP = '#4a3f73'; // veil shadow, deep violet
  var INK = '#dfe3ea';       // title
  var INK_SOFT = '#8f97ad';  // date line and hint, muted blue-grey

  // Fixed-phase first frame: t = 31 s. Line two is eight words in, the
  // veil's focus is dipping down onto the words on the right, and a dozen
  // syllable sprites are already drifting. Frame one is byte-reproducible:
  // every word, sprite and veil blob is a pure function of t.
  var FIRST_T = 31;

  // The narrative: original invented lines, no real poem text. Words feed
  // in one at a time on a slow clock, one line per cycle step.
  var LINES = [
    'the hall was dark before the voice arrived',
    'she read the room like a letter never sent',
    'every word left a small light on the floor',
    'the singer kept the vowels and let the consonants go',
    'by morning the poem had learned to listen'
  ];
  var WORD_INTERVAL = 1.5;   // seconds between words on the slow clock
  var LINE_HOLD = 4.5;       // seconds the finished line rests
  var LINE_FADE = 1.2;       // seconds the line takes to leave
  var WORD_FADE = 0.9;       // seconds a word takes to arrive

  // Syllable fragments the veil speaks in. Invented breath, never words
  // from the poem, so the voice stays texture and never illustration.
  var SYLLABLES = ['ah', 'sh', 'lu', 've', 'o', 's', 'a', 'e', 'th', 'ri',
                   'm', 'hu', 'na', 'oo', 'ss', 'el', 'i', 'wa', 'uh', 'lo'];

  // Seeded PRNG so the veil's cast is fixed across loads.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1922);

  // Line durations and the full cycle, in seconds.
  var LINE_DUR = [];
  var CYCLE = 0;
  for (var li = 0; li < LINES.length; li++) {
    var nw = LINES[li].split(' ').length;
    var d = nw * WORD_INTERVAL + LINE_HOLD + LINE_FADE;
    LINE_DUR.push(d);
    CYCLE += d;
  }

  // Veil sprites: 26 syllable sprites on a 48 s cycle that is NOT synced
  // to the word clock. Each has a fixed birth offset, lifetime, home
  // position in the upper two-thirds, slow drift, and a word slot it may
  // cling to when that word is lit.
  var SPRITE_CYCLE = 48;
  var SPRITES = [];
  for (var si = 0; si < 36; si++) {
    SPRITES.push({
      syl: SYLLABLES[Math.floor(rng() * SYLLABLES.length)],
      birth: rng() * SPRITE_CYCLE,
      life: 10 + rng() * 8,
      hx: 0.05 + rng() * 0.90,
      hy: 0.08 + rng() * 0.48,
      vx: (rng() - 0.5) * 0.012,
      vy: (rng() - 0.5) * 0.008,
      size: 0.7 + rng() * 0.9,
      violet: rng() < 0.45,
      peak: 0.14 + rng() * 0.18,
      slot: Math.floor(rng() * 12),
      wob: rng() * Math.PI * 2
    });
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  // Word layout, recomputed on resize: per line, per word, the centre x
  // and baseline y of the word as laid out in the text band.
  var LAYOUT = [];

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function mixHex(h1, h2, t) {
    var r1 = parseInt(h1.slice(1, 3), 16), g1 = parseInt(h1.slice(3, 5), 16), b1 = parseInt(h1.slice(5, 7), 16);
    var r2 = parseInt(h2.slice(1, 3), 16), g2 = parseInt(h2.slice(3, 5), 16), b2 = parseInt(h2.slice(5, 7), 16);
    var r = Math.round(lerp(r1, r2, t)), g = Math.round(lerp(g1, g2, t)), b = Math.round(lerp(b1, b2, t));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function fontSize() {
    return Math.round(clamp(W / 22, 16, 34));
  }

  // Lay out every line's words into centred rows inside the text band.
  function layoutWords() {
    LAYOUT = [];
    var fs = fontSize();
    ctx.font = 'italic ' + fs + 'px Georgia, "Times New Roman", serif';
    var bandTop = H * 0.66, bandH = H * 0.26;
    var maxW = W * 0.88;
    var lineH = fs * 1.5;
    for (var i = 0; i < LINES.length; i++) {
      var words = LINES[i].split(' ');
      var rows = [];
      var row = [];
      var rowW = 0;
      var spaceW = ctx.measureText(' ').width;
      for (var j = 0; j < words.length; j++) {
        var ww = ctx.measureText(words[j]).width;
        var add = (row.length === 0) ? ww : rowW + spaceW + ww;
        if (row.length > 0 && add > maxW) {
          rows.push({ words: row, w: rowW });
          row = [words[j]]; rowW = ww;
        } else {
          row.push(words[j]); rowW = add;
        }
      }
      if (row.length) { rows.push({ words: row, w: rowW }); }
      var totalH = rows.length * lineH;
      var y0 = bandTop + (bandH - totalH) / 2 + lineH * 0.78;
      var placed = [];
      var k = 0;
      for (var r = 0; r < rows.length; r++) {
        var x = (W - rows[r].w) / 2;
        for (var wI = 0; wI < rows[r].words.length; wI++) {
          var tw = ctx.measureText(rows[r].words[wI]).width;
          placed.push({ text: rows[r].words[wI], x: x + tw / 2, y: y0 + r * lineH, w: tw });
          x += tw + spaceW;
          k++;
        }
      }
      LAYOUT.push(placed);
    }
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
    layoutWords();
  }

  // Which line is speaking at time t, and how far into its own cycle.
  function lineAt(t) {
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    for (var i = 0; i < LINES.length; i++) {
      if (ph < LINE_DUR[i]) { return { idx: i, lt: ph }; }
      ph -= LINE_DUR[i];
    }
    return { idx: 0, lt: 0 };
  }

  // The veil's wandering focus. Breathy and uneven: two slow sines for
  // the drift, plus a slow dip that carries it down to touch the words.
  // It never follows the word clock.
  function veilFocus(t) {
    var fx = W * (0.5 + 0.38 * Math.sin(t * 0.043 + 0.7) + 0.12 * Math.sin(t * 0.11 + 2.1));
    var dip = Math.pow(Math.max(0, Math.sin(t * 0.11 + 4.444)), 3);
    var fy = H * (0.28 + 0.20 * Math.sin(t * 0.05 + 0.4)) + dip * H * 0.30;
    return { x: fx, y: fy };
  }

  // Attention the veil pays a word: a soft gaussian around its focus.
  function attention(word, f) {
    var dx = word.x - f.x, dy = word.y - f.y;
    var sig = W * 0.15;
    return Math.exp(-(dx * dx + dy * dy) / (2 * sig * sig));
  }

  // The poet's text band: words arrive one at a time on the slow clock,
  // brighten where the veil touches them, and leave together at the
  // end of the line. Returns the lit-word attention map for the sprites.
  function drawTextBand(t) {
    var cur = lineAt(t);
    var words = LAYOUT[cur.idx];
    var n = words.length;
    var fs = fontSize();
    var f = veilFocus(t);
    var atts = [];
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    ctx.font = 'italic ' + fs + 'px Georgia, "Times New Roman", serif';
    var lineOut = clamp((LINE_DUR[cur.idx] - cur.lt) / LINE_FADE, 0, 1);
    for (var i = 0; i < n; i++) {
      var reveal = i * WORD_INTERVAL;
      var age = cur.lt - reveal;
      if (age < 0) { atts.push(0); continue; }
      var aIn = clamp(age / WORD_FADE, 0, 1);
      var alpha = aIn * lineOut;
      if (alpha <= 0.01) { atts.push(0); continue; }
      var att = attention(words[i], f);
      atts.push(att);
      // A touched word brightens toward pale smoke, then fades.
      var col = mixHex(PAPER, PAPER_LT, clamp(att * 1.15, 0, 1));
      ctx.globalAlpha = a4(0.92 * alpha);
      ctx.fillStyle = col;
      ctx.fillText(words[i].text, words[i].x, words[i].y);
      ctx.globalAlpha = 1;
      // The veil framing a word it has chosen: a soft smoke patch that
      // grows with attention, so a fully haunted word is felt and not read.
      if (att > 0.35) {
        var pr = words[i].w * 0.75;
        var pcx = words[i].x, pcy = words[i].y - fs * 0.32;
        var pg = ctx.createRadialGradient(pcx, pcy, 0, pcx, pcy, pr);
        pg.addColorStop(0, hexA(SMOKE, a4(clamp((att - 0.35) * 0.28, 0, 0.18) * alpha)));
        pg.addColorStop(1, hexA(SMOKE, 0));
        ctx.fillStyle = pg;
        ctx.fillRect(pcx - pr, pcy - pr, pr * 2, pr * 2);
      }
    }
    ctx.textAlign = 'left';
    return { idx: cur.idx, atts: atts, focus: f };
  }

  // The veil itself: three soft breath-blobs following the focus, and
  // the drifting syllable sprites, some clinging to lit words.
  function drawVeil(t, band) {
    var f = band.focus;
    // Breath blobs: large, very faint, pale violet and smoke.
    var blobs = [
      { dx: 0, dy: 0, r: 0.34, col: VIOLET, a: 0.08 },
      { dx: -0.16, dy: -0.10, r: 0.26, col: SMOKE, a: 0.07 },
      { dx: 0.14, dy: 0.09, r: 0.22, col: VIOLET_DEEP, a: 0.09 }
    ];
    for (var b = 0; b < blobs.length; b++) {
      var bl = blobs[b];
      var bx = f.x + bl.dx * W, by = f.y + bl.dy * H;
      var br = bl.r * Math.min(W, H);
      var g = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      g.addColorStop(0, hexA(bl.col, a4(bl.a)));
      g.addColorStop(1, hexA(bl.col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(bx + br, by);
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
    }

    // Syllable sprites.
    var fs = fontSize();
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    var ph = t - Math.floor(t / SPRITE_CYCLE) * SPRITE_CYCLE;
    var words = LAYOUT[band.idx];
    for (var i = 0; i < SPRITES.length; i++) {
      var s = SPRITES[i];
      var age = ph - s.birth;
      if (age < 0 || age > s.life) { continue; }
      var env = clamp(age / 1.5, 0, 1) * clamp((s.life - age) / 2, 0, 1);
      if (env <= 0.01) { continue; }
      // Home drift in the upper two-thirds, with a slow wobble.
      var px = (s.hx + s.vx * age) * W + Math.sin(age * 0.35 + s.wob) * W * 0.012;
      var py = (s.hy + s.vy * age) * H + Math.cos(age * 0.28 + s.wob) * H * 0.010;
      // A sprite may cling to its word slot when that word is lit.
      if (s.slot < words.length) {
        var wd = words[s.slot];
        var att = band.atts[s.slot] || 0;
        if (att > 0.25) {
          var pull = clamp((att - 0.25) * 1.4, 0, 0.85);
          px = lerp(px, wd.x + Math.sin(age * 0.9 + s.wob) * 8, pull);
          py = lerp(py, wd.y - fs * 0.4 + Math.cos(age * 0.7 + s.wob) * 6, pull);
        }
      }
      var sfs = Math.round(fs * 0.62 * s.size);
      ctx.font = 'italic ' + sfs + 'px Georgia, "Times New Roman", serif';
      ctx.fillStyle = hexA(s.violet ? VIOLET : SMOKE, a4(s.peak * env));
      ctx.fillText(s.syl, px, py);
    }
    ctx.textAlign = 'left';
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Stage blue-black ground, deepening toward the back of the stage.
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = hexA(DEEP, 0.55);
    ctx.fillRect(0, 0, W, H * 0.30);

    // A faint violet wash over the upper field, so the veil has a body
    // even where no sprite is drifting.
    var wash = ctx.createRadialGradient(W * 0.5, H * 0.30, 0, W * 0.5, H * 0.30, Math.min(W, H) * 0.55);
    wash.addColorStop(0, hexA(VIOLET_DEEP, 0.05));
    wash.addColorStop(1, hexA(VIOLET_DEEP, 0));
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W, H * 0.66);

    // A faint stage line where the text band begins.
    ctx.strokeStyle = hexA(VIOLET_DEEP, 0.35);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W * 0.06, H * 0.66);
    ctx.lineTo(W * 0.94, H * 0.66);
    ctx.stroke();

    var band = drawTextBand(t);
    drawVeil(t, band);

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Language of Ghosts', 18, 34);
    ctx.fillStyle = INK_SOFT;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1922 · 2007 · 04 · 17', 18, 34 + fs2 + 8);

    // Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK_SOFT, 0.9);
    ctx.textAlign = 'center';
    var hint = 'Watch the veil choose its words.';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs under 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
