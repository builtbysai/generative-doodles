<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berry-Light Drapes</title>
<style>
html, body { margin: 0; padding: 0; background: #F4EEE3; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F4EEE3';
var PLATE = '#3B2436';
var PLATE_LINE = 'rgba(169,46,79,0.55)';
var TITLE_INK = '#F4EEE3';
var HINT_INK = '#D9A0B4';
var RASPBERRY = '#A92E4F';
var PLUM = '#5E3A55';
var SAGE = '#7F9271';
var GREY = '#8C8178';
var CREAM = '#F4EEE3';
var PERIOD = 24;
var FRAME_T = 6.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- seeded 1D value noise / fbm ---- */
function hash1(n) {
  var h = Math.imul(n | 0, 0x27D4EB2D) ^ 0x9E3779B9;
  h = Math.imul(h ^ (h >>> 15), 0x85EBCA6B);
  h = h ^ (h >>> 13);
  return ((h >>> 0) / 4294967296);
}
function vnoise(x) {
  var i = Math.floor(x), f = x - i;
  var a = hash1(i), b = hash1(i + 1);
  return a + (b - a) * smooth(f);
}
function fbm1(x) {
  var v = 0, amp = 0.5, f = 1, o;
  for (o = 0; o < 4; o++) { v += amp * vnoise(x * f); f *= 2.03; amp *= 0.5; }
  return v;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1710);
/* seeded grain dots, fixed positions in stage space */
var grain = [];
var gi;
for (gi = 0; gi < 260; gi++) {
  grain.push({ x: rng(), y: rng(), r: 0.6 + rng() * 1.3, a: 0.03 + rng() * 0.05 });
}
var phaseT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- drapes: three large sheer forms crossing diagonally ----
   Each drape is a bundle of parallel polylines warped by a shared
   closed-form flow field, drawn at low alpha so overlaps deepen. */
var DRAPES = [
  { color: RASPBERRY, angle: 0.61, cx: 0.44, cy: 0.44, width: 0.34, lines: 30, seed: 1.7, slide: 0.020, accentEvery: 0, accent: null },
  { color: PLUM, angle: -0.52, cx: 0.56, cy: 0.58, width: 0.30, lines: 26, seed: 4.3, slide: 0.016, accentEvery: 0, accent: null },
  { color: SAGE, angle: 0.31, cx: 0.52, cy: 0.26, width: 0.22, lines: 22, seed: 7.9, slide: 0.024, accentEvery: 4, accent: GREY }
];
/* draw order cycles deterministically with loop time: a fixed-phase
   function of phaseT, never random, so frame one is reproducible */
var PERMS = [[0, 1, 2], [1, 2, 0], [2, 0, 1]];
function orderIndex() {
  return Math.floor(phaseT / 8) % 3;
}
/* warp displacement (perpendicular to the drape direction) at parameter s */
function warpAt(d, s, sh) {
  var travel = phaseT * d.slide;
  var w = 0.030 * sh * (fbm1(s * 3.1 + d.seed + travel) - 0.5) * 2
        + 0.014 * sh * Math.sin(TAU * 1.4 * s + d.seed * 2.1 + phaseT * 0.05);
  return w;
}
/* slow whole-drape drift: the form sways as one, like fabric in air */
function driftAt(d, sh) {
  return 0.018 * sh * Math.sin(TAU * phaseT / PERIOD + d.seed)
       + 0.010 * sh * Math.sin(TAU * phaseT / (PERIOD * 0.5) + d.seed * 1.7);
}
/* points of one line of a drape, in stage coords */
function linePts(d, j, st) {
  var ux = Math.cos(d.angle), uy = Math.sin(d.angle);
  var nx = -uy, ny = ux;
  var len = Math.sqrt(st.w * st.w + st.h * st.h) * 1.05;
  var cx = st.x + d.cx * st.w, cy = st.y + d.cy * st.h;
  var off = (j / (d.lines - 1) - 0.5) * d.width * st.h + driftAt(d, st.h);
  var NX = 140;
  var pts = [];
  var s, x, y, w;
  for (s = 0; s <= NX; s++) {
    var t = s / NX;
    w = warpAt(d, t, st.h) * (0.6 + 0.4 * Math.sin(Math.PI * t));
    x = cx + ux * (t - 0.5) * len + nx * (off + w);
    y = cy + uy * (t - 0.5) * len + ny * (off + w);
    pts.push({ x: x, y: y });
  }
  return pts;
}
function strokeLine(pts, lw, style) {
  ctx.beginPath();
  var i;
  for (i = 0; i < pts.length; i++) {
    if (i === 0) ctx.moveTo(pts[i].x, pts[i].y); else ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.lineWidth = lw;
  ctx.strokeStyle = style;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}
function drawDrape(d, st) {
  var j, pts;
  /* sheer envelope: one very low alpha fill so the plane reads as
     cloth, not just loose threads; overlaps deepen through layering */
  var first = linePts(d, 0, st);
  var last = linePts(d, d.lines - 1, st);
  ctx.beginPath();
  var i;
  for (i = 0; i < first.length; i++) {
    if (i === 0) ctx.moveTo(first[i].x, first[i].y); else ctx.lineTo(first[i].x, first[i].y);
  }
  for (i = last.length - 1; i >= 0; i--) ctx.lineTo(last[i].x, last[i].y);
  ctx.closePath();
  ctx.fillStyle = rgba(d.color, 0.07);
  ctx.fill();
  /* bundle of fine warped lines; alpha varies across the bundle so
     folds read as denser and lighter bands */
  for (j = 0; j < d.lines; j++) {
    pts = linePts(d, j, st);
    var fold = 0.7 + 0.5 * Math.sin(Math.PI * j / (d.lines - 1) * 2.2 + d.seed);
    var col = d.color;
    if (d.accentEvery && j % d.accentEvery === 0) col = d.accent;
    ctx.beginPath();
    var lw = Math.max(0.75, st.h * 0.0016);
    strokeLine(pts, lw, rgba(col, 0.17 * fold));
  }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var sw = st.w, sh = st.h;
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, sw, sh);
  ctx.clip();
  var order = PERMS[orderIndex()];
  var k;
  for (k = 0; k < order.length; k++) drawDrape(DRAPES[order[k]], st);
  /* grain speckle, fixed seeded positions */
  for (gi = 0; gi < grain.length; gi++) {
    var gx = st.x + grain[gi].x * sw;
    var gy = st.y + grain[gi].y * sh;
    ctx.fillStyle = 'rgba(94,58,85,' + grain[gi].a.toFixed(4) + ')';
    ctx.beginPath();
    ctx.arc(gx, gy, grain[gi].r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Berry-Light Drapes').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Berry-Light Drapes').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 17').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Berry-Light Drapes', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 17', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the drapes drift.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    drapeCount: function () { return DRAPES.length; },
    orderAt: function (t) { return PERMS[Math.floor(t / 8) % 3]; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed pre-roll t = 6s ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
