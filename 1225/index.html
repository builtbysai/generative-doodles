<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Heavy Metal Parking Lot (Paper Cutout)</title>
<style>
  html, body { margin: 0; padding: 0; background: #241F1B; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- №1225 "Heavy Metal Parking Lot (Paper Cutout)" — Leslie Supnet study block LS2 ----
  // Her 2008 Animated Heavy Metal Parking Lot tribute rebuilt as stop-motion
  // paper cutouts: aged-paper cars, ink-faced figures, torn edges and glue
  // tabs on every shape, all of it stepping at 6 fps on a tilted diorama.
  // Drag pans the lightbox; figures near the pointer scatter a step or two.

  var T0 = 3.35;              // fixed phase of the synchronous first frame (frame 20 at 6 fps)
  var FPS = 6;                // stop-motion step rate
  var DW = 1000, DH = 760;    // design space of the diorama board

  var PAPER  = '#D8C49A';
  var BONE   = '#EFE3C2';
  var INK    = '#1A1512';
  var RED1   = '#A63A2E';
  var RED2   = '#7A2E22';
  var DENIM  = '#3E5A78';
  var SUN    = '#E8A33D';
  var SKY    = '#C8B088';
  var ASPH   = '#2E2A26';
  var TABLE  = '#241F1B';
  var TAB    = '#FFF8E0';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function isPhone(w, h) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    return sw < 700 || h > w * 1.15;
  }

  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    W = w; H = h;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---- seeded rng + integer hash: every speck of noise derives from these ----
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(a, b) {
    var h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // ---- torn-edge geometry: polygon vertices jittered by a fixed per-cutout seed,
  //      so the tear is stable from frame to frame (only the boil jitter moves) ----
  function tornRect(x, y, w, h, seed, jit) {
    var pts = [], step = 15, i, n;
    n = Math.max(2, Math.round(w / step));
    for (i = 0; i <= n; i++) pts.push([x + (w * i) / n, y + (hash2(seed, i * 3 + 1) - 0.5) * 2 * jit]);
    n = Math.max(2, Math.round(h / step));
    for (i = 1; i <= n; i++) pts.push([x + w + (hash2(seed, 40 + i * 3) - 0.5) * 2 * jit, y + (h * i) / n]);
    n = Math.max(2, Math.round(w / step));
    for (i = 1; i <= n; i++) pts.push([x + w - (w * i) / n, y + h + (hash2(seed, 80 + i * 3) - 0.5) * 2 * jit]);
    n = Math.max(2, Math.round(h / step));
    for (i = 1; i < n; i++) pts.push([x + (hash2(seed, 120 + i * 3) - 0.5) * 2 * jit, y + h - (h * i) / n]);
    return pts;
  }
  function tornCircle(cx, cy, r, seed, jit) {
    var pts = [], i, n = 26, a, rr;
    for (i = 0; i < n; i++) {
      a = (i / n) * Math.PI * 2;
      rr = r * (1 + (hash2(seed, i * 5 + 2) - 0.5) * jit);
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    return pts;
  }
  function trace(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
  function scaled(pts, cx, cy, k, ox, oy) {
    var out = [];
    for (var i = 0; i < pts.length; i++) out.push([cx + (pts[i][0] - cx) * k + ox, cy + (pts[i][1] - cy) * k + oy]);
    return out;
  }
  // a cutout: bone underlay (paper backing showing at the torn edge), then the shape
  function cutout(pts, cx, cy, fill) {
    trace(scaled(pts, cx, cy, 1.07, 1.5, 2));
    ctx.fillStyle = BONE; ctx.fill();
    trace(pts);
    ctx.fillStyle = fill; ctx.fill();
  }
  function glueTab(x, y, w, h, rot) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.globalAlpha = 0.25; ctx.fillStyle = TAB;
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  function shade(hex, amt) { // amt -1..1 toward ink / bone
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    var t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // ---- the cast: built once from a seeded rng, identical on every load ----
  var rng = mulberry32(1225);
  var CAR_COLORS = [RED1, DENIM, PAPER, RED2, PAPER, RED1, DENIM, RED2, PAPER, DENIM];
  var cars = [];
  (function buildCars() {
    var rows = [
      { y: 252, xs: [170, 470, 770], w: 172 },
      { y: 424, xs: [118, 378, 638, 884], w: 158 },
      { y: 592, xs: [200, 500, 792], w: 168 }
    ];
    var id = 0;
    for (var r = 0; r < 3; r++) {
      for (var i = 0; i < rows[r].xs.length; i++) {
        cars.push({
          id: id, x: rows[r].xs[i] + (rng() - 0.5) * 10, y: rows[r].y + (rng() - 0.5) * 6,
          w: rows[r].w, h: 92, color: CAR_COLORS[id],
          seed: 100 + id * 17, roofSeed: 300 + id * 23,
          door: id === 1 ? 6 : (id === 8 ? 1 : -1) // door cycle offsets; -1 = no flapping door
        });
        id++;
      }
    }
  })();

  var FIG_COLORS = [PAPER, DENIM, RED1, BONE, RED2];
  var figures = [];
  (function buildFigures() {
    var spots = [
      [238, 348], [398, 356], [556, 346], [700, 354], [832, 348],
      [198, 520], [360, 512], [528, 522], [688, 514], [858, 520],
      [322, 258], [508, 430], [350, 590], [902, 350]
    ];
    for (var i = 0; i < spots.length; i++) {
      figures.push({
        id: i, x: spots[i][0] + (rng() - 0.5) * 14, y: spots[i][1] + (rng() - 0.5) * 8,
        color: FIG_COLORS[i % FIG_COLORS.length],
        seed: 500 + i * 31, headSeed: 700 + i * 13,
        bobOff: (rng() * 4) | 0, ph: rng() * 2
      });
    }
  })();

  var coolers = [
    { x: 330, y: 330, color: RED1, seed: 901 },
    { x: 648, y: 496, color: DENIM, seed: 902 },
    { x: 478, y: 330, color: PAPER, seed: 903 },
    { x: 806, y: 496, color: RED1, seed: 904 }
  ];

  // flag: 4 pre-torn wave shapes, cycled two frames each
  var FLAG_X = 858, FLAG_Y = 116, FLAG_POLE_BASE = 214;
  var flagShapes = [];
  (function buildFlag() {
    for (var s = 0; s < 4; s++) {
      var pts = [], n = 5, i, x, yTop, yBot;
      for (i = 0; i <= n; i++) { x = FLAG_X + (58 * i) / n; yTop = FLAG_Y + Math.sin(i * 1.15 + s * 1.5) * 5 + (hash2(950, s * 20 + i) - 0.5) * 3; pts.push([x, yTop]); }
      for (i = n; i >= 0; i--) { x = FLAG_X + (58 * i) / n; yBot = FLAG_Y + 26 + Math.sin(i * 1.15 + s * 1.5 + 0.5) * 5 + (hash2(960, s * 20 + i) - 0.5) * 3; pts.push([x, yBot]); }
      flagShapes.push(pts);
    }
  })();

  // ---- interaction state: pan offsets + recorded scatter disturbances ----
  var panX = 0, panY = 0;              // committed pan, design units
  var drag = null;                     // {px, py, moved} while pointer is down
  var disturbances = [];               // {fig, dx, dy, f0} recorded step-scatter events
  var lastPhase = T0;

  function fitScale() { return Math.min(W / DW, H / DH); }

  // screen px -> design coords (undo fit, rotation, pan)
  function toDesign(sx, sy) {
    var s = fitScale();
    var x = (sx - W / 2) / s, y = (sy - H / 2) / s;
    var a = -0.052, ca = Math.cos(a), sa = Math.sin(a); // inverse of the -3deg tilt
    var rx = x * ca - y * sa, ry = x * sa + y * ca;
    return [rx + DW / 2 - panX, ry + DH / 2 - panY];
  }

  function scatterAt(dx, dy, f) {
    for (var i = 0; i < figures.length; i++) {
      var fg = figures[i];
      var ox = fg.x - dx, oy = fg.y - dy, d = Math.sqrt(ox * ox + oy * oy);
      if (d < 90 && d > 1) {
        var push = 15 * (1 - d / 110);
        disturbances.push({ fig: i, dx: (ox / d) * push, dy: (oy / d) * push, f0: f });
        if (disturbances.length > 240) disturbances.splice(0, disturbances.length - 240);
      }
    }
  }
  // a figure's total scatter offset at frame f: stepped decay, never smooth
  function scatterOffset(id, f) {
    var x = 0, y = 0;
    for (var i = 0; i < disturbances.length; i++) {
      var ev = disturbances[i];
      if (ev.fig !== id) continue;
      var age = f - ev.f0;
      if (age < 0 || age >= 18) continue;
      var k = age < 3 ? 1 : (age < 12 ? 0.6 : 0.3);
      x += ev.dx * k; y += ev.dy * k;
    }
    return [x, y];
  }

  // ---- drawing ----
  function drawCar(car, f) {
    var jx = (hash2(f * 7 + car.id, 3) - 0.5) * 2;
    var jy = (hash2(f * 7 + car.id, 9) - 0.5) * 2;
    var x = car.x + jx, y = car.y + jy, w = car.w, h = car.h;
    var cx = x, cy = y; // cars positioned by centre
    var body = tornRect(x - w / 2, y - h / 2, w, h, car.seed, 2.4);
    cutout(body, cx, cy, car.color);
    // wheels: ink blocks tucked at the corners
    ctx.fillStyle = INK;
    var ww = 24, wh = 11;
    ctx.fillRect(x - w / 2 + 12, y - h / 2 - 4, ww, wh);
    ctx.fillRect(x + w / 2 - 12 - ww, y - h / 2 - 4, ww, wh);
    ctx.fillRect(x - w / 2 + 12, y + h / 2 - wh + 4, ww, wh);
    ctx.fillRect(x + w / 2 - 12 - ww, y + h / 2 - wh + 4, ww, wh);
    // windshield bands, front and back of the roof
    ctx.globalAlpha = 0.5; ctx.fillStyle = INK;
    ctx.fillRect(x - w * 0.30, y - h / 2 + 13, w * 0.60, 9);
    ctx.fillRect(x - w * 0.30, y + h / 2 - 22, w * 0.60, 9);
    ctx.globalAlpha = 1;
    // roof
    var roof = tornRect(x - w * 0.30, y - h * 0.30, w * 0.60, h * 0.60, car.roofSeed, 2);
    trace(scaled(roof, cx, cy, 1.05, 1, 1.5)); ctx.fillStyle = BONE; ctx.fill();
    trace(roof); ctx.fillStyle = shade(car.color, car.color === PAPER ? -0.10 : 0.14); ctx.fill();
    // headlights
    ctx.fillStyle = BONE;
    ctx.fillRect(x + w / 2 - 3, y - h / 2 + 10, 4, 8);
    ctx.fillRect(x + w / 2 - 3, y + h / 2 - 18, 4, 8);
    // flapping door on the near side, hinge at its front edge, 3 stepped stages
    if (car.door >= 0) {
      var cyc = [0, 1, 2, 2, 1, 0, 0, 0];
      var stage = cyc[(((f + car.door) % 8) + 8) % 8];
      var hx = x + w * 0.16, hy = y + h / 2 - 2, dl = w * 0.34;
      var ang = stage * 0.5; // swings outward, stepped
      var ex = hx - Math.cos(ang) * dl, ey = hy + Math.sin(ang) * dl;
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(ex, ey);
      ctx.lineTo(ex, ey + 11);
      ctx.lineTo(hx, hy + 11);
      ctx.closePath();
      ctx.fillStyle = BONE; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(hx, hy - 1);
      ctx.lineTo(ex, ey - 1);
      ctx.lineTo(ex, ey + 10);
      ctx.lineTo(hx, hy + 10);
      ctx.closePath();
      ctx.fillStyle = shade(car.color, -0.16); ctx.fill();
    }
    glueTab(x - w / 2 + 8, y - h / 2, 20, 8, 0.3);
    glueTab(x + w / 2 - 10, y + h / 2, 20, 8, -0.2);
  }

  function drawFigure(fg, f) {
    var bobSeq = [0, -1, -2, -1];
    var swaySeq = [0, 1, 0, -1];
    var bi = (((f + fg.bobOff) % 4) + 4) % 4;
    var shift = (Math.floor(f / 24 + fg.ph) % 2) * 6 - 3; // occasional shuffle step
    var so = scatterOffset(fg.id, f);
    var jx = (hash2(f * 7 + fg.id + 40, 3) - 0.5) * 2;
    var jy = (hash2(f * 7 + fg.id + 40, 9) - 0.5) * 2;
    var x = fg.x + shift + so[0] + jx;
    var y = fg.y + bobSeq[bi] * 1.6 + so[1] + jy;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(swaySeq[bi] * 0.02);
    // legs
    ctx.fillStyle = INK;
    ctx.fillRect(-9, 14, 6, 12);
    ctx.fillRect(3, 14, 6, 12);
    // body
    var body = tornRect(-14, -12, 28, 28, fg.seed, 2);
    cutout(body, 0, 2, fg.color);
    // head with ink-drawn face
    var head = tornCircle(0, -22, 10.5, fg.headSeed, 0.10);
    cutout(head, 0, -22, BONE);
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.moveTo(-3.6, -23.5); ctx.lineTo(-2.4, -23.5); ctx.lineTo(-3, -22.2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(2.4, -23.5); ctx.lineTo(3.6, -23.5); ctx.lineTo(3, -22.2); ctx.closePath(); ctx.fill();
    ctx.fillRect(-2.5, -18.6, 5, 1.4); // mouth line
    glueTab(-12, -12, 14, 6, 0.4);
    ctx.restore();
  }

  function drawScene(t) {
    var f = Math.floor(t * FPS);
    ctx.fillStyle = TABLE;
    ctx.fillRect(0, 0, W, H);

    var s = fitScale();
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(s, s);
    ctx.rotate(-0.052); // the diorama's slight tilt, about -3 degrees
    ctx.translate(-DW / 2 + panX, -DH / 2 + panY);

    // the board: bone paper base with a torn rim, table showing beyond it
    var board = tornRect(-46, -46, DW + 92, DH + 92, 77, 3.5);
    trace(board); ctx.fillStyle = PAPER; ctx.fill();

    // flat painted sky band along the back edge, big low sun on it
    ctx.fillStyle = SKY;
    ctx.fillRect(-46, -46, DW + 92, 196);
    var sun = tornCircle(768, 58, 56, 55, 0.07);
    cutout(sun, 768, 58, SUN);
    // a low paper horizon strip where backdrop meets ground
    var hor = tornRect(-46, 128, DW + 92, 24, 88, 3);
    trace(hor); ctx.fillStyle = '#B49B72'; ctx.fill();

    // asphalt field
    ctx.fillStyle = ASPH;
    ctx.fillRect(-46, 150, DW + 92, DH - 150 + 46);

    // faded parking stripes: stall lines at the car gaps + a worn line per row
    ctx.globalAlpha = 0.42; ctx.fillStyle = BONE;
    var stalls = [86, 322, 622, 922, 236, 496, 756, 330, 646];
    for (var i = 0; i < stalls.length; i++) {
      for (var seg = 0; seg < 12; seg++) {
        var sy = 168 + seg * 46 + (hash2(stalls[i], seg) - 0.5) * 4;
        ctx.fillRect(stalls[i] + (hash2(seg, stalls[i]) - 0.5) * 3, sy, 5, 34);
      }
    }
    ctx.globalAlpha = 0.20;
    ctx.fillRect(-20, 330, DW + 40, 4);
    ctx.fillRect(-20, 502, DW + 40, 4);
    ctx.fillRect(-20, 668, DW + 40, 4);
    ctx.globalAlpha = 1;

    // cooler boxes
    for (var c = 0; c < coolers.length; c++) {
      var co = coolers[c];
      var cjx = (hash2(f * 7 + co.seed, 3) - 0.5) * 2, cjy = (hash2(f * 7 + co.seed, 9) - 0.5) * 2;
      var cbody = tornRect(co.x - 17 + cjx, co.y - 13 + cjy, 34, 26, co.seed, 2);
      cutout(cbody, co.x + cjx, co.y + cjy, co.color);
      ctx.fillStyle = BONE;
      ctx.fillRect(co.x - 17 + cjx, co.y - 13 + cjy, 34, 6);
    }

    // flag pole rises from the top-right car into the sky band
    ctx.fillStyle = INK;
    ctx.fillRect(FLAG_X - 1.5, FLAG_Y, 3, FLAG_POLE_BASE - FLAG_Y);
    var fstep = ((Math.floor(f / 2) % 4) + 4) % 4;
    cutout(flagShapes[fstep], FLAG_X + 28, FLAG_Y + 12, RED1);
    glueTab(FLAG_X + 6, FLAG_Y + 2, 12, 6, 0.2);

    // cars, then figures standing between the rows
    for (var k = 0; k < cars.length; k++) drawCar(cars[k], f);
    for (var g = 0; g < figures.length; g++) drawFigure(figures[g], f);

    ctx.restore();

    // boiling paper grain over the whole frame, re-hashed every step
    var i2, gx, gy;
    for (i2 = 0; i2 < 650; i2++) {
      gx = hash2(f, i2 * 2 + 11) * W;
      gy = hash2(f, i2 * 2 + 29) * H;
      ctx.globalAlpha = 0.05;
      ctx.fillStyle = i2 % 2 ? BONE : INK;
      ctx.fillRect(gx, gy, hash2(i2, f) > 0.85 ? 2 : 1, 1);
    }
    // a sparse second set, fainter, so the grain reads at thumbnail size too
    for (i2 = 0; i2 < 160; i2++) {
      gx = hash2(f + 500, i2 * 3 + 7) * W;
      gy = hash2(f + 500, i2 * 3 + 19) * H;
      ctx.globalAlpha = 0.035;
      ctx.fillStyle = i2 % 2 ? INK : BONE;
      ctx.fillRect(gx, gy, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    lastPhase = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    drawScene(t);
  }

  // ---- pointer: drag pans the lightbox, movement scatters nearby figures ----
  function evtPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (typeof e.clientX === 'number') ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (typeof e.clientY === 'number') ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return [cx - r.left, cy - r.top];
  }
  function onDown(e) {
    var p = evtPos(e);
    drag = { px: p[0], py: p[1] };
    var d = toDesign(p[0], p[1]);
    scatterAt(d[0], d[1], Math.floor(lastPhase * FPS));
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!drag) return;
    var p = evtPos(e);
    var s = fitScale();
    panX = clamp(panX + (p[0] - drag.px) / s, -DW * 0.15, DW * 0.15);
    panY = clamp(panY + (p[1] - drag.py) / s, -DH * 0.15, DH * 0.15);
    drag.px = p[0]; drag.py = p[1];
    var d = toDesign(p[0], p[1]);
    scatterAt(d[0], d[1], Math.floor(lastPhase * FPS));
    draw(lastPhase);
  }
  function onUp() { drag = null; }
  if (canvas.addEventListener) {
    if (typeof window !== 'undefined' && window.PointerEvent) {
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);
    } else {
      canvas.addEventListener('mousedown', onDown);
      canvas.addEventListener('mousemove', onMove);
      canvas.addEventListener('mouseup', onUp);
      canvas.addEventListener('touchstart', onDown, { passive: false });
      canvas.addEventListener('touchmove', onMove, { passive: false });
      canvas.addEventListener('touchend', onUp);
    }
  }

  function onResize() { resize(); draw(lastPhase); }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', onResize);
  }

  // ---- first frame synchronously at the fixed phase, then the anchored loop ----
  resize();
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var startMs = null;
    var nowFn = (typeof performance !== 'undefined' && performance.now)
      ? function () { return performance.now(); }
      : function () { return Date.now(); };
    var tick = function () {
      var now = nowFn();
      if (startMs === null) startMs = now;
      draw(T0 + (now - startMs) / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
