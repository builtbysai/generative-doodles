<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Animales de Poder</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0B0B0D; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.662 "Animales de Poder" (EXPANSION #80 angela-leible, block 6).
  // Her mural as a procession. One by one, her power animals emerge
  // from individual stains and cross the frame: each animal is one
  // stain plus one found line, in its own two-color micro-palette.
  // One animal at a time, always; between crossings the canvas
  // breathes empty black. Watch-only: a procession is watched.

  var GROUND = '#0B0B0D';

  // Composition space: FW x FH abstract units, mapped onto the viewport.
  var FW = 1.6, FH = 1.0;

  // The 84 s loop: six slots of 14 s. Per slot: the stain grows at
  // stage-left (0-3 s), the animal is found (3-6 s), it crosses and
  // dissolves at the right edge (6-12 s), then 2 s of empty black.
  var LOOP = 84, SLOT = 14;
  var GROW_T = 3, FIND_T = 3, CROSS_T = 6;
  // Frame one is drawn at a constant phase 0.4 s into the loop, so the
  // first frame shows the jaguar's first blotches just appearing. The
  // phase is a constant, never derived from Date.now().
  var PHASE0 = 0.4;

  var BASE_SEED = 662001;

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(a, b, v) { var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

  // ------------------------------------------------------------------
  // THE SIX ANIMALS, fixed order. dark = the stain, light = the found
  // line and the specks. w/h = body size in composition units;
  // home = where the animal is found (stage-left); warp shapes the
  // stain mass before the outline is traced; cross = how it travels.
  // ------------------------------------------------------------------
  var ANIMALS = [
    { name: 'jaguar',  dark: '#8A4A2B', light: '#E2703A', w: 0.62, h: 0.34, home: [0.34, 0.54], warp: 'none',     cross: 'level' },
    { name: 'condor',  dark: '#2B3A7A', light: '#E8E2D0', w: 0.88, h: 0.40, home: [0.47, 0.40], warp: 'dihedral', cross: 'high' },
    { name: 'whale',   dark: '#1F3A5F', light: '#7FB3C8', w: 0.85, h: 0.40, home: [0.45, 0.52], warp: 'arc',      cross: 'breach' },
    { name: 'pelican', dark: '#EDE4D0', light: '#6B6B6E', w: 0.55, h: 0.42, home: [0.31, 0.52], warp: 'none',     cross: 'level' },
    { name: 'puma',    dark: '#3E7A6B', light: '#D9A441', w: 0.60, h: 0.33, home: [0.33, 0.54], warp: 'none',     cross: 'level' },
    { name: 'goat',    dark: '#D9A441', light: '#8A4A2B', w: 0.48, h: 0.40, home: [0.28, 0.52], warp: 'none',     cross: 'level' }
  ];

  // ------------------------------------------------------------------
  // FINDING KITS. Each kit is a set of polylines in local coords
  // (u: -1..1 toward the head at +u, v: -1..1, negative = up), fitted
  // onto the stain outline's bbox and pulled inside the outline, so
  // the line finds the animal inside THIS stain. Procedural profiles:
  // body arcs plus limb, wing, fin or horn hints. No photorealism.
  // ------------------------------------------------------------------
  var KITS = {
    // Long low cat; blocky head, tail carried low with a droop, and
    // three rosette hints (small broken rings) on the flank.
    jaguar: {
      eye: [0.74, -0.30],
      strokes: [
        [[-0.85, -0.28], [-0.40, -0.38], [0.10, -0.38], [0.50, -0.32]],        // back
        [[0.50, -0.32], [0.68, -0.46], [0.84, -0.40], [0.88, -0.24]],          // head
        [[0.88, -0.24], [0.72, -0.13], [0.58, -0.19]],                         // jaw
        [[0.64, -0.46], [0.68, -0.58]],                                       // ear tick
        [[-0.60, 0.18], [0.00, 0.27], [0.50, 0.19]],                          // belly
        [[0.42, 0.21], [0.46, 0.52], [0.44, 0.82]],                           // front leg
        [[-0.55, 0.21], [-0.60, 0.52], [-0.56, 0.82]],                        // back leg
        [[-0.85, -0.24], [-1.00, -0.06], [-0.99, 0.20], [-0.90, 0.38]],       // tail, low droop
        [[-0.36, -0.10], [-0.29, -0.16], [-0.23, -0.09], [-0.25, -0.01], [-0.33, 0.01], [-0.37, -0.05]], // rosette
        [[0.08, -0.16], [0.15, -0.21], [0.20, -0.14], [0.17, -0.07], [0.10, -0.08], [0.07, -0.12]],       // rosette
        [[-0.62, -0.02], [-0.56, -0.07], [-0.51, -0.01], [-0.54, 0.05], [-0.60, 0.05], [-0.63, 0.02]]    // rosette
      ]
    },
    // Broad wingspan mass; wing spines, feather barbs, body, tail fan.
    condor: {
      eye: [0.03, -0.20],
      strokes: [
        [[-0.06, -0.02], [-0.45, -0.22], [-0.85, -0.30]],
        [[0.06, -0.02], [0.45, -0.22], [0.85, -0.30]],
        [[-0.42, -0.21], [-0.48, -0.02]], [[-0.65, -0.26], [-0.70, -0.04]], [[-0.85, -0.30], [-0.88, -0.10]],
        [[0.42, -0.21], [0.48, -0.02]], [[0.65, -0.26], [0.70, -0.04]], [[0.85, -0.30], [0.88, -0.10]],
        [[0, -0.24], [0.0, 0.03], [0.02, 0.27]],
        [[-0.15, 0.36], [0, 0.27], [0.15, 0.36]]
      ]
    },
    // Great curved body; arched spine, blunt head, mouth line, tail
    // fluke at the rear, one pectoral fin.
    whale: {
      eye: [0.68, 0.06],
      strokes: [
        [[-0.68, -0.04], [-0.35, -0.28], [0.05, -0.37], [0.45, -0.31], [0.74, -0.14]], // arched back
        [[0.74, -0.14], [0.90, 0.00], [0.83, 0.15]],                                  // blunt head
        [[0.83, 0.15], [0.58, 0.21]],                                                 // mouth line
        [[-0.52, 0.27], [-0.10, 0.38], [0.38, 0.30]],                                 // belly
        [[-0.68, -0.04], [-0.90, -0.24]],                                             // fluke, upper
        [[-0.68, -0.04], [-0.92, 0.13]],                                              // fluke, lower
        [[0.34, 0.29], [0.24, 0.56]]                                                  // pectoral fin
      ]
    },
    // Body with a long bill and pouch line, folded wing, leg ticks.
    pelican: {
      eye: [0.66, -0.44],
      strokes: [
        [[-0.60, -0.28], [-0.20, -0.42], [0.25, -0.40], [0.50, -0.30]],        // back
        [[0.50, -0.30], [0.62, -0.50], [0.72, -0.46]],                         // neck and head
        [[0.72, -0.46], [0.98, -0.27]],                                       // long bill
        [[0.98, -0.27], [0.82, -0.13], [0.68, -0.14]],                         // pouch curve
        [[-0.45, -0.18], [-0.05, 0.03], [0.30, -0.04]],                        // folded wing
        [[-0.40, -0.03], [0.00, 0.17], [0.28, 0.09]],                          // wing, second fold
        [[-0.50, 0.20], [0.00, 0.30], [0.40, 0.20]],                           // belly
        [[0.10, 0.30], [0.10, 0.56]],                                         // leg
        [[0.30, 0.27], [0.30, 0.52]]                                          // leg
      ]
    },
    // Long low cat like the jaguar but slimmer: smaller rounder head,
    // no rosettes (a plain coat), tail carried high in a curve.
    puma: {
      eye: [0.72, -0.30],
      strokes: [
        [[-0.85, -0.30], [-0.40, -0.40], [0.10, -0.40], [0.52, -0.34]],        // back
        [[0.52, -0.34], [0.69, -0.43], [0.82, -0.33], [0.84, -0.19]],          // head
        [[0.84, -0.19], [0.70, -0.11], [0.60, -0.17]],                         // jaw
        [[-0.60, 0.16], [0.00, 0.25], [0.50, 0.17]],                           // belly
        [[0.40, 0.19], [0.44, 0.52], [0.42, 0.82]],                            // front leg
        [[-0.55, 0.19], [-0.58, 0.52], [-0.54, 0.82]],                         // back leg
        [[-0.85, -0.27], [-0.99, -0.48], [-0.88, -0.68]]                       // tail, high curve
      ]
    },
    // Compact body, curved horn sweeping back, beard tick, tail up.
    goat: {
      eye: [0.72, -0.32],
      strokes: [
        [[-0.70, -0.28], [-0.30, -0.40], [0.20, -0.40], [0.50, -0.32]],        // back
        [[0.50, -0.32], [0.66, -0.45], [0.80, -0.37], [0.82, -0.21]],          // head
        [[0.66, -0.46], [0.52, -0.66], [0.37, -0.62]],                         // horn, curved back
        [[0.80, -0.19], [0.83, -0.03]],                                       // beard tick
        [[-0.55, 0.15], [0.00, 0.25], [0.45, 0.16]],                           // belly
        [[0.38, 0.18], [0.40, 0.50], [0.38, 0.80]],                            // front leg
        [[-0.50, 0.18], [-0.52, 0.50], [-0.50, 0.80]],                         // back leg
        [[-0.70, -0.29], [-0.83, -0.45]]                                      // tail, up tick
      ]
    }
  };

  function cumLengths(pts, closed) {
    var cum = [0], total = 0, i;
    var n = pts.length, m = closed ? n : n - 1;
    for (i = 0; i < m; i++) {
      var a = pts[i], b = pts[(i + 1) % n];
      total += Math.sqrt((b[0] - a[0]) * (b[0] - a[0]) + (b[1] - a[1]) * (b[1] - a[1]));
      cum.push(total);
    }
    return { cum: cum, total: total };
  }

  // ------------------------------------------------------------------
  // STAIN GENERATION (per animal, precomputed as data, Mancha method).
  // Diffusion walkers wander inside an ellipse with the animal's body
  // aspect and deposit flat blotches in interleaved order, each with a
  // birth fraction: at growth fraction g, every blotch with birth < g
  // is drawn. A warp shapes the mass (condor dihedral, whale arc)
  // before the outline is traced. The outline is a radial boundary
  // trace over the largest connected component, smoothed into one
  // organic closed polyline. The kit strokes are fitted to the
  // outline's bbox and pulled inside it.
  // ------------------------------------------------------------------
  function genAnimal(anim, seed) {
    var rng = mulberry32(seed);
    var rx = anim.w / 2 * 0.94, ry = anim.h / 2 * 0.94;
    // Walkers live in a unit disc and their positions are scaled by
    // (rx, ry) on deposit, so the mass fills the animal's ellipse
    // proportionally whatever its aspect (a condor's wingspan is as
    // wide in the stain as it is in the kit). Blotches are stored with
    // separate x/y radii; b.r is their mean, used by the overlap and
    // outline approximations.
    var WALKERS = 26;
    var walkers = [], i, j;
    for (i = 0; i < WALKERS; i++) {
      walkers.push({
        x: (rng() - 0.5) * 0.4,
        y: (rng() - 0.5) * 0.4,
        dir: rng() * Math.PI * 2,
        steps: 10 + Math.floor(rng() * 6),
        speed: 0.055 + rng() * 0.045
      });
    }
    function warpY(x, y) {
      if (anim.warp === 'arc') return y - 0.055 * (1 - Math.pow(x / (anim.w / 2), 2));
      if (anim.warp === 'dihedral') return y - 0.050 * Math.abs(x / (anim.w / 2));
      return y;
    }
    var blotches = [];
    var maxSteps = 0;
    for (i = 0; i < WALKERS; i++) if (walkers[i].steps > maxSteps) maxSteps = walkers[i].steps;
    for (var s = 0; s < maxSteps; s++) {
      for (i = 0; i < WALKERS; i++) {
        var wk = walkers[i];
        if (s >= wk.steps) continue;
        wk.dir += (rng() - 0.5) * 1.1;
        var nx = wk.x + Math.cos(wk.dir) * wk.speed + (0 - wk.x) * 0.012;
        var ny = wk.y + Math.sin(wk.dir) * wk.speed + (0 - wk.y) * 0.012;
        var q = nx * nx + ny * ny;
        if (q > 0.94 * 0.94) { // steer home: the mass stays one body in the disc
          var sc = 0.92 / Math.sqrt(q);
          nx *= sc; ny *= sc;
          wk.dir = Math.atan2(-ny, -nx) + (rng() - 0.5) * 0.8;
          q = 0.92 * 0.92;
        }
        wk.x = nx; wk.y = ny;
        var ru = clamp(0.115 * (1.18 - Math.sqrt(q) * 0.5) * (0.7 + rng() * 0.7), 0.05, 0.19);
        var verts = [];
        var baseA = rng() * Math.PI * 2;
        for (j = 0; j < 8; j++) {
          var a = baseA + j / 8 * Math.PI * 2 + (rng() - 0.5) * 0.3;
          var rf = 0.72 + rng() * 0.5;
          verts.push([Math.cos(a) * rf, Math.sin(a) * rf]);
        }
        var bx2 = wk.x * rx, by2 = wk.y * ry;
        blotches.push({
          x: bx2, y: warpY(bx2, by2),
          rx: ru * rx, ry: ru * ry, r: ru * (rx + ry) / 2,
          verts: verts, birth: 0
        });
      }
    }
    var N = blotches.length;
    for (i = 0; i < N; i++) {
      blotches[i].birth = clamp(i / (N - 1) + (rng() - 0.5) * 0.02, 0, 1);
    }
    // Specks: a few light dots settle inside existing blotches.
    var specks = [];
    var nSpeck = 8 + Math.floor(rng() * 5);
    for (i = 0; i < nSpeck; i++) {
      var host = blotches[Math.floor(rng() * N)];
      specks.push({
        x: host.x + (rng() - 0.5) * host.rx * 1.1,
        y: host.y + (rng() - 0.5) * host.ry * 1.1,
        r: 0.0028 + rng() * 0.004,
        birth: clamp(host.birth + 0.01, 0, 1)
      });
    }

    // ---- Largest connected component (union-find over overlaps) ----
    var parent = new Int32Array(N);
    for (i = 0; i < N; i++) parent[i] = i;
    function find(a) { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; }
    for (i = 0; i < N; i++) {
      for (j = i + 1; j < N; j++) {
        var bx = blotches[i].x - blotches[j].x, by = blotches[i].y - blotches[j].y;
        var rr = (blotches[i].r + blotches[j].r) * 0.92;
        if (bx * bx + by * by < rr * rr) {
          var ra = find(i), rb = find(j);
          if (ra !== rb) parent[ra] = rb;
        }
      }
    }
    var compArea = {}, compList = {};
    for (i = 0; i < N; i++) {
      var root = find(i);
      compArea[root] = (compArea[root] || 0) + blotches[i].r * blotches[i].r;
      (compList[root] = compList[root] || []).push(i);
    }
    var bestRoot = -1, bestArea = -1;
    for (var key in compArea) if (compArea[key] > bestArea) { bestArea = compArea[key]; bestRoot = +key; }
    var comp = compList[bestRoot];

    var ccx = 0, ccy = 0, wsum = 0;
    for (i = 0; i < comp.length; i++) {
      var b = blotches[comp[i]], wgt = b.r * b.r;
      ccx += b.x * wgt; ccy += b.y * wgt; wsum += wgt;
    }
    ccx /= wsum; ccy /= wsum;

    // ---- Outline: radial boundary trace over the union of discs ----
    var K = 160, radii = new Float64Array(K);
    for (i = 0; i < K; i++) {
      var th = i / K * Math.PI * 2, ux = Math.cos(th), uy = Math.sin(th);
      var tMax = 0.02;
      for (j = 0; j < comp.length; j++) {
        var bb = blotches[comp[j]];
        var ex = bb.x - ccx, ey = bb.y - ccy;
        var proj = ex * ux + ey * uy;
        var perp2 = ex * ex + ey * ey - proj * proj;
        var disc = bb.r * bb.r - perp2;
        if (disc < 0) continue;
        var t = proj + Math.sqrt(disc);
        if (t > tMax) tMax = t;
      }
      radii[i] = tMax;
    }
    for (var pass = 0; pass < 2; pass++) {
      var sm = new Float64Array(K);
      for (i = 0; i < K; i++) {
        var acc = 0;
        for (j = -3; j <= 3; j++) acc += radii[(i + j + K) % K];
        sm[i] = acc / 7;
      }
      radii = sm;
    }
    var outline = [];
    for (i = 0; i < K; i++) {
      outline.push([ccx + Math.cos(i / K * Math.PI * 2) * radii[i],
                    ccy + Math.sin(i / K * Math.PI * 2) * radii[i]]);
    }
    outline.cum = cumLengths(outline, true);

    // ---- Fit the kit to the outline ----
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (i = 0; i < K; i++) {
      if (outline[i][0] < minX) minX = outline[i][0];
      if (outline[i][0] > maxX) maxX = outline[i][0];
      if (outline[i][1] < minY) minY = outline[i][1];
      if (outline[i][1] > maxY) maxY = outline[i][1];
    }
    var fit = {
      bcx: (minX + maxX) / 2, bcy: (minY + maxY) / 2,
      bw: maxX - minX, bh: maxY - minY,
      ccx: ccx, ccy: ccy, radii: radii, K: K
    };
    var kit = KITS[anim.name];
    function mapPt(p) {
      var x = fit.bcx + p[0] * fit.bw / 2 * 0.94;
      var y = fit.bcy + p[1] * fit.bh / 2 * 0.94;
      var dx = x - fit.ccx, dy = y - fit.ccy;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > 1e-6) {
        var th2 = Math.atan2(dy, dx);
        var idx = ((Math.round(th2 / (Math.PI * 2) * fit.K) % fit.K) + fit.K) % fit.K;
        var rOut = fit.radii[idx];
        if (d > rOut * 0.93) {
          var s2 = rOut * 0.88 / d;
          x = fit.ccx + dx * s2; y = fit.ccy + dy * s2;
        }
      }
      return [x, y];
    }
    var strokes = [];
    for (i = 0; i < kit.strokes.length; i++) {
      var pts = [];
      for (j = 0; j < kit.strokes[i].length; j++) pts.push(mapPt(kit.strokes[i][j]));
      var cl = cumLengths(pts, false);
      strokes.push({ pts: pts, cum: cl.cum, total: cl.total });
    }

    return {
      anim: anim, blotches: blotches, specks: specks, outline: outline,
      centroid: [ccx, ccy], strokes: strokes, eye: mapPt(kit.eye)
    };
  }

  // Precompute all six animals at load: every frame is then a pure
  // function of loop time.
  var DATA = [];
  for (var ai = 0; ai < ANIMALS.length; ai++) {
    DATA.push(genAnimal(ANIMALS[ai], (BASE_SEED + ai * 1013) | 0));
  }

  // QA hook: location.search "seed=tNN" freezes the loop clock at NN
  // seconds into the loop.
  var forcedT = -1;
  try {
    var qs = String((typeof location !== 'undefined' && location.search) || '');
    var mt = /[?&]seed=t(\d+)/.exec(qs);
    if (mt) forcedT = parseInt(mt[1], 10);
  } catch (e) { forcedT = -1; }

  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - t0) / 1000;
    return 0;
  }

  // ------------------------------------------------------------------
  // Layout (Visual Viewport API, resize listeners on both)
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var scale = 1, orgX = 0, orgY = 0;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr) isPhone = Math.min(scr.width, scr.height) < 700;
    else isPhone = h > w * 1.15;
    scale = Math.min(W / FW, H / FH) * 0.97;
    orgX = (W - FW * scale) / 2;
    orgY = (H - FH * scale) / 2;
  }
  function px(x) { return orgX + x * scale; }
  function py(y) { return orgY + y * scale; }

  // ------------------------------------------------------------------
  // Drawing helpers
  // ------------------------------------------------------------------
  var lineColor = '#FFFFFF';
  // Draw a polyline up to fraction frac of its arc length, with a
  // pressure profile: the stroke swells mid-way and tapers at the ends.
  function drawPartial(pts, cum, total, frac, baseW, closed, ox, oy) {
    if (frac <= 0 || total <= 0) return;
    var target = total * clamp(frac, 0, 1);
    var n = pts.length, m = closed ? n : n - 1;
    ctx.strokeStyle = lineColor;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var drawn = 0;
    for (var i = 0; i < m; i++) {
      var a = pts[i], b = pts[(i + 1) % n];
      var segLen = cum[i + 1] - cum[i];
      if (segLen <= 0) continue;
      var remain = target - drawn;
      if (remain <= 0) break;
      var f = Math.min(1, remain / segLen);
      var ex = a[0] + (b[0] - a[0]) * f, ey = a[1] + (b[1] - a[1]) * f;
      var sMid = (drawn + segLen * f / 2) / total;
      ctx.lineWidth = Math.max(0.6, baseW * (0.7 + 0.5 * Math.sin(Math.PI * clamp(sMid, 0, 1))));
      ctx.beginPath();
      ctx.moveTo(px(a[0] + ox), py(a[1] + oy));
      ctx.lineTo(px(ex + ox), py(ey + oy));
      ctx.stroke();
      drawn += segLen * f;
    }
  }

  // Draw one animal composite. cx, cy = body center in composition
  // units; g = stain growth fraction; p2 = finding progress (0..1);
  // alpha and rot apply to the whole composite.
  function drawAnimal(data, cx, cy, g, p2, alpha, rot, breath) {
    var anim = data.anim;
    var cenX = px(cx + data.centroid[0]), cenY = py(cy + data.centroid[1]);
    ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    if (rot !== 0 || breath !== 1) {
      ctx.translate(cenX, cenY);
      if (rot !== 0) ctx.rotate(rot);
      if (breath !== 1) ctx.scale(breath, breath);
      ctx.translate(-cenX, -cenY);
    }
    // Blotches, in deposit order, each scaling in as it is born.
    var bl = data.blotches, i, j;
    ctx.fillStyle = anim.dark;
    for (i = 0; i < bl.length; i++) {
      var b = bl[i];
      if (b.birth >= g) continue;
      var grow = clamp((g - b.birth) / 0.025, 0, 1);
      grow = Math.sqrt(grow);
      var rrx = b.rx * grow * scale, rry = b.ry * grow * scale;
      var nv = b.verts.length, pts = [];
      for (j = 0; j < nv; j++) pts.push([px(cx + b.x) + b.verts[j][0] * rrx, py(cy + b.y) + b.verts[j][1] * rry]);
      ctx.beginPath();
      var mx = (pts[nv - 1][0] + pts[0][0]) / 2, my = (pts[nv - 1][1] + pts[0][1]) / 2;
      ctx.moveTo(mx, my);
      for (j = 0; j < nv; j++) {
        var p = pts[j], q2 = pts[(j + 1) % nv];
        ctx.quadraticCurveTo(p[0], p[1], (p[0] + q2[0]) / 2, (p[1] + q2[1]) / 2);
      }
      ctx.closePath();
      ctx.fill();
    }
    // Light specks inside the mass.
    ctx.fillStyle = anim.light;
    for (i = 0; i < data.specks.length; i++) {
      var sp = data.specks[i];
      if (sp.birth >= g) continue;
      ctx.beginPath();
      ctx.arc(px(cx + sp.x), py(cy + sp.y), Math.max(0.6, sp.r * scale), 0, Math.PI * 2);
      ctx.fill();
    }
    // The finding: outline first, then the inner strokes in sequence.
    if (p2 > 0) {
      lineColor = anim.light;
      var baseW = 0.0058 * scale;
      drawPartial(data.outline, data.outline.cum.cum, data.outline.cum.total, p2 / 0.55, baseW, true, cx, cy);
      var nSt = data.strokes.length;
      for (i = 0; i < nSt; i++) {
        var w0 = 0.55 + 0.42 * (i / nSt), w1 = 0.55 + 0.42 * ((i + 1) / nSt);
        var sf = clamp((p2 - w0) / (w1 - w0), 0, 1);
        var st = data.strokes[i];
        drawPartial(st.pts, st.cum, st.total, sf, baseW * 0.8, false, cx, cy);
      }
      if (p2 >= 0.56) {
        ctx.fillStyle = anim.light;
        ctx.beginPath();
        ctx.arc(px(cx + data.eye[0]), py(cy + data.eye[1]), Math.max(0.9, 0.0075 * scale), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function draw(nowOverride) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    // The synchronous first frame passes an explicit 0 so frame one is
    // always the constant phase, never a live-clock reading.
    var te;
    if (forcedT >= 0) te = forcedT;
    else if (typeof nowOverride === 'number') te = nowOverride + PHASE0;
    else te = elapsed() + PHASE0;
    te = ((te % LOOP) + LOOP) % LOOP;
    var slot = Math.floor(te / SLOT);
    var lt = te - slot * SLOT;
    if (lt >= GROW_T + FIND_T + CROSS_T) return; // the empty breath
    var data = DATA[slot];
    var anim = data.anim;
    var cx = anim.home[0], cy = anim.home[1];
    var g = 1, p2 = 0, alpha = 1, rot = 0, breath = 1;
    if (lt < GROW_T) {
      g = lt / GROW_T;
      alpha = Math.min(1, lt / 0.5);
    } else if (lt < GROW_T + FIND_T) {
      p2 = (lt - GROW_T) / FIND_T;
      breath = 1 + 0.01 * Math.sin(Math.PI * (lt - GROW_T) / FIND_T);
    } else {
      var cp = (lt - GROW_T - FIND_T) / CROSS_T;
      p2 = 1;
      var exitX = FW + anim.w * 0.75;
      cx = anim.home[0] + (exitX - anim.home[0]) * easeInOut(cp);
      alpha = 1 - smooth(0.72, 1, cp);
      if (anim.cross === 'breach') {
        // The breach runs ahead of the exit: it peaks at cp = 0.375,
        // while the whale is still mostly in frame, then levels off
        // as the body slides out.
        var bp = clamp(cp / 0.75, 0, 1);
        cy = anim.home[1] - 0.16 * Math.sin(Math.PI * bp);
        rot = -0.10 * Math.sin(Math.PI * bp);
      } else if (anim.cross === 'high') {
        cy = anim.home[1] - 0.06 * Math.sin(Math.PI * cp);
      } else {
        cy = anim.home[1] + 0.006 * Math.sin(lt * 4.2);
      }
    }
    drawAnimal(data, cx, cy, g, p2, alpha, rot, breath);
  }

  // Watch-only: no interaction handlers at all. A procession is watched.

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
    }
  }

  resize();
  draw(0); // frame one: synchronous draw at the constant phase

  if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
