<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Río</title>
<style>
  html, body { margin: 0; padding: 0; background: #232A4A; overflow: hidden; }
  canvas { display: block; cursor: grab; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var TAU = Math.PI * 2;
function frac(x) { return x - Math.floor(x); }

// ---------- palette (strict, PP8) ----------
var RIVER = "#3A6A9A";
var INDIGO = "#232A4A";
var FOX = "#C25A3A";
var FLAME = "#E88B2E";
var CROC = "#4A7A52";
var HEART = "#E86A9A";
var CREAM = "#F0E6C8";
var TEAR = "#BFD8E8";
var SKIN = "#E8B88A";

// ---------- canvas / viewport ----------
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone() {
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0 && mn < 700) return true;
  return H > W * 1.15;
}

function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  draw(currentPhase());
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
}
window.addEventListener("resize", resize);

// ---------- animation state ----------
// One eternal blue hour. LOOP seconds per full cycle; every emitter period
// divides LOOP, so the whole river loops seamlessly.
var LOOP = 12;
var PHASE0 = 4.2;         // fixed first-frame phase: tears mid-fall, droplet falling
var startStamp = null;

function currentPhase() {
  if (startStamp === null) return PHASE0;
  var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  return PHASE0 + (now - startStamp) / 1000;
}

// ---------- panorama / drag pan ----------
var WORLD_W = 1430;       // panorama width in stage units (stage height = 1000)
var pan = 0, panT = 0;
var dragging = false, dragSX = 0, dragStartPan = 0;

function stageScale() { return Math.min(W, H) / 1000; }
function clampPan(v) {
  var viewW = W / stageScale();
  var maxP = WORLD_W - viewW;
  if (maxP <= 0) return maxP / 2;   // panorama narrower than view: center it
  return Math.max(0, Math.min(maxP, v));
}
canvas.addEventListener("pointerdown", function (e) {
  dragging = true; dragSX = e.clientX; dragStartPan = panT;
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  panT = clampPan(dragStartPan - (e.clientX - dragSX) / stageScale());
});
function endDrag() { dragging = false; }
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

// ---------- precomputed seeded detail ----------
var stars = [];
(function () {
  var r = mulberry32(576001);
  for (var i = 0; i < 80; i++) {
    var x = r() * WORLD_W, y = 16 + r() * 420;
    var dx = x - 180, dy = y - 182;
    if (dx * dx + dy * dy < 150 * 150) continue;   // keep the moon's sky clear
    stars.push({ x: x, y: y, rad: 0.9 + r() * 1.4, a: 0.25 + r() * 0.45 });
  }
})();
// ripple bands: sine-displaced lines across the river, params fixed by seed
var ripples = [];
(function () {
  var r = mulberry32(576002);
  var i;
  for (i = 0; i < 14; i++) {
    ripples.push({
      baseY: 580 + i * 29 + r() * 10,
      k: 0.008 + r() * 0.006,
      p: r() * TAU,
      amp: 2.5 + r() * 3.5,
      m: (i % 2 === 0) ? 1 : 2,
      col: TEAR,
      a: 0.08 + (i % 4) * 0.045,
      lw: 2.5 + (i % 3)
    });
  }
  for (i = 0; i < 5; i++) {
    ripples.push({
      baseY: 606 + i * 78 + r() * 14,
      k: 0.006 + r() * 0.005,
      p: r() * TAU,
      amp: 3 + r() * 3,
      m: 1,
      col: INDIGO,
      a: 0.16,
      lw: 4
    });
  }
})();
// moonlight shimmer strokes on the water
var shimmer = [];
(function () {
  var r = mulberry32(576003);
  for (var i = 0; i < 9; i++) {
    shimmer.push({ x: 104 + r() * 180, y: 566 + i * 26 + r() * 10, len: 22 + r() * 34, p: r() * TAU });
  }
})();
// far-shore silhouette bushes
var shoreBumps = [];
(function () {
  var r = mulberry32(576004);
  for (var x = -10; x < WORLD_W + 40; x += 62 + r() * 55) {
    shoreBumps.push({ x: x, rad: 17 + r() * 27 });
  }
})();

// ---------- shared shapes ----------
function tearDrop(x, y, s, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = TEAR;
  ctx.beginPath();
  ctx.moveTo(x, y - s * 1.15);
  ctx.bezierCurveTo(x + s * 0.82, y - s * 0.1, x + s * 0.62, y + s * 0.45, x, y + s * 0.62);
  ctx.bezierCurveTo(x - s * 0.62, y + s * 0.45, x - s * 0.82, y - s * 0.1, x, y - s * 1.15);
  ctx.fill();
  ctx.restore();
}
// one falling tear on a fixed path, phase-locked; splash ring at the end of the fall
function tearFall(phase, x, y, len, period, offset, s) {
  var u = frac((phase + offset) / period);
  if (u < 0.8) {
    var v = u / 0.8;
    var yy = y + v * v * len;
    var a = v < 0.12 ? v / 0.12 : 1;
    tearDrop(x, yy, s, a);
  } else {
    var w = (u - 0.8) / 0.2;
    ctx.save();
    ctx.globalAlpha = (1 - w) * 0.8;
    ctx.strokeStyle = TEAR;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(x, y + len, s * (1 + w * 2.4), s * 0.38 * (1 + w), 0, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
}
function tearStreak(x, y0, y1, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = TEAR;
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
  ctx.restore();
}
function rippleRing(x, y, rx, ry, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = TEAR;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.stroke();
  ctx.restore();
}
function heartPath(cx, cy, w, h) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + h * 0.42);
  ctx.bezierCurveTo(cx - w * 0.55, cy + h * 0.05, cx - w * 0.5, cy - h * 0.42, cx, cy - h * 0.16);
  ctx.bezierCurveTo(cx + w * 0.5, cy - h * 0.42, cx + w * 0.55, cy + h * 0.05, cx, cy + h * 0.42);
  ctx.closePath();
}
function flameTongue(cx, baseY, w, h, lean) {
  ctx.beginPath();
  ctx.moveTo(cx - w / 2, baseY);
  ctx.bezierCurveTo(cx - w / 2, baseY - h * 0.55, cx - w * 0.16 + lean, baseY - h * 0.8, cx + lean, baseY - h);
  ctx.bezierCurveTo(cx + w * 0.16 + lean, baseY - h * 0.8, cx + w / 2, baseY - h * 0.55, cx + w / 2, baseY);
  ctx.closePath();
}

// ---------- sky, moon, shore ----------
function drawSky() {
  ctx.fillStyle = INDIGO;
  ctx.fillRect(-80, -80, WORLD_W + 160, 1160);
  var i, s;
  ctx.fillStyle = CREAM;
  for (i = 0; i < stars.length; i++) {
    s = stars[i];
    ctx.globalAlpha = s.a;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.rad, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawMoon(phase) {
  // crescent: cream disc carved by an indigo disc (sky colour, invisible seam)
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.arc(180, 182, 96, 0, TAU); ctx.fill();
  ctx.fillStyle = INDIGO;
  ctx.beginPath(); ctx.arc(237, 146, 85, 0, TAU); ctx.fill();
  // face on the thick limb: closed eye, small frown
  ctx.strokeStyle = INDIGO;
  ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(114, 208); ctx.quadraticCurveTo(128, 217, 142, 208); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(115, 190); ctx.quadraticCurveTo(128, 186, 141, 191); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(112, 254); ctx.quadraticCurveTo(124, 247, 136, 254); ctx.stroke();
  // her tears: two long falls to the far shore, half a loop apart
  tearStreak(126, 214, 300, 0.4);
  tearFall(phase, 125, 218, 328, 6, 0, 7);
  tearFall(phase, 125, 218, 328, 6, 3, 7);
  // the red droplet: grows at the lower tip, falls, reforms (period 6)
  var u = frac((phase + 2.5) / 6);
  ctx.fillStyle = FOX;
  if (u < 0.25) {
    var g = 0.3 + 0.7 * (u / 0.25);
    ctx.save(); ctx.translate(247, 244); ctx.scale(g, g);
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.bezierCurveTo(7, 0, 5.5, 6, 0, 8);
    ctx.bezierCurveTo(-5.5, 6, -7, 0, 0, -10);
    ctx.fill(); ctx.restore();
  } else if (u < 0.8) {
    var v = (u - 0.25) / 0.55;
    var yy = 248 + v * v * 298;
    ctx.beginPath();
    ctx.moveTo(247, yy - 10);
    ctx.bezierCurveTo(254, yy, 252.5, yy + 6, 247, yy + 8);
    ctx.bezierCurveTo(241.5, yy + 6, 240, yy, 247, yy - 10);
    ctx.fill();
  } else {
    var w = (u - 0.8) / 0.2;
    ctx.save();
    ctx.globalAlpha = (1 - w) * 0.8;
    ctx.strokeStyle = FOX; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(247, 548, 7 * (1 + w * 2.4), 2.7 * (1 + w), 0, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}
function drawShore() {
  // far shore: river-blue band with an indigo bush silhouette along its top
  ctx.fillStyle = RIVER;
  ctx.fillRect(-80, 498, WORLD_W + 160, 54);
  ctx.fillStyle = INDIGO;
  // continuous treeline silhouette, bumps give it an irregular top edge
  ctx.fillRect(-80, 470, WORLD_W + 160, 44);
  var i;
  for (i = 0; i < shoreBumps.length; i++) {
    ctx.beginPath(); ctx.arc(shoreBumps[i].x, 506, shoreBumps[i].rad, 0, TAU); ctx.fill();
  }
  // mound the distant fire sits on
  ctx.beginPath(); ctx.ellipse(1352, 550, 122, 22, 0, 0, TAU); ctx.fill();
  // horizon glint
  ctx.save();
  ctx.globalAlpha = 0.35; ctx.strokeStyle = TEAR; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-80, 551); ctx.lineTo(WORLD_W + 80, 551); ctx.stroke();
  ctx.restore();
}
function drawFlames(phase) {
  // the polite distant fire behind the fox: layered tongues, gentle flicker
  var defs = [
    { cx: 1398, w: 52, h: 128 },
    { cx: 1438, w: 64, h: 176 },
    { cx: 1476, w: 48, h: 142 },
    { cx: 1510, w: 40, h: 106 }
  ];
  var i, d, hf, lean;
  ctx.save();
  ctx.translate(-110, 0);
  for (i = 0; i < defs.length; i++) {
    d = defs[i];
    hf = d.h * (1 + 0.07 * Math.sin(TAU * phase * 8 / LOOP + i * 1.7));
    lean = 6 * Math.sin(TAU * phase / 3 + i * 1.3);
    ctx.fillStyle = FLAME;
    flameTongue(d.cx, 550, d.w, hf, lean); ctx.fill();
    ctx.fillStyle = FOX;
    flameTongue(d.cx, 550, d.w * 0.55, hf * 0.6, lean * 0.6); ctx.fill();
  }
  ctx.restore();
}
function drawRiver(phase) {
  ctx.fillStyle = RIVER;
  ctx.fillRect(-80, 548, WORLD_W + 160, 532);
  // moonlight shimmer
  ctx.strokeStyle = CREAM; ctx.lineCap = "round";
  var i, s;
  for (i = 0; i < shimmer.length; i++) {
    s = shimmer[i];
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.lineWidth = 3.5;
    var off = Math.sin(TAU * phase / LOOP + s.p) * 7;
    ctx.beginPath(); ctx.moveTo(s.x + off, s.y); ctx.lineTo(s.x + off + s.len, s.y); ctx.stroke();
    ctx.restore();
  }
  // ripple bands run under the figures; each figure adds its own waterline rings
  drawRippleBands(phase);
}
function drawRippleBands(phase) {
  var i, b, x, y;
  for (i = 0; i < ripples.length; i++) {
    b = ripples[i];
    ctx.save();
    ctx.globalAlpha = b.a;
    ctx.strokeStyle = b.col;
    ctx.lineWidth = b.lw;
    ctx.beginPath();
    for (x = -40; x <= WORLD_W + 40; x += 34) {
      y = b.baseY + Math.sin(x * b.k + b.p + TAU * phase * b.m / LOOP) * b.amp;
      if (x === -40) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }
}

// ---------- the weepers ----------
function drawWoman(phase) {
  var cx = 415;
  // hair (back): short white bob, moon-cream
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(cx, 432, 59, 65, 0, 0, TAU); ctx.fill();
  // neck + shoulders, meeting the water at y 616
  ctx.fillStyle = SKIN;
  ctx.fillRect(cx - 15, 484, 30, 46);
  ctx.beginPath();
  ctx.moveTo(cx - 63, 616);
  ctx.bezierCurveTo(cx - 55, 560, cx - 37, 530, cx - 17, 516);
  ctx.lineTo(cx + 17, 516);
  ctx.bezierCurveTo(cx + 37, 530, cx + 55, 560, cx + 63, 616);
  ctx.closePath(); ctx.fill();
  // face
  ctx.beginPath(); ctx.ellipse(cx, 452, 44, 52, 0, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(cx, 408, 46, 20, 0, 0, TAU); ctx.fill();
  // hoop earrings
  ctx.strokeStyle = CREAM; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(cx - 53, 494, 10, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 53, 494, 10, 0, TAU); ctx.stroke();
  // features: sad brows, closed eyes, small frown
  ctx.strokeStyle = INDIGO; ctx.lineWidth = 3.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - 29, 428); ctx.lineTo(cx - 13, 420); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 29, 428); ctx.lineTo(cx + 13, 420); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 29, 446); ctx.quadraticCurveTo(cx - 17, 455, cx - 5, 446); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 5, 446); ctx.quadraticCurveTo(cx + 17, 455, cx + 29, 446); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, 458); ctx.lineTo(cx - 4, 472); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 12, 494); ctx.quadraticCurveTo(cx, 486, cx + 12, 494); ctx.stroke();
  // tears: streaks on the cheeks, drops falling to the water
  tearStreak(cx - 22, 452, 516, 0.45);
  tearStreak(cx + 22, 452, 516, 0.45);
  tearFall(phase, cx - 22, 458, 148, 2, 0, 6);
  tearFall(phase, cx + 22, 458, 148, 2, 1, 6);
  // waterline
  rippleRing(cx, 608, 96, 14, 0.5);
  rippleRing(cx, 610, 124, 18, 0.22);
}
function drawCrocodile(phase) {
  ctx.fillStyle = CROC;
  // body + tail
  ctx.beginPath();
  ctx.moveTo(588, 608);
  ctx.lineTo(700, 594);
  ctx.quadraticCurveTo(800, 584, 880, 594);
  ctx.quadraticCurveTo(930, 600, 948, 614);
  ctx.quadraticCurveTo(880, 628, 760, 630);
  ctx.lineTo(610, 626);
  ctx.quadraticCurveTo(588, 620, 588, 608);
  ctx.closePath(); ctx.fill();
  // back scutes
  var x;
  for (x = 716; x <= 872; x += 26) {
    ctx.beginPath();
    ctx.moveTo(x, 594); ctx.lineTo(x + 13, 577); ctx.lineTo(x + 26, 594);
    ctx.closePath(); ctx.fill();
  }
  // eye bumps + pupils
  ctx.beginPath(); ctx.arc(646, 588, 12, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(688, 586, 12, 0, TAU); ctx.fill();
  ctx.fillStyle = INDIGO;
  ctx.beginPath(); ctx.arc(646, 586, 3.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(688, 584, 3.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(600, 601, 2.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(600, 613, 2.2, 0, TAU); ctx.fill();
  // jaw line + small teeth
  ctx.save();
  ctx.globalAlpha = 0.55; ctx.strokeStyle = INDIGO; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(592, 616); ctx.quadraticCurveTo(650, 622, 706, 612); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = CREAM;
  var tx;
  for (tx = 622; tx <= 670; tx += 24) {
    ctx.beginPath();
    ctx.moveTo(tx, 615); ctx.lineTo(tx + 7, 616); ctx.lineTo(tx + 3.5, 624);
    ctx.closePath(); ctx.fill();
  }
  // front foot
  ctx.fillStyle = CROC;
  ctx.beginPath(); ctx.ellipse(742, 628, 16, 7, 0, 0, TAU); ctx.fill();
  // tears off the eye bumps, short falls to the water
  tearFall(phase, 646, 594, 36, 3, 0.4, 5);
  tearFall(phase, 688, 592, 38, 3, 1.9, 5);
  // surface lines along the body
  ctx.save();
  ctx.globalAlpha = 0.3; ctx.strokeStyle = TEAR; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(620, 638); ctx.lineTo(700, 638); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(770, 640); ctx.lineTo(856, 640); ctx.stroke();
  ctx.restore();
}
function drawSnake(phase) {
  // body: seeded-free parametric S-curve of overlapping discs, base at (985, 664)
  ctx.fillStyle = CROC;
  var t, x, y, rad;
  for (t = 0; t <= 1.0001; t += 0.05) {
    x = 985 + Math.sin(t * 2.4) * 34 * (1 - t * 0.35);
    y = 664 - t * 196;
    rad = 21 - t * 10;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
  }
  // head at the top of the curve, facing left
  ctx.save();
  ctx.translate(1000, 458); ctx.rotate(-0.2);
  ctx.beginPath(); ctx.ellipse(0, 0, 21, 16, 0, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.fillStyle = INDIGO;
  ctx.beginPath(); ctx.arc(993, 452, 3, 0, TAU); ctx.fill();
  // tongue, flicking on a 2 second cycle
  if (frac(phase / 2) < 0.45) {
    ctx.strokeStyle = FOX; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(982, 462); ctx.lineTo(966, 468);
    ctx.moveTo(966, 468); ctx.lineTo(959, 461);
    ctx.moveTo(966, 468); ctx.lineTo(960, 476);
    ctx.stroke();
  }
  tearFall(phase, 992, 458, 200, 4, 2.2, 5.5);
  rippleRing(985, 666, 58, 10, 0.4);
}
function drawBat(phase) {
  // branch and bat are river blue: the palette has no black, and indigo
  // on the indigo sky would vanish (see process.md deviations)
  ctx.strokeStyle = RIVER; ctx.lineCap = "round";
  ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(988, 24); ctx.quadraticCurveTo(1110, 66, 1236, 54); ctx.stroke();
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(1166, 52); ctx.lineTo(1196, 16); ctx.stroke();
  // the bat, swaying as a pendulum from its grip at (1105, 90)
  var sway = 0.10 * Math.sin(TAU * phase / 6 + 0.7);
  ctx.save();
  ctx.translate(1105, 90);
  ctx.rotate(sway);
  // feet gripping
  ctx.strokeStyle = RIVER; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-4, 26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(4, 26); ctx.stroke();
  // body: folded-wing bell
  ctx.fillStyle = RIVER;
  ctx.beginPath(); ctx.ellipse(0, 100, 34, 62, 0, 0, TAU); ctx.fill();
  // wing-fold lines
  ctx.save();
  ctx.globalAlpha = 0.7; ctx.strokeStyle = INDIGO; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-16, 52); ctx.quadraticCurveTo(-22, 100, -12, 148); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16, 52); ctx.quadraticCurveTo(22, 100, 12, 148); ctx.stroke();
  ctx.restore();
  // the pink heart, held against the belly
  ctx.fillStyle = HEART;
  heartPath(0, 96, 46, 42); ctx.fill();
  // head at the bottom, ears pointing down
  ctx.fillStyle = RIVER;
  ctx.beginPath(); ctx.arc(0, 172, 20, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-13, 186); ctx.lineTo(-21, 209); ctx.lineTo(-4, 193); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13, 186); ctx.lineTo(21, 209); ctx.lineTo(4, 193); ctx.closePath(); ctx.fill();
  // eyes
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.arc(-8, 168, 2.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(8, 168, 2.6, 0, TAU); ctx.fill();
  // tears fall from the upside-down face, in sway space
  tearFall(phase, -8, 178, 268, 3, 0, 5);
  tearFall(phase, 8, 178, 268, 3, 1.5, 5);
  ctx.restore();
}
function drawFox(phase) {
  ctx.save();
  ctx.translate(-65, 0);   // whole fox group shifted left so it fits the first frame
  // bushy tail rising behind the body, cream tip
  ctx.fillStyle = FOX;
  ctx.beginPath();
  ctx.moveTo(1368, 618);
  ctx.bezierCurveTo(1420, 600, 1446, 556, 1436, 506);
  ctx.bezierCurveTo(1448, 540, 1452, 580, 1444, 624);
  ctx.bezierCurveTo(1426, 646, 1392, 640, 1368, 618);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = CREAM;
  ctx.beginPath();
  ctx.moveTo(1436, 506);
  ctx.bezierCurveTo(1444, 534, 1448, 556, 1446, 578);
  ctx.bezierCurveTo(1436, 560, 1430, 532, 1436, 506);
  ctx.closePath(); ctx.fill();
  // legs wading
  ctx.strokeStyle = FOX; ctx.lineWidth = 13; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(1252, 640); ctx.lineTo(1248, 690); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1352, 642); ctx.lineTo(1358, 690); ctx.stroke();
  // body
  ctx.fillStyle = FOX;
  ctx.beginPath(); ctx.ellipse(1305, 614, 84, 45, 0, 0, TAU); ctx.fill();
  // cream chest
  ctx.save();
  ctx.globalAlpha = 0.9; ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(1268, 592, 20, 30, 0.3, 0, TAU); ctx.fill();
  ctx.restore();
  // head
  ctx.fillStyle = FOX;
  ctx.beginPath(); ctx.moveTo(1222, 488); ctx.lineTo(1212, 448); ctx.lineTo(1242, 476); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1268, 484); ctx.lineTo(1286, 448); ctx.lineTo(1288, 482); ctx.closePath(); ctx.fill();
  ctx.fillStyle = INDIGO;
  ctx.beginPath(); ctx.moveTo(1223, 480); ctx.lineTo(1219, 460); ctx.lineTo(1234, 474); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1271, 477); ctx.lineTo(1281, 459); ctx.lineTo(1283, 478); ctx.closePath(); ctx.fill();
  ctx.fillStyle = FOX;
  ctx.beginPath(); ctx.arc(1246, 520, 41, 0, TAU); ctx.fill();
  // muzzle + nose
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(1218, 540, 23, 15, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = INDIGO;
  ctx.beginPath(); ctx.ellipse(1199, 536, 7, 5.5, 0, 0, TAU); ctx.fill();
  // closed eye + tear
  ctx.strokeStyle = INDIGO; ctx.lineWidth = 3.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(1232, 514); ctx.quadraticCurveTo(1244, 521, 1256, 514); ctx.stroke();
  tearStreak(1242, 524, 580, 0.4);
  tearFall(phase, 1244, 522, 126, 3, 0.9, 5.5);
  // waterlines
  rippleRing(1305, 650, 100, 12, 0.45);
  rippleRing(1248, 692, 26, 6, 0.3);
  rippleRing(1358, 692, 26, 6, 0.3);
  ctx.restore();
}

// ---------- main draw ----------
function draw(phase) {
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // page ground = night indigo
  ctx.fillStyle = INDIGO;
  ctx.fillRect(0, 0, W, H);

  var S = stageScale();
  var oy = (H - 1000 * S) / 2;

  // ease the pan toward its target (drag only; rests at 0)
  pan += (panT - pan) * 0.1;
  var ep = clampPan(pan);

  ctx.save();
  ctx.translate(0, oy);
  ctx.scale(S, S);
  ctx.translate(-ep, 0);

  drawSky();
  drawMoon(phase);
  drawShore();
  drawFlames(phase);
  drawRiver(phase);
  drawWoman(phase);
  drawCrocodile(phase);
  drawSnake(phase);
  drawBat(phase);
  drawFox(phase);

  ctx.restore();

  // tiny hint (drag is the only interaction)
  ctx.fillStyle = CREAM;
  ctx.globalAlpha = 0.55;
  ctx.font = "13px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText("drag", W - 14, H - 12);
  ctx.globalAlpha = 1;
}

// ---------- run ----------
// synchronous, deterministic first frame (fixed phase, pan at rest)
resize();

if (typeof requestAnimationFrame === "function") {
  startStamp = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  var loop = function () {
    draw(currentPhase());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
